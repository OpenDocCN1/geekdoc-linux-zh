  \ 获取优质在线 Dummies 内容。\n\n## 摘要\n\n- 第 1 章：准备 Linux Essentials 认证考试\n- 第 2 章：准备由 LPI\
  \ 支持的 CompTIA Linux+ 认证考试\n- 第 3 章：其他 Linux 认证\n\n# 第 1 章：准备 Linux Essentials 认证考试\n\
  \n## 本章内容\n\n![arrow](img/arrow.png) **考试概述**\n\n![arrow](img/arrow.png) **查看每个领域的详细信息**\n\
  \n正如你通过教育机构可以获得多个层次的学位（学士、学士、硕士、博士）一样，也有许多层次的认证可用。本书主要针对 CompTIA 的 Linux+ 认证以及被称为\
  \ Linux Essentials 的 LX101 和 LX102。\n\n## Linux Essentials 概述\n\nLinux Essentials\
  \ 证书由 Linux 专业协会 (LPI) 创建，旨在吸引学术界。参加 Linux 课程的学生可能还没有通过考试所需的所有主题。截至本文，该计划已在欧洲、中东和非洲上线，并计划在未来推广其他地区。\n\
  \n![remember.eps](img/remember_fmt.png) Linux Essentials 是一个成就证书，其级别低于 Level 1 认证（子集）。\n\
  \n考试共有五个领域（称为主题）；表 1-1 列出了这些领域以及每个领域的权重。\n\n### 表 1-1  考试领域\n\n| 主题 | 权重 |\n| :---\
  \ | :--- |\n| Linux 社区与开源职业 | 7 |\n| Linux 系统导航 | 8 |\n| 命令行行的力量 | 10 |\n| Linux\
  \ 操作系统 | 8 |\n| 安全与文件权限 | 7 |\n\n接下来的章节将详细介绍这些每个主题。\n\n## Linux 社区与开源职业\n\n表 1-2\
  \ 显示了该主题的子主题、权重、描述和知识领域。\n\n![3102](img/9781118844359-tbl3102_fmt.png)\n\n为了充分应对这些主题，请关注以下文件、术语和工具：Android;\
  \ Apache; Audacity; Blender; BSD; C; CentOS; Creative Commons; Debian; DHCP; DNS;\
  \ Firefox; FLOSS; FOSS; Gimp; GPR; ImageMagick; LibreOffice; MySQL; NFS; OpenLDAP;\
  \ OpenOffice.org; 密码问题; Perl; PHP; Python; Postfix; PostgreSQL; 隐私问题与工具; Samba;\
  \ Shell; 终端与控制台；以及 Thunderbird。\n\n\n\n\n\n此外，请关注以下主题：在演示文和项目中使用常用的开源应用程序；使用浏览器；隐私考量；配置选项；网络搜索以及保存内容。\n\
  \n以下是在学习该领域时需要掌握的十个关键点：\n\n1. `Linux` 是目前为止开发出的（仍在开发中）最广为人知的开源软件。\n2. `shell` 是介于用户和操作系统之间的命令解释器。虽然有很多\
  \ shell 可用，但今天最常用的是 `bash` shell。\n3. 针对各种 `Linux` 发行版，有大量的应用程序和工具可供。其中许多工具也是开源的。\n\
  4. `Apache Software Foundation`（Apache 基金会）根据 `Apache` 许可证分发自由且开源（FOSS）软件。\n5. `Free\
  \ Software Foundation`（`FSF`）支持自由（开源）软件运动以及 `GNU General Public License` 协议下的反向拷贝（copyleft）。`copyleft`\
  \ 允许对软件进行修改，同时确保在生成的衍生品中保留相同的权利。\n6. `Open Source Initiative`（`OSI`）也支持开源软件运动，`GNOME\
  \ Foundation`、`Ubuntu Foundation` 以及许多组织也是如此。\n7. `OpenOffice.org` 曾是一个流行的开源办公生产力套件。`LibreOffice`\
  \ 是 `OpenOffice` 的一个分支，其流行程度已超越了后者。\n8. `Samba` 使 `Linux` 系统能够与基于 Windows 的系统共享文件。\n\
  9. `Thunderbird` 是一种流行的邮件和新闻客户端，最初由 `Mozilla Foundation` 创建。\n10. `Linux` 有多种网络浏览器可用。目前最流行的是\
  \ `Firefox`。\n\n## 使用命令行获取帮助\n\n表 1-3 显示了该主题的子主题、权重、描述和关键知识领域。\n\n![3103](img/9781118844359-tbl3103_fmt.png)\n\
  \n为了充分应对这些主题，请关注以下文件、术语和实用：`&&`；`..` 和 `..`；`/usr/share/doc`；`||`；`apropos`；`cd`；`ls`\
  \ 的常用选项；`cp`；`echo`；`history`；`Home` 和 `~`；`info`；`locate`；`man`；`man pages`；`mkdir`；`mv`；`PATH`\
  \ 环境变量；递归列表；`rm`；`rmdir`；替换；`touch`；`whatis`；`whereis` 以及 `which`。\n\n以下是在学习该领域时需要掌握的十个关键点：\n\
  \n1. 正则表达式——通常被称为 `globbing`——可以与 `Linux` 中提供的 `shells` 配合匹配通配符。在可能的通配符中，星号（`*`）匹配任意数量的字符；问号（`?`）仅匹配一个字符。\n\
  2. `Linux` 是一个区分大小的操作系统。\n3. 文件可以通过在名称前加单点（`.`）来“隐藏”。然而，在路径中，单点（`.`）表示当前目录，双点（`..`）表示父目录。\n\
  4. 绝对路径提供资源的完整路径，而相对路径提供从你当前工作位置的指令。绝对路径的示例是 `/tmp/eadulaney/file`，而相对链接则是 `../file`。\n\
  5. 可以 `cp` 复制文件或使用 `mv` 移动文件。可以使用 `rm` 删除文件，可以使用 `rmdir` 删除（用 `mkdir` 创建的）目录。可以使用\
  \ `rm –r`递归删除。\n6. 切换目录请使用 `cd` 命令。在不带参数使用时，它会将你带到主目录。要查看你当前所在的哪个目录，请使用 `pwd`（当前工作目录）命令。\n\
  7. `ls` 命令有许多选项允许你列出文件。`--a` 选项将列出所有文件（包括隐藏文件）。\n8. 可以通过手册页（通过 `man` 命令访问）和 `info`（显示存储在\
  \ `/user/info` 下的帮助文件）获取帮助。\n9. `whatis` 命令显示某个条目对应哪些手册页，而 `whereis` 显示文件以及所有相关文件（包括任何手册页）的位置。\n\
  10. 许多标准工具允许你输入可执行文件的名称后跟 `--help` 以仅获取关于语法的帮助。\n\n## 命令行的力量\n\n表 1-4 显示了该主题的子主题、权重、描述和关键知识领域。\n\
  \n![3104](img/9781118844359-tbl3104_fmt.png)\n\n为了充分应对这些主题，请关注以下文件、术语和实用：`/bin/sh`；参数；`bash`；`bzip2`；`case`；常用的\
  \ `tar` 选项；`cut`；退出状态；从归档中提取单个文件；`find`；`for` 循环；`grep`；`gzip`；`head`；`if`；`less`；`nano`；部分\
  \ POSIX 基本正则表达式（`[^],^,$`）；部分 POSIX 扩展正则表达式（`+`,`()`|`）；`pico`；`read`；`sort`；`tail`；`tar`；`test`；`unzip`；变量；`vi`；`wc`；`while`；`xargs`\
  \ 以及 `zip`。\n\n以下是在学习该领域时需要掌握的十个关键点：\n\n1. 标准输入（`stdin`）传统上是键盘，标准输出（`stdout`）传统上是显示器。两者都可以通过\
  \ `>`、`>>`、`<` 重定向标准错误（`stderr`）。\n2. 命令可以通过分号（`;`）在命令行组合并独立运行。也可以使用管道（`|`）将一个命令的输出作为另一个命令的输入。\n\
  3. `cut` 命令可以从文件中提取字段并与 `join` 连接。后者提供了更多功能。\n4. `wc` 命令可以统计文件的行数、单词数和字符。\n5. `grep`\
  \ 工具（及其对应的 `egrep` `fgrep`）可查找文件中的字符串。\n6. `find` 命令可以根据任意标准搜索文件/目录。找到这些实体后，可以使用\
  \ `xargs` 命令进行处理。\n7. 你可以使用 `tar` 命令（可以将多个文件合并为一个归档）进行备份。\n8. 除了归档，你还可以使用 `gzip`\
  \ 或 `pack` 压缩文件。要解压缩文件，请使用 `uncompress`、`gunzip` 或 `unpack`。\n9. 变量可以在命令行给出并引用 `$1`、`$2`\
  \ 等，或通过 `read` 命令输入执行文件。\n10. 通过 `test` 或 `if-then` 或循环（`while`、`until` 或 `for`）向脚本添加逻辑。你可以使用\
  \ `exit` 命令退出脚本或使用 `break` 跳出循环。\n\n## Linux 操作系统\n\n表 1-5 显示了该主题的子主题、权重、描述和关键知识领域。\n\
  \n![3105](img/9781118844359-tbl3105_fmt.png)\n\n为了充分应对这些主题，请关注以下文件、术语和实用：桌面配置（GUI\
  \ 与命令行）；`dig`；显示类型；驱动程序；`free`；硬盘和分区；`ifconfig`；`IPv4`；`IPv6`；库；维护周期（测试版与稳定版）；内存地址；主板；`netstat`；光驱；外设；电源；进程和进程表；处理器；系统消息和日志；程序；包和包数据库；`ps`；`resolv.conf`；`route`；`ssh`；系统配置以及\
  \ `top`。\n\n1. 每个命令运行时至少跨一个进程；可以通过 `ps` 或 `top`（动态更新显示）查看进程。\n2. 任务可以在前台或后台运行并在两者之间切换。在前台运行的任务可以通过按下\
  \ Ctrl+Z 挂起。\n3. `IPv4` 使用 32 位地址，每个地址分为四个字节。第一个字节识别地址类别（A、B、C）。该地址可以是公网的也可以是私网的。\n\
  4. `ifconfig` 工具可查看网卡当前的 IP 配置。\n\n\n\n\n\n5. `ping` 实用是一个用于测试连接性的全能工具。它向指定的宿主机发送回显消息，以检查该主机是否可以访问。你可以使用\
  \ `ping` 配合回环地址（`127.0.0.1`）来测试内部配置。\n\n6. `route` 实用显示路由表并允许你对其配置。\n\n7. `netstat`\
  \ 实用显示端口的当前状态——例如开放的、监听的等。\n\n8. 系统日志位于 `/var/log/messages`，这是系统日志守护进程（`syslogd`）写入大多数事件的地方。路由到那里的消息可以使用\
  \ `dmesg` 命令查看。\n\n9. `logrotate` 命令可用于根据 `/etc/syslog.conf` 中的配置自动归档日志文件并执行维护。\n\
  \n10. 你可以使用 `logger` 命令手动向日志文件写入条目。\n\n## 安全与文件权限\n\n表 1-6 显示了此主题的子主题、权重、描述和关键知识领域。\n\
  \n![3106](img/9781118844359-tbl3106_fmt.png)\n\n为了充分应对这些主题，请关注以下文件、术语和实用工具：`/etc`;`/etc/group`;`/etc/passwd`;`/etc/shadow`;`/tmp`;`/var`;`/var/tmp`;`chgrp`;`chmod`;`chown`;`groupadd`;`groupdel`;`groupmod`；硬链接；`id`;`last`;`ls\
  \ –d`;`ls –l`;`ls –s`;`passwd`;`setgid`;`setuid`；粘性位（sticky bit）；`su`;`sudo`;`useradd`;`userdel`;`usermod`;`w`；以及\
  \ `who`。\n\n在学习该领域时，以下是需要掌握的前十项内容：\n\n1. 文件和目录权限可以使用 `chmod` 命令更改（该命令接受数字值和符号值）。\n\
  \n2. 在标准权限上加上 1000 会开启“粘性位”；加上 2000 开启 SGID 权限。加上 4000 开启 SUID 权限。\n\n3. 链接通过 `ln`\
  \ 命令创建。“硬”链接仅仅是一个文件的别名（共享同一个 inode）。`ln –s` 命令创建一个符号链接，符号链接是一个拥有自己 inode 的实际文件。符号链接包含一个指向原始文件的指针，并可以跨文件系统；而硬链接则不能。\n\
  \n4. 可以通过手动编辑配置文件或使用 `useradd` 命令添加用户账户；可以使用 `userdel` 它们。\n\n5. `groupadd` 实用工具可用于创建组，`groupdel`\
  \ 可用于删除组。可以使用 `groupmod` 修改组，可以使用 `newgrp` 命令将用户从一个组切换到另一个组。\n\n6. 密码可以使用 `passwd`\
  \ 命令更改。旧系统将密码存储在 `/etc/passwd` 中；现在密码存储在 `/etc/shadow` 中，那里更安全。\n\n7. 要查看最近登录且可能目前仍在此网络上的用户，你可以使用\
  \ `last` 命令。\n\n8. `su` 命令允许你变成另一个用户（通过退出返回）。如果没有指定其他用户名，则默认为 root 用户，因此 `su` 代表超级用户（super\
  \ user）。\n\n9. 当你想以另一个用户（通常是 root）的身份运行命令而不变成该用户时，请使用 `sudo` 而不是 `su`。\n\n10. `who`\
  \ 命令显示谁在在线；`w` 命令显示结合了用户信息和运行时间的信息。\n\n# 第 2 章\n\n# 为 CompTIA Linux+ 基于 LPI 认证考试做准备\n\
  \n## 本章内容\n\n![arrow](img/arrow.png) 获取 CompTIA Linux+ 考试概述\n\n![arrow](img/arrow.png)\
  \ 深入研究每个领域\n\n上一章考察了 Linux Essentials 考试——LPI 的较低级别认证。该认证应被视为迈向高级考试的跳板。CompTIA 的\
  \ Linux+ 认证考试——由 LPI 的 `LX0-101` 和 `LX0-102` 考试组成——是此类高级测试的理想示例。\n\n在接下来的章节中，我们将提供这两个考试的概述，然后探索每个领域下的主题。\n\
  \n## CompTIA Linux+ 考试概述\n\n该认证的正式名称为“CompTIA Linux+ Powered by LPI”，虽然名字读起来很绕口，但它也是简历中一项有意义的补充。该认证由\
  \ CompTIA 颁发；由 Linux 专业协会（LPI）组成两场考试：`LX0-101` 和 `LX0-102`。因此，在参加考试时，候选人可以选择将考试分数转发给\
  \ LPI——同时获得第 1 认证（LPIC-1）。\n\n![tip.eps](img/tip_fmt.png) 记录由 LPI 和 CompTIA 分别维护。如果你选择不转发分数，你可以拥有\
  \ Linux+ 认证但不是 LPIC-1 认证。\n\n两场考试中的每一场都包含 60 道题，必须在 90 分内回答。及格分是 200 到 800 分中的 500\
  \ 分，强烈建议（但不是必须）候选人具有 12 个月的 Linux 管理经验。\n\n其中一场考试有四个领域，另一场有六个。表 2-1 显示了各个领域及其权重。\n\
  \n| 考试 | 领域 | 权重 |\n| :--- | :--- | :--- |\n| LX0-101 | 系统架构 | 14% |\n| | 安装与包管理\
  \ | 18% |\n| | GNU 和 Unix 命令 | 43% |\n| LX0-102 | 设备、文件系统 | 25% |\n| | Shell、脚本与数据管理\
  \ | 17% |\n| | 用户界面与桌面 | 8% |\n| | 基础系统服务 | 20% |\n| | 网络基础 | 23% |\n| | 安全 | 15%\
  \ |\n\n接下来的章节将详细介绍这些主题。\n\n## 系统架构\n\n表 2-2 显示了此主题的子主题、权重、描述和关键知识领域。\n\n![3202](img/9781118844359-tbl3202_fmt.png)\n\
  \n为了充分应对这些主题，请关注以下文件、术语和实用工具：`/dev`;`/etc/init.d`;`/etc/inittab`;`/proc`;`/sys`;`/var/log/messages`；BIOS；内核；`lsmod`；`lspci`；`lsusb`；`modprobe`；`shutdown`\
  \ 以及 `telinit`。\n\n在学习该领域时，以下是需要掌握的前十项内容：\n\n1. 系统日志位于 `/var/log/messages`，这是系统日志守护进程（`syslogd`）写入大多数事件的地方。路由到那里的消息可以使用\
  \ `dmesg` 命令查看。\n\n2. `init` 守护进程负责维护指定运行级别的守护进程。系统启动时尝试进入 `/etc/inittab` 中指定的运行级别。\n\
  \n3. 运行级别可以使用 `init` 和 `shutdown` 命令更改。\n\n4. 定义的标准运行级别：0（关机）、1（单用户模式）、2（无 NFS 多用户）、3（带\
  \ NFS 多用户）、5（X 环境）、6（重启）。\n\n5. `lsmod` 命令用于列出加载的模块；`insmod` 命令用于安装模块；`rmmod` 命令用于从系统中移除模块；`modinfo`\
  \ 命令将显示模块的信息。\n\n6. `modprobe` 实用工具可以探测并安装模块及其依赖项，而 `depmod` 实用工具将确定并显示任何存在的模块依赖。\n\
  \n7. 内核软件通常命名为 `linux-*x*.*y*.*z`，其中 *x.y.z* 代表版本号。\n\n8. `make config` 命令执行一个命令行视图并允许你与内核构建进行交互式响应。\n\
  \n## 安装与包管理\n\n表 2-3 显示了此主题的子主题、权重、描述和关键知识领域。\n\n\n\n\n\n为了充分地解决这些主题，请关注以下文件、术语和工具：`/(root)`\
  \ 文件系统、`/boot/grub/menu.lst`、`/etc/apt/sources.list`、`/etc/ld.so.conf`、`/etc/yum.conf`、`/etc/yum.repos.d/`、`/home`\
  \ 文件系统、`/var` 文件系统、`apt-cache`、`apt-get`、`aptitude`、`dpkg`、`dpkg-reconfigure`、`grub-install`、`LD_LIBRARY_PATH`、`ldconfig`、`ldd`、`MBR`、挂载点、分区、rpm、`rpm2cpio`、超级块、交换空间、yum、`yumdownloader`。\n\
  \n在学习该领域时，需要掌握的前十大项：\n\n1. `ldd` 命令用于查看程序依赖哪些共享库。\n2. `ldconfig` 命令用于更新和维护共享库数据的缓存。你可以使用命令\
  \ `ldconfig –p` 查看当前缓存。\n3. 流行的包管理器包括红帽的包管理器 (`rpm`) 和 Debian 的 (`dpkg`)。两者的目的都是简化软件操作。\n\
  4. `rpm` 可用的选项包括 `-i`（安装包）、`-e`（删除包）、`-q`（查询哪些包属于哪些文件）、`-b`（构建包）以及 `-p`（打印/显示信息）。\n\
  5. 使用 `dpkg` 时，可以使用 `dselect` 命令使用图形界面。你还可以使用命令行选项，包括 `-i`（安装包）、`-l`（列出包信息）、`-r`（删除包）和\
  \ `-c`（列出包中的所有文件）。\n6. Advanced 软件包 (`apt`) 被设计为 `dpkg` 的前端，但现在同时支持 `.deb` 和 `.rpm`\
  \ 包。\n7. Yellow dog Updater, Modified 更常被称为 `Yum`，可以在命令行用于下载 RPM 包。\n8. `superblock`（超级块）包含有关文件系统类型、大小、状态和元数据的信息。\n\
  9. `GRUB` 引导程序（GNU 统一引导加载程序的缩写）允许在同一台机器上存在多个操作系统，并允许用户在启动时选择要启动哪一个。最新版本是 `GRUB 2`。\n\
  10. Linux 同时使用 `swap partition`（交换分区）和 `swap file`（交换文件）作为交换空间。可以使用 `swapon` 命令切换指定交换空间的开启。可以使用\
  \ `mkswap` 创建交换空间。\n\n# GNU 和 Unix 命令\n\n表 2-4 显示了此主题的子主题、权重、描述和关键知识领域。\n\n![3204](img/9781118844359-tbl3204_fmt.png)\n\
  ![3204a](img/9781118844359-tbl3204a_fmt.png)\n\n为了充分地解决这些主题，请关注以下文件、术语和工具：`&`、`.`、`bash`、`bg`、`bzip2`、`cat`、`cp`、`cpio`、`cut`、`dd`、`echo`、`egrep`、`env`、`exec`、`expand`、`export`、`fg`、`fgrep`、`file`、文件通配符、`find`、`fmt`、`free`、`grep`、`gunzip`、`gzip`、`head`、`history`、`jobs`、`join`、`kill`、`killall`、`ls`、`man`、`mkdir`、`mv`、`nice`、`nl`、`nohup`、`od`、`paste`、`pr`、`pwd`、`regex(7)`、`renice`、`rm`、`rmdir`、`sed`、`set`、`sort`、`split`、`tail`、`tee`、`top`、`touch`、`tr`、`uname`、`uniq`、`unset`、`uptime`、`vi`、`wc`、`xargs`。\n\
  \n1. 当每个命令至少跨越一个进程，可以通过 `ps` 或 `top`（持续更新显示）查看进程。\n2. 任务可以在前台或后台运行，并在两者之间移动。在前台运行的任务可以通过\
  \ `Ctrl+Z` 挂起。\n3. 使用 `cp` 复制文件或使用 `mv` 移动文件。可以使用 `rm` 删除文件，可以使用 `rmdir` 删除目录（使用\
  \ `mkdir` 创建的）。可以使用 `rm -r` 进行递归删除。\n4. 更改目录请使用 `cd` 命令。在不带参数使用时，它会将你带到主目录。使用 `pwd`（当前目录）查看你当前所在的目录。\n\
  5. `ls` 命令有很多选项允许你列出文件。`-a` 选项将列出所有（包括隐藏）文件。\n6. `cut` 命令可以从文件中提取字段，可以使用 `paste`\
  \ 或 `join` 将它们合并。后者比前者提供更多功能并可以配合条件使用。\n7. `wc` 命令可以统计文件中行数、单词数和字符数。\n8. `grep`\
  \ 工具（及其对应的 `egrep` 和 `fgrep`）可用于在文件中查找字符串。\n9. `find` 命令可用于搜索系统中符合任何条件的文件/目录。\n\
  10. 当找到匹配项时，可以使用 `xargs` 进行处理。\n\n# 设备、文件系统\n\n表 2-5 显示了此主题的子主题、权重、描述和关键知识领域。\n\n\
  ![3204](img/9781118844359-tbl3204_fmt.png) (注：原文示例中占位符为 3204，此处保持逻辑一致)\n![3204a](img/9781118844359-tbl3204a_fmt.png)\n\
  \n为了充分地解决这些主题，请关注以下文件、术语和工具：`/fstab`、`/etc/conf`、`/media`、`chgrp`、`chmod`、`chown`、`debugfs`、`df`、`du`、`e2`、`edquota`、`ext2/ext4`、`find`、`fsck`、`ln`、`mk2fs`、`mkswap`、`mount`、`quota`、`quotaon`、`reiserfs`、`tune2fs`、`type`、`umask`、`umount`、`updated`、`vfat`、`where`、`which`、`xfs`、`xfs`。\n\
  \n1. 使用 `chmod` 更改文件权限。\n2. `chown` 和 `chgrp` 可更改所有者。\n3. 使用 `du` 命令查看磁盘空间。\n4.\
  \ `df` 命令显示磁盘剩余空间。\n5. 使用 `fsck` 工具可以检查文件系统问题。\n6. 挂载项可以使用 `mount`。\n7. 为了在启动时自动挂载，将条目添加到\
  \ `/fstab`。\n8. 使用 `quota` 命令可以限制磁盘空间。\n9. `mk2fs` 工具可以创建文件系统。\n10. `sed` 是一个流编辑器。\n\
  \n\n\n\n\n6. `/etc/profile` 配置文件在用户每次登录时都会执行。\n\n7. 对于使用 `bash` shell 的用户，shell\
  \ 会首先查找 `.bash_profile`；如果没有找到该文件，它会查找 `.bash_login`。\n\n8. 当 `bash` 用户注销时，shell\
  \ 将查找 `.bash_logout` 并执行其中找到的任何命令。\n\n9. 其他配置文件仅在用户登录或注销时运行，而 `.bashrc` 文件可以在每次运行\
  \ shell 时都执行。\n\n10. Shell 脚本必须具有可执行权限才能运行，或者被 shell 调用（例如：`sh script`）。任何脚本或应用程序的正常退出状态均为\
  \ `0`，其他任何非 0 值均表示非正常退出。\n\n## 用户界面与桌面\n\n表格 2-7 显示了此主题子主题、权重、描述和关键知识领域。\n\n![3207](img/9781118844359-tbl3207_fmt.png)\n\
  \n为了充分应对这些主题，请关注以下文件、术语和工具：`/etc/initab`、`/etc/x11/xorg.conf`、盲显示器、`DISPLAY`、`emacspeak`、`gdm`配置文件、手势、`GOK`、高对比度桌面主题、`kdm`配置文件、大屏桌面主题、`mouse\
  \ keys`、屏幕阅读器、`orca`、屏幕放大镜、屏幕阅读器、慢速/去跳/切换键、粘滞/重复键、`X`、`xdm`配置文件、`xdpyinfo`、`xhost`、`xwininfo`\n\
  \n学习该领域时需要掌握的十项内容：\n\n1. `emacspeak` 语音接口是 Linux 上最流行的语音接口之一。\n\n2. `xdpyinfo` 工具可查看\
  \ `X` 服务器的信息。可以配合 `-all` 选项查看服务器支持的所有扩展信息。\n\n3. 使用 `xwininfo` 工具查看 `X` 的窗口信息。使用\
  \ `-all` 选项可以显示所有可能的信息。\n\n4. `X` 的服务器访问控制程序是 `xhost`。它用于连接跨网络主机并在图形界面内工作。\n\n5.\
  \ `X Display Manager` (`xdm`) 是 `X Window System` 附带的默认显示管理器。\n\n6. `/etc/x11/xorg.conf`\
  \ 文件是用于初始设置的 `X` 配置。\n\n7. 针对 `KDE`（KDE 无障碍项目）和 `GNOME`（GNOME 无障碍项目）开发了多个辅助技术项目。\n\
  \n8. `Orca` 是来自 `GNOME` 项目的屏幕阅读器，旨在帮助盲或或障人士。`Orca` 与 `Firefox`、`Thunderbird`、`OpenOffice.org/LibreOffice`\
  \ 以及其他应用程序配合。\n\n9. `GNOME 屏幕键盘阅读器 (GOK)` 是另一种辅助技术。它与 `XML` 文件配合，并可以动态创建键盘以适应用户需求。\n\
  \n10. `Slow keys`（慢速键）可以配置为仅在按住键时接受输入；这可以防止误触视为输入。`Bounce keys`（去跳键）可以配置为忽略快速的重复按键；`sticky\
  \ keys`（粘滞键）可用于模拟同时按键。\n\n## 管理任务\n\n表格 2-8 显示了此主题子主题、权重、描述和关键知识领域。\n\n![3208](img/9781118844359-tbl3208_fmt.png)\n\
  \n为了充分应对这些主题，请关注以下文件、术语和工具：`/etc/at.allow`、`/etc/at.deny`、`/etc/cron`、`/etc/cron.allow`、`/etc/cron.deny`、`/etc/crontab`、`/etc/group`、`/etc/localtime`、`/etc/passwd`、`/etc/shadow`、`/etc/skel`、`/etc/timezone`、`/usr/bin/locale`、`/usr/share/zoneinfo`、`/var/spool/cron/*`、ASCII、`at`、`atq`、`atrm`、`chage`、`crontab`、`date`、环境变量、`groupadd`、`groupdel`、`groupmod`、`iconv`、`ISO-8859`、`passwd`、`tzconfig`、`tzselect`、Unicode、`useradd`、`userdel`、`usermod`\
  \ 以及 `UTF-8`。\n\n学习该领域时需要掌握的十项内容：\n\n1. 可以通过手动配置文件或使用 `useradd` 命令添加用户（并可以使用 `userdel`\
  \ 删除）。\n\n2. 可以使用 `groupadd` 工具创建组，使用 `groupdel` 删除组。可以使用 `groupmod` 修改组，用户可以使用\
  \ `newgrp` 命令在组之间切换。\n\n3. 若要调度任务在非交互模式下仅运行一次，可以使用 `at` 命令。\n\n4. 使用 `atq` 命令查看计划任务，并在执行前使用\
  \ `atrm` 删除任务。\n\n5. 可以通过创建 `at.allow` 文件并在下方仅列出有效用户名，来限制谁可以使用 `at` 服务 (`atd`)。\n\
  \n6. 你可以创建一个 `at.deny` 文件——而不是 `at.allow`——并在其中放置无法使用该 `at` 服务的用户名（这意味着未列在其中的所有人仍可使用它）。\n\
  \n7. 如果你需要调度按任何定期间隔运行的非交互任务，可以创建一个 `crontab`。\n\n8. `atd` 服务处理 `at` 任务。\n\n9. 可以使用\
  \ `cron.allow` 和 `cron.deny` 文件限制谁可以使用 `cron` 服务。\n\n10. `crontab` 有六个字段：分钟、小时、日期、月份、星期几和命令。\n\
  \n## 系统服务\n\n表格 2-9 显示了此主题子主题、权重、描述和关键知识领域。\n\n![3209](img/9781118844359-tbl3209_fmt.png)\n\
  \n为了充分应对这些主题，请关注以下文件、术语和工具：`/etc/cups`、`/etc/localtime`、`/etc/ntp.conf`、`/etc/timezone`、`/usr/share/zoneinfo`、`~forward`、`exim`、`hwclock`、`klogd`、`lpr`、`lprm`、`lpq`、`mail`、`mailq`、`newaliases`、`ntpd`、`ntpdate`、`postfix`、`syslogd`。\n\
  \n1. 网络时间守护进程 (`ntpd`) 所有服务器的时间。\n\n2. `hwclock` 命令可显示系统时钟（也称为实时时钟）。\n\n3. 时区在 `/etc/timezone`\
  \ 文件中配置。本地时间同样在 `/etc/localtime` 中配置。\n\n4. `sendmail` 服务是一个用于服务器间发送电子邮件的通用程序。\n\
  \n5. `mailq` 命令显示邮件队列列表。\n\n6. `newaliases` 命令构建别名数据库。\n\n7. 可以通过 `.forward` 文件将邮件转发到另一个地址。\n\
  \n8. 线路打印机已不用，但仍然支持。与之相关的工具是 `lpr`（提交打印作业）、`lpq`（查看打印队列）和 `lprm`（删除队列作业）。\n\n9.\
  \ 通用 Unix 打印系统 (`CUPS`) 是 Linux 上最常用的打印接口。它支持线路打印机以及服务器消息块 (SMB)。\n\n10. 内核日志守护进程\
  \ (`klogd`) 记录内核消息。\n\n## 网络基础\n\n表格 2-10 显示了此主题子主题、权重、描述和关键知识领域。\n\n![97811118844359-3210.tif](img/97811118844359-tbl3210_fmt.png)\n\
  \n为了充分应对这些主题，请关注以下文件、术语和工具：`/etc/hostname`、`/etc/hosts`、`/etc/nsswitch.conf`、`/etc/resolv.conf`、`/etc/services`、`dig`、`ftp`、`host`、`hostname`、`ifconfig`、`ifdown`、`ifup`、`netstat`、`ping`、`route`、`telnet`、`tracepath`\
  \ 和 `traceroute`。\n\n1. IPv4 使用 32 位地址，分为四个字节。第一个字节识别地址类别（A、B、C）。地址可以是公有的也可以是私有的。\n\
  \n2. `ifconfig` 工具可查看网卡的当前 IP 配置。\n\n\n\n\n\n3. `ping` 实用程序是一个测试连接性的全能工具。它会向指定主机发送回显消息，以检查是否可以访问。它可以配合回环地址（`127.0.0.1`）来测试内部配置。\n\
  \n4. 人可以使用 `traceroute` 代替 `ping` 来查看到达特定主机所经过的路径。\n\n5. `route` 实用程序将显示路由表并允许你对其配置。\n\
  \n6. `netstat` 实用程序将显示端口的当前状态——开启的、监听等的。\n\n7. 网络主机名称在 `/etc/hostname` 中配置，可以通过\
  \ `hostname` 命令查看。\n\n8. 你可以使用 `telnet` 远程登录到另一个主机，但由于安全性较低，强烈建议不再使用该工具。\n\n9. `Ftp`\
  \ 服务器可从一个主机传输文件到另一个主机。\n\n10. `DNS` 用于将名称解析为地址。配合使用的工具包括 `dig`（用于 DNS 查询）。\n\n##\
  \ 安全\n\n表 2-11 显示了该主题的子主题、权重、描述和关键知识领域。\n\n![9781118844359-3211.tif](img/9781118844359-tbl3211_fmt.png)\n\
  \n为了充分应对这些主题，请关注以下文件、术语和工具：`/etc/hosts.allow`, `/etc/hosts.deny`, `/etc/inetd.conf`,\
  \ `/etc/inetd.d/*`, `/etc/init.d/*`, `/etc/inittab`, `/etc/nologin`, `/etc/passwd`,\
  \ `/etc/shadow`, `/etc/ssh/ssh_host_dsa_key`, `/etc/ssh/ssh_host_rsa_key`, `/etc/ssh/known_hosts`,\
  \ `/etc/sudoers`, `/etc/xinetd.conf`, `/etc/xinetd.d/*`, `~/.gnupg/*`, `~/.ssh/authorized_keys`,\
  \ `~/.ssh/id_dsa`, `~/.ssh/id_rsa`, `chage`, `find`, `gpg`, `id_dsa.pub`, `id_rsa.pub`,\
  \ `lsof`, `netstat`, `nmap`, `passwd`, `ssh`, `ssh_host_dsa_key.pub`, `ssh_host_rsa_key.pub`,\
  \ `ssh-add`, `ssh-agent`, `ssh-keygen`, `su`, `sudo`, `ulimit`, 和 `usermod`。\n\n\
  在学习该领域时，需要了解的前十大项目：\n\n1. 在标准权限上加上 1000 会开启“粘性位”（sticky bit），而 2000 则开启 SGID 权限，4000\
  \ 则开启 SUID 权限。\n\n2. 链接使用 `ln` 命令创建。`硬链接`（hard link）只是文件的别名（共享相同的 inode）。符号链接（symbolic\
  \ link）通过 `ln –s` 创建，是一个拥有自己 inode 的实际文件。符号链接包含指向原始文件的指针，并且可以跨文件系统（而硬链接不能）。\n\n\
  3. 密码使用 `passwd` 命令更改。虽然旧系统将密码存储在 `/etc/passwd` 中，但现在存储在 `/etc/shadow` 中，那里更安全。\n\
  \n4. 要查看最近登录且可能目前仍处于登录状态的用户可以使用 `last` 命令。\n\n5. `su` 命令允许你变成另一个用户（通过退出返回）。如果没有指定其他用户名，则默认为\
  \ root 用户，因此 `su` 代表 superuser（超级）。\n\n6. 如果要以另一个用户（通常是 root）的身份运行命令而不是变成该用户，应该使用\
  \ `sudo` 而不是 `su`。\n\n7. `who` 命令显示谁正在在线；`w` 命令显示结合了登录用户和系统运行时间的信息。\n\n8. 你可以通过使用\
  \ `hosts.allow` 文件（仅允许特定列出的主机连接）或 `hosts.deny` 文件（仅禁止特定列出的主机连接）来限制哪些主机可以远程连接。\n\n\
  9. `ulimit` 实用程序可以显示 Linux 中允许的打开文件数量的限制。你也可以使用相同的命令更改该值。\n\n10. `usermod` 命令更改用户的属性并修改用户账户。\n\
  \n# 第 3 章\n\n# 其他 Linux 认证\n\n## 本章内容\n\n![arrow](img/arrow.png) 厂商中立认证概述\n\n![arrow](img/arrow.png)\
  \ 厂商特定认证概述\n\n前面的章节查看了 Linux Essentials 考试——LPI 的低级别认证——然后查看了较高的入门级 CompTIA Linux+\
  \ 认证（由 LPI LX0-101 和 LX0-102 考试组成）。尽管这些考试很重要，但它们远不是唯一的可用 Linux 认证。\n\n在接下来的章节中，我们将首先查看其他厂商中立认证，然后概述一些更受欢迎的厂商特定\
  \ Linux 认证。\n\n## 厂商中立认证\n\n正如 CompTIA Linux+ Powered by LPI 认证是基础知识的极佳入门级认证，CompTIA\
  \ 的大多数其他认证也是如此。他们唯一针对特定操作系统的认证是 Linux+，但他们还提供如 A+（硬件）、Network+（计算机网络）、Security+（安全）等其他认证。\n\
  \nLPI 还提供了许多认证。LPIC-1 是基础级。LPIC-2 需要通过两门考试（如 201 和 202），专注于网络配置、存储和安全。LPIC-3 是高级级，针对特定领域，如虚拟化和高可用性。\n\
  \n## 厂商特定认证\n\n许多供应商提供了针对其特定 Linux 发行版的认证。本节将讨论最流行的三个。\n\n最受认可的是来自 Red Hat。在入门级别，该公司提供红帽认证系统管理员（RHCSA）。更高级的红帽认证工程师（RHCE）基于\
  \ RHCSA，而顶级认证是红帽架构师（RHCA）。\n\nNovell/SUSE 认证分为四个级别：SUSE 认证管理员（CLA）、SUSE 桌面管理员、SUSE\
  \ 专业人员（CLP）以及 SUSE 工程师（CLE）。大多数认证都是相互的——CLA 通过另一个考试进入 CLP，然后是 CLE。\n\nOracle（现已收购\
  \ Sun Systems）提供 Oracle 认证关联 (OCA) 和 Oracle 认证专家 (OCP)，以及认证专家 (CS)。\n\n# 关于作者\n\n\
  **Emmett Dulaney** 是多本操作系统和认证书籍的作者，也是安德森大学的副教授。他撰写的的其他书籍包括《CompTIA A+ Complete Study\
  \ Guide》（Sybex）和 CompTIA 《Security+ Study Guide》（Sybex）。\n\nmett 是《认证杂志》和《校园科技》的专栏作家，也是许多其他杂志的贡献者。\n\
