  - 471. 421\n- 472. 422\n\n\n\n\n\n# 引言\n\n当你考虑到 Linux 的起源以及它的持续演进时，你会发现它确实是惊叹的。Linux\
  \ 从一个人的爱好——芬兰的 `Linus Torvalds` 的微小起步，如今已经成长为一个功能的操作系统，其功能可以与任何商业 Unix 操作系统相媲。更棒的是，Linux\
  \ 及其所有的源代码都对任何人免费开放。你只需要从某个网站下载它，或者从许多 Linux CD 销售商处以低廉的费用通过 CD 或 DVD 获取即可。\n\n\
  Linux 无疑是“一一分钱一分货”这一准则的例外。尽管 Linux 是免费的，但在性能、功能和可靠性方面，它绝不逊色。Linux 的健壮性与其开发和更新的方式有关。全球各地的开发者协作着添加新功能。\n\
  \n## 关于本书\n\n《傻瓜包 Linux 全集》（*Linux All-in-One For Dummies*）在了一书中为你提供了八本快速参考指南。这些微型书籍共同提供了关于安装、配置和使用的详细信息。\n\
  \n你最喜欢这本书的一点是，你不需要按顺序读完它。如果你正开始使用 Linux，你需要的是一份实用的指南，它不仅能让你上手，还能教你如何操作。\n\n以下是你通过本书可以做的事情：\n\
  \n* 使用书中提供的信息安装和配置 Linux — `Debian`、`Fedora`、`openSUSE`、`Ubuntu` 或 `Xandros`。\n\
  * 通过 DSL 或电缆调制解调器连接 Linux PC。\n* 为你的现有网络添加无线以太网。\n* 获取针对特定用途的技巧、技术和快捷方法，例如：\n  \
  \  * 设置和使用 Internet 服务\n    * 使用 `Samba` 设置 Windows 服务器\n    * Shell 编程\n* 理解系统和网络安全的基础知识。\n\
  * 执行系统管理任务。\n\n我在书中使用了一种简单的标记风格。所有的列表、文件名、函数名、变量名和关键字均采用等宽字体排版，以便阅读。我会在新术语和概念首次出现时使用*斜体*，并直接在此提供定义。我用**粗体**显示输入的类型命令。命令的输出和任何文件列出均以等宽字体显示。\n\
  \n当你对操作系统足够熟悉并考虑参加认证考试后，认证目标对应的图标将至关重要。它们将引导你关注 `LX0-101` 和 `LX0-102` 考试中测试的关键概念主题（你必须通过这两项考试才能获得\
  \ Linux Professional Institute 的认证）。\n\n你可以安全地忽略“技术细节”（Technical Stuff）图标旁边的文本以及侧边栏中的文本。但是，如果你是那种喜欢了解\
  \ Linux 工作原理某些隐藏细节的人，那么请务必深入研究“技术细节”图标和侧边栏。\n\n\n\n\n\n如果你是 Linux 初手，在阅读时可以忽略那些认证目标图标。只有当你对该操作系统游刃有余，并考虑通过参加\
  \ LPI 考试来验证你的技能时，才需要回到这本书并寻找这些图标。\n\n## 愚蠢的假设\n\n我假设你对 PC 很熟悉 —— 你知道如何开关机，并且接触过\
  \ Windows。（考虑到大多数新 PC 都预装了 Windows，这个假设应该是是安全的，对吧？）而且，我假设你知道如何使用某些 Windows 应用程序，例如\
  \ Microsoft Office。\n\n在你的 PC 上安装 Linux 时，你可能想保留原有的 Windows 安装。我假设你不介意缩小 Windows\
  \ 分区为 Linux 腾出空间。对于此操作，你可以购买一个好磁盘分区工具，或者使用大多数 Linux 发行版自带的分区工具之一。\n\n我还假设你愿意接受这种风险，即在你尝试安装\
  \ Linux 时，某些功能可能无法正常工作。如果你有一些不常见的硬件，可能会出现问题。如果你担心弄坏系统，可以尝试找一台稍微旧的备用奔腾 PC 把它“牺牲掉”，然后在那台\
  \ PC 上安装 Linux。\n\n*《傻傻指南：Linux 全能参考手册》（*Linux All-in-One Desk Reference For Dummies*）包含八本小书，每本都聚焦于一组相关的主题。如果你正在寻找特定主题的信息，请查看书脊上的小书名称或咨询目录。\n\
  \n## 本书使用的图标\n\n遵循《傻傻指南》（*All-in-One For Dummies*）系列的悠久传统，我使用图标来帮助你快速定位有用信息。图标包括：\n\
  \n![distributionspecific.eps](img/distributionspecific_fmt.png) **发行版特定**图标指向适用于本书涵盖的特定\
  \ Linux 发行版的信息：Debian、Fedora、Knoppix、SUSE、Ubuntu 和 Xandros。\n\n![remember.eps](img/remember_fmt.png)\
  \ **记住**图标标记了一个通用的、有趣的事实 —— 即你在操作 Linux 时想要知道并记住的内容。你可能会发现一些在晚上晚间聚会上值得谈论的趣味轶闻。\n\
  \n![tip.eps](img/tip_fmt.png) 当你看到**提示**（Tip）图标时，你将读到一些可以让你你的工作更轻松的方法。在你读完这本书的第一遍很久，你可以翻阅这本书，只寻找这些提示。\n\
  \n![warning.eps](img/warning_fmt.png) 我使用**警告**（Warning）图标来突出潜在的陷阱。通过这个图标，我是在告诉你：“小心！正在讨论的任何内容都可能损坏你的系统。”俗话说有备无无患，所以我希望这些内容能为你省去一些烦恼。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) **技术细节**（Technical Stuff）图标标记了高级用户（或渴望成为高级用户的人）感兴趣的技术信息。\n\
  \n![lxo-101.eps](img/lxo-101_fmt.png) 当你看到这个图标时，这里涵盖的内容或命令属于 LPI LX0-101 考试。\n\n\
  ![lxo-102.eps](img/lxo-102_fmt.png) 当你看到这个图标时，这里涵盖的内容或命令属于 LPI LX0-102 考试。\n\n##\
  \ 超书籍\n\n这本书并不止于你手中的纸质版。除了这里的内容外，你还可以在 Dummies 网站上发现许多值得关注的内容。其中包括指向其他发行版和相关技术讨论的链接。你可以在\
  \ [www.dummies.com/extras/linuxaio](http://www.dummies.com/extras/linuxaio) 访问。\n\
  \n偶尔，我们会对技术书籍进行更新。如果这本书确实有任何技术更新，将发布在 [www.dummies.com/go/extras/linuxaio](http://www.dummies.com/go/extras/linuxaio)。\n\
  \n## 从这里开始\n\n是时候开始你的 Linux 冒险之旅了。翻到任何章节，让乐趣开始。使用目录和索引来确定你想去哪里。转不觉，你就会成为 Linux 专家！\n\
  \n我希望你喜欢查阅这本书就像我喜欢编写它一样！\n\n## 第一部分\n\n# 入门 Linux\n\n![9781118844359-pp0101.tif](img/9781118844359-pp0101_fmt.png)\n\
  \n![webextras.eps](img/webextras_fmt.png) 访问 [www.dummies.com](http://www.dummies.com)\
  \ 获取优秀的 Dummies 在线内容。\n\n### 内容概览\n\n- 第 1 章：介绍 Linux\n- 第 2 章：安装 Linux\n- 第 3 章：故障排除与配置\
  \ Linux\n- 第 4 章：尝试 Linux\n\n# 第 1 章\n\n# 介绍 Linux\n\n## 本章内容\n\n![arrow](img/arrow.png)\
  \ 解释什么是 Linux\n![arrow](img/arrow.png) Linux 发行版包含什么\n![arrow](img/arrow.png) 发现\
  \ Linux 能帮助你什么\n![arrow](img/arrow.png) 开始学习 Linux\n\n既然你手里拿着这本书，可以肯定你已经听过 Linux\
  \ 了。如果你好奇 Linux 到底是什么、它是否值得考虑以及它能做什么，本章将提供 Linux 的概景图，并告诉你如何立即开始。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 尽管 Linux 可以运行在许多硬件平台上，但本书侧重于 Intel Windows 环境。\n\n## 什么是 Linux？\n\nPC 可以被看作硬件的组合\
  \ —— 你可以接触到的东西，如机箱、显示器、键盘和鼠标。机箱包含了所有最重要的硬件 —— 中央处理器（`CPU`），运行软件的微芯片（任何告诉计算机如何操作的程序），你实际上无法触碰它。在典型的基于奔腾处理器的\
  \ PC 中，奔腾微处理器就是 `CPU`。机箱中的其他重要硬件包括内存（`RAM`）和硬盘。\n\n操作系统是必须与所有硬件交互并让它们协同工作的程序。操作系统软件管理所有硬件并根据你的指令运行其他软件。你作为用户，通过选择菜单、点击图标或输入加密的文本来提供这些指令。Linux\
  \ 是一种操作系统——Unix、Mac OS、Windows 7 或 8、Windows Vista 甚至更早版本的 Windows 也是。Linux 操作系统是模仿\
  \ Unix 设计的；在它最基础、没有任何修饰的形式，Linux 操作系统也称为 `Linux kernel`（Linux 内核）。\n\n操作系统赋予了计算机——任何计算机——个性。例如，你可以在\
  \ PC 上运行 Windows —— 在同一台 PC 上，你也可以安装并运行 Linux。那么，根据任何特定时刻安装和运行的操作系统，同一台 PC 可以作为\
  \ Windows 系统运行，也可以作为 Linux 系统运行。\n\n操作系统的主要任务是从硬盘（或其他永久存储）将软件（计算机程序）加载到内存中，并让 `CPU`\
  \ 运行这些程序。你使用计算机的一切是通过操作系统实现的，所以如果操作系统出现故障，整个系统就会死机。你可能知道，当你最喜欢的操作系统——甚至可能是随 PC 自带的那个——在你正要点击发送按钮时突然罢工，是多么令人恼狂。你慌乱地尝试各种方法，但没有任何反应。这时就需要按下重置键（如果你的电脑建造者不够明智没有重置键，就从机器后面拔掉电源）。幸运的是，这种事情几乎从没有发生在\
  \ Linux 上 —— 它以非常可靠的操作系统而闻名。\n\n\n\n\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 在技术术语中，Linux 是一个`multiuser, multitasking operating system.`。这些术语仅意味着 Linux 允许多个用户登录，并且每个用户都可以同时运行多个一个程序。如今几乎所有的操作系统都是多用户和多任务的，但当\
  \ Linux 在 1993 年开始时，`multiuser`和`multitasking`还是巨大的卖点。\n\n### Linux 发行版\n\n![tip.eps](img/tip_fmt.png)\
  \ 大多数人直接说 `Linux` 来指代特定的 Linux 发行版。\n\n一个`Linux distribution`由 Linux `kernel`（即操作系统）和一组应用程序，以及一个易于使用的安装程序组成。\n\
  \n你会发现许多 Linux 发行版，每个版本都包含标准的 Linux 操作系统和以下主要包：\n\n*   **X Window System：** 它是图形用户界面。\n\
  *   **一个或多个图形桌面：** 最受欢迎的包括 GNOME 和 KDE。\n*   **一系列应用程序：** Linux 程序以即插用软件的形式提供，但同时也包含了`source\
  \ code`（我们人类用来告诉计算机做什么的命令）以及其文档。\n\n当前的 Linux 发行版包含了大量的软件选择——数量之多使得某些发行版通常需要一个或多个\
  \ DVD-ROM。\n\n![tip.eps](img/tip_fmt.png) Linux `kernel`、Linux 发行版中的软件包以及 Linux\
  \ 发行版本身的开发和维护是以`open source`项目的形式组织的。简而言之`open source`意味着可以访问`source code`并有权在不受任何限制的情况下自由分发软件。这个定义比这段简洁的说明要复杂得多。要了解开源的含义以及可以接受的开源许可，你可以访问开源倡议组织网站\
  \ [www.opensource.org](http://www.opensource.org)。\n\n表格 1-1 列出了几个主要的 Linux 发行版以及每个版本的简要描述。但请注意，Linux\
  \ 发行版远比表 1-1 中显示的要。要了解更多关于 Linux 发行版的信息，请访问 [`distrowatch.com`](http://distrowatch.com)。在该网站，你可以阅读特定发行版的介绍，并找到下载或订购特定发行版\
  \ DVD 的链接。\n\n### 表 1-1 主要 Linux 发行版\n\n| 发行版 | 描述 |\n| :--- | :--- |\n| Debian\
  \ GNU/Linux | 这种非商业发行版始于 1993 年，并一直是一个受欢迎的发行版，全球有很多志愿者开发者为该项目做出贡献。Debian 是一个巨大的发行版，安装需要一些时间。在安装了基础\
  \ Debian 系统后，你可以使用名为`apt-get` 的包安装器轻松地安装和升级 Debian 包（`apt` 代表 Advanced Packaging\
  \ Tool）。你可以从 [www.debian.org](http://www.debian.org) 免费获取 Debian。Debian 是其他几个近期发行版的基础，包括\
  \ Knoppix、MEPIS、Ubuntu 和 Xandros。 |\n| Fedora | 该发行版曾被称为 Fedora Core，是 Red Hat Linux（Red\
