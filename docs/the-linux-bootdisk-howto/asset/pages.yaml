    # 4.3.3. /bin and sbin


    /bin directory is a convenient place for extra utilities you need to perform basic
    operations, utilities such as ls, mv cat and dd. See Appendix C for an example
    list of files that go in a /bin/sbin directories. It does not include any of the
    utilities required to restore from backup, such as cpio tar and gzip. That is
    because I place these on a separate utility disk, to save space on the boot/root
    disk. Once the boot/root disk is booted, it is copied to the ramdisk leaving the
    drive free to mount another disk, the utility disk. I usually mount this as /usr.


