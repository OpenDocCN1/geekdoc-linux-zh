- img_proc: true
  md: '# The Linux Bootdisk HOWTO


    Be sure that passwd contains root. If you intend other users to login, be sure
    their home directories and shells exist.


    termcap, the terminal database, is typically several hundred kilobytes. The version
    on your boot/root diskette be pruned to contain only the terminal(s) you use,
    which is usually just the linux or linux-console entry.


    3. The rest. They work at the moment, so I leave them alone.


    Out of this, I really have to configure two files, and what they should contain
    is surprisingly small.


    +   * rc should contain:

    ```bash

    #!/bin/sh

    /bin/mount -av

    /bin/hostname Kangaroo

    ```Be sure it is secure, be sure it has a "#1" line at the top, and be sure any
    absolute filenames are correct. You don''t need to run hostname it just looks
    nicer if you do.

    * fstab should contain:

    ```

    /dev/ram0      ext2 defaults

    /dev/td0       ext2 defaults

    /proc           proc defaults

    ```


    You can copy entries from your existing fstab, but you should not automatically
    any of your hard disk partitions; use the noauto keyword with them. Your hard
    disk may be damaged or dead when the bootdisk is used.


    Your initab should be changed so that sysinit line rc or whatever base script
    will be used. Also, if you want to ensure that users on serial ports login, comment
    out all the entries for getty which has a ttyS0tty device at the end of the line.
    Leave the tty ports so that you can login at the console.


    A minimal initab looks like this:

    ```

    id2:initdefault:

    si:sysinit:/etc/rc

    1:2345:respawn:/sbin/getty 9600 tty1

    2:23:respawn:/sbin/getty 9600 tty2

    ```


    The initab defines what will run in various states in initab; if init cannot find
    the program bootdisk will hang, potentially multi-user mode. Carefully check the
    files mentioned in initab; you may not even get an error message.


    Note that some programs cannot be moved elsewhere because other programs have
    hardcoded locations. For example, on my system, /etc/shutdown has hardcoded in
    /etc/reboot. If you move reboot to /bin/reboot, and then issue a shutdown command,
    it will fail cannot cannot find the reboot file.


    For the rest, just copy all the files in your /etc directory, plus all the executables
    in your /etc directory that you are not sure about. As a guide, the sample listing
    in Appendix C. Probably will suffice to copy only files, but systems differ a
    great deal, so be sure that the same set of files on your system is equivalent
    to the list. The only sure method is to start with initab and work out what is
    required.


    Most systems now use an /etc/rc.d/ directory containing shell scripts for run
    levels. The minimum is a single rc script, but it may be simpler to copy initab
    and the /etc/rc.d directory


