  md: '# 11. Creating bootable CD–ROMs


    > This section was contributed by Rizwan Mohammed Darwe

    (rizwan AT clovertechnologies dot com)


    This section assumes that you are familiar with the process and workings of writing
    CDs in linux. Consider this to be a quick reference to include the ability to
    boot the CD which you will burn. The CD–Writing–HOWTO should give you an in-depth
    reference.


    # 11.1. What is El Torino?


    For the x86 platform, many BIOS have begun to support bootable CDs. The patches
    for mkisofs is based on the standard called "El Torino". Simply put, El Torino
    is a specification that says how cdrom should be formatted that you can directly
    boot from.


    The "El Torino" spec says that any cdrom drive should work (SCSI or EIDE) as long
    as the BIOS supports El Torino. So far this has only been tested with EIDE drives
    because none of the SCSI controllers that has been tested so far appears to support
    El Torino. The motherboard definitely has to support El Torino. How do you know
    if your motherboard supports "El Torino"? Well, the ones that let you choose booting
    from hard disk, Floppy, Network or CDROM.


    # 11.2. How it works


    El Torino standard works by making the CD appear, through BIOS, to be a normal
    floppy drive. This way simply put any floppy image size (exactly 1440k for a 1.42
    meg) somewhere in the ISO filesystem. In the headers of the ISO fs you place a
    pointer to this. The BIOS will then get this image from the CD and for all purposes
    it acts as if you were booting from the floppy drive. This allows for using LILO
    boot disk, for example, simply to be used by.


    Roughly speaking


    # 11.3. How to make it


    Create a file, "boot.img", which is an exact image of the bootable floppy–disk
    which you want to boot via the CD–ROM. This is an 1.44 MB bootable floppy–disk.
    The command will do this


    ```

    dd if=/dev/fd0 of=boot.img ba=10 count=144

    ```


    assuming the floppy is in the A: drive.


    Place this image somewhere in the hierarchy which will be the source for the iso9660
    filesystem. It is a good


    11. Creating bootable CD–ROMs'
