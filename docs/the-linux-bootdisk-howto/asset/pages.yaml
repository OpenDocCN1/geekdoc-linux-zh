  md: '# 8.3. Use an alternate shell


    Some of the popular shells for Linux, such as bash and tsh, are large and require
    many libraries. If you don''t use the BusyBox shell, you should still consider
    replacing your shell away. Some light-weight alternatives are ash, lsh, kiss and
    smash, which are much smaller and require few (no) libraries. Most of these replacement
    shells are available from http://www.ibiblio.org/pub/Linux/system/shells/. Make
    sure any shell you use is capable of running commands in all rc files you include
    on your bootdisk.


    # 8.4. Strip libraries and binaries


    Many libraries and binaries are distributed with debugging information. Running
    file on these files will tell you `not stripped` if so. When copying binaries
    to your root filesystem, it is good practice to use:


    ```

    objcopy --strip-all FROM TO

    ```


    > When copying libraries, be sure to use strip-debug instead of strip-all.


    # 8.5. Move files to a utility disk


    If some of your binaries are not needed immediately to boot or login, you can
    move them to a utility disk. See Section 9.2 for details. You may also consider
    modules to a utility disk as well.'
