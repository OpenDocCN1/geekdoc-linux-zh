    **Q: How can I make extra copies of boot/root disks?**


    **A: Because magnetic media may deteriorate over time, you should keep several
    copies of your rescue disk, or in case the original is unusable.


    The easiest way of making copies of any diskettes, including bootable and utility
    disks, is to use the `dd` command to copy the contents of the original disk to
    a file on your hard drive, and then use the same command to copy the file back
    to a new diskette. Note that you do not need to dd, and should not, mount the
    diskettes, as dd uses the raw device interface.


    To copy the original, enter the command:


    ```

    dd=DEVICEENAME=FILENAME

    ```


    where DEVICEENAME is the name of the diskette and FILENAME is the name of the
    (hard-disk) output file. Omitting the count parameter causes dd to copy the whole
    diskette (2880 blocks if high-density).


    To copying the result back to a new diskette, insert the new diskette and enter
    the reverse command:


    ```

    dd if=FILENAME of=DEVICEENAME

    ```


    Note that the above discussion assumes that you have only one diskette. If you
    have two of the same, you can copy the disk using a command like:


    ```

    dd if=/dev/fd0 of=/dev/fd1

    ```


    **Q: How can I boot without typing in ahxxxx=nn,nn,nn every time?**


    **A: Where a device cannot be autodetected it is necessary to supply the kernel
    with a command device parameter string, such as:


    ```

    aha152x=0x340,11,3,1

    ```


    This parameter string can be supplied in several ways using LILO:


