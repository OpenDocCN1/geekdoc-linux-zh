- img_proc: true
  md: 'idea to put all boot related files in their own directory ("boot/" under the
    root of the iso9660 fs, for example).


    One caveat — Your boot floppy must load any initial ramdisk with LILO, not the
    kernel ramdisk driver! This is because once the kernel starts up, the BIOS emulation
    of the CD as a floppy disk is circumvented and will fail. LILO will load the initial
    ramdisk using BIOS disk cards, so the emulation works as designed.


    The El Torito specification requires a "boot catalog" to be created. This is a
    2048 byte file which is of no interest except it is required. The patchwork done
    by the author of mkisofs will automatically create the boot catalog, you must
    specify where the boot catalog will go in the iso9660 filesystem. It is generally
    a good idea to put it in the boot image as before, and a name like boot.catalog
    seems appropriate.


    So we have our image in the file boot.img, and we are putting it in the directory
    boot/ / under the root of the iso9660 filesystem. We will have the boot catalog
    in the same directory with the boot.catalog. The command to create the iso9660
    fs in a file bootcd.iso is then:


    ```

    mkisofs -r b boot.img -c boot/catalog -o bootcd.iso

    ```


    The -b option specifies the boot image to be used (note the path relative to the
    root of the iso9660 disk), and the -c option is for the boot catalog file. The
    -r option will make appropriate file ownerships and modes (see the mkisofs manual).
    The "." in the end says to take the source from the current directory.


    Now burn the CD with the usual cdrecord command and it is ready to boot.


    # 11.4. Create Win9x Bootable CD–Roms


    The first step is to get the boot image used by the source CD. But you cannot
    simply mount the CD under linux and dd the first 1440k to a floppy disk or to
    a file boot.img. Instead simply boot with the source CD–ROM.


    When you boot the Win98 CD you dropped to A: prompt which is the actual ramdisk.
    And D: or Z: is where all the installables are residing. Using the diskcopy command
    dos copy the A: image into the actual floppy drive which is now B: The command
    will do this to.


    ```

    diskcopy A: B:

    ```


    It works just like dd. You can boot from this newly created disk to test if the
    process is similar to that of the source CD. Then the usual dd of this floppy
    to a file boot.img and then rest is as usual.'
