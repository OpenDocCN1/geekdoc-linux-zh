  md: '# The Linux Bootdisk HOWTO


    +   - By entering into the command line every time the system is booted by LILO.
    This is boring, though.

    - By using LILO''s lock keyword to make it the command line as the default command
    line, so that LILO will use the same options every it boots.

    - By using the append= statement in the LILO config file. Note that the parameter
    string must be enclosed in quotes.


    For example, a sample command line using the above parameter string would be:


    ```

    zImage aha152x=0x340,11,3,1 root=/dev/sda lock

    ```


    This would pass the parameter string through, and also ask the kernel to set the
    root device to /dev/sda save the whole command line and reuse it for all future
    boots.


    A sample APPEND statement is:


    ```

    APPEND = aha152x=0x340,11,3,1

    ```


    Note that the parameter string must not be enclosed in quotes on the command line,
    but it must be enclosed in quotes in the APPEND statement.


    Note also that for the parameter string to be acted on, the kernel must contain
    the driver for that disk type. If it does not, then there is nothing listening
    for the parameter string, and you will have to rebuild the kernel to include the
    required driver. For details on rebuilding the kernel, go to /usr/src/linux and
    read the README, and read the Linux FAQ and Installation HOWTO. Alternatively
    you could obtain a generic kernel for the disk type and install.


    Readers are urged to read the LILO documentation before experimenting with LILO
    installation. Incautious use of the BOOT command can damage partitions.


    Q: At boot time, I get error A: cannot execute B. Why?


    A: There are several cases of program being hardcoded in various utilities. These
    cases do not occur everywhere, but they may explain why an executable apparently
    cannot be found on your system even when you can see it is. You can find out if
    a given program has the name of another hardcoded by using strings command and
    piping the output through grep.


    Known examples of hardcoding are:


    +   - shutdown in some versions has /etc/reboot hardcoded, so reboot must be placed
    in /etc directory.

    - init has caused problems for at least one person, with the kernel being unable
    to init.


    To fix these problems, either move the programs to the correct directory, or change
    configuration files (e.g. initabbab) to point to the correct directory. If doubt,
    put programs in the same directory as they are on your hard disk, and use the
    same initabbab and /etc/rc.d files as they appear on your hard disk.


