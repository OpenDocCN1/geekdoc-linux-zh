    A: See Section 8, above, for the comments by Alain Knaff on this subject. His
    is the most authoritative answer I know of.


    Q: How do I increase the size of my ramdisks?


    A: This probably should be explained in the text, but I''ll put an answer here
    for the time.


    First, do not attempt to use the rdev command to do this, no matter what the documentation
    says. The ramdisk word no longer determines the size of ramdisk.


    Second, in kind ramdisks are actually dynamic; when you set a ramdisk size you''re
    not allocating memory, you''re just setting the limit of how large it can grow.
    Don''t be afraid to set these fairly large (eg, 8 or even 16). The RAM space is
    not actually consumed until you need it. You can set these limits in one of several
    ways.


    +   1. Use the ramdisk_size command. You can enter this manually or via a command
    like append="ramdisk_size=NNN" with LILO.

    2. If you use LILO, you can use a kernel option like ramdisk=8192K in the lilo
    conf file.

    3. Change the kernel configuration option CONFIG_BLK_DEV_RAM_SIZE and recompile
    your kernel.


