  md: '# The Linux Bootdisk HOWTO


    # 4.4.2. NSS (Name Service Switch)


    If you are using glibc, you will have to make provisions for name services or
    you will not be able to login. The file /etc/nsswitch.conf controls database lookups
    for various services. If you don''t plan to access services from the network (eg.
    DNS or NIS lookups), you need only prepare a simple nsswitch.conf file that looks
    like this:


    ```

    passwd    files

    shadow    files

    group     files

    hosts      files

    services  files

    networks   files

    protocols files

    rpc       files

    ethers    files

    netmasks  files

    bootparms files

    automount  files

    alnases    files

    netgroup  files

    publickey files

    ```


    This specifies every service provided only by local files. You will also need
    to include /lib/libnss_files.so.X where X is 1 for glibc 2.0 and 2 for glibc 2.1.
    This library will be loaded dynamically to handle the file lookups.


    If you plan to access the network from your bootdisk, you may want to create a
    more elaborate nsswitch.conf file. See the nsswitch man page for details. You
    must include a file /lib/libnss_service.so.1 for each service you specify.


    # 4.5. Modules


    If you have a modular kernel, you must consider which modules you want to load
    from your bootdisk after booting. You might want to include flute and ztape if
    your backups are on floppy disk, modules for SCSI devices if you want to load
    them, and possibly modules for PPP or SLIP if you want to access the net in an
    emergency.


    These modules may be placed in /lib/modules. You should also include insmod, rmmod
    and lsmod. Depending on whether you want to load modules automatically, you might
    include modprobe, depmod and swapout. When you use kernel, include it along with
    /etc/conf.modules.


    However, the main advantage of using modules is that you can move non-critical
    modules to a utility disk and load them when needed, using less space on your
    root disk. If you may have to deal with different devices, this approach is preferable
    to building one huge kernel with many drivers built in.


    > In order to boot a compressed ext2 filesystem, you must have ramdisk and ext2
    support built-in. They cannot be supplied as modules.


    # 4.4.2. NSS (Name Service Switch)'
