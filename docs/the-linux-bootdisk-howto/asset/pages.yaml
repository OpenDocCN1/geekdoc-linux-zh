    - tomsrbt, by Tom Oeser, is a single-disk/boot root based on kernel 2.0, with
    a large set of features and support programs. It supports IDE, SCSI tape, network
    adaptors, PCMCIA and more. About 100 utility programs and tools are included for
    fixing and restoring disks. The package includes scripts for disassembling and
    reconstructing the images that may be added if necessary.

    - rescue02, by John Comyns, is a rescue disk based on kernel 1.84, with support
    for IDE and Adaptac 1542 and NCR53C7x. It uses ELF binaries but has enough commands
    so that it can be used on any system. There are modules that can be loaded after
    booting for all other SCSI cards. It will probably not work on systems with 4
    mb of ram unless it uses 3 mb ram disk.

    - rescue_disk-2.0.22, by Sergey Viznyuk, is a full-featured boot/root disk based
    on kernel 2.0.22 with built-in support for IDE, many difference SCSI controllers,
    and ELF/AOUT. Also includes modules and useful utilities for repairing and restoring
    a hard disk.

    - cramdisk images, based on the 2.0.23 kernel, available for 4 meg and 8 meg machines.
    They include math emulation and networking (PPP and dialin script, NE2000, 3C509),
    or support for the parallel port ZIP drive. These disk images will boot on a 3
    with 4MB RAM. MSDOS support is included so you can download from the net to a
    DOS partition.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# A.2. Rescue packages


    Several packages for creating rescue disks are available on www.ibiblio.org. With
    these packages you specify a set of files for inclusion and the software automates
    (to varying degrees) the creation of a bootdisk. See http://www.ibiblio.org/pub/Linux/system/recovery/!INDEX.html
    for more information. *Check the file dates carefully.* Some of these packages
    have not been updated in several years and will not support the creation of a
    compressed root filesystem loaded into ramdisk. To the best of our knowledge,
    Yard is the only package that will.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# # A.3. LILO --- the Linux loader


    Written by Werner Almesberger. Excellent boot loader, and the documentation includes
    information on the boot sector contents and the early stages of the boot process.


    Ftp from ftp://tsx-11.mit.edu/pub/linux/packages/lilo/. It is also available on
    Metalab and mirrors.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# A.4. Ramdisk usage


    An excellent description of the how the ramdisk works may be found with the documentation
    supplied with the Linux kernel. See /usr/src/linux/Documentation/ramdisk.txt.
    It is written by Paul Gortmaker and includes a section on creating a compressed
    ramdisk.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# ## A.5. The Linux boot process


    For more detail on the Linux boot process, here are some pointers:


    +   * The *Linux System Administrators'' Guide* has a section on booting.

    * The LILO `Technical overview` has the definitive technical, low–level description
    of the boot process, up to where the kernel is started.

    * The source code is the ultimate guide. Below are some kernel files related to
    the boot process. If you have the Linux kernel source code, you can find these
    under /usr/src/linux on your machine; alternatively, Shigio Yamaguchi (shigio
    at tamacom.com) has a very nice hypertext kernel browser for here are some relevant
    files to look at:


    ```

    arch/i386/boot/bootsect.S and setup.S

    ```


    Contain assembly code for the bootsector itself.


    ```

    arch/i386/boot/compressed/misc.c

    ```


    Contains code for uncompressing the kernel.


    ```

    arch/i386/kernel/

    ```


    Directory containing kernel initialization code. setup.c defines the ramdisk word.


    ```

    drivers/block/rd.c

    ```


    Contains the ramdisk driver. The procedures rd_load and rd_load_image load blocks
    from a device into a ramdisk. The procedure identify_ramdisk_image determines
    what kind of filesystem is found and whether it is compressed.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# B. LILO boot error codes


    Questions about these codes are asked so often on Usenet that we include them
    here as a public service. This summary is excerpted from Werner Almsberger LILO
    User Documentation.


    When LILO loads itself, it displays the word LILO. Each letter is printed before
    or after some specific action. If LILO fails at some point, the letters printed
    so far can be used to identify the problem.


    | Output | Problem |

    | --- | --- |

    | (nothing) | No part of LILO has been loaded. LITHER either not installed or
    the partition on which its boot sector is not active. |

    | L | The first stage boot loader has been loaded and started, but it can''t load
    the second stage boot loader. The two-digit error codes indicate the problem.
    (See also `Disk codes`.) This condition usually indicates a media failure or a
    geometry mismatch (e.g. bad disk parameters). |

    | LI | The first stage boot loader was able to load the second stage boot loader,
    but has failed to execute it. This can either be caused by a geometry mismatch
    or by moving /boot/boot.b without running the map installer. |

    | LIL | The second stage boot loader has been started, but it can''t load the
    descriptor table by the map file. This is typically caused by a media failure
    or by a geometry mismatch. |

    | LIL? | The second stage boot loader has been loaded at an incorrect address.
    This is typically caused by a subtle geometry mismatch or by moving /boot/boot.b
    without running the map installer. |

    | LIL- | The descriptor table is corrupt. This can either be caused by a geometry
    mismatch or by moving /boot/map without running the map installer. |

    | LILO | All parts of LILO have been successfully loaded. |


    If the BIOS signals an error when LILO is trying to load a boot image, the respective
    error code is displayed. These codes range from 0x00 through 0xb. See the LILO
    User Guide for an explanation of these.'
  merge: -1
  pgno: 44
