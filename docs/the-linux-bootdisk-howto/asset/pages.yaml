    The QMAGIC indicates that 4.7.2 is for A.OUT, and ELF indicates that 5.4.33 and
    2.1 are for ELF.

    ```


    Copy the special loader(s) to the root filesystem you are building. Libraries
    and loaders should be checked carefully against the included binaries. If the
    kernel cannot find a necessary library, the kernel may hang with no error message.


    # 4.4. Providing for PAM and NSS


    Your system may require dynamically loaded libraries that are not visible to ldd.
    If you don''t provide these, you may have trouble logging in on your bootdisk.


    # 4.4.1. PAM (Pluggable Authentication Modules)


    If your systems use PAM (Pluggable Authentication Modules), you must make some
    provision for it on your bootdisk. Briefly, PAM is a modular method for authenticating
    users and controlling their access to services. An easy way to determine if your
    system uses PAM is run ldd on your login executable; if the output includes libpam.so,
    you need PAM.


    Fortunately, security is of no concern with bootdisks unless who has physical
    access to a machine can do anything they want. Therefore, you can easily disable
    PAM by creating a simple /etc/pam.conf file in your root filesystem. This library
    is only about SK so it makes minimal overhead.


    | OTHER auth optional | /lib/security/pam_permit.so |

    | OTHER account optional | /lib/security/pam_permit.so |

    | OTHER password optional | /lib/security/pam_permit.so |

    | OTHER session optional | /lib/security/pam_permit.so |


    Also copy the file /lib/security/pam_permit.so to your root filesystem. This library
    is only about SK so it makes minimal overhead.


    This configuration allows anyone complete access to the files and services on
    your machine. If you care about security on your rootdisk, you''ll have to copy
    some or all of your hard disk''s PAM setup to your root filesystem. Be sure to
    read the PAM documentation carefully, and copy any libraries needed in /lib/security
    to your root filesystem.


    You must also include /lib/libpam.so on your bootdisk. But you already know this
    since you run ldd on /bin/login, which showed this dependency.


    # 4.4. Providing for PAM and NSS'
