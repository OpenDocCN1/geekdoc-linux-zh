  md: '# The Linux Bootdisk HOWTO


    In general, when we talk about `building a bootdisk` we mean creating both the
    boot (kernel) and root (files) portions. They may be either together (a single
    boot/root disk) or separate (boot + root disks). The most flexible approach for
    rescue diskettes is probably to use separate boot and root diskettes, and one
    or more utility diskettes to handle the overflow.


    # 3.2. Disk types'
