  md: "# 6. Putting them together: Making the diskette\n\nAt this point you have a\
    \ kernel and a compressed root filesystem. If you are making a boot/root disk,\
    \ check their sizes to make sure they will both fit on one disk. If you are making\
    \ a disk boot+root set, check the root filesystem to make sure it fit on a single\
    \ diskette.\n\nYou should decide whether to use LILO to read the bootdisk kernel.\
    \ The alternative is to copy the kernel directly to the disk and without LILO.\
    \ The advantage of using LILO is that it enables you to supply some parameters\
    \ to the kernel which may be necessary to initialize your hardware (Check the\
    \ file /etc/lilo.conf on your system. If it exists and has a line `append=...`,\
    \ you probably need this feature). The disadvantage of using LILO is that building\
    \ the bootdisk is more complicated and takes slightly more space. You will have\
    \ to set up a small filesystem, which we will call the kernel filesystem, where\
    \ you transfer the kernel and a few other things that LILO needs.\n\nIf you are\
    \ going to use LILO, read on; if you are going to transfer the kernel directly,\
    \ skip ahead to Section 6.2.\n\n# 6.1. Transferring the kernel with LILO\n\nFirst,\
    \ make sure you have a recent version of LILO.\n\nYou must create a small configuration\
    \ file for LILO. It should look like this:\n\n```\nboot      =/dev/fd0\ninstall\
    \    =/boot/boot.b\nmap       =/boot/map\nread-write\nbackup    =/dev/null\ncompact\
    \  \nimage     =KERNEL\nlabel     =BootDisk\nroot      =/dev/fd0\n```\n\nFor an\
    \ explanation of these parameters, LILO's user documentation. You will probably\
    \ want to add an append=... line to your hard disk's `/etc/lilo.conf` file.\n\n\
