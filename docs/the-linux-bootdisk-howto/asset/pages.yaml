  md: '# 7. Troubleshooting, or The Agony of Defeat


    When building bootds, the first few tries will not boot. The general approach
    to building a root disk is to assemble components from your existing system, and
    try and get the diskette-based system to the point where it displays messages
    on the console. Once it starts talking to you, the battle is half over because
    you can see what it is complaining about, and you can fix problems until the system
    works smoothly. If the system just hangs with no explanation, finding the cause
    can be difficult. The recommended procedure for investigating the problem the
    system will not talk to you is as follows:


    +   • You may see a message like:


    ```

    Kernel panic: VFS: Unable to mount root fs on XX:YY

    ```


    This is a common problem and it has only a few cases. First, check the device
    XX:YY against the list of device codes in /usr/src/linux/Documentation/devices.txt.
    If it is incorrect, you probably didn''t use an dev-R-, or you did it on the wrong
    image. If the device code is correct, check the device drivers compiled into your
    kernel. Make sure it has floppy disk, ramdisk and ext2 filesystem built-in.


    +   • If you see many errors like:


    ```

    end_request: I/O error, dev 01: (ramdisk, sector NNN)

    ```


    This is an I/O error from the ramdisk, usually because the kernel is trying to
    write beyond the end of the device. The ramdisk is too small to hold the root
    filesystem. Check your boot''s initialization messages for a line like:


    ```

    Ramdisk driver initialized : 16 ramdisk of 4096K size

    ```


    Check this again uncompressed size of the root filesystem. If the ramdisks aren''t
    large enough, make them.


    +   • Check that the root actually contains the directories you think it does.
    It is easy to copy the wrong level so that you end up with something like /root/bin
    instead of /bin on your root disk diskette.


    +   • Check that there is a lib/libc.so with the same link that appears in your
    /lib directory on your hard disk


    +   • Check that any symbolic links in your /dev directory in your existing system
    also exist on your root filesystem, where links are to devices you have included
    in your root device. In particular, /dev/console links are essential in many cases.


    +   • Check that you have included /dev/tty, /dev/null, /dev/zero, /dev/mem, support
    for all resources required to login point must be built in, not modules. So ramdisk
    and ext2 support must be built-in.


    +   • Check that your root device and ramdisk settings are correct.


    Once these general cases have been covered, there are some specific files to check:


    +   1. Make sure init is included as /sbin/init or /bin/init. Make sure it is
    executable.

    2. Run ldd to check init''s libraries. Usually this uses libc.so, but check anyway.
    Make sure you included the necessary libraries and loaders.

    3. Make sure the right loader for your libraries --ld.so a for or ld-linux.so
    for ELF.

    4. Check the /etc/initstab on your boot filesystem for the calls to getty (or
    some getty-like program, such as aget, getty_ps). Make sure the program you use
    to make these make sense. initstab is possibly the trickiest part because its
    syntax and content depend on the input program'
