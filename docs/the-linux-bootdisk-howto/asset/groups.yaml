    ## 4.4.2. NSS (名称服务切换器)


    如果你使用 glibc，则必须为名称服务做好准备，否则你将无法登录。`/etc/nsswitch.conf` 文件控制各种服务的数据库查找。如果你不计划从网络访问服务（例如
