    # 1. Preface


    This document may be outdated. If the date on the title page is more than six
    months ago, please check the Bootdisk-HOWTO homepage to see if a more recent version
    exists.


    Although this document should be legible in its text form, it looks much better
    in Postscript, PDF or HTML forms because of the typographical conventions used.


    # 1.1. Version notes


    Graham Chapman wrote the original Bootdisk-HOWTO and supported it through version
    3.1. Tom Fawcett started as co-author during the time kernel v2 was introduced,
    and he is the document''s current maintainer. Chapman has disappeared from the
    Linux community and his whereabouts are currently unknown.


    This information is intended for Linux on the Intel platform. Much of this may
    be applicable to Linux on other processors, but if you have first-hand experience
    or information about this. If you have experience with bootdisks on other platforms,
    please contact me.


    # 1.2. To do list


    +   1. User-mode-linux (http://user-mode-linux.sourceforge.net) seems like a great
    way to test bootdisks without having to reboot your machine constantly. I haven''t
    been able to get to it. If anyone has been using this consistently with homemade
    bootdisks, please let me know.

    2. Re-analyze distribution boots and update

    3. Figure out how much of the init-getty-login sequence can be simplified, and
    rip it out. A few people have said that init can be linked directly to /bin/sh;
    if so, and if this makes no limitations, alter the instructions to do this. This
    would eliminate the need for getty, login, gettydeeds and maybe all PAM and NSS
    staff.

    4. Go through the 2.4 kernel source code and write a detailed explanation of how
    the boot process and ramdisk-loading process work, in detail. (If so I understand
    it better.) There are some issues around and limits of booting devices (eg flash
    memory) that I don''t understand yet.

    5. Delete section that describes how to upgrade existing distribution bootdisks.
    This is usually more than it''s worth.

    6. Replace dever commands with LILO keywords.


    # 1.3. Feedback and corrects


    I welcome any feedback, good or bad, on the content of this document. I have done
    my best to ensure that the instructions and information here are accurate and
    reliable, but I don''t know everything and I don''t keep up on kernel development.
    Please let me if you find errors or omissions. When writing, please indicate the
    version number of the document you''re referencing. Be nice.'
