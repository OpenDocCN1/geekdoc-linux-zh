    2:23:respawn:/sbin/getty 9600 tty2\n```\n\nThe initab defines what will run in\
    \ various states in initab; if init cannot find the program bootdisk will hang,\
    \ potentially multi-user mode. Carefully check the files mentioned in initab;\
    \ you may not even get an error message.\n\nNote that some programs cannot be\
