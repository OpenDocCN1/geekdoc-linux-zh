    # 2. Introduction


    Linux boot disks are useful in a number of situations, such as testing a new kernel,
    recovering from a disk failure (anything from a lost boot sector to a disk head
    crash), fixing a disabled system, or upgrading critical system files (such as
    libc.so).


    There are several ways of obtaining boot disks:


    +   * Use one from a distribution such as Slackware. This will at least allow
    you to boot.

    * Use a rescue package to set up boot disks to be used as rescue disks.

    * Learn what is required for each of the types of disk to operate, then build
    your own.


    Some people choose the last option so they can do it themselves. That way, if
    something breaks, they can work out what to do to fix it. Plus it''s a great way
    to learn about how a Linux system works.


    This document assumes some basic familiarity with Linux system administration
