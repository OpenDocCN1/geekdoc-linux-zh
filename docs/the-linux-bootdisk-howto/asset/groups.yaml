    # 4. Building a root filesystem


    Creating the root filesystem involves selecting files necessary for the system
    to run. In this section we describe how to build a compressed root filesystem.
    A less common option is to build an uncompressed filesystem on a diskette that
    is directly mounted as root; this alternative is described in Section 9.1.


    # 4.1. Overview


    A root filesystem must contain everything needed to support a full Linux system.
    To do able this, the disk must include the minimum requirements for a Linux system:


    +   * The basic file system structure.

    * Minimum set of directories: /dev/.proc, /bin, /etc, /lib, /usr, /tmp.

    * Basic set of utilities: sh, ls, cp, mv, etc.

    * Minimum set of config: rc, initab, fstab, etc.

    * Devices: /dev/hd*, /dev/tty*, /dev/fd0, etc.

    * Runtime library to provide basic functions used by utilities.


    Of course, any system only becomes useful when you can run something on it, and
    a root diskette only becomes useful when you can do something like:


    +   * Check a system on another drive, to check your root filesystem on your hard
    drive, you will need to be able to boot Linux from another device, as you can
    with a root diskette system. Then you can run fsck on your original root drive
    while it is not mounted.

    * Restore all or part of your root drive from backup using archive and compression
    utilities as cpio, tar, gzip and fate.


    We describe how to build a compressed filesystem because it is compressed on disk
    and, booted, it is uncompressed onto a ram. With a compressed filesystem you can
    fit many files (approximately six megabytes) onto a diskette. Because the filesystem
    is much larger than a diskette, it cannot be built on the diskette. We have build
    it elsewhere, compress it, then copy it to the diskette.


    # 4.2. Creating the filesystem


    In order to build such a root filesystem, you need a spare device that is large
    enough to hold all the files of backup. There are several choices:


    +   * Use a ramdisk (DEVICE = /dev/ram0). In this case, memory is used to simulate
    a disk drive. The ramdisk must be large enough to hold a filesystem of the appropriate
    size. If you use LILO, your configuration file (/etc/lilo.conf) for a line like
    RAMDISK = nnn determines the maximum RAM that can be allocated to a ramdisk. The
    default is 4096K, which should be sufficient. You probably not try to use such
    a ramdisk on a machine with less 8MB of RAM. Check to make sure you have a device
    like /dev/ram0, /dev/ram or /dev/ramdisk. If not, /dev/ram0 with mknode (major
    number 1, minor 0).

    * If you have an unused disk partition that is large enough (several megabytes),
    this is acceptable.'
  - '[PAGE 10]


    # The Linux Bootdisk HOWTO


    +   - Use a loopback device, which allows a disk file to be treated as a device.
    Using a loopback device you can create three megabyte file on your hard disk and
    build the filesystem on it.


    Type man losetup for instructions on using loopback devices. If you don''t unsetup
    you can get it along with compatible versions of mount and unmount from the util-linux
    package in the directory http://ftp.win.tue.nl/pub/linux/utils-linux/


    If you do not have a loop device (/dev/loop0, /dev/loop1, etc) on your system,
    you will have to create one with mknod /dev/loop0 b 7 0. Once you installed these
    special mount and umount binaries, create a temporary file on a hard with enough
    capacity (eg., /tmp/fsfile). You can use the following command:


    ```

    dd if=/dev/zero of=/tmp/fsfile bs=1k count=

    to create nn-block file.

    ```


    Use the file name in place of DEVICE below. When you issue a mount command you
    must include the option -o loop to mount a loopback device.


    After you chosen one of these options, prepare the DEVICE with:


    ```

    dd if=/dev/zero of=DEVICE bs=1k count=4096

    ```


    This command zeroes out the device.


    > Zeroing the device is critical because the filesystem will be compressed, so
    all unallocated portions should be filled with zeroes to achieve maximum compression.
    Keep this in mind whenever you move or delete files on the filesystem. The filesystem
    will de-allocate the blocks, but it will not zero them out again. If you do a
    lot of deletions and copying, your compressed filesystem may end much larger than
    necessary.


    Next the filesystem. The Linux kernel recognizes two file types for root disks
    to be automatically copied to ramdisk. Both are ext2, of which ext2 is preferred.
    If you use ext2, find it useful to use the -N option to specify more inodes than
    default:-N 2000 is suggested that you don''t run out of inodes. Alternatively,
    you can save on inodes by removing unnecessary /dev files. mke2fs by default create
    360 inodes on a 1.44Mb disk. This is ample on your kernel root diskette, but if
    you include all the devices in /dev you will easily exceed 360. Using a compressed
    root allows a larger filesystem, and more inodes by default, but you may still
    need to reduce the number of files or increase the number of inodes.


    So the command you will use like:


    ```

    mke2fs -m 0 -N 2000 DEVICE

    ```


    (If you''re using a loopback device, the disk file you''re using should be supplied
    in place of this DEVICE.)


    # 4. Building a root filesystem'
  - '[PAGE 11]


    # The Linux Bootdisk HOWTO


    The mke2fs command will automatically detect the space available and configure
    itself accordingly. The -m 0 parameter prevents it from reserving space for root,
    and provides more usable space on the disk.


    Next, mount the device:


    ```

    mount -t ext2 DEVICE /mnt

    ```


    (You must create a directory /mnt if it does not already exist.) In the remaining
    sections, all destination directory names are assumed to be relative to /mnt.


    # 4.3. Populating the filesystem


    Here is a reasonable set of directories for root filesystem [1]:


    +   * /dev -- Device files, required to perform I/O

    * /proc -- Directory stub required by proc filesystem

    * /etc -- System configuration files

    * /sbin -- Critical binaries

    * /bin -- Essential binaries considered part of the system

    * /lib -- Shared libraries to provide run-support

    * /mnt -- A mount point for maintenance on other disks

    * /usr -- Additional utilities and applications


    Three of these will be empty on the root filesystem, so they only need to be created
    with mkdir. The /proc directory is basically a stub until proc is mounted. The
    directories /mnt and /usr are only mount points for use after the boot/root system
    is running. Hence again, these directories only need to be created.


    The remaining four directories are described in the following sections:


    # 4.3.1. /dev


    A /dev directory containing a file for all devices to be used by the system is
    mandatory for any Linux system. The directory itself is a normal directory, and
    can be created with mkdir in the normal way. The device files, however, must be
    created in a special way, using the mknod command.


    There is a shortcut, though copy device files from your hard disk /dev directory.
    The only requirement is that you copy the device special files using -R option.
    This will copy the directory without copying the contents of the files. Be sure
    to use an upper case R For example:


    ```

    cp -dPR /dev/[0-9]* /mnt

    cp -dPR /dev/tty[0-6] /mnt

    ```


    assuming that the device is mounted at /mnt. The dp ensures symbolic links are
    copied as links, rather than using the target file, and that the original file
    attributes are preserved, preserving ownership information.


    If you want to do it, use ls -1 to display the major and minor device numbers
    for the devices


    # 4.3. Populating the filesystem'
  - '[PAGE 12]


    # The Linux Bootdisk HOWTO


    you want, and create them on the diskette using mkn.


    However the devices files are created, check that any special devices you have
    been placed on the rescue disk. For example, ftape uses tape devices, so you will
    need to copy all of these if you intend to access your floppy tape drive from
    the bootdisk.


    Note that one inode is required for each device file, and inodes at times can
    be a scarce resource, especially on filesystems. You''ll need to be selective
    about the device files you include. For example, if you do not have SCSI disks
    you can safely ignore /dev/sda*; if you don''t intend to use serial ports you
    can ignore /dev/ttyS.


    If, in building your filesystem, you get the error No space left on a df command
    shows space still available, you have probably out of inodes. A df -i will display
    node usage.


    ![](img/d69e49083f2a1e110bbd994e8b5c6a70_12_0.png)


    Be sure to include the following files from this directory: console, kmem, mem,
    null, ram0 and tty1.


    # 4.3.2. /etc


    The /etc directory contains configuration files. What it contains depends on what
    programs you intend to run. On most systems, these can be divided into three groups:


    +   1. Required at all times, e.g. rc, fstab, passwd.

    2. May be required, but no one is too sure.

    3. Junk that crept in.


    Files which are not essential can usually be identified with the command:


    ```

    ls -ltru

    ```


    This lists files in reverse order of date last accessed, so if any files are not
    being accessed, they can be omitted from a root diskette.


    On my root diskettes, I have the number of config files down to 15. This reduces
    my work to dealing with three sets of files:


    +   a. rc.d/* --- system setup and run level scripts

    b. fstab --- list of files to be mounted

    c. cittabb --- parameters for the init, the first process started at boot time.

    d. gettydefs --- parameters for the init, the first process started at boot time.


    +   1. The ones I should tidy up for a boot/root system:


    +   a. passwd --- Critical list of users, home directories, etc.

    b. group --- user groups.

    c. shadow --- passwords of users. You may not have this.

    t. termcap --- the terminal capability database.


    If security is important, passwd and shadow should be pruned before copying user
    passwords off the system, and so that unwanted logins are rejected when you boot
    from diskette.


    # 4.3.2. /etc'
