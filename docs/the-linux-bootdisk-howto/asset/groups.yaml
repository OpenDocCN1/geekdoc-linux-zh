    # The Linux Bootdisk HOWTO


    Q: How do I make bootable CD-ROMs?


    A: See section Section 11.


    Q: How do I make bootable LS–120 disks?


    A: Since I don''t have an LS–120 drive, the following information is summarized
    from information provided by Dave Cinge from the Linux Router Project.


    The LS–120 is an IDE floppy drive. It is compatible with both standard 3.5” disks
    and the new 120MB disks. As of Linux V2.0.31 there is full support. To be able
    to boot from these you must have a BIOS that specifically allows the LS–120 to
    be treated as drive 0 (where IDE devices start at 0). If you do not BIOS support,
    you can purchase a small IDE FloppyMax Card from Promise Technologies to overcome
    this deficiency.


    The kernel boot loader does not like the LS–120, and instantly dies. Also 2m disks
    do not like it and will not boot. 1.44MB disks work fine. SYLINUX works with the
    120MB disks as of v1.32. You would better off partitioning the disk and using
    ext2 or minhas, instead of SYLINUX unless you need MS-DOS compatibility.


    LILO does work with 120MB disks. Here is a sample lilo.conf:


    ```

    boot=/dev/hda

    compact

    disk=/dev/hda bios=0

    install=/floppy/boot.b

    map=/floppy/map

    image=/floppy/linux

    label=linux

    append=load_ramdisk=1

    initrd=/floppy/root.bin

    ramdisk=8192

    ```


    The line "disk=/dev/hda bios=0" is what does the trick to make it the LS–120.


    Q: How can I make a boot disk with a Slackware driver?


    A: The easiest way is to boot a Slackware kernel from your nearest Slackware site.
    Slackware kernels are generic kernels which attempt to include drivers for as
    many devices as possible, if you have a SCSI or IDE controller, chances that a
    driver for it is included in the Slackware kernel.


    Go to the alert and select either IDE or SCSI kernel depending on the type of
    controller you have. Check the xxxkern.cfg for the selected kernel to see the
    drivers which have been included in that kernel. If the device is in that list,
    the corresponding kernel should boot your computer. Download the xxxkern.tgz and
    copy it to your boot disk as described in the section on making boots.


    You must check the root device in the kernel, using the command rdev to change
    it. If this is not the same as the root device partition, the kernel was set to
    /dev/sda2, but your root SCSI partition is /dev/sda8. To use a root diskette,
    you will need to use the command rdev image=/dev/fd0.


    If you want to know how to set up a Slackware root disk as well that is outside
    the scope of this HOWTO, I suggest you check the Linux Install Guide or get the
    Slackware distribution. See the section in this HOWTO


    # 12. Frequently Asked Question (FAQ) list'
- md: "\n# The Linux Bootdisk HOWTO\n\n## References \n\ntitled `References`.\n\n\
    Q: How do I update my root diskette with new files?\n\nA: The easiest way is to\
    \ copy the filesystem from the rootback to the DEVICE you used (from Section 4.2).\
    \ Then mount the filesystem and make the changes. You have to remember where your\
    \ root filesystem was and how many blocks it occupied.\n\n```\ndd if=/dev/fd0\
    \ bs=lk skip=ROOTBEGIN count=BLOCKS | gunzip > DEVICE\nmount -t ext2 device /mnt\n\
    ```\n\nAfter making the changes, proceed as in Section 4.7 and transfer the root\
    \ filesystem to the disk. You should not have re-transfer the kernel or re-compile\
    \ the ramdisk if you do not change the starting position of your new root filesystem.\n\
    \nQ: How do I remove LILO so that I can use DOS to boot again?\n\nA: This is not\
    \ really a Boot topic, but it is asked often. Within Linux, you can run:\n\n```\n\
    /sbin/lilo -u\n```\n\nYou can also use the dd command to copy the backup saved\
    \ by LILO to the boot sector. Refer to the LILO documentation if you need to.\n\
    \nWithin DOS and Windows you can use the DOS command:\n\n```\nFDISK /MBR\n```\n\
    \nMBR stands for Master Boot Record. This command replaces the boot sector with\
    \ a clean DOS one, without affecting the partition table. Some purists disagree\
    \ with this, even though the author of LILO, Werner Almesberger, suggests it.\
    \ It is easy, and it works.\n\nQ: How can I boot if I lost kernel and my boot\
    \ disk?\n\nA: If you don't have a boot disk, probably the easiest method is as\
    \ described above to obtain a Slackware kernel for your controller type (IDE or\
    \ SCSI) \"How do I make a boot disk with a XXX driver\". You can then boot your\
    \ computer using this kernel, repair whatever damage there is.\n\nThe kernel may\
    \ not have the root device to disk type and partition you want. For example, Slackware's\
    \ generic kernel has the root device to /dev/sda2, whereas your root Linux partition\
    \ is to /dev/sda8. In this case the root device in the kernel will have to be\
    \ changed.\n\nYou can change the root and ramdisk settings in the kernel even\
    \ if you have a kernel, and some other operating system, such as DOS.\n\nrdev\
    \ changes kernel settings by changing the values at offsets in the kernel file,\
    \ so you can do the same if you have a hex editor available on whatever systems\
    \ you do running — for example Norton Disk Editor under DOS. You then need to\
    \ check and if necessary change the values in the kernel at the following:\n\n\
    | HEX | DEC | DESCRIPTION |\n| :--- | :--- | :--- |\n| 0x1F8 | 504 | Low byte\
    \ of RAMDISK word |\n| 0x1F9 | 505 | High byte of RAMDISK word |\n| 0x1FC | 508\
    \ | Root major device number - see below |\n| 0x1FD | 509 | Root major device\
    \ number - see below |\n\n## 12. Frequently Asked Question (FAQ) list\n\nThe interpretation\
    \ of the major word was described in Section 6.3, above.\n\nThe minor device numbers\
    \ must be set to the device you want to mount your root filesystem. Some useful\
    \ values to select from:\n\n| DEVICE | MAJOR | MINOR | DESCRIPTION |\n| :--- |\
    \ :--- | :--- | :--- |\n| /dev/fd0 | 2 | 0 | 1st floppy drive |\n| /dev/hd1 |\
    \ 3 | 1 | partition 1 on 1st IDE drive |\n| /dev/sda | 8 | 1 | partition 1 on\
    \ 1st SCSI drive |\n| /dev/sdb8 | 8 | 8 | partition 8 on 1st SCSI drive |\n\n\
    Once you have these values you can write the file to disk using either Norton\
    \ Utilities Disk Editor, or a program called rawwrite.exe. This program is included\
    \ in all distributions. It is a DOS program which writes a file to the \"raw\"\
    \ disk, starting at the boot sector, instead of writing it to the system file.\
    \ If you use Norton Utilities you must mount the file to a physical disk at the\
    \ beginning of the disk.\n\n**Q: How can I make extra copies of boot/root disks?**\n\
    \n**A: Because magnetic media may deteriorate over time, you should keep several\
    \ copies of your rescue disk, or in case the original is unusable.**\n\nThe easiest\
    \ way of making copies of any diskettes, including bootable and utility disks,\
    \ is to use the `dd` command to copy the contents of the original disk to a file\
    \ on your hard drive, and then use the same command to copy the file back to a\
    \ new diskette. Note that you do not need to dd, and should not, mount the diskettes,\
    \ as dd uses the raw device interface.\n\nTo copy the original, enter the command:\n\
    \n```\ndd if=DEVICEENAME of=FILENAME\n```\n\nwhere DEVICEENAME is the name of\
    \ the diskette and FILENAME is the name of the (hard-disk) output file. Omitting\
    \ the count parameter causes dd to copy the whole diskette (2880 blocks if high-density).\n\
    \nTo copying the result back to a new diskette, insert the new diskette and enter\
    \ the reverse command:\n\n```\ndd if=FILENAME of=DEVICEENAME\n```\n\nNote that\
    \ the above discussion assumes that you have only one diskette. If you have two\
    \ of the same, you can copy the disk using a command like:\n\n```\ndd if=/dev/fd0\
    \ of=/dev/fd1\n```\n\n**Q: How can I boot without typing in ahxxxx=nn,nn,nn every\
    \ time?**\n\n**A: Where a device cannot be autodetected it is necessary to supply\
    \ the kernel with a command device parameter string, such as:**\n\n```\naha152x=0x340,11,3,1\n\
    ```\n\nThis parameter string can be supplied in several ways using LILO:\n\n-\
    \ By entering into the command line every time the system is booted by LILO. This\
    \ is boring, though.\n- By using LILO's lock keyword to make it the command line\
    \ as the default command line, so that LILO will use the same options every it\
    \ it boots.\n- By using the append= statement in the LILO config file. Note that\
    \ the parameter string must be enclosed in quotes.\n\nFor example, a sample command\
    \ line using the above parameter string would be:\n\n```\nzImage aha152x=0x340,11,3,1\
    \ root=/dev/sda lock\n```\n\nThis would pass the parameter string through, and\
    \ also ask the kernel to set the root device to /dev/sda save the whole command\
    \ line and reuse it for all future boots.\n\nA sample APPEND statement is:\n\n\
    ```\nAPPEND = aha152x=0x340,11,3,1\n```\n\nNote that the parameter string must\
    \ not be enclosed in quotes on the command line, but it must be enclosed in quotes\
    \ in the APPEND statement.\n\nNote also that for the parameter string to be acted\
    \ on, the kernel must contain the driver for that disk type. If it does not, then\
    \ there is nothing listening for the parameter string, and you will have to rebuild\
    \ the kernel to include the required driver. For details on rebuilding the kernel,\
    \ go to /usr/src/linux and read the README, and read the Linux FAQ and Installation\
    \ HOWTO. Alternatively you could obtain a generic kernel for the disk type and\
    \ install.\n\nReaders are urged to read the LILO documentation before experimenting\
    \ with LILO installation. Incautious use of the BOOT command can damage partitions.\n\
    \nQ: At boot time, I get error A: cannot execute B. Why?\n\nA: There are several\
    \ cases of program being hardcoded in various utilities. These cases do not occur\
    \ everywhere, but they may explain why an executable apparently cannot be found\
    \ on your system even when you can see it is. You can find out if a given program\
    \ has the name of another hardcoded by using strings command and piping the output\
    \ through grep.\n\nKnown examples of hardcoding are:\n\n- shutdown in some versions\
    \ has /etc/reboot hardcoded, so reboot must be placed in /etc directory.\n- init\
    \ has caused problems for at least one person, with the kernel being unable to\
    \ init.\n\nTo fix these problems, either move the programs to the correct directory,\
    \ or change configuration files (e.g. initabbab) to point to the correct directory.\
    \ If doubt, put programs in the same directory as they are on your hard disk,\
    \ and use the same initabbab and /etc/rc.d files as they appear on your hard disk.\n\
    \nQ: My kernel has ramdisk support, but initializes ramdisks of 0K. Why?\n\nA:\
    \ Where this occurs, a kernel message like this will appear as the kernel is booting:\n\
    \n```\nRamdisk driver initialized : 16 ramdisks of 0K size\n```\n\nThis is probably\
    \ because the size has been set to 0 by kernel parameters at boot time. This could\
    \ possibly because of an overlooked LILO configuration file parameter.\n\n```\n\
    ramdisk=0\n```\n\nThis was included in sample LILO configuration files in some\
    \ older distributions, and was put there to override any previous kernel setting.\
    \ If you have such a line, remove it.\n\nNote that if you attempt to use a ramdisk\
    \ of 0 size, the behaviour can be unpredictable, and can result in kernel panics.\n"
  mdcn: "\n\n# Linux 启动盘 HOWTO\n\n## 参考文献 \n\n标题为 `References`。\n\n问：我如何用新文件更新我的根磁盘软？\n\
    \n答：最简单的方法是从根备份（rootback）将文件系统复制到你所使用的 DEVICE（见第 4.2 节）。然后挂载该文件系统并进行更改。你需要记住你的根文件系统在哪里，以及它占用了多少个块。\n\
    \n```\ndd if=/dev/fd0 bs=lk skip=ROOTBEGIN count=BLOCKS | gunzip > DEVICE\nmount\
    \ -t ext2 device /mnt\n```\n\n进行更改后，按照第 4.7 节的方法继续，将根文件系统传输到磁盘。如果你没有更改新根文件系统的起始位置，则不需要重新传输内核或重新编译内存盘（ramdisk）。\n\
    \n问：我如何移除 LILO 以便我再次使用 DOS 启动？\n\n答：这实际上不是一个启动的话题，但经常被问到。在 Linux 中，你可以运行：\n\n\
    ```\n/sbin/lilo -u\n```\n\n你也可以使用 `dd` 命令将 LILO 保存的备份复制到引导扇。如果需要，请参考 LILO 文档。\n\
    \n在 DOS 和 Windows 中，你可以使用 DOS 命令：\n\n```\nFDISK /MBR\n```\n\nMBR 代表主引导记录（Master\
    \ Boot Record）。该命令用干净的 DOS 引导扇区替换引导扇区，而不影响分区表。一些纯主义者不同意此观点，尽管 LILO 的作者 Werner\
    \ Almesberger 建议这样做。这种方法简单且有效。\n\n问：如果我丢失了内核和启动磁盘，我该如何启动？\n\n答：如果你没有启动磁盘，可能简单的方法如如所述，获取适用于你控制器类型（IDE\
    \ 或 SCSI）的 Slackware 内核，即“如何制作带有 XXX 驱动程序的启动磁盘”。然后你可以使用此内核启动计算机，修复任何损坏。\n\n内核可能没有包含你想要的磁盘类型和分区的根设备。例如，Slackware\
    \ 的通用内核根设备是 `/dev/sda2`，而你的根 Linux 分区是 `/dev/sda8`。在这种情况下，必须更改内核中的根设备。\n\n即使你已经有了内核以及其他操作系统（如\
    \ DOS），你也可以更改内核中的根和内存盘设置。\n\n`rdev` 通过更改内核文件中偏移量处的值来更改内核设置，因此如果你在运行的任何系统上都有十六编辑器，你也可以执行相同的操作——例如\
    \ DOS 下的 Norton Disk Editor。然后你需要检查并在必要时更改内核中以下位置的值：\n\n| HEX | DEC | DESCRIPTION\
    \ |\n| :--- | :--- | :--- |\n| 0x1F8 | 504 | RAMDISK 字的低字节 |\n| 0x1F9 | 505 |\
    \ RAMDISK 字的高字节 |\n| 0x1FC | 508 | 根主设备号 - 见下文 |\n| 0x1FD | 509 | 根主设备号 - 见下文\
    \ |\n\n## 12. 常见问题 (FAQ) 列表\n\n主字的解释已见上文第 6.3 节。\n\n次要设备号必须设置为你想挂载根文件系统的设备。以下是一些可选的有用值：\n\
    \n| DEVICE | MAJOR | MINOR | DESCRIPTION |\n| :--- | :--- | :--- | :--- |\n| /dev/fd0\
    \ | 2 | 0 | 第一个软盘驱动 |\n| /dev/hd1 | 3 | 1 | 第一个 IDE 驱动器上的分区 1 |\n| /dev/sda |\
    \ 8 | 1 | 第一个 SCSI 驱动器上的分区 1 |\n| /dev/sdb8 | 8 | 8 | 第一个 SCSI 驱动器上的分区 8 |\n\n\
    获取这些值后，可以使用 Norton Utilities Disk Editor 或名为 `rawwrite.exe` 的程序将文件写入磁盘。该程序包含在所有发行版中。这是一个\
    \ DOS 程序，它将文件写入“原始”磁盘（从引导扇区开始），而不是将其写入系统文件。如果你使用 Norton Utilities，你必须将文件挂载到物理磁盘的开头。\n\
    \n**问：我如何为启动/根磁盘制作额外副本？**\n\n**答：因为磁介质可能会随着时间的推移而退化，你应该保留多个磁盘的多个副本，以防原盘无法使用。**\n\
    \n制作任何软盘（包括可启动盘和工具盘）副本的最简单方法是使用 `dd` 命令将原始磁盘的内容复制到硬盘上的一个文件中，然后使用相同的命令将文件复制回新软盘。注意，你不需要也不应该在\
    \ `dd` 时挂载软盘，因为 `dd` 使用原始设备接口。\n\n要复制原始文件，输入命令：\n\n```\ndd if=DEVICEENAME of=FILENAME\n\
    ```\n\n其中 DEVICEENAME 是软盘名称，FILENAME 是（硬盘）输出文件的名称。省略 `count` 参数会导致 `dd` 复制整个软盘（如果是高密度则为\
    \ 2880 个块）。\n\n要将结果复制回新软盘，插入新软盘并输入反向命令：\n\n```\ndd if=FILENAME of=DEVICEENAME\n\
    ```\n\n注意，上述讨论假设你只有一个软盘。如果你有两个相同的软盘，可以使用类似命令复制磁盘：\n\n```\ndd if=/dev/fd0 of=/dev/fd1\n\
    ```\n\n**问：我如何不需要每次都输入 ahxxxx=nn,nn,nn？**\n\n**答：在设备无法自动检测的情况下，必须为内核提供一个命令行设备参数字符串，例如：**\n\
    \n```\naha152x=0x340,11,3,1\n```\n\n使用 LILO 可以通过几种方式提供此参数字符串：\n\n- 在每次由 LILO 启动系统时在命令行中输入。尽管这很无聊。\n\
    - 使用 LILO 的 `lock` 关键字将命令行设为默认命令行，这样 LILO 每次启动时都会使用相同的选项。\n- 在 LILO 配置文件中使用 `append`\
    \ 语句。注意，参数字符串必须包含引号。\n\n例如，使用上述参数字符串的示例命令行：\n\n```\naha152x=0x340,11,3,1 root=/dev/sda\
    \ lock\n```\n\n这将传递参数字符串并设置根为 `/dev/sda`。此外，要让参数字符串生效，内核必须包含该磁盘类型的驱动程序。如果没有，你必须重新编译内核。一个\
    \ `append` 语句示例：\n\n```\nAPPEND = aha152x=0x340,11,3,1\n```\n\n注意，参数字符串在命令行中不需要包含引号，但在\
