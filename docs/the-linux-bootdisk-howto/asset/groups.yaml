    disk. Once the boot/root disk is booted, it is copied to the ramdisk leaving the
    drive free to mount another disk, the utility disk. I usually mount this as /usr.


    Creation of a utility disk is described in Section 9.2. It is probably desirable
    to maintain a copy of the same version of backup utilities to write the backups
    so you do not waste time installing versions that cannot read your backup tapes.


