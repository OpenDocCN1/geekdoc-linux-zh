    ## 8. 缩小根文件系统大小


    构建启动盘的主要问题之一是将所有内容都放入一张（甚至两张）软盘中。即使对文件进行压缩，这仍然非常困难，因为 Linux 系统组件在不断增长。这里是一些用于使所有内容恰容的常用技术。


    ## 8.1 增加软盘密度


    默认情况下，软盘格式化为 1440K，但支持更高密度的格式。能否从高密度磁盘启动主要取决于你的 BIOS。**fdformat** 可以将磁盘格式化为以下大小：1600K、1680K、1722K、1743K、1760K、1840K
    和 1920K。请参阅 **fdformat** 手页和 `/usr/src/linux/Documentation/devices.txt`。


    但你的机器支持什么种密度呢？以下是来自 idutils 作者 Alain Knaff 的一些（经过编辑的）回答。


    > 这是一个 BIOS 读取器的问题，而不是磁盘的物理格式问题。如果 BIOS 认为任何大于 18 的扇区都是坏的，那么我们也无为力。相反，与其拆解 BIOS，不如通过试错来发现。然而，如果
    BIOS 支持 ED 磁盘（额外密度：每道 36 个扇区，2.88MB），那么也有可能支持 1722K 磁盘。


    每道 21 个扇区的超格式化磁盘可能无法启动；这些磁盘使用了非标准的扇区大小（例如每个扇区为 1024 字节而不是 512 字节），很可能无法启动。编写一个特殊的引导扇区程序来绕过这个问题。如果我没记错，DOS
    2m 工具就有这样一个怪物，OS/2 的 XDF 工具也是如此。


    某些 BIOS 会人为地声称任何大于 18 的扇区号必须是无效（be-in）。这些磁盘将无法启动。最好的测试方法是将 DOS 或 linux 磁盘作为 1722K
    进行测试并使其启动。如果使用 LILO，请使用 `linear` 选项（否则 LILO 将假设磁盘是每道 18 个扇区，即使 BIOS 支持，磁盘也将无法启动）。


    ## 8.2 使用 BusyBox 替换常用工具


    根文件系统空间被 GNU 系统工具消耗，如 **cat**、**chmod**、**cp**、**dd**、**etc**。**BusyBox** 项目旨在为这些常用系统工具提供最小化替代方案。BusyBox
    使用一个名为 `/bin/busybox` 的单个150K可执行文件，实现了这些工具的功能。你从不同的工具到该可执行文件创建符号链接；busybox 会识别它是如何被调用的并调用相应的代码。BusyBox
    还包含一个基础 shell。许多发行版的二进制包中都提供了 BusyBox，可以在 [BusyBox 网站] 获取源码。


    ## 8.3 使用备用 shell


    Linux 中一些流行的 shell（如 bash 和 tsh）体积很大且需要许多库。如果你不使用 BusyBox shell，仍然应该考虑替换你的 shell。一些轻量级的替代方案是
    ash、lsh、kiss 和 smash，它们要小得多，且需要的库很少（或没有）。大多数此类替代 shell 都可以从 http://www.ibiblio.org/pub/Linux/system/shells/
    获取。确保你使用的任何 shell 都能在你的启动盘上包含的所有 rc 文件中运行命令。


    ## 8.4 剥离库和二进制文件


    许多库和二进制文件在发布时带有调试信息。在这些文件上运行 `file` 命令，会显示 `not stripped`。在将二进制文件拷贝到根文件系统时，良好的做法是使用：


    ```

    objcopy --strip-all FROM TO

    ```


    > 拷贝库时，务必使用 `strip-debug` 而不是 `strip-all`。


    ## 8.5 将文件移动到工具磁盘


    如果某些二进制文件启动或登录时不需要，可以将它们移动到工具磁盘。详见第 9.2 节。你也可以考虑将模块移动到工具磁盘。


    ## 9. 其他主题


    ## 9.1 非 ramdisk 根文件系统


    第 4 节提供了构建压缩根文件系统的说明，它在系统启动时加载到 ramdisk 中。然而，这种方法有许多优点，因此被广泛使用。但内存不足的系统无法负担所需的
    RAM，必须使用直接从软盘挂载的根文件系统。


    此类系统的构建实际上比压缩根文件系统更容易，因为它们可以在软盘上而不是其他设备上构建，而且不需要压缩。我们将概述该步骤，因为它与上面的说明有所不同。如果你选择这样做，请记住你将拥有大量空间。


    1. 计算根文件将有多少可用空间。如果你正在构建单盘启动/根磁盘，你必须将所有内核加上所有根文件系统都放入磁盘。

    2. 使用 `mkefs` 在适当大小的软盘上创建根文件系统。

    3. 按照描述填充文件系统。

    4. 完成后，卸载文件系统并将其传输到数据文件中，但不要对其压缩。

    5. 如上所述将内核传输到软盘。在计算 ramdisk 单词时，将第 14 位设为0，以指示根文件系统不加载到 ramdisk 中。按照描述运行 `rdev`。

    6. 像以前一样传输根文件系统。


    你有几种选择可以采取。如果你正在构建双盘系统，可以直接在第二块磁盘上构建完整的根文件系统，而不需要将其传输到硬盘再传回来。此外，如果你正在构建单盘启动/根磁盘并使用
    LILO，你可以在整个磁盘上构建单个文件系统，包含内核、LILO 文件和根文件，只需在最后一步运行 LILO 即可。


    ## 9.2 构建工具磁盘


    工具磁盘相对简单——只需在格式化后的磁盘上创建文件系统并将文件拷贝到其中。使用此类启动盘，在系统启动后手动挂载它。


    在上面的说明中，我们提到工具磁盘可以挂载为 `/usr`。在这种情况下，二进制文件可以放在工具磁盘的 `/bin` 目录，因此将 `/usr/bin` 放入你的路径中即可访问它们。二进制文件所需的额外库放在工具磁盘的
    `/lib` 中。


    设计工具磁盘时有几个重要点需要注意：


    1. 不要将系统二进制文件或库放在工具磁盘上，因为在系统启动之前无法挂载。

    2. 在系统启动之前你无法访问工具磁盘。

    3. 如果使用工具磁盘，请确保它包含应急恢复所需的工具。


    ## 10. 专业人士是如何做的


    你可能会发现 Slackware、RedHat 或 Debian 等主流发行版的启动盘似乎比描述的要复杂。专业发行版的启动盘基于相同的原理，但采用了各种技巧。首先，它们必须能够处理各种硬件，必须能够与用户交互。其次，它们必须准备好处理许多选项，且自动化程度不一。最后，发行版启动盘通常结合了安装和救援能力。


    '
