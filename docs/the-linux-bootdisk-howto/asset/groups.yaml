    # 5. Choosing a kernel


    At this point you have a complete compressed root. The next step is to build or
    select a kernel. In most cases it would be possible to copy your current kernel
    and boot the diskette from that. However, there may be cases where you wish to
    boot a separate one.


    One reason is size. If you are building a single boot/root diskette, the kernel
    will be one of the largest files on the diskette so you will have to reduce the
    size of the kernel as much as possible. To reduce kernel size, build it with the
    minimum of facilities necessary to support the desired system. This means leaving
    out everything you don''t need. Networking is a good thing to leave out, as well
    as support for any disk drives and other devices which you don''t need when running
    your boot/root system. As stated before, your kernel must ramdisk and ext2 support
    built into it.


    Having worked out a minimum set of facilities to include in a kernel, you then
    need to work out what to add back in. Probably the most common uses for a boot/root
    diskette would be to examine and restore a corrupted root file system, and you
    will need kernel support. For example, if your backups are all held on tape using
    Ftape to access your tape drive, then, if you lose your current root drive and
    drives containing Ftape, then you will not be able to restore from your backup
    tapes. You will have to reinstall Linux, download and reinstall fltape, and then
    try to read your backups.


    The point here is that, whatever I/O support you have added to your kernel to
    support backups should also be added into your boot/root kernel.


    The procedure for actually building the kernel is described in the documentation
    that comes with the kernel. It is quite easy to follow, so start by looking in
    /usr/src/linux. If you have trouble building a kernel, you should probably not
    attempt to build boot/root systems anyway. Remember to compress the kernel with
    `makeImage`.'
