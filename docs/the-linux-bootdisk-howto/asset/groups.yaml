    ```

    Ramdisk driver initialized : 16 ramdisks of 0K size

    ```


    This is probably because the size has been set to 0 by kernel parameters at boot
    time. This could possibly be because of an overlooked LILO configuration file
    parameter.


    ```

    ramdisk=0

    ```


    This was included in sample LILO configuration files in some older distributions,
    and was put there to override any previous kernel setting. If you have such a
    line, remove it.


    Note that if you attempt to use a ramdisk of 0 size, the behaviour can be unpredictable,
