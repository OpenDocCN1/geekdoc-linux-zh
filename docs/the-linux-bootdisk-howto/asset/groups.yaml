    isofs.o), a lightweight text editor (elvis, jove), compression and archive utilities
    (gzip, bzip, cpio, tar, afio), tape utilities (mt, ftmt t, tob, taper), communications
    utilities (ppp.o, slip.o, minicom) and utilities for devices (setserial, mknod).


