    ## 1.4. Distribution policy


    Copyright © 1995–2002 by Tom Fawcett and Graham Chapman. This document may be
    distributed under the terms set forth in the Linux Documentation Project License.
    Please contact the authors if you are unable to get the license.


    This is free documentation. It is distributed in the hope that it will be useful,
