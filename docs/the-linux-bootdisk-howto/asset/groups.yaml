    ```

    passwd    files

    shadow    files

    group     files

    hosts      files

    services  files

    networks   files

    protocols files

    rpc       files

    ethers    files

    netmasks  files

    bootparms files

    automount  files

    alases    files

    netgroup  files

    publickey files

    ```


    这指定了仅由本地文件提供的每个服务。你还需要包含 `/lib/libnss_files.so.X`，其中 X 对于 glibc 2.0 为 1，对于 glibc
    2.1 为 2。该库将被动态加载以处理文件查找。


    如果你计划从你的启动盘访问网络，你可能想要创建一个更复杂的 `nsswitch.conf` 文件。详情请参阅 `nsswitch` 手页。你必须为你指定的每个服务包含一个
    `/lib/libnss_service.so.1` 文件。


    ## 4.5. 模块


    如果你有一个模块化内核，必须考虑在启动后想从启动盘加载哪些模块。如果你的备份在软盘上，你可能想要包含 `flute` 和 `ztape`；如果你想加载 SCSI
    设备，则需要这些设备的模块；如果你想在紧急情况下访问网络，可能需要 PPP 或 SLIP 的模块。


    这些模块可以放置在 `/lib/modules`。你还应该包含 `insmod`、`rmmod` 和 `lsmod`。取决于你是否想要自动加载模块，你可能包含
    `modprobe`、`depmod` 和 `swapout`。当你使用内核时，将其连同 `/etc/conf.modules` 一起包含。


    然而，使用模块的主要优势是可以非关键模块移动到实用磁盘并在需要时加载它们，从而减少根磁盘的空间。如果你可能需要处理不同的设备，这种方法比构建一个内置许多驱动程序的庞大内核要优得多。


    > 为了启动压缩的 ext2 文件系统，你必须内置 ramdisk 和 ext2 支持。它们不能作为模块提供。


    ## 4.6. 最后的细节


    某些系统程序（如 `login`）如果 `/var/run/utmp` 文件和 `/var/log` 目录不存在，将会报错。


    ```

    mkdir -p /mnt/var/{log,run}

    touch /mnt/var/run/utmp

    ```


    最后，在你设置好所有需要的库后，运行 `ldconfig` 来重新生成根文件系统上的 `/etc/ld.so.cache`。缓存告诉加载器去哪里寻找库。你可以通过以下命令执行：


    ```

    ldconfig -r /mnt

    ```


    ## 4.7. 总结


    当你完成根文件系统的构建后，卸载它，将其拷贝到文件中并进行压缩：


    ```

    umount /mnt

    diff if=DEVICE bs=1k gzip -v9 > rootfs.gz

    ```


    完成后，你将得到一个 `rootfs.gz` 文件。这就是你的压缩根文件系统。你应该检查它的大小，以确保它能放入软盘；否则你必须返回并移除一些文件。关于减小根文件系统大小的建议出现在第
    8 节。


    ## 5. 选择内核


    此时，你已经有了一个完整的压缩根目录。下一步是构建或选择一个内核。在大多数情况下，可以拷贝当前的内核并从该软盘启动。然而，在某些情况下，你可能希望启动一个单独的内核。


    原因是大小。如果你正在制作单张启动/根软盘，内核将是软盘上最大的文件之一，因此你必须尽可能减小内核尺寸。为了减小内核尺寸，请使用支持所需系统所需的最小功能来构建它。这意味着忽略所有你不需要的内容。网络功能是一个可以省掉的，还包括在运行启动/根系统时不需要任何磁盘驱动器和其他设备的支持。如前所述，你的内核必须内置
    ramdisk 和 ext2 支持。


    在确定了包含在内核中的最小功能集后，你还需要确定加回哪些内容。启动/根软盘最常见的用途可能是检查和恢复损坏的根文件系统，这将内核的支持。例如，如果你的所有备份都使用
    `Ftape` 访问磁带存储在磁带上，那么如果你丢失了当前的根驱动和包含 `Ftape` 的驱动，你将无法从备份磁带恢复。你必须重新安装 Linux，下载并重新安装
    `fltape`，然后尝试读取你的备份。


    这里的点在于，无论你为备份向内核添加了什么 I/O 支持，都应该将其添加到你的启动/根内核中。


    实际构建内核的步骤在内核自带的文档中描述。它非常容易遵循，请从查看 `/usr/src/linux` 开始。如果你在构建内核时遇到困难，你可能就不应该尝试构建启动/根系统。记得使用
    `makeImage` 压缩内核。


    ## 6. 将它们整合在一起：制作软盘


    此时，你有了一个内核和一个压缩的根文件系统。如果你正在制作启动/根磁盘，请检查它们的大小，以确保它们都能放入单块磁盘中。如果你正在制作磁盘启动+根组合集，请检查根文件系统以确保它能放入单张软盘。


    你应该决定是否使用 LILO 来读取启动盘内核。另一种方案是将内核直接拷贝到磁盘且不使用 LILO。使用 LILO 的优势是它允许向内核提供一些参数，这些参数对于初始化你的硬件可能是必要的（检查你系统上的
    `/etc/lilo.conf` 文件。如果它存在且有一行 `append=...`，你可能需要这个功能）。使用 LILO 的劣势是构建启动盘更加复杂且占用稍多空间。你将需要建立一个小文件系统（我们称为内核文件系统），在其中传输内核以及
    LILO 需要的其他几个东西。


    如果你打算使用 LILO，请继续阅读；如果你打算直接传输内核，请跳到第 6.2 节。


    ### 6.1. 使用 LILO 传输内核


    首先，确保你有最新版本的 LILO。


    你必须为 LILO 创建一个小型配置文件。它看起来像这样：


    ```

    boot      =/dev/fd0

    image     /boot

    map       /map

    root      /

    ```


    行的顺序并不重要，但每行都必须存在。`boot` 行指定引导程序所在的设备。`image` 行指定内核的位置。`map` 行指定 LILO 表的位置。`root`
    行指定根分区。


    创建该文件后，你必须运行 LILO 将其安装到启动盘：


    ```

    lilo -c /dev/fd0

    ```


    这将在软盘的第一扇区创建 LILO 表。该表看起来类似于所示：


    | total | | | |

    |---|---|---|---|

    | 3 | | | |

    | 1-rw---- | 1 root | root | 176 Jan 10 22 | lilo.conf |

    | 1 drwxr-xx | 2 root | root | 1024 Jan 10 23 | boot/ |

    | 1 drwxr-xx | 2 root | root | 1024 Jan 10 23 | dev/ |

    | 3-rw---- | 1 root | root | 36270 Jan 10 23 | vmlinux |

    | boot: | | | |

    | total 8 | | | |

    | 4-rw---- | 1 root | root | 3708 Jan 10 22 | boot.b |

    | 4-rw---- | 1 root | root | 3584 Jan 10 23 | map |

    | dev: | | | |

    | total 0 | | | |

    | 0 br-r---- | 1 root | root | 2, | 0 Jan 10 22 | fd0 |

    | 0 cr-r---- | 1 root | root | 1, | 3 Jan 10 22 | null |


    此表只是一个示例。数字和日期将根据你的系统而变化。


    一旦运行了 LILO，你就可以从软盘启动。LILO 将读取内核和配置文件指定的参数。


