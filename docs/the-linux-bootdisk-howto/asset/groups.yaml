    ## 6.3. 设置内存磁盘字 (ramdisk word)


    内核镜像内部包含一个内存磁盘字，它指定了根文件系统所在的位置以及其他选项。可以通过 `rdev` 命令访问并设置它，其内容的解释如下：


    | 位域 | 说明 |

    |---|---|

    | 0–10 | 内存磁盘起始偏移量，单位为 1024 字节块 |

    | 11–13 | 未用 |

    | 14 | 表示要加载内存磁盘的标志 |

    | 15 | 表示在加载根文件系统之前提示的标志 |


    如果位 15 被设置为1，在启动时你将会被提示在驱动器中加载新的软盘。这对于双盘启动集是必要的。


    这里有两种情况，取决于你构建的是单块启动/根磁盘片，还是双盘 `boot-root` 磁盘集。


    - 1. 如果你构建的是单个块，压缩后的文件系统将放置在内核之后（即 `KERNEL_BLOCKS`）。位 14将被设置为1，位 15将被设置为15。例如，如果你正在构建单个磁盘，且根文件系统将从块
    253（十进制）开始。内存磁盘字应为 253（十进制），且位 14 设置为1，位 15 设置为0。要计算该值，你可以简单地相加十进制值：253 + (2*14)
    = 253+16384 =16637。如果你不知道这个数字从哪里来，可以将其输入科学计算器并转换为二进制。

    - 2. 如果你构建的是双盘集，根文件系统将从第二个磁盘的零号块开始，因此偏移量为零。在这种情况下，位 14将被设置为1，位 15将被设置为1。此时的值将为
    2^14+ 49152。


    在计算出内存磁盘字的值后，使用 `rdev -R` 设置它。请使用十进制值。如果你使用了 LILO，此处的参数应该是挂载的内核路径，例如 `/mnt/vmlinuz`；如果你用
    `dd` 拷贝的内核，请使用软盘设备名称（例如 `/dev/fd0`）。


    ```

    rdev -R KERNEL_OFFSET_FLOPPY_DRIVE VALUE

    ```


    如果你使用了 LILO，解锁磁盘片


