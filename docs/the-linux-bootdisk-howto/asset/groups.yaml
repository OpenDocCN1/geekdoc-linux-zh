    The interpretation of the major word was described in Section 6.3, above.


    The and minor device numbers must be set to the device you want to mount your
    root filesystem. Some useful values to select from:


    | DEVICE MAJOR MINOR |

    | /dev/fd0 2 0 1st floppy drive |

    | /dev/hd1 3 1 partition 1 on 1st IDE drive |

    | /dev/sda 8 1 partition 1 on 1st SCSI drive |

    | /dev/sdb8 8 8 partition 8 on 1st SCSI drive |


    Once you have these values you can write the file to disk using either Norton
    Utilities Disk Editor, or a program called rawwrite.exe. This program is included
    in all distributions. It is a DOS program which writes a file to the "raw" disk,
    starting at the boot sector, instead of writing it to the system file. If you
    use Norton Utilities you must mount the file to a physical disk at the beginning
    of the disk.


    **Q: How can I make extra copies of boot/root disks?**


    **A: Because magnetic media may deteriorate over time, you should keep several
    copies of your rescue disk, or in case the original is unusable.


    The easiest way of making copies of any diskettes, including bootable and utility
    disks, is to use the `dd` command to copy the contents of the original disk to
    a file on your hard drive, and then use the same command to copy the file back
    to a new diskette. Note that you do not need to dd, and should not, mount the
    diskettes, as dd uses the raw device interface.


    To copy the original, enter the command:


    ```

    dd=DEVICEENAME=FILENAME

    ```


    where DEVICEENAME is the name of the diskette and FILENAME is the name of the
    (hard-disk) output file. Omitting the count parameter causes dd to copy the whole
    diskette (2880 blocks if high-density).


    To copying the result back to a new diskette, insert the new diskette and enter
    the reverse command:


    ```

    dd if=FILENAME of=DEVICEENAME

    ```


    Note that the above discussion assumes that you have only one diskette. If you
    have two of the same, you can copy the disk using a command like:


    ```

    dd if=/dev/fd0 of=/dev/fd1

    ```


    **Q: How can I boot without typing in ahxxxx=nn,nn,nn every time?**


    **A: Where a device cannot be autodetected it is necessary to supply the kernel
    with a command device parameter string, such as:


    ```

    aha152x=0x340,11,3,1

    ```


    This parameter string can be supplied in several ways using LILO:


    # 12. Frequently Asked Question (FAQ) list'
  - '[PAGE 36]


    # The Linux Bootdisk HOWTO


    +   - By entering into the command line every time the system is booted by LILO.
    This is boring, though.

    - By using LILO''s lock keyword to make it the command line as the default command
    line, so that LILO will use the same options every it boots.

    - By using the append= statement in the LILO config file. Note that the parameter
    string must be enclosed in quotes.


    For example, a sample command line using the above parameter string would be:


    ```

    zImage aha152x=0x340,11,3,1 root=/dev/sda lock

    ```


    This would pass the parameter string through, and also ask the kernel to set the
    root device to /dev/sda save the whole command line and reuse it for all future
    boots.


    A sample APPEND statement is:


    ```

    APPEND = aha152x=0x340,11,3,1

    ```


    Note that the parameter string must not be enclosed in quotes on the command line,
    but it must be enclosed in quotes in the APPEND statement.


    Note also that for the parameter string to be acted on, the kernel must contain
    the driver for that disk type. If it does not, then there is nothing listening
    for the parameter string, and you will have to rebuild the kernel to include the
    required driver. For details on rebuilding the kernel, go to /usr/src/linux and
    read the README, and read the Linux FAQ and Installation HOWTO. Alternatively
    you could obtain a generic kernel for the disk type and install.


    Readers are urged to read the LILO documentation before experimenting with LILO
    installation. Incautious use of the BOOT command can damage partitions.


    Q: At boot time, I get error A: cannot execute B. Why?


    A: There are several cases of program being hardcoded in various utilities. These
    cases do not occur everywhere, but they may explain why an executable apparently
    cannot be found on your system even when you can see it is. You can find out if
    a given program has the name of another hardcoded by using strings command and
    piping the output through grep.


    Known examples of hardcoding are:


    +   - shutdown in some versions has /etc/reboot hardcoded, so reboot must be placed
    in /etc directory.

    - init has caused problems for at least one person, with the kernel being unable
    to init.


    To fix these problems, either move the programs to the correct directory, or change
    configuration files (e.g. initabbab) to point to the correct directory. If doubt,
    put programs in the same directory as they are on your hard disk, and use the
    same initabbab and /etc/rc.d files as they appear on your hard disk.


    Q: My kernel has ramdisk support, but initializes ramdisks of 0K. Why?


    A: Where this occurs, a kernel message like this will appear as the kernel is
    booting:


