    ## 6.3. Setting the ramdisk word


    Inside the kernel image is the ramdisk word that specifies where the root filesystem
    is to be found, along with other options. The word can be accessed and set via
    the rdev command, and its contents are interpreted as follows:


    | Bit field | Description |

    |---|---|

    | 0–10 | Offset to start of ramdisk, in 1024 byte blocks |

    | 11–13 | unused |

    | 14 | Flag indicating that ramdisk is to be loaded |

    | 15 | Flag indicating to prompt before loading roots |


    If bit 15 is set, on boot-up you will be prompted to load a new floppy disk in
    the drive. This is necessary for a two-disk boot set.


    There are two cases, depending on whether you are building a single boot/root
    diskette or a double `boot-root` diskette set.


    - 1. If you are building a single block, the compressed filesystem will be placed
    right after the kernel, (which is the KERNEL_BLOCKS). Bit 14 will be set to 1,
    and bit 15 will be set to 15. For example, if you''re building a single disk and
    the root filesystem will begin at block 253 (decimal). The ramdisk word should
    be 253 (decimal) with bit 14 set to 1 and bit 15 set to 0. To calculate the value
    you can simply add the decimal values. 253 + (2*14) = 253+16384 = 16637. If you
    don''t understand where this number comes from, plug it into a scientific calculator
    and convert it to binary.

    - 2. If you are building a two-disk set, the root filesystem will begin at block
    zero of the second disk, so the offset will be zero. In this case bit 14 will
    be set to 1 and bit 15 will be 1. The value will be 2^14+ 49152 in this case.


    After calculating the value for the ramdisk word, set it with rdev -R. Be to use
    the decimal value. If you used LILO, the argument here should be the mounted kernel
    path, e.g., `/mnt/vmlinuz`; if you copied the kernel with dd, use the floppy device
    name (e.g., `/dev/fd0`).


    ```

    rdev -R KERNEL_OFFSET_FLOPPY_DRIVE VALUE

    ```


    If you used LILO, unlock the diskette


    > Do not believe what the rdev/size manpage says about ramdisk size. The manage
    is obsolete. If kernel 2.0 or so, the ramdisk word will no longer determine the
    ramdisk size; the word is interpreted according to the table at the beginning
    of section Section 6.3. For a detailed explanation, see the documentation file
    ramdisk.txt or http://www.linuxhq.com/kernel/v2.4/doc/ramdisk.txt.html.


    ## 6.4. Transferring the root filesystem


    The last step is to transfer the root filesystem.


    - If the root filesystem will be placed on the same disk as the kernel, transfer
    it using dd with the seek option, which specifies how many blocks to skip:

    ```

    dd if=rootfs.gz of=/dev/fd0 bs=1k seek=KERNEL_BLOCKS

    ```

    - If the root filesystem will be placed on a second disk, remove the first diskette,
    put the second diskette in the drive, then transfer the root filesystem to it:

    ```

    dd if=rootfs.gz of=/dev/fd0 bs=1k

    ```


    Congratulations, you are done!


    > You should always test a bootdisk before putting it aside for an emergency.
    If it fails to boot, read on.


    ## 7. Troubleshooting, or The Agony of Defeat


    When building bootds, the first few tries will not boot. The general approach
    to building a root disk is to assemble components from your existing system, and
    try and get the diskette-based system to the point where it displays messages
    on the console. Once it starts talking to you, the battle is half over because
    you can see what it is complaining about, and you can fix problems until the system
    works smoothly. If the system just hangs with no explanation, finding the cause
    can be difficult. The recommended procedure for investigating the problem the
    system will not talk to you is as follows:


    - You may see a message like:


    ```

    Kernel panic: VFS: Unable to mount root fs on XX:YY

    ```


    This is a common problem and it has only a few cases. First, check the device
    XX:YY against the list of device codes in /usr/src/linux/Documentation/devices.txt.
    If it is incorrect, you probably didn''t use a dev-R-, or you did it on the wrong
    image. If the device code is correct, check the device drivers compiled into your
    kernel. Make sure it has floppy disk, ramdisk and ext2 filesystem built-in.


    - If you see many errors like:


    ```

    end_request: I/O error, dev 01: (ramdisk, sector NNN)

    ```


    This is an I/O error from the ramdisk, usually because the kernel is trying to
    write beyond the end of the device. The ramdisk is too small to hold the root
    filesystem. Check your boot''s initialization messages for a line like:


    ```

    Ramdisk driver initialized : 16 ramdisk of 4096K size

    ```


    Check this again uncompressed size of the root filesystem. If the ramdisks aren''t
    large enough, make them.


    - Check that the root actually contains the directories you think it does. It
    is easy to copy the wrong level so that you end up with something like /root/bin
    instead of /bin on your root disk diskette.


    - Check that there is a lib/libc.so with the same link that appears in your /lib
    directory on your hard disk


    - Check that any symbolic links in your /dev directory in your existing system
    also exist on your root filesystem, where links are to devices you have included
    in your root device. In particular, /dev/console links are essential in many cases.


    - Check that you have included /dev/tty, /dev/null, /dev/zero, /dev/mem, support
    for all resources required to login point must be built in, not modules. So ramdisk
    and ext2 support must be built-in.


    - Check that your root device and ramdisk settings are correct.


    Once these general cases have been covered, there are some specific files to check:


    1. Make sure init is included /sbin/init. Make sure it is executable.

    2. Run ldd on init to see what it needs, and make sure you included the necessary
    libraries.

    3. Make sure the right loader for ELF is included.

    4. Check the initstab for the calls to getty.

    5. Make sure /etc/initab has a system initialization, which must exist.

    6. Be sure you have installed a shell program (e.g., **bash** or **ash**) capable
    of running all of your rc scripts.

    7. If you have a /etc/ld.so.cache file on your rescue disk, remake it.

