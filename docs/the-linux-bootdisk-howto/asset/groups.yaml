    # 11. 创建可启动 CD-ROM


    > 本节由 Rizwan Mohammed Darwe 贡献

    (rizwan AT clovertechnologies dot com)


    本节假设你已经熟悉在 Linux 中写入 CD 的过程和原理。请将本节视为关于如何包含你将刻录的 CD 的启动能力的快速参考。《CD-Writing-HOWTO》应该为你提供更深入的参考。


    ## 11.1. 什么是 El Torino？


    对于 x86 平台，许多 BIOS 已开始支持可启动 CD。`mkisofs` 的补丁是基于名为“El Torino”的标准。简单来说，El Torino
    是一项规范，规定了如何格式化 CDROM 以便直接从中启动。


    “El Torino”规范规定，只要 BIOS 支持 El Torino，任何 CDROM 驱动器（SCSI 或 EIDE）都可以工作。到目前为止，这仅在
    EIDE 驱动器上经过测试，因为目前测试的所有 SCSI 控制器似乎都不支持 El Torino。主板必须支持 El Torino。你怎么知道你的主板是否支持“El
    Torino”呢？嗯，就是那些允许你选择从硬盘、软磁盘、网络或 CDROM 的主板。


    ## 11.2. 工作原理


    El Torino 标准的工作原理是通过 BIOS 让 CD 看起来像是一个普通的软磁盘驱动器。简单来说，就是将任何尺寸的软磁盘镜像（1.42MB 磁盘恰好为
    1440k）放在 ISO 文件系统的某处。在 ISO 文件系统的头中放置一个指向该处的指针。然后，BIOS 将从 CD 中获取此镜像，在所有用途中，它的表现就像你从软磁盘驱动器启动一样。这允许使用
    LILO 启动磁盘等，仅供使用。


    大致来说


    ## 11.3. 如何制作


    创建一个名为 "boot.img" 的文件，它是你想通过 CD-ROM 启动的可启动软磁盘的镜像。这是一个 1.44 MB 的可启动软磁盘。该命令将执行此操作：


    ```bash

    dd if=/dev/fd0 of=boot.img bs=10 count=144

    ```


    假设软磁盘在 A: 盘。


    将此镜像放置在 iso9660 文件系统的源的层级结构中。将所有与启动相关的文件放在自己的目录中是一个好主意（例如，在 iso9660 文件系统的根目录下的
    "boot/" 中）。


    有一个警告——你的启动软磁盘必须使用 LILO 加载任何初始内存磁盘（ramdisk），而不是内核内存磁盘驱动程序！一旦内核启动，BIOS 对 CD 作为软磁盘的仿真就会被绕过并失败。LILO
    将使用 BIOS 磁盘卡加载初始内存磁盘，因此仿真会按设计工作。


    El Torito 规范要求创建一个“启动目录”（boot catalog）。这是一个 2048 字节的文件，除了是必须的之外，它没有其他意义。`mkisofs`
    作者完成的补丁将自动创建启动目录，你必须指定启动目录在 iso9660 文件系统中的位置。通常像以前一样将其放在启动镜像中是一个好主意，像 `boot.catalog`
    这样的名字似乎是合适的。


    所以我们已经在 boot.img 文件中有了镜像，并将其放在了 iso9660 文件系统根目录下的 boot/ 目录下。我们将在与 boot.catalog
    相同的目录中拥有启动目录。随后用于在文件 bootcd.iso 中创建 iso9660 文件系统的命令即是：


    ```bash

    mkisofs -r b boot.img -c boot/catalog -o bootcd.iso

    ```


    -b 选项指定要使用的启动镜像（注意相对于 iso9660 磁盘根目录的路径），-c 选项用于启动目录文件。-r 选项将创建适当的文件所有权和模式（参阅 `mkisofs`
    手册）。末尾的 `.` 表示从当前目录获取源。


    现在使用通常的 `cdrecord` 命令刻录 CD，它就可以启动了。


    ## 11.4. 创建 Win9x 可启动 CD-ROMs


    第一步是获取源 CD 使用的启动镜像。但你不能简单地在 Linux 下挂载 CD 并 `dd` 之前的 1440k 到软磁盘或文件 boot.img 中。相反，只需直接用源
    CD-ROM 启动。


    当你启动 Win98 CD 时，会掉入 A: 提示符符实际的内存磁盘。而 D: 或 Z: 是所有安装程序所在的地方。使用 `diskcopy` 命令将 A:
    镜像复制到实际的软磁盘驱动器（现在是 B:）。该命令将执行此操作：


    ```bash

    diskcopy A: B:

    ```


    它的工作方式就像 `dd` 一样。你可以从这个新创建的磁盘启动，测试该过程是否与源 CD 类似。然后通常将此软磁盘通常 `dd` 到文件 boot.img，剩下的照常进行即可。


    ## 12. 常见问题 (FAQ) 列表


    - Q: 我从我的 boot/root 磁盘启动，但什么都没有发生。我该怎么办？

    - Q: Slack/Debian/RedHat 启动磁盘是如何工作的？

    - Q: 我如何使用高密度（>1440K）软磁盘？我如何判断哪些密度适用于我的软磁盘？

    - Q: 我如何增加我的内存磁盘的大小？

    - Q: 我如何制作可启动的 CD-ROM？

    - Q: 我如何制作可启动的 LS-120 磁盘？

    - Q: 我可以用 XYZ 驱动程序制作启动磁盘吗？

    - Q: 我如何用新文件更新我的根磁盘？

    - Q: 我如何删除它们以便我使用 DOS 启动？

    - Q: 如果我丢失了内核和启动磁盘，我该怎么办？

    - Q: 我可以制作 boot/root 软磁盘的额外副本吗？

    - Q: 能不能不需要都输入 abxxxx=nn,nn,nn 就能启动？

    - Q: 启动时，我得到错误 A:无法执行 B。为什么？

    - Q: 我的内核支持内存磁盘，但初始化的 0K 内存磁盘。为什么？


    Q: 我从我的 boot/root 磁盘启动，但什么都没有发生。我该怎么办？


    A: 见上文第 7 节。


    Q: Slack/Debian/RedHat 启动磁盘是如何工作的？


    A: 见上文第 10 节。


    Q: 我如何使用高密度（>1440K）软磁盘？我如何判断哪些密度适用于我的软磁盘？


