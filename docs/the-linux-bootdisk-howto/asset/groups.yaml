    ## 2. 引言


    Linux 启动盘在许多情况下都非常有用，例如测试新内核、从磁盘故障中恢复（从丢失引导扇区到磁盘头损坏等）、修复禁用的系统或升级关键系统文件（如 `libc.so`）。


    获取启动盘有几种方法：


    - 使用来自 Slackware 等发行版的启动盘。这至少让你能够启动系统。

    - 使用救援包设置作为救援盘使用的启动盘。

    - 学习每种磁盘运行所需的条件，然后构建自己的磁盘。


    有些人选择最后一种方案，以便自己动手。这样一来，如果某些地方坏了，他们就能弄清楚如何修复它。此外，这是学习 Linux 系统如何工作的极佳方法。


    本文假设读者对 Linux 系统管理概念有些基础了解。例如，您应该了解目录、文件系统和软盘。您应该知道 `/etc/passwd` 和 `fstab` 文件的用途以及它们的外观。您应该知道从头构建的启动盘中的大多数命令可能是复杂的。本
    HOWTO 应该以 root 身份运行。


    从头构建启动盘可能会很复杂。如果您没有读过 Linux FAQ 及其相关文档（如《Linux 安装 HOWTO》和《Linux 安装指南》），您就不应该尝试构建启动软盘。如果您只需要一个用于紧急情况的可用启动盘，下载一个预制的盘要简单得多。请参见下文附录
    A.1 了解如何找到这些磁盘。


    ## 3. 启动盘与启动过程


    启动盘基本上是软盘上的微型、自包含的 Linux 系统。它必须执行许多与完整尺寸 Linux 系统执行的相同功能。在尝试构建一个之前，您应该了解基本的 Linux
    启动过程。在这里我们介绍基础知识，这些知识对于理解文档的其他部分已经足够。省略了许多细节和替代方案。


    ### 3.1. 启动过程


    所有 PC 系统通过执行 ROM（具体为 BIOS）中的代码启动启动，以加载启动驱动器 0 柱面 0 扇区。启动驱动器通常是软盘驱动器（在 DOS 中指定为
    A:，在 Linux 中指定为 /dev/fd0）。BIOS 随后尝试执行该扇区。在大多数启动盘上，0 柱面 0 扇区包含其他内容：


    - 来自如 LILO 等引导加载器的代码，它定位内核并执行它以正式启动系统；

    - 操作系统内核（如 Linux）的开头。


    如果 Linux 内核被原始拷贝（raw-copied）到软盘上，磁盘的第一个扇区将是 Linux 内核本身的第一个扇区。该扇区将通过从启动设备加载内核的其余部分来继续启动过程。


    当内核完全加载后，它会初始化设备及其内部数据结构。一旦完全初始化，它会查询镜像中一个名为 `ramdisk word` 的特殊位置。这个字告诉它如何以及在何处找到其根文件系统。根文件系统是一个挂载为
    `/` 的简单文件系统。必须告诉内核去哪里寻找根文件系统；如果它找不到可加载的镜像，它就会停止。


    在某些从软盘启动的情况下，根文件系统被加载到 ramdisk（内存磁盘）中，ramdisk 是系统像磁盘一样访问的内存。内存的速度比软盘快几个数量级，因此从
    ramdisk 运行系统非常快。此外，内核可以将压缩的文件系统从软盘加载到 ramdisk 中，从而允许更多的文件被挤入磁盘中。


    一旦根文件系统被加载并挂载，您将看到类似这样的消息：


    ```

    VFS: Mounted root (ext2 filesystem) readonly.

    ```


    一旦系统加载了根文件系统，它就会尝试执行 `init` 程序（位于 `/bin` 或 `/sbin` 中）。`init` 读取其配置文件 `/etc/initab`，寻找指定标识的行，并执行命名的脚本。`sysinit`
    脚本通常类似于 `/etc/rc` 或 `/etc/init.d/boot`。该脚本是一系列命令的 Shell，可以设置系统服务，例如在硬盘上运行 `fck`、加载必要的内核模块、初始化网络以及挂载
    `/etc/fstab` 中提到的磁盘。


    此脚本调用各种其他服务进行模块化初始化。例如，在常见的 SysInit 中，`/etc/rc` 目录包含一个复杂的子目录结构，其文件指定了如何启用和关闭系统服务。然而，在启动盘上，`sysinit`
    脚本通常非常简单。


    当 `sysinit` 脚本返回给 `init` 时，`init` 进入 `inittab` 中 `initdefault` 关键字指定的默认运行级别。运行级别通常指定如
    `getty` 的程序，它负责处理通过控制台和tty 的通信。是 `getty` 程序打印了熟悉的 `login:` 提示。`getty` 程序随后调用 `login`
    程序来处理验证并设置用户会话。


    ### 3.2. 磁盘类型


    回顾基础启动过程后，我们现在可以定义涉及的各种磁盘。我们将磁盘分为四类。此处及整个文档中的讨论除非另有说明，使用的术语 `disk` 指软盘，尽管大部分讨论也同样适用于硬盘。


    **boot（启动盘）**

    - 包含可以启动的内核的磁盘。该磁盘可用于启动内核，内核可能会在另一个磁盘上加载根文件系统。启动盘上的内核通常必须知道去哪里寻找其根文件系统。

    - 启动盘通常从另一块软盘加载根文件系统，但启动盘也可以被设置为硬盘的根文件系统。这通常在测试新内核时完成（事实上，`make disk` 会从内核源码自动创建这样一个启动盘）。


    **root（根磁盘）**

    - 带有运行 Linux 系统所需文件的文件系统的磁盘。此类磁盘不一定包含内核或引导加载器。

    - 一旦内核启动，根磁盘就可以独立于任何其他磁盘来运行系统。通常根磁盘会自动复制到 ramdisk 中。这使得根磁盘的访问快得多，并为工具磁盘释放出驱动器空间。


    **boot/root**

    - 同时包含内核和根文件系统的磁盘。换句话说，它包含了在没有硬盘的情况下启动和运行 Linux 系统所需的所有内容。这种磁盘的优点是它紧凑，所有所需内容都在单个磁盘上。然而，随着所有内容不断增大，将所有内容都放入单个软盘中变得越来越困难，即使使用了压缩。


    **utility（工具磁盘）**

    - 包含文件系统的磁盘，但不打算挂载为根文件系统。它是一个额外的数据磁盘。您可以使用此类磁盘来携带由于根磁盘空间不足而无法容纳的额外工具。


    总来说，当我们谈论`building a bootdisk` 时，意味着同时创建启动（内核）和根（文件）部分。它们可以合在一起（单个 boot/root 磁盘），也可以分开（启动+根磁盘）。对于救援软盘，最灵活的方法可能是使用分开的启动和根软盘，以及一个或多个工具磁盘来处理溢出部分。

