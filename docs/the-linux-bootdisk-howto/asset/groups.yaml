    # The Linux Bootdisk HOWTO


    titled `References`.


    Q: How do I update my root diskette with new files?


    A: The easiest way is to copy the filesystem from the rootback to the DEVICE you
    used (from Section 4.2). Then mount the filesystem and make the changes. You have
    to remember where your root filesystem was and how many blocks it occupied.


    ```

    dd if=/dev/fd0 bs=lk skip=ROOTBEGIN count=BLOCKS | gunzip > DEVICE

    mount -t ext2 device /mnt

    ```


    After making the changes, proceed as in Section 4.7 and transfer the root filesystem
    to the disk. You should not have re-transfer the kernel or re-compile the ramdisk
    if you do not change the starting position of your new root filesystem.


    Q: How do I remove LILO so that I can use DOS to boot again?


    A: This is not really a Boottopic, but it is asked often. Within Linux, you can
    run:


    ```

    /sbin/lilo -u

    ```


    You can also use the dd command to copy the backup saved by LILO to the boot sector.
    Refer to the LILO documentation if you need to.


    Within DOS and Windows you can use the DOS command:


    ```

    FDISK /MBR

    ```


    MBR stands for Master Boot Record. This command replaces the boot sector with
    a clean DOS one, without affecting the partition table. Some purists disagree
    with this, even though the author of LILO, Werner Almesberger, suggests it. It
    is easy, and it works.


    Q: How can I boot if I lost kernel and my boot disk?


    A: If you don''t have a boot disk, probably the easiest method is as described
    above to obtain a Slackware kernel for your controller type (IDE or SCSI) "How
    do I make a boot disk with a XXX driver". You can then boot your computer using
    this kernel, repair whatever damage there is.


    The kernel may not have the root device to disk type and partition you want. For
    example, Slackware''s generic kernel has the root device to /dev/sda2, whereas
    your root Linux partition is to /dev/sda8. In this case the root device in the
    kernel will have to be changed.


    You can change the root and ramdisk settings in the kernel even if you have a
    kernel, and some other operating system, such as DOS.


    rdev changes kernel settings by changing the values at offsets in the kernel file,
    so you can do the same if you have a hex editor available on whatever systems
    you do running — for example Norton Disk Editor under DOS. You then need to check
    and if necessary change the values in the kernel at the following:


    HEX DEC DESCRIPTION

    0x1F8 504 Low byte of RAMDISK word

    0x1F9 505 High byte of RAMDISK word


