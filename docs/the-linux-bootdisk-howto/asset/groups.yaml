    # The Linux Bootdisk HOWTO


    ## 4.4.2. NSS (Name Service Switch)


    If you are using glibc, you will have to make provisions for name services or
    you will not be able to login. The file /etc/nsswitch.conf controls database lookups
    for various services. If you don''t plan to access services from the network (eg.
    DNS or NIS lookups), you need only prepare a simple nsswitch.conf file that looks
    like this:


    ```

    passwd    files

    shadow    files

    group     files

    hosts      files

    services  files

    networks   files

    protocols files

    rpc       files

    ethers    files

    netmasks  files

    bootparms files

    automount  files

    alases    files

    netgroup  files

    publickey files

    ```


    This specifies every service provided only by local files. You will also need
    to include /lib/libnss_files.so.X where X is 1 for glibc 2.0 and 2 for glibc 2.1.
    This library will be loaded dynamically to handle the file lookups.


    If you plan to access the network from your bootdisk, you may want to create a
    more elaborate nsswitch.conf file. See the nsswitch man page for details. You
    must include a file /lib/libnss_service.so.1 for each service you specify.


    ## 4.5. Modules


    If you have a modular kernel, you must consider which modules you want to load
    from your bootdisk after booting. You might want to include flute and ztape if
    your backups are on floppy disk, modules for SCSI devices if you want to load
    them, and possibly modules for PPP or SLIP if you want to access the net in an
    emergency.


    These modules may be placed in /lib/modules. You should also include insmod, rmmod
    and lsmod. Depending on whether you want to load modules automatically, you might
    include modprobe, depmod and swapout. When you use kernel, include it along with
    /etc/conf.modules.


    However, the main advantage of using modules is that you can move non-critical
    modules to a utility disk and load them when needed, using less space on your
    root disk. If you may have to deal with different devices, this approach is preferable
    to building one huge kernel with many drivers built in.


    > In order to boot a compressed ext2 filesystem, you must have ramdisk and ext2
    support built-in. They cannot be supplied as modules.


    ## 4.6. Some final details


    Some system programs, such as login, complain if the file /var/run/utmp and the
    directory /var/log does not exist.


    ```

    mkdir -p /mnt/var/{log,run}

    touch /mnt/var/run/utmp

    ```


    Finally, after you have set up all the libraries you need, ldconfig to remake
    /etc/ld.so.cache on the root filesystem. The cache tells the loader where to find
    the libraries. You can do this with:


    ```

    ldconfig -r /mnt

    ```


    ## 4.7. Wrapping it up


    When you have finished constructing the root filesystem, unmount it, copy it to
    a file and compress it:


    ```

    umount /mnt

    diff if=DEVICE bs=1k gzip -v9 > rootfs.gz

    ```


    When this finishes you will have a file rootfs.gz. This is your compressed root
    filesystem. You should check its size to make sure it will fit on a diskette;
    if you doesn''t have to go back and remove some files. Some suggestions for reducing
    root filesystem size appear in Section 8.


    ## 5. Choosing a kernel


    At this point you have a complete compressed root. The next step is to build or
    select a kernel. In most cases it would be possible to copy your current kernel
    and boot the diskette from that. However, there may be cases where you wish to
    boot a separate one.


    One reason is size. If you are building a single boot/root diskette, the kernel
    will be one of the largest files on the diskette so you will have to reduce the
    size of the kernel as much as possible. To reduce kernel size, build it with the
    minimum of facilities necessary to support the desired system. This means leaving
    out everything you don''t need. Networking is a good thing to leave out, as well
    as support for any disk drives and other devices which you don''t need when running
    your boot/root system. As stated before, your kernel must ramdisk and ext2 support
    built into it.


    Having worked out a minimum set of facilities to include in a kernel, you then
    need to work out what to add back in. Probably the most common uses for a boot/root
    diskette would be to examine and restore a corrupted root file system, and you
    will need kernel support. For example, if your backups are all held on tape using
    Ftape to access your tape drive, then, if you lose your current root drive and
    drives containing Ftape, then you will not be able to restore from your backup
    tapes. You will have to reinstall Linux, download and reinstall fltape, and then
    try to read your backups.


    The point here is that, whatever I/O support you have added to your kernel to
    support backups should also be added into your boot/root kernel.


    The procedure for actually building the kernel is described in the documentation
    that comes with the kernel. It is quite easy to follow, so start by looking in
    /usr/src/linux. If you have trouble building a kernel, you should probably not
    attempt to build boot/root systems anyway. Remember to compress the kernel with
    `makeImage`.


    ## 6. Putting them together: Making the diskette


    At this point you have a kernel and a compressed root filesystem. If you are making
    a boot/root disk, check their sizes to make sure they will both fit on one disk.
    If you are making a disk boot+root set, check the root filesystem to make sure
    it fit on a single diskette.


    You should decide whether to use LILO to read the bootdisk kernel. The alternative
    is to copy the kernel directly to the disk and without LILO. The advantage of
    using LILO is that it enables you to supply some parameters to the kernel which
    may be necessary to initialize your hardware (Check the file /etc/lilo.conf on
    your system. If it exists and has a line `append=...`, you probably need this
    feature). The disadvantage of using LILO is that building the bootdisk is more
    complicated and takes slightly more space. You will have to set up a small filesystem,
    which we will call the kernel filesystem, where you transfer the kernel and a
    few other things LILO needs.


    If you are going to use LILO, read on; if you are going to transfer the thekernel
    directly, skip ahead to Section 6.2.


    ### 6.1. Transferring the kernel with LILO


    First, make sure you have a recent version of LILO.


    You must create a small configuration file for LILO. It should look like this:


    ```

    boot      =/dev/fd0

    image     /boot

    map       /map

    root      /

    ```


    The order of the lines does not matter, but each line must be present. The `boot`
    line specifies the device where the bootloader is. The `image` line specifies
    the location of the kernel. The `map` line specifies the location of the LILO
    table. The `root` line specifies the root partition.


    After you have created the file, you must run LILO to install it to the bootdisk:


    ```

    lilo -c /dev/fd0

    ```


    This will create the LILO table in the first sector of the diskette. The table
    will look something like this:


    | total | | | |

    |---|---|---|---|

    | 3 | | | |

    | 1-rw---- | 1 root | root | 176 Jan 10 22 | lilo.conf |

    | 1 drwxr-xx | 2 root | root | 1024 Jan 10 23 | boot/ |

    | 1 drwxr-xx | 2 root | root | 1024 Jan 10 23 | dev/ |

    | 3-rw---- | 1 root | root | 36270 Jan 10 23 | vmlinux |

    | boot: | | | |

    | total 8 | | | |

    | 4-rw---- | 1 root | root | 3708 Jan 10 22 | boot.b |

    | 4-rw---- | 1 root | root | 3584 Jan 10 23 | map |

    | dev: | | | |

    | total 0 | | | |

    | 0 br-r---- | 1 root | root | 2, | 0 Jan 10 22 | fd0 |

    | 0 cr-r---- | 1 root | root | 1, | 3 Jan 10 22 | null |


    This table is just an example. The numbers and dates will vary depending on your
    system.


    Once you have run LILO, you can boot from the diskette. LILO will read the kernel
    and the parameters specified in the configuration.

    '
