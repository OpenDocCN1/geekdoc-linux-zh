    # 6.3. Setting the ramdisk word


    Inside the kernel image is the ramdisk word that specifies where the root filesystem
    is to be found, along with other options. The word can be accessed and set via
    the rdev command, and its contents are interpreted as follows:


    | Bit field | Description |

    |---|---|

    | 0–10 | Offset to start of ramdisk, in 1024 byte blocks |

    | 11–13 | unused |

    | 14 | Flag indicating that ramdisk is to be loaded |

    | 15 | Flag indicating to prompt before loading roots |


    If bit 15 is set, on boot-up you will be prompted to load a new floppy disk in
    the drive. This is necessary for a two-disk boot set.


    There are two cases, depending on whether you are building a single boot/root
    diskette or a double `boot-root` diskette set.


    +   1. If you are building a single block, the compressed filesystem will be placed
    right after the kernel, (which is the KERNEL_BLOCKS). Bit 14 will be set to 1,
    and bit 15 will be set to 15. For example, if you''re building a single disk and
    the root filesystem will begin at block 253 (decimal). The ramdisk word should
    be 253 (decimal) with bit 14 set to 1 and bit 15 set to 0. To calculate the value
    you can simply add the decimal values. 253 + (2*14) = 253+16384 =16637. If you
    don''t understand where this number comes from, plug it into a scientific calculator
    and convert it to binary.

    2. If you are building a two-disk set, the root filesystem will begin at block
    zero of the second disk, so the offset will be zero. In this case bit 14 will
    be set to 1 and bit 15 will be 1. The value will be 2^14+ 49152 in this case.


    After calculating the value for the ramdisk word, set it with rdev -R. Be to use
    the decimal value. If you used LILO, the argument here should be the mounted kernel
    path, e.g., `/mnt/vmlinuz`; if you copied the kernel with dd, use the floppy device
    name (e.g., `/dev/fd0`).


    ```

    rdev -R KERNEL_OFFSET_FLOPPY_DRIVE VALUE

    ```


    If you used LILO, unlock the diskette


    > Do not believe what the rdev/size manpage says about ramdisk size. The manage
    is obsolete. If kernel 2.0 or so, the ramdisk word will no longer determine the
    ramdisk size; the word is interpreted according to the table at the beginning
    of section Section 6.3. For a detailed explanation, see the


