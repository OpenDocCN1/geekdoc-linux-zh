  mdcn: "\n\n## 4. 构建根文件系统\n\n创建根文件系统涉及选择系统运行所需的文件。在本节中，我们将描述如何构建压缩根文件系统。另一种不常用的选项是在直接挂载为根的磁盘上构建未压缩的文件系统；这种替代方案在第\
    \ 9.1 节中描述。\n\n## 4.1. 概述\n\n根文件系统必须包含支持完整 Linux 系统所需的所有。为了实现这一点，磁盘必须包含 Linux\
    \ 系统的最低要求：\n\n- 基础文件系统结构。\n- 最小目录集：/dev/.proc, /bin, /etc, /lib, /usr, /tmp。\n\
    - 基础工具集：sh, ls, cp, mv 等。\n- 最小配置集：rc, initab, fstab 等。\n- 设备：/dev/hd*, /dev/tty*,\
    \ /dev/fd0 等。\n- 提供工具程序所用基础运行的运行时库。\n\n当然，任何系统只有在你可以在上面运行程序时才是有用的，而根磁盘只有在你可以执行诸如以下操作时才变得变得用：\n\
    \n- 在另一个驱动器上检查系统，以检查硬盘上的根文件系统，你需要能够从另一个设备启动 Linux，就像你使用根磁盘系统那样。然后你可以在原始根驱动器未挂载时对其运行\
    \ `fsck`。\n- 使用 cpio、tar、gzip 和 fate 等归档和压缩工具从备份中恢复根驱动器的全部或部分内容。\n\n我们描述如何构建压缩文件系统，是因为它在磁盘上是压缩的，在启动后，它会被解压到内存中。通过压缩文件系统，你可以在磁盘上放置许多文件（约六兆字节）。因为文件系统比磁盘大得多，因此无法在磁盘上构建。我们在其他地方构建它，对其进行压缩，然后将其复制到磁盘上。\n\
    \n## 4.2. 创建文件系统\n\n为了构建这样的根文件系统，你需要一个足够大的能够存放所有备份文件的空闲设备。有几种选择：\n\n- 使用 ramdisk\
    \ (DEVICE = /dev/ram0)。在这种情况下，内存被模拟磁盘驱动器。ramdisk 必须足够大以容纳适当大小的文件系统。如果你使用 LILO，配置文件\
    \ (/etc/lilo.conf) 中类似 `RAMDISK = nnn` 的行决定了可以分配给 ramdisk 的最大内存。默认值为 4096K，应该足够了。你可能不会尝试在内存小于\
    \ 8MB 的机器上使用此类 ramdisk。检查确保你有类似 /dev/ram0、/dev/ram 或 /dev/ramdisk 的设备。如果没有，使用\
    \ `mknode` 创建 /dev/ram0（主设备数 1，次设备 0）。\n- 如果你有一个足够大的未使用磁盘分区（几兆字节），这是可以接受的。\n-\
    \ 使用回环设备 (loopback device)，它允许磁盘文件被视为设备。使用回环设备，你可以在硬盘上创建一个三兆字节的文件并在其上构建文件系统。\n\
    \n输入 `man losetup` 获取关于使用回环设备的说明。如果你没有 `losetup`，可以从 `util-linux` 包中连同兼容版本的 `mount`\
    \ 和 `unmount` 一起获取，目录地址为 http://ftp.win.tue.nl/pub/linux/utils-linux/ \n\n如果你的系统上没有回环设备\
    \ (/dev/loop0, /dev/loop1 等)，你将不得不使用 `mknod /dev/loop0 b 7 0` 创建一个。一旦你安装了这些特殊的挂载和卸载二进制执行文件，在具有足够容量的硬盘上创建一个临时文件（例如\
    \ /tmp/fsfile）。你可以使用以下命令：\n\n```\ndd if=/dev/zero of=/tmp/fsfile bs=1k count=\n\
    ```\n来创建一个 nn 块文件。\n\n将下方的 `DEVICE` 替换为实际的文件名。当你发布 `mount` 命令时，必须包含 `-o loop`\
    \ 选项来挂载回环设备。\n\n在选择这些选项之一后，使用以下命令准备 `DEVICE`：\n\n```\ndd if=/dev/zero of=DEVICE\
    \ bs=1k count=4096\n```\n\n此命令会将设备清零。\n\n> 清零设备至关重要，因为文件系统将进行压缩，所以所有未分配部分都应该用零填充以达到最大压缩率。每你在文件系统上移动或删除文件时，请记住此点。文件系统会释放数据块，但不会再次将它们清零。如果你进行了大量的删除和复制，你的压缩文件系统最终可能会变得比需要的大得多。\n\
    \n接下来是文件系统。Linux 内核识别两种根磁盘文件类型，以便自动复制到 ramdisk。两者都是 ext2，其中首选 ext2。如果你使用 ext2，发现使用\
    \ `-N` 选项来指定比默认更多的 inode 很有用：建议 `-N 2000` 以防你耗尽 inode。或者，你可以通过删除不必要的 /dev 文件来节省\
    \ inode。`mke2fs` 默认在 1.44Mb 磁盘上创建 360 个 inode。这对于你的内核根磁盘来说是充裕的，但如果你包含了 /dev 中的所有设备，你将很容易超过\
    \ 360。使用压缩根允许更大的文件系统，并且默认情况下有更多的 inode，但你可能仍然需要减少文件数量或增加 inode 数量。\n\n所以你将使用的命令类似于：\n\
    \n```\nmke2fs -m 0 -N 2000 DEVICE\n```\n\n（如果你正在使用回环设备，应提供你正在使用的磁盘文件来替换 `DEVICE`。）\n\
    \n`mke2fs` 命令将自动检测空间并相应进行配置。`-m 0` 参数防止它为根目录保留空间，并在磁盘上提供更多可用空间。\n\n接下来，挂载设备：\n\
    \n```\nmount -t ext2 DEVICE /mnt\n```\n\n（如果 /mnt 不存在，你必须创建该目录。）在剩余章节中，所有目标目录名称均假定相对于\
    \ /mnt。\n\n## 4.3. 填充文件系统\n\n这是一组合理的根文件系统目录设置 [1]：\n\n- /dev -- 设备文件，执行 I/O 所需\n\
    - /proc -- proc 系统所需的目录存根\n- /etc -- 系统配置文件\n- /sbin -- 关键二进制文件\n- /bin -- 视为系统组成的基础二进制文件\n\
    - /lib -- 提供运行支持的共享库\n- /mnt -- 用于在其他磁盘维护的挂载点\n- /usr -- 额外的工具和应用程序\n\n这三个目录在根文件系统中是空的，因此它们只需要用\
    \ `mkdir` 创建。/proc 目录在 proc 挂载之前基本上是一个占位符。/mnt 和 /usr 目录仅是启动/根系统运行后使用的挂载点。因此，这些目录也只需要创建。\n\
    \n其余四个目录将在后续章节中描述：\n\n### 4.3.1. /dev\n\n对于任何 Linux 系统，一个包含系统使用的所有设备文件的 /dev 目录是强制性的。该目录本身是一个普通目录，可以使用\
    \ `mkdir` 以普通方式创建。然而，设备文件必须以特殊方式创建，即使用 `mknod` 命令。\n\n不过有一个快捷方法，即从你硬盘的 /dev 目录拷贝设备文件。唯一的要求是使用\
    \ `-R` 选项复制设备特殊文件。这将复制目录而不复制文件内容。务必使用大写的 `R`。例如：\n\n```\ncp -dPR /dev/[0-9]* /mnt\n\
    cp -dPR /dev/tty[0-6] /mnt\n```\n\n假设设备已挂载到 /mnt。`-d` 确保链接作为链接复制，而不是目标文件，从而保留所有权。\n\
    \n### 4.3.2. /etc\n\n/etc 目录包含配置文件。它包含的内容取决于你打算运行的程序。在大多数系统中，这些文件可以分为三类：\n\n1.\
    \ 始终需要的，例如 rc、fstab、passwd。\n2. 可能需要的，但谁也不太确定。\n3. 溜入的垃圾文件（Junk）。\n\n通常可以通过命令识别出不是必必需的文件：\n\
    \n```\nls -ltru\n```\n\n这将按最后访问时间的倒序列出文件，因此如果任何文件未被访问，它们可以从根磁盘中省略。\n\n"
