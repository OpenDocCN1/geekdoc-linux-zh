    # # 8. Reducing root filesystem size


    One of the main problems with building bootisks is getting everything to one (or
    even two) diskettes. Even when files are compressed this can be very difficult,
    because Linux system components keep growing. Here are some common techniques
    used to make everything fit.


    # ## 8.1 Increase the diskette density


    By default, floppy diskettes are formatted at 1440K, but higher density formats
    are possible. Whether you can boot from higher density depends mostly on your
    BIOS. **fdformat** will format disks for the following sizes: 1600K, 1680K, 1722K,
    1743K, 1760K, 1840K, and 1920K. See the **fdformat** man page and `/usr/src/linux/Documentation/devices.txt`.


    But what density will your machine support? Here are some (lightly edited) answers
    from Alain Knaff, the author of idutils.


    > This is an issue of the BIOS reader rather than the physical format of the disk.
    If the BIOS decides that any sector number greater than 18 is bad, then there
    is not much we can do. Instead, of assembling the BIOS, trial and error will be
    the only way to find out. However, if the BIOS supports ED disks (extra density:
    36 sectors/track and 2.88MB), there''s a chance that 1722K disks are supported
    as well.


    Superformatted disks with 21 sectors/track are likely not bootable; those use
    sectors of non-standard sizes (1024 bytes in a sector instead of 512, for example),
    and are likely not bootable. It should be possible to write a special bootsector
    program to work around this. If I remember correctly, the DOS 2m utility has such
    a beast, as does OS/2''s XDF utilities.


    Some BIOSes artificially claim that any sector number greater than 18 must be
    in. These would not be bootable. The best way to test would be to test a DOS or
    linux disk as 1722K and make it bootable. If LILO, use the option linear (or else
    LILO would assume that the disk is the 18 sectors/track, and the disk will fail
    to boot even if supported by the BIOS).


    # ## 8.2 Replace common utilities with BusyBox


    Root filesystem space is consumed by GNU system utilities such as **cat**, **chmod**,
    **cp**, **dd**, **etc**. The **BusyBox** project was designed to provide minimal
    replacements for these common system utilities. BusyBox uses a single executable
    file, `/bin/busybox`, about 150K, which implements the functions of these utilities.
    You create symlinks from different utilities to this executable; busybox sees
    how it was called and invokes the correct code. BusyBox also includes a basic
    shell. BusyBox is available in binary packages for many distributions, and source
    code is available from the [BusyBox site].'
  - '[PAGE 26]


    # 8.3. Use an alternate shell


    Some of the popular shells for Linux, such as bash and tsh, are large and require
    many libraries. If you don''t use the BusyBox shell, you should still consider
    replacing your shell away. Some light-weight alternatives are ash, lsh, kiss and
    smash, which are much smaller and require few (no) libraries. Most of these replacement
    shells are available from http://www.ibiblio.org/pub/Linux/system/shells/. Make
    sure any shell you use is capable of running commands in all rc files you include
    on your bootdisk.


    # 8.4. Strip libraries and binaries


    Many libraries and binaries are distributed with debugging information. Running
    file on these files will tell you `not stripped` if so. When copying binaries
    to your root filesystem, it is good practice to use:


    ```

    objcopy --strip-all FROM TO

    ```


    > When copying libraries, be sure to use strip-debug instead of strip-all.


    # 8.5. Move files to a utility disk


    If some of your binaries are not needed immediately to boot or login, you can
    move them to a utility disk. See Section 9.2 for details. You may also consider
    modules to a utility disk as well.'
  - '[PAGE 27]


    # 9. Miscellaneous topics


    # 9.1. Non-ramdisk root filesystems


    Section 4 gave instructions for building a compressed root filesystem which is
    loaded to ramdisk when the system boots. However, this method has many advantages
    so it is commonly used. However, systems with memory cannot afford the RAM needed
    for this, and they must use root filesystems mounted directly from the diskette.


    Such filesystems are actually easier to build than compressed root filesystems
    because they can be built on a diskette rather than some other device, and do
    not have to be compressed. We will outline the procedure as it differs from the
    instructions above. If you choose to do this, keep in mind that you will have
    much space available.


    +   1. Calculate how much space you will have available for root files. If you
    are building a single boot/root disk, you must fit all the kernel plus all the
    root filesystems on the disk.

    2. Using mkefs, create a root filesystem on a diskette of the appropriate size.

    3. Populate the filesystem as described.

    4. When, unmount the filesystem and transfer it to a data file but do not compress
    it.

    5. Transfer the kernel to a floppy diskette, as described above. When calculating
    the ramdisk word, set bit 14 to zero, to indicate that the root filesystem is
    not to be loaded to ramdisk. Run the rdev as described.

    6. Transfer the root filesystem as before.


    There are several choices you can take. If you are building a two-disk system,
    you can build the complete root filesystem directly on the second disk and do
    not need to transfer it to a hard disk and back. Also, if you are building a single
    boot/root disk and using LILO, you can build a single filesystem on the entire
    disk, containing the kernel, LILO files and root files, and simply LILO as the
    last step.


    # 9.2. Building a utility disk


    A utility disk is relatively easy — simply create a filesystem on a formatted
    disk and copy files to it. With such a bootdisk, mount it manually after the system
    is booted.


    In the instructions above, we mentioned that the utility disk could be mounted
    as /usr. In this case, binaries could be placed into a /bin directory on your
    utility disk, so placing /usr/bin in your path will access them. Additional libraries
    needed by the binaries are placed in /lib on the utility disk.


    There are important points to keep in mind when designing a utility disk:


    +   1. Do not place system binaries or libraries onto the utility disk, since
    it will not be mountable until after the system has booted.

    2. You cannot access a floppy disk and a floppy drive simultaneously. This means
    that if you have a floppy drive, you will not be able to access it while your
    utility disk is mounted.

    3. Access to files on the utility disk will be.


    Appendix D shows a sample of files on a utility disk. Here are some ideas for
    you to find useful: programs for examining and manipulating disks and filesystems
    (format, fdisk) (mkefs, fsck, debugfs),


    9. Miscellaneous topics'
