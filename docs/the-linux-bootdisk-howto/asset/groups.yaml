    \ relevant to a diskette system environment.\n\n## 4.3.3 /bin and sbin\n\n/bin\
    \ directory is a convenient place for extra utilities you need to perform basic\
    \ operations, utilities such as ls, mv cat and dd. See Appendix C for an example\
    \ list of files that go in a /bin/sbin directories. It does not include any of\
