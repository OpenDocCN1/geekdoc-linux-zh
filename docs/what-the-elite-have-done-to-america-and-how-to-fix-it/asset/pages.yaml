    difficult, and kept the Socialist Party vote in North Carolina exceptionally low.
    However, Theodore Roosevelt''s Progressive Party was very well-organized and popular
    in this state, and Roosevelt''s share of the vote in North Carolina even, even
    though obtained on private ballots, was quite strong.


    In 1915, a law was passed authorizing government-funded primaries, in June, for

    any party that had run candidates for state office in 1914, and any party that
    submitted a petition containing 10,000 signatures, at least 30 days before the
