  md: 'Two separate United States laws are known as the Glass-Stagall Act.


    Both bills were sponsored by Democratic Senator Carter Glass of Lynchburg, Virginia,
    a former Secretary of the Treasury, and Democratic Congressman Henry B. Steagall
    of Alabama, Chairman of the House Committee on Banking and Currency.


    The first Glass-Stagall Act was passed in February, 1932 in an effort to stop
    deflation and expanded the Federal Reserve''s ability to offer rediscounts on
    more types of assets and issue government bonds as well as commercial paper. The
    second Glass-Stagall Act was passed in 1933 in reaction to the collapse of a large
    portion of the American commercial banking system in early 1933.


    The first Glass-Stagall Act was the first time that currency (non-specie, paper
    currency etc.) was permitted to be allocated for the Federal Reserve System.


    The second Glass-Stagall Act, passed on 16 June 1933, and officially named the
    separation of bank types according to their business (commercial and investment
    banking), and it founded the Federal Deposit Insurance Corporation for insuring
    bank deposits. Literature in economics usually refers to this simply as the Glass-Steagall
    Act, since it had a stronger impact on U.S. banking regulation.


    The argument for preserving Glass-Steagall (as written in 1987):


    +   1. Conflicts of interest characterize the granting of credit -- lending --
    and the use of credit -- investing -- by the same entity, which led to abuses
    that originally produced the Act.


    +   2. Depository institutions possess enormous financial power, by virtue of
