  md: '# CHAPTER 6


    # Clearing and Zapping


    There is a difference between clearing a chunk of the screen and deleting text
    in NCurses. That difference is that clearing merely erases, replacing the text
    with blank characters. Deleting, on the other hand, removes the text and tightens
    up the hole, which is demonstrated with the `delch()` and `delen()` functions
    in Chapter 5.


    In this chapter, you’re introduced to the handful of NCurses commands to erase
    text without scrolling or tightening up the holes. I call it “Clearing and Zapping,”


    # Commands to Erase Chunks of the Screen


    NCurses sports four functions to clear or erase any chunk of the screen:


    ```

    erase()

    clear()

    clrtobot()

    clrtoeel()

    ```


    The `erase()` and `clear()` functions do pretty much the same thing: clear the
    screen. Between the two, the `clear()` function is more thorough, though it has
    more internal overhead.'
