  md: '# Chapter 8 = Windows, Windows Everywhere! 91


    The window (real) version of your pseudo function has the same name as the pseudo
    function


    # The Other Prefix, mv


    NCurses actually sports two prefixes for its text output commands. In addition
    to w, specifying a window there is also mv, which was explained in Chapter 4.
    When you prefix a command with mv, the first two arguments are row and column
    (x) to position the cursor before outputting text. Therefore:


    ```

    addch(''Q'');

    ```


    The preceding command outputs a Q wherever cursor currently happens to be.


    ```

    mvaddch(5,10,''Q'');

    ```


    The preceding command places a cursor at position 5,10 on the screen. That''s
    the sixth row, 11th column. Remember that the first row and column are numbered
    zero.


    To direct addch() to a specific window and a specific location, this format is
    used:


    ```

    mvaddch(stdscr,5,10,''Q'');

    ```


    The mv prefix always comes first; after all, the real command waddch(), not addch().
    But, inside the parenthesis, the window''s name comes first, as shown above. You''ll
    probably forget that from time to time, but the slew of pointer error messages
    generated will help remind you.


    # Making Windows


    Creating a new window is simple, thanks to the newwin() function:


    ```

    newwin(rows,cols,y_org,x_org)

    ```


    The newwin() function tells the window''s size in rows and cols (by horizontal
    characters) and where the window is located on the terminal screen, given that
    the upper-left corner of the terminal is location 0,0.


    The range of values for rows, cols, y_org, and x_org depends on your computer''s
    memory, and of course, screen size. The smallest you can go is a one-character
    window.'
