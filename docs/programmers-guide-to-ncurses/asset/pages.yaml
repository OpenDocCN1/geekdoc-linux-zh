  md: '# Appendix A ■ NCurses Library Reference 189


    # Notes


    It helps you understand this function as add-chstr; add a ctypes string to the
    screen. For displaying a standard character string to the screen, use addstr()
    instead.


    Unlike other output functions, text displayed by addchstr() does not wrap from
    one to another. Any excess text displayed beyond the last column in the window
    just doesn''t appear.


    addchstr() does not interpret the control characters \t, \n, or \b, nor will it
    display control characters prefixed with a ^, as other NCurses output functions.


    Placing ctypes characters on the screen with the addchstr() function is faster
    than using the addstr() function.


    The ctypes array is terminated with a \0 value, just as char arrays, and strings,
    are terminated.


    Try not to use values of n larger than the string. Doing so results in random
    data displayed.


    # Examples


    ```

    addchstr(fline,25);

    ```


    This statement puts the first 25 characters of the ctypes string fline to the
    screen at the current cursor position.


    ```

    mvaddchstr(0,xc,title);

    ```


    This statement puts the ctypes string title at row zero and the column represented
    by variable xc.


    # Sample Program


    ```

    1 #include <ncurses.h>

    2 int main(void)

    3 {

    4

    5 ctypes[6] = { ''H'' | A_BOLD, ''e'', ''l'', ''l'', ''o'', ''\0'' };n6

    7 initscr();

    8

    9 addchstr(text);

    10 refresh();

    11 getch();

    12

    13 endwin();

    14 return 0;

    15 }

    ```'
