  md: "# Chapter 2 - Basic I/O, the NCurses Way 19\n\nInternally, the refresh() function\
    \ consists of two commands. The first is wrefresh(), which updates only the changed\
    \ portions of a window or the standard screen to the virtual screen. The second\
    \ half of the refresh() function, which makes the current screen match the virtual\
    \ screen's updates. Again, this is done to update the complete terminal screen\
    \ each time new text output, which can be maddeningly slow on some terminals.\n\
    \nAll this terminology (standard screen, current screen, virtual screen, wrefresh()\
    \ and doudate()) can be overwhelming. Don't let it get to you. It's merely the\
    \ internal mechanisms by which NCurses works. As another example, consider the\
    \ source code for GOODBYE.C as shown in Chapter 1:\n\n```\n#include <curses.h>\n\
    int main(void) {\n    initscr();\n    addstr('Goodbye, cruel C programming!');\n\
    \    refresh();\n    getch();\n\n    endwin();\n    return 0;\n}\n```\n\nIn line\
    \ 5, the initscr() function configures NCurses and creates both the stdscr and\
    \ curscr.\nText is written to the stdscr using the addstr() function in line 6.\n\
    The refresh() command in line 7 updates the virtual screen, which immediately\
    \ updates the current screen and, in end, the terminal window so that you can\
    \ see the text.\nIn line 8, everything pauses with getch(), waiting for the user\
    \ to press Enter.\nThewin() shuts down NCurses in line 10, but endwin() deserves\
    \ its own screen and explanation.\n\n# The initscr() Function's Exceptions\n\n\
    For starting out, it's easy to remember that initscr() is the function that initializes\
    \ NCurses for your code. initscr() isn't alone; it has a twin function called\
    \ newterm().nThe newterm() function sets up NCurses as initscr() does, but it\
    \ allows you more control over the input and output sources. Therefore, it's kind\
    \ of an advanced function, and if you're curious, you can look it up in Appendix\
    \ X. Otherwise, it does not appear in the tutorial portion of this book."
