    touchline() or touchwin() functions can handle this, followed by a wrefresh()
    of the background window.


    +   - Do not move subwindows using mvwin(). Subwindows share memory with the parent
    window, but the parent window is unaware of this. Therefore, when you move the
    subwindow, NCurses cannot update which text was moved in which window and the
    results can be disastrous.


    +   - Don’t confuse the mvwin() function with wmove(), which is used to move the
