  md: '# Appendix A ■ NCurses Library Reference 199


    Multiple attributes can be specified in a single attron() function by separating
    each with a | (logical OR).

    COLOR_PAIR(n) is also considered a text attribute, where n is a color pair defined
    by an init_pair() function earlier in the program.

    NULL is used in the attr_on() functions as a placeholder for the undefined option.


    Refer to the w prefix entry in this appendix for information on the win argument.


    # Return Value


    The return value is stated as “not important” according to the documentation.


    # Notes


    The new attributes are applied only to new text displayed after the attron() function.
    These attributes are in addition to any set by previous attron() or attrset()
    functions.


    Applying a new COLOR_PAIR value with attron() replaces previously defined text
    colors with the new colors.

    Only one COLOR_PAIR can be used at a time; COLOR_PAIR attributes cannot be combined,
    or other attributes can.


    Attributes affect the output of the addch(), addstr(), and printw() functions.

    Also refer to the Notes for attrset().


    # Examples


    ```

    attron(A_REVERSE);

