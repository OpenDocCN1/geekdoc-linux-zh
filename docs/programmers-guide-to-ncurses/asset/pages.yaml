    # Removing a Subwindow


    Subwindows are killed off just like regular windows, using the same win() function.
    Deleting a subwindow removes the subwindow''s internal structure (the thing WINDOW
    points at) but not the window''s data, because that information is shared with
    the parent window. Also, to visually remove the subwindow, the parent window must
    be touched and refreshed, as the following program in 9-4 demonstrates.


