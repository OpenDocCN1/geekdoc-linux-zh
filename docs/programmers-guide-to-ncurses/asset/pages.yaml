    # meta()


    The meta() function controls whether the keyboard is read in 7-bit or 8-bit mode.


    # Explanation


    Meta comes from old terminal keyboards that had a Meta key, similar to the Alt
    key on a PC or the Command key on a Mac. The Meta key was a special shift key
    used in combination with other keys to allow for extended input of keyboard commands.
    In many cases, the Meta key merged the 8th bit on input of standard keys. So the
    U key, which has a 7-bit value of 1010101 would have the 8-bit value 11010101
    when input with the Meta key pressed.


    # Man Page Format


    ```

    int meta (WINDOW *win, bool bf);

    ```


    # Format Reference


    win is the name of a WINDOW variable representing a window on the screen. The
    man page says this argument, however, is ignored.


    +   - bf is a Boolean value, TRUE to enable the reading of the 8th bit on input,
    FALSE to restrict character input to 7 bits.


    # Return Value


    ERR on failure, or OK or a value other than ERR on success.


    # Notes


    Setting meta() TRUE is the same as setting the CS8 flag for the terminal in POSIX.


    When the meta_off/rmm and meta_on/smm abilities are defined for the terminal,
    NCurses sends those signals to the terminal when you call meta(): smm is sent
    for meta() TRUE, and rmm is sent for meta() FALSE.'
  merge: -1
  pgno: 376
