  md: '# What Does the gcc Command?


    The gcc command ever outputs a slew of error messages or shows nothing.


    When you get a slew of error messages, you must re-edit the source file and try
    to work out whatever bugs you can. The compiler is brutally honest, but it''s
    also nice in that it gives you a line number to show where you (approximately)
    screwed up.


    When gcc does nothing, the source code is properly compiled and linked. This is
    what you want.


    In this case, I''ve tricked you into typing sloppy code so that you''ll see an
    error message. Something like:


    ```

    goodbye.c:6: macro ''addstr'' used with too many (2) args

    ```


    One variation of the gcc compiler yielded even more information:


    ```

    goodbye.c:45: macro ''addstr'' passed 2 arguments, but takes just

    ```


    These error messages are just oozing with information:


    +   - goodbye.c tells you that the error is in source code line.

    - The 6 tells you that the error is either in line 6 or the previous line. In
    the second example, the 45 tells you which column in the line is offensive — very
    specific.

    - Then the error message itself, something is apparently wrong with the code to
    call the addstr macro. Must fix.


    > NOTE If you didn''t see the error message, you probably have been coding C for
    some time and just put the addstr() function''s text in double quotes out of habit.
    Good for you!


    # Re-editing Your Source Code


    In programming you do more re-editing than editing. In this case, the error was
    on purpose so I could show you how the compiler displays an error message. The
    fix is easy: Just edit the GOODBYE.C source code again.


    Don''t forget to use your shell''s history (if available) to recall that editing
    command!'
