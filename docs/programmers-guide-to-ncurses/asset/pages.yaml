    # What’s Where on the Keyboard


    When the keypad () function has activated the keyboard''s extra keys, you can
    use the definitions in NCURSES.h to help your program read the keys.


    To determine which keys are available to you, refer to Table 7-1. A more complete
    list can be found in Appendix D.


    You might want to run some tests to ensure NCurses on your program can access
    the function keys. For example, to check for Function key 5, you would use:


    ```

    ch == KEY_F(5)

    ```


    as the comparison. Remember that whatever ch must be an int, not a char (that’s
    a common mistake).


    Also be aware that your operating system may still steal the function keys from
    your program. If so, use the raw() function in NCurses to get the function keys
    passed directly to your program. Refer to Appendix A for more information on the
    raw() function.


