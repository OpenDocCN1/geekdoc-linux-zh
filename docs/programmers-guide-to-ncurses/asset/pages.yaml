  md: '# 470 Appendix A ■ NCurses Library Reference


    # Return Value


    Upon success, a pointer is returned, which is saved in a WINDOW variable declared
    just as regular windows are declared. On failure, NULL is returned.

    (See NULL.)


    # Notes


    You shouldn''t really think of a subwindow as a real window. In fact, if you need
    a window, use newwin() or any of the window creation functions, to make a new
    window. The features available to real windows are far more rich and versatile.


    Subwindows are best put to use as a way to access a specific rectangle within
    a window. For example, you can apply any unique background to the subwindow or
    use its coordinates as handy offsets that would require over-calculate otherwise.
    Chapter 9 has more details.


    Subwindows can have their own subwindows.


    Remember that the begin_y and begin_x coordinates for the subwindow''s origin
    are relative to the standard screen, not the parent window.


    As with a real window, a subwindow cannot be larger than the standard screen,
    nor can any part of the window be off the screen.


    The smallest subwindow is one character by character.


    All commands that deal with windows also apply to subwindows. Though: refresh()
    is all that''s needed to initially display both the parent window and any subwindow(s).
    After that, however, calls to refresh() are required to update a subwindow.


    Subwindows do not have their own data in memory. Instead, they share memory with
    their parents. This leads to many drawbacks, among them: It''s possible for the
    parent window to overwrite text in a subwindow; and the subwindow must be deleted
    before removing the parent window. (See delwin()).


    # Examples


    ```

    footnote = subwin(stdscr,2,COLS,LINES-2,0);

    ```


    The statement creates a subwindow named footnote in the standard screen. The window
    occupies the bottom two rows of the screen from the left to right sides of the
    standard screen window. (See LINES.)


    ```

    menu_edit = subwin(menubar,12,20,2,43);

    ```'
