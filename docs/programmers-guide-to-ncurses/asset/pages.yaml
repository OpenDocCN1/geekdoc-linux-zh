  md: '# Appendix A ■ NCurses Library Reference 325


    Refer to the mv, mvw, and w prefix entries elsewhere in this appendix for information
    on the win, y, and x arguments.


    # Return Value


    ERR on failure, or OK if everything ends up happily ever after.


    # Notes


    insch() function inserts a character at the cursor''s position. It does not delete
    any character at that position, nor does it move the cursor''s location.

    Characters shifted off the right edge of the window by insch() are not wrapped
    to the next line. Those pushed off are lost.

    When you meant to put a character at a location without rearranging the rest of
    the text, use the addch() function.

    To insert a string of characters use the insstr() function. See insstr(). When
    inserting multiple characters remember to insert them backwards. That is, insert
    the last characters first; otherwise, the string inserted (one character at a
    time) appears drawstringcab.

    There is another NCurses function, inch(), which reads a character from a window
    (kind of opposite of addch()). Do not confuse inch() with insch()!


    # Examples


    ```

    mvinch(5,10, ''A'');

    ```


    After this statement, an A is placed on the screen at row 5, column 10. Any text
    from column 10 to the right edge of the window is scooted one notch to the right
    to make room for the A.


    ```

    winch(tally,c);

    ```


    Here, character variable c is placed at the cursor''s current position in window
    tally. Existing text on that row is moved over one notch to the right to make
    room.


    ```

    insch(''*'' | A_BOLD);

    ```


    Here, a bold * is inserted at the cursor''s current position in the standard screen.


    # Sample Program


    Refer to the entry for delch() for a sample program and output.'
