    The while loop continues to turn, for each key pressed at the keypad, but it will
    stop when the newline character is input (pressing Enter).


    ```

    keypad(editor,TRUE);

    ch = wgetch(editor);

    ```


    Above, the keypad() function is applied to the window editor, meaning special
    keys can be read. Those keys are then read using the wgetch() function, and stored
    in the ch variable, along with any alphanumeric keys read.


    # Sample Program


    +   1 #include <ncurses.h>

    2

    3 int main(void);'
