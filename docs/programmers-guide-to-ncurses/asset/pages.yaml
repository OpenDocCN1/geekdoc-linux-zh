  md: '# Appendix A NCurses Library Reference


    # Notes


    Because the first color number is zero, the highest valid color value is really
    COLORS-1.


    The typical PC uses eight basic colors — black, red, green, brown, blue, magenta,
    cyan, and white — so the value of COLORS is set to 8. Also see the entry for init_pair().


    For some reason, NCurses refers to the PC color "brown" as yellow.


    Though only 8 colors are available, 16 texts are possible on the PC. By applying
    the A_BOLD attribute to color text, the "bright" version of each color can be
    used. (So "bright brown" is finally the "yellow" NCurses desires to see.) (Note
    that the A_BOLD attribute actually uses a specific bold font on certain terminals,
    not just brightly colored text.)


    The basic eight colors are based upon setting bits for the RGB (red, green, and
    blue) values on the standard PC, where R is the first bit, G the second, and B
    the third. Table A-3 illustrates the colors, constants, and bit values.


    # Examples


    ```

    if(COLORS)

    ```


    Here, when the value of COLORS is greater than zero, the if passes.


    ```

    printf("This terminal can use %d\n",COLORS);

    ```


    This statement displays the number of colors available for the terminal.


    Table A-3: NCurses color values, Bits, and Constants


    | COLOR | BITS B-G-R | COLOR CONSTANT |

    |---|---|---|

    | 0 | 000 | COLOR_BLACK |

    | 1 | 001 | COLOR_RED |

    | 2 | 010 | COLOR_GREEN |

    | 3 | 011 | COLOR_YELLOW |

    | 4 | 100 | COLOR_BLUE |

    | 5 | 101 | COLOR_MAGENTA |

    | 6 | 110 | COLOR_CYAN |

    | 7 | 111 | COLOR_WHITE |'
