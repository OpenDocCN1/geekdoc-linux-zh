  md: '# CHAPTER

    4

    Around the Window


    One of the things that make NCurses appeal to programmers is the control it offers,
    not only over the text you display but over the location of text as well. The
    key is moving the cursor. Secondary to that, of course, knowing how big the terminal
    screen (or, in NCurses, the standard screen window) can be, so that you keep all
    your text visible.


    # Measuring the Standard Screen


    If you''re going to be moving the cursor hither, thither, and yon, it helps to
    know the dimensions of your terminal screen. Not every terminal is going to be
    exactly like yours, and it’s an especially bad thing to assume that all terminals
    follow the dimensions of the standard PC text screen’s 25 rows by 80 columns.


    In NCurses the terminal screen isn’t part of the equation. Instead, a window is
    used called the standard screen, which coincidentally is just the same size and
    dimensions as the terminal’s. (Yes, this may seem trivial at this point, but soon
    you’ll discover NCurses window functions, wherein all this makes much more sense.)'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# The Size of the Window Is Y by X


    To discover the size of any window in NCurses, the following function can be used:


    ```

    getmaxx(win,y,x)

    ```


    The getmaxx() returns the dimensions of the window win in rows and columns, where
    y is the row and x is the column. The function is named getmaxx() should help
    you remember that Y, or rows, first. The win argument is the name of a specific
    window in NCurses. The terminal screen, you use the standard window, which is
    named stdscr. The y and x arguments are int variables (not pointers) that will
    hold the maximum number of rows and columns in the named window. (Listing 4-1.)


    # Listing 4-1: screensize.c


    ```

    1 #include <ncurses.h>

    2

    3 int main(void)

    4 {

    5 int x,y;

    6

    7 initscr();

    8

    9 getmaxx(stdscr,y,x);

    10 printf("Window size is %d rows, %d columns.\n",y,x);

    11 refresh();

    12

    13 getch();

    14

    15 endwin();

    16 return 0;

    17 }

    ```


    Here''s what I see for output:


    ```

    Window size is 24 rows, 80 columns.

    ```


    That''s your window''s size; yours may be different. Because the terminal window
    is in a graphical window in a GUI, I can resize it. When I do and make the window
    wider, rerunning the program reports the new results:


    ```

    Window size is 24 rows, 85 columns.

    ```


    The point is to remember that it''s a bad thing to guess the terminal''s size.
    Write your code so that your program uses getmaxx() to determine the screen size
    and save those values in variables; do not use constants!'
