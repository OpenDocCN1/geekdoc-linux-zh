  md: '# Chapter 4 = Around the Window 49


    # And Now: the Shortcut


    The getmaxyx() function can read the dimensions of any NCurses window, but because
    the standard screen is special, there are two NCurses constants you can use as
    well (refer to Listing 4-2):


    LINES


    COLS


    The value of the LINES constant is equal to the number of rows on the standard
    screen window and, therefore, the terminal screen.

    The value of COLS is equal to the number of columns on the standard screen window,
    as well as the terminal.


    Listing 4-2: stdcsrcsize.c


    ```

    1 #include <ncurses.h>

    2 int main(void)

    4 {

    5 initscr();

    6

    7 printf("Window size is %d rows, %d columns.\\n", LINES,COLS);

    8 refresh();

    9 getch();

    10

    11 endwin();

    12 return 0;

    13 }

    ```


    The output is the same from the SCREENSIZE.C code, though LINES and COLS are always
    specific to the standard screen.

    Do remember that the Y constant is LINES, not ROWS.


    # Moving the Cursor Around


    In NCurses, the cursor — that thing tells cursors where to put the next character
    on the screen — is moved around via the move() function but also by most commands
    that put text to the screen. As you''ve seen in early chapters, putting a \n to
    the screen moves the text down to the next line. Nothing surprising there.


    To provide basic cursor control, there is only one command:


    ```

    move(y, x)

    ```'
