    \ is:\n\n```\nbkgd()\n```\n\nThe bkgd() function, as its name suggests, sets the\
    \ background attributes for the standard screen. Every screen location is filled\
    \ with the attribute(s) specified, whether they're plain text attributes or color.\n\
    \n# Screen Background Color\n\nTo set the background color, you must do three\
    \ things, two of which you already know:\n\n+   1. First, activate color. Use\
    \ the has_color() command if necessary to determine whether the console do colors.\
    \ If so, use start_color() to put NCurses into rainbow mode.\n2. Second, use init_pair()\
    \ to create the color pair(s) you want to use, setting foreground and background\
    \ colors.\n3. Third, use bkgd() to color the entire window.\n\nThe code in Listing\
    \ 3-6 demonstrates how background color is set.\n\n# Listing 3-6: bgcolor1.c\n\
    \n```\n1 #include <curses.h>\n2 \n3 int main(void)\n4 {\n5 \n6 initscr();\n7 start_color();\n\
    8 init_pair(1, COLOR_WHITE, COLOR_BLUE);\n9 bkgd(COLOR_PAIR(1));\n10 refresh();\n\
