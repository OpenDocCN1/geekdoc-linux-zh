  md: '# syncok()


    The syncok() function directs NCurses to automatically (or not) touch parts of
    a subwindow when that subwindow’s contents are changed.


    # Man Page Format


    ```

    int syncok(WINDOW *win, bool bool);

    ```


    # Format Reference


    win is a WINDOW variable representing a subwindow.

    bf is a Boolean value, either TRUE to touch the subwindows for updating and FALSE
    not to.


    # Return Value


    OK on success, ERR on failure (though it could be any value other than ERR on
    success).


    # Notes


    The syncok() attribute is tied into a specific window; it is not a global attribute
    in NCurses. Subwindows are created with the syncok() attribute disabled (set to
    FALSE).

    Seeing as how a subwindow and its parent window share memory, the purpose of this
    function seems questionable.


    # Example


    ```

    syncok(subby, TRUE);

    ```


    The statement causes changes to the window Bisby to automatically touched in all
    parent windows. Then again, because the memory is shared, the information is updated
    regardless.


    # Sample Program


    Not applicable.


    # Also See


    wsyncup(), subwin()'
