  md: '# filter()


    The filter() function restricts all of NCurses output to only one line on the
    screen.


    # Man Page Format


    ```

    void filter(void);

    ```


    # Format Reference


    Nothing ventured.


    # Return Value


    Nothing gained.


    # Notes


    filter() must be used before the initscr() or newterm() function that initializes
    NCurses.

    The filter() function disables some of those that move the cursor up or down to
    the home position. specifically those that the terminal command to move the cursor
    is reinterpreted as a simple carriage return when the filter() is active.

    The documentation describes filter() as disabling the cursor movement commands
    described in Table A-5.


    Table A-5: Cursor movements disabled by filter()

    | NAME | TERCAP | DESCRIPTION |

    |---|---||

    | clear | cl | Clears the screen. |

    | cud | DO | Moves the cursor down a given number of lines. |

    | cudi | do | Moves the cursor down one line. |

    | cup | cm | Moves the cursor to a specific row/column location or Home. |

    | cuu | UP | Moves the cursor up a given number of lines. |

    | cuul | up | Moves the cursor up one line. |

    | vpa | CV | Moves the cursor to row 1. |'
