    # initscr()


    initscr() function initializes NCurses functions. It sets up various internal
    memory structures, creates the standard screen window, and displays the virtual
    screen on the terminal.


    # Man Page Format


    ```

    WINDOW *initscr(void);

    ```


    # Format Reference


    The function has no arguments.


    # Return Value


    initscr() returns a pointer to a WINDOW variable, which ends up being the standard
    screen, stdscr.


    # Notes


    The newterm() function can also be used to initialize NCurses, specifically for
    special input and output needs.


    There are a few special NCurses functions that must be called before initscr()
    (or newterm()) is used to initialize NCurses. filter(), ripopline(), slk_init(),
    and use_env().


    It is not necessary to save the WINDOW pointer returned by initscr(), as NCurses
    creates the stdscr variable automatically.


    The endwin() function is required to end NCurses programming and return the terminal
    to normal behavior. See endwin().


    When initscr() cannot initialize the terminal, it exits the program.


    # Example


    ```

    initscr();

    ```


    This statement is found near the top of just about every NCurses program.'
