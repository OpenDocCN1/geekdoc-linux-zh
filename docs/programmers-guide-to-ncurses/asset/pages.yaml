    # flash()


    The flash() function causes the screen to blink, or quickly display a solid color,
    then return to normal. This is done as an attention-getting move, similar to playing
    a tone over the computer''s speaker.


    # Man Page Format


    ```

    int flash(void);

    ```


    # Format Reference


    The function takes no arguments.


    # Return Value


    Supposed, if the screen flashes, OK is returned. flash() returns other-wise. Both
    OK and ERR are defined in NCURSES.H.

    Do not repeat the ERR return value to determine whether or not the terminal really
    flash.


    # Notes


    flash() is used mostly an alternative to the beep() function, specifically designed
    for situations where noise is undesirable or for the hearing impaired. This function
    doesn''t work if the terminal has been configured not to flash. On most monitors,
    the flash is made of the current text foreground color. Some terminals may beep
    and flash the screen when the flash() is used.'
