    # raw()


    The raw() function removes any modifications done by the terminal to input, allowing
    your program to read input in the un-cooked or raw mode. The companion noraw()
    function ensures that cooked mode, not raw, is enforced by NCurses.


    # Explanation


    Normally the terminal has some control over input that is passed to your program.
    For example, your terminal''s Killchar, Erase, Interrupt, and other special keys
    can also be used in your program. By using the raw() function, you can disable
    all that interception, allowing your program to receive all keyboard input.


    # Man Page Format


    ```

    int raw(void);

    int noraw(void);

    ```'
