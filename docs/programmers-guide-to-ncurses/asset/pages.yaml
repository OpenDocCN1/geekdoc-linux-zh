    # To Eek or Not to Beek?


    If you want to be a good programmer, you may elect to have mouse support optionally
    compiled into your code, depending on whether or not the version of Ncurses the
    destination computer supports mouse functions. The idea is to create a program
    that uses text but can also employ mouse input, should such a thing be available.


    Thanks to the presence of the NCURSES_MOUSE_VERSION constant, you can use the
    `#ifdef` compiler directive to selectively compile mouse support into your code.
    For example:


    ```

    #ifdef NCURSES_MOUSE_VERSION

    mousemask(ALL_MOUSE_EVENTS, NULL);

    #endif

    ```'
