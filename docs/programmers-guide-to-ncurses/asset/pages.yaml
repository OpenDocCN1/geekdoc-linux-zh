- img_proc: true
  md: '# Introduction


    The NCurses library is a programming tool you can use in UNIX distributions as
    well as in Windows under Cygwin to program, control, and manipulate text on the
    terminal screen. With NCurses you can control interactive I/O, organize information
    into windows on the screen, use color to highlight text and organize information,
    and even use a mouse to further refine input. It''s all possible with NCurses.


    This book presents NCurses in two parts. The first part is a 14-chapter tutorial
    of the basic NCurses library to get you started and more. The second part is an
    A to Z reference of more than 175 NCurses functions. It is not a rehash of the
    man pages but descriptions and examples based on my own research. The reference
    is cross-referenced, and the entire book is indexed.


    I''ve created this book so that it will be the only NCurses reference you''ll
    need. Feel free to mark the pages, dog-ear, and put sticky notes where necessary.
    This is your book!


    # Assumptions


    This book assumes that you are using a UNIX-like operating system (Linux, FreeBSD,
    Mac OS X, or some other OS based on UNIX).


    Most UNIX operating systems today use a graphical user interface (GUI), though
    for programming C you''ll need to have access to a terminal screen. This can be
    a terminal window inside the GUI. Make sure you know how to open such a beast.'
  merge: -1
  pgno: 19
- img_proc: true
  md: "# Curses or NCurses?\n\nTheurses library of terminal control functions has\
    \ been with UNIX since the early 1980s. As such, it was part of the older versions\
    \ of UNIX, which required complex licenses and such to be used.\n\nNCurses are\
    \ the New Curses software emulation of the original Curses and is available from\
    \ the GNU folks at the Free Software Foundation. Others are pretty good that the\
    \ computer system you're using employs NCurses, not the original Curses. Because\
    \ of this, this book uses NCurses to refer to the library and its functions.\n\
    \nThe book is current with NCurses version 5.5.\n\n# Conventions\n\nIn this book,\
    \ you'll find the following conventions used:\n\n+   - C language keywords, function\
    \ names, or prompt commands are listed in monospace type, such as: if or newwin()\
    \ or ls -1.\n- Filenames are listed in monospaced caps, such as A.OUT or GOODBYE.C.\
    \ Directory and pathnames are in small caps: ~/PROG/C/CURSES\n- Program code appears\
    \ with the source code filename first, followed by the code:\n\nListing I-1: box.c\n\
    \n```\n#include <nurses.h>\n\nint main(void)\n{\n\tintscr();\n\tbox(stdscr, '*',\
    \ '*');\n\trefresh();\n\tgetch();\n\tendwin();\n\treturn 0;\n}\n```\n\nThe line\
    \ numbers, to the left of the bar, are for reference only; do not type them. The\
    \ code is to the right of the bar."
  merge: -1
  pgno: 20
- img_proc: true
  md: 'The programs in this book are short and to the point. As such, they rarely
    include comments. Even so, be sure to comment your own code and your variables
    in a friendly way.


    Some programs later in the book dispense with error-checking for some NCurses
    procedures. This is noted as a bad practice in real life but is done here to keep
    the code short and easy to read and type. In your code, always be sure to check
    for errors with those NCurses functions that can return errors, as noted in the
    text.


    # Compatibility Issues


    I wrote this book on a G5 Mac running OS X. Programs were also tested on FreeBSD
    computer as well as a system running Mandrake Linux. The programs in this book
    work, but not all of them work or identically on all systems. Even though NCurses
    is very universal, do not expect all the code here to fly perfectly on your computer.


    If you encounter problems with NCurses on your OS, please refer to the OS Technical
    Support — or an online forum or Wikipedia — for assistance. Odds are pretty good
    that I don''t have your same setup, so e-mailing me isn''t going to get anywhere.


    As this book goes to press, I''ve already reported several dozen issues with NCurses
    on Mac OS X to the OS X developer support team, as well as to the NCurses maintenance
    team.


    # Contacting the Author


    Here is my real-email address:


    ```

    dgookin@wambooli.com

    ```


    I cannot promise to answer all my e-mail, as I get a ton of it and most of it
    for technical support, which is not my business. I enjoy hearing feedback about
    my books, and I will answer your questions about the books. I commit, obviously,
    write your source code for you.


    This book has a companion web page, which is shared with the site I use to support
    my C programming books. The page can be found at:


    ```

    http://www.c-for-dummies.com/ncurses/

    ```'
  merge: -1
