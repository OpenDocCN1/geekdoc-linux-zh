  md: '# Appendix A ■ NCurses Library Reference 399


    # Return Value


    The value returned by PAIR_NUMBER() is an int equal to whichever color pair number
    has been used to format the text and background colors. Its range is between 0
    and the value of COLOR_PAIRS, minus 1.


    # Notes


    In reality, COLOR_PAIR(n) is simply a cluster of bits used in the ctypes value
    to define how a character in an NCurses window is formatted. The PAIR_NUMBER()
    pseudo function simply extracts the COLOR_PAIR(n) value, itself, from ctypes value.
    This is why it’s often written that PAIR_NUMBER() is the "opposite" of the COLOR_PAIR(n)
    function.


    # Examples


    ```

    n = PAIR_NUMBER(a)

    ```


    The value of a variable is equal to the value of a specific COLOR_PAIR(n). The
    value returned in variable n will be the same as a from COLOR_PAIR(a).


    ```

    x = PAIR_NUMBER(COLOR_PAIR(n));

    ```


    This statement is basically the same as x = n.


