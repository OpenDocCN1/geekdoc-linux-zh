  md: '# Appendix A _NCurses Library Reference 511


    The two variables _regtop and _regbottom NCURSES_SIZE_T values that set the top
    and bottom of a scrolling region of text in a window. These are set by the setscrreg()
    function.


    # Subwindow Data


    ```

    win->_parx

    win->_pary

    win->_parent

    ```


    For a subwindow, _parx and _pary are ints indicating the upper-left corner of
    the subwindow relative to the parent. These coordinates are returned via the getparentxy()
    function.

    _parent is a WINDOW pointer indicating the parent window. This value is the address
    of the parent window''s structure, not its name. See the Examples.


    # Pad Data


    Data for a pad is kept in a pdata structure within the WINDOW structure. The pdata
    structure is named _pad and referenced as listed below:


    ```

    win->_pad..pad_y

    win->_pad..pad_x

    win->_pad..pad_top

    win->_pad..pad_left

    win->_pad..pad_bottom

    win->_pad..pad_right

    ```


    The pad in the window corresponds to the arguments used for prefetch() function
    as shown in Table A-20.


    Table A-20: WINDOW pad data listed the prefetch() function''s arguments


    | PREFETCH() ARGUMENTS | WINDOW PAD STRUCTURE ELEMENT |

    | pminrow | _pad..pad_y |

    | pmincol | _pad..pad_x |

    | sminrow | _pad..pad_top |

    | smincol | _pad..pad_left |

    | smaxrow | _pad..pad_bottom |

    | smaxcol | _pad..pad_right |'
