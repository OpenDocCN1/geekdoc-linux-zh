    # Keypad On!


    All keys on the computer keyboard generate a code when key is pressed. The code
    is returned by key-reading functions, either as the raw code itself or as some
    other special value as “cooked” by the operating system.


    In the case of the alphanumeric keys, the ASCII character value is returned when
    you press that key. For other keys, other values are returned, a 16-bit value,
    a pair of 8-bit values, or perhaps an escape sequence. Knowing which type of value
    means you can determine exactly which key was pressed, even nonalphanumeric keys.
    The drawback, of course, is that no terminal produces the same results or has
    the same keys.


    NCurses to the rescue!

    URSES.H header file defines many of the extra keys found on keyboards. To activate
    and use those definitions, the keypad() function is used:


    ```

    keypad(stdscr, TRUE);

    ```


    The keypad() function indicates which window it affects, as stdscr for the standard
    screen, followed by TRUE to turn the feature on or FALSE to turn it off. Once
    enabled, your program can use various defined keyboard keys to read those extra
    keys, as the following program in Listing 7-7 demonstrates.


