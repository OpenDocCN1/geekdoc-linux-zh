  md: '# Viewing a Pad’s Contents


    Text is put to a pad just like any other window using the standard NCurses text-output
    commands. Unlike standard windows, however, you can''t refresh a pad, not with
    refresh(); Here’s proof. Change lines 20 and 21 to read:


    ```

    waddstr(p, "New pad created*");

    refresh(p);

    ```


    Nothing, he?


    True, the waddstr() function did indeed add text to the pad. But refresh() doesn''t
    update or display the pad. Even if it could, consider this: When the pad was created,
    where was it on the screen?

    Ah-ha!


    Pads, unlike windows, lack screen coordinates. In fact, it helps to think of a
    pad as a virtual screen that way off in memory. There is just no relationship
    between the pad itself and the visible screen.


    To display text written to the pad, and copy that chunk from the pad to the screen
    for display. The refresh() function handles the operation:


    ```

    refresh(pad,pminrow,pmincol,sminrow,smincol,maxrow,maxcol)

    ```


    The refresh() function looks intimidating, but it’s not: pad is the name of a
    pad created using the newpad() function. The rest of the arguments define a rectangle
    of text (and attributes) in the pad and specify that rectangle will be placed
    on the standard screen. The remaining arguments of refresh() calculate that rectangle''s
    location:


    pminrow and pmincol represent the Y and X coordinates of the upper-left corner
    of a chunk of the pad.

    sminrow and smincol are the Y and X coordinates on the standard screen where the
    chunk of the pad will be displayed. maxrow and maxcol define the size of the rectangle,
    both relative to the pad and the screen. Figure 11-1 illustrates this.


    Change line 21 to read:


    ```

    refresh(p,0,0,0,0,1,15);

    ```


    Now you see the text; refresh() copies a chunk from the pad and displays it on
    the screen.'
