- img_proc: true
  md: '# 376 Appendix A = NCurses Library Reference


    # Format Reference


    nlines is an int value indicating the number of rows the pad will have. Val- nues
    for nlines range from 1 up to 32767, or the value of NCURSES_SIZE_T (normally
    defined as a short)...

    ncols is an int value indicating the number columns for the new pad. Val- nues
    range from 1 up to 32766, or the value of NCURSES_SIZE_T.


    # Return Value


    Upon successful creation of a new pad, a WINDOW pointer is returned. NULL is returned
    when there is a problem.


    # Notes


    It''s the prefetch() function that determines which part of a pad appears on a
    window. See prefetch().

    The symbol NCURSES_SIZE_T can be modified, though not casually. By doing so you
    can change the maximum size of a pad. Keep in mind that NCurses applications are
    limited to short integers.

    All output and formatting commands work with a pad just as they do any window.

    The getch() and get() functions can be used with a pad, but unlike a window the
    input will not be updated with those functions, whereas regular windows are.


    +   - Pads cannot be scrolled. Do not use scroll(), scroll() or scrl() with a
    pad.

    - Pads cannot be moved. Do not use mwin() with a pad.

    - Do not use refresh() or wrefresh() with a pad.

    - Pads cannot have subwindows; do not use subwin() with a pad. Instead, use subpad()
    to create a subpad. Use subpad() for additional information and warnings.

    - Pads are removed using the delwin() function, just as windows are removed. See
    delwin().


    # Examples


    ```

    p = newpad(200,WIDE+1);

    ```


    The statement creates a pad with 200 rows and WIDE+1 columns. If successfully
    created, variable p is used like any other WINDOW variable to reference the pad
    in the code.'
