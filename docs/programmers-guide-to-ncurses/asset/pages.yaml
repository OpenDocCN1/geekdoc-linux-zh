    # slk_attr()


    The slk_attr() function applies the standard text attributes to the soft labels.
    It is the soft label key equivalent of the attr() function.


    # Man Page Formats


    ```

    int slk_attron(const ctype attrs);

    int slk_attr_on(attr_t attrs, void* opts);

    ```


    # Format Reference


    attrs is a ctypes variable representing one or more attribute constants defined
    in NCURSES.H.

    NULL is used in the slk_attr_on() function as a placeholder for the undefined
    opts value.


    # Return Value


    ERR on failure, OK or some value other than ERR on success.


    # Notes


    As with attron(), the slk_attr() function merely adds attributes to those already
    set. Setting a new attribute does not affect previous attributes applied to the
    soft labels.

    Soft label keys are normally displayed with the A_STANDOUT attribute applied.

    Multiple attributes can be applied by using more than one NCurses attribute constant
    separated by a logical OR in the slk_attr() statement.'
