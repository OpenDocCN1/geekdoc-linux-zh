  md: '# More Text Manipulation


    NCurses provides a wealth of text-manipulation functions, which are more than
    just positioning the cursor. There are functions that can insert and delete characters
    or lines of text, causing other text on the screen to jump around and make room
    for or fill in the gaps. This chapter covers those amazing functions.


    # Inserting and Deleting Functions


