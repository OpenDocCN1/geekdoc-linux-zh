  md: "# Some Fun with mvprintw()\n\nWhy do the math when the compiler do it for you?\
    \ One gem with printf(), and then, of Ncurses' printf(), is that it can justify\
    \ strings in its output. For example:\n\n```\nprintf(\"%40s\", \"This is right-justified\"\
    );\n```\n\nThe %s normally tells printf() to replace the %s with a string. The\
