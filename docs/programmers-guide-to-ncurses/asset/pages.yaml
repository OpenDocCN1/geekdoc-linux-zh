    # is_linetouched


    The is_linetouched() function determines whether a line of text in a window has
    been altered since the last screen update.


    # Explanation


    NCurses keeps track of which portions of a window have been changed the last refresh().
    The is_linetouched() function determines whether or not any text on a given line
    (row) of text has been modified since that refresh(). If so, the function returns
    TRUE, FALSE otherwise.


    # Man Page Format


    ```

    bool is_linetouched(WINDOW *win, int line);

    ```'
