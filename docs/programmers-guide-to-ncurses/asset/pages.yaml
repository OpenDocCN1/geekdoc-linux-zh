  md: 'Sadly, you cannot use color in the program to show how overlay() works, similar
    to what''s seen in Figure 10-1. Any any text copied from one window to another
    takes on the attributes of the new window.


    # The overwrite() difference


    To see how overwrite() differs from overlay() is easy.

    Change lines 22 and 23 to read:


    ```

    /* Copy text from one window to the other, destructively *

    overwrite(stdscr,alpha)

    ```


    The overwrite() function is destructive, so no characters from the original text
    appear, peeking through Lorem ipsum as they did in the doopl.c program.


    # The magic of copywin()


    The best of the three basic text-copying functions is copywin(), which allows
    you a great deal of control over which chunk of text is copied from the source
    window and where it ends up in the destination window. Unlike overlay() and overwrite(),
    copywin() seems to work on windows of any size. Here''s the default format:


    ```

    copywin(swin, dwin, srow, scol, dcol, dxrow, dxcol, type)

    ```


    The scwin and destwin are the source and destination windows, which can be of
    any size or position on the screen.

    srow and scol are the starting coordinates of the chunk of text to be copied,
    as offset within the scwin.

    drow and dcol are the starting coordinates of where the chunk will be copied into
    the destwin. The size of the chunk copied is set by dxrow and dxcol, which are
    offsets with destwin.


    Finally, type can be either TRUE or FALSE. If TRUE, then the text copied is non-destructive,
    as with overlay(). If FALSE, then the text block replaces the block in the destwin,
    just like overwrite().


    I realize that''s confusing, so I drew up Figure 10-2 to help you visualize things.'
