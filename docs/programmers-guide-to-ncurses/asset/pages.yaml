    \ As with numbers, the string is right-justified:\n\n```\nThis is right-justified\n\
    ```\n\nNow if you prefix the size of the field with a minus sign, you get left-justified\
    \ output:\n\n```\nprintf(\"-40s\", \"This is left-justified\");\n```\n\nThe -40\
