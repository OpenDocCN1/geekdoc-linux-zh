    # dupwin(win)


    The dupwin() function creates an exact duplicate of a window. The new window is
    of the same size and at the same location as the original window.


    # Man Page Format


    WINDOW *dupwin(WINDOW *win);


    # Format Reference


    win is a WINDOW pointer variable, indicating a window previously created by the
    program.


    # Return Value


    The function returns a pointer to a WINDOW variable, which is the exact duplicate
    of the original win. If there is a problem, NULL is returned.


    # Notes


    Unlike a window created using the newwin() function, a window created using dupwin()
    inherits the text and attributes from the original window, as well as input modes
    and filters, such as keypad().'
