    When overlay is FALSE, the entire rectangle of text and attributes is copied from
    srcwin to dswin. Any existing text and attributes applied to that text in dswin
    is replaced with text and attributes from srcwin.


    # Example


    ```

    copywin(top.bottom,0,0,0,20,10,FALSE);

