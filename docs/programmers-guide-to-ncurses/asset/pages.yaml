  md: '# Man Page Format


    ```

    int refresh(void);

    int wrefresh(WINDOW *win);

    ```


    # Format Reference


    The function has no arguments.

    Refer to the w entry elsewhere in this appendix for information on the win argument.


    # Return Value


    ERR on failure, OK or a value other than ERR on success.


    # Notes


    Next to get(), refresh() is the most often used function in NCurses.

    Internally, the refresh() function is a combination of wrefresh() and doudate()
    calls.

    It''s possible that refresh() alone may not properly update the screen. If so,
    consider using the clearok() function before calling refresh(). Also see the touchwin()
    function.

    When you are using the following combination:


    ```

    wrefresh(w);

    getch();

    ```


    it''s okay to replace it with:


    ```

    wgetch(w);

    ```


    which not only waits for a key to be pressed but updates the window w.

    You can avoid using refresh() by calling the immedok() function with TRUE as the
    argument for a given window. If so, all output to that window is immediately refreshed.
    There is a performance trade off with that updating. See immedok().

    It''s possible to optimize screen output, especially when updating multiple windows,
    by using the wrefresh() function on each window, then a single doudate() function
    call to perform the actual screen update.'
