  md: '# Appendix A = NCurses Library Reference 335


    # intrflush()


    The intrflush() function controls whether the keyboard input queue is flushed
    when an interrupt key is typed at the keyboard.


    # Man Page Format


    ```

    int intrflush(WINDOW *win, bool bf);

    ```


    # Format Reference


    win is ignored.

    bf is a Boolean value, either TRUE or FALSE. TRUE turns on interrupt flush-ing
    on keyboard input. FALSE disables interrupt flushing.


    # Return Value


    ERR upon failure, OK or some value other than ERR upon success.


    # Notes


    When intrflush() is TRUE, pressing a break key results in an instant flush of
    the input queue, and immediate action upon the break key. When it is FALSE, then
    the interrupt is still acted upon, but any text in the buffer may appear later,
    such as the command prompt.

    The interrupt keys intrflush() monitors are listed in Table A-9.

    The behavior of the Break key on your keyboard (if one exists) depends on how
    its is mapped in the terminal.

    When intrflush() is turned on, then an interrupt key results in a faster response
    than otherwise would be experienced.

    On the downside, having intrflush() may result in disconnect between what NCurses
    believes to be displayed on the screen versus what''s actually there.


    Table A-9: Interrupt keys monitored by intrflush()


    | KEY FUNCTION | NAME | KEY(5) | ASCII | SIGNAL |

    |---|---|---|---|---|n| Break | BREAK | Break? | n/a | BRKINT |

    | Interrupt | INTR | ^C | 0x03 | SIGINT |

    | Quit | QUIT | \ | 0x1c | SIGQUIT |'
