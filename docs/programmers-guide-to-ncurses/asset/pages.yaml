  md: '# 508 Appendix A ■ NCurses Library Reference


    # Man Page Format


    Not applicable.


    # Format Reference


    Most of the settings in the WINDOW structure can be adjusted by using standard
    NCurses functions. Even so, the following references names and values found in
    the WINDOW structure. In each example, win represents the name of the WINDOW variable.


    # Cursor''s location


    ```

    win->_cury

    win->_curx

    ```


    The _cury and _curx elements are variables of the NCURSES_SIZE_T type (int) representing
    the cursor''s location in a window, row and column. These are the same values
    returned by the getyxx() function. (Actually getyx() is a macro that returns the
    curry and curx values.)


    # Window size


    ```

    win->_maxy

    win->_maxx

    win->_begy

    win->_begx

    ```


    The _begy and _maxx elements are variables of the NCURSES_SIZE_T type (short)
    representing the maximum values for placing the cursor in a column or row. The
    header file says that these are not the window size, but they are one less than
    the window size. That''s because the first row and column is zero. (The getmyxx()
    function returns these values plus one.)


    The _begy and _begx elements are variables of the NCURSES_SIZE_T type (int) indicating
    the coordinate of the window''s upper-left corner. These are the same values returned
    y the getbegyx() function.


    # Window state flags


    ```

    win->_flags

    ```


    flags is a short that contains 7 bit flags, as shown in Table A-19.

    Testing these values is done with a logical AND. See the Examples for more information.'
  merge: -1
  pgno: 530
- img_proc: true
  md: '# Table A-19: Window state flags


    | CONSTANT | BIT POSITION | ON VALUE |

    | :--- | :--- | :--- |

    | _SUBWIN | 0x01 | Window is a subwindow |

    | _ENDLINE | 0x02 | Window is flush-right |

    | _FULLWIN | 0x04 | Window is full screen |

    | _SCROLLWIN | 0x08 | Window''s bottom edge is screen bottom edge |

    | _ISPAD | 0x10 | Window is a pad |

    | _HASMOVED | 0x20 | Cursor has moved since last refresh |

    | _WRAPPED | 0x40 | Cursor was just wrapped |


    # Window attributes


    ```

    win->_attrs

    win->_bkgd

    ```


    The attrs element is an attr_t type variable indicating which attributes are applied
    to it (non-space characters) in a window. The bit fields in _attrs are filled
    according to which attributes are set. See attrset(). _bkgd is a ctype() variable
    indicating the current background ctype (character and attribute) assigned to
    the window. This value is set by the bkgd() function.


    # Window options


    ```

    win->_notimeout

    win->_clear

    win->_leaveok

    win->_scroll

    win->_idok

    win->_idock

    win->_immed

    win->_sync

    win->_use_keypad

    win->_delay

    ```


    For all Boolean elements, the value TRUE sets the bit and the condition, described
    below.

    _notimeout is a Boolean value which when set directs NCurses not set a timeout
    for the Esc key press. This value is controlled by the notimeout() function.'
  merge: -1
