  md: "# The “Reading the Mouse” Overview\n\nAfter mousemask() initializes the mouse\
    \ and tells NCurses which mouse\nev to scan, use these two functions to read the\
    \ mouse:\n\n```\ngetch()\ngetmouse(&event);\n```\n\nFirst comes the getch() function.\
    \ Just as it can read the keyboard,\ngetch() can also detect mouse input. The\
    \ input is defined in\nNCURSES.H as KEY_MOUSE. And to read that character, you\
