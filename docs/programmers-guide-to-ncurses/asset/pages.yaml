  md: "# Chapter 9 Subwindows\n\nAfter creation, the subwindow can be addressed like\
    \ any other window, named in a window-oriented command, deleted, or affected in\
    \ the same as regular windows. Subwindows can even have subwindows of their own.\n\
    \n# Your First Subwindow\n\nSubwindows exist totally within a parent window. In\
    \ a way, it helps to think of them more as a region of the parent window, though\
