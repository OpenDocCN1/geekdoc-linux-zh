    # leaveok()


    The leaveok() function directs NCurses not to update a window’s virtual cursor
    location to the hardware cursor location during a refresh() operation.


    # Explanation


    As of the refresh operation, NCurses synchronizes a window’s virtual cursor location
    on the screen. When the leaveok() function is activated for a window (set TRUE),
    then NCurses does not synchronize the cursor’s position for the window; the hardware
    cursor’s position then remains where it was or ends in some other location.


    # Man Page Format


    ```

    int leaveok(WINDOW *win, bool bf);

    ```


    # Format Reference


    win is a WINDOW variable indicating which window leaveok() is to monitor. The
    cursor’s location for win will not be updated when win is refreshed. bf is a Boolean
    value, either TRUE to have the cursor position not updated during a refresh, or
    FALSE to have the cursor position updated. Most windows are preset to FALSE.


    # Return Value


    The function always returns OK.


    # Notes


    The location where the cursor ends up cannot be predicted in advance. In fact,
    in your experience you should not rely on the cursor being staying anywhere when
    leaveok() is TRUE.


    The cursor’s location on one window does not affect the cursor’s location on another
    window.'
  merge: -1
