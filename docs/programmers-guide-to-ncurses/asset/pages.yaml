    # redrawwin()


    The redrawwin() function is used to help force an update of the terminal window
    when the contents of a window may be corrupted or in need of a complete refresh.


    # Man Page Format


    ```

    int redrawwin(WINDOW *win);

    ```


    # Format Reference


    win is the name of a window to update. It''s a WINDOW variable representing a
    window on the screen, or stdscr for the standard screen.


    # Return Value


    ERR on failure, OK or some value than ERR when things go well.


    # Notes


    This function is equivalent to redrawln(win, 0, n), where win is the name of the
    window''s bottom row.


    redrawwin() works by telling NCurses to discard its corresponding data in the
    current screen, so it is forced to recompute when refreshing this window.


    Refer to the entry for redrawln() for more information and notes about this function.


    # Example


    ```

    redrawwin(boy);

    ```


    The statement directs NCurses to completely update the contents of the window
    boy.'
