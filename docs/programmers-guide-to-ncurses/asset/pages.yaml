    # insdelln()


    The insdelln() function either inserts or deletes a given number of lines in a
    window.


    # Man Page Format


    ```

    int insdelln(int n);

    int winsdelln(WINDOW *win, int n);

    ```


    # Format Reference


    n is an int value that indicates the number of lines to insert or delete. When
    n is positive, then that number of lines are inserted at the row the cursor is
    on. When n is negative, then that number of lines are removed from the row the
    cursor is on.

    Refer to the entry for w later in this appendix for information on the win argument.


    # Return Value


    ERR on failure or OK when things are all sunny and okay.


    # Notes


    The insdelln() function does not change the cursor''s location.

    Lines inserted cause the text below to scroll down. The bottom n line(s) are then
    removed from the window.

    Lines removed cause the text to scroll up; n blank lines are inserted at the bottom
    of the window.

    insdelln(1) is equivalent to insertln().

    insdelln(-1) is equivalent to deleteln().

    When n is zero, obviously, nothing happens.


    # Examples


    ```

    insdelln(2);

    ```


    Two new, blank rows of text are inserted at the line the cursor is on. Two blank
    lines will be on the cursor line and below that line. Any text already on'
