  md: '# Also See


    Chapter 4, move()


    # halfdelay()


    The halfdelay() function directs NCurses input functions to enter half delay mode.


    # Explanation


    Half delay mode is similar to cbreak mode with regard to characters being made
    available immediately to the program as they''re typed. Unlike cbreak mode, however,
    halfdelay() sets the blocking delay duration. After a number of tenths of a second,
    the input function returns ERR when nothing has typed.


    # Man Page Format


    ```

    int halfdelay(int tenths);

    ```


    # Format Reference


    tenths is an int value ranging from 1 to 255, indicating the number of tenths
    of a second getch() (and related functions) to wait for character input.


    # Return Value


    ERR on failure, OK or a value other than ERR on success.


    # Notes


    halfdelay() covers all NCurses input. If you want to vary the delay associated
    with a specific window, use the timeout() function instead: timeout().


    Small values of tenths require a fast typer to keep up!

    Remember that it''s the input function, such as getch(), which returns ERR when
    half delay times out. The halfdelay() function returns ERR only when there is
    an error setting that fails.


    The nodelay() function essentially like setting halfdelay(0), though zero is an
    invalid argument for halfdelay().nYour program can leave half delay mode by using
    the nocbreak() function. See cbreak.'
  merge: -1
