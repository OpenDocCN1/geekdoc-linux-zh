    # scr_dump()


    The scr_dump() function takes a snapshot of the current screen and saves to disk.


    # Man Page Format


    ```

    int scr_dump(const char *filename);

    ```


    # Format Reference


    filename is the name of a file under which the standard screen data will be saved.
    It is not a FILE pointer.


    # Return Value


    OK upon success or ERR on failure.


    # Notes


    The scr_restore() function is the companion to scr_dump(), restoring the image
    saved to disk and back to the virtual screen.

    The file format by scr_dump() is the same as for putwin(). In fact, the getwin()
    function can be used to read in the file created by scr_dump().

    Remember that the scr_dump() function''s argument is a filename, not a FILE pointer!


    # Examples


    ```

    scr_dump(screen);

    ```'
