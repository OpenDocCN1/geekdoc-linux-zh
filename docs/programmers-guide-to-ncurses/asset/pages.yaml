    by NCurses when the initscr() function is run. A macro getmaxx() exists in NCES.H.
    It returns the maximum row value for a named window. The format is getmaxx(win),
    and it returns the maximum row value for window win, or ERR upon failure.


    # Example


    ```

    getmaxx(menu, menurow, menucol);

    ```


    This statement reads the height and width of the window menu, storing the total
    number of rows in menurow, and the number of columns in menucol.


