  md: '# Return Value


    OK on success or ERR on failure.


    # Notes


    By itself, `scr_init()` merely reads window setting information from the named
    file.


    The information `scr_init()` sets in memory can be updated to the screen by using
    a `refresh(curscr)` statement.


    The `scr_init()` function pays heed to the terminfo `rmcup` and `nrmec` capabilities.
    When `rmcup` exists, the function returns ERR. (Refer to Chapter 1 for a description
    of `rmcup`).


    # Example


    ```

    if(scr_init("windata.bin") == ERR

    ```


    The statement checks to see if `scr_init()` returns ERR. If not, information from
    the WINDATA.BIN file is read from disk and used to configure NCurses window structures.


    # Sample Program


    Refer to the entry for `scr_restore()` for a sample program and output.


    # Also See


    scr_dump(), scr_restore(), scr_set()


    # scr_restore()


    The `scr_restore()` function fetches a previously saved screen dump and loads
    it into memory, replacing the current virtual screen.


    # Man Page Format


    ```

    int scr_restore(const char *filename);

    ```


    # Format Reference


    filename is the name of a file to which screen data has been saved. It is not
    a FILE pointer.'
