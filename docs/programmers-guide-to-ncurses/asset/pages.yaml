    # ## Flushing Input


    Text typed at the computer keyboard is stored in a buffer. The various text-reading,
    or keyboard input, functions fetch characters from that buffer as the program
    needs them, a basic description of how keyboard input works.

    The reason for the buffer is to allow for keyboard input while the program is
    doing something else. I can think of two benefits to this:


    +   - First, it allows you to type ahead while the computer can do something else
    (and the keyboard buffer is often called the type-ahead buffer).


    +   - Second, it means that the program doesn''t have to constantly scan the keyboard
    to determine whether you''ve pressed a key.'
