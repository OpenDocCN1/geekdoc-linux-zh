    # Forbidden Pad Stuff


    Don’t bother moving a pad. In fact, the concept seems silly because pads do not
    exist relative to the screen.


    Pads cannot be scrolled.


    As with subwindows, do not move a subpad — and for the same reason. The coordination
    between the parent and the subpad is nonexistent. Because both share memory, moving
    a subpad results in chaos for the parent and catastrophe for your program.


    Also, remember to remove subpads before deleting the pad itself. If you don’t,
    the memory used by the subpads will not be cleared.'
