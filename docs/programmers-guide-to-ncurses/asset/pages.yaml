  md: "# Basic I/O, the NCurses Way\n\nNCurses allows you full control over terminal\
    \ screen (or window) but only if you heed its rules! There is a definite way to\
    \ set up an NCurses program and some specific tricks and traps to know. Also,\
    \ you must use NCurses' own I/O functions to display text as well as read input\
    \ from the keyboard.\n\n# The Skeleton\n\nThe majority of NCurses programs have\
    \ the same basic skeleton, which looks something like this:\n\n```\n#include <ncurses.h>\n\
    \nint main(void)\n{\n    initscr();    /* Initialize ncurses */\n\n    /* i/o\
    \ and other programming done here */\n\n    endwin();    /* Properly close ncurses\
    \ */\n    /* cough up return value for the shell */\n    return 0;\n}\n```"
