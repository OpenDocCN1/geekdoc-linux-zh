  md: "# copywin()\n\nThe copywin() function copies a rectangle of text and attributes\
    \ from one window to another window, either destructively or nondestructively.\n\
    \n# Man Page Format\n\n```\nint copywin(const WINDOW *srcwin, WINDOW *dstwin,\
    \ int minrow,\n               int smincol, int dmincol, int dmaxrow, int dmaxcol,\n\
    \               int dmaxcol, int overlay);\n```\n\n# Format Reference\n\nsrcwin\
    \ is a WINDOW pointer to the window from which text and attributes will be copied,\
    \ dstwin is a WINDOW pointer to the window into which text will be copied, the\
    \ destination window.\nsminrow and smicol are int values representing the row\
    \ and column from which text is copied in the source window (srcwin).\ndminrow,\
    \ dmincol, dmaxrow, and dmaxcol, represent a rectangle in the destination window\
    \ (dstwin) where the text is pasted. dminrow and dmincol form the upper-left corner\
    \ of the rectangle as row and column values; dmaxrow and dmaxcol form the lower-right\
    \ corner of the rectangle as row and column values.\noverlay is a Boolean value,\
    \ either TRUE or FALSE. If TRUE, the text copied is nondestructive, and only blanks\
    \ in the destination window are overwritten with text from the source window.\
    \ If FALSE, the text copied is destructive, replacing all text in the destination\
    \ window's rectangle with text and attributes from the source window.\n\n# Return\
    \ Value\n\nOK or ERR, based on the function's success or failure.\n\n# Notes\n\
    \nA visual example of how copywin() works can be found in Figure 10-2.\nNCurses\
    \ use the difference between dminrow and dmaxrow, as well as the difference between\
    \ dmincol and dmaxcol, to help calculate the size of the source and destination\
    \ rectangles.\n\nWhen overlay is TRUE only text is copied from srcwin to dstwin.\
    \ The text appears only in the \"blank\" portions of the window. Text will not\
    \ overwrite any existing text."
