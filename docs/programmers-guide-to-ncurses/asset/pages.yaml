  md: '# Appendix A ■ NCurses Library Reference 267


    # FALSE


    NCurses uses the Boolean value FALSE for comparisons, for setting options, as
    a value returned from specific functions.


    # Man Page Format


    Not applicable.


    # Format Reference


    FALSE is used in one of many ways:


    ```

    function([{arg(s)}], FALSE)

    ```


    Some functions use FALSE as shown above to reset an option in a NCurses function.


    ```

    var = function([{arg(s)})

    ```


    The value FALSE may be returned by some NCurses functions. Above, the value of
    var could be either TRUE or FALSE. var is a bool variable type.


    ```

    if( eval == FALSE)

    while({eval ==} FALSE)

    ```


    The value FALSE can be used in comparisons, as shown above.

    Functions that return FALSE can also be used immediately inside comparisons:


    ```

    if( function([{arg(s)}) } )

    while({ function([{arg(s)}) }

    ```


    Here, when the function returns a FALSE value, the program responds accordingly.


    # Return Value


    The value of FALSE is set in NCURSES.H to zero.


    # Notes


    The logical opposite of FALSE is TRUE. Functions that use or return FALSE can
    equally use or return TRUE, depending on the situation. Refer to the Notes under
    the TRUE entry in this Appendix, for a list of NCurses functions that use the
    value FALSE.'
