    # Notes


    The `scr_restore()` function does not display the screen data. A call to `doudate()`
    is required to display the restored screen.

    While the cursor is saved in the window file by `scr_dump()`, the `scr_restore()`
    function does not restore the cursor''s location. The cursor instead remains at
    whatever location it was when `scr_restore()` was issued. To fix this, `scr_init()`
    should be called before `scr_dump()`.


