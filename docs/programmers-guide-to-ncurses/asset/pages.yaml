  md: '# 150 Chapter 12 = The Joy of Soft Labels


    Finally, to make the labels show up, the slk_refresh() function is used:


    ```

    slk_refresh()

    ```


    Like other refresh() functions in NCurses, this one updates the screen. In this
    case, only the soft label on the screen is updated (see Listing 12-1).


    Listing 12-1: softties1.c


    ```

    1 #include <curses.h>

    2

    3 #define LEFT 0

    4 #define CENTER 1

    5 #define RIGHT 2

    6

    7 int main(void)

    8 {

    9 slk_init(0);

    10 initscr();

    11

    12 slk_set(1, "Help!", LEFT);

    13 slk_set(2, "File", LEFT);

    14 slk_set(3, "Print", LEFT);

    15 slk_set(4, "Text", CENTER);

    16 slk_set(5, "Edit", CENTER);

    17 slk_set(6, "Quick", RIGHT);

    18 slk_set(7, "Conf", RIGHT);

    19 slk_set(8, "Change", RIGHT);

    20 slk_refresh();

    21

    22 getch();

    23

    24 endwin();

    25 return 0;

    26 }

    ```


    The code creates eight soft labels across the bottom of the terminal screen: three
    left, centered, and on the right.


    > **NOTE** that the text within the labels is aligned according to the label''s
    position. The LEFT, CENTER, and RIGHT constants in the slk_set() function do not
    control the position of the labels on the screen but rather the text within the
    labels. Prove this: Edit lines 12, 13, and 13, replacing LEFT with CENTER. Then
    edit lines 17, 18, and 19, replacing RIGHT with CENTER.


    The labels are still arranged in the same pattern on the screen, but the text
    within the labels is centered.'
