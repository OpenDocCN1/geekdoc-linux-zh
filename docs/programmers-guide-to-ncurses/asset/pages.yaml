    # Also See


    Chapter 3, COLOR_PAIRS, attrset(),start_color()


    # COLOR_PAIRS


    The COLOR_PAIRS constant is an `int` value set internally by NCurses. It represents
    the number of `COLOR_PAIR(n)` colors available for use when you apply foreground
    and background text colors.


    # Man Page Format


    Not applicable.


    # Format Reference


    COLOR_PAIRS works like any C language constant. You can use `COLOR_PAIRS` as an
    immediate value, a comparison, or in combination with other values.


    # Return Value


    The value of COLOR_PAIRS depends on the number of colors available to the terminal.
    The `start_color()` function has not yet been used, then COLORS equals zero.


    # Notes


    You first use the `start_color()` function to initialize NCurses color functions
    before the COLOR_PAIRS constant can hold a meaningful value.

    There is a difference between the COLOR_PAIRS constant and the text attribute
    `COLOR_PAIR(n)`. The first is a constant value created by NCurses. The second
    is a text attribute representing a color pair created by the `init_pair()` function.

    Yes, the COLOR_PAIRS constant is plural, while the COLOR_PAIR(n) attribute is
    singular. But it makes sense when you think that COLOR_PAIRS is a quantity whereas
    COLOR_PAIR(n) is a single pair.'
