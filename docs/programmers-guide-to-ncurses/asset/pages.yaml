  md: '# 494 Appendix A = NCurses Library Reference


    # Also See


    keyname(), addch()


    # ungetch()


    The ungetch() function places a specific character back into the keyboard input
    queue.


    # Explanation


    Characters read from the keyboard are buffered by the terminal, one at a time
    into the various NCurses key-reading functions. So, for example, getch() reads
    the oldest character waiting in the buffer, the next character and so. When the
    buffer is empty, getch() waits or returns ERR depending on the nodelay status.


    What ungetch() does is to place a character into the keyboard buffer. That character
    becomes the next character to be read, unless ungetch() is called again with another
    character.


    You can use ungetch() to "stuff the ballot box" as it were, but it can also be
    used in conjunction with getch() to preview waiting characters.


    # Man Page Format


    ```

    int ungetch(int ch);

    ```


    # Format Reference


    ch is an int value representing a character to be placed into the keyboard input
    buffer.


    # Return Value


    OK upon success or ERR on failure.


    # Notes


    When stuffing more than one character into the keyboard buffer, remember to do
    it backwards. For example, to stuff OK into the buffer, you need to do:


    ```

    ungetch(''K'');

    ungetch(''O'');

    ```'
