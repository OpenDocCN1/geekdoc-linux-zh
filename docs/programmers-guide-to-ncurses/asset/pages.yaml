  md: 'specific lines in a window are marked as changed, and therefore written to
    the screen upon the next `refresh()` call.


    # Man Page Format


    ```

    int touchline(WINDOW *win, int start, int count);

    ```


    # Format Reference


    win is a NCURS variable representing a window created earlier in this program,
    or `stdscr` for the standard screen.

    start is an int value representing the starting row to be updated. Values range
    from 0 for the top row on through as many rows as there are in the named window.


    count is an int value that tells NCurses how many rows to update. Values range
    from 1 for the named row, or up to as many rows as there are from the current
    row to the end of the window.


    # Return Value


    ERR upon failure and an int value other than ERR upon success.


    # Notes


    Remember that `touchline()` requires three arguments: window, starting line, and
    count. It''s really a “touch lines” function.

    `touchline()` updates lines from the named row down.


    A common reason for using `touchline()` is when NCurses is having updating the
    current screen, such as when one window overlaps another.


    The `touchline()` function by itself does not update the screen. It merely updates
    coordinates between the named window and memory. A `refresh()` or `wrefresh()`
    function is required after `touchline()` to actually see the updated window.


    If you know specifically which lines of text updating, then the `touchline()`
    function is more efficient than calling `touchwin()`.


    # Examples


    ```

    touchline(stdscr, 0,10);

    ```


    Here, the top 10 lines of the standard screen are touched, meaning that each and
    every character will be updated on the next `refresh()` call.'
