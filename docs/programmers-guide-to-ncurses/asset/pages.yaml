  md: '# Appendix A ■ NCurses Library Reference 217


    # cbreak()


    The cbreak() function modifies input, activating what''s called cbreak mode. This
    increases the number of characters available to your program, as well as speeds
    up input somewhat.


    # Explanation


    NCurses read keyboard input through the terminal. This is known as cooked input
    mode as input is buffered by the terminal and certain characters typed at the
    keyboard are intercepted and used for certain things. This happens before the
    text is passed to your NCurses program.

    Buffering refers to how text is read. The terminal uses line buffering, which
    stores a line of text and sends it to NCurses after \n is encountered.

    The special characters include, for example, the Killchar used at the command
    prompt to erase a line of text or the Erase key used to delete text.

    The cbreak mode disables the line buffering and the trapping of keys as Killchar
    and Erasechar.


    # Man Page Format


    ```

    int cbreak(void);

    int nocbreak(void);

    ```


    # Format Reference


    The cbreak() command activates cbreak mode.

    The nocbreak() command restores cooked input mode (normal).


    # Return Value


    OK upon success, ERR upon failure.


    # Notes


    The settings for cbreak() and nocbreak() affect are inherited. That is, the settings
    may be on or off when your program starts. The only way to ensure that your program
    uses cbreak() mode input is to issue the cbreak() function in your code. Ditto
    for nocbreak().

    The cbreak() setting overrides raw. Even so, try to use either cbreak() or raw()
    functions, not both at the same time. See raw().'
