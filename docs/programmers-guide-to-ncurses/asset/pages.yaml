    # clearok()


    The clearok() function modifies window behavior in NCurses. When switched on,
    clearok() forces the next call to refresh() to entirely erase the window and redraw
    it from scratch.


    # Explanation


    Normally, the refresh() function merely updates parts of the window that have
    been changed. But by switching on clearok(), a complete erasure and rewrite of
    the window is possible.


    # Man Page Format


    ```

    int clearok(WINDOW *win, bool bf);

    ```


    # Format Reference


    win is the name of the window to erase and redraw. stdscr can be used for win
    to update the standard screen.

    bf is a Boolean value, either TRUE or FALSE. TRUE is used to activate erasing/redrawing
    for the new window; FALSE turns it off.


    # Return Value


    The function always returns OK.'
