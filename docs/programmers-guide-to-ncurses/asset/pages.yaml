  md: '# Chapter 14 = A Mixture of Stuff 169


    # Line Drawing


    NCurses has support for a variety of line-drawing and boxing functions, allowing
    you to spruce up your plain-text screen with some almost-graphical lines.


    The quality of the lines depends on the terminal. Sometimes the ASCII text characters
    as | - and are used for drawing. Sometimes the terminal may use extended ASCII
    or special line-drawing characters that look quite good on the screen. And sometimes
    you can specify which characters you want to use for drawing.


    # Boxing Windows


    One way to make a window stand out, especially when it''s smaller than the screen,
    is to draw a box around it. NCurses has a handy box() function to help make that
    possible:


    ```

    box(win,v_char,h_char)

    ```


    win is to draw the box. v_char is the character to use when drawing the vertical
    (up-down) lines around the window; h_char is the character for the horizontal
    (left-right) lines. If you put zero for v_char or h_char (or both), default characters
    are chosen as defined in the NCURSES.H header file. (See Listing 14-2)


