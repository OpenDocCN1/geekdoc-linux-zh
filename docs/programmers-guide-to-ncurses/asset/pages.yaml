    # vline()


    The vline() function draws a vertical (up-down) line from the cursor’s current
    location down a given number of rows.


    # Man Page Format


    ```

    int vline(ctype ch, int n);

    int wvline(WINDOW *win, ctype ch, int n);

    int mvvline(int y, int x, ctype ch, int n);

    int mvwvline(WINDOW *, int y, int x, ctype ch, int n);

    ```


    # Format Reference


    ch is a character used to draw the line. Typically only a single character, such
    as |, is used, you can combine characters, text attributes and colors with the
    ctype variable. Refer to Appendix C. When zero the default ASC_VLINE character
    is used. See Appendix B for more information on ACS characters.


    n is an int value that sets the length of the line in rows. Valid values for n
    range from 0 up to whatever an integer can hold. When n is zero no line is displayed.
    When n is greater than the distance between the current cursor position and the
    bottom of the window, then only as ch characters can be displayed are shown. (Long
    vertical lines will not cause the cursor to scroll, nor will the line wrap in
    any way.)


    Refer to the mv, mvw, and w prefixes elsewhere in this appendix for information
    on the win, row, and col arguments.


    # Return Value


    vline() always returns OK.


    # Notes


    The line always goes from the cursor’s current position down.

    Drawing the line does not affect the cursor’s location. The cursor remains at
    its previous location or whichever location was set by the mvvline() or mvwvline()
    functions.'
