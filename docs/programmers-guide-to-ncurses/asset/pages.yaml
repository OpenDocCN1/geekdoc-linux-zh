    # wcursyncup()


    The wcursyncup() function sets the cursor position for all ancestors of a window
    equal to the cursor position in the named window.


    # Man Page Format


    ```

    void wcursyncup(WINDOW *win);

    ```


    # Format Reference


    win is the name of a subwindow, a WINDOW variable.


    # Return Value


    The function returns no value.


    # Notes


    wcursyncup() basically fixes the cursors'' location. The cursor doesn''t move
    when focus is changed from the subwindow to any of its parents.


    Each window still maintains its own cursor location; wcursyncup() simply sets
    them all to the same relative screen coordinates.


    # Example


    ```

    wcursyncup(little);

    ```


    The statement sets the cursor''s location in all parents of subwindow little to
    the same location.'
