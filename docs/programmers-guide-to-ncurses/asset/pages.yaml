    # notout()


    The timeout() function determines whether or not NCurses input functions pause
    after the user presses the Esc key.


    # Explanation


    An escape sequence can be generated either by the keyboard, such as when a specialty
    or function key is pressed, or manually by the user. A one-second timeout is used
    to help determine whether the escape sequence is generated by the keyboard or
    the user, seeing how user input is slower than the escape sequence produced by
    the keyboard.'
