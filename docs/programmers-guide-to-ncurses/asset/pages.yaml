    # touchwin()


    The touchwin() function directs NCurses to treat a window as if every character
    on the window has been changed or modified since the last refresh, forcing NCurses
    to redraw the entire window on the next refresh() or wrefresh() function.


    # Explanation


    Internally, NCurses keeps track of which parts of a window have been updated since
    the last refresh. For efficiency''s sake, only those changed parts of the window
    are updated to the current screen on the next refresh. By using touchwin(), every
    character in the window is flagged as touched, or changed, forcing NCurses to
    redraw everything from scratch on the next refresh() or wrefresh() call.


    # Man Page Format


    ```

    int touchwin(WINDOW *win);

    ```


    # Format Reference


    touchwin(win)


    win is the name of a window to touch. After the call, all locations in the window
    are flagged as requiring updating for the next call to wrefresh(win).'
