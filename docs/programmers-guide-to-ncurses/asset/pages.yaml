  md: '# isendwin()


    The endwin() function is used to determine whether NCurses visual mode has not
    been reactivated after a call to the endwin() function has been made.


    # Explanation


    Though endwin() is officially the “End of NCurses Program” function, it’s still
    possible to use NCurses functions after the endwin() call has been made.


    For example, endwin() can be used to suspend NCurses visual mode and return to
    ty mode. Afterwards, any subsequent calls to refresh() or date() restore NCurses
    visual mode, meaning that endwin() has been called, NCurses functions are still
    being used. The (endwin() function still needs to be called when the program does
    quit.


    The isendwin() returns TRUE if endwin has been called and the program has not
    re-activated NCurses visual mode. isendwin() returns FALSE if endwin() has been
    called and followed by a refresh() or date() function to once activate NCurses
    visual mode.


    # Man Page Format


    ```

    bool isendwin();

    ```


    # Format Reference


    The function has no arguments.


    # Return Value


    A Boolean value, either TRUE or FALSE, both of which are defined in NCURSES.H
    TRUE is returned when the endwin() function has been called and NCurses visual
    mode has been restarted by a refresh() or doupdate() function. FALSE is returned
    when endwin() has been called and NCurses has not returned to visual mode.


    # Notes


    Do not use this function to determine whether or not NCurses is in visual mode.
    FALSE is returned when isendwin() is called before endwin() has been issued.'
