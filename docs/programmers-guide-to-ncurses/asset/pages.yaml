- img_proc: true
  md: '# Chapter 7 Keyboard Madness!


    The preceding function directs the get() function to become nonblocking- for the
    given window, the standard screen (stdscr). To restore screen get() to its normal
    mode, version of nodelay() is used:


    ```

    nodelay(stdscr,FALSE)

    ```


    When get() is in nonblocking mode, it will not pause program execution to wait
    for a key press. Instant, when no key is pressed or it''s waiting to be read from
    the keyboard buffer, get() returns the value ERR and the program continues. Likewise,
    if a key is pressed, get() returns the key''s value, as it usually does — and
    the program continues.


    > TRUE, FALSE, and ERR are defined in NCURSES.H.


    # Is a Character Waiting?


    The following program in Listing 7-1 demonstrates how get()''s personality can
    be changed by using the nodelay() function.


    Listing 7-1: keywait1.c


    ```

    1 #include <ncurses.h>

    2 int main(void)

    3 {

    4

    5 int value = 0;

    6 initscr();

    7

    8 addstr("Press any key to begin:\n");

    10 refresh();

    11 get();

    12

    13 nodelay(stdscr,TRUE); /* turn off get() wait */

    14 addstr("Press any key to stop the insane loop!\n");

    15 while(get() == ERR) {

    16

    17 printf("%d\r",value++);

    19 refresh();

    20 }

    21

    22 endwin();

    23 return 0;

    24 }

    ```'
