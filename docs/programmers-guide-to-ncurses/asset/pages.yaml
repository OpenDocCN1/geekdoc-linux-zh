    # slk_init()


    The slk_init() function directs NCurses to configure itself to display soft label
    keys on the screen.


    # Explanation


    Soft label keys consist of one or two rows of text along the bottom of the screen.
    Each label is associated with a function or soft label key, so that pressing that
    key carries out the function as indicated (or so the theory goes).

    curses soft label key (slk) functions allow for the display of the soft label
    keys in your program, though programming your keyboard''s function keys must also
    be done to get the things to work.


    # Man Page Format


    ```

    int slk_init(int fmt);

    ```'
  merge: -1
  pgno: 473
- img_proc: true
  md: '# 452 Appendix A ■ NCurses Library Reference


    # Format Reference


    fmt is an int value from 0 through 3. The values specified describe the soft keys
    are configured, as referenced in Table A-16 and illustrated in Figure A-14.


    # Return Value


    ERR on failure, OK (or a value other than ERR) on success.


    # Notes


    The slk_init() function must be used before initscr() or newterm(). The slk_init()
    decreases the number of lines available on the standard screen by one or two,
    depending on the format. This affects the value of the LINES constant.


    The slk_set() function is used to apply labels to the labels. To make the labels
    show up, slk_refresh() is used.


    I''ve found that when specifying 3 for fmt, it''s often necessary to use an slk_restore()
    command just after initscr() to get the index line to display.


    There are terminals where the soft keys are supplied by default; for example,
    they''re not part of a standard screen. For those terminals, NCurses you program
    labels. The labels are simulated on other terminals (by removing one or two lines
    from the standard screen).


    Table A-16: Soft label setup for slk_init()''s n argument


    | FMT | TOTAL LABELS | CHARS PER LABEL | PATTERN | INDEX LINE |

    | 0 | 8 | 8 | 4-4 | No |

    | 1 | 8 | 8 | 3-2-3 | No |

    | 2 | 12 | 5 | 4-4-4 | No |

    | 3 | 12 | 5 | 4-4-4 | Yes |


    ![](img/b0e33f0db107583cf9267e27aa42f380_474_0.png)


    Figure A-14: Soft label key setups'
