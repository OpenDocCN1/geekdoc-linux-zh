  md: "# Chapter 2 = Basic I/O, the NCurses Way\n\nAlso, `initscr()` isn't necessarily\
    \ the very first NCurses function you'll use in your code. There are several functions\
    \ in NCurses that must be used before `initscr()`. These functions are mentioned\
    \ under the definition of `initistscr()` in Appendix A, and more information on\
    \ each function can be found in that appendix below.\n\n# The endwin() Function\n\
    \nThe cleanup hitter in the NCurses line up the `endwin()` function. It undoes\
    \ any modifications that NCurses has made to your terminal, and does other tidying\
    \ up.\nIt's very important that you finish your NCurses program with this command!\n\
    If you neglect to use `endwin()`, your terminal's behavior becomes unpredictable\
    \ (this is the voice of experience here). So be very, very sure that you use `endwin()`\
    \ when your program is done—especially if you're programming some large, with\
    \ several exit holes.\n\nNote that the standard C output functions—putc()`, `puts()`,\
    \ `printf()`, and so on—do output when NCurses is active, though by doing so NCurses\
    \ would be confused about what's on the display. It's better not to use such output\
    \ functions while NCurses is actively outputting text.\n\nIncidentally, `endwin()`\
    \ need not be the end of your NCurses program. It's possible to use `endwin()`\
    \ to merely suspend NCurses and return to the terminal. When the `refresh()` function\
    \ is used after `endwin()`, it reactivates NCurses visual mode, though you must\
    \ use another `endwin()` function to properly end your program. The entry for\
    \ `endwin()` in Appendix A explains more about this feature.\n\n# The refresh()\
    \ Function\n\nRare is the NCurses program without a `refresh()` function. It's\
    \ almost required. `refresh()` updates the screen, noting any changes between\
    \ what you want on the screen and what's there and writing the difference.\nUse\
    \ the following code in Listing 2-1 to create the `cls` program.\n\nListing 2-1:\
    \ cls.c\n\n```\n#include <ncurses.h>\nint main(void)\n{\n    initscr();\n    refresh();\n\
    \n    endwin();\n    return 0;\n}\n```"
