    value, the lighter the gray.


    The default colors used by NCurses relate to the init_color() statements shown
    in Table A-7.


    The color_content() function is used to determine the red, green, and blue color
    values of NCurses, kind of opposite of the init_color() function. See color_content()
    elsewhere in this appendix.


    # Examples


    ```

    init_color(5,1000,500,0);

