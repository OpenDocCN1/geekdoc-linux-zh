    drop box twice to confirm that your mail actually made it into the box and is
    not somehow stuck on the hinged lid.

    Time to compile!


    # Know Thy Compiler


    The standard C compiler in the UNIX environment is gcc, the GNU C compiler. Here
    is how it works in your book: You will see source code listed, such as the goodbye.c
    program. You will immediately know to type it and compile it.

    To compile, you will type something at the shell prompt, perhaps like this:


    ```

    gcc goodbye.c -lncurses

    ```


    That’s the gcc command, you compiler.

    The first option is the name of the source code file, the file you created.

    in this case, it’s named goodbye.c. The single, lowercase c denotes a standard
    code file, not C++.

    Finally comes -lncurses, which tells the compiler to -l “link” in the NCurses
    library. This is very important! NCurses is not just a header file; it’s also
    a library. And you must link in the library to have those NCurses functions work.


    Use this:


    ```

    gcc goodbye.c -lncurses

    ```


    And you’re compiled. Or not.


    # Linking NCurses or Ncurses?


    On most systems I’ve visited, both the CURSES and NCURSES libraries are the same
    thing, meaning that if you link in -lncurses instead of -lncurses, the results
    are the same. The only advantage here is that typing -lcurses saves you a keystroke.
    Otherwise, I recommend using -lncurses.'
