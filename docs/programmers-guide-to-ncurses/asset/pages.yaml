    # assume_default_colors()


    assume_default_colors() is an extended NCurses function that allows you to set
    which foreground and background colors to use as the default start_color() initializes
    NCurses for color.


    # Explanation


    After start_color() turns on NCurses text support, the text background color is
    set to black and the foreground color set to white. Black and white, or COLOR_BLACK
    and COLOR_WHITE, are the defaults, defined as COLOR_PAIR(0). By using the assume_default_colors()
    function, you can change the values of COLOR_PAIR(0) to something else or to whichever
    colors the terminal program otherwise uses to display text.


    # Man Page Format


    ```

    int assume_default_colors(int fg, int bg);

    ```


    # Format Reference


    fg is an int value representing the color for text, the foreground color. bg is
    an int value represent the background color. Values for both fg and bg range from
    0 through the value of COLORS-1. A special value of -1 sets the foreground and
    background colors equal to the same color as used by terminal when not running
    NCurses. See the Notes for more information.


    # Return Value


    When all goes well, the function returns OK, ERR otherwise.'
