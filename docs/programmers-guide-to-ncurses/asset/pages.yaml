  md: '# CHAPTER 7


    # Keyboard Madness!


    The get() function is one of the immediate blessings NCurses offers struggling
    *nix programmers. Unlike the C macro getchar(), which is a stream-reading command,
    get() hops back right away with whatever key was pressed. Such a function helps
    make your programs more interactive, which can be a huge bonus.


    Using get() merely to read the keyboard is grand, but there is far more get()
    can do. In fact, this lengthy chapter discusses many of the options available
    to get() and how you can use it to do more than you possibly expected.


    # Reading from the Keyboard


    The get() function normally waits until a key is pressed on the keyboard. This
    is known as a blocking call; program execution is stopped until a key is pressed.
    It''s possible to change that behavior so get() does not pause the program. In
    NCurses, that''s done with the nodelay() function.


    ```

    nodelay(sdscr,TRUE)

    ```'
