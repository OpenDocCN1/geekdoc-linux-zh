  md: '# typehead()


    The typehead() function controls input NCurses typehead feature (see the next
    section) and determines which input source to monitor for typehead.


    # Explanation


    typehead is an internal feature NCurses uses to optimize input. When there is
    keyboard activity during a screen update, NCurses suspends the update to immediately
    process the keyboard input, specifically if the input is coming from a tty. The
    next refresh() or doupdate() call then completes the screen update.


    The typehead() function allows you to specify which input source to monitor for
    typehead or whether typehead should be disabled.


    # Man Page Format


    ```

    int typehead(int fd);

    ```


    # Format Reference


    fd is a file descriptor or FILE type, such as stdin. It specifies the input source
    typehead monitors. When the value -1 is specified, then typehead is disabled.


    # Return Value


    OK on success or ERR on failure.


    # Notes


    The file value typehead() normally depends on how NCurses was started. When initscr()
    is used, then the default value is stdin, standard input. When newterm() is used,
    then default input is set as the argument (see newterm()).


    The typehead feature does disrupt screen updates. If you''d rather your program
    always and completely update the screen whenever refresh() or doupdate() is called,
    then specify typehead(-1).'
