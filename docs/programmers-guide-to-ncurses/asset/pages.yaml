- img_proc: true
  md: '# Appendix A ■ NCurses Library Reference 201


    # Return Value


    The return value is stated as “not important” according to the documentation.


    # Notes


    Attributes set by attrset() can be removed by using the atroff() function. New
    attributes can be added by using the attr() function. attrset() is an in-line
    function; it affects only text displayed after attrset() is used. attrset() does
    not reset all text in a window at once. Attributes affect the output of the addch(),
    addstr(), and printw() functions.


    All text can be turned off using this statement:


    ```

    attrset(A_NORMAL);

    ```


    Both attr() and the attrset() functions are used to set text attributes. attr()
    always adds the text attribute(s) specified to whatever attributes exist. attrset(),
    on the other hand, resets all attributes to only those listed by the attrset()
    function.


    In NCurses


    Multiple attributes are applied by specifying each in the attrset() function,
    separated by a | (logical OR) using the COLOR_PAIR attribute.


    It is technically possible that using a logical OR to combine attributes may not
    work. For example, if more than the number of color pairs are defined (which can
    happen on some terminals, as xterm-88color or xterm-256color), then using the
    logical OR may result in nonexistent attributes being assigned. (NCurses 5.5 can
    be compiled to support 32768 colors.)


    The attributes listed in this entry can also be combined with COLOR_PAIR(n) values,
    where n indicates a foreground (text) and background color combination, as defined
    by init_pair().


    Not all attributes listed in this entry are implemented on every terminal. For
    example, NCurses does not implement the A_TOP, A_LEFT, A_RIGHT, A_VERTICAL, or
    A_HORIZIONAL attributes because there is no terminal that uses these features.
    Refer to the “Format Reference” section earlier to see which are available for
    you to use.


    ```

    attrset(A_NORMAL) turns off all attributes.

    ```'
