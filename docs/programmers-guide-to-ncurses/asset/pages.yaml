  md: '# Man Page Format


    int untouchwin(WINDOW *win);


    # Format Reference


    win is a WINDOW variable referencing a window to be untouched. After the function
    is called, NCurses assumes that the window’s memory and information on the screen
    have been synchronized and an update is not needed.


    # Return Value


    ERR upon failure or an int value other than ERR upon success.


    # Notes


    The opposite of the untouchwin() function is touchwin(), which tells NCurses that
    every possible text position in a window needs updating on the next refresh()
    call.


    There no untouchlin() or touchline() function corresponding to untouchwin(), but
    there is the wtouchln() function. In fact, untouchwin() is most likely macro version
    of wtouchln().


    # Example


    ```

    untouchwin(help);

