  md: '# We Control the Horizontal and the Vertical


    For plain-old straight lines — lines from here to there but not diagonal or weird\angles
    — NCurses has the following functions:


    ```

    hline(ch,n)

    vvline(ch,n)

    ```


    The hline() and vline() draw a horizontal or vertical line

    as the cursor’s current position (right or down, respectively), as shown in

    Listing 14-5. The line is drawn using character ch or using the standard line-

    drawing character when ch is zero. n sets the length of the line in characters.


    Remember: The line is drawn from the cursor’s current position. And nei-

    ther function, hline() nor vline(), changes the cursor’s position.


    Listing 14-5: steps.c


    ```

    1 #include <curses.h>

    2

    3 int main(void)

    4 {

    5 int y,x,maxy,maxx;

    6

    7 initscr();

    8

    9 getmaxx(stdscr,maxy,maxx);

    10

    11 for(y=x;y<maxy;y++,x+=2)

    12 {

    13 move(y,x);

    14 hline(0,maxy-x);

    15 vline(0,maxy-y);

    16 }

    17 refresh();

    18 getch();

    19

    20 endwin();

    21 return 0;

    22 }

    ```


    When the planets are properly aligned, Figure14-3 should be something like

    the result you’ll see.


    As with many other screen-output functions, there are mv and w prefixes for

    the hline() and vline() function (see Listing 14-6).'
