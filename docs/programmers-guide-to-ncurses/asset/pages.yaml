  md: '# Appendix A NCurses Library Reference


    # Format Reference


    chstr is an array of the NCurses ctype, a long int containing character and formatting
    information read from a window. The array contains ctype characters read from
    the cursor''s current position to the right a given number of characters or to
    the right edge of the window. The array is saved with \0 as the final element.


    When n is specified (in inchstr() functions) n characters are read from the cursor''s
    current position. The value of n ranges from 0 through the width of the window,
    though n 0 is specified nothing is read. A value of -1 reads all characters from
    the cursor''s position to the end of the row. Values larger than the length of
    the row are read only to the end of the row, not beyond.


    When n is not specified, as with the inchstr() functions, characters are read
    from the cursor''s location to the end of the row. (This is the same as -1 is
    specified for n).


    Refer to the mv, mvw, and w prefix entries elsewhere in this appendix for information
    on the win, y, and x arguments.


    # Return Value


    ERR is returned when the function fails. Otherwise, an int value other than ERR
    is returned.


    # Notes


    Do not assume the width of the window being read! It''s possible by using inchstr()
    to overflow the ctype array. Buffer overflows are a Bad Thing and must be avoided.


    I recommend using getmax() to determine a window''s row width, then use malloc()
    to properly allocate a ctype array, and finally use inchstr() to read in the number
    of ctype characters from the window. Refer to the Sample Program.


    Each ctype character can be marked using the logical & (AND) to extract specific
    information: character, attribute, or color pair. Refer to the entry inch() for
    the details.


    This function does not move the cursor.


    # Examples


    ```

    inchstr(chstr)

    ```


    Here, inchstr() reads text from the cursor''s current position on the standard
    screen to the end of the row. The text and attributes are stored in the ctype
    array, chstr.


    ```

    minchstr(0,0,title)

    ```'
