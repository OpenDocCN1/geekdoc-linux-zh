  md: '# CHAPTER

    10


    # More Window Tricks


    NCurses has a basket full of windows tricks, more than what one chapter alone
    can handle. In fact, Chapter 8 just touched on the surface of what you can do
    with windows. This chapters carries on, offering even more windows tricks, including
    copying windows, windows that scroll or not, and moving windows.


    # Copying Window Contents


    Copying text between two windows is possible by using one of NCurses win-dow copying
    functions. They are


    +   - overlay (swin, dwin)

    - overwrite (swin, dwin)

    - copywin (swin, dwin, srow, scol, drow, dcol, dxrow, dxcol, type)

    - dupwin (win)


    Of the first three, the copywin() function is my favorite and the most pow-erful.
    Even so, each one serves a purpose and helps you get text from one-dow into another.'
