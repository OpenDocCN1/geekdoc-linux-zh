    \ back and forth between the windows, displaying information.\n\n# Scrolling Around\n\
    \nScrolling text doesn't seem like a big deal, and it isn't — today! Thirty years\
    \ it was a big deal — so much that so a scrolling screen of text was patented\
    \ (probably by) IBM.\n\nThe fact that text scrolls on the screen seems to be taken\
    \ for granted. It's not nothing that the terminal does automatically: scrolling\
    \ must be programmed. After all, the screen is merely a matrix of text. Internally,\
    \ the screen buffer is only as big as the screen. Whenever you see something larger\
    \ than the screen displayed (and scrollable), it's programming magic that moves\
    \ text from a separate buffer to the screen.\n\nFortunately scrolling the screen\
    \ is no big deal, even if you have to program the scrollview: a line of text is\
    \ removed, the remaining text is moved, then a new line of text is added. It's\
    \ not really that complicated, and you could do it yourself but you don't have\
    \ to — NCurses gladly handles scrolling your programs require.\n\n# Can it scroll?\n\
    \nIn Ncurses, scrolling text is a window attribute, just like the window's size,\
    \ location, cursor location, and other attributes. This attribute is normally\
    \ turned off, meaning that windows in Ncurses doesn't scroll a window by default.\
