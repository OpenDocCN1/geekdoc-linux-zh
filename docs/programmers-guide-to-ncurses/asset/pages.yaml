  md: '# Appendix A ■ NCurses Library Reference 207


    # # Notes


    bkg() over-writes any existing text attributes applied by attrtr() or attron().
    For example, if a word is highlighted in bold text and then bkg() is used to clear
    the screen yellow-on-white, the bold text attribute is removed and the text takes
    on the yellow-on-white attribute.


    Characters fill the background, nontext locations on the screen, when applied
    by bkgd(). Any text output overwrites these “background” characters. A further
    use of bkgd() with a character as part of the attribute also erases those background
    characters.


    bd() differs from bkgset in that the latter affects only new text to the window.
    If you want to change a window''s background all at once, use bkgd().


    It''s a common type to transpose the g and d in bkgd().


    # # Examples


    bkgd(A_BOLD);


    This function sets all text attributes on the screen to bold. This replaces any
    existing applied attributes, including color.


    bkgd(COLOR_PAIR(1) | ''*'');


