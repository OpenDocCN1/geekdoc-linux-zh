  md: '# Do You Think a..out Is a Goofy Name?


    Yes, a..out is a goofy name, but that''s because the compiler doesn''t know any
    better.


    For the myriad test programs in this book, using a..out will be a blessing. It
    won''t take up as much disk space as individually compiling program and creating
    separate silly programs, plus it means you can instantly recall the ./a..out command
    using your shell''s history command.


    But anyway, if you''d rather compile to a different output file, you need to specify
    the -o switch when you use gcc. It goes like this:


    ```

    gcc goodbye.c -lncurses -o goodbye

    ```


    gcc is the compiler.

    goodbye.c is the source code.

    -lncurses directs the compiler to link in the NCurses library.

    And finally, goodbye gcc to create the output file named goodbye as opposed to
    creating a..out.


    Using the preceding command to accomplish this.

    Do not forget the ./ prefix! Silly old UNIX needs to know where to find the file.
    So you must type ./GOODBYE to run the program.


    By the way, your file doesn''t have to be the same as the source code. You can
    use the following command if you like:


    ```

    gcc goodbye.c -lncurses -o cloppyfeen

    ```


    This creates the program file named cloppyfeen from the source code found in goodbye.c.,
    so what you name the final program file can be anything thing you like.


    # All Done!


    That pretty much does it for your whirlwind introduction to NCurses programming
    using the C language in the UNIX environment. This chapter has imparted the following
    knowledge, stuff that you''ll need to carry with you throughout the remainder
    of this document:


    # General Info


    Keep in mind that it''s a good idea to keep learning NCurses files in your special
    NCURSES directory. This is assumed.


    Do remember those handy history commands. You''ll be doing a lot of repetitive
    commands here, and pressing the up arrow key is a lot easier than retyping boring
    old UNIX commands.'
