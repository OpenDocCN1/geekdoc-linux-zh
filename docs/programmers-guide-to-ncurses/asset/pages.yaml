  md: '# Appendix A ■ NCurses Library Reference 301


    # Return Value


    A Boolean value is returned: TRUE if the terminal has insert and delete character-capabilities,
    FALSE if not.


    # Notes


    If the terminal does not have the ability to insert and delete characters, then
    it will be provided by NCurses in software. The insch() function is used to insert
    a character on the screen. The delch() function deletes a character. The idock()
    function is used to switch between hardware and software modes for inserting and
    deleting characters. se idock(). This is one of several NCurses functions that
    report back information on the terminal. Others include baudrate(), erasechar(),
    killchar(), has_il(), longname(), termattr(), and termname().


    # Example


    ```

    if(has_ic())

    ```


    The condition passes when the terminal has the ability to insert and delete characters.


    # Sample Program


    ```

    1 #include <ncurses.h>

    2

    3 int main(void)

    4 {

    5   initscr();

    6

    7   addstr("This terminal *");

    8   if(has_ic())

