  md: '# Appendix A ■ NCurses Library Reference 281


    The echo()/nocho() functions control whether or not get() displays its input on
    the screen. Normally, get() displays each character typed as its input; refresh()
    is required.


    To turn get() into a non-blocking call (meaning getch() does not wait for a key
    to be pressed, use nodelay()).


    To read non-alphanumeric keys on the keyboard, the keypad() function is used.
    Use keypad().


    Input modification functions that are not window-specific apply to all input for
    getch(), as well as getstr().


    To read a character at a specific location on the screen, the inch() function
    is


    To insert a character, pushing text to the right, use the insch() function.


    Remember that getch() returns an int value, not a char. There are still a few
    old fogs like myself who will mistakenly use char variables with getch().Nope!
    Use int variables.


    # Examples


    ```

    c = getch();

    ```


    Here, the variable c receives the value of the next key typed at the keyboard.


    ```

    key = mvgetch(5,30);

    ```


    Here, the cursor moves to row 5, column 3, where the program waits for a key to
    be pressed and its value stored in the key variable.


    ```

    while (ch=getch()) != ''\

    ''

