  md: '# A Mixture of Stuff


    It would be tough to write a book that covers every single NCurses function. A
    lot of the functions are internal or used only in specific cases by advanced users
    who know their operating systems intimately. For most of us programmers, however,
    the basic smattering of NCurses functions presented in the previous chapters is
    enough to create more visually interesting programs than by just using the standard
    C I/O functions.


    This chapter contains a mélange of leftover functions not covered earlier in this
    book. These functions aren''t obscure or unique enough to deserve full banishment
    into Appendix A, nor are they worthy enough to be put into an earlier chapter.
    No, they live here. And I love using the word mélange.


    # Adios, Cursor


    Sometimes the blinking (or not) cursor is a benefit, and sometimes it just gets
    in the way. When it gets in the way, NCurses lets you turn it off, hiding the
    cursor from view. Here''s the function:


    ```

    curs_set(n)

    ```


    The curs_set() function is how NCurses controls the cursor. The value of n can
    be 0, 2, or 2: 0 makes the cursor invisible; 1 sets the cursor to normal'
