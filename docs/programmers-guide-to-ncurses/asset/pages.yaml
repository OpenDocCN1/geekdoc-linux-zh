    # Handy Shell Commands to Know


    | cat | Displays a text file (source code) to the screen |

    | clear | Clears the screen |

    | cp | Copies a file |

    | ls -l | Lists files in the long format |

    | ls | Lists files |

    | mv | Moves or renames a file |

    | rm | Removes (deletes) a file |


    # Source Code Tidbits


    End the source code file with .C to show that it''s a C language source file.
    (Some editors, such as vim, may recognize this and bless you with color-coded,
    in text contents as you edit).

    The main() function is an int and must return a value to the shell either return
    or the exit() function.

    If you use the exit() function, remember to include the STDLIB.H header file at
    the top of your source code.

    If the program seems not to display anything, remember to add a get() function
    before the endwin() function.


    # Compiling Tips


    The compiler used in this book is gcc.

    You must link in the NCurses library by using the -lcurses option to properly
    compile these programs.

    The program produced is always named a.out.

    You must type ./a.out to run the program file.

    You can use the -o compiler option to specify the name of the output file as something
    different from a.out.

    The compiler command format is:


    ```

    gcc filename.c -incurses

    ```


    You supply the filename according to the source code name given in this document.'
