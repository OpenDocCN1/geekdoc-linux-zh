  md: '# putwin()


    The putwin() function saves a window''s data to a formatted file on disk. All
    window information is saved: size, text, attributes, and so forth.


    # Man Page Format


    ```

    int putwin(WINDOW *win, FILE *filep);

    ```


    # Format Reference


    win is the name of a WINDOW variable representing the window to save to disk.
    filep is a FILE pointer representing a file open for writing.


    # Return Value


    ERR on failure, or OK (or a value other than ERR) on success.


    # Notes


    The getwin() function is used to read a window data file previously saved by putwin().
    See getwin().nThe file saved starts with a WINDOW structure header and then contains
    ctypes-like data for each character in the window. As saved to disk, each character
    in the window occupies 16 bytes.


    # Example


    ```

    putwin(help,hfile);

    ```


    The statement saves information about contents of the window help to a file referenced
    by hfile.


