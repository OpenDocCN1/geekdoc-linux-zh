  md: '# 378 Appendix A ■ NCurses Library Reference


    # newterm()


    The newterm() function initializes NCurses for use on a specific terminal, with
    a specific terminal configuration, for a one-line terminal, or for multiple terminals.
    newterm() is used in place of initscr() when your code needs to access terminals
    in a special way.


    # Man Page Format


    ```

    SCREEN *newterm(char *type, FILE *outfd, FILE *infd);

    ```


    # Format Reference


    type is a string of text representing a terminal type, such as ansi or xterm,
    which is what helps placing stuff on the screen. When NULL is specified, the value
    of environmental variable $TERM is used.

    outfd is a FILE pointer representing a file opened for output to the terminal.

    infd is a FILE pointer representing a file opened for input from the terminal.


    # Return Value


    The function returns a SCREEN pointer, which identifies a screen structure in
    memory. It''s through that pointer that NCurses accesses the terminal named by
    newterm().


    # Notes


    Use the set_term() function after initializing NCurses with newterm() to set the
    output terminal. See set_term().

    After everything is set up, you NCurses input and output functions with the new
    terminal as you did when initscr() sets up for one terminal only.

    The termname() function can be used to obtain the current terminal name (the typeterm
    argument), though using NULL seems simple enough. See termname().


    # Example


    ```

    term_a = newterm("ansi",fileout,filein);

    ```


    Here, a new ansi terminal is created using open file handles fileout for output
    and filein for input. The resulting NCurses terminal is saved in the'
