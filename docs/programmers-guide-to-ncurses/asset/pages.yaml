  md: '# Also See


    Chapter 3, attrset(),attron()


    # start_color()


    The start_color() function is used on those terminals that can display colored
    text to allow NCurses to access those color abilities. No NCurses text or background
    color functions can be used until start_color() has initialized colors in NCurses.


    # Man Page Format


    ```

    int start_color(void);

    ```


    # Format Reference


    The function has no arguments.


    # Return Value


    OK upon success, meaning that your program can use color functions and color attributes.
    ERR upon failure.


    # Notes


    The has_colors() function can be used initially to determine whether not the terminal
    is capable of setting text colors. start_color() traditionally appears just after
    the initscr() or newterm() function.


    The colors applied to or to a window''s background are created as color pairs.
    See init_pair().


    Colors are applied similar to other attributes. See attrset(), attron(), bkgd().
    Colors can also be applied directly by using a logical OR to build a ctypes character,
    and then using any of the ctypes character functions to place that in a window.


    Custom colors can be created using the init_color() function, though not every
    terminal supports it. Also see the can_change_color() function.


    The number of colors available to a terminal can be found by examining the COLORS
    constant. See COLORS.'
