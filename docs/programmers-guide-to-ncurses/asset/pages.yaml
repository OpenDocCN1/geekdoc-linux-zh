  md: '# Also See


    Chapter 2, getch(), scanw()


    # getsysx()


    The getsysx() reads the virtual screen''s cursor location.


    # Explanation


    NCurses is a window-oriented environment. The cursor''s position is normally read
    native to a window, such as the standard screen. Yet the cursor also has a location
    in the real world on the terminal. It''s the getsysx() function that returns that
    real world location.


    # Man Page Format


    ```

    void getsysx(int y, int x);

    ```


    # Format Reference


    y and x are int variables, not pointers. After the function call, y holds the
    value of the cursor''s row and x holds the column value.


    # Return Value


    This function is a macro, and as such its return value is unimportant.


    # Notes


    Values returned in y and x range from 0, for the upper-left corner of the window,
    the maximum row and column values for the standard screen.

    When -1, -1 is returned it means leaveok() has been TRUE for a window.

    To read the cursor''s location in a window use the getsysx() function.

    When using the ripoffline() function you should limit the use of the values returned
    by getsysx() only as arguments for the setysx() function.

    I get the hint from the man pages that getsysx() is really meant as an interface
    NCurses function to be used in conjunction with setysx().


    # Example


    ```

    getsysx(row,col);

    ```'
