    # newwin()


    newwin() function creates a new window within NCurses.


    # Man Page Format


    ```

    WINDOW *newwin(int nlines, int ncols, int begin_y, int begin_x);

    ```


    # Format Reference


    nlines is an int value that sets the height of the window in rows. Values

    for nlines range from 1 through the height of the standard screen. When 0 is

    specified for nlines, the new window''s height will be the same as the stan-

    dard screen''s height.

    cols is an int value setting the width of the window in columns. Values

    range from 1 through the width of the standard screen. Specifying 0 for ncols

    sets the new window''s width to be the same as the standard screen''s width.'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# Appendix A ■ NCurses Library Reference 381


    begin_y is an int value indicating the location of the new window''s row relative
    to the standard screen. Values range from 0 for the top row to the maximum number
    of rows on the standard screen minus the window''s height.

    begin_x is an int value indicating the location of the new window''s leftmost
    column. Values range from 0 for the far left column to the maximum number of columns
    on the standard screen minus the window''s width.

    Together, begin_y and begin_x plot the coordinates of the new window''s upper-left
    corner. The window''s lower-right corner is calculated by adding the nlines and
    ncols values to that coordinate.


    # Return Value


    Upon success, the function returns a pointer referencing a WINDOW structure in
    memory. The pointer is used to reference the window in other NCurses commands.


    Upon failure, the pointer is equal to NULL. Failure occurs when the window is
    larger than the screen, part of the window does not fit on the screen, or not
    enough memory is available to allocate space for the window.


    # Notes


    Refer to Figure 8-1 for a visual representation of how the newwin() function''s
    arguments map onto the screen.


    +   The smallest window possible is a 1-by-1 character window, big enough for
    only one character.


    +   The window cannot be larger than the standard screen, nor can the window be
    positioned so that part of it extends beyond the screen''s rectangle. Either condition
    causes an error (NULL pointer) to be returned by newwin().


    +   When you need a window larger than the screen, you need a pad. newpad().


    +   Refer to the entries for COLS and LINES to get the size of the standard screen.


    +   The function newwin(0,0,0,0) creates a new window the same size and position
    as the standard screen.

    newwin() merely creates the window''s contents. Userefresh() for that task.

    The w prefix commands direct output or detect input associated with a particular
    window.


    +   Windows can be splashed with color, text attributes, or even a “background”
    text character. Refer to the bkgd() function for more info.


    +   To place a box or border around a window, refer to the box() and border()
    functions.'
