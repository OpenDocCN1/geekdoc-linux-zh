  md: '# Explanation


    A mouse event is some type of action done with the mouse. It includes pressing,
    releasing, clicking, double-clicking, and triple-clicking for up to four mouse
    buttons, as well as using the Ctrl, Shift, Alt keys while clicking. Refer to Table
    A-10 for the full list.


    The mousemask() function determines whether or how many of the various mouse events
    a program is to monitor. The actual reading of the mouse events is done through
    a combination of the get() and getmouse() functions. See getmouse().


    Additionally, the mousemask() function can be used to determine whether or not
    a given terminal can read the mouse. Refer to the Sample Program.


    # Man Page Format


    ```

    mmask_t mousemask(mmask_t newmask, mmask_t *oldmask);

    ```


    # Format Reference


    newmask is a mmask_t variable (long int), representing the mouse actions your
    program monitors. NCURSES.h file and listed in the Notes section. Multiple actions
    are specified in the newmask argument by using a | (logical OR) between the constants.
    Or the ALL_MOUSE_EVENTS value can be used to monitor all mouse actions. oldmask,
    also an mmask_t variable, can be a previous value returned from the mousemask()
    function, but mostly NULL is specified in its place.


    # Return Value


    The value returned by mousemask() is an mmask_t variable representing the mouse
    actions mousemask() will be monitoring, specifically those actions your terminal
    is capable of monitoring. Therefore it''s important to check if your program is
    using those mouse actions you need.


    # Notes


    Setting the value of newmask to zero has the effect of turning off the mouse pointer.
    Mouse button constants are listed in Table A-11. In Table A-12 you''ll find a
    list of multi-click functions. Finally, Table A-13 lists keyboard shift states
    that can be logically OR''d with other mouse states.'
  merge: -1
