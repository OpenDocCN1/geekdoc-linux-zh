    # delwin()


    The delwin() function removes a window, releasing the memory used by both the
    WINDOW structure and the window itself.


    # Man Page Format


    ```

    int delwin(WINDOW *win);

    ```


    # Format Reference


    win refers to a WINDOW variable, a window created earlier in the program by the
    newwin(), subwin(), derwin(), dupwin(), or newpad() function.


    # Return Value


    OK upon success, or ERR on failure.


    # Notes


    The delwin() function removes the window''s information from memory. It does not
    remove the window from the current screen. For that, the underlying window should
    be touched and refreshed. See touchwin() and refresh(). delwin() can delete subwindows
    and parent windows. It can also be used to remove pads. See newpad().


    You must delete subwindows before deleting their parents. Because windows share
    memory with the parent window, the end result of removing the parent would be
    memory violations by the subwindow.


    # Example


    ```

    delwin(menu);

    ```


    Here, the window menu and its WINDOW structure are removed from memory.'
