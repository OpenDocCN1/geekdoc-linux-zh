    \ prefix, curs_set(), mvcur(), getetyx(), getmaxyx()\n\n# mv prefix functions\n\
    \nNearly all NCurses text output functions come with a variation prefixed by mv.\
    \ The mv means that the function includes a cursor location. This saves typing\
    \ over using a move() function before using a standard text output function; both\
    \ functions are combined into one.\n\n# Format\n\nmv prefix functions feature\
    \ y and x as their first arguments.\n y is the vertical or row position at which\
    \ place the character. Zero represents the top row. The maximum value for y depends\
    \ on the window's height.\n x is the horizontal or column position at which place\
    \ the character. Zero represents the far left column. The maximum value for x\
    \ depends on the window's width.\n\nRefer to the individual functions elsewhere\
    \ in this appendix for information on other arguments listed.\n\n# Return Value\n\
    \nThe mv-prefixed functions shown earlier return either OK or ERR. Normally, these\
    \ values are not checked; however, it's a good idea to check them with the mv-prefixed\
    \ functions — especially when there is a possibility that a character would be\
    \ placed outside a window's boundary.\n\nOK and ERR are defined in NCURSES.H.\n\
    \n# Notes\n\nThe functions mvwin() and mvderwin() are not mv-prefixed functions.\n\
    While the mv prefix functions save typing, using them is not more efficient saves\
    \ any time over using the separate move() function before an output function.\n\
    \n# Also See\n\naddch(), addchstr(), addstr(), and so on"
