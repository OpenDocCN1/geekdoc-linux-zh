  md: '# Appendix A ■ NCurses Library Reference 313


    # # Notes


    Reading the text and attribute with inch() does not advance cursor. The ctypes
    variable returned can be stored or used in any NCurses function that swallows
    ctypes variables. If you want to extract something specific from that, then a
    logical AND operation is in order. For example, to extract the character from
    the value returned:


    ```

    char_var = ( inch() & A_CHARTEXT);

    ```


    The A_CHARTEXT constant masks off the non-character attributes of the ctypes.
    Likewise, to extract the text formatting attributes only:


    ```

    attr = ( inch() & A_ATTRIBUTES);

    ```


    A_ATTRIBUTES helps mask off color and text information, saving the attributes
    value into the long int attr, above. And to extract the color value:


    ```

    cpair = ( inch() & A_COLOR);

    ```


    The cpair int holds the color value returned by the inch() function. There is
    another NCurses function, insch(), which inserts characters on the screen. Do
    not confuse that with inch().


    # # Examples


    ```

    v = inch();

    ```


    Here, the character and attributes at the cursor’s location on the standard screen
    are saved in ctypes variable v.


    ```

    attr = winch(menu) & A_ATTRIBUTES;

    ```


    The long int variable attr (or type attr_t) saves the attributes only from the
    cursor''s current position in window menu.


    ```

    ch = mvwinch(help, 0, 0) & A_CHARTEXT;

    ```


    Here, int variable ch saves the text character from position 0, 0 in window help.'
