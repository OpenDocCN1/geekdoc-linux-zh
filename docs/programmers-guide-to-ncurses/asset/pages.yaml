  md: '# overlay()


    The overlay() function takes text from one window and places text into the blank
    portions of another window.


    # Man Page Format


    ```

    int overlay(const WINDOW *srcwin, WINDOW *dstwin);

    ```


    # Format Reference


    srcwin is a WINDOW pointer representing the source window, from which text is
    copied.

    dstwin is a WINDOW pointer representing the destination, the window where text
    from srcwin is pasted.


    # Return Value


    The function returns OK upon success, or ERR when there is a problem.


    # Notes


    With the overlay() function, only the blank parts of the destination window are
    over-written with text from the source window. Text from srcwin will not replace
    text from dstwin, neither will text attributes be copied to the dstwin. srcwin
    and dstwin do not need to be the same size. When:


    +   - The two windows must overlap. It is only the overlapping portion of the
    windows that is overlaid.

    - When the windows do not overlap, overlay() returns ERR.


    The overlay() function behaves the same as the copywin() function with the TRUE
    argument.


    # Example


    ```

    overlay(first,second);

    ```


    After the statement, locations where window first overlaps window second will
    be changed; any blank spots in window second will be filled by overlapping text
    from window first.'
