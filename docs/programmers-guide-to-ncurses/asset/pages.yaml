- img_proc: true
  md: '+   - Subwindows can have their own color and text attributes.


    +   - Subwindows can be manipulated by all the same functions that manipulate
    regular windows.


    There are a few exceptions to that last point: Some functions do not behave the
    same way with subwindows as they do with real windows. Those specific functions
    that don''t work with subwindows are documented in Appendix A, as well as in the
    various man pages and other references.


    Internally, a subwindow knows that it''s a subwindow. It can reference the parent
    window, thanks to a pointer stored inside the subwindow''s WINDOW structure. Sadly,
    that doesn''t work the other way around: Parent windows have no way of knowing
    whether they have subwindows. This is the main reason you''re not supposed to
    remove a window unless you first remove its subwindows.


    Finally, remember the shared memory deal. Anything you write to a subwindow is
    also written to the parent. Likewise, the parent has no respect for its text written
    over the subwindow''s and can effortlessly write text over the subwindow''s text.
    In fact, text written over the subwindow''s text becomes part of the subwindow,
    thanks to the shared memory.


    As long as you can keep these points in mind, and put subwindows to use as I''ve
    described here, I believe you''ll find them useful and handy to have.'
