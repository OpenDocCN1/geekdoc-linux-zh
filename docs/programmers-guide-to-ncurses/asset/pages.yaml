  md: "# Can NCurses Deal with the Mouse?\n\nMouse programming is specific to NCurses.\
    \ If your system is using the older Curses or an earlier version of NCurses, mouse\
    \ functionality might not be available. Before you set out to do mouse programming,\
    \ first check to see if NCurses is up to the task (see Listing 13-1).\n\n# Listing\
    \ 13-1: mtest.c\n\n```\n1 #include <nurses.h>\n2 \n3 int main(void)\n4 {\n5 mmask_t\
    \ mmask;\n6 \n7 initscr();\n8 \n9 if(NCURSES_MOUSE_VERSION > 0)\n10 addstr(\"\
    This version of NCurses supports the mouse.\\n\");\n11 else\n12 addstr(\"This\
    \ version of NCurses does not support the mouse.\\n\");\n```\n\nThis program simply\
    \ reads the value of the NCURSES_MOUSE_VERSION variable, which is defined in the\
    \ NCURSES.H header file. If the variable exists, the happy message is displayed:\n\
    \nThis version of NCurses supports the mouse.\n\nOtherwise, you end up with:\n\
    \nThis version of NCurses does not support the mouse.\n\n(Refer to the section\
    \ \"To Eek or Not to Eek?\" at the end of this chapter for suggestions on how\
    \ to best use NCURSES_MOUSE_VERSION.)\n\n# Can Your Terminal Deal with the Mouse?\n\
    \nStep 1 is to see if you have the latest version of NCurses, complete with mouse\
    \ support. If so, you need to move on to step 2: Check to see if the terminal"
