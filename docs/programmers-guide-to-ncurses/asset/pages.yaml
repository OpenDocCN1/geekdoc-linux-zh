  md: '# Explanation


    The refresh operation in NCurses consists of two parts:


    +   - First, NCurses takes those portions of a window that have been changed or
    touched and writes those portions from the window data structure to a virtual
    screen in memory.

    - Second, the contents of the virtual screen touched since the last refresh are
    displayed on the terminal.


    The copying of information from a window data structure to the virtual screen
    is carried out by the wnoutrefresh(). The updating of the virtual screen to the
    terminal is handled by another function, doudate(). Together they form the two
    components of a refresh() or wrefresh() call.


    The advantage of using wnoutrefresh() comes when updating multiple windows. In
    that case, repeated calls to wnoutrefresh() followed by a series of wrefresh()
    calls, plus doudate() call is more efficient than a series of wrefresh() calls,
    plus results in less flicker.


    # Man Page Format


    ```

    int wnoutrefresh(WINDOW *win);

    ```


    # Format Reference


    w represents the window to update on the virtual screen. It''s a WINDOW variable,
    representing a window created earlier in the code or stdcsscr for the standard
    screen.


    # Return Value


    ERR upon failure, OK (or some value other than ERR) upon success.


    # Notes


    wnoutrefresh() has the effect of un-touching a window. See touchwin().

    A similar function, pnoutrefresh(), exists for help in updating pads. \nThe slk_noutrefresh()
    function is used for help in updating soft labels. See slk_noutrefresh().'
  merge: -1
  pgno: 535
- img_proc: true
  md: '# 514 Appendix A ■ NCurses Library Reference


    # Examples


    ```

    wnoutrefresh(alpha);

    woutrefresh(beta);

    woutrefresh(gamma);

    doupdate();

    ```


    The three wnoutrefresh() functions update information from the three windows,
    alpha, beta, and gamma. Then douupdate() function updates the terminal. These
    four statements are more efficient than three corresponding wrefresh() functions.


    ```

    wnoutrefresh(stdscr);

    ```


    Here, the standard screen is updated to the virtual screen. A subsequent call
    to doupdate() will update the terminal screen.


    # Sample Program


    Refer to the entries for doupdate() and mvwin() for sample programs and output.


    # Also See


    refresh(), doupdate(), wdrawln(), touchwin()


    # wdrawln()


    The wdrawln() function directs NCurses to update specific lines from a window
    to the terminal.


    # Explanation


    This function, along with redrawwin(), operates under the assumption that something
    has disrupted a program''s text on the terminal. In instance, NCurses may not
    recognize the corrupted screen or know that its internal representation of the
    screen (curscr) is out of sync. The wdrawln() function allows a program to fix
    one or more lines in a window, forcing NCurses to write those lines and make the
    cursor once again match what the user sees.


    # Man Page Format


    ```

    int wdrawln(WINDOW *win, int beg_line, int num_lines);

    ```'
