  md: '# Also See


    killchar(), cbreak(), raw(), unctrl()


    # ERR


    NCurses uses the int value ERR as a return value for functions that have not or
    are unable to complete their tasks.


    # Man Page Format


    Not applicable.


    # Format Reference


    ERR can be used like any other constant, though it is most found in a comparison:


    ```

    if( function() == ERR)

    ```


    Or if the return value from a function is saved in a variable, r:


    ```

    if( r == ERR)

    ```


    Or:


    ```

    while( function() == ERR)

    ```


    # Return Value


    The value of ERR is set in NCURSES.H to -1.


    # Notes


    Not every function returns ERR on failure. Some don''t return anything; others
    may return NULL or have some other factor to determine the function''s failure.


    > ERR''s counterpart is the OK constant. See OK.


    # Examples


    ```

    if( touchwin(menu) == ERR)

    ```


    The statement works out to be true when the touchwin() function fails.'
