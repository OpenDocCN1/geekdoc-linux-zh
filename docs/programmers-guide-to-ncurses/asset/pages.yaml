  md: '# 368 Appendix A ■ NCurses Library Reference


    # Also See


    mvwin(), refresh(), subwin(), derwin()


    # mvw prefix functions


    A host of NCurses text output functions prefixed by mvw. This combines the mv
    and w prefixes, allowing text to be placed at a specific position within a specific
    window.


    # Format


    The mvw prefix functions feature win, y, and x as their first arguments.

    win a WINDOW variable, representing a window created earlier in the program. Refer
    to the W prefix entry later in this appendix for more details.

    y and x represent the cursor''s position on the screen. They are int values for
    the row and column, ranging from 0 to the height and width of the window, respectively.

    Refer to the individual functions elsewhere in this appendix for information on
    the other arguments in the various mvw prefix functions.


    # Notes


    Note win always comes first, even though mv comes first in the mvw prefix function.
    The mvwin() function is not an mvw-prefix function.


    # Also See


    addch(), addstr(), addstr(), and so on


    # mvwin()


    The mvwin() function is used to move a window on the screen, changing its origin
    to the coordinates given.


    # Man Page Format


    ```

    int mvwin(WINDOW *win, int y, int x);

    ```


    # Format Reference


    ```

    mvwin(win,row,col);

    ```'
