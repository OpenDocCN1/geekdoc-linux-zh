  md: '# Appendix A ■ NCurses Library Reference 405


    pminrow and pmincol are int values represents the upper-left (Y and X) coordinates
    of a rectangle of text on the pad.

    sminrow and smincol are int values representing the upper-left (Y and X) coordinates
    of a rectangle on the standard screen. This is where the text from the pad will
    be placed.

    smaxrow and smaxcol represent the lower-right (Y and X) coordinate of the rectangle
    on the screen. These are int values and they are relative to the home location,
    not to minrow and smincol. The differences between the upper-left and lower-right
    coordinates on the screen are also used to calculate the size of the rectangle
    copied from the pad.


    # Return Value


    OK or ERR depending on success or failure of the call.


    # Notes


    refresh() always outputs text to the standard screen.

    refresh() function updates the standard screen; there is no need to call refresh()
    after refresh() to see the text.

    You cannot refresh() a rectangle from the pad that is larger than the standard
    screen (or larger than the pad, for that matter).


    # Examples


    ```

    prefresh(p,0,0,0,10,35);

    ```


    The statement here places part of the pad p on the standard screen. The text from
    the pad starts at location 0, 0. The rectangle on the standard screen starts at
    location 0, 0, and it is 10 rows deep by 35 columns wide.


    ```

    prefresh(psto,py,px,10,5,11,75);

    ```


    Here, from the pad psto is read from starting location py, px, and placed on the
    screen at location 10, 5. The rectangle is 1 row high and 70 characters.


