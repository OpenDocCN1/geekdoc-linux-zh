  md: '# Chapter 2 - Basic I/O, the NCurses Way 17


    # # The initscr() Function


    The initscr() function initializes NCurses. It does not clear the terminal screen.
    Instead, it sets up internal memory structures and interfaces between the NCurses
    functions and your computer''s terminal I/O.


    Two important items initscr() creates are the standard screen and the current
    screen. Both of these are internal structures used by NCurses to efficiently display
    information on the terminal screen.


    The standard screen, and stdscr, is the default output window for NCurses, as
    shown in Figure 2-1. You''ll discover later in Chapter 8, all NCurses commands,
    and a few input commands, are window oriented. The standard screen is the main
    window you''ll see, and it''s exactly the same size as the terminal screen. The
    initscr() function creates the standard screen and uses the variable stdscr to
    refer to it.


    The standard screen, however, is not the same as the terminal window, and you
    want to use the standard screen doesn''t appear on the terminal window. Well,
    not right away.


    The refresh() command is required to update text on the terminal window, letting
    you see what NCurses has done. refresh() does to check for new text output by
    NCurses and update that text on the current screen, or cursor, as shown in Figure
    2-2.


    The current screen is NCurses'' internal representation of what is believed to
    be on the terminal screen, or what the user sees, as shown in Figure 2-2. The
    refresh() function is responsible for updating the current screen, which then
    updates what is shown to the user.


    Like the standard screen, the current screen is an NCurses window. But unlike
    stdscr, it''s uncommon (and not recommended) to output directly to cursor. There
    are many reasons for this, as you''ll learn later in this book.


    In addition to the standard screen and current screen, there is something called
    the virtual screen. The virtual screen exists for efficiency''s sake. It contains
    updated information, only items changed or touched in a certain window which are
    waiting to be updated on the current screen, as shown in Figure 2-3.


    ![](img/b0e33f0db107583cf9267e27aa42f380_39_0.png)


    **Figure 2-1:** The standard screen is the default window for NCurses output commands.'
