  md: "# 346 Appendix A ■ NCurses Library Reference\n\n# Return Value\n\nERR on failure,\
    \ OK or some value other than ERR on success.\n\n# Notes\n\nMany of the special\
    \ keys keypad() allows your code to monitor are defined in NCURSES.H and listed\
    \ in Appendix D.\nThe operating system may steal function keys from your program,\
    \ intercepting them before your code a chance to process the key process. When\
    \ that's the case, you can try to use the raw() function in NCurses to get the\
    \ function keys passed directly to your program.\\ On PCs, the Num Lock state\
    \ must be off for the keys on the numeric keypad to be read as cursor movement\
    \ keys, not numbers. Note, however, that xterm looks to see what's going on and\
    \ overlays its own configuration, which may override this.\n\n# Example\n\n```\n\
    keypad(menu,TRUE);\n```\n\nHere, reading of special keys from the keyboard is\
    \ possible by wgetch() functions reading input from the window menu.\n\n# Sample\
    \ Program\n\n```\n#include <ncurses.h>\nint main(void)\n{\n    int ch;\n    initscr();\n\
    \    keypad(stdscr,TRUE);\n    do {\n        ch = getch();\n        switch(ch)\
