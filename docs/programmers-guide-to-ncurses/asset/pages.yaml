  md: '# Format Reference


    attrs is an int value in set of calls, attr_t in the others. But it is really
    the same thing in NCurses. It is typically one or more attribute constants defined
    in NCurses.h and listed in any attrset() later in this appendix. The named attribute
    is removed from any text displayed after the attroff() function is used; others
    are not affected.


    Multiple attributes can be specified in a single attroff() function by separating
    each with a | (logical OR).

    COLOR_PAIR(n) is also a text attribute, where n is a color pair number defined
    by init_pair() function earlier in the program.

    NULL is used as a placeholder for the as-yet-be-defined opts value in the attroff()
    and wattr_off() functions. (Honestly, it has been ten years, so it is doubtful
    that X/Open are going to define it!)


    Refer to the w prefix entry later in this appendix for information on the win
    argument.


    # Return Value


    The return value is stated as “not important” according to the documentation.


    # Notes


    attoff() affects only the text displayed after the attroff() function is issued.


    To turn off attributes with attroff(), each attribute must be specified individually;
    you cannot use A_NORMAL with attroff() to reset all text attributes back to normal.
    (See attrset()).


    Removing a COLOR_PAIR attribute with attroff() restores the text to “normal” (on
    black) text. If you set one COLOR_PAIR attribute, then applying a second COLOR_PAIR
    attribute, removing the second does not restore the first COLOR_PAIR. You must
    re-apply the COLOR_PAIR using an attroff() function.


    Apparently, removing a COLOR_PAIR attribute with attroff() also removes all other
    text attributes.

    attr() and attr_off() are pretty much identical, save for the NULL argument in
    attroff(). (In NCurses, you''ll mostly find underscores used by functions that
    manipulate white characters.) Attributes are set by either the attrset() or attron()
    functions.


    Attributes affect the output of the addch(), addstr(), and printw() functions.


    Also refer to the Notes for attrset().'
