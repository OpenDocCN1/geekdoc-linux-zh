  md: '# 374 Appendix A = NCurses Library Reference


    The NCURSES_VERSION constant contains a string specifying NCurses major and minor
    versions.


    The NCURSES_VERSION_MAJOR constant contains NCurses major version number.


    The NCURSES_VERSION_MINOR constant contains NCurses minor version number.


    The NCURSES_VERSION_PATCH constant contains NCurses most recent patch number.


    # Return Value


    The values the constants depend on the release of NCurses, obviously. Otherwise:


    +   - NCURSES_VERSION is a string value, such as 5. 4.

    - NCURSES_VERSION_MAJOR is a numeric value, such as 5.

    - NCURSES_VERSION_MINOR is a numeric value, such as 4.

    - NCURSES_VERSION_PATCH is a numeric value combining the year, month and day of
    the most recent NCurses patch release, such as 20040208. (This value is also defined
    for release versions of NCurses.)


    # Notes


    You can find newer versions of Curses (well, NCurses) at:


    ```

    http://ftp.gnnu.org/pub/gnu/ncurses/

    ```


    A constant CURSES also exists, which is set to 1. Your programs should use the
    NCURSES_VERSION... constants instead.


    # Examples


    ```

    printf("*This is NCurses version %s.\n",NCURSES_VERSION);

    ```


    Here, the printf function displays the text This is NCurses version followed by
    the current version string.


    ```

    if(NCURSES_VERSION_MAJOR<5)

    ```


    The if test checks to ensure that the user’s version of NCurses is at least major
    release 5.'
