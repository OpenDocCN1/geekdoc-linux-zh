  md: '# Man Page Formats


    ```

    int erase(void);

    int werase(WINDOW *win);

    ```


    # Format Reference


    The erase() function has no arguments. It''s a pseudo function that affects only
    the standard screen.

    Refer to the w prefix entry later in this appendix for information on the win
    argument.


    # Return Value


    Always returns OK.


    # Notes


    You don''t see the window erased until a call to refresh() updates the window.

    Clearing the screen also moves the cursor; after the erase() function, the cursor
    is placed at location 0, 0.

    The erase() function removes only characters and their attributes. It does not
    affect the background character and its attributes. If a background character
    is set via bkgd() or bgset(1), then that character will show up in the blanks
    erase() fills the screen.

    erase() is the same as werase(stdscr).

    The erase() function is visually the same as the clear() function; however, clear()
    also calls the clearok() function to enforce the erasure and redploy of the screen.

    Because of the overhead involved with clear(), erase() is the quicker of the two
    functions, though on many terminals the speed difference is negligible.


    # Examples


    ```

    erase();

    ```


    The statement erases the standard screen.


    ```

    werase(sidebar);

    ```


    The statement clears away the text in the window sidebar.'
