  md: '# Chapter 2 Basic I/O, the NCurses Way


    The bookends are the two functions initscr() and endwin(). Between them you can
    stuff all the NCurses commands and functions that your little heart desires, plus
    the usual hoard C programming commands — with the exception of the standard I/O
    commands. You must not use NCurses'' own I/O commands for NCurses to work. Work
    more on that later.


    ```

    #include <ncurses.h>

    ```


    You must include the NCURSES.H header file so that the compiler dechoke on your
    NCurses functions.


    > NOTE Please including the NCURSES.H header file does not automatically link
    in the NCurses library. You must not do that with the -lncurses switch when you
    compile (as covered in Chapter 1). There is a difference between the header and
    library files!


    The NCurses header file does a few nifty tricks. First, it automatically includes
    the following header files:


    ```

    stdio.h

    unctrl.h

    stdarg.h

    stddef.h

    ```


    Therefore, there is no need to re-include these header files in your source code.
    In fact, if you do, you may end slowing things down and creating files larger
    than they need to be. So if you''re tempted to do this:


    ```

    #include <stdio.h>

    #include <ncurses.h>

    ```


    Only this instead:


    ```

    #include <ncurses.h>

    ```


    Also, the NCURSES.H file defines such things as TRUE, FALSE, ERR, and other useful
    constants. It contains definitions for structures you''ll be using later. Plus,
    it includes many other wonderful and useful goodies. If you have the time, peruse
    the header file, which can be found at /USR/INCLUDE/NCURSES.H.'
