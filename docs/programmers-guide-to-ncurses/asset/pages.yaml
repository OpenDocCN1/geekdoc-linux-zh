  md: '# # CHAPTER 13


    # # Messing Mit der Mouse


    NCurses has the ability to interface with a mouse or similar pointing device attached
    to a computer. Information about the mouse can be read and used in your programs
    in a number of ways, just as mice are used in graphical programs.


    All this stuff is optional, of course; NCurses is, after all, a text-based thing
    and mice are associated with graphical things. But if you want to take advantage
    of the mouse, you can certainly well do it.


    # # Hello, Mouse


    Even though your computer may have a mouse — indeed, the terminal window you use
    may be an oasis of text floating in a graphical operating system — the sucker
    may not be quite set up to read the mouse inside the terminal.


    For example, some terminals intercept the mouse, using it at the operating system
    level to select text from the terminal window. If so, any mouse events are probably
    blocked from your program’s view. There is a way to test for this, as covered
    in the section “Can your terminal deal with the mouse?” later in this chapter.
    But before that, you should check to see if your version of NCurses supports the
    mouse in the first place.'
  merge: -1
  pgno: 179
