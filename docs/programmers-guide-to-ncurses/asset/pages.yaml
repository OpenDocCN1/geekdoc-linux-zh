  md: "# Appendix A ■ NCurses Library Reference 193\n\n# Notes\n\nThe color constants\
    \ defined in NCURSES.H can also be used as values for fg and bg. Refer to `init_pair()`\
    \ for the list.\n\nThe `assume_default_colors()` (or use `default_colors()`) function\
    \ is the only way to set `COLOR_PAIR(0)`.\n\nUsing -l for `fg` and `bg` tells\
    \ NCurses to use the same foreground and background colors as the terminal. For\
    \ example, if you configured your xterm to use blue text on a white background,\
    \ then specifying `assume_default_colors(-1,-1)` directs NCurses to use those\
    \ same two colors as the foreground and background for `COLOR_PAIR(0)`, the color\
    \ pair used when `start_color()` initializes NCurses.\n\nNote that it's not possible\
    \ on some terminals to use colors not available to NCurses. For example, on xterm\
    \ on OS X it's possible to set text to gray on a pink background. Sadly, these\
    \ colors are not available to the NCurses functions.\n\nIt's not wise to set both\
    \ the `bg` and `fg` values to the same thing. You can; but nothing shows up on\
    \ the screen.\n\n`assume_default_colors()` is an extended NCurses function. See\
    \ \"Extended Functions\" later in this appendix.\n\n# Examples\n\n```\nassume_default_colors(COLOR_WHITE,COLOR_BLUE);\n\
    ```\n\nThe colors used for text output after `start_color()` initializes NCurses\
    \ color will be white text on a blue background. White on blue becomes the values\
    \ for `COLOR_PAIR(0)`.\n\n```\nassume_default_colors(-1,-1);\n```\n\nThe colors\
    \ set by `start_color()` for `COLOR_PAIR(0)` will be the same as used in the terminal\
    \ window.\n\n# Sample Program\n\n```\n1 #include <ncurses.h>\n2 \n3 int main(void)\n\
    4 {\n5     int r;\n6 \n7     initscr();\n8     start_color();\n9 \n10    assume_default_colors(COLOR_RED,COLOR_CYAN);\n\
