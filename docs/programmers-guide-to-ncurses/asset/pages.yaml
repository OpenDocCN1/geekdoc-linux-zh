    # ## baudrate()


    The baudrate() function returns the terminal''s speed in bits per second (bps).


    # ## Man Page Format


    ```

    int baudrate(void);

    ```


    # ## Format Reference


    The function has no arguments.


    # ## Return Value


    baudrate() returns an int value representing the terminal''s speed value in bps.
    Values returned depend on the terminal.


    # ## Notes


    Baud is a measurement of signal modulation. The term is a holdover from the early
    days of modem when a 300 baud modem communicated at roughly 300 bps. As modem
    technology advanced, the baud rate was used while incorrectly used the term “baud”
    instead. The value returned by baudrate() is really a bps value.


    Virtual terminals return whichever value is defined for the terminal. This value
    probably will not reflect reality but merely the speed for the tty. Use the stty
    command to see which speed is set for a virtual terminal; the same value is returned
    by NCurses baudrate() function.


    Knowing the speed of a terminal relative when using some NCurses functions that
    update an entire screen of information. At 9600 bps, a full re-write of a screen
    by touchwin()/refresh() becomes noticeable. Therefore, the baudrate() function
    can be used to avoid redundant text'
