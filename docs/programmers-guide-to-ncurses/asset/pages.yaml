    # Making Subwindows


    Subwindows have all the basic attributes of real windows: a name, size, location,
    unique cursor coordinates, and so on. Because they share memory with the parent,
    the subwindow must reside completely within the parent window. And, naturally,
    subwindows are created by using their own unique functions:


    ```

    subwin(win, rows, cols, y, x)

    derwin(win, rows, cols, y, x)

    ```


    The only difference between these functions has to do with the final two arguments.
    With subwin(), y and x are coordinates relative to the screen; in derwin(), y
    and x are relative to the parent window.'
