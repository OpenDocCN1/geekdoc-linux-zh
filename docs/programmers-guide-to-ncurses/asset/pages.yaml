    # untouchwin()


    The untouchwin() function removes all signs of updates on a window, leading NCurses
    to believe that the window has been fully updated (refreshed).


    # Explanation


    NCcurses keeps track of changes made in a window. For efficiency''s sake, only
    the text changed in a window is written to the current screen during the next
    refresh() call. By using untouchwin(), you direct NCurses to ignore changes in
    a window, and to assume that all text has been updated.


    This can be used when you want only a specific part of a window''s output to be
    displayed. For example, you could use several functions to put text to a window,
    then use untouchwin(), then output more text. Only the output after untouchwin()
    would be updated at the next refresh() call.


    In the sample program for touchline(), untouchwin() is used just after the window
    is created. This allows subsequent calls to the touchline() function and refresh()
    to reveal the window one line at a time.'
