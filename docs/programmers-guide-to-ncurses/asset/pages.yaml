  md: '# Between NCurses and Disk


    This last quartet of NCurses functions introduced in this chapter are used to
    save interact between NCurses and disk:


    ```

    scr_dump()

    scr_restore()

    putwin()

    getwin()

    ```


    The scr_dump() and putwin() functions are used to write information from either
    the terminal screen or a specific window to a special file on disk. The scr_restore()
    and getwin() functions then read that information back from disk, splashing the
    information on screen. The following sections mull the details.


    # Functions that Dump the Screen


    There are two NCurses functions that “dump the screen,” transferring a window’s
    contents from memory disk or disk to memory:


    ```

    scr_dump(filename)

    scr_restore(filename)

    ```


    Each function takes filename, the name of a file, as an argument. Note that the
    argument is the file’s name itself, not a FILE pointer. Both functions open, read,
    and close the named file. There is no need for fopen() or fclose() before or after
    these functions.


    The scr_dump() function overwrites any existing filename already on disk. There
    is no warning, though you can write your code to determine whether or not filename
    already exists before using scr_dump().


    When the dump or restore is successful, the functions return OK; otherwise, ERR
    is returned.


    Both functions relate to what is displayed on the curser; these are not window-specific
    functions.


    # Taking a Snapshot of the Screen


    The scr_dump() function performs what old timers refer to a screen dump. The inelegant
    dump simply means to transfer a chunk of data (often raw data) from one device
    to another. In the case of a screen dump, the data from the screen is saved to
    disk. See Listing 14-7 for an example.'
