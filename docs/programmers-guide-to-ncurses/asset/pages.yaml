  md: '# # CHAPTER

    # 1

    The Setup


    This chapter covers a basic setup and organization for you to get started with
    NCurses programming. Here you''ll find:


    +   * An introduction to the terminal window in UNIX

    * A smattering of basic shell commands

    * Creating a special curses directory for this document''s programs

    * A review of available text editors

    * The creation of a basic NCurses program

    * A review of the gcc compiler and linking commands

    * Re-editing source code and debugging exercises


    The idea here is to show you how everything works and to get comfortable programming
    with NCurses, even if you''ve never written a UNIX program before.


    # ## NCurses Is a UNIX Thing


    You must have a UNIX-like operating system to work the samples and examples in
    this book.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Beyond this, note that you must also have the programming libraries installed
    for your operating system. Without those libraries, programming in NCurses just
    isn''t gonna happen. Refer to your operating system’s installation or program
    setup, as /std/sysinstall in FreeBSD, to install the C programming libraries for
    your operating system. If special extensions are required to get the NCurses library
    installed, use them!


    > NOTE It’s possible to program NCurses in Windows when using the Cygwin environment.
    I’ve not toyed with Cygwin, so I’m unable to comment on it here. For more information,
    refer to www.cygwin.com.


    # Run (Don’t Walk) to a Terminal Screen Near You


    NCurses is about programming the terminal screen, you’ll need access to a terminal
    screen or window to run the programs.


    You can either use one of the virtual terminals (which you can access on most
    PCs by pressing Alt+F1, Alt+F2, Alt+F3, and so on) or open a terminal in the Windows
    System environment or in Mac OS X using the terminal program. (See Figure 1-1)


    ![](img/b0e33f0db107583cf9267e27aa42f380_24_0.png)


    **Figure 1-1:** A terminal window for Mac OS X


    Note that the terminal you choose can affect what NCurses does. Not all terminal
    types can, for example, do color or draw lines on the screen.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Know Something About the Shell


    The program you use in the terminal screen is a shell. It displays a shell prompt
    and lets you type one of the gazillions of UNIX commands and what not — which
    is all basic UNIX stuff.

    The following sections review basic shell operations and a smattering of commands.
    If you feel you already know this, skim up to the section titled "Make a Place
    for Your Stuff."


    # Some Shelly Stuff


    For example, the standard Bourne shell may look like this:


    $nThe dollar sign is the prompt, and you type your commands after the prompt.

    The Bash shell, popular with Linux, may look like this:


    ```

    Bash-2.05a$

    ```


    Or the shell may be customized to display your login name:


    dang$


    Or even the working directory:


    /home/dang/$


    Whatever!

    No one really cares about which shell you use, but you should know enough shell
    commands to be able to do these things:


    +   - Make directories

    - Display a file''s contents

    - Copy files

    - Rename files

    - Remove files


    It’s beyond the scope of this book to teach you such stuff, though a handy list
    of popular shell commands is provided at the end of this chapter.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Note that this book does not display the shell prompt when you’re directed
    to enter a command. Simply type the command; then press Enter to send the command
    to the shell program for processing.

    It is always assumed that you press the Enter key to input the command.


    > **NOTE** Please check your typing! The shell is very fussy about things correct.
    In the Bash shell, you''ll see a command not found error when you mistype something:


    ```

    -bash: command not found

    ```


    # Know Your History, Because You’re Going to Repeat It


    One handy shell feature you should take advantage of is the history. Various history
    commands allow you to recall previously typed text at the command prompt. This
    is commonly done as you edit, compile, re-edit, and reclaim your code.

    For example, most of the time you’re using this book you’ll be cycling through
    three sets of commands. First comes the editing:


    ```

    vim goodbye.c

    ```


    Then comes the compiling:


    ```

    gcc -lncurses goodbye.c

    ```


    Then comes the running:


    ```

    ./a.out

    ```


    I’ll cover these steps in detail later, but for now recognize that these commands
    are to be repeated over and over: Edit, compile, run (or test); then re-edit,
    compile, and test again. To assist you in that task, employ your shell’s history
    function.

    In the Bash shell, for example, use the up arrow key on your keyboard to recall
    a previous command. To recall the second previous command, press the up arrow
    key twice. It is not intimate with the other shells, so if you use the C shell
    or Bourne shell, review your documentation for any history commands available
    with those shells.


    # Make a Place for Your Stuff


    Please be organized and build yourself a handy little directory into which you
    can save, compile, and test the various programs presented in this document.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Chapter 1 ■ The Setup 5


    For example, in my home directory, I have the following set up:


    ```

    $HOME/prog/c/ncurses

    ```


    $HOME is the home directory, the shell variable that represents your account''s
    home directory for most shells that I''ve played with. It can also be abbreviated
    as / in some shells.


    Then I have a subdirectory called PROG, which contains all my programming junk
    and test files. PROG contains subdirectories for C language programs, Perl programs,
    shell scripts, and whatever else I''m dabbling in.


    The c subdirectory contains C programs and directories. NCURSES is where I built
    all the sample files for this book.


    You should consider a similar setup for your system, even if it''s just something
    like $HOME/ncurses. As long as you keep all the sample files around and be able
    to access them later, you''ll be a happy camper.


    If you want to create a ~/PROG/C/NCURSES directory for your stuff, you can use
    the following command in your home directory:


    ```

    mkdir -p prog/c/ncurses

    ```


    The -p switch directs mkdir to build all parent directories to the final NCurses
    directory.


    # Using an Editor to Create an NCurses Program


    There''s no point in bothering with a fancy developer environment or IDE when
    you''re programming NCurses. I think you''ll be happier with the terminal window
    and a shell prompt, unless you''ve been totally corrupted by some IDE.


    # Picking an Editor


    Since day one of UNIX, a text editor has been used to create code. That''s what
    I recommend for this book. Any text editor will do, and most UNIX-like operating
    systems give you a smattering of editors to choose from:


    +   - ee. The easy editor is a popular choice for many UNIX newcomers. No one
    will think any less of you for using ee, especially if you''re using it with your
    C programming.


    +   - emacs. This is the most popular choice, mostly because its commands are
    more word processor-like and you don''t have to whack the Escape key as you do
    in vi/vim.'
  merge: -1
  pgno: 27
- img_proc: true
  md: "# Chapter 1 The Setup\n\nvim. This is my personal choice, simply because it's\
    \ so damn raw and complex. As you get used to vim, though, it becomes a very powerful\
    \ and handy tool. Plus it's common to all Unixes.\n\nWhenever this book tells\
    \ you to edit or create some source code, you'll use your favorite text editor\
