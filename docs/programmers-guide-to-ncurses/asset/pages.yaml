  md: "you're using properly interprets the mouse. This is done by using the\nmousemask()\
    \ function:\n\n```\nmousemask(newmask, *oldmask)\n```\n\nIt's the mousemask()\
    \ function's job to make mouse activity visible to your\nprogram. To put it another\
    \ way: mousemask() it turns on mouse mon-\ntoring for your program.\n\nThe newmask\
    \ argument tells NCURSES; it and listed in Appendix A. But most of the\nevents\
    \ are defined using ALL_MOUSE_EVENTS value, which tells NCURSES\ntime you'll probably\
    \ use to keep an eye on all mouse buttons, up or down, double- or triple-\nclicked,\
    \ or used with Shift, Alt, or Ctrl keys on the keyboard. (In NCURSES, only\nmouse\
    \ clicks and releases are monitored, not mouse movement).\n\nMost of the time,\
    \ the value of *oldmask is NULL.\n\nThe value returned by mousemask() is of the\
    \ mmask_t type (a long\ninteger). The value matches the mask created on a bit-by-bit\
    \ basis; it also deter-\nmines whether the mouse is capable of monitoring the\
    \ particular mouse\naction. For:\n\n```\nmmask_t bitmask;\n\nbitmask = mousemask(BUTTON_CLICKED,\
    \ NULL);\nif (bitmask & BUTTON_CLICKED)\n    addstr(\"*I am able to read a button\
    \ 3 click.\");\nelse\n    addstr(\"*I am not able to read the button 3 click.\"\
    );\nrefresh();\n```\n\nBUTTON_CLICKED is a value defined in NCURSES.H. The call\
    \ above to\nmousemask() tells NCURSES to watch for only that value, which is generated\n\
    when button 3 is clicked. If such a thing is possible, the value\nreturned by\
    \ mousemask(), and stored in bitmask, will equal the value of\nBUTTON_CLICKED.\
    \ This is checked by the logical comparison in the if state-\nment, and addstr()\
    \ displays the happy or unhappy news.\n\nNot every mouse has three buttons, the\
    \ preceding code is a\ngood way to determine whether or not your program can use\
    \ button 3. A more\nuseful test of mousemask() is with the ALL_MOUSE_EVENTS constant,\
    \ which\ncan be used to determine whether or not the terminal can see anything\n\
    mouse does (see Listing 13-2)."
