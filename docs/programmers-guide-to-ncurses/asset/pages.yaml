  md: '# CHAPTER

    11


    # # Dig My Pad, Man


    Welcome to the Robbdingnagian part of your NCurses version of Gulliver’s Travels.
    It’s the land of the big. If you recall, adventurer Gulliver visits many lands
    in Jonathan Swift’s Gulliver’s Travels. Nearly everyone remembers Lilliput, land
    of the little people. But Gulliver also visits a land of giants, called Robbdingnagian.


    In NCurses, there are windows, but there are also pads. A pad is a super-sized,
    Brobdingnagian window (or can be). Unlike regular windows, which can be at least
    one character in size and at most the same size as memory allows. This chapter
    explores the possibilities of pads.


    # ## The Monster Window


    Pads are not really the same things as windows in a number of interesting and
    useful ways. About the most obvious is that a pad can be any size, from one character
    on up to many columns and rows, far beyond what can be seen on the screen at once.'
