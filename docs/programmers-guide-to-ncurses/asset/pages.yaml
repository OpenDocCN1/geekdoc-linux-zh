  md: '# CHAPTER

    3


    # Formatting Text


    NCurses not only puts text up on the screen; it also lets you put text on the
    screen with *style*. While the style may not be as elaborate as the styles offered
    in a GUI word processor, it is enough to add emphasis, fun, and perhaps a wee
    bit o'' color to what would otherwise be boring terminal text.


    # Text Abuse with Text Attributes


    There are three useful functions that control the tone of the text displayed on
    the screen:


    ```

    attrset(attr)

    attron(attr)

    attroff(attr)

    ```


    The `attrset()` function sets text attributes. It directs NCurses to apply the
    attribute(s) specified to all text displayed from that point onward.


    The `attron()` and `attroff()` functions turn specific text attributes on or off,
    respectively.


    There is some confusion regarding whether to use `attrset()` or `attron()` to
    apply text attributes. You can use either one. For example:


    ```

    attrset(A_BOLD);

    ```'
