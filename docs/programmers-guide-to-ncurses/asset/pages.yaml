  md: "# Making a Pad\n\nPads are created like windows. The WINDOW type is used to\
    \ define the variable — just like a window, though a new command is used to actually\
    \ create the pad:\n\n```\nnewpad(rows,cols)\n```\n\nrows and cols set the height\
    \ and width of the pad in characters. Values range from 1 to up however a large\
    \ pad memory can handle.\nThe value returned from newpad() is the address of a\
    \ WINDOW structure in memory (seeing Listing 11-1), which is exactly the same\
    \ as for a regular window, though you'll read in a few paragraphs, pads and windows\
    \ have differences.\n\nListing 11-1:bigpadl.c\n\n```\n#include <ncurses.h>\n\n\
    int main(void)\n{\n    WINDOW *p;\n    int x,c;\n    initscr();\n\n    /* create\
    \ a new pad */\n    p = newpad(50,100);\n    if(p == NULL)\n{\n        addrstr(\"\
    Unable to create new pad\");\n        refresh();\n        endwin();\n    }\n\n\
    \    addrstr(\"*New pad created\");\n    refresh();\n\n    endwin();\n    return\
    \ 0;\n}\n```\n\nThe pad is created in line 11, assigned to variable p. Line 12\
    \ tests to see if memory can handle a pad of 100 columns by 50 rows (more than\
    \ four times the size of the typical screen).\nIf the pad \"New pad created\"\
    \ is displayed on the standard screen. Wasn't the text put and displayed from\
