- img_proc: true
  md: '# Chapter 3 = Formating Text


    attron(A_BOLD);


    Both statements apply the bold text attribute to any text displayed afterward.
    The difference is that attrset() turns off all other attributes previously applied,
    leaving only bold applied to the text, while attron() adds the bold attribute
    to any attributes applied to the text.


    # More than Boring Black and White (but Not Much)


    When you start up NCurses, the text output is displayed using the normal (A_NORMAL)
    text attribute. That equates to the standard white text on a black background
    or however you have your terminal configured (for example, green on a white background
    or whatever).


    But that''s so boring!

    Table-3-1 lists the basic (noncolor) text attributes you can apply to text using
    the attrset() or attron() functions.


    Table 3-1: NCurses Text Attributes


    | ATTRIBUTE NAME | WHAT IT DOES |

    |---|---||

    | A_ALCHARSET | Displays text using an alternative character set (defined by your
    terminal) |

    | A_BLINK | Annoying blinking text |

    | A_BOLD | Bright text, bold text, thick text (depending on terminal type) |

    | A_DIM | Dimmed text (not as bright as regular text) |

    | A_INVIS | "Hidden text" (available only on certain terminals) |

    | A_NORMAL | Normal text |

    | A_REVERSE | Inverse text |

    | A_STANDOUT | Same as standout () |

    | A_UNDERLINE | Underline text |

    | A_PROTECT | "Protected text," available only on certain terminals, prevents
    text from being overwritten. |

    | A_HORIZONTAL | |

    | A_LEFT | |

    | A_LOW | |

    | A_RIGHT | |

    | A_TOP | |

    | A_VERTICAL | Not implemented |'
