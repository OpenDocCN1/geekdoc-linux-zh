    # Multiple-Attribute Mania


    You don''t have to issue multiple attrset(), attron(), or atroff() functions to
    apply or remove multiple attributes. Thanks to the unique bit patterns of the
    attribute constants in NCurses, text attributes can be applied all at once by
    using a logical OR between each attribute you want in a single attron() or attrset()
    function.

    For example, if you want your text bold and blinking, you can use:


    ```

    attrset(A_BOLD | A_BLINK);

    ```


