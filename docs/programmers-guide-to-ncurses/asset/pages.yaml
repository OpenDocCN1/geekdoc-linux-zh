    # getbegbyx()


    getbegbyx() function returns the upper-left coordinates, the top-left corner,
    of the named window.


    # Man Page Format


    ```

    void getbegbyx(WINDOW *win, int y, int x);

    ```


    # Format Reference


    win refers to a specific window. It''s a WINDOW variable representing a window
    or subwindow. (Pads do not have an origin coordinate.)


    y and x are int variables that hold the starting row and column number of the
    win window. Row 0, column 0 represents the upper-left corner of the screen. Note
    that these are not pointer variables.


    # Return Value


    This function is really a macro and as such its return value doesn''t exist and
    shouldn''t be used.


    # Notes


    The y and x values for the standard screen, stdscr, are always 0, 0.


    The y and x arguments are not pointers; do not prefix them with the & operator.'
