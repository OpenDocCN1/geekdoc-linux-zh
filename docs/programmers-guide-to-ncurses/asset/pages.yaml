    # Center that Title!


    It''s possible to have lots of fun with math and positioning text all over the
    screen. Don''t run away! Remember that the computer does the math. Centering the
    text on the screen is an old and ancient art. It works like this:


    +   1. Figure out how wide the screen is.

    2. Figure out how wide your title text is.

    3. Subtract the title length from the screen width. The value left over needs
    to be shared equally spaces on either side of the title.

    4. Divide the value over by two. That''s the number of characters to space over
    to center the title.


    But don''t fret over writing that code yourself. The following program in Listing
    4-5 has it all done for you.'
