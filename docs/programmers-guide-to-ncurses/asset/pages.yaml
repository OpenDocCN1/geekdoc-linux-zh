  md: "# Man Page Format\n\n```\nvoid timeout(int delay);\nvoid timeout(WINDOW *win,\
    \ int delay);\n```\n\n# Format Reference\n\ndelay is an int value, either negative,\
    \ positive, or zero. When delay is negative, input functions are blocking as normal.\
    \ When delay is zero, input functions are non-blocking and return ERR when no\
    \ input is in the queue. Positive values of delay represent the number of milliseconds\
    \ NCurses waits for character input before the input function returns ERR.\n\n\
    # Return Value\n\nERR on failure or OK on success.\n\n# Notes\n\nOne thousand\
    \ milliseconds equals one second.\nSetting the nodelay() function is the same\
    \ as timeout(0).\nThe halfdelay() function is similar to using positive values\
