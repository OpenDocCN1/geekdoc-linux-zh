  md: '# 390 Appendix A = NCurses Library Reference


    # OK


    The int constant OK is used to indicate successful completion of a function.


    # Man Page Format


    Not applicable.


    # Format Reference


    OK can be used like any other constant, though it is most found in a comparison:


    ```

    if( function() == OK)

    ```


    Or if the return value from a function is saved in a variable, r:


    ```

    if( r == OK)

    ```


    Or:


    ```

    while( function() == OK)

    ```


    # Return Value


    The value of OK is set in NCURSES.H to 0.


    # Notes


    Not every function returns OK upon success.

    Some functions are documented as returning ERR upon failure, but any value other
    than ERR — not specifically OK — upon success.

    Note that OK might be defined as being zero, therefore something like:


    ```

    while( function() )

    ```


    cannot work based upon the function''s success if the success returned is OK and
    OK is defined as zero.

    OK''s counterpart is the ERR constant. See ERR.


    # Example


    ```

    if( putwin(menu,mfile) != OK)

    ```'
