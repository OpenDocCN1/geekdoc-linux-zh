  md: '# wtimeout()


    See timeout().


    # wtouchlin


    The wtouchlin() function flags one or more lines in a specific window as either
    requiring updating on the screen or as not needing updating.(Refer to the entry
    for refresh() for more information about how parts of windows are touched and
    require updating.)


    # Man Page Format


    ```

    int wtouchlin(WINDOW *win, int y, int n, int changed);

    ```


    # Format Reference


    +   win is a WINDOW variable indicating which window the wtouchlin() function
    affects.

    y is the top row to mark as either touched or untouched.

    n indicates how many rows, including row, to flag as being touched or untouched.
    Values range from 1 to the number of rows between row and the bottom of the window.

    changed is either 1 or 0. When changed is 1, the rows indicated are flagged as
    touched and will be updated at the next wrefresh() call. When changed is 0, the
    rows indicated are flagged as up to date or untouched.


    # Return Value


    The function returns ERR upon failure; an int value other than ERR is returned
    upon success.


    # Notes


    The wtouchwin(), touchline(), and untouchin() functions are all macros defined
    in NCURSES.H that use the wtouchlin() function. Table A-21 shows how they map
    out.'
  merge: -1
  pgno: 541
- img_proc: true
  md: "# 520 Appendix A = NCurses Library Reference\n\n| FUNCTION | WTOUCHLN() EQUIVALENT\
    \ |\n| --- | --- |\n| touchline(win, row, count) | wtouchln(win, row, count, 1)\
    \ |\n| touchwin(win) | wtouchln(0, getmax(win), 1) |\n| untouchwin(win) | wtouchln(0,\
    \ getmax(win), 0) |\n\nTable A-21: wtouchln() equivalents of other NCurses functions\n\
    \n(The getmaxx() macro is defined in NCURSES.H; refer to the Notes for getmaxx()\
    \ ( in this appendix for details.)\n\n# Examples\n\nwtouchln(stdscr,0,halfy,1);\n\
    \nThe statement flags the top half of the standard screen as being in need of\
    \ updating on the next refresh() call. This assumes that the half variable equals\
    \ half the window's height.\n\nwtouchln(help,13,1,0);\n\nThe statement tells NCurses\
    \ to ignore any modifications done on row 13 in the window help.\n\n# Sample Program\n\
    \n```\n#include <nurses.h>\n\nint main(void) {\n    int r;\n    initscr();\n \
    \   /* Write some text to the entire window */\n    for(r=0;r<LINES;r++)\n   \
    \     mvprintwin(r,0,\n            \"This is the fabulous row %d on the standard\
    \ screen.\",r);\n\n    /* Update every other line */\n    for(r=0;r<LINES;r+=2)\
    \ {\n        wtouchln(stdscr,r,1,1,1);\n        wtouchln(stdscr,r+1,1,0,0);\n\
    \    }\n```"
