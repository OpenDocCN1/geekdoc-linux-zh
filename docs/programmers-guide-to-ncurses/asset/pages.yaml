  md: '# printw()


    The printw() function is the Ncurses equivalent to the standard C printf() function.
    Use printw() in your Ncurses programs when you need printf().


    # Man Page Format


    +   - int printw(const char *fmt, ...);

    - int printw(WINDOW *win, const char *fmt, ...);

    - int mvprintw(int y, int x, const char *fmt, ...);

    - int mvprintw(WINDOW *win, int y, int x, const char *fmt, va_list arglist);

    - int vw_printw(WINDOW *win, const char *fmt, va_list arglist);

    - int vwmvprintw(WINDOW *win, int y, int x, const char *fmt, va_list arglist);


    # Format Reference


    The format for printw() is identical to printf(). . fmt is a formatting string
    that defines text to be output. The string can contain text, escape characters,
    and replaceable parameters. fmt is followed by a list of variables that are displayed
    by the replaceable parameters.


    Refer to the entries for w, mv, and mvw in this appendix for information on the
    w, mv, and mvw variations of this function.

    vwprintf() functions are the Ncurses versions of vsprintf() function, where arglist
    is a va_list (for example, a pointer) representing variable arguments. Refer to
    the man page for vsprintf().


    # Return Value


    ERR on failure, OK or any int value other than ERR on success.


    # Notes


    Internally, Ncurses calls the sprintf() or vsprintf() functions to do the evaluation
    and formatting for printw(). The output is done through the addstr() function
    and therefore all the notes for addstr() also apply to printw().nA variable argument
    of printw(), analogous to vsprintf(), vw_printw(). Here is the man page format:


    ```

    int vw_printw(WINDOW *win, const char *fmt, va_list arglist);

    ```


    The older version of vw_printw() was vwprintw(). It carries the same format as
    vw_printw() but has been deprecated.'
