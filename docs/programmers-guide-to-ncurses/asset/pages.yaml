    # Soft Labels Here and Gone


    The original reason for function keys was variety. The function keys could perform
    any function assigned to them, depending on the software. Therefore, they were
    called function keys instead of a this-or-that specific key.


    Sadly, the role of the function key has changed, thanks to Microsoft Windows.
    Function keys now do specific things in all programs. that FI is universally the
    Help key. And I wonder keyboard manufacturers haven''t just relabeled the thing
    "Help" instead of F1. But digress.


    In the original scheme of things, the role played by the function keys changed
    from program to program and even within a specific program, depending on what
    you were doing. Likewise, the soft labels your program might use changeable as
    well. The following sections describe how the soft labels can be manipulated.


    # Hiding and Restoring the Labels


    Two NCurses functions deal with hiding and redisplaying the soft labels:


    ```

    slk_clear()

    slk_restore()

    ```


    The slk_clear() function hides the soft labels. The slk_restore() function unhides
    them. See Listing 12-3 for examples of this.


    Listing 12-3: lonoff.c


    ```

