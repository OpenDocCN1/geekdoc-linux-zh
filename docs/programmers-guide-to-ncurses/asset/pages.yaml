  md: "# Format Reference\n\nch is an NCurses ctypes variable, which can represent\
    \ a single character or character and attribute combination. See Appendix C for\
    \ more information.\n\nRefer to the mv, mv, and w entries elsewhere in this appendix\
    \ for information on the win, y, and x arguments.\n\n# Return Value\n\nUpon success\
    \ addch() returns OK, or ERR upon failure.\n\n# Notes\n\nCharacters placed at\
    \ the last column cause the cursor's location to drop to the next row. Characters\
    \ placed at the last column of the row do not advance the cursor unless scrolling\
    \ is enabled for the window, in which case the window will scroll up one line.\
    \ see scrollok().nThe addch() function interprets some characters specifically:\n\
    \n+   - \t tab advances the cursor to the next tab stop, which is set every eight\
    \ columns in a window. This value can be reset by using the TABSIZE variable;\n\
    \n+   - \n the newline character erases all text from the cursor's position to\
    \ the end of the line (see clol()), then drops the cursor down to the next line.\
    \ If the cursor is on the last line of the screen, then the window's contents\
    \ are cleared, but only if scrolling is enabled for that window; see scrollok().\n\
    \n+   - \r the carriage return moves the cursor to the start of the current line\
    \ (column zero). It will not erase to the end of the line.\n\n+   - \b the backspace\
    \ character moves the cursor back one node. It does not erase. When the cursor\
    \ is at a start of a line (column zero), the backspace does nothing.\n\nControl\
    \ characters other than \t (^I), \n (^J), \r (^M), or b (^H) are displayed using\
    \ the ^ notation by addch(). This effectively puts two characters to the screen,\
    \ both the ^ and the control character's corresponding key value, such as ^G.\
    \ See unctrl() for more information.\n\nYou can also addch() to place ACS (Alternate\
    \ Character Set) characters to the screen. Refer to Appendix B for more information\
    \ on those characters."
