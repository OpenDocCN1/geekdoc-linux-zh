  md: '# getmaxyx()


    getmaxyx() fetches the height and width of a named window in rows and columns.
    Technically, this is not a function but a macro defined in NCURES.H.


    # Man Page Format


    ```

    void getmaxyx(WINDOW *win, int y, int x);

    ```


    # Format Reference


    win is the name of a WINDOW pointer representing a window created earlier in the
    code. stdscr can be used for the standard screen.

    y is an int variable. The call to getmaxyx(), variable holds the number of rows
    found in win. Values returned by y range from 1 up to the window''s height.

    x is an int variable. After the call to getmaxyx() it holds the number of columns
    found in win. Values returned by x range from 1 up to the window-s width.


    # Return Value


    getmaxyx() is a macro and its return value is undefined.


    # Notes


    Rows go left and right across the screen and may also be called lines. They''re
    counted from the top of the screen to the bottom. In the Cartesian coordinate
    system, rows represent Y values.

    Columns go up and down. They''re counted from the left of the screen to the right.
    In the Cartesian coordinate system, columns represent X values.

    The key to remembering the order of the arguments is in the name of the getmaxyx()
    function itself: Get Max Y X, the y or row comes first. Even though it seems like
    they should be prefixed with y& (&address) operator, do not do this.

    The values returned by y and x measure height and width with the number 1. Note
    when placing the cursor on the screen, the first row and first column are numbered
    zero. So getmaxyx() may return 25 and 80 for the number of row and col, the bottom
    right location on the window is 24, 79.

    A as pseudo function, getmaxyx() merely reads the window''s size values from the
    WINDOW structure. See WINDOW for more information.'
  merge: -1
  pgno: 305
