  md: '# Don’t Panic When You Still Don’t See Anything!


    Even with the refresh() function in the code, it''s still possible that you won''t
    see any program output. The problem isn''t the program or even NCurses; it''s
    your terminal.


    Many terminals, such as xterm, support a feature known as rmcup. It restores the
    screen to what it looked like before a program was run. The situation also occurs
    with any full-screen terminal program, as man or less; the program''s text disappears
    after you quit the program, and the prompt "window" is restored.


    Sadly, there is no handy way to switch off rmcup support from a terminal window.
    The terminfo file for the terminal needs to be recompiled to remove rmcup support,
    or a new terminfo file needs to be created in your directory, one that lacks rmcup
    as an option.


    The quick solution is to use the get() function in your code. By inserting a line
    with get() before the endwin() function, you can pause output and see what NCurses
    before the program quits, as shown in Listing 1-3.


    Listing 1-3: goodbye.c


    ```

    #include <ncurses.h>


    int main(void)

    {

    initscr();

    addstr("Goodbye, cruel C programming!");

    refresh();

    getch();


    endwin();

    return 0;

    }

    ```


    The new line 8 was added, allowing the program to pause, and for you to read the
    output.


    Many of the program examples in this book use get() to pause output. But some
    programs do not; be sure to use get() in your code to see output, or modify your
    terminfo file to disable the rmcup feature.


    > NOTE It might help to be vocal about the rmcup feature for future releases of
    your operating system. While many may see rmcup as a handy thing, others dislike
    it. The solution is to make the feature easy to disable. Let’s hope that will
    be possible sooner than later.'
  merge: -1
