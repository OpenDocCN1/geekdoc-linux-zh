    Mouse events can be captured.


    The message Unable to access the mouse on this terminal may appear, though you
    know that computer recognizes the mouse and uses it to select text in the terminal
    window. And that''s the problem! The operating system is intercepting the mouse
    before signals are passed to the terminal. If possible, try to turn off mouse-selection
    functions for the terminal or somehow enable mouse actions to pass through to
    text-based programs.


    # Reading the Mouse


    Once assured that your computer terminal is heavy for some mouse action, you''ll
    need some additional tools to snoop what the mouse is up to.'
