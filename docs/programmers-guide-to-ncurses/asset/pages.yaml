  md: '# 200 Appendix A = NCurses Library Reference


    # Also See


    Chapter 3, Appendix C, attrset(), chgat()


    # attrset()


    The attrset() function sets attributes for all text output functions that follow.
    The text displayed after using attrset() ignores any attributes previously assigned
    by an attrset() or attron() and instead uses the new attributes specified by attrset().


    # Man Page Formats


    ```

    int attrset(int attrs);

    int watset(WINDOW *win, int attrs);

    int attr_set(attr_t attrs, short pair, void *opts);

    int watset(WINDOW *win, attr_t attrs, short pair, void *opts);

    ```


    # Format Reference


    attrs is a long value representing one or more attribute constants. The attrset()
    effect text put to the screen after the attrset() command is used. The attributes
    defined in NCURSES.H are as follows:


    +   - A_ALTCHAR A_UNDERLINE

    - A_BLINK A_PROTECT

    - A_BOLD A_HORIZONTAL

    - A_DIM A_LEFT

    - A_INVIS A_LOW

    - A_NORMAL A_RIGHT

    - A_REVERSE A_TOP

    - A_STANDOUT A_VERTICAL


    pair is a short int representing a color pair number, similar to the n used in
    COLOR_PAIR(n).

    NULL is used in the prefix attr_set() functions as a placeholder for the undefined
    opts.

    Refer to the w prefix entry later in this appendix for information on the win
    argument.'
