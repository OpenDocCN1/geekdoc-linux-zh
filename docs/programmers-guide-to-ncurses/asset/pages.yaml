    OK upon success, ERR on failure.


    # Notes


    The cursor’s row position determines which row the new blank line appears. Text
    already on that row is scrolled down to the row beneath, as is all text below
    that line.

    insertln() scrolls text on the screen down even when scrolling is active for the
    window. See scrollok().

    This function does not move the cursor.


    # Example


    ```

    insertln();

    ```


    After the statement, all text in the window from the line the cursor is on to
    the bottom is scrolled down one row. A new blank row then appears on the cursor’s
    line.'
