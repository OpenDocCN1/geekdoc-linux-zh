    # subpad()


    The subpad() function creates and defines a rectangle on a pad as a subpad,

    much the same as subwin() creates a subwindow.


    # Man Page Format


    ```

    WINDOW *subpad(WINDOW *orig, int nlines, int ncols, int begin_y, int

    begin_x);

    ```


    # Format Reference


    orig is a WINDOW variable, a pointer, representing the parent pad.

    lines and ncols are int values that set the subpad''s size in rows and

    columns. Values for nlines and ncols cannot be larger than the parent pad.

    begin_y and begin_x are int values that set the subpad''s position relation-

    to the parent pad. The value 0,0 is the parent pad''s upper-left corner.


    # Return Value


    When the subpad() call is successful, a subpad is created in memory and a

    pointer to a WINDOW structure is returned. When things go awry, NULL is

    returned and no subpad is created.


    # Notes


    The subpad must fit completely inside the parent pad. Aside from that, like

    pads pads can be larger than the standard screen.

    As with a subwindow, a subpad shares memory with the pad: Changes

    to one are reflected in the other.'
  merge: -1
