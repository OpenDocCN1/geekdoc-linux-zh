  md: 'When timeout() is SET for a window, then get() calls to that window will not
    wait one second to determine whether an escape sequence comes from the keyboard
    or user. The end effect is that input is greatly sped up for those programs where
    it''s unlikely that the user will manually inputting escape sequences or when
    keyboard escape sequences are not used. (Also see keypad())


    # Man Page Format


    ```

    int timeout (*win, bool bf);

    ```


    # Format Reference


    win is a WINDOW representing a window on the screen.

    bf if a Boolean value, either TRUE or FALSE, both of which are defined in NCURSES.


    # Return Value


    ERR upon failure or an int value other than ERR upon success.


    # Notes


    There are three delays the get() function checks when it is first called: timeout(),
    nodelay(), and halfdelay().

    Don''t confuse this function with timeout(), which adjusts the delay associated
    with blocking input, not just the delay associated with Escape character input.

    The delay doesn''t seem to be one way or the other when keypad() is FALSE for
    the window.

    Internally, NCURSES uses the ESCDELAY constant to set the Esc key delay in increments
    of a millisecond. The value of 1000 sets a 1 second key delay, which is the default
    on many systems.

    The timeout() state is only used in one special case: deciding whether to continue
    reading after a character was read. It''s done independently of the keypad() logic.

    I have not been able to set this function to work. As a workaround, I recommend
    setting the value of the ESCDELAY variable to zero when timeout(win, TRUE) fails
    to behave:


    ```

    ESCDELAY = 0;

    ```'
