    Drawing the line does not affect the cursor''s location. The cursor remains at
    its previous location, whichever location was set by the mvhline() or mvwhline()
    functions.


    The line drawn is not protected against erasure by other NCurses text functions;
    the line can be overwritten at any time.


    # Examples


    ```

