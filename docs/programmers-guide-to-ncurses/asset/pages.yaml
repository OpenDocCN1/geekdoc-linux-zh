    Then you should save the file to disk and re-compile it. But nothing happens.
    That’s good! However....


    # Where is the Program?


    The program gcc creates a named.out. It is a binary file, and its permissions
    are all properly set so the operating system knows it’s a program file and not
    a slice of Velveeta.


    Use the ls command to confirm that a.out exists, if you like. To run the program,
    you need to run on the current directory: ./A.OUT. You can’t just type a.out,
    because the operating system looks only to the search path for programs to run.
    So you must specifically direct tired old UNIX to look in the current directory
    — abbreviated by the . single dot — to run the program.


    So./. means “look in the current directory” and A.OUT means “run the file named
    a.out.”


    Of course, if you have the manual dexterity, you can always type a full path-name,
    something like:


    ```

    /prog/c/ncurses/a.out

    ```


    This also runs the a.out program, but I believe you’ll find typing: ./A.OUT a
    lot easier.


    Nothing happens, not even an error. Again, there is a problem and you need to
    re-edit and recompile.


    # Fixing Stuff (Again)


    Fixing stuff (again) in this case means that you forgot a key Ncurses command.
    (Or more properly, fixing it again means that I didn’t specify a command on purpose
    simply to drive this point home.)'
