    # scanw()


    The scanw() function is the NCurses equivalent of the scanf() function. When you
    need to use scanf() in your NCurses code, you use scanw() instead.


    # Man Page Format


    ```

    int scanw(char *fmt, ...);

    int wscanw(*win, char *fmt, ...);

    int mvscan(int y, int x, char *fmt, ...);

    int mvscan(WINDOW *win, int *y, int x, char *fmt, ...);

    int vw_scanw(WINDOW *win, char *fmt, va_list varaglist);

    int vw_scanw(WINDOW *win, char *fmt, va_list varaglist);

    ```


    # Format Reference


    The format for scanw() is identical to scanf(). .fmt is a formatting string that
    describes the type of input. The string is followed by variable pointers in which
    the input is stored.

    nRefer to the entries for w, mv, and mvw elsewhere in this appendix for information
    on the w, mv, and mvw variations are comparable to the vscanf() function,

    nThe vwscanf() functions are comparable to the vscanf() function, where varaglist
    is a va_list (for example, a pointer) representing variable arguments. Refer to
    the man page for vscanf().


    # Return Value


    An int is returned, either ERR when things go wrong or a value equal to the number
    of fields successfully scanned.


    # Notes


    scanw() uses getstr() for input with the string passed internally to the sscanf()
    function for evaluation.

    A variable argument version of scanw(), analogous to vscanf(), is nvw_scanw().
    Here is the man page format:'
