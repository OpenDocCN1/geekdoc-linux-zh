    # Notes


    The newterm() function creates SCREEN pointers. See newterm().

    wind() function does not release the space referenced by a SCREEN pointer. Therefore
    delscreen() can be used to free up that space.

    The SCREEN pointer is not reset to NULL by delscreen().nThe SCREEN pointer returned
    by a program’s first set_term() call, which represents the default terminal, should
    not be removed by delscreen().


    # Example


