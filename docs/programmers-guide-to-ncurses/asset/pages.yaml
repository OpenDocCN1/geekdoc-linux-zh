  md: '# wsyncdown()


    The wsyncdown() function is called to ensure that locations touched in a win-
    are also touched in any subwindows.


    # Man Page Format


    ```

    void wsyncdown(WINDOW *win);

    ```


    # Format Reference


    win is the name of a WINDOW variable representing a window on the screen.


    # Return Value


    The function returns no value.


    # Notes


    This function is called internally by the wnoutrefresh() function. It''s

    unusual to call this function manually.


    The wsyncdown() function recursively calls all parent windows of the

    named window. Therefore, specify the smallest child window to synchronize

    refresh to all of its parents.


    This function is not related to the wsyncup() function.


    # Example


    ```

    wsyncdown(pp);

    ```


    The statement touches an locations in the window pp, checks

    for any parent windows to touches the same changed locations in those

    windows as well. Again, the refresh(pp) command would do the same

    thing, so there is seldom need to use this command.


    # Sample Program


    Not applicable.


    # Also See


    ```

    wnoutrefresh()

    ```'
  merge: -1
  pgno: 539
- img_proc: true
  md: '# wsyncup()


    The wsyncup() function touches the locations in the parents of a subwindow that
    have been changed in the subwindow.


    # Man Page Format


    ```

    void wsyncup(WINDOW *win);

    ```


    # Format Reference


    win is the name of a WINDOW variable representing a subwindow.


    # Return Value


    This function returns no value.


    # Notes


    wsyncup() is called internally by Ncurses whenever the mvwin() function is used
    to relocate a subwindow.


    This function may be called automatically whenever there is a change to any window.
    See synock() for more information.

    wsyncup() seems rather redundant, given that a subwindow shares memory with its
    parent.


    # Example


    ```

    wsyncup(baby);

    ```


    The statement touches all changed locations in the subwindow baby inside all parent
    windows as well.


    # Sample Program


    Not applicable.


    # Also See


    synock(), refresh()'
  merge: -1
  pgno: 540
