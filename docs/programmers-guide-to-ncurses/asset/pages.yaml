    This statement applies the reverse text attribute from any new text displayed.
    This attribute is applied in addition to any previously-applied text attributes.


    ```

    watton(warning,A_BOLD | A_BLINK);

    ```


    This statement sets both the bold and blink attributes from any new text displayed
    in the warning window.


    ```

    attron(COLOR_PAIR(3));

    ```


