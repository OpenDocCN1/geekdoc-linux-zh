  md: '# Chapter 3 = Formatting Text


    It''s important to remember that the COLORS value tells you how many colors are
    available, the colors are numbered starting with zero. So the range of colors
    available is 0 through COLORS minus one.


    A color pair is simply a combination of foreground and background color attributes.
    Each combination is a color pair and assigned a number from 1 through the value
    of COLOR_PAIRS minus 1.


    For example, the color pair COLOR_YELLOW, COLOR_RED indicates yellow text on a
    red background. To assign those colors as a text attribute, you must first associate
    them with a color pair number. This is done with the init_pair function:


    ```

    init_pair(pair,f,b)

    ```


    The init_pair() function assigns two colors to color pair. f is the foreground,
    or text, color; b is the background color.


    ```

    init_pair(1,COLOR_YELLOW,COLOR_RED);

    ```


    The preceding statement defines color pair number 1 as yellow text on a red background.

    The next step is to apply the color attribute to the text. This is done by using
    the attrset() or atron() just as you would apply any other text attribute. The
    key, however, is to use the COLOR_PAIR(n) constant:


    ```

    attrset(COLOR_PAIR(1));

    ```


    The preceding statement applies the color attributes assigned to color pair 1
    to the text that follows. If COLOR_PAIR(1) is defined as yellow text on a red
    background, that''s the attribute taken by the text.

    To apply a different color to the text, use init_pair() to set up foreground and
    background colors for a color pair. Then use the COLOR_PAIR(n) constant with attrset()
    or atron() to apply that color combination to your text.


    # Eight or Sixteen Colors?


    While NCurses report only eight colors available, on most terminals there are
    twice as many colors to choose from. The secret is to apply the bold text attribute
    (A_BOLD) with a color pair.


    The bold text attribute affects only the foreground color. It gives you access
    to the eight brighter (or however many) text colors available.'
