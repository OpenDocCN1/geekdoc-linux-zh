  md: '# CHAPTER 8

    Windows, Windows Everywhere!


    From the “And Now He Tells You” Department comes this important tidbit: NCurses
    is a windowed environment. Nearly all NCurses text output functions are window
    oriented, either directly or via a macro defined in the NCURSES.H header file.


    If you''ve been ploughing through the tutorial part of book front to back, you
    haven''t really noticed this windowed aspect of NCurses. Well, not by much, at
    least. Those few commands that required a window argument `stdscr`, the standard
    screen. But that isn''t as much the standard screen as it is the default window
    to which NCurses sends its output.


    In the bigger picture, the standard screen is only one of many windows your programs
    can use in NCurses. So be prepared for some eye-opening looks through various
    NCurses windows.


    # Ye Olde Standard Screen


    When `initscr()` function initializes NCurses, it does various things (performs
    duties, sets up memory, and so on). One of the many tasks is to create the default
    window for program output, the standard screen, named `stdscr`.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Commands that Require a Window Argument


    So far in this book, you''ve experienced commands that use stdscr to refer to
    the terminal window. Here''s a sampling:


    ```

    getmaxxy(win,row,col)

    getyx(win,y,x)

    keypad(win,bf)

    odelay(win,bf)

    ```


    Each of these commands require a win or window argument, so that NCurses knows
    which window is on the screen to refer to. Previous chapters in this book use
    stdscr to represent the standard screen, the only window NCurses creates. Other
    window names can be used as well, the names of new windows you create yourself.
    (More on in a few paragraphs.)


    # The Pseudo Commands


    Nearly all text-output functions in NCurses require a win argument, specifying
    which window to send the output. As a win argument, stdscr isn''t used much, because
    many of the command text-output functions have customized for use with stdscr;
    those text-output functions exist as special macros written in NCURSES.H file.


    For example, the addch() function, which adds a character to the screen, is really
    a macro. The actual function is named waddch() and here is its format:


    ```

    waddch(win,ch);

    ```


    The addch macro, or pseudo function, looks like this in NCURSES.H:


    ```

    #define addch(ch)

    nwaddch(stdscr,ch)

    ```


    So anytime you''ve used addch() in a program, the compiler secretly swaps it out
    with the proper window-based function, waddch(), specifying stdscr as the named
    window.


    Pseudo functions have been used for just all of the character and text-output
    functions introduced so far in this book''s tutorial. There''s nothing wrong with
    using the shorter, nonwindowed version of the function; my purpose is simply to
    tell you that NCurses always refers to a specific window for its commands, whether
    you''re using a window version of a function or not.


    Surprise!'
  merge: -1
  pgno: 112
