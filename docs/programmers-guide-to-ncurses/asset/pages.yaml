- img_proc: true
  md: '# Format Reference


    win is an NCurses window, either stdscr for the standard screen or the name of
    a WINDOW variable returned from a function that creates new windows. line is an
    int value indicating which row (line) to check for updates. Values range from
    0 for the top row to the maximum rows in a window.


    # Return Value


    The value returned by is_linetouched() is one of the following constants declared
    in NCURSES.H:


    +   - TRUE, indicating that the line has been modified since the last refresh()


    +   - FALSE, indicating that the line and the current screen match up (or should
    match as far as NCurses is concerned)


    +   - ERR, which happens when an invalid line number is specified


    # Notes


    The is_linetouched() function is merely a tool you can use to determine whether
    or not a row of text has been updated since the last refresh(). Using the is_linetouched()
    function does not force NCurses to update the screen but rather which line will
    be updated on the next refresh. is_linetouched() works best after a recent refresh.
    For example, when a window is just created, or initscr has created the standard
    screen, then all lines in the window are touched. Only after issuing a recent
    refresh() does the is_linetouched() function become truly useful.


    The is_linetouched() function always returns TRUE after the touchline() function
    is used. See touchline().


    # Example


    ```

    if(is_linetouched(alpha, 0));

    ```


    Here, the it passes when modifications have been made to line 0 window alpha.


