  md: '# Chapter 3 Formatting Text 43


    The result should be a solid blue screen, top to bottom. Any text added at this
    point appears with the color attribute applied automatically, in this case with
    white text on a blue background.


    Press the Enter key to enter the program; modify the code to add some text. For
    example, insert the following before line 10:


    ```

    addstr(So this is what a color screen looks like?\n);

    ```


    The text appears on the screen with the same attribute: white text on a blue background.


    # More than Solid


    Now if the solid screen bores you, it''s possible to use the bgd() function to
    fill each character space on the screen with a given character. That''s because
    the argument to the bgd() function is a ctypes character.

    The NCurses ctypes is a special type of variable that includes both an attribute
    and character. They appear as words as well because the dot that the background
    attribute for a window.


    Modify BCOLOR1C source code and change line 9 to read:


    ```

    bgd(''.'');

    ```


    Upon running the program, you''ll see the window''s background filled with dots
    or periods. They appear as words as well because it''s the dot that defines the
    window''s background “attribute”.

    To combine the dot and the color, modify line 9 to read:


    ```

    bgd(COLOR_PAIR(1) | ''.'', '' '');

    ```


    The in is the logical OR. It takes the value of COLOR_PAIR(1) and logically ORs
    it with the character code for a period. You can also use the OR to apply other
    attributes or characters for the bgd() function. (See Appendix C for more information
    on the ctypes variable in NCurses).


    # Changing Color on the Fly


    The bgd() function affects all attributes and unused character places on the screen.
    Any text you''ve written stays on the screen as text; only the attributes are
    changed, as Listing 3-7 demonstrates:'
