    # insstr()


    The insstr() function inserts a string of characters at the cursor''s position,

    shifting remaining text on to the right. It''s equivalent to multiple calls

    to the insch() function.


    # Man Page Formats


    ```

    int insstr(const char *str);

    int insstr(const char *str, int n);

    int winstr(WINDOW *win, const char *str);

    int mwinstr(WINDOW *win, const char *str, int n);

    int mvinsstr(int y, int x, const char *str);

    int mvinsstr(int y, int x, int x, const char *str, int n);

    int mvinsstr(WINDOW *win, int win, int y, int x, const char *str);

    int mvinsstr(WINDOW *win, int win, int y, int x, const char *str, int n);

    ```


    # Format Reference


    str is a string of characters (a char array) inserted at the cursor''s position.

    These are plain text characters, not ctype characters.


    Functions that use n specify how many characters of str to display.

    Values for n from 0 up to the length of the str. If n is greater than the

    length of the str, or when n is 0 (less than 0), then the entire str is displayed.


    Refer to the mv*, mvw*, and w prefix entries elsewhere in this appendix for

    information on the win, y, and x arguments.


    # Return Value


    OK upon success, ERR upon not-success.'
