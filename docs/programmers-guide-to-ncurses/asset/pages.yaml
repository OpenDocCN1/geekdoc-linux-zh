  md: '# Man Page Format


    ```

    int flushinp(void);

    ```


    # Format Reference


    The function takes no arguments.


    # Return Value


    Always OK.


    # Notes


    Flushing input is recommended for situations where the user is posed a vital question.
    By using flushinp() you ensure that no stray keys will be read, for example, as
    input to a critical yes/no question.


    You can use the intrflush() function to have keyboard input flushed when the user
    presses an interrupt key. See interflush().


    # Example


    ```

    flushinp();

    ```


    This statement removes all characters typed and waiting in the keyboard input
    queue.


    # Sample Program


    ```

    1 #include <ncurses.h>

    2

    3 int main(void)

    4 {

    5 char buffer[81];

    6

    7 initscr();

    8

    9 addstr("Type on the keyboard I wait...\n");

    10 refresh();

    11 napms(5000); /* 5 seconds */

    12

    13 addstr("Here is what you typed:\n");

    14 flushinp();

    15 getstr(buffer,80);

    16 refresh();

    17

    18 endwin();

    ```'
