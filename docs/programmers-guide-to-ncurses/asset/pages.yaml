  md: '# 10 Chapter 1 The Setup


    > **NOTE Here’s a tip: Familiarize yourself with the editor’s command that instantly
    jumps to a specific line number. Most of your editing will actually be re-editing,
    where the compiler directs you to a specific line number. If you know the line-number-jumping
