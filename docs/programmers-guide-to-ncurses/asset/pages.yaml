    # has_colors()


    The has_colors() function is used to determine whether or not the terminal has
    the ability to display color text attributes.

    This function is used before start_color(). Obviously there''s no point in doing
    colors in a program for a terminal that cannot display them.


    # Man Page Format


    bool has_colors(void);


    # Format Reference


    The function has no arguments.


    # Return Value


    has_colors() returns a Boolean value, either TRUE or FALSE, the former when the
    terminal can do color and the latter when it cannot.


    # Notes


    This is one of the rare text color function in NCurses that uses the plural colors.
    The other two are assume_default_colors() and use_default_colors().


    # Examples


    ```

    r = has_colors();

    ```


    After this statement, the value of r will equal TRUE if the terminal can produce
    color text, FALSE otherwise.


    ```

    if(has_colors)

    ```


    The above if condition evaluates true if the console has the ability to use color
    text.'
