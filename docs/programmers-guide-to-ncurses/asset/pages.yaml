    # bkgd()


    The bkgd() functions set the background attributes for the stdscr or a specific
    window. It writes new attributes to every character position on the window and
    even fills in blanks (spaces) with characters, if a character is specified as
    part of the attribute. bkgd() does not overwrite any existing text.


    # Man Page Formats


    ```

    int bkgd(ctype ch);

    int bkgwd(WINDOW *win, ctype ch);-

    ```


    # Format Reference


    ch is an NCurses variable, a long int. It typically consists of formatting-attributes,
    which are constants declared in NCURSES.H. It can also consist of regular character
    texts. Multiple attributes are combined by using the | (logical OR).


    Refer to attrset(), as well as Appendix C, for a list of the ctype-formatting
    attributes.


    Refer to the w prefix entry later in this appendix for information on the win
    argument.


    # Return Value


    The bkgd() function returns ERR on failure.'
