  md: '# 510 Appendix A NCurses Library Reference


    _clear is a Boolean value when set tells NCurses that information in the window
    needs to be redrawn from scratch. This setting is controlled by the clearok()
    function.


    _leaveok is a Boolean value when set tells NCurses not to update the cursor''s
    position for the window. This setting is controlled by the leaveok() function.


    _scroll is a Boolean value, when set tells NCurses that the window''s contents
    can be scrolled. This setting is controlled by the scroll() function.


    _idlock is a Boolean value, when set tells NCurses to use the hardware insert/delete
    line function. This setting is controlled by the idlock() function.


    _idock is a Boolean value, when set tells NCurses to use the hardware insert/delete
    character function. This setting is controlled by the idock() function.


    _immed is a Boolean value, when set tells NCurses to automatically call the refresh()
    function time the window''s data is changed. This setting is controlled by the
    immedok() function.


    _sync is a Boolean value, when set tells NCurses to automatically update a subwindow''s
    data any time the parent window''s data is changed. This setting is controlled
    by the sync() function.


    _use_keypad is a Boolean value, when set tells NCurses to interpret the keyboard''s
    keypad, function, cursor and other special keys. This setting is controlled by
    the keypad() function.


    _delay is an int value, which sets the keyboard input delay. Values less than
    zero turn getch() into a non-blocking call. Values greater than zero set the delay
    in milliseconds. This setting is controlled by the nodelay() and timeout() functions.


    # Window data


    ```

    win->line

    ```


    _line is a pointer to a special structure that holds the window''s actual data,
    NCurses developers really don''t want you messing with that data, so this element
    of the WINDOW structure is undocumented.


    # Window Scrolling Region


    ```

    win->regtop

    win->regbottom

    ```'
