    # Return Value


    OK is returned.


    # Notes


    Remember: You do not set the border''s size or origin; the border follows the
    outline of the stdscr or named window. So if you want a border of a specific size,
    create a new window or subwindow and place the border in there.


    The border occupies the top and bottom rows and the far left and right columns
    of the window.


    The border is not protected and can easily be erased or replaced by putting characters
    to the window at the border''s position.


    Text placed inside a window with a border must remain within the border to avoid
    over-writing the border. For example, the first line of text in a window should
    be placed at position 1, 1, not position 0, 0.


    You can apply a border to the smallest window possible, which is one character
    in size. In that case, the only part of the border visible is the lower-right
    corner.


    The smallest window where the full border is visible is a 3-by-3 character window.
    The borders four corners are used to box a 2-by-2 window, though no window content
    can be displayed without erasing the border.


    # Examples


    ```

    border(0,0,0,0, 0,0,0,0);

    ```


