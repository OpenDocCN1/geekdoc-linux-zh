  md: '# Chapter 3 Formatting Text 41


    The values passed to `init_color()` are all short integers. The first color represents
    the new color. It must be in the range of zero COLOR minus 1. Then come values
    for the (r), green (g), and blue (b) arguments, each which ranges from 0 to 1000,
    representing the intensity of that particular color.


    So, for example, the following call to `init_color()` defines (or redefines) color
    number 2 as a dark gray:


    ```

    init_color(2,250,250,250);

    ```


    The following source code in Listing 3-5 demonstrates how `init_color` is used
    to define the pink color for color code 1.


