    The next section explains the difference between COLORS and COLOR_PAIRS.


    # Colors and Color Pairs


    In NCurses the COLORS and COLOR_PAIRS constants report how many colors the terminal
    can display and how many color combinations (foreground + background — a color
    pair) can be defined. This may not be the way you’ve dealt with text colors in
    the past, so pay attention!


    The COLORS value reflects the basic set of colors available to the terminal. The
    typical PC reports only eight colors available. The standard eight text colors
    used on PCs since the first IBM PC graphics adapter set the standard back in 1981.
    The colors are listed in Table 3-2, along with their NCurses names and values.


    Table 3-2: NCurses Colors


    | NCURSES NUMBER | PC BIOS NUMBER | PC NAME | NCURSES NAME |

    |---|---|---|--|

    | 0 | 0 | Black | COLOR_BLACK |

    | 1 | 4 | Red | COLOR_RED |

    | 2 | 2 | Green | COLOR_GREEN |

    | 3 | 6 | Brown | COLOR_YELLOW |

    | 4 | 1 | Blue | COLOR_BLUE |

    | 5 | 5 | Magenta | COLOR_MAGENTA |

    | 6 | 3 | Cyan | COLOR_CYAN |

    | 7 | 7 | White | COLOR_WHITE |'
