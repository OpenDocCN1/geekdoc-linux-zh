    # Some Compacting


    The folks who write and maintain NCurses came to a strong realization years ago
    that any move() function is usually followed by a command to actually stick text
    on the screen. The following code in any program would be simpler:


    ```

    move(10,13);    /* move to here */

    move(5,6);        /* then to here */

    move(17,11);      /* try out this spot */

    move(21,0);       /* then put the cursor here */

    ```


    What''s the point of all that? No, move() functions are followed by some type
    of text output or statement. And you already know two of them: addch(), addstr(),
    and printw(). By prefixing mv (for move) to each of these commands, you get a
    combined move-and-print command.

