  md: '# 502 Appendix A — NCurses Library Reference


    The line drawn is not protected against erasure by other NCurses text output functions;
    the line can be overwritten at any time.


    # Examples


    ```

    vline(0, 10);

    ```


    The function draws a line 10 characters long (tall) from the cursor’s current
    position. The default line drawing character is used.


    ```

    mvvline(y, 10, ''*'', len);

    ```


    Here, the function draws a vertical line using asterisks. The line is len characters
    long from location row y, column 10.


