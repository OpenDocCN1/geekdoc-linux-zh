  md: '# 512 Appendix A = NCurses Library Reference


    # Return Value


    Not applicable.


    # Notes


    Obviously, it''s preferable to change attributes by using the proper NCurses functions
    wherever possible.


    The subwindow information for a window, win->parx, win->pary, win->_parent, is
    set only when the window is a subwindow.


    Note that there is no reference in the WINDOW structure for any subwindows. True,
    subwindows link back to their parents (via the _parent element). But there is
    no element in the WINDOW structure to reference any offspring. (NCurses maintains
    an internal list of all subwindows.)


