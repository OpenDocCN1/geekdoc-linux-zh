    # MEVENT


    NCurses uses the MEVENT structure to store information about a specific mouse
    event. The getch() function is used to determine when a mouse event has taken
    place. After that, getmouse() reads information about the mouse event and stores
    that data into a MEVENT structure. The program can then read data from the MEVENT
    structure to see what happened and act accordingly.


    # Man Page Format


    Not applicable.


    # Format Reference


    MEVENT is a structure defined in NCURSES.H. It has the following components:


    ```

    short id;

    int x, y, z;

    mmask_t bstate;

    ```


    id is a short int value used to make a distinction between multiple point-devices,
    for example on a laptop with both a mouse pad and external mouse.


    x is an int value representing the column in which the mouse pointer was during
    the event. Values start at 0 for the leftmost column.


    y is an int value representing the row in which the mouse pointer was during the
    event. Values start at 0 for the top row.


    z is an int value reserved for future use, though it might be for reading the
    wheel button.


    bstate is a mmask_t (long int) value representing the mouse''s button state at
    the time of the event. mmask_t values and their defined constants are listed in
    Table A-10.


    # Return Value


    Not applicable.'
