    ```

    int delch(void);

    int wdelch(WINDOW *win);

    int mvdelch(int y, int x);

    int mwdelch(WINDOW *win, int y, int x);

    ```


    # Format Reference


    The base function has no arguments; refer to the mv, mvw, and w prefix entries
    elsewhere in this appendix for information on the win, y, and x arguments.


    # Return Value


    OK on success, or ERR on failure.


    # Notes


    This function does not change the cursor''s position.

    To delete a line of text, use the deleteln() function.

    To insert a single character, the insch() function is used.'
