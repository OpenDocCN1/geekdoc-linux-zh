    # nl()


    nl() is an input modification function that allows your program to distinguish
    between the line feed and carriage return codes.


    # Explanation


    The newline \n actually generates two separate cursor movement commands. The first
    is the carriage return (CR), which moves the cursor to the start of a line — just
    like the carriage return bar on the old manual typewriters. The second command
    is the line feed (LF), which advances the cursor one line down on the screen.


    Codewise, ASCII defines CR as code 13 or ^M, and LF as code 10 or ^J. On the PC
    keyboard, the Enter key is traditionally mapped to ^M, which is why you often
    find text files imported from a PC (Windows) to UNIX as lacking linefeeds. Similarly,
    users often import text files to fix carriage returns. The reason is that the
    Enter key in UNIX, the \n, is mapped to code 10, which provides both carriage
    return and line feed functions.'
