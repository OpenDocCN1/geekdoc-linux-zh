  md: "# Chapter 2 = Basic I/O, the NCurses Way 21\n\nYes, indeed, the program clears\
    \ the screen. Here’s how. When initscr() runs, it initializes stdscr, the default\
    \ window, to blanks and sets the cursor to the home position, top row, left-most\
    \ column. The refresh() function updates stdscr to the current screen and the\
    \ terminal display, which has the effect of clearing the screen and homing the\
    \ cursor.\n\n# Writing Text\n\nHere are three popular NCurses text output functions:\n\
    \n```\naddch(ch);\naddstr(*str);\nprintw(format,var,var...);\n```\n\nThe addch()\
    \ function places (or adds) a single character to the display. addstr() adds an\
    \ entire string, essentially calling addch() over and over until the string is\
    \ cou up. You’ve already seen addstr() in use with the goodbye.c program in Chapter\
    \ 1. It’s similar to the puts() function in C, though a newline (\\n) isn’t automatically\
    \ appended to the string. printw() is the NCurses version of printf() function.\
    \ It outputs a formatted string to the display.\n\nNCurses sports more text output\
    \ functions, for getting started these three basic functions are fine.\n\n# Tossing\
    \ Up One Stupid Character at a Time\n\nI love marque programs. But rather than\
