  md: '# About the Author


    Dan Gookin has been writing about technology for over 20 years. He’s contributed
    articles to numerous high-tech magazines and written more than 100 books on personal
    computers, many of them accurate.


    Dan combines his love of writing with his gizmo fascination to create books that
    are informative, entertaining, and not boring. Having sold more than 14 million
    titles translated into more than 30 languages, Dan can attest that his method
    of crafting computer titles does seem to work.


    Perhaps his most famous title is the original DOS For Dummies, published in 1991.
    It became the world’s fastest-selling computer book, at one time moving more copies
    per week than the New York Times #1 bestseller (though as a reference, it could
    not be listed on the NYT Bestseller list). From that book spawned the entire line
    of For Dummies, which remains a publishing phenomenon to this day.


    Dan’s most recent titles include Word 2007 For Dummies, Laptops For Dummies, 2nd
    Edition, and PCs For Dummies, 10th Edition. He also maintains the vast and helpful
    Web page www.wambooli.com.


    Dan holds a degree in Communications/Visual Arts from the University of California,
    San Diego. Presently he lives in the Pacific Northwest, where he enjoys spending
    time with his boys in the gentle woods of Idaho.'
