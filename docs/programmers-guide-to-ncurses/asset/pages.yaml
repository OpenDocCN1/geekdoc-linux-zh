  md: '# Format Reference


    top is an int indicating the top row for the scrolling region. Values range from
    0 for the top row, to the value of bot minus 1.


    bot is an int indicating the bottom row of the scrolling region. Values range
    from top+1 to the bottom of the window.


    Refer to the w entry elsewhere in this appendix for information on the win argument.


    # Return Value


    OK on success, ERR on failure. The function fails when top is greater than equal
    to bot, or when bot is greater than the bottom of the window.


    # Notes


    This function works only after scrolling has been enabled for the window via the
    scrollok() function. See scrollok().


    Unless setscreg() is used, the top and bottom rows of the window define the scrolling
    region.


    The bottom row of the window can be returned using w->_maxy, where w is the window''s
    WINDOW variable name.


    Text can still be written to the window below the scrolling region, specifically
    by using the various mv-prefix text output functions.


    # Examples


    ```

    setscreg(5,stdsc->_maxy);

    ```


    The statement creates a scrolling region from line 5 through the bottom of the
    standard screen.


    ```

    wsetscreg(options,2,opbot);

    ```


    Here, the statement creates a scrolling region in the window options, from line
    2 (the third line) of the window through the value represented by opbot.'
