    ```

    ```int init_color(short color, short r, short g, short b);```

    ```


    # Format Reference


    c is a short representing a color number to change. The range of valid values
    for c is 0 through the value of COLOR. (See COLOR).

    r, g, and b are short int representing the intensity of the red, green and blue
    hues of the color created. Values range from 0 through 1000, where 0 is black
    and 1000 is full intensity for red, green, or blue.


    # Return Value


    ERR upon failure, OK otherwise.


    # Notes


    Use the can_change_color() function to determine whether or not the terminal has
    the ability to redefine its colors set. When can_change_color() returns TRUE,
    then the init_color() function can be used.'
