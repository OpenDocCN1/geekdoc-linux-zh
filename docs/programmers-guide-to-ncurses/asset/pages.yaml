    # scr_init()


    The scr_init() function reads the window data saved to disk by `scr_dump()` and
    uses information from that file to configure the screen.


    # Explanation


    The `scr_dump()` function writes data to disk. It writes the visible data to what
    (what you see on the screen), as well as various window settings and options.


    To restore the screen, the `scr_restore()` function is used. However, to restore
    both screen and the window settings, `scr_init()` must be used before `scr_restore()`.
    Or, to make things easier, the `scr_set()` function can be used, which is a combination
    of `scr_init()` followed by `scr_restore()`.


    # Man Page Format


    ```

    int scr_init(const char *filename);

    ```


    # Format Reference


    filename is the name of a file in which the standard screen data has been saved.
    The value is a string, *not* a FILE pointer.'
