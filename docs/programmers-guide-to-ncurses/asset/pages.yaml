  md: '# mvderwin()


    mvderwin() function uses a subwindow to display a different portion of the parent
    window. It does not really move anything other than data.


    # Explanation


    Subwindows share memory with their parent. Therefore, moving a subwindow doesn''t
    really do anything. Instead, this function does is allow you to display a different
    portion of the parent window in the subwindow rectangle.


    # Man Page Format


    ```

    int mvderwin(WINDOW *win, int par_y, int par_x);

    ```


    # Format Reference


    win is the name of a WINDOW variable representing a subwindow.


    par_y is an int value representing the row value of a coordinate in the parent
    window.


    par_x is an int value representing the column value of a coordinate in the parent
    window.


    # Return Value


    OK on success or ERR upon failure.


    # Notes


    mvderwin() function takes a rectangle of text from the parent window location
    par_y, par_x, with the same width and depth as the subwindow, copies that into
    the subwindow''s location.


    This function also copies any attributes from the source location in the parent
    window to the subwindow, overwriting any attributes already in the subwindow.


    mvderwin() updates a window inside a subwindow in much the same manner as prerefresh()
    updates a portion of a pad inside a window. See prerefresh().


    This function works on all subwindows, whether they were created by the subwin()
    or derwin() functions.


    The mvwin() function is used to move a window. It should not be used on a subwindow.'
  merge: -1
  pgno: 388
