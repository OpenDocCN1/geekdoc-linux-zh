  md: '# The Alternative Character Set


    The Alternative Character Set, or ACS, is defined in the NCURSES.H file. Its purpose
    is to provide a common set of characters for use on all platforms. The table in
    this appendix gives the name defined for the characters, as specified in NCURSES.H.
    The Char column shows what the character commonly looks like. The ASCII column
    displays the ASCII character substituted when the character isn''t available.
    And the Description column describes the character''s appearance or use.


    | DEFINE NAME | CHAR | ASCII | DESCRIPTION |

    |---|---|---|---|

    | ACS_BLOCK | | # | A solid (100 percent) block |

    | ACS_BOARD | | # | A 50 percent shaded block |

    | ACS_BTEE |  | + | Line at bottom T intersection |

    | ACS_BULLET | | o | Bullet |

    | ACS_CKBOARD | | | A 33 percent shaded block |

    | ACS_DARROW | | v | Down arrow |

    | ACS_DEGREE | | | Degree symbol |

    | ACS_DIAMOND | ⋄ | + | Diamond |'
