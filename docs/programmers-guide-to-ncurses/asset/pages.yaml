  md: '# CHAPTER

    12

    The Joy of

    Soft Labels


    Dig down deep into NCurses’ bag of tricks and you’ll discover a clever and quick
    instant interface trick called soft labels. They really aren’t anything amazing,
    though they can save you time over having to do the programming your-self. So
    when you want to slap together a quick and friendly interface, soft labels take
    care of that programming overhead for you.


    # What is a Soft Label?


    Soft labels are typically associated with a set of function keys found just below
    the screen on a terminal keyboard. This is something that was more common in the
    old days of mainframes and their remote terminals than it is today.


    For example, the terminal may have F1 through F8 just below the built-in. Above
    each key would be a highlighted blob of text on the screen. The text represented
    the command associated with the key, similar to what you see in Figure 12-1.


    Pressing F1, for example, may shift the screen into printing mode. The soft labels
    might change to reflect the new screen and show the new functions for the keys
    F1 through F8. Theoretically, the user understands that, by pressing a function
    key, he or she is issuing the command specified in the soft label. Theoretically.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# 148 Chapter 12 = The Joy of Soft Labels


    ![](img/b0e33f0db107583cf9267e27aa42f380_170_0.png)


    Figure 12-1: How soft labels might have worked on an older terminal


    # Doing the Soft Label Thing


    In NCurses, soft labels are visual elements only. There is no back connection
    between function keys and soft labels, unless you program yourself. Otherwise,
    setting and displaying soft keys is merely a visual part of NCurses.


    # Stand by for Soft Labels


    If you''re writing a program that uses soft labels, you''ll need to use the `slk_init()`
    function:


    ```

    slk_init(n)

    ```


    All soft label functions begin with `slk`. I assume that `slk` stands for soft
    keys, though that''s just a guess.

    The `slk_init()` function must appear *before* the `initscr()` function in your
    code. The reason is that `slk_init()` changes the size of the standard screen,
    reserving the bottom row for the soft keys. NCurses commands, then, affect only
    the top several rows of the screen; the bottom row is reserved— and cannot be
    touched, other than to mess with the soft labels.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Chapter 12 ■ The Joy of Soft Labels 149


    The value of n determines how many soft labels there will be, as well as how they’re
    arranged on the screen. Figure 12-2 details the results for valid values of n
    from 0 through 3.


    # Gimme Some Soft Labels


    The slk_init() function merely announces the presence of soft labels. You must
    also assign text to the labels, as well as display the labels in their special
    row on the screen.


    Assigning text to the labels is done using the slk_set() function:


    ```

    slk_set(label,text,pos)

    ```


    The slk_set() function has three arguments.


    +   - label is the label number, ranging from 1 to 12, merging from left to right
    across the screen. The number of labels you need to set depends on the value used
    with the slk_init() function.

    - text is the text to appear on label. When there are eight soft labels on the
    screen, up to eight characters of text appears in the labels. For 12 soft labels
    on the screen, only five characters of text appear in the labels.

    - pos determines the text’s orientation within the label. There are three values:
    0 for left-justified; 1 for centered; and 2 for right-justified.


    ![](img/b0e33f0db107583cf9267e27aa42f380_171_0.png)


    **Figure 12-2:** Soft setup options for slk_init(n)'
  merge: -1
  pgno: 171
