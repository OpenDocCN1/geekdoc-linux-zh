  md: '# termattrs()


    The termattrs() function is used to confirm which attributes the terminal is capable
    of producing.


    # Man Page Format


    ```

    ctype termattrs(void);

    attr_t term_attrs(void);

    ```


    # Format Reference


    The functions have no arguments.


    # Return Value


    The functions return a long int bit field with bits set according to which attributes
    the terminal is capable of producing. The ctypes attributes defined in NCURSES.H
    and are prefixed with A; attr_t attributes are also defined in NCURSES.H and prefixed
    by WA.


    # Notes


    It''s possible to ferret out specific attributes by using a logical OR with the
    attribute constant and the value returned by termattrs().nThe attr_get() function
    is used to read attributes currently being used in a window. attr_get().

    Refer to Appendix C for more information on the attribute constants.


    # Examples


    ```

    printf("The terminals attributes value is %%X.\n",termattrs());

    ```


    The function displays the termattrs() value as a hexadecimal number.


    ```

    a = termattrs();

    ```


    Here, the attributes bit mask for the current terminal is saved in ctype variable
    a.'
