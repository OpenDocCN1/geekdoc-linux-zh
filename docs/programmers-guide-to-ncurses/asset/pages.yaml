  md: '# 420 Appendix A = NCurses Library Reference


    # Format Reference


    line is an int value, either positive or negative. When line is positive, a single
    row is ripped from the top of the terminal window. When line is negative, a single
    row is ripped from the bottom of the terminal window.

    it is the name of a function ripoffline() calls to create the line. The function
    is called with two arguments: first a pointer to a WINDOW structure representing
    the ripped-off line, and second int value representing the number of columns in
    the ripped-off line. (The number of rows and int values are passed by NCurses
    to your function. Your init function must return an int value.


    # Return Value


    Always OK.


    # Notes


    The ripoffline() function must be used before initscr() or newterm(). You may
    call ripoffline() up to five times.

    The function referenced in ripoffline() is responsible for placing information
    inside the line. NCurses passes to your function the name of the WINDOW variable
    used to reference the line, plus the number of columns in the line. Your function
    can use any of the NCurses text output functions to create the line, referencing
    the WINDOW variable, of course. The only two functions not allowed are refresh()
    and doubdate(). So be sure to use wrefresh() command to put the line to the screen.

    The size of the standard screen is reduced by one line for each call made to ripoffline().
    This reduces the value of LINES and sets the standard screen''s cursor location
    one row down for each ripoffline() window created at the top of the screen.

    The ripped off can be referenced elsewhere in your NCurses program. To do so,
    save the WINDOW pointer to a global variable inside the init function. Once saved,
    you can use that global variable to reference the ripped-off line elsewhere in
    the program, updating it via wrefresh() just as you would any other window.

    ripoffline() is used internally by NCurses to set up the soft label keys. See
    slk_init().


    # Example


    ```

    ripoffline(1,setup()).

    ```


    The statement removes a line from the top of the screen. The setup() function
    is called to initialize the line.'
