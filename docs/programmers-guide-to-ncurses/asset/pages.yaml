    # Some Optimization


    Here''s a bit of advanced NCurs for you: The code in the previous section uses
    three refresh() functions in PADDY2.C to update pad data to the standard screen:


    ```

    refresh(s1, 0, 0, 0, TALL-1, WIDE);

    refresh(s2, 0, 0, WIDE+SPACER, TALL-1, WIDE*2+SPACER);

    refresh(s3, 0, 0, WIDE*2+SPACER*2, TALL-1, WIDE*3+SPACER*2);

    ```


    These three statements work, but they''re inefficient. Each refresh() internally
    calls two lower-level NCurs functions: poutrefresh() and doupdate().nThe poutrefresh()
    function examines a rectangle of text in a pad, and notes that the text in that
    rectangle has been changed or updated since the last refresh(). That text, referred
    to as touched, is then queued for display on the standard screen. Then the doupdate()
    function takes care of the task of updating the screen. So the three refresh()
    functions actually work out to:


    ```

    pnoutrefresh(s1, 0, 0, 0, TALL-1, WIDE);

    doupdate();

    pnoutrefresh(s2, 0, 0, 0, WIDE+SPACER, TALL-1, WIDE*2+SPACER);

    doupdate();

    pnoutrefresh(s3, 0, 0, 0, WIDE*2+SPACER*2, TALL-1, WIDE*3+SPACER*2);

    doupdate();

    ```'
