    # addchstr()


    The addchstr() functions place a formatted string of text at the cursor’s position.
    The string of formatted text is not a char array, but an array of NCurses ctype
    characters, which includes both the character and its formatting information.


    # Man Page Formats


    ```

    int addchstr(const ctype *chstr, int n);

    int addchnstr(const ctype *chstr, int n);

    int addwchstr(WINDOW *win, const ctype *chstr);

    int addwnchstr(WINDOW *win, int y, int x, const ctype *chstr);

    int mvaddchstr(int y, int x, const ctype *chstr, int n);

    mvaddwnchstr(WINDOW *win, int y, int x, const ctype *chstr, int n);

    mvaddwchstr(WINDOW *win, int y, int x, const ctype *chstr, int n);

    mvaddwnchstr(WINDOW *win, int y, int x, const ctype *chstr, int n);

    ```


    # Format Reference


    chstr is an array of formatted text to be displayed on the screen. The array is
    composed of ctype characters, which are not char long int values. (The ctype character
    consists of a character plus attribute information.) n is used only in the addchnstr()
    functions. It is an int value, a variable or constant, that represents the maximum
    number of characters to write the screen. When n is less than the string’s length,
    then only n characters are displayed. When n is equal to -1, the entire string
    is displayed. (Also see Notes, below) When n is greater than the string’s length,
    garbage may be displayed on the screen.


    Refer to the mv, mvw, and w prefix elsewhere in this appendix for information
    on the win, y, and x arguments.


    # Return Value


    Upon success the addchstr() family of functions return integer constants OK or
    ERR upon success or failure, respectively.


    Normally, values are not checked with addchstr(); however, if you use the mv-
    or mvw- prefix versions of the functions, to ensure the return value should found
    the function accidentally try to move the cursor to an off-screen location.'
