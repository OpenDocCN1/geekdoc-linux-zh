  md: '# 414 Appendix A — NCurses Library Reference


    # Format Reference


    The raw() command activates raw mode.

    The norow() command restores cooked input mode (normal).


    # Return Value


    OK upon success, ERR upon failure.


    # Notes


    The raw mode disables any keyboard buffering done by the terminal, which in effect
    allows characters to be read more quickly. However, if this is all you''re after,
    I recommend using cbreak instead of raw().

    Raw mode specifically ignores the Interrupt, Quit, Suspend, Killchar, Erasechar,
    and flow controls. Knowing which keys are depends on on how your terminal is configured.
    Use the command stty -a to determine which keys your terminal uses. Table A-15
    lists common values.

    If your keyboard has a Break key, then raw mode may or may not affect it, depending
    on how the key is mapped


    # Table A-15: Keys and codes ignored in raw mode


    | KEY FUNCTION | NAME | KEY(S) | ASCII | FUNCTION |

    | --- | --- | --- | --- | --- |

    | Delayed Suspend | DSUSP | ^Y | 0x19 | Stops program when character is read (SIGTSTP)
    |

    | Erasechar | ERASE | ^? ^H | 0x7F | Back up and erase |

    | Flow control | STOP START | ^S ^Q | 0x13 0x11 | ^S pauses text output, ^Q restarts
    |

    | Interrupt | INTR | ^C | 0x03 | Halt the program (SIGINT) |

    | Killchar | KILL | ^U | 0x15 | Erases the input line, from cursor position to
    the line start |

    | Quit | QUIT | \\ | 0x1c | Halt the program (SIGQUIT) |

    | Suspend | SUSP | ^Z | 0x1a | Immediately stops program and sends it into the
    background (SIGTSTP) |'
