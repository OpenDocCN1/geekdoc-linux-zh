  md: '# Format Reference


    str indicates a char array big enough to hold text from the window, plus the terminating
    \0 character NCurses appends to the end of the string. The text is read from the
    cursor''s position to the end of the row.


    For the n functions, n represents the maximum number of characters to read and
    place into the str. When n is 0, less than 0, longer than the width of the window,
    or longer than the distance from the cursor to the end of the row, then the whole
    line is read — just like the instr() version of the function.


    Refer to the w, mw, and mvw entries elsewhere in this appendix for information
    on the win, y, and x arguments.


    # Return Value


    OK on success, ERR on failure. Refer to OK and ERR elsewhere in this appendix
    for additional and vital information.


    # Notes


    instr() does not move the cursor. instr() reads the entire line of text, saving
    blanks as the space character (\x20). The last character of the array is \0, not
    \n.


    This function reads only text characters from the window. To read ctypes characters,
    which include both text and formatting attributes, use the inchstr() function
    instead. See inchchstr().


    When control characters are put to the screen, NCurses displays them as two characters,
    ^ followed by the control character''s key code. When a function as instr() reads
    the screen, it returns the ^ and character code value, not the code that was originally
    put to the screen.


    # Examples


    ```

    winstr(beta,first_name, 32);

    ```


    In the statement, 32 characters of text are read from the cursor''s current location
    (to the right) in the window beta. The characters are stored in the string first_name.


    ```

    mwinstr(0,0,row[0]);

    ```


    The entire top row of the standard screen is read and stored into the string row[0].'
