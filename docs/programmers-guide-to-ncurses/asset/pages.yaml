    # Whither the Cursor?


    Knowing where the cursor doesn’t seem as popular or necessary a function as being
    able to move the cursor. But consider the case where a program involves full-screen
    user input. In example, it helps to have a function that tracks down where the
    booger is.

    The getxy() function reads the logical cursor location from the window win (stdscr
    for the standard screen) and puts its row and column positions into the variables
    y and x. As with the move() function, the home location 0,0 is the upper-left
    corner of the screen. (See Listing 4-7.)'
