  md: '# Appendix A ■ NCurses Library Reference 473


    # TABSIZE


    NCurses uses the value of TABSIZE to set the position of tab stops on the screen.
    These stops are used when the \t, or tab character is displayed; the cursor is
    advanced on the current line to the location of the next tab stop.


    # Man Page Format


    Not applicable.


    # Format Reference


    ```

    TABSIZE=n

    ```


    The TABSIZE value is set to equal n, which is an int value, either a variable
    or constant.

    TABSIZE could also be used in any function where an int value is required, such
    as:


    ```

    printf("Tab stops are set every %d characters.\n",TABSIZE);

    ```


    # Return Value


    TABSIZE is set to 8 by NCurses. The value is internal to the NCurses library,
    not in the NCURSES.H file.


    # Notes


    TABSIZE is a global variable. Resetting its value in a function does not keep
    the new value local to that function.

    TABSIZE is initially set to a value of 8, meaning that the \t character advances
    the cursor to the next column matching a multiple of 8:


    +   8, 16, 24, 32, 40, 48, 56, 64, 72


    and up to the far right column on the screen

    As a variable, the value of TABSIZE can be reset at any time in an NCurses program.
    Resetting TABSIZE affects tab positions from that point in the program onward.


    Tab characters cause the cursor to drop down to the next line on the display.
    That is, displaying a \t character after the last tab stop on a line causes the
    cursor to drop to the next line and display the character at the first tab stop
    on the following line, which is column 0.'
  merge: -1
  pgno: 495
