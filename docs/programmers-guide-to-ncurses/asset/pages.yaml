  md: '# CHAPTER

    9

    Subwindows


    Subwindows are strange and interesting creatures in NCurses. From one perspective,
    they are exactly what you imagine them to be: tiny windows within other windows.
    But at the same time, because of the way NCurses implements subwindows, they are
    not what they seem to be.


    I once struggled with the concept of subwindows in NCurses. In fact, much of the
    documentation on the Internet claims that subwindows are buggy and should be avoided.
    That isn''t exactly correct. With proper understanding, subwindows can be time-saving
    gizmos in NCurses, not to be avoided at all.


    # The Thing with Subwindows


    Subwindows are like real windows in NCurses that they share the same data structure.
    You use the same WINDOW variable to create a subwindow as you do a full window.
    NCurses functions that control or manipulate a window also control and manipulate
    subwindows (with a few exceptions). But a subwindow is not the same thing as a
    real window.


    The main difference between a subwindow and a real window is that subwindows share
    memory with a parent window. So when you put a character to a subwindow, you''re
    also placing that character into the parent window as well.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# 106 Chapter 9 Subwindows


    For example, in Figure 9-1, it appears that there are two windows on the screen.
    The smaller window is a subwindow, which has different color attributes from the
    parent. The parent window shows the text Hello, son, and the subwindow displays
    Hello, Dad. Ever also exists in the parent window. The memory is shared.


    If you were to change the text in the subwindow, you would also be changing adding
    text to the parent. Likewise, the parent window can change text text in the subwindow.
    This can be confusing and frustrating but only when you assume that a subwindow
    is a regular window. It is not.


    The best way to think of a subwindow is merely as a convenient way to reference
    a specific portion of the parent.


    Figure 9-2 illustrates an example of using subwindows to reference a region on
    the screen. The areas boxed at the bottom of the screen in Figure 9-2 contain
    information that is occasionally rewritten or updated. Rather than have to do
    a lot of complex cursor-positioning math, simply create a subwindow in the proper
    spot; then use that window as a reference to position the cursor. This is one
    example of how subwindows can be used to define regions of the screen instead
    of separate windows.


    As long as you consider the subwindow to be merely a reference to a specific portion
    of the parent, you''ll do well with subwindows. But when you believe the subwindow
    to be separate and unique, like a real window, you''ll get into all sorts of trouble.


    ![](img/b0e33f0db107583cf9267e27aa42f380_128_0.png)


    Figure 9-1: A glorious subwindow'
