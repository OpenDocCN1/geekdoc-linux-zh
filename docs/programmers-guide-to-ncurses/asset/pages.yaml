  md: '# APPENDIX


    # C


    # The ctypes


    In NCurses, ctypes is a special type of variable that holds a combination of character
    and attribute information. Those values are stored in a long int. (The ctypes
    variable in NCurses is typedef''d to a long int.)


    Functions using ctypes variables include: addch(), addchstr(), atroff(), attron(),
    and attrset(), plus a host of others. More importantly, each character position
    in an NCurses window stores a ctypes. As a ctypes, locations locations in window
    include both character and attribute information. Because of that, when characters
    are copied or moved in NCurses, the attribute information is copied and moved
    along with the character.


    The ctypes only describes characters; it doesn''t have to include attribute information.
    To add the attribute, use the ctypes in a function as addch(). The attribute can
    be applied by using a logical OR with the character to display. For example:


    ```

    addch(''E'' | A_BOLD);

    ```


    This function displays the E at the cursor''s current position, plus applies the
    bold text attribute to that character.


    Attributes for ctypes can also be assigned using any of the attribute functions,
    such as atroff(), attron(), or attrset().


    The names and values of NCurses text attributes are listed in Table C-1. Also
    refer to Table 3-1 for information on what each attribute does or how it controls
    the screen.'
  merge: -1
  pgno: 547
- img_proc: true
  md: '# 526 Appendix C ■ The ctype values


    Table C-1: Text attribute masking values


    | ATTRIBUTE NAME | VALUE (HEX) | ATTRIBUTE NAME | VALUE (HEX) |

    |---|---|---|--|

    | A_NORMAL | 0x00000000 | A_ALTSCHAR | 0x00400000 |

    | A_ATTRIBUTES | 0xFFFFFF | A_INVIS | 0x00800000 |

    | A_CHARTEXT | 0x00000FF0 | A_PROTECT | 0x01000000 |

    | A_COLOR | 0x00000F00 | A_HORIZONTAL | 0x02000000 |

    | A_STANDOUT | 0x00010000 | A_LEFT | 0x04000000 |

    | A_UNDERLINE | 0x00020000 | A_LOW | 0x08000000 |

    | A_REVERSE | 0x00400000 | A_RIGHT | 0x10000000 |

    | A_BLINK | 0x00080000 | A_TOP | 0x20000000 |

    | A_DIM | 0x00100000 | A_VERTICAL | 0x04000000 |

    | A_BOLD | 0x00200000 | | |


    Obviously, it''s better to use the attribute name than its value. To clarify things,
    Figure C-1 illustrates how the ctype variable is bitmapped to the various attributes.


    ![](img/b0e33f0db107583cf9267e27aa42f380_548_0.png)


    Figure C-1: The ctype bitmap


    Note how the A_ATTRIBUTES and A_CHARTEXT attributes (Table C-1) are used in the
    bitmap. They can effectively mask out either the character or attribute branch
    of the ctype variable.'
