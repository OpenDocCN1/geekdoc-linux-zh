    # qiflush()


    The qiflush() and noqiflush() function control whether or not the keyboard input
    buffer is flushed when the Interrupt, Quit, or Suspend keys are used.


    # Man Page Format


    ```

    void qiflush(void);

    void noqiflush(void);

    ```


    # Format Reference


    The functions take no arguments.

    The qiflush() function directs NCurses to flush any text waiting in the input
    queue when the Interrupt, Quit, or Suspend keys are pressed.

    The noqiflush() function directs NCurses to retain whatever text is in the buffer,
    which is typically flushed out at the next command prompt.


    # Return Value


    OK upon success; ERR on failure.'
