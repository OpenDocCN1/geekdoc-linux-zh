  md: 'Note that the getwin() function both reads the window''s data from disk and
    there is no need to use newwin() before getwin() to create the window. It does
    not, however, update the curscr; you still must use a wrefresh() command for that.


    The window is restored to the same size, location, and appearance as before. The
    cursor position is also restored. Any attributes are also restored, though if
    the specific COLOR_PAIR associated with the window, or the window’s text, is redefined
    as another color, that other color is used. (Attributes include only a COLOR_PAIR
    value, not the color pairs assigned to that value.)


    After being restored, your code can continue to use the window, write to it, manipulate
    it, and remove it if necessary.'
