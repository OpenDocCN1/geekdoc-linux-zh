  md: '# scrollok()


    The scrollok() function enables scrolling in a window.


    # Man Page Format


    ```

    int scrollok(WINDOW *win, bool bf);

    ```


    # Format Reference


    win is the name of a WINDOW variable representing a window created in your code.

    Bf is a Boolean value, either TRUE or FALSE as defined in NCURSES.H. When TRUE,
    scrolling for window min is activated. FALSE is the default condition, meaning
    that the window isn''t scrolling.


    # Return Value


    OK on success; ERR on failure.


    # Notes


    The scrollok() function enables scrolling. That means any text displayed after
    the last line, or a newline or line feed on the last line, pops text up by one
    row in the window. The top row of text is lost, and a new blank row appears on
    the bottom to allow for the next text.

    The scrollok() setting is inherited by subwindows. If you set scrollok() TRUE
    for window, then all subwindows will also have the ability to scroll. Otherwise,
    new windows and new subwindows start out with scrollok() disabled.

    Text can be manually scrolled using the scroll() or scrl() functions. Pads cannot
    be scrolled. Trying to apply scrollok() to a pad returns ERR.


    # Example


    ```

    scrollok(main, TRUE);

    ```


    The statement enables scrolling for the window main.'
