  md: '# 396 Appendix A ■ NCurses Library Reference


    # Man Page Format


    ```

    int pair_content(short pair, short *f, short *b);

    ```


    # Format Reference


    pair is a short int value representing a color pair number. Values range from
    0 through the value of the COLOR_PAIRS constant, minus 1.


    +   - f and b are addresses of short int variables to hold the color value of
    the text foreground and background colors for pair, respectively. Values returned
    for foreground or background range from 0 through the value returned by COLORS,
    minus 1.


    # Return Value


    The function returns OK for success or ERR for failure.


    # Notes


    The start_color() function must be issued first in a program, or the pair_content()
    function will return ERR.


    It is not necessary that pair represent a defined color pair. When called with
    an undefined color pair value, pair_content() returns zero for both foreground
    and background colors.


    Colors 0 through 7 are defined as constants in NCURSES.H. See COLORS elsewhere
    in this appendix for the values.


    # Examples


    ```

    pair_content(3, fg, bg);

    ```


    This statement reads the color attributes assigned to color pair 3. The foreground
    value is stored in the location indicated by pointer variable fg, and the background
    value is stored in the location indicated by pointer variable bg. It''s assumed
    that the pointer variables are initialized earlier in the code.


    ```

    pair_content(pair, &fore, &back);

    ```


    Here, the color values for color pair indicated by variable pair are stored in
    the locations for variables fore and back.'
