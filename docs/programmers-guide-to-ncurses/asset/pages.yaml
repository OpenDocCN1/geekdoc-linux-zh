  md: '# Scroll Away


    Enabling scrolling in NCurses is easy, thanks to the scrollok() function:


    ```

    scrollok(win,TRUE);

    ```


    The scroll() function sets or resets the ability of a window to scroll. The window
    is specified as win, and the second argument is either TRUE or FALSE to turn scrolling
    on or off (respectively) for that window.

    Add the following at line 23:


    ```

    scrollok(lister,TRUE);

    ```


    This time the text continues to display as the window scrolls its contents, allowing
    for the new text.

    If your text is not long enough to scroll the window, then choose another file.

    Scrolling affects the location of the window''s cursor. When a character is placed
    at the bottom right position in a window, scrolling the text up one line (the
    scroll), returns the cursor to the start of the bottom line in the window, column
    zero.


    # The old man scroll


    Whether a window has its scrolling attribute or not, you can manually scroll the
    text in a window by using the scroll() function:


    ```

    scroll(win)

    ```


    The scroll() function scrolls text in the window win. This works only if the window
