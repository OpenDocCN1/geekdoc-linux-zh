    eat.23 This kind of personal ethics of feeling is solipsistic and cannot ground
    the kind of claims for universality needed for prescriptive moral judgments. It
    is not really different from Hutchenson''s moral sense theory. Protagoras'' individual
    moral agent can only say: I feel, therefore I am right. Unfortunately, so is everyone;
    or no one is.


    The discourse of skepticism in European thought all disappeared after Sextus Empiricus,
    but was revived in the sixteenth century with the rediscovery of his writings.
    It appears in Erasmus and most prominently in Montaigne, had Sextus''s maxims
    carved on his rafters. It simmered on into the seventeenth century with Charron''s
    secularizing On Wisdom (1601), which touched Montaigne as its Muse, until it had
    finally become alarming once more for Descartes to take up Plato''s cudgels and
    again try to establish the conditions for knowledge outside his grasp.24 He said
    "Cogito, ergo sum" as the first principle in doing so; and the notion of clear
    and distinct ideas—innate ideas that could not be doubted—were his proofs. And
    Descartes believed that he had succeeded in his task: that he was the first philosopher
    in history, as he said, to refute "the Skeptics."25 Since the skeptical claim
    had always been where sense-based knowledge was unreliable, apodictic certainty
    and a priori truths were unassailable.


    The reaction from empiricists to his claim for innate ideas found expression in
    a restatement of Epicureanism by Gassendi in Syntagma Philosophicum, published
    posthumously in 1658, and in 1699, which followed Gassendi''s work closely and
    quickly surpassed it in influence. Gassendi offered the materialist response to
    Descartes, discrediting once again the powers of reason and reaffirming the Epicurean
    credo from Lucretius that, Nih est in intellectu quod prius fuerit in sensu The
    senses are absolutely reliable and all tell we can know. Gassendi needed to counter
    the skeptic''s point that reliance on sense equated to subjectivism, and he did
    so by rehearsing the Ten Tropes of Sextus Empiricus, then offering his solution.
    In chapter 14 of Outlines of Pyrrhonism, Sextus Empiricus goes through ten instances
    of how sense perception cannot produce: the same object produces impressions in
    different animals; the same object produces impressions in the same man at different
    times, and in different circumstances; the senses disagree among themselves: something
    like perfume smells good but tastes bad; and so on. Gassendi counters with the
    pragmatic solution of accepting the truth that best fits the occasion.26'
