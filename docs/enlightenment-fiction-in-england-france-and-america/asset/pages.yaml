  md: '# Skepticism, Sensibility, and the Novel


    track. Robert Mayer writes that scholars of the novel in the last decade or so
    “have tended to see novelistic discourse in relation to, or as part of, larger
    discursive formations.”—This is a relational than causal model that is particularly
    well-suited to the interaction of the skeptical and realist discourse systems
    I want to describe.


    The larger discussion is the discourse on knowledge in the eighteenth century
    as a whole—questions and answers about the sources and formation of knowledge,
    the criteria for truth, the ethics and aesthetics of knowledge, and so on. Bakhtin’s
    place in this conversation has not been well understood. Bakhtin popularized the
    novel as a kind of collection of voices, mute in itself, acting as host to a variety
    of others. Indeed, in the eighteenth century the novel acts often enough as a
    kind of hostboard to the discourse of skepticism itself, to sentimentalism, and
    even to attacks against its own practice. But novels also contain their own comments
    on that practice—their own discourse on the novel, so to speak—and how it contributes
    to both epistemology and ethics. They host, that is to say, a self-reflective
    meditation on their own practice; and it is one, I would suggest, which contradicts
    the language of skepticism and sentiment. Let me begin by expanding first on what
    the discourse of skepticism and its sentimental adjunct looked like in the eighteenth
    century, then discuss in more detail the novelistic response. I will conclude
    with a summary of how my readings bear on the topic.


    The first question to answer is, was in fact an epistemological crisis in the
    eighteenth century? Surely the phrase overstates the case in a century with a
    so-called Age of Reason and an Enlightenment. Berkeley, after all, was never taken
    seriously, and Hume’s Treatise, as he tells us, dead-born from the press. Did
    Hume feel there was any crisis, if we are to judge by his behavior after philosophizing,
    when he would go happily to his diner and a game of backgammon. The answer to
    this question must take us into a brief overview of skepticism itself.


    Skepticism is a kind of cognitive virus that works on a sliding scale of seriousness.
    McKeon and Damrosch in comments (see n. 1) are concerned with the least painful
    manifestation, where we doubt the factuality of the Countess’s memoirs, for example,
    or romance adventures like the slaying of dragons. This is something I would call
    first-order skepticism: we are skeptical of what people tell us until we see some
    empirical evidence for what they are claiming. This is the sort of skepticism
    McKeon, for instance, is concerned with his dialectics; this every-day, ordinary-language
    skepticism is like an epistemological defoliant that'
