    Godwin’s novel is also important for the way it introduces the concept of justice
    to the configuration we have been examining. In skeptical times, it is just as
    much as ethics that suffers from the delegimation of reason; so Godwin’s attempt
    to eliminate a particularly unreasonable genre of skeptical discourse (romance)
    in favor of the novel is an aesthetic way of articulating justice. His Jacobian
    agenda fits well in the formal aspect of the novel.


    We can see the programmatic nature of the configuration in the title where “things
    as they are” defines the real, and “adventures” signals romance. The duality is
    also present in the two endings Godwin wrote: the original manuscript editing
