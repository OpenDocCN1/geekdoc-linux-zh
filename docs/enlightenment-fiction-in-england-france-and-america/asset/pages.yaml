  md: 'ond-order skepticism has its roots in Protagoras and Epicurus. Protagoras claimed
    that because all knowledge begins in sensation, and sense perceptions are at different
    moments and for different people, everyone is right at all times. A hundred years
    later Epicurus insisted on the absolute dominion and reliability of the senses.
    Knowledge was possible, but it was the knowledge of the senses. Sensation, empiricism,
    and materialism are all forms of a second-order skepticism that grounds knowledge
    in the senses. Reason is a function of the senses, if not a sense itself, and
    there is therefore heavily circumscribed in its powers. This was the type of skepticism
    Locke and Christian skeptics like Montaigne gave voice to in an attempt to establish
    the grounds of faith as suprational. By circumscribing the powers of human reason,
    one establishes the domain of what exceeds it. One might look at this level of
    skepticism as reason''s ultimate victory: the self-effacing illumination of its
    own limits.¹16 This is Locke''s hope in his Essay Concerning Human Understanding,
    and it is when Philo has in mind in Hume''s Dialogues Concerning Natural Religion
    when he says to Cleanthes: To be a philosophical skeptic is, in a man of letters,
    the first and most essential step towards being a sound, believing Christian.¹⁷
    Necessary to say, this was not the conclusion that materialists like Diderot or
    Epicureans like Lucretius came to, but the sensationist basis of the category
    makes them members of the same club.


    Nor Hume be too closely identified with Philo''s second-order skepticism; his
    own version often has more in common with Pyrrhonism, the third and most corrosive
    form of skepticism. We owe the beginnings of this more extreme third-order skeptical
    strain to the logical development of Protorean thought into pure subjectivism
    and to the flux theory of Heraclitus. In Protagoras the claim that because we
    all have our own sense impressions, and since they are foundational, we are all
    always right, employs the word right of any universality and hence of any real
    meaning, and does the same to knowledge and truth, all of which demand something
    than personal voicing. So in effect no one is right. This is what Heraclitus said.
    For Heraclitus, everything is in flux, so any predicative assertion about the
    world is instantly outdated and wrong. For Heraclitus we are all wrong the time.
    Plato saw how serious a position this was. He believed that Protagoras and Heraclitus
    were essentially the same thing, and he devotes a large part of his Theaetus to
    proving it and refuting them.


    Aristippus, who studied with Socrates and founded the Cyrenaic school, continued
    nonetheless to insist on the epistemological primacy of feel-'
