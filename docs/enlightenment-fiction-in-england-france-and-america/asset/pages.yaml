  md: '# 4 Enlightenment Fiction in England, France, and America


    clears the camouflage and weeds. It is a comfortable part of the discourse of
    science and reason, as it was in the Enlightenment. We doubt until Newton shows
    us his proofs, doubt miracles, or the existence of God, as the philosophers did,
    all in the name of Reason.⁸ It was this posit brand of skepticism that many eighteenth-century
    churchmen complained about when they “rebuked the spirit of the age,” as Joseph
    Milner the ecclesiastical historian did at the end of the century, “one of reasoning
    to excess.”—⁹ Joseph Butler had in the “Advertisement” to Its Analogy of Religion
    (1736) that Christianity had already come to be seen as “fictitious” by people
    of supposed discernment.”¹⁰ For Butler it is a matter of right and wrong and getting
    things straight. The existence of truth is not in question. Tillleston does not
    bother to distinguish when he generalizes that Butler’s aim was “saving man from
    the skeptical philosophers” per se.¹¹ James Beatrice also identified skepticism
    in general as the problem as 1770, titling the reputation of Hume The Nature and
    Immutability of Truth in Opposition to Sophistry and Scepticism. “England’s divine,”
    as B. W. Young puts it, “were aware of an intellectual tendency which was especially
    characteristic of their knowing age,” and this was the tendency no longer to take
    the claims of religion on faith.¹² In this least serious of its manifestations,
    skepticism throws doubt on a limited number of things—granted, very important,
    even fundamental things—but accepts that much else is true.


    Scepticism of course, in whatever form, was not the only factor in the falling
    out of religious observances in the century; much of the trouble came from skeptics
    from sects but from a general difference in matters of religion under George I
    and from feuds within the church itself; from corrupt clergy and an ecclesiastical
    “system,” as J. H. Overton puts it, that “had become mechanical and dead.”¹³ And
    with this, the age was hardly atheistic. As Johnson noted, there were few fields
    identified early on as a threat.¹⁴ Still felt Berkeley’s view that their age was
    one of doubt and relativism in his first years. Berkeley targeted “Scepticism”
    and “Atheism” as a common enemy in his 1710 Treatise Concerning the Principles
    of Human Knowledge; he aimed again at “Skeptics and Atheists” in his 1713 Three
    Dialogues Between Hylas and Philonous.¹⁵


    But something a little more serious was happening in the century, and it has to
    do with what I would call second-order skepticism—a more unstable, philosophical
    and dangerous hybrid than the everyday strain. Sec-'
