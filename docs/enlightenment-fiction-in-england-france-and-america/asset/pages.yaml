  md: '# Conclusion


    Ends and the Means to Avoid Them


    There are good reasons why scholarship on the eighteenth-century novel in recent
    years has become characterized by a strong interest in material, cultural historylor.
    A novel, as J. Paul Hunter writes, never comes into the world “altogether naked,
    new, or alone”; it comes with “its past, its author, the power of its cultural
    consciousness, its referentiality to some larger world of thing and event, and
    its interaction with readers who know and care about some of these extratextual
    matters.” The “larger extratextual world” of course contains more things and events—it
    also contains ideas that readers also care about and which are as important to
    an understanding of novels as they were to the writing of them, as important,
    at least, as an awareness of shipping lanes, printing practices, or divorce laws.
    The latter are extremely important indeed to cultural historians of the novel—the
    pearls of new historicism, to so speak; but ideas too are part of history. In
    the form of different philosophies and aesthetic theories, they are—to borrow
    a Henry James metaphor—the string pearls are stung on.


    The idea that I have tried to put forward here with regard to the rise in popularity
    of British and French novels in the second half of the eighteenth century belongs
    first and foremost to the Duc de La Rochefou, who inherited it from Machiavelli.
    In order to survive at the French court in the mid-seventeenth century Rochefoucauld
