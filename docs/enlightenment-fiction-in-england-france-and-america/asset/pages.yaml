  md: '# Conclusion 143


    notes, the large number of representations in the century of women reading, not
    only in novels but in paintings, shows they were perceived quite clearly as the
    main consumers of fiction. But none of this negates the possibility I have been
    arguing for that the sudden rise in the popularity of novels in the eighteenth
    century had much to do with the fact that they worked against the epistemological
    crisis of the age in the way I have been describing. A climate of antifundamentalism
    fosters “unpredictability,” so it makes sense that a form that resolves it, as
    Heath points out, should be popular, especially with women.


    I have also treated the literature of sensibility in the eighteenth century as
    a manifestation of skepticism. Novels of sentiment and sensibility became in the
    later eighteenth century with women, but this too was hardly through some sort
    of organic connection or necessity. This identification, as we know, restrictive
    for women as it was socially and politically advantageous for men, men controlled
    publishing. The change in the writing of Eliza Haywood from vice to virtue is
    a good example of how this formed consensus worked. The switch from Love in Excess
    (1719) or Anti-Pamela (1741) to the conventional History of Miss Betsy Thoughtless
    (1751) can be understood as enforced by expectations. It will always serve the
    interests of the hereditary proprietors of the discourse to keep women attached
    to a type of discourse that defines itself in terms of the heart rather than the
    head. Women like Mary Wollstonecraft eventually reacted against this, but not
    before the connection had been all natural. Sensibility and sentiment are part
    of the discourse of skepticism, so the women-sentiment connection ties down women
    writers and readers to the very failure of knowledge that their hunger for novels
    aimed to remedy.


