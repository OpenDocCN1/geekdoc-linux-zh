  md: '# Skepticism, Sensibility, and the Novel 7


    but like Montaigne and Diderot he was much opinionated, active, and committed
    to causes to be worthy of the name. Bayle was an important influence on Hume,
    but Hume was the better Pyrrhonist.22


    Hume himself contributed to the misuse of the word Pyrrhonism. Montaigne and Bayle
    used it loosely for second-order skepticism; Hume, for his part, understood Pyrrhonism
    as a kind of madness. “The great subverter of Pyrrhonism,” he writes in An Enquiry
    Concerning Human Understanding, “is action, and employment, and the occupations
    of common life”—as if, Pyrro and Sextus had believed rather than doubted their
    own conclusions and chose to live in caves (158–59). A Pyrrhonian, Hume writes,
    must acknowledge “that all human life must perish, were his principles universally
    and steadily to prevail. All action would immediately cease; and men remain in
    a total lethargy” (160). By remaining speechless, unmoving, in a state of lethargy
    would require the sort of conviction that Pyrrhonism renders impossible. In the
    Treatise Hume refers as “that fantastic sect,” but the section that contains the
    remark is itself a perfect example of Pyrrhonism. Here, in part 4 of book 1, Hume
    first out the standard skeptical arguments on the inevitable futility of judgments,
    then states “neither I, nor any other person was ever sincerely and constantly
    of that opinion” (183). No good Pyrrhonist could be devoted to that opinion—or
    any other. That is what the suspension of judgment invokes.


    When Hume begins speaking the language of feeling, however, he shifts into a “mitigated”
    or what he calls “academical” second-order skepticism that is more in tune with
    Protagoras and the Epicureans. He does so in the Treatise he dismisses reason
    as a specific faculty and source of conviction and replaces it, like Protagoras,
    with feeling. Hume is the best example in the century of the symbiotic relationship
    of the discourse of feeling and that of skepticism. “Belief is more properly an
    act of the sensitive, than of the cognitive part of our natures” (183). This is
    Hume “homme de sensibilité” speaking. In the Treatise Hume clearly prioritizes
    Nature over reason. “Nature, by absolute and uncontrollable necessity determines
    us to judge as well as to breathe and feel” (183). Reason becomes a sense. When
    Hume speaks of morality in book 3, feeling is fully in charge. Things change slightly
    in the Enquiry Concerning the Principles of Morals, however, where reason is rewired,
    at lower wages, to establish what action is useful and what pernicious. But only
    sentiment determines the choices we make in terms of actions. Reason sets the
    table, so to speak, but sentiment tells us what to'
