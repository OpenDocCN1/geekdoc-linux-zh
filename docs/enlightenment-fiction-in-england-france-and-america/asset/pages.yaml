    Richardson shared Pope''s view on the connection, and he both expanded and fictionalized
    it. The relationship of mimetic art to knowledge was clearly a more pressing concern
    for Richardson, for a variety of reasons—both religious and secular—where the
    one is obviously that he was a novelist. For many, the new form of fiction was
    thus a suspect quantity, looked on by its critics as something low, something
    along the lines of the Smithfield entertainments, a morally dubious affair that
    had set camp somewhere between history and romance. In writing fiction that aimed
    at verisimilitude Richardson was in a sense obliged to present suspicion, and
    he does so by making his Machiavellian artificees blatantly available for the
    kind of antitheatrical attacks familiar since Collier. But then, as a practitioner
