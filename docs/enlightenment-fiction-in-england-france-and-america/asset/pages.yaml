    When one puts the pieces together what emerges in Sade is the picture of a powerful
    discourse of skepticism—pure sensation, materialism, subjectivity, solipsism,
    the failure of reason and logic—located firmly inside the language, not of the
    novel, but of romance. Sade insists that he is imitating nature in his tableaux,
    but their small worlds are implausible as arguments. As Maurice Blanchot puts
    it: “There is a lacuna in his thought, a lack, a madness.” Despite his obsession
    with dissations, Sade’s theories are dominated by “irrational powers.”228 His
    position on religion, for instance, is since there is evil in the world, God is
    responsible for it; but since it is contradictory to believe that a god who is
    all-good can be responsible for evil.229 The dissations of the libertines are
    always examples of such “irrational powers.”


    Pierre Krossowski likens Sade’s fin de siècle mind to a ripened, decomposing fruit
    “that is detaching itself from the tree of society.” It will fall, Krossowski
    says, because it is an “end, not a beginning, the end of a long evolution.”30
    The “long evolution” in question is the evolution in the preceding hundred years
