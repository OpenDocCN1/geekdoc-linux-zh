  md: '# Skepticism, Sensibility, and the Novel


    This book is an examination of the relationship between two eighteenth-century
    intellectual events: the rise in popularity of the novel and the rise of philosophical
    skepticism. I say “rise in popularity” rather than “rise of the novel” because
    I want to focus on that popularity and suggest that one reason for it was the
    novel’s perceived ability to act as an antidote to the anxieties and uncertainties
    of skepticism—to alleviate what has been called the “epistemological crisis” in
    skepticism. Crisis is a strong word, since there has probably never been a time
    in the history of Western thought when the status of knowledge was not an issue
    to one degree or another. I would suggest, however, that there are three particular
    periods when philosophical skepticism casts an especially long shadow: Classical
    Greece, the British and French seventeenth and eighteenth centuries, and our own
    age, which in the last thirty years has experienced its own epistemological crisis
    under the banners of deconstruction and post-Nietzschean antifoundational. Indeed,
    part of my motivation for writing this study is to suggest that the tenacity of
    literary realism today has something to do with its operating same way against
    skepticism as it did in the eighteenth century. I am not suggesting that wherever
    and whenever history skepticism has been a problem one should expect to see in
    forms of aesthetic realism arise, but I want to suggest that the popularity of
    the literary form in the age of Hume is no coincidence.


    We have no surveys for the early period that might tell us what readers thought
    they were getting out of novels, but we do have them for our own day. Shirley
    Brice Heath, the Stanford linguist, conducted one such survey in the 1980s and
    received some responses that stress what I will argue on behalf of the cognitive
    and ethical value of novels. Heath went around polling readers in “enforced transition
    zones” such as airports, subways, and resorts who were reading “substantive works
    of fiction” and asked them what they were getting out of these books. The readers
    told her that'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Enlightenment Fiction in England, France, and America


    what they liked was the way the novels presented unpredictability and its resolution.
    Heath found that most of them had had some experience with unpredictability in
    their own personal lives. In the eighteenth century, most buyers and readers of
    novels today are women. Heath comments: “There is a certain predictability to
    literature’s unpredictability. . . and that predictability is what readers tell
    me they hang onto.” This is the cognitive, Kantian aspect of literary realism—its
    purposiveness. Heath cites a typical response that makes the ethics connection:
    “Reading enables me to maintain a sense of something substantive—my ethical integrity,
    my intellectual integrity.”—4 I would suggest that novels probably produced much
    the same sort of Kantian effects in their readers, men as well as women, in the
    eighteenth century. The discourse on the novel in the eighteenth century, when
    it is positive, almost always takes this approach, linking the novel’s cognitive
    or epistemological valence to its ethical and moral power.


    Given the importance of the eighteenth century, and the discourse of and on the
    novel it is surprising that so little has been written out how the two were articulated—not
    only given voice but worked out together, as I want to do, like sets of interlocking
    muscles. Michael McKeon’s Origins of the English Novel 1600–1740 and Eve Tavor’s
    Scepticism, Society and the Eighteenth-Century Novel both appeared in 1987, but
    they take a Marxian approach to literature that rules out the formal, aesthetic
    agency of literary realism that I want to examine. They make the novel belated,
    a consequence of precedent base issues of “categorical instability” (McKeon),
    or a symptom of epistemological Angst (Tavor). At best, McKeon sees the novel
    as a mediator of the “change in attitudes” in the century toward problems of truth
    and virtue, whereas Tavor, for her part, sees a direct cause and effect relation
    between base and superstructure where scepticism is the cause and the novel is
    the effect. Neither grant fiction of social power. As for sensibility and its
    cult, I would modestly propose that the language of feeling is the primary manifestation
    of scepticism in the eighteenth century. I will devote considerable time to describing
    its literary appearance, with special emphasis on Sterne, Diderot, Radcliffe,
    and Sade.


    In terms of methodology I will borrow from the language of discourse analysis
    and systems to discuss scepticism and the novel as two systems of expression operating
    within the larger intellectual discussion of the century—two dissonant language
    games that are part of the polyphony rather than the symphony of the eighteenth-century
    sound'
