    the stage, makes it clear that he sees knowledge and art as a proper pair—mimetic
    art that makes sense is not, for Pope, a symptom of the encroaching darkness.
    To the contrary, he characterizes it as a form of enlightenment. The Dunciad was
    certainly not intended as a manifesto for the novel, but the connection between
    knowledge and realism could well serve as one.


