    Kant understood this well. When reason, and hence ethics, are erased, novels will
    give pleasure because of their high degree of organization. The reader will derive
    pleasure from the artwork’s “purposiveness” as Kant calls it, and respond to the
    ethical nature of form-giving. Georg Lukács writes that realistic fiction pleases
    not because it is a form of escapism, which in a way it always is; or because
    it mirrors the dissonance of its world, which it does; or because the stories
    teach us lessons; but because “in the novel... the ethical intention... is visible
    in the creation of every detail.” The key word here is structural. Lukács does
    not mean that the author’s ethical intention informs the novel, which of course
    it must. What he means by saying that the “ethical intention” is in the “detail”
    and structure is formally structuring or narrating a world that is an essentially
    ethical act. A realistic novel may promote good or virtue, make a reader better
    or worse person, but it is always appeal to order, to a set of shared rules, always
    call for consensus, for mutual understanding. As such is it in the pure sense
