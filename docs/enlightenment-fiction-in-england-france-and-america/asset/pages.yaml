    Rochefcauld’s idea—that deception is a form of survival—is one that I believe
    worked for the popularity of the novel in the latter half of the eighteenth century
    and probably continues to work in its favor today. The novel is a deception that
    outmaneuvers skepticism by asking for the suspension of belief; it promotes, demands
    belief, and did so in the eighteenth century at a time when belief itself was
    under siege. It was a deception that was looked on with suspicion at the time
    even by those who practiced it as a literary art. Richardson was ambivalent about
    it and only reluctantly endorsed it, as we have seen. But he was clearly aware
    of its necessity, especially when it came to saving his heroines. More direct
    praise is evident in the work of Lacdos, Godwin, and Brown, where art is given
    a literary face and directly associated with intelligence.


    In the preceding chapters we looked at how the discourse of the novel was represented
    in the eighteenth century, from Pope to Sade, in various literary forms, and how
    it was set against different manifestations and representations of skepticism.
    It should now be clear that these systems of expression stand over and against
    one another, and that the novel works against skepticism in a variety of ways.
    In one very simple way counters Pope’s “Universal Darkness” by offering a secondorder
    reality that is by definition immune to real-world doubt. There was indeed an
    epistemological crisis in world that was the second half of the eighteenth century,
    so a novel reality where such a crisis was impossible had attractions. The word
    *crisis* in Greek means both judgment and separation. In a skeptical climate judgment
    will enforce exist, but it will be a dissociated, fractured judgment without any
    consensus or basis in a singular truth, so *crisis* is an apt word to describe
    the condition of the episteme at the time. The vacuum created by the great delegitimization
    of reason was filled by sensationism, and in literature by that replaced *Vernunft*
    [understanding] with *Herz* [heart] as a basis for that judgment. The remedial
    role of realism in this crisis was clear to Pope, who early on equated the failure
    of knowledge to a failure of realism on the stage, and by the end of the century
    was even clearer to Godwin and Brown, who came as close as any in the century
    to allegorizing the novelist in encounters with incarnations, respectively, of
    romance and sensuous emotion.'
