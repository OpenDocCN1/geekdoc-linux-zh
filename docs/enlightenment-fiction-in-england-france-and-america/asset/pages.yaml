    ing—in the next century. However, it is with Pyrrho of Elis (360–272 B.C.E.),
    and later, Sextus Empiricus (ca. 200 C.E.), that the third level of skepticism
    is usually identified. From this perspective, first- and second-order strains
    look almost benign—what Hume ends up calling “mitigated skepticism.” Pyrrhonism
    is the last word in disbelief that it denies our ability to make the determinations
    necessary to doubt. The Pyrrhon believes that there is insufficient evidence to
    determine that anything is true or untrue, including sense knowledge and of course
    the Pyrrhon''s own claim that this is the case. Pyrrhonism tells us that we cannot
    say, since all knowledge depends on sense impressions, we are all right all the
    time, or that we are all wrong, since both claims rest on the same illusory ground
    and are equally untenable. Stanley Cavell calls Pyrrhonism “the recoil of deman
    reason.” His classic Pyrrhonic victory is the self-annihilating assertion of the
    Liar''s Paradox that All states—are untrue. The result of this ultimate doubt,
    according to the followers of Pyrrho and Sextus Empiricus, is peace of mind (ataraxia)—the
    peace of mind that follows the suspension of judgment. Pyrrhonism is thus politically
    conservative. Sextus Empiricus advises that since nothing is known for certain,
    the best thing to do is to fall back on tradition and custom.


    To come back to Hume for a moment, and the question of whether really was a skeptical
    crisis of belief in the century, we should remember that an epistemological crisis
    that had anything to do with Pyrrhonian doubt would not have any overt consequences.
    Hume’s famous good humor and geniality, along with his politics, seem very much
    in keeping with a Pyrrhonian ataraxia—just what was needed to put the “bon” in
    bon David. Pyrrhonism does not produce crises or change the world or the way we
    live. Some of the Enlightenment philosophers, including Diderot, were unhappy
    with Hume in the 1760s and saw him as a great reactionary. He was noncommittal,
    choosing to follow the customary way, and eventually turned to other pursuits
    than philosophy. Paradoxically, Hume’s praise of common life is sometimes cited
    as proof that he was not a Pyrrhonist, as if Pyrrho and Sextus Empiricus had been
    so convinced of the truth of their philosophy that they had retired from the world.
    This is a misconception. Pyrrhonism leaves everything as it is, and is nothing
    not a philosophy of common life. The same kind of misprison of the specific meaning
    of Pyrrhonism is often read into Montaigne—and into Bayle, the great skeptic at
    the end of the seventeenth century who was so strong an influence on Diderot.
    Bayle thought of himself as a Pyrrhonist,'
