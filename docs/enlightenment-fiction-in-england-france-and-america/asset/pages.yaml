  md: 'Another difference lies in Richardson''s deeper religious objections to artifice.
    Defoe had an inward, Puritan understanding of fable—of the essential relationship
    of God''s plot to Man''s stories, as Leopold Damrosch puts it; in Richardson''s
    Anglican mind this palimpsest relationship is hopelessly corrupt. Where Defoe
    always has Providence shadowing the fable so that we are constantly in front of
    the question of the relationship of the protagonist''s quest, whatever it may
    be, to some of higher progress, in Richardson this intersection of low and high
    is fraught with danger. One might say that for Richardson this relationship, or
    its fraught existence, constituted his principal anxiety—the anguish of knowing
    whose stories are indeed benign, who are not, and which will triumph.


    This particular articulation of truth and deceit has a social as well as private
    importance for Richardson. He shared Pope''s critical attitude towards the social,
    intellectual darkness of bad theater, for example. Like Pope, he strove to fit
    art into the head Socratic linking knowledge to virtue and error—art which should
    edify, instruct, and improve, and so on. While Pope is close to Jeremy Collier
    in his stage antipathies, Richardson expresses a deeper anxiety over mimetic art,
    as he practices, and undoubtedly he practices it. The discourse of antitheatricalism
