    # 5.2.1 Navigating the Control Panels


    You perform most Windows NT/2000/XP administration by clicking, Control Panel
    items, located off the Start • Settings menu. Although you''ll have no trouble
    clicking, finding all of the drivers can be a challenge, and some configuration
    files are distributed throughout the system.


    There are a lot of control panels, and they differ between NT and 2000/XP. For
    example, you''ll find drives under SCSI Adapters in Windows NT and Device Manager
    in Windows 2000 and XP.


    If you have to work with NT and 2000/XP at the same time, it can help to remember
    which control panels pertain to low-level hardware and pertain to higher-level
    protocols. For example, the Internet settings won''t tell you anything about your
    actual network interfaces; you have to look in Network or the Windows 2000/XP
    Device Manager for that, as discussed later.


    Windows NT''s Devices panel gives overview of all device drivers that your system
    knows about (Windows has probably disabled most of them because you haven''t installed
    them in your system).This panel is useful for looking at all of your drivers at
