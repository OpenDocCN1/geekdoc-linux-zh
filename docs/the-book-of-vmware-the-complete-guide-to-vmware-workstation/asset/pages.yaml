    CD-ROM/DVD-ROM


    You can configure a CD–ROM device as IDE (ATAPI) or SCSI. Keep in mind that ATAPI
    CD–ROM drives enjoy the best support in most guest operating systems.


    When you install or modify a drive, a Windows host provides you with a list of
    CD–ROM drives to choose from; under a Linux host, you must enter the drive file
    for the guest system Name box. For an ATAPI drive, the name is the same as the
