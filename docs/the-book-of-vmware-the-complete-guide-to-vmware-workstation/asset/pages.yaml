  md: '# 3.10 VMware Linux Executables


    Aside from the main vmware binary, there are a number of other programs in the
    bin directory where you installed VMware.


    # vmware-config.pl


    This program is used to reconfigure VMware (for example, if you upgrade your Linux
    kernel). It will ask you the same questions it did when you first installed Workstation.


    # vmware-uninstall.pl


    This program completely removes VMware Workstation from your system.


    # vmware-wizard


    This is the VMware Configuration Wizard (see Chapter 4). You should run it from
    VMware, not from the command line.


    # vmware-nmbd, vmware-smbd, vmware-smpd, vmware-smbpasswd.bin


    These programs are part of the SAMBA distribution that comes with VMware for use
    with host-only networking. (See Chapter 10 for more information.)


    # vmware-mount.pl, vmware-mount-loop


    The vmware-mount.pl program allows you to attach a VMware virtual disk to your
    host system. (See section 11.5 for more information. The vmware-mount.pl program
    uses vmware-loop.)


    # vmnet-bridge, vmnet-dhcpd, vmnet-nat, vmnet-netifup, vmware-ping


    These utilities manage VMware’s bridged, host-only, and NAT networking. The boot
    script described in the next section runs these utilities with the correct arguments;
    normally, you won’t need to run them manually.'
