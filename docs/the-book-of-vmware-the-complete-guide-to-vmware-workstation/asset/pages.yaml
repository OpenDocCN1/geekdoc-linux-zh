  md: '# # Chapter 5: Windows Guest Systems


    # # Overview


    VM Workstation supports Windows guest systems from version 3.1. Though there are
    quite few versions of Windows, they fall into three categories. The oldest are
    the 16–bit DOS-based systems and their extensions, such as Windows 3.1. Next are
    the 32–bit single-user systems such as Windows 95, 98, and Me. Finally, there
    are 32-61+ multiuser offerings based on Windows NT, including Windows 2000 and
    XP.


    This chapter has four main parts. First, we''ll go over the Windows NT family
    and look at how to examine the VMware devices and get them to work under those
    systems. Next we''ll do the same for Windows 95-like guest systems. We''ll round
    off our discussion of the 32–bit systems with coverage of VMware Tools for Windows,
    dual configurations, and the Cygwin utilities. Finally, we''ll talk about 3.1.


    # ## 5.1 Windows Driver Compatibility in a Guest System


    Most of the drivers that Windows needs to run under VMware come with the base
    operating system. To get the most out of a Windows guest system, though, you should
    install VMware Tools for a video driver optimized for VMware and the VMware Toolbox,
    as described in section 4.11. The Tools come with Windows 95 and later. Depending
    on your system, you may also need additional drivers for VMware''s sound card.


    With other guest systems, you can choose to install Windows from scratch or to
    run an installation on one of your hard disk''s partitions using VMware''s raw
    disks. You can also make one of these systems into a dual-configuration system
    that runs fine on your real hardware as well as under VMware, as you''ll learn
    in section 5.43.


    When you create a new virtual machine with a new disk using the New Virtual Machine
    Wizard, you''ll get an IDE disk if you choose MS-DOS, Windows 3.1, 95, 98, Me,
    or XP, and a SCSI disk for Windows NT 2000.


    # ## 5.2 Windows NT, 2000, and XP


    Windows NT is a 32–bit-protected operating system that was built mainly with network
    in mind. There are two versions, NT Workstation and Server, but they don''t differ
    much in terms of actual base implementation. Workstation is a ''smaller'' version
    for desktop machines; Server needs more memory because it runs more network services
    at once.


    Windows 2000 is NT''s successor. The underlying system isn''t radically different
    from NT, but the user interface and administration tools depart somewhat from
    NT''s look and feel. As NT, 2000 comes in different versions: Professional, Server,
    and Advanced Server.


    The latest in the Windows NT family is Windows XP, which consists of Windows XP
    Home Edition, Professional, and Server. The operation of all versions is radically
    similar to that of Windows 2000.'
