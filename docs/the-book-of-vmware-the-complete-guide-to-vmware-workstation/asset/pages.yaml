    and (root) on a Unix–like guest).


    # 12.1.2 Diagnostic Messages and Errors


    VMware Workstation may display a diagnostic message or abort with an error. The
    diagnostic messages usually aren''t fatal (when you get the guest system sends
    an unsupported CD–ROM command). These messages won''t stop VMware or your guest
    system, but they may become annoying after while.


    On the other hand, aborts (also labeled PANIC) stop your virtual machine in its
    tracks. If you get an abort, pay attention to the message. Some aborts result
    from known bugs and include a message containing the text BugNr=n, where n is
    some number. This message means the bug is already in VMware''s database, and
    if a newer Workstation release is available, it may fix this.


    You may also get an "Implemented" abort, which usually means that one of the guest''s
    device drivers tries to do something with the virtual hardware that VMware cannot
    handle. You can usually deduce the hardware by the message (and, in some cases,
    by what the guest was right before the crash). If you get one of these aborts,
    you may be able to avoid it by disconnecting the device in question.


    In the worst case of crash, VMware trips over itself so that it can''t catch its
    own error, and the host operating system has to take over. Frequently, crashes
    of this type are rare, and they''re usually related to a condition on the host
    system. (Broken VMware kernel modules on a Linux host cause this kind of crash.)
    If you encounter a problem first check your host system configuration to see if
    it''s known to work well with VMware Workstation, or whether there are issues
    listed in the documentation.


    # Where to Find Diagnostic Messages


    One of the best places to look for VMware diagnostic messages is in your virtual
    machine''s log file. On a Windows host, this is in your virtual machine''s configuration
    directory as VMware.log. On a Linux host, you''ll find it in the same directory
    as your configuration file; the file name ends with .log (for example, freeds.log).


    Normally, VMware removes a log file when it switches configurations or exits,
    so if you want to look at the log, you must keep the VMware application running
    with the same active configuration (it doesn''t matter if you turn off the virtual
    machine, though). However, the log remains if VMware aborts abnormally.


    # 12.1.3 Other Resources


    If you still haven''t isolated the problem, try to locate a solution in this chapter.
    The chapter discusses'
