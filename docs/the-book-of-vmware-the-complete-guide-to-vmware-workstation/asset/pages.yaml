    # 7.2 Using an Existing FreeBSD Installation under VMware


    If you want to boot FreeBSD from an installation already present on your system,
    you must turn off any automatic startup of xdm until you install the VMware Tools.
    However, if your system finishes booting in text mode and you use startart to
    start in an X session, you don''t need to do anything.


    If you see a log-in box when you start, turn it off by looking in the /etc/tty
    files for a line like this:


    ```

    tty8 "/usr/X11R6/bin/xdm -nodaemon" xterm on secure

    ```


    Then change it to:


    ```

    tty8 "/usr/X11R6/bin/xdm -nodaemon" xterm off secure

    ```


    Next, save the file and reboot your system. You should get a plain-text console
    log-in when the system comes up again. If you don''t, xdm may start in your system
    from one of the /etc/rc* boot files. To track it down, run


    ```

    grep xdm /etc/*

    ```


    Note If you a SCSI-only system, make sure your kernel supports the BusLogic SCSI
    controller VMware products. Look ahead in this chapter at section 7.5 if you need
    SCSI support now.


    # 7.3 VMware Tools for FreeBSD


    VMware Tools for FreeBSD include the same components as the other VMware Tools
    packages: an improved graphics driver, a Toolbox program for interacting with
    the host operating system, and dual configuration utilities. To install the tools,
    follow these steps:


    +   1.

    Select VMware Tools Install from VMware Workstation''s Settings menu.


    +   2.

    Attach the CD-ROM to your system:

    mount /cdrom


    +   3.

    Extract the archive and unmount the CD-ROM image:

    cd /tmpzcat /cdrom/vmware-freebsd-tools.tar.gz | tar xvf -\ umount /cdrom


    +   4.

    Change to the install directory and run the installer:

    cd vmware-tools-freebsd

    ./install.pl


    +   5.'
