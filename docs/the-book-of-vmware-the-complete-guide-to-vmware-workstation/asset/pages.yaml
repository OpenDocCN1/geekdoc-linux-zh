  md: '# 6.6.1 /dev/hdd*: IDE Disks and ATAPI CD–ROM/DVD Drives


    The prefix hd in /dev represents IDE disks under Linux. In VMware, the name assignment
    follows the basic configuration of most modern desktop machines:


    +   - /dev/hda Primary master

    - /dev/hdb Primary slave

    - /dev/hdc Secondary master

    - /dev/hdd Secondary slave


    To partition a disk under Linux, use the fdisk or cdisk command as root (that
    is, fdisk /dev/hdb). To find out which device in /dev corresponds to a partition,
    just append the partition number to the end of the drive; for example, /dev/hdb3
    is the third partition on the primary slave. ATAPI CD–ROM drives do not use partition
    numbers; simply use the disk device prefix to work with. Zip disks are partition
    4 by default.


    As many with other Unix variants, the file /etc/fstab contains a list of partitions
    for the system to mount at boot time, and of course you can use the mount command
    to attach a filesystem to a partition to the system manually.


    To make an empty partition usable under Linux, you must first place a filesystem
    on it. (You may want to do this if you run out of space and add a new virtual
    disk under VMware.) To do so, make sure that you have partitioned the disk /dev/hdb1
    and then identify the partition you want to wipe out.


    Let’s say it’s /dev/hdb1. Create the filesystem


    ```

    mk2fs /dev/hdb1

    ```


    Then pick a place for it on your system, such as /scratch, and add it to /etc/fstab
    as follows:


    ```

    /dev/hdb1    /scratch ext2 0 2

    ```


    Finally, use mount -a to add the new filesystem to your system. It will show up
    on the guest system every time it boots, until you comment out or remove the line
    from /etc/fstab.


    Warning Linux, like other kinds of Unix, assumes you know exactly what you’re
    doing when partition disks and create filesystems. It generally won’t ask or warn
    when you’re about to wipe out something, if you’re about to delete your current
    active filesystem. For reason, be certain of the partitions you’re referring to
    when you work with these tools. Although VMware has safeguards to protect a guest
    operating system from corrupting real and virtual disks, these mechanisms can
    be overridden, and you can only undo up to a certain point.


    CD–ROM/DVD drives have no partition table. To attach them, use a command like:


    ```

    mount -r /dev/hdc /cdrom

    ```


    The -r option tells Linux to mount the device in read-only mode.


    # 6.6.2 /dev/sd*: SCSI Disks


    Although SCSI disks use the same device name as IDE disks (/dev/sda, /dev/sdb,
    and so on), the Linux kernel assigns SCSI disks differently than it does IDE disks.
    Rather than using fixed device names for specific SCSI targets, Linux dynamically
    configures SCSI disks in the order in which it finds host controllers'
