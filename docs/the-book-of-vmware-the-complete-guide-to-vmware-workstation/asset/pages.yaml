  md: '# 5.3.5 SCSI Devices


    Because VMware''s virtual SCSI controller is a PCI-type card, Windows 95 and 98
    detect it as soon as you add a SCSI disk through VMware''s Configuration Editor.
    The autodetect process will likely ask you to load the Windows CD-ROM. Although
    the SCSI controller show up under SCSI controllers in the Device Manager, the
    disks show up under Disk drives. (You can put a partition on a disk the same way
    that you would for an IDE disk.).


    A VMware SCSI disk should have a name as VMware Virtual hard drive. You can verify
    that it is a SCSI disk because parameters such as Target ID, Sync data transfer,
    and Disconnect on the Settings tab of the disk''s Properties screen. Furthermore,
    you can also determine which Windows driver corresponds to the target without
    looking at the device hierarchy as you would have to do for an IDE disk.


    As in the Windows NT family, drivers for devices as SCSI scanners and tape drives
    don''t come with the operating system; you''ll need drivers from the manufacturers.


    # 5.3.6 Ethernet Interfaces


    Network interfaces show up under Network adapters in the Windows 95 and 98 Device
    Manager. VMware devices have an AMD PCNET Family Ethernet Adapter (PCI-ISA) label.
    Because Windows automatically detects these devices, you will not need to add
    them manually to your guest system after you configure new devices with VMware''s
    Configuration Editor. Windows will see the new virtual Ethernet right after you
    boot your guest system, and it should then try to load its driver (Have your Windows
    CD handy because you need to insert it so the system can get the driver files).


    Though the driver configuration shows up in the Device Manager, the actual protocol
    settings for network interfaces are on the Network control panel. We''ll talk
    more about how to set this up in Chapter 9.


    # 5.3.7 Serial Ports


    In Windows 95/98/Me, you can see the serial ports with the Device Manager from
    the System control panel. Under VMware, six ports appear: COM1 through COM6. Ignore
    the last two.


    # 5.3.8 Parallel Ports


    The Windows 95/98/Me Device Manager also shows parallel ports under Ports, though
    you can''t really do with a parallel port here except disable it. To use a port,
    you need to add another driver on top of it, by adding a printer or removable
    device.


    To add a new VMware parallel port under Windows 95/98/Me, follow these steps:


    +   1.

    Open Add New Hardware on the control panel. After plug–and–play detection, select
    No (“the device is not in the list”) and then click Next.


    +   2.

    On the next screen, keep the default option Yes (to search for new hardware) and
    click Next.


    +   3.'
