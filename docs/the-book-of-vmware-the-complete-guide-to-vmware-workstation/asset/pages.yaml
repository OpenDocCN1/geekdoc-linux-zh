  md: '# Chapter 6: Linux Guest Operating Systems


    On other systems (such as Caldera), the X link may be in /usr/X11R6/bin. If the
    Tools installer use the link, it creates information in /etc/vmware/tools_log.
    If it doesn''t, you''ll need to hunt these files and create the links yourself.


    Still other distributions (like Debian) use a different scheme. Instead of a linked
    X, they use the Xserver file, also in /etc/X11. The first two lines of this file
    look something like this:


    ```

    /usr/X11R6/bin/X86_VGA16

    Console

    ```


    The first line tells you which server to use. To use the X server comes with VMware
    Tools, you can simply change the line to /usr/X11R6/ bin/X86_VMware.


    Given you''ve installed the VMware Tools installer so, you might expect that it
    would move the original Xserver file to Xserver. create a new file Xserver.vm
    with the necessary changes for under VMware, and create a symbolic link from Xserver
    to Xserver.vm. However, this is not the case.


    Instead, the Tools installer looks for the original server executable in the first
    line of the Xserver file—say X86.VGA16. Once it finds the server, the installer
    renames the binary to X86_VGA16.org and creates two symbolic links, one called
    X86.VGA16.vm pointing to X86_VMware, and the other called X86_VGA16 pointing to
    X86_vm, so that /usr/X11R6/bin directory looks like this:


    ```

    -lrwxr-xr-x 1 root root 13 Mar 13 03:04 X86_VGA16 -> X86_VGA16.vm

    -lrwxr-xr-x 1 root root 1841652 20 Nov 18 05:44 X86_VGA16.org

    -lrwxr-xr-x 1 root root 11 Mar 13 03:04 X86_VGA16.vm -> X86_VMware

    -lrwxr-xr-x 1 root root 1688678 13 Mar 13 03:03 X86_vm

    ```


    You may be wondering what the purpose of naming files and links with .org and
    .vm extensions. The ultimate purpose is to enable dual configurations. For example,
    if you had not originally installed the Linux system under VMware, and if you
    still want to run it on your real hardware, you''ll want your Linux configuration
    files to match the real hardware, and the VMware Tools installer tries to take
    care of this for you, and we''ll get to do this in section 6.5.7. But first let''s
    test the X86_VMware X server and adjust the resolution to suits your monitor and
    taste(see 6.5.3).


    # XFree86 Version 4


    In XFree86 version 4.x, rather than binaries for various video card drivers, there
    is only one X binary, and the drivers are loaded as shared libraries. For this
    reason, VMware also has a driver for XFree86 4 called vmware_drv.o. It is included
    with the VMware Tools for Linux, it comes with XFree86 4.1 and above.


    The Tools should install the driver module, vmware_drv.o, in your /usr/X11R6/lib/modules
    directory. However, the name of your configuration file depends on your distribution.
    Most distributions use /etc/X11/X86Config–4, but /etc/X11/X86Config works fine.
    This can get confusing if you have XF86Config and XF86Config-4, the X server uses
    X86Config–4. In any case, the Tools will detect which one you need, rename your
    original file, and install a new one with a .vm extension, as it is for XFree86
    3.x (see the previous section).'
