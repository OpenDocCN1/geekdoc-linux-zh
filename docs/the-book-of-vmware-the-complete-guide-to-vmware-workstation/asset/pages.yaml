  md: '# Printing Subsystems


    There are several printing subsystems for Linux. Three are in common use: Berkeley
    LPD, LPRng, PLP. For printing to work properly from Windows guest operating systems,
    you must tell SAMBA which one to use. the print parameter in your smb.conf file
    selects the print system. This example specifies the LPRng


    ```

    printing = LPRng

    ```


    For PLP, use PLP instead of LPRng. Berkeley LPD is the default.


    # Log-in and Password Requirements


    The VMware smb.conf file specifies that only users with a log-in and password
    can print, by setting guest ok no. This can get tiresome if you print a lot, so
    you can change this with


    ```

    guest ok = true

    guest only = true

    ```


    # Windows Guest Printer Driver


    On your Windows guest systems, you should set your printer driver to a laser printer
    that supports PostScript, no matter what printer is actually connected to your
    host system. The HP LaserJet 5M (PS) and Apple LaserWriter IIINTX are two drivers
    that work.


    The reason for this is that Linux print servers expect to see PostScript input,
    because most Unix programs produce PostScript output. Even if your printer doesn''t
    understand PostScript, your print system likely produces PostScript input as something
    that your printer can understand.


    # 10.6 Windows Host Printer Sharing


    If your host operating system is Windows, you can get network printer access through
    SMB shares. This service is included in all Windows–NT based systems.


    To share a printer under Windows NT, 2000, and XP, follow these steps:


    +   1.

    Open Printers folder from the Settings submenu.


    +   2.

    Right-click the printer you want to share and select Properties from the menu.
    The printer properties window appears.


    +   3.

    Click the Sharing tab and select the Shared option.


    +   4.

    To restrict access to the printer, use the Security tab.


    +   5.'
