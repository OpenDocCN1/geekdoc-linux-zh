  md: '# # Chapter 8: Other Guest Operating Systems


    # ## Overview


    The previous three chapters discussed operating systems that are advertised to
    work under VMware. However, there are many other operating systems for PCs then,
    and you might wonder what their status is under VMware Workstation.


    The bad news is that you can''t run every last PC operating system under VMware
    Workstation. The biggest technical problem is that the x86 architecture (also
    called IA-32) is not strictly virtualizable, meaning that some machine code instructions
    do different things in protected mode than they do in regular user mode.


    Since all operating system code running under a virtual machine executes under
    mode, this inconsistency can be a big problem for kernel code. However, there
    are workarounds if you know what the operating system kernel is going to do. The
    VMware team focused on getting the major operating systems to work based on the
    behavior of these systems'' kernels.


    Another problem VMware has to tackle when working with various operating systems
    is that Workstation''s devices have many different kinds of interface modes and
    commands, some of which are quite esoteric. While considerable effort has gone
    into making everything work, the more peculiar things invariably slip through
    the cracks, and worse, some operating systems actually use these strange commands.


    The good news is that you can, find several other operating systems to work under
    VMware Workstation, or to work at partially, if you don''t have the source. You
    will need to keep one thing in mind:


    VMware, Inc supports Windows, Linux, and FreeBSD as guest operating systems. Anything
    else is unsupported: It considered experimental or simply unknown. That includes
    not everything in this chapter, but beta release operating systems as well. Don''t
    bug VMware''s technical support staff with questions about an unsupported guest
    operating system, even if you it burns your house down. (That, if you''re really
    into experimentation, go to http://www.freeos.org/ for a rundown of systems you
    can get for a PC for free.)


    # ## 8.1 CPU Idle and VMware Workstation


    As mentioned in Chapter 5, it''s important for a guest operating system to call
    a CPU idle instruction (like HLT) when the kernel isn''t doing anything. The same
    holds for Solaris and FreeBSD, as discussed in this chapter. In many cases, you
    can get an add-utility or operating system upgrade to call the HLT instruction.


    If an operating system doesn''t call such or halt instructions on your processor,
    the kernel runs a simple processing loop when there is nothing to do (called busy-waiting—the
    silicon version of twiddling your thumbs). Busy-waiting problems under VMware,
    because the constant active processor means that VMware asks for use of the processor
    on the host system all the time.


    121'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Chapter 8: Other Operating Systems


    Under a Windows host, probably you won''t be able to tell that the system is busy
    (unless you look at a performance meter or happen to notice that other applications
    run a bit more sluggishly than usual), with a Linux host you can tell immediately
    by running uptime. When you do, you''ll see that load average goes to 1 or more,
    and top shows VMware at the list, taking up nearly 100 percent in the %CPU column.
    That''s a problem and busy-waiting further degrades actual performance under a
    Linux host as a result of the kernel''s scheduler.


    Under normal conditions, the kernel gives a process fair slice of CPU time. It
    permits the process to run for a while—until the process''s slice is up, or the
    process needs to access I/O subsystem.


    The kernel will not allow a process to monopolize the CPU. Once a process has
    used the CPU for a fair amount of time, the kernel preempts it on a system to
    rather letting the CPU-intensive process run. The kernel doesn''t even notice
    that the process is busy-waiting; it simply knows that this process wants to use
    the CPU all of the time, and it''s fine to put it on the buffer necessary. Furthermore,
    if the process-waits most of the time, it''s likely that any computation will
    come between chunks of busy-waiting. The kernel will inevitably interrupt the
    process during its time, killing its cache and invoking more cost when its turn
    comes around. And you may waste even more CPU while for waiting to come back into
    cache.


    The bottom line is that VMware acts just like other process in this regard, except
    when it is told to run halt or idle instructions, it lets go of the processor
    and thus has a much better shot at getting back when it actually needs to do computation.


    Even if you don''t notice a slowdown on your host system, there are also serious
    concerns regarding power—namely, your processor is always running at full tilt,
    using much more power and generating more than it should. If you decide to run
    on a nonidling guest system by VMware Workstation on your notebook, your batteries
    will drain quickly.


    # 8.2 NetBSD and OpenBSD


    There are two BSD Unix variants for the PC in addition to FreeBSD (Chapter 7).
    They are NetBSD and OpenBSD. Both work as operating systems under VMware Workstation.
    VMware, Inc. does not officially support them, the NetBSD and OpenBSD communities
    do their part to keep their kernels compatible with VMware Workstation.


    The NetBSD team tries to make operating system on as many architectures as possible.
    As a result, it enjoys a diverse user base, with many machines that most people
    have never heard of. It''s much a hungrier active system, it''s still rather flexible
    (with a clean installation), and it works under VMware. NetBSD''s website is http://www.netBSD.org/


    OpenBSD is a BSD split-off. It doesn''t include as much support as NetBSD, but
    instead tries to squash as many bugs as possible, especially those related to
    security, and the OpenBSD team actively seeks features to the system. As a result,
    OpenBSD is very popular with security-minded people. You''ll find OpenBSD on the
    net at http://www.openBSD.org/ no'
