    # 7.4.3 SCSI Devices


    Under FreeBSD, SCSI disk devices are the /dev/da* files. In the ATAPI CD–ROM assignment
    scheme, as well as Linux''s SCSI disk assignments, the first SCSI target found
    is /dev/dao, the next is /dev/da1, and so on. Partitioning, and filesystem creation
    are the same as IDE disks.


    SCSI CD–ROM drives are at /dev/cdx (not /dev/scd*). Because you need to refer
    to one CD–ROM drive at, once you use the overlap partition–for example, /dev/cd0—but
    you may need to look at the partition if there happens to be a BSD filesystem
    on the CD–ROM.


    Other SCSI device drivers are available at /dev/[n]sa* for SCSI tapes and /dev/ch*
    for media changers. The best way to drive a system is to run -k scsi to get an
    overview of available drivers.


    # 7.4.4 Floppy Drives


    FreeBSD floppy drives are at /dev/fd0 and /dev/fd1. In addition to a command like
    /dev/fd0c/mnt, you can use tools, described in section 6.6.6.


    # 7.4.5 Ethernet Interfaces


    In Linux systems, there are no files in /dev for Ethernet cards in BSD. BSD recognizes
    VMware''s virtual Ethernet cards as inc0 through inc2 (named for AMD Lance/PCnet).
    You can configure the interface and routing manually with ifconfig and:


    ```

    ifconfig inc0 172.16.144.100 netmask 255.255.255.0

    route add default 172.16.144.1

    ```


    Because each Ethernet drive has its own interface, if you want to create a dual
    configuration, you may need to swap the interface name when the machine boots,
    as described in section 7.3.4.


    # 7.4.6 Serial Ports


    There are two sets of serial port devices under FreeBSD: for dialing in, and one
    for dialing out. Dial-ports are at /dev/ttyd*–under VMware, they are /dev/tty0
    through /dev/tty3 for COM1 COM4. The rule of thumb is that if a program such as
    pppd, cup, tip,မျိုး needs to use a serial port to reach a remote system or device,
    it uses the /cua* device, but uses tty* for any attached terminal or users who
    may log in and run a shell. Normally, you need to configure only one daemon using
    the ttyd ports: the configuration file normally turns that at /etc/tty.


    Under the default kernel configuration, FreeBSD won''t recognize the third and
    fourth serial ports (COM3 and COM4). You can reconfigure and recompile a new kernel,
    but it won''t help you recognize more than two serial ports. VMware Workstation
    uses shared IRQs in its virtual serial ports; FreeBSD doesn''t support shared
    IRQs on standard serial ports.


    # 7.4.7 Parallel Ports


    The unidirectional parallel ports on FreeBSD are /dev/lpt*. The line-printer,
    lpd, is the most likely to use these ports. The bidirectional ports are /dev/ppi*.


