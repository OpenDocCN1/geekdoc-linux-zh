    # 10.5.1 Configuring SAMBA Printer Sharing (Linux)


    This section will tell you how to share your printers from a Linux host system
    for use by Windows guests. When you configure SAMBA via smb-conf.pl as described
    in section 10.1, the resulting configuration already includes support for printer
    sharing. Specifically, the [printers] section of your smb.conf file looks like:


    ```

    [printers]

    comment = All printers

    path = /var/lpd

    browable = no

    guest = no

    writable = no

    printable = yes

    ```


    Because printer configurations vary wildly over Unix installations, you may need
    to change a few things in the smb.conf file shown in the preceding lines. The
    first thing you may need to change is the path parameter, which specifies where
    to intermediate (spool) files before smbd sends them to the printer spooling system.


    Since Unix printing programs need write access to this spool directory, most printing
    systems keep this directory world-writable, so that all processes access it. However,
    /var/lpd may not exist on your system, making it less writable. Thus, changing
    /var/lpd to /tmp if the former doesn''t work.


    # Settings for a Particular Printer


    You may want to change the options for a particular printer to get finer control.
    You can specify settings for a single printer in the smb.conf file as shown here:


    ```

    [someprinter]

    comment = one particular printer

    printer name = someprinter

    path=/var/spool/lpd/someprinter

    guest ok = yes

    browable = yes

    printable = yes

    printer driver = HP LaserJet 4M

    ```


    The parameter here distinguishes the shared and a not shared directory is printable.
    All printer share entries in smb.conf must set this option to yes. Set the parameters
    guest ok and browseable to anything you like. Note, that this example includes
    the optional printer driver parameter: If a Windows guest can match this string
    with a printer driver that it knows about, it automatically selects driver when
    you set up the network printer.'
