    # Letter Assignments and Modes


    BSD partition letters have (more or less) followed a particular convention throughout
    the years. For example, a means a mount point of /, b for swap, and g says that
    the partition''s mount point is probably /usr. However, these assignments are
    only guidelines.


    Even though this is convention, there is, however, one rule that must follow when
    working with a disk: when you put a new disk label on a slice or disk, you must
    not alter or delete c. This partition is sometimes called the overlap; it spans
    the entire slice or disk. Many programs rely on it to determine device geometry.


    In addition to the different partitions, BSD offers two device modes: raw and
    cooked. Cook and filesystem utilities generally work with raw devices, but normal
    device operation is with the cooked devices. So far, we''ve mentioned only the
    cooked device names, but each disk, slice, and partition has both a raw and cooked
    device associated with it in /dev. The raw devices start with the letter r (for
    example, the raw device for /dev/ad0 is /dev/rad0). In FreeBSD, most of this rarely
    matters; you can normally get away with using the cooked device name the disk
    utilities can distinguish between the two and


