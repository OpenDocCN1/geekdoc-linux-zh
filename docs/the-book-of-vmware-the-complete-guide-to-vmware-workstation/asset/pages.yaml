  md: '# # Chapter 7: FreeBSD Guest Systems


    # ## Overview


    This chapter is all about FreeBSD: in particular, how to install FreeBSD on a
    virtual machine, activate VMware Tools for FreeBSD, manage a virtual hardware
    configuration at boot time, configure the VMware Tools graphics drivers (in the
    X server), work with VMware Workstation''s devices under FreeBSD, and customize
    a FreeBSD kernel for use with VMware Workstation.


    BSD is a family of Unixes that takes its name from the University of California
    at Berkeley. (BSD stands for Berkeley Software Research.) Here''s a brief history.
    BSD played an important role in operating system and network research in the late
    1970s and 1980s, influencing the AT&T Bell Labs. It became a factor in academic
    computing systems and went on to become the basis for some common Unix variants,
    such as SunOS (version 5). Unix and BSD have an interesting history; for more
    information, you may read Peter Salus'' A Quarter-Century of Unix (Addison-Wesley,1994).


    Today


    The setup and installation of each BSD system is uniform: that, unlike Linux,
    there aren''t several FreeBSD distributions (of course, the system configuration
    file and the kernel change between versions).


    The FreeBSD team attempts to provide backward compatibility between versions,
    particularly with shared link libraries. Our interest is Linux binary compatibility.
    User applications including VMware Workstation generally work fine in Linux compatibility
    mode, but anything that talks to a device (such as an X server) won''t.


    Note If you''ve worked with Linux or any other Unix system, you''ll have no problem
    with the material in this chapter. Others should read up on some basic Unix tasks,
    such as navigating filesystems, editing files, and rebooting and shutting down
    the system.


    # ## 7.1 Installing FreeBSD under VMware


    Because FreeBSD supports all of VMware''s hardware, installation is relatively
    simple. The VMware Configuration Wizard defaults to an IDE virtual disk to create
    a new machine, avoiding compatibility issues. Furthermore, the FreeBSD installer
    doesn''t try to start a graphics mode for you, so the installation is relatively
    quick.


    Still, there are a number of packages that you should install to get the most
    out of your system, especially packages related to VMware Tools. When the FreeBSD
    installer asks you which type of system you want to install, a good option is
    the X-Kernel-developer. This includes the X Window System, the kernel source,
    and the C compiler (you''ll need a C compiler to configure and compile a BSD kernel;
    it''s never a good idea to install a Unix system without a C compiler).


    As disk partitioning, you may want to skip forward in this chapter to the “BSD
    Devices” section for a look at how FreeBSD lays out its filesystems on disks.
    If you''re using a virtual disk, the defaults should be fine; let the installer
    determine the layout for you.'
