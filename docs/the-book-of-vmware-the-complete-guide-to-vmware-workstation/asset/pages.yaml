  md: '# Chapter 9: Host and Guest System Network Configuration


    As mentioned in Chapter 6, eth0 is the first Ethernet interface on the system.


    To add a default route for this example, you can use the route command:


    ```

    route add default gw 172.16.144.1

    ```


    As far the various Linux distributions go, every configuration ultimately creates
    or modifies some file on your system. For example, when you configure an interface
    in Red Hat 7 [Config – Networking – Client tasks – Basic information in the linuxconf
    program], you change a /etc/sysconfig/network-scripts/ifcfg-eth0 file.


    If your network has a static (no-DHCP) configuration, you''ll find that each distribution
    runs ifconfig in the network startup script at boot. For example, Debian''s /init.d/networking
    script performs this function.


    DHCP is another story. Linux distributions use the ISC client program to get a
    DHCP connection at boot time if the Ethernet interface is set to an automatic
    configuration. Red Hat, however, uses a program called for DHCP client configuration.


    By default, dhclient tries to configure all network interfaces, but you can single
    out an interface by supplying an argument. For instance, dhclient0 configures
    the DHCP server for the first Ethernet interface.


    # 9.5.5 FreeBSD


    With Linux, you can manually specify the IP settings for VMware''s Inc interfaces
    with the ifconfig command. You can either set the manually in /etc/rc.conf or
    use the /stand/sysinstall command. For the sysinstall utility, go through the
    menus: Configure • Networking • Interfaces (press space on option of enter); then
    specify incr, where n is the interface you want to configure.


    You can also change the settings in /etc/rc.conf. If you are configuring interface
    lnc0, use something like


    ```

    ifconfig_lnc0="172.16.144.103 netmask 255.255.255.050"

    ```


    for a fixed configuration. To use DHCP, use the following instead:


    ```

    ifconfig_lnc0="DHCP",

    ```


    # 9.5.6 NetBSD


    In NetBSD, put your parameters for your interfaces in /etc/ifconfig.len. For example,
    /etc/ifconfig.le0 could look like this:


    ```

    172.16.144.98 netmask 255.255.255.0

    ```


    To use DHCP with NetBSD, don''t create this file; instead, edit /etc/rc.conf and
    add


    ```

    dhclient_YES=YES

    ```


    To run DHCP on only one specific interface (say le0), use


    ```

    dhclient_flags="le0"

    ```'
