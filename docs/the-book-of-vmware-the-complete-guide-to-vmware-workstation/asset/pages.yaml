  md: '# Chapter 11: Non–Networked File Transfer


    The most convenient way to access a filesystem on a floppy image on your operating
    system is through the loop driver. This driver is a simple device whose takes
    a file and maps its content to a block device in /dev, at which point you can
    attach the device somewhere on your current filesystem.


    Here''s an example of how to use the loop driver to attach an example.flp image
    (run as root):


    ```

    mount -t mdos -o loop=/dev/loop0 example.flp /mnt

    ```


    After you run this, the files on the floppy image from example.flp should be visible
    at /mnt. When you examine the files, you should notice some have somewhat odd
    names, like vmare-e1. This is called a mangled name–a truncated version of the
    actual file name. It appears this way because the real name is longer than seven
    characters, and the simple MS-DOS filesystem can''t handle many characters in
    a file name. To see the whole file, use unmount to detach the image and then run
    the mount command again, but replace mdos with fat.


    Important Always mount a loopback image as soon as you finish it, especially before
    you connect to a operating system running under VMware, it''s easy to forget about
    the image. You should detach the image because of the kernel''s buffers: if you
    play around with the image before detaching, there''s a good chance you''ll end
    up with inconsistencies. As soon as you unmount, all of the kernel''s buffers
    are flushed back into the original file. If you mount the image as read-only,
    the kernel won''t be terribly pleased if you change the filesystem structure.


    Note You''re not limited to the FAT filesystem on floppy disks, by the way. If
    you want to create a second filesystem on an image using mk2fs. Whatever works
    is the best solution–if you host your guest and read it (or the other way around).
    You can also use the loop device to attach an ISO9660 image to your Linux system;
    just use the filesystem type iso9660. This can be handy on a Linux host where
    have a .image with some files for your guest system, but don''t want to burn to
    a CD just for that purpose. We''ll look at an example in section 11.4


    # 11.2.1 Kernel Support for the Loop Device


    For loopback to work properly under Linux, you must have the appropriate kernel
    support, most Linux distributions include. If you''re compiling your kernel, you
    will find the option under Block devices on the main menu. You can include the
    support as a module (loop:); the automatic kernel module loader has no trouble
    figuring out that it needs to load the module when you access a device such as
    /dev/loop0.


    To access more than one image at a time, you will need to separate loopback devices
    in /dev. To do so, use /dev/loop1, /dev/loop2, and so for device in the -loop=device
    part of the mount command.


    # 11.2.2 Extracting Data from Floppy Disks


    If you have a (real) floppy disk from which you want to extract all data for use
    under VMware Workstation, you can copy the entire disk directly from the floppy
    disk. To place the data from a floppy drive in a called image.flp, use dd on the
    floppy disk''s block device:


    ```

    dd if=/dev/fd0 of=image.flp bs=512

    ```


    Unfortunately, regular PC floppy drives and disks aren''t very reliable, and the
    Linux drivers don''t particularly like to deal with bad disks. If you get an I/O
    error, ejecting and reinserting the disk a few times might help there''s some
    dust in the drive that you need to displace. If this doesn''t work, try the superformat
    option on'
