  md: '# Chapter 9: Host and Guest System Network Configuration


    # Overview


    Networking is an important component of VMware’s host–guest operating system interaction.
    Although you can perform a simple file transfer with other virtual devices, such
    as the virtual CD-ROM and floppy drives, these are generally inconvenient to work
    with. VMware''s networking allows you to do anything you can do between hosts
    on a normal network, such as share filesystems between host and guest, set up
    servers on guest systems, use proxy servers, and send X Window System clients
    between the host and guest.


    This chapter explains how to configure VMware’s base networking up running between
    your host and guest systems. (We’ll cover actual network services and applications
    in the next chapter.)


    # 9.1 VMware’s Networking Options


    As mentioned in earlier chapters, VMware has three types of network interface
    card configuration: bridged, host-only, and NAT networking.


    A bridged network interface puts your virtual machine’s network interface on the
    same level as your host’s network interface. Think of it as connecting the network
    card in your virtual machine to your host machine’s network.


    Host-only networking creates an virtual Ethernet local area network inside the
    host; it does not depend on any external network interfaces.


    NAT networking is identical to host-only networking, except that VMware uses address
    translation (NAT) to enable communication between guest systems and the rest of
    the Internet. The link to the outside world is different than in bridged networking;
    the link is not direct and works only over IP (Internet) networks.


    You can configure a virtual machine with combination of host–only, bridged, and
    NAT networking.


    # 9.1.1 Network Basics


    There are two basic layers to worry about when you configure your network: the
    link layer and the protocol layer.


    The lowest level is a link layer, comprising the physical connection and the basic
    protocol that all interfaces on this kind of connection communicate with. In VMware
    Workstation, you have an Ethernet link that is relatively easy to set up. The
    VMware installer configures everything you need initially on the host system side.
    All you have to do is install the network drivers, as discussed in the previous
    four chapters.


    Sitting on top of the link layer is a protocol layer. It specifies how to send
    data from one host (possibly through several network links) to another host. Higher–level
    communication schemes build on top of this'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'piece. For example, the current Internet uses the Internet Protocol (IP)¹¹as
    its lower protocol layer. If you''re interested in the full picture, the World
    Wide Web has two higher–level protocols on IP: TCP is for the next up, and HTTP
    is at the very top level.


    # 9.1.2 IP


    This chapter focuses on IP. Nearly everything relates to IP configuration in some
    way. Each host on the Internet has an IP address—four numbers connected by dots,
    like this: 10.45.23.124. The numbers range from 1 to 254 (the middle two can also
    be 0).


    The most important thing to know about IP networks is that they are divided into
    subnets. A subnet is a partition of the Internet address space. Normally, this
    is a simple block of addresses—10.34.23.10 to10.34.23.254, for example. A subnet
    mask (or mask) blocks off parts of an Internet address common to its subnet. In
    the previous example, any IP address of the form 10.34.23.x has a 255.255.255.0
    mask. (Each number in an IP address is 8 bits wide; a bit mask blocks off a bit
    in the address.)


    When working with VMware''s host-only and NAT networks, you''ll work primarily
    with subnets with a mask of 255.255.255.0 (sometimes called class Cnets).


    To learn more about IP networking, read Andrew Tanenbaum''s Computer Networks
    (Prentice–Hall, 1996); for the ultimate programming reference, look at W. Richard
    Stevens'' Unix Network Programming. Volume 1 (Prentice–Hall, 1998). In addition,
    your author''s Linux Problem Solver (No Starch Press, 2000) provides hands–on
    systems administration information for Linux kernel version 2.2.


    There are several other of lower-level protocol types for Ethernet inter


    faces in addition to IP, such as Novell''s IPX and Apple''s EtherTalk Phase 2.
    VMware Workstation supports these as well as anything else that runs on Ethernet.


    Note Some operating systems refer to IP in one lump along with TCP/IP (TCP stands
    for transmission control protocol). Although TCP is the most common protocol paired
    with IP, IP is also paired with the user datagram protocol (UDP) and the Internet
    message control protocol (ICMP), among other protocols.


    ¹¹When we say IP, we mean IPv4 (IP version 4), the basis for the current Internet


    # 9.2 Bridged Networking


    The easiest way to connect a virtual machine to your local network and the rest
    of the Internet is with a bridged network interface. Think of this as putting
    an Ethernet card into your virtual machine and plugging it into your local network.
    Use bridged networking when:


    +   - Your virtual machines need access to the Internet.

    - Your local area network is Ethernet.'
