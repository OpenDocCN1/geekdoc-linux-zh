  md: '# Chapter 10: Network Services


    As for file sharing. SAMBA is a key part of the solution. Because Windows systems
    don''t particularly like to speak foreign protocols, the burden of translation
    falls mainly on a Unix system''s shoulders, through SAMBA.


    You''ll see how to manage a Linux host system''s printers available to Windows
    guests. Following this is a brief example of how to do this on a Windows host.
    Finally, you''ll see how to use these shares on a Unix guest system through its
