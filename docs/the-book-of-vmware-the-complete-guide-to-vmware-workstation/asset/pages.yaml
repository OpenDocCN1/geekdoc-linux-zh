    # 9.9 Custom Networks


    As mentioned earlier, any interfaces other than VMnet0, VMnet1, and VMnet8 are
    yours to configure in any way you please and to set up additional bridged or host-only
    networks for your virtual machines.


    There are two primary reasons for setting up custom networking. The first is that
    you may have more than one Ethernet card in your host machine and want to allow
    your virtual machines bridged access to these additional cards. The other reason
    is that you may want to use different host-only network subnets—for testing router
    or firewall options or if you have servers listening on multiple subnets. Or you
    may simply want to isolate a particular virtual machine, due to its use of an
    obnoxious network protocol or something that you don''t want all of your virtual
    machines to see.


    To set a virtual machine with a custom interface in VMware Workstation for Windows,
    select the Custom option in the Editor; then select the VMnet interface that you
    want. For Workstation for Linux, choose Custom and type the interface device name
    (such as /dev/vmnet2 or /dev/vmnet3) in the VMnet entry box.


