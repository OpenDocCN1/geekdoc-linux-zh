    # 6.7 The Linux Kernel and Device Drivers


    We''ve now talked about device files and how to use them, but haven''t mentioned
    much about the Linux kernel, which lies behind the device files. The kernel is
    the core of the operating system; in addition to managing processes, memory, and
    filesystems, it also contains all of the device drivers. You can configure and
    build by linking the drivers directly to the kernel (activating them immediately
    upon boot), or by creating a kernel module to be inserted on demand into a running
    kernel. Most distributions compile critical drivers, such as IDE disk drivers,
    directly into the kernel and relegate everything, as drivers for a sound card
    or filesystem that aren''t used, to modules.


    > Note Though a fun process, configuring and compiling a kernel along with its
    modules is beyond the scope of this chapter. If you''re interested in this, two
    places to look are the Linux kernel-HOWTO and the kernel of Linux Problem Solver
    (No Scratch Press, 2000). Moreover, it''s likely that your distribution already
    installed all of the drivers VMware needs on your system. They''re probably in
    modules, and you''ll just need to coach them to do what you want them to do.


    # 6.7.1 Working with Kernel Modules


    Before you started with kernel modules, you should know which kernel your system
    is running. Type uname -r to determine this. If your version of Linux is an official
    release, the version number will be a three-part value


    such as 2.4.1. However, many distributions apply a number of patches to their
    kernels, giving them version such as 2.18pre21 and 2.18–27.


    You''ll find the actual kernel module files in the subdirectories under /lib/modules/version


