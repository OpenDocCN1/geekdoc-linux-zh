    not know the name, run the dmesg command and check for this line:


    ```

    hdc: ATAPI 2X CD-rom drive, 128KB Cache

    ```


    Since you can connect and reconnect CD–ROM drives under VMware, you can choose
    to make the CD–ROM drive start disconnected. Once you have the guest system operation
    configured and installed, you may want to keep the drive disconnected until you
    need it. (Since a CD–ROM drive is read-only, the host and guest operating systems
    won''t clash over the device, the guest system will attempt to access the CD–ROM
    at boot time, which can cause an extra seek, adding some time to your guest system''s
    boot sequence.)


    You can also connect an ISO9660 image to the virtual CD–ROM instead of a real
    device. To do this, choose CD–ROM from the Device Type menu and pick the file
    name of the image in the Name box.


    Note CD-R and CD–RW drives show up as CD–ROM drives in virtual machines. If you
    want to use their CD–writing capability in a virtual machine under a Linux host,
    you can try to use the ide–scsi emulation on your guest system.


    # SCSI Drives and Devices


    The SCSI drives has a maximum of seven disks, corresponding to targets 0 through
    6 of the virtual SCSI bus. Configuration is identical to the IDE devices in the
    previous section for Virtual Disk, Plain Disk, Raw Disk, CD-ROM, CD-ROM Image,
    and CD–ROM (raw access) types.


    Virtual SCSI disks are one of means of adding more drives to a guest system if
    you''re out of IDE devices; but if you do, be sure your guest system fully supports
    the BusLogic controller (Windows and Linux systems).


    In addition, you can configure a SCSI target using the Generic Device option.
    This option translates all SCSI commands to from a real device on your host to
    a SCSI device on your virtual machine, regardless of the device''s actual type.
    You can use this to attach scanners and CD–RW drives to your guest operating system.


    Although you can connect and disconnect generic SCSI devices during virtual machine
    operation, you should only do so if you''re certain that a driver isn''t using
    it. Otherwise, your guest operating system may crash. SCSI wasn''t meant to be
    hot-pluggable.

    To add a generic SCSI device to a Windows host, follow these steps:


    +   1. In the Add Hardware Wizard, choose Generic SCSI Device; then click Next.

