    NAT networking is like host-only networking with a connection to the outside world.
    It uses VMware''s built-in network address translation to transform your host
    operating system into a gateway.


    We''ll tell more about the Custom option and go into detail about networking in
    Chapter 9.


    Note For all network nodes to operate correctly, you must enable special support
