    # 4.8 Suspend/Resume


    One handy feature of VMware is its ability to suspend and resume a virtual machine.
    When you suspend a virtual machine, VMware freezes the guest operating system
    in the current session and saves it. Everything, including memory, video display,
    and interrupt vectors, goes to a storage area. Later, when you resume the session,
    VMware checks to see if enough memory is available on the host system and, if
    so, loads everything back into the virtual machine and sends the guest system
    back on its axis, precisely where it left off.'
