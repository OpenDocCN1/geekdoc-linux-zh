    # Floppy Drives


    VMware supports regular floppy disk drives. In addition to the host system''s
    real drives, you can also use a file containing a floppy disk image. Since a floppy
    is a removable medium, you can disconnect and reconnect floppy drives during guest
    operating system. If you even disconnect, change the underlying device or file
    in the Configuration Editor, and then reconnect the device without rebooting the
    guest system.


    When configuring a floppy disk drive, you can pick the first (A:) or second (B:)
    disk drive in the **Floppy Drives** section of the Configuration Editor. For **Type**,
    choose **Device** for a real disk or **File** for an image file.


    On a Windows host, you choose a real device from a list. On a Linux host, you
    must enter a device name in the *Path* box for the device: /dev/vfd0 or /dev/vfd1
    for a real floppy drive. On both hosts, you can also opt for a floppy image file
    (for a blank image, enter the desired filename and click **Create**). Click **Install**
    to add the drive to the VMware configuration.


    Use **Start** if you''re sure that you want VMware to see the drive when you activate
    the virtual machine (for example, if you''re booting from a floppy drive).


    Start the floppy drive when connected has a removable media, as many notebooks
    do; for a nonexistent floppy drive may cause your host system to hang. Also, VMware
    takes exclusive use of some devices (such as floppy drives) when connected, making
    them unavailable to the host system unless you disconnect them.


    # Ethernet Adapters


    You can install up to three Ethernet interfaces on a guest operating system. When
    you configure an interface, you must select a type from the **Connection Type**
    options.'
