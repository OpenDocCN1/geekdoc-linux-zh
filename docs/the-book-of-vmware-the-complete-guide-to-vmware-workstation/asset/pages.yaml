  md: '# Appendix A: Linux Display Parameters


    Let’s say you want to go from 8 bits to 24 bits. First, check to see if a similar
    subsection appears with 24 instead of the 8. So, you shouldn''t need to do anything;
    if not, change the 8-bit subsection and the 8 to 24 in the copy.


    Now, verify that the resolutions on the Modes line are what you want. The first
    is the initial mode, and normally you want to set it to the highest value. If
    all of your desired resolutions don''t appear (or you''re otherwise unhappy with
    them), you can''t just add modes and expect them to show up—you need to go up
    to a Monitor section. In the case the monitor has a Primary Monitor label, go
    back in XF86Config file and look for a section that starts with these two lines:


    Section "Monitor"

    "Primary Monitor"


    There are two lines that define the monitor''s capabilities:


    | HorizSync | 30-94 |

    | VertRefresh | 48-160 |


    These must match your monitor''s horizontal and vertical scan frequency ranges.
    This information should be in your monitor''s manual, but if it isn''t, the vendor
    has the information online. Assuming that your settings are correct, look for
    the actual video mode definition line, which looks like this:


    ```

    Modeline  1280x1024  157.50 1280 1360 1520 1728 1024 1025 1028 1072

    ```


    Or you may find a more verbose version:


    ```

    Mode 1280x1024"

    DotClock 157.50

    HTiming 1280 1360 1520 1728

    Timings 1024 1025 1028 1072

    EndMode

    ```


    Any mode you want to place in the Display subsection just described must have
    a Mode or Mode definition in the Monitor section. The numbers are precise timings,
    and you can''t randomly guess them. There was a time when you had to calculate
    these by hand for each video card and monitor (and you can run a risk of destroying
    your monitor if you got it wrong!), but display technology has improved since
    then. Your XF86Config file may already have a set of timings for each mode—some
    X programs provide it. In that case, all you need to do is pick out the ones that
    you like and see if they work. Otherwise, you can search for VESA standard display
    modes. Most monitors work well with these, unless the timings are outside of the
    monitor''s capabilities.


    # A.2 XFree86 Version 4


    Rather than provide a X server executable for each type of display device, XFree86
    version 4 has one X server that loads the drivers dynamically. First, hunt down
    the Screen in your XF86Config or XF86Config–4 file. Here is the start of one from
    a 16-bit LCD monitor display configuration:


    Section "Screen"

    Identifier "Screen0"

    Device "Card0"

    Monitor "Monitor0"


    202'
