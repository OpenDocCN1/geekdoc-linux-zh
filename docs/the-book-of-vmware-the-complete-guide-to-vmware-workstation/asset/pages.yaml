    ```

    DEVICE=C:\BUSLOGIC\BTDOS.SYS /D

    ```


    This entry assumes that you unpacked the drivers to C:\BUSLOGIC, and turns the
    DOS BusLogic SCSI Manager at boot time. It is not strictly necessary for disk
    support, which utilities might require it, as discussed.


    If you''re adding new SCSI disks, use BTDISK (BTDISK.EXE) to put a table and partitions
    on the disks. The program will not work without the BDOS.SYS driver, and it operates
    only on SCSI disks; however, you should not need the BTDISK.SYS driver that comes
    with the package (the VMware BIOS and DOS should be able to out the disk assignments).
    If you put a reference to BTDISK.SYS in your CONFIG.SYS file, each disk appears
    under two drive letter assignments, say, D: and E:


    You won''t need an additional driver to access SCSI disks with Windows 3.1 under
    VMware.


    # 5.6.5 Floppy Drives


    PC-style floppy disks and their controller interfaces are interactive and don''t
    really give much information unless specifically called upon. True to form, DOS
    won''t recognize a VMware floppy drive until you enter something like c a\ switch
    to the first floppy drive.


    One other feature of DOS is that you can multiply a single floppy drive. If you
    access B: with only one floppy present, DOS prompts you to insert the floppy for
    that particular drive and press Enter. Afterward, when you access on A:, DOS prompts
    you to put a floppy in again. However, VMware offers two floppy drives and you
    can map them to files of actual data, you might think about adding another floppy
    drive to B: Make sure that you go into the VMware BIOS and add the drive if you
    configure another floppy drive. DOS believes the BIOS, and if it still thinks
    you have only one floppy drive, access to B: won''t go to the second virtual floppy,
    but to the multiplexer system, and will ask you to put a floppy disk into the
    first.


    All of this talk about floppies under DOS may seem strange, but most DOS software
    came on floppy disks. If you master how to use a file as VMware''s virtual floppy,
    as well as disconnecting and reconnecting, you can save yourself a lot of time.


