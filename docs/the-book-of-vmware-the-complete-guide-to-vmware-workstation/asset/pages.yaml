    # 8.2.3 FreeBSD and OpenBSD Devices


    BecauseBSD and OpenBSD have the same origin, their device files and interfaces
    are very similar. The only halfway tricky part is figuring out which system you
    put. The fastest way to get started is to run dmesg (or dmesg | less) to see the
    system''s startup messages.


    If you''re having trouble getting a device to work, an excellent place to look
    for help is the online manual. BSD devices have excellent documentation; each
    manual page lists the device name, the kernel configuration, and other relevant
    manual pages (in the SEE ALSO section). The other manuals are important. if you
    want to find information about the sound driver in OpenBSD you may notice that
    dmesg says about sb0. The man page provides device information and directs you
    to the audio manual page. At the bottom of this document are references to mixerctl
    and audioctl, the commands you need to know about playing a sound. Furthermore,
    audioctl provides examples of how to play a sound.


    # Disks


    Disk devices in NetBSD and OpenBSD differ from FreeBSD in both name and partition
