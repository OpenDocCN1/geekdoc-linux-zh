    very simple: if the system is running under VMware, it executes /etc/vmware-tools/dualconf.vm;
    otherwise, it runs /etc/vmware-tools/dualconf.org.


    These scripts manipulate symbolic links to /etc/modules.conf, the XFree86 configuration
    file (see section 6.5.2), and if you''re running XFree86 3.x on the guest system,
    the X server executes (named X; in Red Hat, it executes). /etc/modules.conf is
    a general configuration file for kernel modules and their options. Most distributions
    use modules for as many drivers as possible, you may need a different /etc/modules.conf
    file for use VMware (assuming you installed this system without VMware).


    The VMware Tools installer achieves this by renaming your original /etc/modules.conf
    file to /etc/modules.conf.org, and installs a new file /etc/modules.conf.vm. The
