  md: '# Chapter 6: Linux Guest Operating Systems


    # 6.4 Running Linux Installations under VMware


    If you''ve already installed Linux on your machine, you''ll use a raw (physical)
    disk device in the VMware configuration for the disk on the machine.


    When you boot Linux under VMware Workstation, it''s likely that many drivers won''t
    work, instead spending nasty-looking errors. These drivers tend to be noncritical,
    and your system will boot fine without them. However, there is one service that,
    if installed, you must turn off before running your guest system under VMware:
    any display manager that starts the X Window System immediately upon boot. If
    you use startx or xtrun to run an X session, not GNOME, KDE, or xdm run the X
    server and pop log-box as soon as the system boots, you have to figure out how
    to turn off the display manager, or under VMware, the display manager may continuously
    respawn (making your guest system unusable until you reboot) or possibly crash
    the system.


    Unfortunately, the configuration is different for each Linux distribution.


    Red Hat makes it run the display manager, so its configuration is in /etc/initab.
    If you take a look at this file, you''ll see some lines like:


    ```

    # Default runlevel. The runlevels used by RHS are:

    # 0 halt (Do NOT set default to this)

    # 1 Single-user mode

    # 2 Multiserver, without NFS (The same as 3, if you do not have networking)

    # 3 Full multiuser mode

    # 4 unused

    # 5 X11

    # 6 reboot (Do NOT set initdefault to this)

    ```


    ```

    :id:5:initdefault

    ```


    Here, you can see that the default runlevel is 5, meaning that it tries to start
    some kind of display manager for X (see the very end of the initab file for the
    specific command). To deactivate the display manager, change the 5 to 3 in the
    :id line, so that it reads


    ```

    :id:3:initdefault

    ```


    The next time you boot, you should get a simple log-prompt in text mode instead
    of a fancy graphic log-box. To return to the way you were, change the 3 back to
    a 5.


    Warning Take care not to butcher the /etc/initab file. If the changes do not appear
    exactly as shown in the preceding code, your system will malfunction—spectacularly.\Other
    Linux distributions start display managers from the init.d and re^d directories,
    either in /etc or /etc/rc.d. Look in the init.d directory for a file named xdm,
    gnome, kde, or something similar. Using may help.


    ```

    egrep ''xdm|kdm|gdm'' *

    ```


    Once you''ve found the file, edit it by adding the following after its first line:


    ```

    exit 0

    ```


    Note Be sure to document what you did, because you''ll likely want to go back
    and delete that line to re-enable the display once you have the VMware X server
    working.'
