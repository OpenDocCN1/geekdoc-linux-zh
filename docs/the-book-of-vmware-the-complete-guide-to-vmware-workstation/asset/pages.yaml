    scripts. We''ll go into a little more detail that in section 6.5.8.


    Most systems use the System init program to boot. In this scheme, a directory
    called initd contains a number of system startup scripts, which initialize system
    services. There are also of directories named rcd0 from rc0.d; the number corresponds
    to a runlevel; different runlevels specify normal boot, single-user boot, halt,
    shutdown and others. Each rc.d contains symbolic links pointing to the scripts
    in the init.d directory, namedName or XYName, where XY is a number between 0 and
    99 (when init runs this link in relation to the other links), and is usually the
    name of the script in init.d. S means run script in start mode and K means to
    stop mode.


    The location of these directories depends on your Linux distribution. Red Hat
    puts them in /etc/rc.d; Debian keeps them in /etc. Other distributions follow
    one of these conventions, or


    The VMware Tools installer looks for these directories, and if it finds them,
    it installs a script called dualconf in init and attaches it to the rc.d directories.
    Specifically, it looks for existing links matching Snetwork, and if it finds them,
    it adds a new XYdualconf link where XY is the same as it was for the network script.
    Although this works for some distributions, such as Red Hat, it does not work
    for others (Debian, for instance), you''ll need to put the links in hand by the
    Tools installer can figure out what to do.


