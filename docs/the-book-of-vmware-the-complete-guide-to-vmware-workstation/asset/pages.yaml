  md: '# 6.5.3 Testing and Customizing the VMware Server


    To test the VMware server, type X and see if the VMware window or screen changes
    to a 1280x1024 screen that looks like Figure 6.1. If so, and if you can move the
    mouse pointer, your server works; kill it with ctrl–alt–backspace.


    ![](img/aa552d73360a647bd96f567236c5ca1a_97_0.png)


    If you get a 640x480 screen that also looks like Figure 6.1, you’re running X86_VGA16,
    which works under VMware, but is very slow (ugly). In this case (or if you didn''t
    get anything at all), find the links/or files mentioned in the previous section
