    # 10.10 Considerations for Other Services


    As many times before in this book, you can run any network service over a VMware
    host–only or NAT network. However, there are a few things that you should keep
    in mind when doing so:


    **Domain names.** Is the service picky about domain names, like SSH and FTP servers?
    If you''re running a bridged or NAT network and tell your systems to look at a
    real DNS server to have continuous access, you shouldn''t have a problem. However,
    if access is sporadic, or if you don''t have a server at all, you may run into
    delays while the guest times out on a nameserver request.


    **Security.** While network services can be handy, they can also be serious hosts.
    Typical servers listen on all network interfaces, but you may want a particular
    service for a host–only interface. If you have any doubt about a particular network
    program that you are installing, you shouldn''t trust it, especially on a host
    system. One example is FTP servers; people continuously discover security holes
    in these.


    Don''t install any service on your host system without thinking about limiting
    access to other machines. It''s generally easier to set up access control on a
    Linux host machine, because if you can do it with /etc/hosts.deny, you can always
    fall back to a kernel–level firewall with iptables or ipchains. Windows hosts
    are a little tougher to configure, especially if you need to purchase firewall
    software.


    **Performance.** Host–only and NAT networks are fairly quick, and you shouldn''t
    have any trouble with performance. Keep in mind that all host–only traffic is
    internal to the host operating system. In, when traffic goes to and from the guest
    system, the operating system must perform several context switches inside and
    outside of VMware through the virtual network interface hardware, as well as in
    and out of kernel mode. Short bursts won''t hurt anything, but if you blast a
    continuous stream of data through a host–only network, your host system may slow
    down somewhat.'
