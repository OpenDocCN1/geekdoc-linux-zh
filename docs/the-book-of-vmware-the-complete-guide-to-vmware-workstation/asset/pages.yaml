  md: '# Chapter 5: Windows Guest Systems


    # 5.6.7 Serial and Parallel Ports


    In DOS and Windows 3.1, there really isn''t much configuration over VMware''s
    serial and parallel ports. The serial ports show up as COM1, COM2, COM3, and the
    parallel ports are LPT1 and LPT2. DOS and Windows just expect the ports to be
    at the standard hardware assignments, but they don''t do much bother looking for
    the hardware until you actually try to use one of the ports.


    You can change port hardware settings if you wish. For example, in Windows 3.1,
    the Ports control panel offers Settings options for a port (use the Advanced button
    to change hardware assignments). However, there''s really no need to do any of
    this unless your installation was copied from a machine that did not have matching
    hardware.


    To see whether VMware''s ports are working, change the virtual devices in the
    Configuration Editor. For example, if you change the first parallel port to /tmp/icmp
    (for a Linux host system), you run a DOS command like autoexec.bat lpt1 after
    you connect to see DOS is connecting to the VMware device. The command won''t
    run quickly, but eventually you should get the contents of your DOS guest''s autoexec.bat
    file in /tmp/icmp on your host system.


    # 5.6.8 Mouse


    Since VMware''s mouse under configurations is a PS/2 type, you shouldn''t have
    any difficulty getting it to work under Windows 3.1. The Windows 3.1 installation
    program recognizes VMware''s mouse device automatically. If you''re using an old
    configuration that you pulled from an old machine, you may need to run the SETUP.EXE
    program in your WINDOWS directory to configure it, because many older mouse devices
    connect to the serial port. The proper setting is: Microsoft or MS PS/2.(You will
    also need to remove any serial port mouse drivers in your CONFIG.SYS file).


    If you need a mouse driver for DOS, or if you want to use a mouse with three buttons,
    there''s a free-of-charge driver CuteMouse mentioned in section 8.5.1. Other than
    games (which may or may not run quite quickly under VMware), not a lot of programs
    support the mouse under DOS (elvis, interestingly enough, does).


    # 5.6.9 Sound Card


    To get sound with DOS or Windows 3.1 on a guest system under VMware, install the
    Sound Blaster 16 from the Support section of the Creative Technology (http://www.creative.com/).
    You should find this as a single executable file called sbbasic.exe.


    Copy sbbasic.exe to a directory on your hard drive and, and from an MS-DOS prompt,
    run sbbasic to extract the contents of the drive archive, installing the installer
    program install.exe; then run sbbasic. You''ll get a few information screens,
    one of which gives the default paths for the installed drivers. The card''s path
    should be SB16, and if you have Windows 3.1, it should show up as WINDOWS. Press
    enter after you finish with this screen.


    If you configured and installed the sound card in VMware''s Configuration Editor,
    the installer will automatically detect the card with its base I/O address at
    220, the interrupt at 5, and the Low DMA setting at 1. If the sound card was not
    configured and installed, you probably forgot to add the sound card to your virtual
    machine''s configuration. If so, press F3 to exit, turn off your guest system,
    configure the sound card, and try again.


