    # 1.4.1 Quality Assurance (QA)


    Because there are many possible versions and configurations of operating systems,
    testing software products can involve a large amount of overhead. Traditionally,
    quality assurance teams require several physical machines, each with a different
    operating system. Not only does this cost money, the setup time for this infrastructure
    is substantial.


    VMware eliminates the need for physical machines. With virtual disks, you can
    fit many different operating systems onto the real disks of a single computer.
    You also have the option of running several of the operating systems simultaneously
    so that you can compare them by side. There are many other benefits—for example,
    if you are testing somehow corrupt the operating system, you can take advantage
    of VMware’s undoable disk mode and just go back to the machine’s old state if
    something bad happens. On a real machine, you’d need to restart the operating
    system.


    Due to its low cost compared to hardware arrays, VMware Workstation helps to level
    the playing field in quality assurance for smaller companies.


    # 1.4.2 VMware Networking and Testing


    Because VMware’s host–only networking mode does not require a physical network,
    you can experiment without having the hassle of running wires and setting up.
    If you have a peer-to-peer program, you can test it between your host and guest
    systems to your heart’s content. Another advantage of this scheme is that you
    are isolated from your real network (if you have one). You won’t have to bother
    your administrator when you need a new IP address for experimentation, and if
    you saturate the host–only network, you won’t need the network administrator knocking
    on your door.


    Furthermore, you can test your network programs between different operating systems
    without any additional equipment. With host–only networking, your guest system
    isn’t limited to talking to the host system; you can run more than one guest at
    the same time and the systems talk to each other. For example, you can see well
    a web server running on FreeBSD interacts with Internet Explorer on Windows NT,
    all on a Linux system.'
