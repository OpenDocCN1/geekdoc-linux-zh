  md: '# Chapter 10: Network Services


    Because Windows passwords have a different encryption scheme than Unix passwords,
    you can''t use the same password transmission scheme between Unix and Windows.
    Therefore, when you encrypt passwords to use, SAMBA uses an auxiliary password
    file.


    This file, /etc/vmware/vmnet1/smb/private/smbpasswd holds just encrypted passwords,
    but also some assorted information for smbd. This file looks likely the /etc/passwd
    file on your Linux host; it also works in conjunction with the regular system
    password file. The following sections describe some common administrative commands.


    # Adding and Deleting Users


    To allow a user to log in from a Windows guest system and give them access to
    their home directory from that guest system, you must give them an entry to the
    SMB password file. To add the user `username` with the password `passwd`, use
    the command


    ```

    vmware-smbpasswd vmnet1 -a username passwd

    ```


    If `username` isn''t in your /etc/passwd file or map, you''ll get an error: `username`
    must be a valid user on your host system.


    To remove a SAMBA user, edit the smbpasswd file, and delete the line corresponding
    to the user.


    # Changing a Password


    To change the user''s password in the SMB password file, run


    ```

    vmware-smbpasswd vmnet1 username passwd

    ```


    You can remove the password entirely with the -n option, but be sure that no other
    machine on your network has access to the SMB server. Remember that the VMware
    host system can talk to its own host-only interface, if you have other users on
    your host machine, you might want to either remove access to the host in your
    configuration or forget about removing passwords altogether.


    # Disabling and Enabling Users


    To disable a user, run


    ```

    vmware-smbpasswd vmnet1 -d username

    ```


    To enable access, use -e instead of -d.


    # Sharing SMB Password Files


    If you set up more than one-only or NAT network and also have more than one vmware-smbd
    running (which means you''ll have more than one smb.conf file), you can use the
    same SMB password file for all of the vmware-smbd-processes. Find the line in
    each of your smb.conf file that reads something like this:


    ```

    smb passwd file = /etc/vmware/vmnet1/smb/private/smbpasswd

    ```


    To share one smbpasswd file, set this line in all of your smb.conf files to the
    same thing.'
