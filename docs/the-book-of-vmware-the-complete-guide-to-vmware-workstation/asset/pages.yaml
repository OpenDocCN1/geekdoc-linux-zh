    # # 11.3.1 Windows File Extensions


    You may have noticed that there doesn''t seem to be a consensus on what extension
    floppy image name should end with. VMware Workstation uses .flp for floppy disk
    images, WinImage uses .JMA, Floppy Image uses .IMG–there are several others.


    The right approach is to use whatever extensions your program accepts. VMware
    Workstation doesn''t care about the extension except when file browsing. The only
    important thing to consider with VMware is file size: A 144–MB floppy image must
    be exactly 1,474,560 bytes long.


    # # 11.4 Creating CD–ROM Images


    Because VMware Workstation 3 and higher allow you to attach a CD–ROM image directly
    to a virtual machine, you can move large amounts of data from a host operating
    system to guest with a virtual CD–ROM drive. However, keep in mind that this assumes
    you don''t have use of the network; if you do have networking support on your
    guest system, it''s much faster to use the network file utilities described in
    Chapter 9.


    Aside from file transfer, another application for CD–ROM image files in VMware
    Workstation is the testing of bootable CDs. You can create bootable CDs on your
    host operating system, attach them to a virtual machine, and test the boot process,
    without leaving the comfort of your host operating system.


    The most common type of filesystem on CD–ROMs is ISO9660. The following two sections
    describe how to create image files in this format for each host operating system.


    # # 11.4.1 Linux Host


    The standard utility for creating ISO9660 images under Linux (and other Unix variants)
    is called mkisofs. It is free, comes with almost any Linux distribution, and on
    the command line.


    To create an image named mycd.iso containing the entire directory structure in
    dir, use


    ```

    mkisofs -o mycd.iso dir

    ```


    where options can include the following:


    | -T: | Use the Rock Ridge extension. Use this if you intend to use the image
    primarily with Unix guest systems; enables the use of the long file name. |

    | -J: | Use the Joliet extension. This if you want to use the image with Windows
    guest systems. |

    | -b boot_image: | Create an El Torito–style bootable ISO9660 image. The boot_image
    value must be a bootable floppy disk within the dir hierarchy. |


