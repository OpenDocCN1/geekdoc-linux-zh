  md: '# Chapter 4: Virtual Machine Configuration and Operation


    **A Virtual Disk** is a VMware disk within a file on your host operating system.
    It is dynamic; that is, the space it requires depends on how much the guest operating
    system uses. A virtual disk is the only type of disk you can shrink, and its maximum
    sizes are 128 GB (Windows host), and 64 GB (Linux host).


    When you create a virtual disk on either host operating system, you must give
    it a new and unique file name and a capacity. On a Windows host system, the Add
    Hardware Wizard also has an Advanced button that you can use to choose between
    an IDE and SCSI virtual disk. On Linux systems, you make this by clicking empty
    slots in the device map. Also on Linux systems, you must click Create to create
    the disk if it doesn''t exist already.


    **Enable/Disable caching** turns VMware''s write buffer for the virtual disk on
    or off. If you turn off, all writes to a disk go immediately to the files. This
    hinders performance somewhat, but you may need to exchange a disk between the
    host and guest operating systems. You can also disable write caching on plain
    and raw disks.


    **The Defragment** button straightens out the blocks in a virtual disk. VMware
    writes each new block to the end of a virtual disk. However, because guest operating
    systems do not write blocks in the order that they would appear on an actual disk,
    blocks get scattered. This may affect performance to a degree if your operating
    system makes assumptions about the characteristics of contiguous disks. Defragmenting
    a virtual disk puts blocks in the same order as they appear on a real disk (it
    does not change the size). You can defragment a virtual disk when your virtual
    machine is off.


    # **Physical (Raw) Disks**


    **The Physical Disk** (Windows host) or **Raw Disk** (Linux host) device type
    offers an entire real disk to the guest operating system. This is usfully for
    a dual-boot machine, where you have installed Linux and Windows on different disks
    and/or partitions. Raw disks are an advanced feature of VMware Workstation intended
    for experienced users.


    Note VMware has safety features for raw disks, including the ability to make certain
    partitions as read-only or unreadable, so you can protect yourself from accidentally
    wiping out something on your host system.


    Adding a raw disk on a Windows host involves these steps:


    +   1. In the Add Hardware Wizard, choose **Use a physical disk** and click **Next**.


    +   2. On the next screen, pick the appropriate disk for your host system and
    click **Next**.


    +   3. Customize the raw disk''s partition access. See "Partition Access" on page
    58 for a description of this screen. After you''re done, click **Next**. (You
    can change the partition access later, so don''t worry about making a mistake
    here.)


    +   4. Choose a unique name for the raw disk map file on the host system. The
    default should be fine. The **Advanced** button on this screen allows you to connect
    the raw drive to any place on the virtual machine, though you can change this
    later. Click **Finish** when everything is ready.'
