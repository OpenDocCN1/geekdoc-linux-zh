  md: '# Chapter 4: Virtual Machine Configuration and Operation


    To use an existing plain disk, choose Plain Disk as the device type and enter
    the pathname of the plain disk map file (it should end with .pln). Plain disk
    map files refer to pieces of the disk extents.


    # VMware Disk Modes and Names


    You can use Mode to set the disk mode any time you create a disk for your virtual
    machine. These modes are available because all disk access on a virtual machine
    goes through VMware first, making a few extras possible.


    Persistent mode makes all disk writes immediate and final. This is the fastest
    mode and works differently from a real disk on any other computer.


    Nonpersistent mode makes the actual disk device file read-only, but it offers
    a read-write file to the guest system. VMware intercepts writes from the guest
    system and puts them in a redo log file instead. VMware throws away a nonpersistent
    disk''s redo log when you power off the virtual, leaving the original data intact.
    Therefore, any files or changes you make on the guest system disappear after you
    power off. If you want to change the changes, use undoable mode.


    Undoable mode adds features to nonpersistent. Instead of throwing away the redo
    log when you power off the virtual machine, VMware can merge the changes from
    the redo log back into the disk or keep the log available to use when you restart
    the machine.


    Turning off a virtual machine with disks in undoable modes results in a dialog
    box with three options. You can Commit to incorporate all changes to the original
    disk device file, Discard to get rid of them, or Keep to retain them for later.
    If you choose commit, you may have to wait a while for VMware to write all of
    the changes back, especially if you made some large software installations on
    your guest system. Discard is like an undo button, except that you can''t undo
    the changes you delete the


    Whenever you turn on a virtual machine with undoable disks, VMware looks for a
    redo log. If the log exists (for example, if you pressed the Keep button mentioned
    above), a pop-up window appears with four options: Commit and Discard to merge
    or throw away the changes (just as when powering off), Append to continue using
    the log, and Cancel to abort the halt and virtual machine power until you figure
    out what you want to do with the log.


    On both Windows and Linux hosts, disk files associated with each kind of disk
    have different names. It is important to know where these files are because they
    have a tendency to get large, using resources on your host system. You may want
    to move them if you have more than one disk or partition on your host system and
    you''re running out of space.


    Note By default, virtual disk files end with .vmdk, plain disk files have a .pln
    extension, the plain disk extends described in the config file have a .dat suffix,
    and redo log files use .raw. Under Linux, you don''t necessarily need to follow
    these conventions, though doing so is always helpful for quick identification.
    VMware normally stores disk redo logs with the rest of the virtual machine''s
    configuration, files ending in .REDO. For resource- and performance-related reasons,
    you can change the location of these files in the Configuration Editor by entering
    a new path in Redo Log Directory, under Misc. Because VMware stores an entire
    disk block in its log, if you modify anything in the block, your log files can
    get large, even if you write only a relatively small amount of data to the disk.'
