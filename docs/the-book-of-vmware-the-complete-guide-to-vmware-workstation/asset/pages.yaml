    # 10.7 Unix Printing


    The next few sections describe how to print from a guest operating system (Linux,
    FreeBSD, NetBSD, or OpenBSD) over a VMware network. Here are a few basic points
    about Unix printing:


    +   - Unix print clients send PostScript output. If a connected printer does not
    understand PostScript, a Unix printing subsystem translates it from PostScript
    to whatever that printer understands.


    +   - The Unix printing system daemon is lpd. However, there are three LPD varieties:
    Berkeley LPD, LPRng, and PLP. Examples in this book are compatible with all three.


    +   - The main print configuration file on Unix systems is /etc/printcap.


    +   - Consistency is not a strong point of Unix printing.


    # 10.7.1 Printing from a Unix Guest to a Unix Host


    It''s fairly easy to get a Unix guest system to send print jobs to a Unix host:


    +   1. Set up your guest system''s /etc/printcap file. This example assumes a
    host-only or NAT network with the host at 172.16.144.1. The printer name on the
    host is myprinter.


    ```

    lp|host|hostprinter:Host System Printer:\n:lp=-d=/var/ spool/lpd/host:\n:mx0=rm=172.16.144.1:rp=myprinter:

    ```


    +   1. Create a spool directory called /var/spool/lpd/host on the guest and make
    sure that the print daemon (normally running as user daemon) can write to this
    directory.


    +   2. Add the guest systemname or IP address to the host system''s /etc/hosts.lp
    file.


    # 10.7.2 Printing from a Unix Guest to a Windows Host


    Unfortunately, printing to a Windows host from a Unix guest can be difficult.
    You must overcome two obstacles: need to send the print job through SMB, and possibly
    process PostScript files in the target printer''s language. If you can connect
    to your host''s printer directly through a parallel port and configure it as a
    local printer, you should probably choose that, because things are going to get
    ugly otherwise.'
