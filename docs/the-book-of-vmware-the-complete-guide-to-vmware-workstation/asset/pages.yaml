  md: '# # Chapter 3: Installing VMware Workstation


    # ## Overview


    Installing VMware Workstation on both Windows and Linux systems is straightforward,
    and VMware Workstation attempts to keep itself self-contained for easy administration.
    While there are naturally a few things on the system that VMware must slightly
    alter (for example, the host operating system startup sequence), the installation
    process doesn''t try to hide this from you.


    This chapter tells you how to install VMware. It also tells you the locations
    and significance of the files that the installation creates on your.


    You''ll need to answer several questions during the installation process. Because
    installation is substantially different between Windows and Linux platforms (the
    Linux version has a few more components), this chapter is divided into two parts.
    Information about the VMware Workstation for Windows comes first. For Linux, just
    skip to page 21 after reading the requirements in the next section—you won''t
    miss anything. Also, there are many more variables and transparency in a Linux
    host installation than the process for Windows, which is devoted to the Linux
    version of VMware.


    This chapter also includes a reference to the files that the VMware Workstation
    installation creates. If you''re a VMware Workstation for Linux user, you''ll
    also learn about an additional configuration script, `vmware-config.pl`, that
    you''ll need to run from time to time.


    # ## 1 Host System Requirements


    VMware Workstation doesn''t require much hardware on your host system. Your processor
    must be a Pentium or better (Intel or AMD chip made within the past few years
    should do). Technically, it doesn''t matter what speed of processor you have,
    but VMware, Inc. recommends 266 MHz at a minimum, and 400 MHz or more for the
    best performance. VMware Workstation warns that your computer may not be powerful
    enough if you try to run it on a lesser machine.


    Ultimately, the processor requirements boil down to the guest system: If you''re
    running a guest that doesn''t make use of the CPU (for instance, a Linux system
    in text-only mode idling most of the time), you may be able to get by a system
    with a lower CPU speed.


    Memory is another story. Your guest system will require as much memory as a virtual
    machine as it does on a real machine, so add your host and guest requirements
    together to get the amount you need. For example, if your experience running Windows
    2000 on real hardware is painful with anything less than 128 MB, and your host
    is a Linux system that''s with 64 MB, plan on at least 192 MB. The official VMware
    numbers are 128 MB minimum and 256 MB recommended. Again, this depends on which
    guest operating systems you plan to run. However, keep in mind that insufficient
    memory will devastate performance on all host and guest machines—unlike a slow
    CPU, which may slow down only by a factor of two or so.


    You should set your graphics to 16–bit color or better. In Windows NT/2000/XP,
    look at the Settings tab on the Display screen on the Control Panel. You should
    set the palette to 65536 colors or true color. On a'
