    # 9.6 Hostname Lookup


    When you set IP networking in a guest operating system, one of the most important
    configuration steps is setting up hostname resolution of some sort. Without it,
    your host and guest systems won''t be able to convert names to IP addresses for
    the VMware network, and the problems you may encounter range from minor annoyances
    (typing IP addresses instead of names) to major breakdowns, because some services
    fail if they can''t resolve hostnames.


    Setting hostnames on a virtual machine with bridged networking is no different
    than doing so for any other node on your local network area because the machine
    can talk directly to a DNS server. However, a host-only network without extra
    provisions (such as NAT) cannot do this, so you have provide some extra hints
    to both the host and guest operating systems.


    # 9.6.1 Creating a Hosts File


    The easiest way to add hostname mapping is to create a hosts file. Though the
    file format is the same across all types of host and guest systems, the location
    is not. Here are the locations:


    | Unix | /etc/hosts |

    | --- | --- |

    | Windows NT/2000/XP | \WINNT\system32\drivers\HOSTS |

    | Windows 95/98/Me | \WINDOWS\HOSTS.SAM |

    | Windows 3.x | varies; it''s easy to do a search |


    (For some NT-based installations, you may need WINDOW instead of WINNT.) The hosts
    file is a plain-text file, so you can use any text editor to change it. To get
    hostname resolution working for a host-only network, do the following:


    +   1. Change the hosts file on your host system. The easiest way to understand
    the process is to look at an example. Say that your system, blubber, has a real
    connection to 10.2.2.1. It has a host-only networking interface and a FreeBSD
    guest called 172.16.144.20. In such a case, the file on your host system should
    include lines like these:

    ```

    blubber

    10.2.2.1

    # These are for VMware host-only or NAT network

    172.16.144.1    vm-host      # winnet! host-only/NAT interface

    172.16.144.20   flog          # FreeBSD guest operating system

    ```

    Note The vm-host name should not be the domain name of your host system, because
    this will cause problems with internal services.

    2. Create the hosts file on your guest system(s). Continuing with the example,
    this would be the'
