  md: '![](img/aa552d73360a647bd96f567236c5ca1a_156_0.png)


    There are several advantages to using NAT over bridged networking:


    +   - You don''t need to get another IP address for your guest system.

    - NAT works on all kinds of network interfaces; bridged networking works only
    with Ethernet.

    - Because NAT is a special kind of firewall, your guest operating systems are
    much less vulnerable to external attack.

    - NAT works over suspends on notebooks. When using NAT, you can suspend a virtual
    machine on a notebook, shut down the notebook, and move it to a different network,
    and when you resume the virtual machine, the NAT setup allows networking to continue
    functioning.


    NAT doesn''t work with all IP-based protocols without help, because it allows
    the opening of an initial connection from a client behind the NAT router to a
    server on the Internet (it does not work in the other direction). One classic
    of a problematic protocol is FTP, where the server wants to connect back to the
    client. Many implementations (Linux in particular) have extra plug-in modules
    to enable certain protocols. However, the vast majority of network protocols in
    use today work fine with NAT.


    # 9.7.1 Configuring VMware NAT Networks


    VMware NAT networks are based on host-only networks, so configuration is nearly
    identical to host-only networks. If you let VMware configure the host interface
    for you at installation time (or with vmware-config.pl on a Linux host) and tell
    the guest systems to configure themselves with DHCP, everything works smoothly.'
