  md: '# Chapter 3: Installing VMware Workstation


    # /etc/vmware/vmnet Directories


    If you configured VMware with host-only NAT networking, you may have one or more
    vmnet directories in /etc/vmnet. These directories contain the configuration files
    for the utilities that run on each vmnet host-only network interface. We''ll talk
    more about this in Chapter 9.


    # not_configured


    You may have a not_configured file in /etc/vmware, a flag telling VMware service
    startup programs that you need to run vmware-config.pl before running VMware.
    This file may appear if you choose not to run vmware-config.pl during the installation
    process, or if the VMware boot script (/etc/init.d/vmware) failed to run any of
    its components. It may also appear if you boot vmware-config.pl.


    You would typically remove not_configured by running vmware-config.pl, though
    it was created because you were testing a new kernel (or booting from an emergency
    backup) and caused the boot script to fail, you can remove the file after going
    back to your old kernel.


    # Device Files


    The VMware installer creates a number of special files in /dev. The vm module
    controls the /dev/vmdev, and the vmnet modules /dev/vmnet*. In addition, you may
    not have the /dev/parport* devices required for bidirectional parallel ports on
    your system; the installer creates these if necessary.


    # 3.14 Upgrading VMware Workstation for Linux


    To upgrade VMware Workstation for Linux, use the vmware-install program that comes
    with the VMware archive, or if you are using .rpm archives, use the Red Hat rpm
    program. When you run the installer, you should see messages like the following:


    > A previous installation of VMware has been detected.

    The previous installation was made by the tar installer (version 2).

    Keeping the tar2 installer database format.


    Unblocking the tar installation of VMware.


    At this point, the installer looks for the old installation and attempts to remove
    it before proceeding. It may spit out some diagnostic messages like this:


    This script previously created the file /lib/modules/2.2.14/misc/vmppuser.o, and
    was about to remove it. Somebody else apparently did it already.


    In this particular case, somebody upgraded the Linux kernel and removed the entire
    /lib/modules/2.2.14 directory. (This kernel upgrade may be why you are upgrading
    VMware in the first place.)


    Then, during an upgrade, the installer runs through all of the questions about
    which directory to store the binary, library, manual, and documentation files.
    You may remember these questions from the first time'
