    need to make your system create these files at boot time after you add new hardware
    (a process called reconfiguring the devices).


    # Reconfiguring Devices


    There are two basic ways to initiate device reconfiguration. One way is to enter
    -r when you get the boot prompt (this tells you to enter b o or i to run an interpreter).
    The other way is to boot your system normally and create a trigger file and reboot
    when your system is up, with these commands:


    ```

