    # 8.3 Novell Network


    Though primarily a network software package, Novell Network Server comes with
    its own set of device drivers (for network interface cards, in particular). These
    special drivers work under VMware Workstation, though VMware''s support for Netware
    is experimental at this writing. (Netware was originally DOS, but it moves further
    from DOS with each release.) We''ll discuss Net Server 4 and 5 in this section.


    # 8.3.1 Configuring Your Virtual Machine and Installing Netware


    It''s fairly simple to install every version of Netware on a virtual machine because
    the CD installation process works. To do, first configure your virtual machine,
    including all serial and parallel ports. For Server 4, use 48 MB for the guest
    system memory size. In Server 5, the required amount is 128 MB, though you may
    be able to get away with 64 MB. Use a virtual disk with a 2-GB capacity for purposes.


    For Server in particular, it''s likely that you will also want your virtual machine
    to talk to something on your real network. Therefore, you''ll want to use VMware''s
    bridged networking instead of the host-only or NAT networks (unless, of course,
    you are testing the server with clients on other VMware guest systems).


    # Create a Partition


    Netware requires a small DOS partition to boot. Server version 5 comes with DOS
    7, so all you need to do is boot your virtual machine from the CD. For Server
    4, you need to create the partition yourself (Section 5.3.3; for do not use FreeDOS.)


    This boot partition should be allocated between 50 to 60 MB in size; leave the
    rest of the disk blank. The important part of installing DOS for a Netware 4 installation
    is that you need the CD–ROM drive so that you can run the installer on the Server
    4 installation.


    Hint Make a copy of your virtual disk as soon as you install the partition so
    that if you mess up the Network installation, you''ll have a backup. You can use
    a program such as FIPS on the copy to resize the DOS partition later if you need
    to use the DOS partition for something else.


    # Install the Software


    Now you need to install the software and make a few customizations for VMware.
    In particular, you need to install a CPU idle program as DOSIDLE, described in
    section 5.6.1, or your virtual machine will drain any CPU time that your host
    system allows, impairing performance on the host and the guest. You can get these
    from the VMware website; to locate them, use the search function on nw4-idle.nlm
    and nw5-idle.nlm.'
