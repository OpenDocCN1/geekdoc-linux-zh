  md: '# Chapter 9: Host and Guest System Network Configuration


    However, there are several opportunities for customization. Most settings are
    in the NAT configuration file. This is C:\WINNTsystem32\vmnat.conf for a Windows
    host system and /etc/vmware/vmnet8/nat.conf for a Linux host. The file is divided
    into sections, denoted with [section], where section is the name of the section.
    Here is an overview of the parameters in each section:


    # [host]


    Parameters here relate to VMware Workstation and the host operating system.


    +   * ip: The IP address of the NAT router on the internal VMware (host-only)
    network.

    * hostMac: The hardware (Ethernet) address of the NAT router; not necessary on
    Linux host systems.

    * device: The VMnet device to use on the host system. Examples: VMnet8 on a Windows
    host, /dev/vmnet8 on a Linux host.

    * activeFTP: Setting this to 1 enables PORT and EPRT commands for FTP. You need
    this if you want FTP to work on guest operating systems.

    * allowAnyOUI: OUI stands for organizationally unique identifier; it is the string
    of the first three bytes of an Ethernet MAC address. You can change the MAC address
    of your virtual machine''s Ethernet cards to anything you like (see section 9.10),
    but if you change the OUI, NAT will not work unless you turn on this option.


    # [udp]


    This section tweaks datagram protocol (UDP) settings. UDP is a data protocol,
    like TCP.


    +   * timeout: Amount of time, in seconds, to wait for a response assuming that
    a remote host has dropped a UDP packet. (Servers are allowed to drop UDP packets.)


    # [incomingcp]


    NAT in VMware Workstation has an incoming port feature that allows you to connect
    to ports on a guest operating system on a NAT network through the host operating
    system. The NAT system listens on a port on the host system and sends any connections
    directly to guest systems, tracking the connections as it goes.


    For example, let''s say you want to be able to access a web server on a guest
    system. If the web server on that guest system on a NAT network with IP address
    172.16.144.98 listens on its port 80, then you can tell VMware Workstation to
    make the server available at port 8080 on the host machine with this line:


    ```

    8080 = 172.16.144.98:80

    ```'
