  md: '# Chapter 10: Network Services


    access the Linux host''s filesystem. By answering yes, you create a /etc/vmware/vmnet1/smb
    directory containing the configuration files (for NAT networking, the directory
    is /etc/vmware/vmnet8/).

    The vmware-config.pl script also asks whether to add any users. If so, the username
    provide must be one that already exists on your system host. For each user, VMware
    creates a new entry with a password in the SAMBA password file. This is not the
    same as your /etc/passwd file. See section 10.1.1 for information on the password
    file. If you are not interested in SAMBA server details, skip to section 10.3
    of the attached newly shared file to your Windows guest system.


    # 10.1.1 The SAMBA Server Side


    The SAMBA server consists of two daemons: smbd, which handles the actual work
    of serving data, and nmbd, NetBIOS-over-IP nameserver. In VMware, they''re called
    vmware-smbd and vmware-nmbd; you will find them in the same place as the rest
    of the VMware binaries. The main SAMBA configuration file for both daemons, found
    in /etc/vmware/vmnet1/smb or /etc/vmware/vmnet8/smb, is smb.conf.


    The configuration file has several sections. This first contains a set of global
    parameters denoted with [global], the [brackets] denote a section in the configuration
    file). The vmware-config.pl script describes the socket address, interfaces, and
    bind interfaces only.


    The socket address identifies the IP address of the host machine''s network interface—in
    the case VMware''s host-only or NAT interface. The interfaces parameters manage
    a subnet for the servers. The monitor parser says that the servers respond only
    to instructions from requests listed by the interfaces parameter. This interfaces
    parameter is important because it blocks any access from outside networks. Here
    is an example:


    ```

    socket address = 172.166.144.1

    interfaces = 172.166.140/255.255.255.0

    ```


    Aside from [global], all other sections of the smb.conf file correspond to network
    shares. There are two sections with special meanings: [homes] and [printers],
    for sharing a dynamic number of home directories and printers. Referfer to page
    183 for [homes] and page 187 for [printers].


    # SAMBA User Management


    For guest operating systems to communicate with the SAMBA server, they must log
    in with a username and password. Two lines in the server''s smb.conf [global]
    section control how users send passwords to the server. They are


    ```

    security = user

    encrypt passwords = yes

    ```


    The security parameter sets the type of access control. The security is the only
    setting that makes sense with the VMware version of SAMBA. The user specification
    instructs SAMBA to match usernames that Windows clients send with the ones in
    the host machine''s /etc/passwd file.


    Now that the server knows about usernames, it needs to know how to verify the
    passwords that Windows clients send. The encrypt passwords parameter control the
    way that the host asks the guest to send a password.'
