    # 9.7 NAT Networking


    VMware Workstation 3.0 and offer an additional network interface for virtual machines
    with NAT networking. Under VMware Workstation, these are host-only networks with
    an additional feature that allows guest operating systems to talk to the outside.
    Therefore, it is an alternative to bridged networking.


    NAT stands for network address translation. In this scheme, the guest operating
    system does not have a Internet connection, but talks to a special router. When
    the guest system makes a connection to the outside world, the following occurs:


    +   1.

    The connection goes through the router.


    +   2.

    Rather than sending the connection directly to its destination, the router tracks
    the connection by recording the source port and destination port. The router records
    this information in a translation table.


    +   3.

    The router opens its own connection to the outside world to the destination point.


    +   4.

    When traffic from the source machine goes to the outside world, the router looks
    up it in the translation table and filters it out the connection it made in step
    3. Similarly, the router sends any traffic from the other end of the connection
    in step 3 to the original host in its translation table.


    Figure 9.3 shows a logical diagram of a VMware NAT configuration. There is an
    extra node on the internal network for the address translator; notice how it connects
    to the outside world. If you''ve worked with NAT before, you might think it is
    a little odd that the host system connection does not handle the address translation.
    The VMware approach is different because it requires no additional support from
    the host operating system.'
