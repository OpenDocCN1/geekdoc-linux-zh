    # 7.6 The FreeBSD Boot Manager


    For the most part, you probably won''t need to change the FreeBSD loader. Unlike
    Linux Loader (LILO), it can actually look inside the BSD filesystem and load a
    kernel based on a file name, without having to make a map of the doable blocks.


    The FreeBSD loader uses a language called Forth to do much of its work. You''ll
    find the configuration in /boot directory. For the most part, you''ll typically
    want to make only cosmetic changes. Look in /boot/defaults/loader.conf for the
    default configuration. If you want to change anything, put the update in /boot/loader.conf.'
