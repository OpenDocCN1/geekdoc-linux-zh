  md: '# Chapter 6: Linux Guest Operating Systems


    # 6.8 Linux System Information


    The /proc filesystem is a valuable source of information about a currently running
    Linux system. The items in /proc look like files to normal Linux programs, but
    the /proc kernel generates the actual content dynamically. To look at something
    in the filesystem, such as /proc/meminfo, just use cat /proc/meminfo, or if the
    output is too large, use less instead of cat.


    /proc/meminfo: Memory information. The output indicates how much real memory is
    available to the system, how much is used, and how much of that is shared with
    more than one process, as well as buffer and cache utilization statistics.


    /proc/cpuinfo: Processor information. Don''t believe everything you see here if
    Linux is running under VMware. While things will look like they do on your real
    hardware, VMware interferes with any of the algorithms used to calculate some
    entries. One is the CPU MHz value. For example, an AMD K6–3/400 usually comes
    up around 45 MHz when running under VMware (and that doesn''t mean VMware speeds
    up the processor). However, if you''re curious about the bogomips entry, you can
    be assured that it is just as worthless on a virtual machine as on a real machine.


    /proc/devices, /proc/misc: A list of devices, along with device numbers. Be careful
    about this; some devices don''t appear because they aren''t in use, and may show
    up even they are currently disconnected from the VMware level (remember that VMware
    makes disconnected devices until you connect them).


    /proc/mounts: List of mounted filesystems. Although the system attempts to keep
    the information in /etc/mtab, this is the most reliable indicator of the systems''
    currently attached filesystems. It doesn''t show the mount options, though,


    /proc/filesystems: Filesystem types known to the current kernel. This information
    can be misleading, because most distributions include nonsensential filesystems
    as modules. When the system needs a new filesystem type, the automatic kernel
    module loader looks for a module with that name and runs probe on it. After, the
    module shows up in /proc/filesystems.


    /proc/partitions: Disks and partitions known to the current kernel. With removable
    media, in some cases the kernel doesn''t see a partition until some accesses the
    device after a media change. SCSI disks may act this way as well.


    /proc/version: The currently running kernel version.


    # 6.9 Booting Linux: LILO


    Linux distributions install a small program called Linux Loader, or LILO, on the
    boot block of a hard disk. Typically, you''ll want this boot block on your first
    hard disk, /dev/hda. You specify LILO''s configuration with /etc/lilo.conf file.
    Here is a typical example:


    ```

    boot=/dev/hda

    root=/dev/hdal

    install=/boot/boot.b

    map=/boot/map

    ```


    102'
