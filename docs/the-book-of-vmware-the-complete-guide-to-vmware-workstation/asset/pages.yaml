    # Adding a Disk


    To add a disk to FreeBSD, you must first determine the kind of partitioning scheme
    you want to use, run any necessary formatting programs, and determine what the
    disk devices are so that you can create filesystems and attach them to your system.


    For the reasons mentioned earlier, you should probably use Fdisk to create PC-style
    partitions (slices) of your new disk if you''re planning to use the whole disk
    for FreeBSD (if you''re adding a new virtual disk to VMware, this is likely the
    case). The easiest way to do this is to run /stand/sysinstall, which Configure
    asks you about the beginning and size of a C partition, it expects an answer in
    sectors, and then select Fdisk. When sysinstall asks you which are typically 512
    bytes long, also called blocks.


    You should try to place a FreeBSD slice on cylinder boundaries. Fdisk displays
    a line like this at the top of its screen:


    ```

    Disk Geometry: 216 cyl/15 heads = 204120 sectors (99MB)

    ```


    This means that there are 216 cylinders on the disk, 15 heads, 63 sectors per
    track, and 204,120 sectors on the whole disk. To get the number of sectors per
    cylinder, divide the total number of sectors on the disk by the number of cylinders
    on the disk (in this case, the result is 945).


    Note If you opt to use another operating system''s partitioning utility, remember
    the ID for a FreeBSD slice is decimal 165. There''s also another way to create
    PC–style partitions under FreeBSD: with the fdisk program. It''s not an extremely
    friendly friend, but it works. If you want to use it, you should carefully read
    its manual page.


    # A Practice Disk


    VMware gives you a chance to format disks with virtual disks, create a new virtual
    disk with the Configuration Editor. You can make any size you like; for the rest
    of this section, we''ll assume it''s a 100–MB virtual disk with 215 cylinders,
    63 sectors per track, 15 tracks per cylinder (945 sectors per cylinder), and 204,120
    sectors on the disk. Follow this procedure for the practice disk:


    +   1. With the VMware Configuration Editor, create a new virtual disk at your
    primary slice (/dev/ad1).


    +   2. Run /stand/sysinstall for Fdisk and dedicate the whole disk to FreeBSD
    slice 1, /dev/ad1s.


    +   3. Label the slice with BSD partitions. There are two ways. One procedure
    is interactive; you can use /stand/sysinstall, choosing the Configure – Label
    option. However, the disk program might be a better choice. In this example, running


    ```

    disklabel /dev/ad1 > ad1s_geom

    ```


    places the disk in a file called ad1s_geom. You can edit it, making desired changes.
    You''ll find disk geometry information at the start of the file, and this information
    at the end:


    ```

    # 8 partitions:

    # size offset ftype [fsize size bps/cpg]

    ```'
