    # 6.5.4 Additional VMware X Server Information


    Unlike most drivers, FreeX86 servers and their driver modules are meant to provide
    almost any resolution and depth without conflict. FreeX86 lets you get away with
    anything; if you want a resolution of 800x100, that''s fine, as long as you can
    figure out the monitors timings.


    The VMware X server takes one step further; because it runs through a virtual
    display, you can really define the resolution any way you like.


    If you look at the Monitor section in the XF86Config file provided by VMware (and
    you should), you''ll see a number of display sizes that aren''t standard (such
