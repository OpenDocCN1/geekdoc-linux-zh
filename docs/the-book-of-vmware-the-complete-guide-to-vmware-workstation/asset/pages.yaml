    get to that shortly.)\2. In this same directory, for the host key files. All key
    files begin with a ssh_host_ prefix. There should be three sets. If the file name
    contains rsa or dsa, it is for the SSH version 2 protocol. The other key are for
    SSH version 1. Anything with a .pub suffix is a public key. However, anything
    without a suffix is a private key. Don''t let anyone see those.\3. If you''re
    missing these keys, create them manually (or put them in the same directory as
    the one that contains the sshd_config file). Use the following for the version
    1 key pair:


    ```

