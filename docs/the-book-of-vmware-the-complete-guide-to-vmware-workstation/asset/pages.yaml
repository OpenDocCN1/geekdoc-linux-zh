    program that you need to use every and now, and FreeDOS offers more than the usual
    DOS commands, including several Unix-like utilities, which behave differently
    from the comparable DOS utilities, but better online usage hints.


    FreeDOS has a number of other uses, for instance, its installation floppy contains
    versions of FDISK and FORMAT if you need to partition a disk and put a filesystem
    on it. You may also find more comfortable to use than DOS—its command-line interface
