    # 8.4 Solaris


    The Solaris Intel Platform Edition is a port of Sun Microsystems’ SunOS 5.x operating
    system to the IA-32 architecture. Its behavior is nearly identical to that of
    Solaris on the SPARC architecture, and it works as a guest under VMware Workstation
    for Linux.


    Note Solaris’s version number can be confusing. Solaris 2.x is identical to SunOS
    5.x. However, somewhere along the line, Solaris decided to drop the first digit
    and the dot, Solaris 2.8 is the same as Solaris 8. Solaris 2.x is a System Release
    4–based Unix system, and Solaris 2.8 is free for up to 99 computers with 8 processors.


    One unfortunate aspect of Solaris under VMware Workstation is that it supports
    the x86 HLT interrupt (discussed earlier). When the Solaris kernel runs idle,
    it busy-waits, unlike DOS which has nothing to do, as described in section 8.1.
    As described busy-translates into wasted real CPU time for the VMware process,
    and as a result, your host system runs more slowly than it did.


    In fact, this density means you can’t effectively run Solaris 8 under VMware all
    the time, sitting in the background, nor can you run it as a server without penalty.
    However, Solaris under guest is great for testing portability, running a Solaris-only
    program now and then, and looking up Solaris system characteristics.


