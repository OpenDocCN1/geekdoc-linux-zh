  md: '# # Chapter 11: Non–Networked File Transfer


    # ## Overview


    Although the most convenient way to transfer files between host and guest operating
    systems is with VMware''s networking features, you may not want to (or have the
    ability to) use the network.


    As an alternative, you can use VMware''s floppy, CD-ROM, and virtual disk devices,
    which are handy for transferring small files or making small changes to a guest
    operating system, when you''re first setting up one except (because you may not
    have networking support). Also, if you have to work with a DOS guest, you may
    find it preferable to work with VMware''s virtual devices because you won''t have
    to bother with the TCP/IP stack (or other network protocol software) that DOS
    requires for networking.


    Most of this chapter deals with floppy disks and CD-ROM images. Because you can
    attach a file to a VMware virtual floppy, and guest systems know how to read a
    FAT–filesystem on a floppy disk, you can transfer a file from the host to the
    guest and back through a floppy disk file on the host operating system. The case
    is similar for CD-ROM images, except that while you can store much more on a CD–ROM
    image, you can transfer only from the host to the guest system.


    # ## 11.1 Disk Images


    A floppy disk image is simply a file with an exact copy of all data that a floppy
    disk would contain, including the entire filesystem structure.


    The particular procedure for accessing floppy disk images depends on your host
    system. Due to the uniform block device mechanism in a Unix system, it''s unusual
    to have more flexibility on a Linux host. Block devices are a type of driver;
    all disks operate on block devices.


    Single floppy disks don''t hold much data, so if you need a way to transfer larger
    amounts of data from a host to a guest without networking, you should use a CD–ROM
    ISO9660 image to attach to VMware Workstation virtual CD–ROM drive. We''ll talk
    about how to create CD–ROM image files in this chapter.


    In addition, VMware Workstation for Linux includes a utility for attaching a virtual
    disk file directly to the host operating system as a filesystem; we''ll cover
    that in section 11.5.


    # ## 11.2 Disk Image Utilities (Linux Host)


    The Linux kernel includes an extraordinary amount of filesystem support, making
    it possible to access files on almost any kind of media that you can attach to
    a PC, although you probably won''t need all of support when using Linux as a host
    or guest operating system. In fact, when using floppy disks, it''s likely that
    you''ll need the Microsoft FAT–based filesystem, if you work with older Linux
    guest systems, you may find a Minix filesystem here and. You need this filesystem
    support on your host system to be able to write an image onto the floppy disk
    that the guest system can understand.'
  merge: -1
  pgno: 184
