    VMware Workstation: You can log–in from your host system to a Unix guest. This
    approach means that you can avoid switching between your host system and VMware
    windows/full-screen mode at all; all you need to do is switching windows. Furthermore,
    if you use Secure Shell (SSH), you can send graphics through the connection.


    There are several SSH packages. The one we''ll refer to in this book is OpenSSH,
    an implementation from the OpenBSD people. It supports the SSH version 1 and 2
    protocols, and you can get it from http://www.openssh.com/


    # 10.8.1 Installing and Configuring the SSH Server Software


    Binaries for the SSH server software are available for Red Hat Linux systems but
    for most implementations, you''ll need to get the source code and build it from
    there if it doesn''t already come with your guest system. To compile OpenSSH,
    you need OpenSSL, an implementation of the Secure Socket Layer (SSL) protocol.


