  md: '# # Chapter 1: Introduction


    # ## Overview


    This book is about the VMware Workstation product: how to use it, how to set up
    its guest operating systems, and the things you can do with these systems once
    you have them up and running.


    VMware Workstation functions as a computer within a computer, so that you can
    start up an entire operating system and run any programs for that operating system
    with it, while keeping your original operating environment intact (and usable).
    For example, a Linux user who needs to use a Windows program not available for
    Linux (such as a map downloading for Paul''s GPS) can fire up VMware Workstation
    in a window, start Windows NT, run the mapping software, downloads the maps to
    the virtual port (connected to the real port), and then Windows away for another
    time. It can work the other way around too—Windows needing Linux applications
    can run them in a virtual machine. And that''s just the beginning.


    VMware is a virtual machine (VM) for an Intel Pentium-class or higher machine
    and is available for the Windows NT, Windows 2000, Windows XP, and Linux operating
    systems. Virtual machine software runs on a real machine and provides a virtual
    machine with the same architecture as the real machine. The architecture is based
    on the processor type—for example, the i686 (Intel Pentium II/III) and sun-44u
    (Sun UltraSPARC) are two different architectures.


    On the surface, VMware is similar to an emulator (a machine running on only software),
    but there is a crucial difference between a VMware-style virtual machine and an
    emulator. Whereas an emulator interprets and intercepts every last instruction
    for the machine, a virtual machine passes the work to the real machine sitting
    beneath it. Because the real machine is faster than a software emulator, programs
    running on a real machine run much faster and efficiently than they do on an emulator.
    In addition, you won''t worry about compatibility issues as you would with an
    emulator—the real processor isn''t likely to make a mistake.


    A computer''s processor is tightly coupled to its memory (RAM). VMware takes advantage
    of memory management techniques used in contemporary operating systems to keep
    this coupling in virtual machines.


    However, there has to be emulation in a virtual machine at some level, or the
    virtual machine would just take over the whole computer. In VMware Workstation,
    the emulation comes in two places: peripheral hardware (disks, network cards,
    and so on) and privileged CPU instructions. Even though VMware''s hardware is
    at the software level, you can map your real hardware to the virtual hardware
    so that you can use the real hardware as you normally would. Of course, this takes
    a bit of overhead because the communication between the real hardware and the
    virtual machine has to go a few more layers, but this abstraction also enables
    certain features that more than make up for it. (A specific example is disconnection
    and reconnection.)


    # ## 1.1 Who Should Read This Book


    This book strives to be a complete how-to and reference guide for VMware Workstation.
    Each chapter starts with a hands-on, step-by-step guide to getting one piece of
    the puzzle up running. And then the material'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Chapter 1: Introduction


    shifts into reference—style documentation. Because VMware Workstation runs a wide
    range of operating systems, it''s natural that some material will be a review
    to almost any reader. However, this material will be for every user, depending
    on the operating systems with which the reader is most familiar.


    Because VMware multiplexes a PC, this book discusses pertinent hardware and operating
