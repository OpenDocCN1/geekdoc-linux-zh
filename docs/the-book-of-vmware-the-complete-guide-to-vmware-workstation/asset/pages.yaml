  md: '# Chapter 8: Other Guest Operating Systems


    # 8.6 Oberon''ve talked


    So, we''ve talked about systems that are based on traditional ideas or on some
    variations on older ideas. If you want to try something that''s a little different,
    there''s Oberon, a research operating system from ETH Zürich.


    Oberon is more than an operating system; it also includes a user environment and
    programming language. It has two modes of operation. One is a hosted mode, where
    you run the system under another operating system, such


    as Linux. You can certainly do this in this guest system running under VMware.
    The other mode is a native mode, where Oberon takes over the entire hardware.
    This native mode also works under VMware Workstation.


    One thing to remember about operating systems is that they don''t need to follow
    any rules set by any previous system. That includes the user interface, and Oberon''s
    is unlike anything you''ve ever seen. You could describe it as a hyperlinked-based
    system, which you construct and customize commands within each "document." Therefore,
    the documentation for a program can double as the program''s user interface.


    # 8.6.1 Oberon Installation Hints


    Part of the fun of Oberon is figuring out how the installation process works.
    This will prove invaluable later, because the installer you get with the Oberon
    user interface right away. However, there are some things you should know before
    you dive right in.


    First, you must partition your disk before you boot from the installation floppy.
    To partition your hard disk, whatever boot floppy you can find (FreeDOS works
    fine); create two partitions: one large for Oberon and one small for about 50
    MB or so. Make both DOS partitions, and using either a guest system or something
    like vbox-mount, copy all of the .Arc files from the Oberon distribution to the
    smaller filesystem. (You''ll need this later to install the extra packages on
    your Oberon system.)


    Now you''re ready to boot the Oberon installation floppy (which should be named
    Oberon0Disk or something similar). It contains the Oberon kernel, windowing environment,
    several drivers, and the installer. Don''t bother making a boot floppy from image;
    just connect your virtual drive to the image itself. The installer boots and runs
    almost instantaneously; if it seems you have to wait, you may have some trouble.


    At this point, carefully read and follow the on-screen instructions because the
    installer is embedded within them. During the installation, you''ll have an option
    for booting the Oberon filesystem in a file on a DOS partition or setting up the
    filesystem on a partition. Choose the latter, since you''re running under VMware
    and it doesn''t really matter if you make a mistake on a virtual disk. Put the
    filesystem on the larger partition you made (Don''t worry if you miss something—you
    can always boot from the image to restart or reconfigure the system.)


    In the final installation stage, you''ll have a few things to configure. The first
    part is the video driver configuration. In newer versions, a VMware driver will
    show up in list. Otherwise, you have to stick with VGA16. In the second part,
    you need to decide how to boot the system. For a VMware virtual disk, make it
    boot directly from the disk.


    136'
