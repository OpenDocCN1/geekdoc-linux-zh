    # 5.6.1 DOS CPU Idler Utility and APM under Windows 3.1


    By default, DOS doesn''t idle the processor when it isn''t doing anything. This
    has fairly serious consequences when you run a DOS system as a VMware guest—see
    section 8.1 for a full explanation. You can get around this in DOS with a program
    called DOSIdle (available at the VMware website). This is a terminate—resident
    (TSR) utility that runs a CPU halt during idle loops. This effectively reduces
    the CPU usage to zero when DOS isn''t doing anything—which is most of the time.
    To makeIdle active every time you start your system, put it in your autocexec.bat
    file.


    To achieve the same savings under Windows 3.x, activate APM support:


    +   1. At the DOS prompt, go to your WINDOWS directory (usually C:\WINDOWS) and
    run setup.

    2. Move the cursor up to the line that starts Computer: and press enter.

    3. A list of choices appears in a box; move the cursor down to MS—DOS System with
    APM and press enter. You''ll probably need your Windows 3.x install disks handy,
    because Windows will need to copy the drivers.


    Note DOS doesn''t have a real kernel, this utility doesn''t work during execution
    of all programs; it functions only when a program runs a DOS library call.


    # 5.6.2 IDE Disks


    DOS and Windows get their information from VMware''s IDE disks through the BIOS.
    However, the drive letter assignments are a function of the partition table on
    the disks. Each DOS (FAT) partition gets its own drive letter, and DOS usually
    assigns letters as it finds and divides them.


    When you add a new virtual disk to DOS/Windows configuration, it has no partition
    table, and DOS does not recognize it. To set up the disk properly, you must partition
    it with FDISK. The procedure for doing so is described earlier in this chapter
    for Windows 95/98/Me, in section 5.3.3 on page 80.


    Once you get the partition table on the disk, determine the drive letter DOS has
    assigned to the disk (DISK again), press 5, and then create the new drive (with
    format d:), but be sure that you choose the correct drive letter or you will lose
    data. (You can test your choice by trying to access that drive before you format
    it: if you get "Abort, Retry, Fail" message, it''s likely that you found the right
    drive.)


    Note Don''t configure any SCSI disks (explained later) while partitioning new
    IDE disks. FDISK won''t see more than one if the VMware SCSI controller is present.


