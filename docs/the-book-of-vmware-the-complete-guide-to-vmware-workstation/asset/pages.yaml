    # 11.2.3 Creating New Floppy Images


    If you want to create a blank floppy image and put an empty filesystem on it,
    you don''t need to bother with any real floppy disks or drives. With a reasonably
    new version of the mkdosfs command, you can create the image and put a DOS filesystem
    all in it one shot with this command:


    ```

    mkdosfs -C image.flp 1440

    ```


    The 1440 is the block count. Since blocks are 1,024 bytes long, the mkdosfs command
    here is equivalent to these two commands:


    ```

    dd if=/dev/zero of=image.flp bs=1024 count=1440

    mkdosfs image.flp

    ```


    Once the image has been created, you can do whatever you like with image.flp.


