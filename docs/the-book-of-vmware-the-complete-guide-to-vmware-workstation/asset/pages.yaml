  md: '# Chapter 4: Virtual Machine Configuration and Operation


    There are several options here: **No networking. Bridged networking, Host-only
    networking, NAT networking**, and combinations. Bridged networking sets up a virtual
    interface just like the one already inside your computer (that is, if you have
    an Ethernet interface). Host-only networking creates a virtual network inside
    your machine, meant only for communication between guest and host operating systems.
    NAT networking is host-only networking, but enables connections from guest systems
    to an external network. We''ll go into much more detail about networking in Chapters
    9 and 10.


    If you''ve never done any setup before, choosing an option may seem difficult,
    but any selection is safe because you can use the Configuration Editor to change
    it and it''s easy to remove interfaces in a guest operating system.


    | Windows | Select a Disk |

    | Linux | Disk Type Setting |


    Next is the **Disk Type Setting**, which refers to the kind of disk you want to
    attach to the virtual machine. You have three options: **New virtual disk, Existing
    virtual disk, and Physical disk.**


    If you choose the disk, the virtual disk appears as a file on your operating system
    (by default in the directory you choose in). Next, you''re asked how large the
    virtual disk should be. The size can be up to 128 GB (128,000 MB) for an IDE disk
    on a Windows host, or 64 GB on a Linux host. If you don''t have free space on
    the partition you chose for the virtual disk size, the wizard warns you about
    it, but still lets you create the virtual disk, because the virtual disk size
    is initially small and grows as needed. (You can later move the virtual disk file
    to a larger partition on your host system and update this configuration with the
    Configuration Editor.)


    An existing virtual disk is a virtual disk that you created earlier and want to
    use with a new virtual machine.


    If you choose an physical (or raw) disk, the wizard presents a list of available
    hard disks on your system, and you have to navigate through tables of disk partitions
    and permissions. Raw disks are an advanced option, you should read the “Physical
    (Raw Disks)” section on page 56 if you want to proceed with this.


    Once you complete all of the tasks, the wizard displays a summary of the new configuration.
    Just click **Finish or Done** to finish and create all necessary files and directories
    (the wizard displays this information).


    You''re now ready to run on your virtual machine.


