  md: '# 10.4 The SAMBA File Sharing Client (Linux Guest)


    If you have a Linux operating system, you can still access Windows SMB shares.
    There are two ways: by using an FTP-like interface (useful for connection debugging
    and sporadic file access) and by attaching the share directly to your directory
    tree like any other filesystem. If you work with files from a Windows system constantly,
    you should choose the latter option.


    Both methods require the use of SAMBA on your Linux guest system, the same package
    that you''d use for a server. (Remember that SMB is the protocol and SAMBA is
    a specific package that can speak this protocol.)


    Note This is not the version of SAMBA that comes with VMware Workstation for Linux.
    If your Linux guest system''s distribution doesn''t come with SAMBA, you must
    install it yourself (get it at http://www.samba.org/).


    # 10.4.1 Testing SAMBA and Accessing Shares


    Before attempting to use SAMBA to share your files, test it with the smbclient
    client:


    ```

    smbclient -L server

    ```


    Here, server the machine with the SMB server—for a Linux guest operating system
    on a Windows host, this is the Windows host machine. The output of this command
    is a list of the available shares on server.


    To do anything with smbclient, you will likely need a username and password. The
    default is your log-in name, but you can change the default with the -U option
    (as shown here). Here''s an example without a password:


    ```

    smbclient \\VMHOST\DATA -U user

    ```


    The server here is VMHOST (as defined in /etc/hosts or SAMBA lmhosts file), the
    share is DATA, and the username is user. This command starts the smbclient interactive
    mode. Its interface is like FTP''s, you can run commands as cd, ls, put, and get.


    The smbclient program asks for a password if you don''t supply one on the command
    line with the -P option.


    Once you have the smbclient interactive working mode, try attaching the share
    directly to a Linux system with SAMBA''s mount program:


    ```

    smbmount \\SERVER\SHARE'' -c /mount/ -U username -P passwd

    ```


    If you are happy with this, you can add it to your system startup scripts.


    # 10.5 Network Printing


    Printing is one of the more esoteric networking tasks. Although it''s not difficult
    to share printers between two similar operating systems (say, Linux and FreeBSD,
    or Windows NT and 98), the task becomes more frustrating when you have fundamentally
    different operating systems into play. Because VMware is built for running different
    systems simultaneously, we''ll take a look at how to translate from one printing
    system to another.'
