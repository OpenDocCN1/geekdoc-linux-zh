    with information about the device and its driver appears. In addition, you can
    configure settings for the device on the **Settings** tab, though you generally
    will not need to change these when running the system under VMware.


    The Device Manager displays devices in two ways. The first is **View devices by
    type** (at the top of the Device Manager). This classifies devices by their general
    purpose, such as CD-ROM drives, removable storage, and communications ports. This
    display normally provides the fastest way to find a device because there is only
    one level of categories. Furthermore, intermediate devices that don''t concern
    most users are set off in a miscellaneous **System devices** category.


    If you **View devices by connection**, you can track a device by its location
    in the computer. You''ll find most of VMware''s devices under **Plug and Play
    BIOS / PCI BUS**, though some of the more primitive ones, such as floppy drives
    and serial ports, are at outer levels of the device hierarchy.'
