  md: '# Chapter 6: Linux Guest Operating Systems


    modprobe pcnet32


    Because modules may use parts of other kernel modules, modprobe looks at the depmod
    module dependency list and inserts any necessary modules before the one you request.


    Note To see the system''s active modules, run lsmod.

    Normally, you don''t need to install kernel modules by hand. Instead, the kernel
    runs an automatic module loader. When you try to access a device for the driver
    isn''t present, the loader tries to find a module for it, and if it succeeds,
    runs modprobe.


    Because of the wide variety of PC hardware types, the module loader needs some
    hints about the specific machine it''s running on, which you place in a configuration
    file /etc/modules.conf. Linux distributions vary by how they generate these, the
    format is the same:


    We''ve already mentioned that the VMW Tools and dualconf* scripts manipulate /etc/modules.conf;
    to master its use under VMware, there are two keywords you need to know about.
    The first is alias. For example, a line in /etc/modules.conf reads


    alias eth0 pcnet32


    instructs the module loader that the device driver known as eth0 is in a module
    pcnet32 on this system. As mentioned before, this module contains an Ethernet
    driver that knows how to talk to VMware, so you''ll need a line in /etc/modules.conf
    file if it isn''t compiled directly into the kernel.


    The other important is options, which specifies parameters for a particular module.
    For example, the sound module needs this in /etc/modules.conf:


    ```

    options sb io=0x220 irq=5 dma1=5 mpu_io=0x330

    ```


    Note some distributions frown on modifying /etc/modules.conf directly, preferring
    that you go through some other interface. One of them is Debian: the scheme is
    based on the update-modules program, where you add special entries in /etc/modutils/arch/i386.
    The update-modules program takes this information and combines it with other sources
    to create a new /etc/modules.conf.


    # 6.7.2 Linux Device Drivers for VMware Workstation


