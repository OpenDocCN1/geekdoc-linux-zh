    Note if you change your host-only network IP configuration and subnet by hand,
    you''ll need to update your VMware DHCP server configuration to reflect the change
    (as discussed in the following section). If you feel comfortable editing these
    files, nothing wrong with this way; remember to restart your VMware services after
    you''ve done.


    # 9.4 VMware Host–only and NAT DHCP Server


    One of the most popular ways to configure a networking interface is with the Dynamic
    Host Configuration Protocol (DHCP). A DHCP server holds network data, so that
    by manually setting the IP address, subnet mask, and other information on an operating
    system, the system lets you look for a DHCP server. The DHCP server responds with
    the necessary configuration data. DHCP is the most convenient way to configure
    guest system networking under VMware Workstation’s host-only networking, and VMware
    comes with a DHCP server.


    You can tell a DHCP server to hold information in two ways. One way is to assign
    IP addresses based on the Ethernet address (ensures that a client gets the IP
    address every time it boots). The other way is to use a pool of IP addresses.
    The DHCP server serves from this pool to hold a lease on address, saying it is
    valid until a certain time (The client may renew the lease if it needs for longer.)


    VMware’s DHCP server is based on the ISC DHCP server, a free package from the
    Internet Software Consortium (http://www.isc.org/). The difference between the
    consortium’s stock DHCP server and VMware’s variant is primarily in that VMware’s
    version does not require any special kernel support for network packet filtering,
    because it knows how to talk directly to the VMware host-only network interface.
    You configure the VMware version just as you would the ISC software. Here are
    the configuration file, lease, and executables for Windows and Linux hosts:


    | File | Windows NT/2000/XP | Linux |

    |---|---|---|

    | Config | | /etc/vmware/vmnet1/dhcpd.conf |

    | Leases | WINNTsystem32\vmwaredhcp.lease | /etc/vmware/vmnet1/dhcpd.lease |

    | Executable | | bind/vmware–dhcp |


    In the preceding listing, the binary is in the directory that you install the
    script in Chapter 3. Note the location of the configuration file; it is a text
    file you can edit with any text editor. Also, in some operating system versions,
    you may have to replace WINNT with WINDOWS.


    # 9.4.1 Creating and Customizing DHCP Configuration Files


    Whenever you add a host-only or NAT network interface to an operating system,
    the system generates a new DHCP server configuration file (vmnet1-dhcp.conf for
    Windows, dhcpd.conf for Linux). Even though you don''t have to write the file
    by hand, you may need to add some customizations.


    The DHCP configuration file has a set of global parameters and settings. The global
    parameters appear at the beginning of the file. They control general server behavior
    and like this:'
