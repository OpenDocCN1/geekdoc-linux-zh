  md: '# Chapter 12: Troubleshooting


    **Problem:** You made some changes to the global configuration, and when you try
    to resume a suspended virtual machine, things don''t come back correctly.


    **Explanation:** What you''ve done is tantamount to suspending an operating system
    running on a real computer, changing its hardware, and resuming execution. The
    system''s device drivers won''t react favorably to that sort of change. It is
    true that there are some things you can get away with, but you''ll have to be
    daring to find out what things are.


    **Recommendation:** Don''t do that.


    # 12.2.5 Windows Guest Operating System Problems (All Versions)


    **Problem:** You added a new piece of hardware to your dual-boot, dual-configuration
    machine, and now Windows won''t boot as a VMware guest system.


    **Fix:** Windows likes to add certain pieces of hardware (such as video cards)
    to all hardware profiles. The easiest way to fix this is to boot Windows in safe
    mode, bring up the hardware profiles and Device Manager, and remove your new device
    from the virtual machine configuration.


    **Problem:** Some (or all) virtual hardware doesn''t work when you install from
    the Windows CD that came with your computer, or the Windows CD won''t let you
    install VMware at all.


    **Fix:** PCs often come with OEM versions of Windows that assume a particular
    kind of hardware. If you encounter this problem, view the Windows Device Manager
    and remove all special drivers, including IDE drivers; then reboot the guest system.
    Windows will automatically detect anything you might have accidentally deleted,
    other than the sound card.


    In most draconian form, OEM versions of Windows look for a particular kind of
    BIOS, and if they don''t find that the installer program on the CD refuses to
    work. The VMware BIOS is in no like your real machine''s BIOS, there''s no really
    way around this problem unless you get a Windows release that doesn''t assume
    any hardware.


    # 12.2.6 Windows 95 Guest Operating System Problems


    **Problem:** Windows 95 fails to boot and reports a fatal error or an error that
    mentions IOS:. This problem is sporadic: sometimes the machine boots, and sometimes
    it doesn''t.


    **Fix:** If your host''s processor is an AMD K6-2, AMD Athlon, or Intel Pentium
    4, install a small upgrade to Windows 95. Look for the mkdup.exe update for it
    at http://microsoft.com/. Use the same patch for the Pentium 4.


    Note AMD also has a patch, but it has problems with the VMware BIOS. Don''t install.

    **Problem:** Your Windows 95 guest system takes up all available CPU time on your
    host.


    **Fix:** The first releases of Windows 95 did not properly identify the processor.
    Upgrade to OSR2 of Windows 95 or install an inder utility such as CPUIdle (http://www.cpuidle.de/),
    Rain, or Waterfall. See section 8.1 for an explanation of why your guest operating
    system is monopolizing your host''s CPU.


    **Problem:** DHCP and other networking functions don''t work on your Windows 95
    guest system.'
