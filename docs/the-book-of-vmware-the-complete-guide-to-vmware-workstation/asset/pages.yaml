  md: '# Chapter 3: Installing VMware Workstation


    # vmnet-sniffer


    This is a packet sniffer for virtual networks. See section 9.11 for more information.


    # 3.11 VMware Linux Library Directory


    Recall from section 3.5 that the install script for the tar format asked you where
    to put the libraries, and creates a vmware directory underneath it. If your library
    directory is /usr/local/lib, the installer creates /usr/local/lib/vmware and puts
    program data there. Here''s a quick rundown of the library content:


    | | |

    |---|---n| configurator | DHCP and SMB settings for host–only networking. |

    | isoimages | ISO 9660 CD-ROM images for installing VMware Tools for guest operating
    systems. |

    | modules | Predefined kernel modules for several Linux distributions, as well
    as their source code for use when none of the modules match. |

    | smb | NLS codepages for use with SAMBA. |

    | licenses | Sitewide and user license data. |

    | help | Online files (in HTML format). |

    | config, xkeymap | Miscellaneous configuration data. |

    | bin | Auxiliary programs (don''t run on the command line). |


    # 3.12 VMware Workstation for Linux Boot Script


    When you reboot your machine, the running kernel has no modules unless the automatic
    module loader or other mechanism loads them. Since VMware needs the vmnet module
    and can''t load it when you''re running as a user script activates it automatically
    at boot. For networking features, the script activates the vmnet module and starts
    the DHCP and SAMBA host-only utilities.


    If your Linux system uses the V init system, your boot scripts are in /etc/init.d
    or /etc/rc.d. The VMware installer places a new vmware script in this directory.
    To start the services, make boot root (assuming that your init.d directory is
    /etc/init.d) run the following:


    ```

    /etc/init.d/vmware start

    ```


    To stop the services, use this command:


    ```

    /etc/init.d/vmware stop

    ```


    To get the current status of the vmware subsystems, including the number of virtual
    machines active, enter


    ```

    /etc/init.d/vmware status

    ```


    Note For a Red Hat system, use /etc/rc.d/init.d/vmware instead of /etc/init.d/vmware.
    To enable automatic startup of boot scripts, Linux has several runlevels, and
    you can customize your boot sequence for each. The runlevel directories are in
    /etc/rc.N or /etc/rc.N.d, where N is a number between 0 and 6. Look at /etc/initab
    to find your default runlevel; it''s under the initdefault keyword.'
