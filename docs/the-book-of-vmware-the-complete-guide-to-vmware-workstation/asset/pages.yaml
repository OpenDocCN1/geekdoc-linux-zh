  md: '# Chapter 12: Troubleshooting


    # 12.2.4 General Guest Operating Systems


    **Problem**: When you suspend certain guest systems with VMware''s suspend-to-disk
    feature, your host system freezes for a little while.


    **Fix**: When you suspend a system, VMware Workstation writes all of the virtual
    machine memory state out to the disk and fixes any changes to the virtual machine''s
    disks. This can send a great deal of data to your host machine''s disk, and the
    host''s disk buffers may fill up, causing a flood of real disk writes. During
    the writes, all system calls to the disk are blocked.


    You can improve in two ways. First, you can try to reduce the amount of memory
    in the virtual machine configuration so that a suspend operating system has less
    memory to write. Otherwise, you can try to put the virtual machine configuration
    file and directory on a different disk. VMware writes a machine''s state data
    to the same directory that contains its configuration file. If that also happens
    to be your system disk, any system activity involving that disk will freeze write
    buffers.


    Finally, you can try to improve your guest performance. If you have special drivers
    for guest hardware on a Windows host, install them. Make sure that your DMA and
    multiple-sector transfer modes are on. On a Linux host with IDE disks, you can
    try running hdpdm to enable sector modes. The most significant of these are usually
    multiple-sector transfers (for example, hdpdm -m 16 /dev/sda). See the hdpdm manual
    page for a full list.


    If none of these options work for you, you can just grin and bear it.


    **Problem**: When you try to suspend your virtual machine, VMware tells you that
    the guest doesn''t want to do


    **Fix**: Turn off the Use APM features of guest OS suspend option in the Configuration
    Editor. This is generally a good idea anyway, because your guest system may want
    to do something rude, such as writes its state to a partition on a raw disk. Not
    only is this lead to corruption or by another operating system, but the system
    may not work at all due to read disk permissions, BIOS incompatibilities, the
    phase of the moon, or something else that you really don''t want to get involved
    with.


    **Problem**: When you perform a suspend operation on your notebook host, VMware
    crashes.


    **Workaround**: Click the VMware Suspend before performing the real suspend operation.
    Also, as stated in the discussion of the preceding problem, don''t use APM for
    your guest''s suspend operation.


    **Problem**: You can''t boot your guest from the CD.


    **Fix**: It''s likely that the boot sequence in VMware BIOS is to search for an
    operating system on the hard disk CD–ROM. See section 4.14 for more information
    on the VMware BIOS.


    **Problem**: Your host system performs horribly when running certain guest systems
    or the VMware BIOS on Windows hosts in particular.


    **Fix**: Your guest system doesn''t release the CPU when it should, as explained
    in section 8.1. If your guest has a processor idle utility or APM support, use
    it.


    This problem manifests itself more often on Windows host systems because the scheduler
    on these hosts tries to optimize itself for active and inactive windows, whereas
    Linux systems generally give equal priority to


