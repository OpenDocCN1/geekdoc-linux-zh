  md: 'The VMware installer looks for the default runlevel directory and places a
    S90vmware link there to the vmware script in init.d directory. This link in place,
    it runs the vm script with the start parameter when you system your boots, your
    VMware services start. Similarly, the installer looks for your system shutdown
    runlevel (usually 6) and places a K8vmware link there, shutting off services in
    an orderly system shutdown.


    Because the installer uses the init.d/vmware system boot script on an upgrade,
    this boot script looks a little different than the normal init.d/vmware script
    also defines several utility functions before actually starting or stopping the
    VMware subsystems.


    If you don''t know what the Bourne shell, you probably won''t want to change (or
    even look at) the boot script. All you need to know is that it loads vmmon, vmnet,
    and vmppuser modules and starts VMware’s version of dhcdcp on the host-only or
    NAT networks.


    # 3.13 Additional Files in /etc/vmware and /dev


    The VMware installer creates a directory called /etc/vmware on your system, which
    holds all configuration information about your host machine.


    # locations


    The locations file records all files and directories that the VMware installer
    creates, moves, or deletes; vmware-config.pl may append to this file if it needs
    to add something as a new kernel module. In addition, locations contains configuration
    data for the VMware boot script (see section 3.11 on page 30), including all network
    settings. Don''t confuse this with parameters in the config file (below).


    The uninstaller program uses locations to determine what it needs to delete for
    a clean uninstall. This file also provides a handy way to determine whether a
    file on your system came from the VMware installation, to move VMware from one
    machine to another, or to distribute a VMware installation over several machines.


    # config


    The config file primarily contains the full pathname of VMware binaries and libraries
    and also contains some default parameters. The vm executable program loads these
    values as defaults for all configurations. You normally won''t need to change
    this file.


    # installer.sh


    The installer.sh file is a utility program normally run by the VMware install,
    configuration, and uninstall utilities. Though you normally won''t need to bother
    with this file, since it''s just a shell script, you can skip to the end of it
    to see what its arguments do.'
