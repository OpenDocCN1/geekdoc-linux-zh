    Though this chapter covers many issues relevant to VMware’s Linux SMB server,
    it really scratches the surface of what SAMBA can do. In particular, you can do
    a lot with the smclient program in the regular distribution if you have a Windows
    host and a Unix guest system. SAMBA can be a WINS server (if, for example, you
    want to connect the guests in a host-only network NAT to a bigger network); it
    also has network browsing capabilities, can communicate over SSL, and has extensive
    access restriction configuration options. To learn more about SAMBA, visit http://www.samba.org/
    and look at the documentation and pointers here.


