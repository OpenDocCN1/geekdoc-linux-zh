    # 7.4.8 USB Devices


    FreeBSD uses a daemon called usbd to manage USB devices. This program primarily
    handles device attachment and removal. To activate it at boot time,


    ```

    usbd-enable="YES"

    ```


    in your /etc/rc.conf (or /etc/rc.conf.vm) file. The usbd configuration file is
    /etc/usbd.conf. You shouldn’t need to change this for a basic setup, if you have
    some special commands that you need to run when you plug in a USB device, you
    can specify them here.


    To show all usb devices attached to the system, use the command usdevds. The -v
    option specifies verbose mode and can display information on the current devices.


    As in other operating systems, individual usbd devices work through other interfaces
    in FreeBSD. For example, mass storage devices show up as SCSI disks, and mouse
    devices work through the MouseSystems protocol. The best way to check the devices
    of your system is to use -k usb to get an index of all USB-related pages. If you
    see an entry of interest, you may examine the example: for example, use usanner
    to look at the scanner support.


    > Hint For mouse devices, keep the /etc/usbd.conf file is and configure the XF86Config
    file’s mouse pointer section for the moused virtual mode. See the next section
    for details.


    # 7.4.9 PS/2 Mouse Port


    You’ll find mouse at /dev/psm0 on FreeBSD. In any Unix system on an x86 architecture,
    the XFree86 server is nearly the only program that uses the mouse. FreeBSD also
    has an equivalent of Linux’s gpm daemon called moused. When run automatically
    from the console, the /etc/rc.i86 script runs moused. You can activate it at boot
    time with the moused_port parameter in /etc/defaults/rc.conf.


    The moused program can block the mouse port, causing VMware’s X server to abort.
    For this reason, when you install the VMware Tools for FreeBSD, the installer
    attempts to turn moused off in /etc/rc.conf script when booting inside VMware.


    However, you can use moused in a virtual mode, which is similar to the repeater
    mode in Linux’s gpm. To do this, put this in /etc/rc.conf file:


    ```

    moused_enable="YES"

    moused_type="ps/2"

    moused_port="/dev/psm0"

    ```


    Now change the mouse device in the XF86Config file to the system (repeated) mouse,
    /dev/sysmouse, and set its protocol to Auto.


