  md: '# # Chapter 4: Virtual Machine Configuration andnOperation


    # ## Overview


    In this chapter, you''ll learn how to get a guest operating system up and running
    under VMware Workstation. To do so, you''ll first need to create a configuration.
    Then you''ll become familiar with VMware''s user interface, and learn how to modify
    and maintain a configuration.


    Once you have a guest system working, installing VMware Tools can improve performance;
    you''ll see why in this chapter, but we won''t cover the details for each guest
    system until Chapters 5 through 8.


    This chapter finishes with a discussion of the VMware BIOS.


    # ## 4.1 Getting Started


    Before you can run a guest operating system under VMware, you must create at least
    one VMware configuration. (You''ll create a specific configuration for each guest
    system.) A configuration includes a set of disk information files, a data file
    for the VMware BIOS, and a configuration file that binds everything together.


    VMware File menu operates on configuration files. When you change files, you''re
    going to go to a different configuration. You should use one directory for each
    configuration, although you may want to relocate larger data files (such as virtual
    disks).


    You can work with configurations in three ways. If you''re interested in creating
    a configuration quickly, use the VMware Configuration Wizard. You can run this
    program when you start VMware, or you can run it with the Wizard on the VMware
    File menu. This program creates only new configurations; you can use it to edit
    one that already exists.


    The VMware Configuration Editor gives you complete control over each piece of
    the virtual machine, and you''ll need it to add certain hardware, such as parallel
    ports. To find the editor, choose Configuration Editor from the VMware Settings
    menu.


    Although you normally won''t need to, you can edit configuration files manually
    with a text editor. Configuration files have a .vmx extension on a Windows host
    and end with .cfg on a Linux host. Just remember that if your manual modifications
    to the configuration file corrupt it, VMware may not be able to repair it.


    # ## 4.2 The VMware Configuration Wizard


    Use the VMware Configuration Wizard when you first configure a guest operating
    system under VMware. The term wizard is just a fancy name for a program that attempts
    to simplify a larger program''s setup the first time by boiling down the steps
    to series of questions. But the wizard doesn''t always get everything'
