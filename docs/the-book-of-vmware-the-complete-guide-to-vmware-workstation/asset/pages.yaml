  md: '# Chapter 4: Virtual Machine Configuration and Operation


    Open Recent, a submenu with a list of frequently used configurations, provides
    the fastest way to get to a configuration.


    Instant Restore is a submenu listing all of the virtual machines suspended. When
    you select one, VMware opens the configuration and restores it from where it was
    suspended. section 4.8 on page 46 for more details on suspending virtual machines.


    Exit terminates the current VMware window.


    # 4.6.2 Power Menu


    Use the Power menu to start and stop the virtual machine.


    Power On runs the virtual machine. On Linux hosts, this changes to a Power Off
    item when the virtual machine is on; on Windows hosts, Power Off is a separate
    menu item.


    Power Reset performs a virtual power cycle, turning the virtual machine off and
    on. As with a real system, this is a harsh way to reboot a machine and should
    be used only when the machine freezes, since guest filesystems may corrupt if
    you don''t shut down and reboot. Also under most guest systems, if you use Power
    Reset, the virtual machine will take longer after the reboot.


    Suspend (virtual machine) stops a virtual machine and saves its entire memory
