  md: '# Chapter 4: Virtual Machine Configuration and Operation


    ![](img/aa552d73360a647bd96f567236c5ca1a_42_0.png)


    # 4.4 Power On


    To get started, click the **Power On** button at the upper left. Just after you
    turn on the power, the VMware window may resize itself and flash a couple of times.
    This is normal. Then the *power–on self–test* (POST), shown in Figure 4.3, begins,
    like the POST that a real PC runs on startup. Notice that all of the menu options
    and buttons are now active, and there''s a new row of powers at the lower right,
    on the status bar; these represent the devices on your virtual machine. For example,
    in Figure 4.3 has one floppy disk, a CD-ROM drive, and an Ethernet interface.
    Disconnected devices show up as inverted grayscale pixels.


    After the POST screen, VMware tries to load a guest operating system. If you configured
    your machine with a new disk, there''s absolutely nothing on the disk to load,
    and you''ll get an Operating System not found error message. However, if you have
    a dual–boot system and tell VMware to boot from an existing partition with an
    operating system, that system may boot.


    If you don''t have a guest operating system on your VMware disk, you''ll need
    to install it, usually from a CD. Make sure that your CD-ROM device is connected;
    if not, go to the Devices and connect it right away.


    If you are typing in the guest operating system, VMware grabs the input focus,
    and you won''t be able to move your mouse pointer outside the VMware window. Use
    ctrl–alt to free your mouse and return your input devices to the host system.


    # 4.5 Toolbar Buttons


    The toolbar provides a way to access frequently used actions in VMware and resembles
    the front panel of your PC. Some of the buttons, like Power and Reset, are familiar.
    The buttons may show as text or icons, and each is also available as a menu item.
    You can remove the toolbar if you like (choose **View Toolbar**).


    **Power On** turns on the virtual machine. On a Linux host, when the power is
    on, this button changes to **Power**'
