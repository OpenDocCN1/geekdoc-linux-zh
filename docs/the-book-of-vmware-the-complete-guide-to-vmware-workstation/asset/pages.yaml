    # USB


    VMware Workstation supports the universal serial bus (USB) on all host systems
    except Windows NT. On a Windows host, you can add a USB controller in the Configuration
    editor. For a Linux host, you can add the **Enable USB** option in the Configuration
    Editor''s section.


    Once a device connects to a kernel driver in an operating system, the kernel must
    have exclusive access to the device. Since you may run several operating systems
    at once with VMware Workstation, it''s important to understand how virtual machines
    get control of USB devices. The mechanism is: If the virtual machine has focus
    (that is, it has control over the keyboard and mouse), the guest system running
    in that virtual machine gets complete control of the device. Therefore, both your
    host and guest systems can use USB devices at the same time, but they can never
    share one device. You can temporarily prohibit VMware from taking over new devices
    with the Automatically connect USB devices.


    VMware Configuration for Linux has a **Path to udevbfs** box; under normal circumstances,
    the entry should be /proc/bus/usb. With everything else in /proc, the Linux kernel
    creates and maintains this directory, but only if you have the appropriate kernel
    support. When configuring a kernel, for this option in the **USB support** configuration
    section. (You may need to turn on the experimental options.)


    # Sound


    Click to configure sound for your guest system. On a Windows host, you can pick
