    section 2.4).


    Like DOS, FreeDOS doesn''t call the HLT instruction when it isn''t doing anything.
    The DOSIDLE program was covered in section 5.6.1 runs fine under FreeDOS, so if
    you''re planning to spend any extended amount of time with FreeDOS, you should
