    # 6.5 VMware Tools for Linux


    Install the VMware Tools to get the most out of your Linux guest system. The primary
    benefits of VMware Tools are optimal graphics performance and full–screen mode;
    they also enable several input options, and you can install automatic dual configuration
    files for dual-boot machines.


    # 6.5.1 Installing VMware Tools


    To start the VMware Tools installation, do the following:


    +   2. Become root and mount the CD–ROM image on your guest (system):

    ```bash

    mount -r -t iso9660 /dev/cdrom /cdrom

    ```

    If dev/cdrom is not a link to your guest system''s CD–ROM device, use dmesg |
    grep hd to find the correct /dev entry. Some systems automatically attach the
    CD–ROM drive, in which case you may need to perform this step at all.


    +   3. You should save a compressed archive vmware-linux-tools.tar.gz in /cdrom.
    Extract its contents and unmount the CD–ROM image from your system (if you forget,
    the Linux kernel will get angry if you pull a mounted device out from its nose):

    ```bash

    cd /var/tmp

    tar zxf /cdrom/vmware-linux-tools.tar.gz

    unmount /cdrom

    ```


    +   4. You now have a new directory, /var/tmp/vmware-linux-tools.cd to that directory
    and run the installer program:

    ```bash

    cd vmware-tools-linux

    ./install.pl

    ```


    +   5. Enter yes when the installer asks if you really want to proceed. After
    installing all files, the installer starts the host–guest system time synchronization
    daemon, sets up dual configuration, tweaks a few operating system parameters,
    and restarts the mouse daemon (gpm) if necessary.


    +   6. Run ps auxww | grep guestd to see if the VMware guest operating system
    daemon (vmware-guestd).'
