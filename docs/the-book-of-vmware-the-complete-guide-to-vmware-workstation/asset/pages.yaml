  md: '# Chapter 6: Linux Guest Operating Systems


    Therefore, if you have SCSI targets 0, 3, and 4 on a single host controller, the
    kernel warns the devices as follows:


    ```

    target 0: /dev/sda

    target 3: /dev/sdb

    target 4: /dev/sdc

    ```


    Once you know the device name of a SCSI disk, you can work with it just as you
    would an IDE disk. (See the previous section for details.)


    # 6.6.3 /dev/scd*, /dev/sr*: SCSI CD–ROM Drives


    The naming for SCSI CD-ROM drives under Linux is similar to that for disks. The
    first drive is /dev/scd0 or /dev/sr0, the second /dev/scd1 /dev/sr1, and so on.
    With ATAPI CD–ROM drives, there are no partitions; you mount the entire device
    when you use a command as mount.


    # 6.6.4 /dev/sg*: Generic SCSI Devices


    For some devices, SCSI and CD-R drives are not in the kernel; instead, a regular
    user-mode utility handles the interaction through a generic SCSI device file.
    For example, cdrecord is a command that burns a CD-R or CD-RW. Generic SCSI devices
    appear in /dev as sg0, sg1, and so on. Some distributions use the names sg, and
    so, on.


    Tape drives use /dev/st* and /dev/nst*: for example, /dev/st0 for the first SCSI
    tape device and /dev/nst0 for its no-alternate.


    # 6.6.5 /dev/ttyS*: Serial Ports


    On Linux systems, VMware''s virtual serial ports are /dev/ttyS0 /dev/ttyS3, which
    correspond to the standard COM1 port assignments on a real machine. The Linux
    kernel detects all four ports by default, even if they don''t have a VMware configuration.
    This isn''t a problem as long as you keep away from devices not in your virtual
    machine configuration; otherwise, the kernel may pass along its confusion to any
    program that uses these devices.


    minicom is a popular terminal program that connects with all Linux distributions.
    Your distribution may create a symbolic link /dev/modem that connects to your
    modem''s serial port device. To set up PPP (for a dial-up Internet connection),
    you''ll need to set up pppd, if you''re running under VMware, it''s generally
    easier to go through your host operating system to get a network connection.


    # 6.6.6 /dev/fd*: Floppy Drives


    The floppy drives available under VMware are the devices /dev/fd0 and /dev/fd1.
    In addition to using to access an MS-DOS filesystem on a floppy drive, you can
    use a package mtools to gain access to a FAT filesystem. You may well prefer this
    approach because floppy disks are extremely unreliable; the Linux kernel doesn''t
    mount unreliable media. The package is simple to use; the commands are similar
    to those for MS-DOS, except they have an m at the beginning. Here are some examples:


    ```

    mcopy :somefile

    mcopy somefile a:

    mformat a:

    ```


