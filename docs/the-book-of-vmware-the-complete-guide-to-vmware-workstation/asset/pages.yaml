    # 2.1 Processor, Bus, Memory, and Interrupts


    A PC has three essential components: the CPU, memory, and I/O devices (which we''ll
    just call devices from now on). CPU stands for central processing unit (or processor),
    and it is the heart of a computer. It not only runs the instructions that compose
    a program, but also supervises the rest of the system.


    Because a CPU can''t store all of the essential system data in amount of storage
    space, the processor needs external memory, in the form of random-access memory
    (RAM). This storage is important to the CPU''s operation, the CPU has nearly direct
    access to it. Between the CPU and the RAM is an important layer called the memory
    management unit (MMU). This piece splits the RAM into many pages known as pages.
    The MMU has a map (called a page) of the CPU-addressed pages in real memory.


    The memory that users see is virtual memory (not a VMware term). When a CPU instruction
    asks for an address in memory, the MMU redirects its access through that page
    to take a place in real memory. (Note that this is not the only way; the operating
    system works with the MMU to get the job done. Some older systems, like DOS, do
    not use the MMU.)


    On the other hand, it''s rare for a device to have a close connection to the CPU
    for two reasons. One is that devices vary so it would be almost impossible to
    create an interface inside the CPU supporting each device. Furthermore, devices
    often transmit data at irregular intervals and several devices may try to talk
    to the CPU at once. It doesn''t make sense for the CPU to have a direct access
    to all of its data or in a format that the CPU understands, so the CPU has a common
    bus that connects the devices to the CPU. In addition, there are extra controllers
    and interfaces between the devices and the bus; an example of this is the SCSI
    controller.


    VMware has two buses, resembling those in most modern PCs: PCI and an extension
    off the PCI bus called the PCI-to-ISA bridge. ISA is an old standard dating back
