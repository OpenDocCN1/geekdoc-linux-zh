    # 9.3.2 Viewing and Changing Your Host–Only Network Settings


    Because private subnets are extremely useful for setting internal networks, you
    may already have one in your organization. Therefore, you should be careful that
    you not accidentally set up VMware''s host-only network that it conflicts with
    another network already in use. The VMware installers try to do this for you with
    a simple ping over the subsets.


    Though the VMware installer configures host-only networking for you, you may want
    to set it up by hand (or simply view the current settings). To change or view
    the settings under each host system, do the following:


    # Windows NT


    Go to the Network control panel and click the Protocols tab to bring the TCP/IP
    Protocol properties. Under Adapter, select the VMware Virtual Ethernet Adapter
    (VMnet8) and pick your new network.


    # Windows 2000/XP


    On Windows 2000 and XP, you''ll find a VMnet interface inside the Network (and
    Dial-up) Connections control panel. To view its settings, click the icon; (when
    the status window appears) click the Properties button to bring the Internet Protocol
    (TCP/IP) properties.


    # Linux


    The easiest way to view the host–only network under a Linux host system is to
    look at the /etc/vmware/locations for files like the two:


    ```

    answer VNET_1_HOSTONLY yes

    answer VNET_1_HOSTONLY_HOSTADDR 192.168.87.1

    answer VNET_1_HOSTONLY_NETMASK 255.255.0.0

    ```'
