    to all at once and use the first reply that comes in. Unless you know what you''re
    doing, it''s a good idea to leave this parameter to order because you can invite
    nonuniform replies to DNS requests


    +   - timeout: How long to wait until trying a DNS query again.


    +   - retries: The number of times to try again before the DNS query fails.


