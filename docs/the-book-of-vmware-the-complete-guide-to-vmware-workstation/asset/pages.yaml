    — just add 1 to each consecutive number after the horizontal and vertical pixels.
    However, there is one small constraint: the horizontal resolution must be a multiple
    of 8 (if it''s not, the VMware X server rounds it up to the next multiple of 8).


    # 6.5.5 The VMware Toolbox


    To access a few VMware features pertaining to the interaction between the host
    and guest operating systems, you''ll need to use the VMware Toolbox. By default,
    the tool installs this in the X binary directory, /usr/X11/R6/bin, as a single
    program named vmware-toolbox.


