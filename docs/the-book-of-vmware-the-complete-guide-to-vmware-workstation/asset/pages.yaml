    # Tackling Printer Drivers


    If your host''s printer does not support PostScript, then if you want to print
    over the network from a Unix guest system to a Windows host, you will need to
    configure the correct print driver. The driver rasterizes the PostScript information,
    meaning means that the PostScript code in a job produces a bitmap image as the
    output for sending to your printer.


    Ghostscript is the standard Unix program for rasterizing PostScript input for
    another type of printer to understand. Ghostscript is a program that comes with
    virtually all Linux distributions; its executable is gs.


    All you need to do is insert gs command in a pipeline before running sambclient.
    The tricky part is getting the correct arguments for your printer. A full guide
    to Ghostscript is beyond the scope of this book, but here are a few hints. You
    need to use the PostScript file from standard input and render the rasterized
    result to standard output. There are two main driver styles. The practical approach
    looks like:


    ```

    gs -q -dBATCH -dOPAUSE -dSAFER -OutputFile=\nr600x600 -sDEVICE=ljmono file | sambclient
    args

    ```


    This command produces output for the HP LaserJet 5. Here is the PostScript file
    you want to print, and args are the sambclient arguments from the previous section.
    Because this is a bulky command, you should put it in a script if you need to
    use it—for example, like:


    ```

    #!/bin/sh

    if [ "$1" != x ]; then

    FILE=$1

    else

    FILE=-

    gs -q -dBATCH -dOPAUSE -dSAFER -sOutputFile=$FILE- \

    r600x600 -sDEVICE=ljmono file | sambclient args

    ```


    There is a relatively new Ghostscript driver called unpre that supports many kinds
    of printers. Here''s a command that rasterizes PostScript files for the Epson
    Colorplex 600:


    ```

    gs @stc600.up -q -dBATCH -dOPAUSE -dSAFER -sOutputFile== file

    ```


    If you don''t know which driver to use, first check the .app files in Ghostscript
    library directory to see if any fit your printer. If none look right, use gs -help
    to display a list of all drivers, or consult the Ghostscript


    169'
