  md: '# Chapter 10: Network Services


    # SAMBA Filesharing Management


    Two sections in a VMware–smb.conf file control filesystem access to clients: namely,
    [homes] and [HostFS]. The [homes] section controls access to home directories
    and looks like this:


    ```

    [homes]

    comment = Home directories

    browseable = no

    writable = yes

    ```


    This special map maps to home directories upon log–in. When a user logs in, smbd
    looks up that username in the system /etc/passwd file, finds the user''s home
    directory, and offers the directory to the client as a share. The last setting
    (writable) in the lines allows you to turn off permission if you don''t trust
    your guest system.


    The [HostFS] section gives your guest system access to the rest of your host''s
    filesystem. By default, it looks like:


    ```

    [HostFS]

    comment = VMware host filesystem

    path = /

    public = no

    writable = yes

    printable = no

    ```


    There are a few things to note here. The first is that the path parameter specifies
    where in the host filesystem to begin; in this case, it''s /, meaning all files
    and directories on the host. You can make the parameter more restrictive (for
    example, /data/), or if you want to add more sections with specific path components,
    just copy the section with a new path parameter and change HostFS to a new name
    of your choice.


    > (Do you see the disparity between the writable keyword and writable in the [homes]
    section? As far as smbd is concerned, they''re synonymous.)


