    # 7.3.3 The VMware Toolbox


    The companion to the VMware Server is the Toolbox (vmware-toolbox), a graphic
    interface to some of VMware''s features. The Toolbox installer places vmware-toolbox
    in /usr/X11R/bin if that directory exists. You can''t run the Toolbox outside
    the X Window System.


    The Toolbox generally works as described in section 4.11.1. The Devices lets you
    connect and disconnect devices; you can also share a virtual disk, and do a few
    other things.


    Note As the Linux Toolbox described in section 6.5.6, you must run vmware-toolbox
    in your FreeBSD guest system to take advantage of virtual machine features, such
    as copying and pasting between guest and hosts and automatic release of the focus
    when the mouse pointer leaves the virtual machine. Therefore, place the proper
    Toolbox in your .initrc or .session file that runs every time you start a session.


    # 7.3.4 Single and Dual Configuration


    As discussed in earlier sections, the VMware Toolbox install runs, it renames
    few of your original configuration files with a . extension and creates new ones
    with a vm suffix. These correspond to the original and virtual configurations.
    If you used a raw disk to a previously installed FreeBSD installation under VMware
    Workstation, you have a dual configuration: one for real hardware, and the other
    for VMware''s virtual hardware. The VMware Tools for FreeBSD support automatic
    dual configuration at boot time.


    Even if you don''t have a dual, you still need to know about the .vm files, because
    they are the active on your system.


    FreeBSD uses much simpler boot scripts than the System V init scripts found on
    other versions of Unix, such as Solaris and Linux distributions. These include
    a master script, /etc/rc, which may call other /etc/rc.* (note that these are
    scripts, not directories on FreeBSD), and two master configuration files for the
    rc* scripts, /etc/rc.conf (BSD-wide defaults) and /etc/rc.conf (for customizations
    on your local machine).


    The VMware Tools install moves /etc/rc.conf to /etc/rc.conf.org and creates a
    new /etc/rc.conf file based on the original; then makes a symbolic link from the
    rc.conf.vm file to rc.conf.


    ```

    lrwx-xr-x 1 root wheel 15 Mar 21 15:06 /etc/rc.conf -> /etc/rc.conf.vm

    -rw-r--r-- 1 root wheel 51 Mar 22 02:09 /etc/rc.conf.org

    -rw-r--r-- 1 root wheel 515 Mar 20 02:31 /etc/rc.conf.vm

    ```


    The first difference between the .vm files and the .org files is that the installer
    sets


    ```

    moused_enable="NO"

    ```


    to ensure that mouse won''t interfere with the X server when you start it (this
    isn''t strictly necessary); section 7.4.9 shows how to get the mouse and the X
    server to coordinate.


    If you enabled host-only networking for your virtual machine, there is another
    hand configuration option to turn off the ela daemon and booting a bit kicker:


    ```

    sendmail_enable="NO"

    ```


