  md: '# 8.4.3 Booting Solaris


    Solaris Intel Platform Edition boots through a two-step process. It first loads
    a (DOS) configuration assistant from a DOS partition.


    If you enter the assistant in interactive mode (as you would first installing),
    you can boot from an alternative device and probe for new added hardware. You
    can also scan for specific hardware, but be careful! If you miss a device in the
    scan, the Solaris kernel won''t find it (This can be a big problem for a small
    device such as the keyboard).


    Note When under VMware Workstation, you shouldn''t need to deal with the configuration
    assistant much; the kernel should automatically detect most new devices during
    a reconfigure boot.


    # 8.4.4 Devices Relevant to VMware Workstation


    The following is a guide to the devices relevant to VMware Workstation.


    Note For a complete list of devices, the Solaris 7 or 8 (Intel Platform Edition)
    Device Configuration Guide, in the one AnswerBook2.(Sun documentation is at http://docs.sun.com/
    and a few mirror sites.


    # IDE Disks


    There are two directories in /dev/: /dev/dsk for regular devices and


    /dev/rdsk for raw devices provide direct access to the disk.


    The first VMware device shows up as /dev/dsk/c0d0 and, with the BSD systems, it''s
    sliced. For example, the first disk /dev/dsk/c0d0 are the Unix partitions on the
    Solaris slice; the /dev/dsk/c0d1 partitions are the PC-style partitions. Each
    file in /dev/dsk has a raw disk in /dev/rdsk with the same name. Here is a full
    list of possible name assignments under VMware Workstation:


    | c0d0 | Primary Master |

    |---|---|

    | c0d1 | Primary Slave |

    | c1d0 | Secondary Master |

    | c1d1 | Secondary Slave |


    To partition a disk and put a filesystem on it, you must work with the raw devices.
    For example, to work with the slave drive on the primary interface, you''d use
    /dev/rdsk/c0d1p0, not /dev/dsk/c0d1p0.


    To partition a disk, use the format command on the Solaris slice, such as


    ```

    format /dev/rdsk/c0d1p0

    ```


    Here, if the disk is blank, or with no PC–style partition table (as a new VMware
    virtual disk would be), you''ll have to run fdisk to put one in place. The format
    command runs fdisk for you if it can''t find a partition table on the disk. When
    you have a PC partition table on the disk, run the partition command inside format
    to put partitions on the disks. Make sure to link the disk before you.


    Once you''re done with format, you must put a filesystem on the partition. Use
    newufs /dev/rdsk/devname where devname is a disk device.'
