    # 9.11 Using the VMnet Sniffer


    VMware Workstation comes with a handy command-line packet sniffer for its virtual
    network interfaces, which you can use to debug your network connections. On a
    Windows host, it''s vsniffer; you''ll find it along vmnetconfig in C:\Program
    Files\VMware\VMware Workstation\Programs. On a Linux host, it''s a program called
    vmnet-sniffer in your VMware binary directory.


    To run the sniffer on your host-only network, run one of the following:


    +   - Windows host vmsniffer vmnet1

    - Linux host vmnet-sniffer /dev/vmnet1


    Here is the output for a Red guest system power-on with the system getting its
    address over DHCP. Notice the MAC addresses:


    ```

    IP src 172.16.144.1 dst 172.16.144.255 UDP

    IP src 172.16.144.1 dst 172.16.144.255 UDP

    IP src 0.0.0.0 dst 255.255.255.255 UDP

    IP src 172.16.144.254 dst 172.16.144.130

    ICMP ping request len=8 type=8

    00:50:56:00:00:00 08 00 c4 04 08 00 38 00 05 08 e8 08 07 08 b4 db ff 7e 86 05
    08 74

    ```


    Here is an address resolution protocol (ARP) request, along with its reply:


    ```

    ARP sender 00:50:56:d4:9c:db 172.16.144.130

    target 00:00:00:00:00:00 172.16.144.1 ARP request

    ARP sender 00:50:56:01:00:00 172.16.144.1

    target 00:50:56:d4:9c:db 172.16.144.130 ARP reply

    ```


    On a Linux host, anyone can run the vmnet-sniffer program, but only those users
    with access to a /dev/vmnet* device can use the program on. If you have remote
    users but still find the local user to have access to the sniffer, you may need
    to change the ownership and permissions of the /dev/vmnet* device upon log-in
    to access the sniffer.


    You can also run thestats on a Windows host to get utilization statistics on a
    VMnet interface. Run this program without any arguments for a quick overview of
    the options; then use VMnetl1 to get information on your host-only connection.
    The program reports the number of packets transmitted, received, dropped, and
    so on. (VMware Workstation for Linux doesn''t come with this utility because you
    can run ifconfig -a or out /proc/net/dev for all network interfaces, not just
