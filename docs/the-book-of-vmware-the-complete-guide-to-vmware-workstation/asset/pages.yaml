  md: '# 7.4.1 ATA/IDE Disks


    To work comfortably with disks under FreeBSD, you must first understand FreeBSD''s
    device assignments and partitioning scheme. At the most basic level, FreeBSD uses
    /dev/ad* to represent ATA/IDE drives:


    | /dev/ad0 | Primary master |

    | /dev/ad1 | Primary slave |

    | /dev/ad2 | Secondary master |

    | /dev/ad3 | Secondary slave |


    FreeBSD''s partitioning scheme is not as simple as that of Linux and other Unix
    systems. A BSD disk label, traditional systems append letters (a to h) to the
    disk device to denote partitions on a disk; for example, /dev/sda0 would be the
    first partition of a disk for an old interface on a certain BSD-based system.
    However, FreeBSD is more complicated because it must integrate with other PC operating
    systems.


    If you want to share a disk between different operating systems—FreeBSD and Windows,
    for instance—you cannot do so if you place the BSD disk label directly on the
    main disk device. The label completely replaces the regular PC partition map,
    but Windows and other operating systems must read this map to make sense of the
    disk. To get around this problem, FreeBSD supports the usual PC disk maps, referring
    to the PC partitions as slices. In our example of /dev/ad0, slices /dev/ad01 through
    /dev/ad04 refer to PC partitions 1 through 4.


    FreeBSD treats a slice as it would a disk device and places the disk label inside
    the slice. BSD further cuts the slice into BSD-style partitions; because it uses
    the disk label scheme mentioned earlier, a letter in the range h appears after
    the slice device to denote the actual partitions (for example, /dev/ad01a). Figure
    7.1 illustrates this.'
