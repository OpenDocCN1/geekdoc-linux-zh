  md: '# # Appendix A: Linux Display Parameters


    #  Overview


    To really get a handle on your host''s X configuration, you need to edit the XF86Config
    file by hand. It''s normal in /etc/X11 or /etc, but it may also be in /usr/X11R6/lib/X11
    on your system. If you''re running XFree86 version 4, the configuration file may
    be XF86Config–4.


    Assuming that your XF86Config file has the proper settings for your video card
    (most configuration tools handle this correctly), you need to worry about only
    the video modes. These depend on your monitor, as well as your version of XFree8.


    This appendix doesn''t go into detail about how to set up an X configuration file;
    it only points out certain areas and parameters of interest. You should look at
    the XF86Config (5) manual page if you need more information than what is presented
    here.


    # ## A.1 XFree86 Version 3


    Find out which X server you''re running. Depending on your system, one of these
    commands should show it to you:


    ```

    ls -1 /etc/X11/X

    ls -1 /etc/X

    ls -1 /usr/X11R6/bin/X

    cat /etc/X11/Xserver

    ```


    The output from one of these commands should contain something like this:


    ```

    /usr/X11R6/bin/XF86_SVGA

    ```


    In this particular case, we''re using the SVGA driver. Skip down to the end of
    the XF86Config file and look for a section that has these lines (be careful; there
    may be several that look like ours):


    | "Screen" | "SVGA" |

    |--- |--- |

    | Driver | "Primary Card" |

    | Device | "Primary Monitor" |

    | Monitor | |

    | DefaultColorDepth | 32 |


    The definitions for Primary and Primary Monitor appear earlier in the XF86Config
    file. The DefaultColorDepth value is your bit depth and should be set as high
    as possible. If you don''t see this property in this section, it''s likely that
    your display is running in 8-bit mode (and as a result, your colors won''t look
    so great, especially on your web browser). If you want to change this, change
    the DefaultColorDepth line (or add if it''s missing), go down a little in the
    section, and look for a subsection like this:


    | SubSection "Display" |

    |--- |--- |

    | Depth | 8 |

    | Modes | "1280x1024" "1024x768" |'
