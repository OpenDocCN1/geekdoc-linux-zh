  md: '# # Appendix B: Upgrading from VMware Workstation 2 Overview


    If you upgraded from a previous version of VMware Workstation, there are a few
    changes to your guest systems that you need to make. Specifically, you need to
    upgrade your virtual hardware. If you choose not to upgrade the virtual hardware,
    you can still use the virtual machine, but you won''t be able to use all disk
    modes, and the guest operating system won''t access the new hardware in VMware
    Workstation 3: USB devices, generic SCSI devices, and so on.


    This appendix applies only to virtual machines and virtual disks that you created
    under the previous Workstation version (if you create a new virtual machine but
    use an old disk image, Workstation 3 treats the virtual machine like an old one).
    Any new configurations you create with new disks and fresh operating system systems
    have full access to all new Workstation 3 features.


    # ## B.1 Upgrading the Virtual Hardware


    The virtual machine upgrade process is somewhat involved, but if you understand
    why each step is important, you can avoid unnecessary trouble and wasted time.


    +   1. If you''re using a virtual disk, make a backup copy of your virtual disk
    file.


    +   2. Boot the virtual machine. If Upgrade Virtual Hardware in the Settings is
    dimmed, then you don''t need to upgrade your virtual hardware (don''t select this
    menu item yet).


    +   3. Install or upgrade to the VMware Tools on your guest operating system.
    This step is important because the Tools include drivers that work under the new
    VMware Workstation 3 hardware.


    +   4. Shut down the guest operating system and turn off the virtual machine''s
    power. VMware Workstation should notify you that you installed the VMware Tools.


    +   5. Select Upgrade Virtual Hardware from VMware''s Settings menu. You can perform
    this step only after upgrading VMware Tools over your guest system.


    +   6. A new window appears, telling you what you are about to do. When you confirm
    this screen, another window comes up with special instructions for your guest
    operating system. Take careful note of these (writing them down if necessary).


    +   7. Turn on the virtual machine''s power. The Upgrade Virtual Hardware item
    referred to steps 2 and 5 should now be dimmed.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Appendix B: Upgrading from VMware Workstation 2


    8.Carry out the special instructions you obtained in step 6.


    # B.1.1 Upgrading Windows Guest Systems


    When you boot a Windows guest system for the first time after upgrading the virtual
    hardware, the system automatically detects any new hardware, such as USB devices.
    Let Windows go through this process until it calms down.


    However, if the upgrade in step 6 of the previous section didn''t go smoothly,
    your virtual machine might not behave the way it should. In particular, the video
    drivers won''t work right: you won''t have full resolution or as many colors as
    you use. This is to fix—it''s just a matter of one too many active drivers.


    If your guest system is anything but Windows NT, the following:


    +   1. Go to the Device Manager (described in sections 5.2.1 and 5.3.2) and look
    for the video card. More the one card should show (at least one should have a
    small error icon). Right-click the video cards one at a time and choose the Uninstall
    or Remove option. Don''t reboot your system until you''ve gotten rid of all of
    the cards.

    2. Reboot your guest system. The Windows guest system will detect the video card
    and install the driver correctly (possibly making you reboot once more).

    3. Open the Display control panel and choose a new resolution if you want to.


    Windows NT is a little different:


    +   1. On the Display control panel, select the Settings tab. Click the Display
    button; a new Display window should appear. If the Adapter Type is shown as VMware
    SVGA II, you don''t need to do anything. Otherwise, click Change.

    2. A new window, Change Display, should appear. Scroll down the Manufacturers
    list and select VMware, Inc.

    3. Select VMware SVGA II in the Display list and click OK. Click Yes on the warning
    message that follows.

    4. Close the Display panel and reboot your NT guest system.


    # B.2 Upgrading Virtual Disks (Windows Host Only)'
