  md: '# Chapter 6: Linux Guest Operating Systems


    # 6.6.7 /dev/lp*, /dev/parport: Parallel Ports


    The Linux equivalents of LPT1 and LPT2 are /dev/lp0 and /dev/lp1. Bidirectional
    ports use /dev/parport*. (Under kernel versions 2.0 and older, what is now /dev/lp0
    was called /dev/lp1. It has been quite a while since these versions were current,
    but you should keep this change in mind when using old Linux distributions with
    VMware).


    The printing system in Linux is like many other versions of Unix: Berkeley lpd
    and LPRng are the most popular print spooling systems. Most distributions have
    tools that can correctly configure a local printer attached to the parallel port.


    # 6.6.8 Ethernet Interfaces


    Unlike Linux devices, the Ethernet interfaces eth0, eth1 and eth2 do not have
    corresponding device files in /dev. See the log files or use a command such as
    dmesg to find out which interfaces the Linux kernel found. To manually configure
    the Ethernet interface eth0 and its routing, use the ifconfig and route commands
    as, shown here:


    ```

    ifconfig eth0 10.2.3.121 netmask 255.255.255.0 broadcast 10.2.3.255

    route add default gw 10.2.3.1

    ```


    You can also use the ifconfig and route without arguments to see the current interface
    and route configuration.


    # 6.6.9 /dev/psaux: PS/2 Mouse


    If you choose to leave your virtual mouse available as a PS/2 mouse (one of the
    easiest types for Linux to use under the X System), it shows up at /dev/psaux.
    As a modem, your Linux distribution may create a symbolic link from /dev/mouse
    to the mouse device. The X server and a text-mode mouse program called gpm are
    the practically programs that Linux need to directly access the mouse device.


    # 6.6.10 /dev/dsp, /dev/audio: Sound Card


    The simplest way to sound devices under Linux is to dump an audio file to the
    /dev/audio device, as illustrated at the beginning of this section. If the file
    is not an audio file, what you get is best described as cacophony, even if the
    file contains sound, it may not work for file formats. Most programs that use
    employ /dev/dsp device; the program will play many audio formats.


    Because the sound data runs through VMware Workstation and out another driver,
    you may want to automatically set the volume of the Linux guest system at its
    maximum value in the dualconf.vm mentioned earlier in this chapter. Do so through
    the mixer device, using command-line utilities to manipulate it. (Red Hat has
    several called amixer.) To turn the mixer, PCM, and synthesizer volumes all the
    way up with it today, use this command:


    ```

    amixer -w 100 -s 100 -v 100

    ```


    Note some distributions save mixer settings at shutdown so they can be regained
    at the next boot. If you''re running VMware, you may want to disable this feature
    (in the rc.* or /directories), placing the desired settings in the dualconf.*
    files instead.'
