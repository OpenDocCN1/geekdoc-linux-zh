    # 10.8.2 Starting the SSH Server


    To enable remote access with SSH, you need to start sshd on the guest you want
    to access. You should be able to find the server in one of the guest system''s
    sbin directories: /usr/sbin or /usr/local/sbin.


    To make sshd start at boot time, you can add a script to your normal startup script
    set. On Linux distributions, this is the init.d system script; on BSD systems,
    you use the /etc/rc* scripts. Chapters 6, 7, and 8 for more information on these
    boot scripts.


    You can also start ssh using the inet superserver with the -i option. This is
    normally not a good idea because sshd performs numerical computations each time
    it starts, and since inet invokes a brand-new process for each connection, you
    can end up waiting for a while for every connection to initialize.


    # 10.8.3 SSH, Host–Only Networks, and Hostname Resolution


    SSH clients and servers are very strict about hostname resolution. In particular,
    they perform checks on the forward and reverse records and may bypass any paths
    except /etc/hosts, going directly to a DNS server regardless of your /etc/resolv.conf
    file. This can be a problem if you''re using a host–only network without any extra
    configuration, because the DHCP gives the host machine''s IP address as a DNS
    server by default. Unless you have a nameserver running on the host, when SSH
    on a guest system sends a request to the host, it never gets a response, and any
    incoming SSH connections hang.


    To get around this on a guest system, check the DNS configuration on the guest
    system and/or the guest''s DHCP configuration file (see section 9.4) to a real
    nameserver or an IP address on a network that the guest–only network can''t reach.
    The latter approach leaves the guest has no idea where to send its packets and
    generates a "network unreachable" error message immediately. One other way around
    the problem is to use IP numbers instead of names, but this can be inconvenient.


    # 10.8.4 SSH Clients


    Now that you have a server running on your guest operating system, you need a
    way to connect from your host operating system to your guest operating system.


    The best way for many applications is also using OpenSSH. Because the client and
    server packages together, the installation procedure for a Linux operating system
    is the same as for a guest operating system, except that you don''t need to worry
    about starting the sshd server.


    For Windows operating systems, get OpenSSH for Cygwin. See section 5.5 for more
    information on how to install Cygwin, though Chapter 5 focuses on Windows as a
    guest system, this section is the same for host and guest systems.


    To log in from your host operating system to your guest system, run this at a
    command prompt:


    ```

    ssh user@guest_system

    ```


    Here, you use your username on the guest system, and guest_system is the name
    or IP address of your guest operating system. The ssh program asks for your password
    on the guest system.


    You can copy files to and from the guest operating system with another OpenSSH
    program called scp (which)'
