  md: '# Chapter 2: The VMware Virtual Machine


    Another component on a PC''s motherboard closely related to the BIOS is the real-time
    clock (RTC). This is a small, battery-powered digital clock that operates when
    the computer is off, and it normally is used for setting the initial time and
    date when the system boots. VMware maps the host system''s true RTC to a virtual
    device. If something else is using the RTC, VMware emulates it with datestamps
    from the host operating system—but this is not the same as the RTC.


    # 2.4 How a PC Boots


    Before you begin working with an operating system on a VMware virtual machine,
    you should know how a real PC boots. The PC''s BIOS oversees the first stages
    of the process. Since there are several ways that you boot a PC (from the floppy
    drive, hard drive, CD-ROM, or even a network), the BIOS looks at the devices in
    a particular order. It may first decide to look at the floppy, and if there''s
    nothing in the floppy, it sees whether the hard disk has a boot block, and so
    on.


    The BIOS approaches each kind of device. Floppy disks are very simple and have
    a fixed boot sector that loads a program on the floppy. Since floppy disks do
    not have partition tables, this scheme works fine. CD-ROM drives are a bit more
    complicated; you normally put an image of a bootable floppy disk somewhere on
    the CD-ROM filesystem and activate a special ISO9660 extension to point to it.


    Because they have partition tables, hard drives are more complex. You normally
    put a boot loader on the partition of the partition table. However, at boot time,
    the BIOS loads sector 1 on the disk, which is called the *master boot record*,
    or [MBR](https://en.wikipedia.org/wiki/Master_boot_record)_. The BIOS runs whatever
    it finds in the MBR. Normally, this is a tiny program that tries to find an active
    partition in the partition table and if it is found, loads another boot sector
    from that partition (which is your operating system''s boot loader, from above).


    This is a problem if you have multiple operating systems on the same disk, as
    you may deal with dual-boot configurations with VMware. Some boot loaders, such
    as Linux Loader (LILO) and the FreeBSD boot loader, are capable of loading the
    boot sectors on other partitions. The BIOS first loads LILO from the active sector
    (normally on a partition), and you can jump from there to the boot sector on the
    Windows partition.


    You can circumvent the active partition by replacing the default MBR with your
    own boot loader. You''ll often find this scheme in place when the disk is too
    large for the BIOS to handle. LILO makes circumventing the active partition easy;
    for example, just /dev/hda instead of /dev/hda1 for the boot device. What is not
    so easy is to remove this custom boot sector once it is in place. You can use
    the OS fdisk /MBR command or try to find the LILO backup of the original boot
    sector.'
