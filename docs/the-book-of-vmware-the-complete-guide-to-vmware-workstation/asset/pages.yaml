    # 7.7 FreeBSD System Statistics


    When running FreeBSD under VMware Workstation, you may be interested in how well
    your guest system manages its resources. An invaluable tool for finding out the
    vmstat command. Its output, with arguments looks like this:


    | proc r b w | memory avm free flt re pi po | disks sr a0 da0 | faults in sy |
    cpu us sy id |

    |---|---|---|---|---|---|---|---|---|---|---|---||

    | 1 0 0 | 15896 4512 36 1 1 0 | 32 7 0 | 206 210 23 3 4 9 |


    One thing of particular interest is the figure under free; this is the number
    of remaining memory pages. Pages are 1024 bytes, so in this example, there are
    roughly 4.5 MB free on the system. Active pages show under avm: if a process did
    something in the past 20 seconds, it is considered active, and its pages go toward
    the avm total.


    The proc statistics permit to system load. The number under r shows how many processes
    are ready to go, b signifies ready to run but (waiting for disk, for example),
    and w indicates processes that would be ready to run but swapped out of real memory.
    If you have a lot of processes under r, then either you need a faster CPU or you''re
    running some long-term jobs. If anything appears under w, your system is slow
    because you need more memory.


    The rest of the information has to do with kernel performance; page faults and
    replacements, disk statistics, and CPU usage. If you''ve ever taken a course on
    operating systems, this may be of some interest to you, and you should read the
    vmstat manual page. Running vmstat with a number n as an argument keeps vmstat
    running, updating it every n seconds.


    The /proc filesystem on FreeBSD doesn''t offer the same kernel-level information
    that Linux does (the Linux /proc is somewhat "impure" because it has so much extra
    information in addition to the process statistics). You can get most of the kernel
    parameters in FreeBSD through special programs that talk to devices in /dev; example
    of this is the mixer utility for a sound card''s mixer.'
