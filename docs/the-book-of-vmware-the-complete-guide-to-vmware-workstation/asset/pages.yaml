  md: '# Chapter 4: Virtual Machine Configuration and Operation


    Suspend/Resume has several. One is using the long boot sequence of certain systems.
    Windows, for example, has a tendency to take a painfully long time to start. Instead
    of shutting down the machine every time you want to get out of Windows, suspend
    it. A resume operation can take a little time depending on the state where was
    saved, and it''s normally a bit faster than waiting for the guest system to boot,
    especially if the process involves a loop of repetitive disk access.


    Another reason you might want to resume is to save memory or CPU resources on
    the host system. In addition to the memory that all guest systems use, operating
    systems also consume a certain amount of processor time when they''re not doing
    anything for the user, because they''re performing memory management, system uptime,
    and other important tasks. (One benefit is if you suspend a virtual machine on
    a notebook, it preserves power, and your battery lasts longer.)


    VMware stores the suspended state of guest operating on the host system''s disk.
    You''ll find this file in the same directory as the virtual machine''s configuration
    file, with extension .vmss. Depending on the amount of memory configured for the
    guest system, this file can get fairly large, so it''s a good idea to reserve
    some space on your host system''s disk. With suspend operations, you can exit
    VMware after suspending and resume at a later time. You can resume after you reboot
    your host machine, a common situation with notebooks.


    VMware''s suspend feature is similar to suspend on a notebook and on some desktop
    machines, except that it doesn''t need to talk to the disk and APM interface of
    the BIOS or guest operating system. For default, setting the APM in the BIOS is
    off. You can use APM if you like (there''s an option in Misc in the Configuration
    Editor), and when you need, the Suspend/Resume button acts like a Suspend/Resume
    button. Be careful about using APM on dual-configuration systems, because it might
    cause the guest system to save its state to a certain partition on your hard drive
    that may clash with the host system. If you press the VMware Suspend button and
    then press the realpend button on your real computer, the host system may overwrite
    the guest state, and when you want to restore, something unpleasant will happen.
    Therefore, you should leave the APM features off unless you really know what you''re
    doing.


    # 4.8.1 Performance Notes


    Sometimes, a suspend operation may take some time and may eventually freeze the
    host system while VMware writes all the state data to the guest. The time depends
    on several factors. One is the amount of information that changed on the guest
    system based on the last suspend operation. Suspending takes longest if you haven''t
    performed a previous suspend operation on the system. Changes include the virtual
    machine''s disk as well as its memory; VMware caches disk operations and write
    its cache to disk during a suspend operation.


    The second factor affecting the time it takes to suspend is the amount of physical
    memory configured on the virtual machine. The more memory, the more time it takes
    to write that memory to a state file.


    Finally, the disk and filesystem on your host machine can affect performance.
    If the host disk is on a different interface or controller than your system disk,
    the host system will be vulnerable to a temporary freeze during a suspend operation.
    Modern SCSI disks tend to be faster than IDE/ATA disks because they are meant
    for server applications. And Notebook disks are always slower than their desktop
    counterparts. However, you can get better performance on suspend operations with
    an IDE/ATA disk by tweaking your device drivers. For Windows host systems, make
    sure the host system has all applicable high-bandwidth drivers installed and enabled.
