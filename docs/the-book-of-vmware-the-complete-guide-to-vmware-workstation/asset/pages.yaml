    # 9.7.3 Other NAT Alternatives (for Advanced Users)


    If you need more flexibility than VMware Workstation NAT offers, you are always
    free to use a VMware host-only network to do the job. You may find that other
    NAT implementations have features that you need; Linux, with drivers capable of
    tracking a number of protocols (and you can always write more if you need to).


    For this example, this command sets up NAT on a host-only network:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    iables -P FORWARD DROP

    iables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    iables -A FORWARD -i vmnet1 -j ACCEPT

    iables -A FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT

    ```


    Notice that the third line specifies the interface connected to the outside world
    (eth0 in this case), and the fourth line allows forwarding across the vmnet1 interface
    (the default host-only network interface).


    If you choose to configure NAT this way, you must modify your host-only DHCP configuration
    file to provide a default gateway and nameserver to your guest operating systems.


    # 9.8 VMnet Devices


    To coordinate the virtual interfaces on the host operating system, VMware Workstation
    configures several VMnet devices, numbered starting at 0. Normally, VMware assigns
    0 to the bridged network, device 1 to the host-only network, and device 2 to the
    NAT network. When you use the Configuration Editor to set up a guest system, these
    device numbers correspond to the bridged, host-only, and NAT network connections.
    (We''ll discuss the other devices, for custom networks, in section 9.9).


    The next subsections will show you how to view the active interfaces for the host
    systems.


    # 9.8.1 Linux Host


    To see the current VMnet device assignments on a Linux host where there are several
    /dev/vmnet special devices, except


    ```

    ps auxww | grep dev/vmnet

    ```


    On a normal system, you should get output with vmnet-bridge and vmnet-netifup
    processes running on their respective /dev/vmnet devices.'
