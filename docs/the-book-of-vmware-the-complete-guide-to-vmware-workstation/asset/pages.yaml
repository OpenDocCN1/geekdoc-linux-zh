  md: '# # Chapter 6: Linux Guest Operating Systems


    #  Overview


    Linux is the most popular flavor of Unix on the x86 architecture. It began as
    Linus Torvalds’ little kernel, intended for only hackers. Posted to Usenet in
    1991 announcing its availability and saying that it was to hack on it. Many people
    did. Aiding development significantly was the GNU project.


    All Linux distributions contain the Kernel, numerous system and user packages,
    and an installer. Because Linux uses open source code, allowing anyone to do anything
    they want with it, there are many Linux distributions. The most common distributions
    include Red Hat, Mandrake, Debian, S.u.S.E., Caldera, Corel, and TurboLinux, though
    there are many others.


    The Linux distributions differ by their intended audience. For example, Corel,
    Mandrake, Red Hat, and S.u.S.E. are end-oriented, while TurboLinux and Caldera
    target the server platform. (Debian is a clean, low-thrills system that appears
    more to experienced Unix purists.)


    # ## 6.1 Running Linux as a Guest under VMware


    If you''re planning to use Linux under VMware, you''ll need to know a few basics
    to get the most out of it. This chapter assumes you''re familiar with the few
    files and directories in Linux, and how to navigate the directory structure (using
    cd, and so on). This chapter also assumes that you know how to use a text editor,
    preferably vi or emacs. If you have ever had an account on any kind of Unix system,
    you probably won''t have a problem with anything


    Much of the material we will discuss is intended for use at a shell command prompt,
    either accessed from a virtual terminal in text mode or from a terminal window,
    if you''re running a Linux GUI under the X Window System. (Look for a menu item
    labeled **Terminal, Shell, Command Prompt, xterm**, or something like this, or
    an icon that looks like a black–and–white terminal). When this chapter says “this”,
    type at the command prompt in one of these windows or at the console.


    Note we''ll mainly talk about system configuration, you''ll need to do most of
    the tasks in this chapter as the superuser (root).


    # ## 6.2 System Requirements


    Linux hardware requirements are relatively light. The kernel itself doesn''t use
    much memory, and the rest of the system’s demands depend on how many services
    you run and where you use the X Window System.


    If you have a machine running VMware, and a guest operating system of Windows
    runs fairly slowly, there''s a good chance that Linux as a guest system will run
    faster, especially if you run it in text mode. Linux consumes more resources,
    particularly memory, and large GUI environments like GNOME or KDE consume more
    memory than almost anything else on a typical Linux system.'
