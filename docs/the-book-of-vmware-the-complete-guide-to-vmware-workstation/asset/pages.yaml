    it is to enter in the Reserved size box. You can also turn off the memory limit
    by checking the Enabling limits box.


    Your settings here depend on the type and number of your guest operating systems,
    and so on how much RAM you have on your host. If you use the recommended value
    for the amount of host memory and do not change the Memory setting in the Configuration
    Editor for your virtual machine, you probably won''t run into trouble. If you
    have problems with memory performance, your virtual machine won''t power on (because
    it doesn''t have enough memory), or if you feel you''re wasting so much memory,
    do some calculations and experimentation.


    First, find out how much memory (MB) each of your guest uses using the Memory
    setting in the Configuration Editor. Then determine how many systems you''ll run
    at once—call this n. Look at all of the memory figures together and add the top
    n numbers. Take this sum and add n 10 MB to it. (This extra 10 MB per guest system
    is typical).


    The number you get is the maximum amount of memory VMware should ever need, and
    to be on the safe side, you can set the reserved memory to this amount. However,
    other processes on your host can''t touch this memory when it is occupied by virtual
    machines, you may feel you''re wasting resources (reserving this memory may severely
    degrade your host''s performance). Therefore, consider setting the reserved memory
    less than your theoretical maximum.


    Because guest operating systems in small chunks called pages, VMware doesn''t
    need to give out of its reserved memory at once. However, if VMware Workstation
    runs out of reserved memory, it powers off the virtual machine that asked for
    it.


    VMware doesn''t reserve the memory on the right away. When a virtual machine requests
    a page, VMware goes out to the host system and locks a page. If any other program
    on the host is using that page, the host operating system will probably kick that
    program''s data to the swap area on disk. The operation is costly to the host
    system and will properly slow down the system with the displaced page.


    Be careful not of asking for too much reserved memory, the memory limits. If VMware
    asks for more memory than your host has, your host system will thrash. In other
    words, it will continuously swap pages back and forth as disk processes ask for
    pages (or your system may just starting programs that ask for more memory, or
    just hang). If you''re considering turning this safety check off, consider installing
    more memory.


