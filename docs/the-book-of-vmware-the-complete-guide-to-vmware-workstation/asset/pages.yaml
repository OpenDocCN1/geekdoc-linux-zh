    # 6.5 XFree86 Server Configuration


    The VMware Tools for Linux includes new graphics drivers and a new server for
    the X Window System. Using it while running the guest system under VMware not
    only enables you to run X sessions with higher resolutions and more color (also
    in full-screen mode), but also greatly improves session performance over that
    with the VGA16.


    Most Linux distributions include XFree86, the free X Window server. There are
    two versions of XFree86 in current distributions: 3.x and 4.x. The Tools installer
    detects the version installed on your system and installs the proper programs,
    drivers, and configuration files. To determine the version you''re using, look
    for /usr/X11R6/lib/modules directory. If it exists, you have XFree86 4.


    # XFree86 Version 3


    Graphics drivers in XFree86 3.x are compiled directly into the server. VMware
    Tools for Linux includes such a server, called XF86_VMware. The configuration
    file is called XF8Config. The server normally looks for this file in /usr/X11R6/lib/X11,
    but this is a symbolic link to some other place in the system, the location of
    which depends on your distribution. Red Hat, for example, keeps the real XF8Config
    in /etc/x11, and some versions of Debian use etc. The VMware Tools installer attaches
    a server configuration for XFree86_VMware, named XFree86Config, in this directory.


    The installer then renames existing XFree86Config to XFree86conf and creates a
    symbolic link from XFree86Config to XFree86conf.vm. The XFree86Config/ files should
    look something like this:


    ```

    lrwxrxr-x 1 root root 22 Mar 11 2001 XF86Config -> /etc/X11/XF86Config.vm

    -rw-r--r-- 1 root root 15456 Mar 7 04:27 XF86Config.org

    -rw-r--r-- 1 root root 3801 Mar 8 14:07 XF86Config.vm

    ```


    The installer does the same thing with the symbolic link to the X server, which
    is simply named X. This can get confusing, if the installer renames a link and
    then creates two more. This is for /etc/X11/X on a Red Hat system with XFree86_SVGA
    server before the VMware Tools installs:


    ```

    lrwxrxr-x 1 root root 30 Mar 7 04:27 X -> ../usr/X11R6/bin/XFree86_SVGA

    ```


    (Remember that .../ is just here.) This is how it looks after:


    ```

    lrwxrxr-x 1 root root 13 Mar 11 2001 X -> /etc/X11/X.vm

    lrwxrxr-x 1 root root 30 Mar 7 04:27 X.org -> ../usr/X11R6/bin/XFree86_SVGA

    lrwxrxr-x 1 root root 26 Mar 8 14:07 X.vm -> /usr/X11R6/bin/XFree86_VMware

    ```


