    compared to any modern operating system, and their driver structures are not uniform.
    For example, there are several network driver types, and there to use one of the
    drivers, you need a set of network clients suitable for specific kind of driver.
    Windows 3.1 may have additional drivers for some devices, which only adds to the
    confusion. Furthermore, a number of these drivers do not come with DOS or Windows
    3.1; you need to get them from various vendors.


    Installing DOS and Windows 3.1 onto a new virtual machine is the same as for a
