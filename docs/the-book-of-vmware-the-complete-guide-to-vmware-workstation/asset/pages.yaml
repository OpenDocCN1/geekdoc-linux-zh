  md: '# # Chapter 12: Troubleshooting


    # ## Overview


    In some respects, getting to the root of a problem with VMware Workstation isn''t
    much different than finding a problem on a real PC. All computers have their own
    little operational quirks, and VMware is no exception. And as the problems vary
    from system to system on real computers, you''ll find that this is also the case
    with VMware. (Remember that a virtual machine is a hybrid of sorts—while its virtual
    hardware is uniform and well-documented, it uses your real processor, and any
    guest operating system acts as it would under that. Add your own special virtual
    hardware configuration and the guest system''s driver characteristics, and you
    can see that there are a lot of variables.)


    This chapter has three parts. The first part describes general troubleshooting
    procedures. This will give you a better idea of how to gather information about
    a problem with VMware Workstation and where to look for its solution.


    The second and largest, part of the chapter offers a list of common trouble spots
    and their solutions. We take the point of view that a problem isn''t really fixed
    until you know why it occurred. Therefore, explanations accompany the fixes.


    Finally, a small section details one to recover from a virtual machine crash,
    using a guest operating system tuned specifically for that purpose.


    # ## 12.1 General Troubleshooting Procedures


    This section presents some general procedures you can follow to diagnose and fix
    a problem with VMware.


    # ### 12.1.1 Try to Identify the Part of the System That''s Causing Trouble


    If one of your devices doesn''t work, the problem has a scope and may lie in the
    guest operating system''s user interface, the guest''s drivers, the VMware guest
    or host configuration, your host system''s drivers, or the real hardware. Do the
    following to determine where the problem lies:


    +   - As a sanity check, make the host''s hardware and drivers work. Try to do
    something that similar to what you''d do on a guest system. (For example, if your
    guest can''t talk to the serial port, make sure that you can run a terminal program
    from the host.)

    - Make a quick inspection of your guest system''s virtual hardware in the VMware
    Configuration Editor. Make sure that the devices point to the right places, and
    perhaps more important, if Linux is your host, make sure that you clicked the
    Install button to bring the device into the configuration (this is an easy procedure
    to overlook).'
