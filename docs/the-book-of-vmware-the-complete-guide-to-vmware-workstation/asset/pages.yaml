  md: '# Chapter 9: Host and Guest System Network Configuration


    Your local area network has plenty of free addresses.


    Connection tracking shortcomings in NAT make it unusable for your applications.
    See section 9.7 for more details.


    Figure 9.1 shows a host machine and three virtual machines with bridged networking.
    (Note that there is a layer of virtualization between the guest systems and the
    real network interface, the connection is essentially directly.)


    Setting up a bridged interface on your virtual machine is just like setting up
    a network interface on any other machine on your local area network (section 9.5
    for information on each guest operating system). However, bear in mind that each
    bridged network interface must have its own unique network address (IP for most
    networks). You cannot use the same address as your host machine or any other machine
    on the network, and you should not pick an address at random if you don''t know
    what to choose. (In some cases, you can safely get an address with the DHCP protocol,
    but if you don''t know for sure, ask your network administrator.)


    ![](img/aa552d73360a647bd96f567236c5ca1a_147_0.png)


    Figure 9.1: Bridged network interface


    You can'' use bridged networking if your host machine''s network interface isn''t
    Ethernet (if your sole network connection is a PPP dial-up connection, or if your
    local network is not Ethernet—FDDI, for example).


    If you can''t come up with a network address, can''t use bridged networking, or
    don''t want to use a bridged network, your alternative is NAT networking (see
    section 9.7).'
