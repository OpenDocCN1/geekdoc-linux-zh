  md: '# Chapter 10: Network Services


    # Overview


    Now that your VMware is up and running, it''s time to look at some of the services
    you can run over the network. We''ll emphasize file sharing between the host and
    guest operating systems in this chapter. However, we''ll also touch on other stuff
    such as how to send X Window clients from the guest to the host, and the use of
    web proxies servers.


    This chapter focuses on the things you can do with host-only and NAT networks
    because these types of network are unique to VMware. (Bridged networking is no
    different from any other network client; therefore, you may find only the sections
    dealing with client configuration for this type of networking.)


    Remember that you''re not limited to the services mentioned in this chapter, since
    you can do anything on a VMware host-only or NAT network that you can on a real
    network.


    The material in this chapter is divided into categories of network services. The
    topics are file sharing with SMB shares, network printing, remote log-in access
    to a guest system, and proxy servers (an alternative to NAT for broader network
    access for guest systems on a host-only network). Because the procedures vary
    for different host and guest systems, we will split the material first by host
    system (which is normally the server) and then by the type of guest.


    Because there are several kinds of host and guest systems, you will probably need
    to read only pieces of this chapter. Go ahead and mix and match as you fit. For
    example, if you''re running VMware Workstation for Windows, read the Windows sections
    and look for the sections that fit your situation. There is one exception: the
    SAMBA printing server for Linux host uses the same utilities as the SAMBA file
    sharing server on a Linux host, so you need to read section 10.1 before section
    10.5.1 to learn about configuration file and daemon processes.


    Note the presentation for host systems is a little different than other chapters.
    The trickiest system to configure is a Linux host that wants to talk to a Windows
    guest, the Linux host sections are first, but the order goes in reverse for guest
    systems. In general, the configuration of all services depends on the host operating
    system (unless you''re configuring a guest for use by the host and other guests;
    in this case, Unix servers work the same).


    # 10.1 SMB Fileserver (Linux Host)


    This section tells you how to get access to files on a Linux operating system
    to Windows guest systems on a VMware host-only or NAT network. The material here
    goes along with section 10.3, which explains how to access files with the guest
    system. If you have a Windows host system, skip ahead to section 10.2.


    VMware Workstation for Linux comes with SAMBA, a server that allows Windows to
    access Linux filesystems using SMB/CIFS protocol. Aside from a small extension
    to allow multiple servers on the host, nothing is particularly special about VMware
    version. One of the most important things to know is that vm-config.pl script
    can automatically create a configuration file for host-only or NAT networks and
    add users to the SAMBA password file. This feature can save you a lot of time:
    Since SAMBA has million configuration parameters, it can take a while to get down
    to the right subset.


    The easiest way to create a SAMBA configuration file and start the server is to
    run vm-config.pl and answer y to the question about whether to automatically configure
    your system to allow your virtual machines'
