    To switch to full-screen mode, click the Full Screen on the toolbar or select
    Full Screen from the View Menu. To get back to your host system and return VMware
    to your usual window mode, press ctrl-alt. With no configuration, your host system
    should support full-screen mode in text and in the generic 640x480 VGA mode. However,
    to get better resolution, you must install the VMware Tools on your guest to get
    the specific VMware display driver. (The VMware Tools are currently available
    for Windows 95/98/Me/NT/2000/XP, Linux, FreeBSD.)


    Superficially, implementing full-screen mode seems no different than maximizing
    any window; however, there are significant differences that require a certain
    amount of host and guest operating system configuration to get the best results.
    Both systems must support the same guest resolutions. If they do not, you can
    use full-screen mode, but it will look awkward. If your host''s resolution is
    greater than that of the guest, and the host''s resolutions aren''t fully enabled,
    the guest display shows up centered on the host system and surrounded by a black
    border. In this case, the results are not much different from running VMware within
    a window because the pixel size is the same.


    Your host operates at a certain pixel resolution, bit depth, and refresh rate.
    The pixel resolution determines the number of dots on the screen; for example,
    1024x768 is 1024 pixels and 768 pixels high. The bit depth determines the number
    of colors available at any time. Eight bits per pixel gives 256 colors, sixteen
    bits give 65,536 colors, and twenty-four bits give a maximum of 16,777,216 colors.
    The refresh rate is the number of times the screen repeats per second. You should
    try to match at least 72 Hz (72 times per second) on your host system without
    anything causing eye strain. (This applies only to CRT screens. If you have an
    LCD display, you don''t need to worry about this.)


