    Early mice normally connected to a computer''s serial ports. Naturally, VMware
    Workstation supports this configuration, since it supports serial devices. Of
    course, you''ll likely need to attach an extra mouse to your computer if you want
    to use this configuration.


    # 2.2.10 Sound Cards


    The state of PC sound cards is somewhat chaotic. There are many different varieties,
    all with their proprietary hardware schemes. Nevertheless, they all have a few
    things in common, like the fact that they all have digital signal processors and
    mixers. VMware translates the host''s sound device to a Creative Technology SoundBlaster
    16 card, at the factory settings: IRQ 5, I/O ports 0x220 to 0x22f, DMA channel
    1 (16-bit DMA channel: 5). Because these are the defaults for most drivers, guest
    system support shouldn''t be a problem, though VMware may not support SB16 (such
    as the


    MP401 MIDI UART.


    Note Because sound card uses IRQ 5, you may have problems in VMware Workstation
    if you try to configure a bidirectional port on the second parallel port when
    sound is present, because that port also uses IRQ 5. Most guest systems don''t
    bother on unidirectional parallel ports and instead use a polling interface, so
    you may have some degree of success with this configuration. The only way to find
    out is to try.


    # 2.3 PC BIOS


    All PCs have a BIOS (or basic input/output system), which is a small piece of
    firmware on the motherboard. The BIOS knows how to talk to devices on a PC in
    a limited capacity.


    Older operating systems as DOS relied on the BIOS for configuration and hardware,
    but newer systems use it only for basic configuration and booting. The BIOS performs
    the performance and peripheral tests when you turn on a computer and is responsible
    for the beep you after the tests. The BIOS may also display all sorts of information
    about your computer.


    Some vendors like to hide their BIOS screens, though there''s always a key sequence
    you can use to display a setup utility. This setup tool is essential to any BIOS.


    Each vendor''s BIOS has its own degree of complexity. The basics include your
    floppy disk configuration, a few hard drive partitions, the boot sequence, and
    power management options. Some BIOS offer a degree of customization beyond this.
    Regardless of the number of bells and whistles, the BIOS must store these settings
    somewhere that the user doesn''t have to enter them every time the computer is
    turned on. The BIOS normally stores its configuration in nonvolatile memory, or
    NVRAM, that stays in place either in flash memory or battery—operated memory.


    Like a real PC, VMware also has a BIOS based on the Phoenix BIOS. You''ll find
    a description of its configuration utility in section 4.14: VMware stores its
    BIOS NVRAM in a file on the host system.


    Note You can find too much information about the PC BIOS at http://www.wimsbios.com/'
