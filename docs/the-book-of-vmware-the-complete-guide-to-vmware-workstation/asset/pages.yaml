    **Problem:** Your guest system doesn''t boot, and the disk settings seem incorrect.
    The virtual BIOS beeps a lot after you power on the virtual machine.


    **Fix:** In rare cases, the NVRAM file that VMware uses to store BIOS settings
    becomes corrupt. This file contains configuration data such as the floppy drive
    offset and boot sequence data. If the BIOS reads the NVRAM incorrectly, you may
    have trouble allocating IRQs in the virtual machine, reading disk geometry, and
    so on.


    The easiest way to fix these problems is to shut down the virtual machine and
    delete VMware, delete the NVRAM file. (Remember that the file is called nvram
    on a Windows host, and the file name ends with .nvram on a Linux host.) When you
    power on the virtual machine again, VMware creates a new NVRAM file.


    **Problem:** You deleted or corrupted your virtual configuration (.vmx or .cfg
    file).


    **Fix:** Use the Configuration Wizard to create a new configuration file and copy
    it over your old one. Everything won''t work perfectly until you''ll leave some
    virtual hardware. To solve that problem, use the Configuration Editor until you
    get the results you want.


    If you think your configuration file is corrupt, try deleting the NVRAM file first,
    as outlined in the discussion of the previous problem.


    **Problem:** Your guest system doesn''t recognize the virtual floppy drive, even
    though you added it with the VMware Configuration Editor.


    **Fix:** The VMware BIOS doesn''t automatically pick up changes made to floppy
    drives with the Configuration Editor; you must go into the BIOS setup and add
    them manually. (See section 4.14 for more information on the BIOS.)


    To do so, press F2 when the guest system boots, move the cursor to Legacy Diskette
    B;usually what you want is the 1.44/1.25 MB drive). Then press F10 to bring up
    a list of floppy drives and save the BIOS. Make sure that you go into the BIOS
    and disable the floppy if you ever decide to remove the virtual floppy device
    in the Configuration Editor.


    Also, if you have a Linux system, make sure that you clicked the Install button
