    If you need to access more than ten positional parameters (i.e. more than $0 through\
    \ $9), you need to put the positional parameter within an inline group (curly\
    \ braces). Thus, positional parameter ten is ${10}, eleven is ${11}, and so on.\n\
    \n## Special parameters\n\nSpecial boundaries are boundaries that Bash treats\
