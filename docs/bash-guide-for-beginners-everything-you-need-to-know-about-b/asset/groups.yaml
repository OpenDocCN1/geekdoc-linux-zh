    ## Arrays, associative


    ### Structure

    | array | string label | value | string1 | value1 | otherstring2 | value2 | .
    . . . | another3 | valueN |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |


    ### Declaration

    Usage

    `declare -A array`


    | Usage | Description |

    | :--- | :--- |

    | array[str]=value | Create array: Declares an empty array, array. |

    | Create & set array key | Declares array, array, and sets its first string label
    to value. |


    ### Storing values

    | Usage | Description |

    | :--- | :--- |

    | Set array value | array[str]=value: Sets the element indexed by str of array
    to value. |


    ```

    array[str1]=value1, [str2]=value2, . . . [str3]=valueN

    ```


    ### Compound set array values

    Set the elements indexed by strings, str1, str2, and str3, to value1, value2,
    . . . valueN respectively. Any previously set array values are lost.


    ### Retrieving values

    Usage | Description |

    | :--- | :--- |

    | Expand value | ${array[str]}: Expands to the element indexed by str of array.
    |

    | Mass expand | ${array[@]}: Expands to all values in the array. If double quoted,
    it expands all values individually. Output is in order. |

    | Mass expand | ${array[*]}: Expands to all values in the array. If double quoted,
    it expands all values as a whole. Output is in order. |


    ### Metadata

    Usage | Description |

    | :--- | :--- |

    | ${#array[str]} | Value string length: Expands to the string length of the element
    indexed by str. |

    | ${#array[@]} | Expands to the number of values in the array. |

    | unset -v array | Deletion: Completely erases the array. |

    | unset -v array[str] | Erases the element indexed by str from array. |

    | unset -v array[@] | Completely erases the array. |


    ### Array indexes |


    ### Array values

    Expands to the string labels in the array.


    ### Special characters

    | Character | Description |

    | :--- | :--- |

    | # | Comment: Lines beginning with a hash will not be executed. |

    | & | Run in background: Cause the preceding command to run in the background.
    |

    | ; | Command separator: Allows for the placement of another command on the same
    line. |

    | || | Logic: Logical operator. Returns a success if either of the conditions
    before or after the operator are true.


    ### Directory traversal

    | Character | Description |

    | :--- | :--- |

    | ~ | Home directory: Represents the home directory, and the current user’s home
    directory when followed by a forward slash. |

    | . | Current directory: A dot in front of a filename makes it "hidden". Use `ls
    -a` to view. |

    | / | Directory: A dot separated from a filename by a space sources (loads) the
    file. |

    | .. | Parent directory: A double dot represents the parent directory. |


    ### Filename separator

    A forward slash separates the components of a filename.


    ### Quoting Character

    | Character | Description |

    | :--- | :--- |

    | \ | Escape: Escapes the following special character and causes it to be treated
    literally. |


    ### Full quoting

    Special characters within single quotes lose their meaning and become literal.
    Word splitting is not performed on the contents.


    Partial quoting

    Special characters within double quotes lose their meaning, with the notable exception
    of parameter expansion, arithmetic expansion, and command substitution. Word splitting
    is not performed on the contents.


    ### Redirection Character

    | Character | Description |

    | :--- | :--- |

    | > | Output redirection: Redirects standard output, typically to a file. |

    | >> | Output redirection: Redirects and *appends* standard output, typically
    to a file. |

    | < | Input redirection: Redirects standard input, typically for reading in a
    file’s contents. |


    | Character | Description |

    | :--- | :--- |

    | << | Here document: Reads in strings of data until a specified delimiter is
    encountered. |

    | <<< | Here string: Reads in a single string of data immediately following. |

    | \| | Pipe: Redirects the standard output of a command to the standard input
    of another command. |


    ### Groups

    | Character | Description |

    | :--- | :--- |

    | {} | Inline group: Commands within the curly braces are treated as a single
    command. Essentially a nameless group. |

    | () | |


    ### Wildcard

    | Character | Description |

    | :--- | :--- |

    | [...] | Wildcard (character): Serves as a match for a single character. |

    | (string) | Serves as a match for any number of characters. |

    | (list) | Serves as a match for a list of characters or ranges. |


    ### Null globs

    ```

    shopt -s nullglob

    shopt -u nullglob

    ```


    ### Extended globs

    ```

    shopt -s extglob

    shopt -u extglob

    ```


    | Glob Description | Description |

    | :--- | :--- |

    | ?(list) | Matches exactly zero or one of the listed pattern. |

    | *(list) | Matches any number of the listed patterns. |

    | @(list) | Matches exactly one of the listed patterns. |

    | +(list) | Matches at least one of the listed patterns. |

    | !(list) | Matches anything **but** the listed patterns. |


    ### Parameters

    | Positional Parameter | Description |

    | :--- | :--- |

    | $0 | The called name of the script. |

    | $1, $2, ... $9 | Print the arguments 0 through 9 passed to the script. |

    | ${10} | Print the arguments 10 and higher. |


    ### Special Parameter

    | Character | Description |

    | :--- | :--- |

    | $* | |

    | $@ | |

    | ? | |

    | $! | |

    | $$ | |

    | $_ | |

    | $ | |


    ### Expansion | Description |

    | :--- | :--- |

    | $* | The number of positional parameters passed to the script. |

    | $@ | The positional parameters. If quoted, results in all of them. |

    | ? | The exit code of the last command. |

    | $! | The process ID of the last background job. |

    | $$ | The process ID of the shell. |

    | $_ | The last argument of the last command. |

    | $ | The first argument of the last command. |


    ### Command substitution

    | Character | Description |

    | :--- | :--- |

    | $() | Works exactly the same as arithmetic expression, except the entire expression
    replaced with its mathematical result. |


    ### Substring removal

    | Usage | Description |

    | :--- | :--- |

    | ${parameter:offset:length} | Results in a string of length characters, starting
    at offset. If length is not specified, takes all characters. If length is negative,
    count backwards. |

    | ${parameter#pattern} | Searches from front to back parameter until the first
    occurrence of pattern is found and deletes the result. |

    | ${parameter##pattern} | Searches from front to back parameter until the last
    occurrence of pattern is found and deletes the result. |

    | ${parameter%pattern} | Searches from back to front parameter until the first
    occurrence of pattern is found and deletes the result. |

    | ${parameter%%pattern} | Searches from back to front parameter until the last
    occurrence of pattern is found and deletes the result. |


    ### Modifying case

    | Usage | Description |

    | :--- | :--- |

    | ${parameter^} | Uppercase: Converts the first character to uppercase. |

    | ${parameter^^} | Uppercase: Converts all characters to uppercase. |

    | ${parameter,} | Lowercase: Converts the first character to lowercase. |

    | ${parameter,,} | Lowercase: Converts all characters to lowercase. |

    | ${parameter~} | Reversecase: Reverses the case of the first character. |

    | ${parameter~~} | Reversecase: Reverses all characters. |


    ### Assigning values

    | Usage | Description |

    | :--- | :--- |

    | ${parameter:=value} | Set default value: Set parameter to value if parameter
    is not set, then substitute parameter. |

    | ${parameter=value} | Use default value: Substitute value for parameter if not
    set, else substitute parameter. |

    | ${parameter:+value} | Use alternate value |

    | ${parameter:-value} | Substitute nothing for parameter if not set, else substitute
    value. |


    ### Search and replace

    | Usage | Description |

    | :--- | :--- |

    | ${parameter/pattern/value} | Searches from front to back of *parameter* and
    replaces the *first* occurrence of *pattern* with *value*. |

    | ${parameter//pattern/value} | Searches from front to back of *parameter* and
    replaces *all* occurrences of *pattern* with value. |

