    keyboard, they are redirected to standard input through use of a special character
    (|) or multiple less-than signs (<, <<, <<<).


    Stdout is the second stream and refers to “standout output.” By default it outputs
    to the terminal running Bash. The file descriptor for standard output is 1 (one).


