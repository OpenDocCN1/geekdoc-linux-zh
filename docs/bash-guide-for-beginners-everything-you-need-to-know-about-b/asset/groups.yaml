    \ over for whitespace, putting away the characters until the following whitespace\
    \ and bashing until the finish of the sentence where you show it onscreen.\n\n\
    In my solution, I read in a string passed to the script into an array (the -a\
    \ sentence_array part) as arguments separated by whitespace (i.e. a standard sentence).\
    \ Note that I don’t need to specify IFS='' since by default, IFS separates by\
    \ whitespace (spaces, tabs and newlines).\n\nUsing a for loop, I simply iterate\
    \ from the end to the beginning, one element at a time in the array. Since all\
    \ whitespace is used as delimitators, the array will be full (i.e. not sparse),\
    \ and display with only one space between the words when echoed back.\n\n```bash\n\
    #!/bin/bash\nread -r -a sentence_array << 'S1'\nfor i=${#sentence_array[@]}-1;\
    \ i>=0; i--\ndo\n  sentence_string=${sentence_array[i]}\n  echo $sentence_string\n\
    done\n'S1'\necho \"Reversed sentence is:$sentence_string\"\n```\n\n# Sample output:\n\
