- md: "\nuntil it encounters a whitespace, at which point it begins the second word,\
    \ and so on until the closing quotation mark. Note that quotation marks are one\
    \ of the many special characters in Bash, and have a nonliteral meaning.\n\nThis\
    \ means is that the onus is on you, the programmer, the scripter, the coder, to\
    \ ensure that whatever you type not only makes sense to you, but more importantly,\
    \ it makes sense to Bash’s rigid rules. If done incorrectly, the best result will\
    \ be that Bash throws an error and ceases to execute your code. At worst, the\
    \ syntax you entered will mean something completely different than what you intended\
    \ and you will find yourself in deep trouble.\n\n## IFS\n\nThis section utilizes\
    \ many concepts presented in later chapters of this guide. It is recommended you\
    \ skip it and return once you have completed the guide. For now, simply be aware\
    \ that IFS stands for Internal Field Separator. Its purpose is to figure out where\
    \ and how to perform word splitting based on a list of delimiters. The default\
    \ IFS value (delimiters) are space (' '), horizontal tab ('\\t'), and newline\
    \ ('\\n').\n\nThere are a couple ways to check the IFS settings. The first uses\
    \ printf, the second od, and the third, set.\n\n```\n$ printf %q 'IFS'\n$ '\\\
    t'\n$ echo -n 'IFS' | od -abc\n000000 50 ht 72\n      040 011 012\n        116\
    \ 04\n\n$ set | grep 'IFS'\nIFS=$' '\\t'\n```\n\nSetting the IFS value is a matter\
    \ of passing the special characters you want as delimiters to IFS. Here, the IFS\
    \ value is set to the null string.\n\nIFS= This is useful if you want to preserve\
    \ all whitespace while reading from a file (both loops and the read command are\
    \ covered in later chapters).\n\n```\nwhile IFS= read -r\n  line=$REPLY\n  echo\
    \ \"$REPLY\"\ndone < somefile\n```\n\nAnother example is to set IFS to a colon,\
    \ commonly used to delimit columns in spreadsheets. The triple less-than sign\
    \ is called a here string, and is covered near the end of the guide.\n\n```\n\
    IFS=: read -r column1 column2\n<<<'Budget:6000'; echo 'Column1 - Column2'\nBudget\
    \ - 6000\n```\n\nCommas are also common delimiters. Here, the IFS value is set\
    \ as such.\n\n```\nset | grep '^IFS='\nIFS=$' | grep IFS\nIFS=\ns set | grep IFS\n\
    ```\n\nNotice how the IFS value is permanently modified after you set it? This\
    \ is typically useful. In most cases, you want to change the IFS value for a single\
    \ command, such as reading input, but leave the value at its default for the remainder\
    \ of the script; else your script will behave strange, as word splitting is no\
    \ longer being performed the way you expect.\n\nOne option is to set a variable\
    \ with the current IFS value, and then return it later.\n\n```\n$ORIG_IFS=$IFS\n\
    $IFS=\n# perform your commands here\n$IFS=$ORIG_IFS\n```\n\nThe second is to temporarily\
    \ set a new IFS value by surrounding it with double quotation marks.\n\n```\n\
    $ set | grep ^IFS\nIFS=$'\\t'\n$IFS='' read r column1 column2\n<<<Budget,6000;\
    \ echo 'Column1 --- Column2'\nBudget -- 6000\n$ set | grep ^IFS\nIFS=$'\\t'\n\
    ```\n\nSee how the IFS value only changed for that single command? That’s exactly\
    \ what we wanted.\n\nNote that an IFS value corresponds to its value and exactly\
    \ its value. Thus, if two delimiters are encountered, it corresponds to an empty\
    \ field between the two.\n\n```\n$ IFS='-' read -r column1 column2 column3\n<<<\
    \ 'Budget --6000'; echo 'Col1:$column1 Col2:$column2 Col3:$column3'\nCol1:Budget\
    \ Col2:1013 Col3:6000\n```\n\nYou always can return IFS to its default value by\
    \ issuing:\n$ IFS=$IFS\n\n## Chapter 4: Terminology\n\n### Executables\n\nIf you\
    \ have spent any time on a Windows machine you are likely familiar with the term\
    \ executable. They are files that end with .exe. When double-clicked, a program\
    \ or application runs. Executables are the result of a programmer writing code\
    \ in a high level language such as C++, then compiling the code and turning it\
    \ into machine code instructions (typically assembly language) for a processor\
    \ to run. Once compiled, the program is no longer directly editable by a human.\n\
    \nRather, the original high level code must be edited and the executable recompiled.\n\
    \nOn a GNU/Linux based machine, an executable typically goes by the term, binary.\
    \ Other terms used are applications and external commands. As with all executables,\
    \ they are not directly editable. Inside a terminal running Bash, when a binary\
    \ is called by name or path, it runs. You can determine if something is a binary\
    \ through use of the command, file.\n\nFor this guide, the quintessential binary\
    \ is Bash itself.\n\n```\n$ file /bin/bash\n/bin/bash: ELF 64-bit LSB executable,\
    \ x86-64, version 1 (SYSV), dynamically linked\n(used shared libraries: 11), for\
    \ GNU/Linux 2.6.24)\nBuildID[sha1]=54987b22da027487f216e58a1ac7578ec\n```\n\n\
    ## Paths\n\nThe PATH variable is a list of directories that tells the shell where\
    \ to look for executable files. When you type a command without an absolute path,\
    \ the shell searches these directories in order until it finds a match.\n\nThe\
    \ directories in the PATH are separated by colons. You can see your current PATH\
    \ by typing:\n\n```\n$ echo $PATH\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\n\
    ```\n\nTo add a directory to your PATH, you can use the export command. For example,\
    \ to add `/home/user/bin` to your PATH:\n\n```bash\nexport PATH=$PATH:/home/user/bin\n\
    ```\n\nNote that this change only lasts for the current shell session. To make\
    \ it permanent, you should add the command to your configuration file, such as\
    \ .bashrc or .bash_profile.\n\n## Builtins\n\nNow that you know what binaries\
    \ are, a builtin is a piece of cake. As the name suggests, a builtin is quite\
    \ literally built-in in Bash. Because they do not require searching the PATH variable,\
    \ then forking off a separate process to run the binary, they are execute a bit\
    \ faster.\n\nExamples of shell builtins are:\n- alias\n- cd\n- echo\n- read\n\
    - type\n\n## Scripts\n\nScripts are the focus of this guide. All a script is a\
    \ series of commands stored in a file. Unlike a binary, this file written in a\
    \ high level language, is directly editable, and does not require compiling. You\
    \ can think of Bash as the liaison or interpreter between your high level script\
    \ and the low level code required by the system’s processor.\n\nScripts all begin\
    \ with the same line, called the shebang:\n\n```\n#!/bin/bash\n```\n\nWhen you\
    \ call your script, the Linux kernel reads the first line, finds the shebang,\
    \ and told that it should look for the liaison/interpreter at the location /bin/bash.\n\
    \nDespite the many similarities between shells such as dash, sh, and bash, and\
    \ zsh, ksh, and csh, there are differences. If you have written and tested your\
    \ script Bash, do not assume it will work in dash or sh (though many will).\n\n\
    Even though they are not binaries, scripts need to be given executable permissions\
    \ before they are run. That is unless you want to call it as an argument to bash\
    \ every time you run it.\n\n```\n$ /bin/bash your_script or,\nsince bash is in\
    \ your PATH,\n$ bash_script The\nway you give executable permission to a script\
    \ is through use of the binary, chmod.\n$ chmod +x your_script You\ncan now run\
    \ the script by name and residing\n```\n"
