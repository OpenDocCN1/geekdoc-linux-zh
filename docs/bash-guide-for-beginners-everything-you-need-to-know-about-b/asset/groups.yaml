    # Standard streams


    There are three standard streams, Each has a specific and distinct purpose. Stdin
    is the first, and stands for “standard input.” By default it refers to input from
    a keyboard. Inside a terminal running Bash, all typed commands are entered via
    the keyboard, and thus via standard input. The file descriptor (more on this topic
    will be covered later on) for standard input is 0 (zero).


