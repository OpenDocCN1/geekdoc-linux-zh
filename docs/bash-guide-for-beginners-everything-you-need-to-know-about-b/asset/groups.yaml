  mdcn: "\n\n## 第 15 章：陷阱\n\n### 信号 (Signals)\n\n在进入陷阱之前，应该先介绍信号。信号是某种“进程间的通信”。这意味着框架可以发送消息（即“信号”），从一个交互开始到下一个交互，其目的不是传递信息，而是为了让周期知道某些事件发生了。也许最为人知的信号是向控制台发送的另一种方式的\
    \ `[CTRL][C]`，你可能用过它来结束错误的代码、死循环等。下表列出了几个较常用的信号。其余的可以通过同时给出两个命令来记录：\n\n```bash\n\
    $ kill -1\n# trap -1\n```\n\n#### 信号表\n\n| 名称 | 键值 | 效果 | 快捷键 | 可捕获？ |\n| :---\
    \ | :--- | :--- | :--- | :--- |\n| EXIT | 0 | 退出 (Exit) | | 否 |\n| SIGHUP | 1\
    \ | 挂断 (Hangup) | | 是 |\n| SIGINT | 2 | 中断 (Interrupt) | [CTRL][C] | 是 |\n| SIGQUIT\
    \ | 3 | 退出 (Quit) | [CTRL][\\] | 是 |\n| SIGKILL | 9 | 杀死 (Kill) | | 否 |\n| SIGTERM\
    \ | 15 | 终止 (Terminate) | | 是 |\n| SIGCONT | 18 | 继续 (Continue) | | 是 |\n| SIGSTOP\
    \ | 19 | 停止 (Stop) | | 否 |\n| SIGTSTP | 20 | 终端 (Terminal) | [CTRL][Z] | 是 |\n\
    \n- 不可捕获的信号无法被获取、阻塞或忽略。换句话说，该位杀死了交互，而不允许周期有机会优雅地结束。\n- “EXIT”实际上并不是一个信号。相反，在内容由于任何原因退出时（无论是否被标记），都会运行\
    \ EXIT 陷阱。\n\n可以通过按下控制台绑定的快捷路径或使用 `kill` 命令向交互发送信号。\n\n```bash\n$ kill -SIGKILL\
    \ PID\n```\n\n要杀死一个周期，你应该从“危险性”最小的信号开始。也就是说，你应该从该信号开始，该信号只要被维持，允许周期敏捷地结束并清理它打开的任何临时文件、交互或流。\n\
    \n```bash\n$ kill -2 PID\n```\n\n如果那不起作用，尝试一个更基础的信号，例如请求程序自杀的信号。\n\n```bash\n\
    $ kill -15 PID\n```\n\n如果这实际上没有影响，继续到那个通过并彻底杀死交互的信号：\n\n```bash\nsleep 1000 &\n\
    [1] 1933\n```\n\n接下来，我们通过各种不同的独特方法来观察它。\n\n```bash\n$ 1000 &\n[1]+ Running   \
    \   sleep 1000 &\n$ pgrep sleep\n1938\n$ pgrep sleep\n1933\n$ pgrep -u salene\
    \ | grep sleep\n19330 sleep\n$ ps 22 sleep       TIME CMD\nPID TTY\n19338 pts/2\
    \    00:00:00 sleep\n```\n\n一个智能的选项是 `top` 以及它的完美搭档 `htop`。然后，我们杀死剩下的进程。\n\n```bash\n\
    $ kill -2 19038\n$ pgrep sleep             sleep 1000\n[1]+ Interrupt\n$ kill\
    \ -9 19338\n$ pgrep sleep\n[1]+ Killed              sleep 1000\n$ kill -15 19435\n\
    $ pgrep sleep\n[1]+ Terminated          sleep 1000\n$ kill sleep\n[1]+ Terminated\
    \          sleep 1000\n$ kill -HUP sleep         sleep 1000\n[1]+ Hangup\n$ killall\
    \ sleep           sleep 1000\n[1]+ Terminated          sleep 1000\n```\n\n###\
    \ 陷阱 (Traps)\n\n现在你已经知道什么是信号以及如何监控进程，我们应该继续学习信号控制器，或者说陷阱。陷阱提供了一种“获取”信号的方法。你在获取信号后所做的事情取决于你。你可以忽略该信号（这通常是一个非常糟糕的主意，可能会导致\
    \ CPU 占用过高、磁盘写满、进程表溢出，而这只是开始）。另一方面，你可以（并且应该）清理你的内容正在忙的任何内容（写入记录、关闭打开的文件、杀死子进程、删除异常和临时文件、FIFOs、运行列表等）并允许它被杀死。\n\
    \n就像现实生活中一样，陷阱必须在设置后才能生效。这是通过提供 Bash 内置的 `trap` 命令，后面跟着你想要捕获的信号名称来实现的。除非指定不这样做，否则周期将具有其默认活动。基于此，一个未被捕获的\
    \ `SIGINT` 会杀死一个周期。\n\n```bash\ntrap SIGNAL\n```\n\n让我们从一个简单的模型开始。在这里我们创建一个每秒产生一个周期的死循环。在启动之前打开第二个终端，并尝试使用你过去学习的不同技术来杀死它。\n\
    \n```bash\n#!/bin/bash\ntrap HUP INT QUIT TERM\necho 'My PID is $$'\nwhile true;\
    \ do\n  echo -n '.'\n  sleep 1\ndone\n```\n\n在上面的模型中有许多值得观察的地方。第一个是如果你预期通过执行 `$\
    \ kill -9 SCRIPT_PID` 来杀死它，是因为这一行 `trap HUP INT QUIT TERM` 决定了内容要捕获 HUP、INT、QUIT\
    \ 和 TERM 信号，同时执行下方的代码并忽略它们（单引号内的，即运行命令）。这一行也可以写成：\n\n```bash\ntrap 2 3 9 15\n\
    ```\n\n注意，尝试捕获并忽略信号 9 (`SIGKILL`) 没有效果。这是因为该信号是不可捕获的。\n\n最后，脚本中的最后一行 `trap INT\
    \ QUIT TERM` 建议内容返回其对信号的默认处理。记住返回信号的默认处理至关重要！假设排除了这一点，在确定捕获信号的命令之下的所有代码，无论你是否需要它们，都会做出类似的反应。\n\
    \n与其忽略信号，认为捕获它们如何？在这种情况下，我们将创建一个临时文件，向其填充一些数据，然后发布命令从用户读取输入。在实际设置中，`read` 将表现为一个在后台处理信息的命令或系列命令（由于这是一个学习脚本，而不是创建一个逃逸的交互或会阻碍你至少一个框架资源的死循环，这里使用\
    \ `read` 代替）。\n\n```bash\n#!/bin/bash\necho \"PID is: $$\ntrap 'rm -f $fname;\
    \ exit 1' INT TERM\nfname=my_file\ntouch '$fname'\nread -p 'Anything to add? '\n\
    echo '这里是数据'\ntrap TERM\n```\n\n![](https://raw.githubusercontent.com/example/example/main/img/4fc3d09982bdd6cfab7b58ee2.png)\
    \ 结果看起来像这样：\n\n```\n./process\nPID is: 2608\nAnything to add? ^C\n```\n\n理解为什么我们在\
    \ `read` 之前没有让内容休眠至关重要。这是因为信号只在当前交互结束后被处理。这是一个基础概念！一个模型应该使其更清晰。尝试使用 `kill -2`\
    \ 命令杀死内容。\n\n```bash\n#!/bin/bash\necho \"PID is: $$\ntrap 'echo \"Cleaning...\"\
    ; exit 1' INT\nfname=temporary_file\ntouch '$fname'\nsleep 60\n```\n\n你注意到 `sleep\
    \ 60` 命令需要完成后陷阱才会执行了吗？这里有三个重要的点说明：\n\n- 第一，前一个模型之所以没有出现这个问题，尽管有 `sleep` 命令，是因为你的\
    \ `kill` 命令和陷阱执行之间只有微小的延迟。\n- 第二，在脚本底部没有包含 `trap INT` 是因为没有合理的理由将 `SIGINT` 陷阱的内容恢复正常。陷阱控制器对于内容是局部的；它们不是系统范围的。\n\
    - 第三，`[CTRL][C]` 和 `kill`、`pkill`、`killall` 等。虽然命令行行将预定义消息传递给 PID，控制台 SIGINT 将其发送给周期\
    \ ID，而后者包含了 sleep 命令。\n\n如果你希望内容不需要等待前景交互结束就能处理陷阱，应该将交互放在后台。寻找后台发送最新周期的命令是实现此点的机制（`wait`\
    \ 会等待交互状态的变化，如接近的信号）。这样陷阱就可以在离开之前清理这个后台任务——这正是陷阱的设计意图！\n\n```bash\n#!/bin/bash\n\
    echo \"PID is: $$\nbgpid=\ncleanup() {\n  if [[ -n $bgpid ]];\n  then\n    echo\
    \ \"Killing $bgpid\"\n    kill \"$bgpid\"\n    exit 1\n  fi\n}\ntrap cleanup INT\n\
    echo \"Sleeping for an hour:..\"\nsleep 3000\nbgpid=\"$1\"\necho \"Sleep PID is:\
    \ $bgpid\"\nwait\n```\n\n看，现在当你执行命令时，\n$ kill -2 SCRIPT_PID\n\n内容获取了信号，执行陷阱工作（回顾能力调用是命令，并且\n\
    \n"
