    ## 参数


    参数是指命令后面的单词（以及任何内容）。参数通过空白字符（空格、制表符和换行符）进行分隔。为了巩固这个概念，提供了三个命令：`mkdir`、`cd` 和 `touch`。


    `mkdir` 是“创建目录”的另一种方式，它至少接受一个参数。每个由空格分隔的内容会被命令解析为另一个要创建的目录名称。这种划分被称为“单词分割”（word
    splitting）。


    ```bash

    $ mkdir test new_dir

    $ ls

    new_dir  test

    ```


    单词分割对 Bash 来说是一个非常重要的概念。为了对包含空格的内容执行任何操作，你应该考虑单词分割，并对其使用引号或使用反斜杠转义字符，如后文章节所示。


    为了进入我们刚才创建的 `test` 目录，使用了 `cd` 命令，它是“切换目录”的另一种方式。它恰好接受一个参数——你想要进入的目录名称。


    ```bash

    $ cd test

    ls

    ```


    我们的 `ls` 命令没有返回任何内容是因为该目录下没有文件或目录！对于熟悉 GNU/Linux 环境的人来说，你可能会说：“这里这里有两个东西！”你是正确的。你可以通过向
    `ls` 传递一个参数（称为标志，flag）来确认。该标志是 `-a`（连字符加小写 a）。它告诉 `ls` 命令忽略以点开头的路径（默认是隐藏的）。


    ```bash

    $ ls -a

    ```


    这些“隐藏目录”的特殊之处在于它们指的是目录本身（单个点 `.`）以及父目录（双点 `..`）。文件也可以被“隐藏”。


    例如，你可以从当前目录移动到它的父目录：

    `home/mars-laptop/test && cd .. /home/mars-laptop$`


    为了创建一个（或三个）文件，你将它们传递给——你懂！——第三个命令 `touch`，它的作用是更改文件的最后修改时间。然而，由于文件还不存在，`touch`
    会为每个参数创建一个文件。


    ```bash

    $ touch one two fish red blue fish

    blue

    blue one red test

