    # 初学者 BASH 指南


    关于 Bash 脚本你需要知道的一切


    ![](img/4fc3d04982bdd6cfab7b581df97f89ee_0_1.png)


    # 编写动机


    为什么在现在有各种编程资源的情况下，我还要编写这份指南呢？答案很直接：模型。我一贯认为通过专注于模型来学习效果最好。这份指南是为像我一样的人准备的——他们需要先看到任务是如何执行的，才能相应地模仿。


    其他指南采用不同的策略。最好的情况下，那些像教科书一样的资源所使用的通用语言和极其广泛的案例枯燥得令人发指。甚至从悲观的角度来看，还会阻碍学习。另一方面，某些导师试图为新手提供一个友好的材料介绍，他们往往会过度沉溺于流程图和对“为什么”的详尽解释，导致视角过高。


    本指南试图克服这两者之间的任何障碍；提供足够的“是什么”和“为什么”，以便展示现状是如何设置的。因此，解释通常很短，并紧接着是各种示例。


    不要试图记住关于 Bash 的一切——细微的细节很容易被忽视并直接跳过。相反，请尝试观察每一个模型是如何运作的。所有的语言结构表格和总结案例都复制到了末尾，形成了一份“快速参考”，在细节确实遗漏时可以查阅。


    # 读者背景


    阅读或理解本指南不需要任何编程、编码或信息组织知识。实际上，不需要任何关于 Linux 运行框架或终端本身的信息。总而言之，显然，任何先前的语言、经验或专业知识都会加快获取介绍信息的速度。


    # 格式


    整个指南使用的设计已经经过了标准化。重要概念主要使用**粗体**表示。命令、参数、变量、文件名、路径以及类似的术语使用*斜体*表示。


    代码、脚本、命令行输入以及每一个的结果都包含在代码块中。通常情况下，代码可以原封不动地复制到你自己的终端中。例外是如 `yourfile`、`my_domain`
    等项目，它们应该替换为与你的系统、工作目录、输入或数据文件相关的条目。


    任何被井号 `#` 标记的内容都是注释，不应该输入（尽管你可能决定输入；它也不会产生任何影响）。斜杠符号行 `\` 允许代码在下一行之前继续编写，而不会被换行符截断。


    超过几行的输出通常会用省略号 (`...`) 缩短。


    ```bash

    $ ls mydirectory      # 这列出了文件

    你当前目录的内容

    file1

    file2

    ```


    # 第1 章：历史


    早期与 PC 的交互——在拨号连接和打孔卡时代——是通过向命令行解释器输入文本命令来实现的。这个命令行解释器（或称为 **shell**）的功能是与底层操作系统通信。shell
    的核心是内核，它通过其不同的驱动程序与打印机、控制台、鼠标和屏幕等实际设备进行通信。通过这一点，使用 shell 的客户端可以处理、执行和自动化几乎任何高级电脑胜任的任务。


    # Shell（外壳）


    主要的 shell 是 Ken Thompson 编写的 Thompson shell。由于当时框架的限制，它基本上被称为 `sh`。在在使用一段时间后，它被
    Stephen Bourne 编写的组件更丰富的 Bourne shell 取代。为了让那个时代的极客们不至于出错，他保留了相似的名字 `sh`。又过了十多年后，Bourne
    shell 才被——等一下——Bourne-again shell，或者说 Bash 取代。


    # Bash


    尽管最初发布于 1989 年，但 Bash 经历了一长系列更新、重新设计和修正，每一次更新都使其获得了长久价值且强大的功能。此外，随着处理特定任务的工具被创建，或其他竞争
    shell 发布了新功能，Bash 将其中许多功能整合到了自身。截至本文发布，Bash 版本为 4.3。


    ![](img/4fc3d04982bdd6cfab7b581df97f89ee_6_0.png)


    # 其他 shell


    尽管存在许多其他 shell（如 csh、ksh 和 zsh），你可以通过以下命令检查正在使用哪种 shell：


    ```bash

    $ echo $SHELL

    /bin/bash

    ```


    如果你想更改特定用户的默认 shell，使用以下命令：


    ```bash

    $ usermod -s /bin/bash username

    ```


    如果你想在登录时更改当前登录用户的 shell，使用以下命令：


    ```bash

    $ echo "SHELL=/bin/bash" >> ~/.profile

    ```


    # 什么是 shell（以及不是什么）


    从根本上说，尽管经过了四十年的发展，shell 仅仅是一个命令行解释器。shell 不是你的 PC、操作系统或显示器。它不是你的语法检查器、终端、鼠标或内核。当你启动
    Bash 时，你实际上是在启动一个运行着 Bash 的终端模拟器窗口。就像不同的项目一样，你可以与系统交互，无论是配置文件、窗口管理器，还是内核本身，以便启动、停止或重启一个进程。


    # 使用 Bash


    如上所述，Bash 允许你以交互式或非交互式提供命令。Bash 的直观模式应该是是你最熟悉的模式。它包含一个运行着 Bash 的终端模拟器窗口。当你输入命令时，它会逐字地（或接近地）写入你的终端并显示在显示器上。非直观模式只是
    Bash 在后台运行。这并不意味着它不能（或不会）向屏幕输出任何内容，不能写入或读取文档，或进行任何类似操作——只要你告诉它它就可以！非直观模式基本上简化为命令的连续发布。


    # 提示符


    有三种主要的提示符。每种都以一个不同的符号开头。与符号符号 `&` 显示你正在运行 Bourne、POSIX 或 Korn shell。百分号 `%` 意味着你正在运行
    csh 或 zsh shell。更重要的是，井号 `#` 告诉过你正在以 root 身份执行命令——要格外小心！


    ```bash

    $ #

    ```


    毫无疑问，你的简报比单张图片长得多。许多著名的 GNU/Linux 默认


    '
