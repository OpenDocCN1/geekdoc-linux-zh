    /usr/bin/bc /usr/bin/dh /usr/bin/id

    /usr/bin/nl /usr/bin/sg /usr/bin/wc

    /usr/bin/cs /usr/bin/du /usr/bin/ld

    /usr/bin/nm /usr/bin/tr /usr/bin/xz

    ```


    多个方括号支持是允许的。这个命令记录了 /usr/bin 中所有以 a 到 m 开头并以 m 到 z 结尾的双字母项。


    ```

