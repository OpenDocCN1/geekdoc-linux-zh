    - Shell 内置命令用法错误 - 无法执行的命令（通常是拼写错误）\n- 错误的退出码参数\n- 128+num 致命错误信号“num”\n\n示例：\n\
    true\nfalse\nls —option /dev/null\n\ntouchj\n\nexit 2.718 kill -9 pid # num =\
    \ 137\nkill -15 pid # num = 143\n130\n255*\n\n# 如果\n\n脚本被 Control-C 杀死 退出码超出范围\
    \ [CTRL]-[c] exit 666\n\n```bash\nif expression then\n    statement_1\n    statement_2\n\
    \    -\n    statement_n\nelse\n```\n\n```bash\nif expression\nthen\n    statements\n\
    else\n    other_statements\n```\n\n## elif-else\n\n```bash\nif expression_1\n\
    then\n    statements_1\nelif expression_2\nthen\n    statements_2\nelif expression_3\n\
    then\n    statements_3\nelse\n    statements_4\n```\n\n## else_nesting\n\n```bash\n\
    if expression\nthen\n    statements_0\n    if expression_0\n        then\n   \
    \         statements_0-0\n        else\n            statements_0-1\nelse\n   \
    \ statements_1\n    if expression_1\n        then\n            statements_1-0\n\
    \        else\n            statements_1-1\n```\n\n## Case\n\n```bash\ncase variable\
    \ in\npattern1)\n  statements1\n  ;\npattern2)\n  statements2\n  ;\npattern3)\n\
    \  statements3\n  ;\n*)\n  statements*\n  ;\nesac\n```\n\n## Select\n\n## 测试\n\
    \n类型： \n条件\n!\n[]\n[[ ]]\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| ! | 取反：取反测试结果或退出状态。如果从命令行执行，则会调用\
    \ Bash 的历史机制。 |\n\n## 测试\n\n括号之间的表达式将进行测试，并产生真/假输出。这是一个 Shell 内置命令。如果不考虑与 sh shell\
    \ 的兼容性，双中括号测试要灵活得多。\n\n## 测试\n\n括号之间的表达式进行测试比单中括号提供了更多的选项、功能和灵活性。它是一个 Shell 关键字。测试将在稍后介绍。\n\
    \n## 算术运算符 X -eq Y\n\n- X -ne Y\n- X -gt Y\n- X -lt Y\n- X -le Y\n- X -ge Y\n\n\
    **描述**\n- 如果 X 等于 Y，则为真\n- 如果 X 不等于 Y，则为真\n- 如果 X 大于 Y，则为真\n- 如果 X 小于 Y，则为真\n\
    - 如果 X 小于等于 Y，则为真\n- 如果 X 大于等于 Y，则为真 bc:\n\n| 运算符 | bc 等效 |\n| :--- | :--- |\n\
    | -eq | == |\n| -ne | != |\n| -gt | > |\n| -lt | < |\n| -le | <= |\n| -ge | >=\
    \ |\n\n## 字符串\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| -z STRING | 如果 STRING 为空，则为真\
    \ |\n| -n STRING | 如果 STRING 不为空，则为真 |\n| STRING1 = STRING2 | 如果 STRING1 等于 STRING2，则为真\
    \ |\n| STRING1 == STRING2 | 如果 STRING1 等于 STRING2，则为真 |\n| STRING1 != STRING2\
    \ | 如果 STRING1 不等于 STRING2，则为真 |\n| STRING1 < STRING2 | 如果 STRING1 的字典排序在 STRING2\
    \ 之前（如果使用 \\ 则必须转义） |\n| STRING1 > STRING2 | 如果 STRING1 的字典排序在 STRING2 之后（如果使用\
    \ \\ 则必须转义） |\n\n## 文件\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| -e FILE | 如果 FILE 存在，则为真\
    \ |\n| -f FILE | 如果 FILE 存在且是普通文件，则为真 |\n| -d FILE | 如果 FILE 存在且是目录，则为真 |\n| -c\
    \ FILE | 如果 FILE 存在且是特殊字符文件，则为真 |\n| -b FILE | 如果 FILE 存在且是特殊块文件，则为真 |\n| -p FILE\
    \ | 如果 FILE 存在且是命名管道 (FIFO)——“先进先出”，则为真 |\n| -S FILE | 如果 FILE 存在且是套接文件，则为真 |\n\
    | -h FILE | 如果 FILE 存在是符号链接，则为真 |\n| -O FILE | 如果 FILE 存在且有效归你所有，则为真 |\n| -g FILE\
    \ | 如果 FILE 存在且有效归你的组所有，则为真 |\n| -u FILE | 如果 FILE 存在且设置了 SGID，则为真 |\n| -r FILE\
    \ | 如果 FILE 存在且设置了 SUID，则为真 |\n| -w FILE | 如果 FILE 存在且你可以读取，则为真 |\n| -x FILE |\
    \ 如果 FILE 存在且你可以写出，则为真 |\n| -s FILE | 如果 FILE 存在且你可以执行，则为真 |\n| | 如果 FILE 存在且非空（大小\
    \ > 0），则为真 |\n| -t FD | 如果 FD（文件描述符）在终端上打开，则为真 |\n| FILE1 -nt FILE2 | 如果 FILE1\
    \ 比 FILE2 新，则为真 |\n| FILE1 -ot FILE2 | 如果 FILE1 比 FILE2 旧，则为真 |\n| FILE1 -ef FILE2\
    \ | 如果 FILE1 和 FILE2 指向同一个设备，则为真 |\n\n## 逻辑运算符\n\n- EXP1 && EXP2\n- EXP1 || EXP2\n\
    \n| 模式 | 描述 |\n| :--- | :--- |\n| STRING = PATTERN | 如果 STRING 匹配 PATTERN，则为真\
    \ |\n| STRING == PATTERN | 如果 STRING 匹配 PATTERN，则为真 |\n| STRING ~ PATTERN | 如果\
    \ STRING 匹配 PATTERN，则为真 |\n\n\n"
