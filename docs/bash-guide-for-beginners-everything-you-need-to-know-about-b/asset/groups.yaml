    ## Integers


    Integer variables are one of the few times you will encounter something other
    than a string in Bash. On the flip side, they are virtually never used, because
    arithmetic expansion (more on this later) is much easier to use and read.


    To set an integer variable, you must explicitly set it as such with `declare -i`.


    ```bash

    $ declare -i varname

    ```


    To erase an integer variable, you do so with `unset`.


    ```bash

    $ unset varname

    ```


    A single line example of declaring and setting an integer variable, echoing back
    the variable, and erasing it afterword looks like this:


    ```bash

    $ declare -i x=10; echo "$x"; unset x

    10

    ```


    Remember that you must explicitly declare an integer variable. If you do not,
    you will get a string!


    ```bash

    $ x=10; $x=5; echo "$x"; unset $x

    105

    ```


    Let’s try that again, this time properly declaring it and then adding five to
    the integer ("+=5" part).


    ```bash

    $ declare -i x=10; $x=5; echo "$x"; unset $x

    15

    ```


    Much better! Let let also works.


    ```bash

    $ x=10; let $x+=5; echo "$x"; unset $x

    15

    ```


    It does not work the other way around, however.


    ```bash

    $ let x=10; $x+=5; echo "$x"; unset $x

    105

    ```


    Unless of course you perform the addition inside the let statement.


    ```bash

    $ declare -i x=10+5; echo "$x"; unset $x

    15

    $ let $x=10+5; echo "$x"; unset $x

    15

    ```


    Once you get into multiple integer variables, things get even more cumbersome.


    ```bash

    $ declare -i x=10; declare -i y=5; \

    z="$x+$y"; echo "$z"; unset $x; unset $y; \

    10+5

    $ declare -i x=10; declare -i y=5; \

    declare -i z="$x+$y"; echo "$z"; \

    unset $x; unset $y; unset $z

    15

    ```


    Are you thoroughly confused yet? I know I am. Do not worry too much about it;
    this is why integer variables are rarely used in Bash. We’ll cover arithmetic
    expansion in a bit, which is vastly easier to write, read, and use.


    ## Read only


    Read only variables are exactly the same as normal variables except, as the name
    implies, they are read only. You set a read only variable by passing the -r flag
    to declare.


    ```bash

    $ declare -r varname

    ```


    Here we set our ideal weather conditions:

    ```bash

    $ declare -r weather=''sunny''; echo $weather

    sunny

    ```


    Once set, read only variables are permanent. That is, unset has no effect. Read
    only variables stick around until the shell process exits or is killed.


    ```bash

    $ unset weather

    bash: unset: weather: cannot unset: readonly variable

    $ echo "$weather"

    sunny

    ```


    To replace your current instance of Bash with a new one and get rid of read only
    variables, you can issue the following:


    ```bash

    $ exec bash

    ```


    ## Shell variables


    In addition to setting “normal” variables, Bash provides a few special variables
    for your convenience. Not all the shell variables are listed here, but the most
    commonly used are.


    | Common shell variables | Description |

    | :--- | :--- |

    | $BASH | The path to Bash’s binary. |

    | $BASH_VERSION | Bash’s version. |

    | $BASH_VERSINFO | Bash’s major version. |

    | $EDITOR | The environment’s default editor. |

    | $UID | The current user’s effective user ID. |

    | $HOME | The current user’s home directory path. |

    | $HOSTNAME | The machine’s hostname. |

    | $HOSTTYPE | The machine’s hosttype. |

    | $IFS | The IFS setting. Blank if set as default. |

    | $MACHCTYPE | The machine type. |

    | $OLDPWD | The previous directory you were in. |

    | $OSTYPE | The operating system type. |

    | $PATH | The command search path. |

    | $PIPESTATUS | The exit status of the last completed pipe. |

    | $PPID | The process ID of the current shell’s parent process. |

    | $PS1, ..., $PS4 | The shell’s (prompts 1 through 4) format. |

    | $PWD | The current working directory. |

    | $RANDOM | A pseudo random integer between 0 and 2^15. |

    | $SECONDS | How many seconds the script has been executing. |

    | $UID | The current user’s ID. |


    There are a couple important things to notice about shell variables. First, you
    do not have to manually set, declare, unset, or modify them yourself. They exist
    whether you decide to use them or not. Second, shell variables are always fully
    uppercase. This helps you avoid clobbering one of them with one of your own.


    A good rule of thumb is to always name your variables in lowercase. That way,
    whenever you see one in uppercase, you know it is special. Finally, shell variables
    and environment variables are not the same.


    Environment variables are covered in chapter 13.


    For now, the most in-depth example involving shell variables will be a simple
    listing of them and their stored values. Once you get into arrays, they will be
    incredibly useful.


    ## Chapter 6: Arrays


    Arrays are used more often than integer variables, but they require accounting
    for setting, reading, and recalling.


    ### Indexed arrays


    In this type of array (far the most common), each value is mapped to a key starting
    from zero (0). Graphically, it looks like this:


    + animals

    0 Dog

    1 Bear

    2 Llama

    3 Parrot

    4 Otter


    Array creation is similar to variable creation. Like everything in Bash, there
    are usually multiple ways of performing the same task. Arrays are no exception.


    ### Declaration


    ```bash

    array=()

    declare -a array

    ```


    - `declare -a array` declares an empty array and sets its first value (index 0)
    to value.


    Once the array has been created, without values, it can be modified using the
    following syntax.


    ### Storing values


    ```bash

    array[i]=value

    array=(value1, value2, ..., valueN)

    array+=(value1, value2, ..., valueN)

    ```


    # Set array value

    Sets the ith key of array to value.


    # Set entire array

    Sets the entire array, array, to any number of values, value1, value2, ..., valueN,
    which are indexed in order, from zero. Any previously set array values are lost
    unless the array is appended with =


    # Append array

    Appends the existing array, array, with the values, value1, value2, ..., valueN.


    # Compound set array values

    Sets the indexed keys, i, j, and k, to value1, value2, ..., valueN Any previously
    set array values are lost. Here we create a simple indexed array.


    ```bash

    animals[0]=Cat

    ```


