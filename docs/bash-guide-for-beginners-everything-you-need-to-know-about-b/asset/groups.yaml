    # # Chapter 4:

    Terminology

    Executables


    If you have spent any time on a Windows machine you are likely familiar with the
    term executable. They are files that end with .exe. When double clicked, a program
    or application runs. Executables are the result of a programmer writing code in
    a high level language such as C++, then compiling the code and turning it into
    machine code instructions (typically assembly language) for a processor to run.
    Once compiled, the program is no longer directly editable by a human.'
  - '[PAGE 37]


    Rather, the original high level code must be edited and the executable recompiled.


    On a GNU/Linux based machine, an executable typically goes by the term, binary.
    Other terms used are applications and external commands. As with all executables,
    they are not directly editable. Inside a terminal running Bash, when a binary
    is called by name or path, it runs. You can determine if a something is a binary
    through use of the command, file.


    For this guide, the quintessential binary is Bash itself.


    ```

    $ file /bin/bash

    /bin/bash: ELF 64-bit LSB executable, x86-64, version 1 (SYSV), dynamically linked

    (used shared libraries: 11), for GNU/Linux 2.6.24)

    BuildID[sha1]=54987b22da027487f216e58a1ac7578ec7dd0821, stripped

    ```


    Other binaries include touch, ls, mkdir, emacs, and vim.


    # Paths


    The way Bash knows where to find binaries'
  - '[PAGE 38]


    and other items refers to by name is through paths.\Paths store a series of, well,
    paths. These paths lead to places where binaries are commonly stored. $PATH is
    an environment variable (as evident by the dollar sign preceding a series of all
    capital characters; much more on this later). In Linux, all Bash has to do when
    you call, for example, ls, is look in a few pre- defined directories. You can
    see your full $PATH variable by issuing:


    ```

    $ echo $PATH

    usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:sbin:/bin:

    ```


    If not for $PATH, every time you wanted to call ls, you would need to specify
    exactly where it was stored:


    ```

    $ /bin/ls

    ```


    This is important to understand because when you start writing scripts, you will
    not be able to call your script by name like you call ls. The reason is because
    it will not be stored in one of the places named in your path!


    Well, it should not be at any rate. Adding a'
  - '[PAGE 39]


    random folder to your $PATH makes your system dramatically less secure. It introduces
    the ability for a malicious user (or a careless mistake) to wreck your system.
    Imagine if you added your script storage folder to the front end of $PATH, then
    accidentally called a bulk, non-interactive script you named rm (thus clobbering,
    or colliding with the existing binary, rm). Bash would search for the name you
    gave it (rm), find your script first (instead of the system binary, rm), then
    run it without a care for what it deleted. You can see the chance for misuse and
    abuse!


    If, after all that, you are still bound and determined to add a directory to your
    path variable, at least use something consistent like /opt/bin or /home/username/bin
    and always place the new path at the end of the current path (because the PATH
    environment variable is searched in order, from left to right).


