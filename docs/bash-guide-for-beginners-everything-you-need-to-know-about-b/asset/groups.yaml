    \ values in the array. If double quoted, it expands to all values in the array\
    \ quoted as a whole.\n\n### Subarray expansion\n\nExpands to *num* of array values,\
    \ beginning at *offset*. The same quoting rules as above apply.\n\n### Subarray\
    \ expansion\n\nExpands to *num* of array values, beginning at *offset*. The same\
    \ quoting rules as above apply.\n\n# Metadata\n\n# Usage Description\n\n${array[i]}\n\
    \n# **Value string length**\nExpands to the string length of the *ith* array value\n\
