  md: '# 452 Chapter 15 • Using SQL*Loader to Load Data


    statements performed in SQL*Plus. The direct-path load is designed to improve
    the performance of the conventional load by providing similar functionality. Lastly,
    the external-path load is a specialized load designed so SQL*Loader will work
    with external tables.


    # Conventional Load


    Conventional load is the first of three methods you can use to load data with
    SQL*Loader. A conventional load is much slower than a direct-path load. The conventional
    load builds a bind array, and when this array is full, a SQL insert statement
    is executed. This method is comparable to the one that Oracle uses to process
    normal DML statements such as inserts. Conventional load is the default method
    for SQL*Loader users.


    # Direct-Path Load


    The direct-path load is initiated by using the DIRECT=TRUE keyword on the command
    line. This method is much faster than conventional load. The direct-path load
    does not use a bind array; instead it uses the direct-path API to load data more
    directly into the database without the overhead of SQL command processing. Because
    the data actually bypasses the normal SQL processing layers, Oracle must load
    this data into blocks that are unused or above the high-water mark of the table.
    The high-water mark is last used in the table whether there is data in the block
    or not. Table 15.1 compares conventional loads and direct-path loads, and Figure
    15.2 displays the functional differences between these two methods.


    # TABLE 15.1 Conventional Load versus Direct-Path Load


    | Conventional Load | Direct-Path Load |

    |---|---|

    | Uses standard commits to save data | Uses data saves |

    | Always generates redo information | Generates redo information when certain
    conditions are met |

    | Fires insert triggers | Does not fire insert triggers |

    | Can load into clustered tables | Cannot load into a clustered table |

    | Enforces constraints | Does not enforce constraints |


    Copyright ©2002 SYBEX, Inc., Alameda, CA www.syex.com'
