    # Summary


    There are several key components that are necessary to understand to succeed when
    you are networking in an Oracle environment. The main responsibilities of the
    network administrator include determining the applications and type of connections
    that will be supported, the number of users and the locations from which they
    will be accessing the network, and the security issues involved in protecting
    sensitive information, such as single sign-on and data encryption.


    In addition to being aware of their own responsibilities, the DBA needs to choose
    from the three basic types of network configurations when setting up their Oracle
    network: single-tier architecture, two-tier architecture, and n-tier architecture.
    Because systems have evolved from the simpler single-tier to the more complex
    n-tier architecture, which can include connections through middle-tier servers
    and the Internet, administrators will most likely find themselves choosing between
    the two architectures that Oracle Net is an integral part of: two-tier or n-tier
    architectures.


    Oracle Net manages the flow of information from client computers to Oracle servers
    and forms the foundation of all networked computing in the Oracle environment.
    Oracle Net is comprised of a series of layers that make up the Oracle Net stack
    architecture. This architecture is based on the OSI model of networking interaction.
    Each layer in the Oracle Net stack is responsible for one or more networking tasks.
    Requests and responses are sent up and down the stack, which exists on both the
    client and the server.


    In addition to the main network architecture that supports connections to an Oracle
    server, Oracle Net provides services that can be divided into five main categories:
    Connectivity, Directory Services, Scalability, Security, and Accessibility. Connectivity
    solutions include support for multiple protocols, multiple operating systems,
    and Java and Internet. Directory Services provide an interface to resolve Oracle
    names through a centralized naming repository. Scalability solutions include Connection
    Manager and Oracle Shared Server. Security options include Oracle Advanced Security,
    which provides an additional layer of security options and robust support'
  merge: -1
  img_proc: true
