  md: '# Connection Process when Using Hostnaming


    When hostnaming is used, the client must supply a user ID and password along with
    the name of the machine they want to connect to. For example, if the user Matt
    with password of casey wants to connect to a database residing on machine GR99c073,
    he would enter Sqlplus matt/casey@gr99c073. The hostname would be resolved by
    either a HOSTS file or by an external naming environment, such as DNS. External
    naming, such as DNS, are preferred over a HOSTS file because they facilitate centralized
    management of hostnames. The following code contains an example of a HOSTS file
    from a Windows NT/2000 environment. The default location for the HOSTS file on
    a Unix system is in the /etc directory. On Windows NT 2000, the default location
    is c:\winnt\system32\drivers\etc. Once the hostname is resolved, the connection
    is made to the machine.


