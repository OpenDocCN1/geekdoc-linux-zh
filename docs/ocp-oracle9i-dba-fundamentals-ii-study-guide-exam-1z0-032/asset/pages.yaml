    # Summary


    In this chapter, we emphasized media recoveries. We described the two methods
    of performing Oracle database recovery for media failures (user-managed and RMAN-based
    recoveries) and we performed specific examples of each.


    In addition, we identified the differences between ARCHIVELOG mode and NOARCHIVE
    mode and we described the significant implications that each mode has on the backup
    and recovery process. We also showed examples of both ARCHIVELOG mode and NOARCHIVELOG
    mode recoveries using both user-managed and RMAN methods of recovery.


    We discussed read-only tablespace recovery and the three recovery scenarios associated
    with it. Each of these scenarios requires different recovery actions. We also
    performed user-managed and RMAN-based recovery situations in which file relocation
    was required.


    Media recoveries are an important topic in testing and in real situations. How
    recovery situations are handled depends the confidence of the DBA performing the
    media recovery. You can obtain confidence by practicing media recoveries in all
    of the above-mentioned situations. Then, when you need to perform a media recovery,
    your uncertainties will have been significantly reduced. Such practice situations
    will also prepare you for testing and situations you will encounter as a DBA.'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# Exam Essentials


    Understand media recovery. Media recovery is required when database files, such
    as data files, control files, or online redo logs, become unavailable. Such files
    can become unavailable because of hardware failure, corruption, or accidental
    removal.


    Know the recovery differences between ARCHIVELOG and NOARCHIVOG mode. In order
    to perform a complete recovery, the database must be in ARCHIVELOG mode. In NOARCHIVOG
    mode, an incomplete recovery must be performed—otherwise all transactions after
    the last full backup to the point of failure will be lost.


    Be familiar with the process of restoring data files to different locations. To
    restore data files to different locations, you must use the OS commands to copy
    files from the backup location to the new location. You will use the ALTER DATABASE
    RENAME FILE command to recover the new data file locations in the control file.


    List the read-only tablespace recovery scenarios. The three read-only recovery
    scenarios include read-only backup and read-only recovery, read-only backup and
    read-write recovery, and read-write backup and read-only recovery. You should
    understand how recovery varies in each of these scenarios.


    Understand commands necessary to perform RMAN restoration and recovery. The RESTORE
    command will determine the best available backup set or image copy to use in the
    restoration. The RECOVER command will apply the necessary changes from the online
    redo logs and archived logs as incremental backups (if used) to the restored files.


    Understand RMAN recovery in ARCHIVELOG and NOARCHIVOG mode. In NOARCHIV mode,
    you use a RESTORE command of a consistent database but you don''t use the RECOVER
    command. In ARCHIVELOG mode, both the RESTORE and RECOVER commands are used.


    Use RMAN commands to restore data files to different locations. The SET NEWENAME
    command is used to name the new location of the data file, and the SWITCH command
    is used to update the control file with the new location. After this, the database
    is recovered.'
  merge: -1
  img_proc: true
- pgno: 369
  md: 'Use RMAN commands to relocate and recover a tablespace using archived logs.
    The SET NEWNAME command is used to name the new location of the data file, and
    the SWITCH command is used to update the control file with the new location. Note
    that the tablespace must be offline to perform the recovery, and then it must
    be put back online when the recovery is complete while the database is still open.


    # Key Terms


    Before you take the exam, be certain you are familiar with the following terms:


    +   - ARCHIVELOG mode incomplete recovery

    - cold backup media recovery

    - complete recovery NOARCHIVELOG mode

    - hot backup RECOVER DATABASE

    - image copies RESTORE DATABASE'
