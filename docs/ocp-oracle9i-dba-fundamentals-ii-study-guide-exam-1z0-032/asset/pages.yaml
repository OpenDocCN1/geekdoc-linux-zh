- pgno: 378
  md: '# Describing the User-Managed Incomplete Recovery 337


    Each of these options allows recovery to a point in time prior to the failure.
    The main reason why there are three options is that the DBA can have better flexibility
    and control of where recovery is halted during the recovery process. Each of these
    options is described in detail in the next section.


    Incomplete recovery is performed any time you don''t want to apply all the archived
    and nonarchived log files that are necessary to bring the database up to the time
    of failure. As a result, the database is not completely recovered; transactions
    remain missing. Figure 11.1 illustrates the different types of incomplete recovery.


    # FIGURE 11.1 Incomplete recovery in ARCHIVELOG mode for a media failure on January
    28th


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_378_0.png)


    Incomplete recovery should be performed when the DBA wants or is required to recover
    the database prior to the point of time when the database failed. Some of the
    circumstances that might call for this type of recovery include data file corruption,
    redo log corruption, or the loss of a table due to user error.


