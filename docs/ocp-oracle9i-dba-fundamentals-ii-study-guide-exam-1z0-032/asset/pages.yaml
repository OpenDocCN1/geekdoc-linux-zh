    **Line 5** The BADFILE keyword specifies the name of the file that will store
    the rejected records.


    **Line 6** The DISCARDFILE keyword specifies the name of the file that will store
    the discarded files.


    **Line 7** The REPLACE keyword is one of the options you can use when you want
    to replace the existing data in a table that you are loading into it. In this
    case, the existing data is deleted before the new data is copied. Alternative
    keywords to use in similar situations are APPEND, for a table that is not empty
    but one which you want to retain the data that is present, and INSERT, for a table
    that is empty.


    **Line 8** The INTO TABLE keyword allows you to identify the table—`invoice_header`
    in this example—fields, and their data types.


    **Line 9** The WHEN clause evaluates one or more field conditions to TRUE or FALSE.
    If the conditions are evaluated to TRUE, the record is loaded, otherwise, the
    record is not loaded.


    **Line 10** The FIELDS TERMINATED BY clause is the field delimiter or the character
    that separates the fields within the INFILE file `invoice_header.dat`. The OPTIONALLY
    ENCLOSED BY clause says that fields can also be enclosed by double quotes (\*").


    **Line 11** The TRAILING NULLS clause tells any other columns that are not present
