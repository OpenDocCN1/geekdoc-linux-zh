- pgno: 134
  md: '![](img/4d4ebf1b63c52ce2a364aa79830c39e0_134_0.png)


    once the Oracle server is properly configured, you can focus on getting the clients
    configured to allow for connectivity to the Oracle server. This chapter details
    the basic network elements of Oracle client configuration. It discusses the different
    types of service name models you can choose from creating net service names. In
    addition, it details available service resolution configurations and how to configure
    hostnaming and localnaming using the Oracle Net Manager. It also discusses the
    types of client-side failures that can happen and how to troubleshoot client-side
    connection problems.


    It is important to understand how to configure the Oracle clients for connectivity
    to the Oracle servers. Without proper knowledge of how to configure the client,
    you are limited in your connection choices to the DBA must understand the network
    needs of the organization and the type of connectivity is required, client/server
    connections 3-tier connectivity, for example, in order to make the appropriate
    choices about client-side configuration. This chapter should clarify the client-side
    connectivity options available to you and how to troubleshoot client connection
    problems.


    # Client-Side Names Resolution Options


    When a client needs to connect to an Oracle server, the client must supply three
    pieces of information: their user ID, password, and net service name. The service
    name provides the necessary information, in the form of a connect descriptor,
    name to locate an Oracle server in a network.


    This connect descriptor describes the path to the Oracle server and its service
    name, which is an alias for an Oracle database. This information is kept in different
    locations depending on the names resolution method that you choose. The three
    methods of net service name resolution are hostnaming, localnaming, and the Oracle
    Internet Directory. Normally, you will choose just one of these methods, but you
    can use any combination.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Client-Side Names Resolution Options 91


    > > NOTE The Oracle Names Server is still available in Oracle9i, although no further
    development is being done for the Oracle Names Server. The Oracle Names Server
    is being replaced by the Oracle Internet Directory as the preferred names resolution
    method for large Oracle networks.


    Choosing hostname is advantageous when you want to reduce the amount of configuration
    work necessary. However, there are a few prerequisites that you must consider
    before you use this option; we will talk about these and discuss configuring this
    method for use. This option is typically used in small networks that have few
    Oracle servers to maintain.


    Localnaming is the most popular names resolution method used. This method involves
    configuring the tnsnames.ora file, which contains the connect descriptor information
    to resolve the service names. You will see how to configure localnaming after
    the discussion of hostname.

    Oracle Internet Directory is advantageous when you are dealing with complex networks
    that have many Oracle servers. When the DBA chooses this method, they will be
    able to configure and manage service names and connect descriptor information
    in a central location. It is important to understand that Oracle Internet Directory
    is available, in-depth knowledge of this option is not necessary for success on
    the OCP exam.


    # ## The Hostnaming Method


    In small networks with few Oracle servers to manage, you can take advantage of
    the hostnaming method. Hostnaming saves you from having to do configuration work
    on the clients, although it has limitations. There are four prerequisites to using
    hostnaming:


    +   * You must use TCP/IP as your network protocol.


    +   * You must not use any advanced networking features, such as Oracle Connection
    Manager.


    +   * You must have an external naming service, such as DNS, or have a HOSTS file
    available to the client.


    +   * The listener must be set up with the GLOBAL_DBNAME parameter equal to the
    name of the machine.


    Copyright©2002 SYTEX, Inc., Alameda, CA www.sybex.com'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Configuring the Hostaming Method


    By default, Oracle will only attempt to use the hostaming method from the client
    after it attempts connections using localnaming. If you want to override this
    default search path for resolving names, set the NAMES.DIRECTORY_PATH parameter
    in the sqlnet.ora file on the client so that it searches for hostaming only. You
    can configure this parameter using the Oracle Net Manager (see Figure 3.1).


    To configure the parameter using Oracle Net Manager, choose Profile from the Local
    tab and select Naming from the drop-down list at the top of the screen. This brings
    up a list of naming methods that are available. The Selected Methods list displays
    the naming methods being used and the order in which the methods are used to resolve
    service names. The Available Methods list


    To change the list of available methods, use your mouse to highlight a name and
    click the arrow key (>) to include it in the list of selected methods. You can
    remove a name by selecting it in the list of selected methods and clicking the
    other key (<). You can also use the Demote and Promote buttons to change the order
    of the list. Select a name from the Selected Methods list and click the Demote
    button to move the name down the list or click the Promote button to move the
    name up. Make sure that HOSTNAME shows up in the Selected Methods list.


    # FIGURE 3.1 Oracle Net Manager - Oracle profile screen


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_136_0.png)'
