    # The Oracle Call Interface (OCI) Layer


    The Oracle Call Interface (OCI) layer is responsible for all of the SQL processing
    that occurs between a client and the Oracle server. The OCI layer exists on the
    client only. There is an analogous server component called the Oracle Program
    Interface (OPI) layer on the server. The OCI layer is responsible for opening
    and closing cursors, binding variables in the shared memory space, and fetching
    rows. Because the OCI is an open architecture, third-party products can write
    applications that interface directly with this layer of the communications stack.
    The OCI layer passes information directly to the Two-Task Common (TTC) layer.


    # The Two-Task Common (TTC) Layer


    The Two-Task Common (TTC) layer is responsible for negotiating any datatype or
    character differences between the client and the server. The Two-Task Common layer
    acts as a translator, converting values from one character set to another. The
    TTC will determine if any datatype differences'
  merge: -1
