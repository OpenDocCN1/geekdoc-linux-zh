    # Exploring the Media Management Library Interface


    The media management library (MML) interface is an API that interfaces RMAN and
    different hardware vendors'' ATLs.

    All tape hardware vendors that wish to work with Oracle RMAN will make their own
    MML. This is necessary because most tape hardware devices are proprietary and
    require different program calls. The MML is then linked with the Oracle database
    kernel so the RMAN server process and MML can read and write the Oracle data to
    the tape device. 8.4 describes this concept.


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_279_0.png)


    Oracle provides a third-party media management library (MML) that is included
    in its software installation by default with RMAN. This MML is used with Legato
    Storage Manager (LSM) software, which will manage an automated tape library (ATL).


