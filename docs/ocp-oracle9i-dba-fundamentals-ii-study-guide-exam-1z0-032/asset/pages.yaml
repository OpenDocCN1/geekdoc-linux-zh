    ORA-12154 Means that the client cannot find the service listed in the tnsnames.ora
    file. Some of the causes of this are described above, as the file is not in the
    proper directory, or the TNS_ADMIN variable is not specified or specified incorrectly.


    ORA-12198 or ORA-12203 Mean that the client found an entry for the Check to make
    sure the tnsnames.ora file but the service specified was not found. Check to make
    that the service specified in the tnsnames.ora file actually points to a valid
    database service.


    ORA-12533 Means you have configured the ADDRESS section of the tnsnames.ora file
    incorrectly. Check to make sure the syntax is correct or re-create the definition
    using the Oracle Net Manager tool.


    ORA-12541 Means that the client contacted a server that does not have a listener
    running on the specified port. Make sure that the listener is started on the server
    and that the listening port specifications on the client and the server match.


    # Summary


    The names resolution methods available for clients include hostname, localnaming,
    and Oracle Internet Directory. Hostnaming, which can only be used if you are using
    TCP/IP, is mainly used for very Oracle networks. Localnaming is the most popular
    of the name resolution methods, and it uses the tnsnames.ora file, which is typically
    located on each client, to resolve service names. The client looks up the service
    name in the tnsnames.ora file and uses the resulting connect descriptor information
    to connect to the Oracle server. The hostnaming and localnaming methods are configured
    using the Oracle Net Manager. Oracle Internet Directory Services is a Lightweight
    Directory Access Protocol (LDAP) compliant server that provides for centralized
    management of Oracle database connection information. The Oracle Internet Directory
    replaces Oracle Names Server as the preferred method of centralized administration
    of database services.'
