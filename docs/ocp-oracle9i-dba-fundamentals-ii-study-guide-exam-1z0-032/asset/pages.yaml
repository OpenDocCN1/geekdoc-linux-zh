  md: '# Application layer


    **Application layer** A layer of the Oracle Net stack that interacts with the
    user. This layer accepts commands and returns data.


    **archived logs** Also known as offline redo logs. Logs that are copies of the
    online redo logs and are saved to another location before the online copies are
    reused.


    **ARCHIVELOG mode** A mode of database operation. When the Oracle data-base is
    in ARCHIVELOG mode, the online redo log files are copied to another location before
    they are overwritten. These archived log files can be used for point-in-time recovery
    of the database. They can also be used for analysis.


    **archiver process (ARCn)** Performs the copying of the online redo log files
    to archived files.


    **ARCn** See archiver process (ARCn).


    **ATL** See automated tape library (ATL).


    **automated tape library (ATL)** A tape device that can interface with RMAN and
    can automatically store and retrieve tapes via tape media software.


    **automatic archiving** The creation of archived logs after the appropriate redo
    logs have been switched. The LOG_ARCHIVE_START parameter must be set to TRUE in
    the init.ora file for automatic archiving to take place.


    **automatic channel allocation** This type of channel allocation is performed-by
    settingtheRMANconfigurationathtRMANcommandprompt. This is done by using the CONFIGURE
    DEFAULT DEVICE or CONFIGURE DEVICE commands.


    **AVAILABLE** The RMAN command used to make a backup set available or accessible
    in the RMAN repository.'
