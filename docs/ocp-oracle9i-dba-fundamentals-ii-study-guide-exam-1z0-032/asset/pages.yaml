  md: '# 130 Chapter 4 · Configuring the Shared Server Option


    # DISPATCHERS Parameter


    This parameter configures the number of dispatchers that should start when the
    instance is started. The DISPATCHERS parameter specifies the number of dispatchers
    and the type of protocol that the dispatchers can respond to.


    You can add additional dispatchers dynamically using the ALTER SYSTEM command.
    This command allows you to increase the number of dispatchers without bringing
    the instance down. In addition, this command has a number of optional attributes.
    The two main attributes are the number of dispatchers and the protocol the dispatcher
    will listen for. For example, say you wanted to configure three TCP/IP dispatchers
    and two IPC dispatchers.


    ```

    DISPATCHERS = *(PRO=TCP)(DIS=3) (PRO=IPC)(DIS=2)"

    ```


    All of the attributes for this parameter can be abbreviated. Table 1.1 shows the
    other attributes you can set with the DISPATCHERS parameter. Of the three attributes,
    ADDRESS, DESCRIPTION, or PROTOCOL, only one needs to be specified for a DISPATCHERS
    definition.


    # TABLE 4.1 Summary of DISPATCHER Attributes


    | Attribute | Abbreviations | Description |

    | --- | --- | --- |

    | ADDRESS | ADD or ADDR | Specifies the network protocol address of the endpoint
    on which the dispatchers listen. |

    | CONNECTIONS | CON or CONN | The maximum number of network connections per dispatcher.
    The default value varies by operating system. |

    | DESCRIPTION | DES or DESC | The network description of the endpoint where the
    dispatcher is listening, including the protocol being listened for. |

    | DISPATCHERS | DIS or DISP | The number of dispatchers to start when the instance
    is started. The default is 1. |'
