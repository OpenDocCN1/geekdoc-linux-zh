  md: '# Performing an Incomplete Database Recovery 341


    Incomplete recovery options, such as the backup control file being used in conjunction
    with the RECOVER DATABASE USING BACKUP CONTROL FILE UNTIL command, can be useful
    when you are trying to move databases from one location to another. When you use
    such options, you can move databases for any purpose, as moving a database for
    testing, or just moving a database to a new server. You must make sure that if
    you are moving a database to a new server, the Oracle database software you are
    using and the OS on the new server are similar.


    This approach of moving databases is performed by taking the hot or cold backup
    of the database you want to move and moving the data files and initialization
    files to the new location. You would then need the backup control file to location
    references of all the physical database files, such as redo logs and data files.
    After you have done this, you need to validate your ORACLE_SID and make sure it
    is the correct database; you would then need to execute the backup control file
    at the SQL prompt as sysdba. This will generate a new database on a new server
    and in different locations. Please refer to the Oracle documentation for the exact
    steps to perform this task and always try this process in a test environment.


    As a DBA, you will be responsible for setting up test environments for numerous
    reasons. You will find that the ability to move and set up databases and applications
    on different servers for testing and upgrade purposes is a must-have skill. Every
    time there is any significant upgrade, it will need to be tested on a different
    environment than the production environment. This approach of moving data files
    and re-creating the control file works well for many testing and upgrading situations.


    # Time-Based Recovery


    Time-based recovery, the DBA recovers the database to a point in time before the
    point of failure. Time-based recovery provides more flexibility and control than
    the cancel-based option does. The cancel-based option''s granularity is the size
    of a redo log file; in other words, when applying a redo log file, you get all
    the transactions in that file, regardless of the time period over which that log
    was filled.


    In time-based recovery, you apply archived logs to the database to a designated
    point in time. This point could be in the middle of the archived log, not necessarily
    apply to the whole archived log. After you have applied these logs, you can control
    the recovery process to a time prior to a'
