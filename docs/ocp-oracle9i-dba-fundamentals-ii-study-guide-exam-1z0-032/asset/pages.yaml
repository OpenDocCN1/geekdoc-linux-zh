  md: '# Cleaning Up after Failed Online Backups


    Online backups, whether they are user-managed or RMAN-based, perform the same
    database commands. One of these commands, the ALTER TABLESPACE <tablespace name>
    BEGIN BACKUP command, results in tablespaces being placed into backup mode. When
    the required data file(s) is completely copied, the ALTER TABLESPACE <tablespace
    name> END BACKUP command is executed.


    If there is a problem before the tablespace is taken out of backup mode, the tablespace
    may cause problems during recovery or it may lock up the entire backup. If the
    database is shutdown with a tablespace in backup mode, the database will not start
    without taking the associated data files out of backup mode. Sometimes RMAN may
    have problems if the next scheduled backup attempts to place the tablespace in
    backup mode when it is already in backup mode. This will cause the RMAN backup
    to fail or hang while it is trying to place the tablespace in backup mode.


    If an online backup fails, all tablespace data files should be checked to make
    sure they are not in backup mode. This can be done by checking the VBACKUP view.
    The following example shows that one data file is in backup mode. The tablespace
    with data file 4 should be taken out of backup mode. This tablespace should be
    identified and altered out of backup mode with ALTER TABLESPACE <tablespace_name>
    END BACKUP. See the example below:


    +   1. First, check to see if any data file is active; if one, this means that
    the tablespace and its associated data files are in backup mode. The data file
    number 4 is in backup mode because the status is ACTIVE.


    ```

    select * from vbackup;

    ```


    | FILE | STATUS | CHANGE TIME |

    |---|---|---|

    | 1 | NOT ACTIVE | 0 |

    | 2 | NOT ACTIVE | 0 |

    | 3 | NOT ACTIVE | 0 |

    | 4 | ACTIVE | 279174 29-SEP-01 |

    | 5 | NOT ACTIVE | 0 |

    | 6 | NOT ACTIVE | 0 |

    | 7 | NOT ACTIVE | 0 |

    | 8 | NOT ACTIVE | 278815 29-SEP-01 |'
