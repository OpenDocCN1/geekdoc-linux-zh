- pgno: 483
  md: '![](img/4d4ebf1b63c52ce2a364aa79830c39e0_483_0.png)


    he SQL*Loader utility is a tool designed to load extract data into the Oracle
    database. This utility loads data from an external file format into tables within
    an Oracle database.


    SQL*Loader has three primary ways it uses to load data: conventional load, a direct-path
    load, or an external-path load. Each of these load methods is designed for a different
    usage.


    We will also demonstrate a Data Manipulation Language (DML) statement called direct-path
    insert. This is not actually part of SQL*Loader, but it is similar to the SQL*Loader
    direct-path load method.


    Finally, we will list some guidelines that explain the best ways to use SQL*Loader.
    We will outline each topic and briefly discuss each guideline.


    It is important to conquer the topics covered in this chapter as you prepare for
    the test. In addition, this information has a practical application in the workplace.
    SQL*Loader can be a valuable utility for multiple uses including moving data from
    one database to another, making backups of tables, and performing maintenance
    operations. Familiarity with this tool is a valuable asset to any DBA.


    # Using Direct-Load Insert Operations


    The direct-load insert operation is not actually a function of the SQL*Loader
    utility. Instead, this operation is a DML command, which can be performed within
    the database using SQL*Plus. The direct-load insert has similarities to the SQL*Loader
    direct-path load, which we will discuss in more detail in the next section, “Using
    SQL*Loader.” Both the direct-load insert and SQL*Loader direct-path load will
    bypass the buffer cache and'
  merge: -1
  img_proc: true
- pgno: 484
  md: '# Using Direct-Load Insert Operations 445


    write directly within the tables you are loading. This functionality allows both
    of these operations to be extremely fast.


    Direct-load insert comes in two flavors: serial direct-load insert and parallel-direct-load
    insert. Serial direct-load insert is the normal operation that uses one server
    process to insert data beyond the high-water mark. Direct-load insert can be used
    on unpartitioned, partitioned, and subdivided tables. Below is an example of serial
    direct-load insert.


    ```

    SQL> INSERT /*+ APPEND / INTO T1_NEW

    1> NOPOGGING

    2> SELECT * T1

    3> COMMIT;

    ```


    The second type of direct-load insert is called parallel direct-load insert. Parallel
    direct-load insert is the same DML insert operation as serial load-insert, but
    in this case, the statement or table is put into parallel mode. This description
    implies that the database must be configured for parallel operations, which means
    you must have parallel clauses configured in your initialization parameters. (This
    topic is covered in more detail in OCP: Oracle9 Performance Tuning Guide, by Joseph
    C. Johnson Sybek, 2002).


    Furthermore, you must enable parallel DML for the session in which you will be
    performing the parallel direct-load insert. You will do this with the ALTER SESSION
    ENABLE PARALLEL DML command. After you have used this command, you must insert
    a hint or place the table to be inserted into parallel mode. A hint with a multiple
    line comment with a plus symbol, such as /*+ PARALLEL (TEST.T1_NEW, 4) */ is a
    mechanism that influences the explain path of a query so that the query performs
    in a certain way. Alternatively, you can alter the table to degree 4 with the
    following command: ALTER TABLE T1_NEW PARALLEL (DEGREE 4).


    The parallel direct-load insert causes multiple server processes to break up the
    insert function into multiple temporary segments, and it also causes the parallel
    coordinator to manage the temporary segments into the table. Below is an example
    of parallel direct-load insert statement.


    ```

    SQL> ALTER SESSION ENABLE PARALLEL DML;

    SQL> INSERT /*+PARALLEL (TEST.T1_NEW, 4) / INTO T1_NEW

    1> NOPOGGING

    2> SELECT * FORM T1

    3> COMMIT;

    ```'
  merge: -1
  img_proc: true
- pgno: 485
  md: '# Using SQL*Loader


    SQL*Loader is an Oracle utility that was designed to load or transport external
    data from one database to another. SQL*Loader is often used in nightly extracts
    from other non-Oracle-based systems with which your database interface. It has
    become the tool of choice for the Oracle database in order to build or refresh
    Data Warehouse or Data Marts. This new-found popularity results from its speed
    and versatility on large data sets for both Oracle and non-Oracle sources.


    Because of SQL*Loader''s parsing capabilities, the external files it can be in
    with various formats. As a result of this versatility, you can use SQL*Loader
    to do the following:


    +   - Load data from multiple data files or input files during the same load session.

    - Load data into multiple tables during the same load session.

    - Combine multiple input records into a logical record for loading.

    - Specify the character set of the data.

    - Accept input fields of fixed or variable length.

    - Selectively load data (you can load records based on the records'' values).

    - Manipulate the data before loading it using SQL functions.

    - Generate unique, sequential key values in specified columns.

    - Use the operating system''s filesystem to access the data files.

    - Load data from disk, tape, or named pipe.

    - Append data to and replace existing data in the tables.

    - Load data directly into data blocks by passing the buffer cache.

    - Use secondary data files for loading large binary objects (LOBs) and collections.


    There are three main file structures that you will need to be familiar with when
    you are using SQL*Loader: the control file; log files, which include bad logs,
    discard logs, and general logs; and input data, or data files. These file structures
    will be discussed in detail in this section.'
  merge: -1
  img_proc: true
- pgno: 486
  md: '# Using SQL*Loader 447


    SQL*Loader also uses three methods to load data into the database—the conventional
    load, the direct-path load, and the external-path load—and three other methods
    in parallel mode to further improve performance—parallel load, intersegment concurrency
    with direct-path load, and intrasegment concurrency with direct-path load. Both
    sets of these methods are also discussed in the following pages.


    # Control Files, Log Files, and Input Data or Data Files


    SQL*Loader''s three main components are the control file, the log files, the input
    data, or data files. The *control file* is the logic behind the data load that
    determines how and what data will be loaded. The *log files* includes the bad,
    discard, and the general log files. The *bad log* documents records that were
    rejected by the Oracle database or because they have an invalid format or key
