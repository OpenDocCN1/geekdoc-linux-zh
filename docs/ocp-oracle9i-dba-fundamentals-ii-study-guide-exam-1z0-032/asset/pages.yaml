  md: '# 234 Chapter 8 • Oracle Recovery Manager Overview and Configuration


    As mentioned earlier, the RMAN utility also enables you to connect to a target
    database without using this recovery catalog database. Though this approach is
    not recommended by Oracle, it does have its uses. (For instance, you might use
    this approach if the overhead of creating and maintaining the recovery catalog
    were too great for your organization.)


    If you use RMAN without the recovery catalog, you are storing more of the necessary
    information about each target database in the target database''s control file,
    which serves as the RMAN repository. Thus, you must manage the target database''s
    control file to support this data. The *init.ora* file''s CONTROL_FILE_RECORD_KEEP_TIME
    parameter determines how long information that can be used by RMAN is kept in
    the control file. The default value for this parameter is 7 days, but it can be
    as many as 365 days. The greater the number, the larger the control file becomes
    so it can store more information. The control file can only be as large as the
    OS allows, so be aware of this. The information that is stored within the control
    file is stored in the *reusable sections*. These sections can grow if the value
    of the CONTROL_FILE_RECORD_KEEP_TIME parameter is 1 or more. The reusable sections
    are made up of the following categories:


    +   * Archived log

    * Backup data file

    * Backup redo log

    * Copy corruption

    * Deleted object

    * Offline range

    * Backup corruption

    * Backup set

    * Data file copy

    * Log history


