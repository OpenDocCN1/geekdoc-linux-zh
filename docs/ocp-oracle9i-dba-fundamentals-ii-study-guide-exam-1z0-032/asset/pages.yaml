- pgno: 494
  md: '# SQL*Loader Parallel Load Methods


    SQL*Loader can be run in parallel to further improve performance of large data
    loads. There are three main variations of parallel loads: parallel conventional
    load, intersegment concurrency with direct-path load, and intra-segment concurrency
    with direct-path load. Here we explore each of these load methods.


    Parallel conventional load Parallel conventional load is performed by issuing
    SQL*Loader commands, each with their own control file and input data file, all
    to the same table. The input data file is logically split on the record boundaries
    in the table. For example, records 1 through 100 are loaded using the inv.dat
    input file, and records 101 through 200 are loaded using the inv2.dat input file.


    ```

    oracle@octilli:> sqlldr test/test control=inv.ctl

    load=inv.dat

    ```


    ```

    oracle@octilli:> sqlldr test/test control=inv2.ctl

    load=inv.dat

    ```


    Intersegment concurrency with direct-path load Intersegment concurrency with direct-path
    load is performed by using direct-path load to load into multiple tables or partitions
    within a table at the same time. This method is performed in the same way as parallel
    conventional load is, but it adds the DIRECT-TRUE keyword and uses different tables.
    Notice that the first load is going into the inv.dat table and the second is going
    into orders.dat table as defined by the control file and input file name.


    ```

    oracle@octilli:> sqlldr test/test control=inv.ctl

    load=inv.dat direct=true

    oracle@octilli:> sqlldr test/test control=orders.ctl

    load=orders.dat direct=true

    ```


    Intrasegment concurrency with direct-path load Intrasegment concurrency with direct-path
    load is performed by using direct-path load to load data into a single table or
    partition. This can be performed by placing the DIRECT-TRUE and PARALLEL=TRUE
    option on the command line. In this parallel server, processes load the data into
    temporary segments and merge them into the individual segments.


    ```

    oracle@octilli:> sqlldr test/test control=inv.ctl

    load=inv.dat direct=true parallel=true

    ```'
  merge: -1
  img_proc: true
