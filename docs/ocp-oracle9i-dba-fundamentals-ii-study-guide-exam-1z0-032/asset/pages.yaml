- pgno: 379
  md: 'In some cases, incomplete recovery is the only option available to you. In
    a failure situation that involves the loss or corruption of the current and inactive
    archived redo log files, recovering the database without the transactions in these
    files is the only option. If a complete recovery were performed instead, the error
    would be reintroduced as a result of the recovery process.


    # # Performing an Incomplete Database Recovery


    This section details the three types of incomplete database recovery: cancel-based,
    time-based, and change-based. Each of these methods is used for different circumstances,
    and you should be aware of when each is appropriate.


    # # Cancel-Based Recovery


    In cancel-based recovery, you cancel the recovery before the point of failure.
    Cancel-based recovery provides the least flexibility and control of the stop-point
    during the recovery process. In this type of recovery, you apply archived logs
    during the recovery process. At some point before the recovery is complete, you
    enter the CANCEL command. At this point, recovery halts, and no more archived
    logs are applied.


    The following is a sample of cancel-based incomplete recovery.


    ```

    SQL> recover database until cancel;

    ```


    One example of when you would use a cancel-based incomplete recovery is when you
    need to restore a backup of a lost data file from a hot backup. To do this, you
    perform the following steps:


    +   1. Make that the database is shut down using the SHUTDOWN command from SQL*Plus.

    2. Make that current copies of the data files, control files, and parameter files
    exist in case there are errors that arise from the recovery process. If these
    files exist, you will be able to restart the recovery process, if needed, without
    introducing any new errors that might have resulted from a previous failed recovery.

    3. Make sure that a current backup exists because copied files from the current
    backup will replace the failed data files, online redo log files, or control files.'
