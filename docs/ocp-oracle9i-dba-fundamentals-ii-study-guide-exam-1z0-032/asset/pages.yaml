- pgno: 274
  md: '# Exploring RMAN Components 231


    connectivity. These components enable a DBA to automate and standardize the backup
    and recovery process. Each component is described below:


    GUI or command-line access method This method provides access to Recovery Manager,
    which in turn provides access to RMAN. The GUI method spawns off of server sessions
    that connect to the database—the database targeted by RMAN for backup or recovery
    actions. GUI access is provided through the Oracle Enterprise Manager (OEM) tool,
    which is a DBA tool that performs backups, exports/imports, data loads, performance
    monitoring/tuning, job and event scheduling, and can run in a standard Unix Telnet
    or X Windows session as well as in a DOS shell in the Windows environment.


    Optional recovery catalog This special data of backup information is stored in
    a set of tables, in the same way that the dictionary information about databases.
    The recovery catalog provides a method for storing information about backups,
    restores, and recoveries. This information provides status updates on the success
    or failure of backups, the OS backup, data file copies, tablespace copies, control
    file copies, archived log copies, full database backups, and the physical structures
    of a database.


    RMAN commands These commands enable different actions to be performed that facilitate
    the backup and restoration of the database. These commands can be organized logically
    into scripts, which can then be stored in the recovery catalog database. The scripts
    can be reused for other backups, thus keeping consistency among different target
    database backups.


    Tape media connectivity This component provides a method for interfacing with
    various third-party tape vendors to store and track backups in automated tape
    libraries (ATL). An ATL is a large tape cabinet that stores many tapes and can
    write to multiple tapes at the same time to improve performance. ATLs use robotic
    arms to load, unload, and store tapes. By default, Oracle provides media management
    libraries (MML) for the Legato Storage Management (LSM) software, which manages
    an ATL device.


    Figure 8.2 shows an example of how the RMAN utilities'' components fit together
    to form a complete backup and recovery package.'
  merge: -1
  img_proc: true
