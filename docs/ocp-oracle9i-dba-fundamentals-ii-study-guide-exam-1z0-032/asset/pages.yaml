  md: '# Reloading the Listener


    If the listener is running and modifications are made to the listener.ora file
    either manually or with Oracle Net Manager, the listener has to be reloaded to
    refresh the listener with the most current information. The reload command will
    reread the listener.ora file for the new definitions. As you can see, it is not
    necessary to stop and start the listener to reload. Though stopping and restarting
    the listener can also accomplish a reload, using the reload command is better
    because the listener is not actually stopped, which makes this process more efficient.
    The following code shows an example of the reload command:


