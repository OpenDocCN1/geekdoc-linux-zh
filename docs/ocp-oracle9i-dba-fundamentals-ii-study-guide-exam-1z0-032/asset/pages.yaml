    # FIGURE 8.3 Channel allocation


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_278_0.png)


    Channels can be allocated manually or automatically. Manual channel allocation
    is performed any time you issue the ALLOCATE CHANNEL command, which starts a process
    on the server of the database. To manually write to a disk file system, you would
    use the ALLOCATE CHANNEL <channel name> TYPE DISC command. Similarly, to write
    to a tape backup system, you would use the ALLOCATE CHANNEL <channel name> TYPE
    ''SBT_TAPE'' command. These are the most common manual channel allocation usages.


    Automatic channel allocation is performed when you set the RMAN configuration
    prompt. You do this by using the CONFIGURE DEFAULT DEVICE or CONFIGURE DEVICE
    command. This type of allocation is automatic when you are executing the BACKUP,
    RESTORE, or DELETE commands. By using the CONFIGURE commands you can eliminate
    the need to use the ALLOCATE CHANNEL <channel name> TYPE DISC or ''SBT_TAPE''
    command every time you perform a BACKUP, RESTORE, or DELETE. The complete list
    of automatic channel allocation commands is as:


    +   - CONFIGURE DEVICE TYPE PARALLELISM

    - CONFIGURE DEFAULT DEVICE TYPE'
