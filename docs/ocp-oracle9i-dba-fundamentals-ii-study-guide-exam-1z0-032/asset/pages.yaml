    the recovery catalog, and you will also explore the components that make up this
    catalog.


    This chapter focuses on the practical aspects of the recovery catalog, such as
    installation and configuration. You will use the RMAN commands introduced in this
    chapter to manage and maintains the recovery catalog, and you will learn how to
    create the reports and provide information about the backup process. You will
    also work with scripts to perform assisted backup tasks and activities, similar
    to what you have already done with the hot and cold backup scripts. However, the
    scripts in this chapter are executed within the RMAN utility.

    The topics covered in this chapter will all be required in both testing and real-world
    situations. The recovery catalog is a key component and allows for complete functionality
    of RMAN. Understanding how this information is key to performing well on the test
    and getting the most of RMAN in the workplace.'
