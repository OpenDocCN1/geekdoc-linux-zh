    > ### Real World Scenario

    Multiple Backups Types on Your Tapes

    Your tape device can be supporting multiple backups that may include both RMAN-based
    and normal filesystem backups. Most automated tape libraries (ATLs) and the software
    associated with them support filesystem-backups as well as RMAN backups. This
    means that you could have each type of backup on a tape, especially because digital
    linear tapes (DLTs) will support large storage volumes—from 40–200 gigabytes per
    tape—which means that filesystem backups and RMAN backups could be interspersed
    over a single tape.'
