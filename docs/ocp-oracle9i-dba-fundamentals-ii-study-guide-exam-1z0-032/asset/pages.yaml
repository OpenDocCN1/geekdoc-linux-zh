- pgno: 329
  md: '# Defining Media Recovery


    Media recovery is a type of recovery used for recovering any used data file, control
    file, or online redo log file that becomes unavailable. The data file or control
    file may become unavailable for a number of reasons—it may have been lost, deleted,
    or moved from its original location, or it may have been damaged by data corruption
    or a hardware failure. All of these situations result in the Oracle database not
    being able to read or write to this file.


    When a situation requiring media recovery occurs, the DBA must restore the unavailable
    file or files. If the database is in ARCHIVOGEL mode, you must then recover these
    files by applying archived logs to the restored files. This will make the restored
    files as current as the rest of the database files.


    # Recovering Using NOARCHIVELOG and ARCHIVOGEL Modes


    One of the most significant backup and recovery decisions a DBA can make is whether
    to operate in ARCHIVOGEL mode or NOARCHIVELOG mode. The outcome of this decision
    dramatically affects the backup and recovery options available.


    When the database is in ARCHIVOGEL mode, it generates historical changes in the
    form of offline redo logs, or archived logs. That is, the database doesn''t write
    over the online redo logs until a copy is made, and this is called an offline
    redo log, or archived log. These logs can be applied to backups of the data files
    to recover the database up to the point of failure. Figure 10.1 illustrates complete
    recovery in ARCHIVOGEL mode.


    When the database is in NOARCHIVELOG mode, it does not generate historical changes;
    as a result, there is no archive logging. In this mode, the database writes over
    the online redo logs without creating an archived log. Thus, no historical information
    is generated and saved for later use. Figure 10.2 illustrates incomplete recovery
    in NOARCHIVELOG mode. Even though this is called a complete recovery, the recovery
    process will be missing transactions because you are not generating archived logs
    to be applied in the recovery process.'
  merge: -1
  img_proc: true
