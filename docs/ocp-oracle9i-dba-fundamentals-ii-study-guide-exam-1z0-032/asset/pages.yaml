    +   4. B. The DELETE command removes backup sets and copies for the catalog.


    +   5. A. The allocate channel for delete is necessary when using the DELETE command.
    c1 and t1 are names of the channel devices.


    +   6. A, C, D. The CHANGE AVAILABILITY command can be used on backup sets, copies,
    and cataloged backups that are file copies.


    +   7. The status of unavailable is seen in the list command output and is U.


    +   8. The retention policy is a parameter known as a CONFIGURATION parameter.
    There are many other configuration parameters.


    +   9. The RMAN KEEP command causes backups to bypass or outlast a retention policy.


    +   10. A catalog backup is a file that is backed up for an OS or a user-managed
    backup.


