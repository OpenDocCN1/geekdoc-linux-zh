- pgno: 226
  md: '# Oracle Recovery Processes, Memory Components, and File Structures 183


    Each database has at least two sets of online redo logs, Oracle recommends at
    least three sets. You will see why when we discuss archived logs in the next section.
    Redo logs record all the changes that are made to the database; these changes
    result from the LGWR writing out buffers to logs at particular events or in time.


    As mentioned previously, redo logs are written in a circular fashion. That, if
    there are three sets of logs, log 1 gets written to first until it is full. Then
    Oracle moves to log 2, and it gets written to until it is full. Then Oracle moves
    back to log 3, and it writes over the existing information, and repeats this process
    over again. Here is a listing of the logs from the VLOGFILE view.


    ```

    SQL> select group#, member from v$logfile;

    GROUP# MEMBER

    ```


    | 3 /oracle/oradata/orc9/redo03.log |

    | 2 /oracle/oradata/orc9/redo02.log |

    | 1 /oracle/oradata/orc9/redo01.log |


    3 rows selected.


    Figure 6.1 shows an example of the circular process of redo file generation, which
    writes to one log at a time, starting with log 1, then log 2, then log 3, and
    back to log 1.


    # FIGURE 6.1 The circular process of redo file generation


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_226_0.png)


    The LGWR process writes to redo log 1 until full, then proceeds to redo log 2
    until full, then proceeds to redo log 3 until full. At this point, the LGWR writes
    over redo log 1 and repeats the same process.


    Copyright ©2002 SYBEX, Inc., Alameda, CA    www.syb.com'
  merge: -1
