- pgno: 129
  md: '# Answers to Review Questions


    +   A. The listener is the process that manages incoming connection requests.
    The listener.ora file is used to configure the listener. sqlnames.ora is an optional
    client- and server-side file. The tnsnames.ora file is used for doing local naming
    resolution. There is no such file as lsnctcl.ora.


    +   B. The listener can handle a connection request in one of two ways: it can
    spawn a process and bequeath (pass) control to that process, or it can redirect
    the process to a dedicated process or dispatcher when using Oracle Shared Server.


    +   E. When creating a listener with the Oracle Net Manager, the Assistant recommends
    LISTENER as the default name. When you are starting and stopping the listener
    via the command line tool, the tool assumes the name of the listener is LISTENER
    if no listener name is supplied.


    +   E. There is no physical limit to the number of services a listener can listen
    for.


    +   A. Although a listener can listen for an unlimited number of services, only
    one listener.ora file is used. If multiple listeners are configured, there will
    still be only one listener.


    +   B. Network tracing is what records all events on the network if there is no
    error involved. Tracing should be used sparingly and only as a last resort in
    the case of network problems. Logging will log only significant events such as
    listener startup and connection requests.


    +   C. When services are dynamically registered with the listener, the information
    is not present in the listener.ora file.


    +   C. A default listener has a name of LISTENER and listens on Port 1521 for
    TCP/IP connections.'
  merge: -1
  img_proc: true
