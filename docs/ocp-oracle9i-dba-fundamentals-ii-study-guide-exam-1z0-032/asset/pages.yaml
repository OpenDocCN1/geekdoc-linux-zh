  md: '# Summary


    The Oracle backup and recovery capability is full featured and robust. It provides
    many options that support a wide variety of backup and recovery situations. In
    this chapter, you have seen how to configure an Oracle database for backup and
    recovery. You have learned the ramifications of operating in ARCHIVELOG mode as
    opposed to NOARCHIVELOG mode, and versa, how that choice affects the backup and
    recovery process. You have seen examples of how the parameters control the destinations
    and automation of the archive logging. Finally, you walked through an example
