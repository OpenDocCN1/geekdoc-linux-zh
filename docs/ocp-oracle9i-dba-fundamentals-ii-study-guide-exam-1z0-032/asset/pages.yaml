- pgno: 64
  md: '20 Chapter 1 • Introduction to Network Administration


    are present when the connection is established. The TTC layer passes information
    to the Oracle Net Foundation layer. This layer shares some of the characteristics
    of the Presentation Layer from the OSI model.


    # The Oracle Net Foundation Layer


    The Oracle Net Foundation layer (formerly known as the Transparent Network Substrate
    or TNS layer) is an integral component of the Oracle communications architecture,
    and it is analogous to the Session Layer in the OSI model. It is based on the
    Transparent Network Substrate (TNS), which allows Oracle Net to be a very flexible
    architecture, interfacing with a wide variety of network protocols. The TNS interface
    shields both the client and server from the complexities of network communications.


    At this layer of the communications stack, Oracle Net interfaces with the other
    layers of the stack and their underlying protocols. It is this layer that provides
    the level of abstraction necessary to make Oracle Net a flexible and adaptable
    architecture, and it is this layer compensates for differences in connectivity
    between machines and underlying protocols. This layer also handles interrupt messages
    and passes information directly to the Oracle Protocol Adapters (OPA) layer. The
    Oracle Net Foundation layer has several sublayers:


    **Network interface (NI) sublayer** The network interface sublayer provides a
    common interface on which the clients and servers can process functions. This
    layer of the stack is also responsible for handling any break requests.


    **Network routing (NR) sublayer** This is where Oracle Net keeps its network work
    map of how to get from the source or to the destination or


    **Network naming (NN) sublayer** This layer takes network information and changes
    it into Oracle Net destination address information.


    **Network authentication (NA) sublayer** This layer is responsible for any negotiations
    necessary for authenticating connections.


    **Network session (NS) sublayer** The network session layer handles the bulk of
    activity in an Oracle network connection. This layer is responsible for such things
    as negotiating the initial connection request from the client. It is also responsible
    for managing the Oracle Net buffer and passing the buffer information between
    the client and the server. It also handles


