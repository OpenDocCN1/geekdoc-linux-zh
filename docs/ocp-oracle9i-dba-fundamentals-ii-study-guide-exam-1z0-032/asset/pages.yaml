    # Adding Additional Listeners


    To add listeners, follow the steps outlined above. Listeners must have unique
    names and listen on separate ports, give the listener a new name and assign it
    to a different port (1522, for example). You must also assign service names to
    the listener.


    # Optional listener.ora Parameters


    You can select optional parameters to add functionality to the listener. Optional
    parameters are added by choosing the General Parameters dropdown list box at the
    top right of the screen. Table 2.2 describes these parameters and where they can
    be found in the Oracle Net Manager.


    As you will, some parameters cannot be added directly from the Oracle Net Manager
    and have to be added manually. These optional parameters also have the listener
    name appended to them so you can tell which listener definition they belong to.
    For example, if the parameter STARTUP_WAIT_TIME is set for the default listener,
    the parameter created is START_WAIT_TIME_LISTENER.'
