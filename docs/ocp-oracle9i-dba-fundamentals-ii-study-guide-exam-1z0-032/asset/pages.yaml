  md: '# Internet Connectivity with Oracle Net


    Connections initiated to an Oracle server via a web browser are much like client-server
    applications. The main difference is that the application server acts as the client,
    providing communications to and from the Oracle server. If a Java application
    resides on the web server, the Java Database Connectivity (JDBC) OCI driver is
    used to initiate communications to the Oracle server. (JDBC) is an interface that
    allows Java programs to interact with data stored in tabular form, such as in
    an Oracle database.) If the connection is made via a Java applet, then the JDBC
    Thin Driver is used. The JDBC Thin Driver does not require Oracle client software
    to be installed, hence the term “thin driver.” This provides the connectivity
    from the applet to the Oracle server.


    Typically in this environment, an HTTP request is initiated at the client and
    sent to the application server. The application server serves the request to the
    appropriate database server for processing. Oracle Net serves as the mechanism
    for communication between the application server and the database. HTTP is used
    to send the request to the application server and to receive the response from
    the application server. Figure 1.7 shows an example of web connections using a
