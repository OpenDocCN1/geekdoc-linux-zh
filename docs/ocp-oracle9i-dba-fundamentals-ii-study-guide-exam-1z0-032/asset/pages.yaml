  md: '# # Using Your Sybex Electronic Book


    To realize the full potential of this Sybex electronic book, you must have Adobe
    Acrobat Reader with Search installed on your computer. To find out if you have
    the correct version of Acrobat Reader, click on the Edit menu—Search should be
    an option within this menu file. If Search is not an option in the Edit menu,
    please use this application and install Adobe Acrobat Reader with Search from
    this CD (double-click rp500enu.exe in the Adobe folder).


    # # Navigation


    Navigate through the book by clicking on the headings that appear in the left
    panel; the corresponding page by the book displays in the right panel.


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_1_0.png)


    # # Search


    To search, click the Search Query button on the toolbar or choose Edit >Search
    > Query to open the search window. In the Adobe Acrobat Search dialog''s text
    field, type the text you want to find and click Search.


    Use the Search Next button (Control+U) and Search Previous button (Control+Y)
    to go to other matches in the book. The Search command also has powerful tools
    for limiting and expanding the definition of the term you are searching for. Please
    refer to Acrobat''s online Help (Help > Plug-In Help > Using Acrobat) for more
