    # Accessibility: External Procedures


    In some development efforts, it may be necessary to interface with procedures
    that reside outside of the database. These procedures are typically written in
    a third-generation language, such as C. Oracle Net provides the ability to invoke
    external procedures from Oracle PL/SQL calls. When a call is made, a process will
    be started that acts as an interface between Oracle and the external procedure.
    This call extproc. The listener is then responsible for supplying information,
    such as a library or procedure name and any parameters, to the called procedure.
    These programs are then loaded and executed under the control of the extproc process.


    # The Oracle Net Stack Architecture


    The Oracle Net software is comprised of a series of programs that form a type
    of stack architecture. Each of these programs is responsible for handling various
    aspects of network communications, and each functions as a layer of the stack.
    This section discusses the architecture of the Oracle Net stack and defines the
    responsibilities of each portion. To successfully complete the OCP exam, you need
    to understand the structure and function of the Oracle Net stack. The structure
    is based on the Open Systems Interconnection (OSI) model.


    # The OSI Model


    The Open Systems Interconnection (OSI) model is a widely accepted model that defines
    how data communications are carried out across a network.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# The Oracle Net Stack Architecture 17


    There are seven layers in the OSI model, and each layer is responsible for some
    aspect of network communication. The upper layers of the model handle responsibilities
    such as communicating with the application and presenting data. The lower layers
    are responsible for transporting data across the network. The upper layers pass
    information, as the destination of the data and how the data should be handled,
    to the lower layers. The lower layers communicate status information back to the
    upper layers. Table 1.1 shows the layers of the OSI model and the responsibilities
    each has in order for communications across a network to be executed. As you can
    see from this table, this layered approach allows for a separation of responsibilities.
    It also allows for the separation of the logical aspects of network communications,
    such as presentation and data management, from the physical aspects of communications,
    such as the physical transmission of bits across a network.


    # TABLE 1.1 The Layers of the OSI Model


    | OSI Model Layer | Responsibilities |

    |---||

    | Application Layer | Interacts with the application. Accepts commands and returns
    data. |

    | Presentation Layer | Settles data differences between client and server. Also
    responsible for data format. |

    | Session Layer | Manages network traffic flow. Determines whether data is being
    sent or received. |

    | Transport Layer | Handles interaction of the network processes on the source
    and destination. Error correction and detection occurs here. |

    | Network Layer | Delivers data between nodes. |

    | Data Link Layer | Maintains connection reliability and retransmission functionality.
    |

    | Physical Layer | Transmits electrical signals across the network. |'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# The Oracle Communications Stack


    The OSI model is the foundation of the Oracle communications stack architecture.
    Each of the layers of the Oracle communications stack has characteristics and
    responsibilities that are patterned after the OSI model. Oracle interacts with
    the underlying network at the very highest levels of the OSI model. In essence,
    it is positioned above the underlying network infrastructure and communicates
    with the underlying network.


    Oracle uses Net on the client and server to facilitate communications. The communications
    stack functions as a conduit to share and manage data between the client and server.
    The layers of Oracle communications stack are as follows:


    +   * The application (client) layer

    * The Oracle Call Interface (OCI) layer (client) or Oracle Program Interface (OPI)
    layer (server)

    * The Two-Task Common (TTC) layer

    * The Oracle Net Foundation layer

    * The Oracle Protocol Adapters (OPA) layer

    * The Network Specific Protocols layer

    * The Network Program Interface (NPI for server-to-server communications only)
    layer


    1.5 depicts the relationship of each of the layers of the stack on both the client
    and the server. The client process makes network calls that traverse down the
    Oracle Net client layers to the network protocol. The server receives the network
    request, processes it, and returns the results to the client.


    # The Application Layer (Client)


    The application layer of the Oracle communications stack provides the functionality
    as the Application Layer of the OSI model. This layer is responsible for interacting
    with the user, which involves providing the interface components, screen, and
    data control elements. Interfaces such as forms or menus are examples of the application
    layer. This layer communicates with the Oracle Call Interface (OCI) layer.'
  merge: -1
  img_proc: true
