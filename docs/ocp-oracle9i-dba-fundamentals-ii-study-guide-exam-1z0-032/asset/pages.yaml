    # Managing the Number of Dispatchers


    You can start additional dispatchers or remove dispatchers dynamically using the
    ALTER SYSTEM command. You can start any number of dispatchers up to the MAX_DISPATCHERS
    setting. Here is an example of adding three TCP/IP dispatchers to a system configured
    with two TCP/IP dispatchers:


    ```

    ALTER SYSTEM SET DISPATCHERS="PRO=TCP)(DIS=5)";

    ```


    Notice that you set the number to the total number of dispatchers you want, not
    the number of dispatchers you want to add.


    # MAX_DISPATCHERS Parameter


    Set this parameter to the maximum number of dispatchers you anticipate needing
    for the Oracle server. This number cannot be set dynamically. The maximum number
    of processes a dispatcher could run concurrently is operating system. Use the
    following formula to set this parameter:


    ```

    MAX_DISPATCHERS = (maximum number of concurrent sessions/

    connections per dispatcher)

    ```


    Here is an example of the parameter:


    ```

    MAX_DISPATCHERS = 5

    ```'
