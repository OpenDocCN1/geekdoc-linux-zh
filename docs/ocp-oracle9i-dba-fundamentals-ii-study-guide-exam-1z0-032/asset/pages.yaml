- pgno: 121
  md: '# Summary


    Listener is the main server-side component in the Oracle Net environment. Listener
    configuration information is stored in the listener.ora file, and the listener
    is managed by the lnrctl command line utility. The Oracle Net Manager provides
    a graphical interface for creating most of the Oracle Net files you use for including
    the listener.ora file. If multiple listeners are configured, each one will have
    a separate entry in the listener.ora file.


    Depending on the capabilities of the operating system, two types of dedicated
    server connections are possible: bequeath and redirect connections. Bequeath connections
    are possible if the operating system supports a direct handoff of connection information
    from one process to another. Redirect sessions are used when the operating system
    does not support this type of interprocess communication between the listener
    process, the server process, and the client process.


    Oracle9i provides a feature called Dynamic Registration of Services. This feature
    allows an Oracle instance to automatically register with a listener. The listener
    must be configured with TCP/IP and listen on Port 1521, or you must specify the
    parameter LOCAL_LISTENER in the init.ora file you have to set the parameters INSTANCE_NAME
    and SERVICE_NAMES in the init.ora file for the Oracle instance to enable Dynamic
    Registration.


    You can configure logging and tracing on the Oracle Server using Oracle Net Manager.
    Logging records significant events, such as starting and stopping the listener,
    along with certain kinds of network errors. Errors are generated in the log in
    the form of an error stack. Tracing records all events that occur even when an
    error does not happen. The trace file provides a great deal of information that
    logs do not. Tracing uses much more space than logging and can also have an impact
    on system performance. Enabling trace only if other methods of troubleshooting
    resolve the problem.


    Configuring the Oracle server correctly is the first step to successfully implementing
    Oracle in a network environment. If you do not have the Oracle server network
    components configured correctly, you will be unable to provide connection support
    to clients in the Oracle environment. The server network components should be
    configured and tested prior to moving on to configuring the Oracle clients as
    described in Chapter 3.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Exam Essentials


    Be able to define the main responsibilities of the Oracle listener. To fully understand
    the function of the Oracle listener, you should understand how the listener responds
    to client connection requests. In addition, you should know the difference between
    bequeath connections and redirect connections, and you should know under what
    circumstances the listener will use each. Also, you should be able to outline
    the steps involved in each of these connection types.


    Be able to define what the listener.ora file is and the ways in which the file
    is created. To understand the purpose of this file, you should know its default
    contents and how to make changes to it using the Oracle Net Manager tool. In addition,
    you should be able to define the different sections of the file and know the definitions
    of the optional parameters it contains. You should also understand the structure
    of the listener.ora file when one or more listeners are configured.


    Understand how to use the lnrctl command line utility. In order to start up and
    shut down the listener, you should know how to use the lnrctl command line utility.
    You will also need to be able to explain the command line options for the lnrctl
    utility, such as services, status and reload. When using this utility, you should
    also know the different options available to you and you should be able to define
    the various commands.


    Understand the concepts of static and dynamic service registration. Be able to
    define the difference between static service registration and dynamic service
    registration and know what the advantages are of using dynamic service registration
    over static service registration. Also, be aware of the situations in which you
    have to use static service registration. And lastly, be familiar with the init.ora
    parameters that you will need to set in order to enable dynamic service registration.


    Understand the basics of Oracle and Java connectivity. You should know the basics
    of configuring Oracle to enable connections to the Oracle9i JVM using IIOP and
    HTTP.'
  merge: -1
  img_proc: true
