- pgno: 207
  md: 'RAID is essentially fault tolerance that protects against individual disk crashes.
    There are multiple levels of RAID. RAID 0 implements disk striping without redundancy.
    RAID 1 is standard disk mirroring. RAID 2-5 offer some form of parity-checking
    on separate disks. RAID 5 has become the most popular in recent years, with many
    vendors offering their own enhancements to RAID 5 for increased performance. RAID
    0 +1 has a longtime fault-tolerance and performance for Oracle database configurations.
    This is due to redundancy protection and strong write performance. However, with
    the new RAID 5 enhancements (performed by some storage array vendors to include
    large caches or memory buffers), the write performance has improved substantially.
    RAID 0 +1 and RAID 5 both can be viable configurations for Oracle databases.


    # Undoing Changes to the Database


    There are three primary ways of undoing changes to the database; one is a manual
    approach, the other two use Oracle features to undo the data.


    +   - Manually—by reexecuting code or rebuilding tables

    - Using Oracle LogMiner to recover dropped objects

    - Using a new Oracle9 feature called Flashback Query


    Whether it is possible to undo changes to the database with the manual approach
    depends on the sophistication of the code releases and the configuration management
    control for the application in question.

    If the configuration control is highly structured with defined release schedules,
    undoing changes may not be necessary. A highly structured release schedule would
    reduce the possibility of data errors or dropped-objects.


    On the other hand, if the release schedule tends to be unstructured, the potential
    for data errors from developers can be higher. A good idea to prepare for these
    issues in a case. A full export can give the DBA a static copy of all the necessary
    objects within a database. Although exports have limitations, they can be useful
    for repairing data errors individual users and tables can be extracted from the
    export file. Additionally, individual tablespace backups can be performed more
    frequently on high-use tablespaces.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Oracle LogMiner was first introduced in Oracle8/8i. This utility rebuilds data
    from redo log-generated transactions. LogMiner allows you to rebuild erroneously
    dropped tables by performing a series of steps that building an external data
    dictionary and identifying the transactions that must be reloaded. LogMiner is
    run by Procedural Language SQL (PL/SQL) procedures to build the LogMiner utility.
    Table 5.1 describes the PL/SQL procedures involved with using LogMiner. The Data
    Manipulation Language (DML) can be seen in the v$logminer_contents table after
    the PL/SQL procedures are executed.


    # TABLE 5.1 LogMiner PL/SQL Procedures


    | PL/SQL Procedure | Purpose |

    |---|---|

    | sys.dbms_logmnr_d.build | Builds data dictionary |

    | dbms_logmnr.add_logfile | Accesses desired redo log file |

    | dbms_logmnr.start_logmnr | Begins using LogMiner session |


    Oracle Flashback Query is a new feature to Oracle9i. This feature allows a user
    to access past versions of dictionary tables. This feature works by generating
    a picture of data as it was in the past by using data. This is performed by identifying
    all data that has been modified since was created and retained against the retention
    policy. Then the corresponding data is retrieved.


    The Flashback Query is performed by executing the PL/SQL dbms_flashback package.
    Further, Automatic Undo Management must be enabled by setting the init.ora file
    for the UNDO_MANAGEMENT = AUTO parameter. There must also be an undo tablespace
    designated, as UNDO_TABLESPACE = UNDOTS. This must be set in the init.ora before
    the Flashback Query can be used. The parameter that controls the length of retention
    of the Flashback Query is called UNDO_RETENTION. This parameter may be set with
    UNDO_RETENTION = n with n being an integer value in seconds.


    > Flashback Query cannot query data that is greater than five days old. This is
    true if the UNDO_RETENTION parameter is set to a value greater than five days
    old.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Weighing the Costs


    Additional hardware is usually needed to perform adequate testing and failover
    for critical databases. When this additional hardware is unavailable, the risk
    of an unrecoverable database failure is greater.


    The cost of the additional hardware should be weighed against the cost of re-creating
    the lost data in the event of an unrecoverable database failure. This type of
    comparison will cause the management team to identify the steps necessary to manually
    re-create lost data, if this can be done.


    Once the steps for re-creating lost data are identified and the associated costs
    are determined, these costs can be compared to the cost of additional hardware.
    This additional hardware would be used for testing backups and as a system failover
    if a production server was severely damaged.


    # Testing a Backup and Recovery Plan


    One of the most important (but also overlooked) components of the recovery plan
    is testing. Testing should be done before and after the database that you are
    supporting in production. Testing validates that your backups are working, and
    gives you the peace of mind that recovery will work when a real disaster occurs.


    You should document and practice scenarios of types of failures that you are familiar
    with them, and you should make sure that the methods to recover from these types
    of failures are clearly defined. At a minimum, you should document and practice
    the following types of failures:


    +   * Loss of a system tablespace

    * Loss of a nonsystem tablespace

    * Loss of a current online redo log

    * Loss of the whole database


    Testing recovery should include recovering your database to another server, such
    as a test or development server. The cost of having additional servers available
    on which to perform testing can be intimidating for some businesses, and it can
    be one deterrent for adequate testing. Test servers are absolutely necessary,
    however, and businesses that fail to perform this requirement can be at risk of
    severe data loss or an unrecoverable situation.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Testing a Backup and Recovery Plan 167


    One way that you can test recovery is to create a new development or testing environment
    and recover the database to a development or test server in a new software release.
    Database copies are often necessary to support new releases of the database and
    application code prior to moving it to production. RMAN provides the DUPLICATE
    command in support of this. Manual OS tools in Unix, such as restore, tar, and
    cp from tape or copying from a disk staging area, are often used for scripted
    backups.


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_210_0.png)


    Real World Scenario

    Driving Adequate Testing with the Service Level Agreement

    Let''s look at this real-life example to determine how much testing is enough
    for recovery preparation.

    Many companies try to reduce implementation and support costs by not allocating
    sufficient resources for testing. In this particular case, a manufacturing company
    is trying to determine how much testing is enough to get by. Until this time,
    this company had performed all of its data processing on a mainframe-customized
    environment, so the customized Oracle environment is new to them. As a result,
    when the company switched to an Oracle-based environment, they did not set up
    a service level agreement with the information technology (IT) department that
    their database environment would be maintained properly.

    Because they lacked this service level agreement from customers of the database,
    they didn''t have the instrument to drive the testing, did they have the necessary
    resources to perform the testing. Their reasoning for this lack of resources was
    based on the premise that testing is a costly effort, and the results of it may
    never be needed. In this case, it was for the company to justify the expense of
    resources (IT staff and equipment) to perform testing. What this company was not
    aware of that, at a minimum, certain recovery tests should be performed to validate
    the backup process and to train the database administration staff for certain
    common failures.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Also, because there was no service agreement with the database customers, there
    was never a formalized testing strategy to support the recovery of the database.
    As a result, within one year after the company converted their manufacturing environment
    to a custom Oracle-based solution, there was an outage. As a result, the company
