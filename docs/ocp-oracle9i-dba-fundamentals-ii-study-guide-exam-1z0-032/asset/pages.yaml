    Oracle recommends the following space requirements for RMAN in tablespaces for
    one-year growth in the recovery catalog database: system tablespace, 90MB; rollback
    tablespace, 5MB; temp tablespace, 5MB; and the recovery catalog tablespace, 15MB.


    # Use RMAN Commands to Maintain the Recovery Catalog


    There are multiple RMAN commands that will help you maintain the recovery catalog:


    +   **CROSSCHECK** Identifies the differences between the catalog and the actual
    files on the media—either disk or tape.

    - **DELETE** Removes any file with which the LIST or CROSSCHECK command can operate.

    - **DELETE EXPIRED** Removes records of expired backups from the recovery catalog.

    - **DELETE INPUT** Used in conjunction with the BACKUP command in situations in
    which you have multiple archive destinations. If this is the case, then one archived
    log is copied and the other destinations are deleted.

    - **CHANGE/KEEP/NOKEEP** Alter the length of time you will keep a backup so that
    you can bypass a retention policy for a special backup.


    # Using RMAN to Register, Resynchronize, and Reset the Database


    There are three other RMAN commands that perform initial setup and configuration
    operations on the recovery catalog. Essentially, these commands'
