- pgno: 245
  md: '![](img/4d4ebf1b63c52ce2a364aa79830c39e0_245_0.png)


    Configuring an Oracle database for backup make it possible for recovery can be
    complex. At a minimum, you must understand the archive process, the initialization
    parameters associated with the archive process, the commands necessary to enable
    and disable archiving, the commands used to manually archive, and the process
    of initializing automated archiving. This chapter provides examples of the backup
    and recovery configuration process. After reading this chapter, you should be
    comfortable with this process.


    In Chapter 6, "Instance and Media Recovery Structures," you learned about the
    file and memory structures involved with Oracle backup and recovery. Two of these
    structures are covered in more detail within this chapter—specifically, the archiver
    process and the archived logs that this process generates.


    The archiver and archived logs are the key components you need for the backup
    and recovery process. Archived logs make it possible for a complete recovery to
    be conducted. In addition, the archiver or archivers are responsible for creating
    archived logs so that they are available in the event of a failure. It is important
    that you understand how to configure the database for archiving and you need to
    provide multiple copies of archived logs to reduce the damage caused by failure
    situations.


    # # Choosing ARCHIVELOG Mode or NOARCHIVELOG Mode


    One of the most fundamental backup and recovery decisions that a DBA will make
    is whether to operate the database in ARCHIVELOG mode or NOARCHIVELOG mode. As
    you learned earlier, the redo logs record all the transactions that have occurred
    in a database, and the archived logs are copies'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Choosing ARCHIVOGEL Mode or NOARCHIVOGEL Mode 203


    of redo logs. So, the archived logs contain the historical changes, transactions,
    that occur in the database. Operating in ARCHIVOGEL mode means the database will
    generate archived logs; operating in NOARCHIVOGEL mode means the database will
    not generate archived logs. This section discusses the differences between ARCHIVOGEL
    and NOARCHIVOGEL mode.


    # ARCHIVOGEL Mode


    In ARCHIVOGEL mode, the database generates archived log files from the redo logs.
    This means that the database makes copies of all the historical transactions that
    have occurred in the database. There are other characteristics of operating in
    ARCHIVOGEL mode:


    +   - Performing online (hot) backups is possible. This type of backup is done
    when the database is up and running. Therefore, a service outage is not necessary
    to perform a backup. The ALTER TABLESPACE <TABLESPACE_NAME> BEGIN backup command
    is issued to perform hot backups. After this command is issued, an OS copy can
    take place on each tablespace''s associated data files. When the OS copy is complete,
    an ALTER TABLESPACE <TABLESPACE_NAME> END backup command must be issued. These
    commands must be executed for every tablespace in the database.

    - A complete recovery can be performed. This is possible because the archived
    logs contain all the changes to the point of failure. All logs can be applied
    to a backup copy of the database (hot or cold backup). This would apply to all
    the transactions up to the time of failure. There would be no data loss or missing
    transactions.

    - Tablespaces can be taken offline immediately.

    - Increased disk space is required to store archived logs, and increased maintenance
    is associated with maintaining this disk space.


    # NOARCHIVOGEL Mode


    In NOARCHIVOGEL mode, the database does not generate archived logs from the redo
    logs. This means that the database is not storing any historical transactions
    from such logs. Instead, the redo logs are written over each other as needed by
    Oracle. As a result, the only transactions that can be'
  merge: -1
  img_proc: true
