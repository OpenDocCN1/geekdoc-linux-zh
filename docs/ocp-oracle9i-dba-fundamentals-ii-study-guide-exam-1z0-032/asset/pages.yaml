- pgno: 17
  md: '# Introduction


    exam. The electronic flashcards can be used on your Windows computer or on your
    Palm device.


    To learn all the material covered in this book, you''ll need to apply yourself
    regularly and with discipline. Try to set aside the same period every day to study,
    and select a comfortable and quiet place to do so. If you work hard, you will
    be surprised by how quickly you learn this material. All the best!


    # What''s with the CD?


    We have worked hard to provide some great tools to help you with your certification
    process. All of the following tools should be loaded on your workstation when
    you''re studying for the test.


    # The EdgeTest for Oracle Certified DBA Preparation Software


    Provided by EdgeTest Learning Systems, this test-preparation software prepares
    you to pass the Oracle9i Database: Fundamentals II exam. In this test, you will
    find all of the questions from the book, plus two additional Bonus Exams that
    appear exclusively on the CD. In addition, you can take the Assessment Test, test
    by chapter, or take an exam randomly generated from all of the questions.


    # Electronic Flashcards for PC and Palm Devices


    You should read the OCP: Oracle9i Database: Fundamentals II Study Guide carefully,
    particularly the Review Questions at the end of each chapter, and you should also
    take advantage of the Bonus Exams included on the CD. But wait, there is more!
    Be sure to test yourself with the flashcards included on the CD. If you get through
    these questions and you understand the answers, you''ll know that you''re ready
    for the exam.


    The flashcards include 150 questions specifically written to help you hard and
    make sure you are ready for the exam. Between the Review Questions, the Bonus
    Exams, and the flashcards, you should be prepared for the exam.


    # OCP: Oracle9i Database: Fundamentals II Study Guide in PDF


    Sybex is now offering the Oracle certification books on CD so that you can read
    the book on your PC or laptop. These exams appear in Adobe Acrobat for all the
    questions.'
