    # Check NAMES.DEFAULT_DOMAIN


    NAMES.DEFAULT_DOMAIN is another common error. It was more common in older releases
    of Oracle because the parameter defaulted to WORLD. Check the client sqlnet.ora
    file to see if the parameter is set. If the parameter has a value and you are
    using unqualified service names, the parameter value is appended to the end of
    the net service name. An unqualified service name is a service name that does
    not contain information.

    For example, if you entered Sqlplus matt/casey@PROD, and the NAMES.DEFAULT_DOMAIN
    was set to WORLD, Oracle would append WORLD to the net service name; as a result,
    Oracle will pass the command as sqlplus matt/casey@PROD.WORLD. You receive an
    ORA-12154 “Cannot Resolve Service Name” error if the service name should not include
    the .WORLD domain extension. Use this parameter only if you are using a hierarchical
    naming convention.


