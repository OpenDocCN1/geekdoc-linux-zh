    # Setting Automatic Archiving


    To configure a database for automatic archiving, you must perform a series of
    steps:


    +   1. Edit the init.ora file and set the LOG_ARCHIVE_START parameter to TRUE.
    This will automate the archiving of redo logs as they become full.

    2. Shut down the database and restart the database by using the command STARTUP
    MOUNT.

    3. Use the ALTER DATABASE ARCHIVELOG command to set ARCHIVELOG mode.

    4. Open the database with the ALTER DATABASE OPEN command.


    To verify that the database is actually archiving, you should execute the ALTER
    SYSTEM SWITCH LOGFILE command. After you execute check the OS directory specified
    by the parameter LOG_ARCHIVE_DEST to validate that archived log files are present.
    You can also execute the ARCHIVE LOG command to display information that confirms
    the database is in ARCHIVELOG mode and automatic archival is enabled.

    Now let''s walk through this process.'
