  img_proc: true
- pgno: 398
  md: 'You might need to perform incomplete database recovery for various reasons.
    The type of failure that requires such a recovery might be in the database, such
    as a corruption error or a dropped database object. This means recovery would
    need to stop short of using all the archived logs that are available to be applied.
    If it didn''t, the failure could be reundone from archived redo logs as the transactions
    were being read from archived redo logs.


    Another situation that might require an incomplete recovery is one in which your
    database lost the current redo log file. The reason this can only be solved with
    an incomplete recovery is because not all the previous transactions are available.
    At least one redo log file is corrupted or lost.


    The RMAN incomplete recovery process was also demonstrated with examples that
    used the SET UNTIL TIME and SEQUENCE commands.


    Incomplete recovery is a key component for certain types of failure; as a result,
    to be properly prepared for the test you must understand this concept. In the
    workplace you can use these concepts in routine maintenance activities like those
    in which you may be required to move databases from one server to another.


    # Exam Essentials


    Identify the types of user-managed incomplete recovery. The three different types
    of user-managed incomplete recovery are cancel-based, time-based, and change-based
    recovery. Make sure you understand all three types.


    Understand how to perform a user-managed incomplete recovery.

    You should know the commands that must be issued during the incomplete recovery
    process. These include RECOVER DATABASE UNTIL CANCEL/TIME/


    Know how to perform an incomplete recovery that results from a loss of redo logs.
    To do this, you must know how to stop the recovery process prior to the missing
    or corrupt redo log. This is the only way you can recover a database that has
    this type of failure.


    Understand how to use the RMAN UNTIL TIME command. In incomplete RMAN-based recovery,
    this command is used to stop the recovery prior to complete recovery based on
    a time of occurrence.'
  merge: -1
  img_proc: true
- pgno: 399
  md: 'Know when to use the RMAN UNTIL SEQUENCE command. This command is used in incomplete
    RMAN-based recovery to stop the recovery before it becomes a complete recovery
    based on a sequence number such as log sequence, sequence, or SCN.


    # Key Terms


    Before you take the exam, be certain you are familiar with the following terms:


    +   - cancel-based recovery

    - time-based recovery

    - change-based recovery

    - UNTIL CANCEL

    - incomplete recovery

    - UNTIL CHANGE

    - RESETLOGS

    - UNTIL TIME

    - system change number (SCN)

    - V$LOG_HISTORY'
