    **bequeath connection** A connection type in which control is passed directly
    to a dedicated spawned process or a dispatched process. No redirection is required.


    **block** The smallest unit of storage in an Oracle database. Data is stored in
    the database in blocks. The block size is defined at the time of database creation
    and is a multiple of the operating system block size.


    **block corruption** A block within the database that is corrupt.


    **bounded time recovery** Instance recovery that the DBA controls or bounds on
    the time it takes for an instance to recover after instance failure.'
