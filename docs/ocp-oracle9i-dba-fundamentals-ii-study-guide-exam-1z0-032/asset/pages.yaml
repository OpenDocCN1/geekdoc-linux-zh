  md: '![](img/4d4ebf1b63c52ce2a364aa79830c39e0_377_0.png)


    incomplete database recovery requires an understanding of the redo log and ARCHIVELOG
    processes, the synchronization of the Oracle data-base, and the options allowed
    for performing an incomplete recovery. This chapter discusses the incomplete recovery
    process and the commands associated with each incomplete recovery option. It also
    includes an example that shows how to perform an incomplete recovery due to lost
    or corrupted redo log files.


    In addition to the user-managed incomplete recovery, this chapter demonstrates
    how to use RMAN for this process. The RMAN examples covered include to use the
    SET UNTIL TIME and UNTIL SEQUENCE clauses.


    Incomplete recovery is the only method of recovery for certain types of failures.
    It is important that you understand when and how to use incomplete recovery methods.
    Anytime there is a failure that will cause you not to apply all the changes back
    to the databases, you will need to use one of the incomplete recovery methods
    that will be discussed in this chapter.


    # # Describing the User-Managed Incomplete Recovery


    Incomplete recovery occurs when the database is not recovered entirely to the
    point at which the database failed. This is a partial recovery of the database
    in which some archived logs are applied to the database, but not all of them.
    With this type of recovery, only a portion of the transactions get applied.


    +   - Cancel-based

    - Time-based

    - Change-based'
