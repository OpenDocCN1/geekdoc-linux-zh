    ```


    All other steps remain the same.


    # Change-Based Recovery


    In change-based recovery, you recover to a system change number (SCN) before the
    point of failure. This type of incomplete recovery gives you the most control.


    As you have already learned, the SCN is what Oracle uses to uniquely identify
    each committed transaction. The SCN is a number that orders the transactions consecutively
    in the redo logs as each transaction occurs. This number is also recorded in transaction
    tables within the rollback segments, control files, and data file headers. The
    SCN coordination between the transactions and these files synchronizes the database
    to a consistent state.


    Each log is associated with a low and high SCN number below. Notice the log and
    high SCN numbers in the FIRST_CHANGE# and NEXT_CHANGE# columns for each log sequence
    or log file.


    ```

    SQLWKS select sequence#,first_change#,next_change#,first_time

    ```


    ```

    2 from v$log_history where sequence# > 10326;

