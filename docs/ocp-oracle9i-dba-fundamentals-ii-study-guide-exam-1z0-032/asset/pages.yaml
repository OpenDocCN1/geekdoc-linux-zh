  md: 'In order to have bequeathed sessions supported on Windows NT/2000, the

    Registry setting USE_SHARED_SOCKET needs to be set. This setting can be set in

    HKEY_LOCAL_MACHINE > SOFTWARE > ORACLE > HOMEX where X is equal to the

    Home you are using, such as HOME0. By default, this Registry setting is not

