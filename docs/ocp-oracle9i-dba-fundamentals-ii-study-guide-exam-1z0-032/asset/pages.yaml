- pgno: 473
  md: '# Guidelines for Using Export and Import


    The guidelines for using the Export and Import utilities require that logical
    backup and recovery of the data is acceptable. Another way to look at this is,
    “Can the data that is being recovered from a point in time?”nWith exports, there
    is no way to roll forward as you can with a complete or an incomplete recovery.
    The data in the export is from the time the export was taken and cannot change.
    It is like a picture of data at a certain point in time.


    That being case, Export and Import utilities are not the best backup and recovery
    solutions available to you. These utilities function like supplements to a good
    physical backup strategy.


    Below is a list of the guidelines for using the Export and Import utility:


    +   - Data should be static. The data that is being exported should be consistent
    or it should not be in the process of being updated if at possible. If heavy DML
    activity is occurring during the export, the dump file will not be useful for
    recovery purposes.


    +   - There should be limited logical references to the tables. The tables should
    have limited referential integrity constraints. Complex referential integrity
    presents problems for the Export utility.


    +   - The data sets should be small to medium sized (with the exception of TSPITR).
    The Export and Import utilities are not the best choice for large data sets. These
    utilities can take long periods of time to export and import data.


    # Summary


    His chapter demonstrated the capabilities of the Oracle logical backup and recovery
    utilities: Export and Import. During the course of this chapter, you walked through
    the backup and recovery of a database object that used these tools. You learned
    how to display all the options available in the Export and Import utilities, and
    you saw an example of the direct-path export, which is significantly faster than
    the standard conventional-path export.'
  merge: -1
  img_proc: true
