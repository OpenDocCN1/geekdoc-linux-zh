- pgno: 227
  md: '# 184 Chapter 6 • Instance and Media Recovery Structures


    Redo logs contain values called system change numbers (SCNs) that uniquely identify
    each committed transaction in the database. SCNs are like a clock of events that
    have occurred in the database, and are one of the major synchronization elements
    in recovery. Each data-file header and control file is synchronized with the current
    SCN.


    # Archived Logs


    Archived logs are non-online redo logs that have been copied to a new location
    offset. This location is the value of the init.ora file''s LOG_ARCHIVE_DEST parameter.
    Archived logs are created if the database is in ARCHIVOG mode than NOARCHIVOG
    mode. A more detailed explanation of ARCHIVOG and NOARCHIVOG mode will come in
    Chapter 10, “User-Managed Complete Recovery and RMAN Complete Recovery.” As noted
    earlier, archived logs are also referred to as offline redo logs.


    An archived log is created when a online redo log is completed or filled, and
    before an online redo log needs to be written to. Remember, redo logs are written
    to a circular fashion. If there are only two redo sets and you are in ARCHIVOG
    mode, the LGWR may have to wait or halt the writing of information to redo logs
    while an archived log is being copied. If it doesn’t, the LGWR process would overwrite
    the information, making the archived log useless. If at least three redo groups
    are available, the archived log will have enough time to be created and not cause
    the LGWR to wait for an online redo log. This is under average transaction-intensive
    databases may have to 20 redo sets to reduce the contention on redo log availability.


    Archived logs are the copies of the online redo logs; the archived logs applied
    to the database in certain types of recovery. Archived logs build the historical
    transactions, or changes, back to the database to make it consistent to the desired
    recovery point.


    # Control Files


    A control file is a binary file that stores the information about the physical
    structures that make up the database. The physical structures are OS objects,
    such as all OS filenames. The control file also stores the SCN to assist in the
    recovery process. This file stores information about the backups if you are using
    RMAN, the database name, and the date the database was created.


    You should always have at least two control files on different disks. Having this
    duplication is called multiplexing your control files. Multiplexing control files
    is done in an init.ora file''s CONTROL_FILES parameter.


    Copyright©2002 SYBEX, Inc., Alameda, CA'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Oracle Recovery Processes, Memory Components, and File Structures


    Every time a database is mounted, the control file is accessed to identify the
    data files and redo logs that are needed for the database to function. All new
    physical changes to the database get recorded in the control file by default.


    # Data Files


    Data files are physical files stored on the file system. All Oracle databases
    have at least one data file, but usually more. Data files are where the physical
    and logical structures meet. Tablespaces are logical structures and are made up
    of one or more data files. All logical objects reside in tablespaces. Logical
    objects are those that do not exist outside the database, such as indexes, sequences,
    and views.


    Data files are made up of blocks. These data blocks are the smallest unit of measure
    in the database. The logical objects, such as tables and indexes, are stored in
    the data blocks, which reside in the data files.


    The first block of every file is called a header block. The header block of the
    data file contains information such as the file size, block size, and associated
    tablespace. It also contains the SCN for recovery purposes.


    Here is the output from the V$DATAFILE view, showing the data files that make
    up a sample database.


