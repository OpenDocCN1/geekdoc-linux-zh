    # Tuning the Shared Server Option


    Before tuning the Shared Server, you should examine the performance of the dispatchers
    and the shared server processes. You want to make sure that you have enough dispatchers
    so that clients are not waiting for dispatchers to respond to their requests,
    and you want to have enough shared server processes that requests are not waiting
    to be processed. You also want to configure the Large Pool SGA memory area. The
    Large Pool is used to store the UGA. The UGA takes the place of the PGA that is
    used for dedicated servers.


    The Large Pool is designed to allow the database to request large amounts of memory
    from a separate area of the SGA. Before the database had Large'
