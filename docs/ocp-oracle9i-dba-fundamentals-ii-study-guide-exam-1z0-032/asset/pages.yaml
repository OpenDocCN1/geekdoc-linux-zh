    # # Using Oracle Net Manager


    Oracle Net Manager is a tool you can use to create and manage most client- and
    server-side configuration files. The Oracle Net Manager has evolved from the Oracle7
    tool, Network Manager, to the latest Oracle9i version. Throughout this evolution,
    Oracle has continued to enhance the functionality and usability of the tool.


    We strongly recommend using the Oracle Net Manager to create and manage all of
    your network files. This is because these files need to be in a specific format,
    and the Oracle Net Manager ensures the files are created in that format. If the
    files are not in the correct format, you may have problems with your network connections.
    Something as subtle as an extra space or tab can cause problems with network connections,
    if you were used to cutting and pasting old entries to create new entries in these
    files, it is better now to use Oracle Net Manager to create new entries.


    If you are using a Windows NT/2000 environment, you can start the Oracle Net Manager
    by choosing Start ► Programs ► Your Oracle9i Programs choice ► Configuration and
    Migration Tools ► Oracle Net Manager. In a Unix environment, you can start it
    by running ./netmgr from your $ORACLE_HOME/bin directory.


