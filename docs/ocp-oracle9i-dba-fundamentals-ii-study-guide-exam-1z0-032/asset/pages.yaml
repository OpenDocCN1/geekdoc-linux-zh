    # Describe Read-Only Tablespace Recovery


    There are three scenarios that can occur with read-only tablespace recovery. These
    are as follows:


    +   - Read-only backup and read-only recovery

    - Read-only backup and read-write recovery

    - Read-write backup and read-only recovery


    The first scenario is the most straightforward because no recovery is needed.
    The SCN does not change because the tablespace is read-only. In this type of recovery,
    the only activity you need to do is restore the data files associated with the
    read-only tablespaces; thus no archived logs need to be applied. The second scenario
    will require a more complex recovery process because the tablespace is being recovered
    to a read-write state in which the SCN number has changed or transactions have
    been made in the tablespace.'
