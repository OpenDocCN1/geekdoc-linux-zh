- pgno: 165
  md: '![](img/4d4ebf1b63c52ce2a364aa79830c39e0_165_0.png)


    As the number of users connecting to Oracle services in the enterprise grows,
    the system requirements of the servers increase—particularly the memory and process
    requirements. This chapter discusses the Oracle Shared Server option (formerly
    known as Oracle Multithreaded Server) and its benefits. In addition, you will
    learn the steps of the connection process, how to configure the Shared Server
    option, and how user requests are processed in a shared server configuration.
    You will also learn how to manage the shared server environment using various
    Oracle data views and how to configure clients to request dedicated connections
    when you are connecting to an Oracle database configured with Shared Server. You
    will learn where to find information to assist you in tuning the Shared Server.


    It is important for the database administrator to understand the Oracle Shared
    Server architecture and how and when it is appropriate to utilize this feature.
    When used properly, this feature can help alleviate problems with servers that
    are being taxed in terms of the number of processes running on the server. When
    the Shared Server is configured properly, it can help save off system upgrades
    that may have seemed imminent, thus saving the organization time and money.


    # # Shared Server Configuration


    Shared Server is an optional configuration of the Oracle server that allows the
    server to support a larger number of concurrent connections without increasing
    physical resource requirements. This is accomplished by sharing resources among
    groups of users.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Shared Server Configuration 123


    # Dedicated Server versus Shared Server


    If you have ever gone to a upscale restaurant, you may have had your own personal
    waiter. The waiter is there to greet you and escort you to your seat. The waiter
    will take your order for food and drinks and even help in the preparation of your
    order. No matter how many patrons enter the restaurant, your waiter is responsible
    for serving only your requests. Therefore, your service is very consistent—if
    the person is a good waiter.


    A dedicated server environment works in much the same. Every client connection
    has an dedicated server process on the machine where the Oracle server exists.
    No matter how many connections are made to the server, you always have the same
    server responsible for processing only your requests. You utilize the services
    of that server process until you disconnect from the Oracle server.


    Most restaurants tend to be more shared servers. When you walk in, you are assigned
    a waiter or waitress, but they may have many tables they are responsible for serving.
    This is good for the restaurant because they can serve more customers without
    increasing the staff. It may be for you as well, if the waiter is not too busy
    and the waitress is not responsible for too many tables. Also, if most of the
    orders are small, the staff can keep up with the requests and the service will
    be as good as if you had your own personal waiter.


    In the diner, things work slightly differently; the waitress takes your order
    and places it on a turnstile. If the diner has multiple copies, the order is picked
    up from the turnstile and prepared by one of the available cooks. When the cook
    completes the preparation of the dinner, it is placed in a location where the
    waiter can pick it up and bring it back to your table.


    This is how a shared server works. In a shared server environment, clients share
    processes on the Oracle server. These shared processes are called dispatchers.
    Dispatchers are like the waiter or waitress in the diner. A dispatcher can be
    responsible for taking the orders of many clients.


    When you request something from the server, it is the dispatcher''s responsibility
    to take your request and place it in a location called a request queue. The request
    queue functions like the turnstile in the diner analogy. There is one request
    queue where all of the dispatcher places their client requests. The request queue
    is a structure contained in the System Global Area (SGA).


    Shared server processes, like cooks in a diner, are responsible for fulfilling
    the client requests. The shared server process executes the request and makes


