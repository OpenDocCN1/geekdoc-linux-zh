    # Real World Scenario


    # The Mysterious Timeout Problem


    I used tnsping to help troubleshoot some very interesting connection problems.
    One such problem involved a client who was experiencing intermittent connection
    timeouts. Sometimes the client could connect, but others times the client received
    a timeout error. The client reported that it always took an inordinate amount
    of time to log in to the Oracle server.


    This problematic client machine happened to be sitting adjacent to another client
    machine that had no connection or timeout whatsoever. I ran some connection tests
    with tnsping and discovered that the client having problems on average 3000 milliseconds
    to connect to the listener while the other client took only 30 milliseconds. Both
    clients were using the same network routes to connect to the server.


    After further investigation, I discovered the machines were using different implementations
    of TCP/IP. This was causing the intermittent timeout problems. With the help of
    the tnsping utility, I was able to narrow down the problem to a difference in
    the client machine configurations.


    # Verify Localnaming Configuration Files


    If the client is using the localnaming method for service name resolution, check
    the entries in the tnsnames.ora file. Make sure the entries are syntactically
    correct and that there is an entry for the net service name. Also make sure the
    protocol is correct.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Look for Multiple Client Network Configuration Files


