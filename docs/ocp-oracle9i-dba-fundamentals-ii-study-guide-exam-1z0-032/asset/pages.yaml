- pgno: 176
  md: '# SHARED_SERVERS Parameter


    This parameter specifies the number of shared servers to start when the Oracle
    instance is started. This parameter can be altered dynamically with the ALTER
    SYSTEM command. You must set this parameter to at 1 for Oracle use shared server
    connections. A setting of 0 or no setting means shared servers will not be used.
    This parameter can be changed dynamically, so if shared servers are not configured
    when the instance starts, they can be configured without restarting the Oracle
    instance and restarting.


    The number of servers necessary will vary depending on the type of activities
    your users are performing. Generally, for the types of high think applications
    that will be using shared server connections, 15 to 20 connections per server
    should be adequate. If your users are going to require larger result sets or are
    doing more intensive processing, then you will want to reduce this ratio.


    ```

    SERVERS = 3

    ```


    # SHARED_SERVER_SESSIONS Parameter


    This parameter specifies the total number of shared server sessions that are allowable
    for the Oracle instance. This parameter is derived from the lesser of CIRCUITS
    or SESSIONS — 5. For example if CIRCUITS is set to 10 and SESSIONS is set to 20,
    then SHARED_SERVER_SESSIONS would be equal to 10 because this is the lesser of
    the 2 values. This is a derived value and will not be set in the initora file
    manually.


    # Managing the Number of Shared Servers


    You can start additional shared servers or reduce the number of shared servers
    dynamically using the ALTER SYSTEM command. You can start any number of shared
    servers up to the MAX_SERVERS setting. Here is an example of adding three additional
    shared servers to a system initially configured with two shared servers:


    ```

    ALTER SYSTEM SET SHARED_SERVERS = 5;

    ```


    Notice that you set the number to the total number of shared servers you want,
    not the number of shared servers you want to add.'
