    # The Oracle Protocol Adapters (OPA) Layer


    The Oracle Protocol Adapters (OPA) layer interfaces with the underlying network.
    This becomes the entry point into the underlying network. This layer maps the
    Oracle Net Foundation layer to the underlying functions in the underlying protocol.
    There are different adapters for each protocol supported. This layer, in conjunction
    with the Network Specific Protocol layer, is analogous to the Network Layer in
    the OSI model.


    # The Network Specific Protocol Layer


    This is the actual transport layer that carries the information from the client
    to the server. Some of the protocols supported by Oracle include TCP/IP, and DCNet.
    These protocols are not supplied with the Oracle software and must be in place
    to facilitate network communications.


    # The Oracle Program Interface (OPI) Layer (Server Only)


    For every request made from the client, the Oracle Program Interface layer is
    responsible for sending the appropriate response. When clients issue SQL statements
    requesting data from the database, the OPI interface fulfils that request. In
    server-to-server communication, the Network Program Interface (NPI) is used instead
    of the OPI.


    # The Network Program Interface (NPI) Layer (Server Only)


    The Network Program Interface (NPI) layer is found only on the Oracle server.
    It is analogous to the OCI on the client. This layer is responsible for server-to-server
    communications, whereas the OPI is used in client-server communications and is
    used in distributed environments where databases communicate with each other across
    database links. This layer is analogous to the Presentation Layer of the OSI model,
    but from the server perspective.


