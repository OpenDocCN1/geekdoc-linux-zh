- pgno: 212
  md: 'Exam Essentials 169


    understanding of the types of failures or problems that could cause you to recover
    a database. Without understanding the importance and appropriate course of action
    to take for certain failures, significant time or mis-takes occur. Making sure
    the database is open and available for use is one of the most important responsibilities
    of the DBA.


    # Exam Essentials


    Identify the failure categories. Make sure you are aware of non-media and media
    failures. A media failure is more serious because it is a hard-ware failure or
    corruption, and it will prevent the user from reading or writing to a database
    file. A non-media failure is usually less serious recovering from this type of
    failure is usually easy.


    Identify the different types of non-media failure. The four failure types are
    statement failure, process failure, instance failure, and user error. You should
    be aware of how each of these failures are initiated.


    Understand the multiple ways to undo user errors. Identify the three ways to undo
    user errors in the database. Undoing user errors is performed manually (rebuilding
    lost code or data, or importing objects), by using Log-Miner to restore transactions
    from archived log files, and by using the Flashback Query to query data based
    on the undo information.


    Understand the media recovery process. The media recovery process includes restoring
    physical database files that are impacted by media failure and applying archived
    logs to roll the restored files to a determined point in time.


    Understand the difference between user-managed and RMAN backups and recovery.
    A traditional, user-managed backup and recovery is custom-ized in an OS scripting
    language so that it can call database commands and perform OS commands. A RMAN
    backup and recovery is created by using the RMAN utility.


    Identify the requirements for a backup and recovery strategy. Be able to understand
    the general concept of a backup and recovery strategy so that you are aware of
    the unique planning required to recover a database to meet your customers'' requirements.


