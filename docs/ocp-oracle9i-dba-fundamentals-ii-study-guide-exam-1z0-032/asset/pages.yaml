    # Storing Information Using the RMAN Repository and Control Files


    The RMAN utility uses two methods to store information about the target databases
    that are backed up. Each method is called the RMAN repository. When RMAN uses
    the first method, it accesses an optimal RMAN catalog or recovery catalog of information
    about backups. In the second method, it accesses the necessary information about
    backups in the target database''s control file. If the optimal recovery catalog
    database is not used, then the target database''s control file will be used as
    the RMAN repository. The information that RMAN needs to function in the recovery
    catalog database'
  merge: -1
