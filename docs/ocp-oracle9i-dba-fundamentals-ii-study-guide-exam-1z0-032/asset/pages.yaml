- pgno: 57
  md: '# Security: Advanced Security


    The threat of data tampering is becoming an issue of increasing concern to many
    organizations as network systems continue to grow in number and complexity and
    as users gain increasing access to systems. Sensitive business transactions are
    being conducted with greater frequency and, in many cases, are not protected by
    unauthorized tampering or message interception.


    Oracle Advanced Security, formerly known as the Advanced Security Option and the
    Advanced Networking Option, not only provides the tools necessary to ensure secure
    transmissions of sensitive information, but it also provides mechanisms to confidently
    identify and authenticate users in the Oracle enterprise.


    When configured on the client and the Oracle server, Oracle Advanced Security
    supports secure data transactions by encrypting and optionally checksuming the
    transmission of information that is sent in a transaction. Oracle supports encryption
    and checksuming by taking advantage of industry-standard algorithms, such as RSA
    RC4, Standard DES and Triple DES, and MD5 checksuming. These security features
    ensure that data transmitted from the client has not been altered during transmission
    to the Oracle server.


    Oracle Advanced Security gives the database administrator ability to authenticate
    users connecting to the Oracle servers. In fact, there are a number of authentication
    features for ensuring that users are really who claim to be. These are offered
    in the form of token cards, which use a physical card and a user identifying PIN
    number to gain access to the system; the biometrics option, which uses fingerprint
    technology to authenticate user connection requests; Public Key; and certificate-based
    authentication.


    Another feature of Oracle Advanced Security is the ability to have a single sign-on
    for clients. Single sign-on is optimized with a centralized security server that
    allows the user to connect to any of the Oracle services in the enterprise using
    a single user ID and password. Oracle leverages the industry-standard features
    of Kerberos to enable these capabilities. (Kerberos is an authentication mechanism
    based on the sharing of secrets between two systems). This greatly simplifies
    the privilege management that administrators must manage when they are dealing
    with large numbers of users and systems.


    # Security: Firewall Support


    Firewalls have become an important security mechanism in corporate networks. Firewalls
    are generally a combination of hardware and software that'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 14 Chapter 1 • Introduction to Network Administration


    are used to control network traffic and prevent intruders from compromising corporate
    network security. Firewalls fall into two broad categories:


    **IP-filtering firewalls** IP-filtering firewalls monitor the network packet traffic
    on IP networks and filter out packets that either originated or did not originate
    from specific groups of machines. The information contained in the IP packet header
    is interrogated to obtain this information. Vendors of this type of include Network
    Associates Associates Axent Communications.


    **Proxy-based firewalls** Proxy-based firewalls prevent information from outside
    the firewall from flowing directly into the corporate network. Instead, the firewall
    acts as a gateway, inspecting packets and sending only the appropriate information
    through to the corporate network. This prevents any direct communication between
    clients outside the firewall and applications inside the firewall. Check Point
    Software Technologies and Cisco are examples of vendors that market proxy-based
    firewalls.


    Oracle works closely with the vendors of both types of product to ensure support
    of database traffic through these types of mechanism. Oracle supplies the Oracle
    Net Application Proxy Kit to the vendors of firewalls. This product can be incorporated
    into the firewall architecture to allow database packets to pass through the firewall
    and still maintain a high degree of security.


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_58_0.png)


    > It is important to understand your network infrastructure, the network routes
    you are using to obtain database connections, and the type of firewall products
    you are using. I have more than one situation in which firewalls have caused connectivity
    issues between a client and an Oracle server.


    For instance, I remember what happened after a small patch was applied to a firewall
    when I was working as a DBA for one of my former employers. In this case, employees
    started experiencing intermittent disconnects from the Oracle database. It took
    many days of investigation and network tracing before we pinned down the exact
    problem. When we did, we contacted the firewall vendor and they sent us a new
    patch to apply that corrected the problem.'
  merge: -1
  img_proc: true
