- pgno: 299
  md: "# Performing Closed and Opened Database Backups 257\n\nthe closed backup just\
    \ makes a copy of all the necessary physical files that make up the database;\
    \ these include the data files, online redo logs, control files, and parameter\
    \ files.\n\nThe opened backup is also executed by issuing OS commands. These commands\
    \ are issued between an ALTER TABLESPACE <TABLESPACE_NAME> BEGIN BACKUP command\
    \ and an ALTER TABLESPACE <TABLESPACE_NAME> END BACKUP command. The opened backup\
    \ requires only a copy of the data files. The ALTER TABLESPACE <TABLESPACE_NAME>\
    \ BEGIN BACKUP causes a checkpoint to the data file or data files in the tablespace.\
    \ This causes all dirty blocks to be written to the data file, and the data-file\
    \ header is stamped with the SCN consistent with those data blocks. In the data\
    \ file from Manipulation Language (DML), as INSERT, UPDATE, and DELETE statements,\
    \ recorded in the data files and redo logs in almost the same way as normal database\
    \ operations. However, the data-file header does not get updated until the ALTER\
    \ TABLESPACE <TABLESPACE_NAME> END BACKUP command gets executed and checkpoint\
    \ occurs. To distinguish which blocks are needed in a recovery situation, Oracle\
    \ writes more information in the redo logs during the period that the ALTER TABLESPACE\
    \ <TABLESPACE_NAME> BEGIN BACKUP command is executed.\n\nThis is one reason why\
    \ data files are fundamentally different from other Oracle database files, as\
    \ redo logs, control files, and init.ora files are, when it comes to backups.\
    \ Redo logs, control files, and init.ora files are copied with standard OS commands\
    \ without performing any preparatory steps such as the ALTER TABLESPACE <TABLESPACE_NAME>\
    \ commands. This is completely true in the Unix environment. Is partially true\
    \ in the Windows NT/2000/XP environment because of the locking that is performed\
    \ on open files.\n\n![](img/4d4ebf1b63c52ce2a364aa79830c39e0_299_0.png)\n\nEven\
    \ hot backups can be performed at any time when the database is opened, it is\
