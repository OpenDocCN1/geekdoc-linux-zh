  md: '# Chapter 4 • Configuring the Shared Server Option


    Pool design, memory allocations for Shared Server came from the Shared Pool. This
    caused Shared Server to compete with other processes updating information in the
    Shared Pool. The Large Pool alleviates the memory burden on the Shared Pool and
    enhances performance of the Shared Pool.


    # Configure the Large Pool


    You can configure the Large Pool by setting the parameter LARGE_POOL_SIZE in the
    init_ora file. This parameter can be set to a minimum of 300KB and a maximum of
    at least 2GB; the maximum setting is operating system dependent. When a default
    value is used, Oracle adds 250KB per session for each shared server if the DISPATCHERS
    parameter is specified. If you do not configure a Large Pool, Oracle will use
    the UGA into the Shared Pool. Because of this, you should configure a Large Pool
    when using Shared Server so that you don''t affect the performance of the Shared
    Pool. Here is an example of setting the LARGE_POOL_SIZE parameter in the init_ora
    file:


    ```

    LARGE_POOL_SIZE = 5M

    ```


    You can see how much space is being used by the Large Pool by querying the V$SGASTAT.
    The free memory shows the amount available in the Large Pool and the session heap
    row the amount of space used in the Large Pool. Here is a listing that shows an
    example of the:


    ```

