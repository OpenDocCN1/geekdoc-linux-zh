    # # How Do Listeners Respond to Connection Requests?


    There are several ways a listener can respond to a client request for a connection.
    The response is dependent on several factors, such as how the server-side network
    components are configured and what type of connection the client is requesting.
    The listener will respond to the connection in one of two ways.


    The listener can spawn a new process and pass control of the client session to
    the process. In a dedicated server environment, every client connection is serviced
    by its own server-side process. Server-side processes are not shared among clients.
    Depending on the capabilities of the operating system, two types of dedicated
    server connections are possible: bequeath connections and redirect connections.
    Each results in a separate process that handles processing, but the mechanics
    of the actual connection initiation process are different.


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_82_0.png)


    As of Oracle9i, prespawned dedicated processes are no longer supported.


    # # Bequeath Connections


    Bequeath connections are possible when the underlying operating system, such as
    Unix, supports the inheritance of network endpoints. What this means is that the
    operating system has the ability to spawn a new process and pass information to
    this process; this allows the operating system server process to initiate a conversation
    with the client immediately.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Another name for bequeat connections is direct hand-off connections.


    The following steps, which show the connection process for the bequeat connections,
    are exhibited in Figure 2.1:


    +   1. The client contacts the Oracle server after resolving the service name.


    +   2. The server spawns a dedicated process and bequeats control of the connection
    to the process. The new process inherits all information of the spawned process,
    including the TCP/IP socket information from the server that spawned the process.


    +   3. The server process notifies the client to start sending information to
    it by sending a RESEND packet to the client.


    +   4. The client sends a CONNECT packet to the newly established process.


    +   5. The server responds back with an ACCEPT packet and now manages the client
    requests.


    # FIGURE 2.1 Bequeat connection process


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_83_0.png)'
  merge: -1
  img_proc: true
