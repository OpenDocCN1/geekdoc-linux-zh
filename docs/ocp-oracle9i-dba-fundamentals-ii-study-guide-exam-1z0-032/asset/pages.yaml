    # Troubleshooting Shared Server Startup Problems


    If you have problems starting the instance, chances that you have a problem with
    one of the Oracle Net files. If you receive an error that states the DISPATCHERS
    parameter is incorrect, make a backup of all your Oracle Net files, such as tnsnames.ora
    and listener.ora, and re-create these files using the Oracle Net Manager. Most
    people we have experienced with the Shared Server can be traced back to modifications
    to these files without using Oracle Net Manager. Even cutting and pasting information
    to create new service definitions can cause problems. After you have re-created
    your files, try to restart your instance.


