  md: '# Using RMAN to Register, Resynchronize, and Reset the Database 397


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_437_0.png)


    # Real World Scenario


    # Making Sure a New Incarnation Is Recognized


    You have just moved a monthly refresh of the production database to the test server.
    This is a typical process that a lot of organizations follow so that the developers
    have fresh data with which to develop new code. The database will be named “test,”
    which is the same name as that of the previous database on the test server.


    After the new copy of the test database is operational, you need to make sure
    that the database is backed up so that none of the developers'' work is lost.
    To do this, you initiate the RMAN backup script for the test database and find
    that the database cannot be found in the recovery catalog, even though the name
    and physical structure of the database is the same as it before you performed
    the refresh.


    The RMAN catalog recognizes that this test database “test” is a new incarnation
    and that it is uniquely identified in the recovery catalog. This is because this
    database was opened with the RESETLOGS option. This database must be reset with
    the RESET command so that it can be properly recognized as a new incarnation in
    the recovery catalog. At this point, you can see the difference between the recovery
    catalog of the old test database and the one of the new test database that was
    refreshed. As a result, the recovery catalog backup information will not be confused
    between these.


    # Resynchronizing the Recovery Catalog


    Resynchronizing the recovery catalog enables RMAN to compare the file of the target
    database to the information stored in the recovery catalog and to update the recovery
    catalog appropriately. A partial resynchronization does not update the recovery
    catalog with any physical information, such as data files, tablespaces, and redo
    logs. A full resynchronization captures all the previously mentioned physical
    information plus the changed records. This process also occurs when a backup takes
    place.'
  merge: -1
  img_proc: true
