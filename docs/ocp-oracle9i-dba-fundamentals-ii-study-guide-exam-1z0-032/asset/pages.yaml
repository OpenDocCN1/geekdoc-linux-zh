- pgno: 429
  md: '# Considerations for Using the Recovery Catalog 389


    # Considerations for Using the Recovery Catalog


    Your decision to use the recovery catalog is one of the most significant decisions
    you make when you are using RMAN. The recovery catalog provides many more backup
    and recovery functions than using the target database''s control file as the RMAN
    repository. For this reason, when you are using RMAN, Oracle recommends that you
    use the recovery catalog whenever possible.


    The main considerations regarding the use of the recovery catalog are as follows:


    +   - Some functionality is not supported unless the recovery catalog exists.

    - You should create a separate database

    - You must administer the catalog database like any other database in areas such
    as data growth and stored database objects as scripts.

    - You must back up the catalog.

    - You must determine whether you will keep each target database in a separate
    recovery catalog within a database.


    Oracle recommends that you use the recovery catalog unless the process of maintaining
    and creating the catalog database requires too many resources for a site. ( site
    that has an experienced and qualified DBA and system administrator should be able
    to maintain and create the catalog database.) If the database is small and not
    critical, however, using RMAN without the recovery catalog is acceptable and has
    been improved from previous Oracle versions.


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_429_0.png)


    You should store the recovery catalog on a separate server and filesystem the
    one on which you store the target databases is responsible for backing up. This
    prevents failures on the target database server and filesystem from affecting
    the recovery catalog for backup and recovery purposes.


    Figure 13.1 shows the recovery catalog''s association with the whole RMAN backup
    process.'
  merge: -1
  img_proc: true
- pgno: 430
  md: '# FIGURE 13.1 RMAN utility interacting with the recovery catalog


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_430_0.png)


    # The Components of Recovery Catalog


    The main components of the RMAN recovery catalog support the logging of the backup
    and recovery information in the catalog. This information is stored within tables,
    views, and other databases objects within an Oracle database. Backups are compressed
    for optimal storage.


    Here is a list of the components contained in a recovery catalog:


    +   * Backup and recovery information that is logged for long-term use from the
    target databases

    * RMAN scripts that can be stored and reused

    * Backup information about data files and archived logs

    * Information about the physical makeup, or schema, of the target database'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# Creating a Recovery Catalog


    As noted earlier, the recovery catalog is an optional feature of RMAN. The catalog
    is similar to the standard database catalog, in that it stores information about
    the recovery process as the database catalog stores information about the database.


    RMAN can be run without the catalog. For this reason, the recovery catalog must
    be stored in its own database, preferably on a server other than the target database
    resides. To enable this, an account with CONNECT_RESOURCE, and RECOVERY_CATALOG_OWNER
    privileges must be created to hold the catalog tables. After this is done, the
    catalog creation script must be executed as the database user RMAN connected to
    the RMAN utility.


    Let''s walk through the steps to create the recovery catalog. This example assumes
    you have built a database rcat in which you plan to store the recovery catalog.


    +   1. First, you must select the database where the recovery catalog will reside.
    This is not the target database. In this case, your RMAN database is being called
    rcat. In this situation, you will use the oraenv script (provided by Oracle) to
    switch to other databases on the same server.


    ```

    oracle@octilli:/oracle/product/9.0.1/bin > oraenv

    orACLE_SID = [rcat] ?

    oracle@octilli:/oracle/product/9.0.1/bin >

    ```


    After you have completed the preceding step, you will need to create the user
    that will store the catalog. To do this, use the name RMAN with the password RMAN.
    Make DATA the default tablespace and TEMP the temporary tablespace.


    ```

    oracle@octilli:~ > sqlplus /nolog

    ```


