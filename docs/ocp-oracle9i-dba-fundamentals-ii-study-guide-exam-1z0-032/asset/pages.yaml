- pgno: 168
  md: '# Advantages of Shared Server


    A shared server is used in situations where server resources, such as memory and
    active processes, become constrained. People tend to throw more hardware-at problems
    like these; this will likely remedy the problem, but it may be an unnecessary
    expense.


    If your system is experiencing these problems, Shared Server allows you to support
    the same or greater number of connections without additional hardware requirements.
    As a result, Shared Servers tend to decrease the overall memory and process requirements
    on the server.


    An average dedicated connection takes roughly two to four megabytes of memory.
    A shared server connection takes about two megabytes of memory. As you can see,
    there will be some overall memory reduction. Also, because clients are sharing
    processes, the total number of processes is reduced. These translate into resource
    savings on the server.


    Shared Server is also required to take advantage of network options, such as connection
    concentration when using Oracle Connection Manager.


    # Applications Suited to Shared Server


    Shared Server is suitable for “high think” applications. High think applications
    are comprised of small transactions with natural pauses in the transaction patterns.
    These types of applications are good candidates for shared server connections.
    An example of a high think application would be an order entry system. Order entry
    systems tend to have small transactions with natural pauses in the work pattern
    of entering the information.


    # Drawbacks of Shared Server


    Applications that generate a significant amount of network traffic or result in
    large result sets are not good candidates for shared server connections. The of
    the diner analogy from the previous discussion. Your service is fine until two
    parties of 12 people show up. All of a sudden, the waitress is overwhelmed with
    work from these two other tables and your service begins to suffer. The same thing
    would happen in a shared server environment. If requests for large quantities
    of information start going to the dispatchers, the dispatchers can become overwhelmed
    by these large requests, and you may see performance suffer for the other clients
    connected to the dispatcher. This, in turn, will'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 126 Chapter 4 • Configuring the Shared Server Option


    increase your response times. Dedicated processes better serve these types of
    applications.


    There are some functions that are not allowed when you are using a shared server
    connection. You cannot start up, shut down, or perform certain kinds of recovery
    of an Oracle server when you are connected via a shared server.


    # Scalability versus Performance


    Shared Server is a scalability enhancement option, not a performance enhancement
    option. If you are looking for an increase of performance, Shared Server is not
    what you are figuring. Only use Shared Server if you are experiencing the system
    constraint problems discussed earlier. You will always have equal or better performance
    in a dedicated server environment.


    # Oracle Server Changes in a Shared Server Environment


    When Shared Server is configured, Oracle adds two new types of structures to the
    SGA: request queues and response queues. These structures do not exist in a dedicated
    server environment. There is one request queue for all dispatchers but each dispatcher
    has its own response queue. If you have four dispatchers, there would be one request
    queue and four response queues. The request queue is a location in the SGA where
    the dispatcher places client requests. A shared server process executes each request,
