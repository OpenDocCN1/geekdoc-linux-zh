- pgno: 255
  md: '> But if the archive process doesn''t have enough disk space to write archived
    logs, the database will hang or stop all activity. This hung state will remain
    until you make more space available by moving older archived logs off your system,
    compressing log files, or by setting up an automated job that will remove logs
    after they have been written to tape. You must be careful not to misplace or delete
    archived logs when trying to free up space for the archive process. Remember these
    archived logs could be required in a recovery situation.


    # # Manually Archiving Logs


    The manual archiving of logs consists of enabling the database for ARCHIVLOG mode
    and then manually executing the ARCHIVE LOG ALL command from SQL. The init .ora
    parameter LOG_ARCHIVE_START must be set to FALSE to disable automatic archival.
    The next step is to put the database in ARCHIVLOG mode by performing the following
    commands:


    ```

    SQL> shutdown

    SQL> startup mount

    SQL> alter database archivel;

    SQL> alter database open;

    ```


    Now you are ready to perform manual archiving of redo logs by using


    ```

    SQL> archive log all;

    ```


    or


    ```

    SQL> archive log next;

    ```


    The ARCHIVE LOG ALL command will archive all redo logs available for archiving,
    and the ARCHIVE LOG NEXT command will archive the next group of redo logs.'
