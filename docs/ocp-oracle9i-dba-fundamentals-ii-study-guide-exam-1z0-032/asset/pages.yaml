    # Accessibility: Heterogeneous Services


    Heterogeneous Services provide the ability to communicate with non-Oracle databases
    and services. These services allow organizations to leverage and interact with
    their existing data stores without having to necessarily move the data to an Oracle
    server.


    The suite of Heterogeneous Services comprised of the Oracle Transparent Gateway
    and Generic Connectivity. These products allow Oracle to communicate with non-Oracle
    data sources in a seamless configuration. Heterogeneous Services also integrate
    existing systems with the Oracle environment, which allows you to leverage your
    investment in these systems. These services also allow for two-way communication
    and replication from Oracle data sources to non-Oracle data sources.


    Transparent Gateway The Transparent Gateway seamlessly extends the reach of Oracle
    to non-Oracle data stores, which allows you to treat non-Oracle data sources as
    if they were part of the Oracle environment. In fact, the user is not aware that
    the data is coming from a non-Oracle source. This can significantly reduce the
    time and investment necessary to transition from existing systems to the Oracle
    environment. Transparent Gateway fully supports SQL and the Oracle transaction
    control features, and it currently supports access to more than 30 non-Oracle
    data sources.


    Generic Connectivity Generic Connectivity provides a set of agents, which contain
    basic connectivity capabilities. It also provides a foundation so that you can
    custom build connectivity solutions using standard'
