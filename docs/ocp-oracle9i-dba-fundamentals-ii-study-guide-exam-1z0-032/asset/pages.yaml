  md: '![](img/4d4ebf1b63c52ce2a364aa79830c39e0_328_0.png)


    n this chapter, we will focus on media failures and how to recover from them.
    There are two methods that can be used to recover from media failures: user-managed
    recovery and RMAN-based recovery. This chapter covers these examples to demonstrate
    the differences between each type.


    As we have discussed in previous chapters, the mode you decide to operate in,
    whether ARCHIVELOG mode or NOARCHIVELOG mode, determines the recovery options
    that you can perform. This chapter covers these options and the modes in which
    you operate in further detail. You will also become familiar with examples of
    both ARCHIVELOG mode and NOARCHIVELOG mode media recoveries using both user-managed
    and RMAN methods. In addition to this detailed discussion of recovery methods,
    you will also look at recovery situations in when the relocation of files is required,
    and you will learn how to handle read-only tablespace recovery in different situations.


    Media recoveries are critical tasks in the testing process and workplace. How
    media recovery situations are handled depends on the DBA performing the recovery.
    You can improve your ability to perform such recoveries by various media recovery
    situations so that you have a degree of confidence. As a result of this practice,
    when you need to perform a media recovery, your uncertainties will be significantly
    reduced. Testing media recovery situations will also prepare you for the real-life
    situations that you will experience as a DBA.'
