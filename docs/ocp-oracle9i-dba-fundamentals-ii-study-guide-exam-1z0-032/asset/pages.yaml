- pgno: 46
  md: '![](img/4d4ebf1b63c52ce2a364aa79830c39e0_46_0.png)


    Networks have evolved from simple terminal-based systems to complex multitiered
    systems. Modern networks can be comprised of many computers on multiple operating
    systems using a wide variety of protocols and communicating across wide geographic
    areas. One need no further than the explosion of the Internet to see how networking
    has matured and a profound impact networks are having on the way we work and communicate
    with one another.


    While networks have become increasingly complex, they also have become easier
    to use and manage. For instance, we all take advantage of the Internet without
    knowing or caring about the components that make this communication possible because
    the complexity of this huge network is hidden from us.


    The experienced Oracle database administrator has seen this maturation in the
    Oracle network architecture as well. From the first version of SQL*Net to the
    latest releases of Oracle Net, Oracle has evolved its network strategy and infrastructure
    to meet the demands of the rapidly changing landscape of network communications.


    This chapter highlights the areas that database administrators (DBAs) need to
    consider when implementing an Oracle network strategy. It also looks at the responsibilities
    of the database administrator when managing an Oracle network. The chapter then
    explores the most common types of network configurations and introduces the features
    of Oracle Net—the connectivity management software that is the backbone of the
    Oracle network architecture. It will also explore the Oracle network architecture
    and summarize the Oracle network infrastructure.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Network Design Considerations


    There are many factors involved in making network design decisions. First and
    foremost is the design of the Oracle network architecture itself. It is flexible
    and configurable, and it has the scalability to accommodate a range of network
    sizes. Also, when you are working with an Oracle network, there are a variety
    of network configurations to choose from. The sections that follow summarize the
    areas that the DBA needs to consider designing the Oracle network infrastructure.


    # Network Complexity Issues


    The complexity of the network plays an important role in many of your network
    design decisions. Consider the following questions to determine network complexity:


    +   * How many clients will the network need to support?

    * What type of work will the clients be doing?

    * What are the locations of the clients? In complex networks, clients may be geographically
    dispersed over a wide area.

    * What types of clients are going to be supported? Will these be PC-based clients
    or terminal-based clients? Will these be thin clients who will do little processing
    or fat clients who do the majority of the application processing?

    * What is the projected growth of the network?

    * Where will the processing take place? Will there be any middle-tier servers
    involved, such as an application server or transaction server?

    * What type of network protocols will be used to communicate between the clients
    and servers?

    * Oracle servers have to communicate with other Oracle servers in the enterprise?

    * Will the network involve multiple operating systems?

    * Are there any special networking requirements for the applications that will
    be used? This is especially important to consider when you are dealing with third-party
    applications.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Network Security Issues


    Network security has become even more critical as companies expose their systems
    to larger and larger numbers of users through internets and intranets. Consider
    the following questions to determine the security of a network:


    +   - Does the organization have any special requirements for secure network connections?
    What kinds of information will be sent across the Oracle network?


    +   - Can you ensure secure connections across a network without risk of information
    tampering? This may involve sending the data in a format that makes it tamperproof
    and also ensures that the data cannot be captured and read by parties other than
    the client and the intended Oracle server.


    +   - Is there a need to utilize the authorizations an individual has to each
    of the Oracle servers? In large organizations with many Oracle services, this
    can be a management and administration issue.


    # Interfacing Existing Systems with New Systems


    The following issues should be considered when existing computer systems must
    communicate with Oracle server networks:


    +   - Does the application that needs to perform the communication require a seamless,
    real-time interface?


    +   - Does the existing system use a non-Oracle database such as DB2 or Sybase?


    +   - Will information be transferred from the existing system on a periodic basis?
    If so, what is the frequency and what transport mechanisms should be uscd? Will
    the Oracle server need to send information back to the existing system?


    +   - Do applications need to gather data from multiple sources, including Oracle
    and non-Oracle databases, simultaneously?


    +   - What are the applications involved that require this interface?


    +   - Will these network requirements necessitate design changes to existing systems?'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Network Responsibilities for the DBA


    The database administrator has many design issues to consider and plays an important
    role when implementing a network of Oracle servers in the enterprise. Here are
    some of the key responsibilities of the DBA in the Oracle network implementation
    process:


    +   - Understand the network configuration options available and know which options
    should be used based on the requirements of the organization.


    +   - Understand the underlying network architecture of the organization in order
    to make informed design decisions.


    +   - Work closely with the network engineers to ensure consistent and reliable
    connections to the Oracle servers.


    +   - Understand the tools available for configuring and managing the network.


    +   - Troubleshoot connection problems on the client, middle tier, and server.


    +   - Ensure secure connections and use the available network configurations,
    when necessary, to attain higher degrees of security for sensitive data transmissions.


    +   - Stay abreast of trends in the industry and changes to the Oracle architecture
    that may have an impact on network design decisions.


    # Network Configurations


    There are three basic types of network configurations to select from when you
    are designing an Oracle infrastructure. The simplest type is the single-tier architecture.
    This has been around for years and is characterized by the use of terminals for
    serial connections to the Oracle server. The other types of network configurations
    are the two-tier, client/server, architecture and the most recently introduced
    n-tier architecture. Let’s take a look at each of these configuration alternatives.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Single-Tier Architecture


    Single-tier architecture was the standard for many years before the birth of the
    PC. Applications utilizing single-tier architecture are sometimes referred to
    as green-screen applications because most of the terminals using them, such as
    the IBM 3270 terminal, have green screens. Single-tier architecture is commonly
    associated with mainframe-type applications.


    This architecture is still in use today for many mission-critical applications,
    such as Order Processing and Fulfillment and Inventory Control, because it is
    the simplest architecture to configure and administer. The terminals are directly
    connected to the host computer, and the complexities of network protocols and
    multiple operating systems do not exist.


    When a single-tier architecture is being used, users interact with the database
    using terminals. These terminals are non-graphical, character-based devices. Figure
    1.1 shows an example of the single-tier architecture. In this type of architecture,
    client terminals are directly connected to larger systems as mainframes. All of
    the intelligence exists on the mainframe, and all processing takes place there.
    Simple serial connections also exist on the mainframe. Although no complex network
    architecture is necessary, a single-tier architecture is somewhat limiting in
    terms of scalability and flexibility. Because all of the processing must take
    place on the server, the server can become the bottleneck to increasing performance.


    # FIGURE 1.1 Single-tier architecture


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_50_0.png)


    # Two-Tier Architecture


    Two-tier architecture gained popularity with the introduction of the PC and is
    commonly referred to as client/server computing. In a two-tier environment, clients
    connect to servers over a network using a network protocol, which is the agreed-upon
    method for the client to communicate with'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Network Configurations 7


    server. TCP/IP is a very popular network protocol and has become the facto standard
    of network computing. Whether TCP/IP or some other protocol is chosen, both the
    client and the server must be able to understand the chosen protocol. Figure 1.2
    shows an example of a two-tier architecture.


    # FIGURE 1.2 Two-tier architecture


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_51_0.png)


    This architecture has definite benefits over single-tier architecture. First of
    all, client/server computing introduces the graphical user interface; inter is
    easier to understand and learn, and it offers more flexibility than the traditional
    character-based interfaces of the single-tier architecture. Also, two-tier architecture
    allows the client computer to share the application processing load. To a certain
    degree, this reduces some faults, reduces the processing requirements of the server.


    The two-tier architecture does some faults, even though at one time, it was thought
    to be the panacea of all networking architectures. Unfortunately, the main problem,
    of scalability, persists. Note that the term client/server computing contains
    a slash (/). The slash represents the invisible component of the two-tier architecture
    and the one that is often overlooked: the network!


    By prototyping projects, many developers fail to consider the network component
    and soon find out what worked well in a small environment may not scale effectively
    to larger, more complex systems. There was a great deal of redundancy in the two-tier
    architecture model because application software was required on every desktop.
    As a result of this scenario, many companies end up with bloated PCs and large
    servers that still do not provide adequate performance. What is needed is a more
    scalable model for network communications. That is what n-tier architecture provides.


    Copyright ©2002 SYBEX, Inc., Alameda, CA www.sybex.com'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# N-Tier Architecture


    N-tier architecture is the next logical step after two-tier architecture. Instead
    of dividing application processing work between a client and a server, you divide
    the work up among three or more machines. The n-tier architecture introduces middleware
    components, one or more computers that are situated between the client and the
    Oracle server, which can be used for a variety of tasks. Some of those tasks include
    the following:


    +   - Moving data between machines that work with different network protocols.

    - Serving as firewalls that can control client access to the servers.

    - Offloading processing of the business logic from the clients and servers to
    the middle tier.

    - Executing transactions and monitoring activity between clients and servers to
    balance the load among multiple servers.

    - Acting as a gateway to bridge existing systems to new systems.


    The Internet provides the ultimate n-tier architecture with the user''s browser
    providing a consistent presentation interface. This common interface makes less
    training of staff and also increases the potential reuse of client-side application
    components.


    N-tier architecture makes it possible to take advantage of technologies such as
    networked computers. Such computers can make for economical, low-maintenance alternatives
    to the personal computer. Because much of the application processing can be done
    by application servers, the client computing requirements for these networked
    computers are greatly reduced. In addition, the processing of transactions can
    also be offloaded to transaction servers, which reduces the burden on the database
    servers.


    The n-tier model is very scalable and divides the tasks of presentation, business
    logic and database processing among many machines, which means that model accommodates
    large applications. In addition, the reduction of processing load on the database
    servers means that the servers can do more work with the same amount of resources.
    Also, the transaction servers can balance the flow of network transactions intelligently,
    and application servers can reduce the processing and memory requirements of the
    client (see Figure 1,3).'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# FIGURE 1.3 N-tier architecture


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_53_0.png)


    # Overview of Oracle Net Features


    Oracle Net is the glue that bonds the Oracle network together. It is responsible
    for handling client-to-server and server-to-server communications, and it can
    be configured on the client, the middle-tier application, web servers, and the
    Oracle server.


    Oracle Net also manages the flow of information in the Oracle network infrastructure.
    First, it is used to establish the initial connection to the Oracle server, and
    it acts as the messenger, passing requests from the client back to the server
    or passing between two Oracle servers. Oracle Net handles all negotiations between
    the client and server during the client connection. In the section entitled “The
    Oracle Stack Architecture” later in this chapter, we discuss the architectural
    design of Oracle Net.


    In addition to functioning as an information manager, Oracle Net supports the
    use of middleware products such as Oracle9i Application Server (Oracle9iAS) and
    Oracle Connection Manager. These products allow n-tier architectures to be used
    in the enterprise, which increases the flexibility and performance of application
    designs.


    To learn more about these products and some of the features of Oracle Net, read
    the following sections, which mirror the five categories of networking solutions
    Oracle Net provides: Connectivity, Directory Services, Scalability, Security,
    and Accessibility.


    # Connectivity: Multi-Protocol Support


    Oracle Net supports a wide range of industry-standard protocols including TCP/IP,
    IBM LU6.2, Named Pipes, and DECNet.(Unlike its predecessor Net8, Oracle Net no
    longer supports the Novell IPX/SPX protocol.) This support is handled transparently
    and allows Oracle Net to establish connectivity to a wide range of computers and
    a wide range of operating environments.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Chapter 1 • Introduction to Network Administration


    > Oracle Net adds support for a new protocol designed for System Area Networks
    (SANs) that are used in clustered environments. special configurations of hardware
    that are used for situations which multiple servers need high-speed communications
    between them. The new Virtual Interface (VI) protocol is lightweight and works
    with a specific hardware configuration to relieve network activity responsibility
    from the CPUs and place it on special network adapters. See the Oracle9i Net Services
    Administrators'' Guide (Part No. A90154-01) for details on the use, configuration,
    and restrictions on the VI protocol. This may be obtained from the Oracle Technology
    Network website at technet.oracle.com. At this, you will find all of the Oracle9i
    documentation in either Adobe Acrobat format or HTML format.


    # Connectivity: Multiple Operating Systems


    Oracle Net can operate on many different operating system platforms, from Windows
    NT/2000, to all variants of Unix, to large mainframe-based operating systems.
    This range allows users to bridge systems to other Unix or PC-based systems, which
    increases the data flexibility of the organization without making wholesale changes
    to the existing systems.


    # Connectivity: Java and Internet


    With the introduction of Oracle8i, Oracle enabled connectivity to Oracle servers
    from applications using Java components as Enterprise JavaBeans and Common Object
    Request Broker Architecture (CORBA), which is a standard for defining object interaction
    across a network. Oracle Net continues this by supporting standard connectivity
    solutions such as the Internet-ORB Protocol (IIOP) and the General Inter-ORB Protocol
    (GIOP). These features allow clients to connect to applications interfacing with
    an Oracle database via a web browser. By utilizing features such as Securedockets
    Layer (SSL), client connections can obtain a greater degree of security across
    the Internet.


    # Directory Services: Directory Naming


    Directory Naming allows for network names to be resolved through a centralized
    naming repository. The central repository takes the form of a Lightweight Directory
    Access Protocol (LDAP)-compliant server. LDAP is a'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'protocol and language that defines a standard method of storage, identification,
    and retrieval of services. It provides a simplified way to manage directories
    of information, whether this information is about users in an organization or
    Oracle instances connected to a network. The LDAP server allows for a standard
    form of managing and resolving names in an Oracle environment. The quality of
    these services excels because LDAP provides a single standard interface to a directory
    service such as Oracle Internet Directory (OID). By using Oracle Internet Directory,
    you ensure security and reliability of the directory information because stored
    in the Oracle database.


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_55_0.png)


    As of Oracle9, Directory Naming has become the preferred method of centralized
    naming within an Oracle environment, replacing the Oracle Names Server. The Oracle
    Names Server can be utilized in Oracle8 and earlier versions, however. The Oracle
    Names Server can also be configured as a proxy to an LDAP-compliant Names Directory
    to ease the migration from Oracle Naming to


    # Directory Services: Oracle Internet Directory


    The Oracle Internet Directory (OID) is an LDAP directory service, which provides
    the repository and infrastructure needed to enable a centralized naming solution
    using Directory Naming. OID can be used with both Oracle8 and 9 databases. In
    Oracle9, the OID runs as an application. The OID service can be run on a remote
    server and it communicates with the Oracle server using Oracle Net. The OID is
    a scalable architecture, and it provides mechanisms for replicating service information
    among other servers.


    OID also provides security in a number of ways. First of all, it can be integrated
    into a Secureockets Layer (SSL) environment to ensure user authentication. Also,
    an administrator can maintain policies that grant or deny access to services.
    These policies are defined for entities within the Oracle Internet Directory tree
    structure.


    # Scalability: Oracle Shared Server


    Oracle Shared Server (formerly known as Multithreaded Server) is an optional configuration
    of the Oracle server that allows support for a larger number of concurrent connections
    without increasing physical resource requirements. This is accomplished by sharing
    resources among groups of users.'
