    # Cold backup script for tst9


    echo ''starting cold backup...''

    echo''''

    # Script to stop database!

    ./stopdb_tst9.sh


    echo

    echo ''tst9 shutdown...''

    echo''''

    echo ''clean up last backup in staging directory''

    ```'
