    # # Managing the Listener Using Lsnrctl


    Once you have created and saved the listener definition, you need to start the
    listener. The listener must be started before clients can connect to and request
    database connections. The listener cannot be started or stopped from the Oracle
    Net Manager.


    The listener is started using the command line tool lsnctl. Other Oracle network
    components, such as Connection Manager, have command line tools that are used
    to start and stop the associated processes.


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_96_0.png)


    On Windows NT/2000, the listener runs as a service. Services are programs that
    run in the background on Windows NT/2000. You can start the listener from the
    Windows NT/2000 Services panel. Choose Start > Settings > Control Panel > Services.
    Then select the name of the listener service from the list of services. If your
    %ACLE_HOME% directory is ORANT, and the name of your listener is Listener, you
    would look for a name such as OracleHome90TNTListener. Select the listener name
    and choose Start.


    # ### The lsnctl Utility


    The lsnctl utility is located in the %ACLE_HOME%\bin directory of Windows NT/2000
    and %ACLE_HOME%/bin on Unix systems. Windows NT/2000 users familiar with earlier
    releases of Oracle will notice that listener names no longer have version extensions.
    For example, in Oracle8, the tool was called lsnrctl80. All of the tools now have
    a consistent name across platforms—the version extensions have been dropped to
    comply with this.'
