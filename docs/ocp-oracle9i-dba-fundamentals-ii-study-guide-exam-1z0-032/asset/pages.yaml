- pgno: 510
  md: '# B


    **BACKUP** The RMAN command is used to perform a backup that creates a backup
    set.


    **backup and recovery strategy** The backup and recovery plan for an organization''s
    databases, applications, and systems is formalized and agreed upon by the required
    groups in the organization.


    **BACKUP CONTROLFILE TO TRACE** A control file makes an ASCII backup of the binary
    control file, which can then be executed to re-create the binary control file.
    The BACKUP CONTROLFILE is dumped as a user trace file. This file can be viewed,
    edited, and run as a script after you edit the comments and miscellaneous trace
    information.


    **backup piece** A physical object that stores data files, control files, or archived
    logs and resides within a backup set.


    **backup script** A script written in different OS scripting languages, such as
    Korn or C shell in the Unix environments.


    **backup set** A logical object that stores one or more physical backup pieces
    containing data files, control files, or archived logs. Backup sets must be processed
    with the RESTORE command before these are usable.


    **bad log** A SQL*Loader log which documents records that were rejected by the
    Oracle database or SQL*Loader because they had an invalid format or unique key
