- pgno: 229
  md: '# Parameter Files


    There are two parameter files that make up the file structures of the Oracle9i
    database. The parameter file is the file that contains the initialization parameters
    of the database that are used upon startup. The standard parameter file, called
    init<ORACLE_SID>.ora, contains parameters required for instance startup. The ORACLE_SID
    equals the name of the oracle system identifier or database name. This parameter
    file is ASCII and can be edited.


    The second parameter file, spfile<ORACLE_SID>.ora, is the server parameter file
    that stores persistent parameters that are required for instance startup and those
    that are modified when the database is started. The server parameter file is stored
    in binary format, which is a new feature in Oracle9i.


    Either of these files can be used to start the Oracle database, but the spfile.ora
    files are the default for starting the database. If these files are not found,
    the init.ora files are used.


    The default locations for these files are in the following directory structures.
    We will demonstrate both Unix and Windows NT/2000 locations.


    ```

    Unix $ORACLE_HOME/dbs

    Windows NT/2000 %ORACLE_HOME%\database

    ```


    # Checkpoints, Redo Logs, and Archived Logs


    Now that you have a basic understanding of the various Oracle processes, file
    structures, and memory structures used for recovery, it''s time to see how these
    interrelate. As you learned earlier, checkpoints, redo logs, archived logs are
    significant to all aspects of recovery.


    The checkpoint is an event that determines the synchronization or consistency
    of transactions on disk. The checkpoint is implemented by storing a unique number—the
    SCN (again, this stands for system change number)—in the control files, header
    of the data files, online redo logs, and archived logs.


    The checkpoint is performed by the CKPT process. One of the ways a checkpoint
    is initiated by the data block writer (DBWR) process. The DBWR process initiates
    a checkpoint by writing all modified data blocks in the data buffers (dirty buffers)
    to a checkpoint is performed, all committed transactions are written to the data
    files.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Checkpoints, Redo Logs, and Archived Logs 187


    If the instance were to crash at this point, only new transactions that occurred
    after this checkpoint would need to be applied to the database to enable a complete
    recovery. Therefore, the checkpoint process determines which transactions from
    the redo logs need to be applied to the database in the event of a failure and
    subsequent recovery. Remember that all transactions, whether committed or not,
    get written to the redo logs.


    Other methods that cause a checkpoint to occur include any of the following commands:
    ALTER SYSTEM SWITCH LOGFILE, ALTER SYSTEM CHECKPOINT LOCAL, ALTER TABLESPACE BEGIN
    BACKUP, and ALTER TABLESPACE END BACKUP.


    SCNs are recorded within redo logs at log switch, at minimum because a checkpoint
    occurs at every log switch. Archived logs have the same SCNs recorded within them
    the online redo logs because the archived logs are merely copies of the online
    logs.


    Let''s look at an example of checkpointing, online redo logs, and archived logs
    are all interrelated. First, the ALTER TABLESPACE BEGIN BACKUP command is used
    to begin an online backup of a database.


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_230_0.png)


    > An online backup, also called a hot backup, occurs while the database is still
    available or running. See Chapter 9, "User-Managed and RMAN-based Backups," for
    a more detailed explanation of a hot backup.


    The ALTER TABLESPACE BEGIN BACKUP command is followed by an OS command to copy
    the files, such as in Unix. Then, the ALTER TABLESPACE END BACKUP is used to end
    the hot backup. As we discussed, these ALTER TABLESPACE commands also cause a
    checkpoint to occur. The following is an example of the data file data01.dbf for
    the tablespace DATA being backed:


    ```

    SQL> connect /as sysdba

    Connected.

    SQL> alter tablespace data begin backup;

    Tablespace altered.

    SQL> ! cp data01.dbf /stage/data01.dbf

    SQL> alter tablespace data end backup;

    Tablespace altered.

    SQL>

    ```'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# 188 Chapter 6 • Instance and Media Recovery Structures


    Note that the tablespace DATA was put in backup mode, and then the OS command
    was executed, copying the data file data01.dbf to the new directory /stage, where
    it awaits to finish. Finally, the tablespace DATA was taken out of backup mode.
    These steps are repeated for every tablespace in the database. This is a simplified
    example of a hot backup.


    If a hot backup was taken on Sunday at 2 A.M., and the database crashed on Tuesday
    at 3 P.M., then the last checkpoint would have been issued after all the data
    files were backed up. Therefore, all the archived logs generated after the 2 A.M.
    backup was de-checkpointed would need to be applied to the checkpointed database
    to bring it up to 3 P.M. Tuesday, the time of the crash. When you are making a
    hot backup of the database, you are getting a copy of the database that has been
    checkpointed for each data file. In this case, each data file has a different
    SCN in the header and each will need all applicable redo log entries with a greater
    SCN applied to the data file to make the database consistent.


    # Ways to Tune the Instance Recovery


    As we''ve previously discussed in Chapter 5, “Backup and Recovery Overview,” instance
    failure is when the Oracle database instance abnormally terminates due to something
    like a power outage or a shutdown abort. Instance recovery is the automatic process
    that the Oracle database performs to ensure that the database is functioning properly
    and the data is consistent. This is also known as the roll forward and rollback
    process. Upon startup of the Oracle database after an instance failure, Oracle
    reads the current online redo log and applies all the changes in that redo to
    the database. All uncommitted changes are rolled back. Thus, the database is made
    consistent from the time of the outage.


    The concept of defining an approximate set time for the instance recovery process
    is called bounded time recovery. Bounded time recovery means that the DBA controls
    or puts bounds on the time it takes for an instance to recover after instance
    failure. These bounds are controlled by using two initialization parameters.


    Copyright ©2002 SYBEX, Inc., Alameda, CA www.sybex.com'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Ways to Tune the Instance Recovery 189


    There are two primary initialization parameters that will speed up the instance
    recovery process. The first parameter is called FAST_MTTR_TARGET. This parameter
    makes the database writer (DBW0) background process write dirty blocks faster
    and at a predefined pace to meet agreed-upon recovery timeframes. This parameter
    can be set from 0 to 3600.


    The second parameter is called FAST_PARALLEL_ROLLBACK. This parameter determines
    the maximum number of processes that can exist for performing a parallel rollback.
    This parameter is useful when there are running transactions involved in the instance
    recovery process. This causes the rollback aspect of instance recovery to process
    faster. This parameter can be set as HIGH, LOW, and FALSE. The following are .init_ora
    parameters:


    ```

    fast_start_mttr_target = 300

    fast_start_parallel_rollback = LO

    ```


    There are three v$ views that can be used to monitor these parameters. v$INSTANCE_RECOVERY,
    v$FAST_START_SERVERS, and v$FAST_START_TRANSACTIONS. Below is an example of the
    v$INSTANCE_RECOVERY view, which can be used to monitor and determine the length
    of recovery for the FAST_START_MTTR_TARGET parameter. TARGET_MTTR and ESTIMATED_MTTR
    should show the estimated time in seconds to recover the database in the advent
    of an instance failure at that given time.


