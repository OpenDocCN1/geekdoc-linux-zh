- pgno: 511
  md: '# C


    **cancel-based recovery** A type of incomplete recovery that is stopped when the
    DBA executes a CANCEL command during a manual recovery operation.


    **cataloging** Storing information in the Recovery Manager catalog. This is done
    by issuing the RMAN CATALOG command.


    **CHANGE** The RMAN command used to change the status of a backup set to either
    AVAILABLE or UNAVAILABLE.


    **change-based recovery** A type of incomplete recovery that is stopped by a change
    number designated when the recovery is initiated.


    **change vector** See redo log entry.


    **channel allocation** Allocating a physical device to be associated with the
    server session.


    **checkpoint** The process of updating the SCN in all the data files and control
    files in the database in conjunction with all necessary data blocks in the data
    buffers written to disk. This is for the purposes of ensuring database consistency
    and synchronization.


    **checkpointing** See *checkpoint*.


    **checkpoint process (CKPT)** The checkpoint process updates the headers of data
    files and control files; the actual blocks are written to the file by the DBW
    process.


    **CKPT** See *checkpoint process (CKPT)*.


    **closed backup** A backup that occurs when the target database is closed or shut
    down. This means that the target database is not available for use during this
    backup. This is also referred to as an offline or cold backup.


    **cold backup** See *cold backup*.


    **commit** To save or permanently store the results of a transaction to the database.


    **complete recovery** A recovery situation in which no data is lost.'
