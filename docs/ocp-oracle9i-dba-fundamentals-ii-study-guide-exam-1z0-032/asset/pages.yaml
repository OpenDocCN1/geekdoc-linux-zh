  md: '# TABLE 2.2 Optional listener.ora Parameter Definitions


    | Oracle Net Manager Prompt | listener.ora Parameter | Description |

    | --- | --- | --- |

    | Startup Wait Time | STARTUP_WAIT_TIME | Defines how long a listener will wait
    before it responds to a STATUS command in the lsnrctl line utility. |

    | Unavailable from Net Manager | CONNECT_TIMEOUT | Defines how long a listener
    will wait for a response from a client once a session is initiated. The default
    is 10 seconds. |

