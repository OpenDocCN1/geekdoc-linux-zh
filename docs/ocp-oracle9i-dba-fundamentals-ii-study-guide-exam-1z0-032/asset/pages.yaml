- pgno: 36
  md: '# # Answers to Assessment Test


    +   1. B. Change-based recovery is based upon a unique SCN number that each transaction
    uniquely contains. See Chapter 11 for more information.


    +   2. B. The recovery catalog is an optional feature of RMAN. Though Oracle recommends
    that you use it, is not required. One major benefit of the recovery catalog is
    that it stores metadata about backups in a database that can be reported or queried.
    See Chapter 8 for more information.


    +   3. C. The data file or control file can both be used to store load data. The
    control file should only store small data loads for one-time use or test purposes.
    See Chapter 15 for more information.


    +   4. A, C. Control files and parameter files make up two of the physical structures
    of the Oracle database. Data files and redo logs make up the other physical structures.
    See Chapter 6 for more information.


    +   5. D. The command CATALOG DATAFCOPY backs up data files that were copied or
    backed up by OS commands in user-managed backups. See Chapter 12 for more information.


    +   6. A, B. The control file can be backed up in two ways: in ASCII format, it
    can be backed up to a TRACE file, or in binary format, it can be backed up to
    a new location. The ALTER DATABASE BACKUP CONTROLFILE TO TRACE and ALTER DATABASE
    BACKUP CONTROLFILE TO `<controlfile_name>` performs backups of the control file
    to ASCII format and to binary format.


    +   7. E. Oracle Net is responsible for handling client-to-server and server-to-server
    communications in an Oracle environment. It manages the flow of information in
    the Oracle network infrastructure. Oracle Net is used to establish the initial
    connection to the Oracle server and then it acts as the messenger, which passes
    requests from the client back to the server or between two Oracle servers. See
    Chapter 1 for more information.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Assessment Test


    8. B, C, D. The roles that are required for the RMAN schema that owns the recovery
    catalog to connect, resource, and recovery_catalog_owner. See Chapter 13 for more
    information.


    9. A, B. Oracle Shared Server allows Oracle servers to manage a greater number
    of connections utilizing the same amount or less memory and process resources.
    If an Oracle server is constrained by these resources, Oracle Shared Server can
    be an alternative configuration that can provide relief. See Chapter 4 for more
    information.


    10. B, C. The loss of inactive or active redo logs will require incomplete recovery
    because the backup will not have all the required logs to apply to the database.
    The loss of an archived log since the current backup will also not allow a complete
    recovery for the same redo log. See Chapter 11 for more information.


    11. B. Dispatchers take the place of the dedicated server processes. The dispatchers
    are responsible for responding to client requests by placing the requests on a
    request queue (not a response queue) in the SGA; they retrieve completed requests
    that were placed on a response queue by the shared server and pass them back to
    the client. See Chapter 4 for more information.


    12. B. The PARFILE command option allows you to export commands in a file so that
    you don''t have to interactively respond to the prompts when you are running the
    export. This also allows you to export scripts more efficiently. See Chapter 14
    for more information.


    13. A. Cancel-based recovery requires the DBA to manually cancel the recovery
    process at the command line. See Chapter 11 for more information.


    14. A. The spfile.ora is for Oracle9i. This is the binary initialization file
    that is the default when Oracle is started. This file contains persistent parameters.
    The init.ora file is searched only if there isn''t spfile.ora initialization file.
    See Chapter 6 for more information.


    15. B. The DBVERIFY utility can verify both online data files and copies of online
    data files. See Chapter 9 for more information.'
  merge: -1
  img_proc: true
