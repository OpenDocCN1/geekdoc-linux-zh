  md: '# Answers to Review Questions


    +   1. The CROSSCHECK command requires the use of a recovery catalog.

    This is the backup information that must be checked with the recovery catalog
    to compare to the tape or disk media where the actual backups are stored.


    +   2. The channel that gets allocated for CROSSCHECK command is a special channel
    for maintenance only. c1 and t1 are simply names of the channel devices.


