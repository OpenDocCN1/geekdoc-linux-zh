  md: '# Configuring a Database for ARCHIVLOG Mode and Automatic Archiving 205


    the backup for two hours. The database would be restarted before 9 A.M., and there
    would be no interference with the users'' work. In the event of a failure, there
    would be a backup from each evening, and only a maximum of one day''s worth of
    data would be lost. If one day''s worth of data loss was acceptable, this would
    be a workable backup and recovery strategy for Manufacturing Company B.


    These examples show that in some situations, operating in NOARCHLOG mode makes
    sense. But there are recovery implications that stem from this choice. One implication
    is that a loss of data will occur in the event of a failure. Also, there are limited
    choices on how to recover. The choice is usually to restore the whole database
    from the last consistent whole backup while the database was shut down (cold backup).


    # Configuring a Database for ARCHIVLOG Mode and Automatic Archiving


    Once the determination has been made to the database in ARCHIVLOG mode, the database
    will need to be configured properly. You can do this to a new database during
    database creation or to an existing database via Oracle commands. After the database
    is in ARCHIVLOG mode, you will most likely configure automatic archiving. Automatic
    archiving frees the DBA from the manual task of archiving logs with commands before
    the online redo logs perform a complete cycle.


    # Configuring ARCHIVLOG Mode


    ARCHIVLOG mode can be set during the database creation or by using the ALTER DATABASE
    ARCHIVLOG command. The database must be mounted, but not open, in order to execute
    this command. This command stays in force until it is turned off using the ALTER
    DATABASE NOARCHLOG command. The database must be mounted, but not open, in order
    to execute this command as well.


    The redo log files will be archived to the location specified by the LOG_ARCHIVE_DEST
    parameter in the init.ora file. By default, the database is in manual archiving
    mode. This means that the redo logs become full, the database will hang until
    the DBA issues the ARCHIVE LOG command, which archives all the online redo logs
    not yet archived. Figure 7.1 shows a database configured for ARCHIVLOG mode.'
