  md: '# Identifying RMAN-Specific Backups


    There are three types of backups that are supported by the RMAN utility:


    +   - Full or incremental

    - Opened or closed

    - Consistent or inconsistent


    Each is described in the following sections.


    # Full or Incremental Backups


    The full and incremental backups are differentiated by how the data blocks are
    backed up in the target database. The full backup backs up all the data blocks
    in the data files, modified or not. An incremental backup backs up only the data
    blocks in the data files that were modified since the last incremental backup.


    The full backup cannot be used as part of an incremental backup strategy. The
    baseline for an incremental backup is a level 0 backup. A level 0 backup is a
    full backup at that point in time. Thus, all blocks, modified or not, are backed
    up, allowing the level 0 backup to serve as a baseline for future incremental
    backups. The incremental backups can then be applied with the baseline, or level
    0, to form a full backup at some time in the future. The benefit of the incremental
    backup is that it is quicker, not all data blocks need to be backed up.


    There are two types of incremental backups: differential and cumulative, both
    of which back up only modified blocks. The difference between these two types
    of incremental backups is in the baseline database used to identify the modified
    blocks that need to be backed up.


    The differential incremental backup backs up only data blocks modified since the
    most recent backup at the same level or lower. A differential incremental backup
    will determine if level 1 or level 2 backup has occurred most recently and back
    up only blocks that changed since that backup. The differential incremental backup
    is the default incremental backup.


    The cumulative backup backs up only the data blocks that have changed since the
    most recent backup of the next lowest level—n–1 or lower (with n being the existing
    level of backup). For example, if you are performing a level 2 cumulative incremental
    backup, the backup will copy data'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# 270 Chapter 9 • User-Managed and RMAN-Based Backups


    blocks only from the most recent level 1 backup. If no level 1 backup is available,
    it will back up all data blocks that have changed since the most recent level
    0 backup.


    > NOTE Full backups do not mean the whole or complete database was backed up.
    In other words, a full backup can back up only part of the database and not all
    data files, control files, and logs.


    # Opened or Closed Backups


    The opened and closed backups are differentiated by the state of the target database
    being backed up. The RMAN opened backup occurs when the target database is backed
    up while it is opened or available for use. This is similar to the non-RMAN hot
    backup that was demonstrated earlier in this chapter. The RMAN closed backup occurs
    when the target database is mounted but not opened. This means the target database
    is not available for using this type of backup. This is similar to the non-RMAN
    cold backup that was demonstrated earlier in this chapter.


    # Consistent or Inconsistent Backups


    The consistent and inconsistent backups are differentiated by the state of the
    SCN in data file headers and in control files. The consistent backup is a backup
    of a target database that is mounted but not opened and shut down with either
    a SHUTDOWN IMMEDIATE, SHUTDOWN TRANSACTIONAL, or SHUTDOWN NORMAL option, but not
    the SHUTDOWN ABORT option. This means the database base has not crashed prior
    to being mounted. The SCN information in the data files matches the SCN information
    in the control files. The inconsistent backup is a backup of the target database
    when it is crashed prior to mounting, or when it was shut down with the SHUTDOWN
    ABORT option prior to mounting. This means that the SCN information in the data
    files does not match the SCN information in the control files.


    # Using RMAN’s BACKUP and COPYCommands


    Here are two main backup sources that can be the basis for the RMAN recovery process:
    image copies and backup sets.'
