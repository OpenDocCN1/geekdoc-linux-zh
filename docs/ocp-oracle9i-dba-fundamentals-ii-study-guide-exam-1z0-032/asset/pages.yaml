  md: '# Answers to Review Questions


    +   1. C. The direct-load insert statement will bypass the buffer cache while
    it performs an insert. SQL*Loader direct-path load will also bypass the buffer
    cache, but it is not an insert statement.


    +   2. A, C. Both the ALTER TABLE command and hints used with the PARALLEL clause
    will allow the table to be placed in parallel.


    +   3. C. The control file is responsible for formatting the data to be loaded.


    +   4. B. The general log contains cumulative information about the number of
    records that were loaded.


    +   5. A. The bad log contains records that were rejected by the database.


    +   6. C. The discard log contains data that was filtered out of the load as designed
    in the control file.


    +   7. A, B, C. The input file, or data file, and the control file can contain
    data that is loaded in the SQL*Loader runner.


    +   8. C. The REPLACE command deletes the current data in a table before it inserts
    new data.


    +   9. A. Running multiple sqlldr command line entries with multiple data files
    will cause parallel loads.


    +   10. B. The direct-path load cannot load data into a clustered table.


    +   11. B. The conventional load uses bind arrays to temporarily store the data
    before inserting into the database.


    +   12. B. Direct-path load cannot have active transactions taking place on the
    table you are loading. This is because there is a lock placed on the table and
    the data is directly loaded into blocks.'
