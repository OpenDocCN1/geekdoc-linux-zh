    # ## Real World Scenario

    ### Checking the Backup before Shutdown


    Because RMAN backups called by Media Management vendor’s software are conducted
    in the background, they tend to be forgotten. Another reason these backups may
    forgotten is rather than the DBA conducting them, such backup-related tasks may
    be executed and controlled by the backup coordinator, who may reside within the
    systems administrators. As a group, when the backup terminates for some reason,
    you may not know about it, unless you have good communication set up. As a result,
    the backup may terminate in such a way that it leaves the database partially in
    backup mode with some tablespaces and the associated data files still active,
    or it leaves jobs incomplete and in the recovery catalog.


    What happens when the database goes down when a tables is in backup mode? If this
    happens, the data file is not checkpointed so that it is consistent with the rest
    of the database. Therefore, when the database is restarted, the data file is marked
    as inconsistent and in need of recovery. This situation can come as an unwanted
    surprise when you are bouncing the database for some reason.


    You can remedy this situation without recovery by issuing the ALTER DATAFILE ''<filename>''
    END BACKUP command to fix this. However, this situation can be avoided in the
    first place if you check the V$BACKUP view to validate that it is safe to shut
    down the database before you do.'
