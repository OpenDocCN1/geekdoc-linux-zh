    # Guidelines for Using SQL*Loader and Direct-Load Insert


    In order to use SQL*Loader effectively, you need to consider the following guidelines:


    Use the parameter file to specify and simplify the use of commonly used command
    line options. This is a good choice for repeatable loads that can be scheduled.
    The parameter is similar to the parameter file used in the export and import utility.
    With the commands in a parameter file, the DBA will not need to interactively
    reply to prompts when the utility is executing.


    For a small, one-time load, you should place only small data sets in the control
    file. This approach restricts the use of control file for new data sets. This
    method is primarily used to load sample or test data because the control file
    information is combined with the raw data. The raw data would need to be combined
    or concatenated to the control file each time it was loaded. This is more cumbersome
    than keeping the data separate in a data file.


    Optimize performance by allocating sufficient initial space. When you optimize
    in this manner, you prevent dynamic extent allocation, which slows the load process.


    Optimize performance by presorting data on the big indexes. Optimizing in this
    manner helps alleviate the work that must be performed in the temporary segments
    in order for indexes to be rebuilt.


    Optimize performance by using different files for temporary segments in order
    to perform parallel loads. You should use different data files for each parallel
    of your temporary segments sql1ldr command line execution. This is done by using
    the FILE option in the control file to designate the data file where the temporary
    segments are created during the parallel load operation.


    Copyright©2002 SYTEX, Inc., Alameda, CA www.sysex.com'
