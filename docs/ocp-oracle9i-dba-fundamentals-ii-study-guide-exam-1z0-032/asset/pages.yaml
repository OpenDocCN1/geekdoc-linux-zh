- pgno: 512
  md: '# Glossary 473


    CONFIGURATION parameters The parameters that determine the RMAN settings.


    consistent backup A backup of a target database that is mounted but not opened
    and shut down with either a SHUTDOWN IMMEDIATE or SHUTDOWN NORMAL option, but
    not with SHUTDOWN ABORT. The database files are stamped with the same SCN at same
    point in time. This occurs during a cold backup of the database and no recovery
    is needed.


    control file (database) The file that stores the RMAN repository information and
    records the physical information about the database. The control file contains
    the database name and timestamp of database creation, along with the name and
    location of every data file and redo log file.


    control file (SQL*Loader) The logic behind the data load that determines how and
    what data will be loaded. This is the SQL* Loader control file, not to be confused
    with the database control file.


    conventional-path export The standard export that goes through the SQL-evaluation
    layer.


    conventional load The conventional load is the default load process for SQL*Loader.
    The conventional load builds a bind array, and when this bind array is full, a
    SQL insert statement is executed.


    COPY The RMAN command that performs an image copy.


    CROSSCHECK TheRMANcommandedtocompareRMANrepository to the stored media backups.


    cross checking The process of comparing the RMAN repository with the media backups
    that are stored using the CROSSCHECK command.


    cumulative incremental backup Back ups only the data blocks that have changed
    since the most recent backup of the next lowest level—n – 1 or lower (with n being
    the existing level of backup).


    current online redo logs Logs that are actively being written to the LGWR process.'
