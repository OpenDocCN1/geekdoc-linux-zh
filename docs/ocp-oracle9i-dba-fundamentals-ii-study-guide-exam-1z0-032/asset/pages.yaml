- pgno: 256
  md: '# Using init.ora Parameters for Multiple Archive Processes and Locations 213


    # Using init.ora Parameters for Multiple Archive Processes and Locations


    The capability to have more than one archived log destination and multiple archives
    was first introduced in Oracle8i and 9i, more than two destinations can be used,
    providing even greater archived log redundancy.


    The reason for having multiple destinations for archived log files is to eliminate
    any single point of failure. For example, if you were to lose the disk storing
    the archived logs before these logs were backed up to, the database would be vulnerable
    to data loss in the event of a failure. If the disk containing the archived logs
    was lost, then the safest thing to do would be to run a backup.


    media failure. Having only one archived log location is a single point of failure
    for the backup process. Having provided multiple locations, which can be on different
    disk drives, so that the likelihood of archived logs being lost is significantly
    reduced. See Figure 7.2, which demonstrates ARCHIVELOG mode with multiple destinations.


    In addition to reducing the potential archived log loss, one of the multiple locations
    can be remote. The remote location supports the Oracle database, which is an option
    that can be configured to protect a computing site from a disaster. Let''s go
    over a brief explanation of this option and why it can require remote archived
    log capabilities.


    The Oracle standby database can require archived logs to be moved to a remote
    server, which is running a copy of the production database. This copy of the production
    database is in a permanent recovery situation with archived logs from the production
    database regularly applied to the standby database.


    There are certain initialization parameters that regularly be used to assure that
    the archived logs get moved to remote locations. These initialization parameters
    will be covered in more detail in the upcoming section “Remote Archived Log Locations."'
  merge: -1
  img_proc: true
