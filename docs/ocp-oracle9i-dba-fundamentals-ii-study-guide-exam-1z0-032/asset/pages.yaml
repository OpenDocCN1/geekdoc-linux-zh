    # Determining the Number of Dispatchers to Start


    The number of dispatchers you start will vary depending on your particular configuration.
    Your operating system may place a limit on the number of connections that one
    dispatcher can handle. Consult your operating system documentation to obtain this
    information.

    Use the following formula as a guide when you are deciding how many dispatchers
    to initially configure:


    Number of Dispatchers = CEIL (maximum number of concurrent sessions / connections
    per dispatcher)


    For example, if you have 200 concurrent TCP/IP connections, and you would need
    each dispatcher to manage 20 concurrent sessions. You would set your DISPATCHERS
    parameter as follows:


    ```

    DISPATCHERS = * (PRO=TCP)(DIS=10)*

    ```


    You can determine the number of concurrent connections by querying the V$SESSION
    view. This view shows the number of clients connected to the Oracle server. Here
    is an example of the query:


    ```

    SQL> select sid,serial#,username,server,program from v$session

    2* where sid > 6

    ```'
