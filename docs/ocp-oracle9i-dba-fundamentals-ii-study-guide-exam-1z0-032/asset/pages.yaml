- pgno: 108
  md: '# 64 Chapter 2 • Configuring Oracle Net on the Server


    +   - The underlying network protocol may not be active on the server; for example,
    the TCP/IP process on the server may not be running.

    - The user may enter an incorrect service name, user ID, or password.


    These types of errors can be diagnosed and corrected easily. In the section entitled
    "Server-Side Computer and Database Checks," you will see how to diagnose and correct
    connection problems originating from the Oracle server. In the next chapter, we
    will discuss troubleshooting problems with client-side network configuration.


    When a client has a connection problem that is up to you to fix, it is helpful
    to first gather further information about the situation. Make sure you record
    the following information:


    +   - The Oracle error received.

    - The location of the client. Is the client connecting from a remote location,
    or is the client connected directly to the server?

    - The name of the Oracle server to which the client is attempting to connect.

    - Check if other clients are having connection problems. If other clients are
    experiencing problems, are these clients in the same general location?

    - Ask the user what is failing. Is it the application being used or the connection?


    We will now look at the particular network areas to check and the methods used
    to further diagnose connection problems from the Oracle server. We will also look
    at the Oracle error codes that will help identify and correct the problems.


    # Server-Side Computer and Database Checks


    There are several server-side checks that can be performed if a connection occurs.
    Before running such checks, make sure the machine is running, that the Oracle
    server is available, and the listener is active. Here is a summary of checks to
    perform on the server.


    # Check Server Machine


    Make sure the server machine is active and available for connections. On some
    systems, it is possible to start a system in a restricted mode that allows only
    supervisors or administrators to log in to the computer. Make sure that the computer
    is open and available to all users.'
