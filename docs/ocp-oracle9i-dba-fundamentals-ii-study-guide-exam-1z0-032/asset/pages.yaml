- pgno: 113
  md: '# Troubleshooting Server-Side Connection Problems


    # Check Listener Protocols


    Check the protocols the listener is configured for. This is displayed by the lsnrctl
    services command. Make sure the protocol the service matches the protocol the
    client is using when requesting a connection. If the client is requesting to connect
    with a protocol the listener is not listening for, the user will receive an ORA-12541
    “No Listener” error.


    # Check Server Protocols


    Make sure the underlying network protocol on the server is active. For systems
    that run TCP/IP, you can attempt to use the ping command to ping the server. This
    will verify that the TCP/IP daemon is active on the server. There are other ways
    to check this, such as verifying the services on Windows NT/2000 or with the ps
    command on Unix. An example of the ping command can be found in the next chapter.


    # Check Server Protocol Adapters


    Make sure the appropriate protocol adapters have been installed on the server.
    On most platforms, you can invoke the Oracle Universal Installer program and check
    the list of installed protocols. On Unix platforms, you can use the adapter utility
    to make sure the appropriate adapters have been linked to Oracle. An example of
    how to run this is provided below. This utility is located in the $ORACLE_HOME/bin
    directory.


    ```

    [root@localhost] ./adapters oracle

    ```


    Net protocol adapters linked with oracle are:


    +   BEQ

    IPC

    TCP/IP

    RAW


    Net Naming Adapters linked with oracle are:


    +   Oracle TNS Naming Adapter

    Oracle Naming Adapter'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Advanced Networking Option/Network Security products

    linked with oracle are:


    Oracle Security server Authentication Adapter


    If the required protocol adapter is not listed, you have to install the

    adapter. This can be done by using the Oracle Installer, installing the Oracle

    Net Server software, and choosing the appropriate adapters during the

    installation process.


    # Check for Connection Timeouts


    If the client is receiving an ORA-12535 or an ORA-12547 error, the client

    is is timing out before a valid connection is established. This can occur if

    a slow network connection. You can attempt to solve this problem by

    increasing the time that the listener will wait for a valid response from the
    client;

    simple set the CONNECT_TIMEOUT parameter to a higher number. This is the

    umber of seconds the listener waits for a valid response from the client

    when establishing a connection.


    # Oracle Net Logging and Tracing on the Server


    If a network problem persists, you can use logging and tracing to help

    resolve it. Oracle generates information into log files and trace files that

    assist you in tracking down network connection problems. You can use log-\ging
    find out general information about the success or failure of certain

    components of the Oracle Network. Tracing can be used to get in-depth

    information about specific network connections.


    > By default, Oracle produces logs for clients and the Oracle listener. Client

    logging cannot be disabled.


    Logging records significant events, such as starting and stopping the listener,

    along certain kinds of network errors. Errors are generated in the log in

    form of an error stack. The listener log records information such as the

    version number, connection attempts, and the protocols it is listening for.

    Logging can be enabled at the client, middle tier, and server locations.


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_114_0.png)'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Oracle Net Logging and Tracing on the Server


    Tracing, which you can also enable at the client, middle-tier, or server location,
    records all events that occur on a network, even when an error does not happen.
    The trace file provides a great deal of information that logs not, such as the
    number of network round trips made during network connection or the number of
    packets sent received during a network connection. Tracing enables you to collect
    a thorough listing of the statements as a network connection is being processed.
    This gives you a much more detailed picture of what is occurring with connections
    the listener processing.


    # Real World Scenario


    # Use Tracing Sparsely


    Tracing should be used only as a last resort if you are having connectivity problems
    between the client and server. You should complete all of the server-side checks
    described before you resort to tracing. This is because the trace process generates
    a significant amount of overhead, and depending on the trace level set, it can
    create very large files. This activity will impede system I/O performance because
    all of the information that is written to the logs, and if unchecked, it could
    fill up your disk or filesystem.


    I was once involved with a large project that was using JDBC to connect to the
    Oracle server. We were having difficulty with connections being periodically dropped
    between the JDBC client and the Oracle server. Tracing was enabled to try to assist
    in figuring out what the problem was. We eventually corrected the problem (it
    was a problem with how our DNS server was configured), but the tracing was left
    on inadvertently. We eventually went into production, the trace files grew so
    large that they filled up the disk. To prevent this happening, it is important
    to periodically ensure that the trace parameters are not turned on, and if they
    are, they should be turned off.


    Use the Oracle Net Manager to enable most logging and tracing parameters. Many
    of the logging and tracing parameters are found in the sqlnet.ora file. Let''s
    look at how to enable logging and tracing for the various components in an Oracle
    Network.'
  merge: -1
  img_proc: true
