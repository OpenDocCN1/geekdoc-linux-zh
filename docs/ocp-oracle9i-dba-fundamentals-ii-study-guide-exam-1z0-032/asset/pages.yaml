  md: 'of third-party GUI tools and batch commands. More recently, RMAN backups have
    become more popular with many sites (since the release of RMAN in Oracle8).


    The fundamentals of backing up an Oracle database can be seen clearly when you
    analyze an OS-based backup. Some of these basic techniques are utilized in the
    hot, or opened, backup examples, and are used in cold, or closed examples. If
    you have a solid understanding of these concepts, you should fully understand
    the backup process with RMAN-based backups.


    RMAN-based backups can perform the same functions as user-managed backups. But
    RMAN backups tend to be more standardized as a result of their use of a common
    command set. We demonstrated some of the commands that are involved in performing
    various backup operations within RMAN in this chapter.


    User-managed and RMAN-based backups are the two primary methods of backing up
    databases. You will be responsible for at least one of these types of backups,
    if not, in a real-world DAO job. Understanding how to perform user-managed backup
    and recovery is a necessary prerequisite for understanding RMAN-based backup and
    recovery. This knowledge will help you understand what RMAN is trying to do and
    improve.


    # Exam Essentials


    Understand user-managed backup and recovery. User-managed backup and recovery
    is a traditional process that uses OS and database commands to backup and recover
    the database.


    Know the backup issues that are associated with read-only tablespaces. Read-only
    tablespaces have special requirements for backup. If the tablespace was read-only
    at the time of backup, no recovery is needed, but if it was read-write, then recovery
    is needed.


    Identify the differences between open and closed backups. A closed backup is taken
    when the database is offline or has been shut down using all modes other than
    SHUTDOWN ABORT. In an open backup, the database is online or available during
    the backup process. You should also be familiar with the database commands that
    must be performed against the opened database before data files can be copied.


    Identify the different types of user-managed control file backups. The two formats
    of control file backups are binary format and ASCII format.'
