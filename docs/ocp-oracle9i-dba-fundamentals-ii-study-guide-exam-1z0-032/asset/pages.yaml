    # Dynamic Registration of Services


    Oracle9i databases have the ability to automatically register their presence with
    an existing listener. The instance will register with the listener defined on
    the local machine. Dynamic service registration allows you to take advantage of
    other features, such as load balancing and automatic failover. The PMON process
    is responsible for registering this with the listener.


    When dynamic service registration is used, you will not see the service listed
    in the listener.ora file. To see the service listed, you should run the llsnrctl
    services command. Be aware that if the listener is started after the Oracle instance,
    there may be a time lag before the instance accurately registers information with
    the listener.


    In order for an instance to automatically register with a listener, the listener
    must be configured as a default listener, or you must specify the init.ora parameter
    LOCAL_LISTENER. The LOCAL_LISTENER parameter defines the location of the listener
    with which you want the Oracle server to register. A default listener definition
    is show below:


    ```

    Listener Name = LISTENER

    Port = 1521

    Protocol = TCP/IP

    ```


    And here is an example of the LOCAL_LISTENER parameter being used to register
    the Oracle server with a non-default listener:


    ```

    local_listener="(ADDRESS_LIST = (Address =

    (Protocol = TCP)(Host=weishan))

    ```


    In the example above, the Oracle server will register with the listener on Port
    1522 using TCP/IP. This is a non-default port location, so you must use the LOCAL_LISTENER
    parameter in order for the registration to take place.


    Copyright©2002 SYSEX, Inc., Alameda, CA'
