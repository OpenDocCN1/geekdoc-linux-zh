  md: 'Chapter 9 • User-Managed and RMAN-Based Backups


    Understand what needs to be cleaned up after an online backup fails.

    V$BACK view can be used to see the status of the data files after a failed online
    backup. The V$BACK view shows whether a data file is ACTIVE or INACTIVE in the
    backup process.


    Understand how the DBVERIFY utility works to detect corruption.

    The DBVERIFY utility works on online and offline data files to identify corrupted
    blocks.


    Identify the types of RMAN-specific backups. The three types of RMAN backups are
    full/incremental, open/closed, and consistent/inconsistent.


    Understand the difference between backup sets and image copies.

    Backup sets are backups that are stored in a specific RMAN format; image copies
    are backups of actual database files in the same format as the OS. You should
    also be familiar with the BACKUP command options and formats.


    Know how to use RMAN commands to backup control files and archived redo logs.
    You should know how to use all of the necessary RMAN commands with the proper
    syntax to backup control files and archived logs.


