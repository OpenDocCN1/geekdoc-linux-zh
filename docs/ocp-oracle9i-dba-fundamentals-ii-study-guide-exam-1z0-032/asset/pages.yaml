  img_proc: true
- pgno: 234
  md: '# Summary 191


    Now that the power spike is over, the system administrator must get the servers
    restarted and the database administrator needs to validate that the databases
    are available again. When this is done, the administrators find out that the manufacturing
    database thinks that the data has been transferred to financial database, but
    the data never actually made it into the financial database before the instance
    failure.


    As a result, the databases are out of synchronization with each other and the
    data inconsistencies must be manually tracked down. The analysts and business
    people must determine what did or didn''t make it to the appropriate database
    by a series of ad hoc SQL statements.


    # Summary


    The recovery structures and processes available in Oracle allow recovery options
    for the DBA. These recovery structures consist of files, memory buffers, and logical
    objects that reside in the database. In addition to these recovery structures,
    this chapter also identified the file structures—redo logs, archived logs, control
    files, data files, and parameter files—and the processes, which are PMON, SMON,
    LGWR, CKPT, and ARC. It then discussed the memory structures, which consist of
    log buffers and data buffers. All of these structures play different roles in
    the recovery process, and they can be used for different types of recovery.


    This chapter also described the checkpoint point. During this discussion, you
    learned the importance of SCNs and how these identifiers determine the consistency
    of the transactions that have been applied to the database.


    In addition, you viewed the three main initialization parameters that you will
    need to tune the recovery process. It is through these the DBA can constrain the
    time of the recovery process to recover to approximate limits. These parameters
    can be monitored by a series of V$ views.


    This chapter lays the groundwork for making decisions in the backup and recovery
    process for later chapters and the real world. It is vital that you understand
    how the file structures and process that are discussed in this chapter function
    to make the database consistent or inconsistent in a failure'
