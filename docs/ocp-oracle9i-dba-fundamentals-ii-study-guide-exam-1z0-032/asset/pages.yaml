  md: '# Summary


    The Oracle SQL*Loader utility is a tool designed to load external data into the
    Oracle database. There are three methods of loading data when we are using the
    SQL*Loader: the conventional load, the direct-path load, and the external-path
    load.


    The direct-path insert DML statement that run in SQL*Plus is similar to the direct-path
    load in SQL*Loader. This method has both serial and parallel load options.


    There are some basic SQL*Loader activities that can help you become familiar with
    some of the uses of the SQL*Loader tool, and there are several commands, formats,
    and methods that you can use to run SQL*Loader. In addition, there are several
    usage guidelines for SQL*Loader.


    The topics covered in this chapter will be covered and are valuable in real-world
    situations. SQL*Loader and direct-load insert can be used for a variety of purposes.
    SQL*Loader is very useful to load bulk data from one database to another. The
    direct-load insert operation is useful when you are making table backups within
    the database or you are moving data from one table to another. Both of these tools
    are valuable assets for the DBA.


    # Exam Essentials


    Understand direct-load insert operations. Know that direct-load insert is a DML
    statement that passes data from one table to another within the Oracle database.
    When you use this DML statement, you can bypass the SQL buffer cache and direct
    loads into the data blocks within the targeted tables.


    Know the files used with SQL*Loader. Be able to list the files used with SQL*Loader—the
    control file, the bad log, the discard log, the general log, and the input data,
    or data file—make sure you understand the purpose of each of these files.


    Know the methods SQL*Loader uses to load data. SQL*Loader uses the conventional
    load, the direct-path load, and the external-path load to load data. The direct-path
    load is used to improve performance, the conventional load is used for normal
    operations, and the external-path load is a specialized load option used only
    for external tables.'
