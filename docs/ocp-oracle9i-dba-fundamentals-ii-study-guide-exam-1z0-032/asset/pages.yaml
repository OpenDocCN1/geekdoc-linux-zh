    # Summary


    In this chapter, we have demonstrated multiple RMAN maintenance commands and the
    uses of these commands. Essentially, they are used to keep your tape or disk backups
    synchronized with your catalog.


    We also demonstrated how to perform RMAN maintenance operations that cross check
    catalog entries with the actual backup media, update the catalog for a deleted
    backup, change the status of backups and copies, and exempt a backup from the
    retention policy.


    In addition, we noted special commands for maintenance operations and cataloged
    non-RMAN files, such as database files, within the RMAN catalog.


    RMAN maintenance commands are required for testing but are essential when you
    are trying to manage the RMAN environment in the workplace. This chapter is full
    of many commands that are used to perform such maintenance activities. Make sure
    that you understand the command syntax and how to use them. When you understand
    all of this, you should be comfortable when you are confronted with the problems
    that present themselves on the test and in the workplace.


