- pgno: 381
  md: '+   7. Perform an incomplete recovery using the UNTIL CANCEL clause in the
    RECOVER DATABASE command.


    ```

    SQL> recover database until cancel;

    ```


    +   8. Open the database with the RESETLOGS option.


    ```

    SQL> alter database open resetlogs;

    ```


    You must use the RESETLOGS clause with the ALTER DATABASE OPEN command for all
    types of incomplete recovery. The RESETLOGS option ensures that the log files
    applied in recovery can never be used by resetting the log sequence and rebuilding
    the existing online logs. This process permanently deactivates all transactions
    that exist in the nonarchived log files so they can never be recovered. At the
    same time, it resynchronizes log files with the data files and control files.
    If these transactions were not purged, the log files would create bad archived
    logs. This is the main reason why backup of the control file, data files, and
    redo logs should be done prior to performing an incomplete recovery.


    +   9. Perform a new cold or hot backup of the database. Existing backups are
    no longer valid.


    > Remember, after the ALTER DATABASE OPEN RESETLOGS command is applied, the previous
    log files and backed-up data files are useless for this newly recovered database.
    This is because a gap exists in the log files. The old backup data files and logs
    can never be synchronized with the database. Thus, a complete backup must be performed
    after an incomplete recovery of any type.


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_381_0.png)


