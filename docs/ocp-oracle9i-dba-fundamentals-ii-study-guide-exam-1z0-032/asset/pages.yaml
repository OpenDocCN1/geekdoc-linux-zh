- pgno: 332
  md: '# 290 Chapter 10 • User-Managed Complete Recovery and RMAN Complete Recovery


    Media failure requires database recovery. If the database is in ARCHIVOG mode,
    complete recovery can be performed. This means that a backup can be restored to
    the affected filesystem, and archived logs can be applied up to the point of failure.
    Thus, no data is lost.


    If the database is in NOARCHELOG mode, however, a complete recovery cannot be
    performed without some transactions lost. This means that a backup can be restored
    to the affected filesystem, but there won''t be any archived logs or historical
    changes saved. Thus, the database will have only the transactions that were available
    at the time of the backup. If backups were scheduled every night, the business
    would lose only one day''s worth of transactions. If backups were scheduled weekly,
    on the other hand, the business would lose one week''s worth of transactions.
    The end result is that, in almost all cases, some data will be lost. This is a
    complete recovery of the database does not contain all the transactions up to
    the failure point. The end result is that the database will be restored to an
    incomplete recovery, which will be covered in Chapter 11, "User-Managed and RMAN-Based
    Incomplete Recovery." The differences are that an incomplete recovery will be
    intentionally stopped before all the transactions are applied to the database,
    and an incomplete recovery requires the database to be in ARCHIVOG mode and some
    other actions to be performed.


    # Performing User-Managed Recovery in NOARCHELOG Mode


    This is an example of a user-managed recovery when the database is in NOARCHELOG
    mode. In this case, the database cannot be completely recovered. The database
    is available all day during the week. Every Saturday, the database is shut down,
    and a complete, cold backup (offline backup) is performed. The database is restarted
    when this activity is completed.


    # Diagnosing the Failure


    On Wednesday morning, there is a lost or deleted data file in the database. The
    error received upon startup is as follows:


    ```

    SQL> startup

    ORACLE instance started.

    Total System Global Area 19504528 bytes

    Fixed Size 64912 bytes

    Variable Size 16908288 bytes

    Database Buffers 2457600 bytes

    Redo Buffers 73728 bytes

    ```


    Copyright©2002 SYBEX, Inc., Alameda, CA www.symtex.com'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Recovering Using NOARCHIVELOG and ARCHIVELOG Modes 291


    Database mounted.

    ORA-01157: cannot identify/lock data file 4 - see

    DBWR trace file

    ORA-01110: data file 4:

    ''/db01/Oracle/tst9/users01.dbf''


    Because you are operating in NOARCHIVELOG mode, you must perform a full database
    restore from the previous weekend. You cannot perform a tablespace or data file
    recovery in NOARCHIVELOG mode because you have no ability to roll back and roll
    forward historical changes. There are no archived logs to apply to the data file
    to make the data file current with the rest of the database. Data entered into
    the database on Monday, Tuesday, and Wednesday are lost and must be reentered,
    if possible.


    To perform the database restore, you will need to copy all the data files, online
    redo logs, and control files from the last Saturday backup and perform a full
    database restore. You will then copy these files to their original locations.


    # Step-by-Step Recovery


    To recover a lost data file when you are operating in NOARCHIVELOG mode, take
    the following steps:


    +   1. Perform a cold backup of the database to simulate the Saturday backup.
    The following is a sample script, which performs a cold backup by shutting down
    the database and copying the necessary data files, redo logs, and control files.


