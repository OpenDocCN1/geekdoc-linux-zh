    # Server Tracing


    As mentioned earlier, tracing gathers information about the flow of traffic across
    a network connection. Data is transmitted back and forth in the form of packets.
    A packet contains sender information, receiver information, and data. Even a single
    request may generate a large amount of packets.


    In the trace file, each line of the file starts with the procedure executed in
    one of the Oracle Net layers followed by a set of hexadecimal numbers. The hexadecimal
    numbers are the actual data transmitted. If you are not encrypting the data, sometimes
    you will see the actual data after the hexadecimal numbers.


    Each of the Oracle Net procedures is responsible for a different action. Each
    packet has a different code type depending on the action taken. Each of the packet
    types starts NSP. Here is a summary of the common packet types.


    | Packet Keyword | Packet Type |

    | --- | --- |

    | NSPTAC | Accept |

    | NSPTRF | Refuse |

    | NSPTRS | Resend |

    | NSPDA | Data |

    | NSPCNL | Control |

    | NSPTMK | Marker |


    ![](img/4d4ebf1b63c52ce2a364aa79830c39e0_117_0.png)


    If you are doing server-to-server communications and have a sqlnet.ora file on
    the server, you can, enter information in the Server Information section of the
    Oracle Net Manager tracing screen. This provides tracing information for server-to-server
    communications.


    Copyright ©2002 SYBEX, Inc., Alameda, CA www.syex.com'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'There are also several numeric codes that are used to diagnose and troubleshoot
