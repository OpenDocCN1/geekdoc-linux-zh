  md: '# External-Path Load


    External-path load is specialized to the SQL*Loader utility to be used on external
    tables. By default, the external-path load is attempted if parallel the table
    is made up of multiple data files. External tables are tables that are stored
    outside the database and have special restrictions (such as they are read-only).
    External tables are used primarily as temporary storage tables that can be loaded
    into normal database tables at some point.


    Let''s go through a brief overview of the necessary components for creating the
    external table. The command used to create external tables is very similar to
    a standard table creation command; it CREATE TABLE <table>name ORGANIZATION EXTERNAL.
    In addition, a logical directory that designates the files that make up the external
    table will need to be created. The command is CREATE DIRECTORY EXTERNAL_TAB_DIR
    as ''/u01/ora9i/extfiles''. Once these steps have been completed, the schema that
    will create the table will need read and/or write privilege granted to the external
    directory, in which case is EXTERNAL_TAB_DIR.


    # Real World Scenario


    # Adjusting the High-Water Mark with Direct-Path Load


    When you are using SQL*Loader''s direct-path load method, you can insert data
    directly into the data blocks within a table. When you do this, Oracle will not
    be able to identify whether the data blocks have data or not. As a result, every
    time you use direct-path load, Oracle must put data in the high-water mark in
    the table. But this is not a problem if you are prepared for the space usage in
    the table to increase and such usage is part of your growth plan. If you aren''t
    prepared, the table will grow rapidly each you load the data and it will consume
    unnecessary space.


    If you are reloading data into a table and replacing the old data, you may want
    to truncate the table before you do so in order to reset the high-water mark.
    This will prevent your table from growing the size of the data load each time
    the table is loaded.'
