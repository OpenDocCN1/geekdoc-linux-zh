- pgno: 197
  md: '# Answers to Review Questions


    +   1. Shared Server is a scalability option of Oracle. It provides a way to increase
    the number of supported user processes while reducing the overall memory usage.
    This configuration is well suited to high-volume, small transaction-oriented systems
    with many users connected. Because users share processes, there is an overall
    reduction of the number of idle processes. It is not well suited for large data
    retrieval type applications.


    +   2. Users can still request dedicated connections in a shared server configuration.
    Bequeath and dedicated connections are one and the same. The database cannot be
    stopped or started when a user is connected over a shared server connection.


    +   3. A user must explicitly request a dedicated connection when a server is
    configured in Shared Server mode. Otherwise, the user will get a shared connection.
    The correct parameter is (SERVER=DEDICATED).


    +   4. The shared server configuration parameters exist in the init.ora file on
    the Oracle server machine.


    +   5. In Shared Server, users connect to a pool of shared resources called dispatchers.
    A client connects to the listener and the listener redirects the request to a
    dispatcher. The dispatchers handle all of the requests for the session. Many users
    can share dispatchers.


    +   6. Because the database has to be configured in Shared Server mode, changes
    have to be made to the init.ora file. The other choices are also configuration
    files, but none of them are used to configure Shared Server.


    +   7. This is one of the tricky questions again! Many options and files can be
    configured by the Oracle Net Manager, including tnsnames.ora and sqlnet.ora. But
    because Shared Server is a characteristic of the database server and not of the
    network, Oracle Net Manager is not used to configure it.'
  merge: -1
  img_proc: true
