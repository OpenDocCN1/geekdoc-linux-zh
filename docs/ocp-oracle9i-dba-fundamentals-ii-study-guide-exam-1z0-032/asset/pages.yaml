- pgno: 201
  md: '![](img/4d4ebf1b63c52ce2a364aa79830c39e0_201_0.png)


    # B


    backup and recovery in an Oracle database environment can be simple or complex
    depending on the requirements of the business environment the database provides
    methods for supporting such environments, and each of these methods requires different
    levels of complexity for backup and recovery operations.


    First of all, there are multiple types of failures that may occur in an Oracle
    database environment. Each of these can result in different types of recovery
    operations. You must understand these types of failure in order to make the correct
    recovery decisions.


    Once you understand Oracle backup and recovery and the possible types of Oracle
    database failures, you will be able to create a backup and recovery strategy.
    When you are determining this strategy, you will need to consider a number of
    issues. First of all, keep in mind that in order for backup and recovery to be
    successful, everyone from the technical team through management must understand
    the requirements and the effects of the backup and recovery strategy. If this
    strategy is agreed upon and in place, a disaster recovery plan can be based upon
    this strategy. When you are creating your disaster recovery plan, it''s important
    that you understand the options for high availability, as well as the options
    for configuring your database for recovery. After you have successfully created
    this plan, the final step is to test it.


    This chapter takes step-by-step through the basic principles of backup and recovery:
    it introduces you to the types of failures that may occur, and to the backup and
    recovery strategy. In the end, you should be comfortable with your knowledge of
    what is involved in the Oracle database, restore, and recovery process. You should
    understand enough about the different types of failures so that you can identify
    the appropriate course of action to implement in a recovery situation. This level
    of understanding will not only make your job as a DBA easier, but it should also
    make you much more comfortable.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Database Backup, Restoration, and Recovery


    If you understand and can identify the aspects of the Oracle database that are
    required for normal operation, you will understand what must be backed up, restored,
    and recovered.


    The Oracle database is made up of a set of physical structures that must be present
    and consistent for the database to function normally. At a minimum, these physical
    structures consist of data files, redo logs, control files, and initialization
    files.


    If any of these files are not present, the database may not start up or it may
    halt during normal operations. All of these files must be backed up on a regular
    basis to disk, tape, or both. Such a backup consists of a user-managed backup
    or Recovery Manager (RMAN)-based backup. A user-managed backup consists of any
    custom backup; such a backup is usually performed in an OS script such as a Unix
    script or the DOS-based batch script. These scripts execute database commands
    and OS commands to copy the necessary database files to disk or tape. An RMAN-based
    backup is performed by the Oracle recover manager utility, which is part of the
    Oracle software. RMAN backups are performed by executing standard RMAN commands
    or scripts.


    Both of these backups can be used to restore the necessary database files from
    disk to the desired location. The restore process consists of copying the database
    files from tape or disk to a desired location so that database recovery can begin.


    The recovery process consists of starting the database and making consistent a
    complete or partial backup copy of some of the physical structures of the database.
    Recovery has many options depending on the type of backups that are performed.
    We will discuss the different types of recovery in user-managed and RMAN-based
    situations in later chapters.


    # Types of Failure in Oracle Environments


    There are two major categories of database failures: non-media failures and media
    (disk) failures. Non-media failures consist of four types of failures, which are
    typically less critical in nature. Media failures have only one type of'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Chapter 5 • Backup and Recovery Overview


    failure, which is generally more critical in nature—the inability to read or write
    from a database file.


    # Non-Media Failures


    This type of failure is made up of statement failures, process failures, instance
    failures, user errors, and it is almost always less critical than a media failure.
    In most cases, statement, process, and instance failures are automatically handled
    by Oracle and no DBA intervention can require a manual recovery performed by the
    DBA.


    Statement failure consists of a syntax error in the statement, and Oracle usually
    returns an error number and description. Process failure usually occurs when the
    user program fails for some reason, such as when there is an abnormal disconnection
    or a termination. The process monitor (PMON) usually handles up the terminated
    process. Instance failure occurs when the database instance abnormally terminates
    due to a power spike or outage. Oracle handles this automatically upon start-up
    by reading the current redo logs and applying the necessary changes back to the
    data. Error occurs when a table is erroneously dropped or data is erroneously
    removed.


    # Media, or Disk, Failures


    Media failures are the most critical. A media failure occurs when the database
    fails to read or write from a file that it requires. For example, a disk drive
    could fail, a controller supporting a disk drive could fail, or a database file
    could be removed, overwritten, or corrupted. Each type of media failure that requires
    a different method for recovery.


    The basic steps you should take to perform media recovery are as follows:


    +   1. Determine which files will need to be recovered: data files, control files,
    and/or redo logs.


    +   2. Determine which type of media recovery is required: complete or incomplete,
    opened database, or closed database. (You will learn about these types of recovery
    in later chapters.)


    +   3. Restore backups of the required files: data files, control files, and offline
    redo logs (archived logs) necessary to recover.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Defining a Backup and Recovery Strategy 161


    +   4. Apply offline redo logs (archived logs) to the data files.


    +   5. Open the database at the desired point, depending on whether you are performing
    a complete or an incomplete recovery.


    +   6. Perform frequent testing of the process. Create a test plan of typical
    failure scenarios.


    # Defining a Backup and Recovery Strategy


    To create a solid backup and recovery strategy, you must keep in mind six major
    requirements:


    +   * The amount of data that can be lost in the event of a database failure


    +   * The length of time that the business can go without the database in the
    event of a database failure


    +   * Whether the database can be offline to perform a backup, and if so, the
    length of time that it can remain offline


    +   * The types of resources available to perform backup and recovery


    +   * The procedures for undoing changes to the database, if necessary


    +   * The cost of buying and maintaining hardware and performing additional backups
    versus the cost of replacing or re-creating the data in a disaster


    All of these requirements must clearly be understood before you plan a backup
    and recovery strategy.


    # Losing Data in a Database Failure


    The amount of data that can be lost in a failure helps determine the backup and
    recovery strategy that gets implemented. For instance, if losing a week''s worth
    of data in the event of failure is tolerable, a weekly backup may be a possible
    option. On the other hand, if no data can be lost in the event of failure, then
    weekly backups would be out of the question and backups would need to be performed
    daily.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Surviving without the Database in a Database Failure


    If the company database were to fail during an outage, how long would it take
    for the business to be negatively affected? Generally, this question can be answered
    by management. If all data is entered manually by data entry, the downtime could
    be relatively long without hurting the business operations. The business could
    potentially operate normal by generating orders or forms that could be entered
    into the database later. This type of situation could have minimal effect on the
    business.


    On the other hand, a financial institution that senses and receives data electronically
    24 hours a day can''t afford to be down for any time at all, and if it were, business
    operations would most definitely be impaired. The electronic transactions could
    be unusable until the database was recovered.


    After you determine how long the business could survive without a database, you
    can use the mean time to recovery (MTTR) to figure out the average amount of time
    the database could be if it were to fail. The MTTR is the average time it takes
    to recover from certain types of failure. You should record each type of failure
    that is tested so that you can determine an average recovery time. The MTTR can
    help determine recovery times for different failure scenarios. You can document
    these times during your testing cycles.


    # Performing an Offline Backup


    To determine whether it is possible to perform a database backup if the database
    is offline or shut down, you must first know how long the database can afford
    to be out of commission.


    For example, if the database is being used with an Internet site that has national
    or international access, or if it is used with a manufacturing site that works
    two or three shifts across different zones and has nightly batch processing, then
    it would have to be available 24 hours a day. In this case, the database would
    always need to remain online, with the exception of scheduled downtimes for maintenance.
    In this case, an online backup, or hot backup, would need to be performed. This
    type of backup is done when the database is online or running.


    Businesses that don''t require 24-hour availability and do not have long batch
    processing activities in the evening could potentially afford to have the'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Defining a Backup and Recovery Strategy 163


    database offline on regular nightly intervals for an offline backup, or *cold
    backup*. In this scenario, each site should conduct their own backup tests with
    factors unique to their environment to determine how long it would take to perform
    a cold backup. If the database downtime is acceptable for that site, then a cold
    backup could be a workable solution.


    # Knowing Your Backup and Recovery Resources


    The personnel, hardware, and software resources available to the business also
    affect the backup and recovery strategy. Personnel resources would include at
    adequate support from a database administrator (DBA), system administrator (SA),
    and operator. The DBA would be responsible for the technical piece of the backup,
    such as user-managed scripts or Recovery Manager (RMAN) scripts. A user-managed
    backup is OS backup written in an OS scripting language, such as the Korn in the
    Unix OS RMAN is an automated tool from Oracle that can perform the backup and
    recovery process. The SA would be involved in some aspects of the scripting, tape
    software, and tape hardware. The operator might be involved in changing tapes
    and ensuring the proper tape cycles are followed.


    The hardware resources could include an automated tape library (ATL), a stand-alone
    tape drive, adequate staging disk space for scripted hot backups and exports,
    adequate log disk space, and disk mirrors. Many storage system hardware vendors
    are offering their own disk mirror options or equivalents. These create disk copies
    of 100 gigabytes and greater in a few minutes. All types of disk subsystems be
    at least mirrored or use some form of Redundant Array of Inexpensive Disks (RAID),
    where performance is not compromised.


    The software resources could include backup software, scripting capabilities,
    and tape library software. The Oracle RMAN utility comes the Oracle9i Server software
    is installed when selecting all components of Oracle9i Enterprise Server.


