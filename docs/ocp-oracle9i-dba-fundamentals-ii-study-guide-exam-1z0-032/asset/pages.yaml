    Here is a summary of the numeric codes that you could encounter in a trace file.


    | Code | Packet Type |

    | --- | --- |

    | 1 | Connect packet |

    | 2 | Accept packet |

    | 3 | Acknowledge packet |

    | 4 | Refuse packet |

    | 5 | Redirect packet |

    | 6 | Data packet |

    | 7 | Null packet, empty data |

    | 9 | Abort packet |

    | 11 | Resend packet |

    | 12 | Marker packet |

    | 13 | Attention packet |

    | 14 | Control information packet |


    # Enabling Server Tracing


    You can enable server tracing from the same Oracle Net Manager radio screens shown
    earlier. Simply choose the Tracer Enabled radio button. The default filename and
    location is ORACLE_HOME/network/trace/listener.tr in Unix and ORACLE_HOME\network\trace\listener.tr
    on Windows NT/2000. You can set the trace level to OFF, USER, ADMIN, or SUPPORT.
    The USER level will detect specific user errors. The ADMIN level contains all
    of the user-level information along installation-specific errors. SUPPORT is the
    highest level and can be used to produce information that may be beneficial to
    Oracle'
  merge: -1
