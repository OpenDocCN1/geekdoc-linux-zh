- pgno: 141
  md: '# Configuring Multiple Services on the Same Host Hostnaming


    If you have multiple Oracle servers on the same machine, it is possible to continue
    the hostnaming method. To do so, you must have separate-name address entries in
    your HOSTS file or in your external naming service for each of the separate Oracle
    servers. For example, if we had two Oracle servers, called DBA and one called
    PROD, on an IP address of 10.2.0.91, you could configure your HOSTS name with
    following entry:


    +   - 10.2.0.91 DBA Alias for MACH1 server for DBA

    - 10.2.0.91 PROD Alias for MACH1 server for PROD PROD


    Notice that each of these names resolves to the same IP address. You also need
    to configure your listener with two entries, one for DBA and one for PROD, both
    with the GLOBAL_DBNAME parameter set to DBA and PROD respectively. If you were
    using the hierarchical naming model with domain names, include the domain name
    on the GLOBAL_DBNAME parameter.


    # The Localnaming Method


    The localnaming method is probably the most widely used and well-known method
    of resolving net service names. Most users know how this method works because
    it uses the tnsnames.ora file


    To use the localnaming method, you must configure the tnsnames.ora file, which
    can be in any location, as long as the client can get to it. The default location
    for the tnsnames.ora file and the sqlnet.ora file is %ORACLE_HOME\network\admin
    on Windows NT/2000, and %ORACLE_HOME/network/admin on Unix systems. If you want
    to change the location of this file, the environment variable TNS_ADMIN. TNS_ADMIN
    can be exported to the user''s environment or be set in the user''s profile. In
    Windows NT/2000 this setting is placed in the Registry. The Windows NT/2000 Registry
    key stores the TNS_ADMIN which may vary depending on your particular setup. Generally,
    it can be found somewhere in the Hkey_local_machine/software/oracle Registry key,
    but it may be at a lower level depending on your configuration.


    Most installations probably keep the files in these default locations on the client
    and server. Some users create shared disks and the tnsnames .ora and sqlnet.ora
    files in this shared location to take a centralized approach to managing these
    files. If server-to-server communication is necessary, these files need to be
    on the server. The default location on the server is the same as the default location
    on the client.'
  merge: -1
  img_proc: true
