    # The Oracle Listener


    The Oracle listener is the main server-side Oracle networking component that allows
    connections to be established between client computers and an Oracle database.
    You can think of the listener as a big ear that listens for connection requests
    to Oracle services.


    The type of Oracle service being requested is part of the connection descriptor
    information supplied by the process requesting a connection, and the service name
    resolves to an Oracle database. The listener can listen for any number of databases
    configured on the server, and it is able to listen for'
