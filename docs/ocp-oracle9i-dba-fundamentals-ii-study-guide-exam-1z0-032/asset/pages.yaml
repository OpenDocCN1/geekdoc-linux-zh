- pgno: 404
  md: '# Answers to Review Questions


    +   1. A, B, D. Options A, B, and D all describe valid types of incomplete recovery.
    Options C and E are not incomplete recovery types.


    +   2. E. Incomplete recovery cannot be performed in NOARCHIVELOG mode.


    +   3. E. Incomplete recovery cannot be performed unless a new backup is taken
    after the first failure. All backups prior to an incomplete recovery are invalidated
    for use with any of the existing data files, control files, or redo logs.


    +   4. C. The system change number, or SCN, uniquely identifies each committed
    transaction in the log files.


    +   5. B, C, D. All forms of incomplete recovery require the use of the RESETLOGS
    clause during the ALTER DATABASE OPEN command. All redo logs must be reset to
    a new sequence number. This invalidates all prior logs to that database.


    +   6. B. A backup of the database should be performed if the ALTER DATABASE OPEN
    RESETLOGS command has been applied.


    +   7. C. Change-based recovery gives the DBA the most control of the incomplete
    recovery process because it allows the stopping point to be specified by the SCN
    number.


    +   8. A. Cancel-based recovery applies the archived log before it cancels or
    stops the recovery process. Therefore, you cannot recover part of the transactions
    within the archived log as with change-based time-based recovery.


    +   9. B. RMAN time-based recovery applies the changes in an archived log to the
    point in time reference specified in the SET UNTIL TIME command.


    +   10. A. Anytime the database is opened with the RESETLOGS options, will need
    to reset the target database in the recovery catalog.'
