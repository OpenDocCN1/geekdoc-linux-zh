- pgno: 276
  md: '# Storing Information Using the RMAN Repository and Control Files 233


    or in the target database''s control file is also called the RMAN repository.
    The target database''s control is always updated, whether the catalog is used
    or not. In the next paragraph, we will discuss the recovery catalog as the RMAN
    repository for storing information, and then we will list the commands you can
    use in this method. Following this list, we will focus on using the control file
    as the RMAN repository.


    Oracle recommends that you store RMAN backup data in the recovery catalog database
    as opposed to the control file of the target. If you store the data in this manner,
    the RMAN utility will have full functionality. This recovery catalog database
    is another Oracle database that has special RMAN catalog tables that store metadata
    about backups in the same way that a data dictionaries store data objects in the
    database. Activities such as crossing backups and available tapes can be performed.
    Also, using this method, backup scripts can be created and stored in the recovery
    catalog database for later use. This database can be backed up so that the information
    it contains is safe. We will discuss the recovery catalog database in more detail
    in Chapter 13, "Recovery Catalog Creation and Maintenance."


    Before we move on to the second method in detail, take a look at these commands.
    They are allowed only if you use the RMAN recovery catalog as the RMAN repository.


    +   - CREATE CATALOG

    - UPGRADE CATALOG

    - DROP CATALOG

    - CREATE SCRIPT

    - DELETE SCRIPT

    - REPLACE SCRIPT

    - LIST STORED FILES

    - LIST INCARNATION

    - REGISTER DATABASE

    - REPORT SCHEMA AT TIME

    - RESET DATABASE

    - RESYNC CATALOG'
