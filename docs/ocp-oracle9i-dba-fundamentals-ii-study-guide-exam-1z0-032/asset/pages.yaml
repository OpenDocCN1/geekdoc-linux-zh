  md: '# Answers to Review Questions


    +   1. All of these are examples of network connectivity configurations. Networking
    can be as simple as a dumb terminal connected directly to a server via a serial
    connection. It can also be as complex as an n-tier architecture that may involve
    clients, middleware, the Internet, and database servers.


    +   2. Oracle Advanced Security would not solve this problem because it addresses
    security and accessibility to non-Oracle databases. Oracle Net would be part of
    the solution, but another Oracle Network component is necessary. Connection Manager
    would also not be able to accommodate this requirement on its own. Heterogeneous
    Services is the correct answer because these services provide cross-platform connectivity
    to non-Oracle databases.


    +   3. Oracle Net is included in the Oracle Enterprise installation and works
    with a variety of protocols. It also has a client and server component. The only
    statement that is true about Oracle Net is that it has an Applications Program
    Interface (API), which means that third-party software can write to these specifications
    to interact directly with Oracle Net.


    +   4. Advanced Security, Heterogeneous Services, and Oracle Shared Server would
    not provide a solution to this business because none of these address the issue
    of centrally managing network services. The best solution to the problem is the
    Oracle Internet Directory which would facilitate centralized naming.


    +   5. TCP/IP, DECnet, and LU6.2 are all examples of network protocols.


    +   6. Oracle Net allows for support of multiple protocols. TCP/IP and LU6.2 are
    two examples of the protocols that Oracle Net supports.


    +   7. The General Inter-ORB Protocol is a protocol that supports connectivity
    of Java components.'
