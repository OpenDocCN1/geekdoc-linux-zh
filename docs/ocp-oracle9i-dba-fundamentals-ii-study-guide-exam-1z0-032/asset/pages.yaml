    # # Stopping the Listener


    In order to stop the listener, you must issue the lsnctl stop command. This command
    will stop the default listener. To stop a non-default listener, include the name
    of the listener. For example, to stop LISTENER1, type **lsnrctl stop listener1**.
    If you are in the lsnctl> facility, you will stop whatever listener is the current
    listener defined by the current_listener setting. To see what the current listener
    is set to, use the **show** command. The default value is LISTENER.


    Stopping the listener does not affect clients connected to the database. It only
    means that no new connections can use this listener until the listener is restarted.
    The following code shows what the **stop** command looks like:


    ```

    C:\lsnrctl stop

    ```'
