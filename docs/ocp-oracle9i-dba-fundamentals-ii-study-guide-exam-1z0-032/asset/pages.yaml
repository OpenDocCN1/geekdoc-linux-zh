    # Multiple Archive Processes and Locations


    Having multiple archive processes can make the archived log creation process faster.
    Significant volumes of data are going through the redo logs, the archiver can
    be a point of contention. This means that redo logs could wait or delay archive
    activity while trying to write out an archived log. Furthermore, the archiver
    has more work to do if the database is writing to multiple destinations. Thus,
    multiple archive processes can do the extra work to support the additional archive
    destinations.


    To implement these new features, the database must be in ARCHIVELOG mode. (Set
    the database to ARCHIVELOG mode, perform the steps shown earlier in the section
    entitled "Configuring a Database for ARCHIVELOG mode and Automatic Archiving.")
    To verify that the database is in ARCHIVELOG mode, either run an ARCHIVE LOG LIST
    command or query the V$DATABASE view, as shown earlier:


