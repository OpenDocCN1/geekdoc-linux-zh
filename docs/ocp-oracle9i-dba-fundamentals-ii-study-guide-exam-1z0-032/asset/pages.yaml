- pgno: 8
  md: '# Introduction


    There is high demand for professionals in the information technology (IT) industry,
    and Oracle certifications are the hottest credential in the database world. You
    have made the right decision to pursue certification, because being Oracle certified
    will give you a distinct advantage in this highly competitive market.


    Many readers may already be familiar with Oracle and do not need an introduction
    to the Oracle database world. For those who aren''t familiar with the company,
    Oracle, founded in 1977, sold the first commercial relational database and is
    now the world''s largest database company and the second-largest independent software
    company, serving more than $10 billion, serving more than 145 countries.


    Oracle databases are de de facto standard for large Internet sites, and Oracle
    advertisers are boastful but honest when they proclaim, “The Internet Runs on
    Oracle.” Almost all big Internet sites run Oracle databases. Oracle''s penetration
    of the database market runs deep and is not limited to deom implementations. Enterprise
    resource planning (ERP) application suites, data warehouses, and custom applications
    at many companies rely on Oracle. The demand for DBA resources remains higher
    than others during economic times.


    This book is intended to help you on your exciting path toward becoming Oracle9i
    Certified Professional (OCP) and Oracle Certified Master (OCM). To get the maximum
    benefit from this book, you should already be knowledgeable in networking, operating
    systems, Oracle SQL, and DBA concepts. Using this book and a practice database,
    you can start learning Oracle and pass the Z10-032 test: Oracle9i Database: Fundamentals
    II.


    # Why Become an Oracle Certified Professional?


    The number one reason to become an OCP is to gain more visibility and greater
    access to the industry''s most challenging opportunities. Oracle certification
    is the best way to demonstrate your knowledge and skills in Oracle database systems.
    The certification tests are scenario-based, which is the most effective way to
    assess your hands-expertise and critical-problem solving skills.


    Certification is proof of your knowledge and shows that you have the skills required
    to support Oracle core products. The Oracle certification program'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Introduction


    can help a company identify proven performers who have demonstrated their skills
    and who can support the company''s investment in Oracle technology. It demonstrates
    that you have a solid understanding of your job role and the Oracle products used
    in that role.


    OCPs are among the best paid in the IT industry. Salary surveys consistently show
    the OCP certification to yield higher salaries than other certifications, including
    Microsoft, Novell, and Cisco.


    So, whether you are beginning a career, changing careers, securing your present
    position, or seeking to refine and promote your position, this book is for you!


    # Oracle Certifications


    Oracle certifications follow a track that is oriented toward a job role. There
    are database administration, database operator, and developer tracks. Within each
    track, Oracle has a three-tiered certification program:


    +   - The first tier is the Oracle Certified Associate (OCA). OCA certification
    typically requires you to complete two exams, the first via the Internet and the
    second in a proctored environment.


    +   - The next tier is the Oracle Certified Professional (OCP), which builds upon
    and requires an OCA certification. The additional requirements for OCP certification
    are additional proctored exams.


    +   - The third and highest tier is the Oracle Certified Master (OCM). OCM certification
    builds upon and requires OCP certification. To achieve OCM certification, you
    must attend two Oracle Education, classroom courses (from a specific list of qualifying
    courses) and complete a practicum exam.


    The following material will address only the database administration track, because
    at the time of this writing, it was the only 9i track offered by Oracle. The other
    tracks have 8 and 9i certifications and will undoubtedly have 9i certifications.
    See the Oracle website http://www.oracle.com/education/certification for the latest
    information.


    # Oracle9i Certified Database Associate


    The role of the database administrator (DBA) has become a key to success in today''s
    highly complex database systems. The best DBAs work behind the scenes, but are
    in the spotlight when critical issues arise. They plan, create,'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Introduction xxiii


    maintain, and ensure that the database is available for the business. They are
    always watching the database for performance issues and to prevent unscheduled
    downtime. The DBA’s job requires broad understanding of the architecture of Oracle
    database and expertise in solving problems.


    The Oracle9 Certified Database Associate is the entry-level certification for
    the database administration track and is required to advance towards the more
    senior certification tiers. This certification requires you to pass two exams
    that demonstrate your knowledge of Oracle basics:


    +   - 1ZO-007: Introduction to Oracle9: SQL

    - 1ZO-031: Oracle9 Database: Fundamentals I


    The 1ZO-007 exam, Introduction to Oracle9: SQL, is offered on the Internet. The
    1ZO-031 exam, Oracle9 Database: Fundamentals I, is offered at a Sylvan Prometric
    facility.


    # Oracle9i Certified Professional (OCP)


    The OCP tier of the database administration track challenges to demonstrate your
    continuing experience and knowledge of Oracle technologies. The Oracle9i Certified
    Database Administrator certification requires achievement of the Certified Database
    Associate tier, as well as passing the following two exams at a Sylvan Prometric
    facility:


    +   - 1ZO-032: Oracle9 Database: Fundamentals II

    - 1ZO-033: Oracle9 Database: Performance Tuning


    # Oracle9i Certified Master


    The Oracle9i Certified Master is the highest level of certification that Oracle
    offers. To become a certified master, you must first achieve OCP status, complete
    two advanced instructor-led classes at an Oracle education facility, and finally
    pass a hands-on exam at Oracle Education. The classes and practicum exam are offered
    only and require travel. The advanced classes that will count toward your OCM
    requirement include the following:


    +   - Oracle9i: Program with PL/SQL

    - Oracle9i: Advanced PL/SQL

    - Oracle9i: SQL Tuning Workshop


    Copyright ©2002 SYBEX, Inc., Alameda, CA www.sybex.com'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Introduction


    +   - Oracle9i: High Availability in an Internet Environment

    - Oracle9i: Database: Implement Partitioning

    - Oracle9i: Real Application Clusters Implementation

    - Oracle9i: Data Warehouse Administration

    - Oracle9i: Advanced Replication

    - Oracle9i: Enterprise Manager


    # Passing Scores


    The 1Z0-032: Oracle9 Database: Fundamentals II exam consists of two sections—basic
    and mastery. At the time this book was written, the passing score for the basic
    section is 71 percent, and for the mastery section it is 56 percent. Please download
    and read the Oracle9 Certification guide before you take the exam. The basic section
    covers the fundamental concepts and the mastery section covers more difficult
    questions, which are mostly based on practice and experience. You must pass both
    sections to pass the exam. The objectives, test scoring, number of questions,
    and so on, are listed at http://www.oracle.com/education/certification.


    # More Information


    The current information about Oracle certification can be found at http://www.oracle.com/education/certification.
    Follow the Certification link and choose the track that you are interested in.
    Read the Candidate Guide for the test objectives and test contents, and keep in
    mind that they can change at any time without notice.


    # OCA/OCP Study Guides


    The Oracle9i database administration track certification consists of four tests:
    two for OCA level and two more for OCP level. Syex offers several study guides
    to help you achieve this certification:


    +   - OCA/OCP: Introduction to Oracle9i™ SQL Study Guide (exam 1Z0-007: Introduction
    to Oracle9i: SQL)

    - OCA/OCP: Oracle9i™ DBA Database Fundamentals I Study Guide (exam 1Z0-031: Oracle9i
    Database: Fundamentals I)'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Introduction xx


    +   - OCP: Oracle9i™ DBA Database Fundamentals II Study Guide (exam 1Z0-032: Oracle9i
    Database: Fundamentals II)


    +   - OCP: Oracle9i™ DBA Performance Tuning (exam 1Z0-033: Oracle9i Database:
    Performance Tuning)


    Additionally, these four books are offered in a boxed set: OCP: Oracle9i™ DBA
    Certification Kit.


    # Skills Required for DBA Certification


    To pass the certification exams, you need to master the following skills:


    +   - Write SQL SELECT statements that display data from either single or multiple
    tables.


    +   - Restrict, sort, aggregate, and manage data using both single and group functions.


    +   - Create and manage tables, views, constraints, synonyms, sequences, and indexes.


    +   - Create users and roles to control user access and maintain security.


    +   - Understand Oracle Server architecture (database and instance).


    +   - Understand the physical and logical storage of the database, and be able
    to manage space allocation and growth.


    +   - Manage data, including its storage, loading, and reorganization.


    +   - Manage redo logs, automatic undo, and rollback segments.


    +   - Use globalization features to choose a database character set and National
    Language Support (NLS) parameters.


    +   - Configure Oracle Net on the server side and the client side.


    +   - Use backup and recovery options.


    +   - Archive redo log files and hot backups.


    +   - Perform backup and recovery operations using Recovery Manager (RMAN).


    +   - Use data dictionary views and set database parameters.


    +   - Configure and use Oracle Shared Server.


    Copyright©2002 SYBEX, Inc., Alameda, CA


    www.sybex.com'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Introduction


    +   - Identify and tune database and SQL performance.


    +   - Use the tuning/diagnostics tools STATPACK, TKPROF, and EXPLAIN PLAN.


    +   - Tune the size of data blocks, the shared pool, the buffer caches, and rollback
    segments.


    +   - Diagnose contention for latches, locks, and rollback segments.


    # Tips for Taking the OCP Exam


    Using the tips to help you prepare for and pass each exam.


    +   - Each OCP test contains about 55-80 questions to be completed in 90 minutes.
    Answer the questions you know first, so that you do not run out of time.


    +   - Many questions on the exam have choices that at first glance look identical.
    Read the questions carefully. Do not jump to conclusions. Make sure that you clearly
    understand exactly what question asks.


    +   - Most of the test questions are scenario-based. Some of the scenarios contain
    nonessential information and exhibits. You need to be able to identify what''s
    important and what''s not important.


    +   - Do not leave any questions unanswered. There is no negative scoring. After
    selecting an answer, you can mark a difficult question or one that you are unsure
    of and come back to it.


    +   - When answering questions that you are not sure about, use a process of elimination
    to get rid of the obviously incorrect answers first. Doing this greatly improves
    your odds if you need to make an educated guess.


    +   - If you''re not sure of your answer, mark it for review and then look for
    other questions that may help you eliminate any incorrect answers. At the end
    of the test, you can go back and review the questions that you marked for review.


    # Where Do You Take the Exam?


    You may take the exams at any of the more than 800 Sylvan Prometric Authorized
    Testing Centers around the world. For the location of a testing center near you,
    call 1-800-891-3926. Outside the United States and Canada,'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Introduction xxii


    contact your local Sylvan Prometric Registration Center. Usually, the tests can
    be taken in any order.


    To register for a proctored Oracle Certified Professional exam at a Sylvan Prometric
    test center:


    +   - Determine the number of the exam you want to take.


    +   - Register with Sylvan Prometric online at http://www.2test.com or in North
    America, calling 1-800-891-EXAM (800-891-3926). At this point, you will be asked
    to pay in advance for the exam. At the time of this writing, the exams are $125
    each and must be taken within one year of payment.


    +   - When you schedule the exam, you''ll get instructions regarding appointment
    and cancellation procedures, the ID requirements, and information about the testing-center
    location.


    You can schedule exams up to six weeks in advance or as soon as one day before
    the day you wish to take it. If something comes up and you need to cancel or reschedule
    your exam appointment, contact Sylvan Prometric at least 24 hours in advance.


    # What Does This Book Cover?


    This book covers everything you need to know to pass the Oraclei Database: Fundamentals
    II exam. This exam is part of the Oracle9 Certified Database Administrator certification
    tier in the database administration track. It teaches you the basics of Oracle
    networking and backup and recovery. Each chapter begins with a list of exam objectives.


    **Chapter 1** Introduces the Oracle network architecture and the responsibility
    of the DBA for managing the Oracle network.


    **Chapter 2** Discusses the setup and administration of Oracle Net on the Oracle
    server. It explains how to configure the Oracle Net server-side components and
    how to troubleshoot server-side network problems.


    **Chapter 3** Explains how to set up and administer Oracle client-side components.
    It demonstrates and discusses how to configure Oracle so that clients can connect
    to an Oracle server. It also discusses troubleshooting Oracle client-side connectivity
    problems.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# xxviii Introduction


    **Chapter 4** Introduces the Oracle Shared Server. It discusses when to use Shared
    Server and how to configure Shared Server within the Oracle environment.


    **Chapter 5** Introduces the backup and recovery overview. The types of failures
    of an Oracle database are discussed.


    **Chapter 6** Discusses instance and media recovery structures. Oracle processes,
    memory structures, and files relating to recovery are discussed. The importance
    of checkpointing, redo logs, and archived logs are also discussed.


    **Chapter 7** Explains how to configure the database for archive logging. The
    difference between archive logging and no archive logging is discussed.


    **Chapter 8** Introduces recovery manager overview and configuration. The RMAN
    repository, channel allocation, and RMAN configuration are discussed.


    **Chapter 9** Discusses user-managed and RMAN-based backup methods. Different
    examples are performed with each of these backup methods.


    **Chapter 10** Discusses user-managed and RMAN-based complete recovery methods.
    Different examples of complete recovery are performed.


    **Chapter 11** Discusses user-managed and RMAN-based incomplete recovery methods.
    Different examples of incomplete recovery are performed.


    **Chapter 12** Introduces RMAN maintenance. Maintaining the RMAN repository, retention
    policies, backups, and backup availability are discussed.


    **Chapter 13** Introduces recovery catalog creation and maintenance. This chapter
    describes the recovery catalog and how to create it. Performing maintenance on
    the recovery catalog, creating and running scripts, generating lists and reports,
    and backing up the recovery catalog are all discussed.


    **Chapter 14** Discusses transporting data between databases with the Export and
    Import utilities.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Chapter 15 Introduces the SQL*Loader utility and the direct-load insert operation.
    This chapter also discusses the use of each of these data loading methods.


    Each chapter ends with review questions that are specifically designed to help
    you retain the knowledge presented. To really nail down your skills, read and
    answer each question carefully.


    # How to Use This Book


    This book can provide a solid foundation for the serious effort of preparing for
    OCP database administration exam track. To best benefit from this book, use the
    following study method:


    +   1. Take the Assessment Test immediately following this introduction. (The
    answers are at the end of the test.) Carefully read the explanations for any questions
    you get wrong, and note which chapters the material comes from. This information
    should help you plan your study strategy.


    +   2. Study each chapter carefully, making sure that you fully understand the
    information and the test objectives listed at the beginning of each chapter. Pay
    extra attention to any chapter related to questions you missed in the Assessment
    Test.


    +   3. Complete all hands-on exercises in the chapter, referring to the chapter
    so that you understand the reason for each step. If you do not have an Oracle
    database available, be sure to study the examples carefully. Answer the Review
    Questions related to that chapter. (The answers appear at the end of each chapter,
    after the "Review Questions" section.)


    +   4. Note the questions that confuse or trick you, and study those sections
    of the book again.


    +   5. Before taking the exam, try your hand at the Bonus Exams that are included
    on the CD that comes with this book. The questions on these exams appear only
    on the CD. These will give you a complete over-view of what you can expect to
    see on the real test.


    +   6. Remember to use the products on the CD included with this book. The electronic
    flashcards and the EdgeTest exam preparation software have been specifically designed
    to help you study for and pass your'
