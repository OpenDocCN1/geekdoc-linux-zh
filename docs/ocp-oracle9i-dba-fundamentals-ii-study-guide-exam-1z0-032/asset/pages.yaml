- pgno: 258
  md: '# Using init.ora Parameters for Multiple Archive Processes and Locations 215


    To configure a database for multiple archive processes and LOG_ARCHIVE_DESTs,
    use two sets of init.ora parameters.


    The first set is based on the destination parameter, which has been slightly changed
    to LOG_ARCHIVE_DEST_N (where N is a number from 1 to 10). The values for these
    parameters LOG_ARCHIVE_DEST_1 and LOG_ARCHIVE_DEST_2 are as follows: ''LOCATION
    = /ORACLE/ADMIN/ORC9/ARCH1'', ''LOCATION = /ORACLE/ADMIN/ORC9/ARCH2'', and ''LOCATION
    = /ORACLE/ADMIN/ORC9/REMOTE_ARCH3''. The first set of parameters is listed below
    in init.ora.


    ############################################


    # # Archive Logging


    ############################################


    ```

    log_archive_start=true

    #log_archive_dest=/oracle/admin/orc9/arch

    #log_archive_dest_1=''location=/oracle/admin/orc9/arch1''

    #log_archive_dest_2=''location=/oracle/admin/orc9/arch2''

    #log_archive_dest_3=''location=/oracle/admin/orc9/remote_arch3''

    log_archive_max_processes=3

    log_archive_format=archorc9%s.log

    ```


    After these parameters are changed or added, you will need to start up the database
    to use the new parameters. These dump locations will be in effect.


    The second set of parameters are LOG_ARCHIVE_DEST=<SOME/DIRECTORY/LOCATION> and
    LOG_ARCHIVE_DUPLEX_DEST=<SOME/DIRECTORY/LOCATION>. The following example uses
    LOG_ARCHIVE_DEST=/ORACLE/ADMIN/ORC9/ARCH1 and LOG_ARCHIVE_DUPLEX_DEST=/ORACLE/ADMIN/ORC9/ARCH2.
    The main difference in this approach is that you use these parameters if you are
    going to have only two locations or want to use the same init.ora parameter format
    supported in 8.0.x. These parameters are mutually exclusive with LOG_ARCHIVE_DEST_N
    mentioned in the previous example. This second set of parameters can be seen in
    the init.ora parameter values.


    ############################################


    # # Archive Logging


    ############################################


    ```

    log_archive_start=true

    log_archive_dest=/oracle/admin/orc9/arch

    log_archive_duplex_dest=/oracle/admin/orc9/arch2

    ```'
