  md: '# Restoring Data Files to Different Locations


    Restoring data files to a different location in both ARCHIVLOG and NOARCHIVOG
    mode can be performed in a similar manner. The main difference is that unlike
    any NOARCHIVOG mode recovery, the database in most cases cannot be completely
    recovered to the point of failure. The only time a database can be completely
    recovered in NOARCHIVOG mode is when the database has not cycled through all of
    the online redo logs since the last complete backup.


    To restore the files to a different location, you would perform an OS copy from
    the backup location to the new location, and then start the database at the mount
    stage. After that, you would update the control file with the ALTER DATABASE RENAME
    FILE command to designate the new location. Let''s walk through this procedure.


    +   1. Use OS commands to restore files to new locations.


    ```

    cp /db01/oracle/tst9/data01.dbf /db02/oracle/tst9/

    data01.dbf

    ```


    +   2. Start up the database instance and mount the database.


    ```

    oracle@octilli:~ > oraenv

    ORACLE_SID = [tst9] ?

    oracle@octilli:~ > sqlplus /nolog

    ```


