    ```


    | POOL | NAME | BYTES |

    | --- | --- | --- |

    | large pool | free memory | 251640 |

    | large pool | session heap | 48360 |


    # Sizing the Large Pool


    The Large Pool should be large enough to hold information for all of your shared
    server connections. Generally, each connection will be between one and three megabytes
    of memory, but this depends on that client''s type of activity. Clients that do
    a great deal of sorting or open many cursors will use more memory.'
