    There are four compatibility modes, which deal how errors are handled, available
    for the math library:


    +   * ANSI/POSIX 1003.1—the function matherr is never called; warning messages
    are not printed out on the stderr output stream; errno is set correctly.

    * IEEE-754—the function matherr is never called; warning messages are not printed
    out on the stderr output stream; errno is never set.

    * X/Open Portability Guide Issue 3 (XPG3)—the function matherr is called; warning
    messages are not printed out on the stderr output stream; errno is set correctly.

    * System V Interface Edition 3—the function matherr is called; warning messages
    are printed out on the stderr output stream; errno is set correctly; functions
    that overflow return a value, which is the maximum single precision floatingpoint
    value.


