    # 11.2.14 Conflicts Window


    The Conflicts window, shown in Figure 11.3, displays any problems that arise during
    modification, installation, or removal of configuration items. A conflict occurs
    when requirements are not between configuration items that are defined in the
    CDL.

    The Conflicts window is split into three different columns: Item, Conflict, and
    Property. The Item column displays the macro name of the first item involved in
    the conflict. The Conflict column contains a description of the conflict type,
    such as Unsatisfied or Illegal. The Property column contains a description of
    the configuration item property that caused the conflict. The Conflicts window
    can be enabled or disabled by selecting View -> Conflicts from the menu bar or
    using the hot-key combination Alt+5.


    Right-clicking on a particular item in the Conflicts window pops up a menu with
    two options, Locate and Resolve. Locate causes the configuration item to be selected
    in the Configuration window. Resolve allows you to resolve the conflict prior
    to building the ecos library. Resolving conflicts is covered in the Using Templates
    section of this chapter.'
