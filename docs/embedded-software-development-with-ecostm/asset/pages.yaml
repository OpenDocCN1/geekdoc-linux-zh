    # 8.1 Compatibility Layers


    Compatibility layers are specifications that define standard APIs that interface
    to the underlying eCos kernel in order to encapsulate implementation-specific
    functionality. This allows companies to adopt the API, easing the porter of applications
    across different platforms and operating systems. This section gives a brief overview
    of the compatibility layer support offered with eCos. Resources for additional
    detailed information are included as well. eCos supports two different compatibility
    layers:


    +   - POSIX

    - µITRON


    The packages for these different layers are found under the compat subdirectory.
    This is further divided into the posix and uitron subdirectories. Figure 1.3,
    in Chapter 1, shows the overall directory structure.


    # 8.1.1 POSIX


    The Portable Operating System Interface (POSIX) is a set of Institute of Electrical
    and Electronics Engineers, Inc. (IEEE) standards designed to ease application
    portability. The POSIX specifications define APIs that detail how interfaces operate
    to operating systems.


    > eCos contains support for the POSIX 1003.1—1996 Specification (ISO/IEC 9945-1).
    Support for a function means that the data types and definitions necessary to
    support the particular function, including the objects it manipulates, are also
    defined. The eCos POSIX support is a subset of the IEEE POSIX standards, including
    the implementation of threads, signals, and synchronization objects. Additional
    information about POSIX can be found in the Portable Operating System Interface
    (POSIX)—Part 1: System Programming Interface (API)[C Language] ISO/IEC 9945-1:1996,
    IEEE.


    eCos divides the POSIX support into two packages (CYPKG_POSIX) and File IO Compatibility
    Layer (CYPKG_IO_FILEIO). The POSIX Compatibility Layer package provides support
    for threads, signals, synchronization, timers, and message queues, while the POSIX
    File IO Compatibility Layer provides support for file and I/O.


    eCos defines a template called POSIX that is used to enable the standard configuration
    options for POSIX compatibility. Chapter 11, the eCos Toolset, describes the process
    for using templates in greater detail. There are configuration options for both
    the POSIX compatibility'
