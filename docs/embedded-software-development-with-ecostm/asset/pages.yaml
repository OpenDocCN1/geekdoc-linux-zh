- img_proc: true
  md: '# 8.1.2 µITRON


    Another compatibility layer eCos is called µITRON. The µITRON specification defines
    APIs that enable highly flexible operating system architectures tailored specifically
    for embedded system applications. One advantage of the µITRON compatibility layer,
    as with other compatibility layers, is the effort of understanding and porting
    application software to new processor architectures is reduced. A great reference
    on µITRON is µITRON 3.0, An Open and Portable Real-Time Operating System for Embedded
    Systems by Ken Sakamura.


    There are four levels of the µITRON specification:


    +   * Required (R)—Functions in this level are mandatory for µITRON 3.0 implementations.


    +   * Standard (S)—Includes basic functions for achieving a real-time, multitasking
    operating system.


    +   * Extended (E)—Includes additional and extended functions, such as object
    creation and deletion, memory pools, and timer handler functions.


    +   * CPU Dependent (C)—Incorporates CPU or hardware configuration implementation-dependent
    functions.


    The eCos µITRON package supports version 3.02 of the specification, which incorporates
    all of the Required (R) level functions, all of the Standard (S) level functions,
    and most of the Extended (E) level functions as well. More detailed information
    about the µITRON specification can be found online:


    www.itron.gr.jp


    eCos defines a template called Uron that is used to load the packages for µITRON
    compatibility. The configuration options for µITRON are located within the µITRON
    Compatibility Layer (CYPGK_UITRON) package. Included within this package are configuration
    options for semaphores, mailboxes, tasks, alarm handlers, and others.


    # 8.2 ROM Monitors


    A ROM monitor is a program, typically residing in ROM or flash memory, which provides
    debug functionality. The ROM monitor is used to load an application program into
    memory for debugging. After loading the application image, the ROM monitor provides
    some basic level of debug functionality, such as reading and writing memory or
    processor registers. The application does not need to provide any debug facilities
    because this is incorporated into the ROM monitor program.


    The eCos system offers several choices for debugging applications. Some of the
    debugging support options include:'
