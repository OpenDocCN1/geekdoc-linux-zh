    The function cyg_user_start is invoked next. This is the normal application entry
    A fault for this function, which does not perform any tasks, is provided in the
    file userstart.cxx under the infra subdirectory; therefore, it is not necessary
    to provide this function in your application. The cyg_user_start function is used
    instead of a main function.


    > NOTE The function main can be used as the user application starting point if
    the ISO C library compatibility package is included in the configuration. To accommodate
    this, the ISO C library provides a default cyg_user_start function that is called
    if none is supplied by the user application. cyg_user_start function creates a
    thread that calls the user application main function.


    It is recommended that cyg_user_start be used to perform any application-specific
    initialization, create threads, create synchronization primitives, setting up
    alarms, and register any necessary interrupt handlers. It is not necessary to
    invoke the scheduler from the user start function, since this is performed by
    cyg_user_start returns. Code Listing 6.1, found in Chapter 6, is an example of
    a cyg_user_start routine that creates a thread.


    The final step in the kernel startup process is to invoke the scheduler. The scheduler
    that is started, either multilevel queue or bitmap, depends on the configuration
    option settings under the kernel component package.


    > NOTE Code running during initialization executes with interrupts and the scheduler
    locked. Enabling interrupts or unlocking the scheduler is not allowed because
    the system is in an inconsistent state at this point.


    Since the scheduler is started after cyg_user_start returns, it is important that
    kernel services are not used within this runtime. Initializing kernel primitives,
    such as a semaphore, is acceptable; however, posting or waiting on a semaphore
    would cause undefined behavior and possibly system failure.


    # 5.1.3 The Scheduler


    The core of the ECos kernel is the scheduler. The jobs of the scheduler are to
    select the appropriate thread for execution, provide mechanisms for executing
    threads to synchronize, and control the effect of interrupts on thread execution.
    This section does not describe the implementation details of the different schedulers,
    but instead gives a basic understanding of how the existing ECos schedulers operate
    and the configuration options available.


    During the execution of the scheduler code, interrupts are not disabled. Because
    of this, interrupt latency is kept low.


    A counter exists within the scheduler that determines whether the scheduler is
    free to run or disabled. If the lock counter is nonzero, scheduling is disabled;
    when the lock counter returns'
