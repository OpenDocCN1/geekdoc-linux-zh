  md: '# 6.2.4 Flags


    Flags are synchronization mechanisms represented by a 32-bit word. Each bit in
    the flag represents a condition, which allows a thread to wait for either a single
    condition or a combination of conditions. The waiting thread specifies if all
    conditions or a combination of conditions are to be met before it wakes up. The
    signaling thread can then set or reset bits according to specific conditions so
    the appropriate thread can be executed. The kernel API functions for creating
    and controlling the flags are detailed in Item List 6.7.


