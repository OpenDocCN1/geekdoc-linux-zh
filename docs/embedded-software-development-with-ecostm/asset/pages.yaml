    # 11.1.2 The Component Definition Language Overview


    We now take a look at the CDL. This section gives us a basic understanding of
    the CDL and how script files are used with packages in the component repository.
    Using the information in this section, we can then proceed to explore the Ecos
    configuration tools and how the package CDL script files are interpreted in The
    Configuration Tool section of this chapter. An in-depth look into the CDL is provided
    online in the Ecos Component Writer''s Guide:


    http://source.redhat.com/ecos/docs.html


    Details about the CDL command and keyword syntax are in the CDL Language Specification
    section of the E Component Writer''s Guide.


    CDL is not a new language, it is an extension of the existing Tool Command Language
    (Tcl) scripting language. The CDL is a key part of the ecos framework that is
    used in script files (with the extension .cdl) to describe the package age to
    the framework. These CDL script files contain information on all of the configuration
    options within a package, as well as details on how to build the package.


    # 11.1.2.1 CDL Script Files


    Each package has a single top-level CDL script file, typically located in the
    cdl subdirectory, as shown in Figure 11.1. The first command in the top-level
    script should be cdl_package, which is used in the package database file ecos.db.
    There should be only one cdl_package command per package.


    The CDL syntax implements a command hierarchy. This allows options to be controlled
    as a group; therefore, disabling a single component disables all options within
    the component as well. The hierarchy also enables a simpler representation in
    the Configuration Tool for navigation and modification of options, as we see in
    The Configuration Tool section of this chapter.'
  merge: -1
