    clean at the shell prompt.


    Before we proceed with the build, let''s see where exactly the eCos library gets
    linked into the application.


    +   1 STARTUP(vectors.o)

    2 ENTRY(_start)

    3 INPUT(extras.o)

    4 GROUP(libarget.a libgcc.a)


    **Code Listing 12.4** Portion of target.ld linker script file that shows where
    the eCos library is included when building applications.


    Line 1 of Code Listing 12.4 uses the command STARTUP. This causes the vectors.o
    file to be the first file linked, since the file vectors.S contains the entry
    point for our application.

    The ENTRY command, on line 2, sets the entry point where the application will
    begin execution. In our case, the entry point is in the file vectors.S in the
    routine_start. Each HAL contains a file vectors.S that contains the startup code
    for that particular processor. This file is located under the arch source directory
    for architecture.

    The INPUT command on line 3 notifies the linker to include the named files. In
    this case, extras.o is the file, which was one of the additional files created
    during the eCos build procedure.


    Finally, on 4 is the GROUP command. This command is similar to the INPUT command;
    it takes archive files as its parameters. The two eCos libraries are used in this
    section of the command, libarget.a and libgcc.a. All of the files mentioned in
    this section of the linker script file are located in the install tree under the
    ecos_install\directory.


    We are ready...finally!!! To build our application image we invoke the make utility
    at the shell command prompt using the following command:


    ```

    $ make

    ```


    After the build is complete, the files that are output from our build process
    are:


    +   * basic1.o—the compiler object file.

    * basic1.map—the map file shows the memory layout for the image.

    * basic1.exe—the ELF format executable file.


