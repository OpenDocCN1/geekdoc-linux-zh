  md: '# Interrupts


    The kernel API contains interrupt control functions that make use of these macros.
    Therefore, it is not necessary for an application to call directly into the HAL;
    rather, it can use the kernel API to configure system interrupts. The HAL and
    kernel interrupt control functionality is broken down into three groups:


    +   * Interrupt Service Routine Management

    * Interrupt State Management

    * Interrupt Controller Management


    > NOTE It is important to use the kernel API functions and avoid using the HAL
    macros directly. Using the kernel API guarantees consistency over the underlying
    HAL macro implementations. An example of maintaining consistency is when using
    the configuration option to chain interrupts through the kernel API when attaching
    interrupts (cyg_interrupt_attach), rather than directly using the HAL_INTERRUPT_ATTACH
    macro, the algorithm for inserting the interrupt in the chain list is handled
    by the kernel API function. This ensures that the interrupts are inserted into
    the list using the process each time.


    # 3.2.4.1 Interrupt Service Routine Management


    The first of the groups, Interrupt Service Routine Management, controls the attachment
    and detachment of interrupt service within the three HAL ISR tables (handlers,
    data, and objects). The HAL ISR Management macros are described in Item List 3.6.


    # Item List 3.6 HAL Interrupt Service Routine Management Macros


    ```

    HAL_INTERRUPT_ATTACH (

    __vector_,

    __isr_,

    __data_,

    __object_)

    ```


    Parameters: __vector_--HAL architecture-specific interrupt definition number.
    Each HAL defines, in the file hal_intr.h, all interrupts supported starting from
    0. The platform or variant can define additional interrupts. This value is used
    to determine the index into the ISR tables.


    __isr_--ISR address to install into the handler table.


    __data_--data address to install into the data table.


    __object_--object address to install into the object table.


    Description: Places the parameters into the ISR tables for the given interrupt
    vector. The ISR is called from the HAL default VSR when the interrupt occurs,
    the data and object are passed into the ISR as parameters.'
