    # STEP 1


    Open the bash command shell. This can be done by clicking on the Cygwin shortcut
    on the desktop, if created in the Cygwin native tools installation, or through
    the menu Start -> Programs -> Cygnus Solutions -> Cygwin Bash Shell.


    When the shell is opened, the present working directory is D:\cygwin\home\xxx,
    where xxx is your username. We want to change to the root Cygwin directory by
    entering the following command at the bash prompt:


    ```

    $ cd /

    ```


    # STEP 2


    Unzip the i386 GNU cross-development tools into our Cygwin directory structure.
    The command for this is:


    ```

    $ tar xjvf /cygdrive/e/gnu/i386gnutools.tar.bz2

    ```


    > NOTE The CD-ROM drive is mounted as /cygdrive/e/ by default when Cygwin is installed.
    The drive letter for your CD-ROM should be substituted in place of /e/ in the
    preceding command. If you are uncertain of the drive mounts for your system, enter
    the command mount at the bash shell prompt to get a list of the current system
    mounts.


    After executing this command, the i386 GNU cross-development tools are located
    under the D:\cygwin\tools directory. The binary executables are under the D:\cygwin\tools\H-i686-pc-cygwin\bin
    directory.


    # STEP 3


    We need to ensure that the Cygwin temporary directory is mounted. The command
    to do this is:


    ```

    $ mount -f -b d:/cygwin/tmp /tmp

    ```


    # STEP 4


    Next, we set the path for our new GNU cross-development tools. The bash shell
    command for this is:


    ```

    $ PATH=/tools/H-i686-pc-cygwin:$PATH ; export PATH

    ```


    We add the GNU cross-development tools directory to the Windows environment path.
    The path is altered by right-clicking on the My Computer icon on the desktop.
    This brings up a drop-down list of options. Select Properties from the drop-down
    list.'
