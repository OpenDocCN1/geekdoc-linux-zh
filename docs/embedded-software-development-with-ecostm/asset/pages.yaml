    # 11.3.2 The Command-Line Configuration Tool


    Configuration of packages in the eCos repository for your specific application
    requirements can be done with the eCos command-line tool. The command-line configuration
    tool is installed with the eCos development kit installation, which we did in
    Chapter 10.


    The executable is located in the D: \ecos\bin subdirectory. The command-line configuration
    tool can be invoked from the shell prompt by running the file ecosconfig.exe.
    Invoking the command-line executable without any parameters displays the different
    commands available. The source code for this tool is also installed with the eCos
    development kit under the D: \ecoshost\tools\configtool subdirectory.


    Since the graphical Configuration Tool is able to run on both Windows and Linux,
    version 2.0 and beyond, we do not go into the details of using the command-line
    configuration tool. It is much easier to use the Configuration Tool to set up,
    configure, and build the eCos library. The command-line configuration tool also
    does not offer the ability to interactively resolve conflicts that arise during
    the configuration process.


    # 11.4 Building the eCos Tools


    Yes, the eCos development tools, including the graphical Configuration Tool, the
    Package Administration Tool, and the command-line configuration tool, are open
    source and, therefore, you can build these tools if you desire or need to take
    on that task. This gives you complete control of your embedded development environment—you
    are completely autonomous.


    The source code for the eCos toolkit is contained in the eCos repository under
    the D: \ecoshost directory. It is also included in this other testing tools and
    utilities. The latest source code for the tools is available in the online CVS
    repository. Additional information about building the eCos tool can be found on
    the eCos home site, as well as information regarding building the graphical Configuration
    Tool, at:


    http://sources.redhat.com/ecos/ct2.html


    # 11.5 Additional Open-Source Tools


    In this section, we briefly look at a couple of additional open-source tools that
    can be used to complete our embedded software development environment. The tools
    described in this section are often used by developers to aid in producing more
    robust software and, therefore, a more robust and reliable product.


    This brief overview is to make you aware of other open-source tools that can be
    appended to the core eCos development tools to round out your software development
    system. Sources for getting additional information are included for you to investigate
    these tools on your own. All files needed to set up the tools are provided on
    the CD-ROM.'
  merge: -1
