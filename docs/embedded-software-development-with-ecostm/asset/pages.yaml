  md: '# Packages


    243


    As mentioned before, the packages subdirectory is located under the root Ecos
    development kit directory D:\ecos. Since this is a HAL package, it is located
    under the hal subdirectory. The HAL packages are organized by architecture; in
    this case, it is the i386 architecture.


    The architecture, in this package, is further divided by platform support. The
    platform component is located under the pc subdirectory. The version subdirectory
    is called current. Finally, we have the common package directory structure of
