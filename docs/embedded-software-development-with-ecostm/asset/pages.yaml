  md: '# Exceptions and Interrupts


    In this chapter, we begin with a look at exceptions and how they are handled at
    the HAL application layers within the eCos system. Next, we cover the eCos interrupt
    model, including interrupt configuration, handling, and control. The exception
    and interrupt information prepares us for managing software and hardware events
    that occur.


    # 3.1 Exceptions


    An exception is a synchronous event that occurs during the execution of a thread
    that disrupts the normal flow of instructions. If exceptions are not properly
    processed during program execution, severe consequences, as system failures, can
    occur. Exception handling is extremely important, especially in embedded systems,
    to avoid these failures, and improves the robustness of the software. Properly
    implemented exception handling can also aid in software execution recovery so
    that an application can proceed with its task after an exception has occurred.


    Examples of exceptions that can occur in a system include those raised by hardware
    (such as a memory access error) and those raised by software (such as a divide
    by zero error). After the exception causes an interruption, the processor will
    jump to a defined address (or exception vector) and begin to run the instructions
    at that location. The address that the processor jumps to contains the exception
    handling code to process the error. Different processor architectures may locate
    the exception handlers at various places and implement this jump process in a
    variety of methods.


    The method for implementing exception handling can vary. eCos does not provide
    an implementation similar to the throw and catch facilities provided in C++. For
    an embedded system, the simplest and most flexible method for handling exceptions
    is to call a function. This function needs a context or an area to do its work,
    and is typically passed in information, such as'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'the exception and possibly some optional parameters, to process the exception.
    After returning from this exception handler function, the thread can continue
    its execution.


    There are two main methods for exception handling in eCos. The first is a combination
    of HAL and Kernel Exception Handling. The HAL provides the general hardware-level
    exception processing and passes control to the application for any extended exception
    support needed. This is the default configuration method.


    The second exception handling method is Application Exception Handling. This allows
    the application to take full control over any or all of the exceptions and attaches
    a vector service routine directly to the hardware. The exception handler routine
    needs to be written in assembly language using this configuration method.


    The configuration option names are defined in the graphical configuration tool.
    In parentheses are the CDL names for the given option. For example, using the
    graphical configuration tool you could look up the configuration option name HAL
    Exception Support, which is located in the configuration window. This configuration
    option is a CDL macro associated with it—in this case, CYPGK_HAL_EXCEPTIONS—which
    is located in the Properties window of the graphical configuration tool. We covered
    the graphical configuration tool in Chapter 11, The eCos Toolkit.


    The configuration options that control the exception handling are the HAL Exception
    Support (CYPGK_HAL_EXCEPTIONS) option, located under the Platform-Independent
    HAL Options (CYPGK_HAL_COMMON) component, and the Exception Handling (CYPGK_KERNEL_EXCEPTIONS)
    component that in the eCos Kernel package. Each of these configuration components
    requires other to be enabled Enabling these options allows HAL and Kernel Exception
    Handling. If both of these configuration options are disabled, it is up to you
    to provide exception handlers for Application Exception Handling.


    Figure 3.1 shows the exception handling execution flow for the two main configurations.
    The grey boxes illustrate, using a system exception as an example, the HAL and
    Kernel Exception execution flow. The white boxes show the execution flow for Application
    Exception Handling using an alignment exception as an example. We look at the
    execution flow shown in Figure 3.1 later in this chapter.


    As another option, all exception handling can be disabled in the system. If this
    configuration is selected and an exception occurs, the macro CYPGK_FAIL fails
    and an assertion is raised. If assertions are not enabled, the state of the processor
    is restored; however, the cause of the exception might still exist. This is not
    a very elegant method for exception handling and can lead to unintended system
    behavior when an exception occurs. However, if code space is extremely important,
    it may be necessary to eliminate any extended exception processing.


    # 3.1.1 HAL and Kernel Exception Handling


    It is important that an exception handler is installed for each exception supported
    by the processor. If a handler is not installed for a particular exception and
    it occurs during execution, the processor will jump to the exception address to
    begin execution only to not execute code. This can cause erratic behavior that
    can be very difficult to debug and might lead to system failures.'
