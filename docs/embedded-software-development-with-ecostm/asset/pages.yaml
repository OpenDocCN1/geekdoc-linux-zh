- img_proc: true
  md: 'There are four CDL commands used in script files:


    +   - **cdl_package**-The unit of distribution, which might contain option, component,
    or interface commands within its body. Typically, this is the top level of the
    CDL script file. The package body can make use of most option properties as well
    as additional properties or commands that apply to the entire package.

    - **cdl_component**-A configuration that might contain additional options or subcomponents
    within its body. The body of a component command might also contain the same properties
    as the option command.

    - **cdl_option**-The basic unit of configurability that generally contains a single
    choice. The body of the option command contains properties that describe and define
    the characteristics of the option. There might also be information to aid in your
    decision, such as a text description of the option.

    - **cdl_interface**-A calculated configuration option that provides an abstraction
    mechanism. The body of the interface command might contain a subset of the option
    properties.


    Every command must have a command name. All command names must be unique within
    a configuration. If two names exist within two packages, it is not possible to
    load both packages in a configuration.


    > > NOTE You might notice that some packages use the same CDL command names. For
    example, all HAL packages define the CDL component name CYG_HAL_STARTUP. Even
    though all command names must be unique within a configuration, this is fine because
    only one HAL package can be loaded at a time; therefore, the name CYG_HAL_STARTUP
    only exists once within a configuration.


    Typically, the component framework outputs a #define for every active and enabled
    option, using the command name as the symbol being defined. For example, enabling
    the option command named:


    ```

    CYGIMP_KERNEL_INTERRUPTS_DSRs

    ```


    which is located within the eCos Kernel package, in the Kernel Interrupt handler
    causes


    ```

    #define CYGIMP_KERNEL_INTERRUPTS_DSRs 1

    ```


    to be placed in the designated kernel package header file. Some options are set
    to values in which case the configured value is used when setting the #define
    statement.

    nCommand names in the eCos component repository following a naming convention
    to avoid name clashes with other packages. An example of a package name is CYGPGK_HAL_I386_PC.'
  merge: -1
