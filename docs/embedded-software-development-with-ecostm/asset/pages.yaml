  md: '# User Interface and Command Set


    +   - Delete (0x7F) crase the previous character.

    - Period (.) (0x2E) halts the editing of a command, leaving the current item unchanged.

    - Caret (*) (0x5E) is used as an up arrow for commands, such as fconfig, which
    go through a list of parameters to set.

    - Dollar sign ($) (0x24) switches Reboot into GDB stub mode. The GDB stub takes
    control and waits for a connection from GDB host. To get out of GDB stub mode,
    a disconnect message is sent from GDB host or by a reset of the target.

    - Return (0x0D) leaves the view for a particular parameter unchanged.


    RedBoot generates basic error messages when commands are entered incorrectly or
    invalid commands are used. In the following example, the dump command is entered;
    however; the -b switch was omitted by causing RedBoot to generate the error message
    we see on the following line. The message informs us that we have forgotten the
    switch for our parameter value 0x12. RedBoot then outputs a new prompt following
    the error message for the next command.


    ```

    RedBoot> dump 0x12

    ** Error: no default/non-flag arguments supported

    RedBoot>

    ```


    RedBoot commands are designed to be simple to use and remember. Although, the
    command set only offers basic commands, the source is available so you can add
    commands needed for your platform. If you add general-purpose commands that you
    think are extremely useful, the ECos open-source community would be glad to accept
    a contribution.

    Numbers entered with commands can be entered in decimal or hexadecimal (designated
    by the 0x prefix). Item Lists 9.2 and 9.3 list the commands available in the default
    RedBoot image. Optional parameters or switches in the syntax for commands are
    enclosed in brackets ([]), value parameters are enclosed in angled brackets (<).
    Commands entered without parameters cause a help message about the command to
    be output or the current setting for the command.

    All RedBoot commands listed in Item List 9.2 might not be available on all platforms
    because not all support certain resources. For example, a platform that does not
    contain flash memory does not support the Flash Image System (FIS) command set.
