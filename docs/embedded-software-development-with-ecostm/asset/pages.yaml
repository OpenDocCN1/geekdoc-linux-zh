  md: '# 11.5.1 Source-Navigator


    **Source-Navigator** is a code analysis and comprehension tool. Source-Navigator
    is an open-source project that can aid in understanding and reengineering complex
    software projects. By parsing C, C++, Java, T, [incr] FORTRAN, COBOL, and assembly
    language source, Source-Navigator builds a project database. The database includes
    useful information as internal program structures, the location of function declarations,
    contents of class declarations, and details the relationships between program
    components. The home site for the Source-Navigator project can be found online:


    http://sources.redhat.com/sourcenav


    Source-Navigator also includes a Software Development Kit (SDK). The SDK allows
    you to add new parsers to support additional languages, modify the graphical user
    interface, query the database for specification, and use other applications in
    conjunction with Source-Navigator, such as a version control system. In addition,
    it is possible to configure Source-Navigator to build programs and the GNU debugger
    for a completely integrated environment.


    Source-Navigator version 5.0 is included on the CD-ROM under the srcnav directory.
    The file sourcenavigator50.zip contains the Windows executable you can use to
    set up Source-Navigator on your development system. Pre-built binary files can
    also be downloaded for Solaris and HPUX.


    Simply unzip the sourcenavigator50.zip file, retaining the directory structure,
    unto your D:\ drive. Source-Navigator requires approximately 17.4 Mbytes of disk
    space. All necessary files are placed under the D:\SourceNavigator. To start Source-Navigator,
    run the executable file snav.exe under the bin subdirectory.


    Also included on the CD-ROM is the source code for the 5.0 release of Source-Navigator.
    The source code is contained in the file SN50-010322-source.tar.gz also under
    the srcnav directory.


    The Source-Navigator User''s Guide includes details about using the project editor,
    using the symbol browser, customizing Source-Navigator for your specific needs,
    and other features, as well as a tutorial. The User''s Guide can be found online:


    http://sources.redhat.com/sourcenav/online-docs/userguide/index_ug.html


    The Source-Navigator Programmer''s Reference Guide contains information about
    adding parsers, the database API, and integrating a version control system into
    Source-Navigator. The Programmer''s Reference Guide can be found online:


    http://sources.redhat.com/sourcenav/online-docs/progref/index_pr.html


    Two discussion mailing lists are available for Source-Navigator. The first is
    a general discussion for issues and submission of patches, which is located at:


    http://sources.redhat.com/ml/sourcenav'
