    # STEP 6


    Launch the Cygwin Bash Shell by double-clicking the Cygwin desktop icon or selecting
    Cygwin Bash Shell from Start -> Programs -> Cygwin Solutions -> Cygwin Solutions.
    Using the bash shell, we enter commands to mount the floppy drive and install
    the binary image onto a floppy disk.


    First, we need to make sure that the floppy drive is properly mounted on the development
    system. We enter the command:


    ```

    $ mount -f -b //:/a: /dev/fd0

    ```


    # STEP 7


    Next, we want to make sure we are in the proper subdirectory to install the RedBoot
    binary image. We want to change to the proper working directory in the bash shell
    using the command:


    ```

    $ cd d:/workdir/redboot.

    ```


    # STEP 8


    Now, we place a floppy disk into our host development system''s floppy drive.
    We are using the dd utility, which was installed during the Cygwin installation
    procedure, to transfer the RedBoot image to the floppy disk.


    The dd utility writes raw data from the standard input to standard output. In
    our case, we write the RedBoot binary file from the hard disk to our floppy disk.


    > NOTE The process of transferring the RedBoot image to the floppy disk erases
    any file system and data contained on the disk.


    To install the RedBoot binary image onto the floppy drive we use the command:


    ```

    $ dd conv=sync if=redboot_install/bin/redboot.bin of=/dev/fd0

    ```


    After the process is complete, a message is displayed showing the records converted,
    similar:


    +   178+1 records in

    179+0 records out


