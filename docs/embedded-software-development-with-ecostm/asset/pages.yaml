    # 8.5 USB Support


    Universal Serial Bus (USB) networks consist of a single host, called the Host
    Controller, and one or more slave devices. Slave devices connect to the USB through
    ports on specialized USB'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'devices called hubs. The host initiates all USB operations. For example, if
    a host wants to receive data from a USB peripheral, the host issues an IN token
    to the peripheral. The slave peripheral responds with the data or a NAK. slave
    peripherals cannot interact with each other. The current version of the USB specification
    is 2.0. USB supports four different types of communication:


    +   - Control Transfers—consist of standard, class, vendor, and reserved. All
    devices must respond to certain standard control messages.


    +   - Interrupt Transfers—limited-latency transfer to or from a device. The data
    can be presented for transfer at any time and is delivered by the USB at a rate
    that is not slower than what is specified by the device. An example of this type
    of transfer is the coordinates from a USB mouse device.


    +   - Isochronous Transfers—intended for multimedia devices with large amounts
    of data that is continuously exchanged.


    +   - Bulk Transfers—typically consists of larger amounts of data. Reliability
    of this data is ensured by the hardware level using error detection and retries.
    Bandwidth for bulk transfers varies depending on other bus activities.


    Additional detailed information about the USB and the necessary specifications
    can be found online at:


    www.usb.org


    eCos provides support for USB slave devices. The eCos USB support consists of
    four packages, which only provide support for developing USB slave peripherals
    and not USB hosts. Slave device driver packages are located under the usb subdirectory.
    This is with the other device drivers within the devs subdirectory. The other
    packages for USB support are located under the usb subdirectory within the I/O
