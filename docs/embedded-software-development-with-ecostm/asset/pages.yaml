    # 7.1.1 Counters


    The first ECos feature is a **counter**. A counter is an abstraction, which maintains
    an increasing value that is driven by a source of ticks. The source of the ticks
    does not have to be from a hardware device, nor does the need to be periodic.
    However, it is up to the owner of the counter to ensure that the counter object
    is being ticked.


    eCos offers different implementations of the counter object. The first implementation
    uses a single linked list for maintaining alarms attached to counters. When a
    tick occurs, the kernel goes through this linked list, usually at the ISR level.
    Therefore, if there is a sizable number of alarms attached to a single counter
    object, the system dispatch latency increases.


    The second implementation uses a table of linked lists for maintaining alarms
    attached to counters, allowing the size of the table to be set by a configuration
    suboption. This can improve the responsiveness of the kernel because only one
    list is searched per tick; however, extra code and data is required. The counter
    configuration options are described in Item List 7.3.


    # Item List 7.3 Counter Configuration Options


    | Option Name | Implement Counters Using a Single List |

    | CDL Name | CYGNIMP_KERNEL_COUNTERS_SINGLE_LIST |

    | Description | Uses a single linked list for maintaining alarm objects. This
    is a more efficient use of memory when a small number of alarms are used in the
    system. The default setting for this option is enabled. |


    | Option Name | Implement Counters Using a Table of Lists |

    | CDL Name | CYGNIMP_KERNEL_COUNTERS_MULTI_LIST |

    | Description | Uses a table of lists for alarm objects. This option reduces the
    amount of computation necessary when a timer triggers, which is useful when many
    alarms are used in the system. This option is disabled by default. When using
    a table of lists the suboption *Size of Counter List Table*, which has a default
    value of 8, can be configured. The range for the counter list size is from 1 to
    1024. |


    | Option Name | Sort the Counter List |

    | CDL Name | CYGNIMP_KERNEL_COUNTERS_SORT_LIST |

    | Description | Allows the list of alarms that are attached to counters to be
    sorted so that the next alarm to trigger is at the front of the list. This reduces
    the amount of work that needs to be done |'
