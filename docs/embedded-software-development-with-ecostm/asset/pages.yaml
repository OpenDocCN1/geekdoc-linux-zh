    # 6.2.3 Condition Variables


    Another synchronization mechanism is the condition variable. Condition variables
    are used with mutexes that allow multiple threads to access shared data. Typically,
    there is a single thread producing the data, and one or more threads waiting for
    the data to be available. The thread producing the data can signal a single thread
    to wake up or all threads to wake up, with a broadcast signal, when the data is
    available. The waiting threads can then process the data as needed. Item List
    6.6 lists the API condition variable control functions.


    eCos contains two configuration options for condition variables. Condition Variable
    Timed-Wait Support (CYGMN_KERNEL_SYNCH_CONVAR_TIMED_WAIT), allows the cyg_timed_wait
