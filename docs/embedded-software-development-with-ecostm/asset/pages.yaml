    Code Listing 12.3 Example application makefile.


    In Code Listing 12.3, the first part of the makefile sets up variables that we
    can use later so that ourmakefile is easier to understand and allows repetitious
    use of variables without re-entering an entire string. When we want to use a variable,
    we use the syntax $(VARIABLE_NAME). Whether string VARIABLE_NAME has been declared
    or substituted where the variable is used.


    On line 2 we set the variable PKG_INSTALL_DIR to the location of the ecos library
    we built in the previous stage of our example. On line 5 we set the variable XCC
    to the name of the compiler we are using; in this case, it is the i386 ELF compiler
    (i386-elf-gcc).


    Next, we set the build flags to different variables. Variables allow us to substitute
    a variable name in place of a long string for clarity and for repeated use in
    multiple locations of ourmakefile.


    The first variable is FLAGS, shown on lines 8 and 9, which contains the flags
    we pass to the compiler GCC. The next variable is LDFLAGS, shown on lines 10 and
    11, which contains the options for the linker LD. Both variables FLAGS and LDFLAGS
    are located on a single line in the actual makefile; however, they are split up
    so that all the options can be shown.


    The LIBS on line 12 contains the library options that are also passed to the linker.
    Finally, the variable LD is defined on line 13 for the linker. In this case, the
    linker is built into the compiler executable, i386-elf-gcc, so we use the XCC
    variable name to invoke the linker.


    The next part of the makefile contains the build rules or goals. The goals are
    the targets that the makefile attempts to update. First, all on line 16. This
    is the main target to build, which is the ELF basic file.


    Lines 18 and 19 contain the information to build the target basic1.o. As we see
    on line 19, the compiler is invoked using the variable XCC and it is passed the
    flags that follow, including the string from the variable CFLAG.


    On lines 21 and 22 is the information to build the target basic1. The basic1 target
    is the ELF image, which is generated by the linker and the linker options shown
    on line 22.


    A brief description of the compiler and linker flags used is included in the makefile.
    For additional information about the various compiler flags, at the bash prompt
    you can enter the command:


    ```

    $ i386-elf-gcc --help

    ```'
