    # ## 4.1.2.1 Communication Channels


    Since the HAL controls the low-level I/O for diagnostic and debug communication,
    it is important to understand the scheme that ECos use access to the different
    I/O ports. All HAL I/O happens via the communication channels, also COMMS channels.
    There are two types of COMMS channels within the HAL, console and debug. Each
    channel type is configured using any physical port, or as Ethernet, on the target
    hardware.


    Console channels are used for diagnostic I/O in the debugging process; for example,
    routing printf for event logging, traces, or assertion messages. Normal I/O communication
    should use proper device drivers as described in the I/O Control System section
    of Chapter 7. Debug channels are used for communication between the host debugger,
    such as GDB, and the ROM monitor.


    The number of communication channels varies among the different platforms. The
