    # 1.3 Architecture Overview


    eCos is designed as a configurable component architecture consisting of several
    key software components as the kernel and the HAL. The fundamental goal is to
    allow construction of a complete embedded system from these reusable software
    components. This allows you to select different configuration options within the
    software component, or remove unused components altogether, in order to create
    a system that specifically matches the requirements of your application. By creating
    an eCos image that closely matches your system requirements, the size of the software
    is compact, only including used components. The software application is also faster
    because extra code is not executed, compared to real-time operating systems that
    do not offer configurability, and therefore, incorporate all functionality regardless
    whether it is required by the application.


    Figure 1.1 shows an example of how the core building blocks, and some of the optional
    components available in the eCos system, can be layered together to incorporate
    the functionality needed for a specific application.


    Since configuration is a key aspect of the eCos system, tools are provided to
    manage the complexity of the different configuration options. These tools also
    allow components to be added or removed as needed. The tools build the main end
    product of an eCos configuration, which is a library that can be linked with application
    code.


    # 1.3.1 eCos Terminology


    The eCos configuration system involves some key terms that are important to understand.
    These terms are used in eCos documentation and throughout this book.


    # 1.3.1.1 Component Framework


    The collection of tools that allows users to configure the eCos system and manage
    different packages in the repository is called the component framework. Included
    in the component framework are the command-line configuration tool, the graphical
    Configuration Tool, the Memory Layout'
