  md: '# 4.1.1 Virtual Vector Configuration


    The virtual vector configuration options affect the initialization of the VVT.
    The default configuration for the VVT, which can be overridden, by the ROM monitor
    provides the debugging and diagnostic I/O services, and RAM applications rely
    on these services. In the case of a standalone production system, all services
    are provided by the application.


    The virtual vector configuration options are located under the ROM Monitor Support
    (CYPKG_HAL_ROM_MONITOR) configuration option within the HAL Common Configuration
    Components. The main virtual vector configuration option is Enable Use of Virtual
    Vector Calling Interface (CYGSEM_HAL_VIRTUAL_VECTOR_SUPPORT), which is enabled
    by default and can only be disabled by hand-editing configuration files. Item
    4.1 lists the virtual vector configuration subscriptions.


    The two configuration options, Behold as a ROM Monitor (CYGSEM_HAL_ROM_MONITOR)
    and Work With a ROM Monitor (CYGSEM_HAL_USE_ROM_MONITOR), determine the type of
    image being built. These options are also found under the ROM Monitor Support
    (CYPKG_HAL_ROM_MONITOR) configuration option within the HAL Common Configuration
    Components. The two ROM monitor options dictate the virtual vector configuration
    subscriptions take effect. For RAM application debugging, typically Work With
    a ROM Monitor is enabled. If a ROM monitor or released application is being built,
    Behold as a ROM Monitor


    # Item 4.1 Virtual Vector Configuration Suboptions


    +   - Option Name Inherit Console Settings From ROM Monitor

    - CDL Name CYGSEM_HAL_VIRTUAL_VECTOR_INHERIT_CONSOLE

    - Description Allows the RAM application to inherit the console setup by the ROM
    monitor using the configured channel and text encoding style.


    +   - Option Name Debug Channel Is Configurable

    - CDL Name CYGPRI_HAL_VIRTUAL_VECTOR_DEBUG_CHANNEL_CONFIGURABLE

    - Description Allows the HAL startup code to make use of the debug channel configuration.


    +   - Option Name Console Channel Is Configurable

    - CDL Name CYGPRI_HAL_VIRTUAL_VECTOR_CONSOLE_CHANNEL_CONFIGURABLE

    - Description Allows the HAL startup code to make use of the console channel configuration.


    +   - Option Name Initialize Whole Virtual Vector Table

    - CDL Name CYGSEM_HAL_VIRTUAL_VECTOR_INIT_WHOLE_TABLE

    - Description Causes the entire VVT to be initialized a default service function,
    nop_service. This is performed in hal_if_init.


    +   - Option Name Claim Virtual Vector Table Entries By Default

    - CDL Name CYGSEM_HAL_VIRTUAL_VECTOR_CLAIM_DEFAULT'
