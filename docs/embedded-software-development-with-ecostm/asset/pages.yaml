    # 8.8 The GoAhead Embedded WebServer


    Although SNMP is the long-time standard for remote management, more and more devices
    are seeking an alternative method to eliminate the shortcomings of SNMP. The latest
    trend is to use Web protocols, such as HyperText Transfer Protocol (HTTP), HyperText
    Markup Language (HTML), and Java, for remote device management, also called Web-based
    management. This is accomplished through the use of an embedded Web server running
    on the device. A device''s data can generate dynamic content that is represented
    in a Web page. These pages are accessed by any standard browser and become the
    graphical interface to the device. Devices become more user friendly when they
    can be controlled using a common interface, such as the browser. For example,
    programming a VCR might not be as daunting as a task if the job could be done
    via a browser interface.


    There are a few disadvantages to using SNMP for remote management. One disadvantage
    is the requirement of application software to control remote devices that is often
    costly and difficult to use. Another disadvantage is that SNMP uses UDP, which
    is an unreliable protocol; for communication across networks. Packets that are
    lost in transmission are not retransmitted, and acknowledgment of received packets
    is not provided. This can have dire consequences if the information contained
    in that packet was crucial to the system.


    Along with the hip, up-and-coming trend, Web-based management allows the use of
    a standard interface that is familiar to most users. Having the browser as an
    interface also allows the use of handheld devices, most of which have browsers
    as standard software, for portable management. Network communication from devices
    is accomplished using TCP, which is a reliable protocol.


    Companies currently using the GoAhead WebServer in products include Hewlett-Packard,
    Honeywell, Siemens, and Canon. A complete list of customers is provided on the
    GoAhead WebSite at:


    www.goahead.com/webserver/customers.htm


    > My wife, who finds the VCR a daunting task, can verify this and, therefore,
    relies on me for all of her video recording needs. Yet she is a wizard with a
    computer to navigate the Web with her favorite browser.'
