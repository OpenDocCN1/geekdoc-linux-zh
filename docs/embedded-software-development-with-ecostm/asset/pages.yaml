    # 9.4.1.1 Boot Scripting


    RedBoot supports running scripts during the hardware boot cycle. Boot scripting
    allows you to run commands you always want executed after power up. For example,
    if you are constantly going to load an image into memory for execution and debug,
    you can avoid entering manually by setting up a boot script. A timeout is included
    in the boot script setup to allow you to abort the boot script at a particular
    power cycle by simply pressing Ctrl+C. This boot script is set up and run on the
    Motorola PowerPC MBX8690 board.


    Boot scripts are set up using the fconfig command. Entering true (or t) when fconfig
    prompts for Run script at boots RedBoot in a mode allowing you to'
