  md: '# Configuring the Windows Host


    This command allows us to log in to the online eCos repository. When the password
    dialog box comes up, enter:


    ```

    anoncvs

    ```


    The password is stored in the file .cvspass under the WinCVS home directory, which
    we selected during the preferences setup as D:\ \ecos. We are now ready to enter
    commands to update our local eCos source code repository.


    > NOTE Updating your local eCos source code repository should not be done at this
    point. The examples we go through Chapter 12 have been developed using the source
    repository from the eCos development kit installation procedure. It is a good
    idea to run through the examples prior to updating to the latest eCos repository
    source.


    It is a good idea to use different directory trees when checking out snapshots
    of the eCos source code rather than using a directory containing a full release.
    To check out the latest snapshot of the eCos repository, create a new directory
    for checkout. Then, change to that directory. Next, enter the following command
    in the WinCVS output:


    ```

    cvs -d pserver:anoncvs@sources.redhat.com:/cvs/ecos -z 6 co -P ecos

    ```


    This is a checkout (co) command. The -d option specifies the CVS root directory.
    The -z 6 option sets the compression level. co is a synonym for the checkout command.
    The option -P notifies WinCVS to prune any empty directories. eCos is the module
    to checkout.


    > NOTE The entire eCos repository, including the source code for eCos tools and
    RedBoot binary images, can be downloaded using ecos-full as the module name; for
    example, cvs -d pserver:anoncvs@sources.redhat.com:/cvs/ecos -z 6 co -P ecos-full.
    However, be cautious using this because all RedBoot images will be downloaded,
    which totals about 12 Mbytes.


    This initiates a connection to the CVS server and checks the latest version of
    eCos, which includes all packages and RedBoot as well.


    After a local repository has been created, different commands are entered to update
    the repository.


    ```

    cvs -z 6 update -d -P

    ```


    The preceding command updates any files that have been modified since the last
    time the files were checked out.


    Other commands are available to check repository files from specific dates or
    with specific labels. Additional information about commands is located in the
    WinCVS help. Select'
