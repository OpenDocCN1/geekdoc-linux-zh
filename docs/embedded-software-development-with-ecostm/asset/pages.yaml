    # 6.2.2 Semaphores


    A semaphore is a synchronization mechanism that contains a count indicating whether
    a resource is locked or available. There are two types of semaphores, counting
    and binary. Binary semaphores are similar to counting semaphores; however, their
    count is never incremented past a value of one. Binary semaphores are in either
    a locked or unlocked state.


    Counting semaphores can be in multiple states depending on their count value.
    Counting semaphores contain a value that is incremented when a thread posts to
    a semaphore, and the value is decremented when a thread completes a wait for the
    semaphore. Only the highest priority waiting thread is executed when a higher
    priority count is above zero. Counting semaphores are often used when a thread
    or ISR, which received data, need another thread to continue processing the data
    at a lower priority.


    The ECos kernel provide APIs for creating and managing semaphores. The kernel
    API is for counting semaphores and not binary semaphores. These API functions,
    are defined in Item List 6.5, using counting semaphores.


