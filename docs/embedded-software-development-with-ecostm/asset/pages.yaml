    > **NOTE** When using the Ethernet port for RedBoot communication and in your
    application, it is important to set up the IP addresses properly. The system distinguishes
    the destination of a packet using the IP address. If the IP address for RedBoot
    and the application are the same, RedBoot will receive all incoming Ethernet packets,
    not passing them on to the application for processing. To avoid this, it is best
    to use a static IP address in one image and a separate static or dynamic image
