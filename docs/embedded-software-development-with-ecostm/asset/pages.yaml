    # 8.9 Symmetric Multi-Processing Support


    SMP is a computer architecture that uses multiple CPUs to process program code.
    The multiple CPUs share a common operating system and memory subsystem. This allows
    the processors to work together to share the workload in an embedded system, which
    provides higher performance than a single-processor system. eCos provides support
    on selected architectures and platforms. This support is broken down into HAL-
    and kernel-level support. SMP support is only available in the multilevel queue
    scheduler.


    eCos does impose some hardware limitations in its SMP support, including:


    +   - The maximum number of CPUs supported is eight, with the typical number being
    two or four.

    - The hardware must supply a synchronization mechanism in the form of a test-and-set
    or compare-and-swap instruction. The eCos kernels use these hardware instructions
    for the spinlock implementation.

    - No caches are used, all processors share the cache in the system, or the hardware
    maintains coherent caches. This prevents eCos from performing cache flush operations
    around each memory access.

    - All memory shared among CPUs is addressed at the same location for all CPUs.

    - All devices are accessible by all CPUs.

    - An interrupt controller must be present to route interrupts to a specific CPU.
    Other architectures include all interrupts delivered to a single CPU, certain
    interrupts bound to a specific CPU, or certain interrupts local to each CPU. eCos
    does not support delivering interrupts to all CPUs in the system and allowing
    the software to resolve conflicts.

    - To allow events on one CPU to cause rescheduling of another CPU, a mechanism
    is needed to allow one CPU in the system to interrupt another CPU.

    - Software that is running on a particular CPU must be able to identify which
    CPU it is running on.'
