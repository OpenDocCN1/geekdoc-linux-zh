    All HAL initialization sequences, when running from ROM monitor, a ROM application,
    or RAM application, call the function hal_if_init, located in the file hal_if.c
    under the common HAL subdirectory. Within this function, the initialization sequence
    for the VVT is determined by the virtual vector configuration suboptions selected
    and the type of image, ROM monitor/application or RAM application, the ECos library
    is built for use with.


    > NOTE It is not possible to step through the hal_if_init if the RAM application
    is configured to initialize the whole VVT or reconfigure the communication channels.
    This scenario would create a problem with the RAM application HAL initializing
    services in the VVT while the ROM monitor is trying to use the services already
    configured in the VVT for debugging I/O. One way to debug this scenario is to
    leave the VVT that the ROM monitor is using alone and use a RAM application version
    of the VVT, at another address, for debugging the RAM application code.


    In a typical ECos debug environment, two separate images exist, a ROM monitor
    and a RAM application. Using these two images and the default virtual vector configuration
    suboptions, the steps involved in the initialization of the VVT are:


    +   1. ROM monitor is booted, causing the HAL built into the ROM monitor image
    to initialize the VVT with its own default service vectors according to the virtual
    vector configuration suboption settings.

    2. The RAM application is loaded into memory via the debug channel in the ROM
    monitor.

    3. Next, the ROM monitor is given a command to execute the RAM application. This
    turns control over the RAM application; however, the VVT still contains function
    and data services provided by the ROM monitor.

    4. Finally, the RAM application HAL executes, reinitializing the VVT according
    to the virtual vector configuration suboption settings. Any services that the
    RAM application provides are set into the VVT.


    Figure 4.1 shows the initialization sequence and default VVT after the common
    HAL has performed its setup. The functions in the VVT, shown in Figure 4.1, are
    implemented in the common HAL.'
