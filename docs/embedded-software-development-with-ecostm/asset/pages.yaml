    To get better understanding of the relationship of the submodules in the HAL and
    how the different functionality is split among the directory structure, let us
    trace a function call into the HAL. The function we will trace is the __reset()
    function defined in the common-directory of the HAL. For this example, we will
    use the MIPS Atlas Evaluation board as the target hardware platform. The submodules
    that implement the functionality of the reset function can vary for different
    HAL architectures. Figure 2.2 is a graphical representation of the __reset() function
    trace.


    ![](img/e21b5ded81f449207668494619617bde_47_0.png)


    **Figure 2.2** HAL reset call trace.


    A description for each of the steps numbered in Figure 2.2 follows.


    +   1. The __reset() routine is the generically defined reset function for all
    HAL packages. The source code for this routine is found in the hal_stub.c file
    under the common\current\src subdirectory.

    2. Next, the hal_atlas_reset() routine, defined in plf_misc.c under the mips\atlas\current\src
    subdirectory, is executed for the MIPS Atlas platform.

    3. Finally, the platform reset routine uses the architecture macros defined in
    plf_io.h under the mips\atlas\current\include subdirectory to toggle the appropriate
    register within the processor. The HAL_REG() macro causes the write to the MIPS
    Atlas reset register.'
