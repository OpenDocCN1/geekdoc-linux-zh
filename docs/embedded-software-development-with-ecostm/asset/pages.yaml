    # 11.2.2. Importing and Exporting Configurations


    The import and export features of the Configuration Tool are useful in saving
    and restoring partial configurations. The import feature, located under File ->
    Import, is used to restore the exact configuration from a saved configuration
    file. An eCos Minimal Configuration, with .ecm ending, includes packages and configuration
    option values for a specific configuration. We use this feature in Chapter 12
    to import a RedBoot configuration.


    The export feature, located under File -> Export, saves a configuration to a .ecm
    file. This is useful if you need to replicate the exact configuration settings
    on another host system. Code Listing 11.5 shows a portion of an exported .ecm
    file. Exported minimal configuration files can also be viewed with a text editor.


