  md: '# STEP 2 Test Build of the New Platform


    What we have now in our example is a new platform named Martini that contains
    all of the functionality to operate the Motorola MBX860 evaluation board. This
    step verifies the changes we made to the CDL script files and allows us to build
    a RedBoot image with the Martini name that has the functionality to operate the
    MBX evaluation board. This allows us to verify the build process using our new
    hardware package.


    To verify that our new Martini package is present, first we need to launch the
    Configuration Tool. In the Configuration Tool, we can select new Martini package
    using the Templates dialog box. The Templates dialog box is displayed by selecting
    Build -> Templates from the menu. Figure 13.3 shows our new Martini template selected
    from the hardware platform drop-list.


    ![](img/e21b5ded81f449207668494619617bde_351_0.png)


    Figure 13.3 Templates dialog box showing our new Martini platform package.


    As we see in Figure 13.3, the modified description we made to the ecos.db file
    is displayed under the Martini Board hardware platform selection. We also want
    to select redboot from the Packages drop-down list. Click the OK button to load
    our new Martini package.


    > NOTE The Resolve Conflicts dialog box might pop up after selecting the new template.
    This occurs because we are changing from the default configuration loaded when
    the Configuration Tool leads to our new Martini platform configuration. If the
    Resolve Conflicts dialog box is displayed, click the Continue button to proceed
    with resolving all conflicts.'
