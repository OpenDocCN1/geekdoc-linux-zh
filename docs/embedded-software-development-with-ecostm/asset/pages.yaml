  md: '# Examples Overview


    ![](img/e21b5ded81f449207668494619617bde_312_0.png)


    Figure 12.4 Development environment configuration for ECos examples.


    The i386 PC Target is a Pentium-based PC to run RedBoot and our applications.
    The target system also needs to have a floppy drive. As we see in Figure 12.4,
    the host connects to the target via serial and Ethernet. We can use either connection
    for console and debug communication between the host and target, which was covered
    in Chapter 9, The RedBoot ROM Monitor.


    Finally, a network hub is used to connect the Ethernet ports together between
    the host and target system. The diagram gives the IP addresses used for the examples
    in this chapter. It might be necessary in your development environment to use
    different IP addresses based on your network configuration. The points where the
    network is configured are detailed in the examples.


    When using the serial port for debug and communications null modem cable is used
    to connect the COM port of the host to the serial port on the target.


    The Ethernet cards used in both PCs use the Intel 8259 Ethernet controller. It
    is important to use an Ethernet card that contains a controller supported by ECos;
    otherwise, the Ethernet port might not work properly for communications.


    In development environment, the IP addresses are statically configured. This eliminates
    the need for a DHCP or BOOTP server, which simplifies the development environment.
    The Host Development System uses IP 192.168.0.2. The RedBoot IP address is 192.168.0.10.
    Information regarding RedBoot and static IP addresses is covered in Chapter 9.
    By using these IP addresses, a private network is created. Both connections are
    on the same network using a subnet mask of 255.255.255.0.


    > NOTE It is not good idea to use static IP addresses in a released product. The
    network that a device goes into can vary widely. In this case, it is better to
    use a dynamic IP address configuration scheme such as DHCP or BOOTP in order for
    the device to obtain its IP address. However, we use static IP addresses in these
    example scenarios to simplify things.'
