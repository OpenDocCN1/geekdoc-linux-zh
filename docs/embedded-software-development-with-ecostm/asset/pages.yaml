- img_proc: true
  md: '# Chapter 6 · Threads and Synchronization Mechanisms


    A mutex provides protection against priority inheritance, whereas a binary semaphore
    does not. Priority inheritance is discussed later in this section.


    A mutex also has the concept of an owner, and only the owner can unlock the mutex.
    A binary semaphore does not have this requirement; it is possible for one thread
    to lock a binary semaphore and another thread to unlock it. Once a mutex is locked,
    it should not be locked again; this might cause undefined behavior. A thread that
    attempts to lock a mutex that is currently owned by another thread will block
    until the owner unlocks the mutex.


    One issue that arises in real-time systems when using mutexes is priority inversion.
    Priority inversion occurs when a high priority thread is incorrectly prevented
    from executing by a low priority thread. An example of this is when the high priority
    thread is waiting on a mutex that is currently owned by the low priority thread.
    Then, an unrelated priority thread preempts the low priority thread, preventing
    the high priority thread from executing at its proper priority.


    Ecos provides two solutions to the priority inversion problem that are selectable
    as priority ceiling protocol. The priority ceiling protocol, all threads that
    acquire the mutex have their priority raised to a preconfigured value. This value
    is available as a configuration option. One disadvantage to this protocol is that
    the priority level for threads using the mutex must be known at all time. Another
    disadvantage is that if the ceiling value is too high, unrelated threads with
    priority levels below the ceiling can be locked out from executing, possibly causing
    real-time deadlines to be missed. The priority ceiling protocol is used even when
    priority inversion is not occurring.


    A more elegant Ecos provides a priority inheritance protocol. The priority inheritance
    protocol allows a thread that owns the mutex to be raised to the priority level
    equal to the highest level of all threads waiting for the mutex. The priority
    inheritance protocol is only used when a higher priority thread is waiting for
    the mutex. The drawback of using this protocol is that synchronization calls are
    costlier because the scheduler must comply with the inheritance protocol each
    time.


    The configuration options for the mutex synchronization primitive can be found
    under the Synchronization Primitives component within the Ecos kernel package.
    The main configuration option Priority Inversion Protection Protocols (CGSEM_KERNEL_SYN_MUTEX_PRIORITY_INVERSION_PROTOCOL)
    controls the inversion algorithm used for mutex operations. This option enables
    or disables the use of one of the priority inversion protocols for mutexes. Eliminating
    the use of a priority inversion protocol reduces code and data sizes. Ecos defines
    one algorithm for protection against priority inversion called Simple, which is
    only available with the multilevel queue scheduler. The Simple algorithm is designed
    to be fast and deterministic. The priority protocol used within the Simple algorithm
    can be set by configuration suboptions. The configuration suboption specifies
    that the inversion protocol used is Default Priority Inversion Protocol, which
    can be set to INHERIT, CEILING, or NONE. Item List 6.3 lists the configuration
    suboptions for the mutex priority inversion protocol.'
