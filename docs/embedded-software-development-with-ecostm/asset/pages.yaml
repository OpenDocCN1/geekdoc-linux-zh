    file for the currently selected configuration-item. A detailed description of
    the relationship between the CDL script files and the Properties window can be
    found in the Graphical Representation of CDL Script Files section of this chapter.
    The Properties window can be enabled or disabled by selecting View -> Properties
    from the menu bar or using the hot-key combination Alt+1.


    Two columns divide the Properties, Property and Value. The Property column gives
    the name found in the CDL script file. Each configuration item contains different
    properties in the command bar. The Value column displays the available or current
    value sets from the CDL script file.


    Double-clicking the URL property causes the referenced HTML page to be displayed.
    This is the same as right-clicking in the Configuration window, and selecting
    Visit Documentation. Double-clicking on the File property opens the file described
    in the Value column. This file contains the source code for the configuration
    option settings. The current configuration must be saved to this to work.


    # 11.2.1.6 Short Description Window


    The Short Description window displays a brief description, from the CDL script
    file, which contains information about the currently selected configuration item.
    The Short Description window is shown in Figure 11.3.


    This window can be enabled or disabled by selecting View -> Short Description
    from the menu bar or using the hot-key combination Alt+3. The information displayed
    in the Short Description window is also displayed when right-clicking the configuration
    item, in the Configuration window, and selecting Visit Documentation.


    # 11.2.1.7 Output Window


    The Output window is located at the bottom of the Configuration Tool as shown
    in Figure 11.3. The Output window displays messages generated by the execution
    of external tools. For example, when building the eCos library, the Output displays
    commands executed during the build process with any warning or error messages
    that occur. The Output window can be enabled or disabled by selecting View ->
    Output from the menu bar or using the hot-combination Alt+2.


    Right-clicking in the Output window pops up a menu that allows you to copy text
    from the window, select all text in the window, or save the output window to a
    log file.


