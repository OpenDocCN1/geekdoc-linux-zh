  md: '# 8.2.3 GDB Stub


    At the core of the ROM monitors is the GDB stub. The GDB stub is a piece of software
    that provides the low-level interaction with the HAL, as well as the GDB protocol
    communication layer. The low-level HAL interaction includes hooks into the serial
    port for communication with the GDB host and installing trap handlers for breakpoint
    support.


    The GDB stub can also be built into a simple GDB stub application that resides
    in the target hardware''s ROM and provides the ability to load and debug applications.
    This application can be used in lieu of a GDB monitor.


    The GDB stub is contained in the file generic-stub.c with stub routines in the
    file hal_stub.c. These files are located under the common HAL subdirectory. For
    additional information on the GDB communication protocol, see the online documentation
    at:


    ```

    http://sources.redhat.com/gdb/onlinedocs/gdb_toc.html

    ```


    GDB stub software can be included in any eCos image to provide GDB debugging functionality.
    Both CygMon and RedBoot include GDB stubs. The stub code can be invoked by the
    GDB host or by the application itself calling the breakpoint routine. The configuration
    options control which GDB stub code is included. These options are located under
    the common HAL configuration Source-Level Debugging Support. The options for including
    GDB stubs in eCos images are detailed in Item List 8.1.


