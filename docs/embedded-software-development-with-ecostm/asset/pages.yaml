    #  11.2.1 Configuration Window

    The main window of the Configuration Tool is the Configuration window. As we see
    in Figure 11.3, this window contains a tree-based representation of the configuration
    items (packages, components, and options) currently loaded into the configuration
    on the left side of the splitter bar. Each of these configuration items is enclosed
    in a cell. The right of the splitter bar is the version of the package—in this
    case, the version is current—or the current option value setting.


    Clicking on a particular cell activates configuration item. Clicking on the right
    side of the splitter bar allows you to modify a particular option. To end editing
    of a particular cell, you can either click elsewhere in the Configuration window
    or press Enter. To discard modifications and revert to the previous value, press
    the Escape key.


    The plus and minus signs next to each node allow you to expand or contract the
    packages, components, or options located within that node. Each node contains
    an icon before the text you use in determining the type of module the node represents.
    The different icons are shown in Table 11.1.


    | Table 11.1 Configuration Tool Module Icons |

    | Icon | Description |

    |---|---|

    | [] | Represents a package. Typically located at the highest level and contain
    components and options for configuration. In Figure 11.3, the packages shown include
