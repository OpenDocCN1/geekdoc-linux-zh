  md: 'The main goal of the application build is to generate a binary file, which
    includes our ECos library. The flow diagram for the application build procedure
    is shown in Figure 12.8.


    Figure 12.8 Application build procedure flow diagram.


    ![](img/e21b5ded81f449207668494619617bde_324_0.png)


    As we see in Figure 12.8, we start with our C language source file basic1.c. In
    this example, we use a makefile and the GNU make utility for the build process.
    First, the GNU compiler—in our case, i386-elf-gcc—is invoked.


    Next, the GNU linker, i386-elf-ld, is run, which links our application object
    file and the ECos library, libtarget.a. The other necessary ECos libraries are
    also linked at this time. The linker script file target.ld, generated during the
    ECos build procedure, is used during the linking process.


    The output is an ELF executable file, basic1.exe. We use one of the GNU binary
    utility, i386-elf-objcopy, to translate the ELF format file into an S-record file.
    RedBoot is used to download our application image in the S-record file.


    # 12.5.1 Building the Application


    The source code for this example application is located on the CD-ROM under the
    examples\application subdirectory, which includes the source code basic1.c and
    the build application makefile. Also included in the examples\application\bin
    directory are the ELF (basic1.exe), S-record (basic1.srec), and map files for
    the basic application build.'
