    # 8.3.2 RAM File System


    The eCos RAM file system purely uses RAM to store file data. Therefore, it does
    not permanently store the file system data because the contents are lost when
    the system is reset. The RAM file system starts uninitialized with no files present.
    It can then be used to store temporary data using the classic file abstraction,
    for applications requiring a file system, or it can be loaded with the contents
    of a ROM file system to provide a fully writable file system.


    The eCos RAM File System (CYPGKF_FS_RAM) package is located in the ram subdirectory
    under the file packages subdirectory fs. Figure 1.3 in Chapter 1 shows the directory
    file system, similar to the ROM implementation, uses a node to describe files
    and directories in.


    The node structure, ramfs_node, is defined in the file ramfs.c and includes the
    node type, size of the file in bytes, the last file access time, and last modification
    time. The RAM file system implementation contains two different storage mechanisms,
    Simple and Block.


    The Simple mechanism uses malloc and free to allocate memory for nodes and the
    file data. If the file data increases in size, memory is reallocated for file.
    This mechanism has the advantage of using only the amount of memory it needs to
    contain all files in the RAM file system. The Simple mechanism, as the names imply,
    is a straightforward approach. One disadvantage of this mechanism is fragmentation
    of the heap from constant locations for file. This can lead to the inflation of
    a file to grow size larger than the amount of memory that can be allocated from
    the heap. Another disadvantage is that the malloc implementation must be included
    in the eCos image.


    The Block mechanism divides file data memory into fixed-size blocks. The allocation
    method for these blocks can be from a predefined array of blocks or using malloc
    and free. File data for each node, ramfs_node, is arranged in three arrays of
    pointers to the data block structure, ramfs_block. The number of arrays used is
    set by configuration options, shown in Item List 8.3. The three arrays allow direct
    access, single-level indirect access, and two-level indirect access to the data
    blocks. Figure 8.2 shows the three different data access object arrays for an
    example file node with a filename sys_info.txt.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# File Systems


    ![](img/e21b5ded81f449207668494619617bde_184_0.png)


    Figure 8.2 RAM file system Block data storage mechanism architecture.


    The Block data storage mechanism has the advantage of using fixed-size blocks
    making management of memory easier. Another advantage is that the allocation mechanism
    is configurable; therefore; the malloc implementation can be excluded from the
    image. A disadvantage of this mechanism is using the malloc allocation method;
    each block causes a malloc call rather than a single call for the entire file.
    The memory allocated is also only available for the RAM file system.


    There are configuration options that determine the data storage implementation
    used for the RAM file system. These options are Simple Implementation (CYPGKG_FS_RAM_SIMPLE)
    and Block-Based Allocation (CYPGKG_FS_RAM_BLOCKS), which are located under the
    RAM File System. Only one of the data storage implementations can be selected
    for the RAM file system. The Simple Implementation includes the configuration
    option that sets the amount of memory to allocate for new data added to a file.
    This suboption is Size of File Data Storage Increment (CYNUM_RAMFS_REALLOC_INCREMENT).
    The different configuration options for the block storage mechanism are detailed
