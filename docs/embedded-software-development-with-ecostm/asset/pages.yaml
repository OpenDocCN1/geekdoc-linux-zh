    # ### 1.3.1.3 Configuration Options


    The configuration option is the fundamental unit of configurability in the eCos
    system. Typically, a configuration option corresponds to a single choice you can
    make. This choice might be to enable, disable, or to set a value for the option.
    Configuration options have a macro associated with them. The macro is used in
    the source-level configuration control. Each macro has a sensible default value
    that can be used as a baseline. When the application is built and running, the
    options can be tuned to meet the specific requirements of the system. The configuration
    options selected can affect which files are built into the eCos library, or cause
    certain values to be set in a particular file. In turn, selection of certain configuration
    options allows you to have control down to a particular source code in some circumstances.


    The component framework uses a Component Definition Language (CDL) to describe
    the package. Within each package is at least one CDL script file. This script
    file describes the package to the component framework. Detailed information about
    the CDL can be found in Chapter 11.


    The configuration options detailed in this section are text names used by the
    graphical Configuration Tool. At this time, the configuration option and the relationship
    with its associated CDL name are unimportant. Throughout the book, the CDL names
    for specific components or options are given as reference.


    The nesting of configuration options is used to give finer control over the system.
    The nesting of configuration options is shown in Figure 1.2. The configuration
    option Scheduler Timeslicing contains the configuration suboption Number of Clock
    Ticks Between Time Slices. If Scheduler Timeslicing is enabled, a value, in this
    case 5, for the option can then be selected. If Scheduler Timeslicing is disabled,
    the option setting is irrelevant and cannot be selected within the Configuration
    Tool.


    A particular configuration option might have dependencies on other options in
    the configuration. These dependencies, or constraints, are sometimes straightforward
    where one configuration requires that another option be enabled. For example,
    in Figure 1.2, selecting the Bitmap Scheduler configuration option requires that
    Scheduler Timeslicing is disabled.'
