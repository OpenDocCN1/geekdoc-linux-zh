  md: '# FOREWORD


    In 1997, there were over 100 commercially supported embedded operating systems,
    none of which had more than a minority share of the overall embedded OS market,
    not to mention countless thousands of others developed for specific projects (cell
    phones, radar arrays, networking equipment, etc.) that had no application developer
    base beyond that specific project. In short, the embedded operating systems market
    was highly fragmented, and that this fragmentation was beginning to seriously
    limit the viability of many embedded software projects and the OEMs who funded
    those software projects.


    While it was clear to many that the major embedded software companies needed to
    change their business models in radical ways, each company believed that it could
    somehow outlast its competition, and that it could consolidate the market through
    a strategy of attrition rather than a strategy of innovation. At Cygnus Solutions,
    we couldn''t wait for 90 percent of the market to give up; moreover, we weren''t
    sure to serve a market that was 90-percent dead. Therefore, we took upon our own
    challenge to create an embedded operating system that could address the incredible
    variety of possible embedded system designs, from the very small to the highly
    complex, using a single source base.


    In our market research, we found two primary reasons why people wrote their own
    RTOSes: first, they didn''t want to pay per-unit royalties to a third party, and
    second they didn''t want to suffer the indirect cost of code that they didn''t
    write/control/understand using up resources within their systems. The fact that
    writing and debugging an RTOS is expensive (in time and money), and the fact that
    most custom RTOSes required a complete understanding of the entire system in order
    to make the smallest manual changes, often resulted in systems that were both
    more expensive to maintain and inferior in functionality to commercial alternatives,
    but such were the compromises required to avoid direct and indirect per-unit costs.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'The design philosophy of eCos was to augment an open-source RTOS (which meant
    no per-unit royalties) with source-level configuration tools that would enable
    embedded developers to scale their RTOS from hundreds of bytes to hundreds of
    kilobytes without needing to manually change a line of source code. Of course,
    if some code needed to be rewritten to meet some unique requirement, open-source
    licensing meant the option was there. However, for most cases the 200+ configuration
    points supported by eCos resulted in systems that were faster to build (all the
    hard work coded into the configuration rules) and in smaller systems than manual
    methods could produce (because the automated rules were more-seeing and all-knowing
    than most embedded developers could afford to be).


    Since releasing eCos in 1998, we have seen it develop both a healthy user base
    and a strong base of talented contributors. With the publication of this book,
    eCos reaches a new completely independent source of technical information about
    eCos, and a rather complete one at that. While this book is primarily targeted
    at RTOS engineers, it remains accessible to both managers and developers who might
    use, but not actually maintain, an RTOS.


    The scope of the book covers the very latest information about eCos, including
    a section on using eCos compatibility layers to provide POSIX, µltron, and even
    embedded Linux API embedded Linux, Indeed, as high-end embedded system design
    consolidates around embedded Linux, eCos is becoming even more important for two
    reasons: because it provides a platform for migrating to Linux APIs without the
    overhead of running a full Linux-based system, and because eCos is the basis of
    RedBoot, the new standard ROM monitor that Red Hat supports for its embedded Linux
    ports.


    Anthony’s book is easily the most complete treatment of eCos system development.
    I believe it is destined to become part of every eCos developer''s library.


    Michael Tiemann

    CTO, Red Hat, Inc.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# PREFACE


    Whether you''re working on an existing project or moving on to a new development,
    eventually you''re going to have to decide on what Real-Time Operating System
    (RTOS) to use. Numerous questions arise, including how much does it cost to get
    started, are are there royalties associated with the RTOS, what is the quality
    of the tools, source code available, what features are available for the RTOS,
    and so on. In most situations, the lowest-cost solution in both upfront costs
    and royalties is the best solution, as long as it works. Eliminating royalties
    is very important for high-volume products, where every nickel counts.


    There are also concerns of previous investments made, both in developer knowledge
    and financially, for the current solution. Anxiety can occur when considering
    existing code to a new software platform, which can be intimidating depending
    on the size of the project. Porting a new RTOS to your hardware platform can create
    more trepidation.


    Decisions about whether to develop your own RTOS or use an off-the-shelf solution
    in some cases as well; especially when specific functionality is needed for a
    specialized hardware platform. In some cases, rolling your own RTOS might be the
    only solution. However, you can put your development away by leveraging software
    that is already implemented, tested on numerous platforms and in various situations,
    and, most importantly, proven because it is successfully running on other shipping
    products. This eliminates the need for implementing functionality that is readily
    available.


    This book focuses on one solution to these concerns: the Embedded Configurable
    Operating System (eCos). The open-source and royalty-free nature of eCos allows
    it to be downloaded, set up, and used, and here''s the key: at no cost. When finished
    with this book, you will have a complete embedded software development environment—all
    the tools necessary to tackle any project.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# xviii


    # Preface


    Since eCos is open source, the developer, are in complete control over your embed-ded
    destiny. Even the tools described in the eCos development system are open source,
    allowing you to become completely self sufficient—although the eCos development
    community is out there available to help when needed.


    # Book Layout and Overview


    Let''s take a look at the layout of the book and get an overview of what is covered
    and where it is located. This enables you to focus on the specific aspects of
    eCos that you need to understand.


    The layout of the book is intended to build on information covered in earlier
    chapters. We start with understanding the key components within eCos, then move
    to additional functionality offered in the system, and finally, get down to eCos
    and the development environment.


    For developers new to the eCos world, or embedded software altogether, it is helpful
    to understand the components that make up the eCos system by starting at the beginning.
    This gives the baseline understanding of the different features provided by eCos.
    You can implement these software components in an actual system.


    More experienced developers looking for an evaluation of eCos can skip to the
    later chapters and begin right away. The format of the development platform installation
    and examples allow a quick setup of the tasks and immediate results. This lets
    you answer the question, "will eCos work for me?"


    Current eCos users can fill in any holes that might be present in their eCos knowledge,
    looking at some of the eCos concepts from a different point of view.


    Chapter 1, An Introduction to the eCos World, begins with a brief introduction
    to eCos, which includes a background about the eCos open-source project and the
    company behind it. A description of the eCos terminology is detailed as well.
    This terminology is used throughout the book and in the eCos development community.
    The beginning of the book is intended to provide developers who are unfamiliar
    with eCos as a means to become acquainted with the eCos open-source project.


    Next, we discuss the key components within the eCos system, presenting a closer
    look under the hood of these major software modules. The key component offers
    an an about how the different software modules work independently and together
    to provide functionality required by the system.


    Chapter 2, The Hardware Abstraction Layer, focuses on the software closest to
    the hardware-that enables higher-level software modules to be unaware of the low-level
    functioning of the hardware.


    Chapter 3, Exceptions and Interrupts, we detail exceptions and interrupts and
    show how they are set up and handled in the eCos system. We discuss virtual vectors
    in Chapter 4, Virtual Vectors, which provide a means to share services between
    ROM and RAM applications.


    The heart of the eCos RTOS, the kernel, is found in Chapter 5, The Kernel. The
    kernel supplies the scheduling functionality and the synchronization mechanisms
    for the software. Moving on Chapter 6, Threads and Synchronization Mechanisms,
    we discuss the basic unit of'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Preface


    xix


    execution in eCos, the thread, and provide a detailed look at the various synchronization
    mechanisms supported by eCos.


    Chapter 7, Other eCos Architecture Components, continues with our look at the
    different eCos components by focusing on timing components, assets and tracing
    functionality, and the I/O control system.


    Chapter 8, Additional Functionality and Third-Party Contributions, includes a
    broader look at some of the additional features available for eCos developed by
    the eCos project maintainers and third-party contributors. These include networking,
    ROM monitors, file systems, PCI support, USB support, and theing WebServer.


    Chapter 9, The RedBoot ROM Monitor, we focus on the RedBoot ROM monitor. This
    standalone program is designed for embedded systems to provide a debugging and
    bootstrap environment. RedBoot is an eCos-based application and uses the eCos
    Hardware Abstraction Layer (HAL) for its foundation.


    We begin our hands-on experience in Chapter 10, The Host Development Platform,
    we discuss the Cygwin tools, the GNU cross-development tools, and the eCos development
    tools. We also cover the installation of a Concurrent Versions System (CVS) client,
    WinCVS, to enable access to the eCos source code repository. This gives you the
    ability to take advantage of any bug fixes or extended functionality contributed
    to the eCos source code.


    Chapter 11, The eCos Toolset, delve into the eCos toolset with a detailed look
    at how the tools operate on the source code and the layout of tools. Also included
    some other open-source tools to round out and complete our open-source embedded
    development system. This prepares us for the next step, putting the tools to work
    to build our application.


    Chapter 12, An Example Application Using eCos, lets you put your knowledge to
    work. The chapter starts with an overview of the eCos build process, followed
    by a build of the RedBoot ROM monitor. We then do a build of the eCos real-time
    operating system, and finally, put it all together by building an application.
    This chapter provides a baseline on which you can add additional components to
    assemble a system to meet your embedded software requirements.


    Finally, Chapter 13, Porting eCos, closes with a look at porting eCos onto another
    platform. This is the key to getting your application running on your new target
    hardware platform, which is typically the main goal in embedded software development.


    # Development System and Examples


    As mentioned previously, in Chapter 10 we go through the process of setting up
    an eCos development system. This development system includes the native Cygwin
    tools for Windows (binutils, compiler, and debugger), the eCos configuration and
    management tools, a CVS client, and a lint program.


    This system enables you to configure and build the eCos library, which is then
    linked with an application to run the eCos RTOS. The RedBoot ROM monitor is also
    built using this system.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'After following the steps in Chapter 10, a complete open-source embedded software
    develop-ment environment is configured.


    We go through examples of building ReBoot, eCos library, and an application in

    Chapter 12. Rather than requiring a specific development board to run the examples,
    a second

    PC is needed for the target platform. This is a better approach to becoming familiar
    with the

    development tools since it''s pretty easy to find a spare PC lying around.


    Although GNU cross-development tools binary files are included on the CD-ROM for
    the

    Intel x86 and PowerPC processor architectures, the instructions for configuring
    and building the

    GNU cross-development tools for other processor architectures are provided in
    Appendix D,

    Building the GNU Cross-Development Tools.


    The embedded software development tools are installed, and are built, on a Win-dows
    system. However, the necessary files to get an embedded software develop-ment
    system up and running on a Linux system are included on the CD-ROM. Since the
    eCos

    configuration tools are able to run on both Linux and Windows, the procedure for
    building and

    running the examples applies to both operating systems.


    The CD-ROM accompanying this book contains the files needed to set up the complete

    embedded software development system for eCos as detailed in Chapter 10. The examples
    in

    Chapters 12 and 13 are also contained on the CD-ROM under the examples directory.


    A website is available to download the source code and updates. The site is located
    online at:


    www.ppht.com/mass/


    If you find any errors that need correction, feel free to contact me and I will
    update the

    source code accordingly.


    # Some Notes about the Book


    All example code in this book is in C or assembly language. eCos also uses the
    Component Def-inition Language (CDL), an extension of the existing Tool Command
    Language (Tcl) scripting

    language. We cover this in Chapter 11.


    In the text where a 32-bit hexadecimal value is shown, the most significant 16
    bits and least

    significant 16 bits are separated by an underscore ("_") (e.g., 0xABCD_EF12) for
    readability.


    Sidebars are also included, which are used to point out important or additional
    information-tion. The sidebars look like the following:


    # NOTE Example of a sidebar.


    This book includes several Uniform Resource Locator (URL) links showing where
    addi-tional information can be obtained on the Internet. The most up-to-date links
    are included in the

    text; however, we all know that links can have a finite existence.


