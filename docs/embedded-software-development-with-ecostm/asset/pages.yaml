  md: '# 7.2 Asserts and Tracing


    eCos supports two mechanisms to aid in debugging—asserts and tracing. An assert
    is a piece of code that checks, at run time, whether a condition is expected.
    If the condition is not expected, an error message can be output and the operation
    halted. Assertions can determine if there is a bug in the code and isolate the
    problem immediately, rather than having the application fail later during execution.


    Tracing allows the output of text messages at various points in the application''s
    execution. This output enables you to follow the execution flow of a program or
    check particular status when certain events occur.


    The eCos assert support is complementary to the ISO C standard functionality contained
    in the Assertions Implementation Header (CYGLD_ISO_ASSERT_HEADER) configuration
    option under the ISO C and POSIX Infrastructure package.


    Both asserts and traces are defined as macros. The first parameter to the macro
    is a boolean that determines whether the message is output. Leaving the assertion
    and tracing code enabled can cause performance degradation in a released image.
    Using macros allows the code to be compiled in application debug, however, the
    associated overhead is easily removed from a released image. Assert macros are
    defined in the file cyg_assert.h also within the infra package. The trace macros
    are defined in the file cyg_trac.h also within the infra package. This file also
    contains additional details in the comments at the top of the trace macros and
    their usage.


    Assert and tracing messages are output on the port configured with the Diagnostic
    Serial Port (CYGNUM_HAL_VIRTUAL_VECTOR_CONSOLE_CHANNEL) configuration option located
    in the architecture-specific eCos HAL package.


    There are three basic assertion macros defined by eCos that can be used within
    an application when assertions are enabled. Each offers control over the output
    message content. The first text output by all assert macros is a standard message
    "ASSERT FAIL", which might be followed by a possible additional text message.
    The three basic assertion macros are:


    +   - CYG_FAIL—does not accept a condition as its first parameter. Instead, this
    macro outputs the standard message along with a possible user-defined message
    regardless of any conditions met.


    +   - CYG_ASSERT—dcepts a condition as its first parameter. Depending on the value
    of the condition, this macro outputs the standard message along with a possible
    user-defined message.


    +   - CYG_ASSERTC—dcompact version of the assertion macro that outputs the standard
    message along with the resulting value of the first parameter.


    eCos supports four different modes for assert and trace output. These modes determine
    the format of the information that is output. The four modes are:'
