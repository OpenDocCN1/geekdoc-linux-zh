    - f flash_addr—Location in flash memory for the image. The flash address can be
    included as part of the linked executable image. If this option is not specified,
    the first free block in flash memory is used.

    -e entry_point—Execution entry address.

    -r ram_addr—Location in RAM when the image is loaded using the fis command. This
    option only needs to be specified if the image will be loaded with the fis command.

    -s data_length—Length in bytes of the actual data to be written to flash memory.
    If this option is not specified, the image length is less than the length for
    the -l option, the remainder of flash memory is left blank.

    -n—Updates FIS directory without copying image data from RAM to flash memory.
    This option can be used to recreate the FIS entry if it has been destroyed.

    -name—Name of the image to create.


