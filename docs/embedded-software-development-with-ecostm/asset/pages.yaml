  md: '# CHAPTER 5


    # The Kernel


    The core of the eCos system is the kernel. We begin this chapter by understanding
    the functionality provided by the kernel. Next, we cover the startup procedure
    kernel, prepares us for building an application. Finally, we look at the different
    scheduling schemes available, how they are used, and how we configure the kernel
    to meet the needs of different applications.


    This chapter, along with the material covered in the next chapter on threads and
    synchronization, prepares us for building an application that use the eCos kernel
    and its features.


    # 5.1 The Kernel


    The kernel is the core to the eCos system. The kernel provides the standard functionality
    expected in an RTOS, such as interrupt and exception handling, scheduling, threads,
    and synchronization. These standard functional components that comprise the kernel
    are fully configurable under the eCos system to meet your specific needs. The
    eCos kernel is implemented in C++ allowing applications implemented in C++ to
    interface directly to the kernel; however, there is no official C++ API provided.


    There is a configuration option to allow the use of a C kernel API. The kernel
    API functions are defined in the file kapi.h. The eCos kernel also supports interfacing
    to standard µTR and POSIX compatibility layers. Further information about the
    compatibility layers can be found in Chapter 8, Additional Functionality and Third-Party
    Contributions.


    A few criteria were the focus of the eCos kernel development to allow it to meet
    its real-time goals.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '+   * Interrupt latency—the time taken to respond to an interrupt and begin
    execution of an ISR is kept low and deterministic.


    +   * Dispatch latency—the time taken from when a thread becomes ready to run
    to the point it begins execution is kept low and deterministic.


    +   * Memory footprint—the memory resources required for both code and data are
    kept minimal and deterministic for a given system configuration. Dynamic memory
    allocation is configurable in the core components to ensure that the embedded
    system does not run out of memory.


    +   * Deterministic kernel primitives—the execution of kernel operations is predictable,
    allowing an embedded system to meet real-time requirements.


    The performance measurements of these real-time criteria can be found in the online
    documentation at:


    http://sources.redhat.com/ecos/docs.html


    The Ecos kernel API does not return standard error codes for its functions, a
    practice typical in most APIs. Error return codes ensure that the application
    is using the functions correctly. However, in an embedded system, processing error
    codes can cause a number of problems such as eating processing cycles and code
    space to check the return value. In addition, in an embedded system, typically
    there is no way to recover from certain errors so the application would be halted.


    Instead, the Ecos kernel provides assertions that can be enabled or disabled within
    the Ecos package. Typically, assertions are enabled during debugging, allowing
    the kernel functions to perform certain error checking. If a problem is discovered,
    an assertion failure is reported and the application is terminated. This allows
    you to debug the problem using the debugging facilities provided. After the debug
    process is complete, assertions can be disabled in the kernel package. This approach
    has several advantages such as limiting error checking overhead within the function,
    eliminating the need for application error checking, and if an error occurs, the
    application is halted allowing immediate debugging of the problem rather than
    relying on the check of a return code. Additional information about asserts and
    tracing can be found in Chapter 7, Other Ecos Architecture Components.


    The kernel components offer methods to enable debugging. One such method, enabled
    by configuration options, is kernel instrumentation. Instrumentation allows the
    kernel to invoke routines, whenever events occurs, which write event records into
    a circular buffer for analysis at a later time. These event records include time
    stamps, record type, and other supporting data that can be used for kernel debugging
    or analysis of time-critical kernel events.


