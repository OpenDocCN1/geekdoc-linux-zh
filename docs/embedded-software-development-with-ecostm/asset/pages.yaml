    Figure 11.14 Resolve Conflicts dialog box.


    As we see in 11.14, the top window displays the conflict that needs to be addressed
    with the columns Item, Conflict, and Property, which is the same format as the
    Conflicts window. The bottom window displays a Proposed Solution for each conflict.
    Each proposed solution can be individually enabled or disabled by selecting the
    checkbox in the Item column or a global enable, provided by the All button, and
    disabled, provided by the None button, are included in the dialog box. The default
    state is that all proposed solutions are enabled. Clicking the Continue button
    applies the proposed solutions selected. Clicking the Cancel button exits the
    dialog box without applying any solutions.


    If you choose not to apply the proposed solutions, the resolve conflicts dialog
    box can be displayed later by selecting Tools -> Resolve Conflicts from the menu
    bar. Unresolved conflicts are also displayed in the Conflicts window and a total
    count is shown on the bottom-right side of the status bar.


    > There are a couple of points to understand about conflicts and resolutions.
    First, an automatic resolution might not be generated for every conflict that
    comes. You might need to resolve the conflict by altering the configuration in
    some way. If this is the case, it is useful to use the Find tool, as described
    in The Configuration Tool section of this chapter, to search for the marco causing
    the conflict. The property column in the Conflicts window gives you a hint as
    to what the problem is and how you can resolve it.


    Finally, resolving a conflict might cause other conflicts to occur. In this case,
    you might, again, need to search and edit the configuration to resolve the conflict.
    In other circumstances, you might need to unload or load particular packages to
    resolve the conflict.'
