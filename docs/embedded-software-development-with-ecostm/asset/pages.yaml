  md: '# The Kernel


    Next, Thread A becomes able to run, causing Thread C to be preempted and a context
    switch occurs. During the execution of Thread A, Thread B also becomes able to
    run. Thread A continues until its timeslice expires. Then, another context switch
    occurs allowing Thread B to run. Thread B completes within its timeslice period.
    The de-scheduling of a thread can happen for various reasons; for example, waiting
    on a mutex that is not free or delaying a specified amount of time. Since Thread
    A has the highest priority of tasks to execute, a context switch occurs and it
    runs next. After Thread A has completed, a context switch takes places allowing
    Thread C to execute.


    # 5.1.3.2 Bitmap Scheduler


    The bitmap scheduler allows the execution of threads at multiple priority levels;
    however, only a single thread can exist at each priority level. This simplifies
    the scheduling algorithm and makes the bitmap scheduler very efficient. The number
    of priority levels is a configuration option from 1 to 32, corresponding to priority
    numbers 0 (highest priority) to 31 (lowest priority).


    > NOTE When using the bitmap scheduler, it is fatal to set two threads at the
    same priority number. An assertion is raised if the eCos image is built with assertion.


    The scheduling queue is either 8-, 16-, or 32-bit value, depending on the number
    of priority levels selected. A bit in the scheduling queue represents each priority
    level. The scheduler allows preemption between different priority levels. Since
    only one thread is allowed at each priority level, timeslicing is irrelevant and
    disabled as a configuration option when using the bitmap scheduler.


    Figure 5.4 illustrates an example of thread execution using the bitmap scheduler.
    In Figure 5.4, there are three threads created at different priority levels: Thread
    A—priority 0 (highest), Thread B—priority 1, and Thread C—priority 30 (lowest).
    The state of the bitmap scheduler after the threads are created is shown above
    the thread execution timeline. The timeline is a snapshot of thread execution
    with Thread C running. Next, Thread A and Thread B are able to run, causing a
    context switch and Thread C is preempted. Thread A executes next because it has
    the highest priority of the waiting threads. When Thread A completes, a context
    switch takes place, enabling Thread B to execute. After Thread B completes, Thread
    C can finish its processing.


    As we see comparing the execution timelines from Figures 5.3 and 5.4, the bitmap
    scheduler is a much simpler scheduling policy. However, the multilevel queue offers
    more options for thread operation. The decision of what scheduler to use is dependent
    on the specific needs of the application.


