    filename martini.ecc. The martini.ecc file used in this example, along with the
    install tree and MLT directory, are included on the CD-ROM for reference under
    the examples\martini\build directory.


    Now we can select Build -> Library from the menu bar to start the build process.
    It might be helpful to refer to Chapter 12, An Example Application Using ECos,
    for additional information on the build process.


    > NOTE You might find that additional modifications are needed to various source
    files if a different hardware is used as a baseline. Error messages that occur
    during the RedBoot image process are displayed in the Configuration Tool output
    window.


    When the build completes successfully, the final RedBoot image is located in the
    subdirectory martini_install\bin. We can then use the appropriate file to load
    our new Red-Boot image onto the evaluation board to verify that it operates properly,
    as shown in Chapter 12. It might be necessary to use the GNU Binary utility to
    convert the file format.


    If RedBoot runs normally (basically, if we see the RedBoot prompt), we know that
    we have successfully added the new Martini platform to our local ECos repository.
    We can now move on with the porting procedure.


    # STEP 3 Customize the New Platform Package


    The next step is to customize the packages and configuration options for our new
    hardware target. This consists of going through each of the CDL commands in the
    CDL script files associated with our new hardware platform to make modifications
    and additions that match the new hardware.


    There might be additional CDL script files that we need to modify other than the
    ones we edited in step 1. The extent of the changes necessary depends on the HAL
    package used for a baseline and the differences between the baseline HAL and the
    new hardware platform. In general, we need to check the real-time clock/counter
    configurations and the device driver packages included, specifically for serial
    ports and flash memory devices.


    > NOTE It is best to eliminate as many of the packages as possible and establish
    a minimal set of functionality for the new target platform. Having too many packages
    increases the amount of code in the image, as well as the possibility of encountering
    problems. After the minimal set of functionality is operating properly on our
    new platform, packages can be added back to the new platform to extend the feature
    set.


    Packages can be removed from the new target platform configuration using the Package
    Control dialog box, which is launched by selecting Build -> Packages from the
    menu. This dialog box is shown in Figure 11.15. Additional information about adding
    and removing packages is covered in Chapter 11.'
