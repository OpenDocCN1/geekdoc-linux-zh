  md: 'A description of each step numbered in the HAL startup process shown in Figure
    2.3 follows:


    +   1. The starting point for the system startup is after a power cycle has occurred,
    labeled Hardware Powerup. This startup process also applies for a soft reset startup.


    +   2. After a hard or soft reset occurs, the processor jumps to its reset vector
    (cleverly called reset_vector in the diagram). The reset vector is found in the
    file vectors.S under the arch sub उभ for each HAL architecture. This file contains
    the starting point for all HAL packages. The reset vector performs the minimum
    processor configuration to allow the system to continue with the initialization
    process.


    +   3. Next, the reset vector jumps to ~start. This is also found in vectors.S
    and is the main starting point for all HAL initialization.


    +   4. Next, the routine hal_cpu_init is called, which is located in either variant.inc
    or arch. depending on the architecture. This function handles processor-specific
    registers, such as disabling interrupt and data caches, to ensure that the processor
    is in a known state for the remainder of the initialization process.


    +   5. Next the routine is called hal_hardware_init. The functionality contained
    in this routine is platform specific and therefore found in the platform assembly
    file (for the Motorola MBX box, this is mbx.s). Hardware setup in this routine
    includes cache configuration, setting interrupt registers to a default state,
    disabling the processor watchdog, setting real-time clock registers, and configuring
    chip registers based on the platform-specific hardware.


    +   6. The next step is to perform an interrupt stack area. This reserves a storage
    area for processor state information when an interrupt occurs. The amount of space
    to reserve is configurable in the common configuration component. The startup
    context temporarily uses the interrupt stack to perform its initialization; for
    example, to make calls to C routines. Since interrupts are not enabled during
    this startup procedure, this does not create a conflict.


    +   7. The code executed in the hal_mon_init function, which is located in the
    file variant.inc or platform.inc, is configuration dependent. When executing as
    a ROM monitor or ROM application, the main task for this routine is to ensure
    that default exception handlers are installed for every exception supported by
    the processor. You can find more information on exception vector configuration
    in Chapter 3, Exceptions and Interrupts.


    +   8. The next step in the HAL initialization process is to clear the BSS section,
    which contains all noninitialized and global variables with static storage class.


    +   9. The stack is then set up so that C function calls can be made from the
    vectors.S assembly code.


    +   10. Next, the hal_platform_init routine is called, located in the hal_aux.c
    file, for a specific platform. This, in turn, calls hal_if_init, found in the
    file hal_if.c of the HAL common subdirectory, hal_if_init initializes the virtual
    vector table based'
