    # 8.3 File Systems


    eCos provides three different file system implementations: ROM, RAM, and JFFS2.
    Allocation Table (FAT) is also being developed.


    The Journalling File System version 2 (JFFS2) is a log-structured file system
    intended for embedded systems containing flash memory devices.


    Both the ROM and RAM system use the POSIX File I/O Compatibility Layer (CYPFKG_IO_FILEIO)
    package. The POSIX File I/O package provides control over the file systems installed
    and can be found in the fileio subdirectory under I/O Sub-System. The POSIX File
    I/O package contains a file table containing entries from each installed file
