    ECos supports two different schedulers that implement distinct policies. The ECos
    kernel is built using only a single scheduler at any time. The schedulers are:


    +   - Multilevel queue

    - Bitmap


    > NOTE A third scheduler exists in the ECos repository called the lottery scheduler,
    which is located in the file lottery.cxx under the kernel\current\src\sched subdirectory.
    The lottery scheduler is currently an experimental implementation and not shown
    in any configuration options. Only the multilevel queue and bitmap schedulers
    are actively supported. To use the lottery scheduler, hand-editing of the ECos
    system configuration is needed to include the lottery code implementation.


    # 5.1.3.1 Multilevel Queue Scheduler


    The multilevel queue scheduler allows the execution of multiple threads at each
    of its priority levels. The number of priority levels is a configuration option
    from 1 to 32, corresponding to priority numbers 0 (highest priority) to 31 (lowest
    priority). The scheduler allows preemption between the different priority levels.


    Symmetric Multi-Processing (SMP) is only supported when the multilevel queue scheduler.
    Additional information about SMP support under ECos can be found in Chapter 8.


    Preemption allows each thread at a given priority to allow- a higher priority
    thread to execute. The multilevel queue scheduler also allows timeslicing within
    a priority level.


    Timeslicing allows each to execute for a specified amount of time, which is controlled
    by a configuration option. The queue implementation for the multilevel scheduler
    uses double linked circular lists to join threads within a priority level and
    threads at different priority levels.


    In Figure 5.3, we see the multilevel scheduling queue representation along with
    an example of thread execution using this scheduler.


    In the scenario shown in Figure 5.3, three threads—Thread A, Thread B, and Thread
    C—are configured during creation of the threads at priorities 0, 0, and 30, respectively.
    The state of the scheduler queue after thread creation is shown in Figure 5.3.
    For this scenario, timeslicing is enabled. The timeline is a snapshot that starts
    with Thread C executing.'
