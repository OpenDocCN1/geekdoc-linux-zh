  md: '# Cygwin Tools Upgrade Procedure


    The Cygwin tools upgrade procedure allows you to take advantage of bug fixes and
    enhancements to the tools installed from the CD-ROM in Chapter 10, Cygwin Tools
    Upgrade Procedure.

    For this Cygwin tools upgrade example, we are running through the process of updating
    the cygwin package from the Internet. Other Cygwin packages might be newer than
    the ones initially installed because updates and bug fixes are constantly occurring
    for each package.


    > NOTE A good idea prior to upgrading any package is to search the eCos discussion
    mailing list to see if anyone has reported a problem with a particular package.
    You should also perform the upgrade in a manner so that you can revert to your
    previous working tools if the upgrade has problems. Posting messages on the eCos
    discussion mailing list, or the relevant Cygwin mailing list, is another way to
    obtain help.


    Before beginning the Internet upgrade, you should check with your network administrator
    to determine if there are any special configuration options you need to be aware
    of, such as proxy settings. The setup program prompts you for the type of Internet
    connection you have on your system.


    # STEP 1


    The first step in the upgrade process is to run the setup.exe program. This is
    the same program used in the initial installation of the Cygwin tools. The same
    dialog box shown in Figure 10.1 is displayed, provided the same setup.exe is used.
    To proceed, click the Next button.'
  merge: -1
  pgno: 380
- img_proc: true
  md: '# STEP 2


    For the upgrade procedure, we use the Install from Internet option, shown in Figure
    10.2. It is possible to download the latest packages and then install from the
    downloaded location, as we did in the initial installation. However, using the
    Install from Internet option allows us to perform the download and install tasks
    in consecutive steps. Then, click the Next button.


    # STEP 3


    Next, we set the Local Package Directory to D: \cywin, as shown in Figure 10.3.
    Click the Next button.


    # STEP 4


    The next step is the selection of the location, for the Select Install Root Directory
    option, where the tools should be installed. This is shown in Figure 10.4: We
    use D: \cywin along with the options DOS for the Default Text Type option, and
    Just Me for the Install For option. After making these option selections, click
    the Next button.


    # STEP 5


    We now need to choose the type of Internet connection for downloading the Cygwin
    package. The dialog box displaying the download options is shown in Figure C.1.
    The option selected depends on your specific connection to the Internet. You might
    need to check with your network administrator to ensure the proper option is selected.
    Select Direct Connection, and click Next to proceed.


    ![](img/e21b5ded81f449207668494619617bde_381_0.png)


    # STEP 6


    Next, we select the mirror site to use for our file downloads for the Select Download
    Site option. This dialog box is shown in Figure C.2. The selection for this option
    depends on your location. It is typically best to select a download site close
    to your facility. After selecting your download site, click the Next button.


    # STEP 7


    The dialog box shown in Figure C.3 is displayed after the download site is selected.
    This dialog box remains open until the connection to the download site is complete.'
  merge: -1
  pgno: 381
- img_proc: true
  md: '# Cygwin Tools Upgrade Procedure


    ![](img/e21b5ded81f449207668494619617bde_382_0.png)


    **Figure C.2** Cygwin Download Site dialog box.


    ![](img/e21b5ded81f449207668494619617bde_382_1.png)


    **Figure C.3** Cygwin download connection dialog box.


    After successfully connecting to the download site, the dialog box shown in Figure
    C.4 appears. As we can see from this dialog box, the current version of the cygwin
    package we have installed is 1.3.3-2, as shown in the *Current* column. The new
    version available on the download site is 1.3.4-4, as shown in the *New* column.


    > NOTE The package selection dialog box you might see differ from the one shown
    in Figure C.4, because the Cygwin tools are updated constantly. Therefore, any
    package that is newer than the one we installed in Chapter 10 will show up in
    the Package-Selection dialog box.


    If you want to leave a particular version of a package alone, click on the **Skip**
    until the *New* column. This prevents the setup program from overwriting the current
    version of the package you installed.'
  merge: -1
  pgno: 382
- img_proc: true
  md: '# Cygwin Setup


    ![](img/e21b5ded81f449207668494619617bde_383_0.png)


    Figure C.4 Cygwin Package Selection dialog box.


    After clicking the Next button to continue, the packages selected are downloaded
    and installed. A dialog box similar to the one shown in Figure 10.6 is displayed
    during download and installation.


    # STEP 8


    When the installation completes, the dialog box shown in Figure 10.7 is displayed.
    Since we already have our shortcuts configured, we can leave both options unchecked
    and click Next. Finally, the dialog box shown in Figure 10.8 is displayed, indicating
    successful upgrade of the Cygwin packages. Click OK and we are ready to use the
    latest Cygwin tools.


    # UPGRADE HINTS


    Here are a few hints to overcome some common problems during the upgrade procedure.
    If you are having problems connecting to a download site, simply select a different
    mirror site. Often the mirror sites are being updated so a particular site might
    be down for some time.


    If the setup program troubles upgrading a particular package, you might need to
    edit the install.db file located in the etc\setup directory under the Cygwin root
    directory. Locate the package or packages you are upgrading and delete the text
    for those particular packages. It is best to create a backup copy of the install.db
    file prior to doing any editing.


    Check the log files for additional information regarding the upgrade. The setup
    program writes details about the setup procedure, which might assist you in the
    installation problem.'
  merge: -1
  pgno: 383
- img_proc: true
  md: 'Finally, check the Cygwin mailing list for specific help with any setup problems.
    It is help-ful to give the setup.exe program version number (in our case, the
    version number is 2.78.2.15) when posting to this list. A list of Cygwin mailing
    lists can be found online at:


    http://sources.redhat.com/cygwin/lists.html'
  merge: -1
