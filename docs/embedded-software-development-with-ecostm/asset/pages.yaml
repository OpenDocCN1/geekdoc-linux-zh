    # 11.2.1.9 Memory Layout Manipulation


    There default memory layouts provided for all supported platforms that do not
    need to be modified when using Ecos. Modifying the memory layout is necessary
    when porting eCos to your own platform, which differs from any supported platform,
    or if memory is added to or removed from an evaluation board. Modifications can
    be made in the Memory Layout window or using the memory layout tool bar.


    The memory files for each platform are found in the include/pkgconf subdirectory
    within the HAL directory structure. Typically, each platform includes RAM and
    ROM memory layout files that are used by the Configuration Tool based on the Startup
    configuration option selection. Some platforms also contain RAM memory layout
    files for applications that start in ROM but are called for execution. For each
    Startup supported by the platform, there are three different memory layout files.


    The first type of memory layout file contains .h extension, which contains C macro
    definitions of the memory region. The .ldi files are linker script files that
    define region and section locations. Finally, the .mlt files contain the description
    of the memory layout for use by the MLT. When editing the memory layout files
    by, only the .h and .ldi files need to be modified; the .mlt file is only used
    by the MLT.


