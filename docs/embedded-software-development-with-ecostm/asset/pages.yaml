  md: '# Chapter 9 • The RedBoot ROM Monitor


    +   * Access via serial or Ethernet ports

    * GDB support

    * Flash image system support

    * X/Y modem support

    * Network bootstrap support using BOOTP or static IP address configurations


    RedBoot is a standalone, self-contained module that runs as an application on
    the target platform. Included in RedBoot is a GDB stub (see Chapter 8, Additional
    Functionality and Third-Party Contributions, for more information) that allows
    connection to the target platform from a GDB host for application debugging. This
    debug connection can be over the serial or Ethernet port. RedBoot uses a standalone
    stack, separate from the eCos networking stack, which provides a base of functionality
    for network communications.


    RedBoot supports booting from ROM, RAM, floppy disk, or an Integrated Disk Electronics
    (IDE) hard drive using the ext2 file system. A ROMRAM mode is also available;
    in which case, RedBoot resides in ROM but is copied to RAM before it begins to
    run.


    When we build a RedBoot image, as in Chapter 12, An Example Application using
    eCos, the result is a binary file that is programmed directly onto the target
    hardware. The RedBoot image can contain, depending on the configuration options
    and packages, all the software components to use all features of the target hardware.


    Figure 9.1 shows the block diagram architecture of some of the features included
    with the RedBoot monitor. From this illustration, we can see that the functionality
    provided by RedBoot is all contained within the RedBoot program image. The interaction
    between RedBoot and the eCos application vary depending on the configuration option
    settings in both images. RedBoot can be configured to provide simple load and
    run functionality, or can be configured to provide flash management support, monitor
    and control for the eCos application via the CLI using the serial port, and GDB
    debugging capabilities.


    RedBoot is shipped in many products currently on the market, including:


    +   * Intel Residential Gateway

    * Intel XScale Development Board

    * Intel StrongARM Development Boards

    * MIPS Malta 4kc/5kc/20kc Development Board

    * MIPS Atlas 4kc/5kc/20kc Development Board


