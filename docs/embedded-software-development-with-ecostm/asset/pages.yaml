    # 6.2.5 Message Boxes


    Another synchronization mechanism provided by eCos are message boxes, also called
    mailboxes. Message boxes provide a means for two threads to exchange information.
    Typically, one thread will produce messages and send to another thread for processing.
    Message boxes offer another method for threads to communicate more than a single
    byte of information. Item List 6.8 describes the kernel API message box functions.


    There are two configuration options for the message box synchronization mechanism.
    These are located under the Synchronization Primitives component within the eCos
    Kernel package. The first configuration option is Message Box Blocking Put Support
    (CYGFN_KERNEL_SYNCH'
