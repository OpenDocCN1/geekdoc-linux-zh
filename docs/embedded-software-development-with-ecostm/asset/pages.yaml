    # ## 8.3.1 ROM File System


    The eCos ROM File System (CYPGK_FS_ROM) package is located in the rom subdirectory
    under the file system packages subdirectories fs. Figure 1.3 in Chapter 1 shows
    the overall directory structure.


    A ROM file system is built on the host development system. This file system is
    read-only and stored in the target memory exactly as it was constructed on the
    host.


    At the start of the ROM file system is a header, defined in the file romfs.c as
    romfs_disk. This header includes the name of the file system, the size of the
    file system in bytes, and the total number of nodes in the file system.


    Each file and directory in the file system is a node. Nodes are defined by the
    romfs_node within the file romfs.c. The node structure includes a description
    of whether the node is a file or directory, the size of data in the node, and
    the creation time of the file. The data for each file is stored in a contiguous
    block of memory, which is referenced by the data member of the node structure.
    A table of node objects present in the file system follows the header in memory.
    Figure 8.1 shows an example ROM file system architecture. We can see the header
    information and node table location at the base address configuration option.
    The directory main and the file sys_info.txt are represented as romfs_node objects
    in the node table.


    ![](img/e21b5ded81f449207668494619617bde_182_0.png)


    **Figure 8.1** Example ROM file system memory architecture.'
