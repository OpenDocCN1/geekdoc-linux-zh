    not available, the source code is there to accomplish the task yourself.


    # 1.2.2 The eCos Configuration Method


    As embedded systems are pushed to smaller, faster, cheaper, and more sophisticated,
    control over all software in the system is necessary. There are different methods
    to control the behavior of components included in an application image. The philosophy
    of the eCos component implementation is to reduce the size for systems that have
    resource limitations, even to the detriment of systems that do not have strict
    resource constraints. With this design philosophy in mind, minimal systems do
    not suffer from additional code necessary to support advanced features used in
    more complex systems.


    One method to control software components is done at runtime. In this case, no
    up-front configuration of the component provides support for all behaviors of
    the component whether it is required by the application or not, causing the code
    size to be much larger. An example of run-time control is an application that
    runs on a desktop. When the application is executed from the disk drive, the shared
    libraries (Dynamic Link Libraries [DLL], etc.) needed by the application are loaded
    when the application starts.


    Another method for control control is at link time. In this case, the code can
    use only the specific functions of a component that it needs, and the code that
    supports functionality not needed by the application is left out. Many linkers,
    such as the GNU linker (ld), offer link-time control, or commonly called, selective
    linking. With selective linking, unreferenced functions and data can be removed—an
    all-or-nothing approach.


    Compile-time control gives the developer control of the behavior at the earliest
    stage, allowing the implementation of the component itself to be built for the
    specific application for which it is intended. Compile-time control gives the
    best results in terms of code size because the control is at the individual statement
    level in the source code rather than the function or object level. This makes
    compile-time control well suited for embedded development.


    eCos uses compile-time control methods for its software components, along with
    selective linking provided by the GNU linker. Using compile-time control or source-level
    configuration is achieved by the C preprocessor. An example of source-level configuration
    is shown in Listing 1.1. The flag INCLUDE_FUNCTIONALITY is either enabled or disabled
    by the developer. When this section of the code is compiled, only the code that
    is needed is included in the application image.


    ```

    #if INCLUDE_FUNCTIONALITY

    ...

    #else

    ```'
