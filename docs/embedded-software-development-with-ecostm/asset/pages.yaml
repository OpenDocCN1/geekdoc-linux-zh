  md: '# ROM Monitors


    +   * Use an In-Circuit Emulator (ICE) or other hardware debugging module supported
    by GDB.

    * Include support for GDB directly into the application.

    * Use CygMon or RedBoot ROM monitors, which include GDB support, as the resident
    ROM monitor on the target platform.

    * Create a simple application that only includes GDB debugging support known as
    a GDB stub ROM. This application is programmed into ROM and provides loading and
    debugging of applications.

    * Use a third-party ROM monitor. This ROM monitor must support GDB debugging;
    otherwise, the application must provide GDB debugging directly.


    The debugging option used is dependent on your preferences and the system resources
    available.


    # 8.2.1 CygMon


    CygMon, short for Cygnus ROM Monitor, is an eCos supplied standalone ROM monitor
    program. CygMon is a command-line driven program that provides basic debug functionality,
    such as program loading and memory content inspection and manipulation. In addition,
    GDB communication support is included through the use of the GDB stub. CygMon
    is designed to be portable across all of the supported eCosOS architectures. Currently,
    this support includes the arm, mips, and mn10300 architectures. CygMon also provides
    an API for applications, which eCos provides a template, Cygmon, for building
    the ROM monitor program. The CygMon package (CygPKG_CYGMON) is located under the
    Cygmon subdirectories.


    > NOTE CygMon is no longer maintained in the eCos project. The preferred ROM monitor
    program to use is RedBoot. Most of the functionality provided by CygMon is contained
    in the RedBoot ROM monitor. The CygMon monitor can still be used; however, upkeep,
    such as bug fixes and enhancements, on the code base being maintained.


    # 8.2.2 RedBoot


    RedBoot is an acronym for Red Embedded Debug and Bootstrap. The RedBoot ROM monitor
    provides a complete bootstrap environment and features such as a flash file system,
    as well as network downloading and debugging. RedBoot provides its own GDB stub
    for communication with a GDB host. RedBoot is intended to replace the CygMon ROM
    monitor and GDB stub debug software. Chapter 9, The RedBoot ROM Monitor, provides
    complete details about using RedBoot.'
