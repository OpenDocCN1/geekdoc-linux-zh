- img_proc: true
  md: '# 214 Chapter 10 · The Host Development Platform


    The Install For option allows us to select All, which allows anyone who logs on
    to the host PC to have access to the Cygwin mount table, or Just Me, if you are
    the only one needing access. Select Just Me for this option. We can now click
    the Next button.


    # STEP 7


    The next step is to select the packages we want to install. The packages contained
    on the CD-ROM might not be the latest versions available because changes to the
    Cygwin tools are continuously occurring. However, the CD-ROM files have been installed
    and configured into a working ECos development system.


    The CD-ROM contains the Cygwin DLL version 1.3.3-2. We are using version 1.3.3-2
    because it has been verified to work with the ECos development tools. If you look
    back at some of the posts on the ECos discussion list, you can see the issues
    that have come up using new versions of the Cygwin DLL. To avoid this, it is best
    to get a known development environment and running before upgrading to any new
    versions. Then, if problems occur, you can always restore your previous working
    environment.


    The dialog box for selecting specific Cygwin packages is shown in Figure 10.5.
    The radio buttons at the top—Prev, Curr, and Exp—allow us to select the previous,
    current, or experimental versions, respectively, for each Cygwin package. We want
    to ensure that Curr is selected, which is the default option. Selection of individual
    versions for a package is described later.


    The Full/Part button allows us to display the full list of packages or only a
    partial list. This is typically used for package upgrades.


    The columns in the dialog box display information about the package. The first
    column, Current, shows the current release for a particular package. This column
    is used for package upgrades. Since this is a new install, all package details
    are contained in the New. The New column shows the version that is going to be
    installed. The Src? allows us to select whether we want source code installed
    for the particular package. The last column, Package, shows the name of the package.


    As described previously, the Prev, Curr, and Exp buttons allow us to select particular
    versions for all packages. In order to select versions of a single package, we
    must click the icon in the New column. This toggles the active or version for
    a specific package to one of the following:


    +   * Skip—skip installation of the package.

    * Source—install source code only for the package.

    * Uninstall—remove the package.

    * Keep—leaves the current version of the package.

    * Version—install the selected version for the package.


    For certain actions, the Src? column is not relevant, in which case n/a is displayed
    in this column. The Cygwin package is highlighted in gray in Figure 10.5 to help
    shown the proper version of the package we want to use for our installation.'
