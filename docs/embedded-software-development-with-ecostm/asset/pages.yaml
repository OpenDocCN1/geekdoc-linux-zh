    # 5.1.2 Kernel Startup


    The kernel startup procedure is invoked from the HAL, after all hardware initialization
    is complete, as shown in Figure 2.3 in Chapter 2. The last step in Figure 2.3
    is to call cyg_start, which is the beginning of the kernel startup procedure.
    The kernel startup procedure is contained in one core function, cyg_start, which
    calls other default startup functions to handle various initialization tasks.
    These default functions are placeholders for you to override the function with
    necessary initialization for a specific application. The default kernel startup
    functions can be overridden by simply providing the same function name in the
    application code.


    > NOTE The function cyg_start can also be overridden; however, this should rarely
    be done. The kernel startup procedure provides sufficient override points for
    the installation of application-specific initialization code.'
