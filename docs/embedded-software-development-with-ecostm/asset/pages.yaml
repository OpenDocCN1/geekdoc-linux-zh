- img_proc: true
  md: '# Additional Features


    The startup sequence is different on SMP systems. A single CPU, called the primary,
    handles the startup initialization sequence, while the other CPUs, called secondary,
    are either placed in a suspended state_or put into an idle loop by the HAL. After
    the application calls cyg_scheduler_start, the secondary CPUs are initialized.


    One major issue in an SMP system is the ability for the kernel to protect its
    data structures from concurrent accesses. This is easily accomplished in a single-processor
    system by disabling interrupts. However, in a system with multiple CPUs, disabling
    interrupts on one CPU does not block another CPU from accessing the data structures.


    When the kernel is operating in a single-processor system, accesses to the kernel
    data structures are blocked using the scheduler lock. The scheduler lock is implemented
    as a simple counter that is atomically incremented to acquire the lock and release
    the lock. When the value of the lock counter is zero, the scheduler is allowed
    to select a different thread to run. Some ISRs can be served while the scheduler
    is locked, certain kernel functions can only be called from certain operating
    contexts. Additional information about the scheduler for single-processor systems
    can be found in the Scheduler section of Chapter 5, The Kernel.


    For SMP systems, a kernel-locking mechanism is needed that does not rely on interrupt
    manipulation. This special synchronization mechanism is called a spinlock. Spinlocks
    are provided for SMP systems, although the other synchronization mechanisms work
    in SMP systems as well. Spinlocks are covered in Chapter 6, Threads and Synchronization
    Mechanisms.


    In addition, functions have been added for processing in SMP systems. One of these
    allows routing of interrupts to a specific CPU in the system. The other function
    enables you to find out which interrupts in the system are handled by which CPUs.
    Detailed information about these, and other interrupt function calls can be found
    in Chapter 3, Exceptions and Interrupts.


