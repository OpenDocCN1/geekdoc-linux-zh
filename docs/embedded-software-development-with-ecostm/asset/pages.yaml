  md: '# 13.2.1 PowerPC HAL Directory and File Structure


    Let''s take a closer look at the PowerPC HAL directory structure focusing on the
    Motorola MBX860 platform. We need to know the location of the files and subdirectories
    that contain the functionality for the MBX platform. Figure 13.2 shows the relevant
    HAL directories for the Motorola MBX860 platform. The version subdirectories are
    left out in Figure 13.2; we are using the current version in our example. Other
    HAL platforms have similar directory structures.


    The subdirectory common contains the package configuration files general to all
    HAL architectures, including files for general interrupt configuration, vertical
    vector layout, and HAL debugging control. Function wrappers are wrapped in this
    subdirectory to create thecommon among all HAL implementations.


    The arch subdirectory is located under the powerpc architecture HAL directory
    and includes files for generic support for the PowerPC processor architecture.
    Functionality included in this generic support concerns except vector initialization,
    ROM and RAM configuration, common interrupt and exception handling, thread context
    switching, a generic linker script file, and common debugging functions.


    The mbx subdirectory contains the Motorola MBX860 platform source files. The description,
    in CDL script format, of the MBX platform is in the file hal_powerpc_mbx.cdl located
    in the cdl subdirectory.


    The include subdirectory contains all header files for the MBX platform. Under
    the include includes pkgconf subdirectory, where is the memory layout files are
    located.


    The misc subdirectory includes RedBoot minimum configuration files that can be
    imported into the Configuration Tool to establish a baseline of configured options
    and packages.


    The subdirectory src contains the main source assembly file, mbx.s, for the MBX
    platform. This file contains the hardware setup code in the routine hal_hardware_init,
    which configures all necessary processor registers, and initializes the chip selection
    configuration for the MBX platform. The tests subdirectory contains tests for
    the MBX platform.


    The mpc8xx and quice subdirectories are shown because they are variants of the
    MPC860 architecture used by the MBX platform. We need to be aware of the variants
    used by the platform we are using as a baseline in which we need to modify or
    extend the support offered in the variant packages.


    As we proceed with the platform porting, we are going also to be aware of the
    driver packages that are included in the MBX platform package. These might also
    need to be modified to support the new hardware.


    # STEP 1 Getting the New Platform Noticed


    The first step in the platform porting process is to get our new hardware noticed
    by the Configuration Tool, which allows us to build the software for our new hardware
    platform.


    We first create a subdirectory under the PowerPC HAL directory because our hardware
    uses the PowerPC MPC860T processor.'
