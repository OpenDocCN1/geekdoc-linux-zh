- img_proc: true
  md: 'Chapter 9 • The RedBoot ROM Monitor


    As we see in Figure 9.2, the RedBoot package is contained in the directory redboot.
    Additional details about the typical ECos package directory structure are covered
    in Chapter 11, The ECos Toolset.


    Beyond the main directory is the version of RedBoot, which might vary depending
    on the source code used. However, in our installation, the version directory is
    named current, as we see in Chapter 10, The Host Development Platform.


    The cdl directory contains the CDL description file of the RedBoot package. The
    CDL file contains the information needed for RedBoot configuration options, packages,
    and built information.


    Next is the doc directory. This contains documentation about the RedBoot ROM monitor
    for use by the ECos configuration tools.


    The include directory contains the source header files for RedBoot. The RedBoot
    directory contains two additional directories. The fs directory contains the RedBoot
    file system header files, and the net directory contains the RedBoot networking
    header files.


    The misc directory contains an ECos configuration file for RedBoot. Finally, the
    src directory contains all of the RedBoot source code. The file system source
    code is contained under the fs directory, and the networking code is contained
    under the net directory.


    # 9.3 Installation and Configuration


    ECos provides a template called RedBoot. Using this template, the default packages
    used with the RedBoot ROM monitor are loaded and configured with the default option
    settings. The specific packages loaded depend on the hardware platform you are
    using. For example, the Motorola PowerPC MBX860 board platform loads the Ethernet
    device driver since this is supported-on the MBX board board platform. However,
    the Intel StrongARM-SA-1100 Multimedia board platform does not contain Ethernet
    support; therefore, the Ethernet driver is not loaded on the SA-1100 Multimedia
    platform. We cover building a RedBoot image in Chapter 12.


    > NOTE Most HAL packages include a .ecm file that can be imported, along with
    the RedBoot template, in order to set up the packages needed to build the RedBoot
    ROM monitor for a specific platform. The files are typically named redboot_RAM.ecm,
    redboot_ROM.ecm, or redboot_ROMRAM.ecm, where ROM, RAM, and ROMRAM determine the
    start type for the RedBoot ROM monitor. The files are located in the misc subdirect
    under the HAL packages. We cover the details of .ecm files with the Configuration
    Tool in Chapter 11.


    Although .ecm files are useful for loading a baseline of the proper packages for
    a specific platform, you should still verify the configuration option priors to
    building the RedBoot image. This ensures that the proper functionality you need
    is supported by RedBoot; for example, the configuration of certain options allows
    RedBoot to include certain required functionality, or alternatively eliminate
    particular features, thus reducing RedBoot''s memory footprint.'
