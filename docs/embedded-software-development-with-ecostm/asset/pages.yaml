    Mode component under the Math Library package. The default compatibility mode
    is POSIX. The compatibility mode can be set at run time. The Compatibility Mode
    Setting configuration option under the Thread Safety component allows the setting
    of the math library compatibility mode, a thread-safe operation. This option is
