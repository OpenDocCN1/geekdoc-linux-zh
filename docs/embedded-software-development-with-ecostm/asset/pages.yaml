    with an overview of the CDL used in the eCos framework. Moving onto the Configuration
    Tool, we discovered the relationship between the CDL files and the graphical representation
    of packages in the Configuration Tool and how it is used by the Configuration
    Tool to represent the information in the repository.


    A typical eCos configuration involves selecting one target and one template. Packages
    can then be added and/or removed based on the requirements of the system. Then,
    fine-grained configuration is performed on the configuration options.


    Then we moved on to the other tools available in the eCos development kit, as
    well as other open-source tools that allow us to configure a complete embedded
    development environment free of charge since the tools are all open source. Now
    that we have an understanding of the eCos Configuration Tool, we are able to move
    to the next step, which is using the eCos tools to develop our own application.'
