    # 3.2 Interrupts


    An interrupt is an asynchronous external event that occurs during program execution,
    causing a break in the normal program execution. Typically, these external events
    are hardware related, such as a button press or timer expiration. Interrupt allow
    time-critical operations to be performed with higher precedence over normal program
    execution.


    Similar to exception, when an interrupt occurs, the processor jumps to a specific
    address for execution of the Interrupt Service Routine (ISR). Hardware support
    for interrupts varies among different architectures. Each processor has a minimum
    of interrupt pins to trigger the ISR.


    Methods for handling interrupt among different architectures are also diverse.
    Some processor architectures support vectoring interrupts to individual vectors,
    while others have a single vector for all interrupts. When individual vectors
    are supported, an ISR can be attached directly to the vector when the interrupt
    occurs. For single vector support, the software must determine which interrupt
    occurred before proceeding to the appropriate ISR.

    Latency is the interval of time from when an interrupt occurs until the ISR begins
    to execute.


    One of the key concerns in embedded systems with respect to interrupts is latency.
    Ecos employs an interrupt handling scheme to reduce interrupt latency in the system.


    # 3.2.1 Ecos Interrupt Model


    Ecos uses a split interrupt handling scheme where the interrupt processing is
    divided into two parts. The first part is the ISR, and the second part the Deferred
    Service Routine (DSR). This scheme allows for the minimal amount of interrupt
    latency in the system by reducing the amount of time spent interrupt service routines.
    The idea is to keep the processing done in the ISR to a bare minimum. In this
    scheme, the DSR is executed with interrupts enabled, allowing other higher priority
    interrupts to occur and be processed in the midst of servicing a lower priority
    interrupt.


    In some cases, where little interrupt processing needs to be done, the interrupt
    can be handled in the ISR completely. If more complex servicing is required, a
    DSR should be used. The DSR is executed at a later time when thread scheduling
    is allowed. The DSR to use kernel synchronization mechanisms; for example, to
    signal a thread, via a semaphore, that an interrupt has occurred. However, there
    are periods where thread scheduling is disabled by the kernel, although these
    periods are kept as small as possible. User threads can suspending as well. This
    prevents the DSR from executing. Preventing the DSR from executing in a timely
    manner can lead to system failures from an interrupt source'
