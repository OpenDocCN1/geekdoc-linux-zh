- img_proc: true
  md: 'The first three characters of the name identify the organization that produced
    the package; in this case, CYG is for Cygnus Solutions. The next three characters
    indicate the nature of the option; in this case, PKG is used to indicate this
    is a package. A complete list of command tags is given in The ECos Component Writer’s
    Guide. The HAL portion of the name indicates the location of the option within
    the overall hierarchy; in case, we see that this is a HAL package. The last part,
    i386_PC, identifies the option itself. This is for the i386 architecture PC platform
    package.


    Each CDL command contains a body that might include properties or commands that
    describe the component framework to handle each option. Properties can be descriptions
    of the command or values set by you that are used when the package is built. Commands
    within the CDL command body can define header files generated for the package,
    list source files to build for the package, or identify constructs that must be
    met if the package is active. The CDL command structure is shown in Code Listing
    11.2.


    ```

    1 cdl_package PACKAGE_NAME (

    2   <package properties and commands>

    3   cdl_component COMPONENT_NAME (

    4     <component properties and commands>

    5   )

    6   cdl_option OPTION_NAME (

    7     <option properties and commands>

    8   )

    9 )

    ```


    Code Listing 11.2 Basic CDL command structure example.


    As we see in Code Listing 11.2, a basic structure for CDL contains the command
    followed by the command name, as shown on line 1. In this case, the package name
    is PACKAGE_NAME. Every command body is encapsulated in curly brackets ({})). The
    # is used for comments within the CDL script file. Line 2 is the beginning of
    the package command body and the package command ends on line 9. There can be
    any number of package commands, properties, options, or components in the package
    body.


    Next is a component command on line 3, named COMPONENT_NAME. Within the command
    body, shown on line 4, there might be a number of different properties, commands,
    options, or subcomponents.


    Finally, there is an option command named OPTION_NAME on line 6. The body of the
    option command is on line 7 and might contain any number of properties and commands
    to describe and define the option.


    Code Listing 11.3 shows an excerpt from the i386 PC HAL package. The script file
    for this listing is hal_i386_pc.cdl located under the hal\i386\pc\current\cdl
    directory. However, some of the script commands and properties have been cut out
    to reduce the size of the listing and isolate the commands we want to.'
