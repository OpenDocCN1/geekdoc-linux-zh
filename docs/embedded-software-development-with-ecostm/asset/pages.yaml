  md: '# A Brief Take on Open Source Development


    called. The different contexts are Initialization, Thread, ISR, and DSR. “Any”
    is used to design that the function can be called from any of the contexts.


    There have always been "agnostics" in the debate of open source versus closed
    source—it sometimes comes down to whether the funding is available to purchase
    software tools and support. Each has its benefits and shortcomings, so let''s
    take a brief look at some of the pros and cons developers have been innovative
    when working on both sides of the open-source and closed-source fence. What it
    ultimately comes down to is, does the product work, and the schedule and cost
    budget get met by using this solution?


    Open source can be a confusing term. In an article by Daniel Benenenstein,he states
    that open source is free software in the sense of freedom of knowledge exchange.
    Much more reliance is placed on the individual developer to find problems, correct
    the problems, and make the solution available to others in the open-source community.
    This iterative process is the method that creates a more robust and bug-free code
    base.


    Presumably, because the draw of talent is worldwide, the best and brightest developers
    are working to make the product better. With closed source, a development support
    team is assembled to work fixing problems they probably did not. The team assembled
    might be very talented; however, the pool of talent from which to draw is very
    small compared to a worldwide talent pool.


    Often times, closed-source, or proprietary, software and open-source software
    hand in to complement each other. Many proprietary products are derived from open-source
    projects. Proprietary software must be innovative and differentiate itself from
    the open-source alternative; otherwise, why would people pay for something they
    can get for? Looking at things from this point of view, open source pushes proprietary
    software to the extreme of innovation.


    There are some general advantages and disadvantages to using open-source software.
    Since the source is available if you are not able to get support from the open-source
    community, you can dive right in and find exactly what is going on with the code.
    There is no need to wait for support from an external source, which can reduce
    debug time drastically.


    Another advantage of open-source software is that it is not tied to any one company.
    In the case of proprietary software, if the owning company changes direction,
    or disappears, the application developers using that are left out in the cold.
    Open-source software prevents this because developers have full access to the
    code and can choose the path for their own system software.


    Sometimes vendors selling proprietary software are not always the most responsive
    to all customers using their product. In cases where a project is not destined
    to produce large volumes, the vendor''s response to questions might not be as
    rapid as needed. The reality is that a company with higher revenue products will
    get the preferential treatment.


    > ¹ Benenenstein, Daniel. "Galleo Linux Multimedia Communicator." Embedded Linux
    Journal (July/August 2001): 14–19.'
