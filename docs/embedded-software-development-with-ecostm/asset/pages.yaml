  md: '# CHAPTER 4


    # Virtual Vectors


    His chapter details the mechanism used by the eCos HAL for various communication
    methods called virtual vectors. We cover how virtual vectors are used, the services
    provided, and the different configuration options available. Understanding virtual
    vectors aids our understanding for the different debugging methods described in
    later chapters.


    # 4.1 Virtual Vectors


    eCos defines a group of pointers to service functions and data called virtual
    vectors. The principal role of the virtual vectors is to allow services provided
    by a ROM startup configuration, such as a ROM monitor, to be accessed by a RAM
    startup configuration, the application being being debugged.


    For example, during typical application development, the target hardware boots
    up using a ROM monitor, such as RedBoot. The application being debugged is built
    using a RAM startup. Then, the host running a debugger, such as GDB, uses a communication
    channel to download the application software and exchange debug information with
    RedBoot. It is also useful for the application to use this same communication
    channel for diagnostic messages, such as diag_printf. The application diagnostic
    code needs to be aware of the communication channel used in order to output information.
    Therefore, either RedBoot needs to pass the communication channel information
    to the application during startup, or a level of indirection can be used. The
    level of indirection is a virtual vector, which offers a more general solution.
    Using this type of configuration also eliminates the need for debug code from
    the user application because the ROM monitor provides this functionality. Additional
    information about the RedBoot ROM monitor can be found in Chapter 9, The RedBoot
    ROM Monitor.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Chapter 4 • Virtual Vectors


    During typical development, the application does not need to be aware of the virtual
    vectors; diagnostic output is seamlessly routed to the appropriate communication
    channel.


    Using virtual vectors also makes it possible to debug user applications from an
    arbitrary channel. for example, if an application only contains a device driver
    for a serial port for its own communications, a ROM monitor can use an Ethernet
    port, with proper networking support, for debug communications. The user application
    does not need to contain an Ethernet device driver or networking stack because
    this is all handled by the ROM monitor. This Ethernet port debugging functionality
    can be eliminated from the user application, the result is a smaller image that
    only contains code used in the production release.


    One issue with sharing resources between a ROM monitor and a user application
    is that the two are linked separately; therefore, each is unaware of the location
    of objects in the other''s address space. Virtual vectors are used to overcome
    this problem by providing a common structure with a defined layout that is known
    by the ROM monitor and user application.


    Virtual vectors are contained within the Virtual Vector Table (VTT). The VTT is
    placed at a static memory location in the target address space, which both the
    RAM application and ROM monitor are aware. The VTT, defined as hal_virtual_vector_table
    in the file hal_h under the common HAL subdirectory, is an array of 64 vectors.
    The actual location of the vfiles is dependent on the HAL architecture and set
    in the linker script file. Linker script files are located under the arch subdirectory
    and have a .id extension. The memory, 256 bytes, for the VTT is allocated whether
    or not the VTT is used.


    The method for using the VTT varies depending on the functionality needed by the
    RAM application. Functions in the VTT can be implemented in the ROM monitor, the
    RAM application, disabled by installing pointers to dummy routines at certain
    locations, or control can be taken over at runtime by reinitializing certain pointers
    in the VTT.


    In general, a loose policy for governing the VTT is that the ROM monitor or the
    standalone application initializes all vectors in the target. The RAM application
    can reinitialize all services it needs to provide. The default configuration is
    that the ROM monitor provides the console and debugging I/O services, and the
    RAM application initializes all other services.


    > NOTE Some platforms do not use virtual vectors. However, it is recommended that
    all new ports implement virtual vector functionality.


    Table 4.1 lists the available virtual vectors contained in the VTT. The vector
    numbers, which are defined in the file hal_if under the common HAL subdirectory,
    correspond to the location of the vector in the VTT. Service functions that are
    unused are set to the nop_service function, which returns 0, defined in the common
    HAL. Data services that are unused are set to 0.'
