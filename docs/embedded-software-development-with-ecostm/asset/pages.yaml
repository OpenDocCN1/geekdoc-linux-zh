  md: "# IINUX Application Development\n\n> \"Anthony's book is easily the most complete\
    \ treatment of eCos system development.\n believe it is destined to become part\
    \ of every eCos developer's library\"\n—Michael Tiemann, CTO, Red Hat Software\
    \ and Co-founder of Cygnus Solutions\n\n# EMBEDDED SOFTWARE DEVELOPMENT WITH eCos\n\
    ANTHONY J. MASSA\n\n# Build low-cost, royalty-free embedded solutions with eCos—step\
    \ by step\n\nThe Embedded Configurable Operating System (eCos) gives professional\
    \ embedded software development solution that works in highly constrained environments.\
    \ In this start-to-finish guide to eCos building, Anthony J. Massa covers installation,\
    \ configuration, coding, deployment, and the entry eCos system. Massa's code examples\
    \ and application case study illuminate virtually any embedded system, from the\
    \ simplest device to complex systems. Coverage includes:\n\n+   - Understanding\
    \ eCos architecture: kernel, hardware abstraction layer, and other components\n\
    - Preparing your eCos embedded development environment and incorporating additional\
    \ open source tools\n- Working with exceptions, interrupts, and virtual vectors\n\
    - Managing threads and synchronization\n- Utilizing the eCos networking stack,\
    \ I/O system, and file system\n- Using RedBoot, the standardized embedded debug\
    \ and bootstrap solution\n- Porting eCos to new hardware platforms\n\nCD-ROM INCLUDED\n\
    The CD-ROM contains the complete eCos development environment, along with all\
    \ the code presented in this book and additional open source tools.\n\n# ABOUT\
    \ THE AUTHOR\n\nANTHONY J. MASSA has developed embedded software, device drivers,\
    \ and applications on a wide range of processors and embedded RTOS platforms.\
    \ Massa has written extensively on eCos in leading publications including Doctor\
    \ Robb's Journal, Embedded Systems Programming, and Software Development.\n\n\
    Bruce Perens' Open Source Series is a definitive series of Linux and Open Source\
    \ books by the world's leading software developers. Bruce Perens is the primary\
    \ author of The Open Source Definition, the formative document of the open source\
    \ movement, and the former Debian GNU/Linux Project Leader. The text of this book\
    \ is Open Source Licensed.\n\n![](img/e21b5ded81f449207668494619617bde_419_0.png)\n\
    \nU.S. $49.99 | Canada $77.99\n\nPRENTICE HALL\nUpper Saddle River, NY 07458\n\
    www.prentice.com\n\n![](img/e21b5ded81f449207668494619617bde_419_1.png)\n\n![](img/e21b5ded81f449207668494619617bde_419_2.png)\n\
    \n![](img/e21b5ded81f449207668494619617bde_419_3.png)\n\n![](img/e21b5ded81f449207668494619617bde_419_4.png)\n\
    \n![](img/e21b5ded81f449207668494619617bde_419_5.png)\n\n![](img/e21b5ded81f449207668494619617bde_419_6.png)"
