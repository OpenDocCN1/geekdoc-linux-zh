  md: 'For example, the PowerPC architecture has the option of locating the VSR table
    at either address 0x0000_0000 or 0xFFFF0_0000, based on the configuration option
    settings of processor registers. The MIPS architecture specifies that the exception
    vector location be at address 0xBFC0_0000. Linker script files are used to define
    the location of the exception vector table. Linker script files are located under
    the arch subdirect for a given HAL architecture and have a .ldd extension.


    The VSR table is located at a fixed memory location. This allows an application
    running RAM, which is a typical debugging situation, to control over exception
    service routines while keeping the ROM monitor in charge of debug exception handlers.


    The eCos HAL ensures that a default VSR is installed during the HAL startup process
    for each exception supported by a given architecture. Installation of the default
