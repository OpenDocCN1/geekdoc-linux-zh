    # 11.2.2 eCos Repository Database


    The Configuration Tool uses the eCos repository to understand the components within
    the repository. The descriptions of the packages in the repository database are
    contained in the file ecos.db, which is located under the D:\ecos\packages subdirectory
    in our installation. This file uses the SDL to describe all packages and targets
    in the database.


    The Configuration Tool needs to know the location of this file, and the entire
    repository. The Configuration Tool searches for the component repository by first
    using the most recently used repository location, then by using the default location
    setup by the installation, and finally, by whatever path you select. The component
    repository location should be already configured properly from installation.


    If you need to change the location of the component repository, you could do so
    by selecting Build -> Repository from the menu bar. This brings up a dialog box
    that allows you to browse to the new location of the repository.


    We can see an example of the relationship between the repository database file,
    ecos.db, and the Configuration Tool in Figure 11.9. In Figure 11.9, the SDL package
    description for the eCos HAL is shown with the Configuration window, the Properties
    window, and the Short Description window from the Configuration Tool. We can see
    how the Configuration Tool interprets the package for the eCos HAL in order to
    display the properties and description correct. The Configuration Tool uses the
    SDL script file, cdl, which is shown on line 4 of the ecos.db code fragment in
    Figure 11.9.


    Along with all the package descriptions in the ecos.db file, the template descriptions
    are also contained within the database file. Template descriptions are used by
    the Configuration Tool to load pre-configured packages for a particular target
    platform. Details about using templates can be found in the Using Templates section
    of this chapter. The template description for the i386 PC platform is shown in
    Code Listing 11.9.


    We see in Code Listing 11.9, line 1 contains the name of the target; in this case,
    pc. An alias for the target, which is displayed by the Configuration Tool when
    selecting a template, is shown on line 2. The packages that are loaded by the
    Configuration Tool when the i386 PC target is selected are given on lines 3 through
    13. These packages give a baseline of functionality for a given target. Packages
    can then be configured, added, or removed in order to get the specific configuration
    you need for your platform. Finally, lines 15 through 19 give the description
    of this template.'
