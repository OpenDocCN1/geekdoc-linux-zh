    # 8.7 SNMP Support


    SNMP is the standard for the exchange of management information between devices.
    SNMP uses simple requests and responses to communicate management information
    about a particular device on a network. A management application runs on a remote
    system that controls the SNMP agent, which runs on the device. SNMP uses UDP at
    the transmission layer. Management Information Base (MIB) contains information
    and statistics for each device in a network. The MIB information is constantly
    updated to keep track of the current status of the networked device. The SNMP
    agent accesses the MIB information to fulfill the remote management requests.


    The eCos SNMP package is a part of the UCD-SNMP version 4.1.2 code base. The UCD-SNMP
    implementations were done at Carnegie Mellon University and University of California
    at Davis. This code base has been transformed into Net-SNMP, which is maintained
    by Source-Forge. Additional information about the original SNMP code base can
    be found at:


    ```

    http://net-snmp.sourceforge.org

    ```


    This site also contains SNMP tools, including a tool to request or set information
    from SNMP agents, a tool to generate and handle SNMP traps, and a graphical Perl/Tk/SNMP-based
    MIB browser.


    eCos SNMP is contained in two packages, the agent and the library. The SNMP package
    is arranged in this manner to remain consistent with the original UCD-SNMP implementation.
    The separation of packages also allows an eCos client application to use the SNMP
    library without including the agent package.


    The agent contains application-specific handlers that allow a remote manager to
    retrieve the MIB information about the device. The library contains the code for
    formatting packets with the SNMP protocol and the MIB file, which uses Abstract
    Syntax Notation One (ASN-1). The library supports SNMP version 2 and ensures security
    and authentication of version 3. The database information is MIB-II compatible.


    The eCos SNMP packages are located in the snmp subdirectory under the net subdirectory.
    The SNMP Agent (CYPGKG_SNMPAGENT) is contained in the agent subdirectory, and
    the SNMP Library (CYPGKG_SNMPLIB) is in the lib subirect. The SNMP package requires
    the inclusion of the Networking package.


    The agent contains a single thread, snmp located in the file snmp.c, which is
    initialized in the routine cyg_net_snmp_init. The task runs at a priority level
    that is one lower than the background network task (CYPGKG_NET_THREAD_PRIORITY).
    The application must call the cyg_net_snmp_init function, located in the file
    snmptask.c, to start the SNMP agent.'
