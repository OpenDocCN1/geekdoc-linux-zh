  md: '# Configuring the Windows Host


    NOTE Before proceeding with the installation it is important to ensure that all
    Cygwin applications, if any, running on your system are shut down. If you have
    never installed any Cygwin tools on your system, you do not have to worry about
    this.

    It is also a good idea to disable any anti-virus software you have running. Occasionally
    conflicts occur, such as system hangs, between the Cygwin files and certain anti-virus
    software.

    Having a space in your Windows logon might also cause a problem using the Cygwin
    tools. To avoid any problems, it is best to install using a Windows logon name
    without spaces.


    If you are upgrading a previous version of the Cygwin tools, you should refer
    to the readme.txt file in the Cygwin directory on the CD-ROM to guarantee that
    the proper steps are performed prior to installation.


    # STEP 1


    The first step for installing Cygwin is to create a directory for the tools on
    the hard drive. It is preferable to create this directory off one of the root
    drives in order to keep path names short. We are going to use the directory name
    cygwin off the root D: \drive.


    # STEP 2


    Next, we copy the contents of the cygwin directory from the CD-ROM to the directory
    we just created. This takes up approximately 178.4 Mbytes of disk drive space,
    which includes the source code for the tools.


    > NOTE The Cygwin setup program can be pointed to the cygwin directory on the
    CD-ROM (E:\cygwin, where E: is your CDROM drive) in STEP 5 for installation to
    eliminate copying the files on the hard drive. However, having the files on the
    hard drive can be helpful when you decide to upgrade the Cygwin tools.


    # STEP 3


    Run setup.exe from the directory we just created on the hard disk. Next, we go
    through the procedure for configuring the setup program to install the Cygwin
    packages. Illustrations of the dialog boxes and selection of the options for this
    installation process are provided.


    To get started, we run setup.exe from the D: \cygwinwin directory.

    The first dialog box after running the Cygwin setup is shown in Figure 10.1. This
    dialog shows us the version information for the setup program. We are using setup
    version 2.78.2.15. It is important to note the version in case you need to get
    help from a discussion list or you need to upgrade to a newer version in the future.'
