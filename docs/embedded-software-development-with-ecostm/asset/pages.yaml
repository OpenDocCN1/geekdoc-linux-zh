  md: "Careful consideration is necessary when specifying the HAL interrupt configuration\
    \ settings. Since the DSR executes with interrupts enabled, another interrupt\
    \ might occur during the execution of the DSR. This means that the processor state\
    \ information, which can be sizable for certain architectures, for the current\
    \ interrupt needs to be saved on the stack.\n\nThe stack used depends on the Use\
    \ Separate Stack For Interrupts. If this option is disabled, every thread in the\
    \ system needs to be able to store the interrupt state information on its stack,\
    \ as interrupts can happen at any time. If multiple interrupts occur, the stack\
    \ would need the resources to hold the state information for each of these interrupts.\n\
    \nIf Use Separate Stack For Interrupts is enabled, the threads in the system would\
    \ only need to store a single interrupt state from the interrupt that caused the\
    \ thread to de-schedule, with its own thread state information. The only interrupt\
    \ stack has the responsibility to store this state information. The size of the\
    \ interrupt stack should be carefully selected.\n\nAnother option that can change\
    \ the way interrupts are handled is the configuration of Allow Nested Interrupts.\
    \ The default setting for this option is disabled, meaning that interrupts are\
    \ disabled during the ISR. When this option is enabled, the ISR enables interrupts\
    \ to the processing of any higher priority interrupts that might occur. Some architectures\
    \ support this feature in hardware. In most systems, the need to allow nested\
    \ interrupts is nonexistent unless the ISR is kept very short and the main work\
    \ is accomplished in the DSR.\n\nThe kernel-level interrupt configuration options\
    \ are the Kernel Interrupt Handling (CYGPGK_KERNEL_INTERRUPTS) component. Within\
    \ this component is the main option Use Delayed Service Routines (CYGIMP_KERNEL_INTERRUPTS_DSRs),\
    \ which enables or disables the eCos split interrupt handling scheme.\n\n> If\
    \ the Delayed Service Routines configuration is disabled, it is up to the user\
    \ to accommodate synchronization between ISRs and threads. Many of the kernel\
    \ API functions cannot be called from an ISR context, as shown in the kernel API\
    \ function tables throughout this book.\n\nThe kernel-level interrupt suboptions\
    \ available when using DSRs are listed in Item List 3.5.\n\n# Item List 3.5 Kernel\
    \ Interrupt Configuration Options\n\n| Option Name Use Linked Lists For DSRs |\n\
    \ CDL Name CYGIMP_KERNEL_INTERRUPTS_DSRSR_LIST |\n Description Allows the kernel\
    \ to keep track of pending DSRs in a linked list, preventing a table overflow\
    \ from occurring. However, interrupts are disabled for a brief period while the\
