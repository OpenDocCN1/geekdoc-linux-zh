    # 6.2 Synchronization Mechanisms


    The ECos kernel provides the mechanisms for the threads in the system to communicate
    with each other and synchronize access to shared resources. The mechanisms provided
    by the ECos kernel are:


    +   * Mutexes

    * Semaphores

    * Condition variables

    * Flags

    * Message boxes

    * Spinlocks (for SMP systems)


    The kernel also provides API functions that allow applications to make use of
    the synchronization mechanisms. Some of the synchronization API functions are
    provided as either blocking or nonblocking.


    Blocking function calls, such as cyg_semaphore_wait, halt execution of the thread
    until the API call can complete successfully. Nonblocking function calls, such
    as cyg_semaphore_trywait, attempt to complete successfully; however, the API function
    is not successful, a return code indicates the status of the call so the thread
    can proceed with its execution.


    Another type of blocking call, with timeout, also exists for certain synchronization
    mechanisms. These are API functions that halt execution of the thread for a specified
    period of time, such as cyg_semaphore_timed_wait, while attempting to complete
    the function successfully. If the function does not complete successfully before
    the timeout period, the function returns, indicating an unsuccessful status.


    # 6.2.1 Mutexes


    The first synchronization mechanism provided by ECos is the mutex. A mutex (mutual
    exclusion object) allows multiple threads to share a resource serially. The resource
    can be an area of memory or a piece of hardware, such as a Direct Memory Access
    (DMA) controller.


    A mutex is similar to a binary semaphore in that it has two states—locked and
    unlocked. However, there are a couple of differences between a binary semaphore
    and a mutex.'
