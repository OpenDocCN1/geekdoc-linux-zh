    # ### 8.6.3 lwIP


    There is also a network stack contribution available called Lightweight TCP/IP
    (lwIP), which is basically a small memory footprint implementation of the TCP/IP
    protocol suite. The focus of the lwIP implementation is to provide full TCP/IP
    support while reducing the necessary memory footprint. lwIP supports IP, ICMP,
    UDP, and TCP is available under a BSD-style license. Additional information about
    the lwIP contribution can be found online at:


    www.sics.se/~adam/lwip


    # ### 8.6.4 Networking Threads


    The eCos networking code uses threads to accomplish particular tasks. It is important
    to understand what networking threads are running in the system to determine the
    resource needs when using the networking stack.


    It is also necessary to keep the thread priorities for the networking code in
    mind designing the overall thread priority scheme to ensure that adequate network
    performance is achieved. Certain threads can be enabled or disable via the Basic
    Networking Framework package configuration options or under the specific stack
    implementation, OpenBSD or FreeBSD, configuration options. Item List 8.5 describes
    the networking threads, their default priority levels, and the configuration options
    used to set the specific priority level.


