  md: '# CHAPTER 2


    # # The Hardware Abstraction Layer


    His is the first of eight chapters that describe the eCos architecture and its
    components. The eight eCos architecture chapters provide an explanation of the
    core software components, which are the building blocks for the eCos system. Many
    of these building blocks are common to real-time operating systems; however, we
    need to understand how these components operate and interact with each other in
    the eCos system. This will prepare us for the next part of the book, which enables
    us to set up and configure the eCos tools to build an image for use in your applications.


    In this chapter, we get into the details of the Hardware Abstraction Layer (HAL).
    It is particularly important to understand the architecture of the HAL, because
    when the time comes to port eCos onto your own hardware, the HAL is the software
    component that will need to be adapted to support the new hardware platform.


    In Chapter 3, we cover exceptions and interrupts. Chapter 4 describes virtual
    vectors. In Chapter 5, we look at the core of the eCos system: the kernel. Chapter
    6 describes threads and synchronization mechanisms. Chapter 7 covers the other
    eCos components as counters, timers, libraries, and the I/O control system. Chapter
    8 describes other functionality and contributions available for eCos, such as
    networking support, file systems, and PCI support. Finally, we conclude the eCos
    architecture with Chapter 9, which details the RedBoot ROM Monitor.


    # ## 2.1 Overview


    The HAL isolates architectural-dependent features and presents them in a general
    form to allow portability of other infrastructure components. Basically, the HAL
    is a software layer, with generalized Application Programming Interfaces (API),
    which encapsulates the specific hardware operations needed to complete the desired
    function.'
  merge: -1
  pgno: 42
