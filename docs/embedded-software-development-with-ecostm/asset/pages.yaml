  md: 'The title bar of the Configuration Tool application displays the configuration
    file name—in this case, eosi386net.ecc—along with the name, eCos Configuration
    Tool. When a modification has been made to the configuration, an asterisk (*)
    appears after the configuration filename. This indicates that the modifications
    made to the configuration have not been saved.


    Under the title bar we see the menu bar, which is standard on Windows applications.
    It contains the menu File, Edit, View, Build, Tools, and Help. The File menu contains
    the options to save, open, start a new configuration, and import or export a configuration.


    The Edit menu includes the cut, copy, and paste options as well as a find option
    that allows you to search through certain windows for specific words.


    The View menu includes options for configuring the settings of the Configuration
    Tool, control over which windows are displayed, and control over which tool bars
    are enabled.


    The Build menu contains options to build the eCos library and tools, clean the
    build working directory, stop a build in progress, display compiler and linker
    flags, select the root repository, and enable templates and packages for a particular
    configuration.


    The Tools menu also allows you to set up the paths for the build and user tools,
    display the available platforms, and resolve conflicts.

    Finally, the Help menu includes the help documentation for the Configuration Tool
    and eCos, Context-sensitive help topics are displayed for any control in a dialog
    box by pressing F1 or clicking the question icon in the dialog caption bar and
    then clicking the control. Some dialog boxes contain a help button with


    You might want to customize the Configuration Tool settings according to your
    needs. To do this, select View -> Settings from the menu bar. This brings up the
    Configuration Tool settings log box. The configuration settings in this dialog
    box are separated into three tabs.


    The first tab is Display. Under this tab, the Configuration Pane allows you to
    use Macro Names or Descriptive Names for Labels. Typically, it is easier to use
    Descriptive names for a better explanation of the labels in the Configuration
    window and refer to the macro name in the Properties window. You can also set
    whether Integer Items displayed in Decimal or Hexadecimal. The Font can also be
    set for the different windows in the Configuration Tool. Finally, the splash screen
    can be enabled or disabled using the Initial Splash Screen check box.


    Next is the Viewer tab. This allows you to set the program for viewing header
    files, which can be set to the Associated Viewer (wordpad.exe) or a program you
    select as This Viewer. The program to use for viewing documentation can also be
    configured to the Built-in Viewer, Associated Browser (explorer.exe), or a program
    you select as This Viewer.


    The Conflict Resolution tab also allows you to set the methods that the Configuration
    Tool uses to check for conflicts in your configuration. The available options
    are After Any Item Changed, Before Saving Configuration and Automatically Fixes.


    Finally is the Runs tab. The Configuration Tool automates the downloading and
    running of tests on the target hardware. This tab allows you to configure the
    timeout associated with'
