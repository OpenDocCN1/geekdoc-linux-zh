    for free. Developers do not have to contribute back any additional components
    or applications developed; however, they are required to contribute back modifications
    to the eCos code itself. These contributions help the open-source community develop
    a better product.


    Today, numerous companies are using eCos, and many successful products have been
    launched running eCos, including the Brother HL-2400 CeN network color laser printer,
    Delphi Communport, and the Iomega Hip Zip Digital Audio Player.


    # 1.2.1 In a Word: Configurability


    In order to get an understanding of the eCos architecture, it is important to
    appreciate the component framework that makes up the eCos system. This component
    framework is specifically targeted at embedded systems and meeting the requirements
    associated with embedded design. Using this framework, an enormous amount of functionality
    for an application can be built from reusable software components or software
    building blocks. The eCos component framework has been designed to control components
    to minimize memory use, allow users to control behavior to meet real-time requirements,
    and use usual programming languages (e.g., C, C++), and assembly for certain implementations
    in the Hardware Abstraction Layer [HAL].


    Most embedded software today provides more functionality than might actually be
    needed for a particular application. Often, extra code is included in a software
    system that gives generic support for functionality that developers are not concerned
    with and is needed. This extra code makes the software necessarily more complex.
    Furthermore, the code, the chance of something going wrong. An example would be
    a "Hello World" program. With many RTOSes, full support for mutexes, task switching,
    and other features would be included, even though it is not necessary for a simplistic
    application. eCos gives the developer ultimate control over run-time components
    where functionality is not needed be easily removed. eCos can be scaled from a
    few bytes to hundreds of kilobytes when features such as networking stacks are
    included and third-party contributions like Web servers are used.


    Developers are able to select components that satisfy basic application needs,
    and configure that particular component for the specific implementation requirements
    for the application. This could mean enabling or disabling a particular feature
    within a component, or selecting a particular implementation for the component.
    An example of this is in the kernel scheduler configuration. eCos offers the developer
    options such as the ability to select the number of priority levels and when time
    slicing unnecessary to meet the developer''s requirements is eliminated in the
    final image of the application.


    Configurability allows a company to build an internal foundation of reusable components
    with access to the source code of the component. This can reduce development time
    and time to market because the components are highly portable and can be used
    in a wide range of applications. The eCos framework encourages third-party development
    to extend the features and functionality of the core eCos components. As more
    and more developers work extending the functionality on products and contribute
    these components back to the eCos project, the growth'
  merge: -1
