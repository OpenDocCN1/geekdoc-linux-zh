    The values for these configuration suboptions are calculated based on the clock
    source used on the specific target platform. When using an eCos-supported platform,
    it is usually not necessary to modify these values.


    It might be necessary to modify the real-time clock constants when porting to
    a new platform. These options can be modified, as described later in this section,
    using the Override Default Clock Settings configuration option located under the
    eCos Kernel package. If this is case, the Real-Time Clock Period is modified according
    to the specifications of the processor and/or hardware platform. The Real-Time
    Clock Numerator and Real-Time Clock Denominator are also modified to reflect the
    new timer resolution. For example, to increase the frequency by a factor of 10,
    the Real-Time Clock Period is changed in some hardware-defined way. Generally,
    the period is decreased by a factor of 10 and then the Real-Time Clock Denominator
    is increased by a factor of 10.


    The kernel uses its tick to determine the timeslicing interval (CYGNUM_KERNEL_SCH_TIMELICE_TICKS).
    The default settings use five clock ticks per timeslice. The kernel real-time
    clock settings can be overridden by enabling the Override Default Clock Settings
    configuration option, which is located under the Counters and Clocks component
    in the eCos Kernel package. Timeslicing is described further in the Multilevel
    Queue Scheduler section of Chapter 5, The Kernel.


    Since all kernel-level clock-related operations, such as delays and time-outs,
    use units of ticks rather than seconds, let''s look at the steps for a simple
    conversion.


    +   1. Determine the delay in nanoseconds. In our example, we want a delay of
    60 milliseconds, which is the same as 60,000,000 nanoseconds.

    2. Next, we need the clock frequency. In this case, we assume a clock running
    at 100Hz, which corresponds to 1 tick every 10 milliseconds, or 1 tick every 10,000,000
    nanoseconds. This corresponds to a numerator of 100 and a denominator of 1,000,000,000.

    3. Finally, we calculate the tick value (nanoseconds) × Numerator / Denominator
    to use in the equation


    ```

    Delay (nanoseconds) × Numerator / Denominator = Clock ticks.

    ```


    Therefore, in our example we plug the values and get


    ```

    60000000 × 100 / 1000000000 = 6.

    ```


    +   4. We then call the clock-related kernel function and pass it the parameter
    6 for our 60-millisecond delay.


    One thing to remember, these conversion calculations can sometimes be intensive.
    Therefore, it is usually a good idea in an embedded system to perform these calculations
    when possible at compile time rather than at time.'
