    # Code Listing 1.1 Example code of source-level configuration.


    With source-level configuration, very specific options can be applied in the code,
    which is appropriate for embedded systems since the majority of embedded applications
    compile into static images.


    In addition to generating smaller code, source-level configuration offers many
    other advantages important in embedded software development:


    +   - Applications are faster because variables do not have to be checked during
    run time to determine what action to take.


    +   - The code is more responsive and latencies are reduced, which aids in creating
    a more deterministic system that is important in real-time devices.


    +   - A simpler code base is generated, making verification and testing easier.


    +   - Costs can be reduced because resource usage is optimized and processor cycles
    are efficiently used, thereby enabling less expensive hardware to be specified
    in the design.


    The Configuration Tool, provided with the eCos release, eases the selection and
    configuration of the software components. The tool also provides the capability
    to build the eCos framework from the software building blocks, which are linked
    with the application. The Configuration Tool runs on both Windows and Linux platforms.
    A detailed look at the Configuration Tool is presented in Chapter 11, The eCos
    Toolset.


    # 1.2.3 eCos Core Components


    Standard functionality is executed in a real-time embedded operating system, including
    interrupt handling, exception and fault handling, thread synchronization, scheduling,
    timers, and device drivers. eCos delivers these standard components with the real-time
    kernel as the central core. The core components are:


    +   - Hardware Abstraction Layer (HAL)—providing a software layer that gives general
    access to the hardware.


    +   - Kernel—including interrupt and exception handling, thread synchronization
    support, a choice of scheduler implementations, timers, counters, and alarms.


    +   - ISO C and math libraries—standard compatibility with function calls.


    +   - Device drivers—including standard serial, Ethernet, Flash ROM, and others.


    +   - GNU debugger (GDB) support—provides target software for communicating with
    a GDB host enabling application debugging.'
