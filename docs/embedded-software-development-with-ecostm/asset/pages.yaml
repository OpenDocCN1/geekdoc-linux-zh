    57 // Process the data in the buffer...

    58

    59 }

    ```


    # Code Listing 6.4 Condition variable example code.


    In Code Listing 6.4, Thread A is acquiring data that is processed by Thread B.
    First, Thread B executes. On line 41, Thread B acquires the mutex associated with
    the condition variable. Next, since there is no data in the buffer to process,
    and buffer_empty is true on initialization (line 4), Thread B calls cyg_cond_wait
    on line 46. This call to cyg_cond_wait does two things—first, it suspends Thread
    B waiting for the condition variable to be set, and second, it unlocks the mutex
    mut_cond_var.


    Now, an event occurs causing Thread A to execute and acquire data into a buffer,
    as we see on line 16. Next, buffer_empty is set to false on line 19. Thread A
    then locks the mutex (line 22), signals the condition variable (line 25), and
    then unlocks it (line 28).


    Next, Thread B is able to run because the condition variable is signaled by Thread
    A. Before returning from cyg_cond_wait, the mutex, mut_cond_var, is locked and
    owned by Thread B. Now, Thread B can get the data (line 49) and set the buffer_empty
    flag to true (line 52). Finally, the mutex is released by Thread B on line 55
    and the data in the buffer is processed, as we see on line 57.


    It is important to understand a couple of issues relating to the code in Code
    Listing 6.4. First, the unlock and wait execution in the code to cyg_cond_wait,
    on line 46, is atomic; therefore, no other thread is allowed to run between the
    unlock and the wait. If this code was not atomic, then it would be possible for
    Thread B to miss the signal from Thread A even though data was available. Why?
    Thread B calls cyg_cond_wait, which first checks to see if the condition variable
    is set; in this case, it is not. Next, the mutex is released by the cyg_cond_wait
    call. Now, Thread A executes, putting data into the buffer and then signaling
    the condition variable (line 25). Then, Thread B returns to, however, the condition
    variable has been set.


    Another issue to keep in mind is that the call to cyg_cond_wait by Thread B is
    in a while loop, on lines 44 through 47. This ensures that the condition that
    Thread B is waiting on is still true after returning from the wait call. Take
    the case where other threads are waiting on the same condition. Another thread
    might be queued to obtain the mutex before Thread B; therefore, being signaled
    and waking up before Thread B. When Thread B finally gets to run, the condition
    is false. The while loop around the condition ensures the condition is still true
    before a thread executes.'
