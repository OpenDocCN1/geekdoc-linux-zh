  md: '# Interrupts


    overrunning. These issues should be kept in mind when designing the interrupt
    structure and how it interacts with the threads in the system.


    In most cases, the DSR is executed immediately after the ISR completes. However,
    if a thread has locked the scheduler, the DSR is delayed until the thread unlocks
    it. The priority scheme is that ISRs have absolute priority over DSRs, and DSRs
    have absolute priority over threads.


    > NOTE eCos does not offer any configuration options to change the interrupt priority
    scheme among the ISR, DSR, and thread.


    For the split interrupt handling scheme, the ISR must ensure the interrupt that
    just occurred does not recur until the D has finished its processing. To accomplish
    this, the ISR masks the current interrupt and the DSR will unmask the current
    interrupt after it has been served.


    Some HAL implementations offer interrupt nesting scheme. In this scenario, higher
    priority interrupts can interrupt, and be processed before lower priority interrupts.
    A configuration option is available to enable this nesting functionality, as shown
    in Item List 3.5.


    # 3.2.1. Interrupt and Scheduler Synchronization


    It is important to understand the interaction between the interrupt (ISR and DSR)
    and the scheduler. Certain guidelines must be followed during interrupt processing
    to ensure proper operation.


    First, ISRs cannot make any scheduler-related synchronization function calls.
    These include kernel API functions for semaphores, mutexes, and condition variables.
    Kernel synchronization functions cause interaction with the scheduler, which is
    disabled during ISR execution. Making such calls causes undefined behavior in
    the system and can lead to system failures. The eCos interrupt scheme allows these
    synchronization calls to be made from the DSR.


    Typically, the DSR will execute immediately after the ISR finishes. DSRs are only
    delayed if the thread has locked the scheduler for some reason. Since the DSR
    executes when thread scheduling is enabled, certain kernel synchronization calls
    are allowed within the DSR. This enables a DSR to wake up a thread for additional
    processing after the interrupt has occurred.


    However, DSRs must not call a synchronization call that blocks. Blocking occurs
    when code execution must wait for a resource to be released. For example, using
    the kernel API cyg_mutex_lock stops the current thread from executing until the
    mutex is released, with the cyg_mutex_unlock call.


    > NOTE It is worth bringing additional attention to this point about calling functions
    within a DSR. Any function that blocks cannot be called from within the DSR. This
    includes C library functions, such as printf, that might use blocking calls internally.


    An example of a DSR that uses one of the kernel synchronization primitives is
    shown in Code Listing 3.2.'
