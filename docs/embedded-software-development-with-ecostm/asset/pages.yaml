    Code Listing 12.2


    On line 1 of Code Listing 12.2, RedBoot displays the message that the ping command
    is executing and the two IP addresses being used. Lines 2 through 4 output the
    response sequence numbers and times, in ticks, from the ping packets. Finally,
    line 5 gives a summary of the successful reception and response of the three ping
