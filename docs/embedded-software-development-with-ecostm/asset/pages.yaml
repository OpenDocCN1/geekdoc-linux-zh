    to upgrade to newer versions if different processor architectures are used. Prior
    to upgrading, it is a good idea to search the eCos discussion list to see if there
    have any posts describing problems with a newer version.


    NOTE The GNU C/C++ Compiler version 2.95.2 that we use in our setup is not capable
    of supporting all processors shown in Appendix A, Supported Processors and Evaluation
    Platforms. The ARM Thumb, Hitachi SH, MN10300/AM33, NEC MIPS VR4300, and NEC V850
    processors require installation of a snapshot of the GNU C/C++ Compiler. The snapshots
    can be found online at: http://gcc.gnu.org/pub/gcc/snapshots


    The latest versions of GNU cross-development tools, as well as additional documentation
    for each group of tools, can be found on their respective home sites:


