    # 8.3.3 Journaling Flash System Version 2


    Ecos provides support for the Journaling Flash File System, version 2 (JFFS2).
    JFFS2 is based on JFFS (version 1), designed to use embedded flash memory devices
    more efficiently. JFFS and JFS2 take into account the characteristics of flash
    technology when dealing with the typical situation in an embedded system where
    the system is not always cleanly down.


    JFFS2 is a log-structured file system, whereas a typical embedded file system
    emulates a traditional file system that uses block-based storage and keeps track
    of the files in these blocks. JFFS2 builds on the version 1 technology.


    The JFFS2 package (CYPGKG_FS_JFFS2) is contained in the jjfs2 directory under
    the file system''s packages directory fs. The license for the JFFS2 file system
    can be found in the file License under the src directory. Additional details about
