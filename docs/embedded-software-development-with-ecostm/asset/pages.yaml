    # 2.1.2 HAL Macro Definitions


    The HAL defines architecture macros that make a common API for encapsulating the
    processor-specific implementation functionality. The HAL macros are used to control
    the interrupt, cache, memory management, I/O, diagnostics, debugging, and architectural
    features for the processor, given that the processor provides the functionality.
    This section gives a general overview of these HAL macros and their location within
    the HAL architectures. Additional detailed descriptions of the HAL macros containing
    specific functionality (e.g., exception, interrupt, and clock macros) are described
    in their associated chapters.


    Generally, HAL architecture macros are enclosed within #ifundef allows the macro
    to be overridden in the platform or variant submodules. Code Listing 2.3 shows
    an example of this.


    ```

    1 #ifndef CYGHWR_HAL_INTERRUPT_VECTORS_DEFINED

    2

    3 #define CYGNWR_HAL_INTERRUPT_0 0

    4 #define CYGNWR_HAL_INTERRUPT_1 1

    5 #define CYGNWR_HAL_INTERRUPT_2 2

    6 #define CYGNWR_HAL_INTERRUPT_3 3

    7 #define CYGNWR_HAL_INTERRUPT_4 4

    8

    9

    10

    11 #endif

    ```


    Code Listing 2.3 Example HAL interrupt vector macro definitions.


    In Code Listing 2.3 we see part of the interrupt vector definitions; in this case,
    for the MIPS processor architecture. Line 1 checks for the definition of the macro
    CYGHWR_HAL_INTERRUPT_VECTORS_DEFINED. The variant or platform-specific code within
    the HAL can override the interrupt vector provided by the architecture submodule,
    shown on lines 3 through 7, by simply defining CYGHWR_HAL_INTERRUPT_VECTORS_DEFINED.
    The variant or platform submodule can then define the interrupt vectors appropriately.


    The location of the HAL architecture code is under the arch subdirectory, as we
    see in Figure 2.1. Typically, the macros are located in .h files under the include
    subdirectory; however, the specific location of this functionality might differ
    for different HAL architectures. Table 2.1 lists some of the general HAL architecture
    macro filenames and describes the functionality included in the file.'
