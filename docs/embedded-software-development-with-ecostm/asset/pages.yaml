    Exported minimal configuration files, which also use the CDL, are similar to the
    saved configuration files. However, the Configuration Tool does not insert comment
    lines as it does in the saved configuration files. The exported minimal configuration
    file contains only the differences from the standard configuration settings.


    > To get all packages and option settings accurately recreated, it is better to
    use the eCos configuration file (.ecc). eCos configuration files contain all information
    for a particular configuration, whereas the minimal configuration files contain
