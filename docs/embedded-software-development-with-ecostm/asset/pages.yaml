    A telnet program can also be used to connect to the target PC via the Ethernet
    port. This allows you to use telnet to send commands and receive output from RedBoot,
    in the same way as using the serial port. One thing to remember is that the telnet
    connection must be on port 9000, as set by the TCP Port To Listen For Incoming
    Connections (CYGNUM_REDBOOT_NETWORKING_TCP_PORT) configuration option under the
    RedBoot package.


    > Although this is not true for the PC platform booting from the floppy drive,
    other hardware platforms allow RedBoot images to be installed into flash memory.
