    We have just completed our installation of the eCos host development tools for
    Windows, which includes the Cygwin tools, the cross-development tools for the
    Intel x86 processor, and the eCos development kit.


    We also went through the update procedure using the online eCos repository. This
    enables us to keep up to date with the latest changes, additions, and bug fixes
    with the eCos and RedBoot source code.


    Entering incorrect commands causes some of the most common problems during installation.
    You should make sure that the commands are entered correctly prior to proceeding
    to the next step.


    Another common problem is insufficient disk space. The amount of space needed
    depending on the format of the hard drive. Verify that an ample amount of hard
    drive space is available before configuring your host development platform.


    If problems arise when installing the tools, a great source for information is
    the mailing list for the associated tool. Often, the developers on the mailing
