  md: '# CHAPTER 13


    # Porting eCos


    Getting your application running on your new target hardware platform is typically
    the main goal in embedded software development. This typically includes porting
    eCos to the target hardware as well. eCos was designed for portability by using
    a layered approach to the different software system components. When porting eCos,
    moving the HAL to the new target hardware is the first step, which enables the
    higher layer components, such as the kernel, to also run on the target hardware.
    Additional functionality, such as display drivers and Ethernet drivers, can then
    be incorporated to meet the requirements of the system and get the system fully
    operational.


    Because of the unique nature of each new target hardware system, it is impossible
    to cover every possible detail for each target system. Instead, in this chapter,
    we look at a platform porting example to get an overall understanding of the eCos
    porting process. Using one of the supported platforms as a baseline, we can add
    a new platform to the eCos framework and see how to get this new platform up and
    running using the eCos tools. We can then go through some of the details that
    might need to be addressed in other porting procedures.


    The PowerPC GNU cross-development tools are included on the CD-ROM in case you
    want to build this porting example, although this is not necessary for understanding
    the porting process. These tools are located under the gnu\ppctools directory.


    # 13.1 Overview of Porting


    Now that we have an understanding of the components in the eCos system, how to
    use the tools, and how to write an application using eCos, we can focus on the
    main task involved with using any RTOS: getting the software running on our own
    hardware. This is typically the main goal'
  merge: -1
  pgno: 340
- img_proc: true
  md: '316


    Chapter 13 • Porting eCos


    when using an RTOS. Porting to a new hardware platform is a painful and slow process
    because it is typically occurring at the same time the hardware itself is being
    debugged.


    The layered architecture of eCos, as described in Chapter 1, An Introduction to
    the eCos World and shown in Figure 1.1, makes the porting process bit easier.
    To move to a new hardware we start by porting the HAL and that it functions properly
    on the new hardware. Since the higher application layers sit on top of the HAL,
    they are not dependent on a specific piece of hardware. Options can then be configured
    to meet the needs of the new hardware platform.


    Since every piece of hardware is unique in its own way, the porting process described
    in this chapter should be used as a general guide. Your hardware might require
    its own specific code such as serial and display drivers to get the system operating
    properly. There will be implementation decisions you need to make for your hardware
    in order to port.


    The porting of the eCos HAL be broken down into three different types: Platform,
    Variant, and architecture. Porting process of using the HAL of a current platform
    supported by eCos, which is similar to the new hardware platform, as a baseline
    and making modifications for the new platform, including the new memory layout
    and any specific initialization needed. New drivers might need to be developed
    to accommodate additional hardware resources. For the three portant types, platform
    porting usually requires the least amount of effort if an existing HAL can be
    used as a baseline.


    Variant porting also uses a closely related HAL as a baseline. As described in
    Chapter 2, The Hardware Abstraction Layer, a variant HAL supports differences
    of a specific processor from the generic architecture. A variant port might consist
    of redefining interfaces, cache, or other features that override the default implementation
    of the architecture HAL. A variant port requires an existing architecture HAL
    port. The amount of effort necessary for a variant port directly corresponds to
    the similarity of these variants for the specific processor.


    Finally is architecture porting. This consists of using an existing architecture
    HAL as a baseline. The new architecture port can be a daunting task if compiler
    support must be present before beginning the porting process. eCos is closely
    coupled to the GNU C/C++ Compiler. Compiler supports numerous different architectures,
    if it does not support your new architecture then the task of porting the GNU
    compiler needs to be completed as well. After the architecture HAL port is complete,
    a platform port must be done in order to support the new hardware.


    Before setting out on a new variant or architecture port is a good idea to check
    the eCos discussion mailing lists to see if anyone else in the development community
    is currently undertaking the same port. You can then see if the developer intends
    to contribute the port back for use by others. The eCos discussion mailing lists
    can be searched online at:


    > http://sources.redhat.com/ml/ecos-discuss


    If no one else is performing the same port, you can post your intentions to the
    list using the address ecos-discuss@sources.redhat.com. You might receive a reply
    giving you some additional tips or resources to help you out.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# 13.2 A Platform Porting Example


    In order to get a better understanding of the platform porting procedure, we are
    going to go through the process of creating a new hardware platform for our imaginary
    piece of hardware. In this example, we use the Motorola MBX860 HAL as our baseline.
    The Motorola MBX860 HAL is located under the hal\powerpc\mbox subdirectory.


    During the software development process, choosing an off-the-shelf evaluation
    board allows us to do parallel software development while the hardware is being
    designed. Although the specific platform implementation details differ from various
    HALs, this should be used as a general guideline that can be applied to all platform
    ports.


    For this example, we use RedBoot as the template. Additional information about
    RedBoot can be found in Chapter 9, The RedBoot Monitor. Since RedBoot is essentially
    a thin command-line interface sitting on top of the HAL with GDB stub functionality,
    we can leverage off the RedBoot development to put steps ahead in the porting
    process.


    Once the HAL is ported to the new hardware, RedBoot gives us the ability to load
    and debug code on our new target platform. Initially, we want to strip out unnecessary
    functionality included in the RedBoot template so that we have a “bare bones”
    of the RedBoot image. As we progress with the port to our new hardware, we can
    add back the functionality we need to produce a full-featured RedBoot image.


    It is important to establish some baseline functionality priority before setting
    out the eCos port. We should write out any basic hardware problems, as memory
    reading or writing errors, before proceeding. This baseline functionality can
    be established using some basic RAM read/write tests and ROM, if a flash ROM device
    is used, read/write tests. Having the proper tools during the early stages of
    bringing up is crucial. Most processors have some type of In-Circuit Emulator
    (ICE) or Background Debug Mode (BDM) tools available. A good article about ICE
    technology can be found at:


    > www.embedded.com/1999/9910/9910sr.htm


    Having one of these tools can give you the ability to load code onto the target
    hardware without going through the process of burning EPROMs whenever you need
    to test changes. Easing the testing of new changes is essential during the eCos
    porting process.


    Other equipment that is good to have when bringing up a new piece of hardware
    is a logic analyzer and oscilloscope. These pieces of equipment can guarantee
    that the hardware is meeting their associated specifications.


    An evaluation board is a great piece of hardware to have during the initial phases
    of a project. Using the evaluation board, you can begin writing the application
    software for your system long before your own hardware is ready. Then, when your
    new hardware comes online you can go through the platform porting procedure, as
    described later in this section, to get eCos up running on your new platform.
    The evaluation board also provides a baseline of functionality that you can use
    to check your software as the project progresses. If something is not working
    correctly on your new hardware, you can always test it out on the evaluation platform
    to see how'
  merge: -1
