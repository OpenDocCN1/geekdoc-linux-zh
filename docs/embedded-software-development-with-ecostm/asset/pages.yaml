  md: '# ABOUT THE AUTHOR


    ANTHONY J. MASSA earned a dual B.S./B.A. degree in electrical engineering from
    the University of San Diego. He has spent most of his career developing embedded
    software, device drivers, and applications on a wide range of 8-, 16-, and 32-bit
    processors and numerous embedded RTOS platforms. Anthony also has experience with
    hardware design, and with writing drivers and application software on the different
    Microsoft Windows operating system platforms.


    Anthony has developed his skills by working on a diverse array of successful products
    including satellite PC receiver cards, set-top boxes, Internet-enabled wireless
    modems, networking broadcast equipment, and cable modems. He has written extensively
    on eCos in leading publications including the magazines Doctor Dobb''s Journal,
    Embedded Systems Programming, Software Development, and EDN.


    When not working, Anthony enjoys spending time with his family at home or on vacation
    (where he can often be found having a good time at the Buena Vista in San Francisco),
    getting out in the backcountry with his grandfather, and playing a little golf.
    Now that this project is concluded, he is looking for his next writing adventure—perhaps
    a novel!'
