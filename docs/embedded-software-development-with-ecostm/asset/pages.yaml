    # 11.3.1 The Package Administration Tool


    Each package in the eCos component repository is a self-contained released module.
    A package contains an individually versioned code structure. This method supports
    individual package distributions or other third-party contributors.


    The eCos Package Administration Tool is a graphical interface, which runs on Windows,
    that provides the management of all packages in the component repository. A command-line
    interface can also be used to manage the packages in the repository. We focus
    on the use of the graphical Package Administration tool in this section.


    The Package Administration Tool is installed as part of the eCos development kit
    covered in Chapter 10. The executable is located in the D: \ecos\bin directory.
    The Package Administration tool can also be started from the Configuration Tool
