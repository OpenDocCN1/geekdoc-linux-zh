    # 6.1.1 Thread Stacks and Stack Sizes


    As we learned the example shown in Code Listing 6.1, the application is responsible
    for providing the stack for a thread, which is used for local variables and tracking
    function calls and returns. The stack is typically in the file of static data
    to eliminate the need for dynamic memory allocation functionality in the kernel.


    It is important to understand the size requirements for a given thread so an accurate
    stack size can be created. If the stack size is too large, or more importantly,
    avoids overflowing the stack if the stack size is too small for the thread. Stack
    overflowing can be a very difficult problem to track down.


    The stack size depends on another number of factors, which are determined by the
    characteristics of the code executed by the thread. For example, numerous nesting
    function calls or large local arrays might require larger stack sizes for a given
    thread.


    There are also configuration options that can have an affect on a thread''s stack
    usage. The interrupt configuration option Use Separate Stack For Interrupts, when
    disabled interrupt handlers to use a thread''s stack during execution. The interrupt
    configuration option Allow Nested Interrupts cause the problem when allowing higher
    priority interrupts during execution of another interrupt; therefore, requiring
    additional stack space. Additional information about the different interrupt configuration
    options and issues related to a thread''s stack is in Item List 3.5 in Chapter
    3, Exceptions and Interruption.


    The HAL defines two macros that can be used by an application as reasonable sizes
    for a thread''s stack. These two macros vary among the different processor architectures.
    These two macros are typically defined in the HAL file hal_arch.h, which also
    gives an explanation of how the values were derived for a particular architecture.


    The first macro is CYGNUM_HAL_STACK_SIZE_MINIMUM. A thread with this size is appropriate
    for threads that run a single function and make simple system calls. It is illegal
    to attempt to create a thread with a stack size smaller than this value.


    The other macro is CYGNUM_HAL_STACK_SIZE_TYPICAL. This value is appropriate for
    a thread''s stack size when nested function execution is limited to approximately
    six levels with no large arrays on the stack.


    The kernel provides code, controlled by configuration options, which can help
    detect stack overflows. Additional information about these and other kernel thread
    configuration options can be found in Item List 6.1.


    One configuration option is Check Thread Stacks For Overflows. When this option
    is enabled (which is the default case for a debug build), a small amount of space
    at the stack limit'
