  md: 'Other times, configuration options cannot be modified. Take the case of processor
    endian-ness. Some processors are hard-wired to operate in a specific endian mode,
    and others can be programmed to operate in either big-endian or little-endian
    mode at runtime. Depending on the hardware selected, endianness might not be a
    configuration option that can be modified. In other configuration options, the
    constraint might be a range for a particular value. For example, the configuration
    option Number Of Priority Levels has a constraint of 1 to 32, which is currently
    set to 32 in Figure 1.2. Specifying a value out of this range is not allowed in
    the Configuration Tool.


    As configuration options are modified, conflicts arise because certain constraints
    are not satisfied. The configuration tools report these conflicts allowing us
    to take corrective action. These conflicts can be bypassed; however, compile-time
    or runtime failure may occur. Conflicts should be resolved before continuing with
    the system configuration. The configuration tools try to resolve conflicts that
    arise during the configuration process. The tools might apply a solution automatically
    or ask us for intervention in solving the conflict. Additional information about
    conflicts can be found in Chapter 11.


    # 1.3.1.4 Components and Packages


    A component is a configuration option that encapsulates more detailed options
    within it. Entire components can be enabled or disabled, depending on the needs
    of a particular application. For example, in Figure 1.2, the Kernel Exception
    Handling component can be disabled by unchecking the box next to it. Disabling
    the component causes all configuration options under that component, as well as
    any files associated with the component, to be irrelevant and not included in
    the build. This hierarchy of encapsulation gives us control of the configuration
    at a higher level. Eliminating unused components reduces the compile time of the
    ecos image.


    Another example where component is useful is in the case where a particular device
    on the target hardware, is not going to be used in the application. Eliminating
    the device driver component for the Ethernet port reduces memory usage in the
    system.


    A package is a type of component that is ready for distribution. Incorporated
    in a package are all necessary source code files, header files, configuration
    description files, documentation, and other files. A package is often contained
    in a single file, allowing it to be installed with the appropriate tool or updated
    in the future when changes are made. Having a distribution package as a standalone
    unit allows third-party developers to extend the functionality offered in the
    ecos system. Enabling a package loads the configuration data into the appropriate
    tool. You also have control over the version of the packages that are used in
    the system.


    # 1.3.1.5 Targets


    A target is the piece of hardware on which the application will be executed. The
    target might be an off-the-shelf evaluation board, your own hardware platform,
    or a simulator. When creating a configuration, you select a target that the component
    framework can load particular packages to support the devices and HAL relevant
    to the target. In addition, configuration options are changed from their default
    values to settings appropriate for the target.'
