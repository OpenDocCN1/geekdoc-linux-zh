    \ that there is valid data in the message variable before proceeding to process\
    \ the data.\n\n# 6.2.6 Spinlocks\n\neCos kernel provides an additional synchronization\
    \ mechanism for applications running on SMP systems called spinlocks. The other\
    \ synchronization mechanisms work well as on SMP systems. Additional information\
    \ about SMP support within eCos can be found in Chapter 8, Additional Functionality\
    \ and Third-Party Contributions.\n\nA spinlock is basically a flag that a processor\
    \ can check prior to executing a particular piece of code. If the spin is not\
    \ locked, the processor can set the flag and continue executing the thread. If\
    \ the spin is locked, the thread spins in a tight loop continually checking the\
    \ flag until it is released. Spinlocks operate at a lower level than other synchronization\
    \ mechanisms and the implementation is hardware specific. Some processors offer\
    \ a test-and-set instruction for implementing a spinlock.\n\nThreads that acquire\
    \ are not suspended; therefore, it is important that spinlocks are held for a\
    \ short period of time, typically on the order of 10 or 12 instances. Understanding\
    \ the consequences of using a spinlock is important. For example, since a process\
    \ does not perform any useful work waiting for a spinlock, it is important when\
    \ a thread acquires a spinlock that it does not get preempted. This could cause\
    \ another processor to wait for a timeslice period or longer for the spinlock.\
    \ To avoid this, the kernel spinlock API, as shown in Item List 6.9, provides\
    \ a function to disable interrupts on the processor where the thread is executing.\n\
    \n> NOTE Spinlocks should only be used in SMP systems and are not appropriate\
    \ for single-processor systems. The problems of using spinlocks on a single-processor\
    \ system can be illustrated in an example. Let's take the case where a high priority\
    \ thread attempts to acquire a spinlock by a lower priority thread. The high priority\
    \ thread waits for the lower priority thread to release the spinlock. However,\
    \ since the lower priority thread never gets a chance to run, it can never release\
    \ the spinlock; hence, a deadlock occurs. Another deadlock could arise if an interrupt\
    \ attempted to acquire a spinlock previously acquired by a thread.\n\n# Item List\
