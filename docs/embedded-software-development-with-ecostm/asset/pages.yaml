    # 11.5.2 Splint


    No, lint is not referring to the stuff you find in the deepest recesses of your
    pockets. A lint program is to statically verify a program, or part of a program,
    against standard libraries, checks the code for portability, and checks the code
    for common errors such as returned values, unused declarations, and type inconsistencies.

    Although a compiler provides some messaging, lint checks these areas of a program
    much carefully and provides output messages where possible problems may occur.
    Lint can be used to develop more robust software.

    Splint is an open source development project; therefore, it can be used free of
    charge. Splint stands for Secure Programming Lint or Specifications Lint. Additional
    information about Splint can be found online. The home site for Splint is located
    at:

    www.splint.org


    Included on the CD-ROM under the splint directory is a zip file, splint-3016win32.zip,
    which contains the Splint executable version 3.0.1.6, as well as documentation
    on how to set up and use the program. A Linux version of Splint is also included
    in the CD-ROM under the \int linux directory in the file splint-3.0.1.6.Linux.tgz.

    Included on the CD-ROM under the splint directory is the source code for the Splint
