  md: "An example that demonstrates how the HAL abstracts hardware-specific implementations\n\
    \ the same API call is shown in Code Listing 2.1 for the ARM architecture, and\
    \ in Code\nListing 2.2 for the PowerPC architecture.\n\n```\n#define HAL_ENABLE_INTERRUPTS()\
    \ \\\nasm volatile \\\n    \"mrs r3,cpr\"; \\\n    \"bic r3,r3,#0xC0\"; \\\n \
    \   \"msr cpsr,r3\" \\\n    :\\ \\\n    \": \"r3\" \\\n);\n```\n\nCode Listing\
    \ 2.1 ARM architecture implementation of HAL_ENABLE_INTERRUPTS() macro.\n\n```\n\
    #define HAL_ENABLE_INTERRUPTS() \\\nCYG_MACRO_START \\\ncyg_uint32 tmp1, tmp2;\
    \ \\\nasm volatile \\\n    \"mfms %0\"; \\\n    \"ori %1,%1,0x8000\"; \\\n   \
    \ \"rlwmi %0,%1,0,16,16\"; \\\n    \"mtms %0\"; \\\n    \":=\"r\" (tmp1), \"=r\"\
    \ (tmp2)); \\\nCYG_MACRO_END\n```\n\nCode Listing 2.2 PowerPC architecture implementation\
    \ of HAL_ENABLE_INTERRUPTS() macro.\n\nIn Listings 2.1 and 2.2, we see that the\
    \ call HAL_ENABLE_INTERRUPTS(),\ns shown on line 1 of both listings, is the regardless\
    \ of the architecture. However, the process\nfor actually executing an interrupt\
    \ enable varies from architecture to architecture, as shown\nlines 2 through 9\
    \ in Code Listing 2.1 and lines 2 through 10 in Code Listing 2.2. The HAL\nallows\
    \ the application layer to directly access hardware and any architectural features\
    \ and does\nnot assume it is the only controller of all hardware in the system.\n\
    \nGeneral design principles were followed during the architecting of the HAL.\
    \ First, the\nentire HAL is implemented in C and assembly language. This allows\
    \ the HAL to have the widest\nrange of applicability.\n\nSecond, interfaces to\
    \ the HAL are implemented in C macros. This allows the most eff-\ncient implementation\
    \ to be used and yet the interface is not affected. The interfaces can\nimplemented\
    \ as inline assembly code, inline C code, or external function calls to C or assembler\n\
