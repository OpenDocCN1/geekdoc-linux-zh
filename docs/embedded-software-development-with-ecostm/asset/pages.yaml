  md: '# A Platform Porting Example


    Now we customize the software for our new target platform, including changing
    clock configuration, memory layout, and adding or modifying device drivers to
    match the new hardware. Then we are able to build a RedBoot image for our new
    platform. Once this RedBoot image is up and running, we are able to extend the
