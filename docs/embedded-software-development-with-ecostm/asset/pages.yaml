- img_proc: true
  md: '# CHAPTER 11


    # The eCos Toolset


    This chapter begins by looking at the structure of packages in the eCos repository,
    including a brief description of the CDL used for package script files. We then
    look at the graphical Configuration Tool used to customize and build the eCos
    library, and then build and run tests on your target platform.


    Finally, we look into the other eCos tools and additional open-source tools to
    aid in our embedded software development. These additional open source tools also
    allow us to set up a complete development environment environment. This chapter
    prepares us for building the eCos library with the tools provided in the eCos
    development kit. Using this information, we can then build an example application,
    which is covered in the next chapter, and run it on our target hardware platform.


    # 11.1 Packages


    To get a better understanding of the eCos toolset, we need to take a closer look
    at the modules that the tools operate on: packages. As described in Chapter 1,
    An Introduction to the eCos World, a package is a software component incorporating
    all necessary source and configuration files for distribution. A package can be
    for a single hardware device or for an entire networking stack. Packages can be
    configured, using the different eCos tools, to operate in a mode specific to your
    application. We see how to manipulate packages with the eCos configuration tools
    in the Package Control section of this chapter.


    In order for the eCos component framework to make use of packages, the package
    must follow rules imposed by the framework. A CDL script file is included with
    each package, which describes the package to the component framework. Included
    in the CDL script files are'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'dependencies using the package, configuration options and their associated
    value ranges, and details on how to build the package.


    # 11.1.1 Package Directory Structure


    All packages in the eCos repository are located under the packages subdirectory
    under the root eCos development kit directory; in our case, D:\ecos. A packages
    directory snapshot is shown in Figure 1.3 in Chapter 1. The eCos source code repository
    is constantly evolving to accommodate new features and hardware platforms, the
    latest eCos repository might differ from the one shown in Figure 1.3.


    As we see in Figure 1.3, the different packages are arranged based on the functionality
    provided by the package. For example, all device drivers are contained in the
    dev subdirectory, while all compatibility layer support, such as POSIX and uTRON,
    is contained in the compat subdirectory. The depth of the subdirectory is different
    for each package. It is a good idea to familiarize yourself with the overall directory
    structure by browsing through your e development kit installation.


    Under the packages directory is the package database file ecos.db. This file uses
    the CDL and contains a high-level description for all packages in the component
    framework. Additional details about the eCos database file are included later
    in The Configuration Tool of this chapter.


    Although the depth of the subdirectory structures varies for each package, each
    of these packages is comprised of a number of common subdirectories that separate
    the functionality supplied in the different files. The common directory structure
    for an example package is shown in Figure 11.1. Not all packages contain all of
    the common package subdirectories shown in Figure 11.1; some packages contain
    more, some less.


    > Our local eCos source code repository, installed in Chapter 10, The Host Development
    Platform, also contains CVS directories at different levels of our directory tree.
    These directories are used by the CVS program—in our case, WinCVS—to keep track
    of information about our local eCos repository and the online eCos repository.
    We can ignore these directories at this point since they do not contain any source
    code files for eCos.


    It is also important to note that not all of the packages strictly follow the
    rules for the location of files, making the possibility of the file organization
    slightly different from package to package.


    As we see in Figure 11.1, the root of the typical package directory is the version.
    The actual name of this subdirectory depends on the repository version installed.
    From our installation completed in Chapter 10, we have a version directory called
    current.


    Having multiple versions for each package allows you to experiment with new versions
    while maintaining a working version for a particular package. If the new, experimental
    version of the package does not work in your application, you can always revert
    to a previous version.'
  merge: -1
