    # 7.4.2 Device Drivers


    A device driver is a piece of code that controls a specific hardware component.
    Ecos device design focuses on eliminating any unnecessary complexity layering.
    It is the job of the device driver to isolate and encapsulate the component-specific
    implementation. This allows the I/O Sub-System to present a standard interface
    to higher-level software modules using the I/O table.


    The I/O table is a structure defined as cyg_devio_table_t in the file devtab.h.
    This structure defines write, read, get, and set configuration for accessing device
    drivers. The I/O table is initialized by the cyg_io_init function, which is defined
    in iosys.c. This function is called during the HAL startup along with the other
    constructors. In turn, each device driver initialization function, defined in
    the driver''s I/O table entry, is called.


    For example, when an application needs to output a text message on a serial port,
    the application calls the I/O Sub-System API function, which in turn uses the
    device driver to manipulate the hardware for transmission of each character on
    the serial line. The application does not need to be aware of any hardware-specific
    details, such as the registers to program in order to transmit a character out
    the serial port. Using separate device driver modules in this manner allows the
    software to be portable across different hardware platforms where the higher-level
    application code is not dependent on the specific hardware implementation. This
    modular approach also eases the understanding and debugging of the software.


    A I/O table entry describes Ecos device drivers. This structure, cyg_devtab_entry_t
    located in the file devtab.h, defines the device name, the device name layered
    below (if applicable), a pointer to the I/O table handler functions, the device
    initialization function, the I/O table lookup function, and a placeholder for
    device specific data.


    With along standard controls supplied by the device driver, additional functions
    are provided that are specific to the type of device supported. The device driver
    also contains the ISR and D functions for the device it manages.


    Device drivers use an API for interacting with the kernel and HAL. The function
    parameters and definitions are the same as the non-driver-kernel API functions,
    which do not contain _drv_ in the function name. The function cyg_drv_isr_lock
    and cyg_drv_isr_unlock functions are defined the same as the cyg_interrupt_disable
    and cyg_interrupt_enable functions, respectively. The function cyg_drv_dsr_lock
    is defined the same as cyg_scheduler_lock, and cyg_drv_dsr_unlock is defined the
    same as cyg_scheduler_unlock.'
