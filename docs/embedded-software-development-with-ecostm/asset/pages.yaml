    the test download and the connection method to the target, which can either be
    via serial or Ethernet port. Additional information about running tests using
    the Configuration Tool is covered in Chapter 12.


    The Configuration Tool offers a search tool located under the Edit -> Find menu,
    or the Find icon on the standard tool bar can be used. The Find dialog allows
    you to search for a text string within a configuration item. Find names, item
    names, short descriptions, current values, or default values. This tool is very
    useful when you need to locate a specific configuration item nested deep within
    the component repository.


    Beneath the menu is the tool bar. The tool bar in Figure 11.3 is the Standard
    bar. This is enabled by selecting Toolbar under the View menu. The tool bar allows
    faster execution of different menu options by clicking on the different. Hovering
    over the tool icons with the mouse causes a tip to pop up that describes the operation
    of that particular icon.


    At the bottom of the Configuration Tool we see the status bar. In Figure 11.3,
    the status bar shows Ready and No Conflicts. During manipulation of the configuration,
    the status bar gives feedback of the operation being performed and any problems
    that might arise. Additionally, when building the eCos library status bar gives
    a progress meter and numerical percentage of the build progress.


    During our installation procedure, we select the blue and user tools. However,
    there might be a circumstance when selecting a different location for these tools.
    In that case, select Tools -> Paths -> Build Tools to set the location of the
    cross-development tools, such as i386-elf-gcc. To set the user tools, select Tools
    -> Paths -> User Tools to set the location of the Cygwin tools.


    In certain circumstances, such as trying out a new snapshot of the eCos source
    code, it might be necessary to have the Configuration Tool use a different local
    source repository. The repository Configuration Tool uses is by selecting Build
    -> Repository and browsing to the location of the local eCos source code. The
    Configuration Tool then searches for the ecos.db file.


    # 11.2.1 Saving Configurations


    As mentioned earlier in this section, the Configuration Tool uses the title bar
    to notify you that the configuration currently loaded has been modified but not
    yet saved. Does it by displaying an asterisk (*) to the configuration filename
    on the title bar.


    A configuration can be saved either by using the Save icon on the tool or through
    File -> Save or File -> Save As on the menu bar. Configuration files have a .ee
    extension, which stands for eCos Configuration. The saved configuration contains
    all of the packages loaded, template, option settings, and description information,
    which the Configuration Tool uses to generate the proper eCos image. The configuration
    files can be viewed using any text editor. A good understanding of configuration
    files is necessary before attempting to hand edit these files. The Configuration
    Tool inserts comments into the configuration file to separate sections of the
    file.


    After saving the configuration file, build and install tree directory structures
    are created. This is a working directory that the Configuration Tool uses to store
    files during the build procedure.'
