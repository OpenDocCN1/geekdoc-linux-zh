  md: '# CHAPTER 6


    # Threads and Synchronization Mechanisms


    The previous chapter on the eCos kernel provided us with an understanding of how
    the different schedulers handle threads and their associated priority levels.
    In this chapter, we start by covering threads, specifically, how we configure
    the operation of threads, and how we create and use threads in an application.


    Building on this, we then cover different mechanisms available for communication
    between threads and other elements of a typical embedded system. These synchronization
    mechanisms provide standard tools for developing robust applications.


    # 6.1 Threads


    A thread is a single flow of execution through a program. Multiple threads can
    exist in a program, allowing an individual thread to perform its own operations
    on the system. Each thread defined in the eCos system contains its own context
    or workspace to perform its operations and a priority level to execute. It is
    the job of the scheduler to determine which thread is entitled to run at any given
    time. The kernel contains API functions for controlling threads within an application.


    eCos offers configuration options that control the behavior of threads in the
    system, as well as providing additional features to support various thread operations.
    Item List 6.1 details the thread configuration options available. These are located
    under the Thread-Related Options component within the eCos Kernel package.'
