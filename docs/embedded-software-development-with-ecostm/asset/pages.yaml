    # 9.3.2 Host Configuration


    Currently, there are two methods for connecting a host to a target running RedBoot,
    serial or Ethernet. With either method, RedBoot uses the connection for both GDB
    and RedBoot command communications, although RedBoot can be configured to use
    separate communication channels for debugging and commands. RedBoot provides commands,
    which are detailed in the User Interface and Command Set section of this chapter,
    for configuring the different parameters associated with both communication methods.
    After setting these parameters, they are used on subsequent boots of the target
    hardware.


    One important point to understand about the RedBoot driver implementations, for
    both serial and Ethernet, is that polling (not interrupts) is used for I/O communication.
    The configuration option Processing Idle Timeout (ms) (CYGNUM_REDBOOT_IDLE_TIMEOUT)
    sets the RedBoot command processing interval. After this timeout expires, RedBoot
    assumes the command console is idle and performs various background tasks. The
    default value for this option is 10 milliseconds. If traffic increases, there
    might be a point at which the RedBoot driver cannot keep up and packets are dropped.
    In that case, it might be necessary to adjust the timeout option or re-check the
    traffic that RedBoot needs to process on the communication channel.


    # 9.3.2.1 Serial


    Using the serial connection requires a host-side terminal program. The default
    parameters that RedBoot uses for a serial connection are specific to the target
    hardware platform. On some target hardware platforms, the RedBoot baud rate setting
    can be changed using the command, which is detailed in the User Interface and
    Command Set section of this chapter.


    Most hardware target platforms should contain at least one serial port for RedBoot
    communications. Some platforms contain multiple serial ports. The serial port
    RedBoot uses for serial communication is described in the RedBoot Configuration
    section of this chapter. By default, RedBoot attempts to communicate with the
    host via the serial port, set by the configuration options, on power up. Once
    a command is received by RedBoot on one of the serial ports, used for communications.
    There is a channel command available, which is detailed in the User Interface
    and Command Set section of this chapter, that allows the port RedBoot uses for
    console communication to be changed.'
