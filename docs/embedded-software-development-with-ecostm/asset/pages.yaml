  md: '# The Ecos Tests


    The Ecos repository provides test suites for various packages. The tests are designed
    to thoroughly exercise the various functionality within the different packages
    to ensure proper operation. These tests exercise the software at the module, component,
    and system levels and include stress and performance testing.


    The Ecos repository includes test suites for the kernel, various device drivers,
    and the I/O Sub-System. The kernel suite includes tests that exercise the different
    synchronization mechanisms, run various thread-related functions, and use the
    different click functionality. The I/O Sub-System includes various serial port
    tests. There are also various tests for the different target platforms.


    The test source code is contained in the Ecos source code repository and located
    under the tests directory within a package directory structure; see Figure 11.1
    for an illustration of the generic package directory structure. The test source
    code also provides a great example of how to implement various functionality within
    an application. These tests can be used to guide you through understanding the
    different Ecos APIs.


    Now let''s focus on how we can use the Configuration Tool to build and run various
    tests in the Ecos framework. The tests are built using the Configuration Tool
    by selecting Debug -> Tests. The output files from the test build are located
    in the install tree under the tests directory. The output files are ELF format
    files.


    > NOTE Some tests, such as included in the Basic Networking Framework package,
    contain a configuration option that must be enabled to build the specified tests.
    The Build Networking Tests (Demo Programs) (CYGPKG_NET_BUILD_TESTS) configuration
    option, when enabled, allows additional networking tests to be built.


    After the tests are built, the Configuration Tool also facilitates automatically
    downloading and running the tests on the target hardware. To run the tests using
    the Configuration Tool, select Tools -> Run Tests. This brings up the Tests dialog
    box as shown in Figure 12.4.


    The first tab, Executables, displays all of the tests that are available for running
    on the target hardware. Checking the box next to the next test for running. Tests
    can be added or removed using the buttons at the bottom of the dialog box. Once
    the tests are configured to run, the Run button at the bottom of the dialog box
    begins execution of the selected tests.


    The next tab is Output. This displays output from the tests as they execute on
    the target hardware. The Summary tab keeps track of the results of each test,
    including the time it took to execute and the status as whether the test passed
    or failed.


    Prior to running the tests, the method for connecting to the target hardware is
    selected. Clicking the Properties button at the bottom of the Run Tests dialog
    box brings up the dialog box as shown in Figure 12.15.'
  merge: -1
