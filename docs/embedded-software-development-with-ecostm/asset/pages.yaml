- img_proc: true
  md: '# 9.3.2.2 Ethernet


    The other method for RedBoot communication is using an Ethernet port. In order
    to use an Ethernet port, the RedBoot image must include networking support and,
    obviously, the target hardware must have an Ethernet port.


    One issue that must be resolved is the method for RedBoot to obtain the Ethernet
    MAC address. RedBoot attempts to use the MAC address provided by the board manufacturer.
    However, the MAC address is not provided on all target hardware platforms. On
    some hardware platforms, the Ethernet driver allows RedBoot to program a MAC address
    into the flash configuration, using the `config` command. A default MAC address
    can also be built into the RedBoot image.


    Another issue when using the Ethernet for RedBoot communication is obtaining an
    IP address RedBoot offers two methods for obtaining an IP address for network
    communication, static and dynamic. Selection of the method is controlled by the
    `config` command, which is described in detail in the User Interface and Command
    Set section of this chapter.


    When using the static method, you must set a unique IP address for the RedBoot
    image. Several IP address ranges are good to use because they are private addresses.
    By using private addresses, you can create a private network for your debugging
    configuration, and packets that leave this private network are not forwarded.
    According to RFC 1918, the reserved private addresses:


    +   * 10.0.0.0 to 10.255.255.255

    * 172.16.0.0 to 172.31.255.255

    * 192.168.0.0 to 192.168.255.255


    It is important to realize that RedBoot does not offer any routing support; therefore,
    the IP address for the target hardware running RedBoot and the host must be on
    the same subnet. RedBoot uses ARP to resolve the host address and sends packets
    directly to the host unit.


    When using the dynamic method, the BOOTP protocol is enabled in the RedBoot image.
    Again, selecting the dynamic method is accomplished through the `config` command.
    The dynamic method also requires a BOOTP server running on the host to provide
    an IP address to the target hardware. There are several free or shared BOOTP servers
    available on the Web, including the BOOTP Turbo Server from Weird Solutions and
    a DHCP/BOOTP Server from Dr. Herbert Haneinkel.


    Once the IP address has been successfully set on the target hardware, you can
    use the ping utility to verify communication between the target and the host.
    Most host operating systems offer this utility. RedBoot also contains a `ping`
    command, which is described in the User Interface and Command Set section of this
    chapter.


    After the IP address is assigned to the target hardware Ethernet port, you can
    connect to RedBoot from the host using a Telnet client application. Most host
    operating systems provide a Telnet client utility and if not again, a search on
    the Web will bring a few options. Next, the port number that is used for Telnet
    protocol communications must be set on the host'
  merge: -1
  pgno: 219
