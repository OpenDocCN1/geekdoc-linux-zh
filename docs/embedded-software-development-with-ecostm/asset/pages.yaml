    cover in this section. The first is the Package Administration tool. The Package
    Administration tool allows you to control the packages contained in your local
    eCos component repository.


    The other tool, the command-line configuration tool, allows you to configure packages
    the same way as the graphical Configuration Tool. This section is intended to
    give you an overview'
