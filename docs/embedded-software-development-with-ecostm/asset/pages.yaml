- img_proc: true
  md: '# CHAPTER 12


    # An Example

    Application Using

    eCos


    In this chapter, we get down to using eCos and the development tools. The examples
    here detail one method for setting up a debug environment using RedBoot, building
    an eCos library, and then building an application that incorporates eCos. There
    are several different approaches to achieve a similar development and debug environment
    using different configuration options. These examples provide a straightforward
    method to achieving our goal: getting eCos up and running.


    We begin by building the RedBoot ROM monitor, which allows us to debug our application
    using GDB on our host development system. Next, we build an eCos library for us
    to use with our application. Then, we build a simple application, which includes
    the eCos library image, to understand the process. Each of the examples in this
    chapter builds on the previous steps. After becoming familiar with the process,
    you will be able to tailor the build and debug procedure to meet your needs and
    development style.


    # 12.1 The eCos Build Process


    The main goal of the eCos build process is the generation of an eCos library.
    This library is called libtarget.a. Other target files are also generated, such
    as a linker script file and, in some cases, additional libraries may be generated.


    The RedBoot build process is slightly different than for eCos because a binary
    file is generated at the end of a RedBoot build, which is then installed on the
    target hardware.


    The eCos library build process uses makefiles and the GNU make utility to assist
    in generating the eCos library. The eCos build process involves three separate
    trees: source, build, and install. The source tree is the source code repository,
    which is located under the packages directory.'
  merge: -1
  pgno: 306
