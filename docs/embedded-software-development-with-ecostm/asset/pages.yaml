  md: '# 242 Chapter 11 • The eCos Toolset


    Next is the include subdirectory, which contains public header files for the package.
    During the eCos library build process, which we go through Chapter 12, An Example
    Application Using eCos, some of the header files for packages that are used copied
    into the eCos library working directories. This allows an application to include
    header files needed for a particular package from the working directory rather
    than using the repository directories.


    The src subdirectory contains the source files for the package. This subdirectory
    must be included within a package. The source files might include .c language
    files, .cxx C++ languages, and .S assembly language files. Private header files
    (with a .h extension), accessible only to the package source code, also might
    be contained in this directory. The src subdirectory can be broken down further
    into additional subdirectories to aid with the organization of the source code.
    For example, see the kernel\current\src and net\tcpip\current\srcdirectories.


    Finally is the tests subdirectory. This subdirectory contains any test files relevant
    for the package. We look at building and running tests in Chapter 12.


    Other subdirectories that are often included under certain packages are doc, which
