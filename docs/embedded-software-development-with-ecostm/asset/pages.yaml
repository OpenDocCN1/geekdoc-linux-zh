  md: '# 3.2.2 Interrupt Configuration


    The ECos interrupt configuration options affect the way interrupts are processed
    in the system. Configuration options for interrupts are available at the HAL and
    kernel level. The configuration options available are architecture dependent.


    The HAL-level configuration options are located under the HAL Interrupt Handling
    (CYPGK_HAL_COMMON_INTERRUPTS) within the HAL Common Configuration Components.
    Item List 3.4 lists the configuration options available for setting up interrupts
    at the HAL level.


    # Item List 3.4 HAL Interrupt Configuration Options


    +   **Option Name**: Use Separate Stack For Interrupts

    **CDL Name**: CYGIMP_HAL_COMMON_INTERRUPTS_USE_INTERRUPT_STACK

    **Description**: Allows a separate stack, maintained by the HAL, during interrupt
    processing. This eliminates the need for every thread to allow space for interrupt
    handlers. This option is enabled by default.


    +   **Option Name**: Interrupt Stack Size

    **CDL Name**: CYGNUM_HAL_COMMON_INTERRUPTS_STACK_SIZE

    **Description**: Specifies, in bytes, the stack size for the interrupt stack.
    This is the stack that will be used for all interrupts when Use Separate Stack
    For Interrupts is enabled. The value for this option is dependent on the architecture
    and application, as well as other configuration options, such as interrupt nesting.
    This stack is also used during the HAL startup process. The value for this option
    is 4096.


    +   **Option Name**: Allowed Nested Interrupts

    **CDL Name**: CYGSEM_HAL_COMMON_INTERRUPTS_ALLOW_NESTING

    **Description**: Causes the HAL default VSR to re-enable interrupts prior to invoking
    the interrupt handler. This allows other interrupts, typically of higher priority,
    to occur and be processed. This option is disabled by default.


    +   **Option Name**: Save Minimum Context On Interrupt

    **CDL Name**: CYGDBG_HAL_COMMON_INTERRUPTS_SAVE_MINIMUM_CONTEXT

    **Description**: Permits the HAL interrupt handling code to use architecture-specific
    calling conventions, reducing the amount of state saved. This improves performance
    and reduces code size. The drawback is that debugging is often more difficult.
    This option is enabled by default.


    +   **Option Name**: Chain All Interrupts Together

    **CDL Name**: CYGIMP_HAL_COMMON_INTERRUPTS_CHAIN

    **Description**: Allows all interrupt vectors to be chained, requiring each handler
    to check if it needs to process the interrupt. The default for this is disabled,
    allowing interrupts to be attached to individual vectors.


    +   **Option Name**: Ignore Spurious Interrupts

    **CDL Name**: CYGIMP_HAL_COMMON_INTERRUPTS_IGNORE_SPURIOUS

    **Description**: Specifies whether to ignore an interrupt that might occur from
    the hardware source not being properly de-ounced or interrupts coming from glitches.
    This option is disabled by default.'
