    Allows interrupt vectors to be chained, requiring each handler to check if it
    needs to process the interrupt. The default for this option is disabled, allowing
    interrupts to be attached to individual vectors.


    An interrupt is a type of exception that can be found in a processor''s exception
    table. As previously mentioned, different architectures support interrupts in
    various methods; however, eCos provides a standard method for handling interrupts
    across all HAL architectures. The ARM architecture is the exception that deviates
    from the standard eCos interrupt handling model.


    The eCos interrupt handling mechanism, described in this section, can be bypassed
    by installing a VSR service routine in the VSR table directly from the application
    layer. The application is solely responsible for implementing, in assembly language,
    all support that would otherwise been provided by the HAL default interrupt VSR,
    such as storing and restoring the processor''s current state after the interrupt
    has been serviced.


    We are going to take a look at the default configuration when the HAL default
    interrupt VSR is used. The default interrupt VSRs for the different architectures
    are shown in Table 3.2. Figure 3.2 illustrates the execution flow of the eCos
    interrupt handling method. This figure shows the level—application, kernel, and
    HAL—responsible for executing each piece of code.


    # Table 3.2 Default Interrupt Vector Service Routines


    | Architecture | Default Interrupt Vector Routine Name |

    |---|---||

    | CalmRISC16ᵃ | __default_irq_vsr and default_fig_vsr |

    | Fujitsu FR-V | __interrupt |

    | i386 (including Synth), PowerPC, SuperH | cyg_hal_default_interrupt_vsr |

    | Hitachi H8/300, MIPS, MN103000 | __default_interrupt_vsr |

    | V8x | do_interrupt |

    | SPARC, SPARClite | hal_default_interrupt_vsr |


    > ᵃ The CalmRISC16 processor contains two different default exception routines,
    one for a sw exception and one for a trace exception.'
