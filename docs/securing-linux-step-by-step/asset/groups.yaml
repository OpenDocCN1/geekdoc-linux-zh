    ## 第 4 节 保护服务器网络配置


    ## 第 4.7 节 服务器消息块 (SMB) SAMBA 服务器


    SMB 协议是微软开发的用于文件和打印机共享的通用网络文件系统（CIFS）的核心。Samba 的理念是让 UNIX 服务器在网络邻域中的客户端看来与任何 NT
    服务器完全相同。安装 Samba 软件本身相对简单，但要将其成功集成到办公环境中还有许多细节需要注意。Samba 服务器管理员应审阅随服务器提供的详尽文档，以及书籍《Samba:
    Integrating UNIX and Windows》（Blair, SSC, Inc. ISBN 1-57831-006-7）。


    ### 第 4.7.1 节 获取最新版本的 Samba


    截至本文编写时，Red Hat 6.0 版本已发布了 Samba 的更新包以修复问题。请检查你发行版的更新，并确保你已安装 Samba 2.0.5a 或更高版本。


    ### 第 4.7.2 节 限制对特定主机的访问


    编辑 `/etc/smb.conf` 中的 `[global]` 部分，设置允许访问 Samba 服务器的主机列表以及 Samba 服务器监听的接口：


    ```

    hosts allow = .example.org 128.184.

    interfaces 192.168.0.1/24 127.0.0/32

    bind interfaces only = true

    ```


    ### 第 4.7.3 节 使用加密密码


    在设置 Samba 使用加密密码之前，请阅读 `/usr/doc/samba-2.0.5a/docs/textdocs/ENCRYPTION.txt`。


    Red Hat Linux 6.0 默认在 `/etc/smbpasswd` 中查找 Samba 密码。其他发行版可能使用 `/etc/samba.d/smpasswd`
    或完全不同的路径。该路径定义在配置文件 `/etc/smb.conf` 中。你可以通过以下命令创建一个模板 `/etc/smbpasswd`：


    ```

    [root]# mksmbpasswd.sh < /etc/passwd >/etc/smbpasswd

    [root]# chmod 006 /etc/smbpasswd

    ```


    编辑该模板以移除 `bin`、`daemon` 和 `ftp` 等系统账户的条目。管理员应为每个账户设置默认密码。如果你希望用户设置自己的密码，则需要编辑
    `/etc/smbpasswd`，在密码字段的前十一个字符中输入字符串“NO PASSWORD”，保留剩余的21个“X”字符。然后通过 `/etc/smb.conf`
    的 `[global]` 部分添加以下行来启用空密码：


    ```

    null passwords = true

    ```


    重启 smb 服务器。如果你决定使用这种方法，请只给用户留出很短的时间重置密码。如果截止日期后 `/etc/smbpasswd` 中的任何条目仍包含字符串“NO
    PASSWORD”，则请为这些用户设置密码。


    ### 第 4.7.4 节 移除“guest”或匿名共享


    Red Hat 6.0 默认的 `/etc/smb.conf` 仅启用了本地主机上每个用户家目录的用户级共享。其他发行版可能启用了其他公共可读的共享。在启用
    Samba 之前，请仔细检查 `/etc/smb.conf` 中定义的共享，并禁用任何绝对非必要的共享。对于剩余的共享，仅在绝对必要时允许写入访问。考虑仅为需要权限的用户设置写入权限，而不是为任何连接服务的服务的用户。


    ### 第 4.7.5 节 设置默认文件创建掩码


    默认的文件创建掩码使文件对所有人可读。编辑 `/etc/smb.conf` 并搜索以下行，将掩码改为清除“其他”权限位：


    ```

    create mask = 0770

    directory mask = 0750

    ```


    ## 第 4.8 节 集中 syslog 主机


    如第 2.8.3 节所述，对于拥有多台机器的组织来说，集中日志主机非常重要。它们在保存有关异常和中断的信息及证据方面提供了额外的防御线。由于这一重要的安全功能，日志主机应尽可能安全。除了用于远程管理的
    SSH 外，不应在机器上运行或安装任何其他服务。应只安装最少的系统工具集。主机应该有一个大且快速的磁盘专门用于 `/var/log` 目录以收集 syslog。应提供快速、大容量的备份设备。日志轮转（见第
    2.8.4 节）应关闭或设置为很长的间隔，并且所有日志文件应保留较长时间。


    如上述第 2.8 节提到的，有几种替代的 syslog 守护进程实现，它们比 Red Hat 安装光盘上提供的最常见的 syslogd 更安全。请参阅附录
    A 第 2 节获取某些替代方案的参考。


    ### 第 4.8.1 节 配置 syslog 接受远程日志消息


    Red Hat Linux 中大多数 syslog 守护进程的默认行为是不接受日志消息。这与大多数 BSD 风格守护进程的行为相反。要开启此功能，请编辑 `/etc/rc.d/init.d/syslog`，并在启动
    syslog 守护进程的行添加 `-r` 选项：


    ```

    start

    daemon syslogd -r

    ```


    然后，重启服务：

    [root]# /etc/rc.d/init.d/syslog restart


    ### 第 4.8.2 节 配置日志轮转


    如第 2.8.4 节所述，`logrotate` 程序旨在在一段时间后对日志文件进行轮转、保存和删除。当日志文件达到特定大小时，应关闭日志轮转（通过删除 `/etc/cron.daily/logrotate`），或者编辑
    `logrotate.conf` 文件以保留日志文件。例如，如果你的组织安全策略要求保留一年的日志，编辑 `logrotate.conf` 将前几行改为：


    ```

    # rotate log files monthly

    monthly


    # keep years worth of logs

    ```


    ## 第 4.9 节 文件传输协议 (FTP)


    Red Hat Linux 以及大多数其他发行版都有名为“anonftp”的包，它可以设置具有适当权限的匿名 目录。为了确保安全，检查 `/home/ftp`；`bin`
    和 `etc` 目录应由 root 所有，权限为 `111`。


    ### 第 4.9.1 节 使用 TCP wrappers 限制访问


    FTP 守护进程通过 inetd 调用并由 TCP wrappers 保护。如果 FTP 服务器仅对一组机器开放，请在 `/etc/hosts.allow`
    中设置限制：


    ```

    .example.org 128.184.

    ```


    FTP 守护进程应对所有人开放：


    ```

    ftpd: ALL

    ```


    ### 第 4.9.2 节 在 /etc/ftpaccess 中限制允许的操作


    Red Hat 自带的 WU-FTP 守护进程通过 `ftpaccess` 文件进行精细控制。更多信息请参阅 `ftpaccess(5)` 手页。在此文件中，你可以根据用户连接的来源、并发用户数定义用户类，限制类允许的操作等等。


    如果需要可写目录（见下文），可以通过在 `/etc/ftpaccess` 中放入以下内容来阻止匿名用户修改内容，无论目录权限如何：


    ```

    ```


    ### 第 4.9.3 节 保护进入的目录


    通常情况下，允许匿名 FTP 目录具有写入访问不是一个好主意，但有时必须这样做。这种目录传统上被称为“进入目录”。FTP 守护进程具有许多控制功能，可以帮助防止进入目录变成资源站点。


    首先，创建一个可写入但不可进入的进入目录：


    ```

    [root]# mkdir -m 333 /home/ftp/incoming

    ```


    然后，编辑 `/etc/ftpasswd` 并添加这些行：


    ```

    path-filter anonymous /etc/ftpassmsg ^[-A-Za-z0-9]*$ \

    ^-

    upload /home/ftp /incoming yes root ftp 0600 nodirs

    nretrieve /home/ftp/incoming/

    ```


    第一行限制了上传名称为字母、数字、连字符、点和下划线，并限制文件名以点或连字符开头（因此匿名用户无法创建一个名为例如等的文件）。第二行表示允许上传到进入目录的文件，这些文件将具有
    UID GID ftp，模式为 0600，且不允许用户创建子目录。最后一行完全禁止从进入目录下载内容，因此一旦文件被写入那里，另一个匿名用户就无法获取它。


    '
