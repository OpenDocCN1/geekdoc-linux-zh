    ## STEP 5 Tuning and Packet Firewalls


    ## STEP 5.3 PACKET FIREWALLS AND LINUX MASQUERADING


    A Linux server running a well-configured firewall is one of the most effective
    ways to protect the local server and its internal networks behind it. Linux 2.2.x
    kernels have a very stable firewall implementation that is administered through
    a tool called iptchains. This tool gives the administrator flexibility to define
    the type of traffic allowed in and out of the firewall. However, that kernels
    prior to version 2.2.11 had a bug in the IP fragmentation code that allowed an
    attacker to send carefully crafted IP fragments that would bypass iptchains rules.
    We recommend that administrators of enterprise systems install the latest version
    of the kernel (version 2.2.12) at the time of this writing.


    Firewall technology is a book in itself (for example, "Building Internet Firewalls"
    Chapman & Zwicky, 1995, O''Reilly & Associates, ISBN 1-56592-124-0), and far beyond
    the scope of this guide. See the Resources for a URL to the IPCHAINS and IP-MASQ
    HOWTOs for an in-depth discussion.


    ### Step 5.3.1. Getting more from your external connection to IP Masquerade


    A firewall protects standalone servers very well but can also protect internal
    computers. A common example of this configuration would be a person or company
    connecting their home/office network to the Internet. A wrinkle to this is TCP/IP
    addresses used on the Internet are becoming a scarce and valued commodity. Thus,
    getting TCP/IP addresses for all of your internal computers can cost a bit of
    money. Network address translation (NAT) was developed to conserve TCP/IP addresses
    while still allowing internal computers to access the Internet. For Linux, a form
    of NAT was developed called Masquerade, which is in common use by many Linux users.


    ### Step 5.3.2. A strong /etc/rc.d/rc.firewall ruleset


    See Appendix D for the complete listing of a strong packet firewall script for
    an IP Masqueraded machine connected to the Internet via an Ethernet connection
    to a Cable modem, or other persistent network connection. There are extensive
    embedded comments to explain what the various rules do and how to modify the rules
    to suit your specific needs.


    ### Step 5.3.3. Double check, install, and test the firewall


    Once you have the /etc/rc.d/rc.firewall ruleset copied into the machine, it is
    very important to tailor it to your specific environment. Make sure that the names
    of the internal and external interfaces are correct. Make sure the TCP/IP addressing
    scheme of your internal network is configured properly.


    Next, test the ruleset to be sure that it loads without errors, does not block
    any specific traffic that you need for your environment, and that it loads upon
    every reboot of the server.


    ### Step 5.3.3.1. Make the ruleset executable


    To be able to run the ruleset, you need to make the /etc/rc.d/rc.firewall script
    executable:


    ```bash

    [root]# chmod 700 /etc/rc.d/rc.firewall

    ```


    ### Step 5.3.3.2. Load the ruleset while at the console of the Linux server


    As shown in Step 2.8, monitor the console logs on VTY7 and VTY8. If the Firewall
    script runs without any visible errors, the system should immediately begin to
    block traffic that you want. The console logs will show you what is and isn''t
    blocked.


    When you execute /etc/rc.d/rc.firewall the output of the script should look something
    like the following:


    ```bash

    [root]# /etc/rc.d/rc.firewall

    ```


    #### Loading IPCHAINS Firewall Version 3.12


    External IP: 192.168.0.14

    External broadcast: 192.168.1.255

    Default GW: 192.168.0.1


    - Adding multicast route.

    - SIOCADRT: File exists

    - Enabling IP forwarding.

    - Enabling dynamic TCP/IP address hacking.

    - Changing IP masquerading timeouts.

    - Loading masquerading modules.

    - Flushing all old rules and setting all default policies to REJECT


    Input Rules:


    - Setting input filters for traffic on the internal LAN.

    - Setting input filters for specific internal hosts.

    - Setting input filters for traffic from the external interface.

    - Setting input filters for public services (all interfaces).

    - Setting input filters for explicit external hosts.

    - Final input catch all rule.


    Output Rules:


    - Setting output filters for traffic on the internal LAN.

    - Setting output filters for specific internal hosts.

    - Setting input filters for traffic to the external interface.

    - Setting output filters for public services (all interfaces).

    - Reject specific outputs.

    - Setting output filters for explicit external hosts.

    - Final output catch all rule.


    Forwarding Rules:


    - Enable IP Masquerading from the internal LAN.


    Firewall implemented.


    ### Step 5.3.3.3. Test the firewall ruleset


    While at the console of the Linux server, try various network applications like
    TELNET, FTP, SSH, etc. to computers on the Internet and the internal LAN. If that
    tests well, try a similar set of tests on one of the computers. If, for any reason,
    the machines don''t respond properly, check the /var/log/messages file or on the
    console, watch VTY7 for firewall hits.


    ### Step 5.3.4. Analyze a typical IPCHAINS ruleset


    So you are starting to see IPTABLES in /var/log/messages. Realistically, this
    is happening either because your ruleset is too restrictive for your environment
    or it is working properly and blocking unwanted traffic. For example, once the
    ruleset is installed, DHCP no longer works. Here is the resulting IPTABLES log:


    ```

    Aug 8 21:00:32 kernel: Packet: output REJECT eth0=17 192.168.0.14:68 192.168.0.1:604
    S=0 F=0 T=64

    ```


    There is a LOT of information in this line let''s break it down by section. Refer
    back to the logged hit as you read:


    - This firewall hit occurred on Aug 8 21:00:32 on "test"

    - The ruleset hit on the output side of the firewall (other hits can be "input"
    or "forward")

    - The hit was then "REJECT" (others can say "DENY" or "ACCEPT")

    - The hit was on the "eth0" interface

    - This occurred over PROTO=17 UDP (other common protocol numbers are 1 for ICMP
    and 6 for TCP). A full list of other protocols can be found in /etc/protocols

    - The source hit came from IP address 192.168.0.14 on port 67 which is for client
    (a list of port numbers can be found in /etc/services)

    - The destination address was 192.168.0.1 to port 68 which is for Server

    - The packet''s length was 604 bytes

    - This packet did not have any "Type of Service" (TOS) (don''t worry about TOS,
    it''s a low-level flag denoting how the packet should be passed through the network,
    a value of 0 is normal)

    - The packet''s "IP ID" number was 0 (again, don''t worry about ID, its to reassemble
    packets)

    - The packet was not fragmented

    - The packet had a TimeToLive (TTL) of 64 (every hop across the Internet will
    subtract 1 from this number, when TTL=0 the packet is dropped)

    - Though not available in earlier kernel versions, if there is an additional field
    after TTL it reflects the rule number which caused the packet to log


    Putting it all together, we see that the OUTPUT rule for "DHCP clients" was not
    enabled, resulting in a REJECTED packet. If you uncomment those two lines in the
    ruleset and run the script again, DHCP will work fine.


    ### Step 5.3.5. Running the firewall ruleset upon every reboot


    To make the /etc/rc.d/rc.firewall ruleset run when Linux boots, edit /etc/rc.d/init.d/network.
    Look for the end of the "start" case (immediately before the double semicolon
    "; ") insert the following lines:


    ```

    # Load the firewall ruleset

    etc/rc.d/rc.firewall

    ```


    This will invoke the firewall ruleset immediately after the network interfaces
    are initialized, minimizing the period of time the interfaces are vulnerable.


    ## STEP 6 Tools


    There are many security-related tools available for monitoring the computer from
    inside (host-based) and the outside (network-based). In this step, we will not
    present exhaustive details of the installation and operation of each tool. We
    just want to make you aware of the most common tools available, their general
    purpose and operational parameters. You are encouraged to inspect the documentation
    and websites mentioned, and experiment with the tools to craft them into an integrated,
    personalized toolkit.


    ## STEP 6.1 HOST-BASED MONITORING AND INTRUSION DETECTION


    Host-based monitoring and intrusion detection (ID) tools generally concentrate
    on reading, processing and evaluating system log files. This implies that log
    files contain enough information to detect intrusion attempts in the first place.
    See Step 2.8.1 above for setting options in /etc/syslogd.conf and other logging
    options for maximizing the information available.


    As with any ID system, the greatest problem is "false positives": results that
    look like intrusions, or at the very trigger some action, when the event is completely
    innocuous. All ID and monitoring tools require patience and persistence on the
    part of the administrator. As proposed the best network access policy — deny intrusion
    detection by default. In other words, ignore those events that you are safe to
    ignore, and let the ID system report everything. Time and experience will allow
    you to filter events that do not require your attention.


    ### Step 6.1.1. Swatch, the SimpleWatcher


    Swatch is a Perl program designed to read syslog files and generate events based
    on the content of the messages. Version 2.2 is supplied on the Red Hat Linux distribution
    media. Version 3.0 is in Beta testing at the time of this writing, available from
    http://ftp.stanford.edu/general/security-tools/swatch/. This is a complete rewrite
    taking greater advantage of the features of Perl version 5, and with a completely
    revamped configuration file for scanning the syslog files.


    The control file for swatch version 2.2 consists of a list of Perl regulars expressed
    by "actions." See the manual page swatch(5) for a detailed description of the
    file. Here is a simple control file that will only list the lines in the syslog
    file that have the word "refused" in them:


    ```

    /refused/ echo-bold

    /*/ ignore

    ```

