- md: "\n## STEP 2.6 FINAL LINUX INSTALLATION RECOMMENDATIONS\n\n### Step 2.6.1. Create\
    \ a boot diskette\n\nOne step that many Linux users skip is the creation of an\
    \ emergency boot diskette. The Red Hat installer creates a bootable diskette with\
    \ a Linux kernel with all of the specific hardware and configuration support for\
    \ your computer. Though creating a boot disk isn't a required step, eventually,\
    \ a system emergency will come up you'll be happy you created it. Make sure the\
    \ boot diskette is properly labeled and stored in a secure place like a tape cabinet\
    \ in a computer room or locked desk drawer.\n\nAlthough we strongly suggest you\
    \ create the emergency diskette **now**, if you decide to do it later, in Red\
    \ Hat Linux the script /sbin/mkbootdisk will create the disk for you. See the\
    \ page mkbootdisk(8) for more information.\n\n### Step 2.6.2. Tighten up settings\
    \ in /etc/inittab\n\nThe /etc/inittab defines the boot behavior of the SYSV init\
    \ process, process number 1 (see Step 3.3 for additional information about SYSV\
    \ init startup scripts). Use /etc/inittab to disable rebooting from the console\
    \ with the \"Control + Alt + Del\" key sequence, and to require the root password\
    \ to enter single user mode.\n\nTo disable the \"Control + Alt + Del\" key sequence,\
    \ change the line in /etc/inittab file that reads:\n\n```\nca::ctrlaltdel:/sbin/shutdown\
    \ -t3 -r now\n```\n\nto read:\n\n```\n#ca::ctrlaltdel:/sbin/shutdown -t3 -r now\n\
    ```\n\nTo require the root password when you enter single user mode, add the following\
    \ line to /etc/inittab for the entry for si::sysint:::\n\n```\n~:S:wait:/sbin/login\n\
    ```\n\nTo make these changes take effect immediately, type in the following command:\n\
    \n```\n[root]# init q\n```\n\n## STEP 2 Install Linux\n\n### Step 2.6.3. Password\
    \ protect LILO boots\n\nThe Linux Loader (LILO) is the primary mechanism for booting\
    \ Linux. If the security of the Linux machine cannot be assured, password protect\
    \ the LILO prompt in addition to requiring the root password to enter single user\
    \ mode. Note that password protection of the LILO prompt may interfere with the\
    \ automatic restart of a system after a power failure or system crash. Administrators\
    \ of mission-critical servers in controlled computer room environments may not\
    \ want this feature.\n\nTo protect the LILO prompt, edit /etc/lilo.conf and add\
    \ the following after the prompt line:\n\n```\npassword = your-password\nrestricted\n\
    ```\n\nReplace \"your-password\" with a strong password as shown in Step 2.5.2.\
    \ Save /etc/lilo.conf and change the permissions of that file since the LILO password\
    \ is saved in clear text:\n\n```\n[root]# chmod 600 /etc/lilo.conf\n```\n\nMake\
    \ the changes take effect:\n\n```\n[root] # /sbin/lilo\n```\n\nWith these changes\
    \ in place, the system will boot just as it has before, but if you give LILO any\
    \ command line options at the LILO prompt, such as single to boot in single-user\
    \ mode, it will ask for a password before proceeding.\n\n## STEP 2.7 SET SYSTEM\
    \ ACCESS SECURITY POLICIES\n\nMost Linux distributions allow for configuring which\
    \ users are allowed to login on system system, at which times, on which date,\
    \ and through which services (TELNET, FTP, etc.). Most Linux distributions are\
    \ configured correctly, if somewhat loose, out of the box, and it is important\
    \ to confirm all of these settings.\n\n### Step 2.7.1. Check that root logins\
    \ are disabled for TELNET\n\nThe /etc/securetty file contains a list of all TTY\
    \ interfaces that allow root logins. In Red Hat Linux, and most distributions,\
    \ this file by default contains only the console TTYs (tty1, tty2, ... tty8, inclusive).\
    \ If remote users require root privileges on this system, they can simply login\
    \ to their own account and use the \"su -\" command to become root.\n\n### Step\
    \ 2.7.2. Check that remote root logins are disabled for FTP\n\nThe /etc/ftusers\
    \ file contains a list of all user accounts that are not allowed to login via\
    \ FTP. Make sure that the root account and all additional system daemon accounts\
    \ are listed in this file. You can also enter account names for other user accounts\
    \ that you do not want to access the machine by FTP.\n\n### Step 2.7.3. Configure\
    \ the system accounts that can/cannot log into the system\n\nThe /etc/security/access.conf\
    \ contains login parameters for all accounts on the system. You can configure\
    \ which users login through which service in a similar manner to TCP wrappers,\
    \ as described in Section 3.2. To disable all console logins except for the root\
    \ account and the administrator, put the following in /etc/security/access.conf:\n\
    \n```\n:ALL EXCEPT root admin :console\n```\n\n### Step 2.7.4. Configure the system\
    \ groups that can/cannot use specific resources\n\nThe /etc/security/group.conf\
    \ defines which users can access files with specific permissions.\n\nThe /etc/security/limits.conf\
    \ defines system resource limits (CPU time, disk space, etc) for specific users\
    \ or groups.\n\nThe /etc/security/times.conf defines the times of day that specific\
    \ users are allowed to access the system. Ordinary users can be restricted to\
    \ logging to.\n\n## STEP 2.8 CONFIGURE LOGGING\n\nRed Hat and most other distributions\
    \ use the syslog for generating logs. The syslog daemon parses messages based\
    \ on \"Facility\" and \"Level\". The syslog has some security problems, notably\
    \ there is no built-in way to tell if logs have been tampered with. There are\
    \ several alternative daemons that add digital signatures for logs, and encrypted\
    \ communications for remote logging. See Appendix A for these daemons.\n\n###\
    \ Step 2.8.1. Optimize SYSLOG settings\n\nThe default logging for Red Hat is good\
    \ but it can be made better. To improve it, edit the configuration file, /etc/syslog.conf,\
    \ and add the following:\n\n```\n*.warn;*.err      /var/log/syslog\nkern.*   \
    \        /var/log/kernel\n```\n\nNote: The separators between the syslog facility\
    \ in the first column and the syslog files in the second column must be tabs.\
    \ If there are spaces, the syslog will not load.\n\n### Step 2.8.2. Configure\
    \ real-time logging to VTYs\n\nThe real-time display of system logs on VTY 7 and\
    \ 8 (the Alt-F7 and Alt-F8 screens) is very useful. To do this, append the following\
