    # STEP 1

    ## Before Installation


    ## STEP 1.1 DETERMINE THE SECURITY NEEDS


    System security on any operating system needs to be thought out before hand. Security-conscious
    home users and corporations alike need to determine the following before installing:


    1. What are you trying to protect? Confidential data (medical records, credit
    card numbers, etc.), access to essential services (DNS, mail, etc.), computing
    resources (user shell accounts, software development tools, and so forth.


    2. To what extent should security be implemented before the costs outweighs the
    value of the original data and/or services being protected?


    You will need to determine what this machine''s main purpose will be. Once determined,
    try to stick to your original plan. The two primary purposes covered in this guide
    are:


    1. Workstation: X-Windows, user applications like Web browsers, e-mail, word processing,
    spreadsheets, databases, etc. Workstations don''t need to offer services like
    TELNET, FTP, HTTP, etc. These services should be shut down or removed altogether.


    2. Server: No X-windows, running network services as NFS, Samba, HTTP, FTP, SMTP,
    DNS, shell accounts, firewalls, etc.


    Servers should be configured to run as few services as possible. This will offer
    the administrator better security, fault tolerance, and the ability to scale performance
    to the services you need. However, the additional hardware and administrative
    cost must be considered.


    ## Step 1.1 Define security policies


    This step is intended more for security professionals and corporate Information
    Technology managers, but it will be useful to private users concerned about security
    well. Corporate and government organizations need to develop, document, and enforce
    a policy. The policy should be applied to both internal and external users. Users
    should learn about the policy through written communication. The main reason for
    a well-documented policy is that when security breach or misuse occur, you have
    binding legal documents. Without policies and corresponding documentation, enforcement
    of the policy may be challenged.

