- md: "\n# STEP 2\nInstall Linux\n\nNext, edit /etc/logrotate.conf to modify the log\
    \ rotation behavior to meet your needs. In the following example, logrotate will\
    \ rotate logs weekly, keep the last four weeks of logs before it deletes, compress\
    \ the rotated logs, and not rotate the utmp and wtmp files:\n\n```\n# see \"man\
    \ logrotate\" for details\n# rotate log files weekly\nweekly\n# keep 4 weeks worth\
    \ of backlogs\nrotate 4\n```\n\n```\n# send errors to root\nerrors root\n# create\
    \ new (empty) log files after rotating old ones\ncreate\n```\n\n```\n# uncomment\
    \ this if you want your log files compressed\ncompress\n```\n\n```\n# RPM packages\
    \ drop log rotation information into this directory\ninclude /etc/logrotate.d\n\
    ```\n\n```\n# ## no packages own lastlog or wtmp -- we'll rotate them here\n#/var/log/wtmp\
    \ {\n# compress\n# monthly\n# rotate 1\n}\n```\n\n```\n#/var/log/lastlog {\n#\
    \ compress\n# monthly\n# rotate 1\n}\n```\n\nOnce these changes are done, they\
    \ will be automatically executed from the crontab file /etc/cron.daily/logrotate\
    \ once a day (the default setting of Red Hat 6.0).\n\n# STEP 2\nInstall Linux\n\
    \n### Step 2.8.4. Configure remote logging\n\nIn an organization of any significant\
    \ size, using a centralized logging host has a lot of benefits. From a security\
    \ point of view, remote logging is important because one of the first things that\
    \ an attacker will do after gaining access to a machine is erase or modify the\
    \ system logs to cover his tracks. If copies of log messages are stored on another,\
    \ highly secured system, administrators may still be able to reconstruct what\
    \ happened. If the logs are lost, important forensic evidence from the breach\
    \ is lost with them.\n\nTo send syslog messages to a central logging host, edit\
    \ /etc/syslog.conf and add lines for the facilities and logging levels dictated\
    \ by the security policy of your organization. For example, to send all warning\
    \ and error messages, and all authentication facility to the central (logging\
    \ host), add the following:\n\n```\n*warn.*;*.err @loghost\nauthpriv.*;.auth.*\
    \ @loghost\n```\n\n### Step 2.8.5. Synchronize system clock with log server\n\n\
    Hardware clocks in PC-class computers are notoriously inaccurate. When many workstations\
    \ are feeding log messages to a central server, it is important that their clocks\
    \ are synchronized, so that the stamps on the log messages are accurate. In the\
    \ event of a network-wide scan or attack, synchronized log file times will make\
    \ it easier to build a timeline of the attack. The Network Time Protocol was developed\
    \ to accurately synchronize the system clock of a network of computers. An easy\
    \ way to set the system clock once is to set up a cron job to run ntpdate once\
    \ an hour. Put the following commands into the file /etc/cron.hourly/set-ntp:\n\
    \n```\n/usr/bin/ntpdate -bu -t 3 loghost.example.org\nsbin/hwclock --systohc\n\
    ```\n\nThe \"b\" option sets the time now, rather than staggering, \"u\" says\
    \ to use an unprivileged port, and \"t 3\" set the time to 3 seconds, rather than\
    \ the default 1. The second line sets the hardware CMOS value to the current system\
    \ time. Once the file has been saved, set the permissions:\n\n```\n[root]# chmod\
    \ 700 /etc/cron.hourly/set-ntp\n```\n\nOf course, this assumes that loghost.example.org\
    \ is running the ntpd daemon. The ntp3 RPM package includes extensive documentation\
    \ in HTML format for the /usr/doc/ntp3* directory. Also see http://www.ecis.udel.edu/~ntp/\
    \ for the latest information about NTP and a list of primary and secondary servers.\n\
    \n# STEP 3\nSecuring Workstation Network Configurations\n\nSecuring workstations\
    \ is primarily a process of eliminating network services, and severely limiting\
    \ access to the remainder. A typical workstation operates on the client end of\
    \ server-network communications. There is almost never a need to provide a service.\
    \ On the remote that a service is needed on a workstation, it should be offered\
    \ only to a small group of other workstations or servers on the local area network.\
    \ In Step 3, we concentrate on removing services, then offer some advice on how\
    \ to increase the security of selected services if they are absolutely necessary\
    \ for the operation of the workstation.\n\n# STEP 3.1 DISABLE INTERNET DAEMON\
    \ SERVICES\n\nThe Internet daemon, inetd, controls access to network services\
    \ that do not start up when needed, such as telnet and ftp. A typical workstation\
    \ has no need to provide the services in the daemon configuration file, /etc/inetd.conf.\
    \ If you need to access the workstation remotely over the network, consider installing\
    \ Secure Shell (SSH; see Step 4.2 below). See the manual page inetd.conf(8) for\
    \ a complete description of the format in /etc/inetd.conf.\n\n- * Step 3.1. Edit\
    \ /etc/inetd.conf and comment out all services\n\nSee Appendix B for a copy of\
    \ the /etc/inetd.conf installed with Red Hat Version 6.0. The services that are\
    \ open those that do not have a hash symbol \"#\" in column 1. Edit these lines\
    \ and comment them out by putting the comment character, \"#\", in the first column.\
    \ Save the edited file and make the inetd process reload the configuration file\
    \ by sending in the HUP signal:\n\n```\n[root]# killall -HUP inetd\n```\n\nIf\
    \ you don't comment out other services, make at least that shell and login services\
    \ are disabled. The Berkeley \"r\" programs rsh and login have a long history\
    \ of abuse and security problems. Even with the services disabled, you should\
    \ check to make sure that no user has a .hosts file in his home directory and\
    \ there is no /etc/hosts.equiv file. These are the files that the \"r\" programs\
    \ use to assign \"trust\" to users on other computers. The following short script\
    \ will check every home directory and tell you one has .hosts files in.\n\n```\n\
    for i in sh\n  [ cut -d: -f6 /etc/passwd]; do\n    if [ -e $i/.hosts ]; then\n\
    \      echo \"SECURITY CHECK found .hosts in $i\"\n    fi\ndone\n```\n\n### Step\
    \ 3.1.2. Turn off inetd if there are no services\n\nIf the services in /etc/inetd.conf\
    \ are needed at all, the inetd process itself can be turned off:\n\n```\n[root]#\
    \ /etc/rc.d/init.d/inetd stop\n[root]# /sbin/chkconfig inet off\n```\n\nAdministrators\
    \ for distributions that do not have chkconfig can simply remove the init scripts\
    \ directly:\n\n```\n[root]# /bin/rm /etc/rc.d/rc[345].*inetd\n```\n\nIf for some\
    \ reason, one of the services controlled by inetd is needed later, it can be turned\
    \ on temporarily by running the SYSV init script:\n\n```\n[root]# /etc/rc.d/init.d/inetd\
    \ start\n```\n\n# STEP 3.2 USE TCP WRAPPERS TO CONTROL ACCESS TO REMAINING INETD\
    \ SERVICES\n\nIf you absolutely have one or more of the services in /etc/inetd.conf,\
    \ use TCP wrappers to restrict access to a limited number of hosts. The TCP wrapper\
    \ daemon, /usr/sbin/tcpd, is a small program that checks the source address of\
    \ the request against access lists in /etc/hosts.allow and /etc/hosts.deny. If\
    \ the lists say the request is allowed, the wrapper passes the connection to the\
    \ appropriate service. Wrappers are installed by default by Red Hat and other\
    \ Linux distributions. See the manual page hosts_access(5).\n\n### Step 3.2.1.\
    \ Set the default access rule to deny all\n\nEdit /etc/hosts.deny so that the\
    \ only uncommented lines read:\n\n```\nALL: ALL\n```\n\nThe second line is necessary\
    \ only if you have Network Information System (NIS) ypserv package.\n\n### Step\
    \ 3.2.2. Allow access to only specific hosts for specific services\n\nFor example,\
    \ to allow ftp access from host.example.org, edit /etc/hosts.allow and add the\
    \ line:\n\n```\nin.ftptd: host.example.org\n```\n\nAfter entering the control\
    \ statement in /etc/hosts.allow, edit /etc/inetd.conf and remove the comment character\
    \ from the line for the ftp service:\n\n```\nftp stream tcp nowait root /usr/sbin/tcpd\
    \ in.ftptd -a\n# killall -HUP inetd\n```\n\nWhenever possible, avoid allowing\
    \ access to entire domains or subnets, e.g. \"example.org\" or \"192.168.1.0\"\
    . Use only the specific hostnames or IP addresses of the machines that are allowed.\n\
    \n### Step 3.2.3. Check the syntax of the access lists with tcpchk\n\nThe TCP\
    \ wrapper includes a simple program for checking the syntax of /etc/inetd.conf,\
    \ /etc/hosts.allow and /etc/hosts.deny files to make sure there are no errors\
    \ and that the files are consistent. Assuming /etc/hosts.allow and /etc/hosts.deny\
    \ appear as you do, here is a sample run of tcpchk:\n\n```\n[root]# tcpchk -v\n\
    Using network configuration file: /etc/inetd.conf\n```\n\n```\n>> Rule       \
    \  /etc/hosts.allow line 6:\ndaemons:        in.ftptd\nclients:       host.example.org\n\
