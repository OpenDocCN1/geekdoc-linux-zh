    ## 步骤 1.3.3. 设置 BIOS 密码


    设置 BIOS 密码以确保恶意用户无法更改系统的 CMOS 设置。使用包含大写字母、小写字母和数字的密码。选择强密码的建议请参见下文步骤 2.5。互联网上有很多
    BIOS 破解程序，因此不要在 BIOS 设置中使用相同的密码来保护 LILO（步骤 2.6.3）或 Linux 操作系统中的 root 或用户账户（步骤
    2.5.2）。


    ## 步骤 1.3.4. SCSI BIOS 设置


    某些 SCSI 控制器拥有自己的 BIOS。例如，Adaptec 控制器使用 Control-A 键盘序列进入 SCSI BIOS 提示。请确保你已禁用了从
    CD-ROM 等其他介质启动的能力。对于 Adaptec SCSI BIOS 的最新版本，目前没有办法对 SCSI BIOS 设置进行密码保护。因此，如果用户可以重启电脑、进入
    SCSI BIOS 并启用 CD-ROM 启动，唯一阻止其进入你系统的办法就是锁定的 CD-ROM 物理机匣。


    ## 步骤 1.3.5. 记录 BIOS 设置


    记录硬件和软件支持所需的 BIOS 设置。在发生故障或管理员缺席的情况下，硬件驱动器几何结构、任何非默认系统设置等的文档将记录该系统的初始设置。将此文档与其他硬件手册一起存放在安全的地方。


    一旦明确了你的需求并记录了安全策略，就是安装 Linux 操作系统系统的时候了。Linux 提供了多种发行版可供选择，每种发行版都有特定的优缺点。虽然这超出了本文的范围，但我们强烈建议你仔细考虑所选择的
    Linux 发行版，因为这将影响未来的管理和易用性。对于本指南，我们主要选择 Red Hat 6.0，是因为由于 Red Hat 的市场份额以及我们尽可能覆盖更多用户的目标。如果你打算使用其他发行版或更早版本的
    Red Hat，你应该意识到系统管理和安全相关配置的差异。例如，旧版本的 Red Hat 默认不使用密码，系统文件可能位于不同的目录，Slackware 不使用
    SYSV init 启动等。无论你选择哪种发行版，都应升级到最新版本，以获得更好的安全性、功能和性能的所有优势。


    ## 步骤 2 安装 Linux


    ### 步骤 2.1 断开机器的网络连接


    大多数 Linux 发行版在安装期间都会启动网络接口，尽管此时系统的安全防护非常有限。鉴于此，最佳的安全实践是在开始安装之前断开网卡。如果你是从网络服务器安装，请确保在安装运行期间你使用的网络是安全的。如果你是从互联网上的公共
    FTP 站点安装，请务必小心，因为你的系统可能在你意识到之前就被攻破解了。


    ## 步骤 2.2 选择安装类型：工作站、服务器或自定义


    Red Hat 安装程序允许从这三个选项中选择其一。“工作站（Workstation）”和“服务器（Server）”选择根据硬盘总大小的百分比对系统硬盘进行自动分区。此外，这两个设置会安装许多你或你的用户可能永远不会使用的软件包包。使用“自定义（Custom）”安装选项可以对安装过程获得最大的控制权，无论你是在设置工作站还是服务器。


    ## 步骤 2.3 定义分区


    分区是 UNIX 管理员之间一个相当具有宗教色彩的辩题。为什么呢？理论认为，系统拥有的分区越多，可靠性就越高。例如，如果某个分区损坏或拒绝服务攻击由于分区日志消息而失败，问题将仅隔离在该特定分区中。


    人们通常认为 Linux 工作站只需要三个分区：根分区 `/`；家分区 `/home`；以及用于虚拟内存的交换分区（swap）。服务器的分区取决于服务的类型。确定交换分区大小的通用规则是分配物理内存的两倍。……（此处省略重复内容，保持翻译逻辑）如果你打算使用其他发行版或更早版本的
    Red Hat，你应该意识到系统管理和安全相关配置的差异。例如，旧版本的 Red Hat 默认不使用密码，系统文件可能位于不同的目录，Slackware 不使用
    SYSV init 启动等。无论你选择哪种发行版，都应升级到最新版本，以获得更好的安全性、功能和性能的所有优势。


