  - '[PAGE 12]


    # STEP 1

    Before Installation


    # STEP 1.2 PHYSALLY SECURE THE COMPUTER


    Depending on your security needs, you may have to physically secure the box. Physical
    security for home users isn''t much of an issue, but if you are an ISP that co-locates
    hardware at another facility, you should think about locking the server(s) up.


    +   * If possible, the server in a well-ventilated and locked room. Who knows
    the key to that room.


    +   * Use computer cases that have drive bays and keyboards that can be locked.
    This ensures that people can''t insert floppies and CDs or try to hack away at
    the console''s keyboard.


    # STEP 1.3 BIOS SECURITY: PASSWORD PROTECTION, LIMITING REBOOTS


    Most modern computer BIOSes allow the restriction of booting devices and password
    protection for BIOS settings. Different systems use different keystrokes to enter
    into the BIOS setup but the common ones are "Del" key for AMI BIOS, "Ctrl + Esc"
    for Phoenix BIOS, and the "F10" key for Compaq BIOS.


    # Step 1.3.1. Disable "AUTO" settings


    Disable the "AUTO" BIOS settings for like hard disks, PnP IRQ settings, IDE hard
    drives configured for "AUTO" configuration can be recognized incorrectly by Linux.
    System administrators may see file system from incorrect BIOS AUTO settings and
    try to fix the issues with e2fsck. This can result in a corrupt file system simply
    because the IDE "AUTO" setting changed the hard translation from the Logical Block
    Addressing (LBA) mode to the "LARGE" sector layout. Usually configuring the hard
    drive parameters and other settings ensures that your machine is more reliable
    and faster boots.


    # Step 1.3.2. Disable booting from removable media


    Enable booting only from the primary hard drive (C). Do not allow booting from
    floppy, ZIP, CD-ROM, or any other form of removable media. For medium- and high-security
    needs, you may want to remove the floppy drive entirely. It should also be noted
    that BIOS allow the floppy drive to be set to READ ONLY, although this will not
    in and of itself prevent booting the system from a floppy.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_12_0.png)'
- md: '

    ## Step 1.3.3. Set a BIOS password


    Set a BIOS password to ensure that a rogue user cannot change the system''s CMOS
    settings. Use a password with both upper and lower case letters and numbers. See
    Step 2.5 below for suggestions on selecting strong passwords. There are BIOS cracking
    programs available on the Internet so not use the same password for the BIOS setup
    to protect LILO (Step 2.6.3) or the root or other user accounts (Step 2.5.2) in
    the Linux operating system.


    ## Step 1.3.4. SCSI BIOS setups


    Some SCSI controllers have their own BIOS. For example, Adaptec controllers use
    the Control-A keyboard sequence to enter the SCSI BIOS prompt. Be sure that you
    disable the ability to boot off other media such as CD-ROMs. As of the latest
    version of Adaptec''s SCSI BIOS, there is no way to password protect the SCSI
    BIOS setup. So if a user can reboot the computer, go into the SCSI BIOS, and enable
    CD-ROM booting. The only thing keeping out of your system is a locked CD-ROM cage.


    ## Step 1.3.5. Document BIOS settings


    Document the BIOS settings for hardware and software support. In the case of a
    failure or the administrator is absent, documentation of the hardware drive geometry,
    any non-default system settings, etc., will record the initial settings for this
    system. Place this documentation along with other hardware manuals in a secure
    place.


    Once your needs are understood and the security policy documented, it''s time
    to install the Linux operating system. Linux offers a wide array of distributions
    to choose from and each has its specific pros and cons. Though it is beyond the
    scope of this document, we highly recommend you give your choice of Linux distribution
    thought as it will impact future administration and ease of use. For this guide,
    we chose Red Hat 6.0 primarily because of Red Hat''s market share and our goal
    to cover as many users as possible. If you are going to use another distribution
    or an earlier version of Red Hat, you should be aware of the differences in system
    administration and security-related configuration. For example, older versions
    of Red Hat do not use passwords by default, system files may be in different directories,
    Slackware does not use the SYSV init startup, etc. Whichever distribution you
    choose, upgrade to the latest version to get all the benefits of better security,
    functionality, and performance.


    ## STEP 2 Install Linux


    ### STEP 2.1 DISCONNECT THE MACHINE FROM THE NETWORK


    Most Linux distributions bring up their network interfaces during installation
    even though there is minimal system security in place. In light of this, the best
    security practice is to disconnect the network card before starting the installation.
    If you are installing from a network server, make sure that the network you are
    using is secure while the installation is running. If you are installing from
    a public FTP site on the Internet, be careful, since your system might be compromised
    before you realize it.


    ## STEP 2.2 SELECT INSTALLATION CLASS: WORKSTATION, SERVER, OR CUSTOM


    The Red Hat installation program allows for selecting from one of these three
    choices. The “Workstation” and “Server” selections do automatic partitioning of
    the system’s hard disks based upon percentages of the overall hard disk size.
    In addition, these two settings install many software packages that will probably
    never be used by you or your users. Use the “Custom” installation option for maximum
    control over the installation process, regardless of whether you are setting up
    a workstation or a server.


    ## STEP 2.3 DEFINE PARTITIONS


    Partitioning is a fairly religious debate among UNIX administrators. Why? The
    theory is that the more partitions a system has, the more reliable it will be.
    For example, if a partition becomes corrupt or a de service attack fails with
    a partition log messages, the problem is isolated to only that partition.


    It is generally agreed that Linux Workstations only need three partitions: the
    root partition, "/"; the partition, "/home"; and a swap partition for virtual
    memory. Partition schemes for servers depend on the type of service. The general
    rule for determining the size of a swap partition is to allocate twice the amount
    of physical memory. For example, a computer with 64 MB of RAM would allocate at
    least 128 MB of swap space. With limited RAM should allocate relatively more swap
    space, systems with a large amount of RAM should allocate less. A system with
    1GB of RAM doesn''t need 2GB of swap. A system with 32 MB of RAM should be upgraded
    with more memory first. Today''s prices for physical memory, adding RAM is the
    most cost-effective upgrade for your system. Administrators of Linux machines
    running the older 2.0 version of the kernel should know that this version allows
    for only 128 MB swap partitions. For more swap, multiple partitions are required.
    The latest releases of Linux distributions, including Red Hat 6.0, use the newer
    2.2 version of the kernel, which does not have this restriction.


    ### Step 2.3.1 Workstation partitions


    Typical workstation installations with the X-Window system, window managers, developers
    tools (if necessary), home applications (if necessary). Web browsers, and core
    system utilities can consume up to 700-800 MB of disk space. A minimum root partition
    of 1 GB will leave room for log systems, email messages, and other housekeeping
    data. Consider even more space for the root partition if the space for the user''s
    (/home) partition is not great. For workstations that will make extensive use
    of logging, consider a separate, relatively large partition for /var.


    As an example: a mid-range PC with 64 MB of RAM and a 4 GB hard drive could be
    partitioned like so:


    | Partition | Size |

    | :--- | :--- |

    | / | 1800 MB |

    | swap | 200 MB |

    | /home | 2000 MB |


    Note that if your is going to "dual-boot" Linux and another operating system,
    the Linux root partition needs to be within the first 1024 cylinders of the boot
    disk. This is because LILO, the Linux Loader, is limited to the BIOS to access
    the disk and the BIOS cannot read past 1024 cylinders. See the Installation HOWTO
    cited in Appendix A for more information. Of course, your mileage may vary but
    give this topic serious thought.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_15_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_15_1.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_15_2.png)


    ### Step 2.3.2 Define Server partitions


    Disk partitioning for servers is a very different animal. In general, all servers
    benefit from a, relatively large partition for /var. for logging, configuration,
    and temporary space. Additional factors that need to be considered for the purpose
    of the server:


    - NNTP: News servers require large amounts of spool space, so a majority of disk
    space should be reserved for NNTP use only. Even better, the news pools on its
    own drive(s) for increased performance. Red Hat puts NNTP spool files in /var/spool/news.


    - HTTP: Web servers require disk space for the site''s Web pages as well as users''
    Web pages (if allowed). Web servers require plenty of space for HTTP log files
    which consume a bit of space depending on how logging is configured, how long
    the logs are retained, Red Hat puts the main Web pages in /home/httpd and typically,
    individual user Web pages goes in the user''s home directory under /home in the
    public_html directory. Red Hat puts HTTP log files in /var/log/httpd.


    - FTP: FTP servers can require anything from marginal disk space to large disk
    space depending on how they are used. Note that if you are going to allow FTP
    services, there should be enough space, or even a dedicated disk, for large sets
    of files to be uploaded. The main FTP directory for Red Hat is located in /home/ftp
    though users can "cd" into their home directory to get or put files. Red Hat puts
    log files in /var/log/xferlog.


    - NFS/Samba: File servers typically require a lot of disk space unless the data
    is mounted on CDROM changes, other external jukeboxes or RAID disks. These systems
    should be able to scale with the needs of the users. Samba typically uses the
    user''s home directory in /home/* to put and get files NFS can be configured many
    different ways.


    - E-mail: Mail servers require large amounts of spool space for storing incoming
    and outgoing messages, file attachments, etc. Red Hat puts incoming mail in /var/spool/mail
    in files uniquely named for each mail user account. Outgoing mail is stored in
    /var/spool/mqueue.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_16_0.png)

