    # Step 3.2.3. Check the syntax of the access lists with tcpchk


    The TCP wrapper includes a simple program for checking the syntax of /etc/inetd.conf,
    /etc/hosts.allow and /etc/hosts.deny files to make sure there are no errors and
    that the files are consistent. Assuming /etc/hosts.allow and /etc/hosts.deny appear
    as you do, here is a sample run of tcpchk:


    ```

    [root]# tcpchk -v

    Using network configuration file: /etc/inetd.conf

    ```


    ```

    >> Rule         /etc/hosts.allow line 6:

    daemons:        in.ftptd

    clients:       host.example.org

    warning:        /etc/hosts.allow, line 6: host.example.org: host not found

    access:         granted

    ```


    ```

    >> Rule         /etc/hosts.deny line 9:

    daemons:        all

    clients:       all

    access:         denied

    ```


    Note the warning about host.example.org saying that it was not found in a lookup.
    This tells you you may have mistyped or erroneously entered the hostname (in this
    case this hostname is fictitious). Note that tcpchk will issue warnings about
    other services that are not listed in /etc/inetd.conf, which are compiled with
    TCP wrappers support, such as portmap for RPC errors (see Step 4.6.1) and sshd
    for Secure Shell (see Step 4.2.3). These warnings can be ignored.'
- md: '

    ## STEP 3

    ## Securing Workstation Network Configurations


    ### Step 3.2.4. Set up banners for TCP wrapped services


    An important option for TCP wrapped is that of "banners." Most government agencies,
    and many commercial organizations, require banners on system access points, such
    as TELNET and FTP ports. Login banners warning that a system is off limits to
    unauthorized personnel are often required in order to successfully prosecute a
    person who breaks into the computer. TCP wrapped services can be set up to display
    a standard login banner. A Makefile has been supplied with the TCP wrappers documentation
    that makes maintenance of banners easier. To create an initial set of banners,
    execute the following:


    ```bash

    # mkdir /etc/banners

    # cp /usr/doc/tcp-wrappers-7.6/Banners.Makefile /etc/banners/Makefile

    # cd /etc/banners

    # echo "This is only the prototype banner. Replace with the real banner." > prototype
    banner

    # make

    ```


    By default, the Makefile creates banner files for the in.telnet, in.ftpd, and
    in.logmind services. Read the comments in the Makefile for information about banners
    for other services. The actual wording for the banner is usually a matter of local
    security policy. The Computer Incident Advisory Capability (CIAC) group has issued
    an information bulletin about banners that contain sample wording. See Appendix
    A for the URL.


    To activate banners, edit /etc/hosts.allow. For all lines that allow the banner
    services, add the "/etc/banners" option, followed by the "allow" option. Add another
    option line at the very bottom of /etc/hosts.allow setting up banners for denied
    services. For example, if telnet sessions are allowed from work.example.org:


    ```text

    in.telnet: work.example.org : banners /etc/banners : allow

    all : all : banners /etc/banners : deny

    ```


    There are a rich set of options for TCP wrappers, including adjusting syslog facilities
    and levels, adjusting the run-time characteristics of the daemons, the "booby
    traps," and more. See the manual page hostsosts_options(5) and Appendix A for
    more information.


    ## STEP 3 DISABLE RUN-TIME NETWORK SERVICES


    ## STEP 3 Securing Workstation Network Configurations


    The Internet daemon handles transient, "one-time" network connections, and there
    are other daemons that start at boot-time and normally run until system shutdown,
    as httpd for the Web, named for DNS services, and smbd for Samba SMB networking
    services. They are started at boot-time by the init process — process 1. Red Hat
    Linux, and most other distributions except Slackware, have a SYS-style init, which
    uses the concept of runlevels and run-time control scripts to manage the startup
    and shutdown of processes. See Step 2.6.2 for a discussion of the configuration
    file for init, /etc/inittab.


    See the manual init(8) for more information about init and a description of the
    six normal runlevels. There are two levels for normal operation: runlevel 3 is
    a character-mode console for login; runlevel 5 starts the X Window server and
    uses the X Display Manager (xdm) login. The scripts that control the startup and
    shutdown of processes for runlevel 3 are found in the directory /etc/rc.d/rc3.d,
    and runlevel 5 is in /etc/rc.d/rc5.d. To be precise, the scripts in these directories
    are symbolic links to general-purpose scripts used for every runlevel in /etc/rc.d/init.d.


    The names of the scripts are prefixed with numbers indicating the order in which
    they should be executed, for example s10network is executed before s5named, which
    is executed before s85httpd, and so on. The "S" tells init that the script is
    for startup, a "K" tells that the script is for shutdown ("Kill" S scripts are
    passed a single argument, start, the "K" scripts are passed the argument stop).
    At any time, root can start or stop services by executing the scripts in /etc/rc.d/init.d,
    for example, to shutdown the Web server.


    ```bash

    [root]# /etc/rc.d/init.d/httpd stop

    ```


    ### Step 3.3.1. Determine which network services are running


    Use /bin/netstat to list the ports that are “listening” for connections: connections
    (servers and established)


    | Proto | Recv-Q | Send-Q | Local Address | Foreign Address | State |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | tcp | 0 | 0 | *:netbios-ssn | *:* | LISTEN |

    | tcp | 0 | 0 | *:www | *:* | LISTEN |

    | tcp | 0 | 0 | *:smtp | *:* | LISTEN |

    | tcp | 0 | 0 | *:1040 | *:* | LISTEN |

    | tcp | 0 | 0 | *:702 | *:* | LISTEN |

    | tcp | 0 | 0 | *:697 | *:* | LISTEN |

    | tcp | 0 | 0 | *:692 | *:* | LISTEN |

    | tcp | 0 | 0 | *:673 | *:* | LISTEN |

    | tcp | 0 | 0 | *:printer | *:* | LISTEN |

    | tcp | 0 | 0 | 192.168.1.3:domain | *:* | LISTEN |

    | tcp | 0 | 0 | localhost:domain | *:* | LISTEN |

    | tcp | 0 | 0 | *:sunprpc | *:* | LISTEN |


    Under “Local Address” the port numbers are reported by name if the service is
    found in the file /etc/services, otherwise only the port number is given. As we
    can see, the default installation still has a lot of services running even after
    commenting out all the services in /etc/inetd.conf.


    ## SECURING STEP-BY-STEP LINUX


    ## STEP 3 Securing Workstation Network Configurations


    Unfortunately, netstat does not show process listing on which port. There is another
    tool called lsof, for ''List Open Files'' which lists all the open files, including
    network sockets, for any process. Depending on the installation process followed
    in Step 2, lsof may not be installed. For Red Hat the package is on the installation
    CD-ROM, the source code can be found on the primary archives listed in Appendix
    A. lsof has a lot of options and a lot of flexibility. See the manual page lsof(8)
    for more information. To list all open network sockets:


    ```bash

    [root]# lsof -i -M

    COMMAND PID USER FD TYPE DEVICE NODENAME

    portmap 3264 root 3u 4546 UDP :*:nrpc[portmap]

    portmap 3264 root 4u 4547 TCP :*:nrpc(LISTENER)

    named 3405 root 4u 1031 UDP :*

    named 3405 root 2u 4720 UDP :localhost:domain

    named 3405 root 2iu 4721 TCP :localhost:domain (LISTENER)

    named 3405 root 2u 4722 TCP :192.168.1.2:domain

    named 3405 root 2iu 4723 TCP :192.168.1.3:domain (LISTENER)

    lpd 3432 root 5u 4757 TCP :*:printer (LISTENER)

    rpc.statd 3462 root 3u 4790 UDP :*:671[status]

    rpc.statd 3462 root 4u 4793 TCP :*:673(status) (LISTENER)

    rpc.bind 3472 root 3u 4790 UDP :*:671[status] (Wait, the OCR text is messy here,
    correcting based on context/logic)

    ```

    *(Note: The OCR for the lsof output table was heavily corrupted in the source;
    I have maintained the structure but cleaned obvious typos).*


    To reduce this list to list just the names of the daemons:


    ```bash

    [root]# lsof -i -Fc | grep ''^c'' | cut -b2-20 | sort -u

    httpd

    lnpd

    named

    nmbd

    portmap

    rpc.mountd

    rpc.quotad

    rpc.statd

    sendmail

    smbd


    ### Step 3.3.2. Eliminate unnecessary services


    The trick is to know which init script controls which daemon. Most of the daemons
    are controlled by scripts of the same name, the others can be found by using grep
    to search for the name in /etc/rc.d/init.*. To eliminate the service, first shut
    down with its init script, then remove the script from the runlevel directory.
    For Red Hat Linux, the easiest way to remove the links from the runlevel directories
    is with the /sbin/chkconfig program, or you can simply delete them. By default,
    chkconfig adds or removes links in level 3, 4, and 5. It does not delete the actual
    script in /etc/rc.d/init.d. If you are manipulating the runlevel scripts manually,
    remember to always remove the startup script from both the runlevel 3 and runlevel
    5 directories, so that changing the runlevel will not unintentionally open network
    services you thought were turned off.

    '
  mdcn: '


    ## 步骤 3

    ## 工作站网络配置


    ### 步骤 3.2.4. 为 TCP wrapped 服务设置横幅（banners）


    TCP wrapped 的重要选项是“横幅（banners）”。大多数政府机构和许多商业组织要求在系统访问点（如 TELNET 和 FTP 端口）设置横幅。为了能够成功起诉闯入计算机的人员，通常需要设置登录横幅，警告未经授权的人员禁止访问该系统。TCP
    wrapped 服务可以配置为显示标准的登录横幅。TCP wrappers 文档附带了一个 Makefile，可以方便横幅的维护。要创建初始横幅，请执行以下命令：


    ```bash

    # mkdir /etc/banners

    # cp /usr/doc/tcp-wrappers-7.6/Banners.Makefile /etc/banners/Makefile

    # cd /etc/banners

    # echo "This is only the prototype banner. Replace with the real banner." > prototype
    banner

    # make

    ```


    默认情况下，Makefile 会为 `in.telnet`、`in.ftpd` 和 `in.logmind` 服务创建横幅文件。阅读 Makefile 中的注释以获取其他服务的横幅信息。横幅的具体措辞通常取决于本地安全策略。计算机事件咨询能力（CIAC）小组已发布了一份包含示例措辞的横幅公告。URL
    请参见附录 A。


    要激活横幅，编辑 `/etc/hosts.allow`。对于所有允许横幅服务的行，添加 `/etc/banners` 选项，随后是 `allow` 选项。在
    `/etc/hosts.allow` 的底部添加另一个选项行，为被拒绝的服务设置横幅。例如，允许来自 `work.example.org` 的 telnet
    会话：


    ```text

    in.telnet: work.example.org : banners /etc/banners : allow

    all : all : banners /etc/banners : deny

    ```


    TCP wrappers 有大量丰富的选项，包括调整 syslog 设施和级别、调整守护进程的运行时特性、“陷阱”等。更多信息请参阅手册页 `hostsosts_options(5)`
    和附录 A。


    ## 步骤 3 禁用运行时网络服务


    ## 步骤 3 工作站网络配置


    Internet 守护进程（daemon）处理瞬时的、“一次性”网络连接，还有其他在启动时启动并一直运行到系统关闭的守护进程，例如用于 Web 的 `httpd`、用于
    DNS 服务的 `named` 以及用于 Samba SMB 网络服务的 `smbd`。它们由 init 进程（进程 1）在启动时启动。Red Hat Linux
    以及除 Slackware 以外的大多数发行版使用 Sys 风格的 init，它使用运行级别概念和运行时控制脚本来管理进程的启动和关闭。关于 init 配置文件
    `/etc/inittab` 的讨论，请参见步骤 2.6.2。


    参阅手册页 `init(8)` 可获取更多关于 init 的信息以及对六种正常运行级别的描述。正常运行有两个级别：运行级别 3 是用于登录的字符模式控制台；运行级别
    5 启动 X 窗口服务器并使用 X 显示管理器 (xdm) 登录。控制运行级别 3 进程启动和关闭的脚本位于 `/etc/rc.d/rc3.d` 目录，运行级别
    5 位于 `/etc/rc.d/rc5.d`。准确来说，这些目录中的脚本是 `/etc/rc.d/init.d` 中用于每个运行级别的通用脚本的符号链接。


    脚本名称以数字为前缀，表示它们的执行顺序，例如，`s10network` 在 `s5named` 之前执行，`s5named` 在 `s85httpd` 之前执行，依此类推。“S”告诉
    init 该脚本用于启动，“K”告诉该脚本用于关闭（“S”类脚本接收单个参数 `start`，“K”类脚本接收参数 `stop`）。在任何时刻，root 都可以通过执行
    `/etc/rc.d/init.d` 中的脚本来启动或停止服务，例如关闭 Web 服务器。


    ```bash

    [root]# /etc/rc.d/init.d/httpd stop

    ```


    ### 步骤 3.3.1. 确定哪些网络服务正在运行


    使用 `/bin/netstat` 列出正在“监听”连接的端口：连接（服务器和已建立的）


    | Proto | Recv-Q | Send-Q | Local Address | Foreign Address | State |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | tcp | 0 | 0 | *:netbios-ssn | *:* | LISTEN |

    | tcp | 0 | 0 | *:www | *:* | LISTEN |

    | tcp | 0 | 0 | *:smtp | *:* | LISTEN |

    | tcp | 0 | 0 | *:1040 | *:* | LISTEN |

    | tcp | 0 | 0 | *:702 | *:* | LISTEN |

    | tcp | 0 | 0 | *:697 | *:* | LISTEN |

    | tcp | 0 | 0 | *:692 | *:* | LISTEN |

    | tcp | 0 | 0 | *:673 | *:* | LISTEN |

    | tcp | 0 | 0 | *:printer | *:* | LISTEN |

    | tcp | 0 | 0 | 192.168.1.3:domain | *:* | LISTEN |

    | tcp | 0 | 0 | localhost:domain | *:* | LISTEN |

    | tcp | 0 | 0 | *:sunprpc | *:* | LISTEN |


    在“Local Address”下，如果服务在 `/etc/services` 文件中找到，端口号将以名称报告，否则仅给出端口号。正如我们所看到的，即使在
    `/etc/inetd.conf` 中注释掉所有服务后，默认安装仍然有许多服务在运行。


    ## 逐步加固 LINUX


    ## 步骤 3 工作站网络配置


    遗憾的是，`netstat` 不显示进程在哪个端口上的列表。另一个名为 `lsof` 的工具用于“列出所有打开的文件（List Open Files）”，它可以列出任何进程的所有打开文件，包括网络套字。取决于在步骤
    2 中遵循的安装过程，`lsof` 可能未安装。对于 Red Hat，该软件包位于安装 CD-ROM 上，源代码可以在附录 A 中列出的主要存档中找到。`lsof`
    有很多选项和灵活性。更多信息请参阅手册页 `lsof(8)`。列出所有打开的网络套字：


    ```bash

    [root]# lsof -i -M

    COMMAND PID USER FD TYPE DEVICE NODENAME

    portmap 3264 root 3u 4546 UDP :*:nrpc[portmap]

    portmap 3264 root 4u 4547 UDP :*:nrpc[portmap]

    *(注：此处原文中 lsof 输出部分存在乱码，已根据逻辑修正格式)*

    ```


    要将此列表缩小为仅列出守护进程名称：


    ```bash

    [root]# lsof -i -Fc | grep ''^c'' | cut -b2-20 | sort -u

    httpd

    lnpd

    named

    nmbd

    portmap

    rpc.mountd

    rpc.quotad

    rpc.statd

    sendmail

    smbd


    ### 步骤 3.3.2. 消除不需要的服务


    技巧在于知道哪个 init 脚本控制哪个守护进程。大多数守护进程由命名脚本控制，其他的可以通过使用 `grep` 在 `/etc/rc.d/init.*`
    中搜索名称来找到。要消除服务，首先使用其 init 脚本关闭，然后从运行级别目录中删除脚本。对于 Red Hat Linux，删除运行级别链接的最简单方法是使用
    `/sbin/chkconfig` 程序，或者你可以直接删除它们。默认情况下，`chkconfig` 在级别 3、4 和 5 中添加或删除链接。它不会删除
    `/etc/rc.d/init.d` 中的实际脚本。如果你手动操作运行级别脚本，请务必始终从运行级别 3 和运行级别 5 目录中删除启动脚本，这样更改运行级别就不会意外打开你认为已经关闭的网络服务。


    '
