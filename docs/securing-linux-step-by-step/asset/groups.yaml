    # STEP 5 Tuning and Packet Firewalls


    # Step 5.3.3.3. Test the firewall ruleset


    While at the console of the Linux server, try various network applications like
    TELNET, FTP, SSH, etc. to computers on the Internet and the internal LAN. If that
    tests well, try a similar set of tests on one of the computers. If, for any reason,
    the machines dont respond properly, check the /var/log/messages file or on the
    console, watch VTY7 for firewall hits.


    # Step 5.3.4. Analyze a typical IPCHAINS firewall ruleset


    So you are starting to see IPCHAINS in /var/log/messages. Realistically, this
    is happening either because your firewall ruleset is too restrictive for your
    environment or it is working properly and blocking unwanted traffic. For example,
    once the firewall ruleset is installed, DHCP no longer works. Here is the Resulting
    IPCHAINS firewall log:


    ```

    Aug 8 21:00:32 testpc kernel: Packet log: output REJECT eth0=17

    192.168.0.14:68 192.168.0.1:67 L=604 S=0x00 I=41786 F=0x000 T=64

    ```


    There is a LOT of information in this line let''s break it down by section. Refer
    back to the logged hit as you read.


    +   - This firewall hit occurred on Aug 8 9:00:32pm on the "testpc"

    - The ruleset hit on the "output" side of the firewall (other hits can be "input"
    or "forward")n- The hit was then "REJECTED" (others can say "DENY" or "ACCEPT")

    - The hit was on the "eth0" interface

    - This occurred over the "PROTO=17" protocol or UDP (other common protocol numbers
    are "1" for ICMP and "6" for TCP). A full list of other protocols can be found
    in /etc/protocols

    - The source hit came from IP address 192.168.0.14 on port 67, which is for DHCP
    client (a list of port numbers can be found in /etc/services)

    - The destination address was IP 192.168.0.1 to port 68 which is DHCP Server

    - The packet''s length was 604 bytes

    - This packet did not have any "Type of Service" (TOS) (don''t worry about TOS,
    it''s a low-level network flag denoting how the packet should be passed through
    the network, a value of 0 is normal)

    - The packet''s "IP ID" number was 41786 (again, don''t worry about IP ID, it''s
    to reassemble fragmented packets)

    - The packet was not fragmented'
