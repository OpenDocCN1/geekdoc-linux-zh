    ## 步骤 6 工具


    要从命令行检查 `/var/log/messages`，请执行：


    ```bash

    [root]# swatch -c testrc -f /var/log/messages

    *** swatch-2.2.2 (pid:323381) started at Fri Jul 25 15:12:08 1999

    Jul 25 10:32:42 localhost sshd[16508]: refused connection from 192.168.1.1

    Jul 25 10:33:31 localhost sshd[16530]: log: Rsa authentication refused for bad
    modes for /root/.ssh/authorized_keys

    Jul 25 20:11:22 localhost sshd[2312]: error: Fwd X11 connection from 127.0.0.1
    refused by tcp_wrappers.

    ```


    在 Red Hat 下，控制文件的起点是 `/usr/doc/swatch-2.2/config_files/swatchrc.personal`。它由一组用于生成操作的正则表达式列表组成，随后是一组要忽略的正则表达式列表，最后的操作是默认回显所有其他内容。通过添加操作和忽略项并反复遍历
    `/var/log/messages`，可以对该文件进行调优，直到获得可以管理的结果为止。


    Swatch 可以配置为单次通过单个日志文件运行，也可以作为守护进程运行，持续监控新记录的日志消息。它可以被配置为使用不同的控制文件来监控邮件日志、防火墙日志、Samba
    日志等。更多信息请参阅 `swatch(8)` 的手册页。


    ### 步骤 6.1.2. Psionic Logcheck


    在许多日志文件监控器中的另一个是来自 Psionic Software Systems 的 Logcheck。请参阅附录 A 获取 Psionic Logcheck
    主页以及 MetaLab 站点中其他日志监控器的 URL。


    Logcheck 带有完善的文档。在安装和运行它之前，请彻底阅读 `INSTALL` 文件。安装非常简单。解压压缩文件后，在源目录下执行 `make linux`
    以将 Linux 特定的配置文件和脚本复制到 `/usr/local/etc/`。


    Logcheck 生成的报告包含三个部分：系统攻击、安全违规和异常系统事件。系统攻击警告是由匹配 `logcheck.hacking` 中任何模式的 syslog
    日目生成的；安全违规由 `logcheck.violations` 中的模式生成；而异常事件则由任何不匹配 `logcheck.ignore` 中模式的行生成。阅读
    `logcheck.sh` 中的注释以获取有关这些配置文件的更详细描述。


    在使用 swatch 时，管理员需要耐心和坚持，以剔除那些未指示真实事件的记录，并将模式添加到 `logcheck.ignore` 中。起初，可能会有很多虚假警报。调查每个报告的实例，以确定所报告的事件是否需要关注。如果不需要，可以将匹配该事件的模式放入
    `logcheck.ignore` 中，这样你就不会再看到它了。最好的方法是让模式尽可能具体，这样事件的异常变体就会被报告出来。


    ### 步骤 6.1.3. Tripwire


    Tripwire 最初由普渡大学（University of Purdue Academic）的 Gene Kim 和 Gene Pfaff 开发。Tripwire
    背后的理念是：为了成功入侵系统，必须更改、添加或删除文件，以放置后门、木马和利用脚本。Tripwire 为重要的系统二进制文件和配置文件生成加密签名数据库，并记录这些文件中任何随时间推移的变化。


    请参阅附录 A 获取 Tripwire 1.3 版本和 2.0 版本源码的 URL。但必须注意的是，Tripwire 2.0 不支持 Red Hat 6.0，仅支持之前的版本。截至编写时，只有
    Release 1.3.1 适用于 Red Hat 6.0。阅读每个版本附带的文档获取有关编译、安装和维护 Tripwire 的信息。


    #### 步骤 6.1.3.1. Tripwire 数据库


    在 Tripwire 之前，测试系统文件完整性的唯一方法是检查 CRC 校验和。遗憾的是，CRC 位校验和很容易被伪造。Tripwire 构建了一个加密校验和数据库（如
    MD5），这些校验和几乎无法伪造，并定期进行检查。如果校验和失败，则强有力地表明相关文件已被修改。


    Tripwire 最大的弱点是，如果攻击者能够获得机器的权限，他可能会修改或重建 Tripwire 数据库以掩盖他的入侵。针对此唯一的防御方法是将数据库放在只读介质上，例如写保护的软盘或
    CD。版本 2 中最重要的创新之一是对数据库和配置文件进行加密签名，这消除了对将 Tripwire 数据库放在只读介质上的需求。希望在发布此版本时已经支持了
    Red Hat 6.0。


    #### 步骤 6.1.3.2. 运行 Tripwire


    第一次运行 Tripwire 时，它会为配置文件列出的文件和目录构建一个校验和和其他信息（UID、GID、模式、大小等）的数据库。之后每次运行时，它会将数据库中的信息与系统的当前状态进行比较。然后当通过命令行进行交互式运行时，它会提供更新每个更改文件的数据库的选项。因此，如果
    `/etc/group` 发生了变化且你是你更改它的，你可以更新数据库，这样在下次发生变化（可能由攻击者引起）之前，你不会收到通知。


    #### 步骤 6.1.3.3. 使用 rpm 验证包文件


    Red Hat 软件包管理器 (rpm) 在安装包时构建的数据库包含了 MD5 校验和、UID、GID、模式、大小等。你可以使用 rpm 将数据库内容与磁盘上文件的当前状态进行验证，并报告任何不同的文件。这与
    Tripwire 方法不同，因为使用 rpm 无法测试安装以来的变化，无法在管理员知情和批准的情况下更新数据库条目。


    要验证所有包文件，请运行：


    ```bash

    [root]# rpm -Va

    S.5....TC /etc/exports

    S.5....TC /etc/hosts.allow

    S.5....TC /etc/hosts.deny

    M....UG /mnt/cdrom

    ```


    `/etc` 中文件的条目告诉你 MD5 校验和和修改时间已更改；对于 `/mnt/cdrom`，模式、用户和组组发生了变化。


    ### 步骤 6.1.4. Psionic PortSentry


    有多种工具可以检测端口扫描，而 Psionic PortSentry 增加了一个意料之外的转折：当检测到扫描时，它可以立即采取行动，阻止扫描主机对机器的任何进一步访问。它与
    Psionic Logcheck（步骤 6.1.2）结合良好。请参阅附录 A 获取其主页的 URL。


    PortSentry 带有完善的文档。在编译和安装之前，请彻底阅读 `README.install`、`README.methods` 和 `README.qa`。PortSentry
    无需任何更改即可“开箱即用”编译。程序和配置文件默认安装在 `/usr/local/psionic/portsentry`。


    PortSentry 不仅可以检测简单的 TCP 连接类型扫描，还可以检测许多类型的隐身扫描，例如 SYN/半开、FIN 和 NULL 扫描。


    在运行 PortSentry 之前，请检查 `portsentry.conf`。所有条目在配置文件和 `README.install` 中都有说明。针对扫描主机唯一的操作是在
    `/etc/hosts.deny` 的末尾添加：


    ```

    ALL: <attacker-IP>

    ```


    由于你在 `/etc/hosts.deny` 的末尾已经有了 "ALL: ALL"，因此这样做是无效的。事实上，如果在 `/etc/hosts.allow`
    中允许了攻击主机访问任何服务，那么这种方法完全无效无效，因为 TCP wrappers 在读取 `/etc/hosts.deny` 之前会先读取 `/etc/hosts.allow`。


    '
