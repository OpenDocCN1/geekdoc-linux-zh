    # APPENDIX E Script to modify default permissions of system binaries


    The default file permissions on most Linux distributions give away too much information
    to the user, or allow ordinary users to perform actions they have no business
    doing. The settings may be paranoid but it''s better to be safe than sorry.


    NOTE: most of these permissions will work for a common installation but some files
    won''t exist depending on what packages were created and weren''t installed. Run
    this script everytime you reinstall Linux, or install updated packages.


    ```bash

    #!/bin/sh


    # Author: David A. Ranch

    # Based on the TrinityOS file permissions corrections


    MODE="o-rwx"


    # Files in /bin

    cd /bin

    chmod $MODE linuxconf mt setserial umount


    ```


    ```bash

    # Files in /sbin

    cd /sbin

    chmod $MODE badblocks ctrlldet chkconfig debugfs depmod dump

    chmod $MODE fdisk fck* halt hwclock if* insist insmod isnapping

    chmod $MODE kerneldell killall* lilo getty mk* mod* netreport

    chmod $MODE pam pcinitrd pndump portmart quota restore runlevel

    chmod $MODE stinit swapon tun2fs ugetty

    ```


    ```bash

    # Files in /usr/bin

    cd /usr/bin

    chmod $MODE control-panel comanche eject gnome* gpasswd kernelcfg


    chmod 755 lpr*

    chmod 4755 lpr


    #NOTE: I feel setting "lpr" to allow any group to execute it is

    # a bad thing.


    # I would like to add UNIX users and the Samba process to

    # the "lpr" group already defined in /etc/groups and then be able to

    # it put things back to 4750. BUT.. this really isn''t possible.

    # Linux doesn''t support multiple groups file and Linux

    # doesn''t support access lists (ACLs) yet. So.. you either have

    # either leave these files SUID or run LPRng.


    chmod $MODE minicom netcfcg

    ```


    ```bash

    # Files in /usr/sbin

    cd /usr/sbin

    chmod $MODE at* crond dhc edquota exportfs ftpshut group* grp*

    chmod $MODE imapd in.* inetd ipop* klogd logotrate lp*

    chmod 755 lsof

    chmod $MODE makemap mouseconfig named* nmbd newusers ntp* n-tsysv

    chmod $MODE pppd pw* quota* rdev repquota rotatelogs rpc* samba

    chmod $MODE setup showmount smb* squid syslogd taper tcpd* time*

    chmod $MODE tmpwatch tunelp user* vi* xntp*

    ```


