    # Step 6.3.3 Nmap port scanner


    Nmap scans hosts for open ports. Unlike SARA/SAINT and Nessus, it does not test
    for specific vulnerabilities. Nmap is freely available from http://www.insecure.org/nmap/.
    There are a lot of scanning options: TCP connect() scanning, SYN half-open, FIN,
    NULL, UDP, ICMP, and SYN/FIN with IP fragments to bypass packet filters. It can
    identify the OS type of the host by using TCP/IP stack fingerprinting.


    Compiling and installing is as easy as running in the source directory. To scan
    localhost for all TCP and UDP ports, for example to double-check your work from
    Steps 3, 1, 2, and 3, execute:


    ```

    [root]# ./nmap -tS -sU 127.0.0.1

    WARNING: -SU is now UDP scan - for TCP scan use -s

    ```


