    ```\n\n## 步骤 2 安装 Linux\n\n### 步骤 2.6.3. 为 LILO 启动设置密码保护\n\nLinux Loader (LILO)\
    \ 是启动 Linux 的主要机制。如果无法保证 Linux 机器的安全，除了要求进入单用户模式需要 root 密码外，还要对 LILO 提示进行密码保护。注意，对\
