    ## Step 4.4.4. Install an alternative MTA


    Several mail transfer agents are available to replace sendmail. Two popular alternatives
    are Qmail (www.qmail.org) by David Bernstein, and Postfix (www.postfix.org) by
    Wese Venena. Both of these MTAs were designed and written from the ground up with
    security and performance in mind. It is beyond the scope of this guide to get
    details on installing and configuring each of these alternatives; a wealth of
    information is available on the Internet.


    ## Step 4.4.5. Secure the POP and IMAP daemons


    For mail servers that collect all incoming mail for an organization, a common
    means to deliver the mail to clients is for them to retrieve the mail using the
    Post Office Protocol (POP) or the Internet Message Access Protocol (IMAP). POP
    is older and simpler of the two protocols, providing basic commands for authentication,
    retrieval and deletion of mail messages from the mail server. IMAP is more flexible
    and supports creating, deleting, and renaming mail folders (mailboxes), selective
    retrieval of message attributes and more.


    ### Step 4.4.5.1. Get the latest version of POP and IMAP daemons


    Many POP and IMAP daemon implementations have been plagued with vulnerabilities
    that lead to root compromises of servers on many platforms. There are several
    well-known exploit programs available for cracking vulnerable Linux POP and IMAP
    daemons. Hopefully, most of the problems have been found and fixed, and it is
    very important to have the absolute latest version of the daemon program on the
    server.


    ### Step 4.4.5.2. Control access to POP and IMAP with TCP wrappers


    POP/IMAP is traditionally run out of inetd, so access control through TCP wrappers
    is easy and very important. Limit access to only those hosts that have a legitimate
    need for the service. A mail hub that holds mail for the entire example.org domain
    and 128.184 network, and delivers it to clients with POP version 3 or IMAP, put
    this in /etc/hosts.allow (remember from Step 3.21) that /etc/hosts.deny has only
    "ALL: ALL" for denial of all services by default):


    ```

    ipop3d   .example.org 128.184.

    imimapd   .example.org 128.184.

    ```


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_62_0.png)


    ## Step 4 Securing Server Network Configurations


    ### Step 4.4.5.3. Install an alternative POP or IMAP daemon


    There are several alternative daemons. One of the most popular is Qmail from Qualcomm,
    Inc. This version supports POP3 extensions, APOP, and Kerberos. See Appendix for
    a URL to the Qpopper home page. As of writing the current stable release is 2.5,
    and version 3.0 is in beta release. A popular IMAP daemon replacement is Cyrus
    from the Carnegie Mellon Mail Project. See Appendix A for more information on
    where to locate these packages.


    ### Step 4.4.5.4. Install an SSL wrapper for secure POP/IMAP connections


    There are several third-party programs that wrap TCP services with the Secure
    Socket Layer (SSL) to provide strong authentication and end-to-end encryption.
    For a list, see http://www.openssl.org/related/apps.html. Two applications useful
    for providing secure POP/IMAP connections are stunnel and sslwrap (see Appendix
    A for these packages). Both packages require OpenSSL packages. See Step 4.9 for
    information on downloading and compiling.


    ## Step 4.5 PRINTING SERVICES


    Red Linux ships with the Berkeley line printer system. Over the last few years,
    buffer overflow exploits have been found in the lpr and lp commands both on the
    client side of the connection. If you are running a version of Red Linux earlier
    than 6.0, it is best to update to the latest version of lpr package.


    ### Step 4.5.1. List allowed remote hosts in /etc/hosts


    The names of hosts allowed to use this print server by listing them in /etc/hosts
    has serious implications in conjunction with BSD "r" programs, rsh, login, etc
    (see Step 4.2 for replacing "r" programs with SSH).


    ### Step 4.5.2. Replace Berkeley lpr/lpd with LPRng


    A popular alternative to the Berkeley lpr/lpd system is LPRng. It is compliant
    with RFC1179 requirements for network printing, gives a great deal of flexibility
    to the administrator for defining permissions for specific actions, and supports
    authentication with Kerberos and PGP. Debian ships with LPRng already, administrators
    of those distributions can skip the installation step.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_63_0.png)


    ### Step 4.5.2.1. Download and install LPRng


    Links to the latest stable version can be found at http://www.sourceforge.com/LPRng.html.
    Download this version, and extract the files from the compressed file. Follow
    the instructions in the file INSTALL in the source directory to compile and install
    LPRng.


    ### Step 4.5.2.2. Set remote and/or networks that are allowed access


    The file /etc/lpd.perms controls access to specific hosts or networks in addition
    to controlling specific operations, for instance it is possible to allow or deny
    specific users from removing jobs from the print queue. The default /etc/lpd.perms
    installed by LPRng is well commented and the package comes with lots of documentation.
    See the manual page for lpd.perms(5) for more information on the permissions configuration
    file.


    To restrict access to lpd to only hosts in the example.org domain, or network
    128.184, place the following in /etc/lpd.perms:


    ```

    REJECT SERVICE=X NOT REMOTEIP=128.184.0/255.255.0

    REJECT SERVICE=X NOT REMOTEHOST=*.example.org

    ```


    ## Step 4.6 NETWORK SYSTEM


    NFS by its very design has some serious security problems. The RPC service depends
    on UID/GID and IP authorization for permissions, all of which are easily spoofed.
    The NFS protocol has enhanced with Secure RPC which uses cryptographic authentication,
    but to date there is no Linux implementation of Secure RPC available.


    Red Hat 6.0 has moved away from the "user-space" NFS implementation to a "kernel-space"
    implementation. Just recently, security problems were discovered in the user-space
    NFS code. Users of earlier Red Hat versions and other distributions that use the
    user-space code should upgrade to the latest version. This is not to say that
    there are no problems with the kernel-space code. The version shipped with Red
    Hat 6.0 has a bug that makes it impossible for non-Linux systems to mount directories
    on Linux systems. See at ftp.kernel.org/pub/linux/devel/gcc/ for the latest version,
    which corrects this problem.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_64_0.png)


    ### Step 4.6.1. Set access to RPC services in /etc/hosts.allow


    RPC services are registered and accessed through the portmap daemon. The version
    of portmap supplied with all Linux distributions uses the TCP wrapper to allow
    or deny access to RPC services, such as NFS. The only difference from other TCP-wrapped
    services is that requests from the local host are always authorized, regardless
    of what is in the hosts.allow or hosts.deny files, and portmap does not have hostname
    lookups, so hosts.allow must specify by its IP address, or netmask.


    For example, allow NFS access to client1.example.org and client2.example.org,
    IP addresses 192.168.1.10 and 192.168.1.11 respectively, and the entire 128.184
    network, but this in /etc/hosts.allow:


    ```

    portmap: 192.168.1.10 192.168.1.11 128.184.0.255.255.0

    ```


    ### Step 4.6.2. Limit exports to specific machines with specific permissions


    The file /etc/exports controls which directories are exported for NFS mounting
    and the hosts that are allowed to mount them. The format is:


    ```

    exported-dir      [host] (options)

    ```


    If you do not provide a host, the directory is exported to any host on the Internet,
    always provide a host name, and remember that the hostname''s IP address must
    match that in /etc/hosts.allow.


    Unless there is a compelling reason to otherwise, export the directory read-only
    with the "ro" option. File permissions on the exported directory are determined
    by the UID/GID of the user on the remote host that mounts the directory. If the
    remote host is compromised, the attacker can emulate any UID/GID for wishes. Therefore,
    any file on a read-write exported NFS directory can be created, altered, or deleted.
    The administrator of an NFS server should not allow NFS access to hosts outside
    his administrative control except in read-only mode.


    If all possible, avoiding a NetWare server to mount any UNIX filesystem, Linux,
    Solaris, whereas NetWare NFS services present significant security problems, such
    as read-write privilege regardless of the export restrictions.


    See the manual page for exports (5) for details on the options for /etc/exports.

    '
