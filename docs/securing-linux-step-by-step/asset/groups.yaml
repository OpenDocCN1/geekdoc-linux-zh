    ## 第 5 步 调整与数据包防火墙


    ## 第 5.3 步 数据包防火墙与 LINUX 伪装 (MASQUERADING)


    运行着配置良好的防火墙的 Linux 服务器是保护本地服务器及其背后的内部网络最有效的方法之一。Linux 2.2.x 内核具有非常稳定的防火墙实现，它通过一个名为
    `iptchains` 的工具进行管理。该工具允许管理员灵活地定义允许进入和离开防火墙的流量类型。然而，在 2.2.11 版本之前的内核在 IP 分段代码中存在一个漏洞，允许攻击者发送经过精心构造的
    IP 分段，从而绕过 `iptchains` 规则。我们在编写本文时，建议企业系统的管理员安装最新版本的内核（版本 2.2.12）。


    防火墙技术本身就是一门学问（例如，“*Building Internet Firewalls》，Chapman & Zwicky, 1995, O''Reilly
    & Associates, ISBN 1-56592-124-0），且远超本指南的范围。请参阅“资源”部分以获取 IPCHAINS 和 IP-MASQ HOWTO
    的 URL，进行深入讨论。


    ### 第 5.3.1 步 通过外部连接实现 IP 伪装以获取更多功能


    防火墙可以很好地保护独立服务器，也可以保护内部计算机。这种配置的一个常见例子是个人或公司将家中的/办公室网络连接到互联网。这里的复杂之处在于，互联网上使用的
    TCP/IP 地址正成为一种稀缺且昂贵的资源。因此，为所有内部计算机获取 TCP/IP 地址可能会花费一些费用。网络地址翻译 (NAT) 的开发是为了在节省
    TCP/IP 地址的同时，仍允许内部计算机访问互联网。对于 Linux，开发出了一种名为 `Masquerade`（伪装）的 NAT 形式，许多 Linux
    用户都在广泛使用它。


    ### 第 5.3.2 步 一个强有力的 /etc/rc.d/rc.firewall 规则集


    请参阅附录 D 获取通过以太网连接到电缆调制解调器或其他持久网络连接到互联网的 IP 伪装机器的强数据包防火墙脚本完整列表。其中包含大量的嵌入注释，用于解释各种规则的作用以及如何修改这些规则以适应你的特定需求。


    ### 第 5.3.3 步 检查、安装并测试防火墙


