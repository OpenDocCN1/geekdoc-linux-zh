    # STEP 4 Securing Server Network Configurations


    The safest way to transport the public key to the server is "sneaker-net", i.e.,
    copy the key to the floppy and carry it to the server. Transmitting the public
    key over the network is generally safe, though. Even if the public key is sniffed
    off the network, it is useless without the private key and it is extremely difficult,
    if not impossible, to derive one from other. Never send the private key over the
    network, and make sure that the .ssh/identity file has 0600 permissions and is
    owned by you.


    Once the key is copied to the server, put it in the home directory of the account
    you wish to access (we''ll use the root account in our example) and assume the
    public key is in the file identity.pub in the home directory.


    ```

    [root] cd ~root

    [root] mkdir .ssh

    [root] cat identity.pub >> .ssh/authorized_keys

    [root] chmod 600 .ssh/authorized_keys

    ```


    The authorized_keys file holds the public keys for every user that is granted
    access. If you copy more than one using the method above, be careful with the
    redirection; make sure you append (>>) to the file, do not overwrite it ( >).


