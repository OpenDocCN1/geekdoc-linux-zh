  mdcn: "\n\n## Step 6.3.3 Nmap 端口扫描器\n\nNmap 扫描主机的开放端口。与 SARA/SAINT 和 Nessus 不同，它不测试特定的漏洞。Nmap\
    \ 可以从 http://www.insecure.org/nmap/ 免费获取。它有很多扫描选项：TCP connect() 扫描、SYN 半开、FIN、NULL、UDP、ICMP，以及带有\
    \ IP 分片的 SYN/FIN 扫描，以绕过数据包过滤器。它可以通过使用 TCP/IP 栈指纹来识别主机的操作系统类型。\n\n编译和安装在源目录中运行一样简单。例如，要扫描\
    \ localhost 的所有 TCP 和 UDP 端口，以双检你在步骤 3、1、2 和 3 中的工作，执行：\n\n```\n[root]# ./nmap\
    \ -tS -sU 127.0.0.1\nWARNING: -SU 现在是 UDP 扫描 - TCP 扫描请使用 -s\n```\n\n由 Fyodor 启动\
    \ nmap V.2.22-BETA4 (fyor@dhp.com, www.insecure.org/nmap/)\nlocalhost (127.0.0.1)\
    \ 上的有趣端口：\n\n| 端口 | 状态 | 协议 | 服务 |\n|---|---|---|---|\n| 21 | open | tcp | ftp\
