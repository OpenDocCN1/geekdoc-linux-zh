    Syslog: 集中式日志主机存储来自其他计算机的 syslog 消息。你可以想象，日志主机需要大量的磁盘空间来存放 `/var/log`。良好的做法是将
    `/var/log` 放在一个快速的 SCSI 设备上。日志主机不应运行任何服务，并且要安全，这样系统所需的磁盘空间会比其他服务器小。


    Shell: Unix 服务器提供了 `/tmp` 和 `/var` 的独立分区。这将减少由于经典攻击填充 `/tmp` 目录，导致根分区满，使得系统无法写入更多文件并通常会崩溃的影响。


    我们建议服务器为 `/var`（或者 `/var` 和 `/var/spool` 的独立分区）、根分区 `/` 以及用户分区 `/home` 准备独立分区。某些管理员可能还会为
    `/usr` 考虑一个分区。某些发行版将大型系统软件包（如 KDE、Netscape 和 DBMS）存储在 `/opt` 目录，这些分区的相对大小完全取决于管理员的需求和个人经验。例如：一台拥有
    256MB 内存和 2GB 硬盘的高端 PC 主要用于 NNTP 服务，可以分区如下：


    | 第一块硬盘 | | 大小 |

    | :--- | :--- | :--- |

    | 第一块硬盘 | | 500MB |

    | 第一块硬盘 | `/usr` | 100MB |

    | 第一块硬盘 | `/usr/local` | 1500MB |

    | 第一块硬盘 | `/tmp` | 2000MB |

    | 第一块硬盘 | `/var/spool/news` | 4000MB |

    | 第二块硬盘 | `swap` | 500MB |

    | 第二块硬盘 | `/home` | 5500MB |

    | 第二块硬盘 | `var` | 3000MB |


    ##  2 安装 Linux


    ### 步骤 2.3.3. 记录分区方案


    一旦为特定环境完成分区，请记录分区布局。这样，如果分区表意外损坏或删除，恢复它将变得更容易。要记录各种表，请在每个物理磁盘（sda, sda 等）上运行 `fdisk`
    并输入 `p` 打印。将结果记录在纸上并存在安全的地方以备后参考。例如：


    ```

    [root]# fdisk /dev/hda

    Using /dev/hda as default device:

    Command (m for help): p

    Disk /hda: 255 heads, 63 sectors, 2193 cylinders

    Units = 16065 * 512 bytes

    ```


    | 设备 | 启动 | 开始 | 结束 | 扇区 | Id | 系统 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | /dev/hda | * | | 1913 | 156611 | 83 | Linux |

    | /dev/hda2 | | 1914 | 1946 | 265072+ | 82 | Linux swap |

    | /dev/hda3 | | 1947 | 2193 | 1984027+ | 83 | Linux |


    ```

    Command (m for help): q

    ```


    ## 2.4 选择安装软件包


    与设置磁盘分区一样，选择安装的软件包取决于系统的用途。通过此部分的最佳方法是了解你的用户以及系统将如何被使用。确定系统中将包含和不包含的内容，并相应地选择软件包。仔细检查安装程序的每个部分，每当你不知道某个软件包是什么，或者不确定是否需要它时，按下“F”。如有疑问，就跳过它。当需要出现时，以后添加该软件包。如果你没有选择
    Red Hat 某些工具所需的软件包，它会在安装过程实际开始之前警告任何软件依赖关系。


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_18_0.png)


    ### 步骤 2.4.1. 工作站软件包


    工作站用户通常分为三类之一：


    - 1. 商务。系统用于文字处理、电子表格、电子邮件和 WWW 浏览等业务目的。对于这些系统，不需要安装 NFS 或 HTTP 服务器，或像 GCC 和 EGCS
    这样的编译器。

    - 2. 软件开发。对于此类系统，软件包的选择取决于开发类型。Web 开发人员可能需要 Web 服务器、PHP、Perl。软件开发者可能需要 GCC 或 EGCS、G++、Python、Perl
    等，以及 TeX 和 Ghostscript 等文档工具。

    - 3. 通用。这一类可能符合大多数用户的需求。商务工具、开发工具、多媒体播放器、游戏、图形实用程序都加载在系统中。通用型用户不希望受限于未在机器上安装 Web
    服务器或 GCC 的事实。虽然这种安装最为灵活，但以后需要时很容易添加软件包。


    ### 步骤 2.4.2. 服务器软件包


    服务器配置为性能和安全。为了提高安全性，我们建议在服务器上只安装必要的软件包。例如，一个 Web 服务器需要 Web 服务器、PHP、Perl。如果允许，不要在系统上运行不必要的服务如NFS、Samba、图形实用程序等，以减少攻击面。


    ### 步骤 2.4.3. 让安装程序进行


    一旦你选择了所有必要的软件包，Red Hat 安装程序将确定软件包之间的依赖关系。在这一点上，你可以从列表中移除所选的软件包。


    最后，安装程序将提示你进行网卡等额外设置。涵盖这些步骤超出了本指南的范围。


    ## 2.5 配置系统安全和策略


    ### 步骤 2.5.1. 使用 MD5 哈希的影子密码


    Red Hat 向用户提示的最终安装选项之一是使用带有或不带 MD5 哈希的“影子”密码。传统的 UNIX 用户密码使用“crypt”算法加密并存储在全局可读的文件
    `/etc/passwd` 中。这使得使用工具进行字典攻击很容易。影子密码存储在 `/etc/shadow`，仅 root 可读，使得获取加密密码变得困难得多。使用
    MD5 加密哈希为影子密码增加另一层安全。保持 `/etc/shadow` 安全非常重要。


    ### 步骤 2.5.2. 为 root 和所有用户设置密码


    系统重启之前的最后步骤之一是设置 root 密码。Linux 密码是敏感的，安装程序建议 root 密码是大小写字母、数字和特殊字符的组合，包括：


    ```

    [ ~!#$%^&*()-_={}]|\;'':.<>? ]

    ```


    密码不基于任何个人信息，如姓名、公司、社会安全号码、生日、车牌号等。由于攻击者可以发现关于用户的惊人个人信息，特别是在内部攻击的情况下。


    永远不要使用任何语言的字典中都能找到的常用词，例如英语单词“ridge”。使用数字替换字母（例如“r1dg3”）没有帮助，因为常见的密码破解工具也考虑了这种技巧。


    那么什么是好密码呢？独特且使用组合；想一个短语和缩写（尽管不要使用你日常用语的缩写）。例如，一个好密码可以用 B+ 树和 Patricia 树的计算机科学算法名称构造，“B+paTas..”。要有创意，但要使用你能记得住的东西！

    '
