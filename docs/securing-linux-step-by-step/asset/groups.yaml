    # STEP 6

    Tools


    # Step 6.1.3.2. Running Tripwire


    The first time Tripwire is run, it builds a database of checksums and other information
    (UID, GID, mode, size, etc) for the files and directories listed in the configuration
    file.

    Then, each time it runs, it compares the information in the database to the current
    state of the system. Then, when run interactively with the command line, it gives
    you the option of updating the database for each changed file finds. So, if /etc/group
    has changed, and you were the one that changed it, you can update the database
    so that you will not be notified until the next time it changes (perhaps by an
    attacker).


    # Step 6.1.3.3. Use rpm to verify package files


    The database built by the Red Hat Package Manager (rpm) when it installs packages
    includes MD5 checksums, UID, GID, mode, size, etc. You can use rpm to verify the
    contents of the database against the current state of the files on disk and report
    any files that are different. This is opposed to the Tripwire method, is that
    with rpm verification you can not test changes over time, only since the files
    were installed. There is no provision for updating database entries that have
    changed with the knowledge and approval of the administrator.


    To verify all package files, run:


    ```

    [root]# rpm -Va

    S.5....T c /etc/exports

    S.5....T c /etc/hosts.allow

    S.5....T c /etc/hosts.deny

    M....UG.      /mnt/cdrom

    ```


    The entries for files in /etc tell you that the MD5 checksum, and modification
    time have changed; for /mnt/cdrom the mode, user and group have changed.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_85_0.png)'
