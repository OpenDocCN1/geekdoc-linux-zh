    ## STEP 6 Tools


    To check /var/log/messages from the command line, do:


    ```bash

    [root]# swatch -c testrc -f /var/log/messages

    *** swatch-2.2.2 (pid:323381) started at Fri Jul 25 15:12:08 1999

    Jul 25 10:32:42 localhost sshd[16508]: refused connection from 192.168.1.1

    Jul 25 10:33:31 localhost sshd[16530]: log: Rsa authentication refused for bad
    modes for /root/.ssh/authorized_keys

    Jul 25 20:11:22 localhost sshd[2312]: error: Fwd X11 connection from 127.0.0.1
    refused by tcp_wrappers.

    ```


    A starting point for a control file under Red Hat is /usr/doc/swatch-2.2/config_files/swatchrc.personal.
    It consists of a list of regular expressions that generate actions, followed by
    a list of regular expressions to ignore, and the final action is to imply echo
    everything else. This file can be tuned by adding actions and ignores and reiterating
    through /var/log/messages until you get results that are manageable.


    Swatch can be configured to run through a single log file in a single pass, or
    it can run as a daemon that continues to monitor new log messages as they are
    generated. It can be configured with different control files to monitor mail logs,
    firewall logs, Samba logs, etc. See the manual page for swatch(8) for more information.


    ### Step 6.1.2. Psionic Logcheck


    Another of the many log file monitors is Logcheck from Psionic Software Systems.
    See Appendix A for URLs to the Psionic Logcheck home page and other log monitors
    in the MetaLab site.


    Logcheck comes with good documentation. Do a thorough reading of the INSTALL file
    before installing and running it. Installation is simple. After unpacking the
    compressed file, execute “make linux” in the source directory to copy the Linux-specific
    configuration files and script to /usr/local/etc/.


    Logcheck generates reports that have three sections: system attacks, security
    violations, and unusual system events. System attack notices are generated by
    a syslog entry that matches any pattern in logcheck.hacking; security violations
    are generated from patterns in logcheck.violations;; and unusual events are generated
    by any line that does not match a pattern in logcheck.ignore. Read the comments
    in logcheck.sh for more detailed descriptions of these configuration files.


    See swatch, the administrator needs patience and persistence to weed out records
    that do not indicate genuine events and add patterns to logcheck.ignore. At first,
    there are likely to be many false alarms. Investigate each reported instance to
    determine if the reported event requires attention. If it does not, a pattern
    to match that event can be put into logcheck.ignore and you will not see it again.
    It is best to make the pattern as specific as possible, so that unusual variations
    of the event are reported.


    ### Step 6.1.3. Tripwire


    Tripwire was originally developed by Gene Kim and Gene Pfaff at the University
    of Purdue Academic. The idea behind Tripwire is that in order to successfully
    compromise a system, files must be changed, added, or deleted in order to place
    back doors, trojans and exploit scripts. Tripwire generates a database of cryptographic
    signatures for important system binaries and configuration files and changes in
    any of these files over time.


    See Appendix A for URLs for the source code for Tripwire version 1.3 and version
    2.0. However it must be noted that Tripwire 2.0 is not supported for Red Hat 6.0,
    only for the earlier versions. As of the time of writing, only Release 1.3.1 works
    for Red Hat 6.0. Read the documentation that comes with each release for information
    about compiling, installing, and maintaining Tripwire.


    #### Step 6.1.3.1. Tripwire databases


    Before Tripwire, the only way to test the integrity of system files is by checking
    CRC checksums. Unfortunately, CRC-bit checksums are easily subverted. Tripwire
    builds a database of cryptographic checksums, such as MD5, that are nearly impossible
    to spoof and checks them regularly. If the checksum fails, it is a very strong
    indicator that the file in question has been modified.


    The greatest weakness in Tripwire was that if an attacker can gain access to the
    machine, he may modify or rebuild the Tripwire database to mask his intrusion.
    The only defense against this is to place the database on read-only media, such
    as a write-protected floppy or CD. One of the most significant innovations in
    Version 2 is cryptographic signing of the database and configuration files, which
    eliminates the need for placing Tripwire databases on read-only media. Hopefully,
    support for Red Hat 6.0 will be available by the time this goes.


    #### Step 6.1.3.2. Running Tripwire


    The first time Tripwire is run, it builds a database of checksums and other information
    (UID, GID, mode, size, etc.) for the files and directories listed in the configuration
    file. Then each time it runs, it compares the information in the database to the
    current state of the system. Then when run interactively with the command line,
    it gives you the option of updating the database for each changed file. So, if
    /etc/group has changed and you were the one that changed it, you can update the
    database so that you will not be notified until the next time it changes (perhaps
    by an attacker).


    #### Step 6.1.3.3. Use rpm to verify package files


    The database built by the Red Hat Package Manager (rpm) when it installs packages
    includes MD5 checksums, UID, GID, mode, size, etc. You can use rpm to verify the
    contents of the database against the current state of the files on disk and report
    any files that are different. This is opposed to the Tripwire method, as with
    rpm verification you cannot test changes over time, only since the files were
    installed. There is no provision for updating database entries that have changed
    without the knowledge and approval of the administrator.


    To verify all package files, run:


    ```bash

    [root]# rpm -Va

    S.5....TC /etc/exports

    S.5....TC /etc/hosts.allow

    S.5....TC /etc/hosts.deny

    M....UG /mnt/cdrom

    ```


    The entries for files in /etc tell you that the MD5 checksum and modification
    time have changed; for /mnt/cdrom the mode, user and group have changed.


    ### Step 6.1.4. Psionic PortSentry


    There are several tools for detecting port scans, Psionic PortSentry adds a twist:
    when a scan is detected it can take immediate action to block the scanning host
    from any further access to the machine. It works well in conjunction with Psionic
    Logcheck (Step 6.1.2). See Appendix A for a URL to the home page.


    PortSentry comes with good documentation. Before compiling and installing, read
    README.install, README.methods, and README.qa thoroughly. PortSentry compiled
    "out-of-the-box" for the authors without any changes necessary. The program and
    configuration files are installed in /usr/local/psionic/portsentry by default.


    PortSentry can detect not only simple TCP connect-type scans, but many types of
    stealth scans, too, such as SYN/half-open, FIN, and NULL scans.


    Before running PortSentry, review portsentry.conf. All the entries are documented
    in the configuration file and in README.install. The only action against scanning
    hosts is to:


    ```

    ALL: <attacker-IP>

    ```


    at the end of /etc/hosts.deny. Since you should already have "ALL: ALL" at the
    end of /etc/hosts.deny, this is ineffective. In fact, this method is completely
    ineffective if any services have been allowed to the attacking host in /etc/hosts.allow,
    which TCP wrappers read in /etc/hosts.allow before reading /etc/hosts.deny.

