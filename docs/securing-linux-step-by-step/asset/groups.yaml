    ## 步骤 6.2 基于主机的漏洞分析：从内向观察


    ### 6.2.1. Tiger，德州 A&M 系统检查器


    Tiger 是一个检查 UNIX 计算机安全相关系统的工具。Tiger 最近进行了升级（自 1994 年以来首次），以支持对 Red Hat Linux 系统的检查。Tiger
    主页的 URL 和源代码请参阅附录 A。


    ### 6.2.2. 安装并配置 Tiger


    安装非常简单：解压压缩的 tiger 文件并执行 `make install`。这将配置和脚本文件放置在 `/usr/local/tiger` 中。Makefile
    不会创建 Tiger 依赖的中间目录，因此在安装后请执行以下命令：


    ```

    [root]# mkdir -m 700 -p /var/spool/tiger/bin

    [root]# mkdir -m 700 -p /var/spool/tiger/logs

    [root]# mkdir -m 700 -p /var/spool/tiger/work

    ```


    此外，如果你运行的是默认的 Bash 2，将需要编辑 `/usr/local/tiger/systems/linux2/config` 并注释掉以 "GROUPS"
    开头的行。在 Bash 2 中，GROUPS 是一个只读变量，如果脚本尝试给它赋值将将终止。


    Tiger 执行的检查列在 `/usr/local/tiger/tigerrc` 中。源码目录中有几个 `tigerrc` 文件，并且附有详细的注释。默认的
    `tigerrc` 几乎尝试测试其中的所有内容。对于 Red Hat Linux 版本 6，大多数检查都将如预期那样工作，签名检查除外。你可以通过编辑 `tigerrc`
    将 `Tiger_Check_SIGNATURES=Y` 修改为 `Tiger_Check_SIGNATURES=N` 来关闭它。同样，你可以通过编辑 `Tiger_Run_CRACK`
    条目来关闭对密码文件运行 Crack。


    ### 6.2.3. 运行 Tiger


    运行 Tiger：


    ```

    [root]# cd /usr/local/tiger

    [root]# ./tiger

    ```


    在 Tiger 运行检查期间，标准输出上会打印许多信息。当运行完成后，结果将存储在 `/var/spool/tiger/logs/security.report.<host>.<domain>.<date>-<time>`
    中。准备好第一份安全报告会有大量信息。报告的问题看起来如下：


    - -WARN- [acc001w] 登录 ID postgres 已禁用，但仍具有有效的 shell (/bin/bash)。

    - -FAIL- [perm007f] /etc/aliases 不应有组读权限。

    - -FAIL- [perm007f] /etc/aliases 不应有世界读权限。


    WARN 条目表示某些不理想的内容，但并不糟糕。FAIL 条目表示 Tiger 认为你应该更改的内容。方括号中的字符串指示如何使用 `tigexp` 程序获取有关特定警告的更多信息：


    ```

    [root]# ./tiger acc01w

    ```


    列出的登录 ID 以某种方式被禁用（`passwd` 字段中为 `**` 等），但该登录 ID 的登录 shell 是一个有效的 shell（来自 `/etc/shells`
    或系统等效项）。有效的 shell 可能会允许该登录 ID 继续使用。应该将登录 shell 更改为不存在的内容，或者类似于 `/bin/false` 的内容。


    ## 步骤 6 工具


    ### 6.2.4. 修改 Tiger 检查项


    通过查看安全报告，你可能会发现一些你认为完全没问题的警告和失败。Tiger 用于比较的基础信息可以在 `/usr/local/tiger/systems/Linux/2`
    中找到。例如，`file_access` 列表包含了许多系统文件的建议所有权和位位。如果你发现 `/etc/aliases` 允许组读和世界读权限，你可以编辑此文件以设置适当的模式位，这样你将不会再收到关于这些权限的
    FAIL 消息。


    再次强调，这里需要耐心和坚持。遵循安全报告中建议的更改，并明智地修改基础信息，直到 Tiger 的安全报告为你的站点返回最有意义的信息。


    ### TARA，Tiger 的更新版本


    由于 Tiger 最近才开始有新的开发，Advanced Research Corporation 获取了基础代码并对其进行了增强，生成了 Tiger 分析研究助手
    (TARA)。此处附加 TARA 主页的 URL。


    TARA 的安装、配置和操作与原始 Tiger 完全相同，甚至目录名称也相同。请注意，默认的 `tigerrc` 启用的系统比 Tiger 少且速度更快。在运行
    TARA 之前检查此文件，并启用与你相关的检查。


    ## 步骤 6.3 基于网络的漏洞分析：从外向观察


    有许多工具旨在扫描网络上的主机以开放端口、通用安全漏洞或特定的可利用服务。在进行任何网络扫描之前，最重要的事情是保护好自己的安全……如果可能的话，获取执行扫描的授权。政府和商业机构对于谁可以执行扫描、扫描范围以及哪些可以和不能被扫描有特定的政策。未经授权而违反这些政策可能导致制裁、失业以及任何法律行动。


    获得授权后，发布通知告知将进行扫描以及何时进行。某些管理员认为，让其他人知道即将到来的扫描会给用户提供一个预先修补漏洞的机会，从而偏斜扫描结果。嗯，至少结果是在正确的方向上被偏斜了，而且你将避免本地用户的入侵检测程序意外触发红警引起的问题。


    在扫描之前，在隔离的网段上运行扫描软件，以确保扫描工具不会对所扫描的机器产生负面影响。扫描完成后，发布通知告知扫描结果以及哪些机器被扫描了。在Nessus
    扫描后，总结发现的漏洞信息。此外，Nessus 扫描器在扫描机器方面是非常高效的。


    ### 6.1. SATAN 的衍生品：SARA 和 SAINT


    网络分析安全工具 (SATAN) 在 1994 年由 Dan Farmer 和 Wiest 发布时引起了轰动。它使用 Web 技术具有了一种创新的用户界面，扫描已知漏洞和利用程序。然而，这种设计允许对其进行增强。SATAN
    的两个更新版本可用：安全审计研究助手 (SARA) 以及安全管理员集成工具 (SAINT)。


    这两个版本都处于活跃开发中。获取最新的 SATAN 版本，请咨询 SARA 或 SAINT。


    ### 6.3.2 Nessus


    Nessus (http://www.nessus.org) 是一种使用客户端/服务器架构的开源扫描器。Nessus 守护进程 `nessusd` 运行扫描并检查，由具有
    Gtk GUI 界面的客户端控制。Nessus 拥有用于执行漏洞测试的“插件”库。目前有 208 个插件，测试诸如 IMAP 和 RPC 溢出、CGI 脚本、RPC
    服务以及一系列拒绝服务攻击。


    编译和安装非常简单：


    ```

    [root]# ./configure; make; install

    ```


    必须先运行 `nessusd` 服务器。当 `nessusd` 首次运行时，它会创建一个主机密钥并构建默认用户文件 `/usr/local/nessus/nessus.users`。该文件控制谁可以连接到服务器。要为
    root 添加条目，再次运行 nessusd：


    ```

    [root]# nessusd -P root,pass

    ```


    其中 `pass` 是初始密码。启动客户端 `nessus`，你必须连接到服务器。在“Login:”窗口中输入“root”并点击“Log in now!”只有在第一次登录时才会提示输入上述密码，之后对于所有后续登录将生成私钥。


    请注意，Nessus 默认测试拒绝服务漏洞，我们的测试表明，如果启用此选项，你可能会崩溃你扫描的每台机器。在执行扫描之前，转到 Plugins 标签并禁用
    Denial of。


    扫描完成后，Nessus 会弹出一个报告窗口显示每个扫描主机的信息。安全问题用红色圆点标记，关注区域用黑色圆点标记。在这两种情况下，都会打印简要描述。报告可以保存到磁盘以便日后研究和比较。


    '
