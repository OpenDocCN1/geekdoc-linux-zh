    # Linux 安全生存指南


    由来自 46 家商业、教育和政府机构的安全专家共同编写的共识性。


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_0_0.png)


    ## Linux 安全分步指南版本 1.0


    SANS 学院


    # 引言


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_1_0.png)


    计算机专业人士社区生产力和效率的巨大来源之一，是活跃从业者愿意从忙碌生活中抽出时间，分享他们学到的教训和完善的技术。许多共享通过在线新闻组、网页发布以及技术会议上的演讲进行，那些有时间浏览新闻组、浏览网络和参加会议的人，往往能从这些互动中获得无价的信息。


    SANS 的“分步”系列将信息共享提升到了一个新的水平，专家们在此分享他们认为有效的技术。SANS 学院将这些技术整合到一个分步计划中，并让其他专家对该计划进行详细的严格审查。这一过程持续到达成共识。这是一项艰巨的任务。许多人花费大量时间确保信息既有用又准确。


    ## Linux 安全

    分步指南版本 1.0


    Linux 从一个由赫尔辛基大学学生林·托瓦尔斯（Lin Torvalds）领导的小型协作项目，已发展变成一种全球现象，推动了发行、培训和支持的新行业出现。除了
    Windows NT 之外，它是唯一在企业信息技术基础设施中获得市场份额的操作系统。分发商正积极营销更易安装、更易用的 Linux 系统，并真正进入了企业、政府和教育用户的桌面。根据估计，全球实际有
    800 万 Linux 用户。


    Linux 是一个“开源”操作系统。内核和系统程序的源代码供下载、检查和修改。这是一把双刃剑：系统开发者和普通用户可以访问代码，因此能更快修复漏洞；系统破解者也可以访问代码，他们可以利用这些知识更快速、可靠地开发漏洞。这并没有让
    Linux 比它的专有竞争对手更安全。相反，漏洞在开放环境中被发现，Linux 软件也会很快发布补丁和更新。遗憾的是，大多数用户从 CD-ROM 介质安装
    Linux，而等到标签上的墨水干透，里面通常已经包含了漏洞程序。安装商业 Linux 发行版的另一个遗憾方面是，为了方便使用，这些 Linux 系统被配置为计算机启动后立即运行大部分（甚至全部）网络服务，且没有任何控制。例如，多年来所有
    Linux 发行版都带有 TCP 封装，但 `/etc/hosts.allow` 和 `/etc/hosts.deny` 文件是空的，这意味着在互联网上无法连接到受
    TCP 封装的服务。


    本指南面向新手家庭用户和经验丰富的系统管理员。它涵盖了 Linux 在两种基本运行模式下的安装和操作：作为工作站和作为服务器。它没有配置 Linux 执行的性能良好的其他特殊功能，例如路由器、防火墙、防火墙处理等。示例和指令基于
    Red Hat (红帽) 6.0 版本。选择 Red Hat 是因为它拥有最大的 Linux 份额，而选择 6.0 版本是因为它包含了最新的稳定版 Linux
    内核、系统库、实用等。然而，本指南中的概念、建议和程序可以很容易转换到其他发行版。你可能需要稍微探索你的系统，以找到不同目录下的配置文件，并确定安装了哪些版本的软件包，但探索过程本身就是一个很好的教学工具。


    本指南将引导你（读者）完成安装过程，然后分为设置工作站和设置服务器的独立步骤。指南讨论了用于监控和测试系统安全的一些有用工具。我们努力遵循“深度防御”原则。没有任何一个步骤是针对系统攻击的“灵银弹”，但作为一个整体来看，它们构建了多层防御，这让“脚本小子”（script
    kiddies）和专职的计算机犯罪分子的生活变得困难得多。


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_2_0.png)


    ## Linux 安全


    # 引言


    我们尽可能解释加固 Linux 机器的选项及其影响。然而，这并不是一本关于安全的书。在可能的情况下，我们在正文或附录 A 中包含了指向文档和资源的指引。我们鼓励你在设置
    Linux 机器之前学习这些资源，并跟踪来自分发商、SANS 学院和其他安全参考的最新信息。


    按照惯例，root 用户执行的命令前带有命令行提示符 `[root]#`。在系统正文中，命令和文件名使用 Courier 等宽字体。命令序列和文件内容与正文分开，也使用
    Courier 等宽字体。参考手册采用传统样式，页码（节），例如 `inetdconf(5)`。若要在 Red Linux 以及大多数其他发行版中阅读手册，请执行命令：


    ```bash

    [root]# man 5 inetd

    ```


    **重要提示：** 每当这些步骤需要更改时，都会建议进行更新，并定期发布新版本。

    请发送邮件至 info@sans.org，主题为 <Linux Security> 以订阅包含新威胁新闻和更新解决方案的每月《网络安全摘要》（Network
    Security Digest）。没有更改。


    本书由以下人员编写和编辑：

    Lee E. Brotzman, David A. Rauch, Trinity Designs


