    It is important to update the packages before using the workstation for day-to-day
    work, but it is just as critical to stay up to date time goes on. New bug fixes
    and enhancements are generated all the time. Trying to keep your local workstation
    synchronized with the updates can be tedious and time consuming.


    Happily, there are several third-party tools that automate the process of checking
    an FTP site for new packages, and even installing updates without human intervention.
    You can find these tools on the Metab FTP site in /utils/package/ subdirectory,
    in Freshman, and by other popular FTP sites. See Appendix A for specific URLs.
    We will discuss only one program here, but there are several others.


    # Step 3.4.4.1. Use AutoRPM to automate updates


    See Appendix A for the URL of the AutoRPM home page. To quote from the AutoRPM
    man page.


    AutoRPM is a program that can do any combination of the following: mirror RPMs
    from an FTP site, keep installed RPMs consistent with an FTP site or local directory,
    and keep installed RPMs in a cluster or network of systems consistent. It is highly
    flexible.


    To run AutoRPM you must first install "libnet" library, available from any Perl
    CPAN site. If you are unfamiliar with installing Perl CPAN, the author of AutoRPM
    has thoughtfully provided an RPM version available from his Web site.


    In our testing of AutoRPM for this guide, we found that the program is indeed
    very flexible, but a little tricky to install. The tar-ball could use a Makefile
    to make installation easier. The default configuration seems to work well for
    Red Hat Linux, and after a little browsing through the man pages, changing the
    configuration to find updates for other distributions was not difficult.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_39_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_39_1.png)'
  - '[PAGE 40]


    To install AutoRPM, download the compressed tar file and extract the:


    ```

    [root]# cd /usr/local/src

    [root]# tar xzf <download-dir>/autorpm\*.tar.gz

    [root]# cd autorpm6

    ```


    where <download-dir> is where the tar file was downloaded. The wildcards in the
    commands simply avoid typing in the actual version number (which probably has
    changed by the time this guide went to press).


    Create the configuration file and install the configuration files, programs and
    on main pages:


    ```

    [root]# mkdir --mode 700 /etc/autorpm.d

    [root]# cp autorpm.conf autorpm.d/* /etc/autorpm.d

    [root]# mkdir --mode 700 /etc/autorpm.d/pools

    [root]# cp pools/* /etc/autorpm.d/pools

    [root]# install --owner=root --group=bin --mode=0700 autorpm.pl /usr/sbin/autorpm

    [root]# cp autorpm.8 /usr/local/man/man8

    [root]# cp autorpm.conf.5 /usr/local/man/man5

    ```


    Read the manual pages for autorpm(8) and autorpm.conf(5), but the default settings
    should work for Red Linux.


    Run AutoRPM manually in interactive mode to check for updated RPMs:


    ```

    [root]# autorpm --interactive

    ```


    AutoRPM will download the package names from the FTP sites listed in

    /autorpm.d/pools/redhat-updates and compare them to the set of currently installed
    packages. The default list of FTP sites is long. It is good practice to edit the
    list and pare it down to only those sites you know and trust, such as ftp://updates.redhat.com
    and perhaps a local mirror.

    Next, an interactive dialog allows you to choose to update now, update later,
    or view RPM information such as files, dependencies, scripts, and signatures.
    The manual page has all the details.'
- md: '

    # STEP 3

    Securing Workstation Network Configurations


    Before you try to run AutoRPM to automatically download and install updates, edit
    /etc/autorpm.d/redhat-updates and add the command PGP_Require Yes in the action
    block labeled action (updated)`. This will force a PGP signature check of the
    RPM package before it is installed. You will need to install PGP or GPG and download
    the public keys for Red Hat before this will work. See the "PGP SIGNATURES" of
    the rpm(8) page for more information.


    AutoRPM also comes with a cron job that can be placed in /etc/cron.daily or which
    you prefer:


    ```

    [root]# cp autorpm.cron /etc/cron.weekly/autorpm

    ```


    The cron job is set up to make reports of what needs to be done to the address
    listed in /etc/autorpm.d/autorpm.conf in the variable ReportDest, by default.


    Configuring AutoRPM to work for other distributions can be as simple as changing
    the list of FTP sites in the /etc/autorpm.d/pools/redhat-updates file, however
    you may want to change the name to your distribution. If so, you will need to
    edit /etc/autorpm.d/autorpm.conf and change the entry for ConfigFile to reflect
    the new name.


    - 3.4.5. Subscribe to security-related mailing lists


    There are a lot of mailing lists that distribute information about computer security,
    newly discovered vulnerabilities and exploits, bug fixes, and updates. Even with
    an automated process for finding updates RPMs, it is important to stay informed
    about security-related problems for which updated software may not be available.
    At least you will know to turn a vulnerable service off until a fix is available.


    See Appendix A for a list of security-related mailing lists and instructions for
    subscribing. For a typical workstation user, a high-volume mailing list like Bugtra
    could result in overload. At a minimum, subscribe to the "announce" list for your
    Linux distribution.


    # STEP 3.5 CACHING-ONLY DOMAIN NAME SERVICE (DNS)


    Red Hat 6.0 includes the latest version of the Berkeley Internet Name Domain (BIND)
    software, version 8.2. This version includes several security-related bug fixes
    and additional security enhancements. Regardless, a Linux workstation has no need
    to run its own name server, even in a caching-only mode. Permanently disable and
    remove the software.


    - Step 3.5.1. Disable and remove DNS server software


    Stop the named daemon, if it hasn''t been done in step 3.3.2 above, and remove
    the software from the workstation:


    ```

    [root]# /etc/rc.d/init.d/named stop

    [root]# rpm -e caching-nameserver

    [root]# rpm -e bind

    ```


    - Step 3.5.2. Set primary and secondary nameservers


    If this was not done during the installation process, edit /etc/resolv.conf and
    add the IP addresses of your primary and, if available, secondary nameservers.
    Each of the name servers is denoted on a line that looks like:


    ```

    nameserver www.xxx.yyy.zzz

    ```


    Logically enough, the IP for the primary nameserver is listed first, and the secondary
    nameserver. Since the caching Domain Name Service has been removed, make sure
    that there is no nameserver line that points to your local IP number or 127.0.0.1.


    # STEP 3.6 ELECTRONIC MAIL


    A typical workstation does not need to run a Mail Transfer Agent (MTA), like sendmail,
    in daemon mode.

    Most Internet service providers, university, government, and commercial organizations
    provide mail servers.


    - Step 3.6.1. Turn off sendmail daemon mode


    Edit /etc/sysconfig/sendmail to read:


    ```

    DAEMON=no

    QUEUE=15m

    ```


    The QUEUE option controls how often sendmail will "wake up" to process the outgoing
    mail queue, is set at 15 minutes in the above example. After saving the edited
    /etc/sysconfig/sendmail, restart the sendmail daemon:


    ```

    [root]# /etc/rc.d/init.d/sendmail restart

    ```


    - Step 3.6.2. Define SMTP server for mail clients


    Red Hat, like most Linux distributions, with a large number of User Mail Agents
    (MUAs), including mail (aka Mail), elm, mut, pine, pbm, exnh, and Netscape. Each
    of these programs can be configured to send mail through an external MTA. Depending
    on the requirements for the organization, the external MTA will handle relaying
    the program to its final destination and address translation.


    The program (/bin/mail, aka /usr/bin/Mail), elm, mut, and pine will all invoke
    sendmail stand-alone to deliver the mail to the given e-mail address, thus their
    configuration does not include an entry for an SMTP server. The assumption here,
    however, is that your organization has an SMTP server that handles relaying all
    outbound electronic mail.


    # Step 3.6.2.1. Set out-bound SMTP server for sendmail


    You direct sendmail to relay all out-bound mail to the SMTP server with the SMART_HOST
    feature. There are two ways to do this, using m4 macros, or /etc/sendmail.cf directly.
    Using m4 macros for anything other than the simplest modifications to /etc/sendmail.cf
    is the preferred method, and is discussed in Step 4.4. For now, the simplest way
    to set the out-bound SMTP server for sendmail is to edit /etc/sendmail.cf directly.
    Look for a line that starts with DS (this should be near the top of the file,
    just after a heading that says “local info”). Edit this line to read:


    DSmtp.my.domain


    where smtp.my.domain is the fully qualified domain name of the SMTP server. To
    cover all bases for locally delivered mail, too, search for the lines that start
    with the two-letter combinations "DR","DH", and "DM" edit them accordingly:


    DRmtp.my.domain

    Hsmtp.my.domain

    DM.my.domain


    This will handle unqualified addresses (which do without any domain portion),
    and sets the masquerade address, respectively. Save /etc/sendmail.cf and restart
    sendmail.


    # Step 3.6.2.2. Set out-bound SMTP server for other mail clients


    As mentioned above, Pine will default using sendmail on the localhost for sending
    mail. You can set the SMTP server directly in Pine from the main menu by selecting
    "S" for setup, "C" for config, moving down to the field labeled smtp-server and
    entering the hostname of the SMTP server.


    The "new MH message system", nmh, and its X Window front-end, can be configured
    to use an external server by editing the file /etc/nmh/mts.conf. Edit the servers:
    option, replacing the default "localhost" with the hostname of the SMTP server.


    The SMTP server is set in Netscape Messenger by selecting the Edit->Preferences
    dialog, selecting Mail & Newsgroups->Mail Servers, and placing the hostname of
    the SMTP server in the window under Outgoing Mail.


    # STEP 3.7 NFS CLIENT-SIDE SECURITY


    A typical workstation does not need to export directories to be NFS-mounted by
    another computer. The Network File System has inherent security problems because
    the Remote Procedure Call (RPC) mechanism it relies on uses IP number and UID
    for authentication, opening NFS to IP spoofing attacks.


    - Step 3.7.1. Turn off NFS exports and remove NFS daemons


    If there is no alternative to exporting NFS mount points, see Step 4.6 for information
    on limiting access and permissions, otherwise turn off NFS and remove the software
    completely:


    ```

    [root]# /etc/rc/init.d/nfs stop

    Shutting down NFS services: [ OK ]

    Shutting down NFS mount: [ OK ]

    Shutting down NFS daemon: [ OK ]

    Shutting down NFS quotas: [ OK ]

    Shutting down NFS statd: [ OK ]

    [root]# rpm -e knfsd

    ```


    - Step 3.7.2. Configure local NFS mounts


    Even with the NFS daemons deleted from the workstation, you can still mount NFS
    directories from a central server as long as the NFS file system is compiled into
    the kernel. For a workstation environment, this is the normal use of NFS. For
    example, say you are a member of a software development team and the code for
    your project is mounted on a central server called project in the directory /usr/src/src/devel.
    You wish to mount this directory on your workstation at m/devel. Since all you
    need to do is copy source files in and out, mount the directory with the following
    options:


    rw Mount read-write

    hard Do a "hard" mount, i.e. hang if the server does not respond

    noexec Do not allow executing binaries

    nosuid Do not honor set-uid or set-gid bits (redundant with noexec)

    nodev Do not interpret character or block files

    '
