    ## APPENDIX D

    A strong packet firewall ruleset


    # Remote interface, claiming to be local machines, IP spoofing, get lost & log

    `/sbin/ipchains -A input -j REJECT -i $EXTIF -s $INTLAN -d $UNIVERSE $LOGGING`


    # DHCP Clients.


    # If you get a dynamic IP address for your ADSL or Cablemodem connection, you

    # will need to enable these lines.


    # Enabled by default.

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p udp -s $UNIVERSE -d $BROCAST/0`

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $UNIVERSE -d $BROCAST/0`


    # FTP: Allow external users to connect to the Linux server ITSELF for

    # PORT-style FTP services. This will NOT work for PASV FTP transfers.


    # Disabled by default.

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $UNIVERSE -d $EXTIF ftp`

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $UNIVERSE -d $EXTIF ftp-data`


    # HTTP: Allow external users to connect to the Linux server ITSELF for

    # HTTP services.


    # Disabled by default.

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $UNIVERSE -d $EXTIF http`


    # ICMP: Allow ICMP packets from all external TCP/IP addresses.


    # NOTE: Enabling ICMP packets via the firewall rules can do more than

    # just stop people from pinging your machine.

    # associated applications rely on various ICMP messages. Without ICMP, it

    # your Linux server and internal Masqueued computers might not work.


    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p icmp -s $UNIVERSE -d $EXTIF`


    # NFS: Reject NFS traffic FROM and TO external machines.


    # NOTE: NFS is one of the biggest security issues an administrator will face.

    # Do NOT enable NFS over the Internet or any non-trusted networks unless you

    # know exactly what you are doing.


    `/sbin/ipchains -A input -j REJECT -i $EXTIF -p tcp -s $UNIVERSE -d $EXTIF 2049`

    `/sbin/ipchains -A input -j REJECT -i $EXTIF -p tcp -s $UNIVERSE 2049 -d $EXTIF`


    # NNTP: Allow external computers to connect to the Linux server ITSELF

    # for NNTP (news) services.


    # Disabled by default.

    `#/sbin/ipchains -A input -j ACCEPT $EXTIF -p tcp -s $UNIVERSE -d $EXTIP ntp`


    # NNTP: Allow external computers to connect to the Linux server ITSELF for

    # NTP (time) updates


    # Disabled by default.

    `#/sbin/ipchains -A input -j ACCEPT $EXTIF -p tcp -s $UNIVERSE -d $EXTIP ntp`


    # TELNET: Allow external computers to connect to the Linux server ITSELF for

    # TELNET access.


    # Disabled by default.

    `#/sbin/ipchains -A input -j ACCEPT $EXTIF -p tcp -s $UNIVERSE -d $EXTIP telnet`


    # SSH server: Allow external computers to connect to the Linux server

    # for SSH access.


    # Disabled by default.

    `#/sbin/ipchains -A input -j ACCEPT $EXTIF -p tcp -s $UNIVERSE -d $EXTIP ssh`


    # Incoming Traffic on all Interfaces


    # This will control input traffic for all interfaces. This is

    # usually used for what could be considered as public services.


    `echo "" - Setting input filters for public services (all interfaces)."`


    # AUTH: Allow the authentication protocol, indent, to function on all

    # interfaces but disable it in /etc/inetd.conf. The reason to

    # allow this traffic in block via iptables is because some

    # legacy TCP/IP stacks don''t deal with REJECTed "auth" requests

    # properly.

    `#/sbin/ipchains -A input -j ACCEPT -p tcp -s $UNIVERSE -d auth`


    # BOOT/DHCP: Reject all stray boot traffic.


    # Disabled by default.

    `#/sbin/ipchains -A input -j REJECT -p udp -s $UNIVERSE bootpc`


    - DNS: If you are running an authoritative DNS server, you must open up the DNS
    ports on all interfaces to allow lookups. If you are running a caching DNS server,
    you will need to at least open DNS ports to internal interfaces.


    - It is recommend to secure DNS by restricting zone transfers and servers as documented
    in Step 4. Disabled by default.

    `#/sbin/ipchains -A input -j ACCEPT -p tcp -s $UNIVERSE domain`

    `#/sbin/ipchains -A input -j ACCEPT -p udp $UNIVERSE domain`


    - RIP: Reject all RIP traffic. Many properly configured networks propagate routing
    protocols to the edge of the network. The follow line will allow explicitly filter
    it without logging to SYSLOG. Disabled by default.

    `#/sbin/ipchains -A input -j REJECT -p udp $UNIVERSE route`


    - Samba: Reject all Samba traffic. Many networks propagate chatty SMB protocols
    to the edge of the network. The follow line will allow explicitly filter it here
    without logging to SYSLOG. Disabled by default.

    `#/sbin/ipchains -A input -j REJECT -p udp $UNIVERSE netbios-ns`

    `#/sbin/ipchains -A input -j REJECT -p udp $UNIVERSE netbios-d`


    - SMTP: If this server is an authoritative email server, you must allow SMTP traffic
    to all interfaces. Disabled by default.

    `#/sbin/ipchains -A input -j ACCEPT -p tcp $UNIVERSE -d smtp`


    - Explicit Input access from external Hosts: This controls external access from
    specific external hosts (secure hosts). This example FTP, FTP-DATA, SSH, POP3
    and TELNET traffic from a secure host INTO the firewall. In addition to these
    input rules, we must explicitly allow the traffic from the remote host to get
    out. See the rules in the output section for more details.

    `echo - Setting filters for external hosts.` (Wait, the text says "echo - Setting
    filters for external hosts", correcting based on context)

    `echo - Setting input filters for external hosts.`


    - The secure host

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $SECUREHOST ftp`

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $SECUREHOST ftp-data`

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $SECUREHOST ssh`

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $SECUREHOST pop3`

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $SECUREHOST telnet`

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $SECUREHOST2 ftp`

    `/sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $SECUREHOST2 ftp-data`


    # Port Forwarding


    # Port forwarding allows external traffic to directly connect to an INTERNAL Masqued
    machine. An example need for port forwarding is the need for external users to
    directly connect a WWW server behind the MASQ server.


    > NOTE: Port forwarding is well beyond the scope of this documentation to explain
    the security issues involved in opening up access like this. Please see Appendix
    A to read the IP-MASQ-HOWTO for a full explanation.


    # Do not use ports greater than 1023 for redirection ports.


    # Disabled by default.

    `echo " Enabling Port Forwarding onto internal hosts."`

    `/usr/sbin/ipmasqd portfw -f -`

    `#echo " Forwarding SSH traffic on port 26 to $PORTFWIP"`

    `/usr/sbin/ipmasqd portfw -a -p tcp -l $EXTIP 26 -R $PORTFWIP`


    # HIGH PORTS:


    # Enable all high unprivileged ports for all reply TCP/UDP traffic


    > NOTE: The use of the "-y" flags TCP traffic that doesn''t have the SYN bit.
    In other words, this means that any traffic trying to initiate traffic to your
    server on a HIGH port will be rejected.


    # The only HIGH port traffic that will be accepted is either return traffic that
    the server initiated or UDP-based traffic.


    # NOTE2: Please note that port 20 for ACTIVE FTP sessions should NOT use SYN filtering.
    Because of this, we must specifically allow it in.

    `echo " Enabling all input REPLY (TCP/UDP) traffic on high ports."`


    `/sbin/ipchains -A input -j ACCEPT ! -y -p tcp -s UNIVERSE -d $EXTIP $UNPRIVPORTS`

    `/sbin/ipchains -A input -j ACCEPT -p tcp -s UNIVERSE ftp-data -d $EXTIP $UNPRIVPORTS`

    `/sbin/ipchains -A input -j ACCEPT -p udp -s UNIVERSE -d $EXTIP $UNPRIVPORTS`


    # Catch All Input Rule


    `echo " - Final input catch all rule."`


    # All other incoming is denied and logged.

    `/sbin/ipchains -A input -j REJECT -s UNIVERSE -d $UNIVERSE $LOGGING`


    *****************************************************************\*\*\***

    # Output Rules

    *****************************************************************\*\*\*\*\*

    echo ""

    echo "Output Rules:"


    # Outgoing Traffic on the Internal LAN

    # This ruleset provides policies for traffic that is going out on the internal

    # LAN.


    # In this example, all traffic is allowed out. Therefore there is no

    # requirement to implement individual filters. However, as with the input

    # section above, examples are given for demonstrative purposes. It is also

    # noted that the same rules, outlined above, applying regarding the order of the

    # filtering rules.


    echo " - Setting output filters for traffic on the internal LAN."


    # Local interface, any source going to local net is valid.

    `/sbin/ipchains -A output -j ACCEPT -i $INTIF -s UNIVERSE -d $INTLAN`


    # Loopback interface is valid.

    `/sbin/ipchains -A output -j ACCEPT -i $LOOPBACKIF -s UNIVERSE -d $UNIVERSE`

    '
