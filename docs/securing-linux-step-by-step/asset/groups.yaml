    # SECURING LINUX STEP-BY-STEP VERSION 1.0


    # STEP 5 Tuning and Packet Firewalls


    # STEP 5.2 SYSTEM OPTIMIZATIONS


    Out of the box, Red Hat, and most distributions, does not take full advantage
    of modern hardware. By minimizing optimizations, Linux will run on more legacy
    hardware. By tuning a step at a time, reliability and stability are maintained
    and performance is increased.


    +   Step 5.2.1. TCP/IP Receive Window size


    The TCP/IP acknowledgment (ACK) receive window or RWIN defaults to a value of
    0. For modern day Ethernet and Fast Ethernet networks, this is less than optimal.
    To fix this, edit /sbin/ifup and make the following changes:


    +   Line 110: route add -net $(NETWORK) netmask $(NETMASK) $(DEVICE)

    route add -net $(NETWORK) netmask $(NETMASK) window 16384 $(DEVICE)


    +   Line 112: route add -host $(IPADDR) $(DEVICE)

