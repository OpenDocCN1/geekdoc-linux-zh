    \         granted\n```\n\n```\n>> Rule         /etc/hosts.deny line 9:\ndaemons:\
    \        all\nclients:       all\naccess:         denied\n```\n\nNote the warning\
    \ about host.example.org saying that it was not found in a lookup. This tells\
    \ you you may have mistyped or erroneously entered the hostname (in this case\
    \ this hostname is fictitious). Note that tcpchk will issue warnings about other\
    \ services that are not listed in /etc/inetd.conf, which are compiled with TCP\
    \ wrappers support, such as portmap for RPC errors (see Step 4.6.1) and sshd for\
    \ Secure Shell (see Step 4.2.3). These warnings can be ignored.\n"
