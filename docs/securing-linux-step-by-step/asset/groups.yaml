    \n### 步骤 2.7.3. 配置允许/不允许登录系统的系统账户\n\n`/etc/security/access.conf` 包含系统中所有账户的登录参数。你可以类似于第\
    \ 3.2 节描述的 TCP wrappers 方式，配置哪些用户通过哪些服务登录。要禁用 root 账户和管理员以外的所有控制台登录，请在 `/etc/security/access.conf`\
    \ 中放入：\n\n```\n:ALL EXCEPT root admin :console\n```\n\n### 步骤 2.7.4. 配置允许/不允许使用特定资源的系统组\n\
    \n`/etc/security/group.conf` 定义了哪些用户可以访问具有特定的文件。\n\n`/etc/security/limits.conf`\
