    Nmap version 2.2-BETA4 (the latest version of this writing) comes with a Gtk GUI
    front-end called

    mape. The GUI makes it easy to select the host(s)/network to scan and configure
    the options for scanning.

    The output from the nmap run is printed in its own window and can be stored in
    a log for later

    comparison and study.


    +   Step 6.3.4 Commercial products


    Internet Security Systems (http://www.iss.net) markets commercial tools for host-based
    security

    assessmentSystem Scanner™), host- and network-based intrusion detection (RealSecure™),
    and network

    vulnerability scanning (Internet Scanner™). ISS products are mature professionals.
    Evaluation copies of

    System Scanner and Internet Scanner are available free for download. The evaluation
    copies work only

    the localhost.

    Network Associates, Inc. (http://www.nai.com) markets CyberScanner, which performs
    network

    vulnerability scanning for hosts, firewalls, hubs and switches. CyberCop is extensible
    through the Custom

    Audit Script Language (CASL). It has an automatic update feature to keep the software
    and vulnerability

    database up to date.


