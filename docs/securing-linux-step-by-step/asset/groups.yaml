    # your Linux server and internal Masqed computers might not work.


    /sbin/ipchains -A input -j ACCEPT -i $EXTIF -p icmp -s $UNIVERSE -d $EXTIF


    # NFS: Reject NFS traffic FROM and TO external machines.


