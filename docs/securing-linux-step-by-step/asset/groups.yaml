    一旦服务关闭，可以考虑完全删除该软件包。这可以释放磁盘空间并增强安全性，因为本地用户无法滥用不存在的服务。


    ## 步骤 3.3.3. 检查是否存在剩余服务


    返回步骤 3.3.1，并使用 `netstat` 和 `lsof` 命令重复操作，检查是否有任何剩余的网络服务，并禁用它们，直到所有网络服务都关闭。


    ## 步骤 3.4 获取软件的最新版本


    在接下来的步骤中，我们将讨论如何提高所选服务的安全性。你应该只启用完成工作所需的极少数服务集。在启用任何服务之前，请确保你已拥有最新版本的软件。所有的 Linux
    发行版在跟进安全相关的漏洞修复方面做得很好，并定期更新其 FTP 站点以发布最新软件版本。


    - 步骤 3.4.1. 查找安全相关的更新


    更新的软件（在 Red Hat 的术语中称为“errata”）可以在其网站 http://www.redhat.com/corp/support/errata
    上找到，其他发行版的更新位置请参见附录 A。Red Hat 重新设计了 Red Hat 6.0 的 errata 页面，其中一列是安全相关的更新，另一列是其他软件包更新。至少，你应该检查并获取所有安全相关的更新。


    - 步骤 3.4.2. 下载更新


    更新软件包的 FTP URL 直接包含在 errata 页面中，因此可以直接通过你的 Web 浏览器下载软件包。一种良好的做法是创建一个单独目录（例如 `/usr/local/updates`），并将更新的软件包放在那里。也可以从
    http://updates.redhat.com 批量下载更新软件包。选择对应版本和架构的目录，例如 `6.0/i386`，并将所有文件下载到 `/usr/local/updates`。周复复地这样做可能会非常枯燥，有关自动化此过程的信息，请参阅步骤
    3.4。


    RPM 能够通过提供包名的 URL 直接在网络上安装软件包；这消除了对独立下载目录的需求。对于连接较慢且/或不可靠的网络连接（如现代线路）的工作站，最好下载软件包并从本地副本安装，而不是在更新过程中让网络连接断开或挂起。


    ## 步骤 3 安全工作站网络配置


    ## 步骤 3.4.3. 安装更新


    使用 `rpm` 安装更新的说明包含在 errata 页面中。通常，可以如下所示更新软件包：


    ```

    [root]# rpm -Uvh <package-name>

    ```


    例如更新 Samba：


    ```

    [root]# rpm -Uvh samba-2.0.5a-1.i386.rpm

    ```


    若要直接通过网络更新，请提供包包名的 URL：


    ```

    [root]# rpm -Uvh ftp://updates.redhat.com/6.0/i386/samba-2.0.5a-1.i386.rpm

    ```


    如果你已将所有最新更新下载到 `/usr/local/updates`，可以使用以下命令对系统中已安装的软件包进行“刷新（freshen）”：


    ```

    [root]# rpm -F /usr/local/updates/

    ```


    这将只会升级 `/usr/local/updates` 中已安装且版本号较旧的软件包。


    注意，更新内核时请使用 `-i` 表示“安装（install）”而不是 `-U` 表示“升级（upgrade）”。这将保留之前的内核版本（`-U` 选项移除之前的内核），因此如果由于某些原因新内核无法运行，仍可以使用旧内核启动。此外，如果你正在运行模块化内核（特别是在基于
    SCSI 的系统上），在启动更新后的内核之前可能需要重新运行 `mkinitrd`。更多信息请参阅 `mkinitrd(8)` 手页。


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_38_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_38_1.png)


    ## 步骤 3 安全工作站网络配置


    ## 步骤 3.4.4. 自动化流程


    在将工作站用于日常工作之前更新软件包是重要的，但随着时间的推移，保持更新也同样关键。新的漏洞修复和增强不断产生。尝试让本地工作站与更新保持同步可能既枯燥又耗时。


    幸运的是，有几个第三方工具可以自动化检查 FTP 站点是否有新包的过程，甚至可以在无需人工干预的情况下安装更新。你可以在 Metab FTP 站点的 `/utils/package/`
    子目录、Freshman 以及其他流行的 FTP 站点找到这些工具。特定 URL 请参见附录 A。我们在这里只讨论一个程序，但还有其他几个。


    ### 步骤 3.4.4.1. 使用 AutoRPM 自动化更新


    请参附录 A 获取 AutoRPM 主页的 URL。引用 AutoRPM 手页的内容：


    AutoRPM 是一个可以执行以下任意组合的程序：从 FTP 站点镜像 RPM、保持已安装的 RPM 与 FTP 站点或本地目录一致，以及保持集群或网络系统中已安装的
    RPM 一致。它非常灵活。


    要运行 AutoRPM，必须首先安装 `libnet` 库，可以从任何 CPAN 站点获取。如果你不熟悉 Perl CPAN，AutoRPM 的作者贴心地从其网站提供了一个
    RPM 版本。在指南中测试 AutoRPM 时，我们发现该程序确实非常灵活，但安装起来有点复杂。压缩包可能可以使用 Makefile 来简化安装。默认配置对
    Red Hat Linux 效果良好，在浏览手册页后，更改配置以适应其他发行版并不困难。![](img/0aaa698c422b2f7ffe93bff50cbbef96_39_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_39_1.png)


    要安装 AutoRPM，请下载压缩 tar 包并解压：


    ```

    [root]# cd /usr/local/src

    [root]# tar xzf <download-dir>/autorpm\*.tar.gz

    [root]# cd autorpm

    ```


    其中 `<download-dir>` 是下载 tar 包的位置。命令中的通配符是为了避免输入实际版本号（该指南出版时可能已经更改）。


    创建配置文件并安装配置文件、程序和主页：


    ```

    [root]# mkdir --mode 700 /etc/autorpm.d

    [root]# cp autorpm.conf autorpm.d/* /etc/autorpm.d

    [root]# mkdir --mode 700 /etc/autorpm.d/pools

    [root]# cp pools/* /etc/autorpm.d

    [root]# install --owner=root --group=bin --mode=0700 autorpm.pl /usr/sbin/autorpm

    [root]# cp autorpm.8 /usr/local/man/man8

    [root]# cp autorpm.conf.5 /usr/local/man/man5

    ```


    阅读 `autorpm(8)` 和 `autorpm.conf(5)` 手册页，但默认设置适用于 Red Linux。


    以交互模式手动运行 AutoRPM 以检查更新的 RPM：


    ```

    [root]# autorrpm --interactive

    ```


    AutoRPM 将从 `/autorpm.d/pools/redhat-updates` 中列出的 FTP 站点下载包名，并将其与当前安装的软件包集进行比较。默认的
    FTP 站点列表很长。良好的做法是编辑列表，仅保留你已知并信任的站点，例如 `ftp://updates.redhat.com` 以及可能的本地镜像。


