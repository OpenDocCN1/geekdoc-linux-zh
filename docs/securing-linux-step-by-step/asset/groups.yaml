    # Step 3.3.2. Eliminate unnecessary services


    The trick is to know which init script controls which daemon. Most of the daemons
    are controlled by scripts of the same name, the others can be found by using grep
    to search for the name in /etc/rc.d/init.d/*. To eliminate the service, first
    shut down with its init script, then remove the script from the runlevel directory.
    For Red Hat Linux, the easiest way to remove the links from the runlevel directories
    is with the /sbin/chkconfig program, or you can simply delete them. By default,
    chkconfig adds or removes links to scripts in level 3, 4, and 5. It does not delete
    the actual script in /etc/rc.d/init.d. If you are manipulating the runlevel scripts
    at the runtime scripts manually, remember to always remove the startup script
    from both the runlevel 3 and runlevel 5 directories, so that changing the runlevel
    will not unintentionally open network services you thought were turned off.'
