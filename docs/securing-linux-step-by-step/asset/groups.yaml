    \n尽管我们强烈建议你**现在**创建应急软盘，但如果你决定稍后再做，在 Red Hat Linux 中，脚本 `/sbin/mkbootdisk` 将为你创建磁盘。更多信息请参见\
    \ mkbootdisk(8) 页面。\n\n### 步骤 2.6.2. 收紧 /etc/inittab 中的设置\n\n`/etc/inittab` 定义了\
