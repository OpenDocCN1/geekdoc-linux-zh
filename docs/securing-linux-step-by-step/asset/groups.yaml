    # STEP 6 Tools


    Of course, if your host has many ports open, you will still have some work to
    do. To try to guess the operating system of the host at 192.168.1.1, execute:


    ```

    [root]# /nmap -O 192.168.1.1

    ```


    Starting nmap V. 2.2-BETA4 by Fyodor (fyodor@dhp.com, www.insecure.org/nmap)

