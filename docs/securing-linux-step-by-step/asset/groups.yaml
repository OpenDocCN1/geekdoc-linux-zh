    ## STEP 4.10 HYPERTEXT TRANSFER PROTOCOL (HTTP) SERVER


    All major Linux distributions come with the HTTP server software. Apache is designed
    for flexibility and has a wealth of features. Most security-related settings are
    in the main configuration files in /etc/httpd/conf in Red Hat Linux. The file
    httpd.conf sets up basic operating parameters for the HTTP daemon, access.conf
    sets up access rules; and ssl.conf sets up basic server configuration parameters
    like the document root, allowed directories, CGI script requests, and icons for
    indexes.


    See the Apache manual included with Red Hat 6.0, especially the Security Tips,
    http://localhost/manual/misc/security_tips.html, and the description of how sections
    work, http://localhost/manual/sections.html. The Apache manual is also available
    from the Apache Web site at http://www.apache.org/docs/.


    - Step 4.10.1. Set basic access to default deny


    ```

    access.conf, set the root directory access and options to:

    ```

    <Directory /

    Options None

    AllowOverride None

    order deny,allow

    deny from all

    </Directory>

    ```


    By default, access to all directories and files on the server is denied.


    - Step 4.10.2. Selectively open access to specific directories


    In the remainder of access.conf, specify only the access and options absolutely
    necessary. For an Intranet server, access should be allowed only to IP addresses
    on the internal network:


    ```

    <Directory /home/httpd/

    Options None

    AllowOverride None

    order deny,allow

    deny from all

    allow from 192.168.

    </Directory>

    ```


    ## STEP 4 Securing Server Configurations


    ### Step 4.10.3. Selectively allow options on specific directories


    Consider the implications of allowing any of the following Options before you
    set them in the <Directory> directive:


    - ExecCGI: Should only be allowed for CGI directories

    - FollowSymLinks: If users have access to the HTML directories, they can set symbolic
    links to areas that contain sensitive data

    - Includes: Server side includes can be used to bypass default access restrictions

    - IncludesNOEXEC: Safer version of Includes that disables the #exec statement
    and #include of CGI scripts

    - Indexes: The daemon will print a directory listing for any directory without
    an index file (index.html). This may expose the names of files ordinarily hidden


    ### Step 4.10.4. Selectively use .htaccess to override access control


    Changing the AllowOverride directive from None to All tells Apache to look for
    a file named .htaccess in the directory holding the requested file, and to interpret
    the contents of any of the default access and options directives for that directory.
    The advantage is that access and options can be set dynamically without editing
    the configuration file and restarting the server. The disadvantage is that security
    and options settings are no longer specified in a single place, but scattered
    around the directory structure. This can make it more difficult to audit the security
    policy for the Web site. In addition, there is a performance hit for every access,
    since the server has to look for, open and interpret the contents of the file
    for every request.


    ### Step 4.10.5. Use password protection for sensitive data


    Apache allows for protecting directories and files with username/password authentication.
    This provides a moderate level of security, although the username and password
    are passed over the network in the clear and are subject to being sniffed. The
    locally installed Apache manual, http://localhost/manual/mod/directives.html for
    more information on the AuthType, AuthUserFile, and other authentication directives.


    ## STEP 4 Securing Server Network Configurations


    ### Step 4.10.6. Use SSL for secure HTTP communications


    The Sockets Layer (SSL) protocol provides strong authentication and end-to-end
    encryption for TCP sockets. It is often used in conjunction with secure Web applications.
    Open source software implementations of SSL as compile-time extensions to the
    Apache web server.


    **Note:** Administrators of commercial Web sites in the U.S. and other countries
    may be restricted by patent law and licensing using SSL''s RSA encryption software.
    Operators of commercial Web sites should seriously consider purchasing a commercial
    SSL-capable web server. See Appendix A for some pointers to ensure secure web
    vendors.


    **Note also:** Commercial Web sites should have digital certificates recognized
    from Certificate Authorities. The two primary sources for commercial certificates
    are Thawte Consulting (http://www.thawte.com) and Verisign, Inc. (http://www.verisign.com).


    ### Step 4.10.6.1. Download OpenSSL and mod_ssl


    Extract the source for the Apache server from the SRPM, or download the latest
    version from ftp://ftp.apache.org. The version numbers in the example below are
    the latest as the writing of this guide. Check the list for the versions of each
    package.


    ```

    [root] # cd /usr/local/src

    [root] # wget http://ftp.apache.org/dist/apache-1.3.6.tar.gz

    [root] # wget http://ftp.modssl.org/source/mod_ssl-2.3.10-1.3.6.tar.gz

    [root] # wget http://ftp.openssl.org/source/openssl-0.9.3a.tar.gz

    [root] # tar xzf apache-1.3.6.tar.gz

    [root] # tar xzf mod_ssl-2.3.10-1.3.6.tar.gz

    [root] # tar xzf openssl-0.9.3a.tar.gz

    ```


    ### Step 4.10.6.2. Build OpenSSL


    The Makefile for OpenSSL assumes that the Perl interpreter is in /usr/bin/perl5.
    Either edit the Makefile to change this to /usr/bin/perl, or redefine it on the
    command line. The method is illustrated below:


    ```

    [root] # cd openssl-0.9.3a

    [root] # make links PERL=/usr/bin/perl

    [root] # ./Configure gcc

    [root] # make

    [root] # cd ..

    ```


    ### Step 4.10.6.3. Build Apache with mod_ssl module


    Configuration of Apache to use mod_ssl can be done directly from the mod_ssl source
    directory:


    ```

    [root] # cd mod_ssl-2.3.10-1.3.6

    [root] # ./configure --with-apache=../apache_1.3.6 \

    --with-ssl=../openssl-0.9.3a --prefix=/usr/local/apache

    [root] # cd ../apache_1.3.6

    [root] # make

    [root] # make certificate TYPE=test

    [root] # make

    [root] # make install

    ```


    ### Step 4.10.6.4. Start Apache with mod_ssl and test


    Before starting the SSL version of Apache, stop the old daemon from running.


    ```

    [root] # /etc/rc.d/init.d/httpd stop

    [root] # /usr/local/apache/sbin/apachectl startssl

    ```


    To test the server, from another host, enter:


    ```

    [root] # netscape://server-name/

    ```


    After netscape prompts to accept the test certificate, a screen that says ''It
    Worked!'' should be displayed.


    ### Step 4.10.6.5. Read the mod_ssl documentation


    Read https://server-name/manual/mod/mod_ssl/ thoroughly. You may especially want
    to read the FAQ in this manual to learn how to create digital certificates.


    ## SECURING LINUX STEP-BY-STEP VERSION 1.0


    ## STEP 5 Tuning and Packet Firewalls


    ## STEP 5.2 SYSTEM OPTIMIZATIONS


    Out of the box, Red Hat, and most distributions does not take full advantage of
    modern hardware. By minimizing optimizations, Linux will run on more legacy hardware.
    By tuning a step at a time, reliability and stability are maintained and performance
    is increased.


    ### Step 5.2.1. TCP/IP Receive Window size


    The TCP/IP acknowledgment (ACK) receive window or RWIN defaults to a value of
    0. For modern day Ethernet and Fast Ethernet networks, this is less than optimal.
    To fix this, edit /sbin/ifup and make the following changes:


    - Line 110: route add -net $(NETWORK) netmask $(NETMASK) $(DEVICE)

    route add -net $(NETWORK) netmask $(NETMASK) window 16384 $(DEVICE)


    - Line 112: route add -host $(IPADDR) $(DEVICE)

    route add -host $(IPADDR) window 16384 $(DEVICE)


    - Line 117: route add default gw $(GATEWAY) metric 1 $(DEVICE)

    route add default gw $(GATEWAY) window 16384 $(DEVICE)


    - Line 125: route add default gw $(GATEWAY) $(DEVICE)

    route add default gw $(GATEWAY) window 16384 $(DEVICE)


    - Line 134: route add default gw $gw $(DEVICE)

    route add default gw $gw window 16384 $(DEVICE)

