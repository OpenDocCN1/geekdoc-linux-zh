    # STEP 4.7 SERVER MESSAGE BLOCK (SMB) SAMBA SERVER


    The SMB protocol is the core of the Common Internet File System developed by Microsoft
    for file and printer sharing. The idea behind Samba is to make a UNIX server look
    exactly like any NT server to its clients in the network neighborhood. Setting
    up the Samba software itself is relatively simple, but there are a number of nuances
    to successfully integrating it into the office environment. Samba server administrators
    should review the extensive documentation that comes with the server, and the
    book “Samba: Integrating UNIX and Windows,” Blair, SSC, Inc. ISBN 1-57831-006-7.


    +   * STEP 4.7.1. Get the latest version of Samba


    As of this writing, updated packages for Red Hat version 6.0 have been issued
    for Samba to correct problems. Check the updates for your distribution, and make
    sure that you have installed Samba version 2.0.5a or later.


    +   * STEP 4.7.2. Limit access to specific hosts


    Edit the /etc/smb.conf in the [global] section to set up the list of hosts that
    are allowed access to the Samba server and the interfaces that the Samba server
    will listen on:


    ```

    hosts allow = .example.org 128.184.

    interfaces 192.168.0.1/24 127.0.0/32

    bind interfaces only = true

    ```


    +   * STEP 4.7.3. Use encrypted passwords


    Before setting up Samba to use encrypted passwords, read

    /usr/doc/samba-2.0.5a/docs/textdocs/ENCRYPTION.txt.


    Red Hat Linux 6.0 defaults to looking for Samba passwords in /etc/smbpasswd. Other
    distributions may use /etc/samba.d/smpasswd, or a different path entirely. The
    path is in the configuration file /etc/smb.conf. You can create a template /etc/smbpasswd
    with the following command:


    ```

    [root]# mksmbpasswd.sh < /etc/passwd >/etc/smbpasswd

    [root]# chmod 006 /etc/smbpasswd

    ```


