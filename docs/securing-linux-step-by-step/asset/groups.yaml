    later versions, since problems and bugs are corrected in the version 1 source
    occasionally.


    ```

    [root]# wget ftp://ftp.cs.hut.fi/pub/ssh/ssh-1.2.27.tar.gz

    [root]# xzf ssh-1.2.27.tar.gz

    [root]# cd ssh-1.2.27

    [root]# ./configure --with-libwrap --without-rsh --disable-suid-ssh --disable-scp-stats

    [root]# make

    [root]# make install

    ```


    The options to the configure script do the following: compile the SSH daemon support
    for TCP wrappers; disables all support for rsh as a fall-back option; disables
    the set-uid bit on the SSH client; and turns off the printing of on-screen statistics
    by the secure copy program, scp (to emulate the behavior of rcp).


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_50_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_50_1.png)'
- md: "\n## Step 4.2.2. Start the SSH daemon\n\nThe SSH daemon, sshd, should be started\
    \ at boot time and remain running as long as the server is up. A simple means\
    \ for doing this is to add the line:\n\n```\n/usr/local/sbin/sshd\n```\n\nto /etc/rc.d/rc.local,\
    \ where it will be executed after all other boot-time programs are started.\n\n\
    See Appendix C for a Red Hat-centric SYSV-init script using the daemon and killproc\
    \ functions. See this script into /etc/rc.d/init.d/sshd, and link it into the\
    \ runlevel directories:\n\n```bash\n[root] for i in /etc/rc.d/rc[345].d; do (cd\
    \ $; ln -s ../init.d/sshd S50sshd); done\n```\n\nor, alternatively:\n```bash\n\
    [root] chkconfig sshd on\n```\n\nto start the daemon now, without rebooting:\n\
    ```bash\n[root]# /etc/rc.d/init.d/sshd\n```\n\n## Step 4.2.3. Set up /etc/hosts.allow\
    \ for SSH access\n\nCompiling SSH with the -with-libwrap configure option allows\
    \ sshd to perform TCP-wrapper-style access control, inspecting the /etc/hosts.allow\
    \ and /etc/hosts.deny files for each request. The syntax and options are exactly\
    \ the same as any TCP-wrapped service, and the service name is sshd. For example:\n\
    \n```\n# Allow SSH access to anyone in our domain or the goodguys.org domain\n\
    sshd: LOCAL .goodguys.org\n```\n\n## Step 4.2.4. Generate SSH keys\n\nSSH performs\
    \ user authentication and the exchange of session encryption keys using RSA cryptographic\
    \ public keys. Each user who is allowed to access the server must generate a public/private\
    \ key pair on the workstation that they will use to access the server, and the\
    \ public key must be placed on the server in the account that they wish to log\
    \ in.\n\nOn remote workstation, install SSH as per the instructions, then in your\
    \ regular user account do:\n\n```bash\n[user]$ ssh-keygen\n```\n\nThe key generator\
    \ will compute the public and private key pair and prompt for the file to save\
    \ them in, defaulting to ./identity in your home directory. Accept the default\
    \ location. Then you will be asked to enter a passphrase.\n\nAbout passphrases:\
    \ you are not required to enter one, and if you don't, SSH will not prompt you\
    \ for a passphrase when it uses the key (like when you start a login session,\
    \ for example). This is especially handy if you plan to automate ssh or scp (SSH\
    \ secure copy) in scripts. The downside is that if your workstation and account\
    \ are compromised, the attacker will be able to access the server without entering\
    \ a passphrase.\n\nFor ordinary shell and file copy access to the server, it is\
    \ best to use a passphrase, keeping in mind all the rules for selecting good passwords.\
    \ If there is a need for automated, non-interactive access to the server using\
    \ SSH, consider ssh-agent and ssh-add. The agent is a process that handles private\
    \ keys for use by ssh and the ssh-add program communicates with ssh-agent and\
    \ sends it the key, prompting for the passphrase if necessary. After your key\
    \ is stored by ssh-agent, you will not need to enter a passphrase again for the\
    \ remainder of the login session. See the manuals for ssh-agent(1) and ssh-add(1)\
    \ for more information.\n\nWhen ssh-keygen is done, there will be two files in\
    \ the .ssh directory, identity and identity.pub. The former is your binary private\
    \ key, the latter is an ASCII file with your public key. The public key has to\
    \ be stored on the server before you can use SSH to log in.\n\n## STEP 4 Securing\
    \ Server Network Configurations\n\nThe safest way to transport the public key\
    \ to the server is \"sneaker-net\", i.e., copy the key to the floppy and carry\
    \ it to the server. Transmitting the public key over the network is generally\
    \ safe, though. Even if the public key is sniffed off the network, it is useless\
    \ without the private key and it is extremely difficult, if not impossible, to\
    \ derive one from other. Never send the private key over the network, and make\
    \ sure that the .ssh/identity file has 0600 permissions and is owned by you.\n\
    \nOnce the key is copied to the server, put it in the home directory of the account\
    \ you wish to access (we'll use root account in our example) and assume the public\
    \ key is in the file identity.pub in home directory.\n\n```bash\n[root] cd ~\n\
    [root] mkdir .ssh\n[root] cat identity.pub >> .ssh/authorized_keys\n[root] chmod\
    \ 600 .ssh/authorized_keys\n```\n\nThe authorized_keys file holds the public keys\
    \ for every user that is granted access. If you copy more than one using the method\
    \ above, be careful with redirection; make sure to append (>>) to the file, not\
    \ overwrite it (>).\n\n### 4.5. Use ssh and scp for remote access\n\nWith the\
    \ SSH daemon running on the server, and the public key of workstation account\
    \ in /root/.authorized_keys, you may now use SSH to access the server from your\
    \ workstation. The ssh command works like rsh. To open a login shell or execute\
    \ a command:\n\n```bash\n[user@workstation]$ ssh -l root server \"ls\"\n```\n\n\
    The scp command works like rcp. To copy a file to the server:\n\n```bash\n[user@workstation]$\
    \ scp File root@server:~\n```\n\nTo copy lots of files from the server:\n\n```bash\n\
    [user@workstation]$ scp root@server:* ./backup_dir\n```\n\n## Step 4.2.6. Replace\
    \ “r” programs with SSH\n\nOnce SSH is installed and working, there is no need\
    \ to have the “r” clients (login, rsh, or rcp) or server daemons (in.login, in.rshd,\
    \ in.rexec) on the workstation or the server at all. Even if they have been commented\
    \ out of /etc/inetd.conf, removing the programs is the safest course.\n\n```bash\n\
    [root]# rpm -e rsh\n```\n\nOnce the “r” programs are gone, SSH programs can be\
    \ put in their place:\n\n```bash\n[root]# ln -s /usr/local/bin/ssh /usr/bin/rsh\n\
    [root]# ln -s /usr/local/bin/ssh /usr/bin/rlogin\n[root]# ln -s /usr/local/bin/scp\
    \ /usr/bin/rcp\n```\n\n## STEP 4.3 DOMAIN NAME SERVICE AND BIND VERSION 8\n\n\
    Red Hat 6.0 ships with BIND version 8.2, the latest version available as of this\
    \ writing. Administrators of earlier releases of Red Hat and other distributions\
    \ should check the version of BIND they are running. If you are running BIND Version\
    \ 4, upgrade to BIND version 8.2. If you are running 8.1.1 or earlier you must\
    \ upgrade to BIND Version 8.1.2 or later, the earlier versions have a known remote\
    \ root exploit. Check the updates for your distribution, or download the latest\
    \ source from http://www.isc.org.\n\n## Step 4.3.1. Restrict transfer zones\n\n\
    Configure the primary name server to perform transfer zones only to its slave\
    \ servers, use the allow-transfer option for the zone in /etc/named.conf, and\
    \ specify the IP address of only slave servers for the zone:\n\n```\nzone \"notransfer.com\"\
    \ {\n\ttype master;\n\tfile \"db.notransfer.com\";\n\tallow-transfer ( 192.168.1.1;\
    \ 192.168.2.1; );\n};\n```\n\n```\nzone \"notransfer.com\" {\n\ttype slave;\n\t\
    masters ( 192.168.0.1; );\n\tallow-transfer ( none );\n};\n```\n"
  mdcn: "\n\n## Step 4.2.2. 启动 SSH 守护进程\n\nSSH 守护进程 sshd 应该在启动时启动，并在服务器运行期间保持运行。实现此点的一种简单方法是将此行：\n\
    \n```\n/usr/local/sbin/sshd\n```\n\n添加到 /etc/rc.d/rc.local 中，它将在所有其他启动时程序启动后执行。\n\
    \n请参录录 C，获取使用 daemon 和 killproc 函数的以 Red Hat 为中心的 SYSV-init 脚本。将此复制到 /etc/rc.d/init.d/sshd，并将其链接到运行级别目录：\n\
    \n```bash\n[root] for i in /etc/rc.d/rc[345].d; do (cd $; ln -s ../init.d/sshd\
    \ S50sshd); done\n```\n\n或者，替代方案：\n```bash\n[root] chkconfig sshd on\n```\n\n\
    以便在不重启的情况下现在启动守护进程：\n\n```bash\n[root]# /etc/rc.d/init.d/sshd\n```\n\n## Step\
    \ 4.2.3. 设置 /etc/hosts.allow 用于 SSH 访问\n\n使用 -with-libwrap 配置选项编译 SSH 允许 sshd\
    \ 执行 TCP-wrapper 风格的访问控制，为每个请求检查 /etc/hosts.allow 和 /etc/hosts.deny 文件。其语法和选项与任何\
    \ TCP-wrapped 服务完全相同，且服务名称为 sshd。例如：\n\n```\n# 允许我们域名或 goodguys.org 域名中的任何人进行\
    \ SSH 访问\nsshd: LOCAL .goodguys.org\n```\n\n## Step 4.2.4. 生成 SSH 密钥\n\nSSH 使用\
    \ RSA加密公钥执行用户身份验证和会话加密密钥的交换。每个允许访问服务器的用户都必须在其用于访问服务器的工作站上生成公/私钥对，并将公钥存放在服务器上其想要登录的账户中。\n\
    \n在远程工作站上，按照说明安装 SSH，然后在你的普通用户账户中执行：\n\n```bash\n[user]$ ssh-keygen\n```\n\n密钥生成器将计算公钥和私钥对，并提示保存它们的文件，默认为家目录下的\
    \ ./identity。接受默认位置。然后你将被要求输入密码短。\n\n关于密码短：你并不需要输入一个，如果你不输入，SSH 在使用密钥时将不会提示输入密码短（例如在启动登录会话时）。如果你计划在脚本中自动化\
    \ ssh 或 scp（SSH 安全复制），这特别有用。缺点是，如果你的工作站和账户被破解，攻击者将无需输入密码短即可访问服务器。\n\n对于对服务器的普通\
    \ shell 和文件复制访问，最好使用密码短，并记住选择良好密码的所有规则。如果需要使用 SSH 进行自动化、非交互式的访问服务器，请考虑 ssh-agent\
    \ 和 ssh-add。agent 是一个处理 ssh 使用私钥的进程，ssh-add 程序与 ssh-agent 通信并向其发送密钥，必要时提示密码短。在你的密钥被\
    \ ssh-agent 存储后，在登录会话剩余时间内你不需要再次输入密码短。更多信息请参见 ssh-agent(1) 和 ssh-add(1) 的手册。\n\
    \n当 ssh-keygen 完成后。.ssh 目录下有两个文件：identity 和 identity.pub。前者是你的二进制私钥，后者是带有公钥的 ASCII\
    \ 文件。在可以使用 SSH 登录之前，必须将公钥存储在服务器上。\n\n## STEP 4 安全服务器网络配置\n\n将公钥传输到服务器的最安全方法是“肉体网络”，即将密钥拷贝到软盘并带到服务器。尽管如此，通过网络传输公钥通常是安全的。即使公钥在网络上被截获，没有私钥它也是无用的，而且从其他密钥推导出极其困难，甚至是不可能的。永远不要通过网络发送私钥，并确保\
    \ .ssh/identity 文件具有 0600 权限并归你所有。\n\n一旦密钥复制到服务器，将其放在你想要访问的账户的家目录下（我们在示例中使用 root\
    \ 账户），假设公钥位于家目录下的 identity.pub 文件中。\n\n```bash\n[root] cd ~\n[root] mkdir .ssh\n\
    [root] cat identity.pub >> .ssh/authorized_keys\n[root] chmod 600 .ssh/authorized_keys\n\
    ```\n\nauthorized_keys 文件持有每个授权访问用户的公钥。如果你使用上述方法复制了多个密钥，请小心重定向；确保是追加 (>>) 到文件，而不是覆盖它\
    \ (>)。\n\n### 4.5. 使用 ssh 和 scp 进行远程访问\n\n当服务器上运行 SSH 守护进程，且工作站账户的公钥位于 /root/.authorized_keys\
    \ 时，你现在可以使用 SSH 从工作站访问服务器。ssh 命令的工作原理类似于 rsh。要打开登录 shell 或执行命令：\n\n```bash\n[user@workstation]$\
    \ ssh -l root server \"ls\"\n```\n\nscp 命令的工作原理类似于 rcp。要将文件复制到服务器：\n\n```bash\n\
    [user@workstation]$ scp File root@server:~\n```\n\n要从服务器拷贝大量文件：\n\n```bash\n[user@workstation]$\
    \ scp root@server:* ./backup_dir\n```\n\n## Step 4.2.6. 用 SSH 替换 “r”程序\n\n一旦 SSH\
    \ 安装并正常运行，就不再需要在工作站或服务器上保留任何“r”客户端（login, rsh 或 rcp）或服务器守护进程（in.login, in.rsh,\
    \ in.rexec）。即使它们在 /etc/inetd.conf 中被注释掉，删除这些程序也是安全的。\n\n```bash\n[root]# rpm -e\
    \ rsh\n```\n\n一旦“r”程序被删除，可以将 SSH 程序放在它们的位置：\n\n```bash\n[root]# ln -s /usr/local/bin/ssh\
    \ /usr/bin/rsh\n[root]# ln -s /usr/local/bin/ssh /usr/bin/rlogin\n[root]# ln -s\
    \ /usr/local/bin/scp /usr/bin/rcp\n```\n\n## STEP 4.3 域名服务和 BIND 版本 8\n\nRed Hat\
    \ 6.0 带有 BIND 8.2 版本，这是本文当时的最新版本。早期 Red Hat 及其他发行版的管理员应该检查他们运行的 BIND 版本。如果你运行\
    \ BIND 版本 4，请升级到 BIND 8.2。如果你运行 8.1.1 或更早版本，必须升级到 BIND 8.1.2 或更高版本，早期版本存在远程 root\
    \ 漏洞。检查你发行版的更新，或从 http://www.isc.org 下载最新源码。\n\n## Step 4.3.1. 限制区域传输\n\n配置主服务器仅向从服务器执行区域传输，在\
    \ /etc/named.conf 的区域中使用 allow-transfer 选项，并为区域指定仅从服务器的 IP 地址：\n\n```\nzone \"\
    notransfer.com\" {\n\ttype master;\n\tfile \"db.notransfer.com\";\n\tallow-transfer\
    \ ( 192.168.1.1; 192.168.2.1; );\n};\n```\n\n```\nzone \"notransfer.com\" {\n\t\
    type slave;\n\tmasters ( 192.168.0.1; );\n\tallow-transfer ( none );\n};\n```\n\
    \n"
