    ## STEP 4 Securing Server Network Configurations


    ## STEP 4.7 SERVER MESSAGE BLOCK (SMB) SAMBA SERVER


    The SMB protocol is the core of the Common Internet File System developed by Microsoft
    for file and printer sharing. The idea behind Samba is to make a UNIX server look
    exactly like any NT server to its clients in the network neighborhood. Setting
    up the Samba software itself is relatively simple, but there are a number of nuances
    to successfully integrating it into the office environment. Samba server administrators
    should review the extensive documentation that comes with the server, and the
    book “Samba: Integrating UNIX and Windows,” Blair, SSC, Inc. ISBN 1-57831-006-7.


    ### STEP 4.7.1. Get the latest version of Samba


    As of this writing, updated packages for Red Hat version 6.0 have been issued
    for Samba to correct problems. Check the updates for your distribution, and make
    sure that you have installed Samba version 2.0.5a or later.


    ### STEP 4.7.2. Limit access to specific hosts


    Edit the /etc/smb.conf in the [global] section to set up the list of hosts that
    are allowed access to the Samba server and the interfaces that the Samba server
    will listen on:


    ```

    hosts allow = .example.org 128.184.

    interfaces 192.168.0.1/24 127.0.0/32

    bind interfaces only = true

    ```


    ### STEP 4.7.3. Use encrypted passwords


    Before setting up Samba to use encrypted passwords, read /usr/doc/samba-2.0.5a/docs/textdocs/ENCRYPTION.txt.


    Red Hat Linux 6.0 defaults to looking for Samba passwords in /etc/smbpasswd. Other
    distributions may use /etc/samba.d/smpasswd, or a different path entirely. The
    path is in the configuration file /etc/smb.conf. You can create a template /etc/smbpasswd
    with the following command:


    ```

    [root]# mksmbpasswd.sh < /etc/passwd >/etc/smbpasswd

    [root]# chmod 006 /etc/smbpasswd

    ```


    Edit the template to remove entries for system accounts like bin, daemon, and
    ftp. The administrator should set default passwords for each of the accounts.
    If you wish to have users set their own password, you will need to edit /etc/smbpasswd
    and put the string “NO PASSWORD” in the first eleven characters in the password
    field, leaving the remaining 21 “X” characters. Then enable null passwords with
    the line:


    ```

    null passwords = true

    ```


    in the [global] section of /etc/smb.conf, restart the smb server. If you decide
    to use this method, give the users only a short period of time to reset their
    passwords. If any entries in /etc/smbpasswd contain the string “NO PASSWORD” after
    the deadline, then set passwords for the users.


    ### STEP 4.7.4. Remove “guest” or anonymous shares


    The default /etc/smb.conf comes with Red Hat 6.0 only enables user-level shares
    of the home directories for each user on the local host. Other distributions may
    enable other publicly-readable shares. Before enabling Samba, carefully inspect
    the shares defined in /etc/smb.conf and disable any that are not absolutely necessary.
    For the remaining shares allow write access only when absolutely necessary. Consider
    setting write permissions for only those users who need the permission, not for
    any user connected to the service.


    ### STEP 4.7.5. Set default file creation masks


    The default file creation mask makes files that are world-readable. Edit /etc/smb.conf
    and search for the following lines and change the mask to clear the “other” permission
    bits:


    ```

    create mask = 0770

    directory mask = 0750

    ```


    ## STEP 4.8 CENTRAL SYSLOG HOST


    As discussed in Step 2.8.3, a centralized logging host is important for organizations
    with multiple machines. They provide an additional line of defense in the preservation
    of information and evidence about anomalies and breaks. Because of this important
    security function, logging hosts should be as secure as possible. No other services,
    except SSH for remote administration, should be running, or even installed on
    the machine. Only the absolute minimum set of system utilities should be installed.
    The host should have a large, fast disk dedicated to the /var/log directory for
    the collection of syslog. A fast, high-capacity backup device is available. Log
    rotation (see Step 2.8.4) should be turned off, or set to a long interval, and
    all log files should be retained for a long period of time.


    As mentioned in Step 2.8 above, there are several alternative syslog daemon implementations
    that are more secure than the most syslogd provided on the Red Hat installation
    CD-ROM. See Appendix A Under Step 2 for references to some of the alternatives.


    ### STEP 4.8.1. Configure syslog to accept remote log messages


    The default behavior of the most syslog daemon in Red Hat Linux is not to accept
    log messages. This is contrary to the behavior of most BSD-style log daemons.
    To turn this feature on, edit /etc/rc.d/init.d/syslog, and add the "-r" option
    to the line that starts the syslog daemon:


    ```

    start

    daemon syslogd -r

    ```


    Then, restart the service service:

    [root]# /etc/rc.d/init.d/syslog restart


    ### STEP 4.8.2. Configure log rotation


    As discussed in Step 2.8.4, the logrotate program is designed to rotate, preserve,
    and delete log files after a certain period of time, or when the files reach a
    certain size. For a high log, log rotation should be turned off (by deleting /etc/cron.daily/logrotate),
    or the logrotate configuration file should be edited to preserve the log files
    for a much longer period of time. For example, if your organization''s security
    policy states that most logs must be kept for a year, edit /etc/logrotate.conf
    and change the first few lines to read:


    ```

    # rotate log files monthly

    monthly


    # keep a years worth of backlogs

    rotate 12

    ```


    ## STEP 4.9 FILE TRANSFER PROTOCOL (FTP)


    Red Hat Linux, and most other distributions, have a package “anonftp” that sets
    up an anonymous FTP directory with the proper permissions for secure operation.
    To make sure, check in /home/ftp; the bin and etc directories should be owned
    by UID/GID root, mode 111.


    ### STEP 4.9.1. Limit access with TCP wrappers


    The FTP daemon is invoked through inetd and protected by TCP wrappers. If the
    FTP server is only accessible to limited set of machines, put the restriction
    in /etc/hosts.allow:


    ```

    .example.org 128.184.

    ```


    The FTP daemon will be accessible to the world:


    ```

    ftpd: ALL

    ```


    ### STEP 4.9.2. Limit permitted operations in /etc/ftpaccess


    The WU-FTP daemon supplied with Red Hat allows fine-tuned control through the
    ftpaccess file. See the manual page for ftpaccess(5) for more information. In
    this file, you can define classes of users based on where they are connecting
    from, the number of simultaneous users, limit the operations allowed by classes,
    and much more.


    If a writable directory is required (see below), anonymous users can be precluded
    from modifying the contents, regardless of the directory permissions, by putting
    the following into /etc/ftpaccess:


    ```

    ```


    ### STEP 4.9.3. Protect incoming directory


    In general, it is never a good idea to allow write access to an anonymous FTP
    directory, but sometimes it must be done. Traditionally this is called the "incoming"
    directory. The FTP daemon has a number of control features that will help to keep
    the incoming directory from turning into an "warez" site.


    First, create the incoming directory with write, but not access:


    ```

    [root]# mkdir -m 333 /home/ftp/incoming

    ```


    Then, edit /etc/ftpasswd and add these lines


    ```

    path-filter anonymous /etc/ftpassmsg ^[-A-Za-z0-9]*$ \

    ^-

    upload /home/ftp /incoming yes root ftp 0600 nodirs

    nretrieve /home/ftp/incoming/

    ```


    The first line restricts upload names to letters, numbers, hyphen, period, and
    underscore, and it restricts file names from starting with a period or hyphen
    (so the anonymous user cannot create a file called for instance.). The second
    line says that files uploaded to the incoming directory are allowed, that files
    will have UID GID ftp, mode 0600, and that the user is not allowed to create subdirectories.
    The last line denies downloads from the incoming directory entirely, so once a
    file is written there, another anonymous user can''t get it.

