    # A Survival Guide for Linux Security


    A consensus document by security professionals from 46 commercial, educational,
    and government institutions.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_0_0.png)


    ## SECURING LINUX STEP-BY-STEP VERSION 1.0


    THE SANS INSTITUTE


    # INTRODUCTION


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_1_0.png)


    One of the great sources of productivity and effectiveness in the community of
    computer professionals is the willingness of active practitioners to take time
    from their busy lives to share some of the lessons they have learned and the techniques
    they have perfected. Much of the sharing takes place through online news groups,
    through web postings, and through presentations at technical meetings, and those
    who are able to take the time to scan the newsgroups, surf the web, and attend
    the meetings often gain invaluable information from those interactions.


    SANS'' Step by Step series raises information sharing to a new level in which
    experts share techniques they have found to be effective. The SANS Institute integrates
    the techniques into a step-by-step plan and subjects the plan, in detail, to the
    close scrutiny of other experts. The process continues until consensus is reached.
    This is a difficult undertaking. A large number of people spend a great deal of
    time making sure the information is both useful and correct.


    ## SECURING LINUX

    STEP-BY-STEP VERSION 1.0


    From a small, collaborative effort headed by a University of Helsinki student
    named Lin Torvalds has grown into a global phenomenon spurred new industries for
    distribution, training, and support. It is the only operating system other than
    Windows NT that is gaining market share in corporate Information Technology infrastructures.
    Distributors are actively marketing easier to install, easier to use Linux systems
    and making real inroads onto the desktops of corporate, government, and educational
    users. By some estimates there are real 8 million Linux users worldwide.


    Linux is an "Open Source" operating system. The source code for the kernel and
    system utilities is available for download, inspection, and modification. This
    is a double-edged sword: system developers and ordinary users have access to the
    source code so bugs are found and fixed more quickly; system crackers have access
    to the code as well, and they can use this knowledge to develop exploits more
    rapidly and reliably. This does not make Linux less secure than its proprietary
    competition. On the contrary, bugs are discovered in an open environment, and
    patches and updates are issued for Linux software very quickly. Unfortunately,
    most users install Linux from CD-ROM media that often contains vulnerable programs
    by the time the ink dries on the label. Another unfortunate aspect of installing
    commercial Linux distributions is, for ease of use, these Linux systems are configured
    with most, if not all, network services running immediately after the computer
    is booted up, and without any controls in place. For example, for years all Linux
    distributions have shipped with TCP wrappers in place, but the /etc/hosts.allow
    and /etc/hosts.deny files are empty, meaning that on the Internet one cannot connect
    to TCP wrapped services.


    This guide is intended for the novice home user and the experienced systems administrator.
    It covers the installation and operation of Linux in two basic modes of operation:
    as a workstation and as a server. It does not configure Linux for the other special-purpose
    functions that it performs well, such as routers, firewalls, firewall processing,
    and so forth. The examples and instructions are based on the Red Hat 6.0 release.
    Red Hat was chosen because it has the largest share of Linux, and version 6.0
    was chosen because it includes the latest stable release of the Linux kernel,
    system libraries, utilities, etc. However, the concepts, advice, and procedures
    in this guide should translate easily to other distributions. You may have to
    explore your system a little to find configuration files that are in different
    directories, and to determine which versions of the software packages have been
    installed, but the exploration itself can be a good instructional tool.


    This guide takes you, the reader, through the installation process then splits
    into separate steps for setting up a workstation and server setup. The guide discusses
    some useful tools for monitoring and testing the security of your system. We try
    to follow the principle of "defense in depth." No one step is a silver bullet
    against system attacks, but taken as a whole, they build multiple layers of defense
    that make life just much harder for "script kiddies" and dedicated computer criminals.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_2_0.png)


    ## SECURING LINUX


    # INTRODUCTION


    We try to explain, as much as possible, the options and ramifications of securing
    a Linux box. however, this is not a text on security. Whenever possible, pointers
    to documents and resources are included in the text or in Appendix A. We encourage
    you to study these resources before setting up your Linux box, and to keep track
    of the latest information from the distributor, the SANS Institute, and other
    security references.


    By convention, commands executed by the root user are preceded by the command-line
    prompt `[root]#`. In the body of the system, commands and file names are in Courier
    fixed-spaced font. Command sequences and file contents are separate from the text,
    also in Courier fixed-space font. For reference manuals are in the traditional
    style, page (section) e.g.`inetdconf(5)`. To read the manual in Red Linux, and
    most other distributions, execute the command:


    ```bash

    [root]# man 5 inetd

    ```


    **IMPORTANT:** Updates will be advised whenever a change in these steps is required,
    and new versions will be published periodically.

    Please email info@sans.org with the subject <Linux Security> to subscribe to the
    monthly Network Security Digest containing news of new threats and solutions of
    updates. There is no change.


    This edition was written and edited by:

    Lee E. Brotzman, Allied Technology Group, and David A. Rauch, Trinity Designs


