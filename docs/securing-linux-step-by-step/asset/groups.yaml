  - '[PAGE 87]


    # STEP 6.2 HOST-BASED VULNERABILITY ANALYSIS: LOOKING FROM THE INSIDE OUT


    +   6.2.1. Tiger, the Texas A&M system checker


    Tiger is a tool that inspects security-related systems of UNIX computers. Tiger
    was recently upgraded (for the first time since 1994) to support checking of Red
    Hat Linux systems. See Appendix A for a URL to the Tiger home page and the source
    code.


    +   6.2.2. Install and configure Tiger


    Installing is simple: unpack the compressed tiger file and execute "make install".
    This places the configuration and script files in /usr/local/tiger. The Makefile
    does not create the intermediate directories Tiger relies on, so, after installation,
    execute the following:


    ```

    [root]# mkdir -m 700 -p /var/spool/tiger/bin

    [root]# mkdir -m 700 -p /var/spool/tiger/logs

    [root]# mkdir -m 700 -p /var/spool/tiger/work

    ```


    Also, if you are running Bash 2 the default, you will need to edit /usr/local/tiger/systems/linux2/config
    and comment the line that starts with "GROUPS". In Bash 2, GROUPS is a read-only
    variable, and the script will abort if it tries to assign to it.


    The checks that Tiger performs are set out in /usr/local/tiger/tigerrc. There
    are several tigerrc files in the source directory, and they are well commented.
    The default tigerrc pretty much tries to test everything in. For Red Hat Linux
    version 6, most checks will work as advertised, except signature checking. You
    can turn this off by editing tigerrc


    Tiger_Check_SIGNATURES=Y to Tiger_Check_SIGNATURES=N. By the same, you can turn
    off running Crack on the password file by editing the entry for Tiger_Run_CRACK.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_87_0.png)'
  - '[PAGE 88]


    # Step 6.2.3. Running Tiger


    To run Tiger:


    ```

    [root]# cd /usr/local/tiger

    [root]# ./tiger

    ```


    A number of messages are printed on standard output while Tiger runs through its
    checks. When the run is complete, the results are stored in


    /var/spool/tiger/logs/security.report.<host>.<domain>.<date>-<time>. Be prepared
    to have a lot of messages in the first security report. Reported problems look
    like:


    +   -WARN- [acc001w] Login ID postgres is disabled, but still has a valid shell

    (/bin/bash).


    +   -FAIL- [perm007f] /etc/aliases should not have group read.

    -FAIL- [perm007f] /etc/aliases should not have world read.


    A WARN entry is something considers undesirable, but not terrible. A FAIL entry
    is something Tiger thinks you should change. The string in square brackets indicates
    how to get more information about the specific warning with the tigexp program:


    ```

    [root]# ./tiger acc01w

    ```


    The listed login ID is disabled in some manner (''**'' in passwd field, etc),
    but the login shell for the login ID is a valid shell (from /etc/shells or the
    system equivalent). A valid shell can potentially enable the login ID to continue
    to be used. The login shell should be changed to something that doesn''t exist,
    or to something like /bin/false.'
  - '[PAGE 89]


    # STEP 6 Tools


    +   Step 6.2.4. Changing Tiger checks


    Going through the security report, you will probably find some warnings and failures
    that you think are perfectly fine. The base information Tiger uses for comparison
    can be found in /usr/local/tiger/systems/Linux/2. For example, the file file_access
    list contains the suggested ownership and bits for a number of system files. If
    you find that /etc/aliases is allowed group- and world-read permissions, you can
    edit this file to set the proper mode bits, and you will no longer get a FAIL
    message for those permissions.


    Once again, patience and persistence are needed here. Follow the suggested changes
    in the security report and judiciously modify the base information until Tiger''s
    security reports return the most meaningful information for your site.


    +   TARA, an updated version of Tiger


    Because Tiger has only recently seen any new development, Advanced Research Corporation
    has taken the base code and enhanced it to produce the Tiger Analytical Research
    Assistant (TARA). Append a URL to the TARA home page.


    Installation, configuration, and operation of TARA is exactly the same as the
    original Tiger, even down to the same directory names. Note that the default tigerrc
    enables fewer faster systems than Tiger. Review this file before running TARA
    and enable the checks that you are relevant.


    # STEP 6.3 NETWORK-BASED VULNERABILITY ANALYSIS: LOOKING FROM THE OUTSIDE IN


    There are many, tools designed to scan hosts on a network for open ports, general
    security vulnerabilities, or specific exploitable services. Before any network
    scanning is, the most important thing is to secure your own backside... get authorization
    to perform the scanning, if writing possible. Government and commercial organizations
    have specific policies for who can perform scanning, the scope of the scanning,
    and what can and cannot be scanned for. Unauthorized violation of these policies
    can lead to sanctions, unemployment, and every legal action.


    After you authorize, post notice that a scan is going to be done and when. Some
    administrators are of the opinion that letting others know about an impending
    scan gives users an opportunity to plug holes beforehand, skewing the results
    of the scan. Well, at least the results are skewed in the right direction, and
    you will avoid problems with local users'' intrusion detection programs unexpectedly
    raising red flags.'
  - '[PAGE 90]


    # STEP 6 Tools


    Before the scan, the scanning software on an isolated network segment to make
    sure the scanning tool does not have an adverse effect on the machines it is scanning.
    Some scanners are very efficient at crashing computers.


    After the scan, disseminate information about the vulnerabilities that were found
    on a need-to-know basis. Results of vulnerability scans should be treated like
    any other sensitive information in your organization. Don''t post the results
    on the company Intranet Web server. Summarize the results and discuss them with
    each responsible party privately.


    +   - Step 6.1. SATAN derivatives: SARA and SAINT


    The Security Administrator Tool for Analyzing Networks (SATAN) caused a stir when
    it was released in 1994 by Dan Farmer and Wiest Wena. It had an innovative design
    for the user interface, using HTML and Web technology to effect a simple point-and-click
    process for scanning from 1 to thousands of hosts at one time.


    The original release scanned for well-known vulnerabilities and exploits. The
    design, however, allowed for enhancing it with other checks and tests rather easily,
    and the authors assumed that it would be developed quickly. Two updated versions
    of SATAN are currently available: the Security Auditor''s Research Assistant (SARA);
    and the Security Administrator''s Integrated Network Tool (SAINT).


    Both versions are under active development, in fact one of the original authors
    of SATAN is currently the developer of SARA, and the systems track each other.
    To get to the latest version of the program, earlier versions are known to have
    problems compiling under Red Hat 6.0. To compile and run either program, unpack
    the compressed file and execute `perl reconfig` to set up paths to the Perl interpreter
    and browser, and `make linux` to compile the scanner and its support programs.


    When you invoke the scanner (sara or saint), it will invoke your Web browser and
    load the main page. Scanning proceeds from Data Management, to select the database
    to store results in, to Target Selection, to pick the host(s) to scan, to Report
    and Analysis. When the scan is over, results can be displayed by Danger Level,
    Type of Vulnerability, or Vulnerability Count.


    There is much more to both systems, course. Consult the documentation for more
    information.'
  - '[PAGE 91]


    # STEP 6

    Tools


    # Step 6.3.2 Nessus


    Nessus (http://www.nessus.org) is an open-source security scanner that uses a
    client/server architecture. The Nessus daemon, nessusd, runs the scans and checks
    for vulnerabilities under the control of the client, which is written with a Gtk
    GUI interface. Nessus has a library of “plugins” to perform vulnerability tests.
    As of this there were 208 plugins, testing such things as IMAP and rpc.mount overflows,
    CGI script blogs, RPC services, WinGate proxy holes, and a series of denial-of-service
    attacks, just to name a few.


    Compiling and installing should be as simple:


    ```

    [root]# # ./configure; make; install

    ```


    The nessusd server must be run first. The first time nessusd runs it creates a
    host key and builds a default users file /usr/local/nessus/nessus.users. This
    file controls who may connect to the server. To add an entry for root, run nessusd
    again as:


    ```

    [root]# nessusd -P root,pass

    ```


    where pass is an initial password. Starting the client, nessus, you must first
    connect to the server. Enter “root” in the “Login:” window and click “Log in now!”.
    You will be prompted for the password entered above only the first time you log
    in, after that a private key is generated and for all subsequent logins.


    Note that Nessus tests for denial of service exploits defts by default, and our
    tests show that you are very likely to

    crash just every machine you scan if this option is enabled. Before performing
    a scan, go to the

    Plugins tab and disable Denial of Service.


    After a scan, Nessus pops up a report window with information for each scanned
    host. Security problemsnare highlighted with a red bullet, areas of concern are
    labeled with a black bullet. In both cases, a brief

    description is printed. Reports can be saved to disk for later study and comparison.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_91_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_91_1.png)


