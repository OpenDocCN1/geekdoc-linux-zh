    ```\n[root] # /sbin/lilo\n```\n\n完成这些更改后，系统将像以前一样启动，但如果你在 LILO 提示处给 LILO 任何命令行选项（例如使用\
    \ `single` 在单用户模式启动），它将在继续执行之前要求输入密码。\n\n## 步骤 2.7 设置系统访问安全策略\n\n大多数 Linux 发行版都允许配置哪些用户允许在何时、什么时间、什么日期以及通过哪些服务（TELNET、FTP\
    \ 等）登录系统。大多数 Linux 发行版开箱即用的配置是正确的（尽管有些松散），确认所有这些设置是非常重要的。\n\n### 步骤 2.7.1. 检查是否禁用\
