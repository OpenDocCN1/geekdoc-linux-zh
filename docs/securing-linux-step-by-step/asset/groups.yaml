    # STEP 4

    Securing Server

    Configurations


    # STEP 4.9 FILE TRANSFER PROTOCOL (FTP)


    Red Hat Linux, and most other distributions, have a package “anonftp” that sets
    up an anonymous FTP directory with the proper permissions for secure operation.
    To make sure, check in /home/ftp; the bin and etc directories should be owned
    by UID/GID root, mode 111 (execute-only). The pub directory should be owned by
    UID root, GID ftp, mode 02555 (set-GID,read-and-execute-only).


    +   Step 4.9.1. Limit access with TCP wrappers


    The FTP daemon is invoked through inetd and protected by TCP wrappers. If the
    FTP server is only to provide data to a limited set of machines, your local domain
    or network, put the restriction in /etc/hosts.allow:


    ```

    in.ftpd: .example.org 128.184.

    ```


    A general anonymous FTP server will be accessible to the world:


    ```

    in.ftpd: ALL

    ```


    Note that TCP wrappers will log all connections, so that you can monitor them
    in the log file /var/log/secure. The files that are transferred in /var/log/xferlog.


    +   Step 4.9.2. Limit permitted operations in /etc/ftpaccess


    The WU-FTP daemon supplied with Red Hat Linux allows fine-tuned control through
    the /etc/ftpaccess configuration file. See the manual page for ftpaccess(5) for
    more information. In this file, you can define special classes of users based
    on where they are connecting from, the number of simultaneous users, limit the
    operations allowed by classes of users, and much more.


    If a writable directory is required (see below), anonymous users can be precluded
    from modifying the contents, regardless of the directory permissions, by putting
    the following into /etc/ftpaccess:


    ```

    chmod no guest, anonymous

    delete no guest, anonymous

    overwrite no guest, anonymous

    rename no guest, anonymous

    ```


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_69_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_69_1.png)'
  - '[PAGE 70]


    # Step 4.9.3. Protect incoming directory


    In general, it is never a good idea to allow write access to an anonymous FTP
    directory, but sometimes it must be done. Traditionally this is called the "incoming"
    directory. The Washington FTP daemon has a number of control features that will
    help to keep the incoming directory from turning into an illegal "warez" site.


    First, create the incoming directory with write, but not access:


    ```

    [root]# mkdir -m 333 /home/ftp/incoming

    ```


    Then, edit /etc/ftpasswd and add these lines


    ```

    path-filter anonymous /etc/ftpassmsg ^[-A-Za-z0-9._]*$ \\

    ^-

    upload /home/ftp /incoming yes root ftp 0600 nodirs

    noretrieive /home/ftp/incoming/

    ```


    The first line restricts upload names to letters, numbers, hyphen, period, and
    underscore, and it restricts file names from starting with a period or hyphen
    (so the anonymous user cannot create a file called...” for instance.). The second
    line says that files uploaded to the incoming directory are allowed, that files
    will have UID GID ftp, mode 0600, and that the user is not allowed to create subdirectories.
    The last line denies downloads from the incoming directory entirely, so once a
    file is written there, another anonymous user can''t get it. Again, read the manual
    page for ftppasswd(5) for more information about these and other control mechanisms.


    Regardless of the protections, the incoming directory should be reviewed daily,
    and all files stored moved to another directory out of the anonymous directory
    tree. Write a cron job to check the directory each night, perform the move and
    notify the administrator about any files found there.'
