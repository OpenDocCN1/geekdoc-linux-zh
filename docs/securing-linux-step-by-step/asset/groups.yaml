    # STEP 6

    Tools


    See swatch, the administrator needs patience and persistence to weed out records
    that do not indicate genuine events and add patterns to logcheck.ignore. At first,
    there are likely to be many false alarms. Investigate each reported instance to
    determine if, the reported event requires attention. If it does not and never
    will, a pattern to match that event can be put into logcheck.ignore and you will
    not see it reported again. It is best to make the pattern as specific as possible,
    so that unusual variations of the event are reported.


    +   Step 6.1.3. Tripwire


    Tripwire was originally developed by Gene Kim and Gene Pfafford at the University
    of Purdue COAST Laboratory. The idea behind Tripwire is that in order to successfully
    compromise a system, system files must be changed, added, or deleted in order
    to place back doors, trojans and exploit scripts. Tripwire generates a database
    of cryptographic signatures for important system binaries and configuration files
    and changes in any of these files over time.


    See Appendix A for URLs for the source code for the Tripwire “Academic Source
    Release” version 1.3.1 and version 2.0 for Red Hat Linux. However it must be noted
    that Tripwire 2.0 is not supported for Red Hat 6.0, only for the earlier versions
    5.2 and 5.1. As of the time of this writing, only the ASR 1.3.1 release works
    for Red Hat 6.0.


    Read the documentation that comes with each release carefully for information
    about compiling, installing, and maintaining Tripwire.


    +   Step 6.1.3.1.Tripwire databases


    Before Tripwire, the only way to test the integrity of system files is by checking
    CRC checksums. Unfortunately, CRC 16- and 32-bit checksums are easily subverted.
    Tripwire builds a database of cryptographic checksums, such as MD5 and S5, that
    are nearly impossible to spoof and checks them regularly. If the checksum fails,
    it is a very strong indicator that the file in question has been modified.


    The single greatest weakness in Tripwire was that, if an attacker can gain access
    to the machine, he may modify or rebuild the Tripwire database to mask his intrusion.
    The only defense against this attack is to place the database on read-only media,
    such as a write-protected floppy or CD-R. One of the most significant innovations
    in Version 2 is cryptographic signing of the database and configuration files,
    which eliminates the need for placing Tripwire databases on read-only media. Hopefully,
    for support for Red Hat 6.0 will be available by the time this goes to press.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_84_0.png)'
