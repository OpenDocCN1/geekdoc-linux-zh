    # Step 6.1.4. Psionic PortSentry


    There are several tools for detecting port scans, Psionic PortSentry adds a twist:
    when a scan is detected it can take immediate action to block the scanning host
    from any further access to the machine. It works well in conjunction with Psionic
    Logcheck (Step 6.1.2). See Appendix A for a URL to the home page.


    PortSentry comes with good documentation. Before compiling and installing, read
    README.install, README.methods, and README.qa thoroughly. PortSentry compiled
    "out-of-the-box" for the authors, without any changes necessary. The program and
    configuration files are installed in /usr/local/psionic/portsentry by default.


    PortSentry can detect not only simple TCP connect-type scans, but many types of
    stealth scans, too, such as SYN/half-open, FIN, and NULL scans scans.


    Before running PortSentry, review portsentry.conf. All the entries are documented
    in the configuration file, and in README.install by. The only action against scanning
    hosts is to:


    ```

    ALL: <attacker-IP>

    ```


    at the end of /etc/hosts.deny. Since you should already have "ALL: ALL" at the
    end of /etc/hosts.deny, this is ineffective. In this fact, method is completely
    ineffective if any services have been allowed to the attacking host in /etc/hosts.allow,
    which TCP wrappers read in /etc/hosts.allow for a match before reading /etc/hosts.deny.


    On the other hand, using the KILL_ROUTE option in portsentry.conf is highly effective
    if configured correctly. There are two basic approaches to the KILL_ROUTE option:
    1) add an entry in the routing table sending responses to the attacking host to
    a fictitious destination; 2) add firewall filter rules with ipchains/iptfw to
    drop all packets from the attacking host. Adding a bogus route to the routing
    table may still allow some UDP-based attacks to get through (see README.install
    for more information). The preferred method is packet filtering with ipchains:


    ```

    KILL_ROUTE="/sbin/ipchains -I input -s $TARGET -j DENY -1 "

    ```


    Note that adding automatic packet filtering leaves the possibility of a denial-of-service
    attack, where the attacker spoofs a scan from another host in order to block that
    host from legitimate access.'
