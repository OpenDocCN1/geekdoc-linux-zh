- md: '

    Syslog: A centralized logging host hosts and stores syslog messages from other
    computers in the organization. As you can imagine, logging hosts need large amounts
    of disk space reserved for the /var/log directory. Good practice is to place /var/log
    on a large, fast SCSI device. Logging hosts should not run any other services
    at all, and be very secure, so the amount of disk space required for the system
    software is smaller than for other servers.


    Shell: Unix servers that provide shell accounts have separate partitions for /tmp
    and /var/log. This will reduce the impact of classic denial attacks that fill
    the /tmp directory with files or create a process that quickly fills the system
    logs until the root partition is full or the system cannot write any more log
    files, the system will usually crash.


    We recommend that servers have separate partitions for /var (or separate partitions
    for /var/log and /var/spool), the root partition "/", and the user partition /home,
    at a minimum. Some administrators might also consider partitions for /usr which
    contains the majority of the Linux Operating System, and /usr/local for optional
    user-installed applications and tools. Some distributions store large system packages
    like KDE, Netscape and DBMS systems in the /opt directory, you might consider
    a partition for that, too. The relative sizes of these partitions are solely at
    the discretion of the administrator depending on the purpose of the server and
    your own personal experience.


    As an example: a high-end PC with 256MB of RAM and (2) GB hard drives primarily
    used for NNTP news services could be partitioned like so:


    | First hard disk | | | Size |

    | :--- | :--- | :--- |

    | First hard disk | | 500MB |

    | First hard disk | /usr | 100MB |

    | First hard disk | /usr/local | 1500MB |

    | First hard disk | /tmp | 2000MB |

    | First hard disk | /var/spool/news | 4000MB |

    | Second hard disk | swap | 500MB |

    | Second hard disk | /home | 5500MB |

    | Second hard disk | /var | 3000MB |


    ## STEP 2 Install Linux


    ### Step 2.3.3. Document the partition scheme


    Once the system has been partitioned for your specific environment, document the
    partition layout. Then, if a partition table is somehow corrupted or deleted,
    recovering the table will be easier. To document the various tables, run fdisk
    on every one of your physical disks (sda, sda, etc) and enter "p" to print the
    table. Copy the results onto paper and store in a safe place for later reference.
    For example:


    ```

    [root]# fdisk /dev/hda

    Using /dev/hda as default device:

    Command (m for help): p

    disk /dev/hda: 255 heads, 63 sectors, 2193 cylinders

    Units = 16065 * 512 bytes

    ```


    | Device | Boot | Start | End | Blocks | Id | System |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | /dev/hda | * | | 1913 | 1536611 | 83 | Linux |

    | /dev/hda2 | | 1914 | 1946 | 265072+ | 82 | Linux swap |

    | /dev/hda3 | | 1947 | 2193 | 1984027+ | 83 | Linux |


    ```

    Command (m for help): q

    ```


    ## STEP 2.4 SELECT PACKAGES TO INSTALL


    Like setting disk partitions, the packages chosen for installation depend on the
    use of the system. The best way to get through this section is to know your users
    and how the system will be used. Determine what will and won''t be on the system
    and choose the software packages accordingly. Carefully go through each section
    of the installer and hit "F" whenever you don''t know what a package is or if
    you''re sure you need it or not. When in doubt, leave it out. It''s easy to add
    the package later as the need arises. If you don''t select a package that Red
    Hat needs for some other tool, it will warn you about any software dependencies
    before the installation process actually begins.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_18_0.png)


    ### Step 2.4.1. Workstation packages


    Workstation users usually fit into one of three categories:


    - 1. Business. The system is used for business purposes like word processing,
    spreadsheets, E-mail, and WWW browsing. For these systems, there is no need to
    install services NFS or HTTP servers, or compilers like GCC and EGCS.

    - 2. Software development. For systems like this, package selection depends on
    the type of development. A Web developer may need a Web server, PHP, Perl. Software
    developers may need GCC or EGCS, G++, Python, Perl, etc., and documentation tools
    like TeX and Ghostscript.

    - 3. General Purpose. This category probably fits the needs of most users. Business
    tools, development tools, multimedia players, games, graphical utilities, are
    all loaded on the system. The general-purpose user doesn''t want to be limited
    to the fact they don''t have a Web server or GCC installed on their machine. Though
    this kind of installation is the most convenient for the end user, it makes the
    maintenance and security of the Linux machine more difficult.


    ### Step 2.4.2. Server packages


    Servers are configured for utility, performance, and security. If your budget
    permits, we recommend you put information services such as WWW and FTP, file and
    print services as NFS and Samba, DNS services, email services, and user shell
    accounts on different servers. For example, an information server would only install
    the base system, FTP and WWW services, Perl, PHP, and nothing else. If you need
    to have both information services and file services running on the same machine,
    so be it, but to minimize the installation of any other unnecessary software.


    ### Step 2.4.3. Let the installation process


    Once you have selected all the packages you installed on your system, the Red
    Hat installer will figure out the dependencies between the packages you selected.
    It will notify you of any additional packages you need to install to properly
    support the selected packages. At this point, you can allow the installer to include
    the dependent packages or remove the original selection from the list entirely.


    Finally the installer will load the selected packages and prompt you for any additional
    configuration settings, such as network cards, mice, video cards, etc. Covering
    these steps is beyond the scope of this guide but it is provided in the documentation
    supplied with the shrink-wrap versions of the distributions or on your Linux distribution''s
    web site.


    ## STEP 2.5 CONFIGURE THE SYSTEM SECURITY AND ACCOUNT POLICIES


    ### Step 2.5.1. Shadow Passwords with MD5 hashing


    One of the final installation options that Red Hat prompts the user is with whether
    to use “shadow” passwords with or without MD5 cryptographic hashes. Traditionally,
    users UNIX passwords were encrypted with the “crypt” algorithm using tools and
    stored in the world-readable file, /etc/passwd. This makes it easy to perform
    dictionary attacks using tools as Crack and its cousins. Shadow passwords are
    stored in /etc/shadow, readable only by root, which makes it much harder to obtain
    the encrypted passwords for a dictionary attack. Use the MD5 cryptographic hash
    to add another layer of security to the shadow password system. It is very important
    to keep /etc/shadow secure away from trying eyes.


    ### Step 2.5.2. Set passwords for root and all user accounts


    One of the last steps before the system reboot is setting the root password. Linux
    passwords are sensitive and the installer will recommend a root password be a
    combination of UPPER and lower case letters, digits, and special characters including:


    ```

    [ ~!@#$%^&*()-_+={}]|\;'':,.<>?/ ]

    ```


    The password should not be based on any personal information such as name, company,
    Social Security number, birthday, license plate number, etc. A determined attacker
    can find a surprising amount of personal information about users, especially in
    the case of an insider attack.


    Never use a common word that would be found in any dictionary in any language,
    like the English word “ridge”. Using digits to substitute for letters, for example
    “r1dg3”, does not help, since common password cracking tools too take this trick
    into account.


    So what is a good password? Unique and do combinations; think of a phrase and
    an acronym (don’t use an acronym from your everyday word, though). For example,
    a good password can be constructed from the names of the computer science algorithms
    for B+ and Patricia trees, “B+paTas..”. Creative but use something you can remember!


    It is an excellent practice to teach your fellow system administrators and users
    alike to choose strong passwords. With strong passwords that are changed on a
    frequent basis, systems are much more difficult to break into.'
