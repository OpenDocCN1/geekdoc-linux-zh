    \ you are running BIND Version 4, upgrade to BIND version 8.2. If you are running\
    \ 8.1.1 or earlier you must upgrade to BIND Version 8.1.2 or later, the earlier\
    \ versions have a known remote root exploit. Check the updates for your distribution,\
    \ or download the latest source from http://www.isc.org.\n\n# Step 4.3.1. Restrict\
    \ transfer zones\n\nConfigure the primary name server to perform transfer zones\
    \ only to its slave servers, use the allow-transfer option for the zone in /etc/named.conf,\
    \ and specify the IP address of only slave servers for the zone:\n\n```\nzone\
    \ \"notransfer.com\" {\n\ttype master;\n\tfile \"db.notransfer.com\";n\tallow-transfer\
    \ ( 192.168.1.1; 192.168.2.1; );\n```\n\n```\nzone \"notransfer.com\" {\n\ttype\
    \ slave;\n\tmasters ( 192.168.0.1; );\n\tallow-transfer ( none );\n```\n\n![](img/0aaa698c422b2f7ffe93bff50cbbef96_55_0.png)"
- md: "\n# STEP 4\n## Securing Server Network Configurations\n\n## Step 4.3.2. Restrict\
    \ queries\n\nYou can limit the hosts that are allowed to query a name server with\
    \ the allow-query option. You can limit the interfaces that queries will be allowed\
    \ on with the listen-on option. These options can be applied globally in the options\
    \ list in /etc/named.conf:\n\n```\noptions {\n  allow-query ( 192.168.0/24 );\n\
    \  listen-on ( 192.168.0.1; 127.0.0.1 );\n};\n```\n\nOr the restriction can be\
    \ for particular zones:\n\n```\nzone \"notransfer.com\" {\n  type slave;\n  masters\
    \ ( 192.168.0.1;\n  allow-transfer ( none );\n  allow-query ( 127/8; 192.168.0/24\
    \ );\n};\n```\n\nThis is useful for protecting zone information on a bastion host\
    \ in a firewall environment. It allows queries only from the primary master nameserver\
    \ on the internal network while a shadow master nameserver handles queries from\
    \ the Internet and serves a much more restricted view of the firewall network.\
    \ See \"DNS and BIND,\" 3rd Edition, Ablitz and Liu, O'Reilly and Associates,\
    \ 1998 for more information (this book is indispensable for any nameserver).\n\
    \n## Step 4.3.3. Run named in a chroot jail\n\nBIND Versions 8.1.2 and 8.2 have\
    \ the ability to run as a user other than root, which helps, but still leaves\
    \ the system open if the nameserver is compromised. For better security, the service\
    \ can be set up to run in its own chroot directory tree. Setting up a proper chroot\
    \ jail must be done with care. Not only the zone files and other configuration\
    \ files need to be in the chroot directory tree, but libraries, devices, and executables\
    \ necessary for operation of named have to be there, too. In the following example,\
    \ the username (dns), UID, GID, and home directory were chosen arbitrarily. Use\
    \ whatever unique values make sense for your site.\n\n## Step 4.3.3.1. Create\
    \ the new user and group\n\n```bash\n[root]# groupadd -g 150 dns\n[root]# useradd\
    \ -u 150 -g 150 -M dns\n```\n\n## Step 4.3.3.2. Prepare the chroot directory\n\
    \n```bash\n[root]# mkdir -m 0700 /home/dns\n[root]# cd /home/dns\n[root]# mkdir\
    \ -p etc lib dev usr/sbin var/named/run\n[root]# mknod -m 666 dev/null c 1 3\n\
    ```\n\n## Step 4.3.3.3. Copy configuration files and programs\n\n```bash\n[root]#\
    \ cp /etc/named.conf etc\n[root]# cp -R /var/named/* var/named\n[root]# chown\
    \ -R dns.dns var/named var/run\n[root]# cp /usr/sbin/(named,named-xfer) usr/sbin\n\
    ```\n\n## Step 4.3.3.4. Copy shared libraries\n\nFirst, output which libraries\
    \ are needed:\n\n```bash\n[root]# lld libc.so.6 => /lib/libc.so.6 (0x401c0000)\n\
    /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)\n```\n\n```bash\n[root]#\
    \ cp /lib/libc.so.6 lib\n[root]# cp /lib/ld-linux.so.2 lib\n```\n\n## Step 4.3.3.5.\
    \ Set syslog to listen to named logging\n\nnamed communicates with syslog through\
    \ /dev/log, but this is not possible in the root jail. The syslog daemon must\
    \ be told to create a new socket for named to write. Edit /etc/rc.d/init.d/syslog,\
    \ and rewrite the line that starts the syslog daemon to read:\n\n`daemon syslog\
    \ -a /home/dns/dev/log`\n\nAnd restart the daemon:\n\n```bash\n[root]# /etc/rc.d/init.d/named\
    \ stop\n[root]# /etc/rc.d/init.d/named start\n```\n\n## Step 4.3.3.6. Edit the\
    \ named init script\n\nEdit /etc/rc.d/init.d/named to start the daemon with the\
    \ new UID/GID in the chroot jail:\n\n```bash\n# Start daemons.\necho -n \"Starting\
    \ named:\ndaemon named -u dns -g dns -t /home/dns\necho\ntouch /var/lock/subsys/named\n\
    ;;\n```\n\nAnd restart the nameserver:\n\n```bash\n[root]# /etc/rc.d/init.d/named\
    \ stop\n[root]# /etc/rc.d/init.d/named start\n```\n\nTo be sure it worked, check\
    \ /var/log/messages, named should have written entries that something like:\n\n\
    ```\nJul 25 01:08:00 server named[1782]: chrooted to /home/dns\nJul 25 01:08:00\
    \ server named[1782]: group = dns\nJul 25 01:08:00 server named[1782]: user =\
    \ dns\n```\n\nUse nslookup to test that the nameserver is operating as expected.\n\
    \n## Step 4.3.3.7. Specify a new control channel for ndc\n\nIf you need to run\
    \ the nameserver control program, ndc, you will have to specify a new control\
    \ channel within the chroot jail:\n\n```bash\n[root]# ndc -c /home/dns/var/run/ndc\n\
    ```\n\nA shell alias or a short script with the new control channel can be used\
    \ to save keystrokes.\n\n## Step 4.4. MAIL\n\nAs mentioned in Step 3.6, sendmail\
    \ is the Mail Transfer Agent (MTA) with Red Hat 6.0 and other distributions. Red\
    \ Hat 6.0 ships with sendmail version 8.9.3, the latest version available as of\
    \ writing. Administrators of earlier releases of Red Hat or other distributions\
    \ should upgrade to version 8.9.3. The 8.9.x versions of sendmail electronic mail\
    \ by default. Sendmail relay is a favorite tool of the purveyors of \"spam\" bulk\
    \ mail to use your server for unsolicited mail.\n\nThe configuration and operation\
    \ of sendmail is quite complicated. All sendmail administrators should have a\
    \ copy of \"sendmail\". Allman, O'Reilly & Associates, 1997 (the Sendmail Book)\
    \ on their bookshelf. Modifying /etc/sendmail.cf by hand can be difficult and\
    \ fraught for the beginner. The best way to make changes is to use the m4 processor,\
    \ package sendmail-cf*.rpm on the Red Hat distribution media. Full details on\
    \ m4 can be found in the Sendmail Book.\n\n### 4.4.1. Turn off SMTP and accept\
    \ commands in /etc/sendmail.cf\n\nThe SMTP command allows a remote user to verify\
    \ the email of a local user on the server. The accept command expands aliases\
    \ and mailing list: Local addresses and aliases should be considered confidential\
    \ or at least sensitive. To turn off the commands, change /etc/sendmail.cf and\
    \ search for the line with PrivacyOptions. Change it to read:\n\n`PrivacyOptions=none`\n\
    \nThe none is shorthand for anonymity, no accept, no access; complete descriptions\
    \ of each privacy option can be found in the Sendmail Book.\n\nTo set this with\
    \ m4, add the following to the build macro (for Red Hat Linux, this is /usr/lib/sendmail-cf/cf/redhat.mc)\
    \ and rebuild /etc/sendmail.cf:\n\n```\ndefine(PRIVACY_FLAGS, `none`)\n```\n\n\
    A sample procedure for this follows:\n\n```bash\n[root]# cp /etc/sendmail.cf /etc/sendmail.cf\n\
    [root]# cd /usr/lib/sendmail-cf/cf\n[root]# echo \"PRIVACY_FLAGS, `none`\" >>redhat.mc\n\
    [root]# m4 redhat >/etc/sendmail.cf\n[root]# /etc/rc.d/init.d/sendmail stop\n\
    [root]# /etc/rc.d/init.d/sendmail start\n```\n\n## STEP 4\n## Securing Server\
    \ Network Configurations\n\n## Step 4.4.2. Define hosts allowed to relay mail\n\
    \nSendmail V8.9 has built-in checks to stop mail relays. Using unwitting mail\
    \ servers to relay unsolicited mail is a favorite practice of spammers. An organizational\
    \ mail server allows relay for mail clients inside the organization. Relaying\
    \ is controlled through an access database, which is in the file /etc/mail/access\
    \ in Red Hat Linux. Other distributions may control relaying through the file\
    \ /etc/mail/relay-domains. Both methods are discussed below.\n\n### Step 4.4.2.1.\
    \ Check that the access database is active\n\nTo make sure sendmail has the ability\
    \ to use the access database check for the name of the database in /etc/sendmail.cf:\n\
    \n```bash\n[root]# grep access /etc/sendmail.cf\naccess -o /etc/mail/access\n\
    ```\n\nIf the line is not found, the only way to add this feature is with the\
    \ m4 macro FEATURE('access_db'). See the sample procedure in Step 4.4.1.\n\nIf\
    \ your distribution uses the relay-domains file, instead, check to make sure that\
    \ sendmail is using the file:\n\n```bash\n[root]# grep relay-domains /etc/sendmail.cf\n\
    relay-domains -o /etc/mail/relay-domains\n```\n\nIf the line is not found, edit\
    \ /etc/sendmail.cf and add the line just as it appears above, create the relay-domains\
    \ file and restart the sendmail daemon.\n\n```bash\n[root]# touch /etc/mail/relay-domains\n\
    [root]# chmod 600 /etc/mail/relay-domains\n[root]# /etc/rc.d/init.d/smtp restart\n\
    ```\n\n## Step 4.4.2.2. Set access for domains allowed to relay\n\nThe access\
    \ database has a simple “key value” format: the key is a fully qualified hostname,\
    \ subdomain, domain, or network; the value is an action, REJECT, DISCARD, OK,\
    \ RELAY, or any arbitrary message. Only hosts or domains with the RELAY action\
    \ are allowed to use the mail server as a relay. For example, if your domain is\
    \ example.org, and your server is also handling mail for all hosts at the 128.184.x\
    \ network, edit /etc/mail/access to read:\n\n```\nexample.org              RELAY\n\
    128.184.x               RELAY\n```\n\nFor distributions that use relay-domains,\
    \ instead, the file /etc/mail/relay-domains should be added to include just host\
    \ and domain names that are allowed to relay mail through the server, and no others.\
    \ Remember to restart the sendmail daemon after modifying the database.\n\nMuch\
    \ more information about relaying and anti-spam configuration control can be found\
    \ at http://www.sendmail.org/m/readme.html.\n\n## Step 4.4.3. Set domain name\
    \ masquerading\n\nMany organizations prefer to have uniform addresses for all\
    \ personnel, such as Joe.Schmo@example.org. Some clients can be set so that the\
    \ uniform address is used on all out-bound mail, but managing all the mail clients\
    \ in even a small group can be tedious. Sendmail can be configured to rewrite\
    \ the headers of all out-bound mail so they masquerade as the central server.\
    \ To define the masquerade address, edit /etc/sendmail.cf and look for DM in columns\
    \ 1-2. Append the masquerade name to this:\n\nDMexample.org\n\nOr, to be complete,\
    \ use the m macros and add the following:\n\n```\nMASQUERADE_AS ('example.org')\n\
    FEATURE(masquerade_entire_domain)\nFEATURE(allmasquerade)\nFEATURE(masquerade_envelope)\n\
    ```\n"
  mdcn: "\n\n# 第 4 步\n## 安全服务器网络配置\n\n## 步骤 4.3.2. 限制查询\n\n你可以使用 `allow-query` 选项限制允许查询名称服务器的主。可以使用\
    \ `listen-on` 选项限制允许查询的接口。这些选项可以全局应用于 `/etc/named.conf` 中的 `options` 列表：\n\n```\n\
    options {\n  allow-query ( 192.168.0/24 );\n  listen-on ( 192.168.0.1; 127.0.0.1\
    \ );\n};\n```\n\n或者也可以针对特定区域进行限制：\n\n```\nzone \"notransfer.com\" {\n  type slave;\n\
    \  masters ( 192.168.0.1;\n  allow-transfer ( none );\n  allow-query ( 127/8;\
    \ 192.168.0/24 );\n};\n```\n\n这对于保护防火墙环境中堡垒机上的区域信息非常有用。它允许只允许来自内部网络主名称服务器的查询，而影子主名称服务器则处理来自互联网的查询，并提供受限的防火墙网络视图。更多信息请参见《DNS\
    \ and BIND》，第三版，Ablitz and Liu, O'Reilly and Associates, 1998（这本书对于任何名称服务器都是必不可少的）。\n\
    \n## 步骤 4.3.3. 在 chroot 狱中运行 named\n\nBIND 版本 8.1.2 和 8.2 有以 root 以外的用户运行的能力，这有所帮助，但如果名称服务器被破坏，系统仍然会面临风险。为了提高安全性，可以将服务设置为在它自己的\
    \ chroot 目录树中运行。设置正确的 chroot 狱必须非常小心。不仅区域文件和其他配置文件需要位于 chroot 目录树中，运行 named 所需库、设备和可执行文件也必须放在那里。在以下示例中，用户名\
    \ (dns)、UID、GID 和家目录是随机选择的。请根据你的站点使用任何意义合理的唯一值。\n\n## 步骤 4.3.3.1. 创建新用户和组\n\n\
    ```bash\n[root]# groupadd -g 150 dns\n[root]# useradd -u 150 -g 150 -M dns\n```\n\
    \n## 步骤 4.3.3.2. 准备 chroot 目录\n\n```bash\n[root]# mkdir -m 0700 /home/dns\n[root]#\
    \ cd /home/dns\n[root]# mkdir -p etc lib dev usr/sbin var/named/run\n[root]# mknod\
    \ -m 666 dev/null c 1 3\n```\n\n## 步骤 4.3.3.3. 拷贝配置文件和程序\n\n```bash\n[root]# cp\
    \ /etc/named.conf etc\n[root]# cp -R /var/named/* var/named\n[root]# chown -R\
    \ dns.dns var/named var/run\n[root]# cp /usr/sbin/(named,named-xfer) usr/sbin\n\
    ```\n\n## 步骤 4.3.3.4. 拷贝共享库\n\n首先，输出需要的哪些库：\n\n```bash\n[root]# lld libc.so.6\
    \ => /lib/libc.so.6 (0x401c0000)\n/lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)\n\
    ```\n\n```bash\n[root]# cp /lib/libc.so.6 lib\n[root]# cp /lib/ld-linux.so.2 lib\n\
    ```\n\n## 步骤 4.3.3.5. 设置 syslog 监听 named 日志\n\nnamed 通过 /dev/log 与 syslog 通信，但在\
    \ root 狱中是不可能的。必须告诉 syslog 守护进程创建一个新的字字字 named 写入。编辑 /etc/rc.d/init.d/syslog，重写启动\
    \ syslog 守护进程的行：\n\n`daemon syslog -a /home/dns/dev/log`\n\n并重启守护进程：\n\n```bash\n\
    [root]# /etc/rc.d/init.d/named stop\n[root]# /etc/rc.d/init.d/named start\n```\n\
    \n## 步骤 4.3.3.6. 修改 named init 脚本\n\n编辑 /etc/rc.d/init.d/named 以在 chroot 狱中使用新的\
    \ UID/GID 启动守护进程：\n\n```bash\n# Start daemons.\necho -n \"Starting named:\ndaemon\
    \ named -u dns -g dns -t /home/dns\necho\ntouch /var/lock/subsys/named\n;;\n```\n\
    \n并重启名称服务器：\n\n```bash\n[root]# /etc/rc.d/init.d/named stop\n[root]# /etc/rc.d/init.d/named\
    \ start\n```\n\n为了确保运行正常，检查 /var/log/messages，named 应该写入类似条目：\n\n```\nJul 25 01:08:00\
    \ server named[1782]: chrooted to /home/dns\nJul 25 01:08:00 server named[1782]:\
    \ group = dns\nJul 25 01:08:00 server named[1782]: user = dns\n```\n\n使用 nslookup\
    \ 测试名称服务器是否按预期运行。\n\n## 步骤 4.3.3.7. 为 ndc 指定新的新的控制通道\n\n如果你需要运行名称服务器控制程序 ndc，则需要在\
    \ chroot 狱内指定新的控制通道：\n\n```bash\n[root]# ndc -c /home/dns/var/run/ndc\n```\n\n\
    使用 shell 别名或带有新控制通道的短脚本可以减少按键。\n\n## MAIL\n\n如步骤 3.6 所示，sendmail 是一个邮件传输代理 (MTA)，适用于\
    \ Red Hat 6.0 和其他发行版。Red Hat 6.0 附带 sendmail 8.9 版本，这是编写时的最新版本。Red Hat 或其他发行版的管理员应升级到\
    \ 8.9.3 版本。8.9 版本的 sendmail 默认允许使用你的服务器中发垃圾邮件。\n\nsendmail 的配置和操作非常复杂。所有的 sendmail\
    \ 管理员都应该有一本 Allman, O'Reilly & Associates, 1997 (the Sendmail Book)。对于初来说，手动修改\
    \ /etc/sendmail.cf 非常困难且容易出错。最好的方法是使用 m4 处理器，Red Hat 发行版中的 sendmail-cf* 软件包。关于\
    \ m4 的详细信息可以在 Sendmail Book 中找到。\n\n### 4.4.1. 关闭 /etc/sendmail.cf 中的 SMTP 和 accept\
    \ 命令\n\nSMTP 命令允许远程用户验证服务器上的电子邮件。accept 命令扩展别名列表：本地地址和别名应被视为机密或敏感。要关闭这些命令，更改 /etc/sendmail.cf\
    \ 并搜索 PrivacyOptions 行。将其改为：\n\n`PrivacyOptions=none`\n\nnone 是匿名、无接受、无访问的简写。每个隐私选项的完整描述可以在\
    \ Sendmail Book 中找到。要使用 m4 设置此，将以下内容添加到构建宏（对于 Red Hat Linux，这是 /usr/lib/sendmail-cf/cf/redhat.mc）并重建\
    \ /etc/sendmail.cf：\n\n```\ndefine(PRIVACY_FLAGS, `none`)\n```\n\n此示例步骤如下：\n\n\
    ```bash\n[root]# cp /etc/sendmail.cf /etc/sendmail.cf\n[root]# cd /usr/lib/sendmail-cf/cf\n\
    [root]# echo \"PRIVACY_FLAGS, `none`\" >>redhat.mc\n[root]# m4 redhat >/etc/sendmail.cf\n\
    [root]# /etc/rc.d/init.d/sendmail stop\n[root]# /etc/rc.d/init.d/sendmail start\n\
    ```\n\n## 第 4 步\n## 安全服务器网络配置\n\n## 步骤 4.4.2. 定义允许转发邮件的主\n\nSendmail V8.9 有内置停止邮件转发的检查。使用不知情的邮件服务器转发未经请求的邮件是垃圾邮件者的常用做法。组织邮件服务器允许组织内部的转发。转发通过访问数据库控制，在\
    \ Red Hat Linux 中位于 /etc/mail/access。其他发行版可能通过 /etc/mail/relay-domains 控制转发。下面讨论了两种方法。\n\
    \n### 步骤 4.4.2.1. 检查访问数据库是否激活\n\n为了确保 sendmail能够使用访问数据库，检查 /etc/sendmail.cf 中的数据库名称：\n\
    \n```bash\n[root]# grep access /etc/sendmail.cf\naccess -o /etc/mail/access\n\
    ```\n\n如果没有找到该行，添加此功能的唯一方法是使用 m4 宏 FEATURE('access_db')。参见步骤 4.4.1 中的示例。\n\n如果你的发行版使用的是\
    \ relay-domains 文件，请检查 sendmail 是否正在使用该文件：\n\n```bash\n[root]# grep relay-domains\
    \ /etc/sendmail.cf\nrelay-domains -o /etc/mail/relay-domains\n```\n\n如果没有找到该行，请编辑\
    \ /etc/sendmail.cf 并按上述所示方式添加该行，创建 relay-domains 文件并重启 sendmail 守护进程。\n\n```bash\n\
    [root]# touch /etc/mail/relay-domains\n[root]# chmod 600 /etc/mail/relay-domains\n\
    [root]# /etc/rc.d/init.d/smtp restart\n```\n\n## 步骤 4.4.2.2. 为允许的域名设置访问\n\n访问数据库具有简单的“键值”格式：键是完全限定的主机、子域名、域名或网络；值是操作，REJECT、DISCARD、OK、RELAY\
    \ 或任意消息。只有具有 RELAY 操作的主或域名被允许使用邮件服务器作为转发。例如，如果你的域名是 example.org，且你的服务器还处理 128.184.x\
    \ 网络上所有主邮件，编辑 /etc/mail/access 为：\n\n```\nexample.org              RELAY\n128.184.x\
    \               RELAY\n```\n\n对于使用 relay-domains 的发行版，相反，应向 /etc/mail/relay-domains\
    \ 文件添加内容，仅包含允许通过服务器转发邮件的主机和域名，不再包含其他。记住在修改数据库后重启 sendmail 守护进程。\n\n关于转发和反垃圾邮件配置控制的更多信息可以在\
    \ http://www.sendmail.org/m/readme.html 找到。\n\n## Steps 4.4.3. 设置域名伪装\n\n许多组织倾向于为所有人员设置统一地址，例如\
    \ Joe.Schmo@example.org。某些客户端可以设置为在所有发送邮件上使用统一地址，但即使是小小组的所有邮件客户端也很麻烦。sendmail\
    \ 可以配置为重写所有发送邮件的头部，使其伪装成中央服务器。要定义伪装地址，编辑 /etc/sendmail.cf 并查找 1-2 列的 DM：\n\nDMexample.org\n\
    \n或者，为了完整，使用 m 宏并添加以下内容：\n\n```\nMASQUERADE_AS ('example.org')\nFEATURE(masquerade_entire_domain)\n\
    FEATURE(allmasquerade)\nFEATURE(masquerade_envelope)\n```\n\n"
