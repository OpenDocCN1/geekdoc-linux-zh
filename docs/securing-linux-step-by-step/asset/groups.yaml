  - '[PAGE 62]


    # Step 4.4.4. Install an alternative MTA


    Several mail transfer agents are available to replace sendmail. Two popular alternatives
    are Qmail (www.qmail.org) by David Bernstein, and Postfix (www.postfix.org) by
    Wese Venena. Both of these MTAs were designed and written from the ground up with
    security and performance in mind. It is beyond the scope of this guide to get
    details on installing and configuring each of these alternatives; a wealth of
    information is available on the Internet.


    # Step 4.4.5. Secure the POP and IMAP daemons


    For mail servers that collect all incoming mail for an organization, a common
    means to deliver the mail to clients is for them to retrieve the mail using the
    Post Office Protocol (POP) or the Internet Message Access Protocol (IMAP). POP
    is older and simpler of the two protocols, providing basic commands for authentication,
    retrieval and deletion of mail messages from the mail server. IMAP is more flexible
    and supports creating, deleting, and renaming mail folders (mailboxes), selective
    retrieval of message attributes and more.


    # Step 4.4.5.1. Get the latest version of POP and IMAP daemons


    Many POP and IMAP daemon implementations have been plagued with vulnerabilities
    that lead to root compromises of servers on many platforms. There are several
    well-known exploit programs available for cracking vulnerable Linux POP and IMAP
    daemons. Hopefully, most of the problems have been found and fixed, and it is
    very important to have the absolute latest version of the daemon program on the
    server.


    # Step 4.4.5.2. Control access to POP and IMAP with TCP wrappers


    POP/IMAP is traditionally run out of inetd, so access control through TCP wrappers
    is easy and very important. Limit access to only those hosts that have a legitimate
    need for the service. A mail hub that holds mail for the entire example.org domain
    and 128.184 network, and delivers it to clients with POP version 3 or IMAP, put
    this in /etc/hosts.allow (remember from Step 3.21) that /etc/hosts.deny has only
    "ALL: ALL" for denial of all services by default):


    ```

    ipop3d   .example.org 128.184.

    imimapd   .example.org 128.184.

    ```


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_62_0.png)'
