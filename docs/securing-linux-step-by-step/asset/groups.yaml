    \n## 步骤 2.8 配置日志记录\n\nRed Hat 和大多数其他发行版使用 syslog 生成日志。syslog 守护进程根据“设施”（Facility）和“级别”（Level）解析消息。syslog\
    \ 存在一些安全问题，特别是没有内置方法可以判断日志是否被篡改。有几种替代守护进程可以为日志添加数字签名并对远程日志进行加密。参见附录 A 获取这些守护进程。\n\
    \n### 步骤 2.8.1. 优化 SYSLOG 设置\n\nRed Hat 的默认日志设置良好，但可以做得更好。为了改进它，请编辑配置文件 `/etc/syslog.conf`\
    \ 并添加以下内容：\n\n```\n*.warn;*.err      /var/log/syslog\nkern.*           /var/log/kernel\n\
    ```\n\n注意：第一列 syslog facility 与第二列 syslog 文件之间的分隔符必须是制表符（tabs）。如果是空格，syslog 将无法加载。\n\
    \n### 步骤 2.8.2. 配置 VTY 实时日志\n\n在 VTY 7 和 8 上实时显示系统日志（Alt-F7 和 Alt-F8 屏幕）非常有用。要实现此功能，请向\
    \ `/etc/syslog.conf` 追加内容：\n\n```\n*.info;mail.none;authpriv.none  /dev/tty7\n\
    authpriv.*               /dev/tty7\n*.warn;*.err              /dev/tty7\nkern.*\
    \                   /dev/tty7\nmail.*                   /dev/tty8\n```\n\n更新 `/etc/syslog.conf`\
    \ 后，你需要创建新的 syslog 文件并修复它们的权限：\n\n```\n[root]# touch /var/log/syslog /var/log/kernel\n\
    [root]# chmod 700 /var/log/syslog /var/log/kernel\n```\n\n要让 syslog 立即使用新配置，执行以下命令：\n\
    \n```\n[root]# killall -HUP syslog\n```\n\n### 步骤 2.8.3. 配置日志轮转\n\nRed Hat Linux\
    \ 以及其他发行版使用 logrotate 工具将日志文件保持在合理的范围内，并保留指定时间。有关该命令和配置文件，请参见手册页 logrotate(8)。\n\
    \n要调整默认的 Red Hat 日志轮转配置并轮转步骤 2.8.1 中创建的 syslog 和内核日志，请编辑 `/etc/logrotate.d/syslog`\
    \ 并添加以下内容：\n\n```\n/var/log/kernel {\n  compress\n  postrotate\n  /usr/bin/killall\
    \ -9 klogd\n  /usr/sbin/klogd &\n  endscript\n}\n```\n\n```\n/var/log/syslog {\n\
    \  compress\n  postrotate\n  /usr/bin/killall -HUP syslogd\nendscript\n}\n```\n\
    \n"
