    # STEP 6 Tools


    There are many security-related tools available for monitoring the computer from
    inside (host-based) and the outside (network-based). In this step, we will not
    present exhaustive details of the installation and operation of each tool. We
    just want to make you aware of the most common tools available, their general
    purpose and operational parameters. You are encouraged to inspect the documentation
    and Web sites mentioned, and experiment with the tools to craft them into an integrated,
    personalized toolkit.


    # STEP 6.1 HOST-BASED MONITORING AND INTRUSION DETECTION


    Host-based monitoring and intrusion detection (ID) tools generally concentrate
    on reading, processing and evaluating system log files. This implies that log
    files contain enough information to detect intrusion attempts in the first place.
    See Step 2.8.1 above for setting options in /etc/syslogd.conf and other logging
    options for maximizing the information available.


    As with any ID system, the greatest problem is "false positives": results that
    look like intrusions, or at the very trigger some action, when the event is completely
    innocuous. All ID and monitoring tools require patience and persistence on the
    part of the administrator. As proposed the best network access policy — deny the
    best intrusion detection policy is default. In other words, ignore those events
    that you are safe to ignore, and let the ID system report everything. Time and
    experience will allow you to win out events that do not require your attention.


    +   Step 6.1.1. Swatch, the SimpleWatCHER


    Swatch is a Perl program designed to read syslog files and generate events based
    on the content of the messages. Version 2.2 is supplied on the Red Hat Linux distribution
    media. Version 3.0 is in Beta testing at the time of this writing, available from
    http://ftp.stanford.edu/general/security-tools/swatch/. This is a complete rewrite
    taking greater advantage of the features of Perl version 5, and with a completely
    revamped configuration file for scanning the syslog files.


    The control file for swatch version 2.2 consists of a list of Perl regulars expressed
    by "actions." See the manual page swatch(5) for a detailed description of the
    file. Here is a simple control file that will only list the lines in the syslog
    file that have the word "refused" in them:


    ```

    /refused/ echo-bold

    /*/ ignore

    ```


