  md: '# STEP 3

    Securing Workstation Network Configurations


    Before you try to run AutoRPM to automatically download and install updates, /etc/autorpm.d/redhat-updates
    and add the command PGP_Require Yes in the action block labeled action (updated)`.
    This will force a PGP signature check of the RPM package before it is installed.
    You will need to install PGP or GPG and download the public keys for Red Hat before
    this will work. See the "PGP SIGNATURES" of the rpm(8) page for more information.


    AutoRPM also comes with a cron job that can be placed in /etc/cron.daily or which
    you prefer:


    ```

    [root]# cp autorpm.cron /etc/cron.weekly/autorpm

    ```


    The cron job is set up to make reports of what needs to be done to the address
    listed in /etc/autorpm.d/autorpm.conf in the variable ReportDest, by default.


    Configuring AutoRPM to work for other distributions can be as simple as changing
    the list of FTP sites in the /etc/autorpm.d/pools/redhat-updates file, however
    you may want to change the name to your distribution. If so, you will need to
    edit /etc/autorpm.d/autorpm.conf and change the entry for ConfigFile to reflect
    the new name.


    +   3.4.5. Subscribe to security-related mailing lists


    There are a lot of mailing lists that distribute information about computer security,
    newly discovered vulnerabilities and exploits, bug fixes, and updates. Even with
    an automated process for finding updates RPMs, it is important to stay informed
    about security-related problems for which updated software may not be available.
    At least you will know to turn a vulnerable service off until a fix is available.


    See Appendix A for a list of security-related mailing lists and instructions for
    subscribing. For a typical workstation user, a high-volume mailing list like Bugtra
    could result in overload. At a minimum, subscribe to the "announce" list for your
    Linux distribution.'
