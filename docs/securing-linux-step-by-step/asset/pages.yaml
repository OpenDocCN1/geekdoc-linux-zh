- img_proc: true
  md: '# STEP 4

    Securing Server

    Configurations


    # STEP 4.4 ELECTRONIC MAIL


    As mentioned in Step 3.6 above, sendmail is the Mail Transfer Agent (MTA) with
    Red Hat 6.0 and other distributions. Red Hat 6.0 ships with sendmail version 8.9.3,
    the latest version available as of this writing. Administrators of earlier releases
    of Red Hat or other distributions should upgrade to the version 8.9.3 of sendmail.
    The 8.9.x versions of sendmail dis electronic mail by default. Sendmail relay
    is a favorite tool of the purveyors of "spam" bulk mail to use your server for
    unsolicited mail.


    The configuration and operation of sendmail is quite complicated. All sendmail
    administrators should have a copy of "sendmail". Costales and Allman, O''Reilly
    & Associates, 1997 (the Bat Book) on their bookshelf. Modifying /etc/sendmail.cf
    by hand can be difficult and fraught with the beginner. The best way to make changes
    is to use the m4 processor system, package sendmail-cf*.rpm on the Red Hat distribution
    media. Full details on m4 can be found in the Bat Book.


    +   4.4.1. Turn off SMTP vfry and expn commands in /etc/sendmail.cf


    The vfry SMTP command allows a remote user to verify the E-mail of a local user
    on the server. The expn SMTP command expands aliases and mailing list: include:
    aliases. Local addresses and aliases should be considered confidential, or at
    least sensitive. To turn off the commands, change /etc/sendmail.cf and search
    for the line with PrivacyOptions. Change it to read:


    > PrivacyOptions=goaway


    The goaway is shorthand for authornings, noexpn, novrry, needmailho, needexphenlo,
    needvrfryhello; complete descriptions of each these privacy options can be found
    in the Bat Book.


    To set this with m4, add the following to the build macro (for Red Hat Linux,
    this is /usr/lib/sendmail-cf/cf/redhat.mc) and rebuild /etc/sendmail.cf:


    ```

    define(\CONFPRIVACY_FLAGS, `goaway`)

    ```


    A sample procedure for this follows:


    ```

    [root]# # cp /etc/sendmail.cf /etc/sendmail.cf

    [root]# # cd /usr/lib/sendmail-cf/cf

    [root]# # echo \\`CONFPRIVACY_FLAGS, \\`goaway\` >>redhat.mc

    [root]# # m4 redhat >/etc/sendmail.cf

    [root]# # /etc/rc.d/init.d/sendmail stop

    [root]# # /etc/rc.d/init.d/sendmail start

    ```


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_59_0.png)'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# STEP 4nSecuring Server Network Configurations


    # Step 4.4.2. Define hosts allowed to relay mail


    Sendmail V8.9 has built-in checks to stop mail relays. Using unwitting mail servers
    to relay unsolicited mail is a favorite practice of spammers. An organizational
    mail server has allow mail relay for mail clients inside the organization. Relaying
    is controlled through an access database, which is in the file /etc/mail/access
    in Red Hat Linux. Other distributions may control relaying through the file /etc/mail/relay-domains.
    Both methods are discussed below.


    +   Step 4.4.2.1. Check that the access database is active


    To make sure sendmail has the ability to use the access database check for the
    name of the database in /etc/sendmail.cf:


    ```

    [root]# grep Kaccess /etc/sendmail.cf

    Kaccess hash -o /etc/mail/access

    ```


    If the line is not found, the only way to add this feature is with the m4 macro
    FEATURE(''access_db''). See the sample procedure in Step 4.4.1.


    If your distribution uses the relay-domains file, instead, check to make sure
    that sendmail is using the file:


    ```

    [root]# grep relay-domains /etc/sendmail.cf

    FR-o /etc/mail/relay-domains

    ```


    If the line is not found, edit /etc/sendmail.cf and add the line just as it appears
    above, create the relay-domains file and restart the sendmail daemon.


    ```

    [root]# touch /etc/mail/relay-domains

    [root]# chmod 600 /etc/mail/relay-domains

    [root]# /etc/rc.d/init.d/smtp restart

    ```


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_60_0.png)'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Step 4.4.2.2. Set access for domains allowed to relay


    The access database has a simple “key value” format: the key is a fully qualified
    hostname, subdomain, domain, or network; the value is an action, REJECT, DISCARD,
    OK, RELAY, or any arbitrary message. Only hosts or domains with the RELAY action
    are allowed to use the mail server as a relay. For example, if your domain is
    example.org, and your server is also handling mail for all hosts at the 128.184.x
    network, edit /etc/mail/access to read:


    ```

    example.org              RELAY

    128.184                  RELAY

    ```


    For distributions that use relay-domains, instead, the file /etc/mail/relay-domains
    should be added to include just host and domain names that are allowed to relay
    mail through the server, and no others. Remember to restart the sendmail daemon
    after modifying the database.


    Much more information about relaying and anti-spam configuration control can be
    found at http://www.sendmail.org/m/readme.html.


    # Step 4.4.3. Set domain name masquerading


    Many organizations prefer to have uniform addresses for all personnel, such as
    Joe.Schmo@example.org. Some clients can be set so that the uniform address is
    used on all out-bound mail, but managing all the mail clients in even a small
    group can be tedious. Sendmail can be configured to rewrite the headers of all
    out-bound mail so they masquerade as the central server. To define the masquerade
    address, edit /etc/sendmail.cf and look for DM in columns 1-2. Append the masquerade
    name to this:


    DMexample.org


    Or, to be complete, use the m macros and add the following:


    ```

    MASQUERADE_AS (''example.org'')

    FEATURE(masquerade_entire_domain)

    FEATURE(allmasquerade)

    FEATURE(masquerade_envelope)

    ```'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Step 4.4.4. Install an alternative MTA


    Several mail transfer agents are available to replace sendmail. Two popular alternatives
    are Qmail (www.qmail.org) by David Bernstein, and Postfix (www.postfix.org) by
    Wese Venena. Both of these MTAs were designed and written from the ground up with
    security and performance in mind. It is beyond the scope of this guide to get
    details on installing and configuring each of these alternatives; a wealth of
    information is available on the Internet.


    # Step 4.4.5. Secure the POP and IMAP daemons


    For mail servers that collect all incoming mail for an organization, a common
    means to deliver the mail to clients is for them to retrieve the mail using the
    Post Office Protocol (POP) or the Internet Message Access Protocol (IMAP). POP
    is older and simpler of the two protocols, providing basic commands for authentication,
    retrieval and deletion of mail messages from the mail server. IMAP is more flexible
    and supports creating, deleting, and renaming mail folders (mailboxes), selective
    retrieval of message attributes and more.


    # Step 4.4.5.1. Get the latest version of POP and IMAP daemons


    Many POP and IMAP daemon implementations have been plagued with vulnerabilities
    that lead to root compromises of servers on many platforms. There are several
    well-known exploit programs available for cracking vulnerable Linux POP and IMAP
    daemons. Hopefully, most of the problems have been found and fixed, and it is
    very important to have the absolute latest version of the daemon program on the
    server.


    # Step 4.4.5.2. Control access to POP and IMAP with TCP wrappers


    POP/IMAP is traditionally run out of inetd, so access control through TCP wrappers
    is easy and very important. Limit access to only those hosts that have a legitimate
    need for the service. A mail hub that holds mail for the entire example.org domain
    and 128.184 network, and delivers it to clients with POP version 3 or IMAP, put
    this in /etc/hosts.allow (remember from Step 3.21) that /etc/hosts.deny has only
    "ALL: ALL" for denial of all services by default):


    ```

    ipop3d   .example.org 128.184.

    imimapd   .example.org 128.184.

    ```


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_62_0.png)'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# STEP 4 Securing Server Network Configurations


    +   - Step 4.4.5.3. Install an alternative POP or IMAP daemon


    There are several alternative POP daemons. One of the most popular is Qpopper
    from Qualcomm, Inc. This version supports POP3 extensions, APOP, and Kerberos
    V4. See Appendix for a URL to the Qpopper home page. As of writing the current
    stable release is 2.53, and version 3.0 is in beta release. A popular IMAP daemon
    replacement is Cyrus IMAPD from the Carnegie Mellon Electronic Mail Project. See
    Appendix A for more information on where to locate these packages.


    +   - Step 4.4.5.4. Install an SSL wrapper for secure POP/IMAP connections


    There are several third-party source programs that wrap TCP services with the
    Secure Socket Layer (SSL) to provide strong authentication and end-to-end encryption.
    For a list, see http://www.openssl.org/related/apps.html. Two applications that
    useful for providing secure POP/IMAP connections are stunnel and sslwrap (see
    Appendix A for URLs to these packages). Both packages require the Lease or OpenSSL
    packages. See Step 4.9.5 for information on downloading and compiling OpenSSL.


    # STEP 4.5 PRINTING SERVICES


    Red Linux ships with the Berkeley line printer system. Over the last few years,
    a buffer overflow exploits have been found in the lpr and lprm commands, both
    on the client side of the connection. If you are running a version of Red Linux
    earlier than 6.0, it is best to update to the latest version of the lpr package.


    +   - Step 4.5.1. List allowed remote hosts in /etc/hosts.lpd


    The names of hosts allowed to use this print server in /etc/hosts.lpd you by listing
    them in /etc/hosts.equiv, but method has serious implications in conjunction with
    the BSD "r" programs, rsh, login, etc. (see Step 4.2 for replacing the "r" programs
    with SSH).


    +   - Step 4.5.2. Replace Berkeley lpr/lpd with LPRng


    A popular alternative to the Berkeley lpr/lpd system is LPRng. It is compliant
    with the RFC1179 requirements for network printing, gives a great deal of flexibility
    to the administrator for defining permissions for specific actions, and supports
    authentication with Kerberos and PGP. Debian ship with LPRng already, administrators
    of those distributions can skip the installation step.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_63_0.png)'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# STEP 4 Securing Server Network Configurations


    # Step 4.5.2.1. Download and install LPRng


    Links to the latest stable version can be found at http://www.astart.com/LPRng.html.
    Download this version, and extract the files from the compressed file. Follow
    the instructions in the file INSTALL in the source directory to compile and install
    LPRng.


    # Step 4.5.2.2. Set remote etc and/or networks that are allowed access


    The file /etc/lpd.perms controls access to specific hosts or networks in addition
    to controlling specific operations, for instance it is possible to allow or deny
    specific users from removing jobs from the print queue. The default /etc/lpd.perms
    installed by LPRng is well commented and the package comes with lots of documentation.
    See the manual page for lpd.perms(5) for more information on the permissions configuration
    file.


    To restrict access to lpd to only hosts in the example.org domain, or network
    128.184. place the following in /etc/lpd.perms:


    ```

    REJECT SERVICE=X NOT REMOTEIP=128.184.0/255.255.0

    REJECT SERVICE=X NOT REMOTEHOST=*.example.org

    ```


    # STEP 4.6 NETWORK SYSTEM


    NFS by its very design has some serious security problems. The RPC service depends
    on UID/GID and IP authorization for permissions, all of which are easily spoofed.
    The NFS protocol, has enhanced with Secure RPC which uses cryptographic authentication,
    but to date there is no Linux implementation of Secure RPC available.


    Red Hat 6.0 has moved away from the "user-space" NFS implementation to a "kernel-space"
    implementation, knfad. Just recently, security problems were discovered in the
    user-space NFS code. Users of earlier Red Hat versions and other distributions
    that use the user-space code should upgrade to the latest version. This is not
    to say that there are no problems with the kernel-space code. The version shipped
    with Red Hat 6.0 has a bug that makes it impossible for non-Linux systems to mount
    directories on Linux systems. See at ftp.kernel.org/pub/linux/devel/gcc/ for the
    latest version, which corrects this problem.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_64_0.png)


    PAGE 54'
