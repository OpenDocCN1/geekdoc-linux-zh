- img_proc: true
  md: '# STEP 4

    Securing Server

    Network

    Configurations


    # Step 4.6.1. Set access to RPC services in /etc/hosts.allow


    RPC services are registered and accessed through the portmap daemon. The version
    of portmap supplied with all Linux distributions uses the TCP wrapper to allow
    or deny access to RPC services, such as NFS. The only difference from other TCP-wrapped
    services is that requests from the local host are always authorized, regardless
    of what is in the hosts.allow or hosts.deny files, and portmap does not have hostname
    lookups, so hosts.allow must specify by its IP address, or netmask.


    For example, allow NFS access to client1.example.org and client2.example.org,
    IP addresses 192.168.1.10 and 192.168.1.11 respectively, and the entire 128.184
    network, but this in /etc/hosts.allow:


    ```

    portmap: 192.168.1.10 192.168.1.11 128.184.0.255.0.0

    ```


    # Step 4.6.2. Limit exports to specific machines with specific permissions


    The file /etc/exports controls which directories are exported for NFS mounting
    and the hosts that are allowed to mount them. The format is:


    ```

    exported-dir      [host] (options)

    ```


    If you do not provide a host, the directory is exported to any host on the Internet,
    always provide a host name, and remember that the hostname''s IP address must
    match that in /etc/hosts.allow.


    Unless there is a compelling reason to otherwise, export the directory read-only
    with the "ro" option. File permissions on the exported directory are determined
    by the UID/GID of the user on the remote host that mounts the directory. If the
    remote host is compromised, the attacker can emulate any UID/GID for wishes. Therefore,
    any file on a read-write exported NFS directory can be created, altered, or deleted.
    The administrator of an NFS server should not allow NFS access to hosts outside
    his administrative control except in read-only mode.


    If all possible, avoiding a NetWare server to mount any UNIX filesystem, Linux,
    Solaris, whereas NetWare NFS services present significant security problems, such
    as read-write privilege regardless of the export restrictions.


    See the manual page for exports (5) for details on the options for /etc/exports.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_65_0.png)'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# STEP 4 Securing Server Network Configurations


    # STEP 4.7 SERVER MESSAGE BLOCK (SMB) SAMBA SERVER


    The SMB protocol is the core of the Common Internet File System developed by Microsoft
    for file and printer sharing. The idea behind Samba is to make a UNIX server look
    exactly like any NT server to its clients in the network neighborhood. Setting
    up the Samba software itself is relatively simple, but there are a number of nuances
    to successfully integrating it into the office environment. Samba server administrators
    should review the extensive documentation that comes with the server, and the
    book “Samba: Integrating UNIX and Windows,” Blair, SSC, Inc. ISBN 1-57831-006-7.


    +   * STEP 4.7.1. Get the latest version of Samba


    As of this writing, updated packages for Red Hat version 6.0 have been issued
    for Samba to correct problems. Check the updates for your distribution, and make
    sure that you have installed Samba version 2.0.5a or later.


    +   * STEP 4.7.2. Limit access to specific hosts


    Edit the /etc/smb.conf in the [global] section to set up the list of hosts that
    are allowed access to the Samba server and the interfaces that the Samba server
    will listen on:


    ```

    hosts allow = .example.org 128.184.

    interfaces 192.168.0.1/24 127.0.0/32

    bind interfaces only = true

    ```


    +   * STEP 4.7.3. Use encrypted passwords


    Before setting up Samba to use encrypted passwords, read

    /usr/doc/samba-2.0.5a/docs/textdocs/ENCRYPTION.txt.


    Red Hat Linux 6.0 defaults to looking for Samba passwords in /etc/smbpasswd. Other
    distributions may use /etc/samba.d/smpasswd, or a different path entirely. The
    path is in the configuration file /etc/smb.conf. You can create a template /etc/smbpasswd
    with the following command:


    ```

    [root]# mksmbpasswd.sh < /etc/passwd >/etc/smbpasswd

    [root]# chmod 006 /etc/smbpasswd

    ```


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_66_0.png)'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'Edit the template to remove entries for system accounts like bin, daemon, and
    ftp. The administrator should set default passwords for each of the accounts.
    If you wish to have users set their own password, you will need to edit /etc/smbpasswd
    and put the string “NO PASSWORD” in the first eleven characters in the password
    field, leaving the remaining 21 “X” characters. Then enable null passwords with
    the line:


    ```

    null passwords = true

    ```


    in the [global] section of /etc/smb.conf, restart the smb server. If you decide
    to use this method, give the users only a short period of time to reset their
    passwords. If any entries in /etc/smbpasswd contain the string “NO PASSWORD” after
    the deadline, then set passwords for the users.


    +   Step 4.7.4. Remove “guest” or anonymous shares


    The default /etc/smb.conf comes with Red Hat 6.0 only enables user-level shares
    of the home directories for each user on the local host. Other distributions may
    enable other publicly-readable shares. Before enabling Samba, carefully inspect
    the shares defined in /etc/smb.conf and disable any that are not absolutely necessary.
    For the remaining shares allow write access only when absolutely necessary. Consider
    setting write permissions for only those users who need the permission, not for
    any user connected to the service.


    +   Step 4.7.5. Set default file creation masks


    The default file creation mask makes files that are world-readable. Edit /etc/smb.conf
    and search for the following lines and change the mask to clear the “other” permission
    bits:


    ```

    create mask = 0770

    directory mask = 0750

    ```'
