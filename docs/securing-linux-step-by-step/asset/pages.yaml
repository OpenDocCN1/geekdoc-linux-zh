  md: '# STEP 6

    Tools


    # Step 6.3.2 Nessus


    Nessus (http://www.nessus.org) is an open-source security scanner that uses a
    client/server architecture. The Nessus daemon, nessusd, runs the scans and checks
    for vulnerabilities under the control of the client, which is written with a Gtk
    GUI interface. Nessus has a library of “plugins” to perform vulnerability tests.
    As of this there were 208 plugins, testing such things as IMAP and rpc.mount overflows,
    CGI script blogs, RPC services, WinGate proxy holes, and a series of denial-of-service
    attacks, just to name a few.


    Compiling and installing should be as simple:


    ```

    [root]# # ./configure; make; install

    ```


    The nessusd server must be run first. The first time nessusd runs it creates a
    host key and builds a default users file /usr/local/nessus/nessus.users. This
    file controls who may connect to the server. To add an entry for root, run nessusd
    again as:


    ```

    [root]# nessusd -P root,pass

    ```


    where pass is an initial password. Starting the client, nessus, you must first
    connect to the server. Enter “root” in the “Login:” window and click “Log in now!”.
    You will be prompted for the password entered above only the first time you log
    in, after that a private key is generated and for all subsequent logins.


    Note that Nessus tests for denial of service exploits defts by default, and our
    tests show that you are very likely to

    crash just every machine you scan if this option is enabled. Before performing
    a scan, go to the

    Plugins tab and disable Denial of Service.


    After a scan, Nessus pops up a report window with information for each scanned
    host. Security problemsnare highlighted with a red bullet, areas of concern are
    labeled with a black bullet. In both cases, a brief

    description is printed. Reports can be saved to disk for later study and comparison.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_91_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_91_1.png)


