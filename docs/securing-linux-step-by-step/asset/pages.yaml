  md: '# STEP 5 Tuning and Packet Firewalls


    # STEP 5.3 PACKET FIREWALLS AND LINUX MASQUERADING


    A Linux server running a well-configured firewall is one of the most effective
    ways to protect the local server and its internal networks behind it. Linux 2.2.x
    kernels have a very stable firewall implementation that is administered through
    a tool called iptchains. This tool gives the administrator flexibility to define
    the type of traffic allowed in and out of the firewall. However, that kernels
    prior to version 2.2.11 had a bug in the IP fragmentation code that allowed an
    attacker to send carefully IP fragments that would bypass iptchains rules. We
    recommend that administrators of enterprise systems install the latest version
    of the kernel (version 2.2.12) at the time of this writing.


    Firewall technology is a book in itself (for, "Building Internet Firewalls" Chapman
    & Zwicky, 1995, O''Reilly & Associates, ISBN 1-56592-124-0), and far beyond the
    scope of this guide. See the Resources for a URL to the IPCHAINS and IP-MASQ HOWTOs
    for an in-depth discussion.


    +   Step 5.3.1. Getting more from your external connection to IP Masquerade


    A firewall protects standalone servers very well but can also protect internal
    computers. A common example of this configuration would be a person or company
    connecting their home/office network to the Internet. A wrinkle to this is TCP/IP
    addresses used on the Internet are becoming a scarce and valued commodity. Thus,
    getting TCP/IP addresses for all of your internal computers can cost a bit of
    money. Network address translation (NAT) was developed to conserve TCP/IP addresses
    while still allowing internal computers to access the Internet. For Linux, a form
    of NAT was developed called Masquerade, which is in common use by many Linux users.


    +   Step 5.3.2. A strong /etc/rc.d/rc.firewall ruleset


    See Appendix D for the complete listing of a strong packet firewall script for
    an IP Masqueraded machine connected to the Internet via an Ethernet connection
    to a Cable modem, or other persistent network connection. There are extensive
    embedded comments to explain what the various rules do and how to modify the rules
    to suit your specific needs.'
  merge: -1
  pgno: 77
