  md: '# APPENDIX DnA strong packet firewall ruleset


    # Remote interface, claiming to be local machines, IP spoofing, get lost & log

    /sbin/ipchains -A input -j REJECT -i $EXTIF -s $INTLAN -d $UNIVERSE $LOGGING


    # DHCP Clients.


    # If you get a dynamic IP address for your ADSL or Cabelmodem connection, you

    # will need to enable these lines.


    # Enabled by default.

    /sbin/ipchains -A input -j ACCEPT -i $EXTIF -p udp -s $UNIVERSE -d $BROCAST/0

    /sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $UNIVERSE -d $BROCAST/0


    # FTP: Allow external users to connect to the Linux server ITSELF for

    PORT-style FTP services. This will NOT work for PASV FTP transfers.


    # Disabled by default.

    /sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $UNIVERSE -d $EXTIF ftp

    /sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $UNIVERSE -d $EXTIF ftp-data


    # HTTP: Allow external users to connect to the Linux server ITSELF for

    # HTTP services.


    # Disabled by default.

    /sbin/ipchains -A input -j ACCEPT -i $EXTIF -p tcp -s $UNIVERSE -d $EXTIF http


    # ICMP: Allow ICMP packets from all external TCP/IP addresses.


    # NOTE: Enabling ICMP packets via the firewall rules can do more than

    # just stop people from pinging your machine.

    # associated applications rely on various ICMP messages. Without ICMP, it

    # your Linux server and internal Masqed computers might not work.


    /sbin/ipchains -A input -j ACCEPT -i $EXTIF -p icmp -s $UNIVERSE -d $EXTIF


    # NFS: Reject NFS traffic FROM and TO external machines.


    # NOTE: NFS is one of the biggest security issues an administrator will face.

    # Do NOT enable NFS over the Internet or any non-trusted networks unless you

    # know exactly what you are doing.


    /sbin/ipchains -A input -j REJECT -i $EXTIF -p tcp -s $UNIVERSE -d $EXTIF 2049

    /sbin/ipchains -A input -j REJECT -i $EXTIF -p tcp -s $UNIVERSE 2049 -d $EXTIF


