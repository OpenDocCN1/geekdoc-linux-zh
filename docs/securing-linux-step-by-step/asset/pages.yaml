- img_proc: true
  md: '# STEP 3.5 CACHING-ONLY DOMAIN NAME SERVICE (DNS)


    Red Hat 6.0 includes the latest version of the Berkeley Internet Name Domain (BIND)
    software, version 8.2. This version includes several security-related bug fixes
    and additional security enhancements. Regardless, a Linux workstation has no need
    to run its own name server, even in a caching-only mode. Permanently disable and
    remove the software.


    +   - Step 3.5.1. Disable and remove DNS server software


    Stop the named daemon, if it hasn''t been done in step 3.3.2 above, and remove
    the software from the workstation:


    ```

    [root]# /etc/rc.d/init.d/named stop

    [root]# rpm -e caching-nameserver

    [root]# rpm -e bind

    ```


    +   - Step 3.5.2. Set primary and secondary nameservers


    If this was not done during the installation process, edit /etc/resolv.conf and
    add the IP addresses of your primary and, if available, secondary nameservers.
    Each of the name servers is denoted on a line by that looks like:


    ```

    nameserver www.xxx.yyy.zzz

    ```


    Logically enough, the IP for the primary nameserver is listed first, and the secondary
    nameserver. Since the caching Domain Name Service has been removed, make sure
    that there is no nameserver line that points to your local IP number or 127.0.0.1.'
