  md: '# STEP 4.10 HYPERTEXT TRANSFER PROTOCOL (HTTP) SERVER


    All major Linux distributions come with the HTTP server software. Apache is designed
    for flexibility and has a wealth of features. Most security-related settings are
    in the main configuration files in /etc/httpd/conf in Red Hat Linux. The file
    httpd.conf sets up basic operating parameters for the HTTP daemon, access.conf
    sets up access rules; and smm.conf sets up basic server configuration parameters
    like the document root, allowed directories, CGI script requests, and icons for
    indexes.


    See the Apache manual included with Red Hat 6.0, especially the Security Tips,
    http://localhost/manual/misc/security_tips.html, and the description of how sections
    work, http://localhost/manual/sections.html. The Apache manual is also available
    from the Apache Web site at http://www.apache.org/docs/.


    +   - Step 4.10.1. Set basic access to default deny


    ```

    access.conf, set the root directory access and options to:

    ```

    <Directory /

    Options None

    AllowOverride None

    order deny,allow

    deny from all

    </Directory>

    ```

    ```


    By default, access to all directories and files on the server is denied.


    +   - Step 4.10.2. Selectively open access to specific directories


    In the remainder of access.conf, specify only the access and options absolutely
    necessary. For an Intranet server, access should be allowed only to IP addresses
    on the internal network:


    ```

    ```

    <Directory /home/httpd/

    Options None

    AllowOverride None

    order deny,allow

    deny from all

    allow from 192.168.

    </Directory>

    ```

    ```'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# STEP 4

    Securing Server

    Configurations


    # Step 4.10.3. Selectively allow options on specific directories


    Consider the implications of allowing any of the following Options before you
    set them in the

    <Directory> directive:


    +   - ExecCGI: Should only be allowed for CGI directories

    - FollowSymLinks: If users have access to the HTML directories, they can set symbolic
    links to areas that contain sensitive data

    - Includes: Server side includes can be used to bypass default access restrictions

    - IncludesNOEXEC: Safer version of Includes that disables the #exec statement
    and #include of CGI scripts

    - Indexes: The daemon will print a directory listing for any directory without
    an index file (index.html). This may expose the names of files ordinarily hidden


    # Step 4.10.4. Selectively use .htaccess to override access control


    Changing the AllowOverride directive from None to All tells Apache to look for
    a file named .htaccess in the directory holding the requested file, and to interpret
    the contents of any of the default access and options directives for that directory.
    The advantage is that access and options can be set dynamically without editing
    the configuration file and restarting the server. The disadvantage is that security
    and options settings are no longer specified in a single place, but scattered
    around the directory structure. This can make it more difficult to audit the security
    policy for the Web site. In addition, there is a performance hit for every access,
    since the server has to look for, open and interpret the contents of the file
    for every request.


    # Step 4.10.5. Use password protection for sensitive data


    Apache allows for protecting directories and/files with username/password authentication.
    This provides a moderate level of security, although the username and password
    are passed over the network in the clear and are subject to being sniffed. The
    locally installed Apache manual, http://localhost/manual/mod/directives.html for
    more information on the AuthType, AuthUserFile, and other authentication directives.'
  merge: -1
