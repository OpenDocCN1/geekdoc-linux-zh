- img_proc: true
  md: '# STEP 4

    Securing Server

    Network

    Configurations


    # STEP 4.1 SERVERS: SEE STEPS 3.1, 3.2, 3.3, AND 3.4 FOR DISABLING ALL UNNECESSARY
    SERVICES, SETTING WRAPPERS, AND UPDATING SOFTWARE


    Like a workstation, a server should run only few network services to fulfill its
    purpose. An information server may be set up to run HTTP and FTP, but not also
    bear the burden of operating large mail lists or file sharing to a number of clients
    through Samba or NFS. While the remainder of this section provides steps for securing
    a number of services, by no means implies that a single machine should provide
    all of them at the same time.


    A typical server operates in a "lights-out" environment in a computer room. It
    should have few user accounts, and remote access to the server should be limited
    to Secure Shell, to avoid the possibility of sniffing passwords on the network,
    and to provide strong authentication and encryption of the login session.


    Consider whether any software development tools are necessary. A common mode of
    attack by crackers and "script kiddies" is to break into an ordinary user account,
    then download and compile exploit programs and root kits to compromise root and
    hide their tracks. If there is no C compiler or other development tools, it makes
    the task of the cracker that much harder. Development of tools and programs that
    have to run on the server, such as CGI scripts for a Web server, should be done
    on workstations, and tested thoroughly before installation on the operational
    server.


    While you are removing the packages for the compilers and development libraries,
    you should also browse through the list of packages on the system with rpm -qa
    to see what superfluous packages can be removed. In addition to the security benefits,
    removing unused packages frees disk space that can be used for additional logging
    and temporary space. If you are not sure what a package is for, try rpm -qi <package-name>
    to get more information. In fact, it can be very useful to execute:


    ```

    [root]# rpm -qail >/root/package.list

    [root]# chmod 400 /root/package.list

    ```


    This will dump a list of all installed packages, the package descriptions and
    a list of all the files in each package.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_49_0.png)'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# STEP 4 Securing Server Network Configurations


    # STEP 4.2 INSTALL SECURE SHELL FOR REMOTE ACCESS


    Secure Shell (SSH) was originally developed at the Helsinki University of Technology.
    It provides strong authentication using RSA public key cryptographic algorithms
    and automatic and transparent encryption of network communications for login and
    file copying operations. Source code for version 1 of the SSH protocol is freely
    available for non-commercial use. The license for version 2 source code is more
    limited, and any use at a commercial or government organization is forbidden without
    a commercial license. See http://www.ssh.fi/sshprotocols2/download.html for links
    to the License Agreement for SSH.


    +   Step 4.2.1. Download, compile, and install SSH


    SSH version 1 is available for download from ftp://ftp.cs.hut.fi/pub/ssh/, and
    if this is too busy, there is a list of mirror sites on the SSH download page
    cited above. As of the writing of this guide ssh-1.2.27.tar.gz was the latest
    version, and we will use this version in our examples below. Check the FTP for
    later versions, since problems and bugs are corrected in the version 1 source
    occasionally.


    ```

    [root]# wget ftp://ftp.cs.hut.fi/pub/ssh/ssh-1.2.27.tar.gz

    [root]# xzf ssh-1.2.27.tar.gz

    [root]# cd ssh-1.2.27

    [root]# ./configure --with-libwrap --without-rsh --disable-suid-ssh --disable-scp-stats

    [root]# make

    [root]# make install

    ```


    The options to the configure script do the following: compile the SSH daemon support
    for TCP wrappers; disables all support for rsh as a fall-back option; disables
    the set-uid bit on the SSH client; and turns off the printing of on-screen statistics
    by the secure copy program, scp (to emulate the behavior of rcp).


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_50_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_50_1.png)'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Step 4.2.2. Start the SSH daemon


    The SSH daemon, sshd, should be started at boot time and remain running as long
    as the server is up. A simple means for doing this is to add the line:


    ```

    /usr/local/sbin/sshd

    ```


    to /etc/rc.d/rc.local, where it will be executed after all other boot-time programs
    are started.


    See Appendix C for a Red Hat-centric SYSV-init script using the daemon and killproc
    functions. See this script into /etc/rc.d/init.d/sshd, and link it into the runlevel
    directories:


    ```

    [root] for i in /etc/rc.d/rc[345].d do (cd $; ln -s ..init.d/sshd S50sshd); done


    or, alternatively:

    [root] chkconfig sshd on


    to start the daemon now, without rebooting:

    [root]# /etc/rc.d/init.d/sshd

    ```


    # Step 4.2.3. Set up /etc/hosts.allow for SSH access


    Compiling SSH with the -with-libwrap configure option allows sshd to perform TCP-wrapper-style
    access control, inspecting the /etc/hosts.allow and /etc/hosts.deny files for
    each request. The syntax and options are exactly the same as any TCP-wrapped service,
    and the service name is sshd. For example:


    ```

    # Allow SSH access to anyone in our domain or the goodguys.org domain\sshd: LOCAL
    .goodguys.org

    ```'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Step 4.2.4. Generate SSH keys


    SSH performs user authentication and the exchange of session encryption keys using
    RSA cryptographic public keys. Each user who is allowed to access the server must
    generate a public/private key pair on the workstation that they will use to access
    the server, and the public key must be placed on the server in the account that
    they wish to login.


    On remote workstation, install SSH as per the instructions, then in your regular
    user account do:


    ```

    [user]$ ssh-keygen

    ```


    The key generator will compute the public and private key pair and prompt for
    the file to save them in, defaulting to ./identity in your home directory. Accept
    the default location. Then you will be asked to enter a passphrase.


    About passphrases: you are not required to enter one, and if you don''t, SSH will
    not prompt you for a passphrase when it uses the key (like when you start a login
    session, for example). This is especially handy if you plan to automate ssh or
    scp (SSH secure copy) in scripts. The downside is that if your workstation and
    account are compromised, the attacker will be able to access the server without
    entering a passphrase.


    For ordinary shell and file copy access to the server, it is best to use a passphrase,
    keeping in mind all the rules for selecting good passwords. If there is a need
    for automated, non-interactive access to the server using SSH, consider ssh-agent
    and ssh-add. The agent is a process that handles private keys for use by ssh and
    The ssh-add program communicates with ssh-agent and sends it the key, prompting
    for the passphrase if necessary. After your key is stored by ssh-agent, you will
    not need to enter a passphrase again for the remainder of the login session. See
    the manuals for ssh-agent(1) and ssh-add(1) for more information.


    When ssh-keygen is done, there will be two files in the .ssh directory, identity
    and identity.pub. The former is your binary private key, the latter is an ASCII
    file with your public key. The public key has to be stored on the server before
    you can use SSH to login.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# STEP 4 Securing Server Network Configurations


    The safest way to transport the public key to the server is "sneaker-net", i.e.,
    copy the key to the floppy and carry it to the server. Transmitting the public
    key over the network is generally safe, though. Even if the public key is sniffed
    off the network, it is useless without the private key and it is extremely difficult,
    if not impossible, to derive one from other. Never send the private key over the
    network, and make sure that the .ssh/identity file has 0600 permissions and is
    owned by you.


    Once the key is copied to the server, put it in the home directory of the account
    you wish to access (we''ll use the root account in our example) and assume the
    public key is in the file identity.pub in the home directory.


    ```

    [root] cd ~root

    [root] mkdir .ssh

    [root] cat identity.pub >> .ssh/authorized_keys

    [root] chmod 600 .ssh/authorized_keys

    ```


    The authorized_keys file holds the public keys for every user that is granted
    access. If you copy more than one using the method above, be careful with the
    redirection; make sure you append (>>) to the file, do not overwrite it ( >).


    +   * Step 4.2.5. Use ssh and scp for remote access


    With the SSH daemon running on the server, and the public key of a workstation
    user account in /root/.ssh/authorized_keys, you may now use SSH to access the
    server securely from your workstation.


    The ssh command works just like rsh. To open a login shell:


    To execute a command:


    ```

    [user@workstation]$ ssh -l root server ls /home/httpd/html

    ```


    The scp command works like rcp. To copy a file to the server:


    ```

    [user@workstation]$ scp This.File@server:That_File

    ```


    To copy lots of files from the server:


    ```

    [user@workstation]$ scp root@server:All.* backup_dir

    ```


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_53_0.png)'
  merge: -1
