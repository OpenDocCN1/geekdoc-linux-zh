  md: "# STEP 4\nSecuring Server\nNetwork Configurations\n\n# Step 4.3.2. Restrict\
    \ queries\n\nYou can limit the hosts that are allowed to query a name server with\
    \ the allow-query option. You can limit the interfaces that queries will be allowed\
    \ on with the listen-on option. These options can be applied globally in the options\
    \ list in /etc/named.conf:\n\n```\noptions {\n  allow-query ( 192.168.0/24 );\n\
    \  listen-on ( 192.168.0.1; 127.0.0.1 );\n};\n```\n\nOr the restriction can be\
    \ for particular zones:\n\n```\nzone \"notransfer.com\" {\n  type slave;\n  masters\
    \ ( 192.168.0.1;\n  allow-transfer ( none );\n  allow-query ( 127/8; 192.168.0/24\
    \ );\n};\n```\n\nThis is useful for protecting zone information on a bastion host\
    \ in a firewall environment. It allows queries only from the primary master nameserver\
    \ on the internal network while a shadow master nameserver handles queries from\
    \ the Internet and serves a much more restricted view of the firewall network.\
    \ See \"DNS and BIND,\" 3rd Edition, Ablitz and Liu, O'Reilly and Associates,\
    \ 1998 for more information (this book is indispensable for any nameserver).\n\
    \n# Step 4.3.3. Run named in a chroot jail\n\nBIND Versions 8.1.2 and 8.2 have\
    \ the ability to run as a user other than root, which helps, but still leaves\
    \ the system open if the nameserver is compromised. For better security, the service\
    \ can be set up to run in its own chroot directory tree. Setting up a proper chroot\
    \ jail must be done with care. Not only the zone files and other configuration\
    \ files need to be in the chroot directory tree, but libraries, devices, and executables\
    \ necessary for operation of named have to be there, too. In the following example,\
    \ the username (dns), UID, GID, and home directory were chosen arbitrarily. Use\
    \ whatever unique values make sense for your site."
