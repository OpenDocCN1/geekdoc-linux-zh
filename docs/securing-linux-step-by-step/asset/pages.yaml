  md: '# STEP 4

    Securing Server

    Configurations


    # Step 4.3.3.1. Create the new user and group


    ```

    [root]## groupadd -g 150 dns

    [root]## useradd -u 150 -g 150 -M dns

    ```


    # Step 4.3.3.2. Prepare the chroot directory


    ```

    [root]## mkdir -m 0700 /home/dns

    [root]## cd /home/dns

    [root]## mkdir -p etc lib dev usr/sbin var/named/run

    [root]## mknod -m 666 dev/null c 1 3

    ```


    # Step 4.3.3.3. Copy configuration files and programs


    ```

    [root]## cp /etc/named.conf etc

    [root]## cp -R /var/named/* var/named

    [root]## chown -R dns.dns var/named var/run

    [root]## cp /usr/sbin/(named,named-xfer) usr/sbin

    ```


    # Step 4.3.3.4. Copy shared libraries


    First, output which libraries are needed:


    ```

    [root]## lld libc.so.6 => /lib/libc.so.6 (0x401c0000)

    /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)

    ```


    ```

    [root]## cp /lib/libc.so.6 lib

    [root]## cp /lib/ld-linux.so.2 lib

    ```


    # Step 4.3.3.5. Set syslog to listen to named logging


    named communicates with syslog through /dev/log, but this is not possible in the

    root jail. The syslog daemon must be told to create a new socket for named to

    write. Edit /etc/rc.d/init.d/syslog, and rewrite the line that starts the

    syslog daemon to read:


    daemon syslog -a /home/dns/dev/log


    And restart the daemon:


    ```

    [root]## /etc/rc.d/init.d/named stop

    [root]## /etc/rc.d/init.d/named start

    ```


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_57_0.png)'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Step 4.3.3.6. Edit the named init script


    Edit /etc/rc.d/init.d/named to start the daemon with the new UID/GID in the chroot
    jail:


    ```

    # Start daemons.

    echo -n "Starting named:

    daemon named -u dns -g dns -t /home/dns

    echo

    touch /var/lock/subsys/named

    ;;

    ```


    And restart the nameserver:


    ```

    [root]# /etc/rc.d/init.d/named stop

    [root]# /etc/rc.d/init.d/named start

    ```


    To be sure it worked, check /var/log/messages, named should have written entries
    that something like:


    ```

    Jul 25 01:08:00 server named[1782]: chrooted to /home/dns

    Jul 25 01:08:00 server named[1782]: group = dns

    Jul 25 01:08:00 server named[1782]: user = dns

    ```


    Use nslookup to test that the nameserver is operating as expected.


    # Step 4.3.3.7. Specify a new control channel for ndc


    If you need to run the nameserver daemon control program, ndc, you will have to
    specify a new control channel within the chroot jail:


    ```

    [root]# ndc -c /home/dns/var/run/ndc

    ```


    A shell alias or a short script with the new control channel can be used to save
    keystrokes.'
