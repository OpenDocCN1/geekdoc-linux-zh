- img_proc: true
  md: 'Syslog: A centralized logging host hosts and stores syslog messages from other
    computers in the organization. As you can imagine, logging hosts need large amounts
    of disk space reserved for the /var/log directory. Good practice is to place /var/log
    on a large, fast SCSI device. Logging hosts should not run any other services
    at all, and be very secure, so the amount of disk space required for the system
    software is smaller than for other servers.


    Shell: Unix servers that provide shell accounts have separate partitions for /tmp
    and /var/log. This will reduce the impact of classic denial attacks that fill
    the /tmp directory with files or create a process that quickly fills the system
    logs until the root partition is full or the system cannot write any more log
    files, the system will usually crash.


    We recommend that servers have separate partitions for /var (or separate partitions
    for /var/log and /var/spool), the root partition "/", and the user partition /home,
    at a minimum. Some administrators might also consider partitions for /usr which
    contains the majority of the Linux Operating System, and /usr/local for optional
    user-installed applications and tools. Some distributions store large system packages
    like KDE, Netscape and DBMS systems in the /opt directory, you might consider
    a partition for that, too. The relative sizes of these partitions are solely at
    the discretion of the administrator depending on the purpose of the server and
    your own personal experience.


    As an example: a high-end PC with 256MB of RAM and (2) GB hard drives Primarily
    used for NNTP news services could be partitioned like so:


    | First hard disk | | 500MB |

    | First hard disk | /usr | 100MB |

    | First hard disk | /usr/local | 1500MB |

    | First hard disk | /tmp | 2000MB |

    | First hard disk | /var/spool/news | 4000MB |

    | Second hard disk | swap | 500MB |

    | Second hard disk | /home | 5500MB |

    | Second hard disk | /var | 3000MB |'
