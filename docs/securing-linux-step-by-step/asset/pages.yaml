  md: '# STEP 2

    Install Linux


    # Step 2.3.2 Define Server partitions


    Disk partitioning for servers is a very different animal. In general, all servers
    benefit from a, relatively large partition for /var. for logging, configuration,
    and temporary space. Additional factors that need to be considered for the purpose
    of the server:


    NNTP: News servers require large amounts of spool space, so a majority of disk
    space should be reserved for NNTP use only. Even better, the news pools on its
    own drive(s) for increased performance. Red Hat puts NNTP spool files in /var/spool/news.


    HTTP: Web servers require disk space for the site''s Web pages as well as users''
    Web pages (if allowed). Web servers require plenty of space for HTTP log files
    which consume a bit of space depending on how logging is configured, how long
    the logs are retained, Red Hat puts the main Web pages in /home/httpd and typically,
    individual user Web pages goes in the user''s home directory under /home in the
    public_html directory. Red Hat puts HTTP log files in /var/log/httpd.


    FTP: FTP servers can require anything from marginal disk space to large disk space
    depending on how they are used. Note that if you are going to allow FTP services,
    there should be enough space, or even a dedicated disk, for large sets of files
    to be uploaded. The main FTP directory for Red Hat is located in /home/ftp though
    users can "cd" into their home directory to get or put files. Red Hat puts log
    files in /var/log/xferlog.


    NFS/Samba: File servers typically require a lot of disk space unless the data
    is mounted on CDROM changes, other external jukeboxes or RAID disks. These systems
    should be able to scale with the needs of the users. Samba typically uses the
    user''s home directory in /home/* to put and get files NFS can be configured many
    different ways.


    E-mail: Mail servers require large amounts of spool space for storing incoming
    and outgoing messages, file attachments, etc. Red Hat puts incoming mail in /var/spool/mail
    in files uniquely named for each mail user account. Outgoing mail is stored in
    /var/spool/mqueue.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_16_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_16_1.png)'
  merge: -1
