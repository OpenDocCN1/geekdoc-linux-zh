- img_proc: true
  md: '# STEP 2

    Install Linux


    # Step 2.6.3. Password protect LILO boots


    The Linux Loader (LILO) is the primary mechanism for booting Linux. If the security
    of the Linux machine cannot be assured, password protect the LILO prompt in addition
    to requiring the root password to enter single user mode. Note that password protection
    of the LILO prompt may interfere with the automatic restart of a system after
    a power failure or system crash. Administrators of mission-critical servers in
    controlled computer room environments may not want this feature.


    To protect the LILO prompt, edit /etc/lilo.conf and add the following after the
    prompt line:


    ```

    password = your-password

    restricted

    ```


    Replace "your-password" a strong password as shown in Step 2.5.2. Save /etc/lilo.conf
    and change the permissions of that file since the LILO password is saved in clear
    text:


    ```

    [root]# chmod 600 /etc/lilo.conf

    ```


    Make the changes take effect:


    ```

    [root] # /sbin/lilo

    ```


    With these changes in place, the system will boot just as it has before, but if
    you give LILO any command line options at the LILO prompt, such as single to boot
    in single-user mode, it will ask for a password before proceeding.


    # STEP 2.7 SET SYSTEM ACCESS SECURITY POLICIES


    Most Linux distributions allow for configuring which users are allowed to login
    on the system, at which times, on which date, and through which services (TELNET,
    FTP, etc.). Most Linux distributions are configured correctly, if somewhat loose,
    out of the box, and it is important to confirm all of these settings.


    # Step 2.7.1. Check that root logins are disabled for TELNET


    The /etc/securetty file contains a list of all TTY interfaces that allow root
    logins. In Red Hat Linux, and most distributions, this file by default contains
    only the console TTYs (tty1, tty2, ... tty8, inclusive). If remote users require
    root privileges on this system, they can simply login to their own account and
    use the "su -" command to become root.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_22_0.png)


    PAGE 12'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# STEP 2 Install Linux


    +   Step 2.7.2. Check that remote root logins are disabled for FTP


    The /etc/ftusers file contains a list of all user accounts that are not allowed
    to login via FTP. Make sure that the root account and all additional system daemon
    accounts are listed in this file. You can also enter account names for other user
    accounts that you do not want to access the machine by FTP.


    +   Step 2.7.3. Configure the system accounts that can/cannot log into the system


    The /etc/security/access.conf contains login parameters for all accounts on the
    system. You can configure which users login through which service in a similar
    manner to TCP wrappers, as described in Section 3.2. To disable all console logins
    except for the root account and the administrator, put the following in /etc/security/access.conf:


    ```

    :ALL EXCEPT root admin :console

    ```


    +   Step 2.7.4. Configure the system groups that can/cannot use specific resources


    The /etc/security/group.conf defines which users can access files with specific
    permissions.


    The /etc/security/limits.conf defines system resource limits (CPU time, disk space,
    etc) for specific users or groups.


    The /etc/security/times.conf defines the times of day that specific users are
    allowed to access the system. Ordinary users can be restricted to logging during
    normal business hours through specific network services.


    # STEP 2.8 CONFIGURE LOGGING


    Red Hat and most other distributions use the syslog package for generating system
    logs. This package contains two log daemons, syslog and klod. The kernel log daemon,
    klod, takes care of logging messages and is configured through /etc/syslog.conf,
    just like syslog, and the two work in conjunction with each other seamlessly.
    Therefore, when we refer to syslog, we are also talking about klod. See the man
    page syslogd(8) for more information'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# STEP 2

    Install Linux


    The syslog daemon parses and separates log messages based on a system of "Facility"
    and "Level." The syslog daemon has some security problems, notably there is no
    built-in way to tell if the logs have been tampered with. There are several alternative
    log daemons that add features such as digital signatures for logs detecting tampering,
    and encrypted network communications for remote logging. See Appendix A for a
    list of these alternative log daemons.


    +   Step 2.8.1. Optimize SYSLOG settings


    The default logging for Red Hat Linux is good but it can be made better. To improve
    it, edit the syslog configuration file, /etc/syslog.conf, and add the following
    lines:


    ```

    *.warn;*.err      /var/log/syslog

    kern.*           /var/log/kernel

    ```


    > Note: The separators between the syslog facility directives in the first column
    and the syslog files in the second column must be TABS. If there are SPACES, the
    syslog daemon will not load properly.


    +   Step 2.8.2. Configure real-time logging to VTYs


    The real-time display of system logs on VTY 7 and 8 (the Alt-F7 and Alt-F8 screens)
    is very useful. To do this, append the following to /etc/syslog.conf:


    ```

    *.info;mail.none;authpriv.none  /dev/tty7

    authpriv.*               /dev/tty7

    *.warn;*.err              /dev/tty7

    kern.*                   /dev/tty7

    mail.*                   /dev/tty8

    ```


    Once /etc/syslog.conf has been updated, you will need to create the new syslog
    files and fix their permissions:


    ```

    [root]# touch /var/log/syslog /var/log/kernel

    [root]# chmod 700 /var/log/syslog /var/log/kernel

    ```


    To get syslog to immediately use the new configuration file, issue the following
    command:


    ```

    [root]# killall -HUP syslogd

    ```


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_24_0.png)'
  merge: -1
  pgno: 24
- img_proc: true
  md: "# Step 2.8.3. Configure log rotation\n\nRed Hat Linux, and some other distributions,\
    \ uses the logrotate tool to keep log files to manageable sizes and retain them\
    \ for a specified period of time. See the manual page logrotate(8) for more information\
    \ about the command and the configuration file.\n\nTo tune the default Red Hat\
    \ log rotation configuration and rotate the newly created syslog and kernel logs\
    \ in Step 2.8.1, edit /etc/logrotate.d/syslog and add the following:\n\n```\n\
    /var/log/kernel {\n  compress\n  postrotate\n  /usr/bin/killall -9 klogd\n  /usr/sbin/klogd\
    \ &\nendscript\n}\n```\n\n```\n/var/log/syslog {\n  compress\n  postrotate\n \
    \ /usr/bin/killall -HUP syslogd\nendscript\n}\n```"
