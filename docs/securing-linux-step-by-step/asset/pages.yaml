  md: '# STEP 5

    Tuning and

    Packet

    Firewalls


    +   - The packet had a TimeToLive (TTL) of 64 (every hop across the Internet will
    subtract 1 from this number, when TTL=0, the packet is dropped)


    +   - Though not available in earlier Linux kernel versions, if there is an additional
    field after TTL, it reflects the IPCHAINS rule number which caused the packet
    to log


    Putting it all together, we see that the OUTPUT rule for “DHCP Clients” was not
    enabled, resulting in a REJECTED packet. If you uncomment those two lines in the
    firewall ruleset and run the script again, DHCP will work fine.


    # Step 5.3.5. Running the firewall ruleset upon every reboot


    To make the /etc/rc.d/rc.firewall ruleset run when Linux boots, edit /etc/rc.d/init.d/network.
    Look for the end of the “start” case (immediately before the double semicolon
    "; ") insert the following lines:


    ```

    # Load the IPCHAINS ruleset

    etc/rc.d/rc.firewall

    ```


    This will invoke the firewall ruleset immediately after the network interfaces
    are initialized, minimizing the period of time the interfaces are vulnerable.'
