- img_proc: true
  md: '# STEP 3.6 ELECTRONIC MAIL


    A typical workstation does not need to run a Mail Transfer Agent (MTA), like sendmail,
    in daemon mode.

    Most Internet service providers, university, government, and commercial organizations
    provide mail servers.


    +   Step 3.6.1. Turn off sendmail daemon mode


    Edit /etc/sysconfig/sendmail to read:


    ```

    DAEMON=no

    QUEUE=15m

    ```


    The QUEUE option controls how often sendmail will "wake up" to process the outgoing
    mail queue,

    is set at 15 minutes in the above example. After saving the edited /etc/sysconfig/sendmail,

    restart the sendmail daemon:


    ```

    [root]# /etc/rc.d/init.d/sendmail restart

    ```


    +   Step 3.6.2. Define SMTP server for mail clients


    Red Hat, like most Linux distributions, with a large number of User Mail Agents
    (MUAs), including

    mail (aka Mail), elm, mut, pine, pbm, exnh, and Netscape. Each of these programs
    can be configured to

    send mail through an external MTA. Depending on the requirements for the organization,
    the external MTA

    will handle relaying the program to its final destination and address translation.


    The program (/bin/mail, aka /usr/bin/Mail), elm, mut, and pine will all invoke
    sendmail

    stand-alone to deliver the mail to the given e-mail address, thus their configuration
    does not include an entry

    for an SMTP server. The assumption here, however, is that your organization has
    an SMTP server that

    handles relaying all outbound electronic mail.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Step 3.6.2.1. Set out-bound SMTP server for sendmail


    You direct sendmail to relay all out-bound mail to the SMTP server with the SMART_HOST
    feature. There are two ways to do this, using m4 macros, or /etc/sendmail.cf directly.
    Using m4 macros for anything other than the simplest modifications to /etc/sendmail.cf
    is the preferred method, and is discussed in Step 4.4. For now, the simplest way
    to set the out-bound SMTP server for sendmail is to edit /etc/sendmail.cf directly.
    Look for a line that starts with DS (this should be near the top of the file,
    just after a heading that says “local info”). Edit this line to read:


    DSmtp.my.domain


    where smtp.my.domain is the fully qualified domain name of the SMTP server. To
    cover all bases for locally delivered mail, too, search for the lines that start
    with the two-letter combinations "DR","DH", and "DM" edit them accordingly:


    DRmtp.my.domain

    Hsmtp.my.domain

    DM.my.domain


    This will handle unqualified addresses (which do without any domain portion),
    and sets the masquerade address, respectively. Save /etc/sendmail.cf and restart
    sendmail.


    # Step 3.6.2.2. Set out-bound SMTP server for other mail clients


    As mentioned above, Pine will default using sendmail on the localhost for sending
    mail. You can set the SMTP server directly in Pine from the main menu by selecting
    "S" for setup, "C" for config, moving down to the field labeled smtp-server and
    entering the hostname of the SMTP server.


    The "new MH message system", nmh, and its X Window GUI front-end, can be configured
    to use an external server by editing the file /etc/nmh/mts.conf. Edit the servers:
    option, replacing the default "localhost" with the hostname of your SMTP server.


    The SMTP server is set in Netscape Messenger by selecting the Edit->Preferences
    dialog, selecting Mail & Newsgroups->Mail Servers, and placing the hostname of
    the SMTP server in the window under Outgoing Mail Server.'
  merge: -1
