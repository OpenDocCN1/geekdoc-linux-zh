  md: 'To reduce this list to list just the names of the daemons themselves:


    [root]# lsof -i -Fc | grep ''^c'' | cut -b2-20 | sort -u

    httpd

    lnpd

    named

    nmbd

    portmap

    rpc.mountd

    rpc.quotad

    rpc.statd

    sendmail

    smbd


    # Step 3.3.2. Eliminate unnecessary services


    The trick is to know which init script controls which daemon. Most of the daemons
    are controlled by scripts of the same name, the others can be found by using grep
    to search for the name in /etc/rc.d/init.d/*. To eliminate the service, first
    shut down with its init script, then remove the script from the runlevel directory.
    For Red Hat Linux, the easiest way to remove the links from the runlevel directories
    is with the /sbin/chkconfig program, or you can simply delete them. By default,
    chkconfig adds or removes links to scripts in level 3, 4, and 5. It does not delete
    the actual script in /etc/rc.d/init.d. If you are manipulating the runlevel scripts
    at the runtime scripts manually, remember to always remove the startup script
    from both the runlevel 3 and runlevel 5 directories, so that changing the runlevel
    will not unintentionally open network services you thought were turned off.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'The following # shutdown all services listed in Step 3.3.1 above:


    ```

    [root]# /etc/rc.d/init.d/httpd stop

    [root]# /sbin/chkconfig httpd off

    [root]# /etc/rc.d/init.d/lpd stop

    [root]# /sbin/chkconfig lpd off

    [root]# /etc/rc.d/init.d/named stop

    [root]# /sbin/chkconfig named off

    [root]# /etc/rc.d/init.d/netfs stop

    [root]# /sbin/chkconfig netfs off

    [root]# /etc/rc.d/init.d/smb stop

    [root]# /sbin/chkconfig smb off

    [root]# /etc/rc.d/init.d/nfs stop

    [root]# /sbin/chkconfig nfs off

    [root]# /etc/rc.d/init.d/portmap stop

    [root]# /sbin/chkconfig portmap off

    [root]# /etc/rc.d/init.d/sendmail stop

    [root]# /sbin/chkconfig sendmail off

    ```


    To remove the startup scripts manually, replace chkconfig with rm like so:


    ```

    [root]# /bin/rm /etc/rc.d/rc[345].*sendmail

    ```


    Once the service is turned off, consider removing the software package entirely.
    This frees up disk space and enhances security since local users can not abuse
    a service that isn''t there.


    # Step 3.3.3. Check for any remaining services


    Return to Step 3.3.1 and repeat with the netstat and lsof commands, checking for
    any remaining network services, and disable them until all network services are
    turned off.'
  merge: -1
