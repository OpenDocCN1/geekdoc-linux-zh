  md: '# STEP 5

    Tuning and

    Packet Firewalls


    # Step 5.3.3. Double check, install, and test the firewall


    Once you have the /etc/rc.d/rc.firewall ruleset copied into the machine, it is
    very important to tailor it to your specific environment. Make sure that the names
    of the internal and external interfaces are correct. Make sure the TCP/IP addressing
    scheme of your internal network is configured properly.


    Next, test the ruleset to be sure that it loads without errors, does not block
    any specific traffic that you need for your environment, and that it loads upon
    every reboot of the server.


    +   Step 5.3.3.1. Make the ruleset executable


    To be able to run the ruleset, you need to make the /etc/rc.d/rc.firewall script
    executable:


    ```

    [root]# chmod 700 /etc/rc.d/rc.firewall

    ```


    +   Step 5.3.3.2. Load the ruleset while at the console of the Linux server


    As shown in Step 2.8, monitor the console logs on VTY7 and VTY8. If the Firewall
    script runs without any visible errors, the system should immediately begin to
    block traffic that you want. The console logs will show you what is and isn''t
    blocked.


    When you execute /etc/rc.d/rc.firewall the output of the script should look something
    like the following:


    ```

    [root]# /etc/rc.d/rc.firewall

    ```'
