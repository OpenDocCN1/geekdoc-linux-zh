    \ scheme per RFC1918\n\n****\n\nNOTE: All 2.2.x Linux kernels prior to 2.2.11\
    \ have a fragmentation\n   bug that renders all strong IPCHAINS rulesets void.\
    \ It\n   is CRITICAL that users upgrade the Linux kernel to 2.2.11+\n   for proper\
    \ firewall security.\n\n****************************************************\n\
    # Initializing\n\necho -e \"\\nLoading IPCHAINS Firewall Version 3.12\"\necho\
