  md: "# Step 4.2.6. Replace “r” programs with SSH\n\nOnce SSH is installed and working,\
    \ there is no need to have the “r” clients (login, rsh, or rcp) or server daemons\
    \ (in.logind, in.rshd, in.rexecd) on the workstation or the server at all. Even\
    \ if they have been commented out of /etc/inetd.conf, removing the programs is\
    \ the safest course.\n\n```\n[root]# rpm -e rsh\n```\n\nOnce the “r” programs\
    \ are gone, SSH programs can be put in their place:\n\n```\n[root]# ln -s /usr/local/bin/binsh\
    \ /usr/bin/rsh\n[root]# ln -s /usr/local/bin/slogin /usr/bin/rlogin\n[root]# ln\
    \ -s /usr/local/bin/scp /usr/bin/rcp\n```\n\n# STEP 4.3 DOMAIN NAME SERVICE AND\
    \ BIND VERSION 8\n\nRed Hat 6.0 ships with BIND version 8.2, the latest version\
    \ available as of this writing. Administrators of earlier releases of Red Hat\
    \ and other distributions should check the version of BIND they are running. If\
    \ you are running BIND Version 4, upgrade to BIND version 8.2. If you are running\
    \ 8.1.1 or earlier you must upgrade to BIND Version 8.1.2 or later, the earlier\
    \ versions have a known remote root exploit. Check the updates for your distribution,\
    \ or download the latest source from http://www.isc.org.\n\n# Step 4.3.1. Restrict\
    \ transfer zones\n\nConfigure the primary name server to perform transfer zones\
    \ only to its slave servers, use the allow-transfer option for the zone in /etc/named.conf,\
    \ and specify the IP address of only slave servers for the zone:\n\n```\nzone\
    \ \"notransfer.com\" {\n\ttype master;\n\tfile \"db.notransfer.com\";n\tallow-transfer\
    \ ( 192.168.1.1; 192.168.2.1; );\n```\n\n```\nzone \"notransfer.com\" {\n\ttype\
    \ slave;\n\tmasters ( 192.168.0.1; );\n\tallow-transfer ( none );\n```\n\n![](img/0aaa698c422b2f7ffe93bff50cbbef96_55_0.png)"
