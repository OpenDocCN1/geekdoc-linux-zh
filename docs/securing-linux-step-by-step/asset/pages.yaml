  md: '# ADDITIONAL RESOURCES FROM THE SANS INSTITUTE


    # ELECTRONIC DIGEST


    # COOPERATIVE RESEARCH REPORTS AND PROJECTS


    Intrusion Detection Shadow:

    Step-by-Step Guide

    A guidebook to perform advanced intrusion detection. it uses the open source Cisco
    Shadow software developed at the Naval Surface Warfare Center and to protect more
    than 15,000 hosts through high-speed intrusion detection and analysis.


    The SANS Network Security Digest

    Published every month, and distributed via email, the SANS Network Security Digest
    reports on the most important new security threats and provides guidance on where
    to find the latest patches or information on the threats. Each entry can be read
    online or in email. The SANS Digest is written by Michele Guile with assistance
    from Mark Maurer, Gary Green, Steve Black, Bill Chechek, Gene Schulz, Marcus Rubin,
    Rob Kolb, Hal Homer, Penny Denny, and other leading editors. To subscribe by sending
    a message with the subject "subscribe" to digest@sans.org.


    The SANS Salary Report

    Published annually, the reports cover salaries of network administrators, and
    security professionals on their primary operating environment (UNIX, NT, or combination)
    where they live, the type and size of organization, whether they are employees
    or consultants, and other characteristics. It also reports the size of teams,
    raises by level, and the principal reports for average-average raises. More than
    15,000 people participated in the 1999 survey.


    The SANS Institute is a cooperative research and education organization which
    system administrators, security professionals, and network administrators share
    the lessons they are learning.


    Windows NT: Step-by-Step

    A consensus of security professionals from seventy-seven nations who worked to
    develop a list of ninety-three issues and eight phases that should be done to
    secure NT. 36 pages.


    It offers educational conferences and in-depth courses, cooperative research reports,
    and digests of authoritative questions.


    Computer Incident Handling: Step-by-Step

    A consensus of the leading handling agencies and experts plus fifty experienced
    incident handling professionals. 44 pages.


    The NT Digest

    The digest updates to NT Step-by-Step up-to-date guidance on new Hotfixes and
    Security Packs that should and not be implemented. It summarizes many new threats
    and news bugs in NT and its services. Subscribe to this digest by sending a message
    with the subject "subscribe nt digest" to digest@sans.org.


    Windows NT Tools: Administrator''s Consensus

    is a consensus report which two-hundred and twenty NT administrators shared their
    experiences in implementing and using the most popular tools for improving efficiency
    and security in Windows NT systems.


    # ROADMAP TO SECURITY POSTER


    Solaris Security: Step-by-Step\An extremely valuable collection of expert knowledge
    on how to make a Solaris system ready for it.


    The SANS Roadmap To Security Wall Poster

    Updated twice a year, these posters present "top ten" lists of answers to common
    questions: the best security books, the best security sites, the biggest threats,
    the vendor contacts, the top tools and more. they are mailed automatically to
    all Network Security Digest subscribers and people who attend the Institute conferences.


    Linux Security: Step-by-Step

    Red Hat and other Linux variants have great technology. To use it in the world
    of business they also need great security. This booklet provides the roadmap.


