  md: '# INTRODUCTION


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_1_0.png)


    One of the great sources of productivity and effectiveness in the community of
    computer professionals is the willingness of active practitioners to take time
    from their busy lives to share some of the lessons they have learned and the techniques
    they have perfected. Much of the sharing takes place through online news groups,
    through web postings, and through presentations at technical meetings, and those
    who are able to take the time to scan the newsgroups, surf the web, and attend
    the meetings often gain invaluable information from those interactions.


    SANS'' Step by Step series raises information sharing to a new level in which
    experts share techniques they have found to be effective. The SANS Institute integrates
    the techniques into a step-by-step plan and subjects the plan, in detail, to the
    close scrutiny of other experts. The process continues until consensus is reached.
    This is a difficult undertaking. A large number of people spend a great deal of
    time making sure the information is both useful and correct.'
