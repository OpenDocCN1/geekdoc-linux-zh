  md: '# # SECURING LINUX


    # INTRODUCTION


    We try to explain, as much as possible, the options and ramifications of securing
    a Linux box. however, this is not a text on security. Whenever possible, pointers
    to documents and resources are included in the text or in Appendix A. We encourage
    you to study these resources before setting up your Linux box, and to keep track
    of the latest information from the distributor, the SANS Institute, and other
    security references.


    By convention, commands executed by the root user are preceded by the command-line
    prompt `[root]#`. In the body of the system, commands and file names are in Courier
    fixed-spaced font. Command sequences and file contents are separate from the text,
    also in Courier fixed-space font. For reference manuals are in the traditional
    style, page (section) e.g.`inetdconf(5)`. To read the manual in Red Linux, and
    most other distributions, execute the command:


    ```

    `[root]# man 5 inetd`

    ```


    **IMPORTANT:**nUpdates will be advised whenever a change in these steps is required,
    and new versions will be published periodically.

    Please email info@sans.org with the subject <Linux Security> to subscribe to the
    monthly Network Security Digest containing news of new threats and solutions of
    updates. There is no change.


