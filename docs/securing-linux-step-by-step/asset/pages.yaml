- img_proc: true
  md: '# STEP 2

    Install Linux


    # Step 2.8.4. Configure remote logging


    In an organization of any significant size, using a centralized logging host has
    a lot of benefits. From a security point of view, remote logging is important
    because one of the first things that an attacker will do after gaining access
    to a machine is erase or modify the system logs to cover his tracks. If copies
    of log messages are stored on another, highly secured system, administrators may
    still be able to reconstruct what happened. If the logs are lost, important forensic
    evidence from the breach-is lost with them.


    To send syslog messages to a central logging host, edit /etc/syslog.conf and add
    lines for the facilities and logging levels dictated by the security policy of
    your organization. For example, to send all warning and error messages, and all
    authentication facility to the central (logging host), cod add the following:


    ```

    *warn.*;*.err @loghost

    authpriv.*;.auth.* @loghost

    ```


    # Step 2.8.5. Synchronize system clock with log server


    Hardware clocks in PC-class computers are notoriously inaccurate. When many workstations
    are feeding log messages to a central server, it is important that their clocks
    are synchronized, so that the stamps on the log messages are accurate. In the
    event of a network-wide scan or attack, synchronized log file times will make
    it easier to build a timeline of the attack. The Network Time Protocol was developed
    to accurately synchronize the system clock of a network of computers. An easy
    way to set the system clock once is to set up a cron job to run ntpdate once an
    hour. Put the following commands into the file /etc/cron.hourly/set-ntp:


    ```

    /usr/bin/ntpdate -bu -t 3 loghost.example.org

    sbin/hwclock --systohc

    ```


    The "b" option sets the time now, rather than staggering, "u" says to use an unprivileged
    port, and "t 3" set the time to 3 seconds, rather than the default 1. The second
    line sets the hardware CMOS value to the current system time. Once the file has
    been saved, set the permissions:


    ```

    [root]# chmod 700 /etc/cron.hourly/set-ntp

    ```


    Of course, this assumes that loghost.example.org is running the ntpd daemon. The
    ntp3 RPM package includes extensive documentation in HTML format for the /usr/doc/ntp3*
    directory. Also see http://www.ecis.udel.edu/~ntp/ for the latest information
    about NTP and a list of primary and secondary servers.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_27_0.png)'
  merge: -1
  pgno: 27
- img_proc: true
  md: "# STEP 3\nSecuring Workstation Network Configurations\n\nSecuring workstations\
    \ is primarily a process of eliminating network services, and severely limiting\
    \ access to the remainder. A typical workstation operates on the client end of\
    \ server-network communications. There is almost never a need to provide a service.\
    \ On the remote that a service is needed on a workstation, it should be offered\
    \ only to a small, group of other workstations or servers on the local area network.\
    \ In Step 3, we concentrate on removing services, then offer some advice on how\
    \ to increase the security of selected services if they are absolutely necessary\
    \ for the operation of the workstation.\n\n# STEP 3.1 DISABLE INTERNET DAEMON\
    \ SERVICES\n\nThe Internet daemon, inetd, controls access to network services\
    \ that do not start up when needed, such as telnet and flip. A typical workstation\
    \ has no need to provide the services in the daemon configuration file, /etc/inetd.conf.\
    \ If you need to access the workstation remotely over the network, consider installing\
    \ Secure Shell (SSH,; see Step 4.2 below). See the manual page inetd.conf(8) for\
    \ a complete description of the format in /etc/inetd.conf.\n\n+   * Step 3.1.\
    \ Edit /etc/inetd.conf and comment out all services\n\nSee Appendix B for a copy\
    \ of the /etc/inetd.conf installed with Red Hat Version 6.0. The services that\
    \ are open those that do not have a hash symbol \"#\" in column 1. Edit these\
    \ lines and comment them out by putting the comment character, \"#\", in the first\
    \ column. Save the edited file and make the inetd process reload the configuration\
    \ file by sending in the hang signal:\n\n```\n[root]# killall -HUP inetd\n```\n\
    \nIf you don't comment out other services, make at least that the shell and login\
    \ services are disabled. The Berkeley \"r\" programs rsh and login have a long\
    \ history of abuse and security problems. Even with the services disabled, you\
    \ should check to make sure that no user has a .hosts file in his home directory\
    \ and there is no /etc/hosts.equiv file. These are the files that the \"r\" programs\
    \ use to assign \"trust\" to users on other computers. The following short script\
    \ will check every home directory and tell you ones has .hosts files in.\n\n```\n\
    for i in sh\n  [ cut -d: -f6 /etc/passwd]; do\n    if [ -e $i/.hosts ]; then\n\
    \      echo \"SECURITY CHECK found .hosts in $i\"\n    fi\ndone\n```\n\n![](img/0aaa698c422b2f7ffe93bff50cbbef96_28_0.png)"
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Step 3.1.2. Turn off inetd if there are no services


    If the services in /etc/inetd.conf are needed at all, the inetd process itself
    can be turned off:


    ```

    [root]# /etc/rc.d/init.d/inetd stop

    [root]# /sbin/chkconfig inet off

    ```


    Administrators for distributions that do not have chkconfig can simply remove
    the init scripts directly:


    ```

    [root]# /bin/rm /etc/rc.d/rc[345].*inetd

    ```


    If for some reason, one of the services controlled by inetd is needed later, it
    can be turned on temporarily by running the SYSV init script:


    ```

    [root]# /etc/rc.d/init.d/inetd start

    ```


    # Step 3.2 USE TCP WRAPPERS TO CONTROL ACCESS TO REMAINING INETD SERVICES


    If you absolutely have one or more of the services in /etc/inetd.conf, use TCP
    wrappers to restrict access to a limited number of hosts. The TCP wrapper daemon,
    /usr/sbin/tcpd, is a small program that is invoked by inetd instead of the normal
    daemon program. It checks the source address of the request against its access
    lists in /etc/hosts.allow and /etc/hosts.deny. If the lists say that the request
    is allowed to connect, the wrapper daemon passes the connection to the appropriate
    service and everything as usual. If the lists say to deny access to the service,
    the connection is dropped. Either way, the wrapper daemon puts an entry in the
    system log document.


    Wrappers are installed by default by Red Hat and all other Linux distributions.
    The TCP wrapper daemon is invoked by default in /etc/inetd.conf for every external
    service, with the exception of the authentication daemon, identd, and the linuxconf
    administration tool. See the manual page for hosts_access(5) for details on the
    syntax of the /etc/hosts.allow and /etc/hosts.deny.


    # Step 3.2.1. Set the default access rule to deny all


    Edit /etc/hosts.deny so that the only uncommented lines read:


    ```

    ALL: ALL

    yypserv: ALL

    ```


    The second line is necessary only if you have installed the Network Information
    System (NIS) ypserv package.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Step 3.2.2. Allow access to only specific hosts for specific services


    For example, to allow ftp access from host.example.org, edit /etc/hosts.allow
    and add the line:

    in.ftptd: host.example.org


    After entering the control statement in /etc/hosts.allow, edit /etc/inetd.conf
    and remove the comment character from the line for the ftp service:


    ```

    ftp stream tcp nowait root /usr/sbin/tcpd in.ftptd -1 -a

    # killall -HUP inetd

    ```


    Whenever possible, avoid allowing access to entire domains or subnets, e.g. "example.org"
    or "192.168.1.1". Use only the specific hostnames or IP addresses of the machines
    that are allowed.


    # Step 3.2.3. Check the syntax of the access lists with tcpchk


    The TCP wrapper includes a simple program for checking the syntax of /etc/inetd.conf,
    /etc/hosts.allow and /etc/hosts.deny files to make sure there are no errors and
    that the files are consistent. Assuming /etc/hosts.allow and /etc/hosts.deny appear
    as you do, here is a sample run of tcpchk:


    ```

    [root]# tcpchk -v

    Using network configuration file: /etc/inetd.conf

    ```


    ```

    >> Rule         /etc/hosts.allow line 6:

    daemons:        in.ftptd

    clients:       host.example.org

    warning:        /etc/hosts.allow, line 6: host.example.org: host not found

    access:         granted

    ```


    ```

    >> Rule         /etc/hosts.deny line 9:

    daemons:        all

    clients:       all

    access:         denied

    ```


    Note the warning about host.example.org saying that it was not found in a lookup.
    This tells you you may have mistyped or erroneously entered the hostname (in this
    case this hostname is fictitious). Note that tcpchk will issue warnings about
    other services that are not listed in /etc/inetd.conf, which are compiled with
    TCP wrappers support, such as portmap for RPC errors (see Step 4.6.1) and sshd
    for Secure Shell (see Step 4.2.3). These warnings can be ignored.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# STEP 3

    Securing

    Workstation

    Network

    Configurations


    # Step 3.2.4. Set up banners for TCP wrapped services


    An important option for TCP wrapped is that of "banners." Most government agencies,
    and many commercial organizations, require banners on system access points, such
    as TELNET and FTP ports. Login banners warning that a system is off limits to
    unauthorized personnel are often required in order to successfully prosecute a
    person who breaks into the computer. TCP wrapped services can be set up to display
    a standard login banner. A Makefile has been supplied with the TCP wrappers documentation
    that makes maintenance of banners easier. To create an initial set of banners,
    execute the following:


    ```

    # mkdir /etc/banners

    # cp /usr/doc/tcp-wrappers-7.6/Banners.Makefile /etc/banners/Makefile

    # cd /etc/banners

    # echo "This is only the prototype banner. Replace with the real banner." >prototype
    banner

    # make

    ```


    By default, the Makefile creates banner files for the in.telnet, in.ftpd, and
    in.logmind services. Read the comments in the Makefile for information about banners
    for other services. The actual wording for the banner is usually a matter of local
    security policy. The Computer Incident Advisory Capability (CIAC) group has issued
    an information bulletin about banners that contain sample wording. See Appendix
    A for the URL.


    To activate banners, edit /etc/hosts.allow. For all lines that allow the banner
    services, add the "/etc/banners" option, followed by the "allow" option. Add another
    option line at the very bottom of /etc/hosts.allow setting up banners for denied
    services. For example, if telnet sessions are allowed from work.example.org:


    ```

    in.telnet: work.example.org : banners /etc/banners : allow

    all : all : banners /etc/banners : deny

    ```


    There are a rich set of options for TCP wrappers, including adjusting syslog facilities
    and levels, adjusting the run-time characteristics of the daemons, the "booby
    traps," and more. See the manual page hostsosts_options(5) and Appendix A for
    more information.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_31_0.png)'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# # STEP 3 DISABLE RUN-TIME NETWORK SERVICES


    # STEP 3 Securing Workstation Network Configurations


    The Internet daemon handles transient, "one-time" network connections, and there
    are other daemons that start at boot-time and normally run until system shutdown,
    as httpd for the Web, named for DNS services, and smbd for Samba SMB networking
    services. They are started at boot-time by the init process — process 1. Red Hat
    Linux, and most other distributions except Slackware, have a SYS-style init, which
    uses the concept of runlevels and run-time control scripts to manage the startup
    and shutdown of processes. See Step 2.6.2 for a discussion of the configuration
    file for init, /etc/inittab.


    See the manual init(8) for more information about init and a description of the
    six normal runlevels. There are two levels for normal operation: runlevel 3 is
    a character-mode console for login; runlevel 5 starts the X Window server and
    uses the X Display Manager (xdm) login. The scripts that control the startup and
    shutdown of processes for runlevel 3 are found in the directory /etc/rc.d/rc3.d,
    and runlevel 5 is in /etc/rc.d/rc5.d. To be precise, the scripts in these directories
    are symbolic links to general-purpose scripts used for every runlevel in /etc/rc.d/init.d.


    The names of the scripts are prefixed with numbers indicating the order in which
    they should be executed, for example s10network is executed before s5named, which
    is executed before s85httpd, and so on. The "S" tells init that the script is
    for startup, a "K" tells that the script is for shutdown ("Kill\ "S" scripts are
    passed a single argument, start, the "K" scripts are passed the argument stop.
    At any time, root can start or stop services by executing the scripts in /etc/rc.d/init.d,
    for example, to shutdown the Web server.


    ```

    [root]# /etc/rc.d/init.d/httpd stop

    ```


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_32_0.png)'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Step 3.3.1. Determine which network services are running


    Use /bin/netstat to list the ports that are “listening” for connections: connections
    (servers and established)


    | Proto Recv-Q Send-Q Local Address Foreign Address State |

    | tcp 0 0 **:netbios-ssn | *:* | LISTEN |

    | tcp 0 0 **:www | *:* | LISTEN |

    | tcp 0 0 **:smtp | *:* | LISTEN |

    | tcp 0 0 **:1040 | *:* | LISTEN |

    | tcp 0 0 **:702 | *:* | LISTEN |

    | tcp 0 0 **:697 | *:* | LISTEN |

    | tcp 0 0 **:692 | *:* | LISTEN |

    | tcp 0 0 **:673 | *:* | LISTEN |

    | tcp 0 0 **:printer | *:* | LISTEN |

    | tcp 0 0 192.168.1.3:domain | *:* | LISTEN |

    | tcp 0 0 localhost:domain | *:* | LISTEN |

    | tcp 0 0 **:sunprpc | *:* | LISTEN |


    Under “Local Address” the port numbers are reported by name if the service is
    found in the file /etc/services, otherwise only the port number is given. As we
    can see, the default installation still has a lot of services running even after
    commenting out all the services in /etc/inetd.conf.'
