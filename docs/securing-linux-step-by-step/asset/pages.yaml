- img_proc: true
  md: '# STEP 3.4 GET THE LATEST VERSIONS OF SOFTWARE


    In the remaining steps below, we discuss increasing the security of selected services.
    You should only enable the absolute minimum set of services necessary to do your
    work. Before enabling any services, make sure you have the latest version of the
    software. All the Linux vendors do a good job of keeping up with security-related
    bug fixes and update their FTP sites regularly with the latest software versions.


    +   Step 3.4.1. Find security-related updates


    Updated software, or “errata” in Red Hat’s parlance, can be found on their web
    site at http://www.redhat.com/corp/support/errata, see Appendix A for the locations
    of updates for other distributions. Red Hat has revamped the errata page for Red
    Hat 6.0, with security-related updates in one column and other package updates
    in another. At a minimum, you should review and retrieve all of the security-related
    updates.


    +   Step 3.4.2. Download updates


    FTP URLs to the updated packages are included in the errata page itself, so downloading
    the packages can be done straight through your Web browser. A good practice is
    to create a separate directory, for example /usr/local/updates, and place the
    updated packages there. Updated packages can also be downloaded en masse from
    http://updates.redhat.com. Select the directory for the proper number and architecture,
    e.g. 6.0/i386, and download all the files into /usr/local/updates. This can get
    tedious week after week, see Step 3.4 for information about automating the process.


    RPM has the ability to install packages directly over the network by supplying
    a URL for the package name; this eliminates the need for a separate download directory.
    For workstations on slow and/or unreliable network connections, like modern lines,
    it is best to download the package and install from a local copy, rather than
    having the network link drop or hang halfway into an update.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# STEP 3

    Securing

    Workstation

    Network

    Configurations


    # Step 3.4.3. Install updates


    Instructions for installing the updates with rpm are included in the errata pages.
    Generally, the package can be updated like:


    ```

    [root]# rpm -Uvh <package-name>

    ```


    For example to update Samba:


    ```

    [root]# rpm -Uvh samba-2.0.5a-1.i386.rpm

    ```


    To update directly over the network, a URL for the package name:


    ```

    [root]# rpm -Uvh ftp://updates.redhat.com/6.0/i386/samba-2.0.5a-1.i386.rpm

    ```


    If you have downloaded all of the latest updates into /usr/local/updates, you
    can "freshen" the packages that are already installed on your system with the
    command:


    ```

    [root]# rpm -F /usr/local/updates/

    ```


    This will upgrade only those packages in /usr/local/updates that have already
    been installed, with an earlier version number.


    Note that to update the kernel, use -i for "install" rather than -U for "upgrade".
    This will leave the previous version of the kernel intact (the "U" option removes
    the previous kernel), so if the new kernel does not work for some reason, the
    machine can still be booted with the old kernel. Also, if you are running a modular
    kernel, especially on a SCSI-based system, you may need to rerun mkinitrd before
    booting the updated kernel. See the manual page for mkinitrd(8) for more information.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_38_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_38_1.png)'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# STEP 3

    Securing

    Workstation

    Network

    Configurations


    # Step 3.4.4. Automate the process


    It is important to update the packages before using the workstation for day-to-day
    work, but it is just as critical to stay up to date time goes on. New bug fixes
    and enhancements are generated all the time. Trying to keep your local workstation
    synchronized with the updates can be tedious and time consuming.


    Happily, there are several third-party tools that automate the process of checking
    an FTP site for new packages, and even installing updates without human intervention.
    You can find these tools on the Metab FTP site in /utils/package/ subdirectory,
    in Freshman, and by other popular FTP sites. See Appendix A for specific URLs.
    We will discuss only one program here, but there are several others.


    # Step 3.4.4.1. Use AutoRPM to automate updates


    See Appendix A for the URL of the AutoRPM home page. To quote from the AutoRPM
    man page.


    AutoRPM is a program that can do any combination of the following: mirror RPMs
    from an FTP site, keep installed RPMs consistent with an FTP site or local directory,
    and keep installed RPMs in a cluster or network of systems consistent. It is highly
    flexible.


    To run AutoRPM you must first install "libnet" library, available from any Perl
    CPAN site. If you are unfamiliar with installing Perl CPAN, the author of AutoRPM
    has thoughtfully provided an RPM version available from his Web site.


    In our testing of AutoRPM for this guide, we found that the program is indeed
    very flexible, but a little tricky to install. The tar-ball could use a Makefile
    to make installation easier. The default configuration seems to work well for
    Red Hat Linux, and after a little browsing through the man pages, changing the
    configuration to find updates for other distributions was not difficult.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_39_0.png)


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_39_1.png)'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'To install AutoRPM, download the compressed tar file and extract the:


    ```

    [root]# cd /usr/local/src

    [root]# tar xzf <download-dir>/autorpm\*.tar.gz

    [root]# cd autorpm6

    ```


    where <download-dir> is where the tar file was downloaded. The wildcards in the
    commands simply avoid typing in the actual version number (which probably has
    changed by the time this guide went to press).


    Create the configuration file and install the configuration files, programs and
    on main pages:


    ```

    [root]# mkdir --mode 700 /etc/autorpm.d

    [root]# cp autorpm.conf autorpm.d/* /etc/autorpm.d

    [root]# mkdir --mode 700 /etc/autorpm.d/pools

    [root]# cp pools/* /etc/autorpm.d/pools

    [root]# install --owner=root --group=bin --mode=0700 autorpm.pl /usr/sbin/autorpm

    [root]# cp autorpm.8 /usr/local/man/man8

    [root]# cp autorpm.conf.5 /usr/local/man/man5

    ```


    Read the manual pages for autorpm(8) and autorpm.conf(5), but the default settings
    should work for Red Linux.


    Run AutoRPM manually in interactive mode to check for updated RPMs:


    ```

    [root]# autorpm --interactive

    ```


    AutoRPM will download the package names from the FTP sites listed in

    /autorpm.d/pools/redhat-updates and compare them to the set of currently installed
    packages. The default list of FTP sites is long. It is good practice to edit the
    list and pare it down to only those sites you know and trust, such as ftp://updates.redhat.com
    and perhaps a local mirror.

    Next, an interactive dialog allows you to choose to update now, update later,
    or view RPM information such as files, dependencies, scripts, and signatures.
    The manual page has all the details.'
