  md: "# APPENDIX D\nA strong packet firewall ruleset\n\n```\n# Turn on IP Forwarding\
    \ in the Linux kernel\n# There are TWO methods of turning on this feature. The\
    \ first method is the\n# Red Hat way. Edit the /etc/sysconfig/network file and\
    \ change the\n# \"FORWARD_IPV4\" line to say:\n\n    FORWARD_IPV4=true\n\n# The\
    \ second method is shown below and can be executed at any time while the\n# system\
    \ is running.\n\necho \" - Enabling IP forwarding.\"\necho \"1\" > /proc/sys/net/ipv4/ip_forward\n\
    \n# Disable IP spoofing attacks.\n\n# This drops traffic addressed for one network\
    \ though it is being received on a\n# different interface.\n\necho \" - Disabling\
    \ IP Spoofing.\"\nfor file in /proc/sys/net/ipv4/conf/*rp_filter\ndo\n    echo\
    \ \"1\" > $file\ndone\n\n# Comment the following out of you are not using a dynamic\
    \ address\necho \" - Enabling dynamic TCP/IP address hacking.\necho \"1\" > /proc/sys/net/ipv4/ip_dynaddr\n\
    \n# Masquerading Timeouts\n# Set timeout values for masq sessions (seconds).\n\
    # Item #1 - 2 hr timeout for TCP session timeouts\n# Item #2 - 10 sec timeout\
    \ for traffic after the TCP/IP \"FIN\" packet is received\n# Item #3 - 60 sec\
    \ timeout for UDP traffic\n\necho \" - Changing IP masquerading timeouts.\"\n\
    /sbin/ipchains -M S 7200 10 60\n```\n\n![](img/0aaa698c422b2f7ffe93bff50cbbef96_105_0.png)\n\
