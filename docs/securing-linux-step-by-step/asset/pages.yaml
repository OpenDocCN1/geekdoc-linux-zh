  md: '# STEP 2

    Install Linux


    Next, edit /etc/logrotate.conf to modify the log rotation behavior to meet your
    needs. In the following example, logrotate will rotate logs weekly, keep the last
    four weeks of logs before it deletes, compress the rotated logs, and not rotate
    the utmp and wtmp files:


    ```

    # see "man logrotate" for details

    # rotate log files weekly

    weekly

    # keep 4 weeks worth of backlogs

    rotate 4

    ```


    ```

    # send errors to root

    errors root

    # create new (empty) log files after rotating old ones

    create

    ```


    ```

    # uncomment this if you want your log files compressed

    compress

    ```


    ```

    # RPM packages drop log rotation information into this directory

    include /etc/logrotate.d

    ```


    ```

    ## no packages own lastlog or wtmp -- we''ll rotate them here

    #/var/log/wtmp {

    # compress

    # monthly

    # rotate 1

    }

    ```


    ```

    #/var/log/lastlog {

    # compress

    # monthly

    # rotate 1

    }

    ```


    Once these changes are done, they will be automatically executed from the crontab
    file

    /etc/cron.daily/logrotate once a day (the default setting of Red Hat 6.0).


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_26_0.png)'
