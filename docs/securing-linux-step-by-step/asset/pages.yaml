- img_proc: true
  md: '# STEP 3.7 NFS CLIENT-SIDE SECURITY


    A typical workstation does not need to export directories to be NFS-mounted by
    another computer. The Network File System has inherent security problems because
    the Remote Procedure Call (RPC) mechanism it relies on uses IP number and UID
    for authentication, opening NFS to IP spoofing attacks.


    +   Step 3.7.1. Turn off NFS exports and remove NFS daemons


    If there is no alternative to exporting NFS mount points, see Step 4.6 for information
    on limiting access and permissions, otherwise turn off NFS and remove the NFS
    software completely:


    ```

    [root]# /etc/rc/init.d/nfs stop

    Shutting down NFS services: [ OK ]

    Shutting down NFS mount: [ OK ]

    Shutting down NFS daemon: [ OK ]

    Shutting down NFS quotas: [ OK ]

    Shutting down NFS statd: [ OK ]

    [root]# rpm -e knfsd

    ```


    +   Step 3.7.2. Configure local NFS mounts


    Even with the NFS daemons deleted from the workstation, you can still mount NFS
    directories from a central server as long as the NFS file system is compiled into
    the kernel. For a workstation environment, this is the normal use of NFS. For
    example, say you are a member of a software development team and the code for
    your project is mounted on a central server called project in the directory /usr/src/src/devel.
    You wish to mount this directory on your workstation at m/devel. Since all you
    need to do is copy source files in and out, mount the directory with the following
    options:


    rw Mount read-write

    hard Do a "hard" mount, i.e. hang if the server does not respond

    noexec Do not allow executing binaries

    nosuid Do not honor set-uid or set-gid bits (redundant with noexec)

    nodev Do not interpret character or block files'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# STEP 3

    Securing Workstation

    Network Configurations


    For example:


    ```

    [root]# mkdir /mnt/devel

    [root]# mount -t nfs -o rw,hard,noexec,nosid,nodev project:/usr/src/devel /mnt/devel

    ```


    Note that read write permissions on the NFS-mounted directory are defined by the
    UID and GID of the owner on the server (project), not the client (your workstation),
    the UIDs and GIDs need to match across both machines.


    To have this directory mounted every time your workstation is booted, the mount
    point in /etc/fstab like so:


    ```

    /mnt/devel project:/usr/src/devel nfs rw,hard,noexec,nosid,nodev,bg,auto 0 0

    ```


    Adding auto allows for the init scripts to mount the NFS directory at boot-time
    (i.e. with mount -a). Note, however, specifying a hard mount means that the workstation
    will hang if the NFS server is not up and running. Therefore, we have added bg,
    /bin/mount to do the mount in the background and allow us to proceed in the event
    the server is not immediately available. You may also add another option, intr,
    to allow the mount point to be interrupted in case of a hang. If the NFS server
    or the local network have reliability problems, consider using a soft mount, as
    opposed to a hard mount. The advantage is that the workstation will not hang when
    the NFS server is down or unavailable; the disadvantage is you may lose data on
    the NFS server if it is down and the client times out.


    In the case that the NFS mount is expressly for the purpose of sharing executable
    programs (like /usr/local/bin on the NFS server, for example), you will need to
    change noexec to exec think hard before changing nosuid to suid to allow set-uid
    and set-gid permissions. Note that the nosuid and noexec options can still be
    defeated by programs like suidperl copy a script as a normal data file, then execute
    it with SUID privileges. See the manual page for mount (8) and fstab(5) for more
    information.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# STEP 3.8 LIMIT WORLD WIDE WEB SERVICES TO THE LOCAL HOST


    Like more distributions, Red Hat 6.0 installs a fully functional Apache Web server
    that, by default, allows connections from any computer on the Internet. For a
    typical workstation setup, this is not necessary. If you are a Web developer,
    though, having a fully localized Web server is extremely useful for testing devices,
    CGI scripts, applets, etc. before they are deployed on an operational web site.


    +   Step 3.8.1 Turn off HTTP and remove the server software


    If there is no need for a local web server, simply remove it from the workstation:


    ```

    [root]# /etc/rc.d/init.d/httpd stop

    Shutting down http:                   [ OK ]

    [root]# rpm -e apache

    [root]# rpm -e apache-devel

    ```


    +   Step 3.8.2 Limit HTTP access to localhost only


    The Apache HTTP daemon can be bound to a specific network interface. If the interface
    is localhost, IP 127.0.0.1, then any attempt to connect to port 80 from an outside
    network results in a connection refused. From the error, it looks like there isn''t
    any Web server on the machine at.


    Edit /etc/httpd/conf/httpd.conf, and look for a section near the bottom with the
    option

    "Listen" — it should come just before the section for VirtualHost. Add the following
    line:


    Listen 127.0.0.1:80


    Save /etc/httpd/httpd.conf and restart the web server:


    ```

    [root]# /etc/rc.d/init.d/httpd restart      [ OK ]

    Shutting down http:                               [ OK ]

    Starting http:

    [root]# netstat -a | grep www

    tcp        0       localhost:www             *LISTEN

    ```


    The netstat command shows that the Web daemon is listening only on the loopback
    device, not the regular network device. To test that access is denied, from another
    computer, try:


    $ telnet workstation 80

    Trying 192.168.1.3...

    tel: unable to connect to remote host: Connection refused

    The Web server is now closed to everyone except users on the workstation itself.


    ![](img/0aaa698c422b2f7ffe93bff50cbbef96_47_0.png)'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# STEP 3.9 REMOVE ANONYMOUS FTP SERVICE


    Even though you probably turned off the FTP service in Step 3.1.1 above, or limited
    access to it with TCP

    wrappers in Step 3.2.1, you should eliminate the ability to do anonymous FTP.
    First edit

    /etc/ftpaccess and change the line that reads:


