  ## 结论

  随着技术的日益普及以及设备和网络的进步，安全无疑将成为一个关键的风险因素。但既然如此，我们难道应该不使用它吗？完全不是！将会有永久的安全辅助工具来阻止和消除这些安全威胁。但利用这些强大的工具也是一个重要且值得学习的方面。人们不能简单地将其投入使用来规避风险，还要考虑到产品自身缺陷带来的风险。


  ### 第九章：网络安全在公司中的作用

  网络安全对于几乎任何公司都是至关重要的。没有企业希望成为网络攻击的受害者；因此，网络安全在企业中的功能是极其关键的。确保特定业务不会成为任何网络攻击受害者的最有效方法，是在几乎任何攻击发生之前，确保业务安装了一套极佳的安全计划。


  在企业中，人员、流程和工程应该相互对等，以获得对网络攻击的非常成功的防御。单个威胁管理设备可以自动化围绕选定的 `Cisco Security` 产品的集成，并加速严重的安全运营功能：检测、调查和修复。


  随着如今更年轻、更精通技术的一代参与到业务的大部分，组织网络安全策略、协议和处理方案的健康状况在 2018 年变得极其重要。由于他们在电脑和物品上存储的个人信息比那些年长、更依赖纸质的同事得多，以下三十四项行业填充的网络安全职责投射了更广泛的接触网，让那些心理异常的网络分子无处遁形。


  远程办公和特定设备的使用提供了移动性设计，使组织能够通过信息、应用程序和网络为自己提供广泛准备的风险识别能力。因此，由于网络安全在组织中的优势，它是业务社区内的一个重要议题，任何掌门人都应该加强教育、参与和评估的倡议；这样，无论员工在何处或如何工作，组织都能保持受保护状态。


  对技术日益增长的依赖只是使网络安全对现代组织变得至关重要的方面方面；监管机构对保护消费者信息的压力是推动网络安全推向业务议程之巅的另一个主要驱动力，即将到来的
  `EU GDPR` 指令准备加强对关键的美国和全球业务组织的问责制，以及非实际物理资产日益增长的重要性。顺应这种趋势，公司必须重新评估自身的文化和风险管理框架，以具备执行极佳替代网络安全计划的能力，从而在所有企业业务中更好地评估和减轻机会。


  显然，如果 2018 年的收入预测是过去式，公司正在重视其网络安全人员的价值，根据 `Robert Walters''` 年度现金流调查预测，本季度网络专家的薪资将增长
  7%，是整个 IT 职业中最高的加薪。这只是几家公司正在努力让他们的网络安全团队感到满意，意识到除了收入之外，你还会发现其他同样吸引人的激励措施来吸引和留住网络人才。工作时间的灵活性和远程办公的选项对于网络专业人士以及他们从事的工作类型来说是一个巨大的吸引力，前提是他们真的对公司文化感到积极。


  现在是时候了，各种规模的企业都需要推力一把来运行网络安全角色。因为移动性、远程办公和物联网（`IoT`）在整个业务中创造了复杂的漏洞。担忧点将是，全球实体通过小型承包商或可能使用
  `IoT` 的供应商被渗透，因为这会更容易进入他们的网络，因此，各种组织应该考虑第三方风险管理的安全性以避免这种情况的发生。


  在另一个结论是，中小企业应该在自己的范围内采取措施加强其个人信息，并最好在过去化解威胁。多因素身份验证将成为供应商用于对抗生物识别攻击和密码破解的主要资源之一，因为他们的目标是采取更严格的安全措施，此外，与组织外的专家咨询以确保他们的保护计划能够针对完全新的可能性被正确创建，并提高首席风险官（`CROs`）的影响力和范围，协助为组织提供网络对公司影响的
  360 度视图。


  严峻的网络安全涉及人员、流程和技术。


  ## 人员

  每位员工都需要关注他们阻止网络威胁的工作。网络安全人员必须跟上可能最新的风险、解决方案和资质。所有者必须理解并遵守基本的信息安全原则，如选择强密码、警惕电子邮件中的附件以及备份数据。了解更多关于核心网络安全的概念。


  ### 流程

  记录的流程应该定义角色、职责和程序。网络威胁不断演变，因此程序必须不断审查。企业必须使用一个框架来处理如何应对每次尝试和成功的网络攻击。一个备受推崇的框架可以指导你。它描述了你能够应对攻击、保护应用程序、检测和响应威胁以及克服有效攻击的策略。查看
  `NIST` 网络安全框架的视频解释 (1:54)。


  ### 技术

  从访问配置到安装杀病毒软件，技术可以用于降低网络风险。技术对于为企业和个人提供保护不受网络攻击的计算机安全设备至关重要。需要保护的三个领先实体：作为系统的终端设备、敏感物品以及路由器；网络；以及云。保护这些实体的常规技术包括下一代防火墙、DNS
  过滤、恶意软件防护、杀病毒软件和电子邮件安全方法。


  ### 第十章：网络安全的利益

  ## 网络攻击的成本

  根据 `CEBR`（一个 IT“智库”）和 `Veracode`（计算机保护类型）的现有研究，网络攻击每年给英国企业带来 304 亿的损失。他们的研究表明，180
  亿源于成功遭遇导致的收入损失，而 160 亿代表了企业为了增强其 IT 防御而增加的支出。


  随着网络攻击数量呈指数级增长，应对它们的成本也随之增加。在许多企业中，预算不断被重新评估，在某些情况下是公司版本的“拆东墙补西墙”，这表明调查和开发预算在维护安全的代价下被削减了。简而言之，网络攻击的威胁和现实限制了无数英国公司的创新进步。


  无论你的公司大小，网络安全都应该是每位创业者的关注点和严肃考虑。


  ## 利益 1 - 保护你的声誉

  在许多情况下，由于网站的公开性质，一次成功的泄露很难从你的买家、潜在客户和合作伙伴面前隐藏。有时黑客会让你的整个网站宕机，而在另一些情况下，你可能被迫自己这样做以限制暴露和破坏。


  从由于网络攻击造成的声誉受损中恢复可能是困难的。实施一套坚实的网络防御解决方案可以保护你的声誉和信誉。你只需要浏览 Facebook 即可，它为识别其平台内漏洞和安全漏洞的设计师提供奖励——这是
  Facebook 立即将猎人变成护林员的例子。


  ## 利益 2 - 保护你的信息

  如果攻击导致私人信息被盗，包括用户名、密码或可能的支付详情，相关问题的实体将承担几乎与泄露相当的责任。这种情况仍然发生，例如在 3 月，黑客针对 2015 年英国航空执行俱乐部会员设计发动了一场源自俄罗斯的野心勃勃的网络攻击。一些执行俱乐部会员发现其手机号和其他个人详情已被修改，而另一些人发现他们的积分积分确实被用于预订他们从未私下过的航班和酒店房间。


  通过部署强大、稳健并定期更新的网络安全措施来保护你的个人信息，特别是你的客户信息，可以被视为企业的首要任务。在你的竞争对手没有这样做的情况下保护你的信息，这可能会提升你的地位并作为差异化的手段。


  ## 利益 3 - 保护你的账户余额

  单次高效的网络攻击可能对企业的银行余额产生惊人的影响。一些财务打击将很快被体验。相比之下，另一些涉及的经历更多，这使得成功的网络攻击的实际成本难以完全量化。


  我们所知道的现实是处理这些情况会有初始费用。你可能很幸运拥有一支 IT 团队供你支配。万如果像大多数小公司一样，你没有这种奢侈，你会被外包，这可能相当昂贵。这将作为检查泄露、创建一个确保其不再发生的有效方法、筛选其确实有效以及然后部署它的方法的成本。在财务上精明的所有主会将此视为一个机会，去对整个网站保护进行更广泛的介绍。虽然这是我们建议的，但它可能会推高初始阶段的短期成本。


  如果考虑到真实的资金，或者可能是某种形式的虚拟货币，你可能需要退还受影响的客户。在某些情况下，这是法律要求，在其他情况下，这是道德上应该采取的步骤。无论如何，这都会让你损失真正的钱。长期影响在收入损失的术语中可能难以计算。由于负面感知，潜在客户的数量可能不会变成真正的客户。






  ### 网络安全的优势


  - 保护您的系统免受恶意攻击

  - 在预存组中删除或可能消除恶意部分

  - 防止所有者对产品进行未经授权的访问

  - 禁止使用可能被感染的特定资源

  - 保护机信息


  ### 网络安全的劣势


  - 严格的监管

  - 非技术用户难以处理

  - 对资源的限制性大

  - 需要不断打补丁

  - 持续遭受攻击


  ### 网络安全对社会的重要性


  ## 网络安全对社会究竟如何重要

  网络安全专家 `Mikael Stenqvist` 探讨了增强瑞典电网保护水平的优势，以便为当代社会的未来发展提供简单的受保护保障。


  在过去的 15 年里，技术飞速发展，安全问题可能会被忽视。在瑞典，光纤基础设施已部署到 60-70% 的大多数企业和家庭，4G 移动网络覆盖率已显著超过 90.5%。大多数家庭网络目前用于电视和互联网连接，尽管现在已经开发了许多针对新解决方案的应用程序，它们在清晨就让我们的领域变得更加智能。


  例如，医疗保健数字化（即电子健康）有助于提高家庭照顾病患和老年人的效率。报警器、提醒人们服药的移动应用程序、或者可能监测脉搏或血压的设备、电子锁以及 24 小时摄像头监控，都能让人们在自己的家里生活得更有独立性。通过物联网，当代社会开始全天候更加紧密连接。


  基础设施和关键公共服务的数字化与自动化正在涉及智能电网、供水网络、带有自动驾驶汽车的智能出行技术，以及许多巨大的全新的创新，这些创新从经济、生态和环境角度来看，让我们的房屋、城镇和城市变得好得多，并且更具可再生性。


  这些突破导致了不同应用中所需的监控、控制和测量传感器数量爆炸式增长。根据全球最大的网络解决方案制造商之一 `Cisco` 的数据，全球目前约有 50 亿传感器连接着建筑、铁路、道路、医院、住宅等。这个数字将指数级增长，在未来五年内，数万亿传感器将用于不同的用途。


  ### 第十二章：网络安全的类型


  ## 现在似乎一切都依赖计算机和互联网吗？

  娱乐、通信、交通、医疗、购物等。甚至银行机构也在在线运营其业务。意识到世界上许多地方依赖于互联网这一事实，应该鼓励我们挑战自我。


  我的生命中有多少比例是由网络驱动的？我的私人信息有多少比例存储在网络上？我的公司有多少比例可以通过网络访问？我的客户信息有多少比例可以通过网络访问？


  鉴于对计算机系统的这种显著依赖，忽视公司内部可能发生网络犯罪的可能性是极其危险的，并且可能对你、你的业务、你的员工以及你的客户产生不利影响。如果没有安全感，你的公司处于网络攻击的极高风险之中。


  以下是你需要关注的多种网络安全类型。这可以帮助你为卓越的安全策略构建良好的基础。


  ### 1. 关键基础设施安全

  重要基础设施的安全包括现代社会所赖的网络-物理方法。关键基础设施的常见示例：


  - 电网

  - 饮用水净化设施

  - 访客灯光


  接入互联网电网基础设施的购物中心和医院会导致它们容易受到网络攻击。负责任何关键基础设施的公司必须进行尽职调查，以识别漏洞并保护公司免受攻击。除了这些关键基础设施的弹性之外，保护对我们社会的福祉和安全至关重要。


  然而，那些不负责基础设施但在公司运营中依赖基础设施的公司，应该通过分析对他们所依赖的关键基础设施的攻击可能如何影响他们，来制定应急预案。


  ### 2. 应用安全

  你必须将应用程序保护作为保护设备时应采用的安全方法选择之一。软件安全使用软件和硬件处理措施来应对应用程序开发阶段形成的外部威胁。应用程序在网络上更易访问，因此在开发阶段采取保护措施是该项工作中一个至关重要的阶段。


  应用程序安全的类型：


  - 防病毒程序

  - 防火墙加密显示


  这些有助于防止未经授权的访问。公司还可以检测极易脆弱的特定资产，并通过在这些数据集上实施系统安全程序来保护它们。


  ### 3. 网络安全

  由于网络安全关乎外部威胁，社区安全防止恶意目标对内部网络进行未经授权的入侵。社区安全通过保护基础设施并限制对其访问来确保内部网络受到保护。


  为了让你更好地管理组安全监控，安全团队目前使用机器学习来标记异常访问并及时警告威胁，这是非常有必要的。网络管理员继续实施策略和程序，以防止对系统进行未经授权的访问、修改和利用。


  安全实现的常见示例：


  - 额外登录

  - 强制性密码

  - 系统安全

  - 防病毒程序

  - 反间谍软件软件加密

  - 防火墙监控的互联网访问。






  ## 4. 云安全

  增强网络安全是云业务增长的主要原因之一。云保护是一种基于软件程序的保护工具，用于保护和监控您云端材料中的信息。云服务商正在不断开发并利用全新的安全工具，以帮助企业用户更好地保护其信息。


  关于云计算流传的一个误解是：它与标准策略相比安全性较低。人们可能会认为，将信息存储在物理介质和受控制的服务器上要安全得多。然而，云安全已经证明，控制并不意味着安全，而且可访问性比信息的物理位置重要得多。


  Alert''s Logic 的云安全报告发现，本地环境计算机客户经历的事件远多于服务提供商环境。该报告进一步发现，服务提供商环境的客户平均遭受了 27.8 次攻击。云计算的安全性与传统的本地数据中心相当，只是省去了维护大数据设施的时间和费用。此外，安全泄露的风险也降低了。


  ## 5. 物联网 (IoT) 安全

  物联网涉及许多非关键和关键的网络物理实体，如家电器、传感器、电视机、Wi-Fi 路由器、打印机和监控摄像头。


  根据贝恩公司（Bain & Company）的预测，物联网组合市场将在 2021 年创造约 1.52 万亿美元的价值；远高于 2017 年投资的 1.235 万亿美元。物联网的数据中心、分析、消费设备、网络、遗留嵌入式方法和连接器将是物联网市场的主要工程。它们的解决方案通常处于易感状态，且几乎不提供安全补丁。这为所有这些用户带来了独特的安全挑战。


  ## 6. 信息安全

  这指的是保护信息和数据免受盗窃、未经授权的访问、泄露等，以维护用户隐私并防止身份盗窃。


  ## 7. 灾难恢复

  这需要制定策略，使公司能够从网络安全/IT 灾难中恢复。这需要风险评估、分析、优先级，并准备好灾难响应和恢复方法。这允许组织更快速地从灾难中恢复并降低损失。


  ## 8. 网站安全

  这用于阻止并保护网站免受网络安全风险的影响。不同的网站保护计划旨在讨论网站的信息、应用程序、源代码和文件。通常，过去几年网站数据泄露的数量频繁增加，导致了身份盗窃、停机、财务损失、声誉和品牌形象损失等。


  其主要原因是网站所有者存在一种误解，认为网站托管供应商会保护他们的网站。因此使其容易受到网络攻击。用于网站安全的主要技术和工具包括网站检查和恶意病毒清除、网站防火墙、应用程序安全测试等。


  ## 9. 终端安全

  这允许组织保护其服务器、移动设备和工作站不受远程和本地网络攻击。由于方法上的产品是相互连接的，这往往为威胁和漏洞提供了入口点。终端保护通过阻止访问这些入口点的尝试来有效保护设备。文件完整性监控、反恶意病毒软件以及杀毒软件等是常用的方法吗？


  ## 网络安全工具类型


  ### 1. IBM QRadar Advisor and Watson

  这无疑是公司使用的最好的保护程序。Watson 使用人工智能 (AI) 是一个自学习和自进化的系统。在检测到机会之前，它就能消除该威胁。其运行方式如下：`IBM
  QRadar` 跟踪位置。它收集信息并连接在线、离线和内部代码单元。当发生事件时，它会制定策略进行后续处理并消除威胁。这是处理网络事件最好的工具之一。


  ### 2. Wireshark

  它是最受欢迎的社区协议分析器之一。它可以评估个人工作设备上的易感区域。`Wireshark` 可以收集或查看产品上正在运行的信息和活动。可以查看传入和流出的数据包以及传输过程中所使用的协议。它可以捕获流量信息并创建一个传统的分析表，有助于跟踪。


  ### 3. Cryptostopper

  它是目前网络上防止勒索软件或恶意软件攻击攻击商品的最佳工具之一。`cryptostopper` 的作用是发现加密文档的机器人并将其删除。当病毒附着在设备上时，它会在设备上创建一个设计或欺骗方式来锁定它；`cryptostopper`
  会检测并删除该代码。`Cryptostopper` 制造商倾向于承诺九秒威胁检测和消除挑战。它会隔离工作站和单元受感染区域，使勒索软件无法影响更多区域。


  ### 4. NMAP

  它是为社区安全创建的无数主要和开源工具之一。`NMAP` 不仅适用于小网络，也适用于大型网络。它可以识别产品上的主机和接收者。此外，它还能识别操作系统的发行版。它能够在瞬间扫描进程中的成千上万台设备。


  ### 5. Burp Suite

  这是另一种网络扫描算法安全程序，允许您浏览在线应用。该特定设备背后的目的是检查和渗透易感方法。它检查可能受影响的表面以及发送者和目的地的响应和请求风险。如果发现任何威胁，可以将其隔离或消除。


  ### 6. OpenVAS

  它被认为是网络上最稳定、漏洞最少且易用的网络安全工具。您会发现 `OpenVAS` 的两个主要组件：

  - `Scanner`（扫描器）：体验不安全区域并向管理员发送大部分内容的编译报告。

  - `Manager`（管理器）：汇总从扫描器获得的请求，然后对所有此类事件制作报告。


  ### 7. Nessus

  `Nessus` 是另一个检查恶意黑客的单元。它检查设备上的电脑，寻找试图利用网络信息的未经授权黑客。人们广泛认为 `Nessus` 对未经授权的进行 1200
  次扫描。除了某些情况，并没有假设 Web 服务器设置了不同的端口，因为 `Port 80` 仅为 Web 服务器设置。它还是一个开源单元，提供不安全补丁帮助中心，有助于根据受影响区域提供可行的策略。


  ### 8. Metasploit Framework

  由 Rapid7 创建，被认为是最好的开源框架，用于检查漏洞。它是一个命令行壳，在 UNIX 内运行；因此，所有者可以熟练地操作命令行和指南来查看并运行脚本。`Metasploit
  Framework` 也有内置工具，以及一些第三方接口，可用于利用受影响区域。


  ### 9. SolarWinds Mail Assure

  这是一个多功能应用程序，解决大多数电子邮件安全问题。它拥有来自近 200 万个域的信息，涵盖 80 多个国家。它以软件服务 (SAAS) 的形式提供。它可以帮助用户的应用程序免受垃圾邮件、病毒、钓鱼攻击和恶意软件的影响。


  还有许多其他网络安全工具可以帮助消除上述列表中的机会。它们如下：






  - Aircrack-ng

  - Call Manager

  - MailControl





  ### 第十三章：提升您的安全


  ## 保护无线网络

  人们必须学习如何保护自己的无线网络，以确保他们的机密信息不会落入别法之手。本章将简要介绍保护个人无线网络以及如何操作。对于大多数示例，将使用 `NETGEAR`
  路由器。如果用户有不同的路由器，请记住某些地方会有所不同。


  ### 加密

  让我们从讨论基础加密开始。在涉及网络上的数据传输时，`Encryption`（加密）是将明文转换为杂乱字符混合体的过程。这降低了通过加密网络发送的信息被用于恶意目的的概率。对于无线路由器的加密，它是每当输入正确的登录凭据并访问网络时，生成一个加密的身份验证密钥的过程，允许访问网络。简单来说，每当用户登录受保护的路由器时，都会生成一个唯一的密钥，允许访问该互联网连接。


  ### WPA

  Wi-Fi 安全访问或 `WPA` 是一种为了取代 `WEP` 安全而开发的安全工具。它有两种类型：`WPA` 和 `WPA2`。区别在于 `WPA2` 是 `WPA`
  更新、更安全的版本。用户随时需要登录无线网络时（无论是在家里还是学校），他们最可能正在登录 `WPA/WPA2` 加密网络。这些安全功能的工作原理是检查输入的登录凭据是否准确，如果是，就会生成一个与该登录唯一的加密身份验证密钥。一旦生成了该密钥，它将由相应的网络检查，在假设登录凭据匹配的情况下，允许开始传输数据。现在我们已经了解了
  `WPA` 加密的基础，我们将讨论可以采取的保护个人无线网络的一些基本步骤。


  ### 无线路由器凭据

  当无线路由器首次设置好时，必须更改默认登录凭据。大多数个人无线路由器都带有标准的登录用户名和密码，例如：

  ```

  Username: admin

  Password: password

  ```

  黑客知道这些默认登录凭据，这意味着必须立即更改。使用结合了大小写的长密码将为用户提供可靠的安全的凭据。


  ### 服务集标识符

  服务集标识符（`SSID`）指的是无线网络名称的计算机语言。例如，亚利桑那大学的无线网络被称为 `UAWifi`。将个人网络名称从默认更改是非常重要的，因为黑客可能会针对具有默认名称的无线网络，认为它安全性较低。为了进一步提高安全性，可以关闭
  `SSID` 广播。这意味着该网络对外部人员不可见。它仍然在那里，如果搜索特定的 `SSID`，就可以找到它。然而，任何扫描网络以进行连接的人都看不到这个隐藏的网络。当你有试图试图访问你个人网络的邻居时，这种方法特别为有用。


  ### 媒体访问控制

  介质访问控制（`MAC`）是一组用于识别特定设备的数字。无论是计算机、平板电脑还是手机，每个设备都有唯一的 `MAC` 地址。为了更好地保护网络，路由器可以只允许特定的
  `MAC` 地址连接到该网络。这通过只允许特定设备连接，为您的网络添加了另一层安全。虽然这是一个实用的安全功能，但至少要提到，目前有一些软件程序允许黑客伪造 `MAC`
  地址，让他们能够伪装成你网络上的同一台设备。


  我们关于保护路由器的最后一个建议是保持个人网络安全的最有效方法：关闭路由器。如果你要去度假，或者只是一段时间不使用他们的网络，关闭路由器是避免黑客进入网络的最佳方法。他们无法访问未通电且未传输的数据。


  ## 保护移动设备

  本章将解释移动设备面临的安全风险，以及如何更好地保护手机或平板电脑上的数据。


  ### 安全风险

  移动设备有三个主要的安全风险：物理盗窃、网络盗窃和应用程序权限。

  * **物理盗窃**：对设备的物理盗窃允许某人访问设备并窥探存储的所有个人信息。那可以是密码、短信、照片、电子邮件等任何内容。

  * **网络盗窃**：这适用于在移动设备上浏览互联网时（无论是通过无线网络还是移动运营商服务）被盗取或查看的任何数据。

  * **应用程序权限**：由于一个简单的原因，这可能是移动设备所有者面临的最大安全威胁。人们在下载应用时，并不会阅读该应用 具有哪些权限。《商业内部人士》近期发布的一项研究发现，在
  2017 年，90% 的消费者在没有通读的情况下接受了法律条款和条件。这就是安全风险发生的地方。


  ### 基础知识

  下面列出了六种可以更好地保护移动设备安全的方法。这些是：操作系统、应用权限、地理跟踪意识、锁屏、Wi-Fi 或蓝牙安全以及互联网浏览。


  #### 操作系统

  操作系统是移动设备的基础，负责管理所有网络和软件。例如，苹果使用 `iOS`，而安卓使用 `Android OS`。保持所有类型移动操作系统的软件更新有助于让移动设备更安全。当这些操作系统的开发者发现安全漏洞时，它们会进行修补并向全球发送更新。这是保护自己免受即将到来的恶意软件或安全漏洞的最简单的方法之一。


  #### 应用程序

  我们都喜欢应用，无论它们来自 Apple Store 还是 Google Play Store，但大多数人并不知道这些应用可以通过手机访问哪些信息。用户在下载应用时（无论是在无线网络还是移动运营商服务上），并不知道这些应用可以通过手机访问哪些信息。通过手机访问哪些信息。大多数人在下载新的
  Candy Crush 游戏或更新应用时，从不去阅读细则。因此，手机是极其易受攻击的目标。


  许多应用程序请求过多的数据，这可能与应用程序的实际目的无关。例如，在 Candy Crush 的许可下，它规定开发者可能会使用收集到的个人数据。如果用户将账户连接到社交网站，他们将使用来自这些网站的个人数据。


  #### 地理跟踪

  大多数移动设备用户完全不知道他们的位置被频繁访问并存储在公司的服务器中。在 Apple Store 或 Google Play Store 下载的许多免费应用并不是免费的。一种增长的趋势是应用开发者使用手机或平板电脑收集
  `GPS` 位置，这被称为地理跟踪。这些信息被大量收集，并被大型实体用于准确预测消费者行为。广告商总是寻找捕捉你注意的新方法，让你购买他们的产品。如果应用开发者收集个人的
  `GPS` 位置，他们就可以查看并说：“哇，这个人似乎被特定的广告针对了。”这些广告可能以电子邮件或垃圾短信的形式出现。广告商如何针对特定个人？答案是，位置数据可以用于营销。这允许开发者访问手机的个人信息，如联系人、电子邮件等。


  #### 密码

  这是保护手机数据最简单的方法之一。简单的锁屏可以防止某人在手机或平板电脑被盗后访问所有信息。考虑所有的应用程序、短信、电子邮件和照片。然后考虑在不需要密码的情况下访问所有信息。


  #### Wi-Fi 安全

  为了避免黑客看到从用户移动设备发送的信息，用户在使用 Wi-Fi 时需要小心。根据律师保险公司（`LAWPRO`），以下是关于如何做到这一点的一些提示：

  1. 首先，只使用已知且信任的无线网络。尽可能完全避免使用公共网络。公共网络通常是不安全的，让同一网络上的任何人很容易获取你发送的信息。

  2. 如果必须使用公共网络，请登录虚拟专用网络（`VPN`）来保护你传输的数据。`VPN` 通过一个加密隧道发送数据，防止被同一网络上的任何人访问。

  3. 确保所使用的网络运行某种形式的 `WPA` 加密。大多数家庭网络运行 `WPA2` 加密，而公共网络完全没有安全性。

  4. 如果你连接到一个不是自己的网络，确保关闭设备共享设置，以避免未知设备连接。这创建了一个共享数据的链接。然而，这也是黑客连接设备设备方法。


  #### 蓝牙 安全

  1. 大多数具有蓝牙功能的设备在出厂时处于未保护模式，称为“发现模式”。这种模式允许设备被他人看到，使其更容易连接。

  2. 如果你没有使用蓝牙，确保将其关闭以避免连接到不需要的设备。未使用时关闭蓝牙消除了黑客设备连接的机会。

  3. 如果可能，更改设备设置，在与另一个设备配对之前需要用户确认。这消除了另一个设备秘密连接的可能性。

  4. 不要连接未知设备。仅与已知且信任的设备配对。

  5. 蓝牙连接的最大范围可以根据设备的功率而异，通过将范围设置为最低，降低了攻击者接触设备的风险。


  #### 互联网浏览

  即使在 iPad 上，互联网浏览仍然可能是危险的。关于在移动设备上上网，这里是来自 McAfee 建议的一些要做的和不要做的：

  1. 如果可能，安装防病毒软件对设备上下载的任何内容进行扫描。

  2. 始终查看你访问的网页的 `URL`。确保你检查了 `https` 特性。

  3. 假网站往往会有一些错误，从页面的整体外观到不当的语法。

  4. 如果已知想要访问的网站的 `URL`，直接输入它以避免任何网站的假副本。

  5. 避免点击广告，因为这些可能导致指向设计的恶意网站。


  ### 第十四章：增强物理安全


  ## 早期检测是游戏规则改变者

  全球网络安全趋势研究由 `Raytheon` 赞助并由 `Ponemon Institute` 独立进行，从网络安全前线人员的视角对未来几年出现的最关键威胁提供了新见解。研究调查了
  10 多位高级信息技术人员。该研究揭示了专家人员对未来几年的关键见解和预测，例如网络勒索和数据泄露对价值的影响。67% 的人表示网络勒索（如勒索软件）的频率将会增加。60%
  的人预测国家支持的攻击将变得糟糕。41% 的人表示他们的组织能够减少物联网（`IoT`）的风险。网络勒索、国家级攻击的频率，19% 的人表示在未来几年将翻倍增长。26%
  的人预测国家级攻击是持续的。45% 的人表示攻击工业控制将非常频繁。54% 的人表示攻击工业控制和监控数据采集系统（`SCADA`）将会增加。80% 的人表示
  `IoT` 设备泄露可能会发生。总之，`Raytheon` 和 `Ponemon Institute` 的研究通过网络安全前线人员的视角提供了新见解，网络安全数据泄露将大幅增加。


  ### 第十五章：道德黑客


  当涉及到安全时，“黑客”是最常用的术语之一。它出现在处处，甚至娱乐业经常在电影、书籍中使用它。因此，词汇“黑客”通常被视为负面。黑客的词汇总是与犯罪活动联系在一起。当人们听说是某人参与黑客活动时，他们会认为那是一个没有善意的人。


  ## 什么是道德黑客？

  我们之前提到的所有内容都指的是黑客。然而，真正的目标是学习成为一名道德黑客。道德黑客通常受雇于机构测试安全性。他们通过合同工作。关键在于他们使用与其他所有黑客相同的技能，但他们必须获得所有者的许可才能攻击。


  ### 黑客分类

  黑客可以分为 5 类。请记住格式可能会不同，但这些是常见的：

  * **脚本小子 (Script Kiddies)**：这些人通常没有培训或培训非常有限。他们知道如何使用一些基础黑客技术，由于他们没有能力理解它。

  * **白帽黑客 (White Hat hackers)**：这类类别涉及好人黑客。他们攻击计算机系统但不是为了伤害。他们在客户的许可下工作，是渗透测试员。

  * **灰帽黑客 (Gray Haters)**：正如其名，他们处于好坏之间。他们的最终决定是选择正确的一侧。这种类型的黑客是令人怀疑的。

  * **黑帽黑客 (Black Haters)**：这类类别指的是我们之前提到的黑客。他们通常在法律之外运行，这意味着他们没有客户的许可。

  * **自杀式黑客 (Suicide hackers)**：最后但同样重要。他们之所以这样是因为他们的目标是针对。


  ### 道德黑客的责任

  道德黑客应该学习并永远不要忘记的最重要的一点是，任何攻击都应该许可。这是道德黑客在每项任务中必须执行的代码，与隐私和机密性有关。






  ### 加密最佳实践


  - 密码要求

  - 设备使用

  - 电子邮件访问




  你必须频繁更新此政策，并让组织中的每位员工了解政策的变化。


  ### 员工教育

  这是一个必须考虑的关键方面。如果你有一项安全策略，但你的员工不知道他们必须做什么，那将是徒劳。帮助你的员工理解他们必须执行的不同协议。你需要进行培训并让人们知道他们必须做什么。这是保护数据最简单的模式之一。


  ### 使用安全密码

  记住，密码对于维护网络安全至关重要。指导你的员工选择黑客难以猜测的密码。你必须避免在密码中使用日期和姓名，因为黑客可以轻易将这些词汇与你联系起来。你必须指示他们定期更改密码。你还可以使用多身份验证系统为账户添加额外的保护层。


  ### 确保软件已更新

  如果你的系统中存在过时的软件，可能会导致安全风险。你应该始终使用最新的补丁更新软件。例如，如果你使用 `Windows Operating System`，你必须允许更新运行，以涵盖任何漏洞或缺口。


  ### 保护网络安全

  你必须使用防火墙来保护系统使用的网络。使用加密技术，让黑客或其他任何用户难以访问数据。在使用 `Wi-Fi` 时必须小心，因为大多数黑客都针对这些连接。让员工知道他们不应该使用公共
  `Wi-Fi`。要求他们使用 `VPN` 连接来确保数据传输的安全。确保使用强密码保护路由器。


  ### 备份数据

  无论你多警惕，黑客都可以选择针对你的系统或网络。在发生此类攻击时，将数据存储在磁盘上。让系统将数据存储在安全的地方。你也可以在独立的数据中心收集数据。


  ### 控制访问

  你必须确保对员工使用的设备也保持某些控制。员工必须小心屏幕上的信息，绝不要离开锁定状态。如果他们离开工作站或办公桌一分钟，必须注销系统。由于任何人都可以带走笔记本电脑，应该告诉员工永远让它无人看管。由于更多业务在平板电脑和智能手机上进行，黑客针对这些设备。员工必须保护手机上的数据，并使用密码保护手机。他们必须及时报告设备的丢失或被窃。


  ### 网络安全培训

  组织始终可以通过培训员工来降低网络攻击的风险。他们可以为员工 `Target Solutions Cybersecurity Training`。这些培训材料将提供动态课程，以检查用户对网络安全的认知。


  ### 第十七章：网络安全的需求

  网络安全现在被视为个人和家庭的基本组成部分，此外还有我们的企业、政府以及商业教育机构。家庭和父母需要保护孩子以及家庭成员免受在线欺骗。保护影响我们私人经济状况的财务安全方面的财务信息至关重要。网络对于员工、教育机构、学生和教职人员很重要且有益，它提供了许多学习选择，但也伴随着多种在线风险。网络用户迫切需要识别保护免受在线欺骗和身份盗窃的方法。对互联网行为和系统保护进行适当的学习可以减少漏洞并实现更安全的网络设置。


  中小型组织由于资源有限和缺乏正确的网络安全技能，也面临着各种安全相关的挑战。解决方案的快速扩张也使网络安全变得更加复杂，因为我们还没有为相关问题提供永久的手段。然而，我们正在努力并提供各种技术或框架来保护我们的网络和信息，但每种保护都是暂时的。尽管如此，增强安全理解和正确的策略对于保护知识产权和商业秘密是必要的，可以最大限度地减少财务和声誉损失。


  政府在互联网上拥有大量的机密记录和电子信息，这是网络攻击的主要目标。政府面临的问题通常是因为基础设施不当、意识不足以及资金短缺。每个政府机构都需要为文化提供可靠的解决方案，维护公民与政府之间的通信以及机密信息的安全。


  随着个人更强烈地依赖帮助他们控制日常生活的技术，网络犯罪的危险将会升级。网络风险构成了美国面临的最可能、最严重的国家安全后果[之一]……显而易见，需要更多工作来加强我们的网络安全。


  多次大规模的网络攻击影响了诸如 `Target`、`Bank of America`、`JPMorgan Chase` 和 `Home Depot` 等大型企业。数据泄露可能损害了银行记录、信用卡号以及各种其他私人信息，包括用户名、密码、电子邮件、地址和电话号码。


  ## 网络安全专家短缺

  根据 `RAND Corporation` 2014 年 6 月的一项调查，“全国范围内网络安全专业人员的短缺——特别是联邦政府内部的角色——给国家和国土安全带来了风险。”传统的
  IT 专业人员可能没有经过有关信息安全策略的完全培训。许多组织可能不愿意或无法投入大量资金进行全公司的网络安全识别培训。在某些情况下，雇主可能理解升级网络安全技术的需求，但不确定具体如何管理这个问题。


  根据 `RAND` 的评估《想要黑客：网络安全劳动力市场研究》，最近的数据泄露将对网络安全专家的需求推向了“云端的高度”。


  ## 需要网络安全的人

  在网络刚开始时，它通常被认为是那些比他人更擅长处理台式电脑的人的一种书呆消遣方式。现在，从社交媒体到网上银行到电子医院记录，我们生活的每种产品都在互联网上销售。由于其他不法分子，网络黑客可以争夺进入这些工作和信息以供个人目的。基本上，每个人都需要网络安全，因为几乎每个人都能通过互联网轻松获取个人信息。


  ## 网络罪犯的时代

  技术本身并不邪恶，尽管它确实可以被用于恶。。为了利用网络进行任何活动，我们必须提供关于我们爱好、偏好、财务状况、购买习惯以及相关的信息。在一个理想的世界里，几乎所有信息从离开我们的笔记本电脑和智能手机到到达我们进行交易的公司或银行的期间，都将保持在完美的真空状态。


  事实是，有一支遍布全球的网络犯罪分子军队，他们正在搜寻那一个不足的密码或可能是不安全的通信类型来发动攻击并从中提取信息。典型罪犯的时代已被网络犯罪分子所取代，他们可能从地球另一端黑入你的电脑，并使用你的私人信息摧毁你的生活。


  ## 利用互联网攻击他人

  曾有一个时代，笔记本电脑被纯视为一种制造设备。然而，当 `Bill Gates` 创立家用个人电脑的理念时，突然每个家户都渴望拥有个人电脑以及成为全球网一部分的机会。


  那是简单的时代，普通人对电脑几乎一无所知。由于他们对电子世界的渴望，访问者会偶然发现声称能发现快速发富之方法的网站，并提供许多其他有用信息的链接。只需在超链接上点击一下，就会在他们的电脑上下载一个含有有害计算机病毒的文件。


  今天，创建的方法变得越来越复杂，这些病毒运行时时会造成更大的损害，包括：





  - 将你的账户详情发送到另一台计算机的远程服务器上

  - 在你的电脑上植入犯罪性信息，这可能导致你入狱

  - 远程访问你的电脑，并利用其处理秘密的最终派对交易，让你为此背锅

  - 使用社交网络，你拥有账户可以与互联网上的许多其他个人进行互动

  - 擦除你电脑上的信息，甚至对电脑造成通常不可逆转的损害


  ### 中小型企业的电子安全防护


  当一个组织的命运完全取决于保护其电子资产的安全时，其实际风险更高。如果说网络革命的初衷在于其先进的思想，那么商界人士就需要遵循这门科学。网络帮助他们降低了成本、加速了创新、利用了全球劳动力，并大幅提高了利润率。


  当第一次网络攻击袭击一家公司的电脑时，蜜月期便戛然而止。随后，另一家类似的企业遭遇了袭击。此后，每年发生的袭击次数日益增加。如今，企业已经意识到，一个不受保护的电子社区可能会通过多种手段对其组织造成难以想象的破坏，包括：


  - 泄露客户的机密信息并将其发布到网上

  - 在短短几分钟内删除公司一年的信息

  - 损害公司的电子产品，造成将扼杀其利润率的停滞

  - 让公司的电脑执行意愿之外的任务并发生故障

  - 损害公司的声誉，导致投资者和客户不愿再次信任他们




  深入网络安全专家领域。正是这些个人和职业层面的复杂情况导致了对网络安全专家的需求。这些人员的任务是学习电子网络以寻找可能提供访问权限的弱点（这些漏洞对黑客和恶意软件来说非常容易），并开发更强大的技术，以便在这些网络上安全地传输加密信息。随着在线黑客变得更加大胆且装备更精良，长期来看，对网络安全行业专家的需求将会增加。


  ### 第十八章：网络安全就绪


  ## 指导与意识

  首先，至关重要的是网络安全风格必须成为每个组织讨论的元素，从员工餐厅到会议室。通常，通过不断将网络安全置于脑海中，可以使其成为决策过程、基础设施投资以及监管和治理需求的一部分。


  此外，由于人员本身可能通过社会工程成为攻击向量，组织内的每个人都将逐渐承担起确保执行最佳网络安全策略的责任。这需要对员工进行教育，并在新威胁出现时定期更新相关知识。事实上，网络安全与医疗保健之间存在相似之处——所有人都需要某种程度的网络安全培训。


  最后，具备知识的网络安全专业人士，或者 IT 和管理部门关键人员的合格导师，应当成为每个网络安全就绪的一部分。


  ## 准备与规划

  网络安全事件不是“是否”发生，而是“何时”发生，因此，准备工作至关重要。这可能包括管理技术、最佳流程政策、IT 审计，以及负责网络安全运营的专门人员。良好的网络安全就绪要求理解与其人员和组织相关的资产及风险威胁，每天监控并检测网络安全威胁，保护关键系统和信息，确保组织履行几乎所有相关的标准合规要求，在发生漏洞时有应急响应计划，然后有明显的业务连续性模型以最大限度地减少损失。


  通常，上述许多职责需要由 `CISO`（首席信息安全官）或同等人员负责，尽管其他各种利益相关者（例如高层领导、法律和口才人员以及公共关系部门）也可能在事件发生时需要做好准备。


  ## 检测与恢复

  当违规发生时，识别和响应的速度越快，减少损失的可能性就越高——无论是财务、声誉还是可能的其他方面。你的小企业识别和响应信息盗窃或重要服务禁用的速度应该有多快？受影响的服务器或工作站应该多快被隔离以进行取证分析？丢失或损坏的信息应该多快且多容易地恢复？应急响应计划是什么，必须立即通知的利益相关者是谁？


  重要的是，日志的维护和评估有助于确定违规发生的方式，并因此确定如何修复，可以作为康复操作的一部分。仅仅堵住漏洞是不够的；理解违规是如何发生的可能导致阻止若干其他类似的违规事件。


  ## 共享与协作

  正如我们在本指南中回顾的那样，能量对于缓解当前和未来的风险至关重要。与政府和行业共享你的违规分析结果，可以防止已建立的攻击向量打击各种组织。


  反之，你的成员可能准备通过从其他组织共享的漏洞中学习来防止被利用。此外，可以考虑注册或向 `ISAC`（信息共享与分析中心，`www.nationalisacs.org`）提供信息，前提是你的市场有相应的机构。


  在某些情况下，你的组织可能受法律规定限制报告事件。至少，应该向当局或如 `AusCERT`（`www.auscert.org.au`）以及澳大利亚网络安全中心报告违规。


  ## 伦理与认证

  伦理和认证最初可能看起来帮助不那么大的支柱，尽管“白帽”黑客与“黑帽”黑客之间的巨大在于心态。在任何业务或组织中，伦理都起着作用，并适用于特定的网络安全问题。虽然某些行业（如国防）极可能有自己的策略来审查资格，但对于
  ICT 这样一个多元化且高技能的行业，如果专家能够通过资深机构的会员身份证明其遵守伦理准则，将会有很大帮助。


  许多专业组织维持其人员遵循标准，以确保维护职业的地位和声誉。例如，`ACS` 有一份所有认证专业人士必须遵守的伦理准则，此外其他要求，如展示持续的个人成长以及在所选专业领域拥有学位。


  ## 网络安全专业人士的三项关键技能

  有效的 IT 保护专家需要的不仅仅是专业能力。要在这个领域真正取得进步，这些专业人士应该是：


  *   **战略家**：网络安全专业人员除了组织内部调整，还将准备主动使用安全措施，权衡任何行动的后果。卓越的安全协议需要对工作流、依赖关系、预算和资源进行战术和战略评估。由于破解信息的全新方法不断发展中，专家必须向前，学习在线黑客如何进入网络以及阻止它们的程序。

  *   **沟通者**：除了沟通技能，管理能力还需要确保与团队和客户之间的良好协作——技术和安全涉及业务中的每位专家。保护专家必须以大量方式进行互动，通过教学和赋能人员来协助制定保护策略。

  *   **终身学习者**：另一个具备的能力是专业能力。随着保护领域的发展，这意味着需要研究：学习、教育和持续的通用认证。这些专业人士必须不断学习新的变革性技术技能，以解决复杂安全问题的能力。


