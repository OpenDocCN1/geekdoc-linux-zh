  U 盘），并重启计算机。在这个阶段，我相信你现在已经准备好接受一些信息，让你快速上手这个奇妙的平台。





  - Windows – 使用 PuTTY

  - Mac 和 Linux – 在命令行中使用 SSH。


  ### Windows


  - 打开你的网络浏览器并下载 `PuTTY`。

  - 打开 `PuTTY`，然后在正确的框中输入 IP 地址或 `Hostname`。

  - 如果你没有提供端口号，请将其保持为默认的 `22`。

  - 点击 `Data` 然后点击 `Auto-Login Username` – 输入你的用户名。

  - 若要保存会话，点击 `Saved Sessions` 框，输入一个名称并点击 `Save`。在将来，你可以通过双击保存的会话来连接。

  - 点击 `Open`，即可建立连接。

  - 当你第一次连接到服务器时，`PuTTY` 会询问你是否允许缓存服务器的主机密钥 – 点击 `Yes`。


  ### Linux and Mac


  `Linux` 和 `Mac` 都已经内置了 `SSH` 客户端作为命令行程序。要使用它，请运行终端：


  - Mac – 进入 `Applications` 文件夹

  - Linux – 打开 `Dashboard` 并搜索 `Terminal`





  当终端启动后，只需使用 `SSH` 命令即可获取连接。请注意，命令始终是区分大小写的，因此请仅使用小写。输入 `ssh` 后跟 Linux 服务器上的用户名。当你第一次连接到服务器时，你需要验证主机密钥。输入
  `Yes` 继续连接并按 `Enter` 键。当连接建立后，输入你的密码。要退出连接，输入 `exit` 然后注销即可。


  Ou 已经完成了你所选择的 Linux 发行版或 Linux 操作系统的下载和安装方法。在完成调整电脑以适应新操作系统的整个过程后，你需要根据你的需求和工作机会设置
  Linux 性能和环境。


  根据你选择的 Linux 发行版和桌面环境，你的桌面环境和安装的应用程序会有所不同。它们大多数将涵盖你的典型需求和基于计算机工作的类似个人需求。大多数 Linux
  发行版都连接了 `Firefox` 网页浏览器，只需点击几次即可使用开源的 `Chromium` 浏览器或 `Google Chrome`。


  你的桌面环境应该具备所有标准：应用程序菜单、某种任务栏以及通知区域或“系统托盘”。你可能还会发现一组系统服务，它们将帮助你配置硬件并让桌面以正确的方式正常工作。


  使用 `Ubuntu 16.04` 的 `Unity` 桌面可能会有点古怪。如果你想尝试它，我们建议尝试 `Ubuntu GNOME`，它使用的是 `GNOME`
  桌面而不是 `Unity`。


  如果你不喜欢正在使用的桌面 —— 虽然某些发行版针对特定的桌面进行了优化，但几乎每个主要的发行版都让你在系统安装后为你提供安装你选择的桌面的选项。只要你有足够的可用存储空间，就可以同时安装
  `GNOME`、`KDE`、`Cinnamon`、`XFCE` 以及其他桌面。登录桌面时，你可以选择必须运行哪个桌面环境。


  通常，你可以在 Google 上找到关于你发行版名称的很多信息。如果你喜欢更有结构化的帮助部分，`Ubuntu` 和 `Fedora` 的文档网站是极好的资源。虽然
  `Arch Wiki` 是为 `Arch Linux` 用户编写的，但它对于一般的 Linux 程序来说是一个非常棒的深度资源。


  关于 Linux 安装，你有几种选择：你可以选择将其留在光盘或 USB 驱动器上，并随时随地启动它。安装 Linux 而不是仅从 USB 驱动器或虚拟磁盘运行它的原因是生产力和便利性。一旦安装了
  Linux，它将记住你的设置，保留已安装的软件，并在重启之间维护你的文件。


  当你准备好尝试时，在你的 PC 上安装 Linux 很容易。只需启动 Linux 环境下提供的安装程序。你可以擦除现有的 Windows 系统并将其替换为 Linux，但在
  Ubuntu 安装程序的术语中这被称为安装为“双启动”配置。安装程序将调整 Windows 分区的大小，以为 Linux 留出额外的空间。然后，你可以选择在启动电脑时想要使用的操作系统。你也可以选择在虚拟机中安装
  Windows。


  Linux 上的软件安装与 Windows 上的软件安装不同。事实上，你无需打开浏览器来搜索应用程序，但你可以在你的系统中寻找软件安装程序。你的 Linux 发行版托管了自己所谓的“软件仓库”，其中包含了编译为与之协同工作的软件。这些软件由
  Linux 发行版测试并提供。如果需要安全补丁，Linux 发行版将以标准的方式为你提供它们。


  每个发行版都有可以执行相同任务的命令行工具。尽管对于新手来说这可能令人生生畏，但我们建议用户熟悉从命令行安装应用程序，即使他们更倾向于使用 GUI。如果安装失败，你可以使用命令行，它会提供关于安装失败原因的提示。


  总结来说，发行版是一个附带所有软件的 Linux 操作系统，为你提供完整的体验。它们还提供了 `kernel`（内核）、硬件驱动程序和应用程序。


  发行版有各种形式。其中一些针对新用户，而另一些则面向最硬核的命令行狂热者。三个适用于所有技能水平人员的通用型发行版是 `Ubuntu`、`Fedora` 和 `OpenSUSE`。


  还有许多其他 Linux 发行版可用，每一个都略有不同。某些发行版非常适合特定的小众市场。通过这种方式，你可以安装为多媒体创作构建的操作系统，或为配旧硬件的计算机创建的。


  硬件兼容性可能是切换到 Linux 时最需要考虑的事情。虽然大多数 Linux 发行版默认支持大多数硬件，但不太流行或奇怪的硬件可能不支持。





  - **引导程序 (Bootloader)**：这是负责管理计算机启动过程的软件。对于大多数用户来说，它就是首次启动进入操作系统时弹出的启动界面，随后该界面会消失。

  - **内核 (Kernel)**：这是整个 Linux 的一个组成部分。它是我们系统的核心，负责管理内存、外设设备和 CPU。内核是我们操作系统中所处于底层的层次。

  - **初始化系统 (Init system)**：这是引导用户空间启动的子系统之一，并控制守护进程（daemons）。其中最广泛使用的系统之一是 `systemd`，它有时也被认为是最具争议的。一旦初始启动阶段从我们使用的初始引导程序处移交接，将由该系统负责启动操作系统。

  - **守护进程 (Daemons)**：这些是一些后台服务。它们可能包括调度、声音和打印选项，但你可以根据需要对其进行调整。它们会在系统启动时启动，或者在你有机会登录桌面后启动。

  - **外壳 (Shell)**：你可能也听过很多次这个词，或者叫 Linux 命令行，它曾让许多人望 Linux 而却步（也许是因为他们认为必须学习一些枯燥的命令行结构才能使用该操作系统）。Shell
  是一个命令进程，允许你通过在文本界面输入命令来控制计算机。今天，你甚至可以在不接触命令行的情况下操作 Linux，但正如我们很快看到的，学会使用它也是非常重要的。

  - **图形服务器 (Graphical server)**：这是一个在显示器上显示你想看到的所有不同图形的子系统。它被称为 `X` 或 `x server`。

  - **桌面环境 (Desktop environment)**：这是你实际花费时间交互的操作系统部分。它是“桌面”这一比喻的具体实现，由运行在操作系统可见表面的程序组成，你可以直接与其进行交互。


  这种环境有很多选项供我们选择，包括 `Cinnamon`、`Xfce`、`gnome`、`utility`、`Pantheon`、`Enlightenment`
  等。每个环境都会包含一些你需要的内置应用程序，包括游戏、网络浏览器、配置工具、文件管理器等。


  - **应用程序 (Applications)**：你选择的桌面环境并不会提供许多供你选择的应用程序。





  相反，你将需要搜索你想要的软件名称，然后你就可以根据需要找到并安装它们。例如，Ubuntu Linux 拥有一个所谓的“Ubuntu 软件中心（`Ubuntu
  Software Center`）”，它可以帮助你浏览数千个应用程序，然后从一个中心化的位置安装你最喜欢的。Linux 提供了数千个你可以轻松访问并安装的软件，这与
  Windows 和 Mac 是一样的。Linux 在开发者和 IT 公司中非常有名，因为当你提到 Windows 时，你可能听过病毒。病毒是一种脱离用户控制的程序。现在，Linux
  的美之处在于它没有所谓的病毒。它是一个非常复杂的操作系统，完全不需要你下载杀病毒软件，也不需要你寻找某些病毒。这使得 Linux 成为 IT 公司和服务器使用的极佳操作系统。


  # Linux 操作系统的结构

  在我开始介绍 Linux 操作系统系统的不同部分或组件之前，我们需要理解任何操作系统（无论是 Linux、Windows、Unix 还是任何其他操作系统）都是特定功能的集合，或者是多个组件的集合。每个组件都有一个指定的或特定的功能。例如，我们公司里有多个部门，每个部门都有指定的工作要完成。在操作系统中，我们有多个设计用于执行特定功能的组件或软件组件。现在我们将讨论
  Linux 操作系统内部的所有主要组件。


  ## Linux 内核

  内核（Kernel）是 Linux 的心脏。它负责硬件之间的通信。在你的系统或任何桌面、笔记本电脑或服务器上，你有硬件设备，如 CD 光驱、`USB port`、`HDMI
  port`、`LAN port` 和内存卡阅读器。这些都是连接到你笔记本电脑的设备。内核负责使用机器语言与这些设备通信。机器语言无非 `0` 和 `1`。机器的硬件或处理器理解
  `0` 和 `1` 的一切。内核更多地负责用它们自身的语言与这些设备通信，并与软件对话。


  在内核内部有多个职责需要执行。内核还负责管理系统资源。在你的系统中，我们知道有 `RAM`、硬盘、运行的进程，我们还有多个连接到系统的设备，以及多个用户请求。内核管理资源，例如使用多少
  `RAM`、分配多少内存、在硬盘的什么位置写入、如何处理多个用户请求、为特定目的激活哪个设备。所有这些都属于资源管理。以下是一些资源：


  ### 内存管理

  内核检查两个需要内存的应用程序或请求 `RAM` 的应用程序，然后确定给哪个应用程序分配多少内存，并决定应用程序 RAM 分配的优先级。


  ### 进程管理

  进程管理就像拥有多个进程；每个应用程序都有一个正在运行的后台进程。那么哪个进程将获得优先级？从技术来说，内存是分配给进程的而不是应用程序。所以当你运行一个应用程序时，它会启动多个后台进程，每个后台进程将被分配一些内存。


  ### 设备管理

  设备管理就像应该使用哪个设备，例如 `USB port`、摄像头、`LAN port`，以及如何使用它。


  ### 处理系统调用

  处理系统调用就像如果用户执行了多个请求，先处理哪个请求，后处理第二个和第三个请求。所有这些职责都属于 `Linux Kernel`（Linux 内核）。


  ### 系统库

  让我们从不同的维度来理解系统库。看，我们有内核，它负责与系统硬件通信。用户将在操作系统上运行多个应用程序。操作系统需要与内核通信。允许每个应用程序直接与内核通信是不可能的，因为每个应用程序都是由不同的人或使用不同的技术开发的。例如，某些应用程序用
  `Java` 开发，另一些用 `.Net`。要确保所有应用程序都能直接与内核通信变得非常困难。在这种情况下，操作系统开发者创建了一些预定义程序。这些程序成为内核和应用程序之间的中介，这样任何开发者都可以轻松选取系统库并开发他们的应用程序。


  让我们看看系统库如何帮助 Linux 操作系统：第一个是需要与内核通信的应用程序。每个应用程序都会尝试与内核通信，但如果允许不同的应用程序直接与内核通信，将非常困难。在这种情况下，不同的应用程序在与内核通信时会遇到问题，因为每个应用程序是由不同的开发者使用不同的技术构建或开发的。在应用程序开发方面没有标准。任何人可以使用任何技术来开发应用程序。因此，由于我们有多个用不同技术开发的应用程序，我们需要一个标准的处理器。


  ### 标准系统库

  操作系统开发者创建了标准系统库。这些库无非是操作系统内部提供的预定义程序。它们的作用是，每当他们构建某些应用程序时，都会包含这些拥有一组函数 get 库。他们将根据需求包含这些库，而这些库负责与内核通信。现在当我们观察通信流程时，它看起来如下：

  `应用程序 >> 系统库 >> 内核 >> 硬件`


  ### 系统工具

  要运行任何操作系统，我们需要一些工具或预定义工具来帮助你在操作系统内部进行导航或工作。当你获得 Windows 操作系统时，我们知道有多个工具可以与操作系统配合。我们有
  `Control Panel`（控制面板），`Command Prompt`（命令提示符）允许我们直接与操作系统通信，等等。帮助你管理操作系统的命令属于系统工具。


  这些不是用户工具。系统工具和用户工具之间是有区别的。用户工具就像 `Notepad`（记事本）、`Paint`（画画）和 `MS - Office` 等。系统工具是你的
  `Control Panel`、`Device Driver Manager`（设备管理器）；所有这些都属于系统工具。Linux 操作系统内部的系统工具是帮助你以标准方式操作系统的命令和工具。这些是更改目录、创建/打开/删除文件、移动文件等命令。所以所有这些帮助你管理和管理操作系统的命令都属于系统工具。每当你安装任何操作系统时，系统工具已经由操作系统开发者开发好了，你可以使用它们来管理你的操作系统。


  ### 开发工具

  如果你是 Windows 操作系统的普通用户，你已经知道 Windows 操作系统会定期提供更新。你需要更新你的操作系统。这些更新无非对操作系统进行的错误修复或其他修改，允许你工作得更快或提高操作系统性能。当涉及到任何操作系统时，这些开发工具总是可用的；无论是
  Windows、Linux 还是 UNIX，都有开发工具。这些开发者工具帮助开发者创建新的 OS 应用程序。它们的目的是在操作系统内部开发 OS 级应用程序，并确保为每个操作系统发布新更新。


  ### 终端用户工具

  终端工具是终端用户使用的工具，如 `Notepad`、`Paint`、`MS Office`、媒体播放器、`Windows Browser`、`Web Browser`、`PowerPoint`
  等。所有这些被终端用户使用的应用程序被称为终端工具。


  # 我为什么要用 Linux？

  这是许多人第一次听到 Linux 时会问的第一个问题之一。





  1. 你想要运行的命令

  2. 定义命令行为的选项

  3. 参数，即命令的目标





  命令基本上定义了你想要执行的程序。紧随命令后的选项可以为零、一个或多个。选项控制命令的行为并定义了命令将执行的操作。选项通常使用单横线（-）或双横线（--）。这样做是为了将选项与参数区分开来。例如：`-a`
  或 `--allArguments` 也位于命令行中的命令后面，并且像选项一样可以是一个或多个。参数指示了命令应该操作的目标。


  让我们以示例命令 `usermod -L John` 为例。示例中的命令是 `usermod`，选项是 `-L`，参数是 `John`。该命令的作用是锁定系统中用户
  `John` 的密码。


  为了有效使用命令行命令，用户需要知道某个特定命令可以使用哪些选项。如果你在运行任何命令时带有 `--help` 选项，你将获得一组可以传递给该特定命令的选项。没有必要背下所有命令需要使用的所有选项。列表还会告诉你每个选项的作用。


  `use` 语句（使用语句）有时看起来非常困难且复杂难以阅读。一旦你习惯了某些约定，阅读语句就会变得简单得多。


  选项被方括号 `[ ]` 包围。

  如果命令后跟着 `…`，它表示属于该类型的任意长度项目列表。如果有多个项目并用管道符 `|` 分隔它们，则意味着你只能指定其中一个。


  变量使用角括号 `<>` 中的文本表示。因此，如果你看到 `<filename>`，你必须将其替换为你想要传递的文件名。


  例如，检查下面的命令：`[student@desktop ~]$ date --help`

  ```

  date [OPTION]... [+FORMAT]

  ```

  这表示命令 `date` 接受由 `[OPTION]...` 表示的选项以及另一个选项 `[FORMAT]`，后者将以 `+` 符号为前。


  ### 在 Bash Shell 上执行命令


  Bourne Again Shell（称为 `bash`）解释用户在 shell 提示符上输入的命令。我们已经学习了你在 shell 提示符中输入的字符串如何分为三个部分：命令、选项和参数。你在
  shell 中输入的每个单词都使用空格隔开。系统中已安装的程序由你输入的每个命令定义。每个命令都有与其相关的选项和参数。


  当你在 shell 提示符上输入命令、选项和参数并准备好运行时，你可以按下键盘上的 Enter 键，这将执行该命令。你将在终端上看到该命令的输出。当输出完成后，你将再次看到
  shell 提示符，这表明上一个命令已成功执行。如果你想在单行中输入多个命令，可以使用分号来分隔命令。


  让我们回顾一些在 Red Hat Enterprise Linux 7 和其他基于 Linux 的操作系统命令行中日常使用的某些简单命令。


  ## date 命令


  `date` 命令显示系统的日期和时间。你也可以使用此命令设置系统时间。如果你为 `date` 命令传递一个带有 `+` 符号的参数，它表示你希望在输出中显示日期的格式。


  ```

  [student@desktop ~]$ date

  Sat Aug 5 08:15:30 GMT 2019

  [student@desktop ~]$ date +%R

  08:15

  [student@desktop ~]$ date +%x

  08/05/2019

  ```


  ## passwd 命令


  `passwd` 用于更改密码。然而，在设置新密码之前，你需要为指定用户指定原始密码。该命令要求指定一个强密码，因此必须包含小写字母、大写字母、数字和符号。你还需要确保指定的密码不是字典中的单词。root
  用户有权更改系统上任何其他用户的密码。


  ```

  [student@desktop ~]$ passwd

  Changing password for user students. Changing password for students.

  (current) UNIX password: type old password here

  New password: Specify new password here

  Retype new password: Type new password again

  passwd: all authentication tokens updated successfully.

  ```


  ## file 命令


  Linux 操作系统没有指定文件类型和扩展名。`file` 命令可以扫描任何文件并告诉你它是哪种文件。你想要分类的文件需要作为参数传递给 `file` 命令。


  ```

  [student@desktop ~]$ file /etc/passwd

  /etc/passwd: ASCII text

  ```

  如果你将文件夹/目录作为参数传递给 `file` 命令，它会告诉你这是一个目录。


  ```

  [student@desktop ~]$ file /home/home

  /home: directory

  ```


  ## head 和 tail 命令


  下一组命令是 `head` 和 `tail`，它们分别打印文件的前十行和最后十行。这两个命令都可以与选项 `-n` 结合，该选项可以指定你想显示的行数。


  ```

  [student@desktop ~]$ head /etc/passwd

  ```

  这会打印 passwd 文件中的前 10 行。


  ```

  [student@desktop ~]$ tail -n /etc/passwd

  ```

  这将打印 passwd 文件中的最后 3 行。


  ## wc 命令


  `wc` 命令用于统计作为参数传递的文件行数、单词数和字符数。它支持选项 `-l`、`-w、`-c`，分别代表行、单词和字符。


  ```

  [student@desktop ~]$ wc /etc/passwd

  30 75 2009 /etc/passwd

  ```

  这显示 passwd 文件中有 30 行、75 个单词和 2009 个字符。如果你在使用 `wc` 命令的同时传递 `-l`、`-c、`-w` 选项，它将根据你传递的选项仅显示行、单词或字符的计数。


  ## history 命令


  `history` 命令显示你之前输入的所有命令以及相应的命令编号。你可以使用 `!` 标记配合命令编号来扩展该命令输入的内容及其输出。


  ```

  [student@desktop ~]$ history 1

  1 clear

  2 who

  3 pwd

  [student@desktop ~]$ !3

  /home/student

  ```

  这显示我们使用 `!3` 扩展了 `pwd` 命令，显示了当前的工作目录，输出为 `/home/student`，这是学生用户的家目录。


  你可以使用箭头键在 history 命令提供的输出之间导航。向上箭头将带你回到上方的命令，向下箭头将带你回到下方的命令。使用右箭头和左箭头键，你可以移动到当前命令并对其编辑。


  ### 编辑命令行的快捷键


  当你与 bash 交互时，bash 命令行提供了一个编辑功能。这有助于你在正在输入的命令中移动以进行编辑。我们已经看到了如何使用箭头键配合 `history`
  命令在命令间移动。以下列表将帮助你在处理特定命令时使用编辑功能。


  - `Ctrl+a` / `Ctrl+e`：（注意：这）会将光标带到命令行的开头。

  - `Ctrl+u`：清除从光标处到命令行行开头的内容。

  - `Ctrl+k`：清除从光标处到命令行行末尾的内容。

  - `Ctrl+左箭头`：将光标移动到上一个单词的开头。

  - `Ctrl+右箭头`：将光标移动到下一个单词的开头。

  - `Ctrl+r`：在历史命令列表中搜索模式。






  - DNS 服务器

  - 网络边界或分段

  - 权限高于平均水平的用户账户

  - 集中文件共享

  - 集中式应用程序




  一旦你发现了一个可能的分布向量，就可以开始实施额外的缓解措施，首先是实施网络控制列表，以拒绝应用程序与其他系统直接通信的能力。这样做将立即更容易对特定资源进行隔离和沙箱化，以便你更准确地确定问题所在。你可以通过简单为任何识别出的应用程序或服务器的
  `DNS` 区域添加空指针来完成此任务，这将使你能够轻松看到哪些是正在运行的，哪些是未识别的。


  ### 第六章：网络安全术语


  书中使用的几个术语都与网络安全领域有关。在第一章涵盖这些术语是非常重要的，以便在它们后续出现时你熟悉它们。这些术语与你今天使用的所有设备、这些设备上的软件、设备连接的网络基础设施等有关。现在我们来逐一介绍这些术语。


  ## 云

  互联网由“云”组成——并不是天空中的云。云计算是一项允许用户从世界任何地方访问其文件的技术。云是一个计算机网络，存储了智能设备可以远程访问的数据。云最常见的例子是你的电子邮件。它们存储在互联网上一组分布式计算机上，只要你拥有所需的凭据，就可以从任何地方访问它们。另一个例子是你使用手机创建的
  `Spotify` 播放列表，但当你使用相同账户登录时，仍然可以通过笔记本电脑等其他设备访问同一个播放列表。


  ## 软件

  软件可以定义为告诉计算机做什么的指令。这些指令被放入一个软件软件包中，用户可以安装并开始使用。最常见的软件示例之一是 `Microsoft Office`，它用于创建文档、演示文稿等。智能手机应用也是你用于各种用途的软件。例如，`WhatsApp`
  聊天器是最常用的发送消息的程序。


  ## 域

  域是互连的子设备（如计算机、智能手机、打印机等）的父级。例如，工作场所所有的计算机都是属于该组织域的一部分。域的框架中定义了策略，管理这些设备在该域下将拥有的访问权限。


  ## IP 地址

  `IP address` 是分配给网络、局域网或互联网智能设备的数字地址。连接到网络的每个设备都关联着一个 `IP address`。该 `IP address`
  被其他设备用于定位和相互通信。


  ## 虚拟专用网络 (VPN)

  虚拟专用网络是一个你可以在其中保持匿名的网络。你会被分配一个属于不同地区的 `IP`，你在互联网上的所有操作都会通过该 `IP` 进行记录，从而隐藏你的原始 `IP`。`VPN`
  还会为你加密流量，使互联网服务提供商或政府无法跟踪你的在线活动。`VPNs` 也被组织用于在你从外部访问办公室网络时保持你与办公室网络的连接。这在最近变得非常流行，因为它帮助人们在家或远程工作。


  ## 漏洞利用 (Exploit)

  利用被定义为可以利用计算机或服务器中的漏洞或缺陷的恶意代码。`Viruses`、`Trojans`、`Botnets` 等都被用于在目标系统中执行利用。


  ## 入侵 (Breach)

  当攻击者利用系统漏洞并获得访问权限时，被称为入侵。


  ## 防火墙

  用于创建系统规则以过滤入站出站流量的技术被称为防火墙。`Firewalls` 可以通过硬件和软件来实现。


  ## 恶意软件 (Malware)

  恶意软件是一个广义术语或统称，包含了任何可能损害计算机的恶意软件。最常见的恶意软件类型是病毒、`worms`、`Trojans`、勒索软件等。


  ## 病毒

  病毒被定义为可以损害计算机上某些程序的恶意软件。它可以进一步复制自己并在多个文件和计算机网络中传播。它需要一个主机文件且不能独立执行。`Viruses` 曾只影响软件，但近年来它们甚至进化到能对硬件造成物理损坏。


  ## 勒索软件

  勒索软件是一种恶意软件，它会加密你计算机上的所有数据并阻止你访问。部署勒索软件的攻击者会留下一个让你向他们支付的应用程序，之后文件将自动解密。2017 年，一种名为
  `WannaCry` 的勒索软件感染了所有基于 Windows 的机器。


  ## 特洛马 (Trojan Horse)

  特洛马类似于病毒，但它不会独立执行。它通常被伪装并隐藏在一个文件下方，该文件对用户可能很重要。例如，用户可能会收到一个包含其预期内容的 `PDF`，但同时，点击该
  `PDF` 会触发一个恶意脚本。这种实现被称为特洛马。


  ## 蠕虫 (Worm)

  蠕虫是一种能够在网络上自我复制的恶意代码。它不一定像病毒那样感染文件，但它可以做一些烦人的事情，例如消耗网络带宽并拒绝用户使用带宽。


  ## 机器人或僵尸网络 (Bot or Botnet)

  机器人是一种植于计算机网络中的恶意应用程序，允许攻击者远程控制整个网络。部署机器人的计算机集合被称为 `botnet`。`botnet` 由一个被称为 `bot
  herder`（僵尸网络首目）的攻击者控制。


  ## DDoS

  `DDoS` 代表“分布式拒绝服务”（Distributed Denial of Service），是一种攻击的形式。`DDoS` 攻击的动机是用恶意流量淹没网络，导致网站的真实请求无法在带宽内得到。`DDoS`
  攻击通常通过实施 `botnets` 来执行。


  ## 钓鱼攻击和鱼叉式钓鱼 (Phishing and Spear Phishing)

  这是攻击者用于获取信息的技巧。最常见的例子是发送给毫无防备用户的电子邮件，这些邮件看起来可能合法，但带有将你重定向到其他地方的链接。例如，如果你有 `Citibank`
  的账户，邮件发送者的邮箱地址将是 `something@citibanks.com`（多了一个 S）。无辜的用户可能认为它是合法的，并最终点击了他们不应该点击的链接。这些链接通常会要求你输入账户详情，甚至是攻击者记录的登录密码。


  ## 加密 (Encryption)

  使用已知算法对数据进行编码以使得拥有解码密钥的人以外的人无法访问的过程被称为加密。


  ## 自带设备办公 (BYOD)

  这是许多组织实施的一项政策，建议员工可以使用个人设备处理业务。`BYOD` 政策将包含个人设备是否可以连接公司网络的访问限制。


  ## 渗透测试 (Penetration Testing)

  渗透测试——也称为 `pen-test`——使用攻击工具和技术来审查组织基础设施的安全性。聘佣内部团队或外部专家进行测试，以发现组织基础设施中的漏洞，以便在遇到真实攻击之前进行修复。


  ## 点击劫持 (Clickjacking)

  这种攻击欺骗用户点击链接或按钮，该链接看起来是真实的，但其中嵌入了恶意脚本。


  这本书仅涵盖了网络安全术语的冰山一角，但这将作为更好理解的跳板。


  ### 第七章：网络攻击历史


  现在我们将回顾历史上最著名的网络攻击。网络空间是一个开放社区，每个人都连接在一起，并且不分时间或距离可以联系任何人。它今天可能被称为一种生活方式，但如果不谨慎使用，就会产生后果。一些臭名昭著的人利用网络空间攻击银行网站、含有大量用户信息金库的社交媒体，甚至是政府。以下是几次现代网络攻击：


  ## SpamHaus 项目

  `SpamHaus` 是互联网上的一项公共服务，根据其内容或来源的信誉帮助过滤垃圾邮件。对 `SpamHaus` 的攻击被认为是历史上最大的网络攻击，目标是家庭和商业宽带路由器所有者。攻击者获得了这些路由器的控制权，所有这些用户都成了攻击的非自愿参与者。数百万电子邮件提供商使用
  `SpamHaus` 从互联网中过滤垃圾邮件。2013 年 3 月 18 日，`SpamHaus` 黑名单了一家名为 `Cyberbunker` 的公司，这导致了公司的损失。`Cyberbunker`
  和其他托管公司通过聘佣黑客进行报复，黑客通过利用宽带路由器部署 `botnets` 来关闭 `SpamHaus` 网络。


  ## 索尼 PlayStation (Sony Playstation)

  2011 年，一组黑客从 7700 万用户处盗取了信用卡详情和用户信息。这为索尼造成了约 20 亿美元的损失。该公司的另一个痛点是，即使索尼试图修复问题，黑客仍然能够使用游戏玩家的登录详情持续访问索尼网络。整个攻击持续了二十四天。


  ## PayPal

  2010 年 12 月，`PayPal` 成为一次网络攻击的受害者。这发生在 `PayPal` 封锁 `WikiLeaks` 用于筹款的账户之后，理由是违反了
  `PayPal` 的政策。许多用户因此抵制了 `PayPal`，许多黑客开始针对 `PayPal`。


  ## 加拿大政府攻击 (Canadian Government Hacking)

  2011 年 2 月，加拿大政府通过多个渠道宣布，他们遭受了源自中国的 `IPs` 发起的攻击。攻击者访问了加拿大政府的三个部门并窃取了这些部门的数据。攻击最终通过切断对这三个部门的网络访问而停止，阻止了向加拿大的数据传输。


  ## 4chan

  `4chan` 是一个发布图片和讨论日本动漫及漫画的英文网站。它于 2003 年 10 月由一个 15 岁的少年创立。（注：原文中 4chan 的部分存在大量重复，已根据要求提取核心内容）


  点击劫持 (Clickjacking)

  这种攻击欺骗用户点击链接或按钮，该链接看起来是真实的，但其中嵌入了恶意脚本。





