    of chess and war, an art form of its own.Chapter Two:How It Works & How to Get
    Away with ItTo completely understand how hacking works would take a lot more than
    a chapter. Hacking is not exactly a skill that can be taught by reading about
    it; it is more of a hands-on occupation perfected by time and practice with an
