    相反，你将需要搜索你想要的软件名称，然后你就可以根据需要找到并安装它们。例如，Ubuntu Linux 拥有一个所谓的“Ubuntu 软件中心（`Ubuntu
    Software Center`）”，它可以帮助你浏览数千个应用程序，然后从一个中心化的位置安装你最喜欢的。Linux 提供了数千个你可以轻松访问并安装的软件，这与
    Windows 和 Mac 是一样的。Linux 在开发者和 IT 公司中非常有名，因为当你提到 Windows 时，你可能听过病毒。病毒是一种脱离用户控制的程序。现在，Linux
    的美之处在于它没有所谓的病毒。它是一个非常复杂的操作系统，完全不需要你下载杀病毒软件，也不需要你寻找某些病毒。这使得 Linux 成为 IT 公司和服务器使用的极佳操作系统。


    # Linux 操作系统的结构

    在我开始介绍 Linux 操作系统系统的不同部分或组件之前，我们需要理解任何操作系统（无论是 Linux、Windows、Unix 还是任何其他操作系统）都是特定功能的集合，或者是多个组件的集合。每个组件都有一个指定的或特定的功能。例如，我们公司里有多个部门，每个部门都有指定的工作要完成。在操作系统中，我们有多个设计用于执行特定功能的组件或软件组件。现在我们将讨论
    Linux 操作系统内部的所有主要组件。


    ## Linux 内核

    内核（Kernel）是 Linux 的心脏。它负责硬件之间的通信。在你的系统或任何桌面、笔记本电脑或服务器上，你有硬件设备，如 CD 光驱、`USB port`、`HDMI
    port`、`LAN port` 和内存卡阅读器。这些都是连接到你笔记本电脑的设备。内核负责使用机器语言与这些设备通信。机器语言无非 `0` 和 `1`。机器的硬件或处理器理解
    `0` 和 `1` 的一切。内核更多地负责用它们自身的语言与这些设备通信，并与软件对话。


    在内核内部有多个职责需要执行。内核还负责管理系统资源。在你的系统中，我们知道有 `RAM`、硬盘、运行的进程，我们还有多个连接到系统的设备，以及多个用户请求。内核管理资源，例如使用多少
    `RAM`、分配多少内存、在硬盘的什么位置写入、如何处理多个用户请求、为特定目的激活哪个设备。所有这些都属于资源管理。以下是一些资源：


    ### 内存管理

    内核检查两个需要内存的应用程序或请求 `RAM` 的应用程序，然后确定给哪个应用程序分配多少内存，并决定应用程序 RAM 分配的优先级。


    ### 进程管理

    进程管理就像拥有多个进程；每个应用程序都有一个正在运行的后台进程。那么哪个进程将获得优先级？从技术来说，内存是分配给进程的而不是应用程序。所以当你运行一个应用程序时，它会启动多个后台进程，每个后台进程将被分配一些内存。


    ### 设备管理

    设备管理就像应该使用哪个设备，例如 `USB port`、摄像头、`LAN port`，以及如何使用它。


    ### 处理系统调用

    处理系统调用就像如果用户执行了多个请求，先处理哪个请求，后处理第二个和第三个请求。所有这些职责都属于 `Linux Kernel`（Linux 内核）。


    ## 系统库

    让我们从不同的维度来理解系统库。看，我们有内核，它负责与系统硬件通信。用户将在操作系统上运行多个应用程序。操作系统需要与内核通信。允许每个应用程序直接与内核通信是不可能的，因为每个应用程序都是由不同的人或使用不同的技术开发的。例如，某些应用程序用
    `Java` 开发，另一些用 `.Net`。要确保所有应用程序都能直接与内核通信变得非常困难。在这种情况下，操作系统开发者创建了一些预定义程序。这些程序成为内核和应用程序之间的中介，这样任何开发者都可以轻松选取系统库并开发他们的应用程序。


    让我们看看系统库如何帮助 Linux 操作系统：第一个是需要与内核通信的应用程序。每个应用程序都会尝试与内核通信，但如果允许不同的应用程序直接与内核通信，将非常困难。在这种情况下，不同的应用程序在与内核通信时会遇到问题，因为每个应用程序是由不同的开发者使用不同的技术构建或开发的。在应用程序开发方面没有标准。任何人可以使用任何技术来开发应用程序。因此，由于我们有多个用不同技术开发的应用程序，我们需要一个标准的处理器。


    ### 标准系统库

    操作系统开发者创建了标准系统库。这些库无非是操作系统内部提供的预定义程序。它们的作用是，每当他们构建某些应用程序时，都会包含这些拥有一组函数 get 库。他们将根据需求包含这些库，而这些库负责与内核通信。现在当我们观察通信流程时，它看起来如下：

    `应用程序 >> 系统库 >> 内核 >> 硬件`


    ## 系统工具

    要运行任何操作系统，我们需要一些工具或预定义工具来帮助你在操作系统内部进行导航或工作。当你获得 Windows 操作系统时，我们知道有多个工具可以与操作系统配合。我们有
    `Control Panel`（控制面板），`Command Prompt`（命令提示符）允许我们直接与操作系统通信，等等。帮助你管理操作系统的命令属于系统工具。


    这些不是用户工具。系统工具和用户工具之间是有区别的。用户工具就像 `Notepad`（记事本）、`Paint`（画画）和 `MS - Office` 等。系统工具是你的
    `Control Panel`、`Device Driver Manager`（设备管理器）；所有这些都属于系统工具。Linux 操作系统内部的系统工具是帮助你以标准方式操作系统的命令和工具。这些是更改目录、创建/打开/删除文件、移动文件等命令。所以所有这些帮助你管理和管理操作系统的命令都属于系统工具。每当你安装任何操作系统时，系统工具已经由操作系统开发者开发好了，你可以使用它们来管理你的操作系统。


    ## 开发工具

    如果你是 Windows 操作系统的普通用户，你已经知道 Windows 操作系统会定期提供更新。你需要更新你的操作系统。这些更新无非对操作系统进行的错误修复或其他修改，允许你工作得更快或提高操作系统性能。当涉及到任何操作系统时，这些开发工具总是可用的；无论是
    Windows、Linux 还是 UNIX，都有开发工具。这些开发者工具帮助开发者创建新的 OS 应用程序。它们的目的是在操作系统内部开发 OS 级应用程序，并确保为每个操作系统发布新更新。


    ## 终端用户工具

    终端工具是终端用户使用的工具，如 `Notepad`、`Paint`、`MS Office`、媒体播放器、`Windows Browser`、`Web Browser`、`PowerPoint`
    等。所有这些被终端用户使用的应用程序被称为终端工具。


    # 我为什么要用 Linux？

    这是许多人第一次听到 Linux 时会问的第一个问题之一。

