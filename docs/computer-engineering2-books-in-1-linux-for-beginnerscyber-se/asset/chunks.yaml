    ## LINUX FOR BEGINNERS

    A Practical Guide for Complete Beginners on How to Master and Discover Surprisingly
    Tips On How to Use Linux Efficiently


    ### Introduction

    Many skeptics are quick to dismiss Linux, comparing it to larger, more influential
    systems like `Windows` and `MacOS`, saying that it is slower and uglier. They
    also like to say that it is not user-friendly and hard to use by even those with
    the most programming prowess. While it is true that Linux is inferior to many
    other systems in terms of visual appeal and ease of usage, the fact of the matter
    is that the point of Linux was never that. While many other operating systems
    flood you with flashy options and applications, Linux chooses to remain straightforward
    in its approach and deliver results with the utmost simplicity. Linux was made
    to learn about the more advanced spheres of programming relatively easily and
    has been doing the job for many long years. What sets Linux apart from the other
    operating systems is how truly unique it is in many ways. It is a community-wide
    effort, so there are no sharks in play who want to prosper on the sweat of others.
    Everybody does as they want to, and we all have the same resources at our disposal.
    What makes your Linux system different from any other is how you choose to use
    it. Though a bit difficult to master, being good at anything takes hard work and
    dedication. Taking care of the system is not an issue, either. The commands used
    for this are all highly intuitive and very accurate, which means that you will
    rarely need the help of a professional when it comes to maintenance, even with
    huge server systems. There is really nothing bad that can be said about Linux
    that isn’t balanced out by something else. With the steady progress Linux has
    been making, it is starting to become fiery competition for OSs made by more prominent
    companies.


    ### Chapter One: History And Background

    The term Linux refers to a `kernel` or an operating system that was developed
    by `Linus Torvalds`, along with a few other contributors. The first time it was
    released publicly was in September 1991. In a world where Microsoft was charging
    consumers for an operating system like `Windows`, Linux''s advantage was that
    it was an open-source software, meaning that programmers had the option to customize
    it, create their own operating system out of it, and use it as per their requirement.
    The Linux operating system code was written mostly in the `C` programming language.
    There are hundreds of operating systems available today which use the Linux `kernel`,
    and the most popular among them are `Ubuntu`, `Debian`, `Fedora`, and `Knoppix`.
    This is not the end of the list, as new operating systems come up almost every
    year that use the kernel from the original Linux system. Linux was a milestone
    in computing and technology, and Linux powers most of the mobile phones, web servers,
    personal computers, cloud-servers, and supercomputers today. The job profile of
    Linux System Administration refers to that of maintaining operations on a Linux
    based system and ensuring maximum uptime from the system, in short, making sure
    that the system is consumed in the most optimum possible way. In the modern world,
    most of your devices run on a Linux powered server or are associated with a Linux
    system in some way or the other because of its high stability and open-source
    nature. Owing to this, the job of a Linux Administrator revolves around the following:


    * Linux File System

    * Managing the superuser on the Linux system known as `Root` Command Line using
    the `Bash` Shell

    * Managing users, files, and directories

