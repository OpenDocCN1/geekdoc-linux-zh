    ## Evolution of Computers and UNIX


    If you all know like when the computers were developed or introduced, they were
    enormous, big size systems, non-affordable and I think when the computers were
    developed the first time they were as big as small houses. Pretty big systems,
    and they were not so easy to be affordable by a normal person.


    When computers first started to evolve, every company had a different operating
    system. They used to buy the hardware, create their own operating system, and
    run the computers per their own company norms. With different companies buying
    the hardware and different companies introducing their own operating system, the
    issue was that each computer was developed for a specific purpose, meaning that
    every system had a specific purpose. For instance, one server would have a specific
    purpose, one workstation would have a specific purpose, but there was no standardized
    operating system across all the systems or the servers or the workstations.


    These systems were extremely costly because when computers were created initially,
    the hardware cost was very high. If you compare this with mobile phones, when
    mobile phones were initially created, they were also very costly. Today the demand
    is so high that hardware costs have gone down, and anyone can purchase a mobile
    phone. The same is with computers. You can get computers at an affordable price
    since many companies create computers, meaning lots of competition. So when demand
    increases, when competition increases, the prices will definitely come down.


    But when computers were first built, it was not easy for anyone to afford a computer,
    and that''s why only companies used to afford computers that were extremely costly.
    Also, in those days, understanding and learning computers was a required skill.
    So, for a normal person, it was impossible to learn and understand computers or
    operating systems. Every company had skilled labour, skilled people who operated
    and worked on these specific computers. That''s the main evolution of computers,
    and that''s how it started.


    Now understand this guy with this evolution; there was definitely a problem. The
    problem is every company had its own monopoly when it came to hardware or the
    computer''s operating system. They developed their own operating system. So, there
    was no standardization of the operating systems across computers and the companies
    that built them.


    That''s why in 1969, a team of developers started at Bell Labs. `C` language was
    first developed in that very lab, where a team of developers thought, why not
    build a standard operating system that can be used across computers so that people
    don’t have to worry about the hardware or software? Initially, the problem was
    the hardware cost, on top of another cost to build an operating system for specific
    computers. To reduce that cost, the developers thought, why not create a standard
    operating system so that people can purchase standard hardware? They can purchase
    or install the standard operating system and then continue the development or
    use their applications. That''s the beginning of Unix.


    The UNIX project''s goal was to create common software for all the computers because
    all companies were developing their own operating system; it was a pretty hard
    job. They wanted to standardize the process. The UNIX or the UNIX operating system
    was started on `C` language.


    Now the team had a further goal for the development of the UNIX operating system,
    and the goal was to create a code that is easy to understand and reusable or recyclable.
    This recyclable code is known as the `kernel`. The `kernel` is the part of the
    operating system since an operating system has multiple components. It is responsible
    for communicating with the hardware and the software. The `kernel` is recyclable
    and is used to develop the operating system and enhance the features. What many
    people do NOW is use this `kernel` because it''s standard code. They can develop
    their own UNIX flavours by modifying the `kernel` or the software that talks to
    the `kernel` or the applications that talk to the `kernel` because it is a standard
    layer.


    Earlier, you had to develop an operating system that spoke directly to the hardware.
    Now you have a layer, the `kernel`, or a mediator responsible for speaking to
    the hardware. So we need to create applications that can only speak directly to
    the `kernel` because the `kernel` handles the communication with the hardware.


    ## Linux Features


    - **Multi-User Operating System**: Multiple users can connect to the same operating
    system.

    - **Multitasking**: Multitasking means that tasks are executed parallelly based
    on CPU threads.

    - **Portability**: Portability means that you can install Linux on any hardware.

    - **Security**: Like Linux, we have authentication. When you try to connect to
    the operating system, you need to provide the user ID and password.

    - **GUI Interface**: We can also have a operating system where you can use Linux
    in GUI.

    - **File System**: A file system allows you to arrange your files and directories
    in a systematic order.

    - **Open Source**: It means that anyone can freely download, install, and use
    the operating system.


    ## Chapter Two: Installing Linux


    Take note that you might need to know your computer''s hardware before you install
    distributions. For instance, if you choose to install `Debian`, you will need
    information about your PC and its components because the distribution does not
    recognize everything. Fortunately, nowadays, all installers are capable of scanning
    your computer and see every connected hardware element. However, you should still
    have the information handy in case some errors occur. This way, you can troubleshoot
    and figure out what went wrong during the setup process. Once you''ve selected
    your Linux distribution, you need to download it. If not all, most of them come
    in `ISO` format, and you can download them for free. The next step is burning
    the file on a disk or a flash drive. Moving on, you need to tell the system to
    boot up from the disk or flash drive when you start it up. Many computers will
    boot automatically when they detect a boot-up disk, but sometimes you have to
    turn on the setting yourself if it''s set to always boot from the hard drive.
    Changing the boot-up order may solve the problem. You will have to access your
    system''s options. You gain access to your system by pressing a key like `F10`
    or `DEL` before your operating system loads. Once''re in the computer''s setup
    section, you need to assign your Linux boot up disk to be the default boot device.
    Confirm the change, place your disk in the drive (or connect the flash drive),
    and restart your computer. At this stage, you should probably know whether you
    want to keep your current operating system at the same time as installing Linux.
    If you have Windows installed, for instance, and you don''t want to replace it,
    you will have to perform a few additional steps.


    If you plan on keeping your current operating system, the first thing you need
    to do is prepare a separate drive partition for the Linux distribution. Currently,
    your system is using the entire hard drive. The process isn''t difficult, but
    there''s always the risk of accidentally wiping the drive clean and losing all
    of your data. This is why, before installing any operating system, it''s a good
    idea to back-up all of your files and data. With a backup, you can use a partitioning
    application to make the process easier. For instance, a program called `GParted`
    works well, and it comes included with certain Linux distributions. Many Linux
    installers can handle your partitions automatically. The new partition is created
    by shrinking the size of your current operating system''s partition. Once you''re
    ready to install Linux, boot your computer from the installation disk and begin
    the process. You need to follow many steps, and the entire setup may take up to
    two hours. It all depends on your system and which distribution you''re installing.
    At this stage, all you really need to do is follow the onscreen instructions.


    ### Virtual Machines


    `VirtualBox` is a virtual machine that, first developed by Sun Microsystems, is
    now under Oracle''s ownership. It simulates a separate computer, and each virtual
    machine can have its own applications, and a whole host of things. `VirtualBox`
    is ideal for testing out operating systems, in this case, Linux on Windows or
    Mac OS.


    ### Using Linux in this way


    Using this way, you don''t need to make any permanent changes to your current
    system. Here''s how to install VirtualBox on Windows and Mac.


    - **Windows**: Go to the VirtualBox Download page and find the latest version;
    click on it. On the next page, look for the file that ends `.exe` and download
    it – remember the location you saved on your computer. Once the installer has
    been downloaded, double-click the `.exe` file and follow the instructions on the
    screen to install it onto Windows – be aware that you may lose your network connection
    for a while during the installation because network adapters are being installed.
    Now you must reboot your computer, and you should find `VirtualBox` in your apps.
    From here, you can run it and install any other operating system you want to try.

    - **Mac OS**: Go to the VirtualBox download page and download the latest version
    of the app. Save the `.dmg` to a file location that you will easily remember –
    make sure you download the OS X version. Locate the file and install it using
    the executable file. Reboot your computer, and you can start using `VirtualBox`.


    ### Installing Linux Using an Image for Virtual Box


    After finishing the steps to install `VirtualBox` to your computer, you need to
    download the disk image for Ubuntu Linux.


    - First, if you haven''t already got a `BitTorrent` client installed on your computer,
    download one now – `BitTorrent` is a P2P application that allows downloads from
    other users, significantly easing the loading in the Ubuntu servers. Now head
    to the Ubuntu release website and download the latest release version – do NOT
    click on Desktop CDs links. Now copy that to a bootable USB Caution here – if
    `WinRAR` is installed, it will automatically associate itself with the file you
    downloaded and will ask you if you want to use `WinRAR` to extract the contents
    – do NOT use `WinRAR` and do NOT extract the `.iso`. **IMPORTANT** – Before you
    start the next step, back up the contents of your hard drive somewhere safe! If
    you don''t, you will lose everything!

    - Open `VirtualBox` from your Start menu and click New – this will open the New
    Virtual Machine Wizard. Click on Next and give your virtual machine a name – stick
    with Ubuntu or Linux for ease. If you have more than 1 GB of RAM on your computer,
    allocate one-quarter maximum to the virtual machine – if you have less, stick
    with what `VirtualBox` recommends. Click Next. Click on Create New Hard Disk and
    then on Next. Click on Next again, and you will come to a screen where you set
    the type of hard drive. Choose Fixed-Size Storage. If you intend to add software
    or to install potentially large files in virtual Linux, add on some buffer; click
    Create. When the virtual hard drive has been created, you need to add the `.iso`
    image you downloaded. Click `Settings>Storage>CD/DVD Device`. Where it says Empty,
    there is a folder icon, so click on it. Choose the `.iso` that you already downloaded
    and click OK. Now double-click on the virtual machine, so it starts.


    - When you boot up the system for the first time, you will find a few more optional
    steps that involve system configuration. Before you can install Linux, you must
    first change the BIOS settings on your computer – usually, when you start, hit
    `F1`, `F2`, `F12`, or `Delete`. Restart your computer now and get into BIOS settings
    and change the boot option to boot from USB.


    ### Steps of Installing CentOS from Scratch


    `CentOS` is a stable Linux distribution, and here''s how to install it:


    - Go to the download page for CentOS and download the `ISO`. Now you need to make
    a bootable drive, transferring the `ISO` to a formatted USB stick. To do this,
    plug your USB in and open a command prompt window. Type the following:

    ```

    dd if=/iso/CentOS-versionnumber-x86_64-DVD-1602-99.iso of=/dev/sdb

    ```

    Ensure you have a minimum 5 GB space on the USB stick. On the desktop, click Install
    to Hard Drive. Choose your keyboard type and preferred language – make sure you
    pick the right keyboard, or some of your keys will be scrambled up. The installer''s
    default is to select Automatic Partitioning of your hard drive – click the icon
    for Installation Destination and change by Custom Partitioning. Choose the hard
    drive where the installation of CentOS is to be stored and then click Other Storage
    Options. Select the option giving you a chance to configure the partitioning by
    yourself, and click on Done. Select the Standard Partition. To develop a Swap
    Space on one of your partitions, select File System where the swap space will
    be created and name it as `swap`. Select Reformat. Now you need to create your
    mount point where install the root partition. Set your mount point and then set
    Label and Desired Capacity in any way you desire. Click `ext4` to set the file
    system and then on Reformat. Click Done and accept the changes you have made.
    Click the clock and set your time zone; click Done. Click on Begin Installation;
    as it goes through, follow all the onscreen instructions, setting up your user
    account and the root password. To do this, click Root Password and type in the
    password twice; click on Done. To create your user account, input the details
    and, if this going to be an administrator account, ensure that you tick the options
    for Make This User Administrator and on Require a Password. When you complete
    the installation, a message telling it was successful will appear; click on Quit.
    Log out and then log in to your new CentOS installation. Accept the EULA, and
    you are ready to go.


