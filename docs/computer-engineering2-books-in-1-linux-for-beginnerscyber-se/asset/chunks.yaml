    一旦你发现了一个可能的分布向量，就可以开始实施额外的缓解措施，首先是实施网络控制列表，以拒绝应用程序与其他系统直接通信的能力。这样做将立即更容易对特定资源进行隔离和沙箱化，以便你更准确地确定问题所在。你可以通过简单为任何识别出的应用程序或服务器的
    `DNS` 区域添加空指针来完成此任务，这将使你能够轻松看到哪些是正在运行的，哪些是未识别的。


    # 第六章：网络安全术语


    书中使用的几个术语都与网络安全领域有关。在第一章涵盖这些术语是非常重要的，以便在它们后续出现时你熟悉它们。这些术语与你今天使用的所有设备、这些设备上的软件、设备连接的网络基础设施等有关。现在我们来逐一介绍这些术语。


    ## 云

    互联网由“云”组成——并不是天空中的云。云计算是一项允许用户从世界任何地方访问其文件的技术。云是一个计算机网络，存储了智能设备可以远程访问的数据。云最常见的例子是你的电子邮件。它们存储在互联网上一组分布式计算机上，只要你拥有所需的凭据，就可以从任何地方访问它们。另一个例子是你使用手机创建的
    `Spotify` 播放列表，但当你使用相同账户登录时，仍然可以通过笔记本电脑等其他设备访问同一个播放列表。


    ## 软件

    软件可以定义为告诉计算机做什么的指令。这些指令被放入一个软件软件包中，用户可以安装并开始使用。最常见的软件示例之一是 `Microsoft Office`，它用于创建文档、演示文稿等。智能手机应用也是你用于各种用途的软件。例如，`WhatsApp`
    聊天器是最常用的发送消息的程序。


    ## 域

    域是互连的子设备（如计算机、智能手机、打印机等）的父级。例如，工作场所所有的计算机都是属于该组织域的一部分。域的框架中定义了策略，管理这些设备在该域下将拥有的访问权限。


    ## IP 地址

    `IP address` 是分配给网络、局域网或互联网智能设备的数字地址。连接到网络的每个设备都关联着一个 `IP address`。该 `IP address`
    被其他设备用于定位和相互通信。


    ## 虚拟专用网络 (VPN)

    虚拟专用网络是一个你可以在其中保持匿名的网络。你会被分配一个属于不同地区的 `IP`，你在互联网上的所有操作都会通过该 `IP` 进行记录，从而隐藏你的原始
    `IP`。`VPN` 还会为你加密流量，使互联网服务提供商或政府无法跟踪你的在线活动。`VPNs` 也被组织用于在你从外部访问办公室网络时保持你与办公室网络的连接。这在最近变得非常流行，因为它帮助人们在家或远程工作。


    ## 漏洞利用 (Exploit)

    利用被定义为可以利用计算机或服务器中的漏洞或缺陷的恶意代码。`Viruses`、`Trojans`、`Botnets` 等都被用于在目标系统中执行利用。


    ## 入侵 (Breach)

    当攻击者利用系统漏洞并获得访问权限时，被称为入侵。


    ## 防火墙

    用于创建系统规则以过滤入站出站流量的技术被称为防火墙。`Firewalls` 可以通过硬件和软件来实现。


    ## 恶意软件 (Malware)

    恶意软件是一个广义术语或统称，包含了任何可能损害计算机的恶意软件。最常见的恶意软件类型是病毒、`worms`、`Trojans`、勒索软件等。


    ## 病毒

    病毒被定义为可以损害计算机上某些程序的恶意软件。它可以进一步复制自己并在多个文件和计算机网络中传播。它需要一个主机文件且不能独立执行。`Viruses` 曾只影响软件，但近年来它们甚至进化到能对硬件造成物理损坏。


    ## 勒索软件

    勒索软件是一种恶意软件，它会加密你计算机上的所有数据并阻止你访问。部署勒索软件的攻击者会留下一个让你向他们支付的应用程序，之后文件将自动解密。2017 年，一种名为
    `WannaCry` 的勒索软件感染了所有基于 Windows 的机器。


    ## 特洛马 (Trojan Horse)

    特洛马类似于病毒，但它不会独立执行。它通常被伪装并隐藏在一个文件下方，该文件对用户可能很重要。例如，用户可能会收到一个包含其预期内容的 `PDF`，但同时，点击该
    `PDF` 会触发一个恶意脚本。这种实现被称为特洛马。


    ## 蠕虫 (Worm)

    蠕虫是一种能够在网络上自我复制的恶意代码。它不一定像病毒那样感染文件，但它可以做一些烦人的事情，例如消耗网络带宽并拒绝用户使用带宽。


    ## 机器人或僵尸网络 (Bot or Botnet)

    机器人是一种植于计算机网络中的恶意应用程序，允许攻击者远程控制整个网络。部署机器人的计算机集合被称为 `botnet`。`botnet` 由一个被称为 `bot
    herder`（僵尸网络首目）的攻击者控制。


    ## DDoS

    `DDoS` 代表“分布式拒绝服务”（Distributed Denial of Service），是一种攻击的形式。`DDoS` 攻击的动机是用恶意流量淹没网络，导致网站的真实请求无法在带宽内得到。`DDoS`
    攻击通常通过实施 `botnets` 来执行。


    ## 钓鱼攻击和鱼叉式钓鱼 (Phishing and Spear Phishing)

    这是攻击者用于获取信息的技巧。最常见的例子是发送给毫无防备用户的电子邮件，这些邮件看起来可能合法，但带有将你重定向到其他地方的链接。例如，如果你有 `Citibank`
    的账户，邮件发送者的邮箱地址将是 `something@citibanks.com`（多了一个 S）。无辜的用户可能认为它是合法的，并最终点击了他们不应该点击的链接。这些链接通常会要求你输入账户详情，甚至是攻击者记录的登录密码。


    ## 加密 (Encryption)

    使用已知算法对数据进行编码以使得拥有解码密钥的人以外的人无法访问的过程被称为加密。


    ## 自带设备办公 (BYOD)

    这是许多组织实施的一项政策，建议员工可以使用个人设备处理业务。`BYOD` 政策将包含个人设备是否可以连接公司网络的访问限制。


    ## 渗透测试 (Penetration Testing)

    渗透测试——也称为 `pen-test`——使用攻击工具和技术来审查组织基础设施的安全性。聘佣内部团队或外部专家进行测试，以发现组织基础设施中的漏洞，以便在遇到真实攻击之前进行修复。


    ## 点击劫持 (Clickjacking)

    这种攻击欺骗用户点击链接或按钮，该链接看起来是真实的，但其中嵌入了恶意脚本。


    这本书仅涵盖了网络安全术语的冰山一角，但这将作为更好理解的跳板。


    # 第七章：网络攻击历史


    现在我们将回顾历史上最著名的网络攻击。网络空间是一个开放社区，每个人都连接在一起，并且不分时间或距离可以联系任何人。它今天可能被称为一种生活方式，但如果不谨慎使用，就会产生后果。一些臭名昭著的人利用网络空间攻击银行网站、含有大量用户信息金库的社交媒体，甚至是政府。以下是几次现代网络攻击：


    ## SpamHaus 项目

    `SpamHaus` 是互联网上的一项公共服务，根据其内容或来源的信誉帮助过滤垃圾邮件。对 `SpamHaus` 的攻击被认为是历史上最大的网络攻击，目标是家庭和商业宽带路由器所有者。攻击者获得了这些路由器的控制权，所有这些用户都成了攻击的非自愿参与者。数百万电子邮件提供商使用
    `SpamHaus` 从互联网中过滤垃圾邮件。2013 年 3 月 18 日，`SpamHaus` 黑名单了一家名为 `Cyberbunker` 的公司，这导致了公司的损失。`Cyberbunker`
    和其他托管公司通过聘佣黑客进行报复，黑客通过利用宽带路由器部署 `botnets` 来关闭 `SpamHaus` 网络。


    ## 索尼 PlayStation (Sony Playstation)

    2011 年，一组黑客从 7700 万用户处盗取了信用卡详情和用户信息。这为索尼造成了约 20 亿美元的损失。该公司的另一个痛点是，即使索尼试图修复问题，黑客仍然能够使用游戏玩家的登录详情持续访问索尼网络。整个攻击持续了二十四天。


    ## PayPal

    2010 年 12 月，`PayPal` 成为一次网络攻击的受害者。这发生在 `PayPal` 封锁 `WikiLeaks` 用于筹款的账户之后，理由是违反了
    `PayPal` 的政策。许多用户因此抵制了 `PayPal`，许多黑客开始针对 `PayPal`。


    ## 加拿大政府攻击 (Canadian Government Hacking)

    2011 年 2 月，加拿大政府通过多个渠道宣布，他们遭受了源自中国的 `IPs` 发起的攻击。攻击者访问了加拿大政府的三个部门并窃取了这些部门的数据。攻击最终通过切断对这三个部门的网络访问而停止，阻止了向加拿大的数据传输。


    ## 4chan

    `4chan` 是一个发布图片和讨论日本动漫及漫画的英文网站。它于 2003 年 10 月由一个 15 岁的少年创立。（注：原文中 4chan 的部分存在大量重复，已根据要求提取核心内容）


