    命令基本上定义了你想要执行的程序。紧随命令后的选项可以为零、一个或多个。选项控制命令的行为并定义了命令将执行的操作。选项通常使用单横线（-）或双横线（--）。这样做是为了将选项与参数区分开来。例如：`-a`
    或 `--allArguments` 也位于命令行中的命令后面，并且像选项一样可以是一个或多个。参数指示了命令应该操作的目标。


    让我们以示例命令 `usermod -L John` 为例。示例中的命令是 `usermod`，选项是 `-L`，参数是 `John`。该命令的作用是锁定系统中用户
    `John` 的密码。


    为了有效使用命令行命令，用户需要知道某个特定命令可以使用哪些选项。如果你在运行任何命令时带有 `--help` 选项，你将获得一组可以传递给该特定命令的选项。没有必要背下所有命令需要使用的所有选项。列表还会告诉你每个选项的作用。


    `use` 语句（使用语句）有时看起来非常困难且复杂难以阅读。一旦你习惯了某些约定，阅读语句就会变得简单得多。


    选项被方括号 `[ ]` 包围。

    如果命令后跟着 `…`，它表示属于该类型的任意长度项目列表。如果有多个项目并用管道符 `|` 分隔它们，则意味着你只能指定其中一个。


    变量使用角括号 `<>` 中的文本表示。因此，如果你看到 `<filename>`，你必须将其替换为你想要传递的文件名。


    例如，检查下面的命令：`[student@desktop ~]$ date --help`

    ```

    date [OPTION]... [+FORMAT]

    ```

    这表示命令 `date` 接受由 `[OPTION]...` 表示的选项以及另一个选项 `[FORMAT]`，后者将以 `+` 符号为前。


    # 在 Bash Shell 上执行命令


    Bourne Again Shell（称为 `bash`）解释用户在 shell 提示符上输入的命令。我们已经学习了你在 shell 提示符中输入的字符串如何分为三个部分：命令、选项和参数。你在
    shell 中输入的每个单词都使用空格隔开。系统中已安装的程序由你输入的每个命令定义。每个命令都有与其相关的选项和参数。


    当你在 shell 提示符上输入命令、选项和参数并准备好运行时，你可以按下键盘上的 Enter 键，这将执行该命令。你将在终端上看到该命令的输出。当输出完成后，你将再次看到
    shell 提示符，这表明上一个命令已成功执行。如果你想在单行中输入多个命令，可以使用分号来分隔命令。


    让我们回顾一些在 Red Hat Enterprise Linux 7 和其他基于 Linux 的操作系统命令行中日常使用的某些简单命令。


    ## date 命令


    `date` 命令显示系统的日期和时间。你也可以使用此命令设置系统时间。如果你为 `date` 命令传递一个带有 `+` 符号的参数，它表示你希望在输出中显示日期的格式。


    ```

    [student@desktop ~]$ date

    Sat Aug 5 08:15:30 GMT 2019

    [student@desktop ~]$ date +%R

    08:15

    [student@desktop ~]$ date +%x

    08/05/2019

    ```


    ## passwd 命令


    `passwd` 用于更改密码。然而，在设置新密码之前，你需要为指定用户指定原始密码。该命令要求指定一个强密码，因此必须包含小写字母、大写字母、数字和符号。你还需要确保指定的密码不是字典中的单词。root
    用户有权更改系统上任何其他用户的密码。


    ```

    [student@desktop ~]$ passwd

    Changing password for user students. Changing password for students.

    (current) UNIX password: type old password here

    New password: Specify new password here

    Retype new password: Type new password again

    passwd: all authentication tokens updated successfully.

    ```


    ## file 命令


    Linux 操作系统没有指定文件类型和扩展名。`file` 命令可以扫描任何文件并告诉你它是哪种文件。你想要分类的文件需要作为参数传递给 `file` 命令。


    ```

    [student@desktop ~]$ file /etc/passwd

    /etc/passwd: ASCII text

    ```

    如果你将文件夹/目录作为参数传递给 `file` 命令，它会告诉你这是一个目录。


    ```

    [student@desktop ~]$ file /home/home

    /home: directory

    ```


    ## head 和 tail 命令


    下一组命令是 `head` 和 `tail`，它们分别打印文件的前十行和最后十行。这两个命令都可以与选项 `-n` 结合，该选项可以指定你想显示的行数。


    ```

    [student@desktop ~]$ head /etc/passwd

    ```

    这会打印 passwd 文件中的前 10 行。


    ```

    [student@desktop ~]$ tail -n /etc/passwd

    ```

    这将打印 passwd 文件中的最后 3 行。


    ## wc 命令


    `wc` 命令用于统计作为参数传递的文件行数、单词数和字符数。它支持选项 `-l`、`-w、`-c`，分别代表行、单词和字符。


    ```

    [student@desktop ~]$ wc /etc/passwd

    30 75 2009 /etc/passwd

    ```

    这显示 passwd 文件中有 30 行、75 个单词和 2009 个字符。如果你在使用 `wc` 命令的同时传递 `-l`、`-c、`-w` 选项，它将根据你传递的选项仅显示行、单词或字符的计数。


    ## history 命令


    `history` 命令显示你之前输入的所有命令以及相应的命令编号。你可以使用 `!` 标记配合命令编号来扩展该命令输入的内容及其输出。


    ```

    [student@desktop ~]$ history 1

    1 clear

    2 who

    3 pwd

    [student@desktop ~]$ !3

    /home/student

    ```

    这显示我们使用 `!3` 扩展了 `pwd` 命令，显示了当前的工作目录，输出为 `/home/student`，这是学生用户的家目录。


    你可以使用箭头键在 history 命令提供的输出之间导航。向上箭头将带你回到上方的命令，向下箭头将带你回到下方的命令。使用右箭头和左箭头键，你可以移动到当前命令并对其编辑。


    # 编辑命令行的快捷键


    当你与 bash 交互时，bash 命令行提供了一个编辑功能。这有助于你在正在输入的命令中移动以进行编辑。我们已经看到了如何使用箭头键配合 `history`
    命令在命令间移动。以下列表将帮助你在处理特定命令时使用编辑功能。


    - `Ctrl+a` / `Ctrl+e`：（注意：这）会将光标带到命令行的开头。

    - `Ctrl+u`：清除从光标处到命令行行开头的内容。

    - `Ctrl+k`：清除从光标处到命令行行末尾的内容。

    - `Ctrl+左箭头`：将光标移动到上一个单词的开头。

    - `Ctrl+右箭头`：将光标移动到下一个单词的开头。

    - `Ctrl+r`：在历史命令列表中搜索模式。


