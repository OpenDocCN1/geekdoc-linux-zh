    你必须频繁更新此政策，并让组织中的每位员工了解政策的变化。


    ### 员工教育

    这是一个必须考虑的关键方面。如果你有一项安全策略，但你的员工不知道他们必须做什么，那将是徒劳。帮助你的员工理解他们必须执行的不同协议。你需要进行培训并让人们知道他们必须做什么。这是保护数据最简单的模式之一。


    ### 使用安全密码

    记住，密码对于维护网络安全至关重要。指导你的员工选择黑客难以猜测的密码。你必须避免在密码中使用日期和姓名，因为黑客可以轻易将这些词汇与你联系起来。你必须指示他们定期更改密码。你还可以使用多身份验证系统为账户添加额外的保护层。


    ### 确保软件已更新

    如果你的系统中存在过时的软件，可能会导致安全风险。你应该始终使用最新的补丁更新软件。例如，如果你使用 `Windows Operating System`，你必须允许更新运行，以涵盖任何漏洞或缺口。


    ### 保护网络安全

    你必须使用防火墙来保护系统使用的网络。使用加密技术，让黑客或其他任何用户难以访问数据。在使用 `Wi-Fi` 时必须小心，因为大多数黑客都针对这些连接。让员工知道他们不应该使用公共
    `Wi-Fi`。要求他们使用 `VPN` 连接来确保数据传输的安全。确保使用强密码保护路由器。


    ### 备份数据

    无论你多警惕，黑客都可以选择针对你的系统或网络。在发生此类攻击时，将数据存储在磁盘上。让系统将数据存储在安全的地方。你也可以在独立的数据中心收集数据。


    ### 控制访问

    你必须确保对员工使用的设备也保持某些控制。员工必须小心屏幕上的信息，绝不要离开锁定状态。如果他们离开工作站或办公桌一分钟，必须注销系统。由于任何人都可以带走笔记本电脑，应该告诉员工永远让它无人看管。由于更多业务在平板电脑和智能手机上进行，黑客针对这些设备。员工必须保护手机上的数据，并使用密码保护手机。他们必须及时报告设备的丢失或被窃。


    ### 网络安全培训

    组织始终可以通过培训员工来降低网络攻击的风险。他们可以为员工 `Target Solutions Cybersecurity Training`。这些培训材料将提供动态课程，以检查用户对网络安全的认知。


    # 第十七章：网络安全的需求

    网络安全现在被视为个人和家庭的基本组成部分，此外还有我们的企业、政府以及商业教育机构。家庭和父母需要保护孩子以及家庭成员免受在线欺骗。保护影响我们私人经济状况的财务安全方面的财务信息至关重要。网络对于员工、教育机构、学生和教职人员很重要且有益，它提供了许多学习选择，但也伴随着多种在线风险。网络用户迫切需要识别保护免受在线欺骗和身份盗窃的方法。对互联网行为和系统保护进行适当的学习可以减少漏洞并实现更安全的网络设置。


    中小型组织由于资源有限和缺乏正确的网络安全技能，也面临着各种安全相关的挑战。解决方案的快速扩张也使网络安全变得更加复杂，因为我们还没有为相关问题提供永久的手段。然而，我们正在努力并提供各种技术或框架来保护我们的网络和信息，但每种保护都是暂时的。尽管如此，增强安全理解和正确的策略对于保护知识产权和商业秘密是必要的，可以最大限度地减少财务和声誉损失。


    政府在互联网上拥有大量的机密记录和电子信息，这是网络攻击的主要目标。政府面临的问题通常是因为基础设施不当、意识不足以及资金短缺。每个政府机构都需要为文化提供可靠的解决方案，维护公民与政府之间的通信以及机密信息的安全。


    随着个人更强烈地依赖帮助他们控制日常生活的技术，网络犯罪的危险将会升级。网络风险构成了美国面临的最可能、最严重的国家安全后果[之一]……显而易见，需要更多工作来加强我们的网络安全。


    多次大规模的网络攻击影响了诸如 `Target`、`Bank of America`、`JPMorgan Chase` 和 `Home Depot` 等大型企业。数据泄露可能损害了银行记录、信用卡号以及各种其他私人信息，包括用户名、密码、电子邮件、地址和电话号码。


    ### 网络安全专家短缺

    根据 `RAND Corporation` 2014 年 6 月的一项调查，“全国范围内网络安全专业人员的短缺——特别是联邦政府内部的角色——给国家和国土安全带来了风险。”传统的
    IT 专业人员可能没有经过有关信息安全策略的完全培训。许多组织可能不愿意或无法投入大量资金进行全公司的网络安全识别培训。在某些情况下，雇主可能理解升级网络安全技术的需求，但不确定具体如何管理这个问题。


    根据 `RAND` 的评估《想要黑客：网络安全劳动力市场研究》，最近的数据泄露将对网络安全专家的需求推向了“云端的高度”。


    ### 需要网络安全的人

    在网络刚开始时，它通常被认为是那些比他人更擅长处理台式电脑的人的一种书呆消遣方式。现在，从社交媒体到网上银行到电子医院记录，我们生活的每种产品都在互联网上销售。由于其他不法分子，网络黑客可以争夺进入这些工作和信息以供个人目的。基本上，每个人都需要网络安全，因为几乎每个人都能通过互联网轻松获取个人信息。


    ### 网络罪犯的时代

    技术本身并不邪恶，尽管它确实可以被用于恶。。为了利用网络进行任何活动，我们必须提供关于我们爱好、偏好、财务状况、购买习惯以及相关的信息。在一个理想的世界里，几乎所有信息从离开我们的笔记本电脑和智能手机到到达我们进行交易的公司或银行的期间，都将保持在完美的真空状态。


    事实是，有一支遍布全球的网络犯罪分子军队，他们正在搜寻那一个不足的密码或可能是不安全的通信类型来发动攻击并从中提取信息。典型罪犯的时代已被网络犯罪分子所取代，他们可能从地球另一端黑入你的电脑，并使用你的私人信息摧毁你的生活。


    ### 利用互联网攻击他人

    曾有一个时代，笔记本电脑被纯视为一种制造设备。然而，当 `Bill Gates` 创立家用个人电脑的理念时，突然每个家户都渴望拥有个人电脑以及成为全球网一部分的机会。


    那是简单的时代，普通人对电脑几乎一无所知。由于他们对电子世界的渴望，访问者会偶然发现声称能发现快速发富之方法的网站，并提供许多其他有用信息的链接。只需在超链接上点击一下，就会在他们的电脑上下载一个含有有害计算机病毒的文件。


    今天，创建的方法变得越来越复杂，这些病毒运行时时会造成更大的损害，包括：


