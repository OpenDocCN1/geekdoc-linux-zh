  trans: '


    # 网络安全的优势


    - 保护您的系统免受恶意攻击

    - 在预存组中删除或可能消除恶意部分

    - 防止所有者对产品进行未经授权的访问

    - 禁止使用可能被感染的特定资源

    - 保护机信息


    # 网络安全的劣势


    - 严格的监管

    - 非技术用户难以处理

    - 对资源的限制性大

    - 需要不断打补丁

    - 持续遭受攻击


    # 网络安全对社会的重要性


    ## 网络安全对社会究竟如何重要

    网络安全专家 `Mikael Stenqvist` 探讨了增强瑞典电网保护水平的优势，以便为当代社会的未来发展提供简单的受保护保障。


    在过去的 15 年里，技术飞速发展，安全问题可能会被忽视。在瑞典，光纤基础设施已部署到 60-70% 的大多数企业和家庭，4G 移动网络覆盖率已显著超过 90.5%。大多数家庭网络目前用于电视和互联网连接，尽管现在已经开发了许多针对新解决方案的应用程序，它们在清晨就让我们的领域变得更加智能。


    例如，医疗保健数字化（即电子健康）有助于提高家庭照顾病患和老年人的效率。报警器、提醒人们服药的移动应用程序、或者可能监测脉搏或血压的设备、电子锁以及 24
    小时摄像头监控，都能让人们在自己的家里生活得更有独立性。通过物联网，当代社会开始全天候更加紧密连接。


    基础设施和关键公共服务的数字化与自动化正在涉及智能电网、供水网络、带有自动驾驶汽车的智能出行技术，以及许多巨大的全新的创新，这些创新从经济、生态和环境角度来看，让我们的房屋、城镇和城市变得好得多，并且更具可再生性。


    这些突破导致了不同应用中所需的监控、控制和测量传感器数量爆炸式增长。根据全球最大的网络解决方案制造商之一 `Cisco` 的数据，全球目前约有 50 亿传感器连接着建筑、铁路、道路、医院、住宅等。这个数字将指数级增长，在未来五年内，数万亿传感器将用于不同的用途。


    # 第十二章：网络安全的类型


    ## 现在似乎一切都依赖计算机和互联网吗？

    娱乐、通信、交通、医疗、购物等。甚至银行机构也在在线运营其业务。意识到世界上许多地方依赖于互联网这一事实，应该鼓励我们挑战自我。


    我的生命中有多少比例是由网络驱动的？我的私人信息有多少比例存储在网络上？我的公司有多少比例可以通过网络访问？我的客户信息有多少比例可以通过网络访问？


    鉴于对计算机系统的这种显著依赖，忽视公司内部可能发生网络犯罪的可能性是极其危险的，并且可能对你、你的业务、你的员工以及你的客户产生不利影响。如果没有安全感，你的公司处于网络攻击的极高风险之中。


    以下是你需要关注的多种网络安全类型。这可以帮助你为卓越的安全策略构建良好的基础。


    ### 1. 关键基础设施安全

    重要基础设施的安全包括现代社会所赖的网络-物理方法。关键基础设施的常见示例：


    - 电网

    - 饮用水净化设施

    - 访客灯光


    接入互联网电网基础设施的购物中心和医院会导致它们容易受到网络攻击。负责任何关键基础设施的公司必须进行尽职调查，以识别漏洞并保护公司免受攻击。除了这些关键基础设施的弹性之外，保护对我们社会的福祉和安全至关重要。


    然而，那些不负责基础设施但在公司运营中依赖基础设施的公司，应该通过分析对他们所依赖的关键基础设施的攻击可能如何影响他们，来制定应急预案。


    ### 2. 应用安全

    你必须将应用程序保护作为保护设备时应采用的安全方法选择之一。软件安全使用软件和硬件处理措施来应对应用程序开发阶段形成的外部威胁。应用程序在网络上更易访问，因此在开发阶段采取保护措施是该项工作中一个至关重要的阶段。


    应用程序安全的类型：


    - 防病毒程序

    - 防火墙加密显示


    这些有助于防止未经授权的访问。公司还可以检测极易脆弱的特定资产，并通过在这些数据集上实施系统安全程序来保护它们。


    ### 3. 网络安全

    由于网络安全关乎外部威胁，社区安全防止恶意目标对内部网络进行未经授权的入侵。社区安全通过保护基础设施并限制对其访问来确保内部网络受到保护。


    为了让你更好地管理组安全监控，安全团队目前使用机器学习来标记异常访问并及时警告威胁，这是非常有必要的。网络管理员继续实施策略和程序，以防止对系统进行未经授权的访问、修改和利用。


    安全实现的常见示例：


    - 额外登录

    - 强制性密码

    - 系统安全

    - 防病毒程序

    - 反间谍软件软件加密

    - 防火墙监控的互联网访问。


