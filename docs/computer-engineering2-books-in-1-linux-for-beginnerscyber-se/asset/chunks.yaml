- fmt: '

    - **Bootloader**: This is going to be the software that can manage the boot process
    on our computer. For most users, this is going to be the splash screen that is
    going to pop up and then will go away when you are first booting up into the operating
    system.

    - **Kernel**: This is going to be the one piece of the whole that is called Linux.
    This will be the core of our system, and it is responsible for managing the memory
    peripheral devices and CPU. The kernel is going to be the bottom level that we
    will find with our operating system.

    - **Init system**: This will be one of the sub-systems that will bootstrap the
    user space, and then it will be in control of the daemons. One of the most widely
    used of these will be a system, which is also sometimes seen as the most controversial
    of them. This will be the system responsible for booting up the operating system
    once the initial booting is handed over from the initial bootloader we use.

    - **Daemons**: These are going to be some of the background services. It could
    include scheduling, sound, and printing options, but you can move them around
    to fit your needs. They will either start up when you do a boot of the system
    or after you have had a chance to log into the desktop.

    - **Shell**: You''ve probably also heard this word too many times or the Linux
    command line, which at one time scared many people away from Linux (perhaps because
    they thought they had to learn some mind-numbing command line structure to use
    the OS). The shell is the command process that lets you control your computer
    through commands by typing them into a text interface. Today, you can work with
    Linux without even touching the command line, but it''s important to work with
    it, as we will see shortly.

    - **Graphical server**: This will be the sub-system that will display all of the
    different graphics you want on the monitor. It is called `X` or the `x server`.

    - **Desktop environment**: This will be the piece of the operating system that
    you are actually going to spend time interacting with. This is the actual implementation
    of the metaphor ''desktop'' made of programs running on the visible surface of
    the operating system that you will interact with directly.


    There will be many options for this kind of environment that we can choose from,
    including `Cinnamon`, `Xfce`, `gnome`, `utility`, `Pantheon`, `Enlightenment`,
    and more. Each of these environments will include some of the applications that
    you need built-in, including the games, web browsers, configuration tools, file
    managers, and more.


    - **Applications**: The desktop environment you choose is not going to come with
    many applications for you to choose from.

    '
