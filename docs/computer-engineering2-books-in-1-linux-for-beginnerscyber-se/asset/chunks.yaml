    the download option to access it.● Next, you need to choose the "persistent storage"
    amount. This represents the storage space, which will be reserved for the installation.
    Keep in mind that the application might set the default to 0MB. You should opt
    for 400MB, at least.● Finally, you can click on the "Create Live USB" button.The
    process will take several minutes, and in the end, you will see two new folders:
    one named "syslinux," which is small and is only responsible for the system boot
    up, the second folder is "LiveOS," which contains the system and utilizes the
    storage you set up earlier.You can now terminate the flash drive creator and try
    out the Live drive.Virtual MachinesVirtualBox is a virtual machine that, first
    developed by Sun Microsystems, is now under Oracle''s ownership.It simulates a
    separate computer, and each virtual machine can have its own applications, operating
    system, and a whole host of other things. VirtualBox is ideal for testing out
    various operating systems, in this case, Linux on a Windows or Mac OS computer.Using
    Linux in this way, you don''t need to make any permanent changes to your current
    system.Here''s how to install VirtualBox on Windows and Mac.Windows● Go to the
    VirtualBox Download page and find the latest version; click on it.● On the next
    page, look for the file that ends .exe and download it – remember the location
    you saved it on your computer.● Once the installer has been downloaded, double-click
    the .exe file and follow the instructions on the screen to install it onto Windows
    – be aware that you may lose your network connection for a while during the installation
    because virtual network adaptors are being installed.● Now you must reboot your
    computer, and you should find VirtualBox in your apps.From here, you can run it
    and install any other operating system that you want to try.Mac OS● Go to the
    VirtualBox download page and download the latest version of the app for the Mac.●
    Save the .dmg to a file location that you will easily remember – make sure you
    download the OS X hosts version.● Locate the file and install it using the executable
    file● Reboot your computer, and you can start using VirtualBox.Installing Linux
    Using an Image for Virtual Box WindowsAfter finishing the steps to install VirtualBox
    to your computer, you need to download the disk image for Ubuntu Linux.● First,
    if you haven''t already got a BitTorrent client installed on your computer, download
    one now – BitTorrent is a P2P application that allows downloads from other users,
    significantly easing the loading in the Ubuntu servers.● Now head to the Ubuntu
    release website and download the latest release version – do NOT click on Desktop
    CD''s links.● Now copy that to a bootable USBCaution here – if WinRAR is installed,
    it will automatically associate itself with the file you downloaded and will ask
    you if you want to use WinRAR to extract the contents – do NOT use WinRAR and
    do NOT extract the .iso.IMPORTANT – Before you start the next step, back up the
    contents of your hard drive somewhere safe! If you don''t, you will lose everything!●
    Open VirtualBox from your Start menu and click New – this will open the New Virtual
    Machine Wizard.● Click on Next and give your virtual machine a name – stick with
    Ubuntu or Linux for ease.● If you have more than 1 GB of RAM on your computer,
    allocate one-quarter maximum to the virtual machine – if you have less, stick
    with what VirtualBox recommends. Click Next.● Click on Create New Hard Disk and
    then on Next.● Click on Next again, and you will come to a screen where you set
    the type of hard drive. Choose Fixed-Size Storage.● If you intend to add software
    or to install potentially large files in virtual Linux, add on some buffer; click
    Create.● When the virtual hard drive has been created, you need to add the .iso
    image you downloaded. Click Settings>Storage>CD/DVD Device● Where it says Empty,
    there is a folder icon, so click on it.● Choose the .iso that you already downloaded
    and click on OK.● Now double-click on the virtual machine, so it starts.● You
    will get a load of instructions and warnings about using guest operating systems
    – read and then mark them, so they don''t come up again.● Wait while Ubuntu loads.●
    Before you can install Linux, you must first change your BIOS settings on your
    computer – usually, when you start your computer, you hit F1, F2, F12, Escape
    or Delete.● Restart your computer now and get into the BIOS settings and change
    the boot option to boot from USB first.● Now plug your USB stick in and reboot
    your computer again.● You will see a screen that is blank except for a few logos
    at the bottom.● Press any key, and a new screen will appear – choose the language
    you want● Now click on Install Ubuntu.● The installer will start, and you may
    be asked to choose your language again.● Tick the option for installing closed
    source software● Now you will be asked to connect to your Wi-Fi if you aren''t
    connected already – you don''t need to do this right now, and it will make your
    installation take longer, so ignore it.● There are three options here – choose
    the first one and then drag the slider to choose the hard drive sizes for Windows
    and Ubuntu.Your hard drive will now be partitioned.● Answer the questions that
    appear on your screen as they appear – these are self-explanatory.● Now you just
    wait for Ubuntu to be installed – depending on your computer''s speed, this can
    take up to one hour.● Reboot your computer and remove your USB stick – when you
    boot up again, you will be in a working Ubuntu environment.If you changed the
    size of your partition for Windows, you will be asked to do a disk check – this
    is not necessary.Go back to Settings>Storage>CD/DVD and check that it has the
    Empty entry again – this will eliminate the need to use your USB every time you
    boot your computer.Mac OSWhen the VirtualBox installation has been completed,
    you need to download the iso.● Go to the Ubuntu download page and click on the
    Mac .iso image – choose your geographical location and then clic Begin Download.●
    Make sure you save the file and not open or mount it.● Open VirtualBox and register
    it.● Now create a new virtual machine – click on New to open the wizard.● Click
    Next and type in a name for the virtual machine.● Choose Linux Ubuntu from the
    operating system menu and click on Next.● Set your base memory as 384 MB and click
    on Next.● Now you need to click to create a new hard disk, which is just a disk
    that takes up space on your existing drive – make sure you have enough to do this!●
    Accept all the default settings and click on Next.● The Create New Virtual Disk
    Wizard will appear. Click on Next● Click on Dynamically Expanding Storage and
    click on Next.● Choose where you want your hard drive to be and how big – 2 TB
    is the maximum, although 8 GB is more than sufficient.● Click on Next and then
    on Finish.● The framework is ready, so make sure you have copied the iso to a
    bootable USB or DVD.● VirtualBox will now show you that you have a virtual machine
    with the name of Ubuntu Linux.● Insert your DVD or USB.● Click on CD/DVD and then
    tick the box for Mount CD/DVD drive.● Click on ISO Image File.● Click the folder
    beside No Media and then drag your iso file into it.● Click on Select and then
    on OK.● Click on Start. A black screen will appear – this is the new session,
    and everything you do now will be done on the virtual machine – if you want to
    change that back to your Mac, just press the Command key on the left side of the
    space bar.● Click OK.● When the Ubuntu screen appears, double click on Install
    and answer the questions that appear on the screen.● When finished, click on Forward.●
    Now accept the default values for where Ubuntu is going and click on Forward.●
    Input your personal information, including a new password and a name for your
    machine.● Choose whether to log in automatically or use a password and click on
    Forward.● Click Install and wait.● When the installation has finished, you will
    either be asked to use your password to go in, or you will automatically be at
    the Linux desktop, depending on what option you chose● Ubuntu will now check for
    updates, so click on Install Updates and wait.● Reboot your Mac is needed, and
    you are ready to go.Steps of Installing CentOS from ScratchCentOS is a stable
    Linux distribution, and here''s how to install it:● Go to the download page for
    CentOS and download the ISO.● Now you need to make up a bootable drive, transferring
    the ISO to a formatted USB stick. To do this, plug your USB in and open a command
    prompt window.● Type the following in - # dd if=/iso/CentOS-versionnumber- x86_64-DVD-1602-99.iso
    of=/dev/sdb – ensure that you have a minimum 5 GB space on the USB stick● On the
    desktop, click on Install to Hard Drive.● Choose your keyboard type and preferred
    language – make sure you pick the right keyboard, or some of your keys will be
    scrambled up.● The installer''s default is to select Automatic Partitioning of
    your hard drive – click the icon for Installation Destination and change by selecting
    Custom Partitioning.● Choose your hard drive where the installation of CentOS
    is to be stored and then click on Other Storage Options.● Select the option giving
    you a chance to configure the partitioning by yourself, and then click on Done.●
    Select the Standard Partition.● To develop a Swap Space on one of your partitions,
    select File System where the swap space will be created and name it as swap.●
    Select Reformat.● Now you need to create your mount point –where to install the
    root partition.Set your mount point and then set Label and Desired Capacity in
    any way you desire.● Click on ext4 to set the file system and then on Reformat.●
    Click Done and accept the changes you have made.● Click the clock and set your
    time zone; click Done.● Click on Begin Installation; as it goes through, follow
    all the onscreen instructions, setting up your user account and the root password.●
    To do this, click Root Password and type in the password twice; click on Done.●
    To create your user account, input the details and, if this is going to be an
    administrator account, ensure that you tick the options for Make This User Administrator
    and on Require a Password.● When you complete the installation, a message telling
    you it was successful will appear; click on Quit.● Log out and then log in to
    your new CentOS installation.● Accept the EULA, and you are ready to go.Connecting
    Your Linux System over the NetworkIf you are looking to connect your Linux system
    over your network, you must use SSH.This is an acronym for Secure Shell, and it
    is one of the most well-known of the network protocols.The purpose of SSH is to
    let you connect securely to remote machines on your network.To connect your Linux
    system over your network:'
