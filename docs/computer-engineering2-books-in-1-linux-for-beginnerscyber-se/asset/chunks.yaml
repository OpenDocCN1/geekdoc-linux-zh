    hidden alley with no cameras and the back door. The doors that lead to the venue.
    They are unlocked, and there are no security or cameras around. Would you go through
    the door? That''s the concept behind a backdoor attack.How do backdoors even end
    up on our computers? Well, they can end up there intentionally by the manufacturer;
    this is built-in, so they can easily test out the bugs and quickly move in the
    applications as they are being tested.The back door can also be built by malware.
    The classic backdoor malware is the infamous Trojan. Trojan subtly sneaks up on
    our computer and opens the back door for the people using the malware. The malware
