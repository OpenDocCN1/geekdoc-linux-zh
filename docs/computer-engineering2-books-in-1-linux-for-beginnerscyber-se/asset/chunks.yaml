    ## 初学者 Linux

    针对完全初学者的实用指南，教你如何精通并发现高效使用 Linux 的惊喜技巧


    ### 序言

    许多怀疑者会迅速否定 Linux，将其与 `Windows` 和 `MacOS` 等更大、更有影响力的系统相比较，说它更慢、更丑。他们还喜欢说它不友好，即使对于那些编程能力最强的人也很用。虽然
    Linux 在视觉吸引力和易用性方面确实逊于许多其他系统，但事实是 Linux 的初衷并非如此。虽然许多其他操作系统用华丽的选择和应用程序让你眼目，但 Linux
    选择保持简单的方法，并以最简洁的方式交付结果。Linux 的诞生是为了让人们相对容易地学习更高级的编程领域，多年来一直为此工作。Linux 与其他操作系统的不同之处在于它在许多方面都是真正独特的。这是一项全社区的努力，因此没有想要利用他人汗水获利的掠夺者。每个人随心所欲，我们都拥有相同的可用资源。让你的
    Linux 系统与其他任何系统不同的是你如何选择使用它。虽然有点难精通，但精通任何事情都需要努力和奉献。维护系统也不是问题。用于这些命令都非常直观且准确，这意味着在维护方面，即使是巨大的服务器系统，你也很少专业人士的帮助。对于
    Linux，真的没有什么坏处是不会被其他优点抵消的。随着 Linux 取得稳步进展，它开始成为由知名公司制造的操作系统的激烈竞争对手。


    ### 第一章：历史与背景

    Linux 一术指的是由`林纳斯·托瓦兹`（Linus Torvalds）以及其他几位贡献者开发的`内核`或操作系统。它首次公开发布是在 1991 年 9
    月。在微软向消费者收取 `Windows` 等操作系统费用的世界里，Linux 的优势在于它是开源软件，这意味着程序员有权对其进行自定义，基于它创建自己的操作系统，并根据其需求使用。Linux
    操作系统的代码大部分用 `C` 编程语言编写。今天有数百个使用 Linux `kernel` 的操作系统，其中最流行的是 `Ubuntu`、`Debian`、`Fedora`
    和 `Knoppix`。这并不是列表的结尾，几乎每年都会出现使用原始 Linux 系统内核的新操作系统。Linux 是计算和技术领域的一个里程碑，如今 Linux
    驱动着大多数手机手机、Web 服务器、个人电脑、云服务器和超级计算机。Linux 系统管理员的职位描述是指维护基于 Linux 的系统的运行并确保系统具有最大的运行时间，简而言之，就是确保系统以最优化的方式被使用。在现代世界中，你的大多数设备运行在
    Linux 驱动的服务器上，或以某种方式与 Linux 系统关联，因为其高稳定性和开源特性。由于由于，Linux 管理员的工作围绕着以下内容：


    * Linux 文件系统

    * 使用 `Bash` Shell 通过名为 `Root` 的命令行界面管理 Linux 系统上的超级用户

    * 管理用户、文件和目录

    '
- fmt: '

    You can think of it as maintaining your own personal computer, which you would
    do at home, but on a larger scale. In this case, for an entire organization. Linux
    system administration is a critical requirement for organizations in the modern
    world and, therefore, there is a huge demand in the market for this profile. The
    job description may vary from one organization to another, but the fundamentals
    of Linux Administration remain the same for every organization.


    The following responsibilities are associated with the profile of a system administrator:


    - Maintaining regular backups of the data of all users on the system.

    - Analyzing logs for errors to continuously improve the system.

    - Maintaining and enhancing the existing tools for users of the system and the
    `Linux` environment.

    - Detecting problems and solving them, which range from user login issues to disaster
    recovery.

    - Troubleshooting other problems in the system.

    '
