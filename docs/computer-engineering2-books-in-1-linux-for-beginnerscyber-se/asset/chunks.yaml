    - **引导程序 (Bootloader)**：这是负责管理计算机启动过程的软件。对于大多数用户来说，它就是首次启动进入操作系统时弹出的启动界面，随后该界面会消失。

    - **内核 (Kernel)**：这是整个 Linux 的一个组成部分。它是我们系统的核心，负责管理内存、外设设备和 CPU。内核是我们操作系统中所处于底层的层次。

    - **初始化系统 (Init system)**：这是引导用户空间启动的子系统之一，并控制守护进程（daemons）。其中最广泛使用的系统之一是 `systemd`，它有时也被认为是最具争议的。一旦初始启动阶段从我们使用的初始引导程序处移交接，将由该系统负责启动操作系统。

    - **守护进程 (Daemons)**：这些是一些后台服务。它们可能包括调度、声音和打印选项，但你可以根据需要对其进行调整。它们会在系统启动时启动，或者在你有机会登录桌面后启动。

    - **外壳 (Shell)**：你可能也听过很多次这个词，或者叫 Linux 命令行，它曾让许多人望 Linux 而却步（也许是因为他们认为必须学习一些枯燥的命令行结构才能使用该操作系统）。Shell
    是一个命令进程，允许你通过在文本界面输入命令来控制计算机。今天，你甚至可以在不接触命令行的情况下操作 Linux，但正如我们很快看到的，学会使用它也是非常重要的。

    - **图形服务器 (Graphical server)**：这是一个在显示器上显示你想看到的所有不同图形的子系统。它被称为 `X` 或 `x server`。

    - **桌面环境 (Desktop environment)**：这是你实际花费时间交互的操作系统部分。它是“桌面”这一比喻的具体实现，由运行在操作系统可见表面的程序组成，你可以直接与其进行交互。


    这种环境有很多选项供我们选择，包括 `Cinnamon`、`Xfce`、`gnome`、`utility`、`Pantheon`、`Enlightenment`
    等。每个环境都会包含一些你需要的内置应用程序，包括游戏、网络浏览器、配置工具、文件管理器等。


    - **应用程序 (Applications)**：你选择的桌面环境并不会提供许多供你选择的应用程序。


