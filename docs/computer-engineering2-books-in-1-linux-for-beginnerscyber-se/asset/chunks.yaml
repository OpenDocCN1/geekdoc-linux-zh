    你可以将其比为维护你自己的个人计算机，这就像你在家里做的那样，但规模更大。在这种情况下，它是针对整个组织的。Linux 系统管理是现代世界各组织的一项关键需求，因此市场对这一职位的人才有巨大的需求。职位描述可能因组织而异，但
    Linux 管理的基础基础知识对于每个组织来说都是相同的。


    系统管理员的职位通常与以下职责相关：


    -   维护系统上所有用户数据的定期备份。

    -   分析日志中的错误以持续改进系统。

    -   维护并增强供系统用户和 `Linux` 环境使用的现有工具。

    -   检测并解决问题，范围从用户登录问题到灾难恢复不等。

    -   排除系统中其他问题的故障。

    '
- fmt: '

    Perhaps the most important skill to be found in a system admin is performing under
    a lot of load and stress. A system admin usually works a seven day week wherein
    they are on call two days a week and has to come online as soon as there is an
    issue with the system and must be quick to resolve it so that the system goes
    online immediately. If kept down for a long time, a system or a server can lead
    to losses worth thousands of dollars for an organization. For example, take the
    website of the shopping giant Amazon. If Amazon’s website went down even for one
    hour, all sales would suffer, leading to huge revenue losses. This is where a
    system admin steps in and saves the day. A system admin''s role is nothing short
    of a superhero who saves an organization whenever the need arises.


    Originally, Linux was developed merely as a hobby project by a programmer known
    as Linus Torvalds in the early 1990s while at the University of Helsinki in Finland.
    The project was inspired by a small Unix (an operating system) system called Minix
    developed by professor Andy Tanenbaum who used the Unix code to teach students
    of that university about operating systems. At that time, Unix was only used in
    universities for academic purposes. The professor developed Minix (a little clone
    of Unix) to effectively teach his students about operating systems with a bit
    more depth. Linus was inspired by Minix and developed his own clone, which he
    named Linux.


    On 5th October 1991, version 0.02- which was the first version of Linux, was announced
    by Linus. While this version was able to run the Bourne shell (`bash`)—the command
    line interface—and a compiler called `GCC`, there wasn''t much else to it. Version
    0.03 was released sometime later, and then the version number was bumped up to
    0.10, as more people began embracing the software. After a couple more revisions,
    Linus released version 0.95 in March 1992 as a way of reflecting his expectation
    that the system was prepared for an ''official'' release real soon. About a year
    and a half later (December 1993), the version was finally made it to 1.0.


    Today, Linux is a total clone of Unix and has since reached a user base spanning
    industries and continents. The people who understand it see and appreciates its
    use in virtually everything- from cars to smartphones, home appliances like fridges,
    and supercomputers, this operating system is everywhere. Linux runs the largest
    part of the internet, the computers making all the scientific breakthroughs you
    hear about every other day and the world''s stock exchanges. As you appreciate
    its existence, don''t forget that this operating system was (and still is) the
    most secure, reliable, and hassle-free operating system available before it became
    the best platform to run servers, desktops, and embedded systems all over the
    globe. With that short history, I believe you are now ready for some information
    to get you up to speed on this marvelous platform.


    # UNIX Evolution


    In this section, we''ll be looking at Linux history. Now when it comes to Linux
    history, even before I speak about the beginning of Linux or how Linux evolved,
