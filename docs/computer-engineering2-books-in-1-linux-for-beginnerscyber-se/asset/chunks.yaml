    and use codes programmed by other people. The main requirement to know is how
    to work this code and adjust it to their advantage. For malicious hackers who
    can use it to steal passwords, secrets, identities, financial information, or
    create so much traffic, the targeted website needs to shut down.Stealing PasswordsPasswords
    are easy to hack because humans are very predictable. We think we are unique until
    it comes to passwords, but we are very easy to guess. For example, women will
    often use personal names for passwords—think kids, relatives, old flings—while
    men will stick to hobbies. The numbers we use most frequently are 1 and 2, and
    they are most often placed at the end of our password. More often than not, we
    use one word followed by some number, and if the website insists on including
    a capital letter, we place it at the beginning of the word and then whine about
    how this website is so annoying for making us go through all of this.But how do
    hackers access our passwords? Well, there are several useful techniques.The trial
    and error technique is called the brute force attack, and it is when you try possible
    combinations of letters and words to try and guess the right password. This can
    work because, as previously mentioned, we are very predictable when it comes to
    the type of passwords we use.Another similar technique is called the dictionary
    attack; hackers use a file containing all the words found in the dictionary, and
    the program tries them all. This is why it is often suggested to add numbers to
    your passwords as words, but this doesn''t mean your "sunshine22" password is
    hackerproof.A third technique is the rainbow table attack. The passwords in your
    computer system are hashed (generated into a value or values from a string of
    text using a mathematical function) in encryption. Whenever a user enters a password,
    it is compared to an already stored value, and if those match, you can enter into
    the website or application. Since more text can produce the same value, it doesn''t
    matter what letters we input as long as the encryption is the same. Think of it
    as a door and a key. You enter the doors with the key made for that lock, but
    if you''re skilled at lock picking or a locksmith, you don''t need that exact
    key to enter.How to Protect Yourself from Password AttacksUse the salt technique.
    This refers to adding simple random data to the input of a hash function. The
    process of combining a password with a salt, which we then hash, is called salting.
    For example, a password can be "sunshine22", but adding the salt is e34f8 (combining
    sunshine22 with e34f8) makes your hash-stored, new salted password "sunshine22e34f8."
    The new salted password is thus hashed into the system and saved into the database.Adding
    the salt just lowered the probability that the hash value will be found in any
    pre-calculated table. If you are a website owner, adding salt to each user''s
    password creates a much more complicated and costly operation for hackers. They
    need to generate a pre-calculated table for each salted password individually,
    making the process tedious and slow.Even with the salt technique, determined hackers
    can pass through the "password salting." Another useful technique is the peppering
    technique. Just like salt, pepper is a unique value. Pepper is different than
    salt because salt is unique for each user, but pepper is for everyone in the database.
    Pepper is not stored in the database; it''s a secret value. Pepper means adding
    another extra value for storing passwords.For example, let''s say the pepper is
    the letter R. If the stored password is "sunshine22," the hash stored will be
    the hashed product of "sunshine22" with the added letter R. When the user logs,
    in the password they are giving is still "sunshine22," but the added pepper is
    storing "sunshine22" with the added R. The user has no knowledge that pepper is
    being used. The website will then cycle through every possible combination of
    peppers, and by taking upper and lowercase letters, there will be over 50 new
    combinations. The website will try hashing "sunshine22A," "sunshine22B," and so
    on until it reaches "sunshine22R." If one of the hashes matches the stored hash,
    then the user is allowed to log in. The whole point is that the pepper is not
    stored, so if the hacker wants to crack the password with a rainbow table or dictionary
    attack, it will take them over 50 times longer to crack a single password.Phishing
    AttacksThe easiest way to get someone''s password is to ask them. After all, why
