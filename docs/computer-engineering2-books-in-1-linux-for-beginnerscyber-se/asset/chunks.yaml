    # 中小型企业的电子安全防护


    当一个组织的命运完全取决于保护其电子资产的安全时，其实际风险更高。如果说网络革命的初衷在于其先进的思想，那么商界人士就需要遵循这门科学。网络帮助他们降低了成本、加速了创新、利用了全球劳动力，并大幅提高了利润率。


    当第一次网络攻击袭击一家公司的电脑时，蜜月期便戛然而止。随后，另一家类似的企业遭遇了袭击。此后，每年发生的袭击次数日益增加。如今，企业已经意识到，一个不受保护的电子社区可能会通过多种手段对其组织造成难以想象的破坏，包括：


    - 泄露客户的机密信息并将其发布到网上

    - 在短短几分钟内删除公司一年的信息

    - 损害公司的电子产品，造成将扼杀其利润率的停滞

    - 让公司的电脑执行意愿之外的任务并发生故障

    - 损害公司的声誉，导致投资者和客户不愿再次信任他们

