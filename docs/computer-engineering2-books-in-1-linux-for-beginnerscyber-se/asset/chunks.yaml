    深入网络安全专家领域。正是这些个人和职业层面的复杂情况导致了对网络安全专家的需求。这些人员的任务是学习电子网络以寻找可能提供访问权限的弱点（这些漏洞对黑客和恶意软件来说非常容易），并开发更强大的技术，以便在这些网络上安全地传输加密信息。随着在线黑客变得更加大胆且装备更精良，长期来看，对网络安全行业专家的需求将会增加。


    # 第十八章：网络安全就绪


    ## 指导与意识

    首先，至关重要的是网络安全风格必须成为每个组织讨论的元素，从员工餐厅到会议室。通常，通过不断将网络安全置于脑海中，可以使其成为决策过程、基础设施投资以及监管和治理需求的一部分。


    此外，由于人员本身可能通过社会工程成为攻击向量，组织内的每个人都将逐渐承担起确保执行最佳网络安全策略的责任。这需要对员工进行教育，并在新威胁出现时定期更新相关知识。事实上，网络安全与医疗保健之间存在相似之处——所有人都需要某种程度的网络安全培训。


    最后，具备知识的网络安全专业人士，或者 IT 和管理部门关键人员的合格导师，应当成为每个网络安全就绪的一部分。


    ## 准备与规划

    网络安全事件不是“是否”发生，而是“何时”发生，因此，准备工作至关重要。这可能包括管理技术、最佳流程政策、IT 审计，以及负责网络安全运营的专门人员。良好的网络安全就绪要求理解与其人员和组织相关的资产及风险威胁，每天监控并检测网络安全威胁，保护关键系统和信息，确保组织履行几乎所有相关的标准合规要求，在发生漏洞时有应急响应计划，然后有明显的业务连续性模型以最大限度地减少损失。


    通常，上述许多职责需要由 `CISO`（首席信息安全官）或同等人员负责，尽管其他各种利益相关者（例如高层领导、法律和口才人员以及公共关系部门）也可能在事件发生时需要做好准备。


    ## 检测与恢复

    当违规发生时，识别和响应的速度越快，减少损失的可能性就越高——无论是财务、声誉还是可能的其他方面。你的小企业识别和响应信息盗窃或重要服务禁用的速度应该有多快？受影响的服务器或工作站应该多快被隔离以进行取证分析？丢失或损坏的信息应该多快且多容易地恢复？应急响应计划是什么，必须立即通知的利益相关者是谁？


    重要的是，日志的维护和评估有助于确定违规发生的方式，并因此确定如何修复，可以作为康复操作的一部分。仅仅堵住漏洞是不够的；理解违规是如何发生的可能导致阻止若干其他类似的违规事件。


    ## 共享与协作

    正如我们在本指南中回顾的那样，能量对于缓解当前和未来的风险至关重要。与政府和行业共享你的违规分析结果，可以防止已建立的攻击向量打击各种组织。


    反之，你的成员可能准备通过从其他组织共享的漏洞中学习来防止被利用。此外，可以考虑注册或向 `ISAC`（信息共享与分析中心，`www.nationalisacs.org`）提供信息，前提是你的市场有相应的机构。


    在某些情况下，你的组织可能受法律规定限制报告事件。至少，应该向当局或如 `AusCERT`（`www.auscert.org.au`）以及澳大利亚网络安全中心报告违规。


    ## 伦理与认证

    伦理和认证最初可能看起来帮助不那么大的支柱，尽管“白帽”黑客与“黑帽”黑客之间的巨大在于心态。在任何业务或组织中，伦理都起着作用，并适用于特定的网络安全问题。虽然某些行业（如国防）极可能有自己的策略来审查资格，但对于
    ICT 这样一个多元化且高技能的行业，如果专家能够通过资深机构的会员身份证明其遵守伦理准则，将会有很大帮助。


    许多专业组织维持其人员遵循标准，以确保维护职业的地位和声誉。例如，`ACS` 有一份所有认证专业人士必须遵守的伦理准则，此外其他要求，如展示持续的个人成长以及在所选专业领域拥有学位。


    ## 网络安全专业人士的三项关键技能

    有效的 IT 保护专家需要的不仅仅是专业能力。要在这个领域真正取得进步，这些专业人士应该是：


    *   **战略家**：网络安全专业人员除了组织内部调整，还将准备主动使用安全措施，权衡任何行动的后果。卓越的安全协议需要对工作流、依赖关系、预算和资源进行战术和战略评估。由于破解信息的全新方法不断发展中，专家必须向前，学习在线黑客如何进入网络以及阻止它们的程序。

    *   **沟通者**：除了沟通技能，管理能力还需要确保与团队和客户之间的良好协作——技术和安全涉及业务中的每位专家。保护专家必须以大量方式进行互动，通过教学和赋能人员来协助制定保护策略。

    *   **终身学习者**：另一个具备的能力是专业能力。随着保护领域的发展，这意味着需要研究：学习、教育和持续的通用认证。这些专业人士必须不断学习新的变革性技术技能，以解决复杂安全问题的能力。


    ## 结论


