  raw: 'Chapter Thirteen:Improving Your SecuritySecuring a Wireless NetworkPeople
    must learn how to protect their wireless networks to ensure their confidential
    information does not fall into the wrong hands. This chapter will give a brief
    introduction to securing a personal wireless network and how to do it. For most
    of the examples, NETGEAR routers will be used. If users have a different router,
    keep in mind that some things will be different.EncryptionLet us begin by discussing
    basic encryption. When regarding data movement over a network, Encryption is the
    process by which plaintext is converted into a scrambled mixture of characters.
    This decreases the probability that the information sent over an encrypted network
    is being used for malicious purposes. As for encryption regarding wireless routers,
    it is the process by which an encrypted authentication key is produced every time
    the correct login credentials are entered, allowing access to the network. In
    simpler terms, every time a user logs in to a secured router, a unique key is
    generated, which allows access to that internet connection.WPAWi-Fi Protected
    Access or WPA is a security tool that was developed to replace WEP security. There
    are two types: WPA and WPA2\. The difference is that WPA2 is a newer, more secure
    version of WPA. Anytime users have to log in to a wireless network, whether at
    their house or school, they are most likely, logging into a WPA/WPA2 encrypted
    network. These security features work by checking whether or not the login credentials
    entered are accurate, and if they are, an encrypted authentication key unique
    to that very login is generated. Once this key is generated, it is checked by
    the corresponding network, allowing the transmission of data to start, assuming
    the login credentials were a match. Now that we have seen the basics of WPA encryption,
    we will discuss some basic steps that can be taken to secure personal wireless
    networks.Wireless Router CredentialsWhen a wireless router is first set up, the
    default login credentials must be changed. Most personal wireless routers come
    with a standard login username and password such as:Username: adminPassword: passwordHackers
    know these default login credentials, meaning they must be changed right away.
    Using a lengthy password with a combination of both upper and lower cases will
    give users reliably secure credentials.Service Set IdentifierA Service Set Identifier
    (SSID) refers to the computer language for a wireless network name. For example,
    the University of Arizona''s wireless network is known as ''UAWifi.'' It is important
    to change the name of a personal network from the default, as hackers may target
    a wireless network with a default name, thinking it is less secure. To further
    improve security, SSID broadcasting can be turned off. This means that the network
    will not be visible to outsiders. It will still be there, and if the specific
    SSID is searched for, it can be found. However, anyone scanning for a network
    to connect to won''t see this hidden network. This is especially useful when you
    have neighbors who are trying to gain access to your personal network.Media Access
    ControlMedia Access Control (MAC) is a set of numbers used to identify a specific
    device. Whether it''s a computer, tablet, or phone, every device has a unique
    MAC address. To better protect a network, the router can only allow specific MAC
    addresses to connect to that network. This adds another layer of security to your
    network by only permitting specific devices to connect. While this is a useful
    security feature, it is important to at least mention that there are software
    programs available that allow hackers to fake MAC addresses, allowing them to
    pretend to be the same device on your network.The last tip we have for securing
    a router is the most effective method of keeping personal networks secure: turn
    the router off. If you''re going on vacation or you simply won''t be using their
    network for an extended period, turning off the router is the best way to avoid
    hackers from getting into the network. They cannot access something that is not
    powered on and transmitting data.Securing Mobile DevicesThis chapter will explain
    the security risks mobile devices face and how to better protect your data on
    mobile phones or tablets.Security RisksThere are three main security risks for
    mobile devices: physical theft, internet theft, and application permissions.Physical
    theft: The physical theft of a device can allow a person to access the device
    and snoop through all personal information stored. That could be anything from
    passwords, text messages, photos, emails, and so on.Internet theft: This applies
    to any data stolen or seen while browsing the internet on a mobile device, whether
    on a wireless network or a mobile carrier service.Application permissions: This
    is probably the biggest security threat to mobile device owners for one simple
    reason. People do not read what permissions an application has when downloading
    the app. Business Insider published a recent study that found that in 2017, 90%
    of consumers accepted legal terms and conditions without reading through them.
    This is where the security risks come into play.The BasicsListed below are six
    methods that can be used to better protect mobile device security. These are up-to-date
    operating systems, app privileges, geo-tracking awareness, lock screens, Wi-Fi
    or Bluetooth safety, and internet browsing.Operating SystemsAn operating system
    is the basis of a mobile device that manages all networks and Software. For example,
    Apple uses iOS, while Android uses Android OS. Maintaining up-to-date software
    for all types of mobile operating systems aid in keeping a mobile device safer.
    As the developers of these operating systems learn of security flaws, they are
    patched, and an update is sent worldwide. This is one of the easiest methods to
    protect yourself from upcoming malicious Software or security weaknesses.ApplicationsWe
    all love apps, whether they come from the Apple Store or the Google Play Store,
    but most people do not know the information these apps can access via a user''s
    mobile phone. Most people never bother to read the fine print when they download
    the new Candy Crush game or update their Instagram app. Therefore, phones are
    incredibly easy targets for hackers.Many applications request far too much data
    from a phone, which may not even be related to the app''s actual purpose. For
    example, in Candy Crush''s license agreement under section 10, it states that
    the developers may use any personal data collected in any way that follows their
    privacy policy. They also state that if users link their account to a social media
    site, they will use personal data available from those sites to identify the user.Geo-trackingMost
    mobile device users have absolutely no idea how frequently their locations are
    being pinged and stored in a company''s servers. Many free applications available
    for download in the Apple Store or Google Play Store are not actually free. There
    is a growing trend among app developers to collect your location using your phone
    or tablet''s GPS, known as geo-tracking. This information is gathered in huge
    quantities and is bought by large business entities who utilize this data to study
    and accurately predict consumer behavior.Advertisers are always looking for new
    ways to capture your attention so that you will buy their product. If an app developer
    collects GPS locations from an individual daily, they could look at it and say,
    "Wow, this person seems to drive by a certain store every day." This app developer
    then takes this information and sells it to the store that the individual in question
    drives by every day to be targeted with advertisements. These advertisements could
    come in the form of emails or spam text messages. How can these stores know how
    to direct ads at specific individuals? The answer to this is that more than just
    the individual''s location data can be used for marketing. This app developer
    could have permission to gain access to the phone''s personal information like
    contacts, emails, etc. This allows the app developer to sell an individual''s
    daily transit routes and the information needed for advertisers to reach them
    specifically.PasswordsThis is one of the easiest methods for protecting data on
    a mobile phone. A simple lock screen password can prevent someone from gaining
    access to your phone or tablet if it is stolen. Think about all the applications,
    text messages, emails, and photos on a person''s phone or tablet. Then think about
    someone being able to access all that information without even needing a password.Wi-Fi
    SafetyTo avoid hackers seeing information sent from a user''s mobile device, the
    user needs to be careful when using Wi-Fi. According to Lawyers'' Professional
    Indemnity Company (LAWPRO), here are some tips on how you can do this:1.      First
    and foremost, only use wireless networks that are known and trusted. Avoid public
    wireless networks altogether if possible. Public networks are usually not secure,
    making it easy for someone on the same network to pick up the information you
    sent.2.      If using a public network is a must, login to a Virtual Private Network
    (VPN) to secure the data you are transmitting. A VPN works by sending encrypted
    data through a tunnel that is safe from being accessed by anyone on the same network.3.      Make
    sure the network being used is running some form of WPA encryption. Most home
    company networks run WPA2 encryption, unlike public networks, which have no security
    at all.4.      If you''re connected to a network that isn''t your own, make sure
    that the device sharing settings are turned off to avoid unknown devices from
    connecting with yours. This creates a link between devices designed to share data
    easier. However, this is also an effortless way for a hacker to connect to the
    user''s device.Bluetooth Safety1.       Most Bluetooth capable devices are shipped
    by the manufacturer in unprotected mode. Also known as ''discovery mode.'' This
    mode allows the device to be seen by others, making it easier to connect with.2.      If
    you are not using your Bluetooth, make sure to turn it off to avoid any connections
    to other unwanted devices. Turning your Bluetooth off when it''s not in use eliminates
    all chances of an attacker''s device connecting to yours.3.      If possible,
    change your device settings, requiring user confirmation before it pairs with
    another device. This eliminates the possibility of another device secretly connecting.4.      Do
    not connect to unknown devices. Only pair with devices that are known and trusted.5.      The
    maximum range of Bluetooth connections can differ based on the device''s power,
    and by setting the range to the lowest possible setting, the risk of an attacker
    reaching the device is reduced.Internet BrowsingInternet browsing can still be
    dangerous, even on an iPad. Here are a few dos and don''ts from the McAfee Security
    Advice Center when it comes to surfing the web on a mobile device:1.       Install
    antivirus software, if possible, to run scans on any downloaded content on your
    device.2.      Always look at the URL of the web pages you visit. Make sure that
    you check the https security feature.3.      Fake websites tend to have some errors
    ranging from the page''s overall look to improper grammar.4.      If the URL of
    the website you wanted to visit is known, enter it directly to avoid any possible
    fake copies of the website.5.      Avoid clicking on advertisements, as these
    can lead to malicious websites designed to install dangerous software on your
    device.Chapter Fourteen:Enhancing Physical SecurityEarly Detection is the Game
    ChangerThe Study on Global Megatrends in Cybersecurity, sponsored by Raytheon
    and independently conducted by Ponemon Institute, provides new insights into the
    most critical cyber-threat trends emerging over the next three years through the
    eyes of those on the frontline of cybersecurity.1More than 1,110 senior information-technology
    practitioners around the world were surveyed.The study revealed key insights and
    predictions from the expert practitioners for the next three years, such as Cyber
    extortion and data breaches impacting shareholder value would increase.67 percent
    said the risk of cyber extortion, such as ransomware, will increase in frequency
    and payout. 60 percent predicted state-sponsored attacks would become even worse.Only
    41 percent said their organization would be able to minimize Internet of Things
    (IoT) risks.The frequency of cyber extortion, nation-state attacks, and attacks
    against industrial controls was predicted to increase by double-digits.19 percent
    said cyber extortion is widespread today, while 42 percent said this threat would
    be frequent over the next three years.26 percent said nation-state attacks are
    persistent today, while 45 percent said this would be very frequent over the next
    three years.40 percent said attacks against industrial controls and supervisory
    control and data acquisition (SCADA) systems are frequent today, while 54 percent
    said this would be very frequent over the next three years.The loss or theft of
    data from unsecured Internet of Things (IoT) devices is likely to happen and is
    a significant cybersecurity challenge.82 percent said it is very likely, likely,
    or somewhat likely that their organization will have a loss or theft of data caused
    by an unsecured IoT device or application.80 percent said the likelihood of a
    security incident related to an unsecured IoT device or application could be catastrophic.In
    summary, Raytheon and Ponemon Institute’s Study on Global Megatrends in Cybersecurity
    provides several predictions from cybersecurity practitioners worldwide, who are
    on the frontline defense against cyber attackers daily. Among them, over the next
    three years, even with all of the increased spending on cybersecurity:Cyber extortion
    and data breaches will greatly increase in frequency. This trend will largely
    be driven by sophisticated state-sponsored cyber attackers or organized groups.IoT
    devices, in particular, are very susceptible and will be targets that will be
    exploited.So, it is not a question of IF, but WHEN the cyber attackers will break-in.
    And when the cyber attackers break-in, they will remain undetected for many months.The
    median or mean number of days the cyber attackers remain undetected varies based
    on the source. Examples are:Mandiant’s M-Trends Report;Verizon’s Data Breach Investigations
    Report;IBM and Ponemon Institute’s Cost of a Data Breach Study.One thing is certain,
    however. The cyber attackers can hide for many months, and the longer it takes
    to detect the cyber attackers, the more the cost the organization ends up suffering.Based
    on research into dozens and dozens of cases, I have identified signals in the
    Cyber Attack Chain that every organization should understand and look for.When
    researching the cases, it became evident that in each case, the cyber attackers
    took steps that fit into one of the steps as I have outlined in the Cyber Attack
    Chain. It was also clear that there were signals of the cyber attackers at work
    in each step, but the organization did not detect these signals.It is time for
    every organization to understand what the Cyber Attack Signals are and implement
    them as part of their cybersecurity program. By doing so, they will transform
    the defense into offense and detect the cyber attackers early.A Cyber Attack Signal
    is a high-probability signal of cyber attackers at work, trying to hide and avoid
    detection while performing one of the Cyber Attack Chain tasks. They are at work
    to accomplish their ultimate objective—the theft of data or intellectual property
    (IP) or another compromise, harm, or disruption. A Cyber Attack Signal focuses
    on cyber attackers’ behavior.I have identified 15 Cyber Attack Signals that, as
    a minimum, every organization should focus its monitoring on. These Top 15 signals
    relate to cyber attackers’ behavior. They are timely signals before the cyberattack
    is executed, occurring at the intrusion, lateral movement, or command and control
    steps of the Cyber Attack Chain. Therefore, they are of the greatest value.This
    is not an exhaustive list, and there will probably be other signals relevant to
    an organization based on its risk profile and its Crown Jewels that may indicate
    the cyber attackers at work. As such, each organization should tailor its list
    of Cyber Attack Signals for monitoring.IntrusionPatch windowThis is when a vulnerability
    remains unpatched and how attackers could exploit it, providing an alert about
    Crown Jewels possibly impacted, probable attack timeline, and expected attacker
    behavior.Web shellThis is the attempted installation or installation of a web
    shell to a web server. It would exploit server or application vulnerabilities
    or configuration weaknesses to intrude.Lateral movementAbnormal logonsThese are
    anomalies in logons compared to normal logon patterns.Privileged users’ behaviorThese
    are anomalies in privileged users (users with greater access levels and capabilities)
    compared to normal behavior.WMI anomaliesThis is an abnormal activity with Windows
    Management Instrumentation (WMI), a set of tools for system administrators to
    manage Windows systems locally and remotely.Internal reconnaissance signalsThese
    are anomalies in scripts or batch scripts running on email, web, file servers
    or domain controller or hosts, or scanning servers and ports.Malware signalsThese
    are anomalies from normal behavior patterns in terms of users, files, processes,
    tasks, sources, and destinations to indicate initial malware installation or propagation.Ransomware
    signalsThis is anomalous activity to indicate initial ransomware installation
    or propagation, such as the installation of new.dll file or attempted communication
    with a TOR website (i.e., server on the TOR network, a service used to provide
    anonymity over the Internet.)Malicious PowerShellThis is an abnormal activity
    with PowerShell, a scripting language for system administrators to automate tasks,
    such as odd characters (e.g., + ‘$ %) added in the scripts, use of “powershell.exe”
    by abnormal users at unusual times or locations, or scripts containing command
    parameters.RDP signalsThese are anomalies with Remote Desktop Protocol (RDP),
    enabling a user (e.g., as help-desk staff) to use a graphical interface to connect
    to another computer in a network as abnormal RDP users, source or destination
    logons.SMB anomaliesThese are anomalies with Server Message Block (SMB), a Microsoft
    Windows protocol that enables remotely managing files, file sharing, printing,
    and directory share, among other functions in a network.Unusual logs behaviorThese
    are anomalies in event logs, such as event logs removed, stopped, or cleared with
    details (user details, date, time, type of log, the command executed, asset impacted,
    source, and destination).Command and controlC&C communicationsThis is anomalous
    activity indicating attempted communication or communications with a command and
    control (C&C) server, such as a request to an unusual domain name or a one-off
    domain name, a request to the numeric IP address as the domain name for the host,
    requests to certain IP addresses or hosts with a certain frequency (hourly, daily
    or other).ICMP packetsThese are anomalies with Internet Control Message Protocol
    (ICMP) packets, such as abnormal size, frequency, source, or destination.Hidden
    tunnelsThese are HTTP anomalies, HTTPS r DNS traffic compared to normal baseline
    patterns indicating communications with a C&C server using a tunnel designed to
    blend in with normal traffic.Chapter Fifteen:Ethical HackingWhen it comes to security,
    being a hacker is one of the most commonly used terms. It appears everywhere,
    and even the entertainment industry and many authors often use it in their movies,
    books, TV shows, and other media forms. Therefore, the word "hacker" is usually
    seen as a bad profession and always associated with dark or real criminal activity.
    When people hear that someone is involved in hacking, they immediately see that
    person as someone who has no good intentions. They are usually presented as "operators
    from the shadows," even antisocial. On the other hand, they are also seen as a
    social activist. This label became especially popular after a few things like
    WikiLeaks. Many hackers were involved in obtaining many important documents from
    governments, politicians, and companies that showed very different information
    from the information given to the public. Organized groups such as Anonymous or
    Lizard Squad have also had a huge impact on the hacking experience in recent years.Examples:
    Mischief or Criminal?Hacking is by no means a phenomenon that has appeared overnight.
    It existed in various forms and evolved all the way from the 1960s. However, it
    was never tackled as a criminal activity at first. We''ll look at some cases that
    will take a closer look at some of the attacks and generic examples that have
    gradually changed that picture.Accessing services or resources that you do not
    have permission to use is usually called stealing usernames and passwords. In
    some cases, obtaining this information without permission is considered a cybercrime,
    even if you do not use it or as accounts of friends or family members.There is
    a form of a digital offense called network intrusion that is also considered a
    cybercrime. In essence, as with ordinary offenses, this means that you went somewhere
    without permission to enter (or in this case, access). So, if someone gets access
    to a system or group of systems without permission, we can say that the person
    violated the network and thereby committed cybercrime.However, some network intrusions
    can take place without using hacker tools. Sometimes logging into guest accounts
    without prior permission can be seen as cybercrime.One of the most complex yet
    simplest forms of hacking is to go after the most vulnerable element in the system––people.
    This type of cybercrime is known as social engineering, and we say it can be simple
    because the person is a much more accessible part of the system than any other,
    and it''s easier to deal with. However, people can provide clues that are difficult
    to understand, whether spoken or not, making it difficult for the hacker to get
    the information they need.The issue of posting or sending illegal material has
    generally become difficult to address, especially in the past decade. Social media
    received a lot of attention, and many other internet-related services increased
    in use and popularity. This allowed many illegal materials to move from one place
    to another in the shortest possible time, allowing it to spread very quickly.Fraud
    is also common, especially on the internet, and is also considered a cybercrime.
    Like the original term, fraud in cyberspace also means that a party or parties
    have usually been misled for financial gain or harm.What Does it Mean to Be an
    Ethical Hacker?All the things we mentioned earlier in this chapter referred to
    hackers in general. However, the real goal is to learn how to be an ethical hacker
    and explore the skills you should have.Ethical hackers are people who are usually
    employed by organizations to test their security. They usually work through direct
    employment or temporary contracts. The key is that they use the same skills as
    all other hackers, but there is one big difference: they can attack the system
    directly from the system owner. Besides, an ethical hacker means that you reveal
    the weaknesses of the system you have evaluated (because every system in the world
    has them) only to the owner and no one else. Also, organizations or individuals
    hiring ethical hackers use stringent contracts that specify which parts of the
    system are authorized for an attack and which are prohibited. An ethical hacker''s
    role also depends on the job to which he or she is entitled, i.e., the needs of
    the employer. Today, some organizations have permanent staff teams, and their
    job is to conduct ethical hacking activities.Hackers can be divided into 5 categories.
    Keep in mind that this format may vary, but we can say these are the most common:The
    first category is also referred to as "Script Kiddies." These hackers usually
    have no training or do but very limited. They know how to use just some of the
    basic hacking tools and techniques, and since they are not competent enough, they
    may sometimes not fully understand their activities or the consequences of their
    work.The second category concerns hackers known as "White Hat hackers." They attack
    the computer system, but they are the good guys, which means they don''t harm
    their work. These types of hackers are usually ethical hackers, but they can also
    be pen-testers."Gray Hat Hackers" are the third hacker category. As their name
    suggests, they are between good and bad, but their final decision is to choose
    the right side. Still, these types of hackers struggle to gain trust because they
    can be suspicious.The fourth category we mention in this section is referred to
    as the "Black Hat Hackers." This category refers to the hackers we mentioned earlier
    in this chapter. These people usually work on the ''other side'' of the law and
    are usually associated with criminal activities.Last but not least are the "Suicide
    hackers." They are called that because their goal is to prove the point, so they
    want to take out their target. These hackers don''t have to worry about getting
    caught because their goal is not to hide but to prove that they are easier to
    find.Responsibilities of an Ethical HackerThe most important thing that an ethical
    hacker should learn and never forget is that they should always have permission
    for any kind of system attack. The ethical code that you, as an ethical hacker,
    must implement in every task says that no network or system should be tested or
    targeted if you do not own it or if you do not have permission to do so. Otherwise,
    you may be found guilty of multiple crimes that may have occurred in the meantime.
    First, it can hurt your career, and second, if it''s something severe, it can
    even threaten your freedom.The smartest thing is to get a contract from your employer
    the moment you test or attack the required target. The contract is a written authorization,
    but you should keep in mind that you should only examine the parts of the system
    specified in that contract. So, if your employer wants to give you permission
    to hack additional parts of the system or remove authorization for some, he should
    first change the contract, and you shouldn''t continue working until you get the
    new permit. Note that the only thing that distinguishes an ethical hacker from
    a cybercriminal is the contract. Therefore, you should always pay special attention
    to the vocabulary related to privacy and confidentiality issues. It often happens
    that you come across intimate information from your client, both business and
    personal.That''s one more reason why your contract should include who you can
    talk to about the things you found while researching the system and who are forbidden
    from hearing updates from you. In general, customers usually want to be the only
    people who know everything you eventually find out.An organization known as the
    EC Council (International Council of Electronic Commerce Consultants) is one of
    the most important organizations in regulating these issues. According to them,
    an ethical hacker should keep all information obtained on the job private and
    treat it as confidential. This is indicated in particular for the customer''s
    personal information, which means that you are not allowed to transfer, give,
    sell, collect or do any of the customer''s information, such as social security
    numbers, mail addresses, home address, unique identification, name, and so on.
    The only way you can give this type of information to a third party is by having
    written permission from your employer (client).While some may argue about the
    distinction between hackers and ethical hackers, the division is quite simple:
    their intentions separate hackers. This means that those who plan to harm and
    use their skills to access data without permission are labeled as black hats,
    while those who work with their client''s permission are considered white hat
    hackers. Naming these two categories of "the bad" and "the good" can be controversial,
    so we''ll try to follow these expressions in the following way:Black hats usually
    operate outside the law, which means they do not have permission from the person
    called "the customer" to consent to their activities. On the contrary, white hats
    have permission and permission from the person called "client," They even keep
    the information they have between client and white hats only. Gray hats, on the
    other hand, enter both areas and use both types of action in different periods.Hacktivists
    are a category of hackers that we have not mentioned before. They belong to the
    movement known as Hacktivism, which refers to action''s hackers use to influence
    the general public by promoting a particular political agenda. So far, hacktivists
    have been involved with agencies, large companies, and governments.Hacker Ethics
    and Code of ConductLike any other profession, hacking has its Code of Conduct
    that establishes rules that can help customers evaluate whether the person who
    interacts with their networks and computer systems is generally reliable. The
    organization that implemented this Code has already been identified and is known
    as the EC Council. Obtaining a CEH reference from the EC Council means that you
    fully understand the expectations you must meet. We''ve provided some parts of
    the code, so make sure you read it and get familiar with it.Information you gain
    during your professional work should be kept confidential and private (especially
    personal information).Unless you have your customer''s permission, you may not
    give, transfer, or sell the customer''s home address, name, or other uniquely
    identifying information.You must protect the intellectual property, yours and
    others, by using skills that you have acquired yourself so that all benefits go
    to the original creator.Be sure to disclose to authorize personnel any danger
    you suspect may be from the Internet community, electronic transactions, or other
    hardware and software indicators.Ensure that the services you provide are within
    your area of expertise so that you work honestly while aware of any limitations
    that may result from your education or experience.You may only work on projects
    for which you are qualified and carry out tasks that match your training, education,
    and work experience skills.You must not knowingly use software that has been obtained
    illegally or has been stored unethically. You may not participate in financial
    practices that may be considered misleading, such as double billing, bribery,
    etc.Make sure you use the customer''s property properly, without exceeding the
    limits set in your contract. You must disclose a potential conflict of interest
    to all parties involved, especially if that conflict cannot be avoided.Ensure
    that you manage the entire project you are working on, including promotion and
    risk disclosure activities.Chapter Sixteen:Mistakes Made in CybersecurityStolen
    information and data will not lead to the end of the business. It is not a great
    sign for the business either. Studies and research indicate that a data breach
    in an organization''s network can lead to a loss of $15.4 million, and the amount
    increases each year. Do they want to lose their money because of some issues or
    vulnerabilities in the system? Indeed, businesses and organizations cannot make
    mistakes. These mistakes can lead to data loss, but a large organization is bound
    to make such mistakes. What the organization must do is to learn from those mistakes.
    You cannot expect your organization to do the exact thing repeatedly only because
    the outcome may change at one point. This chapter covers the different mistakes
    organizations make. You must protect your organization from making such mistakes
    during these times.Failing to Map DataEvery organization must focus on understanding
    how and where the data flows. It should also look at where the data is saved.
    Remember, data is the livelihood of your company. Only when you assess and identify
    the flow of data can you see where it must be protected. You must know if the
    data is flowing out of your organization and who it is shared with. When you have
    visibility, you will know what ends the hacker can attack. You will also know
    where you can catch the hacker.Neglecting Security TestingVulnerabilities will
    reside across the database, systems, applications, and network. These vulnerabilities
    now extend to various devices like the IoT or Internet of Things and smartphones.
    Organizations must test these devices and connections regularly to scan for any
    vulnerabilities. You can also perform some penetration tests to learn about the
    vulnerabilities. Remember, you cannot guess the vulnerabilities and will only
    find them when you test them.Concentrating on Wrong AspectsIndeed, prevention
    is not an anachronism. As technology advances, so make the threats against it.
    Remember, a hacker will find a way to enter the border. A firewall will not always
    protect your systems if you have an employee who does not know what he is doing.
    Once a hacker is inside the system, he can acquire privileged information. He
    can also pretend to be an employee of the organization. Hackers can evade any
    security scans for a long time. If you have better visibility, you can find a
    hacker and reduce the chances of data leaks.Forgetting the BasicsOften, it is
    the simple things you can use to overcome and threats to the system. You must
    train all your employees. Help them understand the type of password they must
    use. They must perform the right actions as well. It is only if this occurs that
    you can properly maintain the components of the network and minimize the risk
    of data loss. You may also find ways to customize the data to properly avoid any
    changes.Avoiding TrainingRemember to train your employees to know what they must
    do to prevent any attacks. The most common form of hack is a social engineering
    attack. The hacker will send information from a malicious source and mask the
    information to seem legit. He can then use the information the employee feeds
    into the website and attack the system''s configuration and network. Make sure
    to train your staff about protecting their systems and how to identify social
    engineering attacks.Security MonitoringMost businesses cannot set up their security
    operations center or center of excellence since they lack the budget. This does
    not mean you cannot monitor the security of the systems and network. You must
    investigate the network and look for any threats or vulnerabilities. You can use
    these approaches to minimize the effect of an attack on data and security.Avoiding
    Vendor Risk AssessmentsFrom earlier, you know vendor risks are the reasons for
    numerous data breaches. Hackers can enter the organization''s systems through
    the vendor''s application or network. Therefore, you must have a plan to help
    you assess the risks in third-party systems. You can also read the reports they
