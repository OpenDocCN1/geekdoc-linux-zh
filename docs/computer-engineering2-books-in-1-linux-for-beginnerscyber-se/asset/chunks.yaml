    is an open community where everyone is connected and can reach anyone irrespective
    of time or distance. It may be called a way of life today, but it has consequences
    if not used with care. Some notorious people use cyberspace to attack websites
    belonging to banks, social media that contains a gold mine of user information,
    and even governments. Here are a few modern cyberattacks:


    ## The SpamHaus Project

    `SpamHaus` is a public service on the Internet that helps filter out spam emails
    based on their content or their origin''s reputation. The attack on `SpamHaus`
    is considered the biggest cyberattack in history where home and business broadband
    router owners were targeted. The attackers gained control over these routers,
    and all these users became involuntary participants of the attack. Millions of
    email service providers use `SpamHaus` to filter out spam emails from the Internet.
    On March 18, 2013, `SpamHaus` had blacklisted a company called `Cyberbunker`,
    which led to losses for the company. `Cyberbunker` and other hosting companies
    retaliated to this by hiring hackers who deployed `botnets` by exploiting broadband
    routers to shut down the `SpamHaus` network.


    ## Sony Playstation

    In 2011, information such as credit card details and user information was stolen
    from 77 million users by a group of hackers. This cost Sony around USD two billion
    in damages. Another pain point for the company happened when hackers were continuously
    able to access the Sony network using the login details of gamers even when they
    tried to fix the issue. This whole attack lasted for twenty-four days.


    ## PayPal

    In December 2010, `PayPal` became a victim of a cyberattack. This happened immediately
    after `PayPal` had blocked `WikiLeaks''`s account for fundraising, citing violation
    of `PayPal`''s acceptable usage policy. Multiple users boycotted `PayPal` because
    of this event, and many hackers started targeting `PayPal`.


    ## Canadian Government Hacking

    In February 2011, the Canadian government disclosed via multiple news channels
    that they had become victim to hacking conducted from `IPs` that traced back to
    China. The attackers accessed three departments of the Canadian government and
    stole data from those departments. The attack was eventually stopped by cutting
    off Internet access to the three departments, putting a full stop to data transmission
    to China.


