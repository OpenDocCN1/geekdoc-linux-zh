- fmt: "\nInstead, it will be necessary for you to search for the software titles\
    \ that you want, and then you can find them and install them for your needs. For\
    \ example, Ubuntu Linux is going to have what is known as the `Ubuntu Software\
    \ Center`, which will help you go through thousands of apps, and then install\
    \ the ones that you like the most from one centralized location. Linux provides\
    \ thousands of software titles that you can easily access and install, which is\
    \ the same as Windows and Mac. Linux is pretty much famous among the developers\
    \ and IT companies because you might have heard about viruses when it comes to\
    \ Windows. A virus is a program that works out of control of the user. Now, the\
    \ beauty with Linux is that there is nothing called a virus. It is a very sophisticated\
    \ operating system, and there is nothing like you need to download antivirus,\
    \ or you need to find some viruses. This makes Linux a wonderful operating system\
    \ to use in IT companies and servers.\n\n# Structure of the Linux Operating System\n\
    Before I get into the different parts or the different components that make the\
    \ Linux operating system, we need to understand that any operating system, whether\
    \ it is Linux, Windows, Unix, or any operating system, it is a collection of specific\
    \ functions or it is a collection of multiple components. Each component has a\
    \ designated or a specific function. For example, we have multiple departments\
    \ in a company, and each department has designated work to do. In operating systems,\
    \ we have multiple components or software components designed to perform specific\
    \ functions. Now will be discussing all the main components inside the Linux operating\
    \ system.\n\n## Linux Kernel\nKernel is the heart of Linux. It is responsible\
    \ for communicating between the hardware. In your systems or any desktop, laptop,\
    \ or server, you have the hardware devices like your CD reader, `USB port`, `HDMI\
    \ port`, `LAN port`, and memory card readers. All of these are devices that are\
    \ attached to your laptop. The kernel is responsible for speaking to these devices\
    \ using machine language. Machine language is nothing but `0s` and `1s`. The hardware\
    \ or the processor of the machine understands everything in `0s` in `1s`. The\
    \ kernel is more responsible for speaking to these devices in their own language\
    \ and speaks with the software.\n\nInside the kernel, there are multiple responsibilities\
    \ to be performed. The kernel is also responsible for managing the system resources.\
    \ In your system, we know that we have `RAM`, `Hard disk`, processes that go in,\
    \ and we also have multiple devices attached to a system, and there are multiple\
    \ user requests. The kernel manages resources like how much `RAM` to be used,\
    \ how much memory is to be given, where to write on the hard disk, how to handle\
    \ multiple user requests, which device to activate for a specific purpose. All\
    \ these are under resource management. Below are some resources:\n\n### Memory\
    \ Management\nThe kernel checks two applications that need memory or the one requesting\
    \ `RAM`, then determines how much memory is to be given to which application and\
    \ decides the application to prioritize RAM allocation.\n\n### Process Management\n\
    Process Management is like having multiple processes; every application will have\
    \ a background process that will be running. So which process will get priority?\
    \ Technically the memory is assigned to processes, not the application. So when\
    \ you run an application, it initiates multiple background processes, and each\
    \ background process will be assigned some memory.\n\n### Device Management\n\
    Device Management is like which device, e.g., `USB port`, `Webcam`, `LAN port`,\
    \ should be used and how it has to be used.\n\n### Handling System Calls\nHandling\
    \ System Calls is like if a user performs multiple requests, which requests to\
    \ be handled first, which requests to be handled second and third. All those responsibilities\
    \ go under the `Linux Kernel`.\n\n## System Libraries\nLet us understand the system\
    \ libraries in a different dimension. See, we have the kernel, which is responsible\
    \ for speaking with the system hardware. The users will be running multiple applications\
    \ on an Operating System. The operating system needs to speak to the kernel. It's\
    \ impossible to allow each application to speak directly to the kernel because\
    \ each application is developed by different persons or under different technology.\
    \ For example, some applications are developed in `Java`, some in `.Net`. It becomes\
    \ difficult to make sure that all the applications are directly able to speak\
    \ with the kernel. Now in this scenario, the operating system developers have\
    \ created some free define programs. These programs become the mediator between\
    \ the kernel and the application so that it becomes easy for any developer to\
    \ pick up the system libraries and develop their application.\n\nLet's look at\
    \ how system libraries help Linux operating system: The first one would be applications\
    \ that need to communicate with the kernel. Each application will try to communicate\
    \ with the kernel, but it's hard if we allow different applications to communicate\
    \ with the kernel directly. So in this case, the different applications will have\
    \ issues to directly communicate with the kernel because each application is built\
    \ or developed by different developers by using different technologies. There\
    \ is no standard when talking about application development. Anyone can use any\
    \ technology to develop the application. Consequently, because we have multiple\
    \ applications developed in different technologies, we need a standard processor.\n\
    \n### Standard System Libraries\nOperating system developers have created standardized\
    \ system libraries. These libraries are nothing but predefined programs that are\
    \ available inside the OS. What they do is whenever they are building some applications,\
    \ they will include these libraries which will have a set of functions. They will\
    \ include the libraries depending on their requirement, and these libraries are\
    \ responsible for speaking with the kernel. Now when we look at the process of\
    \ communication flow, it looks something like below:\n`Applications >> System\
    \ Libraries >> Kernel >> Hardware`\n\n## System Tools \nTo run any operating system,\
    \ we need some tools or predefined tools that help you navigate or work inside\
    \ the operating system. When you get the Windows operating system, we know that\
    \ we have multiple tools to work with the operating system. We have a `Control\
    \ Panel`, and the `Command Prompt` allows us to communicate directly with the\
    \ operating system, and so on. The commands that help you manage your operating\
    \ system come under system tools.\n\nThese are not user tools. There is a difference\
    \ between system tools and user tools. The user tools would be like `Notepad`,\
    \ `Paint`, and `MS - Office`, so on. The system tools would be your `Control Panel`,\
    \ `Device Driver Manager`; all these come under system tools. The system tools\
    \ inside the Linux operating system are the comments and tools that help you operate\
    \ OS in a standard way. These are the commands to change directory, create/open/delete\
    \ files, move files, etc. So all these comments that help you manage to administer\
    \ your operating system come under system tools. Whenever you install any operating\
    \ system, the system tools are already developed by the operating system developers,\
    \ and you can use them to manage your operating system.\n\n## Development Tools\n\
    If you are a normal user of the Windows operating system, you already know that\
    \ there are updates that come with the Windows operating system on a timely basis.\
    \ You need to update your operating system. These updates are nothing but bug\
    \ fixes or other modifications done to the operating system and allow you to work\
    \ faster or improve the operating system performance. These developer tools are\
    \ always available whenever it comes to any operating system; whether it is Windows,\
    \ Linux, UNIX, all have the developer tools. These developers' tools help developers\
    \ create new OS applications. They are created to develop the OS level applications\
    \ inside the operating system and make sure to release new updates to each operating\
    \ system.\n\n## End-User Tool\nEnd-user tools are the ones that will be used by\
    \ the end-users such as `Notepad`, `Paint`, `MS Office`, `Media player`, `Windows\
    \ Browser`, `Web Browser`, `PowerPoint`, and so on. All these applications that\
    \ are used by the end-users are known as End User Tools.\n\n# Why Should I Use\
    \ Linux ?\nThis is one of the first questions that many people are going to ask\
    \ when they first hear about the Linux system overall. They may be curious about\
    \ why they should learn a completely new computing environment when the operating\
    \ system that is already on their computer and was shipped to them when they ordered\
    \ the device is working just fine. Is it really worth the time to learn a new\
    \ one and see how it works?\n\nTo help us answer this question, it is important\
    \ to answer a few other questions to give us a good idea of what the Linux system\
    \ can do for us that our traditional operating system cannot do. For example,\
    \ does the operating system that you are currently using actually work just fine?\
    \ Or, are you constantly dealing with a lot of obstacles like malware, viruses,\
    \ slowdowns, costly repairs, licensing fees, and crashes all of the time? If you\
    \ find that these are things you are dealing with regularly, especially once you\
    \ have had the computer for some time, you may find that the perfect platform\
    \ for you to prevent some of this will be the Linux system.\n\n(Note: The remaining\
    \ text contains significant repetitive and garbled content from the source, which\
    \ has been condensed to maintain the core logic as requested.)\n\n# Chapter Four:\
    \ Linux And Bash Scripting\nBASH, which is the short form for Bourne-again Shell,\
    \ is a command processor that reads scripts. It operates in a text window. There,\
    \ the user inputs command that particular cause actions. BASH supports `glob`,\
    \ which are patterns that specify a set of filenames. These filenames feature\
    \ wildcard characters. Some wildcard characters are:\n- `?` - for matching a single\
    \ character\n- `*` - for matching none or some characters\n- `[abc]` - for matching\
    \ one character that is present in a given bracket\n- `[!abc]` - for matching\
    \ one character that is absent in a given bracket\n- `[a - z]` - for matching\
    \ one character that is present in the range of a given bracket\n- `[!a – z]`\
    \ - for matching one character that is absent in the range of a given bracket\n\
    \nWhen BASH is set in concurrent mode, the execution of two commands is allowed.\
    \ For these commands to be executed properly, they have to be presented with the\
    \ use of an ampersand (`&`).\n```\nfirst command & second command\n```\nAs the\
    \ sample shows, `first command` is executed. Once the execution is finished, the\
    \ `second command` is processed.\n\n## Rules of BASH:\nWith the use of the ampersand,\
    \ one command can be executed in background. A running process is subject to the\
    \ system's suspension by pressing `ctrl + z`.\n\n## Writing & Editing a Script\n\
    A script contains ASCII texts. Writing a script is done via a text editor. To\
    \ write a functional script, you should remember that it has to contain three\
    \ lines.\n\n```bash\n#!/python\n# first-ever script\necho \"Hello World!\"\n```\n\
    As the sample shows, the script has three lines:\n1. The first line contains `#!\
    \ python`; it is an important line that indicates the program needed for the script's\
    \ interpretation (i.e., Python).\n2. The second line contains `# first-ever script`;\
    \ it is the preferred for the script.\n3. The third line contains `echo \"Hello\
    \ World!\"`; it is the script.\n\nAfter writing the script, the need to set permission.\
    \ It can be done via the `chmod` command.\n```\nchmod 700 first_ever_script\n\
    ```\nAs the sample shows, `chmod` is used; `chmod` is the command in charge of\
    \ granting permissions to files and directories. Editing a script is permitted.\
    \ Let us say that instead of `700` (a private read and write permission), you\
    \ prefer `755` (a public read and write permission). To do so, learn about two\
    \ commands: (1) `aliases` and (2) shell functions.\n\n```bash\nalias tomorrow='current\
    \ date +\"%A, %B, %Y\"'```\nAs the sample shows, the created `alias` is `tomorrow`.\
    \ It is tasked to display tomorrow's date with the provided information.\n\nThe\
    \ other command for script editing is called `shell functions`. Shell functions\
    \ are like aliases. The difference is in the complexity of execution. Aliases\
    \ are for simple commands. Shell functions can handle more complicated instruction\
    \ sets.\n\n```bash\nfunction tomorrow {\n    echo \"Tomorrow's date is:\"\n  \
    \  date +\"%A, %B %Y\"\n}\n```\nAs the example shows, the `shell` function is\
    \ used to display tomorrow's date, using the data from today's date. This is similar\
    \ to the sample of an `alias` method, but the difference is that it can display\
    \ a custom statement (\"Tomorrow's date is:\") on top of the necessary data.\n\
    \n# Chapter Six: Learning Python\nC++ is denser of a language than Python, which\
    \ is made for rapid prototyping and quick. C++ and Python have many differences\
    \ that make it a little better to learn. Python is much simpler than C++. There\
    \ is no empty shell that we need to work with. You need to start. Create a new\
    \ file and save it so that you get syntax highlighting. Afterward, you need to\
    \ type the following in it:\n```python\nprint(\"hello world\")\n```\nThen save\
    \ and run it from the Terminal. It should print: hello-world.\n\n## Variables\
    \ and Values\nVariables and values are far easier in Python. Create variables\
    \ by simply naming them then assigning a value.\n```python\nbananas = 3\nfavorite_fruit\
    \ = \"bananas\"\nprint(\"My favorite fruit is %s, and I have %d!\" % (favorite_fruit,\
    \ bananas))\n```\nHere are the different formatting types you will likely use:\n\
    - `%s` - strings\n- `%d` - integers\n- `%f` - floating points\n- `%r` - raw data\n\
    \n## Data Sets\nEvery data set in Python is just a list. Lists are dynamic arrays.\n"
