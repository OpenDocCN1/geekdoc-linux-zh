    need to download the blockchain''s core, just as if you were trying to turn your
    computer into a blockchain node. Once you have all of the necessary hardware,
    you can begin running the mining software and earning virtual currency!Similarly
    to operating a node, your mining computer may drain so many resources that you
    cannot use it for much else. Unless you decide to build your own mine (a venture
    that some hard-core blockchain techies set out to do), you are probably best off
    using an older computer that you no longer use. Also, a mine will use a lot of
    energy and memory, so make sure that you have an ample supply of both. If you
    cannot dedicate the necessary resources to running your own mine, consider joining
    a Linux- based mining pool. A mining pool is a group of miners who combine their
    computers'' energy to mine more efficiently. They then split the profits.Linux
    and the Internet of Things (500 words)With the rise of IOTA as the next generation
    in blockchain technology, plenty needs to be said about Linux and the Internet
    of Things. Linux is actually the key component that makes the Internet of Things
    possible. Many of the gadgets that are a part of it are equipped with a postage-sized
    chip that uses Linux to connect to the Internet.Linux''s free distributions are
    behind many of the gadgets on the Internet of Things. Imagine that you are an
    entrepreneur with a great idea for programming a washing machine to operate remotely.
    That way, people can time their laundry loads so that they are finished just as
    they get home from work. You could go through all of the hassles of building a
    brand new network with your own technology that allows the washing machine to
    connect to the Internet and then to the user''s smartphone. Or you could take
    an operating system that is already free and open-source and use that to program
    your washing machine. Without Linux, the creation of gadgets on the Internet of
    Things would be so high that it would be prohibitive. By the way, if you are using
    an Android phone to access your smart devices, you are using Linux because most
    Androids run on Linux.Consider another important aspect of the Internet of Things:
    the Cloud. Your computer may have a minimal amount of memory and storage. Still,
    you can use it to access orders of magnitude of more memory through the Cloud.
    The Cloud is a critical part of the Internet of Things'' infrastructure, as it
    enables higher levels of access and power. The Cloud is also powered by Linux,
    which enables it to be integrated into the Internet of Things ecosystem.The tangle,
    the third-generation blockchain technology, is essentially a feature of Linux.
    It can run on pretty much any operating system. Still, Linux makes up the bulk
    of the computational power of the Internet of Things. Without it, the tangle would
    be nothing more than a super-rich side interest which has nothing better to do
    with their time.The real question is, why does all of this matter? It matters
    because Linux is powering the next generation of the Internet. Becoming a Linux
    programmer can put you on the cutting edge of these developments. It can even
    put you into a position in which you can make a lot of money.You learned about
    Linux''s relationship with blockchain technology and the growing Internet of Things.
    You are probably now seeing how crucial Linux is to developing the advanced gadgetry
    that makes many aspects of our lives easier.Build a Blockchain with LinuxBefore
    you start building a blockchain, you need to know what it will be used for. The
    most successful businesses (and yes, blockchains are essentially businesses) are
    those that can meet a real and felt need that people already have. What needs
    to you recognize that can be met through the use of blockchain? Use that to build
    your vision as you move forward in creating a blockchain.This part will not explore
    some of the more community-oriented aspects of building a blockchain, like getting
    people to use their computers as nodes and bringing together a decentralization
    movement. Instead, it will give you tips and tricks on how to build the actual
    program.Back-End Blockchain ApplicationsPython is a programming language that
    is used to build the back end of an application. It sets the parameters and builds
    the ecosystem with which users will interact rather than create the graphics that
    make a program visually attractive. When you set out to build a blockchain, you
    will be building the back end application. To illustrate what is meant by this,
    consider the code used for the genesis block of the Bitcoin blockchain:GetHash()
    = 0x000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b6hashMerkleRoot = 0x4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7aftxNew.vin[0].scriptSig
    = 486604799 4 0x736B6E616220726F662074756F6C69616220646E6F63657320666txNew.vout[0].nValue
    = 5000000000 txNew.vout[0].scriptPubKey =0x5F1DF16B2B704C8A578D0BBAF74D385CDE12C11EE50455F3
    OP_CHECKSIGblock.nVersion = 1block.nTime = 1231006505 block.nBits = 0x1d00ffff
    block.nNonce = 2083236893CBlock(hash=000000000019d6, ver=1, hashPrevBlock=00000000000000,
    hashMerkleRoot=4a5e1e, nTime=1231006505, nBits=1d00ffff, nNonce=2083236893, vtx=1)CTransaction(hash=4a5e1e,
    ver=1, vin.size=1, vout.size=1, nLockTime=0)CTxIn(COutPoint(000000, -1), coinbase
    04ffff001d0104455468652054696d65732030332f4a616e2f32303039CTxOut(nValue=50.00000000,
    scriptPubKey=0x5F1DF16B2B704C8A578D0B)vMerkleTree: 4a5e1eThis code is written
    in C++, and you can certainly replicate the code (probably with minor changes
    to best suit your goals) in the process of creating your own blockchain. The best
    way to do this is on the Linux terminal or whatever text editor you prefer to
    use. You can also write your genesis block code in another programming language,
    like Python. You can create a basic genesis block with Python using the following
    code:class Block:def                 init       (self, index, previousHash, timestamp,
    data, currentHash):self.index = index self.previousHash = previousHash self.timestamp
    = timestampself.data = data self.currentHash = currentHashdef getGenesisBlock():return
    Block(0, ''0'', ''1496518102.896031'', "My very first block :)", ''0q23nfa0se8fhPH234hnjldapjfasdfansdf23'')blockchain
    = [getGenesisBlock()]The aforementioned codes for building genesis blocks are
    quite basic. They are certainly more intensive than the "Hello, Python!" program,
    and they are a good place to learn as you cut your teeth with building blockchains
    on Linux. Once you are comfortable with blockchain programming, you can move on
    to more complicated programs, similar to Lisk and Blockstack. Just make sure that
    your vision is big enough to match your programming skills!Once you have your
    code written, you will need to compile it to run on your Linux platform. You may
    need to make tweaks and changes along the way to work exactly how you want it
    to.Many blockchains today incorporate smart contracts. Serpent is a programming
    language that was designed to be extremely similar to Python; it can be used to
    write a smart contract with the following code:$ serpent compile_to_lll mul2.se
    (return 0(lll(with ''funid(div (calldataload 0)26959946667150639794667015087019630673637144422540)(unless
    (iszero (eq (get ''         funid) 4008276486)) (seq(set ''x (calldataload 4))(seq(set
    ''_temp_521 (mul (get ''x) 2)) (return (ref ''_temp_521) 32))))) 0))You will probably
    want to tweak the code so that the smart contract can carry out specialized features,
    be they financial transactions, voting, or anything else. If you are building
    the blockchain using Python, C++, or any programming language other than Serpent,
    you will need to compile the codes to be compatible.Following the genesis block,
    you can make changes to the code, provided you have a 51% consensus. As long as
    you are the only person running the blockchain, that consensus should be pretty
    easy to come by! Keep working on developing the code so that the program can carry
    out more and more complex tasks. You may even develop it to be as complex as Ethereum!
    Once your blockchain is functional, you can upload it to GitHub or another forum
    so that other people can download it. You may want to consider uploading it as
    a .tar file so that people can download the source code rather than the binary
    program.Keep in mind that a blockchain is nothing more than a digital ledger of
    transactions at its heart. It is not the graphics and web pages that you can access
    through platforms like Ethereum; those are only secondary. The next section will
    look at how to use Linux to build a blockchain application''s front end.Front-End
    Blockchain ApplicationsOnce your blockchain is running well on the back end, you
    are ready to start building front-end applications for it. The front end is the
    interface that the users will interact with when they are actually using the applications.Python
    is ideal for building the back end of applications, but it isn''t quite adept
    at the front end. Many programmers agree that JavaScript is the way to go. Probably
    the best way to get started is to use JavaScript to create a module that you will
    call upon in your Python code.Using JavaScript going on your computer is somewhat
    different than Python. To get started with JavaScript on your Linux script, the
    first thing that you will need to do is download the JavaScript client. This will
    allow you to write JavaScript code on your Linux terminal. You will also need
    to download a JavaScript engine, such as Rhino, to execute the code that you will
    write.The focus here is on helping you learn how to use Linux to create a blockchain.Using
    Linux to Build a DappRecall that a dapp is a decentralized application. It is
    what networks like Ethereum and Lisk are designed to run. Linux and dapps are
    so intertwined that many experts recommend using Ubuntu or another Linux distribution
    to build one!Before you start building a dapp for Ethereum, you need to be aware
    that it has its own programming languages — most notably Solidity — that work
    best with its interface. Solidity is very similar to JavaScript, so once you have
    gotten your feet wet with the latter, you should easily get started with the former.You
    can use the Linux command line terminal to connect with the Ethereum Virtual Machine
    (the world computer that powers Ethereum) and build your dapp. You can also download
    the Ethereum client that will allow you to program in your language of choice.
    This section will take you through the process of building a dapp by downloading
    the client.You will probably want to download the Solidity client if you want
    to write your code directly into Solidity. Otherwise, you will need a compiler
    to translate your code into Solidity. You will also need to download SOLC, the
    compiler for Solidity, that will allow you to execute the program. You can get
    both of them on GitHub or the main Ethereum website.The back end of your dapp
    will be your smart contracts, so to start programming your dapp, you will need
    to build your basic smart contract. A basic smart contract in Solidity looks like
    this:pragma solidity ^ 0.4.0; contract SimpleStorage {uint storedData;function
    set(uint x) public { storedData = x;}function get() public constant returns (uint
    ) {return storedData;}}The smart contract''s first line just says that the code
    was written for Solidity 4.0 or greater. The word "pragma" tells the compiler
    how the source code should be treated. A "uint" is an unsigned integer of 256
    bits; in other words, it cannot be a negative number, but it can be a positive
    number that is up to twice as large as its signed integer counterpart.The second
    and third lines say that the code is for a smart contract that will perform the
    simple storage of data. In the fourth and fifth lines, a function is being built
    for the variable x, a uint. X will be used to store the data in the smart contract.This
    is a fundamental contract that sets a value for a number that is publicly accessible.
    Your smart contracts will probably be much more complex so that they can carry
    out real-world functions and solve actual problems.Use either your Linux terminal
    or your Solidity client to execute the smart contract. (You want to make sure
    that it functions exactly how you anticipated, so plan to spend some time making
    tweaks and changes to it.) There should be an icon in the terminal marked "New
    Transaction." Click on it so that you can use your smart contract to complete
    a transaction  Before you can successfully execute smart contracts within the
    Ethereum ecosystem, you will need Ether. You can either buy Ether (with Bitcoins
    or fiat money), or you can mine it. To mine it, find the toolbar and click on
    "Mine." Under "Debug," click on "Force Mining." Your computer will become a mine,
    at least short term. At the same time, you accrue enough Ether to begin executing
    your dapp''s smart contracts. When you have enough, click "Stop Mining."When you
    have enough Ether and are satisfied with how your smart contract is executing,
    go back to "New Transaction" and copy and paste the code for your smart contract
    into the text box. Leave the other fields at their default value since you aren''t
    trying to carry out a transaction in which you send someone else Ether.If there
    is an error in how you compiled the code, the built-in debugger will automatically
    tell you where that error is. If it is compiled correctly, you will see an option
    at the bottom with the possible transactions that your smart contract can execute.
    Congratulations!! You can now mine a block and officially make your smart contract
    part of the Ethereum blockchain.Chapter Nine:Managing Text FilesWe will also learn
    how to redirect the output from one text file to another text file. We will learn
    to edit existing text files on the command shell prompt using a ''Vim.''Redirecting
    the Output from a File to another File or ProgramThis section will discuss terms
    such as standard input, standard output, and standard error. We will further learn
    how to redirect outputs from a file to another file and redirect the output from
    a file to another program.Standard Input, Standard Output, and Standard ErrorWhen
    a program or a process is in a running state, it will take inputs from somewhere
    and then write the output to a file or display it on the screen. When you are
    using a terminal on the Linux operating system, the input is usually taken from
    the keyboard. The output is sent to be displayed on the screen.A process uses
    some channels known as file descriptors, which take some input and send some output.
    There are at least three file descriptors in every process.1\. Standard Input,
    also known as Channel 0, which takes inputs from the keyboard2\. Standard Output,
    also known as Channel 1, which sends outputs to the screen3\. Standard error,
    also known as Channel 3, which sends error messagesLet us go through the channel
    names for file descriptors.![](Image00002.jpg)Redirecting Output to a FileThe
    input/output redirection is used to replace default output destinations with file
    names or other devices. The output of a command, which usually is redirected to
    be displayed on the terminal screen, can be redirected to a file or a device or
    discarded with redirection.When you redirect the standard output stdout , it will
    not appear as an output on the terminal screen. This does not mean that error
    messages stderr  will not appear on the screen if you only redirect standard output stdout
    . If you redirect the standard output to a file that does not exist, it will get
    created in the process. If the file already exists and you use a redirect that
    is not an append redirect, the existing file will be overwritten. Redirecting
    the standard output to /dev/null will discard the output as redirected to an empty
    file.Let us go through the output operators that are used for redirection.>fileThis
    will redirect the standard output stdout to the file and overwrite any previous
    content.>>fileThis will redirect the standard output stdout to the file and append
    any previous content in the file.2>fileThis will redirect the standard error stderr
    to the file and overwrite any previous content. 2>/dev/nullThis will discard the
    standard error stderr by redirecting it to /dev/null>file 2>&1 &>fileThis will
    redirect the standard output stdout and standard error stderr to overwrite the
    same file>>file 2>&1 &>>fileThis will redirect the standard output stdout and
    standard error stderr to append to the same fileNote:  The operator''s order is
    significant, as changing the order can lead to a complete change in the redirection.For
    example, >file 2>&1  will redirect the standard output stdout to the file and
    then redirect the standard error stderr to the same file.If you change the order
    to 2>&1 >file,  it will redirect the standard error to the default output place,
    the terminal screen, and only redirect the standard output to the file.Because
    of this confusion, many users prefer using the alternative operators &>file  and &>>file 
    for, which merge standard output and standard error and then redirect them to
    the file.Let us quickly go through some examples to understand output redirection
    better. There are many days to day system administration tasks that can be performed
    using output redirection.1\. Saving the timestamp in a file for future reference[student@desktop
    ~]$ date > ~/timeThis will output the current timestamp and redirect it to the
    file named time in the student''s home directory.2\. Copy the last a hundred lines
    from a log file and save it in another file[student@desktop ~]$ tail -n 100 /var/log/messages
    > ~/logsThis will copy the last hundred lines from the messages log file and save
    it in the student''s home directory log file.3\. Concatenation contents of 3 files
    into a single file[student@desktop ~]$ cat file1 file2 file3 > ~/OneFileThis will
    concatenate contents of file1, file2, and file3 and save it in a single file called
    OneFile in the user''s home directory.4\. List the hidden directories in the home
    directory and save the file names in a file[student@desktop ~]$ ls -a > ~/hiddenfilesThis
    will list the hidden directories in the user''s home directory and save the directory
    names in the file called hiddenfiles in the user''s home directory.5\. Append
    the out of an echo command to an existing file[student@desktop ~]$ echo “Hello
    World” >> ~/fileThis will append the string Hello World to the file in the user''s
    home directory.6\. Direct the standard output to one file and standard error to
    another file[student@desktop ~]$ find /etc -name passwd > ~/output 2>~/errorThis
    will redirect the output to the output file and the error file''s errors in the
    student''s home directory.7\. Discarding the error messages[student@desktop ~]$
    find /etc -name passwd > ~/output 2>/dev/nullThis will redirect the errors to
    /dev/null, an empty file, and discard it.8\. Redirect standard output and standard
    error together in one file[student@desktop ~]$ find /etc -name passwd > &> ~/onefileThis
    will redirect the standard output and standard error to the file onefile in the
    student''s home directory.Using the PipelineA pipeline is an operator, which separates
    one or more commands by using a pipe operator. The pipe basically takes the standard
    output of the first command. It passes it as standard input to the second command.The
    output will keep passing through various commands, separated using the pipe, and
    only the final output will be displayed on the terminal. We can visualize it as
    a flow of data through a pipeline from one process to another process. That data
    is being modified on its way by every command it passes through.Let us go through
    some examples of the pipeline, which are useful in system administration tasks.[student@desktop
    ~]$ ls -l /var/log | lessThis will list the files and directories located at /var/log
    and display it on the terminal one screen at a time because of the less command.[student@desktop
    ~]$ ls | wc -lThis command will pass the output through the pipe, and the wc -l
    command will count the number of lines in the output and display the number of
    lines and not the actual output of the ls command.Pipelines, Redirections, and
    the Tee commandAs already discussed, when you are using the pipeline, the pipeline
    makes sure that all the data is processed and passed through every command. Only
    the final output is displayed on the terminal screen. This means that if you were
    to use output redirection before a pipeline, the output would be redirected to
    the file and not to the next command in the pipeline.[student@desktop ~]$ ls >
    ~/file | lessIn this example, the ls command''s output was redirected to the file
    in the student''s home directory and never passed to the less command. The final
    output never appeared on the terminal screen.This is exactly where the tee  command
    comes into the picture to help you work around such scenarios. If you are using
    a pipeline and use the tee command in it, tee will copy its standard input to
    standard output and, at the same time, will also redirect the standard output
    to the specified files named as arguments to the command. If you visualize data
    as water flowing through a pipe, tee command will be the T joint of that data,
    which will direct the output in two directions.Let us go through some examples,
    which will help us understand how to use the tee command with pipelines.[student@desktop
    ~]$ ls -l | tee ~/Documents/output | lessUsing tee in this pipeline firstly redirects
    the ls command''s output to the file at Documents/output in the student''s home
    directory. After that, it also feeds the ls command to the pipe as input to the
    less command, which is then displayed on the terminal screen.[student@desktop
    ~]$ ls -l | less | tee ~/Documents/outputIn this case, we see that tee is used
    at the end of the command. This does it displays the output of the commands in
    the pipeline on the terminal screen and saves the same output to the file at Documents/output
    in the student''s home directory.Note:  You can redirect standard error while
    using the pipe, but you will not be able to use the merging operators &> and &>>Therefore,
    if you wish to redirect both standard output and standard error while using the
    pipe, you will have to use it in the following manner.[student@desktop ~]$ find
    -name / passwd 2>&1 | lessUsing the Shell Prompt to Edit Text FilesThis section
    will learn how to use the shell prompt to create new files and edit existing files.
    We will also learn about Vim, a trendy editor used to edit files from the shell
    prompt.Using Vim to edit filesOne of the most interesting things about Linux is
    that it is designed and developed, so all information is stored in text-based
    files. There are two types of text files, which are used in Linux. Flat files
    in which text is stored in rows containing similar information, which you will
    find in the /etc. Directory, and Extensible Markup Language (XML) file has text
    stored using tags, which you will find in the /etc. and /usr directories. The
    biggest advantage of text files is that they can be transferred from one system
    or platform to another without converting them. They can also be viewed and edited
    using simple text editors.Vim is the most popular text editor across all Linux
    flavors and is an improved version of the previously popular vi editor. Vim can
    be configured as per user needs and includes features like color formatting, split-screen
    editing, and highlighting text for editing.Vim works in 4 modes, which are used
    for different purposes.1\. Edit mode2\. Command mode3\. Visual edit mode4\. Extended
    command modeWhen you first launch Vim, it will open in the command mode. The command
    mode is useful for navigation, cut and paste jobs, and other tasks related to
    manipulating text. To enter the other modes of Vim, you need to enter single keystrokes
    specific to every mode.If you use the i keystroke in the command mode, you will
    be taken to the insert mode, which lets you edit the text file. All content you
    type in the insert mode becomes a part of the file. You can return to the command
    mode by pressing the Esc key on the keyboard.If you use the v keystroke in the
    command mode, you will be taken to the visual mode to manipulate text by selecting
    multiple characters. You can use V and Ctrl+V to select multiple lines and multiple
    blocks, respectively. You can exit the visual mode using the same keystroke: v,
    V, or Ctrl+V.The keystroke takes you to the extended command mode, which lets
    you save the content that you typed to the file and exit the vim editor.More keystrokes
    are available in vim for advanced tasks related to text editing. Although it is
    known to be one of the best text editors in Linux globally, it can get overwhelming
    for new users. We will go through the minimum keystrokes essential for anyone
    using vim to accomplish editing tasks in Linux.Let us go through the steps given
    below to get some hands-on experience of vim for new users.1.  Open a file on
    the shell prompt using the command vim filename.2\. Repeat the text entry cycle
    given below as many times as possible until you get used to it.Use the arrow keys
    on the keyboard to position the cursor Press i  to go to insert modeEnter some
    text of your choiceYou can use u  to undo steps taken on the current line that
    you are editingPress Esc  key on the keyboard to return to the command mode3\.
    Repeat the following cycle, which teaches you to delete text as many times as
    possible until you get the hang of it.Position the cursor using the arrow keys
    on the keyboard. Delete a selection of text by pressing x  on the keyboardYou
    can use u  to undo steps taken on the current line that you are editing4\. You
    can use the following keystrokes next to save, edit, write, or discard the file.Enter:w 
    to save/write the changes you have made to the file and stay in the command modeEnter:wq 
    to save/write the changes to the file and exit VimEnter:q  to discard the changes
    that you have made to the file and exit VimRearranging the Existing Content in
    VimThe tasks of copy and paste are known as yank and put in Vim. This can be achieved
    using the keystrokes of y  and p . First, place the cursor at the first character
    you wish to copy from and then enter the visual mode. You can now use the arrow
    keys to expand your selection. You can then press y to copy the text to the clipboard.
    Next step is to place the cursor where you want to paste the selected content
    and press p .Let us go through the steps given below to understand how to use
    the copy and paste feature using yank and put in Vim.1.  Open a file on the shell
    prompt using the command vim filename.2\. Repeat the text selection cycle given
    below as many times as possible until you get used to it.Position your cursor
    to the first character using the arrow keys on the keyboardEnter the visual mode
    by pressing vPosition your cursor to the last character using the arrow keys on
    the keyboardCopy the selection by using yank yPosition your cursor to the location
    where you want to paste the content using the arrow keys on the keyboardPaste
    the selection by using put p3\. You can use the following keystrokes next to save,
    edit, write or discard the file.Enter:w  to save/write the changes you have made
    to the file and stay in the command mode.Enter:wq  to save/write the changes to
    the file and exit VimEnter:q  to discard the changes that you have made to the
    file and exit VimNote:  Before you take tips from the advanced vim users, it is
    advisable that you get used to the basics of vim as performing advanced functions
    in vim without proper knowledge may lead to modification of important files and
    permanent loss of information. You can learn more about the basics of vim by looking
    up the Internet for vim tips.Using the Graphical Editor to Edit Text Files in
    Red Hat Enterprise Linux 7This section will learn to access, view, and edit text
    files using a tool in Red Hat Enterprise Linux 7 known as gedit . We will also
    learn how to copy text between to or more graphical windows.Red Hat Enterprise
    Linux 7 comes with a utility known as gedit, which  is available in the operating
    system''s graphical desktop environment. You can launch gedit by following the
    steps given below.Applications > Accessories > geditYou can also launch gedit
    without navigating through the menu. You can press Alt+F2, which will open the
    Enter A Command dialog box. Type gedit in the text box and hit Enter.Let us go
    through the basic keystrokes that are available in gedit. The menu in gedit will
    allow you to perform numerous tasks related to file management.Creating a new
    file: Navigate through File > New (Ctrl+n) on the menu bar or click the blank
    paper icon on the toolbar to start a new file.Saving a file: Navigate through
    File > Save (Ctrl+s) on the menu bar or click the disk icon on the toolbar to
    save a file.Open an existing file: Navigate through File > Open (Ctrl+o) on the
    menu bar or click on the toolbar''s Open icon. A window will open up and will
    be showing you all the files on your system. Locate the file that you wish to
    open and select it and click on open.If you select multiple files and click on
    open, they will all open up and will have a separate tab under the menu bar. The
    tabs will display a filename for existing files or save a new file with a new
    name.Let us now learn how to copy text between two or more graphical windows in
    Red Hat Enterprise Linux 7\. Using the graphical environment in Red Hat Enterprise
    Linux 7, you can copy text between text windows, documents, and command windows.
    You can select the text that you want to duplicate using copy and paste or move
    text using the cut and paste options. In each case, the text is stored in the
    clipboard memory so that you can paste it to a destination.Let us go through the
    steps to perform these operations. Selecting the text:Left-click and hold the
    mouse button at the first character of the text.Drag the mouse until you have
    selected all the desired content and then release the button. Make sure that you
    do not press anything, as that will result in the deselection of all the text.Pasting
    the selected text: There are multiple methods to achieve this. This is the first
    one.Right-click the mouse on the selected text at any point.A menu will be displayed,
    and you will get the option to either cut or copy.Next, open the window to paste
    the text and place the cursor in the desired location where you wish to paste
    the text. Right-click the mouse again and select Paste on the menu that appears.There
    is a shorter method to achieve the same result as well.Firstly, select the text
    that you need.Go to the window to paste the text and place the cursor at the desired
    location in the window. Middle-click the mouse just once and will paste the selected
    text. This method will help you copy and paste but not cut and paste. However,
    to emulate a cut and paste, you can delete the original text as it remains selected.The
    copied text remains in the clipboard memory and can be pasted again and again.The
    last method is the one using shortcut keys on the keyboard:After selecting the
    text, you can press Ctrl+x to cut or Ctrl+c to copyGo to the window to paste the
    text and place the cursor at the desired location.Press Ctrl+v.Chapter Ten:Advantages
