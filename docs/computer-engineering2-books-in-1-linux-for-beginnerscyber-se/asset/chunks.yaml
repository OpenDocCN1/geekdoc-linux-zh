    或许系统管理员最重要的技能之一是在高负载和压力下进行工作。系统管理员通常实行七天制，其中每周有两天需要值班（on call），一旦系统出现问题就必须上线，并能够快速解决问题，以便系统立即恢复运行。如果系统或服务器长时间处于机机，可能会为机构带来数千美元的损失。例如，以购物巨头亚马逊（Amazon）网站为例。如果亚马逊网站即使宕机一小时，所有的销售额都会受到影响，导致巨大的收入损失。这就是系统管理员介入并扭转乾坤的地方。系统管理员的角色无异于超级英雄，在需要时随时拯救机构。


    Linux 最初是由一个名为林纳斯·托瓦尔斯（Linus Torvalds）的程序员在 20 世纪 90 年代初，就读于芬兰赫尔辛基大学期间，仅仅作为一个爱好项目开发的。该项目的灵感源于一个名为
    Minix 的小型 Unix（一种操作系统）系统，它是由安迪·塔能鲍姆（Andy Tanenbaum）教授开发的，他使用 Unix 代码向该大学的学生教授操作系统。在当时，Unix
    仅用于大学的学术目的。这位教授开发了 Minix（Unix 的一个小克隆版本），以便更有效地向他的学生深度教授操作系统。林纳斯深受 Minix 的启发，开发了自己的自己的克隆版本，并将其命名为
    Linux。


    1991 年 10 月 5 日，林纳斯发布了 0.02 版本，这是 Linux 的第一个版本。虽然这个版本能够运行 Bourne shell（`bash`）——即命令行界面——以及一个名为
    `GCC` 的编译器，但除此之外没有其他内容了。0.03 版本在稍晚时候发布，随着更多人开始接受该软件，版本号增加到了 0.10。在经过几次修订后，林纳斯在
    1992 年 3 月发布了 0.95 版本，以反映他对系统很快将准备好进行“官方”发布的预期。大约一年多半后（1993 年 12 月），该版本终于达到了 1.0。


    如今，Linux 是 Unix 的完全克隆，并从那起，其用户群已跨越了各个行业和大陆。了解它的人看到并欣赏它在几乎所有领域中的应用——从汽车到智能手机，从冰箱等家用电器到超级计算机，这个操作系统无处不在。Linux
    运行着互联网大部分大部分，运行着你隔几天就会听到的各种科学突破的计算机，以及全球证券交易所。在你欣赏它的存在时，不要忘记，在这个操作系统成为全球范围内运行服务器、桌面和嵌入式系统的最佳平台之前，它是（且仍然是）可用的最安全、可靠且无后顾的操作系统。凭借这段简短的历史，我相信你现在已经准备好接受一些信息，让你快速上手这个奇妙的平台。


    # UNIX 的演变


    在这一部分，我们将回顾 Linux 的历史。现在提到 Linux 历史，在我谈论 Linux 的起源或它是如何演变之前，我们需要看看计算机的演变。


    ## 计算机与 UNIX 的演变


    如果你们都知道计算机是什么时候开发或引入的，它们是巨大的、体积很大的系统，价格昂贵，我想计算机第一次开发出来时，它们有像小房子那么大。非常庞大的系统，普通人很难负担。


    当计算机开始开始演变时，每家公司都有不同的操作系统。他们过去会购买硬件，创建自己的操作系统，并根据自己公司的规范运行计算机。由于不同的公司购买硬件，不同的公司引入自己的操作系统，问题在于每台计算机都是为了特定目的而开发的，这意味着每个系统都有特定的用途。例如，一台服务器会有一个特定的目的，一台工作站会有一个特定的目的，但在所有系统、服务器或工作站之间没有统一的操作系统。


    这些系统极其昂贵，因为在计算机最初创建时，硬件成本非常高。如果你将其与手机相比，当手机最初创建时，它们也非常昂贵。如今需求如此之高，硬件成本已经下降，任何人都可以购买手机。计算机也是如此。你可以以负担得起的价格获得计算机，因为有许多公司在制造计算机，这意味着大量的竞争。所以当需求增加时，当竞争增加时，价格肯定会下降。


    但在计算机最初构建时，任何人都无法负担一台计算机，这就是为什么过去只有公司能买得起极其昂贵的计算机。此外，在那个时代，理解和学习计算机是一项必备技能。因此，对于普通人来说，学习和理解计算机或操作系统是不可能的。每家公司都有熟练的劳动力，有操作和在这些特定计算机上工作的人才。这就是计算机的主要演变，就是这样开始的。


    现在理解一下这个演变过程；这确实存在一个问题。问题在于每家公司在硬件或计算机操作系统方面都有它们自己的垄断。他们开发了自己的操作系统。因此，在计算机和构建它们的公司之间没有操作系统的标准化。


    这就是为什么在 1969 年，贝尔实验室（Bell Labs）的一组开发者开始了这项工作。`C` 语言最初就在那个实验室开发的，那里的一组开发者在想，为什么不构建一个可以跨计算机使用的标准操作系统，这样人们就不用担心硬件或软件了？起初，问题是硬件成本，再加上为特定计算机构建操作系统的另一项成本。为了降低该成本，开发者们想，为什么不创建一个标准的操作系统，这样人们就可以购买标准的硬件？他们可以购买或安装标准的操作系统，然后继续开发或使用他们的应用程序。这就是
    Unix 的开始。


    UNIX 项目的目标是为所有计算机创建通用软件，因为所有公司都在开发自己的操作系统；这是一项非常艰巨的工作。他们想要标准化这个过程。UNIX 或 UNIX
    操作系统是基于 `C` 语言启动的。


    现在团队对 UNIX 操作系统的开发有了进一步的目标，该目标是创建一种易于理解且可重用或回收的代码。这种可回收的代码被称为 `kernel`（内核）。`kernel`
    是操作系统的部分，因为一个操作系统有多个组件。它负责与硬件和软件进行通信。`kernel` 是可回收的，并用于开发操作系统和增强功能。现在许多人做的是使用这个
    `kernel`，因为它是标准代码。他们可以通过修改 `kernel` 或与 `kernel` 通信的软件或与 `kernel` 通信的应用程序来开发自己的
    UNIX 变体，因为它是一个标准层。


    早些，你必须开发一个直接与硬件对话的操作系统。现在你有一个层，即 `kernel`，或者一个负责与硬件会话的中间人。所以我们需要创建只能直接与 `kernel`
    通话的应用程序，因为 `kernel` 处理与硬件的通信。


    ## Linux 特性


    -   **多用户操作系统**：多个用户可以连接到同一个操作系统。

    -   **多任务处理**：多任务意味着任务根据 CPU 线程并行执行。

    -   **可移植性**：可移植性意味着你可以在任何硬件上安装 Linux。

    -   **安全性**：像 Linux 一样，我们有身份验证。当你尝试连接到操作系统时，你需要提供用户 ID 和密码。

    -   **GUI 界面**：我们也可以可以在 GUI 中使用 Linux 的操作系统。

    -   **文件系统**：文件系统允许你以系统的顺序排列你的文件和目录。

    -   **开源**：这意味着任何人都可以自由下载、安装和使用该操作系统。


    ## 第二章：安装 Linux


    请注意，在安装发行版之前，你可能需要了解你计算机的硬件。例如，如果你选择安装 `Debian`，你将需要关于你的 PC 及其组件的信息，因为该发行版并不识别所有内容。幸运的是，现在所有的安装程序都能够扫描你的计算机并看到每个连接的硬件元素。然而，你仍然应该手头留信息，以防发生某些错误。这样，你就可以排故障并弄清楚在设置过程中出了问题。一旦你选择了你的
    Linux 发行版，你就需要下载它。并不是所有的，但大多数都是 `ISO` 格式的，你可以免费下载它们。下一步是将该文件刻录到磁盘或 U 盘上。接下来，你需要在启动系统时告诉系统从磁盘或
    U 盘启动。许多计算机在检测到启动盘时会自动启动，但有时如果它被设置为始终从硬盘启动，你就必须自己手动开启该设置。更改启动顺序可能会解决问题。你将需要访问系统的选项。在操作系统加载之前，通过按下类似
    `F10` 或 `DEL` 的键来访问你的系统。一旦进入计算机的设置部分，你需要将你的 Linux 启动磁盘分配为默认启动设备。确认更改，将你的磁盘放入驱动器（或连接
    U 盘），并重启计算机。在这个阶段，我相信你现在准备好接受一些信息，让你快速上手这个奇妙的平台。


