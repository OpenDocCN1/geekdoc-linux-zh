- fmt: '

    When the terminal has been started, simply use the `SSH` command to get your connection.
    Do be aware that commands are always case-sensitive, so only use lowercase. Type
    in `ssh` followed by the username on the Linux server. When you connect for the
    first time to a server, you will need to verify the host key. Type `Yes` to continue
    connecting and then press `Enter`. When the connection is established, input your
    password. To get out of the connection, type in `exit` and then log out.


    Ou is finished with downloading and installing methods for your chosen Linux distribution
    or Linux operating system. After the whole process of adjusting your computer
    for the new operating system, you need to set up the Linux performances and environment
    related to your needs and working opportunities.


    According to which Linux distribution and desktop environment you choose, your
    desktop environment and installed applications will vary. Most of them will cover
    your typical needs and similar personal requirement based on computer working.
    Most Linux distributions are connected with the `Firefox` web browser, and the
    open-source `Chromium` browser, or `Google Chrome`, is just a few clicks away.


    Your desktop environment should have all the standards: the application menu,
    some sort of taskbar, and a notification area or "system tray." You may also find
    a collection of system services that will help you to configure your hardware
    and make your desktop work properly in the right way.


    It can be a bit quirky to use `Ubuntu 16.04`''s `Unity` desktop. If you want to
    try it, we recommend trying `Ubuntu GNOME`, which uses the `GNOME` desktop instead
    of `Unity`.


    If you do not like the desktop you''re using - while some distributions are optimized
    for a particular desktop, nearly every major distribution gives you the option
    to install your choice desktop once the system is installed. As long as you have
    enough spare storage, you can have `GNOME`, `KDE`, `Cinnamon`, `XFCE`, and other
    desktops installed simultaneously. When logging in to the desktop, you can choose
    which desktop environment must be run.


    Generally, you can find a lot of information on Google for your distribution''s
    name. If you prefer a more structured help section, the `Ubuntu` and `Fedora`
    documentation websites are great resources. While the `Arch Wiki` is written with
    `Arch Linux` users in mind, it is a great in-depth resource for Linux programs
    in general.


    You have several choices for what concerns Linux installation: you can either
    leave it on a disc or USB drive and boot it up whenever you like. The reasons
    to install Linux instead of just running it from a USB drive or virtual disc are
    productivity and convenience. Once Linux is installed, it will remember your settings,
    keep your installed software, and maintain your files between reboots.


    When ready to take the plunge, installing Linux on your PC is easy. Just launch
    the installer provided in the Linux environment. You can wipe away your existing
    Windows system and replace it with Linux, but installing it in a "dual-boot" configuration
    or Ubuntu installer parlance. The installer will resize the partition of Windows
    to make some additional space for Linux. Then, you can select which operating
    system you want to use when you boot your computer. You can choose to install
    Windows in a virtual machine too.


    Software installation on Linux works differently from software installation on
    Windows. In fact, there is no need to open a web browser to search for applications,
    but you can look for the software installer on your system. Your Linux distribution
    hosts its own so-called "software repositories," which contain software compiled
    to work with it. The software is tested and provided by the Linux distribution.
    If security patches are necessary, Linux distribution will provide them to you
    in a standard way.


    Every distribution has command-line tools that can do the same thing. Even though
    it can be intimidating for newbies, we recommend users familiarize themselves
    with installing applications from the command line, even if they prefer using
    the GUI. If an installation fails, you can use the command line that offers hints
    as to why the installation failed.


    To sum up, a distribution is a Linux operating system shipping with every software
    to provide you with a complete experience. They provide the `kernel`, hardware
    drivers, and applications too.


    Distributions come in every form. Some of them are aimed at new users, whereas
    others are geared toward the most diehard of command-line junkies. Three general-purpose
    distributions good for people with all skill levels are `Ubuntu`, `Fedora`, and
    `OpenSUSE`.


    Many other Linux distributions are available, and each one is a bit different.
    Some distributions are fine to set to serve a particular niche. In doing so, you
    can install an operating system built for multimedia creation or created for computers
    with old hardware.


    Hardware compatibility is perhaps the most important thing to consider when switching
    to Linux. While most hardware is supported by default in most Linux distributions,
    less popular or quirky hardware might not work. Most of the time, even if your
    device isn''t supported by default, you can follow online tutorials that take
    you through installing an unsupported driver or patching the `kernel` — but that''s
    a task suited for everyone.


    Some applications, particularly closed applications like `Google Chrome`, `Steam`,
    `Skype`, `Minecraft`, and others, may have to be installed outside your Linux
    distribution''s package manager. Check your package manager first and see what
    apps may be available through your repositories.


    If you can''t find the app you need, you can download these applications from
    their official websites, just as you would on Windows. Be sure to download the
    installer package designed for the Linux distribution you are using.


    Open-source software doesn''t cost money, and everyone is free to look at the
    source code and modify it as they please. This means that skilled developers worldwide
    give their work either for free or via sponsorship from big companies.


    In contrast, the Windows source code is available only to `Microsoft` employees.
    You cannot be able to build your version of Windows `kernel`, fix bugs, or distribute
    an improved Windows version you created.


    Linux is different, and the `GNU General Public License` is part of why this license
    provides the legal grounds for your rights to the software. It ensures that even
    when a work is modified, it remains in the public domain for other people to use
    and enjoy. It is the most widely used license in the common community.


    It is hard to imagine how many people use Linux today. The rank on the popularity
    of each distribution''s website is vast and large. This gives the impression of
    what people are interested in, but it is hard to represent which distributions
    are the most used worldwide. For example, `Ubuntu` is not currently ranked as
    number one, but it is widely considered the most popular version of desktop Linux.


    # Chapter Three: Linux Commands & Architecture


    The crux of Linux lies in the usage of the command line to achieve goals. This
    is one of the biggest appeals of using any Unix-based system. This section will
    be relatively short and will refer to the Linux command line''s navigation and
    usage. We''ll be really taking advantage of writing scripts that will automate
    many basic functions in the next section.


    This section is basically going to go into a lot of the things that you can use
    to make life easier in Linux using the command line. The first thing you need
    to know is that everything in this part can be used in the `Terminal`. You can
    always open `Terminal` by going to your Applications panel then finding it either
    under `System` or `Utilities`.


    There are different commands you can use in the command line. Traversing these
    is the first step to getting a more intimate feel of your Linux operating system.
    However, do be aware that this reading is just going to cover the very tip of
    the iceberg. People write several-hundred-page books about command-line commands.
    This section will give you a cursory overview of the things you''re going to find
    most useful without going into too exacting of detail.


    ## Directory commands


    These are intended for both getting around and knowing where you are. The first
    command here is `PWD`. `PWD` stands for `print working directory`. If you type
    in `pwd` to the `Terminal` and then press enter or return, it''ll print the directory
    that you''re within.


    What''s a working directory? A working directory references the folder that you''re
    working within in your `Terminal` instance. You can move your working directory;
    we''ll get to that in just a second.


    The next command for directories is `ls`. `ls` will list the different files and
    folders available within the directory that you''re working on. The most popular
    argument for `ls` is `-l`, which will list everything. To use this command, you
    have to specify the directory. `../ls` would list all things in the given path.


    Meanwhile, `ls /applications` would list all things in your applications folder.


    Yet another command for directories is `cd`. `cd` stands for `change directory`,
    and this is super important to you navigating. `cd..` will move you up on folder,
    while `cd folderName` will move you into any folder in the current directory.
    You can also use it to move across the hard drive easily.


    ## Creation and Deletion


    These commands will allow the user to create and delete things. `mkdir` is a powerful
    tool that allows the user to create a new directory. `rmdir` allows the user to
    delete a directory. However, it cannot delete a directory full of files. `rm`
    allows the user to delete the given files. `touch` allows you to create a new
    file. `tar` allows you to create a new tar archive - `tar cvf nameOfArchive.tar
    directory/`… and extract from a tar: `tar xvf nameOfArchive.tar`… and view an
    existing tar: `tar tvf nameOfArchive.tar`.


    ## Searching and Retrieving


    `cp` allows you to copy files from one directory to another. `mv` lets you rename
    one file to another, overwriting the second file.

    '
