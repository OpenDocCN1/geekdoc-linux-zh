    Google Chrome and Firefox. The difference is that it works differently. You have
    to travel through different overlay networks when you are using Tor or The Onion
    Router. Just like an onion, it has several layers to pass through. The speed of
    Tor is usually slower than other browsers. If you can access to a Virtual Private
    Network, it''s wise to ensure optimum security.To clear the longstanding confusion,
    Tor is not a dark web but a tool to access the dark web. Also, Tor can be used
    to access general webspace such as Google and Yahoo, and your travel through the
    surface web will be more secure. Rather than a place for illegal activities, the
    dark web is considered a place for a high online privacy level. You can buy illegal
    drugs through on the dark web and get them delivered to your postal address without
    giving anyone a hint as to what was in the package. The ultimate objective to
    achieve by using the dark web depends on what you need, whether you are ready
    to take the risk of committing an illegal act.For residents of countries such
    as Iran, where the government control over the internet is touching extreme levels,
    the dark web becomes a necessity. Residents from these countries access Facebook
    and Twitter through the dark web. They log into their onion versions that have
    been officially launched for users who are subjected to censorship.Chapter Four:Common
    CyberattacksCyberattacks are getting highly sophisticated as hackers are coming
    up with the latest and innovative methods to stage an attack and threaten different
    computer networks'' security. The attacks are getting so much sophisticated that
    they are getting tougher to detect. Consequently, the attacks are getting more
    lethal than they were ever before.Cybersecurity doesn''t depend on the size of
    your organization. Whether you have a start-up business or a multimillion-dollar
    company, you should be able to be aware of how risky a cyberattack can be. The
    rise of cyberattacks gives room to the question of why do hackers attack cyberspace?
    What is the motivation behind such heinous attacks? A general perception is that
    financial gain drives them to stage high profile cyberattacks on big corporations''
    computer systems. Some also do that for espionage purposes. This chapter will
    shed light on hackers'' motivations on their backs to penetrate an individual
    computer or an enterprise computer.Most of the time, the attack is a kind of breach
    that aims at infiltrating the credit and debit card details. This information
    is then sold on the dark web later to bag heavy profit. The story doesn''t end
    here. In a majority of cases, profit is just a smokescreen to hide something bigger
    and deeper.Espionage is also linked to a breach of data of a corporation or an
    official website of a country. These kinds of attacks typically are aimed at retrieving
    information from the victim. Many things remain the same when it comes to espionage
    through a cyberattack, including monitoring communication running on cyberspace.
    There is another popular technique in espionage known as stealing secrets. Earlier
    on, this task came into the domain of individuals who physically penetrated the
    space and compromised certain assets found inside the organization. To give you
    a taste of how it all happened, I''ll state an example from Hollywood. If you
    are an admirer of Tom Cruise and his spy thrillers, you might for sure be acquainted
    with the character of Ethan, who was always on some kind of mission to infiltrate
    a facility and steal some important documents that could turn the tables on the
    bad guys. Spy is the word that they use for such kind of person. Nowadays, things
    are different. There is hardly anything left in the physical domain. The craft
    of stealing an important bunch of information is more about being electric. Computers
    have the capacity to consume billions of files that were once stored in the company''s
    ledgers and on loads of papers.An offensive action targeting computer systems,
    networks, infrastructures, or personal devices to alter, steal, or destroy data
    and computer systems is called a cyber-attack. Although each cyber-attack is different,
    many similarities exist, such as the approach and strategy used. Many criminals
    who launch cyber-attacks use hacking techniques that have proven successful in
    the past while considering the nature of the target and the attack. In this chapter,
    various types of cyber-attacks are discussed in depth while also shedding light
    on the damages they usually cause.Denial-of-Service (DoS) & Distributed Denial-of-Service
    (DDoS) Cyber-AttacksA DoS attack attacks computer systems by overwhelming their
    resources that affect computer systems'' ability to respond to service requests.
    Similarly, a DDoS attack overwhelms a computer system''s resources. However, a
    DDoS attack is launched using multiple host computers infected by the attacker
    with malicious software.Unlike many cyber-attacks, Denial-of-Service attacks do
    not offer attackers direct benefits by increasing or gaining access to a computer
    system and its data. Service denial is the purpose of a DoS or DDoS attack instead
    of control or data theft. Some businesses use Denial-of-Service attacks to interfere
    with the services provided by their competitors. Furthermore, DoS or DDoS attacks
    are also used to cause system downtime so that the particular system can be attacked
    once it''s offline.TCP SYN Flood AttacksAttackers utilize the buffer space in
    the Transmission Control Protocol or TCP session initialization handshake in this
    type of attack. The target system is flooded with connection requests by the attacker''s
    device. However, the attacker''s device does not respond to the target system''s
    replies to its requests. As a result, the target computer system times out upon
    waiting for responses from the attacker''s device, leading it to become unusable
    or even crash due to the filling up of connection queues.Smurf AttacksThe target
    network is saturated with traffic by the attackers using ICMP and IP spoofing
    in a Smurf attack. ICMP echo requests are used in this method directed at broadcast
    IP addresses. The attacker creates spoof ICMP echo requests from a spoofed IP
    address giving the broadcast IP addresses the impression that the target victim
    is sending the request.Multiple requests are sent to broadcast IP addresses, and
    the target address receives multiple responses that overwhelm it. Spoofed ICMP
    echo requests are automated and generated in bulk by the attacker, causing serious
    network congestion that forces the target network to deny services.Ping-of-Death
    AttacksThe maximum size of an IP allowed is limited to 65,535 bytes. The attackers
    use fragmented IP packets resembling the target system. These IP packets cause
    crashes and buffer overflows, disrupting the services provided by the target computer
    network. However, Ping-of-Death attacks can be successfully overcome using a firewall
    that makes sure any fragmented IP packet meets the maximum size allowed.BotnetsHackers
    infect millions of systems and gain control over them to be used as bots to launch
    DDoS attacks. The target system or network is attacked using these bots or zombie
    systems under the control of the attacker. Attackers often use botnets to overwhelm
    the bandwidth of the target system and its processing capabilities. DDoS attacks
    are usually difficult to trace since they use infected bots or computer systems
    located in numerous geographic locations.Phishing AttacksThese cyber-attacks are
    carried out by sending highly realistic emails that seem to be from trustworthy
    sources to gain sensitive personal information from the receivers or influence
    them to carry out an action the attackers desire. Therefore, phishing is a combination
    of technical trickery and social engineering. Emails sent out by attackers may
    include attachments loaded with malware that infect computers upon the receiver
    opening or downloading them. Some phishing emails include links to websites that
    trick receivers into downloading or installing malware or submitting their personal
    information.Spear phishing is an addressed form of phishing that involves attackers
    undertaking detailed research into targets to produce messages that tend to be
    important and personal. Spear phishing, as a result, is difficult to identify
    with many receivers failing to defend their computers and networks against attacks.
    A common yet simple method utilized by the hackers in spear-phishing is spoofing
    the "From" section of an email, giving it the appearance that it has been sent
    from someone that the target knows, such as a coworker or the management of their
    company.Spear phishing attackers also add credibility to their attempts by cloning
    websites. The practice involves copying legitimate websites to mislead the target
    so that they attempt to enter the cloned website by submitting their sensitive
    information such as usernames and passwords that the attackers later used to gain
    entry to the account of the target on the legitimate website.One of the simplest
    ways to counter phishing is by using critical thinking. Carefully inspecting emails
    and the email address of the sender is usually sufficient to identify a phishing
    attempt. If a suspicious email includes links, the user can simply hover the mouse
    over the link without clicking it to inspect the URL that the link is directing
    to. Email headers such as "Reply-to" also help identify phishing emails since
    they directly lead to the sender''s email that can then be easily inspected. Furthermore,
    links and attachments contained within an email can be safely inspected in a Sandbox
    environment.Man-in-the-Middle (MitM) AttacksThese attacks place the attacker between
    clients and servers'' communication, enabling them to interfere and tamper with
    those communications, including requests and responses. Various types of MitM
    cyber-attacks exist.Session HijackingAttackers launch these attacks by hijacking
    sessions between trusted clients and network servers. The attacking computer uses
    the trusted client''s IP address while the server proceeds with the session under
    the impression that it is communicating with the client. This confusion caused
    by the attack enables the attacker to communicate with the server and carry out
    their intentions without the actual client or the server being aware of what is
    happening.IP SpoofingAttackers mislead systems by used spoofed IP addresses to
    gain access to a system. The system believes that it''s communicating with a trusted
    entity due to the spoofed IP address. IP packets are used to send the spoofed
    IP source addresses to target hosts that accept and respond to the attacker''s
    requests in some environments with poor cybersecurity measures.ReplayThese attacks
    are carried out by impersonating the participants of a conversation or a communication
    threat that has already taken place. The attackers save previously sent messages
    and send them again, impersonating one of the conversation participants. However,
    replay attacks can be easily identified and dealt with by inspecting the messages
    and nonce''s timestamps.Malware AttacksAny unwanted software installed in a computer
    without the user''s consent or the administrator of the said computer is called
    malware. These malicious software attaches themselves to the system''s legitimate
    codes and its useful applications while replicating across the internet. Many
    types of malware exist with various capabilities and intentions.Macro VirusesThis
    type of malware infect commonly used software such as Microsoft Word and Excel.
    They infect a computer by attaching themselves to the initializing sequence of
    a trustworthy application. They are installed on the computer without the user
    noticing, thus without the consent of the user. When the unsuspecting user opens
    the particular application, the virus attached to it takes control of the application
    and replicates itself by attaching to the computer''s system code.File InfectorsThese
    viruses usually sneak into computers by attaching themselves to executable (.exe)
    files. When the unsuspecting user loads the executable file, the virus is installed
    on the computer without knowing. Some file infectors create virus files with the
    same name as a trustworthy application as an executable file. When the file is
    opened, the virus springs into action and executes its intended procedures.Boot-Record
    or System InfectorsThese viruses attach themselves to the master boot record located
    on the hard disk of a computer. The virus is activated when the system starts.
    It looks at the computer''s boot sector and loads itself to the system memory,
    where it infects other disks and computers.Polymorphic VirusesDifferent sequences
    of encryption and decryption are used to conceal these viruses where they proceed
    to infect a certain code area. These viruses are repeatedly encrypted and decrypted,
    making them decrease power as changes to their source changes repeatedly. However,
    they are very difficult to detect.Stealth VirusesSystem functions are used by
    stealth viruses to conceal themselves by compromising software intended to project
    a computer from malware. The malware detection software wrongly reports that an
    infected area is being uninfected. Furthermore, stealth viruses can hide the increases
    in the infected file''s size or the dates and times of modifications to the file.Logic
    BombsThis malicious software is programmed to be activated by a specific occurrence
    on a computer. The existence of logic, such as specific data, time, or any other
    occurrence to trigger them, has given them the name "Logic Bombs."TrojansAlso
    known as Trojan Horses, these programs hide in trustworthy and useful programs
    while performing malicious functions. However, unlike viruses, Trojans do not
    self-replicate themselves. Trojans can launch attacks on a computer and establish
    back doors that are later exploited by attackers.WormsThese attacks are different
    from virus attacks since they do not attach to any host files. Instead, they are
    programs themselves. Worms are circulated using emails, and opening the attached
    worms activates them. Then they spread throughout computers and networks. Worms
    usually send a copy of themselves to every contact found in the affected computer''s
    email address other than carrying out the malicious activities they have been
    programmed to. Worms are used to spread across the internet and overload email
    servers that result in multiple DoS attacks against the particular network.DroppersThese
    are programs that infect computers by installing viruses in them. Droppers usually
    do not carry malicious code themselves. However, they are still detected by most
    anti-virus software. Some droppers are so advanced that they can connect to the
    internet and download any updates to viruses that they help install.RansomwareThis
    type of malware is intended to block access to the target user''s data. The program
    then threatens to erase or publish the data if the user fails to pay the ransom
    by following the instructions that it provides. Some ransomware can lock a computer
    in such a complex manner that removing them or recovering the data is often impossible
    without paying the ransom.Such a level of complexity is achieved using a technique
    known as Cryptoviral Extortion. The technique encrypts the data so that it''s
    almost impossible to recover without the exact encryption key. Most ransomware
    ends up receiving their ransom as users are forced to protect their data and privacy.SpywareThis
    type of malware is intended to collect important information about the infected
    computer or network users. Some of the data that is often collected include user
    browsing habits and sensitive information at times. Spyware can track any computer
    activity without the knowledge of the user and send the collected data to remote
    attackers. They can also download other malicious software from the internet.
    Spyware is installed on a computer without the user''s knowledge and consent when
    the user installs other freeware programs.AdwareThese software applications are
    used by marketing companies to advertise products and services by infecting computers.
    The infected computers end up displaying advertising banners irrespective of the
    program that is running. Adware is usually downloaded to a computer automatically
    when the user browses the internet. They usually use pop-up windows and bars to
    display advertising when it is being used.SQL injection AttacksThese cyber-threats
    have been a widespread problem for websites that are driven by databases. They
    come into effect when the malefactor executes an SQL query to a website database
    with data input from the client to the server. Various SQL commands are then inserted
    into the data-plane input so that predefined SQL commands can be run. A successful
    SQL injection attack can gain access to sensitive data in a database and insert,
    update, or delete data.Furthermore, they can force the execution of administrative
    operations on the database, such as shutdowns and file recovery. Some attacks
    can also issue commands to the infected computer''s operating system. The vulnerability
    of computers to SQL injection attacks is caused by the fact that SQL does not
    differentiate between data planes and control. Therefore, these types of attacks
    are carried out through websites that use dynamic SQL.Password AttacksPasswords
    are the most widespread method to authenticate users to computer systems. Therefore,
    obtaining passwords have motivated attackers since having access to a user''s
    password would mean straightforward access to the particular computer system.
    Hackers use various methods to steal passwords, and one of the most common ways
    of achieving that is by looking through the user''s files.Users who practice better
    cybersecurity practices do not leave their passwords lying around in their computers.
    In such situations, hackers use "sniffing" that acquires passwords with social
    engineering''s smart use. Brute-force password guessing involves a random approach
    where numerous different passwords are guessed using a set of logic such as the
    user''s name, date of birth, hobbies, job title, and other important facts and
    figures.Dictionary attacks utilize a database of common passwords. These passwords
    are encrypted and trials repeatedly in the hope of coming across the correct password
    of the targeted user. Account lock-out policies are highly recommended to protect
    users from various password attacks. The policy locks the computer upon reaching
    a certain number of incorrect password attempts. There are various lock-out policies
    out there that individuals and organizations implement varying in complexity.Drive-By
    AttacksThese cyber-attacks are one of the most common ways of spreading malware.
    Many websites on the internet are not secure. Hackers identify such websites and
    plant malicious scripts into their PCP or HTTP codes. These malicious scripts
    can directly install malware onto the computers of those who visit these insecure
    websites. Some of the websites used by hackers redirect users to other websites
    controlled by hackers where their computers are infected.Furthermore, one''s computer
    can face a drive-by attack when viewing emails or through pop-up windows. One
    of the main reasons that expose users to drive-by attacks is the fact that they
    don''t require the user to take a certain action for an attack to take place other
    than visiting an insecure website. There is no need to clіck on any button, link,
    install any program, or open a malicious link or executable file attached to an
    email.Drive-by attacks use security flaws of various operating systems and web
    browsers, especially those that haven''t been regularly updated. Therefore, computer
    users and those who browse the internet, especially insecure websites, can protect
    themselves from drive-by attacks by keeping their operating systems and browsers
    updated. Furthermore, it is recommended that internet users limit or completely
    avoid insecure websites.However, some hackers can infect the most secure websites.
    Therefore, many internet users are exposed to drive-by attacks. The removal of
    unnecessary apps and programs from devices has also helped decrease the risks
    of drive-by attacks. Computers with many plug-ins tend to be more vulnerable to
    these attacks as they exploit those plug-ins to achieve their malicious intentions.Eavesdropping
    AttacksThese attacks intercept network traffic intending to gain credit card numbers,
    passwords, and other sensitive information that users usually send over network
    traffic. Eavesdropping can be divided into two categories as passive and active
    eavesdropping.Passive eavesdropping is when a hacker listens to the messages transmitted
    through a network to gather sensitive information belonging to users. On the other
    hand, active eavesdropping is when a hacker disguises himself/herself as a friendly
    entity to gather information from the users. The hackers send queries pretending
    to be a trustworthy entity and gain the information that they are after. Active
    eavesdropping is also known as scanning, probing, and tampering.It must be highlighted
    that it is more important to identify or detect passive eavesdropping attempts
    than active ones as they are more difficult to detect and can cause more damage.
    Active eavesdropping takes more work since the attacker needs to learn about a
    friendly entity known by the particular target user, which is usually achieved
    by passive eavesdropping.Therefore, detecting passive eavesdropping attempts can
    protect one''s information and eliminate the chances of active eavesdropping taking
    place. The encryption of data is one of the most effective methods of overcoming
    passive eavesdropping attacks.Birthday AttacksThese attacks are designed to infiltrate
    hash algorithms that protect the integrity of messages, digital signatures, and
    software. A message is usually characterized by a message digest (MD) that has
    a fixed length. A hash function creates the MD of a message, and it does not depend
    on the length of the message.Birthday attacks are carried out by finding two random
    messages that produce the same MD through a hash function. Attackers achieve this
    goal by calculating the MDs for random messages that they create and compare those
    MDs with those created for messages sent by users.If an attacker has an MD, which
    is the same as the MD assigned for a message sent by the target, the attacker
    can replace its message with his random message. What makes birthday attacks dangerous
    is detecting such attacks even if the target compares MDs of the messages since
    they are the same.Cross-Site Scripting (XSS) AttacksThese cyber-attacks utilize
    third-party web resources to execute malicious scripts in web browsers and applications
    that use scripts. Payloads of malicious JavaScript are injected into the databases
    of websites by the attackers. When a user visits such a website, the website''s
    pages are transmitted to the user''s browser, including the payload injected by
    the attacker, which is transmitted as a part of the HTML body.The victim''s web
    browser then executes the script that is transmitted that includes the malicious
    scripts. These malicious scripts usually send the cookies that belong to the victim
    to the attacker''s server. The attacker can then use the cookies for session hacking.
    When XSS is used to detect vulnerabilities, the consequences can be costly. Identification
    of vulnerabilities allows attackers to log keystrokes, collect network information,
    capture screenshots of the victim''s screen, and even remotely access the victim''s
    device and control it other than stealing cookies.JavaScript is widely used by
    attackers for XSS attacks, although Active X, Flash, and VBScript are also used.
    Most attackers prefer JavaScript due to its popularity on the web. One of the
    best ways to decrease the chances of XSS attacks is by sanitizing users'' data
    inputs in HTTP requests before responding to them.All the data is filtered, validated,
    and escaped in such a scenario before it is transmitted back to the user, including
    the query parameter values. Giving users the ability to disable client-side scripts
    is also an effective way of overcoming XSS attacks.Chapter Five:Cyber ThreatsCyber
    threats come in many guises, from personal identity theft to corporate hijacking
    to institutional/national security hacks. As technology advances, it seems that
    the ranks of invaders—even computer terrorists— grow just as quickly. Basically,
    these threats break down into three categories.Attacks on confidentiality: Credit
    card fraud is rampant in our world, as is identity theft. Both are criminal acts
    and inherent invasions of privacy; personal information is released to a potential
    ever larger group of hackers. The person who was attacked must rectify the situation
    to great inconvenience. On a more public, more dangerous level are spies who focus
    on nations or states. Their activities focus on obtaining confidential data for
    military, economic, or political gain.Attacks on integrity: Integrity attacks,
    or sabotage, aim to damage or obliterate systems or information and those who
    use and rely on them. They can be as subtle as a typo or as blatant as an out-and-out
    smear campaign to destroy the target.Attacks on availability: The use of ransomware
    or denial-of-service are attacks on availability. The ransom comes into play when
    a price is demanded to decrypt the target''s data, while denial-of-service swamps
    a network resource with requests, making the service unavailable.More specifically,
    here are some ways that these attacks are carried out.A backdoor, also known as
    a cryptosystem or algorithm, is a way to bypass normal security controls such
    as passwords. They can be authorized (as for a specific purpose) or added by an
    attacker. In any case, they create a vulnerability.To make a computer or resource
    unavailable, denial-of-service attacks can occur when incorrect passwords are
    entered multiple times, locking the account or overloading the system with requests
    and blocking all users. These attacks can stem from zombie computers or even from
    duping innocent systems into sending unwanted traffic.Eavesdropping is exactly
    what it sounds like—listening to private communications between network hosts.
    Certain programs are used by government agencies to "audit" ISPs. This widespread
    practice extends to closed systems when electromagnetic transmissions are monitored.Masquerading
    through falsifying data to gain access to unauthorized data is called spoofing
    and comes in many forms: email spoofing, forgery of a sending address; MAC spoofing,
    changing the Media Access Control address to pose as a valid user; biometric spoofing,
    faking a biometric sample; IP address spoofing, altering the source IP address
    to hide identity or impersonate another system.Through physical access or direct-access
    attacks, a perpetrator can copy data, compromise security, install listening devices
    or worms, and more. Even protected systems are vulnerable to this type of attack.Phishing
    frequently uses email spoofing or instant messaging to direct users to enter confidential
    information by looking almost the same as legitimate sites.An attacker can escalate
    their access level through privilege escalation by fooling the system into granting
    access to restricted data or resources.Clickjacking is literally hijacking a user
    to click on a link or icon to another website other than the intended one. Particularly
    sneaky, clickjacking routes the clicks, or sometimes keystrokes, to an irrelevant
    page.By impersonating an institution, bank, customer, or other entity, social
    engineering leads users to reveal passwords, credit card numbers, and other private
    information. This scam reportedly costs U.S. businesses more than $2 billion every
    two years.Without computers, the world would slip back into the pre-Industrial
    Revolution mode. Technology has streamlined every aspect of life, particularly
    for businesses and other public entities, some of which are more and more at risk.Financial
    authorities, investment banks, and commercial banks are recruiting cybercriminals
    who see an avenue for market abuse and illicit profits. Any website that allows
    the conversion of funds or purchasing of products is also a priority, as ATMs
    are regularly hacked for consumer details and PINs.Utilities and Industry: Vital
    services, including the power grid, nuclear power plants, water and gas networks,
    and telecommunications are controlled by computers. It has been proven that even
    those controlled by computers not connected to the Internet are vulnerable to
    attack.Aviation: One power outage at a major airport can have a tumultuous ripple
    effect on air traffic. Radio transmissions would be disrupted, and an in-plane
    attack can occur, loss of system integrity and aircraft, and air traffic control
    outages are just some of the possible outcomes.Personal devices: All of those
    wonderful gadgets that people use to simplify life—smartphones, tablets, smartwatches,
    activity trackers—can be exploited through built-in cameras and other devices.
    Attackers can collect health other personal information or use the device networks
    as paths to an attack.Corporations: Identity theft and data breaches such as credit
    card information have been aimed at large corporations such as Target Corporation
    and Equifax. In some cases, foreign governments attempt to spread propaganda or
    spy through attacks. Health insurance fraud, which costs everyone, impersonates
    patients to obtain drugs for illicit purposes, which is also common. Despite these
    activities, 62% of all organizations did not augment security training in 2015.Autos:
    Today''s vehicles practically drive themselves, and the day when this common is
    not far off. Cruise control, airbags, anti-lock brakes, and other features make
    driving more enjoyable and, hopefully, safer. WIFI and Bluetooth keep the cars
    connected and raise the possibility of security breaches.Government: Attacks on
    government and military systems create chaos, disrupt services, and—to the extreme—
    qualify as acts of terrorism. Whether it is an activist, foreign government, or
    other hackers, the result is infrastructure malfunction of personnel records,
    police and other first responder communications, student records, traffic controls,
    and financial systems. Widespread computerization of personal identity items such
    as passports and access cards also lead to vulnerability in this area.Internet
    of things (IoT): Physical objects that carry sensors, software, or any network
    connection to store and share data are part of the Internet of things. A building,
    vehicle, or appliance can comprise the IoT, and the proliferation of this modern
    phenomenon creates the possibility for physical—not just virtual—threat. For instance,
    a stolen cellphone can unlock a residence or hotel room door.Medical systems:
    Viruses, breaches of sensitive medical data, diagnostic equipment, and other devices
    are potential attacks. These threats are deemed so likely that, in 2016, the U.S.
    Food and Drug Administration created guidelines for the secure maintenance of
    manufacturers of medical devices. However, no recommendations or structure for
    implementation were included.MalwareThe malware of one type or another is the
    single largest threat to the average organization''s daily operations, offering
    the potential to directly impact critical data and assets'' availability. As such,
    if they hope to combat this threat effectively, organizations both big and small
    need to increase their vigilance while at the same time evaluating their capabilities
    when it comes to response, detection, preparation, and planning for potential
    threats. As new types of destructive malware are certain to evolve, it is critical
    to understand how your organization will prepare for known threats and how it
    will prepare for the unknown as well.Distribution vectors: Potentially destructive
    malware frequently has the ability to target large-scale systems that can then
    potentially execute simultaneously at multiple points throughout a given network.
    As such, organizations must regularly assess their operating environments for
    atypical channels that could indicate potential malware propagation or delivery.
    Systems worth keeping an eye on including the following.Enterprise applications,
    especially those that have the potential to interface directly with multiple hosts
    and endpoints. Common examples include patch management systems, asset management
    systems, remote assistance software, antivirus software, centralized backup servers,
    file shares, and network administrative systems.While not limited to just malware,
    the following threat actors could compromise resources that would ultimately impact
    critical applications'' availability. This type''s potential threats include centralized
    storage devices, high-risk partitions or data stores, network devices, routing
    tables, and crucial network resources.Strategies for success: While there are
    plenty of potential malware vectors that the average organization needs to deal
    with regularly, there are also numerous different strategies that make keeping
    malware at bay far more manageable. The first of these is ensuring a viable communication
    flow at all times. This means you will also need to ensure proper network segmentation
    at all times and also ensure that any control lists that are network-based are
    properly configured to ensure that they permit server-to-host and host-to-host
    connectivity via the minimum scope of ports and protocols and that directional
    flows for connectivity are represented appropriately.It is also crucial to еnsure
    that the information flow pathways are not only well established but are also
    approved or reported. From there, you would want to expand understanding of systems
    that can be used as a portal to rotate sideways as required or link directly to
    relevant endpoints located everywhere in the enterprise. Whatever you do, it is
    necessary to do what you can to ensure that these networks are managed within
    these restrictive VLANs with sufficient network access control and segmentation
    as required.Where it comes to having the right level of control over who has access
    to what, it is critical that enterprise applications that can communicate with
    multiple endpoints directly all need dual-factor authentication for any interactive
    login. Furthermore, it is necessary to ensure that approved users are confined
    to a particular subset of the employees of the company. Whatever you do, the default
    user community must not be able to authenticate or explicitly control these programs.You
    would also need to ensure that specific domain accounts are documented and used
    for any service that includes an enterprise application. The sense in which these
    permissions are issued to separate users should always be fully recorded and configured.
    The highest number of accounts having the least number of rights possible. This
    allows the organization to track and control actions performed on the basis of
    assigned service accounts.This is why it is important to avoid providing a service
    account with either interactive or local login permissions. In fact, service accounts
    should be expressly denied these types of permissions, especially if access to
    critical data locations or important network shares. Additionally, accounts that
    are used to authenticate centralized servers should not contain downstream systems
    that have elevated permissions as this could allow a system that is far easier
    to compromise to infect a system that is typically far better protected.Recovery
    planning: A business impact analysis is crucial for preparing a contingency plan
    if your system is attacked seriously. This plan should provide your organization
    with two key components, interdependencies and classification and characterization
    of relevant components. To plan for this type of scenario, an organization needs
    to address the accessibility of available resources, including mission-critical
    applications and systems, contact information for crucial external contacts, contact
    information for essential personnel, and a secure communication channel for each.
    It is also important to have all major vendor contact details and points of contact
    regarding organizational procurement and backup ISO files for all critical applications
    and systems.Containment: If an organization experiences a large-scale outbreak
    of malware, the immediate focus should be on containment above all else to reduce
    the scope of the attack overall and minimize the likelihood that additional systems
    will be impacted. To develop a strategy for containment, the best place to start
    is by determining the vector or vectors common to all of the systems that are
    experiencing problems that could have been used to deliver a malicious virus.
