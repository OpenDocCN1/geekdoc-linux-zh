- fmt: '

    The command basically defines the program that you want to execute. The options
    that follow the command can be none, one, or more. The options govern the behaviour
    of the command and define what the command will do. Options are usually used with
    one dash or two dashes. This is done so that we can differentiate options from
    arguments. Example: `-a` or `--allArguments` also follow the command on the command
    line and can be one or more like options. Arguments indicate the target on which
    a command is supposed to operate.


    Let us take an example command `usermod -L John`. The command in this example
    is `usermod`, the option is `-L`, and the argument is `John`. What this command
    does is locks the password of the user `John` on the system.


    To be effective with the command line''s commands, a user needs to know what options
    can be used with a particular command. If you run the `--help` option with any
    command, you will get a set of options, which can be passed with that particular
    command. It''s not necessary to know all the options that are to be used by all
    the commands by heart. The list will also tell you what each option does.


    The use of statements can sometimes seem very difficult and complicated to read.
    Once you get used to certain conventions, reading the statement becomes much easier.


    Options are surrounded by square brackets `[ ]`.

    If a command is followed by `…` it specifies the arbitrary length list of items
    belonging to that type. If there are multiple items and if the pipe separates
    them `|` it implies that you can specify only one of them.


    Variables are represented using text, which is in angle brackets `<>`. So if you
    see `<filename>`, you have to replace it with the filename you wish to pass.


    For example, check the below command: `[student@desktop ~]$ date --help`

    ```

    date [OPTION]... [+FORMAT]

    ```

    This indicates that the command `date` takes the options represented by `[OPTION]...`
    with another option `[FORMAT]`, which will be prefixed with the `+` symbol.


    # Executing Commands on the Bash Shell


    The Bourne Again Shell, known as `bash`, interprets commands input by the user
    on the shell prompt. We have already learned how the string you type in a shell
    prompt is divided into three parts: command, options, and arguments. Every word
    that you type into the shell is separated using blank space. The program that
    is already installed on the system is defined by every command that you type.
    Every command has options and arguments associated with it.


    When you have typed a command on the shell prompt and the options and arguments
    and are ready to run it, you can press the Enter key on the keyboard, which will
    execute that command. You will then see the output of that command displayed on
    the terminal. When the output completes, you will be presented with the shell
    prompt again, which is an indication that the previous command has been executed
    successfully. If you wish to type more than one command on a single line, you
    can use a semicolon to separate the commands.


    Let us go through some simple commands used on a daily routine on the command
    line in Red Hat Enterprise Linux 7 and other Linux based operating systems.


    ## Date Command


    `date` command shows the date and the time of the system. You can also use this
    command to set the time of the system. If you pass an argument with the `+` sign
    for the date command, it indicates the format in which you want the date to be
    displayed on the output.


    ```

    [student@desktop ~]$ date

    Sat Aug 5 08:15:30 GMT 2019

    [student@desktop ~]$ date +%R

    08:15

    [student@desktop ~]$ date +%x

    08/05/2019

    ```


    ## Passwd Command


    `passwd` is used to change the password. However, you will need to specify the
    original password for the given user before you can set a new password. The command
    requires you to specify a strong password, making it necessary to include letters
    belonging to lowercase and uppercase, numbers, and symbols. You also need to ensure
    that the password being specified is not a word in the dictionary. The root user
    has the option to change the password of any other user on the system.


    ```

    [student@desktop ~]$ passwd

    Changing password for user students. Changing password for students.

    (current) UNIX password: type old password here

    New password: Specify new password here

    Retype new password: Type new password again

    passwd: all authentication tokens updated successfully.

    ```


    ## File Command


    File types and extensions are not specified in a Linux operating system. The `file`
    command can scan any file and tell you the kind of file it is. The file you want
    to classify needs to be passed as an argument to the `file` command.


    ```

    [student@desktop ~]$ file /etc/passwd

    /etc/passwd: ASCII text

    ```

    If you pass a folder/directory as an argument to the `file` command, it will tell
    you that it is a directory.


    ```

    [student@desktop ~]$ file /home/home

    /home: directory

    ```


    ## Head and Tail Commands


    The next set of commands are `head` and `tail`, which print the first ten lines
    and the last ten lines of a file. Both these commands can be combined with the
    option `-n`, which can be used to specify the number of lines you want to display.


    ```

    [student@desktop ~]$ head /etc/passwd

    ```

    This will print the first 10 lines that are there in the passwd file.


    ```

    [student@desktop ~]$ tail -n /etc/passwd

    ```

    This will print the last 3 lines that are there in the passwd file.


    ## WC Command


    The `wc` command is used to count lines, words, and characters in a file that
    is passed as an argument. It supports options such as `-l`, `-w`, `-c`, which
    stands for lines, words, and characters, respectively.


    ```

    [student@desktop ~]$ wc /etc/passwd

    30 75 2009 /etc/passwd

    ```

    This shows that there are 30 lines, 75 words, and 2009 characters in the file
    passwd. If you pass the `-l`, `-c`, `-w` options along with the `wc` command,
    it will only display the count of lines, words, or characters based on, which
    option you have passed.


    ## History Command


    The `history` command displays all the commands that you have typed previously
    along with the command number. You can use `!` mark along with the command number
    to expand what was typed in that command along with the output.


    ```

    [student@desktop ~]$ history 1

    1 clear

    2 who

    3 pwd

    [student@desktop ~]$ !3

    /home/student

    ```

    This shows that we used `!3` to expand the `pwd` command, which shows the present
    working directory for which the output is `/home/student`, which was the student
    user''s home directory.


    You may use arrow keys to navigate through the output given by the history command.
    Up Arrow will take you to the commands on top, and Down Arrow will take you to
    the commands below. Using the Right Arrow and the Left Arrow keys, you can move
    on the current command and edit it.


    # Shortcuts to Edit the Command Line


    There is an editing feature available on the command line in bash when you are
    interacting with bash. This helps you move around the current command that you
    are typing to make edits. We have already seen how we can use the arrow keys with
    the history command to move through commands. The following list will help you
    use edits when you are working on a particular command.


    - `Ctrl+a` / `Ctrl+e`: (Note: This) will take your cursor to the start of the
    command line.

    - `Ctrl+u`: Clear the line from where the cursor is to the start of the command
    line.

    - `Ctrl+k`: Clear the line from where the cursor is to the end of the command
    line.

    - `Ctrl+Left Arrow`: Take the cursor to the start of the previous word.

    - `Ctrl+Right Arrow`: Take the cursor to the start of the next word.

    - `Ctrl+r`: Search for patterns in the history list of commands used.


    # Chapter Eight: Blockchains


    Blockchain and Linux seem to be made for each other. Together, they make the fight
    against the repeal of net neutrality stronger. They present a paradigm of decentralization
    and enabling anyone to write and implement code. They really are a match made
    in computer heaven.


    ## Hyperledger


    The Linux Foundation is behind the creation of Hyperledger, a massive blockchain
    enterprise that helps businesses implement blockchain technology in their corporate
    infrastructures. The Linux Foundation announced its creation in December 2015,
    and in February 2016, announced its charter members. The goal of Hyperledger is
    to improve accountability and transparency in businesses through blockchain. Technological
    giants, such as IBM and Intel, have gotten behind the project and contributed
    to its core software.


    Private blockchains are controversial because they enable centralization. However,
    Hyperledger uses private blockchains, but they are not concentrated within any
    one business. For example, a bank that is part of the Hyperledger consortium does
    not get its own blockchain; it becomes part of a larger blockchain that encompasses
    multiple industries. Other companies are part of the verification process and
    provide data immutability adds a layer of accountability onto the private blockchain.
    It doesn''t become completely decentralized, but it is a few steps removed from
    complete centralization.


    There are multiple Hyperledger blockchains and blockchain frameworks. For example,
    Hyperledger Fabric is a blockchain framework that enables companies to create
    decentralized applications, some of which their customers and clients can access.


