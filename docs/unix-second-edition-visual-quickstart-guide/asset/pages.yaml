- pgno: 105
  md: '# CONTROLLING OWNERSHIP & PERMISSIONS

    5


    # Chapter Contents


    +   - Understanding file ownership and permissions

    +   - Finding out who owns what

    +   - Finding out which group you''re in

    +   - Changing the group association of files and directories

    +   - Changing ownership of files and directories

    +   - Changing permissions

    +   - Translating mnemonic permissions to numeric permissions

    +   - Changing permission defaults


    Unix and Unix-like operating systems are multiuser systems in which your files
    are separate from Jane''s files, which are separate from Joe''s files, and so
    on. Any file you create is separate from other users'' files and usually cannot
    be directly accessed by Jane, Joe, or any other user.


    Occasionally, though, you will need to share files. For example, you might be
    collaborating on a project with Jane where sharing files (rather than creating
    and maintaining separate ones) is essential.


    This chapter provides an overview of Unix file permissions and ownership. For
    many systems, though, only the root user can make ownership changes, so you may
    have to ask for help from your system administrator to actually do this.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Understanding File Ownership and Permissions


    Unix provides three levels of file ownership:


    +   - **User.** Refers to the single userid that''s primarily in charge of the
    file. You have this level of ownership for the files you create.


    +   - **Group.** Refers to the group (of users) associated with a specific file.
    All users within a group have the same permissions for interacting with a file.


    +   - **Other.** Refers to any users not identified with either the group or user
    for a file.


    Within these groups, you can specify permissions for file access and rights in
    three categories:


    +   - **Read.** Users with read permission can only view a file; they cannot make
    changes to it.


    +   - **Write.** Users with write permission can make changes to or delete a file.


    +   - **Execute.** Users with execute permission can run files (programs or scripts)
    and view directories.


    In this chapter, we''ll show you some of the commands that can be used (sometimes
    by you, usually by the root user) to set ownership and permissions. Keep in mind
    that you can set or change any permissions for files you create and possibly for
    files created by others; however, exactly which permissions and ownerships you
    can change depends on the system. Even if you don''t currently need to change
    file ownerships or permissions, you should take a quick read through this chapter
    to see what options might be available to you.


    # Tips


    +   - An interesting twist on this whole ownership issue is that not all "owners"
    are people. Programs or processes (discussed in Chapter 9) run as a specific user,
    and if they create files, those files have permissions reflecting the individual
    and group membership of the program. See Chapter 9 for more information.


    +   - Some Unix-like operating systems have additional or supplementary means
    of controlling access to specific files. Usually, though, you''ll know if such
    a system is in use. For now, just know that such things exist: the procedures
    in this chapter will handle 99 percent of your needs.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Finding Out

    Who Owns What


    Your first step in changing ownership and permissions is to find out who owns
    which files. You''ll need this information to find out if you can make changes
    to the permissions.


    # To find out who owns what:


    +   1. cd

    +   At the shell prompt, type cd to return to your home directory.

    +   2. ls -l

    +   Enter ls -l to see the long listing of the files in the current directory.
    (See Code Listing 5.1.)

    +   The left column contains ten characters, the last nine of which specify permissions
    for each file:


    continued on next page


    ```

    xmision> cd

    /home/users/e/ejray

    xmision> ls -l

    total 60

    drwx--x-x  2 ejray  users   512 Jul 21 13:32 Complete/

    drwx--x-x  2 ejray  users   512 Jun 24 09:23 Completed/

    drwx--x-x  2 ejray  users   512 Sep 15 1997 Mail/

    drwx--x-x  2 ejray  users   512 Jun 24 09:35 NewProject/

    drwx--x-x  2 ejray  users   512 Sep 15 1997 News/

    drwx--x-x  2 ejray  users   512 Sep 15 1997 access/

    -rw----  1 ejray  users   163 Jul 22 07:28 bogus2

    drwx---x  2 ejray  www    512 Jul 24 04:44 chat.conf/

    -rw-----  2 ejray  users   853 Sep 13 1997 dead.letter

    -rw----  1 ejray  users  14286 Jun 28 12:40 files

    lrwxrwxrwx 1 ejray  users    27 Sep 15 1997 ftp -> /home/ftp/pub/users

    -rw----  1 ejray  users     36 Jul 24 12:09 limerick

    drwx--x-x  2 ejray  users   512 Jun 8 13:32 mail/

    drwx--s-x 15 ejray  www   2560 Jul 10 18:30 public_html/

    drw--x-x  2 ejray  users   512 Jul 22 08:23 puppy/

    drwx--x-x  2 ejray  users   512 Jul 24 04:44 temp/

    -rw----  1 ejray  users     0 Jul 19 13:24 testme

    ```


    Code Listing 5.1 Many systems use only a few group names to allow easy file sharing
    and collaboration.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '+   ▲ r means read permission, w means write permission, and x means execute
    permission.

    +   ▲ The first set of rwx is for the user, the second set is for the group, and
    the last set is for other.

    +   ▲ A dash (-) instead of a letter indicates that the user/group/other does
    not have that level of permission. For example, rwx------ would mean that the
    user has read, write, and execute permission, while group and other have no permissions
    at all.


    The two columns in the middle indicate the file''s owner (in all likelihood your
    userid, for this example) and the group membership for the file. In Code Listing
    5.1, ejray is the owner of all the files. Most of the files are associated with
    the users group, while just a few directories are associated with the www group.


    On this system, files that individual users create are associated with the user''s
    group, while files destined for the Web have www group associations. On other
    systems, the default group for files might be a group with the same name as the
    userid, as shown in Code Listing 5.2.


    3. ls -l /etc

    You can also use the ls -l command on a system directory, such as /etc. Here,
    you''ll see that most of the files are owned by root, possibly with a variety
    of different group memberships (see Figure 5.1).


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_108_0.png)


    # Tips


    +   Sometimes you''ll see references to world-readable or world permissions. This
    is the same as other. "Other" just refers to not you, not the group, but anyone
    else.

    +   You might also hear of s or SetUID permissions, which indicate that the program
    or file can run with the effective userid of the file''s owner (usually root).
    For example, /usr/bin/passwd has s permissions because you can run passwd to change
    your password, but the command needs to run as root to actually modify the password
    database.

    +   You might also see a t at the end of the list of permissions, which indicates
    that the sticky bit is set. That means primarily that, in a shared directory,
    you can delete only your own files (and not accidentally delete files belonging
    to others).


    ```

    [ejr@hobbes permissions]$ ls -l

    total 152

    -rw-rw-r-- 1 ejr ejr 128889 Jul 24 14:33 sage.sayings

    -rw-rw-r-- 1 ejr ejr 23890 Jul 24 14:33 sayings

    [ejr@hobbes permissions]$

    ```


    # Code Listing 5.2 Sometimes the group name and user name are the same, depending
    on how the system was set up.'
  merge: -1
  img_proc: true
- pgno: 109
  md: "# Finding Out Which Group You're In\n\nIf you want to collaborate on a project\
    \ and share files, for example, you'll need to be in the same group with the other\
    \ people on the team. Your first step is to find out which group you're in, as\
    \ shown in Code Listing 5.3.\n\n# To find out which group you're in:\n\n+   1.\
    \ grep yourid /etc/passwd\n+   \n+   Here, grep yourid pulls your userid out of\
    \ the /etc/passwd file (which is where user information is stored) and displays\
    \ it as shown in Code Listing 5.3. From left to right, you see\n+   ▲ Your username\n\
    +   ▲ The encoded password (or nothing, or an x if the system is configured for\
    \ \"shadow\" passwords)\n+   ▲ Your userid (each user has a unique number in the\
    \ system)\n\n+   2. Note the number of the group.\n+   You'll need the number\
    \ to match it up with a group name in step 3. In this case, our group id is 500.\n\
    \n+   3. more /etc/group\n+   \n+   Here, we're exploring the contents of the\
    \ /etc/group file using more to see which groups are currently defined on the\
    \ system. As shown in Code Listing 5.4, the first column contains the name of\
    \ the group, the third contains the group number, and the last column contains\
    \ extra names the system administrator added to the group. Users can belong to\
    \ multiple additional groups, and this is how the additional group membership\
    \ is indicated.\n\n+   4. Match up the group number for your ID with the group\
    \ name.\n+   Our number was 500, which corresponds to the ejr group name here.\n\
    \n```\n[ejr@hobbes permissions]$ grep ejr /etc/passwd\nejr::oag2,lyCyJKEJNE:500:Eric\
    \ J. Ray:/home/ejr:/bin/bash\n[ejr@hobbes permissions]$\n```\n\nCode Listing 5-3\
    \ You'll find tons of information in /etc/passwd, including your default group\
    \ number.\n\n```\n[ejr@hobbes permissions]$ cat /etc/group\nknem::9:\nwheel::10:root,ejr\n\
    mail::12:mail\nnews::13:news\nuucp::14:uucp\nman::15:\ngames::20:\ngopher::30:\n\
    dip::40:\nftp::50:\nnobody::99:\nusers::100:ejr,deb,osr,owr\nfloppy::x:19:\npppusers::x:230:\n\
    popusers::x:231:\nslipusers::x:232:\npostgres::x:233:\nejr::x:500:\nbash::x:501:\n\
    csh::x:502:\nosr::x:503:\nowr::x:504:\ndeb::x:505:\n[ejr@hobbes permissions]$\n\
    ```\n\nCode Listing 5-4 The group file lists groups and additional members (as\
    \ shown in the users group)."
