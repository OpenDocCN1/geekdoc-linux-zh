    # Using Completion in the bash Shell


    One of the cool features of the bash shell is command argument completion, with
    which you can type just part of a command, press Tab, and have bash complete the
    command for you (Code Listing 3.8).


    # To use completion in the bash shell:


    +   1. ls -l

    +   Use ls -l to list the files in your current directory.

    +   2. cd pub Tab

    +   Type in a partial command, then press Tab to complete the command. In this
    example, we typed the cd command and part of the public_html directory (truncated
    to pub in the example), then pressed Tab to complete it (see Code Listing 3.8).


    # Tips


    +   - Completion works only if there''s only one possible match to the letters
    you type before you hit Tab. For example, if you type cd pu (for public_html)
    and there''s another subdirectory called puppy, the shell will beep and wait for
    you to type in enough letters to distinguish the two subdirectories.

    +   - You can use completion to complete commands, directory names within commands,
    and nearly anything else you might enter that''s sufficiently unambiguous.'
  merge: -1
