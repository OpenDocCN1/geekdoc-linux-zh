- pgno: 389
  md: '# COMMAND FLAGS


    This appendix provides a list of many (but certainly not all) Unix commands and
    programs as well as many of the related command-line flags.


    In general, flags offer a thorough selection of options for programs that operate
    exclusively from command-line input, as well as an overview of the functionality
    for many other programs. Please keep in mind, however, that command flags only
    touch the surface of the capabilities of interactive programs (like pico, vi,
    links, or pine) or particularly complex programs that rely on special expressions
    (such as grep or tr) or that use multiple files or sources for information (such
    as procmail).


    Table C.1 should provide you with a brief reminder and starting point for learning
    more about these Unix commands. While the flags we’ve included here work on our
    systems, they will likely vary somewhat on different systems, different Unix versions
    or with different shells. Check your local man pages for specifics.


    Note that multiple equivalent commands or flags all appear on the same line, separated
    by commas. Additionally, multiple flags (unless contradictory) can be used with
    all commands. The [] brackets indicate that one of the options enclosed may be
    used.'
  merge: -1
  img_proc: true
