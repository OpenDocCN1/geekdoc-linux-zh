- pgno: 276
  md: '# ✓ Tips


    +   - On public FTP servers that accept incoming files, you might not be able
    to list the files in the incoming directory or see anything in there. In this
    case, you essentially just cast your file into a big open room and close the door.
    This allows FTP administrators to screen the incoming files before making them
    available for downloading.


    +   - You can use the mput command to make multiple files available.


    +   - If you''re transferring a lot of files at once—say, for example, you''re
    moving all of your files from your old ISP to your new one—consider using tar
    and gz to collect and zip up all of your files, and then transferring just a single
    file. See Chapter 13 for more information about these commands.


    +   - Navigate in your local system (for example, to change to a directory containing
    files to put) with regular Unix commands like ls, pwd, and cd, prefaced with an
    !. For example, pwd would display the path and name of the current directory on
    the other system, and !pwd would display the path and name of the current directory
    on the local system.


    # Navigating with links


    +   - ↵ (or [Enter]) follows the currently highlighted link to a new page.


    +   - ↩ returns to the previous page.


    +   - ↓ moves the highlight down to the next link in the document.


    +   - ↑ moves the highlight up to the previous link in the document.


    +   - [Spacebar] or [Page Down] scrolls down to the next page.


    +   - [Page Up] or [B] scrolls up to the previous page.


    +   - [Q] quits links.'
  merge: -1
