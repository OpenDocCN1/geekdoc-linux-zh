- pgno: 330
  md: "# # Checking Spelling with ispell\n\nBack in Chapter 4, we showed you how to\
    \ spell-check your files. Unix also offers you ispell, which gives you an interactive\
    \ way of spell-checking files, similar to the spell-checking capabilities of many\
    \ word processing programs (Figure 15.1).\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_330_0.png)\n\
    \n# To check spelling with ispell:\n\n+   1. ispell gudspell\n+   \n+   At the\
    \ shell prompt, type ispell followed by the name of the file you want to spell-check.\
    \ You'll be greeted with your first (allegedly) misspelled word, the sentence\
    \ with the misspelling appears in a suggested words to replace the misspelled\
    \ word with, and (probably) a menu at the bottom of the screen, as shown in Figure\
    \ 15.1. The key menu items are listed in Table 15.1.\n\n+   2. Complete your spell-check\
    \ using ispell's menu items.\n\n+   3. Press (Q) to exit ispell, saving all of\
    \ your changes.\n\n# Tips\n\n+   -b creates a backup file.\n+   -s sorts guesses\
    \ by likely correctness.\n+   -B reports run-together words as spelling errors.\n\
    +   -m makes sure the menu appears at the bottom of the screen, assuming it doesn't\
    \ appear automatically.\n\n| ITEM | DESCRIPTION |\n|------|-------------|\n| [\
    \ ] | Accept your spelling but don't add it to the dictionary. |\n| R | Replace\
    \ a word with a word that you'll specify (after you type R). |\n| A | Accept the\
    \ word for the rest of the current session. |\n| I | Insert the word into your\
    \ dictionary. |\n| U | Insert the word (as all lowercase) into your dictionary.\
    \ |\n| Q | Quit ispell, saving all changes. |\n| X | Replace highlighted word\
    \ with a suggested word by typing the appropriate number |"
  merge: -1
  img_proc: true
