- pgno: 157
  md: "# Learning Who Else Is Logged in with who\n\nIf you're not interested in all\
    \ the gory details you get about users when you finger them, you can instead use\
    \ who to get just the basics. With who you get just the users' names, connection\
    \ information, log-in times, and host names, as shown in Code Listing 7.10.\n\n\
    ```\n[ejr]rhobbes ejr]$ who\nejr tty1Jul 22 07:42\nroot tty2Jul 22 15:13\nasr\
    \ tty4Jul 24 13:32\ndeb tty5Jul 24 13:32\nejr ttyp1 Jul 24 12:14\n  - (calvin.raycomm.com)\n\
    ejr ttyp0 Jul 24 13:02\n  - (calvin.raycomm.com)\n[ejr]rhobbes ejr]$\n```\n\n\
    Code Listing 7.10 Use who to find out who else is currently logged into the system.\n\
    \n# To snoop with who:\n\n+   - who\n\nAt the shell prompt, type who. You'll get\
    \ user information like that shown in Code Listing 7.10. Optionally, you could\
    \ pipe the output of who to more, as in who | more, which would give you a long\
    \ list of results one screen at a time.\n\n# Tips\n\n+   - If you're a system\
    \ administrator or use several different userids, you might occasionally need\
    \ to use a special case of who, called whoami. Just type whoami at the shell prompt,\
    \ and it'll tell you which userid you're currently logged in as.\n\n+   - See\
    \ Chapter 1 for more on more and on piping commands."
  merge: -1
  img_proc: true
- pgno: 158
  md: "# Learning Who Else Is Logged in with w\n\nAnother way to find out about other\
    \ people logged into the Unix system is to use w, which tells you who is logged\
    \ in, what they're doing, and a few other details (Code Listing 7.11).\n\nTo find\
    \ out who is logged in with w:\n\n+   - w\n\nAt the shell prompt, type w. You'll\
    \ usually see output much like that in Code Listing 7.11.\nThe top line shows\n\
    \n+   - The time\n+   - System uptime in days, hours, and minutes (uptime is how\
    \ long it's been since the system was restarted and is usually measured in weeks\
    \ or months for Unix systems, as opposed to hours or days for personal computers).\n\
    +   - The number of users\n+   - System load averages (the numbers indicate jobs—programs\
    \ or scripts to execute—lined up to run in the past 1, 5, and 15 minutes)\n\n\
    ```\n[ejr@hobbes ejr]$ w\n 1:49pm up 6 days,  4:21,  6 users, load average: 0.08,\
    \ 0.02, 0.01\nUSER     TTY      FROM     LOGIN@   IDLE   JCPU   PCPU  WHAT\nejr\
    \      tty1              Wed 7am   3:36m  7.07s  6.81s -bash\nroot     tty2  \
    \            Wed 3pm   28:46m 1.22s  0.32s -bash\nasr      tty4              1:32pm\
    \   17:22  1.04s  0.30s pine\ndeb      tty5              1:32pm   3.00s  1.22s\
    \  0.42s lynx\nejr      tty1   calvin    12:14pm  1:28m  1.33s  0.57s vi hatryspiders\n\
    ejr      ttyp0  calvin    1:02pm   1.00s  1.70s  0.24s w\n[ejr@hobbes ejr]$\n\
    ```\n\nCode Listing 7.11 The w command provides tons of information about the\
    \ system and its users"
