- pgno: 314
  md: '# Configuring Software


    After you''ve downloaded and uncompressed your new software, you''ll have to configure
    and tweak it to conform to your system. In general, the changes you''ll make will
    be things like


    +   - Adjusting path names (e.g., to install it into /home/yourid/bin rather than
    into /usr/local/bin, where you likely cannot install software).

    +   - Specifying what kind of Unix system you''re working on.

    +   - Inserting your email address and similar data.

    +   - Choosing one of two or three system-specific settings. What to choose for
    each system is clearly marked in the files you''ll be using.


    If you''re installing a program that will be compiled, your steps will closely
    resemble these. If you''re installing a script, the steps will likely differ somewhat,
    but go ahead and read through these steps because the principles of what to change
    are the same for scripts and programs.


    Precisely what changes you''ll have to make (in programs or scripts) are almost
    always documented in the README file that comes with the software—in the Makefile
    (in the case of programs) or in the actual .pl or .sh files that you''ll run (in
    the case of scripts). (See Code Listing 14.2.) So be sure to read these files!
    The steps in this section assume that you''re starting in the main directory of
    uncompressed and untarred files that you downloaded.'
  merge: -1
  img_proc: true
- pgno: 315
