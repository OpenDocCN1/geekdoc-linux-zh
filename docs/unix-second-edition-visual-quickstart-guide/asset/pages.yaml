    +   2. vi .cshrc

    +   Use the editor of your choice to edit the configuration file with the prompt
    setting in it.

    +   3. set prompt="$LOGNAME > "

    +   Set your prompt to something more suitable, as shown in Figure 8.7.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_196_0.png)


    # Setting Your csh Prompt Promptly


    You can set your csh prompt to contain some types of information, but not as many
    as the bash or zsh prompts. The following list shows you what code to use to add
    certain kinds of information to your prompt (as well as help you translate the
    code in your existing prompt):


    +   - $LOGNAME shows the userid of the current user—that''s you.

    +   - ${cwd} shows the current working directory with a path.

    +   - `uname -n`% shows the host name of the computer.


    ```

