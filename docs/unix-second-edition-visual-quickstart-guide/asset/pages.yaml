- pgno: 264
  md: '# Getting Familiar with Unix Internet Lingo


    Before you venture out onto the Internet using the information in this chapter,
    you should become familiar with some concepts and terminology.


    A server is a computer that stores files and "serves" them whenever requested.
    For example, you might think of a Web server as a big storehouse for .html files.
    Its job is to store .html files, wait for another computer to request files, and
    then find the requested files and "serve" them to the requesting computer. And,
    yes, your Unix system might be a Web server, but it doesn''t have to be.


    A client is a program that runs on your Unix system and is used to access files
    on a server. For example, your Lynx Web browser is a client—that is, it runs on
    your Unix system and is used to access files on a Web server.


    An IP (Internet Protocol) number is the address of a specific computer. This address
    identifies a computer, much the way your street address identifies your home.
    You use IP numbers, for example, every time you access a Web page. You may type
    in www.raycomm.com (which is called the host name), but behind the scenes, that''s
    translated into a specific IP number, such as 192.168.141.12. You will use host
    names (such as www.ibm.com or www.compaq.com) more often, because they''re easier
    to remember than a string of numbers. Whether you type in a character address
    or a number address, all you''re doing is accessing a specific address for a specific
    computer.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Table 12.1


    # Internet Ports and Protocols


    | Port | Protocol |

    |------|----------|

    | 21 | ftp |

    | 22 | ssh |

    | 23 | telnet |

    | 70 | gopher |

    | 80 | http |

    | 119 | nntp |

    | 8080 | http (usually for test servers) |


    Protocols are the languages that computers use to communicate with one another.
    For example, FTP (File Transfer Protocol) is used to transfer files from one computer
    to another. HTTP (Hypertext Transfer Protocol) is used to transfer data on the
    World Wide Web.


    Ports are like a computer’s ears—they’re “places” that computers listen for connections.
    Most Web servers run at port 80, and if you connect to http://www.raycomm.com:80/,
    you’re explicitly saying that you want to talk to the www.raycomm.com computer,
    at port 80, using HTTP. You could specify a different protocol (FTP, for example)
    or a different port (8080, for example) to communicate with the same computer
    in a different way, as Table 12.1 shows.'
  merge: -1
  img_proc: true
- pgno: 266
  md: "# Logging in to Remote Systems with ssh\n\nYou might already be using ssh to\
    \ connect to your Unix system. You can, though, use it to connect to and use practically\
    \ any other computer system on the Internet (assuming you have rights to log in\
    \ to it), as Code Listing 12.1 shows.\n\n# To connect to another computer using\
    \ ssh:\n\n+   1. ssh server.example.com\n+   At the shell prompt, type ssh followed\
    \ by the name of the system to which you want to connect.\n+   \n+   2. Log in\
    \ using the instructions you have for accessing the system.\n+   Presumably, if\
    \ you're accessing a system over the Internet, you have some reason to do so and\
    \ permission to do so. In some cases, you'll type the name of the application,\
    \ or you might be using the remote system just as you use the system from which\
    \ you are connecting.\n+   \n+   3. After you've finished using the remote system,\
    \ log out according to the instructions and policies of the remote system.\n\n\
    # Tips\n\n+   ■ For help with ssh, type ssh at the shell prompt and look at the\
    \ list of options, or do man ssh for more help. When you have an active session,\
    \ use Enter ? to get help with the current session.\n+   \n+   ■ If you have a\
    \ different log-in name on the remote system, you can specify that to ssh with\
    \ ssh server.example.com -l otherusername to log in more easily. Or, if it's easier\
    \ to remember, try ssh otherusername@server.example.com.\n\n```\n[jdoe@fraz jdoe]$\
    \ ssh server.example.com\njdoe@server's password:\njdoe /home/jdoe $ whoami\n\
    jdoe\njdoe /home/jdoe $ uname -a\nLinux server.example.com 2.4.19-ac4 #13 SMP\n\
    * Sat Nov 16 05:38:56 MST 2002 i686 unknown\n* unknown GNU/Linux\njdoe /home/jdoe\
    \ $ logout\n[jdoe@fraz jdoe]$\n```\n\nCode Listing 12.1 Use ssh to connect securely\
    \ to other systems on the Net."
  merge: -1
  img_proc: true
- pgno: 267
  md: "# Logging in to Remote Systems with telnet\n\nYou might already be using telnet\
    \ to connect to your Unix system. You can, though, use it to connect to and use\
    \ practically any other computer system on the Internet (assuming you have rights\
    \ to log in to it), as Figure 12.1 shows.\n\n# To connect to another computer\
    \ using telnet:\n\n+   1. telnet ibm.okstate.edu\n+   At the shell prompt, type\
    \ telnet followed by the name of the system to which you want to connect. In this\
    \ example, we're connecting to the Oklahoma State University online library catalog.\n\
    +   \n+   2. Make note of the Escape character announced when you log in—look\
    \ quickly, as it'll whiz by onscreen. The Escape character is what you'll press\
    \ should your telnet connection stall or the system lock up. In our example, the\
    \ Escape character is Ctrl ], which will return us to the telnet prompt so we\
    \ can quit the connection (Figure 12.1).\n+   \n+   3. Log in using the instructions\
    \ you have for accessing the system. Presumably, if you're accessing a system\
    \ over the Internet, you have some reason to do so and permission to do so. In\
    \ some cases, you'll type the name of the application. In our example, we type\
    \ pete, which is the name of the card catalog. In most other systems, you'll log\
    \ in with a userid and password, just as you log in to your Unix system (Figure\
    \ 12.2).\n+   \n+   4. After you've finished using the remote system, log out\
    \ according to the instructions and policies of the remote system.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_267_0.png)\n\
    \n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_267_1.png)"
  merge: -1
  img_proc: true
- pgno: 268
  md: '# ✓ Tips


    +   - For help with telnet, type telnet at the shell prompt, and then enter a
    ? at the telnet> prompt. open, close, and exit will be the most useful tools for
    you.

    +   - You’ll find that telnet connections to libraries and other mainframe computers
    are often difficult to use because of oddities in keyboard emulations. Your best
    bet is to contact the site owner and ask for a FAQ list (with answers!). You’ll
    assuredly not be the first to have questions.

    +   - A program closely related to telnet, tn3270, is designed specifically for
    communicating with IBM mainframes, which are commonly used for college library
    catalogs as well as other professional and academic systems. If you know that
    you’re communicating with an IBM mainframe, tn3270 will probably be better to
    use.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Communicating with Other Users Using write


    Most of the time when you connect to a Unix system, you’ll be communicating with
    the computer. You can, though, communicate with other people logged in to the
    same system. write is ideal for getting a quick message to other users—kind of
    like putting a yellow sticky note on their computer, as Figure 12.3 shows.


    # To communicate with other users using write:


    +   1. write userid

    +   At the shell prompt, type write followed by the userid of the person to whom
    you want to send a message. You’ll get a blank line with a blinking cursor on
    it, just waiting for you to type something.

    +   2. Wanna meet for lunch?

    +   Go ahead and type your message (Figure 12.3).

    +   3. Ctrl D

    +   When you’re finished typing, press Ctrl D to send the message. What you typed
    will appear on the other user’s screen (Figure 12.4).


    # Tips


    +   - Keep in mind that a write message will suddenly appear on the recipient’s
    screen and can be an intrusive surprise!

    +   - If you don’t want to receive write messages, type mesg n at the shell prompt.
    This command will keep other people from sending you write messages for the current
    session. Type mesg y to enable write again.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_269_0.png)


    Figure 12.3 You can send quick messages to another user on your system with write.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_269_1.png)


    Figure 12.4 The message suddenly appears on the user’s screen.


    +   - You can use the wall command to send write-type messages to everyone logged
    in to the system. System administrators commonly use wall when they need to warn
    people that the system is being brought down.

    +   - Use w or who to find out who else is logged into the system. See the sections
    called Learning Who Else Is Logged In with who and Learning Who Else Is Logged
    In with w in Chapter 7 for more information.'
  merge: -1
  img_proc: true
- pgno: 270
  md: "# Communicating with Other Users Using talk\n\nYou can also have a real-time,\
    \ two-way conversation (very much like an instant-messaging chat) with another\
    \ user logged in to the system by using talk. As Figure 12.5 shows, you type your\
    \ messages, the other person types his, and you both see the exchanges onscreen.\n\
    \n# To communicate with other users using talk:\n\n+   1. talk deb\n+   \n+  \
    \ At the shell prompt, type talk and the userid of the person to whom you want\
    \ to talk. The other user will be prompted to enter talk and your userid. Then,\
    \ you’ll see the talk screen, as shown in Figure 12.5.\n\n+   2. You just wouldn’t\
    \ have believed it!\n+   I had just chased the dog for six blocks...Yeah, the\
    \ stinkin’ pooch always thinks the garbage truck is stealing our stuff... Right.\
    \ Hilarious.\n+   Anyway, there I was huffing and puffing on the front porch,\
    \ when a neighbor informed me that some kids were rooting through my trash. Like,\
    \ what did they expect to find? Old panty hose and coffee filters? Nawww.\n+ \
    \  I stopped using panty hose for coffee filters a long time ago. It made me look\
    \ too tan.\n+   Type anything you want. Each keystroke will show up on the other\
    \ person’s screen, so they’ll see exactly how quickly (and how well) you type.\n\
    \n+   3. Ctrl C\n+   When you’re finished, break the connection.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_270_0.png)\n\
    \nFigure 12.5 talk lets you have a real-time, two-way online conversation.\n\n\
    # Tips\n\n+   You can also talk to people logged in to other Unix systems. Just\
    \ use talk userid@wherever.com. Of course, fill in the other person’s actual userid\
    \ and address, which will often be the same as that person’s email address. Firewalls\
    \ often—but not always—block these chats, though.\n\n+   If someone requests a\
    \ talk with you, just type talk and the person’s userid (or userid@wherever.com\
    \ if the person’s host name isn’t the same as yours).\n\n+   As with write, you\
    \ can type mesg n and mesg y at the shell prompt to turn talk off and on for the\
    \ current session.\n\n+   Though talk is not as groovy as some of the GUI-based\
    \ instant messaging programs, it’s still pretty cool, huh? It’s also a good way\
    \ to ask for help from more experienced users on your system."
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Getting Files from the Internet with ftp


    Some of the Internet''s great information resources are FTP sites, which contain
    hundreds of thousands of files from all over the Internet. FTP sites are similar
    to Web sites, but are directory-oriented and speak a different protocol. They''re
    less fun than the Web usually is but often more practical.


    One of the easiest ways to access information on FTP sites is to use anonymous
    ftp, which lets you access the sites and download files to your computer (Code
    Listing 12.2 shown on the next page).


    # Getting a single file through anonymous ftp:


    +   1. `ftp calvin.raycomm.com`

    +      At the shell prompt, type ftp followed by the name of the FTP site to which
    you''re connecting. Of course, if the computer has an IP number but no name, type
    the IP number instead. You''ll be prompted to log in, as shown in Code Listing
    12.2.

    +   2. `anonymous`

    +      For the user name, type anonymous. (Type ftp if you get tired of typing
    anonymous—it nearly always works.)

    +   3. `you@wherever.com`

    +      Use your email address for the password. It''s polite to identify yourself
    to the people who provide the FTP service. Just you@ is usually sufficient.

    +   4. `cd /pub/files`

    +      Use standard Unix cd commands to move through the directory tree to the
    file you want.


    continued on next page'
  merge: -1
  img_proc: true
