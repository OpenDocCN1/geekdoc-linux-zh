- pgno: 175
  md: '# Changing Your zsh Prompt


    Your default prompt (the text on the screen in front of the place you type commands)
    may vary a bit, depending on your Unix system; you might see just a dollar sign
    ($), a dollar sign and date, or other information as outlined in the Setting Your
    zsh Prompt Promptly sidebar. You can set your prompt to include information that''s
    handy for you.


    You actually have multiple prompts:


    +   - The main prompt that you usually think of as the shell prompt. This prompt
    is called PS1 or just PROMPT.

    +   - A secondary prompt that you see when the system requires additional information
    to complete a command. Logically, this prompt is called PS2.


    You can change either of these prompts using the following steps. You start by
    finding your prompt statement (Code Listing 8.8), then modifying it in your editor
    (Figure 8.2).


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_175_0.png)


    ```

    jdoe@sulley ~ $ grep -i PROMPT ~/.z* ; grep -i PS1 ~/.z*

    /home/jdoe/.zshrc:# configuration for keys umask PROMPT and variable

    /home/jdoe/.zshrc:# Set prompts

    /home/jdoe/.zshrc:PROMPT="%n%m %3- %(!.#.$) "  # default prompt

    /home/jdoe/.zshrc:# configuration for keys umask PROMPT and variable

    /home/jdoe/.zshrc:# Set prompts

    /home/jdoe/.zshrc:PROMPT="%n%m %3- %(!.#.$) "  # default prompt

    jdoe@sulley ~ $

    ```


    Code Listing 8.8 Use grep to search your configuration files for a zsh prompt
    statement.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# To change your zsh prompt:


    +   1. `grep -i PROMPT ~/.z*`; `grep -i PS1 ~/.z*`


    To begin, search through the configuration files located in your home directory
    and, if necessary, in the /etc directory, to find your prompt statement. It will
    look something like PROMPT="%n@%m %~ %(!.#.$)"  # default prompt, as shown in
    Code Listing 8.8.


    The Setting Your zsh Prompt Promptly sidebar will help you translate these symbols.


    +   2. `cp ~/.zshrc ~/.zshrc-backup; vi ~/.zshrc`


    Make a backup copy. The ~/.zshrc file is a likely place for your prompt to be
    set, as it is only read when your shell is interactive.


    # Setting Your zsh Prompt Promptly


    You can set your prompt to contain all sorts of information. The following list
    shows you what code to use to add certain kinds of information to your prompt
    (as well as help you translate the code in your existing prompt):


    +   - %n shows the userid of the current user—that''s you.

    +   - %~ shows the current working directory with a path, using a ~ notation within
    your home directory.

    +   - %c shows the current directory without the path.

    +   - %t shows the time.

    +   - %D shows the date without the year.

    +   - %F shows the date with the year.

    +   - \n forces a new line, making the prompt appear split on two lines (you need
    single quotes around the prompt).

    +   - %m shows the host name of the computer (like the frazz and hobbes examples
    in this book).

    +   - %M shows the complete domain name of the computer.'
  merge: -1
  img_proc: true
