- pgno: 97
  md: "# Searching and Replacing in vi\n\nOne of vi’s better features (and advantages\
    \ over pico) is that it allows you to search and replace throughout entire files.\
    \ As shown in the next sections, you can just find a specific string of text (a\
    \ regular expression, in Unix lingo; see Figure 4.14), or you can find the text\
    \ and replace it with other text, as in Figure 4.15.\n\n# To find a string of\
    \ text in vi:\n\n+   1. `vi hairyspider`\n+      For starters, access vi and a\
    \ specific file.\n+   \n+   2. `Esc` `/spider`\n+      Enter command mode, then\
    \ type `/` followed by the text you’re looking for. Here, we’re looking for “spider,”\
    \ but you may be looking for “the fly” or “wiggled and jiggled and tickled inside\
    \ her.” Or whatever.\n+   \n+   3. `Enter`\n+      Press this to find the first\
    \ occurrence of the term. Press `N` to find the next one.\n\n# To search and replace\
    \ in vi:\n\n+   1. `vi hairyspider`\n+      For starters, access vi and a specific\
    \ file.\n+   \n+   2. `Esc:%s/swallowed the fly/swallowed a spider to catch the\
    \ fly/`\n+      Enter `Esc:%s/` plus the text to find, followed by the replacement\
    \ text, as in Figure 4.15. Here, we replace “swallowed a fly” with “swallowed\
    \ a spider to catch the fly,” but perhaps you might forego the spider and simply\
    \ go for some antacid.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_97_0.png)\n\
    \n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_97_1.png)"
  merge: -1
  img_proc: true
- pgno: 98
  md: '# ✓ Tips


    +   - A great use for the search-and-replace feature is if you end up with DOS
    text files in your Unix account (through uploading a text file from a DOS or Windows
    machine as a binary file, most likely). If you view DOS files through a Unix shell,
    all the lines within the file will end with ^M. But if you try to type ^M when
    you''re doing a search and replace, the ^M won''t show up. What to do? Press Ctrl
    V, then Ctrl M. Just search and replace with :%s/ Ctrl V Ctrl M Ctrl M /g. The
    Ctrl V command "escapes" the following character, so you can type it without actually
    doing what the command would otherwise do. If you don''t escape the Ctrl M, vi
    thinks you just pressed Enter and tries to execute the unfinished command.


    +   - See the section on grep in Chapter 6 for information about searching with
    regular expressions.


    +   - Add a g at the end of the command to make it apply to all occurrences in
    the file. Otherwise, it applies only to the first occurrence on each line.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Exiting vi


    Whew! Time to exit vi (Figure 4.16).


    # To exit vi:


    Esc :q

    Enter command mode with [Esc], then type :q to quit vi. If you haven''t saved
    your latest changes, vi will not quit and will tell you to use ! to override.
    To quit without saving your changes, use :q!, as shown in Figure 4.16.


    # Tips


    +   - If you don''t really want to quit but want to edit a different file instead,
    type :e filename to open a new file to edit.

    +   - We recommend that you take a few minutes and try out some of the commands
    that you''ll use throughout your vi experience. If you don''t think you''ll be
    needing this range of commands, consider using pico rather than vi.

    +   - It takes some practice to get accustomed to vi, but the time spent is well
    worth it. With patience and practice, you''ll quickly become proficient in using
    vi. Take your time, take deep breaths, and plow ahead.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_99_0.png)


    Figure 4.16 Use [Esc] :q! to quit vi without saving changes.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Starting emacs and Dabbling with It


    For the novice, emacs offers a reasonable middle ground between the user-friendliness
    of pico and the power of vi (or vim). It''s not available on all systems, though,
    so you''ll just have to type in the command to see if you have access to it. (Refer
    back to Chapter 1 if you don''t.)


    Using emacs, you can just type, as you''d expect, then use command sequences,
    which are basically Ctrl keys, to make emacs do useful things like save, quit,
    and the like. When you start emacs, it''ll probably look very much like Figure
    4.17. If you''re on a Linux system, which "helpfully" opens a new window and gives
    you the graphical version, you''ll see something like Figure 4.18.


    # To start emacs:


    +   1. emacs

    +   At the shell prompt, type emacs. The program starts up and you''ll see something
    like Figure 4.17. The helpful information may or may not be present, but you can
    ignore it for now at any rate.


    +   2. This morning I got up, went downstairs, and found a humongous spider in
    the bathroom. After I quietly composed myself, I looked around the house for something
    to put him in...the kids'' bug catcher thing (nowhere to be found)...a jar...tupperware...a
    lidded cup...the salad spinner (BwaaaahHaaa!)....

    +   Type anything you want.

    +   You can use the arrow keys to navigate up and down in the file line by line.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_100_0.png)


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_100_1.png)'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Table 4.4


    # Handy emacs Commands


    | COMMAND | FUNCTION |

    |---|---|

    | Ctrl X Ctrl F | Opens a new file (existing or new) |

    | Ctrl U | Undoes the last change |

    | Ctrl G | Cancels the current operation |

    | Esc Esc Esc | Bails out of menu selections (and other things) |

    | Ctrl V | Moves down one page (screen) |

    | Alt V | Moves up one page (screen) |

    | Alt < | Moves to the beginning of the file |

    | Alt > | Moves to the end of the file |


    # Tips


    +   - To get help in emacs, type man emacs. See Chapter 1 for more about man pages.


    +   - If emacs helped you out by starting in the graphical mode, but you want
    to play along with us in the text mode, use emacs -nw to start the program. (The
    -nw flag means "no windows.")


    emacs uses both Ctrl keys and the "meta" key to issue commands. PC users should
    use Alt in place of the meta key (but you should remember that you''ll see M+
    or Meta+ in most emacs documentation). For those of you using keyboards that actually
    have a key labeled "Meta," by all means, you should use it when you see Alt. Mac
    users should use Option.


    +   - As useful as emacs is, it does have a few quirks. For example, if you want
    to access help, you press the Backspace key, which issues the Ctrl H command.
    To fix this idiosyncrasy, enter Alt X then normal-erase-is-backspace.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Using emacs Menus to Spell-Check


    Spell-checking is good. Learning to use emacs menus is good. And in emacs, learning
    to spell-check also allows you to familiarize yourself with emacs menus. Use F10,
    then a key letter of each menu, menu item, and sub-menu as needed to navigate
    through the menus. (You’ll see hints and prompts at the bottom of the screen,
    as shown in Figure 4.19.) Follow along to use the menus to spell-check your file.


    # To use emacs menus to spell-check:


    +   1. emacs hairyspiders

    +      For starters, fire up emacs and a specific file.

    +   2. Press F10 to access the menus.

    +   3. t

    +      Next, type the first letter of the menu you want—this example uses t for
    Tools for now.

    +   4. 0

    +      Try 0 (zero) for spell-checking.

    +   5. Press Enter and enjoy your spell-check.


    # Tips


    +   - Use Esc Esc Esc to back out of places (like menu selection choices) you
    do not want to be.

    +   - Reading and following along with the tips onscreen is essential to having
    a happy life (or a tolerable coexistence) with emacs.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_102_0.png)'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Saving in emacs


    Save yourself potential headaches by saving frequently. To save files in emacs
    (Figure 4.20), follow these steps.


    # To save text in emacs:


    +   - Ctrl X Ctrl S hairyspiders

    +   Press Ctrl X to let emacs know that another command is coming, and then Ctrl
    S to save. Finally, type the filename (hairyspiders, in this example) you want
    to use for the file, then press Enter. If you’ve already saved the file once,
    just press Ctrl X Ctrl S


    # Tips


    +   - If you look around in your home directory (or whatever directory you’re
    working in) after experimenting with emacs, you’ll probably notice a slew of files
    with names ending in ~. Those are emacs backup files created for your convenience
    and sanity. If you don’t need them, just delete them with rm -i *~. If you do
    need them, just use mv oopsie~ oopsie and you’re back in business.


    +   - If you want to save a file over an existing file, use Ctrl X Ctrl W, and
    then enter the existing filename to overwrite the original.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_103_0.png)


    Figure 4.20 Saving is very important— at least if you want to keep the results
    of your efforts.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Exiting emacs


    Wow! It''s already time to exit emacs (Figure 4.21).


    # To exit emacs:


    +   - Ctrl X Ctrl C


    Press Ctrl X to let emacs know that another command is coming, then Ctrl C to
    close. If you haven''t saved your latest changes, emacs expects you to decide
    if you want to save or discard unsaved changes, as shown in Figure 4.20.


    # Tip


    +   - If you end up down at the command line but don''t want to save or anything—you
    just want to return to your file—use Ctrl G to cancel.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_104_0.png)'
