- pgno: 156
  md: '# ✓ Tips


    +   - You can also sniff out user information using `who` (see the next section).


    +   - You can provide extra information to anyone who gets your user information
    with `finger` by creating files that describe your "plan" and "project" (as ejr
    has done in Code Listing 7.9). Use your favorite editor to create `.plan` and
    `.project` files in your home directory. Then, change the protection so that the
    files are both world readable (`chmod go+r .plan ; chmod go+r .project`) and so
    the directory is accessible (`chmod go+x .`). See Chapter 5 for specifics about
    `chmod`.


    +   - Information you obtain through `finger` can be handy when diagnosing connection
    difficulties. In particular, system administrators or help desk personnel are
    likely to ask where you''re connected (pts57, for ejray@xmmission.com) and what
    kind of software you''re using.'
