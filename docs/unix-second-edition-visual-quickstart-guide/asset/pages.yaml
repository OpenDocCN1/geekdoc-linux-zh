    /bin/sed y/abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ/nopqrstuvwxyzabcdefghijklmNOPQRSTUVWXYZ
    + UVWXYZABCDEF GHIJKLM/ "$1" | more

    fi


