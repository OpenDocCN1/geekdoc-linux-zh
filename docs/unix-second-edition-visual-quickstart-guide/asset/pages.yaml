- pgno: 297
  md: '# Archiving with tar


    Occasionally, you’ll want to take a bunch of files and make them into one file,
    such as when you’re archiving information, for example. You might think of it
    as tossing a bunch of toys into a toy box—that is, taking a bunch of related things
    and storing them all in one place.


    Using tar (which came from “tape archive”), you can take a bunch of files and
    store them as a single, uncompressed file (see Code Listing 13.5). You’ll use
    tar files not only to store information, but also to create a single source for
    compressing and gzipping files, which are discussed later in this chapter.


    ```

    [ejr@hobbes compression]$ ls -l

    total 2290

    drwxrwxr-x  2 ejr users  1824 Jul 23 10:56 Feather

    drwxrwxr-x  2 ejr users  1824 Jul 23 10:49 Zipodeedoodah

    -rw-rw-r-- 1 ejr users  53678 Jul 23 06:42 bigfile.gz

    -rw-rw-r-- 1 ejr users  53678 Jul 23 10:16 bigfile.new.gz

    -rw-rw-r-- 1 ejr users  73989 Jul 23 10:16 bigfile.uu

    -rw-rw-r-- 1 ejr users  128886 Jul 23 11:45 file1.htm

    -rw-rw-r-- 1 ejr users  128886 Jul 23 11:45 file2.html

    -rw-rw-r-- 1 ejr users  686080 Jul 23 10:41 folder.tar

    -rw-rw-r-- 1 ejr users  268156 Jul 23 06:53 folder.zip

    -rw-rw-r-- 1 ejr users  128886 Jul 23 06:37 fountains1.txt

    -rw-rw-r-- 1 ejr users  55124 Jul 23 06:38 fortunes1.zip

    -rw-rw-r-- 1 ejr users  0 Jul 23 11:21 gzip

    -rw-rw-r-- 1 ejr users  73978 Jul 23 11:15 home.gz.uu

    -rw-rw-r-- 1 ejr users  177607 Jul 27 09:34 house.uu

    -rw-rw-r-- 1 ejr users  53792 Jul 23 06:52 newzip.zip

    -rw-rw-r-- 1 ejr users  128886 Jul 23 08:19 ournewhouse.jpg

    -rw-rw-r-- 1 ejr users  128886 Jul 27 09:52 rowboat.jpg

    -rw-rw-r-- 1 ejr users  177686 Jul 27 09:51 rowboat.uu

    -drwxrwxr-x  3 ejr users  1024 Jul 23 12:56 temp

    [ejr@hobbes compression]$ tar -cf tarredfilename.tar Feather

    [ejr@hobbes compression]$

    ```


    Code Listing 13.5 Tarring files binds them all together into a single file.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# To archive a directory with tar:


    +   1. ls -l

    +   For starters, type ls -l at the shell prompt to verify the name of the directory
    you''re going to tar.


    +   2. tar -cf tarredfilename.tar Feather

    +   Type tar followed by

    +   ▲ The -cf flags (to create a file)

    +   ▲ The name you want the tarred (archived) file to have (tarredfilename.tar
    in this example)

    +   ▲ The name (or names) of the directory or files to tar (Feather, here)


    # Tips


    +   ■ See the section called Combining Commands later in this chapter for timesaving
    ideas for combining and compressing files all in one fell swoop.


    +   ■ Some versions of tar also support gzip, so you can use tar -czf tarredfilename.tgz
    Feather to tar and gzip all at once.


    +   ■ You can add the v flag to the tar command flags (-vcf) to get a verbose
    description of what''s being tarred.


    +   ■ If you want to sound like a real Unix geek, refer to tarred files as "tarballs."'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Unarchiving Files with tar


    You’ll also use tar to unarchive files, where you take all of the individual files
    out of the single tarred file—like dumping the bunch of toys out of the toy box—as
    shown in Code Listing 13.6.


    # To unarchive files with tar:


    +   - tar -xf labrea.tar

    +   At the shell prompt, type tar -xf (here, x means extract) followed by the
    name of the tarred file you want to unarchive. The bunch of once-tarred files
    will be separated into the original files or directories, as shown in Code Listing
    13.6.


    # To unarchive selected files with tar:


    +   - tar -xf labrea.tar "*mammoth*"

    +   You can also extract only specified files from a tar file. You might do this
    to restore just a couple of files from a backup archive, for example. This command
    extracts all files that have mammoth in their names from the labrea.tar file and
    places them back where they belong (Code Listing 13.7).


    # Tips


    +   - Consider moving tarred files into a temporary directory before you unarchive
    them. When you unarchive, tar overwrites any files with the same names as files
    that are extracted. Using a temporary directory will prevent this.

    +   - Use tar -tf filename to list the files (to check your work, perhaps, or
    find a backup file) without actually unarchiving the files.


    ```

    [ejr@hobbes compression]$ tar -xf labrea.tar

    [ejr@hobbes compression]$ ls -l labrea/

    total 483

    -rw-r--r-- 1 ejr users 53678 Jul 27 18:05

    -> bigfile.gz

    -rw-r--r-- 1 ejr users 128886 Jul 27

    -> 10:06 mammoth.jpg

    -rw-r--r-- 1 ejr users 177607 Jul 27

    -> 10:05 house.uue

    -rw-r--r-- 1 ejr users 128886 Jul 27

    -> 10:06 rowboat.jpg

    [ejr@hobbes compression]$

    ```


    Code Listing 13.6 Untarring files reconstructs the original directory structure.


    ```

    [ejr@hobbes compression]$ tar -xf labrea.tar

    -> "*mammoth*"

    [ejr@hobbes compression]$ ls -l labrea/*

    -rw-r--r-- 1 ejr users 128886 Jul 27

    -> 10:06 labrea/mammoth.jpg

    [ejr@hobbes compression]$

    ```


    Code Listing 13.7 Unarchive just a single file to replace a missing or corrupt
    file.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Compressing Files with compress


    Compressing a file just means making it smaller so that it takes up less hard-disk
    space. It''s like filling a toy box, closing the lid, then sitting on it to mush
    the contents so that they fit into a smaller space. Any time you create a file
    that you''ll be sending via FTP or that people will access through the Web, you''ll
    want to compress the file so that it takes less time to send and download. As
    Code Listing 13.8 shows, you compress files using the compress command.


    ```

    [ejr@hobbes compression]$ ls -l *

    -r--r--r-- 1 ejr users 501760 Jul 27

    -> 10:06 labrea.tar

    [ejr@hobbes compression]$ compress labrea.tar

    [ejr@hobbes compression]$ ls -l *

    -r--r--r-- 1 ejr users 297027 Jul 27

    -> 10:06 labrea.tar.Z

    [ejr@hobbes compression]$

    ```


    Code Listing 13.8 Listing files before and after compressing them lets you see
    how much smaller the new file is.


    # To compress a file with compress:


    +   compress labrea.tar


    At the shell prompt, type compress followed by the filename. Here, we''re compressing
    a tarred file, which contains multiple files. As you can see in Code Listing 13.8,
    the compressed file has a new extension (.Z) that shows that it''s compressed,
    and it replaces the original, uncompressed file.


    # Tips


    +   You can compress only one file at a time. If you have multiple files you want
    to compress, consider archiving them first using tar, and then compressing the
    single archived file. See the section called Archiving with tar earlier in this
    chapter.


    +   You can add the -c flag to compress to leave the original file untouched and
    send the compressed version to standard output (where you''ll probably specify
    a name and save it to a file). For example, you might use compress -c labrea.tar
    > labrea.tar.Z. See Chapter 1 for some mighty interesting information on redirecting
    output, as is shown here.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Uncompressing Files with uncompress


    Compressing a file is handy for reducing the amount of disk space it uses, but
    you can’t do much with a compressed file—directly. At least. You’ll need to uncompress
    it first. As Code Listing 13.9 shows, you do so using the uncompress command.


    # To uncompress a file with uncompress:


    +   - uncompress labrea.tar.Z

    +   At the shell prompt, type uncompress followed by the full filename of the
    file to uncompress. The compressed file is replaced by the uncompressed file,
    which is named like the original, but without the .Z (see Code Listing 13.9).


    # Tips


    +   - Remember that uncompressed files take up more space—sometimes a lot more
    space—than compressed files. You might want to check your storage quota with your
    ISP before you uncompress a file to make sure that you don’t exceed your limit.
    As Chapter 7 explains, you can often check your quota by typing quota -v at the
    shell prompt.


    +   - You can add the -c flag to uncompress to leave the original file untouched
    and send the uncompressed version to standard output. For example, you might use
    uncompress -c torred.tar.Z > torred.tar. See Chapter 1 for more information on
    redirecting output, as is shown here.


    +   - You can also use gunzip to uncompress compressed files. Check out Unzipping
    a gzip File with gunzip later in this chapter.


    ```

    [ejr@hobbes compression]$ ls -l *

    -rw-r--r-- 1 ejr users 297027 Jul 27

    -> 10:06 labrea.tar.Z

    [ejr@hobbes compression]$ uncompress

    -> labrea.tar.Z

    [ejr@hobbes compression]$ ls -l *

    -rw-r--r-- 1 ejr users 501760 Jul 27

    -> 10:06 labrea.tar

    [ejr@hobbes compression]$

    ```


    Code Listing 13.9 You can uncompress files with a single swift command and possibly
    double your disk usage at the same time, as shown here.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Zipping a File or Directory with gzip


    If you want to compress only a single file or directory, you might choose gzip,
    rather than compress. gzip is more efficient, so you wind up with smaller files
    than you do with compress. As Code Listing 13.10 shows, you use gzip much the
    same way that you use compress.


    To zip a file or directory with gzip:


    +   1. ls -l z*

    +   At the shell prompt, use ls -l to confirm the name of the file or directory
    you want to zip. In this example, we''re looking for z (as in zipadeedoodah) files.


    +   2. gzip zipadeedoodah.tar

    +   Type gzip followed by the name of the file or directory to gzip. The zipped
    file will replace the unzipped version and will have a new .gz extension.


    Tips


    +   You can tar a group of files and then compress the single file using gzip.


    +   If you want to keep a copy of the original, unzipped file, try gzip -c filetogzip
    > compressed.gz


    +   If the compressed files will be accessed by someone using Windows, you should
    consider using zip, which is discussed later in this chapter. Although gzip is
    more convenient in the Unix world, gzip is not the same as good old Pkzip or .zip
    files used in DOS and Windows.


    ```

    [ejr@hobbes compression]$ ls -l z*

    -rw-r--r-- 1 ejr users  507760 Jul 27 10:22 zipadeedoodah.tar

    [ejr@hobbes compression]$ gzip zipadeedoodah.tar

    [ejr@hobbes compression]$ ls -l z*

    -rw-r--r-- 1 ejr users  239815 Jul 27 10:22 zipadeedoodah.tar.gz

    [ejr@hobbes compression]$

    ```


    Code Listing 13.10 Use gzip to zip up those bulky tar files.'
  merge: -1
  img_proc: true
- pgno: 303
  md: "# Unzipping a gzip File with gunzip\n\nTo access gzipped files, you'll need\
    \ to unzip them. You do so using gunzip, as Code Listing 13.11 shows.\n\n# To\
    \ unzip a gzip file with gunzip:\n\n+   1. `ls -l *.gz`\n+   \n+      At the shell\
    \ prompt, verify the name of the gzipped file with `ls *.gz` (Code Listing 13.11).\n\
    +   \n+   2. `gunzip zipadeedoodah.gz`\n+   \n+      Enter gunzip and the name\
    \ of the file to unzip. gunzip will uncompress the file(s) and return you to the\
    \ shell prompt.\n\n# ✔ Tips\n\n+   - When you're unzipping files with gunzip,\
    \ you're not required to enter the file extension. `gunzip zipadeedoodah` would\
    \ work just as well as `gunzip zipadeedoodah.gz`.\n+   \n+   - You might encounter\
    \ gzipped files with a `.tgz` (targed, gzipped), `.tar.gz`, or just `.gz` extension.\
    \ It'll handle any of those gracefully.\n\n+   - Some systems don't recognize\
    \ the gunzip command, so you might need to use `gzip -d` to uncompress the files.\n\
    +   \n+   - If you have a compressed file that you know is text—`oldfunnysayingsfromthenet.gz`,\
    \ for example—you can uncompress it (without deleting the original file) and view\
    \ it with a single command: `gzcat oldfunnysayingsfromthenet | more`.\n+   \n\
    +   - `gunzip` understands how to uncompress most (compressed) files, including\
    \ those compressed with `compress` or `.zip` files from DOS/Windows systems.\n\
    \n```\n```text\n[ejr@hobbes compression]$ ls -l *.gz\n-rw-r--r--  1 ejr  users\
    \  53678 Jul 23 06:42 bigfile.gz\n-rw-r--r--  1 ejr  users  53678 Jul 23 10:16\
