- pgno: 145
  md: '# Splitting Files with split


    Suppose you''re futzing with your new digital camera and want to share a photo
    of your new computer (what else is cool enough to take pictures of?!) via email
    with your friends and family. You access the file, attach it to an email message,
    and then—argh!—your ISP fails to send the file because it''s too big. While you
    could modify the file itself—reduce the physical size, reduce the number of colors
    used, or crop out nonessential parts, for example—you can also just split the
    file with split. For example, if the ISP tells you that no files larger than .51
    MB will be accepted, you can use split to send the file in chunks—all using one
    easy command (Code Listing 6.23).


    ```

    [jdoe@frazz split]$ ls -lh

    total 1.1M

    -rw-rwxr-x 1 jdoe jdoe1.0M Jan 1 12:42 mongopicure.jpg*

    [jdoe@frazz split]$ ls -l

    total 1060

    -rw-rwxr-x 1 jdoe jdoe1879300 Jan 1 12:42 mongopicure.jpg*

    [jdoe@frazz split]$ split -b 500k mongopicure.jpg

    [jdoe@frazz split]$ ls -lh

    total 2.1M

    -rw-rwxr-x 1 jdoe jdoe1.0M Jan 1 12:42 mongopicure.jpg*

    -rw-rw-r-- 1 jdoe jdoe500K Jan 1 13:03 xaa

    -rw-rw-r-- 1 jdoe jdoe500K Jan 1 13:03 xab

    -rw-rw-r-- 1 jdoe jdoe54K Jan 1 13:03 xac

    [jdoe@frazz split]$ split -b 500k mongopicure.jpg chunk

    [jdoe@frazz split]$ ls -lh

    total 3.2M

    -rw-rw-r-- 1 jdoe jdoe500K Jan 1 13:03 chunk aa

    -rw-rw-r-- 1 jdoe jdoe500K Jan 1 13:03 chunk ab

    -rw-rw-r-- 1 jdoe jdoe54K Jan 1 13:03 chunk ac

    -rw-rwxr-x 1 jdoe jdoe1.0M Jan 1 12:42 mongopicure.jpg*

    -rw-rw-r-- 1 jdoe jdoe500K Jan 1 13:03 xaa

    -rw-rw-r-- 1 jdoe jdoe500K Jan 1 13:03 xab

    -rw-rw-r-- 1 jdoe jdoe54K Jan 1 13:03 xac

    [jdoe@frazz split]$ cat chunk aa chunk ab chunk ac > reconstitutedpicture.jpg

    [jdoe@frazz split]$ cmp mongopicure.jpg reconstitutedpicture.jpg

    [jdoe@frazz split]$

    ```'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# To split files with split:


    +   - `split -b 500k mongopicture.jpg`

    +     With that, split gives you three files (xaa, xab, xac) that are each 500
    KB (the first two) or less (the last one, containing the leftovers). Mail each
    of those, and you''ve squeaked under the ISP''s size limit.


    # Tips


    +   - Control the names of the files by adding a prefix at the end. For example,
    try `split -b 500k mongopicture.jpg chunk` to get three pieces called chunk aa,
    chunk ab, and chunk ac.


    +   - Use cat to restore the original. For example, `cat xaa xab xac > reconstituted-picture.jpg`'
