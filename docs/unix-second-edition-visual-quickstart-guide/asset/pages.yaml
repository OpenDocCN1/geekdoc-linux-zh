- pgno: 48
  md: '# Moving Files with mv


    Moving directories and files means moving them from one location (think of location
    as an absolute file path, like /home/ejr/aFile) in your system to another location
    (say, /temp/File or /home/ejr/AnotherFile). Essentially, you have only one version
    of a file, and you change the location of that version. For example, you might
    move a directory when you’re reorganizing your directories and files. Or, you
    might move a file to rename it—that is, move a file from one name to another name.


    You move directories and files using mv, as shown in Code Listing 2.8.


    # To move a file or directory:


    +   1. ls

    +   To begin, use ls to verify the name of the file you want to move. If you’re
    changing the name of the file, you’ll want to ensure that the new filename isn’t
    yet in use. If you move a file to an existing filename, the contents of the old
    file will be replaced with the contents of the new file.


    +   2. mv existingfile newfile

    +   Type mv plus the existing filename and the new filename. Say goodbye to the
    old file and hello to the new one (Code Listing 2.8).

    +   You use the same process—exactly—to move directories; just specify the directory
    names, as in mv ExistingDirectory NewDirectory.


    +   3. ls

    +   Verify that the file is now located in the location you intended.


    ```

    $ ls

    Complete existingfileoldfile

    $ mv existingfile newfile

    $ ls

    Completed newfile oldfile

    $

    ```


    Code Listing 2.8 List files to see the current files, then use mv to rename one
    of the files.


    # Tips


    +   You can also use mv to move files into or out of directories. For example,
    mv Projects/temp/testfile /home/deb /testfile moves testfile from the Projects
    and temp subdirectories of the current directory to Debs home directory, also
    using the name testfile.


    +   Use mv -i oldfilename newfilename to require the system to prompt you before
    overwriting (destroying) existing files. The -i is for "interactive," and it also
    works with the cp command.


    +   Visit Chapter 8 to find out about using aliases with mv so that the system
    always prompts you before overwriting files and you don’t have to remember the
    -i flag.


    +   If you use mv and specify an existing directory as the target (as in, mv something
    ExistingDirectory), "something" in this case, will be placed into ExistingDirectory.
    "Something" can be either a file or a directory.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Removing Files with rm


    ```

    $ ls

    Completed          oldfile

    Newfile            soon.to.be.gone.file

    $ rm -i soon.to.be.gone.file

    rm: remove ''soon.to.be.gone.file''? y

    $ ls

    Completed  newfile  oldfile

    $

    ```


    Code Listing 2.9 Use rm -i to safely and carefully remove directories and files.


    You can easily—perhaps too easily—remove (delete) files from your Unix system.
    As Murphy will tell you, it''s a good idea to think twice before doing this: once
    you remove a file, it''s gone (unless, of course, you plead with your system administrator
    to restore it from a backup tape—but that''s another story). At any rate, it''s
    permanent, unlike deletions in Windows or the Macintosh OS, where the Recycle
    Bin or Trash give you a second chance.


    You remove files using rm, as shown in Code Listing 2.9. And, as you''ll see in
    the following steps, you can remove files one at a time or several at a time.


    # To remove a file:


    +   1. ls -l

    +      List the files in the current folder to verify the name of the file you
    want to remove.

    +   2. rm -i soon.to.be.gone.file

    +      At your shell prompt, type rm -i followed by the name of the file you want
    to remove.

    +      The -i tells the system to prompt you before removing the files (Code Listing
    2.9).

    +   3. ls

    +      It is gone, isn''t it?'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# To remove multiple files:


    +   1. `ls -l *.html`

    +   List the files to make sure you know which files you want to remove (and not
    remove).


    +   2. `rm -i *.html`

    +   Using the asterisk wildcard (*), you can remove multiple files at one time.
    In this example, we remove all files in the current directory that end with .html.
    (Refer to Chapter 1, specifically the section called Using Wildcards, for details
    about using wildcards.)


    Or


    +   1. `rm -i dangerous`

    +   Here, -i specifies that you''ll be prompted to verify the removal of a directory
    or file named dangerous before it''s removed.


    +   2. `rm -ir dan*`

    +   This risky command removes all of the directories or files that start with
    dan in the current directory and all of the files and subdirectories in the subdirectories
    starting with dan. If you''re sure you''re sure, don''t use the -i flag to just
    have the files removed without prompting you for confirmation. (Remember that
    the flags -ir could also be written as -i -r or -ri or -r -i. Unix is rather flexible.)


    # Tips


    +   - If you have system administrator rights (and are logged in as root, rather
    than with your userid), be extremely careful when using rm. Rather than remove
    merely your personal directories or files, you could potentially remove system
    directories and files. Scope out the sidebar called Can You Really Screw Up the
    System?


    # Can You Really Screw Up the System?


    In general, no. When you log into a Unix system and use your personal userid,
    the worst you can do is remove your own directories and files. As long as you''re
    logged in as yourself, commands you type won''t affect anything critical to the
    Unix system, only your own personal directories and files. Score one for Unix—as
    an average user, you cannot really break the system. With Windows or Macintosh,
    though, it''s a different story.


    If you have system administrator rights, meaning that you can log in as root (giving
    you access to all the system directories and files), you can do a lot of damage
    if you''re not extremely careful. For this reason, don''t log in as root unless
    you absolutely have to.


    See Chapter 3 for information about su, which can help reduce the risk of being
    logged in as root.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# REMOVING FILES WITH rm


    +   - This is a good time to remind you to use the handy cp command to make backup
    copies of anything you value—before you experiment too much with rm. Even if the
    system administrator keeps good backups, it''s ever so much easier if you keep
    an extra copy of your goodies sitting around. Try `cp -r . backup-files` for a
    space-hogging—but effective—means of making a quick backup of everything in the
    current directory into the backup-files directory. (Just ignore the error message
    about not copying a directory into itself—the system will do the right thing for
    you, and you don''t have to worry about it.)

    +   - We suggest using rm -i, at least until you''re sure you''re comfortable
    with irrevocable deletions. The -i flag prompts you to verify your command before
    it''s executed.

    +   - Visit Chapter 8 to find out about using aliases with rm so that the system
    always prompts you before removing the directories or files even if you forget
    the -i flag.

    +   - If you accidentally end up with a file that has a problematic filename (like
    one that starts with -, which looks to Unix like a command flag, not a filename),
    you can delete it (with a trick). Use `rm -i -- badfilename` to get rid of it.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Removing Directories

    with rmdir


    Another handy thing you can do is remove directories using rmdir. Think of removing
    directories as trimming branches on a tree. That is, you can''t be sitting on
    the branch you want to trim off. You have to sit on the next closest branch; otherwise,
    you''ll fall to the ground along with the branch you trim off. Ouch! Similarly,
    when you remove a directory, you must not be located in the directory you want
    to remove.


    You must remove a directory''s contents (all subdirectories and files) before
    you remove the directory itself. In doing so, you can verify what you''re removing
    and avoid accidentally removing important stuff. In the following steps (illustrated
    in Code Listing 2.10), we''ll show you how to remove a directory''s contents,
    then remove the directory itself.


    ```

    $ cd /home/ejr/Yourdirectory

    $ ls -lo

    total 7

    drwxrwxr-x 2 ejr users 1024 Jun 29 20:59 .

    drwxrwxr-x 8 ejr users 1024 Jun 29 20:59 ..

    -rw-rw-r-- 1 ejr users 1475 Jun 29 20:59 cancelled.project.notes

    -rw-rw-r-- 1 ejr users 2876 Jun 29 20:59 outdated.contact.info

    $ rm *

    $ cd ..

    $ rmdir Yourdirectory

    $ ls

    Newdirectory all.programs.txt newer.programs short.fortunes

    Projects files newest.programs temp

    Xrotenv.@ fortunes newstuff touching

    all.programs local.programs.txt schedule

    $

    ```


    Code Listing 2.10 Removing directories with rmdir can be a little tedious—but
    better safe than sorry.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# To remove a directory:


    +   1. cd /home/ejr/Yourdirectory

    +   To begin, change to that directory by typing cd plus the name of the directory
    you want to remove.


    +   2. ls -a

    +   List all (-a) of the files, including any hidden files that might be present,
    in the directory, and make sure you don''t need any of them. If you see only .
    and .. (which indicate the current directory and its parent directory), you can
    skip ahead to step 4.


    +   3. Do one or both of these:

    +   ▲ If you have only files in the directory, type rm * to delete the files.

    +   ▲ If you have subdirectories in the directory, type cd and the subdirectory
    name, essentially repeating the process starting with step 1. Repeat this process
    until you remove all subdirectories.

    +   When you finish this step, you should have a completely empty directory, ready
    to be removed.


    +   4. cd ..

    +   Use the change directory command again to move up one level, to the parent
    of the directory that you want to remove.


    +   5. rmdir Yourdirectory

    +   There it goes—wave goodbye to the directory! See Code Listing 2.10 for the
    whole sequence.


    # Tips


    +   You can remove multiple directories at one time. Assuming you''re starting
    with empty directories, just list them like this: rmdir Yourdirectory Yourotherdirectory
    OtherDirectory.


    +   As an alternative to rmdir, you can remove a directory and all of its contents
    at once using rm with the -r flag; for example, rm -r Directoryname. Be careful,
    though! This method automatically removes the directory and everything in it,
    so you won''t have the opportunity to examine everything you remove beforehand.
    If you''re getting asked for confirmation before deleting each file and you''re
    really, absolutely, positively, completely sure that you''re doing the right thing,
    use rm -rf Directoryname to force immediate deletion.


    +   If you''re getting comfortable with long command strings, you can specify
    commands with a complete directory path as in ls /home/ejr/DirectorytoGo or rm
    /home/ejr/DirectorytoGo/*. This technique is particularly good if you want to
    be absolutely sure that you''re deleting the right directory, and not a directory
    with the same name in a different place on the system.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Finding Forgotten Files with find


    Where, oh where, did that file go? Sometimes finding a file requires more than
    cursing at your computer or listing directory contents with ls. Instead, you can
    use the find command, which lets you search in dozens of ways, including through
    the entire directory tree (Code Listing 2.11) or through directories you specify
    (Code Listing 2.12).


    # To find a file:


    +   - find . -name lostfile -print


    Along with the find command, this specifies to start in the current directory
    with a dot (.), provide the filename (-name lostfile), and specify that the results
    be printed onscreen (-print). See Code Listing 2.11.


    # To find files starting in a specific directory:


    +   - find /home/deb -name ''pending*'' -print


    This command finds all of the files with names starting with pending under Deb''s
    home directory. You must use single quotes if you include a wildcard to search
    for.


    Or, you can find files under multiple directories at one time, like this:


    +   - find /home/deb /home/ejr -name ''pending*'' -print


    This command finds files with names starting with pending in Deb''s and Eric''s
    home directories or any subdirectories under them (Code Listing 2.12).


    ```

    $ find . -name lostfile -print

    /Projects/schedule/lostfile

    $

    ```


    Code Listing 2.11 Use find to locate a missing file.


    ```

    $ find /home/deb -name ''pending*'' -print

    /home/deb/Projects/schedule/pending.tasks

    $ find /home/deb /home/ejr -name ''pending*''

    -print

    /home/deb/Projects/schedule/pending.tasks

    /home/ejr/pending.jobs.to.do.today.to.do

    $

    ```


    Code Listing 2.12 By using wildcards and specifying multiple directories, you
    can make find yet more powerful.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# To find and act on files:


    +   find ~/ -name "*.backup" -ok rm {} \;


    Type find with a wildcard expression, followed by -ok (to execute the following
    command, with confirmation), rm (the command to issue), and {} \; to fill in each
    file found as an argument for the command. If you want to, say, compress matching
    files without confirmation, you might use find ~/ -name "*.backup" -exec compress
    {} \; to do the work for you.


    # Tips


    +   On some Unix systems, you may not need the -print flag. Try entering find
    without the -print flag. If you see the results onscreen, then you don''t need
    to add the -print flag.


    +   Avoid starting the find command with the root directory, as in find / -name
    the_missing_file -print. In starting with the root directory (indicated by the
    /), you''ll likely encounter a pesky error message for each directory you don''t
    have access to, and there will be a lot of those. Of course, if you''re logged
    in as root, this doesn''t apply.


    +   If you know only part of the filename, you can use quoted wildcards with find,
    as in find . -name ''info*'' -print.


    +   find offers many chapters worth of options. If you''re looking for a specific
    file or files based on any characteristics, you can find them with find. For example,
    you can use find /home/shared -mtime -3 to find all files under the shared directory
    that were modified within the last three days. See Appendix C for a substantial
    (but not comprehensive) listing of options.'
  merge: -1
  img_proc: true
- pgno: 56
  md: "# Locating Lost Files with locate\n\nIf you're looking for a system file—that\
    \ is, a program or file that is part of the Unix system itself, rather than one\
    \ of your personal files in your home directory—try locate to find it. You'll\
    \ get more results than you can handle, but it's a quick and easy way to locate\
    \ system files.\n\nThe locate command isn't available on all Unix systems, but\
    \ it is worth a try at any rate. See Code Listing 2.13 for locate in action.\n\
    \n# To locate a file:\n\n+   - locate fortune\n\nIf you try to locate fortune,\
    \ you'll get a listing of all of the system files that contain \"fortune\" in\
    \ them. This listing includes the fortune program, fortune data files for the\
    \ fortune program to use, and related stuff. It's a huge list in most cases (Code\
    \ Listing 2.13).\n\n# Tips\n\n+   - Use locate in combination with grep (see Using\
    \ Regular Expressions with grep in Chapter 6) to narrow down your list, if possible.\n\
    \n+   - Many people use locate to get a quick look at the directories that contain\
    \ relevant files (/usr/share/games/fortunes contains a lot of files related to\
    \ the fortune program), then other tools to take a closer look.\n\n+   - Not all\
    \ systems include fortune—it's certainly just a fun thing and not essential by\
    \ any means. If you don't \"locate\" it, try bash or csh to see how locate works.\
    \ (See Chapter 8 for more information about different shells and their benefits\
    \ and drawbacks.)\n\n```\n[jdoe@fraz jdoe]$ locate fortune\n/usr/share/man/man6/fortune.6.bz2\n\
    /usr/share/doc/fortune-mod-1.0\n/usr/share/doc/fortune-mod-1.0/cs\n/usr/share/doc/fortune-mod-1.0/cs/HISTORIE\n\
    /usr/share/doc/fortune-mod-1.0/cs/LICENSE\n/usr/share/doc/fortune-mod-1.0/cs/README\n\
    /usr/share/doc/fortune-mod-1.0/fr\n/usr/share/doc/fortune-mod-1.0/fr/\n  COPYING.linuxfr\n\
    /usr/share/doc/fortune-mod-1.0/fr/\n  COPYING.glp\n/usr/share/doc/fortune-mod-1.0/fr/ffr\n\
    ...\n/usr/share/games/fortunes/songs-poems\n/usr/share/games/fortunes/sports.dat\n\
    /usr/share/games/fortunes/sports\n/usr/share/games/fortunes/startrek.dat\n/usr/share/games/fortunes/startrek\n\
    /usr/share/games/fortunes/translator-me.dat\n/usr/share/games/fortunes/translate-me\n\
    /usr/share/games/fortunes/wisdom.dat\n/usr/share/games/fortunes/wisdom\n/usr/share/games/fortunes/work.dat\n\
    /usr/share/games/fortunes/work\n/usr/share/games/fortunes/zippy.dat\n/usr/share/games/fortunes/zippy\n\
    /usr/share/sol-games/fortunes.scm\n/usr/share/games/fortune\n[jdoe@fraz jdoe]$\n\
    ```\n\nCode Listing 2.13 Use locate to find everything—everything—related to most\
    \ system files."
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Linking with ln (Hard Links)


    Suppose your boss just hired an assistant for you (''bout time, right?). You''ll
    need to make sure your new helper can access your files so you can pawn off your
    work on him. And, you''ll need to access the revised files just so you can keep
    up with what your helper''s been doing—and perhaps take credit for his work at
    the next staff meeting.


    A great way to give your helper easy access to your files is to create a hard
    link from your home directory. In making a hard link, all you''re doing is starting
    with an existing file and creating a link, which (sort of) places the existing
    file in your helper''s home directory. The link does not create a copy of the
    file; instead, you''re creating a second pointer to the same physical file on
    the disk. Rather than the additional pointer being secondary like an alias or
    shortcut in Macintosh or Windows computers, both of the pointers reference the
    same actual file, so from the perspective of the Unix system, the file actually
    resides in two locations (see Code Listing 2.14).


    Because using hard links often requires that you have access to another user''s
    home directory, you might venture to Chapter 5 for details about using chmod,
    chgrp, and chown to access another user''s directories and files.


    ```

    Code Listing 2.14 Hard links let two users easily share files.


    $ ls /home/deb/Projects/schedule/our* /home/helper/our*

    $ ls -l /home/helper/our*

    $ ln /home/Projects/schedule/our.projects.latest /home/helper/our_projects

    $ ls -l /home/helper/our*

    -rw-r--r--  3 e j r   3 users 1055 Jun 26 11:00 /home/helper/our.projects

    ```'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# To make a hard link:


    +   1. ls -l /home/deb/Projects/schedule/ -our* /home/helper/our*

    +   To begin, list the files in both directories to make sure that the file to
    link exists and that there’s no other file with the intended name in the target
    directory. Here, we list the files that start with our in both /home/deb/Projects/schedule
    and in /home/helper. In this example, we’re verifying that the file does exist
    in Deb’s directory and that no matching files were found in the helper’s directory
    (Code Listing 2.14).


    +   2. ln /home/deb/Projects/schedule/ -our.projects.latest /home/helper/our.projects

    +   Here, ln creates a new file with a similar name in the helper’s home directory
    and links the two files together, essentially making the same file exist in two
    home directories.


    +   3. ls -l /home/helper/o*

    +   With this code, your helper can verify that the file exists by listing files
    that begin with o*. Now the file exists in two places with exactly the same content.
    Either user can modify the file, and the content in both locations will change.


    # Tips


    +   You can remove hard links just like you remove regular files, by using rm
    plus the filename. See the section called Removing Files with rm in this chapter.


    +   If one user removes the file, the other user can still access the file from
    his or her directory.


    +   Hard links work from file to file only within the same file system. To link
    directories or to link across file systems, you’ll have to use soft links, which
    are covered in the next section.


    +   If you’re sneaky, you can use hard links to link directories, not just files.
    Make a new directory where you want the linked directory to be, and then use ln
    /home/whoever/existingdirectory/* /home/you/newdirectory/ to hard link all of
    the files in the old directory to the new directory. New files won’t be linked
    automatically, but you could use a cron job to refresh the links periodically—say,
    daily. See Chapter 9 for cron details.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Linking with ln -s (Soft Links)


    Now suppose you want to pawn off your entire workload on your new helper. Rather
    than just give him access to a single file, you’ll want to make it easy for him
    to access your entire project directory. You can do this using soft links (created
    with ln -s), which essentially provide other users with a shortcut to the file
    or directory you specify.


    Like hard links, soft links allow a file to be in more than one place at a time;
    however, with soft links, there’s only one copy of it and, with soft links, you
    can link directories as well. The linked file or directory is dependent on the
    original one—that is, if the original file or directory is deleted, the linked
    file or directory will no longer be available.


    Soft links are particularly handy because they work for directories as well as
    individual files, and they work across different file systems (that is, not just
    within /home, but anywhere on the Unix system).


    Like hard links, soft links sometimes require that you have access to another
    user’s directory and files. See Chapter 5 for more on file permissions and ownership
    and Chapter 7 for the lowdown on file systems.'
  merge: -1
  img_proc: true
- pgno: 60
  md: "# To make a soft link:\n\n+   1. `ls -l /home/deb /home/helper`\n+   \n+  \
    \ To begin, list the contents of both users' home directories. Here, we're verifying\
    \ that the directory we want to link does exist in Deb's directory and that no\
    \ matching directories or files exist in the helper's directory. See Code Listing\
    \ 2.15.\n\n+   2. `ln -s /home/deb/Projects /home/helper/Projects`\n+   \n+  \
    \ This command creates a soft link so the contents of Deb's home directory can\
    \ also be easily accessed from the helper's home directory.\n\n+   3. `ls -la\
    \ /home/helper`\n+   \n+   Listing the contents of /home/helper shows the existence\
    \ of the soft link to the directory. Notice the arrow showing the link in Code\
    \ Listing 2.15.\n\n# Tip\n\n+   - If you only need to create a link between two\
    \ files within the same file system, consider using hard links, as discussed in\
    \ the previous section, Linking with ln (Hard Links).\n\n```\n$ ls /home/deb /home/helper\n\
    /home/deb:\nProjects\n\n/home/helper:\nour_projects\n$ ln -s /home/deb/Projects\
    \ /home/helper/Projects\n$ ls -lo /home/helper/\ntotal 11\nd--------- 2 helper\
    \ users 1024 Jun 29 21:18 .\ndrwxr-xr-x 11 root root 1024 Jun 29 21:03 ..\n-rw-r--r--\
    \ 1 helper users 3768 Jun 29 21:03 .Adefaults\n-rw-r--r-- 1 helper users 24 Jun\
    \ 29 21:03 .bash_logout\n-rw-r--r-- 1 helper users 220 Jun 29 21:03 .bash_profile\n\
    -rw-r--r-- 1 helper users 124 Jun 29 21:03 .bashrc\nlrwxrwxrwx 1 ejr users 18\
    \ Jun 29 21:18 Projects -> /home/deb/Prs\n-rw-r--r-- 3 ejr users 1055 Jun 26 11:00\
    \ our_projects\n$\n```\n\nCode Listing 2.15 Use ln -s to make soft links and connect\
    \ directories."
