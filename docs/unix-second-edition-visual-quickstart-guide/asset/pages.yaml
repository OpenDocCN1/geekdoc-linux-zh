- pgno: 40
  md: '# Creating Directories

    with mkdir


    You might think of directories as being drawers in a file cabinet; each drawer
    contains a bunch of files that are somehow related. For example, you might have
    a couple of file drawers for your unread magazines, one for your to-do lists,
    and maybe a drawer for your work projects.


    Similarly, directories in your Unix system act as containers for other directories
    and files; each subdirectory contains yet more related directories or files, and
    so on. You’ll probably create a new directory each time you start a project or
    have related files you want to store at a single location. You create new directories
    using the mkdir command, as shown in Code Listing 2.1.


    ```

    $ ls

    Projects      all_programs.txt  local_programs.txt  schedule

    Xrootenv.0    files             newer_programs      short.fortunes

    all.programs  fortunes          newest.programs     temp

    $ mkdir Newdirectory

    $ ls -l

    total 159

    drwxrwxr-x  2 ejr  users  1024 Jun 29 11:40 Newdirectory

    drwxrwxr-x  2 ejr  users  1024 Jun 28 12:48 Projects

    -rw-rw-r--  1 ejr  users   7976 Jun 28 14:15 all.programs

    -rw-rw-r--  1 ejr  users   7479 Jun 28 14:05 all.programs.txt

    -rw-rw-r--  1 ejr  users    858 Jun 28 12:45 files

    -rw-rw-r--  1 ejr  ejr  128886 Jun 27 09:05 fortunes

    -rw-rw-r--  1 ejr  users      0 Jun 28 14:05 local.programs.txt

    -rw-rw-r--  1 ejr  users    497 Jun 28 14:13 newer.programs

    -rw-rw-r--  1 ejr  users   7479 Jun 28 14:13 newest.programs

    lrwxrwxrwx  1 ejr  users     27 Jun 26 11:03 schedule -> /home/deb/Pre

    -rw-rw-r--  1 ejr  ejr   1475 Jun 27 09:31 short.fortunes

    drwxrwxr-x  2 ejr  users  1024 Jun 26 06:39 temp

    $

    ```


    Code Listing 2.1 Typing mkdir plus a directory name creates a new directory. Listing
    the files, in long format, shows the new directory. The "d" at the beginning of
    the line shows that it’s a directory.'
