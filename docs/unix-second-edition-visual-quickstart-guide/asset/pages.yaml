- pgno: 354
  md: '# 5. cp $i $i.bak


    Make a backup copy of each file before you change it. Remember, Murphy is watching
    you.


    # 6. sed "s/<\/\*BLINK\*\/>/g" $i > $i.new


    Specify your search criteria and replacement text. A lot is happening in this
    line, but don''t panic. From the left, this command contains sed followed by


    +   ▲ ", which starts the command.

    +   ▲ s/, which tells sed to search for something.

    +   ▲ <, which is the first character to be searched for.

    +   ▲ \/, which allows you to search for the /. (The \ escapes the / so the /
    can be used in the search.)

    +   ▲ *, which specifies zero or more of the previous characters (\/). which takes
    care of both the opening and closing tags (with and without a / at the beginning).

    +   ▲ BLINK, which indicates the rest of the text to search for. Note that this
    searches only for capital letters. You''ll want to add a line if your HTML document
    might use lowercase tags.

    +   ▲ //, which ends the search section and the replace section (there''s nothing
    in the replace section because the tag will be replaced with nothing).

    +   ▲ g, which tells sed to make the change in all occurrences (globally), not
    just the first occurrence on each line.

    +   ▲ ", which closes the command.

    +   ▲ $i is replaced with each filename in turn as the loop runs.

    +   ▲ > $i.new indicates that the output is redirected to a new filename.


    (See Code Listing 17.3.)'
  merge: -1
  img_proc: true
