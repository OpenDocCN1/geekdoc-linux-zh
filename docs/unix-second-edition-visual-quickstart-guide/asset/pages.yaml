    Code Listing 1.5 pwd displays the name of the current directory, which is particularly
    handy if you''ve been exploring the system. By combining commands, you can request
    the directory''s name and contents at one time.


    # Finding Yourself with pwd


    As you begin using Unix and start moving around in directories and files, you''re
    likely to get a bit lost—that is, forget which directory or subdirectory you''re
    in. You can use the pwd command to get a reminder of where you are, as shown in
    Code Listing 1.5.


    You can request just the directory name, or you can get fancy and request the
    directory''s name and its contents, courtesy of ls.


    # To find out the name of the current directory:


    +   - pwd


    This command displays the path and name of the directory you are currently in.
    The path names each of the directories "above" the current directory, giving you
    the full picture of where you are in relationship to the system root.


    # To find out the name of the current directory and its contents:


    +   - ls ; pwd


    By combining the ls and pwd commands, you can request the directory''s name and
    contents, as shown in Code Listing 1.5.


    # Tips


    +   - Type in pwd immediately after you log in. You''ll see where your home directory
    is in the overall system (aka the full path name for your home directory).


    +   - On some Unix systems, you won''t need to use pwd to find out where you are.
    Some systems display the current directory at the shell prompt by default—something
    like /home/ejr>. If you''d like to add or get rid of this, or if you want more
    information about shells and customizing your shell, see Chapter 8, Configuring
    Your Unix Environment.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Piping Input and Output


    In general, you can think of each Unix command (ls, cd, and so on) as an individual
    program that Unix executes. For example, if you type cat /etc/mold at the prompt,
    Unix will display the contents of mold in the /etc directory. Each program requires
    input (in this example, cat, the program, takes the contents of /etc/mold as input)
    and produces output (i.e., the displayed results).


    Frequently, you''ll want to run programs in sequence. For example, you could tell
    Unix to read your resume and then spell-check it. In doing this, you connect two
    commands together and have them run in sequence. This process, in which you connect
    the output of one program to the input of another, is called piping. Depending
    on what you want to do, you can pipe together as many commands as you want—with
    the output of each command acting as the input of the next.


    As Figure 1.7 shows, you pipe commands together using the pipe symbol, which is
    the | character. In the following example, we''ll pipe the output of the ls command
    (which lists the contents of a directory) to the more command (which lets you
    read results one screen at a time). For details about more, see Viewing File Contents
    with more, later in this chapter.


    # To pipe commands:


    +   - ls | more


    Here, all you do is include a pipe symbol between the two commands. This code
    produces a list of the files in the current directory, then pipes the results
    to more, which then lists the results one screen at a time (see Figure 1.7).


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_28_0.png)


    # Tips


    +   - If you want to pipe more than two commands, you can. Just keep adding the
    commands (with a pipe symbol for each) in the order you want them executed.


    +   - Remember that the output of each command is piped to the next command. So
    a piped command, such as ls | spell | sort, could list files within a directory,
    then spell-check the list, then sort the misspelled words and display them onscreen.
    The filenames that are found in the system dictionary would not appear.


    +   - Venture to Chapter 15 to find out more about running a spell-checker and
    Chapter 6 to find out more about sorting.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Redirecting Output


    Suppose you’ve developed your resume and spell-checked it. As you learned in the
    previous section, the results you see onscreen will be the output of the last
    command—in this case, a list of misspelled words. A lot of times, you’ll want
    to redirect the final output to another location, such as to a file or a printer
    (if a printer is an option for you), rather than view it onscreen. You can do
    this using redirection, which sends the final output to somewhere other than your
    screen.


    As shown in Code Listing 1.6, you will often redirect output results to a file.
    Notice the greater-than symbol (>), which indicates that the output of the program
    is to be redirected to the location (or filename) you specify after the symbol.


    In the following examples, we’ll show you how to redirect output to a new file
    and how to redirect output to append it to an existing file.


    ```

    [jdoe@frazZ jdoe]$ ls /usr/local/bin > local.programs.txt

    [jdoe@frazZ jdoe]$ ls local*

    localize localono local.programs.txt localyokel

    [jdoe@frazZ jdoe]$ ls /usr/bin >> other.programs.txt

    [jdoe@frazZ jdoe]$

    ```


    Code Listing 1.6 In this case, the output of ls gets redirected to local.programs.txt,
    as indicated by the greater-than (>) symbol. The asterisk wildcard (*) acts as
    a placeholder for letters or numbers. Finally, the listing of /usr/bin gets appended
    to the other.programs.txt file.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# To redirect output to a new file:


    +   1. ls /usr/local/bin >

    +      → local1.programs.txt


    In this case, we start with the ls command and a specific directory, add a greater-than
    symbol (>), and then specify a file-name. This will redirect the output of ls
    to a file named local1.programs.txt. Be careful with this! If the file already
    exists, it may be replaced with the output of the ls program here.


    +   2. ls local1*


    Here, we''re just checking to see that the new local1.programs.txt file has successfully
    been created. The asterisk wildcard (*) specifies that we want a list of all files
    that begin with the word local, such as localize, localyoke, or localuno (see
    Code Listing 1.6). See the next section, Using Wildcards, for handy wildcard information.


    # To append output to an existing file:


    +   ls /usr/bin >> all.programs.txt


    Appending output to an existing file is similar to redirecting it to a new file;
    however, instead of creating a new file to hold the output (or replacing the contents
    of an existing file), you add content to the end of an existing file. Notice that
    you use two greater-than symbols here, rather than one.


    # Tip


    You can pipe and redirect at the same time. For example, you might list a directory,
    pipe it to wc to count the entries, then append the results to a directoryinfo
    file, like this: ls l wc -l >> directoryinfo. You can learn more about counting
    files and their contents with wc in Chapter 6.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Using Wildcards


    ```

    [jdoe@frazZ Project]$ ls

    keep keeper.jpg kept kidder.txt

    → kiddo kidnews kidneypie

    → kids kidupdate

    [jdoe@frazZ Project]$ ls ki

    kidder.txt kiddo kidnews kidneypie

    → kids kidupdate

    [jdoe@frazZ Project]$ ls kid*

    kidder.txt kiddo kidnews kidneypie

    → kids kidupdate

    [jdoe@frazZ Project]$ ls k???

    keep kept kids

    [jdoe@frazZ Project]$ ls *dote

    kidupdate

    [jdoe@frazZ Project]$ ls ?up*

    kidupdate

    [jdoe@frazZ Project]$ ls k?d*

    kidder.txt kiddo kidnews kidneypie

    → kids kidupdate

    [jdoe@frazZ Project]$

    ```


    Code Listing 1.7 You use wildcards (? or *) to act as placeholders for missing
    characters.


    You might think of wildcards as being placeholders for omitted letters or numbers.
    For example, if you’re looking for a file but aren’t sure whether you named it
    kidnews or kidupdate, you can include a wildcard to stand for the part you’re
    uncertain of. That is, you could list the files of a directory with ls kid* (Code
    Listing 1.7), which would list all files starting with the characters “kid”. In
    the resulting list, you’d find a file named kid if there were one, as well as
    files that begin with kid but have varying endings, such as kidnews (aha, the
    lost file!), kiddo, or kidneypie.


    You can use wildcards for just about any purpose in Unix, although listing files
    and directories will likely be the most common use. Just follow these guidelines:


    +   You use ? as a placeholder for one character or number.


    +   You use * as a placeholder for zero or more characters or numbers. Zero characters,
    in case you’re curious, specifies that the search results include all variants
    of kid, including the word itself with no suffix.


    +   You can include a wildcard at any place in a name: at the beginning (*kid),
    somewhere in the middle (k*d), at the end (ki*), or even in multiple places (*kid*).'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Viewing File Contents with more


    As you become more familiar with Unix, you''ll want to start exploring the contents
    of files, including some program files and scripts as well as files you (eventually)
    create. One of the easiest ways to view file contents is to use the more command,
    which tells Unix to display files onscreen, a page at a time. As shown in Figure
    1.8, long files are displayed with "More" at the bottom of each screen so that
    you can move through the file one screen at a time using the Spacebar.


    # To view a file with more:


    +   1. more fortunes

    +   At the prompt, type more plus the name of the file you want to view. You''ll
    see the contents of the file you requested, starting at the top (Figure 1.8).

    +   2. Spacebar

    +   Press the Spacebar to see the next screen of information. As you move through
    the file, you can press B to move back through previous screens.

    +   3. Q

    +   When you''re done, press Q to go back to the shell prompt.


    # Tips


    +   - If you want to view just an additional line (rather than an entire screen)
    when using more, press Enter instead of the Spacebar.

    +   - You can also use less to view files. less is very similar to more, but more
    powerful and flexible.

    +   - You can also view files using the cat command. See the next section for
    the full scoop.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_32_0.png)


    Figure 1.8 The more command lets you move through a file one screen at a time,
    providing a "More" indicator at the bottom of each screen.'
  merge: -1
  img_proc: true
