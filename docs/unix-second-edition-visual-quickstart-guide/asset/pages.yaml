    Code Listing 8.8 Testing after you update your prompt is always a good idea.


    # 3. PROMPT="%n %d $ "


    For example, we often set our prompt to include two tidbits of information: the
    userid (as we have many different accounts, we can always use a reminder!) and
    the date (time flies when you’re having fun, right?). We’re adding these bits
    of information instead of the existing default prompt, but saving the default
    with a # sign at the beginning, just in case (Figure 8.2).


    # 4. Save the file and exit from the editor.


    # 5. su - ejr


    Log in again with your changed prompt to try it out.


    # Tips


    +   - Note the trailing space in the prompt code: PROMPT="%n %d $ ". This space
    can help make it easier to use the prompt because it keeps your commands from
    bumping into your prompt.


    +   - You can also set your prompt so that the information you set appears on
    one line and your actual prompt appears on the next (Code Listing 8.9). To do
    so, use single quotes (‘ ’) and a $ in the environment variable setting then a
    \n for the new line, as in PROMPT-$’%n %m\n $’. This forces the shell to treat
    the \n as a new line, not just as random characters in the prompt string.'
