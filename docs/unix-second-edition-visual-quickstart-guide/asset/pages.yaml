  md: "# Working with Encoded & Compressed Files\n\n```\n[ejr@hobbes compression]$\
    \ ls -l *.Z\n-rw-r--r-- 1 ejr users 297207 Jul 27 10:06\n    tar.gz\n[ejr@hobbes\
