- pgno: 255
  md: '![](img/6ffd6bb320ccf354f5a4d57c9d95190d_255_0.png)


    Figure 11.14 All you have to do is tell Unix where you want your messages forwarded
    to.


    # Tips


    +   - Check with your system administrator to see if a .forward file will really
    do what you want. Many newer Linux and Unix systems automatically send mail to
    procmail (and ignore the .forward file), so you might need to use a procmail recipe
    to forward your mail. It’s equally effective, but just different. See the section
    on procmail later in this chapter for details.

    +   - If you want, you can keep a copy of all incoming messages (in your incoming
    email box, just where they’d usually be) and forward them to unsuspecting recipients.
    Just type yourid, otheraddress.com (filling in your userid on the current system
    for yourid and the address to which to forward the mail for the other one).

    +   - Forwarding messages is also handy when you change ISPs. You can forward
    all messages sent to your old address to your new one, which helps tremendously
    in ensuring that you receive all your important messages while your friends and
    co-workers update their address books.


    # Forwarding Incoming Messages


    Suppose you’re the boss of a big project, and everyone sends you all the important
    related email messages. You can tell Unix to automatically forward these incoming
    messages to the people who will actually do something about them. Hey, you’re
    the boss, right? Or maybe you just got a different email account, and you want
    to forward all of the incoming mail sent to your old address to your new address.
    As Figure 11.14 shows, all you have to do is create a .forward file.


    # To forward incoming email messages:


    +   1. vi ~/.forward

    +   To begin, type vi at the shell prompt (or the appropriate command for whichever
    editor you are using), indicate your home directory (with ~/), and then put .forward
    as the filename.

    +   2. mynew@raycomm.com

    +   Add, as the first line of the file, the address to which you want your email
    forwarded (Figure 11.14). In addition to forwarding to a single address, you can
    also use a .forward file with multiple addresses on multiple lines to send incoming
    email to several addresses at once.

    +   3. Save and close the file.

    +   Check out Chapter 4 for details about saving and closing files using pico
    or vi.'
  merge: -1
  img_proc: true
- pgno: 256
  md: "# Announcing an Absence with vacation\n\nIf you’re planning a vacation and\
    \ will be away from your email for a while, let Unix announce your absence for\
    \ you (Figure 11.15). Using the vacation program, you can have Unix send a reply\
    \ saying that you’re out of the office to everyone who sends you email.\n\nKeep\
    \ in mind that vacation is quite variable among different Unix systems and ISPs.\
    \ What you have might be different from the “standard” form used here. Be sure\
    \ to check with your system administrator for specific instructions if you have\
    \ any problems, and also look at the procmail section of this chapter, as many\
    \ newer Linux and Unix systems use procmail instead of a .forward file to tell\
    \ vacation to respond to your messages.\n\n# To send “I’m on vacation” messages\
    \ using vacation:\n\n+   1. `vi ~/vacation.msg`\n+   \n+      At the shell prompt,\
    \ type `vi ~/vacation.msg`. You’ll need to edit a message (a template, actually)\
    \ for the vacation that people should receive when they email you, as shown in\
    \ Figure 11.15.\n\n+   2. `Subject: away from my mail!`\n+   \n+      Thanks for\
    \ emailing me about $SUBJECT. Fortunately for me, I’m taking a fabulous vacation\
    \ mowing my lawn, doing laundry, and catching up on other things I can’t do because\
    \ I usually work so much. If you would like me to stay on vacation, please email\
    \ my boss (boss@example.com) and let her know. Thanks!\n+   \n+      Create and\
    \ edit the text to say what you want.\n+   \n+      The $SUBJECT term in the text\
    \ will be replaced with the actual subject of the email sent to you.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_256_0.png)"
  merge: -1
  img_proc: true
- pgno: 257
  md: '```

    [ejr@hobbes ejr]$ cat ~/.forward

    [ejr, "|vacation ejr"]

    [ejr@hobbes ejr]$

    ```


    Code Listing 11.6 Your .forward file should reference the vacation file.


    # 3. Save your text and exit the editor.


    Chapter 4 has the gory details about saving and exiting in pico and vi.


    # 4. vacation -I


    Type vacation -I at the shell prompt to start vacation and tell it to respond
    to all incoming messages. You''ll still get the incoming messages in your in-box.
    In fact, they''ll pile up in your in-box and wait for you to return.


    # 5. cat ~/.forward


    Look at the .forward file in your home directory to verify that it contains a
    reference to the vacation program. Your .forward file specifies what should happen
    to your mail upon receipt. In this example, it should be processed by vacation.
    The reference to vacation is usually automatically inserted by the vacation program,
    but if it''s not there, you''ll need to edit the .forward file and add text like
    `yourid, "|vacation yourid". Of course, substitute your real userid for the placeholder
    above, and possibly include the full path to vacation (/usr/bin/vacation on our
    system). (See Code Listing 11.6.)


    # Tip


    +   - Remember to unsubscribe to all mailing lists before you start vacation.
    If you don''t, you''ll send a vacation announcement to a whole list of people
    who likely don''t care (not to mention that you''ll really irritate the list administrator!).
    Or, worse, you might cause a mail loop (in which your messages to the list are
    acknowledged by the server, and the acknowledgements are in turn sent vacation
    announcements), causing hundreds or thousands of messages to accumulate in your
    account. It shouldn''t happen, but it sometimes does.


    # To stop vacation emails:


    +   - mv .forward vacation-forward


    At the shell prompt, move the .forward file that references the vacation program
    to a different name (in this case, vacation-forward). You could just delete it
    or remove the reference to vacation, but it''s easier to save it so you can reuse
    it for your next vacation.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Configuring procmail


    Let''s see...two messages from the boss...17 messages from the string collector''s
    discussion group...oh, hey, a message from mom...and...


    One of the handiest things you can do to make your Unix life easier is to use
    procmail (a mail-filtering program) to automatically handle some of your incoming
    email.


    In this section, we''ll show you how to configure procmail so you can manage incoming
    messages. As Figures 11.16 and 11.17 show, you need to do two things to set up
    your system to manage mail with procmail:


    +   - Specify settings for procmail (Figure 11.16). For example, incoming mail
    normally gets plunked directly into your in-box; however, procmail filters mail
    before it even gets to your in-box, so you need to tell procmail where your mail
    folders are, among other things.


    +   - Tell procmail to do its thing (Figure 11.17). Essentially, you create a
    .forward file that sends your incoming mail to procmail for processing before
    you ever see it. This step is not necessary for many systems, particularly newer
    Linux and Unix systems.


    # To specify settings for procmail:


    +   1. pico ~/.procmailrc

    +   To begin, access your editor and create a .procmailrc file in your home directory.


    +   2. LOGFILE=$HOME/.mailog

    +   Give procmail a place to log all of its activities, so it can tell you what
    it''s done: "I threw away 7 messages from your boss... filed 3 messages from Joe
    in the GolfBuddies folder..." In this example, we tell procmail to keep a log
    file called .mailog in our home directory (Figure 11.16). Keep an eye on this
    file, because it can grow large over time.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_258_0.png)


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_258_1.png)'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Tips


    +   - Check with your system administrator to see if you actually need a .forward
    file. Many Linux and Unix systems automatically check for a .procmailrc file,
    even without a .forward file.

    +   - After you set up your procmail processing, be patient. Sometimes procmail
    processes email on a specific schedule (hourly, for example), so testing it may
    be a little time-consuming.

    +   - Use tail -f .maillog to keep an eye on the log in real time. That tells
    tail to just keep showing you the end of the file, even as stuff is added to it.
    Use Ctrl[C to stop.


    # 3. PATH=/usr/bin:/usr/local/bin:/bin


    Specify the path for your executable programs. It''s a good idea to do this now,
    just in case you eventually use procmail to more extensively filter or autorespond
    to messages.


    # 4. DEFAULT=/var/spool/mail/yourid


    Specify the location for your incoming mail. Remember, the filter gets the mail
    before it ever reaches the in-box, so you need to tell procmail where your in-box
    is. Check with your system administrator to confirm the DEFAULT. (/var/spool/mail/yourid
    is typically, but not always, the location, but obviously with your real userid,
    not yourid.)


    # 5. MAILDIR=$HOME/mail


    Specify where procmail should find your mail program and all the folders and information
    it creates. If you''re using pine, you will probably type this line exactly as
    shown. If you''re using mutt, you might need to use Mail instead of mail.


    # To turn on procmail filtering:


    +   1. pico ~/.forward

    +   Use your favorite editor to create a .forward file in your home directory.

    +   2. "!IFS= '''' && exec /usr/bin/procmail -- -f - || exit 75 #yourid"

    +   Enter the text exactly as shown, but substitute your userid for yourid above
    (Figure 11.17). If procmail is not located at /usr/bin, type in the actual location.
    /usr/local/bin would be another likely directory.

    +   3. Save and close the file.

    +   That''s it! Now all you have to do is wait for incoming messages and see if
    they get filtered as you intended (as you''ll set up in the next section).'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Responding to Email with procmail


    procmail can help you automatically—or selectively—respond to email. As you’ll
    see, procmail is very similar to forwarding email and using the vacation program,
    but you’ll probably find procmail much more flexible.


    # To specify how messages should be filtered (to "write a recipe"):


    +   1. vi ~/.procmailrc

    +      In vi, access your .procmailrc file.

    +   2. Move to the end of the file, below the setup information.

    +   3. :0:

    +      Start a new recipe with :0:, as shown in Figure 11.18. (Don’t ask why to
    use :0:. That’s just the way it is.)

    +   4. * ^TOGolfBuddies

    +      Set the criteria for procmail to filter with. Here.

    +      ▲ * ^TO tells procmail to examine the TO line (and, actually, the CC line,
    too) of all incoming messages.

    +      ▲ GolfBuddies is the text to match in the TO line (as in TO: GolfBuddies@nowhere.nowhen.com).
    Of course, you’d put in the actual name of the list to look for (or the alias
    for your mailing list, or whatever), rather than GolfBuddies.

    +   5. $MAILDIR/FriGolfBuddies

    +      Specify where the filtered mail should go. In this case, filtered mail
    would go in the FriGolfBuddies folder, but you might filter messages from mailing
    lists into a listmail folder.

    +   6. Save and close the file.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_260_0.png)'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# To forward mail with procmail:


    +   1. `pico ~/.procmailrc`

    +   To begin, access your editor and edit the `.procmailrc` file that you previously
    created in your home directory.

    +   2. `:0:`

    +   On a new line at the bottom of the file, add `:0:`, which starts a procmail
    recipe. This basically tells procmail to "lock" your mail directory while it''s
    processing mail.

    +   3. `! myotheremail@example.com`

    +   Provide a pipe (!) and the address to which to send the mail.

    +   4. Save and close the file.

    +   Now all email that you receive will be automatically forwarded to myotheremail@example.com.


    # Use procmail to Toss Spam Messages


    The following recipe.


    ```

    :0:

    * !TO. *cwr@*. *raycomm.com

    $MAILDIR/spam

    ```


    filters messages that aren''t explicitly addressed to a user id with cwr before
    the @ and raycomm.com at the end and places them into a special folder called
    spam. Put the spam filter at the end of your list of rules so all of the messages
    originating from your mailing lists and other important messages are filed first.
    After testing this and making sure that you like it and it doesn''t pitch valuable
    messages, you could change the last line to /dev/null to just throw away the garbage.


    For more complex and sophisticated spam solutions, check the options at http://directory.google.com/Top/Computers/Software/Internet/Clients/Mail/Unix/Procmail/Filtering_Spam/.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# To invoke vacation with procmail:


    +   1. pico ~/.procmailrc

    +   To begin, access your editor and edit the .procmailrc file that you previously
    created in your home directory.


    +   2. :0 c

    +   | /usr/bin/vacation jdoe

    +   On a new line at the bottom of the file, add the recipe shown to send a copy
    (the c at the end of the first line) of your email to the vacation program. See
    Announcing an Absence with vacation in this chapter for more information about
    the vacation program.


    +   3. Save and close the file.

    +   Now all email that you receive will be stored and passed along for the vacation
    program to respond to.


    # Tips


    +   Your .procmailrc file gets processed in order. As soon as a recipe matches
    an incoming email message, it''s applied. So if your first recipe is the forwarding
    recipe above, procmail will never even get to any later recipes. If no recipes
    are matched, mail will be delivered to the DEFAULT location you specified (see
    Configuring procmail, earlier).


    +   After you set up your procmail processing, be patient. Sometimes procmail
    processes email on a specific schedule (hourly, for example), so testing it may
    be a little time-consuming.


    # Sample procmail Recipes


    The following recipes, with annotations, should help you get started filtering
    with procmail.


    ```

    # Filter based on the To:, Cc: and similar headers


    :0:

    * !^TO.*@nw.*@raycomm.com


    SMAILDIR/interesting

    ```


    ```

    # Filter based on the subject


    :0:

    * ^Subject:.*Status Report.*


    SMAILDIR/status-reports

    ```


    ```

    # Filter based on sender


    :0:

    *^From:.*spammer@example.com


    SMAILDIR/IN.TO-DELETE

    ```


    ```

    # Filter directly to garbage, irrevocably, based on sender


    :0:

    *^From:.*spammer@example.com


    /dev/null

    ```


    ```

    # Filter based on size (greater than 1000 bytes)


    :0:

    * > 1000


    SMAILDIR/longish

    ```'
  merge: -1
  img_proc: true
