- pgno: 289
  md: '# To read newsgroup messages with pine:


    +   1. pine

    +   At the shell prompt, type pine (unless you''re still in pine from the previous
    section).

    +   2. L

    +   Press L to view the list of folders.

    +   3. Tab Tab Tab. Ah-ha!

    +   Tab down to the news collection (Figure 12.11).

    +   4. V

    +   Press V to view the folder you choose.

    +   5. Read messages just like you''d read mail.

    +   Check back with Chapter 11 for a quick reminder about reading, sending, and
    replying with pine.


    # Tips


    +   - When subscribing to newsgroups, you can just enter the name of a newsgroup
    (or part of the name) after you press A to add a new subscription, rather than
    search through the entire list of newsgroups.

    +   - Use $h from the message index in pine to first specify that you want to
    sort (the $), and then that you want to sort by message threads (the h). Using
    $h makes news reading much more enjoyable and less frustrating.

    +   - After you subscribe to a newsgroup, you might have a few initial messages
    that show up as "No Message Text Available." Just scroll down to other messages.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Reading News with tin


    Another program you can use to read news is tin, which is very similar to the
    mutt email program. You’ll find that it’s fairly intuitive to use (as news readers
    go) and that the menu options and interface are similar to those of mutt. However,
    tin is just a news reader (unlike pine, which is also an email program), so your
    only tasks here are subscribing to newsgroups (Figure 12.12) and reading newsgroup
    messages (Figure 12.13).


    # To subscribe to newsgroups with tin:


    +   1. tin

    +   At the shell prompt, type tin. You’ll see a list (quite possibly empty) of
    all of the groups to which you’ve subscribed and a menu at the bottom (Figure
    12.12). You might need to type tin -r, depending on the news configuration on
    your system.


    +   2. Y

    +   Optionally, press Y to "yank" the whole list of newsgroups into the reader
    if you want to see your choices.


    +   3. s rec.woodworking

    +   Type s followed by the newsgroup name to subscribe to a newsgroup.


    +   4. Q

    +   Keep subscribing to other newsgroups if you want, and then press Q to quit
    tin when you’re done.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_290_0.png)


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_290_1.png)'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# To read newsgroup messages with tin:


    +   1. tin

    +   At the shell prompt, type tin.


    +   2. 2

    +   Enter the number of the newsgroup you want to read (the number is in the list
    of newsgroups that tin displays). You can use your ↑ and ↓ keys to navigate and
    the Spacebar to move to the next screen.


    +   3. 1

    +   Choose the thread you want to read by number as well (Figure 12.13). You can
    use your ↑ and ↓ keys to navigate and the Spacebar to move to the next screen.


    +   4. Enter

    +   Press Enter an extra time to open a newsgroup message.


    +   5. N

    +   Use N (for next) and P (for previous) to read the messages and U to return
    to the list of threads.


    +   6. Q

    +   Press Q to quit tin.


    continued on next page'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# ✓ Tips


    +   - You can reply to any newsgroup message by pressing R, which will send your
    reply only to the person who posted the message. Type your message in the resulting
    editor screen and use S to send the message, T to spell-check it, Q to quit (cancel),
    or E to return to the editor and keep revising.

    +   - If you''d rather reply to the entire newsgroup, press F (to follow up) instead
    of R.

    +   - Many "binary" groups post encoded pictures, programs, and sound files. Save
    the newsgroup posting, then use uudecode (discussed in Chapter 13) to restore
    the file to its original state.

    +   - Press W from any tin screen to start a new posting to that newsgroup. Fill
    in the subject and type your message in the resulting editor screen.

    +   - If a newsgroup thread wanders onto a topic you don''t want to read about,
    just press K to kill it. All of the articles with that subject will be marked
    as already read, so you won''t see them again.

    +   - If your server doesn''t provide tin, slrn is another news reader that might
    be appropriate.

    +   - You can press H from any tin page to get help.'
