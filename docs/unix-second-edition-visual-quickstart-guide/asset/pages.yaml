- pgno: 198
  md: '# Setting Aliases

    with alias


    Aliases are nicknames of sorts that you use to enter commands more easily. For
    example, if you frequently use the command mail -s "Lunch today?" deb < .signature,
    you could set an alias for this command and call it lunch. Then, in the future,
    all you have to do is type in lunch, and the result is the same as if you typed
    in the longer command (Figure 8.8).


    # To set an alias with alias:


    +   1. Choose the appropriate file to edit, depending on which shell you''re using.

    +      ▲ zsh users should use ~/.zshrc

    +      ▲ bash users should use ~/.bashrc

    +      ▲ ksh users should use ~/.profile

    +      ▲ csh users should use ~/.cshrc

    +      If you don''t have the appropriate file, you''re welcome to use a different
    configuration file. Many people store all their aliases in a separate .alias file.


    +   2. vi ~/.bashrc

    +      Edit the configuration file you''ve selected.


    +   3. alias quit="logout"

    +      Type alias followed by the term you want to use as the alias, =, and the
    command for which you''re making an alias (in quotes). Here, we''re setting the
    word quit as an alias for the system command logout, so we can type quit instead
    of logout (Figure 8.8).


    +   4. Add as many other aliases as you want. See the sidebar called Good Aliases
    to Set for more ideas.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_198_0.png)


    Figure 8.8 Setting aliases can keep you from typing long names and code.


    # Good Aliases to Set


    Here are a few aliases you might find worthwhile to set on your system:


    +   • alias rm="rm -i" causes the system to prompt you about all deletions.


    +   • alias quit="logout" lets you use quit as a synonym for logout.


    +   • alias homepage="lynx http://www.raycomm.com/" lets you use homepage to start
    the lynx browser and connect to the Raycomm home page (substitute your home page
    as necessary).


    Or, if you''re coming from a DOS background, you might find the following aliases
    handy:


    +   • alias dir="ls -l" lets you use dir to list files.


    +   • alias copy="cp" lets you use copy to copy files.


    +   • alias rename="mv" lets you use rename to move or rename files.


    +   • alias md="mkdir" lets you use md to make a directory.


    +   • alias rd="rmdir" lets you use rd to remove a directory.'
  merge: -1
  img_proc: true
