- pgno: 206
  md: "# Scheduling Regularly Occurring Jobs with cron\n\nSuppose you want to send\
    \ yourself a reminder message just before you go home at the end of each day—say,\
    \ a reminder to turn off the coffeepot. Or, suppose you want to make a backup\
    \ copy of specific files each week. You can do this by using the crontab command\
    \ to schedule commands or scripts to run regularly at times you specify. In doing\
    \ so, you can schedule tasks to occur on specific days at specific times and know\
    \ that the jobs will happen unattended (Figure 9.2).\n\n# To schedule a regularly\
    \ occurring job with cron:\n\n+   1. crontab -e\n+   \n+   At the shell prompt,\
    \ type crontab, followed by the -e flag, which lets you edit your cron file. As\
    \ shown in Figure 9.2, your cron file will appear in your default editor. It's\
    \ likely to be empty (if you haven't set up cron jobs before), but you might have\
    \ some content in there.\n\n+   2. 55 16 * * 1-5 mail -s \"Go home now!\" ejray@raycomm.com\n\
    +   \n+   On the first line of the cron file, enter values for minutes, hours,\
    \ day of the month, month, and day of the week, then the command you want to run.\
    \ See the What Are Those Funky Numbers? sidebar for more details about specifying\
    \ times and days. In this example, we're sending an email to ejray every weekday\
    \ at 4:55 p.m. reminding him to go home.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_206_0.png)\n\
    \n# What Are Those Funky Numbers?\n\nWhen entering a cron job, you specify\n\n\
    +   - Minutes (0–59)\n+   - Hours (0–23)\n+   - Day of the month (1–31)\n+   -\
    \ Month (1–12)\n+   - Days of the week (0–6, with Sunday as 0)\n\nIf you replace\
    \ the number with a *, cron will match all possible values, so, if a job is scheduled\
    \ for\n\n+   - 1 * * * *, it will happen at one minute after every hour\n+   -\
    \ 15 3 * * *, it will happen at 3:15 a.m. every day\n+   - 59 23 31 * *, it will\
    \ happen at 11:59 p.m., seven times a year (once in each of the months with a\
    \ 31st)\n+   - 0 12 * * 0, it will happen at noon on Sundays\n\nYou can use a\
    \ comma to separate multiple values. For example, if you want something to happen\
    \ on the hour and half-hour during December, you might use 0,30 * * 12 *.\n\n\
    Use a hyphen (-) to indicate a range. For example, to schedule something for every\
    \ hour from 9 a.m. to 5 p.m. every day, use 0 9-17 * * *."
  merge: -1
  img_proc: true
