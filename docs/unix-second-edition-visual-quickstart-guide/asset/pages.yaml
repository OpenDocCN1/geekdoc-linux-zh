- pgno: 112
  md: '# ✓ Tips


    +   - If you try to change group ownership and get an error message like "Not
    owner" or something similarly obscure, your userid doesn''t have the necessary
    authority to make the change. You''ll have to ask your system administrator for
    help.


    +   - Change group association only if you have a specific need to do so; you
    don''t want to make your files available to other people unnecessarily. Unless
    you are the system administrator, you won''t be able to control exactly who belongs
    to the group to which you''ve given access to your files.


    +   - If you change the group association of a specific directory, you also need
    to check permissions for the directory containing it. Users will not be able to
    change into the specific directory (regardless of their group membership) unless
    they also have read and execute permission for the directory containing it.


    +   - Just as with the `cp` and `mv` commands, covered in Chapter 2, you can use
    a `-R` flag with `chgrp` to recursively apply changes to a directory and all of
    the subdirectories and files in it. For example, to change the group association
    of the LatestProject directory and all its contents to the project group, use
    `chgrp -R project LatestProject` from the directory above LatestProject.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Changing Ownership of Files and Directories with chown


    # Tips


    +   - After you change a file''s ownership, what you can do with the file depends
    on the group and other permissions and memberships. The new owner, however, will
    be able to do anything with the file.

    +   - When changing the ownership of a directory, you can add the -R flag to chown
    to make it apply recursively to all files and directories below it.

    +   - If the system does not allow you to use chown to give files away, consider
    using cp to make a copy of a file to accomplish the same thing. If you copy someone
    else''s file (that you have permission to read) to another name or location, the
    copy is fully yours. (In this giving-the-file-away example, the recipient should
    use cp.)

    +   - Even if you can''t use chown, you could still be able to request that the
    system administrator change file ownership for you: "Could you please change the
    ownership of my rowyourboat file to Merrilee. with chown merrilee /home/shared/me/rowyourboat.
    Thanks!"


    Suppose you''ve been working on a file called rowyourboat, and your boss decides
    to let a coworker, Merrilee, take over the project. In this case, to fully pawn
    off the project to your coworker, you need to change ownership of the file from
    you to her. Depending on how your system administrator set up the system, you
    can usually change ownership of files using chown (Code Listing 5.6).


    # To change ownership with chown:


    +   1. ls -l

    +   For starters, type ls -l at the shell prompt to verify the file''s name and
    ownership, as in Code Listing 5.6. Remember that the ownership information is
    located after the permissions and linking information.

    +   2. chown merrilee rowyourboat

    +   Type chown followed by the userid of the person you want to transfer ownership
    to and the filename. In this case, the chown command changes the ownership for
    rowyourboat to merrilee. rowyourboat and its associated problems will now be hers,
    and life will be but a dream.


    ```

    [ejr@hobbes merrilee]$ ls -l

    total 26

    -rw-rw-r-- 1 ejr users 24850 Jul 24 15:17 rowyourboat

    [ejr@hobbes merrilee]$ chown merrilee rowyourboat

    [ejr@hobbes merrilee]$ ls -l

    total 26

    -rw-rw-r-- 1 merrilee users 24850 Jul 24 15:17 rowyourboat

    [ejr@hobbes merrilee]$

    ```


    Code Listing 5.6 Changing ownership of files transfers complete control.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Changing Permissions with chmod


    Suppose you''ve been working on a file called rowyourboat and you want to have
    your coworkers down the stream review it. To do so, you''ll need to give other
    people permission to access the document. You can either give people in specific
    groups access or give everybody on the Unix system access. In particular, you
    can specify permissions for u(ser—that''s you), g(roup), o(thers), and a(ll).


    In addition to specifying permissions, you can also specify how much access a
    person or group can have to your file. For example, you can specify r(ead), w(rite),
    and (e)x(ecute) access, depending on how much you trust them not to ruin your
    rowyourboat masterpiece.


    As shown in Code Listing 5.7, your first step is to check out what the current
    permissions are. Then, you can set permissions, add to them, or remove them as
    necessary.


    # To check current permissions:


    +   ls -l r*


    To begin, type ls -l r* to get a long listing of rowyourboat in the current directory.
    Code Listing 5.7 shows that the permissions are -rwxr-x--. This is actually three
    sets of permissions:


    +   For the user (rwx, in this example)

    +   For the group (r-x, here)

    +   For the world (---, here)


    In this example, the user has read, write, and execute permissions; the group
    has only read and execute permissions; and all other users have no permissions.


    ```

    [ejr@hobbes permissions]$ ls -l r*

    -rwxr-x-- 1 ejr users 152779 Jul 24 15:10

    * rowyourboat

    [ejr@hobbes permissions]$

    ```


    Code Listing 5.7 Use ls -l to see the permissions on files.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# To set permissions:


    chmod u=rwx,g=rx,o=r row*

    Type chmod and specify who has access. In this case users have read, write, and
    execute permissions; the group has read and execute permissions; and others have
    read permission for all files in the directory that start with row (Code Listing
    5.8).

    The equals sign (=) specifies that the permissions granted in the command are
    the only permissions that apply. Any previous permissions will be removed.

    The wildcard expression here (row*) specifies that the command applies to all
    files and directories that start with "row" in the current directory.


    ```

    [ejr@hobbes permissions]$ ls -l

    total 332

    -rw-rw-r-- 1 ejr users 24850 Jul 24 14:59 black

    -rw-r--r-- 1 ejr users 152779 Jul 24 15:10 rowyourboat

    -rw-r--r-- 1 ejr users 128889 Jul 24 14:33 sage.sayings

    -rw-rw-r-- 1 ejr users 23890 Jul 24 14:33 sayings

    [ejr@hobbes permissions]$ chmod u=rwx,g=rx,o=r row*

    [ejr@hobbes permissions]$ ls -l

    total 329

    -rwxr-xr-- 1 ejr users 24850 Jul 24 14:59 black

    -rwxr-xr-- 1 ejr users 152779 Jul 24 15:10 rowyourboat

    -rwxr-xr-- 1 ejr users 128889 Jul 24 14:33 sage.sayings

    -rwxr-xr-- 1 ejr users 23890 Jul 24 14:33 sayings

    [ejr@hobbes permissions]$

    ```


    Code Listing 5.8 You can set permissions to ensure that all files have equivalent
    permissions.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# To add permissions:


    ```

    chmod g+w rowyourboat

    ```


    At the shell prompt, enter chmod, followed by


    +   - The category. In this case, we''ve used g, for group, but you could also
    use o for others...or, of course, u for user, but you already have that access.
    You could also use a for all users (which includes u, g, and o).

    +   - A plus sign indicates that you''re adding the permission to the existing
    permissions, rather than setting absolute permissions.

    +   - The permissions to grant. Here, we''ve used w, for write permission, but
    you could also use r for read or x for execute permissions, as your needs dictate.

    +   - The filename (rowyourboat)


    # To remove permissions:


    ```

    chmod go-w rowyourboat

    ```


    At the shell prompt, use chmod go-w plus the filename to remove write permissions
    for everyone except you, the file''s owner. Note that we handled both group and
    other in a single command this time, although we could have used chmod g-w rowyourboat
    and chmod o-w rowyourboat to accomplish the same thing.


    # Tips


    +   - You can also use the -R flag with chmod to recursively apply the changes
    you make to permissions to all files and subdirectories in a directory. For example,
    chmod -R go-rwx * revokes all permissions from everyone except the user for all
    files in the current directory, all subdirectories in the current directory, and
    all files in all subdirectories.

    +   - There are about a million and one ways to express permissions. For example,
    you could use chmod ugo= * (note the space before the *) or chmod u-rwx,g-rwx,
    o-rwx * to revoke all permissions from all files in the directory. (Note that
    you''ll have to add your own permissions back to the files before you can do anything
    with them, if you try this out.)

    +   - If you want to change permissions for multiple files, either use a wildcard
    expression or separate the filenames with commas (but no spaces).'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Translating Mnemonic Permissions to Numeric Permissions


    # Table 5.1


    # Numeric Equivalents for Mnemonic Permissions


    | Mnemonic (rwx) permissions | Binary Equivalent | Numeric Equivalent |

    |---|---|---|

    | -- | 000 | 0 |

    | -x | 001 | 1 |

    | -w- | 010 | 2 |

    | -wx | 011 | 3 |

    | r-- | 100 | 4 |

    | r-x | 101 | 5 |

    | rw- | 110 | 6 |

    | rwx | 111 | 7 |


    The permissions of a file, as you’ve seen throughout this chapter, come in sets
    of three—rwx, for read, write, and execute permissions. And, as we showed you,
    you set these permissions by specifying that each one is either “on” or “off.”
    For example, ugo+rwx sets read, write, and execute permissions to “on” for user,
    group, and other, while o+r-w sets read and write to “on” for everyone, and o-x
    sets execute to “off” (indicated in directory listings with the -).


    Rather than set permissions with letters and hyphens, however, you can translate
    them into numeric values, using 1 for “on” and 0 for “off.” So, rw-, with read
    and write “on” and execute off, would translate into the numbers 110. You could
    think of this as counting in binary—000, 001, 010, 011, 100, 101, 110, 111, with
    a 1 in each place that the permission is set to “on”.


    Each of these combinations of on/off permissions (or binary numbers) can be expressed
    as a unique decimal digit between 0 and 7, as shown in Table 5.1. It is these
    decimal digits that you use to set permissions.


    # To set permissions using numeric equivalents:


    +   - chmod 777 rowyourboat


    Type chmod followed by the desired permissions for user, group, and other using
    the numeric equivalents listed in Table 5.1, followed by the filename. In this
    example, we’ve used 777 to set read, write, and execute permissions to “on” for
    the user, group, and other.


    Or, for example, 724 would give the user full read, write, and execute permissions,
    the group only write permissions, and other only read permissions.


    # Tips


    +   - Setting permissions with numeric equivalents sets permissions absolutely,
    rather than adding to or subtracting from existing permissions.

    +   - Numeric equivalents don’t give you any more control than you have with ugo+rwx;
    however, you will need to use the numeric system to set default permissions that
    apply when you create new files. See the next section, Changing Permission Defaults
    with umask, for the full scoop.'
  merge: -1
  img_proc: true
- pgno: 118
  md: "# Changing Permission Defaults with umask\n\nEvery time you create a file,\
    \ the Unix system applies default permissions for you. This is great because,\
    \ for many uses, the default permissions will be just what you want. In other\
    \ cases, though, you'll want to specify different default permissions.\n\nYou\
    \ can change the default permissions using umask. The umask command uses a numeric\
    \ representation for permissions (as discussed in the previous section), but the\
    \ numeric value you specify here is not the same as the one you'd use with chmod.\
    \ (Don't ask why. We assume that Batman and Robin got together and made this command\
    \ usable only by the Wonder Twins when their powers were activated.) So you have\
    \ to figure out the umask value for the permissions you want, then use that value\
    \ to set the new default permissions.\n\nNote that you cannot set execute permissions\
    \ by default, so you're really only figuring out the read and write permissions\
    \ for u, g, and o categories.\n\n# To figure the umask value:\n\n+   1. 666\n\
    +   Start with 666. Again, don't ask why; it's just what you're supposed to start\
    \ with.\n+   \n+   2. Figure out which numeric values you'd use to set your desired\
    \ permissions with the chmod command.\n+   You might review the previous section,\
    \ Translating Mnemonic Permissions to Numeric Permissions, and peek at Table 5.1\
    \ in that section.\n+   \n+   3. Subtract that numeric value from 666.\n+   For\
    \ example, if the numeric value you'd use with chmod is 644, subtract that value\
    \ from 666: 666-644=022. 022 is the number you'll use with umask."
  merge: -1
  img_proc: true
- pgno: 119
  md: '```

    [ejr@hobbes permissions]$ umask 022

    [ejr@hobbes permissions]$ touch tryit

    [ejr@hobbes permissions]$ ls -l try*

    -rw-r--r-- 1 ejr users 0 Jul 26 16:35 tryit

    ```


    Code Listing 5.9 Use umask to set default permissions for future files.


    # To set default file-creation permissions with umask:


    +   umask 022


    Enter umask plus the number you calculated in the previous steps in this section
    (Code Listing 5.9).


    # Tips


    +   Any changes made with umask apply only to the current shell session. If you
    want to revert to the default permissions but don’t remember what they were, just
    log out and log back in and you’ll be back to normal.


    +   If you want to change permission defaults permanently—or at least beyond the
    current shell session—change them in the configuration files as discussed in Chapter
    8.


    +   You cannot set the default permissions to include execute permission; it’s
    a security feature, not an omission in Unix’s capabilities. For example, suppose
    you make a new file and copy your favorite commands (or the ones you often forget)
    into it. If you accidentally type the filename and the file is executable, you’ll
    run that list of commands and the consequences could be unfortunate. Therefore
    you have to explicitly grant execute permission for all files.


    +   Yes, 666 is considered the Number of the Beast. We think that it’s just a
    coincidence but given the potential for confusion in this section, we’re not sure.


    +   Use umask or umask -s (depending on your specific shell and environment settings)
    to display your current umask settings.'
  merge: -1
