  md: '# ✓ Tips


    +   - Be patient, and puzzle your way through if you encounter unexpected errors
    or if something just doesn’t go right. Reading the Makefile and source code is
    your best bet for solving problems.


    +   - After a failed attempt, type make clean or make dist clean to clear out
    the garbage before you try again.


    +   - Sometimes stuff just isn’t worth the trouble. Compiling and installing new
    software can be fairly difficult, and sometimes the problems you encounter aren’t
    easily resolved. In writing this chapter, for example, we had a great program
    to install but had to spend about four hours tweaking and fixing it to get it
    to compile. (That’s about three hours and 15 minutes longer than we’d planned
    on.) This can happen to anyone, so don’t get discouraged, but feel free to seek
    out help or simply find another program that does essentially the same thing—there’s
    enough software out there that technical difficulties in one place shouldn’t be
    any kind of serious obstacle.'
