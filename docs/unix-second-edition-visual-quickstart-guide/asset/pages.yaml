  md: "# Configuring Your Unix Environment\n\n```\n```text\n[ejr@hobbes ejr]$ NNTPServer=news.xmission.com\n\
    [ejr@hobbes ejr]$ export NNTPServer\n[ejr@hobbes ejr]$ echo $NNTPServer\nnews.xmission.com\n\
    [ejr@hobbes ejr]$\n```\n```\n\n**Code Listing 8.3** In the zsh, bash, and ksh\
    \ shells, you can add a new environment variable by specifying the variable and\
    \ its value, then exporting the variable to the system.\n\nBy following the steps\
    \ in this section, you can add or change environment variables for the current\
    \ session. As **Code Listing 8.3** shows, for example, you can specify a news\
    \ server environment variable (called **NNTPSERVER**) that some Usenet newsreaders\
    \ require to access the news (nntp) server.\n\n# To add or change a variable in\
    \ zsh, bash, or ksh:\n\n+   1. **NNTPSERVER=news.xmission.com**  \n+      At the\
    \ shell prompt, type the name of the variable (in this case, **NNTPSERVER**),\
    \ followed by an = and the value you want for the variable (here, news.xmission.com),\
    \ as shown in Code Listing 8.3. In this step, you're setting up the variable and\
    \ its value and making it available to all programs and scripts that run in the\
    \ current shell session.\n+   \n+      If the value contains spaces or special\
    \ characters, put the value in quotes.\n+   \n+   2. **export NNTPSERVER**  \n\
    +      Type export followed by the name of the variable. By exporting the variable,\
    \ you make it available to all programs and scripts that run in the current shell\
    \ session (again, Code Listing 8.3). Until it is exported, it is a shell variable,\
    \ which will not be available to other processes that this shell starts.\n+  \
    \ \n+   3. **echo $NNTPSERVER**  \n+      Optionally, type echo followed by a\
    \ $ and the name of the variable to have the shell tell you what value the variable\
    \ is set to.\n\n> **Tip**\n> \n> ▪ In bash, ksh, or zsh, save a step by typing\
    \ `export NNTPSERVER=news.xmission.com`.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_167_0.png)"
