- pgno: 243
  md: '# Tips


    +   - Rather than type in someone''s lengthy email address (such as joeblow@somefancompany.com),
    set up an alias with which you''d be able to just type in Joe or whatever. To
    set up aliases, use the address book (press A from the main menu) and follow the
    instructions given.


    +   - If you''re at the shell prompt and want to send email without bothering
    with the main pine interface, type pine followed by the email address you want
    to send mail to (for example, pine bigutz@raycomm.com). If you want to send email
    to multiple addresses, just separate them with commas or spaces, as in pine univqs@raycomm.com,
    info@raycomm.com


    # Our Two Cents on the Subject of Subjects


    +   - Always include a descriptive subject line that succinctly summarizes the
    message''s contents. For example, rather than say "Here you go," say "Comments
    on the Baskins proposal."


    +   - Never leave the subject line blank. Many people toss subjectless messages,
    thinking that they might be spam or otherwise not important enough to read.


    +   - Never use ALL CAPS in the subject line (or anywhere else, for that matter),
    as recipients may perceive this as being YELLED AT VERY LOUDLY.


    +   - Be aware of how spam filters work. Many ISPs use them to reduce the amount
    of spam (bulk messages, like junk mail, that are sent out to hundreds or thousands
    of people at one time) that goes through. Some filters are set to toss messages
    with subject lines typed in ALL CAPS. Others toss ones with a lot of exclamation
    points in the subject.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Chapter 11 Customizing pine


    Although pine is rather intuitive to use, it is also quite powerful, giving you
    ample options for customizing it. Figure 11.9 shows pine''s customization screen,
    as well as a few of the options you can choose.


    # To customize pine:


    +   1. pine

    +   2. M

    +      Press M to visit the main menu.

    +   3. S

    +      Press S to summon the setup menu.

    +   4. C

    +      Press C to access the configuration setup menu, which is shown in Figure
    11.9.

    +   5. Scroll through the configuration list using the [↑] and [↓] keys, pine
    offers you gobs of options to configure.


    Table 11.1 describes the ones you might find most useful.


    | Option | Description |

    |--------|-------------|

    | initial-keystroke-list | Specifies key commands for pine to use when starting,
    just as if you''d typed them in directly. |

    | nntp-server | Sets the news server name so you can read Usenet news in pine,
    as mentioned in Chapter 12. |

    | quit-without-confirm | Allows you to exit pine without the "are you sure?" message.
    |

    | signature-at-bottom | Puts your automatic signature at the end of the message
    you''re replying to, rather than above it. |

    | saved-msg-name-rule | Sets pine to automatically file your saved messages in
    a specific folder, based on the characteristics (sender, etc.) of the message.
    |

    | fcc-name-rule | Sets your copy of outgoing messages to be saved in a particular
    folder. We like the by-recipient option, which files messages according to whom
    we sent them to. |

    | use-only-domain-name | Sets pine to send all outgoing messages with just the
    domain name and not the machine name on the From: line. For example, our messages
    come from @raycomm.com, not from @frazz.raycomm.com. |


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_244_0.png)'
  merge: -1
  img_proc: true
