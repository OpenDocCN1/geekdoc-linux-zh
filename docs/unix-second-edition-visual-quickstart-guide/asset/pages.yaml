- pgno: 368
  md: '3. time -p ls 1> /dev/null

    Or you can send the stdout to oblivion (/dev/null, which just throws it away)
    and get stderr on your screen.


    4. time -p ls 2>&1 1> /dev/null

    Or you can send the stderr to stdout, and stdout to oblivion. It''s apparently
    pointless but useful in shell scripts if you care only to know whether something
    succeeded or failed.


    # Tips


    +   - If you''re using zsh, you''ll need to specify the full path to time (/usr/bin/time).
    time is a special zsh built-in command, so it works a bit differently from the
    other shells.

    +   - Redirecting stdout and stderr separately in csh is more challenging, but
    you can accomplish the same thing with time -p ls >& /dev/null.

    +   - If you send both stderr and stdout to /dev/null, you can echo $? to find
    out whether your command succeeded. You''ll get bonus points for being the first
    person who emails a valid original example of the value of this operation to unixvqs2@raycomm.com.'
