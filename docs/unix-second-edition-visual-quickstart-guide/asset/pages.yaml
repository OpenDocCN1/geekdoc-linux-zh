    Code Listing 8.13 Use grep to search your configuration files for a prompt statement.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_183_0.png)


    Figure 8.4 Edit your bash prompt statement in the editor of your choice.


    Depending on your Unix system, by default you might see as your prompt just a
    dollar sign ($), or perhaps a dollar sign and date, or other information as outlined
    in the Setting Your bash Prompt Promptly sidebar. You can set your prompt to include
    information that’s handy for you.


    You actually have multiple prompts in bash:


    +   • The main prompt that you usually think of as the shell prompt. This prompt
    is called PS1.


    +   • A secondary prompt that you see when the system requires additional information
    to complete a command. Logically, this prompt is called PS2.


    You can change either of these prompts using the following steps. You start by
    finding your prompt statement (Code Listing 8.13), then modifying it in your editor
    (Figure 8.4).


    # To change your bash prompt:


    +   1. grep PS1 ~/.bash* ~/.bashrc

    +      ./etc/bashrc


    To begin, search through the configuration files located in your home directory
    and in the /etc directory to find your prompt statement. It’ll look something
    like PS1="$ " or PS1="[\u@\h \W]$ " as shown in Code Listing 8.13. The Setting
    Your bash Prompt Promptly sidebar will help translate these symbols.


    continued on next page'
