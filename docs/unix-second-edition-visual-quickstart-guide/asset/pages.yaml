- pgno: 22
  md: '# 3. yournewpassword


    Type in your new password. Check out the Lowdown on Passwords sidebar for specifics
    about choosing a password.


    # 4. yournewpassword


    Here, you''re verifying the password by typing it again.


    The system will report that your password was successfully changed (specific terminology
    depends on the system) after the changes take effect. This is also shown in Code
    Listing 1.1.


    # Tips


    +   - Double-check your new password before you log out of the system by typing
    su - yourid at the prompt. Of course, substitute your real username (or log-in
    name) for yourid here. This command (switch user) lets you log in again without
    having to log out, so if you made a mistake when changing your password and now
    get a failed log-in message, you can find out before you actually disconnect from
    the system. If you have problems, contact your system administrator before you
    log out so you can get the problem resolved.


    +   - In some environments, you will use yppasswd, not passwd, to change your
    password, or even use a Web page or other means. When in doubt, defer to what
    your system administrator told you to do. ("The Rays said to use this other command"
    is likely to get all of us in trouble.)


    # The Lowdown on Passwords


    In addition to following any password guidelines your system administrator mandates,
    you should choose a password that is


    +   - At least six characters long

    +   - Easy for you to remember

    +   - Not a word or name in any dictionary in any language

    +   - A combination of capital and lowercase letters, numbers, and symbols

    +   - Not similar to your username

    +   - Not identical or similar to one you''ve used recently

    +   - Not your telephone number, birth date, kid''s birth date, anniversary (even
    if you can remember it), mother''s maiden name, or anything else that anyone might
    associate with you'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Listing Directories and Files with ls


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_23_0.png)


    Your Unix system is made up of directories and files that store a variety of information,
    including setup information, configuration settings, programs, and options, as
    well as other files and directories. You might think of your Unix system as being
    a tree (tree roots, actually), with subdirectories stemming from higher-level
    directories. As shown in Figure 1.6, all of these files and directories reside
    within the root directory, which contains everything in the system.


    Using the ls command, you can find out exactly what''s in your Unix system and
    thereby find out what''s available to you. You can list the files and directories
    of a directory that you''re currently in or a directory that you specify.


    # To list the files and directories of the directory you''re in:


    +   - ls


    At the shell prompt, type ls to list the files and directories in the current
    directory, which in this case is our home directory (Code Listing 1.2).


    Figure 1.6 All files and directories are nested within the root directory, which
    serves to contain everything in the system.


    ```

    [jdoe@frazZ jdoe]$ ls

    limerick mail/ Project/ public_html/

    * testfile testlink@ tmp/

    [jdoe@frazZ jdoe]$

    ```


    Code Listing 1.2 Use ls by itself to list the files and directories of the directory
    you''re in.'
  merge: -1
  img_proc: true
