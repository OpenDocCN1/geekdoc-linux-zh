- pgno: 304
  md: "# Zipping Files and Directories with zip\n\nIf you're working with files and\
    \ directories that will be accessed on the Windows platform, you might need to\
    \ use zip (rather than gzip). This zip is like DOS or Windows zip, so it's a safer\
    \ option than gzip, which can work, but it depends on the software available on\
    \ the Windows system. zip files are compressed to save disk space and sometimes\
    \ contain multiple files (see Code Listing 13.12).\n\n# To zip files or directories\
    \ with zip:\n\n+   1. ls -l z*\n+   \n+   At the shell prompt, use ls -l to confirm\
    \ the names of the files or directories you want to zip.\n+   \n+   2. zip -r\
    \ zipped zipadeedoodah\n+   \n+   Type zip -r followed by the name of the zip\
    \ file you're creating (without an extension), followed by the name of the file\
    \ or directory to zip. Then just twiddle your thumbs while waiting for Unix to\
    \ zip your files (Code Listing 13.12).\n\n# Tips\n\n+   - Some Unix systems don't\
    \ offer the zip command. In this case, if you need to share files with Windows\
    \ users, use either gzip or compress, send the file, and tell your colleagues\
    \ that they can use WinZip, among other programs, to extract the files.\n+   -\
    \ If you zip a directory (remember to include the -r for recursive argument),\
    \ you zip all the files within it.\n+   - If you can't get the tune \"Zip-A-Dee-Doo-Dah\"\
    \ out of your head after these examples, try humming \"The Candy Man\" or \"I'd\
    \ Like to Teach the World to Sing\", or whistling the \"Colonel Bogey March\"\
    \ (theme from The Bridge on the River Kwai).\n\n```\n[ejr@hobbes compression]$\
    \ ls -l z*\n-rw-r--r-- 1 ejr users 501760 Jul 27 10:22 zipadeedoodah\n[ejr@hobbes\
    \ compression]$ zip -r zipped zipadeedoodah\nadding: zipadeedoodah (deflated 52%)\n\
    [ejr@hobbes compression]$ ls -l z*\n-rw-r--r-- 1 ejr users 501760 Jul 27 10:22\
    \ zipadeedoodah\n-rw-r--r-- 1 ejr users 239943 Jul 27 10:41 zipped.zip\n[ejr@hobbes\
    \ compression]$\n```\n\nCode Listing 13.12 Use zip to compress files, particularly\
    \ those you'll share with Windows users."
  merge: -1
  img_proc: true
- pgno: 305
  md: "# Unzipping Zipped Files with unzip\n\nYou can unzip zipped files using unzip,\
    \ which is logical because you certainly wouldn't unzip zipped files with unVelcro\
    \ or unsnap (Code Listing 13.13).\n\n# To unzip a zip file using unzip:\n\n+ \
    \  1. ls -l *.zip\n+   At the shell prompt, verify the name of the zip file with\
    \ ls *.zip.\n+   2. unzip zipped.zip\n+   Enter unzip and the name of the file\
    \ to unzip (with or without the .zip extension). unzip will uncompress the file(s)\
    \ and return you to the shell prompt.\n\ngunzip also understands how to uncompress\
    \ some .zip files, so you can use gunzip instead of unzip, if you'd like. On the\
    \ Unix side of things, use whatever seems easiest to you, or gunzip if you really\
    \ don't care. If you're providing files to Windows users, zip is somewhat more\
    \ reliable because the format it creates is more standard.\n\nTips\nIf you attempt\
    \ to unzip a file and the file or files to be unzipped already exist, unzip will\
    \ prompt you for each one to determine if you want to overwrite (destroy) the\
    \ existing file, cancel the unzipping process, or rename the file you're unzipping\
    \ to a safe name.\n\n```\n[ejr@hobbes compression]$ ls -l *.zip\n-rw-rw-r-- 1\
    \ ejr users 268156 Jul 23 06:53 folderzip.zip\n-rw-rw-r-- 1 ejr users 55124 Jul\
    \ 23 06:38 fortunes1.zip\n-rw-rw-r-- 1 ejr users 53792 Jul 23 06:52 newzip.zip\n\
    -rw-r--r-- 1 ejr users 239943 Jul 27 10:41 zipped.zip\n[ejr@hobbes compression]$\
    \ unzip zipped.zip\nArchive: zipped.zip\nreplace zipadeedoodah.tar? [y]es, [n]o,\
    \ [A]ll, [N]one, [r]ename: y\n inflating: zipadeedoodah.tar\n[ejr@hobbes compression]$\n\
    ```\n\nCode Listing 13.13 unzip lets you uncompress files without accidentally\
    \ obliterating them."
  merge: -1
