    \ compression]$\n```\n\n**Code Listing 13.15** After you find the compressed files,\
    \ you can uncompress and untar them at once, and then use `ls -ld` (long and directory\
    \ flags) to check your work.\n\n# To uncompress and untar at one time:\n\n+  \
    \ - `zcat filename.tar.Z | tar xf -`\n+   \n+     At the shell prompt, type `zcat`\
    \ followed by the filename (as usual) and pipe that output to `tar`. Follow the\
    \ `tar` command and flags with a `-` so that `tar` will be able to save the file\
    \ to the intended name (**Code Listing 13.15**).\n\n# To tar and gzip at one time:\n\
    \n+   - `tar -cf - Feather | gzip > feather.tar.gz`\n+   \n+     At the shell\
    \ prompt, use the `tar` command as usual but add a `-` (and a space) before the\
    \ filename so the output can be piped. Then, pipe the output to `gzip` and redirect\
    \ the output of that to a filename with the `.tar` and `.gz` extensions to show\
    \ that the file has been tarred and gzipped (**Code Listing 13.16**).\n\n```\n\
    [ejr@hobbes compression]$ ls -ld f*\ndrwxrwxr-x 2 ejr users 1024 Jul 23 10:56\
