- pgno: 277
  md: '![](img/6ffd6bb320ccf354f5a4d57c9d95190d_277_0.png)


    Figure 12.6 The links browser provides great surfing capabilities, even without
    images.


    # Surfing the Web with links


    Using links, a really fancy text-based Web browser, you can surf the Web just
    as you might with Netscape Navigator or Internet Explorer, except with no graphics.
    That''s really not a bad thing; consider that you don''t have to deal with pop-up
    ads, banner ads, or similar junk. Just content, all the time. links even supports
    tables and complex Web page designs, which is unusual for a text-based browser
    (Figure 12.6). Related advantages of using links are that you won''t have to deal
    with slow download times for graphics, annoying sound files, plug-ins, or other
    showy Web page features.


    # Useful links Keystrokes


    +   - /findme finds text within the file. (Replace findme with the text you''re
    looking for.) This is also handy to quickly navigate through a page.

    +   - ? finds text backward (moving up from the cursor) through the file.

    +   - D downloads the current link.

    +   - G goes to an address or file. You enter the address at the prompt.

    +   - Shift G lets you edit the current address.

    +   - Esc usually lets you back out (escape from) the current menu.

    +   - S brings up a menu to manage your bookmarks, including bookmarking the current
    page.

    +   - V lets you toggle back and forth between viewing the formatted page and
    viewing the HTML source.

    +   - Ctrl R reloads the current page and refreshes the screen.


    # To surf the Web with links:


    +   1. links http://www.google.com/

    +   At the shell prompt, type links followed by the name of an .html file or a
    Web site address. Here, we''re accessing the Google Web site (Figure 12.6).

    +   2. Surf the Web or Google for your favorite subject.

    +   See the sidebars called Navigating with links and Useful links Keystrokes
    in this section for details.

    +   3. Q

    +   Press Q to quit and return to the shell prompt. That''s it!


    Tip

    Press Esc to bring up a handy—and very familiar—menu at the top of the screen.
    Use arrow keys to navigate through the menu and Esc to get out of it.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Surfing the Web with Lynx


    You can also surf the Web using Lynx, a text-based Web browser. It''s not as spiffy
    as links and doesn''t handle many Web pages as gracefully, but it has its place
    in your toolbox, too. Generally, you can access the wealth of information available
    on the Web (Figure 12.7), and you can use Lynx to easily download and reformat
    pages.


    # To surf the Web with Lynx:


    +   1. Lynx http://www.yahoo.com/

    +   At the shell prompt, type Lynx followed by the name of an .html file or a
    Web site address. Here, we''re accessing the Yahoo Web site (Figure 12.7).

    +   If you only type in Lynx, you''ll get the default page for your system, which
    is likely the Lynx home page or the main page for your ISP.

    +   2. Surf, surf, surf!

    +   See the sidebars Navigating with Lynx and Useful Lynx Keystrokes in this section
    for details.

    +   3. Q

    +   Press Q to quit and return to the shell prompt. That''s it!


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_278_0.png)


    # Navigating with Lynx


    +   - ↵ (or Enter) follows the currently highlighted link to a new page.

    +   - ← returns to the previous page.

    +   - ↓ moves the highlight down to the next link in the document.

    +   - ↑ moves the highlight up to the previous link in the document.

    +   - M returns you to the first screen you accessed in the session—the one you
    saw in step 1.

    +   - Spacebar scrolls down to the next page.

    +   - B scrolls up to the previous page.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '![](img/6ffd6bb320ccf354f5a4d57c9d95190d_279_0.png)


    Figure 12.8 Some sites are considerably less friendly than others if you''re not
    using graphics.


    # Tips


    +   - If you access a lynx-unfriendly page, like the one shown in Figure 12.8,
    press the Spacebar to scroll down a few times. Usually you''ll be able to find
    the content.

    +   - lynx is a great way to get a spiffy plain text file out of an .html document.
    Try lynx -dump http://example.com/goodpage.html > newname.txt to start lynx and
    direct it to send the display to standard output, and then redirect the output
    to the file called newname.txt. This will give you the text from the page, without
    HTML codes, in a file in your Unix account.

    +   - lynx makes it really easy to get a quick view of a local .html document,
    but it isn''t as flexible as links for Web browsing in general.


    # Useful lynx Keystrokes


    +   - /findme finds text within the file. (Replace findme with the text you''re
    looking for.)

    +   - [?] lets you access help.

    +   - [D] downloads the current link.

    +   - [G] goes to an address or file. You enter the address at the prompt.

    +   - [Shift][G] lets you edit the current address.

    +   - [A] adds the current link to your bookmark list.

    +   - [V] lets you view the bookmark list.

    +   - [Backspace] lets you see a list of pages you''ve visited (your history).

    +   - [ ] lets you toggle back and forth between viewing the formatted page and
    viewing the HTML source.

    +   - [Ctrl][R] reloads the current page and refreshes the screen.'
