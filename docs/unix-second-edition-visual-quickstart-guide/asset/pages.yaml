    [ejr@hobbes scripting]$

    ```


    Code Listing 10.7 Accepting input while a script runs helps ensure that you don''t
    forget to type it in, and still gives customized results.


    +   5. echo -e "and was last changed \c"

    +   Echo another line with text and (because of the \c) no line break at the end
