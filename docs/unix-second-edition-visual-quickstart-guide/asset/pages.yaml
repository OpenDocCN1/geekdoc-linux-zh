- pgno: 138
  md: '# Redirecting to Multiple Locations with tee


    Suppose you just updated your address book file and want to send it to your boss
    in addition to putting it in your own files. You can, using tee, which redirects
    output to two different places (see Code Listing 6.19).


    # To redirect output to two locations with tee:


    +   - sort address.book new.addresses

    +     | tee sorted.all | mail

    +     - boss@raycomm.com -s "Here''s the

    +     - address book, boss" -


    At the shell prompt, use the tee command plus a filename in the middle of the
    pipe line to send the sorted information to that filename as well as to the standard
    output (which could, of course, be redirected to another filename). Here, we send
    the results of the sort to the sorted.all file and to standard output, where mail
    will take over and send the file to the boss (see Chapter 11 for more on fancy
    mail tricks).


    # Tee Time?


    You might think of the tee command as being similar to a plumber''s pipe joint—that
    is, it takes stuff from one location and sends it out to two different places.


    ```

    [ejr@hobbes manipulate]$ sort address.book new.addresses | tee sorted.all | mail
    boss@raycomm.com -s "Here''s the address book, boss"

    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.19 Use tee to send output to two different places at once.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "# Changing with tr\n\nSometimes you just have to make changes to a file to\
    \ change all occurrences of one term or character to another. For example, you\
    \ might have reversed the case in a file (by accidentally typing with Caps Lock\
    \ on...argh!) and need to repair it. Or you might want to turn a document into\
    \ a list of words (one per line) that you can sort or count. The tr utility is\
    \ just what you need (see Code Listing 6.20).\n\n# To translate case with tr:\n\
    \n+   - cat limerick | tr a-zA-Z A-Za-z\n\nAt the shell prompt, use the cat command\
    \ and the pipe to send a file to tr, which will then translate lowercase to uppercase,\
    \ and vice versa.\n\n# To break lines with tr:\n\n+   - cat limerick | tr -c a-zA-Z\
    \ \"\\n\"\n\nChange anything that's not a letter (upper or lowercase) to a new\
    \ line, thus breaking the limerick into a list of words. The -c indicates that\
    \ anything that does not match the first set of characters (the complement of\
    \ those characters) should be changed to the new character.\n\ncontinued on next\
    \ page\n\n```\n[jdoe@frazz jdoe]$ cat limerick\nThere once was a man from Nantucket.\n\
    Who carried his lunch in a bucket,\nSaid he with a sigh,\nAs he ate a whole pie,\n\
    If I just had a donut I'd dunk it.\n\n[jdoe@frazz jdoe]$ cat limerick | tr 'a-zA-Z'\
    \ 'A-Za-z'\nTHERE ONCE WAS A MAN FROM nANTUCKET.\nWHO CARRIED HIS LUNCH IN A BUCKET,\n\
    SAID HE WITH A SIGH,\nAS HE ATE A WHOLE PIE,\nIF I JUST HAD A DONUT I'D DUNK IT.\n\
    \n[jdoe@frazz jdoe]$ cat limerick | tr -c 'a-zA-Z' '\\n'\nThere\nonce\nwas\na\n\
    man\nfrom\nNantucket\n\nWho\ncarried\nhis\nlunch\nin\na\nbucket\n\nSaid\nhe\n\
    with\na\nsigh\n\nAs\nhe\nate\na\nwhole\npie\n```\n\nCode Listing 6.20 Use tr to\
    \ translate characters in files.\n\n```\n(continued)\nIf\nI\njust\nhad\na\ndonut\n\
    I\nd\n d unk\nit\n```"
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Tips


    +   - Rather than use cat to send the file to tr, you can use spiffy Unix redirection
    tools (< in this case) to do it. An equivalent command to translate case would
    be tr a-zA-Z A-Za-z < limerick.

    +   - With tr, you can accomplish all kinds of translations. For example, you
    could set up a bit of a code to keep secret information somewhat secret, by translating
    letters to garble your text, then retranslating when you want them. For example,
    use cat limerick | tr a-Ma-Mn-Zn-Z n-Zn-Za-Ma-M > limerick.rot13 to encode and
    cat limerick.rot13 | tr n-Zn-Za-Ma-M a-Ma-Mn-Zn-Z to decode. This is the same
    as ROT13, discussed in Chapter 17, but far more flexible and spiffy if you use
    tr to do it.

    +   - Check out the man page for tr (man tr) for details on the other cool translations
    and conversions it can do.'
