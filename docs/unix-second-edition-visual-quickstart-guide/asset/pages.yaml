    \ programs, such as vi, pico, pine, mutt, or links, tend to wreak havoc with the\
    \ output of script. You can still read the content, but the formatting is often\
    \ badly out of whack, as shown in Figure 15.3.\n+   - You would use script if\
    \ you want to record both what you did and what happened (\"gee, I typed rm unbackedupdata,\
    \ then ls, and sure enough, the ls listing showed that I was in big trouble\"\
    ). On the other hand, if you just want the list of commands you typed with no\
    \ indication of what happened, check out history from Chapter 3 (\"gee, I typed\
