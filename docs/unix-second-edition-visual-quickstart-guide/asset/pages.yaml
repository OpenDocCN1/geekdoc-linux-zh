- pgno: 143
  md: '# Preparing to Print with pr


    Although old-fashioned line printers—those obnoxiously loud ones that clatter
    out character by character, or the dot-matrix printers that zing out line after
    line—aren’t terribly easy to find anymore, the pr command is finding new life
    in the age of the Internet.


    Why? Well, nothing says email as quickly, easily, effectively, and safely as plain
    text. Plain text attaches no viruses. Plain text works in every email system,
    including handheld computers, and the like. Plain text works great—often better
    than a word processor—for one-off messages, pages, and short documents that just
    don’t merit firing up a full-blown word processor. Code Listing 6.22 shows an
    example of text processed with pr.


    # To process with pr:


    +   pr spiderstory.formatted

    +   Turn pr loose, and you’ll be the talk of the town.


    # Tips


    +   Two utilities that work great together are fmt and pr. See Code Listing 6.22
    to see what fmt -u -w 30 spiderstory.unformatted | pr -2 will do for you.


    +   Use the -n and -d flags if you’re printing something that will be reviewed
    by others. Using these flags, you get line numbers and double-spacing, which will
    make the review process easier.


    +   Add in a -T flag so the output doesn’t even pretend to be appropriate for
    a printer—there are no headers or footers or other pagination for actual printed
    output.'
