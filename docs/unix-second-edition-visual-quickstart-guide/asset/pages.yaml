  md: '# ✓ Tips


    +   - If you don’t remember the name of the directory you want to change to, you
    can use ls to list the directories and files in your current directory, then use
    cd as shown above. See the previous section, *Listing Directories and Files with
    ls*, for more information.


    +   - You can return to your home directory from anywhere in the Unix system by
    entering cd without specifying a directory.


    +   - You can often use a tilde (~) as a handy shortcut to your home directory.
    For example, if you want to change to the Urgent directory within the Projects
    directory in your home directory, you could use something like cd /home/users/y/yourid/Projects/Urgent.
    or just use the shortcut cd ~/Projects/Urgent.


    +   - Keep in mind that your home directory isn’t the same as the system root
    directory. You might think of your home directory as "the very small section of
    the Unix system that I can call my own." Every person using the Unix system has
    his or her own little personal section.


    +   - The current directory is always indicated with a . , while the next higher
    directory (the one that contains the current directory) is indicated with .. .
    That is why you use cd .. to move up a directory. In Chapter 10, you will see
    a specific use for . to specify the current directory when running scripts or
    programs.


    +   - Visit Chapter 2 for much more about directories and files.'
