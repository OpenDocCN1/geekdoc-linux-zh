- pgno: 336
  md: '# Acting Like root with sudo


    As you know by now, logging in as root gives you the power to make changes across
    the entire Unix system, not just within the directories and files that you individually
    have permissions to access, read, or modify. Of course, having all this power
    also comes with responsibilities—not to screw up the entire system, among other
    possibilities. Especially as you''re learning about system administration, you
    may want to experiment with these skills by logging in as sudo instead. Using
    the sudo utility, you can run some commands as if you were root, but it''s not
    as risky as being root. The real root user has to give permission to use sudo,
    and sometimes the permission is limited to using specific utilities—you''ll have
    to experiment.


    ```

    [jdoe@frazz jdoe]$ cd /var/log

    [jdoe@frazz log]$ tail messages

    tail: messages: Permission denied

    [jdoe@frazz log]$ sudo tail messages


    We trust you have received the usual lecture from the local System Administrator.
    It usually boils down to these two things:


    #1) Respect the privacy of others.

    #2) Think before you type.


    Password:

    Jan 25 06:01:01 frazz CROND[22809]: (root) CMD (nice -n 19 run-parts /etc/cron.hourly)

    Jan 25 06:01:01 frazz CROND[22818]: (mail) CMD (/usr/bin/python -S /usr/lib/mailman/cron/qrunner)

    Jan 25 06:01:01 frazz su[pam_unix][22814]: session opened for user news by (uid=0)

    Jan 25 06:01:01 frazz su[pam_unix][22814]: session closed for user news

    Jan 25 06:01:02 frazz msec: unable to run chage: chage: unknown user: ejray

    Jan 25 06:01:03 frazz msec: changed mode of /var/log/news/mtpsend.log from 660
    to 640

    Jan 25 06:02:00 frazz CROND[22865]: (mail) CMD (/usr/bin/python -S /usr/lib/mailman/cron/qrunner)

    Jan 25 06:03:00 frazz CROND[22867]: (mail) CMD (/usr/bin/python -S /usr/lib/mailman/cron/qrunner)

    Jan 25 06:04:00 frazz CROND[22872]: (mail) CMD (/usr/bin/python -S /usr/lib/mailman/cron/qrunner)

    Jan 25 06:04:17 frazz sudo: jdoe : TTY=pts/1 ; PWD=/var/log ; USER=root ; COMMAND=/usr/bin/tail
    messages

    [jdoe@frazz log]$

    ```


    Code Listing 16.1 The sudo command lets you do things that you can''t do as a
    normal user, but that isn''t as risky as being root.'
