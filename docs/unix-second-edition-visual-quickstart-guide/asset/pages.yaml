- pgno: 237
  md: '# SENDING AND READING EMAIL


    # 11


    If you''re anything like us, your whole day revolves around getting goodies in
    your email in-box and sending "highly important" messages (of course, they''re
    important, right?). In any case, sending and receiving email will probably be
    rather common tasks in your Unix experience.


    In this chapter, we''ll introduce you to a few Unix email programs and show you
    how to get started with them. (Of course, just use the instructions that apply
    to the program you''re using!) Then, we''ll show you some clever things you can
    do with email in Unix, such as creating signature files and sending automatic
    vacation email replies.


    # Chapter Contents


    +   - Choosing an email program and getting started

    +   - Reading email with pine

    +   - Sending email with pine

    +   - Customizing pine

    +   - Reading email with mutt

    +   - Sending email with mutt

    +   - Reading email with mail

    +   - Sending email with mail

    +   - Creating a signature file

    +   - Forwarding incoming messages

    +   - Announcing an absence

    +   - Configuring procmail

    +   - Responding to email with procmail'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Choosing an Email Program and Getting Started


    In general, you''ll have a choice of two kinds of programs for sending and receiving
    email on a Unix system:


    +   - An email program installed on your local computer or network that interacts
    with the Unix system for you. You might know these programs as mail clients and
    might have used ones like Eudora, Outlook Express, or Netscape''s mail program
    in Communicator, Messenger. These are handy because they usually have a spiffy
    interface and can handle attachments without a lot of hassle on your part, but
    they''re not really Unix email programs. These programs also let you store your
    mail on your desktop system (Windows or Macintosh).


    +   - An email program that you access and use directly on the Unix system. These
    programs, such as pine, mutt, and mail, let you send and receive email easily.
    Additionally, pine and mutt let you send attachments with not a lot of hubbub.
    Because the mail remains on the Unix system, you can access your mail from anyplace
    you can access the Internet.


    In this chapter, we''ll focus on the email programs that you access directly from
    the Unix system, as these are the true Unix email programs. Although there are
    a bazillion different ones available, you''ll likely have access to one (or more)
    of these:


    +   - pine: This program is intuitive to use and lets you send and receive email
    and attachments very easily. pine is our recommendation if you have it available.
    Figure 11.1 shows its relatively simple interface. Just use the menu commands
    listed at the bottom of the screen.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_238_0.png)


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_238_1.png)'
  merge: -1
  img_proc: true
- pgno: 239
  md: '![](img/6ffd6bb320ccf354f5a4d57c9d95190d_239_0.png)


    Figure 11.3 mail''s interface and features are, well, kind of a pain to use.


    ```

    Red Hat Linux release 5.1 (Manhattan)

    Kernel 2.0.34 on an i486

    login: ejr

    Password:

    Last login: Sun Aug 2 07:41:00 on tty4

    You have mail.

    [ejr@hobbes ejr]$

    ```


    Code Listing 11.1 Read with great interest the line that says "You have mail"
    when you log in.


    +   - mutt: This program is a bit less user-friendly, but it lets you send and
    receive email and can deal with attachments nicely. mutt is our second choice,
    if pine is not available, but mutt is quite friendly if you put a bit of time
    into customizing its interface for your needs. Figure 11.2 shows its interface,
    which provides ample features for most purposes.


    +   - mail: This program is available on practically every Unix system; however,
    it''s fairly difficult to use and does not provide intuitive options or commands,
    as Figure 11.3 shows. We recommend choosing another email program if at all possible.
    Use this program for emergencies only.


    # Tips


    How do you know whether someone has sent you something? The shell will often announce
    (but not usually audibly) "You have mail" or "You have new mail" when you log
    in, as shown in Code Listing 11.1. That is, if you do in fact have email waiting
    for you.


    +   - You''re not limited to using just a regular Unix email program or a POP
    mail program; you can use either or both, depending on your specific preferences
    and needs. You''re also not limited to using just one Unix email program if you
    have more than one available, although reading mail from two different Unix programs
    can sometimes make it a little hard to keep track of what''s where. Try them out
    and see which program or combination of programs meets your needs.


    +   - We recommend using character-based email programs like these to read mail.
    After you get used to the interface, you can whiz through your email much faster
    than you can with a GUI mailer (like Outlook or Netscape mail), and you don''t
    have spam graphics opened in your face either.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Reading Email with pine


    It’s likely that your first step in using pine will be to read email. As Figures
    11.4 through 11.7 show, you start by entering the pine command, and then work
    screen by screen, depending on what you want to do.


    # To read email with pine:


    +   1. pine

    +   At the shell prompt, type pine to start the program. The first time you use
    pine, it will ask you if you want to be counted as a pine user (see Figure 11.4)
    before you get started. Thereafter, you’ll see the normal main screen, as shown
    in Figure 11.5. If you get an error message about the pine command not being found,
    look around on the system to try to find the program. See Chapter 1 for details
    on where to look.


    +   2. L

    +   Press L to view the folder list, which includes an in-box folder as well as
    (eventually) other folders that you set up.


    +   3. Use the ↑ and ↓ keys to move up and down in the folder list (if you have
    other folders).


    +   4. V

    +   Press V to view the selected folder. Note that the default selection in the
    bottom menu is shown with [brackets] (see Figure 11.6). Rather than use arrow
    keys to select the default, you can, instead, press Enter.


    +   5. Use the ↑ and ↓ keys to move up and down in the message list.

    +   Your unread messages will appear at the bottom of the list by default.


    +   6. Enter

    +   Press Enter to read the selected message.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_240_0.png)


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_240_1.png)


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_240_2.png)'
  merge: -1
  img_proc: true
- pgno: 241
  md: '![](img/6ffd6bb320ccf354f5a4d57c9d95190d_241_0.png)


    Figure 11.7 Do you really want to quit pine? Just checking.


    7. Hmmm. Uh-huh. Wow. Marvy.

    Read your messages. Press [x] to get out of the current message and back to the
    message index for the current folder.


    8. [Q]

    Press [Q] when you''re ready to quit pine. You''ll be prompted to verify that
    you want to quit, as shown in Figure 11.7. Just press [Y] to quit, or [N] if you
    really didn''t want to quit.


    # ✓ Tips


    +   - Notice the menu commands listed at the bottom of the pine screen. You can
    choose any of these options by pressing the appropriate key; pine is conveniently
    case-insensitive, so either lowercase or uppercase commands will work.


    +   - Start with pine -i to start in your in-box, rather than at the main menu.


    +   - As you''re perusing your email, you can use [Tab] to jump to the next unread
    message in the folder.


    +   - Delete messages by pressing [D] either when the message is highlighted in
    the message list or when the message is open onscreen. When you quit the program,
    pine will verify that you want to discard the deleted messages. Just press [Y]
    to confirm the deletion, or [N] if you really didn''t want to get rid of the messages.
    (Note that deleting in pine does not send them to the Recycle Bin, as the [Delete]
    key does when using a Windows email program. In Unix, pressing [D] really deletes
    messages...they''re gone!)


    +   - You can reply to messages by pressing [R] with a message selected or while
    reading a message.


    +   - When using pine, keep your eyes open for an 0 in the menu at the bottom
    of the screen indicating that there are other options.


    # Printing with pine


    Although many Unix email programs don''t let you print to your local printer,
    pine does. All you have to do is choose %, take the default printout on "attached
    to ansi," as pine suggests, and your printout will most likely appear on your
    regular printer. Printing to a local printer this way doesn''t work with some
    communications programs (notably Windows telnet), but it does work with many.
    If you''re sitting in front of a Linux or Mac OS X system, you could also use
    other printing utilities on your system—the "attached to ansi" option is really
    for people who are connected to the Unix system with ssh or telnet.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Sending Email with pine


    Our next favorite thing to do with pine is to send new messages. Commonly, you''ll
    send messages after you''ve already started pine (Figure 11.8), but you can also
    start a new message directly from the shell prompt (see the tips).


    # To compose and send a message using pine:


    +   1. pine

    +   Type pine at the shell prompt to start pine, if it isn''t already running.


    +   2. C

    +   Press C to compose a new message.


    +   3. Tab

    +   Press Tab to move through the message header fields. Fill in carbon copy recipients
    (cc:) and the Subject: line. See the sidebar called Our Two Cents on the Subject
    of Subjects for details about including subject lines.

    +   If you''re sending an attachment, type in the Unix filename (and path, if
    appropriate) on the Attchmnt: line. For example, type ~/myfile, which includes
    the full path name and the filename.


    +   4. Hi, John, when should we schedule that golf game -- er, um -- business
    meeting?

    +   In the message window, type in your message. Figure 11.8 shows our message
    complete with the header information and the message body.


    +   5. Ctrl X

    +   When you''re ready to send, press Ctrl X

    +   pine will ask you to confirm that you really want to send the message. Press
    Y (or press Enter) to send it, or N if you don''t want to send it.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_242_0.png)


    Figure 11.8 Preparing a message in pine is as easy as filling in the blanks.'
  merge: -1
