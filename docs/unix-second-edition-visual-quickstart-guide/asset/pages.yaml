- pgno: 341
  md: '# Changing the System Configuration


    Most (nearly all) of the system configuration files for Unix systems are contained
    in the /etc directory. If it''s a configuration setting that''s specific to a
    user, the setting will be located in the user''s home directory; otherwise, configuration
    settings for the whole system are located in the /etc directory.


    We''re not going to get into changing much here—you really should know what you''re
    doing before you start futzing with the system configuration. However, if you''re
    root, you should have some fun with it, so here''s something fun to play with.
    In the following example, you''ll see how to change the Message of the Day (aka,
    the motd), which users are greeted with when they log into the system (Figures
    16.1 and 16.2).


    # To change the motd:


    +   1. sudo vi /etc/motd

    +   Use sudo to gain root access and edit the /etc/motd file.

    +   2. Hey, you have wrinkles in your stockings! Oh...sorry, you''re not wearing
    stockings!

    +   Uhhh. yikes! Add your favorite slogan, saying, or comment to the file. Keep
    in mind that everyone who logs into the system will see this message, so keep
    it clean...and be nice! (Figure 16.2)

    +   3. logout

    +   Log out, so you can log back in and see your handiwork.

    +   4. ssh yoursystem.example.com

    +   Log back in to see the new message.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_341_0.png)


    Figure 16.1 Any user will see the motd when logging in.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_341_1.png)


    Figure 16.2 After a user with root privilege edits it, it''s...er...different.


    # Tips


    +   - The /etc/motd file is really handy for providing warnings, notes, and comments
    to system users. Particularly if you''re planning on having system downtime or
    maintenance, it''s nice to warn users with a message in /etc/motd.

    +   - Virtually every other change you might make in /etc will also affect everyone
    on the system. Be careful.

    +   - Depending on what you choose to change or edit in /etc, you might need to
    restart the appropriate daemon (as described in the previous section) for your
    changes to take effect. If it looks like your change didn''t work, restart the
    daemon.

    +   - Unix man pages also usually describe the configuration files found in /etc.
    Use man filename (as in, man exports) to find out what the configuration does.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Monitoring the System


    Monitoring the system is one of the key responsibilities of a system administrator.
    You need to make sure that everything is as it should be on the system, or yell
    at people, call the cops, order a new hard drive, or whatever else is required.
    On a single-user system, there’s really not much to do, but on a larger system
    with many users, monitoring is a significant part of a system administrator’s
    job.


    Among other things, you can monitor the system logs (located in /var/log), the
    users logged in, and the overall system load.


    # To monitor logs:


    +   - sudo tail -1000 /var/log/messages

    +     - | more


    Use sudo to gain root access and look at the end (last 1,000 lines) of the messages
    log file. The output of tail is piped to more so you can actually read it.


    Or


    +   - sudo tail -f /var/log/httpd/error_log


    If you’re looking for a specific occurrence of an event as it happens, you can
    use tail -f to keep displaying the log as new errors, in the case of this log,
    are added to it. In this example, we’re looking at the very end of the Web server’s
    error log, as shown in Figure 16.3.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_342_0.png)'
  merge: -1
  img_proc: true
- pgno: 343
  md: '![](img/6ffd6bb320ccf354f5a4d57c9d95190d_343_0.png)


    Figure 16.4 The top utility helps monitor the system status.


    # ✓ Tips


    +   There''s a lot to monitor and a lot to keep up with. Take time to read man
    pages, search the Web, and ask around for tips and tricks. A wide variety of additional
    utilities exist to make these processes easier for you.


    +   Develop shell scripts that automatically run when you log in and go through
    the "normal" system checks. By doing so, you don''t have to do routine checks
    manually, and you can come up to speed quickly on what''s going on.


    +   Use top -d 2 | grep Mem for a running status check on your available memory.
    grep for other characteristics from top output, as appropriate.


    +   Anything that''s different from usual is worth being concerned about. Check
    man pages or search the Web to find out for sure.


    # To monitor users:


    +   w; who


    You don''t even need sudo for this one, but you do want to keep an eye on the
    users logged in, and where they''re coming from. After a while, you''ll get to
    recognize patterns and react to them. If jdoe usually logs in by 9 a.m. and logs
    out by 4 p.m., and always logs in from the same system, then you see jdoe suddenly
    logging in from a different address at 1 a.m., you should wonder if jdoe''s secret
    password isn''t quite so secret anymore.


    Or


    +   last


    The last utility tells you who logged in (and out) and when, and from where, as
    shown in Code Listing 16.5 (on the next page). Good stuff to know, particularly
    if you''re not online and actively monitoring w and who all of the time.


    # To monitor system load:


    +   top


    Use top to monitor your system loads, as shown in Figure 16.4. Different systems
    will show distinctly different patterns, but if you get accustomed to checking
    top when everything seems normal on your system, you''ll be able to better tell
    if something is abnormal or even what''s wrong when the time comes. Press Q to
    quit top.'
  merge: -1
  img_proc: true
