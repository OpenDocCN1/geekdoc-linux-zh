- pgno: 219
  md: '# WRITING BASIC SCRIPTS


    # 10


    # Chapter Contents


    +   - Creating shell scripts

    +   - Running shell scripts

    +   - Making scripts executable

    +   - Getting a head start on creating scripts

    +   - Embedding commands in scripts

    +   - Looping scripts

    +   - Creating if-then statements

    +   - Accepting command-line input

    +   - Accepting command-line input while a script is running

    +   - Debugging scripts


    So far in this book, you''ve been typing in commands (or perhaps combining commands),
    pressing [Enter], then waiting for Unix to execute the command(s) you specified...and
    typing in commands, pressing [Enter], and waiting for Unix... and typing in commands....
    You get the idea, and you probably have tired fingers by now.


    Using shell scripts, you can create a series of commands, save them as a single
    file, and then execute them anytime you want—without having to re-create the commands
    or do all that tedious typing over and over again. For example, suppose you want
    to do a complex search-and-replace on all the .htm files in your home directory.
    With a shell script, you can take the time to structure the commands just one
    time, save the commands as a single file, and then apply it to any directory at
    any time. You do the hard work one time, and then reuse the script any time you
    need to.


    In this book we''ll discuss creating scripts using the sh (Bourne) shell. Scripts
    can be written with any shell—and zsh and bash in particular are quite good for
    scripting.


    In this chapter, we''ll show you how to get started creating and using shell scripts.
    We won''t go into the gory details about scripting (thank goodness, right?), but
    we will give you enough information to create your own scripts and apply them
    to your particular uses.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Creating a Shell Script


    A shell script is nothing more than a list of commands for Unix to execute. To
    write a shell script, you’ll


    +   - Open your favorite editor and start a script file.

    +   - Start the shell script with #!/bin/sh.

    +   - Add the shell script code one line at a time. This code will look strangely
    familiar—it’s similar to code you’ve already used in this book.

    +   - Save and close the file.


    In the following steps, we’ll show you how to try out this process by writing
    a script that prints three lines onscreen (Figure 10.1). Yeah, we know—whoopee!—but
    we have to start somewhere, and you can apply the same principles to other shell
    scripts you create.


    # To create a shell script:


    +   1. pico myscript

    +      For starters, access the editor of your choice and start a new file. In
    this case, we call it myscript.

    +   2. #!/bin/sh

    +      On the first line of the script, enter #!/bin/sh, which specifies the complete
    path to the shell that should run the script.

    +   3. # this is my first shell script

    +      On the next line, type a # (to indicate a comment), and then add any other
    notes you want to make. It’s always a good idea to use extensive comments in your
    scripts to help you see what’s going on. Remember, comments are for your reference
    only and won’t show up onscreen or do anything.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_220_0.png)'
  merge: -1
  img_proc: true
- pgno: 221
  md: '```

    [ejr@hobbes scripting]$ sh myscript

    friendsjustfriends


    standing

    good

    ```


    Code Listing 10.1 Using echo options, you can get good understanding. Or, perhaps,
    a good understanding just between friends.


    # 4. echo friendsjustfriends


    On the next line of the script, type echo followed by the text you want to see
    onscreen. Here, echo tells Unix to display friendsjustfriends onscreen—a message
    just between friends.


    # 5. echo


    Add another line with echo and nothing else to display a blank line.


    # 6. echo "      standing"


    Add another echo command. Note that if you use leading spaces or tabs, as we''ve
    done here, you must use quotes, as Figure 10.1 shows.


    # 7. echo -e "\tgood"


    Using the -e flag plus \t, you can insert a tab character. See Getting Fancy with
    echo for more echo options.


    # 8. Save and close your script.


    Check Chapter 4 if you need help saving a file and closing your editor.


    # 9. sh myscript


    Use sh myscript to run your new script. In doing so, you get good understanding
    (literally), as shown in Code Listing 10.1. Ta-daaaa! You just wrote your first
    shell script! (See the following section for more information and details on running
    scripts.)


    # Tip


    +   - Unless you have some compelling need to use a different shell (for example,
    if you''re taking advantage of functions that exist only in zsh), just stick with
    sh for your scripts for now.


    # Getting Fancy with echo


    In addition to the basic print-to-screen function that echo offers, you can also
    use these formatting flags with echo -e (the -e enables these special formatting
    characteristics):


    +   - \b moves the cursor back one space.

    +   - \c forces the following text to appear on the same line as the current text.

    +   - \f forces the following text to appear on the next line at a specified horizontal
    location.

    +   - \n forces the following text to appear on a new line.

    +   - \t indents the following text output by one tab.


    For example, echo -e "\tGreetings! \c" would move "Greetings!" one tab space to
    the right (as specified by the \t) and not insert a new line for any text following
    it (as specified by the \c).'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Running a Shell Script


    After you''ve created a script in your editor and saved the script file, your
    next step is to run it, which means to execute every command in the script in
    the order provided. (Yes, you did this in the previous section, but we''ll expand
    on it here.) As Figure 10.2 shows, you do this using the sh command (or the name
    of the shell you''re using) followed by the name of the shell script you want
    to run.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_222_0.png)


    Figure 10.2 Running a script is as easy as typing sh plus the filename of the
    script.


    # To run a script:


    +   - sh myscript


    At the shell prompt, type sh (or the name of the shell, like ksh or csh, you want
    to run the script) followed by the name of the script. In this case, you''re really
    just telling sh to run and to use the list of commands in the myscript file. You''ll
    see the results of the script—in this case, words appear onscreen, as shown in
    Figure 10.2.


    # Tip


    +   - Note that in this example, you''re explicitly telling Unix the name of the
    script to run (myscript). When you do so, the #!/bin/sh line at the top of the
    script in the previous section is technically superfluous. It''s essential only
    when the script is executable, as in the following section.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Making a Script Executable


    In the previous section, we showed you that you can run a shell script by typing
    sh followed by the name of the shell script file. You can also make a script executable,
    which means that you can run it simply by typing the script name at the shell
    prompt (omitting the name of the shell). Doing so is handy because it allows you
    to use the script as conveniently as you’d use any other command. As Code Listing
    10.2 shows, you must set up a little before you can just execute the script.


    +   1. head -2 myscript

    +   At the shell prompt, check to verify that your script does have the #!/bin/sh
    line at the top to specify the shell that runs it. Remember from Chapter 6 that
    head -2 will list the top two lines of the file specified.


    +   2. chmod u+x myscript

    +   Here, use the chmod command to give the user (that’s you) execute permission.
    See the section in Chapter 5 called Changing Permissions with chmod for details
    on setting permissions.


    +   3. pwd ; echo $PATH

    +   Display the name of your current directory and the full path, and verify that
    the current directory is in the path. The current directory (the one in which
    you just granted yourself execute permission) must be contained in the path; otherwise,
    the script will not be as easily executable from the shell prompt.


    +   4. myscript

    +   At the shell prompt, type the name of the script. Assuming that your current
    directory is in the path, the script will run.


    ```

    [ejr@hobbes scripting]$ head -2 myscript

    #! /bin/sh

    # This is my first shell script

    [ejr@hobbes scripting]$ chmod u+x myscript

    [ejr@hobbes scripting]$ pwd ; echo $PATH

    /home/ejr/scripting

    /usr/local/bin:/bin:/usr/bin:/usr/X11R6/bin:/usr/local/games:/home/ejr/bin:/home/ejr/scripting

    [ejr@hobbes scripting]$ myscript

    friendsjustfriends


    standing

    good


    [ejr@hobbes scripting]$

    ```


    Code Listing 10.2 After a little one-time preparation, you can run executable
    scripts by typing the script name at the shell prompt.


    continued on next page'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# ✓ Tips


    +   Every time you open up a new script, check to verify that the first line is
    `#!/bin/sh` so the file will run correctly. Also, check the permissions and your
    path to make sure you can run the script from the shell prompt. (You’ll almost
    always find it more convenient to use executable scripts than to specify the shell
    or path each time you want to run a script.)


    +   If the current directory isn’t in the path (either explicitly or through a
    `.` notation, as in `PATH=/usr/bin:.:`), you’ll have to take an additional step
    to execute the script. You could


    +   Add the current directory to the path with something like `PATH=$PATH:/home/yourid/tempdir`.
    Read more about this option in Chapter 8.


    +   Execute the script with `./myscript` instead of just `myscript`.


    +   Move the script to a directory in the path.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '![](img/6ffd6bb320ccf354f5a4d57c9d95190d_225_0.png)


    Figure 10.3 You can enter a series of commands, and then use the code provided
    with history to help create a shell script.


    # Getting a Head Start on Scripts with history


    If you find yourself performing a particular process over and over again, consider
    making that process into a script. An easy way to create a script is to work from
    the session history, as shown in Figure 10.3. Basically, all you have to do is
    complete the procedure one time, and then use the session history to help build
    the script for you.


    # To get a head start on your script with history:


    +   1. Go through the process that you want to include in the script.

    +   We’ll wait.


    +   2. Keep a rough count of the commands you issue.

    +   Don’t worry about the exact number of commands you use, but have an idea as
    to whether it’s 3, 30, or 300 commands.


    +   3. history 20 > standbyou

    +   When you’ve finished the process, type history followed by the approximate
    number of commands for your script. When estimating the number of commands, err
    on the high side, as it’s easier to delete extra commands than to add in missing
    ones. Then, redirect the output to the desired filename, and see your in-the-making
    script stand before you.


    +   4. vi standbyou

    +   Use the editor of your choice to edit your script file, deleting the initial
    line numbers and spaces and generally whipping that script into shape. See the
    section Creating a Shell Script earlier in this chapter for more details.


    # Tip


    +   If you use vi, do a global search-and-replace to get rid of the line numbering
    (that history introduced) at the left—just use Esc:%s/^\ .*/ // (one space after
    the ^ and two before //), and you’re in business. See Chapter 4 for more about
    clever vi tricks.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Embedding Commands


    Suppose you create a script that will automatically run when you log in each day.
    The script might, for example, print "Greetings!" onscreen and possibly deliver
    a cle(a)ver message: "Say, you''re looking sharp today!" You could easily do this
    with the information you''ve learned so far in this chapter.


    What would be handy here would be to add a line to the script that tells Unix
    to do all those things plus name the most recently used file—for those of you
    who need a reminder about what you were last working on. You could just use an
    ls command, but that would only list the filenames and not integrate the information
    with the rest of your morning greeting. Instead, a better (and more attractive)
    idea would be to bundle a couple of commands and use them with echo (Figure 10.4)
    to embed the information right into the greeting.


    # To embed a command:


    +   1. vi myscript

    +   To begin, open myscript or another script in your favorite editor. Your script
    might look like Figure 10.4, with the greeting onscreen.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_226_0.png)


    Figure 10.4 Embedding commands just requires an additional couple of lines in
    the script.


    # Using Clever Dates


    You can use the date command to deliver any date with any format. In general,
    use date "+Today is %A", but you can use any or all of the following bits:


    +   - %d includes the date.

    +   - %y includes the two-digit year.

    +   - %Y includes the four-digit year.

    +   - %m includes the numeric month.

    +   - %b includes an abbreviated month.

    +   - %B includes the full month name.

    +   - %a includes the abbreviated day of the week.

    +   - %A includes the full day of the week.

    +   - %R includes the time in hours and minutes.

    +   - %D includes the date in month/date/year format.


    Check the man pages for the remaining several dozen options.'
  merge: -1
  img_proc: true
