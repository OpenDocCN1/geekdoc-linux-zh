  md: '# Changing Your ksh Prompt


    Like bash, ksh has two prompts you can edit:


    +   - The main prompt that you usually think of as the shell prompt, called PS1.

    +   - A secondary prompt that you see when the system requires additional information
    to complete a command. Logically, this prompt is called PS2.


    You can change either of these prompts using the following steps (we’ll modify
    PS1 in the example). You start by finding your prompt statement (Code Listing
    8.17), then modifying it in your editor.


    # To change your ksh prompt:


    +   1. grep PS1 /etc/profile ~/.profile ~/.kshrc


    To begin, search through the configuration files located in your home directory
    and in the /etc directory for your prompt statement. It’ll look something like
    PS1="$ " or PS1="$PWD $ ", as shown in Code Listing 8.17. Keep in mind that you
    can edit the files in your home directory only, not those in the /etc directory.
    The Setting Your ksh Prompt Promptly sidebar will help you translate these symbols.


    +   2. vi ~/.profile


    Use your favorite editor to edit the configuration file with the PS1 setting in
    it or to add a PS1 setting to a configuration file in your home directory.


    +   3. PS1="$LOGNAME in $PWD $ "


    Change the prompt to display the information you want—in this case, the user name
    and the current working directory.


    Tip

    Note the trailing space in the prompt code: PS1="$ ". This makes the prompt much
    easier to use than it would be without the space.


    ```

    $ grep PS1 /etc/profile ~/.profile ~/.kshrc

    /home/users/e/ejray/.profile:PS1="$ "

    /home/users/e/ejray/.profile:export PS1

    $

    ```


    Code Listing 8.17 List your zsh configuration files and look for a prompt statement.


    # Setting Your ksh Prompt Promptly


    You can set your ksh prompt to contain some different kinds of information—but
    not as much as with zsh or bash shells. The following list shows you what code
    to use to add certain kinds of information to your prompt (as well as help you
    translate the code in your existing prompt):


    +   - $LOGNAME shows the userid of the current user—that’s you.

    +   - ${PWD##*/} shows the current working directory without the path.

    +   - $PWD shows the current working directory with the path.

    +   - $HOST shows the host name of the computer.'
