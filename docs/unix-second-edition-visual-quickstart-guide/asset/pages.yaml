    curiosity), you can use this information to satisfy your inquisitive inclinations
    or to tip off a system administrator to problems. For example, if you''re getting
    odd errors or unpredictable results with a specific program, using df might reveal
    that the /home file system is full or maybe that you don''t have the /dev/cdrom
    file system that you thought was installed and mounted. Hmmm!


    # Tips


    +   - Use df -k /home to make sure that the usage is reported in 1 Kbyte blocks,
