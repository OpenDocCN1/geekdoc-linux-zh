- pgno: 274
  md: "# Tips\n\n+   - If the FTP connection seems to get stuck as soon as you log\
    \ in, try -yourid@wherever.com as the password. The - character disables system\
    \ announcements and helps keep your ftp client happy.\n\n+   - Some firewalls—particularly\
    \ the ones on home networks—do not deal gracefully with some of the intricacies\
    \ of the FTP protocol. If you can connect and log in, but not list files or get\
    \ anything, the firewall might be the problem. As soon as you log in, type pass\
    \ (for passive) and the problem should go away.\n\nAnother handy use for - is\
    \ to view text files onscreen. For example, type get filename - to have the text\
    \ just scroll by on the screen.\n\n+   - Instead of using get, use newer (as in\
    \ newer goodjokes.gz) to get a more recent file with the same name as one you\
    \ have.\n\n+   - If you start downloading a file and the FTP connection breaks,\
    \ type reget and the filename to continue the transfer from wherever it left off.\
    \ (You'll have to reestablish the connection first, of course.)\n\n+   - You can\
    \ tell the ftp client to make sure that all the transferred files have unique\
    \ names by using runique instead of get. This way, you can ensure that files don't\
    \ overwrite existing files on your local system.\n\n+   - Use regular Unix commands\
    \ like ls, pwd, and cd to move around in the remote system, and prefix them with\
    \ an ! to apply to your system. For example, cd .. would change to the next higher\
    \ directory on the remote system, and !cd .. (from within the ftp client) would\
    \ change to the next higher directory on the local system. The current local directory\
    \ is where your files will be saved.\n\n# Getting Multiple Files\n\nIf you'll\
    \ be getting multiple files with ftp, follow steps 1 through 6 in this section,\
    \ then\n\n+   - prompt\n+   \n+   Optionally, type prompt to tell the ftp client\
    \ not to prompt you for each individual file that you want to get. You'll be informed\
    \ that prompt is set to no. If you want to turn it back on, issue prompt again.\n\
    \n+   - mget start*\n+   \n+   At the ftp> prompt, type mget (for \"multiple get\"\
    ) followed by the string or filenames to match. In this example, we use start*\
    \ to get all files with names that begin with \"start.\" You could also use mget\
    \ *.gz, for example, to get files with the .gz file extension. See Chapter 1 for\
    \ more about using wildcards.\n\n+   - quit\n+   \n+   When you're finished getting\
    \ files, just type quit."
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Sharing Files on the Internet with ftp


    Sharing files on the Internet with ftp is similar to getting files; instead of
    retrieving files, however, you give files to other people (Code Listing 12.3).


    # To share files on the Internet with ftp:


    +   1. ftp ftp.raycomm.com

    +   Open the FTP connection as shown in the previous section.

    +   2. youruserid

    +   Log in with your userid.

    +   3. password

    +   Enter your password.

    +   4. cd incoming

    +   Use standard Unix directory commands (ls, cd, and so on) to move into the
    directory into which you want to put the files (Code Listing 12.3). incoming is
    often the right directory name to use, particularly on public FTP servers.

    +   5. binary

    +   Set the file type. You''ll want to use the binary file type for any files
    other than text or HTML files; use ascii for text or HTML.

    +   6. put myjokes.gz

    +   Type put followed by the name of the file you''re making available.

    +   7. quit

    +   Type quit when you''re done.


    ```

    [ejr@hobbes ejr]$ ftp ftp.raycomm.com

    Connected to www.raycomm.com.

    220 ftp.raycomm.com FTP server (NcFTPd 2.1.2, * registered copy) ready.

    Name (ftp.raycomm.com:ejray): ejray

    331 User ejray okay, need password.

    Password:

    230- You are user #8 of 100 simultaneous users allowed.

    230-

    230 Logged in.

    Remote system type is UNIX.

    Using binary mode to transfer files.

    ftp> cd incoming

    250 "/home/ftp/pub/users/e/ejray/incoming" is new cwd.

