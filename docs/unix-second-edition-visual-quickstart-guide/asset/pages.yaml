    Code Listing 10.3 The results of embedded commands can be impressive.


    2. echo "You were most recently working on `ls -1Fc ~/ | head -1` ." Type echo
    followed by the descriptive text you want to see. Then embed the `ls command (`ls
    -1Fc ~/ | head -1`)` within the descriptive text. Note that the embedded code
    begins and ends with ` (dot).


    The embedded command here lists just the most recently changed file or directory
    in the home directory. 1 provides for one entry per line, F formats the directory
    names with a / so we can tell whether we''re working in a subdirectory or on a
    file, and c sorts by the modification date. We then pipe the output to head -1,
    which displays the top line of the file.


    3. Save your script and exit the editor, and then try it out. as in Code Listing
    10.3


    # Tips


    +   - You can embed dates into scripts, too. Try echo -e "Today is `date +%A`"
    if you work so much that you forget what the day of the week is. See the sidebar
    Using Clever Dates for more date details.


    +   - When you embed commands that are directory-dependent—such as ls or find—be
    sure to specify the complete path. If you don''t, you''ll get paths relative to
    where the script is rather than relative to where you''re running the script from.


    +   - Embedded commands are useful in many ways. You can use them anytime that
    you want to have one program act based on the output of another program, just
    as echo displays something based on the output of a program.'
