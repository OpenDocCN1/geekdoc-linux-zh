- pgno: 370
  md: '# Table A.1


    # Getting Started with Unix: Survival Skills


    | Command | Description |

    |---|---|

    | apropos keyword | Find appropriate man pages for keyword. |

    | cat file | Display file contents onscreen or provide file contents to standard
    output. |

    | cat file1 file2 | Display file1 and file2. |

    | cd | Return to your home directory from anywhere in the Unix system. |

    | cd .. | Move up one level in the directory tree. |

    | cd /etc | Change to the /etc directory relative to the system root. |

    | cd ~/subdir | Use a tilde (~) as a handy shortcut for your home directory. |

    | cd Projects | Move to the Projects directory relative to the current directory.
    |

    | col -b | Filter backspaces and reverse line feeds out of input. Use to make
    man pages editable without odd formatting. |

    | Ctrl D | Close your current process (often a shell) and your Unix session if
    you close the log-in shell. |

    | exit | Close your current shell and your Unix session if you''re in the log-in
    shell. |

    | less file | Use to view file screen by screen. |

    | logout | Close your Unix session. |

    | ls | List files and directories. |

    | ls / | List the files and directories in the root directory. |

    | ls /directory | List the files and directories in directory. |

    | ls -a | List all files and directories, including hidden ones. |

    | ls -c | List files and directories by modification date. |

    | ls -l | List files and directories in long format, with extra information. |

    | ls -lh | List files and directories in long format, with extra information and
    human readable sizes. |

    | man 5 command | View the specified section (5) of the man pages for command.
