- pgno: 293
  md: '# WORKING WITH ENCODED & COMPRESSED FILES

    13


    As you use Unix, you will likely encounter encoded or compressed files and need
    to extract, unencode, encode, or otherwise manipulate the files to be able to
    view or use them. This chapter discusses different ways of encoding and compressing
    files.


    # Chapter Contents


    +   - Encoding files

    +   - Decoding files

    +   - Archiving files

    +   - Unarchiving files

    +   - Compressing files

    +   - Uncompressing files

    +   - Zipping single files

    +   - Unzipping single files

    +   - Zipping multiple files and directories

    +   - Unzipping multiple files and directories

    +   - Combining commands'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Encoding Files

    with uuencode


    You''ll use encoding whenever you''re sending a binary file (a nontext file) through
    email or posting one to a newsgroup. Although many email programs and news readers
    will take care of encoding for you (and, therefore, you won''t need to mess with
    the information here), you may occasionally need to do it yourself.


    Files must be encoded so that they can pass through Internet email and news gateways
    unscathed. If you don''t encode a file and your program doesn''t do it for you,
    the file will arrive as a bunch of unusable gibberish (because the gateways assume
    that all text passing through uses 7-bit words, while binary files use 8-bit words,
    thus binary files are garbled). To prevent gibberish, just uuencode your files
    before you send them along, as shown in Code Listing 13.1.


    ```

    [ejr@hobbes compression]$ ls

    Folder        bigfile.uu   folderzip.zip   home.gz.uu

    Zipadeedoodah file1.htm    fortunes1.txt   newzip.zip

    bigfile.gz    file2.html   fortunes1.zip   ournewhouse.jpg

    bigfile.new.gz folder.tar   gzip            temp

    [ejr@hobbes compression]$ uuencode ournewhouse.jpg ourhouse.jpg > house.uu

    begin 664 ourhouse.jpg

    M"=6HE"...[truncated uuencoded data]...

    [ejr@hobbes compression]$

    ```


    Code Listing 13.1. Use uuencode to encode files and, optionally, to redirect the
    output to disk.'
  merge: -1
  img_proc: true
- pgno: 295
  md: "# To encode a file using uuencode:\n\n```\n[ejr@hobbes compression]$ uuenocode\n\
    \  ournewhouse.jpg house.jpg | mail -s\n  \"Here's the new picture\" debray@roycomm.com\n\
    ```\n\nCode Listing 13.2 You can uuencode and mail all in one step to work more\
    \ efficiently.\n\n+   - uuencode ournewhouse.jpg ourhouse.jpg\n+     > house.uu\
    \ e\n\nAt the shell prompt, type uuencode followed by\n\n+   - The name of the\
    \ unencoded file (ournewhouse.jpg in this case).\n+   - The name you want the\
    \ (eventually) unencoded file to have (ourhouse.jpg).\n+   - A command to redirect\
    \ the output to a new filename (> house.ue). You add this bit so the file will\
    \ be saved on disk and not displayed on the screen instead. We've used the .uue\
    \ extension so we'll more easily remember that the file is uuencoded.\n\nCode\
    \ Listing 13.1 lists the files in a directory (to verify the name) and then uuen\
    \ codes the file. Also, notice that it shows what the top of a uuencoded file\
    \ looks like.\n\n# To encode with uuencode and email at once:\n\n+   - uuencode\
    \ ournewhouse.jpg house.jpg |\n+     mail -s \"Here's the new picture\"\n+   \
    \  debray@roycomm.com\n\nAt the shell prompt, use uuencode followed by\n\n+  \
    \ - The name of the unencoded file (ournewhouse.jpg in this case)\n+   - The name\
    \ you want the (eventually) unencoded file to have (house.jpg).\n+   - A command\
    \ to pipe the output ( | 'mail -s \"Here's the new picture\" debray@roycomm.com').\
    \ This mails the file to a specific email address with specific text in the subject\
    \ line, which the -s flag sets. See Chapter 11 for more about mailing files and\
    \ mailing from the shell prompt.\n\n# Tips\n\n+   - If you're sending a file to\
    \ someone with a MIME-compliant email program, you might try base64 encoding,\
    \ using uuencode -m. See Chapter 11 for more about email.\n+   - A relatively\
    \ new development on Usenet is to use yEnc (yencoding/ ydecoding). Look for yencode\
    \ and ydecode on your system, or consider installing them if needed. See Chapter\
    \ 14 for more information about installing software.\n+   - Also check out Chapter\
    \ 11 for information about email programs that will automatically handle attachments,\
    \ including encoding files for you.\n+   - You must (either manually or automatically)\
    \ encode all binary files (graphics, programs, compressed files, etc.) before\
    \ emailing them. Plain text (text files, scripts, or HTML documents) don't need\
    \ to be encoded.\n\nCode Listing 13.2 shows this command and gives a glimpse into\
    \ a uuencoded file."
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Decoding Files

    with uudecode


    You’ll decode files whenever you receive binary files through email—it’s the only
    way you can use encoded files. Although most email programs and news readers will
    take care of decoding files for you (and, therefore, you won’t need the information
    here), you may need to do it manually on occasion. (Hint: If you open up a file
    or an email message and see something like Code Listing 13.3, you’ve got a little
    decoding to do. To avoid the gibberish, decode your files, as shown in Code Listing
    13.4.


    # To decode files with uudecode:


    +   - uudecode rowboat.uue


    At the shell prompt, type uudecode followed by the name of the file to decode
    (Code Listing 13.4).


    ```

    [ejr@hobbes compression]$ uudecode rowboat.uue

    [ejr@hobbes compression]$ ls -l row*

    -rw-r--r-- 1 ejr users 128886 Jul 27

    + 09:52 rowboat.jpg

    -rw-r--r-- 1 ejr users 177606 Jul 27

    + 09:51 rowboat.uue

    [ejr@hobbes compression]$

    ```


    Code Listing 13.4 Udecoding files is straightforward.


    # Tips


    +   - When you receive an encoded file, you might have to uncompress or unzip
    it in addition to decoding it. See the appropriate sections later in this chapter
    for details.


    +   - If you have a file that you suspect is unencoded, use head plus the filename
    to view the top ten lines of the file. If it’s really uuenencoded, you’ll see
    a line saying so at the top, as shown in Code Listing 13.3. The 644 in the list
    is the file’s permissions, and rowboat.jpg is the filename that the extracted
    file will have. See Chapter 5 for highly interesting details about file permissions.


    ```

    [ejr@hobbes compression]$ head rowboat.uue

    begin 644 rowboat.jpg

    M"C"=6H<"E"(C"B"C"E"C"E"C"E"C"E"C"E"C"E"C"E"C"E"C"E"C"E"C"

    MC"#4FKN3JCKS.25Q0IFJR=SN97,A*H"B1J9B1Y;B4G-F46;FJT]"1A

    M@GQ;V8R&AE"-O,:ST;GJN"IY,W4G-F48"XRR"1Q98IT,S4B";J8EVEP

    M:7IA-4H*"B14-6AE;VYL-2IR9K6L;D9VJ09"1P;8S21T;R18-7DP

    M;SM8FRS(&ST"G5E-10F-FA6-VAE-F4-BAE(AQU);G-E@1B7,9@GR

    M9G0D;V18B6SN(&U-1A;F08W17B-H6@0-6;G9T1P7?G-6W-8AE-6@0

    MFTB;V8P6SR,FET-7J-E;IF:6Y1-VA3"P8B6YD"C"U"-11;G-1984@F]X

    M97,N"B*"C"@"E"C"@"E"C"@"M2i5879E($J$A)G"Y";B5AE(K1A;6EN

    M8R1O98IT,B44V-R97-B*H"HB1E6S8V;E7,-6,8;7556;6-VAA-"1%

    [ejr@hobbes compression]$

    ```


    Code Listing 13.3 Use the head command to view the top of a file. The "begin"
    line is the tipoff that it’s a uuenencoded file, with 644 permissions and the
    name of rowboat.jpg.'
