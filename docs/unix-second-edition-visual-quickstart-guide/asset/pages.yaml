    Code Listing 10.5 The last line produced by the feedback script differs, depending
    on the files found.


    # 2. if `[ `ls | grep feedback` `


    Start the loop with if, and then follow it with the conditional statement, in
    this case if ls | grep feedback. Read this as: "List the files in the current
    directory and search for a file named feedback. If that file exists, then the
    expression is true." The redirection to /dev/null just discards the output from
    grep; you care about the answer to the test but not the specific lines found or
    not found. (See the whole script in Figure 10.6.)


    # 3. then echo "There''s feedback on the latest project"


    On the line immediately after the if statement, enter the command to be carried
