- pgno: 337
  md: "```\n1001 jdoe@foo $ sudo ls\nPassword:\nMy mind is going. I can feel it.\n\
    Password:\nTake a stress pill and think things over.\nPassword:\nHe has fallen\
    \ in the water!\n1002 jdoe@foo $\n```\n\nCode Listing 16.2 More surprisingly,\
    \ sudo has a sense of humor.\n\nNote that all uses of sudo is logged. If your\
    \ system administrator won't be happy with your experimenting with being root,\
    \ don't use sudo on any system other than your own. In Code Listing 16.2, we show\
    \ the difference between being a normal user and acting with authority.\n\n# To\
    \ act like root with sudo:\n\n+   1. cd /var/log; tail messages\n+   \n+   As\
    \ plain-old you, try to look at the system log files in /var/log. On a Linux system,\
    \ it's usually /var/log/messages; on a Solaris system, it's usually /var/log/syslog.\
    \ Other Unix flavors will have other, but similar, locations.\n+   \n+   Note\
    \ that some of these files will require root access to view them, while others\
    \ won't. If you can view a file as you, then choose a different file to see how\
    \ sudo helps.\n+   \n+   2. sudo tail messages\n+   \n+   After permission was\
    \ denied on the previous attempt, use sudo before the command to try to issue\
    \ the same command with root authority.\n+   \n+   3. ********\n+   \n+   Enter\
    \ your password after the interesting warning, and then note that the command\
    \ succeeded this time (see Code Listing 16.1).\n\n+   • If you haven't been given\
    \ permission (not just technical permission, but actual, \"you may do this\" permission)\
    \ to use sudo, don't. Everything that happens with sudo is logged, and you'll\
    \ probably have to answer for your actions.\n+   \n+   • Whenever possible, it's\
    \ better to use sudo only when you need it, than to become root. Any typo can\
    \ be problematic, and it's a good thing to have to consciously add sudo when you\
    \ want to act with root authority.\n+   \n+   • After you've used sudo once, you\
    \ can use it again within some amount of time (usually five minutes) without entering\
    \ your password again.\n+   \n+   • Some versions of sudo have pretty entertaining\
    \ prompts if you mess up your password (Code Listing 16.2). You're likely to irritate\
    \ your system administrator tremendously if you try to look at these on purpose,\
    \ though."
