  md: "# To schedule sequential one-time jobs with at:\n\n+   1. at midnight\n+  \
    \ Specify when you want the sequential jobs to run, using at plus a time statement\
    \ (Code Listing 9.2). You can use a variety of time statements, as shown in the\
    \ previous example.\n+   \n+   2. tar -icf ~/bigdog.tar ~/HereKittyKitty\n+  \
    \ Enter the first job you want to run. This job collects all of the files from\
    \ the directory called ~/HereKittyKitty into a single file called ~/bigdog.tar.\
    \ Chapter 13 will tell you more about archiving with tar.\n+   \n+   3. gzip ~/bigdog.tar\n\
    +   Enter the next job to run. This compresses the ~/bigdog.tar file, making it\
    \ easier to store and email.\n+   \n+   4. mutt -a bigdog.tar.gz -s \"Read this\
    \ by lunch time!\" deb < /dev/null\n+   Specify the next job in the sequence.\
    \ Here, we're using mutt's command-line mail options to attach a file, specify\
    \ a subject, and mail the whole shebang to Deb. See Chapter 11 for more on emailing\
    \ with mutt.\n+   \n+   5. Ctrl D\n+   Ta-daaaa! Use this key combination to finish\
    \ the sequence.\n\n```\n[ejr@hobbes ejr]$ at midnight\nat> tar -icf ~/bigdog.tar\
    \ ~/HereKittyKitty\nat> gzip ~/bigdog.tar\nat> mutt -a bigdog.tar.gz -s \"Read\
    \ this by lunch time\" deb < /dev/null\nat>\nat> <EOT>\nwarning: commands will\
    \ be executed using\n - /bin/sh\njob 12 at 2003-08-28 00:00\n[ejr@hobbes ejr]$\n\
    ```\n\nCode Listing 9.2 To schedule sequential one-time jobs, just specify the\
    \ time and the jobs in the order you want them to run."
