- pgno: 153
  md: "# Finding Out File Types with file\n\nIf you come from a Windows, Macintosh,\
    \ or DOS background, you're probably used to accessing files and being able to\
    \ see what type of files they are—HTML files, GIFs, documents, or whatever. In\
    \ Unix, though, you often can't tell the file type just by listing files or displaying\
    \ directory contents. That's where file comes in handy, as shown in Code Listing\
    \ 7.7.\n\n# To identify file types with file:\n\n+   - file /usr/bin/pico\n+ \
    \  At the shell prompt, type file, followed by the path (if necessary) and filename.\
    \ You'll see output similar to that in Code Listing 7.7.\n\n# Tip\n\n+   - Not\
    \ all files have the \"magic\" information associated with them that makes file\
    \ work but most do. Where they don't, you get a best-guess response, like the\
    \ second response in Code Listing 7.7. Unfortunately, you can't tell by looking\
    \ if it's definitive information or a guess, but if it's terse (as in the second\
    \ response), take it with a grain of salt.\n\n```\n[e]@hobbes ejr]$ file /usr/bin/pico\n\
    /usr/bin/pico: ELF 32-bit LSB executable,\n  Intel 80386, version 1, dynamically\
    \ ld\n[e]@hobbes ejr]$ file temp.htm\ntemp.htm: ASCII text\n[e]@hobbes ejr]$\n\
    ```\n\nCode Listing 7.7 The file command provides useful information about what\
    \ kind of data is in specific files."
  merge: -1
  img_proc: true
- pgno: 154
  md: "# Finding Out About\nUsers with finger\n\nUsing the finger command, you can\
    \ find out who is currently logged into the Unix system as well as what they're\
    \ doing, how long they've been logged in, and other snoopy, not-necessarily-your-business\
    \ information (Code Listing 7.8).\n\n# To find out who is logged in using finger:\n\
    \n+   1. `finger`\n+   \n+      At the shell prompt, type `finger` to see who\
    \ else is logged into the system and to get a little information about them (Code\
    \ Listing 7.8).\n+   \n+   2. `finger @stc.org`\n+   \n+      Type `finger @`,\
    \ and a host name (in this case stc.org) to find out who is logged into another\
    \ host.\n+   \n+      Fingering a different host doesn't always work, depending\
    \ on security settings on the other host computer(s). If the host doesn't allow\
    \ it, you'll get a message like the one in Code Listing 7.8.\n\n```\n```text\n\
    [ejr@hobbes ejr]$ finger\nLogin       Name       Tty   Idle   Login Time   Office\
    \   Office Phone\nasr                              *4     1          Jul 24 13:32\n\
    deb                              5      1          Jul 24 13:32\nejr         Eric\
    \ J. Ray 1       3:20       Jul 22 07:42\nejr         Eric J. Ray p1      1:12\
    \       Jul 24 12:14 (calvin)\nejr         Eric J. Ray p0                 Jul\
    \ 24 13:02 (calvin)\nroot                             *2     1d         Jul 25\
    \ 15:13\n[ejr@hobbes ejr]$ finger @stc.org\n[stc.org]\nNo one logged on\n[ejr@hobbes\
    \ ejr]$ finger @osunwx.ucc.okstate.edu\n[osunwx.ucc.okstate.edu]\nfinger: connect:\
    \ Connection refused\n[ejr@hobbes ejr]$\n```\n```\n\n**Code Listing 7.8** The\
    \ finger command often provides interesting information about who is logged onto\
    \ different systems."
