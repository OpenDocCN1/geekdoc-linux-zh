- pgno: 248
  md: "# Sending Email with mutt\n\nSending messages with mutt is similar to sending\
    \ messages with pine. Most commonly, you’ll compose a message while you’re already\
    \ futzing around in mutt (Figure 11.11).\n\n# To compose and send a message using\
    \ mutt:\n\n+   1. **mutt**  \n+      To begin, type `mutt` at the shell prompt\
    \ to start mutt.\n+   \n+   2. **M**  \n+      Press `M` to start a new message.\n\
    +   \n+   3. **Enter**  \n+      Press `Enter` after entering each bit of information\
    \ that mutt asks for (see Figure 11.11). Fill in the **To** and **Subject** lines.\
    \ (See the sidebar *Our Two Cents on the Subject of Subjects* earlier in this\
    \ chapter.)\n+   \n+   4. Say hello to your audience.  \n+      Huh? After you\
    \ enter the message header contents (filling in what you want), you’ll be plunked\
    \ right into vi, facing the top of a very blank message. See Chapter 4 for a quick\
    \ reminder about using vi.\n+   \n+   5. John,  \n+      I was having this dream\
    \ that I had my alarm clock installed in my stomach. I remembered this because,\
    \ when my alarm went off, I found myself pushing my belly button trying to turn\
    \ off the noise. Good grief...I need a vacation!  \n+      Type your message,\
    \ whatever it may be.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_248_0.png)\n\
    \n> **Figure 11.11** You fill in the message header by answering questions or\
    \ filling in blanks (Subject: in this case), and then move on using the `Enter`\
    \ key."
  merge: -1
