- pgno: 232
  md: '# More on If-Then


    Using the steps provided in this section, try some of these other if-then possibilities:


    +   - `[ -a filename ]` checks to see whether a file exists.

    +   - `[ ! -a filename ]` checks to see whether a file does not exist. The ! symbol
    (not) makes this test report "true" when the previous example would be "false."

    +   - `[ -d name ]` checks to see whether name exists and is a directory.

    +   - `[ first -nt second ]` checks to see whether the modification date of the
    first file or directory is newer than the second.

    +   - `[ first -ot second ]` checks to see whether the modification date of the
    first file or directory is older than the second.

    +   - `[ -n string ]` checks to see whether the string has a length greater than
    0.

    +   - `[ -z string ]` checks to see whether the string is null length.

    +   - `[ string1 = string2 ]` checks to see whether the first string is equal
    to the second.

    +   - `[ string1 != string2 ]` checks to see whether the first string is not equal
    to the second.

    +   - `[ \( condition1 \) -a \( condition2 \) ]` checks to see whether both conditions
    are true (conditions can include other conditions).

    +   - `[ \( condition1 \) -o \( condition2 \) ]` checks to see if either condition1
    or condition2 is true.


    Type man test for more information about creating conditional statements.'
  merge: -1
  img_proc: true
- pgno: 233
  md: "# Accepting Command-Line Arguments in Your Scripts\n\nSuppose that at the end\
    \ of every month you need to send a progress report to your boss. You might set\
    \ up a script to address an email message to your boss, provide an appropriate\
    \ subject line, and send the file containing the progress report. You’d likely\
    \ have this script automatically address a message to your boss and put in the\
    \ subject line, but you’d want to use command-line input to tell the script which\
    \ file you want to send. By using command-line input, you can give your scripts\
    \ a bit more flexibility and still have much of a process automated for you. You\
    \ run the script and specify the input at the shell prompt, as shown in Figure\
    \ 10.7.\n\n# To accept command-line arguments in a script:\n\n+   1. vi status-report\n\
    +   Use your favorite editor to edit your script.\n\n+   2. mail -s \"Status report\
    \ for $1\" boss@example.com < ~/reports/$1\n+   Enter a command, with $1 appearing\
    \ in each place you want to use the first item of input from the command line.\
    \ In this example, the script starts a message to the boss, fills in the subject\
    \ line (adding the month automatically), and sends the appropriate monthly report\
    \ (the one specified on the command line) from the reports directory under your\
    \ home directory.\n\n+   3. Save and exit, and then run the script (Code Listing\
    \ 10.6), though you might first have to find a boss to take your status report\
    \ and provide the content for the status report.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_233_0.png)\n\
    \nFigure 10.7 Using command-line input, you can add flexibility to a script and\
    \ still have the script do the grunt work for you.\n\n```\n[ejrhobbes scripting]$\
    \ more status-report\n#! /bin/sh\n\nmail boss@whereever.com -s \"Status report\
    \ for $1\"\n  for $1\" < ~/reports/$1\n\n[ejrhobbes scripting]$ ./status-report\n\
    August\n[ejrhobbes scripting]$\n```\n\nCode Listing 10.6 By providing command-line\
    \ input, you can control what the script does.\n\n# ✓ Tips\n\n+   To see the information\
    \ provided at the command line, echo it back out with echo $*. The $* variable\
    \ provides all of the command-line input, with $1, $2, and $3 containing the individual\
    \ items.\n\n+   You can also accept input at specified points while a script is\
    \ running. See the next section for more details."
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Accepting Input While a Script Is Running


    In the previous section, we showed you that you can require that information be
    provided along with the script in order for the script to run, but it’s easy to
    forget to input the information and thus not get the results you expected. You
    can also require input while a script is running. The script runs, you input some
    information, and then the script continues (probably) using the information that
    you input (Figure 10.8). In this case, the script counts misspelled words, but
    you can apply it to anything you want.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_234_0.png)


    Figure 10.8 You can also input information while a script is running.


    # To accept input while a script is running:


    +   1. pico retentive

    +   Use your favorite editor to edit your script.

    +   2. echo -e "Which file do you want to analyze?"

    +   Specify the text for the prompt that you’ll see onscreen. Here, the onscreen
    text will read "Which file do you want to analyze?"

    +   3. read choice

    +   At whatever point in the script you want the script to accept information,
    type read followed by the name of the variable to accept the input. Here, we name
    the variable choice.

    +   4. echo "Choice has `cat $choice | spell | wc -l` misspelled words"

    +   Echo a phrase (and embedded command) to check the spelling, count the misspelled
    words, and report the number for the file specified. At each place where the filename
    should appear, substitute $choice.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '```

