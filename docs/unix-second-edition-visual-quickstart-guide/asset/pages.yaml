  md: '# Tips


    +   - After changing shells, you might have problems running some commands or
    have a prompt or display that''s not as good as the original. That''s likely a
    result of your default shell being carefully customized by your system administrator.
    You''re probably on your own to set up and configure your new shell, and Chapter
    8 can help you do this.


    +   - Some systems don''t let users use chsh to change shells. If this is the
    case, you''ll need to email your system administrator and ask for a change, or
    see if there are alternative methods, as shown in Figure 3.2. You could also change
    your shell temporarily, as described in the next section.


    +   - See Changing Your Identity with su later in this chapter for more about
    the su command.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_66_0.png)


    Figure 3.2 Some ISPs provide a handy interface for changing shells that lets users
    pick their new shells from a menu, like this one.'
