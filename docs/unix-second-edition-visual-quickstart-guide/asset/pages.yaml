- pgno: 92
  md: '# Starting vi and Dabbling with It


    Before you go running off to use vi, understand that it has two modes (both of
    which look pretty much like Figure 4.11):


    +   - **Input mode** (sometimes called insert mode), in which the keys you press
    actually show up in the file that you''re editing. You use this mode to add or
    change text.

    +   - **Command mode**, in which every keystroke is interpreted as a command.
    You use this mode to do everything except enter text.


    What''s confusing for many people about vi is that it starts you in command mode,
    meaning that if you just start typing, you may see some blank spaces, characters,
    and bits of words that you type—essentially, a bunch of garbage that does not
    exactly represent what you''re typing—and you''ll hear a lot of beeping. So, as
    we''ll show you in the following steps, you''ll need to access the input mode
    as soon as you start vi.


    # To start vi:


    +   1. **vi**

    +      At the shell prompt, type vi. The program starts up and you''ll see something
    like Figure 4.11. The ~ symbols show blank lines below the end of the file.

    +   2. **i**

    +      Type i to get into input mode. This itself is a command issued in command
    mode, so it won''t show up on the screen.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_92_0.png)


    Figure 4.11 The vi editor inundates you with tons of onscreen help and advice,
    as shown here. Well, documentation is available, but the vi interface itself isn''t
    really helpful at all!'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# 3. hairy spiders lurk


    In input mode, type anything you want. Everything you type will show up on the
    screen until you return to command mode by pressing Esc. When you are in command
    mode, you can use the arrow keys to navigate up and down in the file line by line
    and Ctrl F and Ctrl B to scroll one screen forward and backward, respectively.


    # ✓ Tips


    +   - To get help for vi, type man vi. See Chapter 1 for more about man pages.


    +   - If you’re not sure what mode you’re in, press Esc to go into command mode.
    If you’re already in command mode, you’ll hear a beep. If you’re in input mode,
    you’ll change to command mode.


    +   - Many Unix-like systems, including Linux and Mac OS, actually provide a program
    called vim in the place of vi. vim (VI iMproved) is like vi but feature-rich and
    more flexible, and you still start it with the command vi.


    +   - You can open specific files or even multiple files when you access vi. At
    the shell prompt, type vi filetoedit (or whatever) to open a specific file. Or,
    for example, type vi *.html to open all of the HTML documents in a directory,
    then use Esc :n (for "next") to move to each subsequent file.


    +   - See Adding and Deleting Text in vi later in this chapter for more details
    about editing in vi.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Saving in vi


    You’ll want to save changes to your documents frequently, especially as you’re
    learning to use vi (Figure 4.12). Until you’re accustomed to switching between
    command and input mode, you may accidentally type in commands when you think you’re
    typing text, with unpredictable results. To save files, just follow these steps.


    # To save text in vi:


    +   - Esc :w limerick


    Press Esc to get out of input mode and into command mode, then type :w (for "write,"
    as in write to the disk) followed by a space and then the filename (limerick in
    this example) you want to use for the file, then press Enter. If you’ve already
    saved the file once, just press Esc and type :w then press Enter.


    # Tips


    +   - If you’ve already saved your file at least once, you can save changes and
    exit vi in one fell swoop. In command mode, type :wq (for "write quit"). For more
    information about quitting vi, see the section called Exiting vi later in this
    chapter.


    +   - If you want to save a file over an existing file (obliterating the original
    as you do), use :w! existingfilename in command mode. The ! forces vi to overwrite
    the original.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_94_0.png)'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Adding and Deleting Text in vi


    Adding and deleting text in vi is a bit more complicated than doing the same in
    pico. Whereas in pico, you basically just place your cursor where you want to
    make changes, vi has a whole slew of commands that you use to specify where the
    changes should occur. (Tables 4.1, 4.2, and 4.3 list only a very few of your options.)
    Plus, to issue the commands, you have to switch to command mode.


    # To add or delete text in vi:


    +   1. vi

    +   To begin, type vi at the shell prompt.

    +   2. i

    +   Change into input mode.

    +   3. There once was a man from Nantucket

    +   Type in some text that you''ll want to add to.

    +   4. Esc

    +   Press Esc to enter command mode before you issue the commands.

    +   5. Choose a command, based on what you want to do to the text.

    +   Table 4.1 lists commands to add text.

    +   Table 4.2 lists commands to delete text.

    +   Table 4.3 lists miscellaneous editing commands.

    +   6. Esc dd

    +   Type the command. Here, we''re deleting the current line of text.


    Table 4.1

    vi Commands to Add Text

    COMMAND | FUNCTION

    a | Adds text after the cursor

    A | Adds text at the end of the current line

    i | Inserts text before the cursor

    I | Inserts text at the beginning of the current line

    o | Inserts a blank line after the current line

    O | Inserts a blank line before the current line


    Table 4.2

    vi Commands to Delete Text

    COMMAND | FUNCTION

    x | Deletes one character (under the cursor)

    X | Deletes one character (behind the cursor)

    dd | Deletes the current line

    5dd | Deletes five lines starting with the current line (obviously, any number
    would work here)

    dw | Deletes the current word

    cw | Changes the current word (deletes it and replaces it with the next word you
    type)

    r | Replaces the character under the cursor with the next character you type

    R | Replaces the existing text with the text you type (like overtype mode in most
    word processors)


    Table 4.3

    Other Handy vi Editing Commands

    COMMAND | FUNCTION

    y | Copies the current line

    p | Pastes the copied line after the cursor or line

    J | Joins the current and following lines

    u | Undoes the last change

    U | Undoes all changes on the current line

    . | Repeats the last command'
  merge: -1
  img_proc: true
- pgno: 96
  md: "# Importing Files into vi\n\nYou can also merge multiple files in vi by reading\
    \ additional files into the current one, as shown in Figure 4.13. Basically, all\
    \ this means is that you insert one file into the file you're currently editing.\n\
    \n# To import files in vi:\n\n+   1. vi hairyspider\n+   \n+      At the shell\
    \ prompt, type vi followed by the filename to start vi with, in this case, the\
    \ hairyspider file.\n+   \n+   2. Esc :r filename\n+   \n+      At the point in\
    \ the file where you want to import text, press Esc, then type :r and the filename\
    \ you want to read into the file.\n\n# Tip\n\nvi also lets you read the output\
    \ of commands into the file. For example, if you want to read the list of files\
    \ in a specific directory into the file, use Esc :r !ls in command mode.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_96_0.png)"
  merge: -1
