- pgno: 61
  md: '# WORKING WITH YOUR SHELL


    # Chapter Contents


    +   - Discovering which shell you''re using

    +   - Understanding shells and options

    +   - Changing your shell

    +   - Changing your shell temporarily

    +   - Using completion in the bash shell

    +   - Viewing session history in the bash shell

    +   - Using completion in the zsh shell

    +   - Viewing session history in the zsh shell

    +   - Using completion in the ksh shell

    +   - Viewing session history in the ksh shell

    +   - Viewing session history in the csh shell

    +   - Changing your identity

    +   - Fixing terminal settings

    +   - Exiting the shell


    When you access a Unix system, the first thing you see is the prompt, called the
    shell prompt, which is where you interact with Unix. The shell determines how
    easily you can enter and reenter commands and how you can control your environment.
    What''s cool about Unix is that you''re not stuck with one shell—that is, on most
    systems you can choose to use shells that have different features and capabilities.


    In this chapter, we''ll look at your shell, show you how to change your shell,
    and get you started using a few of the more common shells.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Discovering What Shell You’re Using


    When you first log in to your Unix account, you’ll be using the default shell
    on your system. The default shell, its features, and its options depend completely
    on what your system administrator specifies. Code Listings 3.1 and 3.2 show examples
    of how default shell prompts differ on two different systems.


    # To discover what shell you’re using:


    +   - echo $SHELL


    At your shell prompt, type echo $SHELL (capitalization counts!). This command
    tells Unix to display (echo) information about shell settings. This information,
    by the way, is contained in one of the environment variables, so the technical
    phrasing (which you might hear in Unix circles) is to “echo your shell environment
    variable.”


    The system’s response will be the full path to your shell—something like /bin/csh,
    /bin/bash, or /bin/ksh.


    # ✓ Tips


    +   - You can also use finger userid, substituting your log-in name for userid,
    to find out more about your shell settings. You can substitute any other userid
    and see comparable information about the other account holders. See Chapter 7
    for more about finger. (Some systems do not support finger, because finger can
    be a bit of a security hole.)


    +   - You’ll find more information about different shells and their capabilities
    throughout this chapter.


    ```

    xmision> echo $SHELL

    /bin/csh

    xmision> finger ejray

    Login name: ejray   In real life: "RayComm

    Directory: /home/users/eejray   Shell:

    → /bin/csh

    On since Jul 23 06:58:48 on pts/16 from

    → calvin.raycomm.com

    1 minute 28 seconds Idle Time

    No unread mail

    No Plan.

    xmision>

    ```


    Code Listing 3.1 This ISP account uses the /bin/csh shell by default.


    ```

    [ejr@hobbes ejr]$ echo $SHELL

    /bin/bash

    [ejr@hobbes ejr]$ finger ejr

    Login: ejr      Name: Eric J. Ray

    Directory: /home/ejr   Shell: /bin/bash

    On since Wed Jul 22 07:42 (MDT) on tty1

    → 3 hours 15 minutes idle

    On since Thu Jul 23 08:17 (MDT) on ttyp0

    → from calvin

    No mail.

    Project:

    Working on UNIX VQS.

    Plan:

    This is my plan-work all day, sleep all night.

    [ejr@hobbes ejr]$

    ```


    Code Listing 3.2 On hobbes, a Linux system, the default shell is /bin/bash.'
  merge: -1
  img_proc: true
- pgno: 63
  md: "# Understanding Shells and Options\n\nDepending on the particular Unix system\
    \ you're using, you may have several shells available to you. Table 3.1 describes\
    \ a few of the more common ones. Each of these shells has slightly different capabilities\
    \ and features. Keep in mind that the differences in shells do not affect what\
    \ you can do in Unix; rather, they affect how easily and flexibly you can interact\
    \ with the system.\n\nYou'll likely have bash, ksh, or tcsh/csh as your shell,\
    \ but you can change to one of many other shells fairly easily. As Code Listings\
    \ 3.3 and 3.4 show, you can start by finding out which shells are available to\
    \ you. Figure 3.1 shows some shells and how they relate to each other.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_63_0.png)\n\
    \nFigure 3.1 Shells fit neatly into a few \"families\" with the exception of a\
    \ few stragglers. Each shell in a family shares many characteristics with the\
    \ others in the same family.\n\nTable 3.1\n\n| Common Unix Shells |\n|---|---|\
    \ \n| Shell Name | Features |\n| sh | This shell, which is the original Unix shell\
    \ (often called the Bourne shell), is fine for scripting but lacks a lot of the\
    \ flexibility and power for interactive use. For example, it doesn't have features\
    \ like command completion, email checking, history, or aliasing. |\n| csh and\
    \ tcsh | This family of shells adds interactive uses but discards the popular\
    \ scripting support that sh-related shells offer in favor of a C programming-like\
    \ syntax. Because of the C syntax, this shell is often just called the C shell.\
    \ Unless you're a C programmer, these are not likely to be your best choices.\
    \ |\n| ksh, bash, and zsh | These provide a good blend of scripting and interactive\
    \ capabilities, but they stem from different sources (bash is most similar to\
    \ sh, hence the Bourne Again SHell name). |"
  merge: -1
  img_proc: true
- pgno: 64
  md: '# To see which shells are available to you:


    +   - cat /etc/shells


    At the shell prompt, type cat /etc/shells to find out which shells are available
    to you. Code Listings 3.4 and 3.5 show the results of this command on two different
    systems.


    # Tips


    +   - Before you go leaping forward through the next sections and changing your
    shell, you might check with your system administrator or help desk to find out
    which shells they support and sanction.


    +   - If all else is equal in terms of support from your system administrator
    or help desk, and you have no clear preference, we''d suggest zsh as a first choice,
    with bash as a close second. For most purposes, either will be fine. Power users
    will like zsh better in the long run.


    ```

    [ejr@hobbes]$ more /etc/shells

    /bin/bash

    /bin/sh

    /bin/tcsh

    /bin/csh

    [ejr@hobbes]$

    ```


    Code Listing 3.3 A minimal listing of available shells on a Unix system, including
    the basics but not too much in the way of choices.


    ```

    xmision> cat /etc/shells

    /usr/local/bin/tcsh

    /bin/csh

