    the variable. In this step, you''re setting up the variable and its value and
    making the environment variable available to all programs and scripts that run
    in the current shell session (Code Listing 8.4). If the value contains spaces
    or special characters, put the value in quotes.


    +   2. echo $NNTP SERVER

