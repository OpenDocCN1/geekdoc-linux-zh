- pgno: 184
  md: '# 2. vi ~/.bashrc


    Because the files with the prompt setting are in the systemwide /etc directory,
    we cannot change them directly, so we have to make the changes to .bashrc or a
    different configuration file in our home directory.


    # 3. PS1="\u \d $ "


    For example, we often set our prompt to include the userid (because we have enough
    different accounts on different systems that we need a reminder) and the date
    (because we''re scattered). We''re adding this at the end of the file so it will
    take precedence over the PS1 setting in the /etc/bashrc file that is referenced
    from the ~/.bashrc file (Figure 8.4).


    # 4. Save the file and exit from the editor.


    # 5. su - ejr


    Log in again with your changed prompt to try it out.


    # ✓ Tips


    +   - Note the trailing space in the prompt code: PS1="\u \d $ ". This space can
    help make it easier to use the prompt.

    +   - Consider changing your PS1 environment variable at the shell prompt, as
    discussed in Chapter 3, before you make changes in your configuration files. This
    way, you can try out a modified shell prompt before you change it in your configuration
    files.


    # Setting Your bash Prompt Promptly


    You can set your prompt to contain all sorts of information. The following list
    shows you what code to use to add certain kinds of information to your prompt
    (as well as help you translate the code in your existing prompt):


    +   - \u shows the userid of the current user—that''s you.

    +   - \w shows the current working directory with a path, using a ~ notation within
    your home directory.

    +   - \W shows the current directory without the path.

    +   - \t shows the time.

    +   - \d shows the date.

    +   - \n forces a new line, making the prompt appear split on two lines.

    +   - \h shows the host name of the computer.'
