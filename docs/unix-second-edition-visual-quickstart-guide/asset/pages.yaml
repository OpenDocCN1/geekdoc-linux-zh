- pgno: 309
  md: '# INSTALLING YOUR OWN SOFTWARE


    If you use Unix long enough, you''ll eventually want or need to install new software.
    Installing software could mean just installing a shell script that you get from
    a friend, or it could mean compiling and installing a full-fledged program that
    you download from the Internet.


    In this chapter, we''ll explore the process for installing software on Unix systems.
    Work through each section in the order provided, and keep in mind that


    +   - The process for installing Unix software is a bit more complicated than
    doing the same on Windows or Macintosh systems.

    +   - The example we use here will probably differ slightly from the exact process
    you''ll need to use for the programs or scripts you choose for your system.

    +   - You should probably check with your system administrator for specifics on
    what you can and cannot install on the system. Many ISPs will let you install
    what you want, but others may have specific restrictions or even make it impossible
    to compile software in your account.

    +   - Installing software if you do not have system administrator (root) access
    on your system is much more difficult.


    # Chapter Contents


    +   - Understanding Unix software installation

    +   - Finding Unix software

    +   - Downloading, placing, and decompressing software

    +   - Configuring software

    +   - Compiling and installing software'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Understanding Unix Software Installation


    When installing software on your Unix system, keep in mind two things. First,
    most software, including a script, relies on other programs or scripts being available
    at specific places within the system. For example, a script might require that
    the bash shell be available and located at /bin/bash. Or, a program might expect
    that it will be in /usr/local/bin and that all user home directories will be under
    /home. So, you should pay special attention during the installation process to
    make sure that all other required scripts or programs are available.


    Second, programs (but not scripts) are compiled, which means that they’re taken
    from one probably-mostly-readable-to-you language (generically called source code)
    and translated into computer-readable files (often called binaries). As software
    is compiled, hardware and operating system-specific characteristics (or dependencies)
    are built in. So, a program that’s compiled to run on a specific platform and
    operating system cannot run on other ones—that is, a program compiled on Linux
    on a Pentium cannot run on Linux on an Alpha, Solaris on a Pentium, or Digital
    Unix on a SPARC.


    In fact, most Unix programs are distributed as source code, not as binaries, so
    you can compile them for your particular system when installing.


    # ✓ Tip


    +   ■ Before you get started with the next section, you might cruise back to Chapters
    1 and 2 for information about exploring your Unix system and to Chapter 7 for
    a reminder of how to find out what operating system and hardware you’re using.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Finding Unix Software


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_311_0.png)


    Figure 14.1 You''ll find all the software you could ever want on many software
    archives on the Web, such as HotScripts.


    Before you can install software on your Unix system, you have to find the software
    and locate the correct version of the software. We recommend the following places
    to look:


    +   - Search the Web using Yahoo (www.yahoo.com) or Google (www.google.com) to
    find downloadable software.


    +   - Visit specific software sites, such as HotScripts at www.hotscripts.com
    (Figure 14.1) or SourceForge at http://sourceforge.net or FreshMeat at http://freshmeat.net.


    In using these resources, you''ll come upon the following:


    +   - Code for Perl, shell, or other scripts: You''ll generally have to download,
    uncompress, and unarchive these, and then edit some of the files to insert system-specific
    settings.


    +   - Source code for programs: With these, you''ll have to download, uncompress,
    and unarchive, and then set some system-specific settings. Then, you''ll have
    to "make" them, which tells the make program on your system to compile and install
    the programs.


    +   - Precompiled binaries: You''ll have to scout through the names available
    and find the name (and operating system and platform) that corresponds to the
    system on which you want to run the software to run. Then, you''ll have to download
    it, decompress it, and put it where you want it. This is the easiest solution—when
    it works; however, keep in mind that you might download it, uncompress it, and
    find that it still won''t work, leaving you with no choice but to download and
    compile the source code.


    # Tips


    +   If you''ll be downloading and installing a lot of software, and if you have
    no significant quota limitations, look into using or even downloading and installing
    rpm. It''s a neat compression/installation/configuration program that makes installing
    Unix software in this special format as easy as installing a program in Windows
    or on a Macintosh. It''s standard on RedHat and Mandrake Linux but has been used
    on many different Unix systems. The apt package system, used by Debian Linux,
    is similar in intent and gaining in popularity.


    +   Unless you''re root on your system, your options for installing software will
    be rather limited. Consider using a home Linux system to experiment with if you
    want to be able to install whatever and whenever you want.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Downloading, Placing, and Decompressing Software


    Once you''ve found software you want to install, your next step is to download
    it, put it in the proper place, and then decompress it (Code Listing 14.1). This
    process includes several tasks that you''ve already learned in other parts of
    this book, so we won''t go over them in detail here. For this section, we assume
    you already know what you want to download and where it can be found. In the example,
    we''re downloading the latest version of yencode, using links, from the www.yencode.org
    Web site.


    ```

    jdoe /home/jdoe $ mv yencode-0.46.tar.gz ~/src/

    jdoe /home/jdoe $ cd ~/src

    jdoe /home/jdoe/src $ tar -xzf yencode-0.46.tar.gz

    jdoe /home/jdoe/src $ cd yencode-0.46

    jdoe /home/jdoe/src/yencode-0.46 $

    ```


    Code Listing 14.1 The process of downloading software and getting ready to install
    it is rather straightforward.


    # To download, place, and decompress software:


    +   1. links www.yencode.org

    +      Use links to connect to the software archive, Web site, or whatever you''re
    downloading from.

    +   2. Browse to the correct location.

    +      Go ahead. We''ll wait.

    +   3. Choose the file to download by pressing Enter when the link to the file
    is highlighted.

    +      Confirm that you want to download the file.

    +   4. Q

    +      Quit the links program after the transfer is complete.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '5. `mv yencode-0.46.tar.gz ~/src/`

    Move the archive file into the src subdirectory under your main directory. (Create
    the directory first, if necessary.) You could use any directory, but it''s standard
    to use an src directory because many programs expect that they''ll be installed
    from an src directory.


    6. `cd ~/src`

    Change into the src directory.


    7. `tar -xzf rpm-2.5.1.tar.gz`

    Unzip and untar the source code archive with tar.


    8. `cd yencode-0.46`

    Change into your new directory, and get ready to compile and install. Whew! See
    Code Listing 14.1 for much of the process.


    # ✓ Tip


    +   - You can also use wget or ftp to download your software, which might be easier
    if you know exactly the URL of the software you want to download.'
  merge: -1
