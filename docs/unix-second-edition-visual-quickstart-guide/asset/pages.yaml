- pgno: 46
  md: '# Listing Directories and Files with ls (More Goodies)


    If you''ve been following along, you''re probably an expert at using ls to list
    directory contents and to verify that files and directories were copied as you
    intended. ls, though, has a couple more handy uses. In particular, you can also
    use it to


    +   - List filenames and information, which is handy for differentiating similar
    files (Figure 2.1).

    +   - List all files in a directory, including hidden ones, such as .profile and
    .login configuration files (Code Listing 2.5). See Chapter 8 for more about configuration
    files.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_46_0.png)


    # To list filenames and information:


    +   - ls -l


    At the shell prompt, type ls -l (that''s a lowercase "L", not a one). You''ll
    see the list of files in your directory fly by with the following information
    about each file (Code Listing 2.6):


    +   - Filename

    +   - File size

    +   - Date of last modification

    +   - Permissions information (find out more about permissions in Chapter 5)

    +   - Ownership and group membership (also covered in Chapter 5)


    ```

    $ ls -a

    . .stats deb.scheduleother

    .. current new.ideas schedule

    Code Listing 2.5 If you want to see hidden files, use ls -a.

    ```


    ```

    $ ls -l

    total 13

    -rw-rw-r-- 1 ejr users 2151 Jun 29 12:26 current

    -rw-rw-r-- 2 ejr users 1475 Jun 29 12:35 deb.schedule

    -rw-rw-r-- 1 ejr users 4567 Jun 29 12:26 new.ideas

    drwxrwxr-x 2 ejr users 1024 Jun 29 13:06 other

    -rw-rw-r-- 1 ejr users 1475 Jun 29 12:22 schedule

    Code Listing 2.6 Use ls -l to see a listing of the contents of a directory in
    long format.

    ```'
