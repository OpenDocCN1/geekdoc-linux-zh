    [jdoe@frazz jdoe]$ date

    Mon Jan 27 05:35 2003

    [jdoe@frazz jdoe]$ sudo /usr/sbin/ntpdate

    + 192.168.96.3

    27 Jan 05:30:18 ntpdate[1616]: step time

