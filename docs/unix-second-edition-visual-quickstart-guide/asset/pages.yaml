- pgno: 217
  md: "# Deleting Processes with kill\n\nIn addition to suspending jobs and running\
    \ them in the foreground and background, you can also choose to just delete them\
    \ completely. For example, you might realize midway through a job that you goofed\
    \ and need to redo it. Or perhaps you’ve accessed and suspended a man page and\
    \ no longer need to reference it.\n\nUsing kill, you can delete essentially any\
    \ process running or suspended on the Unix system. As Code Listing 9.14 shows,\
    \ you delete a process by first listing the processes, then using the kill command.\n\
    \n# To kill a job with kill:\n\n+   1. jobs\n+   At the shell prompt, type jobs,\
    \ then note the number or name of the job you want to kill.\n+   2. kill %ftp\n\
    +   In most shells, you can kill jobs with kill followed by %, and the job number\
    \ or command name—for example, you could kill an ftp job with a job number of\
    \ 1 using kill %ftp or kill %1. If your shell doesn’t cooperate, read on.\n\n\
    # To delete a process with kill:\n\n+   1. ps\n+   At the shell prompt, type ps\
    \ to see the list of all your current jobs (Code Listing 9.14). Note the PID (process\
    \ identification) number of the process you want to delete.\n+   2. kill 16217\n\
    +   Type kill 16217 followed by the PID number of the job you’re deleting.\n\n\
    ```\n$ ps -a -forest\nPID TTY STAT TIME COMMAND\n15911 p1 S 0:00 /bin/login -h\
    \ calvin\n  -> raycomm.com -p\n15914 p1 S 0:01 _ -bash\n16216 p1 T 0:00 _ telnet\n\
    16217 p1 T 0:00 _ lynx\nhttp://www.raycomm.com/\n$ kill -9 16217\n$ ps -a -forest\n\
    PID TTY STAT TIME COMMAND\n15911 p1 S 0:00 /bin/login -h calvin\n  -> raycomm.com\
    \ -p\n15914 p1 S 0:01 _ -bash\n16216 p1 T 0:00 _ telnet\n$\n```\n\nCode Listing\
    \ 9.14 Using kill plus the PID number, you can delete practically any process\
    \ running or suspended on the system.\n\n# Tips\n\n+   - Occasionally, you’ll\
    \ use kill and find that the process just keeps going. Try kill -9 followed by\
    \ the PID number to delete the process.\n+   - Be careful not to kill your current\
    \ shell process, or you’ll abruptly find your connection broken. Doing so would\
    \ be like sawing off the branch you’re sitting on.\n+   - Many newer Unix systems\
    \ allow you to use pkill to kill processes by name, not number. For example, you\
    \ might use pkill ftp to kill a suspended ftp session."
  merge: -1
  img_proc: true
