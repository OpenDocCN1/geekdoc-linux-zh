- pgno: 361
  md: "![](img/6ffd6bb320ccf354f5a4d57c9d95190d_361_0.png)\n\nFigure 17.4 A brief\
    \ shell script makes ROT13 as easy as, well, EBG13.\n\n# Embedding ROT13 Encoding\
    \ in a Shell Script\n\nIf you completed the steps in the previous section, you\
    \ might have noticed that you did a lot of typing. And, goodness, if you made\
    \ it through steps 3 and 5, your fingers are probably on strike right about now.\
    \ If you plan to encode or decode with ROT13 frequently, consider embedding the\
    \ sed commands in a shell script to avoid retyping them each time you encode or\
    \ decode text, as shown in Figure 17.4. You might refer back to Chapter 10 for\
    \ details on shell scripts before you get started here.\n\n# To create a ROT13\
    \ shell script:\n\n+   1. vi rot13\n+   Start a new shell script to process your\
    \ commands.\n\n+   2. #!/bin/sh\n+   Add the obligatory shell specification, as\
    \ shown in Figure 17.4.\n\n+   3. /bin/sed y/abcdefghijklmnopqrstuvwxyz/ABCDEFGHIJKLMNOPQRSTUVWXYZ/nopqr\n\
    +     - zABCDEFG... \n+     - stuvwxyz... \n+     - ZABCDEFGH... \n+   Specify\
    \ the sed program (using the full path) to make the program a little more flexible\
    \ and the command that encodes and decodes ROT13 text. It's better to make the\
    \ shell script self-contained, so instead of referencing an external file with\
    \ the sed script, we'll just put it in the command line here.\n\ncontinued on\
    \ next page"
  merge: -1
  img_proc: true
- pgno: 362
  md: '+   4. `/bin/sed y/abcdefghijklmnopqrstuvwxyz\n zABCDEFGHIJKLMNOPQRSTUVWXYZ/nopqr\n
    - stuvwxyzabcdefghijklmnopqrstuvwxyzNOPQRSTUVWXYZ\n -> ZABCDEFGH IJKLM/ "$1"`

    +   Here, we added $1 to pass the filename from the command line (as in rot13
    thisfile) to sed.


    +   5. `/bin/sed y/abcdefghijklmnopqrstuvwxyz\n zABCDEFGHIJKLMNOPQRSTUVWXYZ/nopqr\n
    - stuvwxyzabcdefghijklmnopqrstuvwxyzNOPQRSTUVWXYZ\n - ZABCDEFGH IJKLM/ "$1" |
    more`

    +   Next, pipe the output to more so you see the file one screen at a time.


    +   6. Save and exit out of the file.


    +   7. `chmod u+x rot13`

    +   Make the shell script executable, so you can just enter the name rot13 rather
    than sh rot13


    +   8. `./rot13 limerick`

    +   Test the script. Because we developed this script in a directory that''s not
    in the path, we have to execute the script with ./rot13. If you develop the script
    in a directory in your path, you should just be able to type rot13.


    # ✓ Tip


    +   ■ You can also build in an option to redirect the output of the script to
    a file and save it for later. Basically, all you do is create an if-then statement
    and give yourself the option to automatically redirecting the output to a filename,
    as Code Listing 17.7 shows. Check out Chapter 10 for more information about scripts
    and if-then statements.'
