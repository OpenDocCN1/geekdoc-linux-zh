- pgno: 345
  md: '![](img/6ffd6bb320ccf354f5a4d57c9d95190d_345_0.png)


    Figure 16.5 Use watch to keep an eye on the system.


    # Keeping up with watch


    As a system administrator, you practically have to have eyes in the back of your
    head and be aware of all kinds of activities that might be going on. The watch
    command is your friend. It keeps an eye on pretty much anything (users, system,
    or files) you want to monitor.




    ```

    sudo watch last

    ```


    Use watch to monitor the output of a specific command. When something changes,
    you''ll see it in the watch output (Figure 16.5). In this case, we''re monitoring
    who logged in and when.


    ```

    sudo watch --differences=cumulative -l -1 /var/spool/mail

    ```


    You can watch to see if mail''s getting delivered by monitoring an ls -l /var/spool/mail
    directory. The extra flags show cumulative differences since you started watch.




    The watch utility can be really handy, but sometimes it''d be easier to just do
    something like tail -f /var/log/httpd/access_log to keep track of the Web server
    access log or to write a shell script to periodically run or log last. Basically,
    watch is useful, but it''s not the only way to monitor what''s going on.


    On the lighter side, you can also use watch to periodically run some programs.
    For example, watch -n 5 fortune will display a new fortune every five seconds.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Chapter 16


    # Checking Boot Messages with dmesg


    Sometimes you might need extra information, beyond what is available on the running
    system, about the configuration or the hardware. The system automatically probes
    the hardware and generates all kinds of potentially useful information at that
    time but keeps it socked away in the bowels of the system. Use dmesg to get at
    what you need...in appalling detail.




    +   • dmesg | more


    Use dmesg (with the help of sudo and more) to gain some insight into the system
    (Code Listing 16.6).


    Or


    +   • dmesg | mail goodfriend


    ```

    @example.com -s "Help me understand"

    ```


    Send the output of dmesg to a friend for advice, if you''re really stuck.




    +   • A little knowledge can be a dangerous thing: be careful with your root access.


    +   • See Chapter 11 for more information about mailing files and data from the
    command line.'
  merge: -1
