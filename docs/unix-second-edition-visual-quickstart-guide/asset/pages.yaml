- pgno: 20
  md: '# Logging In


    After you’ve connected to the Unix system, your next step is to log in, or identify
    yourself to the Unix system. Logging in serves a few purposes, including giving
    you access to your email, files, and configurations. It also keeps you from inadvertently
    accessing someone else’s files and settings, and it keeps you from making changes
    to the system itself.


    # To log in:


    +   1. To begin, have your userid (user identification) and password ready. Contact
    your system administrator if you don’t have these yet.

    +   2. Type your userid at the login prompt, then press Enter. Your userid is
    case-sensitive, so be sure you type it exactly as your system administrator instructed.

    +   3. Type your password at the password prompt, then press Enter. Yup. Your
    password is case-sensitive, too.

    +   4. Read the information and messages that come up on the screen. The information
    that pops up—the message of the day—might be just a funny, as in Figure 1.4, or
    it might contain information about system policies, warnings about scheduled downtime,
    or useful tips, as shown in Figure 1.5, or both, or possibly neither, if your
    system administrators have nothing to say to you.


    After you’ve logged in, you’ll be located in your home directory, which is where
    your personal files and settings are stored. Your "location" in the Unix system
    is a slightly unwieldy concept that we’ll help you understand throughout this
    chapter.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_20_0.png)


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_20_1.png)


    # Tips


    +   - If you get an error message after attempting to log in, just try again.
    You likely just mistyped your userid or password. Whoops!

    +   - When you log in, you might see a message about failed log-in attempts. If
    you unsuccessfully tried to log in, then don’t worry about it; the message just
    confirms that you attempted to log in but failed. If, however, all of your log-in
    attempts (with you sitting at the keyboard) have been successful or if the number
    of failed log-in attempts seems high—say, five or more—then you might also mention
    the message to your system administrator, who can check security and log-in attempts.
    This could be a warning that someone unauthorized is trying to log in as you.'
  merge: -1
  img_proc: true
- pgno: 21
  md: "# Changing Your Password with passwd\n\nVirtually all Unix systems require\
    \ passwords to help ensure that your files and data remain your own and that the\
    \ system itself is secure from vandals and hackers. **Code Listing 1.1** shows\
    \ how you change your password.\n\nThroughout your Unix adventure, you'll likely\
    \ change your password often:\n\n+   - You'll probably want to change the password\
    \ provided by your system administrator after you log in for the first time. Hint,\
    \ hint.\n+   - You'll probably change your password at regular intervals. Many\
    \ Unix systems require that you change your password every so often—even every\
    \ 30 or 60 days is common.\n+   - You might also change your password voluntarily\
    \ if you think that someone might have learned it or if you tell anyone your password\
    \ (although you really shouldn't do that anyway).\n\n# To change your password:\n\
    \n+   1. **passwd**\n+      To start, type `passwd`.\n+   \n+   2. **youroldpassword**\n\
    +      Enter your old password—the one you're currently using. (Of course, type\
    \ in your old password, not the sample one we've used here!) Note that the password\
    \ doesn't show up onscreen when you type it, in case someone is lurking over your\
    \ shoulder, watching you type, and asking “whatcha doing?”\n\n```\n $ passwd\n\
    \ Changing password for ejr\n (Current) Unix password:\n New UNIX password:\n\
    \ Retype new UNIX password:\n passwd: all authentication tokens updated\n   →\
    \ successfully\n $\n\n```\n\n**Code Listing 1.1** Change your password regularly\
    \ using the `passwd` command.\n\n*continued on next page*"
