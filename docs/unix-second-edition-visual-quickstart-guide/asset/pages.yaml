- pgno: 162
  md: '# Understanding Your Unix Environment


    *Environment variables* are settings in the Unix system that specify how you,
    your shell, and the Unix system interact. When you log in to the Unix system,
    it sets up your standard environment variables—the shell prompt you want to use,
    the default search path, and other information to help programs run, among other
    things. You might think of your environment variables as being similar to having
    a standing order with a deli to deliver the same thing to you every day. You set
    up your "standing environment variables" and the Unix system delivers them to
    you session after session unless you specify otherwise.


    Basically, just like with the lunch deli, you can configure your environment in
    one of two ways:


    +   - Changing the variables for the current session—kind of like calling in a
    special order for the day (as in ordering onion and extra cheese on the day''s
    sandwich). You do this from the shell prompt, as discussed in the *Adding or Changing
    Variables* section in this chapter.

    +   - Changing the variables for all subsequent sessions—kind of like changing
    your standard order (say, when the doctor tells you to cut back on mayonnaise
    and suggests mustard for your long-term deli order). You do this within the configuration
    files, as discussed in sections following *Adding or Changing Variables*.


    If you want to change your environment variables, you should first try changing
    them from the shell prompt for the current session. This way, you can try out
    the changes before you make them permanent in your configuration files.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'When you do change your environment in the configuration files, keep in mind
    that configuration files are generally run in a specific order:


    +   - Systemwide configuration files (such as `/etc/profile`) run first upon log
    in. These systemwide configuration files in `/etc` (if they exist) help set up
    your environment, but you cannot change them.


    +   - Configuration files specific to your Unix account (such as `~/.profile`
    and `~/.kshrc`) run next if they''re available. If you want to change environment
    variables originally set in the systemwide files, you can reset the values in
    your own personal files.


    What this order means to you is that your own personal configurations override
    system ones. So, in making changes to your configuration files, make sure that
    you make changes to the configuration file that runs last. We''ll tell you which
    specific files to look for in the relevant sections of this chapter.


    Find out about discovering your current environment variables and adding or changing
    environment variables manually in the next two sections in this chapter.


    # Tips


    +   - You can use `echo $SHELL` to remind yourself of what shell you''re using.
    Visit Chapter 3 for more details.


    +   - Find out about changing environment variables in your system configuration
    files in other sections of this chapter, according to which shell you''re using.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Discovering Your Current Environment


    A good first step in changing your environment is determining what environment
    you have. Using the steps in this section, you can discover which environment
    and shell variables are currently set—including ones set in the configuration
    files as well as ones you''ve set for the current session (Code Listings 8.1 and
    8.2).


    As you''re going through these steps, you might check out the sidebar Variables
    in Your Environment You Shouldn''t Touch in this section for a list of variables
    you should leave alone. Then, in the next section, check out Variables You Can
    Mess With to find ones you can change.


    # To show your current environment in zsh, bash, or ksh:


    +   - set


    At the shell prompt, type set. You''ll see a list of the current environment and
    shell variables, as shown in Code Listing 8.1.


    Some of the variables may look familiar to you (such as the ones showing your
    shell or user name), while others are likely to be more cryptic (such as the line
    showing the last command you ran, in this case, _=cd).


    # To show your current environment in csh:


    +   - setenv


    At the shell prompt, type setenv. As Code Listing 8.2 shows, the preconfigured
    variables will closely resemble the environment variables that bash or ksh offer.


    ```

    [ejr@hobbes ejr]$ set

    BASH=/bin/bash

    BASH_VERSION=1.14.7(1)

    COLUMNS=80

    ENV=/home/ejr/.bashrc

    EUID=500

    HISTFILE=/home/ejr/.bash_history

    HISTSIZE=1000

    HISTSIZE=1000

    HOME=/home/ejr

    HOSTNAME=hobbes.raycomm.com

    HOSTTYPE=i386

    IFS=

    LINES=24

    LOGNAME=ejr

    MAIL=/var/spool/mail/ejr

    MAILCHECK=60

    OLDPWD=/home/ejr/src/rpm-2.5.1

    OPTERR=1

    OPTIND=1

    OSTYPE=Linux

    PATH=/usr/local/bin:/bin:/usr/bin:/usr/X11R6/bin:/home/ejr/bin

    PPID=1943

    PS1=[\ue\h \W]\$

    PS2>

    PS4=

    PWD=/home/ejr

    SHELL=/bin/bash

    SHLVL=3

    TERM=vt220

    UID=500

    USER=ejr

    USERNAME=

    _cd

    [ejr@hobbes ejr]$

    ```


    Code Listing 8.1 You can find out which variables exist in the zsh, bash, or ksh
    shells with set.'
  merge: -1
  img_proc: true
- pgno: 165
  md: "```\nxmission> setenv\nHOME=/home/users/e/ejroy\nPATH=/usr/local/bin:/usr/local/bin/X11:/usr/\n\
    \  * openwin/bin:/usr/bin:/usr/ucb:/usr/:\nLOGNAME=ejroy\nHZ=100\nTERM=vt100\n\
    TZ=MST7MDT\nSHELL=/usr/bin/csh\nMAIL=/var/mail/ejroy\nPWD=/home/users/e/ejroy\n\
