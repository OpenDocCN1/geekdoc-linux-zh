    /home/users/e/ejroy/.cshrc:set prompt="hostname> "

    /home/users/e/ejroy/.login: exit# leave user at regular C shell prompt

    xmision>

    ```


    Code Listing 8.21 The prompt statement will likely be in your .cshrc file.'
