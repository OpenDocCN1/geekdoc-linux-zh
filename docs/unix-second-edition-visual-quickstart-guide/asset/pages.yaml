- pgno: 41
  md: '# Naming Directories (and Files)


    As you start creating directories (and files), keep in mind the following guidelines:


    +   - Directories and files must have unique names. For example, you cannot name
    a directory Golf and a file Golf. You can, however, have a directory called Golf
    and a file called golf. The difference in capitalization makes each name unique.
    By the way, directories are often named with an initial cap, and filenames are
    often all lowercase.


    Directory and filenames should not include the following characters: angle brackets
    (< >), braces ({ }), brackets ([ ]), parentheses ( () ), double quotes (",), single
    quotes (''), asterisks (*), question marks (?), pipe symbols (|), slashes (/ \),
    carets (^), exclamation points (!), pound signs (#), dollar signs ($), ampersands
    (&), and tildes (~).


    Different shells handle special characters differently, and some will have no
    problems at all with these characters. Generally, though, they’re more trouble
    than they’re worth.


    +   - Generally, avoid names that include spaces and hyphens (-). You can use
    these, but they’re often more trouble than they’re worth—that is, some programs
    don’t deal with them correctly, so you have to use odd workarounds. Instead, stick
    to periods (.) and underscores (_) to separate words, characters, or numbers.


    +   - Use names that describe the directory’s or file’s contents so you easily
    remember them.


    # To create a directory:


    +   1. ls

    +   Start by listing existing directories to make sure that the planned name doesn’t
    conflict with an existing directory or filename.


    +   2. mkdir Newdirectory

    +   Type the mkdir command to make a new directory; in this case, it’s called
    Newdirectory. Refer to the sidebar Naming Directories (and Files) for guidelines.


    +   3. ls -l

    +   Now you can use ls -l (the -l flag specifies a long format) to look at the
    listing for your new directory (Code Listing 2.1). The d at the far left of the
    listing for Newdirectory indicates that it’s a directory and not a file. Of course,
    after you trust Unix to do as you say, you can skip this verification step.


    # Tips


    +   - If you attempt to create a directory with a file or directory name that
    already exists, Unix will not overwrite the existing directory. Instead, you’ll
    be told that a file by that name already exists. Try again with a different name.


    +   - Create several directories and subdirectories at once with the -p flag.
    For example, if you want to create a new subdirectory called Projects with a subdirectory
    called Cooking in that and a subdirectory called Desserts in that, you can use
    mkdir -p Projects/Cooking/Desserts and get it all done at once. Without the -p
    flag, you have to create Projects, Cooking, then Desserts in order, which is a
    longer recipe to make the same tree structure.'
  merge: -1
  img_proc: true
- pgno: 42
  md: "# Creating Files with touch\n\nAnother skill you’ll use frequently is creating\
    \ files. You might think of creating files as getting an empty bucket that you\
    \ can later fill with water…or sand…or rocks…or whatever. When you create a file,\
    \ you designate an empty space that you can fill with programs, activity logs,\
    \ your resume, or configurations—practically anything you want, or nothing at\
    \ all.\n\nOf course, you can always create a file by writing something in an editor\
    \ and saving it, as described in Chapter 4, but you will sometimes encounter situations\
    \ where you just need an empty file as a placeholder for later use. You create\
    \ empty files using the touch command, as shown in Code Listing 2.2.\n\n# To create\
    \ a file:\n\n+   1. `touch file.to.create`\n+   \n+   To create a file, type touch\
    \ followed by the name of the file. This creates an empty file.\n\n```\n$ ls\n\
    $ touch file.to.create\n$ ls -l file*\n-rw-rw-r- 1 ejr users 0 Jun 29 11:53 file.to.create\n\
    $ touch -t 12312359 oldfile\n$ ls -l\ntotal 0\n-rw-rw-r- 1 ejr users 0 Jun 29\
    \ 11:53 file.to.create\n-rw-rw-r- 1 ejr users 0 Dec 31 1998 oldfile\n$ touch -t\
    \ 200312312359 new.years.eve\n$ ls -l\ntotal 0\n-rw-rw-r- 1 ejr users 0 Jun 29\
    \ 11:53 file.to.create\n-rw-rw-r- 1 ejr users 0 Dec 31 2003 new.years.eve\n-rw-rw-r-\
    \ 1 ejr users 0 Dec 31 1998 oldfile\n$\n```\n\nCode Listing 2.2 Use the touch\
    \ command to create files, update their modification times, or both."
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 2. ls -l file*


    Optionally, verify that the file was created by typing ls -l file*. As shown in
    Code Listing 2.2, you’ll see the name of the new file as well as its length (0)
    and the date and time of its creation (likely seconds before the current time,
    if you’re following along).


    # ✓ Tips


    +   - You can also use touch to update a file’s date and time. For example, typing
    touch -t 12312359 oldfile at the prompt would update oldfile with a date of December
    31, 23 hours, and 59 minutes in the current year. Or, typing touch -t 200312312359
    new_years.eve would update the file called new_years.eve to the same time in the
    year 2003.


    +   - Each time you save changes in a file, the system automatically updates the
    date and time. See Chapter 4 for details about editing and saving files.


    +   - Refer to the sidebar Naming Directories (and Files) in this chapter for
    file-naming guidelines.'
  merge: -1
