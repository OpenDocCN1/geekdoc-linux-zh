- pgno: 433
  md: '# Need to learn Unix fast?

    Try a Visual QuickStart!


    +   - Takes an easy, visual approach to teaching Unix, using pictures to guide
    you through the system and show you what to do.

    +   - Works like a reference book—you look up what you need and then get straight
    to work.

    +   - No long-winded passages—concise, straightforward commentary explains what
    you need to know.

    +   - Affordably priced, because buying a computer book shouldn’t be an investment
    in itself.


    Deborah S. Ray and Eric J. Ray, authors of many books on computing, are recipients
    of several awards from the Society for Technical Communication, including an International
    Distinguished Technical Communication award. Deborah publishes TECHWR-L (www.techwr-l.com),
    a high-profile, high-traffic Web site for technical writers, and teaches professional
    communication at the University of Colorado at Denver. Eric is a senior technical
    writer for Sun Microsystems, working on the Solaris operating system. When they’re
    not engrossed in technical stuff, the Rays spend time with family and work on
    their home.'
