- pgno: 135
  md: '# Sorting Files with sort


    If you want to be really lazy—er, um, smart—let Unix sort files for you. You can
    use sort to, for example, sort your address book alphabetically—as opposed to
    the random order in which you might have entered addresses (see Code Listing 6.17).


    # To sort files with sort:


    +   sort address.book > sorted.address.book


    To begin, type sort, followed by the name of the file you want to sort. Unix will
    sort the lines in the file alphabetically and present the sorted results in the
    file you specify (here, sorted.address.book), as shown in Code Listing 6.17.


    ```

    [ejr@hobbes manipulate]$ more address.book

