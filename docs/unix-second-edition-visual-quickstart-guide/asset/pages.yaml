- pgno: 172
  md: '# To look at your zsh configuration files


    +   1. more ~/.z* /etc/zl* /etc/zprofile /etc/zsh*

    +   At the shell prompt, type more followed by each of the possible system configuration
    filenames to view your configuration files. If you don''t have all (or any) of
    the files mentioned here, don''t worry. Just make note of the ones you do have.
    Code Listing 8.5 shows an example of what you might see.


    +   2. Write down, for your reference, the system configuration files and the
    order in which they''re run. (Remember, settings in the last file run override
    all previous ones.) Our system configuration files, all automatically called by
    the system, include

    +   ▲ /etc/zshenv then ~/.zshenv

    +   ▲ /etc/zprofile then ~/.zprofile

    +   ▲ /etc/zshrc then ~/.zshrc

    +   ▲ /etc/zlogin then ~/.zlogin

    +   Keep in mind that the files you have may differ from the files that we have.


    # Tips


    +   Take special note of any lines in any of the files that end with a path and
    filename, or that reference other files directly, with something like /etc/profile
    on a line by itself. Each of those lines references another file that plays a
    role in getting you set up. Notice that some of the lines will reference others
    that don''t directly configure your environment.


    +   All lines that start with # are comments, which contain notes to help you
    better understand the files. Comments don''t actually do anything, but they help
    you see what each file does.


    Some files include oddities like export HISTFILE=${HOME}/.bash_history file that
    references the .bash_history file, containing the list of commands you''ve run.
    (Looks like a goof by the Linux distributor. Good thing you''re checking up on
    them, huh?)'
  merge: -1
  img_proc: true
- pgno: 173
  md: "# Adding to Your zsh Path\n\nOne of the most useful changes you can make to\
    \ your environment is adding to the default path, which is determined by the path\
    \ statement. The path statement tells the shell where to look for commands, scripts,\
    \ and programs. That is, if you issue a command, the path statement tells the\
    \ system to look for that command in each of the named directories in a specific\
    \ order:\n\nBe sure not to remove anything from your path unless you really know\
    \ what you’re doing, but feel free to add as many additional directories to it\
    \ as you want. For example, if you get started writing scripts (as described in\
    \ Chapter 10), you might put them in a scripts subdirectory and want to add that\
    \ directory to your path.\n\nAs the following steps show, you change your zsh\
    \ path by first identifying where your path statement is located, then editing\
    \ the file that contains it (Code Listing 8.6).\n\n# To change your zsh path:\n\
    \n+   1. more ~/.zshenv ~/.zprofile ~/.zshrc\n+   To begin, view your configuration\
    \ files (just the ones you can edit) in the order they’re executed.\n+   Look\
    \ through your system configuration files for a path statement. As Code Listing\
    \ 8.6 shows, it will look something like PATH=/bin:/usr/bin:/opt/bin. If you have\
    \ more than one path statement, find the last one executed.\n+   Remember that\
    \ different systems will have different configurations, so you might need to do\
    \ a little digging to find your personal path statement(s).\n\n```\njdoe@sulley\
    \ ~ $ toil .zshrc\n\n# See comment at top.\n\nif [[ -r ${ZDOTDIR:-$HOME}/.zshrc\
    \ ]] ;then\n  if [[ -f /usr/share/zsh/$ZSH_VERSION/zshrc_default ]] ;then\n  \
    \  source /usr/share/zsh/$ZSH_VERSION/zshrc_default\n  fi\nfi\n\nPATH=/bin:/usr/bin:/opt/bin\n\
    \njdoe@sulley ~ $\n```\n\nCode Listing 8.6 You will find your path statement in\
    \ your configuration files.\n\ncontinued on next page"
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Chapter 8


    +   2. cp .zshrc .zshrc_backup

    +   Make a backup of the file containing the path statement so that you can recover
    the file when problems or errors occur. See Chapter 2 if you need more information
    on copying files.


    +   3. vi .zshrc

    +   Use your favorite editor to open up the file whose path you want to change.


    +   4. PATH=$PATH:$HOME/scripts

    +   Add a new path statement immediately below the last path statement. In this
    example, $PATH inserts the current value of the environment variable into the
    environment variable definition and inserts it into the directory scripts in your
    home directory (Figure 8.1).


    +   5. Save and exit from your editor.

    +   Refer to Chapter 4 for help if you need it.


    +   6. su - yourid

    +   As you learned back in Chapter 3, this command starts a new log-in shell so
    you can test your changes before logging out.


    +   7. echo $PATH

    +   Display the current path environment variable. This should include the addition
    you just made. It''s there, right? (See Code Listing 8.7.)


    # Tips


    +   If you look through the path statements in your various configuration files,
    you might find a path statement that includes just a . (dot). For example, you
    might see something like PATH=/usr/bin:/usr/local/bin:.. The . adds your current
    directory, whatever it might be, to your path. Keep in mind, though, that it''s
    often safer not to have the current directory in the path so you don''t unintentionally
    run a program on which you''re working.


    ```

    jdoe@sulley ~ $ su - jdoe

    Password:

    jdoe@sulley ~ $ echo $PATH

    /usr/bin:/opt/bin:/home/jdoe/scripts/

    jdoe@sulley ~ $

    ```


    Code Listing 8.7 Test out your edits to the configuration files.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_174_0.png)


    Figure 8.1 You add or modify a zsh path statement in your editor.


    +   You can use grep to make it easier to find the configuration files that set
    your path. grep -i path *.z* is a good way to start.


    +   If you see something like path=($path $HOME/bin) in your configuration files,
    that''s okay. Just go ahead and use the syntax shown in this section on the following
    line anyway. It''s a feature of zsh that it understands about a bazillion different
    ways to express any single command.'
