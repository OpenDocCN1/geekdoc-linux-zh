- pgno: 136
  md: '# ✓ Tips


    +   - If you have multiple files to sort, you can use `sort file1 file2 file3
    > complete.sorted.file` and the output will contain the contents of all three
    files—sorted, of course.


    +   - You can sort fields in comma-delimited files by adding `-t` to the command.
    For example, `sort -t , +1 address.book` tells Unix to sort by the second field.
    The `-t` and following character (, ) indicate what character separates the fields—the
    comma in this case. If a character isn’t given, `sort` thinks that white space
    marks the boundaries between fields. The `+1` says to skip the first field and
    sort on the second one.


    +   - You can sort numerically, too, with `sort -n filename`. If you don’t use
    the `-n` flag, the output will be ordered based on the leftmost digits in the
    numbers—for example "1, 203, 50"—because the alphabetic sort starts at the left
    of the field.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Eliminating Duplicates with uniq


    If you’ve sorted files using the handy-dandy sort command, you might end up with
    results that have duplicates in them. Heck, you might have files with duplicates.
    At any rate, here’s how to find and work with them. As Code Listing 6.18 shows,
    you can get rid of duplicate lines by using the uniq command (short for “unique”)
    in conjunction with sort.


    # ✓ Tips


    +   - uniq finds only identical, adjacent (sorted) lines. For example, if you
    have both Jones and jones in your address book, uniq won’t identify either entry
    because they differ in capitalization.


    +   - You can also use the -d flag to specify that you want to see only the duplicate
    lines. For example, say you want to see all of the people who are in both your
    carpool file and your nightout file. You’d just use sort carpool nightout | uniq
    -d.


    # To eliminate duplicates with uniq:


    +   - sort address.book | uniq

    +   At the shell prompt, type sort and the filename, then type | uniq to pipe
    the output to uniq. The output of uniq will not contain any duplicated entries
    (Code Listing 6.18).


    ```

    [ejr@hobbes manipulate]$ more long.address.book

    Schmidt, Sven, 1 Circle Drive, Denver, CO, 80221, 555-555-8382

    Feldman, Fester, RR1, Billings, MT 62832, 285-555-0281

