- pgno: 338
  md: '# Becoming root with su


    Becoming root, assuming that you know the root password, is really quite easy.
    To do so, you just apply the su command (introduced in the Changing Your Identity
    with su section of Chapter 3), where you change to the root identity (Code Listing
    16.3).


    Once again, we’ll say: Being root on a Unix system carries with it a lot of responsibility.
    First, you must be extraordinarily careful about what you type and where you type
    it. Every system administrator out there has a horror story about wrecking (to
    a greater or lesser degree) a system through careless use of the root shell. We’ve
    done it, too. Second, you must be very responsible about what you do. You can
    read anything, see anything, watch anything, and change anything. You can, therefore,
    easily infringe upon the privacy of your users. Don’t.


    # To become root:


    +   1. su

    +   Enter su to become root.

    +   2. ******

    +   Enter the root password when prompted. Note that, after you succeed, you’ll
    see a different prompt (#). This is your confirmation that you succeeded and are
    now root (Code Listing 16.3).

    +   3. exit

    +   Use exit or Ctrl D to exit the root shell and become yourself again.


    ```

    jdoe ~/home/jdoe $ su

    Password:

    [root@sulley jdoe]# exit

    jdoe ~/home/jdoe $ su -

    Password:

    [root@sulley root]#

    ```


    Code Listing 16.3 Becoming root is remarkably easy.


    # Tips


    +   As with using su to become yourself (or another user), you can use su - to
    ensure that all of the root environment variables are set correctly. If you just
    use su without the hyphen, environment variables and the like will not be set
    for you, only the root identity. Which is more appropriate depends completely
    on your situation. If you get unexpected error messages (file not found, for example)
    with one approach, try the other.


    +   If you’re connecting to a system with telnet (as opposed to ssh), do not become
    root. The root password could be “sniffed” by malicious users, and if a hacker
    gains your root password, you’re potentially in big trouble. Your best choice
    is just to use ssh or to use sudo if ssh is simply impossible.


    +   Usually, you’ll have to log in to a system as you, and then become root. It’s
    a rare system that will allow you to log directly in remotely as root. Again,
    this is a security measure to help minimize the possibility of break-ins. Even
    if someone gets the root password on a system, they can’t act as root if they
    can’t also log in as a normal user.


    +   There are no real secrets on a Unix system. If you have something that must
    be a secret, you must encrypt it, or the root user (as well as other users) could
    know it.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Starting, Stopping, and Restarting Daemons


    As root, you can do anything on the system, but you shouldn’t have much to do
    at all. Generally, Unix (or Linux) systems are configured so that the programs
    that should be running all the time (like the Web server software, mail server
    software, or similar programs) are automatically started in the background when
    the system is booted. Then you, as root, need only handle crises and problems.
    (Ha! Easier said than done.)


    That said, sometimes you’ll need to start or stop these daemons (programs running
    in the background—see Chapter 9 for details). Say, for example, that you get an
    email from one of the system users complaining that the Web server (or, technically,
    the httpd daemon) isn’t running. As the system administrator, you’ll have to start
    it.


    # To start a daemon:


    +   1. ps -ef | grep httpd


    Verify that the Web server really isn’t running. Sometimes users are wrong. If
    you see lines that list httpd (other than the one that reports the command you’re
    running), httpd is active and doesn’t need to be started. The problem may lie
    elsewhere.


    continued on next page'
  merge: -1
  img_proc: true
- pgno: 340
  md: '2. cd /etc/init.d

    Change to the directory containing the generic init (for initialization) scripts.
    This directory is likely /etc/init.d or /etc/rc.d/init.d/, as Code Listing 16.4
    shows.


    3. sudo ./httpd start

    Use sudo ./httpd (to be absolutely sure that you''re running httpd from the current
    directory and not a program of the same name from elsewhere on the system) and
    start. The httpd in the /etc/init.d directory is a script to start the daemon
    with the appropriate options.


    4. ps -ef | grep httpd

    Verify that the Web server now is running.


    # Tips


    +   - To stop a daemon, use the same process, but use stop (as in, sudo ./httpd
    stop) to stop a daemon cleanly.

    +   - Sometimes you might need to restart a daemon. You could stop it, and then
    start it, but in many cases you could also use restart or reload (as in, sudo
    ./httpd restart).

    +   - Be careful about stopping or restarting daemons with which you are not familiar.
    Unix has a lot of interdependencies that are often not clear, and stopping something
    you think you don''t need might have unexpected consequences.


    ```

    [jdoe@frozzy jdoe]$ ps -ef | grep httpd

    jdoe 656 21562 0 04:51 pts/5 00:00:00 grep httpd

    [jdoe@frozzy jdoe]$ cd /etc/init.d

    [jdoe@frozzy init.d]$ sudo ./httpd start

    Password:

