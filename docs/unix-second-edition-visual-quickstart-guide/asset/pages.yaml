  md: 'The following lines, one per logged-in user, show


    +   - The log-in name

    +   - The tty name (the connection to the host)

    +   - The remote host name

    +   - The log-in time

    +   - Current idle time (that is, the time since a key on the keyboard was touched)

    +   - JCPU (job CPU time, or the total processing time for jobs on the current
    connection, which is the tty, for those into the jargon)

    +   - PCPU (process CPU time, or the processing time for the current process)

    +   - The command line of the current process


    Whew! As you can see from Code Listings 7.11 and 7.12, different systems'' w commands
    produce slightly different (but similar) output.


    Tip


    +   - Use w with grep to find information (slightly more abbreviated) about a
    specific user. For example, w | grep ejr gives limited information, but just about
    a specific user. See Chapter 1 for more information about piping commands.


