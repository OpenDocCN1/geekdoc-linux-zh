- pgno: 122
  md: '# Counting Files and Their Contents with wc


    One of Unix''s handiest capabilities lets you count files and their contents.
    For example, you can count the number of files in a directory, or you can count
    the number of words or lines in a file. You do this counting with the wc command,
    as shown in Code Listing 6.1.


    # To count words using wc:


    +   - wc -w honeydo

    +   At the shell prompt, type wc -w (for words) and the name of the file in which
    you want to count the words. wc will oblige, as shown in Code Listing 6.1.


    # To count lines with wc:


    +   - wc -l honeydo

    +   Use wc -l followed by the filename to count the lines in the file (Code Listing
    6.2). This is useful for poetry or for things like lists (e.g., our "honey-do"
    list always has a minimum of 73 items on it).


    # Tips


    +   - You can find out how many files you have in a directory by using ls l wc
    -l to count the regular files and directories, or ls -A l wc -l to count all files
    and directories (except for the . and .. directories).

    +   - You can also find out how many bytes a specific file takes up using wc -c.
    Or, you can use wc with no flags at all to get the lines, words, and bytes.


    ```

    [e]r@hobbes manipulate]$ wc -w honeydo

    235 honeydo

    ```


    Code Listing 6.1 Use wc -w to count the words in a file. The "honey-do" list in
    this example is quite a way from being the length of a novel.


    ```

    [e]r@hobbes manipulate]$ wc -l honeydo

    85 honeydo

    ```


    Code Listing 6.2 With 85 separate items in the list, however, it''s plenty long
    enough.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Viewing File Beginnings with head


    Using head, as shown in Code Listing 6.3, you can find out in a jiffy what’s in
    a file by viewing the top few lines. This is particularly handy when you’re browsing
    file listings or trying to find a specific file among several others with similar
    content.


    # To view file beginnings with head:


    +   - head honeydo

    +   At the shell prompt, type head followed by the filename. As Code Listing 6.3
    shows, you’ll see the first ten lines on the screen. Notice that “lines” are defined
    by hard returns, so a line could, in some cases, wrap to many screen lines.


    # To view a specified number of lines:


    +   - head -20 honeydo

    +   Add -20 (or whatever number of lines you want to view) to view a specific
    number of lines.


    # To view the beginnings of multiple files:


    +   - head honey* | more

    +   You can view the tops of multiple files by piping head (plus the filenames)
    to more. Note that head conveniently tells you the filename of each file, as shown
    in Code Listing 6.4


    ```

    [ejr@hobbes manipulate]$ head honeydo

    Take garbage out

    Clean litter box

    Clean diaper pails

    Clean litter box

    Mow lawn

    Edge lawn

    Clean litter box

    Polish swamp cooler

    Buff garage floor

    Clean litter box

    [ejr@hobbes manipulate]$

    ```


    # Code Listing 6.3 Use head to look at just the top of a file, which gives you
    a manageable view of the file.


    ```

    [ejr@hobbes manipulate]$ head honey* | more

    ==> honeyconsider <==

    Mother-in-law visits next week

    Cat mess in hall to clean up

    Cat mess in entry to clean up

    Cat mess in living room to clean up

    Toddler mess in family room to clean up

    Cat and toddler mess in den to clean up

    IRS called again today

    Neighbors on both sides looking for donations for the annual fund drive

    Boss called last Friday and said it’s urgent

    ==> honeydo <==

    Take garbage out

    Clean litter box

    Clean diaper pails

    Clean litter box

    Mow lawn

    Edge lawn

    Clean litter box

    Polish swamp cooler

    Buff garage floor

    ```


    # Code Listing 6.4 head, with the help of more, lets you see the beginnings of
    several files in sequence.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Viewing File Endings with tail


    Occasionally, you might also need to use tail, which displays the last lines of
    a file. tail is particularly handy for checking footers or for updating information
    in a footer (see Code Listing 6.5). Just as with head (described in the previous
    pages), tail offers several options for viewing files.


    # To view file endings with tail:


    +   - tail honeydo


    At the shell prompt, type tail followed by the filename. As Code Listing 6.5 shows,
    you''ll see the last ten lines on the screen.


    # To view a specified number of lines:


    +   - tail -15 honeydo


    Here, all you do is add a specific number of lines you want to view (-15).


    # To view the endings of multiple files:


    +   - tail honey* | more


    Pipe the tail command and the files (multiple files indicated with *) to more
    (Code Listing 6.6).


    # Tip


    +   - head and its counterpart, tail, are great for splitting long files. Use
    wc -l to count the lines. If the file has 500 lines, but you care about only the
    beginning and ending lines, then type head -25 filename > newfilename to put the
    first 25 lines of the file into a new file. Then do the same with tail to put
    the last 25 lines of the file into another new file.


    ```

    [ejr@hobbes manipulate]$ tail honeydo

    Empty diaper pails

    Take garbage out.

    -End of today''s list-


    Buy more garbage bags

    Get cleaning supplies at store

    Take cat to vet

    Fix lawnmower


    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.5 tail lets you check out just the end of files.


    ```

    [ejr@hobbes manipulate]$ tail honey* | more

    ==> honeydo ===

    Cat mess in entry to clean up

    Cat mess in living room to clean up

    Toddler mess in family room to clean up

    Cat and toddler mess in den to clean up

    IRS called again today

    Neighbors on both sides looking for donations

    for the annual fund drive

    Boss called last Friday and said it''s urgent

    -End of today''s list-


    ==> honey* ===

    Empty diaper pails

    Take garbage out

    -End of today''s list-


    Buy more garbage bags

    Get cleaning supplies at store

    Take cat to vet

    Fix lawnmower


    --More--

    ```


    Code Listing 6.6 Use tail with more to see the ends of multiple files.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Finding Text with grep


    You can search through multiple files for specific strings of characters and then
    view the list of matching files onscreen. You do this using the grep command (which
    stands for "global regular expression print," a once useful and now rather arcane
    ed or vi command), as shown in Code Listing 6.7. As we’ll show you, you can add
    several flags to grep to get slightly different results.


    # To find text strings with grep:


    +   grep bucket limericks

    +   At the shell prompt, type grep, the text you’re trying to locate (in this
    case, bucket), and the file you’re searching in (here, limericks). grep will return
    all lines in the file that contain the specified string, as shown in Code Listing
    6.7.


    +   grep -5 bucket limericks

    +   You can specify that a number of lines (say -5) on either side of the found
    text string should also be displayed. Sometimes you can’t tell what you need to
    know with just the line that contains your search string, and adding lines around
    it can help give you a context (see Code Listing 6.8). Note that this option isn’t
    available on all versions of grep, but it’ll work for most.


    +   grep -c Nantucket limericks

    +   By adding the -c flag, you can find out how many times a text string appears
    in a file.


    +   grep -v Nantucket limericks

    +   Or, with the -v flag, you can find all of the lines that do not contain the
    specified string.


    +   grep -i nantucket limericks

    +   With the -i flag, you can search without case-sensitivity. Here any line with
    nantucket or Nantucket or nAntuCket would be found.


    ```

    [ejr@hobbes manipulate]$ grep bucket limericks

    Who carried his lunch in a bucket,

    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.7 Use grep to see all occurrences of a specific string in a file.


    ```

    [ejr@hobbes manipulate]$ grep -5 bucket

    → limerick

    he strummed and he hummed,

    and sang dumdeedum,

    But him o musician...whoda thunk it?


    There once was a man from Nantucket,

    Who carried his lunch in a bucket,

    Said he with a sigh,

    As he ate a whole pie,

    If I just had a donut I’d dunk it.


    A nice young lady named Debbie,

    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.8 grep can show the context around instances of the string as well.


    # Tips


    +   Use the -n flag (for example, grep -n string file) to print each found line
    with a line number.


    +   You can use grep with multiple file names, such as in grep Nantucket lim*
    or grep Nantucket lim* poetry humor.


    +   If you want to get creative, you can look for spaces as well, but you need
    to use quotes, like grep "from Nantucket" limerick*.


    +   Win nerdy bar bets by knowing the heritage of grep.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Using Regular Expressions with grep


    In addition to using grep to search for simple text strings, you can also use
    grep to search for regular expressions. Regular expressions are kind of like fancy
    wildcards, where you use a symbol to represent a character, number, or other symbol.
    With regular expressions, you can search for different parts of files, such as
    the end of a line or a text string next to another specified text string. Table
    6.1 lists some of the more common regular expressions.


    ```

    [e]r@hobbes manipulate]$ grep .logan limerick

    Worked hard all day on a slogan,

    You see, the slogan''s still brogan.

    [e]r@hobbes manipulate]$

    ```


    Code Listing 6.9 Use grep with regular expressions to create fancy wildcard commands.


    # To use regular expressions with grep:


    +   - grep .logan limerick


    Type grep followed by the regular expression and the filename. Here, we''ve used
    the regular expression .logan to find all instances of "logan" that are preceded
    by a single character (Code Listing 6.9). Note that this usage of a . to match
    a single character closely resembles the ? wildcard used with ls.


    You could also use multiple periods for specific numbers of characters. For example,
    to find "Dogbert" and "Dilbert," you might use grep D..bert plagiarized.sayings.


    In some cases, you may need to structure the search string slightly differently,
    depending on the expression you''re using and the information you''re looking
    for. Check out the additional examples in Table 6.1 for more information.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Tips


    +   - "Regular expression" is often abbreviated as "regexp" in Unix documentation
    and Internet discussions.

    +   - The command egrep is closely related to grep, adding a little more flexibility
    for extended regular expressions, but it fundamentally works the same. On many
    systems the grep command is really egrep—when you type in either one, you''re
    really running egrep.

    +   - If you''re searching for whole words through large files, use fgrep for
    faster searching. It uses the same general syntax as grep, but searches only for
    whole words (not regular expressions) so goes much faster.

    +   - See Chapter 1 for details about wildcards.


    # Table 6.1


    # Regular Expressions, Examples, and Explanations


    | REGULAR EXPRESSION | FUNCTION | EXAMPLE | EXPLANATION |

    |---|---|---|---|

    | . | Matches any character | b.*rry | This finds all instances of "berry" or
    "barry." |

    | * | Matches zero or more instances of the preceding item, so a*b would find
    "b" as well as "ab" and "aaab," but not "acb" | grep "s*day" /home/ejr/schedule
    | Here, the * matches zero or more of the items that immediately precede the *.
    |

    | ^ | Matches only instances of the string at the beginning of a line | grep "^Some"
    sayings | With the ^, you specify that the search string must appear at the beginning
    of a line. The example would find a line beginning with "Some" but not one beginning
    with "Read Some." |

    | $ | Matches only instances of the string at the end of a line | grep "ach$"
    sayings | With grep ach$ sayings, you could find all lines in the file sayings
    that end with "ach." |

    | \ | Escapes (quotes) the following character—so you can search for literal characters
    like * or $ that are also operators | grep "\*" sayings | grep "* sayings searches
    for all instances of * in the sayings file. The \ tells grep to interpret the
    * literally, as an asterisk character, rather than as a wildcard. |

    | [ ] | Matches any member of the set, like [a-z], [0-6], or [321] (three or two
    or one) | grep "number[0-9]" specifications | Use square brackets ([ ]) to enclose
    a set of options. Here, number[0-9] would match all instances of number 1, number
    2, number 3, and so forth in the file called specifications. |'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Using Other Examples of Regular Expressions


    In the previous section, we showed you how to use the grep command to search with
    regular expressions. You can, though, do other neat finding tasks, as we’ll discuss
    in this section.


    # To find lines with specific characteristics:


    +   - `grep ''^Nantucket'' limerick`

    +     Here, we use grep to find all of the lines in the limericks that start with
    Nantucket, if there are any.


    +   - `grep ''Nantucket$'' limerick`

    +     Similarly, you can find the lines that end with Nantucket.


    +   - `grep ''^[A-Z]'' limerick`

    +     Or, you can find the lines that start with a capital letter by including
    the [A-Z] regular expression.


    +   - `grep ''^[A-Z,a-z]'' limerick`

    +     Here, you can find all the lines that start with any letter, but not a number
    or symbol. Fancy, huh?


    # Tip


    +   - You can also use regular expressions with awk and sed. See Making Global
    Changes with sed and Changing Files with awk in this chapter for details.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Making Global Changes with sed


    Another handy command you can use is sed, which lets you make multiple changes
    to files, without ever opening an editor. For example, as a new Webmaster, you
    might use sed to change all occurrences of the previous Webmaster''s email address
    to your own. As we''ll show in this section, you can use sed to make global changes
    within documents.


    # To make global changes with sed:


    ```

    sed ''s/oldaddr@raycomm.com/newaddr@raycomm.com/g'' address.htm > address-new.htm

    ```


    Type sed, followed by


    +   ▲ A single quote ('')

    +   ▲ A leading "s"

    +   ▲ A slash (/)

    +   ▲ The text you want to replace (oldaddr@raycomm.com)

    +   ▲ Another slash (/)

    +   ▲ The replacement text (newaddr@raycomm.com)

    +   ▲ Another single quote ('')

    +   ▲ Yet another /

    +   ▲ g, which tells sed to apply the change globally. (If you omit the g, only
    the first occurrence on each line will be changed.)

    +   ▲ The name of the file in which the changes should be made (address.htm)


    You can redirect the output to a new filename (see Code Listing 6.10) or pipe
    it to another command entirely. You cannot redirect to the same filename or you''ll
    end up with no content in your file.


    ```

    [ejr@hobbes manipulate]$ sed ''s/oldaddr@raycomm.com/newaddr@raycomm.com'' /g
    address.htm > address-new.htm

    [ejr@hobbes manipulate]$ head address-new.htm

    <BODY BACKGROUND="/images/background.gif" BGcolor="#FFFFFF" TEXT="#000000" LINK="#000908"
    VLINK="#000000" ALINK="#ff0000">

    <P>

    Please send all comments to <A HREF="mailto:newaddr@raycomm.com">newaddr@raycomm.com</A>.

    </P>

    <TABLE BORDER=0>

    <TR>

    <TD WIDTH="150" VALIGN=TOP>

    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.10 You can use sed to make changes throughout files, such as the
    address change here.


    # ✓ Tips


    +   ■ You can have sed zip through multiple documents. See Chapter 10 for information
    on how to make a shell script with a loop.


    +   ■ Because sed commands can be long and unwieldy, it might be helpful to save
    the commands in a separate text file (so you don''t have to retype them). For
    example, if you saved the command s/oldaddr@raycomm.com/newaddr@raycomm.com/g
    in a file called script.sed, you could issue sed -f script.sed address.htm > address-new.htm
    to run the sed commands from the script.sed file. You can have as many commands
    as you want in your script.sed file.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Changing Files with awk


    While sed is line-oriented and lets you fiddle and diddle to your heart’s content,
    awk is field-oriented and is ideal for manipulating database or comma-delimited
    files. For example, if you have an address book file, you can use awk to find
    and change information in fields you specify, as in Code Listing 6.11. In the
    following steps, we’ll show you a sampling of the things you can do using awk
    to modify, in this example, an address book file.


    # To change files with awk:


    +   1. awk ''{ print $1 }'' address.book

    +   At the shell prompt, use awk ''{ print $1 }'' address.book file to look at
    the address.book file and select (and send to standard output) the first field
    in each record (line). More specifically, starting from the inside out


    > $1 references the first field in each line. Unless you specify otherwise, awk
    assumes that a space separates the fields, so the first field starts at the beginning
    of the line and continues to the first space.


    > {} contain the awk command, and the quotes are necessary to tie the awk command
    together (so the first space within the command isn’t interpreted by the shell
    as the end of the command). See Code Listing 6.11.


    +   2. awk -F '', '' ''{ print $1 }'' address.book

    +   The -F flag tells awk to use the character following it—in this case, a comma
    (, )—as the field separator. This change makes the output of the command a little
    cleaner and more accurate. If you were working with /etc/passwd, you’d use -F:
    to specify that the : is the field separator.


    ```

    [ejr@hobbes manipulate]$ awk ''{ print $1 }'' address.book

    Schmidt,

    Feldman,

    Brown,

    Smith,

    Jones,

    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.11 awk lets you access individual fields in a file.


    # De-what?


    A delimited file uses a specific character to show where one bit of information
    ends and another begins. Each piece of information is a separate field. For example,
    a file that contains "John, Doe, Thornton, Colorado" is comma-delimited, sporting
    a comma between fields. Other files, such as the /etc/passwd file, use a colon
    (:) to separate the fields. Just about any symbol that’s not used in the content
    could be used as a delimiter.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '```

    [ejr@hobbes manipulate]$ awk -F '', '' '' { print $2 "\n" $1 "\n" $7 } '' address.book
    > phone.list

    [ejr@hobbes manipulate]$ more phone.list

    Sven Schmidt 555-555-8382

    Fester Feldman

    John Brown 918-555-1234

    Sally Smith 801-555-8982

    Kelly Jones 408-555-7253

    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.12 With a little more tweaking, awk lets you do a lot of processing
    on the files to get just the information you need.


    # 3. awk -F '', '' ''{ print $2 " " $1 " " $7 }'' address.book > phone.list


    With this code, you can pull specific fields, in an arbitrary order, from your
    database. Although it looks complex, it''s just one additional step from the previous
    example. Rather than printing a single field from the address book, we''re printing
    field 2, then a space, then field 1, then a space, then field 7. The final bit
    just redirects the output into a new file. This example would produce a list of
    names and phone numbers, as shown in Code Listing 6.12.


    # 4. awk -F '', '' ''/CA/ { print $2 $1 $7 }'' address.book > phone.list


    You can also specify a matching pattern. Here, we added /CA/ to search and act
    on only the lines that contain CA, so only those lines will be in the phone.list
    file.


    # ✓ Tips


    +   - You can load awk scripts from a file with awk -f script.awk filename. Just
    as with sed, this keeps the retyping to a minimum, which is helpful with these
    long and convoluted commands. Refer to Chapter 10 for more details about scripting.


    +   - Take a glance at Sorting Files with sort later in this chapter and consider
    piping your awk output to sort. Let Unix do the tedious work for you!'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Comparing Files with cmp


    Suppose you’ve been working on the dearliza file and you want to know how it differs
    from the dearhenry file. Using cmp, you can compare the two files as shown in
    Code Listing 6.13.


    # To compare files with cmp:


    +   - cmp dearliza dearhenry


    At the shell prompt, type cmp followed by both filenames. As Code Listing 6.13
    shows, these two files are not the same.


    If the files are identical, you’ll find yourself back at the shell prompt with
    no comment from cmp. If both files are identical until one of them ends—that is,
    say, the first 100 lines are the same, but one continues and the other ends—then
    you’ll see an EOF (end of file) message, as in Code Listing 6.14.


    # Tips


    +   - You can find out other ways that files differ using diff, as described in
    the next section, Finding Differences in Files with diff.


    +   - Unix provides an exit status message that you can use to get more information
    about how the program stopped and why. See Using Advanced Redirection in Chapter
    17 for more information.


    ```

    [ejr@hobbes manipulate]$ cmp dearliza dearhenry

    *dearhenry

    dearliza dearhenry differ: char 20, line 2

    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.13 cmp gives just the facts about the first difference between
    two files.


    ```

    [ejr@hobbes manipulate]$ cmp limerick *limericks

    cmp: EOF on limerick

    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.14 cmp also tells you if the files matched until one ended (EOF
    stands for "end of file").'
  merge: -1
  img_proc: true
- pgno: 133
  md: '```

    [ejr@hobbes manipulate]$ diff dearliza dearhenry

    2,3c2,3

    < Dear Liza,

    < There''s a hole in my bucket, dear Liza,

    <dear Liza, dear Liza.

    > Dear Henry,

    > Please fix it dear Henry, dear Henry, dear

    > "Henry.

    5,6c5,6

    < Henry

    > Liza

    > PS, you forgot your toolbox last time.

    [ejr@hobbes manipulate]$

    ```


    # Code Listing 6.15 diff tells you all you ever wanted to know about the differences
    between two files but not in an easily readable manner.


    +   You can also use diff to find out which files are in one directory but not
    another. Just type diff followed by the names of the two directories; for example,
    diff /home/ejr/Directory ~/home/ejr/Newdirectory.


    +   You might also check out the next section. Finding Differences in Files with
    sdiff, for yet another way to compare files.


    # Finding Differences in Files with diff


    In addition to using cmp to find out how files differ, you can also use diff.
    This command tells you specifically where two files differ, not just that they
    differ and at which point the differences start (see Code Listing 6.15).


    # To find differences with diff:


    +   diff dearliza dearhenry

    +   Type diff, followed by both filenames. The diff output, as in Code Listing
    6.15, shows lines that appear only in one file or the other. The lines from file
    1 are indicated with <, while the lines from file 2 are indicated with >. Above
    each line are the affected line numbers in the first file, then d, a, or c, then
    the corresponding line numbers from the second file:


    +   d means that the line would have to be deleted from file 1 to make it match
    file 2.


    +   a means that text would have to be added to file 1 to match file 2.


    +   c means that changes would have to be made to the line for the two files to
    match.


    # Tips


    +   If you''re comparing email messages or other less-structured documents, you
    might consider adding the flags -i (case insensitive), -B (ignore blank lines),
    or even -w (ignore spaces and tabs) to avoid cluttering your results with unimportant
    differences. For example, you could use diff -ibw file1 file2 to find all differences
    between two files except those involving blank lines, spaces, tabs, or lowercase/uppercase
    letters.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Finding Differences in Files with sdiff


    Yet another way to compare files is to use sdiff, which presents the two files
    onscreen so that you can visually compare them (see Code Listing 6.16).


    # To compare files with sdiff:


    +   - sdiff dearliza dearhenry


    At the shell prompt, type sdiff and the filenames to compare the two files. The
    output, as shown in Code Listing 6.16, presents each line of the two files side
    by side, separating them with


    +   - ▲ (Nothing) if the lines are identical

    +   - ▲ < if the line exists only in the first file

    +   - ▲ > if the line exists only in the second file

    +   - ▲ | if they are different


    # ✓ Tips


    +   - If most of the lines are the same, consider using the -s flag so the identical
    lines are not shown. For example, type sdiff -s dearliza dearhenry.

    +   - If the output scoots by too fast to read, remember that you can pipe the
    entire command to more, as in sdiff dearliza dearhenry | more.


    ```

    [ejr@hobbes manipulate]$ sdiff dearliza dearhenry

    July 25, 1998 July 25, 1998

    Dear Liza, Dear Henry,

    There''s a hole in my bucket, dear Liza, dear Liza, dear Henry.

    Liza. I Please fix it dear Henry, dear Henry.

    Yours, Yours,

    Henry | Liza

    | PS, you forgot your toolbox last time.

    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.16 sdiff puts the files side by side, so you can easily see the
    differences.'
