- pgno: 181
  md: "# Adding to Your bash Path\n\nOne of the most useful changes you can make to\
    \ your environment is adding to the default path, which is determined by the path\
    \ statement. The path statement tells the shell where to look for commands, scripts,\
    \ and programs. That is, if you issue a command, the path statement tells the\
    \ system to look for that command in each of the named directories in a specific\
    \ order.\n\nBe sure not to remove anything from your path unless you really know\
    \ what you're doing, but feel free to add as many additional directories as you\
    \ want to it.\n\nAs the following steps show, you change your bash path by first\
    \ identifying where your path statement is located, then editing the file that\
    \ contains it (Code Listing 8.11).\n\n# To change your bash path:\n\n+   1. more\
    \ ~/.bash_profile ~/.bashrc\n+   To begin, view your configuration files (just\
    \ the ones you can edit) in the order they're executed.\n+   Look through your\
    \ system configuration files for a path statement. As Code Listing 8.9 shows,\
    \ it'll look something like PATH=/bin:/usr/bin:/usr/local/bin.\n+   If you have\
    \ more than one path statement, find the last one executed.\n+   Remember that\
    \ different systems will have different configurations, so you might need to do\
    \ a little digging to find your personal path statement(s).\n\n+   2. cp .bash_profile\
    \ .bash_profile_backup\n+   Make a backup of the file containing the path statement\
    \ so that you can recover if you make mistakes. See Chapter 2 if you need more\
    \ information on copying files.\n\n```\n[ejr@hobbes ejr]$ more ~/.bash_profile\n\
    ... ~/.bashrc\n................\n/home/ejr/.bash_profile\n................\n#\
    \ .bash_profile\n\n# Get the aliases and functions\nif [ -f ~/.bashrc ]; then\n\
    \  . ~/.bashrc\nfi\n\nPATH=/bin:/usr/bin:/usr/local/bin\n\n# User-specific environment\
    \ and startup programs\n\nPATH=$PATH:/usr/local/games\nENV=$HOME/.bashrc\nUSERNAME=\"\
    \"\n\nexport USERNAME ENV PATH\n\n-More-(Next file: /home/ejr/.bashrc)\n```\n\n\
    Code Listing 8.11 Your first step is finding out the location of your path statement(s)."
  merge: -1
  img_proc: true
- pgno: 182
  md: '# 3. vi .bash_profile


    Use your favorite editor to open up the file in which you’ll be changing the path.


    # 4. PATH=$PATH:$HOME/bin


    Add a new path statement immediately below the last path statement. In this example,
    $PATH inserts the current value of the environment variable definition and inserts
    it into the directory bin in your home directory (Figure 8.3).


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_182_0.png)


    # 5. Save the file and exit from your editor.


    Refer to Chapter 4 for help if you need it.


    # 6. su - yourid


    As you learned back in Chapter 3, this command starts a new log-in shell so you
    can test your changes before logging out.


    # 7. echo $PATH


    Display the current path environment variable. This should include the addition
    you just made. It’s there, right? (See Code Listing 8.12.)


    # Tips


    +   - If you look through the path statements in your various configuration files,
    you might find a path statement that includes just a . (dot). For example, you
    might see something like PATH=/usr/bin:/usr/local/bin:.. The . adds your current
    directory, whatever it might be, to your path. Keep in mind, though, that it’s
    often safer not to have the current directory in the path so you don’t unintentionally
    run a program on which you’re working.


    +   - You can use grep to make it easier to find the configuration files that
    set your path. grep PATH .b* is a good way to start, and grep PATH /etc/* is another
    goodie.


    ```

    [ejr@Hobbes ejr]$ echo $PATH

    /bin:/usr/bin:/usr/local/bin:/usr/bin/X11:/usr/X11R6/bin:/usr/local/games:/home/ejr/bin

    [ejr@Hobbes ejr]$

    ```


    Code Listing 8.12 Using echo, you can verify that your new path statement exists.


    Your system configuration files will be much less confusing later on if you keep
    all related changes together. Therefore, you should keep the path statements together,
    rather than just plug an entirely random PATH statement into your configuration
    files.'
