- pgno: 201
  md: '# Running Scripts AND Programs


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_201_0.png)


    Throughout this book, you’ve been running scripts and programs by typing in commands
    and pressing Enter. The commands zoom along to the Unix system, which responds
    by obediently doing whatever the command or script dictates. In doing this, you
    run the commands and scripts—called jobs in this context—right then and there.


    You can also run jobs at specified times; run them on a schedule you set up, or
    start, stop, or delete them as you choose. Plus, you can find out when they are
    scheduled to run, time how long they take, or monitor them as they run. Sound
    cool? Great! Let’s take a look.


    # Chapter Contents


    +   - Running commands

    +   - Scheduling one-time jobs

    +   - Scheduling regularly occurring jobs

    +   - Suspending jobs

    +   - Checking job status

    +   - Running jobs in the background

    +   - Running jobs in the foreground

    +   - Controlling job priority

    +   - Timing jobs

    +   - Finding running processes

    +   - Deleting processes'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Running a Command


    Throughout this book, you’ve been practicing running a single command. Unix doesn’t
    really care if you’re running a built-in command that came with the system, a
    program you installed later, or a script your best friend wrote—it’s all the same
    to Unix. Code Listing 9.1 shows some options on running a command.


    # To run a command:


    +   - ls


    At the shell prompt, type the command and press Enter


    # To run a specific command:


    +   - /home/jdoe/scripts/ls


    It’s certainly possible that you would want to write a script that would list
    the files in your directory in a special way—for example, a script to list the
    files and to save the listing into a new file for later reference. (You might
    name it something else but could certainly call it ls if you want to.) To run
    the specific script, enter the whole path to the script (so Unix doesn’t just
    run the first one it finds in your path). See Chapter 8 for more about path statements.


    # Tips


    +   - You can combine commands on the same line, as you’ve seen earlier in this
    book. Just use a ; to separate the commands, and you’re set. For example, you
    could do ls; pwd to list files and show the current directory.


    ```

    [jdoe@frazz Project]$ ls

    keep keeper.jpg kept kidder.txt kiddo

    + kidnews kidneypie kids kidupdate

    [jdoe@frazz Project]$ /bin/ls

    keep keeper.jpg kept kidder.txt kiddo

    + kidnews kidneypie kids kidupdate

    [jdoe@frazz Project]$ /home/jdoe/scripts/ls

    keep keeper.jpg kept kidder.txt kiddo

    + kidnews kidneypie kids kidupdate

    You listed these files.

    [jdoe@frazz Project]$ ls ; pwd

    keep keeper.jpg kept kidder.txt kiddo

    + kidnews kidneypie kids kidupdate

    /home/jdoe/Project

    [jdoe@frazz Project]$

    ```


    Code Listing 9.1 To run a script, command, or program, just enter the name or
    the path and the name at the shell prompt.


    +   - If you use a && to combine commands, the system will run both in sequence
    but run the second only if the first succeeds. For example, you could use mv todolist
    todolist.done && touch todolist to move your to-do list to a different file and
    create a new to-do list. If the first command fails (for example, because you
    don’t have permission to create a new file), the second command won’t run.'
  merge: -1
  img_proc: true
- pgno: 203
  md: "![](img/6ffd6bb320ccf354f5a4d57c9d95190d_203_0.png)\n\n**Figure 9.1** To schedule\
    \ a one-time job, all you have to do is specify the time and the job to run.\n\
    \n# Scheduling One-Time Jobs with at\n\nOccasionally, you may need to schedule\
    \ jobs to run one time, at a time you designate. For example, you could schedule\
    \ an email message to yourself, reminding you to attend a staff meeting. Or, you\
    \ could schedule a meeting reminder for your co-workers that includes a meeting\
    \ agenda. You can schedule these and other one-time jobs using at, which lets\
    \ you designate a time at which a job (or jobs) should run. **Figure 9.1** demonstrates\
    \ scheduling an email about that all-important staff meeting.\n\n# To schedule\
    \ a one-time job with at:\n\n+   1. `at 12:01 1 Jan 2004`\n+   \n+      To begin,\
    \ specify when you want the job to run, using at plus a time statement (Figure\
    \ 9.1). In this example, we specify a time, month, date, and year, although you\
    \ can create a variety of other time statements, like these:\n+   \n+      - at\
    \ noon tomorrow\n+      - at 01/01/99\n+      - at 3:42am\n+      - at now + 3\
    \ weeks\n+      - at teatime\n+   \n+      Yes, teatime is a valid option. It's\
    \ at 4 p.m., by the way.\n\n+   2. `mail -s \"Staff Meeting at 8:30am\"`\n+  \
    \    `-> ejr <~ /agenda`\n+   \n+      Specify the job. In this case, it sends\
    \ email to the user (ejr), specifies the subject \"Staff Meeting at 8:30am,\"\
    \ and sends the contents of the file called agenda. See Chapter 11 for the full\
    \ scoop on using mail.\n\n+   3. `Ctrl D`\n+   \n+      Indicate that you've finished\
    \ issuing commands."
  merge: -1
  img_proc: true
