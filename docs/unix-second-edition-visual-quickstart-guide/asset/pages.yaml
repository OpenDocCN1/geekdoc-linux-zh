- pgno: 216
  md: "# Tips\n\n+   - You can find out what processes other people are running by\
    \ typing `ps -a` at the shell prompt and what processes the system is running\
    \ (also called daemons) with `ps -ax`. The `ps -ef` variant is usually pretty\
    \ useful for us.\n+   \n+   - You can sometimes, depending on the system, get\
    \ a broader look at currently running processes by typing `ps -a -f`. The `f`\
    \ flag indicates “forest” view, which lets you see not only the processes, but\
    \ also how they relate to each other, as shown in **Code Listing 9.13**.\n+  \
    \ \n+   - The results `ps` offers vary greatly depending on the Unix flavor you’re\
    \ using. Type `man ps` at the shell prompt to find out more about your specific\
    \ `ps` capabilities.\n\n```\n```text\n$ ps -a -forest\n  PID TT  STAT TIME COMMAND\n\
    15043 p0  S     0:00 /bin/login -h calvin.raycomm.com -p\n15044 p0  0:01  \\_\
    \ -bash\n16344 p0  T N 0:00  \\_ sh ./slowscript\n16345 p0  T N 0:00      \\_\
    \ sleep 50\n16449 p0  R     0:00      \\_ ps f\n15911 p1  S     0:00 /bin/login\
    \ -h calvin.raycomm.com -p\n15912 p1  S     0:01  \\_ -bash\n16216 p1  T     0:00\
    \      \\_ telnet\n16217 p1  T     0:00      \\_ lynx http://www.raycomm.com/\n\
    16267 p1  T     0:00      \\_ man telnet\n16268 p1  T     0:00          \\_ sh\
    \ -c (cd /usr/man ; (echo -e '.pl 1100i'; cat\n16269 p1  T     0:00          \
    \    \\_ sh -c (cd /usr/man ; (echo -e '.pl 1100i'; cat\n16270 p1  T     0:00\
    \                  \\_ sh -c (cd /usr/man ; (echo -e '.pl 1100i'; cat /usr/man/man1/telnet.1\n\
    16271 p1  T     0:00                      \\_ /usr/bin/gtbl\n16272 p1  T     0:00\
    \                      \\_ sh -c (cd /usr/man ; (echo -e '.pl 1100i'\n$\n```\n\
    ```\n\n**Code Listing 9.13** The forest view gives you a broader look at running\
    \ processes."
