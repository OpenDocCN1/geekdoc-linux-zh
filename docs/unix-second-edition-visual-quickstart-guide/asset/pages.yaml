- pgno: 210
  md: "# Running Jobs in the Background with bg\n\nIf you're running a job that doesn't\
    \ require input from you, consider running it in the background using bg (Code\
    \ Listing 9.7). In doing so, you can keep the program running while working on\
    \ other Unix activities at the same time.\n\n# To run jobs in the background with\
    \ bg:\n\n+   1. `jobs`\n+   \n+      At the shell prompt, type `jobs` to see the\
    \ list of all jobs, running or stopped. Note the job numbers on the left.\n+ \
    \  \n+   2. `bg %1`\n+   \n+      Type `bg` followed by `%` and the number of\
    \ the job you want to run in the background (Code Listing 9.7).\n\n# ✔ Tips\n\n\
    +   ▪ If you want to put the most recently suspended job into the background,\
    \ just type `bg` (without the number) at the prompt.\n+   \n+   ▪ You can also\
    \ put jobs directly into the background without first suspending them. Just type\
    \ the name of the job to run, a space, and `&` (as in `bigdog &`). The `&` moves\
    \ the job directly into the background.\n\n```\n[ejr@hobbes ejr]$ jobs\n[1]- \
    \ Stopped (tty input) ftp\n[2]+  Stopped (tty input) telnet\n[3]   Stopped (signal)\
    \ lynx\n[4]+  Stopped  man telnet\n[ejr@hobbes ejr]$ bg %1\n[1]-  ftp calvin.raycomm.com\
    \ &\n[ejr@hobbes ejr]$\n```\n\n**Code Listing 9.7** Restarting suspended jobs\
    \ in the background lets you do two things—or more—at once. To move a job to the\
    \ background, just type `bg` followed by `%` and the job number."
  merge: -1
  img_proc: true
- pgno: 211
  md: '```

    [ej@hobbes ejr]$ jobs

    [1]+  Stopped ftp ftp.cdrcom.com

    [ej@hobbes ejr]$ fg %1

    ftp ftp.cdrcom.com

    ```


    Code Listing 9.8 Typing fg plus the job number brings that job into the foreground.
    When you bring suspended jobs into the foreground, you''ll sometimes see the job
    activities onsreen. At other times, you''ll see only a prompt and will need to
    summon help to see anything of the program.


    # Running Jobs in the Foreground with fg


    When you''re ready to resume a suspended job, you can do so using fg. Remember,
    when you suspend a job, what you''re doing is moving the job into limbo. fg just
    moves the job into the foreground again (Code Listing 9.8), so you can see, for
    example, what it''s doing or provide input.


    # To run jobs in the foreground with fg:


    +   1. jobs


    At the shell prompt, type jobs to list all stopped or running jobs. Note the job
    numbers at the left.


    +   2. fg %1


    Enter fg followed by the number of the job that you want to bring back into the
    foreground (Code Listing 9.8). Depending on the job you''re bringing back into
    the foreground, you may or may not get to see the job running onsreen. Sometimes
    you''ll be plunked back into the job and be able to enter information as prompted.
    Other times, you''ll just see the prompt for the program you returned to the foreground.
    If this is the case, try typing ? (for help), which often forces the program to
    display something onsreen and refresh the display.


    # ✓ Tip


    +   ■ You can bring the last suspended job into the foreground by typing fg (with
    no job number) at the shell prompt.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Controlling Job Priority with nice


    Suppose you need an enormous file from the Internet that would take practically
    all afternoon to download. By downloading it, you would hog system resources and
    make the system response time much slower for other users. OK, bad example. Suppose
    your coworker needs to download an enormous file and would hog system resources
    all afternoon. You’d hope that she’d have the courtesy to not tie up system resources
    that you need to use.


    Fortunately, she can, using nice, which lets her control job priority. As Code
    Listing 9.9 shows, you rank your job’s priority using numbers from 1 to 19, with
    1 being somewhat nice (higher priority) and 19 being fabulously nice (lower priority).
    The Unix system uses the number you provide to determine how much attention to
    devote to the job.


    # To control job order with nice:


    +   - nice 19 slow script

    +     At the shell prompt, type nice, followed by the appropriate adjustment (19,
    here), and the name of the program or script to run (Code Listing 9.9). In this
    example, slow script is run with the lowest priority possible.


    # Tips


    +   - To find out how nice you need to be, you might check out how many processes
    (and which kinds) are currently running on the Unix system. You can do this using
    ps, as described later in this chapter.

    +   - You could use nice and run a job in the background—for example, use nice
    12 funscript & to run funscript in the background with a niceness level of 12.


    ```

    [e]r@hobbes ej$ nice 19 slow script

    ```


    Code Listing 9.9 By using nice plus an adjustment, you can let Unix determine
    how hard to work on your job.


    +   - You can just type nice plus the job name (as in nice sortaslow). Doing so
    will automatically specify 10 as the niceness level (the default setting).

    +   - If you are the system administrator and logged in as root, you can use negative
    numbers (down to -20) with nice to increase the priority (nice -16 priorityjob).

    +   - Use renice to change the niceness of a running job. For example, use renice
    18 2958 (the job number). If you’re the system administrator, you can increase
    or decrease the niceness of any job; if you’re a peon—whoops, we mean a regular
    computer user at your company—you can only decrease the priority of your own jobs,
    not increase it.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Timing Jobs with time


    Sometimes, you might want to know how long a job takes to complete. You can do
    so using the time command, which times jobs according to the built-in Unix timer.
    As Code Listing 9.10 shows, all you have to do is enter time followed by the command
    you want to time.


    # To time a job using time:


    +   - time slowscript


    At the shell prompt, type time followed by the complete command. After the command
    finishes, the system will tell you how long it took, as shown in Code Listing
    9.10.


    # To compare job times with time:


    +   1. time ls /usr

    +   At the shell prompt, type time followed by a job (here, ls).


    +   2. time nice -n 19 ls /usr

    +   Then, type time followed by another job. In this example, we''re comparing
    a regular ls command to a nice ls command. As Code Listing 9.10 shows, the elapsed
    time for the nice ls command was considerably longer than the regular ls command.


    continued on next page


    ```

    [ejr@hobbes running]$ time slowscript

    0.0s user 0.0system 0:50.12elapsed 0%CPU

    [ejr@hobbes running]$ time ls

    bigdog, tar.gz  slowscript  testing.gif

    0.03user 0.00system 0:00.08elapsed 78%CPU

    [ejr@hobbes running]$ time nice -19 ls

    bigdog, tar.gz  slowscript  testing.gif

    0.03user 0.03system 0:00.06elapsed 93%CPU

    [ejr@hobbes running]$ time -p nice -n 19 ls

    foo

    real 0.00

    user 0.00

    sys 0.00

    [ejr@hobbes running]$

    ```


    Code Listing 9.10 Enter time plus the full job command to find out the job time.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Tips


    +   - Keep in mind that the time a job takes to run may vary according to the
    system''s current load or capacity. For example, a job might take less time to
    run at 2 a.m., when few people are using the Unix system, compared with 2 p.m.,
    when many more people are using the system.


    +   - Different systems produce slightly different time outputs. On some systems,
    you''ll get real (clock) time, user time, and system time. Real time is how many
    seconds on the clock elapsed while the program was running, while user and system
    time both refer to different measures of how long it took the system to run the
    job. On other systems, you might get a ton of garbage, as shown in Code Listing
    9.11, but the gist of the information is the same.


    +   - In the case of the ls example, you''re really not concerned with either
    the output or the errors—just the time—so you can creatively dispense with all
    of it. Try time ls /usr > /dev/null 2>&1 to send standard output to /dev/null
    (the bitbucket) and send error messages to standard output (and thence to the
    bitbucket). See Chapter 17 for details.


    +   - Try time -p to get a more human-readable output.


    ```

    $ time slowscript

    0.0User 0.0System 0:50.13elapsed 0%CPU

    (0avgtext+0avgdata 0maxresident)k

    0inputs+0outputs (219major+59minor)pagefaults

    0swaps

    $

    ```


    Code Listing 9.11 time output varies from system to system. Here, we get a bunch
    of garbage to decipher in addition to the time information.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Finding Out What Processes Are Running with ps


    The jobs that you''ve been talking about so far are actually types of processes.
    Processes are programs, scripts, or commands—including anything you do in the
    Unix system. All jobs are processes, but not all processes are jobs.


    Occasionally, you may want to find out what processes are running on the Unix
    system. You can do this using ps, as shown in Code Listing 9.12.


    # To find out what processes are running with ps:


    +   - ps


    At the shell prompt, type ps to see the list of the current processes that you''re
    running in your current shell, including processes for your current shell, as
    well as any other jobs (Code Listing 9.12).


    The exact information you see will vary from system to system. In general, though,
    you''ll find the PID (process identification) number at the far left and the process
    name at the right.


    ```

