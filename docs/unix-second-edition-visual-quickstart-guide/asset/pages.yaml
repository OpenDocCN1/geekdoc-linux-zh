- pgno: 77
  md: '# Table 3.2


    # ksh History Navigation Commands


    | COMMAND | FUNCTION |

    |---|---|

    | Ctrl P | Recalls the previous command |

    | Ctrl N | Recalls the next command (works only after you''ve moved to a previous
    command) |

    | Ctrl R something | Gets the previous command containing "something" |

    | Ctrl B | Moves back one character within a command |

    | Ctrl F | Moves forward one character within a command |

    | Ctrl A | Goes to the beginning of the line within a command |

    | Ctrl E | Goes to the end of the line within a command |

    | Ctrl D | Deletes the current character |


    # To view session history in the ksh shell:


    +   1. set -o emacs

    +   To begin, you must enter set -o emacs. This command enables history reuse
    and command completion, and sets the shell to use emacs commands. (Emacs is an
    editor, but you do not need to use or be familiar with it for now.)


    +   2. Use the shell for a little while, changing directories, redirecting output,
    or doing other tasks.


    +   3. Ctrl P

    +   Recall the previous command with Ctrl P. Table 3.2 shows you other keyboard
    combinations that you can use to navigate through the session history.

    +   After you''ve finished recalling and, optionally, editing the command, press
    Enter (you don''t have to be at the end of the line to do so).


    +   4. history

    +   Type history at the shell prompt to see the list of the most recent commands
    you''ve entered (Code Listing 3.13).

    +   Notice the command number by each command. You can type ! Spacebar and the
    command''s number to rerun it.


    # Tip


    If you use ksh, you''ll probably want to add the set -o emacs command to your
    personal configuration files so you don''t have to manually enter the command
    in each session. See Chapter 8 for the specifics of editing configuration files.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Viewing Session History in the csh Shell


    If you''re a C programmer (or have C programmers to turn to for help), csh might
    be a good shell for you because the syntax is quite similar to the C programming
    language. csh doesn''t offer command completion, but the history capabilities
    are fairly similar to those of bash or zsh (see Code Listing 3.14). In general,
    csh is a powerful scripting shell (and acceptable interactive shell) for those
    who take the time and effort to become familiar with it.


    # To view session history in the csh shell:


    +   1. If you haven''t already, use the shell for a little while, changing directories,
    redirecting output, or doing other tasks.

    +   2. history

    +      Type history at the shell prompt to see the list of the most recent commands
    you''ve entered. Note the number of each command line (Code Listing 3.14).

    +   3. !10

    +      Type ! followed by the command number (no space in between) to rerun one
    of the commands. In this example, we''re rerunning command 10.


    # Tips


    +   - See Chapter 8 for how to make csh easier and more productive, particularly
    if you don''t have any other shell options available to you.

    +   - You can edit commands in the session history. With csh, however, it''s far
    easier to retype the commands than to edit them.


    ```

    xmision> history

    1 ls

    2 vi temp.info

    3 ls

    4 cd pub*

    5 ls

    6 cp *.pdf ..

    7 cd ..

    8 rm *.pdf

    9 history

    10 lynx

    11 ftp ftp.wustl.edu

    12 ls

    13 vi .plan

    14 finger ejr@roycomm.com

    15 history

    16 finger ejr@hobbes.roycomm.com

    17 ls

    18 pine

    19 history

    20 lynx

    21 history

    xmision> !10

    ```


    Code Listing 3.14 csh also lets you recycle commands by number, although other
    history functions are not available.


    +   - If you like csh, check for the availability of tcsh on your system. It''s
    like csh but adds command completion and other similar capabilities that are comparable
    to bash.

    +   - Sometimes, the length of the history is set to 0 (keeping no history lines)
    by default. If your history doesn''t seem to work, try set history=100 to save
    100 lines of history. Add this to your startup files (next chapter) if you want
    it to be available every time.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Changing Your Identity with su


    Occasionally, you may need to log in with a userid other than your own or need
    to relog in with your own userid. For example, you might want to check configuration
    settings that you''ve changed before logging out to make sure that they work.
    Or, if you change your shell, you might want to check it before you log out (and
    you should do that, by the way).


    You can use the su (substitute user) command to either log in as another user
    (Code Listing 3.15) or to start a new log-in shell.


    ```

    [ejr@hobbes asr]$ ls

    Projects testing

    [ejr@hobbes asr]$ su asr

    Password:

    [asr@hobbes asr]$ ls

    Projects testing

    [asr@hobbes asr]$ su - ejr

    Password:

    [ejr@hobbes ejr]$ ls

    Mail          editme        script2.sed

    Projects      fortunes.copy scriptxtro.sed

    Xrootenv.0    fortunes1.txt sedtest

    above.htm     fortunes2.txt sorted_address.temp

    address.book  groups        temp.htm

    address.temp  history.txt   tempsport

    axhome        html.htm      test

    bogus         html.html     test2

    chmod.txt     mail          testing.gif

    clean         manipulate    testing.wp

    compression   nsmail        typescript

    [ejr@hobbes ejr]$ exit

    [asr@hobbes asr]$ exit

    [ejr@hobbes ejr]$ exit

    ```


    Code Listing 3.15 Changing back and forth from one user to another (and exiting
    from multiple shells) can get a little confusing, but the prompt often tells you
    who you are and what directory you''re in.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# To log in as a different user with su:


    +   su osr


    At the shell prompt, type su plus the userid of the user you’re logging in as.
    You’ll be prompted for a password just as though you were logging in to the system
    for the first time (Code Listing 3.15). If you do not specify a username, the
    system will assume you mean the root user. If you’re logged in as root to begin
    with, you won’t be prompted to give a password. You will now be logged in as the
    new user and be able to work just as if you were that user, though you’ll be in
    the same directory with the same settings that you had before you issued the su
    command.


    # To start a new log-in shell with su:


    +   su - yourid


    At the shell prompt, type su - yourid (of course, use your own userid or that
    of the user you want to change to). The addition of the hyphen (-) will force
    a new log-in shell and set all of the environment variables and defaults according
    to the settings for the user.


    # To return to the previous shell:


    +   exit


    Type exit at the shell prompt to leave the current shell and return to the previous
    one. If you use exit from the original log-in shell, you’ll log completely out
    of the Unix system.


    # Tips


    +   If you have root access and you ssh to the system to administer it, you should
    use su to provide a little extra security. Rather than log in directly as root
    and leave the remote possibility of having your password stolen (or sniffed) off
    your local system, log in as yourself, then use su (with no other information)
    to change to root.


    +   If you su to another user with su user (no hyphen) and the new user doesn’t
    have read and execute permissions for the current directory, you will see shell
    error messages. You can disregard these. See Chapter 5 for more about read and
    execute permissions.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Fixing Terminal Settings with stty


    Another handy thing you can do with your shell is use it to fix those annoying
    problems that occur with terminal programs. Back in Chapter 1, we mentioned that
    you might encounter oddities such as your Backspace and Delete keys not working
    properly. You can fix these problems using stty (see Code Listing 3.16).


    # To fix Backspace and Delete key oddities with stty:


    +   stty erase ''^?''


    If you''re used to Backspace erasing characters to the left of the cursor and
    you just get a bunch of ^? symbols on the screen when you try it, you need to
    educate the terminal about your preferences. Type stty erase Backspace to fix
    it (Code Listing 3.16). In some cases, depending on your terminal program, you
    might need to set stty erase ''^H'' and then use Ctrl H to backspace. To enter
    this command, type stty erase Ctrl V Ctrl H (Code Listing 3.17).


    # To fix general terminal weirdness with stty:


    +   stty sane


    Typing stty sane at the shell prompt will fix a lot of oddities. For example,
    if you accidentally issue a bad command and all of a sudden nothing shows up on
    the screen or if you have general gibberish showing up on the screen, stty sane
    may return your terminal session to sanity. The reset command is also often effective
    at fixing a messed up terminal.


    ```

    xmision> ls ^?^?^?

    : No such file or directory

    xmision> stty erase ''^?''

    xmision> ls

    ```


    Code Listing 3.16 You can often straighten out a confused telnet program or Unix
    system by using a stty command. This one fixes the errant Backspace key.


    ```

    xmision> jF^HH

    jF^HH: Command not found

    xmision> ls ^H^H

    : No such file or directory

    xmision> stty erase ''^H''

    xmision>

    ```


    Code Listing 3.17 The stty command here fixes the Delete key to work like Backspace.


    # Tips


    +   If stty sane doesn''t fix a messed-up display, try logging out and logging
    back in or restarting your terminal program.


    +   You can fix Backspace oddities permanently by adding the appropriate stty
    command to your configuration files or by making changes in your terminal client.
    See Chapter 8 for details about your configuration files. Refer to Chapter 1 for
    more helpful details about terminal programs like SSH and telnet.'
  merge: -1
  img_proc: true
- pgno: 82
  md: "# Chapter 3\n\n# Exiting the Shell\n\nWhen you’re finished with your Unix session,\
    \ you need to exit the Unix shell. If you’ve been playing with the su and shell\
    \ commands, you might actually have shells within shells and need to exit from\
    \ all of them. All you have to do is type exit once for each shell.\n\n# To exit\
    \ from the shell:\n\n+   - `exit`\n+   \n+     At the shell prompt, type `exit`.\
    \ Ta-da!\n\n# ✔ Tips\n\n+   ▪ If you’re located at the log-in shell prompt, you\
    \ could also type logout rather than exit. At all other shells, though, you need\
    \ to type exit. In some cases, you could also press `Ctrl D`, but that depends\
    \ on your local system configuration.\n\n+   ▪ Be sure to log off rather than\
    \ simply hang up or break your connection. It’s possible, if the settings at your\
    \ Unix host are seriously incorrect, that your session could remain open and someone\
    \ else could pick up right where you left off with your session under your userid."
  merge: -1
  img_proc: true
