- pgno: 34
  md: 'Or


    ```

    cat newer.programs newest.programs >

    - all.programs

    ```


    In this example, we’ve added a redirection symbol (>) plus a new filename. This
    tells Unix to print out both files; however, instead of displaying the files onscreen,
    it redirects them to the file called all.programs. Aha! Here’s where cat does
    something better than more. See Redirecting Output, earlier, for more information
    about redirecting commands.


    # Tips


    +   - If you inadvertently use cat with a binary file, you might end up with a
    whole screen of garbage. On some systems, you might try stty sane to fix it—more
    on this in Fixing Terminal Settings with stty in Chapter 3. You could also just
    close your terminal window and log in again to fix it.


    +   - The tac command is just like cat, but backward. Try it! Oddly handy, eh?


    +   - You can also view file contents using the more command. See the previous
    section for details.'
