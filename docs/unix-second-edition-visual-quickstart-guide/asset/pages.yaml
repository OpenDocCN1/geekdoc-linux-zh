- pgno: 250
  md: '# Reading Email with mail


    In general, using mail is a bit less intuitive than using either pine or mutt;
    however, reading email with mail is particularly—um—challenging. Although we’d
    recommend using another program to read email if at all possible, here are the
    steps for reading email with mail if you’re daring enough or if you have no other
    options. Figure 11.12 illustrates this fairly quick task.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_250_0.png)


    Figure 11.12 The mail screen is anything but intuitive, but you can see the messages
    you have.


    # To read email with mail:


    +   1. mail

    +   Type mail at the shell prompt. You’ll get a list of messages and a prompt
    (Figure 11.12).


    +   2. 3

    +   Type the number of the message you want to read and press Enter.


    +   3. Marvelous...he’s such a jerk...oh, that’s neat....

    +   Read your messages. Press N to move to the next message, or more to page through
    the message a screen at a time.


    +   4. Q

    +   Press Q to quit mail when you’re ready.


    # ✓ Tips


    +   If somebody really long-winded sends you a long message, your Unix system
    might just zip the message on by, leaving you reading only the bottom few lines.
    To read the message in its entirety, either type more to page through the message,
    or type s followed by the message number to save it to a file, and then use the
    editor of your choice read it.


    +   Type h followed by a message number to see different message headers. For
    example, type h 117 to see the messages leading up to number 117.


    +   Find a different mail program if at all possible—it’s useful to be able to
    cope with mail for times of need, but it’s not a good long-term solution.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Sending Email with mail


    Despite mail’s unintuitive interface and features, it is a great program to use
    if you just want to dash off a quick message without fussing with niceties. As
    Code Listing 11.3 shows, you can send messages while in mail or from the shell
    prompt. You can also use mail to send files fairly easily.


    # To compose and send a message using mail:


    +   1. mail unixvqs@raycomm.com

    +   At the shell prompt, type mail followed by the recipient’s address. If you
    want to send email to multiple addresses, just separate them with commas but no
    spaces, as in mail putz@raycomm.com,putz2@raycomm.com. If you’re already in mail,
    just type m followed by the address or addresses, like m putz@raycomm.com,deb@raycomm.com.


    +   2. So, anyway, Winchester had perched himself on my stereo turntable (those
    were sooooo low-tech, weren’t they?!). He was waiting for me to turn on the stereo
    so he could go back to sleep while spinning in circles. I used to let him sleep
    that way at night. Well, that was until one night the lid closed on him…

    +   Type in your message text (see Code Listing 11.3).


    +   3. Ctrl D

    +   Announce that you’re done with either a . (dot) by itself on the last line
    or with Ctrl D, and the message will zip off to the recipient(s).


    ```

    [ejr@Hobbes ejr]$ mail debroy

    Subject: You’re in big trouble now!

    So, anyway, Winchester had perched himself on my stereo turntable (those were
    sooooo low-tech, weren’t they?!). He was waiting for me to turn on the stereo
    so he could go back to sleep while spinning in circles. I used to let him sleep
    that way at night. Well, that was until one night when the lid closed on him…

    EOT

    [ejr@Hobbes ejr]$

    ```


    Code Listing 11.3 Using mail, you can dash off a quick note by including the recipient’s
    address and the message text.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# To send text files with mail:


    mail unixvqs@raycomm.com < sendit.txt

    At the shell prompt, type mail followed by the recipient''s address. Then use
    < and the filename to redirect the file (< sendit.txt), which tells Unix to send
    the file to the address provided (Code Listing 11.4).


    ```

    [ejr@hobbes ejr]$ mail unixvqs@raycomm.com

    > < sendit.txt

    [ejr@hobbes ejr]$

    ```


    Code Listing 11.4 To send a text file through the mail, you just redirect the
    file to mail.


    # Tips


    +   See Scheduling Regularly Occurring Jobs with cron in Chapter 9 for a spiffier
    way of using mail to send messages directly.


    +   See the section in Chapter 1 called Redirecting Output for a refresher on
    redirection.


    +   You''ll notice that the mail interface on some systems does not provide for
    a subject line. On some systems, you can add one by including -s plus the subject
    text, like this: mail -s "An old Winchester story... dumb cat!" unixvqs@raycomm.com


    +   You can accomplish all of these command-line mail sending options with mutt
    as well as mail, but you get added benefits with mutt, including being able to
    send attachments. For example mutt -s "Sending that file" -a bigolefile.tgz suggest@example.com
    < /dev/null will do the whole nine yards at once, including attaching the big
    ol'' file. Don''t try that with mail!'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Creating a Signature File


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_253_0.png)


    Figure 11.13 Your signature file can contain any information you want. Be creative,
    but keep it concise!


    If you''ve been using email for any length of time, you''ve undoubtedly noticed
    signature files, which appear at the bottom of messages and include contact information,
    company name, and perhaps a short funny quote or saying. You can add a signature
    to your outgoing messages by creating a .signature file (Figure 11.13).


    # To create a signature file:


    +   1. pico ~/.signature

    +   At the shell prompt, type an editor''s name (here we use pico, but you can
    use the editor of your choice), specify the home directory (with ~/), and then
    specify the .signature filename. Note the leading dot in the filename, which makes
    the file hidden.


    +   2. Eric J. Ray ejray@raycomm.com

    +   My thoughts are my own ... is that OK, honey?

    +   Go ahead, type your signature information (Figure 11.13). We recommend that
    your .signature file include, at minimum, your name and email address. You can
    also add funny sayings ("You know you''re a geek when you refer to going to the
    bathroom as ''downloading.''") or disclaimers ("My opinions are mine and not my
    company''s."). Whatever you want, really. Keep your signature as short as possible;
    long signatures are hard to wade through.


    +   3. Save and exit the file.

    +   If you''re using pico or vi, you can get a quick reminder about this in Chapter
    4.'
  merge: -1
  img_proc: true
- pgno: 254
  md: "# ✓ Tips\n\n+   - If you want to get really fancy with your signature, use\
