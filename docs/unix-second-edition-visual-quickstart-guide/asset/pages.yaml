- pgno: 155
  md: '# To find out about users using finger:


    +   1. finger ejr


    At the shell prompt, type finger followed by the userid of the person you want
    to know about. You’ll get a ton of information, including some or all of the following:
    the user’s name, home directory, and default shell; when, from where, and for
    how long they’ve been logged on; and whatever other information they choose to
    provide. Code Listing 7.9 shows two users with varying activity. deb has apparently
    been loafing, and ejr has been working his buns off.


    +   2. finger ejray@xmmission.com


    Using finger plus a specific user address, you can find out about users on other
    systems. As with generic finger requests, sometimes they’re blocked for security
    reasons.


    continued on next page


    ```

    [ejr@hobbes ejr]$ finger deb

    Login: deb                  Name:

    Directory: /home/deb       Shell: /bin/bash

