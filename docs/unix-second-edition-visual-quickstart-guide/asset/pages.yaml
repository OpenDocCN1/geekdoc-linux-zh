    true if statement would result in "There''s feedback on the latest project" being
    printed onscreen.


    # 4. else echo "Nope, no feedback yet"


    On the next line, use else followed by a statement specifying what should happen
    if the if statement is false. Here, we specify that "Nope, no feedback yet" would
    be printed onscreen if the feedback file was not found or had nothing in it.


    # 5. fi


    Immediately after the else statement, announce that you''re finished with fi.


    # 6. Save the script and try it out.


