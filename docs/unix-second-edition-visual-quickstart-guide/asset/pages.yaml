- pgno: 318
  md: '# 5. vi Makefile


    Use the text editor of your choice to edit the Makefile, reading the instructions
    in it and checking the accuracy of things like directory and path names, program
    names, and similar settings. If you don’t know what something is or does, ignore
    it for now. Even if configure automatically sets up the Makefile for you, you
    should still glance through it to make sure that it’s putting stuff into the correct
    directories and that it doesn’t expect any additional information from you.


    Figure 14.2 shows the Makefile for yencode. All we did was verify the prefix (base
    directory).


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_318_0.png)


    Figure 14.2 Fortunately, many programs require minimal changes.


    # 6. Save the file and close out of the editor.


    There! You’ve configured your software installation!


    # Tips


    +   - Exactly what steps you’ll have to take will depend on the software. Scripts
    will come as plain text files and you might not have to do anything besides download
    them. Most of the time, however, you’ll have to tweak scripts as well as programs
    (although the scripts won’t need to be compiled).

    +   - A good rule of thumb is to make minimal changes to the Makefile. Doing more
    than is required often causes the program not to compile or gives you a bazillion
    error messages. If this happens, just go to your backup Makefile, make a new copy,
    and try again, making only the necessary modifications. Better to make too few
    changes than to take the time and effort to make too many.


    +   - Pay particular attention to the paths to programs and files as you’re editing
    scripts and other setup files—a little error in a path can be hard to spot and
    completely prevent the new software from working.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Compiling and Installing with make install


    Your final step is to get the software installed on the Unix system. With some
    programs, all you''ll have to do is put the files in the directory where you want
    them to live (often ~/bin for programs or scripts or sometimes cgi-bin for scripts
    or programs for Web use). With others, though, you''ll have to compile first and
    then install.


    You can compile and install using make install, which reads the Makefile (to see
    how to set everything up) and takes care of compiling and installing for you (Code
    Listing 14.4). Again, be sure to read the instructions carefully before you start
    and follow them exactly.


