- pgno: 148
  md: "# Getting System Information with uname\n\nInformation about your Unix system\
    \ might come in handy if you're planning to try some new software or need to figure\
    \ out system idiosyncrasies. Some systems tell you this information when you log\
    \ in. Sometimes, however, especially if you're using an ISP, you may not have\
    \ been told any particulars about the Unix system. You can easily find out what\
    \ kind of Unix system you're using with uname, as shown in Code Listings 7.1 and\
    \ 7.2.\n\n# To find out about the system using uname:\n\n+   1. uname\n+   \n\
    +   To begin, type uname to find out what kind of a system you're on. The Unix\
    \ system in Code Listings 7.1 and 7.2 is Solaris (aka, SunOS). Other common systems\
    \ (not an exhaustive list, by any means) are Linux, AIX, BSD, and HP/UX.\n+  \
    \ \n+   2. uname -sr\n+   \n+   Add the -sr flags to the command, yielding uname\
    \ -sr, to find out both the operating system type and the release level. This\
    \ is useful to find out whether specific software is compatible with the operating\
    \ system.\n+   \n+   3. uname -a\n+   \n+   For the whole nine yards, use uname\
    \ -a to print all information, including the operating system type, host name,\
    \ version, and hardware. The specifics you get here will vary a bit from system\
    \ to system.\n\n```\nejroy@home $ ssh frizzy\n\nLast login: Wed Oct 10 09:59:09\
    \ from frozz\nSun Microsystems Inc. SunOS 5.9 Generic\n+ May 2002\n\nejroy@frizzy\
    \ $ uname\nSunOS\nejroy@frizzy $ uname -sr\nSunOS 5.9\nejroy@frizzy $ uname -a\n\
    SunOS Frizzy 5.9 Generic_112233-01 sun4u sparc\n+ SUNW,Ultra-5_10\n```\n\nCode\
    \ Listing 7.1 Variants on the uname command provide all kinds of interesting or\
    \ useful information about the system.\n\n```\nejroy@frizzy $ uname\nLinux\nejroy@frizzy\
    \ $ uname -sr\nLinux 2.4.19-16mdk\nejroy@frizzy $ uname -a\nLinux frazz. raycomm.com\
    \ 2.4.19-16mdk #1 Fri\nSep 20 18:15:05 CEST 2002 i686 unknown\n* unknown GNU/Linux\n\
    ejroy@frizzy $\n```\n\nCode Listing 7.2 On a different system, the same commands\
    \ provide slightly different details, although the basic information remains the\
    \ same."
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Viewing File Systems

    with df


    If you''re used to Windows or Macintosh (prior to OS X) operating systems, you''re
    probably accustomed to having separate hard drives (C:, D:, E:, for Windows users,
    or real names for Macs), which are just different storage spaces. In Unix systems,
    different storage spaces are grafted onto the overall tree structure—tacked onto
    what already exists without any clear distinction indicating where actual disk
    drives are located. For example, if you have a folder on a Windows computer, you
    know that all of the subfolders and files within it are located on the same hard
    drive. In Unix, everything resides within the root directory, but any different
    directory could be located on a different physical hard drive. You might think
    of it as tacking a new branch onto your artificial Christmas tree.


    These tacked-on storage spaces are called file systems. Particularly if you''re
    running a Unix system (as opposed to just using one), you might need to find out
    what file systems are in use (or mounted in the system, in technical terms), how
    much space they have, and where they attach to the Unix system (or where their
    mountpoints are). You can find out this information using df, as shown in Code
    Listings 7.3 and 7.4.'
  merge: -1
  img_proc: true
