- pgno: 208
  md: "# Suspending Jobs\n\nSuppose you’ve just started a job that requires no input\
    \ from you—say, downloading multiple files with ftp—and you suddenly realize that\
    \ you’ve got to finish something else right now. Instead of waiting for the files\
    \ to download or stopping the job completely, you can instead just suspend the\
    \ job and resume it later (Code Listing 9.5). In doing so, you can make the Unix\
    \ system work your way—that is, you don’t lose the progress you’ve made toward\
    \ getting the job done, and you can do the other stuff you need to do as well.\n\
    \n```\n[ejr@hobbes ejr]$ ftp calvin.raycomm.com\nConnected to calvin.raycomm.com.\n\
    220 calvin Microsoft FTP Service (Version 2.0).\nName (calvin.raycomm.com:ejr):\
    \ anonymous\n331 Anonymous access allowed, send identity\n  * (e-mail name) as\
    \ password.\nPassword:\n230 Anonymous user logged in.\nRemote system type is Windows_NT.\n\
    ftp>\n[!] Stopped\nftp calvin.raycomm.com\n[ejr@hobbes ejr]$\n```\n\nCode Listing\
    \ 9.5 Suspending jobs is just like pushing the Pause button on your CD player.\n\
    \n# To suspend a job:\n\n+   - Ctrl+Z\n\nWhile the job is running, press these\
    \ keys to suspend the process (Code Listing 9.5). Ctrl+Z doesn’t actually terminate\
    \ the process; it pauses the job in much the same way that pressing the Pause\
    \ button on your CD player pauses the CD.\n\n# Tips\n\n+   - After you’ve suspended\
    \ a job, you can restart it in the background using bg, restart it in the foreground\
    \ using fg, check on its status using jobs, or delete it completely using kill.\
    \ Refer to the appropriate sections in this chapter for details on using these\
    \ commands.\n\n+   - You can suspend as many jobs at a time as you want. Just\
    \ use Ctrl+Z to do so, then use jobs to check the status of each suspended job\
    \ if you need to.\n\n+   - Because it’s pretty easy to forget that you’ve suspended\
    \ a job, most shells will remind you that \"there are stopped jobs\" when you\
    \ try to log out of the system. You should either resume the job or kill it before\
    \ you can log out. Yes, the Unix system uses the terms \"stopped jobs\" and \"\
    suspended jobs\" more or less interchangeably."
  merge: -1
  img_proc: true
- pgno: 209
  md: "# Checking Job Status with jobs\n\n```\n[ejr@Hobbes ejr]$ jobs\n[1]- Running\
    \ ftp calvin.raycomm.com &\n[2]+ Stopped (tty input) telnet\n[3]  Stopped (signal)\
    \ lynx\n    http://www.raycomm.com/\n[ejr@Hobbes ejr]$\n```\n\nCode Listing 9.6\
    \ Viewing jobs lets you know which jobs you have suspended and their status.\n\
    \nOccasionally, you may have multiple jobs running or suspended and need a quick\
    \ update about the jobs' status. Using jobs, you can find out whether a job is\
    \ running, stopped, or waiting for input, as shown in Code Listing 9.6.\n\n# To\
    \ check job status with jobs:\n\n+   - jobs\n\nAt the shell prompt, type jobs.\
    \ You'll see a list of the current jobs (that is, processes that you've suspended\
    \ or otherwise controlled) either running or stopped, as shown in Code Listing\
    \ 9.6. Using the job numbers on the left, you can choose to run the jobs in the\
    \ background or foreground, to resume them, or to kill the jobs, as described\
    \ in the next few sections in this chapter.\n\n# Tip\n\n+   - Depending on your\
    \ shell, you can often kill jobs with kill followed by a % and the job number\
    \ or command name— for example, you could kill the ftp job in Code Listing 9.6\
    \ with kill %ftp or kill %1. See Deleting Processes with kill later in this chapter\
    \ for more on killing jobs."
