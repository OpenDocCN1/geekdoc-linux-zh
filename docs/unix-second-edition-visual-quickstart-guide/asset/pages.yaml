- pgno: 364
  md: "# Making Backups with rsync\n\nThe rsync utility is a fancy way to synchronize\
    \ files and directories, either locally or across a network. We like to use it\
    \ to make backups so we don’t have to worry when we mess something up. Yes, we\
    \ could use cp or something equally boring, but we like the speed and flexibility\
    \ of rsync. In this example, we’re copying files locally, but we could as easily\
    \ be making remote backups to another server somewhere else.\n\n# To make backups\
    \ with rsync:\n\n+   1. mkdir ~/ .BACKUPDIR\n+   Create a directory to house your\
    \ backups. Ideally, you’ll create the directory on a different physical disk from\
    \ the stuff you’re backing up, but do what you can. We’re creating a backup directory\
    \ that’s a subdirectory of the home directory, which will help protect us against\
    \ self-inflicted damages but not against a disk failure. (We trust the system\
    \ administrator for protecting against disk failures...er, Eric, you are up-to-date\
    \ on our backups, aren’t you?)\n\n+   2. rsync -v -a /home/jdoe/data ~/ .BACKUPDIR\n\
    +   Specify the rsync command, the -v (for verbose) and -a (for archive) options,\
    \ and the source and destination directories (Code Listing 17.8).\n+   Wait while\
    \ it does the initial backup (showing you each file as it gets copied). The first\
    \ backup takes awhile but no longer than using cp would.\n\n```\n[jdoe@frazZ bin]$\
    \ rsync -v -a /home/jdoe/data ~/ .BACKUPDIR\nbuilding file list ... done\ndata/\n\
    data/#scratch#\ndata/#ll. programs#\ndata/#local. programs. txt#\ndata/*scratch*\n\
    data/1\ndata/2\ndata/Mail/\ndata/News/\ndata/Project/\ndata/Project/keep\ndata/Project/keeper.jpg\n\
    data/Project/kept\ndata/Project/kidder.txt\ndata/Project/kiddo\ndata/Project/kidnews\n\
    data/Project/kidneypie\ndata/Project/kids\ndata/Project/kidupdate\ndata/address.\
    \ book\ndata/address. book~\ndata/all. programs\ndata/b\ndata/backup-files/\n\
    data/backup-files/.Xauthority\ndata/backup-files/.bash_history\ndata/backup-files/.bash_logout\n\
    data/backup-files/.bash_profile\ndata/backup-files/.bashrc\ndata/backup-files/.mailcap\n\
    data/backup-files/.screenrc\ndata/backup-files/.ssh/\n...\nwrote 24841142 bytes\
    \  read 14708 bytes\n-> 741965.67 bytes/sec\ntotal size is 24779055  speedup is\
    \ 1.00\n[jdoe@frazZ bin]$ \n[jdoe@frazZ jdoe]$ rsync -v -a /home/jdoe/data ~/\
    \ .BACKUPDIR\nbuilding file list ... done\ndata/newer. programs.txt\nwrote 30149\
    \ bytes  read 36 bytes  20123.33 -> bytes/sec\ntotal size is 24765461  speedup\
    \ is 820.46\n[jdoe@frazZ jdoe]$\n```\n\nCode Listing 17.8 The rsync utility is\
    \ a handy tool for making backups. Note that it takes much less time for all updates\
    \ after the first one."
  merge: -1
