    ```\n\nCode Listing 8.2 Or, use setenv to find out which variables exist in the\
    \ csh shell at the c-shore.\n\n# Tips\n\n+   - If you do as we often do and try\
    \ to use show to show the environment variables (\"showing\" the variables seems\
    \ logical, right?), you might get a weird question about the standard mail directories\
    \ and the MH mailer. Just press Ctrl C to return to your shell prompt.\n+   -\
    \ If the list of environment variables is long, you can pipe setenv or setenv\
    \ to more so that you can read the variables one screen at a time. Try set | sort\
    \ | more or setenv | sort | more. See Chapter 1 for a reminder about piping commands.\n\
    \n# Variables in Your Environment You Shouldn't Touch\n\nBefore you go running\
    \ off and changing your environment, note that there are some things you should\
    \ really leave alone. These variables that the shell automatically sets affect\
    \ how your Unix system works (or doesn't work, if you try to change some of these\
    \ variables!). Some of these cannot be changed, but some can, with unpredictable\
    \ results. When in doubt, don't. See the sidebar Variables You Can Mess With in\
    \ the following section for a list of variables you can change.\n\n| Zsh, Bash,\
    \ and Ksh | Csh | Description |\n|---|---|---|\n| HISTCMD |  | Keeps track of\
    \ the number of the current command from the history. |\n| HOSTTYPE |  | Holds\
    \ a string describing the type of hardware on which the shell is running. |\n\
    | IFS |  | Specifies the characters that indicate the beginning or end of words.\
    \ |\n| LINENO |  | Contains the number of the current line within the shell or\
    \ a shell script. |\n| OLDPWD |  | Contains the previous working directory. |\n\
    | OSTYPE |  | Holds a string describing the operating system on which the shell\
    \ is running. |\n| PPID |  | Contains the process ID of the shell's parent. |\n\
    | PWD | csh | Contains the current working directory. |\n| RANDOM |  | Contains\
    \ a special value to generate random numbers. |\n| SECONDS |  | Contains the number\
    \ of seconds since the shell was started. |\n| SHELL | shell | Contains the name\
    \ of the current shell. |\n| SHLVL |  | Contains a number indicating the subshell\
    \ level (if SHLVL is 3, two parent shells exist and you'll have to exit from three\
    \ total shells to completely log out). |\n| UID |  | Contains the userid of the\
    \ current user. |"
