- pgno: 15
  md: '# GETTING STARTED WITH UNIX


    To start you on your journey through Unix, we’ll take a quick look at a few basic
    concepts and commands. In this chapter, we’ll get you started with basic Unix
    skills, such as logging in and listing and viewing files and directories. We’ll
    also do a bit of exploring to give you the lay of the land.


    # Chapter Contents


    +   - Connecting to the Unix system

    +   - Logging in

    +   - Changing your password

    +   - Listing directories and files

    +   - Changing directories

    +   - Finding out where you are in the directory tree

    +   - Piping input and output

    +   - Redirecting output

    +   - Using wildcards

    +   - Viewing file contents

    +   - Exploring the system

    +   - Getting help

    +   - Logging out'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'This chapter is essential for all Unix guru-wannabes. If you''re a Unix novice,
    you should start at the beginning of this chapter and work through each spread
    in sequence. With these basic skills mastered, you can then skip through this
    book and learn new skills that look useful or interesting to you. If you''ve used
    Unix before, you might peruse this chapter to review the basics and dust off any
    cobwebs you might have.


    The skills covered in this chapter apply to any version of Unix you might be using,
    including Linux or BSD through your local Internet Service Provider, Solaris,
    AIX or HP-UX at work, your Mac OS X or Linux system at home, or any other flavor
    (that''s the technical term) you can find. Keep in mind, though, that the exact
    output and prompts you see on the screen might differ slightly from what is illustrated
    in this book. The differences probably won''t affect the steps you''re completing,
    although you should be aware that differences could exist. (As much as possible,
    our examples will give you a sample of the diversity of Unix systems.)


    # The SSH Preferences Dialog


    In the Preferences dialog, you can fix some of the idiosyncrasies that are caused
    by how your SSH program talks to the Unix system. You can''t identify these idiosyncrasies
    until you actually start using your Unix system, but you should remember that
    you can fix most problems here. For example:


    +   ♦ If your Backspace and Delete keys don''t work, look for an option in your
    SSH or telnet program that defines these keyboard functions.


    +   ♦ If you start typing and nothing shows up onscreen, set local echo to on.


    +   ♦ If you start typing and everything shows up twice, set local echo to off.


    +   ♦ If you want to be able to scroll up onscreen to see what''s happened during
    your Unix session, change the buffer size to a larger number.


    Exactly which options you''ll have will vary from program to program, but these
    are ones that are commonly available. Click OK when you''re done playing with
    the settings.'
  merge: -1
  img_proc: true
- pgno: 17
  md: "# Connecting to the Unix System\n\nYour first step in using Unix is to connect\
    \ to the Unix system. Exactly how you connect will vary depending on what kind\
    \ of Internet connection you use, but the following steps should get you started.\n\
    \n# To connect to the Unix system:\n\n+   1. To begin, have your connection information,\
    \ such as an Internet Protocol address or name, handy.\n+   \n+   Contact your\
    \ system administrator if you don't yet have these. (Throughout this book, we'll\
    \ use \"system administrator\" to refer to your help desk, ISP technical support\
    \ line, or anyone else you can call on who runs your Unix system and can help\
    \ you.)\n\n+   2. Connect to the Internet, if necessary.\n+   \n+   If you use\
    \ a PPP connection to dial into an ISP, fire it up now. If you're a lucky duck\
    \ and use a full-time Internet connection at home, work or school, or if you're\
    \ using your Mac or Linux system at home, just ignore this step.\n\n+   3. Start\
    \ your SSH program and connect to the Unix system.\n+   \n+   Using SSH you can\
    \ connect to a remote computer (such as your ISP's computer) and work as if the\
    \ remote computer were sitting on your desk. Essentially, SSH brings a remote\
    \ computer's capabilities to your fingertips, regardless of where you're physically\
    \ located. (See the About Connecting sidebar for more information about connection\
    \ technologies.)\n\n# About Connecting\n\nOnce upon a time, when dinosaurs roamed\
    \ the earth, Unix users connected to their systems using telnet. With telnet,\
    \ your password and everything else you do is sent straight across the wire and\
    \ can be easily read by anyone on the same part of the network. Yikes, is right!\
    \ That's why, more and more, ISPs and system administrators require something\
    \ called SSH (Secure SHell) to connect to their systems. With SSH, everything\
    \ is encrypted, precisely the way your Web connection is encrypted when you use\
    \ an e-commerce site and see that the little padlock in your Web browser is closed.\n\
    \nYes, we know, you don't have any secrets, but if a hacker logs into your ISP's\
    \ system as you, that same hacker has won 50 percent of the battle for taking\
    \ over that system for any number of illegal activities. Besides which, if your\
    \ neighbor's 19-year-old son sniffs (that's the technical term) your user identification\
    \ (often called userid or user ID) and password over your cable modem connection\
    \ (and that's entirely possible), he can probably guess that your eBay password,\
    \ broker password, or whatever are the same or similar.\n\nThroughout this book,\
    \ we'll show examples using an SSH connection. If, for whatever reason, your system\
    \ administrators don't require SSH, we recommend using it anyway; there's absolutely\
    \ no reason not to, because there are no disadvantages to SSH compared to telnet.\
    \ If your systems don't support SSH, you can use the telnet or rlogin/rsh programs\
    \ as alternatives."
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Chapter 1


    Exactly how you connect depends on the particular program you''re using. For Windows
    users, we recommend PuTTY, which is a free SSH client available at www.chiark.greenend.org.uk/~sgtatham/putty/.
    For Macintosh users (pre-OS X), we recommend the predictably named MacSSH, also
    free, available at http://pro.wanadoo.fr/chombier/. And, of course, after you''ve
    logged into your Unix-like system, you can use the Unix ssh command to access
    other computers. Each program works a bit differently, and you''ll have to refer
    to the specific documentation for details about using them.


    In this example, we''re connecting to a Unix system using PuTTY. Figure 1.1 shows
    the Connection dialog, in which we''ve filled in the Host Name (varies), the Port
    (22), and the Protocol (SSH). If you''re looking for a quick start, just fill
    in the fields shown in Figure 1.2 and click Open.


    4. Check out the Categories (or the Preferences dialog in many other programs)
    and become familiar with your options. You will not need to change anything initially,
    but you might later want to customize colors or other settings. Generally, though,
    PuTTY provides usable settings.


    5. Marvel at the login: prompt, which is what you should see if you''ve connected
    properly (Figure 1.3) and move along to the next section. (PuTTY shows you login
