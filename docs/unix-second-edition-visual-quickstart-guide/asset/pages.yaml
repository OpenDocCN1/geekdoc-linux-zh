- pgno: 84
  md: '# Choosing an Editor


    Basically, all editors are designed to do the same things: enable you to create,
    modify, and save text files. These files could include configuration files, email
    messages, or shell scripts—essentially any text file you can create. Exactly which
    editor you choose is up to you, depending on your specific needs and how much
    you’re willing to learn.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_84_0.png)


    In this book, we’ll stick to three biggies, pico, vi, and emacs, which will likely
    give you all the capabilities you’ll need. We chose these because pico is (arguably)
    the easiest Unix editor to use, vi is one of the most powerful and is available
    on almost every Unix system, and emacs provides an unbelievable number of options
    and is a handy skill for the up-and-coming Unix pro to have.


    # About pico


    pico is one of the more straightforward Unix editors and has become quite popular
    because it’s extremely easy to use. In particular, as shown in Figure 4.1, it’s
    menu-driven and intuitive. All of the commands are visible, and you can open,
    modify, and close files with little effort. pico is a great choice if you’re just
    getting started with Unix or if you won’t be needing an editor able to leap tall
    files in a single bound.


    pico is distributed with the pine email program, so if you have pine available
    to you, you likely also have pico. (See Chapter 1 for a reminder on how to find
    out if pine and pico are available to you.) If pico is not available to you, ask
    your system administrator to install it.


    # Editors Abound


    By the way, dozens of other editors exist, such as


    +   - ed, ex, and red, which are simple (in functionality, but not necessarily
    usage) line-by-line editors

    +   - joe and jed, which are fairly simple editors and comparable to pico in many
    ways'
  merge: -1
  img_proc: true
- pgno: 85
  md: '![](img/6ffd6bb320ccf354f5a4d57c9d95190d_85_0.png)


    Figure 4.2 vi gives you a clean screen and makes you remember all of its cryptic
    commands.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_85_1.png)


    Figure 4.3 emacs provides both menus and power, all at once.


    # About vi


    Although vi is likely responsible for much of Unix''s reputation for being complicated
    and confusing, it offers enormous power and flexibility—it will leap tall files
    in a single bound and do much, much more. Plus, vi is universally available (unlike
    pico), so for these two reasons, you should consider taking the time to learn
    it. You might find vi cryptic, counterintuitive, and nitpicky, and for this reason,
    you might want to choose a different editor if you won''t require vi''s capabilities.


    As Figure 4.2 shows, if you use vi, you won''t have menus at your disposal—you''ll
    have to get used to using commands like Esc :q or Esc :%s/vi is arcane/vi is powerful/.


    # About emacs


    With emacs, you start to understand how incredibly customizable Unix can be. It
    can be "just" an editor—although a very powerful one with all kinds of helpful
    features—or it can be an email program, file manager, or darn near anything else.
    We''re going to stick to just the editorial functions, but if you find that you
    like emacs, don''t hesitate to explore the Web for other options and features
    of this editor. Figure 4.3 shows you what to expect from emacs, including the
    handy (and fairly familiar) menus.


    # Tips


    +   - You can specify a default editor that will start automatically in programs
    that start up an editor for you. Chapter 8 provides details about setting your
    editor environment variable.


    +   - See Chapter 8 for more information about configuration files, Chapter 10
    for more information about shell scripts, and Chapter 11 for more information
    about email.


    +   - You''re not bound to one editor or another. You can use any editor at any
    time. We often use pico for email or plain writing because we can type without
    thinking. We switch to vi when we really need power or just want to make a quick
    edit without pico''s menus, which often seem cumbersome to us.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Starting pico and Dabbling with It


    You can start and dabble with pico using the following steps. Notice that the
    pico interface is intuitive and easy to navigate in, as shown in Figure 4.4.


    # To start pico and dabble with it:


    +   1. pico

    +   To begin, type pico at the shell prompt. The program starts up and you''ll
    see something like Figure 4.4, with the text area up at the top of the window
    and the command hints down at the bottom.

    +   If you know the name of the file you want to edit, type pico at the shell
    prompt followed by the path and name of the file you want to edit (hairyspiders,
    for example).


    +   2. hairy spiders

    +   Go ahead. Type in something—anything—just to try it out.

    +   ▲ Use Delete and Backspace to help edit text.

    +   ▲ Use the arrow keys to move up, down, right, or left.


    # Tips


    +   Start pico with the -w option (e.g., pico -w filename) to disable word wrapping.
    You''ll find this particularly useful when editing configuration files, as covered
    in Chapter 8.


    +   Throughout pico, you''ll see ^C, ^J, and dozens of other ^something characters
    hanging out in the menu at the bottom. The ^ stands for Ctrl, so ^C is Ctrl C,
    ^J is Ctrl J, and so on.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_86_0.png)


    +   If you type pico and get an error message telling you that the command is
    not found, use find, whereis, or ls to search through the likely directories (/usr/bin
    or /usr/local/bin) to see whether the program is available but not located where
    your shell can find it. See Chapter 1 for a quick review.


    +   After you establish a file and start adding content, save your changes using
    the instructions in the next section.


    +   You can get helpful information about pico''s features by accessing pico help.
    See the section called Getting Help in pico later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '![](img/6ffd6bb320ccf354f5a4d57c9d95190d_87_0.png)


    # Saving in pico


    You’ll generally save your files frequently whenever you’re editing them—and you
    should. Remember, Murphy is watching you....


    # To save in pico:


    +   1. Ctrl O

    +   Use Ctrl O periodically to save (write ‘out’) the text you’re editing.


    +   2. hairyspiders

    +   Specify the filename for your file (Figure 4.5).


    # Tips


    +   After you save a file for the first time and want to save new changes, just
    press Ctrl O then press Enter to confirm the current filename and save it.


    +   When you exit pico, you’ll get a last chance to save your changes. See Exiting
    pico in this chapter for the specifics.


    +   If you try to save a new file over an existing one—which would obliterate
    the original—pico carefully asks you if you want to overwrite the file. Yes, and
    you’ll no longer have the original. No, and you’ll get to choose a new filename.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Cutting and Pasting Text Blocks in pico


    As you''re typing along in pico, you''ll probably need to cut and paste blocks
    of text, as shown in Figure 4.6.


    # To cut and paste text in pico:


    +   1. pico hairyspiders

    +   At the shell prompt, type pico followed by the name of the file to edit.


    +   2. Move the cursor to the first line of the text you want to cut.


    +   3. Ctrl ^

    +   Press Ctrl ^ to mark the beginning of the text you want to cut. (Note that
    Ctrl ^ is really Ctrl Shift 6 — it might work without Shift, but it might not.
    Try it out with your terminal program and see what happens.)


    +   4. Use the arrow keys to move the cursor to the end of the text you want to
    cut. Note that the text gets highlighted as you select it (Figure 4.6).


    +   5. Ctrl K

    +   This "kuts" the text.


    +   6. Using the arrow keys, move the cursor to where you want to insert the cut
    text.


    +   7. Ctrl U

    +   Use this key combination to paste the cut text into the file at the new location.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_88_0.png)


    # Tips


    +   You can select and cut blocks of text without also pasting them back into
    a file. Just skip steps 6 and 7.


    +   You can paste text blocks as many times as you want. After you select and
    cut text, just press Ctrl U at each place where you want to insert the cut text.


    +   If you don''t select text, Ctrl K just cuts a single line.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Checking Spelling in pico


    Another handy thing you can do in pico is chek yoor speling, as shown in Figures
    4.7 and 4.8.


    # To spell-check in pico:


    +   1. pico hairyspiders

    +   At the shell prompt, type pico and the filename of the file to edit.


    +   2. Ctrl T

    +   Pressing this command starts spell-checking the file. pico will stop at each
    misspelled word (Figure 4.7).


    +   3. correctspelling

    +   Type in the correct spelling for any words flagged as misspelled, or press
    Enter to accept the current spelling and move along to the next word.


    # ✓ Tips


    +   You can press Ctrl C to cancel spell-checking at any time.


    +   Because the spell-checker in pico isn''t full-featured, consider using an
    alternate spell-check program by specifying it on the command line, like pico
    -s ispell hairyspiders, so you can get a little more assistance. See Chapter 15
    for more information.


    +   When the entire document has been spell-checked, pico will tell you that it''s
    done checking spelling, and you can continue editing the file (Figure 4.8).


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_89_0.png)


    Figure 4.7 pico prompts you to correct the spelling of misspelled words.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_89_1.png)


    Figure 4.8 pico informs you when the procedure is complete.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Getting Help in pico


    A great way to find out more about pico is to access pico help. In addition to
    finding answers to your questions, you can also find out about pico features and
    capabilities of which you may not be aware (Figure 4.9).


    # To get help in pico:


    +   1. Ctrl G

    +      In pico, press Ctrl G to access help.

    +   2. Move through the help pages:

    +      ▲ Ctrl V moves you down through the help page.

    +      ▲ Ctrl Y moves you up through the help page.

    +   3. Ctrl X

    +      Use this combination to exit help.


    # To get help with pico startup options:


    +   ♦ man pico

    +      At the shell prompt, type man pico to learn more about startup options,
    including a variety of options that control how pico works.


    # ✓ Tips


    +   ■ Keep your eyes on the pico status line for current information, error messages,
    and occasional hints about using pico. The status line is the third line from
    the bottom of the screen, just above the menu, as shown in Figure 4.9.

    +   ■ Keep in mind that pico really is a very basic program. If you''re looking
    for a command or function that isn''t readily available, it''s probably not there.
    You might check out vi or emacs instead.


    ![](img/6ffd6bb320ccf354f5a4d57c9d95190d_90_0.png)


    Figure 4.9 pico gives you all the information you need.'
  merge: -1
  img_proc: true
- pgno: 91
  md: "# Exiting pico\n\nWhen you’re done editing in pico, you’ll exit it using the\
    \ following steps.\n\n# To exit pico:\n\n+   1. `Ctrl X`\n+   \n+   Within pico,\
    \ press `Ctrl X`. If you haven’t made any changes to the text since you last saved\
    \ the file, you’ll find yourself immediately back at the shell prompt. If you\
    \ have made changes, you’ll be prompted to “Save modified buffer” (Figure 4.10).\n\
    \n+   2. At the “Save modified buffer” prompt:\n+      - Press `Y` if you want\
    \ to save your changes. Proceed to step 3.\n+      - Press `N` if you don’t want\
    \ to save your changes. You’ll end up back at the shell prompt.\n\n+   3. `bighair\
    \ y spiders`\n+   \n+   Specify the filename for your file if it’s the first time\
    \ you’ve saved it. If you’ve saved it before, press `Enter` to confirm the current\
    \ filename or change the name to save a copy and not change the original file.\n\
    \n# ✓ Tip\n\n+   ▪ A buffer is what the computer uses to temporarily store information,\
    \ and if it’s modified, that means that it’s temporarily storing something that\
    \ you haven’t saved to disk.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_91_0.png)"
