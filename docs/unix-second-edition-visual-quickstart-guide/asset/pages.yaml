- pgno: 44
  md: '# Copying Directories and Files with cp


    ```

    $ cp -r /home/ejr/Projects

    → /home/shared/deb/Projects

    $ ls /home/shared/deb/Projects

    current  new.ideos  schedule

    $

    ```


    Code Listing 2.3 Use cp -r to copy directories.


    When working in Unix, you''ll frequently want to make copies of directories and
    files. For example, you may want to copy a file you''re working on to keep an
    original, unscathed version handy. Or, you might want to maintain duplicate copies
    of important directories and files in case you inadvertently delete them or save
    something over them. Accidents do happen, according to Murphy.


    Whatever your reason, you copy directories and files using the cp command, as
    shown in Code Listing 2.3. When you copy directories and files, all you''re doing
    is putting a duplicate in another location; you leave the original untouched.


    # To copy a directory:


    +   1. `cp -r /home/ejr/Projects`  → `/home/shared/deb/Projects`

    +      At the shell prompt, type cp -r, followed by the old and new (to be created)
    directory names, to copy a complete directory. The r stands for "recursive," if
    that''ll help you remember it.


    +   2. `ls /home/shared/deb/Projects`

    +      You can use ls plus the new directory name to verify that the duplicate
    directory and its contents are in the intended location (Code Listing 2.3).'
  merge: -1
  img_proc: true
- pgno: 45
  md: "# To copy a file:\n\n```\n```text\n$ cp existingfile newfile\n$ ls -l\ntotal\
    \ 7\n-rw-rw-r-- 1 ejr users 1475 Jun 29 12:18\n  existingfile\n-rw-rw-r-- 1 ejr\
    \ users 1475 Jun 29 12:37\n  newfile\n-rw-rw-r-- 1 ejr users 2876 Jun 29 12:17\n\
    \  oldfile\n$ cp -i existingfile oldfile\ncp: overwrite 'oldfile'? n\n$\n```\n\
    ```\n\n**Code Listing 2.4** Just use cp to copy files and add `-i` to insist that\
    \ the system prompt you before you overwrite an existing file.\n\n+   - Rather\
    \ than moving directories and files (using `mv`), consider copying directories\
    \ and files (using `cp`) and then deleting the original (using `rm`). This way\
    \ you can ensure that you have a copy as you're reorganizing your directories\
    \ and files. Stop by the sections called *Moving Files with mv* and *Removing\
    \ Files with rm* in this chapter for details on these topics.\n+   - Use `cp`\
    \ with a `-i` flag to force the system to ask you before overwriting files. Then,\
    \ if you like that, visit Chapter 8 to find out about using aliases with `cp`\
    \ so that the system always prompts you before overwriting files.\n\n+   1. **cp\
    \ existingfile newfile**  \n+      At the prompt, type `cp`, followed by the old\
    \ and new (to be created) filename.\n+   \n+   2. **ls -l**  \n+      Optionally,\
    \ check out the results with `ls -l`. The `-l` (for long format) flag displays\
    \ the file sizes and dates so you can see that the copied file is exactly the\
    \ same as the new one (**Code Listing 2.4**).\n+   \n+   3. **cp -i existingfile\
    \ oldfile**  \n+      If you use `cp` with the `-i` flag, it prompts you before\
    \ overwriting an existing file, also shown in Code Listing 2.4.\n\n# ✔ Tips\n\n\
    +   - When copying directories and files, you can use either **absolute (complete)**\
    \ names, which are measured from the root directory (`/home/ejr/Projects`), or\
    \ **relative** (partial) names, which specify files or directories in relationship\
    \ to the current directory (`ejr/Projects`) and aren't meaningful from elsewhere\
    \ in the Unix file system. Using absolute names, you can manipulate directories\
    \ and files anywhere in the Unix system. Using relative names, you can manipulate\
    \ files only with reference to your current location.\n+   - You can compare the\
    \ contents of two files or two directories using `cmp` and `diff`, respectively.\
    \ For example, typing `cmp filename1 filename2` would compare the contents of\
    \ the specified files. Use `diff` or `sdiff` to see the differences between files.\
    \ Breeze through Chapter 6 for more information.\n+   - You can copy directories\
    \ and files to or from someone else's directory. Skip to Chapter 5 to find out\
    \ how to get access, then use the copying procedure described here.\n\n![](img/6ffd6bb320ccf354f5a4d57c9d95190d_45_0.png)"
