    几分钟后，你将看到下方截图所示的 Windows 安装界面。你可以在点击“下一步”之前在这里指定语言设置。当你点击“下一步”时，安装程序将在后台执行一些额外的初始化任务。


    我更倾向于安装 Windows 8，因为它非常快且安装非常简单。大多数驱动程序在安装过程中已经安装完毕，因此剩下需要执行或配置的工作很少。


    Windows 8 将安装基础显卡驱动程序和你的局域网驱动程序。你的局域网驱动程序用于以太网控制器。唯一没有安装的是音频驱动程序。这不是问题，因为我们将其作为服务器的宿主机，不需要声音和华丽的图形。


    ![windows-2.jpg](img/00071.jpeg)


    一旦你完成上述步骤并点击“下一步”，系统将通过下下方的屏幕提示你安装 Windows 8。


    ![windows-4.jpg](img/00072.jpeg)


    当你点击`立即安装`按钮后，你将看到安装程序信息收集阶段的开始。第一步是输入 Windows 8 产品密钥。


    ![windows-3.jpg](img/00073.jpeg)


    下一步是微软许可协议。如果你想继续安装 Windows 8，则必须接受该协议。


    ![windows-5.jpg](img/00074.jpeg)


    当你被提示选择要执行的安装类型时（如下方的截图所示），你需要选择`自定义：仅安装 Windows（高级）`类型，以便对 Windows 8 进行纯净安装。


    ![windows-6.jpg](img/00075.jpeg)


    当你被提示选择想要安装 Windows 的位置时（如下方的截图所示），你将看到已创建的硬盘或分区的列表。


    有许多不同的选项，但作为示例，我将使用整个硬盘来安装 Windows 8。对于具有创建分区和安装操作系统经验的人士来说，你可能希望创建自己的自定义布局。


    创建驱动布局的选项可能是：你可能希望在一个 30 GB 的分区上安装 Windows 8；这将为 Windows 8 留出 20 GB 的最小空间，剩余空间则留给虚拟化软件和
    CentOS ISO 文件。


    硬盘的剩余部分随后可以格式化为例如 `X` 盘，并用于虚拟机硬盘。这样，如果硬盘的该部分损坏，就可以快速重新安装 Windows 和你的虚拟化软件。你只需要将你的虚拟机重新加载到虚拟化软件中，让你的服务器快速恢复运行即可。


    ![window-7.PNG](img/00076.jpeg)


    在你选择了硬盘布局并点击“下一步”后，设置程序会创建任何硬盘分区（或整个硬盘），对其进行格式化，然后立即进入“正在安装 Windows 8”阶段，该阶段从复制并为安装准备好文件开始；如下方的所示。这个过程可能需要一些时间。


    如果你确实要在所选硬盘上创建或删除分区，可以通过点击上方截图右下角的`驱动器选项（高级）`来实现。


    一旦加载了这些选项，你将看到配置你的硬盘的不同选项。


    ![windows-8.jpg](img/00077.jpeg)


    当 Windows 完成安装后，你的屏幕将变为下方截图，通知你 Windows 需要重启。


    ![windows-9.jpg](img/00078.jpeg)


    重启后，你将看到带有蓝色 Windows 标志的黑色屏幕，并看到设置程序正在准备设备，如下方的所示。


    ![windows-10.jpg](img/00079.jpeg)


    一旦该部分过程完成，Windows 将提醒你它将再次重启。


    ![windows-11.jpg](img/00080.jpeg)


    当你的系统再次重启时，系统将提示你为 Windows 8 选择配色方案和 PC 名称，如下所示。


    ![windows-12.jpg](img/00081.jpeg)


    当设置屏幕出现时，你可以选择自定义这些设置，也可以允许 Windows 使用快速设置。如果你不确定，可以点击`了解更多`链接获取更多详细信息。我选择了使用快速设置，如果你需要，以后可以更改这些任何或全部设置。


    ![windows-13.jpg](img/00082.jpeg)


    在下一个屏幕上，你将被提示输入如何登录你的 PC。Windows 8 设计为与你的 hotmail 账户配合，并直接从 hotmail 将电子邮件加载到你的
    PC。


    在这一步中，你只需将其留空即可。你不希望宿主机系统访问你的电子邮件，也不希望宿主机系统要求登录。


    你不希望宿主机系统要求登录的原因是：如果你的系统崩溃导致自动重启，你将 own 这个问题，而且在你重新登录之前，你所有的 VPS（虚拟机）都将离线状态。


    ![windows-14.jpg](img/00083.jpeg)


    接下来你将看到下方所示的绿色屏幕，表示 Windows 正在准备你的 PC。这将需要几分钟，然后继续。


    ![windows-15.jpg](img/00084.jpeg)


    安装的最后部分是应用程序。你中的一些可能知道 Windows 8 在启动屏幕上有很多应用程序。这些应用程序现在会被默认安装。由于这仅作为一个主机系统，你可能想要移除其中的一些应用程序或确保某些程序不运行，以创建尽可能低的资源占用，这将允许将更多的系统资源用于你的虚拟机。


    ![windows-16.jpg](img/00085.jpeg)


    一旦这些应用程序完成后，你的新 Windows 8 安装即完成。


    ![windows-17.jpg](img/00086.jpeg)


    你的 Windows 8 宿主机操作系统现在已安装。作为宿主机操作系统，Windows 8 只需要一种配置选项，接下来介绍。


    ### 禁用 Windows 8 的睡眠模式


    默认情况下，Windows 8 与大多数其他 Windows 操作系统一样，在键盘或鼠标无活动一段时间后会将 PC 置于睡眠状态。一旦我们的虚拟机创建，这将一台无头机器，这意味着我们将没有永久激活的显示器、键盘或鼠标。


    如果宿主机操作系统让系统进入睡眠，我们需要回到系统并唤醒它，以便我们的服务器能够 24 小时在线。因此，禁用睡眠模式是必要的。


    为了加载电源选项，将鼠标指针指向启动屏幕左下角并右键点击，然后选择如下所示的`电源选项`。


    ![windows-18.jpg](img/00087.jpeg)


    电源选项加载后你将看到`平衡（推荐）`被加粗选中。在其右侧是蓝色的`更改计划`。


    ![window-19.PNG](img/00088.jpeg)


    一旦点击更改计划，加载如下截图。


    将`使计算机睡眠`选择框改为`从不`并点击保存更改。你的宿主机现在在活动一段时间后不会进入睡眠模式。


    ### 安装虚拟化软件


    有各种虚拟化软件供选择，但我们将使用 Oracle 的 `Virtualbox`。这是一个开源应用程序，并保持良好的更新。我已使用它一段时间，发现它非常易于使用，同时对高级用户来说非常健壮。


    请查看我们的软件部分获取下载位置。


    我们将使用适用于 Windows 的 64 位版本 `Virtualbox`。当前版本（本书编写时）为 `4.2.12`，我们将使用的版本全名为 `VirtualBox
    4.2.12 for Windows hosts x86/amd64`。


    '
- fmt: '

    Oracle has a very good manual and there is plenty of support via forums on using
    `Virtualbox` for anybody wishing to explore in more depth the full potential of
    the software application.


    ## Installing VirtualBox


    Once you have download `Virtualbox` you will need to double the application to
    start the installation process.


    As the executable application starts you will see a security warning for your
    windows system as shown.


    ![oracle-1.PNG](images/00090.jpeg)


    Click `Run` to start the installation. The Oracle `VirtualBox` welcome box will
    now be displayed as shown in the screenshot below. Click `Next` to begin.


    ![oracle-2.PNG](images/00091.jpeg)


    Next is custom setup. You can just leave this set to its default values for the
    installation that we require.


    ![oracle-3.PNG](images/00092.jpeg)


    Click `next` on the above screen. Next you will be prompted if you require the
    installation to create a desktop shortcut and a shortcut on the quick launch bar.
    Select or deselect which of these you require and click `next`.


    ![oracle-4.PNG](images/00093.jpeg)


    On the next screen you will get a warning message. Like the example shot below.
    This is ok and `Virtualbox` needs to install network capabilities into your network
    LAN card and windows configuration files.


    Click `yes` to proceed with the installation.


    ![oracle-5.PNG](images/00094.jpeg)


    The last screen of before `Virtualbox` is installed is a final conformation and
    a last chance to change any of the installation settings. Click `Install` to continue.


    ![oracle-6.PNG](images/00095.jpeg)


    Oracles `Virtualbox` will now install on your host system. This does only take
    a few seconds to install. Your installation screen will look like the example
    screenshot below.


    ![oracle-7.PNG](images/00096.jpeg)


    Just before the installation completes you may get a Windows Security warning
    message like below. It is ok to check the box `Always trust software from “Oracle
    Corporation” and click `install`.


    ![oracle-8.PNG](images/00097.jpeg)


    Your installation will now continue and complete in a few seconds which will present
    you with a completed installation screen like below.


    ![oracle-9.PNG](images/00098.jpeg)


    Uncheck the check box to start `Oracle VM VirtualBox 4.2.12` after installation
    and click `finish`.


    You will now be prompted with a box to restart your system. Click `yes` and allow
    your system to restart.


    ![oracle-10.PNG](images/00099.jpeg)


    ## Network Configuration


    Windows 8 does seem to configure the network interface into bridge mode very well
    but other versions of Windows require some manual configuration of for the bridged
    adapter. This is what allows virtualisation of your network card.


    Once your system has rebooted we will now check to make sure that you have the
    correct network settings to allow `Virtualbox` to use virtualisation of your network
    adapter.


    In order to via your network settings you will need to go to:


    `Control panel / network and internet / view network status and tasks`


    Once the control panel has opened click `change adapter settings` from the left
    hand side menu. This will open a new window showing you your `Ethernet` adapter
    and your `Oracle` adapter as in the example screenshot below.


    ![oracle-11.PNG](images/00100.jpeg)


    Once you have the above screen you can right click on `VirtualBox Host-Only Network`
    and click `disable`. You will now see this adapter fade out.


    Right click on the `Ethernet` network adapter and select `properties`. This will
    show a small popup box with a list of devices and a check box to the left hand
    side of each like the example below.


    ![oracle-12.PNG](images/00101.jpeg)


    In our example `VirtualBox Bridged Networking driver` is the second on the list,
    make sure this is checked and click `ok`. This now allows `VirtualBox` to use
    your systems built in `Ethernet` controller and allows virtualisation of the controller
    so that each of your `VPS` (virtual machines) can have an independent `mac` address
    and internet access.


    You should now see a screen like below.


    ![oracle-13.PNG](images/00102.jpeg)


    `VirtualBox` is now installed and networking is configured ready for you to create
    you first `VPS` (Virtual Machine).


    ## Creating a Virtual Machine (VPS)


    Now that we have our host system setup, and our virtualisation software installed,
    it’s time to create our first `VPS` (Virtual machine). There really are only a
    few simple steps to setting the hardware for the machine then it’s just a case
    of installing and configuring `CentOS` so that the virtual machine becomes a virtual
    private server.


    If you allowed Oracles `VirtualBox` to create a desktop icon double click on the
    `Oracle VM VirtualBox` icon on your desktop to launch the `VirtualBox` manager.


    As this is the first time the application has been loaded there are no virtual
    machines created so the default welcome screen is loaded as shown below.


    ![vps-1.PNG](images/00103.jpeg)


    Click on the `new` tab which is in the top left hand corner of the `VirtualBox
    Manager` application. This will launch the create `VirtualBox` part of the program.


    ![vps-2.PNG](images/00104.jpeg)


    The above screenshot is where we name the machine and operating system. As we
    are creating a `VPS`, I have named the machine `VPS-1`. In this example we will
    install `CentOS` so I have selected the type as `Linux`, under version `CentOS`
    is not listed so I have opted for `Other Linux`. Once you have selected your options
    click `next`.


    On the next screen is where you select the amount of memory that the virtual machine
    should be allocated. You can use the slider but I find it better to type the amount
    of memory into the text box.


    As I mentioned previously that I was going to create two `VPS` (Virtual machines)
    each with 1 processor, 1 GB memory and 20 GB hard drive I will need to enter 1
    GB in this step. The memory should be entered in `MB` so I will enter `1024` which
    is equal to `1 GB`.


    ![vps-3.PNG](images/00105.jpeg)


    Next we are prompted to select one of three options. To create a new machine we
    need to select `Create a virtual hard drive now` and the click `create`.


    ![vps-4.PNG](images/00106.jpeg)


    Next we select the type of hard drive we would like to create. `VirtualBox` can
    create and use various types of hard drive which are compatible with other virtualisation
    software applications. As we are only going to use `VirtualBox` we can leave this
    setting as the `Default` as shown in the screenshot below.


    ![vps-5.PNG](images/00107.jpeg)


    On the next screen select `fixed size` and click `next`. As shown below.


    ![vps-6.PNG](images/00108.jpeg)


    Now we need to select the hard drive file location and the hard drive size. You
    can leave the first entry field as it is, if you are happy to use the default
    location. If you would like to rename the hard drive and select a different file
    location you can do so here.


    The slider scale is for you to increase or decrease the hard drive size. In this
    example we are creating a 20 GB hard drive; again I just entered this into the
    text box rather than use the slider.


    ![vps-7.PNG](images/00109.jpeg)


    The `VirtualBox Manager` will now create your hard drive and set your new machine
    up. Depending on the size of the hard drive you are creating, will depend on how
    long this will take.


    ![vps-8.PNG](images/00110.jpeg)


    Once your new virtual machine has been created, you will be returned to the welcome
    screen of the `VirtualBox Manager`. This screen will now have changed, and will
    list your machines on the left hand side with an overview of the machine in the
    centre of the selected machine; as shown in the screenshot below.


    ![vps-9.PNG](images/00111.jpeg)


    As you can see your new machine is powered off, before we turn your new machine
    on we need to do a little configuration in order to get the machine to work as
    a web server.


    In order to configure your new machine you will need to make sure that you have
    your machine selected and highlighted from the left hand menu and click `settings`,second
    tab in on the top menu). Depending on your host system you may get an error warning
    like below. Don’t worry and click `ok`.


    ![vps-10.PNG](images/00112.jpeg)

