    你现在将看到 `eth0` 和你的以太网控制器的型号。如果你有多个以太网控制器，它们将在这里列出。我们稍后会介绍更多关于多个 IP 地址的内容。一旦你选中了以太网控制器，按下回车键。


    ![config-10.PNG](img/00062.jpeg)


    你现在将看到一个与截图类似的屏幕。


    ![config-11.PNG](img/00063.jpeg)


    现在你需要添加主 DNS 服务器和备用 DNS 服务器。请使用方向键将光标移动到正确的输入字段。在主 DNS 服务器处输入 `8.8.8.8`，在备用 DNS
    服务器处输入 `8.8.4.4`，现在你会得到类似下面的屏幕。


    ![config-12.PNG](img/00064.jpeg)


    使用方向键高亮 `OK` 标签并按回车键，这将带回到选择设备屏幕。使用方向键高亮 `save` 标签并按回车键。


    你现在将返回下面的屏幕。


    ![config-13.PNG](img/00065.jpeg)


    我们现在需要编辑你的 DNS 配置文件。执行此操作，使用方向键高亮 `DNS configuration` 并按回车键。


    你现在将看到一个与截图相同的屏幕。


    ![config-14.PNG](img/00066.jpeg)


    `hostname` 字段项应保持不变，这是我们在安装 CentOS 时分配的服务器主机名。剩余的字段我们需要输入。


    使用方向键高亮每个需要编辑的字段。首先将主 DNS 修改为 `8.8.8.8`，将备用 DNS 修改为 `8.8.4.4`，使其与我们在上一步中配置以太网适配器时输入的内容一致。你可以将三次
    DNS 留空并删除 DNS 搜索路径中的任何信息。


    你现在将看到类似下面的屏幕。


    ![config-15.PNG](img/00067.jpeg)


    使用方向键高亮 `ok` 标签并按回车键，这将带回到选择操作屏幕。高亮 `save & quit` 并按回车键。


    我们现在需要重启服务器使设置生效。在命令行提示符处输入以下命令并按回车：


    ```

    shutdown –r now

    ```


    你的服务器现在将重启。一旦服务器重启，你将会被提示重新登录。登录返回后，你需要输入以下命令。


    ```

    ifconfig

    ```


    这现在将向你展示网络连接设置，并反映分配给你服务器的静态 IP 地址。


    你的服务器现在可以从外部世界访问，并且现在成为一台无头机器。这意味着你现在可以使用 `putty` 或任何其他 SSH 客户端来访问和配置你的 Web 服务器。要测试这一点，你可以使用你的个人电脑。


    为了完成此操作，我们需要使用如 `putty` 这样的软件，这是一个免费的 telnt/ssh 客户端。


    请参阅我们的软件章节获取下载位置


    一旦下载了 `putty`，你不需要安装任何东西，因为这是一个独立的软件客户端。双击下载文件夹中的 `putty` 图标以打开新会话。（如下所示）


    ![putty.PNG](img/00068.jpeg)


    打开 `putty` 后，光标将在一个名为 Host Name（或 IP address）的框中闪烁，在这个框中，你需要输入服务器的 IP 地址。当你输入
    IP 地址后，点击底部的打开按钮。


    由于这是你第一次使用 `putty` 连接到你的服务器，你将看到以下消息。


    ![config-16.PNG](img/00069.jpeg)


    无需担心，我们知道该服务器就是我们认为的那台电脑，所以你只需点击 yes 来确认此操作。


    你需要以 root 用户 (`root`) 登录，并输入你在安装 CentOS 时创建的密码。


    一旦服务器确认了你的用户名和密码，你就登录了。由于你是通过互联网从另一台电脑通过 IP 地址连接到服务器，这意味着你的服务器现在已配置好可以访问互联网。


    要退出 SSH 客户端，输入以下命令并按回车。


    ```

    exit

    ```


    恭喜你，你现在构建了你的第一个基础 Web 服务器。如果你打算在你的 Web 服务器上使用 `cPanel`，在安装 `cPanel` 之前还需要完成一些额外的配置。请参阅第
    7 章。


    # 第六章


    | 在本章，我们将介绍如何构建我们的专用服务器、我们的虚拟专用服务器 (VPS)、创建虚拟专用服务器并让虚拟机在主机启动时自动启动。本章还将涵盖安装主机操作系统、虚拟化软件以及从保存的镜像文件启动
    CentOS |


    ## 构建专用服务器


    构建专用服务器比虚拟服务器 (VPS) 简单得多，你可以在一小时内将一台旧电脑 变成专用服务器。


    正如我们之前在书中介绍的关于选择硬件和使用旧电脑作为服务器的内容，你现在应该已经考虑好了将使用哪种方案。


    一旦你的计算机组装并测试所有硬件工作正常且可以开机，对于专用服务器来说你几乎就完成了。由于专用服务器使用所有硬件的能力，剩下的工作就是安装 CentOS。


    你需要阅读关于创建 CentOS DVD 光盘或 CentOS 可启动 USB 驱动器的章节，然后按照安装 CentOS 的章节操作。


    ## 构建虚拟专用服务器


    虚拟服务器就像计算机内部的计算机。为了实现这一点，它们使用主机操作系统上的虚拟化软件将整个系统的百分比分配给创建的每个虚拟机。


    在决定整个主机的硬件需求时，你需要考虑每个虚拟机需要什么，以及主机需要什么。


    对于书中的示例，我们将允许两个 VPS（虚拟机）和一个主机。每个虚拟机将被分配以下配置：


    * 1 个 cpu

    * 1 GB 内存

    * 20 GB 硬盘空间


    我们的主机操作系统将是 `windows 8 64 bit`，其最低要求是：


    * 1 个 cpu

    * 2 GB 内存

    * 20 GB 硬盘空间


    因此，对于总硬件需求，我们需要：


    * 3 个 cpu

    * 4 GB 内存

    * 60 GB 硬盘空间


    比最低要求多准备一点是一个良好的习惯，以防其中一台虚拟机需要升级或需要创建另一台机器。我选择了 4 核 CPU、4 GB 内存和 500 GB 硬盘。


    一旦硬件完成所有安装并测试了其可以正常启动且所有硬件开机均无任何问题，就是创建主机系统的时候了。


    ### 安装主机操作系统


    主机操作系统是主控制系统。可以创建许多不同的设置，例如 CentOS 系统，然后可以从外部世界访问以控制你的虚拟化软件，但我选择在本文示例中使用 Windows
    操作系统，因为大多数人对 windows 熟悉，并且发现它管理起来稍微容易一点。


    如果你已经安装了带有 `windows` 系统，可以跳过这一步，继续阅读禁用 `windows 8` 的睡眠模式。


    你不必使用 `Windows 8`，我只是为了示例选择了它。`Windows XP` 及更高版本作为主机操作系统运行得非常好；我建议使用 64 位版本而不是
    32 位。


    本安装指南涵盖了从 DVD 光盘或可启动 USB 驱动器安装 `Windows 8`。一旦你决定了如何安装主机操作系统并创建了启动介质，你需要进入系统的 bios
    并选择启动设备。这通常是电脑开机时启动屏幕上的一个选项。


    当你的电脑加载并选择可启动介质后，你将看到以下屏幕。在 Windows 初始化期间，它停顿了几分钟。


    ![windows-1.jpg](img/00070.jpeg)

