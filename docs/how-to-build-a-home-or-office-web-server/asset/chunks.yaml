    \ (advanced)` like which is shown on the bottom right of the above screenshot.\n\
    \nOnce these options are loaded you will be presented with the different options\
    \ for configuring your hard drive.\n\n![windows-8.jpg](images/00077.jpeg)\n\n\
    When Windows has finished installing your screen will change to the screenshot\
    \ below informing you that Windows needs to restart.\n\n![windows-9.jpg](images/00078.jpeg)\n\
    \nAfter restarting you will see the black screen with the blue Windows logo and\
    \ see that setup is getting devices ready, as shown in the below screenshot.\n\
    \n![windows-10.jpg](images/00079.jpeg)\n\nAs soon as that part of the process\
    \ is complete, Windows will alert you that it is going to restart again.\n\n![windows-11.jpg](images/00080.jpeg)\n\
    \nWhen your system restarts again you will be prompted to choose a colour scheme\
    \ for Windows 8 and a PC name, as shown below.\n\n![windows-12.jpg](images/00081.jpeg)\n\
    \nWhen the Settings screen appears, you can choose to customize these settings\
    \ or you can allow Windows to use the express settings. If you are unsure, you\
    \ can click the `Learn more` link and get more details. I chose to use the express\
    \ settings, you can change any or all of these setting later if you want.\n\n\
    ![windows-13.jpg](images/00082.jpeg)\n\nOn the next screen you will be prompted\
    \ to enter how you want to sign into your PC. Windows 8 is designed to work with\
    \ your hotmail account and load emails direct to your PC from hotmail.\n\nIn this\
    \ step you will just leave this blank. You do not want your host system to have\
