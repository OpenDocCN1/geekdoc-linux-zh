    port as shown in the example screenshot below.


    ![ip-4.PNG](images/00133.jpeg)


    In the field `Use DCHP`, it will only have square brackets. The way to insert
    the asterisk in that field is to highlight the field with the cursor and then
    use the space button on your keyboard.


    When you have finished click the `ok` button. You will now see your new Ethernet
    adapter in your Ethernet adapter list. Click the `save` button to save the changes.


    ![ip-5.PNG](images/00134.jpeg)


    When you are returned to the below screen click `save` and quit.


    ![config-13.PNG](images/00135.jpeg)


