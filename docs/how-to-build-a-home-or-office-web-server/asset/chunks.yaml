  raw: 'After a few minutes, you will see the Windows Setup screen shown in the screenshot
    below. This is where you will specify your language settings before clicking next.
    When you do click next the setup will perform some more initialisation tasks in
    the background.


    I preferred the Windows 8 installation as it was very fast and very easy to install.
    Most drivers are already installed during installation so very little is left
    to do or configure.


    Windows 8 will install a basic graphics driver and your LAN driver. Your LAN driver
    is for your Ethernet controller. The one thing that was not installed was the
    sound driver. This is not a problem as we are using this as a host operating system
    for the server and sound and fancy graphics are not required.


    ![windows-2.jpg](images/00071.jpeg)


    Once you have completed the above steps and clicked next you will be prompted
    to install Windows 8 with a screen below.


    ![windows-4.jpg](images/00072.jpeg)


    Once you click the Install now button, you will see the beginning of the information
    collection phase of the installation procedure. The first step is to enter the
    Windows 8 product key.


    ![windows-3.jpg](images/00073.jpeg)


    The next step is the Microsoft Licence agreement. You have to accept the agreement
    if you want to continue with the installation of your Windows 8.


    ![windows-5.jpg](images/00074.jpeg)


    When you are prompted to choose which type of installation you want to perform,
    as shown in  the below screen shot, you will need to choose Custom: Install Windows
    only (advanced) type in order to perform a clean installation of Windows 8.


    ![windows-6.jpg](images/00075.jpeg)


    When you are prompted to choose where you want to install Windows, as shown in the
    screenshot below, you will see a list of any hard drives or partitions that have
    been created.


    There are a number of different options but for the example I will be using the
    whole drive to install Windows 8 on. For people with experience in creating partitions
    and installing operating systems you may wish to create your own custom layout.


    Options for creating the drive layout could be that you wish to install Windows
    8 on a 30 GB partition; this would give you the minimum amount of 20 GB for windows
    8 and then the remaining amount of space for the virtualisation software and the
    CentOS ISO file.


    The remainder of the hard drive could then be formatted as say the X drive and
    used for the virtual machine hard drives. This would give the ability of re-installing
    windows and your virtualisation software quickly if that part of the drive became
    corrupt. All you would need to do would be to load your virtual machines back
    into the virtualisation software and allowing your servers to be back up and running
    quickly.


    ![window-7.PNG](images/00076.jpeg)


    After you have selected your hard drive layout and you click next, the setup creates
    any of the hard drive partitions, or the whole drive, formats it, and then instantly
    moves into the Installing Windows 8 phase which begins with copying and getting
    files ready for the installation; as shown in the screenshot below. This process
    can take a short while.


    If you do wish to create or delete partitions on the selected hard drive you can
    do this by clicking on the Drive options (advanced) like which is shown on the
    bottom right of the above screenshot.


    Once these options are loaded you will be presented with the different options
    for configuring your hard drive.


    ![windows-8.jpg](images/00077.jpeg)


    When Windows has finished installing your screen will change to the screenshot
    below informing you that Windows needs to restart.


    ![windows-9.jpg](images/00078.jpeg)


    After restarting you will see the black screen with the blue Windows logo and
    see that setup is getting devices ready, as shown in the below screenshot.


    ![windows-10.jpg](images/00079.jpeg)


    As soon as that part of the process is complete, Windows will alert you that it
    is going to restart again.


    ![windows-11.jpg](images/00080.jpeg)


    When your system restarts again you will be prompted to choose a colour scheme
    for Windows 8 and a PC name, as shown below.


    ![windows-12.jpg](images/00081.jpeg)


    When the Settings screen appears, you can choose to customize these settings or
    you can allow Windows to use the express settings. If you are unsure, you can
    click the Learn more link and get more details. I chose to use the express settings,
    you can change any or all of these setting later if you want.


    ![windows-13.jpg](images/00082.jpeg)


    On the next screen you will be prompted to enter how you want to sign into your
    PC. Windows 8 is designed to work with your hotmail account and load emails direct
    to your PC from hotmail.


    In this step you will just leave this blank. You do not want your host system
    to have access to your emails and you do not want your host system to require
    a sign in.


    The reason why you do not want your host system to require a sign in is that if
    your system crashes and causes an automatic restart you would not know about this
    and until you came to sign back in all your VPS (virtual machines) would be offline.


    ![windows-14.jpg](images/00083.jpeg)


    Next you will see a green screen as shown in the below screenshot indicating that
    Windows is getting your PC ready. This will take a few minutes and then continue.


    ![windows-15.jpg](images/00084.jpeg)


    The last part of the installation is the apps. Some of you may know that Windows
    8 comes with a host of apps on the start screen. These apps are now being installed
    by default. As this is going to be a host system only, you may want to remove
    some of these apps or make sure things are not running to create as low a usage
    footprint as you can, this will allow for more of the systems usage to be put
    towards your virtual machines.


    ![windows-16.jpg](images/00085.jpeg)


    Once these apps are installed your new Windows 8 installation is complete.


    ![windows-17.jpg](images/00086.jpeg)


    Your Windows 8 host operating system is now installed. There is only one configuration
    option for Windows 8 as the host operating system that is required which is covered
    next.


    ### Disabling sleep mode for Windows 8


    By default Windows 8, like most other Windows operating systems sends the PC to
    sleep after a period of inactivity from the keyboard or mouse. Once our virtual
    machines have been created this will be a headless machine, meaning we will have
    no monitor keyboard or mouse permanently active.


    If the host operating system was to send the system to sleep we would need to
    come back to our system and wake it up to allow are servers to be online 24 hours
    a day. So disabling sleep mode is a necessity.


    In order to load the power options menu move the mouse pointer to the bottom left
    hand of the start screen and right click, and then select power options like the
    screenshot below.


    ![windows-18.jpg](images/00087.jpeg)


    Once the power options loads you will see, balanced (recommended) highlighted
    bold and selected. To the right of this is, change plan settings in blue.


    ![window-19.PNG](images/00088.jpeg)


    Once you have clicked on change plan settings the following screenshot loads.


    ![window-20.PNG](images/00089.jpeg)


    Change the ‘put computer to sleep’ select box to never and click save changes.
    Your host system will not enter sleep mode now after a period of inactivity.


    ### Installing Virtualisation software


    There are various virtualisations software applications available but the one
    that we are going to use is Oracle’s Virtualbox. This is an open source application
    and kept well up to date. I have used this for some time and found it to be very
    easy to use yet very robust for the advanced user.


    Please see our software section for the download location.


    We are going to be using the 64 bit version of Virtualbox for windows hosts. The
    current (at the time of this book) is version 4.2.12 the full name of the version
    that we are going to use is VirtualBox 4.2.12 for Windows hosts x86/amd64.'
