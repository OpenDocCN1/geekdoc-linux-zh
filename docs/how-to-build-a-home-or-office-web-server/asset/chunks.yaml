    # Chapter One

    | In this chapter you will learn about static or dynamic IP addresses, choosing
    your internet service provider (ISP) and configuring your home network to run
    a home or web server.


    ## Static or Dynamic IP addresses

    In order to run a web server no matter if this is from home or a datacenter the
    World Wide Web needs to know where that web server is. This is done with an IP
    address. An IP address is like the phone number of where your server can be found.


    Dynamic IP address change each time your router is turned off and again. If your
    were to run a web server on a dynamic IP address then each time your router was
    turned off and back on you would have to configure your server, name servers and
    domain name to the new IP address. This would then result in new DNS propagation
    being needed and your web site and server could be offline for up to 24 hours
    while DNS propagation takes place.


    There are a few services on the market that lets you use dynamic DNS management
    to point your domain name to your home dynamic IP address; a small monthly fee
    is normally required. With these each time your routers IP is changed it will
    update and start the processes to point your domain name to your new IP. These
    services still result in some down time but most of the configuration is produced
    automatically.


    If you wish to install `cPanel`, which is a server interface that lets you add
    and manage domain names on your server, then you will require a static IP address.
    The `cPanel` licence is only granted to static IP addresses.


    A static IP address means that no matter how long or how often your router is
    turned off, when it re-boots your IP address will always be the same.


    Some internet service providers offer single or multiple IP addresses for a small
    monthly fee. Most virtual private servers, `VPS` use only a single IP address,
    whereas most dedicated servers have at least two IP addresses assigned to them.

