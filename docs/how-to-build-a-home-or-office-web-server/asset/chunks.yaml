- fmt: '

    The motherboard I have selected can take four of these memory sticks giving me
    a total of 16gb memory for each system.


    ## Hard drive


    Seagate 1TB hard drive SATA III 6Gb/s 64mb cache


    There’s not much to say about the hard drive. There are a few to select from but
    I like Seagate hard drives. They have always been reliable for me.


    Hard drives now go up to 4tb so feel free to select the hard drive size that will
    be best for you. If you are running a gaming server or file sharing server then
    maybe a bigger drive would be better. If you just intend to run a simple web server
    then a 1tb would be more than adequate.


    ## Thermal paste


    4g arctic cooling thermal paste


    Thermal paste is used to bind the processor to the heat sink. You only use about
    a pea size on the heat sink and then spread it around. Too much thermal paste
    can be dangerous as it can leak over and onto the motherboard. For these two machines
    you would only need about a 1g tube but I could only find a 4g tube.


    ## Case and power supply


    Silverstone Milo micro ATX with 400w PSU


    Choosing the right case can be very tricky. There are so many in look and functionality
    yet very few jump out and say that’s right for me. There are some things to consider
    before you order the case and power supply unit (`PSU`).


    * Size (where is the case going?)

    * Cooling (does the case have extra fans?)

    * Power supply output (is the wattage high enough?)


    Size is very important. As the case I have selected can fit a micro ATX motherboard
    then it seems ok. But does it fit where I would like to place the server? Have
    a look at the overall size of the case. You will need to add `75mm` to the rear
    of the case in order to allow for the power supply cable and all other cables
    that will be connecting to the rear of the case.


    If you intend to boot your operating systems from a USB pen drive then it would
    be a good idea to make sure that the case has front USB drives.


    Ventilation is a must when the server is intended to be running 24/7. Allowing
    a gap all the way around the case to allow the extra fans to function and air
    to circulate is critical.


    Cooling is of high importance. The processor comes with one fan but the motherboard
    supports one additional case fan. We would need at least one case fan as a must.
    Make sure your case has room for a case fan if it does not already come with one
    installed.


    Power supply unit (`PSU`) with the hardware selected above the power consumption
    would be around `200w`. For the sake of caution I would opt for a minimum of `300w`
    power supply. This comes with a `400w` so that’s ok.


    ## Pre built systems


    If you are not confident of selecting and installing the hardware yourself there
    are a number of pre built systems available on eBay or from your local computer
    supplier each that will meet the correct specifications.


    If you are not sure if the pre built system does meet your needs you can always
    ask them giving them the specifications required; although most will list all
    the specifications in the item description.


    Buying the system pre built will normally be slightly more expensive, (not much)
    and will take away the hassle of choosing the right hardware that’s compatible.
    These will come ready for you to connect your monitor and start installing your
    operating system.


    ## Using an old PC


    If you are not sure if you are ready to take the jump to purchasing new equipment
    just yet and would like to try out the virtualisation software or create a standard
    dedicated server then old laptops or desktop computers are perfect for this.


    If you just want to create a dedicated server from an old desktop or laptop then
    as long as you have a computer that has at least `1gb` memory and `50gb` or more
    hard drive then you should be ok and can go and create your `CentOS` disc or bootable
    USB stick ready to install.


    This would only give you a low performance dedicated server but it would be enough
    to get `CentOS` and `CPanel` installed ready to connect your new server to the
    internet.


    For creating a virtual private server from an old desktop or laptop then you would
    need at least `3gb` memory, `100gb` hard drive and at least a dual core processor.


    `Windows` would require `2gb` memory and `1` core processor to boot up and the
    virtualisation software is then installed on the windows platform. I first tried
    this out on an old HP laptop running `Windows XP`; it was a slow laptop but worked
    well, enough to get the hang of the virtualisation software. I had the VPS server
    that I created `CentOS` and `CPanel` installed up and running in less than a day.
    I then added a website to this which I kept online for about three days in order
    to check stability and functionality.


    I then got an old desktop for `£50` which I used to create a dedicated server
    and did similar with that; installed `CentOS` and `CPanel` then a website. Once
    I was sure that stability and functionality were there I choose to purchase the
    hardware to make more advanced dedicated and virtual private servers.


    From this I then went on to create a small office network of servers through to
    a mini data centre of around 80 servers.


    ## Additional hardware


    Depending on your requirements and how many servers you intend to create and install
    you will also want to consider the following hardware.


    * USB pen drives.

    * DVD Rom drives

    * Network port switch

    * Cat5 or Cat6 Ethernet cables

    * KVM switch


    If you intend to boot your operating systems from DVD discs then you will require
    a DVD Rom for each server. I opted to boot mine from USB pen drives as this then
    allows for less hardware and power consumption. Also as the drive will only be
    required once in a blue moon I felt that was unnecessary.


    A USB pen drive can be transferred from server to server with ease. As I will
    be using the pen drive to boot `windows` and `CentOS` I purchased two `8gb` pen
    drives to create bootable operating systems and a third `8gb` pen drive for transferring
    any drivers or files.


    A network port switch will allow you to bring one Ethernet cable to the switch
    from your hub and then split to allow each server to have the required Ethernet
    connections on the LAN ports. These can be purchased on eBay for around `£12`.
    This would get you an `8` port network switch.


    `Cat5` Ethernet cables are for `100mb` data transfer and Cat6 Ethernet cables
    are for Gigabyte data transfer. Depending on your network switch select the appropriate
    additional cables you will require.


    # Chapter four


    | In this chapter we will cover about CentOS, downloading and creating your CentOS
    6 DVD and Bootable USB ready for installation. |


    ## About CentOS


    `CentOS` (Community Enterprise Operating System) is a Linux based operating system
    and is used by a large majority of servers around the world. `CentOS` is open
    source which means it’s free.


    ### Downloading CentOS


    To download `CentOS` you can either download directly or download the torrent
    file and open it with the likes of `uTorrent` (open source software) to download
    the file. As the `CentOS` discs are large files I prefer to download the torrent
    file.


    Please see our software chapter for the download location.

