    You will now see `eth0` and the make of your Ethernet controller. If you have
    more than one Ethernet controller you will see them listed here. We will cover
    more on multiple IP address later on. Once you have highlighted your Ethernet
    controller press enter.


    ![config-10.PNG](images/00062.jpeg)


    You will now see a screen like the screen shot below.


    ![config-11.PNG](images/00063.jpeg)


    You will now need to add the primary DNS Server and Secondary DNS Server. To do
    this use your arrow keys to bring the cursor to the correct field entry. For the
    Primary DNS Server enter `8.8.8.8` and for the Secondary DNS Server, enter `8.8.4.4`
    which will now give you a screen like below.


    ![config-12.PNG](images/00064.jpeg)


    Use your arrow keys to highlight the `OK` tab and press enter which will bring
    you back to select your device screen. Use your arrow keys to highlight the `save`
    tab and press enter.


    You will now be returned to the below screen.


    ![config-13.PNG](images/00065.jpeg)


    We now need to edit your DNS configuration file. To do this use your arrow keys
    to highlight `DNS configuration` and press enter.


    You will now see a screen the same as the screen shot below.


    ![config-14.PNG](images/00066.jpeg)


    The `hostname` field entry should be left as it is, this is the server hostname
    that we assigned when installing CentOS. The remaining fields we need to enter.


    Use your arrow keys to highlight each of the fields to edit. First edit the Primary
    DNS to `8.8.8.8` and the Secondary DNS to `8.8.4.4` so they match what we entered
    in the previous step configuring your Ethernet adaptor. You can leave Tertiary
    DNS black and delete any information that is in DNS search path.


    You will now have a screen like below.


    ![config-15.PNG](images/00067.jpeg)


    Use your arrow keys to highlight the `ok` tab and press enter which will bring
    you back to select action screen. Highlight `save & quit` and press enter.


    We now need to restart our server for the settings to take effect. Enter the following
    command at the command line prompt and press enter:


    ```

    shutdown –r now

    ```


    Your server will now reboot. Once your server reboots, you will be prompted to
    log back in. Once you have logged back in you will need to enter the following
    command.


    ```

    ifconfig

    ```


    This will now present you with your network connection settings and will now reflect
    your static IP address which has been assigned to your server.


    Your server is now accessible from the outside world and can now become a headless
    machine. This means that you can now use `putty` or any other SSH client to access
    and configure your web server. To test this you can use your personal computer.


    To do this we will need to use software such as `putty` which is a free telnt/ssh
    client.


    Please see our software chapter for the download location


    Once you have downloaded `putty` you will not need to install anything as this
    is a standalone software client. Double click on the `putty` icon which will be
    in your downloads folder to open a new session. (Example below)


    ![putty.PNG](images/00068.jpeg)


    Once `putty` is opened the cursor will be blinking in a box called Host Name (or
    IP address) in this box you need to enter the IP address of your server. When
    you have entered your IP address click the open button at the bottom.


    As this is the first time that you have used `putty` to connect to your server
    you will see the following message.


    ![config-16.PNG](images/00069.jpeg)


    There is no need to worry we know that the server is the computer we think it
    is so you can just click yes to confirm this action.


    You will need to login as the root user (`root`) and the password you created
    when installing CentOS.


    Once the server has confirmed your username and password you will be logged in.
    As you are connecting to your server via IP address from another computer over
    the internet this means that your server is now configured ready for internet
    access.


    To exit your SSH client type the following command and press enter.


    ```

    exit

    ```


    Congratulations have now built your first basic web server. If you intend to use
    `cPanel` on your web server there are a few more configurations that need to be
    done before installing `cPanel`. Please see chapter 7 for this.


    # Chapter six


    | In this chapter we will cover how to build our Dedicated server, our virtual
    private server (VPS), create a virtual private server and have our virtual machine
    auto start on the host start-up. This chapter will also cover installing the host
    operating system, the virtualisation software and booting CentOS from a saved
    Image file |


    ## Building a dedicated server


    Building a dedicated server is much easier than virtual servers (VPS) and you
    can turn an old PC into a dedicated server within an hour.


    As we covered previously in this book about selecting hardware and using an old
    PC for your server you should now have in mind which option you are going to use.


    Once your computer is built and tested that all the hardware works correctly and
    powers up your almost done when it comes to a dedicated server. As a dedicated
    server uses all the hardware’s abilities all that’s left to do is install CentOS.


    You will need to read that chapters on creating a CentOS DVD Rom or a CentOS bootable
    USB drive and then follow the chapter for installing CentOS.


    ## Building Virtual Private Server


    Virtual private servers are like a computer inside a computer. To do this they
    use virtualisation software on a host operating system to assign a percentage
    of the overall system to each virtual machine created.


    When deciding on your hardware requirements for the overall host system you will
    need to consider what each virtual machine will require and what the host will
    require.


    For the example in this book we will allow for two VPS (virtual machines) and
    one host. Each of the virtual machines will be assigned the following:


    * 1 cpu’s

    * 1 GB memory

    * 20 GB hard disc space


    Our host operating system will be `windows 8 64 bit` and the minimum requirements
    for this are:


    * 1 cpu

    * 2 GB memory

    * 20 GB hard disc space


    So for the total hardware requirements we will need:


    * 3 cpu’s

    * 4 GB memory

    * 60 GB hard disc space


    It would be good practise to have slightly more than the minimum in case one of
    the virtual machines needs to be upgraded or another machine needs to be created.
    I have opted for a 4 core CPU, 4 GB memory and a 500 GB hard drive.


    Once the hardware has all been installed and tested that it boots and all the
    hardware powers up without any problems it is time to create the host system.


    ### Installing the host operating system


    The host operating system is the main control system. They are many different
    setups that can be created such as a CentOS system which can then be accessed
    from the outside world to control your virtualisation software but I have opted
    to use a Windows operating system for this example as most people are comfortable
    with windows and will find it slightly easier to manage.


    If you have a system with `windows` already installed you can skip this step and
    continue reading at disabling sleep mode for `windows 8`.


    You do not have to use `Windows 8` I have just chosen this for the examples. `Windows
    XP` and above work perfectly well as the host operating system; I would recommend
    a 64 bit operation system version as opposed to a 32 bit.


    This installation guide covers both installing `Windows 8` from DVD Rom media
    or Bootable USB drive. Once you have decided how you will install your Host Operating
    system and created your bootable media you will need to enter your systems bios
    and select the boot device. This will normally be an option on your computers
    start up screen when you turn it on.


    After your computer loads and selects the bootable media you will be presented
    with the following screen. This did hang for a good few minutes while the windows
    setup initialised.


    ![windows-1.jpg](images/00070.jpeg)

