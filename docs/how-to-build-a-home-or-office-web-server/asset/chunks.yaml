    \ is the Microsoft Licence agreement. You have to accept the agreement if you\
    \ want to continue with the installation of your Windows 8.\n\n![windows-5.jpg](images/00074.jpeg)\n\
    \nWhen you are prompted to choose which type of installation you want to perform,\
    \ as shown in the below screen shot, you will need to choose `Custom: Install\
    \ Windows only (advanced)` type in order to perform a clean installation of Windows\
    \ 8.\n\n![windows-6.jpg](images/00075.jpeg)\n\nWhen you are prompted to choose\
    \ where you want to install Windows, as shown in the screenshot below, you will\
    \ see a list of any hard drives or partitions that have been created.\n\nThere\
    \ are a number of different options but for the example I will be using the whole\
    \ drive to install Windows 8 on. For people with experience in creating partitions\
