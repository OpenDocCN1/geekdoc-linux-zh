    我们将创建的文件是一个 `.bat` 文件。这种文件可以在系统启动时运行并加载已安装的程序。


    要创建一个 `.bat` 文件，你需要创建一个新的文本文档。在桌面上右键点击，选择 `new`（新建），然后选择 `Text document`（文本文档）。这将在桌面上创建一个新的文本文档。将其重命名为更合适的名称。我将其命名为
    `onLoad`。


    打开你的新文本文档，你将在这里输入启动启动新虚拟机的命令。


    只需要输入两行代码，列如下所示。第一行是 `cd`，它是打开文件夹的命令，然后是你安装 Oracle VirtualBox 的完整路径（如果你在默认位置安装了
    VirtualBox，那么你的路径将与我的一样。但值得双重检查）。


    第二行是启动 VirtualBox 管理器并启动虚拟机的命令 `VBox Manage.exe startvm`。然后我们输入虚拟机的名称，在本例中它是 `VPS-1`。


    ```

    cd "C:\Program Files\Oracle\VirtualBox\"

    VBoxManage.exe startvm "VPS-1"

    ```


    现在，我们需要将此文本文档保存为 `.bat` 文件。点击文件（file），然后选择另存为（save as）。在文件名字段中输入文件名，后加上 `.bat`。在示例中我们使用
    `onLoad.bat`，在另存类型字段中选择 `All Files`（所有文件）并点击保存。


    ![vps-21.PNG](img/00124.jpeg)

    ![vps-22.PNG](img/00125.jpeg)


    现在你的桌面上有一个像这样的图标：


    这就是每次当你的主机系统启动时启动你虚拟机的文件。由于你将来可能会创建多个虚拟机，如果每次需要编辑文件都要去启动文件夹，将非常耗时。我们可以将 `onLoad`
    bat 文件留在桌面上，创建一个快捷方式并将其剪切、粘贴到启动文件夹中。


    右键点击你新创建的 bat 文件并选择 `create shortcut`（创建快捷方式）。快捷方式现在将创建并保存在桌面上。


    将此快捷方式剪切并粘贴到启动文件夹。现在你可以关闭所有打开的窗口并重启主机系统。当你的主机系统重启时，你的虚拟机将自动启动。


    当你的主机系统启动时，你将看到一个命令框打开，如下方的截图所示，然后你的虚拟机或多个虚拟机将开始启动。


    ![vps-23.PNG](img/00126.jpeg)


    如果你需要多个虚拟机在系统启动时启动，只需添加带有该机器名称的第三行。如下：


    ```

    VBoxManage.exe startvm "VPS-2"

    ```


    # 第七章


    | 本章中，我们将介绍配置适用于 CPanel 的 CentOS，并为你的服务器添加额外的 IP 地址。 |


    ## 配置 CentOS


    CentOS 在安装 cPanel 之前需要一些简单的配置。这些配置都相对简单，完成时间不会超过 15 分钟。


    cPanel 自带了 webmail，如果你正在安装 cPanel，你很可能会直接使用随包一起的 webmail。我们创建的 CentOS 安装已经安装并运行了
    `postfix`。当 `postfix` 安装并运行时，它会与 webmail 发生冲突，因此我们需要禁用并移除它。


    cPanel 官方表示他们正在作为 cPanel 安装的一部分解决停止和移除 `postfix` 的问题，但为了安全起见，我们将先停止并移除它。


    为了执行所需的配置，你需要登录到服务器。打开你的 `SSH` 客户端，使用 CentOS 安装和网络配置期间创建的 IP 地址、用户名和密码登录服务器。


    登录后，你需要运行以下两个命令，每条命令后按回车键。


    ```

    service postfix stop

    rpm –e postfix

    ```


    `Postfix` 现在已从你的服务器上停止并移除。


    接下来，我们需要禁用默认 CentOS 防火墙。同样，只需要输入两个命令。


    ```

    chkconfig iptables off

    service iptables stop

    ```


    接下来，我们需要禁用 SELinux 安全功能。要做到，我们需要编辑配置文件。


    要打开并编辑配置文件，你需要输入以下命令：


    ```

    vi /etc/selinux/config

    ```


    要开始编辑配置文件，按下键盘上的 `(i)` 键进入文本编辑器的插入模式。使用方向键移动到第 6 行，那里显示为 `SELINUX=enforcing`，你需要将其更改为
    `disabled`。更改完毕后，你需要保存并退出文本编辑器。


    按下键盘上的 `esc` 键。


    按下键盘上的 `(:)` 键，然后按 `(w)` 键，这将保存配置文件。


    按下键盘上的 `(:)` 键，然后按 `(q)` 键，这将退出文本编辑器并返回命令行提示符。


    要确认更改已生效，你可以通过输入以下命令再次查看配置文件。


    ```

    vi /etc/selinux/config

    ```


    编辑配置文件后，你应该得到一个类似于下面的文件：


    ```text

    # 此文件控制系统上 SELinux 的状态。

    # SELINUX= 可以取以下三个值之一：

    # enforcing - 强制执行 SELinux 安全策略。

    # permissive - SELinux 打印警告而非强制。

    # disabled - 不加载任何 SELinux 策略。

    SELINUX=disabled


    # SELINUXTYPE= 可以取以下两个值之一：

    # targeted - 仅保护目标网络守护进程。

    # strict - 全 SELinux 保护。

    SELINUXTYPE=targeted

    ```


    现在我们需要移除一些不需要的 yum 组。在我们完成的 CentOS 安装中，我们需要移除以下 yum 组：


    * E-mail Server

    * FTP Server

    * KDE Desktop

    * Web Server

    * X Window System


    记得按照所示的大写和小写字母准确输入每一个项。


    要移除这些组，输入以下命令：


    ```

    yum groupremove “E-mail Server” “FTP Server” “KDE Desktop” “Web Server” “X Window
    System” own

    ```


    在移除过程中，系统会要求你通过 Y/N 。只需输入 `y` 表示是，然后按回车。


    所有配置已完成；我们只需要运行更新。要执行更新，输入以下命令：


    ```

    yum update

    ```


    在更新期间，系统会要求你通过 Y/N 。只需输入 `y` 表示是，然后按回车。


    现在 CentOS 已经完成了所有配置要求，我们需要重启服务器。要重启服务器，输入以下命令：


    ```

    shutdown -r now

    ```


    ## 为 VPS 添加额外的 IP


    Web 服务器可以使用单个 IP 地址运行，但某些时候需要多个 IP 地址。由于我们的主机系统上安装了虚拟化软件，我们可以为创建的每个虚拟机分配多四个静态
    IP 地址。


    第一步是为分配的 IP 地址创建硬件。打开 Oracle VirtualBox 管理器窗口，选择你想要添加额外 IP 地址的虚拟机。确保虚拟机已关闭，并点击
    `settings`（设置）。


    当设置窗口打开时，从左侧菜单选择 `network`（网络），然后在打开的窗口中如截图所示选择 `adapter 2`。


    ![ip-1.PNG](img/00127.jpeg)


    点击 `Enable Network Adapter`（启用网络适配器）旁边的复选框，这将开启第二个以太网适配器。`attached to:` 处选择 `bridge
    adapter`，这是告诉虚拟化软件共享主机系统的以太网控制器。


    点击 `advanced`（高级）选项卡并记录 MAC 地址，你会发现 `adapter 2` 的 MAC 地址与 `adapter 1` 不同，尽管它们共享同一个以太网端口，我们有两个不同的
    MAC 地址会在我们的路由器中注册，并允许我们为每个地址分配静态 IP 地址。


    启动你的服务器，并使用 CentOS 安装期间创建的 `root` 用户名和密码登录。


    在命令行输入以下：


    ```

    system-config-network

    ```


    这将打开网络配置窗口。你现在看到的应该是截图所示。


    ![config_8.PNG](img/00061.jpeg)


