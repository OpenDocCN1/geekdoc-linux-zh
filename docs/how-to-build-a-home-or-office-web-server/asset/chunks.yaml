    The below message will also most likely appear stating that the below storage
    device may contain data. If this appears and you are confident that there is no
    data on the hard drive that needs backing up or keeping you may select, `Yes`,
    discard any data.


    A small box will appear for just a few seconds, maybe longer if you have a very
    large hard drive stating examining storage device.


    ![centos_7.1.PNG](images/00017.jpeg)


    Once your hard drive is initialized and accepted as a suitable storage device
    you will be taken to the next screen to continue you installation.


    You will now need to fill in the hostname of the server (e.g. `server1.example.com`),
    then click on the `Configure Network` button:


    As this will be a web server which will most likely host your website it would
    be a better idea to replace `example.com` with your domain name. Hostnames must
    be a fully qualified domain name. It is acceptable to have `server1\.` or `vps1\.
    But the hostname must end with a domain name.


    ![centos_8.png](images/00018.jpeg)


    After the clicking the `Configure Network` button the network Connections window
    will popup. Select `System eth0` and click `edit` to configure your network.


    ![centos_9.png](images/00019.jpeg)


    After the `edit` button is selected a further popup box will appear as per below.
    Click on the, `connect automatically` check box and then on the `IPv4 Settings`
    tab.


    Under the `Method:` dropdown box make sure that `Automatic (DHCP)` is selected
    and click on `apply` which will close the Editing System eth0`.


    ![centos_10.PNG](images/00020.jpeg)


    The reason why we are allowing automatic DCHP rather than setting the static IP
    address here is that each `eth0` connection has its own mac address and we will
    be assigning the IP address later on in the BT gateway hub.


    You will now need to click close the network connections box and they you will
    see a message appear as per below.


    ![centos_11.PNG](images/00021.jpeg)


    Once the above message closes off your network connections are completed and you
    can proceed.


    Depending on the speed of the server the message can only be displayed for a split
    second so you may miss it. As long as you don’t see any error messages then you
    will be ok to continue with the installation.


    If waiting for network manager returns an error message this is most commonly
    an error message because you have not connected your server via the Ethernet cable
    to your network port switch or your gateway hub.


    Make sure you have connected your Ethernet cable and try the settings again.


    If you have multiple Ethernet ports on your server and are intending to use more
    than one you will need to perform these settings for each of the system `eth0`
    ports.


    When the screen is returned back to the below screen shot you can click `next`
    to continue the installation of CentOS.


    ![centos_12.png](images/00022.jpeg)


    You now need to select your time zone; you can use the dynamic map or use the
