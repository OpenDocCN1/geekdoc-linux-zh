    下述消息也可能出现，提示下面的存储设备可能包含数据。如果出现此消息，且您确定硬盘上没有需要备份或保留的数据，您可以选择 `Yes` 并丢弃任何数据。


    将会弹一个小窗口，持续几秒钟（如果您的硬盘非常大，时间可能会更长），显示“正在检查存储设备”。


    ![centos_7.1.PNG](img/00017.jpeg)


    一旦您的硬盘已完成初始化并被接受为合适的存储设备，您将进入下一个屏幕继续安装。


    现在，您需要填写服务器的主机名（例如 `server1.example.com`），然后点击 `Configure Network` 按钮：


    由于这将作为一个可能托管您网站的 Web 服务器，因此将 `example.com` 替换为您的域名会更好的主意。主机名必须是完全限定域名（FQDN）。使用
    `server1\.` 或 `vps1\.` 是的，但主机名必须以域名结尾。


    ![centos_8.png](img/00018.jpeg)


    点击 `Configure Network` 按钮后，会弹出网络连接（Connections）窗口。选择 `System eth0` 并点击 `edit`
    来配置网络。


    ![centos_9.png](img/00019.jpeg)


    选择 `edit` 按钮后，会出现一个如下所示的进一步弹出框。点击 `connect automatically` 复选框，然后点击 `IPv4 Settings`
    选项卡。


    在 `Method:` 下拉框中，确保选择了 `Automatic (DHCP)` 并点击 `apply`，这将关闭 `Editing System eth0`
    窗口。


    ![centos_10.PNG](img/00020.jpeg)


    我们在这里允许自动 DHCP 而不是设置静态 IP 地址的原因是，每个 `eth0` 连接都有自己的 MAC 地址，我们将在稍后在 蓝牙网关集线器（BT gateway
    hub）中分配 IP 地址。


    现在，您需要关闭网络连接框，然后您将看到一条如所示的消息出现。


    ![centos_11.PNG](img/00021.jpeg)


    一旦关闭上述消息，您的网络连接即告完成，您可以继续。


    取决于服务器的速度，该消息可能只显示一瞬间，您可能会错过它。只要您没有看到任何错误消息，就可以继续进行安装。


    如果等待网络管理器（network manager）返回错误消息，最常见的原因是您没有通过以太网线将服务器连接到网络端口交换机或网关集线器。


    请确保您已连接以太网线并重试设置。


    如果您的服务器上有多个以太网端口且您打算使用多个，您将需要对每个系统 `eth0` 端口执行这些设置。


    当屏幕返回到如下所示时，您可以点击 `next` 继续安装 CentOS。


    ![centos_12.png](img/00022.jpeg)


    您现在需要选择您的时区；您可以使用动态地图，也可以使用下拉列表来设置您的时区。完成后点击 `next`。


    ![centos_13.png](img/00023.jpeg)


    在登录服务器时，主用户名始终是 `root`。如果您打算安装 cPanel、访问 WHM 面板并配置 cPanel，您的用户名将是 `root`，连同您在此处选择的密码。您用于
    SSH 连接的主用户名将是 `root` 以及您在此处选择的密码。


    在这里，您需要为 `root` 用户设置密码。连接到外部（互联网）的服务器会受到攻击，因此不建议在此处设置弱密码。使用大写和小写字母结合数字组合是一个良好的习惯。


    现在记录下这些细节也是个好主意。主用户始终是 `root`，您的密码是现在选择的。您的 root 密码至少需要六个字符。


    ![centos_14.png](img/00024.jpeg)


    接下来我们进行分区。选择 `use all space`。这将为您提供一个较小的 `/boot` 分区较大的 `/` 分区，这对于大多数用途来说都是的。


    如果您打算在服务器上安装 cPanel，最好的办法是创建一个自定义布局。这是 cPanel 建议的但并非强制性的。如果您需要此步骤，请现在阅读关于“创建自定义硬盘布局”的章节，然后返回继续安装。


    ![centos_15.png](img/00025.jpeg)


    现在您会被要求将更改写入磁盘。点击选择 `write changes to disk` 的按钮。


    ![centos_16.png](img/00026.jpeg)


    如果您选择了查看或修改分区布局，您将看到两个额外的屏幕。在此阶段，您不需要修改任何分区，因为我们将在本章的单独部分介绍创建自定义分区。


    现在您将看到分区的硬盘结构。点击 `next`。


    ![centos_16.1.PNG](img/00027.jpeg)


    硬盘现在将按照所需的分区格式化。


    ![centos_17.PNG](img/00028.jpeg)


    点击 `next` 以确认在所选分区上安装引导程序。


    ![centos_17.1.PNG](img/00029.jpeg)


    接下来我们需要选择想要安装的软件。选择 `Basic Server`，然后在附加存储库（additional repositories）字段勾选 `CentOS`，选择
    `Customize later` 并点击 `next`。


    ![centos_18.png](img/00030.jpeg)


    CentOS 的安装现在开始。这通常需要 10 分钟完成。


    ![centos_19.PNG](img/00031.jpeg)


    安装完成后，您可以从 Rom 驱动器移除 DVD 介质并点击 `reboot` 按钮。


    ![centos_20.PNG](img/00032.jpeg)


    您已在服务器上成功安装了 CentOS 基础操作系统，现在已准备好供您配置和更新。


    服务器重启后，您可以使用用户名 `root` 和之前创建的密码登录 CentOS。


    接下来，您需要配置安装以访问互联网。要此操作，请阅读本章末尾关于配置互联网访问的章节。


    ## 创建自定义硬盘布局


    在安装 Red Hat Enterprise Linux 时，建议使用 `ext` 文件系统（`ext2`、`ext3` 或 `ext4`）。


    我列出了 CentOS 最常用的分区系统和 cPanel 服务器配置设置。如果您的服务器需要，您可以在这些基础上添加更多可选分区，但此配置对于大多数服务器来说足够了。


    | `/boot` | 495MB |

    | `/temp` | 2GB |

    | `swap` | 服务器内存的两倍 |

    | `/` | 增长填充磁盘 |


    `/boot` 分区用于服务器的内核（Karnels）、引导程序和配置文件。


    `/temp` 分区是服务器上存储所有临时文件的地方。


    `swap` 分区用于系统可以写入到硬盘的内存 溢出部分。


    `/` 分区被设置为增长填充磁盘，是服务器的主分区，也是存储基础操作系统的地方。cPanel 将安装在此处并创建任何所需的目录，如 `/home`、`/var`
    和 `/usr`。


    为了创建分区的自定义布局，您需要在安装屏幕上选择 `create custom layout`，您想进行哪种类型的安装？


    一旦您按照下面的屏幕选择了 `create custom layout`，点击 `next`。这将带您进入编辑和修改硬盘分区。


    ![centos_21.PNG](img/00040.jpeg)


    您现在将看到名为 `sda` 的硬盘以及如下所示的空闲空间。如果您看到所示之外的其他分区卷，请删除它们，因为它们是该硬盘上之前的安装残留。


    ![centos_22.PNG](img/00041.jpeg)


    高亮 `sda` 硬盘下方的空行，并点击屏幕底部的 `create`。


    ![centos_23.PNG](img/00042.jpeg)


    在出现的名为 `create storage` 的小弹出框中，选择 `standard partition` 并点击 `create`。


    ![centos_24.PNG](img/00043.jpeg)


