- fmt: '

    From that web page you can select your mirror site to download CentOS 6.3 from.
    I used the first one on the list. This opens up in a new web page. On this web
    page you will see a list of file names. We need DVD 1 only but for speed I downloaded
    the file `CentOS-6.3-x86_64-bin-DVD1to2.torrent` and opened this in `uTorrent`
    to start my download.


    Once the download is completed you will need to burn the ISO file to a DVD disc.
    Remember we only need to use DVD 1 for our examples. To burn the ISO file to disc
    I used `image burn` which again is open source software.


    If you require any help with download and using `uTorrent` or `image burn` please
    see the sections below.


    ## uTorrent


    Please see our software chapter for the download location.


    When you have opened the `uTorrent` web page click `get uTorrent`, this will open
    a new page for you to select the `uTorrent` version.


    All we need is the free version so click `free download`, this will refresh your
    page and start your download. There is also on screen instructions for installing
    `uTorrent`.


    Your CentOS DVD 1 to 2 download will take some time depending on your broadband
    speed so please be patient. Once completed you will now have a folder called ‘CentOS’
    in your downloads folder or where you have selected `uTorrent` to store your downloads.


    ## Image burn


    Please see our software chapter for the download location.


    Do not click on any of the download buttons on the page that opens. Most of these
    are paid advertisements and will take you to other websites. On the menu bar at
    the top of the page you will see, `News` | `Download` | `Change log`


    Click on `Download`, this will take you to a new page with a list of mirror sites
    to start a download from. I used the second mirror site on the list which when
    opened has a big blue box for download now on the right had of the page. This
    then begins your `imgBurn` download.


    Once downloaded you double click and follow the onscreen prompts to install `image
    burn`.


    Once `image burn` has been installed open your `CentOS` folder that has been downloaded
    and right click on the `CentOS` DVD 1 `.img` file, select `open with ImgBurn`.


    This will now prompt you to enter your blank DVD and start your burn to disc.


    ## CentOS bootable USB Pen Drive


    Once you have your CentOS ISO image file you can use this to create a bootable
    USB drive. You will need software for this. I used the open source software `ISO2USB`
    for `CentOS/RedHat`.


    This is free software and very simple to use. It will install a bootable version
    of CentOS on your pen drive in about 10 minutes. You can then use this bootable
    pen drive on all your servers time and time again.


    Please see our software chapter for the download location.


    Once downloaded you will need to extract the file contents with `Winrar` or `WinZip`
    to your chosen file location.


    You will now see an `ISO2USB` image incon in your chosen folder. Double click
    on this to open the program.


    ![iso2usb.png](images/00001.jpeg)


    Make sure the `Diskimage` button is clicked and leave this set to `ISO` and select
    the ISO file location, which in this case will be the `CentOS` DVD Rom Disc one
    we downloaded previously.


    Leave the `Hard Disk` name and `USB Device` name as they are which should be `sda`.


    Select your USB Drive and the Drive location. This will most probably all ready
    be selected for you. Click `ok` and this will now create your bootable CentOS
    USB pen drive.


    ## Windows Boototable USB drive


    As we will be using Windows 8 as the host operating system we will also need to
    create a bootable USB pen drive for this.


    First with your Windows 8 operating system disc you will need to create an image
    file on your computer. Open `image burn` and select `create image file from disc`.


    Make sure you have inserted your Windows 8 DVD disc into your DVD writer and select
    the location on your computer to store the image file. Click the `Read` button
    on the bottom of `image burn` and this will create your ISO image file.


    From this image file you can now create your bootable USB pen drive.


    There are other programs that can create this but I stuck with a Microsoft program
    which is the `Windows 7 USB DVD download tool`.


    Please see our software chapter for the download location.


    Don’t worry this will create other bootable Windows operating system discs. Once
    downloaded follow the on screen instructions and create your Windows 8 bootable
    USB pen drive.


    This is a self extracting Microsoft program. Find the download in your downloads
    folder and double click.


    ![snipping_1.PNG](images/00002.jpeg)


    Once the previous image loads select `run` to start your installation.


    The next image will be the welcome screen. Click `next`


    ![snipping_2.PNG](images/00003.jpeg)


    ![snipping_3.PNG](images/00004.jpeg)


    We are now ready to install `Windows 7 USB/DVD download Tool`. Once you click
    `Install` the program will start the installation screen, depending on your computer
    it will only take a few seconds to install.


    ![snipping_4.PNG](images/00005.jpeg)


    When the `Completed the Windows 7 USB/DVD Download Tool Setup Wizard` screen appears
    click `Finish` to exit the installer.


    You will now have the `Windows 7 USB DVD download tool` icon on your desktop.
    Double click this to open the program.


    ![snipping_5.PNG](images/00006.jpeg)


    Click `Browse` to select the location of your Windows 8 ISO file you created earlier.


    ![snipping_6.PNG](images/00007.jpeg)


    Next we need to choose our media type. Click `USB device`.


    ![snipping_8.PNG](images/00008.jpeg)


    You should now see your USB device selected and available storage. If you have
    files on your USB pen drive I would recommend backing them up as the tool will
    reformat the USB pen drive.


    ![snipping_9.PNG](images/00009.jpeg)


    The `Windows 7 USB/DVD download tool` will now format the USB pen drive and copy
    the files needed across. This will take about 10 to 15 minutes depending on your
    computer.


    # Chapter five


    | In this chapter we are going to install our CentOS 6.3 Operating system from
    both DVD Rom and Bootable USB pen drive. We will then configure CentOS for internet
    access and assign a static IP address to the server. |


    ## Installing CentOS 6.3 from a DVD Rom Disc


    Now that we have our dedicated server hardware ready and our CentOS 6.3 DVD 1
    on disc we can start with installing the server base operating system.


    Select your server to boot from CD and insert your CentOS DVD 1 in your DVD Rom
    drive.


    ![centos_1.jpg](images/00010.jpeg)


    Once the above screen loads you will need to select install or upgrade an existing
    system.


    The next screen to appear is to begin testing the media before installation. Choose
    `skip` to skip the media test and start the installation.


    Testing the media does take some time and there should not really be a problem
    with the installation media so you will be ok to skip this test and start the
    installation off your CentOS 6.


    ![centos 2.png](images/00011.jpeg)


    The welcome screen of CentOS will now be displayed. Click `next` of the screen
    that appears as below.


    ![centos_3.png](images/00012.jpeg)


    You will now be asked to select your keyboard language for your CentOS installation.
    As per the screen below.


    ![centos_4.png](images/00013.jpeg)


    After clicking next on select you language you will be presented with the screen
    as per below, select you keyboard language. For those that have installed operating
    systems before this will all seem very familiar.


    ![centos_5.png](images/00014.jpeg)


    As with our server build we are using a locally attached hard drive you should
    select basic storage devices on the following screen.


    ![centos_6.png](images/00015.jpeg)


    You might see the following warning - Error processing drive. If you see this
    click on the `Re-initialize all` button to proceed:


    ![centos_7.png](images/00016.jpeg)

