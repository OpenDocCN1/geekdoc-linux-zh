  raw: 'Now we will have loaded the configuration area for the selected virtual machine
    which will look like the example screenshot below.


    ![vps-11.PNG](images/00113.jpeg)


    Click on system from the menu on the left hand side.


    ![vps-12.PNG](images/00114.jpeg)


    First we need to change the boot order; we will not be using floppy in our boot
    order so this can be unchecked. Next highlight Hard Disk, make sure it is checked
    and use the arrow next to boot order to bring Hard Disk to the top. Now, below
    hard Disk bring CD/DVD-ROM up to make that as the second boot device and make
    sure this again is checked.


    If you want your server to have more than one processor then you can change this
    by selecting the Processor tab. Once this opens you can use the slider, or the
    text input box to increase the processor CPU’s availability for the server. I
    have left this as 1 CPU for the example.


    ![vps-13.PNG](images/00115.jpeg)


    Windows 8 may not have installed your audio drivers. This is not a problem as
    we are creating servers, which do not require audio. If you have not got the audio
    driver installed, it will be better to disable audio on the server so that each
    time VirtualBox Manager loads and your server boots up you do not get a warning
    message about this.


    Select Audio from the menu on the left hand side, when the page loads uncheck
    the check box named enable audio, to disable the audio on the server.


    ![vps-14.PNG](images/00116.jpeg)


    Next we need to configure the networking so that the server has an internet connection.
    Select network from the menu on the left hand side which will load the page as
    shown below.


    ![vps-15.PNG](images/00117.jpeg)


    Once the page loads you will see a list of adapters numbered 1 -4\. These are
    your Ethernet ports; which each server has. You can have a maximum of four per
    server which means you can assign a maximum of four static IP addresses to each
    of your servers.


    With adapter 1 selected click the advanced tab in the centre of the screen. This
    will load a few more fields of information. Make sure that Enable Network Adapter
    is checked, next underneath you will find a select box which is named Attached
    to: use the select box and select Bridged Adapter.


    Underneath that you will then see the name of your network adapter. This means
    that the one Ethernet port on your host system has been virtualised and all adapters
    access the internet via that one Ethernet port.


    As the BT hub can only assign static IP addresses to a dedicated Mac address,
    and each Ethernet port has one Mac address, then the virtualisation software will
    assign a slightly different Mac address to each adapter; in effect, creating a
    virtual Mac address from the hosts’ single Ethernet port.


    It might be worth making a note of the Mac address that has been assigned for
    later when we shall be assigning the IP address.


    ![vps-16.PNG](images/00118.jpeg)


    Click ok to save the settings and return to the main Manager screen.


    Your Virtual Machine has almost been made into your VPS. There are just a few
    more steps to take before we are ready to turn your machine on, and install the
    server software.


    ### Installing CentOS 6.3 from a Saved Image


    If you have built your host system without a DVD-ROM drive and booted your host
    system for a USB drive then at the moment you have no way of installing the CentOS
    server operating system onto your new virtual machine.


    Oracles VirtualBox has the added feature of being able to install the operating
    system directly from a saved image file. This is the ISO file that was downloaded
    before you created you bootable media.


    With a USB Pen drive you can copy the CentOS-6.3-x86_64-bin-DVD1 ISO file from
    the computer you downloaded it from and save it to your host systems desktop.


    Once you have saved your CentOS ISO file to your desktop you can select your new
    virtual machine to install the operating system from that.


    Open your VirtualBox manager page, select your server from the left hand menu
    and click the settings tab at the top.


    When the settings menu loads you will need to select storage from the left hand
    side menu to load the hard drive screen. On this screen you will see your storage
    tree and then two devices in that tree.


    The first is your virtual machines hard drive which was created when building
    your virtual machine. In this example mine is called VPS-1.vdi, under that I have
    a device called Empty. Highlight this device which will change the attributes
    section to the right.


    Under the attributes settings you will see CD/DVD Drive: and this should be listed
    as IDE Secondary Master in the select box. To the right of that select box you
    will see a small disc.  Click on the disc and a small menu will open, click on
    Choose a CD/DVD disc file.


    A browse window will open that allows you to browse your computer to find where
    you have stored your CentOS ISO file. When you have selected your file you will
    see the attributes section change and the device name change from Empty to your
    ISO file name.


    Click ok to save and exit.


    ![vps-17.PNG](images/00119.jpeg)


    Your virtual machine is now ready to have your CentOS server operating system
    installed.


    When you have returned to your Virtual manager Window select your server and then
    click start.


    When you turn on your machine you will see a few small message windows that appear
    and until you accept these your machine will not boot. It’s worth taking a note
    of these messages as we need to select the checkbox not to show this message again
    or we won’t be able to use the auto boot feature in case you host system crashes
    and re-boots.


    ![vps-18.PNG](images/00120.jpeg)


    Your machine will now start to load. As we have selected the first boot device
    to be the hard drive your machine will check the hard drive to boot the operating
    system. When it detects that there is no operating system installed on the hard
    drive it will check the CD/DVD ROM drive.


    As you have no CD/DVD ROM drive installed that is why we configured the virtual
    manager settings for this machine to treat the ISO file as the CD/DVD ROM drive.


    While your machine is detecting these the screen will look like the screenshot
    below. This does only take a few seconds.


    It’s worth making a note that if you want to select a boot device press F12 this
    is shown in the bottom of the screen like in the example screenshot below.


    Right now you don’t need to know this but for future reference if you have an
    operating system installed and you want to re-format the server pressing F12 will
    allow you to select the boot device as a one of event. From there you would select
    boot from CD/DVD ROM drive.


    ![vps-19.PNG](images/00121.jpeg)


    The screen will change automatically to the beginning of installing CentOS. For
    instructions on installing CentOS please see the chapter on installing CentOS
    from a CD/DVD ROM drive.


    ### Auto start VPS on server boot up


    Now that we have our host system built, our virtualisation software installed,
    and our first server built, we need to allow our server to auto start if the host
    system is ever re-started.


    In order to do this it is really simple on a Windows operating system. Windows
    has a folder which it checks each time Windows first loads, this folder is called
    Startup. In some versions of windows the Startup folder can be located differently
    and be in a different location.


    On Windows 8 you can access the Startup folder by using the run command.


    From the start screen on Windows 8 type run. (This is the screen where all your
    apps are shown).


    ![windows-17.jpg](images/00122.jpeg)


    When the run window opens type in the following command


    %AppData%


    ![vps-20.PNG](images/00123.jpeg)


    This will open the roaming folder letting you view the folders located within.
    You will find the Startup folder in \Microsoft\Windows\Start Menu\Programs


    Once you have navigated to the Programs folder double click to open the Startup
    folder.


    You can minimise this folder for the moment as we need to create a file first.'
