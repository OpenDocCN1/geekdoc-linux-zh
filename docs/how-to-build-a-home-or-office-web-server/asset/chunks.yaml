    现在我们已经加载了所选虚拟机的配置区域，界面将如下例所示。


    ![vps-11.PNG](img/00113.jpeg)


    点击左侧菜单上的 `system`。


    ![vps-12.PNG](img/00114.jpeg)


    首先，我们需要更改启动顺序；我们的启动顺序中不会使用 `floppy`（软盘），因此可以取消勾选。接下来，选中 `Hard Disk`（硬盘），确保它是勾选状态，并使用启动顺序旁边的箭头将
    `Hard Disk` 移至顶部。现在，在 `hard Disk` 下方将 `CD/DVD-ROM` 向上移动作为第二个启动设备，并确保它同样也被勾选。


    如果你希望服务器拥有多个处理器，可以通过选择 `Processor`（处理器）选项卡来更改。打开该选项卡后，可以使用滑块或文本输入框来增加服务器 CPU 的可用性。在示例中，我将其留为
    `1 CPU`。


    ![vps-13.PNG](img/00115.jpeg)


    Windows 8 可能没有安装您的音频驱动程序。这不是问题，因为我们正在创建不需要音频的服务器。如果您没有安装音频驱动程序，最好在服务器上禁用音频，这样每次
    `VirtualBox Manager` 加载和您的服务器启动时，都不会收到关于此此的警告消息。


    从左侧菜单选择 `Audio`（音频），页面加载后，取消勾选 `enable audio`（启用音频）复选框，以禁用服务器音频。


    ![vps-14.PNG](img/00116.jpeg)


    接下来，我们需要配置网络以便服务器连接互联网。选择左侧菜单上的 `network`（网络），这将加载所示页面。


    ![vps-15.PNG](img/00117.jpeg)


    页面加载后，你将看到一个编号为 `1-4` 的适配器列表。这些是每个服务器拥有的以太网端口。每个服务器最多有四个，这意味着你可以为每台服务器分配最多四个静态
    IP 地址。


    选中 `adapter 1` 后，点击屏幕中间的 `advanced`（高级）选项卡。这将加载更多信息字段。确保 `Enable Network Adapter`（启用网络适配器）已勾选，在下方你会找到一个名为
    `Attached to:`（连接到：）的选择框，使用该选择框并选择 `Bridged Adapter`（桥接适配器）。


    在下方你将看到网络适配器的名称。这意味着主机系统上的以太网端口已虚拟化，所有适配器都通过这个以太网端口访问互联网。


    由于 BT 路由器只能为特定的 Mac 地址分配静态 IP 地址，而每个以太网端口有一个 Mac 地址，因此虚拟化软件将为每个适配器分配略有不同的 Mac
    地址；实际上是从主机的单个以太网端口创建了虚拟 Mac 地址。


    值得记录下分配的 Mac 地址，以备稍后分配 IP 地址时使用。


    ![vps-16.PNG](img/00118.jpeg)


    点击 `ok` 保存设置并返回主管理器界面。


    你的虚拟机几乎已经变成了你的 VPS。在准备启动机器并安装服务器软件之前，只剩下几个步骤需要完成。


    ### 从保存的镜像安装 CentOS 6.3


    如果你在构建主机系统时没有安装 DVD-ROM 驱动器，并且通过 USB 驱动器启动主机系统，那么目前你无法将 CentOS 服务器操作系统安装到新的虚拟机中。


    Oracle VirtualBox 具有一项额外功能，即可以直接从保存的镜像文件安装操作系统。这就是在你创建可启动介质之前下载的 ISO 文件。


    使用 USB 优盘，你可以从下载文件的电脑上拷贝 `CentOS-6.3-x86_64-bin-DVD1` ISO 文件，并将其保存到主机系统的桌面上。


    一旦你将 CentOS ISO 文件保存到桌面，就可以选择你的新虚拟机从该文件安装操作系统。


    打开你的 `VirtualBox manager` 页面，从左侧菜单选择你的服务器，并点击顶部的 `settings`（设置）选项卡。


    当设置菜单加载时，你需要从左侧菜单选择 `storage`（存储）来加载硬盘界面。在此屏幕上，你将看到存储树，以及树中的两个设备。


    第一个是你的虚拟机的硬盘，它是在构建虚拟机时创建的。在示例中，我的硬盘名为 `VPS-1.vdi`，在下方我有一个名为 `Empty` 的设备。选中此设备，右侧的属性部分将发生变化。


    在属性设置下，你会看到 `CD/DVD Drive:`（CD/DVD 器），它在选择框中应显示为 `IDE Secondary Master`。在该选择框的右侧你会看到一个小光盘图标。点击光盘将打开一个小菜单，点击
    `Choose a CD/DVD disc file`（选择 CD/DVD 光盘文件）。


    将弹出一个浏览窗口，允许你浏览电脑找到存储 CentOS ISO 文件的位置。当你选择文件后，你会看到属性部分发生变化，设备名称也从 `Empty` 变为你的
    ISO 文件名。


    点击 `ok` 保存并退出。


    ![vps-17.PNG](img/00119.jpeg)


    你的虚拟机现在已准备好安装 CentOS 服务器操作系统。


    当你回到 Virtual manager 窗口时，选择你的服务器，然后点击 `start`（启动）。


    当你开启机器时，你会看到几个小的消息窗口出现，在接受这些消息之前，你的机器将不会启动。记录这些消息是值得的，因为我们需要勾选“不再显示此消息”的复选框，否则在主机系统崩溃并重启时，我们将无法使用自动启动功能。


    ![vps-18.PNG](img/00120.jpeg)


    你的机器现在将开始加载。由于我们选择第一个启动设备为硬盘，你的机器将检查硬盘以启动操作系统。当检测到硬盘上没有安装操作系统时，它将检查 CD/DVD ROM
    驱动器。


    由于你没有安装 CD/DVD ROM 驱动器，这就是为什么我们将此机器的虚拟机管理器设置为将 ISO 文件视为 CD/DVD ROM 驱动器。


    当你的机器检测这些内容时，屏幕将如截图所示。这只需要几秒钟。


    值得注意的是，如果你想选择启动设备，请按 `F12`，这在屏幕底部显示，如下例截图所示。


    目前你不需要知道，但为了以后参考，如果你安装了操作系统并想重新格式化服务器，按 `F12` 将允许你作为一次性事件选择启动设备。从那里，你可以选择从 `CD/DVD
    ROM drive` 启动。


    ![vps-19.PNG](img/00121.jpeg)


    屏幕将自动切换到安装 CentOS 的开始。关于安装 CentOS 的说明，请参阅从 CD/DVD ROM 驱动器安装 CentOS 的章节。


    ### 服务器启动时自动启动 VPS


    现在我们已经构建了主机系统，安装了虚拟化软件，并构建了第一台服务器，我们需要允许服务器在主机系统重启时自动启动。


    为了实现这一点，在 Windows 操作系统上非常简单。Windows 有一个在每次 Windows 首次加载时都会检查的文件夹，名为 `Startup`（启动）。在某些
    Windows 版本中，启动文件夹的位置可能不同并位于不同的位置。


    在 Windows 8 上，你可以使用 `run` 命令访问启动文件夹。


    在 Windows 8 的开始界面输入 `run`。（这是显示所有应用程序的屏幕）。


    ![windows-17.jpg](img/00122.jpeg)


    当运行窗口打开时，输入以下命令：


    ```

    %AppData%

    ```


    ![vps-20.PNG](img/00123.jpeg)


    这将打开漫 aming 文件夹，让你查看其中的文件夹。你会在 `\Microsoft\Windows\Start Menu\Programs` 找到启动文件夹。


    一旦导航到 Programs 文件夹，双击打开启动文件夹。


    你可以先最小化此文件夹，因为我们需要先创建一个文件。


