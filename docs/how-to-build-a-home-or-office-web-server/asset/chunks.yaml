- fmt: '

    The below message will also most likely appear stating that the below storage
    device may contain data. If this appears and you are confident that there is no
    data on the hard drive that needs backing up or keeping you may select ‘Yes, discard
    any data`.


    A small box will appear for just a few seconds, maybe longer if you have a very
    large hard drive stating examining storage device.


    ![centos_7.1.PNG](images/00017.jpeg)


    Once your hard drive is initialized and accepted as a suitable storage device
    you will be taken to the next screen to continue you installation.


    You will now need to fill in the hostname of the server (e.g. `server1.example.com`),
    then click on the `Configure Network` button:


    As this will be a web server which will most likely host your website it would
    be a better idea to replace `example.com` with your domain name. Hostnames must
    be a fully qualified domain name. It is acceptable to have `server1\.` or `vps1\.`.
    But the hostname must end with a domain name.


    ![centos_8.png](images/00018.jpeg)


    After the clicking the `Configure Network` button the network Connections window
    will popup. Select `System eth0` and click `edit` to configure your network.


    ![centos_9.png](images/00019.jpeg)


    After the `edit` button is selected a further popup box will appear as per below.
    Click on the `connect automatically` check box, and then on the `IPv4 Settings`
    tab.


    Under the `Method:` dropdown box make sure that `Automatic (DHCP)` is selected
    and click on `apply` which will close the `Editing System eth0`.


    ![centos_10.PNG](images/00020.jpeg)


    The reason why we are allowing automatic DCHP rather than setting the static IP
    address here is that each `eth0` connection has its own mac address and we will
    be assigning the IP address later on in the BT gateway hub.


    You will now need to click close the network connections box and they you will
    see a message appear as per below.


    ![centos_11.PNG](images/00021.jpeg)


    Once the above message closes of your network connections are completed and you
    can proceed.


    Depending on the speed of the server the message can only be displayed for a split
    second so you may miss it. As long as you don’t see any error messages then you
    will be ok to continue with the installation.


    If waiting for network manager returns an error message this is most commonly
    an error message because you have not connected your server via the Ethernet cable
    to your network port switch or your gateway hub.


    Make sure you have connected your Ethernet cable and try the settings again.


    If you have multiple Ethernet ports on your server and are intending to use more
    than one you will need to perform these settings for each of the `system eth0`
    ports.


    When the screen is returned back to the below screen shot you can click next to
    continue the installation of CentOS.


    ![centos_12.png](images/00022.jpeg)


    You now need to select your time zone; you can use the dynamic map or use the
    dropdown list to set your time zone. Click next when you have finished.


    ![centos_13.png](images/00023.jpeg)


    When logging into your server the main username is always `root`. If you intend
    to install cPanel, to access the WHM panel and configure cPanel your username
    will be `root` along with the password you select here. Your main username for
    SSH connections will be `root` and the password you select here.


    Here you will need to set a password for the `root` user. Servers that are connected
    to the outside world (World Wide Web) come under attack so setting a weak password
    here is not recommended. It is good practise to use a combination of upper and
    lower case letters along with a selection of numbers.


    It will also be a good idea to write these details down now. The main user is
    always `root` and your password is what you choose now. Your `root` password must
    be at least six characters long.


    ![centos_14.png](images/00024.jpeg)


    Next we do the partitioning. Select `use all space`. This will give you a small
    `/boot` partition and a large `/` partition which is fine for most purposes.


    If you intend to install cPanel on your server you will be best to create a custom
    layout. This is recommended by cPanel but not compulsory. If you require this
    step please now read the chapter on create custom hard drive layout and return
    to continue your installation.


    ![centos_15.png](images/00025.jpeg)


    You will now be asked to write changes to disk. Click the button selecting, `write
    changes to disk`.


    ![centos_16.png](images/00026.jpeg)


    If you have selected review or modify partitioning layout you will see two additional
    screens. At this stage you do not need to modify any of the partitions as we will
    cover creating custom partitions in a separate section of this chapter.


    You will now be presented with the partitioned drive structure. Click next.


    ![centos_16.1.PNG](images/00027.jpeg)


    The hard drive will now be formatted with the required partitions.


    ![centos_17.PNG](images/00028.jpeg)


    Click on next to confirm installation of the boot loader on the selected partition.


    ![centos_17.1.PNG](images/00029.jpeg)


    Next we need to select the software we want to install. Select `Basic Server`,
    then check `CentOS` in the additional repositories field, choose `Customize later`
    and click on next.


    ![centos_18.png](images/00030.jpeg)


    The installation of CentOS will now begin. This normally takes around 10 minutes
    to complete.


    ![centos_19.PNG](images/00031.jpeg)


    When the installation has completed you can remove the DVD media from your Rom
    drive.


    ![centos_20.PNG](images/00032.jpeg)


    You have successfully CentOS basic server operating system on your server and
    it is now ready for you to configure and update.


    After your server has rebooted you can login to CentOS with the password you created
    previously.


    Next you will need to configure internet access. To do this please read the section
    configuring internet access at the end of this chapter.


    ## Installing CentOS 6.3 from a Bootable USB


    When installing CentOS from a USB drive there is not much of a difference but
    there are a few little differences. First you should insert your USB pen drive
    into a USB port turn on your server and select to boot from your USB device.


    Once the below screen loads you will need to select install or upgrade an existing
    system.


    ![centos_3.png](images/00012.jpeg)


    Unlike installing CentOS from a DVD the next screen that appears is select language.
    The screen layout is also in a different format to that of booting via a DVD.


    ![centos_4.png](images/00034.jpeg)


    After clicking next on select language you will be presented with the screen as
    per below, select your keyboard language.


    ![centos_5.png](images/00035.jpeg)


    Once you have selected your installation language and your keyboard you will have
    to select installation method. You will be asked what type of media contains the
    installation image.


    Using your arrow keys on your keyboard highlight hard drive and select ok.


    ![centos_6.png](images/00036.jpeg)


    When asked for partition that holds the image, this will most likely be `/dev/sda1`
    from when we created our bootable USB drive. Select the drive and then ok.


    ![centos_7.png](images/00037.jpeg)


    Installation of CentOS will now start. Select the next button to continue.


    ![centos_8.png](images/00038.jpeg)


    You might see the following warning - `Error processing drive`. If you see this
    click on the `Re-initialize all` button to proceed.


    ![centos_9.png](images/00039.jpeg)

