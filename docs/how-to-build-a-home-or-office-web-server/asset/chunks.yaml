    \ are now acting as root by issuing the following command: -\n\n  whoami   \n\n\
    Your window should look like the example screenshot below and you can see that\
    \ the line after issuing the command whoami, states you are root.\n\n![wheel-3.PNG](images/00149.jpeg)\n\
    \nYou can now close off your SSH windows by issuing the following command. (If\
    \ you have logged in and switched to the super user you will need to issue the\
    \ command twice.): -\n\n  exit   \n\n## Changing your SSH port\n\nWhile there\
    \ are many ways to make sure your server is as secure as possible there are some\
    \ basic steps and measures that you can take to cover your bases.\n\nThe Secure\
    \ Shell (SSH) Protocol by default uses port 22\\. Accepting this default value\
    \ does not make your system insecure. Changing the port will not provide a significant\
    \ variance in security. However, changing the default SSH port will stop many\
    \ of the automated attacks your server will face and a will make it a bit harder\
    \ to guess which port SSH is accessible from, in other words, a little security\
    \ through obscurity.\n\nThe easiest way to change the port is to SSH into the\
    \ server as the root user:\n\nTo do this we will need to use software such as\
    \ putty which is a free telnt/ssh client.\n\nPlease see our software chapter for\
    \ the download location\n\nOnce you have downloaded putty you will not need to\
    \ install anything as this is a standalone software client. Double click on the\
    \ putty icon which will be in your downloads folder to open a new session. (Example\
    \ below)\n\n![putty.PNG](images/00068.jpeg)\n\nOnce putty is opened the cursor\
    \ will be blinking in a box called Host Name (or IP address) in this box you need\
    \ to enter the IP address of your server. When you have entered your IP address\
    \ click the open button at the bottom.\n\nYou will need to login as the root user\
    \ (root) and the password you created when installing CentOS.\n\nAs root, use\
    \ the text editor (vi) to edit the sshd configuration file. This can be done by\
    \ typing the following on the command line: -\n\n  vi /etc/ssh/sshd_config  \n\
    \nNext you will need to locate the line that specifies the port. If your sshd_config\
    \ file has not been altered, the Port setting will be commented out with a # symbol\
    \ (example below): -\n\n![ssh_2.PNG](images/00150.jpeg)\n\nThe # symbol tells\
    \ the server to ignore anything after it on the same line, so we will need to\
    \ remove that character and then change the number 22 to something else. Be sure\
    \ you do not pick a port number that is in use by a different service.\n\nThe\
    \ default line will look like this:\n\n#Port 22\n\nIn this example the port has\
    \ been changed to 2922 and the # symbol removed. (Example below)\n\n![ssh_1.PNG](images/00151.jpeg)\n\
    \nPress the (i) key on your keyboard to start the insert mode of the text editor.\
    \ Once you have changed your port number and removed the # symbol you will need\
    \ to save and exit the text editor.\n\nPress the esc key on your keyboard.\n\n\
    Press the (:) key on your keyboard and then the (w) key, this will now save the\
    \ config file.\n\nPress the (:) key on your keyboard and then the (q) key, this\
    \ will quit the text editor and return to command line prompt.\n\nNext is to restart\
    \ SSH in order for the new settings to take effect.\n\n  /etc/init.d/sshd restart\
    \   (example below)\n\n![ssh_3.PNG](images/00152.jpeg)\n\nYour SSH service has\
    \ now been restarted and the new SSH port has taken effect.\n\n## Installing server\
    \ firewall\n\nTo install the server firewall you must be logged in to the server\
    \ as the root user. I will cover logging and switching to super user for the people\
    \ who have disabled root access and created a wheel user account.\n\nFor people\
    \ that have not created a wheel user and deleted root access you can skip this\
    \ step.\n\nLogin and switch to super user\n\nYou will need to login to the server\
    \ via SSH and switch to the super user.\n\nOpen a new SSH client window and we\
    \ will login with the Wheel user that you have created.\n\nNow that you have logged\
    \ in we need to switch to the super user, to do this issue the following command:\
    \ -\n\n  su   \n\nYou will now be asked for a password. This is the root password\
    \ that is being required.\n\nYou can check that you are now acting as root by\
    \ issuing the following command.\n\n  whoami   \n\nYour window should look like\
    \ the example screenshot below and you can see the line after issuing the command\
    \ whoami states you are root.\n\n![wheel-3.PNG](images/00149.jpeg)\n\nWe need\
    \ to be in the main directory folder and at the moment you can see we are in /home/tecsupport,\
    \ in order to go back you will need to issue the following command: -\n\ncd  ../../\
    \  \n\nYou will now see that the current directory has changed on the bottom line\
    \ as shown in the example screenshot below.\n\n![firewall-1.PNG](images/00153.jpeg)\n\
    \nInstalling Firewall as root user\n\nNow that you have logged into the server\
    \ as the root user we can install the firewall on the server. There are four commands\
    \ to issue in order to download and install the server. The commands are listed\
    \ below and after each command press the enter key on your keyboard and allow\
    \ each command to execute before continuing to the next.\n\nwget  http://www.configserver.com/free/csf.tgz\
    \  \n\ntar  -xzf  csf.tgz  \n\ncd  /csf  \n\nsh  install.sh  \n\nThe output when\
    \ completed will look like the example screenshot below. You can now logout of\
    \ your SSH client, if you have switched to the super user you will need to use\
    \ the exit command twice.\n\nThe exit command is: -\n\nexit  \n\n![](images/00154.jpeg)\n\
    \nThe firewall will now be installed on your server and is ready to be configured\
    \ and activated. You will need to login to your servers WHM panel and from the\
    \ links menu on the left hand side the firewall should be at the very bottom under\
    \ plugins as shown in the example screenshot below. If plugins and the firewall\
    \ are not showing in the links menu you will need to logout of the server and\
    \ log back in.\n\n![firewall-3.PNG](images/00155.jpeg)"
