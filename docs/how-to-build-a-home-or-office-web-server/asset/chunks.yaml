    \ screenshot below. This is where you will specify your language settings before\
    \ clicking next. When you do click next the setup will perform some more initialisation\
    \ tasks in the background.\n\nI preferred the Windows 8 installation as it was\
    \ very fast and very easy to install. Most drivers are already installed during\
    \ installation so very little is left to do or configure.\n\nWindows 8 will install\
    \ a basic graphics driver and your LAN driver. Your LAN driver is for your Ethernet\
    \ controller. The one thing that was not installed was the sound driver. This\
    \ is not a problem as we are using this as a host operating system for the server\
    \ and sound and fancy graphics are not required.\n\n![windows-2.jpg](images/00071.jpeg)\n\
