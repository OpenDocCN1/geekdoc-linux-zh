    will take effect you will need to restart your server.


    ```bash

    shutdown –r now

    ```


    When your server re-boots and you have logged back in enter the following command:


    ```

    Ifconfig

    ```


    You will now see `eth0` and all its associated settings and also `eth1` and its
    associated settings.


    Next you will need to repeat the steps to assign the static IP address in the
    BT hub. (This was covered in the chapter configuring internet access on page 67).
    Once you have assigned the static IP address you will need to restart your server
    for the static IP address to take effect.


    # Chapter eight


    | In this chapter we will cover Installing cPanel, PHP, apache and MySQL through
    to configuring cPanel and adding a domain to the server. |


    ## Installing cPanel


    cPanel is a popular management application that runs on many web servers and is
    highly supported via cPanel forums and support tickets for all users. It is strongly
    recommended that you install cPanel as this will make administrating and managing
    your server easier and the end result will be that you have a stable web server
    which can host many domain names and websites.


    cPanel comes with an abundance of web server software installed such as PHP, `apache`
    and `MySQL`. There are many more but these are pretty much everything you will
    need to create a professional web server.


    cPanel is very easy to install with just three very simple lines of code. When
    you install cPanel you are granted a 15 day free trial but after that you do have
    to buy a licence.


    The licences can be purchased directly from cPanel per year or you can pay monthly
    from sources such as cPanel Direct [http://www.cpaneldirect.net/](http://www.cpaneldirect.net/)


    The cost is roughly £10 for a VPS licence and £26 for a dedicated server licence;
    these prices are per month also the price varies monthly depending on the currency
    exchange as payment is in US dollars.


    To begin your installation of cPanel & WHM enter the following three commands
    at the command line prompted:


    ```bash

    cd /home

    wget -N http://httpupdate.cpanel.net/latest

    sh latest

    ```


    cPanel will now start installing on your web server. This can take up to two hours
    but I find it’s normally completed within the hour.


    When the installation of cPanel has finished you will be presented with a screen
    like the example below.


    ![cpanel-1.PNG](images/00136.jpeg)


    Once you see that cPanel has installed, (like the bottom three lines in the above
    screenshot) you are now ready to login to cPanel and run the initial setup configuration.


    ## Configuring cPanel


    Now that cPanel has installed on your server it is time to login and confirm a
    few settings. You will be guided through each of these setting at each step with
    an explanation on each one step where needed.


    It would be too much to put a full explanation of cPanel in this book but cPanel
    docs are available for you to read online in fantastic easy to follow instructions.


    Whilst cPanel is installing take the time to read through the guide at the below
    link to learn how to cover the 6 steps of the initial setup.


    [http://docs.cpanel.net/twiki/bin/view/AllDocumentation/WHMDocs/WHMInitialSetup](http://docs.cpanel.net/twiki/bin/view/AllDocumentation/WHMDocs/WHMInitialSetup)


    To access cPanel you will need to type the IP address followed by; `:2086` into
    your web browsers url address bar.


    When you access WHM panel you will be asked for your username and password. These
    are the user name `root` and password that was created during the CentOS installation.


    Under step two of the initial setup you are asked to confirm your resolvers. If
    you remember back to when we configured CentOS for the internet we entered primary
    and secondary resolvers; these where `8.8.8.8` and `8.8.4.4`, these will be you
    resolvers for the initial setup and will most probably already be entered.


    Under step three of the initial setup is your server IP addresses. Your primary
    IP address will already be added so no need to add this again.


    Follow the instructions for step four carefully. This is the Name servers section.
    Name servers are where you tell your domain name to point and are for example
    `ns1.example.com` and `ns2.example.com`.

