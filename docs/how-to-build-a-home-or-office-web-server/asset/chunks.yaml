  trans: '

    Oracle 拥有一非常完善的手册，而且对于任何想要深入探索 `Virtualbox` 软件全部潜能的人来说，通过论坛可以获得大量的支持。


    ## 安装 VirtualBox


    一旦你下载了 `Virtualbox`，将需要双击应用程序以启动安装过程。


    当可执行程序启动时，你将看到如下所示的 Windows 系统安全警告。


    ![oracle-1.PNG](img/00090.jpeg)


    点击 `Run` 开始安装。现在将显示如下方截图所示的 Oracle `VirtualBox` 欢迎框。点击 `Next` 开始。


    ![oracle-2.PNG](img/00091.jpeg)


    下一步是自定义设置。对于我们需要的安装，只需将这些设置保持默认值即可。


    ![oracle-3.PNG](img/00092.jpeg)


    点击上述屏幕上的 `next`。接下来，系统会提示你是否需要在安装时创建桌面快捷方式和快速启动快捷方式。根据需要选择或取消勾这些选项，并点击 `next`。


    ![oracle-4.PNG](img/00093.jpeg)


    在下一个屏幕上，你将收到一条警告消息，如下例所示。这是没问题的，`Virtualbox` 需要将网络功能安装到你的网卡和 Windows 配置文件中。


    点击 `yes` 继续安装。


    ![oracle-5.PNG](img/00094.jpeg)


    在 `Virtualbox` 安装之前的最后一个屏幕是最终确认，也是更改任何安装设置的最后机会。点击 `Install` 继续。


    ![oracle-6.PNG](img/00095.jpeg)


    Oracle 的 `VirtualBox` 现在将安装到你的宿主机系统中。安装过程只需要几秒钟。你的安装屏幕将看起来像下方的示例截图。


    ![oracle-7.PNG](img/00096.jpeg)


    在安装完成之前，你可能会收到下方的 Windows 安全警告消息。勾选框 `Always trust software from “Oracle Corporation”`
    并点击 `install` 是安全的。


    ![oracle-8.PNG](img/00097.jpeg)


    你的安装现在将继续并在几秒钟完成，完成后将向你展示如下所示的安装完成屏幕。


    ![oracle-9.PNG](img/00098.jpeg)


    取消勾选安装后自动启动 `Oracle VM VirtualBox 4.2.12`，并点击 `finish`。


    现在系统会弹出一个窗口提示重启系统。点击 `yes` 并允许你的系统重启。


    ![oracle-10.PNG](img/00099.jpeg)


    ## 网络配置


    Windows 8 似乎能很好地将网络接口配置为桥接模式，但其他版本的 Windows 需要对桥接适配器进行手动配置。这允许你的网卡实现虚拟化。


    一旦系统重启，我们现在将检查确保你拥有正确的网络设置，以允许 `Virtualbox` 使用网络适配器的虚拟化。


    为了通过你的网络设置，你需要进入：


    `Control panel / network and internet / view network status and tasks`


    打开控制面板后，点击左侧菜单中的 `change adapter settings`。这将打开一个新窗口，显示你的 `Ethernet` 适配器和 `Oracle`
    适配器，如下例截图所示。


    ![oracle-11.PNG](img/00100.jpeg)


    进入上述屏幕后，右键点击 `VirtualBox Host-Only Network` 并点击 `disable`。你现在会看到该适配器变灰。


    右键点击 `Ethernet` 网络适配器并选择 `properties`。这将弹出一个小型对话框，列出设备列表以及每个设备左侧的复选框，如下例。


    ![oracle-12.PNG](img/00101.jpeg)


    在我们的示例中，`VirtualBox Bridged Networking driver` 是列表中的第二个，确保勾选此项并点击 `ok`。这现在允许 `VirtualBox`
    使用你系统内置的 `Ethernet` 控制器，并允许控制器进行虚拟化，以便你的每个 `VPS`（虚拟机）都能拥有独立的 `mac` 地址和访问访问。


    你现在应该能看到如下所示的屏幕。


    ![oracle-13.PNG](img/00102.jpeg)


    `VirtualBox` 现在已安装完成，网络也配置完毕，可以开始创建第一台 `VPS`（虚拟机）。


    ## 创建虚拟机 (VPS)


    现在我们已经设置好了宿主机系统并安装了虚拟化软件，是时候创建我们的第一个 `VPS`（虚拟机）了。设置该机器硬件其实只有几个简单的步骤，然后只需安装并配置
    `CentOS`，使虚拟机成为虚拟私有服务器。


    如果你允许 Oracle 的 `VirtualBox` 创建桌面图标，双击桌面上的 `Oracle VM VirtualBox` 图标即可启动 `VirtualBox`
    管理器。


    由于这是首次加载该程序，尚未创建任何虚拟机，因此加载了默认的欢迎屏幕，如下所示。


    ![vps-1.PNG](img/00103.jpeg)


    点击 `VirtualBox Manager` 应用程序左上角的 `new` 标签。这将启动程序中的创建 `VirtualBox` 部分。


    ![vps-2.PNG](img/00104.jpeg)


    上面的截图是为机器和操作系统命名的地方。由于我们正在创建一个 `VPS`，我将机器命名为 `VPS-1`。在示例中，我们将安装 `CentOS`，因此我将类型选择为
    `Linux`；在版本（version）下没有列出 `CentOS`，因此我选择了 `Other Linux`。一旦选好选项，点击 `next`。


    下一个屏幕是选择应为虚拟机分配的内存大小。你可以使用滑动条，但我发现直接在文本框输入内存内存更好。


    正如我之前提到的，我将创建两台每个拥有 1 个处理器、1 GB 内存和 20 GB 硬盘的 `VPS`（虚拟机），我需要在这一步输入 1 GB。内存应以 `MB`
    输入，因此我将输入 `1024`，这等于 `1 GB`。


    ![vps-3.PNG](img/00105.jpeg)


    接下来，系统提示选择三个选项之一。要创建一个机器，我们需要选择 `Create a virtual hard drive now` 并点击 `create`。


    ![vps-4.PNG](img/00106.jpeg)


    接下来，我们选择想要创建的硬盘类型。`VirtualBox` 可以创建并使用多种与其他虚拟化软件兼容的硬盘类型。由于我们只使用 `VirtualBox`，可以将设置保持为
    `Default`，如下截图所示。


    ![vps-5.PNG](img/00107.jpeg)


    在下一个屏幕上选择 `fixed size` 并点击 `next`。如下所示。


    ![vps-6.PNG](img/00108.jpeg)


    现在我们需要选择硬盘文件的位置和硬盘的尺寸。如果你对使用默认位置满意，可以保持第一个输入字段不变。如果你想重命名硬盘并选择不同的文件位置，可以在此处进行。


    滑动条比例用于增加或减少硬盘尺寸。在示例中，我们正在创建一个 20 GB 的硬盘；同样，我直接将其输入文本框而不是使用滑动条。


    ![vps-7.PNG](img/001109.jpeg)


    `VirtualBox Manager` 现在将创建你的硬盘并设置好新机器。所需时间取决于你创建的硬盘大小。


    ![vps-8.PNG](img/001110.jpeg)


    一旦你的新虚拟机创建完成，你将返回到 `VirtualBox Manager` 的欢迎屏幕。此屏幕现在已发生变化，会在左侧列出你的机器，并在中间显示所选机器的概览；如下截图所示。


    ![vps-9.PNG](img/001111.jpeg)


    你可以看到你的新机器处于关机状态，在开启新机器之前，我们需要进行一些配置，以便机器能够作为 Web 服务器工作。


    为了配置你的新机器，你需要确保已从左侧菜单中选中并高亮了机器，然后点击 `settings`（顶部菜单中的第二个标签）。取决于你的宿主机系统，你可能会收到如下所示的错误警告。不要担心，点击
    `ok`。


    ![vps-10.PNG](img/001112.jpeg)

    '
- fmt: "\nNow we will have loaded the configuration area for the selected virtual\
    \ machine which will look like the example screenshot below.\n\n![vps-11.PNG](images/00113.jpeg)\n\
    \nClick on `system` from the menu on the left hand side.\n\n![vps-12.PNG](images/00114.jpeg)\n\
    \nFirst we need to change the boot order; we will not be using `floppy` in our\
    \ boot order so this can be unchecked. Next highlight `Hard Disk`, make sure it\
    \ is checked and use the arrow next to boot order to bring `Hard Disk` to the\
    \ top. Now, below `hard Disk` bring `CD/DVD-ROM` up to make that as the second\
    \ boot device and make sure this again is checked.\n\nIf you want your server\
    \ to have more than one processor then you can change this by selecting the `Processor`\
    \ tab. Once this opens you can use the slider, or the text input box to increase\
    \ the processor CPU’s availability for the server. I have left this as `1 CPU`\
    \ for the example.\n\n![vps-13.PNG](images/00115.jpeg)\n\nWindows 8 may not have\
    \ installed your audio drivers. This is not a problem as we are creating servers,\
    \ which do not require audio. If you have not got the audio driver installed,\
    \ it will be better to disable audio on the server so that each time `VirtualBox\
    \ Manager` loads and your server boots up you do not get a warning message about\
    \ this.\n\nSelect `Audio` from the menu on the left hand side, when the page loads\
    \ uncheck the checkbox named `enable audio`, to disable the audio on the server.\n\
    \n![vps-14.PNG](images/00116.jpeg)\n\nNext we need to configure the networking\
    \ so that the server has an internet connection. Select `network` from the menu\
    \ on the left hand side which will load the page as shown below.\n\n![vps-15.PNG](images/00117.jpeg)\n\
    \nOnce the page loads you will see a list of adapters numbered `1-4`. These are\
    \ your Ethernet ports; which each server has. You can have a maximum of four per\
    \ server which means you can assign a maximum of four static IP addresses to each\
    \ of your servers.\n\nWith `adapter 1` selected click the `advanced` tab in the\
    \ centre of the screen. This will load a few more fields of information. Make\
    \ sure that `Enable Network Adapter` is checked, next underneath you will find\
    \ a select box which is named `Attached to:` use the select box and select `Bridged\
    \ Adapter`.\n\nUnderneath that you will then see the name of your network adapter.\
    \ This means that the one Ethernet port on your host system has been virtualised\
    \ and all adapters access the internet via that one Ethernet port.\n\nAs the BT\
    \ hub can only assign static IP addresses to a dedicated Mac address, and each\
    \ Ethernet port has one Mac address, then the virtualisation software will assign\
    \ a slightly different Mac address to each adapter; in effect, creating a virtual\
    \ Mac address from the hosts’ single Ethernet port.\n\nIt might be worth making\
    \ a note of the Mac address that has been assigned for later when we shall be\
    \ assigning the IP address.\n\n![vps-16.PNG](images/00118.jpeg)\n\nClick `ok`\
    \ to save the settings and return to the main Manager screen.\n\nYour Virtual\
    \ Machine has almost been made into your VPS. There are just a few more steps\
    \ to take before we are ready to turn your machine on, and install the server\
    \ software.\n\n### Installing CentOS 6.3 from a Saved Image\n\nIf you have built\
    \ your host system without a DVD-ROM drive and booted your host system for a USB\
    \ drive then at the moment you have no way of installing the CentOS server operating\
    \ system onto your new virtual machine.\n\nOracles VirtualBox has the added feature\
    \ of being able to install the operating system directly from a saved image file.\
    \ This is the ISO file that was downloaded before you created you bootable media.\n\
    \nWith a USB Pen drive you can copy the `CentOS-6.3-x86_64-bin-DVD1` ISO file\
    \ from the computer you downloaded it from and save it to your host systems desktop.\n\
    \nOnce you have saved your CentOS ISO file to your desktop you can select your\
    \ new virtual machine to install the operating system from that.\n\nOpen your\
    \ `VirtualBox manager` page, select your server from the left hand menu and click\
    \ the `settings` tab at the top.\n\nWhen the settings menu loads you will need\
    \ to select `storage` from the left hand side menu to load the hard drive screen.\
    \ On this screen you will see your storage tree and then two devices in that tree.\n\
    \nThe first is your virtual machines hard drive which was created when building\
    \ your virtual machine. In this example mine is called `VPS-1.vdi`, under that\
    \ I have a device called `Empty`. Highlight this device which will change the\
    \ attributes section to the right.\n\nUnder the attributes settings you will see\
    \ `CD/DVD Drive:` and this should be listed as `IDE Secondary Master` in the select\
    \ box. To the right of that select box you will see a small disc. Click on the\
    \ disc and a small menu will open, click on `Choose a CD/DVD disc file`.\n\nA\
    \ browse window will open that allows you to browse your computer to find where\
    \ you have stored your CentOS ISO file. When you have selected your file you will\
    \ see the attributes section change and the device name change from `Empty` to\
    \ your ISO file name.\n\nClick `ok` to save and exit.\n\n![vps-17.PNG](images/00119.jpeg)\n\
    \nYour virtual machine is now ready to have your CentOS server operating system\
    \ installed.\n\nWhen you have returned to your Virtual manager Window select your\
    \ server and then click `start`.\n\nWhen you turn on your machine you will see\
    \ a few small message windows that appear and until you accept these your machine\
    \ will not boot. It’s worth taking a note of these messages as we need to select\
    \ the checkbox not to show this message again or we won’t be able to use the auto\
    \ boot feature in case you host system crashes and re-boots.\n\n![vps-18.PNG](images/00120.jpeg)\n\
    \nYour machine will now start to load. As we have selected the first boot device\
