    # 第八章


    | 本章将涵盖从安装 cPanel、PHP、apache 和 MySQL，到配置 cPanel 以及为服务器添加域名的内容。 |


    ## 安装 cPanel


    cPanel 是一种运行在许多 Web 服务器上的流行管理应用程序，并通过 cPanel 论坛和支持工单为所有用户提供强大的支持。强烈建议安装 cPanel，因为这将使管理和维护你的服务器变得更容易，最终结果是你将拥有一个可以托管许多域名和网站的稳定
    Web 服务器。


    cPanel 预装了大量的 Web 服务器软件，如 PHP、`apache` 和 `MySQL`。还有更多软件，但这些已经涵盖了你创建一个专业 Web 服务器所需要的所有内容。


    cPanel 的安装非常简单，只需要三行非常简单的代码。当你安装 cPanel 时，你将获得 15 天的免费试用，但之后你必须购买许可证。


    许可证可以直接从 cPanel 按年购买，你也可以从 cPanel Direct [`www.cpaneldirect.net/`](http://www.cpaneldirect.net/)
    等渠道每月支付。


    VPS 许可证费用大约为 10 英镑，专用服务器许可证费用为 26 英镑；这些价格也是按月计算的，且由于是用美元支付，价格会根据汇率每月变动。


    要开始安装 cPanel & WHM，请在命令行提示符处输入以下三个命令：


    ```bash

    cd /home

    wget -N http://httpupdate.cpanel.net/latest

    sh latest

    ```


    cPanel 现在开始在你的 Web 服务器上安装。这可能花费长达两小时，但我发现通常在一小时内就能完成。


    当 cPanel 安装完成后，你将看到一个像下方示例这样的屏幕。


    ![cpanel-1.PNG](img/00136.jpeg)


    一旦你看到 cPanel 已安装（如上方截图中的最后三行），你就可以准备登录 cPanel 并运行初始化设置了。


    ## 配置 cPanel


    现在 cPanel 已安装在你的服务器上，是时候登录并确认一些设置了。在每个步骤中，系统将引导你完成这些设置，并在需要的地方提供解释。


    在书中放入 cPanel 的完整说明会太冗长，但 cPanel 文档供你在线阅读，其指令非常易于遵循。


    在 cPanel 安装期间，请花时间阅读下方链接中的指南，学习如何完成初始设置的 6 个步骤。


    [`docs.cpanel.net/twiki/bin/view/AllDocumentation/WHMDocs/WHMInitialSetup`](http://docs.cpanel.net/twiki/bin/view/AllDocumentation/WHMDocs/WHMInitialSetup)


    要访问 cPanel，你需要在浏览器地址栏输入 IP 地址加上 `:2086`。


    访问 WHM 面板时，系统会要求输入用户名和密码。这些是在 CentOS 安装期间创建的用户名 `root` 和密码。


    在初始设置的第二步中，要求你确认解析器。如果你还记得我们为 CentOS 配置互联网时，我们输入了主备用解析器；这些是 `8.8.8.8` 和 `8.8.4.4`，这些将是你初始设置的解析器，并且很可能已经输入了。


    初始设置的第三步是你的服务器 IP 地址。你的主 IP 地址已经添加，因此无需再次添加。


    请仔细遵循第四步的说明。这是名称服务器部分。名称服务器是你告诉域名指向何处，例如 `ns1.example.com` 和 `ns2.example.com`。


