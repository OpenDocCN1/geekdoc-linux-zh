    \ in.\n\nThe reason why you do not want your host system to require a sign in\
    \ is that if your system crashes and causes an automatic restart you would not\
    \ know about this and until you came to sign back in all your VPS (virtual machines)\
    \ would be offline.\n\n![windows-14.jpg](images/00083.jpeg)\n\nNext you will see\
    \ a green screen as shown in the below screenshot indicating that Windows is getting\
    \ your PC ready. This will take a few minutes and then continue.\n\n![windows-15.jpg](images/00084.jpeg)\n\
    \nThe last part of the installation is the apps. Some of you may know that Windows\
    \ 8 comes with a host of apps on the start screen. These apps are now being installed\
    \ by default. As this is going to be a host system only, you may want to remove\
    \ some of these apps or make sure things are not running to create as low a usage\
    \ footprint as you can, this will allow for more of the systems usage to be put\
    \ towards your virtual machines.\n\n![windows-16.jpg](images/00085.jpeg)\n\nOnce\
    \ these apps are installed your new Windows 8 installation is complete.\n\n![windows-17.jpg](images/00086.jpeg)\n\
    \nYour Windows 8 host operating system is now installed. There is only one configuration\
    \ option for Windows 8 as the host operating system that is required which is\
    \ covered next.\n\n### Disabling sleep mode for Windows 8\n\nBy default Windows\
    \ 8, like most other Windows operating systems sends the PC to sleep after a period\
    \ of inactivity from the keyboard or mouse. Once our virtual machines have been\
    \ created this will be a headless machine, meaning we will have no monitor keyboard\
    \ or mouse permanently active.\n\nIf the host operating system was to send the\
    \ system to sleep we would need to come back to our system and wake it up to allow\
    \ are servers to be online 24 hours a day. So disabling sleep mode is a necessity.\n\
    \nIn order to load the power options menu move the mouse pointer to the bottom\
    \ left hand of the start screen and right click, and then select `power options`\
    \ like the screenshot below.\n\n![windows-18.jpg](images/00087.jpeg)\n\nOnce the\
    \ power options loads you will see, `balanced (recommended)` highlighted bold\
    \ and selected. To the right of this is, `change plan settings` in blue.\n\n![window-19.PNG](images/00088.jpeg)\n\
    \nOnce you have clicked on change plan settings the following screenshot loads.\
    \ \n\n![window-20.PNG](images/00089.jpeg)\n\nChange the `put computer to sleep`\
    \ select box to `never` and click save changes. Your host system will not enter\
    \ sleep mode now after a period of inactivity.\n\n### Installing Virtualisation\
    \ software\n\nThere are various virtualisations software applications available\
    \ but the one that we are going to use is Oracle’s `Virtualbox`. This is an open\
