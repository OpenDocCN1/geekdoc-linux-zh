- fmt: "\nNow that you are ready to edit and optimise your `my.cnf` file you will\
    \ need to login to your server via your SSH client such as `putty`. If you have\
    \ not used `putty` or some other SSH client before please see our chapter ‘Changing\
    \ your SSH port’ for instructions on how to use `putty`.\n\nOnce you have logged\
    \ in to your server you will need to execute the following command in order to\
    \ open your `my.cnf` file ready for editing:\n\n```\nvi /etc/my.cnf\n```\n\nOnce\
    \ the MySQL `my.cnf` file has opened press the `(i)` button on your keyboard to\
    \ start the insert mode. Use the arrow keys to move to a new blank line and make\
    \ sure there is no character at the start of the line such as ` `.\n\n## Template\
    \ file\n\nBelow is a template file of the contents your `my.cnf` should have.\
    \ These are the basic optimisation settings your server should start with. There\
    \ are a few variables included in the template file and higher values that we\
    \ mentioned earlier but these variables and values can be monitored and adjusted\
    \ in `MySQL Tuner` as and when necessary.\n\nOnce these setting have been added\
    \ to your `my.cnf` file you will need to restart MySQL and then monitor your MySQL\
    \ performance.\n\nThese default variable settings have been set for a server which\
    \ is running a heavy load database and you may need to alter and tweak these settings\
    \ over a few days in order to get the best setting for your server. To do this\
    \ we will use `MySQL Tuner`. More about `MySQL Tuner` is below.\n\n### DEFAULT\
    \ SETTINGS ###\n\n```\nmax_connections = 500\n```\n\n### CACHE ###\n\n```\nthread_cache_size\
    \ = 1M\ntable_cache = 64M\nquery_cache_limit = 4M\nquery_cache_size = 16M\nquery_cache_type\
    \ = 1\n```\n\n### Buffer ###\n\n```\nkey_buffer_size = 32M\nread_buffer_size =\
    \ 128K\njoin_buffer_size = 128K\n```\n\n### OTHERS ###\n\n```\nconnect_timeout\
    \ = 10\nmax_connect_errors = 10\nmax_allowed_packet = 1M\ntmp_table_size = 16M\n\
    max_heap_table_size = 16M\n```\n\nNow that the MySQL variables have been added\
    \ to the `my.cnf` you will need to exit the insert mode, save and quit. To do\
    \ this you will need to execute the following commands:\n\nPress the `esc` button\
    \ on your keyboard. This will exit the insert mode. Next you will need to type\
    \ the following commands pressing enter after each command:\n\n```\n:w\n:q\n```\n\
    \nMySQL will now need to be restarted. In order to restart MySQL you will need\
    \ to issue the following command:\n\n```\n/etc/rc.d/init.d/mysql restart\n```\n\
    \nWhilst editing files at command line you may have an interrupted connection\
    \ and have to restart your SSH client. If this happens you will receive an error\
    \ message when you log back in and try to edit a file. For example, if, when editing\
    \ your `my.cnf` file and your system crashed you would be asked to recover or\
    \ remove the `swp` file. It may be best to remove the `swp` file and start afresh.\
    \ In order to remove this file you can issue the following command:\n\n```\nrm\
    \ /etc/.my.cnf.swp\n```\n\nOnce you have done this you will be free to continue\
    \ editing the file.\n\n## MySQL Tuner\n\nIn order to monitor the MySQL system\
    \ and make any recommended alterations it will be beneficial to install `mysqltuner.pl`;\
    \ this will monitor MySQL and suggest any alterations needed for the `my.cnf`\
    \ file. The `mysqltuner.pl` will need to be installed and MySQL running for a\
    \ minimum of 24 hours for accurate results to be noted. So, after each alteration\
    \ to the `my.cnf` file and MySQL has been restarted do wait at least 24 hours\
    \ in order for the `MySQL Tuner` to monitor your MySQL processes and give accurate\
    \ recommendations.\n\nTo install `mysqltuner.pl` complete the following commands\
    \ and pressing Enter after each command:\n\n```\nwget mysqltuner.pl\nchmod 755\
    \ mysqltuner.pl\n```\n\n`MySQL Tuner` is now installed and running on your server.\
    \ To run and test your MySQL system software run the following command:\n\n```\n\
    ./mysqltuner.pl\n```\n\nThis will output a display in relation to your MySQL system\
    \ software and recommend any changes needed for your `my.cnf` file. Other recommendations\
    \ such as repair and optimise maybe part of your recommendations. In order to\
    \ do this you can issue the following commands in the command line prompt:\n\n\
    ```\nmysqlcheck --all-databases -r = Repair tables and databases\nmysqlcheck --all-databases\
    \ -o = Optimise tables and databases\n```\n\n## Change full text search min word\
    \ length\n\nThis will allow full text searching to allow words of three characters\
    \ instead on the standard four.\n\n1. Login to the server with root access\n2.\
    \ Make sure you are in the main root directory `cd ../` and then `ls`\n3. Next\
    \ is to edit the file.\n    * `vi /etc/my.cnf`\n    * add the following line of\
    \ code `ft_min_word_len = 3`\n    * Exit the edit mode and save file by pressing\
    \ the escape tab, then pressing `:` and typing `wq` to save the file.\n4. Next\
    \ is to stop and start mysql\n    * `/etc/rc.d/init.d/mysql stop`\n    * `/etc/rc.d/init.d/mysql\
    \ start`\n    * `/etc/rc.d/init.d/mysql restart`\n5. Next is to repair the mysql\
    \ database for all accounts on the server\n    * `mysqlcheck --all-databases -r\
    \ = Repair`\n    * `mysqlcheck --all-databases -o = optimise`\n\n# Chapter Eleven\n\
    \n| This chapter is where to go for further support or with help understanding\
    \ any part of this book. |\n\n## Technical support\n\nAs I have covered so much\
    \ in this book it is understandable that it may be a little daunting and you may\
    \ want the reassurance that support is on hand for further questions, advice or\
    \ if you are struggling with any aspect of the installation and would like this\
    \ completed for you.\n\nYou can always get email support from a professional by\
    \ visiting the website where we would be more than happy to help.\n\nAs software\
    \ changes from time to time, upgrades and updates happen which may change part\
    \ of an installation or configuration; so to combat this we will publish any updates\
    \ on the website that may affect any of the installation aspects of this book.\n\
    \nIf you do wish to visit the website for further help or advice please visit\
    \ us at:\n\nhttp://www.buildawebserver.co.uk\n\n# Chapter Twelve\n\n| This chapter\
    \ will cover all the software we have used in creating our dedicated and virtual\
    \ private servers. |\n\n## Software\n\nThis is a list of all the software we have\
    \ used during this book to create our dedicated and virtual private servers. You\
    \ may not need all of this software as I have ran through various configuration\
    \ options in the book and not all will be applicable to you.\n\nI have tried to\
    \ use as much open source (Free Software) where possible.\n\n### Winrar\n\nDownload\
    \ location: [http://www.win-rar.com/](http://www.win-rar.com/)\nPrice: free\n\n\
    ### WinZip self extractor\n\nDownload location: [http://www.winzip.com/win/en/downse.htm](http://www.winzip.com/win/en/downse.htm)\n\
    Price: free\n\n### ISO2USB\n\nDownload location: [http://iso2usb.sourceforge.net/](http://iso2usb.sourceforge.net/)\n\
    Price: free\n\n### Windows 7 USB/DVD Download Tool\n\nDownload location: [http://www.microsoftstore.com/store/msstore/html/pbPage.Help_Win7_usbdvd_dwnTool](http://www.microsoftstore.com/store/msstore/html/pbPage.Help_Win7_usbdvd_dwnTool)\n\
    Price: free\n\n### CentOS x86 64\n\nDownload location: [http://isoredirect.centos.org/CentOS/6/isos/x86_64/](http://isoredirect.centos.org/CentOS/6/isos/x86_64/)\n\
    Price: free\n\n### Windows 8 64 bit operating system\n\nAvailable on eBay\nPrice:\
    \ (average £84.99)\n\n### uTorrent\n\nDownload Location: [http://www.utorrent.com/](http://www.utorrent.com/)\n\
    Price: free\n\n### Image Burn\n\nDownload location: [http://www.imgburn.com/](http://www.imgburn.com/)\n\
    Price: free\n\n### Putty: a free Telnet/SSH Client\n\nDownload location: [http://www.chiark.greenend.org.uk/~sgtatham/putty/](http://www.chiark.greenend.org.uk/~sgtatham/putty/)\n\
    Price: free\n\n### Oracle Virtualbox\n"
