    下载完成后，你需要将 ISO 文件刻录到 DVD 光盘上。请记住，我们的示例仅使用 DVD 1。要将 ISO 文件刻录到光盘，我使用了 `image burn`，这同样是开源软件。


    如果你在下载和使用 `uTorrent` 或 `image burn` 时需要任何帮助，请参下文章节。


    ## uTorrent


    下载位置请参见我们的软件章节。


    当你打开 `uTorrent` 网页时，点击 `get uTorrent`，这将为你打开一个新页面选择 `uTorrent` 版本。


    我们只需要免费版，所以点击 `free download`，这将刷新你的页面并开始下载。屏幕上也有安装 `uTorrent` 的说明。


    你的 CentOS DVD 1 到 2 下载将根据你的宽带速度花费一些时间，请耐心等待。完成后，你现在下载文件夹（或你为 `uTorrent` 选择存储下载的地方）中有一个名为“CentOS”的文件夹。


    ## Image burn


    下载位置请参见我们的软件章节。


    不要点击打开页面上的任何下载按钮。其中大多数是付费广告，会将你带到其他网站。在页面顶部的菜单栏上，你将看到：`News` | `Download` | `Change
    log`。


    点击 `Download`，这将带你进入带有镜像站点列表的新页面以从那里开始下载。我使用了列表中的第二个镜像站点，打开后页面右侧有一个大蓝色“download
    now（立即下载）”框。这将开始你的 `imgBurn` 下载。


    下载完成后，双击它并按照屏幕提示安装 `image burn`。


    安装好 `image burn` 后，打开下载的 `CentOS` 文件夹，右键点击 `CentOS` DVD 1 的 `.img` 文件，选择 `open
    with ImgBurn`。


    现在将提示你插入空白 DVD 并开始刻录到光盘。


    ## CentOS 可启动 USB 盘


    一旦你有了 CentOS ISO 镜像文件，就可以用它创建一个可启动的 USB 驱动器。你需要相应的软件。我使用了开源软件 `ISO2USB` 用于 `CentOS/RedHat`。


    这是免费软件且非常易用。它将在大约 10 分钟内在你的优盘上安装一个可启动版本的 CentOS。然后你可以反复在所有服务器上使用这个可启动优盘。


    下载位置请参见我们的软件章节。


    下载完成后，你需要使用 `Winrar` 或 `WinZip` 将文件内容提取到你选择的文件位置。


    你现在会在选择的文件夹中看到一个 `ISO2USB` 镜像图标。双击它打开程序。


    ![iso2usb.png](img/00001.jpeg)


    确保点击了 `Diskimage` 按钮，并将其设置为 `ISO`，然后选择 ISO 文件位置，在这种情况下，将是我们之前下载的 `CentOS` DVD
    映像光盘。


    保持 `Hard Disk` 名称和 `USB Device` 名称不变，它们应该是 `sda`。


    选择你的 USB 驱动器和驱动器位置。这很可能已经为你选好了。点击 `ok`，现在将创建你的可启动的 CentOS USB 优盘。


    ## Windows 可启动 USB 驱动器


    由于我们将使用 Windows 8 作为主机操作系统，我们也需要为它创建一个可启动 USB 优盘。


    首先，使用你的 Windows 8 操作系统光盘，你需要在电脑上创建一个镜像文件。打开 `image burn` 并选择 `create image file
    from disc`（从光盘创建镜像文件）。


    确保你已将 Windows 8 DVD 光盘插入 DVD 刻录机，并选择电脑上存储镜像文件的位置。点击 `image burn` 底部的 `Read` 按钮，这将创建你的
    ISO 镜像文件。


    从这个镜像文件，你现在可以创建可启动的 USB 驱动器了。


    还有其他程序可以创建它，但我坚持使用微软程序，即 `Windows 7 USB DVD download tool`。


    下载位置请参见我们的软件章节。


    不要担心，这将创建其他可启动的 Windows 操作系统盘。下载完成后，按照屏幕说明创建你的 Windows 8 可启动 USB 优盘。


    这是一个自解压的微软程序。在下载文件夹中找到下载的内容并双击。


    ![snipping_1.PNG](img/00002.jpeg)


    一旦之前的镜像加载，选择 `run` 开始安装。


    下一张图像将是欢迎界面。点击 `next`


    ![snipping_2.PNG](img/00003.jpeg)


    ![snipping_3.PNG](img/00004.jpeg)


    我们现在准备好安装 `Windows 7 USB/DVD download Tool` 了。一旦你点击 `Install`，程序将启动安装界面，取决于你的电脑，安装可能只需几秒钟。


    ![snipping_4.PNG](img/00005.jpeg)


    当出现“Completed the Windows 7 USB/DVD Download Tool Setup Wizard”屏幕时，点击 `Finish`
    退出安装程序。


    你现在会在桌面上看到一个 `Windows 7 USB DVD download tool` 图标。双击它打开程序。


    ![snipping_5.PNG](img/00006.jpeg)


    点击 `Browse` 选择你稍早创建的 Windows 8 ISO 文件位置。


    ![snipping_6.PNG](img/00007.jpeg)


    接下来我们需要选择媒体类型。点击 `USB device`。


    ![snipping_8.PNG](img/00008.jpeg)


    你现在应该看到已选中的 USB 设备和可用存储空间。如果你的优盘上有文件，我建议先备份，因为该工具将重新格式化优 盘。


    ![snipping_9.PNG](img/00009.jpeg)


    `Windows 7 USB/DVD download tool` 现在将格式化 USB 盘并复制所需文件。取决于你的电脑，这大约需要 10 到 15 分钟。


    # 第五章


    | 在这一章中，我们将分别通过 DVD 光盘和可启动 USB 盘安装我们的 CentOS 6.3 操作系统。然后我们为 CentOS 配置网络访问，并为服务器分配静态
    IP 地址。 |


    ## 从 DVD 光盘安装 CentOS 6.3


    现在我们已经准备好了专用服务器硬件，并且 CentOS 6.3 DVD 1 已经在光盘上，我们可以开始安装服务器基础操作系统。


    选择你的服务器从 CD 启动，并将 CentOS DVD 1 插入 DVD Rom 驱动器中。


    ![centos_1.jpg](img/00010.jpeg)


    一旦加载上述屏幕，你需要选择安装或升级现有系统。


    下一个出现的屏幕是在安装前开始测试介质。选择 `skip` 跳过介质测试并开始安装。


    测试介质确实需要一些时间，安装介质通常不会有问题，所以你可以跳过此测试并开始从你的 CentOS 6 安装。


    ![centos 2.png](img/00011.jpeg)


    CentOS 的欢迎界面现在将显示。点击下方屏幕上的 `next`。


    ![centos_3.png](img/00012.jpeg)


    现在你将被要求为你的 CentOS 安装选择键盘语言。如下屏所示。


    ![centos_4.png](img/00013.jpeg)


    在点击选择语言的 next 后，你将看到如下所示屏幕，选择你的键盘语言。对于以前安装过操作系统的人来说，这些看起来都会非常熟悉。


    ![centos_5.png](img/00014.jpeg)


    与我们的服务器构建一样，我们使用的是本地连接的硬盘，在后续屏幕上你应该选择基础存储设备。


    ![centos_6.png](img/00015.jpeg)


    你可能会看到以下警告 - Error processing drive（处理驱动器错误）。如果看到这个，点击 `Re-initialize all` 按钮继续：


    ![centos_7.png](img/00016.jpeg)


