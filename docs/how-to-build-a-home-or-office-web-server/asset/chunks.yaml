    # Chapter Ten


    | In this chapter we will cover some basic optimising of your server. This will
    include configuring MySQL for heavily database driven websites, changing full
    text searching for three letter words. |


    ## Optimising MySQL


    Here we will cover the basics in optimising MySQL for database driven websites.
    To achieve this we will be editing the `my.cnf` file and to do this you will need
    root access via your SSH client; such as `putty` to access and edit via commend
    line on your new server.


    Configuring MySQL to optimise your server and performance will have a major impact
    on speed and the hardware of your server, in some cases reducing the server load
    by almost half.


    We will cover the most importantly used variables for MySQL configuration files
    and a MySQL monitoring solution to allow you to monitor and tweak your MySQL configuration
    file to meet your servers unique requirements.


    All MySQL optimisation settings are stored in your `my.cnf` file located on your
    server. By default this file has very little, if anything at all in it by default;
    this means we will be adding a few lines in order to optimize MySQL.


    The reason why there are so few settings in the `my.cnf` file is that every server
    environment is different. Each has different server memory, different sites and
    some servers are running database driven websites and others are not. This means
    that the configuration files for MySQL are unique to each environment.


    The MySQL settings we will use have been broken down in into four categories which
    are listed below with a short break down for each category. Where we have `M`
    & `K` in our `my.cnf` settings these stand for Megabytes (M) and Kilobytes (K).


    ### Defaults setting


    The only default settings that maybe in your `my.cnf` is the `max_connections`.
    However this is not always present. The default is `100` on older versions of
    MySQL but this should now have this variable increased to `500`.


    The reason why `500` should now considered best number for this variable is that
    the default max number of connections for Apache is `512`. If this is left at
    `100` in the `my.cnf` file and Apache is sending child processes at around `500`
    then after MySQL has connected `100` the rest will be rejected; MySQL will then
    start returning errors. It is best to keep these both around the same number.


    ```

    max_connections = 500

    ```


    ### Chache


    These are the common variables that I believe should be in all `my.cnf` files.


    The first one is `thread_cache_size`, the default for this is `0`. The thread
    cache size is the number of threads the server should cache for reuse. A starting
    value for this would be `4` and can then be monitored via MySQL tuner for optimal
    performance.


    Next is `table_cache` the default value for this is `64`. The table cache is the
    number of open tables for all threads.


    Next we have `query_cache_limit`; the default for this is `1M` which means that
    anything that is to be stored in the query cache cannot be larger than `1M`.


    Next we have `query_cache_size`; the default value for this is `0` which means
    there is no query cache even if it is enabled. A starting value for the query
    cache size would be `6`, the query cache size is the amount of memory for cache
    and queries which means that the same queries do not have to keep getting pulled
    from the database and can speed up results.


    Next we have `query_cache_type`; the default for this is `1`, `0` means it is
    off or there is an optional value of `2` which means that it is on if a database
    needs it.


    ### Buffer


    The first one is the `key_buffer_size`; the default for this is `8M` and this
    is the buffer size for indexed blocks. A good starting value is `24M` and can
    be monitored and amended as needed.


    Next we have `read_buffer_size`; the default value is `128K` and this is the tread
    sequential table scan buffer size.


    Next we have the `join_buffer_size`; the default value for this is `128K` and
    this is a variable that can be set to speed up joins that do not have indexing.


    ### Others


    First we have `connect_timeout`; this is the number of seconds that MySQL will
    wait for a packet before it sends a bad request. The default value for this is
    `10` which stands for 10 seconds, if you have a slow server you can increase this
    so that users do not see a lot of bad requests because MySQL is timing out.


    Next we have `max_connect_errors`; the default value for this is `10`. This is
    the maximum number of interrupted connections from a host. The number of interrupted
    connections would need to run in a row which would result in the host being permanently
    blocked. To unblock them you would have to run `flush hosts` in MySQL command
    line.


    Next we have `max_allowed_packet`; the default size for this is `1M`, this is
    the maximum size of the packet that can connect.


    Next we have `tmp_table_size`; this is the maximum size of the temp table size.
    This is a system specific setting and a good starting point would be `8M` and
    then any required monitoring and adjusting.

