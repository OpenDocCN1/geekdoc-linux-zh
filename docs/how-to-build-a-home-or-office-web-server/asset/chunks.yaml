    # 第十章


    | 在本章中，我们将涵盖对服务器进行的一些基础优化。这包括为高度依赖数据库驱动的网站配置 MySQL，以及更改三字母单词的全文搜索。 |


    ## 优化 MySQL


    在这里，我们将介绍为数据库驱动网站优化 MySQL 的基础知识。为了实现这一点，我们将编辑 `my.cnf` 文件，为此你将通过 SSH 客户端（如 `putty`）获取
    root 权限，以便在新服务器上通过命令行进行访问和编辑。


    配置 MySQL 以优化服务器和性能将对服务器的速度和硬件产生重大影响，在某些情况下可以将服务器负载降低近一半。


    我们将介绍 MySQL 配置文件中最常用的变量，以及一种 MySQL 监控解决方案，允许你监控并调整 MySQL 配置文件以满足服务器的独特需求。


    所有 MySQL 优化设置都存储在位于服务器上的 `my.cnf` 文件中。默认情况下，该文件几乎没有内容，或者完全为空；这意味着我们将添加几行内容来优化
    MySQL。


    `my.cnf` 文件中设置如此少的原因是每个服务器环境都是不同的。每个环境都有不同的服务器内存、不同的网站，且某些服务器运行数据库驱动的网站而另一些则没有。这意味着
    MySQL 的配置文件对于每个环境来说都是唯一的。


    我们将使用的 MySQL 设置已分为四类，如下列表所示，并对每种类别进行了简要说明。当 `my.cnf` 设置中出现 `M` 和 `K` 时，它们分别代表兆字节（M）和千字节（K）。


    ### 默认设置


    `my.cnf` 中可能唯一的默认设置是 `max_connections`。然而这并不总是存在。在旧版本的 MySQL 中，其默认值为 `100`，但现在应该将此变量增加到
    `500`。


    之所以 `500` 现在被认为是该变量的最佳数字，是因为 Apache 的默认最大连接数是 `512`。如果将 `my.cnf` 文件中保留为 `100`，且
    Apache 发送的子进程约为 `500` 个，那么在 MySQL 连接了 `100` 个后，剩余的将被拒绝；MySQL 将会开始返回错误。最好让两者保持在相似的数值。


    ```

    max_connections = 500

    ```


    ### 缓存 (Cache)


    这些是我认为应该所有 `my.cnf` 文件中的常用变量。


    第一个是 `thread_cache_size`，其默认值为 `0`。线程缓存大小是服务器应缓存以供复用的线程数。起始值可以为 `4`，然后可以通过 MySQL
    tuner 进行监控以获得最佳性能。


    接下来是 `table_cache`，默认值为 `64`。表缓存是所有线程的打开表数量。


    接下来是 `query_cache_limit`；默认值为 `1M`，这意味着任何存储在查询缓存中的内容都不能超过 `1M`。


    接下来是 `query_cache_size`；默认值为 `0`，这意味着即使启用了查询缓存也没有缓存。查询缓存大小的起始值可以为 `6`，查询缓存大小是用于缓存和查询的内存量，这意味着相同的查询不需要反复从数据库中提取，从而加快结果返回。


    接下来是 `query_cache_type`；默认值为 `1`，`0` 表示关闭，或者有一个可选值 `2`，表示如果数据库需要则开启。


    ### 缓冲区 (Buffer)


    第一个是 `key_buffer_size`；默认值为 `8M`，这是索引块的缓冲区大小。良好的起始值是 `24M`，可以根据需要进行监控和修改。


    接下来是 `read_buffer_size`；默认值为 `128K`，这是线程顺序表扫描的缓冲区大小。


    接下来是 `join_buffer_size`；默认值为 `128K`，这是一个可以加速没有索引的连接的变量。


    ### 其他 (Others)


    首先是 `connect_timeout`；这是 MySQL 在发送错误请求之前等待数据包的秒数。默认值为 `10`，即 10 秒，如果你的服务器缓慢，可以增加此值，以免用户因
    MySQL 超时而看到大量的错误请求。


    接下来是 `max_connect_errors`；默认值为 `10`。这是来自主机的中断连接的最大数量。中断连接数需要连续发生，会导致该主机被永久封锁。要解封，你需要在
    MySQL 命令行运行 `flush hosts`。


    接下来是 `max_allowed_packet`；默认大小为 `1M`，这是可以连接的数据包的最大大小。


    接下来是 `tmp_table_size`；这是临时表的最大大小。这是一个特定于系统的设置，良好的起始点是 `8M`，然后根据需要进行任何监控和调整。


