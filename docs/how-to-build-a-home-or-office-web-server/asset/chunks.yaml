    为了使用你自己的名称服务器，你将为你的域名设置粘合记录（glue records）。请让负责注册域名的人员为你的域名分配粘合记录。你需要向他们提供服务器的
    IP 地址，你需要两个粘合记录，且两个粘合记录可以具有相同的 IP 地址。


    然后，你需要要求他们将你的域名指向你新的名称服务器。


    在完成此步骤后，你需要等待大约 24 小时，以便域名和名称服务器在互联网上完成生效。


    # 添加域名


    现在 cPanel 已经安装并完成了初始设置，现在是开始创建一个软件包（package）的时间了，这样你就可以将域名分配给服务器；如果你还没有这样做，那么浏览一下关于
    cPanel 的在线文档是值得的，这样你对功能所在及其工作原理有一个基础的了解。


    在向你的服务器添加域名之前，你需要先创建一个可以分配给该域名的软件包。要做到这一点，你需要登录 WHM 面板。


    登录后，你将在屏幕的左侧看到一个链接菜单。向下滚动，直到看到“packages”（软件包）标题。在下方点击“add package”（添加软件包），这将加载如示例截图所示的屏幕。


    ![cpanel-2.PNG](img/00137.jpeg)


    首先我们需要为软件包命名。在这个测试服务器上我只想运行一个网站，所以我希望它能充分利用潜力，实际上是一个无限制软件包，因此我将此软件包命名为“unlimited”（无限制）。


    下一部分是“resources”（资源）；在这里你可以创建限制性的自定义软件包。这就是共享虚拟主机账户被限制的方式：创建一个带有限制的软件包，然后将域名分配给该软件包。


    你不需要为每个域名都创建一个软件包，只要你希望每个域名账户具有相同的限制，你就可以向一个软件包分配多个域名。


    在“settings”（设置）部分，你可以保持默认设置不变，如下方示例截图所示。


    ![cpanel-3.PNG](img/00138.jpeg)


    接下来点击“add to create”（添加创建）并保存你的新软件包。


    现在你已经创建了软件包，我们可以在服务器上创建一个新账户并将域名分配给该账户。


    向下滚动左侧链接菜单，直到来到“account functions”（账户功能）标题。点击“create a new account”（创建新账户），这将加载如示例截图所示的屏幕。


    ![cpanel-4.PNG](img/00139.jpeg)


    第一部分是“domain information”（域名信息）。这是你在域名注册商处注册的域名。填写所需字段，然后你就会得到如示例截图所示的区域。


    邮箱是服务器管理员的邮箱地址，由其维护该账户。


    ![cpanel-5.PNG](img/00140.jpeg)


    接下来我们必须将账户分配到一个软件包；这就是我们之前创建的软件包。从选择框中选择你的软件包。


    ![cpanel-6.PNG](img/00141.jpeg)


    接下来是“settings”（设置），这些可以保持默认设置和主题不变。


    ![cpanel-7.PNG](img/00142.jpeg)


    下一个设置可以保持原样，因为它用于你希望在服务器上创建代理账户时。


    ![cpanel-8.PNG](img/00143.jpeg)


    我们几乎要完成了，现在我们需要选择 DNS 设置。确保你勾选了显示“使用在域名注册处指定的名称服务器（忽略本地指定的名称服务器）”的复选框。


    ![cpanel-9.PNG](img/00144.jpeg)


    最后一个选项是“mail settings”（邮件设置）。如果你想使用随服务器自带的 Webmail，你可以将其留为“local mail exchanger”（本地邮件交换），或者选择“automatically
    detect configuration”（自动检测配置）。


    ![cpanel-10.PNG](img/00145.jpeg)


    最后点击“create”（创建）按钮，你的账户将被创建，域名将分配给服务器。


    如果你在注册域名、应用粘合记录和名称服务器后没有等待 24 小时，你可能仍然需要等待生效完成。


    如果已经过了 24 小时，那么你的域名和名称服务器可能已经在互联网上完全激活，你可以准备好测试你的域名是否解析到了你的新 Web 服务器。


    在浏览器的 URL 地址栏中输入你的域名。如果你加载了如示例截图所示的页面，说明你的域名正确解析到了你的 Web 服务器，你准备好创建网页并将其上传到服务器了。


    ![cpanel-11.PNG](img/00146.jpeg)


    如果你没有看到此页面，这可能只是 DNS 传播问题，你可以在 [`www.intodns.com/`](http://www.intodns.com/) 进行检查。


    如果你仍然遇到问题，可以访问支持网站寻求帮助，详情请参阅技术支持章节。我很乐意为你查看。


    # 第九章


    | 在本章，我们将涵盖一些基础的服务器安全，包括创建 wheel 用户、禁用 root 访问、更改 SSH 端口以及安装服务器防火墙。 |


    ## 创建 wheel 用户并禁用 root 访问


    通过 SSH 禁用对服务器的 root 访问提供了额外的两层安全。我强烈建议你也采取此行动并更改你的 SSH 端口。服务器受到许多攻击，其中大多数旨在获取对你服务器的访问权限。


    一旦创建了 wheel 用户并禁用了 root 访问，你必须使用具有 root 权限的用户账户通过 SSH 登录服务器，然后切换到 root 用户。这使得服务器在授予完全
    root 权限之前请求两次有效的登录。


    Wheel 用户也称为超级用户（supper users）。在接下来的几步中，我将引导你：首先是如何创建一个 wheel 用户并向该用户授予 root 权限，其次是如何禁用
    root 访问。


    通过 SSH 禁用 root 访问不会禁用 cPanel 和 WHM 的 root 用户名和密码登录，你仍将使用在 CentOS 安装期间创建的用户名 `root`
    和密码。如果你还没有为用户名 `root` 设置强密码，我建议登录你的 WHM 面板并将 root 密码更改为非常强的密码。一旦在 WHM 中更改了密码，它将更改服务器上所有其他
    root 登录的密码，例如通过 SSH 登录。


    第一步是创建新用户，因为通常需要登录服务器的只有技术支持人员，我将此用户命名为 `tecsupport`。


    使用你的 root 用户名和密码通过 SSH 登录服务器。登录后执行以下两条命令：


    ```

    adduser tecsupport

    passwd tecsupport

    ```


    你现在会在 SSH 客户端看到一个如示例所示的屏幕，要求你为用户 `tecsupport` 输入新密码。选择一个你记得住但又足够强大不易被猜到的密码。


    ![wheel-1.PNG](img/00147.jpeg)


    一旦输入了新密码，系统会要求你确认密码。确认后，你将看到显示“所有身份验证令牌更新成功”的消息。


    接下来我们需要将 `tecsupport` 用户添加到 wheel 组。要做到这一点，我们需要编辑一个文件。在命令行提示符下执行以下命令：


    ```

    vi /etc/group

    ```


    你现在会看到窗口变为与下方示例截图相同的界面。我们需要进入插入模式，为此请按下键盘上的 `(i)` 键。


    ![wheel-2.PNG](img/00148.jpeg)


    使用键盘上的方向键向下滚动，直到看到 `wheel:x:10:` 这一行，将其更改为 `wheel:x:10:tecsupport` 以将 `tecsupport`
    用户添加到 wheel 组。


    按下键盘上的 `esc` 键。


    按下键盘上的 `(:)` 键，然后按下 `(w)` 键，这将保存文件。

    '
- fmt: '

    Press the `(:)` key on your keyboard and then the `(q)` key, this will quit the
    text editor and return to command line prompt.


    Now that we have added the user we will need to restart `sshd` in order for the
    settings to take effect. You will now be back at the command line prompt and you
    will need to issue the following command: -


    ```

    /etc/init.d/sshd restart

    ```


    We have now created the wheel user and granted them root access, next we need
    to disable root login. To do this we need to edit another file. Issue the following
    command at the command line prompt: -


    ```

    vi /etc/ssh/sshd_config

    ```


    When the fill opens you will only see a small part of the file, use your arrow
    keys to scroll down until you come across the line that reads `#PermitRootLogin
    yes`.


    This is the line we need to edit. We need to enter the insert mode so to do this
    press the `(i)` key on your keyboard.


    Change the line from `#PermitRootLogin yes` to `PermitRootLogin no` remembering
    to remove the hash symbol from the start of the line.


    Press the `esc` key on your keyboard.


    Press the `(:)` key on your keyboard and then the `(w)` key, this will now save
    the file.


    Press the `(:)` key on your keyboard and then the `(q)` key, this will quit the
    text editor and return to command line prompt.


    Now that we have edited the file we will need to restart `sshd` in order for the
    settings to take effect. You will now be back at the command line prompt and you
    will need to issue the following command: -


    ```

    /etc/init.d/sshd restart

    ```


    We have now disabled root login. Do not exit you SSH client because if any mistakes
    have happened you may not be able to log back in as root, the current SSH session
    is already logged in so keep that open.


    Open a new SSH client window and we will login with the Wheel user that we have
    created.


    Now that you have logged in we need to switch to the super user, to do this issue
    the following command: -


    ```

    su

    ```


    You will now be asked for a password. This is the root password that is being
    required.


    You can check that you are now acting as root by issuing the following command:
    -


    ```

    whoami

    ```


    Your window should look like the example screenshot below and you can see that
    the line after issuing the command `whoami`, states you are root.


    ![wheel-3.PNG](images/00149.jpeg)


    You can now close off your SSH windows by issuing the following command. (If you
    have logged in and switched to the super user you will need to issue the command
    twice.): -


    ```

    exit

    ```


    ## Changing your SSH port


    While there are many ways to make sure your server is as secure as possible there
    are some basic steps and measures that you can take to cover your bases.


    The Secure Shell (SSH) Protocol by default uses port `22`. Accepting this default
    value does not make your system insecure. Changing the port will not provide a
    significant variance in security. However, changing the default SSH port will
    stop many of the automated attacks your server will face and a will make it a
    bit harder to guess which port SSH is accessible from, in other words, a little
    security through obscurity.


    The easiest way to change the port is to SSH into the server as the root user:


    To do this we will need to use software such as `putty` which is a free telnt/ssh
    client.


    Please see our software chapter for the download location


    Once you have downloaded `putty` you will not need to install anything as this
    is a standalone software client. Double click on the `putty` icon which will be
    in your downloads folder to open a new session. (Example below)


    ![putty.PNG](images/00068.jpeg)


    Once `putty` is opened the cursor will be blinking in a box called Host Name (or
    IP address) in this box you need to enter the IP address of your server. When
    you have entered your IP address click the open button at the bottom.


    You will need to login as the root user (`root`) and the password you created
    when installing CentOS.


    As root, use the text editor (`vi`) to edit the sshd configuration file. This
    can be done by typing the following on the command line: -


    ```

    vi /etc/ssh/sshd_config

    ```


    Next you will need to locate the line that specifies the port. If your `sshd_config`
    file has not been altered, the `Port` setting will be commented out with a `#`
    symbol (example below):


    ![ssh_2.PNG](images/00150.jpeg)


    The `#` symbol tells the server to ignore anything after it on the same line,
    so we will need to remove that character and then change the number `22` to something
    else. Be sure you do not pick a port number that is in use by a different service.


    The default line will look like this:


    `#Port 22`


    In this example the port has been changed to `2922` and the `#` symbol removed.
    (Example below)


    ![ssh_1.PNG](images/00151.jpeg)


    Press the `(i)` key on your keyboard to start the insert mode of the text editor.
    Once you have changed your port number and removed the `#` symbol you will need
    to save and exit the text editor.


    Press the `esc` key on your keyboard.


    Press the `(:)` key on your keyboard and then the `(w)` key, this will now save
    the config file.


    Press the `(:)` key on your keyboard and then the `(q)` key, this will quit the
    text editor and return to command line prompt.


    Next is to restart SSH in order for the new settings to take effect.


    ```

    /etc/init.d/sshd restart

    ```

    (example below)


    ![ssh_3.PNG](images/00152.jpeg)


    Your SSH service has now been restarted and the new SSH port has taken effect.


    ## Installing server firewall


    To install the server firewall you must be logged in to the server as the root
    user. I will cover logging and switching to super user for the people who have
    disabled root access and created a wheel user account.


    For people that have not created a wheel user and deleted root access you can
    skip this step.


    ### Login and switch to super user


    You will need to login to the server via SSH and switch to the super user.


    Open a new SSH client window and we will login with the Wheel user that you have
    created.


    Now that you have logged in we need to switch to the super user, to do this issue
    the following command: -


    ```

    su

    ```


    You will now be asked for a password. This is the root password that is being
    required.


    You can check that you are now acting as root by issuing the following command.


    ```

    whoami

    ```


    Your window should look like the example screenshot below and you can see the
    line after issuing the command `whoami` states you are root.


    ![wheel-3.PNG](images/00149.jpeg)


    We need to be in the main directory folder and at the moment you can see we are
    in `/home/tecsupport`, in order to go back you will need to issue the following
    command: -


    ```

    cd ../../

    ```


    You will now see that the current directory has changed on the bottom line as
    shown in the example screenshot below.


    ![firewall-1.PNG](images/00153.jpeg)


    ### Installing Firewall as root user


    Now that you have logged into the server as the root user we can install the firewall
    on the server. There are four commands to issue in order to download and install
    the server. The commands are listed below and after each command press the enter
    key on your keyboard and allow each command to execute before continuing to the
    next.


    ```

    wget http://www.configserver.com/free/csf.tgz

    tar -xzf csf.tgz

    cd /csf

    sh install.sh

    ```


    The output when completed will look like the example screenshot below. You can
    now logout of your SSH client, if you have switched to the super user you will
    need to use the `exit` command twice.


    The exit command is: -


    ```

    exit

    ```


    ![](images/00154.jpeg)


    The firewall will now be installed on your server and is ready to be configured
    and activated. You will need to login to your servers WHM panel and from the links
    menu on the left hand side the firewall should be at the very bottom under plugins
    as shown in the example screenshot below. If plugins and the firewall are not
    showing in the links menu you will need to logout of the server and log back in.


    ![firewall-3.PNG](images/00155.jpeg)

