- fmt: '

    The file that we are going to create is a `.bat` file. This is a type of file
    that can run at the systems start up and load installed programs.


    To create a `.bat` file you will need to create a new text document. Right click
    on your desktop, select `new` and then `Text document`. This will place a new
    text document on your desktop. Rename this to something more appropriate. I have
    called mine `onLoad`.


    Open your new text document and here you will enter the commands that will start
    your new virtual machine.


    There are only two lines of code to enter and these are listed below. The first
    line is `cd`, which is the open folder command and then the full location to where
    you have installed Oracles VirtualBox, (if you have installed VirtualBox in the
    default location yours will be the same as mine. But it is worth double checking).


    The second line is the command to start the VirtualBox manager and start the virtual
    machine `VBox Manage.exe startvm`. Then we enter the name of our virtual machine,
    in this case it is `VPS-1`.


    ```

    cd "C:\Program Files\Oracle\VirtualBox\"

    VBoxManage.exe startvm "VPS-1"

    ```


    Now we need to save this text document as a `.bat` file. Click file and then save
    as. Enter the File name in the File name field, followed by `.bat`. In our example
    we use `onLoad.bat`, select `All Files` in the Save as type field and click save.


    ![vps-21.PNG](images/00124.jpeg)

    ![vps-22.PNG](images/00125.jpeg)


    You will now have an icon on your desktop like so:


    This is the file that will start your virtual machines each time your host system
    boots. As you may in the future create more than one virtual machine it would
    be time consuming going to the Startup folder each time the file needs editing.
    We can leave the `onLoad` bat file on the desktop and create a short cut which
    we can cut and paste into the Startup folder.


    Right click on your newly created bat file and select `create short cut`. The
    short cut will now be created and saved on your desktop.


    Cut and paste this short cut to your Startup folder. You can now close all open
    windows and restart your host system. When your host system re-boots your virtual
    machine will auto start.


    When your host system boots you will see a command box open like the example screenshot
    below, then your virtual machine or machines will start.


    ![vps-23.PNG](images/00126.jpeg)


    If you have more than one virtual machine required to start on system boot just
    add a third line with the name of that machine. Like so:


    ```

    VBoxManage.exe startvm "VPS-2"

    ```


    # Chapter seven


    | In this chapter we will cover configuring CentOS ready for CPanel and adding
    additional IP addresses to your server. |


    ## Configuring CentOS


    CentOS requires a few little configurations prior to installing cPanel. These
    are all relatively simple and should take no longer than 15 minutes to complete.


    cPanel comes with webmail installed which, if your are installing cPanel you will
    most likely be using the webmail that’s packaged with it. The CentOS installation
    that we created has `postfix` installed and running. When `postfix` is installed
    and running it conflicts with webmail, so we need to disable and remove this.


    cPanel have said they are addressing the issue of stopping and removing `postfix`
    as part of the cPanel installation but just to be safe we will stop and remove
    it first.


    In order to perform the configurations required you will need to login to your
    server. Open your `SSH` client and login to your server with the IP address, username
    and password that was created during the CentOS installation and network configuration.


    Once you have logged in you will need to run the following two commands pressing
    enter after each command.


    ```

    service postfix stop

    rpm –e postfix

    ```


    `Postfix` has now been stopped and removed from your server.


    Next we need to deactivate the default CentOS firewall. Again this is just two
    commands to enter.


    ```

    chkconfig iptables off

    service iptables stop

    ```


    Next we need to disable SELinux security features. To do this we need to edit
    the config file.


    To open and edit the config file you will need to type the following command:


    ```

    vi /etc/selinux/config

    ```


    To start editing the config file press the `(i)` key on your keyboard to start
    the insert mode of the text editor. Use the arrow keys to go to line 6, this should
    read `SELINUX=enforcing`, you need to change this to `disabled`. Once you have
    changed this you will need to save and exit the text editor.


    Press the `esc` key on your keyboard.


    Press the `(:)` key on your keyboard and then the `(w)` key, this will now save
    the config file.


    Press the `(:)` key on your keyboard and then the `(q)` key, this will quit the
    text editor and return to command line prompt.


    To confirm that the changes have been made you can view the config file again
    by entering the following command.


    ```

    vi /etc/selinux/config

    ```


    After editing the config file you should have a file that resembles the following:


    ```text

    # This file controls the state of SELinux on the system.

    # SELINUX= can take one of these three values:

    # enforcing - SELinux security policy is enforced.

    # permissive - SELinux prints warnings instead of enforcing.

    # disabled - No SELinux policy is loaded.

    SELINUX=disabled


    # SELINUXTYPE= can take one of these two values:

    # targeted - Only targeted network daemons are protected.

    # strict - Full SELinux protection.

    SELINUXTYPE=targeted

    ```


    Now we need to remove a few of the unwanted yum groups. With the installation
    of CentOS we have done, these are the following yum groups that we need to remove:


    * E-mail Server

    * FTP Server

    * KDE Desktop

    * Web Server

    * X Window System


    Remember to enter each one with the capitals and lower case letters as they are
    shown.


    To remove these groups enter the following command:


    ```

    yum groupremove “E-mail Server” “FTP Server” “KDE Desktop” “Web Server” “X Window
    System” own```


    During the removal you will be asked to confirm with either Y/N. Just enter `y`
    for yes, then press enter.


    That’s the entire configuration done; we just need to run an update. To do this,
    enter the following command:


    ```

    yum update

    ```


    During the update you will be asked to confirm with either Y/N just enter `y`
    for yes, then press enter.


    Now that all the configuration requirements have been made to CentOS we need to
    restart our server. To restart the server, enter the following command:


    ```

    shutdown -r now

    ```


    ## Adding additional IP’s to a VPS


    A web server can run with only one IP address, but there are times when more than
    one IP is required. With our virtualisation software installed on our host system
    we can have up to four static IP addresses assigned to each of the virtual machines
    that we create.


    The first step is to create the hardware for the IP addresses to be assigned to.
    Open Oracles VirtualBox manager window and select the virtual machine you wish
    to add the additional IP addresses to. Make sure the virtual machine is powered
    off and click `settings`.


