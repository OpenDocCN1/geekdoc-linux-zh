    ## Adding additional IP’s to a dedicated server


    Adding additional IP addresses to a dedicated server is very similar to that of
    a VPS as shown in the examples above. The only difference is how we assign the
    hardware.


    On our dedicated server we don’t have virtualisation software so we need to add
    a physical Ethernet card. To do this we can add a PCI Ethernet card to one of
    the PCI ports. These simply slot in with one screw to hold them in place and can
    be ordered online and delivered for less than £10.


    Before adding the Ethernet card you must power off your dedicated server and unplug.
    When you have done this, remove the side panel and add the PCI Ethernet card to
    your motherboard.


    Power up your server and login using your `root` username and password.


    At the command line enter the following:


    ```bash

    system-config-network

    ```


    This will open up the network configuration window. The screen shot below is what
    you should now see.


    ![config_8.PNG](images/00061.jpeg)


