    当你打开防火墙窗口时，你会看到防火墙已启用但处于测试模式，该状态位于防火墙窗口顶部，如下截图所示。


    ![firewall-4.PNG](img/00156.jpeg)


    当防火墙处于测试模式时，它允许你进行配置更改并测试防火墙，这样你所做的任何更改都不会导致被锁在服务器之外。


    每当你修改防火墙设置时，都应该先将防火墙设置为测试模式。


    为了激活你的防火墙，你必须编辑防火墙配置使其不再处于测试模式。向下滚动直到找到截图所示的区域。


    ![firewall-5.PNG](img/00157.jpeg)


    我们需要的按钮是顶部的第二个按钮，命名为 `Firewall Configuration`。点击后，页面将刷新并显示如下所示的防火墙配置文件。


    ![firewall-6.PNG](img/00158.jpeg)


    在版权部分之后，第一段文本的内容为：


    # Testing flag - 测试标志 - 启用一个 CRON 任务，在启动 `csf` 时如果出现配置问题可以清除 `iptables`。在确定防火墙工作正常之前（即防止你被锁在服务器之外！）应保持此项开启。当你确定一切无误后，记得将其设置为
    `0` 并重启 `csf`。停止 `csf` 将从 `/etc/crontab` 中删除该行


    # 当启用此项时，`lfd` 将不会启动


    在下方的文本框中，你需要输入 `0`，然后滚动到页面底部并点击更改（change）按钮。页面现在将刷新并加载，如下截图所示。


    ![firewall-7.PNG](img/00159.jpeg)


    点击 `Restart csf+lfd` 按钮重启防火墙并激活新设置。页面将刷新大量关于刷新（flushing）、丢（drop）和接受（accept）的数据，如果你滚动到页面底部，将看到截图所示的文字和一个返回按钮。


    ![firewall-8.PNG](img/00160.jpeg)


    返回防火墙主页后，你会发现防火墙的状态已变为已启用（Enabled）且正在运行（Running）。


