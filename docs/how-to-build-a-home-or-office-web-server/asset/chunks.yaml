    下方消息也可能出现，提示下方的存储设备可能包含数据。如果出现此消息且你确定硬盘上没有需要备份或保留的数据，可以选择“Yes, discard any data”（是，丢弃任何数据）。


    弹出的框会持续几秒钟（如果硬盘很大，时间可能会更长），显示“正在检查存储设备”（examining storage device）。


    ![centos_7.1.PNG](img/00017.jpeg)


    一旦硬盘初始化并接受作为存储设备，你将被引导到下一个屏幕继续安装。


    你现在需要填写服务器的主机名（例如 `server1.example.com`），然后点击`Configure Network`配置网络）按钮：


    由于这是一个可能会托管你网站的 Web 服务器，将 `example.com` 替换为你的域名会更好。主机名必须是完全限定域名名（FQDN）。使用 `server1\.`
    或 `vps1\.` 是允许的，但主机名必须以域名结尾。


    ![centos_8.png](img/00018.jpeg)


    点击`Configure Network`按钮后，会弹出网络连接（Connections）窗口。选择`System eth0` 并点击`edit`编辑来配置你的网络。


    ![centos_9.png](img/00019.jpeg)


    选择`edit`按钮后，会弹出如下所示的进一步框。勾选`connect automatically`自动连接复选框，然后点击`IPv4 Settings`IPv4
    设置选项卡。


    在`Method:`方法 下拉框中，确保选择了`Automatic (DHCP)` 自动（DHCP），并点击`apply`应用，这将关闭`Editing System
    eth0`窗口。


    ![centos_10.PNG](img/00020.jpeg)


    我们在这里允许自动 DHCP 而不是设置静态 IP 地址的原因是，每个`eth0`连接都有自己的 MAC 地址，我们稍后将在 BT 网关集纽中分配 IP 地址。


    你现在需要点击关闭网络连接框，然后你会看到如下所示的消息。


    ![centos_11.PNG](img/00021.jpeg)


    一旦上述消息关闭，你的网络连接即已完成，你可以继续操作。


    取决于服务器的速度，该消息可能只显示一瞬间，因此你可能会错过它。只要没有看到任何错误信息，就可以继续安装。


    如果等待网络管理器（network manager）返回错误信息，最常见是因为你没有通过以太网线将服务器连接到网络端口交换机或网关集纽。


    确保你已连接以太网线并再次尝试这些设置。


    如果你的服务器上有多个以太网端口且你打算使用多个，则你需要对每个`system eth0`端口执行这些设置。


    当屏幕返回到下方的截图时，你可以点击 next 继续安装 CentOS 的安装。


    ![centos_12.png](img/00022.jpeg)


    你现在需要选择时区；你可以使用动态地图或使用下拉列表来设置你的时区。完成后点击 next。


    ![centos_13.png](img/00023.jpeg)


    登录你的服务器时，主用户名始终是`root`。如果你打算安装 cPanel、访问 WHM 面板并配置 cPanel，你的用户名将是`root`以及你在此处选择的密码。你用于
    SSH 连接的主用户名也将是`root`以及你在此处选择的密码。


    在这里你需要为`root`用户设置密码。连接到外界（万维网）的服务器经常受到攻击，因此不建议在此处设置弱密码。使用大写字母和小写字母结合数字是一个良好的习惯。


    现在把这些细节记录下来也是个好主意。主用户始终是`root`，你的密码是你现在选择的。你的`root`密码至少要有六个字符。


    ![centos_14.png](img/00024.jpeg)


    接下来我们进行分区。选择`use all space`使用所有空间。这将给你一个较小的`/boot` 分区和一个较大的`/` 分区，这对于大多数用途都是足够的。


    如果你打算在服务器上安装 cPanel，最好创建一个自定义布局。这是 cPanel 建议的，但不是强制的。如果你需要此步骤，请现在阅读关于“创建自定义硬盘布局”的章节，然后返回继续安装。


    ![centos_15.png](img/00025.jpeg)


    你现在会被要求将更改写入磁盘。点击选择`write changes to disk`将更改写入磁盘的按钮。


    ![centos_16.png](img/00026.jpeg)


    如果你选择了查看或修改分区布局，将看到两个额外的屏幕。在此阶段，你不需要修改任何分区，因为我们将在本章的单独章节介绍创建自定义分区。


    你现在将看到分区的驱动结构。点击 next。


    ![centos_16.1.PNG](img/00027.jpeg)


    硬盘现在将格式化为所需的分区。


    ![centos_17.PNG](img/00028.jpeg)


    点击 next 确认在所选分区上安装引导加载程序（boot loader）。


    ![centos_17.1.PNG](img/00029.jpeg)


    接下来我们需要选择想要安装的软件。选择`Basic Server`基础服务器，然后在附加仓库字段中勾选`CentOS`，选择`Customize later`稍后自定义并点击
    next。


    ![centos_18.png](img/00030.jpeg)


    CentOS 的安装现在开始。这通常需要大约 10 分钟完成。


    ![centos_19.PNG](img/00031.jpeg)


    安装完成后，你可以从光驱动器中移除 DVD 媒介。


    ![centos_20.PNG](img/00032.jpeg)


    你已成功在服务器上安装了 CentOS 基础服务器操作系统，它现在已准备好供你配置和更新。


    服务器重启后，你可以使用之前创建的密码登录 CentOS。


    接下来你需要配置互联网访问。要此操作，请阅读本章末尾的配置互联网访问章节。


    ## 从可启动 USB 安装 CentOS 6.3


    从 USB 驱动器安装 CentOS 时没有太大区别，但有一些细微的不同。首先，你应该将 USB 闪盘插入 USB 端口，打开服务器并选择从你的 USB 设备启动。


    一旦加载下方屏幕，你需要选择安装或升级现有系统。


    ![centos_3.png](img/00012.jpeg)


    与从 DVD 安装 CentOS 不同，随后出现的屏幕是选择语言（select language）。屏幕布局也与通过 DVD 启动的格式不同。


    ![centos_4.png](img/00034.jpeg)


    在选择语言（select language）上点击 next 后，将看到如下所示屏幕，选择你的键盘语言。


    ![centos_5.png](img/00035.jpeg)


    一旦你选择了安装语言和键盘，就必须选择安装方法。你会被询问哪种类型的媒体包含安装镜像。


    使用键盘上的方向键突出显示硬盘（hard drive）并点击 ok。


    ![centos_6.png](img/00036.jpeg)


    当询问存放镜像的分区时，这很可能是我们创建可启动 USB 驱动器时的`/dev/sda1`。选择该驱动器然后点击 ok。


    ![centos_7.png](img/00037.jpeg)


    CentOS 的安装现在开始。点击 next 按钮继续。


    ![centos_8.png](img/00038.jpeg)


    你可能会看到以下警告`-Error processing drive`处理驱动器错误。如果看到此，点击`Re-initialize all`重新初始化所有以继续。


    ![centos_9.png](img/00039.jpeg)


