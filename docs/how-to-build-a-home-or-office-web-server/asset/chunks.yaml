    for broadband and IP addresses.) that will be required. CPanel licences can be
    purchased monthly from a variety of sources on the internet all at roughly the
    same cost. Licences for dedicated servers are roughly three times the price for
    that of a virtual private server but each gives you the same software and control.


    Virtual server licence         £10 monthly


    Dedicated server licence              £26 monthly


    # Chapter three


    | In this chapter we will cover the hardware needed to create our virtual private
    server (VPS) and our dedicated server. This will cover selecting the hardware
    and using an old desktop PC as a server. |


    ## Server Hardware


    There is an extreme amount of computer hardware on the market today and selecting
    the correct hardware for you needs can become very confusing. For the examples
    in this book we are going to choose from the slightly higher end of the market
    to create a powerful server yet we are going keep our budget at £400 for each.


    The server hardware we are selecting can create a dedicated server of 8 cpu cores,
    16gb ram and a 1tb hard drive. Or we can create a host operating system and 7
    virtual private servers of 1 cpu core, 2gb ram and 100gb hard drive.


    There is some additional hardware required such as a PC monitor and we will cover
    these shortly.


    ### Main server hardware


    The main hardware we are going to require to build each of our dedicated servers
    and our virtual private servers are:


    *   Motherboard


    *   Processor, fan and heat sink


    *   Thermal paste


    *   PC case and power supply


    *   Hard drive


    *   Memory


    Because I wanted to make sure that all these parts are available to all readers
    of this book I purchased all these parts from eBay. There are a large number of
    sellers who advertise motherboard bundle deals which include the motherboard,
    memory, Processor, fan and heat sink. These are priced between £200 - £300\. This
    leaves you with just the hard drive, case, power supply unit and thermal paste
    to purchase.


    I have chosen to boot my operating system from USB which eliminates the need for
    a DVD Rom drive. If you would like to install and boot your windows and centos
    for disc then you will also require a DVD Rom drive.


    The hardware I selected for both my dedicated and virtual private servers is:


    Motherboard


    Asus M5A78L-M/USB3


    This motherboard supports AMD and AM3+multi-core processors, it also delivers
    better overclocking capabilities with much less power consumption. The memory
    support is dual-channel DDR3 NON-ECC up to 16gb.


    The form factor is Micro ATX which allows me to choose a slim line case with good
    cooling. It has two PCI slots which will allow me to add additional 10/100/1000
    (gigabyte) Ethernet cards.


    The motherboard CPU socket is AM3+ which means that the processor that is chosen
    must also be AM3+


    The only really drawback of this motherboard is that it is only SATA II -3Gb/s
    whereas most of the new hard drives are now SATA III – 6Gb/s. This just means
    that my hard drive won’t run at its full potential.


    Processor


    AMD FX Black Edition 8 Core Processor socket AM3+


    As the motherboard is socket AM3+ this means that the socket of the processor
    must also be AM3+ in order to fit.


    This is part of the new AMD FX black edition range which comes unlocked ready
    for overclocking. The main points about the processor is that it uses AMD Virtualisation
    technology which means it is perfect for creating our virtual private servers.


    When buying a new processor they will always come with the heat sink and CPU fan.
    If you are purchasing a used processor then you must check that they come with
    a heat sink and fan.


    I would recommend that you should buy new, processor pins can be damaged when
    removing them or if poorly packed rendering them useless. Over used processors
    can also result in poor performance.


    Memory


    Corsair Memory 4GB DDR3 1333 Mhz dual channel


    This memory is pretty compatible with most systems and is almost the cheapest
    on the market. Just because it’s cheap does not show in its performance.'
