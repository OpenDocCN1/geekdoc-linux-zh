  trans: '

    首先，我们将创建 `/boot` 分区。在挂载点（Mount point）下：选择 `/boot`，文件系统类型选择框应该已经设置为 `ext4`，但只需确保它被设置为
    `ext4` 即可。


    在大小（size (MB)）下输入你所需的分区大小。在这里我们输入 `495`。


    在额外大小选项（additional size options）下，确保选择了固定大小（fixed size）并点击确定（ok）。


    你现在会在硬盘上看到你的 `/boot` 分区，旁边有一个勾选标记。


    ![centos_25.PNG](img/00044.jpeg)


    再次高亮 `free` 行，我们现在可以创建临时分区了。选中该行后，点击屏幕底部的创建（create）按钮。


    在第一个弹窗框中，你需要再次点击标准分区（standard partition）。


    在挂载点（Mount point）下：选择 `/tmp`，文件系统类型选择框应该已经设置为 `ext4`，但只需确保它被设置为 `ext4` 即可。


    在大小（size (MB)）下输入你所需的分区大小。在这里我们输入 `2048`，这将提供我们推荐的 2GB。


    在额外大小选项（additional size options）下，确保选择了固定大小（fixed size）并点击确定（ok）。


    ![centos_26.PNG](img/00045.jpeg)


    你现在会在硬盘上看到 `/boot` 和 `/tmp` 分区，它们旁边都有勾选标记。


    ![centos_27.PNG](img/00046.jpeg)


    接下来是创建 `swp` 分区。再次高亮 `free` 行。选中该行后，点击屏幕底部的创建（create）按钮。


    在第一个弹窗框中，你需要再次点击标准分区（standard partition）。


    一旦出现添加分区弹窗框，你需要让挂载点（mount point）为空，并在文件系统类型选择 `swap`。


    大小（MB）需要设置为服务器内存的两倍。在我的服务器上，我分配了 1GB 的内存，因此我将其设置为 `2048`。


    在额外大小选项（additional size options）下，确保选择了固定大小（fixed size）。你的添加分区弹窗看起来应该像下面的截图。


    ![centos_28.PNG](img/00047.jpeg)


    点击确定（ok），这将返回到显示硬盘分区的屏幕。


    ![centos_29.PNG](img/00048.jpeg)


    我们现在需要创建最后一个分区，即填充硬盘的所有剩余空间。再次，我们需要选择 `free` 行并点击创建（create）。在第一个弹窗框中再次选择标准分区（standard
    partition）并点击创建（create）按钮。


    在挂载点（mount point）下选择 `/`，文件系统类型应该是 `ext4`，但只需检查一下。在额外大小选项下选择填充到最大允许大小（fill to
    maximum allowable size）。你现在应该有一个与下方截图相同的屏幕。


    ![centos_29.1.PNG](img/00049.jpeg)


    点击确定（ok），这将带你回到显示硬盘和所有分区的屏幕。


    ![centos_30.PNG](img/00050.jpeg)


    你现在已经创建了所有需要的分区。点击下一步（next）继续分区创建。


    ![centos_31.PNG](img/00051.jpeg)


    确认将更改写入磁盘，这将格式化硬盘并创建新的分区和文件系统。


    接下，你会被要求确认引导加载程序（boot loader）。这里已经像下面的截图一样预填好了，所以你只需点击下一步（next）。


    ![centos_32.PNG](img/00052.jpeg)


    你现在将处于下面的屏幕，可以选择你想要在服务器上安装的软件。这现在已经带你回到了 CentOS 的标准安装，你可以继续进行安装。


    ![centos_18.png](img/00053.jpeg)


    ## 配置网络访问


    CentOS 现在应该已成功安装在你的服务器上。为了让你的服务器从外部访问，我们需要为它分配一个静态 IP 地址。要做到这一点，我们使用服务器以太网（LAN）MAC
    地址。


    作为网关使用的 BT Hub 现在将检测到你的新服务器，并以端口的 MAC 地址为它命名。首先，我们需要知道服务器正在使用的端口 MAC 地址。


    如果你只连接了一台服务器，这并不是问题，但当你连接多个服务器时，情况可能会变得有点混乱。


    首先，你需要登录 CentOS，目前你无法使用 `SSH` 连接，因此必须通过键盘、鼠标和显示器进行。


    ![config_1.PNG](img/00054.jpeg)


    当 CentOS 首次启动时，你会看到一个与上方截图相同的屏幕。


    前两行告诉你 CentOS 版本、发布版本以及内核（Kernel）。下一行是 `server1 login`：`server1` 是我们分配服务器的名称，`server1.example.com`。


    你需要使用用户名 `root` 登录并按回车。接下来是密码。输入你的密码并按回车。当你输入密码时，不会有任何字符显示，不要担心，这是正常的。


    登录后，你将看到像下面的快屏幕。


    ![config_3.PNG](img/00055.jpeg)


    现在我们已经登录，我们需要获取服务器的 `eth0` MAC 地址，以便我们可以在网关 Hub 中分配静态 IP 地址。


    在命令行提示符处输入以下命令并按回车：


    ```

    ifconfig

    ```


    这现在将为你展示网络连接设置。此时我们只关心第一行。在我们下方的示例图中，该行内容为：


    `eth0 link encap:Ethernet HWaddr 08:00:27:57:70:B0`


    ![config_4.PNG](img/00056.jpeg)


    `HWaddr` 代表硬件地址，其后的数字和字母就是该 `eth0`（以太网网端口）的 MAC 地址。


    我们现在可以登录网关 Hub 为服务器分配静态 IP 地址。


    要访问 Hub，打开浏览器并在 URL 地址栏输入 `192.168.1.254`。


    作为网关使用的 BT Hub 现在将检测到你的新服务器，并以端口的 MAC 地址为它命名。首先，我们需要知道服务器正在使用的端口 MAC 地址。


    如果你只连接了一台服务器，这并不是问题，但当你连接多个服务器时，情况可能会变得有点混乱。


    首先，你需要登录 CentOS，目前你无法使用 `SSH` 连接，因此必须通过键盘、鼠标和显示器进行。


    ![config_1.PNG](img/00054.jpeg)


