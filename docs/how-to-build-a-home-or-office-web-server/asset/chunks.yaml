    ![centos_13.png](images/00023.jpeg)


    When logging into your server the main username is always `root`. If you intend
    to install cPanel, to access the WHM panel and configure cPanel your username
    will be `root` along with the password you select here. Your main username for
    SSH connections will be `root` and the password you select here.


    Here you will need to set a password for the `root` user. Servers that are connected
    to the outside world (World Wide Web) come under attack so setting a week password
    here is not recommended. It is good practice to use a combination of upper and
    lower case letters along with a selection of numbers.


    It will also be a good idea to write these details down now. The main user is
    always `root` and your password is what you choose now. Your root password must
    be at least six characters long.


    ![centos_14.png](images/00024.jpeg)


    Next we do the partitioning. Select `use all space`. This will give you a small
    `/boot` partition and a large `/` partition which is fine for most purposes.


    If you intend to install cPanel on your server your will be best to create a custom
    layout. This is recommended by cPanel but not compulsory. If you require this
    step please now read the chapter on create custom hard drive layout and return
    to continue your installation.


    ![centos_15.png](images/00025.jpeg)


    You will now be asked to write changes to disk. Click the button selecting `write
    changes to disk`.


    ![centos_16.png](images/00026.jpeg)


    If you have selected review or modify partitioning layout you will see two additional
    screens. At this stage you do not need to modify any of the partitions as we will
    cover creating custom partitions in a separate section of this chapter.


    You will now be presented with the partitioned drive structure. Click `next`.


    ![centos_16.1.PNG](images/00027.jpeg)


    The hard drive will now be formatted with the required partitions.


    ![centos_17.PNG](images/00028.jpeg)


    Click on `next` to confirm installation of the boot loader on the selected partition.


    ![centos_17.1.PNG](images/00029.jpeg)


    Next we need to select the software we want to install. Select `Basic Server`,
    then check `CentOS` in the additional repositories field, choose `Customize later`
    and click on `next`.


    ![centos_18.png](images/00030.jpeg)


    The installation of CentOS will now begin. This normally takes around 10 minutes
    to complete.


    ![centos_19.PNG](images/00031.jpeg)


    When the installation has completed you can remove the DVD media from your Rom
    drive and click the `reboot` button.


    ![centos_20.PNG](images/00032.jpeg)


    You have successfully installed CentOS basic server operating system on your server
    and it is now ready for you to configure and update.


    After your server has rebooted you can login to CentOS with the username `root`
    and the password you created previously.


    Next you will need to configure your installation for internet access. To do this
    please read the section configuring internet access at the end of this chapter.


    ## Create custom hard drive layout


    When installing Red Hat Enterprise Linux, it is recommended to use an `ext` file
    system (`ext2`, `ext3`, or `ext4`).


    I have listed below the most common partition system for CentOS and a cPanel server
    configuration setup. There are more optional partitions you can add to these if
    your server requires them but this configuration is sufficient for the large majority
    of servers.


    | `/boot` | 495MB |

    | `/temp` | 2GB |

    | `swap` | Twice the servers RAM |

    | `/` | Grow to fill disk |


    The `/boot` partition is used for the Karnels, boot loader and configuration files
    of your server.


    The `/temp` partition is where all temporary files will be stored on your server.


    The `swap` partition is used for the amount of RAM overflow that your system can
    write to your hard drive disk.


    The `/` partition which is set to grow to fill disk is the main partition of your
    server and is where your base operation system is stored. cPanel will be installed
    here and create any required directories such as `/home`, `/var` and `/usr`.


    In order to create a custom layout of your partitioning you will need to select
    `create custom layout` on the installation screen which type of installation would
    you like?


    Once you have selected `create custom layout` as per the screen below click `next`.
    This will then take you into the edit and modify hard drive partitioning.


    ![centos_21.PNG](images/00040.jpeg)


    You will now see your hard drive, named `sda` and the free space as per the screen
    below. If you see other partition volumes other than as shown delete these as
    these will be from previous installation on this hard drive.


    ![centos_22.PNG](images/00041.jpeg)


    Highlight the free line under your `sda` hard drive and click `create` at the
    bottom of your screen.


    ![centos_23.PNG](images/00042.jpeg)


    On the small popup box that appears called `create storage` select `standard partition`
    and click `create`.


    ![centos_24.PNG](images/00043.jpeg)

