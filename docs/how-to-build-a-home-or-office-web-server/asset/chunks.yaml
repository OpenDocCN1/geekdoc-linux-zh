    First we will create the `/boot` partition. Under the Mount point: select `/boot`
    the file system type select box should already be set to `ext4` but just make
    sure that this is set to `ext4`.


    Under size (MB) is where you enter the size of the partition that you require.
    Here we enter `495`.


    Under additional size options make sure fixed size is selected and click ok.


    You will now see you `/boot` partition on your hard drives with a tick next to
    it.


    ![centos_25.PNG](images/00044.jpeg)


    Highlight the line `free` again and we can now create our temp partition. When
    you have highlighted it click the create button at the bottom of your screen.


    On the first popup box you will need to click standard partition again.


    Under the Mount point: select `/tmp`, the file system type select box should already
    be set to `ext4` but just make sure that this is set to `ext4`.


    Under size (MB) is where you enter the size of the partition that you require.
    Here we enter `2048` which will give us the 2GB recommended.


    Under additional size options make sure fixed size is selected and click ok.


    ![centos_26.PNG](images/00045.jpeg)


    You will now see you `/boot` and `/tmp` partition on your hard drives with a ticks
    next to them.


    ![centos_27.PNG](images/00046.jpeg)


    Next is to create the `swp` partition. Highlight the line `free` again. When you
    have highlighted it click the create button at the bottom of your screen.


    On the first popup box you will need to click standard partition again.


    Once the add partition popup box appears you will need to leave mount point blank
    and under file system type select `swap`.


    The size (MB) will need to be set to twice your servers RAM. On my server I have
    allocated just 1GB of RAM so I will set this to `2048`.


    Under additional size options make sure fixed size is selected. Your add partition
    popup box should look like the screen shot below.


    ![centos_28.PNG](images/00047.jpeg)


    Click ok which will return you to the screen showing your hard drive partitions.


    ![centos_29.PNG](images/00048.jpeg)


    We now need to create our last partition which is to fill all remaining space
    of the hard drive. Again we need to select the line `free` and click on create.
    On the first popup box select standard partition again and click the create button.


    Under mount point select `/` and again the file system type should already be
    `ext4` but just check. Under additional size options select fill to maximum allowable
    size. You should now have a screen the same as the screen shot below.


    ![centos_29.1.PNG](images/00049.jpeg)


    Click ok which will return you to your screen showing you your hard drives and
    all the partitions.


    ![centos_30.PNG](images/00050.jpeg)


    You have now created all the partitions that are required. Click next to continue
    that partition creation.


    ![centos_31.PNG](images/00051.jpeg)


    Confirm the write changes to disk which will format the hard drive and create
    the new partitions and file system


    Next you will be asked to confirm the boot loader. This will already be pre filled
    out like the screen shot below so you can just click next.


    ![centos_32.PNG](images/00052.jpeg)


    You will now be on the screen like below with the option of select the software
    that you wish to install on your server. This has now taken you back to the standard
    installation of CentOS and you can continue with you installation.


    ![centos_18.png](images/00053.jpeg)


    ## Configuring Internet Access


    CentOS should now be successfully installed on your server. In order to make your
    server accessible from the outside would we need to assign it a static ip address.
    To do this we use the server Ethernet port (LAN) mac address.


    Your BT hub that is used as a gateway will now have detected your new server and
    given it the name of the ports Mac address. First we need to know your servers
    Mac address that the port is using.


    If you only have one server connected then this would not be a problem, but when
    you come to have multiple servers connected it can get a little confusing.


    First you will need to login to CentOS, at present you cannot use `SSH` to connect
    so it will have to be via keyboard, mouse and monitor.


    ![config_1.PNG](images/00054.jpeg)


    When CentOS first boots up you will be presented with a screen the same as the
    screen shot above.


    The first two lines tell you your CentOS version and release plus the Kernel.
    The next line is `server1 login`: `server1` is the name we assigned the server,
    `server1.example.com`.


    You will need to login with the username `root` and press enter. Next will be
    password. Type your password and press enter. When you type in your password you
    won’t see any characters displayed, don’t worry this is normal.


    Once you have logged in you will see a screen like the shot below.


    ![config_3.PNG](images/00055.jpeg)


    Now that we are logged in we need to get the servers `eth0` Mac address so that
    we can assign the static IP address in the gateway hub.


    Enter the following command at the command line prompt and press enter


    ```

    ifconfig

    ```


    This will now present you with the network connections settings. At this time
    it’s only the first line we are concerned with. In our example screen shot below
    the line reads: -


    `eth0 link encap:Ethernet HWaddr 08:00:27:57:70:B0`


    ![config_4.PNG](images/00056.jpeg)


    `HWaddr` stands for hardware address, the following numbers and letters after
    this is our Mac address for that `eth0` (Ethernet lan port).


    We can now login to our gateway hub and assign a static ip address to server.


    To access the hub open a browser and type `192.168.1.254` in the browser URL address
    bar. This is the gateway hub that we configured in configuration of hub 1\. Connection
    can be done from your personal computer that is connected to the wireless hub
    2; as hub 2 connects to hub 1 so this makes both accessible via wireless connections
    for admin purposes.


    Click on settings in the navigation menu and this will prompt you to login. Login
    with the password you created when configuring your gateway (Hub 1).


    Once you have logged in you will need to click on advanced settings from the sub
    navigation menu and click the button continue to advanced settings.


    Navigate to business network – devices


    Once the page has loaded you will see a list of all devices that are connected
    to your gateway hub. Each device will be listed as below.


    ![config_5.PNG](images/00057.jpeg)


    This is our new server. The gateway hub cannot get the device name so it is listed
    as unknown and then the mac address. This means we have the right device and the
    server is connected to the gateway hub. Click on the device to open a new page
    so we we configure the settings.


    You may want to name this device something more suitable. In order to rename the
    device this is done at the first section of the page.


    ![config_7.PNG](images/00058.jpeg)


    In the text field you can enter a preferred name for the device.


    Next is assigning the static IP address. In order to do this scroll down the page
    until you come to the section, Addressing.


    ![config_6.PNG](images/00059.jpeg)


    Once you have found the section in the above screen shot select yes to use public
    fixed IP address (BT Static IP Service). Select yes to always use this IP address
    and then from the drop down menu select the IP address you wish to use.


    Click on apply and your settings will be saved. The page sometimes takes a little
    time to refresh but when it does you will see a message like below.


    ![config_9.PNG](images/00060.jpeg)


    Click the ok button. You can now exit and close the gateway hub.


    Now that the static IP address has been assigned to the server we need to return
    to the server for a few last checks.


    At the command line enter the following:


    ```

    system-config-network

    ```


    This will open up the network configuration window. The screen shot below is what
    you should now see.


    ![config_8.PNG](images/00061.jpeg)


    Use you arrow keys to highlight Device configuration and press enter.

