  trans: '


    在托管网站时，使用静态 IP 地址更好，因为这意味着你没有与他人共享你的 IP 地址。其他人或其他公司可能曾使用过该动态 IP 地址并发送了大量垃圾邮件，导致该
    IP 地址被列入黑名单。


    考虑到廉的费用和稳定性，我建议使用静态 IP 地址。对于书中的示例，我使用了一个互联网服务供应商（ISP），他们为我的宽带连接分配了 5 个静态 IP 地址。这允许我创建
    3 个每个拥有单一 IP 地址的虚拟专用服务器（VPS），以及一个分配了两个 IP 地址的专用服务器。


    ## 选择你的互联网服务提供商 (ISP)


    选择互联网服务提供商是构建家庭 Web 服务器的第一步。在注册互联网服务提供商之前，需要进行仔细的考虑。一旦注册，你将面临 12 个或 14 个月的合同，因此第一次选择正确的公司至关重要。


    为了书中的目的和示例，我选择了 BT Business 宽带。他们提供快速的光纤宽带和静态 IP 地址。BT Business 宽带乐于让你从他们的设备运行
    Web 服务器或游戏服务器，并提供一些配置路由器以实现此点的支持。


    你不需要拥有办公场所或成为企业就可以安装 BT Business 宽带，因为这些可以安装在自己的家里。为了写这本书，我已将它安装在我的家里。


    通过 BT Business 宽带，他们提供一个免费的业务网关（business hub），在这个示例中我有两个，但只需要一个。我还选择了 5 个静态 IP
    地址。


    ## 配置你的家庭网络


    一旦你的宽带激活并将静态 IP 地址分配到你的线路上，你就可以开始配置网关，为你的家庭 Web 服务器做准备了。他们的支持仅显示了如何配置网关以允许一个带有单个静态
    IP 地址的 Web 服务器运行。在我们在书中展示的示例中，我们将运行多个 Web 服务器以及一个分配了多个静态 IP 地址的专用服务器；为此，我们需要以与他们所示不同的方式来配置网关和网络。


    ## 网络设备


    我在这些示例中使用的网络设备列在下面。你可能希望使用相同的设备，或用你自己的设备进行替换。


    *   两个 BT Business 网关

    *   网络端口交换机

    *   多根 cat5（以太网）线


    服务器只需要一个 BT Business 网关，但由于我想将我的家庭 PC 连接到这根宽带线并受路由器的防火墙保护，我配置了第二个网关以允许我的家庭计算机受保护访问。


    ## 网关配置


    ### 配置网关 1


    我们将首先配置网关 1，此网关将作为所有流量流量和服务器访问的网关。要访问你的网关，你需要通过 cat5 以太网线将计算机连接到网关。打开浏览器并在浏览器
    URL 地址栏中输入 `192.168.1.254`。


    这将打开你的新网关进行首次设置。由于网关是新的，它会要求你输入管理员密码并设置一个新的管理员密码。出厂设置密码位于网关后面的小拉条上。


    一旦你设置了管理员密码并获得了网关的权限，你需要在菜单栏中选择设置（settings），然后选择高级设置（advanced settings）。接下来，点击继续进入高级设置。


    配置此网关只有几个简单的步骤，第一步是禁用无线连接。我们禁用无线连接的原因是因为此网关仅作为网关，所以我们不希望家庭计算机直接连接到这个网关。


    点击菜单栏中的无线（wireless）标签，并按照屏幕上的指令禁用无线连接。


    接下来是允许静态 IP 地址。在菜单栏上选择静态 IP（static IP）选项。这将打开一个带有四个选项的新窗口。选择静态 IP 地址的第一个选项，接下来你需要输入路由器
    IP 地址；这应该已经在有关静态 IP 地址的欢迎信中发送给了你。接下来我们需要选择子网掩码（subnet mask）。由于我订购了 5 个静态 IP 地址，我选择了以
    `.248` 结尾的子网掩码，你的子网掩码也会出现在有关静态 IP 地址的欢迎信中，最后在此部分，我们需要确保“允许传入 ping 请求”（allow incoming
    ping requests）设置为是。点击 `apply`，你的静态 IP 地址现在已激活。


    我们在网关 1 下需要做的最后一件事是禁用防火墙并允许所有入站流量。从选项菜单栏点击端口转发（port forwarding），然后从子菜单点击防火墙（firewall）。


    一旦打开新页面，你需要选择禁用（disabled）然后点击应用（apply）。


    网关 1 现在配置为允许所有入站连接，这些连接将被路由到相应的服务器。


    ### 配置网关 2


    如果你没有为家庭计算机使用第二个网关，可以跳过此步骤。


    对于此步，我通过家庭计算机上的无线选项连接到网关 2，但也可以再次使用 cat5 以太网线。一旦你输入设置和密码通过无线连接到网关 2，你可以在浏览器 URL
    地址栏中输入 `192.168.1.254`。你还需要像之前为网关 1 那样为网关 2 设置管理员密码。我建议为网关 2 设置不同的密码，这样你总是确定自己连接的是哪个网关。


    一旦你设置了管理员密码并获得了网关 2 的权限，我们只需要配置几项设置。你需要导航到高级设置（advanced setting）> 业务网络（business
    network），然后从子菜单选择 IP 地址（IP address）。


    打开页面后，我们将更改网关 IP 网关地址。我将我的从 `.254` 结尾改为 `.10` 结尾，这将允许从浏览器访问两个网关。


    接下来我们需要将 DHCP 服务器设置为否（no）。如果没有设置为否，那么两个网关将无法正确相互通信，点击应用保存我们所做的新设置。


    此时你可能需要重启计算机，以便你的计算机也能获取新设置。


    通过 cat5 以太网线将网关 2 连接到网关 1。连接应从网关 1 的以太端口 1 连接到网关 2 的以太端口 1。这将允许网关 2 从网关 1 接收宽带。


    现在你可以通过在浏览器 URL 中输入 `192.168.1.10` 从新的网关 IP 地址登录网关 2。你也可以在浏览器中输入网关 IP `192.168.1.254`
    登录网关 1。


    现在两个网关都已正确配置，允许互联网接入你的服务器并无线连接到家庭计算机。在网关 1 上，你现在会看到电源灯和宽带灯激活。在网关 2 上，你会看到电源灯和无线灯激活。


    ## 网络端口交换机


    由于我们要为专用服务器分配多个静态 IP 地址并要求虚拟专用服务器静态 IP 地址，我们将使用多个 cat5 以太线，因此购买一个网络端口交换机可能是一个好主意。这允许你取一根
    cat5 以太线并将其分成若干根其他 cat5 以太网线。在示例中，我正在使用一个 8 口网络交换机。


    网络端口交换机允许一根来自网关 1 的线接入网络交换机的以太端口 1；这为网络交换机提供了宽带互联网，在我的情况下，还有 7 根以太网线可以直接连接到服务器。


    '
- fmt: '

    As we disabled the firewall on hub 1, which is the hub that all our servers intend
    to be connected to it would be a good idea for security to purchase a separate
    firewall which can be connected in line before the network port switch. I have
    not done so in this example but in reality I would. This can be purchased on the
    internet and range in price from a few pounds to a few thousand pounds.


    # Chapter Two


    | In the chapter you will learn what a virtual private server (VPS) is, what a
    host server is, what a dedicated server is and what the differences between them
    are. We will also cover the operating systems and software that we will be using
    to create our virtual private server (VPS) and dedicated server. |


    ## Virtual private servers (VPS)


    A virtual private server (VPS) is a virtual machine which with the aid of software
    runs in the same physical server as many other virtual machines.


    Despite the virtual machine residing within another larger server it still can
    be configured to run independently of all other virtual machines.; thus meaning
    it can be totally configured to each customers individual needs and has the complete
    privacy of an independent server.


    Many web servers will process a website request and return the result to the end
    user, in some and almost all cases websites can have a long inactive period where
    no load is placed upon the server. Creating virtual private servers allows other
    servers on that machine to utilise this dead load time.


    ### Virtualisation


    When we talk about creating one machine and producing virtual machines (VPS) from
    that we are actually using virtualisation software to do this. By creating one
    host computer with hardware that supports virtualisation we can then create smaller
    independent computers within the hosts via the use of the host’s hardware.


    This has become a very large concept within the web hosting industry, allowing
    large amounts of servers to be created at cheaper costs; requiring less space,
    hardware and power consumption.


    ### Host server


    The host server plays a key concept in creating and running our virtual private
    servers. The host server allows you control over all virtual machines, creating
    new, stopping, starting and suspending virtual machines.


    A host server can run on Windows or Linux, for the examples in this book we are
    going to install windows 8` on our host server. I have chosen this as most home
    users are familiar with Windows operating systems and will find managing their
    virtual machines much easier with such a familiar environment.


    Once Windows is installed on the host server, virtualisation software needs to
    be installed so that our virtual machines can be created. There are many virtualisation
    software programs available and we have chosen Oracle’s `Virtualbox` (open source
    software).


    `Virtualbox` is an extremely powerful x86, AMD64 and Intel64 virtualisation software
    which can be used for home, business and large enterprise solutions. `Virtualbox`
    is extremely feature rich and serves as a high performance software.


    For more information about Oracle’s `Virtualbox` please visit


    [https://www.virtualbox.org](https://www.virtualbox.org)


    Once we have our host server running Windows and `Virtualbox` installed we are
    ready to create our first virtual private server. We will cover installing and
    configuring our software later in the book.


    ## Dedicated servers


    A dedicated server is a single physical computer in which the user has the full
    system resources at their disposal. Dedicated servers are more expensive but have
    the advantage of that you are not sharing your physical resources with another
    server.


    Setting up a dedicated server is much quicker as you would not need the host server
    and virtualisation software like when creating a virtual private server (VPS).


    `CPanel` licences are required to install and use `CPanel` software on your server.
    This is the only monthly fee (other than your internet service providers cost
    for broadband and IP addresses.) that will be required. `CPanel` licences can
    be purchased monthly from a variety of sources on the internet all at roughly
    the same cost. Licences for dedicated servers are roughly three times the price
    for that of a virtual private server but each gives you the same software and
    control.


    Virtual server licence £10 monthly


    Dedicated server licence £26 monthly


    # Chapter Three


    | In this chapter we will cover the hardware needed to create our virtual private
    server (VPS) and our dedicated server. This will cover selecting the hardware
    and using an old desktop PC as a server. |


    ## Server Hardware


    There is an extreme amount of computer hardware on the market today and selecting
    the correct hardware for you needs can become very confusing. For the examples
    in this book we are going to choose from the slightly higher end of the market
    to create a powerful server yet we are going keep our budget at £400 for each.


    The server hardware we are selecting can create a dedicated server of 8 cpu cores,
    16gb ram and a 1tb hard drive. Or we can create a host operating system and 7
    virtual private servers of 1 cpu core, 2gb ram and 100gb hard drive.


    There is some additional hardware required such as a PC monitor and we will cover
    these shortly.


    ### Main server hardware


    The main hardware we are going to require to build each of our dedicated servers
    and our virtual private servers are:


    * Motherboard

    * Processor, fan and heat sink

    * Thermal paste

    * PC case and power supply

    * Hard drive

    * Memory


    Because I wanted to make sure that all these parts are available to all readers
    of this book I purchased all these parts from eBay. There are a large number of
    sellers who advertise motherboard bundle deals which include the motherboard,
    memory, Processor, fan and heat sink. These are priced between £200 - £300. This
    leaves you with just the hard drive, case, power supply unit and thermal paste
    to purchase.


    I have chosen to boot my operating system from USB which eliminates the need for
    a DVD Rom drive. If you would like to install and boot your windows and centos
    for disc then you will also require a DVD Rom drive.


    The hardware I selected for both my dedicated and virtual private servers is:


    Motherboard

    Asus `M5A78L-M/USB3`


    This motherboard supports AMD and AM3+ multi-core processors, it also delivers
    better overclocking capabilities with much less power consumption. The memory
    support is dual-channel DDR3 NON-ECC up to 16gb.


    The form factor is Micro ATX which allows me to choose a slim line case with good
    cooling. It has two PCI slots which will allow me to add additional 10/100/1000
    (gigabyte) Ethernet cards.


    The motherboard CPU socket is AM3+ which means that the processor that is chosen
    must also be AM3+


    The only really drawback of this motherboard is that it is only SATA II -3Gb/s
    whereas most of the new hard drives are now SATA III – 6Gb/s. This just means
    that my hard drive won’t run at its full potential.


    Processor

    AMD FX Black Edition 8 Core Processor socket AM3+


    As the motherboard is socket AM3+ this means that the socket of the processor
    must also be AM3+ in order to fit.


    This is part of the new AMD FX black edition range which comes unlocked ready
    for overclocking. The main points about the processor is that it uses AMD Virtualisation
    technology which means it is perfect for creating our virtual private servers.


    When buying a new processor they will always come with the heat sink and CPU fan.
    If you are purchasing a used processor then you must check that they come with
    a heat sink and fan.


    I would recommend that you should buy new, processor pins can be damaged when
    removing them or if poorly packed rendering them useless. Over used processors
    can also result in poor performance.


    Memory

    Corsair Memory 4GB DDR3 1333 Mhz dual channel


    This memory is pretty compatible with most systems and is almost the cheapest
    on the market. Just because it’s cheap does not show in its performance.

    '
