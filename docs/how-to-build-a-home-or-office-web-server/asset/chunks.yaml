  trans: '


    我所选择的主板可以安装四根这种内存条，为每个系统提供总计 16gb 的内存。


    ## 硬盘


    希格捷 1TB 硬盘 SATA III 6Gb/s 64mb 缓存


    关于硬盘没什么好说的。虽然有很多型号可以选择，但我喜欢希格捷硬盘。它们对我来说一直非常可靠。


    现在的硬盘容量已经达到 4tb 了，所以请根据自己的需求选择最适合你的硬盘大小。如果你正在运行游戏服务器或文件共享服务器，也许更大的硬盘会更好。如果你只想运行一个简单的
    Web 服务器，那么 1tb 就绰绰有余了。


    ## 导热硅脂


    4g arctic 导热硅脂


    硅脂用于将处理器与散热器结合在一起。你只需要在散热器上涂抹大约豌豆大小，然后将其涂开即可。过多的硅脂是危险的，因为它可能会溢出到主板上。对于这两台机器，你只需要大约
    1g 装的硅脂，但我只能找到 4g 包装的。


    ## 机箱和电源


    银讯 Milo micro ATX 机箱配带 400w 电源


    选择正确的机箱可能非常棘手。外观和功能上非常多样，但很少有能让你一眼看出这就是我想要的。在订购机箱和电源单元（`PSU`）之前，你需要考虑几点：


    * 尺寸（机箱放在哪里？）

    * 散热（机箱有额外的风扇吗？）

    * 电源输出（功率足够大吗？）


    尺寸非常重要。由于我选择的机箱可以容纳 micro ATX 主板，所以看起来是可以的。但它能放得下我想放置服务器的地方吗？看看机箱的总尺寸。你需要在机箱背面留出
    `75mm` 的空间，以便于电源线以及所有连接到机箱背部的其他线缆。


    如果你打算从 USB 闪盘启动操作系统，那么确保机箱前面有 USB 接口会是个好主意。


    如果服务器打算 24/7 全天运行，通风是必须的。在机箱四周留出空隙让额外的风扇工作并空气流通至关重要。


    散热极其重要。处理器自带一个风扇，但主板额外支持一个机箱风扇。我们至少需要一个机箱风扇。如果你的机箱没有预装风扇，请确保它有空间安装机箱风扇。


    使用上述硬件，电源单元（`PSU`）的功耗约为 `200w`。为了起起见，我会选择至少 `300w` 的电源。它配备的是 `400w` 的，所以没问题。


    ## 预装系统


    如果你没有信心自己选择和安装硬件，在 eBay 或你的本地电脑供应商那里可以找到许多符合正确规格的预装系统。


    如果你不确定预装系统是否满足你的需求，你随时可以通过提供所需的规格来询问他们；尽管大多数系统会在物品描述中列出所有规格。


    购买预装系统通常会稍微贵一点（并不多少），但可以省去选择合适兼容硬件的烦恼。这些系统将准备就绪，你只需连接显示器并开始安装操作系统即可。


    ## 使用旧电脑


    如果你不确定现在是否准备好跨出购买新设备，想尝试虚拟化软件或创建一个标准的专用服务器，那么旧的笔记本电脑或台式电脑是完美的选择。


    如果你只想用旧台式机或笔记本电脑创建一个专用服务器，只要你的电脑至少有 `1gb` 内存和 `50gb` 或更大的硬盘，你就没问题了，可以去制作你的 `CentOS`
    光盘或可启动 USB 闪盘准备好安装。


    这只会给你一个低性能的专用服务器，但足够安装 `CentOS` 和 `CPanel`，以便将你的新服务器连接到互联网。


    要从旧台式机或笔记本电脑创建虚拟专用服务器（VPS），你你需要 `3gb` 内存、`100gb` 硬盘以及至少双核处理器。


    `Windows` 需要 `2gb` 内存和 `1` 核处理器才能启动，然后在 Windows 平台上安装虚拟化软件。我第一次在一台运行 `Windows
    XP` 的旧 HP 笔记本电脑上尝试过这个；那台电脑很慢，但运行良好，足够让我熟悉虚拟化软件了。我用不到一天的时间就创建并运行了安装有 `CentOS` 和
    `CPanel` 的 VPS 服务器。然后我向这里添加了一个网站，并保持在线了大约三天，以检查稳定性和功能。


    然后我花 `£50` 买了一台旧台式机，用它创建一个专用服务器并执行了类似的操作：安装了 `CentOS`、`CPanel` 然后是网站。一旦我确定稳定性和功能没问题，我就选择购买硬件来制作更高级的专用和虚拟专用服务器。


    从这开始，我随后创建了一个小型办公服务器网络，一直发展到拥有 80 台服务器的微型数据中心。


    ## 额外硬件


    根据你的需求以及你打算创建和安装的服务器数量，你可能还会考虑以下硬件。


    * USB 闪盘

    * DVD 光驱器

    * 网络端口交换机

    * Cat5 或 Cat6 以太网线

    * KVM 切换器


    如果你打算从 DVD 光盘启动操作系统，那么每台服务器都需要一个 DVD 光驱器。我选择从 USB 闪盘启动，因为这样可以减少硬件数量和功耗。而且，由于驱动器偶尔才用一次，我觉得没必要准备。


    USB 闪盘可以轻松地在服务器之间传输。由于我将使用闪盘启动 `windows` 和 `CentOS`，我买了两个 `8gb` 闪盘来创建可启动操作系统，第三个
    `8gb` 闪盘用于传输任何驱动程序或文件。


    网络端口交换机允许你从集线器引一根以太网线到交换机，然后分线让每台服务器的 LAN 端口都有所需的以太网连接。你可以在 eBay 上花约 `£12` 买到。这将得到一个
    `8` 口网络交换机。


    `Cat5` 以太网线用于 `100mb` 数据传输，Cat6 以太网线用于千兆（Gigabyte）数据传输。根据你的网络交换机选择所需的合适额外线路。


    # 第四章


    | 本章将介绍 CentOS、下载并创建你的 CentOS 6 DVD 以及准备好安装的可启动 USB 闪盘。 |


    ## 关于 CentOS


    `CentOS`（社区企业级操作系统）是一个基于 Linux 的操作系统，被全球大部分服务器使用。`CentOS` 是开源的，这意味着它是免费的。


    ### 下载 CentOS


    要下载 `CentOS`，你可以直接下载，也可以下载种子文件并使用 `uTorrent`（开源软件）等工具打开下载文件。由于 `CentOS` 镜像是大文件，我更倾向于下载种子文件。


    请参阅我们的软件章节获取下载位置。


