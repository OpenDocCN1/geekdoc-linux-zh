    # 第一章

    在本章中，你将学习静态或动态 IP 地址、选择您的互联网服务提供商 (ISP) 以及配置您的家庭网络以运行家庭或 Web 服务器。


    ## 静态或动态 IP 地址

    为了运行 Web 服务器，无论是在家中还是数据中心，万维网都需要知道该 Web 服务器的位置。这是通过 IP 地址实现的。IP 地址就像是找到您服务器的电话号码。


    动态 IP 地址在每次路由器关闭时都会更改。如果您在动态 IP 地址上运行 Web 服务器，那么每当路由器关闭并重启时，您都需要重新配置服务器、名称服务器和域名以新的
    IP 地址。这将导致需要新的 DNS 传播，您的网站和服务器在 DNS 传播期间可能会离线达 24 小时。


    市场上有一些服务允许您使用动态 DNS 将域名指向您的家庭动态 IP 地址；通常需要支付少量的月费。通过这些服务，每当路由 IP 更改时，它都会更新并启动将域名指向新
    IP 的过程。这些服务仍然会导致一些停机时间，但大部分配置会自动完成。


    '
- fmt: '

    When hosting a website it is better to use static IP addresses as this means you
    are not sharing your IP address. Another person or company could have been using
    the dynamic IP address and sending out lots of email spam causing the IP address
    to be on a blacklist.


    For the small charge and stability I would recommend using static IP addresses.
    For the examples in this book I have used an internet service provider (ISP) which
    has assigned 5 static IP addresses to my broadband connection. This will allow
    me to create 3 virtual private servers each with a single IP address and a dedicated
    server with two IP addresses assigned to it.


    ## Choosing your Internet Service Provider (ISP)


    Choosing your internet service provider is the first part in building a home web
    server. Careful consideration needs to be implemented before signing up to an
    internet service provider. Once you have signed up you will be in a 12 or 14 month
    contract so choosing the right company first time is essential.


    For the purpose and examples in this book I have chosen BT Business broadband.
    They offer fast fibre broadband and static IP addresses. BT Business broadband
    is happy for you to run a web or gaming server from their equipment and offer
    some support in configuring their router to allow this.


    You don’t need to have business premises or be a business to have BT Business
    broadband installed as these can be installed in your own home. I have changed
    to have this installed in my home for the purpose of writing this book.


    With BT Business broadband they offer a free business hub, I have two of these
    for this example but only one is required. I have also opted for the 5 static
    IP addresses.


    ## Configuring your home network


    Once you have your broadband active and your static IP addresses assigned to your
    line you are ready to start configuring your hub ready for your home web servers.
    Their support only shows how to configure the hub to allow one web server to run
    with one static IP address assigned to that web server. In the examples we show
    in this book we are going to run multiple web servers and a dedicated server with
    multiple static IP addresses assigned to it; for this we will need to configure
    the hub and network differently to the way they show.


    ## Networking equipment


    The networking equipment I am using in these examples are listed below. You may
    wish to use the same or substitute with your own equipment.


    *   Two BT Business hubs

    *   Network port switch

    *   Multiple cat5 (Ethernet) cables


    Only one BT Business hub is required for the servers but as I want to connect
    my home PC to this broadband line and have it protected by the routers firewall,
    I have the second hub configured to allow my home computers protected access.


    ## Hub configuration


    ### Configure hub 1


    We will configure hub 1 first, this hub will act as a gateway hub for all internet
    traffic and access to the servers. To access your hub you will need to connect
    your computer to the hub via a cat5 Ethernet cable. To access the hub open a browser
    and type `192.168.1.254` in the browser URL address bar.


    This will open your new hub for first time settings. As the hub is new it will
    ask you to enter the admin password and set a new admin password. The factory
    set password is located on the little pull out tab on the back of the hub.


    Once you have set your admin password and gained access to your hub you need to
    select settings then advanced settings for the menu bar. Next, click continue
    to advanced settings.


    There are only a few simple steps to configure this hub and the first step is
    to disable the wireless connection. The reason why we are going to disable the
    wireless connection is because this hub will act as a gateway only so we don’t
    want home computers connecting to this hub directly.


    Click on the wireless tab in the menu bar and follow the on screen instructions
    to disable the wireless connections.


    Next is to allow static IP addresses. Select the static IP option on the menu
    bar. This will open up a new window with four options. Select on for the first
    option of static IP address, next you will need to enter the router IP address;
    this would have been sent to you in your welcome letters regarding static IP address.
    Next we need to select our subnet mask. As I have ordered 5 static IP addresses
    I select the subnet mask which ends in `.248`, your subnet mask will also be on
    the welcome letters regarding static IP addresses, finally under this section
    we need to make sure that ‘allow incoming ping requests’ is set to yes. Click
    `apply` and your static IP addresses are now activated.


    The last thing we need to do under hub 1 is to deactivate the firewall and allow
    all incoming traffic. From the options menu bar click port forwarding and then
    from the sub menu click firewall.


    Once the new page opens you will need to select disabled and then apply.


    Hub 1 is now configured to allow all incoming connections which will be routed
    later on to the appropriate server.


    ### Configure hub 2


    If you are not using a second hub for your home computers then you can skip this
    step.


    For this step I connected to hub 2 via the wireless option on my home computer,
    but you could use a cat5 Ethernet cable again. Once you have entered the settings
    and password to connect your computer wirelessly to hub 2 you can enter `192.168.1.254`
    in the browser URL address bar. You will also need to set the admin password for
    hub 2 like you did before for hub 1. I would recommend setting a different password
    for hub 2 that way you are always sure which hub you are connecting to.


    Once you have set the admin password and gained access to hub 2 we have just a
    few settings to configure. You will need to navigate to advanced setting > business
    network and then IP address from the sub menu.


    Once that page is opened we will change the hub IP gateway address. I have changed
    mine from ending in `.254` to end in `.10`, this will allow both hubs to be accessed
    from a browser.


    Next we need to set DHCP server to no. If this is not set to no then both hubs
    would not communicate correctly with each other, click apply to save the new settings
    we have made.


    You will most probably need to restart your computer at this point so that your
    computer picks up the new settings as well.


    Connect your hub 2 to hub 1 via a cat5 Ethernet cable. Connection should be made
    from Ethernet port 1 on hub 1 to Ethernet port 1 on hub 2. This will allow hub
    2 to receive broadband from hub 1.


    You should now be able to login to hub 2 from the new hub IP address by entering
    `192.168.1.10` in the browser URL bar. You will also be able to login to hub 1
    with the hub IP `192.168.1.254` when entered in the browser.


    You should now have both hubs correctly configured to allow internet to your servers
    and wirelessly to your home computers. On hub 1 you will now see the power light
    and the broadband light active. On hub 2 you will see the power light and the
    wireless light active.


    ### Network port switch


    As we are going to assign multiple static IP addresses to our dedicated server
    and require static IP addresses to our virtual private servers we are going to
    use multiple cat5 Ethernet cables so it may be a good idea to buy a network port
    switch. This will allow you to take one cat5 Ethernet cable and split this into
    a number of other cat5 Ethernet cables. In this example I am using an 8 port network
    switch.


    The network port switch allows one cable from hub 1 into the Ethernet port 1 on
    the network switch; this then gives the broadband internet to the network switch
    and in my case 7 more Ethernet cables to be connected directly to the servers.

