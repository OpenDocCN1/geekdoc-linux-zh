  trans: "\n现在你已经准备好编辑和优化你的 `my.cnf` 文件，你需要通过 SSH 客户端（例如 `putty`）登录到你的服务器。如果你以前没有用过\
    \ `putty` 或其他 SSH 客户端，请参阅我们的“更改 SSH 端口”章节获取关于如何使用 `putty` 的说明。\n\n登录服务器后，你需要执行以下命令来打开\
    \ `my.cnf` 文件以准备编辑：\n\n```\nvi /etc/my.cnf\n```\n\n当 MySQL 的 `my.cnf` 文件打开后，按下键盘上的\
    \ `(i)` 键进入插入模式。使用方向键移动到新空白行，并确保行首没有字符（例如空格 ` `）。\n\n## 模板文件\n\n下面是你的 `my.cnf`\
    \ 应该包含的内容模板文件。这些是服务器启动时应该具备的基础优化设置。模板文件中包含了一些变量以及我们之前提到的较高值，但这些变量和值可以根据需要在 `MySQL\
    \ Tuner` 中进行监控和调整。\n\n一旦将这些设置添加到你的 `my.cnf` 文件中，你需要重启 MySQL 然后监控你的 MySQL 性能。\n\
    \n这些默认变量设置是为运行高负载数据库的服务器设置的，你可能需要在几天内对这些设置进行更改和调整，以获得服务器的最佳设置。为此，我们将使用 `MySQL\
    \ Tuner`。关于 `MySQL Tuner` 的更多信息见下文。\n\n### 默认设置 ###\n\n```\nmax_connections =\
    \ 500\n```\n\n### 缓存 CACHE ###\n\n```\nthread_cache_size = 1M\ntable_cache = 64M\n\
    query_cache_limit = 4M\nquery_cache_size = 16M\nquery_cache_type = 1\n```\n\n\
    ### 缓冲区 Buffer ###\n\n```\nkey_buffer_size = 32M\nread_buffer_size = 128K\njoin_buffer_size\
    \ = 128K\n```\n\n### 其他 OTHERS ###\n\n```\nconnect_timeout = 10\nmax_connect_errors\
    \ = 10\nmax_allowed_packet = 1M\ntmp_table_size = 16M\nmax_heap_table_size = 16M\n\
    ```\n\n现在 MySQL 变量已添加到 `my.cnf`，你需要退出插入模式、保存并退出。为了做到这一点，你需要执行以下命令：\n\n按下键盘上的 `esc`\
    \ 键。这将退出插入模式。接下来你需要输入以下命令，并在每个命令后按回车：\n\n```\n:w\n:q\n```\n\n现在需要重启 MySQL 了。为了重启\
    \ MySQL，你需要发布以下命令：\n\n```\n/etc/rc.d/init.d/mysql restart\n```\n\n在命令行编辑文件时，可能会出现连接中断并必须重启\
    \ SSH 客户端。如果发生这种情况，当你重新登录并尝试编辑文件时，会收到错误消息。例如，如果你在编辑 `my.cnf` 文件时系统崩溃，你会被要求恢复或删除\
    \ `swp` 文件。最好是删除 `swp` 文件并重新开始。要删除此文件，你可以执行以下命令：\n\n```\nrm /etc/.my.cnf.swp\n\
    ```\n\n完成此操作后你就可以继续编辑文件了。\n\n## MySQL Tuner\n\n为了监控 MySQL 系统并进行建议的更改，安装 `mysqltuner.pl`\
    \ 将非常有益；它将监控 MySQL 并对 `my.cnf` 文件所需的任何更改。`mysqltuner.pl` 需要安装，且 MySQL 至少运行 24\
    \ 小时才能记录准确的结果。因此，在每次更改 `my.cnf` 文件并重启 MySQL 后，请至少等待 24 小时，以便 `MySQL Tuner` 监控你的\
    \ MySQL 进程并给出准确建议。\n\n要安装 `mysqltuner.pl`，请完成以下命令并在每个命令后按回车：\n\n```\nwget mysqltuner.pl\n\
    chmod 755 mysqltuner.pl\n```\n\n`MySQL Tuner` 现在已在并在服务器上运行。运行并测试你的 MySQL 系统软件请执行以下命令：\n\
    \n```\n./mysqltuner.pl\n```\n\n这将输出与你的 MySQL 系统软件相关的显示，并对 `my.cnf` 文件所需的更改提供建议。其他建议如修复和优化也可能是建议的一部分。为了实现这一点，你可以在命令行提示符执行以下命令：\n\
    \n```\nmysqlcheck --all-databases -r = 修复表和数据库\nmysqlcheck --all-databases -o\
    \ = 优化表和数据库\n```\n\n## 修改全文检索最小单词长度\n\n这将允许全文检索允许三个字符的单词，而不是标准的四个字符。\n\n1. 以 root\
    \ 权限登录服务器\n2. 确保你在主根目录 `cd ../` 然后执行 `ls`\n3. 接下来是编辑文件。\n    * `vi /etc/my.cnf`\n\
    \    * 添加以下代码行 `ft_min_word_len = 3`\n    * 退出编辑模式并保存文件：按下 escape 键，然后按下 `:` 并输入\
    \ `wq` 保存文件。\n4. 接下来是停止并启动 mysql\n    * `/etc/rc.d/init.d/mysql stop`\n    * `/etc/rc.d/init.d/mysql\
    \ start`\n    * `/etc/rc.d/init.d/mysql restart`\n5. 接下来为服务器上的所有账户修复 mysql 数据库\n\
    \    * `mysqlcheck --all-databases -r = 修复`\n    * `mysqlcheck --all-databases\
    \ -o = 优化`\n\n# 第十一章\n\n| 如果你需要进一步的支持或需要帮助理解本书的任何部分，请参考本章节。 |\n\n## 技术支持\n\n由于我在书中涵盖了这么多内容，这可能会让你感到望而生畏，你可能希望有支持来解答进一步的问题、提供建议，或者如果你在安装的某个方面遇到困难并希望由人代为。\n\
    \n你始终可以通过访问我们的网站获得专业人士的电子邮件支持，我们将非常乐意提供帮助。\n\n由于软件会随时间变化，升级和更新不断发生，可能会更改安装或配置的一部分；为了应对这一点，我们将在网站上发布任何可能影响书中任何安装方面的更新。\n\
    \n如果你确实想访问网站获取进一步的帮助或建议，请访问：\n\nhttp://www.buildawebserver.co.uk\n\n# 第十二章\n\n\
    | 本章节将涵盖了创建创建专用服务器和虚拟私有服务器时所使用的所有软件。 |\n\n## 软件\n\n这是我们在本书中用于创建专用服务器和虚拟私有服务器期间所使用的所有软件列表。你可能不需要所有这些软件，因为我在书中介绍了各种配置选项，并不是所有的都适用于你。\n\
    \n我已经尝试尽可能使用开源（免费软件）。\n\n### Winrar\n\n下载位置：[`www.win-rar.com/`](http://www.win-rar.com/)\n\
    价格：免费\n\n### WinZip 自解提取器\n\n下载位置：[`www.winzip.com/win/en/downse.htm`](http://www.winzip.com/win/en/downse.htm)\n\
    价格：免费\n\n### ISO2USB\n\n下载位置：[`iso2usb.sourceforge.net/`](http://iso2usb.sourceforge.net/)\n\
    价格：免费\n\n### Windows 7 USB/DVD 下载工具\n\n下载位置：[`www.microsoftstore.com/store/msstore/html/pbPage.Help_Win7_usbdvd_dwnTool`](http://www.microsoftstore.com/store/msstore/html/pbPage.Help_Win7_usbdvd_dwnTool)\n\
    价格：免费\n\n### CentOS x86 64\n\n下载位置：[`isoredirect.centos.org/CentOS/6/isos/x86_64/`](http://isoredirect.centos.org/CentOS/6/isos/x86_64/)\n\
    价格：免费\n\n### Windows 8 64 位操作系统\n\n在 eBay 上可用\n价格：（平均 £84.99）\n\n### uTorrent\n\
    \n下载位置：[`www.utorrent.com/`](http://www.utorrent.com/)\n价格：免费\n\n### Image Burn\n\
    \n下载位置：[`www.imgburn.com/`](http://www.imgburn.com/)\n价格：免费\n\n### Putty: 免费的\
    \ Telnet/SSH 客户端\n\n下载位置：[`www.chiark.greenend.org.uk/~sgtatham/putty/`](http://www.chiark.greenend.org.uk/~sgtatham/putty/)\n\
    价格：免费\n\n### Oracle Virtualbox\n"
