    按下键盘上的 `(:)` 键，然后按 `(q)` 键，这将退出文本编辑器并返回命令行提示符。


    现在由于我们已经添加了用户，我们需要重启 `sshd` 以使设置生效。你现在将回到命令行提示符，并且你需要执行以下命令： -


    ```

    /etc/init.d/sshd restart

    ```


    我们现在创建了 wheel 用户并授予了他们 root 权限，接下来我们需要禁用 root 登录。要做到这一点，我们需要编辑另一个文件。在命令行提示符上执行以下命令：
    -


    ```

    vi /etc/ssh/sshd_config

    ```


    当文件打开时，你只会看到文件的一小部分，使用方向键向下滚动，直到看到名为 `#PermitRootLogin yes` 的行。


    这就是我们需要编辑的行。我们需要进入插入模式，为此请按下键盘上的 `(i)` 键。


    将该行从 `#PermitRootLogin yes` 改为 `PermitRootLogin no`，记得删除行开头的井号。


    按下键盘上的 `esc` 键。


    按下键盘上的 `(:)` 键，然后按 `(w)` 键，这将保存文件。


    按下键盘上的 `(:)` 键，然后按 `(q)` 键，这将退出文本编辑器并返回命令行提示符。


    现在由于我们已经编辑了文件，我们需要重启 `sshd` 以使设置生效。你现在将回到命令行提示符，并且你需要执行以下命令： -


    ```

    /etc/init.d/sshd restart

    ```


    我们现在已经禁用了 root 登录。不要退出 SSH 客户端，因为如果发生了任何错误，你可能无法以 root 身份重新登录，当前的 SSH 会话已经登录，所以请保持开启。


    打开一个新的 SSH 客户端窗口，我们将使用创建的 Wheel 用户进行登录。


    现在你已经登录，我们需要切换到超级用户，要做到这一点，请执行以下命令： -


    ```

    su

    ```


    你现在会被要求输入密码。这里需要的是 root 密码。你可以通过执行以下命令来检查你现在是否以 root 身份操作： -


    ```

    whoami

    ```


    你的窗口应该看起来像下方的示例，你可以看到执行命令 `whoami` 后的行显示你是 root。


    ![wheel-3.PNG](img/00149.jpeg)


    你现在可以通过执行以下命令来关闭 SSH 窗口。（如果你已经登录并切换到了超级用户，则需要执行两次命令）： -


    ```

    exit

    ```


    ## 更改你的 SSH 端口


    虽然有许多方法可以确保你的服务器尽可能安全，但你可以采取一些基础步骤和措施来做好准备。


    安全 Shell (SSH) 协议默认使用端口 `22`。接受此默认值不会让你的系统变得不安全。更改端口不会提供安全性上的显著差异。然而，更改默认 SSH
    端口可以阻止服务器面临的许多自动化攻击，并让猜测从哪个端口访问 SSH 变得更加困难，换句话说，这是一种通过隐蔽实现的安全性。


    更改端口最简单的方法是以 root 用户身份 SSH 服务器：


    要做到这一点，我们需要使用诸如 `putty` 的软件，它是一个免费的 telnet/ssh 客户端。


    请参阅我们的软件章节获取下载位置


    一旦你下载了 `putty`，你不需要安装任何东西，因为这是一个独立的软件客户端。双击下载文件夹中的 `putty` 图标以打开新会话。（如下所示）


    ![putty.PNG](img/00068.jpeg)


    一旦打开 `putty`，光标将在名为 Host Name（或 IP 地址）的框中闪烁，在这个框中你需要输入服务器的 IP 地址。当你输入 IP 地址后，点击底部的
    open 按钮。


    你需要以 root 用户 (`root`) 身份登录，并输入你在安装 CentOS 时创建的密码。


    作为 root，使用文本编辑器 (`vi`) 编辑 sshd 配置文件。这可以通过在命令行输入以下内容完成： -


    ```

    vi /etc/ssh/sshd_config

    ```


    接下来，你需要找到指定端口的行。如果你的 `sshd_config` 文件没有被修改过，`Port` 设置将被 `#` 符号注释掉（如下所示）：


    ![ssh_2.PNG](img/00150.jpeg)


    `#` 符号告诉服务器忽略同一行中之后的任何内容，因此我们需要删除该字符，然后将数字 `22` 改为其他数字。请确保不要选择一个被其他服务占用的端口号。


    默认行看起来如下：


    `#Port 22`


    在这个示例中，端口已更改为 `2922` 并删除了 `#` 符号。（如下所示）


    ![ssh_1.PNG](img/00151.jpeg)


    按下键盘上的 `(i)` 键开始文本编辑器的插入模式。一旦你更改了端口号并删除了 `#` 符号，你需要保存并退出编辑器。


    按下键盘上的 `esc` 键。


    按下键盘上的 `(:)` 键，然后按 `(w)` 键，这将保存配置文件。


    按下键盘上的 `(:)` 键，然后按 `(q)` 键，这将退出文本编辑器并返回命令行提示符。


    接下来是重启 SSH 以使新设置生效。


    ```

    /etc/init.d/sshd restart

    ```

    （如下所示）


    ![ssh_3.PNG](img/00152.jpeg)


    你的 SSH 服务已经重启，新的 SSH 端口已生效。


    ## 安装服务器防火墙


    要安装服务器防火墙，你必须以 root 用户身份登录服务器。对于禁用了 root 权限并创建了 wheel 用户的用户，我将涵盖登录和切换到超级用户的内容。


    对于没有创建 wheel 用户并删除 root 权限的用户，可以跳过此步骤。


    ### 登录并切换到超级用户


    你需要通过 SSH 登录服务器并切换到超级用户。


    打开一个新的 SSH 客户端窗口，我们将使用你创建的 Wheel 用户登录。


    现在你已经登录，我们需要切换到超级用户，要做到这一点，请执行以下命令： -


    ```

    su

    ```


    你现在会被要求输入密码。这里需要的是 root 密码。你可以通过执行以下命令来检查你现在是否以 root 身份操作。


    ```

    whoami

    ```


    你的窗口应该看起来像下方的示例，你可以看到执行命令 `whoami` 后的行显示你是 root。


    ![wheel-3.PNG](img/00149.jpeg)


    我们需要处于主目录文件夹，目前你可以看到我们在 `/home/tecsupport` 中，为了返回，你需要执行以下命令： -


    ```

    cd ../../

    ```


    你现在会看到底部的行显示当前目录已更改，如下方的示例所示。


    ![firewall-1.PNG](img/00153.jpeg)


    ### 作为 root 用户安装防火墙


    现在你已经以 root 用户身份登录服务器，我们可以在服务器上安装防火墙。有四个命令按顺序执行来下载并安装服务器。命令列在下方，执行每个命令后按下键盘上的回车键，并在继续下一个之前允许每个命令执行。


    ```

    wget http://www.configserver.com/free/csf.tgz

    tar -xzf csf.tgz

    cd /csf

    sh install.sh

    ```


    完成后输出将像下方的示例。你现在可以退出 SSH 客户端了，如果你切换到了超级用户，你需要使用两次 `exit` 命令。


    退出命令为： -


    ```

    exit

    ```


    ![](img/00154.jpeg)


    防火墙现在已安装在你的服务器上，并准备好配置和激活。你需要登录服务器的 WHM 面板，从左侧的链接菜单中，防火墙应该位于最底部 plugins 下，如下方的示例所示。如果链接菜单中没有显示插件和防火墙，你需要注销服务器并重新登录。


    ![firewall-3.PNG](img/00155.jpeg)


