    \ following command: -\n\nrm /etc/.my.cnf.swp  \n\nOnce you have done this you\
    \ will be free to continue editing the file.\n\nMySQL Tuner\n\nIn order to monitor\
    \ the MySQL system and make any recommended alterations it will be beneficial\
    \ to install mysqltuner.pl; this will monitor MySQL and suggest any alterations\
    \ needed for the my.cnf file. The mysqltuner.pl will need to be installed and\
    \ MySQL running for a minimum of 24 hours for accurate results to be noted. So,\
    \ after each alteration to the my.cnf file and MySQL has been restarted do wait\
    \ at least 24 hours in order for the MySQL Tuner to monitor your MySQL processes\
    \ and give accurate recommendations.\n\nTo install mysqltuner.pl complete the\
    \ following commands and pressing Enter after each command: -\n\nwget mysqltuner.pl\
    \  \n\nchmod 755 mysqltuner.pl  \n\nMySQL Tuner is now installed and running on\
    \ your server. To run and test your MySQL system software run the following command:\
    \ -\n\n./mysqltuner.pl  \n\nThis will output a display in relation to your MySQL\
    \ system software and recommend any changes needed for your my.cnf file. Other\
    \ recommendations such as repair and optimise maybe part of your recommendations.\
    \ In order to do this you can issue the following commands in the command line\
    \ prompt: -\n\n mysqlcheck  - -all-databases -r   = Repair tables and databases\n\
    \n mysqlcheck  - -all-databases -o   = Optimise tables and databases\n\n## Change\
    \ full text search min word length\n\nThis will allow full text searching to allow\
    \ words of three characters instead on the standard four.\n\n1.  Login to the\
    \ server with root access\n\n2.  Make sure you are in the main root directory\
    \ cd  ../ and then ls\n\n3.  Next is to edit the file.\n\n    *   vi  /etc/my.cnf\n\
    \n    *   add the following line of code ft_min_word_len = 3\n\n    *   Exit the\
    \ edit mode and save file by pressing the escape tab, then pressing : and typing\
    \ wq to save the file.\n\n4.  Next is to stop and start mysql\n\n*   /etc/rc.d/init.d/mysql  \
    \ stop\n\n*   /etc/rc.d/init.d/mysql  start\n\n*   /etc/rc.d/init.d/mysql restart\n\
    \n5.  Next is to repair the mysql database for all accounts on the server\n\n\
    *   mysqlcheck   --all-databases  -r = Repair\n\n*   mysqlcheck  --all-databases\
    \ -o = optimise\n\n# Chapter Eleven\n\n| This chapter is where to go for further\
    \ support or with help understanding any part of this book. |\n\n## Technical\
    \ support\n\nAs I have covered so much in this book it is understandable that\
    \ it may be a little daunting and you may want the reassurance that support is\
    \ on hand for further questions, advice or if you are struggling with any aspect\
    \ of the installation and would like this completed for you.\n\nYou can always\
    \ get email support from a professional by visiting the website where we would\
    \ be more than happy to help.\n\nAs software changes from time to time, upgrades\
    \ and updates happen which may change part of an installation or configuration;\
    \ so to combat this we will publish any updates on the website that may affect\
    \ any of the installation aspects of this book.\n\nIf you do wish to visit the\
    \ website for further help or advice please visit us at: -\n\nhttp://www.buildawebserver.co.uk\n\
    \n# Chapter Twelve\n\n| This chapter will cover all the software we have used\
    \ in creating our dedicated and virtual private servers. |\n\n## Software\n\n\
    This is a list of all the software we have used during this book to create our\
    \ dedicated and virtual private servers. You may not need all of this software\
    \ as I have ran through various configuration options in the book and not all\
    \ will be applicable to you.\n\nI have tried to use as much open source (Free\
    \ Software) where possible.\n\n### Winrar\n\nDownload location: [http://www.win-rar.com/](http://www.win-rar.com/)\n\
    \nPrice:                                          free\n\n### WinZip self extractor\n\
    \nDownload location: [http://www.winzip.com/win/en/downse.htm](http://www.winzip.com/win/en/downse.htm)\n\
    \nPrice:                                          free\n\n### ISO2USB\n\nDownload\
    \ location: [http://iso2usb.sourceforge.net/](http://iso2usb.sourceforge.net/)\n\
    \nPrice:                                          free\n\n### Windows 7 USB/DVD\
    \ Download Tool\n\nDownload location:\n\n[http://www.microsoftstore.com/store/msstore/html/pbPage.Help_Win7_usbdvd_dwnTool](http://www.microsoftstore.com/store/msstore/html/pbPage.Help_Win7_usbdvd_dwnTool)\n\
    \nPrice:              free\n\n### CentOS x86 64bit\n\nDownload location: [http://isoredirect.CentOS.org/CentOS/6/isos/x86_64/](http://isoredirect.centos.org/centos/6/isos/x86_64/)\n\
    \nPrice:                                          Free\n\n### Windows 8 64 bit\
    \ Bit operating system\n\nAvailable on eBay\n\nPrice:                           \
    \               various (average £84.99)\n\n### uTorrent\n\nDownload Location:\
    \ [http://www.utorrent.com/](http://www.utorrent.com/)\n\nPrice:             \
    \                             free\n\n### Image Burn\n\nDownload location: [http://www.imgburn.com/](http://www.imgburn.com/)\n\
    \nPrice:                                          free\n\n### Putty: a free Telnet/SSH\
    \ Client\n\nDownload location: [http://www.chiark.greenend.org.uk/~sgtatham/putty/](http://www.chiark.greenend.org.uk/~sgtatham/putty/)\n\
    \nPrice:                                          free\n\n### Oracle Virtualbox"
