    ## Adding a domain name


    Now that cPanel is installed and the initial setup is completed it is time to
    start creating a package so that you can assign a domain name to the server; if
    you have not done so already it is worth browsing the online documentation about
    cPanel so that you have a basic understanding of where things are and how they
    function.


    Before you can add a domain name to your server you will need to create a package
    that the domain name can be assigned to. To do this you will need to login into
    WHM panel.


    When you have logged in you will have a links menu on the left hand side of your
    screen. Scroll down a little over half way until you see the heading packages.
    Under that click add package which will load the screen like the example screenshot
    below.


    ![cpanel-2.PNG](images/00137.jpeg)


    First we need to name the package. I am only going to have one website on this
    test server so I will want it to use the full potential, effectively an unlimited
    package so I will call this package unlimited.


    The next section is resources; this is where you can create custom packages which
    are limited. This is how shared web hosting accounts are limited, the package
    is created with limitations and then the domain name assigned to that particular
    package.


    You do not have to create a package for every domain name, you can assign more
    than one domain name to a package as long as you want each domain name account
    to have the same limitations.


    Under the settings section you can leave these as the defaults like the example
    screenshot below.


    ![cpanel-3.PNG](images/00138.jpeg)


    Next click add to create and save your new package.


    Now that you have created your package we can create a new account on the server
    and assign the domain name to that account.


    Scroll down the links menu on the left hand side until you come to the heading
    account functions. Click on create a new account which will load the screen like
    the example screenshot below.


    ![cpanel-4.PNG](images/00139.jpeg)


    The first section is the domain information. This is the domain name that you
    have registered with your domain name registrar. Fill in the required fields and
    you should then have that section like the example screenshot below.


    The email is the server administrators email address for who will maintain that
    account.


    ![cpanel-5.PNG](images/00140.jpeg)


    Next we have to assign the account to a package; this is the package we created
    previously. Select your package from the select box.


    ![cpanel-6.PNG](images/00141.jpeg)


    Next is the settings, these can just be left as the default settings and themes.


    ![cpanel-7.PNG](images/00142.jpeg)


    The next setting can just be left as this is used when you wish to create reseller
    accounts on the server.


    ![cpanel-8.PNG](images/00143.jpeg)


    We are almost done, now we need to select the DNS settings. Make sure you check
    the check box that states use the nameservers specified at the domains registrar
    (ignore locally specified nameserves).


    ![cpanel-9.PNG](images/00144.jpeg)


    The last option is the mail settings. If you want to use webmail that is packaged
    with the server you can leave this as the local mail exchanger or you can select
    automatically detect configuration.


    ![cpanel-10.PNG](images/00145.jpeg)


    Finally click the create button and your account will be created and the domain
    name assigned to the server.


    If you have not left your domain name and server for 24 hours since registering
    your domain name, applying glue records and name servers then you may have to
    wait still for propagation to accrue.


    If it has been almost 24 hours then your domain name and name servers are probably
    fully active around the internet and you are ready to test that your domain name
    resolves to your new web server.


    Enter your domain name into the URL address bar of your browser. If you get a
    page loaded like the example screenshot below then your domain name is resolving
    to your web server correctly and you are ready to create your web pages and upload
    them to the server.


    ![cpanel-11.PNG](images/00146.jpeg)


    If you don’t see this page then this could just be a DNS propagation issue, you
    can check this at [http://www.intodns.com/](http://www.intodns.com/)


    If you are still having problems you can visit the support website for help, the
    details are in the technical support chapter. I will be happy to take a look for
    you.


    # Chapter nine


    | In this chapter we will cover some basic server security from creating wheel
    users, disabling root access, changing the SSH port and installing a server firewall.
    |


    ## Creating a wheel user and disabling root access


    Disabling root access via SSH to your server provides an additional two levels
    of security. I strongly advise you taking this action as well as changing your
    SSH port. Servers come under a number of attacks most of which are aimed at gaining
    access your server.


    Once a wheel user is created and root access has been disabled you must login
    via SSH to your server with a user account that has root privileges and then switch
    to the root user. This makes the server request two valid logins before full root
    access is granted.


    Wheel users are also known as supper users. In the next few steps I will guide
    you through, first how to create a wheel user and grand root privileges to that
    user then secondly, how to disable root access.


    Disabling root access via SSH does not disable root username and password login
    for cPanel and WHM, you will still use the user name root and the password that
    was created during the CentOS installation. If you do not have a strong password
    already for the username root I would recommend logging into your WHM panel and
    changing the root password to a very strong one. Once the password has been changed
    in the WHM it will change the root password for all other root logins to your
    server, for example root login via SSH.


    The first step is to create the new user, as normally the only person who needs
    to login to the server is the technical support person I will call this user tecsupport.


    Login to your server via SSH with your root username and password. Once you have
    logged in issue the following two commands: -


      adduser  tecsupport  


      passwd  tecsupport  


    You will now see a screen in your SSH client like the example below asking you
    to enter the new password for the user tecsupport. Pick a password that you can
    remember,but yet is strong enough not to be guessed.


    ![wheel-1.PNG](images/00147.jpeg)


    Once you have entered the new password you will be asked to confirm the password.
    After you have confirmed you will see a message stating all authentication tokens
    updated successfully.


    Next we need to add the user tecsupport to the wheel group. To do this we are
    going to edit a file. At the command line prompt issue the following command:
    -


      vi  /etc/group   


    You will now see your window change to the same as the example screen shot below.
    We need to enter the insert mode so to do this press the (i) key on your keyboard.


    ![wheel-2.PNG](images/00148.jpeg)


    Using the arrow keys on your keyboard scroll down until you come to the line that
    reads wheel:x:10: and change this to read wheel:x:10:tecsupport to add the user
    tecsupport to the wheel group.


    Press the esc key on your keyboard.


    Press the (:) key on your keyboard and then the (w) key, this will now save the
    file.'
