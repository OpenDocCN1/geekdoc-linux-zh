    # 静音


    文章


    ## 创作神话


    作者：Marina Vismisht，2010年7月28日


    今年3月，在中央圣马丁艺术学院（Central Saint Martins），来自60/70年代艺术教育领域开创性实验的师生们聚在一起，对照当今充满危机的学术环境重新审视过去。旨在培养自主主体的“A”课程，其极端的再教育方法与当代被收编的参与模式形成了鲜明对比，后者也预示了如今普遍的自主性与异化。Marina
    Vismisht 报道


    近期，关于艺术领域教育政治属性的辩论引起了极大关注。“教育转向”的热潮标志着某些里程碑，例如2006年在范·阿伯贝根博物馆（Van Abbemuseum）等地举办的
    A.C.A.D.E.M.Y.，2008在新博物馆（New Museum）的拍摄活动，或是2007年卡塞尔文献展（Documenta）策展核心中“审美教育”的地位。这种趋势现在已扩展到许多专门读者（《策展与教育转向》，2010年）和活动（在塞尔派画廊和海德华美术馆举办的“去学校化”、在特隆赫姆的“今日制造业”、在柏林的“Home
    Works”，所有这些活动还包括一系列自组织的艺术展，挑战了基于画廊的政治收编参与，以及去机构化的行动主义文化，如 16Beaver 或已故的哥本哈根自由联盟（Free
    Unity）。2006年尚未发布的《宣言6》（Manifesto 6）本应以“艺术学校”的形式出现，它是许多以“教育”为核心的艺术和策展项目的形成性创伤和起源。作为过去十年中艺术实践中保持政治性的多种冲动和疑虑的凝结，“教育”已成为艺术史的核心。在今天，艺术只能通过参考“教育”或“教化”的角色来书写。教育也往往侧重于“基础设施”作为一种学习-教育的模式，而非传统上理解的艺术能动性的理论或创作侧面。这与社交网络和自由软件产生了共鸣，并可能从捐赠的塞浦路斯“艺术学校”双年展中出现的最知名倡议之一——扩展设计与出版项目
    Dexter Sinister 中得到体现。


    ![](img/df58e8c6d3ce5c77eae119b279af8468_0_0.png)


    图片：“A”课程的原始工作室空间，同时也兼顾了“A课程——一项调查”的研讨会空间


    教育作为一种通过学习实现集体主体化的过程，作为艺术田园式和参与式特质的过往而变得非常有趣，这些特质曾希望在不丢失灵魂的情况下找到一条工具性的出路。在激进和自由的教育理想中发现的人文主义开放性，完美契合了定义艺术生产现状的现代主义怀旧情绪，以及所有贯穿其中的中间形式。但这种冲动也促进了一种面临着可能牺牲信誉、并可能牺牲过去几十年“社会实践”风险的博弈状态。每一个教育过程中对不确定性或自决的承诺都是诱人的，尽管它深陷许多陷阱：当教育被许多人体验为——作为工业化的或任何非导向的实验——通向军事计划或任何并非由解放修辞与领域教育之遇所要求的冒险行为时，教育就被贬值了，正如艺术机构和教育机构列出每一种生活的确定性历史所所示。


    一场关于艺术教育矛盾的公共反思近期在中央圣马丁艺术设计学院（CSM）举行。为期两天的论坛“A课程——一项调查”于3月26日至27日在原始工作室举行。


    # 创作神话


    这里该课程在1969-73年间设于圣马丁雕塑系（当时的课程主任 Peter Kardia 在1973年转入皇家艺术学院）。该课程位于10层，并首次将“A”课程的三位幸存创始人聚集在一起，核心是在探讨扩展领域中可能产生项目的问题。在这里对这一学科（雕塑）或（学生，一项政策）进行了详细探讨，并对背景坐标进行了初步草拟——这有助于定位今日教育的一些关键问题。


    欧洲波洛进程（Bologna Process）的实际执行和即将推出让人们意识到，它是艺术研究框架内激进政治的凝结或位移，由接触了资本逻辑时代“教养”（Bildung）的人们塑造。欧洲教育的新自由主义协调化带来了过去两个世纪的国家主义情绪，这种情绪在20世纪冷战的加速下，推广了一种基于公共利益的、大学-启蒙堡垒式的国家文化高等教育方法（这种利益往往与国家、企业和军事机构勾结，仅就美国而言，即艺术的西方堡垒）。学校反映了艺术与未被认为具有经验价值的事物之间既定的区别。随着过去20年新自由主义和新自由主义治理产生了均衡的影响，创造力变得具有经济属性，突然之间识别和量化艺术教育表面上产生的“知识”变得非常紧迫，尤其是艺术教育的专业化和学术化已经在某些地方改变了这一领域。康德式的“无目的之目的”氛围，在创造力进入市场商品形式后，已不再能作为隐形的斗篷，这使其变得更加可见。波洛进程是对“差异化包容”、可移植标准和能力导向方法论等趋势的简化，这些趋势已在许多欧洲大学中有所不同，在英国最为显著


    高等教育“合理化”的需求在英国变得非常独特；英国学生与欧洲乃至美国学生的展望之间的差异，可以通过注意一个细微的语义差别来更简洁地总结：即我们的大学属于业务、创新与技能部，而他们属于教育部门。这是我们


