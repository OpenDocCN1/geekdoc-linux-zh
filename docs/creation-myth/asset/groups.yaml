    20 年 60 年代 70 年代初艺术学院提出的教学替代方案，与“A 课程”形成对比，后者将非层次的社会互动视为一种激进的存在形式，并在扩展的背景下进行实践。这些实例包括“艺术与语言”（Art
    and Language）在考文河的课程或朱迪（Judy）在弗雷斯诺的课程，学生和教师在那里共同领导。然而，人们承认，正如福柯（Foucault）所言，从那时起，一直是强制性的；交流并不是艺术教育规律装置不可或缺的一部分，更不用说那些在学生生活世界中占据越来越大部分生活的社交网络——这一事实在当前导师的教学计划中是被整合的而非被问题化的。


    ![](img/df58e8c6d3ce5c77eae119b279af8468_6_0.png)


    许多被误认为激化的辩论试图通过时间的政治学来检查“A 课程”的现象，例如学生的特殊场合，这与今天非常盛行的趋势并无二。引导者尽力将这种辩论引回“A 课程”的特定取向，并取得了有限的成功。焦点反复转回到课程的权威主义上。Kardia
    等人认为学生存在挑衅行为，且“A 课程”的方法是建设性的而非竞争性的：Kardia 坚持认为“从来没有你”，“只有‘可能不可以’”；Kardia 提到他的方法被比作斯大林，一位老校学生选择将他的方法与智利组织在智利的方法进行比较，并指责他是英国政府的智能特工，暗示他的任务是遏制聚集群体的困惑。另一位老校学生则认为，A
    课程作为一个社区空间发挥作用，促进了创造力，以至于课程的“白板”（tabula rasa）目标与实施这些目标的系统产生了冲突，以及学生之间所谓的怀疑和疏离感。其他前学生谈到了课程的教养性氛围，认为它是一个反思的空间而非泡泡；并回答了早期关于“怀疑的实践”的评论，即其公开且编码的规则在某种程度上让女性艺术学生能够评判在此之前所经历的艺术教学中那种内含的枯竭和不透明的权力动态。


