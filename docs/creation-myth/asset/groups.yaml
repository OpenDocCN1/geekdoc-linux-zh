    Martins）在“A课程”之外，在自己的其他领地上可能并不激进，但他们确实参与了当时的斗争，例如越南战争、劳工运动以及科文特加花园的反绅士化策略。在多个点上，人们提出，“A课程”的标志——其为了追求“原生经验”而对语言和意义指涉的贬低——不可避免地导致了某种碎片化。更激进的是一种理论（或神话），它认为教学活动之间的联系是课程组织者直接且刻意的行为。政治控制的内在性正是控制论中“人使用人”的核心枢纽，彼得·卡达辛基恩（Peter
    Kardashian）对控制论以及作为反馈系统的人类行为有着持久的兴趣，这种兴趣与罗斯科特（Royscott）等志同道合的同事共有，深受当时进步精神的影响。


    ![](img/df58e8c6d3ce5c77eae119b279af8468_8_0.png)


    但更根本的是，“背景”的概念在“A课程”中是如何运作的。讨论中对背景的框架被证明是极具争议的，课程的前任导师反对他们认为被不公平强加在他们必须完成的任务之上的概括和“历史幻想”。根据加斯·埃文斯（Garth
    Evans）一个关于背景重要性的生动故事，我们争论了背景的地位。在一个为期三年的课程中彻底改革关于艺术、自我和教育的既观念，这无疑是政治性的，无论其内部或外部产生什么后果。在物理和制度上确保自决活动的条件，是他们认为自己的价值所在和终极目标。门被锁上是为了“把极端分子和问题隔绝在外”，无论机构的其他部分是怎样的。这是否也在锁住他人？同样，辩论似乎取决于不可理解的自由概念——尽管那扇锁着的门被描绘为动荡、混乱且侵入性的社会环境中自由的物质条件。卡达辛基对被指为“间谍”的指控做出了政治意义上的承认：“没有所谓的自由空间”，这表明这一方面的实验设计将永远是多孔的。


    https://www.metamute.org/editorial/articles/creation-myth


    ## 创作神话


    在对“A课程”准则中“物质性”和“材料”含义的拆解中，同样对“背景”进行了一场生动的解剖（“密闭房间计划”的正式名称为“材料计划”，前任导师试图纠正这一命名）。这里本身就是一种有趣的交汇，即艺术安置小组（Art
    Placement Group, PGS）与“A课程”所代表的不同矢量之间的汇合，仿佛每一者对当时构成艺术活动的内涵都有着一种极大广得多的解读，正如芭芭拉·斯蒂文尼（Barbara
    Steven）其中其中证明的那样。尽管 PGS 通过将艺术植入组织和社区场所线性地推进这一路线，而“A课程”局限于艺术学院的范畴，但两者都痴迷于对艺术与实践对象的研究，消解艺术本身（尽管在某些情况下，矛盾地是为了在“更高”的层面拯救它）以及在忙碌的去机构化文化中的劳动分工。


    “A课程”第二、第三年的许多项目也可以被认为损害了艺术家的角色的特殊性，以及当时盛行的艺术“教学性”通用概念：


    - 《邮寄指令》（The Instructions by Post）：由匿名邮寄给学生的指令组成；

    - 《报告项目》（The Report Project）：反向操作，让学生向工作人员插入针对未知事件的会议或地点；

    - 《代理人项目》（The Agent Project）：每位学生对应另一位学生，由该学生在与外界的一切交来中代表另一位；

    - 《转化项目》（The Transformation Project）：旨在记录分配给每个学生的等额资金（通过活动或物品）的状态转化；

    - 《就业项目》（The Employment Project）：简单地假设让他们找份工作或从事其他类型的赚钱活动，其收益本应汇集。


    然而，学生们似乎对这种行为产生抵触，暗示艺术毕业生可能被迫从事艺术之外的赚钱活动，而如果这可以被视为对“艺术”的一种自大表现，那么这对于他们年轻的肩上来说是更有可能发生的。考虑到近期在对“服务部门”和“行政美学”的同步分析中提到的广泛分析，“A课程”的作品项目似乎具有象征意义，即使从另一个角度可以辩论，这些“隐形”实践更多关乎调解、编辑，最后对“材料”的调查（由于它们是课程的主题）保持不变，以其动不安且壮观的形式呈现，作为“关系美学”，或正如批评家斯蒂芬·莱特（Stephen
    Wright）那些艺术可见性系数极低的实践，这可能指的是除了策展人之外无人承认的实践。


    然而，作为先任的“A课程”认为，这些实践再次涉及机构内与外的界限问题。这似乎回到了背景的问题，而该问题将不可避免地令人困扰。加雷·琼斯（Gareth Jones）一方面回忆起巴舍尔（Bachelard）的社会学家来感谢他的教学，构建了“阴险意义”（由“在场者”推导出）的练习（由“不在场者”进行解读），为这项实验重建一份遗产。彼得·卡达辛基（Peter
    Kardia）仍然认为，在艺术教育的背景下产生创造性行为比在课程讨论中引入政治问题更有礼貌，教学与政治之间的区别在这种图中是可以安排的。这可以用不同的方式表述为教育与政治教育之间的关系/区别。这种立场将体现在现在教职员工的身体中。卡达辛基详尽地回应说，教育者的工作是反其趋势而行，而不是并将其变为现实。将这种分歧解释为政治性的就足够了——但它似乎只是处于一个独特的认识论的、甚至是伦理的鸿沟。


    ## 改变你想改变的，或者至少，留下一个空洞


    追溯“A课程”的“情感结构”的尝试揭示了其教学上的风险承担既表明了动荡气候下对艺术教育目的的困惑，也延长了处于状态状态的教育创新。这种在教育背景下应对异化的尝试，正面临着现代主义主体与主观性、客观性与自我意识艺术家定义之间的威胁，而这后来可能演变成了该时期艺术教育的发展模式，前提是当代现代主义学生已被话语权力相当抛弃。需要补充的是，“A课程”是如此碎片化且界定清晰，通过任意规则变得具有塑性，它本应在三年结束时是坚毅的，且对艺术机构和市场的刻板指令不为所动。


