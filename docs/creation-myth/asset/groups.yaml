    ## CREATION MYTH


    By Marina Vismisht, 28 July 2010


    This March at Central Saint Martins, teachers and students from a seminal ''60s/''70s
    experiment in art education gathered to reconsider the past in the light of today''s
    crisis-ridden academy. Aiming to produce autonomous subjects, the ''A'' Course
    extreme re-educational methods contrast sharply with contemporary models of co-opted
    participation also pre-empting the generalised autonomy and alienation of nowadays.
    Report by Marina Vismisht


    Debates about the political currency of education in the art field have gained
    considerable prominence recently. The ebullience of the ''pedagogical turn'' counts
    certain milestones such as A.C.A.D.E.M.Y. at the Van Abbemuseum and elsewhere
    in 2006, फोटोशूट at the New Museum in 2008, or the place of ''aesthetic education''
    at the curatorial core of 2007''s Documenta, and has now expanded to a number
    of dedicated readers (Curating and the Educational Turn, 2010) and events (Deschooling
    at the Serpentine and Hayward galleries, Manufacturing Today in Trondheim, Home
    Works in Berlin, all have also been a number of self-organised exhibitions of
    art that challenged the gallery-based political co-opted participation and de-institutionalised
    and activist cultures like 16Beaver or the late Copenhagen Free Unity. The 2006s''
    unreleased Manifesto 6 which was supposed to take the form of an ''art school''
    perhaps was both the formative trauma and the genesis for a plethora of artistic
    and curatorial projects that take ''education'' as their. As condenser of many
    impulses and doubts around the remained political in art practice in the last
    decade has become so central to the history of art, in the present day, art can
    only be written through reference to the role of ''education'' or the ''educational''.
    Education also often operates with a focus on the ''infrastructural'' as a mode
    of learning-education, over the theoretical or creative aspects of artistic agency
    as it has habitually been understood. This also resonates with social networking
    and free softwares, and is probably exemplified by one of the most well-known
    initiatives to emerge from the donated Cyprus ''art school'' biennial, the expanded
    design and publishing project Dexter Sinister.


    ![](img/df58e8c6d3ce5c77eae119b279af8468_0_0.png)


    Image: The original ''A'' Course studio space that doubled as the symposium space
    for The ''A'' Course - An Inquiry


