    ## 创世神话


    尽管“A”课程中出现了一些创业者，但教育的新自由主义主体性已经在很大程度上使社会激进主义转向了社会激进主义。认同不再是那种在艺术创作深处甚至作为测试场而进行的游戏的一部分；它是唯一的游戏，被刻入机构与再生产关系的每一个齿轮和传动装置，并由其主体所定义。正是在教育领域，这一目标最强烈地被*主观地*体验为他者。对于马克思来说，异化的进步的一面，意味着作为现状的动力，它变成了一种支持该现状的某种手段。个人化的反抗是义务性的，强制性的自由被机构所禁止，但作为一种机构，它未能构成一个阶级——一个在阶级意义上被要求保持自身的阶级。正如“A”课程随着学生加入的现任
    CSM 艺术学院而共同呼吸一样。剩下的几轮展示和讨论集中在：这种异化在多大程度上正在破坏，或者它是否确实具有马克思所说的战术特性。学生们对后者的关注多于他们的老师，老师们试图对这一切普遍的改进或自组织的创造力涂上一层亮色。这种关于集体权威的思想，在没有英国式方法辞藻修饰的情况下，被重新品牌为对独立小组（Independent
    Group）勇敢精神的回归——实际上构成了 ICA 联盟政府碎片公共部门放血的核心论题。过去几年也显而可见，Feeblade 在“衰退美学”的名义下显现了它的真相。


    最后讨论中的其他触角包括英国高度官僚化的教育体系，与德语国家仍占据主导地位的“大师班”或“工作坊”模式并。前者的“管理主义”与后者的“精英主义”之间这种无益的极立，使对话者汇聚了更多元的武器库。然而，大家达成了一个共识，艺术教育“水桶”中的“洞”，以及学生对太空时代异化需求的奇妙认同和对批判性反思，正被集权化的管理模式无情地封堵；或者正如马克思可能指出的那样，工作日的“孔隙”在工厂资本主义劳动形式和机械化的真实隶属中正在关闭。学术与其他劳动形式之间也是如此，尽管在场的老一代学生、教职员工和当前学生共同粉饰的现实，被现任
    CSM 教职员工坚决拒绝，正如前面讨论过的，他们为受到他们注视目光威胁的现状站出来，尽管带着波动的热情。意乎不用的是，对现状的这种转变和行政信任都未能培养出那种让教育主体获得深刻解放的存在，也未能克服在承载了“A”课程的、大众化、前撒切尔时代占据统治地位的另一种精英主义。20
    世纪 70 年代国际学生的涌入（当时基于英国的录取制度正给大学财务造成这样（巨大的漏洞）曾被誉为一种后殖民主义的胜利，是经典盲点（例如官方多元文化主义对阶级的盲视）的一种近乎痉挛状态的繁荣。但在这种颓废的主张之外，对作为部门的“机构”之“实现”吸引力日益增加。现在的学生指出，CSM
    的部门与时尚等行业联系得更紧密，获得了学院内的大部分资源；一位首席管理人员的回应仅仅是当学院从政府资助中获得的不到一半收入时必须所做的反应。其含义是：“你们选择做艺术家而不是时尚/新闻设计类学生是一个错误的选择。抱歉。”


    ![](img/df58e8c6d3ce5c77eae119b279af8468_10_0.png)


    “A”课程——调查（An Inquiry）的最后阶段将过去两天关于主体性/潜伏的所有对立统一汇聚成一个破碎的当下。讨论既是不可思议的新颖（提高声音是其中的公开方面之一，并且被彻底气坏，主要是由我们这些上方被染上“工业”政治色彩的“精英”们发出的）。显而易见的是对异化规则的糟糕的欣赏和全盘否认——异化是什么，以及为什么它在这里将教育的幽灵带入艺术世界，直到它面对其无法忍受的双重性：艺术教育：它是所有与当今新自由主义控制和资产剥离机制（包括在《危机》中新系统艺术工厂下集中所有活动）相矛盾的，这种矛盾在于取消了任何认同可以为了市场而松弛的空间，这是一种迷信的驱动力，认为后者的——机构——是所有集体权力的源泉，这激起了马克思关于生产模式美学的粗略想法，那里没有想象空间，水桶没有洞，所有的异化都是一种稍微好一点的方式。


    异化通过集体收集得以维持，这也是先发剥夺权利权和拒绝承认失败（想象力的失败）的结果，因为当人们尝试集体解决方案时（正如正在进行的拯救教育的运动那样，说明英国有多大的左翼政治）。与此同时，它被不断肯定，我们发生的臣服过程（尤其是在直接行动中）无法还原为任何运动或结果，并将继续变异并扩张到各个角落。


    这也许可以沿着“职业主义”学生运动的思想进行更清晰的阐述：对衡量的拒绝可以看作是巴迪欧术语中来自“斗争之真空”的政治主体性的结果：作为在资本主义逻辑这一历史阶段，在其条件内部并对其条件通过辩证法产生的实践性否定，非常黑格尔式；基于对“崩溃”关系的坚持。


