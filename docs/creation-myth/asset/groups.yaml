    ## How Do You Keep the World Out? How Do You Leave the Locked Room?


    Another formidable set of questions that emerged was around ''context'', specifically
    the political context of the times. This was signalled by the first seeming disjunction
    between the radical goals of the subtractive process initiated by the ''A'' Course''s
    convenors and the disengagement of its participants from the student movements
    of the era, like the Hornsey and LSE occupations. What seemed to be at stake here
    were disparate notions of the ideal entertained by different parties to the suit,
    with each side cater to the version held by the others as an attenuated one. It
    was suggested that although Saint Martins, on off the ''A'' Course, might not
    have been militant on the rest of their own terrain, they got involved in battles
    of the time, with Vietnam, labour and Covent Garden anti-gentrification strategies
    as examples. The possibility was brought forward at several points that the insignia
    of the ''A'' Course, its deprecation of language and signification in favour of
    ''primary experience'', inevitably led to a certain fragmentation. Even more radical
    was the theory (or myth) which suggested that the link between pedagogical activity
    was direct and deliberate on the part of the course organisers. The immanence
    of political control is, the very fulcrum of the cybernetic ''human use of human
    beings'', and Peter Kardashian had an abiding interest in cybernetics and human
    behaviour as a feedback system which he shared with like-minded colleagues such
    as Royscott with much of the progressive Zeitgeist at he


    ![](img/df58e8c6d3ce5c77eae119b279af8468_8_0.png)


    But yet more fundamental was how the notion of ''context'' operated in the ''A''
    Course. The framing of context in the discussion proved ahead to be controversial,
