    《泰特论文》中的二十1世纪，第13期，2010年春季。Cuter 是泰特学院的学习主管。


    http://www.tate.org/research/tateresearch/tatepapers/1059/cutter.shm


    在公共领域，几乎没有任何资料能对“A课程”提供全面的描述，并将其置于当代或历史辩论之中。“A课程——一次调查事件”（An Inquest event）是一次旨在实现此点的突破性尝试。详细描述这一事件的出版叙述极具批判性，经常引发争议，或者非常难以获取。作者在撰写期间所能获取的此类叙述之一是
    Hester Wesley 的《伦敦艺术学院的知识分子 Kardia》，AC & Black 出版，伦敦，2010年。该叙述的一个显著特征是，它很大程度上依赖于
    Kardia 的证词，并淡忽略了其他实践者和学生对“A课程”及其理论化的贡献。“A课程”的唯一全职成员同时也负责了该课程在行政层面的启动和发展。这种对 Kardia
    证词的依赖描述，倾向于将“A课程”置于他的传记轨迹中，而非关注其共鸣。


    Wesley 与 Kardia 讨论了当时艺术中所谓的“生产”，以及与他交织的主体性生产兴趣，这种兴趣（正如“A课程”导师们一样）通过他的艺术教学引入了“A课程”：对于
    Kardia 来说，学校变成了一种研讨室，雕塑辩论扩展到了此前被视为事后之谈的来源；讨论小组变成了强制性，并且要求阅读哲学。在这里，关于艺术课程地位的新理论辩论的汇合变成了一个完全的生产地；Kardia
    解构了学生们对世界的认知，并借此实际上鼓励他们对学生的主体性和创造性诠释负责。


    BW 可能是某种暗示名为“f”的指示，即《每日邮报》关于“保姆国家”的报道，但也不少关于“激进教学法”参数的声明，DCM 院长坦言感到羞愧，由于现行的健康安全政策，“A课程”在今天永远不会被允许。晚期的另一位高级管理人员有义务指出，在圣马丁艺术学院（CSM）中确实有“激进教学法”的空间——这在前景中是一个选择。DCM
    员工出现了两次极端自满的实例，他们聚集在小组中并谈论活动的最后部分，这在很大程度上根据教育系统中激进的繁荣作为激进学生运动的基础而具有合理性：推翻精英主义！反对
    RAE（研究评估体系）！读者对这种话语表示认同，这种话语在《激进者：借来的水壶》中通常被称为齐泽克的弗洛伊德式骨架：我们从未借过你的水壶，它已经归还了；当你把它借给他们时，它就已经坏了。这对于某人来说尤为真实，此人曾一度能够同时辩护这样一个命题：他所制定的那些像水桶一样的评估标准对学生的教育没有帮助，而且这一事实正让让们自己感到厌倦。


    请参阅《世纪》第3部分，了解20世纪70年代初大型集体运动对社会变革的影响如何恰恰发生了一个向“内部”的奥秘艺术形式、灵性和“生活方式政策”的转折。对 Esalen（人类政治运动）的讨论似乎非常引人注目，尽管它自1961年以来一直在运营，并且在其“政治化”阶段在该国非常有名，这在某种程度上削弱了
    Cuter 的论文，但部分是因为它处理了他的许多追随者的极极化特征，例如提摩西·莱昂的《自我的世纪》系列以及 Adam Cuter 的其他电影可以在 http://archive.org
