    # Make the Change You Want To, or at least, a Butterless Hole


    The attempt to trace the ‘structures of feeling’ of the ‘A’ Course disclosed how
    its pedagogical risk-taking both indicated the bewilderment about the purpose
    of art education in a climate of unrest and protracted the decades of educational
    innovation in a state of decay. This testing ways of grappling with alienation
    in the educational context which was threatened between the reconstruction of
    a modernist subject and subjectivity, and objectivity and a definition of a self-conscious
    artist which then arguably, evolved into the development model of art education
    in the period, with the caveat that the contemporary modernist student has been
    fairly jettisoned by the discursive cultural power. It needs to be added that
    the ‘A’ Course was so fragmented and delineated, made malleable by arbitrary rules,
    which was supposed to emerge at the end of the three years, tough-minded and unimpressed
    by the woody mandates of the institutions and markets of art. They were supposed
    to reject the existing mechanisms for art making and validation, and really ‘think
    differently’, courting out spaces in themselves where a way could pass the entrepreneurial
    subjectivity that opposed non-conformity into business innovation, or be seen
    as the ‘flexible personality’ (Brian Holmes) devoted to ‘opportunism’ (Paulo Virno)
    as a form of life.


