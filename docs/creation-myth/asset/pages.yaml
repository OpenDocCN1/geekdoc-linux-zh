    A lively anatomy of ''context'' was likewise performed in the unpacking of what
    ''material'' and ''materials'' was in the rubric of the ''A'' Course (the Locked
    Room Project was officially known as the Materials Project and the former tutors
    tried to fix this designation). An intriguing confluence itself here, between
    the different vectors represented by the Art Placement Group and the ''A'' Course,
    as if each was working with a vastly more expansive reading of what constituted
    the art activity around the time, as Barbara Steveni proved of one. Although PGS
    pushed this lineally by inserting art into organisational and community sites,
    and the ''A'' Course stayed in the confines of the art academy, both were preoccupied
    with inquiries into the object of art and practice, dissolving art as such (though,
    paradoxically in some cases, to save it at a ‘higher’ level) and the division
    of labour in a preoccupied de-institutionalised culture.


    A number of projects in the second and third years of the ''A'' Course could also
    be said to impair the specificity of the artist''s role, as well as the ''instructional''
    general concept of art that was big at the time: the Instructions by Post constructed
    of instructions anonymously mailed to the students; the Report Project reversed,
    with students inserting meetings or locations for an unknown event to staff; the
    Agent Project each student with another student whom the student would represent
    in all their dealings with the outside world; the Transformation Project meant
    to record transformations in the state equal sums of money distributed to each
