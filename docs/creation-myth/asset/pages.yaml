    The ''A'' Course was an undergraduate course initiated in the Sculpture Department
    by radical educator Peter Kardia in conjunction with artists and educators Garth
    Evans, Gareth Jones—Guided by shared interests in linguistics, information theory
    and behavioural psychology, as well as the then-emerging minimalist and conceptual
    sculpture practices, he worked with the group of similarly inclined artist-tutors
    (one of them, Garth Evans, did an early placement with APG) to devise a course
    that would intervene directly in the habits, competences and previous training
    of students so that they would let go of their ''conceptual indexing'' and have
    the challenge all over again in a more immediate way.


    The course was structured around projects that came with sets of instructions,
    and dispensed with all evaluation or guidance as tutors mainly fulfilled a warden
    function, taking attendance and ensuring the rules were adhered to. The first
    project was the Locked Room - on their first day in the course students were handed
    identical packages containing styrofoam blocks, they could not speak to one another
    or use materials other than the ones they had, and ushered through a door that
    was locked behind them. The Locked Room became a synecdoche for the theory of
    the whole course: a regulated space or ''closed system'' which sought to isolate
    students from external influences, break them down, then build them up again into
    autonomous, critical-thinking individuals. The Locked Room was fact Kardia''s
    preferred title for the course which was historicised as the ''A'' Course that
    disregarded Saint Martin''s sculpture faculty insisted on implementing it so they
    wouldn''t have to let the students coming out of the locked room. The split was
    also, to have a large degree the result of students'' rejection of the regular
    Sculpture course and a demand to continue the kind of structure they had experienced
    in the first year – what became the ''A'' course had originally only been envisioned
    as lasting for the first year of studies.


    ![](img/df58e8c6d3ce5c77eae119b279af8468_3_0.png)


    Image: ''A'' Course, ''Sitting Project'' 1971. Photo courtesy of Peter Venn


    An inquiry brought former tutors, students and contemporaries of the ''A'' Course
    into an unlocked room with current CSM staff, students and interested parties
    to reflect on what transpired in the course, and through that, the relationship
    between freedom and constraint in radical pedagogy, the erratic correspondences
    between emancipatory learning and emancipatory policies, or in the last panel,
    the state of art education in the managerial nirvana of today, on the eve of CSM''s
    move to consolidate all its schools and students under one roof in King''s Cross.
    From a sedate art historical exercise, the ''inquiry'' at times frequently invoked
    forms like the judicial trial, a reconstruction and recommission, meeting a group
    therapy session.


    Another layer of reconstruction came with the screening of The Locked Room, a
    film made by ''A'' Course tutors (Evans, Jones and Harvey) after the course had
    finished, which tried to depict what that first day'
