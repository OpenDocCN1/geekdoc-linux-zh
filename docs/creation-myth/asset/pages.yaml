    There is hardly anything in the public domain which gives a comprehensive account
    of the ''A'' Course and places it within contemporary or historical debates. The
    ''A'' Course - An Inquest event is a path-breaking attempt to do exactly this.
    The published narratives that detail this account are highly critical, frequently
    contentious or very difficult to access. One such narrative available to the author
    at the time of writing is Hester Wesley''s ''The Intellectual Kardia at the Art
    School of London'', AC & Black, London 2010. A marked feature of this account,
    is the degree of reliance on testimony from Kardia and elision of the contribution
    of other practitioners and students to the ''A'' Course and their theorisation.
    The only full-time member of the ''A'' Course was also responsible for its initiation
    and development at an administrative level). The account of reliance on Kardia''s
    testimony tends to be one of situating the ''A'' Course in his biographical trajectory
    rather than interests its resonances.


    Wesley refers to Kardia about what was considered ''production'' in art at that
    time and the interest in production of subjectivity which intersected him (as
    they would for the ''A'' course tutors) in his art teaching to the ''A'' Course:
    For Kardia, the school became a kind of seminar room, where the sculptural debate
    became broader to sources previously regarded as post fact; discussion groups
    became mandatory and philosophy reading required. Here, the confluence of new
    theoretical debates about the status of the art course became a site of production
    altogether; Kardia deconstructed his students'' notions of the world, and by this,
    actually encouraged them to assume responsibility for their students'' subjectivity
    and creative interpretation.


