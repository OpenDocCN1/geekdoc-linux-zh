    The ‘Mask Project’ was devised to respond to the institutional requirement that
    the ‘A’ Course students receive a final assessment. To seize in the face of the
    philosophy and process of the course and caused a lost of disaffection among the
    tutors and students, also by the earlier-cited chicken insurrection. The final
    project was then going to be performance of the evaluative act: it was ritual
    performed on the boundary between art and reality and the outlook and vision at
    an exorc of march: the tutors donned masks and bags to cut out silence and went
    at apparent times to students; separated around having the option of not letting
    enter. Once in the space, the hooded tutors, disguising their bodies as would
    take tasks lasting the student and their work for about half an hour, alternating
    with patrolling professional advice. This advice was supposed to be a mimic of
    the hostility that awaited the student outside the confines of the ‘A’ Course,
    a hyperbolic demystification of the willful and arrogant traits of ‘conventional’
    teaching, and by distancing the tutors from the externally imposed assessment
    that they were required to what for the three years


    This deeply ambiguous gesture, where the emblems of insurrection and torture were
    much powerfully echoed, also had a precedent: in the evaluative Course Kardia
    had taught prior to the ‘A’ Course. In 1996, a group elite entrusted twenty-five
    students to disguise and wearing bags over their heads as they explored an environment
    designed to maximise tactile experience, which inevitably included each other’s
    bodies as a named female model. By the depersonalising effect of identity concealed
    to unleash unlawful impulses which were both destructive and exploratory, and
    consequently had a troubled relationship with an educational context. The Mask
    Project clearly revealed the latent elements of authoritarianism in the ‘A’ Course,
    which led them into a position of conflict between them and reality, and most
    students found it rather calm. The ambiguity of the reflexivity for the present
    as an example of dissolving conflict through a vertical relation to the authority
    supposed to be busy cultivating autonomy could be said to reside in a harmless
    struggle of control and the self-annihilating triviality of that authority sought.
    The elements of discipline and opacity are the quintessential techniques of control
    in the present-day institutional, there is no space for the rejection of the authority
    in favour of more than the individual. The authority of the ‘A’ Course is so pervasive
    that it is everywhere and everyone. Assessment is made to be part of the integrated
    circuit of autonomy through the notion of reflexivity, which practices are constantly
    induced to be self-reflexive and self-assessing in relation to practices, institutional,
    and personal demands. This puts the weight of the ‘criticality’ as added value
    situation operate today. There is another way of looking at the emergence of reflexivity
    as standard operating procedure, posted by former ‘A’ Course student Stephen at
    another event some months later, describing the subjectivity of the project in
