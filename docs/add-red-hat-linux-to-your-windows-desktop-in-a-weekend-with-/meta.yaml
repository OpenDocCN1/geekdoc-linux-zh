  md: '**Description:** The `rm` command is similar to the `DEL` command under MS-DOS,
    but it is much more powerful.


    > **CAUTION** Unlike MS-DOS, Windows, or the Mac OS, Linux assumes you know what
    you''re doing. This means if you have the permissions to remove files, Linux lets
    you and it doesn''t complain that it might damage the system. Be very careful
    when removing files under Linux; once they''re gone, they''re gone. There is no
    command to undelete in Linux, so be sure to exercise this command with caution.
    You can wipe out your entire directory tree and Linux happily lets you. This is
    a good reason not to do your work when you are logged in as root. Normal users
    don''t have the permissions to really mess up the entire system. The root user,
    on the other hand, can delete the entire filesystem with one command.


    **Usage:** To remove a file, type `rm`, then any options, and then the name of
    the file to be removed.


    **Options:**


    +   - `-f` *Force.* Do not prompt the user for confirmation, and give no error
    messages for non-existing files.

    - `-i` *Interactive.* Ask before removing each file.

    - `-r, -R` *Recursive.* Remove directories and their contents recursively.

    - `-v` *Verbose.* Print the names of files being removed.


    # **Example 1: Removing a File**


    To simply remove a file use the `rm` command with no options, and only one argument—the
    name of the file you wish to remove, like this:


    ```

    rm file

    ```


    This removes the file with no error message or output of any kind as long as the
    file does exist and you have permissions to remove it. If the file doesn''t exist
    or you don''t have permissions, `rm` produces an error message.'
  merge: -1
