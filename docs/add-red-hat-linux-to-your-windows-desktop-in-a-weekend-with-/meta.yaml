  md: '# # Setting up Your Internet Account


    A great deal has been said about the Internet this past decade. Although much
    hoopla and hype has been associated with the Internet—the largest of all public
    computer networks—it should be noted that the Internet is not even close to being
    finished.


    The growth of the Internet (thus far) is in many ways similar to the growth of
    the telephone in the United States in the late 19th Century. For the first five
    years of its commercial existence, the telephone was in about 10 percent of U.S.
    households. In five more years, it was in 50 percent of American homes. And in
    another five years, it was in 90 percent of all U.S. homes.


    The Internet matches this growth pattern closely. By 1994, five years after the
    Internet broke out of its pure academic setting, connection to the Internet could
    be found in about 10 percent of U.S. homes. Now, a little over five years later,
    the pervasiveness of Internet access in the United States has reached nearly 50
    percent. Incredible as it may seem, the United States is only at about its halfway
    mark toward full Internet usage. (The Internet''s presence in other nations is
    behind in terms of percentages but perhaps only because the U.S. had a head start;
    the pattern of the growth remains the same.)


    Whether you are one of the new kids on the Internet block or have been surfing
    since the days of Lynx, you will find the Internet is becoming less of a place
    to play and more of a place to work. More and more people are turning to the Internet
    to handle banking needs, shop for holiday gifts, and even check up on their kids
    at daycare via Web cameras.


    The history of Linux and the Internet is an intertwined one. Linux''s predecessor,
    UNIX, was *the* operating system upon which the Internet was built. In fact, much
    of the syntax of the Internet ("http://", FTP commands, forward slashes for directory
    separators) is directly derived from UNIX line commands.


    Thus, it should come as no surprise that Red Hat Linux 7 provides a rich set of
    Internet tools for access. All you have to do is get yourself connected.'
  merge: -1
  pgno: 171
- img_proc: false
  md: 'Getting an Internet account is simple these days. Many of us seem to get a
    CD-ROM in the mail with connectivity software almost once a month. However, with
    Linux, you will need to make sure you are using the right type of account.


    The "language" of the Internet is called TCP/IP. This language (called a protocol)
    is how data is sent from your computer to a Web server computer in, say, Durham,
    North Carolina.


    > **TCP/IP** (**T**ransmission **C**ontrol **P**rotocol/**I**nternet **P**rotocol):
    A suite of communications protocols used to connect hosts on the Internet. TCP/IP
    is a product of the UNIX operating system and is used by the Internet.


    Even though TCP/IP is a UNIX-based product, Red Hat Linux needs additional protocol
    help connecting to the Internet through a dial-up connection. TCP/IP, after all,
    does not transmit the IP (Internet Protocol) data packets through serial lines
    very well—serial lines like those in modems, for example.


    To get all of the data packets through a modem, an additional protocol, PPP, is
    used. The irony of this is that PPP is not a UNIX invention—it and its predecessor,
    SLIP, was developed to connect Windows computers to the Internet.


    > **PPP** (**P**oint-to-**P**oint **P**rotocol): A communication protocol used
    to deliver data packets through modem lines during a dial-up call to the Internet.


    PPP works on Linux systems—Red Hat (RH) being no exception. The RH PPP Dialer
    program manages connection of your PC to the Internet. You must first configure
    the Dialer so that it can communicate properly to the computers at your Internet
    Service Provider.'
  merge: -1
  pgno: 172
- img_proc: false
  md: '# # Configure the PPP Dialer


    Red Hat Linux 7 comes with the Dialup Configuration Tool, an automated method
    of setting up your Internet connection. For most ISPs, using this application
    is enough to create a routine connection. There may be instances where more control
    over a connection''s configuration is needed—which is why this section will also
    examine the manual editing of a connection using the Dialup Connection Tool.


    Using the Dialup Connection Tool is directly analogous to the Internet Connection
    Wizard used within the Microsoft Windows operating systems. The idea is to step
    though the application, providing the snippets of information needed by Red Hat
    to create a new PPP connection.


    Before you begin the next task, which will demonstrate the creation of a connection,
    you should gather the following information:


    +   - Domain name of the ISP (e.g., earthlink.net)

    - The user name for your account

    - The password for your account

    - The phone number for the ISP


    You should also confirm what communications protocol your ISP requires. A vast
    majority of the ISPs will require PPP; but some may use alternate protocols, such
    as SLIP or PLIP.


    > **TIP** Many ISPs provide connection information in a single Web page or Web-accessible
    document. If you have access to the Internet from another PC or a Windows partition,
    visit the Web site of your ISP to see if yours has provided this information.
    A good place to check can be the "technical support" or "FAQ" sections.


    Once this information is gathered, it is a simple matter to enter it into the
    Dialup Configuration Tool, as shown in the following steps.


    +   1. Click the Main Menu icon to open the Main Menu.'
