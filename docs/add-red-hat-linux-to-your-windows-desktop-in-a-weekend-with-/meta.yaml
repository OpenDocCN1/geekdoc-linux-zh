  md: '# # Fixing LILO


    Dual boot using the LILO boot loader is straightforward. You simply have to install
    each operating system in a separate partition or disk, and LILO on your master
    boot record (MBR). LILO is then able to boot both Linux and other operating systems.
    Make sure that Linux is installed last so that nothing overwrites the MBR after
    LILO has been installed.


    Things get more complicated if the other operating system is Microsoft Windows
    NT. Windows NT has a special loader called NTLDR, which must be placed in the
    MBR. This means that you cannot overwrite it with LILO or Windows NT will refuse
    to boot. There is a way around this limitation. Make sure you install Windows
    NT first, so it can write its loader to the MBR. Now when you install Linux, set
    the Linux partition as the active (bootable) one. When it is time to install LILO,
    specify that you want it installed on the Linux partition, rather than on the
    MBR. This way, when the system boots, the Linux partition gets loaded before NTLDR,
    and LILO can ask you which system you want to boot. If you select Windows NT,
    it will then load NTLDR, allowing both systems to coexist without problems.


    A common problem with big disks was the early inability of the BIOS to recognize
    more than 1024 cylinders. Now, however, many large hard disks have more than 1024
    cylinders. These are commonly hard disks greater than 8.6 GB. LILO will most likely
    not be able to load Linux, or any other system, if it is placed after the first
    1024 cylinders. The way to handle this problem is to place your root partition,
    which is the one with your kernel, at the beginning of the disk. Do the same for
    your C: drive if you have DOS or Microsoft Windows installed. At the end of the
    drive, you can create some data or swap partitions. This will ensure that LILO
    has no problem loading any OS on your machine.


