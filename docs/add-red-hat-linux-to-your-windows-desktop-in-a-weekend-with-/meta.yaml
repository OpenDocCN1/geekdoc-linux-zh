    # Sound


    One of the most popular peripherals today is a sound device. No computer should
    be without one. Applications use sounds in increasingly creative ways to generate
    signals about what''s going on. Games rely heavily


    ![](bbox=[0.05, 0.73, 0.72, 0.97])'
  merge: -1
  pgno: 203
- img_proc: false
  md: 'on sound to put you into the action. And don''t get me started on the Internet:
    entire radio and television broadcasts are now made available.


    All of this sound content is worthless, though, without a decent sound device.
    Sound devices are typically composed of two sets of components: a sound card and
    a set of speakers. As you learned Friday evening, Red Hat Linux is able to support
    quite a few types of sound cards, which are the heart of a PC sound system.


    > Speakers will work with any sound card—the interface is pretty standard. This
    is not to say you should not give the purchase of speakers any thought. If you''re
    going to get speakers, get mid- to high-quality speakers. This is one area where
    I think more investment is worthwhile.


    When Red Hat is first installed, your sound card will likely be configured automatically.
    On the off chance that it is not configured, don''t worry. Setting up a sound
    card is not hard to do.


    # Configuring Sound with the sndconfig Utility


    The sndconfig application is used by Linux to configure sound. sndconfig is a
    command-line, text-based program and needs to run independently of X in the console.
