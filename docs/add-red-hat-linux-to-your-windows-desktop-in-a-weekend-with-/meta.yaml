  md: '# Add Red Hat Linux 7 to Your Windows Desktop In a Weekend


    > TIP What? You don''t religiously save the documentation for every piece of hardware
    you own? In that case, check the back of your PC. If the mouse is plugged into
    a little round 6-pin port, it''s PS/2. If it''s plugged into a trapezoidal 9-pin
    port, it''s a serial port. Anything else is a bus port.


    You will notice Linux offers options for three-button mice. These devices are
    not as familiar to Windows users but well known to UNIX users. Many UNIX and Linux
    X applications make use of the center button found on three-button mice, and mice
