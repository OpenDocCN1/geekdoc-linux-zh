  md: 'The link command is one final command that you may use frequently. Use it to
    make symbolic links to another directory or file. Use the following format:


    `ln -s <filename> <linkname>`


    For example, the following creates a link to a file:


    ```

    ~$ ls -l test*

    -rw-r--r--  1 guest   guest   1560 Dec 01 12:44 testfile

    ~$ ln -s testfile testlink

    ~$ ls -l test*

    -rw-r--r--  1 guest   guest   1560 Dec 01 12:44 testfile

    lrwxrwxrwx  1 guest   guest      8 Dec 01 13:06 testlink -> testfile

    ```


    Use links as temporary shortcuts to directories buried deep in the file system
    structure.


    Permissions are used because Linux is a multi-user operating system. That means
    different people can use the computer at the same time. Some files and directories
    you will want everyone to be able to access. Others, you will want to be private.
    Linux organizes access to files and directories into three groups: owner, group,
    and other.


    The user is usually the owner of the files he creates. When you create a user
    account, it is assigned to a group. Some examples of group are sys (system processes),
    root (the super-user root), and user (the group to which most users are assigned).


    The owner can set his files to be readable, ratable (and deletable), and executable
    by himself, his group, or all others. The root user always has full access to
    every file and directory.


    # Working with Non-Linux Partitions


    While another file partition is not exactly a peripheral, it certainly is another
    device on your PC that can be exploited like any other. If you have another partition
    on your computer, such as a Windows partition, you can easily access its file
    system from Linux.'
  merge: -1
  pgno: 166
- img_proc: false
  md: 'The first thing you need to do is determine the device on which the partition
    exists. While logged in as root, type `/sbin/fdisk -l` in the Terminal window.


    You will see a list of all logical and actual hard disks on your PC


    You will need to create a mount point directory from which the Windows partition
    can be accessed. Type `mkdir /mnt/win` or `mkdir /mnt/windows`, naming the directory
    something that you can remember.


    Now, all you need to do is mount the partition by typing `mount -t vfat /dev/hdaX
    /mnt/win`. Remember to replace the *x* with the correct drive number. Your Windows
    file system can then be accessed like any other file directory.


    > **TIP** To remount the partition after a halt or reboot, simply type the mount
    command once more.


