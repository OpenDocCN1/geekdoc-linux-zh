    # Using StarOffice 5.2 for Linux


    Advertising in the modern age has grown to outlandish heights. Day after day,
    images and sound exhort us to drink this, see that, and wear these blue jeans.
    Mostly the hype is just that—hype. A certain huge sci-fi movie released in the
    summer of 1999 demonstrated this point rather well.


    Nevertheless, every once in a while, the hype has some substance to it, so we
    keep listening. StarOffice is a product where we should definitely pay attention.
    Is StarOffice the *Greatest Office Suite Ever Made*? No. Everything can be improved
    upon, and not everyone will like using StarOffice. But StarOffice does offer something
    other office suites do not: a unique, totally integrated interface that seamlessly
    blends its different components.


    Since you successfully installed StarOffice on your Linux PC this morning, it''s
    time to start it up and see for yourself how this powerful office suite is put
    together.


    # StarDesktop: A Better Interface


    The best place to start any tour is at the beginning. With StarOffice, the beginning
    starts on the StarDesktop.


    Getting to the StarDesktop is very simple: just start StarOffice. If you are running
    the KDE interface that comes with Red Hat Linux, do this by selecting the StarOffice
    5.2 menu option on the Application Starter menu.'
