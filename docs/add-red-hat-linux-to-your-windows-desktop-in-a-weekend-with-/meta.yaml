    # ACKNOWLEDGMENTS


    It goes without saying that you would not be holding this book in your hands had
    not some very talented and creative people lent their skills to help me get this
    done in what may be record time.


    I can never express enough gratitude to my editors. For those of you that think
    this brilliant writing is the sole product of my fevered work (all two of you),
    you would be wrong. And I thank Kim Spilker, Michael Woodward, Lori Swan, Joell
    Smith, Marian Hartsough, and Bill Schilling profusely for their hard work.


    They say no man is an island. I am fortunate enough to have three spectacular
    women in my life who know how to treat me right (or drive me insane, depending
    on the time of day). My wife and two wonderful daughters get the big thanks and
    smooches for putting up with me squirreled away in the office for days at a stretch.'
