  md: '# # Making Links


    **Name:** `ln`


    **Function:** To create a hard link or symbolic link to a file.


    **Syntax:** `ln [options] source [linkname]`


    **Description:** The `ln` command creates a link to a file or directory. By using
    the `ln` command, you can create either a symbolic link or a hard link. A symbolic,
    or soft, link is a special file that contains a pathname. Hard links are actually
    another name for a file, rather than a pointer to that file like symbolic links.
    As long as a name (that is, a hard link) for a file exists, it remains on disk.
    Even if you create a file, create a hard link to it, and then delete the original
    file, the data remains safely on disk. If you create a symbolic link pointing
    to a file and delete the original file, the file ceases to exist and the soft
    link is left pointing to nothing.


    The other major difference between symbolic links and hard links is that symbolic
    links can cross filesystems. Hard links can only point to files on the same filesystem.
    For instance, if you have your `/home` directory on one hard drive partition,
    and the `/opt` directory on another, you could not create a hard link from something
    in the `/home` directory to something in the `/opt` directory. However, you could
    create a symbolic link between the two with no problem.


    **Usage:** Use the `ln` command to create symbolic or hard links to files or directories.
    If you do not specify the name of the link, `ln` attempts to create a link with
    the same name as to what you''re linking.


    **Options:**


    +   - `-f` *Force.* Removes files if they already exist with the link''s name.

    - `-i` *Interactive.* Prompts the user if files exist.

    - `-s` *Symbolic.* Makes a symbolic link rather than a hard link.'
  merge: -1
  pgno: 324
- img_proc: false
  md: '# Example 1: Creating a Symbolic Link to a Directory


    Let''s say you do a lot of work in the /home/httpd/Webpages/uri/ directory, but
    don''t feel like typing the entire directory name each time you want to change
    to that directory. You can create a symbolic link to that directory in your home
    directory called /web and then you only have to type cd web to change to the /home/httpd/Webpages/uri/
    directory. To create that link, use the following command:


    ```

    ln -s /home/httpd/Webpages/uri/ ~/Web

    ```


    As long as there are no files in your home directory called /web, you have created
    a symbolic link to the proper directory. This can be very useful and save quite
    a bit of typing!


