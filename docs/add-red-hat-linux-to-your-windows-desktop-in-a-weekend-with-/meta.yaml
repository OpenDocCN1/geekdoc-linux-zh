  md: '# SATURDAY AFTERNOON Initial Configuration Issues


    Directory paths can be expressed in either relative or absolute terms, using commands
    such as `cd ../../etc` or `cd /etc`. This command is equivalent only as long as
    the reader is not more than two levels deep in the file system. For instance,
    if the current directory is `/usr/local/bin` then the first command will take
    you to `/usr/etc`.


    +   * `pwd`. This command displays the current working directory. For example,
    the command line `~$ pwd` displays `/home/guest`.

    * `cp`. This command corresponds to the Copy command in DOS. For example, use
    this command to copy the file named `test` into the new file named `test2`:


    ```

    cp test test2

    ```


    You can include paths in the file names. Notice that several periods are allowed
    in Linux file names:


    ```

    cp /etc/lilo.conf lilo.conf.copy

    ```


    `cp` does not normally check to see if the target file already exists before overwriting
    it. To make `cp` always display a prompt before overwriting a file, edit the file
    `.bashrc` in your home directory. Add the following line if it doesn''t already
    appear in `.bashrc`.


    ```

    alias cp=''cp -i''

    ```


    Later, if you want to override the prompt, use the `-f` switch.


    +   * `mv`. Similar to `cp` is `mv`. This command moves the file to the new directory
    or file name, leaving no copy in the original location. This command is most often
    used to move files from one directory to another. It is also used to rename a
    file. DOS users often find the use of such a powerful command in place of their
    REN command startling.


    For example, the following line renames the file `test` to `test2`:


    ```

    mv test test2

    ```'
