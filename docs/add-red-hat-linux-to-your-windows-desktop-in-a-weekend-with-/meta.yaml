    The BIOS on your PC may have issues with Red Hat Linux''s Linux Loader (LILO)
    application. LILO steps in after the BIOS is finished with its boot process and
    starts to load Linux (hence the name). When Linux is loaded, LILO first looks
    for the /boot directory. If you have put the /boot directory somewhere where the
    BIOS and LILO can''t find it, then you''ll have a problem.


    Older BIOSes often can''t handle more than two hard drives. They may not be able
    to locate data stored above cylinder 1,023 of any drive, either. New BIOSes have
    different, less stringent limitations, but these'
  merge: -1
  pgno: 39
- img_proc: false
  md: 'restrictions are still very prevalent. If you have an older computer, be sure
    you have the latest BIOS available for it. This will certainly ease your installation
    of Red Hat 7.


    To examine the BIOS settings for your computer, simply restart your system. Then
    watch closely. Before your operating system begins to load, you will typically
    see a line that says “Press F2 for Setup,” or something similar. Sometimes the
    message passes too quickly to read as your computer steps through its boot-up
    sequence. Before your operating system begins to load, try pressing the specific
    key to be taken into the BIOS setup program. Some likely candidate keys are Esc,
    F2, and Delete.


    > **CAUTION** Unless you are very confident about what you are doing, you should
    follow a strict “look but don’t touch” policy when changing BIOS settings. One
    wrong move and you could have major system problems.


    Once inside the BIOS setup program, you should record information relating to
    your hard drives. Specifically, you are looking for how many and how large the
    hard drives are on your PC and whether they are IDE- or SCSI-type drives.


    You may be wondering why getting this information here is necessary, since it
    may have shown up in the Disk Drive Info section of your device report. If it
    did, you’re all set. However, many hard drives do not have their types listed
    for the Device Manager, so you’ll have to fetch the information in the BIOS.


    > **CAUTION** Be careful not to confuse the appearance of multiple drive letters
    on a directory list with the true physical presence of multiple drives. Partitioning
    software can divide one real (physical) hard drive into a number of virtual (logical)
    hard drives that operating systems treat as separate entities. The BIOS will only
    list information about your physical drives, while information regarding logical
    drives can be viewed through any directory utility such as the Windows Explorer.'
  merge: -1
  pgno: 40
- img_proc: false
  md: 'Once you''ve noted your drive information in your Linux journal, exit the BIOS
    setup program as described by your PC''s program, making sure **not** to save
