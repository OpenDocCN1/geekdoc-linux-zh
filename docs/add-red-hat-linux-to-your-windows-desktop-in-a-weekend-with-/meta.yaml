    # StarWriter: A New Way to Write


    If StarDesktop is the center of StarOffice, then it can be safely said that StarWriter
    is the focal point.


    The written word is still a major component of our daily lives. Newspapers, Web
    pages, and books—the written word comprises them all. Even our audio and visual
    media stems from written scripts and news copy.


    StarWriter was the first product developed by the original Star Division and,
    as such, is the most developed component of Sun''s new office suite. You can see
    this robust nature in Figure 6-27, which shows a typical StarWriter window. You
    can see that StarWriter offers a number of tools. Three tools unique to StarWriter—and
    the entire StarOffice suite—include the Navigator, Stylist, and Help Agent.


    ![](bbox=[0.05, 0.48, 0.65, 0.9])'
  merge: -1
  pgno: 274
- img_proc: false
  md: 'The Navigator enables you to navigate your cursor to any point in a document.
    For instance, the Navigator inventories and lists the total number of tables,
    figures, and other unique objects within a given document. If you wanted to jump
    to, say, Figure 6-20 of your document, then you would just click on that entry
    in the Navigator and your cursor appears at Figure 6-20.


    The inventory feature of the Navigator also makes it easy to manage documents
    with large numbers of extra elements. If your document were supposed to have nine
    pictures, it would be embarrassing to discover after it comes back from the printer
    that only eight were actually inserted.


    The Stylist brings forth the concept of styles. This may not be a new concept
    to you, as styles have been around for a few years.


    > **Styles:** A collection of various formatting attributes that you assign to
    whole sections of text, usually at the paragraph level.


    Styles typically have proper names that describe their features. The Stylist in
    Figure 6-27, for example, has paragraph styles of Heading 1, Heading 2, and so
    on. The naming makes it easy to ascertain where to use these styles.


    > Styles in today''s word processing programs stem from a concept found in Standard
    Generalized Markup Language (SGML). SGML is a text-only format that uses tags
    to highlight portions of a document. Any text in between the tags takes on the
    attributes assigned to the tags. A <Bold> tag makes text **bold**, for example.
    If this sounds familiar, it should. SGML is the parent language for another little
    language you may have heard of: HTML, the language of the World Wide Web.


    The Help Agent proactively provides context-driven help on any part of StarOffice.
    If you are new to StarOffice, having the Help Agent on while you work can be useful.
    Click on a toolbar button and, as the action takes place, an explanation of what
    the button does appears in the Help Agent.'
  merge: -1
  pgno: 275
- img_proc: false
  md: '> **TIP** Don''t use the Help Agent forever, just until you get comfortable
    with StarWriter and the rest of the StarOffice components. As nice as it is, Help
    Agent takes up some of your screen''s real estate, which you could use for something
    else.


    The uses for StarWriter are as boundless as your imagination. You can create any
    form of written document and use elements from any other part of StarOffice to
    suit your needs.


    # StarCalc: Figure It All Out


    Spreadsheets get their name from the old-fashioned ledger sheets used by desk-bound
    accountants. In their work, they would lay out numbers on what were at times huge
    sheets of grid-lined paper. Sometimes these sheets would be yards long and if
    a mistake were made in just one cell…well, let''s just say the mistake would be
    rather tedious to find and fix.


    The concept of these paper sheets has been carried over to electronic form. It
    made sense to keep data in this familiar tabular format. Thus, the first spreadsheet
    program, VisiCalc, was born. Though no relation to StarCalc, a lot of the concepts
    introduced in VisiCalc provide the basis for StarCalc''s design.


    Figure 6-28 shows the basic elements common to all spreadsheets: cells, rows,
    and columns. You can''t have a spreadsheet without these elements. Spreadsheets
    programs differ in the way they present and utilize these elements.


    Cells are the heart of a spreadsheet. They contain the data. The data values can
    be numbers, letters, words—whatever you want to keep track of. Cells can also
    contain formulas. Formulas are mathematical equations that take the value of one
    cell and relate it to the value of another cell to come up with a unique answer.
    If needed, formulas can equate whole ranges of cells.


    StarCalc helps you organize your data in other ways. In Figure 6-29, you can see
    the tools and navigational aids within StarCalc.'
  merge: -1
  pgno: 276
