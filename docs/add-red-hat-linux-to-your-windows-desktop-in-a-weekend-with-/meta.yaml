    # ## Determining Language, Keyboard, and Mouse Settings


    Early in the installation process, Red Hat Linux gathers important information
    so that it can continue smoothly. This information is centered around input—specifically,
    how you will input data into both Anaconda and, later, into Linux. You''ll need
    to select the language, keyboard, and mouse device you want to use.


    The very first screen of the installation path requires you to select the Language
    you will use. This will be the language used during the'
