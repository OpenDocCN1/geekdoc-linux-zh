- img_proc: false
  md: '# SCSI Adapters


    Finally, the section on SCSI cards bears a close look, if only because so many
    other devices could depend on the compatibility of the primary SCSI card.


    This is a large section of the HCL and you should take the time to find your PC''s
    SCSI adapter. While there are no incompatible SCSI cards, certainly you will need
    to use some caution if your card falls into the Tier 3 category.


    # Backing Up Your Old Data


    After you have ascertained your hardware compatibility with Red Hat Linux 7, you
    will need to get your computer ready for the installation. One of the first things
    you should do is back up the data on your PC.


    It is always a good idea to back up your valuable data, thus guarding against
    system catastrophe. At the very least, you''ll want your data protected from power
    surges, virus attacks, computer theft, or anything else that can affect your ability
    to access the data on your machine.


    Installing Linux certainly can''t be classified as a catastrophic event. However,
    you are going to be changing your hard drive''s partitions or perhaps even formatting
    your hard drive. These events can and will erase data completely.


    The first thing you should decide is what data should be backed up. That really
    depends on what you want to do in your Linux installation. Especially if you plan
    to dual boot (running Windows and Linux on the same PC), then you will need to
    make sure you''ve safeguarded most of your Windows data. You''ll find more information
    about dual booting in the section titled "Making Room for Multiple Operating Systems"
    later this evening.


    Even if you plan to completely remove Windows, there is still merit to saving
    your data files. Some file types can be opened on a Linux PC, such'
  merge: -1
  pgno: 57
- img_proc: false
  md: 'as graphic files (GIFs and JPEGs, among others). In addition, Microsoft Office
    files can even be opened, compliments of a great office suite application called
    StarOffice that is fully Office compatible. You''ll need to save, not back up,
    these files if you plan to use them on your Linux machine, though. Linux will
    not be able to read a Windows backup file.


    Most computer applications these days use huge amounts of disk space, primarily
    because today''s big hard drives enable them to do so. Backing up your data and
    your application files is a big job. If you have sufficient storage capacity (such
    as a tape or Jaz drive), then I recommend that you back up your entire hard drive.


    For those of you that do not have a sufficient large-capacity device to hold an
    entire drive''s worth of data, then just back up your data files. Your data files
    are the documents, spreadsheets, drawings, and other files that you have created
    over time on your computer. If you do run into trouble, you can restore your system
    by first re-installing your operating system, your applications using your original
    disks, and then restoring your archived personal data files.


    If you have never used a backup program, you will find them easy to use. Many
    backup programs are available, including an excellent one found with Norton System
    Utilities. The principles for backup utilities are pretty much the same: locate
    and identify the files you wish to archive, specify the location of the new archive
    file, and then create the file. Restoration is simply the reverse of this action.


    Microsoft Windows has its own utility for backup that can be used to archive your
    data. The next few paragraphs describe how to work with the Windows Backup utility.


    From the Windows 95/98 taskbar, click the Start button, then choose Programs,
    Accessories, System Tools, Backup. The Microsoft Backup application will start
    with the Welcome to Microsoft Backup dialog box open (see Figure 1.12). You can
    now choose to create a new backup file, open an existing backup job, or restore
    archived data.'
  merge: -1
  pgno: 58
- img_proc: false
  md: '![](bbox=[0.08, 0.13, 0.62, 0.38])


