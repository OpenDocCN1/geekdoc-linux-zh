    # Configuring Your File System


    A file system is the way any operating system organizes its files. Most modern
    file systems use a hierarchical system. That is, a main or root directory that
    contains files and subdirectories. Each subdirectory contains additional files
    and subdirectories. This hierarchy makes it easier to organize and arrange files.


    # Using the Linux File System


    Linux uses a single root directory. DOS, on the other hand, has multiple root
    directories (C: D: E: F: ... )—one for each disk (actually each disk partition).
    Each disk is assigned a letter followed by a colon (C: D: E: ... ). Linux mounts
    one disk as the root directory (/) and subsequent disks are mounted anywhere in
    the file system as subdirectories. In English, this means that if you mount your
    CD-ROM drive in Linux, it may appear in the directory as /mnt/cdrom, as opposed
    to D:.'
  merge: -1
  pgno: 160
- img_proc: false
  md: '# **BUZZ WORD**


    > ***Mounting*** is another way of saying "connecting." In DOS (and Windows),
    you do not concern yourself with mounting, as all disks and their partitions are
    connected at the same time. This is not the case in Linux, though Red Hat 7 makes
    it very easy to have disks automatically mount whenever a disk is inserted.


    An important benefit of this flexibility is that branches on the directory tree
    are scalable. If a branch of a directory tree becomes so large that it fills up
    its disk, you can assign a new disk to this branch. This frees up space on the
    drive containing the parent directory—without changing the directory structure
    of the filesystem. It is possible that Linux may start on one disk and grow to
    reside on several disks but still have the same core directory structure.


    This is a great benefit to have, particularly if some of your Linux applications
    need files in certain directories. With this system, you can move directories
    and their files to any device on your system and still use all of your applications.
    Those of you familiar with trying to move application directories in the Windows
    environment are familiar with just how difficult this particular task can be.


    Another big difference between Linux and DOS is that Linux is case sensitive.
    Capital letters appear different to Linux from lowercase characters. A directory
    can contain files named Notes, NOTES, and notes. This can be confusing. You are
    encouraged to avoid this situation by choosing a naming convention for your files
    and directories and sticking to it.


    Linux uses the forward slash (/) to separate subdirectories. MS-DOS uses the backslash
    (\); don''t confuse the two. A file will then have a path that looks something
    like `usr/src/linux/Makefile`.


    Linux has some other special characters: - points to the user''s home directory;
    / points to the root directory; MS-DOS and Linux share the use of . (current directory);
    .. (parent directory); * (wildcard); and ? (placeholder). Like Windows 95/98 and
    Windows NT, Linux requires you to surround file names containing spaces with quotation
    marks.'
  merge: -1
