    a piece of hardware, and hope that the system will see it. Sometimes it works,
    sometimes it does not. Then begins the sometimes-complex task of troubleshooting.
    Thankfully, the Linux system becomes better every year, and with new kernel releases,
    more hardware is auto-detected. With more users, Linux also has more developers
    working on drivers for the latest and greatest devices sold at your local computer
    store.


    The current kernel, and the one that comes with Red Hat Linux 7, is version 2.4.
    I hope that more companies will wake up and start making'
