- img_proc: false
  md: '# Resources for Checking Compatibility


    When purchasing software at the store, you can usually flip the box over to read
    the software''s system requirements. For the most part, the listed requirements
    are usually complete. Alas, Red Hat Linux''s requirements are woefully generalized
    on the box. Only broad parameters are detailed on the side of the box and with
    good reason: the hardware compatibility lists available for Red Hat Linux are
    pages and pages long.


    Where do these famed lists exist? Fire up your Internet connection—you''re going
    surfing on the Web.


    # Red Hat Support


    It only makes sense that the best place to locate information about Red Hat Linux
    7 is on the Red Hat Web site. Located at http://www.redhat.com/support/hardware/,
    the HCLs (Hardware Compatibility Lists) are gathered for all of the major releases
    of Red Hat.


    Before you click the Intel Hardware link to begin examining the HCL, let me say
    a word about the different levels of compatibility that you will find in the list.
    Because of the huge variety of PC hardware available today, Red Hat supports a
    finite set of hardware. That does not mean that other hardware will not work with
    Red Hat—just that it is not directly supported.


    Red Hat divides these differing levels of compatibility into tiers: Tier 1, 2,
    3, and Incompatible. Each tier represents the level of compatibility or *comfort*
    Red Hat will have with a particular piece of hardware. Table 1.3 defines these
    levels.


    The Red Hat HCL is very well organized. Each section focuses on a particular type
    of hardware and includes a definition of the compatibility levels. There is also
    an important warning about hardware names that bears repeating here.


    In the hardware world, the *branding* of a given product occurs by keeping a popular
    name associated with what may be a completely different product. To provide you
    with a rather simplified example, a Pentium'
  merge: -1
  pgno: 44
- img_proc: false
  md: '### Table 1.3 Hardware Compatibility Tiers


    | Tier | Definition |

    |---|---|

    | Tier One | Fully supported hardware. Red Hat tested, used and approved. Go crazy.
    |

    | Tier Two | Compatible and supported, but occasional problems have occurred.
    Red Hat support is limited. Proceed with caution. |

    | Tier Three | Compatible and unsupported. Devices in this category may or may
    not work. Red Hat will provide very limited support, primarily pointing you to
    other potential sources for help. Danger, Will Robinson. |

    | Incompatible | Very little chance of this working with Linux. Other daredevil
    users may have found workarounds, but don''t count on it. Here there be dragons.
    |


    processor is very different from a Pentium II processor or a Pentium III. Even
    though the name Pentium is prevalent throughout, these are not the same products.


    Other brand name differences are much more subtle and the product differences
    far more drastic. The point here is that if the exact model name or number is
    not listed in the HCL, the safest assumption should be that the hardware is incompatible.


    The HCL is constantly evolving as more solutions to hardware compatibility issues
    are discovered. Later this evening, some of the highlights of this HCL will be
    discussed.


    # ## Linux Hardware Database


    Unlike the Red Hat Web site, the Linux Hardware Database Web site does not offer
    a comprehensive look at all the hardware that can work with Red Hat Linux. It
    does, however, offer something the HCL does'
  merge: -1
  pgno: 45
- img_proc: false
  md: 'not: user-written ratings of how hardware really worked with Linux and tips
    on how to get around some of the sticky issues that can crop up.


    The Linux Hardware Database can be found at **http://lhd.datapower.com**. As seen
    in Figure 1.9, it contains links to hardware organized by category types.


    Clicking on a category link reveals a tabular listing of all of the tested hardware
    types for that category. The hardware is sorted by the rating the product has
    received (see Figure 1.10).


    > **NOTE** Hardware in this database is compared on different versions of Linux
    and different flavors as well. Be sure to read the testing specifications for
    each product. Hardware that tested well on earlier Linux kernels should work well
    with later versions.


    ![](bbox=[0.26, 0.55, 0.91, 0.91])


    **Figure 1.9** The Linux Hardware Database includes Linux compatibility reviews.'
  merge: -1
  pgno: 46
- img_proc: false
  md: '![](bbox=[0.205, 0.115, 0.77, 0.53])


    Figure 1.10

    The best hardware to use in a category gets a rating of 5.0.


    The rating system used in this site is based on the average of five categories:


    +   * Stability

    * Performance

