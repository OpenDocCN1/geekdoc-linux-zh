    network, perhaps you connect to the Internet or some other system using a dial-up
    connection. Therefore, if you''ll want to access the Internet using that connection,
    it is a good idea to write down some important settings so that you can refer
    to them during Linux installation.


    > **CAUTION** If you typically use a dial-up connection to access the Internet
    via one of the national service providers such as America Online or CompuServe,
    be aware that Linux does not provide connection protocols to these services. AT&T
    Global Network Services is the only Internet service provider (ISP) with a *proprietary*
    connection format to which Linux will connect at this time. If you connect to
    the Internet via an ISP with the more common PPP connection format, then you will
