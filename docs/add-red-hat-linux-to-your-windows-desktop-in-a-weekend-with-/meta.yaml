    # Adding New Hardware and Peripherals


    Last night, we dealt with some key hardware issues you might run across early
    in the initial Linux configuration process. After all, you typically need to get
    your printer, sound card, and any plug-and-play devices working right away.'
  merge: -1
  pgno: 231
- img_proc: false
  md: 'This morning we''re going to delve a little deeper into the hardware foray
    and examine what steps you need to take to ensure the success of any hardware
    installation.


    Adding new hardware to a system consists of two phases: the hardware phase and
    the software phase. You need to add the hardware device to the system, and you
    need to tell your operating system how to manage it. The hardware phase is machine-dependent,
    and the software phase is operating system-dependent. Assuming you are working
    on a PC, regardless of its brand (AT, ATX, IBM, Compaq, etc.), installing new
    hardware is straightforward and is the same whether you are using Linux or some
    other operating system. The interface of the PC system is designed in such a way
    that any device can be accessed in a standard and documented method, and any operating
    system can then handle it. (We''ll discuss a few exceptions to this rule later
    this morning.)


    For the remainder of the morning, we''ll discuss both phases. I''ll put heavier
    emphasis on the second phase, because it is perhaps the most confusing. You may
    have installed new devices such as printers or sound cards in the past, but you
    may not be familiar with the way Linux handles them. First, you will see the various
    types of devices, including internal and external ones, with a warning about those
    devices you can safely install and those you should not touch unless you are a
    computer expert. Next, you''ll explore the software phase. You will learn how
    the Linux kernel detects and configures hardware devices. Finally, you''ll learn
    about the various configuration files and how you can change parameters for your
    new devices.


    Similar to the steps you took on Friday evening before installing Red Hat Linux,
    before you begin any hardware installation you should check the hardware compatibility
    list to see if your device is Linux-compatible. In theory, any device conforming
