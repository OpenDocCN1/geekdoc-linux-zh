  md: '# Explore the power of Linux® without giving up your Windows® machine!


    ![](bbox=[0.3, 0.28, 0.7, 0.38])


    Are you curious about Linux but think you need to be a computer guru to dabble
    in this new system? Now you can find out how easy it is to get started with the
    hottest Linux operating system. From the comfort of your home explore how to install
    Red Hat® Linux, configure your computer to boot to Linux and Windows, and get
    a look at the two desktops that come with Red Hat Linux, GNOME and KDE. After
    you''re familiar with all those tasks, you''ll discover how to add extras to Red
    Hat Linux.


    # Inside you''ll find


    +   * Information about your system and how to assess its capabilities to use
    Red Hat Linux

    * Ways to deal with unusual installation issues that may arise

    * Essential tools packaged with Red Hat Linux

    * Instructions on using Linux as your sole operating system or having it coexist
    with Windows

    * Troubleshooting tips for many installation and configuration issues


    # WHAT''S ON THE CD-ROMS


    ![](bbox=[0.7, 0.53, 0.83, 0.59])


    The latest version of Red Hat Linux, which includes a partition tool that allows
    you to install Linux on a Windows machine.


