    # StarBase: Track Your Data


    Databases are scary. There, it''s said, out in the open.


    Many people often think of databases as dark, shadowy beasts that lurk in their
    PCs, chewing up and spitting out data and reports only if coaxed out with strange
    and cryptic queries.


    Not necessarily. In recent years, personal databases have become more friendly
    and intuitive. StarBase is no exception.


    Of all the StarOffice components, StarBase needs the most input from the user
    before creating a database. As simplified as databases have become, you still
    can''t snap one together with a single command. You need to know what tables will
    hold what data, what the data entry form will look like, and what reports the
    database will need to generate.


    Sounds scary again, doesn''t it? It''s really not, and to demonstrate this, StarOffice
    does have an example StarBase database for you to begin experimenting with: the
    Address Book (see Figure 6-32).


    This Address Book contains a few sample addresses to show you the way. Basically,
    you can use it as a fully functional electronic Rolodex.


    ![](bbox=[0.03, 0.65, 0.91, 0.93])'
  merge: -1
  pgno: 281
- img_proc: false
