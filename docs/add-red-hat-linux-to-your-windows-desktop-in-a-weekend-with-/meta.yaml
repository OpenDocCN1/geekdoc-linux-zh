    | Component | Responsibilities |

    |-----------|----------------|

    | Linux | The base on which everything runs. Handles all basic file system and
    device tasks, as well as translating commands into the PC''s rudimentary machine
    language. |

    | XFree86 | The heart of the GUI. Generates a display layer that allows the creation
