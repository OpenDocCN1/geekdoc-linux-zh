  md: '# StarMath: Equation for Success


    Let''s face it: math is generally a misunderstood subject with low popularity.
    Sure, we use math on an every day level to balance the checkbook or count how
    many jellybeans are in the jar. But higher math? Who needs it?


    Well, to tell the truth, you do. Algebra and calculus come up a lot more than
    you might think. As technology becomes more and more pervasive in our daily lives,
    the need to communicate mathematically grows.


    A good example of how StarMath operates is seen in Figure 6-31, where the formula
