    To override the prompt at a later time, use the -f switch.


    +   * rm. Removes (deletes) a file or directory. You must have write privileges
    to a file to delete it.


    rm doesn''t prompt before deleting a file. Also, files aren''t as easily restored
    in Linux as they are in Windows. To give yourself a second chance to not make
    a mistake, add the following line to the .bashrc file in your home directory if
