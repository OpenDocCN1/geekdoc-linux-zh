  md: '# Example 2: Removing a Directory and All Files under It


    To remove an entire directory and any contents in the directory, use the `rm`
    command along with the recursive (-r or -R) option and the name of the directory,
    like this:


    ```

    rm -r tmp/

    ```


    As long as you have the proper permissions, and the directory exists, there is
    no prompting or messages; Linux simply removes the directory and all of its contents.
    This is a good argument for using the interactive option as well, like this:


    ```

    rm -ri tmp/

    ```


    As you can see from the Figure A-3, you have several chances to change your mind
    about removing the file under the tmp directory, and removing the directory itself.
    Unless you are very sure of yourself, and even if you are, I recommend using the
    interactive option of the rm command. It takes a little longer, but there''s less
    chance of deleting an important file. Granted, deleting a vital part of your system
    helps you build valuable troubleshooting skills, but that''s probably not the
    way you want to build them.


