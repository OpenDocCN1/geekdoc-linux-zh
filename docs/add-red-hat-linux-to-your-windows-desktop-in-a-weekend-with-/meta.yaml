  md: 'Once you have the Red Hat Linux 7 CD-ROMs, you should check the parameters
    for your hardware components as reported by your existing operating system (most
    often Microsoft Windows 95 or Windows 98). In Windows 95 or 98, these settings
    are found in the Device Manager. This is an important step; you should write everything
    down, including the type of device, name, IO port, and IRQ settings for all components.
    Knowing this information will help you troubleshoot many hardware problems in
    the future.


    Another step you must consider before installing Linux, is what type of organization
    you want for your hard disk. If your hard disk contains another operating system,
    such as Microsoft DOS or Windows, you must decide if you want to keep it, or if
    you want to devote the entire hard disk to Linux. The easiest way to keep both
    operating systems is to have two hard disks, with the old operating system on
    the first disk and Linux on the second one. If you only have one hard disk, you
    can use a resizing program to maintain your existing operating system while making
    room for Linux. If you don''t have one, such as Partition Magic from PowerQuest,
    you can use fips, the free partitioning program provided on the Linux CD-ROM.
    Be aware that the Linux fdisk or disk druid commands are not able to resize a
    partition. You must make your partitioning decisions before beginning the installation.
    Once you use fdisk or disk druid, any partition you delete will be gone for good,
    as well as access to the data it contained.


    # Boot Issues


    When you modify scripts and configuration files in your Linux system, you may
    unwittingly make your system unbootable, either by setting incorrect parameters
    or by deleting important files. A good way to enable booting so that your mistakes
    can be corrected is by specifying the following command on the LILO text prompt:


    ```

    boot: linux init=/bin/sh

    ```'
