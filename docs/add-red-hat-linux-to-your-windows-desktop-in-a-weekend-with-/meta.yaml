    # Those Touchy USB Devices


    A few pages regarding universal serial bus (USB) devices is included here for
    two reasons. First, the USB bus is unlike any other port on your system. While
    you can''t connect a monitor to a serial port, or a modem to your keyboard port,
    you can connect any type of supported device to a USB port. There are USB monitors,
    modems, network interfaces, mice, sound devices, scanners, printers, etc. Because
    of this, USB is the wave of the future—the second reason USB is discussed.


    USB is a bus. It may look like a simple port on your system, but its inner workings
    are unlike the other ports. On a serial port, unless you use some special circuit
    workaround, only one device can be connected. You can connect hundreds of devices
    to a USB port. There are USB hubs available that can be connected to the USB port.
    These USB hubs offer 6 or 12 ports to connect various other devices. Another interesting
    thing about USB is that it also provides electrical power to the devices connected.
    Most serial devices must be plugged directly into an electrical outlet, but many
    USB devices don''t have the same requirements. Devices that require a large amount
    of power include a power supply, but many won''t.


    When configuring USB in Linux, you must be aware that there are two parts of the
    USB bus to be supported—the USB controller and the device. USB controllers are
    made by various companies, but they follow a few standards. Linux currently supports
    those that comply to the UHCI and OHCI standards. Most USB controllers comply,
    so your controller should be supported.'
