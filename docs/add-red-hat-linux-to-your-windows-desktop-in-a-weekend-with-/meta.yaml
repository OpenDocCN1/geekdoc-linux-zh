    # ## Setting Cache Properties


    A vast majority of Web pages to which you may surf are heavily laden with graphics
    and other little gimcracks that take up memory and therefore lengthen download
    times. Caching is a way to accelerate the downloading process.


    > **Cache:** A specific amount of memory set aside to keep compressed versions
    of visited Web pages and their graphics. On a return visit to the Web site, any
    unchanged elements from the page are loaded from the cache first, thus rendering
    their download unnecessary.


    When it is first installed, Netscape has a fair amount of memory set aside for
    caching: a total of 8 megabytes (MB). If you often visit graphic-intense sites
    (or a lot of sites in general) you may want to change this figure.'
  merge: -1
