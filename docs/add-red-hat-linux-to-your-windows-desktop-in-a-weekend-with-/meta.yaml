    Before you start delving into the not-so-deep, dark, mysterious world of Red Hat
    Linux, let''s examine why installing any version of Linux is so different from
    anything you''ve ever installed before.


    # ## Assessing System Capability


    Since the inception of Microsoft Windows 95, most of us have become accustomed
    to relying on its ubiquitous SETUP.EXE file, designed to automatically identify
    your computer''s components (often a compromise). SETUP then attempts to match
    the components with their appropriate files and then places those files in the
    proper locations on your computer (you hope).


    Windows users can get away with this simply because Microsoft, with its very pervasiveness,
    has managed to keep hardware systems within a certain "compatibility window."
    For example, each PC manufacturer logically attempts to make small improvements
    over its competitors, changing and enhancing various component parts and then
    competitively marketing those enhancements.


    However, if each manufacturer wants Windows users to buy their product, thus taking
    advantage of the huge Microsoft following, then despite fierce competition, each
    manufacturer will try to adhere to Microsoft''s specs. This attempts to ensure
    that any enhancements can be reasonably identified by the Windows SETUP.EXE programs.


    This phenomenon, for good or ill, has left us with a lot of very similar-looking
    PCs in today''s market. The real differences between manufacturers are apparent
    only when you look at their service and repair programs or attempt to determine
    how easily their PC can be upgraded in the future.


    Critics of Linux have said that Linux is too rigid and inflexible and thus too
    difficult to use. While Linux does indeed have its problems,'
  merge: -1
  pgno: 31
- img_proc: false
  md: 'inflexibility is not one of them. Windows only *appears* to be more flexible—but
    that’s because its installation path onto a given PC has already been paved by
    hardware manufacturers whose components conform to Windows’ suggested standards.


    Linux, on the other hand, does not have cooperative agreements with PC and hardware
    manufacturers (although this is rapidly changing). So, like Scarlet O’Hara, Linux
    too must “depend on the kindness of strangers” to find its way onto different
    systems.


    Okay, here’s one of those disquieting facts about Linux: during installation,
    Linux may ignore some unrecognizable hardware devices, indifferently continuing
    through its installation process. As you can imagine, this glitch can be a real
    problem if the device in question is your PC’s video card and you can’t see anything
    on the screen.


    Here’s the good news: the number of devices that Linux cannot work with is decreasing
    rapidly, and this trend is expected to continue. Red Hat 7 certainly is more compatible
    with hardware than its predecessors. Linux programmers continue to add hardware
    drivers to the Linux kernel, including Plug and Play technology—Windows’ method
    to install unrecognized hardware devices.


    > **BUZZ WORD**


    **Kernel:** The core Linux software program, maintained by a small consortium
    of talented programmers led by Linux’s creator, Linus Torvalds. Every distribution
    (or flavor) of Linux (Red Hat, SuSE, and Debian), all build upon the Linux kernel,
    which is freely distributed.


    Still, Linux is not quite there yet. Until the majority of common devices are
    automatically recognized by the Linux kernel, you’ll need to first determine whether
    it will run on your computer. To do so, you will need to know where to locate
    the hardware information about your PC. Once you gather this information, you
    can spot any potential trouble spots before installing Linux on your machine.'
  merge: -1
  pgno: 32
