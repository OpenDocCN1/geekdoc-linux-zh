    # X, Your Monitor, and Your Video Card


    When the Linux installation is nearly over, it will launch a program called Xconfigurator,
    which will ask you questions about your video card and monitor with the purpose
    of configuring the X Window System. X is the common graphical environment in Linux,
    and is used by nearly all Linux users. It is important, therefore, that the configuration
    succeeds. X is able to detect your hardware and configure itself in most cases.
    There are a few instances, however, where it will fail.


    For example, Xconfigurator may fail to configure X with your particular system.
    I recommend you install another configuration program, XF86Setup, which is included
    on your Red Hat Linux CD-ROM. XF86Setup requires that the XVGA16 package also
    be installed.


    If Xconfigurator fails to install the graphical environment properly, run the
    XF86Setup command when the installation program is finished. XF86Setup will launch
    a graphical program that prompts you for information about your video and monitor
    hardware and may have more success configuring X. XF86Setup may be successful
    where Xconfigurator failed.


    Another X problem that occurs occasionally, especially on laptops, is that graphic
    acceleration causes the screen to display black spots and lines. The X system
    uses acceleration for many cards in an attempt to make your graphical experience
    better. If you determine that this is causing a problem, it can be disabled. To
    disable acceleration, you need to edit the /etc/X/XF86Config file manually. Add
    the following line in the [monitor] section:


    ```

    option "noaccel"

    ```'
