- img_proc: false
  md: '# Listing and Finding Files with ls


    **Name:** `ls`


    **Function:** To list the contents of a directory.


    **Syntax:** `ls [options] [directory or file(s)]`


    **Description:** The ls command lists the contents of a directory. This command
    is similar to the MS-DOS command `DIR`. In fact, typing `dir` under Linux is the
    same as typing `ls -c`. The `ls` command is one of the commands you use the most
    under Linux. You can also use the `ls` command to get information about a specific
    file in a directory.


    **Usage:** To use the `ls` command, you simply type the command, followed by any
    options you want to invoke and any filenames (including wildcards) that you want
    to specify.


    **Options:**


    +   - `-a` **All.** Using the -a option lists all files in a directory, including
    hidden files.


    +   - `-A` **Almost all.** Lists all files in a directory, except for . and .
    .


    +   - `-i` **Inode.** Prints inode number of each file.


    +   - `-l` **Long.** In addition to the filenames, lists the file type, permissions,
    owner name, size of the file and the last time the file was modified. Also known
    as the verbose mode.


    +   - `-r` **Reverse.** Lists the directory contents in reverse order.


    +   - `-sk` **Kilobytes.** Lists file sizes in kilobytes. The s specifies that,
    yes, you want to see the sizes.


    +   - `-X` **Extension.** Sorts files by their extension; files with no extension
    will be sorted first.'
  merge: -1
  pgno: 321
- img_proc: false
  md: '# Example 1: Listing Files in Your Home Directory


    You probably want to know what files are in your home directory from time to time,
    so it''s a good idea to know how to check. To list the files in your home directory,
    type the following command:


    ```

    ls ~

    ```


    That''s all you need to type. The ~ character is a shortcut that refers to your
    home directory. The output for the command looks something like Figure A-2.


    > **NOTE** Did you notice on your screen that not only are the files in the current
    directory listed, but that they''re in color? That''s one of the ways Linux makes
    your life a little bit easier.


    ![](bbox=[0.2, 0.51, 0.73, 0.82])'
  merge: -1
  pgno: 322
- img_proc: false
  md: '# Example 2: Listing Hidden Files in a Directory


    If you decide you want to edit resource files, you probably have to find some
    hidden files. To list all files in a directory, type in the following:


    ```

    ls -a

    ```


    When listing all of the files in your home directory, you find there are quite
    a few more files than you might have thought.


    # Example 3: Listing All Files and Their Attributes


    If you want to see all of the files in a directory and their attributes, combine
    the -a and -1 options, as follows:


    ```

    ls -al

    ```


    You see a listing of all files in the directory, as well as their permissions,
    modification dates, to whom they belong, and the size of the files. The first
    letter indicates whether it is a file, directory, link, or other. A file is a
    dash (-), a directory is a, a symbolic link is an l, and a hard link is represented
    as a regular file. Other characters indicate it is a special type of file. After
    that letter comes the permissions. There are three groups of three letters. The
    first set is the permissions given to the owner of the file. The next set of three
    is for the group of the file, and then finally the permissions for everyone else.
    Then you see the owner of the file, followed by the group to which the file belongs.
    By default, the size of each file is displayed in bytes. Next in the listing is
    the last time the file was modified (edited), then the name of the file itself.


    > NOTE The expression touch is not one I coined. On UNIX-style operating systems,
    a file is said to be touched when it is modified by a user in some way. A file
    is not touched when you just list the contents of a directory the file is in,
    or view the contents of the file.'
