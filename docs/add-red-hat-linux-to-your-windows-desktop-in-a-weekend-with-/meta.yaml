  md: '# Add Red Hat Linux 7 to Your Windows Desktop In a Weekend


    installation process, not necessarily within Red Hat Linux. From the language
    list, select your preferred language and then click the Next button.


    The Keyboard Configuration screen, shown in Figure 2-2, now appears. There are
    three categories here used to define your keyboard: Model, Layout, and Variant.


    While keyboard models are currently fairly ubiquitous, there are some variations
    among styles. One example many Americans will recognize is the difference between
    "natural" (ergonomically designed) keyboards and the more standard (flat) 101-key
    keyboards. Check for your keyboard model and style in the Model list. If you do
    not see your specific keyboard model, select Generic 101-key PC.


    Layout refers to the alphanumeric characters used by the selected keyboard. For
    example, someone using the German language will need characters such as ", and
    if you live in Great Britain, you might require characters such as £. In the United
    States, one of the U.S. English choices will be appropriate.


    The dead keys option should be selected if you still want an English layout but
    you also use alternate characters that require the creation of dead keys. If you
    have a newer computer, choose the ISO-9995-3 option, as it will enable your keyboard
    to adhere to an international standard.


    > **Dead keys:** Keys that allow the quick creation of non-English characters
    on an English keyboard.


    The options in the Variant category will change based on the Layout selected.
    Typically, the option is to have no variants on your keyboard model and layout
    versus one or more different variants, such as using dead keys. See your keyboard''s
    documentation for help if you have an unusual typing situation. Once you have
    completed all your selections, click the Next button.'
  merge: -1
  pgno: 81
- img_proc: false
  md: 'In the Mouse Configuration screen (see Figure 2-3), you will have the option
    to choose the type of mouse you use. As you can see when you go to the local computer
    store, not all mice are created equal. They all have to perform the same task,
    however — move the mouse pointer across the screen.


    Three types of mice are available: bus, serial, and PS/2. Bus and serial mice
    are not as popular in the PC world, as most PC makers recognized that users would
    like to use their bus and serial ports for something other than a mouse. Thus,
    most PCs use a PS/2 port mouse. The latest PCs have USB-supported mice, which
    are still rather unstable when used with Linux.


    If you are not clear on what type of mouse you have, refer to the documentation
    for your mouse to determine its connection. Again, if you cannot locate the specific
    type of mouse you own, choose one of the generic options.


