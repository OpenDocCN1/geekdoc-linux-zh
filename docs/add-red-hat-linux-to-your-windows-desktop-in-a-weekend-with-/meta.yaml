- img_proc: false
  md: 'Many Linux users use a program called Pine to get their e-mail messages. Pine
    is a console-based e-mail client that has many features and is very easy to use.
    It is, by default, configured to access only the e-mail messages on your local
    system, in a standard Unix mail format. Here''s how you can use Pine both with
    local mail and with POP mail from your Internet provider, without first using
    fetchmail or some other tool to get POP mail. Start by using multiple config files:


    ```

    pine -p localmail

    pine -p popserver

    ```


    The two configuration files specified in the last commands are identical, except
    for the mail fetching parameters. Now, configure Pine to use your POP server.
    Start Pine with the popserver argument. Next, choose Setup, Config. Set your inbox-path
    parameter similar to:


    ```

    {pop.server.com/pop3/user=myid}INBOX

    ```


    The server name and user ID you should use are provided by your Internet provider.
    Now restart Pine. You will be prompted for your password and then connected to
    the remote server from where you can now use Pine just as if you were accessing
    local mail while continuing to use the localmail configuration file for local
    mail handling.


    You may also want to host Web pages with your Linux system. Your system may be
    on a static link, with a hostname, but you may want to support multiple hostnames
    such as www.domain1.com and www.domain2.com. The next paragraphs describe how
    to make virtual hosts in Apache, a popular Web server.


    The common way to create a virtual host is to assign one IP for each hostname.
    But what if you want to host multiple hostnames on a single IP? Apache allows
    you to do so. The trick is a single command in the httpd.conf configuration file:


    ```

    NameVirtualHost 1.2.3.4

    ```'
  merge: -1
  pgno: 300
- img_proc: false
  md: 'Replace 1.2.3.4 with your real IP address to tell Apache the IP on which it
    should serve the virtual hostnames. You can add *virtual* commands for every hostname:


    ```

    <VirtualHost www.domain2.com>

    ServerAdmin webmaster@domain2.com

    DocumentRoot /home/httpd/domain2

    ServerName www.domain2.com

    </VirtualHost>

    ```


    These commands add a virtual host and specify the files that exist for that site.
    In the DNS database, the actual www.domain2.com hostname must point to your system.
    Next, update the record so that the host points to your server. You can do so
    yourself if you own the domain2.com domain name and control its name server. If
    not, ask the owner or technical representative to do it for you.


    You may also want to create a secure Apache server, by adding an encryption library
    to the Apache sources. These sources and documentation are available from the
    Apache-SSL project site, www.apache-ssl.org. The encryption library can be a bit
    complex to install, so here are a few general-purpose hints. The goal is to compile
    the encryption module into the Apache binary file. You''ll need to first uncompress
    them both in the same directory and then compile the library. With a provided
    patch, you can integrate both together. Once the compilation is done, continue
    installing the server as you would when installing a normal Apache Web server.
    Finally, you will need to create a certificate for your server. Using certificates
    is a complex topic, but you can create a temporary certificate in your Apache-ssl
    distribution until you purchase one from a company.


    # Networking Fixes


    Networking is a very old concept. In fact, many people were having e-mail discussions
    and electronic chats in 1969. We still do the same thing, but on a much larger
    scale. While networking was reserved to scientists'
  merge: -1
  pgno: 301
- img_proc: false
  md: 'and the military in 1969, anyone with a computer can now be linked. Most networking
    problems have also been fixed. In the beginning, Unix systems talked on all kinds
    of networks, including the ARPAnet, fidonet, and, of course, on UUCP networks.
    While all of these protocols—and many more—are still included with your Linux
    distribution, you will most likely be connected on a IP network, or on an UUCP
    link. This section will show you how to resolve common problems related to networking
    issues.


    # Getting E-Mail Working


    Many people use their Linux system as an e-mail server. There are two popular
    e-mail servers: Sendmail and Qmail. The one that comes with your Red Hat Linux
    distribution is Sendmail. If you read the documentation for Sendmail, it will
    suggest that you complete configuration of the entire system before building the
    sendmail.cf file, which contains the resulting configuration. This is a long and
    complex process, and needs to be done with the sources of the Sendmail package.
    Many people found it much easier to edit the sendmail.cf file itself. In most
    cases, it''s only necessary to edit the first part of the file to set your domain
    name and various information about your server.


    Another common problem occurs if you want to allow systems on your own LAN to
    send e-mail using the e-mail server for SMTP communications. You need to list
    every hostname that will use your e-mail server for outgoing mail in the file
    /etc/mail/relay-domains.


    The Qmail mail server can bring problems too. If you want to allow other hosts
    to send e-mails with your server, you will need to add the following line to the
    file /etc/hosts.allow:


    ```

    tcp-env: ip1, ip2, ip3: setenv = RELAYCLIENT

    ```


    Replace ip1, ip2,.. with hostnames or IP addresses of the systems that will send
    e-mail via your server.'
