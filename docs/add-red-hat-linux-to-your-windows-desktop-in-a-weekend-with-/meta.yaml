- img_proc: false
  md: '# Video Card


    Of all of the categories included in the HCL, the section for video cards is probably
    the most voluminous. That''s because the video (or display adapter, as it''s known
    in Windows) card could be considered the most important item in a PC, with the
    exception of the motherboard and CPU. Think about it. If nothing is displayed
    on the monitor, it''s impossible to continue using the operating system. What''s
    more, monitors don''t control the video output of the PC—graphics cards do.


    Because of this reason as well as the vast variations between cards, the HCL devotes
    a lot of space to listing different video cards. This devotion to detail is a
    bit ironic when you consider that compatibility with Linux is not the issue, the
    X Window System is.


    Linux is a text-based, command-line operating system. It''s a powerful system
    to be sure, but really just a collection of command lines much like DOS. To make
    Linux a more user-friendly system to use, Linux distributors often package a version
    of the X Window System (also known as X) with a release of Linux.


    X is the source for all the cool windows and graphical user interfaces (GUIs)
    that come with today''s Linux releases. XFree86 is the most common type of X server
    used for Intel-compatible PCs. Because XFree86 is required to display complex
    screens, XFree86, rather than Linux, is most concerned with video card compatibility.


    Look carefully though the HCL for your video card. Once found, make a note in
    your journal of which X server will be used. The X server is the specific component
    of XFree86 used to display the graphics. Since different cards use different versions
    of X server, you may find it helpful to know this information should you later
    have problems with graphic display.


    Table 1.4 displays the short list of video cards that are known to be incompatible
    with XFree86 4.0.1, the release shipped with Red Hat Linux 7.'
  merge: -1
  pgno: 49
- img_proc: false
  md: '# Memory (RAM)


    As with most operating systems and software, having at least the suggested minimum
    amount of RAM eliminates most problems. Table 1.5 lists the minimum requirements
    for RAM for various scenarios, as stated in the HCL.


    # Monitor


    As mentioned earlier, the video card performs the lion''s share of the work when
    producing the visual output from your PC. That does not mean that the monitor
    does not play a role in compatibility with Linux and XFree86. The place to make
    sure your monitor can relate well to XFree86 is not here in the pre-installation
    stage, however. Monitor compatibility is settled during the installation itself.


    ### Table 1.4 Known Incompatible Video Cards


    | Manufacturer | Product |

    |---|---|

    | SiS | 530/5591/5596/5511 Pentium PCI/ISA Solution |

    | SiS | 600/620/5600 Pentium II multi-function integrated chipsets |


    ### Table 1.5 Minimum RAM Requirements


    | RAM | Scenario |

    |---|---|

    | 16 MB | Bare minimum (will need at least 32 MB of swap disk space) |

    | 24 MB | Better performance for the Linux OS |

    | 48 MB | Recommended to run an X Window interface such as Gnome or KDE |'
  merge: -1
  pgno: 50
- img_proc: false
  md: 'To be sure that you are ready for installation, note in your journal the settings
    for your monitor''s synchronization rates. These are usually found in the manual
    that came with your monitor. During installation, those settings will be matched
    to the X server component of XFree86.


    > **NOTE**


    For more information on monitor compatibility, visit the FAQ section of the XFree86
    Web site at http://www.xfree.org/FAQ/#MONITORS.


    # Hard Drive


    Two types of hard drives are used in PCs: IDE and SCSI. If you haven''t already,
    you can identify the type you have by examining your system BIOS (see the section
    titled "Checking Your BIOS for Information" you read earlier today). Most hard
    drives are compatible with Red Hat Linux 7.


    Generally, if you have an internal IDE drive, you''re okay by Red Hat Linux. Because
    Linux looks at the drive''s SCSI controller, the same holds true for any SCSI
    drive, either internal or external. If the controller is supported, then all of
    the drives connected to it are supported by default.


    > **TIP**


    External IDE drives, such as Syquest''s removable drives, are the one incompatible
    type of drive mentioned in the HCL, but there is a workaround. Surf to the Linux
    Parallel Port Home Page (http://www.torque.net/linux-pp.html) to learn how to
    use this device.


    # Ethernet Card


    During the installation of Red Hat Linux, the presence of a network card is typically
    detected. Linux will then ask you for your network settings. This section of the
    HCL reveals that many cards fall into Tier 1 and Tier 2 compatibility categories.'
  merge: -1
  pgno: 51
- img_proc: false
  md: 'Given the history of Linux and its grandparent UNIX, this makes sense. After
    all, UNIX was initially designed to work on networks. Therefore, it''s logical
    that network devices are largely compatible. Further, the communications protocols
    of the Internet are based on UNIX.


    You should make sure your card is listed and find out where it falls in the compatibility
    tiers. Most of the big name cards fall into Tier 1, which is good. There are even
    Token Ring cards that have Tier 2 compatibility—very useful in today''s mix-and-match
    corporate environments.


    Table 1.6 lists the Ethernet cards that are known to be incompatible with Red
    Hat Linux 7.


    > **TIP** While Xircom cards are listed as incompatible, there are workarounds
    to be found. Try the Xircom Ethernet Issues page at http://pcmcia.sourceforge.org/cgi-bin/HyperNews/get/pcmcia/xircom.html.


    # Sound Card


    Of all of the devices people will likely add to or upgrade on their computer,
    the sound card is likely to be near, or at, the top of the list. Sound cards,
    even in the Windows environment, can be difficult to install and configure. Maybe
    that''s why the HCL lists no sound cards in the Tier 1 category.


    **TABLE 1.6 KNOWN INCOMPATIBLE ETHERNET CARDS**


    | Manufacturer | Product |

    |---|---|

    | Intel | EtherExpress Pro/10 PCI |

    | Xircom | Ethernet adapters |'
  merge: -1
  pgno: 52
- img_proc: false
  md: 'Note that even if you have a compatible sound card, you will probably have
    to set it up through the sndconfig program before Red Hat Linux can use it. More
    information on sound cards can be found when you read "Configuring Printers, Sound,
    and Other Devices" on Saturday evening.


    # CD-ROM and DVD-ROM


    Since hard drives were easy for Red Hat to utilize, you might think CD-ROMs would
    be equally as accessible. However, Red Hat is fussier about what CD-ROMs it will
    and will not use.


    On the one hand, all 100 percent ATAPI-compliant CD-ROMs and SCSI CD-ROMs are
    Tier 1 compatible. Deviations from this can get a little tricky. This is one section
    you will want to review carefully.


    Unfortunately, DVD players are not yet supported on Red Hat systems. While progress
    is being made, you''re just going to have to watch your favorite video some other
    way.


    > **NOTE** Your DVD drive is not completely useless. Red Hat Linux will still
    be able to use it as an extra CD-ROM drive.


    Table 1.7 lists the CD-ROMs that are known to be incompatible with Red Hat Linux
    7.


    **Table 1.7 Known Incompatible CD-ROMs**


    | Manufacturer | Product | Notes |

    |---|---|---|

    | Varied | Parallel-port CD-ROMs | Some BackPacks are Tier 3 |

    | LMS/Phillips | drive 206/cm260 | Includes all clones |

    | Liteon | All models | |'
  merge: -1
  pgno: 53
- img_proc: false
  md: '# Zip/Jaz Drive


    It''s not immediately obvious where to find Zip drives compatibility listings
    in the HCL. You''ll need to look in Section 3.5, "SCSI Drives." Once you find
    the listing, however, you''ll discover that external Zip and Jaz drives will work,
    including parallel port Zip drives.


    # Tape Drive


    Most SCSI tape drives are likely to be Tier 2 supported. Remember that if the
    SCSI controller is supported, then any SCSI device attached to it will be supported
    as well. There is an exception to this rule in this very device class, which is
    listed in Table 1.8.


    # Modem


    Your modem is the device this is likely to give you the most trouble. Simply put,
    if your computer has an internal modem, it probably won''t work. This is because
    most internal modems use Windows-specific drivers and won''t work in other operating
    systems.


    > At this time, one internal modem that will work for sure under Red Hat: the
    LucentVenus PCI modem. If you are lucky enough to have this internal modem, return
    to the Modem section of the HCL after you have installed Red Hat to learn how
    to tweak your system to use the device. To find more internal modems compatible
    with Linux, surf to http://www.o2.net/~gromitkc/winmodem.html.


    # TABLE 1.8 KNOWN INCOMPATIBLE TAPE DRIVES


    | Manufacturer | Product | Notes |

    |---|---|---|

    | Varied | Non ATAPI parallel-port drives | |

    | Onstream | 30 GB drive | Includes *all* types (IDE, SCSI, and parallel) |'
  merge: -1
  pgno: 54
- img_proc: false
  md: 'The good news is that if you have an external modem, it will almost surely
    work. Modems that talk to the PC through a serial port rather than internally
    do not need Windows drivers to work.


    Other types of external communications devices work under Red Hat Linux as well.
    ISDN routers, if they are external and can emulate a modem, will usually work,
    although Linux does classify them as Tier 3.


    If you are lucky enough to live in an area of the nation that has cable Internet
    access, then you may have a cable modem. Cable modems that connect to a supported
    Ethernet interface are Tier 3 supported.


    # Printer


    Setting up a printer in Red Hat Linux has a Windows-like feel to it. Basically,
    Red Hat Linux does not care what type of printer you have at installation. Setting
    up your printer is something you will do after installation (see the "Printers"
    section on Saturday evening).


    The HCL has a good list of the printer filters contained within this version of
    Red Hat. These filters are directly analogous to the Windows printer drivers.
    Check the list to see if your printer is there, but don''t worry if it isn''t.
    There will be ways of getting the printer installed even if it is not on the compatibility
    list.


    # Mouse


    The second thing Linux configures during its installation is the mouse. There
    are four types of mice: PS/2, serial, bus, and USB. The most common types are
    the PS/2 and serial mice, which are Tier 1 compatible. Bus mice fall into the
    Tier 2 category, and USB mice are classified as Tier 3.


    Since your mouse will very likely fall into either a Tier 1 or Tier 2 category,
    this device doesn''t require much concern. If you have a USB mouse, however, you
    should be aware that Linux is still in the experimental stages where USB is concerned.
    You might want to consider getting a new mouse type for your PC.'
  merge: -1
  pgno: 55
- img_proc: false
  md: '> For more information on USB devices in Linux, visit http://www.linux-usb.org/.


    # Keyboard


    No keyboard section exists in the HCL. Keyboards are universal to PCs (if any
    device can truly be called *universal*). Keyboards have long been held to the
    ANSI standard, which is an international set of standards to which all keyboards
    have to adhere. (Yes, someone actually sat down and thought this out.) This standard
    has used a specific code for every character the keyboard can create, no matter
    what operating system is being used.


    This standard makes it very easy for Linux to access any keyboard, including the
    new natural keyboards and those keyboards with pointing devices contained within.
    USB keyboards, like their mice counterparts, should be utilized with caution.


    # Notebook Computers


    A laptop or notebook computer is no more a single device any more than your desktop
    PC is. There is no one notebook PC that is compatible with Linux as a whole.


    A section for notebook computers is included in the HCL, but it is a bit different,
    containing a great link to the Linux Laptop Web pages. You should follow this
    link if you are thinking about installing Linux on your laptop PC.


    > I also recommend you pick up a copy of *Linux for Your Laptop* (Prima, 2000)
    by my good friend Bill Ball. It contains a lot of valuable information on how
    to get Linux on your notebook computer, including a step-by-step guide to installing
    Red Hat Linux on a laptop.'
  merge: -1
