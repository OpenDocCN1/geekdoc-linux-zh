    # # INTRODUCTION


    Many people think of Linux as an operating system that is way over their heads,
    that only techies can use this strange, arcane OS. It would be nice to use an
    operating system that didn''t crash all of the time for no apparent reason, but
    I don''t have a degree in computer science.


    For all of you who''ve had these thoughts, this book is here to tell you that
    this is simply not the case. Linux—and Red Hat Linux in particular—have become
    very easy for everyday users to install and use.


    Now you can find out for yourself, in just one weekend, how easy it is to get
    started using Red Hat Linux 7 and discover that there is life outside the Windows.


    # ## Is This Book for You?


    Add Red Hat Linux 7 to Your Windows Desktop In a Weekend is for anyone who wants
    to get started using Red Hat Linux, and only has one computer at their home or
    business on which to install this new operating system. Think of this book as
    a personal tutorial, a one-on-one class with a Linux expert. You get to stay in
    the comfort of your own home (or office, if need be) and learn how to:'
  merge: -1
  pgno: 21
- img_proc: false
  md: '![](bbox=[0.0, 0.0, 1.0, 0.25])


    +   - Use Linux as a sole operating system or have it happily co-exist with Windows

    - Gather information about your system to assess your system''s capability to
    use Red Hat Linux

    - Make room for Red Hat Linux and Windows to work on your PC

    - Install the Red Hat Linux operating system

    - Deal with any unusual installation issues

    - Configure your PC to boot to Linux and Windows

    - Examine the Gnome and KDE interfaces

    - Configure X Window to work with your system

    - Create a customized desktop

    - Explore the Linux filesystem

    - Create an Internet account

    - Add a printer to your PC

    - Add additional hardware to your PC

    - Install software using RPM packages

    - Install software using archived setup files

    - Explore some of the essential tools packaged with Red Hat Linux 7

    - Examine and configure Netscape Communicator to browse the Internet, read your
    e-mail, and read newsgroup messages'
