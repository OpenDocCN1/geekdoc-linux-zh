  md: '# How Much Time Will This Take?


    This book is organized in sessions from Friday evening to Sunday evening. Each
    session lasts about three to four hours. The Sunday evening session is a troubleshooting
    session, which means that if all goes well with your installation, you should
    not need to use it. If you have the time, you really can cover this entire book
    in a weekend.


    If you don''t have the time, however, you don''t need to limit yourself to a single
    weekend. The flexible design of this book permits you to spread the information
    presented over a week, a couple of weekends, or even a month. You can do each
    of the sessions on a separate night, or split the sessions over a few days. Tailor
    the book to your schedule and preferred learning pace, and you''re sure to be
    successful.


    Some sessions, such as "Using Some Popular Linux Applications," may not interest
    you at this time. Feel free to skip these for now, knowing that at any time in
    the future you can spend just a few hours learning them. However, I do recommend
    that you read the introduction to the sessions you decide not to complete right
    away.


    # What''s Covered in This Book?


    Though it may seem an insurmountable goal to finish a full-fledged Linux installation
    in a weekend, you will find that after breaking it up into more manageable tasks,
    the goal is indeed very attainable.


    +   - **Friday Evening: Getting the PC Ready** helps you through the most critical
    step of installing Red Hat Linux 7—getting a solid inventory of your PC system.
    Once you obtain this knowledge,'
  merge: -1
  pgno: 23
- img_proc: false
  md: 'you''ll be able to determine exactly how to install Red Hat Linux, since you
    will be able to check for any potential hardware trouble spots before the actual
    installation. You''ll also learn how to back up any data on your current system
    and how to make room on your hard drive for the Linux operating system.


    +   - **Saturday Morning: Installing Red Hat Linux** 7 will walk you through the
    steps you will need to take to get Red Hat Linux onto your computer with a minimum
    of fuss. Should you run into any difficulties, you''ll find out how to deal with
    those as well. This session will also explain how Linux should automatically configure
    your system to boot either Linux or Windows.


    +   - **Saturday Afternoon: Initial Configuration Issues** takes you through the
    tasks you will want to complete just after installation. This includes getting
    a look at the two desktop environments that come with Red Hat Linux, Gnome and
    KDE and performing some basic configuration changes in these interfaces. You will
    also discover how to get into the guts of the graphical interface and change everything
    from the screen display size to the color of the buttons on the screen.


    +   - **Saturday Evening: Playing Well with Others** will show you how to get
    your PC sharing information with other computers and devices, starting with the
    biggest computer network of them all, the Internet. After your Internet and network
    connectivity is established, you''ll learn how to connect your PC to printers
    and properly configure the sound card on your PC if it did not work after installation.


    +   - **Sunday Morning: Adding On to Your Linux System** explains how to get more
    stuff onto your computer. Whether its new software or new hardware, you''ll learn
    how easy it is to get all the cool toys working on your Red Hat Linux PC.


    +   - **Sunday Afternoon: Using Some Popular Linux Applications** will start teaching
    you how to use some of this cool stuff that came'
  merge: -1
  pgno: 24
- img_proc: false
  md: 'with Linux, including Netscape Communicator, a full-featured Web browser and
    communications application. You will also explore an application you installed
    in the Sunday Morning session: StarOffice 5.2 for Linux.


    +   - **Sunday Evening: Clean Up Any Messes** that may have occurred during the
    installation and configuration of Red Hat Linux 7. Though rare, mistakes do slip
    in once and a while, and this session will show you how to address some specific
    problems. It will also tell you where to go to find more help should the need
    arise.


    To help you on your way with Red Hat Linux, this book provides some reference
    material in the appendixes for you to use.


    +   - **Appendix A: The Linux Primer** will guide new Linux users through some
    of the basics of the Linux OS.

    - **Appendix B: Online Resources** will point you towards the most up-to-date
    Red Hat and general Linux resources on the Internet.

    - **Appendix C: Hardware Compatibility Journal** provides a journal for you to
    track the hardware on your PC.


    # ## What Do You Need to Begin?


    There''s not a lot you need to start using Red Hat Linux: just the software and
    an Intel-based PC. It does not even have to be a new PC. Linux works well on older
    model PCs, and has much better performance on older PCs than Windows.


    With each new version of Red Hat Linux, Red Hat sells a box containing CD-ROMs
    and printed manuals for around $45. The same files that appear on the CD-ROM are
    also made available on Red Hat''s public FTP server (ftp://ftp.redhat.com) for
    free. Anyone with a fast Internet connection (like a cable modem or DSL line)
    and a "writeable" CD-ROM drive can download the whole package and create their
    own CD-ROM. The only cost is that of the blank CD.'
  merge: -1
