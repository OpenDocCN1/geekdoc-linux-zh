  md: 'If your `/etc/fstab` file is set up correctly, you can save typing. You only
    have to tell the `mount` command what device to mount; it tries to assume the
    rest by reading `/etc/fstab`. So to mount your floppy, usually all you really
    need to type is this:


    ```

    mount /dev/fd0

    ```


    Unlike Windows, Linux does not assign drive letters to devices. Devices become
    part of the filesystem when mounted. Although this probably seems foreign to you
    at first, it actually tends to make more sense. For one thing, you''re not limited
    to 26 devices on your system! Okay, you probably won''t hit this limit at home,
    but it is a real concern in a networked environment.


    # Unmounting Filesystems


    > **NOTE** When I first started using Red Hat, I kept trying to unmount CD-ROMs
    and floppies using `unmount` instead of `umount`. It''s a common mistake. I eventually
    started remembering that it was `umount` instead of `unmount`, but you don''t
    have to. If you want to type a more logical command, go to the `/bin` directory
    and make a symbolic link to `umount` called `unmount`, like this: `ln -s umount
    unmount`. Then the system finds a command called `unmount` after all. The `-s`
    provides a symbolic link to the command `umount`, thus providing for those who
    think `unmount` is more logical.


    **Name:** `umount`


    **Function:** To unmount a device attached to the filesystem.


    **Syntax:** `umount [options] directory`


    **Description:** The `umount` command unmounts a mounted device. You probably
    only need to use `umount` on devices such as your CD-ROM drive or floppy drive,
    though it can also be used to unmount any device on the system that is not currently
    being used. It is the opposite of the `mount` command.'
