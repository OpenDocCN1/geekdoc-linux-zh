  md: '# Gathering Information about Your System


    How well do you really know your PC? *Really* know it? Are you just passing acquaintances
    or do you know it down to its very soul (or at least the PIN settings on your
    sound card)? To find out just how well Linux will run on your PC, you need to
    know the workings of your machine fairly well.


    If you''re like most people, you may know the superficial information, like: "17-inch
    monitor, CD-ROM, floppy drive, printer, internal modem . . ." that sort of thing.
    To get a proper idea of compatibility with Red Hat Linux 7, you will need to dig
    a little deeper. For some, this can be the most intimidating part of the installation
    procedure. So it''s a good thing we''re getting this done this evening, right?


    Actually, it''s not so bad. For one thing, you will not have to open your CPU.
    In fact, I strongly recommend against this, since really bad things could happen.
    Even Windows has an application that enables you to see into the inner mechanics
    of your PC without cracking it open.


    # Checking Your Device Manager in Windows


    As you begin examining your computer, first notice that a lot of the information
    you need to know is right there in front of you. Your monitor, for instance, is
    sitting on your table or desk with its brand name and model displayed on the front
    or back. Likely the same is true for your printer and any other external devices
    you might have. You''ll want to take note of both the brand name and model as
    they appear on the device.


    In addition to identifying external devices, you''ll need to determine what''s
    actually inside your computer. One place to start is by displaying a list of devices
    as identified by your existing operating system. Windows 95, 98, and 2000 use
    a built-in applet called the Device Manager to list known devices. In Windows
    NT, perhaps the best, most centralized place to view installed devices is the
    Windows NT Diagnostics applet, located in the Administrative Tools menu.'
  merge: -1
  pgno: 33
- img_proc: false
  md: 'In Windows 95 and 98, open the Device Manager by clicking the Start button
    on the Windows taskbar, then choose Settings, Control Panel. When the Control
    Panel window appears, double-click the System icon to open the System Properties
    dialog box, shown in Figure 1.1.


    Click the Device Manager tab to list the inner workings of your computer, as seen
    in Figure 1.2.


    Now you need to do some old-fashioned detective footwork. Your computer may (or
    may not) actually use a device for each of the device types listed in the Device
    Manager. For example, to determine whether you have a CD-ROM drive installed in
    your computer and to list its brand, first expand the CD-ROM list by clicking
    its expansion control (the little plus sign in a box) shown in Figure 1.3.


    As you can see in Figure 1.3, this computer has one CD-ROM drive, with a rather
    cryptic label. To find out more about a device, select it, then click the Properties
    button. (Alternatively, double-click the selected device.) For example, click
    the listed CD-ROM device, then click Properties. The Properties dialog box for
    the CD-ROM drive appears (see Figure 1.4).


