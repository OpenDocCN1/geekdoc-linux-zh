  md: '# SATURDAY AFTERNOON Initial Configuration Issues


    In 1986, an international consortium of UNIX programmers began putting together
    a graphical operating system, based on the GUI research done by the Xerox Palo
    Alto Research Center. Thus was X born.


    After Linux was introduced in 1991, it was not long before X found its way to
    the Linux desktop. When Linux began appearing on Intel-based PCs, a new version
    of X, XFree86, helped make the transition.


    XFree86 is the heart of any GUI that runs on Red Hat Linux. Also referred to as
    the X server, XFree86 is where video output and PC input comes together to form
    one cohesive interface. PC input is obtained from the two basic input devices:
    the keyboard and the mouse. Then video output is sent through the graphics card
    to the monitor.


    While this sounds like the entirety of the GUI, it''s not. That''s because the
    X server is only a network-transparent display layer that provides the "home"
    for GUI to operate.


    To generate the actual windows and menus that make up a traditional GUI, you need
    a window manager running on the X server display layer.


    > **Window manager**: The application that gives X server its "look" and determines
    how graphical applications will be displayed.


    Several windows managers come with Red Hat Linux: AfterStep, AnotherLevel, Enlightenment,
    fvwm, fvwm95, KWM, olwm, Sawfish, and tvm, to name a few. The two big ones you''ll
    need to work with in Red Hat 7 are Gnome and KDE.


    KDE—the K Desktop Environment—is an award-winning environment that is packaged
    with Red Hat Linux 7. Often referred to as a window manager, in fact it is not.
    KDE usually runs over a window manager called KWM (K Window Manager). As KWM enhances
    the look and feel of XFree86, so KDE enhances the look and toolsets of KWM.'
  merge: -1
  pgno: 122
- img_proc: false
  md: 'A similar relationship exists when running the Gnome (GNU Network Object Model
