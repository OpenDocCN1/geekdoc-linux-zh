  md: '# # ABOUT THE AUTHOR


    **BRIAN PROFFITT** is the author of several Linux books, such as *Install Configure
    and Customize Red Hat 7* (Prima, 2000), *Sun StarOffice for Linux* (Prima, 2000),
    and *WordPerfect Office 2000 Fast & Easy* (Prima, 2000).


    Brian loves being a dad and husband and in his very limited spare time, Brian
    does some swooping of his own as a soloing student pilot, trying to get his private
    pilot''s license before it starts snowing. Which in Indiana means October.


