  md: '# Defining Helper Applications


    Helper applications are those used by Netscape to display or otherwise use certain
    file types you may find on the Internet. There are basically two types of helper
    applications: plug-ins, which are essentially mini-applications that work seamlessly
    with Netscape to open or display a file, and true third-party applications started
    by Netscape when a particular file type is encountered.


    The next steps demonstrate how to add third-party applications to Netscape Navigator,
    in this case the StarOffice application for reading WordPerfect files.


    +   1. In Netscape, choose Edit, Preferences to open the Preferences dialog box.

    2. Click the expansion icon next to the Navigator listing.

    3. Click the Applications listing. The Applications window will appear.

    4. Scroll to the WordPerfect description and select it.

    5. Click Edit. The Application dialog box will open.

    6. Click the Application option and then click the Choose button. The File Browser
    dialog box will appear.

    7. Navigate to the StarOffice application file and click OK.

    8. Click OK to close the Preferences dialog box.


    > **TIP** You can also configure StarOffice to open any file from Microsoft Office''s
    Word, Excel, and PowerPoint applications.


