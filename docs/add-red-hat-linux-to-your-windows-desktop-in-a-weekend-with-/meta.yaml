    # Making Room for Multiple Operating Systems


    Now comes the time where you have an important decision to make. Like all important
    decisions, you should weigh your options carefully. You must now decide whether
    you are going to run Red Hat Linux alone on your PC or whether you want to retain
    your existing operating system and add Linux.


    There are several pros and cons for using multiple operating systems on one computer.
    The cons include the headaches of installing two or more operating systems on
    a machine, resulting in less memory available for each of the operating systems.


    Nevertheless, the benefits of using multiple operating systems are huge. For instance,
    you will have the ability to run all of the programs available for each of the
    operating systems you''ll have on your PC. You will also be able to use all of
    the hardware your PC has. Finally, you''ll save money by not needing to buy another
    PC.


    I recommend that dual booting is the way you should go—especially if you are just
    trying out Linux. This option gives you the benefits of using Linux without a
    lot of investment in time or money.


    If you decide to include Linux on your PC in addition to Windows, you will need
    to make room for it on your hard drive. But making room on your hard drive for
    Red Hat Linux is a far different operation than making room for the latest computer
    game. You will need to create a brand new *partition* from which Linux will operate.


    At this point in the evening, you get a crash course in disk partitions and why
    you can''t write data to a disk without them, so hang on to your collective hats.'
  merge: -1
  pgno: 63
- img_proc: false
  md: '# Why Partition?


    Imagine the bee, buzzing around your garden. If you were to follow this bee back
    to its home, you would find a seemingly chaotic mass of buzzing insects, each
    looking as if they aimlessly wander about with nothing better to do than hang
    out and buzz.


    As we all know, however, all bees have a specific mission in life: working together
    for the collective benefit of the hive. One group of bees has the job of taking
    care of all of the cute little baby bees after the queen lays her eggs. Now, think
    back to your science classes: where are the baby bees raised?


    If you said the honeycomb, you''re right. If you''re wondering what the heck this
    has to do with partitions, hang on.


    The honeycomb is an ingenious device composed of hexagonal cells made of beeswax,
    where honey and bee larvae are stored for safekeeping. Now, ponder this: how would
    the bees get by if they did not have honeycombs? The answer is they wouldn''t.


    Keeping the honeycombs in mind, you can apply this analogy to how data is stored
    on a disk drive. Data, you see, cannot be stored on a drive without some sort
    of structure already in place for the data to be organized.


    When data is placed on a drive, it is written into this structure, called a file
    system in the Linux community. A file system is the format in which data is stored—a
    honeycomb of cells if you will, where each little piece of data is placed.


    Computers being computers, it''s a little more complicated than that. Data for
    a single file, for example, does not get stored in data blocks that sit right
    next to each other. The data may be stored in data blocks 456, 457, and 458 and
    then block 6,134, then block 7,111, and so on. (This is an oversimplification,
    but you get the idea.) It''s the job of the file system to track where every file
    resides so that when you send a command to work with a file, the file system knows
    all of the separate blocks where the file is stored.'
  merge: -1
  pgno: 64
- img_proc: false
  md: 'Because of all of this file tracking and retrieving, computer engineers came
    up with idea of keeping the file systems small, even on large hard drives. At
    that point, the idea of partitions came into play. Basically, the partition is
    a virtual barrier that tells the file system: "You used to be able to write to
    blocks 1-25000 all over the disk, but now you''re only allowed to write to blocks
    1-17500. A second file system will write to blocks 17501-25000, so hands off!"


    Thus, you have partitions. Each partition can use a different file system. As
    an analogy, honeycombs created by honeybees are different from those created by
    wasps—similar structure but different outcomes.


    There are six major types of file systems used on Intel-compatible PCs today,
    as seen in Table 1.9.


    > **Swap partition:** A section of space on a hard drive used by the computer
    as auxiliary RAM. When a program or process uses more memory than RAM exists on
    the computer, the swap partition provides additional memory for the process to
    use.


    ### Table 1.9 File System Types (Intel PCs)


    | File System | Used By |

    |---|---|

    | FAT | Windows 95, Windows 98, Windows NT |

    | FAT32 | Windows 95b, Windows 98, Windows ME, Windows NT, Windows 2000 |

    | NTFS | Windows NT, Windows 2000 |

    | ext2 | Linux |

    | os2 | OS/2 |

    | swap | All operating systems |'
  merge: -1
  pgno: 65
- img_proc: false
  md: 'Different types of partitions typically do not work with other operating systems.
    Thus, in order to install Linux on your PC, you will need to create an ext2 partition
    on your hard drive. Unfortunately, if your PC contains a typical installation
    of Windows, your Windows file system is contained within one big partition that
    covers your entire hard drive. This leaves no room for a partition and a new file
    system. Remember, even if you have gigabytes of empty space on your drive, this
    space, like files and directories, may be scattered throughout the drive.


    The easiest method to add a partition to your existing hard drive file system
    is to use a third-party application. This shoves all of your data into a single
    collection of data blocks, leaving truly contiguous empty and unstructured (unformatted)
    space elsewhere in the drive where you can install a partition.


    > CAUTION: Before you use any tool to manipulate and/or create partitions, back
    up or save your data to an alternate physical drive.


    # PartitionMagic 5.0


    Of all of the partitioning software out on the market today, PartitionMagic is
    arguably the easiest to use and certainly the most time-tested. PartitionMagic
    enables you to create partitions on your hard drives with ease. It even comes
    with BootMagic, a multi-operating system boot utility.


    What makes PartitionMagic so great to use is that it will actually create a Linux
    ext2 partition without potential loss of data. Using PartitionMagic to create
    a native Linux partition saves you a lot of steps in installation.


    For more information on PartitionMagic, surf to **http://www.powerquest.com/partitionmagic**.
    There you will find detailed product information. I heartily recommend this product
    for your use.'
  merge: -1
  pgno: 66
- img_proc: false
  md: 'If you run a search for "linux" on the PartitionMagic Web site, you will find
    detailed instructions on how to specifically install Linux partitions and mount
    points. You will learn about mounts points tomorrow morning when you actually
    install Red Hat Linux.


    # fips


    If you do not want to plunk down the cash for PartitionMagic, never fear. Red
    Hat Linux has thoughtfully provided fips, a utility that can resize and create
    FAT (either FAT16 or FAT32) partitions in Windows systems.


    The fips utility will reduce the size of your current FAT partition and create
    a new FAT partition. You''ll then need to delete the new FAT partition. Because
    Linux will only sit inside an ext2 file system, created only from unformatted
    space during the installation process, you''ll need to run the DOS fdisk utility
    to remove the new FAT partition.


    The fips utility is located in the \\dosutils directory on the Red Hat Linux/Intel
    CD 1. Documentation for fips is located in the \\dosutils\\fipsdocs directory
    on the same CD. I strongly agree with Red Hat that you read the fips documentation
    before using the application.


    # When to Use fdisk


    You may have heard somewhere out in computer legends and lore that eventually
    you will have to use the DOS utility fdisk on your PC. The fdisk utility is used
    when you have to completely wipe the data from your hard drive.


    This section is referring to the DOS fdisk utility, not the Linux version of fdisk,
    which sometimes has trouble with Windows partitions.'
  merge: -1
  pgno: 67
- img_proc: false
  md: '> All kidding aside, be very careful when you use fdisk. One wrong move and
    you will lose all of your data.


    For the purposes of Linux installation, there are really two instances where you
    will need to use fdisk. The first instance is if you plan to install Red Hat Linux
    by itself on the PC. The fdisk utility is the preferred method to use should you
    want to completely wipe the hard drive clean and install Linux.


    The second opportunity to use fdisk is to eliminate any partitions a third-party
    partitioning utility might have created for you (such as fips). The fdisk utility
    can wipe these non-ext2 partitions off the hard drive.


    Here''s how to use fdisk to remove partitions on your hard drive.


    +   1. Using Windows Explorer, format a floppy disk. Make sure the Create System
    Disk option is checked.

    2. Copy the fdisk.exe file from the \Windows\Commands folder to the floppy disk.

    3. Reboot your computer, leaving the floppy disk in the drive. The floppy disk
    is bootable because you copied the system files to it.

    4. When the DOS prompt appears, type fdisk, then press Enter. A message regarding
    large disk drives will appear (see Figure 1.18).

    5. Enter N so that large drive support is not enabled.

    6. In the FDISK Options screen (see Figure 1.19), type 3 to start the Delete Partition
    or Logical DOS Drive option.

    7. In the Delete DOS Partition or Logical DOS Drive screen (see Figure 1.20),
    type 1 to activate the Delete Primary DOS Partition option.

    8. In the Delete Primary DOS Partition screen, type the number that identifies
    the partition you want to delete (see Figure 1.21). Refer to the disk size listings
    and file system types to help you identify which partition number you want to
    remove, if there is more than one.'
