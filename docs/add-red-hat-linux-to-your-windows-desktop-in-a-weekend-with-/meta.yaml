  md: '# Functions and Permissions


    There are hundreds of distinct Linux commands that you could learn. Most of the
    time, however, you won''t use more than a score of those commands. Some of the
    more common commands you will need to know are included in this section. Appendix
    A, “The Linux Primer,” lists these functions in even detail.


    This section also includes some of the most common switches used to modify these
    commands. Switches follow the command and are preceded by a dash (-) symbol. These
    switches can be combined behind one dash (as in, ls -1R). There are many switches
    available for these commands, but the ones included are just those that are most
    commonly used.


    +   - ls. The list command is probably the most used command. It corresponds to
    the DIR command in DOS. It lists the files, links, and subdirectories in the current
    directory. Used without switches, ls displays a list of files in the current directory
    using a short format.

    - -l. The -l switch (short for long) is probably the most often used switch. It
    displays detailed information about each file in a long format. The output from
    this command is important because Linux uses much of this same information to
    determine how it treats the files. For example, using the command ~$ ls -l returns
    a list of files similar to:


    ```

    ~$ ls -l


    总用量 47


    -rw-r--r-- 1 root    root    1560 12月 10 14:12 Application_Notes

    -rw-r--r-- 1 root    root     911 12月 10 14:12 Daemon_Notes

    drwxr-xr-x 5 guest   guest    1024 11月 11 09:09 Desktop

    -rw-r--r-- 1 root    root    2253 12月 10 14:12 Disk_Notes.txt

    -rw-r--r-- 1 root    root    1104 12月 10 14:12 Hardware.Specs

    -rw-r--r-- 1 root    root     477 12月 10 14:12 Initialization_Scripts

    -rw-r--r-- 1 root    root   33792 12月 10 14:12 Master ICC TOC.sdw

    -rwxr-xr-x 1 root    root     573 12月 10 14:12 StarOffice

    -rw-r--r-- 1 root    root     149 12月 10 14:12 Startup-files

    -rw-r--r-- 1 root    root     773 12月 10 14:10 notes.txt

    ```'
  merge: -1
