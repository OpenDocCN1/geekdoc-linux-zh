    2. In the Mount Point field, type /boot.

    3. In the Size (Megs) field, type 16 (16MB is the recommended size for the boot
    partition on an Intel-compatible PC).

    4. Confirm that the Partition Type is Linux native.

    5. Select the hard drive where you want to place the boot partition (refer to
    last night''s Table 1-12 to make sure the selected drive is acceptable).

    6. Click OK. The Add dialog box will close.


    Now create the swap partition:


    +   1. Click the Add button again so that you can create the swap partition. The
    Add dialog box will appear.

    2. Leave the Mount Point field blank.

    3. In the Size (Megs) field, type 94.


    > **TIP** The value of the swap disk should be at least the number of MB of RAM
    memory you have on your PC. In this example, 94MB of RAM suggests a 94MB swap
    disk size.


    +   4. Click the Partition Type list control and select Linux swap.

    5. Select the hard drive where you want to place the swap partition.

    6. Click OK. The Add dialog box will close.


    Finally, create the root (/) partition:


    +   1. Click the Add button again to create the root partition. The Add dialog
    box will appear.

    2. In the Mount Point field, type /.

    3. Leave the Size (Megs) field setting as 1 MB.'
