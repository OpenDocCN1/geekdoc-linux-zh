    # Configuring LILO


    Since you plan to use more than one operating system on your Red Hat Linux PC,
    you will need to make sure the Linux Loader (LILO) is installed in the correct
    location. If it isn''t, you may run into trouble.


    # Dual Booting Explained


    When a system with a single operating system boots, the BIOS looks at a special
    section of the hard drive called the master boot record (MBR or *boot sector*)
    to see what operating system will be loaded.


    When a system has two or more operating systems, a special multi-boot application
    must reside in the boot sector that temporarily halts the boot process and allows
    the user to choose which operating system to load. LILO is just such a program.


    # How to Dual Boot with Windows 95/98


    To configure LILO to run Linux and another operating system, you will need to
    use the Custom installation path. However, if you are installing Linux on a system
    preconfigured with Windows 95 or 98, you can just'
  merge: -1
  pgno: 105
- img_proc: false
  md: '![](bbox=[0.05, 0.17, 0.65, 0.41])


    run the Workstation installation path. The default LILO settings provide all you
    need to run both operating systems.


    LILO is then installed in the MBR and the Linux boot sector is given the default
    priority to load. You can change these settings later from within Linux using
    a utility called linuxconf; for now use the Workstation settings.


    # How to Dual Boot with Windows NT


    Quite simply, the easiest way to get Linux and Windows NT to work together is
    to install NT first on your machine (which is a likely scenario for anyone reading
    this book). Then, when you install Linux, make LILO boot to the Master Boot Record
    (MBR). Finally, edit your /etc/lilo.conf file and add an “nt” option that points
    to the device NT resides on (for example, /dev/hda1).


    If you want to run Linux with Windows NT or Windows 2000 installed later, you
    will need to take some special steps during the installation.


    The most important thing to remember is that you *must* run the Custom installation
    path, for it is the only method that enables you to configure LILO to meet your
    needs.


    Basically, the problem is this: the Windows NT OS Loader does not recognize Linux
    as a valid operating system (imagine that) because Linux'
  merge: -1
  pgno: 106
- img_proc: false
  md: 'does not produce the type of file the NT OS Loader needs to read before starting
    an operating system. In addition, the NT OS Loader will not function from anywhere
    other than the boot sector. Since only one boot loader can be in the boot sector
    at a time, you will have a problem if LILO sits in the MBR.


    The Custom install path gives you access to the LILO Configuration screen from
    where you can elect to have LILO either installed on the MBR (the default setting)
    or on the first sector of the Linux boot partition.


    If you select the latter option, there will be no conflict between LILO and the
    NT OS Loader. Unfortunately, the NT OS Loader will still not see Linux and it
    won''t present Linux as a boot choice. Now comes the chicanery.


    There is a way to create a file in Linux that the NT OS Loader *can* use to boot
    Linux, but creating it takes a bit of time. I recommend that you obtain a little
    third-party program called Bootpart, which is available at http://www.winimage.com/bootpart.htm.
    This program will quickly create the Linux boot file for NT OS Loader and place
    it where NT OS Loader can use it. I highly recommend this application if you plan
    to use either Windows NT or Windows 2000 with Linux.


    For more information about configuring Windows NT and Linux, read the mini-HOWTO
    document at http://www.linuxdoc.org/HOWTO/mini/Linux+NT-Loader.html.


