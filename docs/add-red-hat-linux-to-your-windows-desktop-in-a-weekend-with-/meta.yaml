- img_proc: false
  md: 'Now that you''ve successfully installed Linux on your computer, it''s time
    to log on to your system and get familiar with working in Linux. You''re probably
    already familiar with using a GUI, and you can find your way around unfamiliar
    GUIs such as KDE or GNOME pretty easily. After all, you just experiment with pointing
    and clicking on icons or menus until you find one that does what you want. With
    a command-line interface (CLI), however, you might have a little more trouble
    getting around if you don''t know what''s going on.


    # Getting Started: The Login Prompt


    When you start your computer, and Linux has finished booting, you get a prompt
    to log in that looks something like this:

    Welcome to Linux 2.4.0.

    Odin Login:


    The name in front of Login is the name you''ve given your computer when you set
    up networking. If you haven''t given your computer a name (shame on you), the
    default is localhost.


    If you''ve set up a regular account for yourself, type in your username at the
    prompt. If you haven''t set up a normal user account for yourself, however, type
    in root.


    > CAUTION

    It is a bad idea to do all of your work on your system as root if you aren''t
    very familiar with Linux. Actually, it''s a bad idea to do all of your work as
    root even if you are very familiar with Linux. Linux is an obedient operating
    system — it does whatever you tell it to do as long as you have the proper permissions.
    This means it is possible to delete your entire directory tree without any fuss
    from the system. Consider yourself warned.'
  merge: -1
  pgno: 307
- img_proc: false
  md: '# Using Passwords


    After typing in your username, you will be prompted for your password. For security
    reasons, your password does not display as you type. Furthermore, if your computer
    is exposed to other users — even if just through a dial-up Internet connection
    — you probably should change your password from time to time and use a password
    that includes numbers as well as letters. Passwords made up of regular words are
    weak because you can find them in a dictionary, making them vulnerable to what
    is known as a dictionary attack. Don''t be so clever with your password that you
    forget it, though — especially if you don''t use Linux every day. On a dual-boot
    system it''s very easy to install Linux, forget about it for a while, and then
    go back to find you''ve forgotten your password! There are ways to fix this, but
    it''s easier not to worry about it in the first place.


    > **TIP** If you are having trouble with your password, but you''re certain you''re
    typing it correctly, make sure that the Caps Lock key is not toggled. Linux passwords
    are case-sensitive. You''d be surprised how often this happens.


    Now that you''re logged in to the system, it''s time to start getting familiar
    with how to navigate the Linux OS from the command line.


    # Getting Familiar with Multi-User Operating Systems


    Linux is a multi-user operating system. That means you can have several people
    logged in to one Linux machine who are all working simultaneously. Typical desktop
    operating systems are designed to handle only one user at a time. A typical Linux
    machine can have one user logged in locally and several other users logged in
    remotely over a network connection.'
  merge: -1
  pgno: 308
- img_proc: false
  md: '# # Using Virtual Terminals


    Another way to make use of Linux''s multi-user functionality is to log in to multiple
    virtual terminals. While you''re logged in to the system, press Alt+F2. Another
    login screen appears. This enables you to work on several things at the command
    line simultaneously, just by alternating between virtual terminals.


    You can be logged in to several virtual terminals at a time, which is very useful.
    If you find you need to do something as root, for example, you can log in to a
    virtual terminal and execute the commands you need to as root. Once you finish
    with the system administrator stuff, you can log out again so you aren''t tempted
    to work as root on everyday tasks.


    # # Using the whoami Command


    If you''re logged in to five virtual terminals, some as yourself and some as root,
    what if you forget which is which? Easy. At the shell prompt, type in whoami.
    The system will display the name of the user currently logged into that terminal.
    Figure A-1 shows an example of the output of the whoami command.


    ![](bbox=[0.18, 0.65, 0.75, 0.94])


    **Figure A-1**


    An example of the output from the whoami command'
  merge: -1
  pgno: 309
- img_proc: false
  md: 'Another sign to look for is the shell prompt. Under bash, the shell prompt
    is a dollar sign ($) when you are logged in as a regular user. When logged in
    as root, the shell prompt is a pound sign (#) instead.


    # Understanding and Using File Permissions


    The key difference between the root user and the typical user on a Linux system
    is the permissions each has on the system. As the name implies, permissions indicate
    what a particular user is allowed to do. If you have permission to manipulate
    a file, Linux lets you do so. If you do not, however, the system returns a `permission
    denied` error message.


    Permissions are very important for a multi-user operating system. They prevent
    unauthorized users from accessing files vital to the system, and they prevent
    users from accessing or accidentally overwriting each other''s files.


    > **NOTE** This also makes Linux a great OS for home use. When a family shares
    a computer, Mom, Dad, and the kids each have separate home directories in which
    they can save their own files without worry. With legacy operating systems, such
    as Windows, files belonging to one family member often are misplaced or deleted
    by another family member who doesn''t realize the files are important. This often
    has the effect of contributing to Dad''s ulcer when his report due Monday morning
    was deleted to make more room for a game Junior downloaded.


    There are three types of permissions: read, write, and execute. These permissions
    can apply to the owner of the file (the user), the group to which the file belongs
    (the group), and all other users (the others). By making a file owned by a particular
    user and group, and then setting permissions for the user, the group, and the
    others, you can control precisely who can access the file (see Table A-1). Typically,
    the user who created it owns a new file. The file has read and write permissions
    for that user and read access for anyone else. If you don''t want anyone else
    to be able to read the'
  merge: -1
  pgno: 310
- img_proc: false
  md: '### Table A-1 Meanings of Permissions


    | Permission | File | Directory |

    | :--- | :--- | :--- |

    | Read | File can be read. | Directory contents can be listed. |

    | Write | File can be modified. | Files can be created and deleted in the directory.
    |

    | Execute | File can be executed. | Directory can be opened. |


    file, be sure to remove the read option from the file for the group and for all
    other users. To do this, execute the following command:


    ```

    chmod 600 file

    ```


    Running the chmod (change mode) command on a file changes the mode of access to
    the file, depending on the arguments you pass to the file when you run it. In
    the preceding example, you pass the octal notation for the level of permissions
    allowed for that file. The first digit describes the permissions for the user,
    the second digit is for the group, and the last is for all other users. Also,
    note that no matter what permissions are set on a file, the root user can always
    access a file.


    > **NOTE** The octal notation, 0-7, represents the file permissions numerically.
    0 indicates no permissions, 1 indicates execute permission, 2 indicates write
    permission and 4 indicates read permission. When you add the numbers together,
    you have between 0 and 7. Thus, if you have read and write permission, the number
    would be 6, for example. For some people it is easier to remember number schemes
    than the other way round.


    It''s also possible to tell chmod only what permissions to change, rather than
    give it an entirely new set of permissions. For example, if you'
  merge: -1
  pgno: 311
- img_proc: false
  md: 'wanted to allow everyone in the file''s group to write to it, you could use
    this command:


    ```

    chmod g+w file

    ```


    You refer to the user, group, and others with the letters u, g, and o. A plus
    sign sets the permissions; a minus sign clears them. The permissions themselves
    are indicated by r for read, w for write, and x for execute. You can specify multiple
    letters at once.


    To find out what permissions are currently set on a file, run the ls command with
    the -1 argument, as follows. I use my own screen name as a placeholder for these
    examples.


    ```

    $ ls -l testfile

    -r---------  1 BKP  users  0 Sep 26 15:28 testfile

    ```


    The first - is not related to permissions; the next three relate to my (BKP) permissions;
    the next three relate to my group''s permissions; and the final three are the
    permissions for all users. As you can see, I only have read access to the file,
    and no one else can read the file. If I had read, write, and execute access, the
    output would look like this:


    ```

    -rwx------  1 BKP  users  0 Sep 26 15:28 testfile

    ```


    Files stored under MS-DOS or Microsoft Windows can also have permissions, but
    you''ll have fewer options since those are not multi-user operating systems.


    # Finding Hidden Files


    Unlike MS-DOS files, which can have a flag set to make them hidden, Linux files
    are hidden when they begin with a dot (period).


    > **BUZZ WORD** Linux files that begin with a dot are hidden. These are commonly
    called *dotfiles*.'
  merge: -1
  pgno: 312
- img_proc: false
  md: 'Many common configuration files are stored in dotfiles in each user''s home
    directory. You normally don''t see these files unless you ask to see them, as
    in this example:


    ```

    $ ls -a

    ./     .Xdefaults    .bash_profile .emacs .mailcap .zshrc    tmp/

    ../    .bash_logout  .bashrc       .kderc .vimrc   Desktop/

    ```


    # Working at the Shell


    The default command shell under Red Hat Linux is the GNU Bourne Again Shell, or
    bash. The shell is the command interpreter for Linux, much like command.com is
    for MS-DOS or its GUI equivalent, the Windows Explorer, under MS Windows. The
    bash shell executes commands from standard input or from a script. Shell scripts
    under Linux are the functional equivalent of batch files under MS-DOS, except
    that they are much more powerful than the average batch file.


    The bash shell is not the only command shell available for Linux. Three other
    popular shells are csh, which is similar to the Berkley UNIX C Shell, and the
    enhanced version of csh, tcsh, as well as the Z shell, zsh.


    As is often the case in Linux, there is a dizzying variety of options, far too
    many to cover in a book concerned with brevity and simplicity. Generally, the
    Bourne Again Shell is probably the only shell you ever need to know. However,
    there are plenty of other shells available if you find you want to experiment.


    You do not need to do anything to initialize the bash shell; it is available after
    you install Red Hat and runs whenever you log in to the computer. However, there
    are options for the bash shell you can use to configure the way bash behaves.
    When you log in to Linux, bash looks for a file called /.bashrc in your home directory.
    If this exists, bash reads the file and executes the commands that you put in
    the file.


    Under Red Hat Linux, ~/.bashrc is not created by default. However, if you wish
    to customize bash, you can easily create your own /.bashrc.'
  merge: -1
  pgno: 313
- img_proc: false
  md: 'Keep in mind that /.bashrc is not the same to Linux as bashrc. The /.bashrc
    file is a dot file, which means it is normally a hidden file. Most configuration
    files under Linux are dotfiles found in the user''s home directory.


    # Understanding the Linux Philosophy


    You probably notice that I mention piping and redirecting output and input several
    times in explaining commands in this primer. The reason is that the UNIX philosophy
    is that every command should be a filter and operate on input and output. You
    can pipe or redirect almost any command''s output into a file, a device, or another
    command. Linux follows the basic idea of UNIX in this fashion. I explain a few
    simple ways to utilize this in this appendix, but I barely can touch the surface
    of the capabilities of Linux. You should experiment with redirection and pipes
    a little on your own. You might be surprised what kind of timesaving shortcuts
    you discover.


    # Piping Input and Output


    Piping is taking the output of one command and making it input for another command.
    For example, to pipe the output of the ps command to the grep command to search
    for a process ID, issue this command:


    ```

    ps -ax | grep netscape

    ```


    The | is the pipe symbol. If there is a Netscape process running, grep outputs
    the lines with netscape in them to standard out (the monitor).


    # Using Direction and Redirection


    You can redirect input or output with the symbols > and <. The > symbol redirects
    output to a file or device. The < symbol changes a command''s input to come from
    a file or device rather than from the keyboard.'
  merge: -1
  pgno: 314
- img_proc: false
  md: 'You can use the > symbol to create a file by redirecting output from a command
    to a filename. Be careful not to overwrite an existing file with this redirection.
    If you would rather append the output to an existing file, use >>, which tells
    the shell not to clobber the file, but instead append to it. If you want to overwrite
    a file, use >|, which tells the shell to go ahead and overwrite the file without
    asking. Some shells treat > and >| the same, never asking you if it is okay to
    overwrite the file.


    > **CAUTION**


    As always, be careful with redirection symbols. You can easily overwrite an important
    file.


    # Common Commands


    To get around better in Linux, you should familiarize yourself with some common
    commands. Even if you plan to spend most of your time in KDE, GNOME, or one of
    Linux''s other GUIs, you find using these commands in a term or at the console
    very useful. You will also find you are able to combine commands with each other
    to simplify everyday tasks.


    Some commands have a large number of options, and they might not all be covered
    in this text if they aren''t likely to be used in normal situations. For a complete
    list of options, you can consult the command''s man page.


    # Copying Files: The cp Command


    **Name:** cp


    **Function:** To copy files and directories.


    **Syntax:** cp [options] file(s) destination


    **Description:** The cp command is similar to the MS-DOS command copy; it''s used
    to copy files or directories from one place to another. You can copy one file
    to a new file, one file to another place, or a large number of files all at once
    to a new place. When you copy a file, you do not'
  merge: -1
  pgno: 315
- img_proc: false
  md: 'delete the original file by default. If you wish to move a file rather than
    make a copy of it, use the `mv` command instead.


    **Usage:** To use the `cp` command, type `cp`, followed by any options, and then
    type the directory or filename(s) you want to copy, followed by the destination.
    If you want to copy multiple files, you can use wildcards, or you can list multiple
    files separated by spaces.


    # **Options:**


    *-f Force.* Remove any existing files of the same name.


    *-i Interactive.* Prompt the user if there is an existing file of the same name
    in the destination directory.


    *-p Preserve.* This option tells the `cp` command to preserve the original file''s
    permissions, if possible.


    *-R Recursive.* Copy directories located under the starting directory. The default
    is not to copy subdirectories.


    # **Example 1: Copying a File into Another Directory**


    Let''s say you download a `/.tgz` file called `~/program.tgz` — which contains
    source code — into your home directory, and you want to unzip and untar it, but
    you don''t want to do it in your home directory. You can cp the file into the
    `/tmp` directory and work with it there. To do this, type in the following:


    ```

    cp program.tgz /tmp

    ```


    Note that you do not get an error message if the file already exists unless you
    use the interactive option. If the file exists, you are asked whether you want
    to overwrite the file or not, like this:


    ```

    cp -i program.tgz /tmp

    cp: overwrite ''/tmp/program.tgz''?

    ```


    If you answer `y`, the file is overwritten; if `n`, the file is not overwritten.'
  merge: -1
  pgno: 316
- img_proc: false
  md: '# Example 2: Copying Multiple Files into Another Directory


    If you have a group of files you want to move into another directory without having
    to type each filename individually, you can use wildcards. If you want to copy
    all files in the current directory to another directory, type


    ```

    cp * /tmp

    ```


    This copies all files in the directory to the /tmp directory; however, it does
    not copy directories unless specifically told to. To copy files and directories,
    use the recursive option.


    ```

    cp -R * /tmp

    ```


    > Note that -r and -R are not equivalent. Unlike MS-DOS and Windows, Linux is
    case-sensitive. Be careful when typing commands under Linux, as interchanging
    uppercase and lowercase letters might cause unwanted and possibly disastrous results!


    If you''d like to copy all files with a specific extension to another directory,
    you can use wildcards to selectively copy groups of files like this:


    ```

    cp *.jpg *.gif images

    ```


    This copies all JPEG and GIF files to the image directory, without copying any
    other files with them. You can also use the question mark character (?) to match
    a single character rather than a group of characters.


    # Moving Files: The mv Command


    **Name:** `mv`


    **Function:** To move or rename files and directories.


    **Syntax:** `mv [options] file(s) destination`'
  merge: -1
  pgno: 317
- img_proc: false
  md: '**Description:** The `mv` command can be used to move a file or files to another
    directory, or to rename a file or files. The `mv` command is similar to the `move`
    command under MS-DOS, but the `mv` command is much more powerful than its MS-DOS
    equivalent. The `mv` command does delete the original file that is being moved,
    so be sure to use the command carefully. The `mv` command is also used to rename
    files under Linux, so it also takes the place of the `REN` command under MS-DOS.


    **Usage:** To move a file, type `mv`, followed by any options, then the name of
    the file(s) or directories to be moved, and then the destination to which you
    want the file(s) moved. As with the `cp` command, you can use wildcards to move
    multiple files rather than typing individual filenames.


    # **Options:**


    **-b** *Backup*. The backup option creates a backup file of any files that would
    be overwritten by moving a file. By default, backup files have a tilde character
    (~) extension.


    **-f** *Force*. Removes any files of the same name when trying to move a file
    without prompting the user.


    **-i** *Interactive*. The interactive mode of `mv` prompts the user if moving
    the current file will overwrite another file. If there are no conflicting files,
    `mv` simply moves the file with no complaint.


    **-S** *Suffix*. Appends a suffix to any backup files. By default, the tilde suffix
    is applied, but you can specify any type of suffix, such as `.bak` or `.tmp`.


    # **Example 1: Moving a File to Another Directory**


    To move the file `index.html` to another directory without making a backup or
    being prompted in the event of an overwrite, use the `mv` command, followed by
    the name of the file and its destination:


    ```

    mv index.html /home/BKP/backup/

    ```'
  merge: -1
  pgno: 318
- img_proc: false
  md: 'If you''re not certain whether a file of the same name already exists, use
    the interactive mode of mv. If the file already exists, your output looks like
    this:


    ```

    mv *.html /home/BKP/backup/

    mv: replace ''/home/BKP/backup/index.html''?

    ```


    # Example 2: Moving Multiple Files to Another Directory


    You can use wildcards to move more than one file to another directory. Be careful!
    The mv command can move directories as well as regular files. Be sure you actually
    want to move everything under a directory before using the wildcard (*).


    If you want to move all of the .html files in the current directory to the /home/httpd/
    directory, you use this command:


    ```

    mv *.html /home/httpd

    ```


    The *.html specifies that you want to move all files that end in .html to another
    directory. If you want to move all files in the current directory to the /home/httpd/
    directory, you type:


    ```

    mv * /home/httpd

    ```


    This moves all files in the current directory, except any dotfiles. To move dotfiles,
    you have to be more explicit:


    ```

    mv .* /home/httpd

    ```


    # Example 3: Renaming Files with mv


    Linux does not have a separate rename command, so the mv command is used to rename
    files. If you want to rename index.html to index.html.old, for instance, you use
    the mv command like this:


    ```

    mv index.html index.html.old

    ```


    > As far as Linux is concerned, moving a file and renaming it is the same thing.'
