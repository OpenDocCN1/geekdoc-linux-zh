  md: '**Syntax:** `ps` [options] [pid(s)]


    **Description:** The `ps` command displays process status to standard out. You
    get a static report of what processes are currently running. The `top` command
    is similar but provides a continually updating report of processes and their status.
    The `ps` command is useful to see what processes are running, who has created
    the process, and what the process statuses are.


    **Usage:** To use `ps`, type `ps` followed by any options, and a process ID if
    you want to check a specific process and know its ID. If you don''t know the ID
    of the process, you can run `ps` to find out!


    **Options:**


    +   - **-l** *Long.* Give lots of information.

    - **-u** *User.* Give username and start time of processes.

    - **-m** *Memory.* Give memory usage.

    - **-a** *All.* Show processes created by other users as well.

    - **-x** *Detached.* Show processes that are not associated with a terminal.

    - **-C** *Command.* Show processes with the given command name.

    - **-w** *Wide.* Don''t truncate output to fit on one line; display full information.

    - **-r** *Running.* Only show running processes.

    - **pid(s)** *Process IDs.* Show only the process IDs given. If you specify several
    process IDs, separate them with spaces.


    # Example 1: Show User''s Current Processes


    To show your processes, use the simple `ps` command:


    ```

    ps

    ```'
  merge: -1
  pgno: 341
- img_proc: false
  md: 'This only displays processes owned by the user who runs the `ps` command. The
    `ps` command also appears on the list of running processes.


    # Example 2: Show All Processes


    To display all currently running processes, use the `ps` command with the `-a`
    and `-x` options (see Figure A-5):


    ```

    ps -ax

    ```


    The first number in the output is the process ID (pid). The next column in the
    output is the terminal from which the command is being run, and the third column
    displays the status of the command. Processes can have a status of running (R),
    sleeping (S), stopped (SW), or zombie (Z). The fourth column displays the amount
    of time the process has been running, and the final column displays the command
    name.


    ![](bbox=[0.23, 0.445, 0.79, 0.875])'
  merge: -1
  pgno: 342
- img_proc: false
  md: '# Stopping Processes with kill


    **Name:** `kill`


    **Function:** The `kill` command sends a signal to a process. By default, `kill`
    sends the SIGTERM (terminate) signal.


    **Syntax:** `kill [option] pid(s)`


    **Description:** Generally, the `kill` command is used to terminate a process
    that does not terminate in another fashion. `kill` can send other signals to a
    process as well. The `kill` command can also list the signal names.


    # Options:


    +   - `-s Signal.` Specify which signal to send, which can be given as a name
    or number.

    - `-p Print.` Tells `kill` not to send a signal to the process, but only to print
    the pid of the process.

    - `-l List.` List the signal names and numbers.

    - `pid(s) Process IDs.` Specifies the processes to which the signal should be
    sent. If you want to send the signal to several processes, separate the IDs with
    spaces.


    # Example 1: Killing an Errant Process


    If a process has stopped responding, you can use the `kill` command to stop the
    process. If the process ID you want to kill is 212, the following should stop
    the process. Note that you can only `kill` a process you did not create if you
    are the superuser on the system.


    ```

    kill 212

    ```


    This tells the process to exit, but it first gives it a chance to clean up — perhaps
    it will save any data it has before exiting.'
  merge: -1
  pgno: 343
- img_proc: false
  md: 'If the default signal sent by `kill` does not terminate the process, signal
    9 (SIGKILL) should always terminate the process.


    ```

    kill -9 212

    ```


    You should use `kill -9` only when a normal `kill` won''t do it, because this
    method forcefully terminates the process without giving it a chance to clean up.


    > **CAUTION** Be very careful using `kill`. If you terminate the wrong process
    ID while you are root, you could very easily cause problems for yourself or other
    users on the system.


    # Getting Help with the man Command


    **Name:** `man`


    **Function:** Displays the man (manual) page for a command.


    **Syntax:** `man [options] command`


    **Description:** The `man` command is your friend. Really. If you commit no other
    command to memory, learn this one. If you know the name of a command, the `man`
    page tells you how to use it, providing the `man` page is installed on your system.
    (Hint: Don''t save disk space by not installing documentation; you''ll need it
    later!)


    There are nine sections of `man` pages. They are:


    +   - **Commands.** Commands a user can execute from a shell.

    - **System calls.** System calls available from the Linux kernel. These are usually
    only useful to programmers.

    - **Library calls.** Functions available in libraries. These are usually only
    useful to programmers.'
  merge: -1
  pgno: 344
- img_proc: false
  md: '+   - **Special files.** Pages for files found in `/dev`.

    - **File formats.** The format of files such as `/etc/fstab` and other useful
    files.

    - **Games and demonstrations.** ''Nuff said.

    - **Other.** Things like the `man man` page.

    - **System commands.** Commands only root can execute.

    - **Kernel information.** A manual section that contains information about kernel
    code.


    **Usage:** Using `man` is simple. Just type **man** followed by the desired command
    or the name.


    # **Options:**


    *-f Output.* Equivalent to the `whatis` command.


    *-h Help.* Displays a brief help message.


    *1–9 Manual section.* Specifically names the `man` page section to search. Useful
    if the same command appears in multiple sections.


    # **Example 1: Displaying the man Page for cp**


    To display `cp`''s `man` page (see Figure A-6), simply type **man**, followed
    by the command you want displayed—cp, in this case.


    ```

    man cp

    ```


    The `man` pages are a bit cryptic — they''re not necessarily written for non-Linux
    or non-geek types. However, the `man` pages display and explain, sometimes tersely,
    the options and syntax for each command. They''re extremely helpful in a pinch.'
  merge: -1
  pgno: 345
- img_proc: false
  md: '![](bbox=[0.227, 0.135, 0.74, 0.41])


    # Directory Structure


    The directory structure under Linux is much different from that of the directory
    structure of typical desktop operating systems. Linux''s directory structure is
    patterned after UNIX — everything is in a single directory tree. This tree includes
    all your files, your hardware devices, any devices you have mounted, and even
    dynamically generated information about your system.


    # The / Directory


    The / directory is typically called the root directory, not to be confused with
    /root, which is actually the home directory of the root user. All other directories
    fall under the root directory. Under Red Hat, this includes the following top-level
    directories:


    +   - /bin

    - /boot

    - /cdrom'
  merge: -1
  pgno: 346
- img_proc: false
  md: '+   - /dev

    - /etc

    - /home

    - /lib

    - /lost+found

    - /mnt

    - /opt

    - /proc

    - /root

    - /sbin

    - /tmp

    - /usr

    - /var


    > **NOTE** You also can create other directories under the root directory if you
    want, although you should exercise some restraint. On systems that have Microsoft
    Windows or MS-DOS, I usually mount the DOS filesystem under /c or /Fat-c so I
    can use files between Linux and Windows when needed. Remember, Linux can read
    FAT and FAT32 filesystems, but you won''t be able to see your ext2 filesystems
    under Windows or MS-DOS. It''s probably a good idea to store all of your personal
    files under your home directory rather than just piling them under the root directory.
    This helps you keep your system well-organized and keeps clutter to a minimum.


    # The /bin Directory


    The /bin directory is where the most basic binary executable files that are used
    system-wide are stored. As you may have guessed, /bin is short for binary. Executable
    files are often referred to as binaries on UNIX-style'
  merge: -1
  pgno: 347
- img_proc: false
  md: 'systems, which is probably a bit misleading. If you use WordPerfect under Linux,
    for example, the files are stored in a binary format, but they''re not executable.
    Also, shell scripts are ASCII files that are flagged as an executable file, but
    they aren''t stored in binary format.


    Under the `/bin` directory you find most of the common commands like `ls`, `touch`,
    `mount`, `cd`, and other commands used by all users on the system. These fundamental
    commands are kept in this directory, separate from other programs (such as Emacs
    or games,) to make it easier to recover a sick system.


    # The /boot Directory


    Not surprisingly, the `/boot` directory contains files related to booting your
    Linux system. There is nothing very interesting in this directory, and it is probably
    best to leave it alone. You only modify files in this directory if you compile
    your own kernel.


    # The /dev Directory


    The `/dev` directory is not a typical directory. It contains special files that
    represent devices attached to your system. Some of these are block devices, meaning
    they deal only in big chunks of data. Your hard drive is a block device. Others,
    such as your mouse, are character devices that only give and take a single character
    at a time. By reading and writing to and from these files, programs can communicate
    with your hardware. For example, the input from your mouse usually comes in to
    Linux from the file `/dev/mouse`. For a little fun, go to the `/dev` directory,
    type in `cat mouse`, and move your mouse around a bit.


    ```

    cd /dev

    cat mouse

    ```'
  merge: -1
  pgno: 348
- img_proc: false
  md: 'If you follow the previous steps, you start seeing a bunch of gibberish on
    the screen, because instead of directing your mouse input to the normal destination,
    you''re directing it to standard output — namely your screen. Don''t worry, you
    haven''t broken your computer. Type in Ctrl+c to quit sending the mouse signal
    to standard out. See what your computer has to put up with?


    If what you type is now gibberish too, blindly type **reset** and hit Enter to
    restore sanity.


    Your hard drive is represented in this directory. It probably is /dev/hda. You
    used this device when you configured partitions during installation. Advanced
    users might even read and write directly to these devices to make byte-for-byte
    copies of the hard drive.


    Another popular destination under the /dev directory is /dev/null. This is basically
    the same as “File 13” — anything sent to /dev/null basically is being thrown away.
    This is sometimes useful for programmers to send output to /dev/null rather than
    write it to disk when there is output that has to go somewhere.


    A final interesting device in this directory is /dev/zero. Like /dev/null, this
    isn''t an actual physical piece of hardware, but Linux treats it as if it were
    one. This device continually spits out zeroes. What good is that? For any politicians
    out there looking for a modern paper shredder, here''s a quick way to totally
    blank a floppy:


    ```

    cat /dev/zero > /dev/fd0

    ```


    You probably don''t have to worry about /dev too much, but there might be occasions
    when you can find use for directing input from a device to a file rather than
    to its normal destination — mostly for troubleshooting purposes. You also should
    be familiar with this directory when you are configuring new hardware.'
  merge: -1
  pgno: 349
- img_proc: false
  md: '# The /etc Directory


    The /etc directory, usually pronounced “etsee,” contains configuration files and
    several other directories that contain more configuration files. Some of the more
    important files contained in /etc are the /XF86Config file, the /fstab and /mtab
    config files and the /rc.d directory. The /XF86Config file contains the configuration
    information for XFree86, including which X server it should use, the refresh rate
    of your monitor, and information about your mouse and keyboard. You probably never
    need to edit this file directly, but it is there if you do need to edit it.


    The other two files, /fstab and /mtab, are short for Filesystem Table and Mount
    Table, respectively. The /fstab is created when you install Red Hat. If you add
    a hard drive or other storage device, you have to manually add a line for it to
    the /fstab. The /mtab is updated dynamically, depending on which devices currently
    are mounted on the system. For instance, if you mount a MS-DOS floppy (mount -t
    msdos /dev/fd0 /floppy), the /mtab gains a new line:


    ```

    /dev/hda3 / ext2 rw 0 0

    /dev/hdb1 /usr ext2 rw 0 0

    /dev/hdb2 /opt ext2 rw 0 0

    none /proc proc rw 0 0

    /dev/fd0 /floppy msdos rw 0 0

    ```


    The first entry /dev/hda3 / ext2 rw 0 0 is my root partition, which is located
    on the third partition on my first IDE hard drive. It is an ext2 filesystem that
    is mounted with read and write enabled.


    The /usr and /opt directories are actually mounted on separate physical partitions
    on my second IDE hard drive. They are also ext2 filesystems, mounted with read
    and write enabled. The floppy is device /dev/fd0 mounted under /floppy and is
    an MS-DOS (FAT16) filesystem. If I had a second floppy drive, it would be /dev/fd1,
    and so on. If I unmount the floppy drive, the /mtab drops that entry. The /mtab
    exists for programs to read to see what devices are mounted.'
  merge: -1
  pgno: 350
- img_proc: false
  md: 'The /etc/rc.d directory contains configuration scripts for the different runlevels
    under Linux, as well as the files that control the console font, Samba, the serial
    port, and other fun things. You also find the ppp directory, which is where the
    config files for ppp are found. You might need to edit these to use ppp on your
    system.


    # The /home Directory


    The /home directory contains the home directories of all users on the system (with
    the exception of the root user, whose home directory resides in /root.) If your
    username is bsmith, for example, your home directory would be /home/bsmith.


    Because Linux is a multi-user system, having separate home directories for each
    user is a necessity. Other desktop operating systems allow users'' files to be
    intermingled. Linux forces them to stay separate, giving you a bit of privacy
    and security.


    The /ftp and /httpd directories are under the /home directory as well. If you
    are running an FTP or Web server, these directories contain the files visible
    to the outside world.


    # The /lib Directory


    Under the /lib directory you find library files. Library files are files that
    are required when compiling or running many programs under Linux. Library files
    are similar to DLL files under Windows. /lib is another directory that it''s best
    not to muck about in unless you need to and know what you''re doing.


    # The /lost and found Directory


    The /lost+found directory generally is empty. If your computer shuts down without
    properly unmounting the drives, Linux does a filesystem'
  merge: -1
  pgno: 351
- img_proc: false
  md: 'check (fsck). Any file fragments that aren''t properly accounted for are put
    in the `/lost+found` directory. In general, as long as your system is healthy,
    this directory is unnecessary.


    # The /mnt Directory


    Red Hat put devices like the CD-ROM or floppy drive directories under `/mnt`.


    # The /opt Directory


    The `/opt` directory contains optional programs — generally large programs. If
    you download a new version of Netscape, it might install here. The K Desktop Environment
    installs in the `/opt` directory by default as well.


    # The /proc Directory


    The `/proc` directory does not contain actual files; it is generated on the fly
    by Linux. It contains information about running processes and the status of the
    hardware. You can get information about hardware devices or running processes
    by using the cat command on these files. For instance, you can find out what filesystems
    your kernel supports by running the following command:


    ```

    cat /proc/filesystems

    ```


    Alternatively, you can find out what interrupts your hardware devices are using
    by running this command:


    ```

    cat /proc/interrupts

    ```


    Generally, the `/proc` directory is an area for power users only, but on occasion
    you might be instructed to get information from the `/proc` directory in order
    to troubleshoot or configure devices.'
  merge: -1
  pgno: 352
- img_proc: false
  md: '# The /root Directory


    The /root directory is the home directory for the root user. When logged on as
    root, the cd command brings you to this directory. It is kept separate from the
    home directories in /home so that the root user can maintain the system, even
    if the /home directory is destroyed.


    # The /sbin Directory


    The /sbin directory contains more binary files. This directory is similar in purpose
    to /bin, except /sbin contains system binaries. Most are related to system upkeep.
    Typically, you must be root to use these binaries.


    # The /tmp Directory


    The /tmp directory contains temporary files. This is a good place to stick a file
    you plan to delete. Many programs automatically create temporary files in the
    /tmp directory. KDE creates files in /tmp for the K File Manager and a few other
    programs while it is running, so it''s a good idea not to delete anything in the
    /tmp directory while you''re in KDE or X Windows.


    The /tmp directory is a handy place to decompress and compile programs that you''ve
    downloaded. Once you''ve compiled and installed a program you should be able to
    delete all of the remaining unnecessary files from the /tmp directory. Be sure
    to keep an archived copy of the .tgz files you download in another area, though.


    # The /usr Directory


    The /usr directory and its subdirectory /usr/local are often kept on separate
    partitions because of their size. The /usr directory is one of the larger directories,
    because it contains the majority of software on your system: the X11 directories,
    development tools, library files, and games.'
  merge: -1
  pgno: 353
- img_proc: false
  md: 'The directory layout within `/usr/local` mimics what you see in `/usr`. Usually,
    Red Hat packages install in `/usr`. If you compile your own software, it goes
    in `/usr/local`.


    # The /var Directory


    The `/var` directory contains variable files, mostly system logs. Generally, files
    under `/var` aren''t of much interest unless you want to monitor the health of
    Linux or a Web server.


    Directory structure under Linux is a bit more complex than under MS-DOS/Windows,
    but in the end, it also makes more sense. Under DOS and Windows, directory structure
    tends to be a bit haphazard, and many third-party programs put program directories
    wherever they feel like it, with little rhyme or reason. There is actually a method
    to the madness under UNIX-style OSes, which should comfort you when you''re getting
    used to the system.


    # Conclusion


    This Linux Primer should give you a good idea of how to get around in the Linux
    CLI. Most users who are new to Linux and just want to use Linux as a workstation
    or desktop operating system probably don''t need to be gurus at the shell prompt,
    but it never hurts to have an idea of how to get around the shell if needed. You
    might even find that using the CLI is better in many cases. The nice thing about
    Linux is that you don''t need to make a choice between GUI and CLI; you can fire
    up KDE (or whatever your favorite window manager/desktop environment is) and open
    several console windows and go to town!'
  merge: -1
  pgno: 354
