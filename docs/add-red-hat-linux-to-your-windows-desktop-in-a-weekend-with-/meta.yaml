  md: '# # Configuring the Keyboard


    To access the Control Center application in the Gnome environment, click on the
    Gnome control menu and choose Settings, Peripherals, Keyboard (or Mouse). Choosing
    the Keyboard option will open the Control Center directly at the Keyboard settings
    pane, as shown in Figure 3-34.


    If you are not satisfied with the performance of your keyboard, you can adjust
    the slider controls to change the values of repeating keys or keyboard clicking.
    You can also change the tone of the keyboard bell, something that in past versions
    of Gnome was handled in the Sound section of the Control Center. After making
    a change, click the Try button and then test your new settings in the Test setting
    field provided near the bottom of the dialog.


    Once the settings are to your liking, click OK to close the Control Center window.


    ![](bbox=[0.105, 0.55, 0.885, 0.92])


    **Figure 3-34** Keyboard user settings can be modified from the Gnome environment.'
  merge: -1
  pgno: 142
- img_proc: false
  md: '# Configuring the Mouse


    As noted in the previous section, you can also tweak your mouse settings a bit
    in the Control Center. Again, these are not earth-shattering changes, but sometimes
    these little things really matter. In Figure 3-35, you can change the button orientation
    on your mouse and change its responsiveness to motion—both very handy features.


    When you''re finished experimenting with the settings, click OK to close the window.


    # Properly Logging Out of X


    Before we continue with desktop work, you may be curious by now as to how you
    turn Linux off. Not that you''re going anywhere, right?


    Windows and Mac users are accustomed to the fact that they simply can''t just
    turn off their PCs. Instead, they must Shut Down first.


    ![](bbox=[0.2, 0.56, 0.84, 0.92])'
  merge: -1
  pgno: 143
- img_proc: false
  md: 'Since most people are comfortable with this action, the steps necessary to
    leave X should feel familiar. Like its sister operating systems, X likes an orderly
    departure, not an abrupt power outage.


    To leave X, you must first log out and close your account. In Gnome, click the
    Main Menu icon and select Log Out. A message box will ask you whether you want
    to Logout, Halt, or Reboot.


    If you just want to log out leaving the computer on for the next user, click the
    Logout option and then click Yes. The X session will close and the screen will
    return to the graphical login screen if the Workstation installation was the option
    you selected. If you installed Red Hat as a server, you''ll be returned to the
    command-line interface.


    If you want to reboot the system, click Reboot, then Yes. X will close, the Linux
    system will halt your PC and then reboot itself, returning to the graphical login
    screen.


    Finally, if you just want to turn the computer off and go home to watch TV, click
    the Halt option before clicking Yes. X Window will close and Linux will close
    all running processes down as part of its halt sequence.


    If you change your mind, simply click No to resume your X Window session, which
    you will need to do now so we can start looking at configuring your desktop environments.


    # Choosing a Desktop Environment


    So far this afternoon, you have learned about the components that make up the
    X environment and found out which components handle specific aspects of your PC.
    The procedures to configure video and input devices at the X server level were
    also reviewed.


    Now you will explore X even further at the window manager and desktop environment
    level. You will also start to learn the ways you can make configuration settings
    at that level.'
  merge: -1
  pgno: 144
- img_proc: false
  md: '# Add Red Hat Linux 7 to Your Windows Desktop In a Weekend


    Not only is Linux a viable alternative to Microsoft Windows as a workstation platform,
    the operating system itself contains several choices on which to operate.


    For example, with Microsoft Windows you can change the look of the desktop by
    manipulating the colors and fonts of the menus and windows. There are even prepackaged
    themes available to unify the desktop into a cohesive look.


    You can accomplish the same thing in X Window and go way beyond that point. Not
    only can you manipulate the look of a desktop environment such as Gnome, you can
    also change the entire desktop environment to something else entirely! This complete
    ability to customize your system makes X Window a much friendlier tool to use
    than the static Microsoft Windows.


    There are two other advantages to moving across desktop environments: you have
    the ability to access environment-specific tools you might not otherwise see;
    and you can also decide which desktop approach you prefer to use, since each environment
    has a different presentation and work method.


    Now let''s learn how to move between environments.


    # Login Options


    The first place you can choose which environment you will use occurs at the login
    screen. You now have the ability to pick the environment for the account into
    which you''re logging. For instance, if I log into KDE as root and set KDE as
    the default, KDE will only be set as the default for the root account. Any other
    accounts into which I may log will use their own default environment.


    The Session menu command appears in the login screen. When clicked, the menu opens
    to reveal the available environment options. If you originally installed using
    the KDE Workstation path, your options will be:'
  merge: -1
  pgno: 145
- img_proc: false
  md: '- **Default.** The default environment is set by either the original installation
    or the Gnome Desktop Switching application

    - **Failsafe.** The Failsafe command line interface is used when there is difficulty
    getting an environment to run, as might occur when an incorrect video setting
    was made in Xconfigurator or xf86config that needs to be adjusted

    - **Gnome.** The Gnome desktop environment


    If you have added any other desktop environments to your system, they will appear
    here as environment options as well. Once selected, the choice is confirmed by
    a message just below the Login field. After you complete your login procedure,
    the environment of your choice will appear.


    # Switching Desktop Environments


    Once inside your environment (let''s assume it''s Gnome for now), you can quickly
    switch to another environment, as you will discover in the following steps.


    +   1. Click the Main Menu icon to open the Main Menu.

    2. Choose Programs, System, Desktop Switching Tool. The Desktop Switcher window
    will open, as shown in Figure 3-36.

    3. Click the KDE option (see Figure 3-37). The KDE logo appears.


    ![](bbox=[0.09, 0.715, 0.58, 0.97])'
  merge: -1
