  md: '+   - **ro.** Mounts the file system read-only, does not allow writing to the
    filesystem

    - **rw.** Mounts the file system read-write, allows writing to the filesystem
    if the user has the privileges


    # Example 1: Mounting a CD-ROM


    To use a CD-ROM you need to mount it. By default, Red Hat Linux comes with a `/mnt/cdrom`
    directory. To mount a typical CD-ROM, type this command:


    ```

    mount -t iso9660 /dev/hdd /mnt/cdrom

    ```


    This tells the system that the filesystem type (-t) is iso9660, the CD-ROM standard,
    and that your CD-ROM is located on the fourth IDE channel (hdd). Typically, your
    hard drive is hda; if you have a second it usually is hdb, and so on. On most
    PCs, you''ll find two IDE controllers that each support two devices, allowing
    for hda through hdd. The master device on the first controller is hda; the slave
    device is hdb. The master device on the second controller is hdc, and the slave
    device is hdd. The final argument to the mount command is the directory under
    which you want the CD-ROM mounted. Now, unless there are errors, you can access
    the CD-ROM from that directory.


    # Example 2: Mounting a Floppy


    To mount a MS-DOS floppy in what would be drive A under MS-DOS, use the `mount`
    command like this:


    ```

    mount -t msdos /dev/fd0 /floppy

    ```


    This mounts an MS-DOS (FAT16) floppy under the `/floppy` directory. By default,
    it allows read and write access. If you do not want to allow write access to the
    floppy, you can specify that with the `-o ro` option, like this:


    ```

    mount -t msdos -o ro /dev/fd0 /floppy

    ```'
