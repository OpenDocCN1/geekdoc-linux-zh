    # Desktop Themes


    If you could wear clothes that reflected your true personality, people would likely
    look at you very strangely.


    Why let your uniqueness get buried in a wave of peer pressure? Throw off the chains
    of mediocrity, and get ready to strut your stuff. You can start with your Linux
    desktop.


    Themes are a desktop environment’s way of packaging unique looks and textures
    of desktop objects into one (ideally) coherent design. The themes of a KDE or
    Gnome desktop are managed within the Control Center. For our example today, we’ll
    look at Gnome’s themes.


    # Changing Themes


    You may not realize it, but the combination of colors and textures that appears
    on your Gnome desktop after installation is itself a theme. This is Gnome’s Default
    theme, which looks suspiciously like the look of a certain other operating system’s
    default desktop.


    Be that as it may, you are certainly welcome to try one of the other themes Red
    Hat provides. As you might expect, this is accomplished using the Control Center.


    +   1. Click the Gnome Configuration Tool button. The Control Center window will
    appear.'
