- img_proc: false
  md: 'any drivers that can be found for the hardware and user comments or warnings
    about the item (see Figure 1.11).


    As you learn more about Red Hat Linux and become proficient at solving hardware
    issues, you can come back to this site and enter your own ratings about a product.
    All you have to do is register and that''s free!


    # Hardware Supported by Red Hat


    Gather your Linux journal and return to the Red Hat Linux Web site so that the
    HCL is on the screen in front of you. Now it''s time to match up your PC''s hardware
    to that on the list. Don''t be discouraged if you find that any of your hardware
    falls into Tier 2 and Tier 3 categories. While it may take a bit more effort,
    it''s not the end of the world. There may be a solution that won''t involve going
    to the computer store. For more information on installing hardware, see the “Hardware”
    section on Sunday evening.


    ![](bbox=[0.2, 0.5, 0.87, 0.94])


    Figure 1.11

    Real, honest opinions really help.'
