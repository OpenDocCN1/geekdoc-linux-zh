  md: '# I Can''t Hear You!


    Sound cards can be a big problem. They are common, but they use all kinds of incompatible
    technologies, and many half-clones exist. Thankfully, with sndconfig most of these
    problems are no longer encountered. Before attempting to set up your sound card
    with the sndconfig utility, you should determine the type of chip on your card.
    If the card is an original Sound Blaster 16, configuration should be easy. However,
    if it is a clone, then it may not work with the Sound Blaster driver.


    For example, you can have a card that is advertised as a Sound Blaster and Windows
    Sound System compatible card, but it really uses an ESS Maestro chip, which requires
    the ESS driver.


    The lesson here is, make sure you know what kind of hardware you really have.


    # Making Printers Work


    This same lesson applies to printers. If you have a printer that is not directly
    compatible with Linux, you need to determine the other printers with which it
    is 100 percent compatible and which printer it can emulate.


    A Canon BJC-210 is not listed in the printtool utility, for example. However,
    it is compatible with the BJ-200, which is listed. If you are shopping for a new
    printer, make sure it is supported by Linux. Although expensive, the best type
    of printer to buy is one that supports PostScript, since Linux can support any
    PostScript-capable printer, regardless of the brand or model.


    Some other problems can arise with printers. For example, the printer daemon lpd
    may be running, but if queried using lpq, it responds that the printer has not
    been found or is offline. There may be many reasons for this. First, perhaps the
    printer really is offline. Be sure to check. Or, perhaps the cable is bad. This
    message can also appear because the correct modules were not loaded. If you recompile
    your kernel or use some other custom kernel, make sure support for parallel port,
    PC-style port, and printer support are enabled.'
