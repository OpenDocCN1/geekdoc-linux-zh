    +   * -r. When combined with rm, the recursive switch removes the directory and
    all its files and subdirectories.


    For example, to remove the directory testdir and any subdirectories it contains,
    use the command rm -r testdir. Likewise, the command rm -r tt removes the directory
    tt. Alternatively, use the command rmdir tt to remove an empty directory.


    +   * rmdir. Removes an empty directory. If the directory testdir2 happened to
    be empty, then the following two commands would be equivalent:


    ```

    rmdir testdir2

    rm -r testdir2 .

    ```


    +   * mkdir. Makes a new directory. You can specify the directory in either absolute
    or relative references. For example, use the command mkdir testdir to make a new
    directory within the current directory.'
