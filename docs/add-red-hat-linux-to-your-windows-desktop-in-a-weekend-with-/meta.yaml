    # # Mounting Filesystems


    There are two commands under Linux that are pertinent to accessing filesystems:
    `mount` and `umount`. The `mount` command is used to mount a filesystem, and not
    surprisingly, the `umount` command is used to unmount a mounted filesystem.


    **Name:** `mount`


    **Function:** To make available, or mount, a filesystem.


    **Syntax:** `mount [options] device [directory]`


    **Description:** Unlike other operating systems you might be used to, Linux requires
    that you mount a filesystem before you can use it. Generally, most of this happens
    during the boot-up procedure, and you don''t do it manually. CD-ROMs and floppies
    have to be mounted as you wish to use them, and unmounted when you are finished.
    Normally you have to be the superuser (root) to issue the `mount` command. You
    do not normally need to specify the filesystem type or the directory to mount
    in if the device is already listed in the `/etc/fstab` file. If you want to make
    a device mountable by a user, or all users, include that information on the'
  merge: -1
  pgno: 328
- img_proc: false
  md: 'device line in /etc/fstab. Open your favorite text editor and put an entry
    in the /etc/fstab file like this:


    ```

    /dev/hdd /cdrom iso9660 ro,user

    ```


    From left to right, that line includes the name of the device, the directory it
    should be mounted under, the filesystem type, an option specifying read-only,
    and an option specifying that non-root users can mount the device. Be sure to
    separate the options only with commas but no spaces, otherwise Linux doesn''t
    understand what you''re saying.


    Currently mounted filesystems can be found in the /etc/mtab file. Do not edit
    the /etc/mtab file by hand, because it is updated dynamically by your system.
    It is useful to be able to read the /etc/mtab file, however, to see what devices
    are currently available and what filesystems they are mounted as.


    **Usage:** To use the mount command, type **mount** followed by any options, and
    then the device name you wish to mount and optionally the directory under which
    you want the device mounted. In Red Hat Linux, the default directory for the CD-ROM
    is /mnt/cdrom. If you have additional devices you need to access, you can create
    directories for them under the /mnt directory (or wherever else you like, but
    the /mnt directory is the standard location).


    > Another nifty thing about Linux (and there are plenty!) is that it can handle
    quite a few filesystem types. Linux can read disks in its own native format (ext2),
    the FAT16 and FAT32 formats used by MS-DOS and Windows 9x, the Macintosh filesystem
    HFS, the Joliet filesystem used by Windows 9x for CD-ROMs and the standard ISO9660
    CD-ROM format, as well as many others. I found this very handy when I was sent
    a Zip disk with art files in Macintosh format. Using Windows I would have had
    to buy an expensive program to read files from a Mac disk; using Linux I just
    had to recompile the kernel to support HFS and mount the disk like any other Zip.'
  merge: -1
