  md: '**Options:**


    -a Auto. Determines file system type automatically, if possible.


    -n No write. Mounts the device without writing in /etc/mtab. Useful if /etc/mtab
    is a read-only file.


    -t Type. Specifies the filesystem type. The following filesystem types are common:


    +   * ext2. The native Linux filesystem

    * msdos. FAT16 file system

    * umsdos. UMSDOS file system

    * vfat. The FAT32 file system

    * minix. The Minux file system

    * nfs. Network file system

    * smbfs. SMB shares from Windows or Samba

    * iso9660. Standard CD-ROM file system

    * hfs. Standard Macintosh file system


    -v Verbose. Prints any messages to standard out.


    -o Options. Filesystem-specific options are specified by -o followed by a comma-separated
    list of options. Note that I am only listing the most common options. Most of
    these apply to all filesystem types, but some filesystems may support additional
    options.


    +   * auto. Can also be specified by -a

    * defaults. Uses the default options (rw, suid, dev, exec, auto, nouser, async)

    * exec. Permits the execution of binaries on the filesystem

    * noexec. Does not permit the execution of binaries on the filesystem'
