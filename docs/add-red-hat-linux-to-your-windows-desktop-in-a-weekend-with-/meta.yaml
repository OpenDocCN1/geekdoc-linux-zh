    # StarDraw: Create Works of Art


    The Mona Lisa. Whistler''s Mother. Dogs Playing Poker. Brilliant pieces of art
    that have graced museums and walls the world over. If you have ever wanted to
    create art to join these masterpieces, StarDraw might be a good place to start.
    Kidding aside, StarDraw is a wonderful tool (see Figure 6-34) for creating some
    good-looking art for your documents and presentations—even if you are not an artist
    by trade. StarDraw is unique among drawing tools that come with other office suites
    as it uses vector-based technology. Other low-end art packages, such as Microsoft
    Paint, use raster-based technology.


    > Vector-based graphics: Graphic images based on computer-generated lines.


    > Raster-based graphics: Graphic images based on computer-generated dots.


    For you, this means that StarDraw produces smoother, more even lines and curves,
    as opposed to the jagged effect that a raster-based drawing tool produces. You
    typically only find this kind of technology in high-end, expensive applications
    such as CorelDRAW.'
