  md: '# Creating Directories: The mkdir Command


    **Name:** mkdir


    **Function:** To create new directories.


    **Syntax:** `mkdir [options] directory`


    **Description:** The `mkdir` command is pretty straightforward. It behaves the
    same way that the MS-DOS command MKDIR works. The Linux command does have some
    additional functionality — you can set the permissions of the directory when it
    is created.


    **Usage:** To create a new directory simply type `mkdir` and any options and then
    the name of the directory you wish to create.


    **Options:**


    -m Mode. To create a directory with specified permissions.


    # Example 1: Creating a New Directory


    To create a new directory called /html under the current directory, use the mkdir
    command followed by the name of the new directory:


    ```

    mkdir html

    ```


    If you want to create a new directory called download under the /tmp directory
    that has read-only permissions for other users and members of your group, and
    read and write permissions for you, use the `mkdir` command plus the proper octal
    mode:


    ```

    mkdir -m 644 /tmp/download

    ```


    This creates a directory named download under the /tmp directory. You do not need
    to be in the /tmp directory to create a subdirectory for it. If a file or directory
    named /download already exists in the /tmp directory, you receive the following
    error message:


    ```

    mkdir /tmp/download

    mkdir: cannot make directory `download'': File exists

    ```'
  merge: -1
