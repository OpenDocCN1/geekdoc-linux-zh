    # Adding External Devices


    External devices are the easiest to add because you simply plug them in. Further,
    because no vital system part is outside of the case, you don''t risk corrupting
    your machine. You can install an external device even if you are still new to
    computers. For example, to add a printer, simply connect the printer cable to
    both the printer and the back of the computer, and then plug in the power supply.


    There are many external devices. Most people who add components to their computer
    will add an external device since such devices are both simple to plug in and
    abundant in today''s computer market. Specific devices exist for each of the ports
    on the back of your system, and, since they all have different socket sizes, you
    really can''t connect the wrong device to the wrong port. For example, a standard
    parallel printer port is a female connection with 25 holes, and a mouse or modem
    serial port is a male connection containing either 9 or 25 pins. You already know
    how to connect a printer to your machine. Any other external device (keyboard,
    monitor, mouse, Zip drive, Ethernet-based cable modem) is just as easy.


    While it will probably not damage your system to connect an Ethernet cable to
    the Ethernet socket in your system while the power is still on, it is generally
    recommended that you turn off the power before adding any new device. Most manuals
    also warn you of this fact. This will allow three things: The system BIOS will
    attempt to detect the new device when you reboot; the kernel auto-detect process
    will detect the device; and the device will benefit from a fresh system start.
    Some devices won''t work right if they are plugged in while the power is on, especially
    external removable drives. Note that this does not apply to hot-swappable devices,
    such as special RAID arrays or rack-mounted servers, but most personal desktop
    systems don''t use these device types.'
