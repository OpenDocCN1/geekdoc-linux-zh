    # Using the Control Panel


    Although the settings for the keyboard and mouse are primarily the function of
    the X server, it is possible to make certain setting changes from the window manager,
    too. You can make these changes from the Control Center. While these settings
    are not major, they are the type of little things that can make your life easier.


    You can use either the GNOME or KDE control panels to make these settings. Just
    remember that any changes you make will be exclusive to the environment you are
    configuring.'
