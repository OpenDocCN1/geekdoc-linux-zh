  md: 'This option displays the file type, privileges, links, owner, group, size,
    last modification date and time, and file name associated with each file. The
    file type, privileges, owner, and group fields will be discussed later this afternoon.


    +   - `-a`. Shows all the files in a directory, including the hidden files. File
    names for hidden files begin with a period (.).

    - `-R`. Shows the contents of the subdirectories recursively.

    - `--color`. This is a special switch that makes it easy to differentiate between
    files and directories. --color displays executable files differently than regular
    files. Directories, links, and device files also have separate colors. This is
    extremely valuable when displaying files in the short format.


    To avoid having to retype this option each time, place it in an alias. Type:


    ```

    $ alias ls=''ls --color''

    ```


    To use this option each time you log in, use your favorite text editor (emacs,
    vi, pico, or whatever) to edit `~/.bashrc`. Add the following line:


    ```

    alias ls=''ls --color''

    ```


    Save the file. Now, each time you log in, this script will run.


    +   - `cd`. This command is like the DOS cd (change directory) command. It, likewise,
    changes the current working directory.


    For example, to change the working directory to the root directory, use `cd /`.


    To change the working directory to the user''s home directory, (the directory
    he or she starts in after logging in), use `cd ~`.


    To return to the previous working directory, use the `cd -` command. This is convenient
    when switching back and forth between two directories.'
  merge: -1
