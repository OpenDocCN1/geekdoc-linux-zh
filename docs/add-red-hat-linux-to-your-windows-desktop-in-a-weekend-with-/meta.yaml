    # Plug and Play Using the ISAPNPTOOLS Utility


    If you have a newer PC, then it is very likely that you have a PCI bus on your
    motherboard. PCI busses are nice for Linux users because Plug and Play technology
    is built into the bus itself. Any device connected to a PCI bus, therefore, is
    likely to be detected by Red Hat Linux.


    Older PCs, however, have ISA busses, with which Red Hat Linux needs a little help.
    Linux must probe an ISA device more directly to determine whether it is Plug and
    Play.'
  merge: -1
  pgno: 210
- img_proc: false
  md: '> **Plug and Play (PnP):** The ability for expansion cards and peripheral devices
    to be automatically configured.


    > **PCI (Peripheral Component Interconnect) Bus:** a local bus standard developed
    by Intel Corporation. PCI is a 64-bit bus, although it is usually implemented
    as a 32-bit bus.


    > **ISA (Industry Standard Architecture) Bus:** The bus architecture used in the
    IBM PC/XT and PC/AT. Most computers made today include both an ISA bus for slower
    devices and a PCI bus for devices that require better performance.


    If your PC has an ISA device that is not recognized by Linux, you can use the
    isapnptools set of applications to help configure the device.


    # Performing a PnP Dump


    The first thing you need to do is to perform a scan of all existing ISA PnP cards
    on your PC. This is done using the pnpdump application — an apt name for the program
    since it takes all of the PnP information and "dumps" it into the isapnp.conf
    file. From there, the isapnp application can configure the isapnp.conf file. Follow
    these steps to get the information you need:


    > **CAUTION:** Because pnpdump will try to use real-time scheduling to get the
    right I/O port settings, all other programs will be locked while pnpdump runs.
    For this reason, do not run pnpdump from within X, as the terminal emulation window
    will be locked as well.'
  merge: -1
  pgno: 211
- img_proc: false
  md: '+   1. Press Ctrl+Alt+F1 to switch to the Linux command line interface (if
    you''re not there already).

    2. Log in as root.

    3. Type /sbin/pnpdump > /etc/isapnp.conf.

    4. Check and record the settings for all other devices so that you will avoid
    conflicts when setting up your ISA devices. Type the following commands, each
    on a separate line, to obtain other device information:


    +   - cat /proc/dma

    - cat /proc/interrupts

    - cat /proc/ioports

    - cat /proc/pci


    # Editing the isapnp.conf File


    Now that the isapnp.conf file is made, you can use the isapnp utility to configure
    your devices, as seen in the following steps.


    +   1. At the Linux console, while logged in as root, type /sbin/isapnp /etc/isapnp.conf.

    2. isapnp will open and display the results of the pnpdump. If any ISA boards
    were found, remove the comment characters preceding the device listing. This will
    enable Linux to activate the board.


    > **NOTE** For more information on the format of the isapnp.conf file, see the
    isapnp Tools Home Page at http://www.roestock.demon.co.uk/isapnptools/.


    +   3. Edit the values listed so that they match your card''s exact specifications.


    > **TIP** If isapnp is not installed, you can use a text editor such as emacs
    to edit the file.'
