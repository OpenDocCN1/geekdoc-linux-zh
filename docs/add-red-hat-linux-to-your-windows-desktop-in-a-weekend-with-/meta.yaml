    # Networking and IP Addresses


    TCP/IP is the standard protocol of the Internet, and most of the world''s networks
    use this protocol to communicate as well. Your home or office network is no exception.


    First off, you should know that all computers that use TCP/IP protocols have a
    unique address. No two computers can share the same address on the same network.
    The system used to assign an address to a computer is known as the Dotted-Decimal
    Address, usually referred to as an IP Address, or just an IP. The Class A, B,
    and C addresses are assigned to certain functions.


    Class A addresses are normally used for loopback communications and for very large
    organizations. Usually 127.nnn.nnn.nnn IP addresses are used for applications
    and processes that communicate with other applications and processes on the same
    computer.


    Class C addresses are the most commonly used, especially for networks that are
    not part of a widespread organization. Class C addresses are discussed here. Most
    Class C addresses are part of a LAN. A LAN can consist of any number of computers,
    (from two computers to 254 computers, or hosts as they are known in networking
    jargon). There are three sets of IP addresses assigned for use by LANs that are
    not part of the Internet. These sets are:


    +   - 10.0.0.0 to 10.255.255.255

    - 172.16.0.0 to 172.16.255.255

    - 192.168.0.0 to 192.168.255.255


    These blocks of addresses are used for LANs and will not be assigned to Internet
    addresses. Since they are not connected to the Internet, any of these blocks can
    be used as IP addresses for your private network. Proba-'
  merge: -1
  pgno: 185
- img_proc: false
  md: 'bly the most commonly used block is the 192.168.nnn.nnn group. More discussion
    of these blocks of reserved addresses for LANs can be found in a bit. First, however,
    verify that you are communicating with the world using the Internet.


    Begin by assuming that you are setting up a single computer and want to connect
    directly to the Internet through your organization''s network, which has its own
    Internet connection. This section will show you how to add a LAN, and then discuss
    other complications that can occur after the first computer is connected correctly.
    Of course, if you have a system administrator to call, he or she has probably
    already taken care of everything. If not, read on.


    While Red Hat Linux 7 was being installed this morning, the installation program
    asked for information concerning your network. Specifically it asked for:


    +   - **Configure using DHCP.** A DHCP server on a network assigns a different
    unused IP address each time your PC connects to your network. If your network
    uses DHCP, press the button.

    - **IP address.** This is the static IP address of your computer or host, if DHCP
    is not used.

    - **Netmask.** The installation script attempted to enter this; be sure it is
    correct.

    - **Network.** The installation script attempted to enter this also.

    - **Broadcast.** The installation script attempted to enter this also.

    - **Hostname.** This is the name your ISP assigned your computer or host.

    - **Gateway IP.** This is the IP address assigned by your ISP for a gateway/router.

    - **Primary DNS.** A nameserver that may or may not be your gateway IP address.

    - **Secondary DNS.** A name server; at least one will be assigned.

    - **Ternary DNS.** A name server.'
