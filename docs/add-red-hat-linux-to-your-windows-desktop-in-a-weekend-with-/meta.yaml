    # Failsafe


    As indicated in the Login section earlier today, the Failsafe login option is
    a command line interface setting. If selected during login, a small terminal emulation
    window will open in the lower right corner of the screen.


    Note the description of the window in the previous paragraph: this is a terminal
    *emulation* window. X is still running, even if a desktop environment isn''t.
    This may appear to be a fine point, but it''s necessary to illustrate this distinction.


    Some programs are not meant to run from within X, such as sndconfig, which we''ll
    examine this evening in "Configuring Printers, Sound, and Other Devices." If you
    were to try to run sndconfig in the Failsafe mode thinking it''s the true Linux
    command line (which I actually tried way back in my novice Linux days), bad things
    may happen to your system, such as a system lockup.'
  merge: -1
  pgno: 148
- img_proc: false
  md: 'Basically, most applications that can run from the console (the true command-line
    mode) can also run in Failsafe mode. Any that can''t will warn you that they won''t
    run within X. At that point, you should heed the warning and exit the application.


    > > **TIP**

    > To access the Linux console while in any X mode, try pressing Ctrl+Alt+F1. To
    return to X from Linux, press Alt+F7.


    The best use I have found for using Failsafe mode occurs when I make a mistake
    while experimenting with video settings. By logging into X in Failsafe mode, I
    can start Xconfigurator up and easily repair the error.


    Now that you are familiar with the different login modes, a quick examination
    of the methods to configure your desktop is in order.


    # Configuring Your Desktop


    After you have taken the grand tour through the desktop and all that it has to
    offer, you may find some aspects of the desktop you want to change. For the remainder
    of this afternoon, placement of the tools that are available to you within the
    desktop will be discussed as well as another important aspect of desktop customization:
    desktop themes.


    # Menu Customization


    What if you don''t like digging through three or four menu levels to launch one
    of your most-used applications in Gnome? In a situation like this within Gnome,
    you can place the application launcher somewhere on the desktop so that you can
    start the program much more quickly.


    > > **BUZZ WORD**

    > *Launcher:* A menu item or icon that starts an application.'
  merge: -1
  pgno: 149
