  md: '+   2. Select All Devices and System Summary.

    3. Click OK. All of the information available to the Device Manager will be printed.


    You will find the printed document full of very technical information — most of
    which you will not need. Still, it saves time writing it all down.


    How will you know what is needed and what is extraneous? Just by using only the
    information asked for during the Red Hat installation. Everything else is just
    gravy.


    To successfully install Red Hat Linux 7, the most important information you need
    is for those devices that make your computer operable, as listed in Table 1.1.


    In addition to the critical hardware, other not-so-critical hardware types that
    may be part of your computer system should also be recorded in your journal. These
    hardware types are listed in Table 1.2.


    Most of the information you require is included in the Device Manager output you
    printed, but not all. For example, you can locate information on the amount of
    RAM installed on your computer by clicking the Performance tab in the System Properties
    dialog box. Another option might be to right-click on the hard drive icon displayed
    in My Computer or The Explorer, checking the Properties option to see how large
    your drive space is. A little detective work will go a long way toward making
    your Red Hat Linux 7 installation easier.


    # Checking Your BIOS for Information


    The type of BIOS used by your PC presents another potential compatibility issue
    when installing Red Hat Linux 7.


    The Basic Input Output System (BIOS) is firmware that exists on your PC regardless
    of what operating system you''re using. It exists primarily to take care of the
    really basic housekeeping functions of your PC. For instance, the BIOS controls
    which drive boots up first and how power is managed on your PC.'
