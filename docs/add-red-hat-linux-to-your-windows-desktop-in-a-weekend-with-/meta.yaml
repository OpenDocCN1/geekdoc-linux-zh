- img_proc: false
  md: '# # Printers


    Early computers did not communicate well. The first digital calculating device
    that could safely be called a computer was the Harvard Mark I, a five-ton, 750,000-component
    device that read its programming code from paper tape and its data from punch
    cards. Data was output on a similar medium.


    Multimedia was a bit of a wash as well. The only sound the Mark I generated was
    the internal clicking of its components, which sounded a bit like a “roomful of
    ladies knitting.” Hardly multimedia.


    For those of you old enough to remember the Apple I and II microcomputers released
    in 1973, you’ll recall that they weren’t big on multimedia, either. Little beeps
    and clicks were about all the sound they emitted. Printing was coming along, though,
    as dot-matrix printers wound out reams of perforated paper.


    Today, the number of communication devices that can be connected to PCs is phenomenal.
    Printers, speakers, television tuners, cameras, alarm systems . . . even cars.


    Well, you might get me on stating that cars act as peripherals for PCs — but how
    long until it no longer becomes a joke? Commercially available GPS signals can
    place you within about 50 yards of your true location. (Military signals are a
    lot more defined, so the technology is farther along than you might think.) Video
    devices can see and process digital input faster than you and I can think, and
    the proliferation of information that’s available now to assist motorists can
    be harnessed with ease — tying traffic, weather, and construction reports together
    to assist the driver’s route from point A to point B.


    In the meantime, you can focus on more immediate concerns, such as getting your
    own peripheral communication devices hooked up to your Linux PC.'
  merge: -1
  pgno: 194
- img_proc: false
  md: '# # Adding a Local Printer


    For example, think about how you can make a book on your PC. Right now. All you
    need are some good typing skills and about three cases of soda and you''re set.
    Believe me, I know.


    This may not seem like such a big deal to you, because you are likely accustomed
    to the PC-printer combination. But a mere two decades ago, there would have been
    little chance that you could find software and printer capable enough to perform
    such a feat. Thirty years ago, you would not have had a chance.


    Again, what''s the big deal? It''s just technological advancement, right? True,
    but it is also a huge shift in social dynamics as well. No longer is the ability
    to distribute and publish information in the hands of a select few. Now almost
    anyone with the will can generate published works. This democratization is aided
    by the nature of the Internet, which provides even more avenues of communication.
    Now a writer can generate work and send it electronically, letting the reader
    print it out as needed.


    Linux, like any other operating system worth its salt, can use printers seamlessly
    from any application with a print function. First, though, you need to be sure
    that communication occurs between Linux and your printer, whether connected directly
    or through a network.


    Printers can either be local to your own PC or can exist on a network. Either
    way, accessing them in Linux is not difficult, especially where you work with
    a local printer.


    Local printers are almost always connected to your PC''s parallel port — the device
    known as lp in Linux. In DOS and Windows, the ports are named LPT1, LPT2, and
    so on; in Linux they are given the nomenclature of lp, etc.


    It''s important to remember that Linux handles devices as extensions of its file
    system. Any files to be printed are first converted to something the printer can
    use through Ghostscript, a utility that uses an additional'
  merge: -1
  pgno: 195
- img_proc: false
  md: 'printer filter to perform the conversion. Once the conversion is finished,
    the data is then loaded into the device''s file system directory; i.e., the printer''s
    file system directory. Finally, the data is automatically read by the device (in
    this case, the printer).


    Now you will learn the steps necessary to connect a printer to your Linux system.


    +   1. Click the Main Menu icon to open the Main Menu.

    2. Choose Programs, System, Control Panel. The Control Panel will open (see Figure
