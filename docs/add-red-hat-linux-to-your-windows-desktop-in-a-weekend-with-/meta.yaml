  md: '# Starting the Red Hat Installer


    There are various ways to install Red Hat Linux 7. The easiest way is to use the
    official Red Hat 7 CD-ROMs that you can buy with the official boxed sets in most
    software stores.


    Red Hat Linux 7 is available in three flavors: The Standard, Deluxe, and Professional
    editions. The Standard edition contains the Red Hat Linux Installation Guide and
    Reference Guide, as well as a boot disk. You''ll find out more about this important
    disk in the next section, "Creating a Boot Disk".


    In the Deluxe and Professional editions, a CD-ROM set of Linux workstation applications,
    PowerTools, is included for your use. The Professional edition also includes a
    bonus pack of server applications and additional Web building tools.


    Since Red Hat Linux can be obtained from sources other than a boxed Red Hat Linux
    set (including the CD-ROM that came with this book), you may need to get some
    of these additional resources in some other fashion. If you can''t get a boxed
    copy, or don''t want to lay out the cash, there are some methods you can use to
    get the tools you need.


    > NOTE: A great place to learn about downloading Red Hat Linux is http://www.redhat.com/download/howto_download.html.


    The documentation included in the boxed set is freely available in HTML or Acrobat
    PDF format on the Web at http://www.redhat.com/support/manuals/.


    You will not find the additional software packaged together all in one place as
    you will in these boxed sets, but a quick check of Linux-related Web sites will
    point you to the same tools and more. For example, you'
  merge: -1
  pgno: 75
- img_proc: false
  md: 'can find StarOffice, a very robust office suite application that''s fully compatible
    with Microsoft Office, at http://www.sun.com/staroffice.

    The final component needed to duplicate any of the boxed sets is the boot disk,
    which will be detailed in the next section.


    # Creating a Boot Disk


    The most important resource you''ll need besides the Linux program CD-ROMs is
    the boot disk. Without your own copy of the boot disk, you could have difficulty
    installing the software.


    > **Boot disk:** A floppy disk that contains Linux system files that allow users
    access the Red Hat Linux CD-ROM *before* any other operating system is loaded.


    The reason a boot disk is required is that Linux cannot be installed from within
    another operating system, and must be run beginning right after a PC starts, before
    anything else loads. Many PCs cannot start directly from a CD-ROM drive, but can
    start from the floppy drive. Have you ever noticed the sound of the floppy drive
    rattling when your computer powers up? That''s the BIOS looking for a boot disk
    in the drive.


    > If you are fortunate enough to have a bootable CD-ROM, then you do not need
    a boot disk. Simply insert the Red Hat Linux CD 1 into your CD-ROM and restart
    the computer. The installation program will then begin automatically.


    The boot disk contains just enough Linux commands to start a mini-version of Linux,
    including the instructions that enable Linux to recognize and run your CD-ROM
    drive. At that point, you can "jumpstart" the full installation program into action.'
  merge: -1
  pgno: 76
- img_proc: false
  md: '# Procedure


    Use this procedure to make your own boot disk:


    +   1. Format a 3.5-inch disk and leave it in the floppy drive.


    +   2. Insert the Red Hat Linux CD 1 into the CD-ROM drive.


    +   3. Start an MS-DOS window by selecting Programs, MS-DOS Prompt on the Start
    menu.


    +   4. Type *<drive letter>*:\, where *<drive letter>* is the letter of your CD-ROM
    drive.


    +   5. Type cd \dosutils. You should now be in the dosutils directory on the CD.


    +   6. Type rawrite. The rawrite application will start.


    +   7. When prompted for a disk image source, type ..\images\boot.img.


    +   8. When prompted for the target diskette drive, type *<drive letter>:*:, where
    *<drive letter>* is the letter of your floppy drive.


    +   9. Press the Enter key when prompted. The Red Hat Linux boot instructions
    will be copied to your floppy disk.


    **TIP**


    If you later chose to use the Custom installation path, you''ll be prompted to
    create another copy of the boot disk. Since having more boot disks is safer, you''ll
    want to go ahead and make a second one at that time.


    # Navigating the Installer


    You''re ready to begin now. You have all your information gathered, disks ready,
    and a cute stuffed penguin for luck sitting on your desk. It''s time.


    Insert the Red Hat CD-ROM 1 into your CD-ROM drive and then shut down your computer.
    If you do not have a bootable CD-ROM drive, insert the boot disk into the floppy
    drive while the computer is off, then turn it on again. Your computer will begin
    the boot process, starting from'
  merge: -1
  pgno: 77
- img_proc: false
  md: 'either your CD-ROM or floppy drive. It will boot using the instructions on
    the CD-ROM or floppy disk rather than continuing to your hard drive and consequently
    loading your usual operating system.


    Once the computer recognizes the bootstrap code from the floppy disk or CD-ROM
    drive, it will start Anaconda, the Red Hat installation program. The very first
    screen of Anaconda is shown in Figure 2-1. As you can see, it’s rather plain,
    but it prompts you to make a significant decision.


    You can choose from three installation options (sometimes termed “installation
    classes”) when installing Red Hat Linux 7. The first is the graphical mode, which
    is a Windows-like installation that is certainly the easiest to use. The second
    option, text mode, is slightly less robust than the graphical mode. It will also
    get the job done.


    The final option is the expert mode. For now, I suggest that you stay away from
    this one. You should really only use expert mode if Linux has trouble detecting
    the hardware you need to run the installation program such as the CD-ROM drive
    and the hard drive. Such an event is rather rare. You should be able to press
    Enter at this screen to start the graphical installation mode.


    ![](bbox=[0.1, 0.65, 0.9, 0.95])'
