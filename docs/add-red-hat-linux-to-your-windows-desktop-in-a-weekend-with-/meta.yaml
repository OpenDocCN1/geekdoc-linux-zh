    # Configuring Your Accounts


    Whenever a Linux system is created, the root account must be created as well.
    The root account is the administrator account for the Linux PC. Since you use
    the root account to make modifications to the operating system settings, it''s
    the most powerful account on the system. All you need to do to set up the root
    account is to enter the same password in both the Root Password and Confirm fields.
    The Confirm field entry ensures that you have not made a typographical error in
    the password.


    If you will have additional users on the system, it''s a good idea to create additional
    user accounts for them now. User accounts are analogous to user profiles found
    in Windows. They allow certain users to have customized access to a Linux system
    and provide the additional security of knowing who''s doing what on the system.


    As you can see in Figure 2-8, to create a user account, type a user ID in the
    Account Name field, supply a password, and the user''s full name. Similar to creating
    the root account, you''ll need to type the password twice to ensure that no typos
    occur. Clicking the Add button will finish the process.'
