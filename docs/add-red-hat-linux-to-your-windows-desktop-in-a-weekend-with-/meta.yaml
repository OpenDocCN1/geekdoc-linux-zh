  md: 'Non-Linux users are often a bit confused at first about which components make
    up X. In the Microsoft Windows environment, you have the DOS operating system
    with the Windows operating system interface running on top of it, as illustrated
    in Figure 3-9. Running on top means that Windows is essentially one big program
    that runs from the DOS platform—really no different than running a program like
    Doom. The upshot of this is that you must have DOS running in order to run Windows.


    For Windows NT users, it''s a bit more simplified. Windows NT and Windows 2000
    are true graphical user interfaces that run on their own. The advantage here is
    that you really do get what you see. You can still run DOS when you have to, but
    in Windows NT and 2000, a DOS emulator runs within Windows. One disadvantage to
    Windows NT is that your PC must have a lot more memory and speed to run as efficiently
    as a comparable Win98 system.


    > **BUZZ WORD** *Emulator:* A program that can mimic the look and feel of another
    operating system.


    As mentioned earlier in the book, the Linux system you have just installed is
    most analogous to the DOS/Windows system. Like DOS, Linux is a text-based command
    line operating system (albeit a *much* more sophisticated one). You can perform
    a great many functions using just the Linux operating system, and many people
    do. Many more people, however, have been bitten by the GUI bug and are accustomed
    to using windows, menus, and dialog boxes to get things done.


