  md: '# Adding Internal Devices


    Internal devices are more difficult to install only because they require you to
    work inside your computer case. Thankfully, very few devices still need to be
    added in this way. With the advent of external removable devices such as the Iomega
    Zip drive and the universal serial bus (USB), it isn''t necessary to crack open
    the case of computers nearly as often. The most common internal devices are sound
    cards, network cards, and hard drives. In most systems, you can also add memory,
    change the motherboard, or even upgrade the CPU, although I would advise you against
    doing so unless you know exactly what you are doing. There are factors to consider
    when changing a CPU and memory such as bus speed, clock multiplier, and memory
    timing. For a fee, local computer stores will gladly install any internal device
    you require. This section will briefly show you how to add the three most common
    internal hardware devices yourself.


    First, for your physical safety, you must turn off your computer''s power. This
    warning is especially important when working with internal devices, since you
    can literally blow up your motherboard or CPU if you try to install internal hardware
    with the power still on. Once you have removed the screws on your system''s case,
    you can add the device in an empty slot. If you want to add a device that has
    a standard card, you simply have to insert it next to the other cards in your
    system. Any slot on the PCI bus (the white ones) will work for a PCI card, any
    slot on the ISA bus (the black ones) will work for ISA cards, and video cards
    may go in the recently introduced AGP slot (the gray one). It''s easy to determine
    the three types of slots because each has a different size and color. Just as
    you can''t plug a square peg in a round hole, you can''t plug one type of card
    into another type of slot by accident.


    A hard drive is typically added near the front of the system, grouped with the
    existing hard drives and CD-ROM drives. After positioning the drive, you must
    connect the power cable and its ribbon. Ribbons connect the drive to its controlling
    card. (If working with a SCSI hard drive, the SCSI'
  merge: -1
  pgno: 235
- img_proc: false
  md: 'controller is either on your main board or on a slotted card.) Be sure to refer
    to the manual for your device for proper installation procedures.


    # The Kernel Boot Process


    After you restore the power, some program code executes to detect and configure
    devices.


    The first code executed when a PC starts is the bootstrap code. This is a small
    program located in ROM (static memory) inside your computer. The code checks the
    internal system parts to see if any major failure is detected, such as memory
    corruption. Control then passes to the BIOS. When your system starts, you can
    see the memory test as the memory counts up to the amount of RAM you have in your
    system. The BIOS is the heart of your computer''s input/output (I/O) subsystem.
    Its job is to detect the system components at start time and to work with the
    operating system to handle device calls. The code that appears on your monitor
    just after the video card name and before Linux starts is part of the BIOS. You
    may see a list of hard disks and then an information screen about your main system
    components. The BIOS is responsible for first detecting your hard disks, determining
    which one contains the kernel you want to boot, and optionally configuring any
    Plug and Play devices.


    After BIOS completes various functions, it passes control to the first sector
    of your bootable hard disk (known as the MBR [Master Boot Record]). In older versions
    of MS-DOS or Windows, the MBR was used to contain DOS-MBR. In Red Hat Linux, it
    now contains LILO, the Linux boot loader, which simply tells the processor to
    load your Linux kernel.


    > **NOTE** LILO can, in fact, do much more, such as set a password, load many
    operating systems, and set geometry information for Linux. For the purpose of
    this morning''s chapter, we''ll assume that only the kernel is loaded. You can
    find more information on LILO on your Linux system by typing **man lilo**.'
  merge: -1
  pgno: 236
- img_proc: false
  md: 'Once the BIOS and LILO have finished executing, the more complex part begins.
    The Linux kernel takes over to detect, configure, and manage all of the internal
    and external devices. It does so using complicated data structures, device drivers,
    and kernel processes. Without going into too many details, the following paragraphs
    describe the kernel start up routine and how you can correct problems along the
    way.


    All of the text that appears on the screen before you see the first Linux prompt
    explains what is being found by the kernel and various device drivers. It is important
    for you to understand that text so that you can later troubleshoot any hardware
    problems. A possible example appears in Figure 5-18.


    The first line you see reports the kernel version and the version of the compiler
    that built it. It isn''t really important to know this information unless you
    later want to recompile your kernel. Next, the speed of your CPU appears. The
    kernel detects that speed at boot time. It should be pretty close to the speed
    you know your CPU to be. For example, the CPU on the system could be a 333MHz
    Intel Pentium II. The kernel detected a speed of 334MHz, which is pretty close.


    ![](bbox=[0.221, 0.645, 0.891, 0.922])


    Figure 5-18


    The boot process can inform you of any potential problems.'
  merge: -1
  pgno: 237
- img_proc: false
  md: 'The console line only tells you the currently used display font. You can set
    your Linux console to display any other font, but the default is standard fixed
    VGA 80 columns by 25 lines. You should ignore the line about BogoMIPS. It commonly
    is not the same as your CPU speed, and that is quite normal.


    One very important line is the memory line. Here, the kernel is reporting how
    much RAM it detected in your system. This is a place where the kernel may be mistaken,
    especially if you have more than 128MB (megabytes) of memory, or if you have an
    old system. The details as to why this happens are unimportant, but it is easy
    to fix. For example, if you see a number near 16,000K and you really have 24MB
    of RAM, you will need to correct the lilo.conf file.


    So, sticking with the example, if Red Hat Linux detects 16MB and you know you
    have 24MB, add the following line to the lilo.conf file:


    ```

    append = "mem=24M"

    ```


    The next lines display information gathered about your CPU. When the kernel has
    finished setting up the main hardware, it passes control to device drivers. Device
    drivers are small portions of code that can set up and control a particular device.
    For example, to handle a Sound Blaster card, you need a Sound Blaster-compatible
    sound driver. There are also less specific drivers that deal with things such
    as networking and your serial devices. All of these drivers are loaded at start
    time.


    You should print the boot messages and read them all at least once. This will
    help you know your hardware a bit more and can help you diagnose problems. If
    you can''t print messages while your system is booting, you can always review
    them by typing the **dmesg** command at your Linux console. If you have a printer
    attached, you can print the messages using the command **dmesg lpr**.'
  merge: -1
  pgno: 238
- img_proc: false
  md: '# # What Is Auto-Detection?


    The device drivers must configure your hardware to work with Linux. However, these
    drivers must first find the hardware. Linux has a very good auto-detection process.
    In this process, drivers will look for devices at likely places. For example,
    the NE2000 networking card driver knows that such a card will most likely be located
    at I/O address 0x300, 0x280, 0x320, 0x340, 0x360, or 0x380. It will probe these
    addresses to see if a card can be found. If found, a message will appear on the
    screen when your system starts. If your card is at another address, however, the
    driver may not find it and you must tell the driver where to look. You can find
    these settings using a variety of methods. If you have older hardware, you can
    alter settings using jumpers on the board itself. You can usually find the default
    settings in the board''s manual, including the method used to change them.


    Red Hat Linux also has the utility Kudzu that attempts to detect new hardware
    on startup. Kudzu is an advanced form of device auto-detection. This little program
    keeps a database of installed hardware and, when the system starts, compares the
    installed hardware with the database. If new hardware is detected, Kudzu should
    allow you to configure it. Currently, this utility does not make your job much
    easier if the Linux kernel doesn''t detect your device, but I believe that Red
    Hat will be moving in that direction in the future. You can review the database
    by looking at the file /etc/sysconfig/hwconf.


    # # Configuring Your Devices


    In the following sections, you will see how to configure any new hardware devices
    that you have added to your system. First, we''ll run through the devices most
    likely to be detected at boot time, then focus on those that may need more attention
    from you.


    The main devices in a system have device drivers already compiled in the kernel.
    These devices will be detected on system startup. These include'
  merge: -1
  pgno: 239
- img_proc: false
  md: '# SUNDAY MORNING Adding to Your Linux System


    your CPU, memory, monitor, video card, floppy drive, IDE hard disks, and most
    CD-ROM drives, which means that most of the times you needn''t worry about them.
    This section focuses on those devices that may not be so easily detected.


    If a device is not detected at startup time, you first must determine whether
    the driver for that component was loaded. A driver can be loaded in two ways:
    by being compiled into the kernel itself, or by being loaded as a module. While
    this may seem complex, Red Hat has made it very simple for most devices. In your
    Red Hat Linux system, you have several graphical utilities that enable you to
    easily configure new devices. Since most drivers have been compiled into modules,
    you will seldom need to recompile your kernel.


    To know if a device has been detected, you can use the command `cat /proc/devices`.
    This command lists all devices detected by your Linux system that use an IRQ detected.


    # Conclusion


    This morning you examined two primary methods used to get new software on your
    PC: RPMs and setup applications. As Linux grows in popularity, you can expect
