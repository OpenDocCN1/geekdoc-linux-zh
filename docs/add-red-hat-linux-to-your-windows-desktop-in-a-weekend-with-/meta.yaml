    # Configuring Netscape Navigator


    In the olden days of the Internet (all of seven years ago), life was uncomplicated.
    The simple concept of hyperlinks on a text page was just emerging. Some links
    went to other pages; others to files to be downloaded—perhaps a picture or two.
    Browsers such as Lynx only had to contend with text—life was good.


    In 1993, everything changed forever. The National Center for Supercomputing Applications
    (NCSA) at the University of Illinois created Mosaic—a browser capable of displaying
    text and pictures. Suddenly, users could see illustrated Web pages, which facilitated
    the flow of information. A year later, one of the Mosaic developers left NCSA
    and launched his own browser—Netscape Navigator 1.1.


    Since then, the capability of browsers has grown even more in response to more
    complex content. Need to hear a sound file? No need to download, save, and then
    play the file with another application. Browsers now begin to either play the
    sound themselves or automatically start that third-party application for you.
    Need to view a Shockwave file? Not only will a browser display it for you, the
    browser can automatically go get the required viewer if you don''t already have
    it.


    These sophisticated features are a long way from the early Internet days, that''s
    for sure.'
