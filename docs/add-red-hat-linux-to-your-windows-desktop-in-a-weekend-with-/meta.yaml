  md: '276 Add Red Hat Linux 7 to Your Windows Desktop in a Weekend


    # Security Alert


    You can easily access files on remote Unix or Linux systems without the necessity
    of configuration steps or rebooting. First, make sure the remote system is running
    the NFS server and is allowing you to access its files. You need to specify the
    remote system in /etc/exports. (You can find a good example in the exports man
    page.) When the remote system has your system in its exports file, you can simply
    mount the remote directory the following way:


    ```

    mount -tnfs 1.2.3.4:/remote-directory /mnt/remote

    ```


    As you saw in the previous command, you specify the IP address of the remote system,
    and the mount command handles the rest. NFS is one of the oldest methods to share
    files, and it remains easy to use.


    Because security is such an important topic, additional discussion is merited
    to help in your attempts to keep your system safe. If possible, install ssh, the
    Secure Shell. ssh can replace, in a secure, encrypted manner, the Telnet and FTP
    services. All of the communication through ssh is encrypted. Further, to connect
    to your system, a user must also have the ssh package.


    Some people have reported speed problems on PPP dial-up connections. For example,
    they use a 56K bits per second (bps) modem, but actually connect at much lower
    speeds. The principal program used to make a PPP dial-up connection is PPPd, which
    will attempt to connect at a default speed of 33800 bps. If you want a higher
    rate, it must be specified. Many graphical dial-up clients allow you to specify
    a default speed. Alternatively, by calling PPPd manually, you can specify a default
    speed on the command line. Note that if you specify an invalid speed, the dial-out
    program will go back to its default speed of 33800 bps. See the PPPd man page
    to see the configuration settings.


    Another reason for speed losses is the number of unwanted packets on the line.
    The Internet uses many protocols, and one of these is ICMP. This protocol is of
    no use to you unless you are running a server or router. You can use the ipchains
    command to disable it.'
  merge: -1
  pgno: 303
- img_proc: false
  md: 'Internet hostnames are resolved to IP addresses using the Domain Name System
    (DNS). For this to work, you must have access to a DNS server. In your netcfg
    utility, you can specify one or more addresses for name servers. These are the
    servers that will resolve the hostnames. You should specify more than one, in
    case your primary name server goes down. You can also specify the name servers
    in the file /etc/resolv.conf.


    Your system probably has many Internet ports opened: one for Telnet, another for
    DNS, and one for the FTP service. To see a list of all opened ports, type the
    command:


    ```

    netstat -an

    ```


    This command will list every open port and every host connected to your system.
    Ports are only numbers. You may see numbers you don''t recognize and want to know
    which service is using a port. The fuser command will tell you that information.
    For example, if you want to know which service is using the UDP port number 1024,
    type:


    ```

    fuser -v -n udp 1024

    ```


    fuser reports the process using that port and the user who owns the process.


    # Conclusion


    There was a lot of information jammed into this chapter, and ideally you found
    the solution to your needs. If you still need additional help, be sure to check
    out Appendix B, “Online Resources,” to find more sources of information.


    The weekend is almost over now, and you have completed a pretty significant task:
    the installation of Red Hat Linux. Now it''s time to sit back, put your feet up
    and play one more game of Reversi before going to bed.


    Good night!'
  merge: -1
