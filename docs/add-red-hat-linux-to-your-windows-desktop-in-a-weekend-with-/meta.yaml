  md: '# 266 Add Red Hat Linux 7 to Your Windows Desktop In a Weekend


    > **TIP** To get the text version of the LILO prompt, type Ctrl+x when the blue
    graphical LILO screen appears.


    This command launches the Linux kernel and sets the init parameter to /bin/sh.
    This allows Linux to bypass the boot scripts, which may be faulty, and launch
    a console shell as root. You are then allowed to make modifications to your system
    in the console. This can be useful to repair problems, but it can be a big security
    hole. Anyone is able to use this (and many other tricks) to access your system
    and read your data. Physical access to your system is required, so the solution
    is to make sure your system is as off-limits as possible to undesirable people.
    You can set a BIOS password if you want a more secure system, but this still doesn''t
    prevent someone from opening the system and removing the drive. Security is a
    huge subject—beyond the scope of this book—but you should be warned that anyone
    with physical access to a system can get data from it.


    One of the most disconcerting problems is signaled when you boot your system and
    receive the error message:


    ```

    VFS: Can''t mount root filesystem

    ```


    This means that the partition on which the Linux kernel is found could not be
    mounted. There are three common causes for this error.


    If you recompiled your kernel and forgot to add basic features like IDE support
    and you use IDE disks, the kernel can''t read the disk at all.


    This message might also appear if you forgot to include support for ext2, the
    Linux file system. The disk will be read, but the kernel won''t understand the
    file system.


    Finally, you''ll see this error message if the drive has failed. If the hard disk
    has died or if the controller has problems, then the kernel may not be able to
    read the entire disk. In these situations, you must use the rescue disk to boot
    your system. You can then begin to investigate the problem.'
