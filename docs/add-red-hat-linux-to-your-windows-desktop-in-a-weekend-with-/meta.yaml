  md: 'After you master these skills, you will be able to add new applications and
    peripherals to your Linux system anytime you want.


    # Installing Software Packages


    One of the biggest complaints heard about Red Hat Linux (and Linux in general)
    is its apparent lack of software applications. What good is an operating system
    that doesn''t run anything useful?


    First off, this is simply not the case. As experienced Linux users know, thousands
    of applications run on Linux. The misconception lies in the fact that many of
    these applications are either very, very specific in their performed tasks, or
    they are designed to run completely in the background from the command line. In
    either case, it becomes a case of "out of sight, out of mind." A Linux application
    is not perceived as "real" by an inexperienced observer unless that observer can
    see and manipulate the application. This novice mentality infuriates long-time
    Linux users --- and for good reason, since there are thousands of perfectly good
    apps ready for the Linux platform.


    When you install one of these many applications on Red Hat Linux, there are three
    ways of accomplishing the task: using packages, using the original source code,
    or using a third-party setup program. Each of these methods will be examined this
    morning.


    # Understanding Packaging


    Nothing is more exciting than opening a new package. (Okay, well, a few things
    are more exciting.) You must admit, however, it''s kind of cool to crack open
    that cardboard box and riffle through the Styrofoam peanuts to find that special
    item you''ve always wanted.


    Packages are great ways of moving objects around. They keep items together and
    they keep the items protected from both the elements and postal workers. The idea
    of a package can be used electronically as well. Many of you have already used
    compressed files, such as Zip, gzip, or tar.'
  merge: -1
  pgno: 217
- img_proc: false
  md: '# **SUNDAY MORNING** Adding to Your Linux System


    These compressed files are essentially packages of separate files that are all
    mashed together into one compact file, like that box of peanuts.


    Red Hat has developed a methodology to package the open source code of Linux and
    its applications into packages as well. This method has proven so popular that
    many of the other Linux distributions have incorporated it into their toolsets
    as well. This method uses the RPM (Red Hat Package Manager) to track packages
    and their contents during application installation.


    RPM comes in many forms. Within Linux, it is known simply as RPM; in Gnome, it
    is GnoRPM; and in KDE, it''s referred to as Kpackage. Regardless of its form,
    the procedure the application follows is always the same: Linux examines a package
    and RPM determines whether all of the files necessary for the application to function
    are contained within the package or anywhere else on your Linux system. This procedure
    is called a dependency check, and it''s one of RPM''s great features.


    The average application requires a lot of code to run, especially in a graphic
    environment. If all of the necessary code were included within every application,
    the executable files would be huge. To circumvent this, programmers often make
    use of code libraries, which are essentially redundant pieces of code necessary
    or useful to all applications. Why make a section of code to create a dialog box
    when a library of code already has the appropriate information? As a programmer,
    now all you must do is create a command in your program that references the necessary
    code in the correct library. Thus, your application is smaller, faster, and easier
    to install.


    The catch in all of this is that the user''s PC must have the correct type and
    version of the code library present for use by the application. This is where
    RPM comes in handy. RPM looks at the packaged application and determines what
    code libraries (or any other helper application) are required for the packaged
    application to work. The neat thing is that RPM will look at all packages on your
    PC. If something is missing, it tells you what you still need to perform a successful
    installation.'
  merge: -1
  pgno: 218
- img_proc: false
  md: 'Finally, after the dependencies have been cleared, RPM will enable you to install
    new applications or upgrade existing ones. The next two sections will examine
