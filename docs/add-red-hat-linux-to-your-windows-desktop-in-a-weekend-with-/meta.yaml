    # ## Adding a Network Printer


    Getting to a printer on a network is no big deal, either. There are three types
    of network printers that Linux can be configured to use:


    +   - UNIX/Linux printers

    - Windows printers

    - Netware printers


    Configuring these printer types is similar to configuring a local printer. However,
    rather than pointing the data to a device directory in the local file system,
    the data is directed to a remote printer''s queue—the storage area where print
    jobs are held until printed.


    Table 4-2 illustrates the information you will need to connect to a remote printer
    for each network type.'
  merge: -1
  pgno: 200
- img_proc: false
  md: 'Table 4-2 Remote Printer Settings

    | Network | Protocol | Other Values |

    | :--- | :--- | :--- |

    | UNIX/Linux | TCP/IP | Remote Host<br>Remote Queue |

    | Windows | TCP/IP | Hostname of Printer Server<br>IP Number of Server<br>Printer
    Name<br>User<br>Password<br>Workgroup |

    | Netware | Netware | Printer Server Name<br>Print Queue Name<br>User<br>Password
    |


    When printing to a network printer, it is important that the network recognize
    the user name and password of the Linux user. In a UNIX or Linux scenario, this
    is a given; but you must make sure the incoming Linux user has access rights to
    the network print queue.


    In Netware, the user must have rights to access a network printer. In Windows,
    the printer itself must be set to be “shared” first, as you will see in the following
    steps.


    > **CAUTION** The user names and passwords used to access a remote Netware or
    Windows printer must be different from any user names and passwords that access
    your Linux PC. The printer passwords are stored unencrypted before being used
    by Netware nprint or the Samba smbclient programs. Be creative!'
