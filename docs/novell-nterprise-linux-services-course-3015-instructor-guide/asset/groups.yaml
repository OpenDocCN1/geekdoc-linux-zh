    # ### How to Access the iFolder Web Sites


    After you install and configure iFolder on your server, your users can download
    and install the iFolder client and then log in to the iFolder server.


    The first time the users log in with the iFolder client, they activate their iFolder
    accounts, providing that their accounts have already been enabled in the iFolder
    Management console.


    After iFolder has been installed on your server, you have access to the following
