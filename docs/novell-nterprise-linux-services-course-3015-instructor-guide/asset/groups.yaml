    \ Office | Virtual Office 是一个 Web 访问门户，允许远程用户与工作组团队进行协作和信息共享。<br><br> Virtual\
    \ Office 通过允许用户自行设置和管理许多网络、信息共享和数据备份过程，优化了用户的自助服务概念。<br><br> Virtual Office 还允许用户创建自己的功能团队，称为\
    \ Virtual Teams，以便进行交互式实时协作。<br><br> 加入虚拟团队的人员可以访问共享文档、讨论帖、书签和团队日历。团队的所有成员都可以访问团队信息和服务。\
    \ |\n| **1. 描述 Virtual Office（续）** | - 使用 Virtual Office，用户可以<br>- 定位并设置打印机<br>-\
    \ 设置和维护密码<br>- 备份信息<br>- 与其他用户和组进行实时通信<br>- 发布个人 Web 页面，以便向其他用户提供信息<br>- 使用任何启用\
    \ Web 的设备从任何位置访问重要信息<br>- 将 Web 页面加入书签 |\n| 2. 安装 Virtual Office | 安装 Novell Nterprise\
