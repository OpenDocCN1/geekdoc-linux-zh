  - '[PAGE 38]


    ![](img/d63035f3fce0eaaf97203dde900affb7_38_0.png)


    If you are doing a subcontainer search, you must assign the CN property to the
    eDirectory [Public] trustee or create an LDAP proxy user. Any rights assigned
    to the [Public] trustee are automatically inherited by all other objects in the
    eDirectory tree.


    You might not want to assign the CN property to the [Public] object if these rights
    will cause a security risk.


    If your iFolder server is outside the firewall and you do not want the CN property
    assigned to all objects in your NDS tree, you can also use an LDAP proxy username
    to search the subcontainers of your tree.


    +   e. (Conditional) If you want to add additional contexts to search, select
    **Add**.


    +   f. Save these default user authentication settings by selecting **Update**.


    Multiple users with the same CN in different contexts prevent the user from successfully
    authenticating to the iFolder Server. Only users with a unique CN (Common Name)
    are able to authenticate.


    +   4. Enable users to access iFolder:


    Before users can use iFolder on their local workstations, you must first enable
    their user objects in the iFolder Management console.


    Users can have only one account associated with a given user ID. However, users
    can have multiple accounts under different user IDs.


    After a User object is enabled, instruct the user to log in to the iFolder server
    to create an iFolder account.


    The iFolder account is created the first time a user logs in to the iFolder server
    via the iFolder client, the Java applet on the iFolder Web site Login, or NetDrive.'
