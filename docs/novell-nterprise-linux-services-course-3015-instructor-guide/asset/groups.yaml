  - '[PAGE 34]


    # # Post-Installation Configuration Tasks


    After installing iFolder, you need to configure your iFolder server using the
    iFolder Management console (available from iManager).


    The following tasks need to be completed:


    +   - User context must be defined in the iFolder Management console.

    +   - User objects must be enabled in the iFolder Management console.

    +   - Users must log in to the iFolder server with the iFolder client to create
    their iFolder accounts on the iFolder server and to create their local iFolder
    home directories.


    ![](img/d63035f3fce0eaaf97203dde900affb7_34_0.png)


    The following steps show you how to configure your first iFolder server if LDAP
    and the iFolder server are running on the same computer.


    For information on configuring additional iFolder servers, or configuring iFolder
    when LDAP is running on a different computer, see the “Novell iFolder Installation
    and Administration Guide” available at http://www.novell.com/documentation.


    Do the following:


    +   1. Display the iFolder Management console in a web browser by doing one of
    the following:

    +       - Enter the following in a web browser:

    +         https://IP_or_domain/iFolderServer/Admin

    +         where IP_or_domain is the IP address or DNS domain name of your iFolder
    server.

    +         If you specified different ports during the installation, append the
    IP address of the server with a colon followed by the port number (such as

    +         https://192.168.1.1:81/iFolderServer/Admin).'
