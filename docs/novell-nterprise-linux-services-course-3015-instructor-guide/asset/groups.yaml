    \ 的作用和功能\n- 6. 安装和配置 NetStorage\n\n### 简介\n\n大多数用户在多台计算机上工作，以创建、管理和使用他们的个人文件。然而，在所有这些不同的计算机（可能运行不同的平台）上访问、存储、管理和同步这些文件可能是一项艰巨的任务。\n\
    \nNovell Nterprise Linux Services 从 Linux 服务器提供以下文件服务：\n\n- **Novell iFolder。**\
    \ 此产品提供工作站与中心 iFolder 服务器之间文件的访问、存储和同步。\n- **NetStorage。** 此产品通过浏览器提供对网络中 Linux\
    \ 服务器上的文件和文件夹的安全基于 Internet 的访问。\n- **Samba。** 此产品使用 Microsoft® SMB/CIFS 网络协议提供\
    \ Windows® 兼容的文件共享。\n\n在本章中，您将学习 iFolder、NetStorage 和 Samba 如何帮助您提供网络文件访问和管理解决方案。\n\
    \n## 目标 1\n### 描述 iFolder 的用途和架构\n\nNovell iFolder 是一个 Net 服务软件解决方案，它允许移动专业人士在任何地方——在线、离线、全天候——跨多台工作站和\
    \ Net 访问他们的本地文件。\n\niFolder 自动且智能地更新您在台式机、笔记本电脑和其他连接设备上使用的文件，让您可以在任何地方使用它们——在办公室、在家或在酒店。\n\
    \n您只需一个活动的网络或 Internet 连接以及 iFolder 客户端、Web 浏览器或 NetDrive 即可。\n\n对于用户而言，iFolder\
    \ 就像一个可从任何计算机访问的单一虚拟工作文件夹。它提供了一种简单、方便且安全的方式来访问、备份和同步文件。\n\n当连接到 iFolder 服务器时，iFolder\
    \ 会自动将本地文件上的工作备份到 iFolder 服务器上的账户。如果本地数据丢失，文件始终受到保护并且可以轻松恢复。\n\n如果用户转移到不同的位置和使用不同的计算机，iFolder\
    \ 会自动同步这些文件以反映在其他地方完成的工作——无需手动磁盘复制或文件传输。\n\n要描述 iFolder 的用途和架构，您需要了解以下内容：\n\n\
    - iFolder 优势\n- iFolder 特性\n- iFolder 组件\n- iFolder 架构\n\n### iFolder 优势\n\n分析师一致认为，高达\
    \ 80% 的公司关键业务数据存放在 PC（台式机和笔记本电脑）上，而不是网络存储中。\n\n然而，高达 96% 的所有商务 PC 都没有进行备份（战略研究公司）。\n\
    \n根据 IDC 数据：\n\n- 美国、西欧和拉丁美洲的移动劳动力预计将从 2001 年的 3470 万增长到 2004 年的 6080 万。\n- 销售给商业组织的\
    \ PC 中有 35% 是笔记本电脑。\n\n"
