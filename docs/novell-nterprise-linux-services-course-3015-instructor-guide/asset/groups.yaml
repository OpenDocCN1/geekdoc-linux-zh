  md: "\n# Table 6–4\n\n| Section | Entry Name | Description |\n| :---- | :---- |\
    \ :---- |\n| [homes] | comment = | This specifies the name that appears after\
    \ the Samba server name in Network Neighborhood on the Windows client. If this\
    \ and the following 2 entries are set as specified, there is no need to specify\
    \ individual shares for users' home directories. **Default:** comment = Home Directories\
    \ |\n| | browseable = | This specifies whether all the home directories will appear\
    \ in Network Neighborhood. **Default:** browseable = no |\n| | writable = | This\
    \ specifies whether users can create and modify files. **Default:** writable =\
    \ yes |\n| Shares (optional) | [Share Name]<br>path =<br>read only = | You can\
    \ create new shares by adding entries of this type to the smb.conf file. **Example:**\
    \ [DATA]<br>path = /export/data<br>read only = no<br>The simple example creates\
    \ a new share called DATA at the point /export/data in the local file system.\
    \ This share is exported with Read/Write access.<br>There are many other options\
    \ that can be set for a share. See the Samba documentation at http://www.samba.org.\
    \ |\n\n## Configure the ldap.conf File\n\nSamba on Linux uses the OpenLDAP client\
    \ libraries libldap.so and libldap_r.so. ldap.conf is the configuration file for\
    \ OpenLDAP.\n\nIn compliance with Linux Standards Base (LSB) requirements, Novell\
    \ places the ldap.conf file in the /etc/opt/novell/openldap directory on the NNLS\
    \ server.\n\nIf you install the NNLS server into an existing tree, you must specify\
    \ a trusted root certificate during NNLS installation. The ldap.conf file on your\
    \ NNLS server will then have the following certificate-related entries:\n\n- TLS_CACERT\
    \ /etc/ssl/certname.cert\n- TLS_REQCERT demand\n\nIf you are installing a new\
    \ directory tree, the ldap.conf file will have the following entry:\n\n- TLS_REQCERT\
    \ allow\n\nFor more information on the ldap.conf file, see the ldap.conf man page.\n\
    \n## How to Access Files Through Samba\n\nOnly users defined as Linux User Management\
    \ (LUM) users can authenticate through the LDAP server and access Samba files\
    \ on the NNLS server.\n\nThe following illustrates the three options for accessing\
    \ Samba files:\n\n### Figure 6-15\n\n![](img/d63035f3fce0eaaf97203dde900affb7_93_0.png)\n\
    \n1. Windows users can access Samba files using Windows Explorer:\n    a. Users\
    \ navigate to the Samba share in the normal way.\n    b. Files on the NNLS server\
    \ are accessed and maintained using Microsoft’s CIFS protocol.\n2. Windows users\
    \ can also access Samba files by creating a Web folder.\n    a. Users create a\
    \ Web folder to the Samba server in the normal way.\n    b. Files on the NNLS\
    \ server are accessed and maintained using the HTTP-WebDAV protocol.\n3. Browser\
    \ users can also access their Samba files for downloading to their local file\
    \ systems.\n    a. To provide browser access to Samba files, you must also install\
    \ NetStorage and create a Storage Location for the Samba server.\n    b. Browser\
    \ users can download files for viewing and/or modifying. They can then upload\
    \ modified files. They cannot, however, modify the files directly.\n\nAll file\
    \ service access is controlled by LDAP-based authentication through eDirectory’s\
    \ LDAP server.\n\nFor example, to access files on an NNLS server from a Windows\
    \ workstation, do the following:\n\n1. Enter your username (no context) and local\
    \ password to log in to the workstation.\n2. Access the network by doing one of\
    \ the following:\n    - In Windows 2000 or Windows ME, select **My Network Places\
    \ > Computers Near Me**.\n    - In Windows 95/98, select **Network Neighborhood**.\n\
    3. Browse to the workgroup or domain specified during the NNLS installation.\n\
    4. Select the server running NNLS protocols. If you are prompted to log in, use\
    \ the user’s simple password.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_94_0.png)\n\
    \nMicrosoft Networking Client needs to be installed.\n\nTo map a drive from Microsoft\
    \ Windows to files on an NNLS Linux server, use the following steps for Windows\
    \ NT/2000 as an example:\n\n1. Enter your username and local password to log in.\n\
    2. Right-click the **Network Neighborhood** icon (or **My Network Places**).\n\
    3. Select **Map Network Drive**.\n4. Select a *drive letter*.\n5. Enter the path\
    \ (*name of server*\\sharepoint).\n6. Select **Map**.\n\nTo map a drive from Novell\
    \ Client 4.9 for Windows to a Samba share on an NNLS server, do the following:\n\
    \n1. Turn off the UNC Path Filter:\n    a. Right-click the red **N**; then select\
    \ **NetWare Client Properties**.\n    b. Select **Advanced Settings**.\n    c.\
    \ Scroll down to and select the **UNC Path Filter** parameter group.\n    d. Change\
    \ the setting to **Off**, then select **OK**.\n    e. Restart the workstation.\n\
    2. Map the Samba share as a network drive:\n    a. Right-click the red **N**;\
    \ then select **Novell Map Network Drive**.\n    b. Select a *drive letter*.\n\
    \    c. Enter the path (*name of server*\\sharepoint).\n    d. Select **Map**.\n\
    \n## Exercise 6-4 Configure Samba for Digital Airlines Employee Access\n\n![](img/d63035f3fce0eaaf97203dde900affb7_96_0.png)\n\
    \n**30 minutes**\n\nIn this exercise, you configure Samba access for employees\
    \ in your container by doing the following:\n\n- Part I: Create and Provision\
    \ a User for Samba Services\n- Part II: Access Files on the NNLS Server from a\
    \ Windows Workstation\n- Part III: Convert an Existing eDirectory User to LUM\
    \ and Samba\n- Part IV: Configure the /tmp Directory as a Shared Directory\n\n\
    ### Part I: Create and Provision a User for Samba Services\n\nCreate a user and\
    \ provision this user for Samba services by doing the following:\n\n1. View the\
    \ settings in the smb.conf file:\n    a. Select **Applications > KDE Menu > System\
    \ > File Manager - Super User Mode**.\n    b. Enter a password of **novell**;\
    \ then select **OK**.\n    c. Browse to **/etc/opt/novell/samba**.\n    d. Right-click\
    \ the **smb.conf** file; then select **Open With > KWrite**.\n        Notice the\
    \ workgroup name (\"workgroup\").\n    e. Scroll down (a little more than 1/3\
    \ of the way into the file to Passwords & Authentication) and review “**Entry\
    \ made by NNLS install.**”\n        These parameters were set based on information\
    \ you provided during installation.\n    f. Select **File > Quit**.\n2. Open iManager\
    \ and create a user with the following properties:\n    - Username: **SUser**\n\
    \    - First name: **Samba**\n    - Last name: **User**\n    - Context: *your\
    \ container*\n    - Password: **novell**\n    - Primary Group (for LUM): **DBUSERS**,\
    \ *your container*\n    - Also convert this user to a Samba user: (*leave selected*)\n\
    \    - Samba Password: **novell** (entered by default)\n3. Create a home directory\
    \ for SUser:\n    a. Press **Ctrl+Alt+F2**.\n    b. Log in as **SUser**; password\
    \ **novell**.\n        SUser’s home directory folders are created and SUser is\
    \ LUM enabled.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_97_0.png)\n\nIf you\
    \ receive an “Incorrect login” error, refer to the LUM troubleshooting steps in\
    \ Exercise 4-4.\n\n    c. Enter **logout**.\n    d. Press **Alt+F7** to return\
    \ to the desktop.\n\n### Part II: Access Files on the NNLS Server from a Windows\
    \ Workstation\n\nDo the following:\n\n1. Access files on your NNLS server from\
    \ the Windows XP workstation:\n    a. At the XP workstation, right-click **Start**;\
    \ then select **Explore**.\n    b. From the menu bar, select **Tools > Map Network\
    \ Drive**.\n    c. In the Folder field, enter \\\\DNS name\\User.\n        If\
    \ your server is DA3, enter \\\\da3.atl.digitalairlines.com\\SUser\n    d. Before\
    \ you select Finish, select different user name.\n    e. Log in as SUser with\
    \ novell as the password; then select OK.\n    f. Select Finish.\n        You\
    \ should now see your user’s home directory.\n2. Add files to the home directory\
    \ from the XP workstation:\n    a. Right-click in the home directory window and\
    \ create any of the following:\n        - New > Folder\n        - New > Document\n\
    \        - New > Image\n3. On the NNLS server, verify that the files are there\
    \ by navigating the tree to /home/username.\n    You should see all the folders\
    \ and/or files that you created from the Windows XP workstation.\n4. Return to\
    \ the Windows XP workstation’s Explorer window and disconnect SUser’s mapped drive:\n\
    \    a. Close the window to the mapped drive.\n    b. From the Windows Explorer\
    \ menu, select Tools > Disconnect Network Drive.\n    c. Select SUser’s mapped\
    \ drive; then select OK.\n        Windows will only allow you to have one drive\
    \ mapped to a share at a time. With NNLS servers, access to user’s home directories\
    \ is done through the [homes] share that is configured in smb.conf.\n"
  mdcn: "\n# 表 6–4\n\n| 章节 | 条目名称 | 描述 |\n| :---- | :---- | :---- |\n| [homes] | comment\
    \ = | 这指定了在 Windows 客户端的“网上邻居”中，紧随 Samba 服务器名称之后显示的名称。如果此条目及接下来两个条目按指定设置，则无需为用户的主目录单独指定共享。\
    \ **默认值：** comment = Home Directories |\n| | browseable = | 这指定所有主目录是否将显示在“网上邻居”中。\
    \ **默认值：** browseable = no |\n| | writable = | 这指定用户是否可以创建和修改文件。 **默认值：** writable\
    \ = yes |\n| 共享（可选） | [Share Name]<br>path =<br>read only = | 您可以通过向 smb.conf\
    \ 文件添加此类条目来创建新的共享。 **示例：** [DATA]<br>path = /export/data<br>read only = no<br>此简单示例在本地文件系统的\
    \ /export/data 位置创建了一个名为 DATA 的新共享。该共享以读/写访问权限导出。<br>共享还可以设置许多其他选项。请参阅 http://www.samba.org\
    \ 上的 Samba 文档。 |\n\n## 配置 ldap.conf 文件\n\nLinux 上的 Samba 使用 OpenLDAP 客户端库 libldap.so\
    \ 和 libldap_r.so。ldap.conf 是 OpenLDAP 的配置文件。\n\n根据 Linux 标准基线（LSB）要求，Novell 将\
    \ ldap.conf 文件放置在 NNLS 服务器的 /etc/opt/novell/openldap 目录中。\n\n如果您将 NNLS 服务器安装到现有的树结构中，则必须在\
    \ NNLS 安装期间指定受信任的根证书。此时，NNLS 服务器上的 ldap.conf 文件将包含以下与证书相关的条目：\n\n- TLS_CACERT\
    \ /etc/ssl/certname.cert\n- TLS_REQCERT demand\n\n如果您正在安装一个新的目录树，ldap.conf 文件将包含以下条目：\n\
    \n- TLS_REQCERT allow\n\n有关 ldap.conf 文件的更多信息，请参阅 ldap.conf 手册页。\n\n## 如何通过 Samba\
    \ 访问文件\n\n只有定义为 Linux 用户管理（LUM）用户的用户才能通过 LDAP 服务器进行身份验证并访问 NNLS 服务器上的 Samba 文件。\n\
    \n以下说明了访问 Samba 文件的三种选项：\n\n### 图 6-15\n\n![](img/d63035f3fce0eaaf97203dde900affb7_93_0.png)\n\
    \n1. Windows 用户可以使用 Windows 资源管理器访问 Samba 文件：\n    a. 用户以常规方式导航到 Samba 共享。\n \
    \   b. NNLS 服务器上的文件使用 Microsoft 的 CIFS 协议进行访问和维护。\n2. Windows 用户也可以通过创建 Web 文件夹来访问\
    \ Samba 文件。\n    a. 用户以常规方式创建指向 Samba 服务器的 Web 文件夹。\n    b. NNLS 服务器上的文件使用 HTTP-WebDAV\
    \ 协议进行访问和维护。\n3. 浏览器用户还可以访问其 Samba 文件，以将其下载到本地文件系统。\n    a. 为了提供对 Samba 文件的浏览器访问，还必须安装\
    \ NetStorage 并为 Samba 服务器创建一个存储位置。\n    b. 浏览器用户可以下载文件以进行查看和/或修改。然后他们可以上传已修改的文件。但是，他们不能直接修改文件。\n\
    \n所有文件服务访问都由 eDirectory 的 LDAP 服务器通过基于 LDAP 的身份验证进行控制。\n\n例如，要从 Windows 工作站访问\
    \ NNLS 服务器上的文件，请执行以下操作：\n\n1. 输入您的用户名（无上下文）和本地密码以登录工作站。\n2. 通过执行以下任一操作来访问网络：\n\
    \    - 在 Windows 2000 或 Windows ME 中，选择 **我的网络位置 > 附近的计算机**。\n    - 在 Windows\
    \ 95/98 中，选择 **网上邻居**。\n3. 浏览到 NNLS 安装期间指定的工作组或域。\n4. 选择正在运行 NNLS 协议的服务器。如果提示您登录，请使用用户的简单密码。\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_94_0.png)\n\n需要安装 Microsoft 网络客户端。\n\
    \n要从 Microsoft Windows 映射驱动器到 NNLS Linux 服务器上的文件，请以 Windows NT/2000 为例使用以下步骤：\n\
    \n1. 输入您的用户名和本地密码以登录。\n2. 右键单击 **网上邻居** 图标（或 **我的网络位置**）。\n3. 选择 **映射网络驱动器**。\n\
    4. 选择一个*驱动器字母*。\n5. 输入路径（*服务器名称*\\共享点）。\n6. 选择 **映射**。\n\n要从 Novell Client 4.9\
    \ for Windows 映射驱动器到 NNLS 服务器上的 Samba 共享，请执行以下操作：\n\n1. 关闭 UNC 路径过滤器：\n    a.\
    \ 右键单击红色的 **N**；然后选择 **NetWare 客户端属性**。\n    b. 选择 **高级设置**。\n    c. 向下滚动并选择 **UNC\
    \ 路径过滤器** 参数组。\n    d. 将设置更改为 **关**，然后选择 **确定**。\n    e. 重启工作站。\n2. 将 Samba 共享映射为网络驱动器：\n\
    \    a. 右键单击红色的 **N**；然后选择 **Novell 映射网络驱动器**。\n    b. 选择一个*驱动器字母*。\n    c. 输入路径（*服务器名称*\\\
    共享点）。\n    d. 选择 **映射**。\n\n## 练习 6-4 配置 Samba 以访问 Digital Airlines 员工\n\n![](img/d63035f3fce0eaaf97203dde900affb7_96_0.png)\n\
    \n**30 分钟**\n\n在本练习中，您通过执行以下操作为您的容器中的员工配置 Samba 访问：\n\n- 第一部分：创建并为用户配置 Samba 服务\n\
    - 第二部分：从 Windows 工作站访问 NNLS 服务器上的文件\n- 第三部分：将现有的 eDirectory 用户转换为 LUM 和 Samba\
    \ 用户\n- 第四部分：将 /tmp 目录配置为共享目录\n\n### 第一部分：创建并为用户配置 Samba 服务\n\n通过执行以下操作创建一个用户并为该用户配置\
    \ Samba 服务：\n\n1. 查看 smb.conf 文件中的设置：\n    a. 选择 **应用程序 > KDE 菜单 > 系统 > 文件管理器\
    \ - 超级用户模式**。\n    b. 输入密码 **novell**；然后选择 **确定**。\n    c. 浏览到 **/etc/opt/novell/samba**。\n\
    \    d. 右键单击 **smb.conf** 文件；然后选择 **打开方式 > KWrite**。\n        注意工作组名称（\"workgroup\"\
    ）。\n    e. 向下滚动（大约到文件的 1/3 多一点的位置，即“密码和身份验证”部分），并查看“**NNLS 安装所做的条目**”。\n     \
    \   这些参数是根据您在安装期间提供的信息设置的。\n    f. 选择 **文件 > 退出**。\n2. 打开 iManager 并创建一个具有以下属性的用户：\n\
    \    - 用户名： **SUser**\n    - 名： **Samba**\n    - 姓： **User**\n    - 上下文： *您的容器*\n\
    \    - 密码： **novell**\n    - 主组（用于 LUM）： **DBUSERS**， *您的容器*\n    - 同时将此用户转换为\
    \ Samba 用户：（*保持选中*）\n    - Samba 密码： **novell**（默认输入）\n3. 为 SUser 创建主目录：\n   \
    \ a. 按 **Ctrl+Alt+F2**。\n    b. 登录为 **SUser**；密码 **novell**。\n        创建了 SUser\
    \ 的主目录文件夹，并且 SUser 已启用 LUM。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_97_0.png)\n\
    \n如果您收到“登录错误”错误，请参见练习 4-4 中的 LUM 故障排除步骤。\n\n    c. 输入 **logout**。\n    d. 按 **Alt+F7**\
    \ 返回桌面。\n\n### 第二部分：从 Windows 工作站访问 NNLS 服务器上的文件\n\n请执行以下操作：\n\n1. 从 Windows XP\
    \ 工作站访问 NNLS 服务器上的文件：\n    a. 在 XP 工作站上，右键单击 **开始**；然后选择 **资源管理器**。\n    b. 从菜单栏中，选择\
    \ **工具 > 映射网络驱动器**。\n    c. 在文件夹字段中，输入 \\\\DNS名称\\用户。\n        如果您的服务器是 DA3，请输入\
    \ \\\\da3.atl.digitalairlines.com\\SUser\n    d. 在选择完成之前，选择不同的用户名。\n    e. 以 SUser\
    \ 身份登录，密码为 novell；然后选择确定。\n    f. 选择完成。\n        此时您应该能看到用户的主目录。\n2. 从 XP 工作站向主目录添加文件：\n\
    \    a. 在主目录窗口中右键单击，并创建以下任意一项：\n        - 新建 > 文件夹\n        - 新建 > 文档\n      \
    \  - 新建 > 图像\n3. 在 NNLS 服务器上，通过导航到 /home/username 验证文件是否存在。\n    您应该能看到从 Windows\
    \ XP 工作站创建的所有文件夹和/或文件。\n4. 返回 Windows XP 工作站的资源管理器窗口，并断开 SUser 的映射驱动器：\n    a.\
    \ 关闭映射驱动器的窗口。\n    b. 从 Windows 资源管理器菜单中，选择工具 > 断开网络连接。\n    c. 选择 SUser 的映射驱动器；然后选择确定。\n\
    \        Windows 一次只允许映射一个驱动器到一个共享。对于 NNLS 服务器，访问用户的主目录是通过在 smb.conf 中配置的 [homes]\
    \ 共享完成的。\n\n"
