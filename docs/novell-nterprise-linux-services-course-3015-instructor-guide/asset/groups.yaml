  mdcn: "\n用户可能会收到一条错误消息，提示磁盘空间不足，无法同步数据。请让用户选择“确定”。在调整磁盘配额值后，该错误将不再出现。\n\n## 恢复已删除或损坏的文件\n\
    \n如果用户需要从已删除或损坏的文件中恢复数据，您可以将用户的文件夹恢复到辅助 iFolder 服务器。之后，用户可以通过浏览器或 NetDrive 访问\
    \ iFolder 服务器上的本地文件副本。\n\n执行以下操作：\n\n- 1. 登录到 iFolder 管理控制台的**用户管理**部分。\n- 2.\
    \ 搜索该用户；然后单击*用户名*以查找 iFolder 账户路径。\n\n以下是 iFolder 用户账户中账户路径的示例：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_56_0.png)\n\
    \n- 3. 从备份磁带上将位于 iFolder 账户路径的文件夹恢复到用户可以连接的辅助 iFolder 服务器上。\n- 4. 让 iFolder 用户使用\
    \ Java 小程序或 NetDrive 访问辅助 iFolder 服务器。\n\n当用户登录时，Java 小程序将显示用户的数据，用户可以下载之前被删除的文件。\n\
    \nJava 小程序和 NetDrive 是很好的选择，因为它们不同步数据，只提供访问权限。\n\n### 删除服务器上的用户数据\n\n如果用户无法记住其密码，您可以删除\
    \ iFolder 服务器上的用户数据，然后让用户再次登录。当他登录时，系统会提示输入新密码。\n\n执行以下操作：\n\n- 1. 在删除用户账户之前，用户必须执行以下操作，以防止在重置账户时丢失数据：\n\
    \    - a. 将数据从当前的本地 iFolder 目录复制到用户工作站上的另一个本地目录，然后删除本地 iFolder 目录。\n    - b. 通过执行以下操作从用户工作站卸载\
    \ iFolder 客户端：\n        - a. 选择 **开始 > 设置 > 控制面板 > 添加/删除程序 > 更改或删除程序**。\n    \
    \    - b. 选择 **Novell iFolder 客户端**；然后选择 **更改/删除 > 是**。\n    - c. 访问 iFolder 网站以下载\
    \ iFolder 客户端软件。\n    - d. 按照下载和安装说明安装 iFolder 客户端。\n    - e. 如果用户 ID、密码或加密短语已更改，请在重新安装\
    \ iFolder 客户端期间输入新值。\n    - f. 将用户数据移动到新建的本地 iFolder 目录中。\n    - g. 执行以下操作之一：\n\
    \        - 等待文件自动同步。\n        - 右键单击系统托盘中的 iFolder 图标；然后选择**立即同步**。\n\n    一旦用户完成这些步骤，您就可以删除用户账户。\n\
    \n- 2. 在 iFolder 管理控制台中，选择**用户管理**。\n- 3. 使用您的管理员*用户名*和*密码*登录。\n- 4. 如果您知道唯一的用户\
    \ ID，请搜索特定用户；如果不知道，请通过高级搜索查找用户。\n- 5. 选择*用户名*，滚动到页面底部，然后选择**删除 iFolder 用户数据**。\n\
    - 6. 选择**确定**以确认删除用户数据。\n\n## 使用冲突箱\n\niFolder 客户端有一个名为冲突箱的功能。用户很少需要访问此选项；但是，了解此功能非常有用。以下场景说明了冲突箱是什么以及它是如何工作的。\n\
    \n假设 John 是您的 iFolder 用户之一。John 在两台计算机上安装了 iFolder 客户端：计算机 A 和计算机 B。在一天中的某个时刻，John\
    \ 将这两台计算机都断开网络连接，并继续在两台计算机上离线工作。\n\n在他工作时，他在计算机 A 上的一个 iFolder 文件中做了一个更改，然后稍后在计算机\
    \ B 上对同一文件做了不同的更改。\n\n然后，他将计算机 A 重新连接到网络，以将这些更改同步到 iFolder 服务器。接着，John 将计算机 B\
    \ 重新连接到网络以同步新的更改。\n\n当计算机 B 重新连接到网络并将更改同步到 iFolder 服务器时，John 在计算机 A 上所做的更改将被 John\
    \ 从计算机 B 对同一文件所做的更改覆盖。\n\n为防止数据丢失，iFolder 将把被覆盖的文件保存到冲突箱中。John 可以通过右键单击原本包含被覆盖文件的那台计算机的系统托盘中的\
    \ iFolder 图标来访问冲突箱。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_59_0.png)\n\n\
    如果问题文件的大小超过为冲突箱设置的配额，该文件将不会保存在箱中；它将被丢弃。\n\n## iFolder 和 NetDrive\n\n在尝试使用 NetDrive\
    \ 访问 iFolder 服务器之前，您必须通过 iFolder 客户端激活您的 iFolder 账户。\n\n如果您尝试首次使用 NetDrive 连接到\
    \ iFolder，连接将会失败。您必须先通过 Java 小程序（https://mfi1.*您的域名*.com/applet/java.htm）或 iFolder\
    \ 客户端连接来激活账户。\n\n## 如何管理 iFolder 服务器\n\n通过 iFolder 管理控制台，您可以更改您的 iFolder 服务器的\
    \ IP 地址、DNS 名称或分配端口。\n\n您的第一个 iFolder 服务器会自动添加到 iFolder 管理控制台中。所有额外的 iFolder 服务器必须手动添加到\
    \ iFolder 管理控制台中，以便您对其进行管理。\n\n您可以拥有无限数量的 iFolder 服务器。\n\n要管理 iFolder 服务器，您需要知道如何执行以下操作：\n\
    \n- 添加 iFolder 服务器\n- 设置全局服务器策略\n- 使用调试输出\n\n### 添加 iFolder 服务器\n\n要添加 iFolder\
    \ 服务器，请执行以下操作：\n\n- 在 iFolder 管理控制台中，选择**全局设置**。\n- 使用您的管理员*用户名*和*密码*登录。\n- 选择\
    \ *iFolder 服务器* > *添加*。\n\n将出现以下内容：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_60_0.png)\n\
    \n要添加服务器，请输入以下信息：\n\n- 公共和私有 iFolder 服务器名称。如果您的 iFolder 服务器的 DNS 名称或 IP 地址直接指向\
    \ iFolder 服务器，而不经过其他设备路由（即您的 iFolder 服务器不在防火墙后面），您只需填写“公共”标题下方的信息。如果您的 iFolder\
    \ 服务器的 DNS 名称或 IP 地址经过另一设备（例如将请求重定向到 iFolder 服务器的 L4 交换机或防火墙），您需要填写“公共”和“私有”两个标题下的信息。\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_61_0.png)\n\n> 如果您的路由器或交换机内置网络地址转换\
    \ (NAT) 功能，请输入您的 iFolder 公共和私有 DNS 名称及 IP 地址。\n\n如果您的公共 DNS 名称或 IP 地址将请求重定向到私有\
    \ iFolder IP 地址，请指定一个 DNS 名称（而不是 IP 地址）作为 iFolder 服务器的公共地址。然后，确保您使用内部 DNS 服务器将\
    \ DNS 名称解析为内部用户的私有地址，并使用外部 DNS 服务器将 DNS 名称解析为外部用户的公共地址。私有设置允许 iFolder 服务器在 iFolder\
    \ 系统内直接相互通信。公共设置允许您从防火墙外部访问 iFolder 服务器。\n\n- iFolder 端口。您在 iFolder 管理控制台中输入的端口必须与您在\
    \ iFolder 安装期间指定的端口相匹配。如果所有服务器都具有唯一的 DNS 名称或 IP 地址，则可以拥有多个使用相同端口号的 iFolder 服务器。\n\
    \n端口 80 用于将加密的用户名、密码和数据从 iFolder 客户端发送到 iFolder 服务器。\n\niFolder 使用 RSA* 加密来加密用户名和密码，并使用\
    \ Blowfish* 加密来加密用户数据。端口 443 用于通过 SSL 和 HTTPS 访问 iFolder 管理控制台和 Java 小程序。\n\n\
    - 4. 完成后，选择**添加**以添加服务器。\n\n### 设置全局服务器策略\n\n您可以通过执行以下操作来规定分配给每个 iFolder 用户的磁盘空间量，或规定会话超时前的等待时间：\n\
    \n- 1. 使用您的管理员*用户名*和*密码*登录到 iFolder 管理控制台的全局设置部分。\n- 2. 选择**全局策略**；然后选择服务器策略旁边的**显示**按钮。\n\
    \n将出现以下内容：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_62_0.png)\n\n- 3. 填写以下信息：\n\
    \    - **初始客户端配额。** 指定分配给新 iFolder 用户账户的最低存储空间（以 MB 为单位）。\n\n"
