    \ the installation.\n\n+   8. View the readme file and save the installation settings\
    \ log file.\n\n# iFolder Objects in the eDirectory Schema\n\nThe iFolder installation\
    \ extends your eDirectory LDAP schema to include the following objects:\n\n+ \
    \  ■ iFolder Server Agent (iFolder_ServerAgent)\n+   \n+   ■ iFolder Settings\
    \ object (iFolder_Settings)\n+   \n+   ■ iFolder User LDAP object (iFolder_ldap01)\
    \ CN\n+   \n+   ■ iFolder Server object (iFolder_server01)\n\nThe schema extension\
    \ and the newly created objects enable your iFolder server to run with the LDAP\
    \ settings you specified during the installation. These settings are used as your\
    \ Global Settings LDAP configuration.\n\nThe iFolder Settings object is created\
    \ only once and it holds all the Global Settings LDAP configuration for the iFolder\
    \ service on your network.\n\niFolder User LDAP objects and iFolder Server objects\
    \ represent each LDAP server and iFolder server, respectively, that you have in\
