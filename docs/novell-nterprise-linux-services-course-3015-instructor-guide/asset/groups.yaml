- raw:
  - '[PAGE 56]


    The user might receive an error message saying that there isn’t enough disk space
    to synchronize data. Have the user select OK. The error will no longer appear
    after you adjust the Disk Quota value.


    # ## Restore Deleted or Corrupted Files


    If a user needs to recover data from a deleted or corrupted file, you can restore
    the user’s folder to a secondary iFolder server. From there, the user can access
    the iFolder server’s copy of his local files via a browser or NetDrive.


    Do the following:


    +   1. Log in to the **User Management** section of the iFolder Management console.


    +   2. Search for the user; then click the *username* to locate the iFolder Account
    Path.


    The following is an example of the account path in an iFolder user account:


    ![](img/d63035f3fce0eaaf97203dde900affb7_56_0.png)


    +   3. Restore the folder located at the iFolder Account Path from a backup tape
    to a secondary iFolder server that the user can attach to.


    +   4. Have the iFolder user use the Java applet or NetDrive to access the secondary
    iFolder server.'
  - '[PAGE 57]


    When the user logs in, the Java applet will show the user''s data and he can download
    the file that was previously deleted.


    The Java applet and NetDrive are good choices because they don''t sync data, they
    only give access.


    # ### Delete User Data on the Server


    If a user cannot remember his password, you can delete the user data on the iFolder
    server and then have the user log in again. When he logs in, he will be prompted
    to enter a new password.


    Do the following:


    +   1. Before you delete the user account, the user must do the following to prevent
    data loss during an account reset:

    +       a. Copy data from the current local iFolder directory to another local
    directory on the user workstation, and then delete the local iFolder directory.

    +       b. Uninstall the iFolder client from the user workstation by doing the
    following:

    +           a. Select **Start > Settings > Control Panel > Add/Remove Programs
    > Change or Remove Programs**.

    +           b. Select **Novell iFolder client**; then select **Change/Remove >
    Yes**.

    +       c. Go to the iFolder Web site to download the iFolder client software.

    +       d. Follow the download and installation instructions to install the iFolder
    client.

    +       e. If the User ID, Password, or Encryption Pass phrase have changed, enter
    the new values during the reinstallation of the iFolder client.

    +       f. Move the user data to the newly created local iFolder directory.'
  - "[PAGE 58]\n\n+   g. Do one of the following:\n+   - Wait for the files to synchronize\
    \ automatically.\n+   - Right-click the iFolder icon in the system tray; then\
    \ select **Sync Now**.\n+   \n+   Once the user completes these steps, you can\
    \ delete the user account.\n\n+   2. In the iFolder Management console, select\
    \ **User Management**.\n\n+   3. Log in with your Admin *username* and *password*.\n\
    \n+   4. Search for a specific user if you know the unique user ID; if not, find\
    \ the user by doing an advanced search.\n\n+   5. Select the *username*, scroll\
    \ to the bottom of the page, and select **Remove iFolder User Data**.\n\n+   6.\
    \ Confirm the removal of the user data by selecting **OK**.\n\n# Use the Conflict\
    \ Bin\n\nThe iFolder client has a feature called the Conflict Bin. A user will\
    \ rarely need to access this option; however, understanding this feature is useful.\
    \ The following scenario illustrates what the Conflict Bin is and how it works.\n\
    \nSuppose that John is one of your iFolder users. John has the iFolder client\
    \ installed on two computers: computer A and computer B. At some point in the\
    \ day, John disconnects both of these computers from the network and continues\
    \ to work from both computers offline.\n\nWhile he is working, he makes a change\
    \ to one of his iFolder files on computer A and then, later in the day, he makes\
    \ a different change to the same file on computer B."
  - '[PAGE 59]


    He then reconnects computer A to the network in order to synchronize the changes
    to the iFolder server. Then, John reconnects computer B to the network to synchronize
    the new change.


    When computer B reconnects to the network and synchronizes the change to the iFolder
    server, the change that John made on computer A would be overwritten with the
    change that John made to that same file from computer B.


    To prevent data loss, iFolder saves the overwritten file to the Conflict Bin.
    John can access the Conflict Bin by right-clicking the iFolder icon located in
    the system tray of the computer that originally contained the file that was overwritten.


    ![](img/d63035f3fce0eaaf97203dde900affb7_59_0.png)


    If the problem file is larger than the quota set for the Conflict Bin, the file
    will not be saved in the bin; it will be discarded.


    # iFolder and NetDrive


    You must activate your iFolder account via the iFolder client before attempting
    to use NetDrive to access the iFolder server.


    If you try to attach to iFolder for the first time using NetDrive, the connection
    will fail. You must first activate the account by attaching with either the Java
    applet (https://mfi1.*your domain name*.com/applet/java.htm) or the iFolder client.


    # How to Manage iFolder Servers


    Through the iFolder Management console, you can change your iFolder server’s IP
    address, DNS name, or assigned ports.'
  - '[PAGE 60]


    Your first iFolder server is automatically added to the iFolder Management console
    for you. All additional iFolder servers must be manually added into the iFolder
    Management console in order for you to manage them.


    You can have an unlimited number of iFolder servers.


    To manage iFolder servers, you need to know how to do the following:


    +   Add iFolder Servers

    +   Set Global Server Policies

    +   Use Debug Output


    # # Add iFolder Servers


    To add an iFolder server, do the following:


    +   In the iFolder Management console, select **Global Settings**.

    +   Log in with your Admin *username* and *password*.

    +   Select *iFolder Servers* > *Add*.


    The following appears:


    ![](img/d63035f3fce0eaaf97203dde900affb7_60_0.png)'
  - '[PAGE 61]


    To add a server, enter the following information:


    +   Public and private iFolder server names. If the DNS name or IP address of
    your iFolder server goes directly to the iFolder server without being routed through
    another device, meaning that your iFolder server is not behind a firewall, you
    are only required to fill in the information beneath the Public heading. If the
    DNS name or IP address of your iFolder server goes through another device, like
    an L4 switch or a firewall which redirects the request to the iFolder server,
    you need to fill in the information under both the Public and Private headings.


    ![](img/d63035f3fce0eaaf97203dde900affb7_61_0.png)


    > If you have Network Address Translation (NAT) functionality built into your
    routers or switches, enter both your iFolder public and private DNS names and
    IP addresses.


    If your public DNS name or IP address redirects requests to a private iFolder
    IP address, specify a DNS name (not an IP address) as the public address of the
    iFolder server. Then, make sure you are using an internal DNS server to resolve
    the DNS name to the private address for internal users and use an external DNS
    server to resolve the DNS name to the public address of external users. The Private
    settings allow the iFolder servers to communicate directly with each other within
    the iFolder system. The Public settings allow you to access the iFolder server
    from outside the firewall.


    +   iFolder ports. The ports that you enter into the iFolder Management console
    must match the ports that you specified during the iFolder installation. You can
    have multiple iFolder servers using the same port numbers if they all have a unique
    DNS name or IP address.'
  - '[PAGE 62]


    Port 80 is used to send the encrypted username and password and data from the
    iFolder client to the iFolder server.


    iFolder uses RSA* encryption to encrypt the username and password, and Blowfish*
    encryption to encrypt the user data. Port 443 is used to access the iFolder Management
    console and the Java applet via SSL and HTTPS.


    +   4. When you finish, add the server by selecting **Add**.


    # ## Set Global Server Policies


    You can regulate how much disk space will be allotted to each iFolder user or
    how much time will pass before a session times out by doing the following:


    +   1. Log in to the Global Settings section of the iFolder Management console
    with your Admin *username* and *password*.

    +   2. Select **Global Policies**; then select the **Display** button next to
    Server Policies.

    +   The following appears:


    ![](img/d63035f3fce0eaaf97203dde900affb7_62_0.png)


    +   3. Complete the following information:

    +       *   **Initial Client Quota.** Specify the amount of storage space (in
    MB) that will be the minimum amount assigned to new iFolder user accounts.'
