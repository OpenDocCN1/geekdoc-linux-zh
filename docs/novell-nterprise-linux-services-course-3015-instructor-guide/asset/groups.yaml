  - "[PAGE 216]\n\n![](img/d63035f3fce0eaaf97203dde900affb7_216_0.png)\n\nThe messaging\
    \ server is dependent on the DNS server as a name resolver, even if you are using\
    \ IP addresses instead of DNS names.\n\n# Excercise 8-1    Configure and Test\
    \ NetMail for Your Digital Airlines Office\n\nIn this exercise, you configure\
    \ the NMAP Agent to service your entire container and test the mail server.\n\n\
    Do the following:\n\n+   1.  Verify that sendmail isn't running: \n+       a.\
    \  On your NNLS server, open a terminal session. \n+       b.  Change to the root\
    \ user by entering su - and a password of novell. \n+       c.  Enter chkconfig\
    \ --list sendmail. \n+       \n+           The sendmail daemon should be set to\
    \ off for run levels 3 (non-graphical boot) and 5 (graphical boot).\n\n+   2.\
    \  Make sure DNS is resolving your server's IP address correctly by entering ping\
    \ DAx.your container.digitalairlines.com (press Ctrl+C to stop the ping). \n+\
    \   \n+       For example, if you are working on DA3, you would enter ping DA3.atl.digitalairlines.com.\n\
    \n+   3.  Access WebAdmin and verify that NetMail is configured to service users\
