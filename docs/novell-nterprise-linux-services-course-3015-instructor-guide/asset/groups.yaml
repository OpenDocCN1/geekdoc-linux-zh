- raw:
  - '[PAGE 19]


    If you are placing the iFolder server behind a firewall, you need to remember
    that iFolder uses both 80 and 443 for both client and server access. The administration
    page and the iFolder client authentication will be over 443.


    # iFolder Architecture


    To understand how the iFolder components and architecture work to synchronize
    and provide access to personal files, you need to know the following:


    +   ■ Web Servers and iFolder

    +   ■ LDAP and iFolder

    +   ■ Authentication and Synchronization

    +   ■ How iFolder Synchronizes Files


    # Web Servers and iFolder


    The iFolder server software uses Apache as its default Web server for NetWare
    and Linux server operating systems. On Windows 2000, iFolder uses the IIS Web
    server.


    When iFolder is active on NetWare servers with Apache-based solutions, it can
    run in the operating system space or in protected memory space.


    Because iFolder requires some configuration changes to Apache-specific files,
    we recommend that you install iFolder on a server that does not have other applications
    that rely on Apache.


    If you do have other applications that use Apache, these applications might not
    work when you install iFolder.'
  - '[PAGE 20]


    # **LDAP and iFolder**


    iFolder uses LDAP for user authentication. It uses a Novell eDirectory or Microsoft
    Active Directory (for Windows 2000) as a central location for all of its LDAP
    objects that are specific to iFolder.


    You can have iFolder and LDAP running on the same server or on different servers.


    iFolder uses the following LDAP directories:


    +   - **Global Settings LDAP directory.** This directory stores information about
    the iFolder system configuration and has iFolder Settings, iFolder Server, and
    LDAP Server objects.


    +   - **User LDAP directory.** This directory is used for authentication and adds
    the iFolder Server Name and the Disk Quota attribute to user objects that have
    been authorized in the iFolder Management console to use iFolder.


    Regardless of how many iFolder servers you have, you will have only one Global
    Setting LDAP.


    However, you can have up to eight User LDAP directories. Multiple LDAP directories
    benefit companies whose user objects are already divided into different LDAP directories.


    For example, if you have an LDAP directory for all of your vendors, another for
    your full-time employees, and another for your temporary hires, you can set up
    three User LDAP directories in iFolder to handle the iFolder accounts for each
    directory.


    When deciding whether to use LDAP over SSL (port 636) or a clear text (port 389)
    connection, consider the following:


    +   - Choose port 389 if you want to use LDAP without SSL encryption or if your
    LDAP server does not support SSL.'
  - '[PAGE 21]


    Port 389 is also a good choice if iFolder and LDAP are running on the same server.
    No communication of data is being transferred across the wire, so no encryption
    is necessary.


    +   - Choose port 636 if you want to use SSL, which provides your network with
    encryption and security when data is transferred across the wire.


    If you choose port 636, there will be some post-configuration required after the
    NetWare 6 installation.


    > If you want LDAP over SSL and your LDAP server is different from your iFolder
    server, you will need to export the LDAP server''s trusted root certificate and
    then copy it to your iFolder server.


    # Authentication and Synchronization


    When you log in to iFolder, the iFolder client authenticates to the iFolder server
    by sending the encrypted username and password through an Internet connection
    to the iFolder server.


    > These credentials are encrypted using RSA and sent to the server in an HTTP
    packet. When the server authenticates the users, all subsequent communication
    between them is encrypted using the 128-bit Blowfish algorithm. However, all communication
    continues to happen over the standard http port 80.


    The iFolder server uses this information to verify that the user exists, and then
    checks to see if the user object has been enabled in the iFolder Management console
    to use iFolder.


    After the user object has been enabled, a user account must be created on the
    iFolder server before the user can begin using iFolder on his local workstation.
    An account is created the first time a user logs in to the iFolder server with
    the iFolder client.'
  - '[PAGE 22]


    After the user account is created, the account can then be managed with the iFolder
    Management console.


    After the first login, a user can begin to add files to his iFolder directory
    and automatic synchronization begins. At first login, the user’s account is created
    on the iFolder server and the iFolder home directory is placed on the user’s desktop.


    The iFolder client is always aware of any local activity and, based on the synchronization
    preferences chosen by you (as network administrator) or the user, the iFolder
    client regularly asks the iFolder server for a download of any new data.


    After the iFolder server downloads the data, it uploads any updates from the iFolder
    local directory. When you access your account from a different computer, the iFolder
    server first downloads any updates before uploading the iFolder client changes.


    ![](img/d63035f3fce0eaaf97203dde900affb7_22_0.png)


    For additional details on iFolder components and architecture, see “In-Depth Look
    at Authentication, Encryption, and Synchronization” in the Novell iFolder Installation
    and Administration Guide at http://www.novell.com/documentation/ig/ifold er21.'
  - "[PAGE 23]\n\n# How iFolder Synchronizes Files\n\nThe following steps outline\
    \ the synchronization process between the files on your local hard drive and the\
    \ iFolder server:\n\n![](img/d63035f3fce0eaaf97203dde900affb7_23_0.png)\n\n+ \
    \  1.  The user authenticates to the iFolder server through the iFolder client.\n\
    \n+   2.  The iFolder server performs an LDAP bind and verifies that the user\
    \ is on the correct server. If not, the server redirects the user to the correct\
    \ server.\n\n+   3.  The iFolder client performs a reconciliation operation and\
    \ checks the files on the user’s workstation with the files on the server.\n\n\
    +   4.  iFolder downloads any new files from the server, and then uploads any\
    \ new files in the local iFolder folder.\n+   \n+   During this process, iFolder\
    \ only synchronizes the changed portion of an existing file on a 4 kb block level.\n\
    \n+   5.  The iFolder server receives the new files and increases the sync index.\
    \ The sync index indicates the current state of the file system."
  - '[PAGE 24]


    A match between the sync index on the iFolder server and the sync index on the
    client workstation indicates that there has been no change. This is how the iFolder
    client knows if it is out of sync.

    The sync index is only 4 bytes and is a very low cost server operation.


    +   6. When another iFolder client workstation connects to the iFolder server,
    the server compares the sync index and downloads any new files.


    +   7. If there is a new file, iFolder monitors the file system and catches the
    event.


    +   8. iFolder then uploads the file to the server, and the iFolder server increments
    the sync index.


    +   9. If there is a conflict, iFolder uses time stamps for resolution, and the
    old file is placed in the Conflict Bin.


    # **Objective 2 Install and Configure iFolder**


    You install and configure iFolder on Linux in four basic stages:


    +   1. Install the first iFolder server.

    +   2. Configure global settings, default policies, LDAP authentication sources,
    and iFolder servers.

    +   3. Provision iFolder users.

    +   4. Install additional iFolder servers (as needed).


    To complete these phases and manage iFolder, you need to know the following:


    +   ■ Prerequisites for Installing on Linux Servers

    +   ■ How to Install iFolder from NNLS

    +   ■ How to Configure Your iFolder Server'
  - '[PAGE 25]


    +   - How to Access the iFolder Web Sites

    +   - How to Install and Configure the iFolder Client

    +   - How to Manage iFolder User Accounts

    +   - How to Manage iFolder Servers

    +   - How to Manage LDAP Servers

    +   - How to Monitor Your iFolder System

    +   - How to Generate Reports


    # **Prerequisites for Installing on Linux Servers**


    Before you install Novell iFolder 2.1 with NNLS, make sure your Linux server and
    enterprise network environment meet all of the following prerequisites:


    +   - **iFolder server requirements.** Configure an enterprise server with the
    following components:

    +       - Minimum 450 MHz Intel® Pentium® II processor.

    +       - Minimum 512 MB RAM. Add more RAM if the server supports programs or
    services other than iFolder.

    +       - Storage capacity for server software (about 15 MB) plus the user data
    for all the users'' iFolder accounts.

    +       - As a guide, consider the expected number of users and the quota of storage
    allotted for each iFolder user account.

    +       - Also, consider the likely growth associated with each of the parameters
    to anticipate future demand for storage.

    +       - An active network or Internet connection with full two-way access to
    other computers on the network or Internet, or both, depending on your deployment.

    +   - **iFolder server Linux requirements.** Install and configure Red Hat Enterprise
    Linux AS/ES 2.1 or SLES 8, including all service packs and patches on your iFolder
    server.'
