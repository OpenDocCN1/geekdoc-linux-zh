    \ |\n| 2 | SMTP Agent | SMTP Agent 接收消息并将该消息转交给其分配的 NMAP Agent。 |\n| 3 | NMAP\
    \ Agent | 在将消息下载到消息队列目录时，NMAP Agent 创建消息控制文件 (Cxxxxxxx.in) 和数据文件 (Dxxxxxxx.in)。\
    \ |\n| 4 | NMAP Agent | 消息下载完成后，NMAP Agent 将数据文件扩展名改为 .MSG，并通过将文件扩展名从 .IN 更改为\
    \ .000，将控制文件移动到队列 0。<br><br>在队列 0 中，NMAP Agent 验证控制文件是否满足所有处理要求。然后，它通知防病毒 Agent\
    \ 有待处理的消息。 |\n| | 防病毒 Agent | 然后，防病毒 Agent 扫描数据文件中的附件。附件将被发送至第三方病毒引擎进行扫描。<br><br>假设文件是干净的，NMAP\
    \ Agent 通过将文件扩展名从 .000 更改为 .001，将控制文件移动到队列 1，并通知反垃圾邮件和/或列表 Agent 有待处理的消息。 |\n\
    | 5 | 反垃圾邮件 Agent<br>列表 Agent | 队列 1 由反垃圾邮件 Agent 和列表 Agent 共享。<br><br>反垃圾邮件 Agent\
    \ 检查控制文件，查看发件人是否在其黑名单上。如果发件人在黑名单上，该消息将从队列中删除。<br><br>列表 Agent 检查控制文件，查看消息是否发送给邮件列表。如果是，列表\
    \ Agent 生成一条新消息，其中包含邮件列表中各个用户的姓名。<br><br>新消息被返回到队列 0，原始消息被删除。 |\n| 6 | NMAP Agent\
    \ | 如果没有进行任何修改，NMAP Agent 通过将文件扩展名从 .001 更改为 .002，将文件移动到队列 2，并通知别名和/或自动回复 Agent\
    \ 有待处理的消息。 |\n| 7 | 别名 Agent<br>自动回复 Agent | 队列 2 由别名 Agent 和自动回复 Agent 共享。<br><br>别名\
    \ Agent 检查控制文件，查看收件人是否匹配其定义的任何别名。如果是，别名 Agent 将别名替换为对应的电子邮件地址。<br><br>自动回复 Agent\
    \ 检查收件人的用户对象，查看收件人是否已配置自动回复消息或将消息转发到另一个电子邮件账户。用户的转发和自动回复信息存储在其用户对象中。<br><br>如果收件人已转发其邮件，Agent\
    \ 会将转发地址添加到收件人列表中。如果收件人未请求消息副本，Agent 将收件人姓名替换为转发地址。<br><br>如果收件人已配置自动回复消息，Agent\
    \ 会生成一条新消息并将其交给 NMAP，以便在消息队列中处理。 |\n| 8 | NMAP Agent | 如果原始消息已被修改，NMAP Agent 会将该消息返回队列\
    \ 0 以重新处理。<br><br>如果没有进行任何修改，NMAP Agent 通过将文件扩展名从 .002 更改为 .003，将文件移动到队列 3，并通知规则\
    \ Agent 有待处理的消息。 |\n| 9 | 规则 Agent | 在队列 3 中，规则 Agent 根据存储在用户对象中的收件人定义的规则检查该消息。如果消息匹配\
    \ 1 个规则条件，规则 Agent 应用该规则。<br><br>如果规则指示将消息发送到特定文件夹，规则 Agent 会以 IMAP 格式将目标文件夹信息添加到控制文件中。使用\
    \ IMAP 协议指定目标文件夹，使得消息可以在任何基于标准的电子邮件客户端中被路由到正确的文件夹。 |\n| 10 | NMAP Agent | 如果消息已被修改，NMAP\
    \ Agent 会将该消息返回队列 0 以重新处理。<br><br>如果没有进行修改，NMAP Agent 通过将文件扩展名从 .003 更改为 .005，将文件移动到队列\
    \ 5。 |\n| 11 | 日历 Agent | 在队列 5 中，日历 Agent 检查该消息是否是对计划预约的“接受”或“拒绝”回复。如果该消息是对预约的回复，且安排该预约的人是本地用户，日历\
    \ Agent 会更新用户的日历存储 (mail.cal)，以表明发件人已接受或拒绝了该预约。 |\n| 12 | NMAP Agent | 如果消息已被修改，NMAP\
    \ Agent 会将该消息返回队列 0 以重新处理。如果没有进行修改，NMAP Agent 通过将文件扩展名从 .005 更改为 .006，将文件移动到队列\
    \ 6。 |\n| 13 | NMAP Agent | 在队列 6 中，NMAP Agent 检查控制文件信封中的收件人列表；然后执行以下操作之一：<br>•\
    \ 如果任何收件人是本地用户，NMAP Agent 将消息副本投递到这些用户的邮箱中。<br>• 如果消息超过单副本消息存储 (SCMS) 阈值，该消息将被复制到\
    \ SCMS 目录。<br>• 如果某些收件人不在当前 NMAP Agent 的上下文中，但在目录树内，NMAP Agent 将消息转交给分配给这些用户上下文的\
    \ NMAP Agent。<br>• 如果任何收件人不在目录树内，NMAP Agent 将消息移动到队列 7 进行远程投递。 |\n| 14 | NMAP\
    \ Agent | 在队列 7 中，NMAP Agent 将消息传递给 SMTP Agent 进行远程投递。 |\n\n## 目标 4 安装 NetMail\n\
    \n要在您的 Linux 服务器上安装 NetMail，您需要了解如何执行以下操作：\n\n- 设计您的 NetMail 系统\n- 满足系统要求\n- 收集所需信息\n\
    - 使用 NNLS 安装功能\n\n### 设计您的 NetMail 系统\n\n如前所述，NetMail 可以以 2 种方式配置：\n\n- 单服务器消息传递\n\
    - 分布式服务器消息传递\n\n在单服务器消息传递系统中，所有 NetMail 组件都在同一服务器上运行，如下所示：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_206_0.png)\n\
    \n在分布式服务器消息传递系统中，NetMail 组件分布在 2 个或多个服务器上，如下所示：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_207_0.png)\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_207_1.png)\n\nNetMail 还可以配置为使用相同的 eDirectory\
    \ 树服务多个互联网域名。在这种情况下，可以配置多个单服务器消息传递系统来服务不同的域名，如下所示：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_207_2.png)\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_207_3.png)\n\n如果性能和可扩展性是贵组织关心的问题，您可以实施分布式系统，然后在不同的服务器上复制\
    \ Agent。\n\n在设计您的 NetMail 系统时，您需要确定以下内容：\n\n- 哪些服务器将托管 NetMail Agent？\n- 哪些 Agent\
    \ 将位于特定的服务器上？\n- 每个消息服务器将服务哪些域名？\n- 贵组织是否需要在多个服务器上部署相同的 Agent 以实现容错和可扩展性？\n\n\
    ### 满足系统要求\n\n要安装 NetMail，您必须满足以下系统要求：\n\n- 确保您正在运行以下版本之一：\n  - Red Hat® Linux\
    \ AS 2.1\n  - Red Hat Linux ES 2.1\n  - SuSE® SLES 8\n- 确保已安装 Linux 版 eDirectory\
    \ 8.7.3 或更高版本。\n- 确保您的系统 CPU 至少是 750 MHz Pentium® III 或 Athlon。\n- 确保您至少有 512\
    \ MB 的系统 RAM。\n- 确保您有 20 MB 的可用磁盘空间用于安装。NetMail 消息存储的磁盘空间会有所不同，具体取决于用户数量以及每个邮箱允许的磁盘空间量。\n\
    - 托管 NetMail 服务的每个服务器必须拥有包含使用消息服务的用户的分区中的 eDirectory 副本。\n- 确保 eDirectory 树已同步且健康。\n\
    - 确保您对计划安装 NetMail 的 eDirectory 树具有管理员权限。\n\n"
