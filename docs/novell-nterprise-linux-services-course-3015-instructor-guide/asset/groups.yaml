    地址并将其发送给连接管理器代理。<br>连接管理器随后在指定时间段内跟踪该 IP 地址（默认为 15 分钟）。<br>任何代理都可以查询连接管理器以获取已认证的
    IP 地址。<br>在 NetMail 中，此服务用于 SMTP 代理的 SMTP-after-POP 功能。这是一项 UBE 保护功能，可防止未授权用户通过您的消息系统进行邮件中继。<br>连接管理器代理监听
