    # Exercise 6-5  **Configure and Test NetStorage**


    ![](img/d63035f3fce0eaaf97203dde900affb7_120_0.png)


    As network administrator for your Digital Airlines office, you have been assigned
    to configure NetStorage services for the Efficiency Project team that has just
    been formed.


    You have also been asked to create a personal folder for the team lead, SRIfe.


    The Efficiency Project team is composed of the ACCTUSERS group.


    You''ll do this in 3 parts.


    +   - Part I: Test the Default NetStorage Configuration

    +   - Part II: Configure the Team Lead to Use a Personal Folder

    +   - Part III: Create a Project Files Folder the Team Can Use to Share Files


    # **Part I: Test the Default NetStorage Configuration**


    In this part of the exercise you will test the default NetStorage configuration
    by making no changes to the smb.conf file and not converting eDirectory users
    to LUM or Samba.


