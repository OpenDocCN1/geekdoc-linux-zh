    # **How to Configure Your iFolder Server**


    After iFolder is installed, you must perform some post-installation configuration
    tasks to make iFolder work according to your enterprise''s needs. These tasks
    are described in this section.


    Also described in this section are the steps to changing your iFolder data location,
    which is an optional task.


