    \  - 在浏览器窗口中选择文件夹视图按钮可在另一列中显示文件夹，并允许您展开和收缩文件夹。\n  - 文本视图仅显示当前目录中的文件和文件夹，不允许展开或收缩文件夹。\n\
    \  - 本地文件和文件夹无法通过 NetStorage 访问。此外，您不能从 NetStorage 映射驱动器或更改登录脚本。\n- 完成后，关闭 Web\
    \ 浏览器。\n\n## 配置 NetStorage\n\n使用 Novell iManager，您可以在将 NetStorage 安装到 Linux 服务器后更改其\
    \ NetStorage 配置。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_117_0.png)\n\n更改任何设置后，必须重新启动\
    \ Apache Web 服务器。\n\n要重新启动 Apache Web 服务器，请转到 `/etc/init.d` 目录并输入 **/novell-httpd\
    \ restart** 以停止并启动 Web 服务器。\n\n要配置 NetStorage，请执行以下操作：\n\n1.  从 Web 浏览器启动并登录到\
    \ iManager。\n   -   用于访问 NetStorage 的工作站的日期和时间应与运行 NetStorage 的服务器的日期和时间大致相近（在几小时内），以避免冲突。\n\
    2.  在左列中，找到要更改的 NetStorage 配置选项。\n\n### 图 6-20\n\n以下图示说明了这些选项：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_118_0.png)\n\
    \n提供以下配置选项：\n\n-   **身份验证域**。允许您更改或添加 NetStorage 所需的 eDirectory 服务器 URL 和上下文。这允许您访问两个或多个\
    \ eDirectory 树。此页面还允许您更改指定为主要 eDirectory 服务器的 eDirectory 服务器。\n-   **浏览文件**。显示\
    \ NetStorage 网页。\n-   **当前会话**。显示包含当前 NetStorage 会话信息的报告。\n-   **常规**。允许您配置位置、证书名称、会话超时、清理级别和\
    \ LDAP 端口等项目。\n-   **iFolder 存储提供程序**。如果您在 Linux 服务器上安装了 Novell iFolder，您可以查看或编辑诸如根目录、口令短语表单协议、iFolder\
    \ 服务器和安全端口等配置设置。\n-   **NetWare 存储提供程序**。允许您查看或编辑诸如主名称、驱动器名称和容器搜索高度等配置设置。\n- \
    \  **资源使用情况**。显示 NetStorage 资源利用率的详细报告。\n-   **统计信息**。显示包含服务器正常运行时间、登录失败次数、NetStorage\
    \ 会话数等信息的报告。\n-   **存储位置**。允许您创建存储位置对象，以在通过 Web 浏览器显示的 NetStorage 目录访问列表中为网络目录显示指定名称。\n\
    -   **WebDAV 提供程序设置**。允许您配置 NetStorage WebDAV 提供程序（Moniker）的位置以及 HTML 接口的目录。\n\
    3.  完成后，关闭 Web 浏览器。\n\n> 有关设置这些配置选项和故障排除 NetStorage 的详细信息，请参阅 http://www.novell.com/documentation\
    \ 上的 NetStorage 管理指南。\n\n### 练习 6-5 配置和测试 NetStorage\n\n![](img/d63035f3fce0eaaf97203dde900affb7_120_0.png)\n\
    \n作为您的 Digital Airlines 办公室的网络管理员，您被分配为刚刚成立的效率项目组配置 NetStorage 服务。\n\n您还被要求为团队负责人\
    \ SRIfe 创建一个个人文件夹。\n\n效率项目组由 ACCTUSERS 组组成。\n\n您将在 3 个部分中完成此任务。\n\n- 第一部分：测试默认\
    \ NetStorage 配置\n- 第二部分：配置团队负责人使用个人文件夹\n- 第三部分：创建一个项目组可用于共享文件的项目文件文件夹\n\n####\
    \ 第一部分：测试默认 NetStorage 配置\n\n在此练习部分，您将通过不修改 smb.conf 文件且不将 eDirectory 用户转换为 LUM\
    \ 或 Samba 来测试默认的 NetStorage 配置。\n\n通过这样做，您将看到默认配置并未提供您被分配创建的 NetStorage 服务。\n\n\
    为此，请执行以下操作：\n\n1.  访问默认**共享**文件夹并上传文件到其中：\n   a. 在 Windows XP 工作站上，启动**Internet\
    \ Explorer**。\n   b. 输入 `https://your_server_DNS/NetStorage`。\n   c. 当提示时，使用密码\
    \ `novell` 以 `kfullmer` 的身份进行身份验证；然后选择**确定**。\n   d. 展开**NetStorage** 文件夹。\n\n"
