    \ software\n- Java applet\n\nThese components work together to provide users with\
    \ instant access to any iFolder files stored on their local computer from anywhere\
    \ in the world.\n\nThe following illustrates how the iFolder server is accessed\
    \ from different computers or locations:\n\n![](img/d63035f3fce0eaaf97203dde900affb7_17_0.png)\n\
    \nAt the center of the iFolder architecture is the iFolder server and storage\
    \ components. These key components let you access and synchronize network files\
    \ on the iFolder server from inside the firewall (from your office computer) or\
    \ from outside the firewall (from a laptop, home computer, or kiosk).\n\nCurrently,\
    \ the iFolder Java Applet is only compatible with Internet Explorer.\n\nAll users\
    \ connect to the iFolder server through a small iFolder client to synchronize\
    \ and store their data. Users can install the client on any Windows workstation.\
    \ This sets up an iFolder directory on their local drive.\n\nWhen users save or\
    \ update any files to this local directory, the files are automatically delivered\
    \ to the Novell iFolder server, and then synchronize to their other computers\
    \ that have the iFolder client installed.\n\nUsing the iFolder Java Applet on\
    \ Internet Explorer, users can also access their files by visiting the company's\
    \ iFolder web site, and entering their ID, password, and pass phrase (the pass\
    \ phrase enables the encryption of the files).\n\nYou can allocate space to each\
    \ user by using a default policy, or by modifying a user's individual account.\n\
    \nFiles stored on the iFolder server are encrypted and protected by the company's\
    \ backup and storage procedures.\n\nUsers authenticate to the iFolder server through\
    \ LDAP v3. The LDAP authentication server can be the Linux server that the iFolder\
    \ product was installed on, or any other LDAP-enabled directory (such as eDirectory)\
    \ that supports LDAP v3.\n\nTo authenticate, users must know their username and\
    \ password and the pass phrase used for encryption. This information is verified\
    \ by the iFolder server against the LDAP server.\n\nLDAP authentication can be\
    \ done using SSL on port 636 or clear text on port 389. It is important to realize\
    \ that the LDAP server is not accessed by the iFolder client directly, but by\
    \ an LDAP call from the iFolder server.\n\niFolder is both an intranet and an\
    \ Internet solution that will work with any LAN or Internet connection.\n"
  mdcn: "\n## iFolder 的优势\n\n由于本地数据备份的缺乏以及移动办公力量的不断壮大，企业需要一种能够轻松访问存储在网络上个人文件的产品，以及一个可以自动从任何位置同步这些文件的系统。\n\
    \niFolder 满足了企业和用户的这些需求（以及其他需求）。它提供了以下优势：\n\n- **无缝的数据访问。** iFolder 以这样的方式存储和同步用户的工作数据：无论用户从哪个客户端或哪个位置登录，他们的文件都是可用的，并且处于他们期望的状态。\n\
    - **数据保护与数据恢复。** 当用户在本地保存文件时，iFolder 客户端可以自动将数据更新到 iFolder 服务器，在那里数据立即可用于组织的常规网络备份操作。\n\
    \niFolder 还赋予互联网服务提供商（ISP）的能力，使其能够为客户提供用户值得信赖的备份解决方案，用于保护关键的商业或个人数据。\n\n- **可靠的数据安全。**\
    \ 借助 iFolder 加密，存储的数据能够免受未经授权的网络访问。\n\niFolder 在数据跨越互联网之前对其进行加密，并将其存储在 Novell\
    \ iFolder 服务器上，从而防止未授权用户获取。\n\n- **高效的移动用户。** iFolder 消除了版本不一致的问题，使用户能够轻松地从任何连接的台式机、笔记本电脑或\
    \ Web 浏览器访问其文档的最新版本。\n\n在准备出差或在家办公时，用户不再需要从各种台式机和网络位置将所需数据复制到他们的笔记本电脑中。\n\niFolder\
    \ 客户端可以自动将用户最当前的文件版本更新到他们的笔记本电脑和台式机上。即使用户丢失了笔记本电脑，所有那些文件仍可通过任何连接到互联网的计算机进行访问。\n\
    \n- **跨平台支持。** iFolder 服务器可与运行在 NetWare® 和 Linux 上的 Apache Web 服务器，或运行在 Windows\
    \ 2000 上的 Microsoft Internet Information Servers (IIS) Web 服务器集成。\n\n此外，iFolder\
    \ 对用户身份验证的 LDAP 支持允许您利用运行在 NetWare、Linux 和 Windows 2000 服务器上的 Novell eDirectory™，或运行在\
    \ Windows 2000 服务器上的 Microsoft Active Directory™。\n\n- **简单数据和账户管理。** iFolder\
    \ 旨在允许网络管理员轻松设置和管理。\n\niFolder 服务器可以通过标准 Web 浏览器在任何位置进行管理。凭借其自动文件更新、同步和加密功能，iFolder\
    \ 还使 IT 部门从常规维护任务中解放出来。\n\n网络管理员还有选择使用 eDirectory 或 Microsoft Active Directory（仅在\
    \ Windows 2000 服务器上）来管理 Novell iFolder 账户。\n\n- **大规模部署。** iFolder 的关键功能之一是其能够扩展到一个庞大且不断增长的环境。您可以在多台服务器上安装\
    \ iFolder，使您的 iFolder 环境能够随着业务的成长而扩展。\n\n在您拥有的 iFolder 网络中，iFolder 服务器的数量没有实际限制——单个\
    \ iFolder 服务器可处理多达 10,000 个用户账户。反过来，这些服务器中的每一个共同作用作为一个系统。\n\n由于 iFolder 负责将用户身份验证请求重定向到正确的\
    \ iFolder 服务器，登录过程对于用户来说是无缝的体验。\n\n此外，随着您的 iFolder 网络的增长，您的管理成本保持不变，因为所有 iFolder\
    \ 服务器的管理都通过 iFolder 管理控制台进行集中处理。\n\n- **用户优势。** Novell iFolder 为用户提供以下优势：\n  \
    \  - 通过将本地文件自动备份到 iFolder 服务器和您的多台工作站，防范本地数据丢失。\n    - 自动更新您经常使用的机器（工作场所、笔记本电脑、家庭）之间的文件，使所有机器上的数据视图保持一致。\n\
    \    - 允许您将在本地目录（例如“我的文档”）中的文件，您可以像往常一样使用它们。\n    - 允许您使用 Web 浏览器在任何地方访问您的文件。\n\
    \    - 跟踪并记录您离线工作时所做的更改，并在您上线时同步这些更改。\n    - 启用加密后，保护数据在传输过程中以及在 iFolder 服务器上存储期间的安全。\n\
    \n## iFolder 的功能\n\n除了 iFolder 提供的优势外，以下是使 iFolder 成为高效个人文件访问和同步服务的关键功能：\n\n-\
    \ **支持以下网络操作系统：**\n    - 带有支持包 5 或更高版本的 NetWare 5.1\n    - 带有支持包 2 或更高版本的 NetWare\
    \ 6.0\n    - NetWare 6.5 或更高版本\n    带有服务包 3 或更高版本的 Microsoft Windows 2000 Server\n\
    \    - Red Hat® Linux AS 2.1 Enterprise\n    - SuSE® SLES 8\n- **对以下系统的 LDAP 支持：**\n\
    \    - 适用于 NetWare、Windows 2000 和 Red Hat 或 SLES 8 Linux 服务器的 Novell eDirectory\n\
    \    - 适用于 Windows 2000 服务器的 Microsoft Active Directory\n- **大规模部署支持** 使用多台 iFolder\
    \ 服务器作为单一系统运行\n- **报告生成器** 供管理员查看 iFolder 用户和 iFolder 系统的统计数据\n- **通过 NNLS 中的\
    \ Red Carpet™ 守护进程进行自动升级**\n- **支持以下工作站操作系统的客户端：**\n    - Windows 98/ME\n    -\
    \ Windows NT® 4/2000 Professional\n    - Windows XP Home 和 Professional\n- **使用\
    \ Novell NetDrive 将驱动器映射到 iFolder 服务器，以并发访问多个 iFolder 账户**\n- **通过 Novell NetDrive\
    \ 支持瘦客户端**，适用于 Citrix® MetaFrame® 服务器、Windows 2000 Terminal Server 和 ZENworks®\
    \ OnDemand Services\n- **文件加密** 在传输过程中以及在 iFolder 服务器上，以保护用户数据免受未授权访问\n- **通过\
    \ Web 浏览器管理 iFolder 服务器和账户**\n\n![](img/d63035f3fce0eaaf97203dde900affb7_16_0.png)\n\
    \n有关 iFolder 客户端主要功能的信息，请参阅位于 http://www.novell.com/documentation 的 Novell iFolder\
    \ 2.1 用户指南。\n\n## iFolder 组件\n\niFolder 包含 3 个软件组件：\n\n- iFolder 服务器软件\n- iFolder\
    \ 客户端软件\n- Java 小程序（Applet）\n\n这些组件协同工作，为用户提供即时访问存储在本地计算机上的任何 iFolder 文件的能力，无论身处世界何处。\n\
    \n下图说明了如何从不同的计算机或位置访问 iFolder 服务器：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_17_0.png)\n\
    \niFolder 架构的核心是 iFolder 服务器和存储组件。这些关键组件允许您从防火墙内部（从您的办公计算机）或防火墙外部（从笔记本电脑、家庭计算机或公用终端机）访问和同步\
    \ iFolder 服务器上的网络文件。\n\n目前，iFolder Java 小程序仅与 Internet Explorer 兼容。\n\n所有用户都通过小型的\
    \ iFolder 客户端连接到 iFolder 服务器，以同步和存储他们的数据。用户可以在任何 Windows 工作站上安装客户端。这会在其本地驱动器上设置一个\
    \ iFolder 目录。\n\n当用户向此本地目录保存或更新任何文件时，文件会自动传输到 Novell iFolder 服务器，然后同步到安装了 iFolder\
    \ 客户端的其他计算机。\n\n使用 Internet Explorer 上的 iFolder Java 小程序，用户还可以通过访问公司的 iFolder\
    \ 网站，并输入他们的 ID、密码和口令（口令用于对文件进行加密）来访问他们的文件。\n\n您可以通过使用默认策略，或修改用户的个别账户，来为每个用户分配空间。\n\
    \n存储在 iFolder 服务器上的文件经过加密，并受到公司的备份和存储程序保护。\n\n用户通过 LDAP v3 向 iFolder 服务器进行身份验证。LDAP\
    \ 身份验证服务器可以是安装了 iFolder 产品的 Linux 服务器，或任何其他支持 LDAP v3 的启用 LDAP 的目录（例如 eDirectory）。\n\
    \n为了进行身份验证，用户必须知道他们的用户名、密码以及用于加密的口令。此信息由 iFolder 服务器与 LDAP 服务器进行验证。\n\nLDAP 身份验证可以使用端口\
    \ 636 上的 SSL 或端口 389 上的明文进行。重要的是要认识到，LDAP 服务器不是由 iFolder 客户端直接访问，而是通过来自 iFolder\
    \ 服务器的 LDAP 调用访问。\n\niFolder 既是一个内网解决方案，也是一个互联网解决方案，适用于任何局域网或互联网连接。\n\n"
