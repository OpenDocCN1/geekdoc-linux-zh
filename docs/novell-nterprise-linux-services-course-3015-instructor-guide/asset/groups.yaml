  md: "\n# Objective 4 Prepare for NetMail Installation\n\n- Decide what you want\
    \ to name the **Messaging Server** object. The default is **server_name Messaging\
    \ Server**.\n\n- Make sure you know the Internet domain your NetMail system will\
    \ service and the IP addresses of primary and secondary DNS servers.\n\n- Check\
    \ for duplicate port assignments on your server. NetMail uses the following ports\
    \ by default:\n\n**Table 8-6**\n\n| Port | Protocol | Agent |\n| :--- | :--- |\
    \ :--- |\n| 25 | SMTP | SMTP Agent |\n| 52080 | HTTP | Modular Web Agent |\n|\
    \ 8018 | HTTP | WebAdmin |\n| 110 | POP | POP Agent |\n| 143 | IMAP | IMAP Agent\
    \ |\n| 52389 | LDAP | Address Book Agent |\n| 689 UDP | | Connection Manager |\n\
    | 689 TCP | NMAP | NMAP Agent |\n| 52443 | HTTPS | Modular Web Agent |\n| 8020\
    \ | HTTPS | WebAdmin |\n| 995 | SSL, over POP | POP |\n| 993 | SSL, over IMAP\
    \ | IMAP |\n\n- Stop the default mail service, such as sendmail or postfix, on\
    \ the server where you will install NetMail. On many systems, sendmail is configured\
    \ to automatically start each time the server starts.\n\nTo change this on Red\
    \ Hat, open a terminal session as root and enter `chkconfig --level 2345 sendmail\
    \ off`. To change this on SuSE, open a terminal session as root and enter `chkconfig\
    \ sendmail off`.\n\n- Check the /etc/syslog.conf file for a line that starts with\
    \ mail*. If it exists, comment it out. In debug mode, mail produces enough syslog\
    \ messages to fill most disks in a short period of time.\n\n# Gather Required\
    \ Information\n\nBefore you start installing NetMail, gather the following information:\n\
    \n**Table 8-7**\n\n| Parameter | Value |\n| --- | --- |\n| Admin Name with Context\
    \ | |\n| Admin Password | |\n| NetMail Primary DNS Server | |\n| NetMail Secondary\
    \ DNS Server | |\n| Domain Name for NetMail Server | |\n| NetMail WebAccess HTTP\
    \ Port | |\n| NetMail WebAccess HTTPS Port | |\n| NetMail LDAP Port | |\n\n# Use\
    \ the NNLS Install Feature\n\nTo install NetMail from NNLS, do the following:\n\
    \n1. Perform the steps to do a custom installation.\n   If necessary, see Section\
    \ 2 for details on how to perform a custom installation.\n2. Deselect the services\
    \ you *do not want* to install, select the NetMail service; then continue.\n \
    \  - If eDirectory has not previously been installed, notice that it is selected\
    \ by default when you select NetMail (along with other required components such\
    \ as Apache and Tomcat).\n   - If eDirectory has been previously installed, the\
    \ install program will indicate which components are already installed.\n3. Accept\
    \ the license agreement.\n4. (Conditional) If prompted for the location of the\
    \ NICI Foundation Key (NFK) file, enter the path to the NFK file.\n   You will\
    \ only be asked for the NICI Foundation Key if eDirectory has not previously been\
    \ installed.\n5. Enter the information requested at each prompt (see Table 8-7).\n\
    6. View the summary information and make any necessary corrections.\n7. When all\
    \ the information is correct, finish the install.\n8. View the readme file and\
    \ save the installation settings log file.\n\n# Objective 5 Configure and Use\
    \ NetMail\n\nEach agent in the NetMail system has its own set of properties that\
    \ can be configured. This objective is limited to the following configuration\
    \ tasks:\n\n- Running WebAdmin\n- Configuring the Contexts Serviced by the NMAP\
    \ Agent\n- Selecting a Web Interface Template\n\n## Running WebAdmin\n\nWebAdmin\
    \ is the utility used to configure the NetMail system. It is a browser-based utility\
    \ that is integrated into iManager.\n\nTo access WebAdmin directly, open a web\
    \ browser and enter **http://your_server_IP:8018** or **https://your_server_IP:8020**\n\
    \nTo access WebAdmin from within iManager, complete the following:\n\n1. At the\
    \ left, scroll down and select **Launch NetMail Management**.\n2. In the WebAdminServer\
    \ name field, browse to and select your *WebAdmin server*; then select **OK**.\n\
    \n## Configuring the Contexts Serviced by the NMAP Agent\n\nThe NetMail system\
    \ services all users in the containers configured in the Context property of the\
    \ NMAP Agent, as shown in the following:\n\n![](img/d63035f3fce0eaaf97203dde900affb7_213_0.png)\n\
    \nThe first context was defined when the NMAP Agent was created and is the same\
    \ as the context where the server resides. Additional user contexts can be added\
    \ from the Context page.\n\nBecause NMAP contexts are not inherited, each container\
    \ or sub-container serviced by an NMAP Agent must be added to that agent’s context\
    \ list.\n\nMessaging services are automatically provided to every user in the\
    \ NMAP Agent’s assigned contexts. User mailboxes are created in the local message\
    \ store directory the first time users receive a message.\n\n> Do not add the\
    \ same context to multiple NMAP Agents.\n\nNMAP contexts are tracked by the messaging\
    \ server. When it starts, the messaging server generates a list of NMAP contexts\
    \ and holds it in server memory. This list is used to generate aliases and address\
    \ books.\n\nChanges made to the list of contexts is dynamically updated. The NetMail\
    \ service doesn’t need to be restarted. However, if users are added to a context\
    \ while the server is running, they won’t appear in the address book until the\
    \ server is restarted.\n\nTo configure the eDirectory contexts service by the\
    \ NMAP Agent, do the following:\n\n1. In WebAdmin, expand **Internet Services**.\n\
    2. Expand **Messaging Server**.\n3. Select **NMAP Agent**.\n4. Select **Context**.\n\
    5. Select the **magnifying glass** icon.\n6. Browse to and select each *container*\
    \ you want the NMAP Agent to service; then select **Save**.\n7. Select **Save**.\n\
    \n## Selecting a Web Interface Template\n\nTemplates control the appearance of\
    \ the Modular Web Agent’s mail client interface. By default, 2 templates ship\
    \ with NetMail:\n\n- WebAccess (Webacc.CTP)\n- WebMail (WebMail.CTP)\n\nEach template\
    \ contains everything needed to present its respective client interface. When\
    \ the Modular Web Agent initializes on the messaging server, it simply loads the\
    \ template files into memory.\n\nTo select the default template, do the following:\n\
    \n1. In **WebAdmin**, expand **Internet Services**.\n2. Expand **Messaging Server**.\n\
    3. Select **Modular Web Agent**.\n4. Scroll down to the **Default Template** field,\
    \ as shown in the following:\n\n![](img/d63035f3fce0eaaf97203dde900affb7_215_0.png)\n\
    \n5. Select the **magnifying glass** icon.\n6. Browse to and select the *template\
    \ object* you want to use.\n7. By default, the templates are located in **Templates.Internet\
    \ Services**.\n8. Select **Save**.\n\n> If you enter incorrect login information\
    \ to access WebAccess or WebMail when using a Mozilla browser, the login dialog\
    \ box is not displayed.\n>\n> You must either refresh the window or re-enter the\
    \ URL. If you click the Log In Again link after logging out of WebAccess or WebMail,\
    \ you are taken to the logged-out page. You must start a new browser to get to\
    \ the login prompt.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_216_0.png)\n\n\
    The messaging server is dependent on the DNS server as a name resolver, even if\
    \ you are using IP addresses instead of DNS names.\n\n# Exercise 8-1 Configure\
    \ and Test NetMail for Your Digital Airlines Office\n\nIn this exercise, you configure\
    \ the NMAP Agent to service your entire container and test the mail server.\n\n\
    Do the following:\n\n1. Verify that sendmail isn't running:\n   a. On your NNLS\
    \ server, open a terminal session.\n   b. Change to the root user by entering\
    \ su - and a password of novell.\n   c. Enter chkconfig --list sendmail.\n   \n\
    \      The sendmail daemon should be set to off for run levels 3 (non-graphical\
    \ boot) and 5 (graphical boot).\n\n2. Make sure DNS is resolving your server's\
    \ IP address correctly by entering ping DAx.your container.digitalairlines.com\
    \ (press Ctrl+C to stop the ping).\n   \n   For example, if you are working on\
    \ DA3, you would enter ping DA3.atl.digitalairlines.com.\n\n3. Access WebAdmin\
    \ and verify that NetMail is configured to service users in your container:\n\
    \   a. On your NNLS server, open a browser window and enter https://DAx.your container.digitalairlines.com:8020.\n\
    \   \n      The Novell WebAdmin login page appears.\n   b. Log in as admin with\
    \ a password of novell.\n   c. On the left, expand Internet Services.\n   d. Expand\
    \ DAx Messaging Server.\n   e. Select NMAP Agent.\n   f. (Conditional) If an About\
    \ Popups dialog appears, select No. An NMAP Agent page appears with several tabs.\n\
    \   g. Select the Context tab.\n   h. Verify that your container is listed.\n"
  mdcn: "\n# 目标 4 准备安装 NetMail\n\n- 确定您希望**消息服务器**对象的名称。默认名称为 **server_name Messaging\
    \ Server**。\n\n- 确保您知道您的 NetMail 系统将服务的互联网域以及主 DNS 服务器和备用 DNS 服务器的 IP 地址。\n\n\
    - 检查服务器上的端口分配是否有重复。NetMail 默认使用以下端口：\n\n**表 8-6**\n\n| 端口 | 协议 | 代理 |\n| :---\
    \ | :--- | :--- |\n| 25 | SMTP | SMTP 代理 |\n| 52080 | HTTP | 模块化 Web 代理 |\n| 8018\
    \ | HTTP | WebAdmin |\n| 110 | POP | POP 代理 |\n| 143 | IMAP | IMAP 代理 |\n| 52389\
    \ | LDAP | 地址簿代理 |\n| 689 UDP | | 连接管理器 |\n| 689 TCP | NMAP | NMAP 代理 |\n| 52443\
    \ | HTTPS | 模块化 Web 代理 |\n| 8020 | HTTPS | WebAdmin |\n| 995 | SSL, 基于 POP | POP\
    \ |\n| 993 | SSL, 基于 IMAP | IMAP |\n\n- 在即将安装 NetMail 的服务器上停止默认邮件服务，例如 sendmail\
    \ 或 postfix。在许多系统中，sendmail 被配置为每次服务器启动时自动启动。\n\n要在 Red Hat 上更改此设置，请以 root 身份打开终端会话并输入\
    \ `chkconfig --level 2345 sendmail off`。要在 SuSE 上更改此设置，请以 root 身份打开终端会话并输入 `chkconfig\
    \ sendmail off`。\n\n- 检查 /etc/syslog.conf 文件中是否有以 mail* 开头的行。如果存在，请将其注释掉。在调试模式下，邮件会产生足够多的\
    \ syslog 消息，在短时间内填满大多数磁盘。\n\n# 收集所需信息\n\n在开始安装 NetMail 之前，请收集以下信息：\n\n**表 8-7**\n\
    \n| 参数 | 值 |\n| --- | --- |\n| 带上下文的管理员名称 | |\n| 管理员密码 | |\n| NetMail 主 DNS 服务器\
    \ | |\n| NetMail 备用 DNS 服务器 | |\n| NetMail 服务器域名 | |\n| NetMail WebAccess HTTP\
    \ 端口 | |\n| NetMail WebAccess HTTPS 端口 | |\n| NetMail LDAP 端口 | |\n\n# 使用 NNLS\
    \ 安装功能\n\n要从 NNLS 安装 NetMail，请执行以下操作：\n\n1. 执行自定义安装的步骤。\n   如有必要，请参阅第 2 节了解如何执行自定义安装的详细信息。\n\
    2. 取消选中您*不想*安装的服务，选中 NetMail 服务；然后继续。\n   - 如果 eDirectory 之前未安装，请注意，当您选择 NetMail\
    \ 时，eDirectory 默认已被选中（连同其他必需组件，如 Apache 和 Tomcat）。\n   - 如果 eDirectory 之前已安装，安装程序将指示哪些组件已经安装。\n\
    3. 接受许可协议。\n4. （条件）如果提示输入 NICI 基础密钥（NFK）文件的位置，请输入 NFK 文件的路径。\n   只有当 eDirectory\
    \ 之前未安装时，才会要求输入 NICI 基础密钥。\n5. 输入每个提示中请求的信息（参见表 8-7）。\n6. 查看摘要信息并进行必要的更正。\n7.\
    \ 当所有信息都正确时，完成安装。\n8. 查看 readme 文件并保存安装设置日志文件。\n\n# 目标 5 配置和使用 NetMail\n\nNetMail\
    \ 系统中的每个代理都有自己的可配置属性集。本目标仅限于以下配置任务：\n\n- 运行 WebAdmin\n- 配置 NMAP 代理服务的上下文\n- 选择\
    \ Web 界面模板\n\n## 运行 WebAdmin\n\nWebAdmin 是用于配置 NetMail 系统的实用工具。它是一个基于浏览器的实用工具，集成到\
    \ iManager 中。\n\n要直接访问 WebAdmin，请打开 Web 浏览器并输入 **http://your_server_IP:8018**\
    \ 或 **https://your_server_IP:8020**\n\n要从 iManager 内部访问 WebAdmin，请完成以下操作：\n\n\
    1. 在左侧，向下滚动并选择 **Launch NetMail Management**。\n2. 在 WebAdminServer 名称字段中，浏览并选择您的\
    \ *WebAdmin 服务器*；然后选择 **确定**。\n\n## 配置 NMAP 代理服务的上下文\n\nNetMail 系统服务于在 NMAP 代理的\
    \ Context 属性中配置的所有容器中的所有用户，如下所示：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_213_0.png)\n\
    \n第一个上下文是在创建 NMAP 代理时定义的，与服务器所在的上下文相同。可以从 Context 页面添加额外的用户上下文。\n\n由于 NMAP 上下文不是继承的，因此\
    \ NMAP 代理服务的每个容器或子容器都必须添加到该代理的上下文列表中。\n\n消息服务自动提供给 NMAP 代理分配的上下文中的每个用户。用户邮箱在用户第一次收到消息时在本地消息存储目录中创建。\n\
    \n> 请勿将同一上下文添加到多个 NMAP 代理中。\n\nNMAP 上下文由消息服务器跟踪。启动时，消息服务器生成 NMAP 上下文列表并将其保存在服务器内存中。此列表用于生成别名和地址簿。\n\
    \n对上下文列表所做的更改是动态更新的。无需重新启动 NetMail 服务。但是，如果在服务器运行时向上下文中添加用户，他们不会出现在地址簿中，直到服务器重启。\n\
    \n要配置由 NMAP 代理服务的 eDirectory 上下文，请执行以下操作：\n\n1. 在 WebAdmin 中，展开 **Internet Services**。\n\
    2. 展开 **Messaging Server**。\n3. 选择 **NMAP Agent**。\n4. 选择 **Context**。\n5. 选择\
    \ **放大镜** 图标。\n6. 浏览并选择您希望 NMAP 代理服务的每个 *容器*；然后选择 **保存**。\n7. 选择 **保存**。\n\n##\
    \ 选择 Web 界面模板\n\n模板控制模块化 Web 代理的邮件客户端界面的外观。默认情况下，NetMail 附带 2 个模板：\n\n- WebAccess\
    \ (Webacc.CTP)\n- WebMail (WebMail.CTP)\n\n每个模板都包含展示其相应客户端界面所需的全部内容。当模块化 Web 代理在消息服务器上初始化时，它只需将模板文件加载到内存中。\n\
    \n要选择默认模板，请执行以下操作：\n\n1. 在 **WebAdmin** 中，展开 **Internet Services**。\n2. 展开 **Messaging\
    \ Server**。\n3. 选择 **Modular Web Agent**。\n4. 向下滚动到 **默认模板** 字段，如下所示：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_215_0.png)\n\
    \n5. 选择 **放大镜** 图标。\n6. 浏览并选择您要使用的 *模板对象*。\n7. 默认情况下，模板位于 **Templates.Internet\
    \ Services** 中。\n8. 选择 **保存**。\n\n> 如果使用 Mozilla 浏览器访问 WebAccess 或 WebMail 时输入了错误的登录信息，则不会显示登录对话框。\n\
    >\n> 您必须刷新窗口或重新输入 URL。如果在注销 WebAccess 或 WebMail 后单击“重新登录”链接，您将到达注销页面。您必须启动一个新的浏览器才能到达登录提示。\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_216_0.png)\n\n即使您使用的是 IP 地址而不是 DNS\
    \ 名称，消息服务器也依赖于 DNS 服务器作为名称解析器。\n\n# 练习 8-1 配置并测试您的数字航空办公室的 NetMail\n\n在本练习中，您将配置\
    \ NMAP 代理以服务您的整个容器并测试邮件服务器。\n\n执行以下操作：\n\n1. 验证 sendmail 未在运行：\n   a. 在您的 NNLS\
    \ 服务器上，打开一个终端会话。\n   b. 通过输入 su - 和密码 novell 切换到 root 用户。\n   c. 输入 chkconfig\
    \ --list sendmail。\n   \n      sendmail 守护进程应设置为在运行级别 3（非图形引导）和 5（图形引导）下关闭。\n\n\
    2. 通过输入 ping DAx.your container.digitalairlines.com 来确保 DNS 正确解析您服务器的 IP 地址（按\
    \ Ctrl+C 停止 ping）。\n   \n   例如，如果您在 DA3 上工作，则输入 ping DA3.atl.digitalairlines.com。\n\
    \n3. 访问 WebAdmin 并验证 NetMail 已配置为服务您容器中的用户：\n   a. 在您的 NNLS 服务器上，打开浏览器窗口并输入 https://DAx.your\
    \ container.digitalairlines.com:8020。\n   \n      Novell WebAdmin 登录页面出现。\n  \
    \ b. 以 admin 身份登录，密码为 novell。\n   c. 在左侧，展开 Internet Services。\n   d. 展开 DAx Messaging\
    \ Server。\n   e. 选择 NMAP Agent。\n   f. （条件）如果出现 About Popups 对话框，请选择 否。将出现带有多个选项卡的\
    \ NMAP Agent 页面。\n   g. 选择 Context 选项卡。\n   h. 验证您的容器是否已列出。\n\n"
