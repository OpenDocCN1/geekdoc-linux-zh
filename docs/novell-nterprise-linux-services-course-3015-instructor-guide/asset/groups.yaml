    \ files to his iFolder directory and automatic synchronization begins. At first\
    \ login, the user’s account is created on the iFolder server and the iFolder home\
    \ directory is placed on the user’s desktop.\n\nThe iFolder client is always aware\
    \ of any local activity and, based on the synchronization preferences chosen by\
    \ you (as network administrator) or the user, the iFolder client regularly asks\
    \ the iFolder server for a download of any new data.\n\nAfter the iFolder server\
    \ downloads the data, it uploads any updates from the iFolder local directory.\
    \ When you access your account from a different computer, the iFolder server first\
    \ downloads any updates before uploading the iFolder client changes.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_22_0.png)\n\
    \nFor additional details on iFolder components and architecture, see “In-Depth\
    \ Look at Authentication, Encryption, and Synchronization” in the Novell iFolder\
    \ Installation and Administration Guide at http://www.novell.com/documentation/ig/ifold\
    \ er21.\n\n### How iFolder Synchronizes Files\n\nThe following steps outline the\
    \ synchronization process between the files on your local hard drive and the iFolder\
    \ server:\n\n![](img/d63035f3fce0eaaf97203dde900affb7_23_0.png)\n\n1. The user\
    \ authenticates to the iFolder server through the iFolder client.\n2. The iFolder\
    \ server performs an LDAP bind and verifies that the user is on the correct server.\
    \ If not, the server redirects the user to the correct server.\n3. The iFolder\
    \ client performs a reconciliation operation and checks the files on the user’s\
    \ workstation with the files on the server.\n4. iFolder downloads any new files\
    \ from the server, and then uploads any new files in the local iFolder folder.\n\
    \   - During this process, iFolder only synchronizes the changed portion of an\
    \ existing file on a 4 kb block level.\n5. The iFolder server receives the new\
    \ files and increases the sync index. The sync index indicates the current state\
    \ of the file system.\n\nA match between the sync index on the iFolder server\
    \ and the sync index on the client workstation indicates that there has been no\
    \ change. This is how the iFolder client knows if it is out of sync. The sync\
    \ index is only 4 bytes and is a very low cost server operation.\n\n6. When another\
    \ iFolder client workstation connects to the iFolder server, the server compares\
    \ the sync index and downloads any new files.\n7. If there is a new file, iFolder\
    \ monitors the file system and catches the event.\n8. iFolder then uploads the\
    \ file to the server, and the iFolder server increments the sync index.\n9. If\
    \ there is a conflict, iFolder uses time stamps for resolution, and the old file\
    \ is placed in the Conflict Bin.\n\n## Objective 2 Install and Configure iFolder\n\
    \nYou install and configure iFolder on Linux in four basic stages:\n\n1. Install\
    \ the first iFolder server.\n2. Configure global settings, default policies, LDAP\
    \ authentication sources, and iFolder servers.\n3. Provision iFolder users.\n\
    4. Install additional iFolder servers (as needed).\n\nTo complete these phases\
    \ and manage iFolder, you need to know the following:\n\n- Prerequisites for Installing\
    \ on Linux Servers\n- How to Install iFolder from NNLS\n- How to Configure Your\
    \ iFolder Server\n- How to Access the iFolder Web Sites\n- How to Install and\
    \ Configure the iFolder Client\n- How to Manage iFolder User Accounts\n- How to\
    \ Manage iFolder Servers\n- How to Manage LDAP Servers\n- How to Monitor Your\
    \ iFolder System\n- How to Generate Reports\n\n### Prerequisites for Installing\
    \ on Linux Servers\n\nBefore you install Novell iFolder 2.1 with NNLS, make sure\
    \ your Linux server and enterprise network environment meet all of the following\
    \ prerequisites:\n\n- **iFolder server requirements.** Configure an enterprise\
    \ server with the following components:\n  - Minimum 450 MHz Intel® Pentium® II\
    \ processor.\n  - Minimum 512 MB RAM. Add more RAM if the server supports programs\
    \ or services other than iFolder.\n  - Storage capacity for server software (about\
    \ 15 MB) plus the user data for all the users' iFolder accounts.\n  - As a guide,\
    \ consider the expected number of users and the quota of storage allotted for\
    \ each iFolder user account.\n  - Also, consider the likely growth associated\
    \ with each of the parameters to anticipate future demand for storage.\n  - An\
    \ active network or Internet connection with full two-way access to other computers\
    \ on the network or Internet, or both, depending on your deployment.\n- **iFolder\
    \ server Linux requirements.** Install and configure Red Hat Enterprise Linux\
    \ AS/ES 2.1 or SLES 8, including all service packs and patches on your iFolder\
    \ server.\n"
  mdcn: "\n\n如果您将 iFolder 服务器部署在防火墙之后，请务必记住，iFolder 使用 80 和 443 端口来进行客户端和服务器访问。管理页面和\
    \ iFolder 客户端认证将通过 443 端口进行。\n\n## iFolder 架构\n\n要了解 iFolder 组件和架构如何协同工作以同步并提供对个人文件的访问，您需要了解以下内容：\n\
    \n- Web 服务器与 iFolder\n- LDAP 与 iFolder\n- 身份验证与同步\n- iFolder 如何同步文件\n\n### Web\
    \ 服务器与 iFolder\n\niFolder 服务器软件使用 Apache 作为 NetWare 和 Linux 服务器操作系统的默认 Web 服务器。在\
    \ Windows 2000 上，iFolder 使用 IIS Web 服务器。\n\n当在 NetWare 服务器上使用基于 Apache 的解决方案运行\
    \ iFolder 时，它可以运行在操作系统空间或保护内存空间中。\n\n由于 iFolder 需要对 Apache 特定文件进行一些配置更改，因此我们建议您将\
    \ iFolder 安装在没有其他依赖 Apache 的应用程序的服务器上。\n\n如果您确实有其他使用 Apache 的应用程序，那么在安装 iFolder\
    \ 时，这些应用程序可能无法正常工作。\n\n### LDAP 与 iFolder\n\niFolder 使用 LDAP 进行用户身份验证。它使用 Novell\
    \ eDirectory 或 Microsoft Active Directory（适用于 Windows 2000）作为其所有特定的 iFolder LDAP\
    \ 对象的中心位置。\n\n您可以让 iFolder 和 LDAP 运行在同一台服务器或不同的服务器上。\n\niFolder 使用以下 LDAP 目录：\n\
    \n- **全局设置 LDAP 目录。** 此目录存储有关 iFolder 系统配置的信息，并包含 iFolder 设置、iFolder 服务器和 LDAP\
    \ 服务器对象。\n- **用户 LDAP 目录。** 此目录用于身份验证，并为已在 iFolder 管理控制台中授权使用 iFolder 的用户对象添加\
    \ iFolder 服务器名称和磁盘配额属性。\n\n无论您拥有多少台 iFolder 服务器，您都只有一个全局设置 LDAP。\n\n但是，您可以拥有多达八个用户\
    \ LDAP 目录。多个 LDAP 目录有利于那些用户对象已划分为不同 LDAP 目录的公司。\n\n例如，如果您有一个用于所有供应商的 LDAP 目录，另一个用于您的全职员工，还有一个用于您的临时雇用人员，您可以在\
    \ iFolder 中设置三个用户 LDAP 目录来处理每个目录的 iFolder 账户。\n\n在决定是使用 LDAP over SSL（端口 636）还是明文（端口\
    \ 389）连接时，请考虑以下事项：\n\n- 如果您希望不使用 SSL 加密而使用 LDAP，或者您的 LDAP 服务器不支持 SSL，请选择端口 389。\n\
    - 如果 iFolder 和 LDAP 运行在同一台服务器上，端口 389 也是一个不错的选择。由于没有数据通过线路传输，因此不需要加密。\n- 如果您希望使用\
    \ SSL，请在数据通过线路传输时为您的网络提供加密和安全性，请选择端口 636。\n\n如果您选择端口 636，在 NetWare 6 安装完成后将需要进行一些后续配置。\n\
    \n> 如果您希望使用 LDAP over SSL，并且您的 LDAP 服务器与您的 iFolder 服务器不同，您需要导出 LDAP 服务器的可信根证书，然后将其复制到您的\
    \ iFolder 服务器。\n\n### 身份验证与同步\n\n当您登录 iFolder 时，iFolder 客户端通过互联网连接将加密的用户名和密码发送到\
    \ iFolder 服务器，从而对 iFolder 服务器进行身份验证。\n\n> 这些凭据使用 RSA 加密并通过 HTTP 数据包发送到服务器。当服务器对用户进行身份验证时，它们之间的所有后续通信都使用\
    \ 128 位 Blowfish 算法进行加密。然而，所有通信仍然通过标准 http 端口 80 进行。\n\niFolder 服务器使用此信息来验证用户是否存在，然后检查该用户对象是否已在\
    \ iFolder 管理控制台中启用以使用 iFolder。\n\n在用户对象启用后，在用户可以开始在本地工作站上使用 iFolder 之前，必须在 iFolder\
    \ 服务器上创建一个用户账户。用户第一次使用 iFolder 客户端登录 iFolder 服务器时，将创建该账户。\n\n创建用户账户后，可以使用 iFolder\
    \ 管理控制台对该账户进行管理。\n\n首次登录后，用户即可开始向他的 iFolder 目录添加文件，自动同步随即开始。在首次登录时，iFolder 服务器上的用户账户将被创建，并且\
    \ iFolder 主目录会被放置在用户的桌面上。\n\niFolder 客户端始终了解任何本地活动，并根据您（作为网络管理员）或用户选择的同步首选项，iFolder\
    \ 客户端定期向 iFolder 服务器请求下载任何新数据。\n\n在 iFolder 服务器下载数据后，它会上传来自本地 iFolder 目录的任何更新。当您从另一台计算机访问您的账户时，iFolder\
    \ 服务器会先下载任何更新，然后再上传 iFolder 客户端的更改。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_22_0.png)\n\
    \n有关 iFolder 组件和架构的更多详细信息，请参见位于 http://www.novell.com/documentation/ig/ifold er21\
    \ 的《Novell iFolder 安装与管理指南》中的“身份验证、加密和同步深入解析”。\n\n### iFolder 如何同步文件\n\n以下步骤概述了本地硬盘驱动器上的文件与\
    \ iFolder 服务器之间的同步过程：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_23_0.png)\n\n\
    1. 用户通过 iFolder 客户端对 iFolder 服务器进行身份验证。\n2. iFolder 服务器执行 LDAP 绑定，并验证用户是否在正确的服务器上。如果不是，服务器将用户重定向到正确的服务器。\n\
    3. iFolder 客户端执行调整操作，并检查用户工作站上的文件与服务器上的文件。\n4. iFolder 从服务器下载任何新文件，然后上传本地 iFolder\
    \ 文件夹中的任何新文件。\n   - 在此过程中，iFolder 仅在 4 kb 块级别同步现有文件的已更改部分。\n5. iFolder 服务器接收新文件并增加同步索引。同步索引指示文件系统的当前状态。\n\
    \niFolder 服务器上的同步索引与客户端工作站上的同步索引匹配，表明没有发生更改。这是 iFolder 客户端判断是否不同步的方式。同步索引仅为 4\
    \ 字节，且是一项成本极低的服务器操作。\n\n6. 当另一个 iFolder 客户端工作站连接到 iFolder 服务器时，服务器会比较同步索引并下载任何新文件。\n\
    7. 如果有新文件，iFolder 监控文件系统并捕获该事件。\n8. 然后 iFolder 将文件上传到服务器，iFolder 服务器增加同步索引。\n\
    9. 如果发生冲突，iFolder 使用时间戳进行解决，旧文件将被放置在冲突垃圾箱中。\n\n## 目标 2 安装和配置 iFolder\n\n您在 Linux\
    \ 上安装和配置 iFolder 分为四个基本阶段：\n\n1. 安装第一台 iFolder 服务器。\n2. 配置全局设置、默认策略、LDAP 身份验证源和\
    \ iFolder 服务器。\n3. 为 iFolder 用户提供配置。\n4. 安装额外的 iFolder 服务器（如有需要）。\n\n为了完成这些阶段并管理\
    \ iFolder，您需要了解以下内容：\n\n- 在 Linux 服务器上安装的前置条件\n- 如何从 NNLS 安装 iFolder\n- 如何配置您的\
    \ iFolder 服务器\n- 如何访问 iFolder Web 站点\n- 如何安装和配置 iFolder 客户端\n- 如何管理 iFolder 用户账户\n\
    - 如何管理 iFolder 服务器\n- 如何管理 LDAP 服务器\n- 如何监控您的 iFolder 系统\n- 如何生成报告\n\n### 在 Linux\
    \ 服务器上安装的前置条件\n\n在您使用 NNLS 安装 Novell iFolder 2.1 之前，请确保您的 Linux 服务器和企业网络环境满足以下所有前置条件：\n\
    \n- **iFolder 服务器要求。** 配置一个包含以下组件的企业服务器：\n  - 最低 450 MHz Intel® Pentium® II 处理器。\n\
    \  - 最低 512 MB RAM。如果服务器支持除 iFolder 以外的程序或服务，请增加更多 RAM。\n  - 服务器软件（约 15 MB）加上所有用户\
    \ iFolder 账户的用户数据的存储容量。\n  - 作为指导，请考虑预期用户数量以及分配给每个 iFolder 用户账户的存储配额。\n  - 此外，还要考虑与每个参数相关的可能增长，以预测未来的存储需求。\n\
    \  - 一个活跃的网络或互联网连接，根据部署情况，具有与其他网络或互联网上计算机的全双工访问权限。\n- **iFolder 服务器 Linux 要求。**\
    \ 在您的 iFolder 服务器上安装并配置 Red Hat Enterprise Linux AS/ES 2.1 或 SLES 8，包括所有服务包和补丁。\n\
    \n"
