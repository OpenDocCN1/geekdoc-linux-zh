    \n（练习结束）\n\n## 目标 3 描述 Samba 的目的和架构\n\nSamba 是一个软件包，它在 Linux 上实现了 Microsoft 的\
    \ SMB/CIFS 网络协议。\n\n它允许 Linux 计算机充当与 Windows 兼容的文件服务器，并作为客户端访问其他 Windows 服务器。\n\
    \n为了描述 Samba 的目的和架构，你需要了解以下内容：\n\n- 什么是服务器消息块（SMB）\n- 什么是通用互联网文件系统（CIFS）\n- Samba\
    \ 和 NNLS\n\n### 什么是服务器消息块（SMB）\n\n服务器消息块（SMB）是一种在联网计算机之间共享资源的协议。\n\nSMB 可以在多种协议上实现，包括\
    \ TCP/IP、NetBEUI 或 IPX/SPX。\n\n> 有关 SMB 的更多信息，请参阅 http://www.samba.org/cifs/docs/what-is-smb.html。\n\
    \n### 什么是通用互联网文件系统（CIFS）\n\nCIFS 是一种在原生 TCP/IP 上实现的 SMB，不需要 NetBIOS。\n\nCIFS 是一种客户端/服务器协议，由\
    \ Microsoft Windows 操作系统使用。它也在许多其他平台（如 DOS、NetWare、UNIX®、Linux 和 VMS™）上实现。\n\n\
    使用 CIFS 的优点包括：\n\n- 你不需要 Novell 客户端来访问文件。\n- 你可以使用 Microsoft 网络的客户端。\n- 所有 Windows\
    \ 操作系统都支持 CIFS（必须支持 IP）。\n- 大多数（如果有的话）应用程序都支持 CIFS（使用原生 Windows 网络）。\n- 许多其他平台都有可用的实现（例如\
    \ UNIX/Linux 上的 Samba）。\n\n### Samba 和 NNLS\n\nSamba 是一组工具，让你可以使用 Microsoft 的\
    \ SMB/CIFS 网络协议在 Linux 计算机和其他平台上使用。\n\n安装 Samba 后，Linux 计算机可以充当：\n\n- **Windows\
    \ 服务器。** Samba 使服务器能够向用户提供 Windows 文件和打印服务。\n- **Windows 客户端。** Samba 使工作站能够访问和使用\
    \ Windows 文件和打印服务，无论它们源自 Windows 服务器还是安装了 Samba 的 Linux 服务器。\n\n与 NNLS 一起安装的 Samba\
    \ 发行版是专门为 NNLS 定制的，重点在于向在 Windows 客户端工作站上工作的用户提供经过身份验证的文件服务。\n\n此发行版配置了以下功能：\n\
    \n- 使用 NNLS 附带的 Linux 用户管理（LUM）工具在 eDirectory 中创建 Samba 用户。\n- 创建用户后，你必须使用 iManager\
    \ 或 smbpasswd 工具为每个用户指定 Samba 密码。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_81_0.png)\n\
    \n- 当 LUM 用户首次通过基于文本的控制台登录到 NNLS 服务器时，会自动创建主目录并自动分配适当的文件访问权限。\n- 访问 Samba 服务需要用户使用安全的\
    \ LDAP 向 NNLS 安装期间指定的 eDirectory 服务器进行身份验证。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_81_1.png)\n\
    \n## 目标 4 安装和配置 Samba\n\n为了安装和配置 Samba，你需要了解以下内容：\n\n- 安装 Samba 的步骤\n- 如何配置 Samba\n\
    - 如何通过 Samba 访问文件\n\n### 安装 Samba 的步骤\n\n要在你的 Linux 服务器上安装 Samba，你需要执行以下操作：\n\n\
    - 满足 Samba 依赖项\n- 收集所需信息\n- 使用 NNLS 安装功能\n\n如果你正在 NNLS 服务器上为网络中的 Windows 用户提供\
    \ Samba 文件服务，你还必须安装 Linux 用户管理（LUM）。\n\nLinux 用户管理允许你创建可以访问 NNLS 服务器的 eDirectory\
    \ 用户。\n\n### 满足 Samba 依赖项\n\nSamba 依赖于以下 NNLS 组件：\n\n- 网络内任何地方的 eDirectory 8.7.1\
    \ 或更高版本\n\n如果此组件尚未安装，你不必在安装 Samba 之前安装它。\n\nNNLS 安装程序会在你选择 Samba 组件时选择所需的组件及其依赖项（如果有）。Samba\
    \ 及其依赖组件将在同一过程中安装。\n\n有关成功安装尚未安装的 Samba 依赖项所需的必要信息，请参阅表 2-5。\n\n以下描述了你在安装 Samba\
    \ 之前需要知道的信息：\n\n### 收集所需信息\n\n![](img/d63035f3fce0eaaf97203dde900affb7_83_0.png)\n\
    \n| 所需的配置数据 | 描述 |\n| :--- | :--- |\n| eDirectory 服务器 IP 地址或 DNS 主机名 | 你正在其上安装\
    \ iFolder 的服务器的 IP 地址或 DNS 名称。Windows 用户将使用 LDAP 身份验证向 eDirectory 服务器进行身份验证以访问\
    \ NNLS 服务器上的目录和文件的主要 IP 地址。 |\n| 带有上下文的 Admin 名称 | 为 Samba 指定的 eDirectory 服务器的\
    \ Admin 的完全限定名称。名称和上下文必须使用类型化语法指定（cn=name.ou=organizational-unit.o=organization）。\
    \ |\n| Admin 密码 | Admin 的密码。 |\n| LDAP 服务器 IP 地址或 DNS 主机名 | Windows 用户将使用 LDAP\
    \ 身份验证向 eDirectory 服务器进行身份验证以访问 NNLS 服务器上的目录和文件的主要 IP 地址。 |\n| 带有上下文的 Samba 代理用户名称\
    \ | 你希望 eDirectory 为 Samba 配置的代理用户的名称。安装脚本会为你创建此用户对象。 |\n| Samba 代理用户密码 | Samba\
    \ 代理用户的密码。 |\n\n\n"
