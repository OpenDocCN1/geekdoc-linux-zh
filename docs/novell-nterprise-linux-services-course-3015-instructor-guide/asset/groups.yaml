  mdcn: "\n\n若要直接访问 Web 浏览器登录页面，请输入：\n\n```\nhttps://IP_or_domain/iFolder/Myfiles\n\
    ```\n\n您可以修改此页面以适应公司的内部需求。\n\n- **iFolder 管理控制台。** 您可以使用它管理用户的 iFolder 账户以及 iFolder\
    \ 和 LDAP 服务器。\n\n要访问 iFolder 管理控制台，请打开浏览器并输入以下内容：\n\n```\nhttps://IP_or_domain/iFolderServer/Admin\n\
    ```\n\n其中 `IP_or_domain` 是 iFolder 服务器的 IP 地址或 DNS 域名。\n\n如果在安装时指定了不同的端口，请在服务器\
    \ IP 地址后添加冒号，然后跟上端口号。例如：\n\n```\nhttps://192.168.1.1:81/iFolderServer/Admin\n\
    ```\n\n## 更改 iFolder 数据目录\n\n如果在安装 iFolder 之后，您需要更改 iFolder 数据目录的位置，请执行以下操作：\n\
    \n1. 在新位置创建一个 `ifolderdata` 文件夹。例如，如果您想将位置更改为 `/home/ifolderdata`，请输入以下命令：\n \
    \  ```bash\n   mkdir /home/ifolderdata\n   ```\n2. 将 `/var/opt/novell/ifolderdata`\
    \ 的内容复制到新位置。\n3. 通过更改 `iFolderServerRoot` 参数来指示新目录位置，从而修改 `/etc/opt/novell/ifolder/httpd_ifolder_unix.conf`\
    \ 文件。\n\n例如：`iFolderServerRoot \"/home/ifolderdata\"`\n\n4. 对新父目录应用必要的属主和权限。指定的属主应为\
    \ `novell`，指定的组应为 `novell`。权限应为 `700`。\n\n例如，请输入以下命令：\n- `ls -l /home/ifolderdata`（用于查看当前的属主和权限设置）\n\
    - `chown novell:novell /home/ifolderdata`\n- `chmod 700 /home/ifolderdata`\n-\
    \ `ls -l /home/ifolderdata`（用于查看对属主和权限设置所做的更改）\n\n5. 通过输入以下内容重启 `novell-httpd`：\n\
    \   ```bash\n   /etc/init.d/novell-httpd restart\n   ```\n\n## 如何安装和配置 iFolder\
    \ 客户端\n\n您需要在使用的一台桌面或笔记本电脑上安装 Novell iFolder 客户端软件。iFolder 客户端专为以下 Microsoft®\
    \ 操作系统环境中的工作站设计：\n\n- Windows 98/ME\n- Windows XP 家庭版和专业版\n- Windows 2000 专业版\n\
    \n您需要在工作站上安装 iFolder 客户端才能利用 iFolder 的自动同步功能。但是，您可以使用任何计算机、Web 浏览器和活动的 Internet\
    \ 连接访问 iFolder 服务器上的文件。\n\n在安装客户端之前，请确保您的工作站满足以下先决条件：\n\n- 已安装 Internet Explorer\
    \ (IE) 5.0 或更高版本\n- 已激活 Internet 连接\n\n要在工作站上安装并配置 iFolder 客户端，请执行以下操作：\n\n1.\
    \ 通过 Web 浏览器，输入以下内容以访问您的 iFolder 网站：\n   ```\n   https://IP_or_domain/iFolder\n\
    \   ```\n   其中 `IP_or_domain` 是 iFolder 服务器的 IP 地址或域名。\n   \n   iFolder 主页将会显示。\n\
    2. 在右侧的 *iFolder Windows Client* 下，选择 **Download**（下载）；然后选择 **Save**（保存）。\n3.\
    \ 将 iFolder 客户端安装文件保存到您的桌面上。\n   \n   将显示 *Download complete*（下载完成）对话框。\n4. 通过选择\
    \ **Open**（打开）开始安装。\n5. 在 *Novell iFolder Setup*（Novell iFolder 安装程序）欢迎窗口中，选择\
    \ **Next**（下一步）。\n6. 选择您的语言；然后选择 **Next**（下一步）。\n   \n   *License Agreement*（许可协议）将在浏览器窗口中显示。\n\
    7. 关闭浏览器窗口；然后通过选择 **Yes**（是）接受许可协议。\n8. 通过选择 **Next**（下一步），将 iFolder 客户端安装在默认文件夹（`C:\\\
    Program Files\\Novell\\iFolder`）中。\n9. 选择 **Finish**（完成）。\n   \n   浏览器窗口中将显示 readme\
    \ 文件。\n10. 查看 readme 文件；然后关闭窗口。\n11. 执行以下操作之一：\n    - 如果正在运行 Windows XP/2000，请选择\
    \ **Yes, I want to restart my computer now**（是，我现在要重启计算机）；然后选择 **Finish**（完成）。\n\
    \    - 等待工作站重启。\n    - 如果正在运行 Windows 98/ME，请选择 **Start iFolder**（启动 iFolder）。\n\
    \    \n    将显示 *Welcome to Novell iFolder*（欢迎使用 Novell iFolder）消息，其中包含使用 iFolder\
    \ 客户端的说明。\n12. 选择 **Continue**（继续）。\n    \n    将显示 iFolder 客户端的 *Novell iFolder\
    \ Login*（Novell iFolder 登录）窗口。\n13. 输入已启用 iFolder 的 eDirectory 用户（在显示的 iFolder\
    \ 服务器上）的用户 ID 和密码；然后选择 **Login**（登录）。\n    \n    将显示 *Novell iFolder Location*（Novell\
    \ iFolder 位置）窗口对话框。在此对话框中，您输入工作站上用于存储要与 iFolder 服务器同步的文件的文件夹。\n    \n    Windows\
    \ XP 的默认位置为 `c:\\documents and settings\\username\\my documents\\ifolder\\userid\\\
    home`。对于 Windows 98/ME，默认位置为 `c:\\my documents\\ifolder\\userid\\home`。\n    \n\
    \    `username` 是您的工作站用户名（例如 *Administrator*（管理员））；`userid` 是您的 iFolder 用户 ID（通常与网络用户\
    \ ID 相同）。\n14. 执行以下操作之一：\n    - 通过选择 **OK**（确定）选择默认位置。\n    - 浏览并选择硬盘上的另一个文件夹；然后选择\
    \ **OK**（确定）。\n    \n    将显示 *Internet Folder Setup*（Internet 文件夹设置）对话框。\n15.\
    \ 执行以下操作之一或两者：\n    - 如果要加密传输以及在 iFolder 服务器上存储的文件，请选择 **Encrypt files**（加密文件）。\n\
    \    - 如果要让 iFolder 客户端在每次启动 Windows 时自动运行，请选择 **Enable automatic login at startup**（在启动时启用自动登录）。\n\
    16. 完成后，选择 **OK**（确定）。\n    \n    如果选择 *Encrypt files*（加密文件），将显示 *Get Pass Phrase*（获取密码短语）对话框。iFolder\
    \ 使用密码短语创建加密密钥，该密钥用于在您的计算机和 iFolder 服务器之间上传或下载文件时进行加密。\n    \n    在数据通过线路传输到 iFolder\
    \ 服务器时对其进行加密，可以防止除您之外的其他人访问您的文件。\n    \n    虽然您的文件在您的计算机上并未以加密文件的形式存储，但它们在 iFolder\
    \ 服务器上是以加密形式存储的。\n    \n    设置密码短语后，每次使用 iFolder 客户端登录时（从任何工作站）都需要使用它。\n    \n\
    \    您还可以选择 *Remember pass phrase*（记住密码短语），以避免每次使用 iFolder 客户端登录时在自己的工作站上输入它。\n\
    17. 输入并重新输入 *pass phrase*（密码短语）；然后输入一个 **hint**（提示）。\n18. （可选）选择 **Remember pass\
    \ phrase**（记住密码短语）。\n19. 通过选择 **OK**（确定）继续。\n    \n    将显示 *Pass Phrase Recovery*（密码短语恢复）对话框。\n\
    \    \n    此对话框中的 *Enable pass phrase recovery*（启用密码短语恢复）选项允许您的 iFolder 管理员恢复您的密码短语（以防您忘记了它）。\n\
    \    \n    上一个对话框中的提示可用于帮助您记住密码短语。\n20. 选择（或取消选择）**Enable pass phrase recovery**（启用密码短语恢复）；然后选择\
    \ **OK**（确定）。\n    \n    您已登录到 iFolder。\n    \n    请注意系统托盘中的 iFolder 客户端图标。\n\
    21. 右键单击图标；然后选择 **Account Information**（帐户信息）。\n    \n    将显示一个对话框，其中包含选项卡，可让您查看和设置如下信息：\n\
    \    - **iFolder.** 工作站上保存 iFolder 文件的文件夹。\n    - **Server Information**（服务器信息）。iFolder\
    \ 服务器上仍可用于存储文件的剩余空间。\n    - **View Activity**（查看活动）。显示 iFolder 帐户同步活动的活动日志。\n\
    \    - **Preferences**（首选项）。允许您设置同步和密码/密码短语参数。\n22. 查看并设置所需的信息，然后选择 **Apply**（应用）；最后关闭窗口。\n\
    23. 通过右键单击 iFolder 图标，然后选择 **Logout**（注销）来注销 iFolder 客户端。\n24. 通过右键单击 iFolder\
    \ 图标，然后选择 **Login**（登录）来登录 iFolder 客户端。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_47_0.png)\n\
    \n## 如何管理 iFolder 用户帐户\n\n作为 iFolder 管理员，您可以执行如下任务：\n\n- 设置全局客户端策略\n- 设置安全密码短语\n\
    - 更改个别用户策略\n- 恢复密码短语\n- 更改用户密码短语\n- 恢复已删除或损坏的文件\n- 删除服务器上的用户数据\n- 使用冲突存储箱\n- iFolder\
    \ 和 NetDrive\n\n### 设置全局客户端策略\n\niFolder 管理员使用全局客户端策略来控制用户可以配置的 iFolder 客户端功能以及默认设置。\n\
    \n要设置全局客户端策略，请执行以下操作：\n\n1. 在 Web 浏览器中显示 iFolder 管理控制台。\n2. 登录到 Global Settings（全局设置）部分；然后选择\
    \ **Global Settings**（全局设置）。\n\n"
