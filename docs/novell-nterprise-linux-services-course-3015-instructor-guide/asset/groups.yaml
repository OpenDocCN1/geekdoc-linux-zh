    \ with a unified, logical list of all network resources, such as users, applications,\
    \ services, system resources, and devices.\n\n- **To provide security.** A Directory\
    \ service is helpful to administrators because it:\n  - Identifies network resources\
    \ precisely and uniquely\n  - Searches for and locates network objects when required\n\
    \  - Supports robust security features\n  - Controls user access to network resources\n\
    \nThis helps network administrators perform their jobs better.\n\n- **To provide\
    \ services to customers.** Hospitals, e-businesses, and various other industries\
    \ are now using Directory services to provide effective services to customers.\n\
    \nThe power of the Directory service helps businesses lay the foundation for e-business\
    \ by:\n\n- Putting their multiple databases in order\n- Simplifying disparate\
    \ networks\n- Allowing better management of processes between customers, employees,\
    \ and supply-chain partners.\n\nA Directory service offers businesses many advantages,\
    \ including:\n\n- Reduced network administration and hardware costs\n- Faster\
    \ access to data and information\n- Secure network access and superior fault tolerance\n\
    \nThe number of Directory-based applications is rapidly increasing. Many provide\
    \ crucial e-business functionality such as automated business-relationship management,\
    \ supply-chain management, and electronic storefronts.\n\nOther services provided\
    \ by Directory-enabled products include automated provisioning, enhanced security,\
    \ customer profiling, electronic wallets, automated notification systems, customized\
    \ web interfaces, and virtual private networks (VPNs).\n\n(VPN software is used\
    \ to transfer sensitive company information across an untrusted network, such\
    \ as the Internet, in a secure fashion by encapsulating and encrypting the data.)\n\
    \n## Key Components of a Basic Directory\n\nWith the global direction of today’s\
    \ economy and business practices, it is logical and necessary that Directories,\
    \ at least in their basic structural form, follow certain global standards.\n\n\
    Novell® eDirectory™, as a leading eBusiness solution, conforms to several key\
    \ and vital defining components of the X.500 standard.\n\nX.500 is an International\
    \ Organization for Standardization (ISO) and International Telecommunication Union\
    \ (ITU) standard that globally defines how Directories ought to be structured\
    \ at the basic level.\n\nNovell eDirectory conforms to several key and vital defining\
    \ components of the X.500 standard.\n\nTo effectively understand and manage eDirectory\
    \ in your network, you need to know the following:\n\n- The History of the X.500\
    \ Directory\n- X.500 Models\n- The Components of the X.500 Directory\n\n## **The\
    \ History of the X.500 Directory**\n\nThe ITU (formerly CCITT), working with the\
    \ ISO, produced the Open Systems Interconnection Reference Model, referred to\
    \ as the OSI model.\n\nUsing the OSI model as a foundation, the ITU has created\
    \ specifications for a series of recommendations that define Directory services.\n\
    \nThe Directory is specified in the X.500 recommendation.\n\nThe X.500 Directory\
    \ standard provides the framework for much of the current development in Directory\
    \ services technology.\n\n> Although most Directories do not follow the standard\
    \ completely or have expanded the specifications, understanding the X.500 Directory\
    \ standard helps you assess and recommend different vendors' Directory implementations.\n\
    \nITU is located in Geneva, Switzerland and is an international organization that\
    \ cooperates with governments and private institutions to coordinate and establish\
    \ global telecommunication networks and services.\n\nITU members represent the\
    \ technical and standards bodies from members of the United Nations. ITU provides\
    \ its recommendations for telecommunications and data communications through its\
    \ Telecommunications Standardization Sector (ITU-TSS).\n\nRecommendations in the\
    \ X.500 series that define Directory services include:\n\n- X.501 Models\n- X.509\
    \ Authentication Framework\n- X.518 Procedures for Distributed Operation\n- X.519\
    \ Protocol Specifications\n"
  mdcn: "\n## **表 A-1** *（续）*\n\n| 挑战 | 目标 | 问题 |\n| :--- | :--- | :--- |\n| 服务质量\
    \ | 确保员工和客户能够访问合适的应用程序。 | • 缺乏通用规则语言，导致系统无法识别特定响应 |\n| 管理 | 为部门服务器和 Web 服务器指定通用供应商。\
    \ | • 平台越多意味着管理和维护成本越高<br>• 可能需要不同的部门服务器和 Web 服务器 |\n| 个性化 | 将客户档案与订单录入应用程序集成，以便记录以前的订单和部件。\
    \ | • 没有数据保留的企业标准<br>• 不同部门对信息的用法不同 |\n\n管理这些挑战可能耗时、繁琐且困难。\n\n## 业务挑战\n\n企业在努力成功且高效地利用技术时，面临着额外的挑战。\n\
    \n### 表 A-2\n\n以下描述这些挑战：\n\n| 业务挑战 | 目录解决方案 |\n| :--- | :--- |\n| **异构系统。** 如今，企业面临异构系统和各种操作系统的挑战。此外，随着公司合并以及组织为适应需求旺盛的市场而变化，异构系统也随之产生。\
    \ | 消除冗余 |\n| **在线订单。** 电子商务正在挑战公司识别其市场以及与消费者互动的传统方法。 | 提供电子商务的结构 |\n| **按需通信。**\
    \ 组织需要以及时且有效的方式访问员工、客户和合作伙伴。 | 提供电子邮件解决方案 |\n| **客户联系。** 企业需要创建并维护客户、库存及其他关键数据的数据库。\
    \ | 存储员工和客户联系列表 |\n| **文件存储。** 必须解决关键数据的存储和备份问题。 | 提供指向公司数据和资源的逻辑指针 |\n| **安全性。**\
    \ 企业必须在内部网络中受到保护，并防范来自互联网的风险。此外，必须提供安全的方法让消费者和企业进行交易。 | 保护资源 |\n| **未来业务问题。**\
    \ 组织面临不断变化的互操作性问题。 | 提供灵活性，确保未来业务解决方案 |\n\n## **通用目录服务的用途**\n\n全方位目录服务通常用于以下方面：\n\
    \n- **组织数据。** 目录服务是数据或信息的有组织列表。例如，eDirectory 存储有关用户、服务器、打印机和其他网络设备的信息。这有助于您更好地完成工作。\n\
    - **更轻松地提供信息访问。** 目录服务将有关网络资源的信息提供给用户、设备或应用程序。人们最熟悉的目录服务之一是电话簿。它提供了一种便捷的方式来存储、组织和搜索您社区中个人和企业的电话号码及地址。您的计算机也在目录（或文件夹）中存储数据。例如，*Windows*\
    \ 文件夹包含与 Windows 操作系统相关的文件。在 *Windows* 文件夹内有一个 *SYSTEM* 文件夹，其中包含与操作系统功能相关的文件，如\
    \ *DLLs*。企业使用目录服务为员工提供对网络资源的全局访问权限。组织还使用目录服务为网络资源提供用户身份验证，并授权他们访问特定的网络资源和服务。目录服务还帮助拥有大量移动用户的组织。在\
    \ *NetWare* 中，一些需要访问用户信息的应用程序使用 *eDirectory* 来存储这些用户信息。这些应用程序被称为 *目录启用*（Directory-enabled）应用程序。\n\
    \n目录服务对用户有用，因为它提供了一个全面的视图，以及所有网络资源（如用户、应用程序、服务、系统资源和设备）的统一逻辑列表。\n\n- **提供安全性。**\
    \ 目录服务对管理员很有帮助，因为它：\n  - 精确且唯一地识别网络资源\n  - 在需要时搜索并定位网络对象\n  - 支持强大的安全功能\n  - 控制用户对网络资源的访问\n\
    \n这有助于网络管理员更好地完成他们的工作。\n\n- **向客户提供服务。** 医院、电子商务以及各种其他行业现在正在使用目录服务向客户提供有效服务。\n\
    \n目录服务的强大功能有助于企业为电子商务奠定基础：\n\n- 将他们的多个数据库有序化\n- 简化异构网络\n- 允许更好地管理客户、员工和供应链合作伙伴之间的流程。\n\
    \n目录服务为企业提供了许多优势，包括：\n\n- 降低网络管理和硬件成本\n- 更快地访问数据和信息\n- 安全的网络访问和卓越的错误恢复能力\n\n基于目录的应用程序数量正在迅速增加。许多提供关键的电子商务功能，如自动化业务关系管理、供应链管理和电子店面。\n\
    \n目录启用产品提供的其他服务包括自动化配置、增强安全性、客户画像、电子钱包、自动化通知系统、定制 Web 界面和虚拟专用网络（VPN）。\n\n（VPN\
    \ 软件用于以安全的方式通过不可信的网络（如互联网）传输敏感的公司信息，方法是对数据进行封装和加密。）\n\n## 基本目录的关键组件\n\n随着当今全球经济和业务实践的发展方向，目录至少在其基本结构形式上遵循某些全球标准是合乎逻辑且必要的。\n\
    \nNovell® eDirectory™ 作为领先的电子商务解决方案，符合 X.500 标准的几个关键且至关重要的定义组件。\n\nX.500 是国际标准化组织（ISO）和国际电信联盟（ITU）的标准，全球性地定义了目录在基本层面应如何构建。\n\
    \nNovell eDirectory 符合 X.500 标准的几个关键且至关重要的定义组件。\n\n为了有效地理解和管理您网络中的 eDirectory，您需要了解以下内容：\n\
    \n- X.500 目录的历史\n- X.500 模型\n- X.500 目录的组件\n\n## **X.500 目录的历史**\n\n国际电信联盟（ITU，前身为\
    \ CCITT）与国际标准化组织（ISO）合作，制定了开放系统互连参考模型，即 OSI 模型。\n\n以 OSI 模型为基础，ITU 制定了一系列建议规范的规格，这些规格定义了目录服务。\n\
    \n目录在 X.500 建议中指定。\n\nX.500 目录标准为目录服务技术的许多当前发展提供了框架。\n\n> 尽管大多数目录并没有完全遵循该标准或已扩展了规格，但理解\
    \ X.500 目录标准有助于您评估和推荐不同供应商的目录实现。\n\nITU 位于瑞士日内瓦，是一个与国际政府合作，并与私营机构协调建立全球电信网络和服务的国际组织。\n\
    \nITU 成员国代表联合国的成员的技术和标准机构。ITU 通过其电信标准化部门（ITU-TSS）提供有关电信和数据通信的建议。\n\n定义目录服务的 X.500\
    \ 系列建议包括：\n\n- X.501 模型\n- X.509 身份验证框架\n- X.518 分布式操作过程\n- X.519 协议规格\n\n"
