    \  - 如果用户的凭据与虚拟办公 eDirectory 树使用的凭据相同，请选择**与虚拟办公目录树同步**。\n    - 选择**确定**。\n\n\
    10. 选择**确定**。\n\n# NetMail 配置\n\n此参数提供虚拟办公 NetMail 选项的配置设置。\n\n请执行以下操作：\n\n1.\
    \ 打开 iManager。\n\n2. 选择**虚拟办公管理 > 服务管理 > 电子邮件**。\n\n将显示以下内容：\n\n**图 9-10**\n\n\
    ![](img/d63035f3fce0eaaf97203dde900affb7_247_0.png)\n\n3. 如果希望电子邮件按钮出现在虚拟办公按钮栏中，请在电子邮件链接标题的右侧选择**启用**。\n\
