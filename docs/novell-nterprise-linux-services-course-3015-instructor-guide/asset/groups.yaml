    In compliance with Linux Standards Base (LSB) requirements, Novell places the
    ldap.conf file in the /etc/opt/novell/openldap directory on the NNLS server.


    If you install the NNLS server into an existing tree, you must specify a trusted
    root certificate during NNLS installation. The ldap.conf file on your NNLS server
    will then have the following certificate-related entries:


    +   - TLS_CACERT /etc/ssl/certname.cert

    +   - TLS_REQCERT demand


    If you are installing a new directory tree, the ldap.conf file will have the following
    entry:


    +   - TLS_REQCERT allow


    For more information on the ldap.conf file, see the ldap.conf man page.


