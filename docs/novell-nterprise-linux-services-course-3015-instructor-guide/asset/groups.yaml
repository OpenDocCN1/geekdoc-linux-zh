  - '[PAGE 106]


    # ## Deafult NetStorage Access


    The NetStorage Web page displays the network files and folders.


    The following illustrates folders accessible by default from the NetStorage web
    page:


    **Figure 6-17**


    ![](img/d63035f3fce0eaaf97203dde900affb7_106_0.png)


    The **shared** folder, shown in Figure 6-17, is a default NetStorage location
    that all users can access for uploading or downloading files. Users do not have
    to be Samba-enabled to access this folder.


    NetStorage is automatically configured to give all eDirectory users access to
    the **shared** folder on your NNLS server. The path to this folder is


    /var/opt/novell/netstorage/shared


    # ## Additional Configured NetStorage Access


    You can create folders that only specific users have access to. You do this by
    creating Storage Location objects that point to folders on Linux and NetWare servers.'
  - '[PAGE 107]


    Users might be granted Linux file system rights and permissions to certain folders
    on the NNLS server but they will not be able to access them using NetStorage unless
    the following conditions are met:


    +   * The user is Samba enabled.

    +   * In the case of folders you specifically create for NetStorage users, the
    folders must be configured as Samba shares in the smb.conf file.

    +   * In the case of user’s home directories, they are already configured as a
    Samba share by default. But if you want to give a user access to a home directory
    through NetStorage, you must create the home directory by logging in as a LUM
    user.

    +   * Storage Location objects have been created and configured to point to the
    Samba share.

    +   * The user is given an assignment to the Storage Location object. This can
    be done on an individual user level, or it can be done through group, container,
    or other similar assignments.


    The following illustrates additional folders that have been configured to be accessible
    from the NetStorage web page:


    Figure 6-18


    ![](img/d63035f3fce0eaaf97203dde900affb7_107_0.png)'
  - '[PAGE 108]


    # Objective 6    Install and Configure NetStorage


    To install and configure NetStorage, you need to know the following:


    +   - Steps for Installing NetStorage

    +   - Creating Storage Location Objects and Lists

    +   - Configuring NetStorage

    +   - Accessing NetStorage Files and Folders


    # *Steps for Installing NetStorage*


    The general steps for installing iFolder are


    +   - Meet NetStorage Dependencies

    +   - Gather Required Information

    +   - Use the NNLS Install Feature


    # Meet NetStorage Dependencies


    NetStorage is installed with Virtual Office. The dependencies for Virtual Office
    include


    +   - Apache 2.0.45 on the same NNLS server

    +   - JVM 1.4.1_02 on the same NNLS server

    +   - Tomcat 4.1.24 on the same NNLS server

    +   - eDirectory 8.7.1 or later anywhere within the network

    +   - iManager 2.0 on the same NNLS server


    The NNLS install program will select the required components, along with their
    dependencies, when you select the Virtual Office component. They will all be installed
    in the same process.'
  - '[PAGE 109]


    See Table 2-5 for information needed to successfully install any Virtual Office
    dependencies that are not already installed.


    For most networks, you need NetStorage installed on only one server; however,
    this might vary depending on size and your organization’s needs.


    For example, if your company is geographically dispersed, you might want to install
    NetStorage on one server in each geographic region.


    # Gather Required Information


    The following table describes the NetStorage information requested during a Virtual
    Office installation:


    Table 6-5

    | Configuration Data Required | Description |

    | --- | --- |

    | NetStorage Authentication Server | The IP address or DNS hostname of the eDirectory
    server to which NetStorage users authenticate using LDAP. |

    | NetStorage Proxy User | The fully distinguished name of a user object with rights
    to do the following:<br>• Search the LDAP (eDirectory) tree specified as the NetStorage
    Authentication Server for NetStorage users<br>• Store the iFolder user pass phrase
    in eDirectory the first time users access the storage location, if an iFolder
    storage location is defined in NetStorage |

    | NetStorage Proxy User Password | The password for the user specified as the
    NetStorage Proxy User. |'
  - "[PAGE 110]\n\n**Table 6-5** (continued)  \n| **Configuration Data Required**\
    \ | **Description** |\n|---|---|\n| NetStorage Users Context | The context on\
    \ the NetStorage Authentication Server to be searched for NetStorage users. |\n\
    |  | (All subcontexts are also searched.) |\n| iFolder Server IP Address or Hostname\
    \ | (Optional) Specifies the IP address or hostname of the iFolder server you\
    \ want created as a storage location in NetStorage. This makes iFolder automatically\
    \ available to Virtual Office users. |\n\n# ### Use the NNLS Install Feature\n\
    \nTo install NetStorage (part of the Virtual Office installation) from NNLS, do\
    \ the following:\n\n+   1.  Perform the steps to do a custom installation.\n+\
    \       \n+       > If necessary, see Section 2 for details on how to perform\
    \ a custom installation.\n+       \n+   2.  Deselect the services you *do not\
    \ want* to install, select the **Virtual Office** service, and then continue.\n\
    +       If eDirectory has not previously been installed, notice that it is selected\
    \ by default when you select Virtual Office (along with other required components\
    \ such as Apache and Tomcat).\n+       \n+       If eDirectory has been previously\
    \ installed, the install program will indicate which components are already installed.\n\
    +       \n+   3.  Accept the license agreement."
  - '[PAGE 111]


    +   4.  **(Conditional)** If prompted for the location of the NICI Foundation
    Key (NFK) file, insert the license diskette and enter the path to the NFK file.

    +       You will only be asked for the NICI Foundation Key if eDirectory has not
    previously been installed.

    +   5.  Enter the information requested at each prompt (see Table 6-5).

    +   6.  View the summary information and make any necessary corrections.

    +   7.  When all the information is correct, finish the installation.

    +   8.  View the readme file and save the installation settings log file.


    # Creating Storage Location Objects and Lists


    After installing NetStorage, you might only be able to see your iFolder directory
    and a local shared directory on the Linux server using NetStorage.


    Storage Location objects are required for accessing files and directories on Linux
    servers and can also be used on NetWare servers.


    Users might have specific eDirectory rights to certain files and folders on your
    network but will not be able to access those files and folders using NetStorage
    unless storage location objects have been created.


    To give users file access, you need to know how to do the following:


    +   -   Create a Storage Location Object

    +   -   Create a Storage Location List'
  - "[PAGE 112]\n\n# # Create a Storage Location Object\n\nTo create a storage location\
    \ object, do the following:\n\n+   1.  Launch a browser and start iManager by\
    \ entering the following:\n+       - https://IP_or_DNS/nps/iManager\n\n+   2.\
    \  Log in by entering your *username* and *password*.\n\n+   3.  At the left under\
    \ **File Access (NetStorage)**, select **Storage Location: Create**.\n\nThe following\
    \ appears:\n\n![](img/d63035f3fce0eaaf97203dde900affb7_112_0.png)\n\n+   4.  Enter\
    \ the following:\n+       - **Object name**: The name of the object in eDirectory.\n\
    +       - **Display name**: The name to be displayed in the NetStorage directory\
    \ access list.\n+   \n+       This is the shortcut name and is seen by users.\
    \ If you use the same display name for 2 different storage objects, a digit is\
    \ added to the names to make each name unique."
  - '[PAGE 113]


    □ **Directory location**: The location of the directory on the file system. The
    location is a URL that includes the file system type, server name, volume, and
    directory path.


    If the storage being accessed is on a NetWare server, the URL must be in the following
    format:

    `ncp://server_name/volume/path_to_directory`


    For example:


    `ncp://server1.digitaalair.com/mkgt/reports`


    *or*


    `ncp://111.222.3.4/mkgt/reports`


    If the storage being accessed is on a Linux server, the URL must be in the following
    format:

    `cifs://server_name/cifs_share_name`


    If the file system is omitted, it is assumed that it is NCP.


    □ **Context**: The directory context that the Storage Location object resides
    in.


    You can select the Object Selector icon to browse to and select the context.


    □ **Comment**: For the administrator only; it is not displayed to users.


    +   5. When you finish, select **Create**; then select **OK**.


    # Create a Storage Location List


    After you create a storage location object, you must create a list of storage
    location objects that can be used with a specified user, group, profile, or container
    object.


    Users see the directory associated with the object the next time they log in.
    After this list is created, you can modify it from the same window by assigning
    additional storage location objects to the list or by deleting storage location
    objects from the list.'
