  md: "\n-   • GroupWise® Configuration\n-   • Lotus® Notes® Configuration\n-   •\
    \ Microsoft® Exchange Configuration\n-   • NetMail Configuration\n-   • IMAP/POP3\
    \ Server Configuration\n-   • Public Web Page\n-   • Change Password\n\n## Company\
    \ Info Service\n\nThe News feature lets you post information in the Virtual Office\
    \ News field on the home page.\n\nDo the following:\n\n1.  Open iManager.\n2.\
    \  Select **Virtual Office Management > Services Administration > Company Info**.\n\
    \nThe following appears:\n\n![](img/d63035f3fce0eaaf97203dde900affb7_236_0.png)\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_236_1.png)\n\n3.  **Mark Enable.**\
    \ If unchecked, the Virtual Office News field does not appear on the home page.\n\
    4.  **Type the *message* you want in the News field.** You can use either plain\
    \ text or HTML.\n5.  **Select OK.**\n\n## NetStorage\n\nThe NetStorage tab lets\
    \ you access Novell NetStorage, which provides simple Internet-based access to\
    \ files on your server. To configure this, complete the following:\n\n1.  **Open\
    \ iManager.**\n2.  **Select *Virtual Office Management* > *Services Administration*\
    \ > *NetStorage*.**\n\nThe following appears:\n\n![](img/d63035f3fce0eaaf97203dde900affb7_237_0.png)\n\
    \n3.  **Mark Enable**.\n\n    If unchecked, the *Files* icon does not appear in\
    \ Virtual Office.\n\n4.  Do one of the following to specify the *URL* to the NetStorage\
    \ main page:\n    -   If NetStorage is on the same server, select **Launch to\
    \ this server’s NetStorage Home Page**.\n    -   If NetStorage is on a remote\
    \ server, specify the *DNS* or *IP address* of the remote server.\n        - \
    \  For example, `https://DNS_ or _IP_Address:443/NetStorage/servlet/NetStorage`\n\
    \    -   Enter a custom *URL* to launch NetStorage.\n\nWith some browsers (including\
    \ Mozilla 1.5, Internet Explorer 6.1 SP1, and Netscape 7.01 and 7.02), the URL\
    \ you enter for your NetStorage Web page in the Virtual Office Services Administration\
    \ plug-in is not saved.\n\nIf the URL you enter is not saved, try a different\
    \ browser. Internet Explorer 6 and Netscape 7.1 are known to work.\n\n## iPrint\n\
    \niPrint is a software solution that lets users print from anywhere to anywhere.\n\
    \nTo configure this, do the following:\n\n1.  Open iManager.\n2.  Select **Virtual\
    \ Office Management > Services Administration > iPrint**.\n\nThe following appears:\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_238_0.png)\n\n# Figure 9-6\n\n3.  Mark\
    \ **Enable**.\n    If unchecked, the iPrint icon does not appear in Virtual Office.\n\
    \n4.  Do one of the following to specify the *URL* to the iPrint Web site:\n \
    \   -   If iPrint is on the same server, click **Launch to this server’s iPrint\
    \ Home Page**.\n    -   If iPrint is on a remote server, specify the *DNS* or\
    \ *IP address* of the remote server.\n        -   For example, `https://DNS_ or\
    \ _IP_Address/iPrint/servlet/iPrint`\n    -   Specify a custom *URL* to launch\
    \ iPrint.\n\n5.  Select **OK**.\n\n## eGuide\n\nNovell eGuide is a Web application\
    \ that provides a browser-based search capability for users regardless of the\
    \ location of your LDAP data source.\n\nTo configure eGuide, do the following:\n\
    \n1.  Open iManager.\n2.  Select **Virtual Office Management > Services Administration\
    \ > eGuide**.\n\nThe following appears:\n\n# Figure 9-7\n\n![](img/d63035f3fce0eaaf97203dde900affb7_240_0.png)\n\
    \n3.  Mark **Enable**.\n\n    If this box is unchecked, the eGuide icon does not\
    \ appear in Virtual Office.\n\n4.  Do one of the following to specify the *URL*\
    \ to the eGuide Web:\n    -   If eGuide is on the same server, click **Launch\
    \ to this server's eGuide Home Page**.\n    -   If eGuide is on a remote server,\
    \ specify the *DNS* or *IP address* of the remote server.\n        -   For example,\
    \ `https://DNS_or_IP_Address/eGuide/servlet/eGuide`\n    -   Specify a custom\
    \ *URL* to launch eGuide.\n\n5.  Select **OK**.\n\nYou can also set an optional\
    \ proxy URL. This allows an Internet proxy/accelerator, like Novell iChain, to\
    \ correctly rewrite the specified proxy URL to the correct DNS name that will\
    \ allow a user's browser to work properly through the proxy server.\n\n## ZENworks\n\
    \nZENworks provides directory-based management of desktops, handheld devices,\
    \ and servers.\n\nTo use ZENworks with **Virtual Office**, you must install and\
    \ configure Novell ZENworks 6 Desktop Management and Web Self-Service components.\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_241_0.png)\n\nSee http://www.novell.com/documentation/ig/zenworks6/index.html\
    \ for more information.\n\nTo configure ZENworks access through **Virtual Office**,\
    \ do the following:\n\n1.  Open **iManager**.\n2.  Select **Virtual Office Management**\
    \ > **Services Administration** > **ZENworks**.\n\n    The following appears:\n\
    \n    **Figure 9-8**\n\n    ![](img/d63035f3fce0eaaf97203dde900affb7_241_1.png)\n\
    \n3.  Mark **Enable**.\n\n4.  Specify the *URL* for the ZENworks Web page.\n5.\
    \  Select **OK**.\n\n## Bookmarks\n\nThe Bookmarks tab page provides configuration\
    \ options for the Virtual Office Bookmarks service.\n\nTo configure this, do the\
    \ following:\n\n1.  Open iManager.\n2.  Select **Virtual Office Management > Services\
    \ Administration > Bookmarks**.\n\n    The following appears:\n\n    ![](img/d63035f3fce0eaaf97203dde900affb7_242_0.png)\n\
    \n3.  If you want the **Bookmarks** button to appear in the Virtual Office button\
    \ bar, to the right of the **Bookmarks Link** title select **Enable**.\n\n4. \
    \ If you want bookmarks to appear on user home pages, to the right of the Home\
    \ Page Bookmarks title select **Enable** and do 1 or more of the following:\n\
    \    -   Add a bookmark by selecting **Add**; then enter a bookmark *name* and\
    \ *URL* and select **OK**.\n    -   Edit an existing bookmark by selecting the\
    \ *bookmark* and selecting **Edit**; then change the *name* or *URL* of that bookmark\
    \ and select **OK**.\n    -   Delete an existing bookmark by selecting the *bookmark*;\
    \ then select **Delete**.\n\n5.  Select **OK**.\n\n## GroupWise® Configuration\n\
    \nThis parameter provides configuration settings for the Virtual Office GroupWise\
    \ option.\n\nTo configure this, do the following:\n\n1.  Open iManager.\n2.  Select\
    \ **Virtual Office Management > Services Administration** > eMail.\n3.  If you\
    \ want the e-Mail button to appear in the Virtual Office button bar, to the right\
    \ of the eMail Link title select **Enable**.\n4.  From the Email Server menu,\
    \ select **Novell GroupWise**.\n5.  Select **Edit**.\n6.  Enter the GroupWise\
    \ WebAccess *URL*.\n7.  If the user's credentials are the same as those used by\
    \ the Virtual Office eDirectory tree, select **Synchronized with Virtual Office\
    \ Tree**.\n8.  Select **OK**.\n\n9.  You can also configure the Home Page Reduced\
    \ eMail View. When the reduced email view is enabled, the user's most recent email\
    \ will be listed on the user's Virtual Office Home Page.\n    Do the following:\n\
    \    -   a. Configure your GroupWise server to support POP3 or IMAP.\n    -  \
    \ b. To the right of the Home Page Reduced eMail View title select **Enable**.\n\
    \    -   c. Select *Edit*.\n    -   d. Select **POP3** or **IMAP**.\n    -   e.\
    \ Enter your Incoming Mail Server *DNS name* or *IP address*.\n    -   f. Enter\
    \ your SMTP Server *DNS name* or *IP address*.\n    -   g. If the user's credentials\
    \ are the same as those used by the Virtual Office eDirectory tree, select **Synchronized\
    \ with Virtual Office Tree**.\n    -   h. Select **OK**; then select **OK**.\n\
    \n## Lotus® Notes® Configuration\n\nThis parameter provides configuration settings\
    \ for the Virtual Office Lotus Notes option.\n\nTo configure this, do the following:\n\
    \n1.  Open iManager.\n2.  Select **Virtual Office Management > Services Administration\
    \ > eMail**.\n3.  If you want the e-Mail button to appear in the Virtual Office\
    \ button bar, to the right of the eMail Link title select **Enable**.\n4.  From\
    \ the E-mail Server menu, select **Lotus Notes**.\n5.  Select *Edit*.\n6.  Specify\
    \ the Lotus Notes *URL*.\n7.  Specify the Lotus Notes *proxy address*.\n\n8. \
    \ Select **OK**.\n\n9.  You can also configure the Home Page Reduced eMail View.\
    \ When the reduced email view is enabled, the user's most recent email will be\
    \ listed on the user's Virtual Office Home Page. Do the following:\n    -   a.\
    \ Configure your Notes server to support POP3 or IMAP.\n    -   b. To the right\
    \ of the Home Page Reduced eMail View title select **Enable**.\n    -   c. Select\
    \ *Edit*.\n    -   d. Select **POP3** or **IMAP**.\n    -   e. Enter your Incoming\
    \ Mail Server *DNS name* or *IP address*.\n    -   f. Enter your SMTP Server *DNS\
    \ name* or *IP address*.\n    -   g. If the user's credentials are the same as\
    \ those used by the Virtual Office eDirectory tree, select **Synchronized with\
    \ Virtual Office Tree**.\n    -   h. Select **OK**.\n\n10. Select **OK**.\n\n\
    ## Microsoft® Exchange Configuration\n\nThis parameter provides configuration\
    \ settings for the Virtual Office Exchange option. To configure this, complete\
    \ the following:\n\n1.  Open iManager.\n2.  Select **Virtual Office Management\
    \ > Services Administration > eMail**.\n3.  If you want the e-Mail button to appear\
    \ in the Virtual Office button bar, to the right of the eMail Link title select\
    \ **Enable**.\n4.  From the E-mail Server menu, select **Microsoft Exchange**.\n\
    5.  Select *Edit*.\n6.  Specify the Microsoft Exchange *URL*.\n"
  mdcn: "\n\n-   • **GroupWise® 配置**\n-   • **Lotus® Notes® 配置**\n-   • **Microsoft®\
    \ Exchange 配置**\n-   • **NetMail 配置**\n-   • **IMAP/POP3 服务器配置**\n-   • **公共网页**\n\
    -   • **更改密码**\n\n## 公司信息服务\n\n新闻功能允许您在主页的虚拟办公室新闻字段中发布信息。\n\n请执行以下操作：\n\n1.  打开\
    \ iManager。\n2.  选择 **虚拟办公室管理 > 服务管理 > 公司信息**。\n\n将显示以下内容：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_236_0.png)\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_236_1.png)\n\n3.  **勾选 启用。** 如果未勾选，虚拟办公室新闻字段将不会出现在主页上。\n\
    4.  **在新闻字段中输入您要发布的 *消息*。** 您可以使用纯文本或 HTML。\n5.  **选择 确定。**\n\n## NetStorage\n\
    \nNetStorage 选项卡允许您访问 Novell NetStorage，它提供基于 Internet 的简单文件访问功能，用于访问服务器上的文件。要配置此功能，请完成以下操作：\n\
    \n1.  **打开 iManager。**\n2.  **选择 *虚拟办公室管理* > *服务管理* > *NetStorage*。**\n\n将显示以下内容：\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_237_0.png)\n\n3.  **勾选 启用**。\n\n  \
    \  如果未勾选，*文件* 图标将不会出现在虚拟办公室中。\n\n4.  执行以下其中一项操作以指定指向 NetStorage 主页的 *URL*：\n \
    \   -   如果 NetStorage 位于同一服务器上，请选择 **启动到此服务器的 NetStorage 主页**。\n    -   如果 NetStorage\
    \ 位于远程服务器上，请指定远程服务器的 *DNS* 或 *IP 地址*。\n        -   例如，`https://DNS_或_IP地址:443/NetStorage/servlet/NetStorage`\n\
    \    -   输入自定义 *URL* 以启动 NetStorage。\n\n在某些浏览器（包括 Mozilla 1.5、Internet Explorer\
    \ 6.1 SP1 以及 Netscape 7.01 和 7.02）中，您在虚拟办公室服务管理插件中为 NetStorage 网页输入的 URL 不会被保存。\n\
    \n如果输入的 URL 未被保存，请尝试使用其他浏览器。已知 Internet Explorer 6 和 Netscape 7.1 可以正常工作。\n\n\
    ## iPrint\n\niPrint 是一种软件解决方案，允许用户从任何地方向任何地方打印。\n\n要配置此功能，请执行以下操作：\n\n1.  打开 iManager。\n\
    2.  选择 **虚拟办公室管理 > 服务管理 > iPrint**。\n\n将显示以下内容：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_238_0.png)\n\
    \n# 图 9-6\n\n3.  勾选 **启用**。\n    如果未勾选，iPrint 图标将不会出现在虚拟办公室中。\n\n4.  执行以下其中一项操作以指定指向\
    \ iPrint 网站页的 *URL*：\n    -   如果 iPrint 位于同一服务器上，请单击 **启动到此服务器的 iPrint 主页**。\n\
    \    -   如果 iPrint 位于远程服务器上，请指定远程服务器的 *DNS* 或 *IP 地址*。\n        -   例如，`https://DNS_或_IP地址/iPrint/servlet/iPrint`\n\
    \    -   指定自定义 *URL* 以启动 iPrint。\n\n5.  选择 **确定**。\n\n## eGuide\n\nNovell eGuide\
    \ 是一个 Web 应用程序，无论 LDAP 数据源位于何处，都为用户提供基于浏览器的搜索功能。\n\n要配置 eGuide，请执行以下操作：\n\n1.\
    \  打开 iManager。\n2.  选择 **虚拟办公室管理 > 服务管理 > eGuide**。\n\n将显示以下内容：\n\n# 图 9-7\n\n\
    ![](img/d63035f3fce0eaaf97203dde900affb7_240_0.png)\n\n3.  勾选 **启用**。\n\n    如果未勾选此框，eGuide\
    \ 图标将不会出现在虚拟办公室中。\n\n4.  执行以下其中一项操作以指定指向 eGuide 网页的 *URL*：\n    -   如果 eGuide\
    \ 位于同一服务器上，请单击 **启动到此服务器的 eGuide 主页**。\n    -   如果 eGuide 位于远程服务器上，请指定远程服务器的 *DNS*\
    \ 或 *IP 地址*。\n        -   例如，`https://DNS_或_IP地址/eGuide/servlet/eGuide`\n    -\
    \   指定自定义 *URL* 以启动 eGuide。\n\n5.  选择 **确定**。\n\n您还可以设置可选的代理 URL。这允许 Internet\
    \ 代理/加速器（如 Novell iChain）将指定的代理 URL 正确重写为正确的 DNS 名称，从而允许用户的浏览器通过代理服务器正常工作。\n\n\
    ## ZENworks\n\nZENworks 提供基于目录的桌面、手持设备和服务器管理功能。\n\n要将 ZENworks 与 **虚拟办公室** 配合使用，必须安装并配置\
    \ Novell ZENworks 6 桌面管理和 Web 自助服务组件。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_241_0.png)\n\
    \n更多信息，请参阅 http://www.novell.com/documentation/ig/zenworks6/index.html 。\n\n要通过\
    \ **虚拟办公室** 配置 ZENworks 访问权限，请执行以下操作：\n\n1.  打开 **iManager**。\n2.  选择 **虚拟办公室管理**\
    \ > **服务管理** > **ZENworks**。\n\n    将显示以下内容：\n\n    **图 9-8**\n\n    ![](img/d63035f3fce0eaaf97203dde900affb7_241_1.png)\n\
    \n3.  勾选 **启用**。\n\n4.  指定 ZENworks 网页的 *URL*。\n5.  选择 **确定**。\n\n## 书签\n\n书签选项卡页面提供虚拟办公室书签服务的配置选项。\n\
    \n要配置此功能，请执行以下操作：\n\n1.  打开 iManager。\n2.  选择 **虚拟办公室管理 > 服务管理 > 书签**。\n\n   \
    \ 将显示以下内容：\n\n    ![](img/d63035f3fce0eaaf97203dde900affb7_242_0.png)\n\n3.  如果您希望\
    \ **书签** 按钮出现在虚拟办公室按钮栏中，请在 **书签链接** 标题右侧选择 **启用**。\n\n4.  如果希望书签显示在用户主页上，请在 主页书签\
    \ 标题右侧选择 **启用**，并执行以下一项或多项操作：\n    -   通过选择 **添加** 来添加书签；然后输入书签 *名称* 和 *URL*，并选择\
    \ **确定**。\n    -   通过选择 *书签* 并选择 **编辑** 来编辑现有书签；然后更改该书签的 *名称* 或 *URL*，并选择 **确定**。\n\
    \    -   通过选择 *书签* 然后选择 **删除** 来删除现有书签。\n\n5.  选择 **确定**。\n\n## GroupWise® 配置\n\
    \n此参数提供虚拟办公室 GroupWise 选项的配置设置。\n\n要配置此功能，请执行以下操作：\n\n1.  打开 iManager。\n2.  选择\
    \ **虚拟办公室管理 > 服务管理** > eMail。\n3.  如果您希望 e-邮件按钮出现在虚拟办公室按钮栏中，请在 eMail 链接标题右侧选择\
    \ **启用**。\n4.  从 邮件服务器 菜单中，选择 **Novell GroupWise**。\n5.  选择 **编辑**。\n6.  输入 GroupWise\
    \ WebAccess *URL*。\n7.  如果用户凭据与虚拟办公室 eDirectory 树使用的凭据相同，请选择 **与虚拟办公室树同步**。\n\
    8.  选择 **确定**。\n\n9.  您还可以配置主页精简电子邮件视图。当启用精简电子邮件视图时，用户的最新电子邮件将列在用户的虚拟办公室主页上。\n\
    \    请执行以下操作：\n    -   a. 配置您的 GroupWise 服务器以支持 POP3 或 IMAP。\n    -   b. 在 主页精简电子邮件视图\
    \ 标题右侧选择 **启用**。\n    -   c. 选择 *编辑*。\n    -   d. 选择 **POP3** 或 **IMAP**。\n  \
    \  -   e. 输入您的入站邮件服务器 *DNS 名称* 或 *IP 地址*。\n    -   f. 输入您的 SMTP 服务器 *DNS 名称* 或\
    \ *IP 地址*。\n    -   g. 如果用户凭据与虚拟办公室 eDirectory 树使用的凭据相同，请选择 **与虚拟办公室树同步**。\n \
    \   -   h. 选择 **确定**；然后选择 **确定**。\n\n## Lotus® Notes® 配置\n\n此参数提供虚拟办公室 Lotus Notes\
    \ 选项的配置设置。\n\n要配置此功能，请执行以下操作：\n\n1.  打开 iManager。\n2.  选择 **虚拟办公室管理 > 服务管理 > eMail**。\n\
    3.  如果您希望 e-邮件按钮出现在虚拟办公室按钮栏中，请在 eMail 链接标题右侧选择 **启用**。\n4.  从 电子邮件服务器 菜单中，选择 **Lotus\
    \ Notes**。\n5.  选择 *编辑*。\n6.  指定 Lotus Notes *URL*。\n7.  指定 Lotus Notes *代理地址*。\n\
    \n8.  选择 **确定**。\n\n9.  您还可以配置主页精简电子邮件视图。当启用精简电子邮件视图时，用户的最新电子邮件将列在用户的虚拟办公室主页上。请执行以下操作：\n\
    \    -   a. 配置您的 Notes 服务器以支持 POP3 或 IMAP。\n    -   b. 在 主页精简电子邮件视图 标题右侧选择 **启用**。\n\
    \    -   c. 选择 *编辑*。\n    -   d. 选择 **POP3** 或 **IMAP**。\n    -   e. 输入您的入站邮件服务器\
    \ *DNS 名称* 或 *IP 地址*。\n    -   f. 输入您的 SMTP 服务器 *DNS 名称* 或 *IP 地址*。\n    -   g.\
