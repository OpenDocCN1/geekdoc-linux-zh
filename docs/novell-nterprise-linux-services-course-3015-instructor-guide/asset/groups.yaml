    \ 章\n## 使用 NNLS 提供个人文件管理服务\n\n在本章中，您将学习如何使用 iFolder®、NetStorage 和 Samba 来实现 Novell™\
    \ Nterprise™ Linux® Services (NNLS) 的个人文件管理服务。\n\n### 目标\n\n- 1. 描述 iFolder 的用途和架构\n\
