  - '[PAGE 297]


    # **Common Directory Service Uses**


    A full-service Directory is typically used in the following ways:


    +   *   **To organize data.** A Directory service is an organized listing of data
    or information.

    +       For example, eDirectory stores information about users, servers, printers,
    and other network devices. This helps you perform your job better.


    +   *   **To more easily provide access to information.** A Directory service
    makes information about network resources available to users, devices, or applications.

    +       A Directory service most people are familiar with is the telephone book.
    This provides an easy way to store, organize, and search for telephone numbers
    and addresses of people and businesses in your community.

    +       Your computer also stores data in directories (or folders). The *Windows*
    folder, for example, contains files related to the Windows operating system.

    +       Within the *Windows* folder is a *SYSTEM* folder that contains files,
    such as *DLLs*, related to the functions of the operating system.

    +       Businesses use Directory services to provide employees with global access
    to network resources.

    +       Organizations also use Directory services to provide user authentication
    to network resources, and authorize them to access specific network resources
    and services.

    +       Directory services also help organizations with large numbers of mobile
    users. In *NetWare*, some applications that need access to user information use
    *eDirectory* to store this user information. These applications are called *Directory-enabled*.'
  - "[PAGE 298]\n\nA Directory service is useful to users because it provides a comprehensive\
    \ view with a unified, logical list of all network resources, such as users, applications,\
    \ services, system resources, and devices.\n\n+   - **To provide security.** A\
    \ Directory service is helpful to administrators because it\n+   \n+   - Identifies\
    \ network resources precisely and uniquely\n+   \n+   - Searches for and locates\
    \ network objects when required\n+   \n+   - Supports robust security features\n\
    +   \n+   - Controls user access to network resources\n+   \n+   This helps network\
    \ administrators perform their jobs better.\n\n+   - **To provide services to\
    \ customers.** Hospitals, e-businesses, and various other industries are now using\
    \ Directory services to provide effective services to customers.\n+   \n+   The\
    \ power of the Directory service helps businesses lay the foundation for e-business\
    \ by\n+   \n+   - Putting their multiple databases in order\n+   \n+   - Simplifying\
    \ disparate networks\n+   \n+   - Allowing better management of processes between\
    \ customers, employees, and supply-chain partners.\n+   \n+   A Directory service\
    \ offers businesses many advantages, including\n+   \n+   - Reduced network administration\
    \ and hardware costs\n+   \n+   - Faster access to data and information\n+   \n\
    +   - Secure network access and superior fault tolerance\n+   \n+   The number\
    \ of Directory-based applications is rapidly increasing. Many provide crucial\
    \ e-business functionality such as automated business-relationship management,\
    \ supply-chain management, and electronic storefronts."
  - '[PAGE 299]


    Other services provided by Directory-enabled products include automated provisioning,
    enhanced security, customer profiling, electronic wallets, automated notification
    systems, customized web interfaces, and virtual private networks (VPNs).


    (VPN software is used to transfer sensitive company information across an untrusted
    network, such as the Internet, in a secure fashion by encapsulating and encrypting
    the data.)


    # Key Components of a Basic Directory


    With the global direction of today’s economy and business practices, it is logical
    and necessary that Directories, at least in their basic structural form, follow
    certain global standards.


    Novell® eDirectory™, as a leading eBusiness solution, conforms to several key
    and vital defining components of the X.500 standard.


    X.500 is an International Organization for Standardization (ISO) and International
    Telecommunication Union (ITU) standard that globally defines how Directories ought
    to be structured at the basic level.


    Novell eDirectory conforms to several key and vital defining components of the
    X.500 standard.


    To effectively understand and manage eDirectory in your network, you need to know
    the following:


    +   - The History of the X.500 Directory

    +   - X.500 Models

    +   - The Components of the X.500 Directory'
  - '[PAGE 300]


    # **The History of the X.500 Directory**


    The ITU (formerly CCITT), working with the ISO, produced the Open Systems Interconnection
    Reference Model, referred to as the OSI model.


    Using the OSI model as a foundation, the ITU has created specifications for a
    series of recommendations that define Directory services.


    The Directory is specified in the X.500 recommendation.


    The X.500 Directory standard provides the framework for much of the current development
    in Directory services technology.


    > Although most Directories do not follow the standard completely or have expanded
    the specifications, understanding the X.500 Directory standard helps you assess
    and recommend different vendors'' Directory implementations.


    ITU is located in Geneva, Switzerland and is an international organization that
    cooperates with governments and private institutions to coordinate and establish
    global telecommunication networks and services.


    ITU members represent the technical and standards bodies from members of the United
    Nations. ITU provides its recommendations for telecommunications and data communications
    through its Telecommunications Standardization Sector (ITU-TSS).


    Recommendations in the X.500 series that define Directory services include


    +   - X.501 Models

    +   - X.509 Authentication Framework

    +   - X.518 Procedures for Distributed Operation

    +   - X.519 Protocol Specifications'
