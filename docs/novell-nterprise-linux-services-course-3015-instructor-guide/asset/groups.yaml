- raw:
  - '[PAGE 49]


    # The following appears:


    ![](img/d63035f3fce0eaaf97203dde900affb7_49_0.png)


    There are three levels you can set for the Global Client Policies:


    +   *   **Default Settings**. Set the default settings for the configurable features
    in the iFolder client.

    +       Select the check box or fill in a value to enable that option by default
    in the iFolder client. The user can view the settings and can change them.

    +   *   **Enforced**. Select the check box to enforce the default setting you
    specified for a configurable feature in the iFolder client.

    +       If enforced, the user can view the settings, but cannot change them. The
    features and settings are grayed out in the iFolder client interface.

    +   *   **Hidden**. Select the check box to hide the configurable feature and
    its default setting in the iFolder client.'
  - '[PAGE 50]


    The user will not see the option or the setting in the iFolder client. Hidden
    features are enforced by default.


    You can set the following policies:


    +   *   **Encryption (+)**. This allows the user''s local data to be encrypted
    as it leaves a workstation to travel to the iFolder server, resides on the server,
    and travels to another workstation, where it is unencrypted; the user''s data
    resides on the user''s workstations in unencrypted form.

    +   *   **Save Password**. This allows automatic entry of the user''s password
    during any iFolder login sequence.

    +       The iFolder client does not pass on system warnings about grace logins.

    +       If your organization requires frequent password changes, we recommend
    that users be notified of pending change requirements by alternate means so users
    can proactively change the stored password, if they select this option.

    +   *   **Save Pass Phrase**. This allows automatic entry of the user''s encryption
    pass phrase during any iFolder login sequence.

    +   *   **Recover Pass Phrase (+)**. This allows the iFolder administrator to
    recover the user''s encryption pass phrase.

    +       Because the Pass Phrase is the user''s encryption key, the administrator
    is able to decrypt the user''s data files on the iFolder server.

    +       Allowing this option implies a trusted relationship for the iFolder administrator.

    +   *   **Automatic Sync (+)**. This allows the iFolder client to automatically
    synchronize the user''s iFolder files between the local iFolder directory and
    the iFolder server.


    The following settings are available:'
  - '[PAGE 51]


    +   * **Sync to Server Delay (+).** If Automatic Sync is allowed, sets the default
    time (in seconds) that the iFolder client waits after a file in the local iFolder
    directory changes until it automatically uploads the file to the iFolder server.
    Also sets the minimum and maximum values allowed.


    +   * **Sync from Server Interval (+).** If Automatic Sync is allowed, sets the
    default time (in seconds) after a synchronization occurs that the iFolder client
    waits to check with the iFolder server to determine if there are changed files
    it needs to automatically download to the local iFolder directory. Also sets the
    minimum and maximum values allowed.


    +   * **Conflict Bin Space.** Sets the default size (in MB) of the Conflict Bin
    for the user''s iFolder account. Also sets the minimum and maximum allowed values.


    +   * **iFolder Location (+).** Sets the default path of the user''s local iFolder
    directory.


    Some options, distinguished above by a plus (+), apply only to new iFolder user
    accounts. They appear in the first instance of an iFolder client install for that
    user.


    After the user sets these preferences, the items no longer appear in the login
    sequence or in subsequent installs of the iFolder client by that user.


    Changing the marked option has no effect for existing users; it affects only subsequently
    created accounts. If you want to change marked features for all users after accounts
    exist, you must coordinate with users to delete their accounts and recreate them
    with the new settings enforced.


    +   3. When you finish, select **Update Client Policy**.


    Whenever you update the Global Client Policy settings, all of the settings apply
    only to new iFolder user accounts.'
  - "[PAGE 52]\n\nFor current iFolder accounts, the settings apply only as they would\
    \ for subsequent new installs of the iFolder client. The updated policies and\
    \ settings do not replace the current iFolder users' settings during iFolder client\
    \ upgrades.\n\n> To force the updated settings to apply for existing users, the\
    \ users must uninstall the iFolder client, and then reinstall it.\n> \n> However,\
    \ the account-based settings will not change unless you delete the current user\
    \ account and create a new account for that user.\n\n# Set Security Pass Phrase\n\
    \nThe iFolder administrator can update the iFolder Admin user's security pass\
    \ phrase from the Global Client Policies screen. The security pass phrase is used\
    \ to recover an iFolder user's pass phrase, if necessary.\n\nDo the following:\n\
    \n+   1. In the iFolder Management console, select **Global Settings**.\n+   2.\
    \ (If prompted) Log in with your Admin username and password.\n+   3. Select **Global\
    \ Policies > Display Client Policies > Update Security Pass Phrase**.\n+   4.\
    \ Enter a *security pass phrase* and retype it; then select **Update**.\n\n# Change\
    \ Individual User Policies\n\nBy default, global client policies apply to all\
    \ iFolder user accounts. However, the iFolder administrator can modify the policy\
    \ settings for a specific user by doing the following:\n\n+   1. In the iFolder\
    \ Management console, select **User Management**.\n+   2. Select *User_ID* to\
    \ **Edit**."
  - "[PAGE 53]\n\nThe following appears:\n\n![](img/d63035f3fce0eaaf97203dde900affb7_53_0.png)\n\
    \nThis page allows access to the user’s account information.\n\n+   3. Set the\
    \ user-specific policy settings.\n+   \tUser-specific policy settings take precedence\
    \ over the global policy settings.\n\n+   4. When you finish, select **Update**.\n\
    \n# Recover Pass Phrases\n\nTo recover a user’s pass phrase, either the policy\
    \ must have been set to Enforced or the user must have enabled pass phrase recovery\
    \ the first time he logged in with the iFolder client."
  - '[PAGE 54]


    To recover a user’s pass phrase, do the following:


    +   1. In the iFolder Management console, select **User Management**.

    +   2. Search for the appropriate user; then select *username*.

    +   3. Scroll down to the bottom of the list; then select **Recover**.

    +   4. Enter your security pass phrase; then select **OK**.

    +   5. When the pass phrase appears, let the user know what it is.


    # ## Change a User Pass Phrase


    When users install the iFolder client the first time, they are asked to authenticate
    to the iFolder server. They are then asked if they would like to encrypt their
    data.


    If they choose to encrypt their data, iFolder then prompts for a pass phrase.
    This pass phrase becomes a part of the key that is used to encrypt the data when
    it is transmitted to the iFolder server.


    If a user wants to change a pass phrase because he or she has forgotten the pass
    phrase, you can recover the pass phrase using the iFolder Management console.


    However, if the user wants to change to a new pass phrase (for security reasons)
    and the user does not have the data locally, make sure the user understands that
    the only way to change the pass phrase is to delete the data from the iFolder
    server and have the iFolder client encrypt the data and send it up to the server
    again.


    > If the user does not have the data stored locally, have the user synchronize
    the data to the local hard drive; then proceed with the process to change the
    pass phrase.'
  - '[PAGE 55]


    Do the following:


    +   In the iFolder Management console, find and select the user account to display
    the user’s information.


    +   Look at the Number of Connections line. If this line does not show “0,” you
    must have the user log out of his or her iFolder client.


    +   Look at the Disk Quota setting and the Used Space value. If either of these
    values is above 100 MB, you will need to adjust the Disk Quota value later (step
    8).


    +   Confirm that the user has a sufficiently fast connection to facilitate the
    upload of the data after you remove the account. You probably don’t want to do
    this over a dial-up connection.


    +   Confirm that the user has his data on his local disk. This is very important
    because you are about to delete the data from the server.


    +   Select the Remove User button; then confirm deletion by selecting Yes. The
    user account has now been removed from the server. All of the user’s data has
    also been deleted from the server.


    +   Have the user right-click on the iFolder client icon (in the system tray)
    and select Login. The user will be prompted to choose encryption again and asked
    for a new pass phrase. After the user has chosen a new pass phrase, the iFolder
    client logs the user in and creates a new account with the default Disk Quota
    space.


    +   Go to the user’s account and adjust the Disk Quota with the value from step
    3. The user’s data should begin to sync back up to the server.'
