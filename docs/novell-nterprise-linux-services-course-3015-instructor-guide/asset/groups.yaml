    *This document should only be used by a Novell-certified instructor.*\n*Copying\
    \ this document is strictly prohibited. To report suspected copying, please call\
    \ 1-800-PIRATES.*\n\nVersion 1\n\n- 22. Select the **Preferences** tab.\n  Synchronization\
    \ is set to occur automatically every 5 seconds for changes to your local files,\
    \ and every 20 seconds for files that should be synchronized to your workstation.\n\
    - 23. Deselect **Automatic sync**; then select **Apply**.\n- 24. With the iFolder\
    \ dialog still open, copy several files to the home directory of the user you\
    \ logged in as (see the Account Information tab for the location).\n  You might\
    \ want to copy the pictures from the My Pictures folder.\n- 25. Return to the\
    \ iFolder dialog and select the **View Activity** tab; then select the **Sync**\
    \ button (top of the tab page).\n- 26. Watch the messages as iFolder synchronizes\
    \ the files to the iFolder server.\n  After a few moments, a Synchronization Complete\
    \ message appears.\n  The files are now encrypted and stored on the iFolder server.\n\
    - 27. Turn **Automatic sync** back on; then select **Apply**.\n\n## Part III:\
    \ Configure iFolder to Log Debug Information\n\nNow that users are logging in\
    \ and out of iFolder and synchronizing files, you should configure iFolder to\
    \ write debug information to a log file.\n\nDo the following:\n\n- 1. Open a terminal\
    \ window and change to root by entering `su` - with a password of **novell**.\n\
    - 2. Enter `cd /var/opt/novell/ifolder/DocumentRoot`.\n- 3. Enter `mkdir logs`.\n\
    \nIf the index.html is not created, have students create it and redo the chmod\
    \ command on the index.html file; then restart the iFolder service.\n\n- 4. Enter\
    \ `ls -al` and verify that the logs folder is there.\n- 5. Edit the `httpd_ifolder_unix.conf`\
    \ file to start logging iFolder information:\n  - a. Select **Applications > KDE\
    \ Menu > System > File Manager - Super User Mode**.\n  - b. Enter a password of\
    \ **novell**; then select **OK**.\n  - c. Browse to `/etc/opt/novell/ifolder`.\n\
    \  - d. Right-click the `httpd_ifolder_unix.conf` file; then select **Open With\
    \ > KWrite**.\n  - e. Add the following to the end of the file:\n    ```\n   \
    \ iFolderServerLogging “/var/opt/novell/ifolder/DocumentRoot/logs/index.html”\n\
    \    ```\n  - f. Save the `httpd_ifolder_unix.conf` file.\n- 6. Give Apache permissions\
    \ to create and write to the log file by entering the following at the shell prompt:\n\
    \  ```\n  chmod 757 /var/opt/novell/ifolder/DocumentRoot/logs\n  ```\n- 7. Restart\
    \ the iFolder service by entering the following at the shell prompt:\n  ```\n\
    \  /etc/init.d/novell-httpd stop\n  /etc/init.d/novell-httpd start\n  ```\n- 8.\
    \ Enter `cd /var/opt/novell/ifolder/DocumentRoot/logs`.\n- 9. Verify that the\
    \ index.html file was created by entering `ls -al`.\n- 10. Enter `tail index.html`.\n\
    \  Note the iFolder Server Logging information that was captured.\n- 11. Leave\
    \ this *terminal session* open.\n\n## Part IV: Change and Test the iFolder Configuration\n\
    \nNow that you have installed the iFolder client, activated an iFolder user, and\
    \ synchronized files, you can use the iFolder Management console to monitor and\
    \ configure iFolder.\n\nDo the following:\n\n- 1. From your NNLS server Mozilla\
    \ browser, access the iFolder Management console by entering the following:\n\
    \  **https://DAx.your*container*.digitalairlines.com**\n  **/iFolderServer/Admin**\n\
    \  A Novell iFolder welcome page appears.\n- 2. Select **Reporting**.\n- 3. Log\
    \ in as **admin** with a password of **novell**.\n  At the right under General\
    \ Information, notice the total number of users.\n- 4. At the left under **Reporting**,\
    \ select **User Accounts**; then at the right select **Display**.\n  Notice the\
    \ data displayed for your activated iFolder user.\n- 5. At the top of the page,\
    \ select the **User Management** icon.\n- 6. Enter the **User ID** for the iFolder\
    \ user; then select **Search**.\n- 7. Display the properties for the user by selecting\
    \ the **User ID**.\n  A properties page appears.\n  Review the information displayed\
    \ such as the disk quota, last sync, and used space.\n- 8. Change the disk quota\
    \ to **250 MB**; then select **Update**.\n- 9. Scroll down to the bottom of the\
    \ page and edit the client policies for the user by selecting **Edit**.\n  A policies\
    \ page for the user appears with configurations for several of the settings available\
    \ from the iFolder client.\n"
