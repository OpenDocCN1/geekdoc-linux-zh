    \ you need to know the following:<br>- Steps for Installing NetStorage<br>- Creating\
    \ Storage Location Objects and Lists<br>- Configuring NetStorage<br>- Accessing\
    \ NetStorage Files and Folders |\n\n## SECTION 7\n\n## Manage Printers with NNLS\n\
    \nIn this section, you learn how to set up and configure iPrint on a Linux® server\
    \ and how to print from a Windows® workstation.\n\n### Objectives\n\n- 1. Identify\
    \ the Benefits of iPrint\n- 2. Describe How iPrint Works\n- 3. Install and Configure\
    \ iPrint\n- 4. Print with iPrint\n\n### Introduction\n\nNovell iPrint is a printing\
    \ solution based on the industry standard Internet Printing Protocol (IPP), which\
    \ eliminates the complexities of printing over the Internet.\n\niPrint lets employees,\
    \ mobile employees, business partners, and customers access printers from a variety\
    \ of remote locations using existing Internet connections.\n\nWhether users are\
    \ working in an office building, telecommuting from home, or attending a sales\
    \ meeting in another country, iPrint ensures that they can print documents quickly,\
    \ easily, and reliably.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_132_0.png)\n\
    \n> For additional details on installing and configuring iPrint, see the *Novell\
    \ iPrint Administration Guide* for Novell® Netrprise™ Linux® Services.\n\n###\
    \ Objective 1\n\n### Identify the Benefits of iPrint\n\nThe following are the\
    \ benefits and features of iPrint:\n\n- **Global access to printers.** iPrint\
    \ allows mobile employees, business partners, and customers to access your printers\
    \ from anywhere with a web browser.\n\nFor example, suppose you are attending\
    \ a sales meeting at your company’s regional office and you discover that you\
    \ did not bring enough copies of the monthly sales report.\n\nUsing your laptop\
    \ and a web browser, you can browse to a floor plan of the building, select the\
    \ printer next to the conference room, and print additional copies of the sales\
    \ report.\n\n- **Reduced communication costs.** Printing to a remote location\
    \ can be challenging. Faxing can be expensive and inefficient.\n\nIf you email\
    \ a document, you have to be sure the recipient has a compatible word processing\
    \ or page-layout application.\n\nBy contrast, iPrint enables you to use existing\
    \ printers to print high-quality, legible documents.\n\n- **Secure printing.**\
    \ eDirectory integrates with iPrint to ensure that only authorized users can access\
    \ your printers.\n\nPrint jobs are submitted to the iPrint Manager via SSL to\
    \ prevent unauthorized users from accessing your documents.\n\n- **Unified management.**\
    \ You can control all your printers from a single location, even if the printers\
    \ are made by different manufacturers and are in different locations.\n\nYou can\
    \ even use customized management features to create a common interface to access\
    \ your company’s print resources.\n\n- **Customized viewing of printers.** Users\
    \ can immediately view available printers from a web page. Network administrators\
    \ can customize this page to meet specific business requirements.\n\nFor example,\
    \ using the Map Design tool, you can insert a floor plan of your building into\
    \ a corporate web page. You can then easily drag and drop icons to the floor plan\
    \ that represent the actual locations of your printers. You can access the map\
    \ through a browser and select a printer icon to install the printer and its drivers.\n\
    \n### Objective 2 Describe How iPrint Works\n\nTo describe how iPrint works, you\
    \ need to know how the following components work:\n\n- iPrint Manager\n- iPrint\
    \ Driver Store\n- iPrint Client\n- iPrint Map Designer\n\nThe following illustrates\
    \ how the iPrint Manager, iPrint Driver Store, and iPrint client components provide\
    \ print services:\n\n**Figure 7-1**\n\n![](img/d63035f3fce0eaaf97203dde900affb7_135_0.png)\n\
    \n#### *iPrint Manager*\n\nThe iPrint Manager is an object in the eDirectory™\
    \ tree as well as a daemon that runs on your Linux server. Print jobs are submitted\
    \ to the iPrint Manager and then forwarded to the printer, when the printer is\
    \ ready:\n\n**Figure 7-2**\n\n![](img/d63035f3fce0eaaf97203dde900affb7_135_1.png)\n"
