  - "[PAGE 26]\n\n+   * **Storage configuration.** Create a storage volume accessible\
    \ from the Linux server where you want to store the user data for the iFolder\
    \ accounts.\n+   \n+   Best practice is to not store iFolder data, which can grow\
    \ very rapidly, on a volume that the operating system needs to have free space\
    \ on to function normally.\n+   \n+   Storage solutions can include any volume\
    \ options supported by Red Hat or SLES 8, including directly attached storage\
    \ and storage area networks.\n+   \n+   Your LDAP server and iFolder server can\
    \ reside on the same machine.\n+   * **DNS configuration.** Make sure the DNS\
    \ name and IP address of the enterprise server you want to use as your iFolder\
    \ server are listed on the DNS server.\n+   * **iFolder client platform.** Make\
    \ sure that Internet Explorer (IE) 5.0 or later is installed on Windows workstations\
    \ that will use the iFolder client.\n+   * **iFolder Java Applet.** If users are\
    \ going to access their files through a web browser, make sure they have Internet\
    \ Explorer because the Java applet is only compatible with Internet Explorer.\n\
    +   * **Firewall configuration.** You can place your iFolder server inside the\
    \ firewall (no external access), outside the firewall (ISP model), or both (OneNet\
    \ model).\n+   \n+   iFolder requires HTTP port 80 (for file access), HTTPS port\
    \ 443 (for iFolder management), and LDAP port 389 or 636 (for authentication).\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_26_0.png)\n\nAccess through the firewall\
    \ can be firewall pin holes, ICS/iChain®, or Level 4 (L4) switches."
  - '[PAGE 27]


    It is important to note that the iFolder client does not access the LDAP server.
    The iFolder server is the only piece of iFolder using the LDAP server for authentication.


    This means that if the iFolder server and the LDAP server being used for authentication
    are on the same side of the firewall, you do not need to open additional ports.


    # ### How to Install iFolder from NNLS


    To install iFolder 2.1 on your Linux server, you need to know the following:


    +   - Steps for Installing iFolder

    +   - iFolder Objects in the eDirectory Schema

    +   - iFolder File Placement


    # #### Steps for Installing iFolder


    The general steps for installing iFolder are


    +   1. Meet iFolder Dependencies

    +   2. Gather Required Information

    +   3. Use the NNLS Install Feature


    # ##### Meet iFolder Dependencies


    iFolder is dependent on the following NNLS components:


    +   - Apache 2.0.45 on the same server

    +   - eDirectory 8.7.1 or later anywhere within the network


    If these components are not already installed, you do not have to install them
    before installing iFolder.'
