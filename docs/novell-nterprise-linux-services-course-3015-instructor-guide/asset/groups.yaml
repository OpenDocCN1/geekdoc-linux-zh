  - '[PAGE 173]


    # **Messaging Server**


    A messaging server is any server on the network that hosts 1 or more NetMail agents.
    In the cDirectory tree, the *Messaging Server* object represents the physical
    server where you have installed the NetMail software.


    The Messaging Server object is represented as a container with server attributes.
    It contains 1 or more Agent objects and it defines the messaging server’s properties.


    Each Messaging Server object is associated with a Server object.


    You can implement your entire messaging system on a single server or you can distribute
    NetMail services across multiple messaging servers.


    In environments with multiple messaging servers, the servers can be configured
    to work together as a single, integrated messaging system called a *distributed
    environment*. They can also be configured to operate as independent sub-systems
    called *standalone environments*.


    # **Distributed Messaging Servers**


    In a distributed messaging system, multiple messaging servers work together as
    a single, integrated system.


    Distributed messaging servers look for other Messaging Server objects in the Internet
    Services container. If a Messaging Server object or an alias of that object exists
    in the Internet Services container, other distributed messaging servers can find
    and interact with it.'
  - '[PAGE 174]


    A typical distributed messaging system is shown in the following:


    ![](img/d63035f3fce0eaaf97203dde900affb7_174_0.png)


    Distributed messaging servers are most often used in larger organizations. These
    organizations typically require multiple messaging servers to provide load balancing,
    fault tolerance, and speed.


    # Standalone Messaging Servers


    A standalone messaging server does not interact with other messaging servers.
    Instead, it acts as an independent messaging system, exclusively providing all
    NetMail services to the users within its assigned contexts.


    A standalone configuration is shown in the following:


    ![](img/d63035f3fce0eaaf97203dde900affb7_174_1.png)'
  - '[PAGE 175]


    To configure a standalone messaging server, you must mark the **Distributed Processing
    Disabled** option in the messaging server’s properties. This prevents the messaging
    server from looking for other Messaging Server objects in the Internet Services
    container.


    You could consider a standalone system if your organization experiences a moderate
    amount of messaging traffic or if your organization’s network environment includes
    slow WAN links.


    # Parent Objects


    *Parent objects* enable you to subdivide a single messaging system into configuration
    subunits. This lets you collectively manage agent services and user settings for
    specific sets of users.


    For example, in a multidomain environment, you can create separate Parent objects
    for each domain. This lets you manage every domain as if it were a separate messaging
    system.


    The Parent object also lets you selectively grant access to messaging services.
    You can enable or disable different agent services for each Parent object.


    For example, in an ISP environment, you could use Parent objects to give one Hosting
    Domain access to POP and another access to IMAP, allowing them to bill for individual
    services.


    Parent objects can also be used to distribute administrative tasks. Selected users
    can be given rights to create, delete, modify, or import user accounts in specific
    Internet domains.


    Agents running on both distributed and standalone messaging servers dynamically
    look up the user’s Parent object in the tree to determine what rights the user
    has to the service.'
