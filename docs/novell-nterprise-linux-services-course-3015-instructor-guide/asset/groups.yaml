- raw:
  - '[PAGE 144]


    # Locate iPrint Files


    During a default installation, the following iPrint directories and files are
    created:


    +   1. `/var/opt/novell/http/htdocs/ippdocs`

    +       2. `/var/opt/novell/iprint`

    +       3. `/var/opt/novell/log/ipsmd.log`

    +       4. `/etc/opt/novell/iprint/ipsmd.conf`


    The `/var/opt/novell/http/htdocs/ippdocs` directory holds items such as the list
    of available print drivers (`iprint.ini`) and printer maps.


    The `ipsmd.log` and `ipsmd.conf` files are the log and configuration files for
    the iPrint daemon (`ipsmd`).


    # Install the iPrint Client on a Windows Workstation


    To install the iPrint client on a Windows workstation, do the following:


    +   1. Enter the following URL in Internet Explorer:

    +       `http://server_ip_address/ipp`

    +       2. Select **Install iPrint Client**.

    +       3. Follow the steps to install the client.

    +       4. Restart your Windows workstation.'
  - "[PAGE 145]\n\n# **Create and Start a Driver Store**\n\nTo create and start a\
    \ driver store, do the following:\n\n+   1. Open **iManager**: \n+    a. For the\
    \ iManager URL, enter \n+    `https://server_ip_address/nps/iManager.html` \n\
    +    A Login page appears. \n+    b. Enter your username and password. \n+   \
    \ c. Select **Login.**\n+       \n+       After a few moments, the Novell iManager\
    \ home page appears.\n\n+   2. On the left under **iPrint**, select **Create Driver\
    \ Store.**\n\n+   3. Enter a driver store name.\n\n+   4. Enter, or browse to\
    \ and select, a container for the driver store.\n\n+   5. In the **Target Server**\
    \ field, enter a DNS name or IP address for the server that will host the driver\
    \ store.\n\n+   6. In the **eDir Server** field, enter the context of your eDir\
    \ server.\n\n+   7. Make sure **Start Driver Store after Creation** is selected.\n\
    \n+   8. Select **OK.**\n\n# **Add Printer Drivers to Your Driver Store**\n\n\
    **iPrint** allows you to upload drivers to your Driver Store by using the drivers\
    \ from an .inf file or from the drivers that currently exist on your Windows workstation.\n\
    \nTo add drivers to your driver store, do the following:\n\n+   1. In **iManager**\
    \ under **iPrint**, select **Manage Driver Store.**\n\n+   2. Browse to and select\
    \ the driver store you want to add print drivers to."
  - "[PAGE 146]\n\n+   3. Select **OK**.\n+   4. Select the **Drivers** tab.\n+  \
    \ 5. Select the tab of the Platform you want to work with (**XP, 2000, NT 4, or\
    \ 95/98/Me**).\n+   6. Do one of the following:\n+       - Add drivers from a\
    \ print driver .inf file by selecting **Add from File**.\n+       - or\n+    \
    \   - Add drivers from the Windows workstation client on which you are running\
    \ iManager by selecting **Add from System**.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_146_0.png)\n\
    \n> If you choose **Add from System**, you can only upload drivers to the same\
    \ platform as the workstation you are working from.\n> \n> For example, if you\
    \ are on a Windows 2000 machine, you will only be able to upload the drivers that\
    \ are on your Windows 2000 machine.\n\n+   7. Select the printer driver you want\
    \ to add.\n+   8. Select the Printer Driver Language (PDL) for the driver.\n+\
    \   9. Select **OK**.\n+   10. Repeat steps 7 through 9 until you have added all\
    \ of your printer drivers.\n+   11. Select **OK**.\n\n# Create and Start the iPrint\
    \ Manager\n\nTo create and start the iPrint Manager, do the following:\n\n+  \
    \ 1. In iManager under iPrint, select **Create Print Manager**.\n+   2. Enter\
    \ a Manager name."
  - '[PAGE 147]


    +   3.  Enter the *container* where you want the iPrint Manager''s object to reside.


    +   4.  In the Target Server field, enter a *DNS name* or *IP address* for the
    server that will host the iPrint Manager.


    +   5.  In the eDir Server field, enter the *context* of your eDirectory server.


    +   6.  In the Driver Store field, browse to and select your Driver Store object.


    +   7.  Make sure **Start print manager after creation** is selected.


    +   8.  Select **OK**.


    # Create Your Printer Objects


    To create a printer object for your printer, do the following:


    +   1.  In iManager under iPrint, select **Create Printer**.


    +   2.  Enter the name you want to assign to the new printer.


    ![](img/d63035f3fce0eaaf97203dde900affb7_147_0.png)


    +   3.  In the Container name field, browse to and select the *container* where
    you want the printer to reside.


    +   4.  In the Manager name field, browse to and select the iPrint Manager you
    want to have assigned to this printer.


    +   5.  In the DNS name or IP address field, enter the *DNS name* or *IP address*
    of the printer.


    Secure printing uses port 443 to send secure data from the client to the server.


    Non-secure printing uses port 631 to send clear text from the client to the server.'
  - '[PAGE 148]


    ![](img/d63035f3fce0eaaf97203dde900affb7_148_0.png)


    All print data is non-secure between the server and the printer because iPrint
    sends its data from the server to the printer via LPR (Line Printer Remote). LPR
    does not handle authentication or security and, therefore, is clear text.


    +   6. (Optional) Enter information describing the location of the printer.


    +   7. (Optional) Enter a description of the printer.


    +   8. Select Next.


    +   9. Select the default print drivers to install for each Windows platform.


    +   10. Select Next.


    +   11. (Optional) To create additional Printer objects, select Repeat Task and
    repeat all the above steps to create a Printer object.


    +   12. Select OK.


    # *Configure Your Network for Workstation and/or User Printers*


    Before you configure your network for workstation and/or user printers, you need
    to understand what each of them is:


    +   - **Workstation Printer.** This is an installed printer on a Windows NT/2000/XP
    machine that is available to anyone who is logged on to that Windows machine.

    +   Workstation printers can be created on Windows NT/2000/XP machines only by
    users who have Administrator or Power User rights.


    +   - **User Printer.** This is an installed printer that is available only to
    the person who installed it on a Windows NT/2000/XP machine.'
  - "[PAGE 149]\n\nUser printers can be created by any user in your network.\n\nTo\
    \ determine which kinds of printers are created on your network, do the following:\n\
    \n+   1. Browse to the ippint.ini file located in the /var/opt/novell/httpd/htdocs/ippdocs\
    \ folder on your Linux server.\n+   \n+   2. Right-click the ippint.ini file;\
    \ then select Open With > gedit.\n+   \n+   3. Configure the AllowUserPrinters\
    \ value to one of the following:\n+      - 0 (the default) means that only users\
    \ with sufficient rights (Administrator rights or Power User rights) can install\
    \ a printer to the desktop. When a printer is installed to the desktop, it will\
    \ be a Workstation printer.\n+      - 1 means that if the current user doesn't\
    \ have rights to add it as a Workstation printer, it will be added as a User printer.\n\
    +      - 2 means that all printers added, regardless of the user's rights, will\
    \ be User printers.\n+   \n+   4. When you finish, select Save.\n+   \n+   5.\
    \ Select Exit.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_149_0.png)\n\nWindows\
    \ 9x ignores these values and only creates Workstation printers.\n\n# Create Location-Based\
    \ Printing Web Pages\n\nLocation-based printing lets users select printers based\
    \ on location by using one of the following:\n\n+   - List View\n+   \n+   - Maps"
  - '[PAGE 150]


    # List View


    The **iPrint Manager** creates a list of your printers at the default iPrint page
    (`http://server_IP_address/ipp`).


    To create a custom web page with your own list, you must use an HTML editor and
    create links to the printer’s URL.


    To view a printer’s URL, do the following:


    +   1. In **iManager** under **iPrint**, select **Manage Printer**.

    +   2. In the **iPrint Printer name** field, browse to and select the printer
    you want.

    +   3. Select **OK**.

    +   4. Select **Client Support > iPrint Support**.


    The printer’s URL is displayed under **Accepted IPP URL**.


    # Maps


    You can create maps with printer icons representing the location of your printers
    within your workplace environment. This enables your users to easily select which
    printer they want to print from, and download the correct driver for that printer.


    Novell has created an iPrint Map Designer tool that utilizes drag-and-drop technology
    to aid you in creating your own location-based maps.


    To create and configure a location-based map using the iPrint Map Designer, you
    must have the following:


    +   - Internet Explorer 5.5 or later

    +   - Windows 95/98/Me or Windows NT/2000/XP

    +   - iPrint client installed on the workstation

    +   - Maps to place printers in'
  md: "\n## Locate iPrint Files\n\nDuring a default installation, the following iPrint\
    \ directories and files are created:\n\n1. `/var/opt/novell/http/htdocs/ippdocs`\n\
    2. `/var/opt/novell/iprint`\n3. `/var/opt/novell/log/ipsmd.log`\n4. `/etc/opt/novell/iprint/ipsmd.conf`\n\
    \nThe `/var/opt/novell/http/htdocs/ippdocs` directory holds items such as the\
    \ list of available print drivers (`iprint.ini`) and printer maps.\n\nThe `ipsmd.log`\
    \ and `ipsmd.conf` files are the log and configuration files for the iPrint daemon\
    \ (`ipsmd`).\n\n## Install the iPrint Client on a Windows Workstation\n\nTo install\
    \ the iPrint client on a Windows workstation, do the following:\n\n1. Enter the\
    \ following URL in Internet Explorer:\n   `http://server_ip_address/ipp`\n2. Select\
    \ **Install iPrint Client**.\n3. Follow the steps to install the client.\n4. Restart\
    \ your Windows workstation.\n\n## Create and Start a Driver Store\n\nTo create\
    \ and start a driver store, do the following:\n\n1. Open **iManager**:\n   a.\
    \ For the iManager URL, enter `https://server_ip_address/nps/iManager.html`. A\
    \ Login page appears.\n   b. Enter your username and password.\n   c. Select **Login**.\n\
    \n   After a few moments, the Novell iManager home page appears.\n\n2. On the\
    \ left under **iPrint**, select **Create Driver Store**.\n3. Enter a driver store\
    \ name.\n4. Enter, or browse to and select, a container for the driver store.\n\
    5. In the **Target Server** field, enter a DNS name or IP address for the server\
    \ that will host the driver store.\n6. In the **eDir Server** field, enter the\
    \ context of your eDir server.\n7. Make sure **Start Driver Store after Creation**\
    \ is selected.\n8. Select **OK**.\n\n## Add Printer Drivers to Your Driver Store\n\
    \n**iPrint** allows you to upload drivers to your Driver Store by using the drivers\
    \ from an .inf file or from the drivers that currently exist on your Windows workstation.\n\
    \nTo add drivers to your driver store, do the following:\n\n1. In **iManager**\
    \ under **iPrint**, select **Manage Driver Store**.\n2. Browse to and select the\
    \ driver store you want to add print drivers to.\n3. Select **OK**.\n4. Select\
    \ the **Drivers** tab.\n5. Select the tab of the Platform you want to work with\
    \ (**XP, 2000, NT 4, or 95/98/Me**).\n6. Do one of the following:\n   - Add drivers\
    \ from a print driver .inf file by selecting **Add from File**.\n   - Or add drivers\
    \ from the Windows workstation client on which you are running iManager by selecting\
    \ **Add from System**.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_146_0.png)\n\
    \n> If you choose **Add from System**, you can only upload drivers to the same\
    \ platform as the workstation you are working from.\n>\n> For example, if you\
    \ are on a Windows 2000 machine, you will only be able to upload the drivers that\
    \ are on your Windows 2000 machine.\n\n7. Select the printer driver you want to\
    \ add.\n8. Select the Printer Driver Language (PDL) for the driver.\n9. Select\
    \ **OK**.\n10. Repeat steps 7 through 9 until you have added all of your printer\
    \ drivers.\n11. Select **OK**.\n\n## Create and Start the iPrint Manager\n\nTo\
    \ create and start the iPrint Manager, do the following:\n\n1. In iManager under\
    \ iPrint, select **Create Print Manager**.\n2. Enter a Manager name.\n3. Enter\
    \ the *container* where you want the iPrint Manager's object to reside.\n4. In\
    \ the Target Server field, enter a *DNS name* or *IP address* for the server that\
    \ will host the iPrint Manager.\n5. In the eDir Server field, enter the *context*\
    \ of your eDirectory server.\n6. In the Driver Store field, browse to and select\
    \ your Driver Store object.\n7. Make sure **Start print manager after creation**\
    \ is selected.\n8. Select **OK**.\n\n## Create Your Printer Objects\n\nTo create\
    \ a printer object for your printer, do the following:\n\n1. In iManager under\
    \ iPrint, select **Create Printer**.\n2. Enter the name you want to assign to\
    \ the new printer.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_147_0.png)\n\n\
    3. In the Container name field, browse to and select the *container* where you\
    \ want the printer to reside.\n4. In the Manager name field, browse to and select\
    \ the iPrint Manager you want to have assigned to this printer.\n5. In the DNS\
    \ name or IP address field, enter the *DNS name* or *IP address* of the printer.\n\
    \nSecure printing uses port 443 to send secure data from the client to the server.\n\
    \nNon-secure printing uses port 631 to send clear text from the client to the\
    \ server.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_148_0.png)\n\nAll print\
    \ data is non-secure between the server and the printer because iPrint sends its\
    \ data from the server to the printer via LPR (Line Printer Remote). LPR does\
    \ not handle authentication or security and, therefore, is clear text.\n\n6. (Optional)\
    \ Enter information describing the location of the printer.\n7. (Optional) Enter\
    \ a description of the printer.\n8. Select Next.\n9. Select the default print\
    \ drivers to install for each Windows platform.\n10. Select Next.\n11. (Optional)\
    \ To create additional Printer objects, select Repeat Task and repeat all the\
    \ above steps to create a Printer object.\n12. Select OK.\n\n## Configure Your\
    \ Network for Workstation and/or User Printers\n\nBefore you configure your network\
    \ for workstation and/or user printers, you need to understand what each of them\
    \ is:\n\n- **Workstation Printer.** This is an installed printer on a Windows\
    \ NT/2000/XP machine that is available to anyone who is logged on to that Windows\
    \ machine. Workstation printers can be created on Windows NT/2000/XP machines\
    \ only by users who have Administrator or Power User rights.\n- **User Printer.**\
    \ This is an installed printer that is available only to the person who installed\
    \ it on a Windows NT/2000/XP machine. User printers can be created by any user\
    \ in your network.\n\nTo determine which kinds of printers are created on your\
    \ network, do the following:\n\n1. Browse to the `iprint.ini` file located in\
    \ the `/var/opt/novell/http/htdocs/ippdocs` folder on your Linux server.\n2. Right-click\
    \ the `iprint.ini` file; then select Open With > gedit.\n3. Configure the AllowUserPrinters\
    \ value to one of the following:\n   - 0 (the default) means that only users with\
    \ sufficient rights (Administrator rights or Power User rights) can install a\
    \ printer to the desktop. When a printer is installed to the desktop, it will\
    \ be a Workstation printer.\n   - 1 means that if the current user doesn't have\
    \ rights to add it as a Workstation printer, it will be added as a User printer.\n\
    \   - 2 means that all printers added, regardless of the user's rights, will be\
    \ User printers.\n4. When you finish, select Save.\n5. Select Exit.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_149_0.png)\n\
    \nWindows 9x ignores these values and only creates Workstation printers.\n\n##\
    \ Create Location-Based Printing Web Pages\n\nLocation-based printing lets users\
    \ select printers based on location by using one of the following:\n\n- List View\n\
    - Maps\n\n### List View\n\nThe **iPrint Manager** creates a list of your printers\
    \ at the default iPrint page (`http://server_IP_address/ipp`).\n\nTo create a\
    \ custom web page with your own list, you must use an HTML editor and create links\
    \ to the printer’s URL.\n\nTo view a printer’s URL, do the following:\n\n1. In\
    \ **iManager** under **iPrint**, select **Manage Printer**.\n2. In the **iPrint\
    \ Printer name** field, browse to and select the printer you want.\n3. Select\
    \ **OK**.\n4. Select **Client Support > iPrint Support**.\n\nThe printer’s URL\
    \ is displayed under **Accepted IPP URL**.\n\n### Maps\n\nYou can create maps\
    \ with printer icons representing the location of your printers within your workplace\
    \ environment. This enables your users to easily select which printer they want\
    \ to print from, and download the correct driver for that printer.\n\nNovell has\
    \ created an iPrint Map Designer tool that utilizes drag-and-drop technology to\
    \ aid you in creating your own location-based maps.\n\nTo create and configure\
    \ a location-based map using the iPrint Map Designer, you must have the following:\n\
    \n- Internet Explorer 5.5 or later\n- Windows 95/98/Me or Windows NT/2000/XP\n\
    - iPrint client installed on the workstation\n- Maps to place printers in\n"
  mdcn: "\n## 查找 iPrint 文件\n\n在默认安装过程中，将创建以下 iPrint 目录和文件：\n\n1.  `/var/opt/novell/http/htdocs/ippdocs`\n\
    2.  `/var/opt/novell/iprint`\n3.  `/var/opt/novell/log/ipsmd.log`\n4.  `/etc/opt/novell/iprint/ipsmd.conf`\n\
    \n`/var/opt/novell/http/htdocs/ippdocs` 目录包含诸如可用打印机驱动列表（`iprint.ini`）和打印机映射等项。\n\
    \n`ipsmd.log` 和 `ipsmd.conf` 文件是 iPrint 守护进程（`ipsmd`）的日志文件和配置文件。\n\n## 在 Windows\
    \ 工作站上安装 iPrint 客户端\n\n要在 Windows 工作站上安装 iPrint 客户端，请执行以下操作：\n\n1.  在 Internet\
    \ Explorer 中输入以下 URL：\n    `http://server_ip_address/ipp`\n2.  选择 **安装 iPrint\
    \ 客户端**（**Install iPrint Client**）。\n3.  按照步骤安装客户端。\n4.  重启您的 Windows 工作站。\n\n\
    ## 创建并启动驱动库\n\n要创建并启动驱动库，请执行以下操作：\n\n1.  打开 **iManager**：\n    a.  在 iManager\
    \ URL 中输入 `https://server_ip_address/nps/iManager.html`。此时将出现登录页面。\n    b.  输入您的用户名和密码。\n\
    \    c.  选择 **登录**（**Login**）。\n\n    片刻之后，将出现 Novell iManager 主页。\n\n2.  在左侧\
    \ **iPrint** 下，选择 **创建驱动库**（**Create Driver Store**）。\n3.  输入驱动库名称。\n4.  输入驱动库所在的容器，或浏览到该容器并选择它。\n\
    5.  在 **目标服务器**（**Target Server**）字段中，输入将托管该驱动库的服务器的 DNS 名称或 IP 地址。\n6.  在 **eDir\
    \ 服务器**（**eDir Server**）字段中，输入您的 eDir 服务器的上下文。\n7.  确保已选中 **创建后启动驱动库**（**Start\
    \ Driver Store after Creation**）。\n8.  选择 **确定**（**OK**）。\n\n## 向驱动库添加打印机驱动\n\n\
    **iPrint** 允许您通过 .inf 文件中的驱动程序或 Windows 工作站上当前的驱动程序，将驱动程序上传到您的驱动库。\n\n要向驱动库添加驱动程序，请执行以下操作：\n\
    \n1.  在 **iManager** 的 **iPrint** 下，选择 **管理驱动库**（**Manage Driver Store**）。\n2.\
    \  浏览到并选择您要添加打印驱动程序的驱动库。\n3.  选择 **确定**（**OK**）。\n4.  选择 **驱动程序**（**Drivers**）选项卡。\n\
    5.  选择您要处理的平台（**XP、2000、NT 4 或 95/98/Me**）的选项卡。\n6.  执行以下操作之一：\n    -  通过选择 **从文件添加**（**Add\
    \ from File**）从打印驱动程序 .inf 文件添加驱动程序。\n    -  或者，通过选择 **从系统添加**（**Add from System**）从正在运行\
    \ iManager 的 Windows 工作站客户端添加驱动程序。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_146_0.png)\n\
    \n> 如果您选择 **从系统添加**（**Add from System**），则只能上传与您正在使用的工作站属于同一平台的驱动程序。\n>\n> 例如，如果您使用的是\
    \ Windows 2000 计算机，则只能上传您 Windows 2000 计算机上的驱动程序。\n\n7.  选择您要添加的打印机驱动程序。\n8. \
    \ 选择该驱动程序的打印机驱动程序语言（PDL）。\n9.  选择 **确定**（**OK**）。\n10. 重复步骤 7 至 9，直到添加完所有打印机驱动程序。\n\
    11. 选择 **确定**（**OK**）。\n\n## 创建并启动 iPrint 管理器\n\n要创建并启动 iPrint 管理器，请执行以下操作：\n\n\
    1.  在 iManager 的 iPrint 下，选择 **创建打印管理器**（**Create Print Manager**）。\n2.  输入管理器名称。\n\
    3.  输入您希望 iPrint 管理器的对象驻留的 *容器*。\n4.  在目标服务器字段中，输入将托管该 iPrint 管理器的服务器的 *DNS 名称*\
    \ 或 *IP 地址*。\n5.  在 eDir 服务器字段中，输入您的 eDirectory 服务器的 *上下文*。\n6.  在驱动库字段中，浏览到并选择您的驱动库对象。\n\
    7.  确保已选中 **创建后启动打印管理器**（**Start print manager after creation**）。\n8.  选择 **确定**（**OK**）。\n\
    \n## 创建打印机对象\n\n要为打印机创建打印机对象，请执行以下操作：\n\n1.  在 iManager 的 iPrint 下，选择 **创建打印机**（**Create\
    \ Printer**）。\n2.  输入您希望分配给新打印机的名称。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_147_0.png)\n\
    \n3.  在容器名称字段中，浏览到并选择您希望打印机驻留的 *容器*。\n4.  在管理器名称字段中，浏览到并选择您希望分配给此打印机的 iPrint 管理器。\n\
    5.  在 DNS 名称或 IP 地址字段中，输入打印机的 *DNS 名称* 或 *IP 地址*。\n\n安全打印使用 443 端口从客户端向服务器发送安全数据。\n\
    \n非安全打印使用 631 端口从客户端向服务器发送明文。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_148_0.png)\n\
    \n由于 iPrint 通过 LPR（行式打印机远程）将数据从服务器发送到打印机，因此服务器和打印机之间的所有打印数据均非安全。LPR 不处理身份验证或安全性，因此是明文。\n\
    \n6.  （可选）输入描述打印机位置的信息。\n7.  （可选）输入打印机的描述。\n8.  选择“下一步”（**Next**）。\n9.  选择要为每个\
    \ Windows 平台安装的默认打印驱动程序。\n10. 选择“下一步”（**Next**）。\n11.  （可选）若要创建额外的打印机对象，请选择“重复任务”（**Repeat\
    \ Task**）并重复上述所有步骤以创建打印机对象。\n12. 选择“确定”（**OK**）。\n\n## 配置工作站和/或用户打印机的网络\n\n在配置工作站和/或用户打印机的网络之前，您需要了解它们各自的定义：\n\
    \n-   **工作站打印机**（**Workstation Printer**）。这是在 Windows NT/2000/XP 机器上安装并可让登录到该\
    \ Windows 机器的任何人使用的打印机。只有具有管理员或高级用户权限的用户才能在 Windows NT/2000/XP 机器上创建工作站打印机。\n\
    -   **用户打印机**（**User Printer**）。这是在 Windows NT/2000/XP 机器上安装且仅对安装它的用户可用的打印机。网络中的任何用户都可以创建用户打印机。\n\
    \n要确定网络上创建了哪些类型的打印机，请执行以下操作：\n\n1.  浏览到位于您的 Linux 服务器 `/var/opt/novell/http/htdocs/ippdocs`\
    \ 文件夹中的 `iprint.ini` 文件。\n2.  右键单击 `iprint.ini` 文件；然后选择“打开方式 > gedit”（**Open With\
    \ > gedit**）。\n3.  将 AllowUserPrinters 值配置为以下值之一：\n    -   0（默认值）表示只有具有足够权限（管理员权限或高级用户权限）的用户才能将打印机安装到桌面。当打印机安装到桌面时，它将是一个工作站打印机。\n\
    \    -   1 表示如果当前用户没有权限将其添加为工作站打印机，它将被添加为用户打印机。\n    -   2 表示所有添加的打印机，无论用户权限如何，都将是用户打印机。\n\
    4.  完成后，选择“保存”（**Save**）。\n5.  选择“退出”（**Exit**）。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_149_0.png)\n\
    \nWindows 9x 会忽略这些值，并且只创建工作站打印机。\n\n## 创建基于位置打印的 Web 页面\n\n基于位置的打印允许用户通过使用以下方法之一，根据位置选择打印机：\n\
    \n-   列表视图（**List View**）\n-   地图（**Maps**）\n\n### 列表视图\n\n**iPrint 管理器** 在默认\
    \ iPrint 页面（`http://server_IP_address/ipp`）上创建您的打印机列表。\n\n若要创建包含自定义列表的 Web 页面，您必须使用\
    \ HTML 编辑器并创建指向打印机 URL 的链接。\n\n要查看打印机的 URL，请执行以下操作：\n\n1.  在 **iManager** 的 **iPrint**\
    \ 下，选择 **管理打印机**（**Manage Printer**）。\n2.  在 **iPrint 打印机名称**（**iPrint Printer\
    \ name**）字段中，浏览到并选择您要查看的打印机。\n3.  选择 **确定**（**OK**）。\n4.  选择 **客户端支持 > iPrint\
    \ 支持**（**Client Support > iPrint Support**）。\n\n打印机的 URL 显示在 **已接受的 IPP URL**（**Accepted\
    \ IPP URL**）下。\n\n### 地图\n\n您可以创建带有打印机图标的地图，这些图标代表打印机在工作环境中的位置。这使用户能够轻松选择要使用的打印机，并下载该打印机的正确驱动程序。\n\
    \nNovell 创建了一个 iPrint 地图设计器工具，该工具利用拖放技术帮助您创建自己的基于位置的地图。\n\n若要使用 iPrint 地图设计器创建和配置基于位置的地图，必须具备以下条件：\n\
    \n-   Internet Explorer 5.5 或更高版本\n-   Windows 95/98/Me 或 Windows NT/2000/XP\n\
    -   工作站上已安装 iPrint 客户端\n-   用于放置打印机的地图\n\n"
