    \ iFolder client icon in the system tray; then select **Logout**.\n   - b. Log\
    \ in to your iFolder user by right-clicking on the *iFolder icon* in the system\
    \ tray; then select **Login**.\n   - c. For the iFolder user you changed settings\
    \ for, enter the *user ID* and **novell** for the password; then select your server\
    \ DNS name from the drop-down list.\n   - d. Select **Login**.\n   - e. For the\
    \ pass phrase, enter **novell**; then select **OK**.\n   - f. Right-click the\
    \ iFolder client icon; then select **Account Information**.\n\n   Select the **Account\
    \ Information** tab.\n   Note the following:\n   - The total space for the iFolder\
    \ user on the server has increased to 250 MB.\n   - The iFolder location is still\
    \ displayed. This is because the policy of hiding the location can only be applied\
    \ to new accounts (there was a note on the Policies configuration page).\n\n \
    \  Select the **Preferences** tab.\n   Note the following:\n   - Automatic sync\
    \ is grayed because it is enforced and cannot be deselected.\n   - The Synchronize\
    \ to server delay is set (and grayed) for 30 seconds (instead of the 5 seconds\
    \ default) and cannot be changed.\n   - The Remember Pass Phrase option is hidden.\n\
    \n   Select **File > Logout** to log out the iFolder user.\n   If you have time,\
    \ try enabling, activating, and synchronizing files for the other 2 employees.\n\
    \   You can also experiment with changing other iFolder configurations from the\
    \ client or the iFolder Management console.\n\n   **Close the Mozilla browser,\
    \ the terminal session, and any other windows that are open.**\n\n(End of Exercise)\n\
    \n## Objective 3 Describe the Purpose and Architecture of Samba\n\nSamba is a\
    \ software package that implements Microsoft’s SMB/CIFS networking protocols on\
    \ Linux.\n\nIt allows a Linux machine to function as a Windows-compatible file\
    \ server and to act as a client to other Windows servers.\n\nTo describe the purpose\
    \ and architecture of Samba, you need to know the following:\n\n- What Server\
    \ Message Block (SMB) Is\n- What Common Internet File System (CIFS) Is\n- Samba\
    \ and NNLS\n\n### What Server Message Block (SMB) Is\n\nServer Message Block (SMB)\
    \ is a protocol for sharing resources between networked computers.\n\nSMB can\
    \ be implemented over a number of protocols including TCP/IP, NetBEUI, or IPX/SPX.\n\
    \n> For more information about SMB, see http://www.samba.org/cifs/docs/what-is-smb.html.\n\
    \n### What Common Internet File System (CIFS) Is\n\nCIFS is an implementation\
    \ of SMB over native TCP/IP that does not require NetBIOS.\n\nCIFS is a client/server\
    \ protocol and is used by Microsoft Windows operating systems. It is also implemented\
    \ on many other platforms (such as DOS, NetWare, UNIX®, Linux, and VMS™).\n\n\
    The advantages of using CIFS include the following:\n\n- You do not need a Novell\
    \ client to access files.\n- You can use the client for Microsoft networks.\n\
    - All Windows operating systems support CIFS (must support IP).\n- Most (if not\
    \ all) applications do support CIFS (using native Windows networking).\n- Implementation\
    \ is available for many other platforms (such as Samba on UNIX/Linux).\n\n###\
    \ Samba and NNLS\n\nSamba is a suite of tools that lets you use Microsoft's SMB/CIFS\
    \ networking protocol with Linux computers and other platforms.\n\nWith Samba\
    \ installed, a Linux computer can function as the following:\n\n- **Windows server.**\
    \ Samba enables a server to provide Windows file and print services to users.\n\
    - **Windows client.** Samba enables a workstation to access and use Windows file\
    \ and print services, whether they originate on a Windows server or a Linux server\
    \ with Samba installed.\n\nThe Samba distribution installed with NNLS is customized\
    \ specifically for NNLS and focuses on providing authenticated file services from\
    \ the Linux server to users working on Windows client workstations.\n\nThis distribution\
    \ is configured for the following functionality:\n\n- Samba users are created\
    \ in eDirectory using Linux User Management (LUM) tools included with NNLS.\n\
    - After you create users, you must specify a Samba password for each user, using\
    \ either iManager or the smbpasswd utility.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_81_0.png)\n\
    \n- Home directories are automatically created and appropriate file access rights\
    \ are automatically assigned the first time a LUM user logs in to the NNLS server\
    \ from a text-based console.\n- Access to Samba services requires that users authenticate\
    \ using secure LDAP to the eDirectory server specified during NNLS installation.\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_81_1.png)\n\n## Objective 4 Install\
    \ and Configure Samba\n\nTo install and configure Samba, you need to know the\
    \ following:\n\n- Steps for Installing Samba\n- How to Configure Samba\n- How\
    \ to Access Files Through Samba\n\n### Steps for Installing Samba\n\nTo install\
    \ Samba on your Linux server, you need to do the following:\n\n- Meet Samba Dependencies\n\
    - Gather Required Information\n- Use the NNLS Install Feature\n\nIf you are providing\
    \ Samba file services on the NNLS server to Windows users on your network, you\
    \ must also install Linux User Management (LUM).\n\nLinux User Management lets\
    \ you create eDirectory users that can then access the NNLS server.\n\n### Meet\
    \ Samba Dependencies\n\nSamba is dependent on the following NNLS component:\n\n\
    - eDirectory 8.7.1 or later anywhere within the network\n\nIf this component is\
    \ not already installed, you do not have to install it before installing Samba.\n\
    \nThe NNLS install program will select the required component, along with its\
    \ dependencies, if any, when you select the Samba component. Samba and the component\
    \ it is dependent on will both be installed in the same process.\n\nSee Table\
    \ 2-5 for required information you need to gather to successfully install any\
    \ Samba dependencies that are not already installed.\n\nThe following describes\
    \ the information you need to know before installing Samba:\n\n### Gather Required\
    \ Information\n\n![](img/d63035f3fce0eaaf97203dde900affb7_83_0.png)\n\n| Configuration\
    \ Data Required | Description |\n| :--- | :--- |\n| eDirectory Server IP Address\
    \ or DNS Hostname | The IP address or DNS name of the server on which you are\
    \ installing iFolder. The primary IP address of the eDirectory server to which\
    \ Windows users will authenticate using LDAP authentication for access to the\
    \ directories and files on the NNLS server. |\n| Admin Name with Context | The\
    \ fully distinguished name of the Admin for the eDirectory server specified for\
    \ Samba. The name and context must be specified using typeful syntax (cn=name.ou=organizational-unit.o=organization).\
    \ |\n| Admin Password | The password for the Admin. |\n| LDAP Server IP Address\
    \ or DNS Hostname | The primary IP address of the eDirectory server to which Windows\
    \ users will authenticate using LDAP authentication for access to the directories\
    \ and files on the NNLS server. |\n| Samba Proxy User Name with Context | The\
    \ name of the proxy user you want eDirectory to configure for Samba. The installation\
    \ script creates this user object for you. |\n| Samba Proxy User Password | The\
    \ password for the Samba proxy user. |\n\n"
