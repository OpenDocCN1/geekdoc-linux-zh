    # **Part III: Configure iFolder to Log Debug Information**


    Now that users are logging in and out of iFolder and synchronizing files, you
    should configure iFolder to write debug information to a log file.


    Do the following:


    +   1. Open a terminal window and change to root by entering `su` - with a password
    of **novell**.

    +   2. Enter `cd /var/opt/novell/ifolder/DocumentRoot`.

    +   3. Enter `mkdir logs`.'
