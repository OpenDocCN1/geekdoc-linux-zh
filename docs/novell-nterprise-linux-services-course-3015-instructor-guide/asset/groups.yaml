    +       a. Select **Applications > KDE Menu > System > File Manager - Super User
    Mode**.

    +       b.  Enter a password of **novell**; then select **OK**.

    +       c.  Browse to `/etc/opt/novell/ifolder`.

    +       d.  Right-click the `httpd_ifolder_unix.conf` file; then select **Open
