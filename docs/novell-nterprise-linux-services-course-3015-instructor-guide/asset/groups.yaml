    # X.500 Models


    Because of its complexity, the Directory is easier to understand if it is taken
    apart and described in terms of parts, or models.


    Each model represents a simplified view of one part of the whole Directory.


    In 1988, the X.500 specification defined only the Directory Information Model,
    which described a basic view of the Directory. The 1993 X.500 specification provides
    a number of additional models to describe the Directory.


    The following are some of the most significant models in the X.500 specifications:


    +   - **User Information Model.** Describes what the Directory looks like to the
    user.

    +   - **Directory Functional Model.** Gives an overall view of how the Directory
    works.

    +   - **Operational and Administrative Information Model.** Describes what the
    Directory looks like to an administrator.

    +   - **DSA Information Model.** Explains how Directory System Agents (DSAs) work
    together to provide Directory access.

    +   - **Directory Distribution Model.** Describes how DSAs distribute information.

    +   - **Directory Administrative Authority Model.** Describes how the Directory
    is administered.

    +   - **Security Model.** Describes authentication and access control.'
  - "[PAGE 302]\n\nAlthough these models are important to the X.500 specification,\
    \ we will present a simple, condensed overview of the essential components of\
    \ a Directory that cross the boundaries of several of these models.\n\n# ## The\
    \ Components of the X.500 Directory\n\nEssential components of the X.500 standard\
    \ include the following:\n\n+   Directory Information Database (DIB)\n+   \n+\
    \   Directory Information Tree (DIT)\n+   \n+   Directory User Agent (DUA)\n+\
    \   \n+   Directory System Agent (DSA)\n+   \n+   Directory Access Protocol (DAP)\n\
    +   \n+   Directory System Protocol (DSP)\n+   \n+   Directory Information Shadowing\
    \ Protocol (DISP)\n\n# ### Directory Information Database (DIB)\n\nA Directory\
    \ is made up of objects that represent physical resources in the real world. For\
    \ example, people, servers, and printers are represented by objects in the Directory\
    \ tree.\n\nCollectively, these objects are known as the Directory Information\
    \ Database (DIB).\n\nWithin the DIB each object is made up of a collection of\
    \ information known as an *entry*. Each entry is made up of attributes and values\
    \ and has a distinguished name that uniquely identifies the entry."
  - '[PAGE 303]


    # **Directory Information Tree (DIT)**


    The Directory Information Tree (DIT) is a tree structure that logically represents
    and describes the collection of objects and the relationship of information in
    the DIB.


    The objects are contained in a hierarchical arrangement in this tree structure.


    For example, a person (object/entry) works for a company (object/entry) that is
    located within a country (object/entry).


    To keep the Directory organized, a set of rules is enforced to ensure that the
    DIB remains stable and intact as modifications are made to it over time.


    These rules are known as the Directory schema. They prevent entries from having
    the wrong attribute type or objects from being a member of the wrong object class.


    # **Directory User Agent (DUA)**


    The X.500 specification takes a client/server approach in communicating information.
    The client interacts with a server to perform specific Directory operations.


    The DUA, acting as the client, is an application process that represents each
    user accessing the Directory. Users are people or programs that can read, modify,
    or search the Directory.


    The DUA requests information from the Directory and then relays that information
    to the user.'
  - '[PAGE 304]


    # **Directory System Agent (DSA)**


    The DSA differs from the DUA in that it is not a single protocol or piece of software.


    The DSA is a collection of services and protocols that manage a specific portion
    of a DIB.


    Communication between the DSA and the DUA goes as follows: the DSA receives a
    request from a DUA. If that DSA has the requested information, it will relay it
    back to the DUA.


    If it doesn''t have the requested information, it will pass the request on to
    another DSA.


    # **Directory Access Protocol (DAP)**


    The DAP handles the exchange of requests and outcomes between a DUA and a DSA.


    # **Directory System Protocol (DSP)**


    Sometimes, a DSA cannot fulfill the request of a DUA and it passes the request
    to another DSA. The DSP provides this communication between the 2 DSA\s.


    # **Directory Information Shadowing Protocol (DISP)**


    Replication, or shadowing, is used to distribute the DIB to another DSA. This
    improves the performance of requests made to the Directory and provides a secondary
    or backup copy of the DIB.


    The DISP actually performs this exchange of replication information.'
  - '[PAGE 305]


