    \ configuration\nYou can place your iFolder server inside the firewall (no external\
    \ access), outside the firewall (ISP model), or both (OneNet model).\n\niFolder\
    \ requires HTTP port 80 (for file access), HTTPS port 443 (for iFolder management),\
    \ and LDAP port 389 or 636 (for authentication).\n\n![](img/d63035f3fce0eaaf97203dde900affb7_26_0.png)\n\
    \nAccess through the firewall can be firewall pin holes, ICS/iChain®, or Level\
    \ 4 (L4) switches.\n\nIt is important to note that the iFolder client does not\
    \ access the LDAP server. The iFolder server is the only piece of iFolder using\
    \ the LDAP server for authentication.\n\nThis means that if the iFolder server\
    \ and the LDAP server being used for authentication are on the same side of the\
    \ firewall, you do not need to open additional ports.\n\n## How to Install iFolder\
    \ from NNLS\n\nTo install iFolder 2.1 on your Linux server, you need to know the\
    \ following:\n\n- Steps for Installing iFolder\n- iFolder Objects in the eDirectory\
    \ Schema\n- iFolder File Placement\n\n### Steps for Installing iFolder\n\nThe\
    \ general steps for installing iFolder are:\n\n1. Meet iFolder Dependencies\n\
    2. Gather Required Information\n3. Use the NNLS Install Feature\n\n#### Meet iFolder\
    \ Dependencies\n\niFolder is dependent on the following NNLS components:\n\n-\
    \ Apache 2.0.45 on the same server\n- eDirectory 8.7.1 or later anywhere within\
    \ the network\n\nIf these components are not already installed, you do not have\
    \ to install them before installing iFolder.\n\nThe NNLS install program will\
    \ select the required components, along with their dependencies, when you select\
    \ the iFolder component. They will all be installed in the same process.\n\nSee\
    \ Table 2-5 for information needed to successfully install any iFolder dependencies\
    \ that are not already installed.\n\n### Gather Required Information\n\nThe following\
    \ table describes the information needed to successfully install iFolder:\n\n\
    | Configuration Data Required | Description |\n| :--- | :--- |\n| LDAP server\
    \ IP Address or DNS Hostname | The IP address of the LDAP server for iFolder.\
    \ This is where iFolder objects and global settings will be created and configured.\
    \ |\n| LDAP Port | The LDAP port through which users will authenticate to the\
    \ eDirectory server (above) for access to the designated iFolder server (below).\
    \ The default value is 636. |\n| LDAP Admin Name with Context | The fully distinguished\
    \ name of the Admin for the LDAP server specified for iFolder. The name and context\
    \ must be specified using typeful syntax (cn=name,ou=organizational-unit,o=organization).\
    \ This is the context where the iFolder objects are placed and is the context\
    \ used for contextless login. |\n| Admin Password | The password for the LDAP\
    \ server Admin. |\n| iFolder Server IP Address | The IP address or DNS name of\
    \ the server on which you are installing iFolder. iFolder user directories and\
    \ files are stored on the NNLS server. |\n| iFolder admin user names | Additional\
    \ users in the same context as the designated iFolder Admin who should also have\
    \ management access to iFolder. Separate the user names using semi-colons (;).\
    \ |\n| iFolder user data path | The location on the NNLS server where iFolder\
    \ user data file is stored. The default is `/var/opt/novell/ifolderdata`. |\n\n\
    ### Use the NNLS Install Feature\n\nTo install iFolder from NNLS, do the following:\n\
    \n1. Perform the steps to do a custom installation.\n    > If necessary, see Section\
    \ 2 for details on how to perform a custom installation.\n\n2. Deselect the services\
    \ you do not want to install, select the iFolder service, and then continue.\n\
    \n    If eDirectory has not previously been installed, notice that it is selected\
    \ by default when you select iFolder (along with other required components such\
    \ as Apache and Tomcat).\n\n    If eDirectory has been previously installed, the\
    \ install program will indicate which components are already installed.\n\n3.\
    \ Accept the license agreement.\n\n4. (Conditional) If prompted for the location\
    \ of the NICI Foundation Key (NFK) file, insert the license diskette and enter\
    \ the path to the NFK file.\n    > You will only be asked for the NICI Foundation\
    \ Key if eDirectory has not previously been installed.\n\n5. Enter the information\
    \ requested at each prompt (see Table 6-1).\n\n6. View the summary information\
    \ and make any necessary corrections.\n\n7. When all the information is correct,\
    \ finish the installation.\n\n8. View the readme file and save the installation\
    \ settings log file.\n\n## iFolder Objects in the eDirectory Schema\n\nThe iFolder\
    \ installation extends your eDirectory LDAP schema to include the following objects:\n\
    \n- iFolder Server Agent (iFolder_ServerAgent)\n- iFolder Settings object (iFolder_Settings)\n\
    - iFolder User LDAP object (iFolder_ldap01) CN\n- iFolder Server object (iFolder_server01)\n\
    \nThe schema extension and the newly created objects enable your iFolder server\
    \ to run with the LDAP settings you specified during the installation. These settings\
    \ are used as your Global Settings LDAP configuration.\n\nThe iFolder Settings\
    \ object is created only once and it holds all the Global Settings LDAP configuration\
    \ for the iFolder service on your network.\n\niFolder User LDAP objects and iFolder\
    \ Server objects represent each LDAP server and iFolder server, respectively,\
    \ that you have in your network.\n\nSo, for every additional LDAP server and iFolder\
    \ server that you add through the iFolder Management console, a new iFolder User\
    \ LDAP object (iFolder_ldap02, iFolder_ldap03, etc.) and iFolder Server object\
    \ (iFolder_server02, iFolder_server03, etc.) are created.\n\n> All iFolder management\
    \ must be done through the iFolder Management console.\n\n## iFolder File Placement\n\
    \nWhen you install iFolder from NNLS, files are placed in the following folders:\n\
    \n- `/opt/novell/ifolder` (iFolder files)\n- `/opt/novell/httpd/bin/httpd` (Apache\
    \ configuration files)\n- `/opt/novell/ifolder/bin/` (iFolder Apache server modules)\n\
    - `/opt/novell/ifolder/DocumentRoot` (HTML files)\n- `/var/opt/novell/ifolderdata/ACCOUNTS`\
    \ (User data synchronized to iFolder server)\n\n## Exercise 6-1: Confirm the iFolder\
    \ 2.1 Installation on Your NNLS Server\n\n**10 minutes**\n\nIn this exercise,\
    \ you confirm that iFolder is installed on your NNLS server. (iFolder was installed\
    \ in Exercise 2-1.)\n\nDo the following:\n\n1. Check your **DAX-TREE** to make\
    \ sure that the iFolder objects have been created:\n    1. From your NNLS server\
    \ desktop, launch **Mozilla**; then start iManager by entering the following:\n\
    \        `https://DAX.your_container.DigitAirLines.com/nps/iManager`\n    2. Log\
    \ in as **admin** with a password of **novell**.\n    3. At the left under **eDirectory\
    \ Administration**, select **Modify Object**; then select the **Object Selector**\
    \ icon (magnifying glass) on the right.\n    4. Select **Browse**.\n    5. Browse\
    \ to and view the contents of **your container**.\n        You might need to select\
    \ **Next** to view the iFolder objects. You should see the following:\n      \
    \  - iFolder_ServerAgent (this has a user icon)\n        - iFolder_Settings\n\
    \        - iFolder_ldap01\n        - iFolder_server01\n    6. Select **iFolder_Settings**;\
    \ then select **OK**.\n        Note the valued attributes and the unvalued attributes\
    \ that can be added to the Valued Attributes list.\n    7. Select **Cancel**.\n\
    \nIf students inadvertently accessed this object through the iFolder Server Management\
    \ link, they will not be able to open this object.\n"
  mdcn: "\n## 存储配置\n创建一个可从 Linux 服务器访问的存储卷，用于存储 iFolder 帐户的用户数据。\n\n最佳实践是不要将 iFolder\
    \ 数据存储在一 个可能因数据快速增长而影响操作系统正常运行的存储卷上，因为操作系统需要该卷保持足够的空闲空间。\n\n存储解决方案可以包括 Red Hat\
    \ 或 SLES 8 支持的任何卷选项，包括直接附加存储和存储区域网络。\n\nLDAP 服务器和 iFolder 服务器可以位于同一台机器上。\n\n##\
    \ DNS 配置\n请确保计划用作 iFolder 服务器的企业服务器的 DNS 名称和 IP 地址已列在 DNS 服务器上。\n\n## iFolder\
    \ 客户端平台\n请确保将在 iFolder 客户端中使用的 Windows 工作站上已安装 Internet Explorer (IE) 5.0 或更高版本。\n\
    \n## iFolder Java 小程序\n如果用户打算通过 Web 浏览器访问他们的文件，请确保他们使用 Internet Explorer，因为该 Java\
    \ 小程序仅与 Internet Explorer 兼容。\n\n## 防火墙配置\n您可以将 iFolder 服务器放置在防火墙内部（无外部访问）、防火墙外部（ISP\
    \ 模式），或两者兼有（OneNet 模式）。\n\niFolder 需要 HTTP 端口 80（用于文件访问）、HTTPS 端口 443（用于 iFolder\
    \ 管理）以及 LDAP 端口 389 或 636（用于身份验证）。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_26_0.png)\n\
    \n通过防火墙的访问方式可以是防火墙针孔、ICS/iChain® 或第 4 层 (L4) 交换机。\n\n重要的是要注意，iFolder 客户端不会访问 LDAP\
    \ 服务器。iFolder 服务器是 iFolder 中唯一使用 LDAP 服务器进行身份验证的部分。\n\n这意味着，如果用于身份验证的 iFolder\
    \ 服务器和 LDAP 服务器位于防火墙的同一侧，则您不需要打开额外的端口。\n\n## 如何从 NNLS 安装 iFolder\n\n要在 Linux 服务器上安装\
    \ iFolder 2.1，您需要了解以下内容：\n\n- 安装 iFolder 的步骤\n- eDirectory 架构中的 iFolder 对象\n-\
    \ iFolder 文件放置位置\n\n### 安装 iFolder 的步骤\n\n安装 iFolder 的一般步骤如下：\n\n1. 满足 iFolder\
    \ 依赖项\n2. 收集所需信息\n3. 使用 NNLS 安装功能\n\n#### 满足 iFolder 依赖项\n\niFolder 依赖于以下 NNLS\
    \ 组件：\n\n- 同一服务器上的 Apache 2.0.45\n- 网络中任意位置的 eDirectory 8.7.1 或更高版本\n\n如果这些组件尚未安装，您无需在安装\
    \ iFolder 之前先安装它们。\n\n当您选择 iFolder 组件时，NNLS 安装程序将选择所需的组件及其依赖项。它们将在同一进程中一起安装。\n\
    \n有关成功安装尚未安装的 iFolder 依赖项所需的信息，请参阅表 2-5。\n\n### 收集所需信息\n\n下表描述了成功安装 iFolder 所需的信息：\n\
    \n| 所需的配置数据 | 描述 |\n| :--- | :--- |\n| LDAP 服务器 IP 地址或 DNS 主机名 | iFolder 的 LDAP\
    \ 服务器的 IP 地址。这是创建和配置 iFolder 对象和全局设置的地方。 |\n| LDAP 端口 | 用户通过此 LDAP 端口向 eDirectory\
    \ 服务器（上述）进行身份验证，以访问指定的 iFolder 服务器（下述）。默认值为 636。 |\n| 带有上下文的 LDAP 管理员名称 | 为 iFolder\
    \ 指定的 LDAP 服务器管理员的完全限定名称。名称和上下文必须使用类型化语法指定 (cn=名称,ou=组织单元,o=组织)。这是放置 iFolder 对象的上下文，也是用于无上下文登录的上下文。\
    \ |\n| 管理员密码 | LDAP 服务器管理员的密码。 |\n| iFolder 服务器 IP 地址 | 正在安装 iFolder 的服务器 IP 地址或\
    \ DNS 名称。iFolder 用户目录和文件存储在 NNLS 服务器上。 |\n| iFolder 管理用户名称 | 与指定的 iFolder 管理员位于同一上下文中，且应拥有\
    \ iFolder 管理权限的其他用户。使用分号 (;) 分隔用户名称。 |\n| iFolder 用户数据路径 | iFolder 用户数据文件在 NNLS\
    \ 服务器上的存储位置。默认为 `/var/opt/novell/ifolderdata`。 |\n\n### 使用 NNLS 安装功能\n\n要从 NNLS\
    \ 安装 iFolder，请执行以下操作：\n\n1. 执行自定义安装步骤。\n    > 如有必要，请参阅第 2 章了解如何执行自定义安装的详细信息。\n\
    \n2. 取消勾选您不想安装的服务，选择 iFolder 服务，然后继续。\n\n    如果之前未安装 eDirectory，请注意，当您选择 iFolder\
    \ 时，它默认被选中（连同其他必需组件，如 Apache 和 Tomcat）。\n\n    如果之前已安装 eDirectory，安装程序将指示哪些组件已经安装。\n\
    \n3. 接受许可协议。\n\n4. (条件) 如果提示 NICI 基础密钥 (NFK) 文件的位置，请插入许可证软盘并输入 NFK 文件的路径。\n  \
    \  > 只有当 eDirectory 之前未安装时，才会提示输入 NICI 基础密钥。\n\n5. 在每个提示处输入请求的信息（见表 6-1）。\n\n\
    6. 查看摘要信息并进行必要的更正。\n\n7. 当所有信息都正确时，完成安装。\n\n8. 查看 readme 文件并保存安装设置日志文件。\n\n##\
    \ eDirectory 架构中的 iFolder 对象\n\niFolder 安装扩展了您的 eDirectory LDAP 架构，以包括以下对象：\n\n\
    - iFolder 服务器代理 (iFolder_ServerAgent)\n- iFolder 设置对象 (iFolder_Settings)\n- iFolder\
    \ 用户 LDAP 对象 (iFolder_ldap01) CN\n- iFolder 服务器对象 (iFolder_server01)\n\n架构扩展和新创建的对象使您的\
    \ iFolder 服务器能够使用您在安装期间指定的 LDAP 设置运行。这些设置用作您的全局设置 LDAP 配置。\n\niFolder 设置对象仅创建一次，它保存了网络中\
    \ iFolder 服务的所有全局设置 LDAP 配置。\n\niFolder 用户 LDAP 对象和 iFolder 服务器对象分别代表您在网络中的每个\
    \ LDAP 服务器和 iFolder 服务器。\n\n因此，对于通过 iFolder 管理控制台添加的每个额外的 LDAP 服务器和 iFolder 服务器，都会创建一个新的\
    \ iFolder 用户 LDAP 对象 (iFolder_ldap02, iFolder_ldap03, 等) 和 iFolder 服务器对象 (iFolder_server02,\
    \ iFolder_server03, 等)。\n\n> 所有 iFolder 管理操作都必须通过 iFolder 管理控制台进行。\n\n## iFolder\
    \ 文件放置位置\n\n当您从 NNLS 安装 iFolder 时，文件将放置在以下文件夹中：\n\n- `/opt/novell/ifolder` (iFolder\
    \ 文件)\n- `/opt/novell/httpd/bin/httpd` (Apache 配置文件)\n- `/opt/novell/ifolder/bin/`\
    \ (iFolder Apache 服务器模块)\n- `/opt/novell/ifolder/DocumentRoot` (HTML 文件)\n- `/var/opt/novell/ifolderdata/ACCOUNTS`\
    \ (同步到 iFolder 服务器的用户数据)\n\n## 练习 6-1: 在您的 NNLS 服务器上确认 iFolder 2.1 安装\n\n**10\
    \ 分钟**\n\n在本练习中，您确认 iFolder 已安装在您的 NNLS 服务器上。（iFolder 已在练习 2-1 中安装。）\n\n执行以下操作：\n\
    \n1. 检查您的 **DAX-TREE**，以确保 iFolder 对象已创建：\n    1. 从 NNLS 服务器桌面启动 **Mozilla**；然后输入以下内容启动\
    \ iManager：\n        `https://DAX.your_container.DigitAirLines.com/nps/iManager`\n\
    \    2. 使用密码 **novell** 登录为 **admin**。\n    3. 在左侧 **eDirectory 管理** 下，选择 **修改对象**；然后在右侧选择\
    \ **对象选择器** 图标（放大镜）。\n    4. 选择 **浏览**。\n    5. 浏览到 **您的容器** 并查看其内容。\n       \
    \ 您可能需要选择 **下一步** 才能查看 iFolder 对象。您应该看到以下内容：\n        - iFolder_ServerAgent (这有一个用户图标)\n\
    \        - iFolder_Settings\n        - iFolder_ldap01\n        - iFolder_server01\n\
    \    6. 选择 **iFolder_Settings**；然后选择 **确定**。\n        注意可以添加到有值属性列表中的有值属性和无值属性。\n\
    \    7. 选择 **取消**。\n\n如果学生误通过 iFolder 服务器管理链接访问此对象，他们将无法打开此对象。\n"
