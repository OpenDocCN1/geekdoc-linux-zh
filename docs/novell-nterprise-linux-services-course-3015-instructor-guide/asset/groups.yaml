    \ is no Linux version of the iPrint client in NNLS 1.0. The iPrint client for\
    \ this version is Windows only.\n\nThe iPrint client includes the following components:\n\
    \n- Print Provider\n- Browser Plug-In\n- Client Configuration Options\n- Command\
    \ Line Utilities\n\n## Print Provider\n\nThe iPrint print provider communicates\
    \ directly with the Windows Spooler, which takes print jobs from applications\
    \ and delivers them to a print provider.\n\nAt startup, the iPrint client makes\
    \ sure that the iPrint print provider is the first one in the list of providers.\
    \ When a print job is destined for an iPrint printer, the iPrint print provider\
    \ delivers the print job to the iPrint Manager.\n\n## Browser Plug-In\n\nThe iPrint\
    \ client contains a browser plug-in for Internet Explorer. This OCX-based plug-in\
    \ lets you install printers through your Web browser.\n\n## Client Configuration\
    \ Options\n\nThrough the iPrint client configuration screen, you can take advantage\
    \ of several advanced client features, including the following:\n\n- Proxy server\n\
    - Novell iCapture LPT Port Redirector Utility\n- Terminal server setup\n- Password\
    \ management\n\n## Command Line Utilities\n\nThe iPrint MS-DOS® commands let you\
    \ install iPrint printers without a Web browser and capture LPT ports to iPrint\
    \ printers.\n\nThese commands are useful when you have legacy applications that\
    \ require output to an LPT port, or when you want to add printers through a login\
    \ script.\n\n> For additional details, see “Implementing iPrint Using MS-DOS Commands”\
    \ in the *Novell iPrint Administration Guide for Novell Nterprise Linux Services*.\n\
    \n# iPrint Map Designer\n\nThe iPrint Map Designer is a utility that allows you\
    \ to create maps of printer locations by using drag-and-drop technology. After\
    \ the maps are created, they can be posted on a Web server for users to access.\n\
    \nThe map designer can only be accessed from a Windows computer that has the iPrint\
    \ client installed on it.\n\n# Objective 3 Install and Configure iPrint\n\nTo\
    \ install and configure iPrint, you need to know how to do the following:\n\n\
    - Install iPrint on a Linux Server\n- Install the iPrint Client on a Windows Workstation\n\
    - Create and Start a Driver Store\n- Add Printer Drivers to Your Driver Store\n\
    - Create and Start the iPrint Manager\n- Create Your Printer Objects\n- Configure\
    \ Your Network for Workstation and/or User Printers\n- Create Location-Based Printing\
    \ Web Pages\n\n![](img/d63035f3fce0eaaf97203dde900affb7_141_0.png)\n\niPrint runs\
    \ on Apache 2. By default, Apache has Access Logging turned on, which will log\
    \ all printing-related access information. The Access Logging log files are stored\
    \ in `var/opt/novell/httpd/logs`.\n\nThese log files might cause you to run out\
    \ of disk space and, in turn, cause printing to stop. To avoid running out of\
    \ disk space, periodically remove old log files, specify a different disk for\
    \ the log file, or disable Access Logging.\n\nFor more information, see the log\
    \ directives on the Apache Web site at http://httpd.apache.org/docs/logs.html.\n\
    \n# Install iPrint on a Linux Server\n\nTo install iPrint on your Linux server,\
    \ you need to know how to:\n\n- Meet iPrint Dependencies\n- Gather Required Information\n\
    - Use the NNLS Install Feature\n- Locate iPrint Files\n\n## Meet iPrint Dependencies\n\
    \niPrint is dependent on the following NNLS components being installed on the\
    \ same server:\n\n- Apache 2.0.45\n- JVM™\n- Tomcat 4\n- iManager 2.0.2\n- eDirectory\
    \ 8.7.3 (anywhere on the network)\n\nIf these components are not already installed,\
    \ you have to install them when installing iPrint.\n\nThe NNLS install program\
    \ will select the required components, along with their dependencies, when you\
    \ select the iPrint component. They will all be installed in the same process.\n\
    \nSee Table 2-4 for information needed to successfully install any iPrint dependencies\
    \ that are not already installed.\n\n## Gather Required Information\n\nThe following\
    \ table describes the information needed to successfully install iPrint:\n\n|\
    \ Configuration Data Required | Description |\n| :--- | :--- |\n| Admin Name with\
    \ Context | The fully distinguished name of the Admin for the eDirectory server\
    \ specified for iManager. The name and context must be specified using typeful\
    \ syntax `(cn=name.ou=organizational-unit.o=organization)`. |\n| Admin Password\
    \ | The password for the Admin. |\n| iPrint Server IP Address or Hostname | The\
    \ IP address or DNS hostname of the eDirectory server on which iPrint is installed\
    \ and the schema is extended. The server must have a master or read/write replica\
    \ of eDirectory installed. |\n\n## Use the NNLS Install Feature\n\nTo install\
    \ iPrint from NNLS, do the following:\n\n1. Perform the steps to do a custom installation.\n\
    \   If necessary, see Section 2 for details on how to perform a custom installation.\n\
    2. Deselect the services you do not want to install, select the iPrint service,\
    \ and then continue.\n   - If eDirectory has not been installed previously, notice\
    \ that it is selected by default when you select iPrint (along with other required\
    \ components such as Apache and Tomcat).\n   - If eDirectory has been previously\
    \ installed, the install program will indicate which components are already installed.\n\
    3. Accept the license agreement.\n4. (Conditional) If prompted for the location\
    \ of the NICI Foundation Key (NFK) file, enter the path to the NFK file.\n   You\
    \ will only be asked for the NICI Foundation Key if eDirectory has not been installed\
    \ previously.\n5. Enter the information requested at each prompt (see Table 7-1).\n\
    6. View the summary information and make any necessary corrections.\n7. When all\
    \ the information is correct, finish the installation.\n8. View the readme file\
    \ and save the installation settings log file.\n\n   - Before you can uninstall\
    \ iPrint, you need to stop the following processes on the server by entering the\
    \ following commands:\n     - `/etc/init.d/novell-idsd stop`\n     - `/etc/init.d/novell-ipssmd\
    \ stop`\n     - You can then run the uninstall procedure as described in Section\
    \ 2.\n"
  mdcn: "\n# iPrint 管理器简介\n\n单个 iPrint 管理器可以处理多个打印机的打印任务。根据您的网络配置（例如远程位置），您可以在其他服务器上创建额外的\
    \ iPrint 管理器，但在同一台服务器上只能存在一个 iPrint 管理器。\n\n要了解 iPrint 管理器如何工作，您需要了解以下内容：\n\n\
    - 什么是打印代理\n- 什么是 IPP 服务器\n\n## 什么是打印代理\n\n打印代理是 iPrint 管理器数据库中的一个条目，用于表示打印机。当您在\
    \ eDirectory 中创建打印机对象时，打印代理会自动在数据库中创建。\n\n打印代理负责管理打印任务的处理，回答网络客户端关于打印任务或打印机属性的查询，并生成事件通知，以便相关方可以收到关于打印问题和错误或打印任务、文档或打印机状态变化的通知。\n\
    \n## 什么是 IPP 服务器\n\niPrint 使用 IPP，这是一种基于 HTTP 的行业标准打印协议，运行在 TCP/IP 网络上。\n\nIPP\
    \ 提供以下优势：\n\n- 简单的打印协议\n- 广泛的供应商支持\n- 在本地网络和互联网上的功能\n- 打印数据加密（SSL、TLS）\n- 所有平台的标准打印协议（如\
    \ Windows、Macintosh®、UNIX® 和 Linux）\n\nIPP 服务器在 iPrint 中的主要功能是处理来自 Web 服务器的 IPP\
    \ 和 IPXS 请求，并将这些请求传递给 iPrint 管理器或 iPrint 驱动库。\n\n# iPrint 驱动库\n\niPrint 驱动库是打印系统中打印机驱动的存储库。当打印机的第一个用户安装该打印机时，iPrint\
    \ 管理器会从 iPrint 驱动库请求相关的打印机驱动，并将其缓存以供将来使用。\n\n周期性，iPrint 管理器会用相关驱动库中更新的打印机驱动来刷新其缓存的打印机驱动副本。\n\
    \niPrint 驱动库是一个 eDirectory 对象。网络上只需要一个 iPrint 驱动库，但根据您的网络配置，您可以创建额外的 iPrint 驱动库。\n\
    \n运行的驱动库越少越好，因为您不需要跟踪哪个驱动库包含哪些打印机驱动。\n\n# iPrint 客户端\n\niPrint 客户端是一组 DLL，并带有一个小型浏览器插件，允许您使用\
    \ Web 浏览器在 Windows 工作站上安装打印机并下载相应的打印驱动。\n\n当用户选择打印机图标以安装打印机时，iPrint 会检查工作站上是否已安装\
    \ iPrint 客户端。如果未安装 iPrint 客户端，系统会提示用户安装。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_138_0.png)\n\
    \n> NNLS 1.0 中没有 iPrint 客户端的 Linux 版本。此版本的 iPrint 客户端仅适用于 Windows。\n\niPrint 客户端包含以下组件：\n\
    \n- 打印提供程序\n- 浏览器插件\n- 客户端配置选项\n- 命令行实用工具\n\n## 打印提供程序\n\niPrint 打印提供程序直接与 Windows\
    \ Spooler 通信，Windows Spooler 负责从应用程序获取打印任务并将其传递给打印提供程序。\n\n启动时，iPrint 客户端确保 iPrint\
    \ 打印提供程序位于提供程序列表的第一位。当打印任务旨在发送给 iPrint 打印机时，iPrint 打印提供程序会将打印任务传递给 iPrint 管理器。\n\
    \n## 浏览器插件\n\niPrint 客户端包含一个用于 Internet Explorer 的浏览器插件。这个基于 OCX 的插件允许您通过 Web\
    \ 浏览器安装打印机。\n\n## 客户端配置选项\n\n通过 iPrint 客户端配置屏幕，您可以利用几种高级客户端功能，包括以下内容：\n\n- 代理服务器\n\
    - Novell iCapture LPT 端口重定向实用工具\n- 终端服务器设置\n- 密码管理\n\n## 命令行实用工具\n\niPrint MS-DOS®\
    \ 命令允许您在没有 Web 浏览器的情况下安装 iPrint 打印机，并将 LPT 端口捕获到 iPrint 打印机。\n\n当您拥有需要输出到 LPT\
    \ 端口的遗留应用程序，或者希望通过登录脚本添加打印机时，这些命令非常有用。\n\n> 有关更多详细信息，请参阅 *Novell Nterprise Linux\
    \ Services 的 Novell iPrint 管理指南* 中的“使用 MS-DOS 命令实施 iPrint”。\n\n# iPrint 地图设计器\n\
    \niPrint 地图设计器是一种实用工具，允许您使用拖放技术创建打印机位置地图。地图创建完成后，可以发布在 Web 服务器上供用户访问。\n\n只能从安装了\
    \ iPrint 客户端的 Windows 计算机访问地图设计器。\n\n# 目标 3 安装和配置 iPrint\n\n要安装和配置 iPrint，您需要知道如何执行以下操作：\n\
    \n- 在 Linux 服务器上安装 iPrint\n- 在 Windows 工作站上安装 iPrint 客户端\n- 创建并启动驱动库\n- 将打印机驱动添加到您的驱动库\n\
    - 创建并启动 iPrint 管理器\n- 创建您的打印机对象\n- 为工作站和/或用户打印机配置网络\n- 创建基于位置的打印 Web 页面\n\n![](img/d63035f3fce0eaaf97203dde900affb7_141_0.png)\n\
    \niPrint 运行在 Apache 2 上。默认情况下，Apache 已开启访问日志记录功能，这将记录所有与打印相关的访问信息。访问日志文件存储在 `var/opt/novell/httpd/logs`\
    \ 中。\n\n这些日志文件可能会导致您的磁盘空间耗尽，进而导致打印停止。为避免磁盘空间耗尽，请定期删除旧的日志文件、为日志文件指定不同的磁盘或禁用访问日志记录。\n\
    \n有关更多信息，请参阅 Apache 网站 http://httpd.apache.org/docs/logs.html 上的日志指令。\n\n# 在 Linux\
    \ 服务器上安装 iPrint\n\n要在您的 Linux 服务器上安装 iPrint，您需要知道如何：\n\n- 满足 iPrint 依赖项\n- 收集所需信息\n\
    - 使用 NNLS 安装功能\n- 定位 iPrint 文件\n\n## 满足 iPrint 依赖项\n\niPrint 依赖于以下已安装在同一服务器上的\
    \ NNLS 组件：\n\n- Apache 2.0.45\n- JVM™\n- Tomcat 4\n- iManager 2.0.2\n- eDirectory\
    \ 8.7.3（网络上的任意位置）\n\n如果这些组件尚未安装，您在安装 iPrint 时必须先安装它们。\n\nNNLS 安装程序会在您选择 iPrint\
    \ 组件时选择所需的组件及其依赖项。它们将在同一过程中全部安装。\n\n请参阅表 2-4，了解成功安装尚未安装的 iPrint 依赖项所需的信息。\n\n\
    ## 收集所需信息\n\n下表描述了成功安装 iPrint 所需的信息：\n\n| 所需的配置数据 | 描述 |\n| :--- | :--- |\n| 包含上下文的管理员名称\
    \ | 为 iManager 指定的 eDirectory 服务器的管理员的完全限定名称。必须使用带类型的语法 `(cn=name.ou=organizational-unit.o=organization)`\
    \ 指定名称和上下文。 |\n| 管理员密码 | 管理员的密码。 |\n| iPrint 服务器 IP 地址或主机名 | 安装 iPrint 并扩展架构的\
    \ eDirectory 服务器的 IP 地址或 DNS 主机名。该服务器必须安装 eDirectory 的主副本或读写副本。 |\n\n## 使用 NNLS\
    \ 安装功能\n\n要从 NNLS 安装 iPrint，请执行以下操作：\n\n1. 执行自定义安装的步骤。\n   如有必要，请参阅第 2 节了解如何执行自定义安装。\n\
    2. 取消勾选您不想安装的服务，选择 iPrint 服务，然后继续。\n   - 如果之前未安装 eDirectory，请注意当您选择 iPrint 时，它默认已被选中（连同其他必需的组件，如\
    \ Apache 和 Tomcat）。\n   - 如果之前已安装 eDirectory，安装程序将指示哪些组件已安装。\n3. 接受许可协议。\n4. （条件）如果提示输入\
    \ NICI 基础密钥（NFK）文件的位置，请输入 NFK 文件的路径。\n   只有当之前未安装 eDirectory 时，才会要求输入 NICI 基础密钥。\n\
    5. 在每个提示处输入所请求的信息（参见表 7-1）。\n6. 查看摘要信息并进行必要的更正。\n7. 当所有信息都正确时，完成安装。\n8. 查看 readme\
    \ 文件并保存安装设置日志文件。\n\n   - 在卸载 iPrint 之前，您需要通过输入以下命令来停止服务器上的以下进程：\n     - `/etc/init.d/novell-idsd\
    \ stop`\n     - `/etc/init.d/novell-ipssmd stop`\n     - 然后可以按照第 2 节中描述的步骤运行卸载程序。\n\
    \n"
