    # ## Objective 3 Describe the Purpose and Architecture of Samba


    Samba is a software package that implements Microsoft’s SMB/CIFS networking protocols
    on Linux.


    It allows a Linux machine to function as a Windows-compatible file server and
    to act as a client to other Windows servers.


    To describe the purpose and architecture of Samba, you need to know the following:


    +   * What Server Message Block (SMB) Is

    +   * What Common Internet File System (CIFS) Is

    +   * Samba and NNLS


    # ### What Server Message Block (SMB) Is


    Server Message Block (SMB) is a protocol for sharing resources between networked
    computers.


    SMB can be implemented over a number of protocols including TCP/IP, NetBEUI, or
    IPX/SPX.


    > For more information about SMB, see http://www.samba.org/cifs/docs/what-is-smb.html.


    # ### What Common Internet File System (CIFS) Is


    CIFS is an implementation of SMB over native TCP/IP that does not require NetBIOS.'
  - '[PAGE 80]


    CIFS is a client/server protocol and is used by Microsoft Windows operating systems.
    It is also implemented on many other platforms (such as DOS, NetWare, UNIX®, Linux,
    and VMS™).


    The advantages of using CIFS include the following:


    +   - You do not need a Novell client to access files.

    +   - You can use the client for Microsoft networks.

    +   - All Windows operating systems support CIFS (must support IP).

    +   - Most (if not all) applications do support CIFS (using native Windows networking).

    +   - Implementation is available for many other platforms (such as Samba on UNIX/Linux).


    # Samba and NNLS


    Samba is a suite of tools that lets you use Microsoft''s SMB/CIFS networking protocol
    with Linux computers and other platforms.


    With Samba installed, a Linux computer can function as the following:


    +   - **Windows server.** Samba enables a server to provide Windows file and print
    services to users.

    +   - **Windows client.** Samba enables a workstation to access and use Windows
    file and print services, whether they originate on a Windows server or a Linux
    server with Samba installed.


    The Samba distribution installed with NNLS is customized specifically for NNLS
    and focuses on providing authenticated file services from the Linux server to
    users working on Windows client workstations.


    This distribution is configured for the following functionality:'
  - '[PAGE 81]


    +   Samba users are created in eDirectory using Linux User Management (LUM) tools
    included with NNLS.


    +   After you create users, you must specify a Samba password for each user, using
    either iManager or the smbpasswd utility.


    ![](img/d63035f3fce0eaaf97203dde900affb7_81_0.png)


    +   Home directories are automatically created and appropriate file access rights
    are automatically assigned the first time a LUM user logs in to the NNLS server
    from a text-based console.


    +   Access to Samba services requires that users authenticate using secure LDAP
    to the eDirectory server specified during NNLS installation.


    ![](img/d63035f3fce0eaaf97203dde900affb7_81_1.png)


    # **Objective 4   Install and Configure Samba**


    To install and configure Samba, you need to know the following:


    +   Steps for Installing Samba


    +   How to Configure Samba


    +   How to Access Files Through Samba'
  - '[PAGE 82]


    # **Steps for Installing Samba**


    To install Samba on your Linux server, you need to do the following:


    +   - Meet Samba Dependencies

    +   - Gather Required Information

    +   - Use the NNLS Install Feature


    If you are providing Samba file services on the NNLS server to Windows users on
    your network, you must also install Linux User Management (LUM).


    Linux User Management lets you create eDirectory users that can then access the
    NNLS server.


    # **Meet Samba Dependencies**


    Samba is dependent on the following NNLS component:


    +   - eDirectory 8.7.1 or later anywhere within the network


    If this component is not already installed, you do not have to install it before
    installing Samba.


    The NNLS install program will select the required component, along with its dependencies,
    if any, when you select the Samba component. Samba and the component it is dependent
    on will both be installed in the same process.


    See Table 2-5 for required information you need to gather to successfully install
    any Samba dependencies that are not already installed.'
  - '[PAGE 83]


    The following describes the information you need to know before installing Samba:


    # Gather Required Information


    ![](img/d63035f3fce0eaaf97203dde900affb7_83_0.png)


    | Configuration Data Required | Description |

    | eDirectory Server IP Address or DNS Hostname | The IP address or DNS name of
    the server on which you are installing iFolder. The primary IP address of the
    eDirectory server to which Windows users will authenticate using LDAP authentication
    for access to the directories and files on the NNLS server. |

    | Admin Name with Context | The fully distinguished name of the Admin for the
    eDirectory server specified for Samba. The name and context must be specified
    using typeful syntax (cn=name.ou= organizational-unit.o=organization). |

    | Admin Password | The password for the Admin. |

    | LDAP Server IP Address or DNS Hostname | The primary IP address of the eDirectory
    server to which Windows users will authenticate using LDAP authentication for
    access to the directories and files on the NNLS server. |

    | Samba Proxy User Name with Context | The name of the proxy user you want eDirectory
    to configure for Samba. The installation script creates this user object for you.
    |

    | Samba Proxy User Password | The password for the Samba proxy user. |'
