  mdcn: "\n7. 根据用户凭据所在的位置，选择**与虚拟办公目录树同步**或**与虚拟办公目录树不同**。\n\n8. 选择**确定**。\n\n9. 您还可以配置主页精简电子邮件视图。当启用精简电子邮件视图时，用户最近的电子邮件将列在用户的虚拟办公主页上。请执行以下操作：\n\
