    \  - Use **DBUSERS,your container** as the primary group\n+      - *Deselect*\
    \ Samba before you select **OK**.\n+      - Create a home directory for this user\
    \ by pressing **Ctrl+Alt+F2** and logging in at the shell prompt.\n+      - Logout\
    \ and return to the desktop.\n+   \n+   4. View the user's properties by using\
    \ the **Modify Object** link and scroll to the bottom of the **General** drop-down\
    \ menu.\n+   \n+      You should see that there is now a Linux Profile page."
