    # ## Excercise 9-1  Configure and Use Virtual Office


    As network administrator for your Digital Airlines office, you are setting up
    a virtual team using Virtual Office for an operational efficiency research project.


    The team is composed of pilots, ground crew, marketing specialists, customer service
    personnel, and management.


    Do the following:


    +   - Part I: Set Up an Efficiency Project Virtual Team

    +   - Part II: Add a Calendar Event and a Published Favorite

    +   - Part III: Add Users to a Virtual Team

    +   - Part IV: Upload a File for the Team

    +   - Part V: Create a Reminder Message for the Team Meeting


    # **Part I: Set Up an Efficiency Project Virtual Team**


    Do the following:


    +   1. From your NNLS server, access Virtual Office by entering the following
    URL:

    +      `http://DAx.your container.digitalairlines.com/vo`

    +   2. Log in to Virtual Office as **srife** with a password of **novell**.

    +   3. On the left, select **Create Virtual Team**.

    +   4. In the Name field, enter **Efficiency Project**.

    +   5. Select **Create**.

    +   6. When prompted that the team has been created, select **OK**.

    +   7. On the left, select **Efficiency Project**.'
