  - '[PAGE 136]


    A single iPrint Manager can handle print jobs for multiple printers. Depending
    on your network configuration—for example, remote location—you can create additional
    iPrint Managers on other servers, but only one iPrint Manager can exist on the
    same server.


    To understand how the iPrint Manager works, you need to know the following:


    +   • What the Printer Agent Is

    +   • What the IPP Server Is


    # What the Printer Agent Is


    The Printer Agent is an entry in the iPrint Manager database that represents the
    printer. The Printer Agent is automatically created in the database when you create
    a Printer object in eDirectory.


    The Printer Agent manages the processing of print jobs, answers queries from network
    clients about a print job or attributes of a printer, and generates event notification
    so that interested parties can be notified of printing problems and errors or
    changes in the status of a print job, document, or printer.


    # What the IPP Server Is


    iPrint uses IPP, an industry standard HTTP-based printing protocol that runs over
    TCP/IP networks.'
  - '[PAGE 137]


    IPP provides the following benefits:


    +   A simple printing protocol

    +   Broad vendor support

    +   Functionality over local networks and the Internet

    +   Print data encryption (SSL, TLS)

    +   Standard print protocol for all platforms (such as Windows, Macintosh®, UNIX®,
    and Linux)


    The IPP server’s main function in iPrint is to handle IPP and IPXS requests from
    the Web server and deliver the requests to the iPrint Manager or to the iPrint
    Driver Store.


    # iPrint Driver Store


    The iPrint Driver Store is a repository of printer drivers for your print system.
    When the first user of a printer installs that printer, the iPrint Manager requests
    the associated printer driver from the iPrint Driver Store and caches the printer
    driver for future uses.


    Periodically, iPrint Managers refresh their cached copies of printer drivers with
    updated printer drivers from their associated driver store.


    The iPrint Driver Store is an eDirectory object. Only one iPrint Driver Store
    is required on a network but, depending on your network configuration, you can
    create additional iPrint Driver Stores.


    The fewer Driver Stores running the better, because you will not have to track
    which driver store has which printer drivers.'
  - '[PAGE 138]


    # ## iPrint Client


    The iPrint client is a set of DLLs with a small browser plug-in that lets you
    install printers and download the corresponding print drivers to your Windows
    workstation using your Web browser.


    When a user selects the printer icon to install a printer, iPrint checks to see
    if the iPrint client is installed on the workstation. If the iPrint client is
    not installed, the user is prompted to install it.


    ![](img/d63035f3fce0eaaf97203dde900affb7_138_0.png)


    > > There is no Linux version of the iPrint client in NNLS 1.0. The iPrint client
    for this version is Windows only.


    The iPrint client includes the following components:


    +   - Print Provider

    +   - Browser Plug-In

    +   - Client Configuration Options

    +   - Command Line Utilities


    # ## Print Provider


    The iPrint print provider communicates directly with the Windows Spooler, which
    takes print jobs from applications and delivers them to a print provider.


    At startup, the iPrint client makes sure that the iPrint print provider is the
    first one in the list of providers. When a print job is destined for an iPrint
    printer, the iPrint print provider delivers the print job to the iPrint Manager.'
  - '[PAGE 139]


    # **Browser Plug-In**


    The iPrint client contains a browser plug-in for Internet Explorer.

    This OCX-based plug-in lets you install printers through your Web browser.


    # **Client Configuration Options**


    Through the iPrint client configuration screen, you can take

    advantage of several advanced client features, including the

    following:


    +   - Proxy server

    +   - Novell iCapture LPT Port Redirector Utility

    +   - Terminal server setup

    +   - Password management


    # **Command Line Utilities**


    The iPrint MS-DOS® commands let you install iPrint printers

    without a Web browser and capture LPT ports to iPrint printers.


    These commands are useful when you have legacy applications that

    require output to an LPT port, or when you want to add printers

    through a login script.


    > For additional details, see “Implementing iPrint Using MS-DOS

    > Commands” in the *Novell iPrint Administration Guide for Novell Nterprise

    > Linux Services*.'
  - '[PAGE 140]


    # *iPrint Map Designer*


    The iPrint Map Designer is a utility that allows you to create maps of printer
    locations by using drag-and-drop technology. After the maps are created, they
    can be posted on a Web server for users to access.


    The map designer can only be accessed from a Windows computer that has the iPrint
    client installed on it.


    # Objective 3 Install and Configure iPrint


    To install and configure iPrint, you need to know how to do the following:


    +   - Install iPrint on a Linux Server

    +   - Install the iPrint Client on a Windows Workstation

    +   - Create and Start a Driver Store

    +   - Add Printer Drivers to Your Driver Store

    +   - Create and Start the iPrint Manager

    +   - Create Your Printer Objects

    +   - Configure Your Network for Workstation and/or User Printers

    +   - Create Location-Based Printing Web Pages'
  - '[PAGE 141]


    ![](img/d63035f3fce0eaaf97203dde900affb7_141_0.png)


    iPrint runs on Apache 2. By default, Apache has Access Logging turned on, which
    will log all printing-related access information. The Access Logging log files
    are stored in var/opt/novell/httpd/logs.


    These log files might cause you to run out of disk space and, in turn, cause printing
    to stop. To avoid running out of disk space, periodically remove old log files,
    specify a different disk for the log file, or disable Access Logging.


    For more information, see the log directives on the Apache Web site at http://httpd.apache.org/docs/logs.html.


    # Install iPrint on a Linux Server


    To install iPrint on your Linux server, you need to know how to


    +   - Meet iPrint Dependencies

    +   - Gather Required Information

    +   - Use the NNLS Install Feature

    +   - Locate iPrint Files


    # Meet iPrint Dependencies


    iPrint is dependent on the following NNLS components being installed on the same
    server:


    +   - Apache 2.0.45

    +   - JVM™

    +   - Tomcat 4

    +   - iManager 2.0.2

    +   - eDirectory 8.7.3 (anywhere on the network)


    If these components are not already installed, you have to install them when installing
    iPrint.'
  - '[PAGE 142]


    The NNLS install program will select the required components, along with their
    dependencies, when you select the iPrint component. They will all be installed
    in the same process.


    See Table 2-4 for information needed to successfully install any iPrint dependencies
    that are not already installed.


    # Gather Required Information


    The following table describes the information needed to successfully install iPrint:


    | Configuration Data Required | Description |

    | :--- | :--- |

    | Admin Name with Context | The fully distinguished name of the Admin for the
    eDirectory server specified for iManager. | The name and context must be specified
    using typeful syntax `(cn=name.ou=organizational-unit.o=organization)`. |

    | Admin Password | The password for the Admin. |

    | iPrint Server IP Address or Hostname | The IP address or DNS hostname of the
    eDirectory server on which iPrint is installed and the schema is extended. The
    server must have a master or read/write replica of eDirectory installed. |


    # Use the NNLS Install Feature


    To install iPrint from NNLS, do the following:


    +   1. Perform the steps to do a custom installation.'
  - '[PAGE 143]


    +   If necessary, see Section 2 for details on how to perform a custom installation.


    +   2. Deeselect the services you do not want to install, select the iPrint service,
    and then continue.

    +       If eDirectory has not been installed previously, notice that it is selected
    by default when you select iPrint (along with other required components such as
    Apache and Tomcat).

    +       If eDirectory has been previously installed, the install program will
    indicate which components are already installed.


    +   3. Accept the license agreement.


    +   4. (Conditional) If prompted for the location of the NICI Foundation Key (NFK)
    file, enter the path to the NFK file.

    +       You will only be asked for the NICI Foundation Key if eDirectory has not
    been installed previously.


    +   5. Enter the information requested at each prompt (see Table 7-1).


    +   6. View the summary information and make any necessary corrections.


    +   7. When all the information is correct, finish the installation.


    +   8. View the readme file and save the installation settings log file.


    +   Before you can uninstall iPrint, you need to stop the following processes
    on the server by entering the following commands:

    +       /etc/init.d/novell-idsd stop

    +       /etc/init.d/novell-ipssmd stop

    +       You can then run the uninstall procedure as described in Section 2.'
