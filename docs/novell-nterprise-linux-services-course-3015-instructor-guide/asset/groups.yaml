  mdcn: "\n\n当来自不同服务器的两名学生通过同一台工作站访问 Samba 共享时，您将不会遇到映射到其他服务器上的共享的驱动器问题。但是，您将无法从同一服务器映射多个用户的\
    \ home 目录。\n\n例如，您不能保留 SUser 的 home 目录映射，同时继续执行本练习的下一部分。\n\n## 第三部分：将现有 eDirectory\
    \ 用户转换为 LUM 和 Samba 用户\n\n为了探索将现有用户（从 LDIF 文件导入的用户对象）同时转换为 LUM 和 Samba 用户的过程，请执行以下操作：\n\
    \n- 1. 从您的 NNLS 服务器，浏览目录树找到一个您在之前练习中*未使用过的用户*（例如 KHart）；然后在下方空白处记录该用户名：\n- 2.\
    \ 使用 **Modify Object** 链接查看用户属性，并滚动到 **General** 下拉菜单的底部。\n  - 您应该看到没有 Linux 或\
    \ Samba 配置页面。\n- 3. 使用 Linux User Management 下的链接，将*该用户*转换为 LUM 用户。\n  - 使用 **DBUSERS,your\
    \ container** 作为主组\n  - 在选择 **OK** 之前，*取消选中* Samba。\n  - 按 **Ctrl+Alt+F2** 并在\
    \ shell 提示符下登录，为该用户创建 home 目录。\n  - 注销并返回桌面。\n- 4. 使用 **Modify Object** 链接查看用户属性，并滚动到\
    \ **General** 下拉菜单的底部。\n  - 您应该看到现在有一个 Linux Profile 页面。\n- 5. 使用 Linux User Management\
    \ 下的链接，将 LUM 用户转换为 Samba 用户。\n  - 使用 novell 作为密码\n- 6. 使用 Modify Object 链接查看用户属性，并滚动到\
    \ General 下拉菜单的底部。\n  - 您应该看到现在有一个 Linux Profile 页面和一个 Samba Profile 页面。\n- 7.\
    \ 使用 XP 工作站将一个驱动器映射到此用户的 home 目录。\n  - 确保之前映射的驱动器已断开连接。\n\n![](img/d63035f3fce0eaaf97203dde900affb7_100_0.png)\n\
    \n> 如果所有映射的驱动器都已断开，但 Windows 仍返回错误，提示您只能将一个驱动器映射到一个共享，则您可能需要注销 Windows 并重新登录。\n\
    \n## 第四部分：将 /tmp 目录配置为共享目录\n\n通过执行以下操作，允许经过身份验证的用户访问 /tmp 目录以共享文件：\n\n- 1. 打开\
    \ smb.conf 文件进行编辑：\n  - a. 选择 Applications > KDE Menu > System > File Manager\
    \ > Super User Mode。\n  - b. 输入密码 novell；然后选择 OK。\n  - c. 浏览到 /etc/opt/novell/samba。\n\
    \  - d. 右键单击 smb.conf 文件；然后选择 Open With > KWrite。\n- 2. 编辑 smb.conf，使 /tmp 对经过身份验证的用户可用：\n\
    \  - a. 向下滚动到 Share Definitions 部分，找到注释 `#This one is useful for people to share\
    \ files`。\n  - b. 删除 # 号以取消注释以下行：\n\n    ```text\n    [ tmp]\n    comment = Temporary\
    \ file space\n    path = /tmp\n    read only = no\n    public = yes\n    ```\n\
    \n  - c. 选择 **File > Save**；然后选择 **File > Quit**。\n- 3. 重启 Samba 服务：\n  - a. 通过输入\
    \ `/etc/init.d/novell-smb-stop` 停止 Samba 服务。\n  - b. 通过输入 `/etc/init.d/novell-smb-start`\
    \ 启动 Samba 服务。\n- 4. 测试对 /tmp 作为共享目录的访问：\n  - a. 在 XP 工作站上，从 Explorer 菜单栏选择 **Tools\
    \ > Map Network Drive**。\n  - b. 在 Drive 字段中输入 **Y:**（如果您是执行此练习第二部分的学生，请使用驱动器\
    \ **Z:**）。\n  - c. 在 Folder 字段中输入 `\\\\DNS name\\tmp`。\n    如果您的服务器是 DA3，请输入 `\\\
    \\da3.atl.digitalairlines.com\\tmp`。\n  - d. 在选择 Finish 之前，选择 **different user\
    \ name**。\n  - e. 以 **SUser** 身份登录，密码为 **novell**；然后选择 **OK**。\n  - f. 选择 **Finish**。\n\
    \  - g. 您现在应该能看到 /tmp 目录。\n  - h. 将测试文档保存到此目录，并验证它是否能在 Linux 和 XP 工作站上看到。\n\n\
    # 目标 5 描述 NetStorage 的角色和功能\n\nNetStorage 通过浏览器提供基于 Internet 的安全访问，允许访问您网络中 Linux、Windows\
    \ 和 NetWare 服务器上的文件和文件夹。\n\nNetStorage 身份验证依赖于 Novell eDirectory 身份验证来提供安全访问，因此基于\
    \ Internet 的访问与从网络内部访问文件一样安全。\n\n为了描述 NetStorage 的角色和功能，您需要了解以下内容：\n\n- NetStorage\
    \ 的优势\n- NetStorage 的工作原理\n- 用户访问 NetStorage 时看到的内容\n\n（练习结束）\n\n您不必断开映射到 /tmp\
    \ 目录的驱动器，因为其他练习不需要您将驱动器映射到该共享。\n\n如果您选择执行练习 7-1 的可选部分，您会使用映射到 /tmp 目录的驱动器。\n\n\
    ![](img/d63035f3fce0eaaf97203dde900affb7_102_0.png)\n\n## NetStorage 的优势\n\nNovell\
    \ NetStorage 包括以下优势：\n\n- 允许用户在任何具备 Internet 功能的计算机和您网络上的服务器之间安全地复制、移动、重命名、删除、读取和写入文件\n\
    - 消除了使用虚拟专用网络（VPN）客户端访问文件的需要\n- 消除了一台计算机与另一台计算机之间通过电子邮件或复制数据的需求\n- 支持 Internet\
    \ 标准，如 HTTP、HTTPS、HTML、XML 和 WebDAV\n- 支持文件协议，如 CIFS、Samba 和 NFS。\n- 支持访问用户的 Novell\
    \ iFolder 账户\n- 通过 Novell Virtual Office 提供对网络文件和文件夹的访问\n- 支持使用 Storage Location\
    \ 对象，通过 Web 浏览器显示 NetStorage 目录的指定名称\n\n当 NetStorage 安装在安装了 Novell Nterprise Linux\
    \ Services 的一个 Linux 服务器上时，用户 potentially 可以访问您地理分布广泛的网络上的任何 Linux 或 NetWare 服务器。\n\
    \n## NetStorage 的工作原理\n\nNetStorage 安装在一个作为 Middle Tier（也称为 XTier）服务器运行的 Linux\
    \ 服务器上。XTier 是 Novell 的 Web 服务框架，被各种 Novell 产品使用。\n\n请参阅 *NetStorage Administration\
    \ Guide* 中的 \"How NetStorage Works\"，该指南可在 http://www.novell.com/documentation/lg/nnls/index.html\
    \ 获取。\n\nMiddle Tier 服务器的配置信息存储在 Linux 服务器上的 /etc/opt/novell/xtier/xtier_registry.xml\
    \ 文件中。Novell iManager 提供了更改 Middle Tier 配置的便捷方法。\n\n以前版本的 NetStorage 使用 NSAdmin\
    \ 实用工具进行管理。配置现在应通过 Novell iManager 进行。\n\n设置好 Middle Tier 服务器后，它对于用户而言显示为 Internet\
    \ Web 服务器，并可以通过 web 浏览器访问。例如，NNLS 上的 NetStorage 服务可以通过 Virtual Office 访问，或通过以下\
    \ URL 访问：\n\nHTTPS://IP 地址或域名/NetStorage\n\nNetStorage 还包括一个 gadget，提供通过 Novell\
    \ exte:Nd Director 4.1 Standard Edition 的访问。\n\n以下说明了 NetStorage 在该中间层上的工作原理：\n\
    \n### 图 6-16\n\n![](img/d63035f3fce0eaaf97203dde900affb7_104_0.png)\n\nMiddle\
    \ Tier 服务器与网络中的 NetWare 或 Linux 服务器通信，并使用 eDirectory 和用户的用户名和密码提供安全身份验证。\n\n认证后，当用户尝试访问\
    \ Linux 服务器上的 Samba 共享时，NetStorage 还会检查 Samba 配置，以查看用户对该共享的权限。因此，用户必须启用 Samba\
    \ 后才能访问 Samba 共享。\n\nSamba 启用要求的一个显著例外是 NetStorage **shared** 目录，将在本节后面讨论。\n\n\
    NetStorage 还为位于 Novell iFolder 服务器上的文件提供安全访问。\n\n> 用户必须通过 iFolder 服务器启用其 iFolder\
    \ 用户账户，才能使用 NetStorage 访问存储在 iFolder 中的文件。您还必须允许用户在 NetStorage 中设置 iFolder 密码短语。\n\
    \niFolder 2.1 不支持 56 位加密。如果您使用的是 56 位加密，则必须使用 iFolder 1.03。\n\n所有事务也可以使用 SSL 加密以增加安全性。Novell\
    \ iFolder 事务使用 iFolder 加密机制进行保护。\n\n## 用户访问 NetStorage 时看到的内容\n\nNetStorage 默认允许某些访问，而额外的访问可以进行配置并必须满足特定要求。在本主题中，我们将讨论以下内容：\n\
    \n- 默认的 NetStorage 访问\n- 额外配置的 NetStorage 访问\n\n"
