    \ it).\n    \n    The hint in the previous dialog can be used to help you remember\
    \ your pass phrase.\n20. Select (or deselect) **Enable pass phrase recovery**;\
    \ then select **OK**.\n    \n    You are logged in to iFolder.\n    \n    Notice\
    \ the iFolder client icon in the system tray.\n21. Right-click the icon; then\
    \ select **Account Information**.\n    \n    A dialog appears with tabs that let\
    \ you view and set information such as the following:\n    - **iFolder.** The\
    \ folder on your workstation where you keep your iFolder files.\n    - **Server\
    \ Information.** The space still available to you for storing files on the iFolder\
    \ server.\n    - **View Activity.** An active log that displays synchronization\
    \ activity for your iFolder account.\n    - **Preferences.** Allows you to set\
