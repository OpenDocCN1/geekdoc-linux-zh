    6. Select **Close**. A new event appears for your team meeting.\n7. On the left\
    \ under **Efficiency Project**, select **Show team webpage**.\n8. At the right\
    \ of the Team Page heading, select **Edit**.\n9. At the right of Published Favorites,\
    \ select **Edit**. A Current Bookmarks window appears.\n10. Select **Add**.\n\
    11. In the Name field, enter **NNLS**.\n12. In the URL field, enter **http://www.novell.com/products/linux**;\
    \ then select **OK**.\n13. Select **Save**.\n14. Close the window listing the\
    \ bookmark you just added.\n15. On the right under Published Favorites select\
    \ **NNLS**. The NNLS home page appears.\n\n### Part III: Add Users to a Virtual\
    \ Team\n\nYou now need to add the project team to the virtual team.\n\nDo the\
    \ following:\n\n1. On the left under **Team Membership**, select **Invite a user**;\
    \ then on the right select **Add**.\n2. Select **Search**.\n3. Hold down the **Ctrl**\
    \ key and select the following users:\n   - Aaron Gresko\n   - Bruce Richardson\n\
    \   - Bryant Bell\n   - Chris Grayson\n   - Jennifer Elison\n   - Jessica Tracy\n\
    \   - Kurt Fullmer\n4. Select **Add**. The users are added to the Virtual Team:\
    \ Efficiency Project list.\n5. In the upper right corner of the Virtual Office\
