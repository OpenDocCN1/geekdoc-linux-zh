    \n> Use the same basic configuration for your eDirectory driver that you used\
    \ in Section 5.\n\nTo meet this requirement:\n\n- All phone and fax numbers must\
    \ not be synchronized to the partner office tree.\n- **WPUSERS** in both trees\
    \ must contain the same list of members when adding or deleting a member of the\
    \ group.\n- Any modifications to existing user information in your tree must be\
    \ reflected in your partner office tree.\n- The eGuide™ skin selection must be\
    \ modified to reflect your local Digital Airlines office theme (something other\
    \ than the default skin).\n- Make Department a searchable attribute in eGuide.\n\
    - iFolder® must be configured to enforce Recover Passphrase.\n- All employees\
    \ in your Digital Airlines office must be able to access NNLS services to perform\
    \ the following tasks:\n  - Use eGuide to view information about all other employees\
    \ in your Digital Airlines office, and change their own employee information.\n\
    \  - Install and access at least 1 high-volume printer from an iPrint map on their\
    \ Windows XP workstation.\n    - Use the classroom printer as the high-volume\
    \ printer.\n  - Initialize an iFolder account from their Windows XP workstation.\n\
    \  - Map a drive from their Windows XP workstation to their home directory on\
    \ the Linux NNLS server.\n  - Send and receive email through their own NetMail\
    \ account.\n- In addition, you need to provide the following for each department\
    \ in your Digital Airlines office (you can view departments in the user object\
    \ properties):\n  - A team configured in Virtual Office. One member of each team\
    \ must be configured as a team owner, with all other employees in the department\
    \ as team members.\n  - A NetStorage shared folder on the Linux NNLS server for\
    \ the department. Folder access must be limited to department employees only.\n\
    \n*This document should only be used by a Novell-certified instructor.*\n*Copying\
    \ this document is strictly prohibited. To report suspected copying, please call\
    \ 1-800-PIRATES.*\n\n# APPENDIX A\n\n## Directory Fundamentals\n\nTo understand\
    \ the purpose and structure of a Directory, you need to know the following:\n\n\
    - What a Directory Is\n- Challenges That a Directory Service Should Address\n\
    - Common Directory Service Uses\n- Key Components of a Basic Directory\n\n###\
    \ What a Directory Is\n\nA Directory is a database with a compilation of services\
    \ that should provide discovery, security, storage, and relationship management.\n\
    \nA Directory should do the following:\n\n- **Allow disparate systems to be integrated,\
    \ organized, and share common management.** These systems must communicate with\
    \ each other, share information, and channel united services toward meeting the\
    \ objectives of the business.\n- **Enable the network to satisfy the needs of\
    \ the user, organization, and business.** The network must provide unique services\
    \ based on individual needs.\n- **Ensure that trusted relationships are built\
    \ and maintained between people, business, and the intra/internetwork.** The network\
    \ must be capable of emulating all relationships that exist in a business.\n-\
    \ **Provide the coordination between business and network information.** It acts\
    \ as the coordinator of both technical and business procedural information and\
    \ as a regulator of business.\n\n### Challenges That a Directory Service Should\
    \ Address\n\nWith the development of Internet and other networking technology,\
    \ a new set of requirements for management, support, maintenance, and expertise\
    \ must be developed.\n\nAs businesses start using technologies such as the Internet,\
    \ the challenges that a Directory service should address can be classified as:\n\
    \n- Administrative Challenges\n- Business Challenges\n\n### Administrative Challenges\n\
    \nAdministrative challenges include how individuals and companies manage and store\
    \ data, and how an enterprise capable of addressing the dynamic needs of users\
    \ and businesses can be created.\n\nMany system administrators manage their organization’s\
    \ networking infrastructure. This typically involves a single organization structure.\n\
    \nWith evolving technology, a system administrator now becomes responsible for\
    \ managing the following:\n\n- **Single Directory.** The ability of an entire\
    \ organization using multiple servers to manage a single directory.\n- **Multiple\
    \ Directories.** Multiple databases being supported from multiple points of administration.\n\
    - **Meta Directory.** The ability to manage and integrate information stored in\
    \ multiple directories.\n- **Single Identity.** A single identity is 1 directory\
    \ running multiple databases. It allows for the administration and management\
    \ of multiple directories from a single point and provides user access to needed\
    \ resources, while providing security for those resources.\n- **Multiple Identities.**\
    \ Multiple identities are when a single person has accounts in multiple directories.\
    \ An example of this is a business faced with the problem of managing several\
    \ single identities.\n- **Communities.** A group of multiple identities, single\
    \ identities, or directories. The boundaries of a community are dependent upon\
    \ relationships.\n\nThe following details the challenges administrators face:\n\
    \n| Challenge | Goal | Issue |\n| :--- | :--- | :--- |\n| Security | Give information\
    \ to customers and partners via the Internet without additional user IDs and passwords\
    \ and provide methods for encryption and access control. | - Already too many\
    \ authentication and access mechanisms<br>- Web server adds complexity |\n| Policy\
    \ | Obtain technology that provides improved security, easy policy updating, and\
    \ management of customers and partners. | - As individual departments implement\
    \ policy, inability to enforce policy<br>- Causes conflicts |\n"
