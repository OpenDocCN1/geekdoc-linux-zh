    \ many of the Virtual Office services using the Virtual Office home page. To open\
    \ the virtual office home page, open a browser window and enter http://server_IP_or_DNS/vo.<br><br>\
    \ You configure the following services from this location:<br>- Bookmarks<br>-\
    \ Change Password<br>- Public Web Pages<br>- Virtual Teams<br>- Virtual Team Services\
    \ |\n\n## SECTION 10 Prepare for the Novell CLE Practicum\n\nEmphasize that these\
    \ scenarios help students prepare for the NNLS services portion of the practicum.\n\
    \nThe scenarios do not include Linux administrator tasks that might be included\
    \ as part of testing LPI Level 1 certification objectives.\n\nBefore students\
    \ start Scenario 1, you will need to provide them with a clean installation of\
    \ SuSE\\* SLES 8.\n\nIn this section, you work through the following scenarios\
    \ to help you prepare for the CLE practicum:\n\n- Scenario 1: Install NNLS (Required)\n\
    - Scenario 2: Business Requirements Document 1\n- Scenario 3: Business Requirements\
    \ Document 2\n- Scenario 4: Business Requirements Document 3\n\nThe initial scenario\
    \ is required. You can then select one or both of the remaining scenarios (as\
    \ time permits) to configure NNLS products.\n\nScenarios 2, 3, and 4 give you\
    \ a list of business requirements you need to fulfill as network administrator\
    \ for your Digital Airlines office.\n\nWhile some requirements are the same for\
    \ all 3 scenarios, other requirements can change the nature of how you might test\
    \ or configure the NNLS services to meet the same requirements.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_284_0.png)\n\
    \n> In a classroom environment, your instructor will provide a clean installation\
    \ of SuSE\\* SLES 8 before you start Scenario 1.\n\n### Scenario 1: Install NNLS\
    \ (Required)\n\nDigital Airlines is currently using eDirectory™ and other Nterprise™\
    \ services on NetWare® to deliver networking services to customers and employees.\n\
    \nHowever, with the availability of NNLS, the CTO has decided to begin migrating\
    \ several Nterprise services (such as iFolder® and iPrint) to Linux servers.\n\
    \nYou have recently received a document that outlines the business requirements\
    \ for delivering Nterprise services on Linux in your office, along with a timeline\
    \ for migration of these services.\n\nTo meet these requirements and timeline,\
    \ you need to begin creating and testing immediately an NNLS configuration in\
    \ a lab environment that meets the business requirements.\n\nYou decide to start\
    \ with a single Linux server that has NNLS installed.\n\nDo the following:\n\n\
    - Install Mozilla 1.5 and prepare your server for NNLS installation using the\
    \ parameters assigned to you in class (your *container*, **10.0.0.x**, **DAx**).\n\
    \  Follow the same instructions you followed in Sections 1 and 2.\n- Install all\
    \ components of NNLS using the defaults assigned to you in class (*your* **container**,\
    \ **10.0.0.x**, **DAx**).\n  Follow the same instructions you followed in Section\
    \ 2.\n- Import the same LDIF file into your tree that you imported in Section\
    \ 3.\n- Run a Health Check of your eDirectory tree to make sure that there are\
    \ no problems.\n\n### Scenario 2: Business Requirements Document 1\n\nAfter installing\
    \ NNLS 1.0 and importing the LDIF file, you implement and test the following business\
    \ requirements in your lab environment:\n\n- You must be able to subscribe to\
    \ the 3015 channel and install any updates to NNLS. All man pages for all NNLS\
    \ services must be accessible from a shell prompt in a terminal session window.\
    \ You must be able to import and export CSV files to and from eDirectory and back\
    \ up any CSV files in the output directory.\n\n![](img/d63035f3fce0eaaf97203dde900affb7_286_0.png)\n\
    \n> Use the same basic configuration for your Delimited Text driver that you used\
    \ in Section 5.\n\nTo meet this requirement:\n\n- All employees in the sample.csv\
    \ file on your hard drive must be imported into a **tempwork.your container**\
    \ container in your eDirectory tree. All members of the WPU5ERS group in *your\
    \ container* must be exported to a **pilots.csv** file on your hard drive. To\
    \ back up CSV files in the output directory, create a script called **backupcsv**\
    \ that creates a tarball of all CSV files currently in the output directory and\
    \ it to a /tmp/csvbackup directory. Make sure the /tmp/csvbackup directory has\
    \ the same permissions as the /tmp directory. Create a cron job that executes\
    \ the backupcsv script once a week on Friday at 5:00pm.\n"
