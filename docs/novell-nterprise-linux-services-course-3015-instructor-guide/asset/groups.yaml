    # Use the NNLS Install Feature


    To install iFolder from NNLS, do the following:


    +   1. Perform the steps to do a custom installation.


    > If necessary, see Section 2 for details on how to perform a custom installation.


    +   2. Deselect the services you do not want to install, select the iFolder service,
    and then continue.


    If eDirectory has not previously been installed, notice that it is selected by
    default when you select iFolder (along with other required components such as
    Apache and Tomcat).


    If eDirectory has been previously installed, the install program will indicate
