    I-cal 状态消息。由于状态信息采用 I-cal 格式，事件组织者可能无法判断收件人是接受还是拒绝了约会。<br>I-cal 邮件客户端（如 Microsoft
    Outlook* XP）也可为计划好的约会提供自动状态跟踪。<br>如果仅使用符合 I-cal 标准的邮件客户端，可以选择由 NetMail 通过日历代理管理状态跟踪，或由邮件客户端管理状态跟踪。<br>如果使用模块化
    Web 客户端，必须运行日历代理以提供计划好的约会的自动状态跟踪。 |

