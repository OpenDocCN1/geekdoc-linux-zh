    \ eDirectory. |\n| | NetMail can also distribute e-mail and calendaring services\
    \ across multiple servers. This increases performance while preventing critical\
    \ processes from being interrupted by a system failure. |\n\n| Objective | Summary\
    \ |\n| :--- | :--- |\n| **2. Describe NetMail Components** | NetMail is composed\
    \ of the following components:<ul><li>Internet Services Container</li><li>Messaging\
    \ Server</li><li>Parent Objects</li><li>Templates</li><li>List Servers and Mailing\
    \ Lists</li><li>NetMail Agents<ul><li>Address Book Agent</li><li>Alias Agent</li><li>AntiSpam\
    \ Agent</li><li>AntiVirus Agent</li><li>AutoReply Agent</li><li>Calendar Agent</li><li>Connection\
    \ Manager</li><li>IMAP Agent</li><li>List Server Agent</li><li>Modular Web Agent</li><li>NMAP\
    \ Agent</li><li>POP Agent</li><li>Proxy Agent</li><li>SMTP Agent</li><li>WebAdmin</li></ul>During\
    \ a default installation, NetMail files are copied to the /var/opt/novell/netmail\
    \ and /opt/novell/netmail directories.</li></ul> |\n\n| Objective | Summary |\n\
    | :--- | :--- |\n| **3. Describe How NetMail Works** | When NetMail is installed,\
    \ it expands the eDirectory schema to include NetMail-related objects and attributes.<br><br>Existing\
    \ Directory objects, such as Container, User, and even Server objects, take on\
    \ new NetMail attributes.<br><br>The core function of NetMail is message processing.\
    \ Every message entering your messaging system must be processed by NetMail agents.<br><br>Depending\
    \ on which agents you have running on your messaging system, the message might\
    \ be checked against a system blacklist, forwarded to another email address, or\
    \ filtered according to user-defined rules. |\n\n| Objective | Summary |\n| :---\
    \ | :--- |\n| **4. Install NetMail** | NetMail can be configured in 2 ways:<br><ul><li><strong>Single-Server\
    \ Messaging</strong></li><li><strong>Distributed-Server Messaging</strong></li></ul><br>When\
    \ designing your NetMail system, you need to identify the following:<br><ul><li>Which\
    \ servers will host NetMail agents?</li><li>Which agents will be located on a\
    \ given server?</li><li>Which domains will be serviced by each messaging server?</li><li>Does\
    \ your organization need fault tolerance and scalability by deploying the same\
    \ agents on multiple servers?</li></ul><br>To install NetMail, you must meet the\
    \ following system requirements:<br><ul><li>Ensure you're running 1 of the following:<ul><li>Red\
    \ Hat Linux AS 2.1</li><li>Red Hat Linux ES 2.1</li><li>SuSE 8.0</li></ul></li><li>Ensure\
    \ eDirectory 8.7.3 or later for Linux is installed.</li><li>Ensure your system\
    \ CPU is at least a 750 MHz Pentium III or Athlon.</li><li>Ensure you have at\
    \ least 512 MB of system RAM.</li></ul> |\n\n| Objective | Summary |\n| :--- |\
    \ :--- |\n| **4. Install NetMail (continued)** | - Make sure you have 20 MB of\
    \ disk space free for installation.<br>- Each server hosting a NetMail service\
    \ must have a replica.<br>- Make sure the eDirectory tree is synchronized and\
    \ healthy.<br>- Make sure you have Admin rights to the eDirectory tree.<br>- Identify\
    \ a name for the Messaging Server object.<br>- Identify your Internet domain DNS\
    \ server IP address.<br>- Check for duplicate port assignments on your server.\
    \ |\n| **5. Configure and Use NetMail** | WebAdmin is the utility used to configure\
    \ the NetMail system. It is a browser-based utility that is integrated into iManager.<br><br>To\
    \ access WebAdmin directly, open a web browser and enter http://your_server_IP:8018\
    \ or https://your_server_IP:8020.<br><br>The NetMail system services all users\
    \ in the containers configured in the Context property of the NMAP Agent.<br><br>By\
    \ default, 2 templates ship with NetMail:<br>- WebAccess (Webacc.CTP)<br>- WebMail\
    \ (WebMail.CTP) |\n\n## SECTION 9: Unify NNLS Web Access with Virtual Office\n\
    \nIn this section, you learn about the fundamentals of using Virtual Office to\
    \ perform tasks such as creating and managing a team.\n\n### Objectives\n\n- 1.\
    \ Describe Virtual Office\n- 2. Install Virtual Office\n- 3. Configure Virtual\
    \ Office\n\n### Introduction\n\nEmployees in the workplace today are becoming\
    \ more mobile, often telecommuting, working at a branch office, or communicating\
    \ from an Internet kiosk in a public place.\n\nIn this environment, employees\
    \ need access to their email and work files. They might also need to access services\
    \ such as printing, chat, team calendars, and team discussions.\n\nNovell Virtual\
    \ Office helps businesses solve these problems. Through an employee portal, it\
    \ enables personal and group productivity functions along with Internet collaboration\
    \ abilities, as shown in the following:\n\n#### Figure 9-1\n\n![](img/d63035f3fce0eaaf97203dde900affb7_225_0.png)\n\
    \nIn this section, you learn how to install and configure Virtual Office to take\
    \ advantage of NNLS products to make employees more productive while working remotely.\n\
    \n### Objective 1\n\n### Describe Virtual Office\n\nVirtual Office is a web access\
    \ portal that allows remote users to collaborate and share information with a\
    \ workgroup team.\n\nThe following is the default Virtual Office login page:\n\
    \n#### Figure 9-2\n\n![](img/d63035f3fce0eaaf97203dde900affb7_226_0.png)\n\nTo\
    \ describe Virtual Office, you need to understand the following:\n\n- How Virtual\
    \ Office Works\n- Virtual Office Sample Scenarios\n\n### How Virtual Office Works\n\
    \nVirtual Office optimizes the concept of self-service for users by letting them\
    \ set up and manage many of their own networking, information-sharing, and data\
    \ backup processes.\n\nVirtual Office also lets users create their own functional\
    \ teams, called Virtual Teams, for interactive real-time collaboration.\n\nPeople\
    \ who join a virtual team can access shared documents, discussion threads, bookmarks,\
    \ and a team calendar. All members of the team have access to the team information\
    \ and services.\n"
