    10. 选择**确定**。\n\n# IMAP/POP3 服务器配置\n\n若要配置虚拟办公以与远程 IMAP/POP3 邮件服务器配合工作，请执行以下操作：\n\
    \n1. 打开 iManager。\n2. 在 iManager 主页面中，选择**虚拟办公管理 > 服务管理 > 电子邮件**。\n3. 选择**启用**。\n\
    4. 从电子邮件服务器菜单中，选择**IMAP/POP3 服务器**。\n5. 选择**编辑**。\n6. 选择您需要的邮件服务器*类型*（IMAP 或 POP3）。\n\
    7. 指定*入站邮件服务器 DNS 名称*。\n8. 指定*SMTP 服务器 DNS 名称*。\n9. 根据用户凭据所在的位置，选择**与虚拟办公目录树同步**或**与虚拟办公目录树不同**。\n\
    10. 选择**确定**。\n11. 您还可以配置主页精简电子邮件视图。当启用精简电子邮件视图时，用户最近的电子邮件将列在用户的虚拟办公主页上。请执行以下操作：\n\
    \    - 在主页精简电子邮件视图标题的右侧选择**启用**。\n    - 选择**编辑**。\n    - 选择**POP3**或**IMAP**。\n\
    \    - 输入您的入站邮件服务器*DNS 名称*或*IP 地址*。\n    - 输入您的 SMTP 服务器*DNS 名称*或*IP 地址*。\n  \
    \  - 如果用户的凭据与虚拟办公 eDirectory 树使用的凭据相同，请选择**与虚拟办公目录树同步**。\n    - 选择**确定**。\n12.\
    \ 选择**确定**。\n\n# 公共网页\n\n此参数提供虚拟办公公共网页服务的配置选项。要配置此功能，请执行以下操作：\n\n1. 打开 iManager。\n\
    2. 选择**虚拟办公管理 > 服务管理 > 公共网页**。\n\n将显示以下内容：\n\n**图 9-11**\n\n![](img/d63035f3fce0eaaf97203dde900affb7_250_0.png)\n\
    \n3. 如果希望公共网页链接出现在虚拟办公导航栏中，请在公共网页链接的右侧选择**启用**。\n4. 选择**确定**。\n\n# 更改密码\n\n此参数指定是否允许用户更改其\
    \ eDirectory 密码。要配置此功能，请执行以下操作：\n\n1. 打开 iManager。\n2. 选择**虚拟办公管理 > 服务管理 > 更改密码**。\n\
    \n请注意，在此处更改密码会更改 eDirectory 密码。当然，这也会更改所有其他 NNLS 服务的密码。\n\n将显示以下内容：\n\n**图 9-12**\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_251_0.png)\n\n3. 如果希望用户能够更改其虚拟办公密码，请在更改密码链接标题的右侧选择**启用**。\n\
    \    - 如果已启用，更改密码按钮将出现在虚拟办公按钮栏中。如果未启用更改密码，用户将无法更改其虚拟办公密码。\n4. 选择**确定**。\n\n##\
    \ 虚拟办公环境管理\n\n在 iManager 中，您可以配置以下虚拟办公环境参数：\n\n- 团队配置\n- 日志记录\n\n# 团队配置\n\n此参数提供虚拟团队的配置选项。*虚拟团队*是虚拟办公中的一个中心位置，用户可以在其中交换信息、共享文件并维护事件日历。\n\
    \n虚拟办公允许您创建自己的团队并成为其他团队的成员。例如，您可以为一个人力资源组创建一个社区。通过该社区共享的所有信息和文件都可以直接与人资任务相关。\n\
    \n当您创建一个虚拟团队时，您将成为团队的所有者兼团队成员。虚拟团队可以拥有多个所有者。如果您希望授予另一个用户对您团队的管理权限，您必须使该用户成为所有者。\n\
    \n所有者拥有平等的权利。所有者可以将其他所有者从社区中移除——甚至包括创建该社区的个人。所有团队都显示在虚拟团队列表中，但仅团队成员可以访问这些团队。\n\
    \n要配置团队，请执行以下操作：\n\n1. 打开 iManager。\n2. 选择**虚拟办公管理 > 环境管理 > 团队配置**。\n\n将显示以下内容：\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_253_0.png)\n\n输入以下设置：\n\n- **启用团队创建**：选择**开**以允许用户创建团队。此设置默认开启。\n\
    - **团队文件共享**：指定文件共享位置的*路径*。\n- **SMTP 地址**：指定电子邮件通知的地址。\n- **聊天服务器 IP 端口**：指定小程序到服务器通信的端口。\n\
    - **管理团队访问**：此选项允许您拒绝用户创建虚拟团队的能力。选择**编辑 > 搜索**，搜索并选择一个*用户*，然后选择**选择**。\n\n选择**保存**。\n\
    \n# 日志记录\n\n此参数确定记录在虚拟办公日志中的信息量。这些设置仅对当前的门户服务器有效。它们不会保存到 PortalServlet.properties\
    \ 文件中。\n\n要配置此参数，请执行以下操作：\n\n1. 打开 iManager。\n2. 选择**虚拟办公管理 > 环境管理 > 日志记录**。\n\
    \n将显示以下内容：\n\n![](img/d63035f3fce0eaaf97203dde900affb7_254_0.png)\n\n3. 配置以下设置：\n\
    \    - **日志记录**：选中日志记录旁边的复选框以启用日志记录。\n    - **日志级别**：指定日志中包含的信息量：\n        - **高**：记录特定信息。\n\
    \        - **中**：记录特定信息和一些通用消息。\n        - **低**：记录所有消息。\n    - **日志记录模块**：列出包含在日志记录中的模块。如果该字段为空，则日志记录包括所有模块。\n\
    \    - **记录到标准错误**：启用记录到标准错误。\n    - **记录到标准输出**：启用记录到标准输出。\n    - **记录到文件**：将日志报告发送到\
    \ /var/opt/novell/iManager/nps/WEB-INF/debug.xml 文件。选择**查看全部**以查看该文件中的消息。选择**清除全部**以清除文件。\n\
    4. 选择**确定**。\n\n# 在虚拟办公主页上管理虚拟办公\n\n您可以使用虚拟办公主页配置许多虚拟办公服务以满足您的需求。要打开虚拟办公主页，请打开浏览器窗口并输入\
    \ `http://server_IP_or_DNS/vo`。\n\n"
