  md: '# **APPENDIX A**


    # Directory Fundamentals


    To understand the purpose and structure of a Directory, you need to know the following:


    +   - What a Directory Is

    +   - Challenges That a Directory Service Should Address

    +   - Common Directory Service Uses

    +   - Key Components of a Basic Directory


    # *What a Directory Is*


    A Directory is a database with a compilation of services that should provide discovery,
    security, storage, and relationship management.


    A Directory should do the following:


    +   - **Allow disparate systems to be integrated, organized, and share common
    management.** These systems must communicate with each other, share information,
    and channel united services toward meeting the objectives of the business.

    +   - **Enable the network to satisfy the needs of the user, organization, and
    business.** The network must provide unique services based on individual needs.

    +   - **Ensure that trusted relationships are built and maintained between people,
    business, and the intra/internetwork.** The network must be capable of emulating
    all relationships that exist in a business.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '+   - **Provide the coordination between business and network information.**
    It acts as the coordinator of both technical and business procedural information
    and as a regulator of business.


    # *Challenges That a Directory Service Should Address*


    With the development of Internet and other networking technology, a new set of
    requirements for management, support, maintenance, and expertise must be developed.


    As businesses start using technologies such as the Internet, the challenges that
    a Directory service should address can be classified as


    +   - Administrative Challenges

    +   - Business Challenges


    # Administrative Challenges


    Administrative challenges include how individuals and companies manage and store
    data, and how an enterprise capable of addressing the dynamic needs of users and
    businesses can be created.


    Many system administrators manage their organization’s networking infrastructure.
    This typically involves a single organization structure.


    With evolving technology, a system administrator now becomes responsible for managing
    the following:


    +   - **Single Directory.** The ability of an entire organization using multiple
    servers to manage a single directory.

    +   - **Multiple Directories.** Multiple databases being supported from multiple
    points of administration.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '+   Meta Directory. The ability to manage and integrate information stored
    in multiple directories.


    +   Single Identity. A single identity is 1 directory running multiple databases.
    It allows for the administration and management of multiple directories from a
    single point and provides user access to needed resources, while providing security
    for those resources.


    +   Multiple Identities. Multiple identities are when a single person has accounts
    in multiple directories. An example of this is a business faced with the problem
    of managing several single identities.


    +   Communities. A group of multiple identities, single identities, or directories.
    The boundaries of a community are dependent upon relationships.


    The following details the challenges administrators face:


    | Challenge | Goal | Issue |

    | :--- | :--- | :--- |

    | Security | Give information to customers and partners via the Internet without
    additional user IDs and passwords and provide methods for encryption and access
    control. | ■ Already too many authentication and access mechanisms<br>■ Web server
    adds complexity |


    | Policy | Obtain technology that provides improved security, easy policy updating,
    and management of customers and partners. | ■ As individual departments implement
    policy, inability to enforce policy<br>■ Causes conflicts |'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# **Table A-1** *(continued)*


    | Challenge | Goal | Issue |

    | --- | --- | --- |

    | Quality of service | Ensure access to proper applications for employees and
    customers. | • Lack of common rules language prevents system from recognizing
    specific responses |

    | Administration | Designate a common supplier for departmental and Web servers.
    | • More platforms means high administration and management costs |

    | | | • Might need different departmental and Web servers |

    | Personalization | Integrate customer profiles with order entry applications
    so that previous orders and parts are logged. | • No corporate standards for data
    retention |

    | | | • Information is used differently for different departments |


    Managing these challenges can be time consuming, cumbersome, and difficult.


    # ## Business Challenges


    Businesses face additional challenges in the effort to use technology successfully
    and efficiently.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Table A-2


    The following describes these challenges:


    | Business Challenges | Directory Solutions |

    |:--------------------|:--------------------|

    | **Disparate systems.** Today, businesses face the challenge of disparate systems
    and various operating systems.<br><br>Also, as companies merge and organizations
    change to fit the needs of a demanding marketplace, disparate systems are created.
    | Eliminates redundancy |

    | **Online orders.** E-commerce is challenging the methods in which companies
    identify their marketplace and relate with consumers. | Provides the structure
    for e-commerce |

    | **On-demand communication.** Organizations require access to employees, customers,
    and partners in a timely and effective manner. | Provides email solutions |

    | **Customer contact.** Businesses need to create and maintain databases of customers,
    inventories, and other critical data. | Stores employee and customer contact lists
    |

    | **File storage.** The storage and backup of critical data must be addressed.
    | Provides logical pointers to company data and resources |

    | **Security.** Businesses must be protected within the intranet and from the
    Internet. In addition, there must be a secure method for consumers and businesses
