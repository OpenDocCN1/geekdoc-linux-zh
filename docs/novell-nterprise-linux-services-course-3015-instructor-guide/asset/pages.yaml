- pgno: 252
  md: '# Team Configuration


    This parameter provides configuration options for the Virtual Teams. A *virtual
    team* is a central location in Virtual Office where users can exchange information,
    share files, and maintain a calendar of events.


    Virtual Office lets you create your own teams and become members of other teams.
    For example, you might create a community for a Human Resources group. All information
    and files shared through that community can be directly related to human resource
    tasks.


    When you create a virtual team, you become both the team owner and a team member.
    Virtual teams can have multiple owners. If you want to grant another user administration
    rights to your team, you must make that user an owner.


    Owners have equal rights. An owner can remove other owners from the community—even
    the individual who created it. All teams are visible in the Virtual Teams list,
    but access to these teams is available only to team members.


    To configure teams, do the following:


    +   1. Open iManager.

    +   2. Select **Virtual Office Management > Environment Administration > Team
    Configuration**.'
  merge: -1
  img_proc: true
- pgno: 253
  md: "The following appears:\n\n![](img/d63035f3fce0eaaf97203dde900affb7_253_0.png)\n\
    \n+   Enter the following settings:\n+   \n+   - **Enable Team Creation**: Select\
    \ **On** to let users create teams.  \n+   This setting is turned on by default.\n\
    +   - **Team File Share**: Specify the *path* to the file-sharing location.\n\
    +   - **SMTP Address**: Specify the address for e-mail notifications.\n+   - **Chat\
    \ Server IP Port**: Specify the port for applet-to-server communication.\n+  \
    \ - **Manage Team Access**: This option lets you deny a user the ability to create\
    \ a virtual team. Select **Edit > Search**, search for and select a *user*, and\
    \ then select **Select**.\n\n+   Select **Save**."
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Logging


    This parameter determines the amount of information that is recorded in Virtual
    office logs. These settings are only effective on the current portal server. They
    are not saved to the PortalServlet.properties file.


    To configure this parameter, do the following:


    +   1. Open iManager.

    +   2. Select Virtual Office Management > Environment Administration > Logging.


    The following appears:


    ![](img/d63035f3fce0eaaf97203dde900affb7_254_0.png)'
  merge: -1
  img_proc: true
- pgno: 255
  md: "+   3. Configure the following settings:\n+   \n+   * **Logging**: Select the\
    \ box next to Logging to enable logging.\n+   * **Logging Level**: Specifies the\
    \ amount of information to include in logs:\n+   \n+     * **High**: Logs specific\
    \ information.\n+     * **Medium**: Logs specific and some general messages.\n\
    +     * **Low**: Logs all messages.\n+   * **Logging Modules**: Lists the modules\
    \ that are included in the logging. If the field is blank, the logging includes\
    \ all modules.\n+   * **Logging to Standard Error**: Enables logging to standard\
    \ error.\n+   * **Logging to Standard Out**: Enables logging to standard out.\n\
    +   * **Logging to File**: Sends the logging report to the /var/opt/novell/iManager/nps/WEB-INF/debug.xml\
    \ file. Select View All to view the messages in that file. Select Clear All to\
    \ clear the file.\n+   4. Select **OK**.\n\n# Managing Virtual Office in the Virtual\
    \ Office Home Page\n\nYou can configure many of the Virtual Office services to\
    \ meet your requirements using the Virtual Office home page. To open the virtual\
    \ office home page, open a browser window and enter `http://server_IP_or_DNS/vo`."
  merge: -1
  img_proc: true
