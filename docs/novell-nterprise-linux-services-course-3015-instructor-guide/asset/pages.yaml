- pgno: 285
  md: "# **Scenario 1: Install NNLS (Required)**\n\nDigital Airlines is currently\
    \ using eDirectory™ and other Nterprise™ services on NetWare® to deliver networking\
    \ services to customers and employees.\n\nHowever, with the availability of NNLS,\
    \ the CTO has decided to begin migrating several Nterprise services (such as iFolder®\
    \ and iPrint) to Linux servers.\n\nYou have recently received a document that\
    \ outlines the business requirements for delivering Nterprise services on Linux\
    \ in your office, along with a timeline for migration of these services.\n\nTo\
    \ meet these requirements and timeline, you need to begin creating and testing\
    \ immediately an NNLS configuration in a lab environment that meets the business\
    \ requirements.\n\nYou decide to start with a single Linux server that has NNLS\
    \ installed.\n\nDo the following:\n\n+   - Install Mozilla 1.5 and prepare your\
    \ server for NNLS installation using the parameters assigned to you in class (your\
    \ *container*, **10.0.0.x**, **DAx**).\n+   \tFollow the same instructions you\
    \ followed in Sections 1 and 2.\n+   - Install all components of NNLS using the\
    \ defaults assigned to you in class (*your* **container**, **10.0.0.x**, **DAx**).\n\
    +   \tFollow the same instructions you followed in Section 2.\n+   - Import the\
    \ same LDIF file into your tree that you imported in Section 3.\n+   - Run a Health\
    \ Check of your eDirectory tree to make sure that there are no problems."
  merge: -1
  img_proc: true
- pgno: 286
  md: '# ## Scenario 2: Business Requirements Document 1


    After installing NNLS 1.0 and importing the LDIF file, you implement and test
    the following business requirements in your lab environment:


    +    You must be able to subscribe to the 3015 channel and install  any updates
    to NNLS.  All man pages for all NNLS services must be accessible from a shell
    prompt in a terminal session window.  You must be able to import and export CSV
    files to and from  eDirectory and back up any CSV files in the output directory.


    ![](img/d63035f3fce0eaaf97203dde900affb7_286_0.png)


    > Use the same basic configuration for your Delimited Text driver that you used
    in Section 5.


    To meet this requirement


    +    All employees in the sample.csv file on your hard drive  must be imported
    into a **tempwork.your container**  container in your eDirectory tree.  All members
    of the WPU5ERS group in *your container*  must be exported to a **pilots.csv**
    file on your hard drive.  To back up CSV files in the output directory, create
    a script  called **backupcsv** that creates a tarball of all CSV files  currently
    in the output directory and it to a  /tmp/csvbackup directory.  Make sure the
    /tmp/csvbackup directory has the same  permissions as the /tmp directory.  Create
    a cron job that executes the backupcsv script once a  week on Friday at 5:00pm.'
  merge: -1
  img_proc: true
