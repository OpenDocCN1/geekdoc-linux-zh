- pgno: 54
  md: 'To recover a user’s pass phrase, do the following:


    +   1. In the iFolder Management console, select **User Management**.

    +   2. Search for the appropriate user; then select *username*.

    +   3. Scroll down to the bottom of the list; then select **Recover**.

    +   4. Enter your security pass phrase; then select **OK**.

    +   5. When the pass phrase appears, let the user know what it is.


    # ## Change a User Pass Phrase


    When users install the iFolder client the first time, they are asked to authenticate
    to the iFolder server. They are then asked if they would like to encrypt their
    data.


    If they choose to encrypt their data, iFolder then prompts for a pass phrase.
    This pass phrase becomes a part of the key that is used to encrypt the data when
    it is transmitted to the iFolder server.


    If a user wants to change a pass phrase because he or she has forgotten the pass
    phrase, you can recover the pass phrase using the iFolder Management console.


    However, if the user wants to change to a new pass phrase (for security reasons)
    and the user does not have the data locally, make sure the user understands that
    the only way to change the pass phrase is to delete the data from the iFolder
    server and have the iFolder client encrypt the data and send it up to the server
    again.


    > If the user does not have the data stored locally, have the user synchronize
    the data to the local hard drive; then proceed with the process to change the
    pass phrase.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Do the following:


    +   In the iFolder Management console, find and select the user account to display
    the user’s information.


    +   Look at the Number of Connections line. If this line does not show “0,” you
    must have the user log out of his or her iFolder client.


    +   Look at the Disk Quota setting and the Used Space value. If either of these
    values is above 100 MB, you will need to adjust the Disk Quota value later (step
    8).


    +   Confirm that the user has a sufficiently fast connection to facilitate the
    upload of the data after you remove the account. You probably don’t want to do
    this over a dial-up connection.


    +   Confirm that the user has his data on his local disk. This is very important
    because you are about to delete the data from the server.


    +   Select the Remove User button; then confirm deletion by selecting Yes. The
    user account has now been removed from the server. All of the user’s data has
    also been deleted from the server.


    +   Have the user right-click on the iFolder client icon (in the system tray)
    and select Login. The user will be prompted to choose encryption again and asked
    for a new pass phrase. After the user has chosen a new pass phrase, the iFolder
    client logs the user in and creates a new account with the default Disk Quota
    space.


    +   Go to the user’s account and adjust the Disk Quota with the value from step
    3. The user’s data should begin to sync back up to the server.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'The user might receive an error message saying that there isn’t enough disk
