- pgno: 148
  md: '![](img/d63035f3fce0eaaf97203dde900affb7_148_0.png)


    All print data is non-secure between the server and the printer because iPrint
    sends its data from the server to the printer via LPR (Line Printer Remote). LPR
    does not handle authentication or security and, therefore, is clear text.


    +   6. (Optional) Enter information describing the location of the printer.


    +   7. (Optional) Enter a description of the printer.


    +   8. Select Next.


    +   9. Select the default print drivers to install for each Windows platform.


    +   10. Select Next.


    +   11. (Optional) To create additional Printer objects, select Repeat Task and
    repeat all the above steps to create a Printer object.


    +   12. Select OK.


    # *Configure Your Network for Workstation and/or User Printers*


    Before you configure your network for workstation and/or user printers, you need
    to understand what each of them is:


    +   - **Workstation Printer.** This is an installed printer on a Windows NT/2000/XP
    machine that is available to anyone who is logged on to that Windows machine.

    +   Workstation printers can be created on Windows NT/2000/XP machines only by
    users who have Administrator or Power User rights.


    +   - **User Printer.** This is an installed printer that is available only to
    the person who installed it on a Windows NT/2000/XP machine.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "User printers can be created by any user in your network.\n\nTo determine which\
    \ kinds of printers are created on your network, do the following:\n\n+   1. Browse\
    \ to the ippint.ini file located in the /var/opt/novell/httpd/htdocs/ippdocs folder\
    \ on your Linux server.\n+   \n+   2. Right-click the ippint.ini file; then select\
    \ Open With > gedit.\n+   \n+   3. Configure the AllowUserPrinters value to one\
    \ of the following:\n+      - 0 (the default) means that only users with sufficient\
    \ rights (Administrator rights or Power User rights) can install a printer to\
    \ the desktop. When a printer is installed to the desktop, it will be a Workstation\
    \ printer.\n+      - 1 means that if the current user doesn't have rights to add\
    \ it as a Workstation printer, it will be added as a User printer.\n+      - 2\
    \ means that all printers added, regardless of the user's rights, will be User\
    \ printers.\n+   \n+   4. When you finish, select Save.\n+   \n+   5. Select Exit.\n\
    \n![](img/d63035f3fce0eaaf97203dde900affb7_149_0.png)\n\nWindows 9x ignores these\
    \ values and only creates Workstation printers.\n\n# Create Location-Based Printing\
    \ Web Pages\n\nLocation-based printing lets users select printers based on location\
    \ by using one of the following:\n\n+   - List View\n+   \n+   - Maps"
  merge: -1
  img_proc: true
- pgno: 150
  md: '# List View


    The **iPrint Manager** creates a list of your printers at the default iPrint page
    (`http://server_IP_address/ipp`).


    To create a custom web page with your own list, you must use an HTML editor and
    create links to the printer’s URL.


    To view a printer’s URL, do the following:


    +   1. In **iManager** under **iPrint**, select **Manage Printer**.

    +   2. In the **iPrint Printer name** field, browse to and select the printer
    you want.

    +   3. Select **OK**.

    +   4. Select **Client Support > iPrint Support**.


    The printer’s URL is displayed under **Accepted IPP URL**.


    # Maps


    You can create maps with printer icons representing the location of your printers
    within your workplace environment. This enables your users to easily select which
    printer they want to print from, and download the correct driver for that printer.


    Novell has created an iPrint Map Designer tool that utilizes drag-and-drop technology
    to aid you in creating your own location-based maps.


    To create and configure a location-based map using the iPrint Map Designer, you
    must have the following:


    +   - Internet Explorer 5.5 or later

    +   - Windows 95/98/Me or Windows NT/2000/XP

    +   - iPrint client installed on the workstation

    +   - Maps to place printers in'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'The folder listed in step 1 contains  2 sample maps for your use.


    You can create your own maps using any graphic tool (supported formats are GIF,
    JPG, and BMP). Two sample maps can be found on the iPrint server in the /var/opt/novell/httpd/htdocs/ippdocs/images/maps
    folder.


    To configure a map to support location-based printing, do the following:


    +   1. Copy all your *background images* (maps) to the **/var/opt/novell/httpd/htdocs/ippdocs/images/maps**
    directory on your Linux server.

    +      File types that can be used for background images are JPG, GIF, and BMP.


    +   2. In a web browser on your Windows workstation, open **http://**_server_IP_address_**/ippdocs/maptool.htm.**

    +      The iPrint Map Designer tool home page appears.


    +   3. At the bottom of the left frame, select a **Background** image.

    +      The drop-down box displays the list of images stored in the /var/opt/novell/httpd/htdocs/ippdocs/images/maps
    folder on your Linux iPrint server.


    +   4. In the Printer icon field, select a *printer icon* that best represents
    your printer.


    +   5. Drag the *printer icon* to the correct area on the displayed map.'
