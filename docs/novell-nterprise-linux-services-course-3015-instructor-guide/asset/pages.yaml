- pgno: 221
  md: '# **Objective**


    # **Summary**


    **3. Describe How NetMail Works**


    When NetMail is installed, it expands the eDirectory schema to include NetMail-related
    objects and attributes.


    Existing Directory objects, such as Container, User, and even Server objects,
    take on new NetMail attributes.


    The core function of NetMail is message processing. Every message entering your
    messaging system must be processed by NetMail agents.


    Depending on which agents you have running on your messaging system, the message
    might be checked against a system blacklist, forwarded to another email address,
    or filtered according to user-defined rules.'
  merge: -1
  img_proc: true
