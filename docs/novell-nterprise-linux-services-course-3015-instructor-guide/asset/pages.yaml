- pgno: 224
  md: '# ## SECTION 9

    ## Unify NNLS Web Access with Virtual Office


    In this section, you learn about the fundamentals of using Virtual Office to perform
    tasks such as creating and managing a team.


    # ## Objectives


    +   1. Describe Virtual Office

    +   2. Install Virtual Office

    +   3. Configure Virtual Office


    # ## Introduction


    Employees in the workplace today are becoming more mobile, often telecommuting,
    working at a branch office, or communicating from an Internet kiosk in a public
    place.


    In this environment, employees need access to their email and work files. They
    might also need to access services such as printing, chat, team calendars, and
    team discussions.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Novell Virtual Office helps businesses solve these problems. Through an employee
    portal, it enables personal and group productivity functions along with Internet
    collaboration abilities, as shown in the following:


    # Figure 9-1


    ![](img/d63035f3fce0eaaf97203dde900affb7_225_0.png)


    In this section, you learn how to install and configure Virtual Office to take
    advantage of NNLS products to make employees more productive while working remotely.


    # Objective 1


    # Describe Virtual Office


    Virtual Office is a web access portal that allows remote users to collaborate
    and share information with a workgroup team.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'The following is the default Virtual Office login page:


    # Figure 9-2


    ![](img/d63035f3fce0eaaf97203dde900affb7_226_0.png)


    To describe Virtual Office, you need to understand the following:


    +   - How Virtual Office Works


    +   - Virtual Office Sample Scenarios


    # How Virtual Office Works


    Virtual Office optimizes the concept of self-service for users by letting them
    set up and manage many of their own networking, information-sharing, and data
    backup processes.


    Virtual Office also lets users create their own functional teams, called Virtual
    Teams, for interactive real-time collaboration.


    People who join a virtual team can access shared documents, discussion threads,
    bookmarks, and a team calendar. All members of the team have access to the team
    information and services.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'With Virtual Office, users can


    +   Locate and set up printers


    +   Set up and maintain passwords


    +   Back up information


    +   Communicate in real time with other users and groups


    +   Publish a personal Web page to provide information to other users


    +   Access important information from any location using any web-enabled device


    +   Bookmark Web pages


    Virtual Office provides access to the following products:


    # Figure 9-3


    ![](img/d63035f3fce0eaaf97203dde900affb7_227_0.png)


    These products provide services that give a team leader administrative capabilities
    and team members the ability to effectively communicate and complete a project
    from a central location.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# **Virtual Office Sample Scenarios**


    The following sample implementation scenarios demonstrate how Virtual Office provides
    a web-based solution for team collaboration:


    +   - Virtual Office Scenario 1: Team Collaboration


    +   - Virtual Office Scenario 2: Individual Access


    # **Virtual Office Scenario 1: Team Collaboration**


    Four employees need to collaborate on a project. They all need immediate access
    to the same files and they need to correspond frequently. Two of the employees
    are in one office and the other two reside in other locations.


    Virtual Office can be used to manage the project. Initially, the project lead
    creates a virtual team so all team members can do the following regardless of
    their location:


    +   - Chat in real time.


    +   - Use Novell® NetStorage for immediate access to stored files.


    +   - Use file sharing to upload or retrieve files.


    +   - Create a Web page to post messages and other important information for all
    team members.


    +   - Create bookmarks for immediate access to Web resources.


    # **Virtual Office Scenario 2: Individual Access**


    An employee on her way to a meeting discovers that the battery in her laptop is
    drained and does not have time to retrieve a charger. Still, she needs to access
    some of her files, print copies of the agenda, and look at her calendar.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'After arriving at the meeting, she borrows a laptop and uses Virtual Office
    to accomplish the following:


    +   *   Access her stored files through Novell NetStorage

    +   *   Locate a printer using iPrint and print the agenda for the meeting

    +   *   Review her email for any important messages

    +   *   Use the calendar to review a schedule of events

    +   *   Use eGuide to locate a person who is not at the meeting

    +   *   Set up a chat session with someone who is not at the meeting


    # **Objective 2**


    # **Install Virtual Office**


    You can install Virtual Office as an optional component when you install Novell®
    Nterprise™ Linux® Services (NNLS). When you select Virtual Office, the NNLS installation
    script installs all the components needed on your server.


    To install Virtual Office on your Linux server, you need to know how to


    +   *   Meet Virtual Office Dependencies

    +   *   Gather Required Information

    +   *   Use the NNLS Install Feature

    +   *   Locate Virtual Office Files'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Meet Virtual Office Dependencies


    Because the Virtual Office main page provides web access to other products installed
    with NNLS, you need to select the following products during installation if you
    want to access them from Virtual Office:


    +   - eGuide™

    +   - iFolder™

    +   - iPrint

    +   - NetMail™


    The Virtual Office main page displays only shortcut buttons for the products you
    select.


    The NNLS install program selects any required components, along with their dependencies,
    when you select the Virtual Office component. They will all be installed in the
    same process.


    These components include the following:


    +   - Apache 2.0.45 on the same NNLS server

    +   - JVM® 1.4.1_02 on the same NNLS server

    +   - Tomcat 4.1.24 on the same NNLS server

    +   - eDirectory 8.7.1 or later anywhere within the network

    +   - iManager 2.0


    See Table 2-4 for information needed to successfully install any Virtual Office
    dependencies that are not already installed.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '**Gather Required Information**


    The following table describes the information needed to successfully install Virtual
    Office:


    | Table 9-1 | Configuration Data Required | Description |

    | :--- | :--- | :--- |

    | | eDirectory Server IP Address or Hostname | The IP address or DNS name of the
    eDirectory server on which Virtual Office is installed.<br><br>This server must
    have a master or read/write replica of eDirectory installed. |

    | | Admin Name with Context | The fully distinguished name of the Admin for the
    eDirectory server specified for iManager.<br><br>The name and context must be
    specified using typeful syntax (cn=name.ou=organizational-unit. o=organization).
    |

    | | Admin Password | The password for the Admin. |

    | | NetStorage Authentication Server | The IP address or DNS hostname of the eDirectory
    server to which NetStorage users authenticate using LDAP. |

    | | NetStorage Proxy User | The fully distinguished name of a user object with
    rights to do the following:<br>■ Search the LDAP (eDirectory) tree specified as
    the NetStorage Authentication Server for NetStorage users.<br>■ Store the iFolder
    user pass phrase in eDirectory the first time a user accesses the storage location,
    if an iFolder storage location is defined in NetStorage. |'
  merge: -1
