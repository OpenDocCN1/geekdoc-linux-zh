- pgno: 61
  md: 'To add a server, enter the following information:


    +   Public and private iFolder server names. If the DNS name or IP address of
    your iFolder server goes directly to the iFolder server without being routed through
    another device, meaning that your iFolder server is not behind a firewall, you
    are only required to fill in the information beneath the Public heading. If the
    DNS name or IP address of your iFolder server goes through another device, like
    an L4 switch or a firewall which redirects the request to the iFolder server,
    you need to fill in the information under both the Public and Private headings.


    ![](img/d63035f3fce0eaaf97203dde900affb7_61_0.png)


    > If you have Network Address Translation (NAT) functionality built into your
    routers or switches, enter both your iFolder public and private DNS names and
    IP addresses.


    If your public DNS name or IP address redirects requests to a private iFolder
    IP address, specify a DNS name (not an IP address) as the public address of the
    iFolder server. Then, make sure you are using an internal DNS server to resolve
    the DNS name to the private address for internal users and use an external DNS
    server to resolve the DNS name to the public address of external users. The Private
    settings allow the iFolder servers to communicate directly with each other within
    the iFolder system. The Public settings allow you to access the iFolder server
    from outside the firewall.


    +   iFolder ports. The ports that you enter into the iFolder Management console
    must match the ports that you specified during the iFolder installation. You can
    have multiple iFolder servers using the same port numbers if they all have a unique
    DNS name or IP address.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Port 80 is used to send the encrypted username and password and data from the
    iFolder client to the iFolder server.


    iFolder uses RSA* encryption to encrypt the username and password, and Blowfish*
    encryption to encrypt the user data. Port 443 is used to access the iFolder Management
    console and the Java applet via SSL and HTTPS.


    +   4. When you finish, add the server by selecting **Add**.


