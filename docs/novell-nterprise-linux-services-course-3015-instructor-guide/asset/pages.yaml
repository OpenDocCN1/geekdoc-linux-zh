    \ the page, and select **Remove iFolder User Data**.\n\n+   6. Confirm the removal\
    \ of the user data by selecting **OK**.\n\n# Use the Conflict Bin\n\nThe iFolder\
    \ client has a feature called the Conflict Bin. A user will rarely need to access\
    \ this option; however, understanding this feature is useful. The following scenario\
    \ illustrates what the Conflict Bin is and how it works.\n\nSuppose that John\
    \ is one of your iFolder users. John has the iFolder client installed on two computers:\
    \ computer A and computer B. At some point in the day, John disconnects both of\
    \ these computers from the network and continues to work from both computers offline.\n\
    \nWhile he is working, he makes a change to one of his iFolder files on computer\
