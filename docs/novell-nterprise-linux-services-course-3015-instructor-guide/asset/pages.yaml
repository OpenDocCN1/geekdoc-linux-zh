- pgno: 155
  md: "+   j. Browse to the /var/opt/novell/httpd/htdocs/ipp/docs directory.\n+  \
    \ k. Right-click the right frame and select Paste Files.\n+   The iPrint map is\
    \ ready to be used for installing printers on the network.\n\n# **Objective 4**\
    \ **Print with iPrint**\n\nTo print with iPrint, you must be on a Windows workstation,\
    \ and you must install the iPrint Client and the correct printer driver for each\
    \ printer you want to use.\n\nWhen you select a printer that you want to print\
    \ to (either from a default list or from a map that you created), iPrint checks\
