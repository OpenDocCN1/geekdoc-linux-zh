    # ## Public Web Pages


    A public Web page is a personal page that users create in Virtual Office. Users
    can create these Web pages to display information, bookmarks, and files for other
    users.


    For example, a user might have a document file that several other users need at
    some point. This file can be placed on a personal Web page so other users can
    view or download it from there.


    When you create Web pages, you can display or hide any of the options available
    in the configuration wizard.'
  merge: -1
  img_proc: true
- pgno: 259
  md: "To configure your personal Web page, do the following:\n\n+   From the button\
    \ bar on the Virtual Office main page, select **View and Edit My Webpage**.\n\n\
    +   Select **Edit**.\n\nThe following appears:\n\n![](img/d63035f3fce0eaaf97203dde900affb7_259_0.png)\n\
    \n+   Select the check box for each of the following items you want to display:\
    \  \n+   - **User Information**: Selects everything in the User Information section.\
    \  \n+   - **Common Name**: Displays the user’s common name.  \n+   - **Team Member**:\
    \ Makes the site available for display for all team members.  \n+   - **Published\
    \ Favorites**: Displays the user’s bookmarks.  \n+   - **Published Files**: Shows\
    \ the files the user has downloaded.\n\n+   Select **OK**."
  merge: -1
  img_proc: true
- pgno: 260
  md: 'All users can search for and access Web pages that are made public. This is
    helpful if you need contact information or if you want to access a file a user
