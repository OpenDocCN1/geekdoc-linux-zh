- pgno: 48
  md: '# How to Manage iFolder User Accounts


    As an iFolder administrator, you can perform tasks such as the following:


    +   - Set Global Client Policies

    +   - Set Security Pass Phrase

    +   - Change Individual User Policies

    +   - Recover Pass Phrases

    +   - Change a User Pass Phrase

    +   - Restore Deleted or Corrupted Files

    +   - Delete User Data on the Server

    +   - Use the Conflict Bin

    +   - iFolder and NetDrive


    # Set Global Client Policies


    The iFolder administrator uses the Global Client Policies to control which features
    the user can configure for the iFolder client and what the default settings are.


    To set Global Client Policies, do the following:


    +   1. Display the iFolder Management console in a web browser.

    +   2. Log in to the Global Settings section; then select **Global Settings**.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# The following appears:


    ![](img/d63035f3fce0eaaf97203dde900affb7_49_0.png)


    There are three levels you can set for the Global Client Policies:


    +   *   **Default Settings**. Set the default settings for the configurable features
    in the iFolder client.

    +       Select the check box or fill in a value to enable that option by default
    in the iFolder client. The user can view the settings and can change them.

    +   *   **Enforced**. Select the check box to enforce the default setting you
    specified for a configurable feature in the iFolder client.

    +       If enforced, the user can view the settings, but cannot change them. The
    features and settings are grayed out in the iFolder client interface.

    +   *   **Hidden**. Select the check box to hide the configurable feature and
    its default setting in the iFolder client.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The user will not see the option or the setting in the iFolder client. Hidden
    features are enforced by default.


    You can set the following policies:


    +   *   **Encryption (+)**. This allows the user''s local data to be encrypted
    as it leaves a workstation to travel to the iFolder server, resides on the server,
    and travels to another workstation, where it is unencrypted; the user''s data
    resides on the user''s workstations in unencrypted form.

    +   *   **Save Password**. This allows automatic entry of the user''s password
    during any iFolder login sequence.

    +       The iFolder client does not pass on system warnings about grace logins.

    +       If your organization requires frequent password changes, we recommend
    that users be notified of pending change requirements by alternate means so users
    can proactively change the stored password, if they select this option.

    +   *   **Save Pass Phrase**. This allows automatic entry of the user''s encryption
    pass phrase during any iFolder login sequence.

    +   *   **Recover Pass Phrase (+)**. This allows the iFolder administrator to
    recover the user''s encryption pass phrase.

    +       Because the Pass Phrase is the user''s encryption key, the administrator
    is able to decrypt the user''s data files on the iFolder server.

    +       Allowing this option implies a trusted relationship for the iFolder administrator.

    +   *   **Automatic Sync (+)**. This allows the iFolder client to automatically
    synchronize the user''s iFolder files between the local iFolder directory and
    the iFolder server.


    The following settings are available:'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   * **Sync to Server Delay (+).** If Automatic Sync is allowed, sets the
    default time (in seconds) that the iFolder client waits after a file in the local
    iFolder directory changes until it automatically uploads the file to the iFolder
    server. Also sets the minimum and maximum values allowed.


    +   * **Sync from Server Interval (+).** If Automatic Sync is allowed, sets the
    default time (in seconds) after a synchronization occurs that the iFolder client
    waits to check with the iFolder server to determine if there are changed files
    it needs to automatically download to the local iFolder directory. Also sets the
    minimum and maximum values allowed.


    +   * **Conflict Bin Space.** Sets the default size (in MB) of the Conflict Bin
    for the user''s iFolder account. Also sets the minimum and maximum allowed values.


    +   * **iFolder Location (+).** Sets the default path of the user''s local iFolder
    directory.


    Some options, distinguished above by a plus (+), apply only to new iFolder user
    accounts. They appear in the first instance of an iFolder client install for that
    user.


    After the user sets these preferences, the items no longer appear in the login
    sequence or in subsequent installs of the iFolder client by that user.


    Changing the marked option has no effect for existing users; it affects only subsequently
    created accounts. If you want to change marked features for all users after accounts
    exist, you must coordinate with users to delete their accounts and recreate them
    with the new settings enforced.


    +   3. When you finish, select **Update Client Policy**.


    Whenever you update the Global Client Policy settings, all of the settings apply
    only to new iFolder user accounts.'
  merge: -1
  img_proc: true
- pgno: 52
  md: "For current iFolder accounts, the settings apply only as they would for subsequent\
    \ new installs of the iFolder client. The updated policies and settings do not\
    \ replace the current iFolder users' settings during iFolder client upgrades.\n\
    \n> To force the updated settings to apply for existing users, the users must\
    \ uninstall the iFolder client, and then reinstall it.\n> \n> However, the account-based\
    \ settings will not change unless you delete the current user account and create\
