    # Changing the iFolder Data Directory


    If, after you have installed iFolder, you need to change the location of the iFolder
    data directory, do the following:


    +   1. Create an ifolderdata folder in the new location. For example, if you want
    to change the location to /home/ifolderdata, enter the following command:


    ```

    mkdir /home/ifolderdata

    ```


    +   2. Copy the content of /var/opt/novell/ifolderdata to the new location.


    +   3. Modify the /etc/opt/novell/ifolder/httpd_ifolder_unix.conf file by changing
    the iFolderServerRoot parameter to indicate the new directory location.


