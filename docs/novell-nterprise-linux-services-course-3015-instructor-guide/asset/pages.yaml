- pgno: 59
  md: 'He then reconnects computer A to the network in order to synchronize the changes
    to the iFolder server. Then, John reconnects computer B to the network to synchronize
    the new change.


    When computer B reconnects to the network and synchronizes the change to the iFolder
    server, the change that John made on computer A would be overwritten with the
    change that John made to that same file from computer B.


    To prevent data loss, iFolder saves the overwritten file to the Conflict Bin.
    John can access the Conflict Bin by right-clicking the iFolder icon located in
    the system tray of the computer that originally contained the file that was overwritten.


    ![](img/d63035f3fce0eaaf97203dde900affb7_59_0.png)


    If the problem file is larger than the quota set for the Conflict Bin, the file
    will not be saved in the bin; it will be discarded.


    # iFolder and NetDrive


    You must activate your iFolder account via the iFolder client before attempting
    to use NetDrive to access the iFolder server.


    If you try to attach to iFolder for the first time using NetDrive, the connection
    will fail. You must first activate the account by attaching with either the Java
    applet (https://mfi1.*your domain name*.com/applet/java.htm) or the iFolder client.


    # How to Manage iFolder Servers


    Through the iFolder Management console, you can change your iFolder server’s IP
    address, DNS name, or assigned ports.'
