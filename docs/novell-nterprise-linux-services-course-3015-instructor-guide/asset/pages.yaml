- pgno: 299
  md: 'Other services provided by Directory-enabled products include automated provisioning,
    enhanced security, customer profiling, electronic wallets, automated notification
    systems, customized web interfaces, and virtual private networks (VPNs).


    (VPN software is used to transfer sensitive company information across an untrusted
    network, such as the Internet, in a secure fashion by encapsulating and encrypting
    the data.)


    # Key Components of a Basic Directory


    With the global direction of today’s economy and business practices, it is logical
    and necessary that Directories, at least in their basic structural form, follow
    certain global standards.


    Novell® eDirectory™, as a leading eBusiness solution, conforms to several key
    and vital defining components of the X.500 standard.


    X.500 is an International Organization for Standardization (ISO) and International
    Telecommunication Union (ITU) standard that globally defines how Directories ought
    to be structured at the basic level.


    Novell eDirectory conforms to several key and vital defining components of the
    X.500 standard.


    To effectively understand and manage eDirectory in your network, you need to know
    the following:


    +   - The History of the X.500 Directory

    +   - X.500 Models

    +   - The Components of the X.500 Directory'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# **The History of the X.500 Directory**


    The ITU (formerly CCITT), working with the ISO, produced the Open Systems Interconnection
    Reference Model, referred to as the OSI model.


    Using the OSI model as a foundation, the ITU has created specifications for a
    series of recommendations that define Directory services.


    The Directory is specified in the X.500 recommendation.


    The X.500 Directory standard provides the framework for much of the current development
    in Directory services technology.


    > Although most Directories do not follow the standard completely or have expanded
    the specifications, understanding the X.500 Directory standard helps you assess
    and recommend different vendors'' Directory implementations.


    ITU is located in Geneva, Switzerland and is an international organization that
    cooperates with governments and private institutions to coordinate and establish
    global telecommunication networks and services.


    ITU members represent the technical and standards bodies from members of the United
    Nations. ITU provides its recommendations for telecommunications and data communications
    through its Telecommunications Standardization Sector (ITU-TSS).


    Recommendations in the X.500 series that define Directory services include


    +   - X.501 Models

    +   - X.509 Authentication Framework

    +   - X.518 Procedures for Distributed Operation

    +   - X.519 Protocol Specifications'
  merge: -1
  img_proc: true
- pgno: 301
  md: '+   - X.520 Selected Attribute Types

    +   - X.521 Selected Object Classes

    +   - X.525 Replication


    # X.500 Models


    Because of its complexity, the Directory is easier to understand if it is taken
    apart and described in terms of parts, or models.


    Each model represents a simplified view of one part of the whole Directory.


    In 1988, the X.500 specification defined only the Directory Information Model,
    which described a basic view of the Directory. The 1993 X.500 specification provides
    a number of additional models to describe the Directory.


    The following are some of the most significant models in the X.500 specifications:


    +   - **User Information Model.** Describes what the Directory looks like to the
    user.

    +   - **Directory Functional Model.** Gives an overall view of how the Directory
    works.

    +   - **Operational and Administrative Information Model.** Describes what the
    Directory looks like to an administrator.

    +   - **DSA Information Model.** Explains how Directory System Agents (DSAs) work
    together to provide Directory access.

    +   - **Directory Distribution Model.** Describes how DSAs distribute information.

    +   - **Directory Administrative Authority Model.** Describes how the Directory
    is administered.

    +   - **Security Model.** Describes authentication and access control.'
  merge: -1
  img_proc: true
- pgno: 302
  md: "Although these models are important to the X.500 specification, we will present\
    \ a simple, condensed overview of the essential components of a Directory that\
    \ cross the boundaries of several of these models.\n\n# ## The Components of the\
    \ X.500 Directory\n\nEssential components of the X.500 standard include the following:\n\
    \n+   Directory Information Database (DIB)\n+   \n+   Directory Information Tree\
    \ (DIT)\n+   \n+   Directory User Agent (DUA)\n+   \n+   Directory System Agent\
    \ (DSA)\n+   \n+   Directory Access Protocol (DAP)\n+   \n+   Directory System\
    \ Protocol (DSP)\n+   \n+   Directory Information Shadowing Protocol (DISP)\n\n\
    # ### Directory Information Database (DIB)\n\nA Directory is made up of objects\
    \ that represent physical resources in the real world. For example, people, servers,\
    \ and printers are represented by objects in the Directory tree.\n\nCollectively,\
    \ these objects are known as the Directory Information Database (DIB).\n\nWithin\
    \ the DIB each object is made up of a collection of information known as an *entry*.\
    \ Each entry is made up of attributes and values and has a distinguished name\
    \ that uniquely identifies the entry."
  merge: -1
  img_proc: true
- pgno: 303
  md: '# **Directory Information Tree (DIT)**


    The Directory Information Tree (DIT) is a tree structure that logically represents
    and describes the collection of objects and the relationship of information in
    the DIB.


    The objects are contained in a hierarchical arrangement in this tree structure.


    For example, a person (object/entry) works for a company (object/entry) that is
    located within a country (object/entry).


    To keep the Directory organized, a set of rules is enforced to ensure that the
    DIB remains stable and intact as modifications are made to it over time.


    These rules are known as the Directory schema. They prevent entries from having
    the wrong attribute type or objects from being a member of the wrong object class.


    # **Directory User Agent (DUA)**


    The X.500 specification takes a client/server approach in communicating information.
    The client interacts with a server to perform specific Directory operations.


    The DUA, acting as the client, is an application process that represents each
    user accessing the Directory. Users are people or programs that can read, modify,
    or search the Directory.


    The DUA requests information from the Directory and then relays that information
    to the user.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# **Directory System Agent (DSA)**


    The DSA differs from the DUA in that it is not a single protocol or piece of software.


    The DSA is a collection of services and protocols that manage a specific portion
    of a DIB.


    Communication between the DSA and the DUA goes as follows: the DSA receives a
    request from a DUA. If that DSA has the requested information, it will relay it
    back to the DUA.


    If it doesn''t have the requested information, it will pass the request on to
    another DSA.


    # **Directory Access Protocol (DAP)**


    The DAP handles the exchange of requests and outcomes between a DUA and a DSA.


    # **Directory System Protocol (DSP)**


    Sometimes, a DSA cannot fulfill the request of a DUA and it passes the request
    to another DSA. The DSP provides this communication between the 2 DSA\s.


    # **Directory Information Shadowing Protocol (DISP)**


    Replication, or shadowing, is used to distribute the DIB to another DSA. This
    improves the performance of requests made to the Directory and provides a secondary
    or backup copy of the DIB.


    The DISP actually performs this exchange of replication information.'
  merge: -1
  img_proc: true
