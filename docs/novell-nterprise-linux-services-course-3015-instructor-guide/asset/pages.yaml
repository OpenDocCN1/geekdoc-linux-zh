    # ## How to Manage LDAP Servers


    Whenever you add an LDAP server through the iFolder Management console for user
    authentication, you are required to enter a name for the LDAP server, its DNS
    or IP address, a port number and, if necessary, the location of the root certificate.


    You can have up to eight LDAP servers.


    To manage LDAP servers for iFolder, you need to know how to do the following:


    +   - Choose Port 389

    +   - Choose Port 636

    +   - Add LDAP Contexts'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# **Choose Port 389**


    Choose port 389 if you want to use LDAP without SSL encryption or if your LDAP
    server does not support SSL.


    Port 389 is also a good choice if iFolder and LDAP are running on the same server
    (no communication or data is being transferred across the wire, so no encryption
    is necessary).


    If you choose port 389, the LDAP Group object must be configured to allow clear
    text passwords.


    # **Choose Port 636**


    Choose port 636 if you want to use SSL to provide your network with encryption
    and security when data is transferred across the wire. SSL requires a root certificate.


    If you choose port 636, make sure you have previously copied the rootcert.der
    file to the appropriate location on your system.


    When you add a secure LDAP server to your iFolder system, the root certificate
    is copied into an attribute of the iFolderSettings class on the Global Settings
    LDAP.


    # **Add LDAP Contexts**


    In the Contexts field, list all of the contexts, separated by semicolons (;) with
    no spaces.


    The order of the contexts is the order in which the contexts will be searched.
    The first context that is listed should be the context that contains the Admin
    user.'
  merge: -1
  img_proc: true
