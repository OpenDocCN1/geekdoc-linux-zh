- pgno: 102
  md: '# Objective 5 Describe the Role and Function of NetStorage


    NetStorage provides secure Internet-based access to files and folders on Linux,
    Windows, and NetWare servers in your network through a browser.


    NetStorage authentication relies on Novell eDirectory authentication to provide
    secure access, so Internet-based access is as secure as accessing files from within
    the network.


    To describe the role and function of NetStorage, you need to understand the following:


    +   - NetStorage Benefits

    +   - How NetStorage Works

    +   - What Users See When They Access NetStorage


    (End of Exercise)


    You should not have to disconnect drives mapped to the /tmp directory because
    no other exercises will require that you map a drive to this share.


    You use the mapped drive to the /tmp directory if you choose to do the optional
    part of Exercise 7-1.


    ![](img/d63035f3fce0eaaf97203dde900affb7_102_0.png)'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# *NetStorage Benefits*


    Novell NetStorage includes the following benefits:


    +   - Lets users securely copy, move, rename, delete, read, and write files between
    any Internet-enabled computer and the servers on your network

    +   - Eliminates the need to use a virtual private network (VPN) client to access
    files

    +   - Eliminates the need to email or copy data from one computer to another

    +   - Supports Internet standards such as HTTP, HTTPS, HTML, XML, and WebDAV

    +   - Supports file protocols such as CIFS, Samba, and NFS.

    +   - Supports access to users'' Novell iFolder accounts

    +   - Provides access to network files and folders via Novell Virtual Office

    +   - Supports Storage Location objects used to display, through a Web browser,
    a specified name for the NetStorage directory


    With NetStorage installed on one Linux server with Novell Nterprise Linux Services,
    users can potentially have access to any Linux or NetWare server anywhere on your
    geographically dispersed network.


    # *How NetStorage Works*


    NetStorage is installed on one Linux server that acts as a Middle Tier (also known
    as XTier) server. XTier is Novell''s Web services framework and is used by various
    Novell products.


    See "How NetStorage Works" in the *NetStorage Administration Guide*, which is
    available at http://www.novell.com/documentation/lg/nnls/index.html.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Middle Tier server configuration information is stored in the /etc/opt/novell/xtier/xtier_registry.xml
    file on the Linux server. Novell iManager provides an easy method for changing
    Middle Tier configuration.


    Previous versions of NetStorage were administered using the NSAdmin utility. Configuration
    should now be done through Novell iManager.


    After the Middle Tier server is set up, it appears as an Internet Web server to
    users and can be accessed through a web browser. For example, the NetStorage service
    on NNLS can be accessed through Virtual Office, or at the following URL:


    HTTPS://IP address or domain name/NetStorage


    NetStorage also includes a gadget that provides access through Novell exte:Nd
    Director 4.1 Standard Edition.


    The following illustrates how NetStorage works on this middle tier:


    # Figure 6-16


    ![](img/d63035f3fce0eaaf97203dde900affb7_104_0.png)'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'The Middle Tier server communicates with the NetWare or Linux servers in the
    network and provides secure authentication using eDirectory and the users'' usernames
    and passwords.


    After authentication, when a user is trying to access a Samba share on a Linux
    server, NetStorage also checks the Samba configuration to see what the user''s
    permissions are to the share. For this reason, users must be Samba enabled before
    they can access a Samba share.


    A notable exception to the Samba-enabled requirement is the NetStorage **shared**
    directory, which is discussed later in this section.


    NetStorage also provides secure access to files that users have located on Novell
    iFolder servers.


    > Users must have their iFolder user accounts enabled through the iFolder server
    in order to access their files stored in iFolder using NetStorage. You must also
    enable users to set iFolder passphrases in NetStorage.


    iFolder 2.1 does not support 56-bit encryption. If you are using 56-bit encryption,
    you must use iFolder 1.03.


    All transactions can also be encrypted using SSL to increase the security. Novell
    iFolder transactions are secured using the iFolder encryption mechanism.


    # What Users See When They Access NetStorage


    NetStorage allows certain access by default while additional access can be configured
    and must meet certain requirements. In this topic we will discuss the following:


    +   - Default NetStorage Access

    +   - Additional Configured NetStorage Access'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# ## Deafult NetStorage Access


    The NetStorage Web page displays the network files and folders.


    The following illustrates folders accessible by default from the NetStorage web
    page:


    **Figure 6-17**


    ![](img/d63035f3fce0eaaf97203dde900affb7_106_0.png)


    The **shared** folder, shown in Figure 6-17, is a default NetStorage location
    that all users can access for uploading or downloading files. Users do not have
    to be Samba-enabled to access this folder.


    NetStorage is automatically configured to give all eDirectory users access to
    the **shared** folder on your NNLS server. The path to this folder is


    /var/opt/novell/netstorage/shared


    # ## Additional Configured NetStorage Access


    You can create folders that only specific users have access to. You do this by
    creating Storage Location objects that point to folders on Linux and NetWare servers.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Users might be granted Linux file system rights and permissions to certain
    folders on the NNLS server but they will not be able to access them using NetStorage
    unless the following conditions are met:


    +   * The user is Samba enabled.

    +   * In the case of folders you specifically create for NetStorage users, the
    folders must be configured as Samba shares in the smb.conf file.

    +   * In the case of user’s home directories, they are already configured as a
    Samba share by default. But if you want to give a user access to a home directory
    through NetStorage, you must create the home directory by logging in as a LUM
    user.

    +   * Storage Location objects have been created and configured to point to the
    Samba share.

    +   * The user is given an assignment to the Storage Location object. This can
    be done on an individual user level, or it can be done through group, container,
    or other similar assignments.


    The following illustrates additional folders that have been configured to be accessible
    from the NetStorage web page:


    Figure 6-18


    ![](img/d63035f3fce0eaaf97203dde900affb7_107_0.png)'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Objective 6    Install and Configure NetStorage


    To install and configure NetStorage, you need to know the following:


    +   - Steps for Installing NetStorage

    +   - Creating Storage Location Objects and Lists

    +   - Configuring NetStorage

    +   - Accessing NetStorage Files and Folders


    # *Steps for Installing NetStorage*


    The general steps for installing iFolder are


    +   - Meet NetStorage Dependencies

    +   - Gather Required Information

    +   - Use the NNLS Install Feature


    # Meet NetStorage Dependencies


    NetStorage is installed with Virtual Office. The dependencies for Virtual Office
    include


    +   - Apache 2.0.45 on the same NNLS server

    +   - JVM 1.4.1_02 on the same NNLS server

    +   - Tomcat 4.1.24 on the same NNLS server

    +   - eDirectory 8.7.1 or later anywhere within the network

    +   - iManager 2.0 on the same NNLS server


    The NNLS install program will select the required components, along with their
    dependencies, when you select the Virtual Office component. They will all be installed
    in the same process.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'See Table 2-5 for information needed to successfully install any Virtual Office
    dependencies that are not already installed.


    For most networks, you need NetStorage installed on only one server; however,
    this might vary depending on size and your organization’s needs.


    For example, if your company is geographically dispersed, you might want to install
    NetStorage on one server in each geographic region.


    # Gather Required Information


    The following table describes the NetStorage information requested during a Virtual
    Office installation:


    Table 6-5

    | Configuration Data Required | Description |

    | --- | --- |

    | NetStorage Authentication Server | The IP address or DNS hostname of the eDirectory
    server to which NetStorage users authenticate using LDAP. |

    | NetStorage Proxy User | The fully distinguished name of a user object with rights
    to do the following:<br>• Search the LDAP (eDirectory) tree specified as the NetStorage
    Authentication Server for NetStorage users<br>• Store the iFolder user pass phrase
    in eDirectory the first time users access the storage location, if an iFolder
    storage location is defined in NetStorage |

    | NetStorage Proxy User Password | The password for the user specified as the
    NetStorage Proxy User. |'
  merge: -1
  img_proc: true
- pgno: 110
  md: "**Table 6-5** (continued)  \n| **Configuration Data Required** | **Description**\
    \ |\n|---|---|\n| NetStorage Users Context | The context on the NetStorage Authentication\
    \ Server to be searched for NetStorage users. |\n|  | (All subcontexts are also\
    \ searched.) |\n| iFolder Server IP Address or Hostname | (Optional) Specifies\
    \ the IP address or hostname of the iFolder server you want created as a storage\
    \ location in NetStorage. This makes iFolder automatically available to Virtual\
    \ Office users. |\n\n# ### Use the NNLS Install Feature\n\nTo install NetStorage\
    \ (part of the Virtual Office installation) from NNLS, do the following:\n\n+\
    \   1.  Perform the steps to do a custom installation.\n+       \n+       > If\
    \ necessary, see Section 2 for details on how to perform a custom installation.\n\
    +       \n+   2.  Deselect the services you *do not want* to install, select the\
    \ **Virtual Office** service, and then continue.\n+       If eDirectory has not\
    \ previously been installed, notice that it is selected by default when you select\
    \ Virtual Office (along with other required components such as Apache and Tomcat).\n\
    +       \n+       If eDirectory has been previously installed, the install program\
    \ will indicate which components are already installed.\n+       \n+   3.  Accept\
    \ the license agreement."
  merge: -1
  img_proc: true
- pgno: 111
  md: '+   4.  **(Conditional)** If prompted for the location of the NICI Foundation
    Key (NFK) file, insert the license diskette and enter the path to the NFK file.

    +       You will only be asked for the NICI Foundation Key if eDirectory has not
