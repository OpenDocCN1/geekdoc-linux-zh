    | 1. Describe Virtual Office | Virtual Office is a web access portal that allows
    remote users to collaborate and share information with a workgroup team.\n\nVirtual
    Office optimizes the concept of self-service for users by letting them set up
    and manage many of their own networking, information-sharing, and data backup
    processes.\n\nVirtual Office also lets users create their own functional teams,
    called Virtual Teams, for interactive real-time collaboration.\n\nPeople who join
    a virtual team can access shared documents, discussion threads, bookmarks, and
    a team calendar. All members of the team have access to the team information and
    services. |'
