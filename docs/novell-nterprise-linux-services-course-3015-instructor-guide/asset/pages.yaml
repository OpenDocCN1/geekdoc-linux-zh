- pgno: 60
  md: 'Your first iFolder server is automatically added to the iFolder Management
    console for you. All additional iFolder servers must be manually added into the
    iFolder Management console in order for you to manage them.


    You can have an unlimited number of iFolder servers.


    To manage iFolder servers, you need to know how to do the following:


    +   Add iFolder Servers

    +   Set Global Server Policies

    +   Use Debug Output


    # # Add iFolder Servers


    To add an iFolder server, do the following:


    +   In the iFolder Management console, select **Global Settings**.

    +   Log in with your Admin *username* and *password*.

    +   Select *iFolder Servers* > *Add*.


    The following appears:


    ![](img/d63035f3fce0eaaf97203dde900affb7_60_0.png)'
