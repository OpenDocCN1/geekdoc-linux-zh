- pgno: 115
  md: '# **Accessing NetStorage Files and Folders**


    Based on how NetStorage has been configured, the NetStorage Web page displays
    the network files and folders you have access to.


    Initially, you might only be able to see your iFolder directory and a local shared
    directory on the Linux server. Storage location objects are required for accessing
    files and directories on Linux servers and can also be used on NetWare servers.


    For NetWare servers, NetStorage reads your NetWare login script to determine drive
    mappings, reads eDirectory User object properties to determine your home directory,
    and then displays a list of files and folders based on mapped drives and home
    directories.


    If you usually log in to more than one eDirectory tree, you might have access
    to additional home directories in different eDirectory trees.


    If you have a Novell iFolder account, the iFolder directory is also displayed.
    However, some NetStorage features, such as Download for Editing, are not available
    with Novell iFolder.


    NetStorage reads the container, profile, and user login scripts only from the
    primary eDirectory server specified during the installation and displays the user''s
    drive mappings only based on those login scripts.


    Users might have specific eDirectory rights to certain files and folders on your
    network but will not be able to access those files and folders using NetStorage
    unless storage location objects have been created, login script drive mappings
    exist to those folders, or the files and folders are in the user''s home directory.


    If you want to provide users with NetStorage access to a specific folder, you
    might have to add a drive mapping command to that folder in a login script (container,
    profile, or user).'
  merge: -1
  img_proc: true
