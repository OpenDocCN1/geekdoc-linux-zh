- pgno: 192
  md: '# Installation Directories


    During a default installation, NetMail files are copied to the `/var/opt/novell/netmail`
    and the `/opt/novell/netmail` directories.


    The `/var/opt/novell/netmail` directory contains the single copy, message store
    and the user directories. The `/opt/novell/netmail` directory contains the NetMail
    binaries.


    The mail NetMail binary is named **ims** and is located in `/opt/novell/netmail/bin`.
    Each NetMail agent binary is also located in this directory, as shown below:


    Figure 8-8


    ![](img/d63035f3fce0eaaf97203dde900affb7_192_0.png)


    # WebAdmin


    WebAdmin is a browser-based, platform-independent, system management tool.


    WebAdmin is not represented by an **Agent** object in eDirectory. Instead, the
    agent is manually launched at the server.


    You access WebAdmin through your browser by accessing iManager and selecting Launch
    NetMail Management.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'WebAdmin runs on port 8018 (insecure) and on port 8020 (secure). It can be
    accessed with a web browser at **http://*server_ip* :8018** or **https://*server_ip*
    :8020**.


    # **Objective 3  Describe How NetMail Works**


    In this object, you learn the following:


    +   - Changes Made to Existing Objects

    +   - How Messages Are Processed


    # *Changes Made to Existing Objects*


    When NetMail is installed, it expands the eDirectory schema to include NetMail-related
    objects and attributes. Existing Directory objects, such as Container, User, and
    even Server objects, take on new NetMail attributes.


    To understand this process, you need to know what happens to the following:


    +   - Container Objects

    +   - User Objects


    # **Container Objects**


    NetMail properties added to Container objects include the option to


    +   - Define a custom message store for users within the current container

    +   - Define a container-specific domain name'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'The container-specific message store is the directory where the mailboxes for
    users in the current container are located. This does not affect the general message
    queue and SCMS directories, which will always be located in the default message
    store directory.


    If configured, container domains appear in the From field of user messages and
    are referenced by the Address Book Agent in returning users'' address book information.
    Container domains do not allow you to have non-unique user IDs in different containers.


    # User Objects


    The NetMail attributes added to User objects replicate many of the user configuration
    options available in the Modular Web client, including privacy level, forward
    and autoreply messages, and proxy configuration.


    Providing the user configuration options in both the User object and Modular Web
    client gives you the option of centrally managing these options through the User
    object or allowing users to self-manage these options through the Modular Web
    client.


    The User object also replicates many of the configuration options available in
    Parent objects. This duplication lets you configure general settings in the Parent
    object, but create exceptions for individual User objects.


    # How Messages Are Processed


    The core function of NetMail is message processing. Every message entering your
    messaging system must be processed by NetMail agents.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Depending on which agents you have running on your messaging system, the message
    might be checked against a system blacklist, forwarded to another email address,
    or filtered according to user-defined rules.


    The file system structure used for message processing is comprised of 3 directories:


    +   - Message Store

    +   - Single Copy Message Store

    +   - Message Queue


    Everything that happens from the time a message enters the messaging system to
    when it is delivered to the user’s mailbox occurs in these directories.


    # ### Message Store


    The message store is the directory structure that holds users’ mailboxes and messages.
    All other information required by your NetMail system is stored in eDirectory.
    Every server running an NMAP Agent has a message store.


    On a Linux server, the default message store location is /var/opt/novell/netmail/users.
    This location, of course, can be changed using WebAdmin.


    The NMAP Agent creates the following mailbox directory structure within the message
    store directory for every User object in its assigned contexts:


    Table 8-2


    | Directory | Function |

    | :--- | :--- |

    | .users | Collective directory for all user mailboxes. |'
  merge: -1
  img_proc: true
- pgno: 196
  md: '**Table 8-2** (*continued*)

    | Directory | Function |

    | :---- | :---- |

    | .users/user_name | A unique directory for each user''s mailbox. |

    | .users/user_name/Inbox.box | The file containing all messages in the user''s
    InBox (text and attachments). New messages are appended to the end of the file.
    |

    | .users/user_name/Inbox.idx | The index of all messages in the inbox.box file.
    |

    | .users/user_name/mail.cal | The calender store. This file contains the user''s
    calender items, such as tasks, appointments, and notes. |

    | .users/user_name/main.idc | The index of all items in the mail.cal file. |

    | .users/user_name/folder_name.box | A unique file for each folder in the user''s
    mailbox. It contains the folder''s messages (text and attachments). New messages
    are appended to the end of the file. |

    | .users/user_name/folder_name.idx | The index of all messages in the folder_name.box
    file. |'
  merge: -1
  img_proc: true
- pgno: 197
  md: '| Directory | Function |

    |---|---|

    | .Jusers\user_name\folder_name\ | A unique directory for each folder that contains
    subfolders.<br><br>More disk space is required to maintain directories than files
    on the messaging server.<br><br>Consequently, subfolders are very expensive in
    terms of server resources. |

    | .Jusers\user_name\folder_name\ subfolder_name.box | A unique file for each subfolder
    in the parent folder. It contains the subfolder’s messages (text and attachments).
    New messages are appended to the end of the file. |

    | .Jusers\user_name\folder_name\ subfolder_name.id | The index of all messages
    in the subfolder_name.box file. |


    # Single Copy Message Store


    If a message is sent to 2 or more multiple recipients and the message is over
    2 KB, NMAP does not replicate the message in all the users’ mailboxes.


    Instead, a pointer message is sent to the individual mailboxes directing NMAP
    to the complete message in the Single-Copy Message Store (SCMS) directory.


    When the last user downloads or deletes the message, it is deleted from the shared
    directory.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'The SCMS directory structure stores messages in sorting directories that correspond
    to the last character in their hexadecimal filename (0-9 or A-F).


    Sorting messages by the last character in their hexadecimal filename allows the
    NMAP Agent to efficiently retrieve messages stored in the SCMS directories.


    The SCMS directory structure is as follows:


    | Directory | Function |

    |---|---|

    | .scms | Single Copy Message Store (SCMS) directory. |

    | .scms/0-9, A-F | Sorting directories. Messages are sorted in these directories
    by the last hash value in the SCMS filename. |

    | .scms/0-9, A-F/xxxx | File with hashed filename (xxxx represents a hashed value)
    containing the multi-recipient message and any attachments. |

    | !scms/0-9, A-F/xxxx.cnt | Counter file. Its value is the total number of recipients.
    As each recipient deletes the message, the counter file decrements by 1. When
    its value is 0, the message and counter files are deleted. |


    # Table 8-3'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# ## Message Queue


    Each message store has an associated message queue. The message queue is the directory
    where messages are processed as they enter or leave your NetMail system.


    The NMAP Agent is responsible for managing the message queue. When the NMAP Agent
    receives a message, it downloads the file to the message queue directory located
    in `/var/opt/novell/netmail/spool`.


    # ## Message Processing in the Message Queue


    As the NMAP Agent downloads a message to the message queue directory, it generates
    2 files:


    +   - Cxxxxxx.in

    +   - Dxxxxxx.in


    The xxxxxx represents a hashed value of the date and time the message was sent.
    The .in extension indicates the message is inbound.


    The Cxxxxxx.* file is the control file envelope. The control file is generated
    from information received in the initial SMTP exchange. It contains To and From
    information along with any message flags. All message-processing functions are
    performed on the control file.


    The Dxxxxxx.* file is the data file. It contains the message header and message
    text. Because most message processing is done through the control file, the data
    file is rarely opened.


    After the message is downloaded, the NMAP agent gives the data file an .MSG extension
    and then begins moving the control file through nine queues.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The process of moving the control file between queues is a simple matter of
    changing its filename extension to reflect the current queue number.


    The following table outlines the message-processing functions associated with
    each queue.


    # **Table 8-4**


    | Filename | Function |

    | :--- | :--- |

    | xxxxxxx:000 | Queue 0 is the prep queue. NMAP makes sure the control file meets
    all processing requirements and the AntiVirus Agent scans the data file. |

    | xxxxxxx:001 | Message is processed by the AntiSpam Agent and/or the List Agent.
    |

    | xxxxxxx:002 | Message is processed by the Alias Agent and/or the AutoReply Agent.
    |

    | xxxxxxx:003 | Message is processed by the Rule Agent. |

    | xxxxxxx:004 | Not currently used by a NetMail agent; might be used by a third-party
    or custom agent. |

    | xxxxxxx:005 | Message is processed by the Calendar Agent. |

    | xxxxxxx:006 | Messages to recipients within the messaging system are delivered
    by the NMAP Agent. |'
  merge: -1
  img_proc: true
- pgno: 201
  md: '| **Filename** | **Function** |

    | :--- | :--- |

    | xxxxxxxx.007 | Messages to recipients outside the messaging system are picked
    up for delivery by the SMTP Agent. |

    | xxxxxxxx.008 | This is a holding queue for bounced messages. |

    |  | The NMAP Agent leaves bounced messages in queue 8 until it has time to reprocess
    them. |


    When the NMAP Agent moves a message into a queue, it notifies the agent registered
    on that queue.


    The registered agent then scans the control file and performs its assigned function.
    If the agent modifies the message, NMAP returns the message to queue 0 for reprocessing.
    If no changes are made, NMAP advances the message to the next queue. |


    | **Stage** | **Agent** | **Description** |

    | :--- | :--- | :--- |

    | 1 | User | Someone sends a message over the Internet to a user in your messaging
    system. |

    | 2 | SMTP Agent | The SMTP Agent receives the message and transfers the message
    to its assigned NMAP Agent. |

    | 3 | NMAP Agent | In downloading the message to the message queue directory,
    the NMAP Agent creates the message control file (Cxxxxxxx.in) and data file (Dxxxxxxx.in).
    |'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# **Table 8-5** *(continued)*


    | Stage | Agent | Description |

    | :--- | :--- | :--- |

    | 4 | NMAP Agent | After the message is downloaded, the NMAP Agent gives the data
    file an .MSG extension and moves the control file to queue 0 by changing the file
    extension from .IN to .000.<br><br>In queue 0, the NMAP Agent verifies that the
    control file meets all processing requirements. It then notifies the AntiVirus
    Agent that it has a message to process. |

    | | AntiVirus Agent | The AntiVirus Agent then scans the data file for any attachments.
    Attachments are sent to a third-party virus engine to be scanned.<br><br>Assuming
    the file is clean, the NMAP Agent then moves the control file to queue 1 by changing
    the file extension from .000 to .001 and notifies the AntiSpam and/or List Agents
    that they have a message to process. |

    | 5 | AntiSpam Agent<br>List Agent | Queue 1 is shared by the AntiSpam Agent and
    the List Agent.<br><br>The AntiSpam Agent checks the control file to see if the
    sender is on its blackout list. If the sender is on the blackout list, the message
    is deleted from the queue.<br><br>The List Agent checks the control file to see
    if the message is addressed to a mailing list. If it is, the List Agent generates
    a new message with the names of the individual users in the mailing list.<br><br>The
    new message is returned to queue 0 and the original message is deleted. |'
  merge: -1
  img_proc: true
- pgno: 203
  md: '**Table 8-5** (*continued*)


    | Stage | Agent | Description |

    | :---- | :---- | :---------- |

    | 6 | NMAP Agent | If no changes have been made, the NMAP Agent moves the file
    to queue 2 by changing the file extension from .001 to .002 and notifies the Alias
    and/or AutoReply Agents that they have a message to process. |

    | 7 | Alias Agent AutoReply Agent | Queue 2 is shared by the Alias Agent and the
    AutoReply Agent. |

    |  |  | The Alias Agent checks the control file to see if the recipient matches
    any of its defined aliases. If so, the Alias Agent replaces the alias with its
    corresponding email address. |

    |  |  | The AutoReply Agent checks the recipient''s User object to see if the
    recipient has either configured an autoreply message or forwarded messages to
    another email account. The user''s forward and autoreply information is stored
    in his or her User object. |

    |  |  | If the recipient has forwarded his or her mail, the agent adds the forwarded
    address to the recipient list. If the recipient did not request a copy of the
    message, the agent replaces the recipient''s name with the forwarded address.
    |

    |  |  | If the recipient has configured an autoreply message, the agent generates
    a new message and hands it off to NMAP for processing in the message queue. |'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# **Table 8-5** (*continued*)


    | **Stage** | **Agent** | **Description** |

    | :--- | :--- | :--- |

    | 8 | NMAP Agent | If the original message has been modified, the NMAP Agent returns
    the message to queue 0 for reprocessing. |

    | | | If no changes have been made, the NMAP Agent moves the file to queue 3 by
    changing the file extension from _.002 to _.003 and notifies the Rule Agent that
    it has a message to process. |

    | 9 | Rule Agent | In queue 3, the Rule Agent checks the message against the recipient''s
    defined rules which are stored in the user''s User object. If the message matches
    1 of the rule conditions, the Rule Agent applies the rule. |

    | | | If a rule directs the message to a specific folder, the Rule Agent adds
    the destination folder information to the control file in IMAP format. Using the
    IMAP protocol to designate the destination folder enables the message to be routed
    to the correct folder in any standards-based email client. |

    | 10 | NMAP Agent | If the message has been modified, the NMAP Agent returns the
    message to queue 0 for reprocessing. |

    | | | If no changes were made, the NMAP Agent moves the file to queue 5 by changing
    the file extension from _.003 to _.005. |'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Table 8-5 (continued)


    | Stage | Agent | Description |

    |---|---|---|

    | 11 | Calendar Agent | In queue 5, the Calendar Agent checks to see if the message
    is an “Accept” or “Decline” reply to a scheduled appointment. If the message is
    a response to an appointment and if the person who scheduled the appointment is
    a local user, the Calendar Agent updates the user’s calendar store (mail.cal)
    to indicate the sender accepted or declined the appointment. |

    | 12 | NMAP Agent | If the message has been modified, the NMAP Agent returns the
    message to queue 0 for reprocessing. If no changes were made, the NMAP Agent moves
    the file to queue 6 by changing the file extension from .005 to .006. |

    | 13 | NMAP Agent | In queue 6, the NMAP Agent checks the recipient list in the
    control file envelope; it then performs 1 of the following actions:<br>• If any
    of the recipients are local users, the NMAP Agent delivers a copy of the message
    to the users’ mailboxes.<br>• If the message exceeds the Single Copy Message Store
    (SCMS) threshold, the message is copied to the SCMS directory.<br>• If some of
    the recipients are not in the current NMAP Agent’s context but are within the
    Directory tree, the NMAP Agent transfers the message to the NMAP Agents assigned
    to the users’ contexts.<br>• If any recipients are not within the Directory tree,
    the NMAP Agent moves the message to queue 7 for remote delivery. |'
  merge: -1
  img_proc: true
- pgno: 206
  md: '| Stage | Agent | Description |

    |---|---|---|

    | 14 | NMAP Agent | In queue 7, the NMAP Agent passes the message to the SMTP
    Agent for remote delivery. |


    # **Objective 4     Install NetMail**


    To install NetMail on your Linux server, you need to know how to do the following:


    +   - Design Your NetMail System

    +   - Meet System Requirements

    +   - Gather Required Information

    +   - Use the NNLS Install Feature


    # *Design Your NetMail System*


    As mentioned previously, NetMail can be configured in 2 ways:


    +   - Single-Server Messaging

    +   - Distributed-Server Messaging


    In a single-server messaging system, all of the NetMail components run on the
    same server, as shown in the following:


    ![](img/d63035f3fce0eaaf97203dde900affb7_206_0.png)'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'In a distributed-server messaging system, the NetMail components are distributed
    across 2 or more servers, as shown in the following:


    ![](img/d63035f3fce0eaaf97203dde900affb7_207_0.png)


    ![](img/d63035f3fce0eaaf97203dde900affb7_207_1.png)


    NetMail can also be configured to service multiple Internet domains using the
    same eDirectory tree. In this case, multiple single-server messaging systems can
    be configured to service separate domains, as shown in the following:


    ![](img/d63035f3fce0eaaf97203dde900affb7_207_2.png)


    ![](img/d63035f3fce0eaaf97203dde900affb7_207_3.png)


    If performance and scalability are issues for your organization, you can implement
    a distributed system and then duplicate agents on different servers.


    When designing your NetMail system, you need to identify the following:'
  merge: -1
  img_proc: true
- pgno: 208
  md: "+   - Which server(s) will host NetMail agents?\n+   - Which agents will be\
    \ located on a given server?\n+   - Which domains will be serviced by each messaging\
    \ server?\n+   - Does your organization need fault tolerance and scalability by\
    \ deploying the same agents on multiple servers?\n\n# Meet System Requirements\n\
    \nTo install NetMail, you must meet the following system requirements:\n\n+  \
    \ - Make sure you're running 1 of the following:\n+   \n+     - Red Hat® Linux\
    \ AS 2.1\n+     - Red Hat Linux ES 2.1\n+     - SuSE® SLES 8\n+   - Make sure\
    \ eDirectory 8.7.3 or later for Linux is installed.\n+   - Make sure your system\
    \ CPU is at least a 750 MHz Pentium® III or Athlon.\n+   - Make sure you have\
    \ at least 512 MB of system RAM.\n+   - Make sure you have 20 MB of disk space\
    \ free for installation. Disk space for the NetMail message store varies, based\
    \ on the number of users and the amount of disk space allowed per mailbox.\n+\
    \   - Each server hosting a NetMail service must have an eDirectory replica of\
    \ the partition containing the users who will use the messaging service.\n+  \
    \ - Make sure the eDirectory tree is synchronized and healthy.\n+   - Make sure\
    \ you have Admin rights to the eDirectory tree where you plan to install NetMail."
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   Decide what you want to name the **Messaging Server** object. The default
    is **server_name Messaging Server**.


    +   Make sure you know the Internet domain your NetMail system will service and
    the IP addresses of primary and secondary DNS servers.


    +   Check for duplicate port assignments on your server. NetMail uses the following
    ports by default:


    # Table 8-6


    | Port | Protocol | Agent |

    | :--- | :--- | :--- |

    | 25 | SMTP | SMTP Agent |

    | 52080 | HTTP | Modular Web Agent |

    | 8018 | HTTP | WebAdmin |

    | 110 | POP | POP Agent |

    | 143 | IMAP | IMAP Agent |

    | 52389 | LDAP | Address Book Agent |

    | 689 UDP | | Connection Manager |

    | 689 TCP | NMAP | NMAP Agent |

    | 52443 | HTTPS | Modular Web Agent |

