- pgno: 10
  md: '# ## SECTION 6


    # ## Provide Personal File Management Services with NNLS


    In this section you learn how to implement Novell™ Nterprise™ Linux® Services
    (NNLS) personal file management services with iFolder®, NetStorage, and Samba.


    # ### Objectives


    +   1. Describe the Purpose and Architecture of iFolder

    +   2. Install and Configure iFolder

    +   3. Describe the Purpose and Architecture of Samba

    +   4. Install and Configure Samba

    +   5. Describe the Role and Function of NetStorage

    +   6. Install and Configure NetStorage


    # ### Introduction


    Most users work on more than one computer to create, manage and use their personal
    files. However, accessing, storing, managing, and synchronizing those files on
    all these different computers (with possibly different platforms) can be a major
    task.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Novell Nterprise Linux Services provides the following file services from a
    Linux server:


    +   * **Novell iFolder.** This product provides access, storage, and synchronization
    of files between a workstation and a central iFolder server.


    +   * **NetStorage.** This product provides secure Internet-based access to files
    and folders on a Linux server in your network through a browser.


    +   * **Samba.** This product provides Windows®-compatible file sharing using
    Microsoft® SMB/CIFS networking protocols.


    In this section, you learn how iFolder, NetStorage, and Samba can help you provide
    network file access and management solutions.


    # Objective 1


    # Describe the Purpose and Architecture of iFolder


    Novell iFolder is a Net services software solution that lets mobile professionals
    access their local files from anywhere—online, offline, all the time—across multiple
    workstations and the Net.


    iFolder automatically and intelligently updates your files across desktop computers,
    laptops, and other connected devices you use, letting you use them wherever you
    happen to be—at the office, at home, or in a hotel.


    All the you need is an active network or Internet connection and the iFolder client,
    a Web browser, or NetDrive.


    For a user, iFolder is like having a single, virtual work folder accessible from
    any computer. It provides a simple, convenient, and secure way to access, back
    up, and synchronize files.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'When connected to the iFolder server, iFolder automatically backs up the work
    done on local files to an account on the iFolder server. Files are always protected
    and easily recovered in the event the local data is lost.


    If the user moves on to a different location and a different computer, iFolder
    automatically synchronizes those files to reflect the work completed elsewhere—with
    no manual disk copies or file transfers required.


    To describe the purpose and architecture of iFolder, you need to know the following:


    +   - iFolder Benefits

    +   - iFolder Features

    +   - iFolder Components

    +   - iFolder Architecture


    # iFolder Benefits


    Analysts agree that up to 80% of a company’s business-critical data resides on
    PCs (desktops and laptops), not networked storage.


    However, up to 96% of all business PCs are not being backed up (Strategic Research
    Corporation).


    According to IDC


    +   - The mobile work force in the U.S., Western Europe and Latin America is expected
    to grow from 34.7 million in 2001 to 60.8 million in 2004.

    +   - 35% of PCs sold to business organizations are laptops.'
  merge: -1
  img_proc: true
- pgno: 13
  md: "With the lack of local data backup and expanding mobile work forces, companies\
    \ need a product that provides easy access to personal files stored on the network\
    \ and a system that automatically synchronizes those files from any location.\n\
    \niFolder addresses those needs (and others) for the enterprise and the user.\
    \ It provides the following benefits:\n\n+   - **Seamless data access.** iFolder\
    \ stores and synchronizes users’ work in such a way that no matter what client\
    \ or what location they log in from, their files are available and in the condition\
    \ that they expect them to be.\n\n+   - **Data safeguards and data recovery.**\
    \ When a user saves a file locally, the iFolder client can automatically update\
    \ data to the iFolder server where it immediately becomes available for an organization’s\
    \ regular network backup operations.\n+   \n+   iFolder also gives Internet Service\
    \ Providers (ISPs) the ability to offer a user-trusted backup solution for their\
    \ customers’ critical business or personal data.\n\n+   - **Reliable data security.**\
    \ With iFolder encryption, stored data is secure from unauthorized network access.\n\
    +   \n+   iFolder encrypts all data before it crosses the Internet and stores\
    \ it on the Novell iFolder server, keeping it out of the hands of unauthorized\
    \ users.\n\n+   - **Productive mobile users.** iFolder does away with version\
    \ inconsistency, making it simple for users to access the most up-to-date version\
    \ of their documents from any connected desktop, laptop, or Web browser.\n\nIn\
    \ preparation to travel or work from home, users no longer have to copy needed\
    \ data to their laptops from various desktop and network locations."
  merge: -1
  img_proc: true
- pgno: 14
  md: 'The iFolder client can automatically update users'' laptops and desktops with
    the most current versions of their files. Even if a user loses a laptop, all those
    files can still be accessed with any computer connected to the Internet.


    +   * **Cross-platform support.** The iFolder server integrates with either the
    Apache Web server on NetWare® and Linux or the Microsoft Internet Information
    Servers (IIS) Web server on Windows 2000.


    Additionally, the iFolder''s LDAP support for user authentication lets you leverage
    Novell eDirectory™ on NetWare, Linux, and Windows 2000 servers, or Microsoft Active
    Directory™ on Windows 2000 servers.


    +   * **Simple data and account management.** iFolder is designed to allow for
    easy setup and management by network administrators.


    The iFolder server can be managed from any location using a standard Web browser.
    With its automatic file updates, synchronization, and encryption, iFolder also
    frees up IT departments from routine maintenance tasks.


    Network administrators also have the option to manage Novell iFolder accounts
    using eDirectory or Microsoft Active Directory (on Windows 2000 servers only).


    +   * **Large-scale deployment.** One of the key features of iFolder is its ability
    to scale to a large and growing environment. You can install iFolder on multiple
    servers, allowing your iFolder environment to grow with your business.


    There is no practical limit to the number of iFolder servers that you can have
    in your iFolder network---a single iFolder server handles up to 10,000 user accounts.
    In turn, each of these servers together acts as 1 system.


    Because iFolder takes care of redirecting user authentication requests to the
    correct iFolder server, the login procedure is a seamless experience for the user.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Plus, as your iFolder network grows, your management costs stay the same, because
    the management of all iFolder servers is centralized through the iFolder Management
    console.


    +   - **Benefits for users.** Novell iFolder provides the following benefits to
    users:

    +       - Guards against local data loss by automatically backing up your local
    files to the iFolder server and your multiple workstations.

    +       - Automatically updates files across the machines you regularly use (work,
    laptop, home) making the view of data the same on all machines.

    +       - Lets you keep files are in a local directory (such as My Documents),
    so you use them the same way you always have.

    +       - Lets you access your files anywhere on the road using a web browser.

    +       - Tracks and logs changes made while you work offline and synchronizes
    those changes when you go online.

    +       - With encryption enabled, protects data as it travels across the wire
    and while stored on the iFolder server.


    # iFolder Features


    In addition to the benefits provided by iFolder, the following are key features
    that make iFolder an effective personal file access and synchronization service:


    +   - **Support for the following network operating systems:**

    +       - NetWare 5.1 with Support Pack 5 or later

    +       - NetWare 6.0 with Support Pack 2 or later

    +       - NetWare 6.5 or later

    +       - Microsoft Windows 2000 Server with Service Pack 3 or later'
  merge: -1
  img_proc: true
