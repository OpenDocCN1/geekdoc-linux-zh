- pgno: 87
  md: 'To configure Samba, you need to know how to do the following:


    +   - Create and Provision Users for Samba Services

    +   - Configure the smb.conf File

    +   - Configure the ldap.conf File


    # Create and Provision Users for Samba Services


    To create and provision users for Samba service access on the NNL S server, do
    the following:


    +   1. Create a LUM user account for each user you want to have Samba access;
    then do the following:

    +      - Create a LUM group

    +      - Assign passwords to the LUM users

    +      - Create home directories for the LUM users


    > Users must be LUM enabled before they can be provisioned for Samba services.


    +   2. Log in to the NNLS server as root.

    +   3. If you want to change any of the default Samba configuration settings (such
    as the workgroup name), use a text editor to modify the **smb.conf** file in */etc/opt/novell/samba*.

    +   4. Samba enable each user you want to have Samba access. You can do this in
    each of the following ways:

    +      - **Use the smbpasswd utility at the command line.** This is the standard
    Samba utility for creating Samba users and setting their passwords.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'For Samba in NNLS, Novell recommends that you use the Linux User Management
    (LUM) functionality in iManager to create users.


    For more information on the smbpasswd utility, see the smbpasswd man page. Keep
    in mind, however, the limited function that Novell has specified for this utility
    in NNLS.


    The syntax for the smbpasswd utility is

    **/opt/novell/bin/smbpasswd -a username**

    where *username* is the LUM username for which you are creating the Samba password.


    +   Enable them as Samba users at the same time you **create them in iManager**.
    This option is available in the same dialog that asks you to LUM enable a user
    (as shown in Section 4.)


    +   Convert them to Samba users after they are created and LUM enabled. This option
    is available when you convert an eDirectory user to a LUM user in iManager.


    If you LUM enable users but opt not to Samba enable them at that time, you can
    always use iManager or the smbpasswd utility to convert a LUM user to Samba at
    a later time.


    +   Specify and confirm the password.


    When a user is Samba enabled, their schema is extended to include a Samba profile.
    The Samba password is the only value given to the Samba profile.


    To avoid confusion, we recommend you use the same password you used for the eDirectory
    user password.


    All users whose accounts have been enabled for Samba access should now be able
    to access shares on the NNLS server as they would folders on a Windows server.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# **Configure the smb.conf File**


    In compliance with Linux Standards Base (LSB) requirements, Novell places the
    Samba configuration file (smb.conf) in the *//etc/opt/novell/samba* directory
    on the NNLS server.


    Novell''s implementation of Samba requires that the smb.conf file contain the
    following entries (which can be edited with a text editor):


    **Table 6-4**


    | Section | Entry Name | Description |

    | :--- | :--- | :--- |

    | [global] | ldap admin dn = | Specifies the Distinguished Name (DN) that Samba
    uses for contacting eDirectory''s LDAP server to retrieve user account information
    for users requesting access to Samba shares. <br><br> The password for the DN
    specified at install time is encrypted by the installation process and stored
    in the secret store (secrets.tdb) on the NNLS server. <br><br> If the DN name
    is changed in eDirectory, the name specified in this file must be changed as well.
    <br><br> If the DN password is changed, the new password must be stored using
    the smbpasswd command. <br><br> **Example:** ldap admin dn = cn=admin,o=novell
    |

    | | ldap ssl = | Specifies that Samba should use SSL for communications with the
    LDAP server (eDirectory). <br><br> Secure LDAP requires that this be set to on.
    <br><br> **Default:** ldap ssl = on |'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Table 6-4


    | Section | Entry Name | Description |

    | :--- | :--- | :--- |

    | | ldap port = | Specifies the port used for secure LDAP communications between
    Samba and the LDAP server (eDirectory). This value can be changed if your network
    uses a different port for secure LDAP communications. **Default**: ldap port =
    636 |

    | | ldap server = | Specifies the LDAP server’s hostname. Either the full DNS
    name or the IP address can be used. **Example**: ldap server = nnls.provo.novell.com
    **Default**: ldap server = *IP address* where *IP address* is the IP address of
    the eDirectory server. |

    | | security = | This specifies the security mode. The value must be set to *user*.
    For more information, see www.samba.org. **Example**: security = user |

    | | encrypt passwords = | This specifies that passwords received from Windows
    clients will be encrypted. This value must be set to *yes*. For more information,
    see www.samba.org. **Example**: encrypt passwords = yes |

    | | workgroup = | This specifies the Windows workgroup that the Samba server will
    either join (if it exists) or effectively create (if the name is new). **Example**:
    workgroup = workgroup |

    | | netbios name = | This is the LDAP name and context of the LDAP (eDirectory)
    server used for secure LDAP authentication. **Example**: netbios name = cn=hamachi,o=novell
    |'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Table 6–4


    | Section | Entry Name | Description |

    | :---- | :---- | :---- |

    | [homes] | comment = | This specifies the name that appears after the Samba server
    name in Network Neighborhood on the Windows client. If this and the following
    2 entries are set as specified, there is no need to specify individual shares
    for users'' home directories. **Default:** comment = Home Directories |

    | | browseable = | This specifies whether all the home directories will appear
    in Network Neighborhood. **Default:** browseable = no |

    | | writable = | This specifies whether users can create and modify files. **Default:**
    writable = yes |

    | Shares (optional) | [Share Name]<br>path =<br>read only = | You can create new
    shares by adding entries of this type to the smb.conf file. **Example:** [DATA]<br>path
    = /export/data<br>read only = no<br>The simple example creates a new share called
    DATA at the point /export/data in the local file system. This share is exported
    with Read/Write access.<br>There are many other options that can be set for a
    share. See the Samba documentation at http://www.samba.org. |



    # Configure the ldap.conf File


    Samba on Linux uses the OpenLDAP client libraries libldap.so and libldap_r.so.
    ldap.conf is the configuration file for OpenLDAP.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'In compliance with Linux Standards Base (LSB) requirements, Novell places the
    ldap.conf file in the /etc/opt/novell/openldap directory on the NNLS server.


    If you install the NNLS server into an existing tree, you must specify a trusted
    root certificate during NNLS installation. The ldap.conf file on your NNLS server
    will then have the following certificate-related entries:


    +   - TLS_CACERT /etc/ssl/certname.cert

    +   - TLS_REQCERT demand


    If you are installing a new directory tree, the ldap.conf file will have the following
    entry:


    +   - TLS_REQCERT allow


    For more information on the ldap.conf file, see the ldap.conf man page.


    # ### How to Access Files Through Samba


    Only users defined as Linux User Management (LUM) users can authenticate through
    the LDAP server and access Samba files on the NNLS server.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'The following illustrates the three options for accessing Samba files:


    # Figure 6-15


    ![](img/d63035f3fce0eaaf97203dde900affb7_93_0.png)


    +   1. Windows users can access Samba files using Windows Explorer:

    +      a. Users navigate to the Samba share in the normal way.

    +      b. Files on the NNLS server are accessed and maintained using Microsoft’s
    CIFS protocol.

    +   2. Windows users can also access Samba files by creating a Web folder.

    +      a. Users create a Web folder to the Samba server in the normal way.

    +      b. Files on the NNLS server are accessed and maintained using the HTTP-WebDAV
    protocol.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '+   3. Browser users can also access their Samba files for downloading to their
    local file systems.


    +   a. To provide browser access to Samba files, you must also install NetStorage
    and create a Storage Location for the Samba server.


    +   b. Browser users can download files for viewing and/or modifying. They can
    then upload modified files. They cannot, however, modify the files directly.


    All file service access is controlled by LDAP-based authentication through eDirectory’s
    LDAP server.


    For example, to access files on an NNLS server from a Windows workstation, do
