  md: '# SECTION 10 Prepare for the Novell CLE Practicum


    Emphasize that these scenarios help students prepare for the NNLS services portion
    of the practicum.


    The scenarios do not include Linux administrator tasks that might be included
    as part of testing LPI Level 1 certification objectives.


    Before students start Scenario 1, you will need to provide them with a clean installation
    of SuSE\* SLES 8.


    In this section, you work through the following scenarios to help you prepare
    for the CLE practicum:


    +   - Scenario 1: Install NNLS (Required)

    +   - Scenario 2: Business Requirements Document 1

    +   - Scenario 3: Business Requirements Document 2

    +   - Scenario 4: Business Requirements Document 3


    The initial scenario is required. You can then select one or both of the remaining
    scenarios (as time permits) to configure NNLS products.


    Scenarios 2, 3, and 4 give you a list of business requirements you need to fulfill
    as network administrator for your Digital Airlines office.


    While some requirements are the same for all 3 scenarios, other requirements can
    change the nature of how you might test or configure the NNLS services to meet
    the same requirements.


    ![](img/d63035f3fce0eaaf97203dde900affb7_284_0.png)


    > In a classroom environment, your instructor will provide a clean installation
    of SuSE\* SLES 8 before you start Scenario 1.'
