- pgno: 213
  md: '# **Configuring the Contexts Serviced by the NMAP Agent**


    The NetMail system services all users in the containers configured in the Context
    property of the NMAP Agent, as shown in the following:


    ![](img/d63035f3fce0eaaf97203dde900affb7_213_0.png)


    The first context was defined when the NMAP Agent was created and is the same
    as the context where the server resides. Additional user contexts can be added
    from the Context page.


    Because NMAP contexts are not inherited, each container or sub-container serviced
    by an NMAP Agent must be added to that agent’s context list.


    Messaging services are automatically provided to every user in the NMAP Agent’s
    assigned contexts. User mailboxes are created in the local message store directory
    the first time users receive a message.


    > Do not add the same context to multiple NMAP Agents.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'NMAP contexts are tracked by the messaging server. When it starts, the messaging
    server generates a list of NMAP contexts and holds it in server memory. This list
    is used to generate aliases and address books.


    Changes made to the list of contexts is dynamically updated. The NetMail service
    doesn’t need to be restarted. However, if users are added to a context while the
    server is running, they won’t appear in the address book until the server is restarted.


    To configure the eDirectory contexts service by the NMAP Agent, do the following:


    +   1. In WebAdmin, expand **Internet Services**.

    +   2. Expand **Messaging Server**.

    +   3. Select **NMAP Agent**.

    +   4. Select **Context**.

    +   5. Select the **magnifying glass** icon.

    +   6. Browse to and select each *container* you want the NMAP Agent to service;
    then select **Save**.

    +   7. Select **Save**.


    # Selecting a Web Interface Template


    Templates control the appearance of the Modular Web Agent’s mail client interface.
    By default, 2 templates ship with NetMail:


    +   - WebAccess (Webacc.CTP)

    +   - WebMail (WebMail.CTP)


    Each template contains everything needed to present its respective client interface.
    When the Modular Web Agent initializes on the messaging server, it simply loads
    the template files into memory.'
  merge: -1
  img_proc: true
- pgno: 215
  md: "To select the default template, do the following:\n\n+   1. In **WebAdmin**,\
    \ expand **Internet Services**.\n+   2. Expand **Messaging Server**.\n+   3. Select\
    \ **Modular Web Agent**.\n+   4. Scroll down to the **Default Template** field,\
