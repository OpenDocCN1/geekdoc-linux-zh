    # Virtual Teams


    To configure and use virtual teams, you need to understand the following:


    +   - Creating a Virtual Team

    +   - Requesting Team Membership

    +   - Performing Virtual Team Management Tasks


    # Creating a Virtual Team


    You can create protected virtual teams. This means that all teams are visible
    in the Virtual Teams list, but access to these teams is available to only members.


    To create a virtual team, do the following:


    1. On the Virtual Office main page, select **Create Virtual Team**.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'The following appears:


    ![](img/d63035f3fce0eaaf97203dde900affb7_261_0.png)


    ![](img/d63035f3fce0eaaf97203dde900affb7_261_1.png)


    +   2. Enter the team *name*.

    +   3. (Optional) Enter a *description*.

    +   4. Select **Create**.

    +   5. When prompted that the team has been created, select **OK**.


    # Requesting Team Membership


    All users can request membership to virtual teams. You must be a member of a team
    to have access to information and services in that team.


    To request membership to a virtual team, do the following:


    +   1. On the Virtual Office main page, select **Join a Virtual Team**.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# The following appears:


    Figure 9-20


    ![](img/d63035f3fce0eaaf97203dde900affb7_262_0.png)


    +   2. Select the team you want to join.

    +   3. Select **Join**.


    Because Virtual Team access is restricted to members, you must request membership
    from the owner of the team. This screen lets you request a virtual team membership.

    After the owner approves your request, you become a member of the team.


    +   4. Select **Request > OK**.


    # Performing Virtual Team Management Tasks


    Management tasks (except for removing your own membership from a team) are restricted
    to the team owner.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'To administer a virtual team, you need to know how to do the following:


    +   - Show Team Members

    +   - Invite Users to Join a Team

    +   - Approve or Deny a Membership Request

    +   - Add Team Owners

    +   - Block Users from a Team

    +   - Edit Team Properties

    +   - Set Notify Preferences

    +   - Delete a Virtual Team


    # **Show Team Members**


    You might want to view a list of all the members of your team to ensure that it
    includes all the users you want as members.


    To show team membership, do the following:


    +   1. On the Virtual Office main page, open your *team*.

    +   2. In the Team Membership column, select **Show Team Members**.


    # **Invite Users to Join a Team**


    After you create a team, you can invite other users to become members of that
    team.


    When you invite a user to join a virtual team, that user has the option to accept
    or reject the invitation.


