- pgno: 168
  md: '# SECTION 8


    # # Provide Web Mail Access with NNLS


    In this section, you learn how to provide email services with the NetMail™ component
    of Novell® Nterprise™ Linux® Services (NNLS).


    # ## Objectives


    +   1. Identify NetMail Features

    +   2. Describe NetMail Components

    +   3. Describe How NetMail Works

    +   4. Install NetMail

    +   5. Configure and Use NetMail


    # ## Introduction


    For any business, providing reliable, standards-based e-mail and calendaring is
    essential to success.


    Organizations that support a large number of deskless workers face the challenge
    of implementing a scalable, reliable system that is economical to deploy and easy
    to manage.


    In addition, these organizations must ensure that the e-mail system is secure
    and accessible from anywhere in the world.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Novell NetMail is a full-featured, easy-to-deploy e-mail and calendaring system
    that simplifies the complexities and lowers the costs of deploying a traditional
    in-house e-mail system.


    NetMail easily integrates with Microsoft® Outlook® and other standards-based e-mail
    clients, enabling you to improve your end-users'' experience without changing
    your IT infrastructure.


    # Objective 1


    # Identify NetMail Features


    Novell NetMail is a scalable, high-performance e-mail and calendaring system that
    is based on Internet-standard messaging and security protocols.


    The key benefit of NetMail is that, generally speaking, it is much less expensive
    than most competing corporate messaging systems.


    In addition, NetMail reduces the cost of ownership because its administration
    interface is very easy to use.


    NetMail is designed to fit multiple network environments. It has been tested successfully
    with as many as 30,000 users on a single Linux® server.


    NetMail has been tested to a level of more than 1.1 million messages a day without
    delivery failures or errors.


    NetMail''s highly efficient distributed architecture minimizes the number of servers
    you need to run your e-mail and calendaring system.


    NetMail architecture is also multithreaded and multiprocessor-enabled, allowing
    you to significantly increase system performance by using a multiprocessor server.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'NetMail runs on the following platforms:


    +   - NetWare®

    +   - Windows® XP/2000/NT

    +   - Solaris®

    +   - Linux®


    NetMail supports Internet-standard messaging and security protocols, enabling
    users to use their preferred current e-mail clients. NetMail supports


    +   - Post Office Protocol version 3 (POP3)

    +   - Internet Message Access Protocol version 4 (IMAP4)


    NetMail is tightly integrated with Novell® eDirectory™. By using eDirectory to
    centrally store and look up all user and server configuration information, NetMail
    lets you manage user accounts, hardware and software configuration, and security
    from a single location.


    This integration simplifies user setup and eliminates the need to synchronize
    changes made to user accounts.


    NetMail supports Secure Sockets Layer (SSL) 3.0, the Open SSL implementation of
    Transport Layer Security (TLS), and Secure Multipurpose Internet Mail Extension
    (S/MIME) protocols for the highest possible levels of encryption and security.


    NetMail can also distribute e-mail and calendaring services across multiple servers.
    This increases performance while preventing critical processes from being interrupted
    by a system failure.


    NetMail supports multiple languages and time zones, simplifying the exchange of
    critical messaging and scheduling information between remote offices, customers,
    and business partners.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Objective 2


    # Describe NetMail Components


    NetMail has a highly modular architecture that provides flexibility without compromising
    system integrity. Product functions are strategically divided among several different
    components so you only have to install the components you need.


    Based on usage and system resources, you can load those components on a single
    server or distribute them across multiple servers.


    NetMail is composed of the following components:


    +   - Internet Services Container

    +   - Messaging Server

    +   - Parent Objects

    +   - Templates

    +   - List Servers and Mailing Lists

    +   - NetMail Agents

    +   - Installation Directories

    +   - WebAdmin'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/d63035f3fce0eaaf97203dde900affb7_172_0.png)


    ![](img/d63035f3fce0eaaf97203dde900affb7_172_1.png)


    A general description of each component is provided below.


    # *Internet Services Container*


    During your initial NetMail installation, the installation program extends the
    Novell eDirectory schema and creates the *Internet Services Container* object
    at the root of your eDirectory tree.


    Because it is part of NetMail, the Internet Services container differs from other
    eDirectory Container objects.


    There can only be one Internet Services container per tree and, as the messaging
    system container, it contains only NetMail component objects.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# **Messaging Server**


    A messaging server is any server on the network that hosts 1 or more NetMail agents.
    In the cDirectory tree, the *Messaging Server* object represents the physical
    server where you have installed the NetMail software.


    The Messaging Server object is represented as a container with server attributes.
    It contains 1 or more Agent objects and it defines the messaging server’s properties.


    Each Messaging Server object is associated with a Server object.


    You can implement your entire messaging system on a single server or you can distribute
    NetMail services across multiple messaging servers.


    In environments with multiple messaging servers, the servers can be configured
    to work together as a single, integrated messaging system called a *distributed
    environment*. They can also be configured to operate as independent sub-systems
    called *standalone environments*.


    # **Distributed Messaging Servers**


    In a distributed messaging system, multiple messaging servers work together as
    a single, integrated system.


    Distributed messaging servers look for other Messaging Server objects in the Internet
    Services container. If a Messaging Server object or an alias of that object exists
    in the Internet Services container, other distributed messaging servers can find
    and interact with it.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'A typical distributed messaging system is shown in the following:


    ![](img/d63035f3fce0eaaf97203dde900affb7_174_0.png)


    Distributed messaging servers are most often used in larger organizations. These
    organizations typically require multiple messaging servers to provide load balancing,
    fault tolerance, and speed.


    # Standalone Messaging Servers


    A standalone messaging server does not interact with other messaging servers.
    Instead, it acts as an independent messaging system, exclusively providing all
    NetMail services to the users within its assigned contexts.


    A standalone configuration is shown in the following:


    ![](img/d63035f3fce0eaaf97203dde900affb7_174_1.png)'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'To configure a standalone messaging server, you must mark the **Distributed
    Processing Disabled** option in the messaging server’s properties. This prevents
    the messaging server from looking for other Messaging Server objects in the Internet
    Services container.


    You could consider a standalone system if your organization experiences a moderate
    amount of messaging traffic or if your organization’s network environment includes
    slow WAN links.


    # Parent Objects


    *Parent objects* enable you to subdivide a single messaging system into configuration
    subunits. This lets you collectively manage agent services and user settings for
    specific sets of users.


    For example, in a multidomain environment, you can create separate Parent objects
    for each domain. This lets you manage every domain as if it were a separate messaging
    system.


    The Parent object also lets you selectively grant access to messaging services.
    You can enable or disable different agent services for each Parent object.


    For example, in an ISP environment, you could use Parent objects to give one Hosting
    Domain access to POP and another access to IMAP, allowing them to bill for individual
    services.


    Parent objects can also be used to distribute administrative tasks. Selected users
    can be given rights to create, delete, modify, or import user accounts in specific
    Internet domains.


    Agents running on both distributed and standalone messaging servers dynamically
    look up the user’s Parent object in the tree to determine what rights the user
    has to the service.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'The **Parent Container** is created in the Internet Services container during
    installation. This container is the centralized location for Parent objects. NetMail
    Agents reference the Parent container when looking up user configuration information.


    # **Figure 8–4**


    ![](img/d63035f3fce0eaaf97203dde900affb7_176_0.png)


    A Parent object must be represented in the Parent container in order for NetMail
    Agents to find it. If a Parent object is created elsewhere in the tree, it must
    be represented by an Alias object in the Parent container.


    # Templates


    The Modular Web Agent provides 2 template-based, mail client interfaces:


    +   - WebAccess

    +   - WebMail'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# **Figure 8-5**


    The WebAccess interface provides standard mail client functionality as well as
    calendaring, scheduling, tasks, and notes. You can also use the WebAccess interface
    to give selected users access to NetMail administrative functions such as adding,
    modifying, and deleting user accounts.


    ![](img/d63035f3fce0eaaf97203dde900affb7_177_0.png)


    # **Figure 8-6**


    WebMail also provides standard mail client functionality; in addition, you can
    use the WebMail interface to give users access to self-administration features
    like changing passwords and configuring vacation messages.


    ![](img/d63035f3fce0eaaf97203dde900affb7_177_1.png)'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Webacc.CTP and WebMail.CTP each contain everything needed to present their
    respective client interfaces; images, web pages, and localized text are all compiled
    in these 2 template files.


    When the Modular Web Agent initializes on the messaging server, it simply loads
    the template files into memory.


    The WebAccess and WebMail objects must be created in the tree before they can
    be loaded on the messaging server or selected in the Modular Web Agent, Parent,
    and User objects.


    The *Template* container is created in the Internet Services container during
    installation. This container is the centralized location for template objects.
    The Modular Web Agent references the Templates container when scanning for available
    templates.


    > A Template object must be represented in the Templates container for the Modular
    Web Agent to find it. If a Template object is created elsewhere in the tree, it
    must be represented by an Alias object in the Templates container.


    # List Servers and Mailing Lists


    The NetMail List Agent lets you create and maintain the following:


    +   - List Server

    +   - NDS Mailing Lists

    +   - Mailing Lists Container


    # List Server


    A list server is a compilation of user email addresses. When a message is sent
    to the List server, the message is automatically forwarded to every user who has
    subscribed to the list.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'List User objects represent the members of a list. When users subscribe to
    a list, a List User is added to the respective Mailing List object.


    You can also add list members by creating List User objects within the Mailing
    List object.


    # NDS Mailing Lists


    NDS mailing lists allow you to send messages to eDirectory users.


    Unlike Mailing Lists, NDS Mailing Lists are made up of eDirectory objects rather
    than user email addresses. Selected eDirectory objects can include


    +   - Container objects

    +   - Groups

    +   - Organizational roles

    +   - Aliases

    +   - User objects


    If a container object is selected, messages are forwarded to the users within
    the designated Container object.


    # Mailing Lists Container


    The Mailing Lists container is created in the Internet Services container during
    installation. This container holds all of the messaging system''s available Mailing
    List objects.


    The List Agent references the Mailing Lists container when scanning the message
    queue for messages addressed to mailing lists.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'A Mailing List object must be represented in the Mailing Lists container in
    order for the List Agent to find it. If a Mailing List object is created elsewhere
    in the tree, it must be represented by an Alias object in the Mailing Lists container.


    # NetMail Agents


    *NetMail agents* are a set of executables that perform specific product functions.
    These agents have plug-and-play versatility. They can be combined in a variety
    of configurations and still maintain the functionality of a single, integrated
    messaging system.


    ![](img/d63035f3fce0eaaf97203dde900affb7_180_0.png)


    This building block architecture enables NetMail to be easily distributed across
    multiple servers. Depending on agent usage and system resources, each agent can
    run by itself or in conjunction with other agents on a messaging server.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Table 8-1


    The table below lists all the NetMail agents and summarizes their functions in
    the NetMail system.


    | Agent | Function |

    | :--- | :--- |

    | **Address Book Agent** | The Address Book Agent provides read-only LDAP access
    to eDirectory. Using this agent, any LDAP3-compliant application (such as email
    or address book clients) can access address book information from eDirectory.
    |


    | | Information returned about each user depends on the user’s privacy level.
    |'
  merge: -1
  img_proc: true
- pgno: 182
  md: '**Table 8-1** *(continued)*


    | Agent | Function |

    | :--- | :--- |

    | Alias Agent | The Alias Agent enables your NetMail system to recognize user
    aliases. The Alias Agent can also be used to automatically populate the User object''s
    Internet E-mail Address property.


    The automatic aliasing feature pulls information directly from eDirectory to generate
    aliases for eDirectory User objects. Aliases can be automatically generated in
    the following formats:


    * Firstname_Lastname@Domain

    * First Letter+Lastname@Domain (This alias option is limited to eight characters.)

    * Firstname.Lastname@Domain

    * First.M. Last@Domain

    * First_M_Last@Domain


    The aliases created via the Alias Agent are not defined as Alias objects in eDirectory.
    They are maintained by the Alias Agent and are specific to the NetMail message
    system.


    Existing Alias objects are recognized by NetMail, but they function independently
    of the Alias Agent. Messages addressed to Alias objects are automatically delivered
    to the associated user''s mailbox by the NMAP Agent.


    Aliases can also be defined manually. |

    | AntiSpam Agent | The AntiSpam Agent automatically lets you build a blackout
    list of undesirable email domains and addresses.


    Messages sent from domains and email addresses contained in the blackout list
    are not accepted by the NetMail system. |'
  merge: -1
  img_proc: true
- pgno: 183
  md: '| **Agent** | **Function** |

    | :--- | :--- |

    | AntiVirus Agent | The NetMail AntiVirus Agent integrates with the following
    virus applications to provide virus scanning on messages handled by NetMail:<br>•
    McAfee® NetShield®<br>• Command® Antivirus<br>• Computer Associates® InnoqualeIT®<br>•
    Symantec® CarrierScan™<br>You must install one of these products before you can
    use NetMail’s AntiVirus Agent.<br>If a message contains a virus, the AntiVirus
    Agent immediately deletes it from the message queue.<br>It can be configured to
    return the message to the sender with a notice indicating what virus the message
    contained.<br>It can also send a virus alert to the intended message recipients
    indicating who tried to send the message and what virus the message contained.<br>Virus
    scanning can be enabled for all users in the messaging system or it can be limited
    to a group of users.<br>Virus scanning is enabled at the Parent or User objects.
    |


    # **Table 8-1** *(continued)*'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Table 8-1 *(continued)*


    | Agent | Function |

    | :--- | :--- |

    | **AutoReply** | **The AutoReply Agent lets users create custom messages that
    are automatically sent in response to incoming mail.** |

    | | For example, when users go on vacation, they can create a message that lets
    others know they are unavailable. |

    | | The AutoReply Agent also enables users to forward their messages to another
    email address. Users can specify if they want to retain a copy of the message
    in their NetMail mailbox or simply redirect the message to the designated address.
    |

    | | In addition to forwarding messages to another email address, the AutoReply
    Agent can forward SMS messages to cellular phones and pages. |

    | | The AutoReply Agent is not email client specific. Users’ forward and autoreply
    information is stored in their User objects. |'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# **Table 8-1** *(continued)*


    | **Agent** | **Function** |

    |---|---|

    | **Calendara Agent** | The Calendaring Agent provides automatic status-tracking
    information for scheduled appointments, tasks, and notes. <br>When a user schedules
    a calendar event, the Calendaring Agent processes all "Accept" and "Decline" responses
    and automatically updates the event''s status information in the organizing user''s
    calendar. <br>Only the user who schedules the event can view who has accepted
    or declined a calendar event. Attendees only see their own status; every other
    attendee is viewed as pending. <br>If you choose not to run the Calendaring Agent,
    users receive I-cal status messages in their Inbox. Because the status information
    is in I-cal format, the event organizer might not be able to discern whether a
    recipient has accepted or declined the appointment. <br>I-cal mail clients, such
    as Microsoft Outlook* XP, also provide automatic status tracking for scheduled
    appointments. <br>If you are exclusively using an I-cal compliant mail client,
    you can choose to either have NetMail manage status tracking via the Calendaring
    Agent or to have the mail client manage status tracking. <br>If you are using
    the Modular Web client, you must run the Calendaring Agent to provide automatic
    status tracking for scheduled appointments. |'
  merge: -1
