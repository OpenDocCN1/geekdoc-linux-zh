- pgno: 57
  md: 'When the user logs in, the Java applet will show the user''s data and he can
    download the file that was previously deleted.


    The Java applet and NetDrive are good choices because they don''t sync data, they
    only give access.


    # ### Delete User Data on the Server


    If a user cannot remember his password, you can delete the user data on the iFolder
    server and then have the user log in again. When he logs in, he will be prompted
    to enter a new password.


    Do the following:


    +   1. Before you delete the user account, the user must do the following to prevent
    data loss during an account reset:

    +       a. Copy data from the current local iFolder directory to another local
    directory on the user workstation, and then delete the local iFolder directory.

    +       b. Uninstall the iFolder client from the user workstation by doing the
    following:

    +           a. Select **Start > Settings > Control Panel > Add/Remove Programs
    > Change or Remove Programs**.

    +           b. Select **Novell iFolder client**; then select **Change/Remove >
    Yes**.

    +       c. Go to the iFolder Web site to download the iFolder client software.

    +       d. Follow the download and installation instructions to install the iFolder
    client.

    +       e. If the User ID, Password, or Encryption Pass phrase have changed, enter
    the new values during the reinstallation of the iFolder client.

    +       f. Move the user data to the newly created local iFolder directory.'
  merge: -1
  img_proc: true
- pgno: 58
  md: "+   g. Do one of the following:\n+   - Wait for the files to synchronize automatically.\n\
    +   - Right-click the iFolder icon in the system tray; then select **Sync Now**.\n\
    +   \n+   Once the user completes these steps, you can delete the user account.\n\
    \n+   2. In the iFolder Management console, select **User Management**.\n\n+ \
    \  3. Log in with your Admin *username* and *password*.\n\n+   4. Search for a\
    \ specific user if you know the unique user ID; if not, find the user by doing\
