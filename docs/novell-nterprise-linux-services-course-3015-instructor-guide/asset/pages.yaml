- pgno: 113
  md: '□ **Directory location**: The location of the directory on the file system.
    The location is a URL that includes the file system type, server name, volume,
    and directory path.


    If the storage being accessed is on a NetWare server, the URL must be in the following
    format:

    `ncp://server_name/volume/path_to_directory`


    For example:


    `ncp://server1.digitaalair.com/mkgt/reports`


    *or*


    `ncp://111.222.3.4/mkgt/reports`


    If the storage being accessed is on a Linux server, the URL must be in the following
    format:

    `cifs://server_name/cifs_share_name`


    If the file system is omitted, it is assumed that it is NCP.


    □ **Context**: The directory context that the Storage Location object resides
    in.


    You can select the Object Selector icon to browse to and select the context.


    □ **Comment**: For the administrator only; it is not displayed to users.


    +   5. When you finish, select **Create**; then select **OK**.


    # Create a Storage Location List


    After you create a storage location object, you must create a list of storage
    location objects that can be used with a specified user, group, profile, or container
    object.


    Users see the directory associated with the object the next time they log in.
    After this list is created, you can modify it from the same window by assigning
    additional storage location objects to the list or by deleting storage location
    objects from the list.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'To create a storage location list, do the following:


    +   1. Launch a browser and start iManager by entering the following:

    +      **https://IP_or_DNS/nps/iManager**

    +   2. Log in by entering your *username* and *password*.

    +   3. At the left under **File Access (NetStorage)**, select **Storage Location:
    Create/Modify List**.

    +   4. Select the **Object Selector** button; then browse to and select the user,
    group, profile, or container object that the list is to be created for.

    +   5. When you finish, select **OK**.

    +   6. Select the **Object Selector** button; then select the *storage location
    objects* you want included in this list.

    +   7. When you finish, select **OK**.

    +      You can select multiple storage location objects in the Object Selector
    window. When you select multiple Storage Location objects, they appear in the
    Selected Objects list.

    +      If the list already contains storage location objects and you want to add
    more, ensure that the original objects are still in the list before selecting
    OK.

    +      You can remove existing storage locations by deleting their names from
    the list before selecting OK.

    +   8. When you finish creating or modifying the list, select **OK**.'
