- img_proc: true
  md: '# 338 Part V: Help!


    Possible reasons for this message are that the system doesn''t have any space
    for this kind of thing. Occasionally you get this message on very busy systems
    when you try to run something or if you start dozens of background processes (refer
    to Chapter 13).


    Solution: Wait a minute and try the command again. If you have lots of background
    processes, get rid of some of them. If you see this message often, complain to
    your system administrator.


    # No space left on device


    Meaning: The disk is full.


    Probable cause: Either your files take up too much space or someone else''s.


    Solution: Delete something to make space. If you don''t think that you can or
    you don''t have any large files, talk to your system administrator. She probably
    already has gotten the same message and is checking to see who is taking up the
    space.


    # Not a directory


    Meaning: UNIX needed the name of a directory, but you typed a filename or the
    name of something else.


    Probable cause: Either you spelled a directory name incorrectly or you forgot
    to create a new directory.


    Example: You type this line:


    ```

    cd /gillian

    ```


    but no directory is named /gillian.

    Solution: If you are referring to a new directory you planned to create, make
    it first by using the mkdir command. If you are referring to an existing directory,
    get the spelling right. Use the command to see how it''s spelled.


    # Permission denied


    Meaning: You don''t have permission to do whatever the last command you tried
    to do.'
