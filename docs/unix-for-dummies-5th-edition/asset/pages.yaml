  md: '# 36 Part I: Before the Beginning


    # You say may-to-to, I say tomadohto


    A frequent concern of newcomers to Linux is how to pronounce it correctly, in
    order not to sound unfound. It''s simple: However you pronounce it is wrong —
    or right, depending on your audience. Among English speakers in the United States,
    at least, opinions seem to be divided between "Line-ucks" and "Linn-ucks."


    The name Linux is derived from the first name of its creator, Lin Torvalds. The
    "Line-ucks" group holds the pronunciation is based on


    the usual English pronunciation of Linus. Linus Torvalds himself, though, a Swedish-speaking
    Finn, has helped provided an audio file on the Internet in which he the definitive
    answer in both English and Swedish. In the file, he says, "This is Lee-ooks Torvalds,
    and I pronounce Lee-ooks as Lee-ooks." It''s up to you whether to say "Linux"
    with a Swedish accent, but to ours his sounds much closer to the Anglicized "Linn-ucks,"
    so that''s what we use.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_59_0.png)


    In Chapter 14, we tell about the latest releases of the most popular versions
    of Linux. In Chapter 26, we describe many ways you can get additional information
    about Linux, including reading one of a number of Usenet news-groups about Linux
    or subscribing to a Linux magazine.


    # Where''s Linux?


    Linux development happens mostly on the Internet, and if you have an Internet
    connection, you can download the entire system on charge. You do not need a fast
    connection or great patience because the system takes up several CD-ROMs full
    of data. A typical 5 Kbps dialup connection takes about a day and a half to download
    a version of Linux. Quite a few bulletin boards around the world make Linux code
    available. A more practical approach is to buy or borrow a CD-ROM version of Linux,
    which you can install in an hour or so.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_59_1.png)


    Sounds great, doesn''t it? You can install a version of UNIX on your very own
    computer! Keep in mind one tiny snag: however That makes you the system administrator.
    You will learn how to create user accounts, deal with disks that fill up, and
    install and configure software. It not impossible (far from it — John has done
    it for years), but you have much to learn.


    The details of installing and setting up Linux are beyond the scope of this book.
    In Chapter 14, we barely touch on a few basics of administering a Linux system.
    For more details, take a look at Linux For Dummies, 5th Edition, by Dee-Ann LeBlanc
    (published by Wiley Publishing, Inc.); and Running Linux, by Welsh and Kaufman
    (O''Reilly & Associates).'
