  md: '# 180 Part III: Getting Things Done


    The compress program replaces the file with one that has the same name .Z added
    to it. The degree of compression depends on what''s in the file, although 50 percent
    compression for text files is typical. For a few files, the compression scheme
    doesn''t save any space, in which case compress is polite not to make a .z file.


    To get the compressed file back to its original state, use uncompress:


    ```

    uncompress confidential.txt.Z

    ```


    This command gets rid of confidential.txt.Z and gets back confidential.txt. You
    can also use zcat, a compressed-file version of the cat program, which sends an
    uncompressed version of a compressed file to the terminal, without storing the
    uncompressed version in a file. The command is rarely used by itself but can be
    quite handy with programs, such as more or ip. You can use it this way:


    ```

    zcat confidential.txt.Z | more

    ```


    This command enables you to see one page at a time''s in the file. Unlike uncompress,
    zcat does not get rid of the .Z file.


    The GNU group weighed in its with one compress-like program named gzip. It works
    the same way that compress does, but uses a different, slightly better, compression
    scheme. The gzip program is analogous to compress. gzip and zcat compress uncompress.
    Use them this way:


    ```

    gzip -v confidential.txt

    gzip confidential.txt.gz

    zcat confidential.txt.gz | more

    ```


    Note that the lines show how lower gz than uppercase Z.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_203_0.png)


    Fortunately, gzip knows how to compress files produced by compress as well as
    those produced by several other compression programs, so you can use gzip as your-stop
    compression utility.


    Yet another compression program, called bzip2, comes with companions bunzip2 and
    bcat. You use the same way as gzip, except that the files it make with bzip2 are
    a little smaller than the equivalent gz files. Downloaded files from the Web are
    compressed with bzip2. If your system doesn''t have bzip2 installed, you (or maybe
    your local helpful nerd) can find it at http://sources.redhat.com/bzip2. Here''s
    how you use them:


    ```

    bzip2 v confidential.txt

    bunzip2 confidential.txt.bz2

    zcat confidential.txt.bz2 | more

    ```'
