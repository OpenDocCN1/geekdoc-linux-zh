  md: '# Chapter 20: Now Serving the Internet


    # Getting Served


    Suppose that you decided to forego the expense and hassle of hosting your site.
    You opted to pay your Internet service provider a reasonable monthly fee (probably
    around $20) to give you space on one of its Web servers. On your own computer,
    you create and store the Web pages you want to put out, or post, on the Internet.
    You can see them by using your own browser, although no one else can see them
    until you upload them to your ISP''s servers.


    Usually, you upload your Web pages to a Web server using FTP (see Chapter 19 to
    find out how to transfer files). Ask your Internet service provider (or whoever
    knows the Web server you are using) where to put your Web page files. Also ask
    whether you need to give any special commands to tell the Web server about your
    files.


    Here are some tips for uploading Web pages:


    +   - Because Web pages are text, you upload your Web pages as ASCII (not binary)
    files. Graphics files are not text, so upload them as binary files.

    - If you create Web pages on a PC or Mac and upload them to a UNIX-based Web server,
    check the capitalization of your filenames.


    +   - Name your main Web page with the name index.html, which is the default Web
    page name. If you omit the filename from a URL when you''re retrieving a Web page,
    your Web browser usually gets the index.html. For example, if someone types the
    URL http://www.greattaps.com/, the Web browser displays the index.html file on
    that.


    # Web Servers Galore


    If you''re hosting your own Web site, you have to get a Web server, install it,
    configure it, and keep it running. Choosing the UNIX Web server package that fits
    best for you is a question of finding the right set of features at the right price.
    (In the case of Apache, the right price happens to be free.)


    Most UNIX and Linux distributions include, for free, Web servers along with server
    software for other Internet resources, such as databases, e-mail, and FTP. Lots
    of Web servers are available, but the most people use is Apache.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_320_0.png)'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Part IV: UNIX and the Net


    # Not too patchy


    Turn the wayback machine to 1999 — the Pleistocene era in the computer world.
    A fellow named Rob McCool was to leave the hollow halls of the National Center
    for Supercomputing Applications (NCSA) at the University of Illinois. His legacy:
    the most popular Web server software in the world, the HTTP daemon, and HTTP.


    After Rob leaves the NCSA, work on HTTP pretty much things. Webmasters on HTTP,
    keep using it. Because they''re resource UNIX hackers, many of them add new stuff
    and fix broken stuff. A year later, many of these additions (called patches in
    computer lingo) Bay Area hackers Behrendendorf and Cliff Skolnick recruit to pull
    them together, and publish all these patches in a new release of HTTPd. The result
    is the first version of the Apache server, which sees the light of day in April
    1995.


    Why Apache? Because it''s a “patchy server,” based on some existing code and a
    slew of patches. Well, you asked.


    Over the years, the original team of eight contributors grows to about 20, with
    hundreds of users weighing in with ideas, new code, and documentation. This team
    of about 20 volunteers from around the world makes up the Apache Group. The Apache
    Group uses “the Internet and the Web to communicate, plan, and develop the server
    and its related documentation.”


    For the Apache server, 1998 was a banner year. As June 1998, Apache ran on more
    than 48 percent of all Web sites (estimated 1,100,000 sites). Running a distant
    second were at 22 percent of (non-UNIX servers). Netscape servers accounted for
    less than 10 percent of all Web sites.


    The clock ahead to 2003, and Apache continues its dominance, despite Microsoft''s
    best efforts to push its Windows-based servers. Surveys show upwards of 60 percent
    of all Web sites run Apache, with Microsoft''s IIS a distant second at about 25
    percent.


    # Apache and PHP are king


    The Apache Web server is free and popular. It runs on every UNIX you can think
    of, including Linux. (Versions for Windows are also available, but much less popular).
    In fact, it''s the most popular Web server of any kind in use today (see the sidebar
    “Not too patchy” for details). If you''re on the Web, surf to the home page of
    the Apache HTTP Server Project, at www.apache.org, for information and downloads.


    PHP is a programming language designed to be built into Web pages. Although it''s
    developed separately from Apache, PHP is designed to be integrate with Apache,
    and most pre-configured versions of Apache include PHP. By putting little bits
    of PHP into a Web page, you can make major customizations'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Chapter 20: Now Serving the Internet


    on the fly. For example, in our home page at http://net.gurus.com, the Reader
    Quote of the Day section uses some PHP code to insert the day''s comment from
    a daily file so we don''t have to edit the Web page every night. Using a lot of
    PHP, you can write large, beautiful Web applications, as you see in the next section.


    The other popular language people use for Web work is Perl, often with the duct
    tape of the Internet. Although building bits of Perl into Web pages is possible,
    more commonly it''s used with CGI scripts, programs that run in a response to
    a request from a browser and build a Web page from scratch. As programming languages
    go, Perl is relatively easy to learn and use, although it''s still definitely
    a programming language. Perl For Dummies, 4th Edition, by our friend Paul Hofmann
    tells you more.


    Most sophisticated Web applications also need a database to handle the dynamic
    data for the site. UNIX has plenty of those, too. The two most popular ones are
    MySQL and PostgreSQL, both of which are packaged with UNIX and Linux systems.
    They both work well; MySQL while PostgreSQL has more complete data management
    abilities. If you need a really serious database, Oracle or IBM is happy to give
    you all the database you need to run on UNIX or Linux system.


    # Building a Web site with almost no work


    Use someone else''s work, of course. A remarkably large amount of PHP and Perl
    code is available for free on the Internet, which is quite good. Drop by our sister
    site http://privacydummies.com, for example. We put in the beautiful graphics
    and sparkling with witty contents (one of our co-authors did), but all of the
    technical code that manages the articles, votes in polls, user registrations,
    and all of the other flashy features of the site come from a package with the
    name Postnuke, an extremely powerful and flexible management system written in
    PHP and MySQL available for free at www.postnuke.com. You need to download Postnuke,
    or the parts of it you need, install it as a Web site on your server, and then
    start up and configure it. A fair amount of work is involved, but it''s about
    0.1 percent of the work of writing something like that from scratch.


    If you look around, you can find everything from online calendars to blogging
    to shopping carts to online photo albums available for free in PHP or Perl. A
    good place to start looking is http://dmoz.org/Computers/Programming/Internet/Server_Side_Scripting.'
  merge: -1
