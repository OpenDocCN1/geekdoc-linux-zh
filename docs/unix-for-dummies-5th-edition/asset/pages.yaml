  md: '# Chapter 17: Automating Your Office Gossip 251


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_274_0.png)


    # What’s all this junk at the beginning of the message?


    An e-mail message has a **header** that the message program (mail, elm, Pine,
    or whatever) creates automatically. The header consists of these:


    the message, and sometimes (for incoming messages) the arcane route the message
    took to get to you


    +   - The address (to the person to receive the mail)

    - The From address (to return address)

    - The Cc addresses (the addresses to send copies to)

    - The Bcc addresses (the addresses to send blind copies to)

    - The subject

    - Optional information you rarely use, such as expiration date, priority, which
    mail mailed


    Don’t worry if the header looks like gobbledly-gook — on incoming mail, the header
    can have sorts of extra glop that reports on which systems has passed along, which
    program was used to send the mail, and lots of other stuff. You don’t need to
    know, unless the mail is spam, and you want to complain; you want to send the
    header along with the e-mail you’re complaining about, so the wizards on the other
    end can decipher it and figure out to blame.


    You can specify cc addresses, the subject, and other information for messages
    you send.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_274_1.png)


    This list shows some cool things you can do when you’re writing your message:


    +   - For lots of helpful information on how to use Pine, you can press Ctrl+G.
    Pine has complete online help.

    - You can even check the spelling of your message — just press Ctrl+T. Pine checks
    all the words in your message against its dictionary and highlights each word
    it can’t find.


    # I’m priming for some mail


    To read your mail, press the i key to see the index of messages, as shown in Figure
    17-2. The messages are numbered, with codes (N for new messages you haven’t read,
    D for messages you deleted, and A for messages you answered) in the left margin.
    One of the messages is highlighted.'
