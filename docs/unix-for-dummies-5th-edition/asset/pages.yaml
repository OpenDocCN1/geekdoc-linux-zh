  md: '# Chapter 16: Across a Crowded Network


    The worst practical problem is that, if a program stalls while it is waiting for
    a dead NFS server, you have no way to stop or kill the program, short of rebooting
    your UNIX computer.


    Recent versions of NFS have features called soft and hard mounts (not indent as
    they sound, but close) that make stopping a program that has stalled waiting for
    a dead server possible. The problem is that, if a server is merely slow and not
    dead (and believe us, a server loaded with hundreds of clients can be indescriptively),
    a client may assume that the server is dead and stop a program. Had the client
    been a little more patient, the server would have responded, and the program could
    have completed its task.


    # The UNIX/Windows Accords


    Sometimes UNIX computers are on networks with computers running operating systems,
    such as Windows 98, Me, NT, 2000, or XP. How do you get your UNIX and Windows
    computers to communicate with each other?


    When computers want to speak to one another, they can''t just check data at one
    another indiscriminately. They have to use what''s known in computer-ese protocols.
    Protocols are sets of rules by which computers exchange data and commands. If
    two computers know the same protocols, they can talk turkey, even if one of them
    is running UNIX and the other is running Windows.


    Computers use all kinds of protocols to communicate. On a network, clients connect
    to servers by using protocols, such as TCP/IP (Transmission Control Protocol/Internet
    Protocol) and IPX (Internetwork Packet Exchange). Computers connected by way of
    the Internet exchange files as FTP (File Transfer Protocol) and HTTP (HyperText
    Transfer Protocol).


    # Let''s Samba


    The particular protocol of interest here is the Server Message Block, or SMB,
    protocol has been around in one incarnation or another since 1987, when Microsoft
    and Intel (the chip maker) first defined it. Because they helped to invent SMB,
    Microsoft includes an SMB client in all its versions of Windows. Any server that
    can talk SMB, therefore, can do business with a Windows computer, so the Windows
    computers can use disks and printers on the server just like on a Windows NT server,
    for example.'
