- img_proc: true
  md: '# 224 Part IV: UNIX and the Net


    Real-time terminal communication has been likened to talking to someone on the
    moon because it''s so slow: It''s limited by the speed at which people type. Here
    on Earth, because most of us have telephones, the most sensible thing to do is
    to send a one-line message asking the other user to call you on the phone.


    The simpler real-time communications is write. If someone writes to you, you see
    something like this on your screen:


    ```

    Message from johnl on iecc (tty) [ Wed Jan 6 20:28:42 ] ...nTime for pizza. Please
    call me at extension 8649

    <OT>

    ```


    Usually the message appears in the middle of an editor session and scrambles the
    file on your screen. You will be relieved to know that the scrambling is limited
    to the screen — the editor has no idea that is writing to you. The file is okay.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_247_0.png)


    In vi or emacs, you can tell the editor to redraw what''s supposed to be on-screen
    by pressing Ctrl-L (if you''re in input mode in vi, press Esc First).


    To write to a user, use the write command and give the name of the user to whom
    you want to talk:


    > write dguertin


    After you press Enter, write tells you absolutely nothing, which means that it
    is waiting for your message. Type the message, which can be as many lines long
    as you want. When finish, press Ctrl+D (the general end-of-input character) or
    the interrupt character, press Ctrl+C or Delete. Because the write command copies
    every line to the other user''s screen as you press Enter, reading a long message
    sent by way of the write command is sort of reading a poem on Burma-Shave signs
    as you do by each one.


    You want to send an important message, for example, to your friend Dave, so you
    type these:


    > write dguertin

    Yo, Dave, turn on your radio. WBUR is broadcasting

    Terry Gross''s interview with Nancy Reagan!


    You press Enter at the end of each line. After the last line, you press Ctrl+D.'
