    # Redirecting input


    Redirecting input is useful less than redirecting output, and we can''t think
    of a single, simple example in which you would want to use it. Suffice to say
    that you redirect input just like you use the < character rather than the > character.


    # Gurgle, Gurgle: Running Data through Pipes


    The process of redirecting the output of one program so that it becomes the input
    of another program can be quite useful. This process is the electronic equivalent
    of whisper-down-the-lane, with each program passing information to the next program
    and doing something to the information being whispered.


    To play whisper-down-the-lane with UNIX, you use a pipe. The symbol for a pipe
    is a vertical bar |. Search your keyboard for this character. It''s often on the
    same key as \ (the backlash). Sometimes the key shows the vertical bar with a
    gap in the middle, although the gap doesn''t matter. If you type two commands
    separated by |, you tell UNIX to use the output of the first command as input
    for the second command.'
