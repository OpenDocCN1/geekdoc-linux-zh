  md: '# No such file or directory


    Meaning: UNIX can''t find a file or directory with the name you typed.


    Probable cause: You spelled a filename or pathname wrong. This problem happens
    to most of us ten times a day. If you typed a pathname, you may have misspelled
    any of the directory names it contains. You may also have capitalized something
    incorrectly.


    Example: You typed this line:


    ```

    cp june.bugdet june.budget, however — it''s june.budget.

    ```


    Solution: Check your spelling and capitalization. Use the ls command to see how
    the file and directory names are spelled and whether they have any uppercase letters.
    For the pathname, check to see whether it begins with a slash (which means it
    is an absolute pathname that describes the path from the root directory) or not
    (which means it is a relative pathname that describes the path from the working
    directory). See Chapter 6 for more information about pathnames.


    # No such process


    Meaning: UNIX can''t find the process you are referring to.


    Probable cause: You have given a command that talks about processes, probably
    a kill command to stop a runaway process.(Chapter 23 describes what a process
    is and why you might want to kill the process.)


    Solution: The process may already have gone away, in which case no problem exists.
    You may have mistyped the PID that specifies which process to do in. Check your
    typing and use the ps command to check the PID.


    # No more processes


    Meaning: Your system can''t create any new processes.


    Probable cause: This message appears when you tell UNIX to create a new process,
    and UNIX can''t do it. Refer to Chapter 23 for information about processes.'
