- img_proc: true
  md: '# 320 Part V: Help!


    To restore files on Linux from a tape, type


    ```

    tar xvf /dev/rft0 "somedir/*"

    ```


    To restore from diskettes, type


    ```

    tar xvmf /dev/fd0 "somedir/*"

    ```


    If you want to see which files are on the tape and not restore any of them, use
    one of these commands:


    ```

    tar tvf /dev/tape

    pax -v f /dev/tape

    ```


    You should try to make the restore command from the same directory where the program
    that made the backup tape ran. If it''s a system backup, that''s probably the
    root directory (/).


    To restore from ZIP disks or CD, push the disk in the drive, tell UNIX to mount
    the disk (mounting CDs to read them just fine), then copy the backed up files
    from /z or /cdrom wherever the disk is mounted. Then tell UNIX to unmount it and
    pull the disk back off the shelf.


    # Backup strategies


    The obvious way to tape backups is to copy the entire contents of the disk to
    a tape every night. Here are a couple reasons, however, that it may not be the
    best approach:


    +   - The disk may contain too much to fit on a tape. Tape and disk manufacturers
    routinely battle to see which one can outstrip the other. The battle has seen-saw
    back and forth—as we write, disks are far ahead you can buy a 160GB disk for $200,
    but a 160GB tape costs about $1,000, and the tapes are $90 apiece.


    +   - Because you may not notice for a day or two that you clobbered something
    important, a scheme that gives you a few days'' grace to get your data back would
    be nice.


    Murphy''s Law says that the system will fail as it''s writing a backup tape, so
    you had better depend on one tape.


    The best scheme is a combination of rotation and incremental backups. With rotating
    backups, a set of tapes is used in rotation; five tapes, one written every Monday,
    one every Tuesday, and because each tape is written only once a week, if you delete
    a file by mistake on Tuesday, the file is still on the Monday tape until the following
    Monday. You then have nearly a week to realize it''s gone and get it back. The
    number of tapes you use depends on your budget and your paranoia. Some people
    use few as two, but as many as seven. (We use eight, for each day of the week
    and an extra to rotate off-site.).


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_343_0.png)


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_343_1.png)'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# Chapter 22: The Case of the Missing Files


    With incremental backups, you back up only what has changed. Generally, the disk
    do a full backup of everything since the last at frequent intervals — once a month,
    for example. This process may take five or six tapes, because you do only once
    a month, it''s not that bad of a job. For daily incremental, you back up what
    has changed since the last backup (it should fit on a single tape). Any given
    file is either on the full backup (if it hasn''t changed in a long time) or on
    the current backup, so you have only two places to look.


    If you have a large tape budget, you may want to have two sets of tapes you use
    alternately for


    full backups, in case your system fails while it is writing the full backups.
    Sometimes backups are stored off-site in a bank vault or other safe place, but
    a trade-off exists: the security of the vault versus the inconvenience of going
    to the bank when you need to recover a file. If you''re really careful, you can
    have two backups: one off-site and one on-site.


    Your system administrator should handle all this, of course. It''s useful to understand
    at least the rudiments of backup theory, however, so that when the administrator
    handles several different tapes that may contain your file, understand why.


    # Three Ways Not to Lose Files


    Now you''re probably quaking in your boots (or sandals, depending on where you
    live). You figure that, if you do so much as the keyboard, you will do horrible,
    irreparable damage and spend the next week spinning tapes. It''s not that bad.
    This section tells you some tricks to avoid deleting files by mistake in the first
    place.


    # Are you sure wanna clobber this one?


    When you delete files with rm, use the -i (for interactive) switch:


    ```

    rm -i*

    ```


    This line tells rm to ask you before it deletes each file, prompting you with
    the filename and a question mark. You press the y if you want to delete it, and
    anything else to tell UNIX not to delete. (Remember that the question UNIX asks,
    "Should I delete this?" and not "Do you want to keep this?")


    The main problem with -i is that it can become tedious when you want to delete
    a large number of files. When you do that, you probably use wildcards. To be safe,
    check that the wildcards refer to the files you think they do. To make that, use
    the ls command with the same wildcard. If you want to delete all the files that
    start with section, for example, and you think that you can get away with typing
    only sec and an asterisk, you had better check what sec* refers to. First give
    this command:'
  merge: -1
