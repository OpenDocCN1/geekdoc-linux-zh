  md: '# 88 Part II: Some Basic Stuff


    # Why those numbers?


    You may well ask why those particular numbers are assigned to permissions. They
    weren''t assigned at random. For those of you remember New Math from fourth grade,
    all this makes sense if you think in binary (base 2). Think of every permission
    digit as a three digit binary number, like 010 (that''s binary for 2). The first
    digit is 1 if you have read permission, or 0 if


    don''t. The second digit is 1 if you have write permission, or 0 if you don''t.
    The third digit is 1 if you have read permission, or 0 if you don''t. So, the
    permission digit 6, or is 110 in binary, which means you can read and write, but
    not execute. If this subject still doesn''t make sense, find a way to work it
    out for you.


    When permissions are expressed as a number, it''s a three-digit number. The first
    digit is the owner''s permissions, the second digit is the group''s permissions,
    and the third digit is everyone else''s permissions. Every digit is a number from
    0 to 7. Table-5-1 lists what the digits mean.


    | Table 5-1 | Absolute Permissions Decoded |

    | Digit | Permissions |

    | 0 | None |

    | 1 | Execute only |

    | 2 | Write only |

    | 3 | Write and execute |

    | 4 | Read only |

    | 5 | Read and execute |

    | 6 | Read and write |

    | 7 | Read, write, and execute |


