  md: '# 16 Part I: Before the Beginning


    # # Password Smarts


    Like every UNIX user, you should have a password. You can get along with a password
    only under these circumstances:


    +   - You keep the computer in a locked, windowless room to which you have the
    only key, and it''s not connected to any network.

    - You don''t mind whether unruly 14-year-olds borrow your account and randomly
    insert dirty knock-knock jokes in the report you''re supposed to give to your
    boss tomorrow.


    The choice of your password deserves some thought. You want something easy to
    remember but difficult for others to guess. Here are some bad choices for passwords:
    single letters or digits, your name, the name of spouse or significant other,
    your kid''s name, your cat''s name, or anything fewer than eight characters. (Bad
    guys can try every seven-letter password in less than a day.)


    Good choices include such things as your college roommate''s name misspelled and
    backward. Throw in a digit or some punctuation, capitalize a few letters to avoid
    confusion, so that you end up with something like yeLLAs12. Another good idea
    is to use a pair of words, like fat;Head.


    You can change your password whenever you''re logged in, by using the passwd program.
    It asks you to enter your old password to prove that you''re still you when you
    logged in (computers are notoriously skeptical). The passwd program asks you to
    enter your new password twice, to make sure you type it, if not incorrectly, at
    least consistently. None of the passwords you type appears on-screen, of course.
    We show you how to run the passwd program in Chapter 2.


    Some system administrators do something called aging; this strategy makes you
    change your password once in a while. Some administrators put rules in the passwd
    program to enforce which passwords are permissible, and even assign passwords
    chosen randomly. The latter idea is terrible because the only way you can remember
    a password you didn''t choose is to write it on a sticky note and stick it on
    your terminal, which defeats the purpose of having passwords.


    In any event, be sure no other than you knows your password. Change your password
    whenever you think someone else may know it. Because UNIX stores passwords in
    a scrambled form, even the system administrator can''t find out yours. If you
    forget your password, the administrator can give you a new one, but she can''t
    tell you what your old one was.'
