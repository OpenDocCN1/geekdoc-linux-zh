  md: '# 212 Part III: Getting Things Done


    # The root of all UNIX


    UNIX is a multi-user world, and that includes Linux: Lots of people can use the
    computer at the same time, by connecting to remote locations. The first thing
    you need to know about administering a Linux system is the difference between
    the user called root and every other user. Root (also kindly called the superuser)
    is the system administrator. This account has all the privileges to change things
    on the system. If you want to add users, install some software, or even turn off
    the computer, you must be logged in as root. If you''re logged in as someone other
    than root and you try to do anything related to system administration, your computer
    responds with a barrage of "permission denied" messages. It''s nothing personal.
    It''s just the computer''s way of telling you that in a multi-user environment,
    it doesn''t just anyone messing around with it— only the one person it trusts,
    which is root.


    "Fine," you''ll say log in root all the time and not have to worry about running
    into those pesky permission problems." Bad idea! The root account to do non-system-administration
    tasks is dangerous because sometime— eventually, when you expect it—you type a
    command you really didn''t want— oh, deleting all the files on the hard drive
    it more frequently than you think. If you''re logged in as someone other than
    root, the computer replies with a simple "permission denied." If you''re root,
    though, the damage is done, and Linux (or any other version of UNIX) does not
    have an undeletable command! Remember that permissions are your friends!


    # Adding a user


    Assuming that you''re convinced about not logging in root unless really must,
    you have to add a user account for yourself (or for others) to use everyday tasks.
    Suppose that you want to create the username bobbyjoe for yourself. To add this
    user, log in root (because adding users is one of those special, privileged tasks
    that only root can perform) and at the prompt type the command adduser bobbyjoe.
    The computer creates the new user and then, if you''re lucky, it reminds you,
    you have to add the password for the new user. Whether or not the computer reminds
    you, you have to add the password by typing password bobbyjoe. Then enter the
    password when the computer asks for it. It asks you to enter the password twice,
    just to make sure that you typed correctly.'
