  md: '# Part II: Some Basic Stuff


    # Seeing double


    The -d option tells pr to double-space the printout. Type this command:


    ```

    pr -d myfile | lpr

    ```


    This command also puts a title on every page. Use -d -t to avoid that:


    ```

    pr -d t myfile | lpr

    ```


    # One column can''t contain me


    If the lines in your file are short, you can save paper by printing the file in
    multiple columns. To print your file in two columns, for example, type


    ```

    pr -2 myfile | lpr

    ```


    Astute readers probably can guess what the options -3, -4, and up to -9 do (If
    you''re not feeling astute today, these options specify the number of columns
    you want.) Columns normally run down and then across the page, as they do in newspapers.
    If your file contains a list of items, one per line, and you want to print them
    in columns, you want to change the order in which the lines print. If you want
    to print items across the page and move down to the next line, and so on (which
    is nowhere near cool), use the -a option in addition to the 2 or 3 option.


    For a truly baffling effect, you can arrange to print several files side by side
    with the -m option:


    ```

    pr -m firstfilefile | lpr

    ```


    This command prints the first line of every file on the first line of the printout,
    the second line of every file on the second line, and so on. You can specify as
    many as nine filenames and have them print side by side in skinny little columns.
    We have never been able to figure out a use for this option, although it is definitely
    a way to produce odd printouts.


    # Troff, Nroff, Groff!


    It''s not a rabid dog. It''s a typesetting program. The troff program is the "typesetter
    runoff" that has been part of UNIX since the 1970s. The nroff program is "new
    runoff" (as of after 1972), which formats documents for simple printers without
    fancy fonts. The groff program is the GNU (refer to Chapter 2) version of troff,
    which, like every other GNU program, does all the'
  merge: -1
