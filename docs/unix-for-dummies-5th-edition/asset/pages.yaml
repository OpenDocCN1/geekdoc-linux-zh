    is to wait until someone sends a message to you and then reply to it. All mail
    programs have a command (usually r) that replies to the message you just read.
    Messages almost always have return addresses, and the r command enables you to
    send a message without typing an address.


    # Sending mail to people “out there"


    If your computer network has phone connections to the outside world, you can possibly
    send mail to people out in the wide world of the Internet. Check with your system
    administrator or other e-mail users to find out your organization is “on the Net”
    (connected to the outside world).


    To correspond with people on the outside, you need an Internet address for the
    person you want to send mail to. After you have the address, type exactly how
    she wrote it. Internet addresses to look like this:


    ```

    ellenz@persimmon.greattapes.com

    ```


    The part in front of @ is the person''s username. The rest of the address is the
    name of the mail server and other information about where it is, usually the name
    of the company. The computer name, company name, and so on connected by periods.
    The last three letters tell you what kind of organization it is: com is for companies,
    for example, and edu is for educational institutions. Sometimes the parts of the
    address spell out the city, state, and country where the computer is located.
    It is all very well understood, really.


    If you are on the Internet, you can also exchange mail with users of commercial
    services, such as CompuServe and America Online (AOL). For details, see the following
    sidebar, “Sending mail to people we use online services."


    When you are typing Internet addresses, keep these points in mind:


    +   Be sure you don''t type any spaces in the middle of the address. Don''t use
    spaces in usernames or computer names or on either side of the @ or period.

    - Don''t capitalize anything unnecessarily. Check the capitalization of the person’s
    username and computer name. Most addresses are composed entirely of small letters.

    - Don''t forget the periods that separate the parts of an Internet address.'
