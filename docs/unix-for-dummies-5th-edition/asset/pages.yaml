- img_proc: true
  md: '# 360 Part VI: The Part of Tens


    # Read a book


    Yeah, we know: You may have (or not) just read this book. We mean read another
    book. Here are a few you may like:


    +   - Levine and Young, UNIX For Dummies Quick Reference, 4th Edition; Wiley Publishing,
    Inc. (Big surprise.) The Quick Reference has essential information from the book
    you''re reading and a detailed command reference, squashed down into a smaller,
    less expensive, pocket-size form.


    +   - UNIX in a Nutshell; O''Reilly. A complete UNIX reference, the one turn to
    memory fails. It comes in various editions for different versions of UNIX and
    is intended for more advanced users than your UNIX For Dummies Quick Reference.


    +   - LeBlanc, Linux For Dummies, 5th Edition: Wiley Publishing, Inc. This one
    tells how to survive installing, using, administering, and networking Linux, for
    beginners with some technical tolerance.


    +   - Welsh and Kaufman, Running LINUX, 4th Edition; O''Reilly. All about installing
    and using Linux, it''s medium technical but quite informative.


    +   - Naba Barkakati, Red Hat Linux Secrets; Wiley Publishing, Inc. This one covers
    a wide range of topics, from hardware debugging to using Linux in your business.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_383_0.png)


    # Join a user group


    The major UNIX group is called Usenix, and dates back to about 1976; it is traditionally
    for technical users. It sponsors annual conferences and publishes a newsletter.
    Visit www.usenix.org/ to see what it''s up. You can also find local and regional
    user groups; you tend find out about these groups from notes posted on physical
    or electronic bulletin boards. User groups can be great sources of help because
    chances are good that someone already has run into many of the same problems you
    have and has some ideas that may help.'
