  md: '# Instant script — just add water


    For those of you who know what a shell script is, you can use the history command
    to create an instant script. (For those of you who don''t, read Chapter 12.)


    Here''s how to use the history command to create a script. Give in the commands
    you want to include, in the order in which you want to occur. Then type history
    to display the list of commands. Note how many of the previous commands you want
    to include in the script; for each example, perhaps it''s the last eight commands.
    Type a command like this (for the C shell):


    If you use BASH,


    ```

    history 8 > myscript

    ```


    In the Korn shell, type


    ```

    fc -1 8 > myscript

    ```


    This command lists the last eight commands and stores them in a file myscript.
    Requesting from your history list more than you think you need is a good idea,
    because you delete them from your script. You have to use a text editor to clean
    up the script anyway, deleting the command numbers and times.


    ```

    history -h 8 myscript

    ```


    the C shell repeats number 3 on the list (in this case, ls -al).


    You can also repeat a command with a modification. Suppose that you want this
    command:


    ```

    find -name budget.04 print

    ```


    Now you want to give the find command, but this time you''re looking for a file
    named budget.05. Rather than tediously, redo the line, character by character
    and keystroke by keystroke, worrying about a possible typo with every key you
    press, you can tell the C shell to repeat the last command, substituting 05 for
    04. The command is


    ```

    ^04^

