    The FrontPanel puts the desktop front and center.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_84_0.png)


    At the center of the FrontPanel are four buttons, named One, Two, Three, and Four.
    These buttons let you manage as many four workspaces. The idea is that the desktop
    is in reality four times as large as your computer screen; in other words, your
    computer screen shows only one-quarter of your desktop at a time. Each quarter
    is a workspace. You can have different icons, program windows, and whatever set
    up in each workspace, all of which stay and reappear as you left them every time
    you return to the workspace. you may decide one workspace for managing your UNIX
    environment, one workspace to dealing with all your communications (e-mail, FTP,
    networking), one workspace to your favorite games, and one workspace to doing
    work (such as writing emails to peas and how to eat them). Rename the workspace
    buttons Looks, Comms, Games, and Peas so that you can remember which workspace
    is which, and then switch among your workspaces by clicking the buttons. (We recommend
