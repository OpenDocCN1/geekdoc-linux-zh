  md: '# Chapter 19: Grabbing Files from the Net


    +   - Pay attention to restrictions on access times noted in the welcome message.
    Remember that servers are in time zones all over the world. If the server says
    to use it only between 6 p.m. and 8 a.m., but it''s in Germany, and you''re in
    Seattle, you can use it between 9 a.m. and 11 p.m. your time.


    +   - Do not upload material unless you''re invited to. (And don''t upload material
    inappropriate to a particular archive — we hope that this advice would be obvious,
    but experience suggests otherwise.)


    # Mirror, mirror, on the Net, where''s the file 1 want to get?


    Many archives are mirrored, which means that the contents of an archive are copied
    mechanically from the home server to other servers. Usually, the mirroring systems
    are larger and faster than the home server, getting material from the mirror is
    easier than from the home system. Mirrors are updated daily, so everything on
    the home system is also at the mirrors.


    When you have a choice of mirrors, use the one that''s closest to you. You want
    the one that''s closest in terms of the number of network links between you and
    it. Because the number of hops is practically impossible to figure out, however,
    use the mirror''s physically closest. In particular, use because international
    network links are relatively slow and congested.


