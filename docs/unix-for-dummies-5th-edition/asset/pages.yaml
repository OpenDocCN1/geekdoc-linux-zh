  md: '# 316 Part V: Help!


    # Ways to Try to Get Files Back


    Now you''ve done it: You clobbered something important, and you really,

    really want it back.


    If you''re used to other systems, such as Windows, in which you can magically

    delete deleted stuff back from the Recycle Bin, we''re sorry to tell you that
    UNIX

    des''t let you do that (unless you''re lucky enough to be using a UNIX desk-

    top a Trash tool; see the section in Chapter 4 about talking ''trash''). If it''s

    gone, it''s gone.


    # Copies, copies, everywhere


    Maybe you have stashed away in a different directory other copies of the file

    deleted. For our important files, we stick copies in a directory named

    save (or something similar). Also, sometimes you can reconstruct the refor-\mation
    from a different form. If you clobber a word processor file, for exam-

    ple, you may have a backup version (the .bak file mentioned earlier in this

    chapter) that''s close to the current version. You may have printed the

    deleted file to a file (rather than directly to the printer) and can edit the
    print

    file back into document form.


    If you share your computer with other people or use a network, whether

    someone has a copy. It''s a rare file that exists in only one place.


    # Call in the backup squad


    It''s really gone, huh? Now it''s time for the final line of defense: backups.
    You

    h backups, don''t you?


    We interrupt this chapter for a stern lecture: Always make backups. If your

    system administrator is on the ball, backups are made automatically

    eight. All you have to do is go to the administrator, with chocolate-chip

    cooks in hand, and ask politely for some help in getting your valuable file

    back from the previous night''s backups. If no backups exist, it''s fair to jump

    up and down until someone that had better on the ball.


    Seriously, backups are a standard part of any administrator''s job, by either

    making the backups personally or overseeing operators who do the backing

    up. (After the procedures are set up, making backup tapes is so simple that

    y can practically train your dog to do it. One reason that it sometimes

    doesn''t get done is that backing up is boring.


