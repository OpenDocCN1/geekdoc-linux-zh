  md: '# Chapter 17: Automating Your Office Gossip


    system doesn''t realize that e-mail messages actually contain stuff other than
    text. MIME (Multipurpose Internet Mail Extensions) is the most widely used method.
    MIME is built into all current mail programs, so they handle auto-matically. When
    you hear about e-mail with attachments, that generally means MIME. When we describe
    mail programs, we tell you whether they work with MIME.


    Before sending a line using a MIME attachment, you may want to send a plain old,
    nonattached e-mail message to the intended recipient, asking whether he can handle
    MIME. Some mail systems reject, discard, all e-mail with attachments. Because
    the e-mail worms and viruses everyone complains about attachments, this is often
    a security policy. Good news! Your UNIX system is probably immune to most e-mail
    worms.


