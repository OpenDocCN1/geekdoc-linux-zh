  md: '# Chapter 4: Opening Windows on UNIX


    Then do it again or three times because you never get it right on the first try.
    Motif also has grab bars (thin, gray borders) on the top, bottom, and sides of
    every window, which enable you to change the height of a window without changing
    the thing again, or vice versa.


    Some programs have strong feelings about how big their windows should be. In some
    cases, they don''t let you shrink the window to less than a minimum size. In other
    cases, you can''t change the size. For some programs, attempts to resize just
    doesn''t work. You can click and drag the borders all you want, but nothing moves.


    Motif has a shortcut to enable a window to fill the entire screen. Click the little
    box-in-box at the right end of the title bar. If you do the the same thing again,
    the window shrinks back to normal size.


    In practice, we rarely blow up to full-screen size because few UNIX programs take
    advantage of the entire screen. The full-screen option was much important when
    screens were smaller.


    # Getting rid of windows


    Your screen opens cluttered with windows you no longer need. You already know
    how to turn them into icons to get most of the screen space back, but sometimes
    you just want to make the program go away.


    If 57 different programs are running, even if most of them are snoozing behind
    icons, it can put enough of a load on your computer to slow down ones you want
    to use.


    Most programs have a natural way to exit. In terminal windows, you log out from
    the shell by typing exit or logout in the terminal window. Real windows-oriented
    programs usually have menus of their own with a Quit or Exit option that cleans
    up and makes the program stop. Because some programs just don''t work, however,
    you have to take drastic measures.


    In Motif, click the little bar at the end of the title bar; a menu of window options
    pops up, as shown in Figure 4-6. The Restore, Move, Size, Minimize, and Maximize
    choices are equivalent to the border-clicking techniques we discussed in the preceding
    section. (Minimize is Motif-like for though, The Lower option pushes the window
    behind all the rest so it doesn''t obscure any other windows. That option is useful
    when you want to work on something for a while. Close closes the window and usually
    also ends the program it started. This option can be handy for programs that get
    stuck or don''t have any normal way to exit.'
