  md: '# Chapter 10: Writing Deathless Prose


    # # Shy vi, the Princess of Text Editors


    The vi text editor can claim a unique status among UNIX editors: Almost every
    UNIX system in the universe has vi. This fact makes it a good editor to know if
    you plan to be moving from system to system, because you can always count on it
    being there. Someone may have other reasons for using vi, but use of it is not
    foremost among them.


    To run vi, type vi, a space, and the name of the file you want to edit, and press
    Enter.


    If you get an error message when you try to run vi, talk to your system administrator.
    If the screen looks weird, your terminal type may not be set right — another reason
    to talk to your system administrator.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_176_0.png)


    # ## Editor à la mode


    The most distinctive feature of vi (and the one that has spawned legions of vi-haters,
    along with a few devotees) is that it is a modal editor. The vi program is always
    waiting for one of two things: commands or text (also known as input). When vi
    is waiting for a command, it is in command mode. When it is waiting for text,
    it is in input mode. Normally, it is up to you to figure out which mode vi is
    in at any particular moment — it doesn''t give you a clue.


    Most commands are one letter. Some are lowercase letters, and others are uppercase
    letters. When you type commands, be sure to use the correct capitalization.


    If you are in input mode and want to give a command, press the Esc key.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_176_1.png)


    # ## Emergency exit from vi


    | To escape from vi, follow these steps: | 2. Type the following line and press
    Enter: |

    |---|---|

    | **1. Press Escape at least three times.** | :q! |

    | The computer should beep. Now you are in command mode, for sure. | This line
    tells vi to quit and not save any changes. |'
  merge: -1
