  md: '# Hey, I! know the filename!


    With luck, you know the name of the file you have lost. If so, you can use the
    find program to find it. When you use find, you tell it the name of the file and
    the place to start looking. The find program looks in the directory you indicate
    and in all directory''s subdirectories.


    Suppose that you''re working in your home directory. You think that file named
    tiramisu is in somewhere. Type this line:


    ```

    find -name tiramisu -print

    ```


    That is, you type these elements:


    +   - find (just like you see here)

    - A space.

    - The directory in you want the program to begin looking. If it''s the working
    directory, you can type just a period (which means “right here”).

    - -name (to mean that you will specify a filename).

    - Another space.

    - The name of the file you will find (tiramisu, in this case).

    - Another space.

    - -print to tell UNIX to print (on-screen) the full name, including the directory
    name, to let you know where UNIX finds the file. If you omit this step and finds
    the file, it doesn''t tell you. (We know that this situation is stupid, but computers
    are like that.) If you use UNIX SVR4 or Solaris, you''ll notice the find command
    is fixed so that it warns rather than runs


    The find program uses a brute-force approach to locate your file. It checks every
    file in all your directories. This process can take quite a while. After find
    finds the file, it prints the name and keeps going. If the program finds more
    than one file with that name, find finds them and reports them all. After find
    finds a found file, you usually will want to stop the program (unless you think
    that it will find more than one match). You stop find by pressing Ctrl+C or the
    Delete key.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_144_0.png)'
