  md: '# Chapter 17: Automating Your Office Gossip


    You can play with a lot of the other settings. One setting you shouldn''t touch
    is the HTML mail setting. By default, KMail plays nice and sends plain text e-mail.
    We like plain text e-mail. It gets words in it. You can configure KMail to send
    HTML mail, with the same problems HTML mail always has. Just go there!


    KMail''s toolbar may be confusing at first. Just hover the mouse over a button,
    and you get an actual description of what it does. For instance, the button that
    looks like a dog-eared sheet of paper with an envelope in front of it is the New
    message button. Using KMail is otherwise a lot like any other mail program.


    # E-Mail with Evolution


    Using Evolution as an e-mail client and not using any of its other features is
    probably silly. It''s amazing. It does everything. It probably has a hidden "bring
    about world peace" menu item. It does calendar stuff; it does everything. But
    if you can''t read your e-mail in it, who cares? After you have your e-mail run-ning,
    you can explore the other stuff at your leisure.


    Follow these steps to set up e-mail in Evolution.


    +   1. Select Tools:Settings.

    The Settings window opens.

    2. Click the Mail Accounts button on the left side.

    3. Click the Add button on the right side of the window.

    A wizard starts that is somewhat similar to the one Mozilla uses to ask you all
    the questions it needs answers to.

    4. Click Next.

    5. Enter your name and e-mail address, and then click Next.

    The Reply-To and Organization fields are optional. Organization is generally the
    organization you are associated with — your employer, for work e-mail. Reply-To
    is a special header used to tell people where to send replies to your mail. You
    only set it if you want to go to an address other than the e-mail address you
    entered, and you probably don''t have any reason to do that.

    6. Select the POP option from the pop-up list of server types.

    New fields appear.'
