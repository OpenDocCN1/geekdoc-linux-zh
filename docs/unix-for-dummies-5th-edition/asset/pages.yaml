  md: '# Chapter 4: Opening Windows on UNIX


    # GNOME applications


    Like KDE, GNOME provides a handful of applications that share its look and feel
    settings. The names aren''t standardized as the KDE ones — you can just tack a
    K on the front of a word and expect it to do something — but it sounds cooler
    that way. Table 4-2 lists some of the more common GNOME applications.


    | Table 4-2 | Common GNOME Applications |

    | --- | --- |

    | Application | What It Does |

    | Evolution | E-mail client |

    | Nautilus | File manager |

    | Galeon | Web browser |


    GNOME, like KDE, comes with a broad selection of games to play. Tired of Solitaire?
    There are a dozen more games where that came from. The exact set of games installed
    varies from one system to another, but you can count on finding something fun
    than working.


    # Evolution


    Okay, we lied. Calling Evolution an e-mail client is like calling an aircraft
    carrier a bigger boat. Evolution does everything: contact management, scheduling,
    synchronizing with a Palm Pilot, you name it. But it also does e-mail. It''s a
    lot like Outlook Express, only it won''t send e-mail to your entire address saying
    you love them. See Chapter 17 for details about the e-mail parts of Evolution.


    # Getting around


    GNOME offers multiple workspaces, which are all the rage in UNIX window managers,
    and have the same basic approach to interfaces that KDE does. Right-clicking is
    always a good bet if you want options. For instance, you want to move a window
    from one workspace to another, just right-click the title bar, and select one
    of the Move options.


    If you''re looking for help, try pressing F1 whenever you''re lost or confused.
    Most of the time, GNOME brings up some online help for you.'
