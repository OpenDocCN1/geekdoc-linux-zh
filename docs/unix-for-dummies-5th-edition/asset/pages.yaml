    # FrontPanel and center


    FrontPanel is similar to the control center for the desktop. Actually, it''s more
    like the dashboard of a fancy car, which puts all the car doorkhies and widgets
    within easy reach of the driver. As all the elements of the desktop, you can customize
    the FrontPanel. Figure 4-7 shows a typical set of FrontPanel icons, buttons, and
