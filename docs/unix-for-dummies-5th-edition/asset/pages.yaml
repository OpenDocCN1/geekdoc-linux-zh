    # Chatting with Other People

    on Your Computer


    After you figure out who is on your computer, you may want to send them a

    message. Message sending has two general schools. The first is the real-time

    school, where which message appears on the other user''s screen when you

    weebly because it''s an extremely urgent message. The write and

    talk enables you to do that. Excessive use of real-time messages is

    good way to make enemies quickly, however, because you interrupt people''s

    work all over the place. Be sparing in your blather.


    The second school is electronic mail, or e-mail, in which you send a message

    the other user looks at when it''s convenient. E-mail is a large topic in its
    own

    right, so save that for Chapter 17.'
