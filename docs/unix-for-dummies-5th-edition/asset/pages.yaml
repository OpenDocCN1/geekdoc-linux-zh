  md: '# Part I: Before the Beginning


    # # If a train stops at a train station,

    what happens at a workstation?


    A workstation is a computer with a big screen, a mouse, and a keyboard. You may
    say, "I have a PC with a big screen, a mouse, and a keyboard. Is it really a workstation?"
    UNIX zealots get into long arguments over this, for our purpose we say that is.
    Most current UNIX systems are workstations.


    Turning on a workstation is easy enough: You reach for the back and turn the switch.
    Cryptic things that appear on-screen tell you that UNIX is going through the long
    and not-at-all-interesting process of starting up. Starting up can take anywhere
    from ten seconds to ten minutes, depending


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_33_0.png)


    # ## What you were hoping we wouldn''t tell you:

    The difference between a PC and a workstation


    First, you have to understand that this isn''t a technical question — it''s a
    theological question. Back in the old days (about 1970), telling the difference
    was easy. A workstation had a large graphical screen — at least, by the standards
    of days — a megabyte of memory, a fast processor, a connection, and cost $10,000.
    A PC had a little less, 64K of memory, a slow processor, a floppy drive, and cost
    more like $4,000.


    These days, your $2000 PC has a big screen (much nicer than the workstation used
    to have), hundreds of megabytes of memory, a fast Pentium processor, big speakers,
    and a network connection. It''s much better than what people used to call a workstation.
    What if you make a PC workstation? Oh, no. Modern workstations have even better
    screens, buckets of memory, a bocharged processor — you get the idea. What''s
    the difference?


    Maybe it''s the software that people use: Most workstations are designed to run
    UNIX (or, in a


    few cases, proprietary systems similar in to UNIX), whereas PCs run Windows or
    Macintosh. Wait — some perfect versions of UNIX on PC hardware, and Windows 2000/NT
    runs on many boxes that everyone agrees are workstations, and the latest version
    of Mac OS is underneath. Now you can get no assurance about the speed of the connection
    between the guts of the computer on one hand and the disks, screens, and networks
    on the other hand and argue that workstations have faster connections than PCs,
    but some don''t fit it, either.


    As far as we can tell, if a computer is designed to run Windows or the Mac OS,
    it''s a PC. If its designed to run UNIX, this distinction feels binary and arbitrary
    to, you understand perfectly. Here at UNIX For Dummies Central, we have a couple
    of PCs running UNIX (which makes them look, to our eyes, just like workstations)
    and a couple of other, smaller ones running Windows. Works for us.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Chapter 1: Log Me In, UNIX!


    on the version of UNIX, number of disks, phase of the moon, and so on. Sooner
    or later, UNIX demands that you log in. To find out how, skip to the “Logging
    In: U(NIX) Can Call Me Al,” later in this chapter.


    Turning off a workstation is a more difficult problem. Workstations are jealous
    of their prerogatives and do punish you if you don''t turn them off exactly the
    right way. Their favorite punishment is to throw away all the files related to
    whatever you were working on. The exact procedure varies from one model of workstation
    to another, so you have to ask a local guru for advice. Typically, you enter a
    command along these lines:


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_34_0.png)


    ```

    shutdown +3

    ```


    This command tells the workstation to shut down (in three minutes, in this example).
    With some versions of UNIX, that command is too easy. The version we use most
    often uses this command:


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_34_1.png)


    If you use Linux, type this command to shut down the system right away:


    ```

    shutdown now

    ```


    The workstation then takes awhile to put a program to bed or whatever it makes
    it important, because it knows that you''re waiting there, tapping your feet.
    Eventually, the workstation tells you that it''s finished. At that point, turn
    it off right away, before it gets any more smart ideas.


    An approved method for avoiding the hassle of remembering how to turn off your
    workstation is never to shut off your computer (although you can turn off the
    monitor). That''s what we do.


    # A dumb terminal


    The traditional way to hook up to a UNIX system is with what''s known (sneeringly
    as a dumb terminal. Nobody makes dumb terminals any more, but Windows PCs have
    a natural ability to play dumb, so they''re commonly pressed into duty as terminals.
    You run a terminal emulator program on a PC, and suddenly the mild-mannered PC
    turns into a super UNIX terminal. (Truthfully, it''s the other way around: You
    make a perfectly good PC that can run Doom and other business productivity-type
    applications act like a dumb terminal that can''t do anything on its own.)'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# 12 Part I: Before the Beginning


    When you finish with UNIX, you leave the terminal emulator, usually by pressing
    Ctrl+X or equally arcane combination of keys. (Consult your local guru: No standardization
    exists.) Like Cinderella at the stroke of midnight, the terminal-emulating PC
    turns back into a real PC. To turn it off, you wait for the PC''s disks to stop
    running (carefully scrutinizing the front panel until the little red or green
    lights go out) and then reach around and turn off the big switch. If you don''t
    wait for the lights to go out, you''re liable to lose some files.


    If you have a network installed, which these days has become so cheap that nearly
    everyone does, your PC running Windows has a network connection to your UNIX system.
    Windows 95/98/Me/NT/2K/XP, and the Mac OS (the Macintosh operating system) have
    the network stuff built in.


    If you have a network connection, you can use programs telnet, ssh, or putty (described
    in Chapter 16) to connect to your UNIX system. After one of them is running and
    connected to your UNIX system, within your program''s window you get a faithful
    reata of a 1970s dumb terminal and you can proceed to log in.


    After you connect, you use it to communicate with the computer that is running
    UNIX. If the terminal is wired directly to the computer, UNIX asks you to log
    in before you can do anything else (see the section "Hey, UNIX! I Want to Log
    In," later in this chapter). If not, you may have to perform some additional steps
    to call the computer or otherwise connect to it.


    An terminal is similar to an extremely stripped-down workstation that can run
    one program— the one that makes UNIX work. (See Chapter 4 to find out what Windows
    are — don''t. It''s all the same to us.) Turning an X terminal on and off is pretty
    much turning a regular dumb terminal on and off. The X Terminal doesn''t run programs,
    turning it off doesn''t cause the horrible problems that turning off a workstation
    can. You can get X software for Windows to make a Windows PC act like an X terminal,
    too. If you have a PC, ask the person who set it up how to start it and stop it.


    # Hey, UNIX! 1 Want to Log In


    Whether you use a remote PC or a workstation, you have to get the attention of
    UNIX. You can tell when its attention because demands that you identify yourself
    by logging in. If you use a workstation, whenever UNIX finishes loading it, it
    is immediately ready for you to log in (skip ahead to the section "Logging In:
    U(NIX) Can Call Me AI!") You terminals (X or otherwise), however, may not be so
    lucky.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Chapter 1: Log Me In, UNIX!


    # Direct access


    If you''re lucky, your keyboard and screen are attached directly to the main computer,
