  md: '# To switch or not to switch?


    Lots of UNIX commands have options. (They are also called switches because you
    switch the options and off by typing or not typing them when you command the time.
    True calls them flags.) Options command both more versatile and more confusing.
    Probably the most widely used option is -l for the command, which ls -l to display
    list of information about each file. When you type a command, keep this list of
    rules handy:


    +   - Type a hyphen as the first character of the option (-, for example).


    +   - Type a space after the option if you want to type more information on the
    command line after the option.


    +   - If you want to include more than one option, type another space, another
    hyphen, and the next option. You can easily string multiple options after one
    hyphen; for example, -al means that you want option a and option 1.


    +   - Leave a space after the command name (the command ls, for example) and before
    the option (-l part).


    # Making files out of hiding


    You may have more files in your directory than you think. UNIX enables you to
    make things called hidden files, which are like regular files except that they
    don''t appear in normal ls listings. Making a hidden file is easy — just start
    its filename with a period.


    You can see your hidden files by typing


    ```

    ls -a

    ```


    To see all the information about your hidden files, type


    ```

    ls -al

    ```


    This command combines the -a and -l options together so that you see the long
    version of the complete listing of files. You can get the same thing by typing


    ```

    ls -a -1

    ```


    but that requires typing an extra character and an extra space, an anathe to lazy
    UNIX typists.'
