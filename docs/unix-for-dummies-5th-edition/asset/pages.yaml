  md: "# Chapter 22: The Case of the Missing Files\n\nIf you use the BASH shell, you\
    \ can give this command: \n\n```\nnoclobber=1\n```\n\nIf you use the C shell,\
    \ you can give this incantation:\n\n```\nset noclobber\n```\n\nBetter yet, use\
    \ a UNIX wizard to help you include this command in your .cshrc or .profile file\
    \ so that the command is automatically made every time you start the shell. This\
    \ command tells the shell to ask before redirection to cl files.\n\nWhen you redirect\
    \ output to a file, you can tell UNIX to add the output to the end of an existing\
    \ file. Rather than type one >, you type two:\n\n```\nls -al >> dirlist\n```\n\
    \nYou have little reason not to use >> every time you think of using >.\n\n# Wrecking\
    \ files with text editors\n\nThe fourth you you're likely to smash files in a\
    \ botched editor session. The problem usually comes up after you have been editing\
    \ a file for a while and realize that you screwed up: The changes you made are\
    \ not what you want, so you decide to leave the editor. On the way out, however,\
    \ you write the botched changes to the disk and wreck the original file. A similar\
    \ problem occurs when you use an editor to look at a file: Although you may not\
    \ intend to change anything, you may make some inadvertent changes (This can easily\
    \ happen in emacs, where pretty much anything you type goes straight into the\
    \ file.) If you're not careful, you can write the changes to the disk by mistake.\n\
    \nIf you vi, you can avoid the accidental-clobber problem by typing view rather\
    \ than vi. The view editor is the same as the vi editor (vi and view are links\
    \ to the same program). The view editor works the same as vi except that doesn't\
    \ let you write changes to the file. Keep it in mind.\n\nAlthough some versions\
    \ of emacs can mark files as read-only so you can't make changes to the files,\
    \ the methods of doing so aren't entirely standardized. In Emacs, you press Ctrl-X,\
    \ Ctrl-Q in a file window, and Emacs puts an inscrutable %% on the status line\
    \ at the bottom of the screen. To be even more careful, you can press Ctrl-X then\
    \ Ctrl-K to open a file as read-only in the first place."
