  md: '# 122 Part II: Some Basic Stuff


    If the find command doesn''t work and you think that the file may be in other
    user''s directory, type the same find command and replace the . (dot) with a /
    (slash). This version tells find to start looking in the root directory and search
    every directory on the hard drive. As you can imagine, this process can take some
    time, try other things first.


    # "I know where to search (sort of)"


    ```

