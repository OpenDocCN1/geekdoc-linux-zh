- img_proc: true
  md: '# Chapter 9: Printing (The Gutenberg Thing)


    stuff the originals do and about 47 other things, too. Because groff is free,
    whereas nroff and troff are subject to expensive licenses from whoever owns the
    original UNIX licensing this year, groff is all you see days.


    All the "roff" programs are batch formatters. In these programs, you type your
    document with formatting codes into a text file and then run the text file through
    groff, which produces a beautifully typeset version of your document, give or
    take all your types and coding errors. Then you fix the document, re-groff, and
    so on. These programs are the antithesis of WYSIWYG (What You See Is What You
    Get) formatting.


    People still use groff, partly it''s free and because you can do fancy stuff with
    highly structured documents that''s difficult or impossible with WYSIWYG. We don''t
    expect that you''ll write a great groff documents, but you''ll probably run into
    some on the Internet or in software packages.


    With a bit of effort, you can turn groff documents into something legible. Assuming
    that you have a PostScript printer available, type a command like this:


    ```

    groff filename

    ```


    Replace filename with the name of the text file you want to print. The groff program
    interprets the typesetting codes in the text file and tells the printer how to
    print your document.


    As you probably figured out if you got this far in this book, principle yields
    to hidden complication after you add a few practical details. This section describes
    some of the details and the ensuing complications.


    # Macro mania


    Formatting a document using troff and its cousins requires low-level detailed
    instructions using two-letter codes in the documents—instructions so detailed
    that even UNIX find them tedious (and that''s saying a deal). To relieve the tedium,
    most troff documents take advantage of macro packages that define higher-level
    instructions, which people use rather than the low-level stuff. (These macro packages
    serve roughly the same function as styles in Microsoft Word.) The troff program
    has been around for more than 25 years, and many macro packages have come and
    gone, although a few have stood the test of time. Because lazy typists have written
    all of them, each starting with -m, the flag that tells groff to use the macro
    package. Table 9-1 lists a few popular macro packages.'
  merge: -1
