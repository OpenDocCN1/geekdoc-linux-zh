  md: '# Chapter 20


    # Now Serving the Internet


    In This Chapter


    +   - Getting yourself an Internet presence

    - What domains are

    - Choosing Web server software

    - What you need to serve e-mail, FTP, and other cool Internet resources

    - A few words about Webmastering


    In the preceding few chapters, we tell you everything you ever wanted to know
    (more, probably) about how to use your UNIX computer to take advantage of popular
    Internet resources as ssh, telnet, e-mail, news-groups, FTP, and the World Wide
    Web. Well, you have something to offer the world yourself, You''re wondering how
    those other people got their themselves on the Internet, and whether you can do
    it, too.


    Of course you can do it, too. With UNIX, in fact, you have ways to get yourself
    on the Internet rather inexpensively, assuming that your ambitions are modest.
    No matter what you end up taking, getting on the Internet is a matter of setting
    up, or getting least access to, some kind of Internet server. To be more specific,
    you have to set up (or get someone else set up for you) server programs for each
    kind of Internet resource you want to provide. If you want to serve your e-mail,
    you need POP (Post Office Protocol) and SMTP (Simple Mail Transfer Protocol).
    If you want your computer to act as a telnet server, you need a telnet server.
    If you want to make interesting files available for people to download to their
    own computers, you need an FTP server. If you want to read exquisite, and potentially
    moneym Web pages, you need a Web server.


    In this chapter, we talk mostly about Web servers, not because we think that e-mail,
    ssh, FTP, and other non-Web resources are unimportant, but because full-featured
    Web servers like the ones we tell you about set up in this chapter usually come
    with all the software you need in order to set up those other Internet resources.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# Part IV: UNIX and the Net


    # The Internet, at Your Service


    What you do on the Internet is a function of who you are and what you want to
    accomplish. An Internet presence can be as simple as a set of Web pages that trumpet
    to the world your personal tastes in music and literature. It can be as complex
    as a full-fledged online catalog sales company, replete with customers, virtual
    cashiers, automatic e-mail notification, password-protected customers accounts,
    and encryption capabilities to ensure transactions.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_317_0.png)


    If you''re interested in doing something as foolhard, or complex as setting up
    your own online catalog sales company, you need much more information than we
    have space to provide in this book UNIX. Starting an Online Business For Dummies,
    3rd Edition, by Greg Holden (Wiley Publishing, Inc.), gives you some hints of
    where to start.


    To make things as simple as possible, you have only two realistic approaches to
    getting yourself an Internet presence. The approach that''s right for what you
    want to do, how much time and money you''re willing to spend, and the height of
    your technical pay threshold:


    +   - Host your own site. To host your site, you need at least one dedicated,
    permanently connected to the Internet and running some of Web server software.
    Hosting your site requires you to act as your own system administrator and Webmaster
    (the author and manager of your Web site). Although administering and maintaining
    your own Web site is not for the technically faint of heart, it''s well within
    the powers of a mortal soul as yourself. In exchange for the money you spend on
    the stuff you need and the time you spend everything and keep running, you get
    complete freedom and total control over whatever it is you want to do on the Internet.
    Because a permanent connection good enough to run servers (home modems and DSL
    won''t) costs at least several hundred dollars per month, you you probably won''t
    want to choose this approach until you''re serious about your Web site.


    +   - Get someone to host your site for you. In practice, that "someone" usually
    turns out to be an Internet service provider, or ISP. ISPs are the people who
    sell you basic Internet services, such as e-mail and Web access. Many ISPs also
    offer Web-hosting services: for a monthly fee, they do all the technical lifting
    for you. If you don''t need your own dedicated server, you usually buy a few megabytes
    of space on one of your ISP''s servers for about $20 a month (less, in some cases)
    and upload your Web pages via FTP.'
  merge: -1
  pgno: 317
