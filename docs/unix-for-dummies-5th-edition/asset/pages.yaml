  md: '# Chapter 18


    # # Web Surfing for UNIX Users


    **In This Chapter**


    +   - What is the Web?

    - Using Mozilla

    -markdown: - What is the Web?

    - Using Mozilla

    - Using Konqueror

    - Finding great Web pages


    The World Wide Web (WWW, or just the Web) is the zoomiest, coolest Internet facility
    around. It contains lots of information, including pictures and other non-text
    stuff, in the form of hypertext. As you read through the information, therefore
    you can click (or otherwise select) words, pictures, and buttons to zoom right
    to related information. These clickable words, pictures, and buttons are called
    links.


    The amazing thing about all linked pages is that a page may be stored on any Internet
    host computer in the world. If you''re looking at a page stored on a computer
    in Brookline, Massachusetts, a link on that page may jump you to a page stored
    in Basel, Switzerland. You never even notice, unless you look carefully at the
    names of the Web pages.


    # # What''s a Browser?


    You read the World Wide Web by using a browser. If you use X Windows, you can
    use a graphical browser such as Mozilla, Konqueror, or Opera. With a graphical
    browser, you get to see all the cool stuff as well as the text. (Does this type
    of browser make the browsing experience any more educational or enriching? In
    some cases, maybe, but mostly it makes browsing more fun.) If you''re familiar
    with a browser on Windows, you''ll find browsing on UNIX quite familiar, and if
    you use Mozilla, Netscape, or Opera on Windows, you''ll find their UNIX versions
    nearly identical. This chapter describes both Mozilla and Konqueror.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Part IV: UNIX and the Net


    # URL!


    The World Wide Web brought us the extremely useful concept of Uniform Resource
    Locators, or URLs. The point of a URL is to have a simple and consistent way to
    make Internet resources that tells you what the resource is and where to find
    it. A URL consists of a resource type, a colon, and a location. URLs look horrendous.
    In most cases, the location is two slashes, the host name where the resource can
    be found, a slash, and a filename on that.


    The reason that most URLs look more like running types than actual locations is
    that they were originally designed to be read by computers rather than actual
    humans beings. Their structure has an ordering that helps to demystify them (a
    little). The sample URL is a Web document. Reading back, the part after the last
    slash is the filename: toc-u4ds.html. The following two slashes are the host name
    of the computer.net.guru.com. Finally, back at the beginning, we use http:, which
    just tells the browser to use the http resource (the Web) to view this file.


    Commonly used resource types are shown in this list:


    +   - A: HyperText Transfer Protocol document; that is, in native Web format


    +   - A: directory or file on an FTP server


    Here''s a type of URL:


    ```

    http://net.guru.com/toc-u4ds.html

    ```


    Although URLs were originally intended as a way for computers to access resource
    names, they''ve also become widely used as a way to tell people about Internet
    resources, and that''s how we use them in this section of the book. It''s unfortunate
    that they''re so difficult to type!


    When you start your browser, you can begin with the Web page it suggests and find
    your way by following the hypertext links. (Don''t worry — we tell you how.) Alternatively,
    you can jump directly to a Web page if you know its name. These names are called
    URLs (for Uniform Resource Locators) — see the nearby sidebar, “URL!” to read
    about them.


    # Browsing with Pictures: Mozilla and Conqueror


    The most common browsers for UNIX are currently Mozilla, Conqueror, and Opera.
    Mozilla is the open source core of Netscape (which is itself available on some
    UNIX factors, but works exactly like Mozilla). Conqueror is'
  merge: -1
