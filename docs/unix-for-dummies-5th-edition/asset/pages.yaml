    all its features and use them all effectively. Fortunately, a guy Dave Korn remedied
    this shameful situation, and dreamed about thou sand new features to the Bourne
    shell and ended up with the Korn shell (called ksh). Because most of the new features
    are of interest only to people who wrote shell scripts (sequences of shell commands
    saved in a file), you can consider the Korn shell the same as the Bourne shell.
    Most versions of the Korn shell also have commanding edit.


    # She sells C shells


    No, the C shell wasn''t written by anyone C. It was written by Bill, the guy we
    mentioned earlier. (He C shells by the C shore? Probably.) We would discuss our
    opinion of the C shell at length, except that Bill is 64, in excellent shape,
    and knows where we live. The C program name is csh.


    The most notable difference between the C shell and the other leading brands is
    that the C shell has many more magic characters (characters that do something
    special when you type). Fortunately, unless you use a number of commands with
    names ed1x, these characters aren''t a problem.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_49_0.png)


    # Who says the C shell isn''t user-friendly?


    If you use the C shell, be aware that some punctuation characters special and
    fairly useful things.


    An exclamation (!) tells the C shell to do a command again. Two of them (!!) means
    to repeat the last command. One of them followed by the first few characters of
    a command means to repeat the last command that started with those characters.
    For example, to repeat the cp command you gave, type


    You can use carets (*) to tell the C shell to repeat a command with some change.
    If you type this line:


    ```

    ^old*new

    ```


    the C shell repeats the last command, substituting "new" for "old" wherever it
    appears in your type. You can use slashes (/) in a similar way, although the C
    shell also uses colons (:) to perform truly fusing editing of previous commands,
    which we don''t get into.


    ```

    ! cp

    ```


    This command is great for lazy typists.


    In Chapter 7, we tell you more about reissuing commands.'
