  md: '# 278 Part IV: UNIX and Net


    # Pop off, buddy


    One of the worst innovations in recent decades is pop-up windows that appear on
    your screen unbidden (by you), when you visit some Web sites. Some pop-ups appear
    immediately, some are pop-unders that are hidden under your window until you close
    the main window. The pop-ups you''re most likely to see are ads for cheap, airline
    tickets, and mortgage financing (no we''re not going to give their names here;
    they have plenty of publicity ability).


    and your pop-ups, for the most part, disappear. In older versions of Mozilla that
    don''t have a Popup Windows panel, click Advanced to expand its list, and check
    Scripts & Plugins, and in that window uncheck the Open Unrequested Windows box.


    Mozilla and Netscape shocked us all by giving users who actually want, a way to
    get rid of pop-ups. For the menu editor, or the Preferences window, double-click
    Privacy & Security to expand it if it''s not already, and then Popup Windows.
    Click the Block Unrequested Popup Windows box,


    In Konquer, over the KDE Control via Settings->Configure Configure, click Java
    & JavaScript at and then in the window that appears the JavaScript tab at the
    top and (at last!) two-thirds of the way you find JavaScript Popups Policy. The
    four options are Allow (not recommended), Ask for a window asking if you want
    a popup, not much of an improvement), Deny, or Smart. Try Smart, let it guess
    which pop-ups are useful, or Deny to get rid of all of them.


    # What Should I Look At?


    Now that you know all about how to use your browser, here''s a few suggestions
    of places to start if you don''t already have your list of favorites:


    +   - google.com: Everyone''s favorite search engine, you at least. Type in some
    terms of interest and see what pages it finds. Also click the News tab in the
    Google window to see a summary of news from the newspapers, updated automatically
    and continuously.


    +   - net.gurus.com: Yup, it''s our site (never we weren''t vain). Click the Zap
    Updates and Fake Links for our updated stuff on the Net.


    Also see our book The Internet For Dummies, 9th Edition, for lots more advice
    on browsing, Web sites, and the Net in general.'
