- img_proc: true
  md: '# Chapter 16


    # Across a Crowded Network


    In This Chapter


    +   - Logging in to other computers

    - Checking out computers on the network

    - Discovering your files are on a different computer


    If your computer is on a network, sooner or later you will have to use computers
    other than your own. Although you can do lots and lots of things over a network,
    the two most widespread activities are remote login and file transfers. If your
    computer is on a LAN (Local Area Network), you can probably use files directly
    that are located on other computers.


    # Across a Computer Far, Far Away


    Most UNIX systems are attached to the Big Mazooma of networks, the Internet, which
    hooks together several million computers around the world. Because most of the
    UNIX network software descends from stuff originally written at Berkeley specifically
    for use on the Internet, all the commands you may notice in this chapter work
    just fine on the Internet. The only difference you notice is that you can refer
    to computers on your own network with simple names, such as pumpkin, in order
    to talk to computers on the Internet, you have to give their true names, which
    can be long and tedious, such as iecc.cambridge.us (a name our computer used to
    have).


    Remote login is no more than logging in to some other computer from your own.
    While you are logged into the other computer, whatever you type is passed to the
    other computer; whatever responses the other computer makes are passed back to
    you. Examples: telnet and ssh. You can also use ssh to give commands one at a
    time on other computers.


    A file transfer copies files from one system to another. You can copy files from
    other systems to your system and from your system to others. Two different file-transfer
    programs exist (how did you know that?): ftp and scp. We talk about ftp in Chapter
    18.'
  merge: -1
