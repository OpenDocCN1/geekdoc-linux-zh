  md: '# Chapter 10


    # Writing Deathless Prose


    **In This Chapter


    +   - What is a text editor?

    - What is a text formatter?

    - What is a word processor?

    - What is a desktop publishing program?

    - Using vi if you absolutely have to

    - Using emacs, which is not that bad, really

    - Using pico, which works rather well

    - Using ed if you don''t have anything better


    In the land of UNIX, many programs handle text. Where you come from, you may be
    accustomed to the idea of using a word processor when you want to type something
    and print it. Not in UNIX. It has four kinds of programs for this task, just to
    keep things interesting.


    # UNIX Has Its Way with Words


    The four kinds of UNIX programs that handle text


    +   - Text editors

    - Text formatters

    - Word processors

    - Desktop publishing programs


    Before describing the most commonly used text editors in gory detail, thought
    that you would want to know the differences among these four kinds of programs,
    in case you plan to impersonate a geek at the next meeting of your local UNIX
    users'' group.'
  merge: -1
