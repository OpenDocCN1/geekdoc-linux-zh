  md: '# TECHNICAL STUFF


    # Chapter 11: Umpteen Useful Unix Utilities


    # 181


    # # How does file compression work, anyway?


    This discussion is pretty technical. Don''t say we didn''t win.


    The issue of optimal codes (codes that use the least of bits for a particular
    file or message because they are time-sensitive in radiotelescope) was a hot topic
    in the late 1940s. In 1952, a student named David Huffman published a paper showing
    how any high-school student could understand simple arithmetic techniques to construct
    optimal codes. Even since then, his code is known as Huffman coding. For many
    years Huffman coding was the best available, and a UNIX program packed it.


    and notes that it has seen AA more than once; then it notices that it has AAA
    more than once, and so on. It enters longer and longer runs of A''s into its dictionary
    until it has runs of 30 As, replaced by a single dictionary entry and a single
    token in the compressed file. When compress enters the Rs and the Cs, it does
    the same thing and enters long runs of Rs and Cs in the dictionary.


    Normally, every character in a file is stored using 8 bits (binary, 1s and 0s,
    the size of a data unit is character count). Suppose a file contains 800 As, 100
    Bs and 100 Cs. That''s 1,000 characters, at 8 bits each, or 8,000 bits. For compression
    can use much smaller codes. It can use a 1-bit code for A and 2-bit codes for
    B and C. The total size would be 800 bits for the As, 200 bits for the Bs and
    the Cs — a total of 1,200 bits fewer than 8,000. The packed file is little larger
    than that (1,408 bits) because a table at the front of the packed file identifies
    which codes correspond to letters.


    Using a clever technique (at least, it''s clever to datacomp works), compress
    doesn''t store the dictionary in the compressed file because compress can deduce
    the contents of the dictionary by building from the sequence of tokens in the
    compressed file. As a result, compress does a fantastic job on this file and squashes
    it to the original.


    The compress uses a dictionary compression scheme, which is kind of backward from
    Huffman coding. Rather try to find the shortest code for every letter, compress
    runs through the file frequently grouping groups of letters to encode as single
    dictionary entry, or token. To compress the same file we packed in the previous
    paragraph, compress reads letter by letter


    Compression techniques are all hot topic in the computer biz, and many techniques
    have been patented. The particular technique compress uses is LZW, after Lempel,
    Ziv, and Welch, who thought of it. Welch works for Unisys and made efforts to
    implement an easier scheme for design. It''s a good technique, in fact, two others
    named Miller and Geiger, who worked for IBM, invented it at the same time, and
    they also have a patent on it. Because the patent office is grant two patents
    on invention, some people use this situation to suggest that patents on software
    isn''t good idea. Fortunately, neither Unisys is compress, and the patent entered
    in June 2003, so you can go ahead and use it. Gzip, zip, bzip2 use techniques
    that are somewhat similar LZW but not covered by patents.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_204_0.png)'
