    trouble checking your mail, everything you need to do is on the Receiving tab.
    If you''re having trouble sending mail, check the Sending tab.


    # ## Advanced e-mail magic


    Some pretty stuff is out there, and a lot of it is too deep to go into any depth
    here. Something to sink your teeth into? Here are a few recommendations.


    +   The mail client (or NMH, an updated version that''s more actively maintained)
    is what all the cool kids use. It''s arcane, complicated, and completely scriptable.
    Instead of being a single program, it''s a set of programs, which you glue together
    yourself. Hard to use, but it can do anything.


    +   Want to sort your mail, preprocess and set up responders? You''re looking
    for procmail. A bit tricky to figure out, but very flexible. Some good information
    about it is written by our Nancy McGough at www.ii.com/robots/procmail/


    +   Sick of spam? A wonderful program, called SpamAssassin, can identify a lot
    of it and throw it out for you. Most people use SpamAssassin it has as a plug-in
    to procmail.'
