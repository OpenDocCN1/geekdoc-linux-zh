  md: '# Chapter 2: What Is UNIX, Anyway?


    Many versions of the C shell exist; most of them differ in bugs are fixed and
    which are still there. You may run into programs called zsh and tcsh, two slightly
    extended C shells with command editing.


    # Are Any Good Programs On?


    You may be wondering why we refer sometimes to commands and sometimes to programs.
    What''s the difference?


    A command is something you type that tells UNIX (or actually the shell) what to
    do. A program is a file that contains executable code. The confusion because in
    UNIX, to run a program, you just type its name. (In-fashioned operating systems,
    you usually typed something like RUN_ANALYSIS to run a program called BUDGET_ANALYSIS.)


    When you type a command, such as ls or cp or emacs (a editor we talk about in
    Chapter 10), the shell looks at it carefully. The shell knows how to do a few
    commands by itself, including cd and exit. If the command isn''t one that the
    shell can do by itself, the shell looks around for a program stored in a file
    by its name.


    Old DOS may recognize this process works — DOS do themselves called internal commands,
    and commands that require running another program are called external commands.
    Internal commands are also called built-in commands.


    # Finally! You''re Ready to Work


    We wrap up this chapter with a little advice about hand-to-hand combat with the
    shell. You can give many commands to your shell. Every shell has a dozen built-in
    commands, most of which aren''t very useful on a day-to-day basis. All the other
    commands are the names of other programs. The fact that every UNIX system has
    hundreds of programs lying around translates into hundreds of possible shell commands.


    One thing about UNIX shells is, within a given shell, the way you type commands
    is completely consistent. If you want to edit a file called my-calendar, for example,
    and use an editor e, you type this line:


    ```

    $ my-calendar

    ```'
