    # Why you don''t want to know about PostScript


    You may have what''s known as a PostScript printer. Two general camps of laser-printer
    programming language design: the Hewlett-Packard (HP) camp and the PostScript-Packard
    camp. Printers in the Hewlett-Packard camp are based on the design of the HP LaserJet
    line of printers. Printers in the PostScript camp use the PostScript language.
    Although PCL is not nearly as readable or flexible (depending on how you look
    at) as PostScript. To avoid confusion, most laser printers produced in recent
    years speak PostScript and PCL.


    PostScript has two problems that may bite you. The first is sending a regular
    file to a PostScript printer. UNIX printer software is usually smart enough to
    output automatically that it must PostScriptize the file in order to print it.
    If the printer software is not smart, another program can do the PostScriptization.
    Adobe, the originator of PostScript, sells a widely used package Transcript. It
    includes a program that prints if the plain ip or lpr command doesn''t work, try
    using the encript command or its freeze before you run for it.


    You may reasonably ask, "What does a programming language do with a printer?"
    If you send a LaserJet file that contains the text boots, your mother wears army
    boots. If you send the same file to a PostScript printer, the printer doesn''t
    print anything. The reason is that a PostScript printer is a powerful computer
    with a built-in language (PostScript) that can print just sort of a sideline.
    To make a PostScript printer print anything, you have to send a program to the
    printer. Fortunately, this type of program is widely available.


    The other problem you may encounter is that a file contains PostScript but looks
    like a regular file. PostScript files look like incomprehensible programs written
    in an obscure programming language because that''s what they are. The payoff is
    that the two letters on the first line are !=. To see what the file is supposed
    to look like, you must send it to a PostScript printer or run the program in the
    file and print what the file contains. If your printer prints the PostScript instead,
    most likely your printer doesn speak PostScript.


    This isn''t as easy as it sounds. To print simple files of text, it''s a pain;
    for fancy typeset documents with lists of typefaces and figures and line drawings
    and such things, PostScript is considerably more flexible than PCL, so that people
    use PostScript to typeset entire books (like that one).


    Lacking a PostScript printer, you might not be out of luck. A program from the
    Free Software Foundation Ghost can read PostScript files and translate them into
    your local canon printer. In this chapter in "Printing for the PostScript-Challenged,"
    to be precise — we discuss Ghostscript and its cousin Ghostview, which lets you
    view PostScript documents on-screen.


