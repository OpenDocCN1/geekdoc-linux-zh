  md: 'If you don''t specify a filename (in this case, myfile), UNIX lists all the
    files in the directory, which is often more useful. For every file, this listing
    shows all the following information:


    +   - Whether it''s a file, symbolic link, or directory. The first character in
    the line is a hyphen (-) if it''s a file, an l if it''s a symbolic link, and a
    d if it''s a directory.


    +   - Whether the owner can read, write, or execute it (as shown by the next three
    characters, 2 through 4, on the line). The first character is an r if the owner
    has permission or a hyphen (-) if not. The second character is a w if the owner
    has permission or a hyphen (-) if not. The third character is an x (or sometimes
    an *) if the owner has permission or a hyphen (-) if not.


    +   - Whether the members of the group owner can read, write, or execute the file
    or directory (indicated by the next three characters, 5 through 7). An r, w, or
    x appears if permission is granted; a hyphen (-) appears if permission is not
    granted.


    +   - Whether everyone else can read, write, or execute the file or directory
    (indicated by the next three characters, 8 through 10). An r, w, or x appears
    if permission is granted; a hyphen (-) appears if permission is not granted.


    +   - The link count, that is, how many links (names) this file has. For directories,
    this number is the number of subdirectories the directory contains plus 2 (don''t
    ask).


    +   - The owner of the file or directory.


    +   - The group to which the file or directory belongs (group owner).


    +   - The size of the file in bytes (characters).


    +   - The date and time the file was last modified.


    +   - The filename — at last!


