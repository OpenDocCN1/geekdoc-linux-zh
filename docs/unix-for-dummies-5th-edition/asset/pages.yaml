  md: '# Part IV: UNIX and the Net


    # Looking in a folder


    After you put messages in folders, you may want to look at them later. When you
    see Pine''s main menu, you can press the l1 key (the lowercase letter L) to select
    which folder to look in. Pine automatically makes several for you, including these:


    +   - INBOX: Your incoming messages. Messages remain there until you move them.

    - Sent mail: Messages you sent.

    - Saved messages: A place to save messages before you send them.


    Move the highlight to the folder you want, and then press Enter. Pine lists the
