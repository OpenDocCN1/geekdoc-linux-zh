  md: '# Part IV: UNIX and the Net


    # Sign here


    You can make a signature file, a file that contains text for Pine or elm to include
    at the end of every message. You must name the file .signature and be in your
    home directory.


    Use your text editor to make a signature file. Keep it short (no more than three
    lines long), and include your name, your e-mail address, other address you want
    everyone to know, and (if you have room) a pithy or philosophical message that
    characterizes you.


    After you create a signature file, you don''t have to type this stuff at the end
    of every message. To test, send a message to yourself and see how the signature
    looks at the bottom of the message when you compose it. To omit signature information
    from a message, just delete it.


    Figure 17-1 shows Pine''s main menu, with a list of its favorite commands. Pine
    uses one-letter commands. One can also choose commands by pressing the up- and
    down-arrow keys to move the highlight and then pressing Enter.


    This list shows the commands you''re most likely to use:


    +   - Press c to compose (write a new message).

    - Press i to see a list of messages.

    - Press q to exit from Pine.

    - Press ? for helpful online help.


    # Into the postbox


    Use Pine to send mail, press the c. Pine runs pico, a nice, simple editor with
    a blank file we describe in more detail in Chapter 10. Rather than that, you see
    the headers, ready for you to fill in: To, Cc, Attach (for files to a message
    — skip that for now), and Subject. Use pico to type the header information and
    the text of your message. Then press Ctrl+X to leave pico. Pine sends the message
    and displays the main menu again.


    If you decide not to send the message after all, you can press Ctrl+C to cancel
    it.'
