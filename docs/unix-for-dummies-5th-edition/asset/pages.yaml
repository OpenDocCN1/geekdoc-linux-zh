  md: '# Chapter 12


    # # Installing Software Can Be Tricky


    **In This Chapter**


    +   - Where does software come from (the software stork)?n- Where to put software

    - Writing shell scripts, or files full of commands

    - Writing aliases for your favorite commands

    - Grabbing software from the Internet

    - Uncompressing, uodecoding, and otherwise fooling with files that contain programs


    If you are a Windows or Macintosh user, you are probably thinking: “I can install
    new programs. What’s the big deal? I just stick in a disk or a CD-ROM and type
    INSTALL, right?” No. In UNIX, it’s not simple, of course. You face issues of paths,
    permissions, and other technical-type stuff we have been protecting you.


    On the other hand, we''re not about to train you to be a system programmer. Every
    user has a few favorite programs, and you wear out your welcome quickly if you
    go off to your local wizard every time you want to use a new program. Although
    installing new UNIX programs is much trickier than PC or Mac programs, in many
    cases you can do it yourself.


    # # The Software Stork


    Interesting software comes from many places:


    +   - Some other user on the same machine already has it for his or her own use,
    and you want to use it, too.

    - Some other machine on the network has a program you want for youryourself. See
    Chapter 16 for the gory details of copying the program from other machines on
    the network.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_208_0.png)'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# 186 Part III: Getting Things Done


    +   - Someone sends you messages through e-mail. (Yes, it''s possible, although
    you should be really, really sure that it''s from someone before you install it.)


    +   - You create files that contain frequently used commands so that you don''t
    have to type them repeatedly. In UNIXspeak, these files are called shell scripts.
    In essence, you make your own multipurpose UNIX commands.


    First, we talk about where you should put your own software. Then we go into more
    detail about the mechanics of putting it there.


    # You''ve bin had


    Every UNIX user should have a bin directory. It''s just a directory named bin
    in your home directory. If it''s not there, you can make it by going to your home
    directory and typing this line:


    ```

    mkdir bin

    ```


    The thing that''s special about bin is that the shell looks for programs. Most
    system administrators automatically set up a bin directory for users. If not,
    and you had to create it yourself, you may have to do some fiddling to tell the
    shell to look for programs. See the sidebar "Your search path," later in this
    chapter, for bad news.


    To put programs in bin directory, you just copy them using the cp command. Alternatively,
    you can move them using the mv command, a text editor, or any other way to create
    or move a file.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_209_0.png)


    # Why is it named bin?


    Early on, bin was short for binary because most programs people put there were,
    in fact, compiled binary code. In the 1970s, a famous professor of cognitive science
    at the University of California published a paper titled "The Trouble with UNIX,"
    complained about how difficult it was to use UNIX. One of the items on his list
    was that bin was difficult to remember. One of the UNIX guys at Labs published
    a witty rebuttal and pointed out that many of the allegedly "more natural" command
    names made the professor


    suggested were merely the names the computer system in his usage. UNIX reported
    that many Bell Labs users thought a bin was the obvious place to stash their programs.
    So, it''s still a bin.


    The famous professor, subsequently worked at Apple and Hewlett-Packard, and is
    now back in academia, has come around some-what and is reputed to use UNIX now
    and then, although probably shuts his office door so no one can see.'
