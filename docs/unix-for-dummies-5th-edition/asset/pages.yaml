  md: '# Chapter 18: Web Surfing for UNIX Users


    the browser that comes with KDE. Mozilla and KDE are open source and available
    for free. Opera is from Opera Software in Norway, and shows ads, which may go
    away if you buy an expensive license.


    Because UNIX versions of Mozilla, Netscape, and Opera are nearly identical to
    their equivalents on other systems (you know which ones we use), if you''re already
    a Mozilla or Opera user, there''s little reason to switch. We don''t cover Opera
    in detail here, but it''s a perfectly good browser, and if you can use any other
