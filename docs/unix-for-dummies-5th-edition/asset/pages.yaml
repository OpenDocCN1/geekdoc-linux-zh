  md: '# Chapter 11: Untmpen Useful UNIX Utilities 179


    You can schedule things to be done later by using the at command. You say sumably
    assumes something like this:


    ```

    at 5:15pm Jul 4

    sort -r myhugefile -o myhugefile.sort

    pr -f -2 myhugefile.sort | lp

    ```


    Then you press Ctrl-D to indicate that you finished giving commands.


    You give the command and specify a time and date. Then you enter the commands
    you want to run at that date and time. Press Ctrl-D on a separate line to tell
    UNIX you''re finished listing tasks. In this example, we sort a huge file and
    print it in two columns, all on the Fourth of July, when no one is around to complain
    that it''s taking too long. If you omit the date, UNIX assumes you mean today
    if the time is later than the current time; otherwise, UNIX assumes you mean tomorrow.


    Any output that normally goes to the terminal is sent back to you by electronic
    mail, so you should at least skim Chapter 17 to find out how to read your mail.


    # Squashing Your Files


    One common problem to all UNIX systems — indeed, to nearly all computer systems
    of any kind — that you never have enough hard drive space. UNIX comes with a couple
    of programs that can alleviate this problem: compress and gzip. They change the
    data in a file into a more compact format. Although you can''t do anything with
    the file in this compact format except expand back to its original, for files
    you don''t need to refer to, compressing can be a big space-saver.


    # Compress without stress


    You use compress and gzip in pretty much the same way. To compress a file named
    confidential.txt, for example, type this line:


    ```

    compress -v confidential.txt

    ```


    The optional -v (for verbose) option merely tells UNIX to report how much space
    it saved. If you use it, UNIX responds with this information:


    ```

    confidential.txt: Compression: 49.79% — replaced with confidential.txt.Z

    ```'
