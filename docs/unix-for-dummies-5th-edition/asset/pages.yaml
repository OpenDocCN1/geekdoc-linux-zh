  md: '# 70 Part II: Some Basic Stuff


    # Getting around


    Getting around in KDE is pretty straightforward, except that the potential to
    change themes the time makes giving much advice hard. If a button has an X, it
    probably closes a window. You can generally move windows by dragging the title
    bar, and resize them by dragging their corners. A right-click the desktop gives
    you a top-level menu. Right-clicking a title bar gives you a selection of window
    options.


    The file manager (which is actually our old friend Conqueror) is entirely predictable.
    It does have one little surprise for you, though. By default, it activates everything
    with a single click! So, you''re used to doubleclicking, you may well launch things
    twice. This makes more sense on Web pages for file management. If you want to
    select a file (without opening it), you may use Control-click or Shift-click.
    Shift-clicking two files also selects all the files between them; Control-clicking
    multiple files just selects the files you clicked.


    KDE, like C, offers multiple workspaces. This is a good feature, and surprisingly
    hard to live without once you get used to it. However, in KDE, they are called
    desktops. It''s a great feature, and we really recommend you play around with
    it. Having one desktop with nothing on it but a maximized browser window can be
    awfully convenient.


    If you want to know more, try the online help. Right-click the desktop, and look
    at the Help submenu. Lots and lots of goodies are in here! KDE is way too large
    for us to cover it completely here, so we entrust you to the capable writers who
    have the KDE documentation.


    # Say goodnight, Gracie!


    You run KDE, but now you''re done? Look for the Logout option on the main KDE
    menu. You can also lock the screen, which means that no one else can do anything
    but watch the screen saver unless someone guesses your password. If you''re going
    to be gone for a while, logging out is more polite. KDE may offer you the chance
    to turn your computer off entirely when you ask to log out. If you''re on some
    kind of shared system, don''t that, just log out.'
