  md: '# 124 Part II: Some Basic Stuff


    Three grep programs exist: grep, egrep, and grep. They are similar, so we talk
    just about grep. (Fgrep is faster but more limited, and egrep is more powerful
    and confusing.)


    To look in all the files in the working directory (but not in its subdirectories)
    for the characters 1471 Arcadia, type this line:


    ```

    grep "1471 Arcadia" *

    ```


    That is, type these elements:


    +   - grep (just as you see it here).

    - A space.

    - The series of characters to look for (also called the search string). If the
    string consists of several words, enclose it in quotation marks so that grep doesn''t
    get confused.

    - A space.

    - The names of the files to look in. If you type * here, grep looks in all the
    files in the current directory.


    The grep program responds with a list of the lines in which it finds the search
    string:


    ```

    ts.doc: 1471 Arcadia Lane

    tonia.letter: 1471 Arcadia La.

    ```


    The program lists the name of the file and then the entire line in which it finds
    the search string.


    You can do lots of things with grep other than just for files. In fact, one could
    write entry (small) books about using grep. For our purposes, however, there are
    some useful options you can use when you use grep for files.


    If you want to see just the filenames and don''t want grep to show you the lines
    it found, use -l (for list) option. (That''s a small letter l, not a number one).
    Suppose that you type this line:


    ```

    grep -l "1471 Arcadia" *

    ```


    The grep program responds with just a list of filenames:


    ```

    ts.doc

    tonia.letter

    ```'
