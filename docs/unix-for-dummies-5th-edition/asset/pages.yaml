    # Revving up RPM


    For years, the tar file method has been the only game in UNIX-land for distributing
    software over the Internet. UNIX administrators are accustomed to installing software
    packages, this method works just fine. However, a growing number of disgruntled
    users have clamored for an easier way to install and maintain software. Their
    calls were answered by Red Hat Linux, which come with the Red Hat Package Manager
    (RPM).


    RPM is a software-management system that is a substitute for tar. Rather than
    download a file in .tar.gz, you download the one that ends in .rpm. The RPM utility
    unpackes the files, puts all the resulting files in their places, and updates
    a database of installed software on the computer. If you want to install an upgrade,
    RPM remembers that an older version is already installed and saves any existing
    configuration files while upgrading the necessary files. This feature is enough
    to generate grumbling from traditionalists about user-friendliness infiltrating
    UNIX.


    An important caveat about RPM is that you can install software this way only if
    you are the system administrator, for most people happens only if they have a
    PC running Linux, as is described in Chapter 14. So far, its use is not necessarily
    restricted to Linux, and we''ve heard of people using it on other UNIX systems,
    too.


    # Unwrapping packages


    If you use one of the BSD varieties of UNIX, including FreeBSD (which happens
    to be the version that Mac X is based on, so Mac users should keep reading), NetBSD,
    or OpenBSD; if you''re the system administrator and know the superuser password,
    you can use the package system to install software on your computer. It''s the
    same general idea as RPM, except of course that it''s different because we wouldn''t
    want to be excessively compatible.'
