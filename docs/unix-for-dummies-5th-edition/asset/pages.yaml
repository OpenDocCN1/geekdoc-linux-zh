- img_proc: true
  md: '# 286 Part IV: UNIX and the Net


    You can also do an express mget, which doesn''t ask any questions and enables
    you to find exactly the files you want. To tell FTP not to ask you about each
    file, use the prompt command before you give the mget command, as this example
    shows:


    ```

    ftp> prompt

    Interactive mode off.

    ftp> mget 02-1*

    200 PORT BINARY mode data connection for 02-10.gz (123728

    bytes)

    226 Transfer complete.

    local: 02-10.gz remote: 02-10.gz 123728 bytes received in 2.8

    seconds (43 Kbytes/s)

    200 PORT command successful.

    150 BINARY mode data connection for 02-11.gz (113523

    bytes)

    226 Transfer complete.

    local: 02-11.gz remote: 02-11.gz 113523 bytes received in 3.3

