  md: '# Chapter 14: Taming Linux 215


    # Linux goes commercial


    The freely available, "alternative" image of Linux discouraged commercial enterprises
    from adopting Linux in its early days. Understandably, many companies did not
    want to deal with an operating system that did not have a corporate entity standing
    behind it, no matter how reliable or trouble-free the product. To fill this need,
    a number of companies have stepped in to provide commercial support for Linux.
    Red Hat Software,


    Inc., for example, provides a commercial version of its Linux distribution in
    addition to the free version. Organizations that purchase the commercial Red Hat
    distribution can therefore return to Red Hat for support rather than (or in addition
    to) Usenet. Other distributions also have companies that support them for a monthly
    or yearly subscription.


    Hat Linux is the most popular distribution. It features plenty of tools to make
    the life of a system administrator, most notably the Red Hat Package Manager (RPM),
    which eases the installation, upgrade, and deletion of software packages, and
    even the operating system itself. For about $40, you can get a CD set with the
    Mozilla Web browser, OpenOffice suite, KDE, GNOME, and a hundred other packages.
    The $40 is for the CDs, the software on them (which is free), and one month of
    Web-based software support. (More support — Red Hat''s main business —is available
    for more money.)


    The Debian and Mandrake distributions, like Red Hat, also provide interfaces that
    ease the task of a system administrator. Although these distributions are not
    as popular as Red Hat, they have plenty of follows.


    If you enjoy editing of configuration files and moving them around hand, the old-fashioned
    way (believe it or not, some people like to do it that), you should go with Slackware.
    Everyone will find easier with Red Hat, Debian, or Caldera.


    Many other Linux distributions are out there, of course, you may want to do a
    little investigating before deciding on a package:


    +   - Knoppix: For PC users without free space, this version of Linux can run
    (kind of slowly) directly from its CD-ROM without needing to be installed on a
    regular disk. (See www.knoppix.org.)


    +   - Lindows: A combination of Linux and proprietary add-ons intended to be easy
    to set and up for Windows users to use. Costs about $50 at www.linuxwindows.com.


    +   - SuLinux: Cones with all kinds of preconfigured software packages, X servers,
    and graphical utilities for novice users.

    - Turbolinux: Primarily for larger businesses and servers; developed in Japan
    and popular in Asia.'
