  md: '# Chapter 12: Installing Software Can Be Tricky


    # Your search path


    You can ignore this section unless you have put a command in your bin directory,
    the shell can''t find it. Still reading? Sorry to hear it. The shell has a list
    of directories that contain commands; this list is known as the search path. Any
    sensible UNIX system, the bin directory is already in your search path. If you
    have to put it there in two stages: putting it once and once putting it permanently.


    If you use BASH or the Bourne or Korn shell, type this even more magical incantation:


    ```

    PATH=$PATH:$HOME/bin

    export PATH

    ```


    Note that the second time you type PATH and HOME in the first command, you include
    a dollar ($) in front of them. This line tells the Bourne or Korn shell to set
    the path as the current path ($PATH), plus the bin subdirectory of your home directory
    ($HOME). Same, different words.


    To see what your current search path is, type the following line if you are using
    the C shell:


    ```

    echo $path

    ```


    If you have BASH or the Bourne or Korn shell, type this line:


    ```

    echo $PATH

    ```


    Yes, one''s uppercase and one''s lowercase. The C shell returns something like
    this:


    ```

    /bin /usr/bin /usr/ucb/bin

    /usr/local/bin

    ```


    Now you should be able to run your new script regardless of which directory you''re
    using.


    This new, improved path lasts only until you log out. To put your bin directory
    on the path time you log in, you must add the incantation to the end of the script
    that runs whenever you log in. If you use the Bourne or Korn shell, add the incantation
    to the end of the .profile file (or .bashrc).


    BASH or the Bourne or Korn shell shows something like this:


    ```

    /bin:/usr/bin:/usr/ucb/bin

    /usr/local/bin:

    ```


    Yes, filenames begin with periods. Filenames that start with periods usually don''t
    show up in file listings, unless you''ve haven noticed these files in your home
    directory. Type the following line to list all your files, including these hidden:


    What you have to do is add your bin directory to the path.


    +   - a


    If you use the C shell, type this magical incantation:


    In principle, you only have to edit the file, to the end, and add the necessary
    lines. In practice, screwing it up is so, — unless you''re particularly brave
    — you''re probably off asking for expert assistance.


    ```

    set path=$($path -bin)

    ```


    That''s a (-) in the middle. This line tells the C shell to set the path the same
    as the current path ($path), plus the bin subdirectory of your home directory
    (-).


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_212_0.png)'
  merge: -1
