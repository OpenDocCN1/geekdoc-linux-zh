  md: '# Chapter 14: Taming Linux


    # # Windows users of the world, unite!


    Users who bring experience with other flavors of UNIX to their first encounters
    with Windows will probably find getting Linux up and running easily. The large
    (and growing) community of Windows users who want to add or switch to Linux will
    likely encounter some fairly rough footing.


    One of the great things about Linux is that it can run on PCs with Intel chips.
    Disgrunted Windows users can switch to Linux without having to buy a new computer.
    Windows users who are still sufficiently granted to check out Linux by installing
    it, check就好, on the same computer with Windows (as long as it has enough free
    space, course).


    All well and good, in theory. In practice, however, you may find yourself in trouble
    with startling efficiency. Even if it manages to coexist with Windows, Linux needs
    its own separate file system, which in turn needs its separate area of your computer''s
    disk. These separate areas are partitions, and drives, you will have at least
    two


    partitions, one for Windows and one for Linux, to get Windows and Linux to live
    together in peace and harmony.


    If you have only one drive or partition on your computer, you have to create a
    second partition before you ever begin Linux. To do so, you have to run a DOS
    named fdisk on your computer. The trouble with fdisk is that if you make one false
    mistake, everything that is already on your computer gets wiped out no questions
    asked. If you already have Windows installed on your computer, do yourself a favor
    and back up your system before using fdisk. Then carefully follow the matter how
    to run both Windows and Linux (known as a dual-boot system). Linux For Dummies
    (mentioned earlier in this chapter), for example, describes the whole process
    in detail. If you already have Windows installed, you can also use Partition Magic,
    a popular (but not free) disk utility to partition your hard drive without having
    to reinstall everything from scratch.


    With some versions of Linux, your computer gives you remedial advice if it thinks
    you need it. If you create a user named noah and try to add the password arkark,
    your computer may say BAD PASSWORD: It''s WAY too short. If you try to lock the
    computer out by adding the password arkark, it may say BAD PASSWORD: it does not
    contain enough characters. If you''re not sure what constitutes a good password,
    go back and read the section in Chapter 1 about password smart. As a system administrator,
    you''re responsible for the security of the system, don''t say you haven''t been
    warned.'
