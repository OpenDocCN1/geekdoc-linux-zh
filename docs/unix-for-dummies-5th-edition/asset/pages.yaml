  md: '# 120 Part II: Some Basic Stuff


    # Links to shadow files


    You may run into a situation in which file seems to be in several directories
    at one time (Twilight zone here, please). Mac users ought to be thinking of *aliases*
    here; Windows users ought to be thinking of shortcuts. UNIX has its own way of
    keeping a file in several places at the same time. To avoid excessive clarity,
    the file can have several different names. Seriously, having a file in, for example,
    the home directories of several people at one time so that they can all easily
    share it is useful.


    To achieve this magical feat, you use *links*. We discuss links in the section
    "A File By Any Other Name," in this chapter. In the meantime, don''t panic if
    you see a file lurking around one place when you''re sure that it belongs someelse
    else.


    # Peering into every directory


    The first approach to finding a lost file is to use the brute-force method. Starting
    in your home directory, use `ls` to search through each of your directories. In
    every directory, type this line:


    ```

    ls important.file

    ```


    Replace *important.file* with the name of the file you''re looking for. If the
    file is in the current directory, `ls` lists it. If the file isn''t there, `ls`
    complains that it can''t find the file. This approach can take awhile if you have
    a large number of directories. An additional drawback is that you won''t find
    the missing file if it has handed over to someone else''s directory.


    If you know — or that you know your file is near, you can use `*` (asterisk) wildcards
    in directory names. (Wildcards are covered in Chapter 7. They enable you to work
    with lots of files or directories at one time.) To find *important.file* in any
    of the subdirectories in the working directory, type this line:


    ```

    ls *important.file

    ```


    This technique doesn''t work if you have directories within directories: it looks
    only one level down.'
