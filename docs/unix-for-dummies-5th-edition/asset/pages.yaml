  md: '# 270 Part IV: UNIX and the Net


    If you receive URLs in e-mail notice, instant messages, documents, Usenet newssgroup
    messages, or anywhere else on your computer, you can use the standard cut-and-paste
    techniques to avoid retyping: In KDE, if you merely highlight a URL, it opens
    a menu asking whether you want to open it in a bouncer window.


    Most e-mail programs highlight URLs in e-mail messages. You all have to do is
    click the highlighted link, and your browser pops up and opens the Web page.


    You can leave the http:// off the front of URLs when you type them in the Location
    or Address box. Your browser can guess that part!


    # Where to start?


    A good way to get started is just to explore: Go to the Yahoo! page. Type this
    URL in the Location or Address box and then press Enter:


