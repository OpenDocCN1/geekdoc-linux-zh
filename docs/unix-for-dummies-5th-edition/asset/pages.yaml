  md: '# Chapter 25


    # Ten Common Mistakes


    In This Chapter


    +   - Believing that using UNIX is easy

    - Mistyping commands

    - Pressing Enter or not pressing Enter

    - Working in the wrong directory

    - Not keeping backup copies

    - Not keeping files organized

    - Turning off your computer

    - Writing your password on a note next to your computer

    - Sending angry electronic mail (flaming)


    > Here are ten (or so) of the most common user mistakes we have run into. Although
    you will probably invent some new ones yourself, at least avoid the ones on this
    list.


    # Believing That It Will Be Easy


    UNIX was designed a long, long time ago in computer time (computer years are similar
    to dog years, except that 50 computer years equal a human year). Software design
    has made a great deal of progress since 1972, and UNIX has not. If you are used
    to a Macintosh or a PC with Windows, UNIX won''t be easy.


    On the other hand, UNIX has a certain cache and glamour; it takes a macho person
    (of either gender) to face it. You should give yourself major kudos, and maybe
    even one or two of those cookies you made to bribe the UNIX wizard, every time
    you get UNIX to do something useful.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# 346 Part VI: The Part of Tens


    # # Mistyping Commands


    If you type a command the UNIX shell doesn''t understand, it says that it can''t
    find the command. The reason is that it looks high and low for a file with the
    name you just typed, hoping to find the program you want to run. And then it says


    ```

    eatylunch: Command not found.

    ```


    Or perhaps the shell says


    ```

    eatylunch: not found

    ```


    The exact wording varies from shell to shell (we bet that you have already guessed
    that). To make sure that you type a command properly:


    +   **Check your spelling (as always).** You may have typed a correctly spelled
    English word rather the garbled set of letters that comprise the name of the program.


    +   **Check your capitalization and spacing.** Capital and small letters count
    as completely different things in filenames and vi, in commands. Nearly every
    command uses only small letters. Spaces matter, too, and if a command is really
    eatlunch the more English-looking eat my lunch won''t do.


    +   **Change directories (maybe).** You may have given the right command, but
    UNIX may not know where to look for the file containing the program. If you know
    where the program file is, move to that directory and give the command again.
    If you don''t know where the file is, either look for it (as described in Chapter
    22) or give up and ask your system administrator or wizard.


    # # To Press Enter, or Not to Press Enter


    Depending on program you are using, sometimes you must press Enter (or Return)
    after a command, and sometimes you don''t. In the UNIX shell, you have to press
    Enter or Return before UNIX performs the command. If you don''t, UNIX waits forever
    for you to do so.


    In other programs, particularly in text editors like emacs, as soon as you press
    the command (Ctrl+K to delete a line in emacs, for example), the program does
    it right away. If you press Enter or Return after the command, emacs sticks a
    new line in your file, and vi moves down to the next line.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# Chapter 25: Ten Common Mistakes


    When you use a program you''re not familiar with, hesitate a moment before pressing
    Enter or Return to see whether the computer may already be performing the command.
    If nothing is happening, press Enter or Return.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_370_0.png)


    # Working in the Wrong Directory


    If you use separate directories to organize your files, make sure that you are
    in the proper directory when you begin working. Otherwise, UNIX won''t find the
    files you want to work on.


    To find out which directory you''re in, type `pwd`. *Remember:* This command stands
    for printing working directory.


    If you''re really lost, you can type `whoami`. This command tells you your username.


    To move back to your home directory, type `cd`.


    # Not Keeping Backup Copies


    Sooner or later, it happens. You give an `rm` command to delete a file, and UNIX
    deletes the wrong file or deletes everything in the directory. Chances are you
    typed an extra space or spelled a filename wrong, the point is — what now?


    See Chapter 22 to find out if you deleted something important. The best approach
    is to keep extra copies of important files: in another direction, on a CD-R or
    CD-RW disc, or on a backup tape that either you or your system administrator makes.
    If you haven''t talked to your system administrator about backups, now is a good
    time to find out whether your files back up automatically: you can also tell him
    which of your directories contain files you want to have backed up.


    # Not Keeping Files Organized


    Unless you do all your work on one or two files, you run into trouble if you don''t
    do the following:'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# 348 Part VI: The Part of Tens


    ✔ Make directories for the groups of files you use (refer to Chapter 6 to find
    out how). Directories help you separate your files into groups of files you use
    together.

    ✔ Use filenames mean something. UNIX lets you name your files with nice long names,
    so take advantage of it (up to a point, anyway). Filenames should tell you what''s
    inside the file rather than make you guess.


    # Turning Off Your Computer


    Leaving your computer on all the time is better than turning it off at the wrong
    time. Chapter 1 talks about this subject in detail. UNIX can get messed up you
    turn off your computer (if you kick the plug out by mistake, without warning it
    that you are going to do so).


    If you use UNIX from a remote PC rather than directly with a workstation, turning
    off the PC (not the UNIX computer) at night may make sense. Check with your system
    administrator.


    # Writing Your Password on a Sticky Note


    Okay, maybe this one doesn''t apply if you work at home, live alone, and don''t
    have any friends, cleaning people, or burglars. Otherwise, you should keep your
    password to yourself. Not that anyone has malicious intent — let''s not paranoid
    — but people can get curious around computers. And you never know when an inquisitive
    14-year-old knows more about UNIX than you do will appear on the scene. If you
    can''t remember your password, choose a new one that is more memorable.(Refer
    to Chapter 1 for hints.)


    # Sending Angry Electronic Mail (Flaming)


    Electronic mail can bring out your insidious side. There are you, sitting alone
    in your cubicle with your computer, and you get ticked off at something, usually
    some stupid message sent by a coworker. Before you know it, you have composed
    and sent a tactless, not to say downright rude, response.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_371_0.png)'
  merge: -1
  pgno: 371
- img_proc: true
  md: 'Say things in e-mail that you would never say in person or even write in a
    memo is easy. But e-mail has an off-the-cuff, spontaneous style in most organizations,
    and it can get you into trouble.


    Sarcasm seldom works in e-mail — instead, you just sound mean. Gentle suggestions
    can turn into strident demands just because they appear in ugly computer type
    on a computer screen. Rude mouthing off via e-mail even has a special name: flaming.
    A message full of tactless, pointless complaints is referred to as a flame. A
    series of flames between two or more people is called a flame war. You get the
    idea.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_372_0.png)


    Recipients of your mail can easily forward copies of it to anyone else, so imagine
    that everyone in the office may read your missives. Think twice before sending
    e-mail containing negative remarks! Then don''t send it. Remember that the best
    way to end an unpleasant exchange is to let the other person have the last word.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '350 Part VI: The Part of Tens'
