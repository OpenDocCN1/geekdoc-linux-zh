    **Meaning:** You are trying to log in and didn''t enter a correct username or
    corresponding password.


    **Probable cause:** Two possibilities exist: One is that you typed your password
    incorrectly, and the other is that you typed your username incorrectly.


    **Solution:** Type slowly and deliberately, especially when you type your password
    and can''t see what you are doing. If you have trouble remembering your password,
    use the passwd command to change it to something more memorable, as described
    in Chapter 2.


    # No process can be found


    See the section "No such process," later in this chapter.'
