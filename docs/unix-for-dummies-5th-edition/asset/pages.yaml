  md: '# Stupid Window Manager Tricks


    We now delve into the nitty-gritty details of how to get stuff done using whatever
    window manager you happen to have on your computer. Because Motif is the most
    common window manager, we spend a fair amount of time on it in this book. If something
    we is specific to Motif, we tell you.


    If you''re lucky enough to have some version of the Common Desktop Environment
    (CDE), KDE, or GNOME, you can skip to the appropriate section later in this chapter.
    Because the Common Desktop Environment is built on Motif and KDE looks like a
    lot like CDE, we recommend that you read this section anyway to find out the basics
    about windows, icons, mice, and the various sundry widgets you encounter.


    # Opening a new window


    When you run a X program, generally speaking, it opens a new window. In some cases,
    you want to tell a program that is already running to open another window (another
    file for a word processor, for example), although the way you do that is specific
    to each program. You have to read the manual (gasp) for the program.


    You usually have at least one terminal running. A terminal window isn''t as sinister
    as it sounds: It''s a window that acts like a terminal. The usual program is called
    xterm; it acts like an antique DEC VT100 terminal. Most systems also have a modified
    terminal program that acts like the computer''s favorite terminal. Hewlett-Packard
    systems have hpterm, and some PC UNIX systems have xpterm, which acts like a PC
    console. For many purposes, all these terminal programs act the same. They start
    up by running a UNIX shell, and you type commands just as we describe in this
    book.


    You can use one of two ways to start a new program that opens a new window: the
    GUI-oriented, user-friendly way and the easy way.


    Follow these steps for the GUI-oriented, user-friendly way:


    +   1. Move the cursor so that it''s not in any of your current windows.

    2. Click the Menu mouse button.


    This button is the last one (the right-most button unless you have a left-handed
    mouse) in OpenLook and the first button otherwise.'
