  md: '# Part IV: UNIX and the Net


    # Escaping from ssh


    One place where ssh is quite different from telnet is in how you escape from a
    recalcitrant remote system: You type ~. (a tilde followed by a period) on a line
    by itself. What you have to do is press Enter (Return), tilde, period, Enter.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_257_0.png)


    # Username and secret key matching for ssh


    This section is pretty nerdy. If you work in an office with a bunch of workstations,
    you can assume that they all share usernames (the system manager should have arranged
    for all the necessary keys), and you can skip this section.


    The controls for ssh are in a directory called .ssh. On each computer you need
    to have your ssh key (actually a pair of keys: the private key that only stays
    on that computer and the public key that you copy to all of the other computers
    from which you plan to log in this one). Assume you have two computers squash
    and pumpkin, and you will be able to log into each from the other. The keys for
    each computer are in the .ssh directory and are called id_rsa and id_rsa.pub,
    id_dsa and id_dsa.pub. (Either will do; rsa and dsa are two different coding schemes
    that can use).


    To log in each computer, follow these steps:


    +   1. On pumpkin, if the keys don''t exist, create them by running ssh-keygen
    dsa and wait a minute or so while it thinks up a really good secret key for you.

    2. When it asks for the filename, press Enter to use the normal names, and it
    also asks for optional pass phrases to secure the keys, and press Enter not to
    use them.

    3. Copy the public key id_dsa.pub you just created on pumpkin to squash, where
    you call the copy pumpkin-key.

    4. Copy the file using sc or ftp, both of which are discussed later in this chapter.

    5. On squash, copy pumpkin.key to .ssh/authorized_keys.

    6. Log in from pumpkin into squash without a password.


    To go the other way, do the same steps, reversing the two computers. If you have
    more than two computers, on each computer you need to put all the keys of the
    other computers into authorized_keys, like this:


    ```

    cat pumpkin.key squash.key gourd.key >> ..ssh/authorized_keys

    ```'
