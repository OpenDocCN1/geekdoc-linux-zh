  md: '# Part II: Some Basic Stuff


    # Shut up already!


    Some installations of KDE could preconfigured to make a joyous noise to the user.
    You get clicks, whistles, bongs, and whoosh effects. Thrilling for 30 seconds,
    neat for a minute, madd after an hour. Follow these steps to turn the sounds off.


    +   1. Start up kcontrol.

    2. Open the Sound and Multimedia panel.

    3. Select the System Notifications heading.

    4. In the pop-up window to the right, select the KDE Window Manager.


    +   5. Press the More Options button.

    6. Find the Quick Controls panel.

    7. Select Sounds from the pop-up menu next to the Turn Off All.

    8. Click the Turn Off All button.


    Blissful silence.

    Don''t like it? That''s the Turn On All button is for. If cacophony is your thing,
    go wild.


    If you find wanting to change those settings, one reliable way to get to the settings
    program is to run the kcontrol program. You can run a command line in KDE by holding
    the Alt key and pressing the F2 key. (Then let go of Alt. It''s probably getting
    tired.) Type the command and press Enter. You''ll spend the most time playing
    with the Appearance & Themes sections at first. Try not to overdo it.


