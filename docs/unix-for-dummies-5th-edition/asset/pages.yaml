  md: '# Introduction


    Welcome to UNIX For Dummies, 5th Edition! Although lots of good books about UNIX
    are out, most of them assume that you have a degree in computer science, would
    love to learn every strange and useless command UNIX has to offer (and there are
    plenty), and enjoy memorizing unpronounceable commands and options. This book
    is different.


    Instead, this book describes what you really do with UNIX — how to get started,
    what commands you really need, and when to give up and go for help. And we describe
    it all in plain, ordinary English.


    # About This Book


    We designed this book to be used when you can''t figure out what to do next. We
    don''t flatter ourselves that you are interested enough in UNIX to sit down and
    read the whole thing. When you run into a problem using UNIX (“I thought I typed
    a command that would copy a file, but it didn''t respond with any message ...
    just dip into the book long enough to solve your problem.


    We have included sections about these kinds of things:


    +   - Typing commands

    - Copying, renaming, or deleting files

    - Printing files

    - Finding where your file went

    - Using the Internet from UNIX

    - Storing and updating a Web site on a UNIX computer

    - Connecting and communicating with people on other computers


    In this fifth edition, we updated the information about Linux (the popular version
    of UNIX), beefed up the information about the new KDE and GNOME window systems,
    and added information about Internet applications and hosting an Internet site
    on your own (or someone else''s) UNIX computer.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# UNIX For Dummies, 5th Edition


    # Conventions Used in This Book


    Use this book as a reference. (Or use it as a decorative paperweight — whatever
    works for you.) Look up your topic or command in the table of contents or the
    index; they refer to the part of the book in which we describe what to do and
    defines a few terms, if absolutely necessary.


    When you have to type something, it appears in the book like this:


    ```

    cryptic UNIX command to type

    ```


    Type it as it appears. Use the same capitalization we do — UNIX cares deeply about
    CAPITAL and small letters. Then press the Enter or Return key (we call it Enter
    throughout this book). The book tells you what happens when you give each command
    and what your options are. Sometimes part of the command is in *italics*; the
    *italicized* stuff is a sample name, and you have to substitute the actual name
    of the file, computer, or person affected.


    Chapter 24 lists error messages you may run into, and Chapter 25 lists common
    user mistakes. You may want to peruse the latter to avoid these mistakes before
    they happen.


    # Foolish Assumptions


    In writing this book, we have assumed these things about you:


    +   - You have a UNIX computer or remote access to one.

    - You want to get some work done on it.

    - Someone has set up so that, if you turn it on (in many cases, it''s left on
    all the time) or connect, you are talking to UNIX.

    - You are not interested in becoming the world''s next UNIX expert.


    # How This Book Is Organized


    This book has six parts. The parts stand on their own — you can begin reading
    wherever you want. This section lists the parts of the book and what they they
    contain.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Introduction 3


    # Part 1: Before the Beginning


    This tells you how to get started with UNIX, including figuring out kind of UNIX
    you''re using. (You need to know this information later because commands can differ
    from one type of UNIX to another.) You find out how to log in, type UNIX commands,
    and ask for help. For Linux users, we include a short chapter on what''s it all
    about, why Linux is cool, and how to get more information about Linux.


    # Part 11: Some Basic Stuff


    Like most computer systems, UNIX stores information in files. This part explains
    how to deal with files — creating, copying, and getting rid of them. It also talks
    about directories so that you can keep your files organized, finding files that
    have gone astray, and printing files on paper.


    # Part 11: Getting Things Done


    This part talks about getting some work done in UNIX. It gives step-by-step instructions
    for using the most common text editors to create and change text files, running
    several programs at the same time (to get confused times as fast), and making
    your Linux system behave, and gives you directions for a bunch of other useful
    UNIX commands.


    # Part IV: UNIX and the Net


    UNIX systems are connected to networks, and many are connected to the biggest
    network of all — the Internet. This part prepares you for the world of communications,
    including instructions for sending and receiving electronic mail, for transferring
    files over the network, for logging in to other computers over the Internet, and
    for surfing on the World Wide Web. For those of you with intestinal fortitude,
    we include an updated chapter on how to have your Internet site run on your own
    UNIX computer.


    # Part V: Help!


    If disaster strikes, check this part of the book. It includes information about
    what to do if something bad happens, what to do about backups, and what to do
    when you see common UNIX error messages.'
  merge: -1
  pgno: 26
