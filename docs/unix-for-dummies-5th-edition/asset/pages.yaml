  md: '# 204 Part III: Getting Things Done


    # Berkeley ps (and qs)


    The basic report from the BSD version of ps looks like this example:


    | PID TT STAT TIME COMMAND |

    |---|---|---|---|

    | 7335 p4 R | 0:00 | -csh (csh) |

    | 7334 p4 R | 0:00 | |


    The PID, TT, and COMMAND columns are the same as you already know about. (In the
    COMMAND column, the true name of the program is listed in parentheses after a
    dash or is sitting in the regular name.) The TT column lists a short form of the
    terminal name (pseudonym4, in this case). STAT lists the status of the process:
    R means the process is running right now; anything else means it isn''t. Usually,
    you don''t care unless you have a stuck process and you wonder whether it is waiting
    for you to type something (then its status is I or W) or running off into the
    winds (then its status is R).


    Adding the -u switch gives a user-oriented report, although perhaps a different
    kind of user that you were in mind, as you may get from this example:


    | USER PID CPU %MEM SZ RSS TT STAT TIME COMMAND |

    |---|---||-|-|-|-|-|-|-|----||

    | John | 7335 0.0 196 436 p4 R | 14:59 0:00 -u |

    | John | 7335 0.0 196 316 p4 S | 14:56 0:00 -tcsh (tcsh) |


    The %CU and %MEM columns list the percentage of the available processor time and
    system memory the process has taken recently (the numbers are usually close to
    0). RSS is Resident Set Size, a measure of how much memory the process is using
    right now, measured in thousands of bytes (abbreviated as K). The ps command,
    for example, takes 436K (which is horrifying when you consider the entire UNIX
    system used to fit into 64K total bytes). The START column lists the time of the
    process began.


    You can ask for a particular terminal''s process list using the -t option, as
    shown in this example:


    ```

    ps -tp4

    ```


    With the t option, you have to use the same two-letter terminal abbreviation ps
    uses. Have fun guessing. Try the two-letter abbreviations that appear in the TT
