  md: '# Part III: Getting Things Done


    # ZippyZip day-tah


    ZippyZip and PKZIP are widely used compression programs among Windows and DOS
    users to create ZIP files containing one or more files together. You may run into
    ZIP files if you get information from the Internet or on a disk from a DOS or
    Windows system. Fortunately, a number of volunteers (led by a perfectly nice guy
    who goes by the enigmatic handle of Cave New) have written free zipping and unzipping
    programs named zip and unzip. Because they''re both available for free over the
    Internet, no UNIX system should be without them.


    To unzip a ZIP file, you use unzip:


    ```

    unzip video-list.zip

    ```


    The unzip command has a bunch of options, the most useful of which is -1, which
    tells the program to list the contents of the ZIP file without extracting any
    of the files. To find out all the options are, run unzip with no arguments.


    If you need to create a ZIP file, you can use the equally barming zip program:


    ```

    zip video-list *.txt

    ```


    This command says to create a file video-list.zip (it adds .zip part if you don''t)
    containing all the files in the current directory whose names end in .txt. The
    zip program has a number of options, the most useful of which is -9, meaning to
    compress as much as possible even though it''s slow (-1 as fast as possible; other
    digits give results in between), and -k, which means to make the file look just
    like one on a DOS system, not using any lowercase filename or UNIX-isms. We use
    zip -9k to create ZIP files to copy to DOS systems.


    Incidentally, gzip bears only the vaguest connection to zip and unzip, gzip compresses
    single files, whereas zip compresses multiple files into a single archive.


    # What''s in That File?


    Sometimes you have a bunch of files and no recollection of what they contain.
    The file command can give you a hint. It looks at the files you name on the command
    line and makes its best guess about what''s in the files.'
