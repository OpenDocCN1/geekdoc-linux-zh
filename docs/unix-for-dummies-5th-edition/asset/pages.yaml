  md: '# You Too Can Be a Script Writer


    You can make your own commands (that is, shell scripts) and put them in your bin
    directory. A shell script is a text file that contains a list of shell commands
    — the same commands you type at the shell prompt. You can store a list of commands
    as a shell script and run the commands any time by typing the name of the shell
    script. This section tells you how.


    # Shelling a script


    To create a shell script, use any text editor (refer to Chapter 10). Enter the
    commands one per line, as you type them at the shell prompt. Save the file in
    your bin directory.


    Here''s an example — if you frequently search for files with names that begin
    with budget, you are probably tired of typing this command and over:


    ```

    find -name budget* -print

    ```


    (Check out Chapter 8 to see how the find command works.) Instead, you can put
    this command in a shell script and perhaps name the script findbud. To do it,
    create a text file named findbud that contains just one line: the command.


    First you move to your bin directory because that''s where your programs live:


    ```

    cd bin

    ```


    Then you use a text editor to create a text file containing the commands you want
    in your script. In this example, we use ed, a creepy editor, but you can use the
    editor of your choice instead. Type


    ```

    ed findbud

    ```


    UNIX responds with this line:


    ```

    ?findbud

    ```


    or maybe


    ```

    findbud: No such file or directory

    ```


    Either way, you are editing the findbud file. Type this command:


    ```

    a

    ```'
