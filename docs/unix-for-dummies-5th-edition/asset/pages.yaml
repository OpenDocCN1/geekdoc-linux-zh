  md: '# 214 Part III: Getting Things Done


    # ## How do I1 turn this thing off?


    UNIX and Linux are very sensitive to impolite treatment on the part of the operator.
    If you just log out and turn off the machine with the power switch, it reminds
    you of this rude treatment with a flood of error messages when you next restart
    the computer. To turn the machine off, you must execute the shutdown command.
    While logged in as root, enter the shutdown now to turn the machine off gracefully.
    If other users are logged in and you want to give them some warning, you can type
    the number of minutes until shutdown: shutdown -10, for example, waits minutes
    before shutting down and warns any users who are logged in. To reboot the computer,
    shutdown -r now (- for reboot) shuts down the machine and then restarts it. Some
    Linux systems also let the "three-finger salute" (Ctrl+Alt+Del, familiar to DOS
    and Windows users) serve as a shortcut for shutdown now.


    # ## Pride of Linuxes


    Linux systems are packaged into distributions, which describe how Linux is distributed
    but rather how the operating system and the GNU programs are bundled. A few distributions
    are in common use: Slackware, Red Hat, Mandrake, and Debian. All are available
    for free via the Internet or for a small charge on CD-ROM. As a user, which distribution
    you use doesn''t matter because they all behave in the same way. As a system administrator,
    you should consider the important differences the distributions have among them.


    Slackware, the oldest of the three, has been around since the beginning of Linux.
    It is the most traditional distribution (traditional in the UNIX sense, as in
    not particularly user-friendly) and has relatively little in the way of utilities
    to facilitate the management of a Linux system. For this reason, those who have
    around UNIX systems for a while tend to


    # Linux: Not just for PCs


    Although Linux was originally developed for Intel-based PCs, you can now find
    versions of Linux for just about every kind of computer currently in production.
    Most of the popular distributions have versions for the PowerPC (the chip inside
    modern Macs), and Yellow Dog Linux (www.yellowdoglinux.com) has a version designed
    for Macs. If you have ten million to spare, IBM will be happy to sell you a high-end
    mainframe computer running Red Hat, SuSE, or Turbolinux, or if you want, all three
    at the same time.'
