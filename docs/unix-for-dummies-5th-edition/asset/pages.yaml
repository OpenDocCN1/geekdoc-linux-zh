    # Putting Your Ducks on the Web


    Web sites on UNIX systems use directories, too. Many ISPs organize their Web servers
    by user, if your username is fred, your Web site is called http://www.mysip.com/fred
    or maybe http://www.mysip.com/~fred/. The site''s home page is usually a file
    called index.html in the site''s home directory, and the other pages are files
    whose match their URLs, so a page named http://www.mysip.com/fred/effluent.html
    is stored in a file called effluent.html. If your site has more than a handful
    of pages, you should organize it into directories. By no coincidence, the syntax
    of URLs is almost exactly the same as the syntax of UNIX filenames, so if you
    organize your site so that a page is called http://www.mysip.com/fred/Greenstuff/Smelly/effluent.html,
    the file is called Greenstuff/effluent.html.


    A few directories are reserved for special Web purposes, so you have to be careful
    to avoid them. The list varies from server to server (this is UNIX, after all),
    the directory cgi-bin is invariably reserved for CGI scripts, programs that the
    Web server runs to produce pages on the fly. Check with your host to find out
    the reserved directories on your system.


