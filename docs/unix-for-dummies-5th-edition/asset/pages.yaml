- img_proc: true
  md: '# 230 Part IV: UNIX and the Net


    # How do I get networked, anyway?


    If your UNIX system is in an office with an Ethernet LAN or you have a home network
    with a router, you usually put your system on the net with little effort. When
    most software is first installed, it asks whether you have a LAN connection. Make
    sure a network cable is plugged from your computer to the LAN hub or router and
    tell the installation software that you,


    there''s a LAN. (Um, well, yeah, that''s kind of obvious.) If it asks whether
    you want to get your network address automatically, dynamically, or by DHCP, three
    increasingly geeky ways of saying the same thing, also say yes. Barrington bad
    luck, your computer automatically connects to the local network each time it starts
    up.


    # Telnet It Like It Is


    Telting (in English, you can "verb" any word you want) involves no more typing
    telnet and the name of the computer you want to log in to:


    telnet pumpkin


    UNIX tells you that it is making the connection and gives the usual login prompt:


    ```

    Trying...

    Connected to pumpkin.bigcorp.com.

    Escape character is ''^''\nFreeBSD 4.8 (pumpkin.bigcorp.com)

    login:

    ```


    At the login prompt, you type your username and then your password. After the
    other computer, you log in exactly as though you are sitting at the other computer.
    In the following example, you typed john1 as our user-name and then gave our secret
    password:


    ```

    login: john1

    Password:

    Last login: Thu Oct 3 0:03:58 from squash

    FreeBSD 4.8-RELEASE (PUMPKIN) #0: Thu Jul 24 14:49:39 EDT

    2003

    Please confirm (or change) your terminal type.

    TERM = (xterm)

    ```'
