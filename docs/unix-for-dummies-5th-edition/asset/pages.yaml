  md: '# Part III: Getting Things Done


    # Undo your thing, ed!


    Wait — ed has one useful, humane command, after all! The u command enables you
    to "undo" the last (and only the very last) command you made to the file. If you
    delete a line by mistake with the d command, for example, you can type u and press
    Enter to undo the deletion.


    Be sure that you don''t make any changes before using the u command. It undoes
    only the last thing you did.


    # Time to ed out


    When you finish making changes and you want to leave ed (even if you''re not finished
    making changes and you want to leave ed, type q and then press Enter. If you are
    in input mode, first type a period on a line by itself to get into command mode.
    Press the q key to quit.


    If you haven''t saved your work by using the w command, ed just doesn''t quit.
    Instead, it displays a question mark to tell you that it was expecting a w command
    first. To save your changes, type these two commands, pressing Enter after each:


