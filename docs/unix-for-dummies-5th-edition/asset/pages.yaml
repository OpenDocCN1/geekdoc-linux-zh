- img_proc: true
  md: '# Chapter 21: Disaster Relief


    If your computer is on a network or has more than one terminal, you can ask a
    computer guru to kill the program. If you''re feeling brave, you can kill the
    program yourself. When you kill a program, you lose any work you were doing in
    that program since the last time you saved data to the hard drive.


    Tell the wizard what happened (in order), which programs were running, and what
    you did. She will probably kill the process, as described in Chapter 23. If you
    have a number of processes running, she may kill one after another until your
    computer feels better.


    # # I Give Up


    Sometimes discretion is the better part of valor (whatever that means). If you
    need to call for help, be sure to do the following:


    +   - Don''t turn off the computer. Unless flames are coming from the screen and
    threatening to engulf your entire office, this option is not a good idea. Even
    then, you may be better off waiting for it to trip the circuit breaker facing
    your wizard, who will surely ask, "Did you turn it off?",


    +   - Know the symptoms. Be ready to tell someone what happened and which actions
    you took to fix the problem.


    +   - Know what has changed recently. Did you install software? Did you run something
    you have not run before? New things are always suspicious. A claim of "I didn''t
    change anything" does not endear you to your wizard. Sorting, somewhere, *must*
    have changed.


    +   - If you call for help by phone, call from within reach of your computer.
    Your savior may want to try a few maneuvers at the keyboard.'
