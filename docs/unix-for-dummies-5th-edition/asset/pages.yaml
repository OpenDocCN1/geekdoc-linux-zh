- img_proc: true
  md: '# Chapter 15: Your Computer Is Not Alone


    A considerably more informative program is finger because it produces a more useful
    report than who does:


    ```

    Login Name      Tty Idle Login Time Office Phone

    john John R Levine co  23d Sep 3 14:57 NY 387

    john John R Levine p1  6:10 Sep 3 14:57 NY 387

    john John R Levine p2  1d    Sep 3 14:57 NY 387

    john John R Levine p3 22d Sep 4 17:48 NY 387

    john John R Levine p4 1:53 Sep 18 10:48 NY 387

    john John R Levine *p5 1:14 Sep 26 14:42 NY 387

    ```


    Although finger reports the same as who does, it also looks up the user''s real
    name (if it''s in the user password file) and tells you how long the terminal
    has been idle (how long it has been since the user typed something). If the system
    administrator entered the information, finger also shows an office phone number,
    room number, or other handy info about the user.


    You can also use finger to ask about a specific user, and UNIX looks up some extra
    info about that user. In this example, we used it to look up one of the authors
    of this book:


    finger john


    UNIX returned this information:


    ```

    Login: John               Name: John R Levine

    Directory: /home/john      Shell: /bin/bash

    Office: Trumansburg, 607 387 6874

    On since Wed Sep 3 14:57 (EDT) on console, idle 23 days 10 hours

