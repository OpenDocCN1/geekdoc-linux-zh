  md: '# Part II: Some Basic Stuff


    # Making a long listing stop and start when you''re ready


    If you have a large number of files, the ls listing may fly right off the top
    of your screen. If you have this problem, type this line:

    nls | more

    after the basic ls command tells UNIX to stop listing information to the screen
    just before the first file disappears from view. Press the space-bar to see the
    next screen of filenames.


    The vertical bar is called pipe (we talk more about the pipe in Chapter 7). The
    | more option


    # Roger, 1 Copy


    You can make an duplicate of a file. To do it, you must know the name of the file
    you want to copy, and you must create a new name to give to the copy. If a file
    contains your January budget (called budget.jan, for example) and you want to
    make a copy of it to use for the February budget (to be called budget.feb, for
    example), type this line:


    ```

    cp budget.jan budget.feb

    ```


    The lazy typeset strike again. Be sure to leave spaces after the cp command between
    the existing and new filenames. This command doesn''t change the existing file
    (budget.jan); it creates a new file with a new name, and with the same contents.


    # A good way to lose some work


    What if a file named budget.feb already exists? Tough cookies! UNIX blows away
    and replaces it with a copy of budget.jan. It is truly an excellent idea to use
    the ls command to make sure that you don''t have a file with the new name you
    have chosen.


    In most versions of UNIX, however, you can use the -i option to ask cp to inform
    you whether a file with the new name exists. If it does, the -i option asks you
    whether to proceed. Type cp -i rather than just cp to use this nifty little feature.'
  merge: -1
