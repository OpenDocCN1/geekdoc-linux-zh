    # Addressing the Mail


    E-mail, like regular mail (usually referred to by e-mail advocates as snail mail)
    needs an address, usually called an e-mail address. To send mail to a person,
    you send it to his or her username (refer Chapter 1 for information about logging
    in with a username). If the other user uses a different computer than the one
    you use, the mail system has to know which computer the other person is on — and
    the address becomes complicated.


    # Sending mail to people nearby


    For people who use the same mail server you do (roughly, you both use PCs connected
    to the same mail-handling computer running UNIX), the mail address is just their
    username. If you enter georgew for your username, that''s your mail address unless.
    Make sure you don''t use uppercase letters in the mail address unless the username
    does.


    # Sending mail to people elsewhere on your local network


    You can send mail to people who use other mail servers if they''re connected by
    a network. For people who use other computers, you can send mail by telling the
    system mail which server they use.


    Servers have names, you know. Sometimes they have boring names that indicate what
    they are used for, such as marketing or corpactcg. When you''re writing to someone
    elsewhere on your network, include the server name in the mail address by using
    an sign (@ to indicate where they are “at.\ If your friend Nancy, for example,
    the username nancyb and uses a server named ginger, her mail address nancyb@ginger.


    A skillful system administrator can automatically note which computer each user
    in an organization uses. With luck, you can merely send mail by username, and
    the system automagically figures out which computer to send it to.'
