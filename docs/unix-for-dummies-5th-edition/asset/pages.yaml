- img_proc: true
  md: '# 340 Part V: Help!


    # Too many links


    **Meaning:** You are trying to make so many links to a file that you have exceeded
    the maximum number of links to a file.


    **Probable cause:** The maximum number of links to a file is 1,000. You must have
    a heck of a typist to get this message, or more likely you were running a script
    that linked a little less enthusiastically than you had intended. Because the
    parent directory is linked to each of its subdirectories, you also get this message
    if you try to make more than 1,000 subdirectories in one directory.


    **Solution:** Stop making links.


    # Usage


    **Meaning:** UNIX doesn''t like the number or types of arguments you typed after
    the command. It is telling you (in its own cryptic way) the correct way to use
    the command.


    **Probable cause:** UNIX usually displays this message with another, more specific
    message. Check out the other message to see what the real problem was. The usage
    message is the UNIX reminder about how to use the command. After `usage`, you
    see the command, followed by the options and arguments you can use with the command.
    Unfortunately, you get no clue about what the options are.


    **Example:** You type this line:


    ```

    kill abc

    ```


    UNIX responds with this message:


    ```

    usage: kill [signno ] pid

    ```


    This means that the correct way to use the `kill` command is to type **kill**,
    a space, (optionally) the type of signal you want to send to the process, another
    space, and then the process ID. Don''t type the [ ] — we stick them in to let
    you know which part of the command is optional — not that it''s entirely clear
    from the message!


    **Solution:** Check your typing, as always. Make sure that spaces are between
    things on the line (between filenames or between a filename and an option,'
  merge: -1
