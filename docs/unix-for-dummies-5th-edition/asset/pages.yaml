  md: '# Chapter 3: A Few Lines on Linux


    # How free is free?


    | Linux is free software. In the UNIX software biz,"free" has a concrete meaning
    that is different from public domain and different from shareware. | The idea
    is that people are permitted, even encouraged, to distribute copies of GPL software
    and to sell maintenance service, as long as the software itself remains freely
    available. |


    Linux is made under the GNU General Public License (GPL), Version 2, the same
    license as the Free Software Foundation uses for most of its programs. The license
    has seven pages of legale, much of which is what copy rights have to appear and
    stuff like that, but the basic plan is simple. In short, it says:


    Don''t confuse free software with silverware, which is for which you are supposed
    to pay the original author if you use it, or public domain software, with which
    you can do anything you want.


    +   - You can copy and distribute Linux and other GPL software, and you can charge
    for it.

    - But anyone to whom you distribute it has the right to give copies away for free.

    - And you must include the source code (or make it available for no more than
    a reproduction fee) in the distribution.


    Although the GPL was subject to considerable debate and a fair amount of ridicule
    when it first came out in 1990, it has worked perfectly much as its authors intended
    — software (including Linux) is widely available, and people intend constantly
    on and improve it.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_58_0.png)


    Keep in mind that because Linux is a moving target, with frequent improvements
    to the programs, the version of Linux you use is probably not exactly the same
    as the version described in any book, including this one. At the time we wrote
    this edition of Linux, the latest version of Linux was 2.5.75, even if you have
    a more recent version, the basic structure is the same.


    A look at various Web sites and Usenet newsgroups dedicated to Linux shows a flurry
    of Linux-related activity. Programs, extensions, and enhancements for Linux appear
    daily, it seems. Red Hat Linux, for example, now offers a range of snazzy products,
    including a Web server, Microsoft Office-like suites of tools including AppWare
    and OpenOffice, and fully graphical integrated desktops (see Chapter 4 for details
    about UNIX desktops).


    Several organizations have set up computer clusters — hundreds of computers acting
    like one enormous supercomputer — built out of ordinary Linux systems connected
    by Ethernet. You can get the source code, operating system, and management tools
    to set up such a cluster off the Internet for free (at www.beowulf.org). Or if
    you want all of computing in one place, you can buy a multi-million dollar IBM
    mainframe computer and run Linux on it, too.'
