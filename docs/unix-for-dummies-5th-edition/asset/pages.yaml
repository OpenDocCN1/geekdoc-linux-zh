  md: '# 112 Part II: Some Basic Stuff


    Here''s how history works. The shell stores in a history list a list of the commands
    you''ve given. Then you can use the list to repeat commands exactly as you typed
    them the first time or edit previously used commands so that you can give a similar
    command.


    # History in the key of C


    In C shell, you can type !! and press Enter to repeat the last command you typed.
    The shell displays the command and executes it.


    You can also rerun the last line that begins with a particular bunch of letters.
    If you type


    ```

    !find

    ```


    the C shell repeats the last command line that began with the text find. You don''t
    have to type an entire command. If you type


    ```

    !fi

    ```


    it looks for the last command you typed that started with fi, which may be a find
    command or file command.


    To see the history list, type history. You see a list like this:


    ```

    1 20:26 ls

    2 20:26 ls -l

    3 20:26 ls -al

    4 20:26 history

    5 20:26 cat Junk3

    6 20:26 .term

    7 20:26 history

    8 20:27 history

    ```


    This example shows the commands you typed, in the order you typed them. Because
    the list is numbered, you can refer to it by number. After the number comes the
    time you gave the command (if you care), followed by the command you typed.


    If you want to repeat a command, you can type ! followed by the number of the
    command. For example, if you type


    ```

    !3

    ```'
