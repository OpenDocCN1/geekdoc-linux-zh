  md: '# 82 Part II: Some Basic Stuff


    If all goes well, UNIX reports nothing, and you see another prompt. Use ls to
    see whether the rm command worked and the file is gone.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_105_0.png)


    Watch out! Under most circumstances, you have no way to get a file back after
    you delete it.


    To be safe, you can use the -i option to ask rm to confirm deletion of the file.
    This is a particularly good idea if you use wildcards to delete a group of files
    all at one time (Chapter 7 for more info about wildcards). For example, if you
    type


    ```

    rm last-years-budget

    ```


    UNIX asks:


    ```

    rm: remove ''last-years-budget''

    ```


    Press the y key to delete the file or the n key to leave it alone.


    # Big, big trouble


    If you delete something, really important and you will be called on to perform
    ritual seppuku if you can''t get it back, don''t give up hope. Your local UNIX
    guru should make things called backups on some regular basis. Backups contain
    copies of some or all of the files on the UNIX system. Your files may be among
    those on the backup. Go to the guru on bended and ask whether the file can be
    restored. If the file wasn''t backed up recently, you may get an older version
    of it, but hey—it''s better than the alternative.


    Even before you get yourself into this kind of pickle, you want to ask your UNIX
    expert to confirm that regular backups are made. Make sure that your important
    files are included in the backups. If no one is making backups, panic! This is
    not a safe situation. You had better talk to your system administrator about getting
    a backup system.


    # Good housekeeping


    You should get rid of files you no longer use, for several reasons:


    +   Having all kinds of files lying around becomes confusing, and remembering
    which ones are important is difficult.


    +   Useless files take up disk space. Whoever is in charge of your UNIX system
    probably will bother you regularly to "take out the garbage," to get rid of unnecessary
    files and free up some disk space.'
