  md: '# Chapter 10: Writing Deathless Prose


    On the other hand, commands in emacs aren''t exactly intuitive. Still, we like
    them better. If you are wondering, the name emacs comes from editor macros because
    the original version of emacs was written as an extension to an early text editor
    called teco, an editor that makes ed (see the section “Talk to Mr. Ed,” at the
    end of this chapter) look like the winner of the Nobel prize for user-friendliness.
    (Scary thought, isn''t it?)


    To run emacs, type this line:


    ```

    emacs eating.peas

    ```


    You replace eating.peas with the name of the file you want, of course. If the
    file name doesn''t exist, emacs creates it. Like vi, emacs displays a full-screen
    view of your file, as shown in Figure 10-2. On the bottom line of the screen is
    the status line, which tells you the name of the file you are editing or other
    interesting information.


    | Figure 10-2: The GNU Emacs display in a text console at the bottom of the screen,
    emacs displays on the status filename and other mysterious information. | I eat
    my peas with honey, I''ve done it all my life, It makes the peas taste funny,
    but it keeps them on the knives.


    eating.peas [Fundamental] 100% × |


    # A tale of two emacs


    Unlike vi, emacs does not automatically come with UNIX. Most versions of emacs
    are distributed for free, however, most systems have it or can get it. By far
    the two most common versions of emacs are GNU Emacs and XEmacs. Despite the name,
    XEmacs runs under both X Windows and text-based consoles, and so does GNU Emacs.
    The basic commands are the same'
