  md: '# Chapter 15: Your Computer Is Not Alone


    # I''m talking — where are you?


    Sometimes write tells you that the user is logged in on several terminals:


    ```

    dguertin is logged on more than one place.

    You are connected to "vt01".

    Other locations are:

    ttyp1

    ttyp0

    ttyp2

    ```


    The write command is pretty dumb. If the person you are writing to is logged

    in more than one terminal — or more typically, is using many windows in

    X— write picks one of them at random and writes you. You can be virtually

    certain that the window or terminal write chooses is not the one the user is

    viewing at the home. To maximize the chances of their seeing your mes

    age, use the finger command to figure out which terminal is most active

    (one with the lowest idle time) and write to that window. Remember the

    results of the finger command, for example, from a few pages back:


    | Login | Name | Idle | When | Office |

    |---|---|---|---|--|

    | root | 0000-Admin(0000) | 1:11 | Tue | 20:16 |

    | dguertin David S. Guertin | vt | 1:11 | Mon | 15:19 |

    | dguertin David S. Guertin | vt | 1:35 | Tue | 16:47 |

    | dguertin David S. Guertin | p2 | 1:11 | Wed | 16:36 |

    | dguertin David S. Guertin | p1 | 1:11 | Wed | 17:20 |

    | dguertin David S. Guertin | p0 | 1:11 | Wed | 16:36 |


    The best candidates to send a message to are ttypl and ttyp0. (The finger

    command cuts the tty from terminal names.)


    To write to a specific terminal, give the terminal name after the

    username:


    ```

    write dguertin ttypl

    ```


    If you are writing back to a user who just wrote to you, you should use the

    terminal name that was sent in his write message (in this case, it was also

    ttypl).


