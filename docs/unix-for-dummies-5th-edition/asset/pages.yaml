  md: '# Chapter 19


    # Grabbing Files from the Net


    In This Chapter


    +   - Getting files from all over the Internet

    - Stashing files all over the Internet

    - Lotsa swell stuff for FTP

    - Navigating in anonymous land

    - Finding files by name


    In Chapter 18, we explain how to use your Web browser to grab files stored on
    the Internet. Web browsers are definitely the easiest way to download files to
    your computer; just find a Web page with a link to the file and click the link.


    If you want to copy or from a non-UNIX machine, or if you don''t retrieve files
    from a public file archive on a machine which you don''t have a personal account,
    you need an industrial-strength file-copying program. Your Web browser just can''t
    cut the mustard (whatever means). Instead, you can use the File Transfer Protocol
    (FTP) system, which is widely used on computers all over the Internet.


    You can use FTP to transfer files to or from computers which have accounts. You
    can also use FTP to download (transfer to your computer) files from any of a bunch
    of publicly available FTP servers out there on the Internet. Thousands of public
    FTP servers are on the Internet, each with hundreds of files that may be of use,
    including text, pictures, and programs. It''s just a matter of locating and downloading
    them!


    # You''re a Copying Machine


    Copying a file from one place to another is simple (but don''t forget — computers
    are involved). Here''s how it works: Log in to the other computer for FTP, and
    tell it what you want to copy and where you want to copied.'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# Part IV: UNIX and the Net


    # Getting connected


    To run the ftp program, you type ftp and the name of the host computer where the
    FTP server you want is:


    ```

    ftp.iecc.com

    ```


    (That''John''s computer. It has files, but perhaps not all that many in which
    you are interested, unless you care deeply about techniques for translating one
    programming language to another.) Substitute the FTP server''s name for ftp.iecc.com.


    Assuming the FTP server is not too busy to connect, it greets you with a message
    like:


    ```

    Connected to ftp.iecc.com.

    20 tom.iecc.com FTP server (BSDI Version 7.0ULS) ready.

    ```


    The computer asks for your username and password on the host computer. If you
    don''t have an account on the computer, don''t panic. See the section “No Names.
    Please,” later in this chapter. (On this particular computer, unless you happen
    to be one of the authors of this book, it''s extremely unlikely that you have
    an account. We''re using it as example.)


    If the FTP server likes you, it says something like this:


    ```

    230 User john logged in.

    ftp>

    ```


    The ftp> is the FTP prompt, telling you that it''s ready for you to type a command.


    # Getting your file


    To copy a file from the FTP server (the host computer) to your own computer, you
    use the get command:


    ```

    README

    ```


    Substitute the name of the file in place of README in this command. FTP says something
    like this:


    ```

    150 Opening ASCII mode data connection for README (12686

    bbytes).

    226 Transfer complete.

    local: README remote: README

    12979 bytes received in 28 seconds (0.44 Kbytes/s)

    ```'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Chapter 19: Grabbing Files from the Net


    FTP always tells you much more than you want to know about the transfer.

    When it says that the transfer is complete, you have the file.


    You have to type the filename by using the syntax the server uses. In particular,
    if the server is a UNIX system (as most are), upper- and lowercase are different,
    so README, Readme, and readme are different filenames.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_304_0.png)


    # Getting out


    When you finish transferring files, type the command quit. FTP responds with his
    heartfelt message:


    221 Goodbye.


    # Files with Finesse


    That''s basically how FTP works, although you need to know, of course, about 400
    other odds and ends just to use FTP effectively.


    # When is a file not a file?


    When it''s a file text. The FTP definition specifies six different kinds of files,
    of which only two types are useful: ASCII and binary. An ASCII file is a file
    text. A binary file is anything else. FTP has two modes, ASCII and binary (also
    called image mode), to transfer the two kinds of files. When you transfer an ASCII
    file between different kinds of computers that store files differently, ASCII
    mode automatically adjusts the file during the transfer so that the file is a
    valid file when it is stored on the receiving end. A binary file is left alone
    and transferred verbatim.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_304_1.png)


    # Patience is a virtue


    The Internet is pretty, but not infinitely so. When you''re copying stuff between
    two computers on the same local network, information can move at about 200,000
    characters per second. When the two machines are separated by a great deal of
    intervening Internet, the speed


    drops — often to a few thousand characters per second or fewer. If you''re copying
    a file that''s 50,000 characters long, it takes only a few seconds over a local
    network, but it can take several minutes over a long-haul connection.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# 282 Part IV: UNIX and the Net


    You tell FTP which mode to use with the binary and ascii commands:


    ```

    ftp> binary

    200 Type set to I.

    ftp> ascii

    200 Type set to A.

    ```


    In the preceding example, the /l is for binary or image mode (after 25 years,
    the Internet protocol still can''t make up their minds what to call it), and the
    A is for ASCII mode. Most like FTP commands, binary and ascii can be abbreviated
    by lazy typists to the first three letters — so bin and asc sabe.


    # How to foul your files in FTP


    The most common FTP error that inexperienced Internet users (and experienced users,
    for that matter) make is transferring a file in the wrong mode. If you transfer
    a text file in binary mode from a UNIX system to a DOS, Windows, or Macintosh
    system, the file looks like this (on a DOS or Windows, or Macintosh system):


    This file should have been copied in ASCII mode.


    On a Mac, the entire file looks like it''s on one line. When you look at the file
    with a text editor on a UNIX system, you see strange ^M symbols at the end of
    each line. You do not necessarily have to reter the file. Many networking packages
    come programs that do ex facto conversion from the other.


    If, on the other hand, you copy something that isn''t a text file in ASCII mode,
    it gets scrambled. Compressed files don''t decompress; executable files don''t
    execute (or crash or hang the machine); images look unimaginably bad. When a file
    is corrupted, the first thing you should suspect is the wrong mode in FTP.


    > If you are FTPing (Is that a verb?) now between two computers of the same type,
    such from one UNIX system to another, you and should do all your transfers in
    binary mode. Whether you''re transferring a text file or a non-text file, it doesn''t
    require any conversion, so binary mode does the right thing.


    Getting a directory listing before issuing a get or put command is often comforting,
    so that you can have an idea of how long the copy will take.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Chapter 19: Grabbing Files from the Net 283


    # # The directory thicket


    Every time you connect for FTP stores files in many different directories, which
    means that to find what you want, you have to learn the rudiments of directory
    navigation. Fortunately, you wander around in FTP pretty much the same way as
    you do on your own system. The command you use to list the files in the current
    directory is `dir`, and to change to another you use the command `cd`, as in:


    ```

    ```

    ftp> dir

    200 PORT command successful.

    150 Opening ASCII mode data connection for /bin/ls.

    total 23

    drwxrxr-x 19 root archive 512 Jun 24 12:09 doc

    drwxrxr-x 5 root archive 512 May 18 08:14 edu

    drwxrxr-x 31 root wheel 512 Jul 12 10:37 systems

    drwxrxr-x 3 root archive 512 Jun 25 19:92 vendoroware

    ... lots of other else complete.

    226 Transfer complete.

    1341 bytes received in 0.77 seconds (1.7 Kbytes/s)

    ftp> cd

    250 CMD command successful.

    ftp> dir

    200 PORT command successful.

    150 Opening ASCII mode data connection for /bin/ls.

    total 3

    -rw-rw-r-- 1 root archive 87019 Dec 13 2003 R

    -rw-rw-r-- 1 root archive 41062 Dec 13 2003 RS

    -rw-rw-r-- 1 root archive 554833 Dec 13 2003 Rings

    drwxrxr-x 2 root archive 512 May 18 09:31 administrative

    drwxrxr-x 3 root archive 512 May 11 06:44 ee

    drwxrxr-x 8 root 234 512 Jun 28 06:00 math

    226 Transfer complete.

    200 bytes received in 63 seconds (0.0031 Kbytes/s)

    ftp> quit

    221 Goodbye.

    n```

    ```


    In a standard Unix directory, the first letter on the line tells you whether something
    is a file or a directory, `d` means it is a directory — anything else is a file.
    The `edu` in the preceding example, the first three entries are files and the
    last three are other directories. Generally, you FTP to a host, change to another
    directory, get a listing there, and so on until you find the files you want. Then
    you use the command to retrieve them.


    You often find that the directory on your machine which you start the FTP program
    is not the one you want to store the files you retrieve. In case, use the `cd`
    command to change the directory on the local machine.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# 284 Part IV: UNIX and the Net


    # What''s all with these three-digit numbers?


    You may notice that whenever you give a command to FTP, the response from the
    remote host begins with a three-digit number. (Or you may not notice; in which
    case, never mind.)


    The three-digit number is so that the FTP program wouldn''t know any English,
    can figure out what is going on. Each digit means something to the program.


    Here''s what the first digit means:


    +   1: The program has begin to process your request but hasn''t finished it.


    +   2: It has finished.


    +   3: It needs more input from you, such as when it needs a password after you
    enter your username.


    +   4: It didn''t work but may if you try again.


    +   5: You lose.


    The second digit is a message subtype.


    The third digit distinguishes messages that would otherwise have the same number
    (something that in the computer world would be unspeakakably awful).


    If a message goes on multiple lines, all the lines except the last one have a
    dash rather than a space after the number.


    > Note: Most FTP users have no idea what the numbers mean, by way, so that you''re
    one of the few who know, you''re an expert.


    To review: cd changes directories on the other host; lcd changes directories on
    your machine. (You might expect cd to change directories correspondingly on both
    machines, but it doesn''t.)


    # What''s that name again?


    Sometimes on your machine, you have to give a file name that''s different from
    the name it has on a remote machine. (This statement is particularly true over
    DOS machines, on which many UNIX names are just plain illegal, as well as which
    contain spaces and special characters.) Also, if you need to get a bunch of files,
    typing the get can be tedious. Fortunately, FTP has work-arounds for those problems.
    Suppose that you find a file named rose image and you want to download it as rose.gif
    because it''s gif-format. First, make sure you''re in binary mode, and then retrieve
    the file with the get command. This time, however, you have two names to get —
    the name of the file on the remote host and the local name — so that it renames
    the file as the file arrives. You do this as shown in this interaction:'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Chapter 19: Grabbing Files from the Net


    ```

    ftp> bin

    200 Type set to I.

    ftp> get rose2.gif

    200 PORT command successful.

    150 Opening BINARY mode data connection for rose2 (47935)

    (bytes).

    226 Transfer complete.

    local: rose2.gif remote: rose2

    47935 bytes received in 39 seconds (1.2 Kbytes/s)

    ```


    Next, suppose that you want to get a bunch of files that begin with ru. In that
    case, you use after mget (which stands for multiple GET) command to retrieve them.
    The names you type after mget can be either plain filenames or wildcard patterns
    that match a bunch of filenames. For each matching name, FTP asks whether you
    want to retrieve that file:


    ```

    ftp> mget *

    get ruby1? n

    get ruby2? n

    get rger_pistol? n

    get rugfur01? n

    get rush? y

    200 PORT command successful.

    150 Opening BINARY mode data connection for rush (18257)

    (bytes).

    226 Transfer complete.

    local: rush remote: rush

    18257 bytes received in 16 seconds (1.1 Kbytes/s)

    get rush01? y

    200 PORT command successful.

    150 Opening BINARY mode data connection for rush01 (20538)

    (bytes).

    local: rush01 remote: rush01

    20538 bytes received in 200.7 seconds (1.2 Kbytes/s)

    get rush02?

    ```


    If you find that mget matches more files than you expected, you can stop with
    the usual interrupt character for your system — typically Ctrl+C or Delete:


    ```

    ^C

    Continue with mget? n

    ftp> quit

    221 Goodbye.

    ```


    You can interrupt in the middle of a transfer if a file takes longer than transfer
    what you want to wait.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_308_0.png)'
  merge: -1
