    # "Where, oh, where is my window gone?"


    In Motif, you put the cursor in the title bar, press the first mouse button, and
    drag the window to where you want it (that is, move the window as you hold down
    the mouse button). This action brings the window to the front because you use
    the same button to do.


    You can move windows so that they are partially off the edge of the screen, sort
    of pushing windows to the side of your desk so that they hang over the edge (except
    that windows are less likely to fall on the floor). This capability is sometimes
    useful if the stuff in the window is all at the top or on one side.


    # Stashing your windows


    The title bar of window has buttons you can click. Near the right end of the title
    bar is a little box that contains a small dot; when you click it, you iconify
    the window; that is, the window turns into an icon.


    To get the window back, double-click the icon with the first mouse button.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_79_2.png)


    Icons normally appear in the lower-left corner of the screen, although you can
    move them by dragging the icon around with the mouse. After you move an icon,
    if you restore the window and re-iconify it, the icon reappears where you left
    it. You can lay out the icons to your taste by iconifying every window on-screen,
    moving the icons to tasteful positions, and restoring the ones you want to use.


    # Curious and curious: Changing window sizes


    The last bit of window magic involves changing window sizes. Motif has gone to
    a great deal of trouble to let you change the size of your windows, which tells
    us that they have given up trying to make them the right size in the first place.
    Oh, well. Little "grab bars" don''t have grab bars . The few you can''t resize
    have grab bars . You move the cursor to one of the grab bars, click the first
    mouse button, drag the cursor to where you want (make the window larger or smaller),
    and release the button.


