  md: '# Chapter 13: Juggling a Bunch of Programs 205


    The BSD version of ps has lots of useless options, including -1 for long technoid
    listing: -a for all processes, not just yours; and -x to show processes not using
    a terminal. You have no way to ask for all processes belonging to a particular
    user.


    To see all the processes you started, type this incantation:


    ```

    ps -aux | grep tracy

    ```


    Replace Tracy''s name with your own username. This line redirects the output of
    the ps command to the grep command (described in Chapter 8), which throws away
    all the lines that contain your username.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_228_0.png)


    # Why cd isn''t a process


    People always ask us (well, someone asked once) why the cd command doesn''t always
    act the way they expect it to. The problem is what is called in erud circles Lamarkian
    Habitability and what we call "you look like your mother."


    When a parent creates a child process, the child inherits many characteristics
    from its parent, such as the username, terminal, and (this one is important) current
    directory. The child, for itself—as all children—can change many of these things.
    Because inheritance goes one way, changes in the child don''t affect the parent.
    Suppose that you want to create a new process (type to start a new shell). Go
    to some other directory (than the one you are using, such as /tmp) by typing cd
    /tmp. Then type pwd to make sure that you are in /tmp. Leave the new shell by
    typing exit, and then type pwd back in the old shell to prove that you''re back
    in the original directory.


    This example proves that cd can''t be a normal command executed in its own process.
    If it


    were, the new directory would apply to only that process. As as the process was
    finished, you would be back in the shell with the directory unchanged.


    The authors of shells shells finished the problem using what''s technically known
    as a kludge (something that works but you''re not proud of; it rhymes with "huge",
    "fudge") The kludge checks every the cd command and handles itself for the exit
    and logout commands are also handled for the same reason.


    Here''s an example of where you might run into this: if you make a script (see
    Chapter 12) that contains a cd command, the cd affects only subsequent commands
    in script. After your script finishes running, you find yourself back in the original
    directory as though the cd never occurred. Although you could write a script that
    does change the directory, it is so complicated that even wizards shrink from
    the task.'
