    # Wild and Crazy Wildcards


    When you type a command, you may want to include the names of a bunch of files
    on the command line. UNIX makes the typing of multiple filenames somewhat easier
    (as though we should be grateful) by providing wildcards. Wildcards are the special
    characters (still more of them to remember!) that have a special meaning in filenames:


    | Wildcard | What It Means |

    | ? | Any single letter |

    | * | Anything at all |'
