  md: '# 128 Part II: Some Basic Stuff


    A nice feature of UNIX (and you thought there weren''t any!) is that this situation
    is possible — even easy to set up. A single file can have more than one name,
    and the names can be in different directories.


    Suppose that two authors are working on a book together (a totally hypothetical).
    The chapters of the book are in John''s directory: /usr/john/book. What about
    Margy? Having to type the following line every time work on the book begins is
    annoying:


    ```

    cd /usr/john/book

    ```


    Instead, the files could also be in /usr/margy/book.


    # How you can be in two places at once when you''re not anywhere at all?


    The way to let a file in two places at once is with the ln (for link) command.
    You tell ln in two things:


    +   - The current name of the file or files you want to create links to

    - The new name


    Start with just one file. Margy wants to make a link to the chapterlog file (it
    contains the list of chapters). The file is in /usr/john/book. In her book directory,
    Margy types this line:


    ```

    ln /usr/john/book/chapterlog book

    ```


    UNIX says absolutely nothing; it just displays another prompt. (No news is good
    news.) It created a link, or new name, however, to the existing chapterlog file.
    The file now appears also in /usr/margy/book as book. You have only one file (UNIX
    doesn''t make a copy of the file or anything tacky like that) with two names.


    # Playing the links


    You create a link by using ln, the file has two names in two directories. The
    names are equally valid. It isn''t as though /usr/john/book/chapterlog is the
    real name, and /usr/margy/book/booklog is an alias. UNIX considers both names
    to be equally important links to the file.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Deleting links


    To delete a link, use the same `rm` command you use to delete a file. In fact,
    `rm` always deletes a link. It just so happens, when no links to a file exist,
    the file dries up and blows away. When you use `rm` on a file that has one name
    (link), the file is deleted. When you use `rm` on a file that has more than one
    name (link), the command deletes the specified link (name), and the file remains
    unchanged, along with any other links it may have had.


    # Renaming a link


    You can use the `mv` command to rename a link, too. If Margy decides for the book-status
    file to have the same name in places is less confusing (as it stands now, it''s
    `chapterlog` to John and `booklog` to Margy), she can type this:


    ```

    mv booklog chapterlog

    ```


    You can use the `mv` command to move the file to another directory.


    # Linking a bunch of files


    You can also use `ln` to link a bunch of files at the same time. In this case,
    you tell `ln` two things:


    +   - The bunch of files you want to link, probably using a wildcard character
    such as `*`. You can also type a series of filenames or a combination of names
    and patterns. (UNIX may be obscure, but it''s flexible).

    - The name of the directory in which you want to put all the new links.


    The `ln` command uses the same names the files currently have when it makes the
    new links. It just puts them in a different directory.


    The `chapterlog` business in the preceding example, for example, works well that
    Margy decides to link to all the files in `/usr/john/book`. To make links in `/usr/margy/book`,
    she types this line:


    ```

    ln /usr/john/book/* /usr/margy/book

    ```'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# 130 Part II: Some Basic Stuff


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_153_0.png)


    # Linking once and linking twice


    Here''s one caveat. The ln command in the example in this section links all the
    files that exist at the time the command is given. If you add new files to /usr/magry/book
    or /usr/johnl/book, the new files are automatically linked to the other directory.
    To fix this situation, you can type the same command every few days (or whatever
    frequency makes sense). The command tells you lots of files are already identical
    to the two directories and makes links for the new files.


    If you linked to someone''s files, you may have permission to read those files
    but not to change or write to them. When you use ln to make the new links, if
    it tries to replace a file you can''t write to, it says something like this:


    ```

    ln: error3: 644 mode?

    ```


    See Chapter 25 for the exact meaning of uniquely obscure message. Press the y
    key if you want to replace the file, which you probably in this case. Press the
    n key if you don''t want to replace the file.


    This command tells UNIX to create links for all the files in /usr/johnl/book and
    to put the new links in /usr/magry/book. Now every file that exists in /usr/johnl/book
    also exists in /usr/magry/book. Magry uses the ln command to look at a file listing
    for her new book directory. It contains all the book files. This arrangement makes
    working on the files much more convenient.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_153_1.png)


    # Linking across the great computer divide


    All this talk assumes the files you''re linking to are on the same system (that''s
    UNIX-speak for disk or disk partition). If your computer has several hard drives
    or if you''re on a network and use files on other computers (through NFS or some
    other system, as explained in Chapter 16), some of the files you work with may
    be on different file systems.


    Here''s the bad news: The original ln couldn''t create links to other file systems.
    But all modern UNIX systems have things called soft links, symbolic links (symlinks,
    for short) that are almost as good.


    Soft links enable you to use two or more different names for the same file. Unlike
    regular links (or hard links), however, soft links are just imitation links. UNIX
    doesn''t consider them to be the file''s real name.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Making soft links


    To make a soft link, add the -s option to the ln command.


    Suppose that you want a link in your home directory to the recipe.list file in
    /usr/gita. In your home directory, you type this line:


    ```

    ln /usr/gita/recipe.list gitas.recipes

    ```


    Rather than respond with serene silence, UNIX responds with this line:


    ```

    ln: different file system

    ```


    Drat! Gita''s home directory is on a different file system from yours, perhaps
    even on a different computer. So you make a soft link by sticking an -s into the
    command:


    ```

    ln -s /usr/gita/recipe.list gitas.recipes

    ```


    As usual, no news is good news; ln says nothing if it works. Now a file gitas.recipes
    seems to be in your home directory — all through the magic of soft links. You
    still have only one file, but you have an extra link to it.


    # Using soft links


    You can look at, copy, print, and rename a soft-linked file as usual. With the
    proper permissions, you can edit it. If Gita deletes her file, the file vanishes.
    Your soft link now links to an empty hole rather than to a file, and your soft
    link isn''t the file''s real name. When you see a soft link in a long ls listing,
    UNIX gives the name of the soft link and the name of the file it refers to.


    > If you try to use a file and UNIX says that isn''t there, check to see whether
    it''s a dangling link (a link to a non own file). Type ls -1 to see whether the
    file is a soft link. If it is, use another ls -1 on the real filename to make
    sure that the file really exists.


    To get rid of a dangling soft link, use the rm command to delete it.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_154_0.png)


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_154_1.png)'
