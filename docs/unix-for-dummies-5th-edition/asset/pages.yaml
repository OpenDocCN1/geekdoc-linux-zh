  md: '# 206 Part III: Getting Things Done


    # # Starting Background Processes


    Starting a background command is simplicity itself. You can run any program you
    want in the background: When you type the command, stick a space and an ampersand
    (&) at the end of the line just before you press Enter.


    Suppose that you want to use coff to print a file (even though you warned not
    to use it). Because this process is bound to take a long time, for example, typing
    the ampersand to run it in the background is wise:


    ```

    troff a_really_large_file &

    ```


    The shell starts the command and immediately comes back to ask you for another
    command. It prints a number, which is the process ID (or PID) assigned to the
    command you just started (Some shells print a small number, which they call the
    job number, and a larger number, which is the PID.) If you know the PID, you can
    check up on your background program with the ps command. If you get tired of waiting
    for the background process, you can get rid of it with the kill command and PID,
    as you see in Chapter 24.


    You can start many programs simultaneously as you want in this way. In practice,
    you want more than three or four. Because only one computer is switching back
    and forth among the various programs, the more simultaneous you do, the slower
    each one runs.


    When your background program finishes, the C, BASH, and SVR4 Bourne shells tell
    you that the program is finished; older versions of the Bourne shell say nothing.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_229_0.png)


    If you know that a program will take a long time (a program that runs for a long
    time to produce a report, for), you can use the nice command with that program.
    The nice command tells the program to run in a nice way so that it gets a smaller
    share of the computer than it would otherwise. Although the nice process takes
    longer to run, other programs run faster, which is usually a good trade-off if
    the nice process was going to take a long time away. If so, just use nice followed
    by the command to run:


    ```

    nice genreport Tuesday.raw &

    ```


    You always use nice to run programs in the background because only an inexplicably
    saintly user wants to slow down a program he was going to sit and wait for it.


    If you want to wait for background processes to finish, the wait waits until they
    are all finished. If you become impatient, you can interrupt by pressing Ctrl+C
    (or Del, depending on your system). These keystrokes interrupt only the wait and
    leave the background processes unmolested.'
  merge: -1
