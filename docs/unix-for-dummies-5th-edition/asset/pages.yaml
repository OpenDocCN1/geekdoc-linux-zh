  md: '# About the Authors


    John R was a member of a computer club in high school — before high school students,
    or even high schools, had computers — where met Theodor H. Nelson, the author
    of Computer Lib/Dream Machines and the inventor of hypertext, who reminded us
    that computers should not be taken seriously and that everyone can and should
    use computers.


    John wrote his first program in 1967 on an IBM 1130 (a computer somewhat less
    powerful than your typical modern digital wristwatch, only more difficult to use).
    He became an official system administrator of a networked computer running UNIX
    at Yale in 1975. He began working part-time (for a computer company, of course)
    in 1977 and was in and out of the computer and network biz ever since. He got
    his company on Usenet (the Internet''s world-wide bulletin-system) early enough
    that it appears in a 1982 Byte magazine on a map of Usenet, which then was so
    small that the map fit on all a page.


    Although John spent most of his time writing software, he mostly writes books
    (including UNIX For Dummies and Privacy For Dummies, both published by Wiley Publishing,
    Inc.) it''s more than fun and he can do at home in the tiny village of Trburg,
    New York, where he is the see commissioner (Guided tours! Free samples!) and with
    his small daughter when he supposed to be writing. John also does a fair amount
    of public speaking. (Go to www.johnlevine.com to see where he''s.) He holds a
    BA and a PHD in computer science from Yale University, please do not hold against
    him.


    In high school, Margaret Levine Young was in the same computer club as her big
    brother, John. She stayed in the field throughout college her better judgment
    and despite John''s presence as a graduate student in the computer science department.
    Mary graduated from Yale and went on to become one of the first PC managers in
    the early 1980s at Columbia Pictures, where she rode the elevator with big stars
    whose names she wouldn''t dream of dropping here.


    Since then, Margy has co-authored more than 25 computer books about the topics
    of the Internet, UNIX, WordPerfect, Microsoft Access, and (from the past) PC-Clife
    and Javelin, including Dummies 101: The Internet For Windows 98, UNIX For Dummies,
    and WordPerfect For Linux For Dummies (all published by Wiley Publishing, Inc.),
    and Windows XP: The Complete Reference and The Complete Reference (published by
    Osborne/McGraw-Hill). She met her future husband, Jordan, in the R.E.S.I.S.T.O.R.S.
    (that computer we mentioned). Her children, with music, Unitarian Universalism
    (www.ua.org), reading, and anything to do with eating. She lives in Vermont (see
    www.gurus.com/margy for some scenery).'
