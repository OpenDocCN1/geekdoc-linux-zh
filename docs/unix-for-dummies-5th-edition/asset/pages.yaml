  md: '# Wrecked X


    If you use Motif or another X Window variant, now and then you may find your screen
    in a most peculiar state, one in which you can move the mouse pointer around,
    but none of the windows changes, and you can''t type anything in any windows.
    Often you can fix this problem by restarting the window manager, which is the
    program that controls what gets.


    Move the mouse pointer outside any window and click and hold the right mouse button
    (which depends on which window manager you''re using) to display the window manager
    menu. That should have a Restart mwr or Restart fwwm item. Choose that option.
    The borders around all your windows disappear (the window manager handles the
    borders), and after a few seconds, they reappear. With luck, everything is fixed.
    If there''s no way to restart the window manager, see if you can log out from
    the window system and log back in.


    # It''s Not Listening!


    The computer is on, you are working away, and suddenly it doesn''t respond to
    anything you type. It is the Abominable Frozen Computer.


    The computer is probably fine — it''s a program that has frozen up. Try these
    things to get the program''s attention:


    +   * Press Esc a bunch of times.

    * Press Ctrl+C a bunch of times.

    * Press Ctrl+D a bunch of times.

    * Press Ctrl+S and then Ctrl+Q a bunch of times. (You know what works.)

    * If you are running KDE, GNOME, or another Windows-based system, see whether
    you can use the mouse to select another window or whether you can type a command
    or two in a shell window. If you can, you probably to murder the frozen program
    and start it up again (see the following section).

    * If your window system is completely stuck, you can usually murder the window
    system and start it over again without having to restart your computer (refer
    to Chapter 4).'
  merge: -1
