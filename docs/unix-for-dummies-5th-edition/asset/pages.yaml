- img_proc: true
  md: '# 190 Part III: Getting Things Done


    You''re not quite finished, though. Observe what happens when you go to another
    directory. Type the following two commands to go to your home directory and give
    the findbud command here:


    ```

    cd

    findbud

    ```


    UNIX may respond with this message:


    ```

    findbud: Command not found.

    ```


    If so, type one of these commands to get UNIX to do what you want:


    ```

    hash findbud

    ```


    or


    ```

    rehash

    ```


    (Try the first; if it doesn''t work, try the second.) Now when you type findbud,
    it works.


    What''s going on? Well, it''s Mr. too-smart-for-his-own Shell. Programs don''t
    appear and disappear often, when the shell starts up, it makes a list of all the
    commands it can access and where they are. Because five or six commands directories
    frequently exist, this process saves considerable time (the alternative is to
    check every directory for every command you type one). The hash and rehash commands
    tell UNIX to rebuild its list (known as a hash table) because you have added a
    new command (the findbud file is really, remember?). If the command doesn''t work,
    you have to fiddle with your search path — not a pretty job. See the nearby sidebar.
    "Your search path."


    Type hash or rehash to tell the shell that you have added a new command and that
    you want to rebuild its list of available commands to include this one. If you
    don''t give the hash or rehash command and you change directly, you can''t use
    the newly shell script during this login session.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_213_0.png)


    One could write an entire book about shell scripts (others have done so, in fact).
    The finer points naturally vary depending on which shell you use, although this
    explanation gives you the general idea. Shell scripts aren''t limited to one line:
