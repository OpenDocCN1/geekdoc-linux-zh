    200 PORT command successful.

    150 BINARY mode data connection for 02-12.gz (106290

    bytes)

    226 Transfer complete.

    local: 02-12.gz remote: 02-12.gz 106290 bytes received in 2.2

    seconds (47 Kbytes/s)

    ```


    # Here''s a file in your you


    Now you know how to retrieve files from other computers. How about copying the
    other way? It''s just about the same procedure, except that you use put rather
    than get. The following example shows how to copy a local file to a remote file
    called rnr.new:


    ```

    ftp> put rnr rnr.new

    200 PORT command successful.

    150 ASCII mode data connection for rnr.new.

    226 Transfer complete.

    local: remote: rnr.new

    168 bytes sent in 0.014 seconds (12 Kbytes/s)

    ```


    (As with get, if you want to use the same name when you make the copy, leave out
    the command.)


    The mput command works just like the mget command does, only in the other direction.
    If you have a bunch of files names begin with uu and you want to copy most of
    them, issue the mput command, as shown in this example (boldface indicates the
    user''s input):'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Chapter 19: Grabbing Files from the Net


    ```

    ftp > mput uu*

    mput upick? y

    200 PORT command successful.

    150 Opening ASCII mode data connection for upick.

    226 Transfer complete.

    local: upick remote: upick

    156 bytes sent in 0.023 seconds (6.6 Kbytes/s)

    mput upoll? y

    200 PORT command successful.

    150 Opening ASCII mode data connection for upoll.

    226 Transfer complete.

    local: upoll remote: upoll

    200 bytes sent in 0.013 seconds (15 Kbytes/s)

    mput wrn n

    ```


    (As mget, you can use the prompt command to tell it to go ahead and not to ask
    any questions.)


    Most systems have protections on their files and directories that limit where
    you can copy files. Generally, you can use FTP to put a file anywhere you could
    create a file if you were logged in. If you''re using anonymous FTP (see the section
    "No Names, Please," later in this chapter), you can''t put any files to the other
    host.


    A bunch of other file-manipulation commands are sometimes useful, as in this example
    of the delete command:


    ```

    deletefile

    ```


    (Replace deletefile with the name of the file you want to delete.) This command
    deletes the file on the remote computer, assuming that the permissions enable
    you to do so. The mdelete command deletes multiple files and works like mget and
    mput. The mkdir command makes a new directory on the remote system (again assuming
    that you have permissions to do):


    ```

    mkdir newdir

    ```


    (Replace newdir with the name of the directory you want to make.) After you create
    a directory, you still have to use cd to change to that directory before you use
    put or mput to store files in it.


    If you plan to do file deleting, directory creation, and the like, logging in
    to the other system using ssh or telnet is usually much quicker (discussed in
    gory detail in Chapter 16) to do your work and using the usual local commands.'
