- img_proc: true
  md: '# 232 Part IV: UNIX and the Net


    Sometimes the other computer is recalcitrant and doesn''t want to let you go.
    Remember that you''re in control. To force your way out, you must first get the
    attention of the telnet program by pressing Ctrl-] (that''s a right square bracket).
    A few versions of telnet use different escape character to telnet''s attention.
    (It tells you which character when first connect to the other system.) After you
    get telnet''s attention, type quit to tell telnet to wrap things up and return
    to the shell:


    ```

    Ctrl-]

    telnet> quit

    ```


    # 3270: The Attack of the IBM Terminals


    The terminals discussed earlier in this chapter that are handled by telnet are
    basically souped-up Teletypes, with data passed character by character between
    the terminal and the host. This kind of terminal interaction can be Teletype-ish.


    IBM developed an entirely different model for its 3270-series display terminals.
    The principle is that the computer works more like filling in forms. The computer
    draws what it wants on-screen, marks which parts of the screen you can type on,
    and unlocks the keyboard so that you can fill in whichever they want. Whenever
    you press Enter, the terminal locks the keyboard, transmits the changed parts
    of the screen to the computer, and awaits additional instructions from headquarters.


    To be fair, this is a perfectly reasonable way to build terminals intended for
    data-entry and data-retrieval applications. The terminals at your bank or the
    electric company are probably 3270s—or more like these, cheap PCs emulating 3270s.
    Because the 3270 terminal protocol squeezes a great deal more on a phone line
    than a Teletype-ish, having all the 3270s in an office sharing the same phone
    line, with reasonable performance is common.


    The Internet is a big place, and plenty of IBM mainframes run applications on
    the Internet. Some of them are useful. Large library catalogs haven''t moved to
    the Web yet speak 3270-ish. Usually, if you telnet to a system that wants a 3270,
    it converts from the Teletype that telnet speaks to 3270-ish so that you can use
    anyway. Some 3270 systems speak only 3270-ish, however, and if you telnet to them,
    they connect and disconnect without saying anything in between.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Chapter 16: Across a Crowded Network 233


    A variant of telnet that speaks 3270-ish is called tn3270. If a system keeps disconnecting,
    try typing the command tn3270 instead. (Large amounts of UPPERCASE LETTERS and
    references to the IBM operating systems VM or OS/390 or z/OS are also tip-offs
    that you''re talking to a 3270.) Even if a 3270 system allows regular telnet,
    you get a snappier response if you use tn3270 instead.


    # ssh: The Lazy Man''s Remote Login


    The telnet command has been around since the 1970s, but is now considered largely
    obsolete and dreadfully insecure. (If you use a computer in the kind of place
    people can plug into your network and watch the bits go, they can read your entire
    telnet session, passwords and all.) These days the ssh, short for secure shell,
    command is both more secure and more convenient it automates more of the process.
    You can use ssh in much way you use telnet:


    ```

    ssh pumpkin

    ```


    UNIX responds:


    ```

    Last login: Thu Oct 3 0:03:58 from squash

    FreeBSD 4.8-RELEASE (PUMPKIN)# Thu Jul 24 14:49:39 EDT

    2003

    ```


    Hey! It didn''t ask for the username or password. What happened? Often you have
    accounts on a bunch of machines in a group, and if you can log into one of them,
    you use the same username to log to others. When setting up ssh, the system manager
    can configure each machine with the secret ssh keys (a string of digits) of the
    other machines in its group so when someone sshes in, it can say "oh, that machine,
    it''s OK." If you have accounts on a variety of UNIX or Linux machines, setting
    up your authorized keys files you can log in from one to another without passwords
    is possible.


    The ssh command also passes along the type of terminal you''re using so that even
    if the other system asks you to enter your type, it always guesses correctly if
    you don''t it explicitly.


    If the remote system doesn''t recognize your username, it asks you to type a username
    and password, just like telnet does. If it recognizes your username but not your
    secret ssh key, it just asks for a password.'
