  md: '# Part IV: UNIX and the Net


    In our snail-mail analogy, this machine is like a street corner mailbox; you go
    to it and drop the mail off.


    # Netiquette


    E-mail has been around long enough for an etiquette style to spring up around
    it, just as with real mail. Here are some tips:


    **Be polite.** The written word tends to sound stronger and more dogmatic than
    speech. Sarcasm and little jokes don''t always work.


    **Don''t write when you are annoyed.** If you get a message that you find totally
    obnoxious, *don''t answer right away!* You will be sorry if you do, you will overreact
    and look as obnoxiously. How do you know this? We used to do it. Everyone does
    at first, until they learn not to e-mail seriously. The exchange of needlessly
    obnoxious messages is so common that it has a name: flaming. Don''t do it in this
    list.


    **Be brief.**


    **Be sure to sign your messages.** The header shows where a message comes from,
    but your recipient might not remember who you are from your cryptic e-mail address.


    **Use normal and capitalization.** That is, DON''T CAPITALIZE EVERYTHING. It looks
    like you are shouting, and that''s not polite (see the first tip in this list).


    **Wait for on.** E-mail is full of us, and you had better know what the common
    ones are. A list of acronyms is at the end of this sidebar.


    **Don''t assume e-mail is private.** Any recipient of your mail can easily forward
    it to other people. Some mail addresses are really mailing lists that redistribute
    to many other people. Also, glitches in the mail system may send your messages
    to various electronic deletter offices. In one famous case, a mistaken


    mail address sent a message to thousands of readers. It started "Dar, at last
    we have a way to send messages that is completely private...


    **If you need to indicate emotion, most people use emoticon**, little pictures
    of characters to look like faces. If you see :), for example, just look it sideways:
    You usually means that we little face, when that was just a joke. (If you said
    face you use the other parenthesis (for the mouth.) Some people — particularly
    those who use CompuServer type `<group>` or `<html>` (An opposing viewpoint says
    that if you need one of these emotions, rewriting your message to make clearer
    what you mean is a better idea.


    Here''s a list of the most common e-mail acronyms:


    +   - BTW By The Way

    - IANMTU I Am Not Making This Up

    - IMHO In My Humble Opinion

    - IOW In Other Words

    - PITA Pain In The Armpit

    - PMFJI Pardon Me For Jumping In

    - ROFL Rolling On Floor, Laughing

    - RSN Real Soon Now (ha!)

    - RTM Read the Manual (that is, you could have looked it yourself)

    - TIA Thanks In Advance

    - YMMV Your Mileage May Var (you may not have the same experiences)


