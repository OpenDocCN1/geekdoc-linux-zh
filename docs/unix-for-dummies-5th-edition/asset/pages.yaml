  md: '# 34 Part I: Before the Beginning


    +   - Lots of enthusiastic people are working on Linux, with wonderful new features
    and additions available every day. Many of them even work.


    +   - It''s free!


    The many developers of Linux proudly describe it as a “hacker’s system,” one written
    by and for enthusiastic programmers. This classic meaning of hacker should not
    be confused with the other, media-debased “computer vandel”. These programmers
    keep up the development of Linux at a brisk pace, and a new “development” version
    is available on the Internet every few days. Once in with it, developers decide
    that they have enough guts out of their recent developments, and release a “stable”
    version, which stays around for months rather than days. Most normal use the stable
    version rather than a development version. Using a development version of Linux
    is like living in a house inhabited by a large family of carpenters and architects:
    Every morning you wake up, the house is a little different. Maybe you have a new
    turret, or some walls have moved. Or perhaps someone has temporarily removed the
    floor under your bed. — oops.


    Linux started life as the operating system for students and other cheapskates.
    ... er users who wanted a UNIX system of their own but couldn’t afford a traditional
    UNIX workstation. Linux has matured into a stable, reliable UNIX system, this
    base has expanded to include companies and institutions that could afford traditional
    UNIX workstations, but found that Linux enabled them to add PC-based workstations
    at a fraction of the cost. In fact, Linux is now conservatively estimated to have
    more than 18 million users, making it the second or third most operating system
    in the world, behind Windows and out even with the Macintosh operating system.


    # What’s Old, What’s New


    The original guts of Linux were written from scratch by Linus Torvalds and have
    been since greatly changed and extended by other people. He based Linux more or
    less on System V (on descriptions of System V; there’s no code from System V).
    Most programs that people actually use (the shells and other commands) come from
    4-BSD or from the GNU project, which most of them from the Berkeley UNIX versions,
    most of the commands are BSD-ish. The networking programs are adapted from the
    Berkeley ones, they are all BSD-ish.


    Technically speaking, Linux refers only to the operating system “kernel”. When
    most people refer to a Linux system, they usually mean the whole package: operating
    system plus the GNU programs that come with it. Unlike UNIX systems, Linux can
    run various shells, editors, and other software. Most versions of Linux use BASH
    as the default shell because-it’s also new and snappy.'
