  md: '# 322 Part V: Help!


    ls sec*

    UNIX responds with an appropriate list:


    | second.version section04 section08 section12 section16 |

    | section01 section05 section09 section13 section17 |

    | section02 section06 section10 section14 section18 |

    | section03 section07 section11 section15 section19 |


    Hey, look! There''s that file second.version. You don''t want to delete it, so
    it looks like you have type **section** to get the correct files in this case.


    # ## Idiot-proofing save files


    The best way to make temporary backup copies of files is to make a directory named
    save and put all saved copies of files there, as shown in this example:


    ```

    mkdir save

    cp important.file save

    ```


    These commands tell UNIX to make a directory named save and then to make a copy
    of important.file to save/important.file. If you reverse the order of the names,
    nothing happens. Suppose that you type this line instead:


    ```

    cp save important.file

    ```


    UNIX makes this observation:


    ```

    cp : <save> directory

    ```


    UNIX is saying that you can copy a file to a directory but you can''t copy a directory
    to a file. As a result, UNIX doesn''t copy anything. To copy back from the save
    directory, you have to use its full name: save/important.file.


    A variation of this process is a two-step delete. Suppose that you have a bunch
    of files you want to get rid of some good files are mixed in the same directory.
    Make a directory named trash, and then use mv to move the files you plan to delete
    to the trash directory.


    ```

    mkdir trash

    mv thisfile thatfile these* trash

    mv otherfile somefile trash

    ```'
