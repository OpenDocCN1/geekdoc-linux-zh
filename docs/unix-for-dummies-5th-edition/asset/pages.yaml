    UNIX is asking whether you want to complete the command anyway. On most UNIX systems,
    someone took pity on the poor users and changed the message to the slightly more
    comprehensible "override version.) Press the y if you want to go ahead and do
    the command. Press anything else if you want to cancel it (for this file, anyway).


    If you own the file, you can change its permissions by typing this line:


    ```

    chmod 644 filename

    ```


    Rather than type filename, the real filename. This command has the result of allowing
