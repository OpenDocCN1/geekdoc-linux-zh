  md: '# Introduction


    Because UNIX is not designed to be particularly easy to use, don''t feel bad if
    you have to look up a number of topics before you feel comfortable using the computer.
    Most computer users, after all, never have to face anything as daunting as UNIX
    (point this out to your Windows and Macintosh user friends)!


    If you have comments about this book and your computer can send electronic mail
    via the Internet, you can send them to our friendly mail robot, which will write
    back, at `unix5@urus.com`. (We also read your messages and write back if time
    permits.) Also visit our Web site, with book info and updates, at `http://net.urus.com`.
    For information about the [For Dummies](https://www.dummies.com) books in general,
    write to `info@wiley.com` or surf on by `www.dummies.com`.


    # **Authors'' Note**


    Because we practice what we preach, the manuscript for this book was updated and
    edited using the free OpenOffice.org word processor on FreeBSD UNIX. We also used
    NetBSD and SuSE Linux for KDE and GNOME examples, and a Web application on the
    Apache Web server on BSD/OS to pass around edited chapters among the authors and
    our editors. The `net.urus.com` and `www.dummies.com` Web sites both run on Apache
    servers on UNIX; our UNIX mail server handles the mail at `urus.com`; and our
    publisher''s three UNIX mail servers handle the mail at `wiley.com`. None of that
    expensive Pacific Northwest software for us, thanks.'
