- img_proc: true
  md: 'On the other hand, making extra copies of files can be a good idea. If you
    have been working on a report for three weeks, making an extra copy every day
    or so isn''t a bad idea. If you make some revisions that, in hindsight, are quite
    stupid, you can always go back to a previous revision.


    # # What''s in a Name (Reprise)


    Having given a file name, you may want to change it later. Maybe you spelt it
    wrong in the first place. In any case, you can rename a file by using the mv (lazy
    typist-of move) command.


    Suppose that you made a file called budget.march. Oops, dratted fingers.... Use
    the following line to correct the error in the filename:


    ```

    mv budget.march budget.march

    ```


    After mv, you use the current name of the file and then the name you want to change
    it. Note that it can be harder to retry the same type than to type name correctly!


    Because you can''t have two files with the same name in the same directory, if
    a file already has the name you want to use, mv thoughtfully blows away the existing
    file (probably not what you want to do). You can use mv -i (like cp -i) to prevent
    inadvertent file clobbering.


    Want to hide a file so that it doesn''t appear in your directory listing? Use
    a period as the first letter of the filename. To see all your files, including
    hidden files, type


    ```

    ls -a1

    ```


    # # Looking at the Guts of a File


    Although we have been slicing and dicing files for a while now, you still haven''t
    seen what''s inside one. Two basic types of files exist:


    +   - Files that contain text that UNIX can display on-screen

    - Files that contain special codes that look like monkeys have been at the keyboard
    when you display the file on-screen


    The first type of files are called text files. The second type is composed of
    spreadsheet files, database files, program files, and just about everything else.
    Text editors make text files, as do a few other programs.'
