  md: '# 110 Part II: Some Basic Stuff


    # Pick a letter, any letter


    You can use one or more ? wildcards in a filename. Each ? stands for exactly one
    character — no more, no less. To list all your files that have two-letter names,
    for example, you can type this:


    ```

    ls ??

    ```


    The command ls budget?? lists all filenames that start with budget and have two
    — and only two — characters after budget, like budget98 and budget99; the combination
    does not match budget1 or budget.draft or Budget98 (because of the uppercase B).


    # Stars (***) in your eyes


    +   * wildcard stands for any number of characters. To list all your files that
    have names starting with a c, for example, type


    ```

    ls c*

    ```


    This specification matches files named customer.letter,c3, and just plain c. The
    specification budget.* matches budget.2004 and budget.draft, but not draft.budget.
    The name *.draft matches budget.draft and window.draft, but not draft.horse or
    plain draft. By itself, the filename matches everything (watch out when you let
    the asterisk solo).


    # Are kings or deuces wild?


    Unlike some other kind of operating systems (we don''t name any, although one
    system''s initials are DOS), UNIX handles the ? and * wildcards in the same way
    for every command. You don''t have to memorize which commands can handle wildcards
    and ones cannot. In UNIX, they all handle wildcards.


    Wildcards are commonly used with the ls, cp, rm, and mv commands. For example,
    to copy all the files from the current directory to the temp directory,


    ```

    cp * temp

    ```'
