  md: '# What if ed commands end up in my text?


    If you are in input mode and type an ed command, ed doesn''t perform the command.
    Instead, it thinks you are typing text and stores the letter or letters of the
    command just some more text in your file.


    If this happens, delete the lines you don''t want (we explain how to delete lines
    later in this chapter). The next time you want to enter a command, first be sure
    to type a period on a line by itself.


    # Show me the file, please


    Now that you have text in the file, how can you see it or change it? By using
    the p (print) command. This command doesn''t print anything on the printer; another
    example of superb software engineering. Well, it printed those on old Teletypes.
    If you use the p command by itself, peas file, ed displays the current line. In
    the case of the file which the current line is the last line in the file. You
    can also tell ed which lines to display by typing their line numbers. Display
    lines 1 through 4, for example, type this line:


    ```

    1.4p

    ```


    You can use the symbol $ to stand for the line number of the last line in the
    file (in case you don''t know how many lines are in the file). The following command
    always displays the entire file:


    ```

    1$p

    ```


    # A miserable way to edit


    You can change the contents of a line of text with ed, but it involves giving
    commands that look like this:


    ```

    12,13s/wrong/right/

    ```


    This command stands for right in lines 12 through 13, inclusive. Totally primitive
    and painful, isn''t it? For the amount of editing you probably do in ed, it''s
    almost easier to delete the line with the typo and insert a new line. We recommend
    that you immediately ask your administrator for a better text editor.'
