  md: '# In this part...


    Yikes! You have to learn how to use UNIX! Does this mean that you''re about to
    get inducted, kicking and screaming, into a fraternity of hard-bitten, humorless
    nerds with a religious dedication to a 30-year-old operating system from the phone
    company? Well, yes and no. We hope that we''re not humorless.


    If you''re like most UNIX users, a zealot stopped at your desk, connected your
    terminal or workstation, gave you five minutes of incomprehensible advice, demonstrated
    a few bizarre games (like roaches that hide behind the work on your screen), and
    disappeared. Now you''re on your own.


    Don''t worry. This part of the book explains the absolute minimum you need to
    know to get your UNIX system''s attention, persuade it that you are allowed to
    use it, and maybe even accomplish something useful.'
  merge: -1
