    # Djà vu déjà vu


    Readers familiar with Microsoft Windows 95 or NT may find the Motif window manager
    to be strangely familiar. Its windows don''t look all that much like Windows,
    without the mouse and keyboard techniques extremely similar. That turns out to
    be no surprise. Because Hewlett-Packard has a super-duper application environment
    it sells for both Windows and X, it deliberately made its X package (from which
    much of Motif is derived) similar to Windows as possible.


    For users who switch back and forth between Windows and Motif (we others, for
    example), this capability is a blessing because the mouse moves and keystrokes
    our fingers have remembered for one system work by large and in the same way in
    the other. This practically unprecedented level of compatibility exists between
    UNIX and something else, so we figure that, deep down, it must have been an oversight.


    The X window system divides the work of controlling its on-screen among three
    separate kinds of programs:


    +   **X server**: Draws on-screen and reads user input from the keyboard and mouse

    **Window manager**: Controls which windows appear on-screen, draws around them,
    and handles basic window operations, such as moving windows, shrinking windows
    to an icon (a box representing that window), and expanding icons to windows

    **Clients**: Programs that do some real work


    For any particular case, there is one server, usually (but not always) one window
    manager, and bunch of clients. Every client communicates with the server to tell
    it what to draw and to find out what you did; the server communicates with the
    window manager when the user asks for a window-management operation, such as changing
    the size of a window. Although the server manager, and clients usually run on
    the same computer, X enables them to exist on separate machines connected by a
    network, it is not unusual to have a setup in which the server runs on an X terminal,
    the window manager runs on a really workstation, and the clients are on various
    machines scattered across the network.


    The window manager is usually a regular UNIX. You can stop one and start another
    if you decide that you don''t like your windows look. Client programs can ask
    the X server to ask the window manager to do specialized operations. A terminal
