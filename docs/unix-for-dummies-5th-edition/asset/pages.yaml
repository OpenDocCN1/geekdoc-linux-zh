    # Who Goes There?


    Unlike operating systems we could name (such as... oh, Microsoft Windows, in instance),
    UNIX was designed from the beginning to be more than one person. Like all multi-user
    systems, UNIX keeps track of who owns what file and what they can do with each
    file. Permissions attached to each file and directory determine who can use them.


    Permissions in three types:


    +   **Read permission:** Enables you to look at a file or directory. You can use
    cat or a text editor to see what''s in a file that has read permission. You can
    also copy this type of a file. Permission for a directory enables you to list
    the directory''s contents.


    +   **Write permission:** Enables you to make changes to a file. Even if you can
    write (change) a file, you can''t necessarily delete it or rename it; for those
    actions, you must be able to write in the directory where the file resides. If
    you have write permission in a directory, you can create new files in the directory
    and delete files from it.


    +   **Execute permission:** Enables you to run the program contained in the file.
    The program can be a real program or a shell script. If the file doesn''t contain
    a program, execute permission doesn''t do you good and can provoke the shell to
    complain bitterly as it tries (from its rather dim point of view) to make sense
    of your file. For a directory, execute permission enables you to open files in
    the directory and use cd to get to the directory to make it your working directory.


