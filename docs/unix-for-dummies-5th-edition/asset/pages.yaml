    # How do I start Motif, anyway?


    You may think this question is a simple one to answer, because UNIX is involved,
    it is not. The short answer is "run mwm" (the Motif window manager), although
    technique is not useful because you have run mwm at the right time and place.


    Failing that, you have to start X and Motif yourself after you log in UNIX. The
    two most common start-up commands are startx xinit. If you''re not sure which
    one to use, try and see what happens. When your screen goes kerfloie for a few
    seconds it switches from old, dumb terminal to new, graphical X mode; a few windows
    appear, xterm runs under X; and Motif starts and draws borders around all the
    windows.


    If you''re lucky, your window manager sets everything for you automatically. If
    you''re on an X terminal or a workstation running xdm (the display manager), X
    is already running when you sit down and waiting for you to enter your username
    and password, and Motif starts as soon as you log.


    If none of those things work, you''ve run out of ideas, and you have to ask your
    local expert how to start X and Motif on your computer or X terminal.


    The next best thing is that you''re at a workstation is set up to run X after
    you log in so that X and Motif start automatically when you log in.


    What this means is that any particular client uses one of the widgets to control
    what that client''s window looks like. A program that uses the Motif toolkit,
    for example, is a Motif program. Because clients are separate from window managers,
    however, the Motif manager (mwm — the lazy typists strike again) can run and draw
    a Motif border around the windows of clients using other tools.


    Because of the constant danger GUI systems could begin to make sense to users,
    UNIX people have learned to obfuscate these by using "Motif" to refer to both
    the window manager and the Motif toolkit, which are, of course, completely separate
    entities. When people refer to "Motif," they may be referring to the window manager
    or maybe to the toolkit or both. It''s difficult to tell. This confusion is all
    part of the proud legacy of UNIX revolution.


    One school of thought says that we would be better off if X Windows picked a window
    style and stick with it so that we would have a single window manager and a single
    set of widgets — as every other window system does — although it is much too late
    for that.'
