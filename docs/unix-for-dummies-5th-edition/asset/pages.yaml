    # Why you should fight rather than switch


    The question, "Which is better: UNIX or Windows 2000 or XP?" has sparked religious
    war between UNIX crusaders and the high priests of marketing at Microsoft Corporation.
    Microsoft would have you believe that Windows 2000 and XP, its industrial-strength
    versions of Windows, are a snappy new alternative to UNIX, a old system that owes
    its welcome in the last days of disco. UNIX is expensive to use without a degree
    in computer science. Windows 2000 and XP are cheaper and easier to use, and, because
    it''s a Microsoft product, it''s just plain better. So you should join your UNIX
    computers and replace them with Windows servers and workstations right now, (if
    we were critical, we would point out that Microsoft has no version of it to sell.
    But we are not).


    get your system to reboot, or recover from one of its episodes.


    According to independent reports, Windows chronically has many security bugs (problems
    with how the system handles) UNIX. Windows simply doesn''t have the built-in security
    and permissions features that UNIX has always.


    As far as processing power goes, Windows now can''t hold a candle to UNIX. Windows
    servers now have a four-processor limit, although UNIX machines can handle many,
    larger files, and its architecture provides as much as 4 billion more data than
    Windows does (yap). In practice, this statement means that you have to replace
    each of UNIX machines with multiple Windows servers to maintain the same power.


    In spite of extravagant Microsoft claims of Windows superiority, the evidence
    is decidedly mixed. Although businesses seem to have made the switch from UNIX
    to Windows successfully, they are usually on the small-to medium size of the spectrum.
    If you have to support a large company that depends on an extensive network to
    handle high volumes of traffic and to serve critical applications and information,
    you might better off sticking with UNIX.


    Which brings us to the cost of question. Although individual Windows servers may
    be cheaper than individual UNIX servers (although that''s less true now that the
    hardware they run on is the same), the apparent price advantage quickly evaporates
    when you consider the number of servers you need and the cost of administering
    and maintaining them, not to mention costs from server downtime and data loss.


    We could go on (if you want to mention a couple of bears, we certainly will).
    Suffice to say that the Microsoft rumors about the imminent death of UNIX have
    been greatly exaggerated.


