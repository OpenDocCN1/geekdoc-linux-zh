    | Table 6-1 | Popular UNIX Directories and What They Contain |

    | --- | --- |

    | Directory Name | What It Contains |

    | /bin | Standard system commands. /usr/bin | More standard system commands. /usr/contrib/bin
    | Even more standard system commands (the ones distributed by third parties).
    |

    /usr/local/bin | Nonstandard, locally installed system. |

    /dev | Connections to devices, such as tape drives, rather than real files. UNIX
    uses a terribly clever trick for referring to hardware devices as though they
    were files. |

    /etc | Miscellaneous system files. Not really interesting to nonwebies. |

    /home | Contains a home directory for each user. (If you don''t see /home,try
    /usr/home.) |

    /lib | Program libraries and the like. (See our comment about /etc.) |

    /usr/lib | More program libraries and the like. (See our comment about /etc again.)
    |

    /tmp | Small temporary files. |

    /usr/tmp | Larger temporary files. |

    /usr/src | On systems that come with source code, the source code to the system.
    (Fascinating to programmers, not so fascinating otherwise.) |

    /var/src | Another place where source code can be found. |

    /usr/man and /usr/catman | Text of online manual pages.'
