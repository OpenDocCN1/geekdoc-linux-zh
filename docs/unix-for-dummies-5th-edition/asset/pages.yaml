    # About your mouse


    Your mouse (mouse-like thing) has some-buttons on. Take a moment to count the
    buttons. Finished counting? (How long could it have taken?) We hope you have three
    buttons. If you found only two buttons, you have a problem because most X programs
    are written with three-button mice in mind and do not work


    with two-button mice. Some X servers be configured to enable you to get all the
    X features using only two buttons, although getting a three-button mouse is much
    easier. We''ve found some perfectly usable ones at our local computer store for
    $10 or less.


    +   1. Drag the mouse up and down the menu that pops up until you find the program
    you.

    2. Let go of the button.


    Sometimes you have nested menus: When you pick an item from the first menu, a
    second menu pops up, and you must pick an item there, too.


    The easy way to start a program is with one step:


    +   1. Go to a terminal window and type the name of the program you want to run.


    This approach is the same one you use to run any other program or give a command.
    To display another terminal window, type xterm or the name of the terminal program
    you use.


    Then you have the issue of where on-screen the new window appears. Some programs
    and window managers have strong opinions of their own, and the new window appears
    the program or window manager thinks it should. With other, less opinionated programs,
    you may call it: A ghostly window that floats near the middle of the screen. You
    move the ghost with the mouse and click when the window is where you want it.
    At that point, the ghost materializes into the regular window. This latter scheme
    is usually more convenient because it places places where you want them. Beware
    of one thing, though, while the ghost is on-screen: If you leave the ghost on-screen
    for a long time (while you''re at lunch or overnight), all the others can become
    rather cautious waiting for the screen to unfreeze so that they can update their
    windows. If you''re using Motif, your local guru can switch your system between
    opinionated mode and floating-ghost mode.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_75_1.png)'
