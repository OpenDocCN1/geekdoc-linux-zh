    ```

    Last log Sep 27 07:31 (EDT) on typty0 from bebel.lecc.com

    Project: Working on "UNIX for Dummies, 5th Ed.\nPlan:

    Write many books, become famous.

    ```


    The Project and Plan lines are the contents of files called .project and .plan
    in the login directory. (Yes, the filenames start with periods.) It has become
