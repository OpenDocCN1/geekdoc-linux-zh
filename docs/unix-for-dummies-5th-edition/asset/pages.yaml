  md: '# Chapter 4: Opening Windows on UNIX


    # We’ve got something in common


    A few companies doing UNIX apparently decided they had gone too far in the customizability,
    so they got together with the Open Software Foundation to create the Common Open
    Software Environment, which describes how to build UNIX programs so they all act
    and look like other (or at least they come from the same planet). In 1995, they
    group out with the Common Desktop Environment, which is a UNIX windowing system
    that bears more than a passing resemblance to the Macintosh and (Microsoft)


    Windows desktops. Surprisingly, CDE began to catch on, especially among Microsoft
    Windows and Macintosh users who were new to UNIX or needed to use both Windows
    or Mac OS workstations. CDE does much more than manage your UNIX windows. We talk
    about CDE in the section "CDE: Desktop for All Seasons," later in chapter.


    The KDE environment, which we also discuss in this chapter, looks lot like KDE.
    Because CDE costs money and KDE is free, you’re more likely to run into KDE these
    days.


    # Just my look


    Most windowing systems on most kinds of computers make programs a consistent style.
    All Macintosh programs, for example, look pretty much like theirs: they use the
    same menu, the same little window when you want to select a file, and similar
    windows to turn options on and off. One Windows programs look much like the others:
    They use similar sets of windows.


    Do all Windows programs have a consistent look? Of course not — that would be
    too easy. This situation is that X means by independence: X is utterly generic
    about what windows look like onscreen, how keystrokes and mouse clicks should
    be interpreted, and pretty much else that affects a user. This lack of policy
    was part of the initial appeal of X because no matter what window system you are
    used to, you can make X look just like that system. The good news is that X offers
    great flexibility. The bad news is that word inconsistent barely scratches the
    surface of what you run into.


    # Makeup artists for your windows


    One of the ways in which X avoids any policy built in is that it foists much of
    the general window-management jobs onto a program called a window manager (Catchy
    name, huh?) The window manager handles jobs such creating borders around each
    application’s main windows; controlling how you move, resize, switch among; and
    most of the other tasks that aren’t part of any particular application. It’s possible
    to run X without any window manager, although it’s rather unpleasant because,
    without one, you have no way to do some things, like move a window.'
