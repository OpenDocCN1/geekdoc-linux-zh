    # NFS and system crashes


    What happens if you''re working with NFS, your files are on a server, and the
    server crashes? The answer is yes, eventually. When the server comes back, you
    continue from where you left off. If the server crashes, you might wait a long
    time. In one extreme case (so we have heard), a program on an NFS client waited
    for more than six months while the server crashed, was dismantled and shipped
    back to the manufacturer, and then reloaded from tape, and rebooted — at which
    point the client program continued. You probably won''t be so patient.'
