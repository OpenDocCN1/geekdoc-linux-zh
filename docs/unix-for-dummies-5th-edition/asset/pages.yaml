  md: '# Part II: Some Basic Stuff


    # Talkin’ trash


    The Trash tool is a great boon to UNIX users susceptible to blowing away important
    files when unforgiving UNIX commands such as rm. When you issue the rm command
    or one of brethren, the files you delete are gone, plain and simple. When you’re
    using the File Manager on the desktop, on the other hand, files you delete put
    in a virtual trash barrel, where they hang around you tell UNIX to get rid of
    them. If you delete a file by mistake, you can bring the file back by following
    these steps:


    +   * Double-click the Trash tool icon.


    +   * Root around in the trash until you find the file.


    +   * Drag the file from the trash and drop it into an appropriate location in
    the File Manager.


    Remember to empty the trash every day and again, or else you eventually run out
    of space.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_89_0.png)


    # Desktop, there we go!


    The easiest way to get yourself out of the desktop is to click the Exit thing
    near the FrontPanel, which drops you unceriously into good old traditional UNIX
    character mode. You can also lock the desktop (so that only someone who knows
    your username and password can get to it) by clicking the padlock icon in the
    center of the FrontPanel.


    # What’s the “K” Stand For?


    You could ask about the interface. You could ask about the history of the project.
    But the chances are, the first thing you want to know about the K Desktop Environment
    is what the K stands for. We can’t tell you. Internet waves claim that, early
    in 1996, the project was going to be called the Kool Desktop Environment, but
    being sure is impossible. Now, it doesn’t stand for anything; it’s just the letter
    K.


    KDE is a full desktop environment, like C — the similarity in names is probably
    not a coincidence — and provides a bewildering of choices and options. You can
    move the widgets around. You can change what they look like. In the UNIX world,
    finding that your computer looks like — and can be used like — someone else’s
    is very embarrassing. It’s like showing up to a party in the same dress as someone
    else. KDE provides a good layer of insulation; even if you and your friend both
    use KDE, your computers won’t look a bit alike.'
