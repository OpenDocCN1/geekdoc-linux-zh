  md: '# 210 Part III: Getting Things Done


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_233_0.png)


    # Taming background terminal output


    Any program, foreground or background, usually can scribble on-screen anything
    it wants at any time it wants. More often than not, that''s okay because most
    programs are well behaved about not blattering when they''re in the background.


    In some cases, however, particularly when you use a full-screen, the interspersed
    output gets on your nerves. Frankly, job control lets you solve this problem.
    You can put your terminal into output stop mode: When a background program wants
    to send something to the terminal, it stops, just as it does when it wants to


    read something. You then have the same alternatives to continue that program in
    the foreground if you want to see what it has to say or kill if you don''t. To
    turn on output stop mode, type this command:


    ```

    tty -tstop

    ```


    To turn off output stop mode, type this line:


    ```

    tty -tstop

    ```


    The tty command is used to make all sorts of changes to the setup of your terminal.


    # Full-screen programs and job control


    Programs that take over the entire screen (or the entire terminal window), notably
    the vi and emacs editors and mail programs such as elm, treat Ctrl-Z interrupt
    in a slightly different way. Stopping the program and starting it later isn''t
    adequate; the screen shows the results of what you did in the meantime. To solve
    this problem, full-screen programs make arrangements with UNIX to be notified
    when you press Ctrl-Z and again when you continue them so that they can do something
    appropriate, such as redraw the screen when you continue. This process generally
    is automatic and obvious, although people occasionally are confused when the screen
    is magically returned after they give the fg command.'
  merge: -1
