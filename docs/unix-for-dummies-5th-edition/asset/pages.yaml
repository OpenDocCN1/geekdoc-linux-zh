  md: '# # Chapter 24

    # My Computer Hates Me


    +   In This Chapter

    * Lots of error messages

    * What they mean

    * What to do about them


    Question: You type a command. UNIX says something incomprehensible. What does
    it mean? What should you do?


    Answer: Look in this chapter for the error message. We tell you the message means
    and what you can do to fix the problem.


    Most error messages start with the name of the command you tried to use. If you
    want to use the cp command to copy a file, for example, you would spell the name
    of the file incorrectly, cp can''t find a file with the name you typed, so it
    says something like this:


    ```

    cp: No such file or directory

    ```


    At the beginning of the line is the name of the command that failed to work. After
    the colon comes the UNIX error message — UNIX''s attempt to explain the problem.


    This chapter contains the most common error messages, in alphabetical order. In
    some of our explanations, we refer to these called arguments, not because we are
    feeling argumentative but because that''s the technical name for the information
    you type on the command line after the command. Suppose that you type this line:


    ```

    cp proof.that.elvis.lives save

    ```


    cp is the command, proof.that.elvis.lives is the first argument, and save is the
    second argument. You can have lots of arguments on the line: The number you need
    depends on the command you use (cp requires two). Type a space between arguments.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# 332 Part V: Help!


    UNIX also has things called options, which tell the command how you want to work.
    Options always start with a hyphen (-). Suppose that you type this line:


    ```

    ls -l

    ```


    The -l tells the ls command how you want it to display the files. Options don''t
    count as arguments. If you type this line:


    ```

    ls -l *

    ```


    the -l is an option, and * is the first (not the second) argument.


    This stuff is nit-picky, but, if UNIX complains about a particular argument or
    option, knowing exactly which item it doesn''t like comes in handy.


    And now (drum roll, please), the error messages!


    # Arg list too long


    Meaning: The list of arguments (stuff on the command line after the name of the
    command) is too long.


    Probable cause: When you type a wildcard character as part of a filename or pathname,
    UNIX replaces it with the list of filenames and then calls the command. If you
    go wild with the asterisks, the result is a very long list. The list can be more
    than 5,000 characters long, so it''s unlikely that you typed too long a list of
    filenames, unless you''re an unusually fast typist.


    Example: You are in the root directory (/) and type this line:


    ```

    ls */*

    ```


    If a large number of files is in the root directory and its subdirectories, /*/*
    turns into a really long list.


    Solution: Check the wildcards you used in the command, and use fewer of them.


    Newer versions of UNIX allow much longer argument lists than older ones did. If
    you''re using a modern system, such as Linux or FreeBSD, and get this message,
    something strange is probably going on.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# Chapter 24: "My Computer Hates Me" 333


    # Broken pipe


    **Meaning:** You are running two programs connected by a pipe, and the program
    at the receiving end of the pipe exited before it received all its data (refer
    to Chapter 7).


    **Probable cause:** You get this error occasionally when you use a pipe (|) to
    redirect the output of a program into the `more` program and then press the q
    key to cancel the `more` program before you cancel all the output. The program
    has no place to put its output because you canceled the `more` program, so you
    get this error in this case. it''s harmless.


    **Example:** You type this line:


    ```

    man furg | more

    ```


    The man program (which displays frequently incomprehensible UNIX manual pages)
    shows you after screen of boring information. You press the q key to cancel the
    more program, but the man program gives you the error message.


    **Solution:** Nothing to do — it''s not really an error!


    # Cannot access


    See the section “No such file or directory,” later in this chapter.


    # Cross-device link


    See the section “Different file system,” later in this chapter.


    # Device or resource busy


    **Meaning:** A device, such as a terminal or printer, is in use by another program.


    **Probable cause:** Sometimes you see this message when you try to use cu or tip
    to access a terminal that''s already in use by another program or user.


    **Example:** You type this line:


    ```

    cu somesystem

    ```


    **Solution:** Wait until the other user finishes.'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# 334 Part V: Help!


    # Different file system


    Meaning: You are using the ln command to create a link to a file in a different
    file system (a different hard drive or a different computer).


    Probable cause: You can''t create a hard link from one file system to another.
    The file you want to link is probably in a different file system from the directory
    in which you want to make the link (usually the working directory).


    Solution: Use the df command to find which disks your computer has and which directories
    are on which. If the two directories are indeed different disks, use ln to make
    a soft link.


    # File exists


    Meaning: A file by name already exists.


    Probable cause: When UNIX expected the name of the file you want to create, you
    typed the name of a file that already exists.


    Solution: You rarely see this message, because UNIX commands blow away an existing
    file when they want to create a new one by the same name (which is not always
    what you want).


    # File table overflow


    Meaning: The system is too busy and can''t juggle as many files simultaneously
    as all users have asked it to.


    Probable cause: The system isn''t configured correctly, or someone is doing too
    much work.


    Solution: Complain to the system administrator.


    # File too large


    Meaning: You are trying to make a file that is too big.


    Probable cause: The maximum file size is set by your system administrator. A maximum
    file size prevents a messed-up program from making a file that uses the entire
    disk by mistake. You''re not likely to want to make a file this big. it happens
    when you use >> to add a copy of a file to itself, so you end up copying the file
    over and over until it passes the preset limit.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Chapter 24: "My Computer Hates Me" 335


    Example: You type the line shown here:


    ```

    pr myfile >> myfile

    ```


    Solution: Check the command and make sure that you''re saying what you mean. If
    you''re sure that you want to make a really big file, talk your system administrator
    into upping your file-size limit.


    # Illegal option


    Meaning: You typed an option that doesn''t work with this command. (Options tell
    the command how you want it to work. They begin with a hyphen.)


    Probable cause: You typed a hyphen in front of a filename, or you typed the wrong
    option.


    Example: You type this line:


    ```

    ls -j

    ```


    Because the ls command has no -j option, you get an error message. Frequently,
    after the illegal option message, UNIX also prints a line about usage, which is
    its cryptic way of reminding you which options do work with the command. (See
    the "Usage" section, later in this chapter.)


    Solution: Check your typing. Look up the command in this book to make sure you
    know which option you want. Alternatively, use the man command to display an exhaustive
    and exhausting list of every option the command may possibly understand.


    # Insufficient arguments


    Meaning: You left out some information.


    Probable cause: The command you are using more arguments than the ones you typed.
    UNIX may also print a usage message in its attempt to tell you which arguments
    you should have typed. (See the "Usage" section, later in this chapter.)


    Example: The cp command needs two arguments: The first one tells it what to copy
    from, and the second one tells it what to copy to. You can''t leave either one.


    Solution: Check your typing. If the command is one you don''t use often, check
    to make sure that you used the correct arguments and options.'
