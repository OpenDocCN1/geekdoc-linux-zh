    ```


    If your disk is large and full of files, a search from the root directory down
    can take a long time — as long as an hour on a very large and busy system.


    You can even search several directories. To search both Margy''s and John''s home
    directories for files named white.chocolate.mousse, for example, you can type
    this line:


