  md: '# Chapter 22


    # The Case of the Missing Files


    # In This Chapter


    +   - Four easy ways to lose files

    - Some ways to get files back

    - Three almost-as-easy ways to lose files


    > Sooner or later, you will delete a file by mistake. Scratch that “later”: Sooner
    than you think, you will delete a file by mistake. In far too many cases, you
    are out of luck, although you can do a few things to avoid disaster.


    # How You Clobber Files


    Contrary to the usual image of UNIX users being radically technical and without
    a creative brain in their bodies, we submit that typical UNIX users are immensely
    creative: they can come up with a billion inventive ways to avoid the computer
    altogether and, when forced to sit down to stare the computer in the face, they
    can come up with a dozen more inventive reasons for why things went wrong: UNIX
    programmers have written thousands of useful freeware and sharewares, when they
    have been getting some work done. You can make files disappear in lots of ways
    (either intentionally or accidentally). This section lists the four main ways
    you can trash files — although you can probably come up with a dozen new and creative
    ways to do the vanishing act with your files.


    # Clobbing files with rm


    Because hard drives are not infinitely large, sooner or later you have to get
    rid of some files. (Some wag once commented that the only thing that''s standard
    among UNIX systems is the message-of-the-day reminding users to delete unneeded
    files.)'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# 312 Part V: Help!


    The normal way to get rid of files is the rm (remove) command. Until (notice that
    we didn''t say unless) you screw up, rm removes only what you want to. Recall
    that you tell rm the names of the files you want to remove:


    ```

    rm thisfile thatfile somdir/anotherfile

    ```


    You can remove more than one file at a time, and you can specify files in other
    directories (rm removes just the file and not the directory).


    This method is usually pretty safe. The tricky part comes when you use wildcards.
    If you use a processor that leaves backup files with names ending in .bak, for
    example, you can get rid of all of them with this command:


    ```

    rm *.bak

    ```


    That''s no problem — unless you put in an extra space (Do not type this line!).


    ```

    rm *.bak non-existent

    ```


    Note the little, tiny space between the asterisk and the dot. In response to this
    command, UNIX says


    Uh-oh. Unix decided that you wanted to delete two things: * and .bak. Because
    the asterisk wildcard matches every single filename in the working directory,
    every single filename in the working directory is deleted. Then Unix tries to
    delete a file named .bak, which isn''t there. Bad move.


    At this point, we recommend that you panic, gnash your teeth, and throw Ner balls
    at the computer. After you calm down a little, read the rest of this chapter for
    some possible ways to get your files back.


    ```

    rm sec*

    ```


    Now suppose you forgot that you also have a file named second.version, which you
    want to keep. Oops. Bye-bye, second.version.


    The obvious solution is to delete things one at a time. Unless you are an extremely
    fast and steady typist, however, that''s not practical. In the following sections,
    we make some suggestions about that, too.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Clobbering files with cp, mv, and ln


    Are you feeling paranoid yet, as though every time you press the R and M keys
    you''re going to blow away a year''s worth of work? Wait — it gets worse.


    The cp, mv, and ln commands can also clobber files by mistake: If you use one
    of these programs to copy, rename, or link a file (respectively) and a file already
    has the new name, the existing files get clobbered. Suppose that you type this
    command:


    ```

    mv elbow armpit

    ```


    If you already have a file named armpit — bam! It''s gone! The same thing happens
    if you copy or link. (Copying is a little different: If you care, see the nearby
    sidebar, "Links, copies, moves, truncations, and other details about file destruction.”)
    Here''s an example of the most annoying case of blasting good files with trash
    when you use the command:


    ```

    cp important.file.save important.file

    ```


    As a responsible and paranoid computer user, you want to save a copy of an important
    file before you make some changes. But your fingers work a little faster than
    your brain and you get the names switched (left-handed users are particularly
    prone to getting names sddrawcab — and bam! (again) you just copied an obsolete
    saved version over the current version. Fortunately, you can arrange your file-saving
    habits to make this kind of mistake harmless, or at least mostly harmless.


    # Creaming files by using redirection


    A third way to blow away valuable files is by using redirection. If you redirect
    the output of a command to a file that already exists, whammo! UNIX blows away
    the existing file and replaces it with your redirected output.


    For example, if you type this command:


    ```

    ls -al > dirlist

    ```


    and you already have a file named dirlist, it''s gone now, replaced by the new
    listing.'
