  md: '# 154 Part III: Getting Things Done


    Whenever we tell you to type a command, it works only if you are in command mode.
    If you are not sure where you''re in, press Esc first. If you are already in command
    mode, pressing Esc makes vi beep.


    # Help! I need somebody?


    The guy who wrote vi (remember Bill, the grouchy guy who''s 6''4" and in excellent
    physical condition? — same guy) didn''t believe in help, so there wasn''t.


    Fortunately, vi has been used in many introductory computing courses that Bill
    eventually relented and added "novice" mode. Rather than type vi to run the editor,
    type edit to get the same editor with allegedly helpful messages. In particular,
    whenever you''re in input mode rather than command mode, vi displays, at the bottom
    of the screen, a message such as INPUT MODE, APPEND MODE, CHANGE MODE, or OPEN
    MODE. All these messages mean the same thing (except to Bill, evidently): Type
    you when these messages are added to the bill rather than interpreted as commands.


    # Easy-entry techniques


    Make a new file with deathless prose so that you can practice entering in vi.
    Run vi with a new filename:


    ```

    vi madeline

    ```


    To add text after the current position of the cursor, type the letter a (you do
    not press Enter after a command):


    We tell you in a minute how to move the cursor, when you have some text to move
    around. You can type a, for example, to add this to the newly created Xanadu file:


    > In Xanadu did Kubla Khan decree:

    A stately pleasure-dome decree:

    Where Alph, the sacred river,

    Through caverns measureless to man

    Down to a sunless sea.


    To get back to command mode, press Esc. Whenever you finish typing text so that
    you are ready to give the next command.'
