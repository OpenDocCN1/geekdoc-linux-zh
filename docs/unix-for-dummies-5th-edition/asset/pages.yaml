  md: '# 156 Part III: Getting Things Done


    +   - Enter or + moves the cursor to the beginning of the next line.

    - The hyphen (-) moves the cursor to the beginning of the preceding line.

    - G (the uppercase letter) moves the cursor to the end of the file.

    - 1G moves the cursor to the beginning of the file. (That''s the number 1, not
    the letter l. Why ask why?)


    # Giving your text a makeover


    To modify the text you typed, follow these steps:


    +   - Move the cursor to the beginning of the text you want to change.

    - To type over (on top of) the existing text, press the R key.

    - Type the new text. What you type replaces what is already there. Press Esc when
    you finish replacing text.

    - To insert text in front of the current cursor position, press the i key.

    - Type the new text. What you type is inserted without replacing any existing
    text. Press Esc when you finish inserting text.


    # Removing unsightly text


    To delete text, follow these steps:


    +   - Move the cursor to the beginning of the text you want to delete.

    - To delete one character, type x. To get rid of five characters, type xxxxx.
    You get the ideala.

    - To delete text from the current cursor position to the end of the line, type
    an uppercase D.

    - To delete the entire line the cursor is, type dd (the letter d twice).


    # Nobody undoes it better


    Like text editors, vi has a way to undo the most recent change or deletion you
    made. Type the letter u to undo the change. If you type an uppercase U, vi undoes
    all changes to the current line since you moved the cursor to that line.'
