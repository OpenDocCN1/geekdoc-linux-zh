  md: '# Part II: Some Basic Stuff


    | Table 9-1 Macro Packages |

    | Name | Description | Origin |

    | -ms | Manuscript macros | Bell Labs |

    | -mm | Different manuscript macros | Another part of Bell Labs |

    | -me | Eric''s macros | Somebody of Ph.D. thesis at Berkeley (must have been
    a good thesis because he''s now the head of Google) |

    | -man | Manual page macros | Same place as -ms |


    To tell griff to format a document with the -ms macros, for example, you type


    ```

    groff -ms filename

    ```


    Telling a priori what macros are used in what document is difficult, unless the
    author took pity and gave a clue by naming the file mobydick.ms or the like. Frankly,
    the worst that happens if you use the macro package is that the document looks
    ugly.(It''s not totally illegible: The text is still there, you can try different
    macro packages and see which one works least). As a general rule, documents from
    academia usually use the -me package, whereas documents from industry usually
    use mm or -ms. Documents from the UNIX system itself use -ms because -ms was written
    by some of the same guys who did the original UNIX work, and pages from the online
    manual (what the man command shows you use -man).


    # Let''s sneak a peek


    One of the nicest things about groff is that it''s device-independent, which means
    that it can reformat your document for any of several output devices. To format
    your document and display it on a normal, text-only terminal, use the nroff command:


    ```

    nroff -ms filename | more

    ```


    (This command actually calls groff, but it tells it to format for plain-text output.
    Change the -ms to one of the other macro packages if necessary.) The more command
    displays the result a screen at a time. Press the spacebar to move from screen
    to screen, or press Q when you see enough.'
  merge: -1
