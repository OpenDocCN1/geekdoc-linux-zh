  md: '# Chapter 26: Ten Times More Information Than You Want about UNIX 355


    # It''s a bird, it''s a plane, it''s xman!


    If you use KDE, GNOME, or other Window-based software, you can use the xman command
    to look at manual pages. The nice thing about xman is that it displays a list
    of the available manual pages. When you run xman, it pops up a little box with
    three buttons, one of which is labeled Manual Page. If you click that button,
    a larger window then displays a manual page describing xman. Choose Directory
    from the Options menu on that, or press Ctrl+D as a shortcut, to see a screen
    of all the manual pages it has—probably more than 100 of them. Click the one you
    want to see, and xman switches to that page. Press Ctrl-D again to return to the
    directory of manual pages. Read the initial description of xman for other tricks
    you can get xman to do, such as show you two or three different pages at a time
    or search for keywords in manual-page titles.


    # Scanning the Networks


    If your system is connected to the Internet or if you have dial-up access to an
    Internet provider, you can connect to Usenet, a gigantic distributed online bulletin
    board system described at http://net.gurus.com/usenet, and also available on the
    Web at http://groups.google.com/.Because many systems on Usenet are running on
    UNIX systems, Usenet has a great deal of discussion of UNIX issues and questions.


