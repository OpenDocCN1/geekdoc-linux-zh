  md: '# Chapter 23


    # Some Programs Just Won''t Die


    In This Chapter


    +   - Killing a process with a keystroke or two

    - Killing a process by using the ps command

    - Bringing dead terminals to life


    You can always get rid of recalcitrant programs without rebooting. In this chapter,
    we talk about how to figure out which processes you have and how to make unwanted
    ones go away. Before reading this chapter, be sure that you''ve read Chapter 13,
    where we talk about how you can juggle processes and do neat tricks, as stop one
    program, run another one, go back to the first one, and pick up exactly where
    you left off.


    # Why Killing Is Sometimes Justified


    Will kill a process? Don''t even the smallest processes deserve to live?


    In a word, no. Sometimes a process hangs, and your computer just sits there, inert.
    Sometimes a process gets stuck in some kind of loop and never ends. Sometimes
    you give the wrong command and realize that you don''t want to run that program
    after all. To stop the process in which the program is running, you kill the process.


    Suppose that you''re running along, minding your own business, and you find that
    you have a program that just won''t stop. Well, we have ways to make it stop.
    First, we discuss the normal ways to kill a process, and then we get into some
    serious artillery.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# 326 Part V: Help!


    # What Process? (Reprise)


    In Chapter 13 we tell you how to use the ps command to see which processes you
    have running. In case you''re too weak from struggling with UNIX to turn back
    to Chapter 13, just type the ps command to see a list of your processes. Note
    the PID (process ID) of the process you want to kill. You can identify which process
    is the one that needs to be offed, because ps shows you the command line that
    started each process.


    # Fifty Ways to Kill Your Process


    The usual way to get rid of a process you started from the shell is to press the
    interrupt character, which is usually Ctrl-C, although sometimes it''s Delete.
    In some cases, the rogue program gives up peacefully, and you end up back in the
    shell. Sometimes, the program handles Ctrl-C itself. If you use the ed editor
    (if you''re a masochist) and you press Ctrl-C for example, ed enters command mode
    rather than give and throw away any work you have done. To exit, you have use
    the q command.


    If the interrupt character doesn''t work, you can up the ant and use the quit
    character (a reverse slash orslash— not the forward slash). The quit character
    not kills the program but also saves the dead body of the process (this description
    is awfully morbid, but we didn''t invent these terms) in a file named, for arcane
    reasons, core (or perhaps program.core). The shell gives you this requires:


    ```

    Quit (core dumped)

    ```


    This tells you that the process is dead and that its body has put on it in the
    filename core.


    Most programs that catch Ctrl-C give up under the greater onslaught of Ctrl-\
    If the program you were running is one written locally, your system administrator
    may appreciate your saving the core file, because it includes clues about what
    was going wrong. Otherwise, delete any core files with rm they''re a waste of
    space.


    Because a program can immunize itself to Ctrl+ (ed, for example, ignores it),
    the next is the stop character (always Ctrl-Z). The stop character doesn''t kill
    the program; it puts it to sleep and returns you to the shell. (See Chapter 13
    for more information about what Ctrl-Z really does and how it can be useful even
    with programs you like.) After you''re back in the shell, you can apply the stronger
    medicine described in the following section.'
  merge: -1
