  md: '# Chapter 5: Files for Fun and Profit


    If all goes well and cp works correctly, it doesn''t show you any message. Blessed
    silence on the part of UNIX usually means that all is well. You should use the
    ls command to check that the new file really exists, just in case.


    # What’s in a name?


    When you create a file, you give it a name. UNIX has rules about what makes a
    good filename:


    +   Filenames can be pretty long: they’re not limited to eight characters and
    a three-character extension. In older versions of UNIX, the limit is 14 characters
    for a filename; newer versions have a huge limit — hundreds of characters — so
    you can call a file Some_notes_I_plan_to_get_around_to_typing_eventually_if_live_that_long.


    +   Don’t use characters that mean something special to UNIX or some you may encounter.
    Stay away from these characters when you name files:

    ```

    <  ^  *

    [  ]  #  &

    |  |  $

    (  )  ~

    ```


    Stick manly to letters and numbers.


    +   Don’t put spaces in a filename. Although most programs let you put in them,
    spaces cause nothing trouble because other programs simply believe that a filename
    may contain a space, and in shell commands, spaces separate filenames. Don''t
    bother. Most UNIX people use periods to string together words to make filenames,
    such as budget.98 or pumpkin.soup. Underscores work, too.


    +   UNIX considers uppercase and lowercase letters to be completely different.
    Budget, budget, BUDGET, and BuDget are all different filenames.


    # Nuking Files Back to the Stone Age


    You can also get rid of files by using the command the lazy typists call rm. To
    erase (delete, remove — — it’s all the same thing) a file, type


    ```

    rm budget.feb

    ```'
