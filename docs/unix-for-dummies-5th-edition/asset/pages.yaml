  md: '# # Chapter 9


    # # Printing (The Gutenberg Thing)


    **In This Chapter**


    +   - Sending stuff to the printer

    - Finding the printer

    - Stupid printing tricks


    Unless you happen to work in the paperless office of the future (reputed to be
    down the hall) to print stuff. The good news is that doing so is usually easy.
    The bad news is that nothing is as easy as it should be.


    The major extra complication is that the way to print things is different on UNIX
    BSD and System V systems.(Remember which one you have?) Refer to Chapter 2 if
    you don''t. You may have written it on the Cheat Sheet in the front of this book.)
    We start explaining how you print something already in a file; then we go to the
    fancy stuff.


    # ## Printing Stuff: Daemons at Work


    From a human''s point of view, printing in UNIX is is simplicity itself: You use
    either the `lp` command or the `pr` command, depending on your flavor of UNIX.
    Many office suite packages have built-in printing commands, but they''re all `lp`
    or `pr` underneath.


    From your computer''s point of view, this arrangement is, of course, too simple.
    To make things suitably complex, the print command doesn''t print the file. What
    it does is leave a note for another program buried deep inside UNIX, and this
    program is called a daemon (pronounced ''daemon''). The theory behind this arrangement
    is that a bunch of people may want to use the printer, and waiting for the printer
    to be free is a pain. The print command puts your file on a list, and the daemon
    runs down the list and does the printing. The request ID is the name the print
    command gives to the note it leaves for the daemon. You can ignore the request
    ID unless you change your mind and decide that you dont want to print that file
    after all.'
