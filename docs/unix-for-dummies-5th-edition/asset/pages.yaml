    # ## Exchanging Gossip by Using Pine


    Pine was originally a cut-down version of elm for novice users, which makes it
    even easier to use elm. Now it''s much more powerful than elm ever was. It has
    lots of menus to remind you of what to do next, and it even uses pico, a simple
    editor, for composing mail.


    To run Pine, use just pine. You see a display like the one shown in Figure 17-1.


    | PINE 3.89 MAIN MENU | Folder: INBOX 0 Messages |

    |---|---|---|n| P | HELP | Get help using Pine |

    | C | COMPOSE MESSAGE | Compose and send a message |

    | I | FOLDER INDEX | View messages in current folder |

    | L | FOLDER INDEX | Select a folder to view |

    | A | ADDRESS BOOK | Update address book |

    | S | SETUP | Configure or update Pine |

    | Q | QUIT | Exit the Pine program |


    Figure 17-1:

    Pine''s, listing the most popular commands.


