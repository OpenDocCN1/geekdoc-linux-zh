  md: '# 140 Part II: Some Basic Stuff


    # Some final words about stopping the printer


    Most printers have something called an internal buffer, which is where data to
    be resides before the printer prints it. An internal buffer is good and bad: it''s
    good because it keeps the printer from stopping and starting if the computer is
    a little slow passing your file to it. It''s bad, after data is in the buffer,
    the computer cannot get it back. So, even after you cancel something you want
    to print, some of it may still be in the buffer: as much as 2 pages of normal
    text or about 20 pages of the junk that results from printing a non-text file.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_163_0.png)


    You have no way to keep from printing in the printer buffer. One real idea is
    to turn the printer off in the middle of a page: This method tends to get the
    paper stuck and, on laser printers, lets a loose bunch of black, smelly stuff
    that gets all over your hands and on next 1,000 pages the printer prints. If you,
    press the printer''s Stop or Off-line button and wait for the printer to stop
    moving. Then you can turn the printer off safely. Or, with luck, a button on the
    printer provides a Cancel option to discard what''s waiting in the printer.


    After you cancel your print request, the printer probably still has half page
    of your failed file waiting to print. You can eject that page by pressing a button
    on the printer labeled something like Form Feed or Print/Check or even Reset.


    # Prettying Up Printouts


    If you select a file of plain text to a printer, the result can look ugly: no
    margins, titles, or anything else. You can use the pr command to make your file
    look nicer. You can use only with plain text files, however, not with files of
    PostScript code, document files from your favorite word processor, or a desktop-top
    publishing program.


    # Titles and page numbers look so official


    The simplest thing you can do with the pr command is to add titles and page numbers
    to your printout. By default, the title is the name of the file and the date and
    time it was changed. You can use a pipe (defined in Chapter 7 as the vertical
    bar, |) to format with pr and print on a single line:


    ```

    pr myfile | lpr

    ```'
