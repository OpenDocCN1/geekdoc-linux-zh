  md: '# Chapter 13: Juggling a Bunch of Programs


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_224_0.png)


    # Why processes are not programs and vice versa


    Although programs and processes are similar, they''re not the same. A processis,
    more or less, a running program. Suppose that you''re using Windows, with two
    windows on-screen, and are running v1 in both of them. Although the same program
    is running in both windows, they''re doing different things (in this case, editing
    files).


    computer and the other to copy stuff from the remote computer back to your screen.
    Sometimes, hidden processes take place: Many programs have a way you can execute
    UNIX inside the program. (In vi and ed, for example, type i and the command you
    want to run.) In addition to the command, shell usually interprets the command.


    To add to this, some programs use more than one process apiece. The terminal program
    cu, for example, uses two processes: one to copy what you type to the remote


    In most cases, identifying in a list of processes which one is easy because each
    one is identified by the command that started it.


    # Any Processes in the House?


    The basic program you use to find out which processes are around is ps (for process
    status). Although the details of ps (wait — how did you know?) vary somewhat from
    one version of UNIX to another, two main kinds of ps exist: the System V kind
    and the BSD kind. (SVR4 uses the System V kind of ps, even though SVR4 has a great
    deal of BSD mixed in. Linux uses a ps that looks more or less like BSD.)


    # Mind your ps (and qs)


    If you run plain ps, no matter which version of UNIX you have, you get a list
    of the processes running from your terminal (or window, if you''re using X Windows).
    The list looks something like this:


    | PID TTY COMMAND |

    | 24812 tty0 0:01 -csh |

    | 25973 tty0 0:00 ps |


    The PID gives the process identification, or process ID. To help keep processes
    straight, UNIX assigns every new process an identifier. The numbers start at 1
    and go up. When the PIDs become inconveniently large (about 30,000 or so), UNIX
    starts again at 1 and skips numbers that are still in use. To get rid of a stuck
    process, you have to know its PID to tell the system which process to destroy.'
