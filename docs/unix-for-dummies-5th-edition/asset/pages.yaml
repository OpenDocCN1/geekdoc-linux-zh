  md: '# Chapter 20: Now Serving the Internet 295


    # Domainia


    If your Web Site supports a business or other official organization, you may want
    to consider applying and paying for your own domain name. A domain name is a unique
    name that identifies a computer or group of computers on the Internet. For example,
    we registered the domain name gurus.com, so our Web site is named www.guru.com.
    Registering a domain name ftp.guru.com costs $15 per year, and on top of that
    you will need at least separate servers — a main and a backup server — permanent
    Internet connections to qualify for a domain name. Your server must have DNS (domain
    name system) software running on it so that it can respond to requests for a name
    in your domain. You don''t want to deal with the gory


    technical details, you can pay an Internet service provider to act as your domain
    server. (Most ISPs are all too happy to find a reason to take your money, and
    in this case it''s probably well spent.)


    The part of a domain name to the right of the last is called the zone. A number
    of so-called generic names exist for profit-making enterprises, org for nonprofits,
    gov for the U.S. government, and edu for educational institutions are examples.
    Two-letter countries — fr for France, mx for Mexico, and us for United States,
    for example.


    Dozens of companies register generic domains, but whoever hosts your Web site
    can probably do it for you.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_318_0.png)


    A complete discussion of setting up your own Web site is well beyond the scope
    of this book. It''s a book in its own right, in fact. Nonetheless, in the following
    sections, we try to give you some pointers to get you started on the right foot.


    For a discussion of Webmastering that doesn''t shy away from the gory details,
    see Building a Web Site For Dummies, by David and Crowder Rhonda Crowder (Wiley
    Publishing, Inc.).


    # Serving Yourself


    If you''re hosting your own Web site, you have to have a computer with a permanent,
    dedicated connection to the Internet. The speed, bandwidth, of your connection
    depends on such factors as how much traffic you expect your Web site to get and
    how much money you have to spend. For example, a full-time business DSL connection
    offering standard speeds of 400 kilobits per second (a kilobit is a thousand bits
    of data) costs somewhere in the neighborhood of $100 a month. A T1 line, at 1.5
    Mbps per second, is four times'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# 296 Part IV: UNIX and the Net


    fast and four times as expensive. If you''re serving a modest little Web site,
    DSL works just fine, thank you. If you''re running your business online, you have
    to bite the bullet and get a T1 if you expect more than a few customers at any
    one time. (A T3 line gives a speed of 45 Mbps per second. These babies cost at
    least $10,000 a month, so we figure you''re not planning to run one to your computer
    some soon.)


    After you have your connection squared away, you have to install the software
    that turns your computer into a Web server. A Web server is simply a computer
    that hosts Web pages. The Web server computer runs a program that fulfills requests
    from other computers for Web pages on the server''s hard drive. A Unix machine
    makes a great Web server because the Web was designed using UNIX programs.


    For example, John has named net.guru.com on the Internet. It runs Apache (an excellent
    choice on John''s part because Apache is fast, reliable, and most important—free).
    When you view the team''s Web site, at http://net.guru.com, your computer sends
    a request for a Web page to the Apache program on net.guru.com, and Apache sends
    the page back to your computer so that you can see it on your screen. We talk
    about UNIX servers later in this chapter.


    After you install a Web server on your UNIX system, you will tell the Web server
    the directory where Web pages will be stored (the Web directory). You can store
    Web pages in that directory and its subdirectories. To make a Web page accessible
    to the world, you create the page with a Web-authoring program (or with any text
    editor), test it on your own system to avoid embarrassing types, and move or copy
    the page to your Web directory. After the page is in the Web directory, anyone
    can see the page if they know its URL (Web address).


    If you''re learning about UNIX to be a Webmaster, you need to know how to


    +   - Install, configure and maintain your Web server program

    - Create and modify Web pages


    If other people are working on the Web site, too, you have to know how to give
    them permissions to create and modify the files in the Web directory and its subdirectories.
    If you want active Web pages with forms and other interactions, you''ll also dabble
    in the mysteries of server-side code and CGI scripts. Finally, if you want to
    add more resources to your Web site, such as e-mail and FTP, you have to learn
    how to configure your Web server program to provide them. If your Web server program
    doesn''t offer what you need, you have to cast about for the right software, install
    it, and configure it.'
  merge: -1
