    # Marginally yours


    You may frequently printouts in three-ring binders. Normally, because printing
    starts very close to the left side of the page, the hole punch may holes in your
    text and make the page difficult to read — not to mention it look stupid. The
    -o option (that''s a lowercase o, not a zero, or offset) pushes the stuff you
    print to the right, leaving a left margin. To leave five spaces for a left margin,
    for example, type this command:


    ```

    pr -o5 myfile | 1pr

    ```


    Sometimes leaving a wider margin at the bottom of the page is nice. You can by
    combining the -1 option (to set the page length, as described in the preceding
    section) with the -f option that tells pr to use a special form-feed character
    to make the printer start a new page. (Normally, the -1 option uses blank lines
    to space to the next page, like a typewriter) Use the follow-ing if you are in
    this situation:


    ```

    pr -o5 -1 50 -f myfile | 1pr

    ```


    This command UNIX to print just 50 lines per page, indented spaces. That amount
    of space in the margin should be enough for anyone.'
