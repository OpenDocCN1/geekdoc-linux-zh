    # Talk to Mr. ed


    The *ed* editor might seem like a quaint throwback to software, in the early days
    of UNIX it didn''t even exist. In the pre-CRT era of Teletype terminals, line
    editors were the standard among line editors was (and still is) *ed*. A line editor,
    as *ed*, is one that assigns line numbers to the lines in a file. Every time you
    do something, you must tell *ed* which line or lines to do it to. If you use the
    EDLIN in DOS, ed should look familiar. The program was part of UNIX since the
    beginning of time. When you use it, you begin to appreciate how far software design
    has progressed since 1969.


    If you can get another text editor to use in any way —@repeat — any way, if you
    don''t know that *ed* can really be bad, just peruse the rest of this section,
    and you will run screaming to your system administrator for *vi*, pico, or emacs
    (preferably pico or emacs).


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_191_0.png)


    Some systems have a program called *ex* that is similar to but not quite as horrible
    as *ed*. Trying *ex* to see what happens.


    To run ed, type this line:


    ```

    important.letter

    ```


    (Type the name of your file than *important.letter*) If file has no file name
    you specify, *ed* makes one. UNIX responds to this command with a number, which
    is the number of characters (letters, numbers, punctuation, and spaces) in the
    file, just in you are being paid to write by the letter.


    If you receive an error message when you try to run *ed*, talk to your system
    administrator. Congratulate her on getting rid of Neanderthal text editor and
    find out which text editor you can use.'
