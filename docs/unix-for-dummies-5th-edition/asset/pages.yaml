  md: '# Chapter 18: Web Surfing for UNIX


    # 271


    # ## Get me outta here



    \Sooner or later, even the most dedicated Web surfer has to stop to eat or

    attend to other bodily needs. You leave your browser in the same way that

    you leave any other program: by choosing File::Quit in Mozilla, Location::

    Quit in Konqueror. You can also click the Close (X) button in the upper-right

    corner of the window. Or, just leave the program running and walk away from

    your computer.


    Sooner or later, even the most dedicated Web surfer has to stop to eat or

    attend to other bodily needs. You leave your browser in the same way that

    you leave any other program: by choosing File::Quit in Mozilla, Location::

    Quit in Konqueror. You can also click the Close (X) button in the upper-right

    corner of the window. Or, just leave the program running and walk away from

    your computer.


    # Windows on the World


    When you know how to find your way around the Web, you are ready for some

    comparatively advanced features so that you can start to feel like a Web pro

    in no time.


    Konqueror and Mozilla are known in the trade as multithreaded programs --

    that is, they can display several pages at once. When we''re pointing and clicking-

    from one place to another, we like to open a bunch of windows so that we

    can see where we''ve gone and back to a previous page just by switching to

    an window. You can also arrange windows side-by-side, which is a good

    way to say, compare prices for Unix For Dummies, 5th Edition, at various

    online bookstores. (The difference may be small, but when you''re buying

    100 copies for everyone on your Christmas list, those pennies can add up.

    Oh, you''re not planning to do that? Phoo.)


    # Wild window mania


    To display a page in a browser window, click a link with the right mouse

    button and select Open in New Window or Open Link in New Window from the

    menu that pops up. To close a window, click the Close (X) button at the top

    right of the window frame. With three-button mice can usually open a link

    in a new window by clicking the middle button (although browsers

    set up to open a new tab instead, as we discuss in the next section).


    You can also create a new window without following a link. Press Ctrl+N or

    choose File::New::NewNavigator Window (in Netscape Navigator), File::New

    Navigator Window (in Mozilla) or Location::New Window (in Konqueror).'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# Part IV: UNIX and the Net


    # Tab dancing


    Conqueror and Mozilla (and Opera for that matter) have tabs, which are multiple
    pages that you can switch among in a window. Figure 18-4 shows a Mozilla window
    with three tabs. Just click any of the tabs near the top of the window to show
    its page. Click the little star-box at the left end of the tab line or press Ctrl-T
    to make a new empty tab or the X at the right to get rid of the current tab. In
    Conqueror, click a link with the middle button, or right click and select Open
    in New Tab or Open in Background, the latter meaning that it loads the new tab
    while leaving the existing viable.


    Like windows, tabs are multithreaded so you can have one loading in the background
    while you''re reading another, and little rotating arrows in the tab bar show
    which ones are loading and which are ready. For most purposes, we find tabs more
    convenient than Conqueror. You can use both; if you open several windows in Conqueror.
    In Mozilla, each window can have several tabs.


    # Short attention span tips


    If you have a slow Internet connection, at least two browser tabs or windows at
    the same time. While you''re waiting for the next page to arrive in one tab or
    window, you can read the page that arrived a ago in the other.


    If you ask your browser to begin downloading a big file, it displays, mostly usually,
    a small window in the corner of your screen. Mozilla displays a "thermometer"
    showing the download progress. Although some people consider watching the thermometer
    go or the pages fly enough entertainment (do when we''re tired enough), you can
    click back to the main window and continue surfing.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_295_0.png)


    Doing two or three things at a time in your browser when you have a dial-up connection
    is not unlike squeezing blood from a turnip — you can squeeze only so much blood.
    In this case, the blood is the amount of data you can pump through your modem.
    A single download task can keep your modem close to 100 percent busy, and anything
    else you share with the download process. When you do two at a time, each happens
    more slowly than it does by itself.


    If one task is a big download and the other is pursuing Web pages, everything
    works okay because you spend a fair amount of time looking at what the Web browser
    is displaying: the download can then help you think. On the other hand, although
    browsers let you start two download tasks at a time (or a dozen, if you''re inclined),
    doing more than one at a time than one after another is no faster, and it can
    get confusing.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_295_1.png)


    272'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Chapter 18: Web Surfing for UNIX Users


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_296_0.png)


    # There Goes a Helicopter (Real Wheels Series)


    The chopping gets louder and louder, the wind picks up, and a child points down...


    A little than Dave and Becky''s other exploits, this video takes you a tour of
    helicopters in the United States. From the Coast Guard to the Beaufort. While
    the plot is the focus of this video, a number of helicopter pilots talk about
    them and show them off, including a risky maneuver in mid-air from a rope.


    Dave and Becky do a good job communicating the excitement of helicopters, with
    their ability to rise straight up into the air or hover in place. Best of all
    is the cockpit of a helicopter, get to take a high-speed ride and experience its
    unique abilities to fly forward, backward, and sideways!


    # My Favorite Things


    The Web really does have places to visit. Some you will want to visit and over
    and again (We''ve probably visited the Google Web site thousands times by now).
    All the makers of free browsers, unfortunately, provided a handy way for you to
    remember those spots and not have to write down those nasty URLs just for you
    to find them again.


    Although the names vary, the idea is simple: Your browser page adds its URL to
    a list. Later, when you want to go back, you just go to your list and pick the
    page you want. Konqueror and Mozilla have saved Web addresses bookmarks; other
    browsers may use them as favorites.


    You can handle bookmarks in two ways. One is to think of them as a menu so that
    you can choose individual bookmarks from the menu bar of your browser. The other
    is to think of them as a custom-built page of links that you go to that page and
    then choose the link you want. Mozilla, a prime example of the "Great Expanding
    Blob" approach to software design, does both. Konqueror favors the menu, although
    it is happy to put the menu at the top, bottom, left, right, or even in a little
    window of its.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# 274 Part IV: UNIX and the Net


    # Bookmarking with Mozilla and Konqueror


    Mozilla and Konqueror bookmarks all lurk under the Bookmarks menu. To bookmark
    a web page — that is, to add the address of the page to your bookmarks — choose
    Bookmarks::Bookmark This Page (Mozilla) and Bookmarks::Add Bookmark (Konqueror).


    After you create some bookmarks, your bookmarks appear as entries on the menu
    that you see when you click the Bookmarks menu. To go to one of the pages on your
    bookmark list, just choose its entry from the menu.


    If you''re most users, your bookmarks menu gets bigger and bigger and crawls down
    your screen and eventually ends flopping down the floor, which is both unattractive
    and unsanitary. Fortunately, you can smooth (technical term) your menu into a
    more tractable form. Choose Bookmarks::Manage Bookmarks (Mozilla) or Bookmarks::Edit
