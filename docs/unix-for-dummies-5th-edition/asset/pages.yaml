    # Where are those files, anyway?


    NFS works by mounting remote directories. Meaning pretending that a directory
    on another disk or on another computer is actually part of the directory system
    on your disk. Files stored in lots of different places can then appear to be nicely
    organized into one tree-structure directory.


    Whenever UNIX sees the name of a directory— /stars/ervis, for example — it checks
    to see any names in the directory are mount points, which are directories in which
    one disk logically attached to another.'
