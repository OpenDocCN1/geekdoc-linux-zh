  md: '# Chapter 9: Printing (The Gutenberg Thing)


    # Why UNIX succeeded


    Back in the mid-1970s, the whole idea of computerized document formatting and
    typesetting was much less established than it is now. Within AT&T, however, troff
    and the UNIX system it ran rapidly became the standard for document preparation.
    Why two: line numbers. AT&T files a larger number of patents, and patent applications
    must have every fifth line numbered. The troff program was the first formatter
    that could do. The patent types embraced troff (patent applications are revised
    and retyped about a thousand times before they''re finally sent to the patent
    office), and the rest, as they say, history.


    If you''re running Windows, you can tell troff to display a page at a time, beautifully
    typeset in an X window, by typing this command:


    ```

    groff -TX75 -ms filename

    ```


    In the window that troff creates, press the spacebar to move from screen or press
    Q when you see enough. If the type is too small to read, -TX100 to make the text
    bigger. (You can''t use any other numbers; X comes with one set of fonts for 75
    dot-per-inch screens and another for 100 dot-per-inch screens, that''s what groff
    uses.)


    # Printing for the PostScript-Challenged


    Earlier in this chapter, we talk about PostScript, the famously complicated printer
    language that enables you to print fabulously complex documents on PostScript
    printers. But what if you don''t have a PostScript printer?


    These days, the short answer is "Get one." Although PostScript printers used to
    cost more than other kinds of printers, these days you can buy a perfectly decent
    PostScript laser printer for less than $500. Nonetheless, there are still lots
    of PostScript-free sites, where Ghost comes to the rescue.


    Ghostscript is a GNU version (see Chapter 2) of PostScript, written by L. Peter
    Deutsch, a skillful programmer from back who surely should have been doing else
    when he wrote it. When Ghostscript runs, it reads its PostScript input from either
    a file or the keyboard (which not very useful unless you''re trying to learn PostScript)
    and produces its output on one of a million possible devices. If you want to see
    the PostScript document looks like, you can tell it to send its output to an X
    Windows system window. If you want to print the document, you can send its output
    to your printer.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Printing PostScript with Ghostscript


    If you''re lucky, your system manager installed Ghostscript so that it''s semi-automatically
    called when you print a PostScript file. You typically use the -v flag, something
    like this:


    ```

    lpr -v floogle.ps

    ```


    Failing that, in order to run Ghostscript, you type its name (gs) and the name
    of the PostScript file to display:


    ```

    gs floogle.ps

    ```


    If you type that line, Ghostscript opens a new X window and displays the first
    page of floogle.ps in that window — probably not what you want. Press Ctrl-C once
    or twice to stop Ghostscript from displaying the page in a window — lots and lots
    of switches:


    ```

    gs -sDEVICE=deskjet -dNOPAUSE -sOutputFile=floogle.lj

    floogle.ps quit.ps

    ```


    What''s going on here is we set the output device (DEVICE) to a popular ink-jet
    printer. We tell it not to pause between pages, we tell it what output file to
    create and which PostScript file to print, and then we give it another file from
    the Ghostscript library (quit.ps). The quit.ps contains a one-line command, which
    tells Ghostscript that it''s finished. You can tailor this command as needed;
    run gs -h to see the available printers.


    We expect that you find this subject a wee bit complicated. In practice, unless
    your system manager has set up Ghostscript to run automatically, your best bet
    is to find a local expert who can tell you the exact command to use. Lacking an
    expert, you can still look at Postscript-on-screen with a slick little program
    named Ghostview.'
  merge: -1
