    # Other Sources of Information


    Your system administrator or nearby UNIX users probably have copies of UNIX manuals
    lying around. The pages of some of these manuals usually look much like the pages
    you get with man.


    The advantage of the printed manual is that an index is in the front (or the back).
    It is usually permitted or KWIC index (an overly clever abbreviation for key word
    in context), which means you can find an index by looking under any of the words
    in the title except for boring ones, such as the. To find the pages for the cp
    command (the title of the manual is cp, ln, mv — copy, link, or move files), for
    example, you can look in the permitted index under cp, ln, mv, copy, link, move,
    or files.


    Then again, typing help is not a bad idea, just to see what happens. Someone might
    have installed some kind help system — you never know.


    UNIX is used enough that a growing industry of UNIX books, magazines, user groups,
    and conferences have sprung up. Any of them can provide additional help and information.


    # Read a magazine


    Several weekly or monthly magazines cover UNIX. Most of them include in their
    titles either the UNIX name or the phrase Open Systems (for systems that act like
    UNIX but haven''t licensed the UNIX trademark). Because you probably have already
    thrown away mail inviting you to subscribe to most of them, we don''t favor the
    factor. The major brands of workstations (Sun, Hewlett-Packard, and IBM) also
    have magazines that specifically cover those product lines. Although some of these
    magazines tend to be awfully technical, they can be interesting for product reviews
    and announcements about new UNIX hardware and software packages.


    If you use Linux, take a look at the Linux Journal, the magazine for and about
    Linux (Subscription info is at www.linuxjournal.com). The technical level varies
    from totally introductory to fairly technical. Also see its online Linux Gazette
    at www.linuxgazette.com/.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_382_0.png)'
