    # Using ssh one command at a time


    Sometimes a complete login session is overkill for what you want to do — you want
    to run one command at a time. In this type of situation, ssh can also do one command
    at a time:


    ```

    ssh pumpkin lq               # if your user name is different

    ssh fred@pumpkin lq

    there

    ```


    You give ssh name of the system you want to use and the command you want to run
    on that system. This example runs the lq command on system pumpkin (remember that
    lq asks what''s waiting for the printer on pumpkin).


    If you can use ssh to log to a system and not give a username or password, you
    can also use it a command at a time without a password.


    # scp: Blatting Files across the Network


    Although we telnet and ssh may be the next best thing to be there, there''s no
    place like your home machine. If you want to use files that are on another machine,
    scp is often the easiest thing to do. (You can use ftp to blat files across the
    network, but because that''s a larger topic, we will give it all of Chapter 19.)


    The idea behind scp is that it works just like cp (the standard copy command)
    — except that it also works on remote files that you own or that you have at least
    access to. To refer to a file using a colon before the filename. To copy a file
    named mydata from the machine named pumpkin and call it pumpkinkindata, you type


    ```

    scp pumpkin:mydata pumpkinkindata

    ```'
