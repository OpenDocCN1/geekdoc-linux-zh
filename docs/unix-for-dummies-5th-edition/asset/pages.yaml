    # # Under the hood in Mac OS X


    | Apple programmers wrote the first nine versions of the Macintosh operating system
    all by themselves. In both OS X, they wisely up and jumped on the free UNIX bandwagon.
    Underneath all of the Mac-ness, OS X is based on a version of FreeBSD. If you
