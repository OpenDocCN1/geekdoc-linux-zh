  md: '# 314 Part V: Help!


    # Links, copies, moves, truncations, and not other details about file destruction


    Clover-wise, copying files works a little differently from moving and linking
    files. More often than not, the practical difference is unimportant, although,
    in a few cases, it can be worth knowing about.


    they just change which filename is connected with which contents. Suppose that
    you type this command:


    mv first second


    The cp command does one thing as itbers a file; mv and ln do another. The difference
    is noticeable only if additional names or links are created for that with ln.
    (Refer to Chapter 8 to find out how to create links, or additional names, for
    using ln.)


    mv command disconnects the name from its current contents. Because the contents
    are still linked to the name extra.name, that file is still safe and sound. The
    mv command connects the name second to the contents of first, and finally, disconnects
    the name first from the file. Now no file is harmed.


    Clobtering with cp: Suppose that you have two files: first and second. You create
    an additional name by using this ln command:


    As a result, the contents of the second file are not cluttered (see them, you
    can use the other name for the file). The ln command works the same way as mv
    to disconnect links and not touch the contents of the file.


    ln second extra.name


    Now that you accidentally (who knows why?) type cp first second (remember that
    you already have a file name second). What happens if cp replaces the current
    contents of second with a copy of first. That is, it replaces the file first content.
    This also affects the file name extra.name because it is not the name for the
    file. If you use cat or a text editor to look either second or extra.name, you
    see a copy of first. The original contents of second and extra.name are gone with
    it.


    The message here is if you have just fouled an mv or ln command, you may still
    have the hope of retrieving the old file (if it had other links).


    Clobbering with mv or ln: "So what?” you ask, to cut the heart of the matter.
    Here''s the interesting part (to interest us, anyway). If you used mv or ln rather
    than cp, the second file would not be gone. The mv and ln commands do not fool
    the contents of the file —


    Clobtering with soft links: The story is a little different if you use soft links
    rather than hard links (Refer to Chapter 8 to see how soft links can link from
    different file systems). Because soft links are just aliases for the true filename,
    if you do something to the original file, all the links to the changed file because
    it has the same name. On the other hand, if you use cp to change the contents
    of the original file, the cp command replaces the contents. The mv and ln commands
    affect the link.


    Confused? The moral is the same with soft links: After a botched instance of mv
    or ln, you may still be able to find the original file, if it had another name.
    It can''t hurt to lose.


