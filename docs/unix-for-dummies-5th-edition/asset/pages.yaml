    shows you how to try that first.


    # Transplanting files


    Chapter 5 describes the use of the mv command to rename a file. You can use the
    same command to move files from one directory to another. To get the command to
    move files rather than rename them, you tell it this things:


    +   - The name of the file you want to move

    - The name of the path where you want to put the file


    If you want, you can rename the file at the same time you move it, but like to
    keep things (comparatively) simple. Suppose that you put the file sues.04.budget
    into /Budget/Year2003 directory rather than in /Budget/Year204. The easiest way
    to move it is to go first to the directory in which it is located. In this example,
    you type this line:


    ```

    ls .Budget/Year2003

    ```


    Use ls to make sure that the file is in the current directory. After you are sure
    that the file is, you can move it to the directory you want by typing this line:-


    ```

    mv sues.04.budget /Budget/Year2004

    ```


    Be sure to type one space after mv the name of the file and the place you want
    to move it to. If you use ls again, you discover that the file is no longer in
    the working directory (Year2003). You should'
