  md: '# Chapter 21


    # Disaster Relief


    In This Chapter


    +   - "My computer won''t turn on"

    - "My mouse is acting glitchy"

    - "The network is gone"

    - "These aren''t my files!"

    - "It''s not listening!"

    - Wrecked X

    - "I give up"


    The tiny, infinitesimal chance that you may run into some kind of problem with
    your computer always exists. The problem can be something major (such as losing
    the funniest interoffice memo you have seen in years) or minor (perhaps accidentally
    deleting the analysis you have spent two months creating).


    Some computer problems you can fix — you can''t. The situation is similar to cars:
    You can pump gas yourself and change the oil, but when it''s time to rebuild the
    engine, call for help. (We do, anyway.)


    This chapter describes some problems you may run into, with suggestions for what
    to do.


    # # My Computer Won''t Turn On


    You come in the office one morning, flip the switch on your computer, and nothing
    happens. No friendly whir, nothing on-screen. Uh-oh. Lots of things could have
    happened, so check these possibilities:


    +   - Is your computer plugged in? It sounds stupid, but we have computer problems
    when the people who clean the office bumped your vacuum cleaners into the outlet
    our equipment was plugged in. If you''re using a terminal or X terminal, this
    check applies to both the terminal and the computer.'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# 306 Part V: Help!


    +   Is the power-strip on? If the computer is plugged into a power strip that
    has its one on-off switch, check that switch''s position. People have been known
    to turn off the switch inadvertently with their toes.


    +   Is the computer still attached? Are the cables that connect the computer,
    keyboard, screen, and whatever else still connected? If your terminal is connected
    to a network, is the network cable firmly attached to the computer? Try wgling
    it a little, if it looks okay.


    +   Does the rest of the office power? Plug a lamp into the same outlet and make
    sure that the lamp turns on. (True story: "Hello, help desk? My computer won''t
    turn on." "Is it plugged correctly?" "I can''t tell. The power failed, and none
    of the lights work.)


    +   Is the picture on the screen turned off? The computer can be turned on, and
    the screen even, but the picture on the screen is dimmed. Fool with the brightness
    knob (remember the knob was positioned when you started fiddling with it).


    +   Does your computer have a screen-blanker program? Press a key to make sure
    a screen-blanker program hasn''t blacked out your screen as a favor to you. (We
    like to press the Shift key because it has no effect on the computer.) Moving
    the mouse a little unblanks the screen.


    If the problem isn''t the power, it''s probably not something you can fix yourself.
    Call your system administrator for help. Some component may have burned out. Stay
    calm—it does not mean that the files stored on your hard drive are gone. They
    are probably fine: Disks remember data perfectly with the power off.


    # My Mouse Is Acting Glitchy


    If you have a computer with a male mouse (a mouse with a ball underneath), or
    dust or crumbs inside can prevent the ball from rolling smoothly. Most mice have
    a way to remove the ball (for cleaning, usually by turning a plastic ring that
    surrounds the opening for the ball or by sliding the ring to the front or side.
    (We don''t suggest appropriate names for that ring.) Turn the mouse so that the
    ball falls into your hand and not on the floor, carefully wipe off the grit, carefully
    pick the lint off the little rollers inside, and snap it all back together. Female
    mice (optical mice, with no balls) appreciate if you occasionally wipe the mouse
    pad with a tissue. Also, look at the bottom of your female mouse: if it''s turned
    on and working, you see a little red LED through one of the openings.'
