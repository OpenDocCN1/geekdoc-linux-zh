  md: '# Dedication


    John and Margy both dedicate this book to their dad, wherever he is. When last
    sighted, he was traveling somewhere in China finding out just how great the wall
    is, unless he was at the beach here in the U.S. — he’s a man who knows how to
    live!


    # Authors'' Acknowledgments


    The authors thank Antonia Saxon, Jordan Young, Sarah Willow Levine Saxon, Meg
    Young, and Zac Young for putting up us while we updated this book. Thanks also
    go to our Internet providers: Finger Lakes Technologies Group and the Trumans
    Home Telephone Company (Trumans, NY), the Shoreham Telephone Company (Shoreham,
    VT), and SoVerNet (Bellows Falls, VT).


    We thank Peter Seebach for research and revisions (you can guess what really means)
    on KDE and GNOME in Chapters 4 and 17, and Nancy McGough for helping make our
    comments on Linux bear at least some relation to reality.


    Chris Morris patiently shepherded the text from our hazy scribblings (electronically
    speaking) to a printed book with a blend of patience and midnight wit. He got
    lots of help, of course, from all the folks listed on the other side of this page.'
