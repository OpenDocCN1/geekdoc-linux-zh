  md: '# 54 Part II: Some Basic Stuff


    # ## Icon do this with a picture


    GUIs are crazy about pictures (they''re graphical, after all), especially cute,
    little ones. The cutest, littlest you run into are called icons. An icon is a
    little picture in a little box on-screen that represents a window. When you tell
    X Windows to "iconify", the window disappears and an icon remains. When you double-click
    (or single-click if you''re not using Motif) the icon, the window comes back just
    as it was before. Being able to reduce windows to icons enables you to show programs
