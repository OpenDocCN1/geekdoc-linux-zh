  md: '# Chapter 16: Across a Crowded Network


    # NFS: You''ll Never Find Your Stuff


    If your computer is on a LAN, the computer is probably set up to share files with
    other computers. A few different schemes enable computers to use files on other
    machines. These schemes are named with TLAs (Three Letter Acronyms) such as SMB,
    RFS, and NFS. This chapter talks mostly about NFS (You''ll Never Find Your Stuff)
    because that''s the most commonly used scheme, though it works, in many ways,
    the worst. If you didn''t like the C shell or the vi editor, you won''t like NFS
    either; it was also written by Bill, the big guy with strong opinions.


    # What''s NFS?


    The NFS (Network File System) program enables you to treat files on another computer
    or more or the same way you treat files on your own computer.


    You may want to use NFS for several reasons:


    +   Often you have a bunch of similar computers scattered around, all running
    more or less the same programs. Rather than load every program on every computer
    (the server) loads one copy of everything so all the other computers (the clients)
    can share the programs.


    +   Centralizing files on a server makes backup and administration easier. Administering
    one disk of 4,000MB is easier than administering 10 disks of 400MB aice. Backing
    up everything is also easier because everything is in one place rather than spread
    around on a dozen machines.


    +   Another use of NFS is to make a bunch of workstations as a shared time-sharing
    system. Setting up a bunch of workstations so you can sit down at any one of them,
    and use the same set of files regardless of where the network physically resides
    is reasonably straightforward. This capability is a great convenience. Also, by
    using programs as ssh (discussed earlier in this chapter), you can log into another
    machine on the network and work from that machine (which is handy if the other
    machine is faster than yours or has some special feature to use).


    +   NFS works in heterogeneous networks, a fancy term for networks with different
    kinds of computers. NFS is available for all sorts of computers, from PCs to mainframes.'
