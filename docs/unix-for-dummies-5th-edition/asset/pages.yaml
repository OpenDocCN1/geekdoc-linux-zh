    # # Do I Have to Type the Same Things Every Time I Log In?


    Most users find that, every time they log in, they type the same commands to set
    up the computer way they like it. You might typically change to your favorite
    directory, for example, and then change the terminal settings (see the following
    section), check your mail, or do any of a dozen things.


    The Bourne, Korn, and BASH shells look in your home directory for a file called
    .profile when you log in. If the .profile file exists, UNIX executes the commands
    in that file. The shell has two corresponding files: .login (which runs when you
    log in) and .cshrc (which runs every time you start a new shell, either at login
    time or when you type csh).


    Your system administrator probably gave you a standard .profile or .login file
    when your account was set up. Messing with stuff that''s already definitely not
    a good idea. You might end up to log in and then have to crawl to your system
    administrator and beg for help. So don''t say that they didn''t warn you.


    The standard .profile, .login, and .cshrc files vary considerably (why do we even
    finish this sentence — you know what we''re going to go) from one system to another,
    depending on the tastes of the system administrator. They usually perform this
    tasks:


    +   - Set up the path the shell uses to look for commands

    - Arrange to notify when you have new mail

    - (Sometimes) change the shell prompt from the usual $ or % something informative


    If you always type the same commands when you log in, adding new commands at the
    end of .profile or .login is fairly safe. If you do most of your work in the directory
    bigproject, for example, you may add the following three lines to the end of your
    file uses to start up your UNIX session (.profile or .cshrc):'
