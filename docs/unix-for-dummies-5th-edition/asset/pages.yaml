  md: '# Chapter 22: The Case of the Missing Files 317


    # Why you need backups


    Making backups is a pain. The question isn''t whether you will lose data — it''s
    when. Here are some events that have sent us heading for the backup tapes:


    +   - The obvious one: We deleted a file by mistake.

    - Just as we were saving a file, the power failed and scrambled both the old and
    new versions of the file. Yikes!

    - One day, while working on the insides of the computer (one of us is a closet
    nerd), we accidentally dropped a screwdriver on the disk controller. Exciting
    sparks came us and fried the controller card that attaches the disk to the rest
    of the computer. We got a new controller and found, although the disk was physically
    fine, the new controller wasn''t quite compatible with the old one, and we had
    to reform the disk and restore everything from.

    - We remembered hearing that we should absolutely, positively run a "disk-head


    ) program before moving our hard drive, so we ran one. Unfortunately, it was a
    version that was incompatible with the hard drive, so it ripped the disk head
    right off the edge of the disk, way out past what you may call the Long-Term Parking
    Area. We could hear the disk head hanging on the side of the hard drive as it
    tried to get it back. Rats! (Modern disks perhaps themselves, but we had a few
    that became permanently unable to unpack.)


    +   - Back in the good old days, computers weighed about 15,000 pounds, and you
    needed a forklift to move them. Now they weigh about 25 pounds, which means that
    if the cleaning people bomb one with a vacuum cleaner; they could knock it over
    with a client and put an unreadable ding into the disk. Oops — sorry, lady.


    Although you perhaps have horror stories of your own, they all have the same moral:
    Make your backups.


    If your system administrator doesn''t make backups, how to do it yourself. If
    you have a tape unit on your machine, the procedure is usually as follows:


    +   1. Put a tape in the tape unit and flip the latch to seat the tape firmly.
    Wait for the tape to load itself into the tape unit.


    +   2. Give a command to copy files to the tape, using the tar (fape archive)
    or pax (portable archive exchange) program.


    On Sun workstations, the program is bar (backup archive). The exact things you
    have to say to the tape vary from one to another, mostly because of the peculiarities
    of different kinds of tape units. You can''t use the regular cp command because
    tapes aren''t logically organized the same way disks are. This process can take
    as long as overnight to dump a largish disk.


    +   3. Take the tape out of the tape unit.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 318 Part V: Help!


    4. Write the current date on the label so that you know it''s a current backup.


    (The sensibly paranoid alternate several tapes, in case one of them goes bad.
    We discuss this subject in more detail in the "Backup strategies" sidebar, later
    in this chapter).


    5. Put the tape in its box, and put the box back on the shelf.


    6. Once a week (or some other frequency), take the backup tape and store it off-site,
    as in another office or at someone''s house or, if you''re really serious, in
    your safe-deposit box. (We do that)


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_341_0.png)


    The usual way to back up stuff on Linux is to use tar. To back up to tape, type
    this famously memorable command:


    ```

    tar cvf /dev/rft0

    ```


    The cvf means Create, Verbose Report to File, and /dev/rft0 is the name of the
    tape unit. The * means to back up all the files in your directory; if you have
    a large number of them, you can list specific files and directories instead.


    If you have a large number of files, copying everything to tape can take whilst
    (an hour or so). You may want to do the backup up over lunch. Or do what we do,
    and have your administrator arrange to run the tar program automatically every
    morning at about 3 a.m. We leave the tape in the tape unit every night. When we
    come back the next day, the backup has been done, and we take the tape out and
    put it away. The tar command creates a report that is e-mailed to us so that we
    can check to see whether the tape was written correctly.


    # Disks, floppy and otherwise


    Systems don''t have tapes; they have removable disks, either diskettes or larger
    removable disks, such as ZIP disks or CD-R discs. Diskettes are a major pain for
    backup use for two reasons: You need a stack of them because each one holds only
    a megabyte, and you must format them first.


    Before you use a diskette, you must format it, which means the computer writes
    some bookkeeping junk on it to mark where to put the data and in the process checks
    to be sure that no bad spots are on the disk. Fortunately, you have to do this
    only one time per disk. Formatting disks is easy but tedious (and along with as
    we say this) varies, of course, from one system to another. Use the blank disk
    in the computer, the formatting command, like fdformat, and UNIX formats it. If
    you''re stuck with diskette backups, ask your administrator for help in setting
    the procedure, and while you''re feeding the disks into the drive, consider getting
    a tape drive.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Chapter 22: The Case of the Missing Files 319


    If you back up to diskettes, type this line in Linux:


    ```

    tar cvmf /dev/fd0 *

    ```


    The M means multiple disks because you can''t put much stuff on one disk. Linux
    tells you when to swap disks. Be sure to write the backup date and the disk number
    on each disk so that they don''t get out of order.


    UNIX systems can also use ZIP disks, CD-R and CD-RW disks. ZIP disks are the easiest
    because (most likely with an expert''s help to set up) you can mount the disk
    as a part of the UNIX file system called something like /z, at which point you
    use cp to copy files to / just like you do any other disk. When done, you tell
    UNIX to unmount the disk, and then you physically take it out and put it on the
    shelf. Writing CDs is harder if you want to read CD on other computers, it has
    to be in a format called ISO 9660, which UNIX systems can only write with special
    programs. This is a good application for chocolate chip cookies, to bribe a nearby
    UNIX expert to set up a script to automate the process of collecting your files,
    making an ISO 9660 version of them, and writing it to a CD.


    # Thank goodness it''s backed up!


    Getting stuff back from a tape or diskettes also involves the use of tar but is
    somewhat tricky because you want to restore the files you clobbered. Ask for help
    — at least the first time. Generally speaking, you put the tape in the drive in
    the same way you did to make the backup, and then you type a tar or par command
    similar to one of these:


    ```

    tar xvf /dev/tape/clobberedfile

    pax -rv -f /dev/tape/someday/clobberedfile

    ```


    In the command, xvf extracts everything verfrom. In the par command, -rv -f means
    read verfrom. Either way, the command is followed by the name of your tape drive
    (it''s often /dev/rft0) and the name of the file to look for. The tape spins as
    tar or par runs down the tape for the file you want. When it finds the file, it
    reads it to the disk, reports that it did so, and stops. If you clobbered a bunch
    of files, you can use wildcards:


    ```

    tar xvf /dev/tape/someday/**

    pax -rv -f /dev/tape/someday/**

    ```


    You have to use quotation marks around the wildcards because the files to match
    are on the tape, where tar or par can find them, not on the disk the shell (which
    normally handles wildcards) can find them.'
