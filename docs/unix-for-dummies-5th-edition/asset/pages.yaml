  md: '# "The Network Is Gone"


    You can''t print on the printer down the hall, and you can''t run certain programs.
    The problem may be that your computer is not communicating properly with the network
    to which it is normally attached.


    Trying to solve most network problems is not for the faint of heart. One thing
    you can try to check the cables in the back of your computer. The network cable
    firmly attached to the computer? Wiggling it a little, even if it looks okay.
    Otherwise, it''s time to call in the experts.


    # "These Aren''t My Files!"


    Normally, when you log in, you start working in your home directory. If you type
    the following line, you return to the home directory from whichever directory
    you may have roamed to:


    ```

    cd

    ```


    If cd doesn''t get you back home, you may not be who you think you are. Try typing
    whoami or who am 1. If someone else''s username appears, your computer thinks
    that''s who you are! A coworker may have logged in to your computer to do work
    for a moment.


    You have several options:


    +   - Send some e-mail, which will arrive looking as your coworker sent it. Delete
    all files that look important, and then log out and pretend that nothing happened.


    +   - Log out without fouling anything, and then log in as yourself. Type this
    line:


    ```

    logout

    ```


    Maybe you have to type exit or just press Ctrl+D. At any rate, you see the login
    screen, log in as yourself.


    Most courses in business ethics tell you that the second option is preferred by
    all except the slimiest of bottom-feeding MBAs, but the urge to send goofy e-mail
    is sometimes irresistible. Remember: You may be caught.'
  merge: -1
