    Those Other Famous Operating Systems


    To answer your first question, GUI stands for graphical user interface and really
    is pronounced "gooey". We prefer the term WIMP, which stands for windows, icons,
    and mouse pointing, but for some reason the term never caught on. Fast-track executives
    would rather be goofy wimps, we suppose.


    A GUI is a combination of a graphics screen (one that can show pictures in addition
    to text), a system that divides the screen into several windows that can show
    different things at the same time. All GUIs work in or less the same way because
    they are all based on the same original work done at Xerox 20 years ago. The details
    differ enough, to make you want to tear your hair out.


    # # UNIX Gets All GUI


    The earliest UNIX systems didn''t have fancy, screen-oriented windowing systems.
    They didn''t have screens at all, in fact — they used loud, rattling terminals
    that printed on actual paper. (The historically minded can find these types of
    terminals in the Computer Museum in Boston and the Smithsonian Institution in
    Washington, D.C. Yes, really.) As the years went by, UNIX appeared on computers
    that did have screens (most notably Sun workstations), and various windowing systems
    appeared.'
