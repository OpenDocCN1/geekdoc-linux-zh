    # What You Need in Order to Use Remote E-Mail


    Nowadays, your e-mail is usually received and stored by another computer, for
    you to download at your leisure. We look at a few of the mail programs that support
    remote e-mail in this chapter. Most mail programs are graphical clients, meaning
    you can''t use them from a terminal window. If you need to fetch mail and read
    it in a terminal window, the program you''ll probably end up using fetchmail,
    which takes mail and puts it into a local mailbox.


    Common ground does exist among remote e-programs. They don''t actually send and
    receive your mail, so they need to be told where your mailbox is. To configure
    your e-mail program, you need an inbound mail server and an outbound mail server.


    A machine is somewhere out there with your mail on it. Because some call into
    that machine for you, it''s called an inbound mail server. When you configure
    a mail client to talk to the mail server and get your mail, the mail client configuration
    probably talks about incoming mail. Most likely, you get your mail via Post Office
    Protocol (POP). This is also called an incoming mail server, or a POP server.'
