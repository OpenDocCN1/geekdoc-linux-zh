  md: 'If you really want to be paranoid about passwords, don''t use one that appears
    in any dictionary. Some system breakers may decide to use the UNIX password-encryption
    program to encrypt last word in a dictionary and then compare each of the encrypted
    words to your password. It''s another thing to keep you awake at night.


    # Ciao, UNIX!


    Logging out is easy — at least compared to logging in. You usually can type **logout**.
    Depending on which shell you''re using (a wart we worry about in Chapter 2), you
    may have to type **exit** instead. In many cases, you can press Ctrl+D to log
    out.


    You know that you have logged out successfully because UNIX invites the next sucker
    to log in, hangs up the phone, or, if you''re connected by **telnet** or **ssh**,
    disconnects from your program.'
