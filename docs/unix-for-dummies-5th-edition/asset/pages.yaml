  md: '# # Chapter 13


    # # Juggling a Bunch of Programs


    # ## In This Chapter


    +   - What processes are

    - Where processes come from

    - What a background program is

    - How to shuffle background programs around

    - Hints about windows and background programs


    If you have a plain old terminal with no windowing system, you may be envious
    of users with fancy window systems who can pop up a bunch of windows and run unpreteen
    programs at a time.


    Don''t. Any UNIX system enables you to run as many programs simultaneously as
    you want. Nearly all the systems let you stop and restart and switch around among
    different programs whenever you want.


    If you''re used to an old-fashioned, one-program-at-a-time system, such as DOS
    (without Windows) or the System 7 Mac, you may not see the point of doing several
    things at a time. Suppose, however, that you''re doing that awake and the computer
    can manage with little or no supervision from you, such as copying a large file
    over a network (which can take 10 or 15 minutes). You have no reason to sit and
    wait for that process to finish — you can do something useful while the copy runs
    in the background.


    Or, suppose that you''re in the middle of a program and you want to do something
    else: You''re writing a memo in a text editor and need to check some e-mail you
    received make sure you spelled someone''s name right. One way to do that is to
    save the file, leave the editor, run the mail program, leave the mail program,
    start the editor again, return to the same place in the file, and pick up where
    you left off. What a pain. UNIX enables you to stop the editor, run the mail program,
    and resume the editor exactly where you left it. For that matter, you can run
    both the editor and the mail program and flip between them as necessary.'
