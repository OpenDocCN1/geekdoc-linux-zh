  md: '# 268 Part IV: UNIX and the Net


    # Here’s HTML in your eyes!


    As you may know, Web pages are written in a language called HTML, which includes
    instructions to tell the browser about text, headings, links, graphics, and anything
    else a Web page may contain. Each browser reads the HTML information about a page,
    formats it and displays it. Different browsers use different formatting.


    If you want to see the actual HTML version of a page in your browser, left-click
    somewhere in the page and in the menu that appears, View Page Source or View Document
    Source.


    ```

    <HTML>

    <HEAD>

    <TITLE>Great Tapes for Kids!</TITLE>

    <!-- Changed by: Margy Levy Young, Nov-2003 -->

    </HEAD>

    <BODY BGCOLOR="#FFFFFF"

    BACKGROUND="back.gif">

    ```


    <CENTER><IMG SRC="title.gif" HEIGHT=30 WIDTH=500></CENTER>

    <h1>Great Tapes for Kids: A Catalog of the Best Children''s Video and Audio Tapes</h1>


    Have you ever seen a terrific, educational tape at a friend''s house, a tape that
    your kids loved, and then never been able to find the tape for sale? Many of the
    best kids'' video and videotapes aren''t in your local video store, but you can
    order them here!


    All brackets surround HTML markings, which tell browsers how to format the text
    and where to put pictures in. If you want more information about HTML, you can
    find about a billion Web sites and on the topic. On the Web, a decent introduction
    is at www.w3.org/Markup/Guide. Book lovers can check out HTML For Dummies by Ed
    Title (published by Wiley Publishing, Inc.).


    # Backward, ho!


    Web browsers remember the last few pages visited, so if you click a link and decide
    that you''re not crazy about the new page, you can easily go back to the preceding
    one. To go back, click the Back or Previous button on the toolbar (it icon is
    an arrow pointing to the left, and it''s the left-most button on the toolbar)
    or press Alt<-.


    # All over the map


    Some pictures like image maps, as the big picture shown in the middle of Figure
    18-3. In a regular line, where you click doesn''t matter; on an image map, it
    does. The image map in Figure 18-3 is typical and has bunch of obvious places
    you click for various types of information, either on the map itself to zoom in
    on a point, or on the symbols at the bottom to move or zoom the whole map.'
  merge: -1
