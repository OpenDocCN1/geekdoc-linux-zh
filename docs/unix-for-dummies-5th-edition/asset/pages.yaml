- img_proc: true
  md: '# Part III: Getting Things Done


    # Just the text, ma''am


    A text editor enables you to


    +   - Create a full file of text

    - Edit the text


    You can print a file by using the lp or lpr programs, as described in Chapter
    9, although text editors can''t do boldface, headers or footers, italics, or all
    that other fancy stuff you need in order to produce modern, overformatted, professional-quality
    memos.


    You may want to use a text editor to write letters and reports. You certainly
    will use one of electronic mail, as described in Chapter 17.


    The most used text editors in the land of UNIX are vi, emacs, and pico. We have
    strong opinions about these editors, which becomes undoubtedly clear in the later
    sections in this chapter, where we will tell you how to use each of them.


    # Text formatters aren''t really editors


    Text formatters are programs that read text files and create nice-looking formatted
    output. You may use a text editor to make a text file that contains special little
    commands only the formatter understands; the .IT command, for example, makes something
    italic. When you run the formatter, it reads the text file, reads the special
    little commands, and creates a formatted file you can print. You use lp or lpr
    to print the output of the text formatter.


    The most common UNIX formatter is TeX, pronounced "teccccc" (like yeeccec), an
    arcane language popular among mathematicians and physicists because of its capability
    to format large, complex equations, and because it produces more aesthetically
    pleasing results than any of its competitors. A companion program, LaTeX, is designed
    to make TeX easier to use (relatively speaking, course). (See the nearby sidebar,
    "Howdy, TeX! for more info about TeX and LaTeX and where to get them)


    Another common formatter is troff. Some people use nroff (an older version of
    troff), or groff, a newer GNU version of the program. With luck, you never have
    to use any of them. If your luck has run out, you may want to check out the section
    about troff, nroff, and groff in Chapter 9.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Chapter 10: Writing Deathless Prose


    # Howdy, Tex!


    Donald E. Knuth created the popular Tex formatter back in the 1970s. According
    to Knuth himself, Tex is a “typesetting system ... intended for the creation of
    beautiful books—and especially prized for books that contain a lot of mathematics.


    Like tro and and cousins nroff and groff, Tex uses macros (prewritten bits of
    formatting code) to yield (theoretically) from plain, low-level programming chores.
    In practice, Tex is hard to handle because it may many things intuitively. For
    those overwhelmed by the complexity of Tex, Knuth created plain Tex which is simple
    and trim, stripped-down version of Tex. Because Tex overwhelms almost everyone,
    almost everyone uses plain Tex rather than Tex itself.


    Over the years, various intrepid UNIX hackers have taken it upon themselves to
    write their own sets of macros that work with Tex. The best known is probably
    LaTeX (the La part comes from the last name of its creator, Leslie


    Lamport). To make a long short story, LaTeX simplifies Tex by letting you describe
    the structure of a document without making worry about the document looks using
    the built-in styles in a word processor, such as Microsoft Word. Other macro packages
    for Tex include Explain, Lollipop, pdffTex (for creating books in Adobe Acrobat),
    and HyperTex (for creating hypertext documents, as web pages, Tex!).


    Like many things UNIX, the Tex source code and documentation are available for
    free; you can download them from any FTP or Web site. Also, you can buy commercial
    versions of Tex to get technical support and, in some cases, additional features
    for your money.


    The best source of information about Tex, LaTeX, and related subjects is The Tex
    Users Group home on the World Wide Web (at www.tug.org/) or one of the many Tex
    Usenet newsgroups, as comp.tex.


    # Cuisinarts for: Word processors


    Word processors combine the capabilities of text editors and formatters. Most
    word processors are (or try to be) WYSIWYG (an acronym for What You See Is What
    You Get), which enables you to see on-screen how the document (that they call
    their files) will look when you print them.


    Surprisingly good, free word processors are available for UNIX. KWord, which comes
    with the KDE desktop package, is a simple but quite usable word processor. AbiWord
    is similar to Microsoft Word, and OpenOffice contains equivalents to most of the
    Microsoft Office. In writing this original version of this book in 1993, we used
    troff, but for your editor''s relief, work fine in Microsoft Word.'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'Most UNIX users think that word processors are for wimps (what you see is all
    you''ve got) because they like the unintelligible and unmemorable commands used
    by text formatters and prefer to imagine what their text will look like when it
    is printed rather than be able to see it on-screen. Text formatters can do more
    complex things than word processors can, such as complicated mathematical expressions,
    lay out multi-page tables, and neatly organize sections and headers of huge, book-length
    documents. But that''s probably not your problem.


    # Desktop publishing does it all


    A desktop publishing (DTP) program resembles a fancy word processor. It can do
    everything a word processor can, plus things you need if you are printing a book,
    newsletter, or something that looks fancy. DTP have facilities for creating tables
    of contents and indexes, maintaining references—you name it. For writing an occasional
    memo, a desktop publishing program is definitely overkill.


    The most popular desktop publishing program for UNIX is Adobe FrameMaker (available
    for PCs and Macintoshes).


    TeX and some versions of troff are available for free, which explains why they
    remain popular (big surprise, eh?). All desktop publishers are commercial products
    that cost extra. Lots extra.


    # vi and emacs and pico are your friends


    The rest of this explains how to use each of the Big Three editors (vi, emacs,
    and pico), along with some words about how to use the prehistoric but not yet
    extinct ed (who, as you will see, is not your friend). Even if you use a word
    processor or desktop publishing program, you may need to use a text editor to
    do some things, such as these tasks:


    +   Write electronic mail (see Chapter 17).


    +   Create or edit text files called scripts, which enable you to create your
    UNIX commands (see Chapter 12).


    +   Create or edit special text files that control the way your UNIX setup works
    (see Chapter 7).


    +   Write C programs (just kidding!).'
  merge: -1
