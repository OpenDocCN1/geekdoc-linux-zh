  md: '# Chapter 18: Web Surfing for UNIX Users


    # The text, the whole text, and nothing but the text


    If you''re stuck with a plain old text, text-based terminal (for example, if you
    connected to a UNIX host with telnet or ssh), you can use a text-only browser
    named Lynxx. Text-only means you don''t get to see any of the cool pictures, animations,
    and sounds that make the Web phenomenally popular that it is. On the other hand,
    Lynxx is blindingly fast (drawing these pictures is slow) and quite adequate for
    a quick look at sites where you don''t care about the pictures.


    Lynx is entirely controlled from the keyboard, so you navigate around the screen
    with the up and down arrows, follow links with the right arrow, and select and
    change fields with Enter. After you do this for a few minutes, it''s surprisingly
    usable, and Lynx is very good about keeping a line at the bottom telling where
    you are and what characters you might want to type now. The most important one
    is q for quit.


    # Surfing with Your Browser


    At the top of the window are a bunch of buttons and the Location line, which contains
    the URL or Iframe for the current page. Remember that URLs are an important part
    of Web lore because they''re the secret codes that name the pages on the Web.
    For details, see the sidebar "URL," earlier in this chapter.


    The main part of the browser window is taken up by the Web page that you''re looking
    at. After, that''s what the Web is for — displaying a Web page! The buttons, bars,
    and menus around the edge help you find your way around the Web and do things,
    such as print and save pages.


    # Getting around


    You need two simple skills (if we can describe something as basic as a single
    mouse-click as a skill) to get going on the Web. One is to move from page to page
    on the Web, and the other is to jump directly to a page when you know its URL
    (see the section, "Going places," later in this chapter).


    Moving from page to page is easy: Click any link that looks interesting. That''s
    it. Underlined blue text and blue-bordered links are (Links may be a color other
    than blue, depending on the Web page designer is going for, they''re always underlined
    unless the page is the victim of a truly awful designer.) Anything that looks
    like a button is probably a link. You can tell when you''re pointing to a link
    because the mouse pointer changes to a little hand. If you''re not sure whether
    something is a link, click it anyway because doing so won''t hurt anything. Clicking
    outside a link selects the text you click, as in most programs.'
  merge: -1
