  md: '# Chapter 4: Opening Windows on UNIX 53


    Some systems have desktop managers (unrelated to window manager programs) that
    attempt to make handling programs and files easier. Desktop managers have sets
    of icons you click to start common programs. They enable you to click filenames
    to edit the file, for example — sort like the Macintosh Desktop. Opinions vary
    on how useful these desktop managers are. We haven''t been crazy about them, although
    trying them for a few minutes is worth your time because some people find them
    easier to use menus and shell commands.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_76_0.png)


    # A quick mouse refresher


    You probably know all how to use your mouse. In the unlikely event you''re a little
    rusty on the terminology, here are a few basic terms:


    Double-click: Click the same button twice quickly, usually with the first button.


    Drag: To drag something, move the cursor to the drag-ee, press down the mouse
    button, while holding the button, and then let go of where you want the drag-ee
    to. Most non-Motif programs use the left button to drag stuff, and Motif programs
    use the middle button.


    Which is which: The first is the one on the left (unless someone has configured
    your mouse to be left-handed), and the one on the right. Either way, the second
    button is the one in the middle. The third button is the one that isn''t the first
    or second button. (What? You already figured out?)


    You are dragging in two ways. The first is for pop-up menus. When you press one
    of the mouse buttons, a menu appears, with a list of possible things to do. While
    you are holding down the button, drag the cursor to the item in the menu and then
    let go. If you change your mind and don''t want to do any of the things, drag
    the cursor off the menu before letting go of the button.


    Cursor: The cursor is the little dozit (a highly technical term) on-screen that
    shows the mouse is pointing. The cursor changes shape as you move from one window
    to another to give you a hint of what''s going on in a window. The most common
    is a black X (when you''re not in any window), a little arrow (in windows with
    graphics), a little vertical hairline (in windows), and a leftward-pointing finger
    (in windows with links, such as Help systems and Web browsers).


    The second way to drag your technique is to outline some part of a window. If
    you want to select, press a mouse button, drag to the opposite corner of the area,
    and let go; at this point, a box on-screen shows the area you outlined.


    Click: To click something, move the cursor to the thing you want to click, and
    then release the mouse button. Unless otherwise directed, use the left-most mouse
    button. Clicking is also called selecting the item; it means you want to do something
    with the item you clicked.'
