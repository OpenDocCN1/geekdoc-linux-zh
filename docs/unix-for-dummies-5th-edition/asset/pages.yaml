    One thing about the UNIX community you''ve probably come to appreciate now that
    you can get everyone to agree on anything, except of course that UNIX is better
    than every other kind of system and anyone who thinks otherwise is so. So, surprisingly,
    a variety of incompatible windowing systems arise, each different from the other
