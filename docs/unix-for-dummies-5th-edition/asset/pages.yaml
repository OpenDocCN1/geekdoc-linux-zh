  md: '# Chapter 16: Across a Crowded Network


    # # Terminal type tedium


    If you use a full-screen program, such as the UNIX text editors emacs or vi or
    the mail programs, you have to set your terminal type. This problem would not
    exist in the first place, but it does, so you have to deal with it.


    1970s that became a de facto standard. You may also try xterm, the name of the
    standard X program that does emulation.


    The problem is that about a dozen different conventions for screen controls such
    as clear screen and move to position (x,y). The program you''re using on the remote
    host has to use your local terminal program does.


    +   - If you use a PC and an emulation program, the best answer is usually ANSI
    because PC programs use ANSI conventions. (ANSI stands for the American National
    Standards Institute. One of its several standards defines a set of terminal-control
    conventions that MS-DOS PCs—which otherwise wouldn''t know an ANSI standard if
    they tripped over one—invariably.)


    If the conventions are not the same, you get garbage (funky-looking characters)
    on screen when you try to use a full-screen program. In most cases, the remote
    system asks you which terminal type to use. The trick is knowing the right answer.
    Here are a few hints to help you find out:


    +   - In places where a great deal of IBM Equipment is used, the terminal type
    may be VT101, an early IBM terminal that was popular.


    +   - If you''re using the X Window system, or without Motif, the answer is more
    likely to be VT-100, a popular terminal from the


    The ANSI and VT-100 conventions are not much different from each other, so if
    you use one and your screen is only somewhat screwed up, try the other.


    The other computer asks what type of terminal you are giving, (If you''re using
    an X window, it''s xterm. Try VT-100, ANSI, or TTY if you''re using a dumb terminal
    or PC.)


    The normal way to leave telnet is to log out from the other computer:


    ```

    logout

    ```


    UNIX gives you the following message to tell the other computer has hung up the
    phone, so to speak:


    Bye Bye

    Connection closed by foreign host.'
