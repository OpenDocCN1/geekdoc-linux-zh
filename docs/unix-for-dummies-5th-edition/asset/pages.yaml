  md: '# 354 Part VI: The Part of Tens


    ```

    man unixcommand > filename

    ```


    Then edit the file with a text editor (see Chapter 10) and print it (see ... keep
    in mind that the online manual pages are generally identical to the printed manual
    pages in the dusty UNIX manuals on the shelf, except that the printed manual pages
    are typeset so they''re easier to read. Rather than printing the online page,
    looking up it in the paper manual is often better. (Bet you didn''t think we would
    ever tell you to do that!)


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_377_0.png)


    If you have a PostScript laser printer, you can often print the manual pages with
    nice fonts and italics and such rather than the typewriter-like version you see-screen.
    Ask your local guru for advice. On many versions of UNIX, this command works,
    using the -t for typeset option:


    ```

    man -t command | lpr

    ```


    # Finding the manual page you want


    If you use the man command, you have no good way to find out which manual pages
    are available. Sometimes, finding the one you want is difficult. Suppose that
    your type is like:


    ```

    man ln

    ```


    UNIX shows you this message:


    ```

    man: ln not found

    ```


    The ln command has no separate manual page. Instead, it shares a set of pages
    with cp and mv. You get information about ln by typing this line:


    ```

    man cp

    ```


    (Typical UNIX ease of use! If man doesn''t display anything about the command
    you want, try similar commands. BSD UNIX systems have an apropos command that
    suggests manual pages relevant to a particular topic, so you can type apropos
    ln to see what it has to say.


    In addition to manual pages commands, you can find lots of pages about other topics.
    You can type this line, for example:


    ```

    man ascii

    ```


    This command shows you a table of the ASCII-character codes for all the text files
    can contain. Although you probably aren''t interested in them, it does look impressively
    technoid.'
