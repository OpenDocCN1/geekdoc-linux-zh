  md: '# Chapter 15: Your Computer Is Not Alone


    If you want to talk to a number of other people, maybe thousands and thousands
    of them, you can use a system called Internet Relay Chat (IRC). We don''t have
    room to describe it in this book, but you can read about it at our Web site:


    ```

    http://net.gurus.com/irc

    ```


    If you don''t know how to find this Web site, see Chapter 18.


    # Reading the writing on the wall


    For the truly-maniacal among you, a program called wall blats what you type to
    every single terminal and window on your entire computer. You use it much write:


    > wall

    Free pizza in the upstairs conference room in 5 minutes!


    As with write, you tell wall that you''re finished by pressing Ctrl-D. Bear in
    your use of wall unless you want a bunch of new enemies. Note that wall affects
    only the people who use your computer, not everyone on your network (or on the
    whole Internet).


    # Getting On the Net


    If you have a UNIX or Linux system, you''d probably like to connect to the Internet.
    The good news is that it''s possible, the bad news is that it can be, ah, a little
    tricky.


    The easiest way to get on the Net is with a connection that looks, to your UNIX
    system, like you''re on an office LAN, because UNIX systems are generally all
    set for fors right out of the box. If you have a broadband connection, and the
    connection uses a setup scheme called DHCP, you win. Plug your UNIX box''s Ethernet
    adapter into the broadband box, and the connection starts right up. This happy
    state of affairs often occurs with cable modems.


    The other broadband connection is known as PPPoE and requires that you or your
    computer send a username and password to your ISP so it can be sure you''re actually
    the person plugging into its service and not one of the hundreds of other people
    who might live in your house. (What?) Nobody lives in your house but you? Well,
    how''s the phone company supposed to'
