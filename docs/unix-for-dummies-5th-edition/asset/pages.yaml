    # # Why Do We Ask Such Dumb Questions?


    "What is UNIX?" is UNIX, right? Not entirely. UNIX has been evolving feverishly
    for 30 years, like bacteria in a cesspool — only not as attractive. As a result,
    many different varieties of UNIX have existed along the way. Although they all
    share numerous characteristics, they differ (we bet this doesn''t surprise you)
    just enough that experienced users are tripped up by the differences between versions.


    # # A thousand UNIXes flower


    Indulge while we tell a historical parable. Imagine that UNIX is a kind of automobile
    rather than a computer system. In the early days, every UNIX system was distributed
    with a complete set of source code and development tools. If you had a car, this
    method would have been the same as every car''s being supplied with a complete
    set of blueprints, wrenches, arc-welders, and other car-building tools. Now that
    nearly all these cars were sold to engineering schools. You might expect that
    the students would get to work on their cars and that soon no two cars would be
    the same. That''s pretty much what happened to UNIX.'
