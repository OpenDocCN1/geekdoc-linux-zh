  md: '336 Part V: Help!


    # I/O error


    **Meaning:** I/O is computerese for input and output. Some physical problem has
    occurred during the reading or writing of information on a disk, tape, screen,
    or wherever your information lives.


    **Probable cause:** Broken disk drive.


    **Solution:** Tell your system administrator. You may have big trouble ahead.


    # Is a directory


    **Meaning:** You typed the name of a directory when UNIX wanted a filename.


    **Probable cause:** The command you typed is trying to do something to a directory
    rather than to a file. You can look at a directory using a text editor, but it
    looks like binary junk with filenames mixed in. You can''t change a directory
    by editing it.


    Note that emacs has a special mode (called direct mode) for "editing" directories.
    But emacs has its own special way to create, rename, and delete files, too.


    **Solution:** Make sure that you type a filename and not the name of a directory.


