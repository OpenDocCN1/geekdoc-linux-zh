  md: '# 220 Part IV: UNIX and the Net


    If you are the only person who ever uses your computer and you don''t have a network
    or a phone line (your computer is all alone in the world), skip this chapter —
    in fact, skip this entire part of the book.


    # You Don''t Need to Be In Who''s Who Know What''s What


    If you have an account on a UNIX machine, UNIX knows a great deal about you. (Not
    that we''re paranoid.) It knows your username, when you last logged on, which
    terminal you are using, and possibly additional facts, such as your real name
    and office extension, and it writes a short essay about what you are up to. (No,
    we''re not kidding. Read on.) Other people can see this information, including
    people who use the same computer as you, and (if your UNIX system is on a network)
    who use other computers.


    # Finding Out Who''s on Your Computer


    You can use three main commands to find out who''s using your machine: who, w,
    and finger. The simple way to use each one is just to type who.


    The typical response is something like this:


    ```

    John1 console Sep 3 14:57 (:0:0)

    John1 tty1 Sep 3 14:57 (:0:0)

    John1 tty2 Sep 3 14:57 (:0:0)

    John1 tty3 Sep 4 17:48 (:0:0)

    John1 tty4 Sep 18 10:48 (:0:0)

    John1 tty5 Sep 26 16:42 (:0:0)

    John1 tty7 Sep 9 14:10 (:0:0)

    ```


    You see the user, terminal and login time. User John logged in seven times because
    he has a bunch of terminal windows, each of which counts as a login session. The
    exact output from who varies from one version of UNIX to another, it always contains
    at least this much. You can also type who am, and UNIX prints just the line for
    the terminal (or terminal window) in which you typed the command. (A similar UNIX
    command, whoami, prints only the name of the user logged in at the prompt where
    you typed the command.)'
  merge: -1
