  md: '# 60 Part II: Some Basic Stuff


    from a whole crop of UNIX desktops. The first widely used UNIX desktop was the
    Common Desktop Environment, or CDE. CDE is the result of an unprecedented outbreak
    of cooperation among a number of UNIX vendors — including Hewlett-Packard, IBM,
    Novell, and SunSoft — the Open Software Foundation (the same people who wrote
    Motif, remember)?


    CDE desktops are not as simple as, of course, as their Windows and Mac counterparts.
    The Mac and Windows desktops are developed and sold only by Apple and Microsoft,
    respectively. Each company that sells with UNIX, on the other hand, has a slightly
    different version of CDE developed exclusively for its own version of UNIX. Unlike
    the Mac and Windows desktops, which are built into the operating system and appear
    whenever you start up your computer (it or not), CDE options are optional. You
    do not have to use CDE to use UNIX, and you (or, more, your system administrator)
    can decide whether to have CDE start when you log in.


    To enhance the confusion to acceptable UNIX-like levels, CDE is infinitely customizable
    by system administrators and UNIX hackers. You can make far-reaching changes to
    CDE by switching the CDE window manager from DTWM to FVWM, for example. You can
    tell CDE to launch various programs automatically when you log in. You can change
    the keyboard behaviors — and so on and so on and, ad nauseum.


    The good news is that the similarities among versions of CDE far outnumber the
    differences; after all, it''s supposed to be a common desktop environment. In
    practice, and discounting any bizarre modifications that an overzealous UNIX system
    administrator may have made, using one version of CDE is very like using another.


    The following sections give you some idea of how to use the Common Desktop Environment.
    In the interest of keeping things as simple as possible, we don''t worry about
    which version of CDE you''re using, and we figure that you''ll make whatever adjustments
    are necessary to account for the idiosyncrasies of your configuration.


    # Desktop, here we come!


    Bringing up the CDE is much like starting Motif, a subject we cover in the sidebar
    "How do I start Motif, anyway?" earlier in this chapter. If you''re lucky, your
    system administrator has set up your computer so that the CDE comes when you turn
    on your computer or log in. If not, you have refer to your local UNIX guru or
    system documentation to find out which command to run in which directory.'
