  md: '# 300 Part IV: UNIX and the Net


    # We''re from AOL, and we''re here to give you a really good Web server for free


    Hey, stop laughing. Believe it or not, it''s true. AOL has one of the world''s
    busiest Web sites, and it runs on an open source server called AOLserver, for
    free download at http://aolserver.com. It''s the only plausible alternative to
    AOL for busy Web sites.


    AOLserver is definitely intended for serious Web developers. The documentation
    is practica non-existent, in an arcane language called TCL (sort of PHP, not very),
    and you have enough about programming to download the source code, configure it
    setting up a


    connection to whatever database you''re using, building a running version on your
    system, install it, and start it up. We did it in an afternoon, but it took a
    fair amount of geeky skill.


    Once it is running, AOLserver is really fast. The best-known AOLserver site other
    than AOL is http://photo.net, which reports using a large database server running
    AOLserver on Linux and Solaris, and handles 6 million hits a day about 50GB, peaking
    at 520,000 hits an hour. That''s a lot of pictures.


    # Daemons Run Amok


    Providing most Internet services is a matter of installing, configuring, and running
    daemons. A daemon is simply a program you configure, start up, and then forget
    about. It runs in the background, where you can''t see it. The only time you have
    to deal with it is when something goes wrong with it (a rarely occurrence) or
    when you want to change how it behaves. We introduce daemons in Chapter 9, where
    we talk about the daemon that handles UNIX jobs.


    Some Internet resources, such as telnet and FTP, are standard parts of all UNIX
    distributions. Some UNIX (and Linux) distributions also include Internet servers
    for other resources, such as e-mail and news. These servers are included with
    your Web server. If neither your nor Web server package includes the servers you
    need, you have to find or purchase them separately. Fortunately, free versions
    abound on Web and FTP sites on the Internet.


    Here are a few tips about what you may need to help you get started:


    +   E-mail: If you want to send your e-mail, you need an SMTP server and a POP
    or IMAP server. SMTP (Simple Mail Transfer Protocol) defines the way computers
    pass a mail message to each other until it gets delivered to a user''s mailbox.
    POP (Post Office Protocol) and IMAP (Internet'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Chapter 20: Now Serving the Internet


    Mail Access Protocol) define how the user who gets the message retrieves from
    the mailbox. Some mail clients require POP, others such as Pine, require IMAP
    instead. The most popular, although not the best, SMTP server is called sendmail,
    and large books are devoted to its care and feeding.


    +   * SSH, ssh, and FTP: Use the telnet, ssh and FTP daemons in your UNIX or Linux
    distribution. Because security issues are always a major concern when you give
    unknown computers access to your computer, be vigilant against potential security
    breaches and be sure to install new versions if security holes are reported.


    Other resources you may consider providing the highly addictive Internet Relay
    Chat, equally addictive games as MUDs (Multi-User Shared Hallucinations), Gopher,
    and streaming video and audio. As with the basic services, you have to determine
    whether your OS or Web server includes the server software you need.


    # A Few Tips for Webmasters


    You''ve done it: You''ve gone ahead and decided to host your Web site. You registered
    a domain name, shelled out big bucks for computers and Internet connections, installed
    and configured server software, and even posted your first home page on the World
    Wide Web. Your job here is finished, right?


    Not on your life. Your job is just beginning. For surfers, the benefit of the
    Internet is it''s available 24 hours a day, seven days a week. For Webmasters,
    the round-the-clock nature of the Internet can become a nightmare. If your site
    is down for a few hours longer or if it goes down for short periods on a regular
    basis, you quickly lose your audience. You''re trying to run a business online,
    these types of outages can be disastrous.


    The Apache server is extremely reliable, which, along with being free, is a good
    reason to use it. Problems occur, however, and you have to know how to recover
    from them quickly. Make sure that your backup server is an accurate copy, of your
    main server so that you can cut it over in case your main server fails. You should
    also make that you can log on to your computer from a remote location so that
    you do server administration (troubleshooting, shutdowns, restarts) without having
    to be in the same room with your computer. Your vacation in Fiji will be ruined
    if the server running your catalog sales company quits working and you have to
    fly home to deal with it.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# 302 Part IV: UNIX and the Net


    Often, problems with a Web site occur because of gremlins running around in your
    Web pages. HTML, the language you use to define your Web pages, is extremely literal
    and unforgiving. Make sure that you have a good HTML reference and to test your
    pages before casting them on the waters of the Web. Mozilla has a graphical Web
    page program Composer, which has an HTML editor that novice Web page designers
    find easy to use. We recommend you use a text editor with at least syntax highlighting
    to make your coding easier (see Chapter 10 for some suggestions).


    Web surfers think of Web sites as places rather than pages. The only way you can
    keep people coming back to your place on the Web is to change and update it. Really
    big sites employ big teams of writers, designers, and developers who do nothing
    other than work on the site. Some sites are updated two or three times a week
    is a big job. When you''re planning your site, think how often you need to update
    it. Design your site to make updating as quick and painless as possible.


    Our last tip is perhaps our most important: Whatever you do, keep it simple. Updating
    and maintaining your site''s content is a big job. If you''re going alone, have
    to become a graphics designer, writer, software developer, and system administrator
    all rolled into one — not an easy task for anyone. If you run into trouble, ask
    for help. Many people in situations similar to yours are only too happy to share
    with you their horror stories and hard-earned wisdom. A good place to look for
    help is Usenet, the Net''s distributed bulletin-board, where you can find and
    communicate with UNIX Webmasters in newsgroups such as comp.infosystems.www.servers.unix.
    (See net.guru.com/usenet for more information on Usenet, and Chapter 26 for a
    listing of UNIX-related newsgroups.)'
