  md: '# Chapter 22: The Case of the Missing Files 323


    Then use the ls command to check the contents of trash. If something is in that
    directory you want, move it back to the current directory by using this command:


    ```

    mv trash/these.are.still.good

    ```


    (The dot at end means to put the file back in the current directory.) After you''re
    sure that nothing other than trash is in trash, you can use rm with the -r option:


    ```

    rm -r trash

    ```


    This line tells rm to get rid of trash and everything in it.


    # Don''t write on that!


    Another thing you can do to avoid damage to important files is to make them read-only.
    When you make files read-only, you prevent cp and text editors from changing them.
    You can still delete them, although rm, mv, and in ask before doing so. The chmod
    command changes the mode of a file (as explained in Chapter 5). Here''s how to
    use chmod to make a file read-only:


    ```

    chmod -w crucial-file

    ```


    The -w means not writable. To make changes to the file later, do another chmod
    use +w instead. (This stuff doesn''t invoke inspired command syntax, but the old
    syntax was ever worse and used اغلب digits.) After a file is not writable, editors
    can''t change it. The vi program displays a name on-screen that the file is read-only.
    If you want to delete it, rm, mv, and in ask you in a uniquely user-friendly way
    whether that''s really what you had in mind. Suppose you type the following line
    and crucial-file is a read-only file:


    ```

    crucial-file

    ```


    UNIX responds with this line:


    ```

    crucial-file: 444 no ?

    ```


    The number is not 444; it may be 440 or 400 (depending on whether your system
    administrator has set up so that people can normally see the contents of other
    people''s files). As with rm -i, you press the y key if you want to delete the
    file, or anything else to say that you don''t want to delete this valuable data.'
