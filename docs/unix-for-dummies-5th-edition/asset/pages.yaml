  md: '# Assorted Files


    Computers are good at putting stuff in order. Indeed, at one time a third of all
    time was spent sorting. UNIX has a quite capable sorting program, cleverly named
    sort, that you may remember mentioning briefly in Chapter 7. Here, we talk about
    other ways to use the program.


    The sort commands the lines of a file into alphabetical order. The sort point
    of view, is anything that ends with a carriage return (that is, you pressed Enter).
    If you have a file listing, with one item per line, this command alphabetizes
    the list.


    The easiest way to use sort is to sort one file into another. In other words,
    you tell sort to place the sorted version of the original file in another file.
    This way, you don''t risk screwing up the original file if the sort runs amiss.
    To sort your myfile into a second file named sortedfile, type this command:


    ```

    sort myfile > sortedfile

    ```


    Although you can sort a file back into itself, you can''t do it in the obvious
    way. The following line, for example, doesn''t work:


    ```

    sort myfile > myfile

    ```


    The problem with this command is that the UNIX clears out my myfile before the
    sort starts (with the result, that sort tries to sort something, finding that
    myfile is empty). You can use the -o (for output) option to tell sort where to
    put the results, like this:


    ```

    sort -o myfile

    ```


    This command works because sort doesn''t start to write to the output file until
    it has read all input.


    Normally, sort orders its results based on a strict comparison of the internal
    ASCII codes the computer uses for storing text. The good news is that this command
    sorts letters and digits in the correct way, although some peculiarities exist:
    Normally, uppercase letters are sorted before lowercase letters, so ZEBRA precedes
    aardark. You can use the -f (for fold cases together) option to sort regardless
    of uppercase and lowercase letters:


    ```

    sort -f animals -o sortedanimals

    ```


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_200_0.png)'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# 178 Part III: Getting Things Done


    Although we could use the > symbol in this example, with the sort command using
    the -o option is safer. You can use several options also to tell it to sort:


    +   - b Ignore spaces at the beginning of the line.

    - d Use dictionary order and ignore any punctuation. You usually use this option
    with -f.

    - n Sort based on the number at the beginning of the line. With this option, 99
    precedes 100 rather than follows it, as it does in usual alphabetical order. (Yes,
    the normal thing the counter is pretty dumb. Are you surprised?)

    - r Sort in the reverse order of whatever would have been done before. You can
    combine this option with any of the others.


    We find sorting to be particularly useful in files in which every line starts
    with a date, as shown in these examples:


    | 0505 | Tonia''s birthday |

    | 1204 | Meg''s birthday |

    | 1102 | Zac''s birthday |

    | 0318 | Sarah''s birthday |


    We could type sort -n to sort this file by date. Notice that we wrote May 5 as
    0505 (not 55, for example) so that a numeric sort works.


    You can do more complex sorting and treat every line as a sequence of "fields"
    uses sort to decide the final sorted order. If you really need to do complex sorting,
    talk to someone who knows about sorting, or you''re feeling adventurous, type
    man sort.


    # Time Is Money — Steal Some Today!


    All UNIX systems have internal clocks. You can ask the system what the date and
    time are with the date command:


    ```

    date

    ```


    UNIX responds with this information:


    ```

    Dec 4 15:43:50 EST 2003

    ```


    Many options enable you to tailor the date format any way you want. Don''t waste
    your time. UNIX has an idea about the time zone too, and even daylight savings
    time automatically.'
