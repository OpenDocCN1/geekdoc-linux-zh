  md: '# Chapter 17: Automating Your Office Gossip 255


    If you want a good mail analogy, think of this as like the mailbox where letters
    to you are dropped off. (To continue the analogy, the spam messages you invariably
    get sort of like, only they''re not bills for anything you bought.)


    You have an account on an inbound mail server with a username and password, which
    is used to keep anyone else from reading your mail and you from reading anyone''s
    mail. Most often, the username is your username — the thing that goes on the left
    side of your @ e-mail address. To set up an inbound mail server, you need this
    name and password.


    When you want to send mail, you need to use another mail server. Sometimes, the
    inbound and outbound mail servers are the same; sometimes, they''re different.
    It doesn''t matter! You just go into your mail program setup (we show you how
    in this chapter for some of the common ones) and select an outbound mail server.
    The most common way to do this is Simple Mail Transfer Protocol (SMTP). This can
    also be called an SMTP server.


    # Mail hound


    Another UNIX mail program worth mentioning is the namely mutt. Michael Elkins,
    physics undergrad at California''s Harvey Mudd College, wrote the original version
    of mutt in 1995 when he finally got fed with the limitations of em. (mutt''s motto
    for the ages: "All mail clients suck. This one just sucks")


    conversations with a number of different correspondents or if you subscribe to
    especially active mailing lists.


    All in all, this mutt can hunt. It lets you attach files to e-messages using MIME.
    It sorts PGP (pretty good privacy) for keeping your love letters secret. It automatically
    opens a Web page in your browser when you don''t know what that means, try a URL
    in a mail message (ch 19). It has tons of options. And in the best UNIX tradition,
    it''s free.


    Although written from scratch, mutt was based on em, with various ideas from Pine
    and other mut clients to create a unique hybrid, or mognel—in short, a mutt. (And
    you thought that Mail Transfer Terminal?) Unlike elim, which is a text-based,
    one-message-at-a-time affair, mutt can handle threads (fancy that!) and messages.
    Threads groups by by subjects so that you can tell which messages are responses
    to which. Threading is particularly useful if you carry on lengthy e-mail


    You can download mutt from FTP sites all over the Internet, including the FTP
    archive at the computer science department of Michael Elkins'' alma mater (it''s
    at ftp://ftp.hmc.pub/me/). It also comes along with various versions of Linux,
    such as Red Linux and Caldera OpenLinux.'
