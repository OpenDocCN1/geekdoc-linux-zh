  md: '# Chapter 26


    # Ten Times More Information

    Than You Want about UNIX


    In This Chapter


    +   - Using the man command for online help

    - What''s on a manual page

    - Other books about UNIX

    - UNIX information on the Internet


    We wish that this book contained every single thing you may want to know about
    UNIX. We considered writing the book that way, but our publisher frowned on printing
    a book with 25,000 pages. (Books like that are hard to bind, not to mention hard
    to pick off the floor.) So, we tried to include the information that new UNIX
    users really need to know. If you read this entire book, however, you''ll be on
    your way to becoming a seasoned UNIX veteran. For additional seasoning, this chapter
    points you in the direction of more advanced facts about UNIX.


    # Let''s Hear It from the man


    You thought that UNIX was completely unhelpful. For the most part, you''re absolutely
    right. A standard UNIX command called man (for manual), how-ever, can give you
    online help.


    Sound good? Yes and no. The information is there, all right, but it''s written
    in a rather needy style and can be difficult to decipher. Each part of the online
    manual is written, of course, on the assumption that you have read all the other
    parts and know what all the commands are called. The man command is definitely
    worth knowing about, though, when you can''t remember the options for a command
    or what to type where on the command line after the command name.'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# 352 Part VI: The Part of Tens


    The man''s online manual contains manual pages for every UNIX command, and other
    pages about internal functions that programmers use, formats for various system
    file types, descriptions of the hardware that you can attach to your UNIX system,
    and other odds and ends. When you type the command, you indicate which page or
    pages you want.


    All manual pages have a standard format. Listing 26-1 shows parts of the manual
    page for the chmod command. (If you get the idea that chmod has a lot of arcane
    options that we didn''t mention in Chapter 5, you''re right.)


    # Listing 26-1: Part of the man Page for the chmod Command


    | CHMOD(1) | FreeBSD General Commands Manual | CHMOD(1) |

    |---|---|--|

    | NAME | chmod - change file modes | |

    | SYNOPSIS | chmod [-f] [-R] [-H] [-L] | -P] mode file ... | |


    DESCRIPTION The chmod utility modifies the file bits of the listed files as specified
    by the mode operand.


    The options are as follows:


    +   -f Do not display a message if chmod could not modify the file, nor the exit
    status to reflect such failures.

    -H If the -R option is specified, symbolic links on the command line are followed.
    Symbolic links encountered in the tree traversal are not followed by default.

    -h If the file is a symbolic link, change the mode of the link rather than the
    file the link points to.

    -L If the -R option is specified, all symbolic links are followed.

    -P If the -R option is specified, no symbolic links are followed. This is the
    default.


    The parts of the manual page include


    +   - The title (the first line): It includes the name and page number of the
    manual page on the left and right ends of the line. Centered on the line may be
    the name of the system the command is part of. In Listing 26-1, the chmod command
    is one of the standard commands that comes with FreeBSD, as it does with every
    version of UNIX.

    - NAME: The one-line name of the manual. The name is usually the command or commands
    the page talks about, as well as a brief description.'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# Chapter 26: Ten Times More Information Than You Want about UNIX 353


    +   - SYNOPSIS: What you type when you give the command, with a terse and cryptic
    example of every option available. This part often makes no sense until you read
    the description that. Sometimes it still makes no sense.


    +   - DESCRIPTION: A few paragraphs about the command. For commands with a large
    number of options, the description can run for a few pages. A list of options
    usually is included, with an explanation of every one. Sometimes you see examples,
    although not often enough.


    +   - SEE ALSO: Lists names of manual pages, if any.


    +   - WARNINGS and BUGS: May list a command''s known bugs or common problems.
    Then again, it may not.


    +   - FILES: A list of the commands this uses. The pine and mail commands, for
    example use your Mail directory, the central list of mailboxes, and other files.
    (Your system administrator usually sets up these files — they are rarely something
    you want to fool with yourself.) The manual pages for pine and mail mention these
    files.


    # Reading manual pages


    To see a manual page, type this line:


    ```

    man unixcommand

    ```


    Except, of course, you substitute for unixcommand the name of the UNIX command
    you''re interested in. In most versions of man present the manual page at a screen
    at time. Other versions just wipe the page by at maximum speed, assuming that
    you can read 150,000 words per minute. If that happens (and you can''t read that
    fast), you can use the more command to display the manual page a screen at time
    by typing this command:


    ```

    man unixcommand | more

    ```


    # Printing manual pages


    You can also print the manual pages for later perusal. To print the manual pages,
    type this line:


    ```

    man unixcommand | 1pr

    ```


    Remember to use 1pr, if that is the command you use to print. A better technique
    may be to put the manual pages in a first file, remember the information you don''t,
    and print the result. You can type the following line, for example (remember to
    substitute for filename the name of the file you want in):'
  merge: -1
