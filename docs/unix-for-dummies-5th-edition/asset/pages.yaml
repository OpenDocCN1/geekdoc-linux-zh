  md: '# Chapter 17: Automating Your Office Gossip 253


    # Creating your own address book


    If you use Pine to send messages to Internet addresses, it can certainly be annoying
    to type long, complicated Internet addresses. That''s a good reason to let Pine
    do it for you — set up an address book.


    When you press a key at the Pine menu, you switch to address book mode. (It even
    ADDRESS BOOK at the top of the screen.) If you already entered some addresses,
    Pine lists them.


    When you finish fooling with your address book, press the m key to return to Pine''s
    main menu.


    To create an entry in your address book when the program is in address mode, follow
    these steps:


    +   1. Press the key.

    2. Type the person''s last name, comma, and then the first name, and then press
    Enter.

    3. Type the nickname (make it short but easy to remember).

    4. Enter the e-mail address just as you do when you add a message.


    Pine stores the entry in your address book and lists it over the address screen.


    If you make a mistake, you can edit an entry. Just highlight it on the list of
    addresses, and press the e key to edit it.


    You can also create an address book directory from a message. If you''re looking
    at a message from someone you want to save, just press the t key. Pine prompts
    you for the person''s full name (it may even suggest it, if it''s part of the
    message header), nickname, and e-mail address (Pine suggests the sender of the
    current message). To use an address book entry, just type the nickname on the
    To or Cc: line of message.


    # Saving messages


    Pine enables you to create lots of folders in which to put your messages so that
    you can save them in an organized manner. To save a message in a folder, press
    the s key when you''re looking at it or when it''s highlighted on the list of
    messages.


    When you save a message to a folder that doesn''t exist, Pine asks whether you
    want to create it. Press the y key to do so. When you move a message to a folder,
    Pine automatically deletes it from your inbox. Very tidy.'
