  md: '# Chapter 3


    # A Few Lines on Linux


    In This Chapter


    +   - What is Linux?

    - Why should you care?


    Linux is the hottest thing to arrive in UNIX-land in years: a wildly popular,
    completely free version of UNIX. It is (quite deliberately) similar to other versions
    of UNIX: for the most part, then, everything in this book applies to other versions
    of UNIX also applies to Linux.


    Many ISPs use Linux on their servers because it''s fast, flexible, and free. Even
    if you don''t use Linux locally, if you have a Web site hosted at your ISP, you
    may well find that a Linux box is serving your Web pages.


    # Out of the Frozen North


    1992, a guy in Finland named Linus Torvalds took a then-popular, small, educational
    version of UNIX called Unix, decided it wasn''t what he wanted, and proceeded
    to rewrite and extend it so that it was more to his taste. Lots of enthusiastic
    programmers started projects like that, but to everyone''s astonishment, Linux
    finally finished it. By mid-1993, his system had long since left its Unix roots
    and was becoming a genuinely usable version of UNIX. Linux''s system was picked
    up with great enthusiasm by programmers, and later by users, all over the Internet.
    It like craze, to become the fastest-growing part of UNIX-dom.


    Linux is popular for three reasons:


    +   - It works well, even on a small, cheap PC. A 386 PC with 4MB of random-access
    memory (RAM) and a 40MB hard drive can run Linux — barely. (You can find computers
    like that for $5 at the thrift store these days.) On a top-of-the-line Pentium
    PC, its performance approaches that of a full-blown traditional UNIX workstation.'
