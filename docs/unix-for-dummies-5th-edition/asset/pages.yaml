  md: '# Chapter 4: Opening Windows on UNIX


    # 71


    # A moving target


    The descriptions of KDE and GNOME in this book are based mostly on KDE version
    3.1 and GNOME version 2.2. Unlike C, KDE and GNOME are being actively developed,
    changed, updated, and revised. You might get a few surprises with newer or older
    versions, or even just versions that are configured differently by whoever compiled
    them. Any major release of these environments should work fine, though, so don''t
    worry too much.


    # You Mean the Little Guys with the Hats?


    Another desktop environment you might see is GNOME. It''s supposed to be pronounced
    with a hard "g" — "guh-GNOME." GNOME is started by running a program called gnome-session.
    GNOME comes with a large variety of themes and styles. In fact, you can configure
    GNOME to look like KDE for really people who are expecting it to behave exactly
    the same, too.


    GNOME is yet another complete desktop environment — icons, little pointy things,
    menus, the whole nine yards. If your system comes with GNOME, but not with KDE,
    that is fine. GNOME does all the same kinds of things. It''s a matter of personal
    preference, or what happens to be installed.


    In Figure 4-13, you see a really typical GNOME desktop. The bar at the bottom
    of the screen holds buttons for common activities, of which brings up menus. The
    button that looks like a little computer monitor with a >_ in it opens a terminal
    window, which is handy if you want to take a break from the stressful world of
    mice and graphics and just take a little click. Click the foot icon at the lower-left
    to open the main menu. This menu is where you find a lot of cool tools, such as
    the GNOME Control Center.


    # Themes


    Depending on your configuration, GNOME can look confusingly similar to other desktop
    environments. It won''t be the same, but it may be comfortable, or it may be confusing.
    You can customize it at a great deal. How? Start the GNOME Control Center application,
    and double-click the Theme icon. Around the most is fun to be playing around with
    the Details button, which lets you mix and match parts of different themes. You
    can also, of course, come up with something totally unlike any other environment,
    and that may be the most fun you can have.'
