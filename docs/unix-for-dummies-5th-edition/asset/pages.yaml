    # Terminal Options


    About 14 million different settings are associated with each terminal or pseudo-terminal
    attached to a UNIX system, any of which you can change with the stty command.
    More than 13 zillion of the 14 million shouldn''t be messed with, or your terminal
    vanishes in a puff of smoke (as far as UNIX is concerned), and you have to log
    in all over again or even get your system administrator to do it. You can, however,
    safely change a few things.


    All the special characters that control the terminal, such as Backspace and Ctrl-Z,
    are changeable. People often find that they prefer other characters than the defaults,
    for several reasons: they became accustomed to something else on another system,
    the placement of the keys on the keyboard makes more natural than others, or their
    terminal emulator is dumb about switching Backspace and Delete. The special characters
    that control the keyboard are described in Table 7-1.


