  md: '# The Magic of Job Control


    Quite awhile (in 1979), people (actually, our pal Bill) noticed that, many times,
    you run a program, realize that it will take longer than you thought, and decide
    that you wanted to switch to a background program. At the time, the only choices
    you had to wait for or kill the program and start it over by using an & to run
    it in the background. Job control enables you to change your mind after you start
    a program.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_230_0.png)


    The job-control business requires some cooperation from your shell. In SVR4, all
    three shells handle job control. In some earlier versions of UNIX, only the C
    shell, sometimes the C shell and Korn shell, handled job control.


    Suppose that you start a big, slow program by typing this line:


    ```

    bigprogram somefile another

    ```


    The program runs in the foreground because you didn''t use an ampersand (&). Then
    you realize that you have better things to do than wait, so you press Ctrl+Z The
    shell responds with the message Stopped. (If it doesn''t, you have a job-control
    shell. Sorry. Skip the rest of this chapter.) At this point, your program is in
    limbo. You can do three things to it:


    +   - Continue in the foreground as though nothing happened, typing fg (which
    stands for foreground)

    - Stick in the background by typing bg (for background), which makes the program
    act as though you started it with an & in the first place.

    - Kill it if you decide that you shouldn''t run it. This method is slightly more
    complicated. Details follow.


    # Take this job and . . .


    UNIX calls every background program you start a job. A job can consist of several
    processes (which, as you know, are running programs). To print a list of all your
    files in all your directories with titles, for example, you can type this line:


    ```

    ls -LR | pr -h "My files" | lp &

    ```


    This command lists the files with ls, adds titles with pr, and sends them to the
    printer with lp, all in the background. Although you use two different programs
    and three separate processes, UNIX considers one job because each of the three
    programs needs the other two in order to get done work.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 208 Part III: Getting Things Done


    Every regular command (those you without an %) is also a job, although until you
    use Ctrl-Z to stop it, that''s not an interesting piece of information. You can
    use the jobs command to see which jobs are active. Here''s a typical response
    to the jobs command:


    ```

    [1] - Stopped (signal) elm

    [2] + Stopped vi somefile

    ```


    This listing shows two jobs, both of which have been stopped with Ctrl-Z. One
    is a copy of elm, the mail-reading program; the other job is the vi editor. (The
    difference between Stopped (signal) and plain Stopped is interesting to programmers,
    so we don''t discuss much.) The current job — the one preceded by a plus sign
    (+); it''s the most recently started or stopped. All the rest are background jobs,
    and they can be stopped or running.


    # stick it in the background


    You can tell any job to continue in the background using the bg command. A plan
    bg continues to uniq the current job (the one marked by a plus sign) in the background.
    To tell uniq to continue some other job, you must identify the job. You can join
    it by typing a percent (%) followed by the job number or enough of the command
    to uniquely identify it. In this case, the elm job is called %1, %, or % because
    no other job uses a command starting with an e. As a special case, % refers to
    the current job. Although other % combinations are available, no one uses them.
    Typing %e, for example, continues the elm job in the background.


    # run it in a the foreground


    To put a process in the foreground, where it runs normally and can use the terminal,
    you use the fg command. Continuing a job in the foreground is so common that you
    use it as a shortcut: Typing %1 or %e, for example, continues the elm job in the
    foreground. Typing %v or %e, however, continues the vi editor in the foreground.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_231_0.png)


    # Do windows and job control mix?


    If you use a GUI system like KDE or GNOME, you can run jobs in lists of windows.
    Is there any need for Ctrl+2? nonsense by and large, the answer is no; popping
    up three windows to run three programs is much easier than flipping the programs
    around in one. (Chapter 4 shows how to pop up new windows.)


    Even if you use a GUI, it doesn''t hurt to learn about job control, it''s not
    hard to use, and someday you may be stuck in a single window (when you use telnet
    to access another system) or be banished to a regular non-X terminal. You will
    appreciate what job control has to offer.'
