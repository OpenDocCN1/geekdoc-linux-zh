    (Folder: INBOX opened with 0 messages)


    | Help | MailNotes |

    |---|---|

    | OTHER CMD [ListFolders] | MainCmd KBBlock |


    If you are using UNIX by way of communications program, watch out for terminal
    you are emulating. Pine works fine if your program emulates a VT100 terminal,
    but not so well if it emulates an ANSI terminal. You can usually change which
