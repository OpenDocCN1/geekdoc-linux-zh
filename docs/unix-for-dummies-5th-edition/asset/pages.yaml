- img_proc: true
  md: 'Probable cause: You are trying to change, move, or delete a file you don''t
    own.


    Example: You type this line:


    ```

    rm /usr/bill/resignation.letter

    ```


    But are not Bill. Because you don''t have permission to delete this file, UNIX
    doesn''t let you.


    Solution: Use the ls -l command to find out who owns the file and what its permissions
    are (refer to Chapter 5 for information about permissions). If you think that
    you ought to be able to mess with the file, make your copy of it or talk to the
    owner of the file or your system administrator.


    # RE error


    Meaning: You are using the grep program, and it doesn''t understand what you are
    searching for. (RE stands for regular expression, the name for the patterns that
    grep uses.)


    Probable cause: You probably have to use backslashes in front of a character that
    is a wildcard in grep.


    Example: You type this line:


    ```

    grep ''x'' myfile

    ```


    Solution: Put a backslash in front of any character that has a special wildcard
    meaning in grep (grep wildcards include periods, asterisks, square brackets, dollar
    signs, and carets). If you are searching for text that contains special characters,
    put single quotation marks around the text to match.


    # Read-only file system


    Meaning: You are trying to change a file that UNIX is not allowed to change.


    Probable cause: Some disks, particularly NFS remote disks and CD-ROMs, are marked
    read-only so that you can''t create, delete, or change on them. It doesn''t matter
    what the permissions are for the individual files: The entire file system can''t
    be changed.


    Solution: Talk to your system administrator. Alternatively, make a copy of the
    file you want to change and change the copy.'
  merge: -1
