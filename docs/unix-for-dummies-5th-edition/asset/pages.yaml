  md: '# 242 Part IV: UNIX and the Net


    Enter Andrew Tridgill, a UNIX hacker from Canberra, Australia, with a firm grasp
    of the obvious. He wrote a suite of programs collectively named Samba, which turns
    almost any version of UNIX you care to mention into an SMB server. Samba lets
    UNIX and Windows computers be snazzy, friendly stuff, such as access to another''s
    files and share printers. In typical UNIX, dozens of programmers from around the
    world have contributed to Samba over the years, and it''s distributed for free
    under the infamous GNU software guidelines.


    Samba is a `request-response` protocol, in which a client makes requests of the
    server and the server responds. Because nothing is as easy as it seems when computers
    are concerned, a client has to make several requests of a server before anything
    useful happens. First, the client has to ask the server of SMB which *dialect*
    of SMB wants to speak (yap, dialect, just in real life). The client has to go
    down bended knee and politely request access to the server by giving the server
    a username and password. If the server grants the client, the client can start
    partitioning the server with a series of requests — for example, to locate, open,
    and print a particular file.


    The latest version of Samba is 2.2.8 or higher. Nearly all current versions of
    UNIX come with Samba installed, or you can download it from one of the Samba Web
    sites such as `http://usr.samba.org`. (If you don''t know what these curious strings
    of seeming gobbledygook mean, read Chapter 19.)


    # Listening to Windows


    Samba lets a UNIX system provide file and printer service to Windows machines.
    Occasionally you need to go the other way, either to copy a bunch of files or
    to use a Windows disk.


    Samba includes a program called `smclient` that works sort of like FTP (Chapter
    18) to copy files to or from a Windows shared folder. Some UNIX systems also have
    an SMB mounter that can mount remote Windows folders on the local machine just
    like remote NFS disks. Check with your system if you need to set this up.'
