    # # X marks the window


    Universities also had a bunch of window system projects. One of the more successful
    was the X project at MIT (alleged to be a successor to the W Window project at
    Stanford — as far as we know, no one created a W Window project). The X Window
    system had many virtues, not the least of which were that it worked adequately
    and it was available for free to anyone who wanted it. So X became the window
