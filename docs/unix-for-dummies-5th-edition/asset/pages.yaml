  md: '# Chapter 23: Some Programs Just Won''t Die


    For Ctrl+Z to work, your shell must do some of the work. Old versions of the Bourne
    shell aren''t up to it and ignore Ctrl+Z. The C, BASH, and Korn shells are Ctrl+Z-aware.


    # Dirty Deeds, Done Dirt Cheap


    No more Mister Nice Guy: It''s time for merciless slaughter. If you were successful
    in the preceding section at putting the process to sleep with Ctrl+Z, go ahead
    and kill it in this section.


    All the following techniques require that you have a terminal or window in which
    you can type some commands to the dirty deeds. Ctrl+Z didn''t work to put the
    process to sleep, you may not have a shell prompt at which to type the requisite
    commands. Here are other places you can use to type the commands to kill the process:


    +   - If you''re running Windows, any window other than the one with the stuck
    program works.

    - Otherwise, you may have to go to another computer on the network and use telnet
    or ssh to get into your computer.

    - If no other window is available and you have no other way into the machine,
    you''re out of luck and probably have to reboot. Before you reboot, check with
    your system administrator, who may know some other tricks.


    This simple two-step procedure murders a rogue process:


    +   1. Find the rogue process''s true name.

    2. Utter the name in an appropriate spell to murder it.


    The true name of a process is its PID, one of the things ps reports. First do
    a ps command to find the PID of your victim. To find the PID, follow steps:


    +   1. If you pressed Ctrl+Z to put the rogue process to sleep and you''re using
    the same terminal to kill it utterly, type a plain ps.

    - Otherwise, you may have to use a different terminal to kill the process because
    the amok process has taken over your own terminal.'
