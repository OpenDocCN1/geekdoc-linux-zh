  md: '# Part III: Getting Things Done


    # The easier way


    Typing this long string of letters and symbols every time you want to run the
    program is a pain. A better way is to put a link to your bin directory so that
    you can run it directly. (Links are described in Chapter 8.) Use the in command
    to create a link, which makes the file appear in your bin directory, too.


    Try the direct approach. Move to your home directory and create a line:


    ```

    cd

    l -tracy/bin/pornotopia bin/pornotopia

    ```


    With any luck, this method works, creating a link from Tracy''s file to your directory.
    If you take a hash or rehash, you''re all set.


    The in command doesn''t work, however, if you and Tracy have files on different
    drives. (All this stuff is explained in Chapters 8 and 16.) In this case, you
    may get this unthinkable message:


    ```

    ln: different file system

    ```


    If you get this message, it''s time for Plan B. UNIX systems have symbolic links
    that work across hard drives (these links are also explained in Chapter 8). Try
    this line:


    ```

    ln -s ~tracy/bin/pornotopia bin/pornotopia .

    ```


    If it works, it makes a symbolic link to the file you want. You''re all set: The
    link to pornotopia refers to Tracy''s version. After a hash or rehash, you''re
    ready to go.


    # Using an alias


    If you named pornotopia, you probably would want an alias, too. Fortunately, the
    BASH, Korn, and C shells give you the ability to invent a short name for a long
    command. (Bourne shell users, you''re out of luck. Skip to the next section.)


    For Plan C. In the BASH and Korn shells, type


    ```

    alias dobudget=''/usr/tr/bin/pornotopia

    ```


    This line tells you that, when you type dobudget, you really want to run Tracy''s
    program. Heh, heh. To avoid inadvertent use of, the C shell''s alias command works
    in almost the same way, but it is punctuated slightly differently:'
