  md: '# # Chapter 1


    # # Log Me In, UNIX!


    In This Chapter


    +   - Turning your computer on and getting its attention

    - Persuading your computer to let you use it

    - Using usernames, passwords, and all that that

    - Logging out when you finish


    If you read the introduction to this book, you know that we make some Foolish
    Assumptions about you, the reader. Among other things, we foolish assume that
    someone has installed and set up UNIX for you so that all you have to do is turn
    your computer on and tell UNIX you''re, or that a computer running UNIX is somewhere
    on the network that you have access to.


    If you don''t have UNIX already set up on a computer, the best thing you can do
    for yourself is find a local UNIX guru or system administrator who is willing
    to get you what you''re doing, installing and setting up UNIX can be painful,
    frustrating, and time-consuming. We recommend that you find something more enjoyable
    to do, such as cleaning out the grease trap under your kitchen sink or performing
    urgent surgery on yourself. (You can learn how to administer a UNIX system with
    patience and perseverance, but explaining how is way beyond the scope of this
    book each version of UNIX has its own procedures.)


    # # Turning Your Computer On and Off


    If you think that turning your computer on and off is easy, you may be wrong.
    Because UNIX runs on so many almost-but-not-quite compatible computers — all of
    which work somewhat differently — you first must figure out which kind of UNIX
    computer you have before you can turn it on.'
  merge: -1
