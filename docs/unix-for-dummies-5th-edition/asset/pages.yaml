    # # Cracking the Shell


    Now that you have figured out which variety of UNIX you have, you must figure
    out one other vital consideration: which shell you''re using. You may say, "I
    don''t want to use any shell; I just want to get some work done," but the shell
    is the only way to get where you want to be.


    The guts of UNIX are buried in the bowels of the computer. The guts don''t deign
    to deal with insignificant details about what users want to do. That nasty business
    is delegated to a category of programs known shells. A shell is a program that
    waits for you to type a command and executes it. From the UNIX point of view,
    a shell is nothing special, other than the first UNIX run after you log in. Because
    you can ignore any old program to run when you log in, any fool can write a shell
    — even maybe, by a dozen UNIX shells are floating around, all incompatible with
    each other (you probably guessed that).


    Fortunately, all the popular shells fall into two groups: the Bourne (or Korn
    or BASH) and the C shell. If you can figure out which of the two your shell is
    in, you can get some work done. (You''re getting close!)


    You can easily tell which shell you''re using. If UNIX displays a $ after you
    log in, you have a Bourne-style shell; if UNIX displays a % you have the C shell.
    Traditionally, System V systems and BSD systems use the C shell. These days, however,
    all versions of UNIX come with both shells, whichever your system administrator
    likes better. Preferences in command languages are similar to preferences in underwear:
    People like what they like, so so you get what you get, although these days most
    of the people we know like BASH, a souped-up Bourne-style shell.'
