    | KWrite | Word processor — part of KOffice |

    | KSpread | Spreadsheet — part of KOffice |

    | KBear | Graphical FTP client |

    | KBiff | E-mail notifier |


    The best part of these applications — and you hear this a lot about software for
    X — that they''re free. They aren''t 100 percent compatible with the big-name
    office software you might see, but they''re pretty good, and you can''t beat the
    price. Conqueror is a combination file manager and Web browser, which works a
    little like a program Explorer you might see elsewhere.


    Of course, you don''t have to use these programs. You can use whatever you want
    KDE. These programs are the ones that fit in best with the rest of KDE, using
    the same kinds of buttons and other window controls. Give them a try. A of people
    find these programs do their jobs just fine. Conqueror is particularly impressive;
    a remarkably good Web browser, which is why Apple used it as the basis for its
    new Safari browser for the Macintosh. See Chapter 17 for details about Kmail,
    the KDE e-mail program.


    Don''t want to be productive? KDE comes with a lot of games. Every distribution
    has a different set of games, but there are enough of them to keep you entertained
    for a long time. If you try KPatience, don''t forget to look in the Game Type
    submenu of the Settings menu — it plays more than one game, and you may like the
    others.


    # Why biff?


    > According to the Jargon File, biff is:

    To notify someone of incoming mail. From the BSD utility biff(1), which was in
    turn named after a friendly dog used to chase frisbees in the halls of UCB while
    4.2BSD was in development. There was a legend that it had a habit of barking whenever
    the mailman came, but the author of biff says this is not true.

    nWe don''t care whether Biff actually barked at the mailman; programs that alert
    you to incoming mail are still called biff.'
