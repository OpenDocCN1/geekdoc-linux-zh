    # CDE: A Desktop for All Seasons


    If you use a Macintosh or one of other Windows computers, you know what a desktop
    is. When you start up a computer with the Macintosh or Windows OS installed on,
    slick-looking graphics and mouse menus take over your entire computer screen,
    giving you a common workspace for all your programs and windows. That''s the desktop.


    The desktop gives you a few ways to keep track of your files and get your work
    done efficiently and peacefully. You can open multiple windows and switch between
    them with the click of a mouse button. You can do nifty stuff such as dragging
    and dropping to share files and information among your programs. Graphical tools
    that with the desktop give you views into your operating system, your files, and
    your network (if you''re on). Additional graphical tools let you do neat stuff,
    such as send and receive mail, manage print jobs, and change the way your desktop
    looks.


    Although window managers (such as Motif) have been around for some time, real
    integrated desktops like the ones built into Windows and the Mac OS are just beginning
    to catch on in the UNIX world. Now you can choose'
