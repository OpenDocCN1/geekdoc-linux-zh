  md: '# 200 Part III: Getting Things Done


    # Lots of X Windows


    If you''re running Motif or any other X Window Graphical User Interface (GUI),
    you probably figured out how to run many programs at a time: several xterm windows
    run a program in each. You create a new window by moving the mouse outside of
    an window, holding down the left mouse button to get a new Window or


    something similar. If you''re running a version of CDE, running many programs
    at a time is even easier: Just double-click the icon for each program you want
    to run. That''s why you don''t have to deal with opening xterm windows.


    Read this chapter anyway, however, particularly the sidebar "Windows and job control
    mix?" in this chapter.


    In terms of fairness, we must point out that the feature that enables you to flip
    back and forth, was written by Bill, the same guy who wrote the C shell, vi, and
    NFS (Network File System, described in Chapter 16). In contrast to our opinion
    of some of his other efforts, we think that job control is pretty cool.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_223_0.png)


    If you have a process that has run amok, see Chapter 24 to find out how to kill
    it.


    # So What Is a Process, Anyway?


    All the work UNIX does for you is done by UNIX processes. When you log in, the
    shell is a process. When you run an editor, the editor is a process. Pretty any
    command you run is a process.


    Processes called daemons run in the background and wait to do useful things without
    manual intervention. When you use ip or lpr to print something, for example, the
    daemon does the work of sending the material to the printer.


    Normally, all this stuff happens automatically, and you don''t have to pay attention
    to it. Sometimes a program gets stuck, however, and you can-use a personal computer
    running Windows 98 or a pre-OS X Macintosh, the usual response to a process is
    to restart the computer. When you run UNIX, restarting the computer is a little
    extreme for a single process. For one thing, other running programs and people
    who are logged in do not appreciate having their computer kicked out from underneath
    them. Also, UNIX may take awhile to restart from a forced reboot (our system takes
    about 5 minutes to check all the hard drive), and you run the risk of losing files
    that were being updated.'
