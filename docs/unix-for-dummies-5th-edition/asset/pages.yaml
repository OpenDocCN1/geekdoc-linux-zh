    # What''s GNU?


    No tour of UNIX versions is complete without a visit to the Free Software Foundation,
    in Cambridge, Massachusetts (not to be confused with the OSF, Open Software Foundation,
    which is about six blocks down the street). The FSF was founded by a brilliant
    but quirky programmer named Richard Stallman, who came from MIT, where people
    wrote lots and lots of software and gave it all away. He firmly (some would say
    satirically) believes that all high-quality free software should be free, and
    he set up the FSF to produce lots of free software, culminating in a free version
    of UNIX. Despite a bit of initial skepticism, the FSF has raised enough money
    and given lent enough to do just that. The FSF''s project GNU (the best-known
    and fastest versions of the UNIX user-level software, the text editor GNU Emacs
    (which we discuss in Chapter 10), most of the other basic UNIX utilities, and
    the GNU compiler (GCC), is now used on all the free versions of UNIX, including
    Linux, as well as on a few commercial ones.


    The crowd grew to work on new stuff, including its resistance to the GNU Hurd,
    a complete working version of the UNIX system. Early on, fans of free software
    awaited the GNU Hurd with greater eagerness; now Linux and the freely available
    BSD have arrived, however, their eagerness abated somewhat. Hurd or no Hurd, GNU
    Emacs, GCC, and the GNU units are here to stay. The FSF says you could call GNU/Linux,
    because so much GNU software is in Linux, but almost nobody does. (There is probably
    more than BSD GNU software in Linux, actually.)


    What the FSF means by "free" software is a little different from what you might
    expect: It means freely available, not necessarily for free. It means that if
    you find someone willing to pay a million bucks for some software, that is perfectly
    okay. That person, and anyone else to whom you give or sell GNU software, however,
    must be free to give or sell it, in turn, to other people without restriction.
    The intention is that people can make money by supporting and customizing software,
    not by hoarding it. Although the FSF surely has written at least one company,
    named Cygnus Support, makes good business supporting it.


    # How Can You Tell?


    When you log in to your UNIX system, a variety of copyright notices usually flash
    by, with an identification of the type of UNIX you are accessing. Carefully scrutinize
    the information on-screen, and you may be able to tell which version you have.'
