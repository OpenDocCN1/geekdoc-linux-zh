    # More than just a text editor


    The emacs program is a cornucopia of bells and whistles, including two different
    e-mail packages, a newsreader, a file manager, color highlighting, and countless
    other than unnecessary features. These features make emacs a much larger package
    than any other editor (it has been somewhat accurately called an operating system
    disguised as an editor) and has been known to cause some system administrators
    to balk at installing it on UNIX machines. For others, it''s always a way of life,
    so whether you have access to emacs may


    depend on how strongly your system administrator feels about those types of things.


    +   - If you get an error message when you try to run emacs, ask your system administrator
    what''s up. The emacs program may have another name on your system. If your system
    administrator says that you don''t have emacs, plead with him or her to get it.

    - If emacs looks or acts weird (weirer than usual, that is), your terminal may
    not be set correctly. Again, ask your system administrator to straighten it out.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_184_1.png)


    To run Xeacs on the eating.peas file, type the command emacs eating.


    # Telling emacs what to do


    Rather than have two modes, as vi emacs treats normal letters, numbers, and punctuation
    as text and sticks them in your file when you don''t (Pretty advanced concept,
    huh?) Commands are usually given by pressing combinations of the Ctrl (Control)
    key and a letter. You also give some commands by pressing the Meta key and a letter.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_184_2.png)


    On most, the Meta key is the Esc key. If your keyboard has an Alt key, it may
    be the Meta key. Try Alt to see whether it works. If it doesn''t, use Esc. Unlike
    with Alt, if you use Esc you must release the key before you type the subsequent
    letter (Esc, release). In the following section, we will tell you to press Esc.


    # Another new concept: Type to enter text


    To enter text, just start typing! The text is inserted wherever your cursor is.'
