  md: '# 202 Part III: Getting Things Done


    The TTY column lists the terminal from which the process was started. In this
    case, typo0 is the terminal, which happens to be pseudoterminal 0. (Because UNIX
    systems are written by and for nerds, they tend to start counting at 0 rather
    than at 1.) UNIX uses a pseudoterminal when you get logged in from a window on
    your screen or from a remote system through a network rather than a real, actual,
    drop-it-on-your-foot-and-it terminal. For our purposes, all terminals are the
    same, they''re real, pseudo, or whatever.


    The TIME column is the amount of time the computer has spent running this program.
    (The time spent waiting for you to do something or waiting for disks and printers
    and so doesn''t count.)


    The COMMAND column shows, more or less, the name of the command that started the
    process. If the process is the first one for a particular terminal or pseudoterminal,
    the command name starts with a hyphen.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_225_0.png)


    # The Linux ps


    The ps command has one additional column:


    | PID TTY STAT TIME COMMAND |

    |---|---|---|---||

    | 1797 pp5 S | 0:00 | -bash |

    | 1855 pp5 R | 0:00 | ps |


    The STAT column shows the status of the process. (online documentation) for the
    command, R means runnable, S means sleeping, D means uninterruptible sleep, T
    means stopped or traced, and Z means a zombie process. For our purposes, R means
    it''s a command you ran, and the other stuff doesn''t matter much.


    # Fancier ps (and qs)


    The version of ps has lots of options, most of which are useless. One of the most
    useful is -f, which produces a "full listing:


    | PID PPID C - TIME TTY COMMAND |

