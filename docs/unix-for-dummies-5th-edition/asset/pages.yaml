  md: '# 228 Part IV: UNIX and the Net


    know?) Although setting up a PPPoE connection on your UNIX box is possible, it''s
    way more complex than we can describe here. Unless you have a geeky friend who
    can set it up for you, the path of least resistance is to run out and get a $30
    router, plug that into your PPPoE connection, plug your UNIX box into the router
    that does simple DHCP, and configure the necessary passwords into the router using
    its handy Web page.


    Setting up a dialup connection isn''t as bad as PPPoE but is still more complex,
