  md: '# Chapter 7


    # The Shell Game


    In This Chapter


    +   - Using redirection

    - Viewing a file one screen at a time

    - Printing the output of any command

    - Working with groups of files

    - Avoiding retyping commands, especially after typos

    - Getting set up each time you log in

    - Setting your terminal options


    > If you read the preceding chapters in this book, you know how to work with files
    and how to type some commands to UNIX (you type them to the shell, as you know,
    but don''t get bogged down in that here). UNIX has a clever way to increase the
    power of its commands: *redirection*. This chapter shows you how to use redirection
    and how to use wildcards to work with groups of files.


    # This Output Is Going to Havana:

    Redirection


    When you use a UNIX command like ls, the result (or *output*) of the command is
    displayed on-screen. The standard place, in fact, for the output of most UNIX
    commands is the screen. The output has a name: *standard output*. As you can imagine,
    there is also *standard input*, usually the keyboard. You type a command; if it
    needs more input, you type that, the result is output displayed on-screen — all
    very natural.


    You can prevent this natural order by *redirecting* the input or output of a program.
    A better word is *hijacking*. You say to UNIX, "Don''t display this output on-screen
    — instead, put it somewhere else." Or, "The input for this program is not coming
    from the keyboard this time — look for it somewhere else."'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# 104 Part II: Some Basic Stuff


    The "somewhere else" can be any of these sources:


    +   - **A file**: You can store the output of ls (your directory listing) in a
    file, for example.

    - **The printer**: It''s useful only for output. Getting input from a printer
    is losing battle.

    - **Another program**: This one gets really interesting when you take the output
    from one program and feed it to another!


    A bunch of UNIX programs are designed primarily to use input from a source other
    than the keyboard and output stuff to somewhere other than the screen. These kinds
    of programs are called filters. Readers old enough to remember what cigarettes
    were recall that the ones had a filter between the cigarette and your mouth to
    make the smoke smoother, lower, and more sophisticated. UNIX filters work in the
    same way, except that they usually aren''t made of asbestos.


    ![](img/6f1b1eb4ad574c01fdd4a6bcfe910044_127_0.png)


    The only exception to this redirection is with programs, such as text editors
    and spreadsheets, which take over the entire screen. Although you can redirect
    the output to the printer, for example, you won''t like the results (nor will
    your coworkers, as they wait for a pile of garbage packages to come out of the
    printer). Full-screen programs write all sorts of special glop (they give instructions)
    to the screen to control where displays, what color to use, and so on. These instructions
    don''t work on the printer because printers use their own, different kind of glop.
    The short form of this tip is that redirection and editors don''t mix.


    # Grabbing output


    So how do you use this neat redirection, you ask? Naturally, UNIX does it with
    funny characters. The two characters < and > are used for redirecting input and
    output to files and to the printer. You use another character | to redirect the
    output of one program to the input of another.


    To redirect (or snag, in technical parlance) the output of a command, use >. Think
    of this as a tiny funnel into which the output is pouring (hey, we use any gimmick
    to remember which funny character is (which). To make a file named list.of.files
    that contains your directory listing, for example, type this line:


    ```

    $ ls list.of.files

    ```


    UNIX creates a new file, called list.of.files in this case, and puts the output
    of the ls command into it.'
