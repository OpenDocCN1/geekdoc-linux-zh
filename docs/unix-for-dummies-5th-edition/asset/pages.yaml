  md: '# Chapter 2: What Is UNIX, Anyway?


    # You can disregard this discussion about the true nature of shells


    What UNIX calls a shell, many people — especially DOS users — call a command processor.
    What DOS users call a shell is fancy graphical program that is supposed to make
    the computer easier by displaying cute icons for programs and files and other
    user-friendly goodies.


    Because the people who wrote UNIX didn''t go for all this whims, frou-frou, hand-holding
    stuff, their idea of a shell was a program in which you


    could type zq to run a program called zq. (These guys were notoriously lazy typists).
    Although user-friendly shells are available for UNIX, they''re not widely used,
    and we don''t mention them again in this book.


    If a Windows or Macintosh fanatic finds things about the UNIX shell, you can respond
    that, although UNIX may be somewhat charming to use, as a UNIX user, at least
    you''re not a wimp.


    Linux systems usually come with the BASH shell, a Bourne-style.


    After you determine whether you have a Bourne-style shell ($) or a C shell ($),
    note this fact on your Cheat Sheet in the front of this book.


    If you use a GUI (see Chapter 4), you see windows and icons, not a little UNIX
    prompt, after you log in. You still need to use a UNIX shell from time to time,
    however, usually to perform housekeeping tasks.


    # The Bourne and Bourne Again shells


    The most widely used UNIX shell is the Bourne shell, named after Bourne, who originally
    wrote it. The Bourne shell is on all UNIX systems. It prompts you with $, which
    you type and press Enter. Like all UNIX programs, the Bourne shell itself is a
    program, and its prompt name is sh. Clever, eh?


    A alternative versions of the original Bourne shell exist, most notably the Bourne
    Again shell (or BASH), whose prompt name is bash from the GNU crowd. This version
    of the shell is used in many places because of its price — it''s free. Some people
    claim it''s still overpricked, but we don''t get into BASH is enough like the
    original Bourne shell that we say about Bourne also applies to BASH. The most
    notable advantage of Bash is that it has command editing, a fancy way of saying
    that you can press the arrow keys on your keyboard to correct your commands as
    you''re typing, just as you can with DOS (oops, better not say that when UNIX
