  md: '# 226 Part IV: UNIX and the Net


    # Can we talk?


    You can have a somewhat spifier conversation with the talk command, which allows
    simultaneous two-way typing. You use it the same way you use write: by giving
    a username and, optionally, a terminal name:


    ```

    talk margy

    ```


    The other user sees something like this:


    ```

    Message from Talk_Daemon@iecc at 20:47 ...

    talk: connection requested by john1@IECC

    talk: respond with: talk john@IECC

    ```


    If someone tries to talk to you and you''re interested in responding, the type
    talk command suggests. If you''re in the middle of a text editor or other program,
    you must exit to the shell first.


    While talk is running, it splits your screen and arranges things so that what
    you appear in the top half and what the other user appears in the bottom half.
    Unlike write, talk immediately passes what you type — without waiting for you
    to press Enter — which means that you can see all the other user''s mistakes and
    vice versa. When you get tired of talk, exit by pressing Ctrl-D.


    # Chatting with faraway folks


    The talk command is designed to “talk” to users on other computers. If the other
    computer is a long way away, typing rather than talking over the phone can make
    sense. The Internet connects around the world, so you may find yourself exchanging
    messages with someone whose English is not a native language. In case, typing
    can be faster than trying to understand someone with a strange accent across a
    noisy connection.


    Computers have names, too, which are usually called machine names (more about
    this in Chapter 16). To talk to someone on another computer, give talk username
    and machine name:


    ```

    talk zac@greatattapes.com

    ```


    After you''re connected, talk works just like talking to a local user, except
    that sometimes several seconds can pass for characters to get from one machine
    to another on an intercontinental link.'
