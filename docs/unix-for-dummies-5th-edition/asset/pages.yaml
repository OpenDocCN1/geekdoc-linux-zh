    # # Moving text in emacs


    Although this subject is beyond the scope of this quick introduction to *emacs*,
    we will tell you how to move text from one place to another in a file. It turns
    out that when you press Ctrl+K to kill the text from the cursor to the end of
    the line, the killed information is stored in a temporary place called the *kill
    buffer*. You can copy the information from the kill buffer back into your file
    by pressing Ctrl+Y (yank it back into the file). To


    move some text, kill it with Ctrl+K, move the cursor to the new location, and
    press Ctrl+Y to insert the text where your cursor is. (Kill and yank *emacs*--correspond
    to cut and *paste* in the regular world.) If *emacs* is running in an X window,
    the kill buffer is connected to X''s cut-and-paste system, which means you can
    cut and paste between *emacs* and other programs.


    # # Deleting stuff in emacs


    *emacs* has several commands for deleting stuff:


    +   * To delete the character the cursor is on, press Ctrl+D. Or, on many terminals,
    press Del key.

    * To delete text from the cursor to the end of the word (up to a space or punctuation
    mark), press Esc and then the D.

    * To delete text from the cursor to the end of the line, press Ctrl+K.


    # # Save that file before it''s too late!


    To save the text in the file, press Ctrl+XS (press and hold the Ctrl key, press
    X and S, and then release the Ctrl key). You should save your work every few minutes.
    Even though *emacs* isn''t as frustrating as *vi* (or ed), lots can still go wrong.


    # # Bidding emacs adieu


    When you finish editing and want to leave *emacs*, press Ctrl+XC (press and hold
    down the Ctrl key, press X and C, and then release the Ctrl key). You leave *emacs*
    and see the UNIX shell prompt.'
