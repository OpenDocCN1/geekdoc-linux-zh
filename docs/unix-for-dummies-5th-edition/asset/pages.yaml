  md: '# Chapter 19: Grabbing Files from the Net


    # # An FTP cheat sheet


    | Command | Description | | |

    |---|---|---|---||

    | get old new | Copies remote file old to local file new; can omit new if same
    name as old | asc bin | Transfers files in ASCII mode (use for text files) |

    | put old new | Copies local file old to remote file new; can omit new if same
    name as old | quit dir pat | Transfers files in binary or image mode (all other
    files) Leaves FTP |

    | del xxx | Deletes xxx on remote system | mget pat | Lists files whose names
    match pat; if no pat, lists all files |

    | cd newdir | Changes to directory newdir on the remote machine | mput pat | Gets
    files whose names match pat |

    | cdup | Changes to next higher directory | mdel pat | Puts files whose names
    match pat |

    | lcd newdir | Changes to directory newdir on the local machine | prompt | Deletes
    remote files whose names match pat Turn name prompting or off in mget and mput


    # ## A few anonymous FTP tips


    Here are a few items to remember when you''re FTP-ing:


    +   - Some hosts limit the number of anonymous users or the times of day that
    anonymous FTP is allowed. Please respect these limits because no law says that
    the owner of the system can''t turn off anonymous access.

    - Don''t store files in the computer unless the owner invites you to do so. Usually
    a directory called incoming or something similar is available where you can put
    stuff.

    - Some hosts allow FTP only from hosts that have names. That is, if you try to
    FTP anonymously from a host that has a number but no name, these hosts don''t
    let you in. Problem occurs often with personal computers, because they generally
    offer no services that are useful to other people, don''t have always names assigned.
    If you have that problem, check with your local administrator to see whether assigning
    a name to your PC is possible and to set up the reverse lookup database the remote
    host uses to figure out what your name is.'
