    # This page looks funny


    Sometimes a Web page gets garbled on the way in, or you interrupt it (by clicking
    the Stop button on the toolbar or by pressing the Esc key). You can tell your
    browser to get the information on the page again: Click the Reload button (the
    curved arrow).'
