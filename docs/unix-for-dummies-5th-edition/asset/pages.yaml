  md: '# 74 Part II: Some Basic Stuff


    A few buttons are generally on the panel at the bottom of the screen, next to
    the GNOME menu. If you right-click any of the buttons, you can remove or change
    it. If you right-click an empty part of the bar, you can add a new button, or
    one of the mini-apps designed to run there, such as a clock. Right-click the bar,
    select the Add to Panel option from the pop-up menu, and look all the options
    you get. Note that it matters where you click. A new item is placed near where
    you clicked; it won''t be she own by the other items on the panel.


    Sooner or later, you''ll want to quit. When that time comes, just select the Log
    Out from the main GNOME menu. Now you can mutter "I can quit any time I want"
    under your breath, and make people nervous.


    # Terminal Happenings


    Even though Windows enables you to run all of the coolest, awestome, newest, most
    graphical programs, which program people use the most? It''s called xterm, and
    all it does is act the kind of VT100 dumb terminal window systems are supposed
    to save us from. Such are the ways of progress.


    The xterm program is one of the oldest programs that runs under X, and it has
    the fingerprints of a dozen generations of programmers. As the README file in
    its source code notes,"This is undoubtedly the most ugly program in the distribution."
    Although xterm has more than 70 exciting options on its command line alone, we
    don''t tell you about them.


    # Click, click


    One place where xterm acts a little better than the dumb terminal it portrays
    to emulate in mouse handling. You can select text with the mouse and then paste
    the selected text into either that or a different xterm window.


    To select text, move the mouse to the beginning of the text, press down the first
    (left) mouse button, and move the mouse to the end of the text. As you move the
    mouse, the selected text changes color. When you select it, let go of the mouse
    button. Normally, xterm selects character-by-character; if double-click rather
    than just the mouse button, however, if you triple-click, it selects by line.
    Users who don''t believe in walking and chewing gum at the same time have an alternative
    to select text: Move to the beginning of the selection, click the button, and
    then move to the end of the selection and click the right button.'
