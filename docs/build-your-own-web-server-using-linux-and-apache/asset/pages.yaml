    In order to remove a directory and everything inside it, we must add the "recursive"
    (-r) option to the command, like so:


    ```

    [kermit@swinetrek-$] rm -r untitled\ folder

    [kermit@swinetrek-$]$

    ```


    Ordinarily, you must have permissions to a file in order to delete it; however,
    if you have permissions on the directory containing the file, you can delete files
    if you confirm the action. If you attempt to delete a file to which you only have
    read permissions, you will be asked if you really want to delete that:


    ```

    [kermit@swinetrek-$] rm Read\ Only.txt

    rm: Remove write-protected regular file ''Read Only.txt?'' y

    [kermit@swinetrek-$]$

    ```


    To force a deletion without further confirmation, add the -f option to the command.
    This can be combined with the -r option to delete a write-protected directory,
    too.


    ```

    [kermit@swinetrek-$] rm -rf Read\ Only\ Folder

    [kermit@swinetrek-$]$

    ```


    > Don''t Force It! Use the -f option with the rm command very carefully. When
    logged in as root, deleting directories or files without confirmation can result
    in serious damage to your installation. Confirming the deletion provides a safeguard
    against these accidental deletions.


