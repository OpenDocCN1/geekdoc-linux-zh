    # Programming the Shell


    The shell itself can be a powerful little programming language. It supports looping,
    branching, variables—everything that constitutes a worthwhile environment. These
    shell programs, called scripts, are just text files on which execute permissions.
    The text files contain commands just like those you''d type on the command line:


    File: hello_world.sh


    ```

    #!/bin/sh

    echo "Hello, World!"

    ```


    The output of this script is exactly as you expect:


    Hello, World!


    Let''s take a look at some variable in the shell''s more programming language-like
    features. First, we''ll create a new variable in the shell and print its value.


    ```

    [kermit@swinetrek -]$ COUNTER=0

    [kermit@swinetrek -]$ echo $COUNTER

    0

    ```


    Once the variable COUNTER is created, it''s there until you close the terminal
    window. The value of the variable may change, as you''ll see, but the variable
    remains until the terminal session is ended. This is true of any declared shell
    variable.


