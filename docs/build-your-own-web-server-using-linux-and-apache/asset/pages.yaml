  md: '# Summary


    To set or modify an environment variable, you must use the export command:

    [kemit@swinetrek ~]$ export PATH=$PATH:/home/kemit

    [kemit@swinetrek ~]$ echo $PATH

    /usr/kerberos/bin:/usr/local/bin:/usr/bin:/bin:/usr/X11R6/bin

    :/home/kemit/bin:/home/kemit


    Note how we''ve used the PATH environment variable''s existing value ($PATH) in
    specifying its new value. This technique allows us to tack an additional directory
    onto the end of the existing PATH. You can see that the /home/kemit directory
    has been added to the PATH variable. You should now be able to run counter_test.sh
    as easily as you''d run 1.


    ```

    $kemit@swinetrek ~]$ counter_test.sh

    ```


    Setting the PATH environment variable in this way will allow you to run a shell
    script from any directory for the remainder of this terminal session, but the
    modified PATH will be lost as soon as you exit the terminal. In Chapter 4, we''ll
    see how to modify the default PATH used whenever a new shell is launched.


    # Summary


    As useful as it is, the Linux command line can seem pretty cryptic when you first
    open a terminal. There is logic to the commands, but it will likely take a bit
    of experimentation before you feel comfortable with them. In order to set you
    on the right path, we''ve laid out some of the most common terminal commands,
    and explained their use in your Linux system, in Appendix A.


    It''s possible to use a Linux system without going anywhere near the command line.
    If you do, however, you''ll forego accessing the true power of the operating system.
    Linux''s roots lie in the command line interface. Certainly, you can use the terminal
    to achieve tasks more efficiently than would possible using the graphical interface,
    but even more importantly, the command line allows you to execute tasks that would
    be impossible to complete via the gui.


    In a discussion on the intuitiveness of interfaces in the comp.os.linux.misc newsgroup,
    Mark van Hoeij wrote “How do I type ''for i in *.dvi do xdvi done'' in a GUI?”,
    and his point is a valid one; the command line lets you do


    101'
