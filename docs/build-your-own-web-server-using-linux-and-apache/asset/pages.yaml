  md: '# Simple Backups


    +   - Double-click Filesystem, to show the root directory.


    +   - Use the middle button to toggle cd folder into the FilesToBackup folder.


    +   - Click Link here on the menu.


    Once you''ve established links to every file you intend to back up in the FilesTo-Backup
    folder, close the FilesToBackup window. Insert a blank CD and, where you see Burn
    files linked in the directory? in the dialog, click OK. The files will be linked
    to a CD image, and this image will be burned to the CD. Dialogs will appear, reporting
    the progress of these two steps, so you''ll need to click OK when the process
    is complete.


    The next time you run a backup (say, the following day), the links you created
    will still be there. This means that, to run a daily backup, you can simply click
    simple-cd-backup, then click OK at the Burn files linked in the directory? prompt:
    it will burn your files to the backup CD.


    # Some Explanation


    Let me explain how the script works in a bit more detail. You don''t need to know
    this information to use the script, but this is a good example of how a shell
    script can act like a powerful application, requiring only a small coding effort.
    This explanation may also help you debug the script if it doesn''t quite work
    as intended on your system.


    The bit of the script that actually does the work is the last couple of lines,
    which use mkisoofs (an abbreviation of "make ISO filesystem") and drecord. The
    rest of the script focuses on setting up the backups in a user-friendly way.


    First, simple-cd-backup, checks that the system has a CD burner by using a little
    Python to parse the file /proc/sys/dev/cdrom/info. This file lists all the CD-ROM
    drives on the system and provides an indication of the capabilities of each. On
    my machine, it looks like this:


    | drive name: hdc |

    | drive speed: 24 |

    | drive # of slots: 1 |

    | Can close tray: 1 |

    | Can open tray: 1 |

    | Can lock tray: 1 |

    | Can change speed: 1 |

    | Can select disk: 0 |'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Chapter 8: Occasional Administration


    | Can read multisession: | 1 |

    | Can read MCN: | 1 |

    | Reports media changed: | 1 |

    | Can play audio: | 1 |

    | Can write CD-R: | 1 |

    | Can write CD-RW: | 1 |

    | Can read DVD: | 1 |

    | Can write DVD-R: | 1 |

    | Can write DVD-RAM: | 0 |

    | Can read MRW: | 1 |

    | Can write MRW: | 1 |

    | Can write RAM: | 1 |


    The file above lists one CD drive, called "hdc", which can be addressed as /dev/hdc.
    The presence of more CD drives would add columns to the file. Our script uses
    a single line of Python to look into this file for the line "Can CD-R" followed
    by a 1. If it doesn''t find such a column, it displays an error (using zenity,
    which is discussed below) and exits.


    The FilesToBackup is a Nautilus window that shows the directory ~/.simple-cd-backup/FilesToBackup,
    which the script creates (if it doesn''t already exist). To view it, run Nautilus
    using this command:


    ```

    [kernit@swinetrek ~]$nautilus --no-desktop --browser \

    > "$HOME/.simple-cd-backup/FilesToBackup"

    ```


    The script makes extensive use of zenity, a command which is used to pop up various
    types of GNOME alert boxes and dialog windows from shell scripts. For example,
    the script uses the following code to display a dialog that contains OK and Cancel
    buttons:


    ```

    [kernit@swinetrek ~]$ zenity --title "Simple CD Backup" \

    > --question --question-text "Burn files linked in the directory?"

    ```


    This displays the dialog shown in Figure 8.3.


    Once you''ve confirmed that you''d like to burn the CD, the real work begins.
    The script uses mkisos to create an ISO image that contains all the files linked
    in the directory. It does so using the following mkissoff command:


    ```

    File: simple-cd-backup.sh (excerpt)

    mkisofs -f -l -o $ISO -A "$DISNAME" "$BACKUPDIR"

    ```


    258'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Figure 8.3. A question dialog displayed using zenity.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_278_0.png)


    $ISO has previously been defined as the name under which the generated ISO file
    should be saved; $DISNAME identifies a useful name for the disk (containing the
    date); $BACKUPDIR is the ~/.simple-cd-backup/FilesToBackup directory. The options
    -f and -1 control minor aspects of the way mkisos works: -f means "follow symbolic
    links in the directory", and -1 saves the mkisos with full names (rather than
    abbreviated Windows 95 FILENA-1.EXT names).


    Once the CD image has been created, the cdrecord command is used to burn it to
    the disc:


    ```

    File: simple-cd-backup.sh (excerpt)

    cdrecord -v speed=4 dev=/dev/$CDDEVICE ISO

    ```


    This simply burns the ISO image ($ISO) to the specified CDROM drive (/dev/$CDDEVICE,
    which we determined earlier at four-speed (a low speed like this reduces the risk
    of errors on some drives).'
