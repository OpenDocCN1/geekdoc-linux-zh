  md: '# FollowSymLinks


    This option determines whether or not symbolic links in the filesystem will be
    treated as part of the Website''s filesystem. When this option is switched on,
    symlinks are treated as part of the filesystem; when it''s off, symlinks are ignored.


    # SymLinksIfOwnerMatch


    When the FollowSymLinks option is enabled, turning this option ensures that the
    owner of the symlink file is the same as the owner of the symlink''s target. If
    the owners don''t match, the symlink is not included in the Website''s filesystem.


    # Includes


    This option should be turned on if you want to make use of server-side includes.


    # IncludesNOEXEC


    The IncludesNOEXEC option is almost identical to the Includes option, the only
    difference being that use of the potentially dangerous <!#exec cmd="----> directive
    is not allowed.


    # Indexes


    This option determines what happens when no default document is found. If the
    option is on, a list of all files in the directory will be displayed. If it''s
    off, an error will be returned. You''d most likely want this option turned off.


    # MultiViews


    Turning this functionality on enables content-negotiated multiviews, a technique
    by which you can serve content in a user''s preferred format. For example, say
    we have content in French and English saved as content.html and content.html.en,
    that MultiViews is switched on. Browsers requesting content.html that were set
    up for French would receive the French content, while browsers would receive the
    English content. Note that if we also had a file named content.html, this file
    would always be served, regardless of the browser''s preferred language.


    To change the options for a specific directory, click the Add... button to bring
    up the Directory Options screen shown in Figure 5.11.'
  merge: -1
