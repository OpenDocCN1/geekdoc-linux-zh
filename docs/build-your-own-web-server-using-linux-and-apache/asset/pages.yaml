    p.m.


    +   1. The first field defines how many minutes of each hour must pass before
    the task will be performed. In the above default crontab file, the first task
    is scheduled to start one minute past the hour; the last task is scheduled to
    commence at 42 minutes past the hour.


    +   2. The second field defines the hour in which the task will be completed.
    From this, we can tell that the second task is scheduled to run at 4:02.


    An asterisk indicates that the task should be executed every hour. Therefore,
    we can tell that the first task is scheduled to run at 0:01, 1:01, 2:01, and so
    on, all the way to 23:01, after it starts all over again.


    +   3. The third field defines the day of the month—numbered from 1 to 31—on which
    the task will run. The last command is scheduled to run at 4:42 on the first day
    of the month. Again, an asterisk indicates that the task should be every day of
    the month.


    +   4. The fourth field determines the month in which the task should run; as
    you''d expect, the months are numbered from 1 to 12. If you had a task to perform
    only once a year, say in July, this field would contain a 7. If you had a task'
