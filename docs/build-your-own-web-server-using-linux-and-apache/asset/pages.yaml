- img_proc: true
  md: '```

    kermit@swinetrek -]$ ssh-keygen -l -f /etc/ssh/ssh_host_rsa_key 1024 43:75:4b:9b:63:15:47:c7:94:95:e5:42:0f:4e:cc

    /etc/ssh/ssh_host_rsa_key.pub

    ```


    The part highlighted in bold is the key fingerprint. You must confirm that this
    key fingerprint is exactly the same as the key fingerprint''s displayed when you
    try to connect to the server for the first time. If the key fingerprints aren''t
    the same, something is wrong: the machine you''re trying to connect to is not
    the machine you''re actually connecting to. If the key fingerprints agree, you
    can safely click Yes on this dialog. PuTTY will remember this verified host key
    for future connections, and will not ask again.


    # Avoid Changing the Host Key


    > > WARNING You should avoid changing the SSH server''s host key, which can happen
    if you reinstall the SSH server software, or delete files in /etc/ssh. If this
    happens, the key that SSH clients remember will differ from the server''s new
    key, and the SSH client will display a warning message. PuTTY''s message is depicted
    in Figure 7.3.


    # Logging in with a Password


    Once you''ve verified the host key, you''ll be asked to log in: just enter your
    username and password at the prompts. After this, you''ll be presented with the
    familiar command prompt:


    ```

    login as: kermit

    kermit@swinetrek''s password:

    Last login: Mon Oct 10 05:45:39 2005 from 192.168.69.33

    [kermit@swinetrek -]$

    ```


    # SSHing into the Server


    > > Connecting to an SSH server is often described as “SSHing into the server.”


    # Logging in with a Private Key


    It''s possible to use PuTTY (or any other SSH client) to connect to a machine
    without entering a username or password at all. In such cases, we connect using
    a public and private key pair. First, we need to generate the keys with the PuTTYgen
    tool, shown in Figure 7.4, which you can launch by clicking Start > All Programs
    > PuTTY > PuTTYgen.'
