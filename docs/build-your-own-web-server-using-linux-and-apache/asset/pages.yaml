    2. Double-click on the Computer icon on the desktop.

    3. Double-click on Filesystem to get to the root directory.

    4. Double-click the var folder to open it.

    5. Double-click the backups folder.

    6. Ensure the resulting window displays the creation time of the files by selecting
    View > View as List.

    7. Holding down Ctrl, select the files with a date older than five days.

    8. Right-click and select Move to Trash from the context menu.

    9. To delete the file, return to the desktop and empty the trash by right-clicking
