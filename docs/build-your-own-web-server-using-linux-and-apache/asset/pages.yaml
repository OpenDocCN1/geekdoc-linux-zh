    # Blocking Requests, Not Connections


    > Firestarter will only display connection requests, not existing connections.
    This means that existing SSH connections won''t be terminated, but new SSH sessions
    won''t be allowed until you explicitly allow them.


    The easiest way to allow these blocked connections is to right-click on the blocked
    connection and select either Allow Connections From Source, Allow Inbound Service
    for Everyone, or Allow Inbound Service for Source.


    For example, you may only want to allow SSH connections from a particular IP address.
    To allow this, locate a blocked SSH connection from this IP address, right click
    and select Allow Inbound Service for Source. Similarly, you''ll probably'
  merge: -1
