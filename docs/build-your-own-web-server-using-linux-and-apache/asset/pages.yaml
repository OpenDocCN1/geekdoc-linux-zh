  md: '# Figure 3.2. The GNOME Terminal application.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_104_0.png)


    Let''s look at a real-life example that uses the command line to meet a specific
    need. Once you understand the components of the command (and the complexity of
    the graphical alternative), you''ll begin to understand the practical utility
    of the terminal and the command line.


    ```

    [kermit@swinetrek -]$ find /var/backups/* -ctime +5 -exec rm {} \\;

    ```


    I use this command regularly to remove from my system backups that are more than
    five days old. The command uses the find tool to search for files in the /var/backups
    directory that are more than five days old. For each file that the find tool locates,
    it runs the rm command: rm is the standard "remove file" command. Running this
    command regularly helps to save system storage space by deleting backups that,
    after five days, have become unnecessary. Of course, this command should be run
    in conjunction with an automated process that creates these backups every day
    or so.


    Let''s compare the use of this command to the process of utilizing a graphical
    tool to accomplish the same task.'
