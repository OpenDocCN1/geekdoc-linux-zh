  md: '# Chapter 1: Building the Linux Environment


    # Network Security


    Figure 1.14. Setting server security options.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_39_0.png)


    The Fedora Core distribution—and many of the other distributions of Linux—strive
    to make configuring your network security as easy as possible. By default, Fedora
    runs a firewall that blocks all traffic coming in from the network. To customize
    the firewall, simply select the services you want to run on this machine; alternatively,
    you can disable the firewall, which will leave the machine open and vulnerable
    to hacker attacks. You can also choose to enable Security Enhanced Linux (SELinux),
    which can help to minimize any damage if hackers gain control of parts of the
    system. Note that SELinux should not be considered an alternative to a firewall—neither
    the firewall, nor SELinux, makes your system completely secure, so it''s best
    to enable both. For your purposes, you should only allow Remote Login and Web
    Server traffic through the firewall, and set Enable SELinux to Active, as illustrated
    in Figure 1.14. Chapter 9 covers security in more detail.'
  merge: -1
