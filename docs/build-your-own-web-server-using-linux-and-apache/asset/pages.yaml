    With the package selection completed, you''ve finished the heavy lifting in the
    installation of Fedora Linux. The remainder is to be completed by the installer
    itself: formatting the hard disk with the partitions you created, installing each
    of the packages you selected, and performing dependency checking for each of the
    packages.'
