  md: '# 2


    # Day-to-day Usage


    Unlike Windows, Linux doesn''t offer a standard user interface, but provides a
    number of desktop environments that can be installed on top of the Linux kernel.
    Fedora Core comes with the KDE and GNOME desktop environments; in this book, we''ll
    be looking primarily at GNOME.


    # The GNOME Desktop


    Most graphical user interfaces are fairly similar; Microsoft Windows, Mac OS,
    and the GNOME desktop have a lot in common. You likely won''t have much trouble
    finding your way around, but GNOME does a few things differently. Here''s a brief
    run-down of the GNOME basics to get you up and running.'
  merge: -1
