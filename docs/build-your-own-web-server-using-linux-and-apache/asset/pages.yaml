  md: '# Unmounting a Filesystem with the ummount Command


    Before removing the floppy disk, we should unmount it, thereby removing it from
    the filesystem. We can do so using the ummount command—note the missing “n”—as
    shown below.


    ```

    [kermit@swinetrek ~]$ ummount /media/floppy

    [kermit@swinetrek ~]$

    ```


    For some devices, the unmounting process is very important. A floppy disk is a
    good example of this. It can take a long time to save a file to a floppy disk;
    the unmounting process ensures that all programs that are writing to the disk
    complete their writes before the device is removed.


    # The Filesystem Table (fstab)


    Many of the configuration options for your server''s filesystem are contained
    in a single text file, /etc/fstab. As this file is critical to the operation of
    your system, the file is owned by root and only root can write to the file. That
    ownership and permissions structure prevents any potentially catastrophic alteration
    to, or deletion of the file by non-root users. It''s strongly advised that you
    refrain from adjusting these permissions, and treat the file with the respect
    it deserves when logged in root.


