  md: '# Handling Linux Files


    # File group


    The group of users that has access to this file: in this case, a group named kermit
    When you create a user, Linux will automatically create a group with the same
    name as that user. This allows us to give a user access to another user''s files.
    For example, if we added the user gonzo to the group kermit, Gonzo would have
    access to Kermit''s files.


    # Owner, Group and Others


    These checkboxes allow the actual setting of permissions. You can grant the owner,
    the group you''ve selected, or everyone any combination of read, write,or execute
    permissions. That combination of three sections of three permission types results
    in 512 possible combinations for the permissions on this file. That''s a pretty
    flexible structure! We''ll look more closely at file permissions in a moment.


    # Special flags


    Special extensions to the permissions system allow us to flag a file for special
    treatment by the filesystem. We won''t need to use these flags within this book.


    # Text view and Number view


    These alternative views of viewing file permissions will be familiar to anyone
    who deals with file permissions via the command line.


    The text view is made up of ten characters. The first indicates the file type:
    if the file is a directory, this character will be d; if the file is a regular
    file, it''ll be -. The remaining nine characters indicate the read, write, and
    execute permissions for the owner, the group, and everyone else. For example,
    -rw-rw-r- represents a regular file with read and write permissions for the owner,
    and read-only permission for everyone else. You can see this view change as you
    change the checkboxes above.


    The number view is a more compact view of the text view. The numbers represent,
    from left to right, the permissions given to the owner, the group, and to everyone
    else. This view, too, changes as you change your selections in the checkboxes.


    # Last changed


    This field identifies the date and time at which the file was last changed. As
    this file hasn''t been reopened and modified, Linux doesn''t consider it to be
    changed yet. Open the file and modify it to see this date change.'
