    # Services and Runlevels


    Runlevels are basically a convenient way of describing the facilities that are
    currently available to the system. In runlevel 5, all system functions are available:
    multiple users can log in, networking features are available, and the GUI is up
    and running. As the system starts, and system functions become available, other
    runlevels are triggered:


    Runlevel 1

    This is known as single user mode. Only one user can be logged in at a time. No
    network resources are available.


    Runlevel 2

    Multiple users may be logged in simultaneously, but no network support is available.
    This is known as multi-user mode.


    Runlevel 3

    This is the same as runlevel 2, except that network resources have become available.
    This runlevel is sometimes referred to as full multi-user mode.


    Runlevel 5

    In addition to everything''s available in runlevel 3, the GUI server is also available
    at this runlevel.


    # What Happened to Runlevel 4?


    There is no default runlevel 4—this is reserved for definition by system administration
    gurus.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_140_0.png)'
