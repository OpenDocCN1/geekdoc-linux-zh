  md: '# Chapter 9: Server Security


    # # Setting up a Nightly Email


    One way to ensure that you''re reminded is to have the system email you each night
    with details of any alerts that were logged in the previous day. While it would
    nice to be alerted to a potential compromise the instant it happens, in practice,
    most system administrators are too busy to respond to an alert instantly. A daily
    email gives you the chance to review the alerts at a reasonable pace, and to take
    action to close off any security holes, without demanding your availability twenty-four
    hours a day.


    The Snort Website links to various data analysis tools.3 These take your raw Snort
    logs and use them to create reports. For a simply nightly email, a good tool is
    snortlog.4 Download snort and extract it to /usr/local:


    ```

    [root@swinetrek kermit]# tar -x -p -f \

    >/home/kermit/Desktop/snortlog_v2.3.0.tgz -C /usr/local

    [root@swinetrek kermit]#

    ```


    Running snortlog isn''t difficult, but it does require that you change the working
    directory to /usr/local/snortlog_v2.3.


    ```

    [root@swinetrek kermit]# cd /usr/local/snortlog_v2.3/

    [root@swinetrek kermit] snortlog_v2.3]# .//snortlog.pl < \

    >/var/log/snort/alert

    subject: IDS Statistics generated on Wed Oct 26 23:13:53 2005

    The log begins at : Wed 26 09:58:27

    The log ends at : Wed 26 22:58:42

    ```


