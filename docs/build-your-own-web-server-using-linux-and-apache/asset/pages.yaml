    The GNOME desktop, shown in Figure 2.1, displays a bar at the top and a bar at
    the bottom; in GNOME, these bars are called panels.


    # The Bottom Panel


    The bottom panel offers a clickable button for each window that''s open, similar
    to the Windows Taskbar, as shown in Figure 2.2.


