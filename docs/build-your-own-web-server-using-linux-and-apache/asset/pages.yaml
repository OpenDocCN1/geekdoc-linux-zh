  md: "# Chapter 6: Server Administration\n\n# yum\n\nyum (Yellow Dog Updater, Modified)\
    \ is a relatively recent addition to the administration toolkit in many Linux\
    \ distributions. Derived from a tool that was built for the PowerPC-based Yellow\
    \ Dog Linux distribution, yum provides a way to keep your system packages up to\
    \ date by utilizing a network of servers that host RPM packages. We used this\
    \ tool in Chapter 5 to get the latest version of Apache. yum has some distinct\
    \ advantages over other tools. These advantages make it a good choice for administrators—especially\
    \ those who may not always be sitting at the server.\n\n+   - The daemon (yumd)\
    \ can be run in the background to check the repositories periodically for new\
    \ software updates.\n\n+   - yum can also run non-interactively: a simple command\
    \ line switch will assume that your answer to yum prompt is \"yes.\"\n\n+   -\
    \ yum uses only RPM package headers to check the system software against the repository.\
    \ This sets it apart from other updating systems, which create an index addition\
    \ to the headers stored in the RPM database. Using only the headers can save considerable\
    \ disk space on the server, especially as the set of installed tools grows.\n\n\
    +   - The yum command set is very small, yet powerful.\n\n> yum: a Caveat\n yum\
    \ is a convenient tool, it can occasionally cause problems. For example, some\
    \ MySQL updates may overwrite your configuration, and delete your data. If your\
    \ installation depends on specific libraries in order to function, it's generally\
    \ a good idea to check through the list manually before you install new packages.\n\
    \n# Updating your Server with yum\n\nTo check the availability of updates to your\
    \ server, enter yum check-update in a terminal window.\n\n```\n[kermit@swinetrek\
    \ ~]$ su\nPassword:\n[root@swinetrek kermit]# yum check-update\nSetting up repositories\n\
    updates-released 100% |================================================| 951 B\
    \ 00:00\n```"
