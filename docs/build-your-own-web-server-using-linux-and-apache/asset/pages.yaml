  md: '# Chapter 1: Building The Linux Environment


    # Installing the Distribution


    Once you have completed your preliminary hardware research, it''s time to walk
    through the installation process. We''ll take a look at both the graphical and
    text-based installers, the second of which can be useful when you''re installing
    Linux on a machine with limited resources. Don''t forget that, if your situation
    demands it, you can install Fedora Core on your server without a desktop. In any
    event, it''s a good idea to read through the following sections before putting
    the installation CD into your computer.


    # The Dual-Boot Option


    We''ve already mentioned the dual-boot option for your server: running both Windows
    and Linux on the system. As I''ve mentioned, this provides a great set of "technical
    training wheels" as you adjust to the new capabilities and options in your Linux
    server. The following installation instructions will work equally well with a
    dual-boot configuration. However, there are a few important points to keep in
    mind when choosing this option.


    +   - If you''re building your dual-boot server on a fresh box, be sure to install
    and configure Windows first. By default, Windows doesn''t recognize any of the
    native Linux filesystems. If Linux is installed, the first Windows boot loader
    will take over and load Windows; Linux will be there, but you won''t be able boot
    into it. A Linux installation will cooperate with Windows and allow you to boot
    into both.


    +   - Linux provides a means to read the FAT32 (typically used by Windows 98 and
    ME) or NTFS (usually used by Windows NT, 2000, and XP) filesystems. In the case
    of FAT32, you''ll be able to write to the Windows partitions. If you''re using
    an NTFS-based Windows installation, the files on the Windows partition will be
    read-only.


    +   - If you''re installing Linux on a system that already contains a Windows
    operating system, it may be useful to purchase a nondestructive partition management
    tool, such as Partition Magic. This will allow you to move the partitions on your
    Windows system, creating room for the drive for the Linux installation, and preserving
    the data that already exists on the drive.


    > 8 There are third-party utilities that allow Windows to read the drives of a
    Linux installation on the same machine, though, check http://pro.mount-everything.com/
    for one commercial example.


    > 9 http://www.symantec.com/partitionmagic/'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'With the exception of these important points, the process of installing a dual-boot
    system is the same as a single OS installation.


    # # Graphical Installation


    Some would argue that the real rise of Linux began with the advent of graphical
    installers. Prior to that time, installation was a “mouseless” affair, using the
    keyboard arrow keys and space bar. Red Hat——the distribution upon which Fedora
    is based—was a pioneer in graphical installation routines. Since that time, the
    creators have continued to refine and improve upon the process, the result being
    a very clean and easy-to-follow installation procedure. As you will see in the
    screen shots I will present throughout the rest of this chapter, installing Fedora
    on your new server is nearly painless!


    Ive provided screen shots for nearly every step of the process. While the procedure
    is easy, there are a few steps that are particularly important to a successful
    installation. Hopefully, the abundance of screen shots in the following discussion
    will help you to more understand the installation process.


    # # Obtaining Installation CDs


    There are two main ways to obtain Fedora Core installation CDs: you can download
    the CDs from fedora.redhat.com/download/ and burn them yourself, or you can buy
    them.


    The installation CDs are downloaded as a series of ISO images, named something
    like FC4-i1386-disc1.iso (FC4 means Fedora Core 4, i1386 means it''s for Intel
    x86 processors, and disc1 means that it''s the first CD). ISO images are direct
    copies of an CD, stored in a single file. Once you''ve downloaded the images,
    you''ll need to burn each of them to a CD.¹⁰ Most CD burning programs offer a
    menu option to burn an ISO image; a list of instructions for the use of various
    Popular Windows burning tools¹¹ is available online. If in doubt, the help files,
    or Websites, associated with your CD burning tool are likely to explain how to
    burn an ISO image onto a CD.¹²


    > ⁰Alternatively, if you have a DVD burner, and the machine onto which you plan
    to install Fedora has a DVD drive, you can download the DVD image (instead of
    the CD images) and burn it to one DVD in the same way you''d burn a CD.


    > ¹http://snoekonline.com/iso.htm


    > ²If your CD burning program cannot burn ISO images, CDBurnerXP Pro [http://www.cdburnerxp.se/]
    is simple to use, and on all versions of Windows.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 1: Building the Linux Environment


    Using Fedora on CD will cost you a little, but it''s quicker and easier than downloading
    the images if you don''t have a fast broadband connection (the four CDs total
    almost 2.5GB). You can buy Fedora Installation CDs from any number of vendors,
    of whom will cost you more than the cost of the blank CDs, plus postage and packing;
    the easiest way to find these vendors is to search the Web for "cheap Linux CDs"
    in your country, or ask a local Linux User Group. This may well be the best way
    to get hold of the CDs if this is your first time running Linux.


    # The Installation


    To begin the installation, put the first installation CD in the CD-ROM drive and
    reboot the machine. If your machine is configured to boot from the CD-ROM, you
    will see the screen shown in Figure 1.1 when the machine starts.


    The initial installation offers several options. You can choose to install in
    graphical mode by hitting Enter, or in text mode by typing linux text at the boot
    prompt. Either way, the first thing the installer will do is offer to check the
    installation media for you. This is a good way to determine if your installation
    CDs have been tampered with, or have become corrupted. The process will take a
    little while, but I''d recommend that you run this test.


    Like any operating system, Linux requires a minimal set of hardware drivers during
    the installation. After testing the installation media, you''ll see lots of text
    scrolling down the screen—this is the initial hardware probing process in action.
    Red Hat helped pioneer the development of graphical Linux installers with Anaconda,
    Red Hat''s installation program. It includes a highly accurate probing and testing
    mechanism that makes the rest of the installation routine quite painless.


    Once all this media testing and hardware probing is done, you will finally see
    the Welcome to Fedora Core screen. Click the Next button to get started.'
  merge: -1
