    # Five-minute Samba


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_253_0.png)


    There are many ways to move files from Windows to Linux, but the easiest method
    is probably to use Samba to gain access to part of the filesystem as a Windows
    file share. To quickly get Samba sharing a user''s home directory, follow these
    steps:


    +   1. On your Linux server, start the Samba Configuration tool (Desktop > System
    Settings > Server Settings > Samba).


    +   2. Once the Samba Configuration tool loaded, select Preferences > Samba Users...,
    then click Add User. Select the user you''re interested in the Unix Username drop-down
    list, and enter the username and password you''ll use to access this from Windows.


    +   3. Back in the Samba Configuration tool, click Add Share, the Browse... button,
    and select the user''s home directory. Check the Writable and Visible checkboxes,
    and behind the Access tab, check the user you just created.


    +   4. You might also find it useful to review the Samba Server Settings by selecting
    Preferences > Server Settings. These settings depend largely upon your own Windows
    network settings.


    +   5. Next, we''ll need to allow access to Samba through the Firewall. Launch
    the Security Level Configuration tool (Desktop > System Settings > Security Level)
    and add 137:udp, 138:udp, 139:tcp, 445:tcp to the Other Ports list. Note that
    you should remove these ports once you''re done with Samba; leaving them open
    to connections from the Internet could pose a potential security problem.


    +   6. While in the Security Level Configuration tool, click on the SELinux tab,
    as illustrated in Figure 7.5. Under Modify SELinux Policy, locate the Allow Samba
    to share users home directories option.


    +   7. The last step is to start the Samba service. Open the Service Configuration
    tool from Desktop > System Settings > Server Settings > Services, locate the smb
    service, and start it.'
