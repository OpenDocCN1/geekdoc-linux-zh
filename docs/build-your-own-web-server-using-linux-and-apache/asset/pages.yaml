    click on it and select Allow Inbound Service for Everyone. As you define rules
    using this method, they will appear in the Policy screen, which you can use to
    manage your rules.


    # Remote Configuration? Be careful!


    > > WARNING

    > Be very careful if you''re configuring the firewall on a machine remotely from
    a different computer, since a mistake in firewall configuration can lock out the
    remote connection, leaving you unable to connect back to the server to correct
    the mistake!


    There are two types of rules that apply to incoming connections: those that allow
    connections only from certain machines—allow all connections from your main desktop
    machine, for example—which are displayed in the top half of the window, and those
    that allow connections only to certain ports—such as port 80 for Web servers—which
    are displayed in the bottom half of the window. This second type can be restricted
    to allow connections to a certain address, too.


