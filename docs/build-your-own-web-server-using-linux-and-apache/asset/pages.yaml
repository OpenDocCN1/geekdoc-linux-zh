  md: '# command


    Finally, similar to crontab, anacrontab specifies the command that will be executed.
    Again, Anacron will execute run-parts to work its way through the scripts in /etc/cron.daily.


    The operation of Anacron is pretty straightforward. When run, it reads the list
    of jobs from /etc/anacontab and checks whether or not each job has been run in
    the last specified number of days. If not, Anacron runs the job after waiting
    for the delay period. If the job has been run in the specified time period, it
    leaves it alone. It''s pretty simple.


    We can start the Anacron daemon using one of the service tools we looked at earlier
    in this chapter. By default, it should be set up to start with your machine, but
    you can change this setting if you like.


    # Running cron and Anacron Together


    > By both cron and Anacron are configured to run all of the scripts in the /etc/cron.schedule
    directories. However, only one of cron or Anacron will actually run the scripts.


    Each of these directories contains a script to keep Anacron up to date. For example,
    whenever cron runs the scripts in /etc/cron.daily, one of those scripts updates
    the file that Anacron uses to record when the task was last run. Later, when Anacron
    goes to run these scripts, it will see that cron has already run them, so it won''t
    run them again.


    # at


    Now, we''ve got cron to perform regularly scheduled tasks on your system. We''ve
    got Anacron to pick up cron''s slack if the machine isn''t up and running 24/7.
    That seems like a pretty full complement of task scheduling methods, doesn''t
    it? As true as that may be, we''re still left one piece out of the automated task
    puzzle:


    at is a classic Linux hack, intended to take up where other applications leave
    off. In the cases of both cron and anacron, it''s not a trivial task to add a
    simple, one-off to the schedule. Let''s say, for example, that you need to download
    a very large file, and you want to do it at a time when there''s no-one else on
    the network, so plenty of bandwidth is available. You could add an entry to /etc/crab,
    but you''d have to remember to remove it in order to avoid downloading the same
    file again in the future. at serves this niche purpose perfectly. Better yet,
    the syntax for using at couldn''t be simpler:'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Chapter 4: System Administration


    ```

    [kermit@swinetrek ~]$ at 3:00

    at> wget http://sitepoint.com/verylargefile.zip

    at> <EOT>

    job 1 at at 2005-12-31 03:00

    [kermit@swinetrek ~]$

    ```


    > > note <EOT> stands for end of transmission, and is triggered by hitting Ctrl-D.

    Use this to indicate that you have finished entering commands to be executed at
    the given time.


    at schedules the task for the next instance of the time you specify. In example,
    at would execute the given command at 3:00 a.m.


    # 24-Hour Time


    > > note Remember that at, like cron and Anacron, uses 24-hour time.


    In summary, if you''re looking to schedule tasks, Linux has you well covered.
    We have cron and Anacron for repeating tasks, and at for those one-off, occasional
    jobs.


    # Sending Email


    By default, mail on Fedora Core 4 is handled by the sendmail program. sendmail
    can be configured to perform very complicated tasks, like running all the email
    for a company or an ISP. Entire books can (and have) been written about it. However,
    you''re unlikely to want to make your LAMP server double as your mail server,
    and you''re already likely to have a mail server. Some services on your LAMP server
    will generate email; for example, if a job fails, it will often email a description
    of its error to root@localhost, the root user''s account''s mailbox. That mail
    needs to be read, sometimes urgent, and it would be a pain to have to log in to
    your server to do so. The best approach is to ensure that all mail goes to your
    Web server is sent to an address at which the system administrator can read it.
    We will set up the Web server so that all the mail it receives is forwarded automatically
    to another email address.


    # The aliases File


    Mail direction is controlled by the file /etc/aliases, which is shown below.'
