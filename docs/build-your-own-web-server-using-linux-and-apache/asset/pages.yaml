    # Enterprise Backup Solutions


    Linux is very well supplied with "enterprise level" backup tools. A description
    of

    how to create a backup strategy in a multi-operating-system, multi-server envir-

    enment what would constitute a book in itself, so here I''ll simply provide some

    pointers for further reading.


    If you''re looking to implement an enterprise level backup strategy from scratch,

    y should investigate Bacula or AMANDA. Both these tools are capable of

    being the centerpiece of a full enterprise backup strategy, and both are open-

    source. A of commercial tools that may already be in use in your enterprise

    environment are also available on Linux. Veritas Backup, a commonly used tool

    in industry, can run on and back up Linux servers as well as Windows; another

    power commercial tool is Arkeia.


    # Log Files


    Most of the services running on your LAMP server will keep logs of their activities,

    usually in the form of text files in the /var /log directory. Services can either
    log

    the outputs in the system log var/log messages, or in specific logs kept for

    individual services. Some of the logs that you may find useful include:


    ```

    /var/log/messages

    ```


    This is the system log, which contains messages from the kernel itself, and

    well as those from a number of system daemons.


    The system log is a useful place to look if you suspect that your machine has

    low-level issues: that Linux itself is causing the problem, rather than one of

    the programs you have running on it. Lots of programs write to the system

    log, making it a constant stream of "chatter" about low-level processes that

    occur on the machine. It''s often incomprehensible, but it''s worth looking

    into, because the system log may provide clues about what the machine was

    doing when the problem occurred.


    +   ⁵ http://www.bacula.org

    ⁶ http://www.amanda.org

    ⁷ http://www.veritas.com/linux

    ⁸ http://www.arkeia.com'
