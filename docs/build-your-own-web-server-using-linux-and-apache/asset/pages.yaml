    ```


    To enable the service, use:


    ```

    [root@swinetrek kermit]# /sbin/chkconfig sm on

    [root@swinetrek kermit]#

    ```


    The chkconfig --list command displays a list of all the services on the machine,
    showing whether each is enabled or disabled.


    # Snort


    Snort is an Intrusion Detection System, or IDS. An IDS monitors incoming network
    traffic and looks for things that seem suspicious. For example, Snort will watch
    incoming Web requests and match those requests against its database of known vulnerabilities;
    if a request looks suspicious, it will record specific details in its log files.
    This can help you to detect a compromise quickly after it happens, and take immediate
    steps to fix the problem.


    # Installing Snort


    Snort isn''t part of the Fedora archive, but it''s available from the Snort project''s
    Website.¹ Follow the Download link, and look for the pre-compiled binary packages.
    At the time of writing, Snort is only available as an RPM package for Fedora Core
    3, but this package installs fine on Fedora Core 4.


    While you''re at the Snort Website, you should also download a set of Snort rules;
    there''s a big orange link on the right-hand side of the download page. Snort
    rules are configuration files that tell Snort what to look for when it searches
    for evidence of intrusions. Three official rule sets are provided by Sourcefire,
    the company that maintains Snort: the subscription release, which contains the
    very latest rules, but requires a paid subscription; the registered user release,
    which contains


    > ¹http://www.snort.org/'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Chapter 9: Server Security


    the latest rules five working days after they appear in the subscription release,
    and only requires a free registration; and the unregistered user release, which
    is updated with every major release of Snort. There is also the "community rules"
    release, which contains rules that are contributed by the Snort user community,
    and have been only briefly tested by Sourcefire. Download the set of rules that
    you''re most comfortable with. I''d recommend the registered user release.


    # Keeping Snort Up to Date


    Snort rules are being constantly updated by Sourcefire; you should check for new
    rules at least once a week.


    # Setting Up Snort


    The Snort RPM installs Snort with a good initial configuration: you shouldn''t
    need to change too much to have the program running useful. It''s possible to
    configure Snort in many different and complicated ways; the Snort manual and FAQ,
    available from the Snort project''s Website, will help. For the moment, we''ll
    work with the default configuration, except for a couple of things. First, Snort
    needs to know your local network is, so that it doesn''t alert you to "suspicious"
    traffic originating from the local network, and we should set up Snort so that
    it uses its full logging mode to provide you with the most useful information
    it can.


    Open the file /etc/snort/snort.conf in a text editor and locate the following
