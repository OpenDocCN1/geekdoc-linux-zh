    # Automating Routine Tasks


    Computers are intended to do tasks for us. We spend much of our computing lifetimes
    repeatedly performing the same tasks, many of which are, in the end, rather mindless.
    System administration can sometimes become a chore full of tedium and routine:
    the same keystrokes, the same checks, the same results. Wouldn''t it be ideal
    if we were to put the computer to its intended use, and have it do these things
    for us?


    Linux provides an abundance of ways to automate tasks. Shell scripts help, but
    the real power lies in two particular facilities: cron and, to a lesser extent,
    at. These are tools you''ll rely upon to perform such routine tasks as archiving
    logs, updating the system database with newly installed applications, writing
    server statistics and much, much more.


    # cron


    cron is a Linux system daemon that executes scheduled scripts. The cron daemon,
    or cron, runs as a service that starts when your system starts. Every minute,
    it checks its own schedule database for tasks that need to be performed.


    The heart of cron is the /etc/crontab file, which is shown below from the default,
    unaltered Fedora Core installation:


    ```

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=root

    ```'
