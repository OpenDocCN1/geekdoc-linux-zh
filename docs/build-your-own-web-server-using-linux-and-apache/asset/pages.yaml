  md: '# Figure 5.13. Changing the performance tuning options.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_200_0.png)


    The final tab in the HTTP configuration tool, shown in Figure 5.13, provides several
    performance tuning options. These include the number of simultaneous server connections,
    the connection timeout in seconds, the maximum number of simultaneous requests
    per connection, and whether or not to allow persistent connections. By default,
    Apache will allow 150 connections simultaneously, generating up to 15,000 requests
    at once. While this figure may seem large, the fact is that most servers—even
    those with three- or four-year-old processors and minimal RAM—can handle this
    default. You can increase this number for your system by changing either the maximum
    connection number, or the maximum requests per connection. In most cases, reducing
    or increasing the acceptable number of requests per connection is the preferred
    adjustment.


    # Tuning Up


    Performance tuning in Apache can be an art unto itself. However, it''s easy to
    provide some rough guidelines for your server, based on the age of the machine,
    the amount of RAM, and the speed of the connection to which the server is attached.
    Let''s take three scenarios as examples:'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Chapter 5: Building The Server


    +   1. An old PC with 128MB RAM, connected via a slow ADSL connection.

    2. A reasonably new PC with 256MB RAM, also connected via ADSL.

    3. A new PC with 512MB RAM, connected to the ''net via a T1 connection.


    In the first scenario, the appropriate connection settings in Apache might be:


    +   - Max Number of Connections: 50

    - Connection Timeout: 100

    - Max requests per connection: 50

    - Allow persistent connections: off


    The second scenario, on the other hand, might best support these conditions:


    +   - Max Number of Connections: 150

    - Connection Timeout: 300

    - Max requests per connection: 100

    - Allow persistent connections: on


    The second machine has more RAM, so it''s capable of handling more connections.
    As a result, the connection timeout can be slightly longer, too. However, because
    of the connection speed, it may not handle persistent connections, or high numbers
    of requests per connection, very well.


    The third machine can easily handle the default settings:


    +   - Max Number of Connections: 100

    - Connection Timeout: 200

    - Max requests per connection: 50

    - Allow persistent connections: off


    Additionally, because of the higher connection speed, it may be acceptable to
    allow persistent connections on this machine. As you can see, there''s a lot of
    trial and error involved in properly adjusting Apache''s performance settings.'
  merge: -1
