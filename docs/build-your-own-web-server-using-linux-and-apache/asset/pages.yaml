- img_proc: true
  md: '# Webmin Features


    along the way, an administrator has access to a full complement of tools with
    to manipulate MySQL, its databases and tables; you can drop a database or table,
    create a database backup, create a new database or table, execute SQL statements,
    and more.


    # Postfix Configuration

    QMail Configuration

    Sendmail Configuration


    Webmin provides the means to configure several mail servers. Sendmail is the longest
    standard for Linux, while Postfix and Qmail are newer, and more easily configured
    alternatives. The Webmin interfaces for these servers provide all the tools necessary
    to configure and secure your mail server.


    # ProFTPD Server

    WU-FTP Server


    ProFTPD and WU-FTP are the two FTP services that can be configured via the default
    Webmin installation. Administrators can use these tools to add or remove FTP users
    and establish user home directories.


    # SSH Server


    SSH is the secure shell. It allows remote users to work within the shell environment
    on the server over a secure connection. The SSH Server module of Webmin allows
    you to configure authentication, access control, and much more. We''ll take a
    detailed look at SSH in Chapter 7.


    # Samba Windows File Sharing


    We briefly discussed Samba back in Chapter 4. Samba is a utility for sharing files
    and printers with Windows machines on the network. The Windows File Sharing page
    in Webmin displays current shares, and allows you to create new shares, and configure
    or reconfigure all the working parameters new and existing shares.


    # SpamAssassin Mail Filter


    SpamAssassin is a robust tool to fight spam email. The SpamAssassin Mail Filter
    module in Webmin allows you to configure many aspects of SpamAssassin, including
    what is done with messages identified as spam email.


    # Webalizer Logfile Analysis


    Webalizer is a Web server log analysis tool. It can provide you with interesting
    and valuable insight into the usage of your server, and it is included in the
    default installation of Fedora Core 4. The Webalizer Logfile Analysis'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Chapter 6: Server Administration


    page in Webmin allows you to determine which log files will be analyzed, add new
    files for analysis, schedule regular analysis, and to manually generate a new
    log analysis report.


    # Networking Group Modules


    Given the fact that you''ve created a Web server, the networking features of your
    machine are especially important. Webmin''s Networking module group, pictured
    in Figure 6.9, includes modules for administering firewalls and other security
    features, bandwidth monitoring modules, and several special protocols for allowing
    access to the server machine.


    Figure 6.9. Webmin modules available in the Networking group.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_227_0.png)


    # Bandwidth Monitoring


    This page provides information about traffic received by the server, using iptables
    rules and a package called mrtg that''s built into the default installation of
    Fedora Core. mrtg provides a graphical representation of server traffic


