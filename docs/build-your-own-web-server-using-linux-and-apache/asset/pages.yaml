  md: '# 3


    # The Command Line


    So far, our interactions with Linux have been through a pretty desktop environment,
    and it''s been reasonably easy for experienced Windows users to get their heads
    around the system. Things haven''t always been this way, though: the roots of
    the Linux user interface are firmly stuck in its command line.


    # What is the Command Line?


    Unlike Windows, the GUI is completely optional in Linux. If you''re feeling particularly
    competent, or you have certain requirements (or very old hardware), you can run
    your Linux machine with no graphics at all. As Linux has evolved, a variety of
    GUIs have been built on top of it, the command line remains the administrator''s
    best friend: a quick, easy, powerful way to perform actions that aren''t always
    easily available from the desktop.'
  merge: -1
