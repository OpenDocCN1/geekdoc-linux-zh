  md: '# # Introduction


    More organizations install Linux into their server rooms every day. The reasons
    for this vary, but those who make the switch to Linux often claim that its reliability,
    cost, choice, scalability, and the freedom it offers from vendor lock-in, are
    some of the reasons why they decided to switch. But, whatever your reasons for
    choosing Linux, as system administrator, you need to know what to do with these
    new servers.


    This book gives you the knowledge you need to build, configure, and maintain servers
    running the LAMP (Linux, Apache, MySQL, and PHP) open source Web application platform.


    In these pages, we''ll show you how to build a server, and help you decide which
    flavour of Linux suits your situation. You''ll learn how to set up Apache to serve
    Websites, MySQL to store data, and employ PHP to build Web applications. You''ll
    also discover how to secure your new LAMP server, and how best to access and control
    it both on site, and remotely.


    Everything you''ll need to build and maintain your Linux servers, and to deploy
    Web applications to them, is contained in these chapters. Enjoy!


    # # Who Should Read This Book?


    If you know what it''s like to be a systems administrator, but don''t know Linux,
    this book is for you.


    If you''re currently thinking about introducing Linux to your firm on a trial
    basis—perhaps to run some Websites, or because your development team keep banging
    on you at to let them use Apache—this book will give you the grounding you need
    to successfully build Linux servers and keep them running.


    You and your organization can enjoy the stability and ease-of-use of a free operating
    system and tools that are compliant with open standards. This book will show you
    how.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# What’s In This Book?


    Chapter 1: Building The Linux Environment

    We kick off by discussing what Linux is, and seeing how easy it is to set up a
    Linux server we choose. I''ll walk you through a review of the hardware you''ll
    need before we choose which flavour of Linux we''ll install. In making this decision,
    we''ll explore the alternatives, and I''ll provide a few tips on how to ensure
    you make the right decision. By the chapter''s close, you''ll have installed Linux
    successfully on your server.


    Chapter 2: Day-to-day Usage

    This chapter explains how to run and manage your Linux server on a daily basis.
    In particular, we will discuss the key differences between Linux and Windows systems.
    You''ll finish up with a solid grounding in the essentials, including filesystems
    and layout.


    Chapter 3: The Command Line

    The command line is one of the most powerful aspects of Linux. While it''s easy
    to use Linux''s graphical tools—tools that allow us to achieve most of our goals—the
    command line gives us an extra level of control over our systems. In this chapter,
    we''ll identify those extra capabilities, and discuss the command line''s advantages
    over the GUI.


    Chapter 4: System Administration

    Linux system administrators must be comfortable with creating new users, and scheduling
    tasks to run unattended, as well as concepts like services and runlevels. In this
    chapter, we discuss the lot as we take a tour of the Linux system administrator’s
    toolkit.


    Chapter 5: Building The Server

    It''s time to turn our Linux server into a LAMP server as we install Apache, MySQL,
    and PHP. We''ll explore some of the basics of Apache itself, including how it
    works, and how it fits into the Linux environment. Then, you''ll see how to configure
    Apache on setup, how to set secure (SSL/https) access for your Websites, and how
    to add MySQL and PHP to the mix.


    Chapter 6: Server Administration

    This chapter focuses on a selection of handy tools that will help you to configure
    your LAMP server and add new packages to it. In particular, we discuss Webmin,
    which facilitates the Web-based configuration of services, and yum, which helps
    with package installation.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Chapter 7: Remote Administration


    Remote administration makes the job of the Linux system administrator much easier.
    In this chapter, we''ll get a feel for working with SSH—the secure shell—which
    allows command line access to a server across the network, and VNC, which enables
    you to access your LAMP server GUI. We''ll discuss which tools are best used in
    particular situations, and look at some of the extra functionality that SSH offers
    above and beyond its primary job as a command-line shell.


    # Chapter 8: Occasional Administration


    "Occasional Administration" encompasses those system elements that you''ll likely
    need to set up, then tweak only occasionally. After an introduction to backup
    tools, we set up Web traffic reporting, which will help us understand the nature
    of the visitors your server receives. We also take a look at the log files that
    the system creates, and discuss how these can be used to track and manage server
    usage, identify errors, and more.


    # Chapter 9: Server Security


    Security is a critical aspect of running any server, but it''s particularly important
    for those that offer services over the Internet. In this chapter, we set up a
    firewall on our LAMP server, and intrusion detection services as a means to identify
    remote cracking attempts. We''ll also meet Tripwire, a security system that protects
    against malicious users compromising the server if they somehow manage to gain
    access.


    # Appendix A: Command Line Reference


    As we step through the process of setting up your server, you''ll be introduced
    to a number of powerful command line tools. This appendix lists the useful tools,
    and some of the options that can be used to customize the behavior.


    # Appendix B: Troubleshooting


    Our tour concludes with some troubleshooting and an FAQ section that provides
    answers to common questions about Linux, Apache, and the other tools you may have
    installed.


    # Linux and Distributions


    If you''re being very technical, Linux is just the operating system kernel: the
    bit at the very lowest level of your software that talks directly to the hardware.
    All the other programs—the graphical interface, the Apache Web server, MySQL—'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    the menus at the top of the screen—they''re all separate, open-source programs,
    coded by different teams of developers, and released at different times. It''s
    possible to build your own Linux system out of these disparate parts, but it''s
    a long and complicated job. Instead, various groups and companies have taken on
    the role of providing a Linux distribution (sometimes shortened to distro): they
    collect all the bits of software you need, make sure they fit together correctly,
    and give them all to you in one go. There are many, many Linux distributions.
    Some have specialized purposes: the distributor has made sure that the distribution
    contains software suited to musicians, for example, or medical personnel, or security
    analysts, or that the distribution is designed to run directly from CD, or from
    a USB drive, or without a graphical interface. Most, though, are general: they''re
    designed to cover all bases.


    # General-purpose Distributions


    Some of the most popular distributions are Debian, Canonical''s Ubuntu Linux,
    Novell''s SuSE Linux Desktop, Knappix, Linsetpos, and Red Hat''s Enterprise Linux
    and Fedora Core distributions. Some distributions contain proprietary software,
    and require a licence fee; others do not. Each has its merits, and its proponents.


    Debian has a very strong free-software ethos, and an excellent packaging system
    (apt) which has been emulated by most other distributions. Ubuntu Linux is derived
    from Debian, but places a much stronger focus on being a good desktop distribution.
    Novell''s SuSE Linux has a commercial edge to it, mixing open-source and proprietary
    tools; Novell is a relatively new player in the Linux sphere, SuSE Linux has been
    around for some time. Red Hat Enterprise Linux also has a commercial edge, and
    colors favored to desktops and servers. Development of Red Hat Enterprise Linux
    is in part driven by the community spirited Fedora Core. Linsetpos is heavily
    focused on home users; like SuSE, it makes open-source tools with proprietary
    software, and is oriented towards a desktop operating system. Knapp is unusual
    in that is not designed to be installed and run; instead, it comes on, and runs
    entirely from, a so-called "Live CD". You can simply put the CD in boot up to
    obtain all the benefits of a working Linux computer without losing or overwriting
    your existing system or files. It''s perfect for testing hardware, or getting
    familiar with the Linux environment without taking the ultimate plunge and installing
    the system from scratch.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Fedora Core


    In this book, we''ll be focusing on Fedora Core 4, from Red Hat. The Fedora distribution
    is very current, so you''ll have all the latest tools at your disposal, and boasts
    a wide portfolio of compatible software. Red Hat employs many notable open-source
    developers to work on distributions, and Fedora receives the benefits of this
    work, while still remaining open-source and community-maintained. Using Fedora,
    you can enjoy these benefits: you''ll have the most robust, modern tools at your
