  md: '# Skipping Username


    To avoid entering your username, enter **username@servername** in the Host Name
    (or IP address) field.


    When you first connect to your server, you''ll see the PuTTY Security Alert dialog
    illustrated in Figure 7.2. This is PuTTY''s somewhat convoluted way of asking
    you to confirm that this is the server key you''re expecting.


    # Figure 7.2. The PuTTY Security Alert.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_250_0.png)


    # Host Keys


    Each SSH server has a unique **host key**. When you attempt to connect to a machine,
    PuTTY (or whichever SSH client you''re using) checks the host key of that machine
    is the same as the last time you connected to it. This provides excellent protection
    against malicious parties pretending to be your server, but also poses a problem:
    does the SSH client know what the server''s host key is the first time it connects?
    The answer is that it doesn''t. The first time you connect to a machine, the SSH
    client will notice that it doesn''t have a host key for that machine; it will
    ask you (usually a little critically) whether it''s ok to connect.


    Part of this message will include a **key fingerprint**, which is an abbreviated
    version of the host key. To find out what a server''s key fingerprint is, run
    the command `ssh-keygen -l -f /etc/ssh/ssh_host_rsa_key` on that server.'
  merge: -1
