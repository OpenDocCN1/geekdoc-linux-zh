  md: '# # Using the Command Line


    When you use the Linux command line, you''re opening what can be thought of as
    an alternative window to the operating system—an alternative window through which
    you have access to much more powerful, lower level operating system functions.
    Graphical tools don''t provide that power. A graphical environment is merely a
    high-level abstraction of an operating system environment, and the icons and menus
    to which we''re all so accustomed provide only limited access into that environment.
    Those icons and menus represent operating system functions, but they''re not the
    actual functions. In other words, graphical interfaces provide a limited, additional
    layer between operator and operating system, in which restricted range of functions
    are represented by pretty pictures. To administer your Web server with maximum
    efficiency, it''s useful to be able to work at the same level as your system.


    # ## High and Mighty, or Down and Dirty


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_106_0.png)


    When we talk about ''high level'' and ''low level'' functions, we imply a hierarchy
    of functionality. Functions of the lowest level communicate with the kernel directly,
    and therefore have great power and flexibility: higher level tools do more work
    themselves, offering more functionality and increased safety. Compare, for example,
    the low level rm command with the higher level Trash functionality in Nautilus.rm
    simply deletes a file: it''s quick and easy, and there''s no easy or guaranteed
    way to recover that file. Nautilus insists that you move files to the Trash, effectively
    marking the file for potential deletion. The deletion itself doesn''t occur until
    you go to the desktop and empty the trash.


    # # Logging in as root


    We''ve already talked about logging into Linux as root. To do so from the GNOME
    terminal, you''ll enter the su (switch user) command.


    ```

    [kermit@swinetrek ~]$ su

    Password:

    ```


    You''ll be prompted for the root password. Once you''ve entered it, you''ll gain
    full access to the system: computing omnipotence! Use it wisely. Although there
    are certain things that can only be done as root, including many of your system
    administration tasks, it''s important to observe good Linux hygiene: don''t remain
    logged in as root longer than you need to. Every Linux administrator has a horror
    story of a time when, logged in as root, he or she mistyped a command'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Chapter 3: The Command Line


    and deleted everything on the machine (or some similar calamity). You want to
    avoid such disasters. Be careful, and don''t stay logged as root if you don''t
    need to be. To switch back to your standard user account, use the exit command.


    # Some Practical Examples


    Let''s look at a few examples of the command line in action.


    # Orienting yourself with the pwd Command


    ```

    [kermit@swinetrek ~]$ pwd

    /home/kermit

    ```


    # Home, Sweet Home


    Your directory, /home/username, is often referred to as ~. Did you notice the
    - in the command prompt? It indicates that you''re currently in your directory.
    As we begin to navigate the filesystem, we''ll see this command prompt change
    to reflect the name of the directory in which we''re working. Thus, we won''t
    have to constantly enter pwd to find out where we


    # Listing Files with the ls Command


    The ls (which stands for list) command, used by by itself, lists the contents
    of the working directory.


    ```

    [kermit@swinetrek ~]$ ls

    Desktop Hello World.txt

    ```


    You can retrieve a list of the files in another directory by adding the directory
    name to the command line. For example, ls / will return a listing of everything
    in the root directory.


    ```

    [kermit@swinetrek ~]$ ls /

    bin dev home lost-found misc net proc sbin srv tmp var

    boot etc lib media mnt opt root selinux sys usr

    ```'
