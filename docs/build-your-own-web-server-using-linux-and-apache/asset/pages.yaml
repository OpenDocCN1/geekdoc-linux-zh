    # Starting Up and Shutting Down


    Because Linux is a true multi-user system, you''ll need to log into your system
    account before you use the system. In GNOME, the default application for handling
    this task is the GNOME Display Manager (GDM). The GDM login screen will open after
    all your system''s devices and drives have been properly mounted. You''ll log
    in to the system using the account name and password you created after installation.'
