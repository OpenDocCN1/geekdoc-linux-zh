  md: '# Chapter 7: Remote Administration


    On the Linux server, create a directory named .ssh if it doesn''t already exist.
    We can''t create this directory from Windows as Windows'' file naming rules forbid
    directory starting with a period. This directory also needs to have very specific
    permissions: read, write, and execute permissions disabled for everyone but the
