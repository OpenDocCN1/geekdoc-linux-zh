  md: '# Hardware Compatibility Lists


    Red Hat''s Hardware Catalog doesn''t extend beyond RHEL to the Fedora releases,
    which is something that you''ll need to remember when looking to the Red Hat site
    for Fedora support. The list provides information on CPUs, video cards, SCSI controllers,
    IDE controllers, network cards, modems, and sound cards.


    # SuSE


    SuSE offers two lists: the Express Search² and Extended Search.³ The difference
    between the two is that the Extended Search offers fields beyond Vendor, Device,
    and Category. In practice, you''re likely only to need the Express Search.


    # Mandriva Linux


    The Mandriva Linux Hardware Compatibility Database⁴ is a very comprehensive list
    of hardware that has been tested by the Mandriva Linux community.


    # General Linux


    The Linux Hardware Compatibility HOWTO⁵ is perhaps the most comprehensive of the
    high-level Linux lists. It was begun in 1997 and is updated as often as twice
    annually. It provides information on all device types and all major manufacturers.


    Aside from providing interesting and useful user forums, LinuxQuestions.org provides
    an outstanding list of Linux-compatible hardware.⁶ This is the most-to-date of
    the high-level Linux lists, with updates appearing daily where applicable. While
    it''s not as comprehensive as the HOWTO, the LinuxQuestions list is easily as
    important because of its timeliness.


    Linux Compatible⁷ provides both updated lists, and forums in which users can help
    others resolve existing hardware issues.


