  md: '# Using Firestarter


    Firestarter''s main window has three tabs: Status, Events, and Policy. Status
    and Events are for monitoring the firewall; they show whether it is currently
    enabled, which network traffic it has blocked, and so on. Policy displays the
    existing firewall rules, and allows you to configure new ones. By looking at the
    policy screen shown in Figure 9.6, we can see that no rules are currently defined—all
    traffic is blocked.


    # Figure 9.6. The Firestarter Policy screen.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_301_0.png)


    If you try to log into the computer via SSH or load up the Website hosted on this
    computer, the blocked requests will be listed in the Events screen, as shown in
    Figure 9.7.'
