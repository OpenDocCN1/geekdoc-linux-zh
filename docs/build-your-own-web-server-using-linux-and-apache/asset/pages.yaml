  md: '# Webmin User Administration


    If other users are going to administer the system, it''s a good idea to create
    separate logins for each of those users. To add a new Webmin user, click the Webmin
    Users link on the main page, then click Create a New Webmin User from the resulting
    page. You''ll see the screen shown in Figure 6.3.


    Figure 6.3. Creating a new Webmin user.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_219_0.png)


    As you can see, many options are available in the creation of a new user. Here,
    we''ll cover two basic options: creating a Webmin-only user, and creating a Webmin
    user who''s synchronized with a Linux user.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'Creating a Webmin-only user is pretty straightforward. Fill out the Username
    field, select Set To... from the Password drop-down, enter the user''s password,
    and leave the default settings in the other fields. Down the page, in the Modules
    section, you''ll see a collection of checkboxes that allow you to specify the
    features to which this user will have access. Check the appropriate checkboxes
    (or click the Select all link to select all of the checkboxes), and click the
    Save button at the bottom of the page.


    Creating a Webmin user profile that''s synchronized with a Linux user profile
    is a similarly straightforward process. Enter the Linux''s username into the Username
    field, and select Unix authentication from the Password drop-down. Don''t enter
    a password: this will be taken from the Linux user profile. Select the appropriate
    module checkboxes, and click Save to create the user.


    In keeping with the Linux model, Webmin users can be grouped, and access can be
    assigned to these groups. To create a new Webmin group, click the Create a new
    Webmin group link on the Webmin Users page, and select the modules to which that
    group will have access. Existing users can be added to the new group from their
    user page—just click on the username and the Member of group drop-down will appear
    in the top-right corner.


    # Step up to Security


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_220_0.png)


    There are many other steps that you should take to effectively secure the installation
    of Webmin if you intend to use it on your server. Most of these steps are outlined
    in The Book of Webmin (Or: How I Learned to Stop Worrying and Love UNIX).^2


    # Webmin Features


    The real beauty of any Web-based tool is usually its interface, and this is certainly
    the case with Webmin. As the browser is one of the most well-known interfaces
    in computing these days, the learning curve involved in moving around within the
    Webmin interface is minimal. The Web-based nature of Webmin also allows an administrator
    to perform necessary tasks from anywhere on the network, or—provided the package
    is properly installed and secured—from anywhere in the world.


    > ^2 http://www.swelltech.com/support/webmingguide/'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Chapter 6: Server Administration


    Figure 6.4. The Webmin sections.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_221_0.png)


    The Webmin modules are broken into several groups, which can be accessed via the
    icons at the top of the Webmin interface, shown in Figure 6.4. Let''s take a look
    at the modules behind four of the most important groups for server administration:
    System, Servers, Networking, and Hardware. We''ll use these modules in later sections
    of this chapter, so consider the next few pages an overview of the features offered
    by Webmin.


    Figure 6.5. Webmin modules available in the System group.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_221_1.png)'
  merge: -1
