  md: '# # Configuring Apache


    All we need to do now is to configure Apache to use these certificates instead
    of the dummy certificates that are included with Fedora Core. Make a backup of
    /etc/httpd/conf.d/ssl.conf, open the original file in a text editor, and locate
    the lines shown below.


    ```

    File: /etc/httpd/conf.d/ssl.conf (excerpt)

    # Server Certificate:

    # Point SSLCertificateFile at a PEM encoded certificate.

    # the certificate is encrypted, then you will be prompted for a

    # passphrase. Note that a kill -HUP will prompt again.

    # certificate can be generated using the genkey(1) command.

    SSLCertificateFile /etc/pki/tls/certs/localhost.crt

    # Server Private Key:

    # If the key is not combined with the certificate, use this

    # directive to point to the key file. Keep in mind that if

    # you''ve both a RSA and a DSA private key you can configure

    # both in parallel (to also allow the use of DSA ciphers, etc.)

    SSLCertificateKeyFile /etc/pki/tls/private/localhost.key

    ```


    Here, SSLCertificateFile is the name of the public certificate file, and SSLCertificateKeyFile
    is the name of the private key. Edit the file so that these lines refer to the
    files created by genkey.


    ```

    File: /etc/httpd/conf.d/ssl.conf (excerpt)

    # Server Certificate:

    # Point SSLCertificateFile at a PEM encoded certificate.

    # the certificate is encrypted, then you will be prompted for a

    # passphrase. Note that a kill -HUP will prompt again.

    # certificate can be generated using the genkey(1) command.

    SSLCertificateFile /etc/pki/tls/certs/www.mycompany.com.com

    # Server Private Key:

    # If the key is not combined with the certificate, use this

    # directive to point to the key file. Keep in mind that if

    # you''ve both a RSA and a DSA private key you can configure

    # both in parallel (to also allow the use of DSA ciphers, etc.)

    SSLCertificateKeyFile /etc/pki/tls/private/www.mycompany.com.com

    ```


    Save your changes and restart Apache using the apachectl command.'
  merge: -1
