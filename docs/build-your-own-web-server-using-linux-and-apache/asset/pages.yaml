    You can just skip this screen for now.


    Congratulations, you''ve now set up a Linux server! The graphical installation
    provides new Linux users with a manageable set of tools to get the system up and
    running. However, there are cases in which the text mode installation is a quicker
    and more efficient means to the same end. Let''s take a look at the text mode
    installer now.


    # Text Mode Installation


    Using the text mode installer doesn''t have to be an intimidating process: it
    provides all the tools available in the graphical installation, and follows the
    same general flow and logic, but it lacks a pretty interface. You shouldn''t need
    to use the text-based installer unless your chosen LAMP server has less than 128MB
    of memory, and for the purposes of this book, the use of such a server is not
    recommended, as the graphical environment will run very slowly. Most administrators
    who install Linux on a machine with such little memory do not intend to use the
    graphical interface to control the machine from the command line. This is useful
    for experienced administrators, but it''s not a good introduction to Linux if
    you''re new to the operating system.


    If you''ve chosen this path, you''ll need to adjust to using the keyboard, rather
    than the mouse, to navigate through the text screens. Navigation is accomplished
    primarily with three keys: Enter, Tab and the space bar. Enter will confirm your
    choices, Tab will allow you to move between choices, and the space bar will allow
    you to select options within these choices.'
