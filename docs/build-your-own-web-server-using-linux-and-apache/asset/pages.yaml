- img_proc: true
  md: '# System Group Modules


    The System Group provides access to important system-wide configuration tools,
    as shown in Figure 6.5.


    # Startup and Shutdown


    This tool displays a list of all services, describes each, and identifies whether
    or not that service is currently configured to start at boot. This page allows
    you to start and stop these services, and configure them to start (or not start)
    when the system starts. Toward the bottom of the page is a drop-down list of all
    the runlevels; you can use this to view and configure what happens at each runlevel.
    Finally, you can use this screen to shut down or reboot the system.


    # Change Passwords


    This tool displays a list of all users, and allows an administrator to change
    the password for each.


    # Disk and Network Filesystems


    This tool provides a description—and identifies the current status—of the various
    filesystems on the server. It also provides the ability to mount and unmount filesystems
    and mount new filesystems.


    # Filesystem Backup


    This tool displays a list of all the currently configured filesystem backups,
    and provides the administrator with a means to create new backups. These backups
    are created either with the dump command, or as TAR archives.


    # Running Processes


    This tool lists all the processes running on the system, along with each process''s
    Process ID (PID), the process owner, and the command used to start the process.
    By default, the processes are displayed in a hierarchy, but the display can be
    sorted by user, memory use, and CPU time; it''s searchable. You can also use this
    module to execute a command as a specified user.


    # Scheduled Commands


    This tool displays all the currently defined at jobs, and provides a page on which
    you can define more.


    # Scheduled Cron Jobs


    All the cron jobs that are active on the server are displayed in this tool; it
    also allows you to create new jobs.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Chapter 6: Server Administration


    # Software Packages


    This tool provides an interface that allows you to search for RPM packages installed
    on the system. Also provided are tools to install new packages, upgrade existing
    packages, and to search for individual file elements of an installed package.


    # Users and Groups


    This tool provides a full complement of tools to manage users and groups, including
    a tool to manage multiple users at once using batch files.


    # Servers Group Modules


    Figure 6.6. Webmin modules available in the Servers group.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_223_0.png)


    204'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'Webmin''s Servers modules, pictured in Figure 6.6, allow you to configure and
    maintain several different software packages that act as servers for other client
    applications. We''ll use Webmin to configure several of these packages later in
    this chapter, and to establish a strong level of system security later. For now,
    let''s walk through some of the features of the Servers section of Webmin.


    # Apache Web Server


    The Apache module, like many of the modules in the Servers group, contains so
    many options that it''s almost another module group in itself. It offers the ability
    to edit the httpd.conf file via the Edit Config Pages. You can see some of the
    other options offered in the Apache module in Figure 6.7.


    Figure 6.7. The Apache Webserver Webmin module.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_224_0.png)


    # CVS Server


    CVS (Concurrent Versioning System) is a tool that''s used widely by developers
    to track changes in code. The CVS Server page provides options for creating CVS
    users, user access control, and server configuration. It also allows'
  merge: -1
