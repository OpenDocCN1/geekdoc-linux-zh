  md: '# Some Practical Examples


    Using ls by itself will show you the names of the files contained in a folder,
    but little more. To view all of the files'' details, we can add the -l option
    to the command, which returns a longer listing.


    ```

    [kermit@swinetrek -]$$ ls -l

    total 16

    drwx-xr-x 2 kermit 4096 Sep 5 14:21 Desktop

    -rw-rw-r-- 1 kermit kermit 13 Sep 8 07:30 Hello World.txt

    ```


    There''s plenty of information here.


    +   - The first column presents the permissions for each file in the format discussed
    in Chapter 2. The first character tells whether it is a directory; the next nine
    characters show whether or not read, write, and execute permissions have been
    granted to the owner, group, and others.


    +   - The next column is really only useful for directories; it reflects the number
    of files inside a directory. For files, this number will be 1.


    +   - The next two columns identify the owner and group assigned to the file.
    In this case, they''re both kermit.


    +   - Next, we see the date and time at which the file was last modified. In the
    example above, the Desktop directory was last modified on the September 5 at 2:21
    p.m.


    +   - Finally, we''re given the name of the file.


    ls -1 is so useful that Fedora Core includes a built-in shortcut to it: 11.


    Your home directory will contain a number of hidden files. In Linux, we can hide
    a file by starting its filename with a period: if we changed the name of Hello
    World.txt to .Hello World.txt, it would become hidden. It''s in these hidden files
    that programs store user-specific configuration information. To see hidden files,
    use the option (-a), which can be use in conjunction with the -1 option, or an
    option to 1.


    ```

    [kermit@swinetrek -]$$ ls -a

    total 212

    drwx------ 13 kermit kermit 4096 Sep 8 09:16 .


    drwxr-xr-x 5 root root 4096 Sep 6 13:48 ..

    ```'
