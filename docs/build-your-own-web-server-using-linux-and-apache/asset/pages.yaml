  md: '# Configuring Apache


    At first glance, configuring Apache can appear to be an intimidating process.
    The configuration file (httpd.conf) contains almost 1000 lines. The directives
    that actually configure Apache are buried deep among lines of comments, and while
    those comments are useful—and deserve some serious and thoughtful consideration—they
    help foster the myth that Apache configuration is a process best undertaken by
    administrative gurus. Frankly, this simply isn''t the case: Apache''s configuration
    directives are actually quite easy to understand. The flexibility of the available
    directives assures that the end result of your configuration can be as complex
    or as simple as your needs dictate.


    # Configuring the Apache Server using the HTTP Configuration Tool


    Whether you''ve installed the server via the RPM system, or taken the plunge and
    decided to configure and build the server from source, Fedora Core offers a set
    of graphical tools that can lessen the intimidation factor faced by those configuring
    Apache servers. The other major distributions also offer graphical tools: SuSE
    rolls the configuration into its YaST2 tool, and Mandriva offers a configuration
    tool in its Drak suite. As we''ve mentioned, Linux has matured to the point that
    most tasks can be achieved—at least in a fundamental way—with a strong set of
    graphical tools. In the case of Fedora, that tool is the HTTP configuration tool.


    To launch the HTTP configuration tool, select Desktop > System Settings > Server
    Settings > HTTP.


    # Beware of inadvertently overwriting your edits!


    The HTTP configuration tool makes direct edits to httpd.conf. Consequently, you
    should decide early on whether youll use the tool, or edit the configuration file
    manually. If you choose to manually edit first, then tweak with the HTTP configuration
    tool later, your initial manual edits will be overwritten by the tool. In fact,
    manual edits to the file at any point in the process will be overwritten by subsequent
    use of the HTTP configuration tool.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_186_0.png)'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Figure 5.3. The HTTP configuration tool.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_187_0.png)


    The Main tab of the HTTP configuration tool, displayed in Figure 5.3, provides
    the means by which you''ll set several critical parameters for your server.


    The first field on this screen is Server Name. If your server will be live on
    the Internet, the Server Name text box should contain the fully qualified domain
    name of the server such as www.mycompany.com. If, on the other hand, the server
    will be used only internally for testing and development, you can assign any recognizable
    name you choose in this text field. You can also assign an email address for the
    server''s Webmaster. You should enter the address of a working email account.


    Below these two fields is the Available Addresses section, where you can define
    the IP addresses and ports Apache listens on incoming requests. Listening to all
    available addresses on port 80 is the default behavior for the Apache server.
    If you''d prefer to specify the specific addresses and/or ports for your server
    configuration, use the Add..., Edit... and Delete buttons to manage this list.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Default Ports


    > note Port 80 is the default port for HTTP traffic; 443 is the default for HTTPS
    traffic. To send an HTTP request to another port, you must add :port-number to
    the server name in the URL. Entering http://www.my-company.com:1024/ into your
    Web browser will send a request to mycompany.com''s server port 1024.


    Configuring Apache to listen only to certain IP address and port combinations
    is especially useful when running multiple Websites from the same server. You
    may enter one site''s IP address and only allow traffic on port 80, but for another
    site, you may have two entries: one for port 80, and one for 443.


