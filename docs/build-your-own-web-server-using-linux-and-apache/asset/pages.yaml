  md: '# Server Administration


    Meeting the needs of your users, ensuring that the system is at full operational
    capability, and keeping up to date with any new security and feature patches:
    these are the tasks of daily server administration. Fortunately, tools to help
    automate and simplify these processes exist in abundance. The Linux system itself
    is chock-full of useful tools to make the administration of your server a reasonably
    painless task.


    In this chapter, we''ll look at Webmin—a third-party tool designed to ease the
    burden of keeping your server in a fully operational state—and yum, a command
    line tool designed to help you keep your system up to date.


    # Webmin


    Webmin is a browser-based system administration tool that offers a range of capabilities.
    The interface is easy to use, and while it offers a variety of tools itself, Webmin
    also supports plugins that can be used to extend and customize the program''s
    functionality. Webmin can help you perform the full range of administrative tasks,
    from user management to backups, and everything in between. Nearly every server
    I''ve built or administered over the past four years has contained a Webmin installation:
    it is really invaluable.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Chapter 6: Server Administration


    In this section, we''ll touch on some of the functionality that Webmin offers.
    For a more-in-depth look, I highly recommend the excellent title, The Book of
    Webmin (Or: How I Learned to Stop Worrying and Love UNIX).¹


    # Installing Webmin


    Webmin is available for download from http://www.webmin.com/ as an RPM package.
    You can choose to download the source code and compile Webmin for yourself, but
    with a Red Hat-based system like Fedora Core, the preferred method is to install
    the package using the RPM system. This will write an entry to the RPM database,
    allowing the easy upgrade and, if necessary, rollback or removal of the package
    later on. We''ll discuss these tasks a little later.


    # Getting the Right File


    Two RPM packages will be available at the Webmin site: webmin-ver-src.rpm (the
    source code package) and webmin-ver-sion.noarch.rpm, which is the installable
    version. Be sure to grab the installable package.


    To install the package, just double-click on the RPM file. You''ll be guided through
    a series of simple dialogs, and Webmin will be installed.


    # Webmin Basics


    Webmin installs a small, purpose-specific Web server on the machine on port 10000.
    You can access it via http://servername:10000.


    # Can''t Get Through?


    In order to access this Website externally, you''ll need to allow port 10000 access
    through the firewall. To do so, open the Security Level configuration tool from
    Desktop > System Settings > Security Level, and enter 10000:tcp in the Other fields.


    From this page, shown in Figure 6.1, you can log into Webmin by entering your
    root username and password. Once you do so, you''ll see the Webmin screen pictured
    in Figure 6.2.


    > ¹http://www.swelltech.com/support/webmingu/'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Figure 6.1. The Login to Webmin page.


