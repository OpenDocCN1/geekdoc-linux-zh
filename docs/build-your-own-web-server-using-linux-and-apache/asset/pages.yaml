  md: '# # Appendix A: Command Line Reference


    This appendix contains brief summaries of most of the command line tools mentioned
    throughout this book, and others that might be helpful, listed in alphabetical
    order. This reference is by no means comprehensive, but should serve as a helpful
    reminder of what the various commands and command line options do. For more information
    on any command, the Linux online manual, accessible via man `commandline`, is
    a great place to start.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_318_0.png)


    # ## Case Sensitivity


    Keep in mind that the Linux command line is case sensitive; the options -a and
    -A are not the same thing.


    +   **apachectl command**

    Control the Apache Web server''s HTTPd daemon. Note that in Fedora Core 4, this
    tool is located in `/usr/sbin`, which is not part of the default PATH.


    +   **start**

    Start the daemon.


    +   **stop**

    Stop the daemon.


    +   **restart**

    Stop and then start the daemon, killing all current sessions. This command is
    useful for making changes to `httpd.conf` take effect.


    +   **fullstatus**nstatus

    Display Apache''s current status. `fullstatus` includes a list of the current
    requests being serviced; status does not.


    +   **graceful**

    Wait until all current requests are serviced, then restart the daemon.


    +   **configtestest**

    Test the Apache configuration files to make sure they''re syntactically correct.'
  merge: -1
