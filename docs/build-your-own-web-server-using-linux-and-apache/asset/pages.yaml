  md: "# Managing Users from the Command Line\n\nIf you'd rather have this command\
    \ run automatically every time you start the shell, you can add the command to\
    \ .bashrc, a hidden file that auto-matically executed every time you start up\
    \ the bash shell. To open this file in edit, select File > Open... In the Open\
    \ File..., tight-click in the area in which the files are listed, and click Show\
    \ Hidden Files, as depicted in Figure 4.10.\n\nLocate .bashrc and open it. Add\
    \ the export command to the end of the file, as shown below.\n\n```\n# .bashrc\n\
    \n# User specific aliases and functions\n\n# Source global definitions\nif [ -f\
    \ /etc/bashrc ]; then\n    /etc/bashrc\nfi\n\nexport PATH=$PATH:/usr/sbin\n```\n\
    \nThe next time you open a terminal window, this command will be executed automatically.\
    \ Note that this won't affect any shells you have open at the moment—you'll need\
    \ to close and reopen them in order for the command to execute.\n\nLet's look\
    \ at an example of these commands, which we'll run as root.\n\n```\n[kermit@swinetrek\
    \ ~]$ su\nPassword: [root@swinetrek kermit#] groupadd puppets\n[root@swinetrek\
    \ kermit#] useradd -G puppets -c \"Miss Peggy\"\n> misspiggy\n[root@swinetrek\
    \ kermit#] passwd misspiggy\nChanging password for user misspiggy.\nNew UNIX password:\n\
    Retype new UNIX password:\npasswd: all authentication tokens updated successfully.\n\
    [root@swinetrek kermit#] exit\nexit\n[kermit@swinetrek ~]$\n```\n\nIn this example,\
    \ we can see that the groupadd command has been used to create a group called\
    \ \"puppets.\" Remember that groupadd is located in /usr/sbin, so you might need\
    \ to enter /usr/sbin/groupadd instead."
