  md: '# The ext3 Filesystem


    The Linux filesystem hides this unnecessary detail from you (until, of course
    you want to see it). The operating system kernel is stored in a directory called
    /boot/; Firefox is in /usr/lib/firefox-1.0.4/, my my photos and MP3s go into directories
    called /home/username/photos/ and /home/username/music/, and temporary files go
    into a directory called /tmp/. There are no obvious signs that these directories
    reside in different partitions or on different hard disks.


    The Linux filesystem assigns each partition a different mount point: a directory
    through which you access the partition. In Windows the D: analogous to /home/tony/
    on our Linux system, E: is similar to /tmp/, and C would be /, the top of the
