  md: '# Chapter 4: System Administration


    noauto, managed 0 0

    pamconsole, exec,

    noauto, managed 0 0


    /dev/hdc  /media/cdrom  auto


    # Comments


    > note: In Linux configuration files, lines that start with # are comment lines,
    and are ignored by the operating system.


    Each line of /etc/fstab contains five fields which, together, specify the configuration
    of a single device. Let''s look at what each field means.


    +   1. The first element specifies the device.


    +   The second line, which starts with LABEL=/boot, is a special case—the label
    /boot is defined elsewhere in the system. You can treat this as a synonym for
    /dev/hda1.


    +   2. The second element identifies the mount point for the device. The last
    two lines--media/floppy and /media/cdrom--define the mount points for /dev/fd0
    (the floppy disk drive) and /dev/hdc (the CD-ROM drive).


    +   The first line, which deals with the device /dev/Vol1Group00/LogVol100 (this
    is the first partition on the first hard disk), tells the system to mount this
    disk as the root of the filesystem.


    +   3. The third element defines the type of filesystem Linux should expect. Here
    we can see that /dev/Vol1Group00/LogVol100 has an ext3 filesystem.


    +   4. The fourth element lists mounting options for the device and the filesystem.
    Available options include:


    +   noauto This device should be mounted automatically when the system is started.


    +   noauto This device should not be mounted automatically when the system is
    started.


    +   owner The device and filesystem may only be mounted by the owner of the device
    file.


    +   kudzu The device will be checked for changes by the Red Hat kudzu system.'
  merge: -1
