  md: 'The creation of a non-root user is just as essential on a purely text-based
    system as it is on a graphical system. To create a new user from the command line,
    you first need to be logged in as root; then run useradd username, replacing username
    with the username of the new user; you will be asked for a password and some details
    for that user. Then, the user will be created.


    # Summary


    The installation of a Linux system requires a little more up-front research than
    does a Windows installation. As many Linux device drivers are created through
    community-based reverse-engineering, rather than by those devices'' manufacturers,
    it''s important to check a number of hardware compatibility lists prior to commencing
    the installation. This will help you ensure that drivers exist for the devices
    on your server.


    Linux support can take many forms, the most popular being Web-based lists and
    forums. This approach truly represents the spirit of community in the open source
    world, where user experience is relied upon to provide solutions to Linux issues.
    All commercial Linux distributors provide some level of paid support, though the
    support period may vary widely from one distributor to another.


    Linux systems can be installed with a full complement of graphical tools, or as
    a minimal text-based system. The installers follow suit, providing options to
    complete an installation from a graphical environment, or from a purely text-based
    environment.


    Unlike Windows systems, the desktop environment is not inextricably bound to the
    operating system kernel code. Instead, the X Windows and desktop management systems
    are distinct systems that run in their own space. This feature of Linux allows
    for the creation of a fully operational, text-based system, which boasts a very
    small installation base. However, most users will opt for a graphical system based
    on X Windows and any of a number of desktop managers.'
  merge: -1
