    # Securing VNC with SSH Tunnelling


    The VNC protocol by itself is not secure, it''s not a good idea to leave a machine
    that''s running VNC connected to the Internet. Fortunately, SSH offers a very
    handy feature called SSH tunnelling or port forwarding to circumvent this problem.
    In essence, instead of connecting directly to the VNC server (as shown in Figure
    7.16), SSH tunnelling allows you to make your VNC connection through an established
    SSH connection (depicted in Figure 7.17).'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'Securing VNC with SSH Tunneling


    # Figure 7.16. An unsecured VNC connection.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_266_0.png)


    # Figure 7.17. A secure VNC connection.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_266_1.png)


    SSH tunnelling is actually quite simple to get up and running. The procedure for
    using VNC securely is:


    +   1. Set up an SSH tunnel to the VNC server.

    2. Start the VNC server daemon on the server.

    3. Connect to the VNC server through the SSH tunnel.


