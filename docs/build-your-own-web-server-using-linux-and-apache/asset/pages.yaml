    Select Next and the process is complete! You''ve dumped rather unceremoniously
    at the command prompt. If you had generated a CSR, from this point you''d need
    to follow the CA''s instructions as to how to obtain your certificate. If you''ve
    generated a self-signed certificate, as we have, you''re ready to configure Apache
    to use it.


    > **IMPORTANT**

    If you''ve configured Apache to use an encrypted private key, you''ll need to
    stop Apache''s daemon from starting when the system is rebooted. If you don''t
    stop it, you''ll find that your system won''t start properly at all!


    Open the Service Configuration tool (Desktop > System Settings > Server Settings
    > Services), select Edit Runlevel > Runlevel All from the menu, locate httpd in
