    # Setting up the VNC Server Daemon


    Before we begin, we need to install the VNC server daemon; we can do so with the
    yum install vnc-server command, or by selecting the vnc-server package from the
    Network Servers package group in the Package Management tool.


    # Setting up the SSH Tunnel


    SSH tunnelling is a technique by which we redirect communications to and from
    a certain port—in this case, port 5901—to a port on the local machine, through
    SSH, thereby encrypting communications across that port. Both PuTTY and ssh support
    SSH tunnelling.


    # Tunnelling with PuTTY


    To set up PuTTY for SSH tunnelling, select the Tunnels category in the PuTTY Configuration
    dialog, as shown in Figure 7.18. In Source Port, enter the local port number to
    forward (in this case, 5901), and in Destination, enter the server name and remote
    port number to forward in the format servername:portnumber. Click Add to add this
    forwarded port to the list. Once everything is set up, click Open, and your SSH
    session will start as normal.


    # Tunnelling with the ssh client


    With the command-line ssh client, tunnelling is set up using the -L option, as
    follows:


    ```

    mymac:- kfrogs ssh -L 5901:swinetrek:5901 kermit@swinetrek

    kermit@swinetrek''s password:

    Last login: Sun Oct 16 20:46:10 2005 from 192.168.69.36

    [kermit@swinetrek ~]$]

    ```


    After the -L option, we list the local port we want to forward, the remote server
    name, and the port on the remote server that we want to forward to.'
  merge: -1
  pgno: 267
