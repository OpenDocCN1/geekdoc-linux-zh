    In time, however, you get over the shock and start to see the sense in viewing
    the system holistically, rather than as separate compartments.


    # The ext3 Filesystem


    Linux is deservedly renowned for its ability to work with many different filesystems.
    A modern Linux distribution will read, write, and keep track of files in nearly
    all the Microsoft filesystems—from the original FAT through to NTFS—as well as
    filesystems used by Mac OS X, OS/2, and all sorts of esoteric operating systems.
    For Linux, it''s a simple matter of loading the appropriate kernel module


