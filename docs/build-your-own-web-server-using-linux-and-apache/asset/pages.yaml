    The Virtual Hosts tab of the HTTP configuration tool, shown in Figure 5.4, allows
    an administrator to create a virtual host, which is basically a Website that''s
    hosted by your server. Virtual hosting makes it possible to serve requests for
    many Websites from the one server. To manage the list of virtual hosts, use Add...,
    Edit..., and Delete buttons.'
