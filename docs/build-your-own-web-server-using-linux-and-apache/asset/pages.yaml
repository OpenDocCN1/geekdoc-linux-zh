  md: 'outside of your network. This should return a standard 404 Page Not Found (assuming
    that you don''t have webboard installed, that is!), but will cause Snort to log
    an alert. Now, return to your server, and look in /var/log/snort/alert. You should
    see a block of text that looks something like this:


    ```

    File: /var/log/snort/alert (excerpt)

    [** [1:807:11] WEB-CGI /webboard/passwd.txt access [*]

    Classification: Attempted Information Leak] [Priority: 2]

    10/26-02:47:33.815036 192.168.69:33535 -> 192.168.69.28:80

    TCP TLL:128 TOS:0X0 ID:22463 IpLen:20 Dgmlen:54 DF

    ***AP*** Seq:0x7DC87CE4 Ack:0xAC48B56C Win:0xFFFFFF TcpLen: 20

    [Xref => http://cgi.nuss.org/plugins/dmp.php3?id=10321]

    [Xref => http://cve.mitre.org/cgi-bin/cname.cgi?name=1999-0954]

    [Xref => http://cve.mitre.org/cgi-bin/cname.cgi?name=1999-0953]

    [Xref => http://www.securityfocus.com/bid/649]

    [Xref => http://www.whitehat.com/info/IDS4633

    ```


    This is all rather overwhelming, let''s take a look inside, line by line.


    The first line is the key: it tells you what the suspicious activity involved.
    Snort has a rule that watches for HTTP requests for the /webboard/passwd.txt,
    because a software package installed WWWBoard contains a security hole that makes
    the file publicly accessible. You can see from the above that tried to access
    that file, Snort logged the alert that was triggered by a rule which is part of
    the WEB-CGI set of rules, which means that it was a potential attack on the Web
    server, or an application installed on the Web server. In this case, the attack
    was made on WWWBoard. If you don''t have WWWBoard installed, you can rest easy:
    someone was trying to exploit a vulnerability in WWWBoard, but you are not vulnerable.


    [Classification: Attempted Information Leak] [Priority: 2]


    The second line of the alert explains what sort of alert it is; in this case,
    it is an "attempted information leak." Each Snort rule defines suspicious activity,
    then categorizes that activity. This was a "priority 2" alert, meaning "fairly
    serious." Priority levels range from 1 (potentially very serious) to 5 (not very
    serious at all). Again, though, it''s fairly serious if you have WWWBoard installed;
    Snort doesn''t know whether you do or not, so it flags this as being, potentially,
    a fairly serious vulnerability.'
