  md: '# Chapter 8: Occasional Administration


    # Traffic Reporting with Webalizer


    If you''re running a Website, you''re likely to be interested in the amount of
    traffic it receives, where it''s coming from, and where it''s going. The analysis
    of Web traffic enables developers to assess whether not the Websites hosted on
    your server are being used as expected. It allows those developers to make the
    changes required to deal with unexpected loads, or to direct visitors towards
    particular Web pages of which they may not be aware.


    Traffic reporting for Web pages is a two-stage process. First, there needs to
    be a log of each request made for each Web page; fortunately, that''s exactly
    what Apache''s /var/log/http/access_log log file contains. Second, the raw data
    in that log file needs to be turned into a useful report. This is where Webalizer,
    an open source Web server log analysis program, comes in handy. Webalizer periodically
    goes through Apache''s access logs and produces an HTML report, complete with
    charts, so that we can quickly and easily identify any trends in site traffic.


    If Webalizer is not installed, install it from the Package Management tool by
    selecting the Webalizer package from the Web Server package group, or by entering
    `yum install webalizer at the command prompt.


    Fedora''s Webalizer package is already configured to read /var/log/http/access_log
    once daily to regenerate its reports, so there''s no need to configure Webalizer.
    The default configuration writes its reports to the directory /var/www/usage,
    which can be accessed via the browser at http://localhost/usage/, as shown in
    Figure 8.4. Note that if Webalizer''s cron job has not been run, nothing will
    be available at this address: you''ll see an error message. To force Webalizer
    to generate reports, run webalizer from the command line as root.


    The reports are very detailed, showing not only tables that indicate the “number
    of hits” the site has received, but graphs of hitting counts over time, traffic
    statistics broken up by month, week, day, and hour, and details of which “user
    agents” (Web browsers) were used to access the sites.


    There are many, many Web traffic analysis tools like Webalizer. You may already
    have experience with another and, if, you may prefer to use that. I recommend
    Webalizer because it provides comprehensive statistics in a clearly understandable
    format, and requires no configuration to set up and get working.


    264'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Figure 8.4. A Webalizer, report.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_284_0.png)


    While Web traffic analysis reports are useful to Web application developers, they
    can also be useful to you, the system administrator. A traffic report can give
    you an idea of when site traffic typically spikes to higher levels, and which
    parts of your Website attract the greatest numbers of users, which will help you
    make decisions about network bandwidth. For example, if you find that your server
    is'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Chapter 8: Occasional Administration


    serving a lot of images, and that, consequently, those requests are slowing down
    the other processes on the machine, you might think about setting up a second
    LAMP server purely to serve the images, thereby reducing the load on your first
    server. You might also decide to use traffic shaping tools to alter your network
    bandwidth to route more (or less) traffic to particular servers or services. This
    can be particularly handy if you''re seeing bandwidth spikes to particular services,
    or at particular times.


    # Summary


    Occasional system administration procedures address the things that you have to
    set up or tweak infrequently, but may be used regularly. Backups are a good example
    of this; you should only have to identify what you''ll back up once, though you''ll
    run backups regularly. Web traffic analysis is another good example: spend a little
    time setting up the traffic reports so that they display what you (or your Web
    development team) need to see, then leave them running. You''ll receive new reports
    every day without any more work.


    Automate these tasks as much as possible; the less you have to do, the fewer tasks
    you''ll forget or delay. For this reason, scripting is a vital tool in every sysadmin''s
    toolbox. Often, a short bash script can take the place of an expensive third-party
    application, and you can put it together yourself! Most Linux sysadmins will gradually
    build up a small library of little scripts that do the work they want to do, and
    reveal in the fact that they can control the machine with just a few lines of
    code.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# 9 Server Security


    When you run a publicly available Web server, nothing''s more important than security.
    Web server compromises are common, and can result in anything from a defaced Website
    to a cracker taking full ownership of the server.


    # A Long Road


    It must be stressed that security is an ongoing process; you can''t just set up
    a server as “secure” and never think about security again. You must keep the software
    that you use up-to-date, and regularly check for and apply security updates. Nevertheless,
    you can take steps both to decrease the chance that your server will be compromised,
    and in the worst case scenario, to limit the damage that can be done by a cracker
    who manages to breach the server''s security.


    # Overview: Making your System Secure


    Server security should be instituted on many levels. Taking a layered approach
    to security makes it much more difficult for crackers to do serious damage to
    your machine, because, even if they do manage to break through one layer, they
    won''t necessarily have access to the whole machine. Make sure you implement the
    following layers of security to help ensure that a cracker who manages to break
    through the first layer of security is prevented from progressing any further:'
  merge: -1
  pgno: 286
- img_proc: true
  md: One important aspect of server security that outranks the choice of programs
    you use to secure your network is the absolute necessity of keeping those programs
    up to date. While security software—a firewall, for example—can help you avoid
    situations in which unanticipated security holes are discovered in network software,
    such as Apache, a security hole within the security software itself opens your
    network to serious compromise.
  merge: -1
  pgno: 287
- img_proc: true
  md: 'It''s very important to stay up to date with the latest software patches; Linux
    distributions maintain an archive of security-patched software, and roll updated
    versions of software with security patches into archive as each new patch is released.
    In Fedora Core, you can check for updates to the packages you''ve stalled by running
    yum update. This displays a report of the available updates, and asks you if you
    want to download and install the updates.


    Checking for, and applying patches on an ongoing basis is part of the layered
    approach to security described above: it allows you to achieve "defense in depth."
    If, for example, you were simply to rely on your firewall to prevent unauthorized
    access to your network, and decided not to bother with security behind the firewall,
    then that firewall would become a single point of failure; a compromise in the
    firewall would automatically mean the compromise of your entire network. If you
    take a layered approach to security, compromising the firewall merely gives crackers
    the opportunity to further attempt to compromise the machine or network; however,
    they should not be able to achieve their ends, because you''ll put more layers
    of security in place to prevent them. In the worst case, where a compromise is
    achieved, audit tools such as Snort should at least alert you to the compromise,
    enabling you to put a stop to it.


    # # Tripwire


    Tripwire is a tool that helps detect compromises. It stores the state of the system
    and all the programs stored on it, and then, at regular intervals, compares the
    current state with the stored state. If it detects any changes, Tripwire can indicate
    that the server has been compromised and that a hacker has installed some other
    program (for example, a Trojan horse that pretends to be the "login" program but
    actually stores entered usernames/passwords for later retrieval).


    Tripwire should be installed and configured as soon as possible after you build
    the machine; you need to be sure that the machine has not already been compromised!
    To install it, use the `yum install tripwire` command, which requires access to
    the Internet in order to download the Tripwire package.


    # # Initial Setup


    Once you''ve installed Tripwire, you''ll need to set it up. Tripwire works by
    building a database of the files installed on your system. At regular intervals,
    you can then check the system against the Tripwire database, and be alerted if
    anything has changed.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Chapter 9: Server Security


    # Beware the Early Invader!


    It''s important that you know that your system has not been compromised before
    you set up Tripwire! Tripwire only detects changes from your "initial setup,"
    so your initial setup is already compromised, Tripwire can''t help you. This is
    why it''s important to install and configure Tripwire as soon as possible after
    you build the machine. If you''re working on a machine that has been connected
    to the Internet for a while, you may want to consider backing up the data on it,
    erasing the data from the hard drive, reinstalling the operating system, then
    restoring the data, then configuring Tripwire before you reconnect to the ''net''.
    Yes, that process is as tedious as it sounds, and security is about preventing
    potential issues and identifying problems; if crackers have already compromised
    your machine, and you don''t take the necessary steps to restore their access
    before you install Tripwire, the software won''t be able to do its job properly.


    The first step involved in setting up Tripwire is to generate the public and private
    keys the software uses to encrypt its reports and policy (or configuration) files.
    To do this, we use the tripwire-setup-keysfiles tool:


    ```

    root@swinetrek kermit]# /usr/sbin/tripwire-setup-keysfiles

    ```


    The Tripwire site and local passphrases are used to sign a variety of files, such
    as the configuration, policy, and database files.


    Passphrases should be at least 8 characters in length and contain both letters
    and numbers.


    See the Tripwire manual for more information.


    Creating key files...


    (When selecting a passphrase, keep in mind that good passphrases typically have
    upper and lower case letters, digits and punctuation marks, and are at least 8
    characters in length.)


    Enter the site keyfile passphrase:


    Here, you''re asked to enter a site keyfile passphrase, which will be used to
    encrypt Tripwire''s policy files. This passphrase should really be a sentence—maybe
    two—and, as it cannot be recovered, be careful not to forget it! This particular
    step may be onerous, but it''s critical to your system''s security.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Do Not Use Your Main Password


    If you decide to ignore this advice and just choose a word, do not choose your
    main password. Doing that will allow anyone who compromises the machine to compromise
    the Tripwire database, which would defeat the point of running Tripwire. Enter
    the passphrase at the prompt, and enter it again when you are asked to verify
    the passphrase.


    Enter the site keyfile passphrase:

    Verify the site keyfile passphrase:

    Generating key (this may take several minutes)...Key generation complete.


    (When selecting a passphrase, keep in mind that good passphrases typically have
    upper and lower case letters, digits and punctuation marks, and are at least 8
    characters in length.)


    Enter the local keyfile passphrase:


    After you confirm the site keyfile passphrase, you will be prompted for a local
    keyfile passphrase, which will be used to encrypt the reports Tripwire generates.
    Tripwire uses two different passphrases, which allows you to give users the local
    passphrase, so they can read and work with the reports, without giving them the
    ability to change the way Tripwire works by altering its configuration. Be sure
    to pick another passphrase for the local keyfile passphrase; don''t enter the
    one that you used for the site keyfile passphrase.


    Enter the local keyfile passphrase:


    Verify the local keyfile passphrase:

    Generating key (this may take several minutes)...Key generation complete.


    Signing file...

    Please enter your site passphrase:


    Tripwire will generate a key to go with each passphrase, then use those keys to
    sign files. To do this, it will ask you for the passphrases once again:


    Please enter your site passphrase:

    Wrote configuration file: /etc/tripwire/tw.cfg


    A clear-text version of the Tripwire configuration file:

    /etc/tripwire/twcfg.txt

    has has been preserved for your inspection. It is recommended that you move this
    file to a secure location and/or encrypt it in place'
