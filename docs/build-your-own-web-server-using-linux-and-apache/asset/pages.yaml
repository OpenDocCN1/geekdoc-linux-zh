  md: '# Editing Text Files


    A reasonable command of a Linux-compatible text editor will be crucial to the
    success of your day-to-day administration. As most of the configuration in a Linux
    system is done via text files, you''d be wise to find one that works for you.
    In fact, Linux is replete with text editors: editors without a GUI, editors with
    a GUI, editors intended primarily for programmers, editors targeted at HTML developers—there''s
    no shortage of tools to make your administrative tasks easier. In this section,
    we''ll take a look at some of the GUI-based text editors that are available to
    you. We''ll look out at some of the command line-based editors a little later.


    Fedora Core provides two robust GUI text editors in the default installation:
    gedit and Kate. gedit is the default text editor for the GNOME desktop environment,
    and Kate is the default for KDE, but both will work within either environment.


