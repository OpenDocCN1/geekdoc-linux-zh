- img_proc: true
  md: '# The Filesystem Table (fstab)


    rw The filesystem will provide read and write access.


    ro The filesystem will provide read only access.


    There are several other options for mounting devices and filesystems, as you can
    see in the default fstab file, but these are the ones in which we''re interested.
    In our example, many of the options are set to defaults. In a Fedora Core system,
    this is equivalent to auto, owner, kudzu, rw.


    +   5. The fifth column is used by the dump backup utility to determine if the
    filesystem should be included in its backups—the 0 value tells dump to ignore
    this filesystem for backup purposes.


    +   6. The final column indicates whether the filesystem should be checked by
    the fsck (filesystem check) utility. ext3 filesystems very rarely benefit from
    such a check. If you want to perform such checks, you should number the filesystems
    in the order in which you''d like them checked—1 for the first, 2 for the second,
    and so on.


    With a correctly formatted fstab file, using the mount command becomes much easier:


    ```

    [kermit@swinetrek -]$ su

    Password:

    [root@swinetrek kermit]# mount /media/floppy

    [root@swinetrek kermit]# exit

    exit

    [kermit@swinetrek -]$-

    ```


    Here, we''ve specified only the mount point. mount is able to look in fstab to
    identify the device to which this mount point relates.


