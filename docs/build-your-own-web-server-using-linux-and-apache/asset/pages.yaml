    Firestarter is available for download with yum in Fedora Core 4; just enter yum
    install firestarter at the command line.


    # Setting Up Firestarter


    Once Firestarter is installed, you can run the program by accessing Applications
    > System Tools > Firestarter. When you launch Firestarter, you''ll be asked if
    you want to run the program with administrative privileges(that is, run it as
    root),


