  md: '# Log Rotation


    ```

    [Tue Oct 17 03:52:47 2005] [error] [client 192.168.69.36] File

    does not exist: /var/www/html/favicon.ico

    [Tue Oct 17 03:53:01 2005] [error] [client 192.168.69.36] File

