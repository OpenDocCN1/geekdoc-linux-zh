  md: '# Summary


    Security is critically important. In this chapter, you’ve been introduced to the
    idea of establishing “defence in depth” by setting up layers of security to prevent
    crackers from turning a little security hole into a full compromise of the machine.
    Those security layers are built using tools such as firewalls like Firestarter,
    intrusion detection systems like Snort, and integrity checkers like Tripwire.
    The most important lesson about security, however, is that you need to actually
    implement and manage it. Don’t read this and agree... but then decide to implement
    “all that security stuff” later, when you get time. Far too many people are taught
    the value of security by being a victim first, then growing wise after the event.
    Make sure that’s not you!'
  merge: -1
