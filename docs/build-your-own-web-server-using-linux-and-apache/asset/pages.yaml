  md: "# Chapter 5: Building The Server\n\n```\n/var/www/html/.htaccess /var/www/html/testing/.htaccess\
    \ and\n/var/www/html/testing/admin/.htaccess. In effect, the use of .htaccess\
    \ files\ncreates three checks for a single page request. Again, the performance\
    \ hit on high-\ntraffic production servers can be significant.\n```\n\nGiven that,\
    \ why would you use distributed configuration files at all? Well, there\nare some\
    \ legitimate uses. If, for example, if you are providing hosting services for\n\
    several users on a single machine via virtual hosts, .htaccess files can allow\
    \ users\nto customize their individual server environments within the limitations\
    \ you've\ncreated in the httpd.conf file.\n\nWith some careful planning, and an\
    \ understanding of the httpd.conf directives,\ny Apache server will provide an\
    \ environment that's secure, flexible, and easy\nto maintain. That planning will\
    \ also minimize the work required of the server to\nmeet your users' needs.\n\n\
    # Configuring your Server for Secure Connections\n\nWith the advent of commerce\
    \ over the Internet, it became necessary to create a\nprotocol by which data could\
    \ be sent securely between Web servers and browsers.\nThis protocol is HTTPS,\
    \ the secure version of HTTP. HTTPS encrypts the data\nto be sent using an agreed\
    \ encryption protocol—most commonly Secure Sockets\nLayer (SSL)—then sends the\
    \ encrypted data to its destination, where it's decrypted\n processed.\n\nApache\
    \ can provide Web services over HTTP using OpenSSL. Before we\ngo and set this\
    \ up, though, it's important that we understand the process involved\nin serving\
    \ secure requests from our server.\n\n# A Brief Introduction to Public Key Cryptography\n\
    \nTwo elements are required to encrypt the connection between server and browser:\n\
    keys and certificates. These will allow the server to provide the browser with\n\
    evidence of its identity, and establish a connection that utilizes public key\
    \ crypt-\ntography.\n\nThe keys serve to encrypt the connection. There are two\
    \ fundamental types of\nenencryption: public key encryption and symmetric key\
    \ encryption, also known\nas private key encryption. In the latter, both the server\
    \ and the browser use the"
  merge: -1
  pgno: 205
- img_proc: true
  md: '# A Brief Introduction to Public Key Cryptography


    the encryption key, which is necessary to encrypt and decrypt data. While very
    secure, distributing the encryption key to all clients makes use of the symmetric
    key cryptography nearly impossible for public servers: how can you ensure that
    no one steals the encryption key while it is in transit? Symmetric key encryption
    is much more common in intranet environments or internal server usage.


    With public key encryption, two keys exist: the public key and the private key.
    As their names imply, the private key is stored securely on the server, while
    the public key is made available for public access. Through a complex mathematical
    process, data that''s encrypted with the public key can only be decrypted with
    the private key, and vice versa.


    However, cryptography isn''t the only element that''s necessary to create a secure,
    trustworthy connection. A client needs assurance that the machine is really the
    one it claims to be. This can be accomplished by acquiring a public key certificate
    from a well-known and trusted certificate authority (CA). When requesting a certificate
    from a CA, you''ll need to send proof of your or your company''s identity, as
    well as payment for the service, in most cases. The CA will return a public key
    certificate for use on your secure server.


    It''s also possible to create your own public key certificates using OpenSSL,
    but such certificates are only appropriate for development and testing purposes:
    browsers will usually complain when confronted with a certificate issued by a
    CA that they don''t consider “trusted,” showing an error similar to that depicted
    in Figure 5.14. In this chapter, we''ll be creating our own certificates using
    the genkey tool, which acts as a wrapper for OpenSSL.'
  merge: -1
  pgno: 206
