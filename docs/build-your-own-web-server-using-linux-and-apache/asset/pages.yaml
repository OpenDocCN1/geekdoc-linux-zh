    # run-parts

    01 * * * root run-parts /etc/cron.hourly

    02 4 * * root run-parts /etc/cron.daily

    22 4 * * root run-parts /etc/cron.weekly

    42 4 1 * root run-parts /etc/cron.monthly

    ```


    The crontab file first defines some environment variables: the shell in which
    the tasks will run, the PATH environment variable, the system account to mail
    notifications will be sent, and the home directory to use. After the run-parts
    command, the command schedule is listed.


    # The crontab Command Schedule Syntax


