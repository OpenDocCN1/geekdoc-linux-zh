  md: '# Chapter 5: Building The Server


    # Figure 5.12. Changing the server configuration options.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_199_0.png)


    The Server tab of the HTTP configuration tool, shown in Figure 5.12, offers several
    lower-level configuration options for your server. The first is the Lock File,
    created when the service starts up. The presence of this file prevents other instances
    of the server from starting up. The PID File provides process ID information to
