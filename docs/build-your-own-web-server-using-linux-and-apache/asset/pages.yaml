  md: 'NFS is used to share files between Linux and other UNIX-like machines. Similarly,
    if you''re not using Samba to share files (usually with Windows machines), you
    should disable Samba''s sm service.


    If you prefer, you can also disable and enable services from the command line
    using the chkconfig command. For instance, to disable the sm service, enter:


    ```

    [root@swinetrek kermit]# /sbin/chkconfig sm off

