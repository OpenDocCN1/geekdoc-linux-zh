  md: '# 5 Building The Server


    Now that we''ve constructed the Linux environment, it''s time to build the Apache
    server. In this chapter, we''ll cover all bases, from installation to configuration,
    from basic concepts to advanced server issues. The Linux element of the build
    is important, but it''s probably not the aspect with which you''ll work most often.
    If the Linux installation is stable, as it should, the majority of the changes
    you''ll make to your machine concepts, will be related to the server software.
    It''s important to understand the basic concepts, and to establish a roadmap that
    will help you work through the issues that can—and will—arise.


    As with the Linux chapter, we''ll start with a bit of history about Apache, and
    the Apache project. This study will provide behind-the-scenes insight into the
    philosophy that underpins the most popular and reliable Web server on the Internet.


    # Apache: a Brief History


    Apache, like Linux, has its roots in the open source philosophy. It exemplifies
    all the elements of the classic open source approach, including collaborative
    development and freely available source code. Apache is also developed by volunteers—primarily,
    interested users—and succeeds without a paid staff dedicated to product development
    or marketing. The Apache Group exists as an assembly'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Chapter 5: Building The Server


    volunteer directors who communicate, plan, and coordinate the development of the
    server software from around the world.


    As the World Wide Web''s popularity flourished in the early 1990s, the most widely-used
    server software was the NCSA HTTP daemon written by Rob McCool. McCool was another
    in the long line of students involved in open source development. He created the
    HTTP application while working for the National Center for Supercomputing Applications
    (NCSA). McCool was also intimately involved in a number of projects at Netscape,
    maker of the most popular browser of the era.


    McCool left NCSA in mid-1994, and development on the project subsequently stalled.
    With the increasing need for a reliable web server, Webmasters and administrators
    over the globe continued to develop patches and extensions for the server. These
    all occurred outside the official realm of the project, though the extensions
    and fixes found their way around the Net, and were implemented on servers throughout
    the world.


    Recognizing the need to consolidate all the fixes, the Apache Group was formed
    in early 1995. The group used NCSA HTTP version 1.3 as a base, rolling all the
    fixes and patches that were deemed practical into the new Apache server. In fact,
    the name Apache was chosen because the initial software was indeed "a patchy server."
    Development continued throughout 1995, culminating in the release of Apache 1.0
    in December, 1995. Since then, Apache has been the top server software on the
    Internet.


    For the purposes of this book, we''ll be using the latest release of Apache version
    2.


    # Installing Apache


    Apache is available with nearly every Linux distribution. In the case of Fedora,
    you probably installed the RPM version of the software during the installation
    of your operating system.


    # Requirements


    Apache requires the following of your Linux machine:


    +   50MB free temporary disk space. This is necessary only for the installation
    of Apache. Once installed, Apache will only use about 10MB of disk space.'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'An accurate clock on your server. Pieces of the HTTP protocol are expressed
    as time of day. In order to assure the proper operation and logging of your server,
    it''s recommended that you utilize the Network Time Protocol (NTP) daemon to maintain
    system time. You can configure this using the Date/Time Properties tool, available
    from Desktop > System Settings > Date & Time.


    All in all, the requirements for building the Apache server are minimal and can
    be met by most Linux systems.


    When installing Apache on Fedora Core, you have several options: the installation
    can be accomplished via the RPM packages included with the Fedora Core distribution,
    or you can download the source code from the Apache site, compiling and building
    the server to suit your specific needs. Compiling and installing the server yourself,
    though, is unlikely to constitute a good use of your time; the packaged version
    of Apache will probably meet all your needs, unless you''re running a very high-volume
    or complex site. We won''t discuss self-compilation of Apache in this book.


    # Installing Apache from RPM Packages


    Apache 2 is included in the Fedora Core distribution, which makes for an easy
    installation. However, you''re not bound to the version that''s included on the
    installation CDs. Apache''s open source nature allows for a constant stream of
    improvements and fixes, and the software is always moving forward through incremental
    releases. By the time you''re ready to install the Fedora distribution, it''s
    likely that the Apache server will have reached another incremental release. And,
    like the source distributions of the server, the incremental RPM releases are
    available for download.


    One way to acquire and install the latest version of Apache is to use the updating
    tool, yum, which downloads updates directly from Red Hat. First, we''ll check
    if any Apache updates are available.


    ```

    [kismet@swinetrek ~]$ su

