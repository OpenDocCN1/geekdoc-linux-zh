  md: '# The aliases File


    ```

    # Aliases in this file will NOT be expanded in the header from

    # Mail, but WILL be visible over networks or from /bin/mail.

    #

    # >>>>>>>> The program "newaliases" must be run

    # >> NOTE >> this file is updated for any changes to

    # >>>>>>>>> show through sendmail.

    ```


    ```

    # Basic system aliases -- these MUST be present.

    mailer-daemon: postmaster

    postmaster: root


    # General redirections for pseudo accounts.

    bin: root

    daemon: root

    adm: root

    ...

    marketing: postmaster

    sales: postmaster

    support: postmaster

    ```


    ```

    # trap decode to catch security attacks

    decode: root


    # Person who should get root''s mail

    #root: marc

    ```


    Each line in this file is an email alias; the line postmaster: "if mail comes
    to the postmaster account, put it in root''s mailbox." By default, Fedora''s aliases
    file ensures that mail for all the "system" accounts on the machine (i.e., all
    the accounts that the computer creates, rather than the ones that you create)
    goes to root''s mailbox. This is very useful, because then, all you have to do
    is ensure that the mail for root''s mailbox should go to the administrator''s
    mailbox. This is a two-step process. First, record in the aliases file that root''s
    mail should go to the administrator''s mailbox. To do so, the last line in /etc/aliases,
    and change marc to the administrator''s email address.


    133'
