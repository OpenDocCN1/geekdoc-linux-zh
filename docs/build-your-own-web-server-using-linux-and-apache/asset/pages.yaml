    You don''t need to understand the intricacies of the Linux filesystem to see the
    advantage of the command line. The graphical approach involves at least nine—likely
    many—mouse clicks. Rather than viewing the process of finding and deleting these
    files as single operation, you''re forced to break the process down into its individual
    components. Add to that the inefficiency of using the mouse to locate, point at,
    and click targets on the screen, as compared to the swift simplicity of entering
    commands via the keyboard, and you start to understand how the command line can
    be a valuable and efficient tool for system administration.


    This, however, doesn''t even address the real beauty and power of the command
    line. You don''t believe that I actually run the rm command three times a week,
    do you? That would also be terribly inefficient: I''m relying on my own memory
    to make sure that the backups were removed! In fact, most of the commands you''ll
    use in Linux are fully scriptable, with minimal modification. In reality, I''ve
    asked my system, via the cron utility (which we''ll cover in depth in Chapter
    4) to execute the command three times each week. This is much like the Scheduled
    Tasks feature in Windows, but it''s more powerful: it can do about anything. As
    you can see, an understanding of Linux commands and command line concepts is essential,
    even if you only open a terminal window occasionally.'
