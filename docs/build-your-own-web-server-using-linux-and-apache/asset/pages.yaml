  md: '# 7


    # Remote Administration


    As we''ve seen, administering your servers is a vital part of their daily health.
    However, it''s a lot more convenient to administer a server when you don''t have
    to walk all the way to the server room to do so. While you can quite happily work
    with your Linux server when you''re sitting in front of it, it''s just as easy
    to administer a server at the other end of the corridor, or indeed, the continent.
    SSH and VNC make it possible to run your Linux server from across the network
    with hardly any need to visit it at all.


    # SSH


    SSH, the Secure Shell, is a way of running commands on a remote computer. Using
    SSH in its most basic mode to connect to a remote machine across a network is
    essentially the same as being seated at that machine and opening a GNOME Terminal
    window. SSH is deliberately engineered to stop malicious parties intercepting
    or altering your computer''s communication with the remote server, which makes
    it a much better choice than older protocols that are not secure, such as telnet
    or RSH (Remote Shell).


    # SSH vs ssh


    SSH is both the name of a protocol and the name of a Linux command line program
    that makes use of that protocol. When we''re referring to the Secure'
