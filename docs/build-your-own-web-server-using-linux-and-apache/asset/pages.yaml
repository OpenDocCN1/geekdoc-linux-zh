    *root@swinetrek hermit]*

    ```


    If you''re investigating an error that''s occurred, tail can be very handy; it
    lets you avoid skipping through the whole file. If you want to view more (or less)
    of the file, you can use tail -n filename to show the last n lines of filename.
    The -f option will instruct tail to display new lines as they''re added to the
    file. This is exceptionally helpful for "watching" a log file. As an experiment,
    run tail -f /var/log/httpd/error_log, then try to access a URL to a file that
    doesn''t exist on your server (e.g. http://localhost/foo.txt). You''ll see that
    tail outputs the error immediately. Hit Ctrl-C to exit tail.


    # Log Rotation


    You may notice that, over time, copies of your log files start to appear. For
    example:


    ```

    [root@swinetrek hermit]# /var/log/httpd/

    [root@swinetrek httpd]# ls -l error_log*

    error_log error_log.1 error_log.2 error_log.3 error_log.*

    ```


    We do not have the error_log file itself, but also an error_log.1, and an error_log.2,
    right through to an error_log.4. These copies are made by the log rotator, a cron
    job that works to keep the size of your log files under control.


    error_log (in this example) is the current log, error_log.1 is an older log, error_log.2
    is older still, and so on. When the log rotator cron job is triggered, error_log
    is moved to error_log.1, the old error_log.1 is moved to error_log.2, and so on.
    This ensures that your saved logs cover more than just the immediate past, but
    avoids their being saved as one enormous, unmanageable file.


    263'
