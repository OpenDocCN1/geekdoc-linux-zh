  md: '# Chapter 2: Day-to-day Usage


    # Symlinks, or Linking Files: More Abstraction


    Most people who have ever worked with Windows understand the concept of shortcuts.
    A shortcut is really a pointer from one location to a file in another area of
    the system. In fact, some users understand and become obsessed with shortcuts
    in Windows that their desktops are eventually covered with them! The ability to
    launch a file from somewhere other than its real location clearly has value for
    computer users. And Linux offers such capabilities, too. As an administrator,
    you''ll find Linux''s shortcuts as exciting as those in Windows.


    A shortcut in Windows and a symbolic link in Linux really amount to the same thing;
    they''re abstractions—more representations—of the original file. Creating a shortcut
    in Windows doesn''t actually move the executable file to the desktop. Similarly,
    in Linux, we can write for a file an abstraction that appears to be the file itself.
    The file doesn''t really exist in the new location, it just operates as if it
    does.


    One important difference between the way Windows and Linux create shortcuts is
    that a Linux symbolic link (normally called a symlink) can be treated exactly
    as if it were the file for most purposes. For example, if you open a symlink in
    your editor, and make changes to the file, the editor will edit the actual file
    to which the symlink points. If you try that under Windows, you''re likely to
    get a surprise when the editor opens up the shortcut file for editing, rather
    than the file to which the shortcut links! Symlinks are used frequently under
    Linux because they''re a powerful abstraction that can make it seem as if a file
    is in multiple places once.


    You can create a symbolic link in Nautilus by right-clicking on a file or folder,
    and selecting Make Link, as shown in Figure 2.19. This will create a symlink with
    "link to" at the start of the filename, as depicted in Figure 2.20. You can drag
    and drop this file anywhere, and rename it as you choose.'
