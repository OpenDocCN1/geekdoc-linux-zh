  md: '# 8 Occasional Administration


    By comparison with daily administration—the things that need looking at and checking
    all the time—are also "occasional" administration tasks: things that need to be
    done once, or infrequently. They''re the tasks that you may need to glance at
    from time to time, and be aware of, but aren''t a focus of your concentration.
    The most important of these is setting up your backups—actually performing the
    backup is a daily task, but one that should be so easy that it doesn''t qualify
    as an administrative chore—but there is also the question of Web traffic reporting,
    and the log files you''ll need to understand to set that reporting up.


    # Backups


    Backing up the files on your servers is vitally important—but, of course, you
    already know this. Since no-one actually performs backups, they need to be as
    easy as possible to do: ideally, they should occur automatically. Traditionally,
    Linux servers were backed up using a custom set of shell scripts that were created
    by the system administrator; everyone rolled their own private backup solution
    and tweaked it repeatedly for best results. Linux has come a long way since those
    days, and more automated tools are now available. However, it''s still useful
    to be able to put together your own scripts for backing up a LAMP server, because
    this approach gives you a very fine degree of control.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Simple Backups


    The simplest way of performing a backup is to write the files to a CD or DVD,
    and store the backup away. Your backup strategy can be as complex as you like—and
    will probably need to be fairly intricate if you''re integrating your LAMP server
    into a larger enterprise setup—but it''s better to have a simple backup process
    that you actually carry out than a complex strategy that never gets off the ground.
    Below is a simple script that can run on a regular basis to back up your selected
    files to a CD.¹ The first time you run, you''ll select the files you want to back
    up; thereafter, running the script (daily) will simply back up those files to
    a new CD. The easier it is to create the backup, the more likely it is you''ll
    do it.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_273_0.png)


    > ¹This script is also available as part of this book''s code archive.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Simple Backups


    ```

    "$HOME/.simple-cd-backup/FilesToBackup"

    zenity --title "Simple CD Backup" --question-question-text \

    "Burn files linked in the directory?"

    if [ $? == 1 ]; then exit; fi


    mkisofs -f -l -o $ISO -A "$BACKUPDIR" \

    zenity --progress-text="Creating backup" \

    --title "Simple CD Backup" --progress --pulsate -auto-close

    cdrecord -v speed=4 --dev/$CDDEVICE $ISO \

    zenity --progress-text="Burning CD" \

    --title "Simple CD Backup" --progress --pulsate -auto-close

    ```


    rm $ISO

    zenity --info-infotext burned to CD.


    Save this script as ~/Desktop/simple-cd-backup.sh, then set it to executable either
    right-click on the file and set the appropriate permissions, or enter chmod +x
    ~/Desktop/simple-cd-backup.sh at the command line.


    You can double-click on this file to see the Run or Display? dialog depicted in
    Figure 8.1. Click Run to run the script-as; click Display to open the file in
    a text editor.


    Figure 8.1. The Run or Display? dialog.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_274_0.png)


    If you run the script, it will create the directory ~/.simple-cd-backup/FilesToBackup,
    open that directory in Nautilus, and finally, pop up the confirmation window shown
    in Figure 8.2.


