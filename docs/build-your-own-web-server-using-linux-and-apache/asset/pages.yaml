    # Handling Linux Files


    Literally everything in a Linux system is a file, including directories, links,
    and so on. Even the commands are files, ranging from the simple to the extremely
    complex. Because of the nature of the Linux system and its files, it''s important
    to understand the processes of file handling and editing on your new system.


    In this section, we''ll take a quick spin through the file permissions structure,
    get a grip on the system''s ability to link from one file to another, and explore
    some of the more common text editing applications for Linux. Because everything
    in Linux is a file, it''s very important that you understand how files are accessed
    and edited. These are skills you''ll find yourself using nearly every day.


    # File Permissions


    Linux utilizes one of the most granular file permissions systems of any computer
    operating system. As we''ve already seen, that granularity is due, in part, to
    the fact that everything in Linux is a file. Commands, configurations, device
    files: all'
