  md: '# The Linux Filesystem


    # Drives and Partitions


    If you’re used the drive-oriented layout of Windows, the Linux filesystem structure
    might be a bit confusing. There is no C: drive; in fact, there are no drives as
    such, only partitions. To muddy the waters a little more, the partitions'' actual
    locations on the hard drive aren’t identified clearly. The Linux filesystem is
    much more abstract than that.


    Let me give you an example. My workhorse machine at home, cortex contains two
    physical hard drives. One is an old 40GB drive that contains the operating system
    and all the programs I use. The other is a new, 160GB I added later, which is
    partitioned into two sections. The first section contains my personal files: the
    photos I’ve taken with my digital camera, my MP3 collection, and few odds and
    ends. I leave the second section free for temporary files created by my programs.


    On a Windows system, these drives would most likely be seen by both the system
    and the user as C:, D: and E:. Windows would be installed at C:\WINDOWS\, Firefox
    would live in C:\Program Files\Mozilla Firefox\, my digital photos would reside
    in a directory called D:\Photos\, and so on. With Windows, the directory name
    is directly related to the partition, and therefore the hard disk, on which it’s
    stored. This concept is illustrated in Figure 2.11.


    Figure 2.11. How C:, D: and E: relate to my physical hard drives.


    | C: | D: | E: |

    |---|---|--|

    | Partition #1 | Partition #2 | Partition #3 |

    | 40 GB Hard Drive | | 160 GB Hard Drive |'
