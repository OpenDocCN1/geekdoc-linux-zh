  md: '# Figure 5.19. Choosing whether or not to encrypt the private key.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_212_0.png)


    Next, you''re asked if you want to encrypt the private key you''ve created, If
    a malicious party were to gain access to your private key and it was not encrypted,
    they would be able to decrypt the communication between the browser and the Web
    server. If you''re running a secure site and trying to build a trustworthy reputation,
    this has obvious disastrous consequences. Encrypting the key ensures that, even
    if the malicious party compromises your system and gains access to the key, he
    cannot use it to decrypt communications without the key''s passphrase. However,
    if you encrypt your private key, you''ll need to enter the key''s passphrase whenever
    Apache is restarted; therefore, Apache cannot start automatically after the server
    is rebooted. You need to decide which is more important for your server: security
    or ease of management.


    In almost any case in which HTTPS is required, server security should be paramount,
    so we''ll encrypt our private key. Hit Space so that an asterisk appears next
    to Encrypt the private key, then select Next.'
  merge: -1
