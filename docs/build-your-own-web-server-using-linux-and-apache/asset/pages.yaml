- img_proc: true
  md: 'I''ve forgotten my root password. How can I reset it?


    The files in your root partition will now be available in the directory /tmp/hd,
    and you can make alterations to them necessary.


    # I’ve forgotten my root password. How can I reset it?


    Boot from Fedora CD, and type linux rescue at the boot prompt. This will boot
    you into “single-user mode” in your Linux installation, and log you in as root.
    Enter passwd, and you’ll be able to change your root password. After you do so,
    remove the CD from the machine and reboot (enter reboot). Your root password will
    be changed.


    # Programs are failing oddly. What’s going on?


    Programs can fail oddly for a number of possible reasons, but a common explanation
    is that you are out of disk space. Check the disk usage in a Terminal with the
    df command:


    ```

    kermit@swinetrek ~]$ df -h

    Filesystem Size Used Avail% Mounted on

    /dev/mapper/VolGroup00-LogVol010 12G 1.8G 8.8G 17% /

    /dev/hda2 99M 9.8M 84M 11% /boot

    /dev/shm 62M 0 62M 0% /dev/shm

    ```


    The Used and Avail columns show how much space is used and available on each partition
    on your machine. If a partition is nearly or completely full, it may be the cause
    of your problem; find some files to delete from that partition to see if it helps.
    Good candidates are log files, which are stored in the /var/log directory.'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'Appendix B: Troubleshooting


    # A service isn’t running. What’s the problem?


    You can stop and start services using the Service Configuration tool (Desktop
    > System Settings > Server Settings > Services), but if a service keeps stopping,
    you may want to try restarting it from the command line: if an error occurs while
    running the service from the command line, the error may be displayed. Restart
    the service using /sbin/service daemonname start, and watch to see whether any
    errors are displayed.


    If restarting the service doesn’t show errors, it’s worth investigating any log
    files that the service creates. You already know about the log files Apache servers
    in /var/log/apache; look in /var/log to see if a log file exists for your failing
    service, and check the system logs.


    # I can’t see the network. What should I do?


    You already know most of the steps to take if LAMP server can see the network:
    check that the cable’s plugged in, that the machine next to it can see the network,
    and that the light on the network card is flashing. All of the common command
    line network tools, like ping and traceroute, are on Linux. It may also be worth
    checking the output of ifconfig:


    ```

    [kermit@swinetrek ~$ /sbin/ifconfig -a

    [kermit@swinetrek ~$ /sbin/ifconfig -a

    eth0 Link encap:Ethernet HWaddr 00:03:FF:42:E1:92

