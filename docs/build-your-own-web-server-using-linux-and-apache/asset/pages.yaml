  md: 'And mounting a partition. This makes it easy to handle files written on other
    systems on your Linux machine. In this section, we’ll look at the filesystem’s
    native to your Fedora Core server: ext3.


    The ext3 filesystem is an extension of the native Linux filesystem, ext2, and
    is now the default filesystem for Fedora Core. ext3 extends ext2 with a journaling
    layer that facilitates system recovery, and ensures a high level of data integrity.
    The journal is constantly updated with notes of file actions that are pending,
    and those that have been completed.


    Journaling protects against data corruption with speed and ease. All pending and
    completed operations are logged to the journal. The system checks the journal
    when rebooting, and completes operations that were pending at the time of a system
    failure or "dirty shutdown.\ This protects the consistency of the data that was
    buffered at the time the system went down.


    Recovery time is also decreased by the use of a journaling layer. Rather than
    checking each file, bit by bit, for consistency, the system merely merges any
    pending writes noted in the journal. This reduces what was once a 20 to 30-minute
    reboot operation to mere seconds—an improvement that’s especially critical in
    an enterprise environment.


    # Filesystems Galore


    Other Linux distributions utilize different filesystems. SuSE Linux, for example,
    uses the ReiserFS filesystem by default. Extensive benchmarking has shown that
    ReiserFS can more efficiently handle large numbers of small files than ext3. However,
    we won’t have time to look at these other filesystems. If you’d like more information
    on the other filesystem options available for your Linux system, you can find
    a detailed list, descriptions and installation instructions at Linux Gazette.


