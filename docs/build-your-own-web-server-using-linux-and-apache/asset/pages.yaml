  md: '# Configuring the Apache Server using the HTTP Configuration


    ing logs, as disk space may become an issue. If, on the other hand, you choose
    a log level that''s listed higher in the drop-down, the logging level will be
    much lighter, though you may not have all the details necessary to resolve a problem
    with the server. Choosing the correct log level is always a fine balance between
    having too much detail and not enough.


    Finally, the logging options allow you to specify whether reverse or double-reverse
    DNS lookups should be performed. An example of a reverse dictionary lookup is
    a reverse lookup, in which a word would be found on the basis of its definition,
    rather than the other way around. Normally, DNS is used to translate domain names
    into IP addresses, so a reverse DNS lookup is used to lookup a domain name that
    corresponds with an IP address. A double-reverse DNS lookup not only looks up
    the domain name, but also performs a regular DNS lookup to ensure that the original
    IP address is returned.


    If either reverse or double-reverse DNS lookups are enabled, domain names, instead
    of IP addresses, will appear in your server logs. While this may be more user
    friendly, it also puts load on the server. It''s recommended that you switch this
    functionality off if you anticipate your server experiencing heavy loads.'
