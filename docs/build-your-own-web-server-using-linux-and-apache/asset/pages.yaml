  md: '# Chapter 9: Server Security


    # The Database Backup


    Updating the database will produce a backup of the old database as /var/lib/tripwire/report/servername.twd.bak.
    The addition of this file will cause yet another violation, just as the addition
    of the database file itself did.


    Generally speaking, your day-to-day usage of the machine will not cause violations.
    However, if you install new versions of software packages, the files within those
    packages will, obviously, change. Tripwire cant tell whether those files were
    changed by you, or by a cracker, so it will alert you to a violation. It''s a
    good policy to run a Tripwire check before you run yum upgrade or yum install,
    and before you install any RPM packages. Resolve any indicated violations to your
    satisfaction before upgrading. You can then be reasonably confident that any changes
    came about of the upgrade, and as you''re happy with the state of the machine,
    you can go ahead and recompute the Tripwire database.


    # iptables


    iptables is the name of the standard Linux firewall. A firewall limits incoming
    network connections to your machine by blocking or limiting traffic to certain
    network ports; this makes it impossible for a cracker to connect to a port that
    a system administrator hasn''t left open. Firewall configuration can be very complex,
    but fortunately there are some graphical tools that make the process considerably
    simpler.


    You''re already familiar with the Security Level Configuration tool, which includes
    a simple GUI for editing the iptables configuration, and it''s not really appropriate
    for setting up complex firewall rules. Here, we''ll take a look at Firestarter,
    a more advanced iptables configuration tool.


