  md: '# Log Files


    /var/log/httppd/access_log

    /var/log/httppd/ssl_access_log

    These are the Apache access logs, which list the details of each Website hit

    it as occurs. The logged details of a single request are shown below.


    ```

    File: /var/log/httppd/access_log (excerpt)

    192.168.69.36 - [17/Oct/2005:23:07:59 -0400]

    "GET /about.html HTTP/1.1" 200 - "-"

    "Mozilla/5.0 (Windows; U; en-US; rv:1.8b5)

    Gecko/20051006 Firefox/1.4.1"

    ```


    /var/log/httppd/error_log

    /var/log/httppd/ssl_error_log

    This comprises a log of errors occurring in Web pages or in Apache itself.


    The Apache error log is extremely useful to Web developers deploying applications-on
    the LAMP server, because more detail about an error in a Web

    application will normally be displayed in the log.


    ```

    File: /var/log/httppd/error_log (excerpt)

    [client 192.168.69.36] PHP Warning: Division by zero in

    /var/www/html/div-zero-test.php on line 2

    ```


    This file also logs errors in the Apache configuration, and errors caused by

    Apache itself. For example, if the server doesn''t seem to be serving Web

    pages, your examination of the log might show the following line:


    ```

    File: /var/log/httppd/error_log (excerpt)

    [Mon Oct 10 04:10:49 2005] [error] (12)Cannot allocate memory:

    fork: Unable to fork new process

    ```


    This is a good indication that the machine has, for some reason, run out of

    memory. While this doesn''t help you work out why it ran out of memory, it

    does, at least, alert you that the problem has occurred; you can now concentrate
    on finding out what''s eating all the memory, and fixing it before you

    restart Apache.


    /var/log/samba/client.log

    This is Samba''s access log from client.


    /var/log/yum.log

    This comprises a log of packages that were updated or installed via yum.


    261'
  merge: -1
