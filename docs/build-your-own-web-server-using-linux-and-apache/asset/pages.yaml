    # Summary


    Being able to work with your servers remotely is a thoroughly useful thing. You
    can work with your LAMP servers whether they''re directly in front of you or on
    the other side of the world, using remote administration technologies such as
    SSH and VNC. With these tools, you can control and administer your machines as
    if you''re sitting right next to them.'
