    management of file permissions for groups of users. You might, for example, create
    a "developers" group, into which you''ll add all the Web developers who create
    code for your server. You''d give that group appropriate permissions to the files
    of your Web application, providing each developer the ability to edit files without
    allowing ordinary users access to them.'
