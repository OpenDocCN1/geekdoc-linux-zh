    # Using Snort


    Snort stores its logs in the /var/log/snort/alert directory. Snort''s default
    setup will log alerts in the file /var/log/snort/alert. Whenever Snort detects
    suspicious traffic, it writes a description of the traffic into the alert file.
    To perform a simple test of this, try to access http://servername/wwwboard/passwd.txt
    from a machine


