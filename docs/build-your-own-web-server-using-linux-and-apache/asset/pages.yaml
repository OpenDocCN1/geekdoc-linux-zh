  md: '# Figure 1.5. Selecting a partitioning method.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_30_0.png)


    Automatic partitioning creates three partitions:


    +   - The /boot partition is the home of the kernel: the program at the very heart
    of Linux. Fedora recommends a /boot partition of no less than 100MB, though you''ll
    seldom need this much.

    - The swap partition is used as a fallback for memory when all of the system memory
    is in use.

    - The / partition contains everything that isn''t on its own partition.


    # What, no Drive Letters?


    Partitions in Linux appear differently than those in Windows. Linux partitions
    don''t use the drive letter designations, such as C:; which you may already be
    used to. The primary partition on Linux is labeled / (you’ll see how this fits
    into the overall partitioning layout later). Other common partitions on'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Chapter 1: Building the Linux Environment


    a system include /boot (contains the kernel and boot loader), /home (contains
    user-specific files), and /var (contains program configuration and variable data).
    These labels are called mount points, and we''ll discuss them further in Chapter
    4.


    It''s possible to organize your system so that it''s spread over multiple partitions;
    for example, it''s quite common to put /var (where data, including such things
    as MySQL databases and Websites, live) on a separate partition. However, automatic
    partitioning makes things simpler, and spreading your data across different partitions
    doesn''t achieve very much. Some administrators strongly recommend it, but the
    Fedora rescue CD (also downloadable as an ISO image from the Fedora Website) will
    help you avoid most problems that might have been aided by splitting the data
    across different partitions in the past. Therefore, the default partitioning setup
    is usually sufficient.


    # Using Disk Druid


    Fedora also offers Disk Druid, a graphical partitioning tool. If you''d prefer
    a scheme other than the default, you''ll need to use Disk Druid during the installation
    process. Disk Druid presents both graphical and textual representations of the
    partition table on your machine. To select a partition, click on the graphical
    drive representation (shown in Figure 1.6), or on the textual representation.
    Either case, you can add, edit, or delete partitions by clicking on the appropriate
    tool bar buttons.


    If the system onto which you''re installing Linux has a previous installation
    of Windows (or some other operating system), you might want to manually delete
    the partition that contains Windows. Also, if you don''t see any space marked
    as "Free" in the diagram at the top of the screen, you''ll need to delete something
    to make room for Fedora. To do this, select the partition to delete, and click
    the Delete button.


    # Deleting Partitions


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_31_0.png)


    Once you delete a partition, there''s no way to get back the data that was it.¹³
    Delete with care!


    > ¹³Well, there''s no easy way. Advanced recovery tools do exist.'
  merge: -1
