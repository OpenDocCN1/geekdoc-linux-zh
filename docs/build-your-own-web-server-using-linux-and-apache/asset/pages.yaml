    # # Configuring the Server with MySQL and PHP


    Today, dynamic Websites are more the rule than the exception. Most sites require
    some type of database back-end and use one scripting language or another. A bare-bones
    Apache configuration is perfectly suited to serving up static Web pages without
    any further configuration, but if you''re looking to build a more dynamic site,
    a little more work is in order.


    # # Installing MySQL and PHP


