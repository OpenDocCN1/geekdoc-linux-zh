  md: '# Chapter 3: The Command Line


    to dig more deeply into powerful scripting languages like Perl. Shell scripts,
    however, have the advantage of being a good hacker''s tool. They''re quick, they
    can accomplish many of the daily administrative tasks you''ll face in Linux, and
    many pieces of each script can be tested directly in the shell prior to being
    rolled into a script.


    Further exploration of the possibilities of shell scripting can be found in the
    detailed online tutorial A Quick Guide to Writing Scripts Using the Bash Shell.²


    # The PATH Environment Variable


    Now, remember that all of the command line tools are binary files located somewhere
    in the filesystem: the ls command, for example, actually lives in the directory
    /bin. But does the shell know to find /bin/ls when you type ls at the command
    prompt?


    The shell looks through all the directories listed in its built-in PATH variable,
    in search of a file that has the same name as the command you''re after. The PATH
    environment variable for a default Fedora Core installation will look something
    like:


    ```

    [kermit@swinetrek ~] echo $PATH

    /usr/kerberos/bin:/usr/bin:/usr/local/bin:/bin:/X116/bin

    ```


    So when you type the ls command, the shell will first look for an executable file
    /usr/kerberos/bin/ls, without success. Is there a /usr/local/bin/ls? No. What
    about a /usr/bin/ls? Sorry. How about /bin/ls? Bingo!


    Remember that, when we ran our counter_test.sh script, we needed to prefix the
    script filename with ./ to tell the shell that the executable file was in the
    working directory. If we added this directory to the PATH variable, we could simply
    enter counter_test.sh to run this script regardless of the working directory.


    Built-in variables such as PATH are known as environment variables. These are
    the variables that describe the environment in which a process is running. Examples
    of other environment variables are HOME, which contains the path of the user''s
    home directory, MAIL, which is the name of the file that stores the user''s email.
    Environment variables work just like normal shell variables, except they can be
    accessed by programs that are launched from the shell.


    > ² http://pegasus.rutgers.edu/~elflord/unix/bash-tute.html'
  merge: -1
