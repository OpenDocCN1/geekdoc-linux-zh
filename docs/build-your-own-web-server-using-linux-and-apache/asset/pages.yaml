    # Turning off Nonessential Services


    One step beyond using your firewall to restrict access to services is to turn
    off services themselves if they don''t need to be running; a service can''t be
    compromised if it isn''t turned on! In this section, you''ll see which network
    services are running in a default Fedora Core installation, and how to turn them
    off if you don''t need to use them.


    To configure the services that start automatically when the server is booted,
    use the Service Configuration tool (Applications) > System Settings > Server Settings
    > Services) and make sure the tool displays the configuration for runlevels 3,
    4, and 5 by selecting Edit Runlevel > Runlevel All. All the services running on
    the machine are displayed; note that not all of these are network services. Click
    on a service to see a brief description of it. Fedora Core ships with a lot of
    services for security reasons, are disabled by default, which makes your job an
    easier.


    For example, if you''re not using NFS to make files available over the network
    (if you''re not sure what this means, then you''re probably not using NFS!), you
    can safely disable the NFS services portant, rpccssd, rpcmapd, and rpcsvcgssd.


    286'
