  md: '# 1 Building The Linux Environment


    Installing a Linux distribution can be both exhilarating and frustrating. My two
    attempts at Linux installs—the first in 1996, the second in 1997—were unsuccessful.
    Installation routines and hardware support in Linux at the time were much less
    advanced than they are today; Red Hat was still at a relatively early stage in
    its evolution, Mandriva had yet to be created, and SuSE was just coming out from
    the shadow of Slackware. After two failures, I simply decided that I wasn''t going
    to be beaten by a Linux distribution. I set my machine up in a dual-boot configuration
    (including both Linux and Windows partitions) with the commitment to use Windows
    as little as possible. Within a year, the only reason Windows remained on the
    machine was my wife''s lack of familiarity with Linux. Given that her computing
    needs were to surf the Web and read email, she, too, eventually made a smooth
    transition to Linux as the full-time computing platform.


    We''ll talk about the dual-boot option at length in this chapter. But first, it''s
    important to undertake some preliminary research that will help you solve the
    issues you might experience during installation, whether you''re using a pure
    Linux system, or a dual-boot configuration.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 1: Building The Linux Environment


    # The Necessary Research


    Few things are as frustrating as a lack of hardware support, especially when you''ve
    used to the quick driver installs offered by Windows. In fact, Windows comes complete
    with a basic set of drivers that are intended to anticipate the hardware attached
    to your machine. Hardware manufacturers also release driver discs for devices
    such as video cards, network cards and scanners for Windows machines. Developing
    these drivers costs the hardware manufacturers a great deal of money, so for a
    long time it didn''t make economic sense for hardware developers to supply drivers
    for Linux.


    As Linux has gained market share within the server market, Linux development has
    improved markedly. Storage devices, RAID arrays, Ethernet cards—all have enjoyed
    increasing Linux driver development in the past few years.


    In order to avoid the headache of missing drivers, it''s important to do a little
    research before installing your Linux distribution. While it''s unlikely that
    you''ll have a problem with major distributions, you''ll still to do the research
    just to avoid any hardware issues.


    Most of the major distributions release hardware compatibility lists. These lists
    itemize the hardware that''s known to work with the drivers included in the distributions.
    Red Hat/Fedora, Mandriva, and SuSE also provide hardware mailing lists for distributions
    from their Websites. These lists, tend to rely on users to help solve hardware
    compatibility issues after the fact, rather than providing information for users
    before an installation.


    Additionally, there''s an excellent compatibility list for Linux in general. It
    doesn''t provide quite the degree of granularity you''ll find in the manufacturer-specific
    lists, so it should be used as a fallback, rather than your primary source of
    information.


    # Hardware Compatibility Lists


    # Red Hat/Fedora


    Red Hat''s major product line is Red Hat Enterprise (RHEL), which is mostly based
    on Red Hat''s free software distribution, Fedora. Fedora is not actually maintained
    by Red Hat; it''s maintained by the community of Fedora developers. However, Red
    Hat does a lot of work on Fedora, because work flows into RHEL.'
