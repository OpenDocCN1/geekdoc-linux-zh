    # # Introducing the Shell


    In the same way that we can interact with Linux graphically through a desktop
    environment such as GNOME or KDE, we interact with the Linux command line through
    a shell. We have been using the shell throughout this chapter; let''s now take
    a look at some of its more advanced features.


    The default shell in Fedora Core (and, in fact, in most modern Linux systems)
    bash, or the Bourne Again Shell, bash is a modern rewrite of the original Bourne
    shell, sh, which was written in 1977. While other shell environments exist, such
    as tcsh, csh and ksh, bash has become increasingly popular due to its useful features.
    We''ll look in detail at some of these features here.


    # # Tab Completion


    One of the most useful features of many modern shells is tab completion. When
    a partial command or filename is entered on the command line, and the user presses
    the Tab key, the command or filename will be completed for you. For example, typing
    cat Hello, followed by Tab, will result in cat\ World.txt being completed at the
    command line for you.


    However, typing cd /etc/ht, followed by Tab, doesn''t immediately return anything.
    That''s because two directories begin with /etc/ht: /etc/httpd and /etc/htdig.
    Press the Tab key a second time will list the possible options:


    ```

    [kermit@swinetrek -]$ cd /etc/ht

    httpd/ htdig/

    [kermit@swinetrek -]$ cd /etc/ht

    ```


    We can use this list to continue typing until we''ve typed enough characters to
    identify a single directory; we can then press Tab again to have the filename
    completed.


    # # Command History


    The bash shell records a limited history of recently issued commands—up to 1000
    by default. You can use the up arrow key to scroll back through the com-'
