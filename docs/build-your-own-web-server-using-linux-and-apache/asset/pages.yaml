  md: 'are editable, depending upon who the editing user is, and how the permissions
    on the file have been set. Accordingly, it''s important to understand the permissions
    structure and how it will affect both you and your users'' interaction with system
    files.


    At their most basic, Linux permissions are broken into three sets of permissions.
    These are:


    # Owner (or user)


    The permissions granted to the user who owns the file (usually the user who created
    the file).


    # Group


    The permissions granted to a specified group of users. Users can be added to any
    number of available groups, each of which can have permissions on files.


    # Other


    The permissions granted to anyone who isn''t the owner, or a member of a group
    that has permissions to access the file.


    Each of these sets can grant any combination of the following, self-explanatory
    permissions:


    +   - read


    +   - write


    +   - execute


    What''s especially interesting in the Linux permissions structure is how these
    three sets of three permissions interact. A particular user may belong to a group
    that can only read a particular file, but if that user also happens to be the
    file''s owner, the owner permissions of the file might also grant the user access
    to write to the file''s contents.'
