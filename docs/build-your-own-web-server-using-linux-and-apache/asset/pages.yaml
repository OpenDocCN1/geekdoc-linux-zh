  md: "# Further Configuration with .htaccess and httpd.conf\n\nWhen the server is\
    \ configured to your needs, click OK in the HTTP configuration tool, and restart\
    \ the server using the method of your choice.\n\nWhat happens if you have some\
    \ special requirements for your server—considerations that should apply only to\
    \ specific directories—or you need to quickly lock down directory access to all\
    \ but a handful of users? In such cases, you can write directives into an .htaccess\
    \ file, creating configurations on a directory-by-directory basis. The .htaccess\
    \ file is often referred to as a distributed configuration file. In some cases,\
    \ .htaccess files can make the maintenance and configuration of your server much\
    \ easier.\n\nAn .htaccess file is a smaller and more targeted version of httpd.conf.\
    \ It can contain any directive that's allowed in the global httpd.conf file. For\
    \ example, the following are equivalent:\n\n```\n<Directory /var/www/html>\n \
    \ Options +ExecCGI\n  AddHandler cgi-script .cgi\n</Directory>\n```\n\n```\nOptions\
    \ +ExecCGI\nAddHandler cgi-script .cgi\n```\n\n.htaccess file apply to the directory\
    \ in which the file is found and to all the subdirectories it contains. So, if\
    \ this .htaccess file was located in /var/www/html, it would affect the configuration\
    \ of /var/www/html/navigation, /var/www/html/styles, and so on.\n\n.htaccess files\
    \ can also be used to restrict access to certain directories. For example, if\
    \ we wanted to restrict access to /var/www/html/testing/admin, we could use the\
    \ following .htaccess file like so:\n\n```\nAuthType Basic\nAuthName \"Password\
    \ Required\"\nAuthUserFile /etc/httpd/passwd\n```"
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Chapter 5: Building The Server


    AuthGroupFile /etc/httpd/groups

    Require group admins


    Used in this way, the .htaccess file will tell Apache that the user to enter a
    username and password for a member of the group admins. As specified in this example
    by the UserFile and AuthGroupFile directives, username and password will be checked
    against the /etc/httpd/passwd file, then the user''s membership will be checked
    in /etc/httpd/groups.


    The /etc/httpd/passwd file is maintained using the htpasswd tool.


    ```

    [root@swinetrek kermit]# htpasswd -c /etc/httpd/passwd kermit

    New password:

    Re-type password:

    Adding password for user kermit

    [root@swinetrek kermit]# htpasswd /etc/httpd/passwd mispiggy

    New password:

    Re-type password:

    Adding password for user mispiggy

    [root@swinetrek kermit]#

    ```


    You must use the -c option when adding the first user. This tells htpasswd to
    create the password file. An example of the file produced by htpasswd is shown
    below.


    File: /etc/httpd/passwd

    kermit:phQeDvrsdvni6

    mispiggy:Xzbbbk8ImcCclI


    The /etc/httpd/groups file must be maintained manually, though a text editor.
    It''s a pretty simple file: groups are listed at the beginning of each line, and
    the members of each group follow.


    File: /etc/httpd/groups

    mermit gonzo fozzie mispiggy

    admins: kermit mispiggy


