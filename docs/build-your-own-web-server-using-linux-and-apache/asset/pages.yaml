- img_proc: true
  md: 'The process of installing your server will expose you to the power of the RPM
    Package Manager¹¹⁶ (RPM) system; RPM is a format that''s used to distribute software
    for inclusion in Fedora Core, as well as other Linux distributions as SuSE and
    Mandriva Linux. The installation of your server will occur as a series of RPM
    transactions, which check for dependencies and install each chosen piece of software.


    # Dependencies Demystified


    Nearly all computer software is dependent upon other pieces of software. A simple
    and obvious example of this is that any software running on your new server is
    going to depend on Linux. This relationship is called a dependency. Dependencies
    are engendered by the philosophy of modular software design, or building big programs
    from other, smaller programs. RPM investigates and handles these dependencies,
    checking for the existence of dependent code and noting those pieces that might
    be missing.


    Now its time to make a nice cup of coffee: the installation of your Fedora Linux
    system may take as long as 45 minutes, depending on the speed of your machine.
    You will be asked a few times during the installation to insert additional CD-ROMs,
    and when the installation is complete, you''ll be prompted to reboot the machine.
    Your new server will start by presenting a screen that displays information about
    the Linux distribution and kernel version.


    Note that if youve set up a dual-boot system, a countdown will occur before the
    boot loader automatically starts the default operating system. The countdown time
    can be adjusted through the boot loader configuration. This could be important
    for a production Web server: should the system go down, you''ll probably want
    the machine to return to the network as quickly as possible.


    ¹⁶RPM was originally an acronym for Red Hat Package Manager, but was officially
    changed to a recursive acronym when it came into wide use outside of Red Hat.
    Other examples of recursive acronyms are PHP (PHP Hypertext Preprocessor) and
    GNU (GNU''s Not Unix).'
  merge: -1
