    # Using the /etc/cron.schedule Directories


    We''ve already discussed the default crontab entries do. The first line runs the
    command run-parts /etc/cron.hourly every hour: run-parts will go into the /etc/cron.hourly
    directory and execute every executable file it finds there. Entries also exist
    for cron.daily, cron.weekly, and cron.monthly directories. If you prefer, you
    can simply store your backup.sh script in the /etc/cron.daily directory. It will
    run with the other daily scripts.


    # Anacron


    Anacron is, to some extent, an extension of cron. Like cron, it''s intended to
    execute commands on a schedule, taking care of routine tasks. However, unlike
    cron, Anacron makes no assumption that the machine is up and running 24/7. In
    that sense, Anacron provides some measure of redundancy to the functions of cron.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Chapter 4: System Administration


    Like other Linux applications, Anachron gets its direction from a text configuration
    file. In Fedora, this file is /etc/acronontab. At first glance, the acronontab
    looks less daunting than crontab, even though we know how simple the crontab file
    can actually be.


    File: /etc/acronontab


    ```

    # /etc/acronontab: configuration file for anachron

    # See anacron(8) and acronontab(5) for details.


    SHELL=/bin/sh

    PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

    ```


    | 1 65 cron.daily run-parts /etc/cron.daily |

    | 7 70 cron.weekly run-parts /etc/cron.weekly |

    | 30 75 cron.monthly run-parts /etc/cron.monthly |


    As in crontab, the first few lines of this file define some environment variables:
    in this case, SHELL and PATH. The remaining lines describe, over a number of fields,
    the jobs that Anachron must carry out. From left to right, these fields are as
    follows:


    # period


    The period field identifies the number of days that constitute the "period" in
    which the job will run once. In this example, the first job will run every day,
    the second job will run every seven days, and the last job will run once every
    thirty days.


    # delay


    When it''s time for a task to be executed, Anachron will wait this many minutes
    before executing the task. This is potentially useful when a machine is turned
    off after a long period of being switched off. For example, imagine our machine
    was turned off for more than thirty days. When we turn it back on, Anachron will
    realize that it''s time to execute all of its scheduled tasks. It execute the
    daily tasks in 65 minutes time, the weekly tasks in 70 minutes and the monthly
    tasks in 75 minutes time. This staggering stops the machine becoming bogged down
    by three competing jobs.


    # job identifier


    The job identifier field is as it sounds: a means by which the system can identify
    each Anachron task. This field can contain any character, barring spaces, tabs
    and shells.


    130'
  merge: -1
