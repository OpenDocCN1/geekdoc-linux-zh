  md: '# Telnet and FTP Security


    Though they''re shown as options in the Fedora security configuration screens,
    both telnet and FTP are widely recognized as insecure protocols. SSH is a much
    more secure option than telnet for accessing remote machines, and SFTP is a more
    secure option than FTP for transferring files. If an SFTP capability is required,
    it''s recommended that it be set up on a different server that''s isolated as
    much as possible from the rest of the network.


    # Setting the Time Zone


    Fedora offers two options for setting the time zone for your server. You can roll
    the mouse over the metropolitan area that''s closest to you, or you can select
    an exhaustive list of cities. In either case, the chosen city will be highlighted
    on the map, as shown in Figure 1.15.


