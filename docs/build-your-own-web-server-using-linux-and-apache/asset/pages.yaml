    # My machine won’t boot! How do I fix it?


    If your machine won’t boot at all, you need to use a rescue disk. Linux is available
    in Live CD form, which is a full Linux installation that runs entirely from a
    CD without touching the machine’s hard disks. Fortunately, you can boot a Live
    CD and look at the hard disks from the Live CD environment.


    Before you boot a Live CD, watch the failing process. Linux tries to be verbose
    about errors that occur while the system is booting; make a note of anything that
    fails. Often, the best way to find a remedy for this kind of problem is to search
    the Web for the error message that the system displays. Of course, once you’ve
    identified what the error is, you’ll need to be able to get at Linux to fix it;
    this is where the Live CD becomes useful.


    There is no “official” Fedora Live CD, but many other Linux distributions offer
    Live CDs that work similarly to a Fedora installation. The Berry Linux CD, which
    is based on Fedora Core, can be obtained from yui.mine.nu/linux/eberry.html, and
    the Ubuntu Live CD can be downloaded from http://www.ubuntulinux.org/download/.
    Download the CD image from the Website, use it to a CD, and boot your LAMP server
    from it.


    Once the server has booted, open a Terminal. You will need to know which device
    is your root partition (a decision that was made when the system was installed);
    if the machine runs only Fedora Core, it’s likely to be /dev/VolGroup00/LogVo100.
    Execute the following commands:


    ```

    ```

    $ su

    Password:

    # mkdir /tmp/hd

    # mount /dev/VolGroup00/LogVo100 /tmp/hd

    #

    ```

    ```'
  merge: -1
