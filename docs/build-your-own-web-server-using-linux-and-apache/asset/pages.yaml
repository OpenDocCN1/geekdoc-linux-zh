    # Mounting and Filesystems


    We briefly touched on the concepts of mount, points and filesystems in Chapter
    2. In Linux, when we insert removable media of any kind, we need to mount the
    filesystem stored on that media device. This concept is fairly unfamiliar to Windows
    users, but once you get the hang of it, it becomes second nature. In fact, Windows
    does the same thing; the difference is simply that the Windows operating system
    automates the mounting process, so users are usually unaware that it takes place.
    Nautilus largely automates this process, too, but it''s important for system administrators
    to know how devices are mounted, and how mounting is accomplished from the command
    line.


    # Mount a Filesystem with the mount Command


    Let''s look at the process of mounting a floppy disk from the command line:


    ```

    [kermit@swinetrek ~]# su

    Password:

    [root@swinetrek kermit]# mount -t vfat /dev/fd0 /media/floppy

    [root@swinetrek kermit]# exit

    ```'
