  md: '# NFS


    NFS, or Network File System, is the Linux-native equivalent to Samba. It allows
    client machines to mount parts of your machine''s filesystem as if they were other
    devices.


    The interface for the NFS configuration (accessible via Desktop > System Settings
    > Server Settings > NFS) is much the same as that provided for Samba configuration.
    The directory, the allowed hosts, and the permissions are all displayed in the
    main window. You can add or delete a share and, as with the Samba configuration,
    check and alter the properties of existing shares.


    # Mounting NFS Shares


    You can mount NFS shares quickly and easily using the mount command. Instead of
    specifying a device file, such as /dev/fd0, you simply specify a server name and
    the name of the shared directory, separated by a colon.


    ```

    [root@swinetrek kermit]## mkdir /mnt/kermit-oldserver

    [root@swinetrek kermit]## mount oldserver:/home/kermit \

    > /mnt/kermit-oldserver

    [root@swinetrek kermit]#

    ```'
