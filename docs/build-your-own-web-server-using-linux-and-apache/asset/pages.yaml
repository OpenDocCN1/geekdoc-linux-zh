  md: '# A Quick Tour of the Filesystem


    difference between these directories—and how to avoid confusion—in a minute.


    # /boot


    This directory contains all the files necessary to boot the operating system,
    including the Linux kernel.


    # /bin and /sbin


    These folders are similar in their contents—they both contain executable binary
    files—but differ in purpose. /bin contains executables that you''re likely to
    use from the command line: such as ls, mv, and cp, which we''ll be looking at
    in Chapter 3, this folder. /sbin contains commands and processes that are used
    by the operating system itself, so it might be best to stay away from this folder
    if you''re starting out.


    # /dev


    These are the device files—abstractions of all the devices that are actually in
    the system, as well as all devices that could be added to the system. These files
    provide the operating system with a description of, and instructions for handling,
    each device.


    # /etc


    This directory contains system-specific configuration files.


    As an administrator, you''re likely to spend quite a bit of time in the /etc directory,
    because it contains configuration instructions for most of the applications on
    the system. For example, the configuration file for Apache is located at /etc/httpd/conf/httpd.conf.


    # /home


    This directory contains the home directories for each user of the system. For
    instance, our example user has the home directory /home/kermit, and other users
    on the same system have home directories /home/gonzo and /home/fozzie. By default,
    Gonzo or Fozzie cannot read or write to Kermit''s files, and Kermit cannot read
    from or write to theirs (only the root user has this ability).


    # /root (The Root Directory)


    This is the home directory of the root user, and is not to be confused with the
    other “root directory”, /.'
