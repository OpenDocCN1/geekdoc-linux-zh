  md: '# Figure 9.11. The WWWBoard passwd.txt vulnerability explained.


    wwwboard passwd.txt

    This script is Copyright (C) 1999 Jonathan Provencher View the source code of
    this plugin here


    | Family | CGI abuses |

    | --- | --- |

    | Nessus Plugin ID | 10321 |

    | Bugtraq ID | 64912453 |

    | CVE ID | CVE-1999-0953 |


    Description:

    The remote host is running wwwboard, a bulletin system written by Matt Wright.


    This board system comes with a password file (passwd.txt) installed next to the
    file ''wwwboard.html''.


    An attacker may obtain the content of this file and decode the password to modify
    the remote www board.


    Solution: Configure the wwwadmin.pl script to change the location of passwd.txt
    Risk factor: High


    These descriptions should allow you to understand the nature of the vulnerability,
    and identify whether you are vulnerable to compromise. They''ll also explain workarounds
    or solutions to prevent your continuing vulnerability. For example, the description
    of the WWWBoard vulnerability explains how it can be fixed: edit the wwwadmin.pl
    script to change the location of the passwd.txt file.


    Now that you understand what Snort stores in its alert file, you need to remember
    to check that alert file. The Best Intrusion Detection System in the world is
    completely useless, even though it detects intrusions, no-one notices that it''s
    doing so. The primary way to check is simply to do what we did above: manually
    look in the file on a regular basis, and examine each alert to see if it represents
    a potential vulnerability. However, having to remember regularly to look at the
    file is boring, and boring tasks get forgotten. It''s much better to set up a
    system explicitly to notify you of Snort alerts, rather than having to remember
    them yourself.'
