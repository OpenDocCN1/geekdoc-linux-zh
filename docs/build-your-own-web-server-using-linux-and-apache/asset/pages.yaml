    probably used to. Let’s look at an outline of the filesystem structure, and explore
    its various functions and elements.


    / (The Root Directory)\This is the top level of any Linux system, known as the
    root directory. Unfortunately, there’s also a directory named root. Don’t worry:
    we’ll explain the


