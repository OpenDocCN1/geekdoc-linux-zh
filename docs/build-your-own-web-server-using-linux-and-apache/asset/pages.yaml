  md: '# Keep Out Of root!


    It''s never advisable to log in to your system as root. Remember that root is
    the omnipotent account in Linux, and is capable of performing any action on the
    system. Those actions include deleting system-critical files, which completely
    disables the system, making it very difficult to recover. root access should always
    be used sparingly. When logging in to your system, first log in to the user account;
    then, if necessary, you can perform administrative tasks by switching over to
    root temporarily.


    Remember that it''s important to shut down your Linux box gracefully, just as
    you would a Windows machine. This allows any buffered data to be written to the
    disk before the system shuts down. You can shut down data either by selecting
    Desktop > Log Out, or through the command line. Let''s look first at the graphical
    tool for shutting down your machine.


