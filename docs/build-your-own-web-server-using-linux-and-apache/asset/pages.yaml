  md: '# VNC


    What SSH is to the command line, VNC is to the desktop: VNC allows you to see
    and control another machine’s graphical desktop remotely. It’s very useful for
    controlling a remote server, especially since you can control that machine the
    way you want, rather than being restricted to the command line.


    # Setting up a VNC Server


    Fedora Core comes with little VNC support built-in, but this simple support should
    be used only for servers that are internal to your network. On its own, VNC is
    very insecure, but we can leverage SSH’s security features to make it secure.
    We’ll look at how this can be done a little later in the chapter.


    To start the simple VNC server, launch the Remote Desktop Preferences tool shown
    in Figure 7.9 by selecting Desktop > Preferences > Remote Desktop.


    Check Allow other users to view your desktop and Allow other users to control
    your desktop, and uncheck Ask you for confirmation. You can optionally provide
    a password that users must enter before they connect to the VNC server—tick the
    user to enter this password, and enter a password—but keep in mind that this only
    provides a very light level of security. It’s important to note that this VNC
    server works only while a user is logged at the server; if the server is waiting
    at the login screen, VNC connections using this method are not possible using
    this tool.


    Clients will connect to your VNC server via over ports 5900–5906, so you’ll need
    to open these ports in your firewall: 5900:tcp, 5901:tcp, ... 5906:tcp to the
    Other Ports list in the Security Level Configuration tool. Once you’ve done so,
