- img_proc: true
  md: '# Chapter 6: Server Administration


    the logged-in user to browse the repository, or library of code currently in CVS.


    Majdomo List Manager

    Majdomo is an email list manager and has long been recognized as the standard
    in Linux. The Majdomo List Manager page in Webmin allows you to create new lists
    and define the parameters of existing email lists.


    MySQL Database Server


    Figure 6.8. The Webmin MySQL module.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_225_0.png)


    The top part of the page shown in Figure 6.8, the MySQL module displays an icon
    for each database that''s hosted on the server. Clicking on a database icon displays
    new icons that represent each of the tables in that database; these can be clicked
    on to display the structure of that table. From here, you can edit the structure
    of the table, or edit the data in that table. At each point


