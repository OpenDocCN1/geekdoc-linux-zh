  md: '# Security Level Configuration


    Figure 4.25. The Security Level Configuration tool.


    ![](img/9ba05966cc0c98b5830dd68d51d157c1_163_0.png)


    The firewall and Security Enhanced Linux (SELinux) are configured using the Security
    Level Configuration tool shown in Figure 4.25. To launch it, select Desktop >
    System Settings > Security Level.


    This tool is a graphical front end for the iptables command-line tool and SELinux
    configuration.


    iptables provides the capability to limit the network traffic coming and out of
    your system to known traffic types, to specific ports, and/or to specific devices.
    This is all configured in the Firewall Options tab of the Security Level Configuration
    window. Clearly, if you''re configuring and administering a Web server, it''s
    important to allow WWW (HTTP) traffic on the machine. You can also optionally
    allow Secure WWW (HTTPS) traffic. For remote administration, it''s useful to allow'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'SSH (Secure Shell) traffic: this will allow you to log into the machine from
    a remote location and perform administrative duties securely, as if you were sitting
    at the server. Telnet should seldom be allowed: this protocol has many, many known
    security issues.


    If, instead of allowing traffic types, you''d prefer to allow all traffic across
    a specific interface (the first ethernet device, for example, or eth0), select
    that option from the Trusted devices list. Note that this is less secure than
    limiting traffic to specific protocols, as all traffic across the chosen interface
    will be allowed.


    You may also want to allow traffic through specific ports. You can define these
    ports in the Other ports text field of the Security Level Configuration window,
    separated by commas. Of all the options in the Firewall Options tab, this is the
    most secure, as it limits traffic to very specific entry points. We''ll look at
    this in more detail in Chapter 9.


    SELinux is a new addition to Fedora Core, available as a standard option only
    since Fedora Core 3. It''s a series of security related enhancements to the Linux
    kernel, largely written by the US National Security Administration (NSA). SELinux
    is such a rich tool that detailed configuration information is beyond the scope
    of this book. You can access more information about SELinux, including an extensive
    FAQ list, online at http://www.nsa.gov/selinux/.'
