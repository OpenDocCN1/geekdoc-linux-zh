    # Changing File Permissions with the chmod Command


    We looked at permissions, and saw how to change them through the GUI, in

    Chapter 2. You can also change these permissions from the command line using

    t chmod (change mode) tool.


    ```

    [kermit@swinetrek -]$ chmod o+w Hello\ World.txt

    [kermit@swinetrek -]$ 11

    total 16

    drwxr-xr-x 2 kermit kermit 4096 5 14:21 Desktop

    -rw-rw--r-- 1 kermit kermit 13 Sep 8 07:30 Hello World.txt

    ```


    Here, we''ve granted all other users access to Hello World.txt. We told

    chmod to do this by adding o+w to it. Let''s take a look at what that means:


    +   - The o character tells chmod to deal with the set of permissions for other
    users.

    This could be replaced with u for the user set, g for the group set, or for all

    three sets.


    +   - The + character tells chmod to grant permission. This can be changed to
    -,

    which will tell chmod to revoke permission.


    +   - The w character tells chmod to deal with write permission. This can be changed

    r for read permission, or x for execute permissions.


    You can also combine these letters. For example, you can use ug-w to revoke

    write permissions for the user and group.'
