  md: '# Extra


    You can use accessibility operators to specify how classes and members of classes
    work in relation to other parts of the project. When you declare a class, specify
    an accessibility operator to define how the rest of your project and even outside
    applications can access the class.


    Each member inside a class has a particular accessibility as well. The two main
    operators are Public and Private. Other operators exist to work with inheritance
    and other advanced topics. See Chapter 8 for more information.


    # ACCESSIBILITY OPERATORS


    | Public | Public accessibility allows you to access the element from within the
    same project and from other projects that reference the project. Public members
    of classes are available to any user who creates an instance of the class. |

    | Private | Private accessibility allows only from within the same module, class,
    or structure where you declare the element. You cannot access members of a class
    you declare as Private outside of the class, but use it inside the class. |


