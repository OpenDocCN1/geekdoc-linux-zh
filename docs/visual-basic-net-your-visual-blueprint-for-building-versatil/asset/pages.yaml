  md: '# VISUAL BASIC .NET


    # USING THE RICH TEXT CONTROL


    You can use the RichTextBox to enter rich data, as formatted text, pictures, and
    OLE objects. An example of the rich text in Word is Word, a program included with
    Windows. You can create much of the functionality in Word in your application.


    The RichTextBox control stores the data inside the box in RTF format. Most applications
    can understand this, so you can cut and paste text to and from applications such
    as Microsoft Word into your running document. Similarly to the TextBox control,
    you can use the TextBox to read or set the text of the RTF. If you set the AcceptsTab
    property to True, you can enter a tab into a control. If the property is False,
    the focus shifts to the next.


    Scrollbars. The other settings for the property are FixedHorizontal, FixedVertical,
    and FixedBoth; they force the specified scrollbars to show.


    Runtime properties play an important role in using the RichTextBox control''s
