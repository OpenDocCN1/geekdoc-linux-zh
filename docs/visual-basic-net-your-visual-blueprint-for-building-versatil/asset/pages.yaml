  md: '# LANGUAGE CHANGES FROM VISUAL BASIC 6


    Better than Visual Basic 6, the previous version of Visual Basic, the Visual Basic
    .NET upgrade has many significant changes, which makes it a more powerful and
    cross-language oriented program. This section helps


    you understand these changes before attempting to upgrade a Visual Basic 6 project
    to Visual Basic .NET. To upgrade a project using the Upgrade Wizard, see the section
    "Using the Upgrade".


    | Variant | Date |


    A special data type, the Variant data-type in Visual Basic 6 has the capability
    of holding data of any type. The variable may store various data like numbers,
    strings, and objects. Variant is also the default variable type in VB 6 if you
    do not specify a type for the variable. The Object variable in VB 6 can store
    object references, but does not have the ability to store data types.


    In Visual Basic 6, the Date type serves as a Double floating-point variable that
    can manipulate dates. VB 6 lets you manage a variable of type Date as Double.


    In .NET, the Variant is no longer available. The common language runtime adopts
    the Object as the universal data type because VB .NET represents all variable
    types as objects, just like other object languages, the Object variable can now
    store any kind of data.


    Visual Basic .NET stores the Date as a 64-bit integer, which improves speed of
    operations. The new method of storing dates breaks the compatibility of working
    with Date variables. The .NET Framework provides ToOADate and FromOADate methods
    to convert a date to and from Double variable type.


    # Fixed-Length Strings


    In Visual Basic 6, the numeric data type Integer is 16-bit value, while the Long
    type stores 32-bit values. To provide support for larger numbers, VB .NET represents
    an Integer as a 32-bit value and the Long as a new type, Short, represents 16-bit
    values.


    In Visual Basic 6, you can declare a variable as fixed length string by specifying
    the String type followed by a multiplication sign (*) and length. The Common Language
    Runtime (CLR) for Visual Basic does not support fixed-length strings. A compatibility
    allows you to create fixed length strings by calling the compatibility class FixedLengthString
    and find it in the Visual Basic.Compatibility namespace.


    # Currency


    # Type


    In Visual Basic 6, the Currency data type stores a 64-bit number format, although
    it inserts a decimal point at the fourth position. Also in VB 6, although you
    cannot declare a variable of type Decimal, the Variant types use a Decimal which
    stores a 96-bit integer value with


    The Type statement in VB 6 declares a user-defined type.


    Visual Basic .NET does not support the Type statement; instead, you use the Structure
    statement. You can learn about structures in Chapter 7.


    Visual Basic .NET abandons the Currency in favor of using only the Decimal data
    type. Decimal offers more accuracy and the CLR supports directly.'
