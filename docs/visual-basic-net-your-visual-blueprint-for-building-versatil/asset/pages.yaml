  md: '# VISUAL BASIC .NET


    # AN INTRODUCTION TO VISUAL BASIC .NET


    Visual Basic .NET is part of Microsoft Visual Studio .NET, the latest development
    from Microsoft. With Visual Basic .NET, or VB .NET for short, you can create powerful
    Windows and Internet applications using a unified toolkit. See the section "Understanding
    the Framework" for more on the .NET Framework.


    With the release of VB .NET, Visual Basic received advanced language features
    on par with languages like C++, C#, and Java. Powerful new features give VB .NET
    the simplicity of its predecessors, with the power of creating full-fledged applications
    that take advantage of the computing field''s innovations.


    # FEATURES


    # Easy to Use


    The Visual Basic language implements an updated version of the ORIGINAL BASIC
    language, developed in 1964. The focus of BASIC language was to provide a high-level
    programming language that hid much of computer''s complexity from a developer.


    # Automatic Memory Management


    Visual Basic .NET uses a system garbage collector to manage your memory. Garbage
    collection is an important feature that VB .NET shares with C# and Java. Garbage
    collection does not require you to delete objects; VB .NET identifies objects
    that are no longer referenced and removes them automatically when your application
    is idle.


    # Fully Object-Oriented


    Visual Basic .NET, unlike Basic 6.0 and earlier versions, supports full object-oriented
    programming, with support for polymorphism, true inheritance, and interfaces.
    Interface-oriented programming allows VB .NET to communicate and extend other
    high-level languages like C++. With the power of the .NET Framework, Visual Basic
    .NET can utilize source from another language, inheriting a class in C# or providing
    true objects using C#. See for more.


    # Powerful Database Support


    VB .NET extends the support for which the Basic language is known when developing
    high-level, multi-tier applications. Supporting a new version of ADO and ADO.NET,
    VB .NET can create powerful Web-enabled databases with performance and more functions
    than ever.


    # Visual Development


    The advent of the Graphical User Interface (GUI) promised easier-to-use applications
    for the GUI environment was much more than expected. Visual Basic was the first
    programming language that used drag and drop and a powerful development environment
    (IDE) to enable users to develop applications in record time.


    Today, Visual Studio .NET surely its one IDE that performs an enormous array of
    functions. The IDE design allows to expand to various languages and tools. The
    integration of languages also means you do not have to learn multiple environments
    if you work with more than one language.


    # True Web Development


    Visual Basic .NET uses the new ASP.NET objects to create fully server-side applications
    that use the power of Visual Basic and the .NET Framework while still interacting
    with browsers. ASP.NET, combined with Visual Basic .NET, provides a unique development
    system called Forms that brings the drag-and-drop ease of Visual Basic to development.


    Web Services, one of the most important features of .NET Framework, provides a
    method to access remote objects over the Internet. You can use an object on a
    server and enable any application to access this object directly over the Internet.
    Transparently, you can create Web applications stored on a centralized Web server
    the same as you use a component on the local machine. Visual Basic .NET takes
    full advantage of this functionality and creates Web-enabled objects.


