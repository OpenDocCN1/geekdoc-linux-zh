  md: '# THE .NET CLASS FRAMEWORK


    # GETTING STARTED WITH VISUAL BASIC .NET


    The .NET Framework libraries implement the functions you use in .NET enabled languages.
    The Class Framework consists of hundreds of classes and interfaces. It provides
    functionality around most of the Windows system libraries and provides extra functionality
    not available in standard Windows libraries.


    # Features


    The .NET class framework includes functions over a broad set of needs. These functions
    include:


    +   * Data access and manipulation: data access through ADO.NET, robust XML support,
    and file directory controls

    * Standard language functions: math commands, arrays, collections, and strings

    * Creation and management of threads: free-threading libraries and process management

    * Interfaces to Windows functions: Windows Forms, Web Forms, Web Services, and
    console applications

    * Management and enforcement of application security

    * configuration

    * Working with Windows Directory Services, event logs, message queues, and timers

    * Support for a number of network protocols


    # System Namespace


    The System namespace holds most of the functionality in the .NET Framework. The
    table explains some of the major sections of System. You can use this as a starting
    point to find a particular function in the library.


    | NAMESPACE | DESCRIPTION | EXAMPLE CLASSES |

    |---|---|---|

    | System.Classes | Classes representing sorts of collections. | ArrayList, HashTable,
    SortedList |

    | System.Data | Classes that enable the ADO.NET architecture. | DataRow, DataTable,
    DataColumn, DataSet |

    | System.Diagnostics | Classes that enable you to debug your application and trace
    execution of your code. | Debug, EventLog, FileVersionInfo, Trace |

    | System.Drawing | Provides access to GDI+ basic graphics functionally. | Brush,
    Font, Image, Region, SystemColors |

    | System.Drawing.Printing | Provides primitives for printing and printer settings.
    | PageSettings, PrintDocument, PrinterSettings |

    | System.IO | Contains types for reading and writing data streams and files. |
    DirectoryInfo, FileInfo, StreamReader, StreamWriter |

    | System.Net | Provides interfaces to many common Web protocols. | Cookie, DNS,
    IPAddress |

    | System.Resources | Manages the creation and storage of various culture-resources
    in an application. | ResourceManager, ResourceReader |

    | System.Security | Provides the underlying security of the CLR | PermissionSet,
    SecurityManager |

    | System.Cryptography | Provides data encoding and decoding routines, and functions
    like hashing, random number generation, and message authentication. | CryptoString,
    DSACryptoServiceProvider, MD5CryptoServiceProvider, RSACryptoProvider |

    | System.Text | Contains classes representing ASCII, Unicode, other classes for
    conversion formats. | ASCIIEncoding, StringBuilder, UnicodeEncoding, UTF8 | |

    | System.Threading | Enables multi-threaded programming: classes and pools of
    threads, and synchronization issues. | Monitor, Mutex, Thread, ThreadPool |

    | System.Web | Provides classes that enable server communication for ASP.NET applications.
    | HttpApplication, HttpPostedFile, HttpRequest, HttpResponse, HttpWriter |

    | System.Windows.Forms | Provides classes to complete Windows. | Button, CheckBox,
    Clipboard, Form, ListView |

    | System.Xml | Provides standards-based support for processing XML. | NameTable,
    XmlAttribute, XmlNode, XmlReader, XmlText, XmlValidatingReader |'
