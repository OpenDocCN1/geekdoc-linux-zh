  md: '# VISUAL BASIC .NET


    # SELECT NUMERIC DATA


    You can use the TrackBar to allow users to select numbers or other ordered data.
    The TrackBar provides a slider that you can display from right to left, or top
    to bottom.


    On the control display, the slide bar draws into a point that points towards a
    set of ticks. A tick is a little dash on the control that indicates the values
    of the slider. The TickFrequency property determines how many ticks the control
    displays. For example, if the TickFrequency property is set to 10, the bar contains
    ten ticks, one for each value. The TickFrequency of two ticks is every other value.
    The TickStyle property allows you to place the ticks on the BottomRight-for a
    horizontal bar, or TopLeft-for a vertical bar.


    The TrackBar provides two settings for the Orientation property. Horizontal makes
    the slider left and right. Vertical orientation makes the slider up and down.
    Once it is in a form, the control does not change height in horizontal mode or
    with vertical media.


    The Minimum property determines the smallest value of the slider that the user
    can select by moving the slider to the left or top position. The Maximum property
    determines the largest value of the slider that the user can select at the right
    or bottom position of the bar. You can set the Value property at design-time or
    in order to position the slider. When the user changes the slider, the Value property
    updates.


    The Scroll event fires when the user moves the slider with the mouse or keyboard.
    The Value property updates to the new position of the slider before the event
    fires so you can display the number or make appropriate changes based on the position
    in the system.


    # SELECT NUMERIC DATA


    ![](img/6e977c6eee8c1535039c864d41da5ccf_79_0.png)


    ![](img/6e977c6eee8c1535039c864d41da5ccf_79_1.png)'
