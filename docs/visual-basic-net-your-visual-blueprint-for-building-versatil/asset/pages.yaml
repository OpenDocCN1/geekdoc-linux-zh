  md: '# VISUAL BASIC .NET


    # AN INTRODUCTION TO COMPONENT CREATION


    Visual Basic .NET enables you to create components that you can use and reuse
    throughout your Windows, console, Web, and service applications.


    Components are classes that work more effectively as design tools in application
    development.


    # Ease of Use


    You can easily create your components in code or assemble them from the existing
    components in the .NET Framework classes, using Visual Basic .NET or C#. You can
    use non-visual components and associated features to easily incorporate resources
    as message queues, event logs, and counters into your applications.


    The .NET Framework classes greatly expand the component programming capabilities
    of Visual Studio .NET. Instead of a limited set of classes, you have a large library
    of sophisticated components that you can use as assemblies, or to derive high-quality
    components of your own.


    # Component Visual Development


    The rapid application development, or RAD, supports making controls and non-visual
    components as creating forms. You start with


    inheriting from an existing component, and add other components to build in the
    functionality you need.


