  md: '# USING THE IF STATEMENT


    You can use conditional statements when you run different code based on specific
    conditions. The most frequently used conditional block relies on the If statement.


    For example, if you want to display a message on a calculation that determines
    the temperature, you can quantify anything over 80 degrees as hot and any other
    temperature as cold. This calls for a test of the temperature to determine which
    range it handles.


    The If statement tests a condition you provide, and runs a block of code if it
    is True. If the statement is False, .NET skips the block of code if. For more
    information on forming statements, see "Work with Operators".


    The format for an If statement is If expression Then. You can place code to execute
    the conditional


    on the same line. If you have more than you need to execute, you can start the
    code on the next line and enclose the statements with an End statement.


    In the case you want to provide code when the condition is False, you can insert
    an Else statement between the If...Then and End statements. If the condition is
    False, the code jumps to the code located between the Else and End instead directly
    after the If


    To make your code easier to understand, you can line up If, Else, and End statements
    with the rest of the code in your method. You can then indent the blocks of code
    inside the statements. This capability enables you to identify blocks of code
    easily. The Development Studio provides the smart feature, which automatically
    enables this option by default.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_113_0.png)


    +   1 Create a new project or opening an existing.

    2 Create or open the method where the test needs to execute.

    3 Type any initialization code necessary before the tests.

    4 If x < 5 Then, replacing x with 5 with the conditional statement you want to
