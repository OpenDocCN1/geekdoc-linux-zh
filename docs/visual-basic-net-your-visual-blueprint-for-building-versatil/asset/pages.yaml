  md: '# # CUSTOMIZE YOUR INSTALLATION


    You can customize the Setup Project to provide various installation capabilities.
    You can add menus to the client''s Start Menu, as well as icons to the Desktop.


    To modify the setup appearance, you modify the project''s properties of the setup
    project. The Title property specifies the title of the installation. The Author
    property specifies the author to show in the installation. Description specifies
    a description for when setup makes your product. The Manager property specifies
    the manager or URL to your product. You can also specify a manufacturer information
    as an help using the `Manufacturer` property. The ProductName property specifies
    the name of the setup project using the `SupportPhone` and `SupportUI` properties.
    The Version property specifies the software version setup determines how it handles
    a previously installed version. The `DetectInstalledVersion` property specifies
    if setup determines that a newer version exists and if this property is `True`,
    installation cancels.


    To customize the file locations setup program uses to install the application,
    you use the File System in the setup project. In the File System window, four
    folders you can place items, by default: the Application Folder, Global Assembly
    Cache Folder, the User''s Desktop, and the User''s Program Menu. Although only
    four items appear, multiple of others exist. You can add files to the Windows
    folder, the System folder, or the User''s favorites or application folders, others.


    You can also specify subfolders in your installation directories to install particular
    files to particular locations. You can simply drag and drop


