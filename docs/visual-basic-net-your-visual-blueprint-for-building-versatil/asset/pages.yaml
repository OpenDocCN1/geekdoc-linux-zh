  md: '# VISUAL BASIC .NET


    # ADD A METHOD


    method enables you to split parts of a module or class into subroutines, as well
    as create a block of code associated with a subroutine. You can use methods to
    call a block of code from other methods inside the class or module. Depending
    on its scope, you can access the method of its module or class. For more information
    on how a method works, see the section "Declare a Variable".


    To create a new method inside an existing code module, you have two options. If
    the code does not need to pass information back to the code that calls it, you
    can use the Sub keyword. If the routine needs to return a value to the code that
    calls it, you can use the Function keyword. For a method, you must designate the
    return type for the Function using the As keyword along with a parameter list.
    For more information on returning values, see the section "Pass Information Methods".


    When a code block stops, the execution begins. When VB.NET reaches the code in
    your method, execution passes back to the code block that it and it proceeds.
    However, any code in a separate method cannot access data from the block that
    invokes it. You can use arguments to pass a list of required information. For
    more information on arguments, see the section "Pass Information Methods".


    To call a method in the same module or class, place the name of the method on
    a line of out in parentheses. If the method requires arguments, enclose the values
    to pass to the method inside the parentheses. You use multiple arguments with
    commas.


