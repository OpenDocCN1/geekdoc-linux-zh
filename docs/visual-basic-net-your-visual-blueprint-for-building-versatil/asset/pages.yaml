  md: '# VISUAL BASIC .NET


    # CREATE A THREAD


    Threads enable multiple parts of your application to execute concurrently. You
    can use threads to start a calculation or network connection without affecting
    the usability of the program. For example, when your application performs a file
    search for the user, you do not want the user to stop working in another part
    of your application while waiting for the search to complete. Instead, you can
    create a thread that runs concurrently without affecting your application.


    In VB.NET, a thread runs the code of a single method in a separate thread. The
    method can call other methods in its thread. To create a new thread, you create
    a new instance of the Thread class. The System.Threading namespace contains the
    Thread class. You pass the address of a method to run using AddressOf keyword.
    For more information on using AddressOf, see the section "Using Delegate and Aggregate".


    VB .NET operates with a free-threaded system. With free-threading, all threads
    run in the same memory space as the application. This means you can access all
    variables, objects, and components within the thread. Before you create a thread,
    understand that many complexities arise when threads execute. See the section
    "Thread-Safe Code" for more information in Visual Basic''s synchronization commands.


    To start a thread, call Start with no parameters. The thread runs until it meets
    one of three conditions: the code in the method completes, the process containing
    the thread ends (normally when your program ends), or you stop the execution.
    See the section "Modify Execution" for more information.


    The Thread.Current method returns the currently running thread. You can use this
    method, which makes it to access an instance of the thread you create.


