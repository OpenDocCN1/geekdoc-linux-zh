  md: '# CREATE A SHAPED WINDOW


    Many like media players create a shaped window to resemble a real-life object.
    You can use a Region to define a shape for a window.


    When the Region lies over the Form, Windows uses the intersection of the actual
    form and the Region object to draw the same parts of the form that exist. There
    if the Region includes the top of the window, a title bar will disappear. The
    code that draws the title bar does not support regions, so the control of the
    window, the icon, and the buttons remain as if you had not set the Region in the
    same as the Form. If you shape cuts off of the title bar, you can hide it by setting
    FormBorderStyle to None.


    Defining a Region object, see the section "Using Regions." Defining a Region for
    a window is something different than creating a region for a cell. A Region object
    does not require you to make the window a single enclosed object. The user still
    needs to use the window, so make the Region fairly.


    To shape your form, set the Form.Region property to equal. While resizable forms
    support a Region, you must use a non-rectangular loading code in Form.Load. If
    you choose to create a resizable window, place code based on the form''s size
    in Form_Load and Form_Resize.


    To close the window without using the form''s close button, use a simple button
    or other control and the Close method. To minimize the window, set the WindowState
    property to FormStartState.Minimized.


