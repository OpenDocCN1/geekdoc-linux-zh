    +   4 Type path.StartFigure(), replacing path with the path''s variable name.


    +   5 Type path.AddLine(10, 10, 100, 300), replacing path with the variable name
    and AddLine(10, 300, 100, 300) with a primitive method.


    +   6 Repeat step 5 until the figure is complete.


    +   7 Repeat steps 4 to 6 to create the necessary figures.


