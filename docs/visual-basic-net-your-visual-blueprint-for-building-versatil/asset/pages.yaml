  md: '# CREATE A WEB APPLICATION


    The Web Application project lets you building Forms-based applications that use
    standard HTML to generate a client interface that any user can access with a standard
    browser. Your Web application automatically maintains information about state,
    used to create a seamless application that shares information across multiple
    pages, and a full object on the client to you interact with the controls.


    IIS can execute the ASP.NET scripts and runs the files in a separate memory space.
    The project template also adds a single Web Form to the project, which functions
    as the main, or default, page. The Web Form is given the name WebForm.aspx by
    default. Visual Studio stores the code for this Web Form in a separate file. If
    IIS runs on your development machine, the project directory points to localhost.


    To create a Web Application, you simply select the ASP.NET Web Application template
    in the New Project dialog. Name the project for generates a folder in your Visual
    Studio project directory that contains the solution and project files. Visual
    Studio also creates a folder by the project name on the server, sets appropriate
    security settings for that, and creates an IIS for the folder, this application
    specifies


    When you run a Web Application project, the Visual Studio builds the VB_NET code
    files into a dynamic link library (DLL) that the ASP files use to perform their
    operations. The ASP files contain the HTML necessary to generate the page appearance
    and the appropriate methods and handlers in your project page. For more information
    on working with your Web Form, see the section "Using a Web Form," later in this
    chapter.


