    You can view the files that make up the primary component of the installation
    by right-clicking the item and selecting outputs. In some cases, the wizard incorrectly
    identifies the files to include with your project. You must modify the files that
    the setup automatically determines it should include in this group. You can right-click
    the primary output item and select ExcludeFilter. A dialog box appears, enabling
    you to specify parts of the project output not to include with your setup application.
    Common file filters are .txt and .vb.


    For any given list item, as a file or assembly, you can modify installation properties.
    You can specify attributes the installation uses to install the file by altering
    the System, Hidden, and ReadOnly properties. If the file is a DLL or COM component
    that the installation needs to register, you can select the Register property.
    Only COM-based DLLs and components need not to register. If the component needs
    to install based on a condition, you can specify the condition by using the Condition
    property. If the condition meets the condition and evaluates to True, the setup
    program installs the file.


