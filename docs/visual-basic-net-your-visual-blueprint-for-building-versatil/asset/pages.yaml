  md: '# USING WEBS 10


    # Extra


    In some cases, you may want to place code for controlling the RadioButton or CheckBox
    control inside a separate event, rather than handling it in a button that changes
    in the form. You can use the Changed event of both controls to monitor changes
    to the Checked property. It is a non-post-back event, so the store events and
    fires as the user invokes an event that requires a server connection, by clicking
    a button.


    You may want to know immediately when the user clicks one of the controls. Normally,
    VB .NET saves the event and fires it with a post-back event to cause fewer roundtrip
    connections to the server, which can consume a significant amount of time and
    interrupt the user. You can use PostBack property to enable post-back behavior
    for your control. When you set PostBack to True, the Checked property causes the
    browser to submit the page to the server, allowing you to fire and generate a
    new page.


