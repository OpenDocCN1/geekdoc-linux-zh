  md: '# BUILD AND RUN A PROJECT


    Because VB creates EXE and DLL files, to test your work, VB must first build the
    created code and forms into a single file that you can run. In case of Visual
    Basic, your computer can only understand the executable code without the assistance
    of the Common Language Runtime (CLR). The CLR provides the ability to work with
    the classes and other parts of your application and to interface with the .NET
    classes. For more, see the section "Understanding the Framework."


    on any target computer that supports the CLR. The CLR for the platform performs
    a final round of just-in-time (JIT) compilation to transform it into machine-specific
    assembly instructions.


    When you build project, VB .NET opens the Output window that holds the text results
    from the operation. If build errors occur, another tool, called the Task List,
    with a list of errors the compiler finds. You can access and handle the error
    and the code editor allows you to correct the error and build the project.


    When VB builds code, the compiler creates code in the format of Microsoft Intermediate
    Language (MSIL). MSIL is a compiled format similar to traditional assembly. It
    contains low-level instructions that move data in and out of registers, but contains
    no dependencies on any particular architecture or hardware platform. The CLR allows
    an EXE or DLL containing MSIL to deploy.


    At this point, you can start the project. If you start with a project that you
    haven''t built since the changes you made start builds the project for you.


    # BUILD AND RUN A PROJECT


