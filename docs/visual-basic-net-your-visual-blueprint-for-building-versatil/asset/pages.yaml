  md: '# USING ADO.NET


    # ACCESS ADO.NET


    # Disconnected Recordsets


    Although previous versions of ADO added disconnection as an afterthought, ADO.NET,
    through major changes in design, its functionality around disconnected data. When
    you connect to a database, you load all of the data in a database into the client''s
    memory. ADO.NET performs all of the changes to these in-memory copies of the table
    information. When the user finishes with the form, or makes changes to the database,
    you can reconnect to the database, ADO.NET looks through the in-memory data and
    applies those changes.


    Because of disconnection, you must carefully design your database. Large tables
    may perform poorly when you load them into memory. If you need speed, you must
    filter only necessary data to a particular client. Also, multiple users can connect
    to a database, retrieve a table, make changes, and update the same records.


    # Object Model


    In ADO.NET, the Object Model recreates all of the functionality in a database
    system. The Object Model must replicate the database contents because the database
    does not connect to the client. The DataSet represents a single table of objects,
    which contains data, fields, and rows. The DataSet is the main wrapper control,
    and can hold any number of tables. The DataSet also allows you to create relationships
    between tables and data objects. These objects, the core set of data for storage
    and manipulation, allow you to bind the components to an actual database or not.


    # ADO.NET OBJECTS


    The connection and adapter components provide the basic ability for connecting
    to a database, while the DataSet provides storage in memory for everything that
    makes up tables and relationships. You see the section


    > “Add Connection to a Form” for more information. The table, row, and column
    objects provide the underlying data and manipulation abilities for the DataSet.


    # DbConnection


    To attach to a database, you first create a data connection object. Microsoft
    includes two components that implement the Connection interface, OleDbConnection
    and SqlConnection. The OleDbConnection component allows you to connect to any
    database, while SqlConnection allows you to connect to a SQL Server database.
    This chapter develops database applications using connection classes, but you
    can substitute the use of OLE classes for the same interfaces, methods, and properties.


    # DataAdapter


    A adapter provides the conduit for connecting a DbConnection to the objects in
    ADO.NET that actually stores and manages the database information. For a particular
    component, you must have a specific adapter that understands how to communicate
    with the connection. Microsoft provides the SqlDataAdapter and the OleDbDataAdapter,
    depending on which DataSet you use.


    # DataSet


    The DataSet is the main component for retrieving and manipulating information.
    The DataSet object stores a set of tables from the database, including their fields
    and all of the associated data. Controls can bind to the DataSet or contained
    tables to view or modify the data.


    # DataTable


    The DataTable represents a single database table. Because the database disconnects,
    this object must provide all the abilities of an actual database table. The DataTable
    relies on DataColumn objects to define the fields of the table and DataRow objects
    to store the actual data of the table. see the section “Work with Data Tables”
    for more information on the DataTable object.


