    # CREATE A WINDOWS SERVICE


    When you develop a complex application, you often require functionality to continuously
    run parts of the application on a server or a client computer. You also need background
    tasks to run continuously when you develop code — for example, a service that
    performs continuous maintenance on a server database, or calculates real-time
    statistics. You can use Windows Service code in the background without an interface
    or requiring a user to log in. For example, the Microsoft Internet Services (IIS)
    Web servers run as a Windows service so that it can serve incoming requests and
    not directly provide an


    itates when a user activates it from the Service Manager, or when the system reboots.
    Your class overrides the OnStart method to add method to initialize and start
    the service. Your class overrides the OnStop method to provide the ability to
    stop, either at a user''s request or at shutdown. Provide code to stop functions
    of the service in this manner.


    You cannot place the main functionality of the service in the main thread, which
    needs to remain available for stop requests. Use a Timer component or create a
    Thread that lets your process function. information on creating threads, see Chapter
    8.


    A service does not provide a visual interface. Most services write information
    and errors to the system''s event log. For more information on adding to the event
    log, see the section "Event Log."


    To create a Windows service, you use the Windows Service template to create a
    new project. Your project consists of a single class that inherits from System.ServiceProcess.ServiceBase
    class. A service


