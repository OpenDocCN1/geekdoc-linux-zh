  md: '# WATCH FOR FILE SYSTEM CHANGES


    The Windows Explorer immediately updates when a file saves onto disk. The Windows
    subsystem allows programs to request notification when certain directories update.
    You can receive events from the FileSystemWatcher class when file changes occur
    on a particular drive.


    You can create an instance of the FileSystemWatcher class or you can add the FileSystemWatcher
    to a Windows Form from the Component category of the Toolbox. This approach uses
    the Forms because of the simplicity it adds to the visual interface.


    The Path property specifies which drive or directory the component monitors for
    changes. EnableSubdirectories to include any directories under the specified Path.
    The RaisingEvents property enables or disables the component''s notification events.


    The component provides four events when file system changes occur: Changed, Created,
    Deleted, and


    Renamed. For more information on events in Windows Forms, see Chapter 2.


    The Changed events fire when an attribute of the file such as the size, last modified,
    and last viewed change. You can use the Filterproperty to set conditions for when
    the Changed events fire. For example, set Filter LastWrite to have a component
    fire only when an application writes to a file.


    The Created events fire when a new file or directory appears in the system. Deleted
    events fire when a file is removed from the file system, and Renamed events fire
    when a file or directory changes.


    Each of the events passes a FileSystemEventArgs to your handler. The object includes
    a Name property that specifies the name of the file or directory of change relative
    to the specified Path. The NewName returns the entry path. The Renamed event,
    the property OldName specifies the previous name of the file.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_129_0.png)


    +   1 Create a new Application project or open an existing one.


    +   - This example shows a ListBox control onto the form to display the data.


    +   2 In the Toolbox, click the Components category.


    +   3 Double-click the FileSystemWatcher component.


    +   - The component loads into the component tray.


    +   4 In the Properties window, set the type to in the Path property.


    +   5 Set any necessary properties.


    +   6 Double-click the FileSystemWatcher in the component tray.'
