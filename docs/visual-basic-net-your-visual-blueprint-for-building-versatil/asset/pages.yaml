    you can perform many actions on a ball, as throw, toss, or roll. Of course, a
    computer-simulated ball also needs methods to make it, draw on screen, and bounce
    in an onscreen boundary. |


    # EVENTS


    | An object uses events to send information back to the user of the object. An
    object normally represents a response to the owner of the class calls. An event
    can send back data through arguments. The owner of the class responds to the event
    by creating a method called an event handler, which the owner of the object must
    set up. | For example, when you throw, toss, or roll a ball, may event can occur
    in response to your actions. The ball can hit a wall, or pop. In a computer environment,
    a ball hits a defined boundary, and lets the object respond to this occurrence.
    You often use an event to send status information back to the owner of the object,
    for example, the current position of the ball, or a change in course that the
    class handled itself. |'
