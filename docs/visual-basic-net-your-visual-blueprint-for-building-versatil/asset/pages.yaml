  md: '# CREATE A PRINT PREVIEW


    Many modern applications enable the user to view her print job before choosing
    it. You can add this powerful feature to your application using the PrintPreviewDialog.
    This control takes all the pages printed by a PrintDocument control maps them
    onto a virtual onscreen. The PrintPreviewDialog control allows an easy to use
    with a toolbar of display options and a panel to show the pages in print job.


    The PrintPreviewDialog control makes one property available: UseAntiAlias. Set
    the property to True to control the draw on screen using anti-aliasing to smooth
    the appearance of lines, shapes, and text. Keep in mind that anti-aliasing is
    an intensive process that may slow down some systems on older machines. If your
    application needs you leave this property as default.


    To use the control, you double-click the document to a valid PrintDocument control.
    When the print preview triggers the dialog box calls the PrintDocument control
    to output the pages, which in turn your page output to the printer handler. The
    pages store in memory for the Print Preview dialog box to display. See the PrintDocument
    class for more information on the PrintDocument control.


    To make the Print Preview dialog appear, call the Show or ShowDialog method. See
    Chapter 2 to learn about the differences between Show and ShowDialog methods.


    When the dialog appears, it shows a toolbar with Print button, Zoom button, and
    Column/Row selections. The control provides all the interaction with the user
    for the interface. When the user clicks the button, the dialog calls the Print
    method of the PrintDocument control assigned to.


    # CREATE A PRINT PREVIEW


    ![](img/6e977c6eee8c1535039c864d41da5ccf_143_0.png)


    ![](img/6e977c6eee8c1535039c864d41da5ccf_143_1.png)


    +   1. Open a folder in a Windows Application project.

    2. Add and configure a PrintDocument control on the form.

    3. In the Toolbox, double-click the PrintPreviewDialog control to add it to the
    form.


    Note: See the Using PrintDocument control to add a PrintDocument to the form.


    The control appears in the Component Tray.


    To use the PrintPreview Dialog control to anti-aliasing the pages, use the UseAntiAlias
    property to toggle.


