  md: '# VISUAL BASIC .NET


    # MONITOR PROGRAM EXECUTION


    You may find yourself unable to correct code, because it looks right but does
    not work as you expect. You can use the tools from Visual Studio to monitor the
    execution of your program. You can easily debug a runtime error when an exception
    occurs during execution. Visual Basic .Net breaks and lets you at the line in
    question. For more information about runtime exceptions, see the Help Application.


    But when error occurs, your program does not work like you expect, you can use
    the debugger. The debugger provides a feature breakpoints. When the execution
    of the program reaches a breakpoint, you can examine variables and objects that
    the line contains. The tool window lets you find, add, or delete the breakpoints
    in project.


    When you run your program, and the execution reaches a line that contains a breakpoint,
    the Development Environment activates and highlights the line on which the execution
    stops. The Autos Watch window in the Development Environment provides a list of
    variables and objects that you use. The current value of the various variables
    appears in the window. The Locals window shows a list of all locals to the method
    or property that contains the breakpoint.


    You can examine the flow of an application by setting a breakpoint and stepping
    through the code as it runs, one line at a time. Use the Step Into command to
    execute the current line contains methods or properties in your project, You can
    use Step Over to skip the execution of a function, and step to the next line in
    the module.


