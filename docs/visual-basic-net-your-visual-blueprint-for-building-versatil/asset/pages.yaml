    control in the Toolbox.


    +   2. In the Properties window, type a name for the document in the DocumentName
    property.


    +   3. Double-click the control you want to press to begin printing.


    +   3 The default event of the control appears in the Code Editor.


    +   4 Type PrintDocument.Print(), replacing PrintDocument, with the name of the
    control.


    +   5. In the module level, declare storage variables.


    +   6. Click the PrintDocument control from the component list.


    +   7 Click the PrintPage event from the list.


