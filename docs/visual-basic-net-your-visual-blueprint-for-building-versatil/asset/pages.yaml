    +   2. Add appropriate controls to the form.


    Note: See the sections "Create a Database Connection" and "Add a Connection to
    Form" to set up a database. For more information about adding controls to a form,
    see Chapter 3.


    # BIND A SIMPLE CONTROL


    +   3. In the Properties window, click the + to the left of (DataBindings).


    +   4. In the DataBindings section, select the property to which you want to bind
    data.


    +   5. Click and then select the appropriate field.


