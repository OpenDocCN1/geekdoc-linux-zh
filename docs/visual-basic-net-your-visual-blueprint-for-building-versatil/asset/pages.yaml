  md: '# VISUAL BASIC .NET


    # LIST ITEMS


    list allows you to display lists of information in a smaller space on. You can
    add list controls to your form to allow the user to make a selection from this
    or just provide information to the user. You should use list controls whenever
    you have a large or varying set of data that the user needs to choose from; you
    can use list controls to display a list of files in a directory, or display a
    list of items from your company.


    VB.NET uses three controls: ListBox, CheckedList, and ComboBox. A ListBox allows
    the users to select or multiple items from the list. A CheckedList places a box
    beside each item in the list, allowing users to check multiple items. A ComboBox
    allows to drop down and provides the user to enter a new item or select an existing
    item via the keyboard.


    VB.NET stores list items in the Items collection. Design-time editing allows you
    to redefine items, or you can use the ListControl.Items.


    AddItem("item text") to add an item during runtime, Set the Sorted property to
    True if you want the controls to sort your items alphabetically.


    For ListBox and CheckedListBox controls, you can allow horizontal scrolls by setting
    HorizontalScroll to True. For the ComboBox control, specify the width of the drop-down
    by setting DropDownWidth You can use these properties to show data with any width.
    SelectionMode has three settings: Simple allows the user to select a single item.
    MultiSimple allows users to toggle items by clicking an item. MultiExtended allows
    to select items and unselect any others, and you may use Ctrl to click another
    items or Shift to select a range of items.


    The ComboBox also has three modes, specified in the DropDownStyle property. Simple
    creates a list with a textbox at the top, allowing users to make new entries.
    DropDown allows you to type a value or select an item in the box. DropDownList
    displays a list and only allows the user selects.


