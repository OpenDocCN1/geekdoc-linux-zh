  md: '# VISUAL BASIC .NET


    # CREATE A WINDOWS INSTALLER


    When you complete a project, you then need to package the application for distribution.
    Visual Studio provides tools to develop a setup for components, applications,
    and Web projects you create. You can use the tool to build a professional and
    customized installer.


    With projects that install using Setup Wizard, the wizard detects dependencies
    for the project to run. For example, if the project requires database support,
    the setup automatically includes a database distributable component.


    The Setup Wizard enables you to create a project that supports the installation
    of Windows Applications projects, Web projects, and component projects. When you
    need to deploy a solution that contains Windows application and component library
    you select for the installation, and builds a project.


    Also included in your project is the .NET redistributable component. After selecting
    a project, the Setup Wizard asks which parts of the application you want to install.
    The Primary output includes the EXE or DLL file your projects output. The Local
    resource selection includes any resource files you include in your project. You
    can also add source code and content files with the project through the Setup
    Wizard.


    You can also specify for the installation to build a CAB file, which you can provide
    for download on the Internet. For Windows machines, the setup project builds a
    single file with .msi extension that installs using the Windows Installer included
    with recent versions of Windows and Internet Explorer.


