  md: '# UNDERSTANDING THE FRAMEWORK


    the .NET Framework provides an enormous class library that contains much of the
    functionality available to VB .NET. You can use this guide as a starting point


    for the underlying structure of a .NET application.


    # THE .NET FRAMEWORK


    # Versioning


    # Features


    The .NET Framework is an environment that represents much of the functionality
    contained in Visual Studio. The base of the framework consists of the Common Language
    Runtime, CLR, the engine that drives the system. The CLR provides a standard system
    of data types and objects, and makes cross-language and cross-platform development
    possible.


    The CLR offers significant improvements for application deployment and component
    versions. Unlike previous models, like COM, the CLR can find and reference components
    without the use of ProgIDs, CLSIDs, and type libraries. The CLR supports side-by-side
    deployment, and therefore can load multiple versions of the assembly. This lets
    a program with one version of a DLL another user uses the DLL simultaneously,
    removing problems of non-backwards compatible DLLs.


    The middle layer of the Framework includes next generation services such as ADO.NET,
    ASP.NET, and Windows Forms. These provide powerful tools to manage user interfaces,
    making availability consistent across languages.


    When you compile an application that references a DLL, or shared assembly, the
    compiler stores the assembly''s name and version into your application.


    The top layer includes user programming and interfaces. Windows Forms provides
    the interface to create standard Win32 applications. Web Forms provides a powerful
    server-side visual development tool ASP.NET provides a mechanism to communicate
    directly with the Internet. It also creates an interface of simple text-based
    applications.


    # Assemblies


    A set of more modules makes a single unit called an assembly. This assembly contains
    the necessary information for you to deploy it on multiple components. The assembly
    contains a catalog of component metadata known as a manifest. This helpful critical
    information about visibility, versioning, and security. Every type must be contained
    in an assembly. In Basic .NET, a single project represents a single assembly:
    Solution holds multiple objects, and relates multiple assemblies together for


    # CLR


    The purpose of the CLR is to create an easier and faster development system with
    automatic handling of low-level details such as memory management and communication.
    Other important features of the CLR include a simpler and safer deployment environment
    and


    The CLR transparently supports any number of assemblies, not limited to Microsoft
    developers. This integration enables many languages to take advantage of the built-in
    debugging system and memory management. The integration with the CLR required
    the VB language to change significantly, but gives it the ability to work with
    other languages much more effectively.


    When you create an assembly for others to use, you must decide which types appear
    outside the assembly. You use the Public and Private keywords to expose or hide
    a class or interface from outside use. You can also use the Friend keyword to
    hide a method from out of the assembly, but make it usable throughout the assembly.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_25_0.png)'
