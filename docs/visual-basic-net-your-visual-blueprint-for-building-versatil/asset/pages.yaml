  md: '# USING WEB FORMS


    # ASP.NET FRAMEWORK


    You build Web Pages on the ASP.NET Framework. Each Web Forms page, object that
    derives from the ASP.NET Page class, acts as a container for controls. When you
    render a Web Forms page, the Page runs all the individual controls on it. It renders
    as standard HTML that a web browser can process. The page consists of a standard
    <form> combined with client-side scripting, so you can capture user actions and
    send them back to the server as ASP.NET events. These events let you that lets
    them from the server. From a large set of controls available in Visual Studio.
    In addition, you can create your own controls.


    application. Web Forms uses the HTTP protocol, which is stateless, meaning a connection
    to a server only long enough to download a page, after which the browser “gets”
    about the server until the user presses a link or button. To help, the Page Framework
    includes facilities for managing state. Each page-based “viewstate” – access to
    non-page-based facilities such as Session state (user-specific) and Application
    state (global to the application).


    The Page is the base class for all of the Web Forms in your application. For more
    information on using a Web Form, see the section “Using a Web Form.”


    Despite its attributes, you may find it difficult for Web Forms to generate something
    that works feels like


    # WEB FORMS EVENT MODEL


    The ASP.NET event system contains some important differences from the version
    with which you build standard Forms applications. ASP.NET uses the POST method
    to send information from the client Web back to the server using the results of
    the <PostBack> block, all of the controls on the


    Form must exist within the <Form> block. ASP.NET interprets the rules of the server,
    and fires the appropriate event in your Page object. Web Forms uses JavaScript
    for client-side scripting to control the interactivity and HTML controls.


    # Limited events


    To create a control, you must design your application with the smallest amount
    of interaction between the user and the control. The control must send information
    back, or post-back information, to the server when an event occurs. Windows applications
    use MouseMove and KeyPress to handle mouse and keyboard events in a box that cannot
    be continually returned to the server. Most Web Forms events, therefore, of simple
    click alert when a user clicks a particular button or selects an item in a box.
    Most controls add events that cause less performance problems, such as the Changed
    event on the TextBox control, which only fires when the user leaves the TextBox.


    # Post-back/non-post-back events


    The post-back means that the browser requests a new version of the page from the
    server: the client interacts with controls to submit the ban to the server. Except
    for control controls, Web Forms do not automatically post-back to the server for
    all events. Events called non-post-back events in ASP.NET do not fire in mind
    which events immediately update the display and which events we can handle until
    the user presses a button. For example, the SelectIndexChanged event of the ListBox
    and DropDownList do not fire when an item is selected, but along with a method
    that uses post-back, like a Button’s Click event. This reduces the number of times
    the page must refresh and prevents interruptions to the user’s workflow. You can
    use properties to enable-post-back in the ListBox, ComboBox, and option controls
    that do not post-back to the server by default.


    # 10'
