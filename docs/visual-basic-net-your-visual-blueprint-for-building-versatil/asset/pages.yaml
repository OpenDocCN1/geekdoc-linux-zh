  md: '# VISUAL BASIC .NET


    # ACCEPT INCOMING CONNECTIONS


    any packages and even hardware devices provide network connections and a Web server
    you connect to configure the package. Then a user can modify a setting in an application
    where their location. You can create a server by accepting TCP/IP connections
    with the TcpListener class. Part of the System.Net namespace, this class relies
    on the Socket class. See the section "Make a Connection to a Server" to see how
    you use Socket to make outgoing connections.


    Calling this method blocks your program until a connection occurs, so you can
    place code to respond to the connection directly after it. The AcceptSocket method
    returns a Socket you need to maintain a reference for reading and writing to the
    stream.


    Once you have the socket, you can freely write information to it as the client
    connects. To write to a socket, use the Send method. The first parameter of the
    Send method is the Byte array to send. You can optionally follow this with the
    length of the data and a SocketFlags. In many cases, you can pass a zero-length
    buffer and learn more about Basic .Net Help for SocketFlags.


    Create a TcpListener by declaring a new instance of the class. Pass the parameter
    you want to listen on the single server parameter to the constructor of the class.
    For more information on creating instances and using constructors, see Chapter
    7.


    To attach to the port, call the Start method. This activates the port and awaits
    connections. To respond to a connection, call the AcceptSocket


    After writing to the socket, make sure to close it using the Socket.Close() method.
    Then you can wait for another connection by invoking the AcceptSocket method again.
    Dispose the TcpListener by calling the Stop method.


    # ACCEPT INCOMING CONNECTIONS


    ![](img/6e977c6eee8c1535039c864d41da5ccf_149_0.png)


    +   1 Create a new project or opening an existing one.

    2 In the appropriate method, type dim server As New Net.Sockets.TcpListener(90),
    replacing the server with your name and 90 with the port.


    +   3 On a new line, type server.Start();, replacing the server with the name
    of the TcpListener variable.


    +   4 Type dim socket As Net.Sockets.Socket = server.AcceptSocket();, replacing
    socket with the variable name to create a socket and with the name of the TcpListener
    variable.


    +   5 Type code to load a Byte array with information to send the client.


    +   6 Type socket.Send(data);, replacing socket with the variable name of the
    socket.


