  md: '# GETTING STARTED WITH VISUAL BASIC


    # Extra


    To provide the compatibility functions, .NET Framework includes the Microsoft.VisualBasic.Compatibility
    namespace when using the Upgrade Wizard. This namespace includes functions that
    exist in the Basic 6 language. .NET Framework duplicates many of the functions
    into Visual Basic 6, making many functions in the language unnecessary. To make
    the upgrade process simple as possible, these functions provide the same interfaces
    as VB 6 while remaining compliant with .NET managed code. For example, VB .NET
    does not include the ability to create control arrays. For VB 6 projects to upgrade
    successfully, the compatibility library includes control arrays for each of the
    basic controls in the language. VB .NET removes controls like the FileListBox
    and TextBox completely. The compatibility library provides these controls for
    upgraded projects. A number of removed functions like SendKeys also exist within
    this namespace.


    You can use Visual Basic 6 to continue maintaining existing applications instead
    of upgrading. Both Basic 6 and Visual Basic .NET can coexist on a single system.
    If you have very large project that works in VB 6, you may want to leave your
    upgrade process due to the number of fundamental changes in the language.


