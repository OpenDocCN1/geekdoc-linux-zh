  md: '# VISUAL BASIC .NET


    # RESIZE CONTROLS


    You can give the application window and dialog boxes the ability to change sizes
    based on a user''s preference. In previous versions of Visual Basic, this was
    a complex chore. Now, however, VB .NET provides properties to resize without requiring
    any code.


    Each control contains two properties for resizing: Anchor and Dock. Each lets
    you select sides of the control you want to anchor to control borders. The Left
    and Top anchors the control at exactly the same location from the left or top
    of the form. The Right and Bottom anchors hold that side of the control to the
    same position relative to the right or bottom of the form.


    The Dock property locks a control to the left, right, or bottom of the form. For
    example, if you dock a control to the top of the screen, the control maintains
    its assigned height, but moves to the top and spreads the width of your container.
    If you set Dock to Fill, the control fills the entire client area.


    For example, if you select the Anchor for Left, Right, the control holds itself
    to the left and side


    The container form has a property DockPadding that lets you select the amount
    of space around a docked control in each direction. By default, a control is added
    with Anchor to Top, Left.


    # RESIZE CONTROLS


    ![](img/6e977c6eee8c1535039c864d41da5ccf_49_0.png)


    # DOCK THE CONTROL


    +   1. Create a new Visual Application project or over an existing one.

    2. Open the form that you want to resize.

    3. Add a control anywhere on the form.

    4. Use the examples buttons to test controls.

    5. Change the control''s Dock property.


    In example, the Dock property is set to Top. The control positions itself at the
    selected border.


    # ANCHOR THE CONTROL


    In the example, another button was added with the Bottom, Left, Right.


    Note: see the section ''Add Control to a Form'' to add a control and ''Set a Property''
    to edit a property.


    34'
