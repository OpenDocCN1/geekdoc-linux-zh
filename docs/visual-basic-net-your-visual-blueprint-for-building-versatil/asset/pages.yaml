  md: '# GETTING STARTED WITH WINDOWS FORMS


    # Extra


    Not truly a property, one item listed out convenience in the Visual Basic Property
    Editor is *Name*, which allows you to set the name of the component for the purpose
    of accessing the component without being forced to use names like *Button1* or
    *Form*. You cannot access *Name* from code.


    A common notation when using names and variables is Hungarian notation. This involves
    placing a three-character identifier front of the descriptive name. For example,
    you might call a button *btnCancel*. This enables you to easily read your code
    and see the type of component to which any names refer.


    You can select to display the properties in categories or alphabetically. The
