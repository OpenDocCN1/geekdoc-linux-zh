  md: '# DEVELOPING COMPONENTS 12


    # Extra


    The .NET component model does not require components to register with the system
    before you use them in other assemblies. The COM interface, however, does require
    components to register before use. You can register your .NET components with
    COM to provide backwards compatibility for other development environments that
    rely on COM, such as Microsoft Office and ASP applications. To register your library
    DLL, use the `regasm` utility which uses the system''s .NET Framework files installed,
    typically C:\WINNT\.NET\Framework\v where v is the version of the software you
    are using. Pass the path and file name of the .NET DLL to register. If you want
    to register the file on the current machine, use `-regfile/` followed by the filename
    of a registry file to generate. You can then import this file on any computer
    that contains the DLL.


    Example:


    Register a Component


    ```

    Regasm.exe MyLibrary.DLL

    ```


    Generate a Registry Import File


    ```

    Regasm.exe /regfile:MyLibrary.REG

    ```


    ![](img/6e977c6eee8c1535039c864d41da5ccf_308_0.png)


