    You can build Windows controls either by creating them directly inside projects
    or using a Windows Control Library project.


    If you add the control to a project, you can use it only within the project. The
    Windows Control Library uses a DLL that you can reuse across multiple Application
    projects by referencing the library.


    # Base Component


    VB .NET creates a UserControl that inherits from System.Windows.Forms.UserControl.
    The UserControl object provides a design surface to build a complex control easily,
    and inherits from the ContainerControl class to add to all of the standard properties
    and functions you expect in a Windows Forms.


