  md: '# CREATE A CLASS


    When using Visual Basic .NET, you work with dozens of classes to perform the simplest
    operation. VB .NET uses classes to split its massive number of functions into
    blocks for you. You can create your own classes to ensure a set of functionality
    and ease of programming. When you create a class, it allows you to forget the
    implementation details of the class and focus on using the abilities of the class
    you created. Designing for class is like placing all of your code in modules and
    forms, which makes your code easier to read, debug, extend, and reuse.


    VB .NET declares classes using the Class... End Class structure. Before the instancing
    of the class using Public, Private, or the other available options. The name of
    the class goes after the Class keyword.


    variable-naming techniques. The body code of the class resides between the Class
    and End class statements. Code inside the block specifies methods, properties,
    and events of the class.


    Two options enable you to specify for inheritance. Class MustInherit in front
    of the Class keyword to not allow VB .NET to make instances of the class and only
    other classes of this class base. The NotInheritable keyword is the opposite and
    does not allow you to specify this as a base class. For more information on inheritance,
    see Chapter 8.


    By default, VB .NET declares each class in a separate file. You can place multiple
    classes inside each file if you want, which is essentially useful for a set of
    classes that work together.


    # CREATE A CLASS


    ![](img/6e977c6eee8c1535039c864d41da5ccf_175_0.png)


    +   1 Create a new .application or opening an existing one.


    +   2 Click Project -> Add Class.


    +   3 Type a filename for the new class.


    +   4 Click Open.'
