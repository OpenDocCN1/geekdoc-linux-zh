  md: '# WRITE THREAD-SAFE CODE


    Although threading is one of the most difficult and frustrating tasks in modern
    programming, Visual Basic .NET makes threading simple and easy when you understand.
    The problem with free-threading is that every thread of your application runs
    in the same memory space, making the threads access the same objects. You must
    make sure that threads do not access each other by interacting with the same object.
    You can use commands in VB.NET to create thread-safe code.


    inside parentheses, on which to lock . The EndSync statement marks the end of
    the block you want to lock. For example, you may have a list of results that you
    want to load into a ListBox. However, you do not want more than one thread to
    access the ListBox at once because the ListBox control is not thread-safe. You
    provide the SyncLock object and pass the information to inside the lock. If another
    thread tries to access the same lines of code, VB .NET waits until the next thread
    releases.


    In general, the .NET framework is not thread-safe, meaning if two threads attempt
    to access the same object at the same time may not work properly. The Windows
    Forms classes cause many problems when not carefully managed.


    In some cases, you can start a thread after another completes to avoid recognizing
    objects in the use by the two threads. Call the Join() method and pass another
    thread parameter to wait until the thread completes. Place this inside the code
    of another thread to make it wait for another to complete.


    To make sure no more than one thread access an object, you use the SyncLock object.
    When you use the SyncLock, you provide VB.NET with an object,


