  md: '# WORK WITH CLASSES


    # Extra


    To avoid defining all of the possible variables the class needs as member variables,
    a common mistake of new programmers, you should always remember the scope for
    which you need a piece of data. If you have a method that does a calculation and
    returns the result, do not store the result in member variables. Instead, create
    variables in the method to use as temporary variables. VB .NET can release these
    variables after use. Every member-level variable you create must remain in memory
    for the entire time. If you create an unnecessary amount of member variables,
    you can create a very inefficient application.


    Although creating a public member variable generates a quick and easy property
    for the class, the design ideas of a class inherently foster reuse and reliability
    of internal workings of the class. A public member variable can create a number
    of problems that are hard to debug. You can ensure the class performs reliably
    if you define the criteria of a property value by using a Property block.


