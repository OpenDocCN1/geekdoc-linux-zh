  md: '# ADD A CONTROL TO A FORM


    You can add a control to the form, it becomes selected automatically, and if you
    open the Property Window, the properties are shown for the selected control. For
    information about modifying properties, see the section "Set Property."


    Standard controls you can use in applications includes buttons, menus, toolbars,
    check radio boxes, and text boxes. You may not find that the text on the form
    is a Label control, or the frame around a group of buttons is a GroupBox. Many
    controls only provide layout and visual cues. See Chapter 3 for more information
    on controls.


    The controls that VB.NET provides are not the only controls you may use. The CD-ROM
    included with this book contains a variety of versions of controls you can add
    seamlessly. For information on loading new components into your project see Appendix
    G.


    If a control is hidden and does not form real estate, use the Timer, or ErrorProvider
    control, to load it into an area inside the designer using the Component Tray.
    Any of your controls appear here. You can still click them to edit their properties.


