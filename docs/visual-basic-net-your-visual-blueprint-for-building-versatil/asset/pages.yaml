  md: '# CREATE A WEB SERVICE


    A Web service is an ASP.NET file that provides an object with a set of methods
    that your application can access over an Internet connection. You can create a
    Web service and a corresponding set of objects that you can access from any XML-enabled
    application over the Web.


    To create a Web service, you select the ASP.NET Web Service template from the
    Project dialog box. Upon selection, .NET creates one class and its name is the
    same as the project name. .NET methods of this class are exposed to Web clients.


    Each ASMX service class represents a separate Web service. You can create other
    classes in the project, but unless you want to make them available over the Internet,
    the System.Web.Services.WebService base class exists in a single code module file.
    ASPNET inherits all properties you add to the code module


