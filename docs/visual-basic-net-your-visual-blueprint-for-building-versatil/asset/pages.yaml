    # USING NAMESPACES


    Namespaces provide a naming scheme for classes, components, and applications that
    help organize the number of classes that make up an application. You use namespaces
    without being aware of them all call in .NET within namespaces. The largest namespace
    in the .NET Framework is System, which contains a number of namespaces, like Drawing
    which provides classes for drawing, and IO, which provides classes for file input
    and output.


    To save yourself time, you can use the Imports keyword to access components inside
    a particular namespace without specifying the namespace each time you use a class
    the namespace counts. You place the Imports statement at the top of a code module,
    above all modules and classes. The namespace to import follows the keyword. You
    can separate namespaces on a single line using commas and add as many Imports
    as necessary. Then, if any of your modules or classes contain the code module,
    you can access the namespaces without specifying it. For example, if you import
    the System.Drawing namespace, you can create Var As Pen.


    The normal method of accessing a class, direct addressing, involves typing the
    full namespace when you use a class name. For example, to create a Pen, you define
    a variable using the name System.Drawing.Pen. Although distinctive and easy to
    read, this requires you to type a lot of characters when working with code.


    Importing a number of namespaces into a code module can create conflicts of class
    names. If two classes have the same name in different imported namespaces, you
    need to distinguish the two classes.


