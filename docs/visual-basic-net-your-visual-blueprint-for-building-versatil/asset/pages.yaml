  md: '# OVERLOAD A METHOD


    Often a class you create needs offer methods that accept various types of data.
    Most methods in the .NET Framework offer a number of methods with the same name,
    you choose the method that provides the proper arguments for your usage. You can
    overload a method to provide different sets of arguments to a method of the same
    name. For example, a method can accept either an integer or a floating-point value.
    You can provide an overload method that adds two variables and returns an Integer,
    and another overload method that accepts two variables and returns a Single.


    uses the name. You cannot create two versions of the method with the same parameter
    list. Creating two methods with the same parameters fails because VB .NET does
    not know which method to call. To make overloaded methods, you can provide different
    number of arguments for each method, or provide the same number of arguments as
    one of the others but different types.


    If you declare the method as a Function, you can also change the return type of
    the overloaded method. The same rules apply, you must still specify the return
    type when the types differ. You can create an overloaded method with no parameters,
    and another overloaded method as a Function, enabling you to return information
    only when necessary for the method.


    To create methods with the same name, you use the Overloads keyword. You place
    this keyword following any accessibility keyword but before the Sub or Function
    keyword of the method. You must declare this keyword for every instance of the
    method


