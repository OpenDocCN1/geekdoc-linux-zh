  md: "# VISUAL BASIC .NET\n\n# MAKE A CONNECTION TO A SERVER\n\nThough most transactions\
    \ of data in your application may transfer over HTTP protocols, in some cases\
    \ you need to connect to servers that do not run HTTP protocols. In this case,\
    \ you cannot use the WebClient explained in the section \"Download from a Web\
    \ Server\". You can, however use the TcpClient to create a connection to any sort\
    \ of servers because of the flexibility of the TcpClient class. You may find the\
    \ code to create a client/server pair of applications, see the section \"Accepting\
    \ Connections,\" for more information.\n\nargument to the constructor, and follow\
    \ it with the port number. Leave the constructor empty to connect at a later time.\
    \ The Connect method accepts any two arguments. Use the Close method to close\
    \ the connection.\n\nTo send and receive data, the TcpClient provides a GetStream\
    \ method. The method returns a NetworkStream object. You can use this to read\
    \ and write to the network socket. To use the stream method, declare a variable\
    \ of type Stream in the System.IO namespace. You can then use this variable to\
    \ create readers and writers to send and receive information over the network.\
    \ For more information on reading or writing from a stream, see the sections \"\
    Read from a Stream\" or \"Write to a Stream\"\n\nTo create a connection, declare\
    \ a new instance of the TcpClient class. For more information on declaring instances\
    \ of class and using constructors, see Chapter 7. If you want the object to open\
    \ the connection immediately, pass the server to connect to you as the first argument.\n\
    \n![](img/6e977c6eee8c1535039c864d41da5ccf_147_0.png)\n\n```\n//-MakeConnectionToServer\
    \ - Visual Basic, .NET [Design] - Module.vb\nImports System\nImports System.Net.Sockets\n\
    \nModule MakeConnectionToServer\n    Sub Main()\n        Dim client As New TcpClient(\"\
    localhost\", 8000)\n        Dim stream As Stream = client.GetStream()\n      \
    \  ' ...\n    End Sub\nEnd Module\n```\n\n+   - Create a new project or open an\
    \ existing one.\n\n+   - In the event or where the connection occurs, use Dim\
    \ client As New.Sockets.TcpClient(), replacing client with the variable name.\n\
    \n+   - Inside the parentheses, type \"localhost\", 90, replacing \"localhost\"\
    \ with the server and 90 with the port number.\n\n+   - Dim myStream As Stream\
