  md: '# DEFINE AN INTERFACE


    Each class in an object-oriented programming language contains two parts: the
    interface and the implementation. The interface defines the methods, events, and
    properties available to users of the class. The implementation makes you able
    to hide the rest of the class including the methods, properties, and variables.
    In most cases these enable you to create a separate interface you can then define
    later. This gives you the ability to create multiple classes using the same set
    of methods and properties with different implementations.


    Use the Interface..End Interface block to define an interface. The block appears
    outside of any class or module. VB defines an interface as Public unless otherwise
    specified. For an explanation of accessibility keywords, see “Create a Class.”


    Inside the block, define a property with the Property statement. After the Property
    keyword, VB exports the name for the property, parameters enclosed in parentheses,
    and the variable As.


    For example, you can define TwoNumbers for working with two numbers. A class TwoNumbers
    can implement the interface to add the numbers, and implement the interface to
    multiply the numbers. This enables the user of the class to work with a variable
    defined as TwoNumbers with both of the classes interchangeably.


    Define public methods using Function or Sub keys and the name of the method. You
    can specify the parameters that the class must use to implement the method and
    return the type as a Function method. To define events, use the Event statement
    and follow it with the event name and parameters.


