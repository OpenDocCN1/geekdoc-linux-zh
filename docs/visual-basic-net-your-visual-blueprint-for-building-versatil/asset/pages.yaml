  md: '# ABOUT THE AUTHOR


    Richard Bowman owns and operates BowmanSoft, Inc., which specializes in software
    consulting and Internet development technologies.


    Richard is also the editor and owner of the Visual Basic Web Magazine, a Web resource
    site focusing on Visual Basic and ASP programming. You can visit VBWM at http://www.vbwm.com/.
    You can reach the author at richard@bowmansoft.com.


    # AUTHOR’S ACKNOWLEDGMENTS


    The last few months have been a long and arduous journey. I never knew stressful
    a project could be until I on the process of writing this book. I would like to
    thank all of the people who helped me keep my sanity and told me I could do it.
    My family — Debbie, Richard, and Megan — provided me with love and assistance
    from proposal to production. Special thanks to my friends and colleagues Aaron,
    Chris, Katie, and Stephanie, who provided enormous encouragement and support throughout
    the process.


    Thanks goes to the authors and developers of the VBWM.COM site for their understanding
    and patience when I missed deadlines. Special thanks to my editors — Maureen,
    Jen, Tim, Mica, Todd, and Garrett — who kept me on track and always held out a
    helping hand when I was stuck.'
