  md: '# WORK WITH CONTROLS


    # USING LABEL CONTROLS


    Labels provide information on the form to guide the user. Using a label control
    to provide an explanation of the user needs to supply on the form or to explain
    information available on the form. A form presents the user with various controls
    that contain data or lists of information, or blank controls for user input, which
    makes the labels necessary to describe the nature of the controls.


    The LinkLabel control expands on the capability of the Label control by providing
    an appearance of a hyperlink. By setting the LinkedVisited property to True, you
    can cause the link to appear in the visited color. Just like a web page, you can
    set this property and cause the link to appear after the user clicks the link.


    Try to make labels short, but descriptive. Most labels have a color after the
    text to sign the label describes the control to the right or below it. From placing
    labels to the right you align the control they describe.


    Use the Text property to modify the text that displays, and TextAlign allows you
    to align the text to the middle, side, or corner of the label. When set to True,
    automatically stretches the label''s width to fit the text you place on. This
    prevents the text from wrapping at the edge.


    For the LinkLabel control, the LinkAreas property specifies a range of text you
    want to use as the hyperlink. By default, the entry text of the control is positioned
    to start the hyperlink, and the Length, the number of characters you want as part
    of the link. When you set the property, remember the first text position is zero.
    The control fires Linked event if the user clicks the area that is part of the
    link.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_66_0.png)


    +   1 Create a new Windows Application project or open existing one.

    2 Click the Label or LinkLabel control in the Toolbox and add the control to the
    form.

    3 In the Properties window, set the Text property of the control.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_66_1.png)


    +   4 Press F5 to run your project.

    5 The Label control provides textual information on the form.

    6 For the LinkLabel control, you can handle the user clicking in the LinkClicked
    event.


    Note: See Chapter 2 to add an event handler.'
