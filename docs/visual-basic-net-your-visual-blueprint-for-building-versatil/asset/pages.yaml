  md: '# VISUAL BASIC .NET


    # AN INTRODUCTION TO WEB FORMS


    Web Forms, a new technology in the .NET Framework, provides a visual design tool
    for Visual Basic .NET applications. You build a Visual Studio Web application
    around ASP.NET, a platform that includes design-time controls, as well as a runtime
    for developing and running applications on a Web server.


    A part of the .NET Framework, ASP.NET is integrated with the rest of the Framework
    and can access all of its features. For example, you can create ASP.NET Web applications
    using any .NET programming language, and debug them with .NET facilities. You
    access ADO.NET, just like in a standard Windows application. Similarly, you can
    access operating system and other services using .NET Framework classes.


    # HOSTING REQUIREMENTS


    ASP.NET Web applications run on a server configured with Microsoft Information
    Services (IIS). You do not, however, need to work directly within IIS. Visual
    Studio handles file management tasks such as creating IIS applications and provides
    ways for you to deploy your Web applications to IIS.


    Before attempting to host your application on a server, make sure the server supports
    ASP.NET development. To find more information about Microsoft-ended ASP.NET hosting
    solutions, visit www.microsoft.com/asp/ and click the Hosted Applications Directory.


    # HTML AND CLIENT-SIDE CONTROLS


    Because ASP.NET is a universal server-side architecture, it works only with HyperText
    Markup Language (HTML), for transferring pages over the web using the HyperText
    Transfer Protocol (HTTP). Its output files contain tags of a command text inside
    angle brackets (<>). You embed these tags in the text to create interfaces with
    fonts, colors, tables, and other layouts. For example, to make a text appear bold,
    you place <b> at the beginning and </b> at the end of the text you want to make
    bold.


    To provide interactivity, ASP.NET relies on standard HTML controls. Client-side
    HTML controls enable you to send data to the server. You use these controls constantly
    to interact with Web sites and services. The table below lists available HTML
    controls and Windows Forms for comparison. Because HTML has few input controls,
    you might find it to create complex environments using HTML


    | HTML TAG | SIMILAR WINDOWS FORMS CONTROL |

    | --- | --- |

    | <input type="button"> | Button control. |

    | <input type="checkbox"> | Checkbox control. |

    | <input type="radio"> | RadioButton. |

    | <input type="text"> | TextBox (single-line only)|

    | <textarea> | TextBox (multi-line). |

    | <input type="password"> | A TextBox with the PasswordChar property. |

    | <input type="image"> | PictureBox. |

    | <input type="file"> | No equivalent; allows the user to upload a file to the
    server. |


    230'
