    # Extra


    Because creating a large number of threads, VB .NET includes the ThreadPool class.
    This class stores a queue of waiting methods to select on a thread independent
    of the application. The ThreadPool automatically manages the number of threads
    depending on the system speed and OS resources in use. For example, if you queue
    ten methods to run in separate threads, the ThreadPool determines that three threads
    can run optimally on the system, and starts the first three in the queue with
    unique threads. As methods finish, new methods from the queue begin.


    Example:


    ```

    Sub ThreadMe(ByVal state As Object)

    SyncLock(ListBox1)

    ListBox1.Items.Add("Thread running")

    End Sub


    End Sub

    Private Sub Form1_Load(sender As Object, e As EventArgs)

    Dim x As Integer

    For x = 1 To 10

    Dim y As New System.Threading.ThreadPoolWaitCallback(AddressOf ThreadMe, x)

    System.Threading.ThreadPool.QueueUserWorkItem(y)

    Next

