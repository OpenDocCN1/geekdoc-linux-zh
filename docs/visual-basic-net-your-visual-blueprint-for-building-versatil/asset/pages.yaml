  md: '# WORK WITH CLASSES


    # Extra


    Structures have a few very specific rules that set them apart from classes. You
    can use these rules to decide whether a class or a structure is appropriate for
    your data. The default accessibility of data members in structures if you declare
    them with Dim statement. The default accessibility in classes and modules is private.
    The declarations of data members of a structure cannot set the values of a variable
    during declaration. Data type definitions also cannot include the new keyword,
    or initial sizes for arrays. Meanwhile, use structures to return a large quantity
    of data, so the class sets the values before passing it.


    Inheritance is a way for classes to build off one another. If you want to inherit
    the data type that you create with structure, use a class instead. Structures
    cannot inherit from any other type, and other structures or classes cannot inherit
    from them. All structures are NotInheritable. For more information on inheritance,
    see Chapter 8. Structures can implement an interface. The section "Implement an
