  md: "# VISUAL BASIC .NET\n\n# USING THE REGISTRY\n\nThe Registry provides a universally\
    \ accessible data storage area for a computer. You can write information to the\
    \ Registry to remember user preferences and settings. Specific to Win32 machines,\
    \ the Registry class depending on if it and supplementary classes exist under\
    \ the Microsoft.Win32 namespace. To learn how to import the Registry, refer to\
    \ chapter 8.\n\nThe Registry class provides instances of the Registry object representing\
    \ each of the eight keys in the registry. The CurrentUser property returns a registry\
    \ key. The Registry object representing information for the current user. The\
    \ LocalMachine property returns the settings for the local machine. You can change\
    \ settings for your application in the SOFTWARE key inside the LocalMachine or\
    \ CurrentUser key provides information for various users.\n\nUse the OpenSubKey\
    \ method to open a subkey. By passing the path of the subkey to the method, you\
    \ can load\n\na deeper sublevel by separating the subkeys with back slash. Pass\
    \ True as the second parameter to enable write support. The method returns a new\
    \ RegistryKey object representing thekey. To create a subkey, pass the name to\
    \ the CreateSubkey method which returns a RegistryKey object under the existing\
    \ key.\n\nRetrieve the value associated with a particular name using the GetValue\
    \ method. Pass a string name of the value and the key and the method returns the\
    \ data values.\n\nYou can change values using the SetValue key. Pass the name\
    \ for the first parameter, and a value as the second parameter. For the value,\
    \ you can pass a string or an integer number.\n\nAfter you make changes to the\
    \ registry, invoke the Flush method of a Registry with no parameters to save the\
    \ changes.\n\n![](img/6e977c6eee8c1535039c864d41da5ccf_321_0.png)\n\n```\n// Ch1-UsingTheRegistry\
    \ - Microsoft Visual Basic.NET [Design] - Form1.vb\nusing System;\nusing System.Win32;\n\
    \npublic class Form1 : Form\n{\n    Imports System.Win32;\n    Inherits System.Windows.Forms.Form\n\
    \n    // Windows-generated code\n\n    private void Button1_Click(object sender,\
    \ EventArgs e)\n    {\n        RegistryKey key = Registry.CurrentUser.OpenSubKey(\"\
    SOFTWARE\", true);\n        if (key != null)\n        {\n            key.CreateSubkey(\"\
    MyApplication\").SetValue(\"UserName\", \"John\");\n        }\n    }\n}\n```\n\
    \n+   1. Create a new Windows Application or open an existing one.\n\n+   2. Import\
    \ the Microsoft.Win32 namespace.\n\n+   3. Type Dim as RegistryKey = Registry.CurrentUser.OpenSubKey(),\
    \ replacing RegistryKey with the variable, Current with the base key, and passing\
    \ the name of the subkey followed by True in parentheses.\n\n+   4. Declare a\
    \ new RegistryKey variable.\n\n+   5. Assign a new key to the variable you created\
    \ in step 3.\n\n+   6. CreateSubKey with the name of the subkey for the key, then\
    \ SetValue followed by the name and value in parentheses."
