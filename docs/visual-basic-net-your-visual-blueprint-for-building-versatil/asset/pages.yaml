  md: '# RECOVER FROM AN ERROR


    Error handling and recovery is an important part of making an easy-to-use and
    reliable program. You can use error-checking statements to catch errors and handle
    them appropriately.


    You can catch any error that raises an exception using a special block. When an
    exception occurs, the object raising the error creates an instance of an Exception
    class, or an inherited version of this, that contains information about the error.
    For example, a database object raises an exception when it cannot connect to a
    database or when it attempts to save data into a database that does not support
    the field.


    You use the Try block to catch errors as they occur during program run. You terminate
    the block with the End statement. You place the code that may cause an error inside
    the Try block. Then you use the Catch statement to catch errors that occur. With
    the Catch


    statement, type variable name followed by the As keyword and the exception type
    to catch. You can use multiple Catch statements to catch various kinds of specific
    exceptions.


    You can use the Exception type to catch any sort of exception that occurs. You
    can test for specific exceptions, like the DataException type, and then use another
    Catch for other errors using the generic Exception type. Using multiple exceptions
    enables you to handle the various errors that arise in specific ways.


    After the Catch block, add code to handle the error. You should always add some
    sort of code to correct the error or at least notify the user of the error.


    You can add the Finally block after any Catch statement to run code after the
    Try block runs and any Finally block corrects exceptions.


    # RECOVER FROM AN ERROR


    ![](img/6e977c6eee8c1535039c864d41da5ccf_319_0.png)


    +   1 Create a new project or opening an existing one.


    +   2 In the method that requires error handling, type Try.


    +   3 Press Enter.


    +   4 Create a type that may raise exceptions.


    +   5 On a new line inside the block, type Catch.


    +   6 Type a variable name, following it with As the exception type.


    +   To catch any exception, use the Exception type.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_319_1.png)


