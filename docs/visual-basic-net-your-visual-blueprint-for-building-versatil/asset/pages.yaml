  md: '# VISUAL BASIC .NET


    # USING VARIABLE DATA TYPES


    When you assign a variable to VB .NET, you essentially specify what particular
    kind of data variable can store. For example, you may need to store a number in
    your program. If you do text a variable capable of storing the number, you cannot
    use the same variable. You must declare a variable that stores text.


    Variable types cannot change as a program runs. If you store a number in a Short
    variable type, you cannot use the variable to store other types of data, such
    as an Integer. When you assign a data of a different type to a variable, VB .NET
    converts the data if possible and converts the value to the variable.


    Ten basic variable types allow the storage of a variety of data. Many of the types,
    such as Short, Integer, and Long, represent the same kind of data, but in different
    sizes. For example, a Short can store values from -32768 to 32767. An Integer
    extends to -2 billion to 2 billion. Long extends to +/- 9 quintillion (10^19).


    Programmers can choose the process of converting variables by type casting. Casting
    is done automatically when necessary in VB .NET, unless you define Option Strict
    in the project features. For example, casting a Single, which does store decimal
    numbers, such as 12.24, in a Short, VB .NET converts the value to 12 because Short
    allows it to work with decimals.


    Using the largest available variable can affect how your program runs. Use a size,
    therefore, that holds your data is no larger than necessary


