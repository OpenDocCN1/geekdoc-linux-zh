    # Extra


    When you override a method in the base class, you may access the underlying base
    method. This is especially useful if the base class contains needs to run in addition
    to the code you add in the overridden method. You can still access the base class''s
    method by using the MyBase keyword. This keyword carries a reference to the original
    base class, enabling you to run any method available in the base class if you
    override it.


