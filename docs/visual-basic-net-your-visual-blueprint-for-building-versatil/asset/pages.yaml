  md: '# VISUAL BASIC .NET


    # MONITORING A WINDOWS SERVICE


    You can monitor and manipulate the state of a Windows service from another application.
    For example, you can provide a configuration interface that allows you to configure
    properties of the service. When the user makes configuration changes, you can
    stop and restart the service to allow configuration changes to take effect.


    The CanPauseContinue property returns a value that determines whether the service
    can pause and resume. If this value is True, you can use the Pause method to pause
    the service and the Continue method to resume execution of the service. The CanStop
    property returns a value that determines whether the service can stop after it
    starts. If you set this to True, you can stop the service with the Start method.


    The ServiceController component, part of System.Process manages services. You
    can use this component or create an object instance of the class in code. Two
    properties specify the service to use. The Machine property sets the machine on
    which the service runs to a period (). If the service runs on the local machine,
    You set the ServiceName property to the name of the service.


    The Status property returns the current status of the service. The property returns
    a constant from the ServiceController enumeration. If you want to wait for the
    service to reach a particular state, use the WaitStatus method. Pass a constant
    from the ServiceControllerStatus enumeration as the first parameter. Optionally,
    you can use a TimeSpan if you want to wait out time.


