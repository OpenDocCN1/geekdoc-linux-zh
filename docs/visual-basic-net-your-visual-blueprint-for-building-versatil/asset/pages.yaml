  md: '# VISUAL BASIC .NET


    # REFERENCE A LIBRARY


    The Windows Control Library project builds a DLL that contains a set of UserControls,
    which can enable reuse in your applications. The Class Library project also builds
    a DLL that normally contains components and classes that you can reuse across
    projects. These projects build the same library type. The template varies in the
    type of component it initializes when you build the project.


    To use a library in another project, you should compile the DLL reference in your
    project. Referencing a library means that you can access the classes, components,
    and controls that the library exports. It is not part of your application, and
    you cannot access private parts of the library.


    To reference a component or class in an application, you use the Add Reference
    object. A reference makes


    all of the classes in the component library available, but cannot use the controls
    automatically. You must customize the Toolbox and select from the library which
    controls and components you want available in the Toolbox.


    Each assembly resides within its own name. Therefore, to add a library to another
    application, you must remember your library project''s namespace to access the
    components and controls inside the library. Unless you change the root namespace
    of the library project, the namespace is the same as the project.


    Because the reference you make saves into the assembly of your application, you
    can create a setup project that automatically installs the component library with
    your dll.


    # REFERENCE A LIBRARY


    ![](img/6e977c6eee8c1535039c864d41da5ccf_307_0.png)


    # ADD REFERENCE


    +   1 Create a new Windows Application project or add an existing one.


    +   2 Right-click the project in the Solution Explorer.


    +   3 Click Add Reference.


    The library project places the built DLL in the bin subfolder of the project directory.


    +   4 Click Browse and select the DLL file.


    +   5 Click OK.'
