    # Extra


    The Attributes property consists of a bit-wise combination of constants from the
    FileAttributes enumeration. You can use the Attributes to test for a particular
    attributes. To test a file, use the And operator combined with a set. To set for
    a file, combine multiple attributes with the operator and assign the value to
    the Attributes property. A list of the most important constants in FileAttributes
    appears here. See Visual .NET for the full list.


    # FILEATTRIBUTE CONSTANTS:


    | NAME | DESCRIPTION |

    | --- | --- |

    | Archive | Uses this attribute to mark files for backup or removal. |

    | Directory | A folder or directory. |

    | Hidden | Ordinary directory lists do not list this file. |

    | Normal | The file is normal and has no other attributes. |

    | ReadOnly | You cannot write to this file. |

    | System | The file is part of the operating system. |


