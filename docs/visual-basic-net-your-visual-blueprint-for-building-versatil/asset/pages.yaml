  md: '# VISUAL BASIC .NET


    # WRITE EVENT CODE


    You use event code to provide interaction between the software and the user. Properties
    provide the base of a form''s abilities. Events finalize this by allowing components
    to interact. For example, if the user presses a key, Visual Basic .NET fires one
    or more events that the form, control or class can capture and respond. Without
    events, your user sees a complete application with controls, properties, and methods,
    but nothing interacts with the user.


    To provide an event handler for a control, you select the actual control name
    from the Class Name list. Upon selecting a control or the form''s base class events,
    you can select from the full listing of possible events available to the form
    or in the Event List drop-down list, located on the right side of the Code Editor.


    Selecting an event from the list in the Code Editor causes the Visual Basic .NET
    IDE to create a procedure for the event to hold your event code. The two arguments
    passed to the procedure are sender and e, which are the object over which the
    event is defined. The second argument, named e, contains all of the actual event
    information. For example, in a Paint event, which occurs when the form needs to
    redraw, it contains references to the Graphics object of the form, which is necessary
    to call graphics commands.


    The Code Editor provides a list of available components on the form in the Class
    Name drop-down list located on the left side of the code window. To create an
    event handler for the form, select (Base Events). The form also lists Overrides
    you can use to override methods of the form. For more information on overriding,
    see Chapter 8.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_47_0.png)


    # WRITE CODE


    +   1 Open an existing form.

    2. Right-click the form and click Code View.

    3 You can also open the Code Editor by simply double clicking the form.

    4 Click (Base Class Events) to list events.

    5 Alternatively, you can click a control''s name to list that control''s events.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_47_1.png)'
