  md: '# HOW TO USE THIS BOOK


    Visual Basic .NET: Your visual blueprint for building versatile programs on the
    .NET Framework uses, straightforward examples to teach you how to create powerful
    and dynamic programs.


    To get the most out of this book, you should read each chapter in order, from
    beginning to end. Each chapter introduces new ideas and builds on the knowledge
    learned in previous chapters. When you become familiar with Visual Basic .NET:
    Your visual blueprint for building versatile programs on the .NET Framework, you
    can use this book as an informative document reference.


    # The Conventions in This Book


    A number of typographic and layout styles have been used throughout Visual Basic
    .NET: Your visual blueprint for building versatile programs on the .NET Framework
    to distinguish different types of information.


    # Who This Book Is For


    If you are interested in writing applications for Windows computers and the Internet
    using the Visual Basic .NET programming environment, Visual Basic .NET: Your visual
    blueprint for building versatile programs on the .NET Framework is for you.


    This book takes you through the process of installing and using the Development
    Studio, writing advanced Windows Applications, and developing Web Applications.
    The book also provides detailed coverage to develop reusable components and package
    your application or component.


    Although this book requires no prior experience with Visual Basic, a familiarity
    with the Microsoft Windows operating system on your computer, and programming
    languages in general is recommended.


    # What You Need to Use This Book


    To perform the tasks in this book, you need a computer with Microsoft Windows
    NT 4.0, 2000, or XP installed, as well as Visual Studio .NET. You do not require
    any special tools, because all the tools are part of the Visual Studio .NET Development
    Environment.


    # Courier Font


    Indicates the use of Visual Basic for Applications (VBA) code such as tags or
    attributes, scripting language code such as statements, operators, or functions,
    and Excel Model code as objects, methods, or properties.


    # Bold


    Indicates information that you must use.


    # Itics


    Indicates a new term.


    # Apply It


    An It section usually contains a segment of code that takes you the lesson you
    learned one step further. It sections also offer inside information and pointers
    that you can use to enhance the functionality of your code.


    # Extra


    An Extra section provides additional information about the task you just accomplished.
    Extra sections often contain interesting tips and useful tricks to make working
    with Excel macros easier and more efficient.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# The Organization of this Book


    Visual Basic .NET: Your blueprint for versatile programs on the .NET Framework
    contains 13 chapters and one appendix.


    The first chapter, "Getting Started with Visual Basic .NET," familiarizes you
    with the features and functions you use throughout the book. You learn how to
    install Studio .NET, how to create a new project, how to save and open project
    files, and how to upgrade Visual Basic 6.0 projects.


    Chapter 2, "Getting Started with Forms," shows you how to build and manage the
    development of a Windows application. This chapter focuses on how to work in the
    Development environment and how to merge various windows.


    Chapter 3, "Work with Controls," shows you how to build and use controls, such
    as buttons, radio buttons, check boxes, lists, and toolbars within Windows applications.


    The fourth chapter, "Programming in Visual Basic .NET," shows you how to work
    with the Visual Basic language to declare and use variables, strings, arrays,
    collections, use operations and events, conditional blocks, and loops.


    Chapter 5, "Provide Input and Output," shows you how to read and write from files,
    detect changes in the file system, and retrieve file and directory listings. This
    chapter also covers how to access and print support, how to get information from
    the Internet.


    Chapter 6, "Create Graphics and Multimedia," shows you how to add graphics to
    your application. This chapter shows you how to draw lines, shapes, and text,
    in various fills and patterns. This chapter shows you how to build a custom shape
    and apply it to the form to make a custom-shaped form of any dimension or shape.


    Chapters 7, "Work with Classes," and 8, "Using Advanced OPP techniques" illustrate
    how to build and use classes


    effectively. This includes how to develop a set of properties, methods, and events
    in your classes. It also continues to explore more advanced techniques for class
    development, including inheritance, overloading, and using threads.


    The ninth chapter, "ADO .NET," introduces you to the ADO .NET database-programming
    tools, and shows you how to build data-bound controls, how to use grids and how
    to develop data


    Chapter 10, "Using Web Forms," illustrates the development of Web servers applications.
    The chapter shows you how to use the Web designer, and how to work with controls
    and the event model to build applications in any browser.


    Chapter 11, "Using Web Services," shows you how to build services over the Internet,
    and how to monitor services.


    Chapter 12, "Developing Components," shows you how to build your own components,
    Web controls, and user controls.


    Chapter 13, "Package Your Application," illustrates how to package your application
    to distribute, how to catch and handle errors, and how to provide features for
    disabled users


    # What''s on the CD-ROM


    The CD-ROM included in this book contains the project code from each of the two-page
    features throughout the book. This saves you having to type the code and helps
    you get started quickly with Visual .NET. The CD also contains evaluation versions
    of programs that you can use to work with Visual Basic .NET: Your blueprint for
    building versatile programs on the .NET Framework. An e-version of the book and
    all the URLs mentioned in the book are also available on the disc.'
  merge: -1
