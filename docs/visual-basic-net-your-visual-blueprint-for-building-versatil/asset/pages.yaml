  md: '# Extra


    You can use a few rules to make your FileSystemWatcher performs properly. The
    FileSystemWatcher watches disks as long as you do not switch or remove them. If
    network remote device, the component may no longer respond to changes. The FileSystemWatcher
    does not function with CDs or DVDs, because the drive is static. FileSystemWatcher
    only works on Windows 2000 and Windows NT 4.0. Remote machines have one of these
    platforms installed for the component to perform. However, you cannot watch a
    remote Windows NT 4.0 computer from a Windows NT 4.0.


    You can alter the buffer size of the FileSystemWatcher depending on the size of
    the file. The system notifies of changes through a buffer. If many changes occur
    in a short time, the buffer can overflow, causing the component to lose changes
    in the directory. The InternalBufferSize property lets you the amount of memory
    used by the system. Increasing the size of the buffer can make significant reduction
    in computer speed, so increase the buffer as little as possible. To avoid overflows,
    use the NotifyFilter, IncludeSubdirectories properties to filter out unwanted.


