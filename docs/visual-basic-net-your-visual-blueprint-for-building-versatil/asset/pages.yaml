  md: "# PROGRAMMING IN VISUAL BASIC .NET\n\n# Extra\n\nYou can use the Console object\
    \ to perform asynchronous reading and writing in a console application. This means\
    \ you can run a block of code in an application without stopping for input. You\
    \ can then check the input buffer at your leisure. To start an asynchronous read,\
    \ use the Console.OpenStandard method. VB .NET provides a method BeginRead that\
    \ sets up the buffer to store characters. In the code below, the Sub Main procedure\
    \ enters an infinite loop that it never polls for, but simply checks a buffer\
    \ variable set up in the BeginRead\n\nExample:\n\n```\nModule Module\n    Private\
    \ b(10) As Byte\n    Sub Main()\n        Console.OpenStandard.BeginRead(b, 0,\
    \ 10, AddressOf OnRead, Nothing)\n        ' TODO: Do important calculations without\
    \ stopping for input,\n        If Not (b(0) = **) Then Console.Write(b)\n    \
    \    Loop\n    Sub OnRead(ByVal e As IAsyncResult)\n        Dim Count As Integer\
    \ = Console.OpenStandard.EndResult(e)\n        Console.OpenStandard.BeginRead(b,\
    \ 0, 10, AddressOf OnRead, Nothing)\n    End Sub\nEnd Module\n```\n\n![](img/6e977c6eee8c1535039c864d41da5ccf_98_0.png)\n\
