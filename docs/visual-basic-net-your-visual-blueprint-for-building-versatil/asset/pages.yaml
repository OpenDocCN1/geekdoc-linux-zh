    the Add New Item dialog.


    +   2. Type a name for the new form.

    3. Press Open.

    4. Right-click the Project name in the Solution Explorer.

    5. Click Properties.


    > Note: To see the Solution Explorer, click the View menu and click Solution Explorer.'
