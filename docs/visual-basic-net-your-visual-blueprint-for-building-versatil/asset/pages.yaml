  md: '# ADD A NEW FORM


    Additional forms are necessary to create pop-up windows, dialog boxes, and a variety
    of functions in an application. You can create additional forms for your project
    by using the Add Form dialog box.


    VB .NET projects consist of multiple files, classes, forms, and modules. A project
    can work with an unlimited amount of each. You can use forms to effectively break
    your program into manageable sections for the user to navigate and understand.
    Include a single concept on a single form. For example, if your project has four
    functions, do not attempt to make all of them in one form.


    Microsoft Word has one main window and dozens of auxiliary windows to open and
    save files, modify options, and configure formatting. VB .NET represents each
    window in an application with a unique form.


    Windows that provide options for opening and closing of files are called dialog
    boxes. You can create these in VB .NET application. To create a dialog box see
    the section "Create a Dialog Box."


    Another type of window can be created in VB .NET using a toolbox. Programs like
    Adobe Photoshop use floating windows to provide a set of tools, which a user can
    access in the main application window. You can create toolbox windows using owned
    forms. See the section "An Owned Form" for more information on creating your own
    form.


    In most cases, use the standard Form VB .NET creates with the project as the main
    window. You may need to add auxiliary windows. For example:


    ![](img/6e977c6eee8c1535039c864d41da5ccf_55_0.png)


    # ADD A NEW FORM


    ![](img/6e977c6eee8c1535039c864d41da5ccf_55_1.png)


