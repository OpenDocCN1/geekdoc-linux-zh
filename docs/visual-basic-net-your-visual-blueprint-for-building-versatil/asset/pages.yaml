  md: '# VISUAL BASIC .NET


    # # CREATE TIMER EVENTS


    You can use the Timer control to run code at defined intervals. The Timer control
    works in the background, raising events in the form you specified at intervals.
    You can use the Timer''s event to perform background processing without interrupting
    the user.


    To start the control as your program runs, use the Start method. To stop it, use
    the Stop method. If the event has already fired, run it until complete, unless
    you execute a Stop.


    The event where you place your timer code is Tick. You place any code in here
    that needs to run every timer count.


    The Interval property determines the time before an event fires. Interval is an
    integer that specifies time in milliseconds. The default is 100, which means 100/1000
    of a second (tenth second). For example, you can set one second as 1000, and a
    minute as 60000.


    If your code does not finish before the next interval, another Tick event loads,
    creating a large stack of events waiting, which may lead to undesirable results,
    and if it happens for an extended period, may cause the program to crash or your
    computer to run out of memory. Make sure your interval is long enough to allow
    the code to complete.


    The Enabled property determines whether the control fires events. Default is False.
    You can set this property to True if you want the control to start firing events
    based on the Interval.


    # CREATE TIME EVENTS


    ![](img/6e977c6eee8c1535039c864d41da5ccf_81_0.png)


    +   1. Create a new Windows Application project or open an existing one.


    +   2. In the Toolbox, double-click the Timer control to add it to the form.


    +   3. Add other controls to display the activity of the Timer.


    +   - The example adds a Label to the form.


    +   4. Click the Timer control in the Component Tray to edit its properties in
    milliseconds.


    +   5. In the Property Window, set a value representing the speed at which events
    to fire in the Interval.


    +   6. Double the Interval property to enable the control to True.


    +   7. Click the Timer control in the Component Tray.'
