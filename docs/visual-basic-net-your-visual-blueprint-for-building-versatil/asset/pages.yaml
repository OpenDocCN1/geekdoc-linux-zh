    You can build components that serve a variety of purposes based on the needs of
    a particular project, or for reuse throughout multiple projects. All the components
    support working within the visual designer of the Development, enabling you to
    drag and drop components to your projects and modify properties within the Properties
    window.


    You can also create a specialized type of components known as controls. You can
    create controls that offer functionality to just like the controls provided by
    the .NET Framework. You can create Windows and Web controls that offer their own
    visual interface and allow you to drag and drop them onto their respective forms.


