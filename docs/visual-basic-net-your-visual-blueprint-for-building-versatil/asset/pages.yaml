  md: '# PROVIDE INPUT AND OUTPUT


    # WRITE TO A STREAM


    A stream works in two directions, streaming in and out of your program. You can
    use a stream writer to output information to a data source. You can use a StreamWriter
    to write to a file that you open with write access, or write data over a socket
    connection on the network.


    only parameter. For more information on strings, see Chapter 4. The StreamWriter
    method performs the same action but automatically adds a new line to the file
    stream.


    When you call the Write or StreamWriter method, the stream updates in memory.
    The Flush method writes any new data in the stream to the file. You can write
    a large amount of information to the stream and flush it in one step. Using a
    single large write to the disk is more efficient because memory transfers much
    faster than disk. To update the disk immediately after calling Write or StreamWriter,
    set StreamWriter.AutoFlush = True.


