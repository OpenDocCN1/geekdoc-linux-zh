  md: '# PROVIDE OPTION CONTROLS


    You can use the Check Box and Radio Button controls to provide a selection of
    choices that the user can activate. The major difference between these controls
    is that radio buttons are exclusive and set boxes are not. When users use one
    radio button, they cannot check the others in the same group, but they can check
    an unlimited number of check boxes at the same time.


    Edit the Text property of each control to change the caption. FlatStyle allows
    you to set the controls to flat, raised when you move your mouse over them, or
    like a standard control. Appearance changes the appearance of both controls into
    a button, which is pressed when a user checks it.


    The Checked property toggles whether the control is checked. If Checked = True
    for a radio button, it automatically changes any other radio button control. When
    the user checks the control, the Changed event is fired.


    You can align the check box and the option button independently of the text using
    the CheckAlign property. You can align the caption text using the TextAlign property.
    Both alignment properties support the full range of alignment, from corners to
    sides to middle.


    You can place images on the control. Use the ImageAlign property to load an image,
    and you can align it using the ImageAnchor. An ImageList can hold all images,
    using the ImageList and CheckBox RadioButton controls.


    To create groups of radio buttons that you do not have connected, you must place
    the buttons inside container controls. The Group is most widely used because it
    allows you to assign a label to the grouping. See "Frame Controls" for more information.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_73_0.png)


    +   1. In a Windows Application project, click and draw a RadioButton/ control
    to the form.

    2. You can separate groups of radio buttons and check boxes using frames.

    3. In the Properties window, type a caption for the control into the Text property.

    4. Add multiple buttons or boxes to fix your needs by repeating steps 1 through
    3.

    5. Double-click one of the controls to handle the Changed event.


    > Note: see the using "Frame Controls" for more information.

    Note: See Chapter 2 to set a property.'
