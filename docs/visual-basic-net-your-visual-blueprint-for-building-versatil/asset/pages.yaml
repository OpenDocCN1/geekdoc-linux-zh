  md: '# Extra


    You can modify the table associated with the DataView using provided methods and
    properties. The AllowEdit, AllowNew, and AllowDelete properties specify whether
    the DataView allows you to edit fields, add new records, and delete records, respectively.
    You can add a record to the underlying table of the DataView using the AddNew
    method. The method returns a new DataRow object which you can edit individual
    records of the new row. The Delete method deletes a row when you specify the parameter
    to. When you delete the row, its state changes.


    You can use the constants in the DataViewRowState enumeration with the RowStateFilter
    to filter records in the DataView.


    | CONSTANT | DESCRIPTION |

    |---|---|

    | Added | The rows you added since the last time saved or changes. |

    | CurrentRows | The current rows unchanged, and modified rows. |

    | Deleted | The rows you deleted since the last time saved or changes. |

    | ModifiedCurrent | The current version of rows that you have modified. |

    | ModifiedOriginal | The original version of rows that you have modified. |

    | OriginalRows | All rows unchanged and deleted rows. |

    | Unchanged | An unchanged row. |


