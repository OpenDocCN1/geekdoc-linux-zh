  md: '# USING THE COLOR DIALOG BOX


    When then editing colors in an application or simply changing the colors on your
    desktop, the common dialog box uses the standard method of selecting a color.
    You can use the ColorDialog control in your application to provide color abilities
    to yours.


    The Toolbox locates the ColorDialog control in the Windows Forms window. When
    you place the control onto a form, it loads into the Component Part of the form
    because it is hidden by default.


    The most important property for a color dialog box is the Color because it controls
    the color you display in the box. When the user clicks OK, this property selects
    the selection. If the user presses Cancel, the control does not alter the property
    value.


    The FullOpen property enables or disables the custom color selection of the dialog
    where the full color box


    is available. By setting FullOpen to True, the custom color appears automatically
    when the dialog box opens. The SolidColorOnly property determines whether the
    dialog selects only colors. This affects 256 color or less displays, which blends
    multiple colors and makes text reading difficult. If you plan to have small normal
    size text over the area where the selected color is in, set SolidColorOnly to
    False. The CustomColors property stores an array of the stored colors set.


    Like other dialog, use the ShowDialog method of control to make the dialog box
    appear. The method returns a DialogResult indicating either OK or Cancel, depending
    on the user clicks. See more information on dialog boxes and DialogResult constants.


    # USING THE DIALOG BOX


    ![](img/6e977c6eee8c1535039c864d41da5ccf_153_0.png)


    +   1. Create a new Application project or open an existing one.


    +   2. In the Toolbox, double-click the ColorDialog to add it to the form.


    +   3. In the Properties Window, change any necessary properties.


    +   4. Double-click the control to display the dialog box.


    The control opens in the Component Tray.


    Note: See Chapter 3 to edit properties.


    +   The example sets FullOpen to True.'
