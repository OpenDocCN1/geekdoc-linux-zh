    # CREATE A SHARED VARIABLE


    A global variable is a variable that any part of your application can access,
    meaning all parts of your application instance access created data when the program
    initializes. In many programming languages, Visual Basic 6.0 allowed global variables
    of all class modules to declare the variable globally. VB .NET provides an improved
    version of global variables called shared, which you place inside a class, but
    still allow access through a single instance throughout your application. Declaring
    shared variables inside classes allow you to create more readable code that maintains
    the modularity of classes with the flexibility of globally available.


    throughout your program''s operation. Using a shared variable, you can instantiate
    the class when needed to update the counter, but the shared member variable keeps
    the value of the counter at all times.


    You create a shared member variable by placing Shared before the variable name,
    but after the Dim keyword. When you declare a shared Public you can access or
    modify the variable from any instance that has access to it. To access the shared
    variable outside of the class, you use the name of the class, with a period and
    the name of the variable. You can also access it normally using an instance of
    the class. Members of a class, see Chapter 5.


    You declare a shared variable inside a class much like a standard member variable.
    Unlike a standard member variable the application can access the shared variable
    without creating an instance of the class. Also, even if there are no instances
    of the class, the variable remains in memory and never loses its value. For example,
    say your program has a counter. Normally, you create an instance of the class
    and make lose the reference to


    As with private member variables, you cannot access shared member variables outside
    of the class. The value stays in memory across instances of the class. This means
    that if you create a new instance of the class, it changes the variable for all
    instances of the class with the same value. See Chapter 5 to learn more member
    accessibility.


