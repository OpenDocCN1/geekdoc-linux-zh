  md: '# BIND CONTROL ON A FORM


    When you access data, you often need to allow the user to edit the data. VB .NET
    provides functionality in each control to automatically connect its properties
    to data. You can use binding to quickly connect a form to a database without having
    to write a significant amount of code.


    to create the appropriate Binding object through the control''s property page.
    You simply select the field to bind to the control.


    There are two types of binding: Simple and complex. Most controls support one
    or the other. Simple binding connects a single field of a record to a property.
    For complex binding, you can use the LastName field in a database to view and
    editing. Complex binding involves an entire set of data, or a field from a list
    of records, or an entire table of data.


    To work with lists of complex binding, you can use the ListBox, ComboBox, or CheckedListBox.
    Each displays a list of records that DataSet provides. The DataSource property
    to a valid DataSet and the DataMember property to the field. Commonly, you use
    the ListBox and ComboBox controls to display a list of records. See the section
    "Binding to a DataSet" for more information on choosing the appropriate method.


    Simple binding functions through a properly called DataBinding property in control
    that supports it. This stores a collection of Binding objects that links a property
    to a data field. Visual .NET


    The ErrorProvider also uses complex binding to monitor a data in the field and
    automatically supplies the error beside a control that contains a binding to the
    field. For more information see the section "Validate Data."


    ![](img/6e977c6eee8c1535039c864d41da5ccf_233_0.png)


