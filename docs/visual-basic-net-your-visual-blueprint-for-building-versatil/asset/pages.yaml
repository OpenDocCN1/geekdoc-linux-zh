  md: '# ADD A MENU


    You can use menus to provide a convenient way to access the main functionality
    of the menu. Menu bars are a standard part of most Windows applications.


    In the Component Tray, and adds a menu bar with a single empty menu title. You
    can add a caption to replace the placeholder menu title to create a menu title
    and an empty submenu. You can quickly create an entire menu system using this
    method.


    Simple utilities might not need them, but on the whole, menus provide an easy
    way for a user to learn and access the functions in a hierarchical manner. Also,
    menus allows users to progress in a cheesy order, rather than one provided by
    other interfaces such as lists or buttons.


    Visual Basic .NET adds simplicity to creating menus. Visual Basic 6.0 and relied
    on an external dialog box called the Menu Editor. .NET enables menu editing with
    the Windows Forms Designer.


    You can assign keys to menu items by placing an ampersand before the letter as
    the shortcut. For example, to make a file menu that a user can access by pressing
    Alt-F, set the Text to &File.


    You can assign shortcuts using the Shortcut property. Set the ShowShortcut property
    to True if you want the shortcut to appear to the right of the menu item.


    To create a menu, you access the Toolbox and select the MainControl, which adds
    a hidden MainControl


