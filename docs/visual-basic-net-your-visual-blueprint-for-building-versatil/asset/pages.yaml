  md: '# VISUAL BASIC .NET


    # # CREATE A TAB INTERFACE


    You can create a tabbed interface to allow the user access to series of controls.
    A tabbed interface allows using a single form to contain multiple screens of information,
    by named tabs, which you can switch. The TabControl provides a fully containing
    control like a Panel, but allows you to create multiple screens in the same client
    space. For on the Panel control, see the "Work With" section.


    The Padding structure allows you to add space around the text in the tab. Padding.X
    defines the amount of space to the left and right, while Padding.Y defines space
    to the top and bottom of the tab. The HotTrack property makes the tab change colors
    when the mouse pointer over it.


    The Appearance property allows three modes. Normal displays styles. Buttons displays
    a toggle button at top of the control. FlatButtons enables a toolbar as well as
    toggle. Alignment moves you the tabs to various sides, with Top being the default,
    and Bottom, Right, and Left aligning tabs, right and left.


    The TabPages collection contains list of least tabs. Each tab has an Index property,
    to assign a picture, and a BackgroundImage property. By setting the AutoScroll
    to True, tabs provide scrolls, as necessary, to let users scroll through the tab
    contents.


    By setting the ImageList of the TabControl to a valid ImageList, you can assign
    images using the ImageIndex property of each tab to the left of the text.


    When a user clicks a tab, the control automatically switches to that tab. The
    control notifies you of the click using the TabControl.Click event. Each Tab provides
    the standard abilities of a container, controls contained within the page can
    use Dock and Anchor to resize, controls.


