  md: '# VISUAL BASIC .NET


    # WORK WITH IMAGELISTS


    You can use an ImageList to store a large quantity of images without having to
    load independently into controls and create a bloated executable. Many of the
    Windows forms control load directly from the ImageList control, and some like
    the ListView, TreeView, and Toolbar controls use it to add images.


    The ImageList control also requires each of the images in the control, have the
    same color depth. The ColorDepth property specifies the color depth of all the
    images. When you load images into the control at design-time, the control determines
    the color depth of the images you use.


    An ImageList is non-visual, so when you load it into a form, it appears in the
    Component Tray. The Image has requirements for the images you load into the control.
    All of the images must have the same size. If the images are not the same size,
    the control resizes each image to the same size. You can change the size using
    the ImageSize property, which is a Size structure. Specify the width with the
    Width property of the ImageSize structure to set the Height property.


    The Images property maintains the collection of images. The control represents
    each image in the collection with an Image object. When you use the Visual Collection
    Editor to add images to the control at design-time, the editor allows you to browse
    for files to add to the collection. The actual representation of the image is
    stored inside your executable so you do not need to redistribute the individual
    images with your application. Each image is given an index starting with zero,
    according to the order you add the images.


