  md: '# FRAME CONTROLS


    You can create a frame around other controls and visually separate them from the
    rest of the form using a GroupBox. For example, you may better understand the
    function of a list of check box, radio button, any other control if you locate
    them inside a GroupBox. Group box draws a border around itself with a label at
    the top of the frame. You can change the label text using the Text property.


    Group boxes typically contain a logical group of RadioButton controls. For example,
    if you have lists of options where the user needs to select one response in each,
    you must place set of controls inside its own GroupBox. VB.NET does not allow
    you any way to separate controls controls into groups except by placing them in
    containers. For more information on the RadioButton control, see the section "Provide
    Options."


    A GroupBox is a container control, meaning it can hold other controls inside.
    Think of it as a main form. If you add controls to the box, and then move the
    controls move with it. If you use the Dock and Anchor properties to resize inside
    the group, they resize independently the GroupBox without regard to the form shape.
    Use the Dock and Anchor properties, Chapter 2.


    The BackgroundImage property allows you to place a picture in the background of
    the GroupBox. Note that placing a background in the group box may make the controls
    hard to see and can distract the user.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_75_0.png)


    +   1. In a Windows Application project, click and drag the GroupBox from the
    Toolbox to the form.


    +   3. Click and drag controls from the Toolbox to place inside of the GroupBox.


    +   The controls inside the group box respond separately. For example, radio button
    controls act as separate groups.


    +   2. In the Properties window, set the Text property to alter the heading of
    the form.


    +   This example shows radio GroupBox.


    +   4. Repeat steps 1 through 3 to add multiple groups to the form.


    +   5. Press F5 to run your application.'
