  md: '# MOVE THROUGH A DATASET


    To effectively use your bound controls, you must give users to move through the
    active records in the Dataset. Typically, a form contains the information for
    a single record, back and forward controls normally enable the user to move through
    the records. For example, a customer database may store all of the information
    about a customer. The screen presents boxes to display and allows changes to the
    data.


    To move controls to a form, you need to use the BindingContext object provided
    on a form. To access the BindingContext for a form, use


    Me.BindingContext property. The object holds a list of all data sets on the form.
    You pass the name of the Dataset and the name of the table as the two parameters
    to the method. It returns a BindingManagerBase that matches the parameters. A
    BindingManagerBase object refers to the same data source. The Position property
    controls the position of the record being displayed, meaning you can access the
    first record using Position = 0. The Count property returns the number of records
    available in binding, so to move to the end of the list, set Position to Count
