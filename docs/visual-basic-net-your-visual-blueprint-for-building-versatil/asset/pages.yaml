  md: '# VISUAL BASIC .NET


    # ORDER TAB KEY MOVEMENT


    You use the Tab key as a standard method to move around an application without
    the mouse. By default, Windows Forms assigns the movement in the order you added
    the controls to the form. Many developers lay out the form perfectly the first
    time, so TabIndex allows you to edit the order of controls.


    A significant quantity of data processing become significantly easier to use with
    an intelligent tab-order layout.


    The simplest way to set the tab order is to completely design your form, moving
    around controls until you see a visual order appear. At this point, start at the
    left corner of your application, and set the control''s TabIndex property to zero.
    Then whatever makes sense for your application, move to the next control in the
    proper direction and assign TabIndex = 1. Continue until every control is accounted
    for.


    Users expect to be tabbing at the top left of the form. Normally, tabbing moves
    from either left to right or to bottom. While you might find really all the indexes
    of the controls tedious, the Microsoft Windows Forms requires making your application
    more accessible. Setting the tab order makes your application more accessible
    for performing data entry and for anyone accustomed to moving around their computer
    with the keyboard instead of clicking for changing data. Database and other applications
    that require


    You also remove a control from the tab order by setting the TabStop property to
    False. The property is useful for labels and controls that do not directly input
    to data. By TabStop = True for every control on the form.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_63_0.png)


    ![](img/6e977c6eee8c1535039c864d41da5ccf_63_1.png)


    +   1 Create a new Windows Application project or open an existing one.


    +   2 Add a control to the form.


    +   3 Continue adding controls.


    +   4 Position the controls into columns or rows.


    +   5 Click the link, then select component.


    +   6 In the Properties window, type 0 (zero) into the TabIndex property.


