  md: '# EXPLORE LIST VIEWS


    You may have instances where you must display more than data which can easily
    fit in a Simple ListBox. Use the ListView control to provide a list of data with
    multiple columns and different views modes. Windows Explorer uses the ListView
    control to provide file lists.


    A ListView provides four views that you can see with the View property: LargeIcon,
    Details, SmallIcon, and List. The LargeIcon view shows a full-size icon with text
    below the icon. The SmallIcon view shows a small icon with text next to the icon.
    The Details view shows a small icon and a line item with details describing the
    item.


    SmallImageList property to link to the corresponding ImageList controls. For more
    information about the ImageList control, see the section "With ImageLists."


    VB.NET stores items in the list in the Items collection. Each item consists of
    a caption you using the Text property and an assigned icon, chosen with the ImageIndex
    property At design-time, you can modify the item list using a visual editor.


    You can attach a large or small icon to each item. You must create a ImageList
    control to hold the icons for both types. When you add an item to the list, you
    can use the index for the item items displays. VB.NET uses a LargeImageList and


    You define columns, which you see in detail, using the Columns collection. Details
    view requires you to define at least one column. The SubItems of each ListView
    in the list settings for information to display about the various items.


    When you select an item, the ListView_SelectedChanged event fires. You can retrieve
    a selection of the items using the SelectedItems collection.


