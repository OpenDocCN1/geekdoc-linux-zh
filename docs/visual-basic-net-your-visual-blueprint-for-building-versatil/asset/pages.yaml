  md: '# VISUAL BASIC .NET Example


    # CREATE A PATH


    Because primitives may not provide the desired appearance for your application,
    you can combine multiple primitives into a single object with simple fill. Use
    the GraphicsPath object to create a complex object from primitives. The GraphicsPath
    can also represent multiple figures, completely separate in space, or of different
    size.


    To create a path, declare an instance of a GraphicsPath class with no entries
    passed to the constructor. As part of the System.Drawing.2D namespace, you may
    find creating the path through the constructor difficult. For more information
    on creating instances of paths and using constructors, see Chapter 7.


    If you want to draw a path starting before a new one, call the CloseFigure method.
    Call StartFigure to begin a new figure without closing the current one. Use the
    CloseAllFigures method with parameters to close any open figures previously created.


    To draw the path, call DrawPath with a Pen and the GraphicsPath as the second.
    You can fill the area of a path using FillPath. Pass a Brush as the first parameter
    and the GraphicsPath as the second.


    To build an individual figure, use the StartFigure method with no parameters.
    The AddLine method adds a line to the figure. AddCurve adds curves to the figure.
    You can replicate all of the methods


    # CREATE A PATH


