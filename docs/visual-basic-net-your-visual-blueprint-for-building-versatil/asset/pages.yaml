  md: '# AN INTRODUCTION TO DATABASES


    O of the most-used functions in the Visual Basic language''s history, powerful
    database support, provides many functions to automate the development of database
    applications. You can use databases to quickly and efficiently store large or
    small quantities of information of any type, as well search, filter, and manipulate
    data to suit your needs. In cases where you need to store only a small list of
    data, you can use text files to more easily store the information. For more information
    on reading and writing to text files, Chapter 5.


    Visual Basic .NET and other Microsoft languages use a database system called ADO.NET,
    ADO, or Active Data Objects, which allow you to wrap a set of standard functionality
    around any supported database. For more information on the concepts of ADO.NET,
    see "Introduction to ADO.NET."


    A variety of programs allow you to create database files, and ADO supports most
    database formats. Common database packages to use with Visual Basic .NET include
    Microsoft Access, Microsoft SQL, and Oracle. Make sure the vendor of your database
    provides a native .NET provider, or an OLEDB compatible provider. ADO.NET can
    work with databases that support one of these two providers.


    Microsoft Access is best suited for creating small databases that do not need
    to function under a heavy load. Microsoft SQL Server provides a more powerful
    database solution for large and high-load applications, such as Web development.


    A database consists of one or more records, and a table contains one or more records.
    Each record can have one or more fields that make up its data. Each field in the
    record contains a single piece of information that record, such as a string, or
    a date. For example, you can define a table in a database to store customer information.
    The table has a field for the customer''s first name, last name, address, and
    phone


    number. Then you can define individual customers by adding new records to the
    table.


    Database design is a very important part of creating an efficient, and maintainable
    application. You should carefully evaluate your data storage needs and create
    a database that fits those needs while providing flexibility for expansion.'
