  md: '# VISUAL BASIC .NET


    # USING BUTTONS


    You can use buttons to provide simple user input in your application. A button
    represents a single action, such as accept, cancel, or go. This simplicity makes
    it effective that most users understand the purpose of buttons.


    You primarily use buttons on dialog boxes, and not normally on the main application
    screen. Instead of using them, you might want to use a toolbar. See the section
    “Create a Toolbar” topic later in the chapter for more information.


    The Button control has variety of properties to change its appearance. The FlatStyle
    allows you to create flat-style buttons. Flat buttons change color when a user
    moves over them, but have no three-dimensional look. The Popup property enables
    buttons to appear. It takes on a raised-dimensional appearance when you move the
    mouse over it.


    and depresses when a user clicks it. The Standard style appears in all cases,
    and depressed when the user presses the mouse button.


    You can load a background image into the button by setting the BackImage property
    to a supported format. You place the image in the foreground with the Image property.
    You can also load images from ImageList with the use of two properties, ImageList
    and ImageIndex.


    You use the Align property to align the image to the middle, or corner of the
    button. You use the TextAlign property to align the Text in the same way.


    To respond to the button pressing, you can create an event handler that responds
    the Click event. For more information on creating events, see the chapter “Advanced
    Events.”


    ![](img/6e977c6eee8c1535039c864d41da5ccf_65_0.png)


