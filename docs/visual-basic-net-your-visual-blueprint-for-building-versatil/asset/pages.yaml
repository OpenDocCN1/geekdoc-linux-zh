  md: '# VISUAL BASIC .NET


    # # ADD A DATAVIEW COMPONENT


    You can use the DataView to return a partial set of rows from the full database
    table and treat it just like a standard table. Use the RowFilter to filter the
    data table. To filter the RowFilter, select the field followed by a conditional
    operator and the value to test each field in the records. To test a string, place
    value inside single quotes (''''). You can also use the Sort property to filter
    based on the state of a record. You can use the DataView to expose only new records,
    or deleted records. The Count property returns the number of records in the filtered
    view.


    The DataSet component provides the ability to load multiple tables in a database
    into memory for your application. You can use the DataView component to filter
    and sort data before binding to a control. To learn more about binding, see the
    section "Bind Control on a Form." A DataView represents one table of a DataSet
    component.


    The Item property returns a row from the attached data table. Specify the index
    as the primary key, or use the Find method. Pass the key value as the parameter
    and the method returns the rows which exists in the table.


    # ADD A DATAVIEW COMPONENT


    ![](img/6e977c6eee8c1535039c864d41da5ccf_231_0.png)


    +   1. Set up a database connection on the form.

    2. Double-click the DataView component in the Data table of the Toolbox.

    3. In the Properties window, click the Table property and select the appropriate
    table.

    4. To sort the table, use the name of the field by which you want to sort in the
    Sort property.

    5. You can type a space followed by DESC to sort in descending order.

    6. To filter the data, use a field name followed by a conditional operator and
    the value to test in the RowFilter property.

    7. The examples filter by ContactName LIKE ''A*'' to retrieve records that start
    with A.


    Note: See the section "Create a Database Connection."


    ![](img/6e977c6eee8c1535039c864d41da5ccf_231_1.png)


