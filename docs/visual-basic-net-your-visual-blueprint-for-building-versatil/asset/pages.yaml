  md: '# VISUAL BASIC .NET


    # USING THE UPGRADE WIZARD


    You can use the Project Wizard to automatically convert Visual Basic 6.0 projects
    into fully Visual Basic .NET applications. Because of the number of changes that
    VB makes in the core, Microsoft provides an upgrade wizard to assist in the porting
    of applications.


    The wizard should determine the appropriate type automatically. The wizard also
    provides a check box if you want to generate default interfaces for public classes.
    If you have projects with a number of COM objects, you should select this. You
    can then select the directory to create the new VB .NET project and perform the
    conversion.


    To invoke the Upgrade Wizard, open a Visual Basic project project using the standard
    Project dialog. The Upgrade Wizard creates a new .NET project directory, and converts
    all files in the new project to support Visual Basic .NET. The wizard does not
    change or overwrite the existing files in your project.


    When the conversion completes, the VB .NET project opens. The Upgrade Wizard creates
    a file report that contains issues and alerts you to issues of code that cannot
    be converted or need special attention. See the previous section, "Language Changes
    from Visual Basic 6" for a list of important changes that occur when you convert
    from Visual Basic 6 to Visual Basic .NET. In project runs after the conversion,
    and you can test functionality to see if any problems appear during conversion.


    The Upgrade Wizard contains five steps. The first step provides a summary of the
    actions it completes. Step 2 checks the project type of the Visual Basic 6 project
    and attempts to produce a match in the .NET framework. The two options are DLL/COM
    control library.


