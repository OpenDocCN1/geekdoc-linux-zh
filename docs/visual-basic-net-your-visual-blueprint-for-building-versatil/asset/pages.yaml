  md: '# GETTING STARTED WITH WINDOWS FORMS


    # # Extra


    While automatic resizing using Anchor and Dock is powerful, you may find that
    this does not meet your needs for a complex or custom-designed form. In this case,
    VB .NET provides a more sophisticated system. You can resize all of your controls
    by using the Resize event. This event is called whenever you resize, maximize,
    minimize, or restore the form. Simply use the Size Width and Size Height members
    of the form. Then move and resize the controls by editing their Location.Top properties,
    or reassigning the entry (Point, Top). Utilize Size.Width and Size.Height to resize
    the control, or use a Size structure like = New Size(Width, Height). You can also
    use the manual resize event for some controls, and Anchor and Dock for others.
    Be careful when a user minimizes the form, or happens to make the form very small,
    because your calculated values may create negative values for width and cause
    your program to a run-time error.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_50_0.png)


