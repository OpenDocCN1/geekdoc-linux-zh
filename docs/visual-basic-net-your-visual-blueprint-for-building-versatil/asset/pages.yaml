    an effective method of scrolling through values. If the user slides the slider
    using a mouse, the control does not raise the Scroll event. Instead, it raises
    the MouseWheel event. You can call the Scroll event from the MouseWheel event
    to perform the same functionality.


    You can manipulate properties to allow the user to move easily through the range
    of values. The SmallChange property specifies the increment slider moves. You
    use this to decide what value the slider moves when the user drags it. For example,
    of two values allow the user to select every number when moving the tracker. The
    LargeChange property determines how much the slider moves when the user clicks
    on the slider or uses the page up and down keys to the sides of the slider.


