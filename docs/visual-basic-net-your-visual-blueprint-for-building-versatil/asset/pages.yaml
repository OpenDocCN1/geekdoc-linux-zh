  md: '# # GETTING STARTED WITH VISUAL BASIC .NET


    # ## Empty


    Variants in Visual Basic 6 initialize to Empty, which automatically converts to
    zero when you use them in a numeric expression, or to an empty string when you
    use them in a string expression.


    Visual Basic .NET initializes Objects to Nothing, which also automatically converts
    to zero or an empty string, if necessary.


    # ## Null and Null Propagation


    In Visual Basic 6, Null values are a subtype of the Variant variable, indicating
    that a variable contains no valid data. In VB, if any expression evaluates to
    Null, the Null value “propagates” through the expression and the entire expression
    becomes Null.


    Visual Basic .NET does not support Null propagation and Null as a variable type
    for ADO.NET. The CLR converts Null values containing Null into a variable type
    using DBNull. In no case, an expression involving string data, does return an
    empty string.


    # ## Local Variable Scope


    In Visual Basic 6, you can use a variable from the line containing the declaration
    to the end of the procedure.


    Visual Basic .NET uses block scope for variables. You means access a local variable
    from the line containing the declaration to the end of the block in which it appears.
    So if you declare a variable inside an If block, you cannot access the variable
    when the loop ends.


    # ## Arrays


    VB 6 allows you to define arrays with any lower and upper bounds. You can define
    the default lower bound in VB 6 using the Option Base statement.


    In Visual Basic .NET, all arrays are zero-based; means the first index of the
    array is always zero. You cannot set the lower bound of the array. For more information
    on declaring and using arrays, see Chapter 4.


    # ## ReDim


    Visual Basic 6.0 distinguishes between fixed size and dynamic arrays. You declare
    fixed size arrays using the Dim statement; you define dynamic arrays using Dim
    without bounds, and then change the array with ReDim.


    In Visual Basic .NET, all arrays are dynamic, meaning you can always use Dim to
    initialize the array and change the size of the array. This can cause VB 6 to
    redundantly reinitialize the array twice.


    # ## Assignment


    In Visual Basic 6, the Set statement assigns an object reference to a variable
    name. In VB .NET, because all variables are objects, the only languages support
    one form of assignment, the seen one


    # ## Calling Procedures


    VB 6 provides two forms of procedure calls: using the Call statement, which requires
    arguments in parentheses, and simply typing the name of the procedure without
    parentheses.


    Visual Basic .NET requires parentheses for method to improve compliance. Also,
    the default parameter passing method from ByRef in VB 6 to ByVal in Visual Basic
    .NET. This can create subtle bugs, so you may use ByRef back where necessary when
    upgrading.'
