  md: '# VISUAL BASE .NET


    # USING THE PRINTDOCUMENT CONTROL


    Users expect solid printing abilities in any application. The computer monitor
    does not provide the resolution to make reading comfortable. You can use the PrintDocument
    control to provide the foundation of a system in Windows Forms applications.


    When it receives a print command, the PrintDocument fires the BeginPrint event.
    This lets you perform initialization. For more information, see Chapter 2. After
    BeginPrint completes, you draw the page on the Graphics object provided by the
    event argument. For more information on graphics, see Chapter 6. The event''s
    argument also provides a MarginRectangle which you can specify the print area
    within. The PageSettings provides a list of all the settings the PrintDocument
    uses to process the print job.


    VB NET integrates all printing into a combined system that works together. A PrintDocument
    provides you with a surface to draw content onto the pages of your document. The
    PrintDocument control appears in the Toolbox under Windows.


    To begin printing a document, you can call the object''s Print method. Because
    of the variety of dialog boxes with the PrintDocument control, you can use the
    ''Print Dialog'' to present print options to the user. A Setup dialog box lets
    the user set margins and page sizes; for details, see the section ''Using the
    Page Setup Dialog''.


    When finishing a document, if your application needs to print another page, see
    .HasMorePages equals True if you need to print another page and False otherwise.
    If you set HasMorePages to True, the Print event fires again. You need to use
    level variables to store information about all previous pages.


    # USING THE PRINTDOCUMENT CONTROL


    ![](img/6e977c6eee8c1535039c864d41da5ccf_137_0.png)


