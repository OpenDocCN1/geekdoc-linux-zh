  md: '# CREATE A CONTEXT-SENSITIVE MENU


    You can context sensitive menus to provide a list of options relevant to the user
    area clicks. Context menus are sometimes referred to as "right-click menus" because
    you use the right mouse to access them. Context menus have existed since the introduction
    of Windows 95, and now context menus are a required feature for Microsoft''s Office.


    Only one Menu control should exist on a single form. That is not true with ContextMenu
    controls. An individual ContextMenu control should exist for most visual components
    on the form.


    Add a context menu to a form, you add a ContextMenu control and define the menu
    exactly like a standard menu. For creating menus, you select the section "A Menu."
    There is no ability to name the menu title, because context appears from controls
    and not from the menu bar. Then use the ContextMenu property provided by all controls
    and the form itself, and pick the appropriate ContextMenu to associate with.


    To add and remove items from the context menu program, you can manipulate the
    item collection provided by the MenuItems property of the context menu. Declare
    an instance of a Menu object and pass this object to the MenuItems.Add method
    as the only way to duplicate a menu inside a context menu, you can copy and paste
    during design-time, or you can add code at run-time to make a copy of a menu.
