    2. In the Toolbox, click and drag the Button control to add it to the form.


    Note: See Chapter 2 to learn about creating Windows Applications, and adding a
    control to a form.


    +   3. In the Properties window, set the Text property to change the button appearance.


    +   4. Change any necessary properties.

    This sets the FlatStyle to Popup.


    The property changes the effect in the design immediately.


    Note: See Chapter 2 to set the property or create an event handler to respond
    to the Button’s Click event.


