  md: '# VISUAL BASIC .NET


    # USING THE EVENT LOG


    Services do not provide visual output through a form or console. Because they
    run in the background without requiring the user to log, services must run without
    user interaction. You can use the event log to provide information and error messages
    about your service to system administrators. Any Windows event log''s size requires
    clearing the event log.


    string representing the source of the event, a message to store for the event,
    and a constant from the EventLogEntryType enumeration. The source string typically
    contains the name of your application. Consider using the same source for each
    event you add to the log, as determines which events belong to your application
    or service. The source string contains the information or error message that contains
    the reason for the log.


    The System.Diagnostics namespace provides a variety of classes covering recovery
    and debugging. The namespace also includes the EventLog class, which enables you
    to write logging information to the system event log. Use the WriteEntry method
    to add an item to the event log. A number of overloaded versions of this method
    exist.


    When the method executes, it adds an appropriate entry to the Application event
    log, which is the default for applications and services. You can search the MSDN
    library by typing EventLog to find more information on altering the log, adding
    custom logs, and with event logs.


