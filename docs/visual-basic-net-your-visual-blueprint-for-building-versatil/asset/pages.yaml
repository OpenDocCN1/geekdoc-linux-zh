  md: '# ADD A BUTTON CONTROL


    You can create a button, the simplest form of interaction, that users can perform
    an action on your Web Form. Most users understand that buttons accept they change
    on a Web Page form, making your application easier to use.


    Controls on Web Forms can take one of three appearances depending on your needs.
    The Button control creates a standard button similar to the one you see on Windows.
    The LinkButton creates a hyperlink, using JavaScript to browse the button. The
    ImageButton creates an image that the user can click.


    To create both the LinkButton and Button controls, you add the control from the
    Toolbox onto the form and set the Text property. For an ImageButton, you set the
