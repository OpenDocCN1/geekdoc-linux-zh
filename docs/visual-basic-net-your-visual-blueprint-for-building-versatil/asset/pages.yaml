    # INHERIT A FORM


    A Form in VB .NET is more than a class, you can inherit a form into a new form
    using standard inheritance techniques. You can use visual inheritance of forms
    to enforce uniform appearances and easier management. For example, a base form
    can represent the appropriate size and placements for the dialog. Each dialog
    in the base form inherits the interface for the particular dialog, but maintains
    the same size and functionality of the base form.


    All of the event handlers you specify in the base form automatically work the
    same in the inherited form. If a button on the base form specifies an event handler,
    the inherited form''s button calls the event handler in the base class. If you
    add an event handler in the inherited class for a component on the base form,
    both event handlers fire—the first one being the base class event handler.


    You can override an event handler in the base form, however you must use the Overridable
    keyword in the definition of the base class event handler, and then create a new
    method in the inherited class with the same parameter. Do not use the Handles
    keyword on the inherited form''s override method. If you want to call the base
    handler inside your override, use the MyBase object to access the


    The Windows Forms supports inheritance for forms. On the designer, inherited controls
    appear with a small icon to indicate that they inherit from the base class. You
    cannot delete these items because the base class defines them. See the section
    "Inheriting from Existing Classes" for more information on inheriting classes.


