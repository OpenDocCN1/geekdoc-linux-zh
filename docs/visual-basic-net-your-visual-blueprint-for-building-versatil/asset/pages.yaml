    controls on a form that allow you to monitor for errors. The provider adds controls
    to Error, Alignment, and Padding.


    In most cases, you do not want to set the error at design-time and instead want
    the error to appear dynamically when an error occurs.


    The SetError method allows you to set the error message for a control at runtime.
    Its first argument is the control where the error exists, and the second is the
    text, for example, SetError(TextBox1, "Error Message"). You may use this method
    when doing validation.


