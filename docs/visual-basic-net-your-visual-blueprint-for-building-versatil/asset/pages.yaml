    # USING REGIONS


    Windows GDI+ enables to create complex areas of space defined as a region. A region
    consists of any number of rectangles and paths that build a combined area of space.
    The Region class in .NET provides a way to define the shape of a window. For more
    information on creating a section "A Shaped Window",


    GraphicsPath, Rectangle, or other Region. Union takes the object from the argument
    and adds the object''s space to the current region. Intersection takes the object
    only the part of the region where both objects exist. Complement updates the current
    region to the specified object that does not intersect with the object. Exclude
    the current region to the portion of its interior that does not intersect with
    the specified object. Xor updates the current region by the minus intersection
    of itself.


