  md: '# STRUCTURED QUERY LANGUAGE


    # ACCESS ADO.NET


    For ADO.NET to access a variety of data sources, it must have a common language
    that works with a variety of databases. Structured Query Language (SQL) to communicate
    with databases of any format. SQL provides a simple English-like instruction set
    that can accompany any database subset.


    SQL Clauses


    You use the WHERE clause to specify records on which the SELECT, UPDATE, and DELETE
    commands function. When you use equal, less than, greater than or equal, greater
    than or LIKE operators in the clause. When you use LIKE, you specify strings containing
    wildcard characters. You can also use AND to combine multiple clauses.


    # SQL FEATURES


    IBM originally developed SQL in a relational database management system, System
    R, in the late 1970s. In 1979, Oracle Corporation introduced the first commercially
    available implementation of SQL. Since then, the entire database industry has
    adopted SQL to access its databases. With the help of ADO.NET you can support
    different databases and enable you to manage different databases with few changes.
    For example, you can use Microsoft Access to develop your application, but to
    use Microsoft SQL Server instead.


    Example:


    ```

    WHERE Price < 10

    WHERE LastName = ''J*'' AND FirstName = ''Smith''

    ```


    You use the ORDER clause to specify the order in which the database performs a
    sort on the data. After the ORDER clause, specify the field on which to sort.
    Use the DESC clause after the field name to sort in descending order. If you want
    to sort by one field, then another, separate fields by commas.


    This SQL covers a part of its abilities. Many databases provide the ability to
    combine tables, filter data, and create procedures. This book covers the major
    SQL commands to retrieve, and modify records in a database.


    Example:


    ```

    SELECT TotalBalance FROM Customers

    ORDER BY Price, Quantity DESC

    ```


    Example:


    ```

    SELECT TotalBalance FROM Customers

    ORDER BY LastName, FirstName

    ```


    # SQL Statements


    You can use these four statements throughout this chapter to perform the necessary
    tasks.


    The SELECT statement retrieves information from tables. You specify the fields
    for the command to retrieve followed by a FROM clause. You follow with the name
    of the table that you want to use. You can use the WHERE statement to retrieve
    only the necessary data using standard comparison operators.


    Example:


    ```

    SELECT TotalBalance

    FROM Customers

    WHERE LastName = ''Smith''

    ```


    The INSERT statement adds a record into a table. After INSERT, use INTO followed
    by the name of the table. After name, place the field names in parentheses. Then
    use the VALUES clause with the values for the fields in the order specified


    Example:


    ```

    INSERT INTO Customers

    (LastName, FirstName, TotalBalance)

    VALUES (''Smith'', ''John'', 150.25)

    ```


    The UPDATE statement changes records in fields that meet a given criteria. Use
    the table name after the UPDATE statement followed by the SET clause. You then
    specify fields and new values and use the WHERE clause to identify the records
    to update.


    Example:


    ```

    UPDATE Customers

    SET TotalBalance = 560.50

    WHERE LastName = ''Smith''

    AND FirstName = ''John''

    ```


    The DELETE statement deletes records from the table that met given criteria. After
    the DELETE statement, use FROM followed by the name of the table. Use the WHERE
    clause to identify the records to delete.


    Example:


    ```

    DELETE Customers

    WHERE LastName = ''Smith''

    AND FirstName = ''John''

    ```


