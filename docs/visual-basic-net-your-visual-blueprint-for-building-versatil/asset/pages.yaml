  md: '# GETTING STARTED WITH VISUAL BASIC .NET


    # DEVELOPMENT SUPPORT


    # Native Windows Applications


    You can use the Windows Forms technology present in VB .NET to develop applications
    that take full advantage of the Windows operating systems. A powerful designer
    lets you click, drag and drop your way to a complete Windows application. See
    Chapter 2 to Develop Windows Applications.


    # Create Windows Services


    Basic .NET can create true Windows services, the software that maintains background
    tasks on a Windows NT, Windows 2000, or Windows XP system. Windows includes a
    number of services that let the system index files for fast searching, run Internet
    and receive messages from application. Services enable you to create servers and
    utilities that provide Windows with transparent background functions. VB .NET
    is the first version of Visual Basic to support the creation of applications.
    See Chapter 11 to develop your Windows Services.


    # Games and Multimedia Applications


    Visual Basic accesses the same class library as other languages in Visual Studio
    .NET, providing VB .NET access to powerful GDI+ and DirectX functions. The Framework
    wraps the class library around all Windows functions, enabling you to use graphic
    commands like other components in the Visual Basic without system complex calls.
    See Chapter 5 for information on graphic commands.


    # Create Web Applications


    ASP.NET Forms technology in .NET lets you create interactive applications that
    run over the Web. Microsoft Internet Information Server (IIS) You can create applications
    that function with any browser and allow Forms to manage variables and state across
    pages automatically, creating a seamless development process for you. See Chapter
    10 to develop Web Applications.


    # Database Applications


    Data access has been a strong point of the Visual Basic language since its inception,
    provided by the most sophisticated data access tools. You can drag and drop automatically
    connected forms drag-and-click controls. With Microsoft Active Data Objects (ADO)
    you can access a database through one powerful environment. You can use standard
    classes in ADO.NET Access to SQL Server to Oracle servers with little-to-no change
    in code. See Chapter 9 to develop database applications.


    # Create Web Services


    Web Services use the power of .NET technologies to export functions across the
    Internet in a secure manner. Any NET enabled application, whether a Web Forms
    application or a Forms application, can access the Web Service as it is present
    on the same machine. See Chapter 11 to develop your Web service.


    # Console Applications


    New to Visual Basic .NET, you can create applications that run in standard text
    consoles. These console applications let you create utilities that a user


    can access from the command line and create quick programs to test programming
    functions. See Chapter 4 for more information on creating console applications.'
