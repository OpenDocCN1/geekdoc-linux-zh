  md: '# VISUAL BASIC .NET


    # # SET A PROPERTY


    properties provide the base of a component''s functionality, to be a form, dialog
    box, or control. You use properties to make a component look and function in a
    certain way. A property is actually an object-oriented programming (OOP) term:
    used to describe a particular object.


    For example, the most common property for visual components is the Text property.
    Earlier versions of Visual Basic had two properties, Caption and Text; Caption
    has been removed for standardization. By using Text, you can change the appearance
    of the control. You can add an ampersand (&) to a particular label to make the
    following letter the accessibility key for the control. For example, if the text
    of a control consists of Na&me, it appears as Name under the letter m, and allows
    the user to press Alt-N to access the control.


    You can alter a control''s properties with two different methods. You can alter
    them in code, or


    Designer using the Property Editor. When you alter properties in the Property
    Editor, the IDE automatically adds the code for the change you make to the InitializeComponents
    subroutine, which the form''s New method calls. To learn more about New, see Chapter
    7.


    The Property Window splits properties into various categories. You can collapse
    these if you do not use them first. Accessibility, Accessibility properties to
    make your program accessible to the handicapped, you can learn more about it in
    Chapter 13.


    # SET A PROPERTY


