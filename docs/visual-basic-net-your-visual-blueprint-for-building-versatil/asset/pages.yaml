  md: '# PROVIDE INPUT AND OUTPUT


    # Extra


    You can use a set of properties available in the TcpClient to ensure that a connection
    remains open. The LingerState property represents an instance of the LingerOption
    class. Linger time is the time connection stays open after you call the Close
    method. You can enable the LingerState to make your application acts like a proper
    client and does not disconnect in the middle of a transfer. If LingerState.Enabled
    is True, data continues to send over the network with a timeout of LingerState.LingerTime,
    in seconds. After your time is out or the expires, the connections close gracefully.
    If the TcpClient object finds no data in the send queue, the sockets closes immediately.


    Example:

    myClient.LingerState.LingerTime = 2

    myClient.LingerState.Enabled = True


    The TcpClient class buffers information as it comes across a connection until
    you process it. You can control the buffering by using a set of properties. The
    ReceiveBufferSize and SendBufferSize properties control the size in bytes of the
    receive buffer. ReceiveTimeout and SendTimeout control the amount of time class
    waits for a server response in milliseconds. NoDelay to make the connection delay,
    if the buffers fills, you do not lose data.


