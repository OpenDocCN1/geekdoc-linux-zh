    # Extra


    You can change the accessibility of overloaded methods, making one method Public
    and another Private, or use other supported accessibility keywords. This functionality
    enables you to create a more private version of the method that the public versions
    can use to perform the work.


    TYPES:


    | Public Class1 |

    | Public Overloads Function Add(n1 Integer, n2 Integer) As Integer |

    | Dim Array Integer() = (n1, n2)

    | Return(Array);

    | End Sub |

    | Public Overloads Function Add(n1 Integer, n2 Integer, n3 Integer) As Integer
    |

    | Dim Array Integer() = (n1, n2, n3)

    | Return(Array);

