  md: '# ADD OPTION CONTROLS


    You can create CheckBox and RadioButton controls for users to select on your Web
    Form. These controls function identically to the controls with the same name in
    the Windows Forms Framework. The CheckBox control allows users to select multiple
    checkboxes on the form, where a RadioButton allows users to select only one control
    from the group.


    For the Radio control, the GroupName property specifies the name of the group
    for the control. Specify the same group name for a set of RadioButton controls
    to make them function. If the user selects one of the items, all the others in
    the group deselect.


    You can use Text to set text for both of the options. Use HTML codes in the Text
    property. Alignment property specifies the text displays to the left or right
    of the checkbox or radio button, with default Right. You can use an option control
    with text combined an image to provide selections for graphical items. If you
    choose an image, the text displays as a tooltip when the mouse rests over the
    image.


    For checkboxes, you can use the Checked property to retrieve or set the state
    of controls. If the form submits and the user selected an option control, Checked
    of that option control property equals True.


    To create a list of either checkbox or radio buttons, you can use the CheckboxList
    or RadioList controls, which enable you to create multiple options with entire
    controls. You can also bind the control to a database to have a list of items
    created. For more information, see the section With Option List controls.


