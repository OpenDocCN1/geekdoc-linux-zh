    # DEBUG AN APPLICATION


    The process of debugging an application involves solving problems that cause the
    application not to compile, or when you run it. Using the debugging of the Development
    Studio to aid in the correction of these problems.


    The design-time error describes an error that occurs because you mismatch parameters
    or spell a method بمعنى. Normally, design-time errors are easily satisfying the
    criteria that the error message explains. For example, a error message may say
    yours not defined. For this message, check to see if you specify the name correctly
    or import the namespace as. Another common error occurs when checking for a missing
    comma, making sure you enclose strings properly, and underscores that


    split lines correctly. For more information on building projects and handling
    design-time errors, see Chapter 1.


    Runtime errors can take much longer to correct. A runtime error includes any error
    that results from logic or design errors, and results in a program that builds
    and runs, but not as expected. A runtime error can occur in two different ways.
    An actual error application during that occurs while your program is de Running.
    In the development environment, you may stop the execution to view the line of
    code that caused the exception. The other type of error is when your program runs
    with no errors, but does not function correctly. You need to look deeper into
    the execution of your program. By stepping through your application one line at
    a time and watching variables, see the section "Monitor Exception"


