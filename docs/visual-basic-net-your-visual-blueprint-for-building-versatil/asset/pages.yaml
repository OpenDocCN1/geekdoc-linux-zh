  md: '# WORK WITH OPERATORS


    You can use operators to assign, compare and manipulate the data that variables
    contain. For example, use the assignment operator (=), the most common operator,
    to assign values to variables, in the code, x = 8, which assigns the numeric value
    to the variable x.


    Arithmetic operators include addition (+), subtraction (-), multiplication (*),
    and division (/). Integer division (\ and modulus arithmetic (mod) are also available.


    You can also use the equal sign as an equality test. For example, suppose the
    variable x = 8. Use Boolean variable to store a list like y = (x = 8). Because
    x is equal to eight, the test is true, and y. Other comparisons include inequality
    (<>), greater than (>), less than (<), and greater or equal (=).


    Logical operators enable you to perform logic testing with the four standard operators
    being: And, Or, and Not. For example, suppose you have three Boolean variables,
    x, y, and z. In x = y Or z, if either y or z is true, set x to true.


    Using the combination of available variables, you can create complex expressions.
    For example, x = (20 * y + 21) * 5 + z is a valid expression that uses y and z
    to compute an answer that VB NET stores.


