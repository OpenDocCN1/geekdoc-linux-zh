  md: '# USING FOR LOOPS


    You can use a For loop to run a block of code a specified number of times. For
    example, you may want to output a set of available font sizes to a ListBox. Instead
    of doing this, you use a For loop to increment through the specified range.


    To create a loop, specify For and follow it with a counter variable. This variable
    stores the current value of the loop as it runs. Place an equal sign and follow
    it with a range of numbers using the To keyword. For example, to loop from 1 to
    10, use the line For x = 1 To 10. You can only use the variables Short, Integer,
    and Long for the counter variable, and determine the method before using the loop.


    By default, a For loop increments by ones. You can change the Step keyword after
    the range indicator,


    determining by what number the For loop count. For example, For x = 1 to 9 starts
    at one and increments two at a time until it reaches nine.


    You place the necessary code inside the loop and close it with a Next statement.
    At the point of the Next statement, VB .NET determines whether it needs to loop
    again because the counter has not reached the end state, or exit the loop and
    run the line of code after the Next statement.


    You can use Exit For to break out of a For loop before it completes. You may find
    this useful if an error occurs during the looping process. Keep in mind that using
    this command makes your program harder to understand and debug.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_117_0.png)


    +   - Create a new project or open an existing system.

    - Create or open the method where you use the loop to execute.


    +   - Type code to define the counter variable.


    +   - Type For count = 1 to 10, replacing count, with the name of the counter
    variable, 1 with start point for the counter, and 10 with the end point for the
    counter.


    +   - Press Enter.'
