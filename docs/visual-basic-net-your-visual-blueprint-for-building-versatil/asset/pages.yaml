  md: '# VISUAL BASIC .NET


    # MODIFY THREAD EXECUTION


    The Thread class provides a variety of functions for greater control over threads.
    You can call these methods to affect the execution of the threads you create.
    If you execute a complex task in the background, you can provide the ability to
    pause, resume, and cancel the execution. The Thread object has a method for each
    of these operations.


    The Suspend method stops the execution of the thread at a safe time. Use Suspend
    to pause a thread without danger of crashing the program. The Resume method starts
    a thread where it last stopped.


    The Sleep method lets a thread wait for data while consuming minimal CPU cycles.
    You can use this to make the thread wait for a specified number of milliseconds
    before resuming. You specify the number of milliseconds to be the first parameter.


    If you set a thread into a wait state, by using the Sleep method, or the Join
    method explained in "Write Thread-Safe Code", you can interrupt the waiting and
    cause the thread to resume execution with the Interrupt method.


    To ask a thread to stop, call the Abort method. When you call the method, .NET
    throws an exception to the thread. The code in the thread automatically stops.
    The thread may execute a few commands before exiting, so use the Join command
    to wait completely.


    The IsAlive property returns True if the thread is dead. You can also check the
    ThreadState property for the status of the thread. The property returns a value
    from the Threadenumeration.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_215_0.png)


    ![](img/6e977c6eee8c1535039c864d41da5ccf_215_1.png)


    # MAKE A THREAD SLEEP


    +   1. Set up a thread model and the code to start the thread.

    2. Type the name of the thread.


    +   If you are in the code, type Threading.CurrentThread

    3. To make a thread sleep, type Sleep followed by the number of milliseconds in
    parentheses.


    # SUSPEND OR RESUME


    +   4. To pause a thread, use newThread.Suspend(), replacing newThread with the
    object variable for a thread.


    +   5. To resume execution, use newThread.Resume(), replacing newThread with the
    object variable.


