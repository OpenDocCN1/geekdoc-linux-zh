  md: '# AN INTRODUCTION TO ADO.NET


    The latest evolution in Microsoft''s database technologies, ADO.NET provides support
    for new functionality and programming methods. ADO.NET


    functions inside the .NET Framework, allowing any .NET application to access its
    features in a similar way.


    # FEATURES


    Recently, through the evolution of the Internet, many developers develop new client
    applications on the Web application model. Many applications use XML to pass data
    over network connections. Web applications use HTTP to communicate, and must maintain
    state between requests. New model differs from the connected, tightly coupled
    style of programming where a connection was held for the duration of the program''s
    lifetime and no


    special handling of state, defined as the persistence of data across parts of
    an application, was required.


    ADO.NET was designed to meet the needs of this new programming model: disconnected
    architecture, tight integration with XML, and common data representation with
    the ability to combine data from multiple and varied data sources, and optimizations
    for accessing data in different ways.


    # Consistency


    One of the major features, Microsoft database technology can work with multiple
    data sources consistently, providing consistent access to data sources through
    Microsoft SQL Server any data sources exposed via OLE DB. ADO.NET includes inherent
    support for datasets. You can use ADO.NET to connect to data sources and retrieve,
    manipulate, and update data.


    # Similarities to ADO


    The design for ADO.NET maintains as many similarities to ADO, while still addressing
    requirements necessary to support new disconnected connections.


    ADO.NET connects with ADO. Although you commonly write new applications with ADO.NET,
    remains available to the .NET programmer.


    # Powerful Object Model


    ADO.NET provides an Object Model with database features. This allows you to use
    the objects with a database provider, or individually to work with custom application.


    # Supports N-Tier Programming


    ADO.NET provides support for the disconnected, environment for which many Visual
    Basic .NET programmers need to develop. N-tier programming involves developing
    separate levels of the application: the presentation tier, the business tier,
    the data access and storage tier to provide the complete user experience.


    In addition, you still have the option to work with the database provider using
    SQL to execute commands and retrieve results directly.


    # XML Support


    To access data in a standard way, XML serves to encode and format data into a
    compliant format. A fundamental part of their applications, developers need XML
    as a data source. For this reason, XML builds upon its support in ADO.NET at a
    very fundamental level. The core of the entire .NET Framework, the XML class allows
    you to cross between the two libraries easily.


