    \ to FixedSize or Fixed3D. FixedSize creates a single black panel border around\
    \ the control, while Fixed3D creates a three sunken edge.\n\nYou can set AutoScroll\
    \ to True to allow the Panel to create scrollbars if a user resizes the panel\
