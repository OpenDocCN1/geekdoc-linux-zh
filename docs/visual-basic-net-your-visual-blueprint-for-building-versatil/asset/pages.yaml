  md: '# WORK WITH ARRAYS


    Visual Basic .NET contains a number of functions for manipulating arrays. You
    can use these functions to sort the array, remove items, and determine the size
    of the array.


    The Array object exposes a Sort method. Pass an array to Sort for a standard alphanumeric
    sort, for example, Array.Sort(myArray). The method sorts the items in the array
    and saves them back into the same array. Sort method only supports one-dimensional
    arrays.


    The LBound and UBound functions provide the index of the lower- and upper-most
    position of the array. Pass the index as a parameter to either of these functions
    to return an integer specifying the bound. You use LBound for compatibility with
    Visual Basic 6 and older versions, but array in VB .NET always begins with 0,
    UBound always returns the index of the array. For example, if you make the array
    declaration myArray(5) returns 5 You can use this in methods where you have a
    parameter in array, but not know its size. For x=0 To UBound loops through any
    array with the name my.


    The Array object also exposes a BinarySearch method. BinarySearch locates an individual
    item in an array. Pass the array and the key to find the location as arguments
    to the method. For example, Array.BinarySearch(myArray, "x") must ensure that
    the key value you pass to the method is the same type as the objects in the array,
    meaning if you define the array as an array of Date pass a Date variable as the
    key. The method returns an integer specifying the index of the item. A value of
    less than zero does not exist.


