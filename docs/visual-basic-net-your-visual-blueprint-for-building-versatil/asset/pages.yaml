  md: '# VISUAL BASIC .NET


    # USING STRUCTURES


    A structure is a simplified class. Structures distinguish themselves from classes
    by primarily functioning as data storage mechanism rather than a representation
    of an object. Structures support properties, methods, and just events like classes.
    If you need to pass a large amount of data between methods, you can create a structure
    to contain the data and pass the structure variable instance.


    Structure and Sub statements form methods exactly like they do for classes. For
    more information on creating a method, see the section "Define a Method." You
    can define events in the structure that you create. See the section "Create an
    Event" to create an event.


    You define a structure in VB.NET using the Structure..End block. Inside the block,
    place only declarations or procedures types Function, Property, or Sub. You can
    declare a variable Public to make it a property, or declare Private for storage
    of a structure property. Properties declare the syntax of a class. For more information
    on member variables, see the section "Define a Member," and for properties, see
    Chapter 4.


    A structure works like a type, meaning you create an instance of the structure
    without using the New keyword. In VB.NET, this is a value-variable instead of
    a reference. To change the variable you holds the corresponding structure, while
    a class variable holds a reference to a class you declare using the New keyword.
    Simply declare a variable. Use the name of the Structure as the variable type.
    See Chapter 4. When you define a variable based on a structure, you can access
    its members just like a class.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_191_0.png)


