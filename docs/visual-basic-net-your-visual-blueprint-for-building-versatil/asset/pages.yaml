    +   Click the .NET Framework components.


    +   Click Browse and select the DLL from step 4.


    +   Check the appropriate controls and components.


    +   Click OK.


    +   Add all components in the Toolbox to the form of the application.


    +   The components from the library DLL will let you manipulate them like other
    controls and components.


