  md: '# # VISUAL BASIC .NET


    # ## CREATE A DIALOG BOX


    You can use dialog boxes to prompt the input user. Dialog boxes do not disappear
    until the user provides the appropriate information or cancels out of the box.


    A dialog box is a modal form which restricts access to its parent form until the
    user closes it. Examples of dialog boxes include File Open, Save Print, and others.


    To create a dialog box, create a new form and use a method to accept or cancel
    changes made. For more information, consider the setting "Add New Form." A dialog
    box should not use the screen frame, minimize or maximize buttons.


    You may make the form nonresizable by changing the FormBorderStyle property to
    FixedDialog. If you want to make your dialog box resizable, leave the FormBorderStyle
    alone, and for Open/Save dialog boxes set the MinimumSize and MaximumSize properties.
    Set Maximize and Minimize buttons to False to remove the form from the Windows
    Taskbar by ShowInTaskbar to False.


    The Accept and Cancel properties allow you to select Button controls to act as
    default OK and Cancel buttons. Press Enter in the dialog boxes as the AcceptButton
    and Esc as the CancelButton.


    To enable the dialog box''s actions, set the DialogResult property on each Button
    to one of the available settings: Abort, Cancel, Ignore, No, None, OK, Retry,
    Yes. The result is passed back to the parent form. You can also set this property
    through code at runtime, in which case setting the properties makes the dialog
    box close immediately and pass back the DialogResult.


    A parent form opens a dialog box by calling the dialog box''s ShowDialog method.
    The form appears as a modal dialog and returns the result when the user closes
    the dialog box.


    # CREATE A DIALOG BOX


    ![](img/6e977c6eee8c1535039c864d41da5ccf_57_0.png)


    +   - Add an example text to the box to the form.

    - Add two Button controls.


    +   - Change MinimizeBox, MaximizeBox, and ShowInTaskbar to False.


    +   - Set the first button''s DialogResult to OK.


    +   - Set the second button''s DialogResult to Cancel.


    +   - Click the form to edit its properties.


    +   - Change AcceptButton to the first button and CancelButton to the second button.


    Note: See Chapter 3 to work with the button control.'
