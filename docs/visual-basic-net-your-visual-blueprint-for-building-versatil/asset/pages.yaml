    # BIND FIELD TO A LIST CONTROL


    You can bind a database field for users to display database information through
    the Web Form. Web data binding is read-only, which means a control can load information
    but not saves changes into the data.


    In forms, you most often use list controls for binding. The ListBox, DropDownList,
    CheckBox, all support data binding explicently. You can use a list control to
    display items that read from a data source. Each item in the list corresponds
    to a row in the data source. The control displays the index and value. You manually
    set the value to the unique key in the database so you can easily locate the record
    for processing.


    To set up a list control, specify the DataSource to reference a data source, such
    as a DataSet or DataView bind the controls.


    component, for the page. For more information on creating database connections,
    see Chapter 9.

    You specify which data-source fields the control displays with the DataTextField
    property. Specify the field to the function item with DataFieldValue. If the data
    has only one value, you do not set the properties, and the control displays the
    simple text alone.


    To update each of your controls, you must call their DataBind method. Alternately,
    you can call the form method that contains the binding. You should only call this
    when the page loads and changes. To make sure the page does not reload the data
    source each time it loads, check the IsPostBack property. If False, the page is
    loaded for the first time, and you need to bind the controls.


