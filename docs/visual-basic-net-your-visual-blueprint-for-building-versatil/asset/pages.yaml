  md: '# USING COLLECTIONS


    Collections are built-in classes provided by Visual .NET that store a list of
    items. This sounds like an array, but the Collection provides a much more powerful
    storage mechanism. You can store any type of data, including simple types, arrays,
    and objects. The Collection class''s ability to resize dynamically creates a powerful
    memory storage mechanism. For example, the list is one-based making the first
    item


    collection much easier. You must make the keys unique for each object.


    The third and fourth parameters of the Add method enable you to specify the key
    or index of an existing item in the collection. The new object adds before the
    item you specify by the third argument, or after the item you specify by the fourth
    argument. You may choose. If you specify neither, the new object adds to the end
    of the list.


    To create a collection, declare a new instance of the Collection class using the
    Add method. Add items to your variable or object to the collection as the first
    parameter. Optional, pass a key as the second parameter. A key value is a string
    to identify the object you added. Although you do not have to specify a key, doing
    so makes finding objects to


    The Item property returns an object based on the index or the key. Pass either
    of these values the Item method to retrieve the appropriate item. You can use
    a For...Next loop to quickly iterate through the entire collection. For more information
    on For, see Chapter 4.


