    # Apply It


    You can provide drawing functions that affect the popup style of the Button control.
    To monitor the user pressing the mouse in the UserControl, set a variable in the
    MouseDown event handler and the MouseUp event handler when the user lets go of
    the mouse button. You can use MouseEnter and MouseLeave to monitor the user entering
    or exiting the control, which you can provide for a popup-style appearance.


    ```

    TYPE THIS:

    Private Enum ButtonState

    Normal

    Pressed

    Hover

    End Enum

    Private myState As ButtonState = ButtonState.Normal

    Private Sub UserControl_MouseDown(..) Handles Mouse.Base.MouseDown

    myState = ButtonState.Pressed; Me.Invalidate()

    End Sub

    Private Sub UserControl_MouseEnter(..) Handles Mouse.Base.MouseEnter

    myState = ButtonState.Hover; Me.Invalidate()

    End Sub

    Private Sub UserControl_MouseLeave(..) Handles Mouse.Base.MouseLeave

    myState = ButtonState.Normal; Me.Invalidate()

    End Sub

    Private Sub UserControl_MouseUp(..) Handles Mouse.Base.MouseUp

    myState = ButtonState.Normal; Me.Invalidate()

    End Sub

    ```


