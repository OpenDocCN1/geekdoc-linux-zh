  md: '# AN INTRODUCTION TO WINDOWS FORMS


    You can use Windows Forms, a large technology

    encompassing a huge set of tools, to build powerful

    Windows applications quickly and easily. In this

    chapter, covers creating forms, manipulating forms,

    and adding controls to them.


    A Form provides the backdrop where all of

    application''s abilities are accessible. Controls provide

    functionality on the form, enabling you to view, edit,

    manipulate, and explore your application. A control is

    anything that you want onto a form, like a button, or a

    list, or check box. To learn how to add controls to your

    form, see the "Add Control"


    To understand the capabilities of a form, see the summary

    of Important Forms given below. A member refers

    to any part of component in VB .NET available for

    many or viewing. Forms, controls and classes all

    have a set of members as properties, methods, and

    events give them the ability to perform certain tasks.

    For more information on object-oriented terms, see

    Chapter 7.


    The tables below do not include all the abilities of a

    form, but touch on some of the abilities that you may find

    interesting or useful. Many members that they are shown

    are more covered fully throughout the chapter. For more

    nformation on setting a form''s properties, see the section

    "Set a Property" for more information on responding to a

    form''s events, see the section "Add an Event"


    # IMPORTANT FORM MEMBERS


    | PROPERTIES | DESCRIPTION |

    |---|-|

    | AcceptButton | Set this property to a Button that automatically activates when
    the user presses Enter. The AcceptButton only activates if the current control
    uses the Enter key, like a multi-line text box, the control uses the key press
    and the button does not receive the Click event. |

    | AutoScale | Makes the form and its controls automatically resize to fit your
    font-size preferences. You may want to change this to False for property interfaces
    not using standard controls. |

    | AutoScroll | When True, AutoScroll adds scrollbars to the form when all of its
    constituents do not fit. |

    | BackgroundImage | Loads an image into the form''s background. The image tiles
    the entire form. Supports a large number of formats, including BMP, GIF, JPEG,
    PNG, WMF, and others. |

    | CancelButton | See the description of AcceptButton below, except CancelButton
    functions on the Esc key. |

    | FormsModule | Sets the border of the window. The default size is S, allowing
    you to use FixedDialog to create a fixed window that looks like a dialog box.
    Fixed3D creates a fixed window with sunken client area. |

    | Location | This property determines the position of the window on the desktop.
    Windows automatically corrects it depending on the position of the Taskbar. You
    may need to set StartPosition to Manual to work. |

    | MaximizeBox | Determines whether the form displays a maximum button in the title
