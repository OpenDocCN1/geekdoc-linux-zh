    # ADD AN ADDITIONAL WEB FORM


    You can add multiple Web Forms to a single Web project just like you add multiple
    Forms to a Windows project. Each form represents a single Web page of the site.
    For example, you may use the initial Web page to display the options in the application,
    and then a number of pages for each section of the page. Unlike an Application
    that compiles into a single executable with a single entry point, a Web Application
    is a simple series of individual ASP files that store the individual forms.


    You can choose individual settings for the layout details and browser requirements
    for each Web Form in the project. For instance, you can make the main page of
    the application support the most browser types possible. for particularly complex
    pages, you require a high-level browser. To help edit individual page properties
    and set browser settings, see the section "Using a Web Form."


    You can add Hyperlink controls to link from one page to another. The Hyperlink
    control adds a standard HTML-linked hyperlink to a page. You can use the Target
    property of the HyperLink control to make the page into a separate window if you
    want to keep the previous page. For more information on using the hyperlink control,
    see the section "Add Hyperlink Control."


    To add a new form, use the Project menu. When you access the Add Item dialog,
    you can specify the new filename. The Development Environment builds a Web Form
    and adds the necessary files to the folder.


    # ADD AN ADDITIONAL WEB FORM


    ![](img/6e977c6eee8c1535039c864d41da5ccf_265_0.png)


    +   1 Create a new Web Application project or open an existing one.


    +   2 Click Add New Item dialog


    +   4 Click Open.


    +   3 Type a filename for the new form.


    Note: To create a Web Application project, see the section "Create a Web Application."


