  md: '# VISUAL BASIC .NET


    # CREATE A DATA RELATIONSHIP


    In most cases, a single table of a database does not store all of the information
    that makes necessary data for an application. Various tables store different parts
    of the information, and you combine the data from the tables to create an application
    that allows the user to modify all of the data in an effective way. You can define
    relationships in your Visual Basic .NET application using XSD.


    For example, if you have a database containing Orders and a Customers table, the
    Orders table stores all of the orders that users use. You can use a relationship
    to attach the orders to a particular customer in the Customers table. VB .NET
    allows you to set up the DataRelation class visually in your application, and
    to edit the dataset to store the various tables you add to the DataSet.


    DataSet objects, see the section "Add Connection to the Form."


    When you access the Add Relationship dialog box, it enables you to select two
    tables and the fields between the tables that match to create the relationship.
    In your example, link the CustomerID field in the Customers table to the CustomerID
    field in the Orders table. You can also select which table as the parent table,
    the table which can receive multiple records in the child table. For example,
    the Customers table is the parent because multiple orders match the same customer.


    Once you create a relationship, you can display the table in a DataGrid and record
    each record automatically linked to child records. For more information on creating
    a DataGrid, see the section "Add a DataControl."


    # CREATE A DATA RELATIONSHIP


