  md: '# PROGRAMMING IN VISUAL BASIC .NET


    # Extra


    When several operations occur in an expression, VB .NET evaluates the expression
    in a predetermined order called operator precedence. Understanding operator precedence
    helps you determine how VB .NET processes a line of code containing many operators.
    When expressions contain operators from more than one category, arithmetic operators
    evaluate first, comparison operators evaluate next, and logical operators evaluate
    last. Comparison operators all have equal precedence and evaluate in order, from
    left to right, in the order they appear. The table below shows arithmetic, concatenation
    and logical operators in the VB .NET them from top to bottom.


    | ARITHMETIC/CONCATENATION | COMPARISON | LOGICAL/BITWISE |

    |---|---|--|

    | Exponentiation (^) | Equality (=) | Not |

    | Negative (-) | Inequality (<) | And,AndAlso |

    | Multiplication and addition (*,/) | Less than (<) | Or,ElseXor |

    | Integer division (/) | Greater than (>) | |

    | Modulus arithmetic (Mod) | Less than or equal to (<=) |

    | Addition and subtraction (+,-) | Greater than or equal to (>=) |

    | String concatenation (+) | Like, Is, TypeOf... |


    ![](img/6e977c6eee8c1535039c864d41da5ccf_106_0.png)


