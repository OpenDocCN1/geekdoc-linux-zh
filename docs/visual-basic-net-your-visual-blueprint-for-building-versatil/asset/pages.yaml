  md: '# GETTING STARTED WITH WINDOW FORMS


    # Extra


    The type of events you use can create more or less interaction, depending on what
    is necessary for your application. Small but useful interactions can include labels
    and colors in the control as you move your mouse over. Most controls provide Mouse,
    MouseLeave, and MouseHover events. These events fire when the mouse enters the
    control, leaves the control, and stays on top of the control for a few moments.


    Not all events are in response to user interaction. All visual controls and the
    control itself have a Paint event. In this event, you provide code to draw directly
    onto the surface of the control. For example, you can draw a pattern in the background
    whenever all or part of the control or form invalidates. Invalidation is when
    some part of the control or form needs to redraw. You can force it by using the
    invalidate method of the component.


    ![](img/6e977c6eee8c1535039c864d41da5ccf_48_0.png)


