  md: '# VISUAL BASIC .NET


    # PROVIDE A VALIDATION SUMMARY


    You can provide one validation summary area on your form instead of having validation
    for each control display. You use the ValidationSummary control to integrate validation
    information into the form into a single area.


    You can use the DisplayMode to change the listing style to BulletList, List, or
    SingleParagraph. The default, BulletList, shows one validation error per line,
    preceded with bullets. The List setting uses the same layout without the bullets.
    The SingleParagraph setting places one error after another without line breaks,
    and wraps text.


    The ValidationSummary control holds the validation text of all the controls on
    the form. Although it displays errors only after you press a control, the client-side
    performs validation without a roundtrip. You can disable the EnableClientScript
    to prevent validation summary generation to occur. You can set the CausesValidation
    property of Link, Button, to False to allow the user to click the button without
    causing validation. If you disable the client scripting for the validation summary
    disabling the ValidationValidation property, the button''s click event still not
    work until the cursor validation errors.


    Because the summary control displays the list of errors of all the controls on
    the form, you may want to remove the visual display of all validation controls
    on the form. To remove the interface of each validation control, set its Display
    property to None. This still displays the ValidationSummary control. On some forms,
    you may want to use displays, directly beside the control, and as a reference
    at the top of the page.


