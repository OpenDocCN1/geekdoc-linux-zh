    # Function Return Values (Integer)


    The function can pass a return value back to the calling script by using the return
    statement. Typically, this technique is used to pass small (<255) integer values
    back to the script. The return value can then be checked by the calling script
    by examining the contents of $?. The next example adds some statements to the
    dow function and checks the returned value:


    ```

    $ cat dow3

    #1 /bin/ksh

    function dow

    {

    ...

    case $1 in

    -s) WEEKDAY=$(date +%A)

    return 2;; # Added this return statement

    #Returns value to dow3 script

    *) print "Format is \ndow [-s]" #Returns value to dow3 script

    return 1;;

    esac

    }

    # Script begins execution here #

    ```


