  md: '# Multiple Output Redirection


    Sometimes you might prefer that the output from your command be placed in a file
    *and* be placed on stdout. The tee command provides this functionality. If you
    dwell on the name of the program—tee—you can almost visualize what it does. Picture
    the output travelling up the vertical part of the letter ''T''. When it reaches
    the top of the T, it splits the stream and the output goes in both directions
    (left and right). By default, the output will go to stdout and to the file you
    specify at the end of the command syntax. The tee command can be used to redirect
    output to many places at once (not just two, as the name implies).


    The following example directs the output of a ps command to files named xx and
    yy, as well as to the terminal:


    ```

    $ ps

    PID TTY TIME CMD

    614 pts/1 00:04:30 tsh

    16910 pts/1 00:00:00 ps

    $

    $ ps | tee xx yy # Directs output to stdout, file xx, and file yy

    PID TTY TIME CMD

    614 pts/1 00:04:30 tsh

    16911 pts/1 00:00:00 ps

    16912 pts/1 00:00:00 tee

    $

    $ cat xx

    PID TTY TIME CMD

    614 pts/1 00:04:30 tsh

    16911 pts/1 00:00:00 ps

    16912 pts/1 00:00:00 tee

    $

    $ cat yy

    PID TTY TIME CMD

    614 pts/1 00:04:30 tsh

    16911 pts/1 00:00:00 ps

    16912 pts/1 00:00:00 tee

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_270_0.png)


