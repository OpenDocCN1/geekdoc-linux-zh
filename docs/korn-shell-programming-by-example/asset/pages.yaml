  md: '# # Korn Shell Programming


    BY EXAMPLE


    If you''re like most people who are new to a subject, you learn best by following
    clear, concise examples. The by Example series follows a logical, linear teaching
    progression, taking you through small, gradual steps that enable you to see the
    big picture of what you are learning.


    +   * Learn how to build your scripts with variables, arrays, functions, and how
    to interpret regular expressions.

    * Discover how to manipulate processes and use high-performance coprocessors.

    * Control the flow of logic within your script and use filters to isolate particular
    data.

    * Troubleshoot and bulletproof your scripts through debugging and error trapping.


    Chapters include not only Tips, Notes, and Cautions, but also summarize the chapter
    information into perspective. The examples help you learn and eventually master
    the fundamentals of Korn Shell scripting by showing you simple applications of
    core programming concepts and features. By the end of Korn Shell Programming by
    Example, you will know everything you need to write effective scripts using Korn
    Shell 93.


    +   * Understand how to use the object-oriented discipline functions to streamline
    your code.

    * Covers Korn Shell 93, which is freely available on the Web for personal use.
    The author points out areas of incompatibility with earlier releases of the Korn
    Shell.


    Dennis O''Brien is a co-owner of the Bruden Corporation. He started working in
    the computer industry in 1972, began working with and delivering training on OpenVMS
    in 1983 with Equipment Corp., and has been providing UNIX training and development
    since 1989 with Vastek Co. and Bruden Corp. He was a co-founder of the Vastek
    Company. He won five Excellence awards while working for Digital Corporation.
    He provides training and development in UNIX from user to internals level. He
    also provides training in OpenVMS and C programming languages.


    | Category | Programming |

    |---|---|

    | Covers | Korn Shell 93 |

    | User Level | Beginning—Intermediate |


