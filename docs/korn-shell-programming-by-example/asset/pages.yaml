  md: "# alias\n\n# Official Description\n\nDefines or displays aliases.\n\n# Syntax\n\
    \nalias [-t] [alias-name=string...]\n\n# Options\n\n-t establishes a tracked alias,\
    \ providing faster alias translation. Allowed only if the trackall shell is set\
    \ (set -h or set -o trackall).\n\n# Oddities\n\nSome implementations provide a\
    \ -x option, enabling the exporting of aliases. This also enables aliases to be\
    \ accessible in subshells.\n\nSome implementations provide a -p option, which\
    \ causes the word \"alias\" to appear before each alias name displayed.\n\nAliasing\
    \ is performed when scripts are read, not while they are executed. Therefore,\
    \ for an alias to take effect, the alias definition command must be executed before\
    \ the command that references the alias is read.\n\nAliases can be used to redefine\
    \ special built-in commands but cannot be used to redefine the following reserved\
    \ words: if, for, case, then, while, esac, else, until, function, elif, do, select,\
    \ fi, done, time, { }, and [ ].\n\nAlias processing is performed after the reserved\
    \ words listed previously processed.\n\nC shell alias command does not use the\
    \ = in its syntax.\n\n# Example\n\n```\n$ alias # Red Hat Linux ksh93 alias list\n\
    2d='set -f;2d'\nautoload='unset -fu'\ncommand='command '\nfc=hist\nfloat='unset\
    \ -E'\nfunctions='unset -f'\nhash=alias -t --\nhistory='hist -l'\ninteger='unset\
    \ -i'\nll='ls -la\nnameref='unset -n'\nnohup='nohup \nr='hist -s'\nredirect='command\
    \ exec'\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_337_0.png)"
