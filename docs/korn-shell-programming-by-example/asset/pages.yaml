  md: "# Defining and Using Traps 277\n\nThe following example uses a SIGNAL trap.\
    \ It traps the signal sent when the user presses Ctrl+\\ and reports how many\
    \ files have been created at this point in the run. It traps the Ctrl+C signal\
    \ and reports the total number of files created before it exits the script. Note\
    \ that this is the only way the script is designed to exit.\n\nThe keywords QUIT\
    \ and INT can be replaced with the numbers 3 (for QUIT) and 2 (for INT). See kill\
    \ -1 output for other signals.\n\n![](img/de6a3b5a3b516159c825f1c10314d877_292_0.png)\n\
    \n```\n$ cat makem\n#! /bin/ksh\ninteger count=0\ntrap 'print \"Made $count files.\"\
    \ QUIT # Trap+\ntrap 'print \"Exiting...\"\\nsleep 2;print \"total files made\
    \ is $count\"; exit' INT # Trap+\n\nwhile : # Infinite while loop\ndo\n  > file$count\
    \ # Create file1,file2, ...\n  count=count+1\ndone\n$ pwd\nhome/obrien/lotsfiles\n\
    $ makem\nMade 3083 files. # Ctrl+\nMade 4661 files. # Ctrl+\nExiting... # Ctrl+C\n\
    total files made is 5311\n$ ls | wc -1 # Count of files\n5314\n```\n\nThe following\
    \ example uses an EXIT trap. This is the same makem script used earlier, but with\
    \ an EXIT trap included. The trap calculates a number representing half of the\
    \ count of files just created. It then presents that number as a parameter to\
    \ a dot script removed. The result is that it creates a bunch of files and then\
    \ deletes the lower-numbered half of them.\n\n```\n$ cat makem\n#! /bin/ksh\n\
    integer count=0\n```"
