  md: '# Miscellaneous Commands


    Tables B.3–B.5 list some other commands I have found useful. Be aware that there
    are many outroughs from the vi editor. Additionally, many other powerful features
    are not covered in this tutorial that are in the standard vi editor.


    Table B.3: Other useful commands


    | Command | Description |

    | --- | --- |

    | xp | Transposes two characters |

    | . | Repeats the last activity |

    | J | Joins the current line with the next line |

    | - | Changes the case of a character |

    | 10- | Changes the case of the next 10 characters |

    | >> | Moves the line about 8 characters to the left |

    | << | Moves the line about 8 characters to the right |

    | Ctrl+G | Displays filename, line number, counts, and so on |

    | :r file | Reads another file into the end of the work buffer |

    | :or file | Reads another file into the front of the work buffer |

    | :w newf | Writes the current contents to a file named newf |

    | :w! file | Overwrites the existing file |

    | :w>> file | Appends to the existing file |

    | :sh | Creates a shell session and exits to vi |

    | !comm | Executes a shell command |

    | !!comm | Executes a command and output goes into the file (you might need to
    use :r command in some implementations) |

    | :2!comm | Replace line 2 with output from the command |

    | rc | Replaces the character under the cursor with a |

    | R | Replaces characters until escape |

    | mz | Marks the current position with the letter z |

    | ''z | Returns to the position marked z |

    | d''z | Deletes from the current position to z |


    As I promised earlier in the chapter, Table B.4 summarizes some of the commonly
    used ed commands.'
