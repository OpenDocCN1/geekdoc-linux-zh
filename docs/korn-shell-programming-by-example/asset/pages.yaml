  md: "# Bulletproofing\n\n283\n\n```\nu=v\nv=r\ndone\nprint $u # Returns value to\
    \ caller of function if function\n} # called using $(gcd ...) syntax\nfunction\
    \ syntax {\n # Function to report incorrect syntax\nprint -u2 Usage: \"${codename##*/}\
    \ {integer_1} {integer_2} ...\"\nexit 1 # Remove large left pattern up to last\
    \ /\nncodename=$0\n((# < 2)) && syntax # Check if count of args < 2, call syntax\n\
    G=0\nfor f\ndo # Loop using command args\nG=$(gcd G f) # Call gcd function with\
