    The next two examples show initializing and assigning values to two new variables:


    ```

    $ typeset Program=$0

    $ typeset host=''hostname''

    ```


    The following example (note, this does not work in Linux or any ksh earlier than
    93 because they do not recognize the -F attribute) makes salary floating-point
    variable that prints two spaces after the decimal point:


    ```

    $ typeset -F2 salary

    ```


    Throughout this book, if an alias for a typeset is available, it usually is used
    because it is easier to remember (and tends to be a little more cross-platform
    friendly).


    # Four Common Errors


    You should watch out for four common errors when assigning and accessing variables.
    These errors do not necessarily produce syntax errors, which make them an even
    worse enemy.


    The first common error is accessing the variable incorrectly. The following example
    shows this error:


    ```

    $ WIFE=Dana

    $ echo $WIFE

    Dana

    $ WIFE=Computer

    ksh: Dana=Computer: not found

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_93_0.png)


    More than likely, the previous example is an attempt to set the name WIFE equal
    to Computer. However, with the dollar sign there, the shell returns the value
    of WIFE and is left with Dana=Computer, which is not correct. If the value of
    WIFE were not previously set, a slightly different error would occur, as shown
    in the next example:


    ```

    $ WIFE=Dana

    ksh: =Dana: not found

    ```'
