    # Filters


    We are often called on to filter the barrage of visual input we face every day.
    Depending on your nature, you might have filtered out the view of most of the
    oddly shaped and sized folks at the public beach last summer. After this filtering,
    you were left with a few choice items upon which you wanted to spend some processing
    time.


    The Korn Shell provides many mechanisms for filtering data. You probably recognize
    some of these mechanisms as commands you use everyday. But most likely you don''t
    usually consider the fact that the following are all filters: head, tail, grep,
    awk, sed, wc, tr, sort, uniq, more, cat, and so on.


    What is the common thread that binds the previous list together as filters? They
    all expect their input from standard input (stdin) and place their output on standard
    output (stdout). This seemingly innocuous characteristic can become a very powerful
    tool in the hands of a skilled Korn Shell user or script writer.'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'Filters are particularly useful in a pipeline of commands. Pipes are one of
    the distinguishing features of UNIX shells. The basic idea is that the output
    of one command is piped to another command as its standard input. Thus, filter
    commands are important components of pipelines. Think of a plumbing pipe with
    threads on each end. UNIX processes threaded onto each end of the pipe. The image
    is even better if you lift the left end of the pipe up a bit, so the information
    can flow in only one direction. Now you''ve got the correct picture of a pipe.
    It is a unidirectional communication channel between two processes in which the
    left process presents its output to the right process as input.


    ![](img/de6a3b5a3b516159c825f1c10314d877_181_0.png)


    Figure 7.1: A pipe enables the unidirectional communication of information between
    one process and another.


    You can have multiple pipes in a command line. This promotes a toolkit philosophy
    of command interface. So you can tinker with pipes and cobble together a single
    command that accomplishes what would normally take a program or a script to accomplish.
    Eventually you could assign an alias to your pipeline to reduce your typing and
    have a convenient name which to remember it. The following example sorts an ls
    output based on file size and


    ```

    $ ls -l

