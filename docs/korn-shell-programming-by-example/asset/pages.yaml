    Have you ever wondered UNIX has no delete command? Sure, but what do the letters
    "rm" stand for? They stand for "remove," meaning remove a link. The rm command
    decrements the link count in a file metadata by one. If the link count is down
    to 0 by the rm command, the storage used by the file is free.


    Hard links, however, have limitations. They cannot be used to represent a directory,
    and can be used only within a file system. A UNIX system can have many file systems.
    Each file system has its storage locations and characteristics. You can see your
    machine''s currently available file systems by examining the output of df


