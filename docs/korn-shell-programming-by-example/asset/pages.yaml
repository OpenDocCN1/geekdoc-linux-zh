  md: "Essentially, the newer style of loop consists of a set of double parentheses\
    \ semicolon-separated statements. The three statements are the initializer, which\
    \ is executed once; the test, which causes the loop body to execute if it evaluates\
    \ to true; and the iteration, which can be used to increment (or decrement) a\
    \ variable. The syntax is as follows:\n\n```\nfor (( initializer_command; test;\
    \ increment_or_decrement ))\n  do\n    command(s)\n  done\n```\n\nThe following\
    \ example uses the newer for syntax to keep track of the time so that the dancer\
    \ knows when to leave the prom:\n\n```\n$ galoshes5\n! /bin/ksh\ntime_to_leave=\"\
    no\"\ninteger time=0\nset -A dances tango lambada twist chacha chacha stroll #\
    \ Array of dances\nuntil [[ $time_to_leave == 'yes' ]]\n  do\n    for (( hour=8;\
    \ hour<12; hour++ )) .. # New (ksh93) for loop format\n      time=hour-8\n   \
    \   print -n \"At $hour o'clock *\"\n        print \"left\"\n        print \"\
    right\"\n        print \"I'm dancing the ${dances[$time]}\\n\"\n    done\n   \
    \ time_to_leave=\"yes\"\n  done\nprint 'Time to leave'\n$ galoshes5\n```\n\nExecute\
