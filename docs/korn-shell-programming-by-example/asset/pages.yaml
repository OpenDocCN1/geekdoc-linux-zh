    ```


    # Edit Session Recovery


    If you are in the middle of an edit session when the system crashes, or some other
    event happens that abnormally terminates your edit session, vi provides a way
    to recover most of your work. When the system comes back up, you can type vi -r
    to see whether any recovery files are available. If so, type vi -r filename and
    save the recovered work immediately.'
