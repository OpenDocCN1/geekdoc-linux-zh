  md: '# Array


    8

    9

    (This continues ad infinitum or until Ctrl+C is pressed!)


    The shell automatically sets the undefined z to have a value of zero. Notice that
    the script will still run forever and that no error is ever produced.


    # Array


    A simple definition for an array is that it is a single variable (varname) that
    can store one or more values. The Korn shell has two types of arrays: indexed
    and associative.


    In an indexed array, each element of the array is indexed with an arithmetic expression.
    The index is valid as long as the value of the arithmetic expression is at least
    zero. The upper value of the arithmetic expression is dependent on the implementation,
    but in all versions of Linux and UNIX, it is at least 4,095.


    # NOTE


    On a sample Red Hat Linux 6.1 system, a simple program to increment an indexed
    array had a memory fault after 13088. This means that 13,088 values were stored
    in one array before a memory error caused the system to crash the program.


    In an associative array, the subscript is an arbitrary string, such as "Yankees",
    "Red Sox," or "Tigers."


    # Declaring


    Associative arrays must be declared with typeset -A:


    ```

    $ typeset -A Alteams # values will be integers

    $ Alteams[''Yankees'']=92

    $ Alteams[''Red Sox'']=88

    ```


    An indexed array does not have to be previously declared. The program knows or
    wants to specify the maximum size of an indexed array, he can use the typeset
    -u variable[n] command, where n is the upper bound of the array and variable is
    the name of the array, as seen in the following example:


    ```

    typeset -u children[2]

    ```


    There are two ways of assigning values to array elements, and there are two ways
    of accessing arrays. These are explained next.


    ![](img/de6a3b5a3b516159c825f1c10314d877_96_0.png)'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Assigning—Two Ways


    The first way of assigning a value to an array is similar to what would be done
    with scalars. Just as a scalar is a variable name with a single value associated
    with it, an individual array element is treated as a scalar. Using an array name
    without an element number in square brackets is the equivalent of referencing
    the zero element of the array. The syntax is varname=value, as shown in the following
    example:


    ```

    $$ Children="Meshia"

    ```


    This example looks identical to a scalar. It could also have been written like
    this:


    ```

    $ Children[0]=\Meshia"

    ```


    The arithmetic expression inside the square brackets indicates which array element
    is being referenced. In most computer languages, including shell programming,
    indexes begin with the zero value. Therefore, Children[2] is actually a reference
    to the third indexed value of Children.


    The second way of assigning a value to an array is to assign multiple elements
    at the same time. The syntax is set -A varname value1 value2 ... , as shown in
    the following example:


    ```

    $ set -A Children Meshia Andy Tommy

    ```


    > NOTE

    In shells, as bash, it is written slightly differently and looks like this:

    Children=(Meshia Andy Ashley Tommy)


    The following are a couple of items to note:


    +   * The arithmetic expression used for the index must be a positive integer.
    This means that it cannot be negative, nor can it have a decimal point.

    * The term arithmetic expression means that the value does not have to be a number,
    but can be a variable or even an equation, as long as the result of the expression
    is a positive integer.


    The following two examples show using a variable for the index when assigning
    a value to an array:


    ```

    $ Cmd[x]="hostname"

    $ Cmd[x]="uname"

    ```


    These two examples are part of the CHECKIT program used in Chapter 13, "Pulling
    It All Together."


    ![](img/de6a3b5a3b516159c825f1c10314d877_97_0.png)'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Accessing—Two Ways


    Now that some values are assigned to the arrays, the next question becomes how
    to access the values. Both indexed and associative arrays are accessed the same
    way. Just as there are two ways of assigning values to arrays, there are also
    two ways of accessing those values.


    The first way of accessing the value of an array is with the following syntax:


    ```

    ${varname[index or string]}

    ```


    The following example uses the Children array assigned earlier and returns one
    of its values:


    ```

    $ echo ${Children[2]}

    ```


    Ashley


    ![](img/de6a3b5a3b516159c825f1c10314d877_98_0.png)


    The second way of accessing the value of an array is to access more than one value
    at a time. Two characters can be placed in the index portion of the command that
    allows this. These are shown here:


    ```

    $ echo ${Children[*]}

    ```


    Meshia Andy Ashley Tommy


    ```

    $ echo ${Children[0]}

    ```


    Meshia Andy Ashley Tommy


    You are thinking, and rightfully so, that these two commands produce the same
    output. The difference would have existed if one or more of the values had contained
    spaces. To further explain this, we will set up a new array for Children:


    ```

    $ Children="Meshia Davidson"

    ```


    ```

    $ Children[1]="Ashley Davidson"

    ```


    Now, if the array is accessed, a slightly different output is produced:


    ```

    $ echo ${Children[*]}

    ```


    Meshia Davidson Ashley Davidson


    ```

    $ echo ${Children[0]}

    ```


    Meshia Davidson Ashley Davidson


    In most versions of UNIX, the echoing of the children with the * produces four
    items. In contrast, in most versions of UNIX, the echoing of the children with
    the @ produces two items, as shown in the previous example. Linux''s version of
    the Korn shell, however, produces four items either way.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Read-Only


    The shell provides a way of making a variable read-only. After a variable declared
    as read-only, its value cannot be changed. This is shown in the following-example:


    ```

    $ Children-Meshia

    # readonly Children # Sets the readonly attribute

    # on the Children variable

    echo $Children

    Meshia

    $ Children-David

    sh: Children: is read only

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_99_0.png)


    You cannot have any more children because when an attempt to change its value
    occurred, the shell produced an error and would not allow the value associated
    with Children to change.


    This brings an interesting problem. If a value is set, such as when you assigned
    multiple children to the varname Children, how can it be changed? Better yet,
    when a variable has been set to readonly, how do you get rid of it?


    This is addressed next through the use of the unset command.


    # Unsetting


    When going through the examples earlier in the chapter, the variable Children
    was used several times. What was not shown was the command that run in between
    to free up that so it could be used again. Here is a more complete listing of
    commands to let you see what was really going on:


    ```

    $ echo ${Children[*]}

    Meshia Andy Ashley Tommy

    $ unset Children

    echo ${Children[*]}

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_99_1.png)


    $ As you can see from the previous code, the unset command is followed by the
    variable to be freed. If the variable''s value is not freed from memory, it cannot
    be set to something else. But, what about when you made Children a read-only variable?
    How do you get rid of it?


    The quick answer is that you cannot. If you could, it would go against the basic
    idea of identifying the variable as crucial and unchanging.'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# What''s Next


    The long answer is that the variable will remain as long as the shell or program
    environment of which it is a part exists. Therefore, a variable that is set as
    a part of the environment, such as KSH_VERSION in the following example or the
    variable Children that you set earlier to readonly, remains part of the environment
    until that environment goes away:


    ```

    $ readonly # Displays all readonly variables

    Children

    KSH_VERSION

    ```


    If a new environment is instantiated, that new environment will not have the variable
    Children. It will have the variable KSH_VERSION instead because it is set with
    each new login. This is shown in the next example:


    ```

    $ su - dennis

    Password:

    $ readonly

    Children

    KSH_VERSION

    ```


    When the environment in the previous code is exited, and the previous environment
    is back in control, the read-only variable Children again


    ```

    $ exit

    $ readonly

    Children

    KSH_VERSION

    ```


    After the environment that contains the variable Children is terminated, the variable
    is released from memory.


    # What''s Next


    As a summary, what can I say? We started out in first grade with


    + 3 = 5


    advanced to defining what went in place of the blank space with a variable. Along
    the way, we looked at how to assign and access the two types of variables allowed
    in shell programming—scalars and arrays.


    Remember, if a variable is read-only, do not attempt to change it; just put your
    keyboard down and back away slowly!


    In Chapter 4, “Regular Expressions,” you look at one of the most powerful ways
    of manipulating values. You explore regular expressions and delve into pattern
    matching.'
