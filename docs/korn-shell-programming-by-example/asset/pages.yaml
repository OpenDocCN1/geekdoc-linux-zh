- img_proc: true
  md: '# Chapter 2: Process Control


    $ jobs

    jobs

    [1] + Stopped (tty output) man man

    [3] - Stopped more .Xdefaults

    [2] - Done 1ls -la /usr |

    Stopped


    Originally, when job number one (man man) was run, it was suspended showing the
    command man. Remember showing the first page of the man page puts it in the background
    and stops its execution. Also note that the man command uses the more command
    (or a more-like-command) to display text on the terminal in a controlled fashion
    (pressing the spacebar shows the next page, Enter the next line, the slash searching,
    B brings you back a page, F brings you forward a page, G takes you to the end
    of the file, IG takes you back to the beginning of the file, and ? gets a help
    display). When you bring the process back into the foreground, it picks up where
    it left off displaying the next page of text.


    The following example brings job number one to the foreground:

    $ fg %1


    When the spacebar is pressed, the more command associated with the man command
    displays another page of text from the man pages describing the man command. After
    the command has finished, it is removed from the process list and from the job
    list. The new jobs listing shows this:


    ```

    $ jobs

    [3] + Stopped more .Xdefaults

    [2] - Done 1ls -la /usr |

    ```


    Notice that the previously most current job is now the current job and a new previously
    most job is assigned.


    Just like the bg command, the fg command can be used to start up any of the stopped
    jobs in the jobs list. Additionally, it brings the job to the foreground, which
    provides convenient terminal interaction. The fg command uses the same parameters
    as the bg command. Either the plus or minus (-) symbol is used, and %job_number
    is used to indicate which job to continue execution in the foreground, where job_number
    is the bracketed number from the jobs command output.'
