    \ of %d is %d\\n\" $1 $res\nreturn 0\n$\n$ ls autofuncs # Autoload directory\n\
    factorial\n$\n cat autofuncs/factorial # Function factorial is in autoload directory\n\
    function factorial\n{\ninteger ret_val=0\ninteger factarg=0\n\nif (( $1 <= 1 ));\n\
    then\n  res=1\n  return 0\nelse\n  (( factarg = $1 - 1 ))\n  factorial $factarg\n\
    \  (( ret_val = $1 * $res ))\n  res=$ret_val\n  return 0\nfi\n}\n$\n recurse!\
    \ 5\nrecurse: line 5: function: not found # Shell must know autoload directory\n\
    $\n print FPATH\n\n$ FPATH=/home/obrien/scripts/autofuncs # Set FPATH variable\n\
    $\n recurse!\nrecurse: line 5: function: not found # Must be exported\n$ export\
