  md: 'As an example, let''s look at the sqrt function. This returns the square root
    of its argument. Let''s see, 9 times 9 is 81, right? So the square root of 81
    should be 9. But let''s make it a bit more difficult for the sqrt function. Let''s
    ask it to figure out the square root of 82. The answer should be over 9, right?
    But how will the shell deal with the fractional value? Let''s see. This example
    uses the sqrt math function and also introduces the new floating-point capabilities
    within ksh:


    ```

    $ (( z=sqrt(82)))

    $ print $z

    9.0553851384

    ```


    Pretty slick, huh? You can declare a variable to be floating point using the typeset
    command or the float command:


    ```

    $ typeset -f f3=4.5 # Declaring a float

    $ print $f3

    4.5

    $ float f4=5.4 # Alternative float declaration

    $ print $f4

    5.4

    $ let tot=f3+f4 # Variable tot holds float result

    $ print $tot

    9.9

    $ (( trunc=int(tot )) # Use int function to truncate tot

    $ print $trunc

    9

    ```


