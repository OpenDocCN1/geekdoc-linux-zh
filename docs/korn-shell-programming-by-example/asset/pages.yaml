    and it is any month of the year, and it is the 0 day (Sunday) of the week. |

    | 42 1 * * | run-parts /etc/cron.monthly | Run this command if it is the 42nd
    minute of the hour, and it is the 4th hour past midnight, and it is the 1st day
    of the month, and it is any month of the year, and it is any day of the week.
    |

    | */10 **** | /sbin/rmmod -as | Run this command if the minutes past the hour
    can be evenly divided by 10, and it is any day of the hour, and it is any day
    of the month, and it is any month of the year, and it is any day of the week.
    |

    | 0,10,20,30,40,50 * **** | /sbin/rmmod -as | This is the same as the previous
    example,but the minutes are explicitly given instead of using the division. |

    | 13 ** 1-5 | find $HOME -name nohup.out 2>/dev/null | xargs rm -f | Run this
    command if it is 15 minutes past the hour, and it is 3 hours past midnight, and
    it is any day of the month, and it is Monday, Tuesday, Wednesday, Thursday, or
    Friday. |

    | 0,12-15,27-30 * 21 12 * | /do/something/to/remind/me/of/my/wife''s/birthday
    | Run this command if it is 0 minutes, 12 to 15 minutes, and 27 to 30 minutes
    past the hour, and it is any hour, and it is the 21st day of the month, and it
    is the 12th month of the year, and it is any day of the week. |


    It is improper to edit the cron file directly. The proper way of adding a cron
    entry to the crontab file is by using the -e option to the cron command. The -e
    option makes a copy of that user''s cron file (or creates a new one if one does
    not exist), and brings it up in the default editor. When the user exits of the
    file, it replaces the original file with the edited one and notifies the cron
    daemon (also called cron) that a new cron file is in place.


    The cron daemon then re-reads the file. If the crontab file is edited directly,
    the cron daemon does not get information of this, and then it continues to read
    the crontab file it has cached in memory. This means the changes would be ignored.'
