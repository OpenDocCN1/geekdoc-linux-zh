    \ This is shown here:\n\n```\n$ cd /opt\n$ nohup sleep 10000\n/usr/bin/nohup:\
    \ nohup.out: Permission denied\nnohup: appending output to `/home/shell/nohup.out'\n\
    ```\n\nBecause the process runs in the foreground, the user does not have access\n\
    to the shell. This process is a fine candidate for the ampersand to place it in\n\
    the background.\n\n# Scheduling Jobs\n\nTwo utilities are available to manage\
    \ job scheduling. Which utility user\nchooses depend on what he is trying to accomplish.\
    \ The first utility\nis cron. The cron utility is used to schedule events that\
    \ will occur repeat-\nedly at a fixed time. The second utility is at. At the utility\
    \ is used to sched-\nle events that will occur only once. I explain each of these\
    \ utilities in\nthe next sections.\n\n# cron\n\nCommands, including scripts, can\
    \ be set to run on a schedule. This sched-\\allows fine-tuning for any combination\
    \ of minutes, hours, day of the\nmonth, month, day of the week. The cron file\
    \ contains crontab\nentries. A crontab entry is one scheduled event. The following\
    \ is the syntax\nof a crontab entry for a Linux system:\n\n```\n1 2 3 4 5 user\
    \ command\n```\n\nFor a UNIX system it is\n\n```\n1 2 3 4 5 command\n```\n\nEach\
    \ number corresponds to the time entries previously mentioned (min-\\utes, hours,\
    \ day of month, month, day of week). The following table\ndescribes each of those\
    \ times and gives the valid entries for each."
