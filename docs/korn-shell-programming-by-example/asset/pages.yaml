- img_proc: true
  md: '# Chapter 4: Regular Expressions


    dment, cheryl c

    $ sed \1,$s/\/([^,]*\),,\(.*)/\2/'' names

    dennis m obrien # revised output

    bruce a ellis

    cheryl c dement


    This one can give you a headache pretty quickly. Take your time and make sure
    you understand each of my explanations before you move to the next part of the
    pattern. First of all, it is a stream request (sed) to be applied to the contents
    of the file named names. The entire edit request is placed in a set of apostrophes
    to make sure the shell keeps its hands off of it (no filename expansion or other
    shell interpretations). The edit should be presented to sed as it exists on the
    command line.


    The edit can be broken into two pieces. The first part indicates which lines should
    be edited. The \,$ indicates from line to the end of the file. The second part
    indicates that there should be a substitution(s) of the pattern between the first
    pair of slashes, with the pattern between the second pair of slashes. The trouble
    comes when trying to pick out the slashes!


    If the request were s/a/b/, it would be pretty to pick out the slashes. With the
    more complex edit, your eyes are deceived into seeing tepees and other bizarre
    constructs. The first slash is after the s; the second slash is before the \2;
    and the third slash is at the end. Draw over three slashes with your pen to make
    them obvious. Therefore, the substitution says to take the stuff between the first
    pair of slashes and replace it with the stuff in the last pair of slashes. (The
    slash is in both pairs.)


    The last pair of slashes encompasses a \2 sequence. These represent back references
    to the second pattern of matched data (\2), and the first pattern of matched data
    (\1). Now you want to know what was the first pattern of matched data, don''t
    you? The first pattern is represented by \([^]*). Focus on the \^ and the \).
    They surround what matched data should go in back reference number one. The square
    brackets indicate a single character match; the ^ inside the square brackets says
    match any characters other than what is in the square brackets; and the asterisk
    after the brackets means multiple instances of the previous match. So, it gathers
    all characters on the line up to a comma in back reference location number one.'
