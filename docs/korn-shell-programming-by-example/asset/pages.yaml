  md: '# 3


    # Variables


    When I was in first grade, my teacher gave us this problem:


    _ +3 = 5


    As a budding mathematician, my job was to figure out what number went in the blank
    space. When I was in ninth grade, my algebra teacher gave us the following problem:


    X + 3 = 5


    As a budding mathematician, my job was to figure out what number the X represented.


    Now that I am older and wiser, I have moved away from such nonsense. Today, I
    know that it was wrong to use X because it has no meaning. I know that the problem
    should have been written something like this:


    Number_Of_Oranges + 3 = 5


    As a budding programmer, I have learned that the use of descriptive variables
    is better than either a blank space or an X.


    In all three examples—blank space, X, and Number_Of_Oranges—what is really happening
    is that a variable is put in place of a value. We know, because we have been doing
    this since first grade, each of these variables has the value of 2.


    This chapter talks about variables. It explores the various types of variables
    allowed in shell programming and shows how to set and unset the variables. Along
    the way, some common errors are pointed out.


    This chapter teaches you the following:


    +   - How to use variables in a script


    +   - How to use the typeset command


    +   - How to avoid common errors with variables'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Case Sensitivity


    The basics of variables were discussed in Chapter 1, “The Environment.

    In review, a variable is simply a way of expressing a value with a name. Hence,
    variables are called name-value pairs. When designing your own variable, you should
    keep a number of things in mind. The first is case sensitivity.


    Case sensitivity means that—uppercase and lowercase—each letter in the varname
    is significant. Therefore, two variables can look alike, but if one or more of
    the letters is a different case in one of the variables then they are two different
    variables.


    For example, each of these is a different variable:


    +   - Apple APPle APPle APLE APPLE

    - apple apple apple appLE appLe

    - Apple APPLE Apple APLE APPLE


    Some standards in programming concerning uppercase and lowercase are probably
    wise to follow. You might remember from Chapter 1 that environment variables are
    conventionally (but not necessarily) all uppercased. As an example, here are two
    environment variables shown in Chapter 1. A shell variable that is exported becomes
    an environment variable, whether it is uppercase or not:


    ```

    PS1=$$

    PATH=/usr/local/bin:/bin:/usr/bin:/usr/X11/bin:/usr/X11/bin

    ```


    Other variables, such as the ones you use to program, should be all—or at least—lowercase.
    A simple rule when naming a variable is that its name should be as descriptive
    as its value is important. Therefore, a temporary variable used to hold a value
    or as a counter could have a name as simple as counter or even x. Another simple
    rule to remember is that the program you code can be the program you have to change
    six months from now—so do yourself a favor and name the variables wisely! Variable
    names should document their purposes.


    ![](img/de6a3b5a3b516159c825f1c10314d877_89_0.png)


    # Valid Characters


    Part of naming variables wisely knowing which characters are valid characters
    to be used in the varname. Valid characters for varnames are'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'the letters of the alphabet (both upper- and lowercase), numbers, and the underscore
    character. One caveat is that the varname cannot start with a number. For example,
    consider the following varnames:


    +   - Peaches

    - 2Peaches

    - PeachesAndCream

    - Peaches4

    - _Peaches


    The second is not a legal varname, but the rest are. Notice that the last example
    begins with an underscore, which is valid. The second one is not valid because
    it begins with a number.


    # Scalar


    Two types of variables exist in the Korn shell. The first is a string; the second
    is a number. Of the numbers, two types are: integers and floating-point. Most
    Korn shell implementations support integer numbers only. Korn shell 93, however,
    supports floating-point numbers. *Integers* are whole numbers, such as 14 and
    -999. *Floating-points* are numbers that can contain a fraction, such as 3.14159
    or -99.54.


    A *scalar* is your basic name-value pair that has been discussed in this book.
    A scalar has a varname and a value. That value can be accessed and assigned by
    the programmer, as is shown in the next two sections.


    # Accessing


    To this point, the discussion has indicated that a variable has a value. The question
    therefore becomes, how do you access the value of the variable? Fortunately, the
    answer is simple. The dollar sign ($) preceding the variable name is used to access
    the value of the variable.


    As an example, look at the following work that was done at the command line:


    ```

    $ echo PS1

    PS1

    echo $PS1 # Displays the contents of PS1 which is the $

    ```


    The command echo is used to show values. In the first line of the previous code,
    PS1 is echoed. Sure enough, when the dollar sign is placed before the varname,
    $PS1, the shell returns the value associated with the variable PS1 (PS1 means
    prompt number one).


    ![](img/de6a3b5a3b516159c825f1c10314d877_90_0.png)'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Assigning


    Assigning a value to a varname can be accomplished by placing an equal sign between
    the varname and the value. A space can''t exist either before or after the equal
    sign. Although you might not have thought about it, you have already seen the
    assigning of variables in action when you looked at the .profile file in Chapter
    1. Here are some examples from that file:


    ```

    HSIZE=1000

    HISTSIZE=1000

    ```


    If a space is used in the value, the value must be placed within quotes, as seen
    in the following examples:


    ```

    KSH_VERSION=''@(#) PD KSH v5.2.14 99/07/13.2''

    PS1=''''

    ```


    More on quoting is discussed in Chapter 5, "Quoting." In the following example,
    three variables are defined as integers:


    ```

    integer x=0

    integer y=1000

    integer Num=0

    ```


    # typeset


    The typeset command is used to define variables. Many variables have aliases that
    are actually typeset commands. For example, integer, from the previous section,
    is an alias for typeset -i. The syntax for typeset is typeset [+AlHprux][+-ELRZ[n]]
    [name=value]


    This command is used to set and unset attributes for variables, or to list the
    varnames and attributes of all variables.

    Table 3.1 lists many commonly used attributes and their meanings. Note that not
    all of these are compatible with all versions of UNIX/Linux. Some of these are
    specific to Korn Shell 93. Check the man pages for your distribution of UNIX/Linux
    for a complete listing.


    Table 3.1: Typeset attributes


    | Attribute | Meaning |

    | --- | --- |

    | - | Used to set attributes after setting value(s) |

    | + | Used to unset attributes after setting values |

    | -A | Associative array |

    | -E | Exponential number; $n$ specifies the significant digits |

    | -F | Floating-point number; $n$ specifies the number of decimal places (ksh
    93) |

    | -i | Integer; $n$ specifies the arithmetic base |

    | -1 | Lowercase |'
