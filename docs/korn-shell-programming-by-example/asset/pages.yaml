  md: '# Jobs and Processes


    When a script is run, the shell goes through several steps to begin the execution.
    Basically, the current shell opens the executable file, sees that it is a script
    (not a compiled and linked program executable), and creates a new process, running
    the shell indicated in the first line of the script file. If the script file does
    not have the # /bin/ksh in the first line, the current shell creates a process
    running the same shell program as the shell from which the script was executed.


    Most of what happens is internal and of no concern unless you are studying the
    kernel, in which case you may want a book on UNIX internals and C programming.
    From the scripter''s perspective, what happens is that a process is added to the
    system''s process table. The process contains several pieces of information that
    can be viewed by the ps command. The ps command has a wealth of options capable
    of producing many process statistics. A partial table is shown for reference.
    The -ef options reveal a display showing full information about every process:


    | UID PID PPID STIME TTY CMD |

    |---|---|---|---|---||

    | david | 6724 | 6702 | pts/2 | 00:00:00 | -ef |

    | david | 6725 | 6702 | pts/2 | 00:00:00 | -ksh |


    Seven columns (that we are interested in) are associated with a process as indicated
    by the first line of headers. There are, or can be (depending on your OS) other
    columns that provide additional information, but we are not concerned with those
    at this point. The meaning of the ps -ef columns presented here:


    +   - UID This is the user ID of the person who called the executable.


    +   - PID This is the process ID assigned to the process. This ID is unique to
    each process. More about this ID is discussed later in this chapter.


    +   - PPID This is the parent process ID. This is the process ID of the process
    that actually created the process you are examining.


    +   - STIME This is the time the process started.


    +   - TTY The terminal type is listed next. The pseudo-terminal (pts/#) contains
    the terminal number. This number indicates which pseudoterminal the user was using
    when he executed the command.


