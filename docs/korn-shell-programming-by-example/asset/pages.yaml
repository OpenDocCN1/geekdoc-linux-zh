  md: '# Chapter 6: Flow Control


    they are commands, although ∅ not exactly what you would call standard commands.


    The following example initializes the variable named x to the value of 5 and then
    executes some (( commands:


    ```

    $ x=5              # Set variable x to 5

    $ ((x=5))          # Test contents of x against 5

    $ print $?         # Show previous command status

    $0                  # Success (0), so x must = 5

    $ ((x=6))          # Is x = 6?

    $ print $?

    1                                  # Nope

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_135_0.png)


    Notice that the return status is 0 (success) for the first test and 1 (failure)
    for the second test. You won''t be doing tests using the technique in the previous
    examples. I''m trying to open the hood on the if test so you can peer into the
    engine of it.


    The following example uses more complete and standard syntax to perform a test:


    ```

    $ if ((x=5))

    > then

    > print ''Result is true''

    > fi

    ```


    Result is true

    $


    The (( command is actually a modernization of the let command. You won''t find
    many modern-day scripts performing if tests as follows:


    ```

    $ if let "x=5"

    > then

    > print ''result is true''

    > fi

    ```


    result is true

    $


    This can open the hood on string comparisons (the (( examples are doing arithmetic
    comparisons). String tests are surrounded by [[ instead of ( (. The syntax of
    the [[ command is similar to ((, but it ends to be a bit picky with respect to
    whitespace. Make sure that each item within the [[ ]] is separated from the others
    by at least one space. Note that in the arithmetic comparisons, you could use
    spaces or not; made no difference to the shell. It definitely makes a difference
    with the following string tests:'
