  md: "# Coprocess 201\n\ncommands at the interactive dbx prompt: p bolt and quit.\n\
    2>/dev/null syntax removes the display line starting with warning from the dbx\
    \ output by redirecting stderr. (And you thought that stderr redirection would\
    \ never come in handy, didn't you?) The tail -1 says that all you are interested\
    \ in is the last line of output, which you appended to the file named times.\n\
    \nIf you are thinking that you could use this same technique of piping the output\
    \ of a print (or echo) command to just about any interactive utility, you are\
    \ right. And I congratulate you for the thought. However, don't run off and start\
    \ changing your production scripts yet. Wait until you see the coprocess example:\n\
    \n# cat copro2\n!/bin/ksh\n\n```\n$ [ ! = 2 ] && {\\ # Display message if we don't\
    \ get two args\nprint 'Usage: $0 vmunix vmzcore'\nexit 1\n}\n# main loop\nntimes=0;\n\
    while (( ntimes < 50 )); do\nprint 'lbolt;quit' | dbx $1 2>/dev/null | tail -1>>times2\n\
    \ # Creates a process\ntimes=ntimes+1\ndone\nexit\n```\n\nThe next example uses\
    \ a coprocess running dbx to handle the 5 requests for the current value of the\
    \ kernel cell named innocuous-looking very powerful command is shown after the\
    \ usage help. It simply says >times. This looks as if you are trying to redirect\
    \ the standard output of, nothing, into the file named times. The shell sees the\
    \ >times, puts on its truncation halt, and chops the current contents of times\
    \ to zero bytes, which is what you wanted. This prevents an uncontrolled growth\
    \ of the output for each time the script is run. It also effectively deletes the\
    \ current contents of the file and reads it for subsequent processing.\n\nThe\
    \ line that actually starts the coprocess is dbx -k $1 $2 >/dev/null &. The key\
    \ syntax looks like a combination of a pipe request and a background request;\
    \ in fact, it uses facets of both activities. When a process is placed in the\
    \ background, it can coexist with the interactive shell—just as you want in this\
    \ example. In addition, when a process uses a pipe, it wants a means of communicating\
    \ with the piped-to process—which also is just what you want"
