  md: "# Built-In Extension Functions\n\nIf you have a hotshot C programmer (or if\
    \ you are one), you will be interested in this section. The Korn Shell has many\
    \ built-in functions. Some of we use repetitively without giving it any thought,\
    \ such as cd, print, umask, and typeset. A complete list of built-ins is at the\
    \ end of this section. What exactly are the built-ins built into? They are functions\
    \ (masquerading as commands) that are built into the ksh code. They do not cause\
    \ a new process to be created (as a command such as is would). Therefore, built-ins\
    \ have less overhead, and their use can improve the performance of your script.\n\
    \nWell, suppose you're interested in the improvement of speed, but the functionality\
    \ you want is not available in a currently built-in? In the UNIX tradition, you\
    \ can roll your own. The next example shows the creation of a home-grown extension\
    \ to the Korn Shell using the built-in extension capability. This example makes\
    \ a built-in named npid, which displays the PID of the parent process of the one\
    \ currently executing. It's not the most exciting example, but it will give you\
    \ the idea:\n\n$ getppid.c\n\n```\n#include <unistd.h>\n#include <stdio.h>\n#include\
    \ <stdlib.h>\nint b_ppid(int argc, char argv[]) # Function name must start with\
    \ b_\n{\n    printf(\"Parent PID is %d\\n\",getppid());\n    return(EXIT_SUCCESS);\n\
    }\n```\n\n```\n$ cc -c getppidfunc.c    # Produce an object file\n$ ls *.o\ngetppidfunc.o\n\
    $ ld -share -o .libppid.so getppidfunc.o    # Create a shared library\n$ builtin\
    \ -f .libppid.so ppid    # Register the new builtin\n$ ppid\nParent PID is 986\n\
    # Try it out\n$ builtin                                     # Show all builtins\n\
    ```"
