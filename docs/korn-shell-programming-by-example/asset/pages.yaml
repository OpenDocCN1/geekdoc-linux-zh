- img_proc: true
  md: 'Permissions use an additive process; therefore, a person with read, write,
    and execute permissions to a file would have a 7 (4 + 2 + 1). Read and execute
    would have a value of 5. Remember that three sets of values exist for user, group,
    and others categories), so each section would have its own value.


    Table 1.5 shows both the numeric system and the character system for the permissions.


    # Table 1.5: Numeric permissions


    | Permission | Numeric | Character |

    | --- | --- | --- |

    | Read-only | 4 | r - |

    | Write-only | 2 | -w- |

    | Execute-only | 1 | -x |

    | Read and write | 6 | rw- |

    | Read and execute | 5 | r-x |

    | Read, write, and execute | 7 | rwx |


    You can change permissions using the chmod command, which is explained in the
    next section.


    # chmod


    With the numeric system, the chmod command must be given the value for all three
    fields. Remember, the numeric system uses numbers to define permissions. The nine
    permissions (rwxrwxrwx) are represented as three series of three-bit fields. An
    on bit (set to 1) means the particular permission is present for this category
    of user (user, group, others) for this particular file. An off bit means the opposite.
    Often, you will see permissions of 777 used in a chmod command. Each 7 represent
    3 bits on, or rwx. Therefore, to change a file to read, write, and execute for
    everyone, issue the following command:


    ```

    $ chmod 777 <filename>

    ```


    The character system uses characters such as u for user, g for group, o for others,
    and a for all at once—as well the rwx to fetch permissions. To add a permission,
    use a (+); to remove a permission, use a minus (-). To perform the same task as
    the numeric example shown previously, with the character system, issue the following
    command:


    ```

    $ chmod a+rwx <filename>

    ```'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Of course, more than one type of permission can be specified at one time.

    The following command adds write access for the owner of the file and adds read
    and execute access to the group and everybody else:


    ```

    $ chmod u+w,og+rx <filename>

    ```


    The advantage that the character system provides is that you do not have to know
    the previous permissions. You can selectively add or remove permissions without
    worrying about the rest. With the numeric system, each section of users must always
    be specified. The downside of the character system is apparent when complex changes
    are being made. Looking at the preceding example, (chmod u+w,og+rx <filename>),
    an easier way might have been to use the numeric system and replace all those
    letters with three numbers: 755.


    # Coming Full Circle—Back to umask


    As you recall, the default umask on many systems is 022. Now that you understand
    the numeric system, it is easy to explain what this number means. When a non-directory
    file is created, the umask value is subtracted from 666 (directories subtract
    from 777) to come up with the default permission value to be assigned to the newly
    created file. Therefore, a umask of 022 makes the permissions of the file 644.
    This gives the owner read and write access, and gives the group and the rest of
    the world permission.


    When a new directory is created, the umask is subtracted from 777 instead of 666
    to set the default permissions. A umask of 022 would give a newly created directory
    permissions of 755. This means the owner has read, write, and execute permissions,
    while the owner group and the rest of the world have read and execute permissions.


    Now that you are starting to feel as if you understand permissions and their relationship
    to the umask value, you are ready to handle the truth. The subtraction technique
    described in the previous paragraphs will suffice in most situations. But what
    if the umask value is set to something like 027? What would the resulting file
    permissions be? How do you subtract a 027 from 666? Do we borrow one from the
    middle 6 as normal subtraction and put permissions of 639 (666-027) on any new
    non-directory files created?


    The truth is that bitwise one''s complement (described in the next paragraph)
    of the umask value is bitwise-anded (described in the next paragraph) with octal
    777 for directories or octal 666 for regular files to produce the default permissions
    placed on newly created files. (I''ll wait while you get off the floor.)'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# #—Comments Explained


    Are you ready? A umask of 027 is 000101111 in binary. The one''s complement of
    027 is 111011000 (just flip the bits—0s becomes 1s, and 1s becomes 0s). Octal
    666 is 110110110 in binary. A bitwise-AND operation analyzes each combination
    and produces a result of 1 if the bit on top AND the bit on bottom are both (1).
    The bitwise-AND operation produces a 0 otherwise. So, 111101000 bitwise-anded
    with 110110110 (666) yields 110100000, or 640, or rw-r-r----.


    111 101 000 (1''s complement of 027)


    110 110 110 (666)


    --- (bitwise and) ---


    110 100 000 (640 which is rw-r-r----).


    Feel free to erase the previous merriment from your memory banks. Most of the
    time, the good old subtraction method will work just fine for you. Most you know
    the truth about umask. You also know why the command is called “umask.” It is
    the file creation bitmask filter.


    The following example demonstrates the permissions on a newly created file given
    a umask value of 022. It then changes the umask to 027 and generates a different
    set of permissions for a subsequently created file:


    ```

    $ umask # Current umask value

    022

    $ touch newfile # Create empty file

    $ ls -l newfile # Check permissions

    rw-r--r-- 1 obrien users Oct Sep 27 20:22 newfile

    $

    n$ umask 027 # Alter umask

    $ touch newfile2 # Create another new file

    $ ls -l newfile2 # Note permissions

    rw-r-r---- 1 obrien users Oct Sep 27 20:23 newfile2

    $

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_34_0.png)


    # #—Comments Explained


    As you would expect, someone who has been a part of the writing of nine different
