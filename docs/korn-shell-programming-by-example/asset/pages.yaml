  md: "# Backup Loop Example\n\n```\n# Script to perform incremental\n# backups on\
    \ a daily basis with Sunday = 0\n############################\nPATH=$PATH:/usr/sbin\n\
    \    # Get the file system directory names\nfor fs_dir in $(df | sed -e 'id' -e\
    \ 's/.*/ //)\ndo\n    ### change /home/backup to appropriate tape/filename\n \
    \   fs_name=${fs_dir#root}\n    backup_loc=/home/backup_${fs_name}\n    blevel=$(date\
    \ +%w)\n    print \"****************************\\\"\n    print \"Starting level\
    \ blelevel backup of $fs_dir\"\n    # Do incremental backup\n    dump -${blevel}uf\
    \ $backup_loc $fs_dir\n    if [ $? -ne 0 ];\n    then\n        print \"Backup\
    \ of $fs_dir complete.\"\n    else\n        print \"Error backing up $fs_dir\"\
    \n    fi\n    print \"****************************\\n\"\ndone\n```\n\n```\n$ \n\
    $ su - # Become root\nPassword:\n[root@linden /root]#\n[root@linden /root]#\n\
    [root@linden /root]# ./.backemup # No dot in PATH for root\n```\n\n```\n****************************\n\
    Starting level 2 backup of /\nDUMP: Date of this level 2 dump: Tue Nov 21 02:16:31\
