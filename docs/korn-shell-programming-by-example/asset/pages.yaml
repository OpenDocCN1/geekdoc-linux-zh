    # cat


    The cat command is used to display the full contents of a file. The name “cat”
    comes from the little-used English word catenate, which is a synonym for concatenate.
    Basically, it concatenates the contents of the input file to the bottom of the
    output display (or output file).


    The following are some of the cat command’s options:


    +   -b—Displays the number of nonblank output lines

    - -E—Displays $ at the end of each line

    - -n—Displays the number of all output lines

    - -s—Squeeze; if multiple blank lines separate nonblank lines, never show more
    than one blank line in the output

    - -T—Displays Tab characters as ^

    - -v—Show nonprinting characters'
