  md: '# Chapter 7: Data Manipulation


    Some conditional tests are specific to strings:


    +   * if [[ str1=str2 ]]—True if strings are equal

    * if [[ str1 != str2 ]]—True if strings are not equal

    * if [[ str1 > str2 ]]—True if str1 is greater than str2

    * if [[ str1 < str2 ]]—True if str1 is less than str2


    # Testing Numerals


    If a variable holds a series of characters representing a number, specific tests
    exist should be used. If a variable has not been declared as an integer or a float,
    yet it contains numerals, the following syntax can be used for comparisons:


    ```

    exp1 -eq exp2 # exp1 is equal to exp2

    ```


    You can also use the following instead of -eq:


    +   * -ne—Not equal to

    * -gt—Greater than

    * -ge—Greater than or equal to

    * -lt—Less than

    * -le—Less than or equal to


    # Testing Numbers


    If the variables being tested have been declared as integers or floats, the following
    syntax can be used for comparisons:


    ```

    ( exp1 == exp2 ) # exp1 is equal to exp2

    ```


    You can also use the following instead of ==:


    +   * !=—Not equal to

    * >—Greater than

    * >=—Greater than or equal to

    * <—Less than

    * <=—Less than or equal to


    The following three tests are for comparing two files:


    ```

    [[ file1 -nt file2 ]] # Newer than

    [[ file1 -ot file2 ]] # Older than

    [[ file1 -ef file2 ]] # Is another name for

    ```'
