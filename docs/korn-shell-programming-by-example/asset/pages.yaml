    # Built-In Variables


    A number of built-in variables change as the environment changes. Specifically,
    the values change as commands are executed. The values of these variables hold
    information relevant to the current shell, the current process, or the most recently
    completed process. These are similar to shell variables, but the values are generated
    when the value is accessed. The following example shows this this. Notice that
    no error is generated:


    ```

    $ echo $0           # $0 contains command name

    -ksh

    $ set ø=Moose       # Reset upon access

    $ echo $0

    -ksh

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_43_0.png)


    The value is generated each time it is accessed, the previous command really did
    set the value of shell variable ø equal to Moose. But when you asked for it to
    be displayed, it was reset to the name of the current program, which is ksh (the
    shell itself). This is the reason no error was generated. Many of these variables
    can be used in scripts. Table 1.6 shows these variables and gives a brief explanation
    as to what each means.


    Table 1.6: Built-in variables


    | Variable | Explanation |

    |---||

    | $0 | Name of the command or script being executed. |

    | $n | Argument passed as a positional parameter (for example, n is a number between
    1 and 9) indicating which value is passed to the script from the command line.
    Arguments can exceed 9 if enclosed in curly braces—for example, $(14) indicates
    the 14th positional parameter. |

    | # | Number of positional parameters passed as arguments to the script from the
    command line |

    | * | A list of all command-line arguments. |'
