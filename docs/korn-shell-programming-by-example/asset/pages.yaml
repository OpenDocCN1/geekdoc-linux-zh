  md: '# Command-Line Arguments


    You have already seen several scripts using command-line arguments. As a script
    is started, the initiating shell searches for extra data on the command-line.
    Anything beyond the script name is treated as a command-line argument and is placed
    in shell variables. The shell variables used for command-line storage are named
    $1 (first argument), $2 (second argument), and so on. These are also referred
    to as positional parameters because the position of the argument determines the
    name of the shell variable into which it is placed. Table 8.1 provides a list
    of the positional and special parameters available to you within your shell script.


    Table 8.1: Positional and special parameters


    | Parameter | Meaning |

    | --- | Name of script, shell, or function. |

    | 1, 2, 3, and so on | Value of positional arguments. |

    | @ | All parameters delimited by space. If @ is quoted, quoted parameters are
    set to a single position. |

    | * | Same as $ except quoted arguments are separated by IFS. |

    | # | Number of command arguments. |


    The following example displays three positional parameters regardless of whether
    they are present on the command line. The curly braces ({ }) around the numbers
    are optional:


    ```

    $ cat params

    !/bin/ksh

    print "Argument 1 is ${1}"

    print "Argument 2 is ${2}"

    print "Argument 3 is ${3}"

    print "There are ${#} arguments."


    $ params O\''Brien Pitts Ellis

    Argument 1 is O''Brien

    Argument 2 is Pitts

    Argument 3 is Ellis

    There are 3 arguments.

    $

    $ params O\''Brien Pitts Ellis Dyment

    Argument 1 is O''Brien

    Argument 2 is Pitts

    Argument 3 is Ellis

    There are 4 arguments.

    $

    $ params O\''Brien

    Argument 1 is O''Brien

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_195_0.png)'
