    The shell script can be designed to accept options as well as parameters. Options
    are similar to the command options you use daily. For instance, -l is an option
    and file1 in ls -l file.


    The Korn Shell has a special getopt to ease the building of command-like scripts.
    Rather than having to build some special-case code into a script that wants to
    accept options on the command line, because Korn Shell is a top-notch shell, it
    provides a technique for handling them.


    A few steps are necessary to handle options. First, the script must recognize
    that it has been presented with an option, as opposed to a parameter. (-l is dealt
    with much differently than the file in the ls -l file command.) Second, the script
    needs a place to store the option presently under examination. Third, the script
    must be capable of handling multiple options (-li or -l -i for instance). Fourth,
    the script needs a way to handle options that have an argument associated with
    them, such as -f filename.


    The getopt built-in command enables you to process arguments as options, similar
    to UNIX commands. The getopt command expects two fundamental arguments: a list
    of the options to be supported within your script and a variable name in which
    to place the next argument.


    Options in the options list that are followed by a - are expected to accept an
    argument that will be stored in the variable OPTARG. This handles the previously
    mentioned situation in which you have an option, such as -f filename.


    The getopt command updates a variable called OPTIND each time getopt is executed.
    In effect, getopt executes once for each argument you process. Therefore, you
    likely will place the getopt command within a loop. OPTIND starts at 1 and is
    updated with each run of getopt. This variable can be used to shift the arguments
    beyond the options to get to the nonoption arguments. An item on the command line
    that does not begin with - indicates the end of the options. Likewise, an argument
    of -- terminates the options part of your command. In the newer implementations
    of'
