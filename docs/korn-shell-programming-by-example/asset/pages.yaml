  md: 'Freud has been credited with the saying, "Sometimes a cigar is just a cigar."
    The same concept holds true in shell scripting, "Sometimes an * is just an *,"
    In the time that I have spent writing and helping others write shell scripts,
    the single biggest confusion has come from quotes. When do you need to single
    quote? When do you need to double quote? How do you make a special character,
    such as an *, just be an *?


    This chapter looks at examples of using the escape character and single and double
    quotes. From there, it moves to cover line continuation. After that, command substitution
    and parameter expansion are explored. The chapter finishes with arithmetic expansion
    and arithmetic evaluation.


    This chapter teaches you the following:


    +   - The various quoting techniques in the Korn shell

    - How to perform command substitution

    - How the shell performs parameter and arithmetic evaluation'
