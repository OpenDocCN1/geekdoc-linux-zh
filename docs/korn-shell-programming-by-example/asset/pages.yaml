  md: '# Table 3.1: continued


    | Attribute | Meaning |

    | - | - |

    | -L | Left justifies; $n$ specifies field width |

    | -LZ | Left justifies and strips leading zeros; $n$ specifies field width |

    | -n | Name reference |

    | -p | Displays variable names, attributes, and values of all variables |

    | -R | Right justifies; $n$ specifies field width |

    | -R | Read-only |

    | -RZ | Right justifies; $n$ specifies field width and fills with leading zeros
    |

    | -u | Uppercase |

    | -x | Export |

    | -Z | Zero-filled; $n$ specifies field width; same as -RZ |


