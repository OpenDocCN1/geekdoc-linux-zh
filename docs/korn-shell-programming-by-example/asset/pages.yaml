  md: '# Chapter 1: The Environment


    errexit off noclobber off posix off vi-show8 off

    gmacs off noexec off privileged off vi-tabcomplete off

    ignoreff off noglog off restricted off vi-esccomplete off

    interactive on nohup on stdin xtrace off


    This happens to be the output from my Linux box (named "Moose"). The man will
    tell the inquisitive user what each option means. An option can be changed from
    off to on by supplying the option after the set -o command. For example, the command
    line


    ```

