    Now that the classes of characters have been defined, what does this all mean?
    It means a great deal when pattern-matching is discussed later in the chapter.
    Suffice for now to say that it enables the programmer to match any character within
    a set without having identifying every character within that set. For example,
    if you want to refer to all characters that are between A and Z and all characters
    between a and z (remember case is important), it could be written as one of the
    following:


    ```

    [a-zA-Z]

    [[:alpha:]]

    ```


    Examples of using these can be found later in the chapter in the sections "Pattern
    Matching" and "Metacharacters."


    # Pattern Matching


    For those familiar with regular expressions in other programs—including Perl,
    awk, grep, and sed—remember the context, but forget the format. The format of
    regular expressions is different. A fairly way of converting the format into the
    shell format so that it can be used within a shell script exists. The %P format
    of printf converts the formats for most versions of UNIX, but it is not an option
    with older versions of printf. The printf command is discussed in Chapter 10,
    "Output Control."


    The following is an example of printf with the %P modifier. It shows the shell
    equivalent of the regular expr. .*$. This regular expression matches any string
    containing obr then 0 or more characters up to the end of the line:


    ```

    $ printf "%P\n" ''obr.*''

    *obf $

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_107_0.png)'
