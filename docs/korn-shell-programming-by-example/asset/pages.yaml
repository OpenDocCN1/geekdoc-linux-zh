  md: '# Introduction


    This is this book that you are holding? It is a book that teaches you, the system
    administrator or user, how to program using the Korn shell. For my Linux friends
    there who say, "What, not in bash??" let me say a couple of things. First of all,
    ksh is a wonderful shell (ksh is the name of the Korn shell program); bash is
    the name of the Born again shell, common in many Linux systems). It has many features
    that make it an excellent choice for creating scripts as a system administrator.
    Second, ksh is and has been a standard in the UNIX community for many years. My
    goal is to help you become a better system administrator I plan on accomplishing
    that goal without making you cry from boredom.


    I have been in the computer industry for many years (since 1972) and have helped
    many administrators and users create many useful tools. But throughout my career,
    I have consistently found the following things to be true. I have seen good quality
    IT (and other) professionals placed too often in positions where they are asked
    to develop some process or update some tool that they are unfamiliar with, and
    that is written in some language that they do not understand. I have also seen
    these talented IT professionals buy a book, find an answer, and leave the book
    on the shelf never to be opened after one use. If the book is good, it comes off
    the shelf many times; if it is bad, it stays there.


    What these professionals need, what they are looking for, and what you are probably
    looking for right now, is a good book that will help you automate processes, produce
    information, and take the boredom and monotony out of your day. And that is what
    you have in your hands right now!


    Having said all that, the following should be obvious. This book is not a history
    of Unix/Linux. It will not tell you how things were done in the old days. Great
    lengths were taken to ensure that this book does not resemble academia. This is
    a practical, hands-on book jammed with useful examples.


    # Assumptions About the Reader


    I have two assumptions about you, the reader. First, you have access to a UNIX/Linux
    box, or ksh on Win98 or NT. Second, you have some familiarity with UNIX/Linux
    commands and the command line. Appendix A includes many pages of useful commands,
    and we use many of them through this book. The examples are based on Korn Shell
    9. I have tried to point out places where I use syntax that will not work on earlier
    releases of the Korn shell. Korn Shell 9 is freely available on the Web for personal
    use. Perform a general search for Korn Shell and you will find locations from
    which to download the program.'
  merge: -1
