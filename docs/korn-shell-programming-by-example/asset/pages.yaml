  md: "The following example tests to see whether a few files are executable. Note\
    \ that the [[ ]] notation provides the test capability and the command can be\
    \ used in a script for more reasonable syntax. If you C programmers, note that\
    \ 0 means yes (or true), whereas non-zero means (or false). This is the exact\
    \ opposite of what you are used to within the C programming language, where 0\
    \ means false and non-zero means true. Read it and weep:\n\n```\n$ [[ -x dow5\
    \ ]]           # Is dow5 executable?\n$ echo $               # 0 means a successful\
    \ test (yes)\n0\n$ [[ -x web.tmp ]]      # Is web.tmp executable?\n$ echo $  \
    \             # 1 means a failed test (no)\n1\n$\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_186_0.png)\n\
    \n# Testing Strings\n\nIf the data to be manipulated consists of character strings,\
    \ the Korn Shell provides several special test operators for handling string manipulations\
    \ (see Table 7.4). For instance, you might need to check whether a string variable\
    \ is empty before presenting it to a function or using it in a test.\n\nTable\
    \ 7.4: String tests\n| Test Condition | True If |\n| -z string | string is zero\
    \ length |\n| -n string | string is non-zero length |\n| - option | option is\
    \ on |\n| -t [ unit ] | unit is associated with a terminal (default unit 1) |\n\
    \nGenerally, the command after an if statement can be\n\n+   - [[ test-expression\
    \ ]], which allows multiple expressions, grouped with ( ), |,, && and |\n- For\
    \ instance\n  [ (( ($a>$b) && ($c<$d) )) || !($e$f) ]\n  tests either a-b and\
    \ c-d, or e is not less than f.\n- An arithmetic expression using (( ( ... ) ))\n\
    - A standard command"
