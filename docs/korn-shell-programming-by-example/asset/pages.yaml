    The Korn Shell provides numerous test operators to efficiently handle situations
    in which file existence or characteristics should be checked (see Table 7.3).


    | Test Condition | True if (Note: Each Category Requires Existence) |

    | -e file | File exists (same as -a) |

    | -r file | File is readable. |

    | -w file | File is writable. |

    | -x file | File is executable. |

    | -f file | File exists and is a regular file. |

    | -O file | User owns it. |

    | -d file | It''s a directory file. |

    | -s file | File exists and is non-empty. |

    | -c file | It is character special. |

    | -b file | It is block special. |

    | -p file | It is named pipe. |

    | -u file | It is setuid bit set. |

    | -g file | It is setgid bit set. |

    | -k file | It is sticky bit set. |

    | -L file | It is a symbolic link. |

    | -G file | User is in same group. |

    | -S file | It is a socket. |'
