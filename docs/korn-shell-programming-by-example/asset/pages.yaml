    \ you can reverse the roles. You might wonder about the series of logic taken\
    \ by your parents to arrive at a conclusion.) The next Korn Shell debugging option\
    \ does just that. It provides the bread crumbs to follow through the dark woods\
    \ of your script's execution.\n\nOne of the ksh options for debugging is the verbose\
    \ option. It displays each shell command before it executes."
