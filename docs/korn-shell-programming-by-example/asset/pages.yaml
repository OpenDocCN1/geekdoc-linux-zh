    # Modes of Operation


    The vi editor supports three modes of operation: command mode, in which keys are
    interpreted as commands; insert mode, in which keys are interpreted as input to
    the file; and last-line mode, in which ex commands can be entered.


    # Command Mode


    As indicated earlier, upon entering vi, the editor is in command mode. This means
    that you can enter any of the vi command mode commands. The typical new user complaint
    is that no prompt exists in command mode. In fact, this is true for two of the
    three vi modes. We can whine about it, or accept and move on. Basically, the editor
    accepts any characters typed while in command mode as commands. The commands are
    usually one-letter commands that do not echo when typed, and the editor does not
    prompt you for the next command. The commands also are accepted without the carriage
    return being entered.


    The previous few characteristics are very important to understand. They are major
    hurdles preventing the typical user from understanding and even enjoying this
    editor.


    The following are the most commonly used command mode commands:


    +   - i—Switches to insert mode; inserts text before the cursor

    - I—Switches to insert mode; inserts at the beginning of a line

    - a—Switches to insert mode; inserts text after the cursor

    - A—Switches to insert mode; inserts at the end of a line

    - o—Switches to insert mode; opens the line below the current one

    - 0—Switches to insert mode; opens the line above the current one


    # Insert Mode


    After the user types one of the commands listed in the previous section, the editor
    switches to insert mode. As the name implies, insert mode allows the insertion
    of characters into the file. The assumption that rookie vi users make is that
    after that they get into the editor, they can just start typing the characters
    they want to place in the file. If a user did this, he would type'
