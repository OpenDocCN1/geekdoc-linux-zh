- img_proc: true
  md: '# NOTE


    A third way to move processes to either the background or the foreground has not
    been discussed. A prefix can be used with the percent sign (%prefix), where the
    prefix is enough of the command to ensure uniqueness within the job list. For
    instance, instead of bringing the command man to the foreground with the job number,
    it would have been just as correct to use %prefix, as shown in the following example:


    ```

    $ fg %ma

    [1] man man

    ```


    Sometimes, the user wants to have a command run in the background when the command
    is issued. As mentioned before, the default is to have the process run in the
    foreground. In order to run a command in the background, you must place an ampersand
    (&) at the end of the command, as shown in the following example:


    ```

    $ sleep 10000 &\n[1] 13947

    $

    ```


    The shell responds by placing the sleep command in the background. Note that this
    technique puts a job in the background, but does not stop it. The shell returns
    the PID of the process as well as the job number of the process:


    ```

    $ jobs

    [2] + Stopped more .Xdefaults

    [1] - Running sleep 10000 # Running, not stopped

    ```


    If another command is also sent to the background then that new process''s PID
    and job number are shown:


    ```

    $ sleep 99999 &\n[3] 13959

    $

    ```


    A quick peek at the jobs listing ensures that everything is running smoothly:


    ```

    $ jobs

    [2] + Stopped more .Xdefaults

    [3] - Running sleep 99999

    [1] - Running sleep 10000

    ```


    The ampersand is very useful in that it allows processes that do not require access
    to the display to run, and at the same time allows the user to continue using
    the terminal.


    ![](img/de6a3b5a3b516159c825f1c10314d877_66_0.png)'
  merge: -1
