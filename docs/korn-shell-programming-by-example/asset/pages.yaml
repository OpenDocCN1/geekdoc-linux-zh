  md: "# Chapter 12: Traps\n\nwithin your script to describe any sticky points in\
    \ your logic or anything else that might be of use to a maintenance person. Realize\
    \ that the maintenance person might be you!\n\n# Self-Help Scripts\n\nAs my mind\
    \ gets more cluttered with UNIX commands and other technical floatsam, my ability\
    \ to remember the expected syntax of a particular command or script becomes limited.\n\
    \nOne of the techniques I use to quickly recall which options are legitimate and\
    \ what the order of the parameters is supposed to be is to type the command with\
    \ no other syntax. Usually this is incorrect for the command or script in question.\
    \ If the script has been designed with self-help in mind, it displays a syntax\
    \ reminder onscreen. This functions as a mini man page, as you can see in the\
    \ following example.\n\nYou can alternatively set up your script to react to a\
    \ parameter of ? -help.\n\n```\n$ gcdksh\nUsage: gcdksh {integer_1} {integer_2}\
    \ ...\n$ \n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_297_0.png)\n\n# Bulletproofing\n\
    \nThe ultimate bulletproofing of a script comes by combining many of the thoughts\
    \ presented in this chapter. The goal is to make the script impervious to any\
    \ kind of input the user might throw at it (or that it might read from a file).\
    \ This special-case “what-if” code can be so detailed and cumbersome to write\
    \ that it takes up more lines in your script than the main logic flow. Therefore,\
    \ I suggest that you implement these ideas in your nonexpansive scripts.\n\nThe\
    \ following example shows an example of bulletproofing.\n\n```\n$ cat gcdksh\n\
    ! /bin/ksh\n```\n\n```\nfunction gcd {\n# Function to generate gcd between two\
    \ numbers\ninteger u v r\n\nu=$1\nv=$2\nwhile ((v))\n# Key gcd loop\ndo\n\nr=%u%v\n\
    ```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_297_1.png)"
