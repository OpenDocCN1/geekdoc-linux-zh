  md: '# 408 Appendix B


    You also can move quickly within a line by using the 0 (that''s a zero) command
    to move to the beginning of a line and using the $ command to move to the end
    of a line.


    The following are cursor movement commands:


    +   - 0—Move to the beginning of the line

    - $—Move to the end of the line

    - h—Move to the left

    - j—Move down a line

    - k—Move up a line

    - 1—Move to the right

    - Ctrl+D—Move down half a screen

    - Ctrl+U—Move up half a screen

    - Ctrl+F—Move down a screen

    - G—Go to the end of the file

    - 1G—Go to line one (beginning of file)

    - 34G—Go to line 34

    - w—Move forward to the next word


    # Deleting


    Occasionally, you will reread your document an hour after creating it and decide
    that you need to delete a character, a word, an entire line, or an entire group
    of lines. The following lists the commands to handle deletions. Be aware that
    the dd and dw commands are two of the rare commands that actually require two
    keystrokes to execute.


    The following are the deletion commands:


    +   - x—Delete the character where the cursor is

    - dw—Delete the word where the cursor is

    - dd—Delete the line where the cursor is


    Suppose you make a mistake and realize that wasn''t what you really wanted to
    do. The vi editor allows you to undo the last command executed by using the u
    command. The u command actually takes the contents'
  merge: -1
  pgno: 423
- img_proc: true
  md: 'of the delete buffer (called the general purpose [GPB]) and puts it back where
    it originated. Be aware that you can undo only the last command you performed.
    If you try to undo a second command, you will be undoing the undo, which puts
    you back where you started!


    # # Cutting and Pasting


    One of the more common deletion-oriented edits made when working with an existing
    file is the cut-and-paste operation. This is useful when you have a few lines
    of the file that need to be moved to another area of the file. You typically cut
    the section to be moved, and then place it in a temporary buffer (the GPB). Next,
    you move the cursor to the location you want the data to be placed, and then paste
    it into its new home.


    The sequence involves a dd command, followed by moving the cursor and entering
    the p command. If you want to move more than one line, you can use a line count
    in front of the dd command:


    ```

    3dd

    ```


    ```

    (move cursor)

    ```


    ```

    p

    ```


    The p command pastes the contents of the GPB on the line below the line on which
    the cursor sits. If you want to paste the data in the GPB above the current line,
    use the P command (capitol P).


    Perhaps you want to perform a cut and paste but prefer to leave a copy of the
    data at its original location. This can be accomplished by a dd command, followed
    immediately by a p to place a copy of the deleted data right back where it came.
    It can also be accomplished using the yy command. This command yanks a copy of
    the selected lines into the GPB. The difference is that it does not delete the
    lines:


    ```

    yy

    ```


    ```

    (move cursor)

    ```


    ```

    p

    ```


    # # Using Multiple Buffers


    Be aware that any use of the GPB replaces the previous contents. So if you perform
    a 100dd command to delete 100 lines (and place them in the GPB), and then delete
    another character using the x command, the single character removed by the x command
    replaces the 100 lines of data in the GPB.'
  merge: -1
  pgno: 424
