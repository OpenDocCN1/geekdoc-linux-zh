  md: "# Command-Line Arguments\n\nksh, the getops command can also handle + in front\
    \ of the options, to handle situations in which the option could indicate set\
    \ or unset. Check your man pages to see whether getotops has the capability.\n\
    \nIn addition, a special syntax within getops is available that can be used to\
    \ handle bad options presented by the user. (We know that never happens!) A leading\
    \ : in the options list tells getops to set invalid options to the character ?\
    \ and to place the bogus argument in OPTARG. It sets the options variable to :\
    \ if the option has a missing value and the option that is missing the value into\
    \ the special variable OPTARG.\n\nThe next example shows the basics of using getops\
    \ to handle command-line arguments and errors. The getops command is at the top\
    \ of the while loop. The loop is repeated until getops reports an unsuccessful\
    \ status, which occurs when no more options are on the command line. Note that\
    \ the extra parameters (nonoptions) are not considered by getops unless they follow\
    \ the -o or -n options (in the example script).\n\nLet's examine the options list\
    \ : rwn#o:. The : at the beginning of the options list requests that getops put\
    \ bogus arguments into OPTARG and set the var opt (in this script) to hold a ?.\
    \ The r and w are normal options, and the n# indicates that the option should\
    \ be followed by a numeric value. The o:, on the other hand, indicates that the\
    \ option should be followed by an argument. This is handy for file input options.\
    \ The opt variable name holds the option being processed currently, so it is perfect\
    \ for using in a case statement within the getops:\n\n```\n$ cat getopt\n#!/bin/ksh\n\
    # Illustration of using getops, OPTARG, OPTIND\n# to parse a command line\nwhile\
    \ getops :rwn#o; opt # Setting up the expected options\ndnase $opt in\nnr) print\
    \ \"Processing for r option...\" # Could set a flag or call\n    ;; # a function\n\
    w) print \"Processing for w option...\"\n    ;;\nn) print \"Processing for n option...\"\
    \n    num=$OPTARG # OPTARG gets the numeric value\n    print \"Number is $num\"\
    \ # accompanying -n\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_198_0.png)\n\
    \nEXAMPLE"
