- img_proc: true
  md: '# Functions


    As you develop a script, you might find yourself repeating a sequence of lines.
    An example is a sequence of commands to check for a yes or no response from the
    user of your script. You might find the same script sequence appearing many times
    throughout the script.


    Let''s say the sequence of lines consists of 10 commands. If the sequence needs
    to be repeated 50 times in a row, it is a candidate to be put into one of the
    looping constructs discussed in Chapter 6, "Flow Control."


    But what if the 50 times that the sequence of 10 commands is to be repeated turn
    out to be dispersed randomly over the body of your script? Consider the following:


    +   Lines

    Lines

    (Sequence of 10 commands)

    Lines

    Lines

    (Sequence of 10 commands)

    Other lines

    Other lines

    Lines

    (Sequence of 10 commands)

    (. . .)


    This situation is not solved by any of the looping constructs from the previous
    chapter. You might be thinking that you can handle this by creating a small script
    containing the sequence of 10 commands and then executing it at the appropriate
    times. This idea works without excessive overhead due to the potential for many
    script invocations.


    Korn Shell *functions* can contain many commands and do not cause a separate script
    invocation when used. Functions provide a method to group commands that might
    require repetitive, distinct (nonloop) executions. Functions typically execute
    in the context of the environment in which they are declared. They execute more
    quickly than dot scripts (scripts run within the current context with the command—for
    instance, . myscript) because they are pread by the shell, they can have local
    variables, and they preserve positional parameters ($1, $2, and so on).


    The two ways to define functions are POSIX-style and Korn Shell-style. The Korn
    supports both styles, which are differentiated by their syntax. I''m going to
    present the POSIX-style syntax for reference only. I recommend using the Korn
    Shell-style functions because they support local variables, unlike the POSIX-style
    functions, which do not.'
