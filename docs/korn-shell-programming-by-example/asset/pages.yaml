  md: '# Pattern Matching


    The ksh uses four pattern characters for pattern processing. These characters
    are "*", "?", "[", and \]". The pattern characters can appear anywhere in a word
    and any number of times within a word. If a pattern character is quoted, as they
    are previously shown, the special meaning associated with the pattern character
    is removed and the shell treats the character just like a regular character instead
    of a pattern.


    Square brackets ([]) delimit a set of characters from which to choose for a single
    character match. This was alluded earlier with the illustration of a character
    class. Within the brackets, several characters take on special meaning and are
    handled differently from how they would normally be handled. The first is the
    minus sign (-), which indicates a range of characters. For example, a-z the shell
    to match any character that is one of the lowercase letters. In the previous section,
    the following was used to indicate all alphabet characters:


    The brackets indicate that a successful match is any one of set of characters.
    The following example shows a more complicated example of matching any of a set
    of characters:


    ```

    [[Cc][1-6]]

    ```


    Notice that more than one bracket is used. This particular example would match
    any of the following words:


    ```

    Chapter1 chapter1 Chapter2 chapter2 Chapter3 chapter3 Chapter4 chapter4 Chapter5
    chapter5 Chapter6 chapter6

    ```


    This simple example should help illustrate how much typing, and programming energy
    is saved with a bare minimum of pattern matching.


    Simple pattern matching can include the character classes as well. Character classes
    are distinguished from the characters used to make their names by the brackets
    and colons placed around them. Consider the following two regular expressions:


    ```

    [:digit:]

    [:digit:]

    ```


    Although they look similar, the second has only one set of brackets. When you
    apply each of these to a pattern-matching routine—such as a grep—you get vastly
    different results. To illustrate this, a sample file has been set up. That file
    is listed here for reference:


    ```

    $ cat david

    !#!/bin/ksh

    ```


    +   # Written by David Pitts

    # written on July 2, 2000


    ![](img/de6a3b5a3b516159c825f1c10314d877_108_0.png)'
