    \ | ex masks_env_bad      # Alter line 50 using ex editor\n$\n sed -n '50p' masks_env_bad\
    \               # Looks good to me\nprint ${res[*]}                          \
    \ \n$\n ksh masks_env_bad                      # ksh -n agrees\n$\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_280_0.png)\n\
    \n# Verbose Mode\n\nHave you ever wished you could follow the logic of your teenager\
