  md: 'As a shell programmer, you will have many opportunities to use the kill command.
    The kill command sends a signal to a running process and tells it to do something.
    The signals are distinguished by their signal numbers. A program or script can
    be prepared to handle, ignore, or take a default action when interrupted by a
    signal.


    The kill command uses the following syntax:


    ```

    /usr/bin/kill -s signal pid

    /usr/bin/kill [-signal#] pid

    /usr/bin/kill -l exit_status

    ```


    The part inside the square brackets is optional. The difference between the first
    two listed the signal part. A signal can be identified either by its number or
    by its symbolic name. If the symbolic name is used, the -s signal variant is used,
    in which the pound sign (#) is replaced by the appropriate signal number.


    These are the same signals discussed earlier in the chapter, and you can refer
    to that earlier discussion for more information. The signal table is repeated
    in Table 2.2 for ease of viewing.


    # Table 2.2: Signals (again)


    | Name | Value | Description |

    |---|---|--|

    | SIGHUP | 1 | Hang up detected on controlling terminal or death of controlling
    process |

    | SIGINT | 2 | Interrupt from the keyboard |

    | SIGQUIT | 3 | Quit Signal from the keyboard |

    | SIGKILL | 9 | Kill Signal |

    | SIGTERM | 15 | Termination |


    Table 2.2 shows that you can send a number of signals to a process. The default
    signal used if no explicit signal is given is 15, SIGTERM. Therefore, if a process
    was running that you owned, which you wanted to terminate, the kill command is
    for you. Of those listed, the two most commonly used are 1 and 9.


    The first signal, 1, as stated earlier, is the default signal. This tells the
    program to stop running. If the process is in the middle of a write or read, the
    kill command allows it to finish its work first. This is also the preferred method
    to use because it allows the program to clean up after itself.


    The second signal, 9, is the mean and nasty killer. It is a signal that can''t
    be handled. It does not allow any signal handlers or termination handlers built
    into the script or process to execute. On many occasions the -9 option is the
    only way to go. Signal number nine is one of the few signals a script'
  merge: -1
