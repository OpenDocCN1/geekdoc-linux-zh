  md: '# If Test


    To find out the truth, you must ask questions. The if test provides a means for
    the script to query a variable, compare strings, check a loop counter, find out
    whether a command completed successfully, and perform similar activities.


    Basic if-test syntax is as follows:


    ```

    if command

    then

    command(s)

    fi

    ```


    Cute, huh? The logic of the if test is bracketed by the words if and fi, which
    is "if" spelled backwards. You will see this same cuteness other time in this
    chapter (case/esac). The syntax means that if the command is true, then do the
    command or commands appearing between the then and the fi. But how does a command
    become true or false?


    As a command completes, it reports its status to the shell. This status is held
    in a special variable named $ (see Chapter 1, "The Environment"). Therefore, all
    you have to do is test $ after a command executes and you can decide which road
    to travel by. That is, do you execute the commands between the then and the fi,
    or do you skip them and continue processing with the command that follows the
    fi?


    # Exit Status


    Note that any command, program, or script can exit with an arbitrary exit status,
    but a status of zero usually represents success.


    The following shows a directory with one file in it named tfi:


    ```

    $ ls

    tfi

    $

    ```


    The following is the successful execution of an ls -l command. Note that the print
    $? shows a status of 0 (success):


    ```

    $ ls -l tfi

    -rw-r--r-- 1 obrien users 31 Aug 26 15:17 tfi

    $

    $ print $?

    0

    ```


    The following is the unsuccessful execution of an ls -l command. Note that the
    print $? command shows a non-zero status (failure):


    ![](img/de6a3b5a3b516159c825f1c10314d877_133_0.png)'
  merge: -1
  pgno: 133
- img_proc: true
  md: '```

    $ ls -1 tf2

    ls: tf2 not found

    $

    $ print $?

    ```


    The exit status of the ls -1 command indicates a failure of some sort. The number
    to display is determined by the logic of the ls program.


    You might be wondering why I spent some energy on describing the return status
    from a command when I am supposed to be describing the if test. In essence, an
    if looks at the return status (0 equals success, and non-zero codes equals failure)
    of the command that appears after the if syntax. If the status is 0 (success),
    the commands between then and fi are executed. On the other hand, if the status
    is non-zero (failure), the commands between then and fi are not executed. Take
    another look at my general description of the syntax of an if test. It is repeated
    here for your convenience:


    ```

    if command

    then

    command(s)

    fi

    ```


    Notice that the syntax expects a command after the if. This might not jibe with
    your recollections of various script snippets you may have seen in other books
    or at your job site the syntax seems to imply that you don''t need to have a test
    after the if. You most likely recall syntax such as the following:


    ```

    if (( a == b ))

    then

    commands_to_do

    fi

    ```


    or


    ```

    if [[ $a = $b ]]

    then

    commands_to_do

    fi

    ```


    # The (( and the [[ Commands


    Given these two simple examples, and considering the template that has been shown
    twice, indicating that after the if there should be a command, you must conclude
    that the (( and the [[ are actually commands! Indeed,'
