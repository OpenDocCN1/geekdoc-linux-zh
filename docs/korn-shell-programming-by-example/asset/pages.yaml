    # Environment Variables


    As already mentioned, the values associated with an environment variable are visible
    by child processes of the shell. For a variable to be part of the environment,
    it must be exported to the environment. This is done with the export command.
    Earlier, we examined a .profile script. In several variables were set, including
    the PATH, the prompt setting (PS1), and the hostname of the computer. After all
    the values were set, the varnames were exported to the environment:


    ```

    PS1="HOSTCHAR":$(PWD$HOME):\$$  # Set the prompt PS1

    PATH=$PATH:/usr/X1R6/bin                    # Set the path variable

    HOSTNAME=''/bin/hostname''                   # Set the hostname variable


    export PATH PS1 USERNAME MAIL HOSTNAMESIZE FILESIZE INUPTRC LINES

    # Export them all

    ```


    As you can observe from the export list, several varnames can be exported on a
    single line delimited with spaces. The lines could just as easily been written
    like this:


    ```

    PS1="HOSTCHAR":$(PWD$HOME):\$$  # Export individual variable

    export PS1

    PATH=$PATH:/usr/X1R6/bin

    export PATH

    HOSTNAME=''/bin/hostname''

    export HOSTNAME

    export USERNAME MAIL HOSTSIZE FILESIZE INUPTRC LINES

    ```


    Many times commands can be included on a single line or split out onto several
    lines.


