- img_proc: true
  md: 'One further example is needed to show how to handle special characters. Later
    in the book, you learn that the double quote ("") is a special character. To use
    the double quote in the search pattern, it must be indicated that it is not used
    for its specialness, but as a regular character. This is done with a backslash
    (\):


    ```

    $ grep ''\$'' david

    third_variable=*instructed on what to do. Now, go back to your game of "nforh_variable=Quake.
    .

    ```


    The previous example actually takes the next step. It uses single quotes to indicate
    that the space before the double quote is included as a character. Two lines end
    with a space and a double quote, and that is exactly what is returned.


    # Metacharacters


    "I have never met character I didn''t like." No, that is not what is meant here.
    A metacharacter is a character that has a special meaning. Five characters have
    special meanings. They are shown in Table 4.2 with an explanation of their meanings.


    | Symbol | Meaning |

    | --- | --- |

    | ! | Matches all except those matched by the pattern-list |

    | * | Matches zero or more occurrences of the pattern-list |

    | ? | Matches zero or one occurrence of the pattern-list |

    | @ | Matches exactly one occurrence of the pattern-list |

    | + | Matches one or more occurrences of the pattern-list |


    Table 4.2: Metacharacters for sub-patterns


    A pattern-list is one or more patterns separated by an ampersand (&) or a vertical
    bar (|). & between two patterns indicates that both patterns must be matched.
    A | between two patterns indicates that either one pattern or the other must be
    matched. The pattern-list is placed inside a set of parentheses. The parenthesized
    pattern-list optionally might be preceded by one of the special characters from
    Table 4.2. Pattern-lists can be used within [[...]], for filename expansion (wildcards),
    matching in the case state, and substring expansion.


    The following example shows a pattern match of any instance that does not contain
    the string David or the string Pitts:


    ! (David|Pitts)


    ![](img/de6a3b5a3b516159c825f1c10314d877_111_0.png)'
