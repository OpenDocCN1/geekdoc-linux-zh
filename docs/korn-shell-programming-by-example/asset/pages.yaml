- img_proc: true
  md: 'The following are conditional tests for numerics (( )):


    +   - ==—Equality

    - !=—Not equal

    - >—Greater than

    - >=—Greater than or equal to

    - <—Less than

    - <=—Less than or equal to


    Here are the conditional tests for strings {[ ]}:


    +   - == (or ksh88)—Strings are equal.

    - !=—Strings are different.

    - >—First string is lexically (ASCII precedence) before second.

    - <—First string is lexically (ASCII precedence) after second.


    A standard test for string equality might look like the following:


    ```

    $ [[ $x == "5" ]

    > then

    > print "Strings are the same"

    > fi

    Strings are the same

    $

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_137_0.png)


    You are probably wondering what the command underlying the {[ is. The [ command
    is actually the test command in disguise. The test command can still be used to
    evaluate an expression, but you will seldom see it in an if test. The following
    is an example of what your tests could look like:


    ```

    $ test $x = 5 # test command at prompt

    $ print?

    0

    $

    $ test $x == 5 # test command in an if test

    > then

    > print "Strings are equal"

    > fi

    Strings are equal

    $

    ```


    This syntax tends to be unwieldy and confusing. Your habit should be to use the
    [[ ]] for your string tests and the (( )) for your numeric tests.'
