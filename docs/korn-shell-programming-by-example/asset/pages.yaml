    # Special Files


    My first experiences with UNIX were as a C programmer I was familiar with writing
    programs for low-level access to devices for writes, or getting or setting device
    characteristics, but had never done it in UNIX. I had always done this by opening
    a channel to the device and using functions that run in kernel mode (referred
    to as system calls or system services) to get or set what I wanted. I figured
    I could the same kind of thing in UNIX, but I didn''t know how. I spoke with a
    new hire who had experience and asked him how to perform low-level I/Os to a device
    in UNIX. He thought for a few seconds and said, "Well, that''s easy. You just
    open a file. Everything in UNIX is represented by a file."


    I thanked him and backed away thinking to myself, "This guy doesn''t have a clue."
    It turned out it was I who didn''t have a clue. Just about everything in UNIX
    is represented by a file. Files represent all your terminals, printers, disks,
    virtual memory, physical memory, pseudo-devices, and so on.


    Files representing hardware devices are special files. They can be character special
    files for terminals, printers, and other-oriented devices, or they can be special
    files for disk devices. Note that these files are actually 0 bytes in size. Take
    a look at the size field in the following examples (just to the left of the date
    field). The size field is replaced by two numbers, such as 6 and 27, or 19 and
    38.


    The leftmost number is the device major ID and is used to identify which device
    driver is to be used to serve this device. The other number is the device minor
    ID. It is used to distinguish one device (in a class of devices) from the other.
    If you had 15 SCSI disks, they would all be served by the same driver, the major
    ID in their device specials would be the same for all of them. The minor IDs,
    however, would all be different to differentiate I/O from each individual device.
    All the device special files consists of'
