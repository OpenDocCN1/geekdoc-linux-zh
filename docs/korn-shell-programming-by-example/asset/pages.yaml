    The following example uses an awk script to search through the password file looking
    for records with an empty password field (second field). This is a major security
    break because it would allow anyone to log in without needing to present a password:


    ```

    $ cat breakers

    BEGIN # An awk script

    { # BEGIN section executed first

    print "Investigate these accounts:"

    }

    { # Pattern search and action section

    if ($2 == "*") { print "Account name is ",\nUser is", $5 };

    }

    END

    {print "Done. \n"} # END section done last

    $ awk -F-f breakers /tmp/passwd

    ```


