- img_proc: true
  md: 'The permissions, owner, group, and name of the file are what is important to
    present us.


    The permissions for the file are rw-w-r--. The first character on the line shows
    the type of file; d means regular file; d means directory; and the others are
    listed in Table 1.1.


    +   - The owner is Pitts.

    - The owning group is users.

    - The name of the file is david.


    The permissions for files are split into four sections:


    +   - A special file type field (one character)

    - Permissions for the owner of the file (three characters)

    - Permissions for the group associated with the file (three characters)

    - Permissions for everyone else (the world—three characters)


    Each section has its own set of three file permissions, which provide the capability
    to read, write, and execute (or, of course, to deny the same). These permissions
    are called the file''s filemode. Filemodes are set with the chmod command.


    The object''s permissions can be specified in two ways—the numeric coding system
    or the letter coding system. Using the letter coding system, the three sections
    are referred to as follows:


    +   - u for user

    - g for group

    - o for other

    - a for all three


    The following are three basic types of permissions for read


    +   - r for read

    - w for write

    - x for execute


    Combinations of r, w, and x with each of the three groups of users provide the
    complete set of permissions for the file''s files. In the following example, the'
  merge: -1
