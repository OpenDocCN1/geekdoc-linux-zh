  md: '# Control Key Signals


    Control key signals are a fancy way of referring to a key sequence in which the
    Ctrl key is held down and another is pressed. One such signal has already been
    discussed, the Ctrl+Z signal. As you will recall, this signal stops the foreground
    process and puts it in the background. Some programs use control key signals to
    perform tasks.


    One program that is not discussed in this book is emacs. There is a huge discussion,
    with people devow on both sides, as to which is a better editor—vi or emacs. Given
    that there is an appendix at the back of this book on vi, you probably have a
    good idea of which editor the author prefers. The vi is the more commonly available
    editor and there-fore recommended here.


    When you see something that begins with the letters Ctrl followed by a plus sign
    and then another letter, it means you hold down the Ctrl key and press the other
    character. For example, when you see Ctrl+C, it means you hold down the Ctrl key,
    press the C key once, and then let up the Ctrl.


    The following is not an exhaustive list of the control key signals available on
    your system. They are, however, many of the default key signals available on almost
    all systems:


    +   * Ctrl+\—The Ctrl\ key signal is the quit signal. It is basically a stronger
    signal than the Ctrl+C (interrupt) signal. Stronger means that it stops some programs
    that ignore the interrupt signal and produces a core file also. Core files can
    be used by programmers for debugging purposes.


    +   * Ctrl+C—Ctrl+C is the default interrupt signal. The user wanting to interrupt
    a process would use this key sequence. In the following example, a simple but
    long running 1 command is set up. The output of this command is being redirected
    into a special file (/dev/null) that accepts all data sent to it and ignores it.
    Shortly after its execution, Ctrl+C is pressed:


    ```

    $ 1 ls -LR / /dev/null

    (ctrl+c)

    $ jobs

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_70_0.png)


    Following the Ctrl+C being pressed, the list of jobs is shown to emphasize that
    the 1 command was not suspended, but was actually interrupted and the process
    was removed from execution and from the process list with the Ctrl+C signal.'
  merge: -1
  pgno: 70
