  md: '# Process Control


    The previous chapter introduced you to the Korn shell environment. This chapter
    helps you take that information a step further. You take a closer look at the
    concept of a process. The environment discussed in Chapter I, “The Environment,”
    is part of the process context within which a script or command runs. You find
    out how to schedule the execution of scripts (or commands) at predefined times
    and examine the difference between back-ground processing and foreground processing.
    You also discover ways to interact with a process during its execution through
    signals. In essence, this chapter looks at processes and shows some ways of interacting
    with them.


    This chapter teaches you the following:


    +   * What has to happen for your script to run

    * How to start and stop a process

    * How to move jobs between foreground and background

    * How to schedule jobs to run at specified times

    * How to obtain process status

    * How to kill, suspend, or terminate a process'
