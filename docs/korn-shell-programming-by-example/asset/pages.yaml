- img_proc: true
  md: '# How to Run a Script


    Simply speaking, executing a script is as easy as typing its name at the shell
    prompt. Of course, if that were all there was to it, a whole section wouldn''t
    be dedicated to it, now would it? A number of pieces must fall into place for
    a script to be executed. Here are a few of the prerequisites for script execution:


    +   - The Permissions must be correct.

    - You must be able to locate the script through the PATH variable or through an
    absolute file specification.

    - System resources must be available to support the execution of the script.

    - The correct shell must be invoked to interpret the script''s contents.

    - The script''s syntax must be correct.

    - All files referenced during the run must be available.

    - The user interaction must be reasonable.


    As discussed in the previous chapter, the permissions must be such that the user
    has both read and execute permissions on the file. Execute access is needed for
    the actual execution, and read access is needed because the file is not a binary
    and the shell (which is running under the user''s ID) must be able to read the
    contents of the file.


    In addition, the shell must be capable of locating the script file. The directory
    where the file is located must either be part of the user''s PATH variable or
    the full path and filename must be used at the shell prompt. In the following
    sample code, the path setting is such as might be established in a .profile file:


    ```

    PATH=$PATH:$HOME/bin: # Adds two locations to current PATH

    export PATH

    ```


    Although it does not look like much, it is really doing something. In this particular
    command, the PATH variable is having two additional directories appended to it.
    Notice that the current value of PATH (as indicated by $PATH) is included in the
    assignment. This enables the additional directories to be appended. Had the $PATH
    not been there, directories already part of the $PATH would have been lost. Echoing
    out the PATH provides the following results:


    ![](img/de6a3b5a3b516159c825f1c10314d877_55_0.png)'
  merge: -1
  pgno: 55
- img_proc: true
  md: '```

    $ echo $PATH

    /usr/local/bin:/bin:/usr/bin:/usr/X1R6/bin:/home/david/home/david/bin

    ```


    Two things should be noticed at this point. The first is that each directory is
    delimited by a colon (:). The second is that $HOME is expanded out to be the location
    of the user''s actual directory of /home/david. This means that the user named
    david can execute any script in any of the directories listed in the user named
    david''s PATH statement. Permissions still are used to determine whether the script
    can be executed. Finding the location of a script is just half the battle.


    # CAUTION


    It is legal to place a dot (.) in the path. Many users do so that they can execute
    files in their current directory. Under no circumstances should privileged user
    have the dot directory in her path. This is a HUGE hole because the root user
    cd could be a directory where, for example, a script named ls has been placed.
    The ls might show filenames as the real ls command, but maybe it also removes
    the password field from the root account (or similar disastrously). This is more
    likely to be a problem if the . appears early in the PATH. This is a famous security
    hole exploited by hackers over the years!


    Because this PATH was for a non-privileged user, /sbin, /usr/sbin, and /usr/local/sbin
    were not a part of the string. These directories are traditionally reserved for
    commands and scripts usable only by privileged users and are typically for the
    system (the s bin) programs. Many of these scripts and binaries look like they
    can be run by the ordinary user, but the “dangerous” ones have safeguards built
    in. The shutdown command is an example of a command containing safeguards:


    ```

    $ /sbin/runlevel

    N 3

    $ /sbin/shutdown # Attempt to shut down the system

    shutdown: must be root.

    ```


    First, the user runs the runlevel command. This is a fairly innocuous program
    that returns the previous and current runlevel (see the man pages on runlevel
    for more information). Then, the user decides to try a different command--shutdown.
    If the user is successful then the system comes down. Fortunately, a built-in
    safeguard checks to see whether the user is root (privileged), and—because the
    user david does not have a UID of zero (the root account''s UID)—the program aborts
    with an error. Later in the book you will see how to set up such error checking.'
