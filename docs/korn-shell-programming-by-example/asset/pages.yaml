  md: "# Function Programming Details\n\nthis chapter have been by value, and most\
    \ of them, you will use by value style arguments. But here's the news on by-reference\
    \ argument passing:\n\nSetting up reference argument passing consists of two parts.\
    \ First, the calling script must present the argument to the function without\
    \ preceding it with the dollar sign. (Remember that the $ in front of a variable\
    \ tells the shell to find the value of the variable.) You don't want to present\
    \ the value of a variable as an argument; instead, you want to present the variable\
    \ name itself as an argument.\n\nSecond, the function must declare the variable\
    \ using the nameref keyword. This prepares the function for the responsibility\
    \ of altering the contents of a variable in the caller's environment:\n\n![](img/de6a3b5a3b516159c825f1c10314d877_168_0.png)\n\
    \n```\n$ dow7\n! /bin/ksh\nfunction dow\n{\n    nameref optarg=$1      # Use nameref\
    \ to define optarg\n    # as a reference variable\n    if [[ -z $optarg ]]\nthen\n\
    \        date +%A\n        return 0\n    fi\n    case optarg in\n        -s) WEEKDAY=$(date\
    \ +%A)\n            optarg=\"set\"      # Alter by_ref_arg indirectly\n      \
    \      return 2;\n        *) print \"Format is \\n -s\"\n    esac\n    return\
    \ 1;\n}\nn# Script begins execution here #\nby_ref_arg=$1          # Create by_ref_arg\
    \ to pass\nprint \"Before function call, by_ref_arg contains $by_ref_arg.\"\n\
    dow by_ref_arg\nprint \"After function call, by_ref_arg contains $by_ref_arg.\"\
    \nreturn 0\n$\ndow7 -s\n```\n\nBefore function call, by_ref_arg contains set.\n\
    After function call, by_ref_arg contains. # Note the change after the function\
    \ is called"
