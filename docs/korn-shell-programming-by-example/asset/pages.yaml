  md: 'The interactive shell can distinguish between a request to execute a compiled
    and linked binary program versus a shell script. If it finds the #!, it knows
    it is about to execute a script. If it finds some other values in the first two
    bytes, the shell assumes that it is a compiled and linked executable and prepares
    to execute the program. The first two characters of a file contain the magic numbers
    (see man magic) identifying the type of file.


    #  Directories


    The permissions on a directory are the same as those used by files: read, write,
    and execute. The actual permissions, however, mean different things. For a directory,
    read access provides the capability to list the names of the files in the directory,
    but does not allow the other attributes to be seen (owner, group, size, and so
    on):


    The following example demonstrates that a directory without the execute permission
    disallows the display of file attributes. However, it allows the display of filenames
    within the directory. The ls -ld command requests permission information be displayed
    for the directory file, not the files within the directory. Here''s the example:


    ```

    $ mkdir ob # Make a test directory named ob

    $ ls -ld ob

    drwxr-xr-x 2 obrien users 8192 Sep 27 19:00 ob # Note r and x

    # permissions

    $ cd ob

    $ cat > tmp1 # Create a file in ob directory

    junk in file

    $ ls -l # No problem getting new file''s attributes

    total 1

    -rw-r--r-- 1 obrien 13 Sep 27 19:01 tmp1

    $ cd ..

    $ ls -ld ob # Show directory permissions

    drwxr-xr-x 2 obrien users 8192 Sep 27 19:01 ob

    $ chmod ugo-x ob # Remove execute permissions from all categories

    $ ls -ld ob # No execute permission for the directory

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_28_0.png)'
