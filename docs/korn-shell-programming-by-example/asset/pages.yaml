    the script makes a report on the differences between this run and the previous
    run (lines 279–299).


    The diff command output is placed in a temporary file with the current pid ($$)
    appended to the end (line 279). Line 280 stores the return code of the diff command
    for later analysis. The diff command returns a status of 1 if it finds differences.
    The grep command on line 281 eliminates some of the input lines from the diff
    file (-v means invert the meaning'
