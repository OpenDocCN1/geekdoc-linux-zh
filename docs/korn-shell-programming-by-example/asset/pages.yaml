  md: '# Data Manipulation


    Now that you have the power to control the flow of logic in your scripts, you
    can learn how to manipulate data within a script. Data can be displayed, changed,
    filtered, tested, compared, declared, or presented to a function. This chapter
    shows you some examples of the many forms of data manipulation.


    Many powerful constructs are shown in this chapter. You will see several examples
    of filters, as well as numerous test operators for files and strings. Along the
    way you will see how to manipulate data in functions and use it in computations.


    This chapter teaches you the following:


    +   * How to use command-line functions

    * How to present arguments to functions

    * How to use function return values

    * The difference between local and global variables

    * How to use object-oriented discipline functions

    * How to use a recursive function

    * How to autoload a function

    * How to use functions to extend the Korn Shell

    * The power of filters

    * How to use test operators for file and string testing'
