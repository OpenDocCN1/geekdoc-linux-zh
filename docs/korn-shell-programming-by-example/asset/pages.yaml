  md: "# Combining Tests\n\nIf you need to combine several tests, the Korn Shell provides\
    \ logical operators: || (or), ! (not), && (and), and != (not equal). Table 7.5\
    \ lists some of the operators available to form compound tests.\n\nTable 7.5:\
    \ Compound test operators\n\n| Test | True If |\n| --- | --- |\n| if [ test_1\
    \ || test_2 ] | Either is true |\n| if [ test_1 && test_2 ] | Both are true |\n\
    | [ ! test ] | Opposite of test is true |\n\nThe following is a pseudocode example\
    \ of a compound test:\n\n```\n...\nread ans?\"Sure? \"\nif [[ ${ans}=\"yes\" &&\
    \ ${ans}=\"yes\" && -f ${1} ]]\n    # user says yes and\n    # file on command\
    \ line\n    exists...\nm ${1}\n...\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_190_0.png)\n\
    \nWhen the condition is satisfied, the processing of the conditional stops. It\
    \ is sometimes referred to as *short circuiting* a test. You must be aware of\
    \ if you use compound tests. Consider a situation in which you need to find out\
    \ whether a > b AND c > d before executing some commands. If the shell finds that\
    \ a is not greater than b, why should it bother whether c > d? It knows that the\
    \ result of the compound if be false. This behavior mimics the C language. It\
    \ is not an issue unless some effects are produced by the second (nonperformed)\
    \ test. For example, if you have set up some discipline functions to trigger when\
    \ a variable is accessed, you might be surprised by the shell's actions (or nonactions).\
    \ The variable c would not have been accessed in the test discussed here. Be careful,\
    \ but don't avoid the compound test because of this minor and occasionally irritating\
    \ personality trait.\n\n# What's Next\n\nWhat a long and wondrous path you've\
    \ walked! You started out getting familiar with functions. Then, you found that\
    \ they bring modularity and conciseness to your scripts. You also saw that they\
    \ can be used in an objectoriented way and can be used to extend the Korn Shell\
    \ built-ins. You then visited the math functions and associated expressions. Along\
    \ the way, you also picked up the ability to work with floating-point variables"
