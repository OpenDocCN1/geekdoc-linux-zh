    Suppose you need to empty the contents of a file, but not delete the file. Clipping
    the end of a file is sometimes referred to as file truncation. Redirection to
    an existing file causes file truncation down to a size of 0 bytes.


    Each time the shell is asked to perform redirection of output, it makes several
    checks. It checks to see whether the target of the redirection is an existing
    file. If so, it checks to see whether noclobber is set. If not, the file is truncated
    down to 0 bytes in size, and the redirected output is used to repopulate the file.
    This behavior can be seen in a rookie''s use of the sort command, where the same
    file is used for input and output.


    The following example requests output redirection to a file that is used as input
    for the command. The first of things the shell does when it interprets a line
    is to look for redirection syntax (>, <, >> and so on. If it finds output redirection,
    it immediately truncates the target file to 0 bytes in size. In the example, the
    file to be sorted is truncated before the sort command gets its hands on the file.
    sort sees an empty file, so it doesn''t do anything:


    ```

    $ cat sortfile              # Unsorted file

    pears

    oranges

    apples

    beer

    $

    ```


