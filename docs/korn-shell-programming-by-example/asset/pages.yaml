  md: '# Output Control


    The vocabulary you have at this point in your life is not the same as it was manys
    years ago. The style and content of your speech has matured. Likewise, the way
    you produce output in your scripts has matured since the start of this book. You
    began by using the echo command exclusively. As you continued to mature as a script
    writer, you began using the more sophisticated, portable, and efficient print
    statement.


    You also went from the vanilla style of placing output on your terminal to using
    various forms of redirection to better achieve the goals of your scripts. Have
    you reached full maturation? Is there no further improvement possible on the styles
    and techniques you have already seen?


    This chapter examines the Korn Shell''s printf command as a logical extension
    of the print command, including a method for selectively redirecting output from
    loops. This chapter ends by taking a look at the often misunderstood here document
    capability that enables input redirection to be pointed towards lines within the
    currently executing script.


    This chapter teaches you the following:


    +   * The difference between the echo and print commands

    * How to use the printf command

    * Output redirection from loops and subshells

    * The difference between pipes and redirection

    * How to redirect stderr

    * How to use here documents


    ![](img/de6a3b5a3b516159c825f1c10314d877_258_0.png)'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# # Echoing Output


    One of the first commands a rookie UNIX wizard learns is the echo command. It
    is a simple program that places the input parameters from the command line on
    stdout. It''s easy enough for anyone to wrap his mind around. The echo command
    can be used in a pipeline to present input to a utility (as seen in the next example).
    In scripts, the echo command can be used for prompt display duty, as well as producing
    standard output.


    The following example uses the echo command to produce the input command to the
    ex editor. The following scripts use ex to search for any lines in the file containing
    a ?. All such lines are deleted when found. This eliminates all processes that
    are not associated with a terminal (the TTY column contains a?). A count of remaining
    lines is created using wc -1 and is displayed using substring removal of the largest
    pattern ($%%/). The pattern removal eliminates all characters from the first /
    to the end of the line. Without using the substring removal syntax, the count
    variable would contain a number followed by /tmp/newstats1234.


    ```

    $ ps lasw # Generate log output

    F UID PID PPID PRI NI VSZ RRS STAT TTY TIME COMMAND

    100 0 1 0 0 1104 368 do_sel S ? 0:04 init [5]

    040 0 2 1 0 0 0 bdlush SW ? 0:00 [kflush]

    (..)

    000 500 614 613 12 2084 1284 wait4 S pts/ 4:28 -ksh

    000 500 15954 614 19 0 2496 828 - R pts/ 0:00 ps lasw

    $ ps lasw | wc -1 # Note Line count

    34

    $ cat noquetions # Korn shell script

    !/bin/ksh

    ```


    ```

    ps lasw > /tmp/newstats$$ # Redirect output to temp file

    echo ''$7/d\nwq'' | ex /tmp/newstats$$ # Use echo to create input to ex command

    ```


    ```

    noques=$(wc -1 /tmp/newstats$$)

    print ''Count of processes using terminals is "${noques/*}\'' # Substring removal

    ```


    ```

    rm /tmp/newstats$$\ # Remove temporary file

    $ noquetions

    Count of processes using terminals is 13

    $

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_259_0.png)'
  merge: -1
  pgno: 259
- img_proc: true
  md: "# Echoing Output\n\nThe echo command has several options, including the heavily\
    \ used -n, which means not produce a newline after producing the prompt. This\
    \ enables a script writer to produce a prompt and have the cursor remain at the\
    \ end of the prompt string, rather than appearing on the next line. The slight\
    \ difference in the behavior of echo provided by the -n option is built into many\
    \ scripts. Here comes the bad news: Not all implementations of the echo command\
    \ understand the -n option!\n\nYou might ask, \"Aren't all Korn Shell implementations\
    \ the same?\" Most of them, but Korn Shell portability is not the issue. Suppose\
    \ UNIX has an administrative command called disklabel. Does that mean UNIX variants\
    \ have the same command available? Of course not. This is also true for the echo\
    \ command. What I'm trying to emphasize that the echo command can be implemented\
    \ as a separate program, and as such will be executed in a separate process. Therefore,\
    \ it has little to do with the Korn Shell proper.\n\nHaving said that, you will\
    \ probably find that ksh implementations do indeed have a built-in echo command,\
    \ but you can't rely on it being there. And if it's not built, it will be as a\
    \ separate program. The details of its behavior and option support is up to the\
    \ UNIX implementation.\n\nThe following example shows that using the echo command\
    \ can be a perilous choice. It shows that the -n option to produce no trailing\
    \ newline, whereas the built-in echo just sees it as more characters to echo to\
    \ stdout.\n\n![](img/de6a3b5a3b516159c825f1c10314d877_260_0.png)\n\n```\n$ find\
    \ -name echo 2>/dev/null # Echo executable program\n/bin/echo\n$ whence -v echo\
    \ # Shell has a built-in version\n$\n$ echo -n Say what? # Built-in does not interpret\
    \ -n\n-n Say what?\n$\n /bin/echo -n Say what? # Program does interpret -n\nSay??\n\
    ```\n\nHow do you create your scripts such that when they produce output, you\
    \ have a chance of being portable? I recommend getting into the habit of using\
    \ the print command. This command is built in the Korn Shell and has reliable\
    \ syntax. You have seen many examples of the print command in the last few chapters,\
    \ but here is a refresher example of the print command."
  merge: -1
  pgno: 260
- img_proc: true
  md: "# Chapter 10: Output Control\n\nUse the -n option to prompt with no trailing\
    \ newline:\n\n```\nprint -n \"Anybody out there?\"\n```\n\nUse the - option if\
    \ the output should consist of strings that can be mistaken as command options:\n\
    $ print -n\n\nUse the following escape sequences in your print commands to achieve\
    \ formatting needs (the -R option ignores these options). The following list documents\
    \ optional syntax that can be used within the print string to achieve non-printable\
    \ (generally) output:\n\n+   * \\a—Bell\n* \\n—Newline\n* \\f—Formfeed\n* \\r—Return\n\
    * \\t—Tab\n* \\v—Vertical tab\n* \\\\—Backslash\n* \\0—ASCII character with octal\
    \ value n\n* \\c—Same as the -n option, except it skips the remaining characters\n\
    \nThe following example uses the \\a sequence in a print string to make a bell\
    \ ring after the output is displayed. It provides an audio cue to pay attention\
    \ to the output:\n\n```\n$ print \"A bell has rung! \\a\"\nA bell has rung! \n\
    $ Makes a 'bing' sound.\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_261_0.png)\n\
    \nMany of the items to be displayed needs to be doctored up a bit before you send\
    \ it on its way to stdout. The following examples show some options available\
    \ by coupling the print command with variable substitution and escape sequences.\n\
    \nThe following series of examples uses the print command to display various parameter\
    \ expansion options. All escape sequences are also available to the print statement.\n\
    \n```\n$ x=\"Freddie is a dreamer.\" # Set contents of variable x\n$ print $ #\
    \ Display contents using print\nFreddie is a dreamer. \n$\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_261_1.png)"
  merge: -1
