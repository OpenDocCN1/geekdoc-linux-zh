  md: '# Table 7.1: Arithmetic operators


    | Operator | Operation |

    | --- | --- |

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulo |

    | >> | Bit-shift right |

    | << | Bit-shift left |

    | ^ | Exclusive or |

    | ~ | 1''s complement |

    | & | Bit-wise and |

    | | | Bit-wise or |

    | = | Assignment |

    | op= | +=, -=, ... |

    | ++ | Increment |

    | -- | Decrement |


    Note that many bit-oriented operations are supported. Several of these are used
    in the example at the end of this section. If you''re going to become a bithead
    in your scripts, you''ll probably want to express values in numbering systems
    other than good old base 10. A typical base 10 variable declaration might look
    like this:


    ![](img/de6a3b5a3b516159c825f1c10314d877_176_0.png)


    ```

    $ typeset -i a=17

    $ (( a=a+1 ))

    $ print a

    18

    ```


    ```

    $ integer b=12

    $ let a=a+b

    $ print a

    30

    ```


    To indicate hex (base 16), you would use the following:


    ```

    $ typeset -i16 hexnum=5A # Shell needs to be told that 5A is hex

    -ksh: typeset: 5A: arithmetic syntax error

    $

    $ typeset -i16 hexnum=16#5A # Base#value is the correct format

    $

    $ print $hexnum

    16#5a

    $

    $ printf "%d\n" $hexnum # Decimal value displayed

    ```'
