    \ calculation or display. This example does some simple addition repetitively.\
    \ The time spent performing the conversions causes the previous script to run\
    \ more than twice as slowly as the script in the next example:\n\n![](img/de6a3b5a3b516159c825f1c10314d877_266_0.png)\n\
