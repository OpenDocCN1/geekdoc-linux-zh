    ```


    sets vi to be the default built-in editor for Ksh. To turn off an option, a plus
    sign instead of a minus sign, as shown in the next example:


    ```

    set +vi

    ```


    If it seems like the plus and minus should be reversed, remember that this came
    about as an option to a command. Options for commands are indicated by the minus
    sign (-), such as ls -1 or shutdown -r. The plus sign (+) indicates to turn something
    off.


    # Variables


    Variables are used to store values. In the following equation, two variables—x
    and y—are given:


    ```

    x + y = 4

    ```


    In this particular case, you can infer that the variables associated with the
    variables are numeric. But variables can just be character-based. Variables are
    used extensively in programming, so more will be discussed later. A variable is
    a name/value pair. The variable has a name, called varname—x and y, previously
    shown—and a value, such as 2 or /home/shell in the following example:


    ```

    $ echo $HOME

    /home/shell

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_39_0.png)


    The dollar sign ($) is placed in front of the varname to indicate that you are
    accessing the value of the variable. It forces the shell to check its table of
    variables to see whether it contains a variable matching the name appearing after
    the $. If the varname is followed immediately by other characters or the underscore,
    the varname must be enclosed in curly braces { This can be useful if you are trying
    to concatenate two variables. The curly braces can be used even when not necessary.


    The following example shows an instance in which the curly braces are mandatory.
    Without them, the shell looks for a variable USERisadude, which doesn''t exist.
    Surrounding USER with the curly braces'
