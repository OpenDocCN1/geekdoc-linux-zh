  md: '# Traps


    Rather than waiting to hear through the grapevine about your teenager''s latest
    hi-jinks and then ranting and raving long after the fact, wouldn''t it be wonderful
    if untoward action generated an “admonishment from parent,” which echoed in his
    head as if it were between two stereo speakers and you controlled the volume and
    content? Or how about a mechanism where every time he leaves the house there is
    an automatic litany of do''s and dont''s that stray into his mind? If either of
    these mechanisms sounds enticing, you will find the Korn Shell''s capability to
    trap events to be of


    Consider two of the most common events that occur during the execution of a script:
    errors and exits. The errors referred to here are not the syntax and script creation
    time errors. This chapter''s focus is on runtime errors.


    This chapter teaches you the following:


    +   - How to define and use script traps

    - The importance of comments in scripts

    - How to build help within a script

    - How to bulletproof your script'
