  md: 'reacting to the error messages. Remember that stderr is associated with file
    descriptor 2. Therefore, the redirection syntax for stderr is 2>, which means
    redirect file descriptor 2. You can also use the syntax 1> to indicate stdout,
    although no script that I have ever seen does that.


    The following are examples of stderr redirection:


    ```

    $ payroll < emps1 >pay.out 2> pay.err

    # payroll program gets input from emps1

    # writes output to pay.out

    # error messages go to pay.err

    ```


    ```

    $ payroll >pay.out 2>&1

    # make 2 (stderr) be the same as 1 (stdout)

    ```


    ```

    $ noerrprog 2> /dev/null

    # errors to bit bucket

    ```


    If any of these redirection options end up clobbering a file or two, you might
    be interested in this next Korn Shell capability. You can prevent clobbering (overwriting
    of existing files by redirection) by setting the noclobber option using the following
    syntax:


    ```

    $ set -o noclobber

    ```


    Later on, you might want to override the noclobber option. You can turn it off
    with the following syntax:


    ```

    $ set +o noclobber

    ```


    Or, you can override the option for a particular command by using the following
    syntax:


    ```

    $ prog >bagfile          # writes even if bagfile exists

    $ prog >>bagfile         # writes even if bagfile does not exist

    ```


    # Coprocess


    Occasionally, a script needs to present input to a program, command, or another
    script, but not at all. For instance, you might need to present one item during
    the beginning of your script, others during the run, and still others at the end.
    This is generally done by redirecting some input to the appropriate target program.
    It can also be done through a pipeline. as you saw earlier, a command to the left
    of the pipe operator serves its output as input to the command to the right of
    the pipe operator. So piping operation is similar to performing redirection, BUT
    NOT TO A FILE! The redirection is done to the PIPE instead, and the pipe is connected
    to the next process in the pipeline.


    Now consider a situation in which you need to get input to a program through a
    pipe, but you need to pipe it to many items throughout the run of'
