  md: 'you want to search for the same string again, you can type the n command,

    which means find the next instance of the search string.


    Table B.1 documents the most commonly used search commands available

    within the vi editor.


    # Table B.1: Search commands


    | Command | Description |

    | --- | --- |

    | /str/ | Searches forward for next instance of str. (This won''t work without
    the

    trailing / as well.) |

    | n | Finds the next instance of str. |

    | // | Finds the next instance of str. |

    | ?str? | Searches backward for str. |

    | ?? | Finds the next instance (backward). |


    To replace a string (as it is) with another string, you must use the

    stitute command. This command is a last-line mode command, so it is

    preceded by a colon (:). The syntax is shown here:

    :original str/replacement str/


    The 1,$ means start at line one and proceed until the end of the file. The g

    do mean it globally on one line. It takes care of the situation in which the

    search string is found more than once on the same line and also appears on

    many lines within the file. As you can tell, this is a powerful construct.


    The following example searches the entire file for instances of the string

    Digital UNIX and replaces them with the string Tru64 UNIX:

    :1,$/Digital UNIX/Tru64 UNIX/g


    Table B.2 documents the most commonly used substitute commands avail-

    within the vi editor.


    # Table B.2: Substitute commands


    | Command | Description |

    | --- | --- |

    | :s/orig/new/ | replaces the first occurrence of orig with new on current line
    |

    | :s/orig/new/g | Current line; handles multiple instances of orig on same line
    |

    | :1,$s/orig/new/ | All lines; first instance of orig on each line is replaced
    |

    | :1,$s/orig/new/g | All lines; all instances are replaced. |'
