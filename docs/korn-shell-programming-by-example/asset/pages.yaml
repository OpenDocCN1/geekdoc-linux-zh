    | # | Comment Character |

    | # | Substring operator, left truncate |

    | # | Default primary prompt for superuser |

    | $ | Default prompt |

    | $ | Parameter expansion |

    | $ | Special parameter |

    | % | Substring operator, right truncate |

    | % | Job identifier |

    | & | Asynchronous background execution |

    | '' | Single quote |

    | - | No options |

    | ( | Subshell grouping |

    | ) | Subshell match on pattern |

    | * | Wildcard match |

    | . | (dot) Working directory |

