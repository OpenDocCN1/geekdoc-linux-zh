  md: "# Directories\n\nMost UNIX users labor under the misconception that the information\
    \ visible from an ls -1 command is held in the directory file. However, most of\
    \ this information is actually held in the inode that represents the file. Each\
    \ inode is approximately 128 bytes in size. The first 64 bytes usually hold the\
    \ file type, permissions, link count, owner, group size, modification date, access\
    \ date, and metadata modification date.\n\nThe inode does not hold the file's\
    \ name. The filename is held in the directory file. And the directory file associates\
    \ the filename with an inode number. The number is used as an offset onto the\
    \ inode-disk file to find the metadata for a file. The second 64 bytes of an inode\
    \ contain location information indicating where the actual data of the file can\
    \ be found. Think of the inode as the file's header, and the actual file contents\
    \ as the file's body.\n\nThe following example shows two files in a directory,\
    \ and then uses od -x command to dump out the raw contents of the directory file\
    \ in hexadecimal (base 16). (Check the od man page on your system to see which\
    \ options you can use. The -x option might not be available on all systems.) The\
    \ ls asks the utility to show any strings that are in the file. The output shows\
    \ the string dennn associated with the number 6583 (hex), and then the string\
    \ cheryl1111 associated with the number 6584 (hex). It uses the bc command (basic\
    \ calculator) to display the hex equivalent of the decimal inode numbers 25988\
    \ and 25987:\n\n```\n$ pwd\n/usr/users/obrien/subdir\n$ ls -li\ntotal 8031\n25988\
    \ -rw-r--r-- 1 users 8192000 Nov 2 16:14 cheryl1111 # Note name and inode numbers\n\
    25987 -rwx-xr-x 1 obrien users 30910 Nov 2 16:14 dennnn\n$ cd ..\n$ \n$ od -x\
    \ subdir\n000000 0006582 0001014 0000082 0006582\n000020 0000801 0006367 0002014\
    \ 0002e2e\n000040 0006367 00067001 0006583 0060018\n000060 6e6e6564 0006e6e 0006583\
    \ 0008111 # Inode is 6583 (hex)\n000060 dennnn # Note name\n000100 0006584 0009001c\
    \ 7265863 6c6c8c79\n000120 000000c 0006c584 00080001 0000000 # Inode is 6584 (hex)\n\
    000110 cheryl1111 # Note name\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_232_0.png)"
