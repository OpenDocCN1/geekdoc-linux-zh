  md: "# Bulletproofing\n\nBut what happens if you pick a number between 999999999\
    \ and 9999999999? It reports an incorrect result! So you have more work to do.\n\
    The problem is that when checking for out-of-range values, you need\nto somehow\
    \ perform math involving a value that is too large to express.\nHow can you do\
    \ that?\n\nThe solution is to eliminate the rightmost numeral from your test numbers,\n\
    \ then check the range (the numbers must be stored in strings at first).\nIf the\
    \ outcome is in doubt, you must isolate the rightmost numeral and\ncheck against\
    \ the rightmost numeral in the maximum supported value.\n\nAre we over the top\
    \ here? Maybe. But I think you are getting the point\nif you want to make a bulletproof\
    \ script, it takes some serious work.\n\nThe following example prepares for some\
    \ of the extremes in range testing.\nIt should prevent user input beyond the supported\
    \ integer range on the system- (it assumes a 32-bit system).\n\n![](img/de6a3b5a3b516159c825f1c10314d877_300_0.png)\n\
    \n```\n$ cat gcdsh\n#! /bin/ksh\n\ninteger BITS-32\ninteger len max quot\n```\n\
    \n```\nmax=$(1 << BITS-1)    # Generate maximum value for this system\nlen=${#max}\
    \                     # How long is the value\nlen-1=${max?}                 \
    \  # Decrease by 1 for sign\nquot=${max%?}                   # Maximum value with\
    \ rightmost numeral eliminated\ntypeset -R1 rem=$max           # Isolate the rightmost\
    \ numeral, store in rem\n```\n\n```\nfunction gcd {\n  integer u v r\n\n  u=$1\n\
    \  v=$2\n  while ((v))                   # Continue while v != 0\n  do\n    r=u%v\
    \                      # Main calculation for gcd\n    u=v\n    v=r\n  done\n\
    \  print $u                      # Return value to caller if function\n      \
    \                       # called using G=$(gcd) ...\n}\n```\n\n```\nfunction syntax\
    \ {      # Main syntax error report function\n  print -u2 Usage: \"${0##*/} {integer_1}\
    \ {integer_2} ...\"\n```"
