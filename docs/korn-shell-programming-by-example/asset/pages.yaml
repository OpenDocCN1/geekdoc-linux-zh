  md: '# Chapter 8: Information Passing


    your script. The implementation is not difficult if you are willing to accept
    some performance degradation. Remember that in UNIX, every time a command is executed,
    it is executed in the context of a UNIX process. Each UNIX process has internal
    support structures and other resources that need to be allocated, and all this
    takes time.


    Without getting into the internals of it, trust me, it would be massively more
    efficient to run the target program once, and have it in existence while you occasionally
    ask it to process another piece of pipelined input.


    Needless to say, you will also want to capture responses from the program running
    in parallel with yours. A script can achieve this bidirectional pipeline capability
    through the use of a coprocess and two pipes. Be aware, however, that this is
    a powerful capability that is not used heavily because most script writers are
    only vaguely aware of the coprocess concept and syntax.


    I hate to use the teenager analogy, but what the heck. You''re into it now, right?
    Imagine an off-the-cuff argument with your teenager. Remember all those times
    when, after it was over, you said to yourself, “I should have said ..., so you
    went back and said, “... and another thing ...”


    The difference between using a coprocess and not using a coprocess is the same
    as if you had to start the argument from each time you remembered something else
    you wanted to say, rather than just saying, “... and another thing ...”


    Can you see the waste in starting over for each item of input? It would be like
    having to start the argument over again from the beginning point, even though
    you just wanted to add one last little jab. The following example uses a sophisticated
    utility called dbx, which is used to debug user programs or to run kernel cells.
    You''ll see this being used without a coprocess first, and then with a coprocess.(Another
    example of using a coprocess is shown in Chapter 13, "Pulling It All Together.")
    It creates a coprocess running another instance of ksh to which your script presents
    commands.


    Figure 8.1 depicts the communication between your script (coproc1) and the coprocess
    running dbx.


    You don''t need to focus on the dbx utility as you read the example. Instead,
    focus on the concept of a coprocess, which is a process that coexists with another
    process and communicates through pipelines. The following example uses dbx to
    examine a kernel cell (lbolt) without using a coprocess.


    Figure 8.2 depicts what happens when you don''t use a coprocess.'
