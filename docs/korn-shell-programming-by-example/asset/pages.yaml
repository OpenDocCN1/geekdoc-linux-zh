  md: 'Either method helps you bulletproof your script if you build in absolute paths
    for commands. You might feel that this makes the script cumbersome and unwieldy.
    If so, try hiding the actual locations of the commands in shell variables. Even
    though this technique might not get rid of the cumbersome feeling, it can prevent
    errors that might have cropped up if you had to repeat the full file spec for
    each and every invocation of the ls command.


    The following example creates a shell variable to hold the directory location
    for the ls command and uses it to avoid inadvertent use of aliases:


    ```

    $ ls=''/bin''

    # Create shell variable containing

    # directory spec for ls command

    $

    $ $ls/ls  # Use absolute spec through shell variable

    getppidfunc.c

    ```


    # Descriptors


    As discussed in the previous chapter, a file descriptor is a small integer value
    representing an open file. You might recall the three famous stdin, stdout, stderr.
    These mnemonics represent file descriptors 0, 1, and 2, respectively. They are
    usually open and typically represent your terminal display device. When you use
    the redirector on the command line, you are altering file descriptor 0, 1, or
    2 (stdin, stdout, or stderr).


    The following example uses the > and >> symbols to redirect output to a file (>),
    and also redirect output and append it to an existing file (>>):


    ```

    $ date > stats # Put output of date command into stats file

    $ vmstat >> stats  # Append vmstat output into stats file

    $ cat stats

    Mon Oct 16 13:00:15 EDT 2000

    ```


    | procs | memory swap | system cpu |

