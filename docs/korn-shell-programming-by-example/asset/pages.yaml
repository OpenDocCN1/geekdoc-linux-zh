- img_proc: true
  md: '# What''s Next


    The next things that appear are a literal comma and a space, which means it must
    match those two characters exactly, but you are not requesting that they be captured
    in a back reference location.


    After that, you see another \(, which begins the second back reference match.
    The contents of the back reference parentheses (*) combination, which indicates
    multiple character match (*) of any characters (.). So, the second back reference
    location gets the characters after the comma and space (the rest of the line).


    Now so that sed knows what it is supposed to replace the pattern with? The final
    pair of slashes contain the \2 \1 sequence. As you have probably figured out by
    now, they indicate the contents of back reference location two, and the contents
    of back reference location one.


    What could be easier than that?


    Although the back reference capability is probably not one you will use every
    day, it is a very powerful tool to have in your arsenal. When the need occurs,
    grab this book off, refresh your memory, and have a go at it.


    # What''s Next


    The we regular expressions are used varies the Korn shell and many other applications
    and programming languages. Not only that, the implementation of regular expressions
    is the most widely varied topic within the Korn shell environment. This means
    that some of the topics discussed in this chapter might not work with your particular
    implementation of the Korn shell.


    Most of the basic regular expressions used in this chapter should work across
    the board, with the back references section being the obvious exception to this
    rule.


    As a summary, regular expressions are a way of describing a set of strings through
    pattern matching. Learning the basics of regular expressions will save you hours
    of coding and logic-solving.


    Up to this point, quoting has been used without much explanation as to when and
    when not to use it. Chapter 5, "Quoting," delves into quoting and gives examples
    of how to use various quotes to get the desired results and ensure that the program
    does exactly what you intend.'
