  md: 'has saved me hours of work. I usually take a few minutes and provide some simple
    headers and some quick explanations of what I am doing in a script. Comments are
    the way to add these simple headers and quick explanations within your script.
    In shell scripting, a comment runs from where the pound sign (#) begins to the
    end of the line. Therefore, something like this is feasible:


    ```

    $ ls -l # give a listing of all files in the current directory

    ```


    But the shell will interpret this as follows:


    ```

    $ ls -1

    ```


    This is because the shell ignores everything from the pound sign to the end of
    the line unless it is the first line of the program and the character following
    the pound sign is an exclamation point. This means that a comment can either be
    a part of a line with a command, such as this:


    ```

    $ ls -1 # this command gives a listing of all files in the current directory

    ```


    Or it can be on a line by itself, such as this:


    ```

    $ # The next command gives a listing of all files in the current directory

    ```


    ```

    $ ls -1

    ```


    # The .profile Script


    In its simplest form, a script is nothing more than one or more commands clumped
    together in a file. The file had its permissions adjusted so that the intended
    user(s) has both read and execute permissions. The obvious reason for such a file
    is user friendliness. Using a script can save typing. Instead of typing the same
    thing over and over again, you can save the commands in a file and execute the
    commands by typing in the name of the script.


    In reality, scripts are much more than that. Scripts typically contain a large
    number of commands, logic flow statements, and other information that simplifies
    a task. One nice thing about a script is that it enables you to automate some
    process. For example, in my home directory a program called .profile runs automatically
    every time I log on:


    The following example shows a typical user''s .profile file. It sets up the user''s
    PATH variable (used to locate command files), creates a non-default prompt, sets
    the umask value, and defines several environment variables.'
