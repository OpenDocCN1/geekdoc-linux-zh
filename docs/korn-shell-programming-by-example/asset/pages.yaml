- img_proc: true
  md: '# Pulling It All Together


    Every now and then, it all comes together. The sun shines. The wind is at your
    back. The air is crisp. You feel like you can do anything and do it well. Your
    strength and confidence come from having learned from all your past experiences
    and synthesizing that information into a pool of knowledge from which you can
    draw when necessary. That summarizes where we are in the book.


    You certainly don''t know everything (nobody does). Just as life can throw some
    unexpected curves at us, our script writing can draw us into situations for which
    we are less than fully prepared. You are, however, ready to confront a computing
    need, and address that with a fairly sophisticated script. I sincerely hope that
    the lessons learned throughout this book will serve as a springboard for further
    growth and insights into the world of script writing.


    This chapter presents a script that uses many of the techniques discussed in the
    book. The script executes many system admin commands and checks their output against
    a baseline file. If anything has changed since the baseline was taken, a report
    is displayed. The user has the option of re-executing selected commands or just
    viewing the differences.


    Many interesting shell constructs are used throughout the example, including the
    following:


    +   - Functions

    - Coprocess

    - Looping constructs (for and while)

    - Filters and pipes

    - Traps

    - Here documents

    - Arrays'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# The sys_check script


    The following script is shown in a vi session with the number option set. In a
    vi session, the last line-mode command, :set number displays line numbers at the
    beginning of each line.) First, few of the command-line options built into the
    sys_check script are used; then, several sample runs are shown after the script
    is introduced. The example also provides some preliminary insight into the run
    of the script. The baseline file (and other files) will be stored in /root/checkit/.
    The baseline file contains the output of the first effective run of the script.
    You will see that the script reacts differently if no baseline exists (it creates
    it). I will provide commentary on many of the lines in the script later in the
    chapter.


    # Command Options -h


    The following example shows the -h option requesting help concerning the script:


    ```

    # /sys_check -h

    Usage: syntax [-n] [-h]

    -n: Print list of commands to be executed, do not execute.

    -h: Print help message.

    ```


    # Command Options (Invalid)


    The following example shows how the script reacts to an invalid option on the
    command line. The script has no special error checking for command-line arguments
    (as opposed to options, which it does handle); it simply ignores them:


    ```

    # /sys_check -a

    sys_check: unrecognized option ''\a''\nUsage: syntax [-n] [-h]

    -n: Print list of commands to be executed, do not execute.

    -h: Print help message.

    ```


    # Command Options -n


    The following example shows the -n option requesting a list of the commands to
    be executed. The -n option does not request that the commands actually be executed.
    The default action is that the script executes the commands and checks for differences:'
