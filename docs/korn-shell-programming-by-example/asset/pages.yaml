  md: 'owner of the file has read, write, execute permissions, and everyone has read
    access only:


    ```

    $ ls -l test

    -rw-r--r-- 1 obrien users 24 May 13 16:57 test

    ```


    The command -l test tells the computer to retrieve a long (-l) listing

    (ls) of the file (test). The second line is the result of the command.


    Therefore, the permissions are made up of 10 character positions. A dash

    (-.) indicates no permission granted for that category of user (user, group,

    others) for capability (read, write, execute). The user category would

    probably be served if it were named owner, but that would lead to

    confusion between o for others and o for owner. Refer to Table 1.1 to identify
    many entries that could be found in

    the first position. The first field is a little dif-ferent.


    # Table 1.1: Object type identifier


    | Character | Description |

    |---|---|

    | - | Plain file |

    | b | Block special file |

    | c | Character special file |

    | d | Directory |

    | 1 | Symbolic link |

    | p | Named pipe |

    | s | Socket |


    Following the file type identifiers are the three sets of permissions: rwx

    (user), r-- (group), and r-- (other).


    > NOTE

    A small explanation needs to be made as to what read, write, and execute exactly

    mean. For a file, a user who has read permission can see the contents of a file;
    a user

    with write permission can write to it; and a user who has execute permission can
    exe-

    cute the file. If the file is a script, the user must have read and execute

    permissions to execute the file. If the file is a binary file (created through
    a compile

    link sequence), just the execution permission is required to execute the file.


    A compiled and linked binary file is created when a high-level language program
    (C,\ COBOL, FORTRAN, Pascal, Ada, C++, and so on) is presented to a program called
    ancompiler, which translates the C code into machine instructions to be executed
    when

    t program is running. The compiler sends its output to the linker program, which
    resolves

    any global references and produces a binary executable file.


    This type of executables run four or five times faster than each shell script
    in which

    line must be interpreted and potentially executes a process per line. In-

    trast, compiled and linked program is much more difficult to write, but executes
    more

    quickly. A script should be faster to write (and easier), but executes more slowly.'
