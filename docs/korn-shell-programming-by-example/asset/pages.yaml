  md: '# Regular Expressions Versus Wildcards


    The Korn shell uses a form of regular expressions similar to those used by grep,
    awk, sed, and other programs. Be aware that the regular expressions used by utilities
    like sed and grep are not to be confused with filename expansion used by the shell.


    Unfortunately, most syntax for filename expansion (some-called *wildcards*) is
    the same as the syntax for string pattern-matching regular expressions. You must
    take a breath and ask yourself what you are trying to do. Does it involve filenames,
    or does it involve string patterns? The next sequence shows some filename expansion
    (wild-cards) expressions being used:


    ![](img/de6a3b5a3b516159c825f1c10314d877_103_0.png)


    ```

    $ ls

    brr obr obrr regetest # four files in the directory

    $

    $ ls obr # no wildcards used

    brr\$

    $ ls obr? # single character match wildcard (?)

    brr\$

    $ ls obr* # multiple character match wildcard (*)

    brr obr obrrr

    $

    $ ls obr.* - pattern ''.*'' has no special meaning

    ls: obr.*: No such file or directory

    $

    ```


    The next sequence shows regular string expressions being used. Note that you can
    start off by thinking of any string as a regular expression, but their power is
    shown when the special characters are used for pattern matching:


    ```

    $ cat regetest # file contents

    brr

    obrr

    brrr

    brrrrabrcrr

    $ grep ''obr'' regetest # uses regular expression

    # containing no ''special'' characters

    brr

    obrr

    brrr

    brrrrabcbrrr

    $

    ```'
  merge: -1
  pgno: 103
