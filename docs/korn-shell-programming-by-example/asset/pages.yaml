  md: "responses results in making the script bulletproof. A bulletproof script is\
    \ one in which the user's input is thoroughly checked for safety before being\
    \ processed. This can require some extensive testing. If the script is for personal\
    \ use, you might not want to spend the time bulletproofing your script, but it\
    \ is a good habit to develop. The following example builds on the umask example,\
    \ but it checks the user's input to ensure that it is reasonable.\n\nGenerally,\
    \ if a way to break your script exists, users will find it. Either they will specifically\
    \ search for the holes in your logic, or they will stumble across your script's\
    \ weaknesses inadvertently. The most obvious example of input that would break\
    \ your umask script is if the user presented some input that was out of range.\
    \ The valid values for the umask are between 000 and 777, which means no numbers\
    \ higher than seven can exist in any of the three numerical positions. The following\
    \ example scopes out that potential foul-up:\n\n![](img/de6a3b5a3b516159c825f1c10314d877_208_0.png)\n\
