    | 0 0 0 | 2124 808 13616 7860 0 0  1 | 0 108 6 0 100 |


    Other descriptors can be used to represent other files you might want to open
    in your script. The Korn Shell (and other shells) has so many file manipulation
    commands built into it that the need to directly open a file and read individual
    lines is rare. However, for advanced file processing where you might want to have
    access to data in several files at once, the Korn Shell provides the exec command
    to open access to a file(s).


