    You can execute your script within your current process by issuing the dot command:

    $ .your_script


    This option is useful when executing your .profile file after adding a few lines
    to it. Rather than logging out and then logging back in to .profile to execute,
    you can execute it as a script. If you want the changes to be in effect after
    the script finishes executing, this is the technique to use. Be aware, however,
    that any variables altered within the shell will have an effect on the environment
    of the shell which the script was executed.


    The most common way to execute a script is to make the script file executable
    and type the script name at the shell prompt. This causes the script to execute
    as a command. A process is created within which to execute the script. From a
    debugging perspective, all shell attributes are inherited by the script you are
    executing. This is the technique you have been using throughout the book so far:


    ```

    $ chmod u+x my_script

    $ my_script

    ```


    The man page ksh details several options for debugging. An important point to
    keep in mind is that you don''t have to perform all your script testing through
    a script file—syntax can be checked at the command line. This option provides
    a simple and efficient way to check for errors in the syntax of your shells.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Command Interpretation Sequence


    Understanding the way the shell interprets a command is an important debugging
    tool. The following sequence describes the order in which the shell interprets
    a line of your script:


    +   1. Process the following reserved words:


    ```

    { }

    esac es select

    case fi then

    do for time

    done function until

    elif if while

    else in [[ ] ]

    ```


    +   2. Process built-in commands:


    ```

    alias exit bg

    export return fg

    readonly trap kill

    typeset echo wait

    ialias print:

    unset read fc

    set cd getopts

    shift pwd let

    break times newgrp

    continue ulimit test

    eval umask whence

    exec jobs

    ```


    +   3. Search for functions on the command line.


    +   4. Search for aliases on the command line.


    +   5. Use the PATH variable to identify directories in which to look up programs/scripts.
    These programs must have execute access enabled.

    The directories in the PATH variable are delimited with a :'
  merge: -1
  pgno: 279
