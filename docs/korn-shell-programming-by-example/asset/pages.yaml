  md: '# Object-Oriented Discipline Functions


    The nameref keyword is available in ksh93 and beyond. Check your version by pressing
    the Ctrl+V sequence.


    One of the cornerstone concepts of object-oriented programming is to be able to
    associate certain functions with certain actions on a data object. The Korn Shell
    provides for three types of functions you can associate with actions on a data
    object (Note that discipline functions are available in ksh93 and above.) As you
    might have guessed, the data object in the Korn Shell is a shell variable. The
    supported action functions are as follows:


    +   - get—Called automatically when the variable is accessed (referred to as an
    accessor method in C++)

    - set—Called automatically when the variable is assigned a value (referred to
    as an assignor method in C++)

    - unset—Called automatically when the variable is unset (referred to as a destructor
    method in C++)


    Note that all these functions are called automatically—you never call the function
    explicitly. It''s called for you as the variable is used during the run of your
    script. Sounds pretty different, huh? This concept is a bit of a leap for the
    Korn Shell (and I suspect it is for for you and me, too). Needless to say, some
    special syntax is required to support this capability. The functions as described
    previously are referred to as discipline functions. This is probably because they
    must be disciplined enough to adhere to a strict set of rules dictating when they
    are to be called.


    For variable x, the discipline functions can be defined using the function names
    of x.get, x.set, and x.unset. Within the discipline functions, special reserved
    variables are available to access the name of the variable you are manipulating
    (.sh.name), the value of the variable you are manipulating (.sh.value), and the
    name of the script if you are examining an array element (.sh.script). The following
    example sets up several discipline functions using several reserved:


    ```

    $ cat dow6

    #! /bin/ksh

    integer count=0              # Global variable

    function data_object.set      # Set discipline function

    # for variable data_object

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_169_0.png)'
