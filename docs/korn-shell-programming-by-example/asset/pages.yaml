- img_proc: true
  md: '# Chapter 1: The Environment


    Table 1.3: Comparison of file and directory permission combinations

    | Permission | File | Directory |

    | --- | --- | --- |

    | -- | Cannot do anything. | Cannot access it or any of its subdirectories. |

    | r-- | Can see the contents. | Can see the contents. |

    | rw- | Can see and alter the contents. | Can see and alter the contents. |

    | rwx | Can see and change the contents, as well as execute the file. | Can list
    the contents, add or remove files, and make the current directory (cd to it).
    |

    | r-x | If a script, can execute it. Otherwise, it provides read and execute perms.
    | Provides capability to change directory and list contents, but not to delete
    or add files to the directory. |

    | ..x | Execute if a binary. | Users can execute a binary they already know about.


    As stated, the basic concept is the same as the letter coding system. As a matter
    of fact, the permissions look exactly alike—the difference is in the way the permissions
    are identified when using the chmod command. The numeric system uses binary counting
    to determine a value for each permission and sets them. Also, the find command
    can accept the numeric form of the permissions as an argument, using the -perm
    option, providing the capability to locate files containing certain permission
    values.


    With binary, you count from right to left for each set of values. Therefore, if
    you look at a file, you can easily come up with its numeric coding system value.
    The following file has full permissions for the owner and read permissions for
    the group and the rest of the world:


    ```

    $ ls -l test

    -rwxrxr-- 1 shell 24 May 13 16:57 test

    ```


    This would be coded as 744. Table 1.4 illustrates how this number was developed.


    # Table 1.4: Permission access values


    | Permission | Value |

    | --- | --- |

    | Read | 4 |

    | Write | 2 |

    | Execute | 1 |'
