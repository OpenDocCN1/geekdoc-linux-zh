  md: '# Redirection 195


    you understand output redirection. The goal is to take an output stream that is
    going to its normal place (such as your ear or the terminal) redirect it so it
    goes some other place (such as someone else''s ear or a file).


    Output redirection provides the capability to capture the output of a command
    or a script in a file. The following examples show some basic output redirection.
    Note that > at the end of a command requests stdout redirection, whereas >> also
    requests stdout redirection but appends the output to an existing file. If a file
    already exists and you redirect output to the existing file using >, the current
    contents of the file are lost. This is referred to as clobbering an existing file.


    When the shell sees a line that has an output redirection indicator at the end
    of it, the first of things it does is truncate the existing output file down to
    zero bytes in size. Then, it places the current output stream in the file. This
    usually has some disastrous consequences for the novice UNIX user. Incidentally,
    uparious is only a hop away from disastrous. Imagine that the file inadvertently
    clobbered was your startup''s critical R&D database!


    Fortunately, the Korn Shell provides a technique for avoiding clobbering when
    you don''t want to clobber—a shell option called, you guessed, noclobber. It can
    be set with the set -o noclobber command. Picture a rookie user trying to sort
    some database. It makes sense to use a command such as the following:


    ```

    sort infile > infile

    ```


    You have no desire to end up with two copies of the data, so this command seems
    reasonable. Unfortunately, the shell sees the > before the sort is even started.
    So, the first thing that happens is the file infile is truncated down to zero
    bytes. Then, the shell—feeling all smug and happy because it has done its duty
    for its good friend sort—kings in the sort command, which sees an input file named
    infile that has zero bytes of data to be sorted. The sort command then does its
    duty, which is to sort nothing, and produces an output file named infile—which
    contains nothing. Poof, away goes your data, your credibility, and maybe your
    company goes belly up also. Okay, I''m exaggerating, but did you get my point?


    The following are some examples of stdout redirection:


    ```

    $ ls > ls.man          # man pages sent to file

    $ cat >> ls.man      # appends to ls.man

    $ (date); > stats     # output of subshells to stats file

    ```


    If you can redirect stdout, you must be able to redirect stdin. The symbol for
    stdin is <. Imagine every time your teenager goes out on a date, you preach the
    same litany of do''s and don''ts to him. Your'
