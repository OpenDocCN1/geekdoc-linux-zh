    \ : arithmetic syntax error\nSomewhere, you must check the user's response and\
    \ see whether it makes any sense. If it doesn't, you should help the user to understand\
    \ their mistake (or you could blow it off and just bomb out of the script). The\
    \ following example tries to capture aberrant input and react accordingly:\n$\
    \ cat masks_ask2\n#!/bin/ksh\n#\n# Script which will display default\n# permissions\
    \ in formatted fashion\n# based on the requested umask setting, checks for bogus\
    \ input\n#\nfunction gen_modes\n{\n(...)\nread inumask?\"What umask would like\
