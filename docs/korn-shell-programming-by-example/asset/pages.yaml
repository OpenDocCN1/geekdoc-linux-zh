  md: "Now that you have reviewed the ways to respect and now that you know the order\
    \ in which a command line is a script is interpreted, you can execute your script\
    \ and react to the errors, incorrect output, or non-output it produces. You might\
    \ even be able to bask in the satisfaction of having created something that works,\
    \ is useful, and is the product of your own feverish brain.\n\nBefore actually\
    \ attempting to execute the script, you can give it a dry run. Using the ksh noexec\
    \ option (-n), you can ask the shell to check your commands for any syntax errors.\
    \ It's sort of like asking the boss's secretary, \"How do I look?\" before going\
    \ in for your promotion interview. If she says,\"Straighten that tie before you\
    \ go in,\" you've saved the embarrassment of being told later that you lost the\
    \ job because you looked disheveled. I highly recommend this pre-emptive syntax\
    \ check before executing any semicomplex ksh script.\n\nThe following example\
    \ uses ksh -n to check syntax in a script file. It reports error, which is subsequently\
    \ corrected.\n\n```\n$ ksh -n masks_env_bad              # ksh -n complains about\
    \ line 50\nmasks_env_bad: syntax error at line 50: 'newline' unexpected\n$\n sed\
