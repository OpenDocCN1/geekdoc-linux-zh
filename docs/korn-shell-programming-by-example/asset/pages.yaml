  md: "It can be written so that it checks the contents of certain environment variables\
    \ and branches inside the logic of the script based on what it finds in the variable.\
    \ Note that this example uses some interesting syntax beyond the simple test of\
    \ the contents of MASKDSIRS. It uses a function to generate a more readable permission\
    \ mask. The function is given an argument that is treated as binary and stored\
    \ in the shiftable, which is processed one bit at a time to see whether the associated\
    \ permission is set or clear. If it is set, the appropriate value in the associative\
    \ array named permits is placed in the res array for later display:\n\n```\n$\
    \ cat masks_env\n#!/bin/ksh\n# Script which will display default\n# permissions\
    \ in formatted fashion\n# based on the current umask setting\n\nfunction gen_modes\n\
    {\n  integer count=0\ntypeset -i2 shiftval=$2 # Sets up a binary value\nperms=([1]=r\
    \ [2]=w [3]=x [4]=r [5]=w [6]=x [7]=r [8]=w [9]=x) # Associative array\n  while\
    \ (( count < 9 )) # Nine permission bits\n  do\n    count+=1\n    let lment=10-count\
    \ # Fill target from the right to the left\n    if (($shiftval & 1) == 1 )); #\
    \ Bitwise-and to check if rightmost bit is set\n    then\n      res[$lment]=${perms[$lment]}\
    \ # If so, put letter in res array\n    else\n      res[$lment]=-. # If not, put\
    \ dash in res array\n    (( shiftval >>= 1 )) # Get rid of rightmost bit\n  done\n\
    ########## Script Begins ##########\ntypeset -i2 defa # make defa display in binary\n\
    typeset -i onescomp\n  (( onescomp==-(8#($umask)) )) # Get ones complement of\
    \ current umask\n  (( defa=(8#666)&onescomp )) # Calculate default permission\
    \ mask\ndefault_perm=${defa#2} # Strip leading 2\n  print \"DEFAULT REGULAR FILE\
    \ permissions with current umask ($umask)\"\n  print \"u  g  o\"\n  #print \"\
    -------\"\n```"
