    # xargs


    The xargs command builds a command line consisting of the argument you present
    to it and the standard input given. It is commonly used in a pipeline. The term
    xargs comes from execute arguments. The key thing to remember about xargs is that
    it will form multiple commands if necessary to handle the size of input data presented
    from the pipe.


    Some options to xargs are as follows (check your xargs man page to see whether
    your system supports all these options):


    +   - -0Input filenames are terminated by a null character instead of whitespace.

    - -i[replace-str]-Replaces occurrences of replace-str in the initial arguments
    with names read from standard input.

    - -l[max-lines]-Uses at most max-lines nonblank input lines per command line.

    - -n max-args-Uses at most max-args arguments per command line.

    - -pPrompts the user about whether to run each command line and read a line from
    the terminal.'
