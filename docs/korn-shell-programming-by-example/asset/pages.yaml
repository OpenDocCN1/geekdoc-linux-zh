  md: '# Double Quotes


    Double quotes take an approach between escaping everything and escaping nothing.
    Double quotes take away the special meaning for everything except for the following:


    +   - End of double-quoted string

    - Variables

    - Escaping characters

    - Command substitution


    This, however, does not help with our monetary problem in the previous example,
    as the dollar sign needs to be escaped, as is shown in the following example:


    ![](img/de6a3b5a3b516159c825f1c10314d877_121_0.png)


    Double quoting saves time and confusion when the commands beginnDouble quoting
    saves time and confusion when the commands begin to get more complex:


    ```

    $ echo "$USER we owe us \$0.01 per minute for using $HOSTNAME.*"

    david you owe us $0.01 per minute for using moose.qx.net.

    ```


    ```

    $ echo "$USER, Today''s date is ***date +%m/%d****"

    shell, Today''s date is***07/09***

    ```


    # Line Continuation


    Line continuation is the capability to have a command span more than one line.
    Two ways of causing a line continuation are available. The first was done accidentally
    earlier in the chapter; this method is not recommended. It is done by not closing
    a quote:


    ```

    $ echo ''hell''

    > o world

    > this

    > line

    > continuation the

    > non-

    > recommended

    > way!''nhell

    no world

    this

    is line

    continuation the

    non-

    recommended

    way!

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_121_1.png)'
