    # Searching and Replacing


    A variation on the cut-and-paste action is the search-and-replace action. This
    is useful if you need to make changes to every instance of a string within a file.
    The first step is the search. Searching is something you do even if you are not
    interested in performing a replace. The following command places the cursor on
    the first instance of the string Den:


    ```

    /Den/

    ```


