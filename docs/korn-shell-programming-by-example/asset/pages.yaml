- img_proc: true
  md: "# Chapter 9: File and Directory Manipulation\n\nSome options to the awk command\
    \ are as follows:\n\n+   - F fs field-separator—Indicates that a nondefault field\
    \ separator is being used. The default field separator is whitespace (blank(s),\
    \ tabs).\n- -v var=val—Assigns the value, val, to the variable, var, before execution\
    \ of the program begins.\n- f file—Reads the awk program source from the file,\
    \ instead of the first command-line argument.\n\nThe following example uses the\
    \ awk filter to process the data in the stats file:\n\n![](img/de6a3b5a3b516159c825f1c10314d877_253_0.png)\n\
    \n| PID TTY S TIME CMD |\n| 200691 pts/6 S | 0:01.11 dtksh |\n| 200731 pts/6 I\
    \ | 0:00.19 -ksh (ksh) |\n| 200774 pts/6 I | 0:00.17 dtksh |\n\n```\n$ awk '{print\
    \ $4}' stats  # Prints field four in the stats file\nTIME\n0:01.11\n0:00.19\n\
    0:00.17\n$ \n```\n\nThe following example uses awk to process data from the /etc/passwd\
    \ file. It also uses the -F option, which identifies a nondefault field specifier,\
    \ the colon (:).\n\n![](img/de6a3b5a3b516159c825f1c10314d877_253_1.png)\n\n```\n\
    $ sed 3q /etc/passwd | awk -F: '{print $1}'  # Shows field 1 of the first 3 records\
    \ in /etc/passwd\nroot\nbin\ndemon\n$\n$ awk -F: '{print $1}' /etc/passwd  # Shows\
    \ all usernames from /etc/passwd\n```\n\nroot\nbin\ndemon\nadm\n(...)\nobobrien\n\
    $"
