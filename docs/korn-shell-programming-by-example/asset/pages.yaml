  md: '# # Appendix B


    # ## vi Tutorial


    You wouldn''t be reading this appendix if you were comfortable with the vi editor.
    The vi editor has many fans and many detractors. The detractors tend to be those
    who don''t completely understand the way it works. My goal here is to explain
    the way vi works so you can use this editor in peace rather than in pain.


    This appendix teaches you the following:


    +   * Where vi came from

    * How to start an edit session

    * The modes of operation within vi

    * Inserting and appending text

    * Last line mode

    * Exit options

    * Cursor movement

    * Cutting and pasting

    * Searching and replacing

    * How to use vi buffers

    * How to change the vi environment settings'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# Where vi Came From


    UNIX editors have gone through an evolutionary process. The first UNIX editor
    was the ed editor. It was strictly a line-oriented editor (as opposed to a screen-oriented
    editor like vi). It still exists in most UNIX variants, but it has been relegated
    to special-case use. As an example, if your UNIX runs in single-user mode, the
    editor that tends to be used by a utility with an edit subfunction, at that time,
    is the ed editor. Single-user mode is usually entered to accomplish some specialized
    system admin task. While in single-user mode, the only file system that is mounted
    is the root file system (unless the administrator specifically mounts other file
    systems).


    The vi editor program has been linked against shared libraries, and the shared
    libraries are found in the /usr file system, which is not available in single-user
    mode. The bottom line is that it is difficult (but not impossible) to use vi in
    single-user mode. Therefore, if your responsibilities include occasionally doing
    work in single-user mode, it might help to know the rudiments of ed as well as
    vi. I''ll include a short summary at the end of this appendix.


    The vi editor libraries are not found in the root file system, and vi is not available
    in single-user mode unless the administrator mounts other file systems manually.


    The ed editor is a line-mode editor. This means that the display is line-oriented
    rather than screen oriented. (The vi editor is screen oriented.) A line-mode editor
    does not have many requirements that limit terminal type and characteristics.
    Conversely, a screen-mode editor (such as vi) requires a terminal interface.


    The ed editor evolved into the ex editor. Several extensions to the ed editor
    were added, and the resulting editor was called ex. It also provided a more friendly
    user interface, although it was still screen oriented.


    The following example shows a simple session that creates a file and inserts a
    line. Note that the insertion is terminated by a line starting with a period:


    ```

    $ ex destro1!

    ''destest1'' [New File]

    Enter Ex mode. Type ''visual'' to go to Normal mode.

    :i

    hello

    :wq

    ''destest1'' [New File] 2 lines, 8 characters written

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_417_0.png)'
  merge: -1
  pgno: 417
- img_proc: true
  md: '$ cat dentest1


    hello


    $


    To comfortably view many lines of a file while editing, the nature of the editor
    had to change from line oriented to screen oriented. The visual version of the
    ex editor is vi. This means that the engine of the vi editor is the good old editor.
    (And''t forget that ex is just an extension of ed.)


    # Starting an Edit Session


    The vi editor is invoked by the vi command:


    +   $ vi filename


    The editor functions in one of three modes: command mode, insert mode, and last-line
    mode (sometimes called single-line mode, or ex mode). When the edit session starts,
    vi enters command mode. Several commands can change the mode to insert mode (I,
    i, a, A, 0, 0, and so on), and one can change the mode to last-line (:).


    If the file to be edited does not exist, vi reports that it is a new file and
    enters the command mode of operation. The following example show the startup of
    a vi session involving a new file:


    +   $ vi junk


    ![](img/de6a3b5a3b516159c825f1c10314d877_418_0.png)


    +   -

    -

    ()

    "junk" [New File]


    If the file exists, vi displays less than a screenful. It then reports on the
    size of the file and if it is screenful. It enters command mode. Don''t be surprised
    if you see a bunch of tildes (--) running down the screen. The editor uses them
    to indicate nonexistent lines in the screen display. A new file shows nothing
    but the lines containing:-


    +   $ vi dentest!


    hello


    +   -



    ![](img/de6a3b5a3b516159c825f1c10314d877_418_1.png)'
  merge: -1
