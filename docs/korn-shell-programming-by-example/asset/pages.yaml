  md: "POSIX syntax is as follows:\nfunction_name()\n\nKorn Shell syntax is as follows:\n\
    function name\n\nIn the previous code, *function* is a keyword.\n\n# Command-Line\
    \ Functions\n\nThe following example declares a Korn Shell-style function called\
    \ *dow*, which displays the day of the week and has an option to set the variable\
    \ WEEKDAY to the current day. This example is typed at the interactive prompt\
    \ for illustration only. Normally, the following syntax appears at the beginning\
    \ of a script. Functions created at the command line are removed when the shell\
    \ exits:\n\n```\n$ dow\n{\n  if [[ -z $1 ]] # Check for existence of option on\
    \ command\n  > line\n  then\n    > date +%A # If not, display day of week on stdout\n\
    \    > return 0 # Return success\n  fi\n  case $1 in\n    > -s) WEEKDAY=$(date\
    \ +%A); # If -s is used, set variable WEEKDAY\n    > \") print \"Format is \\\
    ndown [-s]\" # Anything else is an error\n    > return 1; # Return failure\n \
    \ esac\n}\n$\n$ dow\nWednesday\n$\n$ dow -s # Sets variable silently\n$\n$ print\
    \ $WEEKDAY\nWednesday\n$\n$ dow -x # Invalid option\nFormat is [-s]\ndow -s\n\
    $\n```"
