  md: '# Loop Output Redirection


    If capturing all the output from your script gathers too much information, and
    capturing the output of a command gathers too little, you might be a interested
    in redirecting the output of a loop. The technique is the same as you have learned
    for subshell and script redirection: Simply place a > or a >> after the last syntax
    of the loop.


    The following example produces some output outside the loop is not of interest.
    The done statement at the end of the loop construct has a redirect at the end
    of indicating that all output produced during the loop is to be placed in a file.
    Note that the output produced by the date command in the loop is not displayed,
    it is redirected into a file:


    ![](img/de6a3b5a3b516159c825f1c10314d877_269_0.png)


    ```

    $ counter

    #! /bin/ksh


    integer count=0


    print "lots of other lines"


    while (( count < 5 ))

    date

    print $count

    count=count+1

    sleep 1

    done > loopout # Note redirect at end of loop

    ```


    print "lots of other lines"


    ```

    $ counter

    $ counter

    lots of other lines

    lots of other lines

    $

    $ cat loopout

    Mon Nov 6 23:37:03 EST 2000

    0

    Mon Nov 6 23:37:04 EST 2000

    1

    Mon Nov 6 23:37:05 EST 2000

    2

    Mon Nov 6 23:37:06 EST 2000

    3

    Mon Nov 6 23:37:07 EST 2000

    4

    $

    ```'
