  md: '# Regular Expressions Versus Wildcards


    ```

    $ grep ''obr$'' regetest # looks for ''obr'' anchored to the end of a line

    obr$

    $ grep ''ogr?$'' regetest # question mark has no special meaning

    # in this context

    $

    $ grep ''obr*$'' regetest # asterisk means zero or more repeats

    # of previous R.E.

    obr

    obrr

    brrrr

    $

    $ grep ''obr*..*$'' regetest . Dot means match any single character,

    # so ''.*'' means any sequence

    # of zero or more characters


    obr

    obrr

    brrrr

    brrrabcrrr

    $

    $ grep obr.**$'' regetest # Are the apostrophes superfluous?

    obr

    obrr

    brrrabcrrr

    $

    ```


    As you will see in the next sequence, using apostrophes is a good habit to develop
    when using regular expressions as string pattern input to a utility. Recall that
    the shell was happy to expand an asterisk to mean multiple character match for
    filenames in the first set of examples in this chapter. Given the context of a
    command, unless you tell it differently, the shell assumes it has the responsibility
    to expand any wildcards you present on the command line. This next sequence uses
    the xt debugging option, which is discussed further in Chapter 11, "Diagnostics,"
    but is used here to expose the shell''s actions:


    ![](img/de6a3b5a3b516159c825f1c10314d877_104_0.png)


    ```

    $ grep obr* regetest # No apostrophes surrounding the R.E.

    regetest:obr

    regetest:obrr

    regetest:obrrr

    regetest:nbrrrabcrrr

    $

    $ set -o xtrace # Turn on extended tracing to see what

    # the shell does

    $

    $ grep obr* regetest

    ```'
