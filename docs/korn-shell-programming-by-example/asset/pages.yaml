  md: "# Loop-Related Commands\n\nThe shell provides several loop-related commands\
    \ to be used in special logic circumstances. For instance, suppose you were executing\
    \ a while loop and wanted to skip the execution of the rest of the current pass\
    \ of the loop. The continue command provides this capability.\n\nYou also might\
    \ want to exit from a loop prematurely. The break command provides this capability.\
    \ If you want to exit from the script, you can use the exit command. The exit\
    \ command can be followed by an exit status, which will be accessible outside\
    \ the script through $?\n\nThe shift command is a specialized command used to\
    \ shift the positional parameters so that one fewer exists than before the shift.\
    \ The parameter dropped after a shift command is the $1 (first argument). The\
    \ following example shows the shift command used in a loop to access the next\
    \ command-line argument:\n\n![](img/de6a3b5a3b516159c825f1c10314d877_152_0.png)\n\
    \n```\n$cat argshift\n!/bin/ksh\n# This script echoes arguments using\n# shift\
    \ and until\ninteger next=1\nuntil (($# == 0 ))             # Checks count, decremented\
    \ by shift\ndo\n    echo 'Parameter $next is $1'\n    shift                  \
    \        # Shifts arguments\n    next=next+1\ndone\n\n$ argshift deneryl chris\
    \ scott\nParameter 1 is den\nParameter 2 is cheryl\nParameter 3 is chris\nParameter\
    \ 4 is scott\n$\n```\n\n# Backup Loop Example\n\nThe following example might stimulate\
    \ some thoughts on the power of the looping constructs learned in this chapter.\
    \ The example takes the output of a df command, isolates the file system names,\
    \ places them in the list portion of a construct and performs a dump command on\
    \ each one of them. The level of the dump command is based on the day of the week\
    \ (Sunday is"
