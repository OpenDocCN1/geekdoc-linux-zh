    The file is also imprinted with a group-level ownership. Most Berkeley-flavored
    UNIX variants record the group ownership of a newly created file as the group
    ownership of the directory in which the file was created. This is not intuitively
    obvious, so I suggest you take note here. Check to see whether UNIX exhibits this
    behavior.


    The following example shows that the group ownership of a new file matches the
    group ownership of the directory in which it is created. It creates a file in
    the /usr/users/obrien directory and then creates another file in the /tmp directory:


    ![](img/de6a3b5a3b516159c825f1c10314d877_236_0.png)


    ```

    $ ls -ld ..

    drwx-xr-x 5 obrien 8192 Nov 2 00:10 ..

    # Directory''s group is guest

    ```


    ```

    $ touch test1

    $ ls -l test1

    -rw-r--r-- 1 obrien guest 0 Nov 2 01:41 test1

    # New file''s group is guest

    ```


    ```

    $ ls -ld /tmp

    drwxwxrwxrwt 9 root system 8192 Nov 2 01:05 /tmp

    # Directory''s group is system

    ```


    ```

    $ touch /tmp/test2

    $ ls -l /tmp/test2

    -rw-r--r-- 1 obrien system 0 Nov 2 01:42 /tmp/test2

    # New file''s group is system

    ```


    Most System V-flavored UNIX variants assign group ownership based on the primary
    group of the user creating the file. Be aware that your UNIX might be capable
    of switching between the two behaviors (Compaq''s Tru64 UNIX can do this, as shown
