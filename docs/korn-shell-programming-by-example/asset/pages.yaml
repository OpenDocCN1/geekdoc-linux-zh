    This indicates the execution time of the process. Note: This is not how long the
    process has been running, but how much processor time it has used.


    CMD


    The command being executed is the final field.


    # Starting a Process


    Starting a process is as easy as executing a command. A simple command that can
    be captured in the process list (as an example) is the man command. The man command
    requests a display of the manual page for some command. Therefore, the following
    example uses the man command to display the manual pages for the kill command
    (in Linux):


    ![](img/de6a3b5a3b516159c825f1c10314d877_58_0.png)


    $ kill


    KILL(1) | Linux Programmer''s Manual | KILL(1)


    NAME


    kill - terminate a process


    SYNOPSIS


    ```

    kill [-s signal | -p ] [-a ] pid ...

    kill -1 [ signal ]

    ```


    DESCRIPTION


    kill the specified signal to the specified process.

    If no signal is specified, the TERM signal is sent. The

    TERM signal will kill processes which do not catch this

    signal. For other processes, it may be necessary to use

    the KILL (9) signal, since this signal cannot be caught.


    Most modern shells have a built-in kill function.


    OPTIONS


    pid ...


    Specify the list of processes that kill should sig-nal. Each pid can be one of
    four things. A pro-cess name in which case processes called that will

    be signaled. where n is larger than 0. The pro-cess with pid n will be signaled.
    -1 in which case

    all processes from MAX_INT to 2 will be signaled,

    as allowed by the issuing user. -n where n is

    larger than 1, in which case processes in process

    group n are signaled. IFF a negative argument is'
