    \ Custer Drive, Suite 203\n# Lexington, Kentucky 40515\n# Phone: 859-552-3262\n\
    ```\n\nAnother example would be to find all the lines that begin with an f or\
    \ an F:\n\n```\n$ grep [FF] david\nfirst_variable=\"This is a test of the Emergency\
    \ System. This is only a test.\\nfor_variable=\"Quake\". \n$\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_110_1.png)\n\
    \nThis example returns two matching instances.\n\n# Back\n\nJust as a special\
    \ character can be used to match the front of a line, another character can be\
    \ used to match the end of a line. That character is the dollar sign ($). In the\
    \ following, all lines are found that end a number:\n\n```\n$ grep [[[:digit:]]]\
    \ david Dollar sign anchors the expression\n# to the end of the line\n```\n\n\
    ```\n# written on July 2, 2000\n# 3175 Custer Drive, Suite 203\n# Lexington, Kentucky\
    \ 40515\n# Phone: 859-552-3262\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_110_2.png)\n\
    \nObviously, this could also have been done this way:\n\n```\n$ grep [0-9]$ david\n\
    # written on July 2, 2000\n# 3175 Custer Drive, Suite 203\n# Lexington, Kentucky\
    \ 40515\n# Phone: 859-552-3262\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_110_3.png)"
