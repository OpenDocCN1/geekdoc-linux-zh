  md: '# ps


    So far, we have only looked at the jobs that a user has had suspended or that
    are running in the background. In reality, many processes are usually running
    that are owned by that user but not show up on the jobs list. In addition, any
    number of other jobs are running on the system, from other users'' programs to
    daemons taking care of the system itself. Obviously, the jobs command will not
    show these processes. These processes can be seen, however, by using the process
    status command, ps.


    The ps command itself shows the processes running for the current user. In the
    following example, the ps command is run, followed by the ps command. In this
    example, neither of the commands use any parameters or arguments:


    ![](img/de6a3b5a3b516159c825f1c10314d877_72_0.png)


    +   * jobs

    [2] + Stopped more .Xdefaults

    [1] - Stopped ls -la /etc | more

    * ps


    | PID TTY TIME CMD |

    | 7776 pts/1 00:00:00 ksh |

    | 12462 pts/1 00:00:00 ls |

    | 12463 pts/1 00:00:00 more |

    | 12475 pts/1 00:00:00 more |

    | 12565 pts/1 00:00:00 ps |


    Notice that the ps command shows two stopped processes. These have been given
    the process job numbers of 1 and 2.


    The ps command shows that five processes are running. In this default display
    of the output, four columns, PID (process identifier), TTY (terminal), TIME (CPU
    time used), CMD (command).


    > NOTE

    Some UNIX variants support two implementations of the ps command. Be aware that
    your default PATH might execute the Berkeley favor of the ps command, or it might
    execute the System V flavor of the command. A difference in the columns of information
    displayed and the command options supported for each type of ps command will exist.
    Check your man pages for details.

    Your UNIX might discern whether your ps command is BSD (Berkeley Software Distribution)
    or System V by the way you present the options. For example, ps 1ax (no dash before
    the options) would request a BSD interpretation, and ps -ef would request a System
    V interpretation.

    Fortunately, most UNIX commands do not suffer from this type of schizophrenia.


    You might need more or different information than the actual process status command
    shows. A number of columns can be retrieved using this'
