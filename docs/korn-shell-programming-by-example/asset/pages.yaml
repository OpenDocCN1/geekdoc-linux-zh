  md: '# Arithmetic Expressions


    The Korn Shell evaluates arithmetic expressions. A null value evaluates to 0.
    An easy example taking the previous program and removing the line assigning a
    value to $b is shown in the following code:


    ```

    #!/bin/ksh

    a=5

    c=$(( a*b ))

    echo \$a * $b equals \$c"

    ```


    As expected, the value for $b should evaluate to 0. Here is the output of the
    code:


    ```

    $ ./Example56.ksh

    5 * equals 0

    ```


    The results are as expected. Because $b is undefined, no value is printed in the
    echo command.


    In addition to the standard expressions of plus (+), minus (-), multiply (*),
    divide (/), a number of other expressions (normally referred to as *functions*)
    are allowed. The standard function is denoted by *function (expression)*. Table
    5.2 lists some of the mathematical functions available. In this table, functions
    requiring angles expect the angles to be expressed in radians. Functions are explained
    in much more depth in Chapter 7, "Data Manipulation."


    # NOTE


    The following list works with some implementations of ksh and not with others.
    As a general rule, these do not work with the standard implementation of ksh shipped
    with Linux.


    Table 5.2: Functions built into the Korn Shell


    | Function | Description |

    |---|---|

    | abs | Absolute value |

    | acos | Arc cosine of angle in radians |

    | asin | Arc sine |

    | atan | Arc tangent |

    | cos | Cosine |

    | cos | Hyperbolic cosine |

    | exp | Exponential with base e, where e = 2.718 |

    | int | Greatest integer less than or equal to value of expression |

    | log | Logarithm |

    | sin | Sine |

    | sinh | Hyperbolic sine |'
