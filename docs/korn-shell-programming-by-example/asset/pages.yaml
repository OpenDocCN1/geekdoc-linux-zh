  md: '# What This Book Will Give You


    This book will give you good, usable, tested scripts. It will give you easy-to-follow
    and easy-to-use examples that will help you to write your own scripts. Many times
    this will mean that I will give you more information than you probably looking
    for, but I follow the adage that if I give you all the information, you will be
    able to apply it yourself.


    # What This Book Will Not Give You


    This book will not give you


    +   - A history of UNIX or Linux. Some good books are out there that do; get one
    of those if you don''t want to learn how to program.

    - A tutorial on UNIX/Linux. Some great books on UNIX and Linux are available.
    When delivering introductory UNIX material, I sometimes suggest A Practical Guide
    to the UNIX System by Mark Sobell, but many others are available.

    - A history on shells, shell scripting, types of shells, and so forth. As a matter
    of fact, great effort has gone into this work to not bore you with this. Besides,
    you likely wouldn''t read it anyway!

    - Probably most importantly, you will find absolutely no references to XXX.edu
    for where to get errata, answers to questions, or other information. I am not
    in school, and this is not a class project. These are real-life examples from
    real systems programmed by real systems administrators that you can use in your
    real life as a real, live systems administrator. (Really!)


    # Conventions


    +   - Code lines, commands, statements, variables, and any text you see or onscreen
    appear in a computer typeface. Bold computer typeface is used to represent the
    user''s input.

    - Placeholders in syntax descriptions appear in italic computer typeface. Replace
    the placeholder with the actual filename, parameter, or whatever element it represents.

    - Italics highlight technical terms when they first appear in the text and are
    being defined.

    - This special icon will be used before a line of code that is really a continuation
    of the preceding line. Sometimes a line of code is too long to fit as a single
    line on the page, given this book''s limited width. If you see this special symbol
    before a line of code, remember that you should interpret that line as part of
    the line immediately before it.'
