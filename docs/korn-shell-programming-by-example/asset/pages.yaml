  md: '# Chapter 13: Pulling It All Together


    # Comments on Selected sys_check Lines (222–264)


    Lines 222–264 form the heart of the script. They contain a loop that executes
    the commands stored in the command array. A coprocess is used to maximize the
    use of the ksh process created on line 234. The syntax to use the line is the
    |& that terminates the line. This instructs the shell to create a coprocess, which
    will run the ksh program. The alternative is to create a new ksh for each command
    executed. The two exec commands on lines 235 and 236 are used to create channels
    for input and output from the coprocess—a small price to pay (in complexity) for
    the performance benefit gained.


    The while loop on lines 239–264 works its way through the array and executes the
    commands. Note that the output of this loop is piped (line 264) to a tee command,
    which uses the - option to append to an outfile. Although this script uses no
    functions in its loop (everything executed is a command), the syntax on lines
    251–253 is prepared to check for functions and react accordingly. This enables
    you to alter the script such that it executes any functions you might create in
    the future, if you want.


    The command to execute is actually executed twice to the coprocess—once to find
    out many lines of output it will generate (line 255) and again to actually generate
    the output (line 257). The count is counted from the coprocess in line 256. It
    is then used to control the number of passes through the read loop on lines 258–262.
    All output of the commands is piped to the tee command (line 264) and ultimately
    ends up in the Current_output file.


