    # Ksh Environment Options


    The Korn shell is itself an executable program. This is why you put the

    #!/bin/ksh at the beginning of the file. Several environment options are set

    by default, and others can be set manually either when Ksh is invoked

    afterward with the set command. Options can do many things, including

    afecting how Ksh processes commands. By setting set -o, you can see how

    y current options are set:


    ![](img/de6a3b5a3b516159c825f1c10314d877_38_0.png)'
