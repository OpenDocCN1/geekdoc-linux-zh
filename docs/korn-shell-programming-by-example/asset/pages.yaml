  md: "You can override the noclobber option for an individual command by insist-\n\
    that you want it done with the >| syntax. The following example uses\nt>| syntax\
    \ to temporarily override the noclobber option. It also uses the\nwc -c command\
    \ to count the characters in the test file named f2:\n\n```\n$ wc -c f2\n35 f2\n\
    ```\n\n# f2 has 35 characters\n\n```\n$ \nset -o noclobber\n$\n```\n\n# Turn off\
    \ clobbering\n\n```\n$ set -o | grep clobber\nnlobber on\n$\n```\n\n# Note noclobber\
    \ option is on\n\n```\n$ ps > f2\n-ksh: f2: file already exists [File exists]\n\
    $\n```\n\n# Prevents clobbering f2\n\n```\n$ wc -c f2\n35 f2\n$\n```\n\n# f2 still\
    \ has 35 characters\n\n```\n$ ps >| f2\n$ wc -c f2\n83 f2\n$\n```\n\n# f2 has\
    \ 83 characters now\n\n```\n$ set -o | grep clobber\nnlobber off\n$\n$ ls -1 >\
    \ f2\n$\n```\n\n# Noclobber is still on\n# Can't clobber\n# unless overridden\
    \ with >|\n\n-ksh: f2: file already exists [File exists]\n$\n\nYou can turn clobbering\
