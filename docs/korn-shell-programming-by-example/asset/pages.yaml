  md: '# Chapter 11: Diagnostics


    The verbose shell option can be turned on in several ways. You can start a new
    shell with the -v option using ksh -v. You can put a -v at the end of the #! line
    at the beginning of your script, or you can type in set -o verbose either at the
    command line or within your script. Each of these has the same result, which is
    to display each line of the script as it is about to be executed. Consider the
    following example:


    ![](img/de6a3b5a3b516159c825f1c10314d877_281_0.png)


    ```

    $ masks_env # Normal run of script

    Default REGULAR FILE permissions with current umask (0002)

    u g o

    r w-r -w- -w- - -

    (In binary -- 110110100)

    ```


    ```

    $ head masks_env # Turn on verbose mode

    #!/bin/ksh -v

    # Script which will display default

    # permissions in formatted fashion

    # based on the current umask setting

    #

    function gen_modes

    {

    integer count=0

    typeset -i2 shiftval=2=$1

    $

    ```


    ```

    $ masks_env # Execute request shows lines of script

    #!/bin/ksh -v

    #

    # Script which will display default

    # permissions in formatted fashion

    # based on the current umask setting

    #

