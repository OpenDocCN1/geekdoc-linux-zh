- img_proc: true
  md: '# Escape Character


    The shell has a number of special characters available. Many times they are called
    metacharacters. These characters are special because the shell interprets them
    to mean something other than the actual character value. For example, the * is
    a metacharacter. When the shell uses an *, it replaces it with a ''glob'' of stuff.
    The term glob is used in UNIX to represent a bunch of characters—I believe the
    letters stand for great lot of bytes.


    # Asterisk with No Escapes


    For example, a simple find using an * (and using no escape character) would look
    like the following example:


    ```

    $ find -name C*

    ./CHECKIT

    ```


    In the previous example, the shell interprets the C* to mean “anything that starts
    with a capital C and has zero or more characters following it.” Therefore, the
    entire command means “Find from the current directory any file that has its first
    character a capital C and has zero or more characters in its name. For every file
    you find, list its location relative to the current directory.


    What if there were file literally named c*? Certainly, the find command could
    have found it because it met the criteria. But, without some way of telling the
    system that we literally mean c*, trying to do with anything with that file would
    be close to impossible.


    This is where the escape character comes in. The escape character tells the system
    the character being referred to is literally that character, and not some metacharacter.
    To better show this, file literally called c* has been added to the current directory.
    The following is a listing of the directory:


    ```

    $ ls

    C* CHECKIT array_index assigning integers

    ```


    Now that this file exists, a find command is again run. You will notice that,
    with the exception of the additional file, nothing has changed. Here is the find
    command again:


    ```

    $ find -name C*

    find: paths must precede expression

    Usage: find [path...] [expression]

    ```


    Now, an error exists. What happened? The shell did not know how to interpret the
    C* this time because it could not decide whether you meant find all the files
    that are named C* or find all the files that begin with a capital C and contain
    zero or more characters after that.


    ![](img/de6a3b5a3b516159c825f1c10314d877_117_0.png)'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Asterisk with Escape


    This problem is solved as soon as the escape character is used. The escape character
    is a backslash (\). Here is the same find command with a back-slash (escape character)
    placed before the *:


    ```

    $ find . -name C*

    ./CHECKIT

    ./C*t

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_118_0.png)


    This is an interesting case that needs some explanation of what is happening.
    There is always hierarchy to any command. The hierarchy shell interprets the line
    and searches out any special characters. After expanding (or interpreting) the
    special characters, the shell presents the newly re-formed command line to the
    program.


    The shell looks at the syntax of the line (with the backslash) and recognizes
    the escape character. It knows, therefore, to pass C* to the find command instead
    of performing filename expansion. With the backslash (escape character) before
    the *, the filter within the find command says the shell to ignore the special
    meaning that the shell assigns to the * character. Therefore, the find command
    is presented with the * as one of its command-line arguments. Because it is an
    *, the find command recognizes it as a metacharacter within its own program. It
    then lists out all files that begin with a capital C and contain zero or more
    characters after that.


    # Asterisk with No Escapes from a Different Directory


    Now, to muddy the waters a little more, what if the command was run from a directory
    different from the current one? To ask this in a different way: If the user were
    to back up one directory, in which no files begin with C*, what would happen if
    the find command were run? If that is the case, as shown in the following example,
    no confusion exists and either method works:


    ```

    $ find . -name *

    ./scripts/CHECKIT

    ./scripts/C*t

    $

    $ find . -name C*

    ./scripts/CHECKIT

    ./scripts/C*t

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_118_1.png)


    The reason for this goes back to the syntax that no files begin with C* exist
    in the current working directory, so the shell knows that the * is a metacharacter.
    It then passes on that metacharacter to the find command, which performs its recursive
    search and eventually finds the files in question.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Asterisk with Two Escapes


    Before leaving this subject, the next level of complexity would be to find the
    file C* without finding CHECKIT. The trick would be to escape the * as before,
    but then to escape the * again. The first escape would get past the shell''s syntax
    checker, and the second one would escape the * for the find command. The net result
    would be the non-special * for the find command. This double escaping is shown
    here:


    ```

    $ find . -name C\*

    ./C*

    ```


    # Aggregate Quoting Options


    At this point, most readers think that there must be an easier way. Fortunately,
    there is. It is at this point that aggregate quoting becomes useful. I call it
    *aggregate quoting* because it enables a mechanism to indicate to the shell that
    a series of characters are not without their special meaning.


    The next sections describe two power levels of aggregate quoting.


    # Single Quotes


    Simply speaking, single quotes around one or more characters are the equivalent
    of placing escape characters before each of the characters. In the previous example,
    the file C* could be found by any of the following methods:


    ```

    $ find . -name ''C*''

    ./C*

    $ find . -name ''C*''

    ./C*

    $ find . -name ''C*\''

    ./C*

    ```


    As long as the * is included in the single quotes, the correct interpretation
    is found. Notice that the single quotes in no way hurt the regular characters.
    In fact, quoting non-special characters is completely harmless. It is also true
    for the escape character and the double quotes, which I explain in the next section.


    A time does exist when a single quote has problems. Any time that an apostrophe
    (which is, a single quote) is used in the string, it must be escaped so that the
    shell does not assume it is a special character. The following shows an example
    of incorrectly using an apostrophe:


    ```

    $ echo David''s Book is Fantastic!

    > ''C

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_119_0.png)'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'Notice the shell gives the secondary shell prompt (>), assuming that a multiline
    command had been entered. The secondary shell prompt is exited with Ctrl+C, but
    this also kills the echo. What happens when a single quote is placed at the secondary
    shell prompt instead of Ctrl+C:


    ```

    $ echo Davids''s Book is Fantastic!!

    ```


    Davids Book is Fantastic!


    This is obviously a better response because the echo command is allowed to execute,
    but we lost the apostrophe toward the end of the word "David''s". Even placing
    single quotes around the whole string does not help:


    ```

    $ echo ''David''s Book is Fantastic!!''

    ```


    Davids Book is Fantastic!


    The escape character is needed to remove the specialness associated with the single
    quote, as shown here:


    ```

    $ echo David\''s Book is Fantastic!!

    ```


    Davids Book is Fantastic!


    The other problem that occurs many times with single quotes is that they take
    too much of the specialness. For example, what happens if you want to have a variable
    within the command? In the following example, the current-logged user is being
    charged a fee for using the session. If the single quotes were around the variables,
    the following would result:


    ```

    $ echo ''$USER you owe \$0.01 per minute using \$HOSTNAME''.

    $USER you owe \$0.01 per minute for using \$HOSTNAME

    ```


    It is obvious that substitutions should have been made for both $USER and $HOSTNAME
    but not for $0.01. One way is to move the single quotes so that they are not around
    the variables:


    ```

    $ echo \$USER you owe \$0.01 per minute for using \$HOSTNAME''

    david you owe \$0.01 per minute for using moose.qx.

    ```


    Another option is to escape the dollar sign in front of the 0.01 and leave the
    rest of the sentence:


    ```

    $ echo \$USER you owe \$0.01 per minute for using \$HOSTNAME.

    david you owe \$0.01 per minute for using moose.qx.

    ```


    Because of how strictly the single quote blocks everything, a middle-of-the-road
    approach is available. This approach enables most things to act as if they are
    escaped—like the single quotes do—but keeps other things as if they are not escaped.
    This middle-of-the-road approach is achieved through the use of double quotes.'
