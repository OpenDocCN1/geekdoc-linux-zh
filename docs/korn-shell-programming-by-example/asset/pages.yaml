  md: "The following example shows a pattern match for any occurrence in which\nthe\
    \ pattern-list is found only one time:\n\n![](img/de6a3b5a3b516159c825f1c10314d877_112_0.png)\n\
    \n@(Custer & Suite)\nThe following example requests a match on zero or more occurrences\
    \ of the\npattern-list. It will match Den, Dennis, Dennie, or Denny:\n\n```\n\
    Den*(nis|de|ny)\n```\n\nThe following example requests a match on one or more\
    \ occurrences of the\npattern-list. It will match Dennis, Denise, or Denny:\n\n\
    ```\nDen+(nis|de|ny)\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_112_1.png)\n\
    \nThe following example requests a match on zero or one occurrence of the\npattern-list.\
    \ It will match Den123, Dennis123, Dennie123, or Denny123:\n\n```\nDen?(nis|de|ny)123\n\
    ```\n\n# Back References\n\nSome versions of ksh allow for back references. Back\
    \ references allow a sub-\npattern to be referred to by the number. The number\
    \ refers to the instance of\nt open parentheses (counting from the left) starting\
    \ with 1. Within a pat-\ntern, back references are referred to by a backslash\
    \ followed by the number\njust mentioned. Therefore, the following example will\
    \ match any string that\begins and ends with the same letter, such as \"mom\"\
    , \"dad\", or \"dumb-founded\":\n\n```\n(?)\\1\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_112_2.png)\n\
    \nHere is the breakdown of the expression. The @ means to match exactly one\n\
    pattern; the (?) says to match exactly one character. The * says to match\nzero\
    \ or more characters, and the \\ says to go back and reference what was\nafter\
    \ the first parenthesis. Therefore, it matches the same character\nmatched with\
    \ the (?). The following example is similar to the previous one,\nby adding an\
    \ additional *11, it says to match any string which begins\nends with the same\
    \ letter and contains that letter somewhere within\ntexpression. Therefore, it\
    \ would match \"dumb-founded\", but would not\nmatch \"mom\" or even \"mommy\"\
    :\n\n```\n(?)*1\\1\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_112_3.png)\n\
    \nThe next example uses the back reference pattern-matching capability to\nrequest\
    \ that the sed rearrange the data in a file. I will explain the\npattern after\
    \ you check out example:\n\n```\n$ cat names # current contents\nobrien, dennis\
    \ m\nellis, bruce a\n```"
