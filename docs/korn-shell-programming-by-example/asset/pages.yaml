    # # What''s Next


    When writing this chapter, it seemed like a lot of jumping around, highlights,
    and juggling was going on. This is because of the day-to-day shell activities
    are typically performed by rote and not given much thought as to what is actually
    happening. So, I thought we sort out the meanings and uses of environment variables,
    shell variables, startup files, and other shell items.


    Having a basic understanding of the environment will help you regardless of how
    you use UNIX/Linux. It will make you a more efficient programmer, a better-qualified
    DBA, a better system administrator, and just all-around better human!


    You have probably figured out by now that most of the shells are similar, particularly
    ksh, bash, and sh. Although they are not exactly alike, they are close enough
    that if you are using any of these three, this book will be a wonderful guide
    for your adventure to come.


    After you are comfortable with the environment, the step to programming in ksh
    is a relatively small, simple, baby step! Having read this chapter are prepared
    for the next step. You are able to take a script, change its permissions as appropriate—based
    on the users, groups, and other people who need access—and are able to run the
    script. One old adage states, “History repeats itself.” Whoever said this must
    have been a UNIX guru!


    In Chapter 2, “Process Control,” we examine how to control the script, enabling
    it to run either in the foreground or the background and how to have it run automatically.
    Stay tuned!'
