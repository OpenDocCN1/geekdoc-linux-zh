    \ and startup programs\nPATH=$PATH:/usr/X1R6/bin\n# PS1=\"\\$\"\ntypeset -uxL5\
    \ HOSTCHAR=$(uname -n)\nPS1=\"$HOSTCHAR@${PWD@$HOME}:#'\nulimit -c 1000000\nif\
    \ [ 'id -gn' -id 'id -un' -a 'id -u' -gt 14 ]; then\n    umask 002\nelse\n   \
    \ umask 022\nfi\nUSER=id -un\nLOGAME=$USER\nMAIL=/var/spool/mail/$USER\nHOSTNAME=/bin/hostname\n\
    HISTSIZE=100\nHISTFILESIZE=1000\nLINES=53\nINPUTRC=/etc/inputrc\nset -o vi\nexport\
    \ PATH PS1 USER LOGAME HOSTNAME HISTSIZE HISTFILESIZE INPUTRC LINES\nfor i in\
    \ /etc/profile/*; do\n    if [ -x $i ]; then\n        $i\n    fi\ndone\\unset\
