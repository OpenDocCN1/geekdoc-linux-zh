  md: '# Built-In Variables


    | Variable | Explanation |

    |---|---|

    | $0 | Name of the command or script being executed. | Argument passed as a positional
    parameter (for example, n is a number between 1 and 9) indicating which value
    is passed to the script from the command line. Arguments can exceed 9 if enclosed
    in curly braces—for example, ${14} indicates the 14th positional parameter. |

    | # | Number of positional parameters passed as arguments to the script from the
    command line. |

    | $* | A list of all command-line arguments. |

    | $@ | An individually double-quoted list of all command-line arguments. |

    | ! | PID (process ID) number of the last background command. |

    | $$ | PID (process ID) number of the current process. |

    | $? | A numerical value indicating the exit status of the last executed command.
    |


    # Signals


    | Name | Value | Description |

    |---|---|---|

    | SIGHUP | 1 | Hang up detected on controlling terminal or death of controlling
    process. |

    | SIGINT | 2 | Interrupt from the keyboard. |

    | SIGQUIT | 3 | Quit signal from the keyboard. |

    | SIGKILL | 9 | Kill signal. |

    | SIGTERM | 15 | Termination signal. |'
  merge: -1
