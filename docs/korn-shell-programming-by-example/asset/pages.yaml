    # Directories


    Some of our first experiences with a computer involve the organizing of files.
    Directories are files that provide the capability to catalog files in recognizable
    logical locations. Rather than having to hunt for an accounting file name you
    have forgotten, you can look in the directory. If you have been lax in your file
    organization, you can still end up hunting. The point is creating several directories
    does NOT organize your files. Putting your files in the appropriate directories
    DOES organize your files.


    As I pointed out earlier, directories are files. But they are special with a special
    format. They contain a mix of ASCII and binary information. The ASCII information
    represents a filename, and the binary information represents the file''s inode
    number (or other file system metadata location indicator). Metadata is data that
    describes other data. Many types of file systems are supported by the various
    UNIX operating systems. For this discussion, we''ll stick with the UNIX File System
    (UFS) because it is common to most UNIX systems.'
