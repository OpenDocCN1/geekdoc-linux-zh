  md: 'Korn Shell Programming By Example teaches you, with clear, concise examples,
    everything you need to know to begin programming for the Korn Shell. Before you
    begin, you must make sure you satisfy a few requirements. If you do, Korn Shell
    Programming by Example will give you a firm grasp of what you need to know to
    master Korn Shell Programming.


    # # What You Need to Have


    A familiarity with the command-line interface to UNIX/Linux. Previous experience
    working with the command line in a UNIX or Linux environment is essential to get
    the most from this book.


    Access to an editor program. Appendix B, “vi Tutorial,” of this book offers a
    brief tutorial on the vi editor, but any editor that works for UNIX and Linux
    will suffice.


    A UNIX/Linux/NT machine running ksh (preferably ksh 93). Using ksh 93 ensures
    that all examples in the book will run correctly on your system.


    # # What You Can Expect to Learn


    How to use shell, environment, and built-in variables. Discover how the various
    kinds of variables work in your scripts.


    How to interact with processes. Manipulate processes to schedule your scripts
    and control jobs.


    How to use signals for interprocess communication. See how processes work together
    through signals.


    How to declare and use both indexed and associative arrays. Use arrays to store
    multiple values.


    How to interpret regular expressions. Represent an aggregate of string information
    in a succinct manner with regular expressions.


    How to control the flow of logic in your scripts. Use control structures to automate
    decision making.


    How to use functions. Use functions to group together commands that might require
    repetitive, distinct executions.


    How to use filters within your script and in a pipeline. Use filters to isolate
    particular input.


    How to use subprocesses for massive performance improvements. Capture responses
    from one program running in parallel with another by using coprocesses.


    How to redirect files using file descriptors. Use file descriptors to quickly
    retrieve needed files.


    How to create sophisticated output using printf. Get creative with your output
    by using the printf command.


    How to debug your scripts. Troubleshoot and bulletproof your scripts.


    How to use traps. Trap runtime errors and exits.'
