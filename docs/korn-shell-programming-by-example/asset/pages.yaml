  md: '# Chapter 9: File and Directory Manipulation


    The following examples attempts to create a hard link to a file in another system,
    and attempts to create a hard link to a directory:


    ```

    $ ln /etc/passwd pass      # Attempt to make a hard link

    # from my directory to /etc/passwd

    ln: /etc/passwd and pass are located on different file systems.

    $ ln /etc/etc toetc      # Attempt to make a hard link to a directory

    /etc is a directory.

    $

    ```


    These limitations are addressed through symbolic links. A symbolic link is also
    a nickname for a file, but the mechanism it uses to represent the file does not
    revolve around the directory and inode mentioned earlier. Each symbolic link is
    a file that contains a string of characters representing the absolute file spec
    of the target file.


    The following example creates a symbolic (sometimes referred to as soft) link
    to a file and displays the symbolic''s attributes. The permissive permissions
    (rwxrwxrwx). A final permission check will occur when the linked-file is accessed:


    ```

    $ ln -s stats softtostats      # Create symbolic linktostats

    $ ls -li "stats"

    75261 -rw-r--r-- 2 obrien guest 629 Nov 02 00:54 hardlinktostats

    50994 lrwxrwxrwx 1 obrien guest 5 Nov 02 01:17 softlinktostats -> stats

    75261 -rw-r--r-- 2 obrien guest 629 Nov 02 00:54 stats

    ```


    Using the symbolic link mechanism, a link can be pointed to a directory or to
    a file in another system:


    ```

    $ ln -s /etc/passwd pass      # Create symbolic link to /etc/passwd

    $

    $ ln -s /etc toetc              # Create symbolic link to /etc

    $

    $ ls -l pass

    lrwxrwxrwx 1 obrien guest 11 Nov 02 01:20 pass -> /etc/passwd

    $

    $ ls -l toetc                # Symbolic link permissions

    lrwxrwxrwx 1 obrien guest 4 Nov 02 01:20 toetc -> /etc

    $

    $ ls -lL toetc               # Follow symbolic link

    -rw-r--r-- 1 root system 1316 Oct 30 15:15 pass

    $

    $ ls -lL toetc               # Follow symbolic link to access a directory

    total 1204

    -rwxr-xr-x 1 bin bin 1 Jul 20 1999 TIMEZONE

    ```


