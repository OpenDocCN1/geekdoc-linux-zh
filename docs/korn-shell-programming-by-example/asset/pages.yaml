  md: '# The Environment


    The assumption of this book, and particularly this chapter, is that you are at
    least familiar with a shell. You have typed in some commands—such as changing
    your password—and are fairly comfortable with the environment. The chapter begins
    by explaining a feiw items common to all scripts, including comments and the cryptic
    #!/bin/ksh that mysteriously lurks on the first line of most shell scripts. After
    that, a few environment issues are explained.


    This chapter teaches you the following:


    +   * The meaning of #! /bin/ksh

    * How to use the chmod and umask commands

    * How to provide comments in your script

    * How to use the .profile file

    * What the Korn shell environment options are

    * How to use shell variables and environment variables

    * How to use the history file and command-line recall'
