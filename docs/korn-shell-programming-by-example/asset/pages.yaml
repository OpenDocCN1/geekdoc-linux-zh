- img_proc: true
  md: 'In reality, three processes were spawned. The first is the command that was
    run, man kill. This command is the first one in the previous list. The second
    process that was run was a child process of the first command, sh -c /bin/gunzip
    -c /var/cat. Notice that the parent ID of this second process is the process ID
    of the first process. Finally, the third process was spawned from the second—again,
    with the parent ID of the third command being the process ID of the second command.
    Also notice that the command appeared to take no time. It actually did, but it
    was such a small amount of process time that it rounds down, becoming zero.


    When this command is run from a terminal, the result of the command is displayed
    on the terminal. This means that the terminal is busy until the command finishes.
    For an example such as looking at a man page, this is very reasonable and expected.
    When the command finishes executing, the system will, of course, remove the processes
    from the process list.


    # Stopping a Process


    Suppose a running process is tying up your terminal. (And suppose you are not
    working on a Windows-based workstation where you could just bring up another terminal
    window.) What are the options for getting the running process to stop tying your
    terminal?


    If the goal is to make the process cease and desist, you could kill the process
    (assuming you are the owner or root). More realistically, you want to get the
    process to run in the background. *Running in the background* means that the process
    is running without tying up a terminal. If the-background job needs input from
    a terminal, it sends a message to the terminal and waits until it is brought back
    to the foreground and gives its input.


    A process that has been *suspended* is still a "live" process in that it exists
    within memory, has its own environment, and is listed on the process list. A process
    that has been *killed*—the method used will determine the actual process involved—it
    does not exist in memory, it no longer has its own environment, and is not included
    in the process list. More on killing a process is discussed later in this chapter.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Chapter 2: Process Control


    Suspending a process means putting it on hold. It is allowed no more process-ing
    time and is in a wait state.


    In the following example, a man page is displayed and then the Ctrl+Z key combination
    is pressed:


    ![](img/de6a3b5a3b516159c825f1c10314d877_61_0.png)


    ```

    $ man man # Man page for the man command

    man(1)

    ```


    # NAME


    man - format and display the online manual pages

    manpath - determine user''s search path for man pages


    # SYNOPSIS


    ```

    man [-acdfFhnKtwW] [-m system] [-p string] [-C config_file] [-M] [-P pager] [-S
    section_list] [section]

    name ...

    ```


    # DESCRIPTION


    man formats and displays the online manual pages. This version knows about the
    MANPATH and (MAN)PAGER environment variables, so you can have your set(s) of personal
    man pages and choose whatever program you like to display the formatted pages.
    If a section is specified, man only looks in that section of the manual. You may
    also specify the order to search the sections for entries and which preprocessors
    to run on the source files via command-line options or environment variables.
    If name contains a / then it is first tried as a filename, so that you can do


    ```

    # Ctrl+Z was pressed here

    [1]+ Stopped man man

    ```


    Notice that a couple of things happened. First, the system informed the user that
    the process stopped:


    ```

    [1]+ Stopped man man

    ```


    Second, the user was returned to the prompt. (On some systems, you must press
    the Enter key after the Ctrl+Z combination to get the prompt to appear.) Looking
    at the process list confirms that the process is still running:


    ```

    $ ps -ef |grep man

    david 8894 8870 23:18 pts/4 00:00:00 man man

    david 8895 8894 23:18 pts/4 00:00:00 sh -c /bin/gunzip -c /var/catman

    david 8896 8895 23:18 pts/4 00:00:00 /bin/gunzip -c /var/catman/cat1/

    david 8926 8870 23:20 pts/4 00:00:00 grep man

    ```'
  merge: -1
