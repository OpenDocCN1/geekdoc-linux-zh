- img_proc: true
  md: '# Diagnostics


    Now that you have a grip on the bulk of a script writer''s tools, you are ready
    to march off into the world of Korn Shell scripts, write your masterpieces and
    never make any mistakes or get confused by the shell''s pecadillos! If that''s
    what you are thinking, it''s time to eat a reality cookie. Reality cookies are
    what I eat (or feed my readers) when laboring under false assumptions.


    The reality is script writing is a creative process. And in any creative process
    there will be some false starts, errors, and even some disasters. Do you think
    Picasso''s trash bin was forever empty? This chapter provides some tools to help
    debug your masterpieces. Oh, and they will help with any nonmasterpiece scripts
    you create as well.


    Any program-oriented effort involves several phases: First, you are presented
    with a problem to solve; second, you dream up a possible method of attack on the
    problem; third, you create a prototype to test your suppositions; and fourth,
    you create the bulletproof version you. I''m leaving out the all-important step
    3.5, which is when you try to debug the script.


    As you will see, a few very enlightening shell options can help illuminate the
    shell''s processing of your lines. These provide insight when your regular expressions
    and wildcards are not doing what you expect them to do. That''s the thing about
    computers—they do what you tell them to do, not what you want to do.


    This chapter teaches you the following:


    +   - How to check your syntax

    - The shell''s command interpretation sequence

    - How to run the shell in verbose mode

    - How to get an execution trace

    - How to use other debugging hooks'
  merge: -1
  pgno: 276
- img_proc: true
  md: "# Syntax Checking\n\nBefore you take a look at some of the debugging options,\
    \ let's review the three primary ways to execute a script. Scripts can be run\
    \ in a subshell, in the context of the current shell, or a separate ksh command\
    \ can be issued to customize the debugging environment.\n\nFrom a debugging perspective,\
    \ you can present options to the ksh command specifying debugging options as -v\
    \ or -x. This technique creates a process running ksh, and that creates another\
    \ process running ksh with your script as stdin.\n\nThe trick is that the ksh\
    \ command can be used as a standalone command requesting the creation of a process\
    \ running ksh. This might be used in the case of a hapless C user who is stuck\
    \ in a company steeped in the culture of the C shell. The administrator sets up\
    \ the user's account such that it starts up ksh upon login. The user might choose\
    \ to execute the ksh program to perform their interactive work in the comfort\
    \ of a ksh environment.\n\nThe following example shows the ksh command executing\
    \ a script named your_script. Note that if you type the ksh command without the\
    \ additional script name syntax, the current shell starts a new, interactive instance\
    \ of the ksh program. Remember also that if you type the ls command, it starts\
    \ a new process running the ls program. Similarly, if you type the ksh command,\
    \ it starts a new process running the ksh program.\n\n```\n$ ksh_script\n```\n\
    \nAny shell variables and aliases created in the script are lost when the script\
    \ ends. A new process is created running the ksh program. The script is actually\
    \ executed within a process different from the parent ksh from which the command\
    \ is actually issued.\n\nThe following example starts a script that sleeps to\
    \ enable you to get a look at the processes supporting its run.\n\n```\n$ cat\
    \ sleeper\n#! /bin/ksh\nif [ -z $1 ]\nthen\n    length=30\nelse\n    length=$1\n\
    fi\nprint 'Awake to sleep for $length seconds'\nsleep $length\nprint 'Awake again'\n\
    $\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_277_0.png)"
