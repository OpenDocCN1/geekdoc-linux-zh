  md: '# Commands Within If Tests


    The conclusion you should be drawing by now is that an if test expects to be given
    a command to execute. It evaluates the return status (in variable ?) to see whether
    the command reports success status. If it was successful, it logic forces the
    commands between the then and fi to execute. if the command does not report success
    status, the commands between the then and fi do not execute.


    The following examples show simple commands within an if test. The first shows
    a successful ls command, whereas the second shows a failing ls command:


    ```

    $ ls j* # Two junk files exist

    junk junk2

    $

    $ ls -1 junk2 # Successful test

    > then

    > print "ls was successful"

    > fi

    -rwxr-x-- -- 1 obrien obrien 1398 Nov 19 13:54 junk2

    ls was successful

    $

    $ ls -1 junk3 # Unsuccessful test

    > then

    > print "ls was successful"

    > fi

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_138_0.png)


    The same result could be attained by an overt test of the contents of $?, but
    this style would be clumsy and unnecessary:


    ![](img/de6a3b5a3b516159c825f1c10314d877_138_1.png)


    # One-Line If Tests Using && || |


    Two operators are available in the Korn Shell to provide a one-line test. They
    are the && and || operators. The && means execute the command to the right only
    if the command on the left was successful. The || means'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# 124 Chapter 6: Flow Control


    execute the command to the right only if if the command on the left was not successful:


    ![](img/de6a3b5a3b516159c825f1c10314d877_139_0.png)


    ```

    $ ls junk2 && print ''Done''

    junk2

    Done

    $ ls junk3 && print ''Done''

    ls: junk3: No such file or directory

    $ ls junk2 || print ''Done''

    junk2

    $ ls junk3 || print ''Done''

    ls: junk3: No such file or directory

    Done

    ```


    This can be useful in scripts to quickly test whether a user has presented enough
    command-line arguments. The following example uses the set command to prepare
    the first three command-line arguments ($1, $2, and $3). Normally, this would
    be done by executing the shell as a script is started:


    ```

    $ print $$

    # No command-line args currently

    $

    $ set first second third

    # Set up first three command-line args

    $

    $ print $1

    # Display them

    first

    $

    $ print $2

    second

    $

    $ print $3

    third

    $

    $ print $$

    # Count is now three

    3

    $

    $ (($!)!=3)) && print ''Need three items, dude!''

    $

    # Use && to decide on reprompt

    $

    $ shift

    # Remove one argument

    $

    $ print $$

    # Count is now two

    ```'
