  md: 'characters until he happened to type a character that matches a command.

    Then, the editor would do whatever the command was supposed to do.

    If a user got vi and started to type the string Dennis, he would end up inserting
    s into the file. The command mode of vi does not recognize any of the characters
    D, e, n as commands. The first letter that is actually a command is the i, which
    means switch to insert mode. So the editor would deftly switch to insert mode
    and gladly accept whatever the user typed in that point on characters to be placed
    in the file.


    As I mentioned earlier, the editor does not (by default) indicate whether you
    are in command mode or insert mode. This can leave you very confused if you inadvertently
    type in something like Dennis while in command mode. By the time you look up,
    you see something like s is a dude onscreen. The natural question would be, “Where
    did the Dennis disappear to?” The missing letters were all interpreted as commands
    (one at a time) and discarded because they did not match any of vi’s commands.


    # ESCAPING FROM INSERT MODE


    Now that you can get into insert mode (by typing i, I, a, A, or 0), the question
    is, how do you get out of insert mode? You can''t type a letter because it will
    be interpreted as another character to be inserted into the file. You must escape
    from insert mode. If the editor gives the escape character while in insert mode,
    it means that the editor should switch back to command mode. Essentially, six
    commands cause vi to enter insert mode, and only one key sequence gets it out
    of insert mode (see Figure B.1). The only mode vi goes to when it exits mode is
    command mode.


    ![](img/de6a3b5a3b516159c825f1c10314d877_420_0.png)


    **Figure B.1:** The vi editor modes and how they relate to each other.


    The Esc key on your keyboard can sometimes cause problems. It does not always
    appear in the same place on all keyboards, and most importantly, it does not always
    send the same escape sequence on all keyboards. This means that you might be in
    the middle of an edit session, cruising along in'
