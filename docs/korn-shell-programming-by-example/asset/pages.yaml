  md: '# Documentation Support


    Back when I was a cub programmer in the olden days (early 70s), I would feed lustly
    off the thrill of creating a well-functioning piece of software. The creative
    thinking and teamwork were eagerly welcomed.


    However, another responsibility was put on the programmer''s shoulders that was
    not quite so attractive. Our boss wanted us to carefully document our work so
    that maintenance programming could be efficiently performed in the future if necessary.
    Needless to say, the FUTURE, as far as I was concerned at that point in my life,
    was...maybe dinnertime. As a young man, everything happened RIGHT NOW. There was
    no time to think about the future.


    So my approach to this wasteful busywork was to scribble some nonsense in the
    document, to meet the letter of the law, but not really put any effort into it.
    I had no mental energy to devote to this menial and boring task.


    Approximately a year and a half after I had participated in my first large software
    project, some changes had to be performed on the code I had created. Because I
    was still doing the job I had (you can see that my career was skyrocketing), my
    boss (sun guy—his career was skyrocketing also) came to me and plopped a bunch
    of printouts and specs on my desk and described the essence of the changes that
    needed to be made.


    On the top of the pile of materials was the documentation book. Yup, the same
    that I had not bothered to fill with useful information a year and a half ago.
    I cracked it open when I needed some help in figuring out the algorithms I had
    used 540 days ago. Unfortunately, I found nothing but my amateurish attempts at
    whitewashing the fact that I saw no use in documentation.


    The bottom line was that a project that should have taken me two days took me
    two weeks—all because I had taken a shortcut with the thrill of the software hunt
    instead of taking a few hours while the hurt was still fresh in my brain, I chose
    to write 10-minutes worth of gibberish so I could rush on to the next creative
    endeavor.


    I learned a major lesson at that time. I have since seen evidence that emphasizes
    documentation is worth its weight in stock options. Any pie chart that shows where
    the software bucks are being spent indicates that more than 80% of the budget
    goes to maintaining existing code, not the creation of new code.


    Not that I expect you to write a separate document that describes all the fine
    points of your script. I do, however, recommend that you use comments'
  merge: -1
