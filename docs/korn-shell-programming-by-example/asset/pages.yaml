  md: '# Scheduling Jobs


    The output from the at job is listed next:


    ```

    $ mail

    Mail version 8.1 6/6/93. Type ? for help.

    */var/spool/mail/shell": 1 message

    > 1 shell@moose.qx.net Mon Jun 12 02:03 13/389 "Output from your job"

    &

    Message: 1:

    From shell Mon Jun 12 02:03:48 2000

    Date: Mon, 12 Jun 2000 02:03:48 -0400

    From: shell@moose.qx.net

    Subject: Output from your job

    2

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_84_0.png)


    ```

    sh: not_a_real_file: No such file or directory Error message

    &

    ```


    It is important, as this example shows, to make sure the commands are entered
    correctly. Also, you should make sure that either files are reach- in the path
    of the user executing the utility or the full pathname is indicated; otherwise,
    you too will receive not a real file error.


    Relative times are not the only times that are allowed. Depending on your system,
    you can list a day and time. For example, you could tell it to run at 5 p.m. on
    Friday with the following command:


    ```

    $ 5 5 pm Friday

    at sort < test > test.input

    at <EOT>

    &warning: commands will be executed using /bin/sh

    job 4 2000-06-16 17:00

    ```


    at jobs can be listed with the -1 option, as shown with the following syntax:

    at -1 [-q queuename] [at_job_id...]


    If no queuename is used, the default is the queue. For example, the fol- low code
    performs a sorting routine 20 minutes from the time the user executed the command.
    Again the system sends the user an email indicat- that the process finished:


    ```

    $ -m now + 20 min

    at sort < test > test.sorted.2

    at <EOT>

    warning: commands will be executed using /bin/sh

    job 3 2000-06-12 02:29

    ```'
