    # File Attributes


    If a new file, such as the previous echo hello program, is created, the per-missions
    assigned to the file are based on the user''s umask. The default umask on most
    systems is 022. This default can be changed globally by the system administrator
    and individually in one of several files in a user''s directory, the most common
    place to change this setting is in the user''s profile file (typically named .profile).
    The entry would look like this:


    ```

    umask 002

    ```


    Assuming you have created a temporary file (use touch david for now), saved it
    in your home directory, and have called the file david, a long listing of the
    file would look like this:


    ```

    $ ls -l david

    -rw-rw-r-- 1 Pitts  users  24 May 13 16:57 david

    ```


    # NOTE


    > The $ is the default Korn shell prompt; it is not typed when you run the listing
    command. What was typed was ls -l david.


    Technically, nine pieces of information are given when you perform a long listing
    of a file (or directory):


    +   - Type of file

    - Permissions

    - Number of hard links

    - Owner

    - Group

    - Size

    - Month last modified

    - Day last modified

    - Time last modified

    - Name of the file'
  merge: -1
