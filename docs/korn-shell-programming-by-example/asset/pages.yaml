    # Moving the Cursor


    Now that you know the basics of vi, the next step is to start honing your skills.
    Many of the files you edit can be large. Suppose you want to move through the
    file rapidly? Typically, the arrow keys on the keyboard are available to move
    the cursor up, down, left, and right. If you try the arrow keys and they refuse
    to cooperate (sometimes the keyboard mappings are not what you expect), you should
    use the h, k, j, and l keys to move left, down, up, and right, respectively.


    Sounds like it takes many keystrokes (and much time) to move through a large file,
    doesn''t it? Generally, if you find yourself typing repeated movement keys for
    many seconds, you should think of another way to move around in your file. For
    instance, you can move forward and backward by page (rather than line) using several
    control-sequences. For instance, you can use Ctrl+D or Ctrl+F to move many lines
    at a time, and you can use Ctrl+U or Ctrl+B to move the cursor many lines at a
    time.


    Sometimes you might want to move immediately to the bottom of the file. The G
    command assumes you want the cursor at the end of the file. You can precede the
    G with a number to move to a specific line. I find the 16 command be useful for
    moving back to the beginning of a file.'
