    # Combining Buffers and Substitute Commands


    The notion of vi buffers discussed previously can be combined with any of the
    ex commands to customize and streamline your session. Suppose you find yourself
    typing in the following command (or commands similar to this) repetitively:


    ```

    :1,s/orig/DEN/g

    ```


    You can place this command in a buffer (exclude the :) and request the execution
    of the buffer full of commands with the :buffer_name command. You type the command
    as if you are trying to insert it into your file, leave off the colon, and delete
    the line into one of your buffers:


    ```

    :add

    ```


    This command requests a deletion of the current line and requests that the contents
    of the line be placed in the buffer named a. When you are ready to execute the
    stored command, type the following:


    ```

    :a

    ```


    # Changing vi Environment Settings


    The vi editor has many environment settings. These can be used to customize your
    editing sessions to meet your particular needs and habits. One of the more popular
    options, especially to novice vi users, is the showmode option. When set, it displays
    a small message on the bottom of your screen to remind you when you are in insert
    mode. This eliminates a lot of confusion and hesitation experienced by novice
    users.


