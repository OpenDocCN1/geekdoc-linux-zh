  md: 'Next, the at utility is run with the -l option to show all currently queued
    jobs:


    ```

    $ at -l

    2000-06-12 02:29 a

    ```


    For the Linux people out there, the atrm command is used to remove a job:

    atrm job


    In either case, as long as you are the owner of the job or superuser of the system,
    you can delete the job before it has time to execute.


    # What''s Next


    At this point, you should know how to run a command. The command can be a system-supplied
    command, such as ls, or it can be a shell script that either you or someone else
    has supplied.


    In addition, you now know how to find information about processes you have running,
    as well as other processes running on the system. You have learned how to suspend
    processes, move processes to the background, and even kill processes.


    This chapter also showed you how to schedule a process to run at a later time
    either repetitively with the cron utility or on a one-time basis using the at
    utility.


    Now that the environment is a more comfortable place, you can start building your
    own scripts. Chapter 3, "Variables," introduces the use of temporary variables
    used during the execution of a script.'
