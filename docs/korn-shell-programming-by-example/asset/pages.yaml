  md: '+   - -t—Prints the command line on the standard error output before executing
    it.


    +   - -P max-procs—Runs up to max-procs processes at a time.


    The following example uses while to create 19,000 files. The loop is stopped by
    Ctrl+C. The files are then deleted by piping the output of a find command into
    xargs using rm. The find command is used because an attempt to use rm * at the
    command line would cause a line too long error on most flavors of UNIX.


    Another option is to use the find command''s -exec option. However, it requires
    a process creation per file. In addition, it is not as efficient as xargs, which
    makes each process execute an rm command with as many filenames as it can fit
    on a single command line. This therefore leads to fewer processes created during
    the delete operation:


    ![](img/de6a3b5a3b516159c825f1c10314d877_252_0.png)


    ```

    $ count=1

    $ while $file$count # Create files using the redirect operator

    > do

    > count=$count+1

    > done # Terminate loop with a Ctrl+C

    $ ls -l | wc -1 # Count how many files we have created

    19168

    $ pwd

    /home/obrien/lotsofiles

    $ find . -name "file*" | xargs rm # Use find and xargs to remove

    $ ls -l | wc -1

    2

    ```


    # awk


    The awk command is a pattern scanning and processing language. It is a programmable
    filter. The name “awk” comes from the initials of the three creators of the program:
    Aho, Weiner, and Kernighan. It searches for a pattern and performs an action on
    pattern match. The actions performed are surrounded by curly braces ({ }). awk
    can be used to extend the features of the sed command.'
  merge: -1
