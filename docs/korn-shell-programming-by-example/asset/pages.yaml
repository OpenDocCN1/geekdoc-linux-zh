    Ctrl+[-. That is, holding down the control key (Ctrl), sends the [ key. You''ll
    see that it never fails to send the correct escape sequence to the vi editor,
    which means it can get you out of insert mode without any effects.


    # Last-Line Mode


    Last-line mode is entered by typing the : command while command mode. It is referred
    to as last-line mode because the editor actually places a small prompt (:) on
    the last line of the screen to indicate that it is ready for you to enter an command.
    Yes, it is expecting you to enter an ex editor command. Remember that the engine
    of vi is vi. Vi is a visual (screen-oriented) front to the ex editor. Therefore,
    any commands you can perform in the ex editor should also work in the vi editor.
    But you must indicate to vi that you intend to enter an command, which do you
    by typing the : command.


    # Exiting from the Editor


    Your few last-line mode commands are very simple. (They can get more complex.)
    You probably want to save your edits and exit from the editor. The last-line mode
    command sequence to this is :wq. This is actually the w, which writes the changes
    to the file, and the q, which means quit from the editor.


    Maybe you are hung over one morning, and you start making a bunch of changes to
