- img_proc: true
  md: '# Chapter 1: The Environment


    script, you could have typed echo Hello World! at the interactive prompt and done
    the same task.


    What happens if you have a file containing just the second line (in other words,
    the #!bin/ksh is not there)?


    If the shell you are currently executing can understand the command in the script
    file, it runs them; if it cannot, it produces some kind of error message and exits
    from the script. A simple example such as displaying some text would work just
    about any shell.


    By having the #!bin/ksh in the first line of the script, you ensure that the script
    will do exactly what you want to regardless of the environment or default interactive
    shell of the user, because you have explicitly told it to use the Korn shell to
    interpret the rest of the contents of the file. You should realize that the #!
    is a special line, not just an ordinary command line. The #! must be the first
    two characters in the first line of the file.


    Now, you might have some problems getting your simple program to run. If you edited
    a file and tried to run it, you might have gotten the error Permission denied.
    The reason for this has to do with you, you guessed it, permissions. Permissions
    are discussed in detail in this chapter. In essence, permissions determine who
    can do what with a file. You must tell the computer that the file you have just
    created should be treated as an executable.


    The following example shows a simple script that displays output onscreen. The
    permissions indicate that the file is not executable (no x in the permissions);
    therefore; the attempt to execute the script fails. The example then uses the
    chmod command to add execute access for the owner (u) and group (g) categories
    (ug+x—more later). After changing the permissions, script runs successfully.


    ```

    $ cat hello-k

    #! /bin/ksh # Uses Korn shell to execute the rest of the file (one line)

    print hello

    $

    $ ls -l hello-k # No execute permission

    -rw-r--r-- 1 obrien users 27 Sep 28 17:16:36 hello-k

    $

    $ hello-k

    k: hello-k: cannot execute

    $

    $ chmod ug+x hello-k # Add execute permission

    $

    $ hello-k # Script runs now

    hello

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_23_0.png)'
