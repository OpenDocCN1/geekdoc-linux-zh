  md: '# Signals


    I recently watched the movie The Bachelor. In the movie, one of the supporting
    cast playing the character of Margo is driving a limousine. The light changes,
    and the car in front of them sits. Margo yells at the driver, "What, not your
    shade of green?!" Apparently, in New York there are various shades of signals.
    The same (sort of) holds true for UNIX/Linux. There are different kinds of signals,
    but unlike green traffic lights, the differences matter.


    A signal can occur any time during the execution of a command or script. A signal
    is an interrupt sent to the command or script that indicates something has happened
    that requires attention.


    Every UNIX/Linux variant has a slightly different set of signals, but the capability
    they present is common. The signals that are most commonly used are shown in Table
    2.1.


    Table 2.1: Signals


    | Name | Value | Description |

    |---|---|---|

    | SIGHUP | 1 | Hang up detected controlling terminal or death of controlling process
    |

    | SIGINT | 2 | Interrupt from the keyboard (Ctrl+C) |

    | SIGQUIT | 3 | Quit signal from the keyboard (Ctrl+\) |

    | SIGKILL | 9 | Kill signal |

    | SIGTERM | 15 | Termination signal |


    Depending on your system, several ways exist to see all your system''s particular
    signals. For the most part, the kill -1 command lists the signals available for
    your system. Note that the command is kill dash ell, not kill dash one. The letter
    l stands for list in this case. The following are the signals for Linux:


    ```

    $ kill -1

    ```


    +   1 HUP Hangup 33 33 Signal 33

    2 INT Interrupt 34 34 Signal 34

    3 QUIT Quit 35 35 Signal 35

    4 ILL Illegal instruction 36 36 Signal 36

    5 TRAP Trace path 37 37 Signal 37

    6 ABRTort 38 38 Signal 38

    7 Bus error 39 39 Signal 39

    8 FPE Floating point exception 40 40 Signal 40

    9 KILLED 41 41 Signal 41

    10 USR User defined signal 1 42 42 Signal 42

    11 SEGV Memory fault 43 43 Signal 43

    12 USR User defined signal 2 44 44 Signal 44


    ![](img/de6a3b5a3b516159c825f1c10314d877_67_0.png)'
