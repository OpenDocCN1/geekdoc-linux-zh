- img_proc: true
  md: '# Chapter 10: Output Control


    close both involve taking the stdout from a program and doing something different
    with it. However, the pipe sends the output to another command for processing,
    whereas the redirect(>) sends the stdout to a file.


    $ ps | wc # ps command output piped to the wc command This concept can get confusing
    if you are not used to it. Just remember that the item to the right of the pipe
    is a command (usually a filter of some kind), whereas the item to the right of
    the redirect is a file. Consider this example:


    ```

    $ ps | wc

    3 12 83

    ```


    ```

    $ ps > wc # ps command output redirected to a file named wc

    ```


    ```

    $ cat wc # Examine contents of the wc file

    PID TTY TIME CMD

    614 pts/1 00:04:30 tsh

    16914 pts/1 00:00:00 ps

    ```


    # stderr Redirection


    If you are starting to feel comfortable with stdout redirection after our visit,
    let''s build further on by briefly revisiting stderr redirection. Just as you
    might want a full file of the stdout produced by your script, or produced by a
    command, you also might want a file of the error messages produced by your script.
    Not that you are going to print it out and hang it in the refrigerator, but you
    might want to produce a log of bad input records, erratic processing, or other
    exceptional events.


    Don''t worry, in Chapter 12, "Traps," you learn ways to control the default action
    of the Kernel Shell when it encounters certain errors or is sent certain signals.
    Consider the following example.


    ```

    $ find / -name ''den*'' 2 illegal # Redirect error messages to file illegal

    /proc/sys/fs/dentry-state

    /tmp/denn

    ```


    ```

    $ cat illegal # Messages in file

    find: /usr/doc/ppp-2.3.10/scripts/chatchat: Permission denied

    find: /proc/1/fd: Permission denied

    (...)

    find: /var/lib/locate: Permission denied

    find: /var/spool/cron: Permission denied

    find: /var/spool/at: Permission denied

    find: /var/gdm: Permission denied

    find: /tmp/orbit-root: Permission denied

    find: /etc/X11/xdm/authdir: Permission denied

