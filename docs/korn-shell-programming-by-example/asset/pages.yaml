  md: '# Output Redirection


    existing file, using >>. Output be redirected for the entire script, for the output
    of a subshell, for the output of a command, or for the output of a loop. The subshell
    and loop options are not intuitive, so we''ll take a look at them next.


    # Subshell Output Redirection


    You can run commands or scripts within a subshell by surrounding them with a set
    of parentheses on the command line. This forces the creation of a new process
    running a new copy of the Korn Shell program. Therefore, any changes made to aliases,
    environment variables, or the default directory will have no effect on the original
    shell. Remember the teenager analogy? Well, if your teenager gets a nose ring,
    does that mean you have to get one, too? No, because the teenager, in effect,
    is running in a subshell. The subshell is obviously, and maybe unfortunately,
    to the originating shell, but there is not an immediate impact on the originating
    shell upon an alteration to the subshell. Am I stretching it here? Forgive me,
    I''m just trying to get the point across.


    The following example creates a subshell that changes the default directory and
    performs a few other commands. The output of the subshell is redirected into a
    file. Note that the current working directory of the parent is not altered by
    the actions within the subshell.


    ![](img/de6a3b5a3b516159c825f1c10314d877_268_0.png)


    ```

    $ pwd

    /home/obrien/scripts

    $ (cd /tmp; pwd; ls -1) > subshell      # Redirect output of subshell

    $ pwd

    /home/obrien/scripts

    $ cat subshell

    /tmp

    Mon Nov 6 23:22:44 EST 2000

    total 32

    -rw-rw-r-- 1 obrien obrien 143 Nov 6 01:06 breakers

    -rw-rw-r-- 1 obrien obrien 0 Nov 4 16:21 denn

