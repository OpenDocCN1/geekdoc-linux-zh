  md: "# Chapter 9: File and Directory Manipulation\n\nThe following example shows\
    \ the typical Berkeley-style behavior for assigning group ownership of a new file,\
    \ and then it shows what happens when the system administrator switches to the\
    \ System V style of group ownership (typically by changing a kernel attribute):\n\
    \n![](img/de6a3b5a3b516159c825f1c10314d877_237_0.png)\n\n```\n$ id\nuid=201(obrien)\
    \ gid=15(users)\n\n# User obrien is in the 'users' group\n$ cd /tmp\n$\n$ ls -ld\n\
    drwxrxr-x  4 root       system    8192 Nov 2 16:47 .\n# Note group ownership of\
    \ directory is system\n$ touch den1\n$\n# Make a new file\n$ ls -l den1\n-rw-r--r--\
    \  1 obrien    users      0 Nov 2 16:52 den1\n# Note group ownership is 'users'\n\
    $ Change the system's behavior to its default which is BSD style.\n# (SysAdmin\
    \ will have to do this.)\n$\n$ touch den2\n$\n# Make another new file\n$ ls -1\
    \ den2\n-rw-r--r--  1 obrien    system      0 Nov 2 16:53 den2\n# Note group ownership\
    \ is 'system'\n$ \n```\n\n> NOTE\nGroup ownership issues are related to the UNIX\
    \ operating system you are running and are not directly the result of running\
    \ a particular shell.\n\n# Permissions\n\nPermissions determine the access allowed\
    \ to a file. In an earlier chapter, you looked at permission basics. We proposed\
    \ that the umask value could be subtracted from octal 777 for directories and\
