    > print "x equals 5"

    > else

    > print

    > print "x does not equal = 5"

    > fi

    x equals 5

    $

    ```


    If your test is complex enough, you might have to test for several conditions.
    The following script uses an elif clause to check for more than one condition
    in a single if construct:


    ```

    $ cat guess

    #/bin/ksh

    read guess?"What is your guess? " # Prompts for number

    if [[ [$guess -gt 48 ]]

    >then

    > print "too high"

    elif [[ $guess -lt 48 ]] # elif statement

    >then

    > print "too low"

    else

    > print "correct"

    fi

    ```


    $

    $ guess

    What is your guess? 23

    too low

    $

    $ guess

    What is your guess? 78

    too high

    $


