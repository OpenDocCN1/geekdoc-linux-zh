    $


    The here document capability enables a script writer to avoid the creation of
    extraneous files and the overhead of opening and processing their contents using
    a series of disk I/Os.


    # What''s Next


    Needless to say, as you gather more shell tools to help customize your scripts,
    and you introduce more complexity and sophistication into your creations, the
    potential for errors is increased. Chapter 11, “Diagnostics,” provides a quick
    look at the options available within the Korn Shell for debugging scripts.'
