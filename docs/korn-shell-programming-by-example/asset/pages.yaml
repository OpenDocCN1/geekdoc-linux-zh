- img_proc: true
  md: "# 258 Chapter 10: Output Control\n\ninput lines. The characters after the <<\
    \ are arbitrary (you can choose any series of characters). The shell knows if\
    \ you issue a command followed by the << and some characters, it is to interpret\
    \ each line of input from that point on to be presented to the command. But when\
    \ does the stream of input lines end?\n\nThe input lines end when the exact sequence\
    \ of characters that was placed after the << as an input line. So, the string\
    \ of characters acts as a bracketing mechanism. It says this point here in the\
    \ document and this point here in the document (the same string of characters\
    \ appearing at the beginning of a line in the script) is the input to be presented\
    \ to the command in front of the <<. Ah, so the output information is right \"\
    here\" in the \"document.\" Thus the name here document.\n\nThis mechanism works\
    \ at the command line as well, but it tends to be much more useful within the\
    \ body of a script.\n\nThe following example uses a here document to present the\
    \ data through which the grep command should search:\n\n```\nExample\n$ cat dates\n\
    #!/bin/ksh\nprint \"\\nToday's date is $\\$(date).\\n\\n\"\ngrep -i \"$1\" <<abcde\
    \ # Begin the here document\nDennis Sept. 16\nCheryl Sept. 3\nMark Sept. 19\n\
    Cliff May 17\nClint May 17\nabcde # End the here document\nif (( $? != 0 ))\n\
    then\n    print \"No info here in the document for $1\"\nfi\n$ dates cliff\n```\n\
    \nToday's date is Tue Nov 7 00:20:33 EST 2000.\n\nCliff May 17\n$ dates harry\n\
    \n![](img/de6a3b5a3b516159c825f1c10314d877_273_0.png)"
  merge: -1
  pgno: 273
