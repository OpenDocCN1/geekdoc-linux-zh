    The read statement can be used to read from files other than stdin. By

    def, a script that executes a read statement waits until the user

    ponds with some input. Well, how long do you wait after you your teenager, "What
    did you do last night?" Presumably, after a reasonable amount of time, you veer
    off into another course of action, such as saying, "Earth to teenager!" The point
    is that the read statement can provide a timeout factor (in seconds) by using
    the -t secs option (available in ksh93). You will see examples of reading from
    data files in the next chapter. The read command has many options. If you prefer,
    you can shorten the prompt and read combination as follows:

    read inumask?What umask would you like to use?


    If you want to include a timeout factor of 10 seconds, use the command:

    read -t 10 inumask?What umask would you like to use?"


    Although you can use the echo command to display information, you might have noticed
    that the example scripts are now using the print command almost exclusively. The
    print command is the preferred method for displaying output under the Korn Shell.
    It is more portable and faster. Many ksh implementations use a separate program
    to execute the echo command. The following example shows that on Red Linux the
    echo command is a separate program, whereas the print command is built into the
    shell:


    ```

    $ where echo

    echo: /bin/echo # The echo command is a separate program

    $ where print

    print: # Not found

    $ builtin | grep ^

    print # The print command is a built-in

    printf

    pwd

    ```


