    # sort


    The sort command places sorted input onto standard output. It performs ASCII sort
    (see the man page on ascii). If no input file is presented, it looks for data
    to be sorted from stdin. By default, the command sorts using whitespace-separated
    key fields, starting with the leftmost field. Older clerks using sort might indicate
    a different sort field using the +field_num syntax. That syntax is now obsolete.
    A sort command, such as sort +5 -k +2 -3 file_to_be_sorted, requests that the
    first key be found after the fifth field and stop at the sixth, and the tiebreaker
    key after the second field and stop at the third field. That syntax should be
    replaced with the following:


    ```

    sort -k 6 -k 3,4 file_to_be_sorted

    ```


    # NOTE


    The second key could have been shown as -k 3. The syntax shown is useful if the
    sort encompasses more than one field. Also, the -k option represents the first
    field as field number 1. (The obsolete syntax represented the first field as field
    number 0.) Obviously, the UNIX gods were totally uninterested in keeping any form
    of consistency with this command!


    Some of the options for the sort command are as follows:


    +   - -bIgnores leading blanks in sort fields or keys

    - -cChecks whether given files are already sorted; does not sort

    - -dConsiders only [a-z, A-Z, and 0-9] characters in keys

    - -fFolds lowercase to uppercase in keys

    - -gCompares according to general numerical value (might not be available on all
    UNIX variants)

    - -k POS1,POS2—Starts a key at POS1 and ends it at POS2

    - -mMerges sorted files; does not sort

    - -nCompares according to string numerical value

    - -o FILE—Writes the result on FILE instead of standard output'
