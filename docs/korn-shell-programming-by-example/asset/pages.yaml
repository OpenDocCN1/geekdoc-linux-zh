  md: "What happens if you try to run your Korn shell script from an interactive shell?\
    \ Because the script starts with the #! /bin/ksh, it should be capable of executing\
    \ from any environment.\n\nThe following example starts a C shell interactive\
    \ environment by running the csh command. Notice that the prompt changes from\
    \ $ to %. The Korn shell script still runs properly, and the exit command exits\
    \ the csh program and returns to the ksh interactive shell.\n\n```\n$ \n$ csh\
    \ # Start C shell\n% hello-k # Runs in C shell also\nhello\n%\n% exit\n```\n\n\
    The next example uses the stream editor sed command (discussed in Chapter 9, \"\
    File and Directory Manipulation\") to create a new file (hello-g) with the #!\
    \ line removed from the script. This provides the opportunity to see whether the\
    \ script can succeed in a non-ksh environment without the #! /bin/ksh. The result\
    \ is that the altered script will not run within the C shell because it tries\
    \ to interpret the contents of the script as if it were C shell script syntax,\
    \ Korn shell script syntax. Again, the example uses the chmod command to give\
    \ execute access to the user (owner) and group categories:\n\n```\n$ sed 's/#!//'\
