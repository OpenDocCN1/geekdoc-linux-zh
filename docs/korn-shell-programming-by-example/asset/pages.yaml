    This chapter examines how ksh uses regular expressions. The topics include character
    classes, pattern matching, back references, and metachar-acters. Although this
    is a fairly short chapter, the information contained herein is powerful and extremely
    useful.


    Mastering regular expressions will save you hours because complicated-processing
    can be performed with simple lines of code that, if they had to be programmed
    by hand, would be tedious and error prone.


    # Character Classes


    When I was in school, I took a number of classes, but none of them were on character.
    Ten years after graduation, I learned that my class was having a class reunion.
    Apparently, someone—in their wisdom—had associated with 226 other people and called
    us the "Class of 1985". Although I am an individual (just like everybody else),
    I have been categorized-as part of this larger group of people and am forever
    associated with whether they like it or not. I recall that when I was in high
    school there were four classes. There were then these other people who could also
    be categorized into parents, teachers, administrators, and staff.


    Similarly, characters are thrown into these classes. These classes are broken
    down according to function. Therefore, class cover for all the let-ters and for
    numbers. Several classes cover the types of characters, as well. Table 4.1 shows
    the character classes recognized by ksh and gives a brief description as to why
    they are grouped together. Be aware that most of these classes were created in
    Korn Shell 93 and will not work in earlier releases of ksh.'
