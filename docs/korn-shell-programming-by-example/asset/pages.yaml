- img_proc: true
  md: '# Jobs and Processes


    By the way, the |grep part of the command does two. The first part is the pipe
    symbol (|). This tells the system to take the output of the command ps -ef and
    pass it to whatever pipe instead of outputing to standard output (the screen).
    The second part, grep, is a way of searching for specific text. Whatever is sought,
    the grep command says what is being sought. So, in the previous example, the grep
    command says to return any line that contains the text "man".


    Hopefully, you saw something else that intrigued you when the system suspended
    the process. Here is another look at the output that informed you that the process
    had stopped:


    +   [1]+ Stopped man man


    Four pieces of information are here. In reverse order the command (man man), what
    the system is doing to the command (Stopped), and then two other pieces of information—[1]+.


    The [1] is the job number. A job is a command or sequence of commands (like a
    pipeline) presented to the shell on one line. The + after the job number indicates
    that this is the most recent job that was placed in the background.


    The command jobs will list all jobs currently in the background or stopped for
    the current user. In the following example, two commands are started and then
    put in the background with the Ctrl+Z sequence:


    ```

    $ jobs

    [3] + Stopped more defaults

    [2] - Done ls -la /usr |

    more

    [1] Stopped man man

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_62_0.png)


    Note that now three jobs are displayed, and the job with the + indicates the job
    most recently placed in the background. The job with the - next to it is the second
    job most recently placed in the background. Maybe you''re thinking that the job
    numbers would suffice to define the order, so who needs the + and -? Consider
    that a job can be moved from background to foreground many times during its execution.
    This means that the + can move from job to job based on recent activities.


    The shell keeps track of the most current and previously most current jobs. The
    most current job is indicated by the + sign. (Some operating systems use the [%]
    sign.) The previously most current job is indicated by the - sign.'
  merge: -1
  pgno: 62
- img_proc: true
  md: "# Chapter 2: Process Control\n\nThe job can fall into one of three status categories:\
    \ running, stopped, done. The done and stopped status categories could have a\
    \ code after them indicating how the process was stopped or indicating the exit\
    \ status of the done (finished) process.\n\nEach of the processes listed previously\
    \ is in a stopped state. You will recall that this means they are not receiving\
    \ any processing time and are not doing anything. These processes can be started\
    \ either in the background or in the foreground. Each of these terms is explained\
    \ in the following-sections.\n\n# Background\n\nThe bg command resumes a suspended\
    \ process in the background. This means the process will continue to run in the\
    \ background until it finishes or requires access to the terminal. If it requires\
    \ access to the terminal, it stops on its own, and displays a message to the terminal.\n\
    \nThe bg command, if executed without any parameters, assumes you mean to take\
    \ the most current job (+) and make it in the background. The following example\
    \ shows this:\n\n```\n$ bg                          # Operates on job number 3\n\
    [3] more .Xdefaults\n$ jobs\njobs\n[3] + Stopped (tty output) more .Xdefaults\
    \ # Waiting for input\n[2] - Done                    ls -la /usr |\n      Stopped\
    \                                 more\n[1] Stopped                          \
    \   man man\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_63_0.png)\n\nWhen\
    \ the jobs command is run, you can see that the job placed in the background has\
    \ stopped. The reason for this is indicated by (tty output) and means that the\
    \ job needs to access the terminal before it can proceed.\n\nJobs that are known\
    \ to require the terminal—such as the ones we have been using—are poor candidates\
    \ for background execution, but it provides some insights into the world of job\
    \ control.\n\n# NOTE\n\nIf you attempt to exit from a shell that has jobs running\
    \ in the background or in a stopped state, the shell reminds you of these processes\
    \ and will not let you exit without informing you of your stopped jobs:\n\n```\n\
    $ exit\nYou have stopped jobs\n```\n\nA second exit command must be given to allow\
    \ the user to exit the shell. The shell kills (discussed following) the jobs and\
    \ then kills the shell."
  merge: -1
  pgno: 63
- img_proc: true
  md: "More jobs than just the most current one can be resumed in the background.\
    \ As implied earlier, the bg command can have parameters. The parameters fall\
    \ into one of two categories. Either a plus (+) or minus (-) symbol can be used\
    \ to indicate the most current process, or %job_number can be used, where job_number\
    \ is the bracketed number as shown in bold here:\n\n```\n$ jobs\n[3] + Stopped\
    \      more .Xdefaults\n[2] - Done               ls -la /usr |\n    Stopped  \
    \             more\n    [1] Stopped          man man\n```\n\nTherefore, an example\
    \ of getting a different background command to start executing in the background\
    \ would be shown here:\n\n```\n$ bg %1\n[1] man man\n```\n\nYou might have guessed\
    \ that the process man man was restarted. However, it immediately stopped because\
    \ that particular process requires access to the terminal to continue, as shown\
    \ in the following output:\n\n```\n$ jobs\n[1] + Stopped (tty output) man man\
    \ more .Xdefaults\n[2] - Done               ls -la /usr |\n    Stopped       \
    \        more\n```\n\nNow that you have a process that needs to run with repetitive\
    \ interaction from the terminal, the question becomes, \"How can this be done?\"\
    \ The fg command can be used to take care of this.\n\n# Foreground\n\nWhen a command\
    \ is executed from the command line, it is automatically run in the foreground.\
    \ This means that it has access to (and control of) the terminal, and the user\
    \ must wait for the command to finish executing before the shell can be used for\
    \ other purposes. The fg command can be used similarly to the bg command to bring\
    \ a stopped command or a command currently running in the background into the\
    \ foreground. This is the situation we were left with in the background discussion.\n\
    \nIn the previous section, a process had stopped because it needed access to the\
    \ terminal. The jobs listing is repeated here for easy reference:"
