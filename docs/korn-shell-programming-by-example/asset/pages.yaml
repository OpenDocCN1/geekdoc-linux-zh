- img_proc: true
  md: '# nohup Explained


    The syntax is simple:

    /usr/bin/nohup command


    Showing how the nohup command requires the use of two terminals.

    in the first terminal, a simple sleep command is executed with nohup:


    ```

    $ sleep 10000

    nohup: appending output to `nohup.out`

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_78_0.png)


    You might recall that the problem with a process existing in the back-ground is
    that it gets into trouble when it needs to access the display.

    Get around this, nohup appends all output to a file in the current directory called
    nohup.out. This is the meaning of the line following the nohup com-mands in the
    previous command:


    The sleep command is a way of having a pause. The number following the sleep command
    is how long the process should sleep in seconds. Therefore, you are telling the
    shell to run the sleep command for 10,000 seconds (just over 27 hours), which
    provides plenty of time to kill the shell and watch what is happening from another
    shell.


    First, you must ensure that the process is running:


    ```

    $ ps -ef |grep sleep

    david 13793 13774 0 22:02:00 pts/2 00:00:00 sleep 10000

    ```


    After killing the parent shell of the command, existence of the sleep com-mand
    is again checked. To find out what has happened with the command, the ps -ef command
    is run with the output passed through the grep com-mand searching for “137”. This
    is a simple way of seeing all the lines that have that number in. This number
    was chosen because it is the first three numbers of the PID for the process (13793)
    and also the first three numbers of the PPID for the process (13774):


    ```

    $ ps -ef |grep 13773

    david 13774 1 22:01:07 00:00:00 -ksh

    david 13793 13774 0 22:02:07 00:00:00 sleep 10000

    david 13811 7776 0 22:05:25 pts/1 00:00:00 grep 127

    ```


    Killing the process requires nothing special; however, a HUP or signal 1 will
    not work. Therefore, a simple kill (which sends signal 15) will work to kill the
    process:


    ```

    $ ps -ef |grep 13793

    david 13903 7776 0 22:32:17 00:00:00 grep 127

    ```'
  merge: -1
