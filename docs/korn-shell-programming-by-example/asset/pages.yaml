    If you find that you are changing certain characteristics every time you enter
    vi, you should place your changes in the .exrc file in your home directory. (You
    probably will have to create this file.) This file is searched for and executed
    by vi each time it is invoked. Be sure that all commands placed in the .exrc file
    are last-line mode (ex) commands and are not preceded by the colon.


    The following example shows the contents of an .exrc file, which sets the number
    and showmode vi options:


    ```

