    Other options can also be used with parameter expansion. The syntax is similar
    to those shown previously. Table 5.1 shows several other available options.


    # Table 5.1: Parameter expansion options


    | Expansion Modifier | Description |

    | --- | --- |

    | ${parameter:-word} | Substitutes word if parameter is unset or null. |

    | ${parameter:=word} | Sets parameter to word and substitutes word if parameter
    is unset or null. |

    | ${parameter:+word} | Use word if variable is set. Use null otherwise. If parameter
    is unset or null, display word at standard error and abort script with unsuccessful
    status (1). Note that all four of the previous options can be used with or without
    the ::. With the colon, meaning of a variable that exists but has a null value)
    is treated as the same as the value of unset (a variable that does not exist).
    |

    | ${parameter} | Substitutes the number of characters in the contents of parameter.
    |

    | ${array[*]} | Substitutes the number of elements in the array. |

    | ${parameter#pattern} | If the regular expression pattern given found at start
    of the contents of parameter, it deletes the matching characters and substitutes
    the remainder. The smallest possible match is deleted |

    | ${parameter##pattern} | If the regular expression pattern given found at start
    of the contents of parameter, it deletes the matching characters and substitutes
    the remainder. The largest possible match is deleted |

    | ${parameter%pattern} | If the regular expression pattern given found at the
    end of the contents of parameter, it deletes the matching characters and substitutes
    the remainder. The smallest possible match is deleted |

    | ${parameter%%pattern} | If the regular expression pattern given found at the
    end of the contents of parameter, it deletes the matching characters and substitutes
    the remainder. The largest possible match is deleted. |'
