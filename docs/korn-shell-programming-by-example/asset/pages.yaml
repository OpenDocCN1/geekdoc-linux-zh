    The result is that you get some readable stuff onscreen, but you probably also
    get some weird beeps, backward question marks, and other gibberish. The gibberish
    would be overwhelming if you had tried to access a nonscript file.


    Therefore, it would be to your advantage to test the filename the user has presented
