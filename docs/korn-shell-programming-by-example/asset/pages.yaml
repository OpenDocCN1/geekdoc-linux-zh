  md: '# If Test 121


    ![](img/de6a3b5a3b516159c825f1c10314d877_136_0.png)


    ```

    $ [[ x = 5 ]] # Must precede variable with $

    $ print $?

    1

    $ [[ $x = 5 ]]

    $ print $?

    0

    $

    $ [[ $x = 5 ]] # Oops, space after the 5

    > # The shell assumes there is more syntax coming

    $

    $ [[ $x = "5" ]] # Quotes are ok too

    $ print $?

    0

    $ [[ $x == "5" ]]

    $ print $?

    0

    ```


    Notice that the test for equality == is made using a single =. In string equality
    tests (although the = will still work). If you are using ksh88, the == will cause
    an error when used for string comparisons.


    Other syntax options exist that can appear in older scripts you might be responsible
    for maintaining. The following example uses some syntax available for numeric
    tests of string contents (for instance, a string containing the numerals 1 and
    7 can be interpreted as the integer 17 or the string containing 1 and $x -eq 7):


    ```

    $ [[ $x -eq 5 ]]

    $ print $?

    0

    $

    ```


    # Syntax Options Used for Testing


    The following are conditional tests for numerics using [[ ]]:


    +   - -eq—Tests for equality

    - -ne—Not equal

    - -gt—Greater than

    - -ge—Greater than or equal to

    - -1lt—Less than

    - -1le—Less than or equal to'
