  md: '# Chapter 11: Diagnostics


    The output produced by this option can be distinguished from the regular output
    of the script because it is preceded by the + sign.


    In fact, the PS4 environment variable is being used to produce this character.
    You can set it to any value that will help you with your debugging; however, the
    default value is the +. This prompting can be turned on at several levels. You
    have now seen all four levels of prompting available in the Korn Shell:


    +   * PS1—Interactive shell prompt

    * PS2—Line continuation prompt

    * PS3—Menu selection prompt in a select loop

    * PS4—Verbose debugging output indicator


    The following example executes the masks_env script with the xtrace option enabled:


    ```

    $ head -2 masks_env

    #!/bin/ksh -X # Xtrace debug option is on

    $


    $ masks_env # Run the script

    + typeset -i defa

    + typeset -i onescomp

    + umask

    + (( onescomp~(0002) ))

    + (( defa=(8#666)&onescomp ))

    + default_perm--110110100

    + umask

    + print ''Default REGULAR FILE permissions with current umask (0002''

    Default REGULAR FILE permissions with current umask (0002) Normal output

