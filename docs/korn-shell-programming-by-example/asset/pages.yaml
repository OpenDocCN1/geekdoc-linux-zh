    # Arithmetic Expansion


    Command substitution uses the expression $(..), where the output of what is inside
    the parentheses replaces the expression. Arithmetic expansion uses a similar expression:
    (( ))


    An easy example demonstrates this. The following is a simple program for performing
    arithmetic expansion:


    ```

    #!/bin/ksh

    a=5

    b=6

    c=$(( a*b ))

    echo "$a $b equals $c"

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_128_0.png)


    At first glance, the reader is probably unsure what will happen with the echo
    command. Here is the output of the script (named Example55.ksh):

    $ ./Example55.ksh

    5 * 6 equals 30


    Notice that the echo command does not expand the math, but gives it literally.
    A common error here is in removing the double quotes around the echo command.
    Here is the program without the double quotes:


    ```

    #!/bin/ksh

    a=5

    b=6

    c=$(( a*b ))

    echo $a * $b equals $c

    ```


    And the following is the output:


    ```

    $ ./Example55.ksh CHECK Example51.ksh Example52.ksh Example53.ksh Example54.ksh
    Example55.

    5 * t k array_index assigning integers 6 equals 30

    ```


    It is important to recognize that the metacharacter * expanded it to all the files
    in the current directory. It assigned 6 to equal 30. This is obviously not what
    was intended; more than likely, it is not what the reader expected to happen either.'
