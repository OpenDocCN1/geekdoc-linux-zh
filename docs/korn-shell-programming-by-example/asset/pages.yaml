  md: "bit bucket, otherwise known as /dev/null. Note that if your implementation-of\
    \ ksh has an echo built in, you are still better off using the print-command because\
    \ of its portability. The massive speed difference shown in the following is due\
    \ to the fact that the echolts script uses to create (and destroy) 5,000 processes\
    \ to complete the task. The printlots script is executed within one UNIX process.\n\
    \nBe aware that the same performance difference can be seen when a script uses\
    \ sed, grep, and awk, when shell pattern sequences would have done the job. If\
    \ it is just once or twice during the running of a script, it won't make much\
    \ difference. But if you are in a many-pass loop, the differ-ence can be significant:\n\
    \n```\n$ time echolts\n...working...\n...working...\n...working...\n...working...\n\
    ...working...\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_205_0.png)\n\n\
    ```\nreal      1m7.54s      # Takes over a minute using echo program\nuser   \
    \   0m36.51s\nsys       0m30.99s\n$\n```\n\n```\n$ time printlots\n...working...\n\
    ...working...\n...working...\n...working...\n...working...\n```\n\n```\nreal \
    \     0m3.10s      # Takes 3 seconds using print\nuser      0m2.48s\nsys     \
    \  0m.63s\n$\n```\n\n```\n$ cat echolts\n#!/bin/ksh\nx=17\ninteger count\nwhile\
    \ (( count < 5000 ))\ndo\n    /bin/echo $x /dev/null      # Uses the echo program\n\
    \    (( count=count+1 ))\n    (( count%1000) == 0 )) && print \"...working...\"\
    \n```"
