  md: '# Chapter 1: The Environment


    To maximize their productivity, and be comfortable in their computing environment,
    system administrators and other computer professionals should learn how to write
    shell scripts.


    # Aliases


    Another shell technique that can save you a few keystrokes is using an alias.
    An *alias* is a way of doing something in shorthand. For example, the following
    alias takes the name/value pair. For example, the following alias takes the command
    -la and assigns it to the alias


    ```

    alias ll=''ls -la''

    ```


    After this alias has been created (either in a script, such as .profile, or manually
    by a shell prompt), the user can type `ll` and get a long list:


    ```

    $ ll

    drwx------- 6 shell 4096 May 16 10:32

    drwx-xr-x 22 root 4096 Mar 27 14:26 ..

    dr--r---- 1 shell 1422 Mar 27 14:26 .defaults

    dr--r---- 1 shell 24 Mar 27 14:26 .bash_logout

    dr--r---- 1 shell 230 Mar 27 14:26 .bash_profile

    dr--r---- 1 shell 173 Mar 27 14:26 .bashrc

    drwx-xr-x 3 shell 4096 Mar 27 14:26 .kde

    dr--r---- 1 shell 435 Mar 27 14:26 .kderc

    dr--r---- 1 shell 634 May 16 10:32 .profile

    dr--r---- 1 shell 3394 Mar 27 14:26 .screenrc

    drwx-xr-x 5 shell 4096 Mar 27 14:26 Desktop

    drwx-xr-x 2 shell 4096 Mar 27 14:26 public_html

    drwx-xr-x 2 shell 4096 May 1 19:51 scripts

    dr--r---- 1 shell 24 May 13 16:57 test

    ```


    The alias command is used to remove an alias:


    ```

    $ ll

    sh: ll: not found

    ```


    The value of an alias can be seen by typing the alias command:


    ```

    $ alias

    autoload=typeset -fu

    functions=typeset -t

    hash=alias -1

    history=fc -1

    integer=typeset -i

    local=typeset

    login=exec login

    newgrp=exec newgrp

    ```


