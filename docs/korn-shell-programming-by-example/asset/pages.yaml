- img_proc: true
  md: '# Scheduling Jobs


    at


    Use of cron is excellent for tasks that need to be repetitive. For tasks that
    need to occur once, the way to go is to use the utility.


    The utility reads commands from the keyboard and groups them together to be executed
    at a later, specified time. At an job runs as a separa-vation of the shell (with
    a separate process group); terminal; and inherits the environment variables, umask,
    the current working directory, and the system resources are that in place when
    the job is scheduled. Two ways of setting up an job exist. Their syn-tasks


    are shown here:


    ```

    @c|-k|s] [-m] [-f file] [-q username] -t time

    [@c|-k|s] [-m] [-f file] [-q username] timespec...

    ```


    The -c|s causes the process to run through a C shell, Korn shell, or Bourne shell.
    These options are not available under most Linux systems.

    The -m sends mail notification to the user that the job has completed.

    Conversely, the -f file reads from the indicate list of what is to be instead
    of reading from standard input.


    The -q username indicates which queue to schedule the job. The options are lowercase
    letters, a-z (some UNIX variants also support uppercase letters-Z), with a couple
    of exceptions. The queename of a is the default queue for jobs. The queename of
    b, on the other hand, is used for batch processing (this is started with the batch
    command and executed when the system is not busy with other processing). The queename
    of c is used for cron jobs and is not allowed to be used with the job at most
    UNIX/Linux systems. Any letter higher than c is valid, but as the queename approaches
    z, some UNIX systems increase the niceness under which the queename runs.


    # NOTE


    A process can be nice by indicating a willingness to utilize the CPU less often
    than it would if not being nice. This is accomplished by the nice command. The
    higher the specified factor, the nicer you are. The root user can be nasty with
    the nice command by specifying a negative number. This makes a process utilize
    the CPU more heavily than normal. The following is an example:


    ```

    $ nice -n 19 sleep 200 & # runs sleep (or some other command) nicer

    [1] 68773

    $ ps -o nice,pid,comm,pri # shows nice factor, pid, command, priority

    NI PID COMMAND PRI

    0 68773 sleep 44

    19 68773 sleep 63 # The higher the number, the less

    import you are

    ```'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Chapter 2: Process Control


    The only difference between the two is how you specify the time. Some differences
    (particularly with options) from what I describe depends on your particular operating
    system, be sure to read the manual pages for your version of UNIX/Linux. For the
    most part, though, the following examples should work across the board:


    ```

    $ -m now + 1 min  # Execute the sort command 1 min from now

    at sort < test > test.sorted

    at@ <EOT>  # Ctrl+D

    warning: commands will be executed /bin/sh

    job 1 2000-06-12 01:57

    ```


    In this example, the file name tested sorted and the output of the command sent
    to a file called test.sorted. The <EOT> was not typed, but the control key signal
    Ctrl+D was used, indicating the end of the commands to be run. Notice that the
    -m option was used so the user would receive email notification that the process
    ran. That email on a Linux system looks like this:


    ```

    $ mail

    Mail version 8.1 6/6/93. Type? for help.

    "/var/spool/mail/shell": 1 message

    > 1 shell.moose.qx.net  Mon Jun 12 01:57 11/341  "Output from your job"

    & 1

    Message 1:

    From shell Mon Jun 12 01:57:00 2000

    Date: Mon, 12 Jun 2000 01:57:00 -0400

    From: shell.moose.qx.net

    Subject: Output from your job  1

    ```


    Had there been any output from the job, that information would have been mailed
    to the user. This would include any standard output, such as echoes or print statements,
    as well as any standard errors. The following example is designed to produce an
    error. Notice that when the job is invoked, no validation takes place. All validation
    is done at the time of the execution of the command (technically, validation is
    done to ensure the job was set up properly, the commands the at job contains are
    not validated:


    ```

    $ -m now + 1 min

    at sort < not_a_real_file > not_a_real_file.output

    at@ <EOT>

    warning: commands will be executed /bin/sh

    job 2 2000-06-12 02:03

    ```'
  merge: -1
