  md: "# Chapter 8: Information Passing\n\nSo, if you can't remember the syntax for\
    \ a coprocess in the future, remember the two parts of it: sortaa piping and sortaa\
    \ background |&\n\nNext, you need a means of opening a communication path to the\
    \ waiting coprocess. the exec command can be used to execute a new command in\
    \ the context of the current process. UNIX programmers are familiar with the system-call\
    \ level of the function. Here, you use inside your script to indicate that the\
    \ current process wants to open file descriptor 3 (exec 3<) as a means to get\
    \ input (note the direction of the symbol <) that comes from the coprocess &.\
    \ Yes, I know the syntax is not intuitive. But it's not as if you have ever never\
    \ seen anything nonintutive in UNIX before!\n\nUsing the same technique, the next\
    \ command, exec 4&, opens up file descriptor 4 to write output to the coprocess.\
    \ In summary, writing to file descriptor 3 gets output from dbx, and the -r handles\
    \ reads with a continuation character at the end of (\\ as part of the line. The\
    \ semicolon allows the do to be on the same line for readability and style, whereas\
    \ the variable line is filled with a line of output from dbx running in the coprocess.\
    \ The case statement looks for and eliminates the lines of introductory information\
    \ from dbx as it starts.\n\nThe main loop is executed 50 times. The print command\
    \ is directed to file descriptor unit number 4 (-u4) and contains a simple dbx\
    \ command you will send to the coprocess 50. In reality, you would be sending\
    \ a bunch of commands to the utility running in the coprocess. The read gets the\
    \ next line of output from dbx on 3 and dumps it into the variable table. Then,\
    \ the next print appends the line to the file named times. Subsequently, this\
    \ repeats 50 times, at which point you finally send the quit command to dbx, which\
    \ ends the coprocess:\n\n![](img/de6a3b5a3b516159c825f1c10314d877_217_0.png)\n\
    \n```\n# cat coprol\n!/bin/ksh\n[$1 != 2 ]] && {\n  print \"Usage should be: $0\
    \ vunix vmcore\"\n  exit 1\n}\n>times\ndbx -k $1 $2 /dev/null 2>/dev/null |& #\
    \ start dbx coprocess\nexec 3& # use fd 3 to read from dbx\nexec 4& # use fd 4\
    \ to write to dbx\nwhile read -ru3 line; do\n  # get through dbx banners\ncase\
    \ $line in\n  *) continue; # skip blank lines\n    *dbx*) continue; # skip dbx\
    \ banner\n    *Type*) continue; # skip dbx banner\n    *stopped*) break); # exit\
    \ this loop\n```"
