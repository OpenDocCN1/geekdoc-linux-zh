  md: '# Acceptable Filenames


    presented earlier, while useful, is flawed. With a mask of 777, the subtraction
    technique yields -1,-1,-1, which makes no sense.


    The one''s complement of the mask is derived and bitwise ANDed with the raw permission
    value (666 for files; 777 for directories). The resulting permissions for a nondirectory
    file when the mask is set to 677 would be ----.


    The following example sets an unusual umask value (677) and creates a file to
    demonstrate the application of the umask:


    ```

    $ umask 677                               # Set umask value

    $ touch test4                              # Create file

    $ ls -l test4

    ---------- 1 obrien guest      @ Nov 2 01:51 test4 # Note permissions

    $

    ```


