    # # Redirection


    Many times wish you could play back a tape of a past conversation with your teenager.
    To do this, you would have to created an audio tape as the teenager was spouting
    the output. In the world of scripts, you might want to store the output in a file.
    You also might prefer to capture all the output, or just some of it. This section
    explains input and output redirection.


    Three streams can be redirected: stdin, stdout, and stderr. By default, all three
    of these streams are directed to (or from in the case of stdin) your terminal
    device. A stream can be thought of as an open file, despite the fact that we are
    talking about the terminal device being open. Therefore, the shell deals with
    stdin, stdout, and stderr as permanently open files for your process.


    Each file that is open in a process is represented by a file descriptor. File
    descriptors are small (usually) integer numbers that represent stdin, stdout,
    and stderr are 0, 1, and 2, respectively. Some UNIX variants allow a process to
    have up to 64 open files. I know of one UNIX variant (Compaq''s Tru64 UNIX) that
    allows a process to have up to 65,525 concurrently open files. That ought to do
    it, huh?


    We will focus on redirection involving stdin, stdout, and stderr. Back to your
    teenager for an analogy. (By the way, if YOU ARE a teenager, no offense meant
    in all these examples, I''m sure you can relate to the situations portrayed.)
    If your teenager keeps asking you for permission to attend a Metallica concert
    and repeats the request again, and you eventually say, "Go ask your mother." (Or
    father as the case may be.) If you can relate,'
