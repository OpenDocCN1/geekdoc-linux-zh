  md: '# Flow Control


    The truth about shell programming is that there is no single way to get a job
    done. Sometimes a given set of circumstances dictates the best way to accomplish
    a task, but if the circumstances change, the path down which to travel to arrive
    at the point of accomplishment becomes less certain. Sometimes logic says we should
    take the path less traveled.


    This chapter introduces control structures, mechanisms by which you can automate
    decision making as your script runs. These decisions can involve the termination
    of repetitive activities, the testing of a variable value against a series of
    cases, testing file existence and characteristics, or simply testing a variable
    for equality. You will see several syntax options that enable the script''s logic
    to branch, flow and repeat infinitely, and flow and repeat a set number of times,
    or flow and repeat until a condition is met. You also will find ways to break
    out of a looping construct.


    This chapter teaches you the following:


    +   * The Syntax of an if test

    * How to use (( and [

    * How to use the case statement

    * How to use while loops

    * How to use until loops

    * How to use for loops

    * How to use select loops

    * How to use the break and continue commands'
  merge: -1
  pgno: 132
