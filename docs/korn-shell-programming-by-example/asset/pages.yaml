  md: "$ guess\nWhat is your guess? 48\ncorrect\n$\n\n# # Compound If Tests\n\nIf\
    \ you need to combine more than one test to see whether a condition is met, you\
    \ can use the syntax from the one-line conditionals (&& and ||) to create compound\
    \ conditionals. Keep in mind that the && causes the execution of the command to\
    \ its right only if the command to its left reports success status. Well, suppose\
    \ the command to its left is an if test? This would result in the left test being\
    \ performed, and if the test evaluates to true (success), if the test to the right\
    \ of the && will also execute, and so forth. Essentially, the && functions as\
    \ a logical and in this case. This means that the entire logical evaluates to\
    \ true only if the if test evaluates to true.\n\nLikewise, the || as a logical\
    \ or, which means the test to the right must evaluate to true for the result of\
    \ the entire logical or to be true. The following example tests to see whether\
    \ the user responds with y or yes, and if so, it tests to whether the filename\
    \ found in the first command-line argument ($1) is a regular file. If the user\
    \ response (prompt is not shown here) is y or yes, the type of file is checked.\
    \ If it is a regular file, the entire compound evaluates to true. So whatever\
    \ commands appeared after the then would be executed:\n\n```\nif [[ ($resp==yes\"\
    \ || $resp==y\") && -f $1 ]];\nthen\n  do_some_commands\nfi\n```\n\nBe aware that\
    \ the testing part of a compound if terminates when enough information has been\
    \ gathered to determine the result of the compound test. For instance, in the\
    \ previous example, if the user had responded to the prompt with no, the -f $1\
    \ test would not have been performed. The reason for this is that the result of\
    \ the && could have been determined after the left part of it evaluated to false.\
    \ If the left half of the && compound test—evaluates to true only if both halves\
    \ are true—why even bother with the right half? The shell already knows how the\
    \ movie turns out. It doesn't get the girl and the truck blows up No! I'm sorry.\
    \ I lost it in a Die Hard plot.\n\nThe shell realizes that the entire compound\
    \ evaluates to false if the left half of a logical and (&&) evaluates to false,\
    \ the testing is “short circuited” at that time and the right part of the compound\
    \ test is never"
