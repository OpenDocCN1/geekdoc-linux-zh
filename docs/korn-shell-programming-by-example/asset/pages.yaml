  md: '# File and Directory Manipulation


    When you receive an important document, you probably store it in a file cabinet.
    Chances are the file cabinet has an organization involving several drawers and
    various folders and maybe even subfolders. The alternative is to throw all your
    important documents into a shoebox and stash it under your bed. Note that both
    methods achieve the goal of storing the document.


    The difference is apparent when the time comes to retrieve the document. If you
    are of the shoebox persuasion, you will probably spend some time pawing through
    all the unordered papers you had heaped into the shoebox. On the other hand, if
    the papers are organized into drawers, file folders, and subfolders, retrieving
    the appropriate paper would be a matter of opening the correct drawer and grabbing
    the correct folder. The latter approach closely resembles a description of file
    storage within a directory hierarchy.


    All modern file systems provide a directory hierarchy to help organize the storage
    and retrieval of files. Access to files and directories is a very visible part
    of the shell''s interaction with the system and the user.


    This chapter teaches you the following:


    +   * How the PATH variable works

    * How files and directories interact

    * How file attributes describe files

    * The use of device special files

    * How to use hard links and symbolic links

    * Methods of file access

    * The nature of filter commands

    * A safe way to create temporary files'
  merge: -1
  pgno: 220
- img_proc: true
  md: "# Paths\n\nA user or script can request access to a file using an *absolute\
    \ file specification* or a *relative file specification*. An absolute file specification\
    \ provides the directory and subdirectory hierarchy path to locate the file. A\
    \ relative file specification locates the target file relative to the current\
    \ working directory. The following example starts by accessing a file using a\
    \ relative file specification. After changing the default directory, the relative\
    \ file spec no longer works, but an absolute file spec will always work no matter\
    \ where your directory is currently.\n\nThe following example successfully uses\
    \ a relative file specification, changes the default directory, and then fails\
    \ when attempting to re-execute the same command using the relative file specification.\
    \ The problem is then solved by using an absolute file specification:\n\n```\n\
    $ cat params # Relative file spec\n!/bin/ksh\nprint \"Argument 1 is ${1}\"\nprint\
    \ \"Argument 2 is ${2}\"\nprint \"Argument 3 is ${3}\"\nprint \"There are $# arguments.\"\
    \n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_221_0.png)\n\n```\n$ \npwd\n\
    /home/obrien/scripts\n$ \n$ cd / # Change default directory\n$ cat params # Relative\
    \ spec fails\n-ksh: cat: params: cannot open [No such file or directory]\n$ \n\
    $ cat /home/obrien/scripts/params # Absolute spec works\n!/bin/ksh\nprint \"Argument\
    \ 1 is ${1}\"\nprint \"Argument 2 is ${2}\"\nprint \"Argument 3 is ${3}\"\nprint\
    \ \"There are $# arguments.\"\n```\n\nA relative file specification is, at first\
    \ glance, an incomplete file spec. If you present the command `ls -l obrien` in\
    \ the current working directory (displayed with the pwd command). If it is a command\
    \ file being sought by the shell—such as when a command, script, or program is\
    \ being sought—it looks at the contents of the $PATH variable for a list of locations\
    \ in which to look for the file."
  merge: -1
  pgno: 221
- img_proc: true
  md: 'The shell can determine whether to use the PATH variable or use the current
    working directory, by the position on the command line. Filenames-appearing immediately
    after the shell prompt ($) are treated as commands, and therefore are sought by
    the directories listed in the PATH variable.


    In the command ls -l mydata, the ls is sought in the PATH directories, whereas
    the mydata is sought from the current working directory. Both of these search
    locations can be overridden by an absolute file specification, such as /usr/bin/ls
    -l /usr/users/obrien/mydata.


    The following example displays the current working directory and the contents
    of the PATH variable. It also documents how to change the PATH variable:


    ```

    $pwd # Data files are sought from this directory

    /home/obrien

    $

    $ print $PATH # Commands and scripts are

    $ sought from these directories

    /usr/local/bin:/usr/bin:/usr/X11/bin::

    $

    $ PATH=$PATH:/usr/opt/networker/bin # Changing PATH variable

    ```


    In a script, the habit be to provide an absolute spec wherever possible. This
    eliminates the possibility of a user-defined alias replacing the command you had
    intended to run. This would introduce a level of unpredictability to the script.
    The next example shows the danger of relying on relative file paths in a script.
    For illustration purposes, this example is command-line-based. The same principles
    apply for scripts.


    The following example shows the ls command being replaced by an alias:


    ```

    $ls #''ls'' working properly

    getppid.c getppidfunc.c

    $

    $ alias ls=''cat'' # Make an alias for ''ls''

    $

    $ ls # Now ''ls'' does a ''cat'' command

    #include<unistd.h>

    #include<stdio.h>

    #Some file contents

    int main(void)

    {

    printf("Parent PID is %d\n",getppid());

    }

    #include <unistd.h>

    #include <stdlib.h>

    ```'
  merge: -1
