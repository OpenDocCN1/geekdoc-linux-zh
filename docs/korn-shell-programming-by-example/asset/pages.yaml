    # Here Documents


    No, this is not an example of what you do when you have a dog documents and you
    want him to come to you. I have found that the concept of the here document has
    caused weeping and gnashing of teeth among script writers. More specifically,
    this capability has caused heads to be scratched when trying to make changes or
    additions to production-admin-level scripts.


    I think the reason for all the uproar is that the syntax is not intuitive and
    the name "here document" doesn''t bring a picture to mind. Let''s review the >>
    symbol redirects output, and the >> symbol redirects output but appends to the
    target file rather than clobbering the target. The < symbol redirects input so
    that it comes from the file appearing after the symbol. Well, that leaves the
    << symbol, doesn''t it?


    Prior to seeing the << symbol, you''re probably feeling pretty good about your
    shell- and script-writing knowledge. You are using loops, patterns, functions,
    tests, and redirections and having a spectacular time. So, you decide to accept
    the assignment of making several changes to an aging admin script written years
    ago by some guru who is long gone. You probably blast along, enjoying the semiovuristic
    experience of getting into somebody''s mind and trying to re-discover what he
    had in mind for the various sections of his script.


    Remember what it was to hit a speed bump when you weren''t expecting it? That''s
    probably how you felt when confronted with the << syntax. What the heck is this?
    Two requests to redirect stdin? Then you probably reviewed the difference between
    >> and > wondered if there was some kind of append-related difference to equate
    with the < and << symbols.


    Try as you might, you just couldn''t get your aching brain around it. Does this
    story sound like it stems from first-hand experience? Well, it does. I wish I
    could say that it wasn''t me who was suffering from confusion and delusion. It
    was.


    I looked in the man page for ksh and found what I needed. The << is followed by
    a string of characters that indicate the beginning of a stream of'
