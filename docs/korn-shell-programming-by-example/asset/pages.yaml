  md: '# printf


    If you output vocabulary and style needs another level of maturation, the Korn
    Shell provides the printf command. The "f" in printf stands for "for-formatted.\
    So, this command provides some formatting options for your output. It can handle
    floating-point displays, integer displays, and string displays. If this is starting
    to sound familiar to you C language programmers out there, it should. The printf
    command is based on the printf function in the standard C library.


    Its syntax uses a quoted format section followed by the variables to be placed
    in the formatted specification. The format string can contain zero or more control
    variables, which will be replaced by the respective variables at the end of the
    command line.


    The control variables are designated by the % symbol. The following command produces
    an output line of -. The total is 245, followed by a newline (

    ). The value 245 is the contents of the shell variable tot:


    ```

    printf "Total is %d.\n" $tot

    ```


    > NOTE

    printf does not include the newline unless you request it. In contrast, the printf-command
    automatically includes the newline.


    Table 10.1 documents the printf format specifiers.


    # Table 10.1: printf Format Specifiers


    | Specifier | Description |

    |---|---|

    | %%d | Decimal integer |

    | %%e | Float (scientific notation) |

    | %%f | Float (decimal) |

    | %%o | Octal integer |

    | %%P | R.E. to shell exp |

    | %%s | String |

    | %%x | Hexadecimal integer |


    Table 10.2 displays some twists on the format specifiers.


    # Table 10.2: printf Format Specifier Wrinkles


    | Specifier | Description |

    |---|---|

    | %%+d | Positive integer with + sign. |

    | %%8d | Right justify, eight places, int. |

    | %%*d | * specifies width variable. |

    | %%q | Surround output with quotes. |'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Table 10.2: continued


    | Specifier | Description |

    |---|---|

    | %%x | Hex number with Ox. |

    | %%2f | Two characters after the period. |

    | %%9s | String nine places. |


    The following examples use many of the printf statement''s format specifiers.


    The first example uses %d, %x, and %o to request an integer variable displayed
    in different number system bases (decimal, hex, and octal). The example emphasizes
    that any format specifiers not matched with a shell variable will be displayed
    as a zero:


    ```

    $ integer=82

    # Decimal examples

    $ printf "x contains %d decimal, %x hex, %o octal\n" $x

    x contains 82 decimal, 0 hex, 0 octal

    ```


    The following example uses three format specifiers and three shell variables (x
    three times):


    ```

    $ printf "x contains %d decimal, %x hex, %o octal\n" $x $x $x

    x contains 82 decimal, 52 hex, 122 octal

    $

    ```


    The following example shows how printf interprets a mismatch in the number of
    format specifiers (one in this case) and the number of shell variables to be substituted
    (three in this case). Note that if you present more variables than than, printf
    uses the last specifier repeatedly for the trailing shell variables. This is another
    instance in which the behavior of the printf command differs from the printf function
    in the C programming language standard library:


    ```

    $ integer=82

    $ printf "x contains %d decimal\n" $x $x $x

    x contains 82 decimal

    x contains 82 decimal

    x contains 82 decimal

    $

    ```


    The following example uses the plus sign in front of a format letter to indicate
    that a sign is desired in the output:


    ```

    $ printf "x contains %+d decimal, %x hex, %o octal\n" $x $x $x

    x contains +82 decimal, 52 hex, 122 octal

    $

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_264_0.png)'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Chapter 10: Output Control


    The next example precedes each format letter with a number (5) to request a minimum
    of five spaces be allocated to display the number. Note that if more than five
    spaces are needed, it expands as necessary:


    ```

    $ printf "x contains %5d decimal, %5x hex, %5o octal\n" $x $x\n x contains 82
    decimal, 52 hex, 122 octal\n$

    ```


    This example also requests five spaces for each formatted display value, but it
    includes a dash (-) in front of the size number, which requests that the display
    be left justified:


    ```

    $ printf "x contains %-5d decimal, %-5x hex, %-5o octal\n" $x $x\n x contains
    82 decimal, 52 122 octal

    ```


    The next series of examples switches to floating point. The first example establishes
    a shell variable named ave and initializes it to 18.654. Note that the command
    float is new in ksh93 and might not be available in your version of ksh. It then
    displays the contents of ave in float format (%f), and formatted within a 10-space
    field with only two characters after the decimal point (%10.2f):


    ```

    $ float ave=18.654 # Floating point examples\n$ printf "ave contains %f, %e, %10.2f\n"
    $ave $ave $ave\n ave contains 18.654000, 1.865400e+01, 18.65.

    ```


    The next example asks for the floating point variable to be displayed with three
    characters after the decimal point and then one character after the decimal point.
    Note that %.1f format request resulted in the value being displayed rounded off
    (not truncated):


    ```

    $ printf "ave contains %.3f, %.1f\n" $ave $save $ave\n ave contains 18.654, 18.7.\n$

    ```


    Many script writers are unaware of the advantage of declaring a variable as type
    float. Remember that float is an alias for types -E. Most scripts produce correct
    output or not the shell variable is declared as type float. The following example
    uses a few loops to perform some floating-point calculations repetitively:


    ```

    $ float floater1\n!/bin/ksh\nx=17.56 # x is of type string, not float\ninteger
    y=0

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_265_0.png)'
  merge: -1
  pgno: 265
- img_proc: true
  md: "```\nfor (( y=0; y<5; y++ ))\ndo\n  while (( x<20000.0 )) # Repeat as long\
    \ as x is less than 20,000.0\n  do\n    (( x=x+1.2 )) # x must be converted to\
    \ float each time\n    done\ndone\nprint $x\nprint $y\n$\n```\n\n```\n$ time floater1\
    \ # Correct output\n20001.16\n5\n```\n\n```\nreal Øm4.56s # Took about 4.5 seconds\
    \ to run\nuser Øm4.49s\nsys Øm0.04s\n```\n\nNow let's see what happens if you\
    \ take the time to properly prepare the variable that is the focus of all this\
