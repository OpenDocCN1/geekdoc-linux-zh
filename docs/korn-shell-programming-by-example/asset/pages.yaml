  md: '# What Is a Shell?


    A *shell* is a program that enables the user to enter commands. The commands entered
    by the user are checked and interpreted by the shell. The shell produces a prompt
    (typically the $) and waits for the user to type a command.


    The command may be executed within the context of a new process (for example,
    ls), cause some functionality within the shell program itself to execute (for
    example, print), or cause an error to be reported (for example, non existent_command).


    If you are totally new to the shell environment, you probably envisioning a shell
    covering over the critical essence of something, much like a peanut shell covers
    the peanut. Consider the shell as a neighborhood through which you can pass to
    get to downtown. Downtown, in this case, is the kernel of your operating system.
    Any program, the shell, might not communicate with the UNIX kernel for low-level
    activities such as file access.


    The shell discussed in this book is the Shell created by David Korn of Bell Labs.
    We will also include features of the ksh 93 version of this program.


    When used interactively, a shell prompts the user for input. The input is a string
    in the form of a command. Each interactively entered command is interpreted by
    the shell. The interpretation checks the syntax of the command and performs other
    shell-level processing before the interactive command is actually executed.


    For example, if you type in a command of ls -l, the shell interprets the line
    as a series of tokens consisting of the following: the ls, the -l, and the obrien.
    The shell must locate the command file, check to see whether this user is actually
    permitted to execute the command, and perform other sanity checks before it actually
    runs the ls. When the ls runs, it checks the -l and obrien and uses them appropriately,
    or issues an error if necessary.


    The ls program runs in the context of a process. All programs run within their
    own process contexts. I like to think of the process as the ocean in which the
    program floats. The context provided by a process is used to support the running
    of a program. (You learn more about processes later in the book.)'
  merge: -1
  pgno: 21
