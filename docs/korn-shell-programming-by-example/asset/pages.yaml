    deleted (or yanked) command in the GPB. It does not perform the append operation
    by default.


    The vi editor provides buffers other than the GPB. Some of these other buffers
    are referred to as named buffers in the previous paragraph. Their names are the
    letters of the alphabet (so you can have an additional 26 buffers beyond the GPB).
    To use them, you must precede your delete or yank command with a " (double quote)
    and the name of the target buffer (a letter). The following command deletes five
