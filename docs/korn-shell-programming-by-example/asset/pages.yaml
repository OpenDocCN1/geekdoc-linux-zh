  md: 'The jobs command was run twice quickly after the kill command. By doing so,
    the user was able to take a glimpse at what was happening. It seems that the more
    command was first terminated. Then, after that process was released, the killed
    process could be released.


    The third way of using the kill command is shown here:

    `/usr/bin/kill -l exit_status`


    You might recall from the discussion on background processing when processes are
    running in the background, and the shell is shut down, the shell informs you that
    processes are running and that you must exit time to kill the processes and exit
    the shell. This is the default response of the shell when it receives the HUP
    signal (HUP stands for hangup). If a process is a child of the shell and that
    goes away, so do its children:


    ```

    $ ps -ef | grep pts

    root 7775 7774 0 Jun10 pts/1 00:00:00 [login]

    david 7776 7775 0 Jun10 pts/1 00:00:00 -ksh

    david 12475 7776 0 16:05 pts/1 00:00:00 [more]

    david 13642 7776 0 21:26 pts/1 00:00:00 ps -ef

    david 13643 7776 0 21:26 pts/1 00:00:00 -ksh

    ```


    In the previous listing, the logon process is the parent process of ksh. Also,
    ksh is the parent of the other commands.


    Now, at this time you are probably thinking, "Does this mean if I start a process,
    I cannot log out until that process finishes? If I just want the process to run
    all night, or at least until it finishes?


    Well, I asked you. This shows you are paying attention. Fortunately, there is
    a way of having a process run where it ignores the hang up. This is accomplished
    through the nohup command and is explained next.


    # nohup Explained


    The command nohup is used to ensure that a process will run even if it loses contact
    with the terminal which it is attached.'
