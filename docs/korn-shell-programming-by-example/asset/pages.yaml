    # grep


    The grep command uses regular expressions to search for a pattern of characters.
    The letters stand for global regular expression print. The grep command searches
    through the contents of files for the requested patterns; it does not search for
    filenames. If you need to search for filenames, use the find command.


    Some of the options for the grep command are as follows (check your man pages
    to see whether UNIX supports all these options):


    +   - -A NUM—Prints NUM lines of trailing context after matching lines

    - -B NUM—Prints NUM lines of leading context before matching lines

    - -b—Prints the byte offset within the input file before each line of output

    - -c—Prints a count of matching lines for each input file

    - -f FILE—Obtains patterns from FILE, one per line'
