- img_proc: true
  md: "# Chapter 9: File and Directory Manipulation\n\nnot inadvertently clutter another\
    \ user's files in the shared /tmp directory.\nBut how can this be achieved without\
    \ cumbersome existence and namechecking code?\nIf you name your temporary file\
    \ with the shell variable $$ at the end, you will be creating a filename with\
    \ your process identification number (PID) tacked on the end. Because the system\
    \ guarantees that two processes with the same PID will not be in existence at\
    \ the same time, you are all but guaranteed a unique filename. The $$ will be\
    \ expanded into the PID of the current process.\n\nThe following example creates\
    \ a file with a PID on the end of the name:\n\n```\n$ $$          # Shows current\
    \ PID\n204646\n$\n$ touch denfile$$ # Create file using current PID to make it\
    \ unique\n$\nls -den*\n-rw-r--r-- 1 obrien guest      0 Nov 3 01:03 denfile204646\n\
    \               # Note number in name\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_255_0.png)\n\
    \n# What's Next\n\nNow that you have buffed up your file and directory knowledge,\
    \ your next job is to try for more sophistication in the output you generate from\
    \ your scripts. Chapter 10,\"Output Control,\" distinguishes the echo, print,\
    \ and printf commands. It also introduces some additional redirection options,\
    \ including here documents."
  merge: -1
