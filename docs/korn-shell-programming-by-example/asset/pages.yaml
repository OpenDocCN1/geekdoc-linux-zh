  md: '# What Is a Shell Script?


    When Hollywood actors are given a script to read, they follow the sequence of
    dialogue as it appears in the document. Likewise, a shell script is a pre-defined
    sequence of dialogue to be presented to a shell. A shell script is a full file
    of commands to be executed.


    # #!/bin/ksh Explained


    As discussed previously, a shell script is nothing more than a set of commands
    saved in a file. When the script is executed, the set of commands in the file
    are passed to an interpreter for process. Several shells are available that a
    script writer can choose. How do you indicate that your script is a Korn Shell
    script, and is to be interpreted by ksh (not csh, sh, bash, tsch, or any other
    shell?)


    In scripting, the way to do this is to make the first line of the script file
    contain special characters that precede a file specification location the program
    responsible for interpreting the remaining lines in the file.


    Normally a pound sign (#) begins a comment. Comments are lines in the script file
    that are not to be interpreted by the shell, but usually provide some documentation
    or description for script maintenance purposes. As the shell sees a # within a
    line, it does not interpret any characters that appear after that point. Therefore,
    if the # appears as the first character in a line, the whole line is taken as
    a comment. If, on the other hand, the pound sign is followed immediately by an
    exclamation point (!), and is in the first line and first two characters in the
    file, the currently running shell interprets the file spec following the #! as
    being the program to run to interpret the rest of the script file.


    In fact, a separate process is created within which the ksh program runs. The
    rest of the script file is presented to the ksh program as its stream of input.
    The input is interpreted and executed, providing no errors occur.


    Therefore, a simple shell script could look like this:


    ```

    #!/bin/ksh

    echo "Hello World!"

    ```


    This script would produce the following output:


    Hello World!


    Note that your system''s Korn shell program might be in a directory other /bin.
    If so, just change the first line of your script to match the location and name
    of your ksh program. In the case of this simple introductory


    ![](img/de6a3b5a3b516159c825f1c10314d877_22_0.png)'
  merge: -1
