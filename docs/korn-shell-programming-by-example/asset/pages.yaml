  md: '# Defining and Using Traps


    As you will see, your script can trap for errors and the exit condition. These
    are probably the most commonly trapped-for events. Other things can be trapped?
    Let''s answer that by explaining the meaning of a trap.


    Traps are typically described as asynchronous events. The event is asynchronous
    because of its unpredictability. An example is a Ctrl+C being pressed while your
    script is running. The event of the Ctrl+C is totally unpredictable from the perspective
    of your script. During one run, it might occur after 20 seconds; during another
    run, it might occur after 2 hours. And during a third run, it might not occur
    at all.


    You may be thinking that Ctrl+C causes an interrupt, not a trap. The trap is the
    action of reacting to the interrupt. The interrupt is massaged into a UNIX signal.
    So ultimately, the Ctrl+C causes an interrupt, which is transformed into a UNIX
    signal that is trappable by the process. Most UNIX signals can be trapped (signal
    number 9, however, cannot be trapped).


    If a signal is not trapped by the script writer, the typical default action is
    to terminate the script. I propose that we break the categories of traps into
    groups based on function.


    The first is the EXIT trap. This typically is used to perform some cleanup processing
    at the end of a script. It''s useful if the logic of your script could take several
    paths, any of which would end by exiting.


    Next is the ERR trap. This trap is triggered any time a command executed during
    your script returns a unsuccessful status (a non-zero number in $?). The alternative
    to this trap is to place an if test after every command to check the return status
    of the command for a non-zero value. When this event is trapped, you could try
    to correct the problem or perhaps write a message to a log file, send some email
    to the person in charge of the application, or ignore the error and continue processing.


    Another trap is the SIGNAL trap. Note that no keyword SIGNAL is recognized by
    the trap command. I am suggesting it as a functional category. This includes all
    the traps seen in the output of a kill -l command.


    Next are the SPECIAL CASE traps, including


    +   - DEBUG—ksh executes your trap response after each command.

    - CHLD—ksh uses this trap to inform you that a background command has finished.

    - KEYBD—ksh executes your response each time a character is typed interactively.'
  merge: -1
