    \ hello-g\nprint hello # Single line file\n$\n$ ls -l hello-g\n-rw-r--r-- 1 obrien\
    \ users 16 Sep 28 17:41 hello_g\n$\n$ chmod ug+x hello-g # Add execute permission\n\
    $\n$ hello-g # runs fine in Korn shell\nhello\n$\n$ csh\n%\n% hello-g\n```\n\n\
