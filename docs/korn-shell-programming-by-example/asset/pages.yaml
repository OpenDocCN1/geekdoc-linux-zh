- img_proc: true
  md: '| Value | Time | Valid Entries |

    |---|---|---|n| 1 | Minute | (0-59) |

    | 2 | Hour | (0-23) |

    | 3 | Day of the month | (1-31) |

    | 4 | Month of the year | (1-12) |

    | 5 | Day of the week | (0-6, with 0 = Sunday) |


    Several valid patterns are legal for each time entry. The following table shows
    these values and gives a description of what they mean.


    | Value | Description |

    |---|---|n| * | Any valid entry for that time entry |

    | Comma-separated list | Indicates which times are valid for that time increment
    |

    | Two numbers separated by a dash (-) | Indicates a range of times inclusive of
    the two numbers |


    To better understand the crontab entries, think of the minutes and hours falling
    into the days of the month and the hours of the year falling into a second section,
    and the days of the week falling into a third section. Within each section, the
    numbers are inclusive of each other, and each section is additive. Therefore,
    a minute of 15 and an hour of 15 to run the command at 15 minutes past the 15th
    hour (3:15 p.m.). A day of the month of 15,30 and a month of the year * would
    mean to run the command on the 15th and 30th of the month, and on any month of
    the year. A day of the week of 1 would mean run on Mondays. Because an example
    is worth a thousand misunderstood works, look at the following example:


    ```

    0,15,30,45 1,16 * 1 /run/your/script/here

    ```


    In this example, the script /run/your/script/here would run on the 1st and the
    16th of every month. It would also run Monday, and it would run at 3:00 p.m.,
    3:15 p.m., 3:30 p.m., and 3:45 p.m.

    Because flexibility promotes ambiguity, the following table shows examples of
    crontab entries and a brief explanation of what they mean.


    | Time | Command | Explanation |

    |---|---|---|n| 01 * * * * | run-parts /etc/cron.hourly | Run this command if
    it is 1 minute past the hour, and it is any hour, and it is any day of the month,
    and it is any month of the year, and it is any day of the week. |

    | 02 4 * * * | run-parts /etc/cron.daily | Run this command if it is 2 minutes
    past the hour, and it is 4 hours past midnight, and it is any day of the month,
    and it is any month of the year, and it is any day of the week. |


    ![](img/de6a3b5a3b516159c825f1c10314d877_80_0.png)'
  merge: -1
  pgno: 80
- img_proc: true
  md: '| Time | Command | Explanation |

    |---|---|---|

    | 22 * * 0 | run-parts /etc/cron.weekly | Run this command if it is 22 minutes
