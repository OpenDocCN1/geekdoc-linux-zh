    # Attributes


    Each file has attributes associated with it to describe its characteristics. Some
    attributes are ownership, group ownership, permissions, type of file, and link
    count. Oh, that''s the stuff from the inode! Yes. The inode contains the file''s
    attributes. Some attributes are more shell-oriented, they control the behavior
    of file activities. All of us have had the UNIX file cl experience. You know,
    when you inadvertently name a new file same as an existing file on a redirection.
    ''Fess up''. We''ve all done that, much to our chagrin.


    The following example shows the existence of a 629-byte file named stats, followed
    by a redirection that clobbers the file and then replaces the file contents with
    the output of a ps command consisting of 159 bytes:


    ```

    $ ls stats

    75261 -rw-r--r-- 2 obrien guest 629 Nov 2 00:54 stats

    $ ps > stats

    # Oops, I just clobbered the stats file

    $ ls stats

    75261 -rw-r--r-- 2 obrien guest 159 Nov 2 01:35 stats

    # Note size difference

    $

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_234_0.png)


    This can be controlled by the noclobber attribute.


    The following example sets the noclobber option and shows that a user will be
    prevented from clobbering an existing file:


    ```

    $ set - noclobber

    # Protecting myself from myself

    $ ls stats

    75261 -rw-r--r-- 2 obrien guest 159 Nov 2 01:35 stats

    $

    $ vmstat > stats

    dtksh: stats: file already exists [File exists]

    $ # No clobbering allowed

    $ ls stats

    75261 -rw-r--r-- 2 obrien guest 159 Nov 2 01:35 stats

    # Unchanged

    $

    ```


    ![](img/de6a3b5a3b516159c825f1c10314d877_234_1.png)'
