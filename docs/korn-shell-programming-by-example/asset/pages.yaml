    +   **Ctrl+H**—The default key sequence to erase a character is to use the Ctrl+H
    key sequence. On many systems, the default is to bind the Backspace key to perform
    a Ctrl-H signal. Sometimes, the Backspace key does not work, and either the Ctrl+H
    key sequence or the Ctrl+Backspace key sequence must be used.


    +   **Ctrl+Q**—This is the signal that tells the shell to restart your terminal
    that had been previously stopped by the Ctrl+S signal. It is important to note
    that whatever is typed at the keyboard still goes to the computer; it just not
    echo to the display. See the example after the Ctrl+S signal.


    +   **Ctrl+S**—The Ctrl+S signal stops output from echoing to your terminal. The
    Ctrl+Q key sequence is used to restart echoing to your terminal. From the user''s
    perspective, the terminal is frozen. But, as mentioned in the Ctrl+Q discussion,
    after restarted, the output has been sent to the screen.


    In the following example, Ctrl+S is pressed, a command is then run (1s -1a). After
    this, Ctrl+Q is pressed:


    ```

    $ (Ctrl+S)

    ```


    ```

    $ ls -1a

    total 96

