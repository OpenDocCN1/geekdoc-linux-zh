    \ 'isadude'\nobrienisadude\n$ \n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_40_0.png)\n\
    \nThree types of variables exist: shell variables, built-in variables, and environment-variables.\
    \ Each of these is discussed in the following sections.\n\n# Shell Variables\n\
    \nShell variables are name/value pairs. Some shell variables are automatically\
    \ when the shell is instantiated. Many of these variables change on their own\
    \ as the user performs certain tasks. For example, two shell variables are PWD\
    \ and OLDPWD. PWD stands for present working directory. Its value is the current\
    \ directory to which the user has set by default. If the user has changed directories\
    \ then the second variable, OLDPWD—old working directory—stores the default working\
    \ directory that the user had set previous to the current working directory. This\
    \ makes switching back to the previous directory much quicker, as demonstrated\
    \ in the following text.\n\nFirst, view the contents of the two variables (you\
    \ might need to change directories before OLDPWD will instantiate itself):\n\n\
    ```\n$ cd /usr/local/vmware\n$ echo $PWD\n/usr/local/vmware # Current directory\n\
    $ echo $OLDPWD\n/home # Previous directory\n```\n\n![](img/de6a3b5a3b516159c825f1c10314d877_40_1.png)\n\
