    is the upstream open-source project, and Chrome is Google''s proprietary binary
    build based on it (insert the usual paranoid caution about not using it for anything
    you don''t want Google to know).


    It is recommended that you install Privacy Badger and HTTPS Everywhere extensions
    in Chrome and give it a distinct theme from Firefox to indicate that this is your
    "untrusted sites" browser.


