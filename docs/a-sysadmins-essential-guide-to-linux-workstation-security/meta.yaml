  - '[PAGE 28]


    will only be needed when signing someone else''s keys or creating new subkeys
    — operations which do not happen very frequently. You may follow the Debian''s
    subkeys to learn how to move your master key to removable storage and how to create
    subkeys.


    You should configure your gnupg key to act as your ssh agent and use the smartcard-BGP
    Auth key to act as your ssh private key. We publish a detailed guide on how to
    do that using either a smartcard reader or a Yubikey NEO.


    If you are not willing to go that far, at least make sure you have a strong passphrase
    on both your PGP private key and your SSH private key, which will make it harder
    for attackers to steal and use them.


    # Hibernate or shut down, do not suspend


    When a system is suspended, the RAM contents are kept on the memory chips and
    can be read by an attacker (known as the Cold Boot Attack). If you are going away
    from your system for an extended period of time, such as at the end of the day,
    it is best to shut it down or hibernate it instead of suspending it or leaving
    it on.


    # SELinux on the workstation


    # Checklist


    +   - Make sure SELinux is enforcing on your workstation (ESSENTIAL)'
  - '[PAGE 29]


    # Considerations


    SELinux is a Mandatory Access Controls (MAC) extension to core POSIX permissions
    functionality. It is mature, robust, and has come a long way since its initial
    roll-out. Regardless, many sysadmins to this day repeat the outdated mantra of
    “just turn it off.”


    That being said, SELinux will have limited security benefits on the workstation,
    as most applications you will be running as a user are going to be running unconfined.
    It does provide enough net benefit to warrant leaving it on, as it will likely
    help prevent an attacker from escalating privileges to gain root-level access
    via a vulnerable daemon service.


    Our recommendation is to leave it on and enforcing.'
