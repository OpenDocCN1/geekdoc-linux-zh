  md: '# SysAdmin''s Essential Guide to Linux Workstation Security


    # Considerations


    # Full encrypted backups to external storage


    It is handy to have an external hard drive where one can dump full backups without
    having to worry about such things like bandwidth and upstream speeds (in this
    day and age most providers still offer dramatically asymmetric upload/download
    speeds). Needless to say, this hard drive needs to be in its iself encrypted (again,
    via LUKS), or you should use a backup tool that creates encrypted backups, such
    as duplication or its GUI companion, deja-dup. I recommend using the latter with
    a good randomly generated passphrase, stored in a safe offline. If you travel
    with your laptop, leave this drive at home to have something come back in case
    your laptop is lost or stolen.


    In addition to your home directory, you should also back up `/etc` and `/var/log`
    for various forensic purposes.


    Above all, avoid copying your home directory onto any unencrypted storage, even
    as a quick way to move your files between systems, as you will most certainly
    forget to erase it when you''re done, exposing potentially private or otherwise
    sensitive data to snooping hands — especially if you keep storage media in the
    same bag with your laptop or in your office desk drawer.


    # Selective zero-knowledge backups off-site


    Off-site backups are also extremely important and can be done either to your employer,
    if they offer space for it, or to a cloud provider. You can set up a separate
    duplicate/deja-dup profile to include only important files in order to avoid transferring
    huge amounts of data that you don''t really care to back up off-site (internet
    cache, music, downloads, etc).'
