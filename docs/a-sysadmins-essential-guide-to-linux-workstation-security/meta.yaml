  md: '# A SysAdmin''s Essential Guide to Linux Workstation Security


    # Checklist priority levels


    The items in each checklist include the priority level, which we hope will help
    guide your decision:


    ![](img/c6b17a0003e220fc326f5d6cfbbb41b3_4_0.png)


    (ESSENTIAL) items should definitely be high on the consideration list. If not
    implemented, they will introduce high risks to your workstation security.


    ![](img/c6b17a0003e220fc326f5d6cfbbb41b3_4_1.png)


    (NICE) to have items will improve the overall security, but will affect how you
    interact with your work environment, and probably require learning new habits
    or unlearning old ones.


    ![](img/c6b17a0003e220fc326f5d6cfbbb41b3_4_2.png)


    (PARANOID) is reserved for items we feel will significantly improve your workstation
    security, but will require a lot of adjustment to the way you interact with your
    operating system.


    Remember, these are only guidelines. If you feel these priority levels do not
    reflect your project''s commitment to security, you should adjust them as you
    see fit.'
  merge: -1
  pgno: 4
