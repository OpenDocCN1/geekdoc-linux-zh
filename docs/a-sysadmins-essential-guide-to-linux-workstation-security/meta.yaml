    media, running checks from a trusted environment, remembering to refresh the hash
    databases after performing system updates and configuration changes, etc). If
    you are not willing to take these steps and adjust how you do things on your own
    workstation, these tools will introduce hassle without any tangible security benefit.


    We do recommend that you install `rkhunter` and run it nightly. It''s fairly easy
    to learn and use, and though it will not deter a sophisticated attacker, it may
    help you catch your own mistakes.


    ## Personal workstation backups


    Workstation backups tend to be overlooked or done in a haphazard, often unsafe
    manner.


    ## Checklist


    - Set up encrypted workstation backups to external storage (ESSENTIAL)

    - Use zero-knowledge backup tools for off-site/cloud backups (NICE)


    ## Considerations


