  mdcn: "\n\n# 系统管理员 Linux 工作站安全必备指南\n\n使用此浏览器访问除少数几个站点以外的所有其他网站。\n\n您应该安装以下 Firefox\
    \ 扩展：\n\n- NoScript（**核心必备**）\n  - NoScript 可防止活动内容的加载，除非其来自用户白名单中的域名。在默认浏览器中使用它非常麻烦（尽管它提供了极佳的安全收益），因此我们建议仅在用于访问工作相关网站的浏览器上启用它。\n\
    \n- Privacy Badger（**核心必备**）\n  - EFF 的 Privacy Badger 将防止大多数外部追踪器和广告平台的加载，从而避免这些跟踪站点受攻击的影响影响到您的浏览器（追踪器和广告网站是攻击者经常针对的目标，因为它们可以迅速感染全球数以万计的系统）。\n\
    \n- HTTPS Everywhere（核心必备**）\n  - 这个由 EFF 开发的扩展将确保您大多数网站都通过安全连接访问，即使您点击的链接使用的是\
    \ http://（这对于避免诸如 SSL-strip 等攻击非常有用）。\n\n- Certificate Patrol（**可选**）\n  - 如果您访问的网站最近更改了\
    \ TLS 证书，此工具将提醒您——特别是当证书并非临近到期，或者现在使用了不同的认证授权机构时。它可以帮助在有人尝试对您的连接进行中间人攻击时提醒您，但会产生很多良误报。\n\
    \n# 系统管理员 Linux 工作站安全必备指南\n\n您应该将 Firefox 设置为打开链接的默认浏览器，因为 NoScript 将阻止大多数活动内容的加载或执行。\n\
    \n# 其他任务使用 Chrome/Chromium\n\nChromium 开发者在参考 Firefox 的基础上添加了许多优秀的安全特性（如 seccomp\
    \ 沙箱、内核用户命名空间等，这些在您访问的站点与系统其余部分之间构建了额外的隔离层）。Chromium 是上游开源项目，而 Chrome 是基于其开发的\
    \ Google 专有二进制版本（请记住通常的偏执性谨慎：不要将其用于任何您不想让 Google 知道的事务）。\n\n建议在 Chrome 中安装 Privacy\
    \ Badger 和 HTTPS Everywhere 扩展，并为它设置一个与 Firefox 不同的主题，以指示这是您的“不可信站点”浏览器。\n\n#\
    \ 第 2：使用 Firejail（**核心必备**）\n\nFirejail 是一个利用 Linux 命名空间和 seccomp-bpf 为 Linux\
    \ 创建沙箱的项目。它是帮助在浏览器与系统其余部分之间构建额外保护的极佳方式。您可以使用 Firejail 创建 Firefox 的独立实例，用于不同的用途——用于工作、用于个人但受信任的站点（如银行），以及另一个用于闲闲浏览（社交媒体等）。\n\
    \nFirejail 在 Wayland 上最有效，除非您使用了 X11 隔离机制（`--x11` 标志）。要使用 Firefox 启动 Firejail，请参考该项目提供的文档：\n\
    \n- Firefox 沙箱指南\n\n# 系统管理员 Linux 工作站安全必备指南\n\n# 第 3：通过虚拟化完全隔离工作和娱乐环境（**偏执级**）\n\
    \n参阅 QubesOS 项目，该项目致力于通过将应用程序划分到独立的完全隔离虚拟机（VM）中来提供“相当安全”的工作站环境。您也可以研究 SubgraphOS，它使用容器技术实现了类似的目标（目前处于\
    \ Alpha 阶段）。\n\n# 使用 Fido U2F 进行网站双重身份验证\n\nFido U2F 是一种专门开发的标准，旨在提供双重身份验证机制并对抗凭据钓鱼。当攻击者能够欺骗您将密码和令牌提交到伪装合法服务的恶意网站时，常规的\
    \ OTP（一次性密码）机制是无效的。U2F 协议会将站点验证数据存储在 USB 令牌上，防止您在尝试合法网站以外的任何地方使用它时，意外向攻击者提供密码和一次性令牌。\n\
    \n访问此网站获取提供 Fido U2F 支持的服务精选列表：\n\n- dongleauth.info\n\n注意，并非所有浏览器目前都支持 U2F 功能的硬件令牌，如果您在浏览器周围使用了沙箱或基于虚拟化的隔离，您可能需要花费额外精力来启用从应用程序到\
    \ USB 令牌的 USB 透传（pass-through）。\n\n# 密码管理器\n\n# 清单\n\n- 使用密码管理器（**核心必备**）\n- 在不相关的站点上使用唯一的、随机生成的密码（**核心必备**）\n\
    - 使用支持团队共享的密码管理器（**可选**）\n- 为非网站账户使用独立的密码管理器（**可选**）\n\n# 注意事项\n\n使用强力、唯一、随机生成的密码应该是您团队每位成员的关键要求。凭据窃取随时发生——通过计算机被攻破、数据库转储泄露、远程站点漏洞或任何其他手段。绝不要在不同站点之间重复使用凭据。\n\
    \n# 浏览器内置密码管理器\n\n每个浏览器都有一套相当安全的密码保存机制，并可以与供应商维护的云存储同步，同时使用用户提供的短语对数据进行加密。然而，这种机制有重要的缺点：\n\
    \n1. 它无法跨浏览器工作。\n2. 它没有提供任何与团队成员共享凭据的方法。\n\n# 系统管理员 Linux 工作站安全必备指南\n\n有许多支持良好的、免费或廉价的密码管理器，它们集成在多个浏览器中，支持跨平台，并提供分组共享（通常作为付费服务）。可以通过搜索引擎轻松找到这些解决方案。\n\
    \n# 独立密码管理器\n\n任何集成在浏览器中的密码管理器的主要缺点之一是，它是最可能被入侵者攻击的应用程序的一部分。如果这让您感到不适（本就如此），您可以选择两个不同的密码管理器——一个集成在浏览器中用于网站，另一个作为独立程序运行。后者可存储高风险凭据，如\
    \ root 密码、数据库密码等。\n\n此类工具对于与团队其他成员共享凭据（服务器密码、ILO 密码、数据库管理员密码等）可能特别有用。\n\n一些工具可以帮助您：\n\
    \n- KeePassXC，它在版本 2 中改进了团队共享\n- Pass，它使用文本文件并与 PGP 集成\n- Django-Pstore，它使用 GPG\
    \ 在管理员之间共享凭据\n- Hiera-yaml，如果您已经在基础设施中使用了 Puppet，这可能是跟踪服务器/服务凭据的方便方法\n\n# 系统管理员\
    \ Linux 工作站安全必备指南\n\n# SSH 和 PGP 私密钥的安全防护\n\n个人加密密钥（包括 SSH 和 PGP 私密钥）将是您工作站上最珍贵的物品——攻击者最感兴趣获取这些物品，因为这允许他们进一步攻击您的基础设施或向其他管理员冒充您。您应该采取额外步骤确保您的私密钥得到良好保护。\n\
    \n# 清单\n\n- 使用强密码语保护私密钥（**核心必备**）\n- 将 PGP 主密钥存储在移除式存储设备中（**可选**）\n- 将认证、签名和加密子密钥存储在智能卡设备中（**可选**）\n\
    - 配置 SSH 使用 PGP 密钥作为 SSH 私密钥（**可选**）\n\n# 注意事项\n\n防止私密钥密钥的最佳方法是使用智能卡存储加密私密钥，并且绝不复制到工作站上。有几家厂商提供支持\
    \ OpenPGP 的设备：\n\n- Kernel Concepts，您可以在那里购买兼容 OpenPGP 的智能卡和 USB 读器，您需要一个。\n-\
    \ Yubikey，除了提供 OpenPGP 智能卡功能外，还提供了许多酷的功能（U2F、PIV、HOTP 等）。\n- NitroKey，它基于开源软件和硬件\n\
    \n此外，确保 PGP 主密钥不存储在主工作站上，仅使用子密钥也是重要的。主密钥\n\n"
