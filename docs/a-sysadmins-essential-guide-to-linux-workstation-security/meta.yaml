- md: "\nwill only be needed when signing someone else's keys or creating new subkeys\
    \ — operations which do not happen very frequently. You may follow the Debian's\
    \ subkeys to learn how to move your master key to removable storage and how to\
    \ create subkeys.\n\nYou should configure your gnupg key to act as your ssh agent\
    \ and use the smartcard-BGP Auth key to act as your ssh private key. We publish\
    \ a detailed guide on how to do that using either a smartcard reader or a Yubikey\
    \ NEO.\n\nIf you are not willing to go that far, at least make sure you have a\
    \ strong passphrase on both your PGP private key and your SSH private key, which\
    \ will make it harder for attackers to steal and use them.\n\n## Hibernate or\
    \ shut down, do not suspend\n\nWhen a system is suspended, the RAM contents are\
    \ kept on the memory chips and can be read by an attacker (known as the Cold Boot\
    \ Attack). If you are going away from your system for an extended period of time,\
    \ such as at the end of the day, it is best to shut it down or hibernate it instead\
    \ of suspending it or leaving it on.\n\n## SELinux on the workstation\n\n## Checklist\n\
    \n- Make sure SELinux is enforcing on your workstation (ESSENTIAL)\n\n## Considerations\n\
    \nSELinux is a Mandatory Access Controls (MAC) extension to core POSIX permissions\
    \ functionality. It is mature, robust, and has come a long way since its initial\
    \ roll-out. Regardless, many sysadmins to this day repeat the outdated mantra\
    \ of “just turn it off.”\n\nThat being said, SELinux will have limited security\
    \ benefits on the workstation, as most applications you will be running as a user\
    \ are going to be running unconfined. It does provide enough net benefit to warrant\
    \ leaving it on, as it will likely help prevent an attacker from escalating privileges\
    \ to gain root-level access via a vulnerable daemon service.\n\nOur recommendation\
    \ is to leave it on and enforcing.\n\n## Further reading\n\nThe world of IT security\
    \ is a rabbit hole with no bottom. If you would like to go deeper, or find out\
    \ more about security features on your particular distribution, please check out\
    \ the following links:\n\n- Fedora Security Guide\n- CESG Ubuntu Security Guide\n\
    - Debian Security Manual\n- Arch Linux Security Wiki\n- Mac OSX Security\n\n##\
    \ License\n\nThis work is licensed under a Creative Commons Attribution-ShareAlike\
    \ 4.0 International License.\n\n# # THE LINUX FOUNDATION\nTRAINING\n\n# ## QUICK\
    \ REFERENCE CHECKLISTS\nWORKSTATION SECURITY\n\n### Choosing the right hardware\n\
    \n- System supports SecureBoot (ESSENTIAL)\n- System has no firewall, thunderbolt\
    \ or ExpressCard ports (NICE)\n- System has a TPM chip (NICE)\n\n### Post-installation\
    \ hardening\n\n- Globally disable firewall and thunder modules (ESSENTIAL)\n-\
    \ Check your firewalls to ensure all incoming ports are filtered (ESSENTIAL)\n\
    - Make sure root mail is forwarded to an account you check (ESSENTIAL)\n- Set\
    \ up an automatic update schedule, or remind updates (ESSENTIAL)\n- Check sshd\
    \ service is enabled by default (NICE)\n- Configure theaver to auto-lock after\
    \ a period of inactivity (NICE)\n- Set up watchdog (NICE)\n- Install an Intrusion\
    \ Detection System (NICE)\n\n### Pre-boot environment\n\n- UEFI mode is used (not\
    \ legacy BIOS) (ESSENTIAL)\n- Password is required to enter UEFI configuration\
    \ (ESSENTIAL)\n- SecureBoot enabled (ESSENTIAL)\n- UEFI-level password is required\
    \ to boot the system (NICE)\n\n### Distro choice considerations\n\n- Has a robust\
    \ MAC/RBAC implementation (SELinux/AppArmor/GrSecurity) (ESSENTIAL)\n- Publishes\
    \ bulletins (ESSENTIAL)\n- Provides timely security patches (ESSENTIAL)\n- Provides\
    \ cryptographic verification of packages (ESSENTIAL)\n- Fully supports UEFI and\
    \ SecureBoot (ESSENTIAL)\n- Has robust full disk encryption support (ESSENTIAL)\n\
    \n### Browsing\n\n- Use two browsers (ESSENTIAL)\n- Use Firefox for web and high\
    \ security sites. Installing the Firefox add-ons:\n  - NoScript (ESSENTIAL)\n\
    \  - Privacy Badger (ESSENTIAL)\n  - HTTPS Everywhere (ESSENTIAL)\n  - Certificate\
    \ Patrol (NICE)\n- Use Chrome/Chromium for everything\n- Use two different, one\
    \ a dedicated VM (NICE)\n- Fully separate your work and play environments via\
    \ virtualization (PARANOID)\n\n### Distro installation guidelines\n\n- Use full\
    \ disk encryption (LUKS) with a robust passphrase (ESSENTIAL)\n- Make swap is\
    \ also encrypted (ESSENTIAL)\n- Require a password to edit bootloader (can be\
    \ same as LUKS) (ESSENTIAL)\n- Set up a root partition (can be same as LUKS) (ESSENTIAL)\n\
    - Use an unprivileged account, part of administrators group (ESSENTIAL)\n- Set\
    \ up a user-account access, different from root (ESSENTIAL)\n\n### Securing SSH\
    \ and PGP keys\n\n- Strong passwords are used to protect private keys (ESSENTIAL)\n\
    - PGP key is stored on removable storage (NICE)\n- Auth, Sign and Encrypt Subkeys\
    \ are stored on a smartcard (NICE)\n- SSH is configured to use as ssh private\
    \ key (NICE)\n\n### Password managers\n\n- Use a password manager (ESSENTIAL)\n\
    - Use unique passwords on unrelated sites (ESSENTIAL)\n- Use a password manager\
    \ that supports team sharing (NICE)\n- Use a separate manager for non-website\
    \ accounts (NICE)\n\n### SELinux on the workstation\n\n- Make SELinux is enforcing\
    \ on your workstation (ESSENTIAL)\n\n### Personal workstation backups\n\n- Set\
    \ up encrypted backups to external storage (ESSENTIAL)\n- Use zero-knowledge backup\
    \ tools for off-site (NICE)\n\n### Checklist priority levels\n\nThe items in each\
    \ checklist include the priority level, which will help guide your decision.\n\
    \n(ESSENTIAL) items should definitely be high on the consideration list. If not\
    \ implemented, they will introduce high risks to your work-security.\n\n(NICE)\
    \ items are reserved for when you need all the security, but by how much they\
    \ affect your work environment, and may require learning new habits or updating\
    \ old ones.\n\n```\nhttp://training.linuxfoundation.org\n```\n\n## Advance Your\
    \ Career With Training From The Linux Foundation\n\nThe Linux Foundation is the\
    \ go-to place for training and certification on some of the hottest and most important\
