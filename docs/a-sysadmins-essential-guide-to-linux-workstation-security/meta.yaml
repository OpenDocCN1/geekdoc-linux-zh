    # # A SysAdmin’s Essential Guide to Linux Workstation Security


    How to work from anywhere and keep your data, identity, and sanity


    ![](img/c6b17a0003e220fc326f5d6cfbbb41b3_2_0.png)


    By Konstantin Ryabitsev

    Director of IT Infrastructure Security

    at The Linux Foundation


    This document is aimed at teams of systems administrators who use Linux workstations
    to access and manage your project''s IT infrastructure.


    If your systems administrators are remote workers, you may use this set of guidelines
    to ensure that their workstations pass core security requirements in order to
    reduce the risk that they become attack vectors against the rest of your IT infrastructure.


    Even if your systems administrators are not remote workers, chances are that they
    perform a lot of their work either from a portable laptop in a work environment,
    or set up their home systems to access the work infrastructure for after-hours/emergency
    support. In either case, you can adapt this set of recommendations to suit your
    environment.'
  - '[PAGE 3]


    # A SysAdmin''s Essential Guide to Linux Workstation Security


    # Limitations


    This, by no means, is an exhaustive “workstation hardening” document, but rather
    an attempt at set of baseline recommendations to avoid most glaring security errors
    without introducing too much inconvenience. You may read this document and think
    it is way paranoid, while someone else may think this barely scratches the surface.
    Security is just like driving on the highway — anyone going slower than you is
    an idiot, while anyone driving faster than you is a crazy person. These guidelines
    are merely a basic set of core safety rules that is neither exhaustive, nor a
    replacement for experience, vigilance, and common sense.


    We''re sharing this document as a way to bring the benefits of open-source collaboration
    to IT policy documentation. If you find it useful, we hope you''ll contribute
    to its development by making a fork for your own organization and sharing your
    improvements.


    # Structure


    Each section is split into two areas:


    +   * The checklist that can be adapted to your project''s needs

    * Free-form list of considerations that explain what dictated these decisions'
