  md: '# A SysAdmin''s Essential Guide to Linux Workstation Security


    The modules will be blacklisted upon reboot. It doesn''t hurt doing this if you
    don''t have these ports (but it doesn''t do anything either).


    # Root mail


    By default, root mail is just saved on the system and tends to never be read.
    Make sure you set your /etc/aliases to forward root mail to a mailbox that you
    actually read, otherwise you may miss important system notifications and reports:


    ```

    # Person who should get root''s mail

    bob@example.com

    ```


    Run newaliases after this and test it to make sure that it actually gets delivered,
    as some email providers will reject email coming from nonexistent or non-routable
    domain names. If that is the case, you will need to play with your mail forwarding
    configuration until this actually works.


    # Firewalls, sshd, and listening daemons


    The default firewall settings will depend on your distribution, but many of them
    will allow incoming sshd ports. Unless you have a compelling legitimate reason
    to allow incoming ssh, you should filter that out and disable the sshd daemon.


    ```

    systemctl disable sshd.service

    systemctl stop sshd.service

    ```


    You can always start it temporarily if you need to use it.


    In general, your system shouldn''t have any listening ports apart from responding
    to ping. This will help safeguard you against network-level exploits.'
