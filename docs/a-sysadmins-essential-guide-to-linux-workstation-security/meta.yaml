    cost of complicating system updates. It is not critical to encrypt /boot if your
    distro of choice does not natively support it, as the kernel image itself leaks
    no data and will be protected against tampering with a cryptographic signature
    checked by SecureBoot.


    # Choosing good passphrases


    Modern Linux systems have no limitation of password/passphrase length, so the
    only real limitation is your level of paranoia and your stubbornness. If you boot
    your system a lot, you will probably have to type at least two different passwords:
    one to unlock LUKS, and another one to log in, so long passphrases will probably
    get old really fast. Pick passphrases that are 2-3 words long, easy to type, and
    preferably from rich/mixed vocabularies.


    Examples of good passphrases (yes, you can use spaces):


    +   - nature abhors roomba

    - 12 in-flight Jebediahs

    - perdon, tendo flatulence


    Weak passphrases are combinations of words you''re likely to see in published
    works or anywhere else in real life, and you should avoid using them, as attackers
    are starting to include such simple passphrases into their brute-force strategies.


    Examples of passphrases to avoid:


    +   - Mary had a little lamb

    - you''re a wizard, Harry

    - to infinity and beyond'
