    \ (social media, etc).\n\nFirejail is most effective on Wayland, unless you use\
    \ X11-isolation mechanisms (the --x11 flag). To starting Firejail with Firefox,\
    \ please refer to the documentation provided by the project:\n\n- Firefox Sandboxing\
    \ Guide\n\n# A SysAdmin's Essential Guide to Linux Workstation Security\n\n# 3:\
    \ Fully separate your work and play environments via virtualization (PARANOID)\n\
    \nSee QubesOS project, which strives to provide a \"reasonably secure\" workstation\
    \ environment via compartmentalizing your applications into separate fully isolated\
    \ VMs. You may also investigate SubgraphOS that achieves similar goals using container\
    \ technology (currently in Alpha).\n\n# Use Fido U2F for website 2-factor authentication\n\
    \nFido U2F is a standard developed specifically to provide a mechanism for 2-factor\
    \ authentication and combat credential phishing. Regular OTP (one-time password)\
    \ mechanisms are ineffective in the case where the attacker is able to trick you\
    \ into submitting your password and token into a malicious site masquerading as\
    \ a legitimate service. The U2F protocol will store site authentication data on\
    \ the USB token that will prevent you from accidentally giving an attacker both\
    \ your password and your one-time token if you try to use it on anything other\
    \ than the legitimate website.\n\nSee this site for a curated list of services\
    \ providing Fido U2F support:\n\n- dongleauth.info\n\nNote, that not all browsers\
    \ currently support U2F-capable hardware tokens, and if you use sandboxes or virtualization-based\
    \ isolation around your browser, you may have to work extra hard to enable USB\
    \ pass-through from the application to your USB token.\n\n# Password managers\n\
    \n# Checklist\n\n- Use a password manager (ESSENTIAL)\n- Use unique, randomly\
    \ generated passwords on unrelated sites (ESSENTIAL)\n- Use a password manager\
    \ that supports team sharing (NICE)\n- Use a separate password manager for non-website\
    \ accounts (NICE)\n\n# Considerations\n\nUsing strong, unique, randomly generated\
    \ passwords should be a critical requirement for every member of your team. Credential\
    \ theft is happening all the time — either via compromised computers, stolen database\
