  md: '# A SysAdmin''s Essential Guide to Linux Workstation Security


    You can also stick with non-vocabulary passwords that are at least 10-12 characters
    long, if you prefer that to typing passphrases.


    Unless you have concerns about physical security, it is fine to write down your
    passphrases and keep them in a safe place away from your work desk.


    # Root, user passwords and the admin group


    We recommend that you use the same passphrase for your root password as you use
    for your LUKS encryption (unless you share your laptop with other trusted people
    who should be able to unlock the drives, but shouldn''t be able to become root).
    If you are the sole user of the laptop, having your root password be different
    from your LUKS password has no meaningful security advantages. Generally, you
    can use the same passphrase for your UEFI administration, disk encryption, and
    root account — knowing any of these will give an attacker full control of your
    system anyway, so there is little security benefit to have them be different on
    a single-user workstation.


    You should have a different, but equally strong password for your regular user
    account that you will be using for day-to-day tasks. This user should be member
    of the admin group (e.g. `wheel` or similar, depending on the distution), allowing
    you to perform `sudo` to elevate privileges.'
