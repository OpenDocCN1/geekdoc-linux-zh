  mdcn: "\n\n只有在签名他人的密钥或创建新的子密钥时才需要主密钥——这些操作并不频繁。你可以参考 Debian 的子密钥指南，学习如何将主密钥移动到移动存储设备以及如何创建子密钥。\n\
    \n你应该配置你的 gnupg 密钥作为你的 ssh agent，并使用 smartcard-BGP Auth 密钥作为你的 ssh 私钥。我们发布了一份关于如何使用智能卡阅读器或\
    \ Yubikey NEO 实现这些操作的详细指南。\n\n如果你不愿意做到这一步，至少确保你的 PGP 私钥和 SSH 私钥都设置了强密码短语，这将增加攻击者窃取和使用它们的难度。\n\
    \n## 请使用休眠或关机，不要挂起\n\n当系统被挂起时，RAM 内容将保留在内存芯片上，攻击者可以对其读取（即“冷启动攻击”）。如果你需要离开系统一段时间（例如在一天结束时），最好是关机或休眠，而不是挂起或保持开启状态。\n\
    \n## 工作站上的 SELinux\n\n## 检查清单\n\n- 确保 SELinux 在你的工作站上处于强制模式（必须执行）\n\n## 考虑因素\n\
    \nSELinux 是核心 POSIX 权限功能的强制访问控制（MAC）扩展。它成熟、健壮，并且自最初发布以来取得了长足进步。尽管如此，许多系统管理员直到今天仍重复“直接关掉它”这一过时的格调。\n\
    \n话虽如此，SELinux 在工作站上的安全收益有限，因为你作为用户运行的大多数应用程序都将以无限制（unconfined）模式运行。但它提供的净收益足以让你开启它，因为它可能有助于防止攻击者通过漏洞的守护进程提升权限以获取\
    \ root 级访问。\n\n我们的建议是保持开启并设置为强制模式。\n\n## 延伸阅读\n\nIT 安全的世界是一个没有底的兔子洞。如果你想深入研究，或者了解更多关于特定发行版的安全特性，请查看以下链接：\n\
    \n- Fedora 安全指南\n- CESG Ubuntu 安全指南\n- Debian 安全手册\n- Arch Linux 安全 Wiki\n- Mac\
    \ OSX 安全\n\n## 许可协议\n\n本作品根据知识产权 署名-相同共享 4.0 国际许可协议授权。\n\n# # LINUX 基金会\n培训\n\n\
    # # ## 快速参考检查清单\n工作站安全\n\n### 选择合适的硬件\n\n- 系统支持 SecureBoot（必须执行）\n- 系统没有防火墙、Thunderbolt\
    \ 或 ExpressCard 端口（可选）\n- 系统带有 TPM 芯片（可选）\n\n### 安装后加固\n\n- 全局禁用防火墙和 thunder 模块（必须执行）\n\
    - 检查你的防火墙以确保所有入站端口都已过滤（必须执行）\n- 确保 root 邮件转发到你会检查的账户（必须执行）\n- 设置自动更新计划或提醒更新（必须执行）\n\
    - 检查 sshd 服务是否默认启用（可选）\n- 配置屏幕保护程序在空闲一段时间后自动锁定（可选）\n- 设置守护进程（watchdog）（可选）\n-\
    \ 安装入侵检测系统（可选）\n\n### 启动前环境\n\n- 使用 UEFI 模式（而非传统 BIOS）（必须执行）\n- 进入 UEFI 配置需要密码（必须执行）\n\
    - 启用 SecureBoot（必须执行）\n- 启动系统需要 UEFI 级密码（可选）\n\n### 发行版选择考虑因素\n\n- 具有健壮的 MAC/RBAC\
    \ 实现（SELinux/AppArmor/GrSecurity）（必须执行）\n- 发布公告（必须执行）\n- 提供及时的安全补丁（必须执行）\n- 提供软件包的密码学验证（必须执行）\n\
    - 完全支持 UEFI 和 SecureBoot（必须执行）\n- 具有健壮的全磁盘加密支持（必须执行）\n\n### 浏览\n\n- 使用两个浏览器（必须执行）\n\
    - 使用 Firefox 访问网页和高安全站点。安装 Firefox 插件：\n  - NoScript（必须执行）\n  - Privacy Badger（必须执行）\n\
    \  - HTTPS Everywhere（必须执行）\n  - Certificate Patrol（可选）\n- 使用 Chrome/Chromium\
    \ 处理所有事务\n- 使用两个不同的环境，其中一个虚拟机（可选）\n- 通过虚拟化完全隔离你的工作和娱乐环境（偏执级）\n\n### 发行版安装指南\n\n\
    - 使用强密码短语全盘加密（LUKS）（必须执行）\n- 确保交换 分区也被加密（必须执行）\n- 编辑引导程序需要密码（可以与 LUKS 相同）（必须执行）\n\
    - 设置根分区（可以与 LUKS 相同）（必须执行）\n- 使用非特权账户加入管理员组（必须执行）\n- 设置用户账户访问，与 root 不同（必须执行）\n\
    \n### 安全 SSH 和 PGP 密钥\n\n- 使用强密码保护私钥（必须执行）\n- PGP 密钥存储在移动存储设备上（可选）\n- Auth、Sign\
    \ 和 Encrypt 子密钥存储在智能卡上（可选）\n- 配置 SSH 使用 ssh 私钥（可选）\n\n### 密码管理器\n\n- 使用密码管理器（必须执行）\n\
    - 在不相关的网站上使用唯一密码（必须执行）\n- 使用支持团队共享的密码管理器（可选）\n- 为非网站账户使用独立的管理器（可选）\n\n### 工作站上的\
    \ SELinux\n\n- 确保 SELinux 在你的工作站上处于强制模式（必须执行）\n\n### 个人工作站备份\n\n- 设置到外部存储的加密备份（必须执行）\n\
    - 使用零知识备份工具进行异地备份（可选）\n\n### 检查清单优先级\n\n每个检查清单中的项目都包含优先级，这将有助于指导你的决策。\n\n（必须执行）项目应该绝对列在考虑列表的首位。如果不实施，将为你的工作带来高风险。\n\
    \n（可选）项目留当你需要所有安全性时，取决于它们对你工作环境的影响，可能需要学习新习惯或更新旧习惯。\n\n"
