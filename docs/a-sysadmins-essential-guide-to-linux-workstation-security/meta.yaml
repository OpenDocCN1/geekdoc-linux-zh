    \n1. It does not work across browsers\n2. It does not offer any way of sharing\
    \ credentials with team members\n\n# A SysAdmin's Essential Guide to Linux Workstation\
    \ Security\n\nThere are several well-supported, free-cheap password managers that\
    \ are well-integrated into multiple browsers, work across platforms, and offer\
    \ group sharing (usually as a paid service). Solutions can be easily found via\
    \ search engines.\n\n# Standalone password manager\n\nOne of the major drawbacks\
