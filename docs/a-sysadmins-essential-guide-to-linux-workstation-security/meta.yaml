- md: "\n# THE LINUX FOUNDATION TRAINING\n\n![](img/c6b17a0003e220fc326f5d6cfbbb41b3_0_0.png)\n\
    \n# A SysAdmin’s Essential Guide to Linux Workstation Security\n\nHow to work\
    \ from anywhere and keep your data, identity, and sanity\n\n*License information:\
    \ This work was created by The Linux Foundation and is licensed under a Creative\
    \ Commons Attribution-ShareAlike 4.0 International License. It can be found, and\
    \ forked, on GitHub.*\n\n## Contents\n\n- Choosing the right hardware 6\n- Pre-boot\
    \ environment 7\n- Distro choice considerations 9\n- Distro installation guidelines\
    \ 12\n- Post-installation hardening 16\n- Personal workstation backups 19\n- Best\
    \ practices 21\n  - Password managers 26\n  - Securing SSH and PGP private keys\
    \ 28\n  - Hibernate or shut down, do not suspend 29\n  - SELlinux on the workstation\
    \ 29\n- Further reading 31\n- License 31\n- Printable Checklist 32\n\n## A SysAdmin’s\
    \ Essential Guide to Linux Workstation Security\n\nHow to work from anywhere and\
    \ keep your data, identity, and sanity\n\n![](img/c6b17a0003e220fc326f5d6cfbbb41b3_2_0.png)\n\
    \nBy Konstantin Ryabitsev\nDirector of IT Infrastructure Security\nat The Linux\
    \ Foundation\n\nThis document is aimed at teams of systems administrators who\
    \ use Linux workstations to access and manage your project's IT infrastructure.\n\
    \nIf your systems administrators are remote workers, you may use this set of guidelines\
    \ to ensure that their workstations pass core security requirements in order to\
    \ reduce the risk that they become attack vectors against the rest of your IT\
    \ infrastructure.\n\nEven if your systems administrators are not remote workers,\
    \ chances are that they perform a lot of their work either from a portable laptop\
    \ in a work environment, or set up their home systems to access the work infrastructure\
    \ for after-hours/emergency support. In either case, you can adapt this set of\
    \ recommendations to suit your environment.\n\n## A SysAdmin's Essential Guide\
    \ to Linux Workstation Security\n\n### Limitations\n\nThis, by no means, is an\
    \ exhaustive “workstation hardening” document, but rather an attempt at set of\
    \ baseline recommendations to avoid most glaring security errors without introducing\
    \ too much inconvenience. You may read this document and think it is way paranoid,\
    \ while someone else may think this barely scratches the surface. Security is\
    \ just like driving on the highway — anyone going slower than you is an idiot,\
    \ while anyone driving faster than you is a crazy person. These guidelines are\
    \ merely a basic set of core safety rules that is neither exhaustive, nor a replacement\
    \ for experience, vigilance, and common sense.\n\nWe're sharing this document\
    \ as a way to bring the benefits of open-source collaboration to IT policy documentation.\
    \ If you find it useful, we hope you'll contribute to its development by making\
    \ a fork for your own organization and sharing your improvements.\n\n### Structure\n\
    \nEach section is split into two areas:\n\n- The checklist that can be adapted\
    \ to your project's needs\n- Free-form list of considerations that explain what\
    \ dictated these decisions\n\n## A SysAdmin's Essential Guide to Linux Workstation\
    \ Security\n\n### Checklist priority levels\n\nThe items in each checklist include\
    \ the priority level, which we hope will help guide your decision:\n\n![](img/c6b17a0003e220fc326f5d6cfbbb41b3_4_0.png)\n\
    \n(ESSENTIAL) items should definitely be high on the consideration list. If not\
    \ implemented, they will introduce high risks to your workstation security.\n\n\
    ![](img/c6b17a0003e220fc326f5d6cfbbb41b3_4_1.png)\n\n(NICE) to have items will\
    \ improve the overall security, but will affect how you interact with your work\
    \ environment, and probably require learning new habits or unlearning old ones.\n\
    \n![](img/c6b17a0003e220fc326f5d6cfbbb41b3_4_2.png)\n\n(PARANOID) is reserved\
    \ for items we feel will significantly improve your workstation security, but\
    \ will require a lot of adjustment to the way you interact with your operating\
    \ system.\n\nRemember, these are only guidelines. If you feel these priority levels\
    \ do not reflect your project's commitment to security, you should adjust them\
    \ as you see fit.\n\n## Choosing the right hardware\n\nWe do not mandate that\
    \ our admins use a specific vendor or a specific model, so this section addresses\
    \ core considerations when choosing a work system.\n\n### Checklist\n\n- System\
    \ supports SecureBoot (ESSENTIAL)\n- System has no firewire, thunderbolt or ExpressCard\
    \ ports (NICE)\n- System has a TPM chip (NICE)\n\n### Considerations\n\n### SecureBoot\n\
    \nDespite its controversial nature, SecureBoot offers prevention against many\
    \ attacks targeting workstations (Rootkits, \"Evil Maid,\" etc), without introducing\
    \ too much extra hassle. It will not stop a truly dedicated attacker, plus there\
    \ is a pretty high degree of certainty that state security agencies have ways\
    \ to defeat it (probably by design), but having SecureBoot is better than having\
    \ nothing at all.\n\nAlternatively, you may set up Anti Evil Maid which offers\
    \ a more wholesome protection against the type of attacks that SecureBoot is supposed\
    \ to prevent, but it will require more effort to set up and maintain.\n\n## A\
    \ SysAdmin's Essential Guide to Linux Workstation Security\n\n### Firewire, thunderbolt,\
    \ and ExpressCard ports\n\nFirewire is a standard that, by design, allows any\
    \ connecting device full direct memory access to your system (see Wikipedia).\
    \ Thunderbolt and ExpressCard are guilty of the same, though some later implementations\
    \ of Thunderbolt attempt to limit the scope of memory access. It is best if the\
    \ system is getting none of these ports, but it is not critical, as they usually\
    \ can be turned off via UEFI or disabled in the kernel itself.\n\n### TPM Chip\n\
    \nTrusted Platform Module (TPM) is a crypto chip bundled with the motherboard\
    \ separately from the core processor, which can be used for additional platform\
    \ security (such as to store full-disk encryption keys), but is not normally used\
    \ for day-to-day workstation operation. At best, this is a nice-to-have, unless\
    \ you have a specific need to use TPM for your workstation security.\n\n### Pre-boot\
    \ environment\n\nThis is a set of recommendations for your workstation before\
    \ you even start with OS installation.\n\n### Checklist\n\n- UEFI boot mode is\
    \ used (not legacy BIOS) (ESSENTIAL)\n- Password is required to enter UEFI configuration\
    \ (ESSENTIAL)\n- SecureBoot is enabled (ESSENTIAL)\n- UEFI-level password is required\
    \ to boot the system (NICE)\n\n### Considerations\n\n### UEFI and SecureBoot\n\
    \nUEFI, with all its warts, offers a lot of goodies that legacy BIOS doesn’t,\
    \ such as SecureBoot. Most modern systems come with UEFI mode on by default.\n\
    \nMake sure a strong password is required to enter UEFI configuration mode. Pay\
    \ attention, as many manufacturers quietly limit the length of the password you\
    \ are allowed to use, so you may need to choose high-entropy short passwords vs.\
    \ long passphrases (see below for more on passphrases).\n\nDepending on the Linux\
    \ distribution you decide to use, you may may not have to jump through additional\
    \ hoops in order to import your distribution’s SecureBoot key that would allow\
    \ you to boot the distro. Many distributions have partnered with Microsoft to\
    \ sign their released kernels with a key that is already recognized by most system\
    \ manufacturers, therefore saving you the trouble of having to deal with key importing.\n\
    \nAs an extra measure, before someone is allowed to get to the boot partition\
    \ and try some badness, let’s make them enter a password. This password should\
    \ be different from your UEFI management password, in order to prevent surfer-surfing.\
    \ If you shut down and start a lot, you may choose to not bother with this, as\
    \ you will already have to enter a LUKS passphrase and this will save you a few\
    \ keystrokes.\n\n## Distro choice considerations\n\nChances are you'll stick with\
    \ a fairly widely-used distribution such as Fedora, Ubuntu, Arch, Debian, or one\
    \ of their close spin-offs. In any case, this is what you should consider when\
    \ picking a distribution to use.\n\n### Checklist\n\n- Has a robust MAC/RBAC implementation\
    \ (SELinux/AppArmor/GrSecurity (ESSENTIAL))\n- Publishes security bulletins (ESSENTIAL)\n\
    - Provides timely security patches (ESSENTIAL)\n- Provides cryptographic verification\
    \ of packages (ESSENTIAL)\n- Fully supports UEFI and SecureBoot (ESSENTIAL)\n\
    - Has robust native disk encryption support (ESSENTIAL)\n\n### Considerations\n\
    \n### SELinux, AppArmor, and GrSecurity/PaX\n\nMandatory Access Controls (MAC)\
    \ or Role-Based Access Controls (RBAC) are an extension of the basic user/group\
    \ security mechanism used in legacy POSIX systems. Most distributions these days\
    \ either come bundled with a MAC/RBAC implementation (Fedora, Ubuntu), or provide\
    \ a mechanism to add it via an optional post-installation step (Gentoo, Arch,\
    \ Debian). Obviously, it is highly advised that you pick a distribution that comes\
    \ pre-configured with a MAC/RBAC system, but if you have strong feelings about\
    \ a distribution that doesn't have one enabled by default, plan to configure it\
    \ post-installation.\n"
  mdcn: "\n\n# LINUX 基金会培训\n\n![](img/c6b17a0003e220fc326f5d6cfbbb41b3_0_0.png)\n\n\
    # 系统管理员 Linux 工作站安全必备指南\n\n如何随时随地工作并保护你的数据、身份和神智健康\n\n*许可信息：本作品由 Linux 基金会创建，并根据知识共享署名-相同相同\
    \ 4.0 国际许可协议发布。你可以在 GitHub 上找到并对其进行派叉。*\n\n## 目录\n\n- 选择合适的硬件 6\n- 启动前环境 7\n-\
    \ 发行版选择考量 9\n- 发行版安装指南 12\n- 安装后加固 16\n- 个人工作站备份 19\n- 最佳实践 21\n  - 密码管理器 26\n\
    \  - 保护 SSH 和 PGP 私钥安全 28\n  - 使用休眠或关机，不要使用挂起 29\n  - 工作站上的 SELlinux 29\n- 延伸阅读\
    \ 31\n- 许可 31\n- 可打印检查清单 32\n\n## 系统管理员 Linux 工作站安全必备指南\n\n如何随时随地工作并保护你的数据、身份和神智健康\n\
    \n![](img/c6b17a0003e220fc326f5d6cfbbb41b3_2_0.png)\n\n作者：Konstantin Ryabitsev\n\
    Linux 基金会 IT 基础设施安全总监\n\n本文面向使用 Linux 工作站访问和管理项目 IT 基础设施的系统管理员团队。\n\n如果你的系统管理员是远程办公，你可以使用这套指南确保他们的工作站通过核心安全要求，从而降低他们成为针对你其他\
    \ IT 基础设施攻击向量的风险。\n\n即使你的系统管理员不是远程办公，他们也很可能在工作环境中使用便携式笔记本电脑完成大部分工作，或者设置家庭系统以访问工作基础设施以进行下班后/紧急支持。无论何种情况，你都可以根据自己的环境调整这套建议。\n\
    \n## 系统管理员 Linux 工作站安全必备指南\n\n### 局限性\n\n这绝不是一份详尽的“工作站加固”文档，而是尝试提供基准建议，旨在在不引入过多不便的情况下避免大多数明显的安全错误。你可能会读此文档并认为它非常偏执，而另人可能认为这仅仅触及了皮毛。安全就像在公路上开车——任何比你得慢的人都是傻瓜，而任何比你得快的人都是疯子。这些指南仅仅是一套基础的核心安全规则，既不详尽，也不能替代经验、警惕和常识。\n\
    \n我们分享此文档是为了将开源协作的优势带入 IT 策略文档。如果你觉得它有用，我们希望你通过为自己的组织创建一个派叉并分享你的改进来为开发做出贡献。\n\n\
    ### 结构\n\n每个章节分为两个部分：\n\n- 可以根据项目需求调整的检查清单\n- 自由格式的考虑因素列表，解释这些决策的依据\n\n## 系统管理员\
    \ Linux 工作站安全必备指南\n\n### 检查清单优先级\n\n每个检查清单中的项目包含优先级，我们希望这能帮助指导你的决策：\n\n![](img/c6b17a0003e220fc326f5d6cfbbb41b3_4_0.png)\n\
    \n（必须）项目绝对应该在考虑列表中处于高位。如果不实施，它们将为你的工作站安全带来高风险。\n\n![](img/c6b17a0003e220fc326f5d6cfbbb41b3_4_1.png)\n\
    \n（理想）有的项目将提高整体安全性，但会影响你与工作环境交互的方式，并且可能需要学习新习惯或遗忘旧习惯。\n\n![](img/c6b17a0003e220fc326f5d6cfbbb41b3_4_2.png)\n\
    \n（偏执）留给那些我们认为会显著提高你的工作站安全，但需要对你与操作系统交互的方式进行大量调整的项目。\n\n记住，这些仅仅是指南。如果你觉得这些优先级没有反映你项目对安全的承诺，你应该根据自己的情况进行调整。\n\
    \n## 选择合适的硬件\n\n我们不强制要求管理员使用特定的供应商或型号，因此本节讨论了选择工作系统时的核心考量。\n\n### 检查清单\n\n- 系统支持\
    \ SecureBoot（必须）\n- 系统没有火线线（firewire）、雷电（thunderbolt）或 ExpressCard 接口（理想）\n- 系统带有\
    \ TPM 芯片（理想）\n\n### 考量\n\n### SecureBoot\n\n尽管具有争议性，但 SecureBoot 提供了针对工作站的许多攻击（Rootkits、“恶意女女”等）的防御，且不会引入过多的额外麻烦。它无法阻止真正专注的攻击者，而且有极大的把握认为国家安全机构有方法击败它（可能就是这样设计的），但拥有\
    \ SecureBoot 总比什么都没有要好。\n\n或者，你可以设置 Anti Evil Maid（反恶意女女），它对 SecureBoot 旨在防止的这类攻击提供了更完善全面的保护，但需要更多精力来设置和维护。\n\
    \n## 系统管理员 Linux 工作站安全必备指南\n\n### 火线、雷电和 ExpressCard 接口\n\n火线（Firewire）是一种在设计上允许任何连接设备对你的系统具有完全直接内存访问的标准（参见\
    \ Wikipedia）。雷电（Thunderbolt）和 ExpressCard 也有同样的问题，尽管雷电的一些后期实现尝试限制内存访问范围。这些接口通常可以关闭。\n\
    \n### TPM 芯片\n\n信任平台模块（TPM）是一个封装在主板上的加密芯片，用于平台安全（例如存储全盘加密密钥），但通常不是必需的，除非你有特殊需求。\n\
    \n### 启动前环境\n\n这是在你开始安装之前针对工作站的一系列建议。\n\n### 检查清单\n\n- 使用 UEFI 模式（而非传统 BIOS）（必须）\n\
    - 需要密码才能进入 UEFI 配置（必须）\n- 已启用 SecureBoot（必须）\n- 需要 UEFI 级别的密码（理想）\n\n### 考量\n\n\
    ### UEFI 和 SecureBoot\n\nUEFI 尽管有各种缺点，但提供了许多传统 BIOS 无法提供的优点，例如 SecureBoot。大多数现代系统默认开启\
    \ UEFI 模式。\n\n确保需要强密码才能进入 UEFI 配置。注意，许多发行版对允许使用的密码长度有限制，因此你可能需要在高熵密码和长短语之间做出选择。\n\
    \n取决于你选择使用的 Linux 发行版，你可能需要费额外的精力来导入该发行版的 SecureBoot 密钥。许多发行版已与微软合作，对其发布的内核进行了签名，从而免去了你处理导入的麻烦。\n\
    \n作为一种额外措施，在允许任何人访问引导分区并尝试某些坏事之前，让他们输入密码。这个密码应该与你的 UEFI 管理密码不同，以防止越权。如果你经常关机并重启，你可能会选择不这样做，因为你已经必须输入\
    \ LUKS 密钥语了，这可以节省几次击键。\n\n## 发行版选择考量\n\n你很可能会坚持使用广泛使用的发行版，如 Fedora、Ubuntu、Arch\
    \ 或其紧密的分支。无论如何，这些都是你在选择要使用的发行版时应该考虑的内容。\n\n### 检查清单\n\n- 具有健壮的 MAC/RBAC 实现（SELinux/AppArmor/GrSecurity（必须））\n\
    - 发布安全公告（必须）\n- 提供及时的安全补丁（必须）\n- 提供软件包加密验证（必须）\n- 完全支持 UEFI 和 SecureBoot（必须）\n\
    - 具有原生磁盘加密支持（必须）\n\n### 考量\n\n### SELinux、AppArmor\n\n强制访问控制（MAC）或基于角色的访问控制（RBAC）是传统\
    \ POSIX 系统基本用户/组安全机制的扩展。如今大多数发行版要么内置了 MAC/RBAC 实现（Fedora, Ubuntu），要么提供了可选的安装后步骤来添加它（Gentoo,\
    \ Arch, Debian）。\n\n"
