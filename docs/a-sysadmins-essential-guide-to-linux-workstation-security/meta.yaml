  md: '# Post-installation hardening


    Post-installation security hardening will depend greatly on your distribution
    of choice, so it is futile to provide detailed instructions in a general document
    such as this one. However, here are some steps you should take:


    # Checklist


    +   - Globally disable firewire and thunderbolt modules (ESSENTIAL)

    - Check your firewalls to ensure all incoming ports are filtered (ESSENTIAL)

    - Make sure root mail is forwarded to an account you check (ESSENTIAL)

    - Set up an automatic OS update schedule, or update reminders (ESSENTIAL)

    - Check to ensure sshd is disabled by default (NICE)

    - Configure the screensaver to auto-lock after a period of inactivity (NICE)

    - Set up watchdog (NICE)

    - Install and use rkhunter (NICE)

    - Install an Intrusion Detection System (NICE)


    # Considerations


    # Blacklisting modules


    To blacklist a firewire and thunderbolt modules, add the following lines to a
    file in /etc/modprobe.d/blacklist-dma.conf:


    ```

    blacklist firewire-core

    blacklist thunderbolt

    ```'
