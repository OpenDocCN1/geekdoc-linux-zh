    around Linux applications. It is an excellent way to help build additional protection
    between the browser and the rest of your system. You can use Firejail to create
    separate instances of Firefox to use for different purposes — for work, for personal
    but trusted sites (such as banking), and one more for casual browsing (social
    media, etc).


    Firejail is most effective on Wayland, unless you use X11-isolation mechanisms
    (the --x11 flag). To starting Firejail with Firefox, please refer to the documentation
    provided by the project:


