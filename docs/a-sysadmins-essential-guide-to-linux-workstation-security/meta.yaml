    # Distro choice considerations


    Chances are you''ll stick with a fairly widely-used distribution such as Fedora,
    Ubuntu, Arch, Debian, or one of their close spin-offs. In any case, this is what
    you should consider when picking a distribution to use.


    # Checklist


    +   - Has a robust MAC/RBAC implementation (SELinux/AppArmor/GrSecurity (ESSENTIAL))

    - Publishes security bulletins (ESSENTIAL)

    - Provides timely security patches (ESSENTIAL)

    - Provides cryptographic verification of packages (ESSENTIAL)

    - Fully supports UEFI and SecureBoot (ESSENTIAL)

    - Has robust native disk encryption support (ESSENTIAL)


    # Considerations


    # SELinux, AppArmor, and GrSecurity/PaX


    Mandatory Access Controls (MAC) or Role-Based Access Controls (RBAC) are an extension
    of the basic user/group security mechanism used in legacy POSIX systems. Most
    distributions these days either come bundled with a MAC/RBAC implementation (Fedora,
    Ubuntu), or provide a mechanism to add it via an optional post-installation step
    (Gentoo, Arch, Debian). Obviously, it is highly advised that you pick a distribution
    that comes pre-configured with a MAC/RBAC system, but if you have strong feelings
    about a distribution that doesn''t have one enabled by default, plan to configure
    it post-installation.'
- md: '

    # A SysAdmin''s Essential Guide to Linux Workstation Security


    Distributions that do not provide any MAC/RBAC mechanisms should be strongly avoided,
    as traditional POSIX user- and group-based security should be considered insufficient
    in this day and age. If you would like to start out with a MAC/RBAC workstation,
    AppArmor and GrSecurity/PaX are generally considered easier to learn than SELinux.
    Furthermore, on a workstation, where there are few or no externally listening
    daemons, and where user-run applications pose the highest risk, GrSecurity/PaX
    will offer more security benefits than just SELinux.


    # Distro security bulletins


    Most of the widely used distributions have a mechanism to deliver security bulletins
    to their users, but if you are fond of something esoteric, check whether the developers
    have a documented mechanism of alerting the users about security vulnerabilities
    and patches. Absence of such mechanism is a major warning sign that the distribution
    is not mature enough to be considered for a primary admin workstation.


    # Timely and trusted security updates


    Most of the widely used distributions deliver regular security updates, but it
    is worth checking to ensure that critical package updates are provided in a timely
    fashion. Avoid using spin-offs and “community rebuilds” for this reason, as they
    routinely delay security updates due to having to wait for the upstream distribution
    to release it.


    These days, it is hard to find a distribution that does not use cryptographic
    signatures on packages, updates metadata, or both. That being said, fairly widely
    used distributions have been known to go for years before introducing this basic
    security measure (Arch, I''m looking at you), so this is something worth checking.


    ## Distros supporting UEFI and SecureBoot


    Check that the distribution supports UEFI and SecureBoot. Find out whether it
    requires importing an extra key or whether it signs a key already trusted by systems
    manufacturers (e.g. via an agreement with Microsoft). Some distributions do not
    support UEFI/SecureBoot but offer alternatives to ensure tamper-proof or tamper-evident
    boot environments (Qubes-OS uses Anti Evil Maid, mentioned earlier). If a distribution
    doesn''t support SecureBoot and has no mechanisms to prevent boot-level attacks,
    look elsewhere.


    ## Full disk encryption


    Full disk encryption is a requirement for securing data at rest, and is supported
    by most distributions. As an alternative, systems with self-encrypting hard drives
    may be used (normally implemented via the on-board TPM chip) and offer comparable
    levels of security plus faster operation, but at a considerably higher cost.


    # Distro installation guidelines


    All distributions are different, but here are general guidelines:


    # Checklist


    - Use full disk encryption (LUKS) with a robust passphrase (ESSENTIAL)

    - Make sure swap is also encrypted (ESSENTIAL)

    - Require a password to edit bootloader (can be same as LUKS) (ESSENTIAL)

    - Set up a robust root password (can be same as LUKS) (ESSENTIAL)

    - Use an unprivileged account, part of administrators group (ESSENTIAL)

    - Set up a robust user-account password, different from root (ESSENTIAL)


    # Considerations


    ### Full disk encryption


    Unless you are using self-encrypting hard drives, it is important to configure
    your installer to fully encrypt all the disks that will be used for storing your
    data and your system files. It is not sufficient to simply encrypt the user directory
    via auto-mounting cryptofs loop files (I''m looking at you, older versions of
    Ubuntu), as this offers no protection for system binaries or swap, which is likely
    to contain a slew of sensitive data. The recommended encryption strategy is to
    encrypt the LVM device, so only one passphrase is required during the boot process.


    The /boot partition will usually remain unencrypted, as the bootloader needs to
    be able to boot the kernel before invoking LUKS/dm-crypt. Some distributions support
    encrypting the /boot partition as well (e.g. Arch), and it is possible to do the
    same on other distros, but likely at the cost of complicating system updates.
    It is not critical to encrypt /boot if your distro of choice does not natively
    support it, as the kernel image itself leaks no data and will be protected against
    tampering with a cryptographic signature checked by SecureBoot.


    ### Choosing good passphrases


    Modern Linux systems have no limitation of password/passphrase length, so the
    only real limitation is your level of paranoia and your stubbornness. If you boot
    your system a lot, you will probably have to type at least two different passwords:
    one to unlock LUKS, and another one to log in, so long passphrases will probably
    get old really fast. Pick passphrases that are 2-3 words long, easy to type, and
    preferably from rich/mixed vocabularies.


    Examples of good passphrases (yes, you can use spaces):


    - nature abhors roomba

    - 12 in-flight Jebediahs

    - perdon, tendo flatulence


    Weak passphrases are combinations of words you''re likely to see in published
    works or anywhere else in real life, and you should avoid using them, as attackers
    are starting to include such simple passphrases into their brute-force strategies.


    Examples of passphrases to avoid:


    - Mary had a little lamb

    - you''re a wizard, Harry

    - to infinity and beyond


    You can also stick with non-vocabulary passwords that are at least 10-12 characters
    long, if you prefer that to typing passphrases.


    Unless you have concerns about physical security, it is fine to write down your
    passphrases and keep them in a safe place away from your work desk.


    # Root, user passwords and the admin group


    We recommend that you use the same passphrase for root password as you use for
    disk encryption (unless you share your laptop with other people who should be
    able to unlock the drives, but shouldn''t be able to become root). If you are
    the sole user of the laptop, having your root password different from your LUKS
    has no meaningful advantages.


    You should have a different, but equally strong password for your regular user
    account that you will be using day-to-day tasks. This user should be member of
    the admin group (e.g. `wheel` or similar, depending on the distribution), allowing
    you to perform `sudo` to elevate privileges.


    In other words, if you are the sole user on your workstation, you should have
    two distinct, robust passphrases you will need to remember:


    ### Admin-level, used in the following locations:


    - UEFI administration

    - Bootloader (GRUB)

    - Disk encryption (LUKS)

    - Workstation admin (root user)


    ### User-level, used for the following:


    - User account and sudo

    - Master password for the password manager


    All of them, obviously, can be different if there is a compelling reason.


    # Post-installation hardening


    Post-installation security hardening will depend greatly on your distribution
    of choice, so it is futile to provide detailed instructions in a general document
    such as this. However, here are some steps you should take:


    # Checklist


    - Globally disable firewire and thunderbolt modules (ESSENTIAL)

    - Check your firewalls to ensure all incoming ports are filtered (ESSENTIAL)

    - Make sure root mail is forwarded to an account you check (ESSENTIAL)

    - Set up an automatic OS update schedule, or update reminders (ESSENTIAL)

    - Check to ensure sshd is disabled by default (NICE)

    - Configure the screensaver to auto-lock after a period of inactivity (NICE)

    - Set up watchdog (NICE)

    - Install and use rkhunter (NICE)

    - Install an Intrusion Detection System (NICE)


    # Considerations


    ### Blacklisting modules


    To blacklist a firewire and thunderbolt modules, add the following lines to a
    file in /etc/modprobe.d/blacklist-dma.conf:


    ```

    blacklist firewire-core

    blacklist thunderbolt

    ```

    '
  mdcn: '


    # 系统管理员 Linux 工作站安全必备指南


    应强烈避免使用不提供任何 MAC/RBAC 机制的发行版，因为在当今时代，传统的基于 POSIX 用户和用户组的安全机制被认为是不够的。如果你想从 MAC/RBAC
    工作站开始，AppArmor 和 GrSecurity/PaX 通常被认为比 SELinux 更容易学习。此外，在工作站上，由于很少或没有外部监听守护进程，且用户运行的应用程序风险最高，GrSecurity/PaX
    提供的安全收益比仅仅使用 SELinux 更多。


    # 发行版安全公告


    大多数广泛使用的发行版都有向其用户分发安全公告的机制，但如果你青睐某些小众发行版，请检查开发者是否有一种记录的机制来向用户提醒安全漏洞和补丁。缺乏此类机制是该发行版尚未成熟到可以考虑作为主管理员工作站的重大警告信号。


    # 及时且可靠的安全更新


    大多数广泛使用的发行版都提供定期的安全更新，但值得检查以确保关键包更新能够及时提供。出于原因，请避免使用衍生版本（spin-offs）和“社区重新构建版”（community
    rebuilds），因为它们通常由于等待上游发行版的发布而推迟安全更新。


    如今，很难找到一个一个不对软件包使用加密签名、更新元数据或两者兼具的发行版。尽管如此，已知一些相当广泛使用的发行版在引入这项基础安全措施之前已经运行了多年（Arch，我是在说你呢），所以这是值得检查的。


    ## 支持 UEFI 和 SecureBoot 的发行版


    检查该发行版是否支持 UEFI 和 SecureBoot。了解它是否需要导入额外的密钥，或者它是否签名了系统制造商信任的密钥（例如通过与微软的协议）。某些发行版不支持
    UEFI/SecureBoot，但提供了替代方案来确保启动环境防篡改或可检测（Qubes-OS 使用了之前提到的 Anti Evil Maid）。如果一个发行版不支持
    SecureBoot 且没有防止启动级攻击的机制，请寻找其他。


    ## 全盘加密


    全盘加密是保护静态数据安全的要求，大多数发行版都支持该功能。作为替代，可以使用带有自加密硬盘的系统（通常通过板载 TPM 芯片实现），它们提供相当水平的安全性和更快的运行速度，但成本高得多。


    # 发行版安装指南


    所有发行版都不相同，但这里有一些通用指南：


    # 检查清单


    - 使用带有强密码句的全盘加密 (LUKS)（必须的）

    - 确保交换分区（swap）也被加密（必须的）

    - 编辑启动加载程序需要需要密码（可以与 LUKS 相同）（必须的）

    - 设置一个强 root 密码（可以与 LUKS 相同）（必须的）

    - 使用非特权账户，属于管理员组（必须的）

    - 设置一个强用户账户密码，与 root 不同（必须的）


    # 考虑因素


    ### 全盘加密


    除非你使用自加密硬盘，否则配置你的安装程序以完全加密所有用于存储数据和系统文件的磁盘是非常关重要的。仅仅通过自动挂载 cryptofs 环回文件来加密用户目录是不够的（我是在说你呢，旧版本的
    Ubuntu），因为这对系统二进制文件或交换分区不提供保护，而交换分区可能包含大量敏感数据。推荐的加密策略是加密 LVM 设备，这样在启动过程中只需要一个密码句。


    /boot 分区通常保持未加密状态，因为启动加载程序需要在调用 LUKS/dm-crypt 之前能够引导内核。某些发行版也支持加密 /boot 分区（例如
    Arch），在其他发行版上也可以这样做，但可能会以增加系统更新复杂度为代价。如果你选择的发行版没有原生支持它，那么加密 /boot 并不是关键的，因为内核镜像本身不泄露数据，并将受到通过
    SecureBoot 检查的加密签名保护防止篡改。


    ### 选择良好的密码句


    现代 Linux 系统对密码/密码句的长度没有限制，因此唯一的实际限制是你的偏执程度和你的固执程度。如果你频繁启动系统，你可能需要至少输入两个不同的密码：一个用于解锁
    LUKS，另一个用于登录，所以长密码句可能会很快让你厌烦。选择长度为 2-3 个单词、易于输入且最好来自丰富/混合词汇库的密码句。


    良好的密码句示例（是的，你可以使用空格）：


    - nature abhors roomba

    - 12 in-flight Jebediahs

    - perdon, tendo flatulence


    弱质的密码句是你可能在出版作品或现实生活中任何地方看到的单词组合，你应该避免使用它们，因为攻击者已经开始将此类简单的密码句纳入他们的暴力破解策略中。


    应避免的密码句示例：


    - Mary had a little lamb

    - you''re a wizard, Harry

    - to infinity and beyond


    如果你倾向于而不是输入密码句，也可以坚持使用至少 10-12 个字符的非词汇密码。


    除非你担心物理安全，否则将你的密码句写下来并保存在远离你办公桌的安全地方是可以的。


    # Root、用户密码和管理员组


    我们建议你对 root 密码使用与磁盘加密相同的密码句（除非你与其他人共享笔记本电脑，他们应该能够解锁硬盘，但不应该能够成为 root）。如果你是笔记本电脑的唯一用户，将
    root 密码与 LUKS 不同没有意义上的优势。


    你应该为你日常任务使用的普通用户账户设置一个不同但同样强大的密码。该用户应该是管理员组的成员（取决于发行版，例如 `wheel` 或类似），允许你通过 `sudo`
    提升权限。


    换句话说，如果你是工作站的唯一用户，你应该有两个不同的、强力的密码句需要记住：


    ### 管理员级，用于以下位置：


    - UEFI 管理

    - 启动加载程序 (GRUB)

    - 磁盘加密 (LUKS)

    - 工作站管理员 (root 用户)


    ### 用户级，用于以下：


    - 用户账户和 sudo

    - 密码管理器的主密码


    显然，如果有充分的理由，所有这些都可以不同。


    # 安装后加固


    安装后的安全加固在很大程度上取决于你选择的发行版，因此在这样的通用文档中提供详细说明是徒劳的。然而，这里是你采取的一些步骤：


    # 检查清单


    - 全局禁用 firewire 和 thunderbolt 模块（必须的）

    - 检查你的防火墙确保所有输入端口都经过过滤（必须的）

    - 确保 root 邮件转发到你检查的账户（必须的）

    - 设置自动操作系统更新计划或更新提醒（必须的）

    - 检查确保 sshd 默认禁用（可选的）

    - 配置屏幕保护程序在一段时间活动后自动锁定（可选的）

    - 设置看门狗（可选的）

    - 安装并使用 rkhunter（可选的）

    - 安装入侵检测系统（可选的）


    # 考虑因素


    ### 黑名单模块


    要黑名单 firewire 和 thunderbolt 模块，请在 /etc/modprobe.d/blacklist-dma.conf 文件中添加以下行：


    ```

    blacklist firewire-core

    blacklist thunderbolt

    ```


    '
