  md: '# A SysAdmin''s Essential Guide to Linux Workstation Security


    # Firewire, thunderbolt, and ExpressCard ports


    Firewire is a standard that, by design, allows any connecting device full direct
    memory access to your system (see Wikipedia). Thunderbolt and ExpressCard are
    guilty of the same, though some later implementations of Thunderbolt attempt to
    limit the scope of memory access. It is best if the system is getting none of
    these ports, but it is not critical, as they usually can be turned off via UEFI
    or disabled in the kernel itself.


    # TPM Chip


    Trusted Platform Module (TPM) is a crypto chip bundled with the motherboard separately
    from the core processor, which can be used for additional platform security (such
    as to store full-disk encryption keys), but is not normally used for day-to-day
    workstation operation. At best, this is a nice-to-have, unless you have a specific
    need to use TPM for your workstation security.


    # Pre-boot environment


    This is a set of recommendations for your workstation before you even start with
    OS installation.


    # Checklist


    +   - UEFI boot mode is used (not legacy BIOS) (ESSENTIAL)

    - Password is required to enter UEFI configuration (ESSENTIAL)

    - SecureBoot is enabled (ESSENTIAL)

    - UEFI-level password is required to boot the system (NICE)'
