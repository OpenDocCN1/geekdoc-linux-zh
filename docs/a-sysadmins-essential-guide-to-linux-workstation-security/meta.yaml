    # Best practices


    What follows is a curated list of best practices that we think you should adopt.
    It is most certainly non-exhaustive, but rather attempts to offer practical advice
    that strikes a workable balance between security and overall usability.


    # Graphical environment


    The venerable X protocol was conceived and implemented for a wholly different
    era of personal computing and lacks important security features that should be
    considered essential on a networked workstation. To give a few examples:


    +   * Any X application has access to full screen contents

    * Any X application can register to receive all keystrokes, regardless into which
    window they are typed


    A sufficiently severe browser vulnerability means attackers get automatic access
    to what is effectively a builtin keylogger and screen recorder and can watch and
    capture everything you type into your root terminal sessions.


    You should strongly consider switching to a more modern platform like Wayland,
    even if this means using many of your existing applications through an X11 protocol
    wrapper. With Fedora starting to default to Wayland for all applications, we can
    hope that most software will soon stop requiring the legacy X11 layer.'
