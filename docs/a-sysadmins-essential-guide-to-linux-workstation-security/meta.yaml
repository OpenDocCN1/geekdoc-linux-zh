  md: '# A SysAdmin''s Essential Guide to Linux Workstation Security


    # Automatic updates or notifications


    It is recommended to turn on automatic updates, unless you have a very good reason
    not to do so, such as fear that an automatic update would render your system unusable
    (it''s happened in the past, so this fear is not unfounded). At the very least,
    you should enable automatic notifications of available updates. Most distributions
    already have this service automatically running for you, so chances are you don''t
    have to do anything. Consult your distribution documentation to find out more.


    You should apply all outstanding errata as soon as possible, even if something
    isn''t specifically labeled as "security update" or has an associated CVE code.
    All bugs have the potential of being security bugs and erring on the side of newer,
    unknown bugs is generally a safer strategy than sticking with old, known ones.


    # Watching logs


    You should have a keen interest in what happens on your system. For this reason,
    you should install logwatch and configure it to send nightly activity reports
    of everything that happens on your system. This won''t prevent a dedicated attacker,
    but is a good safety-net feature to have in place.


    Note, many systemd distros will no longer automatically install a syslog server
    that logwatch needs (due to systemd relying on its own journal), so you will need
    to install and enable syslog to make sure your `/var/log` is not empty logwatch
    will be of any use.'
