  md: '# Distro choice considerations


    Chances are you''ll stick with a fairly widely-used distribution such as Fedora,
    Ubuntu, Arch, Debian, or one of their close spin-offs. In any case, this is what
    you should consider when picking a distribution to use.


    # Checklist


    +   - Has a robust MAC/RBAC implementation (SELinux/AppArmor/GrSecurity (ESSENTIAL))

    - Publishes security bulletins (ESSENTIAL)

    - Provides timely security patches (ESSENTIAL)

    - Provides cryptographic verification of packages (ESSENTIAL)

    - Fully supports UEFI and SecureBoot (ESSENTIAL)

    - Has robust native disk encryption support (ESSENTIAL)


    # Considerations


    # SELinux, AppArmor, and GrSecurity/PaX


    Mandatory Access Controls (MAC) or Role-Based Access Controls (RBAC) are an extension
    of the basic user/group security mechanism used in legacy POSIX systems. Most
    distributions these days either come bundled with a MAC/RBAC implementation (Fedora,
    Ubuntu), or provide a mechanism to add it via an optional post-installation step
    (Gentoo, Arch, Debian). Obviously, it is highly advised that you pick a distribution
    that comes pre-configured with a MAC/RBAC system, but if you have strong feelings
    about a distribution that doesn''t have one enabled by default, plan to configure
    it post-installation.'
