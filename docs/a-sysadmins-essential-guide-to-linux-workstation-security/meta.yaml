  md: '# A SysAdmin''s Essential Guide to Linux Workstation Security


    # Securing SSH and PGP private keys


    Personal encryption keys, including SSH and PGP private keys, are going to be
    the most prized items on your workstation — something the attackers will be most
    interested in obtaining, as that would allow them to further attack your infrastructure
    or impersonate you to other admins. You should take extra steps to ensure that
    your private keys are well protected against theft.


