  md: '# A SysAdmin''s Essential Guide to Linux Workstation Security


    # Browsers


    There is no question that the web browser will be the piece of software with the
    largest and the most exposed attack surface on your system. It is a tool written
    specifically to download and execute untrusted, frequently hostile code. It attempts
    to shield you from this danger by employing multiple mechanisms such as sandboxes
    and code sanitization, but they have all been previously defeated on multiple
    occasions. You should learn to approach browsing websites as the most insecure
    activity you''ll engage in on any given day.


    There are several ways you can reduce the impact of a compromised browser, but
    the truly effective ways will require significant changes in the way you operate
    your workstation.


    # 1: Use two different browsers (ESSENTIAL)


    This is the easiest to do, but only offers minor security benefits. Not all browser
    compromises give an attacker unfettered access to your system — sometimes they
    are limited to allowing one to read local browser storage, steal active sessions
    from other tabs, capture input entered into the browser, etc. Using two different
    browsers, one for work/high security sites, and another for everything else will
    help prevent minor compromises from giving attackers access to the whole cookie
    jar. The main inconvenience will be the amount of memory consumed by two different
    browser processes.


