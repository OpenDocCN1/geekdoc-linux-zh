- img_proc: true
  md: '# A SysAdmin''s Essential Guide to Linux Workstation Security


    Distributions that do not provide any MAC/RBAC mechanisms should be strongly avoided,
    as traditional POSIX user- and group-based security should be considered insufficient
    in this day and age. If you would like to start out with a MAC/RBAC workstation,
    AppArmor and GrSecurity/PaX are generally considered easier to learn than SELinux.
    Furthermore, on a workstation, where there are few or no externally listening
    daemons, and where user-run applications pose the highest risk, GrSecurity/PaX
    will offer more security benefits than just SELinux.


    # Distro security bulletins


    Most of the widely used distributions have a mechanism to deliver security bulletins
    to their users, but if you are fond of something esoteric, check whether the developers
    have a documented mechanism of alerting the users about security vulnerabilities
    and patches. Absence of such mechanism is a major warning sign that the distribution
    is not mature enough to be considered for a primary admin workstation.


    # Timely and trusted security updates


    Most of the widely used distributions deliver regular security updates, but it
    is worth checking to ensure that critical package updates are provided in a timely
    fashion. Avoid using spin-offs and “community rebuilds” for this reason, as they
    routinely delay security updates due to having to wait for the upstream distribution
    to release it.


    These days, it is hard to find a distribution that does not use cryptographic
    signatures on packages, updates metadata, or both. That being said, fairly widely
    used distributions have been known to go for years before introducing this basic
    security measure (Arch, I''m looking at you), so this is something worth checking.'
