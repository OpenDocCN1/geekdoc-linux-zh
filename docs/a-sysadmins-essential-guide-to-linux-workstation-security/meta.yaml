    \ for everything else\n\nChromium developers are aware of Firefox in adding a\
    \ lot of nice security features (at seccomp sandboxes, kernel user namespaces,\
    \ etc, which act as an added layer of isolation between the sites you visit and\
    \ the rest of your system. Chromium is the upstream open-source project, and Chrome\
    \ is Google's proprietary binary build based on it (insert the usual paranoid\
    \ caution about not using it for anything you don't want Google to know).\n\n\
    It is recommended that you install Privacy Badger and HTTPS Everywhere extensions\
    \ in Chrome and give it a distinct theme from Firefox to indicate that this is\
    \ your \"untrusted sites\" browser.\n\n# 2: Use Firejail (ESSENTIAL)\n\nFirejail\
    \ is a project that uses Linux namespaces and seccomp-bpf to create a sandbox\
    \ around Linux applications. It is an excellent way to help build additional protection\
    \ between the browser and the rest of your system. You can use Firejail to create\
    \ separate instances of Firefox to use for different purposes — for work, for\
