    Make sure a strong password is required to enter UEFI configuration mode. Pay
    attention, as many manufacturers quietly limit the length of the password you
    are allowed to use, so you may need to choose high-entropy short passwords vs.
    long passphrases (see below for more on passphrases).


    Depending on the Linux distribution you decide to use, you may may not have to
    jump through additional hoops in order to import your distribution’s SecureBoot
    key that would allow you to boot the distro. Many distributions have partnered
    with Microsoft to sign their released kernels with a key that is already recognized
    by most system manufacturers, therefore saving you the trouble of having to deal
    with key importing.


    As an extra measure, before someone is allowed to get to the boot partition and
    try some badness, let’s make them enter a password. This password should be different
    from your UEFI management password, in order to prevent surfer-surfing. If you
    shut down and start a lot, you may choose to not bother with this, as you will
    already have to enter a LUKS passphrase and this will save you a few extra keystrokes.'
