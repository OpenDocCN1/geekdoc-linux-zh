  md: '# Choosing the right hardware


    We do not mandate that our admins use a specific vendor or a specific model, so
    this section addresses core considerations when choosing a work system.


    # Checklist


    +   - System supports SecureBoot (ESSENTIAL)

    - System has no firewire, thunderbolt or ExpressCard ports (NICE)

    - System has a TPM chip (NICE)


    # Considerations


    # SecureBoot


    Despite its controversial nature, SecureBoot offers prevention against many attacks
    targeting workstations (Rootkits, "Evil Maid," etc), without introducing too much
    extra hassle. It will not stop a truly dedicated attacker, plus there is a pretty
    high degree of certainty that state security agencies have ways to defeat it (probably
    by design), but having SecureBoot is better than having nothing at all.


    Alternatively, you may set up Anti Evil Maid which offers a more wholesome protection
    against the type of attacks that SecureBoot is supposed to prevent, but it will
    require more effort to set up and maintain.'
