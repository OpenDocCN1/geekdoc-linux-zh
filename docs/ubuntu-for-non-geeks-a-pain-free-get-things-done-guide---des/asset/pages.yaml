    ![](img/58abec7ac6c22ade6357fd77ea421da3_387_0.png)


    Figure 19-10: gedit can''t open your shredded files.


    Now, you''ve got yourself a shredded file sitting in your folder, but it would
    be handy to get rid of the file rather than just it sitting there littering things,
    wouldn''t it? Of course, you can remove the file via the Terminal using the `rm`
    command, but it would be easier to get shredded files deleted immediately after
