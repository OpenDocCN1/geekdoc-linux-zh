- pgno: 235
  md: '# For the Driverless Among You


    As I mentioned, Linux does not yet have built-in support for printers.

    For those of you who find yourselves with such printers, you can take a few routes
    in order to get things working.


    # Checking the Connections


    You''d be surprised how many times I have triumphantly solved someone''s printer
    problems by simply turning on the printer or wiggling or replugging the USB or
    parallel connectors. Printers that are powered down and/or have loose connections
    are often to blame if the printer''s model name fails to appear in the first page
    of the printer setup wizard.


    If that approach fails, browse to http://www.linuxprinting.org/, because it is
    sometimes the case that Linux can support certain printers only if they are connected
    via the parallel port, even if they work over USB in other systems.


    # Trying Your Windows Drivers


    If your printer came with an installation disc, you might want to see whether
    you can find a driver for it there. The driver on such disc should end in .ppd
    (for “PostScript description”). To use one of these drivers, trying your printer
    as described earlier, but when you get to the New Printer window where you select
    your printer''s make, click the **Provide PPD file** option. Then to locate the
    appropriate file by clicking the button that says **(None)** in the middle of
    the page. If you find your driver, click the **Forward** button, and continue
    the printer setup.


    # Using Third-Party Drivers


    Recently, more Linux printer drivers are becoming available. If you don''t find
    your printer on second page of the printer setup wizard, just googling the make
    and model of your printer plus the word *linux*. In the past, I had a laser printer
    that did not appear at http://www.linuxprinting.org/, so I googled the printer,
    *samsung-SC4100-linux*, which led me to http://www.driverstock.com/, a site that
    provides free drivers for most operating systems, including Linux. On that site,
    I found not only the driver for my printer but also the driver for its built-in
    scanner.


    You might also want to check the website for the manufacturer of your printer,
    because now provide Linux drivers for a number of their printers. Brother, Lexmark,
    Hewlett-Packard, Canon, and Samsung do to make a few. There is also a German company
    (http://www.turboprint.info/) that provides Linux drivers, albeit for a fee, for
    machines that are really hard to deal with and for high-quality solutions.


    If you happen to find and download a driver for your printer that does not come
    with its installer, just follow the directions given for trying Windows drivers.
    Finally, don''t forget to give the Ubuntu forums (http://www.ubuntuforums.org/)
    a try to see whether anyone has any experience getting the printer in question
    to work on their system.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Trial Error


    Finally, there is always the old trial-and-error approach, which works on occasion.
    When setting up your printer via the wizard window, try choosing one of the other
    printer models and/or drivers available from your printer’s manufacturer.


    After you are done with the wizard, double-click the printer you added in the
    Printing window, click the Settings tab and then click the Print Page button to
    see what happens. If nothing happens, click the Change button at the far right
    end of the Make and Model row on the Settings screen, select a different printer
    model and/or driver, then, back on the Settings screen, click the Print Test Page
    button again. Repeat that process until something works. With any luck, something
    will . . might ... well, give it a try if you’re deperate.


    # Printing Details


    Now that your printer is set up, you will no doubt how to start printing! This
    is an easy task, and it isn’t very different from how it works in the Windows
    and Mac worlds, so you shouldn’t need much explanation to proceed. In fact, printing
    in Ubuntu becomes easier than ever, because all the settings would normally want
    to toy with all on their tabs within the Print window that appears when you select
    Print in an application’s File menu. It would even dare say figuring out options
    in Ubuntu is now easier than it is in Windows or OS X.


    You should be aware that the function of the tabs can vary depending on the application
    you happen to be printing from. For instance, the tabs you’ll see when printing
    from the GIMP will be slightly different from those you see when printing from
    Firefox. The General and Page Setup tabs will always be there, however. All that
    said, I’ll give you an idea of some of the settings that are available within
    some of the Print window’s tabs:


    +   **General** Printer selection, pages to print, number of copies, order of
    printing, collating

    **Page Setup** Pages per sheet, scaling, page type, paper source, output tray

    **Options** Print frames, shrink to fit page, print background, headers and footers

    **Image Settings** Size, resolution, page positioning

    **Job** Print timing (now, later, at time), cover page

    **Image Quality/Advanced** Output resolution (DPI), printing speed and quality'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Printing in OpenOffice.org


    Occasionally, you will come across an application such as OpenOffice.org Fortuntately,
    that has a slightly different way of handling printing. The differences actually
    make printing in OpenOffice.org more Windows-like and thus easier for newbies
    in the Windows world to follow along with. As you can see in Figure 10-7, the
    main Print window for OpenOffice org applications allows you to select the printer
    you want to use, the range of pages, and how many copies you want to print. You
    can access other options by clicking the Properties and/ Or buttons.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_237_0.png)


    Figure 10-7: Print settings in OpenOffice.org modules


    # Printing to PDF


    One of the nice features of Linux is that you can save most documents or web pages
    as PDF files. In some cases, such as in OpenOffice.org, you do this by exporting
    the document to PDF. In other applications, however, you do it via the Print window,
    in which you are said to be “printing to PDF.” Whether you are saving as PDF,
    exporting to PDF, or printing to PDF, you are essentially doing the same thing:
    creating a PDF of your document.


    This is very handy, because it allows you to create documents that cannot be altered
    by others and easily be read regardless of the word processor or operating system
    the reader is using. Best of all, this feature, which you would have to pay a
    pretty penny in the Windows world, costs you nothing, because it is built in your
    system.


    In GNOME applications (and now in Firefox), you can print to PDF by going to the
    File menu of the application in question and selecting Print. When the Print window
    (Figure 10-8), select Print to File in the list of printers, and make sure PDF
    is selected as the output format. Choose a name for the PDF file, and then click
    the Print button to save it.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_238_0.png)


    Figure 10-8: Printing a file to PDF in most GNOME applications


    # # Canceling a Print Job


    It happens to all of us. You wanted to print just 1 page of a 57-page document,
    but you accidentally started printing the whole thing. What can you do to save
    your ink and 56 sheets of paper? Fortunately, the solution is simple.


    Once you''ve clicked the Print button and the print job is sent to your printer,
    a small printer icon will appear somewhere at the right end of the top GNOME panel
    (usually to the left of the other items there), as you can see in Figure 10-9.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_238_1.png)


    Figure 10-9: A printer icon appears in the GNOME panel while printing.


    Just like that once, and a window showing your current and queued print jobs will
    appear (as shown in Figure 10-10). Your err print job will be listed in that window,
    right-click the name of the job to select it, and then, in the pop-up menu, select
    *Cancel*. You will be asked whether you really want to cancel the job, click *Yes*.


    After you do this, the print job listed in the queue window will disappear, and
    your printer will stop printing. You can then close the print queue window. This
    is a very easy process that you may well find is more effective than what you''ve
    experienced in other operating systems.


    202 Chapter 1'
  merge: -1
  img_proc: true
