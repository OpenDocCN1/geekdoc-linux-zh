- pgno: 167
  md: '# Installing Additional Wallpapers


    As you can see if you hover your mouse over it, the default wallpaper in Ubuntu
    is called Ubuntu. If purple blobs aren''t your style, click any of the other wallpapers
    to immediately change the wallpaper on the desktop. There are quite a few to choose
    from, but maybe you''d prefer to use some images of your own. These could be photos
    from a digital camera, works of art you created. In this case, however, you are
    going to venture out onto the Web to get what you want to put there and then install
    some wallpaper.


    A number sites provide free desktop wallpaper—two sites specifically geared toward
    Linux are http://www.gnome-look.org/ and http://art/gnome.org., but you can get
    wallpaper from wherever you like. Astronomy Picture of the Day (http://apod.nasa.gov/apod/)
    is a particular favorite of mine. If you want to follow along using the same bigger-than-life
    wallpaper that I use, however, go directly to the wallpaper by pointing your web
    browser to http://www.taibati.com/linux/index.php, scrolling the page a tad to
    the second TUX section, and then clicking the download button next to the size
    that matches your screen. When the picture appears in the browser window, right-click
    it, and then select Save As. In the Save Image window, give it an easy-to-remember
    name (wall_TUX_2_1024x768.png may be exact, but it might prove a bit much to deal
    with), or you can download any wallpaper wherever you like, as long as it is in
    a supported format, such as BMP, PNG, or JPEG. It''s all up to you.


    Once you''ve downloaded your wallpaper, move it from your Pictures folder. You
    may want to create a Wallpaper subfolder to keep things organized, but that''s
    up to you, too. After that, you can install the new image by going to the Background
    tab in the Preferences window and clicking the Add button. In the Add Wallpaper
    window that appears, navigate to your new wallpaper, click it to highlight it,
    and then click Open. The wallpaper will then appear highlighted in the Appearance
    Preferences window and will soon reappear on the desktop (Figure 8). Once it does,
    click Close.


    # Wallpaper from Internet to Desktop—Quick and Easy


    It''s also possible to automatically set an image from the Web as your desktop
    wallpaper by right-clicking that image within your web browser and then selecting
    Set As Desktop Background. A small window will then appear, in which you can preview
    what the download will look like (for example Figure 8). You can also adjust the
    position (t or centered) and background color for your desktop in this window.
    Once you''re making adjustments, click the Set Desktop Background button. The
    image will then appear on your desktop, while the file will be saved to a location
    (your home folder, by default) with the title Firefox_wallpaper.png.'
  merge: -1
  img_proc: true
