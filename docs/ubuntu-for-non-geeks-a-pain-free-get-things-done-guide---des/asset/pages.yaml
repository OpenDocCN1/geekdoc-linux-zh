  md: '# LEARN LINUX

    AND LOVE IT!


    A Fast, crystal-clear topical tour of the amazing collective accomplishment embodied
    in Ubuntu.\n—Cory Doctorow, Boing Boing


    The Ubuntu distribution makes Linux easy, and Ubuntu for Non-Geeks makes it even
    easier. Full of tips, tricks, and helpful pointers, this guide is perfect for
    those interested in—but nervous about—switching to the Linux system.


    This edition is packed with new material covering the latest features of Ubuntu.
    It includes five new chapters that take you over common tasks like installing
    and playing games, troubleshooting common hardware and software problems, and
    more.


    By following the book''s straightforward explanations and step-by-step projects,
    you''ll learn the basics and beyond, including how to:


    +   - Install Ubuntu and keep it updated

    - Set up printers, scanners, USB flash drives, iPads, iPhones, and other devices


    +   - Edit and share digital photos and videos

    - Create documents, spreadsheets, and presentations

    - Work with the command line (or avoid it altogether!)


    If you''re looking for a pain-free way to learn Linux, Ubuntu for Non-Geeks is
    just what you need to get started.


    # ABOUT THE AUTHOR


    Rickford is the author of Linux for Non-Geeks and Linux Made Easy. He has been
    an operating system mechanic for more than 20 years, from his early days with
    an Atari XL600 to his current Linux machines. Rickford is the international student
    advisor at Winston-State University in North Carolina.


    Phil Bull is an author of the official Ubuntu documentation and a member of the
    GNOME project. He has been helping people with computers since his early years
    and has been an open source contributor since 2005. Phil spends his time studying
    astrophysics in sunny Manchester, UK.


