- pgno: 151
  md: '# Sending Files by Bluetooth


    To send a file by Bluetooth from your computer to another Bluetooth-capable device,
    click the Bluetooth panel icon, and select Send files to device. A window will
    appear in which you can navigate to the target file. Once you have made your selection,
    click Open. The Select Device window will appear (Figure 7-19). Select the recipient
    machine, and click Send to. Your machine will then transferring the file. If the
    recipient machine is set up to seek permission before accepting a Bluetooth file
    transfer, you or the recipient will have to perform the appropriate action on
    the recipient machine before the transfer is completed.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_151_0.png)


    Figure 7-19: Selecting paired Bluetooth devices to receive sent files


    # Receiving Files by Bluetooth


    To receive files via Bluetooth from another Bluetooth-capable device, you have
    to first set up your device to allow such transfers. To do this, click the Bluetooth
    panel icon, and select Preferences. In the Bluetooth Preferences window, click
    the device you want to set up, and then click Receive Files. A Personal File Sharing
    Preferences window will appear then check the box to the words Receive files in
    Downloads folder over Bluetooth. For your safety, select Only for set up devices
    in the drop-down menu button to the right of the words Accept. Your window should
    then look like that in Figure 7-20. If so, click Close. Your machine will then
    automatically receive files sent to it via Bluetooth and save them to the Downloads
    folder.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_152_0.png)


    # # Backing Up Your Files


    You''ve worked hard to accumulate all of your files. Hours of typing, hundreds
    of photos, plenty of music CDs—it''s all there on the hard disk. So, what happens
    to it if something goes wrong with your computer? In many cases the answer is,
    unfortunately, all of the data is lost forever. To save you the pain of this experience,
    plenty of backup utilities are available, *Dejà Dup* stands out to be among the
    easiest to use. Open the Ubuntu Software Center, and install *Dejà Dup Backup
    Utility*. It''ll put itself in the **System Tools** section of the **Applications
    menu**, over here and start up.


    Now is a good time to decide what you''re going to store your backups. If you
    have an USB hard disk that does the trick, you can use a USB flash drive, recordable
    CD or DVD, or even a web server. I wouldn''t recommend putting your backups on
    the same computer, though. The best policy is to put some distance between the
    original files and the backups, if there''s a fire or some other disaster, you''ll
    have at least one copy of them left. Make sure you have enough space for the backup
    too; reality CDs are only 700MB, but your Pictures folder alone weighs in at 4.3GB!


    Connect, or otherwise prepare your chosen backup device, and click the **Backup**
    button in *Dejà Dup*. A Preferences window will pop up like the one in Figure
    7-21. Choose the location you''d like to save the backup files from the drop-down
    box. If you have sensitive files that you don''t want anyone snooping around in,
    check **Encrypt backup files**.


    116 Chapter 7'
  merge: -1
  img_proc: true
- pgno: 153
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_153_0.png)


    Figure 7-21: Choosing where to save the backup files in Déjà Dup


    **NOTE** If you want to put your backup files on a CD or DVD, you''ll have to
    save them to a folder somewhere first and copy that folder onto a disc using the
    burning software mentioned earlier this chapter.


    Hit **Forward**, and you will be presented with the screen in Figure 7-22. Your
    first task is to decide what you want to back up, so check out the list labeled
    *Include files in folders*, which should have only your *Home* folder in it at
    the moment. This is a pretty sensible choice for most people, since absolutely
    of your files should be in your *Home* folder. You can add and remove other items
    as you please using the buttons to the right of the list.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_153_1.png)


    Figure 7-22: Selecting which files you want to back up


    There''s another list on that screen, *Except files in folders*. You can use this
    to define any files or folders that you don''t want to back up. Say, for example,
    that you wanted to back up everything in your *Home* folder except your pictures—maybe
    you don''t have space on your backup disk for all of them. You''d need to do is
    make sure that your *Home* folder is in the *Include files in folders* list and
    your *Pictures* folder is in the *Except files in* list.


    A Tidy Nest 117'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'When you''ve chosen what to keep and what to ignore, click Forward again to
    get to the summary page. Check that everything looks hunky-dory, and click Backup
    to start the backup. If you chose to encrypt your backup, you''ll be asked to
    type a password, so do this and click Continue.


    Make sure you keep that password safe; otherwise, you won''t be able to recover
    your backed-up files at a later date! A flurry of copying will ensue different,
    and may last for some time if you have lots of files to back up. Once that''s
    finished, click Close, and safely recover your backup disk (or whatever you have
    instead).


    That should be it . . for now. Remember, there''s little point in backing up if
    you don''t do it regularly, since you''ll be able to recover older files (and
    not recent ones) if something goes wrong. I made a backup about once a month,
    but I would probably do it regularly than that. It''s not much of a chore; when
    you use Déjà Dup, it''ll remember all of your settings from the previous backup.
    If you want to do something different, click Edit > Preferences in the main window,
    and check the options there. You''ll find options for automatically backing up
    as well; check the Automatically backup on a regular schedule setting in the Preferences
    window, and then choose how often you''d like the backup to happen. click Close,
    and Déjà Dup should take care of the rest.


    Canonical, the company behind Ubuntu, now offers an online backup service called
    Ubuntu One. Take a look at https://one.ubuntu.com/ for more information on that.


    # Recovering from a Backup


    Ideally you''ll never have to recover your backup, but if you do, here''s a quick
    guide:


    +   1. Find your backup disk, hook it up to the computer, and start Déjà Dup.

    2. Select Edit > Preferences, and make sure that the disk is selected as the Backup
    location. Click Close to get back to the main screen.

    3. Click Restore, and enter the password you chose for the backup if you encrypted
    it.

    4. You''ll be asked to choose which backup you want to restore. Choose the one
    that looks right (normally the most recent one), and click Forward.

    5. If you want the files to be put back exactly where they came from, choose Restore
    files to original locations. Otherwise, you can choose a folder to restore them.
    Click Forward again.

    6. Glance over the summary to make sure everything looks OK, and click Apply to
    restore your files. There''s a chance you might have to reenter your encryption
    password, so go ahead and do so if asked.

    7. Click Once the restoration has finished, and check that the files have been
    put back correctly.


    Everything should have returned to normal now. Phew!'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Removing Unwanted Files


    Remember all that talk of keeping a tidy nest at the start of the chapter? Well,
    now it''s time to dust off your spring cleaning gear and give your home folder
    the once over.


    The first stop is the Trash. Sometimes I''m surprised by how much stuff accumulates
    here; I can go for weeks on end without emptying it. Luckily, this trash lacks
    the unpleasant odor of its real-world counterpart, all that stands in your way
    is a quick check to make sure you didn''t accidentally throw anything away. Click
    the Trash icon on the bottom panel, and when the window opens, click Empty Trash
    to delete all the files in there. With no way of getting them back.


    Next is a little more sophisticated. If you''re running on hard disk space and
    want to know why (or just want to snoop around your files), select Applications
    > Accessories > Disk Usage Analyzer. The window appears, click Scan Home, and
    wait for a while your folders are sized up. A colorful ring will appear, accompanied
    by a list showing where all your hard disk space is being eaten up. Hover the
    mouse over one of the colored segments on the chart to see what''s taking up the
    most room, or double-click one of them to zoom in on a particular folder. After
    that, it''s up to you to weed out the hard disk hogs: Click a file in the left
    list, and choose Move to Trash to delete it.


    # Project 7: Creating and Extracting Compressed Files


    Since I have been talking about file storage, it seems only fitting to wrap things
    up in this chapter by teaching you how to create and extract compressed files.
    In the Windows world, these are generally referred to as Zip files, in the Linux
    world, tarball is the operative name. The Linux name, in case you''re wondering,
    comes from the application that you use to create for such files, Tar. Compressed
    archives are great for two reasons: They let you bundle a load of files together
    into one handy package, and they also squeeze all the files so they take up space
    on your hard disk. If you''ve ever tried to email a bunch of files to someone,
    you know how useful this can be.


    Anyway, to get some of the hands-on stuff down, you''ll be creating a Windows/Linux/Mac-friendly
    Zip file and extracting it. You can get down to business by opening a Nautilus
    window and creating a couple of dummy files to work. With this by going to the
    Nautilus menu and selecting Creating Document > Empty File. A new file will appear
    in the Nautilus window, with its name highlighted. You can type a name for the
    file, such as the one I''m using: dogwood. Now repeat the process to create a
    second file. I''ll be calling that one violet. Use something equally evocative
    for yours.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Now that you have two files to work with, you can create the compressed archive
    by following these steps:


    +   1. Select the two files by clicking your mouse to the side of the files and
    dragging the cursor (with the mouse button still pressed) over both files until
    they are highlighted or by holding down the CTRL and clicking each file individually.


    +   2. Once both files are highlighted, right-click each one, and select Compress
    from the pop-up menu.


    +   3. In the Compress window that then appears, type blossoms in the Filename
    text box, and select zip from the drop-down menu button to the right of that.
    Once everything looks like what I set up in Figure 7-23, click the Create button,
    after which a compressed archive of your two files (blossoms.zip) will appear
    in your home folder.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_156_0.png)


    Now that you know how to put things together, let''s get back to work and learn
    the equally simple task of ripping it all apart—well, OK, extracting it:


    +   1. Drag the original dogwood and violet files to the Trash to get them out
    of the way.


    +   2. Double-click the blossoms.zip file you''ve just created. A window showing
    the contents of the file will appear (Figure 7-24).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_156_1.png)


    Figure 7-24: Extracting a compressed archive'
  merge: -1
  img_proc: true
- pgno: 157
  md: '+   3. In that window, click the **Extract** button, after which another window,
    Extract, will appear.


    +   4. Click the **Extract** button in that window, and within a second (two at
    the most), you will find two new copies of *dogwood* and *violet* in your home
    folder.


    Now you''ve created and extracted a compressed archive, which is in this case
    a Zip file. You can also create a compressed tarball in the future by following
    the same procedure (probably with real rather than dummy files), but when it''s
    time to select an archive type, select `.tar.gz` instead of `.zip`. Other than
    that single step, it is the same creation and extraction process.'
