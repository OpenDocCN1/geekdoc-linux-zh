- pgno: 129
  md: '# # 7


    # A TIDY NEST


    *File and Disc Handling in Ubuntu*


    ![](img/58abec7ac6c22ade6357fd77ea421da3_129_0.png)


    No matter which operating system you are using, you have to deal with files. Some
    people are very organized, placing every file in a logically named folder as soon
    as that file is saved for the first time. Then there are people like me, who save
    everything to the desktop until they can no longer make out the wallpaper, and
    only at that point they start organizing in earnest (if placing all of those files
    in a single folder called March17Cleanup can be called organizing).


    Of course, not only files get stored on your hard disk, but they are also copied
    to and from CDs, DVDs, external hard disks, flash drives, and other storage media
    and devices. They are also often saved in archives, which are then compressed
    to reduce their spatial footprint, making them easier to send via email or to
    fit onto removable storage media.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'With that introduction, you may have already guessed that in this chapter I
    will be dealing with file handling in Ubuntu, particularly in relation to the
    Nautilus file manager, which is at the heart of GNOME''s file-handling capabilities.


    # Nautilus: Your File Manager


    As I mentioned, the program that creates the file viewing and organizing interface
    on your system is called Nautilus, and it comes as part of the GNOME desktop environment.
    You may not have thought of an operating system''s file manager as a program before,
    but in fact, that is what it is. (The Windows file manager is called Windows Explorer.)
    To take a look at Nautilus, just to go to the Places menu, and select Home Folder.


    When Nautilus opens to your home folder (shown in Figure 7-1), you will find that
    you can store your files thematically: Documents, Downloads, Music, Pictures,
    Templates, and Videos. There is also another folder, titled Desktop, which, if
    double-clicked, will show everything you have stored on your desktop (a lot in
    my case; most likely in yours). There is also another folder, called Examples,
    which contains sample files that give you an idea of what Ubuntu has in store
    for you.


    You can create additional folders and files for your heart''s content, as this
    preconfigured state of affairs is sure to change once you get down to really using
    your system. In fact, you will be making some changes in Chapter 8, which will
    make everything look a bit more lived in.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_130_0.png)


    Figure 7-1: The contents of your home folder as viewed in a Nautilus window'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# The Side Pane


    Nautilus has a lot of interesting features that deserve mention, and the most
    obvious of these is the side pane, which appears at the left side of the window.
    The side pane allows you to view a variety of information via selectable views.
    You can make your choices by clicking the drop-down menu at the top side pane
    (Figure 7-2).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_131_0.png)


    Figure 7-2: Selecting views for the Nautilus side pane


    The default view in Ubuntu Places, which is a sort of quick navigation tool. In
    Places you will find icons representing various data-storage locations available
    to your system, such as your home folder, desktop, filesystems, any network shares
    you are connected to (more than that in a moment), and any removable media or
    devices you have in or connected to your system. Clicking any of these icons will
    show the contents of that location in the right panel of the Nautilus window.


    There are, of course, other views, such as Tree, which provides you with an expandable
    hierarchical view of your filesystem, and History, which shows you where in your
    filesystem you have been most recently, much in the way the history function works
    in a web browser. There are still other views for you to choose from, a couple
    of which will work in Chapter 8.


    # Now You See It; Now You Don''t


    The side pane is a rather handy feature, but sometimes you might prefer to have
    more space to view the contents of your window and want to get rid of the pane
    temporarily. You can do this easily by clicking the little close button in the
    upper-right corner of the pane or by going to the View menu of a Nautilus window
    and deselecting Side Pane. The check mark next to that entry will then disappear,
    as will the side pane. To get it back, just return to the View menu, and select
    Side Pane again. The check mark will then reappear, as will the side pane itself.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'There is another way to hide the side pane that many people seem to stumble
    upon accidentally, usually resulting in a bit of unnecessary panic. If you look
    at the gray border at the right side of the side pane , you will notice that there
    is a small ribbon in the center (see Figure 7-3). Dragging this ribbon allows
    you to resize the width of the pane. What most folks don''t realize straight off,
    however, is that simply clicking ribbon acts as a toggle to hide or show the side
    pane. When the ribbon is hidden in this way, the ribbon still appears at the left
    border of the window, which is not true when the pane is hidden in one of the
    ways mentioned above.


    So there it is—the side pane''s little secret. No, it''s not a particularly interesting
    secret, but it''s one that should provide you not only with an added layer of
    convenience but also with some peace of mind.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_132_0.png)


    > Figure 7-3: Another way of showing and hiding the Nautilus side pane


    # File Handling in Nautilus


    Since Nautilus is primarily a file manager, it only makes sense to get down to
    the business of using it at that level. Of course, most folks who use computers
    today are already familiar with the basics of drag-and-drop and a few others means
    creating folders and copying, cutting, and moving files. But for those who are
    unfamiliar with one way or another of performing these essential procedures, I''ll
    spell it out. If you find this al bit redundant, please bear with me for the good
    of the masses.


    # Creating, Naming, and Renaming Folders


    Creating a folder is a simple enough task, and there are two ways of going about
    it. The easiest (in my opinion) is to right-click any empty space within a Nautilus
    window, and select Create Folder in the pop-up menu that appears.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'If you prefer using menus or right-clicking empty space, you can instead start
    rolling by selecting File ▸ Create Folder.


    Regardless of where you made your Create Folder selection, a new folder with the
    name untitled folder will appear in the Nautilus window. The box of the folder
    will be highlighted and surrounded with a black box, which means you can immediately
    give that folder a name by simply typing one—nothing to click or do other than.
    Press ENTER, or click any open space in the Nautilus window to complete the job.


    If you later decide that the name you gave your folder needs some tweaking or
    even a complete creation, you can rename it by right-clicking it and selecting
    Rename in the pop-up menu. Alternatively, you can click the folder once to highlight
    it and then select Edit ▸ Rename. After that, you can type the new name for the
    folder and then press ENTER, or click any open space in the Nautilus window to
    seal the deal.


    # Moving Files and Folders


    Perhaps the easiest of all manipulations you can perform in Nautilus is moving
    a file by means of drag-and-drop. I am pretty that anybody who has wielded a mouse
    is familiar with that particular move. There is another way of moving files and
    folders, however: cut and paste.


    The easiest way of doing this is to right-click the file (or folder) you want
    to move and then select Cut from the pop-up menu Edit ▸ Cut will also be the trick.
    At this point, it will seem as if nothing has happened, because the file will
    still be there, but won''t worry.


    After that, right-click any open space in the folder to which you want to move
    the file, and then select Paste in the pop-up menu. The file will disappear from
    its original location and appear in its new one.


    Can you use key combinations to do this? Sure. Simply follow the directions I
    just gave, but press CTRL-X to copy and CTRL-V to paste.


    # Copying Files and Folders


    Based on the instructions I just gave, you can well imagine the methods for copying
    files and folders, because they are essentially a variation on the same theme.
    Just right-click the file you want to copy, select Copy from the pop-up menu,
    right-click any open space within the target location, and then select Paste.
    Keystroke-wise, that would be CTRL-C to copy and, as before, CTRL-V to copy.


    It is also possible to copy folders and files via the wonders of drag-and-drop,
    though this involves more hands than required for a simple drag-and-drop; fortunately,
    the two you will do nicely. Just press and hold the CTRL key while you drag the
    file or folder you want to copy to the target location. Be sure to release the
    mouse button and then the CTRL key (releasing in the opposite order will not work),
    and you will find a copy of the file in its new location.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Navigating in Nautilus


    Navigating through your various folders and subfolders in Nautilus is quite straightforward.
    In fact, all is conceptually pretty much the same as what you are accustomed to
    in Windows and Mac OS. You can simply move into and out of folders through a combination
    of double-clicking folders and clicking the Back, Forward, and Up buttons.


    # Browsing with Breadcrumbs in Nautilus


    In addition to the hierarchical view provided in the side pane, another handy
    feature can make your navigation choices even easier: Nautilus''s breadcrumb feature.
    As you wander deeper into your forest of folders, Nautilus will weave a trail
    of breadcrumbs (they look like buttons, actually) in the navigation bar for each
    folder you opened up to the one that you are currently viewing.


    Say, for example, that you have a folder called gooseberries inside a folder called
    Dalarna inside a folder SwedeStuff inside a folder NordicStuff, which is itself
    in your home folder. As you click your way to gooseberries folder, starting by
    double-clicking the NordicStuff folder, Nautilus will display a button for that
    folder . . and any folder opened before. Take a look at Figure 7-4 to see what
    I mean.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_134_0.png)


    Figure 7-4: Breadcrumb navigation in Nautilus


    As you can see, there is a button for each of the folders within the path from
    your home folder to your target: gooseberries. So what, right? Well, say you want
    to go back to the NordicStuff folder to open a file in which there''s some text
    you want to copy and then paste it into a document within the gooseberries folder.
    That sounds like a minor pain, right?


    Well, rather than going with the Back button, simply click the NordicStuff breadcrumb
    button, and the contents of that folder will be there before you. Need to go back
    to gooseberries? Just click the gooseberries button. Back to SwedeStuff, you say?
    Just click the SwedeStuff button. All quite fantastic!'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Spelling Out—Typing File Paths in Nautilus


    If you prefer typing over clicking, you will be happy to know that you can navigate
    to a folder by typing its path. Just click the Go menu and select Location (keyboard
    lovers press CTRL-L instead). A box will appear in the location bar (Figure 7-5)
    showing the current location, in the case of my buried example, would be /home/NordicStuff/SwedeStuff/Dalama/gooseberries.
    You can type the path to your target folder in that box and press ENTER, after
    which the contents of the target folder will appear below in the main pane of
    the Nautilus window.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_135_0.png)


    Figure 7-5: Typing the path to your target folder


    # Bookmarks Within Nautilus


    With all this clicking around deeply buried subfolders, it is worth mentioning
    another handy feature of Nautilus: bookmarks. Yes, Nautilus lets you bookmark
    folders which you have navigated. Although you are no doubt familiar with creating
    bookmarks for web pages that you frequent, you may be wondering why on Earth you
    would want to create bookmarks within your filesystem.


    Well, imagine that you have a folder you need to use, but it is even more buried
    away your gooseberries folder in the previous section. Getting there would take
    an excessive number of mouse clicks, and all clicking is buried to eventually
    give you a bad case of carpal tunnel syndrome. Although that is great for your
    doctor, it is decidedly not good for yourself. You could click to that folder
    once and then, in the Nautilus window, select Bookmarks > Add Bookmark. After
    that, whenever you want to get back to that buried folder, you can just click
    the Bookmarks menu, and the folder will be right waiting for you in the drop-down
    list.


    Another handy thing about Nautilus bookmarks is that they also appear in Save
    As dialog boxes, such as when you save an OpenOffice.document or download a file
    via Firefox. To use them in any Save As dialog box, just click the Save in folder
    button, and you will find your bookmarks.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Understanding the Linux Filesystem


    With all that path typing, navigating, and bookmarking you''ve just been learning,
    you should be pretty much able to figure out how to get from here to in your home
    folder. Still, it is probably a good idea to know where your home folder actually
    is in the scheme of things, just in case you manage to get yourself lost someday.
    To understand this, you should have a basic understanding of the Linux filesystem,
    as you will find, is a bit different from what you were accustomed to in your
    previous operating system.


    Unlike Windows, the Linux filesystem all stems from a single point called root
    and is represented by a solitary slash (/). Your own user account is located in
    a subfolder of root folder home. This is represented as /home or, to put it into
    words, the home folder within root. If your user account were to have the same
    name as mine, rg, the path to that folder would be /home/rg or the rg folder within
    home within root. Whatever the name of your user account or the names of any other
    accounts you have on your machine happen to be, just remember that when you are
    lost, folder and for all the other folks with user accounts on your machine, are
    located within the home folder. If you''re a more graphically oriented person,
    the map in Figure 7-6 should help you.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_136_0.png)


    Figure 7-6: The location of your users'' folders within the Linux filesystem'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# What''s in All Those Other Folders?


    Needless to say, there is more to the Linux filesystem than the root, home, and
    user account folders. Several other directories appear at the same level as home,
    though for the most part, you shouldn''t be mucking around them unless you know
    what you''re doing. Frankly, most of these folders are write protected, so you
    should be fairly protected from yourself. Still, it is natural to be curious about
    what those other folders are there, for since, , they''re there. So, to satisfy
    your curiosity a bit, I''ll do a little explaining.


    In Ubuntu, four folders contain most of the applications on your system. The essential
    elements of your system are located in /bin. Other elements that need to be, though
    they may not be required by such commands, and the like are located in /bin. Most
    of the applications you actually think of as applications and use in a hands-on
    way are located in /usr. Finally, there are some add-ons, such as RealPlayer,
    that install themselves into /apt.


    Three other top-level folders that might be of interest to you are /etc, /lib,
    and /media. The first of these, /etc is the location of all the configuration
    files on your system. The second, /lib is the home of all the libraries that are
    required by your system or applications installed on it. These libraries are the
    Linux equivalent of a Windows .dll file. Finally, /media is where the contents
    of your various attached external media (such as USB drives and CDs) appear when
    present.


    There are other top-level folders, but their purposes are a bit less straightforward
    for the average Linux newbie and to be honest, probably not all of them interesting
    to you at this stage. Anyway, as I mentioned, there is no reason for you to be
    mucking around with any of these folders for the time being, because you can access
    the items located within them different, and much safer, ways.


    # Using Nautilus as a Network Browser


    Another handy Nautilus feature is its ability to function as a network browser.
    You can, for example, see what networks and shares are available to you on your
    home or office network by clicking Network in the side pane of the Nautilus window
    or by going to the Places menu in the GNOME panel and selecting Network. You can
    do the same within a Nautilus window by going to its Go and selecting Network.
    Icons for any networks or computers on that network would then appear in the Nautilus
    window, like in Figure 7-7. From that, you can double-click your to share that
    you have permission to access, such as the Shared Documents folder of a Windows
    machine or the public folders of a Mac. By the way, in case you are wondering
    what a share is, I''ll clear up for you: A network share is a location on a computer,
    such as a folder, where other users on a network can access and save files. The
    Shared Documents folder on a Windows system is a good'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'example. Other users on a network can copy files from and (usually) write files
    to the Shared Documents folder, whereas they cannot access any other part of the
    filesystem on that host machine.


    If the share you are trying to open requires a username and password, you will
    be asked for them in a new window. Note that, in this case, the username and password
    you need to enter are for the machine you are connecting to—not the one you''re
    using in Ubuntu (unless the usernames and passwords happen to be the same, of
    course). You can then copy files to as if it were a folder on your hard disk.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_138_0.png)


    Figure 7-7: Viewing the computers on your network


    In some cases, especially when trying to access shares on a Mac OS X, the double-click
    method will not work. You will not be able to access any share on a particular
    machine, even if an icon for that appears in the Nautilus window. In such cases,
    double-click the icon for the machine you are trying to access and then, once
    open (an empty window), select Go Location. A text box will appear in the location
    bar (just like in Figure 7-5) with the location of the machine you are trying
    to access already listed.


    To that location, add a forward slash (/) followed by the username on the target
    machine. For example, if the target machine is called cowboys and the username
    is mewtoyou, the location would be sm://cowboycats/mewtoyou. You can also narrow
    things down to a particular folder on the machine, as long as you know the path
    to that folder, by adding to the path you''ve already typed; sm://cowboycats/mewtoyou/Documents,
    for example. If you prefer, you can use type sm://mewtoyou and your Mac''s IP
    address, which consists of a set of four numbers'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'separated by periods. In the case of my machines, I would type smb:// 192.168.0.100.
    (You can find a Mac''s IP address by the Mac''s System Preferences, Sharing, and
    then clicking Windows Sharing. The address should appear immediately below the
    service pane.)


    NOTE In case you are wondering, the smb at the head of that path stands for server
    message block, but to make things easier (and perhaps more useful in terms of
    your memory), you can just think of it as being short for Samba, which is used
    by Unix-based systems (such as Linux and Mac OS) in order to interact with Windows
    networks.


    Once you''ve made your way to the folder to browse on the networked machine you''ve
    connected to, it might be a good idea to use the bookmark function in Nautilus
    to bookmark that share window. You can then easily access that share in the future
    by choosing the share''s name in the Nautilus bookmarks menu. Pretty cool, if
    I do so myself.


    # Using Nautilus as an FTP Client


    Not only does Nautilus allow you to browse and mount shares on local networks,
    but it can also act as a File Transfer Protocol (FTP) client, when you want to
    change the files for your website on a remote server. To do this, go to the Connect
    to Server menu File > Connect to Server, and select FTP (with login) for the service
    type. Then type the information provided by your website host, and click the Connect
    button. An FTP Share will then appear on the desktop and in the side pane. Double-click
    that icon, type your password (for that account—not the one for your Ubuntu system,
    unless prompted to do so, and you will be able to view and add to the files you
    have there.


    # File and Folder Permissions Within Nautilus


    As you make your way in the world of Ubuntu, you will find that occasionally you''ll
    come across files or folders that are in some way locked, in terms of your being
    able to read them, being able to alter them, or both. These readability and alterability
    states are referred to as permissions.


    Now, you may be wondering the point of this permission business, so in order to
    help you understand, I will give you some examples of how it can be useful. Let''s
    say you have files that you don''t want your spouse or kids to see—some bad poetry
    or a Christmas shopping list, for example. By denying permission to those files
    or to a folder containing them, no one would be able to sneak a peek unless they
    were savvy at changing permissions and had the permissions necessary to change
    permissions for those files or folders.


    Another example, imagine you have a file that you have worked many hours on and
    have finally completed. To alleviate fears that you might accidentally ruin that
    file in some way, you could deny yourself write permissions. By doing this, you
    wouldn''t be able to save any changes you make to that file.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'You would be given the Save Option, but if you wanted to change the file itself,
    you would have to change the permissions. When you place such restrictions on
    a file or folder, a lock emblem appears on the icon for it, as shown in Figure
    7-8.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_140_0.png)


    Figure 7-8: Nautilus tells you when permissions restrict your freedom of movement.


    # Changing File and Folder Permissions in Nautilus


    To change file or folder permissions in Nautilus, just right-click the file or
    folder in question, and then select Properties from the pop-up menu. When the
    Properties window opens, click the Permissions tab, and you will see who the owner
    of the file or folder is and what others are all allowed or not allowed to do
    with it. As you can see in Figure 7-9, the options for folders are slightly different.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_140_1.png)


    Figure 7-9: Changing permissions in a Nautilus Properties window for files and
    folders


    You might find this permissions business a bit confusing, but it is really simple
    to understand. Permissions can be granted or denied to the owner


    104 Chapter 7'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'of the file or folder (you), to a specified *group*, or to *others* (everybody
    else). Traditionally, these permissions are referred to as follows:


    +   **Read** Permission to view the contents of a file or folder


    +   **Write** Permission to alter the contents of a file or folder


    +   **Execute** Permission to run a program or script


    Nautilus has tried to spell things a bit more, as you can see in Figure 7-9. In
    general, however, you needn''t worry all that setting permissions for your own
    files, because you are really the only one who has access to your user account.
    One exception you run into when you transfer files from CD to your hard disk.
    In this case, the files will be protected, meaning you cannot alter the files
    until you change the permissions for them. You can change the permissions of such
    files in order to allow yourself to alter them by going to the **Owner** section
    of the Properties window and selecting **Read** and **write** in the menu next
    to the *Access* (for files) or **Create and delete files** in the menu next to
    the *File access* (for folders). Once you are done, click the **Close** button,
    and you''ll be on your way.


    # Keeping Your Home Folder Private


    Another exception to your you-don''t-to-worry-about-permissions claim, and a potentially
    important one that is, the state of permissions for your home folder, particularly
    when other people have accounts on your machine. In Ubuntu, when someone logs
    in to their own account on your computer, they can click their way to your user
    folder and view its contents.


    To remedy this situation—and protect the sanctity of your home folder, the privacy
    of its contents, and the peace of mind of its owner (you)—you can change the permissions
    of your home folder. Here''s what you need to do:


    +   1. Open a Nautilus window, and click **File System** in the side pane. The
    contents of your entire hard disk will then appear in the right pane of the Nautilus
    window.


    +   2. Look for and double-click the folder named **home**. When the contents
    of your home folder you just clicked in the right pane, there should be only one
    folder—your folder, which will have the same name as your own username. For example,
    mine, as I mentioned earlier, is named *ng*.


    +   3. Right-click your folder, and then select **Properties** in the pop-up menu.


    +   4. In the user Properties window (mine says *ng Properties*), click the **Permissions**
    tab.


    +   5. In the Permissions tab, go to the Group and Others sections, and select
    **None** in the drop-down menus next to the words *Folder access*. When you''re
    done, be sure to do this in both the Group and Others sections. Your window should
    look like mine in Figure 7-10. If so, click **Close.**.'
  merge: -1
  img_proc: true
