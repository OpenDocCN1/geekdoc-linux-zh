    If you find yourself in this situation, it wouldn''t be a bad idea to print a
    test page to see whether the substituted driver works as it should. You can do
    this by clicking **System > Administration > Printing** and then double-clicking
    your printer in the Printer window that appears. A Printer Properties window will
    open; make sure that **Settings** is selected from the left of the window and
    then click the **Print Test Page** button (Figure 10-3), if the test page looks
    normal, things should be fine, and you can close the Printer Properties and Printing
    windows.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_231_1.png)


    **Figure 10-2:** Printing a test page with your new printer via the Printer Properties
    window


    If you have a printer that plugs into your computer''s parallel port, auto-detection
    and setup should also work if the printer was connected when you turned on the
    computer. If it was not, shut down your system and turn your computer off, connect
    your printer to the computer, turn on the printer, and then start your computer
    again. With luck, your printer should be recognized and set up automatically this
    time around. You can also try this approach with a USB printer that was not recognized
    initially.'
