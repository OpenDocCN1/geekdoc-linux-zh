    Proprietary drivers are being used to make this computer work properly.


    Proprietary drivers do not have public source code that Ubuntu developers have
    gone to are free to modify. Security updates and corrections depend solely on
    the responsiveness of the manufacturer. Ubuntu cannot fix or improve these drivers.


