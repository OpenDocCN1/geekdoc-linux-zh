- pgno: 219
  md: '# 9C-5: Creating a Launchable Link for Briscola


    Even though you''ve moved Briscola to a global location, you still can''t run
    it with a simple one-word command because brisola.tk file is not in the system''s
    command search path. Just as you did for pyWings, you will create a launchable
    link for Briscola to solve that problem. Here are the steps:


    +   - In the Terminal, type `cd /usr/games`, and press ENTER.

    - Now create the link by typing `sudo ln -s /usr/share/games/briscola/briscola.tk
    briscola`, and press ENTER.

    - Type `cd`, and press ENTER to return the Terminal to your home folder.


    You can now easily run Briscola by typing briscola in the Terminal and pressing
    ENTER.


    # Can You Do the Same Thing with pyWings?


    Sure. If you want to move pyWings to a global location, just follow the same procedure
    for the pyWings folder and creating the link as you did for Briscola, making the
    necessary substitutions, of course. You will have to remove the previously created
    pyWings link, though, by typing the following command and pressing ENTER:


    ```

    sudo rm /usr/games/pyWings

    ```


    After that, move the pyWings folder to global territory by typing `sudo mv ~/LocalApps/pyWings
    /usr/share/games/pyWings` and pressing ENTER. When prompted for your password,
    type it, and then create the launchable link by typing `cd /usr/games`, pressing
    ENTER, typing `sudo ln -s /usr/share/games/pyWings/pyWings.py pyWings`, and pressing
    ENTER once more.


    # Playing Briscola


    As I mentioned, Briscola is easy—as easy as a card game as there is. It is a trick-taking
    game, which means you put out a card and then your opponent puts out a card, and
    the one who puts the higher-value card wins that trick. Points are awarded on
    the basis of the cards involved in that trick. The winner of the trick then goes
    to *lead* the next trick, meaning that the winner puts out his or her card the
    first time around. When all the cards are played, the points for each player are
    then tallied, and the player with the higher points wins. It''s much simpler than
    it is to describe.


    # Want to Know More?


    If you would like a more detailed set of rules for playing Briscola (and just
    about other card game in the world), check out http://www.pagat.com/.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Project 9D: Compiling and Installing Programs from Source: Xmahjongg


    Though it was far more common in the earlier days, compiling programs from source
    seems to be a phrase you still hear more in the Linux world than in any other.
    For the beginner, just the mention of compiling a program from source seems off-putting
    enough. The words compile and source seem to instill a sense of foreboding in
    the heart of the new user. Certainly that was the case for me, anyway.


    You can live long and prosper without ever bothering to compile your system. You
    can move quite happily with your system as, or you can just install programs by
    means of the much more convenient Ubuntu Software Center. Still, once in the Linux
    world, you may well become curious, especially if you move into the geekier side
    of the community.


    # So, What Is Source?


    To get started, it is probably a good idea to understand what source is to help
    you understand how a program actually gets from its primitive state to the programmer''s
    computer to an up-and-running application on your machine. The first programmer
    writes a program in programming language. You have probably heard of programming
    languages as BASIC or C, and there are many others. What the programmer writes
    with such a language is a set of instructions called source code, or source. Your
    computer, however, cannot understand any of that on its own. It is as if the computer
    speaks ancient Greek, and the source code is all written in French. The computer
    needs some interpreter to help it out.


    The various languages that programmers use are high-level languages—they are relatively
    easy for programmers to read. The computer, on the other hand, understands low-level
    languages, which are quite difficult for most mortal programmers to deal with.
    To convert the high-level instructions to a low-level language, the computer needs
    some other program to translate


    If this translation actually takes place while a program is running, the translator
    is called an interpreter. Applications that run using an interpreter are usually
    scripts. The PyWindows and Briscola applications learned earlier in this chapter
    are examples of script applications.


    The problem with these scripts is that they can be slower than most of the applications
    you''re familiar with—the computer must run an interpreter, interpret the source
    code, and run the actual application at all the time. This is like having a French
    book translated into Greek by a live interpreter; it''s very slow indeed.


    As an alternative, most programs use a compiler instead of interpreter. A compiler
    translates the high-level source code into low-level machine code or object code,
    that the computer can understand before the application is'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'actually run. Once this translation is done, the computer never has to bother
    with the high-level instructions again; it can merely read the translated version
    each time it runs the program. This is like having a translated version of a foreign
    book that you can read any time you want. Because computers can run compiled programs
    without simultaneously using an interpreter, compiled programs run faster than
    scripts. Most applications for all operating systems are, therefore, compiled.


    # The Basics


    The actual process of compiling an application from source and then installing
    it is quite simple—a truly "one, two, three" bit of presto change-o. Basically,
    after extracting the source code from an archived file (usually in the form of
    a tarball), you would use the following commands to accomplish the task:


    ```

    ./configure To configure a makefile, which provides instructions for the make
    command

    ```


    ```

    make To translate the source code into object code that the computer can understand

    ```


    ```

    sudo make install To give yourself write privileges in protected folders and then
    install the application

    ```


    ```

    make clean To tidy up the leftovers once the process is complete (to clean up
    the mess)

    ```


    I know sounds like a lot of commands, but as I always say, it is easier to actually
    do what it looks like on the page, so fear not.


    # 9D-1: Installing the Tools You Need


    Before doing anything else, you have to get your system ready to do what you are
    about to ask of. Because Ubuntu is built with the average user in mind, it does
    not come with the various applications and libraries you need to compile applications
    from source. Fortunately, every-thing you need to get the job done is available
    via the Ubuntu Software Center. To get ready for the work you have in this chapter
    (and many other jobs you are likely to do on your own in the future), perform
    searches for and install the following packages:


    +   - build-essential

    - libgtk2.0-dev


    # 9D-2: Downloading and Extracting the Xmahjongg File


    To some hands-on experience with compiling a program from source, you will be
    working with a game called Xmahjongg which you can see in Figure 9-17. If you
    tried the version of Xmahjongg that comes with your Ubuntu distribution, you will
    notice that this is much easier on your eyes and is a bit more colorful (check
    out the project site at http://www.lcdf.org/xmahjongg/ to catch a glimpse of it
    in its full-color glory).'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_222_0.png)


    Figure 9-17: The Xmahjongg game


    Xmahjongg is available via the Ubuntu Software Center, so it is not absolutely
    necessary to install it in the way you are about to, but doing provides provides
    a opportunity to learn how to compile a program from source. The amount of code
    isn''t that great, so it won''t take too much time to do, and it requires no tinkering.


    To get started, you will first have to download the Xmahjongg project page at
    http://www.lcdf.org/xmahjongg/xmahjongg/. Download the tarball xmahjongg-3.7.tar.gz,
    or a newer version if there is one. Do not download any of the other file types
    available on page.


    If you prefer, you can instead download the Xmahjongg tarball by using the wget
    command that you learned in Project 9C-1. Just open a Terminal window, follow
    the following command, and press ENTER:


    ```

    wget http://www.lcdf.org/xmahjongg/xmahjongg-3.7.tar.gz

    ```


    Once you have the file on your hard disk, untar the xmahjongg-3.7.tar.gz file.
    You can do this by using the command line, as you learned to earlier in the chapter,
    or by double-clicking the file and dragging its contents into the appropriate
    folder. To make it easier for you to follow along with the directions I''ll be
    giving you, be sure to place the untared Xmahjongg folder in your home folder.
    You will be ready to roll.


    Normally at point, you would look through the folder for some instructions for
    dealing with the package, just as you did earlier in the chapter. In most source
    code packages, this information is included in an INSTALL file, like the one in
    the xmahjongg-3.7 folder (Figure 9-18). To read the INSTALL file, just double-click
    it, and it will open in Gedit.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'In this case, you can simply close the INSTALL file, because it prescribes
    the same steps I''ve listed next. However, in the future, when you install other
    programs from source, you will need to follow the instructions in the INSTALL
    files that come with the source files. However, with most INSTALL files, the instructions
    will match the process I am about to describe.


    Of course, it may well happen that you take a look at the contents of the INSTALL
    file and start wondering what tongue it is written in. In cases when you have
    no idea what the INSTALL file is going about, just look for a `configure` file
    in the package folder. If you find one, you should be able to follow the instructions
    in this project.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_223_0.png)


    Figure 9-18: Identifying a package''s INSTALL file


    # 9D-3: Running configuration and make for Xmajjong


    Now that you have downloaded and untarred the Xmajjong tarball, installation is
    perfectly standard. Here''s what you need to do:


    +   1. Open a Terminal window, and then move into the new folder by typing `cd
    xmajjong` and pressing ENTER.


    +   The next step is part of a setup phase that runs the configure script in the
    `xmajjong-3.7` folder. The configure script checks what files, compilers, and
    other things it needs, and then searches your computer to see whether those things
    are there and, if so, Based on this information, it writes a file called a `makefile`,
    which is a set of instructions that will tell the make command in the subsequent
    step how to set up specifically for your system configuration.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '+   2. Configure the program by typing ./configure and pressing ENTER.


    While you are running configure, you will see lots of mysterious things flowing
    through your Terminal window; this is essentially a running account of what is
    going on, each step of the way. This can take a bit of time, but don''t worry.
    As long as the mysterious text keeps flowing and you don''t get an error message
    at the very end of the process, all will be.


    When configure has done its thing, you will see your prompt again, and you can
    go on to the next step, which is the translation, or compilation, step. The make
    command reads the makefile created by configure to see how things needs to be
    set up on your machine. It then proceeds to call the compiler to translate the
    high-level source code into low-level, machine-readable files that can be installed
    in the subsequent step.


    +   3. To perform this translation, type make, and press ENTER.


    Again, you will be treated to even more mysterious text flowing through the window
    and a short wait, usually a tad longer than for the process. Once make has done
    its job and you see your prompt again, you are ready to install the program.


    Up to this point, you have not changed your system in any way. All the changes
    far have taken place in the xmahongj-3.7 only—your system is still as pure as
    you started. Of course, all that is going to go right now when you perform the
    final installation step.


    # # 9D-4: Installing and Running Xmahongj


    Now you''ve come to the last step in this part of the process, make install. Here
    you are telling your system to install what you have created, or compiled, in
    the make step. Note that installation takes place in permissions-protected parts
    of your system, you will need to add sudo to the command string to give yourself
    administrative privileges.


    To perform the installation, type sudo make install, and press ENTER. You will
    then be prompted for your password. After typing it and pressing ENTER, the installation
    process will take place. Once your Terminal brings you to your prompt, Xmahongj
    will be installed and ready to run. As a general rule, programs compiled from
    source do not automatically install as a launcher in your Applications menu; you
    must instead run them by command. Although you can run a program for the first
    time in the Run Application panellet, it is better to run the program for the
    first time by typing the command in your terminal window. If anything has gone
    amiss during installation, the Terminal will tell you what the problem is, whereas
    the Run Application method would leave you wondering what''s going on.


    To run Xmahongj, just type xmahongj in a Terminal window, and then press ENTER.
    If everything goes as it should, you can then create a launcher for Xmahongj in
    your Applications menu, on the GNOME Panel, or in a panel drawer.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# 9D-5: Cleaning Up and/or Uninstalling Xmahjongg


    Once you are done and everything seems to be working as it should, you would normally
    tidy things up in the Xmahjongg folder by getting rid of any unnecessary files.
    You can do this via the Terminal using the cmd command to go back into the Xmahjongg
    folder, typing *make clean*, and pressing ENTER.


    If you want to uninstall Xmahjongg, open a Terminal, go to the Xmahjongg folder
    by using the cmd command, type *sudo make uninstall*, and finally press ENTER.
    The routine is essentially the same for any applications installed in this way,
    though as you might imagine, uninstallation isn''t as smooth as a process that
    I''ve just described (and it''s definitely not as easy as it is the Ubuntu Software
    Center).


    The main reason for the un process being less than cooperative is that the uninstall
    routine requires you to keep the original project folder, which means you have
    to keep a bit of clutter you wouldn''t need to bother with. On top of this, some
    projects do not provide an uninstall routine at all. This means that you have
    to keep track of everything has been installed in your system and then remove
    each item using a series of *sudo* commands.


    All that negativity aside, go ahead, have some fun, and put your command skills
    to the test. You''ll have something to tell your grandchildren about the future.


    # Customizing the Terminal


    The Terminal is a very simple application in terms of looks, though you can spice
    things up a bit if you''re so inclined. Not only can you change the background
    and text colors in the Terminal, but you can even display one of your favorite
    photos as a background (as shown in Figure 9-19) or make the background transparent.


    To change the Terminal background, go to the Terminal, and select **Edit > Profiles**.
    When the Profiles window appears, select the profile you want to edit, which the
    first time out would be Default, and then click the **Edit button**. In the Editing
    window that appears, click the **Background image (Figure 9-20)**, and then navigate
    to the photo you want to use as your background by clicking the **Menu button
    next to the words Image file and then finding the file in the Select Background
    Image window. Once you''ve found the photo of your choice, click **Open**. You
    might find it difficult to see the text once your image appears in the Terminal.
    If so, try moving the slider under the words *Shade transparent* in the Editing
    Profile window. If that still doesn''t do the trick, click the **Colors** tab,
    deselect **Use colors from system theme**, and then try some of the preset Foreground
    and Background combinations from the menu button to the words **Built-in schemes**.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_226_0.png)


    Figure 19-9: A Terminal window with customized background and font colors


    ![](img/58abec7ac6c22ade6357fd77ea421da3_226_1.png)


    Figure 19-20: Customizing the Terminal window


    If you just want to make the background transparent, go back to the Background
