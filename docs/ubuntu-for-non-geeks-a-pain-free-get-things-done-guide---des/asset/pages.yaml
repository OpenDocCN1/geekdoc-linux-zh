- pgno: 391
  md: '# 20


    # # A COLONY OF PENGUINS


    The Ubuntu Community


    ![](img/58abec7ac6c22ade6357fd77ea421da3_391_0.png)


    One thing that really sets open source apart from the commercial software world
    is the importance placed on the community. This can include pretty much anyone
    who has anything to do with the software: the people who use it, the people who
    design it, the people who help others with problems . . . every last one of them
    is a valued community member.


    Consider the commercial software world, where things tend to be quite top-down.
    When you have a problem, you go to some company that provides you with support.
    This company probably also designed and sold you the software, and you probably
    played no part in that process—you’re the customer; they’re the vendor. Open source
    is different: Rather than one business aging, everyone patches it together and
    helps each other. People write software and fix faults because it helps other
    people and because they want to help. Everyone can play their part in offering
    feedback and suggestions and helping others with problems, and no one is in absolute
    control of the whole process. All in all, it’s much more democratic and, in my
    opinion, much more fun!'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'The Ubuntu community in particular is large, vibrant, and notoriously friendly.
    In this chapter, you''ll learn how to get the most out of it and how you can play
    your part by joining in and giving back (if you like).


    # Take Me to Your SABDFL


    Open source communities tend to have a well-defined structure, and Ubuntu is no
    exception. At the top of the pile is Ubuntu''s founder, Mark Shuttleworth, whom
    you met in Chapter 1. He''s the Self-Appointed Benevolent Dictator For Life (SABDFL),
    and according to http://www.ubuntu.com/community/ubuntistory/governance/, his
    role is to “provide clear leadership on difficult issues and set the pace for
    the project.” This doesn''t mean that he makes all of the plans and decisions—that''s
    more the job of the Technical Board, a group of senior Ubuntu contributors who
    figure out what shape the next Ubuntu release will take.


    There''s also the Community Council, which oversees the teams of contributors
    who make up the bulk of the project. There are lots of teams with all sorts of
    responsibilities: The Documentation Team writes the documentation for each release
    of Ubuntu, the Installer Team looks after the software used for installing Ubuntu,
    and so on. You can find a list of them at https://wiki.ubuntu.com/Teams/. Teams
    consist of members from all over the world (Figure 20-1), and people on the team
    may have all sorts of responsibilities: Developers, for example, are the people
    who write and update the software. Last, but certainly not least, are the millions
    of Ubuntu users worldwide who form the biggest part of the community. This group
    includes you!


    ![](img/58abec7ac6c22ade6357fd77ea421da3_392_0.png)


    Figure 20-1: A world map showing the locations of the members of the Ubuntu Documentation
    Team'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'Everyone who participates to abide by the Code of Conduct (http://www.ubuntu.com/community/conduct/),
    and people who make changes to the project (like developers) are asked to sign
    a copy of this document to show their commitment to the principles of Ubuntu.
    One final note: Ubuntu is a meritocracy, where the people who contributed most
    to the project get the biggest say. The most prolific contributors are awarded
    with Ubuntu membership (if they apply for it) and benefit from such perks as an
    ubuntu.com email address.


    # # Launchpad: Your Passport to the Ubuntu Community


    Every open source software project needs a place to call home. In Ubuntu’s case,
    this is Launchpad, a sort of project information website on steroids. Whether
    you want to report a problem, ask for help, design a new feature, or write your
    own program, Launchpad is where you go.


    Fire up Firefox, and browse to http://www.launchpad.net/. Unless you''ve signed
    up before, you''ll need to register for an account, so click **Log in** or **Register**
    at the top of the page, and answer the questions under the “Not registered?” heading.
    Hit **Register**, and check your email for details on how to finish signing up.
    When the message arrives, click the first link in your details, and click **Continue**
    on the page you sent to so you can start using your account.


