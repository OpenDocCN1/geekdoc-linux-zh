    # # Manually Configuring Printers


    If your printer isn''t automatically recognized, you can still set up manually.
    Here''s what you need to do:


    +   1. Select **System ▸ Administration ▸ Printing**. A Printing window will appear,
    showing the printers that have already been recognized and/or configured.

    2. Click the **Add** button, after which the system will show any new finds in
    the New printer (Figure 10-4).

    3. Click the entry for your printer in the left pane of window, and then click
    **Forward**.

    4. The system will begin searching for drivers for your printer and will identify
    the make of your printer in the next screen of the wizard. Check that the correct
    make is is selected, and then click **Forward**.

    5. On the next screen, your printer model should appear in the left pane, while
    the recommended driver will appear in the right pane (Figure 10-5). Click **Forward**.'
