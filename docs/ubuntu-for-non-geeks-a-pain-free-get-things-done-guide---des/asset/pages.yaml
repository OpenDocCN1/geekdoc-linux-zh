    # The Screen Looks Stretched or the Wrong Size


    If your screen doesn’t look quite right, the screen resolution has probably been
    detected incorrectly. To fix this problem, select System ▸ Preferences ▸ Monitors,
    and change the Resolution setting to match the default resolution of your screen
    (trial and error will suffice if you know what that is).'
