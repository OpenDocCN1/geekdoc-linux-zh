- pgno: 196
  md: '# What Is a Plan?


    I also mentioned that the results said I had no plan, so you may also be wondering
    that is all about. A .plan file is a small file kept in your home folder that
    other users see when they use the finger command on you. Traditionally, a .plan
    file contained information about where you were going to be or what you were working
    on. These days, however, most people use them to leave little messages, quotations,
    or whatever, may to see what happens after I add a .plan file to my home folder
    (see Figure 9-4).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_196_0.png)


    ```

    rg@rg-desktop:~

    File Edit View Terminal Help

    rg@rg-desktop:~$ finger

    Login: Name: Richard Grant

    Directory: /home :/bin/bash

    since Wed Apr 14 19:45 (EDT) on tty7 from :0

    23 hours idle

    since hours Apr 15 19:47 (EDT) on pts/1 from :0.0

    No mail.

    Plan:

    "I was the victim of a series of accidents. . . as we are all.

    rg@rg-desktop:~$

    ```


    You can now see my plan, which is a quotation from Kurt Vonnegut The Sirens of
    Titan (or Al Stewart''s song by the same name, for that matter), though you can
    put anything in your own. You will get the chance to create your own plan file
    in Project 9-SA, so if this all seems to you, just hang there.


    Before moving on, I should mention that you can also use the finger command to
    do a little domestic espionage of sorts. Let''s say your friend, Chris, has a
    user account on your machine. Chris, who wants your permission to go to the movies,
    claims to have worked hard at the computer all day writing a report for school.
    Having doubts, you could type finger chris to see what facts actually are. It
    may be bit underhanded and rotten, but it works. It works both ways; others can
    check on you as well. You might find it tricky when seeing it by the time you
    logged in to your graphical account (assuming you created such an account in Chapter
    8). You type finger graphika, and then press ENTER.


    You can even use the finger command to find out about people on other systems,
    providing their network''s finger service is active and you know their email address.
    Typing something like finger username@hostname.com would do the trick. It''s kind
    of cool also a bit spooky, I suppose.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# $pwd


    If you know who you are aren''t exactly where you are, pwd (print working directory)
    should come in handy. The pwd command tells you exactly where the Terminal is
    in your directory tree.


    Let''s say, for example, that my Terminal is in my personal home directory (which
    is actually called $rg in the system''s home directory (which is actually home
    and where all the user account directories are located) when I use the $pwd command;
    I would, after pressing the ENTER key, get /home/$rg printed to my Terminal. You
    should get similar results if you try it.


    NOTE The word print, in this case, has nothing to do with your printer; it means
    that the response will be printed to, or displayed in, the Terminal.


    # $df


    Another safe and easy, but much more useful, command, is $df (disk filesystem).
    The $df tells you how much disk space you have used, as well as how much space
    you still have available, on each of the partitions on your various mounted disks.
    It works by typing $df and then pressing ENTER. Your output should look something
    like that in Figure 9-5 (depending, of course, on the size of your mounted disks
    and how they are set up).


    ```

    rg@rg-desktop:~ $ df

    File Edit View Terminal Help

    Filesystem blocks Used Available% Mounted On

    /dev/sda1 231812120 0146580 21390228 3% /

    none 14879362 240 1487876 1% /dev/shm

    none 1483188 312 1483126 1% /var/run

    none 1483188 68 1483120 1% /var/lock

    none 1483188 6 1483182 0% /lib/init/rw

    rg@rg-desktop:~ _

    ```


    Figure 9-5: Output from the $df command


    As you will notice, the sizes are given in kilobytes (KB) rather than the gigabytes
    (GB) and megabytes (MB) you are probably more used to, but there is a way around
    this. Many commands accept a flag, or option, to fine-tune the command performs.
    These flags are written directly after the main command and are preceded by a
    space and a hyphen.


    In this case, you can try using the -h (human readable) flag to have your figures
    come out in the way you are most familiar with. Try by typing $df -h on the command
    line and pressing ENTER. The output should not appear in a more familiar format
    (see Figure 9-6).'
  merge: -1
  img_proc: true
- pgno: 198
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_198_0.png)


    # $ ls


    Another harmless but handy command is ls (list directory contents). The ls command
    shows what is in your current directory. The nongraphical equivalent of double-clicking
    a folder in Nautilus to see what is inside. Try it by typing `ls` and then pressing
    the ENTER key.


    If you''ve been following my commands so far, your results should list all of
    the folders in your home directory. You can also use the `-f` flag to show only
    the list of files in the folder also what is within the subfolders. Of course,
    you should have no subfolders in any of the folders you created in Chapters 7
    and 8, so you can hold off experimenting with this for a while. Instead, try typing
    `ls -a` to see your invisible, or `hidden`, files.


    # $ calendar


    I''ll let you experiment with this one on your own. Just type `calendar`, and
    press ENTER to see the somewhat interesting results.


    # $ exit


    The exit command is a simple exit that allows you to exit the Terminal. Just type
    `exit`, and press ENTER. The Terminal window will close.


    # Commands with Some Teeth


    The simple commands you have tried so far are all of the safe-and-sane, fire marshal-approved
    variety; they merely print information to your Terminal. Now you are going to
    get to some real tangible results from the commands you use. These commands are
    also essentially safe and sane if you follow my instructions.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# $ mkdir


    You have already learned how to create folders by means of menus and your mouse,
    you can also do this using the command line. The command is mkdir (directory),
    and it is as easy as pie to use (though I''ve never been quite sure how it is).


    To see how this command works and to work with the commands that follow, use the
    mkdir command now to create a folder called command_exp (for command experiments).
    All you have to do is type mkdir command_exp in a new Terminal window and press
    ENTER. The new folder should appear in your home folder, so go ahead and check
    to see whether it is there by clicking the icon on your desktop.


    OK, good, bra. Now let''s create another folder within new folder—subfolder, if
    you will. We''ll call this one sub, just type mkdir command_exp/sub, and press
    ENTER. You can now take a peek and see whether the subfolder appears within the
    command_exp folder, if you like.


    # $ mv


    The next command is the mv (move) command, but before you experiment with it,
    you need to create a dummy file—you need something to move, after all. You can
    do this by using another command—touch. To make the file—let''s call it expfile.txt—go
    to the Terminal, touch expfile.txt, and press ENTER. The new file will now appear
    in your home folder.


    To move the file you''ve created, you will use the mv command, of course. just
    mv expfile.txt command_exp/sub tells the system which file to move and where to
    move it to), and press ENTER. The file will now be in your subfolder.


    # $ cd


    Until now, you have been using the cd command, you can change your Terminal''s
    location to another folder. This is a very handy command that you will be using
    quite a lot when doing the projects in this book. To take it out for a spin, get
    inside the command_exp folder by typing cd command_exp and pressing ENTER. If
    you done this correctly, the prompt in your Terminal should now read username@computer:~/
    If so, you can pat yourself on the back.


    While you are there, you might as well try the ls command with the R (recursive)
    flag to see what you have. just ls -R, and press ENTER. Your Terminal should show
    you that you have a subfolder called sub and a file inside that subfolder called
    expfile.txt.


    That is all you really want to do in there for now, so to get back to your home
    directory, just type cd and press ENTER, which will take you back home, so to
    speak.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'For future reference, it is worth noting a couple of other cd command shortcuts.
    If you are within a subfolder of a subfolder and want to move back a step (/home/rg/peas/pudding
    to /home/rg/peas, for example), you can do so by typing cd .. (with a space between
    cd and ..) and pressing ENTER. You can also use cd - (with a space between cd
    and -) in order to get back to directory where you were previously (from /home/rg
    to /home/rg/peas/pudding, for example).


    # ## cp


    Being fickle, as humans are by nature, you might decide that not only do you want
    your expfile.txt in the subfolder that you also want a copy in your home directory,
    where it was in the first place. To copy expfile.txt, you can use the cp (copy)
    command.


    To do this, the command needs to know where the file you want to copy is, and
    where you want to copy it, which in this case is your home folder. Normally you
    would use cp command_exp/expfile.txt ~/username to do this, but if you recall
    my mention of it near the beginning of this chapter, that ~/ means the same thing
    and is an important tip to remember, because the tilde is frequently used in online
    instructions. Reducing wear and tear on the fingers is always a desirable goal,
    type the following command, and press ENTER:


    ```

    cp command_exp/sub/expfile.txt ~/

    ```


    Be sure to put a space between the file you are copying and its destination (in
    this case, expfile.txt and ~).

    Once you''ve done this, you should have two copies of expfile.txt, one in your
    home folder and one in your folder. Take a look to see the fruit of your endeavors.


    # ## rm


    When you were a kid, you may have well experienced the joy of building a castle
    out of LEGO bricks and then the greater joy of tearing the thing down (preferably
    by hurling D batteries at it). You will embark on a similar move. The first tool
    in this nostalgic endeavor is the rm (remove) command, with which you can trash
    files.


    The rm command, albeit very useful and easy to use, should be used with caution.
    Once you remove a file with this command, there is no going back—the file will
    not be placed in the Trash; it is for good future.


    To play it safe, let''s try the rm command by getting rid of new copy expfile.txt
    that we created in the home folder. The basic rm command consists of the command
    itself, rm, followed by the name of the file you want to remove. In this case,
    you want to remove the file called expfile.txt located in your home folder. Assuming
    your Terminal shows you to be home,'
  merge: -1
  img_proc: true
- pgno: 201
