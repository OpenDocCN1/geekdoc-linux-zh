- pgno: 421
  md: '# Ubuntu Doesn’t Play Any Sounds


    There are many reasons why Ubuntu might not be playing sounds. I''ll concentrate
    on some of the more basic issues in this section, but if none of this helps, you
    can always try the Ubuntu forums or IRC; both are discussed in detail in Chapter
    20.


    To start troubleshooting, find a sound on your computer and play it in Rhythmbox
    or the Totem Movie Player. (If you need, there''s a sample available in the /usr/share/example-content/Ubuntu_Free_Culture_Showcase
    folder, aptly called "Frustration Blues.") You need to have a sound file playing
    in the background so you can tell whether any of these settings has worked.


    If you are unable to start playing the file, Ubuntu may not have detected your
    sound card properly. Open a Terminal (Accessories > Terminal), type aplay -1 into
    it, and press ENTER. If the list of hardware devices is empty, your sound is not
    detected. You''ll definitely need to get some community support—see Chapter 20
    for more information on using the Ubuntu forums and IRC.


    Next, check that your speakers are turned on, turned up, and plugged into the
    correct socket on your computer (it''s often a light green color). Many times
    in the past I''ve plugged my speakers into the microphone socket and sat wondering
    why they were silent. When you''re confident that your speakers are OK, try the
    following steps:


    +   1. Click the speaker icon on the top panel, and select Sound Preferences from
    the menu that pops up. The Sound Preferences window will appear (Figure 21).


    +   2. Make sure that the Mute option is not checked and that the Output volume
    slider at the top of the window is pulled all the way to the right.


    +   3. Click the Applications tab, and make sure that none of the applications
    in the list is muted or set to a low volume.


    +   4. Click the Output tab, and make sure that the right connector is. If you''re
    not sure, try different connectors by trial and error until you get one that works.
    If none of them work, return this to its original setting (usually Analog Speakers).


    +   5. Click the Hardware tab, and choose a different device from the Profile
    option. Then repeat the previous steps, checking that nothing is muted at low
    volume and that the right output device is selected. Trial and error often works.


    If none of this helped, check out http://ubuntuforums.org/showthread/.php?t=205449/.
    It''s a pretty comprehensive guide to identifying sound problems, though it requires
    a lot of work in the Terminal. (See Chapter 9 if you need to refresh your memory
    on how the Terminal works.)'
  merge: -1
  img_proc: true
- pgno: 422
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_422_0.png)


    Figure 21-7: The Sound Preferences window


    # # My Microphone Doesn''t Work


    As long as sound is detected correctly by Ubuntu, any microphone with a standard
    audio jack connection (similar to the connector on headphones-) should work.


    To test your microphone, select System > Preferences > Sound to open the Sound
    Preferences window, and then go to the Input tab (Figure 21-8). There''ll be an
    Input level indicator, which should dance up and down when you make a noise. If
    nothing happens to the indicator when you make a noise, your microphone isn''t
    being picked up, so try some of the following tips.


    **Plug it in** Check that the microphone is plugged into the correct socket (it
    should be marked by a small microphone symbol and is often pink). Also, be aware
    that some cards can switch inputs and outputs between different sockets, so what
    you think the microphone socket might have actually been assigned to something
    else. In that case, try plugging the microphone into the other sockets.


    **Turn it up** Go back to the Input tab in the Sound Preferences window, and turn
    up the Input volume as high as it will if necessary. If your sound card or microphone
    has a volume control, make sure that that is turned up too.


    **Check that it''s not muted** Also on the Input tab, make sure that the Mute
    option next to the Input volume control is not checked.


    386  Chapter 2|1'
  merge: -1
  img_proc: true
- pgno: 423
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_423_0.png)


