- pgno: 259
  md: '# Setting Up IBus to Automatically Start Up When You Log In


    As you probably recall from when you first opened the IBus Preferences window,
    you have to start up IBus each time you log into your system. If you use IBus
    a lot and thus prefer foregoing this extra step, you can easily set up your system
    to start automatically when you log in. All you have to do is select System ▸
    Administration ▸ Language Support.


    In the Language tab, select ibus in the drop-down menu next to the words Keyboard
    input method system, as shown in Figure 11-16. When done, close the window. The
    next time you log in, IBus will automatically start up and be ready for action
    when you need to use it.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_259_0.png)


    > Figure 11-16: Setting up your system so that IBus automatically starts at login


    If IBus does not start automatically the next time you log in, try adding it to
    your system''s list of startup applications. To do this, select Preferences ▸
    Startup Applications, and in the Startup Applications window, click the Add button.
    Name it us, and in the Command box type /usr/bin/ibus-daemon. When done, click
    Add, and then close the Startup Applications Preferences window.


    # Viewing Your System in Another Language


    One of the many things that originally attracted me to the Linux world was being
    able to install language support for languages other than English and come up
    with a whole new system in a different language. On one of my machines, I have
    installed support for Chinese, Japanese, Swedish, and my default. With just a
    simple logout and a few clicks, I can log back in with an interface in a totally
    different language. I can have a Chinese, or Swedish system whenever I want.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'This is very useful if you''re in an environment where not everyone shares
    the same native language. At my former university, for example, where my Japanese
    and Chinese students sometimes used my computer, the additional language support
    allowed them to log in using their own language. It''s even pretty handy if you
    are studying a foreign language and want to give yourself as much exposure as
    possible to it. In all, it is a very useful feature.


    Taking advantage of this feature in the GNOME environment is very easy. Basically
    you have to do is install a group of support files for each language you want
    to add to your system. You can do this by going to the **System Administration
    > Language Support**, after which the Language window will appear. In that window,
    click the **Install/Remove Languages** button. In the Installed window that then,
    choose from the various languages available by checking the appropriate boxes.
    If you are installing language support for languages with complex writing systems,
    such as Japanese, please be sure to check the boxes next to the *Input methods
    and Extra fonts* (Figure 11-17).


    Once you have made your selections, click the **Changes** button. You will be
    prompted for your password at this point, so provide what is required, and the
    Language Support tool will begin downloading and then installing the support packages
    specified. Once it is done, you will be notified with the Left language.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_260_0.png)


    Figure 11-17: Selecting additional languages to install


    Once you have installed support for the additional languages you want, you can
    choose to have your system open in a different language environment by using the
    Language window (**System > Administration > Language Support**). In the Language
    tab of that window, select the language you want to use when you log in, and drag
    it to the top of the list (Figure 11-18). For languages with complex input systems,
    you can also select your method of choice, such as IBus, in the menu button next
    to the words **Keyboard input method system**. You can then close the window,
    log out, and log in again, after which your system will appear in the language
    you chose.


    24 Chapter 11'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Figure 11-18: Selecting the language in which you want your system to appear
    when you next log in


    If you prefer, you can instead make these login choices from the login screen.
    If you click your name in the list of users, a set of menus will appear in a panel
    at the bottom of the screen. Choose the language you want to use from the Language
    menu in that panel. If the language you want is not there and you know you installed
    it, select **Other**, and then select the language you are looking for in the
    window that appears. Once done, click **OK**, and then proceed to log in normally.


    Your startup process will then continue, and everything will progress as usual.
    Depending on what language you''ve chosen, your desktop appears will be in another
    linguistic world. Your menus, applications, and even the little windows that pop
    up when you run your mouse over an icon will be in the newly selected language
    (Figure 11-19).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_261_0.png)


    Figure 11-19: The Applications and Internet menus shown in Serbian'
  merge: -1
