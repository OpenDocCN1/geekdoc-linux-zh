    # Windows Won''t Boot


    If you installed Ubuntu in a dual-boot setup, you may find that the computer

    restarts displays an error message when you try to boot Windows instead of

    Ubuntu. Dual-boot Windows setups sometimes have a problem with hiberna-

    and disk checking, so try the following steps to see whether you can get

    it working again:


    +   1. Boot into Ubuntu, and mount your Windows partition (see Chapter 18

    for details on how to do this).


    +   2. Hidefile.sys (it should be in the top-level folder of your Windows

    partition, as shown in Figure 21-6), and rename it something like

    old_hibfile.sys. This will cause Windows to ignore all of the hibernation

    information it has stored.


    +   3. Restart your computer, and boot into Windows by selecting it from the

    GRUB boot menu. Ideally, Windows will now boot.'
