- pgno: 408
  md: 'Ubuntu Weekly Newsletter (https://wiki.ubuntu.com/UbuntuWeeklyNewsletter/):

    The UWN aims to provide an overview of the goings-on in the community

    week and typically includes notable Ubuntu news stories, interviews

    with developers, and updates on recent changes to software. It''s pitched

    at the geekier end of the spectrum.


    The Fridge (http://fridge.ubuntu.com/): The Fridge is a place where

    community can stick notes and updates on upcoming events.

    Interviews are sometimes posted here.


    Planet Ubuntu (http://planet.ubuntu.com/): This is where you can read

    t personal blogs of Ubuntu developers. Some of the posts are techn-

    ical, but if you''re interested in cutting-edge developments, this is where

    you need to go.


    News and opinion get passed around on microblogging services too.

    Subscribe to the #Ubuntu hashtag on Twitter, or join the Ubuntu group on

    Identity.ca (http://identi.ca/group/ubuntu/) to join in the tweeting, denting,
    or

    whatever you want to call it.


    # LoCos and LUGs


    So far, the whole Ubuntu community thing might seem a bit, well, virtual to

    you. Why shouldn''t it? Ubuntu is a very international venture, and commun-

    ic online is the most practical way of getting things done. Regardless, there
    are

    penty of opportunities to connect and meet other Ubuntu users in

    through Local Community (LoCo) teams and Linux User Groups (LUGs).

    These groups often have a membership with diverse computing skills, so they

    can be a good place to get to with Linux, among other things.


    LoCos tend to cover reasonably large geographic areas, normally on the

    scale of countries or states. As such, they tend to meet in person less

    regularly, many LoCos arrange Ubuntu-related events throughout the

    year, including "launch parties" around the time of Ubuntu release.

    You can find a list of LoCo teams at https://wiki.ubuntu.com/LoCoTeamList/

    LUGs are much more widespread than LoCos and tend to have a greater

    emphasis on meeting up. Typically, a LUG will hold regular meetings in a

    local community center (a pub, if you''re lucky) and organize tasks or

    other Linux-related activities. You can find your nearest LUG at http://

    www.ubuntu.org/groups/


    # Stickers and Other Goodies


    If you have a penchant for showing off your Ubuntu addiction, you''re

    in luck! Free stickers are available from Ubuntu-friendly computer manuf-

    turer system76, and they''re just great for replacing the unruly Windows

    logo that you probably have hiding somewhere on your computer''s case'
