    # Project 19B: Encrypting Your Files


    Protecting yourself against Internet nasties is all well and good, but what if
    someone gains physical access to your computer? Data theft is a serious business,
    so if you have any sensitive files, you should think about protecting them. A
    good way of doing this is to encrypt your sensitive files. Encryption is a way
    of taking a file and scrambling it in such a way that only a person with the right
    decryption key will be able to recover the original information. If someone tries
    to look the file while it''s still encrypted, they will all see a bunch of nonsense
    characters.


    # 19B-1: Creating an Encrypted Folder


    Ubuntu is a nice way of encrypting files, but you should take care when using
    it! The whole point of encrypting files is that no one but you will be able to
    access them, so there''s little chance of recovering them if you forget your password.
    Here are the steps you need to follow to get encrypted:


    +   1. Open the Ubuntu Software Center, and search for install cryptfs-utils.

    2. Once installation has completed, open a Terminal by clicking Applications >
    Accessories > Terminal, type cryptfs-setup-private, and press ENTER.

    3. You''ll be prompted for the password that you use to log into Ubuntu. Type
    it, and press ENTER. (The letters won''t show up on the screen, but that''s normal.)

    4. You''ll be asked to enter your mount passphrase (password). Pick some very
    memorable—there''s no recovering this password if you forget it! Press ENTER,
    retype the password (to make sure there were no typos), and press ENTER again.

    5. Close the Terminal window, log out of your user account, and log back again.

    6. When you log in, an Update information window will appear (Figure 19-8). Click
    Run this action now, type your login password into the window that appears (it
    will look as if nothing is being typed again), and press ENTER.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '7. Your password (also referred to as encryption passphrase) will be displayed
    on the screen. Make a careful note of it, press ENTER, and then click Close in
    the Update information window to continue logging in.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_385_0.png)


    ```

    ```nTo encrypt your home directory or "Private" folder, a strong passphrase has
    been automatically generated. Usually your directory is unlocked with your user
    password, but if you ever need to recover your directory, you will need this passphrase.
    Please print or write it down and store it in a safe location.

    If you click "Run this action", enter your login password at the "Passphrase"
    prompt and you can display your randomly generated passphrase.

    Otherwise, you will need to run "cryptfs-unwrap-passphrase" from the command line
    to retrieve and record your generated passphrase.

    Run this action now```

    ```


    Figure 19-8: Checking your encryption passphrase


    If you open your home folder, you will now see a folder called Private. Anything
    you put in this folder will be encrypted and will be safe from prying eyes. This
    is especially useful if your computer gets stolen—only someone with your password
    will be able to look at the files, and ideally the only person knows it is you!


    # 19B-2: Recovering Encrypted Files If Something Goes Wrong


    If you have problems with your computer and need to recover the files in the encrypted
    Private directory, use the following steps after you get Ubuntu up and running.
    If you don''t feel confident following these instructions, you should definitely
    ask for advice on the Ubuntu forums.


    +   1. Open a Terminal, type sudo mount -t cryptfs /home/username/.Private /home/username/Private,
    and press ENTER. You should, replace username with your own username.

    2. You''ll be asked for your passphrase. Type your mount passphrase (password),
    and press ENTER.

    3. Now you will be prompted a few times to make a section. Hit ENTER a few times
    until you''re given a WARNING message.

    4. Type yes, and press ENTER; then type no, and press ENTER.

    5. If you entered the right mount password, the Private folder will be decrypted,
    and you''ll be able to access your files. Copy them from folder to somewhere safe!'
