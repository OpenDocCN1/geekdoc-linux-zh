- pgno: 123
  md: '# Enter the complete APT line of the repository that you want to add as source


    The APT line includes the type, location and components of a repository, for example
    ''deb http://archive.ubuntu.com/ubuntu lucid main''.


    ```

    APT line: //archive.getdeb.net/ubuntu-lucid-getdeb apps

    ```


    Figure 6-7: Entering the APT line for the GetDeb repository


    ![](img/58abec7ac6c22ade6357fd77ea421da3_123_0.png)


    Figure 6-8: Checking the list of trusted software providers to see whether the
    GetDeb key is there


    +   5. Close the Software Sources window. You''ll be told that the information
    about available software is outdated, so click Reload to fetch the most recent
    package information. It might take a little while to download.

    6. Open the Ubuntu Software Center (or close it and then reopen it, if it was
    already open), and search for the program you wanted from the new repository.
    For instance, try searching for BookWrite, a fun little program to help you write
    your own novel. It should appear in the search results just like any other application,
