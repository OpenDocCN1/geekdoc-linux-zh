- pgno: 424
  md: 'program. Rhythmbox and the Totem Movie Player normally find the right codec
    for you (for example, see "Project 14A: Installing MP3 Support for Audio Apps"
    on page 262). However, if they fail, try installing the Ubuntu restricted extras
    package—this package contains a lot of extra codecs. Once it''s installed, close
    and re-open your audio/video file and see whether it plays. If not, you can try
    a different program, which might have the right codec built-in. Try installing
    the MPayer Media Player or VLC media player—both of these programs support a wide
    range of formats on YouTube.


    If you''re struggling to play a video on the Web (for example, see "Multimedia
    Plug-Ins" on page 62.


    Another reason for a file being unplayable is if it is damaged. If you downloaded
    the file, try downloading it again—occasionally, parts of the file are accidentally
    missed during the download process, repeating the download-load fix this.


    Finally, you might have a problem with your sound card. See "Ubuntu Doesn''t Play
    Any Sounds" on page 385 for advice.


    # Internet and Network Connection Problems


    If you haven''t been able to connect to the Internet (or a network), the most
    likely cause is that your wireless/network card has been detected correctly. Other
    people have probably had the problem with the same network card before, so it''s
    always a good idea to search online to whether you can find specific instructions
    on setting up your card. You''re not guaranteed to find something useful (or intelligible),
    however, I have provided some general instructions on diagnosing connection problems
    and installing network and wireless card drivers in this section.


    # Finding the Cause of a Connection Problem


    There are many different causes of connection problems that it can be difficult
    to know where to start. In this section, I''ve provided a few tips on how you
    can get more information to help you figure out your connection problem. Unfortunately,
    some of the information is technical, so you might find some of the results of
    these tests confusing. If that is the case, just make a note of the results you
    get. The information might be useful to someone in the forums or elsewhere, who
    could help you fix the problem.


    Do you have a connection to the Internet? Open Firefox, and try to visit a popular
    website, like http://www.google.com or http://www.bbc.co.uk/. If neither of those
    pages loads and you get a "Server not found" message or similar, you may not have
    a link to the Internet, or you might have a problem with Firefox. To check, open
    a Terminal (Applications > Accessories > Terminal), and then ping 209.85.227.106
    it to, followed by ENTER. This should ping Google''s servers; pinging a server
    is a way of checking whether your computer can communicate with it. If you receive
    a message starting with the text 64 bytes from (as shown in Figure 2-9), you have
    a working Internet connection. Press CTRL-C to stop pinging'
