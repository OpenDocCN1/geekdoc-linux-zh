- pgno: 432
  md: 'Click Apply; if everything looks OK, click Keep This Configuration. If your
    screen goes blank, don''t worry—just wait for 30 seconds, and the resolution will
    be returned to its original setting.


    If the correct resolution for your monitor isn''t available from the list, you
    might have to use a different display driver. See "Games/Compiz Don''t Work: Installing
    Accelerated Graphics Drivers" on page 394.


    # The Screen Is Blank


    One possible cause of a blank screen is that something went wrong with your graphics
    card or its drivers. Frankly, this is a reasonably rare occurrence, and it''s
    much more likely that something minor (and easy to fix) happened. Peruse the following
    tips before you start worrying about some sort of graphics scenario:


    +   **Check that the display cable is connected** Most computers have a separate
    monitor that plugs into the back of the computer. Look at the back of the monitor,
    and make sure both of the cables coming out of the back of are firmly plugged
    in both ends. You might also want to check that the display is switched on and
    that its power cable hasn''t fused.


    +   **Try to wake the computer** Your computer may have gone into a power-saving
    (sleep) mode, which you can wake it up by moving your mouse or pressing keys on
    the keyboard. If that doesn''t work, try pressing the power button on your computer
    once. This sometimes wakes up from their sleep too


    +   **Switch to a command line** The part of the Ubuntu''s responsible for displaying
    things on the screen is called X11, or just X Sometimes fails to start. To see
    whether this is the case, press CTRL-ALT-F2. You can type a login: prompt if everything
    X is working properly. You can type your username and password (press ENTER typing
    each one once) to access a command line, just like the Terminal you met in Chapter
    9. While you''re using the command line, try typing `sudo start` followed by ENTER,
    and type your password again if prompted. This will try to start X; it might work,
    or it might give you an error message telling you what the problem is. Alternatively,
    type `sudo reboot` to restart your computer. If you''re wondering what happened
    here, pressing CTRL-ALT-F2 switched to a different virtual terminal. Ubuntu starts
    a few virtual terminals and uses them for different things; pressing CTRL-ALT-F7
    will switch you back to the virtual used by X to display everything.


    +   **Restart the computer** Some computers occasionally start without turning
    on the graphics card or the monitor. (This tends to be more of a problem on older
    computers.) As a last resort, try turning the computer off and then again by pressing
    the power button. If the computer won''t turn off, hold down the power button
    for a few seconds until it does.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# Hard Disks and Storage Problems


    I never really understood how you could completely fill up your hard disk until
    I never bought a digital camera. If you have a similarly expensive disk usage
    habit, this section is for you. There are a few tips on how to free up some disk
    space, and worst-case scenario, how to deal with a completely full disk.


    # My Disk Is Almost Full


    If your disk is almost full, Ubuntu will pop up a warning message similar to the
    one in Figure 21-13. Click the Examine button to start the Disk Usage Analyzer—it
    will scan your disk and display a colored chart showing you are using most of
    the disk space. You can use this information to hunt down the files and folders
    that are taking up most of disk''s capacity. If you''re wondering exactly how
    much disk space you have left, select Administration ► System Monitor, and look
    on the File Systems tab to see how much space is left on each disk.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_433_0.png)


    Figure 21-13: A message warning you that your disk is almost full


    Apart from rooting through your home folder and deleting unwanted files, you can
    try a few other things to free up some disk space:


    **Empty your Trash** When you delete files, they get moved to the Trash folder
    in you change your mind about removing them. To empty the Trash folder (this permanently
    removing all the files in it), click the Trash icon on the bottom panel, and click
    the Empty Trash button in the Nautilus window that appears.


    **Clean unwanted packages** When you remove a package using the Ubuntu Software
    Center, it sometimes leaves other packages that were installed at the same time
    on the system, even they''re not needed anymore. To remove them, open a Terminal,
    type `sudo apt-get autoremove`, and then press ENTER. Type your password when
    prompted, and see whether there are any leftover packages that can be removed.
    If there are, press Y and then press ENTER to remove them.'
  merge: -1
  img_proc: true
- pgno: 434
  md: 'Empty the package cache When the Ubuntu Software Center installs a program,
    it keeps the package used to install it for a little in case it''s needed again.
    These cached files can take quite a bit of disk space, but it''s fine to delete
    them (the program won''t be uninstalled or anything like that). Open a Terminal,
    and type sudo apt-get clean, followed by ENTER. Type your password if prompted,
    and then press ENTER to empty the cache.


    # My Disk Is Completely Full


    If your hard disk is completely full, you may not be able to start Ubuntu at all,
    and all you''ll get a blank screen. If this happens, press CTRL-ALT-F2 to change
    to a Terminal login prompt. Type your username, followed by your password, followed
    by ENTER again, then try clearing some disk space by typing one of the commands
    recommended in "My Disk Is Almost Full" on page 397. You can also use the command
    to remove some files in your home folder, but be careful: There is no undo when
    using rm.


    Once you''ve cleared a little disk space, type sudo reboot to restart the computer.
    With any luck, there will be enough disk space for you to be able to log in.


    # I Can''t Delete a File


    The usual reason for not being able to delete a file is because you don''t have
    the right permissions to delete it (see Chapter 7 for an explanation of file permissions).
    Right-click a blank area of the folder that the file is stored in, choose Properties,
    and select the Permissions tab. If you are listed as the owner, make sure your
    Folder Access permissions are set to Create and delete files. Click Close, and
    then try to delete the file again.


    If you are not the owner of the folder, you''ll have to gain ownership of it before
    you can delete the file. Ask yourself, "Should I really be deleting someone else''s
    file?" Sometimes file permissions get messed up and so the file might be yours—in
    that case, it''s OK to delete it. If it''s someone else''s file, though, asking
    for first permission is a good idea, open a Terminal, and use the command to change
    the owner of the folder. Here''s how it: If I wanted to delete a file cats.jpg
    from the Pets folder in my Pictures, I would type sudo chown phil ~/Pictures/Pets,
    followed by the ENTER key (remember, ~ means "my home folder\ After typing your
    password and pressing ENTER again, I would become the owner of the Pets folder
    and delete cats.jpg as normal. Of course, you should substitute the name of the
    folder and your username in place of this mine to work for you.


    > Don''t use this method to delete system files (in other words, files that aren''t
    stored in the home folder) unless you''re sure you know what you''re doing. You
    don''t have permission to delete system files for a reason; you could really screw
    up your system if you remove something vital.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# Software Installation Problems


    Ubuntu''s software management tools tend to operate pretty smoothly these days.
    Nevertheless, I''ve included some troubleshooting tips for two or three problems
    that used to be common (but seem to be getting rarer with each release). If you''re
    having a problem with installing, removing, or updating packages, this section
    is for you.


    # I Get an Error About Unauthenticated Packages


    If you get an error message about unauthenticated packages when you try to install
    a program, try the following:


    +   Select System ► Administration ► Update Manager to open the Update Manager.


    +   Click the Check button, and enter your password if prompted. The package list
    will be updated, with all the files that are used to check whether your packages
    are “authentic”.


    +   When it has finished updating the package list, close the Update Manager,
    and try to install your program again.


    If you''re still getting the error message, you may have added a software repository
    without adding its GPG key. The GPG key is required to do the authentication that
    the error message is talking about. If this is the case, look at “Adding Extra
    Software Repositories” on page 86 for instructions how to add the GPG key for
    a repository.


    # I Get a dpkg error


    There are a couple of common reasons why you might get an error message related
    to dpkg when you try to install, or remove a software package.


    If you get an error saying E: Sub-process /usr/bin/dpkg returned an error code
    (1), you could have a broken package on your system. Here are some techniques
    you can use to fix a broken package:


    +   Select Application Accessories ► Terminal to open a Terminal.


    +   Use sudo apt-get install --fix-broken, and press ENTER. Type your password
    when prompted, and press ENTER again. This command looks for broken packages and
    tries to fix them.


    +   With any luck, this will fix the problem; try installing a package via the
    Ubuntu Software Center to see whether you get the dpkg error message.


    +   If you still get the error message, type sudo dpkg --configure into the Terminal,
    and press ENTER. This tries to fix half-installed packages if there are any.


    +   Try installing a package from the Ubuntu Software Center again. If you''re
    still getting an error message, ask for help on the Ubuntu forums.'
  merge: -1
  img_proc: true
- pgno: 436
  md: 'If you get an error message saying E: Could not lock /var/lib/dpkg/lock - open
    (11: Resource temporarily unavailable) or E: Unable to lock the administration
    directory (/var/lib/dpkg/), you are probably running more than one package manager
    (APT frontend) at the same time (see the note at the end of Chapter 6). For example,
    if you are installing a package using the apt-get command in a Terminal while
    simultaneously installing a program with the Ubuntu Software Center, you will
    get this error.


    Wait until one of the package managers finishes what it''s doing, and then close
    it and try to use the other one. If no other package managers are running, the
    Update Manager could be running in the background and causing the problem. Wait
    for a few minutes for the Update Manager to finish what it''s doing and then try
    again.


    # I Have a Broken Update


    If you update your computer using Update Manager but receive an error message
    saying that you have a broken update, try the instructions in "Get a dpkg error"
    on page 399 to try to fix the problem. If it doesn''t work, try asking the Ubuntu
    forums for help—there may be a bug in the package that was updated when the error
    occurred.


    # Common Problems with Applications


    Many applications are available for Ubuntu that it would be impossible to go through
    each one and point out what might possibly, some day, go wrong. Instead, in this
    section I''ve chosen some general advice on how to deal with misbehaving programs,
    plus a sneaky little on a particularly Firefox problem. If it is something specific
    that you need to handle, it''s not a bad idea to try looking at the help files
    for a given program. Select **Help > Contents** should get you to a manual for
    most software. Failing, a Google search often does the trick for me.


    # Firefox Says It''s Already Running


    When you exit Firefox, it sometimes takes a while to close itself down properly—the
    window will disappear, but Firefox could still be running somewhere in the murky
    depths of your computer. When you try to open Firefox again, you may receive a
    message that Firefox is running in the background, so you open a new window. This
    is no good, because you want a Firefox that you can see! If this happens, open
    a Terminal (**Applications > Terminal**), use **killall firefox**, and then press
    ENTER. (The command is sensitive, so be sure you''re typing in all lowercase.)
    This will force Firefox to shut down immediately. With done, try to open Firefox
    again, and the window should show up as normal. If it still isn''t working, try
    repeating the previous command one or two more times.'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# A Program Always Crashes


    If you have a program that keeps crashing, running it in a Terminal to see what''s
    going wrong. You''ll have to get the name of the command needed to run the program
    first—see "Reporting a Bug" on page 359 for information on how you can find it.
    Once you have the command, type it into the Terminal, and press ENTER. The program
    should run as normal, so keep it until it crashes. When it does, look at the Terminal
    to see whether there any clues as to what''s going wrong. Error messages in the
    Terminal can be quite cryptic, so you might need to ask someone on the forums
    or IRC (both of which are discussed in Chapter 20) if they know what it means.


    If the messages in the Terminal are no help, you should report a bug.

    Select "Bugs, Bugs, Glorious Bugs" on page 358 for details.


    # A Program Won''t Start


    If a program doesn''t start when you click your shortcut in the Applications menu,
    running it in the Terminal, as described in the previous section. There could
    be crashing soon after starting and might leave some information about the crash
    in the Terminal.


    # My Computer Is Running Slowly


    Certain tasks take up lots of computing power and cause your computer to run slowly.
    Burning a CD, installing software, and converting music files to a different format
    all tend to strain your system, so you shouldn''t be surprised if it feels a little
    sluggish when something like that is running. But what if your computer is running
    slowly even if you''re not running anything? You can investigate the cause of
    the slowdown by selecting **System Monitor to open the System Monitor**. Select
    the Resources tab, and check your CPU (processor) usage—if it''s around 100 percent,
    then a program running in the background is probably responsible for the problem
    (for example, the one in Figure 21-14). Choose the Processes tab, and click the
    % CPU column heading a couple of times until it has an "up" arrow next to it.
    This will show the list of programs in order of how much the processor they are
    using. The one that''s using all of the CPU should appear at the top of the list.


    It''s normal to wait a few minutes and see whether the program reduces its CPU
    usage by itself. After all, it could be some software running a scan or other
    maintenance operation. If it doesn''t go away, the program might have gotten stuck,
    select it and click End to close. Your system should return to its usual speed
    in a few seconds.


    If you didn''t notice high CPU usage on the Resources tab, then it''s possible
    that something is overtaxing your hard disk instead. Programs that do almost always
    finish what they''re doing within five or ten minutes, so you probably ride it
    out. If it persists, the easiest way of fixing the problem is by restarting the
    computer.'
  merge: -1
  img_proc: true
