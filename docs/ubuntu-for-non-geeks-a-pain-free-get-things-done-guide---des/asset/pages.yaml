    rg@rg-desktop:$ \n```\n\nFigure 9-3: Output from the finger command\n\nAs you\
    \ can, my login name is rg, my real name is Rickford Grant, my home directory\
    \ is /home/rg and I am using the Bash shell for typing my commands. I have been\
    \ logged in since Wednesday, April 14, at 19:59 Eastern daylight time (EDT), and\
    \ I've had my Terminal open since Thursday, April 15, at 19:26. I have no mail\
    \ or plan. It doesn't tell you my Social Security number or your maiden's name,\
    \ but it is pretty cool, don you think?\n\n# What Is a Shell?\n\nAs you noticed,\
    \ I mentioned that the results of the finger command showed I was using the Bash\
    \ shell, so you may be understandably wondering just what Bash is. Well, Bash\
    \ (Bourne Again Shell) is one of the shells that are used in Linux systems, and\
    \ (others, for that matter). A shell is a program that interprets the commands\
    \ you type into the Terminal and delivers them, so to speak, to your system so\
    \ that it can act upon them. I like to think of it as a command-handling subsystem,\
    \ for which the Terminal acts as a graphical."
