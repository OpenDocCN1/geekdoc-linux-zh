    **Choose the right device** Ubuntu sometimes detects sound cards as being more
    than one device. Click the **Hardware** tab in the Sound Preferences, and try
    choosing a different device from the list or a different profile for the device
    if you can. You could also try changing the device in the Choose a device for
    sound input list on the Input tab.


    **Choose the right input** Some sound cards have more than one microphone input.
    This is often the case on laptops, which might have a microphone socket and a
    built-in microphone. Check whether you''ve enabled the correct input by using
    the Connector option on the Input tab of the Sound Preferences window (Figure
    21-8).


    **Test a different program** The lack of sound from your microphone could be a
    problem with the program you''re using to record the sound rather than the way
    the microphone is set up. Try using a different program to test the microphone.
    The Sound Recorder (**Applications > Sound & Video > Sound Recorder**) is usually
    helpful.


    > NOTE *One program that suffers to particularly heavily from microphone-related
    problems like Skype. See https://help.ubuntu.com/community/Skype/ for some Skype-specific
    troubleshooting tips.*


    # I Can''t Play an Audio or Video File


    The most common reason for not being able to play an audio or video file is that
    you don''t have the necessary **codec** installed to play the file. A codec is
    a small piece of software that adds support for a given audio/video format into'
  merge: -1
