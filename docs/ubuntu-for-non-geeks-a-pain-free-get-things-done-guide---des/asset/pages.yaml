  md: '# Shooting Games


    Like many people, my first real 3D gaming experiences were with first-person shooter
    (FPS) games. In fact, I still have a soft spot for Doom, arguably the grandaddy
    of all FPSs. What could be fun than battling endless waves of hellish monsters
    in a military outpost on Mars? Nothing!


    Doom looks a little dated nowadays, but if you have similarly nostalgic thoughts
    of this classic game, you will be pleased to know that a version is available
    for Ubuntu. It''s called Freedoom (Figure 17-7), and you can install it from the
    Ubuntu Software Center (like all the games in this section).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_347_0.png)


    Figure 17-7: Freedoom


    The gameplay in Doom may have aged gracefully, but the graphics haven''t. If pixated
    blobs are failing to intimidate you, why not try something a little smoother,
    in the form of Nexuzis (Figure 17-8)? In terms of gameplay, Nexuzis feels quite
    similar to Unreal Tournament—you collect a wide array of weapons and power-ups
    as you run around dimly lit levels, shooting at opponents of varying levels of
    (artificial) intelligence. As with most deathmatchstyle games, the aim is to be
    the last one alive, but there are other game modes, like “capture the flag.” There''s
    also an online multiplayer option if you''re finding that the computer-controlled
    opponents aren''t providing enough of a challenge.


    Tremulous (Figure 17-9) is another popular open source FPS, although its gameplay
    also contains elements of real-time strategy. You play online, taking the side
    of either humans or aliens. As you work to destroy the opposing team, you build
    structures and collect power-ups to gain as much of an advantage as you can. It
    can get quite intense, so I recommend that you read the notes at http://www.tremulous.net/
    before you begin playing.'
