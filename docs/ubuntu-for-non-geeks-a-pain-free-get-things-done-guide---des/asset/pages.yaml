    # # Reading CDs and DVDs


    Dealing with CDs and DVDs in Ubuntu is quite simple, because everything is automatic.
    To read a CD or DVD with data on it, rather than music or video, place the disc
    in your drive, and a CD or DVD icon (look the same) will automatically appear
    on the desktop, and if you have a Nautilus window open, in the side pane. You
    can double-click either of those icons, after which the disc''s contents will
    appear in Nautilus. After that, you can copy files from the CD or DVD to your
    hard disk using standard drag-and-drop or copy-paste procedures.


    When you want to remove the CD or DVD, just right-click the desktop icon for that
    disc or the icon in the side pane, and then select **Eject** in the pop-up menu.
    The disc will be ejected automatically.


    # # Burning CDs and DVDs


    Burning CDs and DVDs in GNOME is extremely easy, as long as you have a CD or DVD
    burner hooked up to your computer! All you have to do is place a blank CD-Recordable
    (CD-R) or DVD (DVD-RW, DVD-R, and DVD+RW


    106 Chapter 7'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'are all supported by Ubuntu) in your drive, making sure to select a media

    format supported by your drive, and a Blank Disc window will appear

    what you want to do. Just click OK to Nautilus''s CD/DVD Creator

    dow, which you no doubt notice looks pretty similar to Nautilus win-

    dow, save for the colored band below the location bar and the Write to Disc

    button (Figure 7-11).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_143_0.png)


    Figure 7-11: A Nautilus CD/DVD Creator window with files ready to be burned to


    Once the CD/DVD Creator window is open, copying the files you want to

    burn to disc is pretty much a single drag-and-drop maneuver. Just open a new

    Nautilus window, and drag the files you want to burn from that window

    to the CD/DVD Creator window. If you prefer to do this in a decidedly

    Windows-esque fashion, you can select the files you want to transfer to disc

    clicking each file once, holding the CTRL key while doing so, for multiple

    selections. If you want to select multiple consecutive, then click each

    first file in the group, and hold SHIFT, and then click the last file in the

    group, automatically selecting all the files in. Once you''ve made your

    selections, release the CTRL or SHIFT key, right-click any of the highlighted

    files in the pop-up menu. After that, go back to the the CD/DVD

    Creator window, right-click any open space, and then click Paste in the pop-

    up menu.


    It is probably worth mentioning that the files you copy to the CD/DVD

    Creator are not actually copied. Instead, you will see in the CD/

    Creator window are essentially links pointing to the original files in

    the original locations. Thus, if you move one of the files from its original

    location before burning the contents of the CD/DVD Creator to

    disc, the link won''t work anymore and the file will not be copied onto the disc.

    This isn''t too much of a problem, since all of the other files will be put onto

    disc correctly, but it is something worth aware of.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Once you have copied all the files you want to burn, click the Write to Disc
    button, after which a window (shown in Figure 7-12) will appear, telling you,
    among other things, how many megabytes of files you can add to the disc (click
    Cancel to go back and add more if you want). Most people are happy to accept the
    default options (which are pretty sensitive), so that what remains is to choose
    a more interesting name for the disc, if you''d rather not leave anything change,
    you can adjust the speed at which your disc will be burned (a slower speed means
    fewer chances for errors) by clicking Properties and picking a slower speed.


    Once you are ready to burn the disc, just click the Burn button, and the CD/DVD
    Creator will do its work.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_144_0.png)


    Figure 7-12: Setting options before burning a CD or DVD


    > NOTE If you want to transfer the files to a Windows system, you may rename your
    files according to Windows naming conventions before you get down to the actual
    burning. In particular, avoid special characters and diacritics (such as umlauts
    and accents), and do not use the following characters, which are reserved for
    Windows system functions: / : ? * " < > |


    Once the burning begins, your progress will be shown in a new window, and when
    the job is done, you will be asked what you would like to do next. Assuming you
    are done with your disc burning for the day, click Eject and then Close.


    In case you are wondering, the discs you burn in Linux will be readable in other
    operating systems.


    # Dealing with CD-RWs


    CD-RWs are pretty much like CD-Rs except that they can be erased and written to
    again. They are also a bit more expensive than CD-Rs and, generally, cannot handle
    faster burning speeds.


    Using CD-RWs is much like working with CD-Rs. If the disc is blank, there is no
    difference in the process at all, which makes things quite simple. And, even if
    the CD-RW already has data on it that you want to replace with some-else, the
    process is only slightly different.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'One of these differences is that Nautilus will treat your CD-RW as a regular
    data disc rather than a blank one. This means that when you pop your disc into
    the drive, a regular Nautilus window will automatically open, rather than a CD/DVD
    Creator window.


    To write to the disc, you will need to switch from the Nautilus window to a CD/DVD
    Creator window, which is easily done by selecting **CD/DVD Creator** in the Go
    menu of Nautilus opened for a used disc. If you can''t see a CD/DVD Creator option,
    click **Go ▶ Location** and type `burn:///` to the location bar (followed by ENTER)
    instead. the disc will become a CD/DVD Creator window. Drag the files you want
    to burn to CD that; once you are ready to burn, click the **Write to Disc** button.


    As is the case with CD-Rs or DVDs, a CD/DVD Creator window will appear. When you
    click the **Burn** button in that window used with a CD-RW in the drive, however,
    a slight difference occurs. At this point, a new window like that in Figure 7-13
    will appear telling you that this disc has files already written on it. Click
    the **Blank Disc** button in that window, and the CD/DVD Creator will erase the
    files on the CD-RW and replace them with the new ones that you dragged to the
    CD/DVD Creator window. Not bad at all, eh?


    ![](img/58abec7ac6c22ade6357fd77ea421da3_145_0.png)


    Figure 7-13: Erasing a CD-RW with Nautilus


    # ### Burning ISO Images to Disc


    When you download Ubuntu or other Linux distributions from the Internet, you usually
    download them in the form of one or more disc images, which are commonly referred
    to as *ISOs* because such files end in the .iso extension. An ISO is an image
    of a CD''s file contents, which means that it is the CD minus the itself. To put
    it another way, if CDs have soul, the ISO would be the soul of a CD; take away
    the CD''s metal and plastic, and the remaining data would be an ISO.


    Because it is impossible to download a physical CD over the Internet, the bodeless
    ISOs are the next best thing. For example, to get a working copy of Ubuntu from
    the Web, you usually need to download an ISO, which you then burn onto a blank
    CD in order to give the images their bodies back to speak. In the process, you
    create the working installation disc that you need to install Ubuntu.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'Fortunately, burning an ISO to a disc is a pretty simple chore. Just open a
    Nautilus window, and locate the icon for the ISO file you want to burn disc. Right-click
    the ISO file, and in the pop-up menu that appears, select **Write to Disc**. Once
    you do this, the Write to Disc window will appear; just click the **Burn** button,
    and you''ll be on your way.


    # Creating Your Own ISO Images


    While the topic of ISOs, it is good to know that you can create ISOs of your own.
    Of course, you''re probably not going around creating your Linux distros, but
    you might come up with a set of files that you need to repeatedly burn disc to
    now or in the future. To create your ISO, follow the normal process for creating
    a CD, but when the Write to Disc (Figure 7-12) appears, select **Image File**
    in the drop-down menu below the words *Select a disc to write*. After, click *Properties*,
    which will open a new window asking for a filename for your new disc image. Give
    it a name, click **Close**, and hit the **Burn** button. In a very short time,
    you will have an ISO of your own.


    # Burning Multisession CDs


    If you are coming from the Windows environment, you are no doubt familiar with
    multisession CDs. These are CDs on which data is added one session at a time.
    For example, you burn a few files to disc today and add a few more to the disc
    tomorrow and a few more files the day after that. Each time you burn additional
    files to the same disc, you are adding a session, which explains the name *multisession*.
    If that explanation a bit obtuse, you can basically think of them working like
    floppy disks (albeit with considerably more capacity).


    Nautilus has basic support for multisession discs, but let''s try something a
    little more specialized this time: Brasero, which is a fully featured application
    that you can use for all of your disc-burning chores.


    You can run Brasero from the **Applications** menu by selecting **Sound & Video**
    ► **Brasero Disc Burn**. In the main Brasero window that opens, click the **Data
    project** button.


    To burn the first session to a CD, drag the files you want to burn into the Brasero
    window (Figure 7-14), or click the **Add** button (which looks like +) on the
    Brasero toolbar to browse for files.


    When you have all the files in place that you want to burn, put a blank disc into
    the drive, choose a name for the disc using the box at the bottom of the screen,
    and click the **Burn** button. A Properties window will appear. In that window,
    check the **Leave the disc open to add other files later** box (This is the step
    that sets up a multisession disc.). Once you''ve done that, click **Burn** to
    start the burning process. Brasero will eject the disc when the burn is complete.'
  merge: -1
  img_proc: true
