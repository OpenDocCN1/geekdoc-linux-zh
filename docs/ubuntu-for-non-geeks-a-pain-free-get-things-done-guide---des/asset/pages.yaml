- pgno: 313
  md: '# 15


    # PLUGGIN'' IN THE PENGUIN


    Working with Your iPod, iPhone, and Other Digital Media Devices


    ![](img/58abec7ac6c22ade6357fd77ea421da3_313_0.png)


    With all the talk in the previous chapter about ripping, encoding, and playing
    back audio files, you may be wondering whether Ubuntu will allow you to transfer
    any of those files to your digital media devices, such as your MP3 player or cell
    phone. Well, you will be happy to know that using your device on your Ubuntu system
    is quite easy—easier than ever before. No longer do you have to mess around with
    mount and unmount commands or edit system tables, and if you don''t know what
    I''m talking about, consider yourself lucky. Just plug in your device, and Ubuntu
    will do the rest.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Knowing Your Limits


    Assuming you downloaded and installed the recommended audio codecs mentioned in
    Chapter 14, you shouldn''t encounter any problems handling music or podcasts on
    your digital media device in Ubuntu. Even if you didn''t install them, Ubuntu
    automatically help you find the necessary items if you try to play a file it doesn''t
    support out of the box. Nevertheless, not all formats will work with equal degrees
    of comfort or success—it depends on your device and the file format''s compatibility
    with Ubuntu. As a general rule of thumb, most players will be able to handle MP3
    files and unlocked AAC (.m4a) files. Check your device''s manual for specifics
    about other file formats (or give them a try).


    As far as Ubuntu goes, it can work with all the file formats mentioned with the
    exception of locked AAC files, but you will learn how to deal with this in later
    chapter.


    Although working with your digital media devices in Ubuntu has become increasingly
    simple, it is still a relatively new procedure. It is always worth approaching
    things with a bit of caution by making sure to have backups of files on your device
    before working with Ubuntu.


    # Mounting and Ejecting Your iPod or iPhone


    Working with your iPod or iPhone is an extremely simple process. Basically, plug
    it in via a USB connector, and Ubuntu will mount the device so you can access
    it. An icon for your device will then appear on the desktop (Figure 15-1) and
    in the left pane of any Nautilus window you happen to have open. Two of those-do-you-want-me-to-do-with-this-stuff
    type of windows that appear when you insert a music CD or DVD into your drive
    or connect a digital camera to your machine via USB cable—one for the music and
    podcasts on your device and one for the photos (also shown in Figure 15-1)—will
    also appear, usually directly above the other. By default, Ubuntu will point you
    to Rhythbox for music-handling chores and to F-Spot for photo handling, both of
    which will be discussed later in the chapter. Click OK in each window to accept
    Ubuntu''s choices.


    To "eject" your iPod or iPhone, either right-click the desktop icon for the device
    and select Eject or, from a Nautilus window, click the eject button next to the
    icon for your device in the side pane of the window.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_315_0.png)


    # (Not) Auto-updating Your iPod or iPhone


    With the simple instructions as to how to use your iPod or iPhone with Ubuntu
    out of the way, it''s worth thinking about a couple of other things. Most important
    of these is the device''s auto-updating settings. When you enable auto-update
    on your iPod or iPhone via iTunes, the function is set up within the device itself.
    You can use your iPod in Windows, Mac OS, or Linux—or all of them interchangeably.
    If you set up your iPod to auto-update songs and playlists, however, you are leaving
    yourself open for trouble unless you have exactly the same music collection on
    all of your machines.


    Figure 15-1: Ubuntu instantly recognizes your iPod or iPhone.


    Pluggin'' in the Penguin 279'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'The reason for this is simple. Although iTunes allows you to add files to your
    iPod, it does not allow you to copy files from it. The auto-update feature is
    strictly a one-way street. means whenever you hook up your auto-update-enabled
    iPod to an iTunes-enabled computer, iTunes will automatically add the tracks in
    its library to your iPod; more frighteningly, it will remove any tracks from your
    iPod that are not present in that machine''s library. I learned this hard way
    when I took my loaded iPod to work and plugged it into my Windows box which completely
    emptied my iTunes library. When I brought the little Podcaster back home there
    with nothing at all on it, . . what wasn''t pretty?


    Make sure your iPod''s auto-update function works before bringing the device into
    the Linux world. To do this, connect your iPod to your Mac or Windows machine,
    and open iTunes. In the left pane of the iTunes window, click your iPod in the
    Devices section, and then in the Summary tab in the right pane, check the box
    to the words Manually manage music (or Manually manage music and videos in video-capable
    iPods), as shown in Figure 15-2. If you have a photo-capable device, repeat nearly
    the same process for your photos by clicking the Photos tab in the right pane
    and then unchecking the box next to the Sync from photos.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_316_0.png)


    Figure 15-2: Disabling the auto-update function on your iPhone/iPod in iTunes


    # # Working with Android-Based Phones


    Although the iPhone continues to be the king of the smartphone hill, it now has
    some strong competition from phones running Google''s Android operating system.
    Versatile, working with your Android-powered device in Ubuntu


    280 Chapter 15'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'is quite simple, and it''s only slightly different from working with an iPhone
    or iPod. Basically, this is the process:


    +   1. Connect your computer and Android-powered device using the USB cable that
    came with it.


    +   2. A “USB Connected” notification should appear on the notification bar at
    the top of your phone’s screen. Drag down the notification bar, and then touch
    USB Connected.


    +   3. A dialog box should appear on your phone asking you to either mount or
    cancel the connection. Touch Mount.


    NOTE Because there are different versions of the Android system in service today,
    it is possible the details of the process described here might be slightly different
    from that for your phone. You should still be able to follow along.


    As with the iPhone, iPod touch, and photo-capable iPods, two windows will then
    appear asking whether you want to run Ryhythmbox to handle your music files and
    F-Spot for your photo files. An icon for your device should then appear on your
    desktop and in the side pane of any Nautilus window (Figure 15-3).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_317_0.png)


    Figure 15-3: Ubuntu recognizes your Android-powered device and provides you with
    a number of ways to work with it.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'To "eject" your Android device, either right-click the desktop icon for the
    device and select Eject or, from a Nautilus window, click the eject button next
    to the icon for the device in the side pane of the window. On your phone, then
    drag the notification tray, and touch Turn off USB storage. In the dialog box
    that appears, touch Turn Off.


    # # Working with Other Digital Media Players and Cells Phones


    Although the iPod may be the most popular digital media player out there and the
    iPhone holds the crown in the smartphone market, they are by no means the only
    games in town. As I have already shown, Android-based phones are quite popular,
    and there are other devices, ranging from simple $15 MP3 players to the Linux-based
    Palm Pre cellular phone.


    How to work with these devices in Ubuntu can vary by device, but for the most
    part, they should work in the same manner as an iPod or Android device in the
    same manner as a USB device. The Palm Pre, which uses a Linux-based operating
    system, works in Ubuntu the same manner as the iPhone, while the $19 MP3 player
    I bought at Depot acts like a USB thumb drive. The simplest way to see how your
    device will work is connect it to your computer via a USB cable. If windows do
    not appear, open a Nautilus window to see whether you find an icon for the device.
    If so, you can work with your device using the tried-and-true drag-and-drop method.
    You can also use Rhythmbox to work with the audio files on your generic device
    by doing the following:


    +   - Create a Music folder if there isn''t one already on the device.

    - Right-click the Music folder, and select Open with Other Application.

    - In the Open window, select Rhythmbox (Figure 15-4), and then click Open.


    # # Managing Your Audio Device’s Files with Rhythmbox


    As I''ve already mentioned, Rhythmbox is set as the default application for iPhones,
    iPods, Android-powered devices, and one way or another, any other music players
    in Ubuntu. Once Rhythmbox is up and running, things work pretty much as they do
    in iTunes.


    +   - To view the contents of your iPod or other device, click the icon for the
    device in the left pane of the window. The contents of the device will then appear
    in the right pane of the window.

    - To copy a song from your library to your device, just click Music in the Library
    section of the left pane, then drag the artists, albums, or single tracks you
    want from the right pane to your device’s icon in the left pane. The copy progress
    will be shown in a progress bar in the lower-right corner of the Rhythmbox window
    (Figure 15-5).'
  merge: -1
  img_proc: true
