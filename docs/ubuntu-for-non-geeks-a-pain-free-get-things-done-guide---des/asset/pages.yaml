    # Setting Up Printers Connected Over a Network


    If you want to use a printer connected via a home or office network, just follow
    these steps:


    +   1. Select **System ▸ Administration ▸ Printing**. A Printing window will appear,
    showing the printers that have already been recognized and/or configured.


    +   2. Click the **Add** button, after which the New Printer window will appear.


    +   3. Select **Network Printer ▸ Windows Printer via SAMBA** in the left pane
    of that window by clicking that entry once, and then click the **Browse** button
    in the top-right corner of the page.


    +   4. In the SMB Browser window that appears (Figure 10-6), navigate your way
    to the printer you want to use, and then click **OK**.


    +   5. Once you''re back in the New Printer window, click the **Forward** button.


    +   6. Now continue from Step 5 in "Manually Configuring Printers" on page 196.


