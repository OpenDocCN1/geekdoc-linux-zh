- pgno: 71
  md: '# 3A-5: Adding a Drawer to the Panel


    One of the features I like about the GNOME panel is the drawer. The drawer is
    a little app that saves on panel space by letting you add drop-panels, in which
    you can place launchers that you do not have room to place launchers elsewhere.
    These drawers are also handy locations to place launchers for applications that
    you must normally run by typing a command in a Terminal or via the Launch Application,
    such as those you compile yourself from source code or are run via scripts. You''ll
    learn how to do this in Chapter 9. Of course, you can put anything you want in
    a drawer, including frequently used files or over menus.


    Adding a drawer to your panel is very easy and is basically the procedure that
    you use to add the Force Quit button to the panel. Here is all you need to do:


    +   1. Right-click any open space on the top panel.

    2. From the pop-up menu, select Add to Panel, after which the Add to Panel will
    appear.

    3. In that window, click Drawer to highlight it, and then click the Add button.
    Close the window by, quite logically, clicking Close.


    # 3A-6: Adding Program launchers to the Drawer


    The drawer you''ve just added is empty at this stage, so let''s pick it to use
    by adding launchers for three useful, yet less glamorous, system utilities. These
    are System Monitor, which allows you to view your computer''s running applications
    and processes, memory and CPU usage, storage device usage; Terminal, which you
    can type and execute commands (slightly geeky, but very useful); and the Ubuntu
    Software Center, which you can use to download and install applications.


    Here''s what you need to do:


    +   1. Right-click the drawer applet in the panel, and select Add to Drawer in
    the pop-up menu.

    2. In the Add Drawer window that appears (and looks and behaves the same as the
    Add to Panel window), select Application Launcher, and then click the Forward
    button that appears.

    3. On the next screen, click the small + next to Accessories, scroll down and
    click Terminal to select it, and click the Add button. The launcher will now be
    loaded into the drawer.

    4. Next, scroll down and click the small arrow next to Administration.

    5. Scroll down within that category until you find Ubuntu Software Center, click
    it to select, and then click Add.

    6. Finally, add a launcher for the System Monitor by scrolling down to the System
    Tools category, clicking the small + next to that category, selecting System Monitor
    from that group, and then clicking Add. You can now close the Add to Drawer window.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'The three launchers should now be loaded in the drawer, so click the drawer
    to sneak a peek. Yours should look the same as mine in Figure 3-11.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_72_0.png)


    # 3A-7: Adding the Entire Contents of a Menu to the Panel


    If you find that you use the applications in a particular submenu of your Applications,
    Places, or System menus a lot, you can opt to add the entire menu to the panel
    as a menu or as a drawer in a manner similar to the one you used in Project 3A-3''s
    "Method 2" section on page 32. To learn how to do this, let''s add the Games submenu
    to the Sound & Video submenu as a drawer. Here is what you need to do:


    +   - Add the Games menu to the panel by selecting Applications > Games and right-clicking
    any of the launchers within that submenu.

    - In the pop-up menu that appears, select Entire menu Add this to the panel.

    - Add the Sound & Video submenu as a drawer by selecting Applications > Sound
    & Video and then right-clicking any of the launchers you find there.

    - In the pop-up menu, select Entire menu Add this as drawer to panel.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_72_1.png)


    You should now have two new launchers on your panel with icons matching those
    found in the Applications menu next to the relevant items. As you can see in Figure
    3-12, these two icons act somewhat differently.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 3A-8: Moving Things Around on the Panel


    Well, now you''ve added all you are going to be adding to the panel in this chapter.
    It may seem a little messy up there now, so let''s do a bit of housekeeping moving
    things around. You will try to group things together somewhat theoretically as
    to make them easier to deal with.


    Fortunately, you can move panel launchers easily with the pop-up menu, and then
    dragging the launcher to the spot you want to place it. Once the launcher is where
    you want to, click the launcher once, and it will stay there.


    To get some practice with this moving business, let''s move the launchers, menus,
    and drawers you added by placing them in the following order, from left to right:
    Applications, Places, System, Firefox, Help, OpenOffice.org Writer, OpenOffice.org
    Calc, Sound & Video, Games, Drawer. Place the remaining launchers towards the
    right end of the panel, to the left of the Network manager or any others that
    appear automatically, in the following left-to-right order: Eyes, Wanda (Fish),
    Force Quit. Finally, place the Run Application itself, midway between the two
    clusters of launchers. When you''ve made all your changes, your panel should look
    pretty like in Figure 3-13.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_73_0.png)


    # More Panel Fun


    In addition to the basic customization you did in Project 3A, you can do a lot
    more to change the look and feel of your panel. Of course, you can remove any
    of your launchers, drawers, or menus by right-clicking the item in question and
    selecting Remove From Panel in the pop-up menu, but there are still more options.
    Most of these are available by right-clicking any open space in the panel and
    then selecting Properties, which will open the Panel window.


    From this window you can change the position of the panel, its size, its color,
    or make it transparent—very cool. You can also set the panel so that it will automatically
    disappear when you are not using it and have it reappear when you bring your mouse
    cursor into the area where the panel normally resides. Don''t feel afraid to play
    around—that''s half the fun!'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Project 3B: Manipulating Menus


    Now that you have learned about some of the cool and useful things you can do
    with your panel, let''s now move on to the topic of menus. A very nice feature
    of GNOME is that it allows you to edit its menus. You can add launchers, remove
    items, move items, and even change the icons that appear within them. In all,
    you have a lot of control over things, but for this project, you''ll limit the
    work to two of these areas: changing icons and moving menu items.


    # 3B-1: Changing Icons Within Menus


    As no doubt recall, one of the problems with the OpenOffice.org Writer and Calc
    launchers you added to the panel was that they shared similar icons. If you see
    Applications Office, you will see that the icons for the various OpenOffice.org
    modules, although not the same, are also a bit similar. To remedy this state of
    affairs, you will change these icons to the set used for the two panel launchers
    in Project 3A-4. In this case, just follow these steps:


    +   1. Right-click the Applications menu and select Edit Menu, or go to the System
    menu and select Preferences Main Menu.

    2. In the menu editor window that appears (Figure 3-14), click Office in the left
    pane. The contents of that menu will then appear in the right pane.

    3. In the right pane of the window, click OpenOffice.org Word Processor once,
    and then click the Properties button. A Launcher Properties window will appear.

    4. In the name box of that window, first shorten the name of the launcher down
    to Writer or Word Processor or whatever naming works for you.

    5. Next, click the Icon button (it doesn''t say Icon on it). Using the method
    described in "Project 3A-4: Changing Panel Launcher" on page 33, navigate to /usr/share/hicolor/48x48/apps
    to choose an icon that then appears.

    6. Scroll down and click openofficeorg3-writer.png, and click Open. The new icon
    should now appear in the Launcher Properties window. Click Close, and you will
    be able to see the change in the menu editor window.

    8. Repeat the process for OpenOffice.org Spreadsheet, and if you like, just be
    sure to choose an appropriate name and select the appropriate icon for each (openofficeorg3-calc.png
    for Spreadsheet and openofficeorg3-impress.png for Presentation, for example).
    Once you''re done, leave the editor window open to continue work on Project 3B-2.'
  merge: -1
  img_proc: true
