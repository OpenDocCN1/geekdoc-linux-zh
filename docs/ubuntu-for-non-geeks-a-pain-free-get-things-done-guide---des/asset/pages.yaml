- pgno: 217
  md: 'NOTE If you have any trouble downloading Briscola in this way, you can also
    download it from the site for this book: http://www.edgy-penguins.org/UFNG/


    In your Terminal window, you will see get in action as it connects to the site
    where Briscola is stored and then downloads the file. When it''s done, you will
    find the Briscola tarball in your home folder.


    # 9C-2: Extracting the Briscola Tarball and Renaming the Briscola Folder


    Extracting the Briscola tarball is essentially the same process as for ppWings;
    however, Briscola is already packaged within its own folder, you won''t have to
    create a special folder for it.


    Although I am sure you now know the drill, I''ll tell you again. Just open a Terminal
    window, typing the following command, and press ENTER:


    ```

    tar -xzf briscola*.

    ```


    A new folder, Briscola-4.1, will now appear in your home folder with all the Briscola
    files in it. To make things easier to deal with in the future, lets shorten the
    name of the folder to simplify briscola. You already know how to do this via the
    right-click method, but this time let''s do it via the command line. To do this,
    you, perhaps surprisingly, the mv command followed by the name of the file whose
    you are going to change, followed by the new name of the file.


    Give it a go by typing the following command and pressing ENTER:


    ```

    mv briscola-4.1 briscola

    ```


    # 9C-3: Preparing the Briscola Script


    Most applications that come in tarball form include a README file, which includes
    information on what you need to install and use the application. If you double-click
    the README file in the briscola folder in Nautilus, you will see that the "HOW
    TO START" section tells you to adjust the first line of the briscola.tk script
    to point to your Tk, and to adjust the second line of the script to the directory
    where the various Briscola files are located.


    To perform the adjustments as instructed in the README file, just follow these
    steps:


    +   Find the Tk script, called Wish, by typing wish in the Terminal window and
    pressing ENTER, and then note the location given on a piece of paper. You may
    get a number of locations in your search results, the one you want is /usr/bin/wish.


    +   Direct the Terminal to the briscola folder by typing cd briscola and pressing
    ENTER.'
