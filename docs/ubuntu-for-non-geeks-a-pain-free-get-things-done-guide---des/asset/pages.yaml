- pgno: 247
  md: '# 11


    # # POLYGLOT PENGINS


    *Linux Speaks Your Language*


    ![](img/58abec7ac6c22ade6357fd77ea421da3_247_0.png)


    These days, almost all operating systems are multilingual, or at least capable
    of becoming so. This is true of Linux as well.


    Just open your web browser and, without performing any special installations,
    you can read pages in any European language, including those with Cyrillic alphabets,
    such as Russian. You can even view pages in Chinese, Japanese, Thai, Arabic, and
    Hebrew, to name a few.


    But the multilingual capabilities of Linux are much greater than this, and the
    way that it handles multilingual matters makes it quite easy to take advantage
    of these capabilities. As you will soon see, you can even set up your system to
    give you a totally foreign language environment, allowing you to'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'function completely in the language of your choice. Add to the ever-expanding
    number of free programs available for language study, and you have a truly meaningful
    language-learning tool.


    # Read-Only Support


    If you want to be able to read web pages or documents in a foreign language, you
    don''t need to install any additional language support except in some rare cases.
    From the get-go, you will be able to view documents in just about any language
    you happen to throw at your system—it doesn''t matter if it''s Swedish, Italian,
    Chinese, Arabic, Hebrew, Russian, Vietnamese, Armenian, or Thai. You will be able
    to read whatever you are linguistically capable of reading (see Figure 11-1 for
    an example).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_248_0.png)


    Figure 11-1: A Japanese page displayed in Firefox


    Firefox automatically recognizes the language in which a web page is written and
    displays the page correctly. Sometimes, however, the author of the page may neglect
    to include the character coding for page in the HTML, in which case Firefox, not
    knowing that the page is prepared in another language, will very often open it
    in the default language of your system. The result is a page in which you see
    nothing but odd combinations of symbols and letters that have no meaning. In this
    case, changing the character coding in Firefox to the language encoding you believe
    the page to be in. Some languages employ more than one encoding scheme, so if
    you''re not sure, give it a try. You may make choices by going to the Firefox
    View menu and selecting Character Encoding. From the submenu, you can select the
    appropriate coding for the language of that page.


    212 Chapter 11'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Typing Nonstandard Characters


    Typing characters that are not standard in English, such as é, ç, ß, ø, æ, and
    ã can be done quite easily in Linux without any modifications. In most situations,
    you can do this by using the Character Map utility included in your system, which
    can be found at Applications > Accessories > Character Map. Upon running Character
    Map, a window like the one in Figure 11-2 will appear.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_249_0.png)


    Figure 11-2: Inputting characters with the Character Map utility


    To input the character you want, just select the language or character set in
    the left pane of the window, and in the right pane, double-click the character
    you want to input. The character will appear in the little input box next to the
    Text to copy at the bottom of the window. Just click the Copy button, and paste
    the character wherever you want to place it.


    OpenOffice offers a method of its own that you can use. Click Insert in the menu
    bar, and then select Special Character. A selection window will open, and you
    can select the character you want. Once you''ve done that, click the OK button,
    and the character will appear in your document, after which the selection window
    will close by itself. Double-clicking the character you want will also accomplish
    the same thing.


    # Using the Compose Key Option


    If you need to add an accent or umlaut only once in a while and don''t feel particularly
    like opening an application or going to a special menu to do so, using the compose
    key option for your keyboard is a good way to go. Basically this means you use
    one of the lesser-used keys on your keyboard in conjunction with six symbols (
    ''`'', ''\'''', ''-'', ''"'', ''^'' ) to help in the creation, so to speak, of
    accented characters.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'Before you can use this feature, you have to select which key you want to use
    as your compose key. For this example, I''ll use the right ALT key, since most
    people don''t use it much. Here''s what you need to do:


    +   1. Go to the **System** menu, and select **Preferences > Keyboard**.

    2. In the Keyboard Preferences window that appears, click the **Layouts** tab,
    and click the **Options** button.

    3. In the Keyboard Layout Options window, click the + next to the words *Compose
    key position*.

    4. Check the box next to the key you want to use as your compose key (Figure 11-3).
    Then close the Keyboard Layout Options window and the Keyboard Preferences window.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_250_0.png)


    Figure 11-3: Selecting your compose key


    Once you''ve done that, for example, you can use your compose key to type characters.
    Let''s say, that you wanted to type an unalted *u* (that is, *ü*). While pressing
    the right ALT key (or whatever key you selected as your compose key), you would
    press ". Then you would release the right ALT key, press u, and voilà—you''d have
    yourself an *ü*! Here are some more examples:


    +   right ALT + then a

    right ALT + , then c

    right ALT + ~ then e

    right ALT + ~ then n

    right ALT + ^ then o'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'NOTE These sequences are based on U.S. keyboard layouts. Combinations for other
    layouts may differ.


    # Adding Keyboard Layouts


    If you type in a particular foreign language, it might be more convenient to add
    a new keyboard layout for the language or languages you use. For example, if you
    type in Swedish and thus use the characters å, ä, and ö regularly, using the appropriate
    keyboard layout would be easier than repeatedly using the Character Map. This
    is even more true if you type in Greek, Serbian, Georgian, or any other language
    that uses a completely different alphabet. Of course, you will have to familiarize
    yourself with the keyboard layout, or keymap, for each language you choose, but
    this is a relatively easy task.


    To add foreign language keyboard layouts to your system''s repertoire, here''s
    all you need to do:


    +   1. Select System Preferences Keyboard.

    2. In the Keyboard Preferences window, click the Layouts button.

    3. Once in the Layouts tab, click the Add

    4. In the Layout window that appears, select the keyboard layout you want to add,
    and when done, click Add (Figure 11-4)

    5. Repeat Steps 3-4 to add other layouts (up to a maximum of four layouts).

    6. When done, your window should look something like Figure 11-5 with slightly
    different keyboard layout selections. Click Close to complete the process.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_251_0.png)


    Figure 11-4: Selecting and viewing foreign-language keymaps


    Polyglot Penguins 215'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Keyboard Preferences


    ![](img/58abec7ac6c22ade6357fd77ea421da3_252_0.png)


    Figure 11-5: Viewing the active keyboard layouts on your system


    After closing the Keyboard Preferences window, a keyboard layout indicator appears
    in the upper-right corner of the top panel. The letters USA or GBr will appear,
    indicating that you are currently using your English language markup. If you click
    indicator, you will toggle between any of the other layouts you''ve activated.
    If you are not sure where the keys are located in your current map, you can get
    help by right-clicking the layout and selecting **Show Current Layout** in the
    drop-down menu, which after a map of the new layout will appear in a separate
    window. The keymap in that window will be hard to make out, so you will probably
    need to expand the window by dragging it by any of its corners. You can also print
    a copy of the layout from this window by clicking the **Print** button.


    If you want to choose a single keyboard layout to replace your current one (such
    as British English instead of American English or German instead of Spanish),
    you can do so from the Keyboard Preferences window. Simply add the keyboard layout
    you want to use, and remove any additional layouts by clicking each one and clicking
    the **Remove** button.


    # Chinese, Japanese, and Korean Input


    For some European languages (and many other alphabet-based non-European languages),
    pressing a letter on the keyboard simply prints that letter to the screen. However,
    Chinese, Japanese, and Korean require a kind of conversion process that is handled
    by a special application (actually a set of applications)'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'called an input method editor (IME). Each of these languages has its own IME,
    and each is quite different because of the basic differences in the three writing
    systems.


    # Chinese


    Although most people (at least those in the linguistic know) would think that
    Chinese would be the most complicated system, because the writing system consists
    of thousands of characters, it is in the simplest. The Chinese IME simply takes
    the Romanized keyboard input, as pinyin, and converts into Chinese characters,
    or Hanzi. For the IME, it is essentially a simple dictionary lookup task—big dictionary.
    Simple IME. In the event that there is more than one character for the pinyin
    input, a list of possible candidates will appear, and the user can then select
    the appropriate character from that list. More recent Chinese IMEs also have predictive
    capabilities, by which they judge what you are trying to type on the basis of
    what you''ve typed so far (Figure 11-6). Although these more “intelligent” IMEs
    can be a bit squirrel to use at first, they prove to be rather handy once you
    get the hang of things.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_253_0.png)


    +   1. 音

    2. 会

    3. 回

    4. 序

    5. 理

    6. 玄

    7. 货

    8. 辉

    9. 輝


    Figure 11-6: Chinese IMEs can predict what you''re going to write . . . kind of.


    # Japanese


    The Japanese IME has a considerably more complicated task to perform, because
    it has three writing systems to deal with: Kanji (ideographic characters borrowed
    long ago from China), hiragana (the patho-alphabetic system used mainly for tense
    and case endings), and katakana (mainly used for words borrowed from other languages).
    Still, the standard input method for Japanese is primarily via the standard Roman
    keyboard layout, plus a few extra function keys. Thus, typing in Japanese is a
    two-step process where the IME first converts the Romanized text into hiragana
    as it is typed and then converts it to appropriate Kanji, or.


    You can see an example of these systems in Figure 11-7. In the first line, the
    IME has already converted the Romanized input on the fly. It has converted rinakkusdenihongnyuryokugikamodekimas
    (which means You can input Japanese'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'in Linux) to hiragana. When a line of hiragana is highlighted, it means that
    the line has not yet been converted that. In the second line, however, the user
    has subsequently pressed the spacebar, which caused the IME to convert the hiragana
    string into the appropriate Kanji, hiragana, and kana elements. The first word,
    *Linux*, has been converted to katakana text, because it is a borrowed word, while
    *Japanese input* has been converted to Kanji; the rest stays in hiragana.


    りなっくすでほんごににゅうょくができます。


    リナックスで日本語入力ができます。


    Figure 11-7: IME conversions while typing in Japanese


    # Korean


    The job of the Korean IME is again quite different from the Chinese and Japanese
    IMEs, because the language is written in a very different way. Korean is written
    entirely in alphabetical letters, called *Hangul*, or in a combination of Hangul
    and ideographic characters borrowed from Chinese *Hanja*. While the Hanja characters
    are essentially the same as their Chinese and Japanese counterparts, Hanzi and
    Kanji, the Korean phonetic alphabet, Hangul, has its own unique appearance, as
    you can see in the Korean word for Korea, *Hangul(k)*, in Figure 11-8.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_254_0.png)


    Figure 11-8: Korea [Hangul] written horizontally in Hangul


    This seems simple; however, the representation is not quite correct, because Korean
    is quite unique in the way that its alphabetical characters are put to the page.
    Unlike the usual side-by-side positioning of hiragana, katakana, and most other
    languages written with an alphabet, Hangul letters are grouped in pairs, triplets,
    or quadruplets, which are written, as a general rule, clockwise. The IME, therefore,
    must take the input (usually based on a Korean alphabetical keyboard layout) while
    it is being typed, and must adjust the size, spacing, and positioning of each
    of the letters as it puts them into clusters (see Figure 11-9).'
  merge: -1
  img_proc: true
- pgno: 255
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_255_0.png)


    Figure 11-9: An example of the clustering process in the Korean IME


    # # Project 11: Setting Up Asian-Language Support


    So, what do you do if, for example, you want to be able to type Chinese, Japanese,
    Korean, Hindi, Thai, or Nepali while still in your usual English environment?
    What if you want to be able to type all of those languages in the same document?
    Can you do it?


    You bet.

    There are actually several ways of going about this, but the default method in
    Ubuntu is the easy-to-use Intelligent Input Bus (IBus). IBus supports most Asian
    languages, including Chinese, Japanese, and it provides a number of input methods
    for many of them.


    # ## 11-1: Selecting Input Method Modules


    The first thing you will need to use IBus is select the appropriate input modules
    for the language(s) you want to input. To do this, go to the System menu, select
    **Preferences > IBus Preferences**. A window will then appear asking whether you
    would like to start the IBus daemon. Click **Yes**, after yet another window may
    appear telling you what to do if you cannot get IBus to work. Click **OK** in
    that window. (Fortuously, these two windows will appear only when you first start
    IBus.) The IBus Preferences window will then appear. Click the **Input Method**
    tab.


    > A daemon is a program that runs in the background, unknown to us, providing
    a system with added functionality. In the case of IBus, that added functionality
    is the ability to input complex character sets.


    On that click, select the **Select input method** drop-down button, select the
    input method you require, and then click **Add**. The input method you just added
    will then appear in the main pane of the window beneath the default method, English.
    Repeat the process for any other input methods you want to add. When done, your
    window should look like a variation on what you see in Figure 11-10, depending
    on which languages you actually select. When you’re done making your selection,
    click the **Close** button.


    Polyglot Penguins 219'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_256_0.png)


    Figure 11-10: Selecting complex input methods in IBus


    As you notice when selecting input methods, some languages, such as Chinese, have
    a number of methods to choose from (as shown in Figure 11-11). To give you some
    quick help, I will suggest appropriate choices for the student or casual user
    of Chinese, Japanese, and Korean.


    +   - For simplified Chinese standard pinyin input support, select **Chinese –
    py**.

    - For traditional Chinese zhuyin/Bopomofo input support, select **Chinese – bopomofo**.

    - For Japanese input support, select **Japanese – anthy**.

    - For Korean input based on the standard English keyboard, select **Korean – romaja**.


    For those studying or teaching Chinese, you might also want to select **Chinese
    – pinyin**, which allows you to easily type the Chinese words in Roman letters
    with tone markings, as shown in Figure 11-12. Just type each character phonetically
    in pinyin followed by the character’s tone number (type zhong2 for China, for
    example), and then the diacritical tone marks will appear above the Romanized
    output. Very handy.


    220 Chapter 11'
  merge: -1
  img_proc: true
- pgno: 257
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_257_0.png)


    Figure 11-11: Some languages have more than one input method to choose from.


    # # Nánníwān hǎo dīāng


    Figure 11-12: IBus lets you show pinyin character readings with tone markings.


    # ## 11-2: Typing Asian Languages with IBus


    Once you have chosen your input methods and closed the IBus Preferences window,
    a small icon that looks like a mini keyboard will appear to the right of the volume
    controller in the top panel. If you click that panel, you will see all the available
    input methods listed in the drop-down menu that appears'
  merge: -1
  img_proc: true
- pgno: 258
  md: '(as shown in Figure 11-13). To put this menu to use, you''ll need to open an
    application that allows text input. To try things, let''s use gedit (Applications
    Accessories > gedit Text Editor).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_258_0.png)


    Figure 11-13: Accessing language input methods from the IBus panel applet


    Once gedit appears, select the input method you want to use from the IBus panel
    applet. An input palette for the language you''ve selected will appear in the
    bottom-right corner of your desktop (Figure 11-14). You can now start typing in
    gedit using the input method you''ve selected.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_258_1.png)


    Figure 11-14: The IBus input palette


    To switch from one input method to another, there are three options. First, you
    can go to the IBus panel applet and change methods from the menu options. Second,
    you can make the change of the current input method will reveal a menu from which
    you can choose an alternative method (Figure 11-15). Finally, you can switch between
    methods with hotkey combinations: CTRL-spacebar toggles IBus on off, while ALT-SHIFT-L
    switches you from one input method to the next.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_258_2.png)


    Figure 11-15: Switching between input methods from the IBus input palette'
