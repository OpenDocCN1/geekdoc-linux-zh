    # 3B-2: Changing the Order of Icons Within Menus


    While we have everything open to the Office menu, let''s deal with what I consider
    to be another problem: the order of the items in the menu. It just doesn''t make
    sense to me to have what is arguably the most used office application, your word
    processor, you down there at the bottom of the menu.


    Remedy this situation is easy. Just click the OpenOffice.org Word Processor icon
    in the right pane of the menu editor. Then click the Move Up button on the right
    side of the window as many times as necessary until the Word Processor icon is
    right at the top of the list.


    Now that your word processor is up at the top of the menu, the other OpenOffice.org
    modules seem a bit out of place at the bottom, so you might well move the other
    OpenOffice.org modules near the top by using the same method.


    While I''m being logical and, why not make things even better by getting the Evolution
    launcher out of the Office menu and moving it over to the Internet, which seems
    a far more natural place for it to be? If you agree and want to hide this entry
    of Evolution, just check the box next to its name. The name of entry should then
    switch to italic typeface, indicating that the item in question will not be visible
    in the drop-down menu. Once you''re done, your menu editor window should look
    something like mine in Figure 3-15. If all seems fine to you, click Close and
    then select Applications to check out the results.'
