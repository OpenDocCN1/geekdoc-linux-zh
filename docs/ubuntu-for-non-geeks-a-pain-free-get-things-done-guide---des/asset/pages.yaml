    # Problems with the Display and Graphics Cards


    Recently, Ubuntu has been doing an excellent job of detecting graphics cards,
    so it''s unlikely that you''ll be left staring at a blank screen. Things aren''t
    guaranteed to turn out, however. This section covers problems as getting 3D acceleration
    support (if it''s missing) and adjusting your screen resolution (if it''s looking
    weird). Just in case, there''s something to help you with a dreaded blank screen
    too.


    # Games/Compiz Don''t Work: Installing Accelerated Graphics Drivers


    If you can''t get Compiz or a certain game to work, you may need to install some
    accelerated graphics drivers. This is because only basic drivers (which can''t
    handle fancy effects and 3D games) are installed for some graphics cards by default,
    due to the lack of availability of suitable open source alternatives. Accelerated
    drivers exist for your card, you can install the more powerful (but possibly less
    open source) drivers by selecting System Administration ► Hardware Drivers, selecting
    the graphics driver from the list, and then clicking Activate to install it. Once
    it''s installed, restart the computer, and the new driver should be enabled.


    You can directly download Linux drivers from some manufacturers. These need to
    be updated more regularly than the ones that come with Ubuntu, and they may have
    some extra features too. The next couple of sections cover how to get these drivers
    for the two biggest manufacturers, ATI and Nvidia.


    # ATI Cards


    +   1. Go to http://support.amd.com/us/gpdownload/Pages/index.aspx/, and select
    Linux x86 from the list on the left side of the page.

    2. Choose the type of card you have from the next list, and choose the model/series
    of your card from the list to that.

    3. Click GO!, and you''ll be taken to a download page for the driver. Scroll down
    to the bottom of the page, and click Download.

    4. When prompted, click Save File to download the driver.

    5. When the download finishes, find the driver file. It will probably be saved
    in your Downloads folder, and its name should end with .run.'
