- pgno: 159
  md: '# 8


    # # DRESSING UP THE BIRD


    Customizing the Look and Feel of Your System


    ![](img/58abec7ac6c22ade6357fd77ea421da3_159_0.png)


    Before entering the world of Linux, I had used just about every desktop operating
    system around. Despite the differences among all, however, one thing that I eventually
    suffered from each case was a kind of visual boredom. I suppose you might call
    it GUI fatigue. It wasn''t that I was tired of using a graphical interface; it
    was just that I couldn''t help get sick of looking at the same old icons, window
    borders, and color schemes. Of course, there were some changes that could be made,
    but it wasn''t possible to get around the basic look and feel without add-ons
    that demanded a price in terms of performance.


    One of the features of Linux that pleased me to no end, and continues to do, is
    that users can drastically change the look of things. I don''t mean just the icons
    and backgrounds but *everything*, including the actual window borders and controls.
    Add to the variety of graphical desktop environments and window managers available
    for Linux, and you have a totally customizable system. Is it any wonder that there
    are so many more Linux desktop screenshots'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'on the Web for any other system? If you don''t believe me, just take a look
    at a site dedicated to Linux screenshots, http://www.linuxmx.org/, and click the
    Screenshots link.


    You may not be fickle as I am in terms of the look and feel of your system, but
    you can learn to use and enjoy all the graphical customization power that Linux
    offers you as you work through this chapter.


    # Project 8A: Creating a New User Account


    If you are reluctant to alter the look of your current setup, you can create a
    new user account and experiment with making the changes in this chapter when logged
    in to the new account. If you opt to this route, your regular home environment
    will remain untouched, look-and-feel customizations that are performed in one
    user account do not affect other user accounts. When you are all done with the
    project, you can then simply delete the new user account. Either way, it''s up
    to you.


    # 8A-1: Creating the Account


    To set up a new user account, follow these steps:


    +   Select **System ► Administration ► Users and Groups.**

    Once the Users Settings appears, click **Add**. If asked for your password, type
    it into the box, and click **Authenticate**.

    In the Create New User window appears (Figure 8-1), type a new username in the
    Short Name box; I''m using *graphika* for my example. In the Name field, you can
    type whatever you like; I''m using *Graphics Layer*.nClick **OK** to add the new
    user. Password will appear.

    The Set password by hand should be selected. Type a password for the new user;
    you should put numbers and letters in the password to make it difficult to guess.
    Retype the password in the Confirmation box to confirm your choice, and then click
    **OK**.

    You''ll be back to the Users Settings window (Figure 8-2). Select the new *graphika*
    account from the list on the left of, the window, and then click the **Change**
    button next to where it says Account type.

    In the window that appears, give yourself the ability to install software and
    perform other administrative tasks in the new account by selecting Administrator.
    Click **OK** to return to the main Users Settings window.

    Click **OK**, and close the Users Settings window. The new account should be ready
    to use.


    Normally, the privilege to install and perform other system-wide changes (Administrator)
    is not selected by default on new user accounts, since you probably don''t want
    your kids, workmates, or anyone else with their own user account on your computer
    installing all sorts of weird stuff and screwing up your system settings. We need
    it here because we''re going to be installing things, though.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_161_0.png)


    Figure 8-1: Creating a new user account


    ![](img/58abec7ac6c22ade6357fd77ea421da3_161_1.png)


    Figure 8-2: The new user account displayed in the Users Settings window


    # 8A-2: Logging In to Your New Account


    To use this account, click the power button at the far right of the top panel,
    and click click Log Out. A countdown will appear, but you can skip that; just
    click the Log Out button. After a few seconds, you will be back at the login screen.
    Click your username in that window, type the password for the account, and press
    ENTER. You will soon be at the new, untouched desktop of your just-created user.


    When you log out of a user account, all the programs you have running will be
    closed—if you were planning to use a different account for only a few minutes,
    it can be annoying to have to open everything when you get


    Dressing Up The Bird 125'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'back to the original account. Fortunately, there''s an alternative: You can
    tem-porarily switch users. Switching users differs from the logout/login approach,

    in you remain logged in to your original account while you log in to your

    account (while someone else with an account on your computer logs

    in theirs). This route keeps all the windows and applications you have

    open. These windows will not appear in the account you are switching to, but

    they will be there, conveniently waiting for you, when you switch back to

    the account from whence came.


    This is a good way to decide if you plan to be switching back and forth

    bween your two accounts. It is also a good approach when, say, your child

    eeds to log in to their account for a moment to do a quick email check, burn

    a CD to play on the beach, or print a file for school. When your child

    is done, you can quickly get back to what you were doing without having

    to reopen files, web pages, or whatever else you happened to be dealing with

    at the time of the switch.


    You can switch quite easily by clicking the power button on the top

    GNOME panel and selecting the account you want to switch. After a

    few seconds you will be asked for the password for the account you selected,

    ype it into the box, and press the ENTER key. After that, you will be at

    desktop of the selected account.


    To get back to your original user account after going the switch-user

    route, just click the power button, click the username from which you came,

    and after a few seconds of darkness, a window will appear into which you

    type the password of the account you are returning to. Type your

    password, click Unlock, and you will be back at your original desktop,

    everything is as you left last, with open windows. And Pretty cool.


    # Project 8B: Customizing Your Desktop Environment


    Whichever user account you decided to play with, you are now ready fornaction.
    By the time we get to the end of the process, you will have created

    a much wider and gaudier desktop environment than you''ve ever seen before.

    All of this is in good fun, of course, and when you are done, you should

    able to completely and confidently customize things the way you want on

    y. So, let''s go.


    # 8B-1: Adding Emblems to Folders


    One of the coolest things about Nautilus is that it allows you to add little

    folder-icons called emblems. These emblems can graphically remind you

    what each folder is, and they''re not only for folders—you can add them to

    files too. The look of these emblems also changes when you change your desktktop
    themes, so you''re in more visual excitement later in this chapter. For

    now, let''s learn how to use them by adding one to the Documents folder.

    Open your home folder, right-click Documents, and then select Properties

    t pop-up menu. When the Properties window appears, click the Emblems'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'tab, and scroll down until you see the emblem called *Personal* (Figure 8-3).
    Click the checkbox next to it, and then click the **Close** button. The emblem
    should now appear on your folder.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_163_0.png)


    Figure 8-3: Choosing emblems for your folders


    Now, for additional practice, try adding the Sound emblem to your **Music** folder.
    Just use the same steps as before, and substitute the appropriate items and entries.
    When you''re finished, you should have a *Music* folder that is surrounded by
    musical notes—one is the emblem, the other is the folder''s default icon. Not
    all folders have default icons, so that''s when emblems really come in handy.


    # 8B-2: Setting Window Backgrounds (and Emblems Again)


    Once you''ve added those emblems, your folders should look a bit spunkier (and
    you''ll make these emblems look spunkier later in the chapter). Nevertheless,
    the background of the Nautilus window is still flat and white. You need not stand
    for that if you don''t want; you can change it as well. To do so, just go to your
    home window, click the **Edit** menu, and select **Backgrounds and Emblems**.
    The Backgrounds and Emblems window will then appear (see Figure 8–4).'
  merge: -1
