    Ripper, or the lesser known figure out Toghen DVD Rip. You might be interested
    in DVD95 and the more highly configurable K9copy, which are the Linux world''s
    answer to DVDShrink. These applications allow you to rip dual-layer DVDs (DVD9)
    and compress the output so that fit on a single-layer blank DVD (DVD5). For creating
    your own DVDs from scratch (like you would with iDVD), a few applications are
    worth considering: DVD Styler, JDVDAuthor, and Bonombo DVD.


