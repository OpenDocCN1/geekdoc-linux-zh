  md: '# # THE MANGA GUIDE TO PHYSICS


    ## System and Network Monitoring

    BY HIDE NITTA, KEITA TAKATSUKU, AND TREND-PRO CO, LTD.


    The Manga Guide to Physics teaches readers the fundamentals of physics through
    authentic Japanese manga. Megumi, an all-star tennis player, is struggling to
    pass her physics class. Luckily for her, she befriends Ryota, a physics genius
    geek who uses real-world examples to help her understand classical mechanics.
    Readers follow along with Megumi as she learns about the physics of everyday objects
    like skates, slingshots, breaking cars, and atoms. As she progresses, Megumi begins
    to master even the toughest concepts of physics, like momentum and impulse, parabolic
    motion, and acceleration. The The Manga Guide to Physics combines a whimsical
    story with real educational content so that readers will quickly master the core
    concepts of physics with a minimum of frustration.


    MAY 2009, 248 pp., $19.95

