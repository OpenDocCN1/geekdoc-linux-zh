    # Tabled Shell Sessions in the Terminal


    To wrap things in this chapter, I thought I might mention one particularly convenient
    feature of the GNOME Terminal: tabs. Just as you can view multiple web pages in
    Firefox web browser window tabs allow you to have more than one session running
    at the same time without having more Terminal windows (see Figure 9-21). This
