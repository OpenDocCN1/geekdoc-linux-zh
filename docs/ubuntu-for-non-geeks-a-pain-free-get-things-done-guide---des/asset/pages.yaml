    In some cases, things will be even easier, particularly if you installed your
    printer driver yourself by means of the installer that came packaged with the
    driver. In many cases, the driver will provide its own progress window that will
    appear whenever you print a document. If so, you can simply click the Cancel button
    (or equivalent) in that window to cancel your ink.


    > In some cases, you may have to clear your printer after canceling a print job.
    You can do this by turning your printer off, waiting a few seconds, and then turning
    it on again.


    # Checking Ink Levels and Other Printer Maintenance Tasks


    Printer ink (and toner) has a knack of vanishing at a rate of knots, so it is
    natural to check up how many your cartridges are left. You might also run into
    problems with the printer, such as streaks on printouts or jagged lines that should
    be straight, so it might be necessary to clean or align the printer heads too.
    Unfortunately, there is no one simple method of doing this since every make of
    printer handles it differently. I''ll just mention a few ways you can access these
    options for the most common brands:


    +   **HPLIP** This works for Hewlett-Packard printers. Open the Ubuntu Software
    Center, and install HPLIP Toolbox. Select **System > Preferences > HPLIP Toolbox**
    to run it, and use the Supplies tab to check ink levels and the Actions tab to
    clean and align your cartridges.


    +   **Inkblob** This works for a number of Epson, Canon, and HP printers—check
    http://inkblob.sourceforge.net/#supported/ to see whether your ink is supported.
    Open the Ubuntu Software Center, install Inkblob, and select **Applications >
    System Tools > Inkblob** to clean your levels.


    +   **escputil** This works for some Epson printers and is worth a try if Inkblob
    doesn''t support your model. Open the Ubuntu Software Center, and install *escputil*.
    Then, open a Terminal by selecting **Accessories > Terminal**. Type `escputil
    -i` (don''t forget the space) and hit ENTER to display the ink levels. To clean
    the print head, type *escputil* -c.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'If you have no luck with these utilities or if your printer''s make isn''t
    listed, you might still be able to access ink levels and maintenance functions
    using the manufacturer''s own Linux driver, if one exists. Also, some newer printers
    allow you to check ink levels and align and clean cartridges using controls on
    the printer. When in doubt, check your printer''s manual.


    # # Scanners


    Scanners are extremely useful and about cheap a peripheral device as you can get.
    They allow you to take images or pages of text and input them, in digital form,
    into your computer—in the same way as you would duplicate a document on a copy
    machine.


    Even though scanners have been around for a relatively long time, support for
    Linux is a bit spotty. Fortunately, this is changing for the better with every
    new Linux release. The backend—the hidden part of your system that handles scanner
    recognition and support in Linux—is called Sane. If you are wondering whether
    Linux will be able to recognize your scanner or if you are trying to figure out
    type of scanner to buy, you can visit the Sane website at http://www.sane-project.org/sane-mfgs.html.


    There will be able to see whether your scanner is supported or get tips about
    what scanner to buy. The page is pretty long, so you might want to use the Find
    function in your web browser (select Edit ▸ Firefox) to search for your scanner.
    As I have mentioned, you can also try the Ubuntu forums (https://www.ubuntuforums.org/)
    and for Ubuntu-specific recommendations.


    # # Scanning, No Questions Asked, with Simple Scan


    Simple Scan is a new addition to Ubuntu''s line-up of default applications, and
    it certainly lives up to its name—it doesn''t take many clicks to get a document
    from scanner to bed computer. Run Simple Scan, make sure your scanner is connected
    and switched on, then select Applications ▸ Graphics ▸ Simple Scan. If you get
    a warning saying that no scanners were detected, skip to “Unrecognized Scanners”
    on page 207.


    Assuming that your scanner has been recognized, you''ll be presented with the
    screen in 10-11.


    It''s pretty easy from here—select the type of document you''re scanning (Text
    or Photo) from the drop-down menu to Scan the Button (the menu''s icon is a small
    down-arrow), and then click Scan. Your scanner will roar into action, and after
    a short wait, you''ll be presented with a preview of the picture or document you
    placed on the scanner. You can crop and rotate the image using the options in
    the Page menu or by right-clicking the preview. When you''re happy with your scan,
    select Document ▸ Save to finish up.


    One little tip: To change the resolution of your scans, select Document ▸ Preferences,
    and tweak the settings in the window that appears. Higher resolutions take longer
    to scan and take up more disk space, but lower resolutions can look terrible,
    so choose wisely!


    Chapter 10'
  merge: -1
  img_proc: true
- pgno: 241
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_241_0.png)


    # ## Not-So-Simple Scanning with XSane


    Simple Scan will be able to handle most of your scanning needs, but if you have
    some particularly complex scanning that you need to do, you can use XSane. XSane
    is a real monster of a scanning program, packed full of professional features
    and fine-tuning options (see Figure 10-12). Search for and install XSane using
    the Ubuntu Software Center, and then select Applications > Graphics > XSane Image
    Scanner. XSane will perform a search for an attached scanner. If it finds one,
    it will start up. If it doesn’t, a window will appear that says “No devices available.”
    If this happens, click the Close button, and skip to “Unrecognized Scanners” on
    page 207.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_241_1.png)'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'To actually scan something, place your photo or document on the scanner bed,
    and click the Acquire preview button in the bottom-left corner of the XSane preview.
    Once the preview appears, use the selection tools to define the exact area you
    want to scan, and choose your resolution and color depth settings in the main
    XSane window. When everything is ready, click the Scan button. Your scanned image
    will then appear in a Viewer window (as shown in Figure 10-13).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_242_0.png)


    Figure 10-13: The results of your scan are displayed in a separate Viewer window.


    In that way, you can perform minor tweaks of the scanned image using the buttons
    and menu items provided and then save the image by selecting File > Save image.


    If you want to convert a scanned document into a text file, you''ll first have
    to install the Gocr package using the Ubuntu Software Center. Gocr performs a
    process called optical character recognition, which tries to figure out what text
    the image contains by recognizing the shapes of individual letters. (It only works
    for typed text, not handwriting.)


    Once Gocr is installed, scan your document into XSane as before. This time, click
    the second button from the left (the one that says ABCDEF) before you Save image,
    and you will find that you can save the file as a text document as well. The text
    recognition isn''t perfect, so make sure you go over the text file to look for
    typos afterward.


    XSane has plenty more tricks up its sleeve—visit http://www.xsane.org/doc/xsane-xsane-doc.html
    for information on what features are available and how to use them.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Unrecognized Scanners


    If you receive a message telling you that no scanners were detected when you opening
    a scanner program, your scanner may not have been recognized by Ubuntu. Here are
    a few things you can try to work around:


    +   - Install the libane-extras package using the Ubuntu Software Center. It contains
    a handful of scanner drivers that aren''t installed by default. Once it''s installed,
    try opening your scanning program again to see whether it worked.

    - Press ALT-F2 to open the Run application; then type `gsudo simple-scan`, and
    click Run, entering your password if prompted. This will start Simple Scan with
    root (administrator) privileges, a step that sometimes manages to rescue the scanner
    from its slumber.

    - If you still have no luck, check https://wiki.ubuntu.com/HardwareSupportComponentsScanners/
    to see whether there are special instructions that you need to follow, or ask
    for advice on the Ubuntu forums (http://www.ubuntuforums.org/).


    # Why Are My Scanned Images So Big?


    To wrap up this section on scanning, let me address a question that seems to confuse
    a lot of people: Why does a scanned image on the computer screen seem much bigger
    than its real-life counterpart? One of the first areas of confusion is that there
    is a general blurring of how the pixels per inch (dpi) and dots per inch are used.
    Most applications use these terms interchangeably, and yet they are really the
    same thing. To make things simple, when you are talking about images on your screen,
    you are talking about pixels (the little squares that make up your screen image)
    per inch, and when you are talking about printer resolution, you are talking about
    dots (of printer ink) per inch.


    Your computer screen generally has a resolution of 96ppi, while modern inkjet
    and laser printers have a resolution range of 300 to 12000dpi, or sometimes even
    more. This means that a photo scanned at 96ppi, looks just fine on your screen,
    ends up looking pretty when you print it. On the other hand, when you scan a picture
    at 300dpi, the image will look much better in your printout but if you digitify
    it "full size" on your screen. This is because there will be times as many pixels
    per inch, and so it looks three times bigger onscreen.


    As an example, look at Figure 10-14, where you can see an identical image scanned
    at three different resolutions: 96ppi, 150ppi, and 300ppi. As you can see, the
    96ppi image at the far left (measuring 5 by 6 inches—about the size of the hard
    copy itself) is the smallest, while the other two are proportionally bigger (about
    10 by 12 inches for the 150ppi image and about 25 inches for the 300ppi image).'
  merge: -1
  img_proc: true
- pgno: 244
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_244_0.png)


    Figure 10-14: The same image scanned at three different resolutions


    # # Which Resolution Should I Use When Scanning?


    Which resolution you use when scanning depends on a variety of factors, the most
    important of which is what you plan to do with the image when you''re finished.
    When I look at Figure 10-14 on my computer screen, the smallest image looks best,
    the middle image looks OK, and the largest looks a bit odd, not as sharp as the
    other two. Basically, scanning images for display on a computer—on web pages,
    for instance—it is probably best to stick with a ppi similar to typical screen
    resolutions or slightly larger: 96 to 150ppi.


    When it comes to printing, a whole set of considerations comes into play. First,
    there are the limitations of your scanner, since different models have different
    maximum resolutions. The resolution limits of your printer are also, naturally
    enough, a major consideration. For example, laser printers and inkjet printers
    have different characteristics; laser printers will produce better-quality images
    than inkjet printers, while inkjet output will be more affected by the type of
    paper used than a laser printer will be. Of course, your printed output is not
    going to suffer if you scan your images at higher resolutions than what you plan
    to print them, but the higher the resolution of a scanned image, the greater the
    file size in terms of disk space. If this is of concern to you, you can simply
    resize the images after you''re done printing using an application such as the
    GIMP (more on that in Chapter 13), but if you would prefer not being cavalier
    with your use of disk space from the get-go, you can follow these general guidelines:


    +   - If you are using a laser printer, scan at the resolution at which you are
    going to print.


    +   - If you are going to use an inkjet printer with photo-quality paper, scan
    at about 80 percent of your target print resolution—about 240ppi for a 300dpi
    printout.


    208 Chapter 10'
  merge: -1
  img_proc: true
- pgno: 245
  md: '+   - If you are using an inkjet printer with regular paper, scan at about
    65 percent of your target printout resolution—about 195ppi for a 300dpi printout.


    Needless to say, these are just suggestions to get you started. What works best
    for you and your particular scanner/printer setup may be slightly different. Nothing
    works better than a bit of experimentation and trial and error. In this case,
    you can''t really go wrong. Just give yourself some time, don''t get frustrated,
    and, most importantly, don''t wait until you desperately need to scan something
    before trying things—stay ahead of the game.'
