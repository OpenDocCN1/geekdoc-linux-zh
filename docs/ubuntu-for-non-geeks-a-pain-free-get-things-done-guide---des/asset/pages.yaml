- pgno: 81
  md: '# #4


    # MORE THAN WEBBED FEET


    Connecting to the Internet


    ![](img/58abec7ac6c22ade6357fd77ea421da3_81_0.png)


    These days, the average home computer user spends more time surfing the Web and
    writing email messages than doing just anything else. Even if you''re not much
    of a surfer, there are still numerous other applications that aren''t really per
    se but that still use the Internet in some way, such as gathering song and album
    information when you rip audio CDs to create MP3 files. Having a computer that
    isn''t hooked up to the Internet is like buying a new Maserati and then refusing
    to take it out of the garage.


    Of course, how you connect to the Internet depends on your hardware and provider.
    There are a number of possibilities in this area, including high-speed local area
    networks (LANs), cable modems, mobile (3G) broadband, and ADSL connections from
    phone companies. Some computers have an internal 56Kbps modem or can be connected
    to external dial-up modems for slower connections over regular phone lines. Depending
    on what you have, setting things up on your system should provide a cinch in the
    case of LAN connections and any others that use your Ethernet port (such as)'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'cable modems), possibly a bit more work in the case of wireless and mobile
    connections, and sometimes a bit of a challenge when it comes to dial-up connections.
    in this chapter you will learn how to set up these connections, and in the next
    chapter you will learn a bit about what Linux has to offer in terms of the most
    commonly used Internet applications.


    # How Do You Connect?


    The way you go about setting up your connection really depends on how you''re
    trying to connect to the Internet. Here''s a list to help you decide which method
    to use:


    +   - If you connect your computer to a wall socket, a router, or a cable modem
    by using an Ethernet cable, go to "Setting Up a Wired Connection" on page 46.

    - If you connect to a wireless network or your own wireless router, head to "Setting
    Up a Wireless Connection" on page 49.

    - If you connect using a dial-up modem connected to your phone line, the section
    "Setting Up a Dial-up Connection" on page 53.

    - If you have an ADSL or DSL modem that is built into your computer or connects
    to a USB port, try "Connecting with a DSL or ADSL Modem" on page 52.

    - If you connect using a mobile (3G) broadband connection that plugs into your
    computer, skip to "Mobile (3G) Broadband Connections" on page 55.


    # Setting Up a Wired Connection


    If you have a high-speed connection from your cable television company or ISP
    or if you are connected to the Internet by a LAN at your office, you are really
    in luck, these setups are probably the easiest to deal with. I''m assuming that
    you''ve already set up your router or modem according to your Internet provider''s
    instructions, all that remains is to connect an Ethernet cable between the modem/router
    (or LAN wall socket) and your computer''s network socket. After you''ve done that,
    you should be ready to go without any further settings to fool with.


    # Checking Your Connection


    If you like, can see whether you''re connected by opening Firefox (click the Firefox
    launcher in the top panel, next to the System menu) and then, once it starts up,
    trying to navigate to a common site, such as http://www.yahoo.com/. If the site
    comes up, you''ll know for sure.


    If you have a problem getting online and you are trying to connect via a LAN or
    cable modem, you could try to refresh your connection by right-clicking the Network
    Manager icon in the top panel, unchecking the Enable'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Networking box in the pop-up menu, waiting a few seconds, and then checking
    the Enable Networking box in the pop-up menu again. If that doesn''t work, restarting
    your machine while physically connected to your Internet source with the Ethernet
    cable. If the lack of connectivity persists, it is possible that your network
    card is not supported by Linux. This is relatively rare, but fortunately, easily
    remedied (by replacing it).


    The problem could be that your or service provider does not automatically assign
    addresses via Dynamic Host Configuration Protocol (DHCP). DHCP is a means by which
    your Internet provider can automatically provide your system with the configuration
    information it needs in order to connect to the Internet. If your provider does
    not use DHCP, you will have to get the necessary information about settings from
    the network administrator or service provider and enter the settings yourself.


    # Setting Up a Cable or Ethernet Connection for Providers Not Using DHCP


    To input your cable or Ethernet settings yourself, first get the settings you
    need from your network administrator or Internet provider, and then perform the
    following steps:


    +   1. Select System ▸ Preferences ▸ Network Connections.

    2. Choose the Wired tab (Figure 4-1), and select the network connection from the
    list by clicking it once (it should have a name like Auto eth0). If there are
    no entries in the list, then your network card hasn''t been properly recognized.
    Take a look at “Installing Drivers for Your Network/Wireless Card” on page 390
    to see how to fix this.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_83_0.png)


    +   3. Click Edit, and you''ll be presented with a settings window. Choose the
    IPv4 Settings tab, and change the Method setting from Automatic (DHCP) to Manual.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '4. Click the Add button to enter the IP address information for your computer.
    This should have been provided by your ISP or network administrator and will consist
    of an IP address, default gateway, and netmask (see Figure 4-2 for an example).
    Enter the DNS server address that you were given.


    | Editing eth0 |

    | Connection name: Auto eth0 |

    | [x] Connect automatically |

    | Wired 802.11X Security Settings IPv4 Settings IPv6 Settings |

    | Method: [Manual] |

    | Addresses |

    | Address | Netmask | Gateway | Add |

    | 192.168.1.34 | 255.255.255.0 | 192.168.1.1 | [Delete] |

    | | | | |

    | DNS servers: [8.8.8.4,208.67.220.220] |

    | Search domains: |

    | DHCP client ID: |

    | [Routes...] |

    | [x] Available to all users [Cancel] [Apply... ] |


    Figure 4-2: Manually inputting network settings


    +   5. Make sure that the Available to all users option is chosen if other users
    of your computer will be using the connection.


    +   6. Click Apply to save the settings. You''ll be asked to enter the password
    for your user account, so do that, and click Authenticate.


    +   7. Network Manager will try to establish the connection using the details
    you provided. If it''s successful, a message will pop up saying the network was
    connected. If that doesn''t happen, click the Network Manager icon on the top
    panel, and choose Disconnect.


    +   8. Then, click the Network Manager icon again, and select your network underneath
    where it says Available.


    If you are wondering what Internet Protocol (IP) and Domain Name Service (DNS)
    are all about, you can simply think of them in this way: DNS translates the easy-to-remember
    URLs that you have to know, such as http://www.google.com/, into numerical, or
    IP, addresses that the Internet can understand. The address here: http://www.google.com/
    becomes http:///209.85.229.104. You can type the numerical version in your browser
    later to see for yourself.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Setting Up a Wireless Connection


    With the right wireless hardware, you can now surf the Web from just anywhere
    where you can catch a (radio) wave, so to speak. Whether you happen to be at your
    breakfast table, in the library of your university, or at your local Starbucks,
    you can now go online without having to physically hook up your computer to anything.


    Fortunately, the process of setting up wireless networking in Ubuntu is quite
    easy and not very different from what you just read in the previous section.


    # Hardware


    If you lead a solely wired existence or are just inexperienced in this particular
    area, there are a few things worth knowing. To get started, you need to have the
    right hardware. If you just want to go wireless, then all you need is a wireless
    network card (sometimes referred to as an 802.11a/b/g card). These are built in
    almost all modern laptops, while for older models they are usually add-ons in
    the form of cards that pop into the PCMCIA slot on the side of your computer (as
    shown on the right of Figure 4-3).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_85_0.png)


    Figure 4-3: All you need for a WiFi setup—an access point and a network interface
    card


    Some wireless cards plug into one of your machine''s USB ports, or in the case
    of desktop computers, one of its PCI slots. Although support for cards of this
    type has improved through the past couple of years, there are still gaps, and
    some can be rather tricky to deal with. You will find some tips on how to deal
    with awkward cards in Chapter 21, but if you''re looking for a sure thing, Centrino
    IPW-2100 and IPW-2200 cards are definitely supported by Ubuntu. As cards of the
    built-in or PC card variety, you will find support much better, but even then
    you have to make sure, or at least hope, that the card you are using is Linux
    compatible. No matter what wireless card you are wondering about, the easiest
    way to find out whether it will work is to try it. Linux kernel comes with many
    wireless drivers built in, and Ubuntu'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'updates provide new ones, if you use a card that is compatible with one of
    those drivers, things will be smooth sailing. Things don''t seem to work, check
    Ubuntu''s list of supported cards (https://help.ubuntu.com/community/WifiDocs/WirelessCardsSupported/),
    or check the Ubuntu forums to find a driver that is compatible or to see whether
    anyone has experience with your particular card.


    If you want to set up a wireless system in your home or office, then you will
    also need to get a wireless access point (WAP), on the left of Figure 4-3. Fortunately,
    Linux compatibility is not much of an issue in this department, because the access
    point doesn''t physically interface with your computer, and the settings are handled
    via your web browser.


    NOTE Access points come in several different types. The most common type is a
    wireless router, which many ISPs provide for free.


    You should be aware, however, that a few access points require you to use Internet
    Explorer to handle their setup chores. Although it is possible to get Internet
    Explorer up and running in Linux (as you will be in Chapter 18), you can''t be
    100 percent sure that it will work. Unless you have a Windows machine in in house
    or office to handle such chores, it is probably a good idea to steer clear of
    access points of this kind.


    # Activating Your Wireless Card


    Setting up a Linux-compatible wireless PC card is relatively simple. First connect
    your access point to your Internet source, and turn on the access point. Once
    it is up and running, plug your wireless card into the PCMCIA slot or USB port
    on your laptop (unless your wireless connection is built-in, in case you can forgo
    this step). Any LEDs on the external card will most likely light up at this time.


    If your access point was on when you booted your computer and your wireless card
    was in during booting, you probably don''t need to do much else to access the
    Internet. Just follow these steps:


    +   1. Click the Network Manager icon on the top panel to reveal a drop-down menu
    showing the wireless signals that are present in your vicinity and the strength
    of each signal (Figure 4-4).


    +   2. From that, select the signal for your access point (or any other wave you
    are entitled to latch onto) by clicking it.


    +   3. Your system will then try to connect to the Internet. Once a connection
    is made, the Network Manager icon will morph into a small signal-strength indicator.
    Pretty handy.


    +   4. If your network has a WEP or WPA password, you''ll be prompted to enter
    it. It can be useful to check Show password before you type the password so you
    can check for any mistakes. Click Connect when you''re finished.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Most access points employ an added level of security in the form of Wired Equivalent
    Privacy (WEP) or a Wi-Fi Protected Access (WPA) key. If you didn''t choose your
    own password when you set up the access point, try looking for a sticker on the
    base or side of the access point to see whether a default is used. If you''re
    trying to connect to a network for which you don''t happen to know the key, then
    chances you are not supposed to be making the connection in the first place. Naughty,
    naughty.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_87_0.png)


    Figure 4-4: The Network Manager shows available wireless networks and their signal
    strengths.


    If you were not successful in making your wireless connection (the system will
    tell you that there''s the case), you have a few possibilities beyond the annoying
    noncompatible-card scenario. First, double-check to make sure your card is actually
    physically turned on. I know that sounds dumb, but I have been guilty of this
    oversight myself on numerous occasions. Many laptops have a key to enable or disable
    the wireless card; on mine you have to press the function key (FN) and F2 at the
    same time.


    Another, less common, is possibility that your network does not have DHCP, in
    which case you will have to manually input your network settings as provided by
    your network administrator or service provider. Armed with that information, simply
    follow the steps listed in “Setting Up a Cable or Ethernet Connection for Providers
    Not Using DHCP” on page 47. Just be to use the Wireless tab of the Wired connection.


    If you still have no luck connecting wirelessly, the drivers may not be installed
    for your card, or Ubuntu may not support the card. You can try plenty of tricks
    to get things working, so head over to Chapter 21 and look for “Installing Drivers
    for Your Network/Wireless Card” on page 390.


    # Switch Off or Refreshing Your Wireless Connection


    Sometimes you’ll want to disconnect from a wireless network, such as when you
    use your laptop on an airplane or when you just want to connect to'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'different network, as you might when moving your laptop from one wireless

    hotspot to another.


    To do this, click the Network Manager icon once to reveal the list of\available
    wireless networks (that is, signals). In that list, click the Connect

    option below the name of the wireless network to which you are connected.

    Within a second or two, you will be disconnected.


    If you want to turn off your wireless card (as you should if you''re

    bording an airplane) and you don''t have a physical way to do it, like a switch

    or a button, right-click the Network Manager icon, and then deselect

    Enable Wireless. And if you want to turn back on again, just get

    back to that menu, and select Enable again.


    Sometimes, your wireless card might lose its connection for no apparent

    reason, so it can be useful to refresh the connection (that is, turn it off and

    on again) try to get it back. The quickest way to do this is to click the Net-

    work Manager icon and click the name of your wireless network in the

    List. You will be disconnected and then automatically reconnected.


    If doesn''t work, try disabling and enabling the wireless connection

    using Network Manager''s Enable option, as described earlier. If you

    hill still have no one, or unplug the wireless card off and on again using

    switch or button if you have one, and plug it back in again. Finally, if

    nothing seems to be working, restarting the computer.


    # Connecting with a DSL and ADSL Modem


    How easy is it to set up your DSL or ADSL modem depends on the connector

    that it has. If it can be connected using an Ethernet cable, use that, and follow-

    t instructions in "Setting Up a Wired Connection" on page 46; it''ll be

    much easier than trying to use a USB cable! If you have a USB or internal

    modem, try the instructions in this section and hope for the best.


    The first step is to check whether Ubuntu recognized your modem.

    Assuming it''s already plugged in, click System ► Preferences ► Window

    Connections, and select the DSL tab. If a connection is listed in that window,

    your modem was recognized, and you can begin setting up. If the list is

    empty, refer to /help.ubuntu.com/modems.html to see

    whether there are any steps you can follow to get your modem working.


    Select the connection by clicking it, and then click Edit. Click the

    DSL tab of the Editing window that appears, and enter your username and

    password into the appropriate fields. Then enter your connection information-

    (using a phone number) into the Service box, and click Apply. Now,

    click the Network Manager icon on the top panel, and choose your DSL connection

    from the list. Network Manager will try to connect using your modem-

    it it''s not successful, go back and try changing some of the settings to see

    whether you can get it to cooperate.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# # Setting Up a Dial-up Connection


    Although much of the world is moving to high-speed Internet connections,

    any of you may still be using dial-up Internet connections, which means

    you need to have a traditional dial-up modem to reach beyond your box to

    t outside world. In case you broadband surf-gods have forgotten, modemsnare those
    wonderful machines that whistle, chime, screech, and spit when-

    ever you dial your Internet provider. Suppose you could think of them as

    isy telephones in need of a good burp.


    Now here come the bad news-in the world of Linux, very few internal

    modems are supported, and for those that, the setup process can be quite

    frustrating. The main reason behind this compatibility problem is that most

    built-in modems are software dependent, and the software they depend on is

    part, or designed for, Windows. Such modems are called Winmods.


    Of course, the Linux community has been working on ways to deal

    these Winmodem so that they will work with Linux systems. Though

    support for the wide variety of Winmod models out there is still rather

    spotty, things are not better before, so you might just look out. My advice is

    hold off on the wondering and worrying and just giving your modem to try

    whether it works. If it does, then you''re all set. If it doesn''t, then you don''t,
    well, then you have do some options, and at least you haven''t done any damage
    to your system.


    With all that-rabble out of the way, lets get down to the steps for

    setting your dial-up connection. First, get the settings you

    need your Internet provider. Most providers aim their operations at

    Windows and Mac users, very free Linux support. Still, there is

    o technical reason for your Linux system not to work via their setup, so

    nag and push them until they give you the information you need. After,

    ake sure your modem is connected to a life telephone connection-for

    ample, the phone jack in your wall.


    Now it''s time to set up the connection. I''ll use the GNOME PPP pro-

    gram to do all of the setting up, but there''s a cave-at: It''s not installed!
    If you have

    by default, and you need an Internet connection to install it some other Internet
    connection that you can use temporarily, connect to

    at, and use the Ubuntu Software Center to download and install GNOME

    P (see Chapter 6 to learn how to install software). The alternative is to use

    tppconfig command, which is installed by default but is difficult to use.

    Find another computer and check out instructions at https://ubuntu.com/community/

    dialupModemHowto/SetUpDial/ for instructions if you have no alternative

    to use pppconfig.


    Assuming that you got GNOME PPP installed with a borrowed Internet

    ection, you follow these steps to set up your modem:


    +   1. Select Applications > Internet > GNOME PPP, after which GNOME PPP

    appear.


    +   2. Click Setup, and make sure you''re looking at the Modem tab.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '+   3. Click the Detect button to identify your modem. If you get a message
    saying that no modem was found on your system, you''re out of luck—the best you
    can do is ask for advice on the Ubuntu forums (http://www.ubuntuforums.org/) or
    try selecting items from the Devices drop-down list by trial and error.


    +   4. How you change the rest of the settings depends on how your modem and ISP
    are set up, select the defaults for now. If these don''t work, trial and error
    are a potential way forward.


    +   5. Click Close to get back to the GNOME PPP window. Type your username and
    password, and enter the phone number provided by your ISP.


    +   6. Click Connect. You should then hear your modem begin its dialing, spitting,
    and churning sequence as it makes the connection with your provider.


    +   7. If you manage to get connected, you can start browsing, emailing, or whatever
    else is online. If you get an error message, there''s little you can do but take
    a deep breath and click the Setup button to try tweaking your settings.


    # What to Do If Your Modem Isn''t Compatible


    Though it may not sound that, what I''ve just described is pretty much best-case
    scenario. What happens, if your modem and Ubuntu do not see eye to eye? Well,
    there are a few options. My first, more radical suggestion, is to dump your dial-up
    ISP and find a broadband provider that covers your area. If that is not an option,
    then you have two ways to go. One is to try getting around with your modem to
    see whether you can get it to work. This is a slightly more complicated process,
    but there are instructions at https://help.ubuntu.com/community/DialupModemHowto.
    If you are afraid of a voice noise, you may find that the process entails to be
    a bit more than you''re willing to deal with.


    The simpler, albeit costly, to get your modem to work is to chase a true hardware
    modem. Hardware modems are not software dependent, so work with any operating
    system. You can think of them as telephones without a handset.


    Such come in two forms: internal and external. For the interests, USRobotics models
    56K_V2 Performance Pro Modem (internal slot) and 56 PC Card Modem (PC card slot,
    for laptops) are true hardware that are easily available and said to work. You
    can check the USRobotics site at http://www.usroc.com/ for more information on
    these models, though checking the Ubuntu forums for suggestions is always a good
    idea. Perhaps the half of all solutions is to buy an external dial-up modem. This
    might come with either serial or USB connectors and sit in a box outside your
    computer. Because the modem doesn''t use your operating system to operate, it
    does not tie up system resources that it''s busy, which may result in a possible
    pickup in computer speed.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Linux support for USB modems can be patchy, so do your research before buying
    one. External serial modems are a safer bet since most of them should work with
    your system ... if you have a serial port, that is. Modern computers rarely have
    them any more, so check to see whether you have one by looking at the back of
    your computer for a connector with little prongs in it (see Figure 4-5). If you
    are worried and looking for a sure thing, Zoom Telephones (http://www.zoom.com/)
    makes an external serial modem that is compatible with Linux, and the company
    says so right on its website. The USRobotics 56K V.92 External Fax modem is also
    said to work, though I haven''t tried this model myself.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_91_0.png)


    Figure 4-5: Serial port and connector


    If you find another model that you think will do the trick, before you commit
    to it by slapping down the cash, do a Yahoo! or Google search with that modem''s
    make and model number, along with the word linux, and see what search results
    you get. Of course, you can also try one of the Linux forums and ask about the
    modem make and model there. A lot of people are in the same boat, so you are sure
    to get plenty of opinions and advice.


    # Mobile (3G) Broadband Connections


    Wireless networks, for all the convenience and freedom that they offer, still
    have quite a limited range. This won''t be an issue if strays from within the
    general vicinity of your house or office, but it can get mighty inconvenient if
    you''re on the road, miles from the nearest wireless-enabled coffee shop. This
    being the 21st century, there are, of course, ways around this limitation.


    If you''re a computer-equipped traveler, you''ve probably come across mobile broadband
    broadband technology, also known as 3G. All you need to get a high-speed connection
    on the go is a 3G card (also inexplicably called a'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'dongle), which plugs into your computer and connects you to the Net via a cell
    phone network (Figure 4-6). Ubuntu is pretty good support for most 3G cards right
    from the get-go, and the setup process is a snap:


    +   1. Plug your 3G card or dongle into the computer; the New Broadband Connection
    Wizard should open automatically. If it doesn''t, click System > Preferences >
    Network Connections, open the Mobile Broadband tab, and click Add.


    +   2. The first page of the wizard has a drop-down list that has the make and
    model of your 3G card displayed in it. If it says Any Device instead, your card
    may not have been recognized, so take a look at https://wiki.ubuntu.com/NetworkManager/Hardware/3G/
    to see whether there are any steps you need to get to recognize the card.


    +   3. Click Forward, select your country from the list, and then click Forward
    again.


    +   4. Pick your mobile broadband provider from the list, and then hit Forward.


    +   5. Now you need to select your broadband billing plan from the drop-down list
    (Figure 4-7). It''s important that you choose the right plan to avoid being wrongly
    charged. If you don''t see a plan that looks appropriate, choose My plan is not
    listed, and call up your broadband provider to ask what to put in the Access Point
    Name (APN) box.


    +   6. Click Forward, check that all of the details look OK, and click Apply.
    You''ll be taken to an Editing window where you can enter details such as your
    account PIN and password if needed.


    +   7. Click Apply, and then close the Network Connections window to finish.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_92_0.png)


    Figure 4-6: A 3G mobile broadband card'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# New Mobile Broadband Connection


    # Choose your Billing Plan


    Select your plan:


    Selected plan APN (Access Point Name):


    > Warning: Selecting an incorrect plan may result in billing issues for your broadband
    account or may prevent connectivity.


    If you are unsure of your plan please ask your provider for your plan''s APN.


    Figure 4-7: Choosing a broadband billing plan


    To connect to mobile broadband, click the Network Manager icon on the top panel,
    and choose your broadband service from the list. Network Manager will spend a
    few seconds establishing the connection, after which you''ll be notified that
    you''re connected (or not, as the case may be). Disconnecting happens in just
    about the same way: Click the Network Manager icon again, but this time select
    the Disconnect item just below the name of your broadband service when the list
    pops up.


    # I''m Connected . . . So Now What?


    Ideally you''re cabled, wired up, or otherwise happily connected to the Internet.
    (If not, take a look at Chapter 21 for some connection-troubleshooting tips.)
    That''s great news, because now you can put Ubuntu through its paces by trying
    some of the interesting web-related software that comes preinstalled. Prime of
    your clicking finger for action, and flip the page to see what life is like a
    new Linux user.'
  merge: -1
  img_proc: true
