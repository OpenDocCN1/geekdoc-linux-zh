- pgno: 310
  md: '# LMMS


    Linux MultiMedia Studio LMMS is a combination tracker/sequencer/ synthesizer/sampler
    with a modern, user-friendly, graphical user interface— at least that the LMMS
    home page suggests. I can''t swear how easy it is to use, because I don''t know
    much about apps in this genre. But there is a lot of hoopla in the Linux world,
    and it sure looks cool, as you can see in Figure 14-12. It really looks cool too
    (try the demos once you install it). Search the Ubuntu Software Center for LMMS,
    install the program, and run it by selecting Applications > Sound & Video > Linux
    MultiMedia Studio.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_310_0.png)


    Figure 14-12: Creating music with LMMS


    # Audacity


    If you''re interested in podcasting, one application you will find repeatedly
    mentioned in Audacity. Audacity (Figure 14-13) is a multiplatform audio recording
    and editing application that is frequently used not only in the Linux world but
    in the Mac and Windows worlds as well. It allows you to cut and paste bits of
    sound, raise pitch, increase speed, add echo and other effects, and . . . well,
    all sorts of other neat stuff. Get it via Ubuntu Software Center by doing a search
    for then installing audacity. Audacity will then be available by selecting Applications
    > Sound & Video > Audacity.


    # MuseScore


    It would be pretty to wrap up this music chapter without mentioning the straightforward
    and very capable music notation program, MuseScore. MuseScore (Figure 14-14) allows
    you to create sheet music, either by mouse, keyboard, or midi device, with up
    to four voices per staff. It also allows you to play back the compositions you''ve
    put to the page. This is a great feature for likes like me, who can''t read music
    but find themselves wanting out'
