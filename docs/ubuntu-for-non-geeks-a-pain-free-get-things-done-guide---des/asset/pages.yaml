- pgno: 76
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_76_0.png)


    Figure 3-15: Managing menus with the menu editor


    Now add Evolution to the Internet menu by clicking **Internet** in the left pane
    of the menu editor window and clicking the **New Item** button. In the Create
    Launcher window that appears, type *Evolution Mail and Calendar* in the Name box
    and **evolution** in the Command box. The Evolution icon should then automatically
    appear in the icon window. Once, click *OK*, after which the new Evolution entry
    will appear in the Internet menu. Close the menu editor window.


    # # Virtual Desktops


    It is now time to discuss a rather convenient feature of Linux: *virtual desktops*.
    Although the virtual desktop feature has only recently made its way into other
    operating systems, it has a Linux feature for years (yes, it started here, folks).
    Rather than babble about what this virtual desktop business is and what it can
    do for you, it is probably best to have you learn about it by giving you some-hands
    experience.


    In your GNOME panel, click the **Wanda (Fish)**, **OpenOffice Writer**, and **Firefox**.
    You will have three windows open in your present desktop, or *workspace*. Now
    look at the Workspace Switch to the right of the bottom panel. There should be
    four boxes, with one on the left (your present workspace) in light gray. If you
    click the box next to that, in dark gray, all your open windows suddenly disappear.


    Actually, nothing has really disappeared—you are just viewing a new desktop. All
    your other windows are still open and running in the previous desktop.


    Chapter 3


    40'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'In this second desktop, you can open something else: Select Applications ▸
    Games AisleRiot Solitaire. The AisleSolitaire card game will appear.


    You now have windows in two different desktops, and you can switch back and forth
    between them. To do so, just go to the Workspace Switcher in your panel, and click
    the gray left box, which will take you to your original desktop. Once you''ve
    done that, the box for the workspace you were in will just in turn dark gray,
    and you can click that one to go back to your game desktop.


    As you can imagine, this feature has some potential benefits for you, in addition
    to helping you avoid clutter. Imagine that you are working some long document
    in OpenOffice.org Writer. Eventually, you get tired and decide to go off a bit
    by playing a game, as Mines, for a while. To do this, you switch to another desktop
    where you open and play the game. A bit later, when you notice your boss making
    the rounds of the office, you simply switch back to the first desktop so that
    you look busy when he walks by and asks, “Keeping yourself busy, Boss?


    Phew!


    By the way, you can also switch between virtual desktops by simultaneously pressing
    and holding CTRL-ALT and then pressing your left and right arrow keys to move
    to your targeted desktop.


    So, what happens if, let''s say, you are running OpenOffice.org Writer in one
    workspace and suddenly that it would be handy to have both running in the same
    workspace? Do you quit the GIMP and start it up in the other desktop? Frankly,
    things are much simpler than that, and there are two ways to get the job done.


    The first of these ways is to right-click the title bar of the window you want
    to move, and then select Move to Workspace Left or Move to Workspace Right. You
    can also select Move to Another Workspace and select the workspace you want to
    move the window to number: Workspace 1, Workspace 2, Workspace 3, and so on.


    If you prefer keeping your hands on your keyboard than on your mouse, you can
    also move a window from workspace to workspace using hotkeys. With the window
    you want to move active (on top of the file, so to speak), press and hold SHIFT-CTRL-ALT,
    and then use the left and right cursor to move to the desired desktop


    # Wanda Revisited ––GNOME Easter Eggs


    Well, now that you''ve finished your work in this chapter, it''s time to go around
    a bit by revisiting our precious peacock fish, Wanda. Knowing what you do not
    know about Wanda the fish, you might find it odd for me to start talking about
    her again, and Wanda has a few more tricks beneath her fins. In fact, she is a
    good means by which introduce two of GNOME''s most famous Easter eggs. Easter
    eggs, in case you don''t know, are hidden snippets of code that programmers seem
    to sneak into their programs. They are usually pretty useless, but they can be
    found in all operating systems, numerous applications, and on DVDs (to find out
    more about those, go http://www.dvdeastereggs.com/). A good example of an Easter
    egg is my first'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'encounter with one on my first Mac, an ancient Mac SE with whopping 2MB of
    RAM. On that machine, you could bring up an image (or it was a slide show?) of
    the Mac SE development team by the seldom used debug key on the side of the machine
    and then typing G 41D89a. Pretty cool, I guess, but I would never have stumbled
    upon it if I had not read about it in my magazine.


    As my example shows, accessing these Easter eggs usually requires some unusual
