- pgno: 57
  md: '# WHAT IS A HARD DRIVE PARTITION?


    I''ve mentioned partitions several times so far, but it may not be obvious to
    what I meant. A Partition is an area of your hard disk that is "cordoned off"
    from other areas of the disk. It''s a useful way of keeping things such as operating
    systems separate. Because they are isolated from each other, different partitions
    are treated as if they are different hard disks attached to your computer, even
    though they''re the same physical disk.


    Most computers have just one partition that fills the entire hard disk. This is
    like having a house with a completely open floor plan—the house is just one room.
    If you want to completely remove Windows and install Ubuntu, Ubuntu can happily
    take over the entire partition (and thus the entire disk) and kick out its resident,
    Windows.


    If you want to install two operating systems on the same computer, you have to
    give each one its partition (after all, they need their privacy). Back with the
    house analogy, like erecting a partition wall to carve the house into two rooms.
    If you choose dual-boot Windows and Ubuntu, the installer will automatically do
    this partitioning for you. Of course, you can choose how big each partition is:
    the bigger you make the Ubuntu partition, the more space will be available to
    you in Ubuntu (and the less in Windows). The house is the same size; it''s just
    the position of the dividing wall that you''re changing.


    You can find some information on manually partitioning your hard disk in Appendix
    C, but there should be no need to, however, since the Ubuntu installer will be
    happy to handle the task for you.


    If you''d like to do something more elaborate with your disk space, such as having
    separate partitions for your data and system files (convenient if you ever need
    to reinstall or want to easily share files between Windows and Ubuntu), you''ll
    need to specify the partitions manually using the last option. This is more advanced—check
    out Appendix C for some guidance. Once your selection is made, click **Forward**.


    Depending on the partitioning scheme you choose, once you''ve clicked the **Forward**
    button, a small window may appear reminding you that any changes you have made
    far will now be written to disk (Figure 2-8).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_57_0.png)


    Figure 2-8: A warning that the changes you''ve requested are about to be made
    permanent


    +   Click the **Continue** button, keeping in mind that, if you saw the warning
    message, this is the point of no return. After that, wait for the partitioner
    to do its stuff (depending on the size of your disk and what you have on it, it
    could take some time).


    Wading and Diving 21'
  merge: -1
  img_proc: true
