- pgno: 411
  md: '# 21


    # WOUNDED WINGS


    Fixing Common Problems


    ![](img/58abec7ac6c22ade6357fd77ea421da3_411_0.png)


    Like death and taxes, computer problems are an inescapable fact of life. Ubuntu
    suffers from its fair share of annoyances, and although I seem to spend far less
    time fixing things on Ubuntu than I ever used to on Windows, it''s best not to
    ignore the possibility that you might some day experience a hardware hiccup or
    sticky software situation.


    The purpose of this chapter is to arm you with some general-purpose tips, tricks,
    and troubleshooting hints. You''ll find explicit instructions on how to fix specific
    problems, but for the most part I''ve tried to keep the discussion general. This
    is the way you resolve some issues will depend heavily on the peculiarities of
    your setup, and just isn''t a bookshelf big enough for a guide that covers every
    possible eventuality in suitable detail. Fortunately, the Internet harbors a sizable
    collection of Ubuntu-related'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'guides, so even if you don''t arrive at the exact answer you were looking for
    here, I hope you''ll be able to use some of my tips to help you find the right
    information on the Web.


    If you''ve run into a problem, flip through this chapter to see whether there''s
    anything that might help. I''ve covered problems with installation, booting, sound
    and video, Internet and network connections, hard disks and storage, and displays
    and graphics cards, along with pesky software issues such as programs freezing
    or slowing down your computer. If you''re not beset by any particular quandary,
    you might like to skip through this chapter to get some idea of what to do misfortune
    befalls you in the future. Or, you could take my preferred route: Make yourself
    a hot beverage and head back to the games chapter (Chapter 17) for some well-deserved
    R&R.


    # I Can''t Get Ubuntu Installed


    Not able to install Ubuntu is a particularly unhappy problem because it means
    you''ve probably been denied all the fun from the previous 20 chapters of this
    book! Never fear; there''s plenty you can do to convince Ubuntu to install on
    your computer, and if you''re still struggling, you can try installation methods
    like booting from a USB stick, which I''ve covered in Appendix A.


    # My Computer Won''t Boot from the CD


    If you tried to start your computer from the Ubuntu installation CD but never
    even got to the purple boot screen (see "Going for a Dip" on page 12) or if the
    computer just boots into Windows every time, try one of the following options:


    +   Check the boot order When your computer starts up (boots), it goes through
    a list of devices in a set order, checking to see whether they have an operating
    system on them. As soon as it finds an operating system, the computer will boot
    from that device, and it won''t check any of the other devices. This means that
    if the hard disk comes before the CD drive in the boot order, the computer will
    boot from the hard disk rather than the CD drive. To boot from the CD, you need
    to make sure that the CD drive comes first in the boot order. "Going for a Dip"
    on page 12 for instructions on setting up the boot order correctly.


    +   Check the integrity of the CD You could have a faulty or damaged CD that your
    computer is unable to boot from. It''s possible to check whether a disc has faults
    on it by doing a checksum test. A checksum is sort of a fingerprint; you take
    the checksum of your Ubuntu and compare it with the checksum of an Ubuntu CD that
    is known to be free of faults. There is but one tiny difference between the two
    discs, the checksums will be different too—the fingerprints won''t match. Ubuntu
    uses the MD5SUM'
  merge: -1
  img_proc: true
