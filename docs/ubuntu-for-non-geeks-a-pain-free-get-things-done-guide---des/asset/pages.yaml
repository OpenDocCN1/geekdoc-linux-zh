    # Creating Playlists in Rhythmbox


    Of course, you can tailor things even further to match situation and your mood.
    There are days, after all, when you''re feeling a bit ethereal for Adam Lambert
    (and goodness for that). To prepare for such moments, you can create playlists,
    which are lists of songs to be played ... where all the requests are your own.


    To create a playlist in Rhythmbox, select Music > Playlist > New Playlist. When
    the Playlist icon appears in the left pane of the Rhythmbox window, type a name
    for the list, and then add the songs you want from the Library pane to the Playlist
    icon. The songs themselves remain in the Library, so you''re really moving anything—just
    creating aliases.


    You also create automatic playlists, which are lists that automatically scan the
    Library for songs that match your criteria. You could choose to create a list
    for all the songs in your Library by a particular artist or of a specific genre.
    To do this, just select Music > Playlist > Automatic Playlist. A window will appear
    in which you can specify what the list is to contain. You can even specify how
    many songs you want in the list.


    Once you''ve created your lists, you can play one by clicking the list and then
    double-clicking the list. Press the Play button near the top of the window (or
    by just double-clicking the list).


    266 Chapter 14'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Online Music Stores via Rhythmbox


    While iTunes has only the iTunes store, Rhythmbox provides you with options, all
    of which can be accessed from the left pane in the Rhythmbox window under the
    Stores heading. Two of these stores, Jamendo and Magnature, provide music released
    under Creative Commons or open license by independent artists. The other store
    is the Ubuntu One Store, which provides music by major artists from the 7digital
    catalog. The songs there are free from the digital rights management (DRM) limitations
    found in many songs purchased from other online stores.


    # Other Cool Features in Rhythmbox


    Rhythmbox includes a few cool features worth noting. In addition to help manage
    podcasts, it also supports displaying album cover art. As you can see in Figures
    14-2 and 14-4, when you play a track in Rhythmbox, the album cover art for that
    is automatically downloaded and displayed in the lower-left corner of the window
    (assuming that Rhythmbox can find it).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_303_0.png)


    Figure 14-5: Activating Rhythmbox''s lyrics function'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'Finally, if you are an iTunes user and attached to a bit of visual stimulation
    while playing your tunes, Rhythmmbox can now satisfy you with a visualizer of
    its own. To activate it, go to the View menu and select Visualization (you can
    turn it off in the same way). The right half of the Rhythmmbox window will be
    filled with the wild, swirling shapes and colors of psychedelic that you''ve come
    to know and love.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_304_0.png)


    Figure 14-6: Rhythmmbox displays the lyrics to the track currently playing.


    # Project 14B: Listening to Streaming Media with Rhythmmbox


    In addition to allowing you to play audio CDs or the music you have stored on
    your hard disk, Rhythmmbox allows you to play Internet radio streams in either
    MP3 or Ogg Vorbis format. To add a stream, click the Radio icon in the left pane
    of the Rhythmmbox window—you will come face with only a dozen streams the first
    time around. In this project, I will try to fatten your collection a bit by showing
    how you can add streams on your own.


    # 14B-1: Adding Radio Streams to Rhythmmbox


    To started, let''s try adding FIP, a French music station specializing in the
    eclectic. The process for adding FIP is essentially the same for adding any other
    stream. Here are the steps:


    +   1. Click Radio in the left pane of the Rhythmmbox window.

    2. At the right end of the strip below the menu bar, click the Create New Radio
    Station button (the one that looks like a little radio).

    3. In the window that then appears, type http://www.tv-radio.com/station/fip_mp3/fip_mp3-128k.m3u/,
    and click Add.

    4. Double-click the new entry for your stream to play it.'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'The only problem with what you''ve just done is that the title of the stream
    appears in the Rhythm-box window as the URL you typed in, and the genre, for its
    part, appears as unknown. Needless to say, this isn''t all that handy to have
    things, especially once you have more than a couple of streams listed and have
    to going through them to figure out what it is.


    Remedying this state of affairs is a simple process. Just right-click the stream,
    and select Properties. In the window that appears, change the content of the Title
    and Genre boxes so they represent something more meaningful to you. You can see
    in Figure 14-7, I used Radio France – VIP for the title and Eclectic for the genre.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_305_0.png)


    Figure 14-7: Changing a stream''s title and genre properties in Rhythmbox


    # 14B-2: Adding Additional Radio Streams to Rhythmbox


    Now that you''ve had a taste of Rhythmbox does with radio, you may be hungry for
    more. Ah, but where do you find these radio streams? For the largest collection
    of MP3 streams, go to http://www.soundcloud.com/, find a stream that seems interesting
    to you, right-click the Tune In! button for stream, and then select Copy Link
    Location in the pop-up menu. After that, paste the URL in the URL box of Rhythmbox''s
    New Internet Station window, and click Add. You can then double-click the stream
    in the right pane of the Rhythmbox to play it.


    # Creating Audio CDs


    All this talk about encoding and listening to MP3 and Ogg Vorbis for your computer
    is fine and daddy, but there are no doubt times when you would like to have your
    songs on a plain audio CD that you can play while you slog your way to work on
    the New Jersey Turnpike or the Ventura Freeway. Luckily, this is easy enough to
    do, and there are a couple of ways to go about it.


    # Burning Audio CDs with Rhythmbox


    For Rhythmbox users, the easiest way of going about things is to do it all from
    Rhythmbox. To do this, first create a playlist with the songs you want to burn
    to CD, and then click the Create Audio CD button. A confirmation window will appear,
    asking you whether you want to create the CD you just'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'set out to create. You no doubt do, click the Create button, and copies of
    your tracks will be created in WAV format. When that process is complete, you
    will be prompted for a blank CD, so pop one into your drive, click OK, and the
    process will begin. When it''s done, the progress window will vanish, and your
    new audio CD will pop out of your drive.


    # Burning Audio CDs with Brasero


    Another way to create "play-anywhere" audio CDs from your ripped MP3 and Ogg Vorbis
    files is with Brasero, which we first discussed in Chapter 7. To go this route,
    place a blank CD in your drive (and let Nautilus pop up to handle it), and then
    select Applications > Sound & Video > Brasero Disc Burner. When Brasero appears,
    click Audio project. Now add any mix of audio formats to the blank area window.
    You can do this by navigating to the songs you have in the left pane and then
    clicking the Add button (or dragging the files to the right pane). You can also
    drag files from any Nautilus window to the right pane of the Brasero window.


    As you add songs to the Brasero window, a bar at the bottom of the window will
    show how much more space you have available on the disk (Figure 14-8). Keep an
    eye on it so not to queue more than your disk can hold. Once you are ready, just
    click the Burn button, and then click Burn in the setup window that appears after.
    A progress window will appear, and once the burn is complete, Brasero will let
    you know and eject your disk. You can take the disk, plot it in your car stereo
    or wherever you want to play, enjoy it.


