- pgno: 266
  md: 'Most people who don''t use spreadsheets think of them as sort of giant calculators
    used for computing uncomfortably large sets of numbers, such as payrolls (which
    was the original purpose of such applications). That''s right, of course, but
    spreadsheets can be used for everyday tasks, such as projecting household budgets,
    calculating grade averages (by teachers or students), figuring out how long it
    will take you to save up for your trip to Hungary, or even comparing the seat
    heights for the four motorcycles you are trying to choose among. And when doing
    any of these minor mathematical tasks, you can easily create graphs in order to
    make all the abstract numbers speak to you.


    If numbers are just not your thing, you can still use Calc for creating lists
    of information, such as birthday lists, class rosters, shopping lists, address
    lists . . . whatever. You can even have Calc put the lists into alphabetical order,
    sort them by date of birth, and so on. Everyone eventually seems to find some
    use for Calc, so don''t ignore it entirely.


    And if you are still not convinced that Calc has a place in your life, you might
    at least find some amusement from an Easter egg hidden within the program, which
    allows you to play a Space Invaders clone called Star-Wars (Figure 12-3). Just
    type=GAME("Starwars") into any cell in Calc, and press ENTER. The instructions
    are in German, but it should be easy enough to figure out how to play if you don''t
    remember any of your high-school Deutsch.


    | StarWars Galaxy (c)96 by Updaters / TRI & NF |

    |---||

    | Terminator New | Rockets: [] Fighter 3 Level 1 Score 0000000 |


    Figure 12-3: Space Invaders in OpenOffice.org Calc? Yup.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Impress


    Impress is OpenOffice.org''s answer to Microsoft''s PowerPoint, with which it
    is compatible. It allows you to create attractive slides for use in presentations
    and also allows you to create notes or handouts to accompany them. Although these
    features make Impress quite handy in business and education settings, you may
    not find much value in it as a home user.


    # Draw


    More to the home user is OpenOffice.org Draw. Although Draw isn''t great for creating
    true graphics in the artistic sense, it is very useful for creating flowcharts,
    organizational diagrams (such as setting arrangements for wedding receptions or
    conferences), or any other document in which you want a bit more control over
    the placement of text and graphics (especially when the two are combined), such
    as fliers, awards, diagrams, and newsletters. In this sense, Draw can be used
    quite effectively as a simple page layout program, as you can see in Figure 12-4.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_267_0.png)


    Figure 12-4: A newsletter created (and displayed) in OpenOffice.org Draw


    # Microsoft Office and OpenOffice.org File Compatibility


    Although I mention the point throughout this section, it is worthwhile to reemphasize
    that OpenOffice.org can read and write Microsoft Office files. This compatibility
    is good enough, though sometimes prove slightly problematic.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'To read Microsoft Office files, all you need to do is double-click the file
    in question, and it will open in the appropriate OpenOffice.org module. When saving
    files within OpenOffice.org to use earlier versions of Microsoft Office, however,
    you must save them into the appropriate format (.odt for Writer documents, .ods
    for Calc documents, and .odp for Impress documents) by default, and only the most
    recent versions of Office can deal with these files.

    To this when saving a file, click the small + next to the Word File type in the
    Save window, and select the appropriate Microsoft Office format from the list
    of available file formats that appears below—choose Word 97/2000/XP for a Writer
    document, for example.


    # # OpenOffice Features


    The three main applications in OpenOffice.org (Writer, Calc and Impress) are quite
    similar to their pre-Office 2007 equivalents in Microsoft Office (Word, Excel,
    and PowerPoint), switching to the OpenOffice.org applications should be relatively
    easy if you were weaned on those versions of Microsoft Office.


    If you don''t have any experience with Microsoft Office, you should still find
    it straightforward, because the basic layout is intuitive. And if you are lacking
    in the intuition department, the built-in Help files are pretty good, To help
    you along, the Tips system just like tool tips in the Windows and Mac worlds.
    (In case you''re not what I''m talking about, tool tips are those yellow boxes
    that pop up to tell you what a button or menu item does when you place your mouse
    over that feature is What''s, which is a more detailed version of the Tips system.
    If you select Help → What''s This, your cursor will turn into a little question
    mark. Move that question mark cursor almost any item in the OpenOffice.org interface,
    and you''ll find out what it does rather than just what the item is called.


    Despite all the straightforward I am speaking of, a few interface items will likely
    be unfamiliar to you. That being the case, I will briefly discuss these items.
    I''ll be using the word processor, Writer, as I describe these, so if you want
    to run OpenOffice.org while following along, Writer might be a convenient starting
    point for you too.


    # # Getting to Know the Buttons


    Although you should be able to figure out what most of the buttons on the OpenOffice.org
    toolbars, a few buttons are common to all OpenOffice modules and deserve a bit
    more explanation.


    # # Export to PDF


    The Export to the PDF button is situated to the left of the two printer buttons
    (Print and Page Preview). You can use this button to export, or save, your document
    as a PDF file.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_268_0.png)'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Hyperlink


    Clicking the Hyperlink button, the button to the left of the Table button, opens
    the Hyperlink window, from which you can assign links to specified documents—not
    only to web pages but also to documents on an individual computer and although
    a hyperlink on a web page is something we have all come to take for granted, the
    idea of hyperlinking between text documents sounds like a pretty radical concept.
    It is, in fact, a rather old one that has been around before you or I even heard
    of.


    # Navigator


    The fourth to the last button in the top row (the one that looks like a starburst)
    is the Navigator button. Clicking this button (or just pressing the F5 key) opens
    the Navigator window (see Figure 12-5), which is a pretty cool navigational feature
    that comes in handy when working with length or otherwise complex documents.


    The Navigator allows you to easily bounce and forth between pages there, such
    as sections, links, and so on. Let''s say you have a document with lots of illustrations
    in it (like this chapter), you would jump directly to graphic. In this, you would
    double-click the word *Graphics* in the main pane of the Navigator window and
    then click the jump buttons (the odd buttons to the left of the page number) to
    begin jumping.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_269_0.png)


    Figure 12-5: The Navigator window


    If you are dealing with a document containing various heading levels, such as
    all of the chapters in this book, you can also use Navigator to switch among those
    levels. Say you''ve decided to add a new heading at the last minute to a document
    you''ve writing. You thus need to drop all of the headings you had before down
    a notch; the former main heading becoming a subheading. By double-clicking the
    word *Headings*, the text of all the headings you have listed in the document
    appears. You can then select a heading in that list and click the Demote Level
    button (that''s the one at the far right of the second row of buttons) to move
    it down a level.


    Penguins at Work 233'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Gallery


    To the right of the Navigator button is the Gallery button. By clicking this button,
    the Gallery, a library of graphical elements for use in your documents or web
    pages, will appear in a separate pane at the top of your document window (see
    Figure 12-6). The elements within the Gallery range various types of buttons to
    colored three-dimensional doughnuts, and you can even add items of your own.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_270_0.png)


    Figure 12-6: The Gallery


    Inserting a graphic into your document is a simple task even when not using the
    Gallery. All you need to do is select **Insert ▸ Picture ▸ From File** and then
    locate the image file that you want to insert. It can be handier to use the Gallery,
    however, when you intend to use custom graphics. Once in the Gallery, your graphics
    are always only a click or two away and can be conveniently viewed in the Gallery
    browser window.


    The collection of artwork that comes with OpenOffice.org is mostly geared towards
    building web pages, but other clip art is available elsewhere. For example, you
    can find a great collection online at http://www.openclipart.org/. Everything
    there is in the public domain, so it is all free to use. Be sure to check out
    the "Game badge" collection—it''s one of my favorites.


    Adding these (or any other) graphics to the Gallery is relatively easy to do.
    First you have create a new category (called a *theme*) for each group of images
    you want to add. To create a Gallery theme of your own, click the New Theme button
    in the Gallery window. This will open the New Theme window, where you should give
    your theme a name. Once you''ve done that, click the **Files** tab and then the
    **Find Files** button, which will open the Select Path window. From there you
    can navigate to the folder


    234 Chapter 12'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'in which you are storing your clip art, photos, or other graphics. Once you
    have found the folder, click the OK button, after which a list of all the files
    in that folder will appear in the Properties of New Window.


    From this window, you can easily add images to your new Gallery by clicking the
    name of each image to add (you might want to make sure the box to the word Preview
    is checked to make things a bit easier) and then clicking the Add button. Once
    you have done that, copy of the image will immediately appear in the Gallery browser
    your theme, where it will remain for future use (Figure 12-7). When you are adding
    images to your new theme, click the OK button, after which the Properties of New
    Window will close, revealing your new name and its contents. To use one of the
    images in the Gallery, right-click the image to insert into your document, choose
    Insert, and then select Copy or Link in the pop-up menu.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_271_0.png)


    Figure 12-7: Viewing clip art and your own collections in the Gallery


    # Styles and Formatting


    The final stop on our tour through OpenOffice.org''s unfamiliar buttons is the
    Styles and Formatting button, which is located at the far left side of the second
    row of buttons. This button acts as a toggle for the Styles and Formatting window
    (Figure 12-8), from which you can select and apply any styles to any of


    Penguins at Work 235'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'various elements within your document. Oh, and if you just can''t take your
    hands off the keyboard for a moment to fiddle with the mouse, you can also open
    the window by pressing the F11 key.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_272_0.png)


    Figure 12-8: The Styles and Formatting window


    To give you an example of how convenient styles can be, imagine that you are typing
    a bibliography page for some document you''ve prepared. You typed each entry as
    you might any paragraph, as in the following:


    > Smythe, W. (2004). Reconsidering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Society of Elves, Faeries, and Garden
    Gnomes, 20 (2), 125-147.


    Like most paragraphs you type, the entry is formatted as a first-line indent,
    which is fine and dancy that you want the norm for bibliography entries. Rather
    than messing around with tabs or margins to get the ways you want, all you have
    to click your mouse anywhere within the paragraph and then double-click the Hanging
    indent entry in the Styles and Formatting window. After that, as if by magic you
    know better), the transformation is made:


    > Smythe, W. (2004). Reconsidering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Society of Elves, Faeries, and Garden
    Gnomes, 20 (2), 125-147.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'You could follow the same procedure for each of your other entries or, with
    Hanging indent selected, click the paint can button in the Styles and Formatting
    window, after which your mouse cursor, when placed over the document, will appear
    as a paint can. Click in any paragraph in your bibliography, and that entry, too,
    will be formatted in the new style. The process is essentially the same when applying
    different styles to any other document elements.


    One thing might annoy you when using the Styles and Formatting window is that
    it can be a pain at times, floating around as it does. It has a tendency to get
    in the way of your text no more than you put it. Sure, you can toggle it on and
    off, but if you''re using it a number of times within the same document, this
    can get old too.


    A compromise is to dock the Styles and Formatting window into the main document
    window. You can do this by dragging the Styles and Formatting window into the
    top-left or top-right corner of the document area. When an outline of the Styles
    and Formatting window appears around the in-document portion of the window (as
    you can see in Figure 12-9), release the mouse button. The Styles and Formatting
    window will now appear as a pane on the side of the document window (Figure 12-10).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_273_0.png)


    Figure 12-9: Preparing to dock the Styles and Formatting window into place within
    the main document window'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Word Processing Done Lightly with AbiWord


    If OpenOffice.org''s Writer is a bit more powerful than what you need for your
    everyday word processing chores and you prefer something that pops up as you click
    the launcher, you might want to consider giving another word processor, AbiWord,
    a try (Figure 12-11).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_274_0.png)


    Figure 12-10: The Styles and Formatting window in place as a pane with the main
    document window


    ![](img/58abec7ac6c22ade6357fd77ea421da3_274_1.png)


    238 Chapter 12'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'AbiWord has a straightforward and easy-to-use interface, which you should be
    able to figure out without much, if, any. It also has a couple of rather interesting
    features, such as its autoresize function, which magnifies the onscreen document
    size (fonts, images, and everything) or shrinks it as you increase or decrease
    the size of the program window. And AbiWord can read and save Microsoft Word DOC
    files and save documents as PDF files.


    You can easily install AbiWord via the Ubuntu Software Center by performing a
    search for abiword. Once you have AbiWord installed, you can run it by selecting
    Applications ▸ Office ▸ AbiWord.


    # Some Other Cool Productivity Apps


    In addition to the more traditional office applications, a number of other applications
    are either included with or available for your system that can be grouped under
    the “productivity” label. I will introduce a few of those to here.


    # Sticky Notes


    Mac users will be familiar with the digital version of the now ubiquitous yellow
    Post-it like notes called Sticky Notes (Figure 12-12) that come as part of the
    GNOME’s Sticky Notes is a panel applet that you can add to your own panel by right-clicking
    any open panel space and then selecting Add to Panel in the pop-up menu, and then
    click the Add to Panel window appears, click Sticky Notes, and then click the
    Add button. Close the Add window by clicking Close. You will be ready for note-taking
    action.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_275_0.png)


    Figure 12-12: GNOME’s Sticky Notes'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Tomboy


    Sticky Notes doesn''t cut it for you and your more dramatic note-taking needs,
    perhaps you will find yourself better served by another application that comes
    with your system, called Tomboy (Figure 12-13). Like Sticky Notes, Tomboy also
    works as a panel app, but it is a bit more featured, albeit making any claims
    to stickiness. the various notes can be viewed by selecting them from the menu
    that appears when you click the Tomboy panel app.


    What gives Tomboy its bragging rights, however, is its search and hyperlink functions.
    These allow you to search for entries within your Tomboy note library and create
    hyperlinks that connect in one note to another linked node. In fact, Tomboy will
    automatically create a hyperlink whenever you type a word that matches (or at
    least useful) note headings, to make of it even more exciting—its plug-in features,
    allow you to export notes to HTML or print them, either as hard copy or as PDF
    docs.


    If you''d like to try Tomboy, start it by selecting Applications > Tomboy Notes,
    after which Tomboy will appear in the GNOME panel.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_276_0.png)


    > Figure 12-13: Notes taken seriously—Tomboy


    # GnuCash


    If you are familiar with the personal financial management software Quicken, then
    you might be interested in GnuCash, which is the Linux world''s best-known offering
    in the personal finance arena. It reads Quicken and Intuit QIF files, which makes
    things even nicer should you should be making the transition from another operating
    system. Unfortunately, unless you live in Germany, you cannot use GnuCash for
    online banking. but as the GnuCash folks-themselves, don''t blame them; blame
    your bank.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'To install GnuCash, just do an Ubuntu Software Center search for gnucash, and
    install both gnucash and gnucash-docs. Once these are installed, you can run the
    application by selecting Applications > Office > GnuCash


    # Scribus


    To round things out, we come to a open source desktop publishing application,
    Scribus (Figure 12-14), for those times when OpenOffice Writer and Draw just don''t
    cut it. Scribus is designed to produce commercial-grade output, with support for
    professional publishing features, as CMYK colors, PostScript handling, and creation
    of color separations, to make a name for few.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_277_0.png)


    You can download and install Scribus by doing an Ubuntu Software Center search
    for scribus. Once the installation is complete, you can run the application by
    selecting Applications > Graphics > Scribus.'
  merge: -1
  img_proc: true
