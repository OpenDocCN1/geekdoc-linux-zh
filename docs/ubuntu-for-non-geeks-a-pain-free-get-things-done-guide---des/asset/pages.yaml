    **Don''t send loads of text.** Sending more than a few lines of text at once is
    called flooding. It makes it difficult for other people to have a conversation,
    so you should avoid doing it. If you have lots of text that you need to read,
    use a service like http://pastebin.com/ to hold the text, and simply post a link
    to it IRC.


    **Stay on-topic.** There are different channels for different purposes, so you
    should try to stick to the topic for which a channel is intended. Advertising
    is considered to be off-topic in many channels and is particularly frowned upon.


    **Smile for the camera.** Most of the conversations in the public Ubuntu chat
    rooms are logged and can be viewed at http://irclogs.ubuntu.com/. This is useful
    if you forgot a link that someone mentioned last week, but it could be awkward
    if you said something you shouldn''t. As a general rule, never post any sensitive
    or personal information on IRC (especially your password or credit card details),
    because it could come back to bite you.


    # More Help with IRC


    I hope this expedition into IRC hasn''t put you off for life. Lots of people will
    find it confusing at first, but it''s a really great way to talk to other Ubuntu
    users you''re comfortable with. If you feel you need to hone your IRC skills,
    the IRC Help website at http://www.irchelp.org/ is a very useful resource.


    # An IRC Alternative: Mailing Lists


    If you can''t get the hang of IRC, there''s another, more gentle, option available
    to you in the form of the support mailing lists. All you need to do is send an
    email to the appropriate list and hope for a reply. Visit http://lists.ubuntu.com/
    to see your options—the ubuntu-users list is probably the one you.


    # Keeping Up with the News


    If you want to find out what''s going on in Ubuntu-land, there''s no shortage
    of news outlets. Here are a few of them (you''ll also find additional resources
    in Appendix D):


    **Full Circle Magazine** (http://fullcirclemagazine.org/): Full Circle is an independently
    produced Ubuntu magazine that is free to download in PDF. It contains everything
    you might expect to find in a traditional dead-tree magazine, such as reviews,
    interviews, stories from readers, and how-to guides.'
