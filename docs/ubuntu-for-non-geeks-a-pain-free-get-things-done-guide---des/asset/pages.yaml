  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_148_0.png)


    # # USB Storage Devices


    Unless have been under a digital rock for the past few years, you are no doubt
    familiar with USB devices. Your printer is very likely a USB device, as is your
    scanner. And although your digital camera is not a USB device in the traditional
    sense, chances are every time you connect it to your computer in transfer photos,
    you are doing so via a USB connector.


    Among the most popular USB devices out there are used for file storage. These
    include external hard disks, flash memory card readers, and the tiny, finger-sized
    devices known as *flash drives* (Figure 7-16). Flash drives are especially popular
    today and deserved so: they are inexpensive, handy when you need to transfer large
    amounts of data, and perfectly safe in terms of cross-platform (including Linux)
    compatibility.


    Working with USB storage devices is really easy. Just plug the device into one
    of the USB ports on your computer. The LED on the device will do a bit of blinking
    while the system reads what''s on, and after that, a disc icon for that device
    will appear on your desktop. A few moments later, a Nautilus window will open,
    revealing the contents of the device. An icon for the USB device will also appear
    in the side pane of the Nautilus window. You can then copy files and from the
    device using the drag-and-drop or copy-and-paste procedures I mentioned earlier
    in this chapter.


    Once you are done and want to remove the device, right-click its disk icon, and
    select **Safely Remove Drive** in the pop-up menu. (You can also rightclick the
    icon in the Nautilus side pane and select the same option.) If there is any data
    that needs to be written to the device, the system will start writing. Once it''s
    complete, the icon for the device will disappear from the desktop and Nautilus
    folder. Make sure that you always safely remove USB drives like this, rather than
    simply disconnecting them—otherwise, you risk losing data.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_149_0.png)


    # # Working with Bluetooth Devices


    While we''re on the topic of file handling, it is probably a good time to learn
    how to work with Bluetooth devices. As I mentioned in Chapter 3, if you have a
    Bluetooth adapter in your machine, either built in or plugged into a USB port,
    a Bluetooth icon will appear in the right half of the GNOME panel.


    # ## Pairing Devices


    Before you can transfer files between your Bluetooth devices, you need to pair
    them. This is how you do it:


    +   - Click the Bluetooth icon in the top panel, and select **Set up new device**.

    - In the Bluetooth setup wizard that appears, click **Forward**.

    - Ubuntu will then search for Bluetooth devices in the vicinity of your computer.
    Once it discovers a device, that device will appear in the center of the window,
    as in Figure 7-17. Once the device you want to pair appears, click it, and then
    click the **Forward**.

    - In the next page of the wizard, a personal identification number (PIN) will
    appear (Figure 7-18). An input window should also appear in the Bluetooth device
    you''re trying to connect to. Input the PIN into that input box.

    - Assuming the pairing is successful, the final page of the wizard will then appear.
    Click **Close** to complete the pairing process.'
  merge: -1
  img_proc: true
