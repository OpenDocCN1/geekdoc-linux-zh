- pgno: 95
  md: '# 5


    # # SLIPPING AND SLIDING


    Exploring the Internet, Linux Style


    ![](img/58abec7ac6c22ade6357fd77ea421da3_95_0.png)


    Now that you have a working Internet connection, what can you you do with it?
    The good news is that Linux can match anything that your previous operating system
    could do online, and in many cases it can do it faster or more easily. Ubuntu
    was born on the Web, so it should be no surprise that it comes with a very healthy
    suite of Internet-ready applications right out of the box.


    In this chapter, you''ll take a tour of Ubuntu''s Internet software so you can
    start really getting a feel for what this Linux stuff is capable of. You''ll begin
    with old stalwarts like the web browser and email client, tour briefly through
    instant messaging, and then head off in the more modish direction of Twitter and
    microblogging.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Firefox: Your Internet Browser


    The default web browser in your Ubuntu system is Firefox, which is enjoying increasing
    popularity in not only the Linux world but in the Windows and Mac worlds as well.
    Chances are you already a Firefox user, but if you are not, then you needn''t
    worry—things work more or less in all browsers. That being the case, you should
    be able to use Firefox''s basic features without any instruction. Open. Open some
    of its features do distinguish Firefox from its competition, I will mention these.


    # Controlling Browser Window Clutter with Tabs


    Usually when you click a link on a web page, the new page opens in the same window.
    On some pages, links are coded so that the new page opens in a new, separate window,
    or maybe you occasionally open a link in a new window by right-clicking the link
    and selecting the Open Link in New Window option. This can be very useful; however,
    once you have a few browser windows open, it gets sort of hard to find what you''re
    looking for in all open windows. It can also slow down a bit.


    This is where Firefox''s tab feature comes handy (handy, in fact, that almost
    every other there has copied it). To see how it works, try it right here and now.
    Open your Firefox browser by clicking the launcher on the GNOME panel (or selecting
    Applications ▶ Firefox Web Browser); then search for the word nyckelharpa using
    Firefox''s handy box, and by default, Firefox will perform searches for keywords
    entered in the search box using Google. You can, if you like, select other websites
    to search by clicking the colored icon in the search box and making your selection.
    Amazon.com, eBay, and Yahoo! are available, to name a few, and you can even add
    others. For now, let''s stick to Google for our search, typing nyckelharpa in
    that search box. Once you''ve finished typing, press the ENTER key, after which
    a page of results appears in the main pane of the Firefox window.


    One of the results should be the American Nyckelharpa Association, and you are
    now going to open that page in a new tab, rather than in the same or a new window.
    To do that, right-click the link, and in the pop-up menu that appears, select
    Open Link in New Tab. You can, if you prefer, make things a tad easier and dispense
    with the pop-up menu selection by simply clicking the link with the middle mouse
    button (or with both buttons simultaneously) or by holding down the CTRL key as
    you click the link. Either way, the new page will appear in a new tab, while your
    original page of search results remains, ready and waiting in the other tab (see
    Figure 5-2). I am pretty confident in saying, once you get used to this feature,
    you will wonder how you ever got along without it.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '*Slipping and Sliding 61*'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Keeping Up-to-Date with Live Bookmarks


    The Web is awash with all sorts of news and information, and it can be hard to
    keep tabs on it all. Personally, I hate missing my daily dose of offbeat stories
    from Boinging, the aptly "directory of wonderful things"http://www.boinging.net/).
    Fortunately, Firefox has a new way of dealing with information overload, called
    live bookmarks (also known as RSS feeds). They provide you with an automatically
    updated list of articles from any website that supports them. To see an example,
    click the Latest Headlines underneath Firefox’s address bar—it’s a live bookmark
    for the BBC News website and show you a list of current news stories.


    You can check whether a website has an RSS feed by looking in the address bar
    for an orange symbol (like the one shown in Figure 5-3). If it has, you’re in
    business! Let’s use Boinging as an example: Load http://www.boinging.net/ in Firefox,
    and click the beacon icon. You’ll get a list of the most recent articles on the
    page with an invitation to subscribe to the feed in the box at the top of the
    page. Subscribe Now, and in the window that appears, click Subscribe to add the
    live bookmark to the toolbar as well.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_98_0.png)


    Figure 5-3: The beacon icon is displayed when a website has an associated RSS
    feed.


    Some websites provide links to their RSS feeds rather than showing them in the
    address bar. If you find one of these links (it’s normally ATOM or RSS/XML), click
    it, and you should be taken to a list of articles with a box at the top, like
    in the previous example. From there, the steps for adding the feed to your bookmarks
    are the same.


    # Pop-up Manager


    Firefox has a number of other useful features. One is its Popup Manager, which
    suppresses those annoying pop-up windows that often appear when you access a new
    web page. You can enable or disable this feature from the Preferences window (Edit
    + Preferences) by clicking the Content icon in the top pane of that window and
    then checking or unchecking the Block pop-up windows. You can also permit sites
    to see pop-up windows (some pop-ups are not only useful but necessary for the
    correct functioning of a site) by clicking the Exceptions to the right of Block
    pop-up windows entry and inputting the web address for the site in question.


    # Multimedia Plug-ins


    One of the coolest things about Firefox is that it allows you to further expand
    its functionality by adding extensions. The most commonly used extensions come
    in the form of plug-ins. These allow web pages to do much more than just display
    text and pictures—you need a plug-in to watch videos or play games. Three plug-ins
    are used far more widely than any others, so I’ll concentrate on those here.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Flash


    The most frequently used browser plug-in for any system is Adobe’s Flash Player.
    Flash provides websites with all sorts of exciting multimedia effects and capabilities,
    and as a result, it is used by an ever-increasing number of sites. In fact, you''ve
    probably seen numerous Flash-enhanced pages without being aware of it. For example,
    if you''ve watched a video on YouTube, you''ve enjoyed the wonders of Flash.


    How do you get the Flash plug-in? Well, all it takes is a few clicks and a working
    Internet connection:


    +   1. Select Actions ▸ Ubuntu Software Center to open the Software Center.

    2. Type adobe **flash** in the search box at the top right of the window.

    3. In the list that appears, click the Adobe Flash plug-in** item once. An Install
    button will appear (Figure 5-4).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_99_0.png)


    +   4. Click **Install** then, if prompted, type your password, and click **Authenticate**.
    The plug-in will be downloaded and installed.


    +   5. When the plug-in has finished installing, a green check will appear next
    to the Adobe Flash plug-in’s icon in the list. Close the Ubuntu Software Center,
    and open Firefox (if it was already open, close it, then start it again).


    +   6. To check that the plug-in is working, find a site that uses Flash. If you
    don''t know of one offhand, try YouTube (http://www.youtube.com/). Once you have
    arrived at YouTube, click any video you see. If Flash was installed successfully,
    a video should appear and start playing (Figure 5-5).'
  merge: -1
  img_proc: true
- pgno: 100
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_100_0.png)



    Figure 5-5: Playing a YouTube video after installing the Flash plug-in


    # Silverlight


    A relative newcomer to the plug-in scene is Microsoft''s Silverlight. It''s less
    common than Flash but seems to be used on the websites of TV channels and major
    sporting events quite a lot. Unfortunately, Microsoft is a little behind the times,
    and it hasn''t made Silverlight available for Linux yet. But never fear: An alternative,
    open source plug-in called Moonlight is available. To install Moonlight, follow
    these steps:


    +   1. Open Firefox, and browse to http://www.go-mono.com/moonlight/.


    +   2. Click the Install button on the Moonlight page, and scroll down to section
    3, Download the plug-in.


    +   3. Now, click the green down-pointing arrow. A narrow bar will appear at the
    top of the screen saying that the website was prevented from installing software.


    +   4. Click the Allow button in the (usually black) bar, and a Software Installation
    window will pop up. Click Install Now, and wait for the plug-in to download.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '5. Once that''s finished, another bar will appear at the top of the Add-ons
    window. Click Restart Firefox to finish installing the plug-in (all of the pages
    that you have open reopen when Firefox opens again).


    6. Head over to http://www.farseergames.com/waterdemo/. If Moonlight was installed
    properly, you should now see a little boat bobbing around on the waves (Figure
    5-6).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_101_0.png)


    Figure 5-6: Checking that the Moonlight plug-in is working properly


    Some Silverlight/Moonlight-enabled websites might require you to install extra
    plug-ins, especially if they are trying to display videos. If this is the case,
    yet another bar will appear at the top of the page, telling you that plug-ins
    are missing. Click the Install Missing Plugins button, and follow the onscreen
    instructions to install everything that you need.


    # Java


    One plug-in that you''re likely to encounter is Java, which is used to run Java
    applets. A Java app is a little application that you can run in your browser,
    and they''re commonly used for games and demonstrations. Ubuntu comes preinstalled
    with a Java plug called IcedTea, so there''s no need to install anything extra.
    It''s still a good idea to take a look at it in action, though, so head over to
    http://www.turbotanks.com/. An arcade "tanks" game should load if IcedTea is working
    properly (Figure 5-7).'
  merge: -1
  img_proc: true
- pgno: 102
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_102_0.png)


    Figure 5-7: Running the TurboTanks game in Firefox


    # # Project 5: Installing Firefox Extensions


    The plug-ins I covered earlier are near-essentials that pretty much everyone has
    installed, but hundreds of other, less vital extensions are available for Firefox
    too. These come in the form of add-ons and include all of sorts; many are quite
    functional, while others are just plain fun and goofy. range from blog-writing
    tools and to-do lists to image viewers and travel guides. For this project, however,
    you will install a blog editor SccribeFire (Figure 5-8) that allows you to write
    entries, log in to your blog, and upload your addition. All of this is available
    at the click of a button or an icon in the bottom-right corner of the window.


    If you don''t have a blog but you''d like to give blogging a try, you can sign
    up for an account on a free hosting website, such as http://www.blogger.com/,
    http:// wordpress.com/, http://www.tumblr.com/, or http://www.livejournal.com/.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_103_0.png)


    # # 5-1: Downloading and Installing the ScribeFire Extension


    To get started with the process of installing any Firefox extension, you have
    to first find and download one. To do this, go to the Firefox **Tools** menu,
    and select **Add-ons**. The Add-ons window will then appear, showing you the extensions,
    themes, and plug-ins you already have installed. To add the ScribeFire extension,
    click the **Get Add-ons** button in the pane at the top of the window, after which
    Firefox will make some download recommendations that you can accept or ignore.


    ScribeFire wasn''t one of recommendations at the time of writing, and chances
    are that it won''t be you when you open the Add-ons window either. This being
    the case, just do a search for *scribefire* in the search box (Figure 5-9). Once
    you find it, click the **Add to Firefox** button.


    A Software Installation window like the one shown in Figure 5-10 will then appear.
    Just click the **Install Now** button in that window after it becomes active to
    start the installation.


    Slipping and Sliding 67'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Figure 5-9: Adding extensions in Firefox


    ![](img/58abec7ac6c22ade6357fd77ea421da3_104_0.png)


    Figure 5-10: Firefox gives you a preinstallation warning.


    Once the installation process is complete, a message will appear in the Add-ons
