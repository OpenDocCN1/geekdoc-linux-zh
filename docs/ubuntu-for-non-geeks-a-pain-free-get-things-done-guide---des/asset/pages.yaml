  md: '# ACKNOWLEDGMENTS


    There are a good number of people who deserve thanks for the help and support
    they provided either while or before this book was written, and there are still
    others whose help will come after the book is released. I (Rickford) would like
    to acknowledge all of them now.


    Starting with my family and friends, I''d like to thank my mother, Dixie Angelina
    Burckel-Testa; my auntie and uncle, Danica Lucia and David Zollars; and Sumire,
    who continues to inspire me with her art and creativity. And, somewhere in the
    dimension between family and geistfreund, a special shout-out to Mini—“Pakakalaki!"
    I also send thanks to my long-time friends Donald Hammang, Tracy Nakajima, and
    Kimberly Jo Burke, who help to give me a needed sense of continuity and balance;
    and to my dear friends back in Japan, Keith Hagen, Enyo Nagata, and Setsu Usaka,
    who keep me connected with the sensibilities and joys I acquired. Very special
    thanks also go out to my godfather, Theorphan, who is an always kind and patient
    ear for my incoherent ramblings and who does his best to keep me relatively sane
    in the context of my otherwise whacko world.


    In the production of any book, editors are very important, and I would like to
    thank the editor of this edition of Ubuntu for Non-Geeks, Keith Fancher, who had
    the uneniable task of dealing with files flying in two different authors, one
    of whom (me) is particularly good at mocking things up in the numbering and attachments
    department. Good job, Keith! Thanks also go out to Milo Casagrande, the technical
    editor on this edition, who did'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'best to ensure that all the details in the book were straight duck, and Kim
    Wimpsett, the copeditor, made sure that every i crossed and of orphaned text was
    found and dealt with. Thanks to those folks whose job it is to turn the humble
    of text and images we submit into a book—Megan Dunchak, Ansel Stanton, and Riley
    Hoffman, who taught us a thing or two about indexing. And finally, a very special
    set of these went out to William Pollock for not only taking a chance on the completely
    unknown writer that I was also for turning me on a great pupuseria in San Mateo,
    California.


    Having worked on my own for the previous editions of this book, working with a
    coauthor this time was a new and pleasant experience, and for reason I would also
    like to add a couple of lines to that coauthor, Phil Bull. Working with Phil not
    only provided me with some inspiration and ideas for the book, but it also made
    working on this edition a lot more and fun less than working on the previous editions
    I had. It''s always nice to have to bounce around it.


    Finally, a special thanks to my sweet little black cat and dear feline friend,
    who despite protesting as I spent her time writing this book, continues to listen
