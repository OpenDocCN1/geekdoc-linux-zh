- pgno: 307
  md: '# Project 14C: Listening to RealMedia Streams with RealPlayer


    Now that you know how to play MP3 Internet broadcast streams, it is time to help
    round out your system by installing RealPlayer 11 (Figure 14-9). Although not
    common in the past, RealMedia streams are still widely available on the Internet.
    You can also use RealPlayer to play RealVideo streams, when they''re available.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_307_0.png)


    Figure 14-9: RealPlayer


    # 14C-1: Downloading and Installing RealPlayer


    Installing RealPlayer in Ubuntu, once a hit-or-miss sort of minor pain, is easier
    than it''s ever been before, so you can rest easy you go through this project.
    Here''s what you need to do:


    +   1. Open Firefox, go to http://www.real.com/realplayer/linux/, and click the
    Download Deb Installer link.

    2. In the window that then appears, accept the default option, Open with Gdebi
    Package Installer, by clicking OK.

    3. A Package Installer will soon open showing what you are about to install. Click
    the Install Package button, and provide your password when prompted.


    In a few seconds, RealPlayer and all the dependencies your system requires to
    run RealPlayer will be installed. When the process is done, close the Package
    Installer.


    # 14C-2: Setting Up RealPlayer and Testing Your Installation


    Once RealPlayer 11 is installed on your machine, you will need to go through the
    final setup steps and test it all. You can start by selecting Applications > Sound
    & Video > RealPlayer 11. A simple setup wizard will appear, which will have no
    trouble with your own, because all you really have to do is click the button in
    the bottom-right corner of the window a few times. Once you have completed the
    wizard, the RealPlayer window will appear.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'You can test your installation of RealPlayer by making your way to a website
    with RealAudio content, such as http://www.notmuch.com/. Click the link for any
    file you want to play, after which a window will appear asking what you want to
    do with the file. Accept the default, /opt/real/RealPlayer/realplay (default),
    by clicking OK. RealPlayer will then open, playing the stream you choose.


    # Other Cool Audio Apps


    The applications I have covered so far are only a taste of Ubuntu what has in
    store for you in its repositories. You can start by browsing the offers listed
    in the Ubuntu Software Center. Try them, keep them if you like them, or remove
    them if you don''t. After all, it doesn''t cost you anything in Linux.


    To give you a starting point, I will mention a few apps that might be worth investigating.


    # Alternative Players


    If the music that I''ve covered in this chapter has whetted your appetite for
    more, you are in luck—there are plenty of others, a browse through Ubuntu Software
    Center''s Sound & Video category will reveal. Check out Exile, Banshee, Audacious,
    and Listen to get started. Oh, and you''ll find out in Chapter 16, if you haven''t
    discovered it already, the Totem player comes with your system also as an audio
    player.


    # Streaming Music with Streamtuner


    If you are an Internet radio junkie, there is probably no application as useful
    as Streamtuner (Figure 14-10). Streamtuner is, as its name implies, an online
    radio stream tuner. It works by downloading lists of available streams from a
    variety of sources, which you can then easily browse. When you find something
    like, just select the stream, click the Tune in button, and the stream will open
    in the player of your choice. The default player for most streams is Audacious,
    when you download Streamtuner, the Ubuntu Software Center will also download Audacious,
    which is a pretty cool audio player. You can, however, switch the default player
    for Streamtuner playback by going to its Edit menu, selecting Preferences, and
    in the right pane of the Preferences window, changing the default applications
    for playback by typing the command for the application you want to use. This usually
    the name of the application in all lowercase letters. For example, if you want
    your playback to be from Totem, you will click Listen to a .m3u file, scroll to
    the right, and change audacious to totem.


    You''ll also be happy to know that you can rip the streams you are listening to
    (and even those you aren''t listening to) and save them as MP3 files. To record
    a stream from Streamtuner, just right-click the target stream, and select Record
    in the pop-up menu.'
  merge: -1
  img_proc: true
