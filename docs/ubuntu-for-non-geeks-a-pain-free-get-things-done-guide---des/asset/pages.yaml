    # Killer GEGLs from Outer Space


    ![](img/58abec7ac6c22ade6357fd77ea421da3_78_0.png)


    Level: 1. Lives: 3


    Figure 3-16: One of GNOME''s Wanda-related Easter eggs


    To try the other Easter egg, open the Run Application applet again, but this time
