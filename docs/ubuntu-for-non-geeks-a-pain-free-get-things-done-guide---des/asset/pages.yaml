- pgno: 105
  md: '# 5-2: Setting Up the ScribeFire Extension


    When Firefox starts up after you''ve installed the ScribeFire extension, you will
    see a small icon in the lower-right corner of the window. Just click that icon,
    and ScribeFire will appear as a resizable pane in the lower half of your current
    Firefox window. A ScribeFire Account Wizard will also pop up, asking for details
    about your blog. Follow the instructions to get it working with your blog.


    # Evolution with Evolution


    Evolution is the default email program in Ubuntu, and it is probably described
    as a better-groomed, spunkier clone of Microsoft Outlook (see Figure 5-12). It
    allows you to send and receive mail, make appointments, and keep a list of tasks.
    It can also filter junk mail, which is a necessity these days, and even synchronize
    with your Palm if you have one of those, if such things are important to you,
    it can connect to a Microsoft Exchange server.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_105_0.png)


    Figure 5-12: Evolution''s default email client—Evolution


    To start Evolution, just click the envelope icon (called the indicator applet)
    on the top panel, and select **Set Up Mail**; select **Evolution Mail**.


    > NOTE *The Set Up Mail option will change to just plain Mail once you''ve entered
    your account details.*


    When you run Evolution, you will be greeted by a setup wizard, that has the account
    details you received from your email provider. This should consist of your POP
    host address for receiving mail, your SMTP server for sending mail, and your password,
    which is different'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'from your Internet logon password. Your mail password is not actually entered
    during the various wizard steps, so check the Remember password checkbox when
    filling in the POP details. When you connect to your mail server, you will be
    prompted for your mail password, so you can type it at that time, and you won''t
    have to deal with it again.


    # An Email Alternative: Thunderbird


    Evolution is the fully featured email software in the Linux world, but despite
    its obvious attractions and popularity, I prefer the more straightforward Thunderbird
    for my email client. In contrast to the multifunctional Evolution, Thunderbird
    (Figure 5-13) is a more-oriented program that is very straightforward to use yet
    includes most of the most important email functions you''ve come to expect, such
    as junk mail filters. In fact, it is remarkably similar to Windows Mail in terms
    of appearance and handling. The fact that Thunderbird is also available in both
    Mac and Windows versions means you may be familiar with it.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_106_0.png)


    Figure 5-13: The Thunderbird email client


    Thunderbird does not bundled with Ubuntu, so if you want to try it, you will have
    to download it and install it yourself. Now that you have set up your machine
    to connect to the Internet, however, you can easily do this after going over the
    contents of Chapter 6 (OK, so I''m just jaining the gun bit again). Just do a
    search in the Ubuntu Software Center for Thunderbird, click the Thunderbird Mail/News
    item once, and click Install to install it. You may be asked to type the password
    for your Ubuntu user account, so that and click Authenticate. Once it is installed,
    you can run Thunderbird by selecting Applications > Internet > Mozilla Thunderbird
    Mail/News.'
