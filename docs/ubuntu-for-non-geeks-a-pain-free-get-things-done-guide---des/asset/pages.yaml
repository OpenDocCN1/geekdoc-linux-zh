    # When Will My Bug Be Fixed?


    Hundreds of new bugs are reported for Ubuntu every day, which isn''t so surprising
    when you think that there is something like 30,000 packages available for you
    to install. The sheer volume of bugs isn''t easy to cope with, and dealing with
    them has been likened to "drinking from a firehose." To calm the chaos, an army
    of volunteers called the Bug Squad took over all the bugs, categorizing, identifying
    ones that have been reported, asking for details on how the happens, and generally
    getting enough information for a developer to be swoop in and fix the issue. In
    practical terms, this means it can take a while for a problem to be fixed, the
    actual timescale will depend on how important the bug is judged to be. I normally
    reckon on waiting two months for an "average-bug" have. Having said, my Rhythmbox
    hasn''t been fixed yet, and it''s several years later! (To be fair, it was a particularly
    minor problem that people are ever likely to experience)


    Once a bug is fixed, its status is changed to Fixed Released, and the Ubuntu developers
    will often provide an updated package that you can install to fix the problem
    on your computer. Fixes aren''t made available straightforward, they have to go
    through a series of stringent tests to make sure they don''t screw up anything
    else. This means that some bug fixes might not be available until the next version
    of Ubuntu is released!


    # Faster Fixes


    If you know a problem has been fixed but an updated package hasn''t been released
    yet, there may be a way around the delay—if you don''t mind taking a small risk.
    When updates are being tested to get them ready for official release, they are
    available online for anyone to try. There''s a chance that the updated versions
    could cause problems (all, they''re being tested!), but they''re usually fine.
    There are also backported packages, which are officially updated versions of programs.
    These will have been tested, not just rigorously, so use them at your own risk
    too.


    To gain access to these less-stable packages, select System > Administration >
    Software Sources, and click the Updates tab. Make sure that Updated updates and
    Unsupported updates are checked (as in Figure 20-7),'
