    # # Choosing a Screensaver


    Screensavers used to be a must-have (and must-use) for computer users who wanted
    to prevent damage (burn-in) to their monitors. Video display technology, has now
    advanced to the point where screensavers are no longer necessary. Nevertheless,
    screensavers are cool to look at, and plenty are available online to supplement
    the 15 that come installed by default. Right out of the box, the screensaver is
    set up to blank your screensaver after 5 minutes. However, you can also choose
    to have the various screensavers randomly every few minutes, or you can opt for
    a single screensaver that you especially like. You can change these by selecting
    **System > Preferences > Screensaver**, after which the Screensaver window (Figure
    8-23) will appear.


    > > NOTE If you prefer a screensaver with a more personal touch, choose the Pictures
    folder from the list on the left of the window. This will display a slide show
    of all the photos in your Pictures folder when the screensaver is activated.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_185_0.png)


    Figure 8-23: Setting screensaver preferences'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Taking Screenshots


    Now that you know how to make your Ubuntu desktop look a bit more like your own,
    you might want to share or record the results of your artistic endeavors, and
    taking screenshots is the way to do that. The easiest way to go about this is
    by using Applications ▸ Take Screenshot.

    The Screenshot application, shown in Figure 8-24, will appear. In this window
    you can decide whether to take an image of the whole screen, a section of the
    screen, or a selected window. You can also add a delay before the screenshot is
    taken to give yourself some wiggle time. You can even add effects to your window
    shots, such as a drop shadow.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_186_0.png)


    Figure 8-24: Taking a screenshot in Ubuntu


    When you''re ready, click Take Screenshot, and a window like the one in Figure
    8-25 will appear. In that window, you can name the image and where to save it.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_186_1.png)


    Figure 8-25: Saving a screenshot in Ubuntu


    If you prefer, it is also possible to take screenshots via key combinations. To
    take a shot of the entire screen, press the PRINT SCREEN key. To take a shot of
    a single window, press ALT-PRINT SCREEN.


    If you trying screenshots of single window, you may find that the window borders
    refuse to appear no matter what you do. This is not a problem with the screenshot
    mechanism but rather side effect of your system''s visual effects engine, Compiz,
    which I''ll talk about more in the next section. One'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'solution is to use the GIMP for your screenshot-taking chores (discussed in
    Chapter 13). Alternatively, you can just shut off Compiz: Select System > Preferences
    Appearance, and click the Visual Effects tab in the Appearance Preferences window
    that appears. Once on that tab, select None (Figure 8-26); the change should take
    place almost immediately, and once it does, you can close the Appearance Preferences
    window and try your screenshot again.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_187_0.png)


    Figure 8-26: Shutting off Compiz using the Visual Effects tab


    #  Customizing Visual Effects


    Learning how to customize your system using the more traditional tools at your
    disposal, it''s time to let loose and have fun with the newest customization tools
    the Linux world has to offer. Compiz, Ubuntu’s visual effects engine, provides
    all sorts of wild and interesting visual effects for your desktop.


    Compiz will be automatically enabled at startup if you have a graphics card that
    supports its basic set of features. An easy way to tell whether Compiz has kicked
    in on your machine is to open any window (your home folder, for example) and then
    check to see whether that window has a drop shadow (see Figure 8-27 for an example).
    If it does, Compiz is at work.'
  merge: -1
