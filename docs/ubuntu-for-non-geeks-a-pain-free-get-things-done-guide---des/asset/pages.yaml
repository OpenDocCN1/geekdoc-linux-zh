- pgno: 122
  md: '# Adding Extra Software Repositories


    The Ubuntu software repositories contain more than 30,000 packages—enough to last
    a lifetime, or so you might think. But as it turns out, a whole world of software
    is waiting for you outside the official Ubuntu repositories, and it''s not much
    difficult to reach. Various individuals and companies compile small numbers of
    packages that are not available in Ubuntu into their third-party repositories.
    These are typically free to use, if you can find them. All you need to tell APT
    to search for packages in one of these repositories as well as Ubuntu''s, and
    you''ll be able to get at the extra software.


    Each repository has its own APT line that contains information about the repository,
    which APT uses to figure out sort of packages it contains. You will need to get
    the correct APT line from the website of the repository you''re trying to add,
    so pick an example to see how it works. Open Firefox, and head over to http://www.getdeb.net/updates/Ubuntu/all#how_to_install.
    GetDeb specializes in making packages for software that isn''t officially made
    into Ubuntu yet. There should be instructions on installing packages from GetDeb
    in a box at the top of the page, skip to the second item in the list and find
    the APT line, which should look something like: deb http://archive.getdeb.net/ubuntu/lucid-getdeb-apps.
    This follows the same format as all APT lines: the word deb, followed by a web
    address, followed by a couple of words that specify which part of the repository
    should be checked by APT when it''s looking for programs.


    When you''re in Firefox, you''ll also need to grab the repository''s GPG key (which
    I''ll explain at the end of this section). It should be linked to the same website
    you went for the APT line; in the case of GetDeb, go to http://archive.getdeb.net/getdeb-archive.key,
    when the Opening getdeb-archive window opens, select **Save File**, and click
    **OK** to save the key file.


    Now that you''re in possession of these vital bits of information, adding the
    repository to your system is pretty straightforward:


    +   Select **System ▸ Administration ▸ Software Sources**. Enter your password
    if asked, and then click the **Other Software** tab in the Software Sources window
    that appears.

    Click **Add**. You''ll be prompted to enter the APT line, so paste it into the
    box, and then click **Add Source** (Figure 6-7). A new entry should appear in
    the Other Source list.

    Select the **Authentication** tab, and click **Import Key File**. Use the window
    that appears to find the .key file you downloaded earlier. (It''s probably in
    your Downloads folder.)

    Select the .key* file by clicking it once, and then click **OK**. Check the list
    of trusted software providers to make sure that the GetDeb Automatic Signing Key
    is now present, as it is in Figure 6-8.'
  merge: -1
