- pgno: 184
  md: '# 8D-3: Logging In Automatically


    While you''re tinkering with the login screen, it seems like a good idea to mention
    some of the other login-related options that you can change. Log in your user
    account again, and select **System > Administration › Login Screen**. Click the
    **Unlock** button, and type your password to gain access to the settings in the
    Login Screen Settings that appears.


    If you''re the only person who uses the computer, you can save time by having
    your user account automatically log in with your username when the machine starts
    up. Select the **Log in as** option, and choose your username from the drop-down
    list (it should be selected automatically). If you''re not the only user but you''re
    the person who uses the computer for most of the time, there''s also a setting
    to give other people a chance to log before you''re logged in automatically. **Allow
    30 seconds for anyone else to log in first**, and change the amount of time you''d
    like GDM to wait before logging you in.


    The last option in this window (the one about default sessions) can be used to
    switch between different **desktop environments**. As you know, Ubuntu uses the
    GNOME desktop, but you can install others like KDE and Xfce. That''s a bit of
    a teaser for you-geeks out there—if you want to perform the ultimate customization
    and change the whole desktop environment, this is one of the settings you''re
    going to change. Changing desktops is beyond the scope of this book, though, I''m
    just going to leave it there! (If you''re interested in trying a different desktop
    environment, you might find hints at */help.ubuntu.com/community/FromUbuntuToKubuntu/*
    useful.)


    If you''re not keen on the sound that plays every time you log in, uncheck the
    Play log-in sound option in the Login Screen window.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_184_0.png)'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'When you''re happy with your changes, close the Login Screen Settings window,
    and restart your computer for the changes to take effect. Then, depending on which
    option you chose, you''ll be logged in straight-away or an Automatic Login button
    will appear and count down the seconds until you log in. In the latter case, you
