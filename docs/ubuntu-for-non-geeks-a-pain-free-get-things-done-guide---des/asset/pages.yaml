    #  18A-2: Unmounting Your Windows Partition


    You can unmount your Windows partition immediately after finishing your work with
    it, or you can just wait until you shut down your system, wherever it will be
    automatically unmounted. Before you unmount yourself, you must first make sure
    none of your programs is accessing files or folders on the partition. Nautilus
    and the Terminal are the usual suspects, so before unmounting, close any Nautilus
    or Terminal windows that are browsing partition. Once you''ve done that, click
    the eject icon next to the Windows partition in the side pane of a Nautilus window
    (Figure 18-2), or right-click and select Unmount.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_361_1.png)


    Figure 18-2: The Windows partition "OS" in the Nautilus side pane, complete with
    eject icon


    # Accessing a Linux Partition While Running Windows


    Viewing your Windows files in Ubuntu is not too stressful, as you have no found
    out. But what about going the other way and getting Windows to recognize your
    Linux partition? Unfortunately, Windows isn''t too helpful in this respect—it
    can only view FAT or NTFS-format partitions and has no built-in support for the
    ext format normally used by Linux. As such, if you need access to your Linux files
    in Windows, it''s probably easiest to create a separate FAT partition to be shared
    between both operating systems (see Appendix C). Hmm, not exactly convenient.'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'An alternative is to add support for Linux partitions into Windows by installing
