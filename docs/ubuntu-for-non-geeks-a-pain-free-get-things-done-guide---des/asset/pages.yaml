- pgno: 339
  md: '# Other Video Apps


    I''ve covered the main video applications in Ubuntu, but there are still others
    that you might want to consider, all of which are available via the Ubuntu Software
    Center. If you are interested in yet another alternative/DVD player, you can try
    GNOME MPlayer, which has long quite a significant following because of its ability
    to handle numerous video formats.


    Another cool application for video streaming enthusiasts is Miro TV (16-12), which
    allows you to easily search, download, and play online video streams. just perform
    an Ubuntu Software search for *miro*.


    If you have a webcam, you might also want to try an application called Cheese,
    which allows you to take pictures and videos from your webcam and add cod cool
    graphical effects. Camoramara is yet another webcam viewer/capture application
    to think about.


    If you''re looking for an alternative to PViTi and Kino, Avidemux. One very handy
    feature makes it worth having, even if you don''t use it as your main video editor:
    It can rip audio tracks from video files. You can get Avidemux from the Ubuntu
    Software Center. Be sure to install the GTK+ version (not the Qt one).


