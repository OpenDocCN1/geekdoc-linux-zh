- pgno: 169
  md: '# 8B-6: Downloading and Installing the Art Manager (GNOME Art)


    Searching the Internet for wallpaper to install in itself can be a fun adventure,
    but sometimes it can also feel like quite a chore. Fortunately for you, and all
    involved in such things, there is an even easier: the Art Manager. The Art Manager,
    also known as GNOME Art, is a handy application that searches the http://gnome.org/
    site and downloads a list, thumbnails, of all the wallpapers that are available.
    It can also do this for various window borders, controls, and icon themes that
    you can use in the following parts of this project. Using the thumbnail lists,
    you can easily download and install whatever you want—all without placing a cursor
    in your web browser. Next to say, the Art Manager is deedly cool!


    Unfortunately, the Art Manager is not installed by default. However, after going
    through Chapter 6, you know how easy it is to download and install applications
    like the Art Manager. All you have to do is run the Ubuntu Software Center, search
    for gnome-art, and then you install the Art Manager.


    You can then run the Art Manager by selecting System ▸ Preferences ▸ The GNOME
    window will then appear with absolutely nothing in it. To put it to use and relieve
    that emptiness, select Art ▸ Backgrounds ▸ GNOME. (You can select instead of GNOME
    if you like, but it will take longer to download the list of available wallpapers.)


    Once you''ve made your selection, the Art Manager will begin downloading a list
    of all that is available for you at http://gnome.org/. It may seem like nothing
    is happening for a minute or so, but that is normal; just hang in. It might take
    a few minutes to download previews of the backgrounds, but when it''s done, you
    will see a list of thumbnails to choose from (Figure 8-9).


    You can now install wallpaper by scrolling down until you find that suits your
    fancy, clicking it once to highlight it, and then clicking the Install button.
    The Art Manager will then download and install it. After that, open the Appearance
    Preferences window, and choose the wallpaper you just downloaded as your desktop
    wallpaper. As I said before, the Art Manager is a very handy tool to have, especially
    since you''ll be using it soon within this project.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_170_0.png)


    8B-9: Installing desktop wallpapers using the Art Manager


    # # 8B-7: Changing Window Borders, Controls, and Icon Sets


    Now we get to my favorite part of this journey through the world of digital cosmetic
    surgery—changing the window borders and controls in GNOME. The procedure is really
    easy. Select System → Preferences → Appearance. The Appearance Preferences window
    will open up the tab, showing you a list of the themes that are installed on your
    system (Figure 8-10). The default theme in Lucid Lynx is *Ambiance*, but as you
    can see, there are several others.


    To get the hang of it, take a look at each of the themes by clicking one by one.
    The changes will take effect immediately. Just clicking a theme will change your
    window borders, controls, and even, if you take a peek in your folder, the icons.
    This is especially noticeable when you click Dust Sand or New Wave.


    Each theme consists of a window border, a set of controls, and a collection of
    icons. For example, let''s say that you like the subdued blue and color of the
    controls in Dust, but you prefer the icons in Clearlooks and the borders in DarkRoom.
    Well, you don''t need to despair, because you can create a custom theme consisting
    of these three different elements.


    To create your own mix-and-match theme, click the *Customize* button on the Theme
    of the Appearance Preferences window. A new window will open, where you will find
    five tabs: Controls, Colors, Window Border, Icons, and Pointer (Figure 8-11).
    From each of these tabs, you can select the components you prefer. For now, first
