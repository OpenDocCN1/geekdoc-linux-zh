  md: '# # 14


    # ## TUX ROCKS


    Music à la Linux


    ![](img/58abec7ac6c22ade6357fd77ea421da3_297_0.png)


    It’s now time to move on to the audio side of things. Yes, Linux does indeed rock,
    and in this chapter you will find out about those musical talents that your system
    possesses. You will learn how to rip CDs, create MP3 and Ogg Vorbis files (files
    that you can recognize by their .ogg filename extensions), add album cover art,
    change file tags, play music files, and burn files into audio CDs that you can
    play in any CD player. You’ll learn how to play a variety of audio streams. If
    you’re interested in learning how to work with your iPod, iPhone, or other digital
    media device, or how to convert audio files from one format to another, you’ll
    have to wait until Chapter 15.


    # ### Audio File Formats


    Before we go any further, it is probably best to discuss the various formats in
    which audio data can be stored on your computer. For the longest time, the de
    facto standards have been WAV (created by Microsoft/IBM and using the'
  merge: -1
  img_proc: true
- pgno: 298
  md: '.wav extension, AU (from Sun/Unix and using the .au extension), and AIFF (from
    Apple and using the .aiff extension), all of which are compressed formats. Files
    saved in these formats are however, exceedingly large, with an average WAV file
    of CD-quality weighing in at 10MB per minute. To put that in perspective, in 1988
    my first Macintosh had a 40MB hard disk—more space than I thought would ever need
    but not enough space to store a WAV file of Nirvana''s ''Come as You.''


    As computers underwent their evolution in the multimedia machines they are today,
    it became clear that something was going to be done about disk-devouring files.
    Audio compression formats were thus developed. These compression formats work,
    to oversimplify things by, by cutting out the portions of a sound that the human
    ear cannot hear—sort of a dog-whistle approach. The most widely known and embraced
    of these audio compression formats is MP3. Audio files encoded in MP3 format end
    being as little as one-twelfth of the original WAV file without any noticeable
    loss of quality


    Another audio compression format that was developed Ogg Vorbis. Ogg Vorbis is
    a popular of the open source community, unlike MP3, which has always been used
    under the shadow of yet-to-be-exercised patent rights, free of patent and licensing
    worries from the get-go. Because of that and the fact that it equals MP3 in terms
    of quality and performance (if not, as many claim, better), Ogg Vorbis becomes
    the darling of the Linux community.


    As you work with ripping audio files in this chapter, you are sure to notice another
    encoding option—FLAC. Lossless Audio Codec (FLAC) is an encoding format, unlike
    MP3 and Ogg Vorbis formats, which does not remove any audio information from the
    audio file during the encoding process. The downside of this is that FLAC provides
    space savings of 30 to 50 percent, which is much less than the 80 percent neighborhood
    achieved by MP3 or Ogg Vorbis. The upside, of course, that the FLAC files should
    be equivalent to CDs in terms of quality.


    Given retention of audio quality, FLAC becomes an ideal choice if you are not
    satisfied with the audio quality provided by Ogg Vorbis or MP3 files. it is also
    a good choice if you want to create both Ogg Vorbis and MP3 files . . . or if
    you just don''t know which one you want to work with. In such cases, you can just
    rip the file and encode it in FLAC format. As I mentioned earlier, once you get
    to Chapter 15, you will learn how you can convert the FLAC later, when you know
    what you want or.


    # Project 14A: Installing MP3 Support for Audio Apps


    All that talk about Ogg Vorbis and FLAC aside, there are still many people who
    like or need to deal with MP3 files. You may, for example, already have numerous
    MP3 files ripped from your music collection, or you may enjoy listening to one
    of the many Internet radio streams that are broadcast in MP3 format. Unfortunately,
    MP3 playback and encoding is not included'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'in Ubuntu because of licensing concerns. Even if you plan on using the Ogg
    Vorbis format in your future ripping and encoding endeavors, installing MP3 support
    is a good idea so as to cover all your audio bases. It''s also a very easy process.


    The easiest way to install MP3 playback support is to double-click an MP3 file
    that you have on your hard disk. A window will appear, asking whether you want
    to search for the plugins to play the file. Click **Search**, after which another
    window will appear, showing what you need to install (Figure 14-1). Check both
    boxes in that window, click the **Install** button, in the confirmation window
    that then appears, click **Confirm**. You will then be asked for your password,
    provide it, and then just wait until the process is complete. Once done, you''ll
    be able to play not only your MP3 audio files but also MPEG and WMV videos.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_299_0.png)


    Figure 14-1: Ubuntu decoder the plug-ins you need.


    If you prefer, you can download and install these plug-ins quite easily via the
    Ubuntu Software Center by doing a search for gstreamer and then installing gstreamer0.10-ffmpeg
    (GStreamer video plugin), gstreamer0.10-fluendo-mp3 (Fluendo mp3 decoder Gstreamer
    plugin), and gstreamer0.10-plugins-ugly (Gstreamer extras).


    As MP3 encoding support, which allows you to rip CDs and create your own space-saving
    MP3 files, things aren''t automatic. But it''s not much of a chore, either, because
    all you need to do is the Ubuntu Software Center to search for and install gstreamer0.10-plugins-ugly-multiverse.
    If you also want to give yourself AAC encoding ability, you should install gstreamer0.10-plugins-bad-multiverse
    as well. You will be ready for action, as described in the next section.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Rhythmbox—Your Audio Player


    The main audio player in Ubuntu is called Rhythmbox (see Figure 14-2), which seems
    to function pretty much like a simplified version of Apple’s iTunes alone. It’s
    a relatively easy-to-use audio player that, despite some quirkness in its early
    stages, has developed quite a following in the Linux world. To run Rhythmbox,
    just go to the Applications menu and select Sound & Video ▷ Rhythmbox Music Player.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_300_0.png)


    Figure 14-2: The Rhythmbox audio player


    # Adding Songs and Albums to the Rhythmbox Library


    If you are familiar with Apple’s iTunes, you should understand the Library in
    Rhythmbox too, because it is essentially the same concept. Rhythmbox would automatically
    import everything you have in your Music folder without any extra work on your
    part. If you prefer to add songs to the Rhythmbox library manually, you can open
    the preferences window (Edit ▶ Preferences), click the Music tab, and uncheck
    the Watch my library for new files box. After that, you can add new albums to
    your Rhythmbox Library by going to the Music menu, selecting Import Folder, and
    then navigating to the folder for the new album you want to add. If you want to
    add a number of albums by the same artist, just navigate to and select the folder
    for that artist. If you want to add a single audio file, you can also do that—select
    Music ▷ Import Folder, and then navigate to the song in question.


    If you are not the navigating type, you can also add files and folders by other
    means. The simplest way is to drag the folder or song you want to add to the Library
    into the right pane of the Rhythmbox window. You can also'
  merge: -1
  img_proc: true
