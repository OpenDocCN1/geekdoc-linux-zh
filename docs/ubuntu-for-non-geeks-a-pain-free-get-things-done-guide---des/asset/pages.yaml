- pgno: 1
  md: '# PRAISE FOR UBUNTU FOR NON-GEEKS


    > "A fast, crystal-clear topical tour of the amazing collective accomplishment
    embodied in Ubuntu. I learned something new in every chapter, and ended up with
    a computer that did more of what I wanted to do, faster. This book should come
    with every Ubuntu Live CD—it’s just the documentation I needed to take some of
    the mystery out of my machine."


    —BOING BOING


    > "Highly recommended to all Ubuntu newcomers."


    —PC WORLD


    > "If you''re a Linux novice, or an experienced user who wants a good book to
    recommend, I give this book a big thumbs up."


    —LINUS TODAY


    > "This very nice book on Ubuntu Linux is clearly targeted at the neophytes who
    wish to take their first steps in installing and using Ubuntu. The author explains
    in a step-by-step manner the solutions to the problems that one might face in
    installing, configuring and using Ubuntu Linux."


    —SLASHIDOT


    > "Grant makes it seem easy with his step-by-step instructions and plenty of screen
    shots."


    —LINUX.COM


    > "This is a good, practical book that reads and doesn''t involve the victim in
    lots of superfluous stuff."


    —UNIX REVIEW


    > "With books like this is in the hands of non-geeks, the lines of distinction
    between geeks and non-geeks might just begin to blur!"


    —IT WORLD


    > "The best thing in Rickford''s Ubuntu Linux for Non-Geeks is plenty of practical
    examples."


    —LINUX MAGAZINE


    > "Highly recommended for both new Linux users and new computer users in general."


    —BLOGCRITICS'
  merge: -1
  img_proc: true
