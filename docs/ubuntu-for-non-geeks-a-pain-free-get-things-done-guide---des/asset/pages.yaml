  md: '3. Use the Pico editor, we used in Project 9A, to edit the briscola.tk file
    by typing pico briscola.tk and pressing ENTER. The briscola.th file will appear
    in the Pico editor in your Terminal window.


    4. Change the very first line of the briscola.th file from #!usr/local/bin/wish
    to #!usr/bin/wish


    5. In the second line, change /usr/local/games/briscola to /usr/share/games/briscola,
    which is where you place briscola in just a bit. Your editor window should now
    look like 9-16.


