- pgno: 61
  md: '# 3


    # # A NEW PLACE TO CALL HOME


    Getting to Know the Desktop


    ![](img/58abec7ac6c22ade6357fd77ea421da3_61_0.png)


    Now Ubuntu is up and running, and you are ready and rarin’ to go. If you are running
    Ubuntu from your hard disk, you will first see the login screen that will appear
    each every time you boot up (Figure 3-1). There’s no need to keep the login screen
    waiting, so you click your username, type your password, and press ENTER. Within
    moments, you will be to face with your desktop in Ubuntu.


    # ## Welcome to the GNOME Desktop


    Figure 3-2 shows Ubuntu’s implementation of the GNOME desktop, and as you can
    see, it isn''t all that different from what you might be used to in a Windows
    or Mac environment, other than that it has taskbars, *panels*, at both the top
    and the bottom of the screen. There are also desktop icons, except when running
    a live session from the Ubuntu Desktop CD, in which case you’ll use a launcher
    to run the installation wizard (labeled Install Ubuntu 10.04) and an Examples
    folder, which contains a number of sample'
  merge: -1
  img_proc: true
- pgno: 62
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_62_0.png)


    Figure 3-1: The Ubuntu login screen


    files for many of the applications that come bundled with Ubuntu. All in all,
    it is a very cluttered place to be, and despite its superficial similarities to
    other OS desktop environments, things in the GNOME are different enough to be
    interesting.


    The main elements of the GNOME desktop are the panels at the top and bottom of
    the screen and the icons that appear upon those panels. The-top itself, although
    empty at startup, does see its share of action, but I''ll come to that later.
    For, I''ll focus on the two panels.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_62_1.png)


    Figure 3-2: The GNOME desktop in Ubuntu'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# The Top Panel


    Of the two GNOME panels on your desktop, the top panel is basically where all
    the action is. As you can see, there are three menus and a few icons at the left
    end of the panel and a number of odds and ends at the other end (Figure 3-3).
    So that you understand what each of the panel items does, I will briefly describe
    each of them, moving from left to right, as seems to be the fashion these


    ![](img/58abec7ac6c22ade6357fd77ea421da3_63_0.png)


    Figure 3-3: The left and right sides of the top GNOME panel


    # The Left End


    At the far left of the top panel, you will find a set of three menus. These menus
    provide access to most of what your system has to offer in terms of applications,
    locations, and utilities:


    +   - **Applications menu** The access point to the majority of your applications,
    a software manager, and some system tools

    - **Places menu** Your system navigator, from which you can access your home folder,
    browse your computer''s filesystem and connected networks, and search for files
    on your hard disk

    - **System menu** The access point for your system preferences and administration
    tools


    Immediately to the right of the three menus is a set of two launchers. When these
    icons are clicked, they launch the following applications:


    +   - **Firefox** Your web browser

    - **Help** Access to the Ubuntu Help files installed on your hard disk


    # The Right End


    At the right side of the top panel is a series of icons that can perform a variety
    of functions. Some of these are indicators, while others are applets that allow
    you to perform certain functions:


    +   - **Network Manager Applet** Lets you see your network status and configure
    your network devices. When used with a wireless network connection, this icon
    indicates the wireless signal'' strength and allows you to switch between wireless
    networks easily.

    - **Volume Control** A volume controller. Duh.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Mail/Message Indicator An indicator that lets you know when you receive email
    or chat messages. It also allows you to easily send messages, check your address
    book, and even send messages to social networking sites, such as Facebook, Twitter,
    and Flickr, via an application called Gwibber (Figure 3-4), which you''ll learn
    in Chapter 5.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_64_0.png)


    Figure 3-4: Gwibber allows you to see and send messages on social networking sites.


    # Calendar/Clock Date and time and weather.


    Session Indicator Shows the name of the current user and allows you to change
    your IM status and access the options for your social networks, IMs, and Ubuntu
    One.


    Quit/Logout Allows you to lock your screen, log out, shut down, restart, or switch
    users.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Other indicators will appear depending on your hardware configuration or system
    status:


    **Bluetooth Manager** As the name implies. This appears only on machines with
    Bluetooth capabilities.


    **Battery Indicator** On laptops, shows whether you are using battery or line
    power and, and if battery, the amount of power your battery has remaining.


    # ## The Bottom Panel


    The bottom panel, as you can see in Figure 3-5, is a much simpler affair, containing
    the four items I will now briefly describe:


    +   - **Show Desktop** A button that minimizes all windows and allows you to see
    your desktop when it is obscured from view.


    +   - **Window List** A list of windows or applications you have open. Nothing
    is open, there will be no windows in the list. This is very similar to what happens
    in the Windows taskbar.


    +   - **Workspace Switcher** An application that allows you to switch between
    virtual desktops. (I''ll talk about more in "Virtual Desktops" on page 40.)


    +   - **Trash** There is nothing mysterious about the Trash . . . other than its
    Mac X-ish location on the panel.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_65_0.png)


    Figure 3-5: The bottom GNOME Panel


    # ## Project 3A: Customizing the GNOME Panel


    The GNOME panel is not a static thing. You can add launchers (respectively known
    as program shortcuts or aliases to Windows and Mac users), utilities, and even
    amuse to make it do almost anything you want—within limits of course. In the various
    stages of this project, you will customize your panel to get hands-on experience
    working with it and make things more convenient for you as you make your way through
    the rest of this book. You are, of course, free to change any of the customizations
    I ask you to make (though you won''t have a say in the matter if you''re working
    in a live session from the Ubuntu Desktop CD, because you won''t be able to save
    your settings).


    Each of the following subprojects is very simple. Most are only three-point-and-click
    procedures that you should be able to handle without any difficulty.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 3A-1: Adding Utility Buttons to the Panel


    The GNOME panel allows you to add a number of utility applications, known as applets.
    Each of these has some specific function, such as tracking your stocks, telling
    you the weather, or performing some system-related function. To start, let''s
    add a useful utility to the top panel: The Force Quit button. The Force Quit button
    lets you quickly and easily deal with unresponsive windows.


    Yes, it does happen on occasion: A window suddenly refuses to do anything. Regardless
    of what you want to do or what it is supposed to be doing, it sits there as if
    it is on strike (maybe it is). With just one click of the Force Quit button, your
    cursor becomes a powerful instrument that will kill the window. You definitely
    don''t want to be without this button, here''s how to add it to the panel:


    +   1. Right-click any open space on the top panel.

    2. From the pop-up menu, select Add to Panel, after which the Add to Panel window
    will appear.

    3. In this window, scroll down, and click Force Quit to highlight it, I''ve done
    in Figure 3-6. Click the Add button, and then click Close to finish the job.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_66_0.png)


    Figure 3-6: Adding launchers and utility applets to the panel'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'To reinforce what you''ve learned how to do, let''s add another utility to
    the panel: the Run Application applet. Once you start installing applications
    in Ubuntu, you will find that some of those applications do not automatically
    install program launchers in your Applications menu. This means you have to open
    a Terminal window and type a command every time you want to run such programs,
    which can get rather fast. The Run Application applet is one way around this problem.


    To add the Run Application applet to the panel, just follow the same steps you
    used when adding the Force Quit button, but this time in Step 3, highlight Run
    Application in the Add to panel instead of Force Quit.


    If you later decide not to keep the Run Application applet on the panel or if
    you prefer keyboard shortcuts to pointing and clicking, it is worth noting that
    you can open the applet by pressing ALT-F2.


    # 3A-2: Adding Amusers to the Panel


    The GNOME panel not only allows you to add very functional utilities, but it allows
    you to add quite seemingly useless amusements. In this part of the project, you
    will be adding two amusements: Wanda and a little fish called Wanda.


    At first glance, Wanda does little more than her tail around and spit out a bubble
    or two. However, if you install a little application called Fortune via the Ubuntu
    Software Center, you will learn how to use it in Chapter 6, and then click Wanda,
    a window pops up in which she will spit out offbeat one-liners.


    To get a glimpse of Wanda in action, limited though that action may be, the steps
    are essentially the same as those in Project 3A-1, but I''ll run through them
    one more:


    +   1. Right-click any open space on the top panel.


    +   2. From the pop-up menu, select Add to Panel, after which the Add to Panel
    window will appear.


    +   3. In that window, click Fish once to highlight it, click the Add button,
    and then click Close.


    With Wanda now in place on your panel, you can add Eyes, which is a pair of eyes
    that follows your mouse cursor around as it moves around your desktop. The same
    procedure, but click Eyes instead of Fish in Step 3.


    # 3A-3: Adding a Program Launcher to the Panel


    Now''s move on to something a bit more practical—adding program launchers to the
    panel. Although it is very easy to run an application by navigating through the
    Applications menu, there are no doubt some applications that you will be using
    frequently enough to even easier access to them. The OpenOffice.org word processor,
    Writer, is probably one of those applications.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Method 1


    You can add a launcher to the panel in a number of ways, but let''s start with
    the most conventional. To add a panel launcher for OpenOffice.org Writer, follow
    these steps:


    +   1. Right-click any open space within the top panel.

    2. Select Add to Panel in the pop-up menu to open the Add to Panel window.

    3. In that window, select Application Launcher, and click the Forward button that
    appears.

    4. A new screen will appear, showing the contents of the Applications menu (Figure
    3-7). Click the + next to Office to expand the menu, and then scroll down and
    click OpenOffice.org Word Processor to highlight it.

    5. Click the Add button, and then click Close to complete the process.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_68_0.png)


    Figure 3-7: Adding a launcher to the panel


    # Method 2


    There''s another way to add program launchers to the panel that is actually a
    tad quicker. For example, you''ll add a launcher for the OpenOffice.org spreadsheet
    program, Calc. Here are the steps:


    +   1. Go to the Applications menu, and navigate your way to and right-click Office
    > OpenOffice.org Spreadsheet.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '2. In the pop-up menu that then appears, select (that''s the usual ol click)
    Add this launcher to panel (Figure 3-8). The spreadsheet launcher will then appear
    in the panel.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_69_0.png)


    Figure 3-8: Another way to add application launchers to the panel


    # Method 3


    Now you''ve learned how to add application launchers to the panel, I might as
    well let you in on a third, even easier method. Just open a menu, select the item
    you want to add to the panel, and drag it there. We can''t get much easier than
    that, eh?


    # 3A-4: Changing Launcher Icons


    You might think your two new program launchers are somewhat plain, and it is rather
    difficult to distinguish one from the other. Fortunately, you can change the icon
    for any launcher quite easily. To learn how to do it, I''ll address any immediate
    concerns with the two OpenOffice.org launchers. Here''s what you need to do:


    +   1. Right-click the first launcher you added (the word processor), and select
    Properties from the pop-up menu.

    2. In the Launcher Properties window that appears, click the OpenOffice.org Word
    Processor icon, which will open a Choose an icon window.'
  merge: -1
  img_proc: true
