- pgno: 229
  md: '# # 10


    # ## GUTENBIRD

    ### Setting Up and Using Your Printer and Scanner


    ![](img/58abec7ac6c22ade6357fd77ea421da3_229_0.png)


    Two of the most common computer peripherals are printers and scanners. This only
    makes sense, because it is those two tools that turn a web-surfing, game-playing,
    music-churning, number-crunching box of chips into a meaningful publishing tool—a
    virtual publishing house, if you will. These two tools help your computer convert
    digital information into hard copy (in the case of printers) and convert hard
    copy into digital information (in the case of scanners). It is not surprising,
    therefore, that these tools often come together in the form of multifunction printers.


    In this chapter, you will learn how to connect these useful devices to your computer,
    how to set them up, and how to use them. If you''re more into working with your
    digital camera than with a scanner, you might want to sneak a peek at Chapter
    13; otherwise, put on your printer''s smock, and read on.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Printers


    Unless the only thing you use your computer is for playing games, listening to
    MP3s, or stopping doors on hot, breezy days, you will no doubt want to hook up
    your machine to a printer. Despite the paperless-office era that the personal
    computer was supposedly going to usher in, it seems that the computer''s strength
    as a desktop-publishing and general work tool has made producing high-quality
    printed documents an even more attractive proposition than ever before.


    # Confirming Your Printer Is Supported


    Setting up a printer to work with your new system is a pretty easy task, and it
    seems that printer support in the Linux world gets better with each release. In
    general, support for Epson, Brother, Samsung, and Hewlett-Packard printers is
    good, while support for other makers and other printer types is a bit slower (though
    improving).


    If you want to make sure your printer is supported, just by following the instructions
    in the next section. If you are thinking about buying a printer or are trying
    to decide whether to switch to Linux, go to http://www.linuxprinting.org/. On
    that site, you can check out the database to see whether your printer is currently
    supported and, if to what degree. Degrees for supported printers also include
    information on what drivers are best for your purposes. There is also a page of
    suggested makes and models, in case you''re considering buying a printer with
    the intent of using it with your Linux system. Read this before making your purchase
    decision. You might also want to consult Ubuntu''s list at https://wiki.ubuntu.com/HardwareSupportPrinters/


    # Getting Ubuntu to Automatically Recognize and Set Your Printer


    Printer handling in Ubuntu is pretty much no-brainer, because Ubuntu automatically
    detects most printers. If you have a USB printer, connect it to your computer,
    and then power up the printer (vice versa would just fine, too). Assuming Ubuntu
    recognizes your printer, a small printer icon will appear in the upper-right panel
    while the system goes through its automatic setup routine. When it is done, a
    small notification bubble like the one in Figure 10-1 will appear, telling you
    that your printer has been recognized. There is nothing more for you to do in
    this case—your printer is set and ready to roll.


    It is also possible, however, that Ubuntu will recognize your printer but not
    find a driver that is an exact match for it. In this case, it will offer a slightly
    different driver, and the autorecognition window will look slightly different
    from the one in Figure 10-1.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_231_0.png)


