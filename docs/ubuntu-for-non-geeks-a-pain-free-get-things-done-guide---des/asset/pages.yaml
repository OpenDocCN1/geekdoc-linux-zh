  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_188_0.png)


    Figure 8-27: The window on the left has a drop shadow; the one on the right does
    not.


    The effects that are active by default are the really tip of the iceberg. Depending
    on the capabilities of your graphics card, you will get the drop shadows and a
    few others bells and whistles, as cooler window-opening transitions, that''s about
    it . . on the surface, at any rate. If you like, you can kick the effects up by
    selecting **System ▸ Preferences ▸ Appearance**, clicking the **Visual Effects**
    tab of the Preferences window, and finally selecting **Extra** in that tab.


    I should warn not to be freaked out at first when you try to move your windows
    and see them wriggling like jelly—that''s one of the additional effects (Wobbly
    Windows).


    Whatever hardware capabilities of your system, if you really want to take control
    of all that Comp offers, it is worth your while to install the CompConfig Settings
    Manager (Figure 8-28), which you can get via the Ubuntu Software Center (search
    for *Advanced Desktop Effects*) and install it). Once it''s installed, you can
    run it by selecting **System ▸ Preferences ▸ CompConfig Settings Manager**.


    Once the CompConfig Settings Manager is installed, you can see-everything Compiz
    is capable of doing, and you can pick and choose those features as you fit. Although
    most of what Compiz has to offer is essentially eye-candy (which this chapter
    is about, after all), there are some functional utilities and extras. A favorite
    of mine is the Annotate tool, which allows you to write all over your screen while
    making presentations, brainstorming, or just flipping out (shown in Figure 8-29).


    To activate the Annotate tool—or any other Compiz feature—open the CompConfig
    Settings Manager, and check the box next to its name. To figure out how to actually
    use what you''ve enabled, click the name of the feature. This will open a tab
    showing its settings, including the keystrokes needed to initiate that feature
    (Figure 8-30).


    152 Chapter 8'
