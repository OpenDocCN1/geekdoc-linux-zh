    # Burning Subsequent Sessions


    Adding a new session to a multision disc in Brasero is similar to the process
    used for creating the initial session. Here''s what you do:


    +   1. Run Brasero, and click the **Data project** button.

    2. Insert your multision disc into the drive, and when the drive stops spinning
    and you''ve gotten into Nautilus windows for that disc out of the way, click the
    **Import** button, after which the contents of your previous session will appear
    in the Brasero window.

    3. Add files to the new session, using either of the methods you used when creating
    the original session (via drag-and-drop or by selecting and clicking **Add**).

    4. When you''ve added the files you want, click **Burn**. The process from then
    on is exactly the same as it was for the first session. To add files in subsequent
    sessions, just follow the process outlined earlier again.


    # Duplicating CDs and DVDs


    Now that you are familiar with Brasero, I''ll introduce another of its features:
    CD/DVD duplication. To duplicate a disc, place it in the drive, start Brasero,
    and then click the disc **Copy** button. The window in that then appears (Figure
    7-15),


    Brasero will begin copying your disc. When it''s done, it will eject the disc
    and ask you to insert a blank one. A few seconds after you insert the blank disc,
    Brasero will automatically start writing to it. When the process is complete,
    the disc will be ejected. Nothing to it.'
