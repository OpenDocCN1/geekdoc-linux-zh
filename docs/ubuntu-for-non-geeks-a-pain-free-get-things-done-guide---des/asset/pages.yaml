- pgno: 191
  md: '# 9


    # SIMPLE KITTEN WAYS


    Getting to Know the Linux Terminal and Command Line . . . and the Cool Things
    It Can Do


    ![](img/58abec7ac6c22ade6357fd77ea421da3_191_0.png)


    Many people shy away from Linux because they envision it as a system for compu-geeks,
    an environment in which you do everything the hard way—by command line. In this
    era of graphical interfaces, the idea of typing commands to get things done seems
    like a dreadful throwback to the days of DOS, and that puts many people off, especially
    those who remember what it was like in the “old days.”


    This reaction is fair enough, but it is not really an accurate reflection of the
    reality of the Linux world. After all, most Linux users today utilize some sort
    of graphical interface. They can, and often do, achieve all that they hope to
    achieve through drop-down menus and mouse clicks alike. Many are able to survive
    quite happily without ever once opening their Terminal. The same could be true
    of you.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Be that as it, there is still much to be said for the power and convenience
    of the fact that the command line can now be utilized within a graphical environment
    also makes it much less forbidding. The Terminal is just a tiny text-based island
    in a sea of graphical bodies (see Figure 9-1). Using the command line can be as
    pain-free as anything else you do on your system, and it can actually provide
    you with a little fun if you are willing it a try.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_192_0.png)


    Figure 9-1: Putting the Terminal in perspective


    Unfortunately, many guides to using the command line are written by hard-core
    command-line junkies, whose enthusiasm for what they see as a really good thing
    inadvertently makes what they see even more off-putting to the real Linux immigrant
    or wanna-be.


    For your sake, I will try to curb my own enthusiasm so not to scare you right
    back to Chapter 6 and the more comfortable world of the Ubuntu Software Center.
    I will also help you to keep things in perspective by teaching you, whenever possible,
    to use the command line as a complement to the various graphical tools that you
    have at your disposal, rather than presenting it as the sole way of going about
    things. Of course, I am not going to cover every possible angle in this regard—just
    enough to make you feel at least a little more at ease with the command line.
    Who knows, could you actually come to think of using the command line as . . .?
    Well, I won''t get too carried away.


    # Meet the Terminal


    You can run the Linux command-line Terminal application in your Ubuntu system
    by selecting Applications > Accessories > Terminal. When the Terminal opens, it
    will, in all its simplicity, look much like Figure 9-2.


    Chapter 9'
  merge: -1
  img_proc: true
- pgno: 193
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_193_0.png)


    As you can see, all it says rg@rg-desktop:~\$. In this case, rg is my user-name,
    rg-desktop is the name I gave computer during installation, and the tilde (~)
    signifies that I am in my home folder. If it were to say ~/Music, for example,
    it would mean that I am currently in the Music folder within my home folder. Of
    course, all this will be different in your case, because your username and computer
    name will be different. If your username is frog and your computer name is network,
    for example, the command line will say frog@network$. If all this is sounding
    rather obtuse to you, you just think of it this way: username@computer_name:$
    in the Terminal is the equivalent of your home folder in Nautilus.


    Typing in the Terminal is straightforward enough; you just type as usually do.
    You can also delete and insert letters or phrases by using the DELETE and BACKSPACE
    keys and the arrow keys. For practice, try the following:


    +   - Like strawberries so very much.

    - Change strawberries to cherries (because cherries are, in fact, so much better).
    Use your left arrow key to move the cursor in front of the first s.

    - Tap your DELETE key as many times as necessary to erase the word strawberries
    (uh, that would be 12 times, methinks).

    - Type cherries, and then use your right arrow key to move the cursor back to
    the end of this meaningful sentence.


    Now that you''ve completed this fascinating bit of typing practice, press the
    ENTER key. As you will almost immediately see, the Terminal''s response to your
    efforts thus is merely a dismissive I: Although you''ve typed a string of text
    that has meaning to you, it means absolutely nothing to your system. In fact,
    the system was so eyesight that it could see nothing other than the first word
    you typed in the Terminal (1); and because I am not a valid command, the system
    had no idea what to do with it.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Some Goofy Yet Useful Fun with the Command Terminal


    A rather cool thing about typing in the command Terminal is that it has what you
    might call short-term memory. Try it by typing the word cherry then pressing ENTER.
    Ignoring the command-not-found message, go on and type vanilla, and press ENTER.
    Now type gelato, and press ENTER. So far, so dumb, right? Not really. Let''s type
    everything you typed far again, but this time let''s do it with one key.


    Huh?


    Yes, just press the up arrow key once, and what do you see? That''s the last command
    you typed appears, which in this case would be gelato. Press the up arrow key
    again, and the command that you typed before will appear—vanilla. One more time?
    Yes, cherry. and one more time for the grand finale ... I like cherries so much.


    Considering what we have thus far, this may all seem a bit silly, imagining that
    you''re not typing goofy little words and instead have to deal with longer strings,
    as a simple copy command (which you''ll learn about later in this chapter) like
    this:


    ```

    cp mypics/stpierriere/coastal/ontbeach1_27.jpg /home/frog/photos_from_mom/stpierriere

    ```


    By typing that, you are copying an image called onbeach1_27.jpg from the coastal
    folder to another folder called stpierriere. If you wanted to copy another photo
    in the coastal folder, onbeach1_16.jpg, for instance, you could simply press the
    up arrow key once, use the left arrow key and DELETE key to move over and delete
    the 27, and replace it with 16. All in all, it would be much simpler and much
    faster. It would also help you avoid mistakes in typing. Not so dumb anymore,
    eh?


    # Nontoxic Commands


    As you know now, all of this typing is easy enough, but to actually do something
    with your Terminal, you need to type commands—and are more of them than you could
    ever hope or know. To get you started, we will begin with some commands that are
    easy to understand, nontoxic, and completely kitten-friendly.


    # $whoami


    There is no command as easy, safe, or even as seemingly useless as whoami. Rather
    than help those with multiple-personality disorders discover who they are at any
    given moment, the whoami whoami tells you which user is currently logged in. Try
    it by typing whoami after the $ and then pressing the ENTER key. Remember that
    commands are case sensitive.


    158 Chapter 9'
  merge: -1
  img_proc: true
- pgno: 195
  md: "The Terminal will tell you the username of the person currently logged in.\
    \ If you are logged in as frog, you should get frog as the answer to your command.\n\
    \n# $ finger\n\nIf you enjoyed discovering who you are with the whomami command,\
    \ you might enjoy finding out even more about yourself using the finger command.\
    \ You can use the finger command in a number of ways, but a very simple one is\
    \ finding out about a particular user. Try this by typing finger and then your\
