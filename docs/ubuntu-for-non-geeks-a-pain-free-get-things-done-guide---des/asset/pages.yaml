    # Use an Older Kernel


    Some freezes occur because of problems with kernel updates or drivers. You can
    try using an older version of the Linux kernel if you have one installed. Take
    a look at "If Update Ruins Your Day... or System" on page 84 for instructions
    on running on an older kernel.


    # Use Rescue Mode


    If you''ve asked for help online, chances will be called upon to type some commands
    to fix your computer. There''s no way of entering commands if you can''t get it
    to start up, though, you''ll need to use the rescue mode to get yourself to a
    command line.


    Restart your computer, and, as quickly as you can, hold the SHIFT key until the
    GRUB boot menu like the one in Figure 21-5. If you have a dual-boot setup, you''ll
    be used to seeing this boot menu again. Then, use the keyboard to select the topmost
    item (recovery mode) in its name, and press ENTER. Text will flash the screen
    for a while, and you''ll be left at the Recovery Menu.


    Use the arrow keys to highlight the netroot option, and press ENTER. After some
    moments passes, you''ll see something like root@laptop:~ and a blinking cursor.
    Here, you can type commands that can help fix your computer.


    In particular, you might like to updating your system to see whether subsequent
    updates fix your problem. (This will work only if you''re connected to the Internet).
    Type apt-get update; then press ENTER, and wait for the list of packages to be
    updated. Then, type apt-get dist-upgrade to see whether any updates are available
    for you to install.


    # NOTE


    Wireless Internet connections are unlikely to work in recovery mode. Plug your
    computer in an Ethernet cable if you can.'
