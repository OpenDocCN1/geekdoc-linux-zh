- pgno: 164
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_164_0.png)


    Figure 8-4: Choosing a background for your Nautilus window


    From this window, you can drag any pattern into your home window, or into any
    other Nautilus window for that matter, and the pattern will then become the background
    for all your Nautilus windows. For experience''s sake, scroll down to find the
    pattern called Manila Paper, and then drag it to the whitespace in the main pane
    of your window. Once you''ve done that, the previously white window area will
    look like the wallpaper in your lawyer''s office. Very nice, if you like that
    sort of thing. You can change it to a different background in the same way, of
    course, or you can go back to the default background by dragging the Reset switch
    into the window.


    > If you prefer to use an image of your own for the Nautilus window background,
    you can do so easily. Just locate the image in a new Nautilus window, click it
    with both the left and right mouse buttons (or just the middle button, if you
    have a three-button mouse), and then drag the image to any open space within the
    target window. When you release the buttons, select Set as Background in the pop-up
    menu that then appears.


    In addition to the buttons for pattern and color switches, there is done in the
    Backgrounds and Emblems window clicking the emblems you saw in Project 8B-1, providing
    you with another way to add them to your folders. This method is far handier when
    adding emblems to several folders or files in the same go.


    To see how this works, click the Emblems button. Then drag the Camera emblem onto
    your Pictures folder and the People emblem onto your Public folder. The selected
    emblems will immediately appear on those folders, adding to the growing proliferation
    of icons in the window.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 8B-3: Dolling Up the Side Pane (and Emblems Yet Again)


    Now let''s change the look of the Nautilus side pane. Keeping the Backgrounds
    and Emblems window open (if you already closed it, open it again), click the Places
    menu in the Nautilus side pane, and select Information.


    You can add a different background pattern to the side pane as well, but for practice
    let add a color instead. To do this, click the Colors in the Backgrounds and Emblems
    window. The window will now be filled with swatches of color. Drag the Grapefruit
    swatch to your side pane, and it will turn from gray to, of all things, grapefruit
    (albeit a very dark and unnoticed grapefruit). You can also create a two-color
    gradation by adding another color. Drag the Mango swatch to the very bottom of
    the side pane (but still within the pane), and you should have a grapefruit-to-mango,
    top-to-bottom gradation within the pane. Of course, if you are not pleased with
    this tropical color, you can get back to your original default gray panel by dragging
    the Reset swatch onto the area. When you''re done, you can close the Backgrounds
    and Emblems window.


    The side pane of Nautilus window provides yet a third way to work with emblems.
    But before I let you in this third (and last) way, let''s add another folder to
    your home folder. Create a folder named Finances, which can use to store files
    dealing with your relative worth in the modern-scheme of things.


    After you''ve created the new folder, go to the side pane, click the Information
    drop-down menu, and select Emblems. A list of emblems will appear within the side
    pane. Select the Money emblem, and drag it into your Finances folder. Next, select
    the Plan emblem, and drag it into the Finances too. Add even more emblems to it
    if you like—you should be able to fit about four before Nautilus decides to end
    the madness and prevent any more from being displayed. Your window should now
    look something like the one in Figure 8-5.


    Once you are done, go back to the drop-down menu, and select Places to get everything
    back to relative again.


    Even if it''s not your cup of tea, you have to admit that your Nautilus window
    is definitely more colorful now. Now, of course, change it to look how you want,
    but I''ll ask you to hold off on that a while longer, because you are going to
    do some more playing around it shortly.


    # 8B-4: Changing the Desktop Background


    Now that your home folder is all gossied (or gauded up, depending on your aesthetic
    sense of things), you might think your desktop looks rather drab in comparison.


    You can easily change the desktop background (often called wallpaper) by right-clicking
    any open space on the desktop and selecting Change Desktop Background in the pop-up
    menu. This will open the Appearance Preferences window, opened to the Background
    tab (see Figure 8-6).'
  merge: -1
  img_proc: true
