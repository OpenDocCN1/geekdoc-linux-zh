    with the -u flag. You can try it on the file you''ve already shredded by opening
    a Terminal, typing `shred -u myShredExp.txt`, and then pressing ENTER. Your file
    will be shredded and deleted.


    # 19C-2: The shred Command Graphical in Nautilus


    Although using the shred command isn''t all difficult, most average users would
    prefer to do things graphically. After all, you don''t have to type commands to
    delete or move a file; you can do all of easily enough through Nautilus, and it''s
