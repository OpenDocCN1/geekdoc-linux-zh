    6. Press CTRL-X on your keyboard.


    7. Type y, and press ENTER to save your changes.


    8. Type cd, and press ENTER to return the Terminal to your home folder.


    # 9C-4: Moving the Briscola folder to a Global Location


    You could move the briscola folder to the LocalApps folder and play it from there,
    as did with pyWings, but this time, let''s do a bit differently by moving the
    thing to global territory. This not only keeps it safe from any obvious housekeeping
    tendencies but also allows users on the same computer to play the game. You will
    need to use the sudo command to do this so that you have write access in those
    protected folders.


    To do this, just type the following command in the Terminal window, and press
    ENTER:


    ```

    sudo mv briscola /usr/share/games

    ```


    When you are prompted for your password, type it, and press ENTER.'
