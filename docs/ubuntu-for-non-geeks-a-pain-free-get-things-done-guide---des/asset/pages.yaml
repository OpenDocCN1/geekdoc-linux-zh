  md: '# Finishing Touches


    Well, things are certainly Mac-ish now, but there is even more we can do to emphasize
    the effect. Open the Panel Properties window for your bottom panel by right-clicking
    the panel and selecting Properties in the pop-up menu. In the General tab of that
    window, unchecked Expand, and then increase the size of the panel to about 5 pixels.
    When you''re done, click Close, and then start adding launchers for the applications
    you use. You might also need to remove the Workspace Switch and the Window List
    to complete the effect. Right-click the little dotted or ridged immediately to
    the left of where the names of currently open windows are displayed and choose
    Remove From Panel to get rid of the Window List, and right-click any of the set
    of four boxes on the bottom panel and choose Remove From Panel to remove the Workspace
    Switch.


    NOTE If you''d like OS X-ish dock, plenty are available; Avant Window Navigator,
    Cairo Dock, or Dock, all of which are available via the Ubuntu Software Center.
    You must have Effects turned on (that is, set to Normal or Extra) on the Visual
    Effects tab of the Appearance Preferences window in order to use these.


    Once you''re done, go to the top menu, and remove the two icons next to the System
    menu. After that, add a Window Selector applet so you have some way to navigate
    through your open windows. You might also want to change the background in your
    home folder, since the warm currently no longer match your cool configuration.


    The transformation is now complete, but you can also add trash and computer icons
    to your desktop by going on Project 8-10, after your desktop should look like
    maine back in Figure 8-13. You can stick with your OS X-ish theme or switch to
    something else. For consistency''s sake, I will switch back to the default theme
    now. By the way, if you do decide to keep the faux Aqua theme, remember to click
    the Save As button in the Appearance Preferences window and give the theme a name.


    # 8B9: Changing the Order of the Window Buttons


    If you''re used to Windows, you might be finding the order of the buttons at the
    tops of windows a . . . weird. Instead of having you minimize, maxi-mize, and
    close buttons at the top right of the window, Ubuntu puts them at the top left.
    I don''t mind this layout so much, but if you''re struggling with it, you''ll
    be glad to know it''s easy to change them to the right:


    +   1. Press ALT+F2 to open the Run Application window.

    2. Run GNOME Configuration Editor by typing gconf-editor in window and then pressing
    ENTER.

    3. When the Configuration Editor appears, click the small + next to apps, scroll
    down to metacity, and click the + next to that.

    4. Click general in expanded metacity section to display a set of options.'
