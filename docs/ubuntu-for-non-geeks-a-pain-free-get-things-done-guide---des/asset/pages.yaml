  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_449_0.png)


    # MANUALLY PARTITIONING

    YOUR HARD DISK


    ![](img/58abec7ac6c22ade6357fd77ea421da3_449_1.png)


    When you’re partitioning your hard disk with the Ubuntu installer, the first two
    options (use the whole disk and resize an existing partition) should cover most
    eventuallyties. They’re both discussed in Chapter 2. But if you’re in a geekier
    mood, there are a few ways to carve up your disk space. For example, you can create
    a shared data partition so your files can be shared between Windows and Ubuntu,
    or you can make a separate partition for your /home directory so you can reinstall
    Ubuntu (or install another Linux distro) without having to fully back up all of
    yours.


    When you get to the Prepare disk screen of the installer, choose Specify partitions
    manually and click Forward. You’ll be presented with a colored-bar view of your
    current partition setup (Figure C-1) and a list of your partitions below. None
    of the changes that you make in this window will be applied until you click Forward
    again, and you can click the Back button if you want to forget about making the
    manual changes altogether. (There is one exception: Changes are made immediately
    and irreversibly when you resize a partition. See “Editing Existing Partitions”
    on page 416 for more on this.)'
  merge: -1
  img_proc: true
- pgno: 450
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_450_0.png)


    Figure C-1: Using the manual partitioning tool


    # # Creating and Deleting partitions


    You can create new partitions only if you have “free space” to put them in. This
    free space is in the sense that there’s not already a partition on part of the
    disk, not that there are no files. One way of creating free space is to delete
    an existing partition; to do this, click the list item for the partition, and
    click **Delete**. After a few seconds it’ll change into free space in the list
    (Figure C-2). Alternatively, if you’re planning to completely change your partition
    setup, select the hard disk you want to modify, and click **New Partition Table**.
    You will be left with a completely blank slate, where all you need to do is add
    partitions.


    Select any free space, and click **Add** to put a new partition in it. You will
    be presented with a create partition window (Figure C-3), which will ask how big
    you want to make the partition in megabytes. (1GB is roughly 1000.0MB). See “Varieties
    of Partitions” on page 416 for advice on how big to make your partitions.


    The Use as option lets you specify the filesystem you want to use. A *filesystem*
    tells your operating system how to store files on partition. There are a number
    of different filesystems that you can choose, but not all of them can be understood
    by Windows and Mac OS. Ext4 is the best choice for a partition that will be solely
    used by Linux, but FAT32 is the one you need if you want to share files with Windows
    or Mac OS.'
  merge: -1
  img_proc: true
