- pgno: 79
  md: '# # Shutting Down


    Now that you know your desktop environment so well, you may feel like calling
    it a day and shutting down your machine. To do so, just click the **Quit button
    at the far-right corner of the top panel (it looks like a power button).** A menu
    (Figure 3-17) will appear with eight choices to choose from: Lock Screen, Guest
    Session, Switch from rg (whatever your username happens to be), Log Out, Suspend,
    Hibernate, Restart, and Shut Down. Hibernate is not an option when running a live
    session from Ubuntu Desktop. Select Shut Down, and a small window will appear
    to confirm your decision. Click Shut Down, and the shutdown process will begin.
    If, however, nothing seems to happen within a few seconds, which will open a Shut
    Down the Computer window (Figure 3-18). In that window, click **Shut Down**, after
    which shutdown will complete.


    The actual shutdown will take a few seconds as the system closes its various services.
    When it is all done, the system will power down your computer as well, in which
    case you are done. On a few machines, the system might not be able to power down
    your machine. You will know whether this is so in your case because all screen
    activity will come to end. If you get to that point and nothing else happens for
    15 seconds or so, then just power down the machine manually by pressing the power
    button.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_79_0.png)


    Figure 3-17: GNOME''s session menu options


    ![](img/58abec7ac6c22ade6357fd77ea421da3_79_1.png)


    Figure 3-18: Pressing CTRL-ALT-DELETE in unison brings up the Shut Down the Computer
    window'
