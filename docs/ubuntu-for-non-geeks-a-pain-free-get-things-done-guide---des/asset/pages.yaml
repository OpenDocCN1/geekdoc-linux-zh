    # THE HACKER CULTURE—A BRIEF ASIDE


    If Linus Torvalds hadn''t shared his hobby project with the world, we wouldn''t
    be talking about Ubuntu, or any form of Linux (Chapter 1 if you had no idea what
    I''m talking about). The open source movement was founded on the hard work and
    ingenuity of people like Linux, who are affectionately known by the community
    as hackers. By this I don''t mean the people who break computers, write horrible
    viruses and ruin the party for everyone. There''s an alternative use of the term
    hacker that goes much further back in computing history: Put simply, it means
    someone who writes computer programs as a pastime. The guys who founded Microsoft
    and Apple were hackers—enthusiasts playing around with early desktop computers
    in their respective ranges. The hacker culture extends beyond to all sorts of
    activities. It''s about experimenting, coming up with cool ideas, and sharing
    them among similar-minded people, and it''s this philosophy that has made the
    open source movement possible.


    # The Ubuntu Forums


