    # # Bugs, Bugs, Glorious Bugs


    The computers of yesterday were enormous, complicated beasts, filling entire rooms
    with delicate electronics and whirring tape drives. Renowned computer scientist
    Grace Hopper, retrieving a moth from a relay in such giant, tapped the offending
    insect into her log book and remarked that she had found a “bug” in the computer.
    Well, computers may have changed a lot since the 1940s, but some of the terminology
    hasn’t. Whether it’s as major as a program crashing or freezing or as minor as
    a missing icon, any problem that you find with a piece of software is still referred
    to as a bug.


    You’ve almost certainly come across a bug before—software, whether commercial
    or open source, is ever perfect. The difference with open source is that you’re
    strongly encouraged to report problems wherever you see them. Developers need
    feedback in the form of bugs reports so they know what needs fixing, and problems
    get fixed more quickly if they’re reported sooner. Filing a bug report is a relatively
    easy way of giving something back to the community; it doesn’t take long, it helps
    to improve the software for everyone, and you get an annoying software problem
    fixed for free!


    # ## Counts as a Bug?


    There are lots of different types of bugs, but you can usually fit them into one
    of the following categories:


    +   - When a program crashes, freezes, or shows an error message for good reason
    (for example, Figure 20-3)

    - When something doesn’t work (for example, when a button does nothing when you
    click it)'
  merge: -1
  img_proc: true
- pgno: 395
  md: '+   - When hardware (such as a printer or your sound card) misbehaves or doesn''t
    work at all

    - Typos, missing icons, and other cosmetic mistakes


    If your problem fits any of these descriptions, then you likely have a bug on
    your hands! You should be aware of a few notable exceptions, though. First, if
    a program is missing a feature, that''s not a bug. You can make a feature request
    using the Brainstorm website (see “Sharing Ideas on How to Improve Ubuntu” (page
    364). Second, you shouldn''t ask for help with reporting a bug, since you probably
    won''t get a response. Use the forums or IRC instead; find out more on in “The
    Ubuntu Forums” (page 365 and Chatting with IRC” (page 367). Finally, it''s important
    that the bug is reproducible. This means you can provide a set of instructions
    for someone else to follow, and they will experience the problem as you. Sometimes
    computers do only one-off weird things, so if it''s not repeatable, there''s little
    chance that the problem can be identified and fixed.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_395_0.png)


    Figure 20-3: If a program crashes (like Gwibber here), it''s probably a bug


    # ## Reporting a Bug


    If you''re confident you''ve found a bug, it''s time to tell someone about it!
    If it happened in a specific program, select **Help ▸ Report a Problem** in that
    program''s menu, if that option exists, and skip to the next paragraph. If that
    isn''t there, you''ll have to get your hands a little dirty. If you need to find
    the command name for the offending program, this isn''t always the same as the
    name that appears in the title of the window, so you''ll have to do some digging
    to get it right:


    +   1. Select **System ▸ Main Menu** to open the menu editor.

    2. Use the Menus list to the left of the window to find your program. For example,
    if you want to report a bug about the Tomboy note-taking program, you''d click
    the *Accessories* item and find Tomboy Items in the list of the screen.

    3. Right-click the name of your program, and choose **Properties** from the menu
    that pops up.'
