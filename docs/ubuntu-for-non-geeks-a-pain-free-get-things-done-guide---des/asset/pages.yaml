    # Lost Files


    Losing an important file is one of those uniquely frustrating experiences in life.
    If you''ve looked in all of the most likely locations (like your home folder),
    try one of the following:


    +   **Recent Documents** Select Places > Recent Documents to see whether the missing
    file is in the list of recently edited files. If it was an office document, try
    the File > Recent Documents menu in OpenOffice.org too.

    **Basic search** The basic search for Files tool is useful only if you can remember
    part of the file''s name. Select Places > Search, type part of the file''s name
    in the Name contains, and click Search. It might turn up in the list of search
    results.

    **Heavy-duty search** The advanced Tracker search tool can look inside documents,
    which is handy if you don''t remember the file''s name but you remember some of
    its contents. Install the Tracker Search Tool from the Ubuntu Software Center,
    and select System > Preferences > Searching and Indexing. Checking the Enable
    indexing option on the General tab, and click Apply. may Restart in the window
    that appears, and wait for Tracker to build its search index (about 20 minutes
    should do it). When it has finished, select Applications > Accessories > Tracker
    Tool, and search for your lost file here.'
  merge: -1
  img_proc: true
- pgno: 439
  md: 'Look in the Trash It''s possible that you accidentally deleted the file. Click
    the Trash icon on the bottom panel, and look for it in there.


    Another explanation for the lost file might be that it was saved in a temporary
    folder. This happens when you open an email attachment,the file is in the temporary
    folder by your client and opened using the default application for that type of
    file. Unfortunately, some programs don''t realize it''s a temporary file, and
    they let you save it in the temporary directory ... which is periodically wiped
    clean. If you suspect this may have happened and you restarted your computer since
    you saved the file, then it''s probably gone forever.


    If you haven''t restarted, there may still be hope; try opening the (unmodified,
    original) file again to see which folder it stores in by selecting File > Save
    As (or similar) in the program you''re using. Then, check which folder the Save
    window opens up to. For example, the Evolution mail client temporarily stores
    attachments that you open in a randomly named folder the /home/username/.evolution/cache/tmp
    folder (see Figure 21-15 for an example). Note the name of the folder, and open
    your folder. Then, select Go > Location, type the name of the folder in the box
    that appears, and try to find your file in the folder saved in a temporary folder.
    It''s hardly convenient, but might just help you find your file.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_439_0.png)


    Figure 21-15: Looking for a file that was saved in a temporary folder by Evolution'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# Where Can I Go to Get More Help?


    Many of the instructions in this chapter are quite general, so they might miss
    out on the specifics that you need to get your computer behaving properly. If
    you suspect that this is the case or if nothing in this chapter seemed to help
    with your problem, then it''s a good idea to seek help elsewhere. Ubuntu has a
    large and thriving online support community that prides itself on being friendly
    and helpful. There are quite a few options for you to choose from:


    +   - Visit https://help.ubuntu.com/, and use the search to find help guides and
    tutorials.

    - Ask a question on the #ubuntu IRC channel (see “Chatting on IRC” on page 367).

    - Ask a question on a mailing list (see “An IRC Alternative: Mailing Lists” on
    page 371).

    - Post a question on the Ubuntu forums (see “The Ubuntu Forums” on page 365).


    From here on out, it''s up to you and the Ubuntu community to figure what''s going
    on. Good luck fixing your problem!'
  merge: -1
  img_proc: true
- pgno: 441
  md: "# A\n\n# # INSTALLING UBUNTU FROM\n A USB FLASH DRIVE\n\n![](img/58abec7ac6c22ade6357fd77ea421da3_441_0.png)\n\
    \nIf you have a netbook or some other computer that doesn’t come with a CD drive,\
