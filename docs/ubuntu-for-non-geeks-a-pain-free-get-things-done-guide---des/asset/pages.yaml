- pgno: 279
  md: '# 13


    # BRUSH-WIELDING PENGUINS


    *Linux Does Art*


    ![](img/58abec7ac6c22ade6357fd77ea421da3_279_0.png)


    Now that you know you can get down to business in Linux, it is time to don that
    beret of yours and address the artistic side of things.

    Yes, Linux does art, and as you will soon find out, a good number of programs
    on your system allow you to create and manipulate graphic files. These days, however,
    there is perhaps nothing as important to most users’ graphical repertoires as
    their digital cameras, so that is where we’ll begin.'
  merge: -1
