- pgno: 124
  md: 'One final note: Remember that all business about authentication and GPG keys?
    It was related to a security measure that checks whether the packages are from
    where you think they''re from. (In theory, it''s possible that someone could hijack
    a repository and put harmful packages in there.) If you don''t add the GPG key,
    the Ubuntu Software Center will refuse to display any of the packages from the
    repository because it won''t trust it. Having the GPG key isn''t enough to keep
    you safely from nasty surprises, though. You should always exercise caution when
    using a third-party(that is, non-Ubuntu) repository; make sure it''s trustworthy
    before you add it.


    # APT-URL: Installing from Websites


    Now that you''ve added GetDeb to the list of available software repositories,
    you can take advantage of yet another APT frontend. Go to http://www.getdeb.net/,
    and click the Apps tab. Per the list of programs until you find something agreeable—and
    click Install now, just below its picture. Now you can click a link to install
    software, without needing to use the Ubuntu Software Center! A Launch Application
    screen will appear with the apt option selected—click OK, and enter your password
    if prompted. It will then be a window that looks like the one in Figure 6-9; click
    Install, and wait as the downloading-and-installing activity carries on. When
    it''s all over, hit Close in the window that appears, and you find your new program
    in the Applications menu (or wherever it ends up). Quick and easy.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_124_0.png)


    Figure 6-9: Installing a package from a website with APT-URL


    Plenty of websites support APT links, but you won''t be able to download software
    from them unless you''ve added your repository to your computer, like you did
    with GetDeb. If the link is for a program that is already available in the Ubuntu
    repositories, however, this can be installed as normal, without further mentioning
    in regard Sources.


    # Project 6B: Installing Software from a PPA: OpenSource


    Many Ubuntu enthusiasts catch the programming bug and decide to come up with their
    own software. There are all sorts of programs out there that someone has written
    to scratch an itch off, and plenty of them are available to you, for free, if
    you know where to get them. Luckily, most of them can now be found in personal
    package archives (PPAs) on Ubuntu''s'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'project website, Launchpad. PPAs are miniature software repositories and are
    an easy way for people to share their home-brewed software with others (emphasis
    on the software from PPAs doesn''t work). You can find software in PPAs by visiting
    https://launchpad.net/ubuntu/+ppas and searching for what you want.


    In this example, you''ll see how to install OpenSonic, an open source remix of
    the classic Sonic the Hedgehog game (see Figure 6-10):


    +   1. Type **lucid games** in the search box at https://launchpad.net/ubuntu/+ppas,
    and click **Search** to get underway.

    2. The first search result should be Games (Lucid), so click that link, and look
    at the section titled *Adding this PPA to your system* on the page that loads.

    3. Copy the bit that says `ppa:fake-t-j/games`—it''s a shortcut that you can use
    to add to your repository, instead of having to use the more cumbersome APT line
    (You can still see the APT line by clicking the **Technical details about this
    PPA** link, if you''re curious.)

    4. Select **System > Administration > Software Sources**, and select the **Other
    Software** tab.

    5. Click **Add**, and paste the PPA shortcut into the box provided. Then, click
    **Add Source**.

    6. This time, the GPG key will be added automatically, so you can close the Software
    Sources window now.

    7. Click **Reload** when prompted to update the package information, and then
    open the Ubuntu Software Center and install OpenSonic like you would any other
    package.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_125_0.png)


    Figure 6-10: Playing OpenSonic'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'This is just an example—PPAs aren''t only used by enthusiasts to distribute
    nostalgic software. Some Ubuntu developers use PPAs to make the latest versions
    of software, albeit in an unofficial and untested manner. If a major new version
    of OpenOffice.org or Firefox comes out, for example, keep your eye on the Ubuntu
    forums (http://www.ubuntuforums.org/) to see whether someone has made the greatest
    available through their PPA.


    # Project 6C: Installing DEB Packages Not Available via the Ubuntu Repositories:
    Skype


    Skype, shown in Figure 6-11, is Voice over IP (VoIP) software that allows you
    to speak to other Skype users over the Internet, with the clarity of a regular
    telephone line. And the best part is, it doesn''t cost anything—even if you call
    users overseas. Skype also offers services, such as SkypeOut, which allows you
    to call regular mobile and landline telephone numbers from your computer at a
    fraction of what it would normally cost from a regular telephone.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_126_0.png)


    Figure 6-11: Skype'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Although it is true open source VoIP packages such as Ekiga Softphone are available
    in Ubuntu, they are not compatible with the much better known and more widespread
    Skype. Since it is very likely that the majority of people you know are using
    a VoIP software package like Skype, it only makes sense to use Skype that you
    can easily communicate with them.


    Because Skype is not available from the Ubuntu repositories, you will need to
    get it from the Skype website (http://www.skype.com/). Once, click the Download
    button, which will automatically take you to the download page for Linux versions
    of Skype. On that page, click the link for Ubuntu, and click the Save File button
    in the window that appears.


    Once the download is complete, you will find the DEB package on your hard disk,
    probably in your Downloads folder. Double-click that package to open the Installer
    window (Figure 6-12). Click Install Package, after which you will be prompted
    for your password. Once the installation is complete, click the Close button in
    the window that appears and again in the Package Installer window.


    As is the case with all APT frontends, you cannot use Package Installer while
    another frontend is open. While we use Update Manager and the Ubuntu Software
    Center are closed before using Package Installer.


    Once all the pieces have been installed, you can run Skype by selecting Applications
    ▸ Internet ▸ Skype. If you find that you can''t make calls or the sound doesn''t
    work properly, take a look at https://help.ubuntu.com/community/Skype/ for troubleshooting
    hints. Also, while we''re on the topic of sound, remember that it is best to use
    Skype with a headset microphone could cause feedback or echoes, because the microphone
    will pick up and transmit sounds from the speakers.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_127_0.png)


    Figure 6-12: The Package Installer window'
