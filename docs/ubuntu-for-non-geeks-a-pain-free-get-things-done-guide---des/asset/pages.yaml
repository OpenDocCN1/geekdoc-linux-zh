- pgno: 325
  md: '# Linux on Your iPod?


    One thing you might notice if you do a Google search on using your iPod with Linux
    is that it is possible to actually replace your iPod''s Apple-designed operating
    system with a form of Linux. Now, I am not advocating that you do this (and I
    most certainly have not done so myself), but some folks are interested in geeking
    around with whatever gadget they have in their hands. If you''re such a person
    or if you''re just curious, check out http://www.ipodlinux.org/, or the even more
    popular Rockbox (http://www.rockbox.org/), which also runs on a number of other,
    non-Apple, devices.


    # Working with . . Your iPad?


    Apple''s new offering, the iPad, has been on the shelves only a short time, and
    yet Linux enthusiasts are already trying the iPad out with Linux machines. Reports
    are that the iPad "mostly" works of the current version, Ubuntu 10.04. If you
    want to see how the iPad works with your Ubuntu-powered PC, just connect the two
    by USB cable, and play around to see how it goes. Just remember that you''re doing
    so at your own risk.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_325_0.png)'
  merge: -1
  img_proc: true
