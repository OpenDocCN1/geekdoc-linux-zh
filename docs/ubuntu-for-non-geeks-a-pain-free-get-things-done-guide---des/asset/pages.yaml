- pgno: 445
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_445_0.png)


    # UBUNTU DESKTOP CDSnFOR AMD64, OPTERON, OR INTEL CORE 2 USERS


    As I mentioned in Chapter 1, the version of the Ubuntu Desktop CD that comes with
    this book is designed to work with i386 processors, either in PCs or Intel-based
    Macs. It will also work with AMD64 or Intel Core 2 processors, albeit not in 64-bit
    mode. In order to use Ubuntu with these processors (or any other machine based
    on AMD64 or EM64T architecture) in 64-bit mode, you must get a different disc
    on your own. There are several ways of doing this: downloading an ISO (disc image)
    and then burning it to CD yourself, ordering the CD from Ubuntu (for free), or
    ordering it from an online Linux CD provider (for a nominal cost).


    # Downloading and Burning Ubuntu Desktop ISOs to CD


    To download an ISO of the Ubuntu Desktop CD, go to the Ubuntu website at http://www.ubuntu.com/,
    find the link to the download page, and select and download the appropriate version
    for your machine. Remember that the ISO file you will be downloading is a heavyweight,
    weighing in just under'
  merge: -1
  img_proc: true
- pgno: 446
  md: '700MB, the download will take a bit of time. Don''t count on getting it all
    downloaded and done before . . . or, if you happen to be using a dial-up Internet
    connection, before dinner tomorrow. Yikes!


    # Burning the ISO to CD in Windows


    Once the Ubuntu Desktop CD ISO has been downloaded, you need to burn it to CD
    before you can use it. Although Windows has built-in CD-writing capabilities,
    not all versions have the built-in ability to burn ISOs. To burn ISO to CD in
    Windows 7, just right-click the ISO file, select Burn disc image, and then click
    the Burn button in the window that appears. In all other versions of Windows,
    however, you must use a third-party commercial application, such as Nero. If you
    don''t have a commercial disc-burning utility installed on your system, try the
    free and handy ISO Recorder.


    To get ISO Recorder, visit http://isrecorder.alexeiman.com/isrecorder.htm. Once
    the download is complete, double-click the ISOSetup.msi file on your hard disk
    to install. After the installation is complete, burn your ISO to CD by right-clicking
    the Ubuntu ISO file on your machine and selecting Open > ISO Recorder in the pop-up
    menu. A CD Recording window will appear.


    It is generally best if you install or live CDs at a lower speed to reduce the
    chance of error (with 2X to 4X speeds considered optimal). To do so, make your
    choice from the Recording drop-down menu. Next, pop a blank CD into the drive,
    and click the Next button. The CD-burning process should begin. Once it''s done,
    the CD should pop out of the drive, and if all goes well, you''ll have an AMD64-compatible
    CD. You can then use it by following the directions at the beginning of Chapter
    2 for using the CD that comes with this book.


    > If your CD does not seem to work, there could be a problem with the ISO file
    you downloaded. Find out by doing an integrity check as explained at https://help.ubuntu.com/community/HowToMDDSUM/.


    # Burning the ISO to CD in OS X


    Although Ubuntu no longer comes in PowerPC editions, the i386 editions can be
    installed and run on Intel-based Macs. You can also, of course, download-ISOs
    for other architectures on your Mac and burn them to CD for use on other machines.


    To an an file to CD in OS X, first check to make sure the image is not mounted
    by opening a Finder window and checking the disc in the area at the top of the
    left pane. If the disc is mounted, a drive icon will appear in that location.
    If the drive icon is there, click the arrow next to that to eject, or unmount.


    After that, click Applications in the same Finder window, and then look for and
    open the Utilities folder. In that folder, find and then double-click Disk Utility.
    If the ISO is not listed in the left pane of the Disk utility'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# Ordering an Install Disc from Ubuntu


    when it opens, go back to the Finder window, locate the Ubuntu Live CD ISO you
    just downloaded, and then drag it to the left pane of the Disk Utility window,
    just below the listings for your current drives. Once the ISO file appears in
    that list, click once to highlight it.


    To complete the process, click the Burn in the Disk Utility window''s toolbar,
    then insert a blank CD in your drive when prompted to do. Once the blank CD is
    inserted and recognized, you will be able to adjust the burn speed from the drop-down
    menu to the word Speed. Select as low a speed as your hardware will allow, depending
    on the age of your Mac, which will probably be 4X to 8X. Finally, click the Burn
    button in that same window, and the burning process will begin.


    The easiest and most foolproof way to get an Ubuntu Desktop CD is to simply order
    one (or more) for free from Ubuntu; you don''t have to pay shipping or handling.
    Of course, the only downside to this approach is time. It can take up to ten weeks
    for you to get the CDs in this manner, so if you''re impatient, you might want
    to opt for one of the other methods. To order your CDs from Ubuntu, go to https://shipit.ubuntu.com/,
    and follow the directions there. It''s easy.


    If you need faster service or larger numbers of Ubuntu CDs and don''t mind paying
    a small amount for the service, then you can order your discs through the Canonical
    store instead (https://shop.canonical.com/).


    # Ordering an Install Disc from Other Online Sources


    If you are in a hurry to get your install CD, you can also order a copy from an
    online source, such as CheapBytes (http://www.cheapbytes.com/) and OSDisc Com
    (http://www.osdisc.com/).'
  merge: -1
