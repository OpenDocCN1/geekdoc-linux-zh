  md: 'simply drag the iconless tag to a photo you want to tag with, after which a
    mini-thumbnail of that image will become the icon for the tag.

    The other approach is to right-click the new tag and select Edit Tag in the pop-up
    menu. In the window that appears, click the iconless button next to the word Icom,
    and then select one of predefined icons in the window that appears. You can also
    use this to edit the photo of an automatically created tag, which allows you to
    determine exactly which portion of a picture you want to use as the icon for tag
    (Figure 13-7).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_286_0.png)


    Figure 13-7: Modifying the portion of photo used as an icon tag in F-Spot


    Searching for images by tag is perhaps even easier than adding the tags to the
    images in the first place. Let''s say you wanted to find all of your images that
    were tagged as Events. You would first go to the Find menu and select Find Selected
    Tag. A bar will appear directly above the thumbnail viewing area of the F-Spot
    window. Drag the icon for the Events tag to that bar, and almost immediately images
    tagged as Events will appear in the thumbnail area. Sweet.


    # Getting Arty with the GIMP


    The Windows and Mac worlds may have Photoshop, but the Linux world has the GIMP
    (see Figure 13-8). Although arguably not as powerful as Photoshop, the GIMP is
    a capable contender, which may explain why it has been ported to both Mac and
    Windows. The GIMP allows you to create bitmap graphics, and quite importantly,
    retouch or completely doctor image files.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'With the GIMP you can get rid of red-eye in your digital photos, airbrush out
    unwanted shadows (or even facial blemishes), give your image a canvas texture,
    change a photo into an oil painting, and add a bell pepper here and—draw shadows
    no less.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_287_0.png)


    **Figure 13-8:** Manipulating a digital image in the GIMP


    Because not everyone needs or uses the power of the GIMP, the powers that have
    unfortunately decided to no longer bundle it on the Ubuntu Desktop CD, freeing
    up space for more frequently run applications. Pity that might be, you can still
    install the GIMP via the Ubuntu Software Center. Just do a search for *GIMP*,
    and then install it as you would any application, as you learned in Chapter 6.
    Once installed, you can run the GIMP by selecting **Applications** **Graphics**
    **GIMP Image Editor.**


    # Using the GIMP to Resize Images and Convert File Formats


    Like F-Spot, the GIMP is also a very handy tool for resizing images. You can do
    this by simply right-clicking an image opened in the GIMP and then selecting **Image**
    **Scale Image** in the pop-up menu. This will open the Scale Image window, where
    you can set the new size of your image.


    The GIMP is also an excellent tool for converting images from one format to another.
    You can, for example, open a bitmap (*bmp) file and save it as a PNG (*.png) file,
    save a JPEG (*jpg) file as a GIF (*gif) file, and so on.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'Although this can be done with other graphics applications, GIMP supports an
    extremely wide variety of file formats, and it even lets you save an image file
    as a compressed tarball, which makes it a true file conversion king.


    To perform a file conversion, right-click an image opened with the GIMP, and then
    select Save As in the pop-up menu. You can make the same selection from the File
    menu if you prefer. Either way, the Save Image window will appear. In that window,
    you can specify the new format by replacing the original file extension in the
    Name box of that window with the extension for the format you want to convert
    the image to. If you''re not sure what formats are available to you, click the
    small arrow to the left of the words Select File Type (By Extension), and then
    choose from the options that appears below. To save a work in progress, use the
    GIMP-native XCF format so that you can continue working on the image later.


    # Learning More


    It is lots of fun to learn the GIMP by just playing around with it for a while.
    While you started, most of the stuff is located in the Filters menu of any image
    window. Of course, you should make a backup copy of any file you are planning
    to experiment with before altering it.


    If you prefer working through manuals and tutorials over goofing around, you can
    download and install the GIMP User Manual via the Ubuntu Software Center by searching
    for gimp-help-en and then installing Documentation for the GIMP (English). Once
    it is installed, you can access the manual from within the GIMP from the Help
    menu. You can also view the manual online at http://docs.gimp.org/en/, and you
    can find a series of tutorials at http://www.gimp.org/tutorials/


    # Phatch Batch Processor


    While the GIMP and F-Post are quite capable in handling the vast majority of your
    photo-organizing and editing chores, they lack an easy-to-use batch file conversion
    method that allows you to apply various conversions to a group of photos at the
    same time. For example, let''s say you want to convert 100 of your photos so they
    look like black-and-white snapshots with white borders, or are 50 percent smaller
    than the originals, have a similar filename, and are saved in .tiff rather than
    jpg format. Applying all these changes one by one would be excruciating—fortunately,
    Phatch comes to the rescue! (See Figure 13-9.)


    You can download and install Phatch via the Ubuntu Software Center by searching
    for *phatch*. Once installed, you can run it by selecting Applications > Graphics
    > Phatch Photo bATCH Processor.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_289_0.png)


    Figure 13-9: Batch photo file conversions with Phatch


    # # Using Phatch


    Using Phatch is easy, and actually a bit of hocus-pocusy fun. However, its interface
    might not be obvious for a first-time user. With that in mind, here is a brief
    rundown on how to use Phatch:


    +   - Click the + in the main Phatch window, and the Phatch actions window will
    appear.

    - In that window, select the action (conversion) you want to apply to your photos,
    and click Add. Repeat this process for any actions you want to apply.

    - Once you have added all the actions you want, click each action in the main
    Action List, and enter the appropriate parameters for each action (size, file
    format, size of border, output location, and so).

    - If the actions are not listed in the order you want them to occur, click the
    action you want to move, and then change its position using the up and down buttons.

    - Once everything is ready, save your Action List with a meaningful name so you
    can use it again if needed be, and then select Tools ▸ Execute.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '+   6. In the window that appears, click the Browse Folder button to find the
    photos you want to convert, and then click the Batch button.


    +   7. Another window will then open showing which files will be acted upon. Click
    Continue in that window.


    Pfatch will then perform the conversions listed on your Action List in the order
    listed. It will show the progress of its work, and a small window will appear
    telling you it''s done. You can then find the converted copies of your original
    photos in the destination folder you chose. If you failed to choose a destination
    folder, the newly created conversions should appear in a Pfatch folder on your
    desktop.


    # gpaint


    If the GIMP comes as a bit overwhelming for you or if it seems to be overkill
    for your simpler tasks, you might want to try an application known as gpaint (or
    GNU Paint), which you can download and install via Ubuntu Software (search for
    gpaint). As you can see in Figure 13-10, gpaint is similar to Windows Paint and
    MacPaint, and just as simple.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_290_0.png)


    Figure 13-10: Art done simple—gpaint'
