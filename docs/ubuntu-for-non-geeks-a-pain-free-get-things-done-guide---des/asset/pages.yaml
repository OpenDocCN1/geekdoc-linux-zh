  md: 'program to use gzip to compress the folder. For example, to create a compressed
    version of your *Documentia* folder, which we will call tightdocs.tar.gz, you
    would type the following and press ENTER:


    ```

    tar -czvf tightdocs.tar.gz Documentia

    ```


    It''s worth mentioning at this point that you may also come across some files
    compressed with the bzip program. Such files are recognizable by some variation
    on the *.bz or *.bz2* extension. Dealing with these files should pose no problem,
    because the commands are almost identical to those for gzip. Substitute -j for
    -2 in the command string.


    # Compressing and Extracting Compressed Files


    If you want to compress or decompress a single file, you don''t really need to
    use the tar program at all, since its purpose is to create archives of several
    files. You can instead use gzip and gunzip commands directly. For example, to
    compress a file called matilda.png you would type *gzip matilda.png* and press
    ENTER. The *matilda.png* file will then become *matilda.gz*. To decompress the
    file, you will use *gunzip matilda.pggz* and press ENTER, after which the *matilda.png*
    file will be back to normal.


    So, can you compress any archive you''ve already created with the tar command?
    Sure. For example, to compress the *spicyfood.tar* archive mentioned earlier,
    you would type *gzip spicyfood.tar*, and *void-* you''ve got yourself a compressed
    *spicyfood.tar.gz* archive. Pretty cool, don''t you?


    # Project 9A: Creating a Plan


    Now that you have a bit of command experience, it''s time to get practice and
    put all those commands to good use. In this project, you will start off by creating
    a *.plan* file, like the one mentioned earlier in the chapter.


    The actual *.plan file is a hidden file (as you can see by the dot before its
    name), which contains the plan or message that you add to that file. That message
    will appear in the output of someone''s Terminal when they use the finger command
    to find out more about you. You may not need a *.plan file but it is an easy way
    to get started a bit more with commands and the Terminal itself, let''s give it
    a try.


    To start out, you''ll open the Terminal-based Pico editor to create the *.plan
    file*. To do this, open a Terminal window, type pico *plan* (being sure to put
    a space between pico and *.plan*), and press ENTER. Your Terminal will look different,
    but you can see it in Figure-92.


    Now you will be looking at your new, and totally empty, *.plan file within the
    Pico editor. Now you have to type your plan or message. Once you''ve done, press
    CTRL-X to exit the Pico editor, and it will ask whether you want to save your
    work. You do, type Y, after which you will be presented with a set of options.
    You have already made the file *.plan*, as you can see the bottom of the screen,
    so all you have to do is press ENTER. You will be back at your now-familiar prompt
    in the Terminal window.'
