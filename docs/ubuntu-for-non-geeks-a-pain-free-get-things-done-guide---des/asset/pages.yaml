    If you install an update only to find that your system won''t start up again,

    don''t worry. Not in fact, nothing is lost . . most likely. Just start up your

    machine if you have a dual-boot system, you will arrive at the GRUB

    menu, just like always. If you''re not a dual-booster, you''ll have to get to
    this

    machine by holding down SHIFT as soon as you start the computer. Don''t let go
    of

    SHIFT key as soon as the GRUB menu appears (Ubuntu starts, in which case you

    missed your cue, and you''ll have to restart the computer and try again).


    In the GRUB menu, you will see that you have to more than one

    Ubuntu system installed on your hard disk, which is true to some extent. For

    a short-term fix, you can take advantage of this by traveling back in time to

    the core system (the Linux kernel) that you had in place before your ill-fated

    upgrade. Use your arrow keys to select a kernel that ends in a number

    lower than the highest (2.6.32-22 rather than for example), press

    ENTER, and voilà, you are back to the system you have come to know and love.

    You have to do this each time you start up your machine, but at least you

    will have the chance to back up your valuable files before doing some research

    the problem and trying again.


    With all this disaster and recovery talk, I hope I haven''t scared you away

    from the idea of updating your system. Still, all chances are great that not-

    ing like this will ever happen to you. Still, it is good to know that if things
    do

    go away, there is no need for panic. You''ve got back up.'
