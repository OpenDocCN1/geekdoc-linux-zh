    for an example of how you can do this.


    # Project 18B: Installing Microsoft Windows Core Fonts


    Like or not, the computing world is still pretty much a Microsoft world, and that
    means the majority of users, even Mac users, are using Microsoft fonts. By being
    the case; it is inevitable that you will have to deal with fonts such as Georgia,
    Verdana, Times New Roman, and Courier, to make a few of ours. Of course, your
    system can substitute the fonts it has for yours and allow others to see your
    documents the way you intended and if you intended it will behove you to install
    those Microsoft core fonts on your own system.


    Fortunately for you, there are two ways to get these fonts. One is to-load and
    install them via the Ubuntu Software Center, while the other of those of you with
    a dual-boot setup, is to copy them from your Windows partition. In the former
    case, all you need to do is install the Microsoft Core Fonts package using the
    Ubuntu Software Center. This is the older set of fonts from Windows XP, so installing
    this package won''t get you any of the swishy new fonts that are bundled with
    later Windows versions. When the installation process is complete, your new Microsoft
    fonts will be successfully fully installed and made ready for immediate use by
    every user account on your machine.


    If you''re a dual-booter, you can copy the fonts directly from your Windows installation.
    This has the advantage of getting all your Windows fonts into Ubuntu, even the
    newer ones (if you have Vista or Windows 7 installed). Here''s what you need to
    do:


    +   1. Mount your Windows partition, as described in "Project 18A: Access Files
    on Your Windows Partition (for Dual-Booters)" on page 324.


    +   2. Open the Ubuntu partition in Nautilus, and browse to Windows/ Fonts folder.


    +   3. Now for a little trick: Select Edit > Select Items Matching, type *.ttf
    in the box that appears, and click OK (Figure 18-3). This will select all the
    files in the folder with names ending in .ttf, which are all TrueType fonts.


    +   4. Copy the files to a convenient location (somewhere in your home folder
    should do it).'
