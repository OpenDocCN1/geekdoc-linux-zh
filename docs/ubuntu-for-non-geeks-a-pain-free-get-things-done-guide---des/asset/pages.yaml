- pgno: 375
  md: '# 19


    # DEFENDING THE NEST


    Security


    ![](img/58abec7ac6c22ade6357fd77ea421da3_375_0.png)


    Many a Windows user has entered the Linux fold after a host of bad experiences
    with malware in the Windows world—viruses, spyware, and all sorts of other malicious
    bits of software code, too numerous to imagine. Windows is also plagued by a seemingly
    endless array of security vulnerabilities, leaving the system easy prey to invaders
    with less than noble intentions. Every trip out into cyberspace becomes something
    like a run through the infectious diseases of a hospital. For a Windows user,
    it can sometimes seem that more time is spent ridding the system of viral pests
    and defending it from invaders is actually getting things done.


    Fortunately, Linux does not suffer greatly from such problems, leading to the
    much-tout claim that Linux is practically virus free and secure. Numerous lines
    of reasoning have been proffered to explain Linux''s malware and exploit-resistant
    nature. One reason is simply popularity—or lack thereof. Because Linux is not
    as widespread as a system as Windows, it is also a much less attractive target
    of digital evil-doers, who very often seen to be motivated'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'by the challenge and headline-catching glory that comes with creating a truly
    global virus or finding a heretofore unknown back door.


    Another reason is that Linux users, as a general rule, work on their computers
    in a nonprivileged mode, in which the user does not have the right to install
    software without a password. This is not the case in some versions of Windows.
    A virus or other form of malware attached to an file or application cannot piggybacked
    upon another file or install itself in your Linux system without a password ...
    well, theoretically, at least Of course, now that most recent versions of Windows
    use a privilege structure by default, this point is a less of an issue.


    There is also the matter of structural design. Every system has security holes
    that can be exploited by digital and human alike. Windows might be the Swiss cheese
    of operating systems in this regard. Course, Linux has its holes too, though far
    fewer than Windows does; and Linux plugs them through downloadable updates faster,
    once they are found.


    Finally, Ubuntu''s preconfigured security policy brings a defensive edge—there
    are no opening ports in Ubuntu desktop systems. This means your Ubuntu Linux system
    is even less susceptible to unwanted intrusions.


    # Does My System Need Protection?


    So, with all this talk about Linux''s great security, you might wonder whether
    you need to bother about it at all. Well, if you take a look at the Ubuntu forums,
    you might find yourself a bit confused. When asked Linux users need to install
    antivirus or firewalls, most users answer with an emphatic no. On the other hand,
    you''ll find an awful lot of people who have installed or are trying to install
    that software. Hmm.


    So, what''s a Linux user to do?


    If you are on a network where you transfer a lot of files among a lot of Windows
    machines, you might want to think about installing some antivirus software, or
    for nothing more than the good of the Windows systems involved and the users of
    those systems—your unenlightened (i.e., Windows-using) email paths, for example.
    You might also want to give it a go if you are, by nature, on the cautious side
    of the spectrum. Basically, if you feel safer to install some protection, go ahead.
    If it makes you safer to go whole-hog and install the full line of defense mechanisms
    I cover in this chapter, go ahead. After either way you go, it isn''t going to
    cost you anything, and it certainly isn''t going to hurt you.


    # The First Line of Defense


    Regardless of the system you happen to be using (though I am assuming that you
    have become a Linux devotee by now), the first line of defense for any computer
    permanently hooked up to the Internet is a router—electronic device that allows
    a number of computers to connect to a local network (such as in your home or at
    your office) to connect and share a single connection from your'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'Internet service provider (ISP). While the router is connected to your modem
    via cable, the connection from the router to the computers on your local network
    can be wired, wireless, or both.


    What does a router have to do with the defense of your computer? most routers
    include a firewall, which essentially functions to keep all of the bad stuff on
    the Web away from your computer, in the way that the firewall keeps your heat,
    fumes, and noise out of the passenger compartment. Built-in firewall is one reason
    that even people with only one computer, could just as easily connect their computer
    directly to a DSL modem, use a router. Of course, just how much security the firewall
    in your router provides depends on which filters you select in the firewall setup.
    For example, a very common and useful filter (particularly for those with a wireless
    network) limits Internet access to those machines specified on the firewall''s
    access list. This prevents your neighbors from hitching a wireless ride via your
    ISP connection. They''re not paying the bill, all after.


    The setup for a router is built into the router, so you don''t have to worry about
    software installation and system compatibility. Using your router with Linux is
    no different from using it with Windows. You can access the software and modify
    your settings via a web browser, as you can see in Figure 19-1. Just type the
    IP address of the router (usually provided in the owner''s manual) in the browser''s
    location bar, and you''ll be ready to go.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_377_0.png)


    Figure 19-1: Setting up a router'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# Software Firewalls


    If you don''t have a router and don''t plan on getting one or you have one but
    are bordering on paranoia, you might want to consider using a software firewall,
    in particular one of the most popular software firewalls available for Linux,
    Firestarter.


    You can get Firestarter via the Ubuntu Software Center by searching for Firestarter
    and installing it. Once it is installed, you can run it by selecting System Administration
    > Firestarter (you might be asked for your password). Firestarter starts with
    a self-explanatory setup wizard the first time. Just read each screen carefully;
    make whatever selection are suggested, if any; and click the Forward button in
    each of the screens until you get to the last one (shown in Figure 19-2). On that
    screen, make sure the box to Start firewall now is checked, and then click the
    Save button. The window will close, and the main Firestarter window will appear.
    Assuming the correct network device was detected and selected and the correct
    choice made, the firewall will be up and running.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_378_0.png)


    Figure 19-2: The last screen of the Firestarter setup wizard


    If the wrong network device was selected, a warning window will appear telling
    you so. In that case, you can do a bit of trial-and-error manipulation by selecting
    Edit > Preferences in the main Firestarter window and clicking Network Settings
    in the Preferences window that appears (Figure 19-3). In that window, select one
    of the other devices listed in the Detected device(s) drop-down menu, and then
    click the Accept button. Once back at the main Firestarter window, click the Start
    Firewall button (which looks like a Play button), and see what happens. If you
    still can''t start the firewall, repeat the process I''ve described, this time
    selecting a different network device.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_379_0.png)


    Once your firewall is up and running, there is nothing that you really need to
    do. You can simply look at the Firestarter window (Figure 19-4) to see what is
    going on network-wise on your computer—which active connections, how much information
    has been coming and going, and whether there have been any events in which, for
    example, the firewall blocked an intruder. If you click the Events tab, you can
    then see the details of those events, such as what connection attempts were blocked,
    where they came from, and when they happened.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_379_1.png)


    Figure 19-3: Selecting network devices in Firestarter


    Figure 19-4: Firestarter in action'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# Taking Control of Firestarter


    You can control how Firestarter deals with various network events by creating
    your own policies. The default policy in Firestarter allows you to do whatever
    you normally do via the Internet, while it blocks new connections to your computer
    from any other computer on your network.


    To make things a bit more draconian, you can click the Policy tab, select Outbound
    traffic policy in the Editing drop-down menu, and then select Restrictive by default,
    whitelist traffic. If you just want to deny any working-on your computer access
    to a specific website, for instance, simply select Permissive by default, blacklist
    traffic, right-click the Connections to host field, and select Add Rule in the
    pop-up menu. In the Add new outbound rule window, enter the domain name for the
    targeted site (as in example.com), click Add, and then click the Apply button
    in the main Firestarter window (it''s the one that looks like a green check mark).


    # Confirming Firestarter Runs Automatically


    After you run Firestarter the first time, it will itself to automatically start
    whenever you start your system. Don''t be concerned when you don''t see the graphical
    interface when you first started it; Firestarter will be running in the background,
    silently protecting your computer.


    If you are the doubting type, you can check to see whether Firestarter is actually
    running in the background by opening a Terminal, typing sudo /etc/init.d/firestarter
    status, and then pressing ENTER. If Firestarter is running, you will see the message
    * Firestarter is running... in the Terminal window. Worries over. If Firestarter
    isn''t running, the response will read * Firestarter is stopped.


    # Finding Out More


    If the world of firewalls is new to you, you can check out the Firestarter home
    page to learn a bit more. To check out the Firestarter Help menu, and check Online
    Users'' Manual, which will open the page in your browser. If you prefer to check
    the manual before installing Firestarter, point your browser to http://www.fs-security.com/docs/.
    You will also find a pretty good tutorial there.


    # ClamAV: Antivirus Software, Linux Style


    Despite the lack of viruses that can wreak upon your Linux system, your computer
    could still act as a transmitter of Windows viruses. As a result, a number of
    free antivirus scanners are available for Linux users interested in helping Windows
    users from viruses. These include Panda Desktop Secure (http://www.pandasecurity.com/usa/homeusers/downloads/desktopsecure/),
    f-Prot (http://www.f-prot.com/), and numerous others. For most Linux users, however,
    the virus scanner of choice is the open source contender: ClamAV.'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'Although it can be used on a number of operating systems, ClamAV is considered
    to be the Linux antivirus package. It is open source and totally free, and you
    don''t have to worry about licenses or suffer the bother of renewing them. Unfortunately,
    on its own, ClamAV is a command-driven application, which makes it a bit less
    user-friendly. Fortunately for all involved, a graphical interface, albeit a simple
    one, is available; it goes by the name of ClamTk. Both ClamAV and ClamTk are available
    via the Ubuntu Software Center—search for clamtk, and install Virus. The Ubuntu
    Center will automatically install ClamAV and all other packages it needs to run.


    Once ClamAV is installed, you can perform a virus scan by selecting Applications
    > Accessories > Virus Scanner. This will open the ClamTk Virus Scanner window
    (Figure 19-5).


    Once up and running, you can scan your system on demand from the menu. To scan
    a single folder, select A Directory. To scan a directory and everything inside,
    choose Recursive Scan. In either case, the Directory window will appear. Select
    the folder or disc you want to scan, and click OK. ClamAV will then scanning your
    system. ClamTk will tell you what it is scanning at any given moment in the empty
    space just below the button bar. If it finds anything suspicious, it will list
    that in the main pane of the window.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_381_0.png)


    Figure 19-5: ClamTk–the graphical interface for ClamAV


    ClamAV is set up by default to check for signature updates when it starts. These
    updates tell ClamAV what viruses to be on the lookout for. If you leave your machine
    on for days and days at a time, it is probably a good idea to set things up so
    that ClamAV will automatically check for signature updates daily rather than just
    on startup. To do this, go to the Advanced menu, and select Scheduler. In the
    Schedule window, select a time for ClamAV to update its check in the bottom of
    the window. Click the Add button when done. You can also use this window to set
    up a time to regularly scan the system—just select the time you''d like the scan
    to occur, and click Add. When you''re finished, click Close.


    As I mentioned, the only viruses you are likely to encounter during a virus scan
    are designed for Windows systems, which cannot affect your Linux system. Although
    it won''t hurt you to scan your entire system for viruses,'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'it is probably better to focus your virus-scanning activities on your Windows
    partition, if you have one, and on any files that you will be sending as email
    attachments, particularly to Windows users.


    # Project 19A: Virus Scanning with avast!


    Although ClamAV may be the virus scanner of choice in the Linux world, my personal
    favorite is avast!, defended me during my Windows years. I think it is easier
    to use and, for what it''s worth, nicer to look at. The downside, it does require
    you to register every year so that you can get a license key, but that is hardly
    a monumental task, and it is still free.


    # 19A-1: Downloading the avast! DEB Package and License Key


    First you have to get the avast! file and license key. You can do this by opening
    your web browser and going to http://www.avast.com/linux-home-edition/. Once you''re
    there, click the Download tab, and then download the DEB package of avast! Linux
    Edition.


    Once the download is complete, double-click the DEB package, and when the Package
    Installer window appears, click the Install Package button. You will then be prompted
    for password, and then click OK. The download and installation will begin. When
    these processes are complete, click the notification window and the Package Installer.
    Once you have downloaded and installed!, you''ll need a license key in order to
    use it. Just go back to the avast! Download page in Firefox, click the registration
    link, and then fill out and submit that form. You should receive your license
    key by email a few minutes later (though the page says it could take up to 24
    hours).


    # 19A-2: Running and Using avast!


    Once avast! is installed, you can run it by selecting Applications > Accessories
    > Antivirus. The first time you run avast!, a small window (Figure 19-6) will
    appear asking you to input your license code. Assuming you registered your free
    copy of avast! at the beginning of the process as I instructed to, your registration
    key should already be waiting for you in your inbox. Copy the key, and paste it
    into the text field in the Registration window using CTRL-V or by right-clicking
    in the box and selecting Paste. Once the license key is in place, click the OK
    button.


    The main avast! window (Figure 19-7) will now appear, but before you get started
    scanning avast!, it is a good idea to check for any updates to your virus database.
    New viruses are constantly appearing in cyberspace, so you should keep avast!''s
    virus database up-to-date so that it recognizes any viral newcomers. To perform
    the update, just click the Update database button, and let avast! do its thing.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_383_0.png)


    Figure 19-6: Entering your avast! license key


    ![](img/58abec7ac6c22ade6357fd77ea421da3_383_1.png)


    Figure 19-7: avast! virus scanner


    When avast is updating the virus database, you can get on to the work of virus
