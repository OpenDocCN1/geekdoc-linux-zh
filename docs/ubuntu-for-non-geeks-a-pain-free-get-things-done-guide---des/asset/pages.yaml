  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_110_0.png)


    Figure 5-17: Changing your instant messaging status


    # # Microblogging—Twitter and Friends


    Blogging (writing an online diary/journal) is now a well-established Internet
    pastime. Twitter is among millions of blogs out there covering all sorts of subjects,
    from astronomy to economics to fluffy kittens. The quality of content varies wildly,
    but for the most part blog entries are typical newspaper-opinion-column types
    of pieces. So, what if you had a blog where you were forced to write everything
    you wanted to say in less than 140 characters? That is the idea behind microblogging:
    making frequent, very short, bulletin-like posts.


    Twitter is the well-known microblogging website (http://www.twitter.com/). People
    find all uses for Twitter: You can let your friends know what you''re up to the
    moment, receive breaking news, discuss popular topics with other users, write
    posts using your mobile phone ... the list goes on. I followed a Twitter conversation
    between a few of my friends were watching a lively hockey game. They sent messages
    every time something happened, so I could follow the action textually, within
    seconds of it. News travels fast on Twitter.


    It''s the sort of thing you need to try to appreciate, so if you don''t have an
    account already, click the Sign up now on the Twitter home page, and follow the
    instructions. Once you''ve done that, take a look around the website to see how
    things works. The basic idea is you post messages (tweets) for your followers.
    People can choose to follow you by clicking a button when they view your user
    profile. You can choose to follow other people—when you do this, all of their
    tweets will be displayed on your Twitter home page for you to read. Most people
    follow a few people and typically have a handful of followers themselves, but
    there are no restrictions on how many of each you can have.


    74 Chapter 5'
  merge: -1
  img_proc: true
