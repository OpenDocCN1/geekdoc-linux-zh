- pgno: 280
  md: '# Project 13A: Importing Images from Digital Cameras


    Although scanner support for Linux can prove a bit picky, support for digital
    cameras is practically a worry-free affair. In fact, if Ubuntu can''t figure out
    what kind of camera you have, it just treats it as if it were an external drive
    or flash drive plugged into your computer''s USB port. And if your camera doesn''t
    seem to communicate with your connected directly, you can still transfer your
    images by removing the memory card from your camera, inserting it into a USB flash
    card reader, and plugging that into one of your computer''s USB ports. In that
    case, your system will mount the card reader as if it were an external drive (which
    is pretty much what it is), thus allowing you to copy the images to your hard
    disk. Of course, you can use this method even if your camera works just fine with
    Ubuntu—some people find it the easiest to deal with things, anyway.


    # 13-1: Importing Images from Camera to Computer Somewhat Automatically via F-Spot


    When you connect your camera to your computer via a USB cable, put your camera
    in play mode, and power it on, Ubuntu will automatically recognize and open a
    window that asks how you want to import the photos on the camera. To import the
    photos via F-Spot, accept the default selection in the drop-down menu button,
    Open F-Spot (as shown in Figure 13-1), and then click OK. After that, here''s
    what you need to do:


    +   1. In the window that appears, you will see thumbnails and filenames of all
    the photos on your camera. By default, all the images are selected. However, if
    you prefer to copy only some of the images, you can do so by holding down the
    CTRL key and clicking the desired images, as shown in Figure 13-2.

    2. Once you''ve made your selections, click the Target location button, and choose
    where to copy your photos. Your Pictures folder, or a subfolder within it, might
    be a logical spot.

    3. You can also tag the photos you are about to import by checking the Attach
    tag box and then selecting the desired tag from the menu button to the right.
    I''ll tell you more about tagging in Project 13B-2.

    4. Finally, click the Copy button.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_281_0.png)


    Figure 13-1: Ubuntu recognizes your camera and asks how to proceed.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_281_1.png)


    Figure 13-2: Selecting photos to import from your digital camera via F-Spot Photo
    Manager


    +   5. F-Spot will then begin the copying process, showing its progress in a separate
    window. When the download is complete, the words *Download Complete* will appear
    within the progress bar of that window. Click the **OK** button. You can now view
    your images within the main F-Spot window (Figure 13-3).'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_282_0.png)


    # 13A-2: Transferring Images from Camera to Computer via Nautilus


    As I mentioned, you can also use Nautilus to import photos from your camera. The
    process for doing this starts pretty much the same as I discussed in Project 13A-1,
    albeit with a slight twist. Here''s how you do it:


    +   1. Plug your camera into one of your computer''s USB ports, and put your camera
    into play mode. Within seconds, a window like in Figure 13-1 will appear. In window,
    select Open Folder in the drop-down menu instead of the default F-Spot, and then
    click OK. A Nautilus window will appear revealing the contents of your camera''s
    storage card. An icon for your camera will also appear in the side pane of that
    window and any other open Nautilus window (Figure 13-4) and on your desktop as
    a doubleclickable launcher.

    2. Double-click your way through the folders on your camera until you find the
    photos you want to import.

    3. Drag and drop or copy and paste the images from your camera to any logical
    spot in your home folder.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '+   4. When you''re done with your transfers, either click the eject icon next
    to the entry for your camera in the left pane of Nautilus window or right-click
    the icon for your camera on the desktop, and Unmount. The icon for your camera
    will then disappear from the side pane and desktop. Or, easiest of all, just turn
    off your camera, and the desktop and Nautilus instances of your camera should
    automatically disappear.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_283_0.png)


    Figure 13-4: You can also drag and drop photos from your digital camera as if
    it were a USB drive.


    # # Project 13B: Working with Digital Images in F-Spot Photo Manager


    F-Spot not only imports images from camera to computer but also acts as a handy
    photo-organizing, browsing, viewing, and editing tool. And working in conjunction
    with Evolution, the default email software in Ubuntu, F-Spot allows you to easily
    send images via email (**File > Send by mail**) without fiddling around with attachments.
    You can run F-Spot by selecting **Applications > Graphics > F-Spot Photo Manager**.
    Note that the first time out, you will be asked to select the folders that hold
    the images you want to import into F-Spot.


    # ## 13-1: Exporting Images to Online Albums and Galleries


    A very cool feature of F-Spot is that it allows you to export images to numerous
    online gallery or album sites, such as Flickr and Picasa, like Windows Live Photo
    Gallery. Exporting an image to an online gallery or album is'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'pretty simple, and I''ll use a Picasa web album for this example. Here’s what

    you need to do:


    +   1. Select the photos you want to place into your online album by holding

    down the CTRL key and clicking each photo.


    +   2. In the main F-Spot window, select Photo ▸ Export to ▸ PicasaWeb, after

    an Export window like the one in Figure 13-5 will appear.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_284_0.png)


    Figure 13-5: Exporting images to online galleries via F-Spot


    +   3. The first time out, you will need to click the Add button at the top of
    the

    window (to the right of the *Gallery*) to set up so that F-Spot

    can access your online gallery.


    +   4. In the small window that appears, type the username and password for

    your online album/gallery service (not your username and password

    for Ubuntu). Click **Add** in window when you’re done.


    +   5. You can also decide which of your online albums you want to add the

    photos by clicking the drop-down menu in the Album section. Or, if

    you want to create a new album, click the Add button to the right of that

    menu, provide a title and description in the small window that appears,

    and then click **Add**.


    +   6. Once back in the Export window, click the **Export**.


    F-Spot will start uploading your images to your online gallery site,

    letting you know what it’s doing in a progress window. Once, your

    browser will open to your online gallery page, revealing your newly uploaded

    images. You can toggle this post-export automatic browser opening feature

    by checking or unchecking the **Open album in browser when done uploading**

    box in the Export window (Figure 13-5).'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 13B-2: Organizing Your Photo Collections with Tags


    As your photo collection grows and grows, it can get rather tough to sort things
    out and find exactly what you need. Fortunately, F-Spot has a few ways of making
    this easier to deal with, one of which is the timeline slider, located immediately
    above the thumbnail-viewing pane, which allows you to locate images by year and
    month.


    An additional and interesting way of organizing things is by using tags, which
    allow you to identify images thematically. Applying tags and using such tags to
    narrow down your photo searches is pretty easy to do.


    First, to apply tags to your images, drag the appropriate tag icon from the left
    pane of the F-Spot window directly onto the image you want to tag. You can place
    more than one tag on a picture. Once you have added a tag, a small version of
    the tag icon will appear below the image, as you can see in Figure 13-6.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_285_0.png)


    Figure 13-6: Using F-Spot''s tags feature to help deal with hefty photo collections


    The number of preset tags is rather limited, but you can add your own by selecting
    Tags > Create New Tag.


    Give your tag a name in the Create New window that appears, and click Create.
    The new tag will then appear in the left pane of the F-Spot window, albeit without
    an icon. There are two ways to add an icon. One is to'
  merge: -1
  img_proc: true
