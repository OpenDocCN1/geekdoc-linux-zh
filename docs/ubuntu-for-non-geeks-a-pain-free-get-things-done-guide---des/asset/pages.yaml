- pgno: 215
  md: 'To remedy this situation, you could add the path of your pyWings script to
    the list of paths that the system checks for run commands, so as to make the system
    aware of your new application''s existence. However, let''s try another method
    that is easier. What you will do is create a link to pyWings, a sort of launchable
    alias, in one of the locations your system does check for commands.


    To create this link, you will be using three commands: cd (to change directories),
    and ln -s (to create the link).


    +   1. In the Terminal, type `cd /usr/games/`, and press ENTER. This puts you
    in one of the folders your system searches when you enter commands.

    2. Type `sudo ln -s /home/username/LocalApps/pywings/pywings.py pywings`, and
    press ENTER. (Note that there is a space between the words pywings.py and pywings
    at the end of that command string.)


    The `pywings` at the end of that command string is the name that you are giving
    the link; the name of the link becomes the command you will use to run the application.
    If you type nothing, the link will be `pywings.py`, which would mean three more
    more keystrokes for every time you wanted to start the program.


    +   3. Type your password when prompted to do so, and then press ENTER.

    4. Type `cd`, and press ENTER to return the Terminal to your home folder.


    # 9B-8: Running pyWings Again


    Now that you have created the link, you should be able to run the pyWings program
    much more easily. To try it, quit pyWings (if it is still running), type pywings
    in the Terminal window, and press ENTER. Your personal pyWings oracle should appear
    again.


    You''ve managed to cut down on the number of keystrokes required to run pyWings
    and want to use it, it will probably be handiest to add a launcher to your panel,
    a drawer, or the Applications menu.


    To add a pyWings panel launcher, for example, right-click any space in the panel,
    and select Add to Panel. When the Add to Panel window appears, click the Custom
    Launcher item, and click Add. In the Create Launcher window that appears, typing
    pywings in the Name section, anything you want in the Comment section (Your obtuse
    Guru, and assuming you created a launchable link in Project 9B-7, click the No
    Icon button, and then look around until you find an icon that suits your fancy.
    I like gnome-eog.png myself. Once you''ve made your selection, click Add in the
    Browse icons window, and then click OK in the Create Launcher window.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# 9B-9: Adding Emblems to Your LocalApps Folder


    Now that pyWings is successfully installed and working, it is probably a good
    idea to add an emblem to your new LocalApps folder so that you don''t inadvertently
    dump a bit in the Trash someday. You already learned how to do this in Chapter
    8, so I won''t give you the step-by-step instructions.


    # Project C: Command Practice Review with Briscola


    If you want to reinforce the skills you''ve put to use in the previous project,
    why not go a Continental tri Briscola—a simple, very traditional, Italian card
    game (see Figure 9-15)? Unlike pyWings, which is a Python script, Briscola is
    a script of a different flavor, written in a scripting language called Tcl, which
    uses something called Tk to create its graphical interface.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_216_0.png)


    Figure 9-15: Briscola


    # 9C-1: Getting Briscola


    You are just about ready to begin “installing” Briscola


    To do this, just open a Terminal window, type the following command string, and
    then press ENTER:


    ```

    wget http://www.rigacci.org/comp/software/briscola/briscola-4.1.tar.gz

    ```'
  merge: -1
