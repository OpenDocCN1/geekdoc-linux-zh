- pgno: 415
  md: '# The Installer Stops Partway Through


    This is probably one of the most annoying problems you can encounter. You boot
    from the Ubuntu CD, go through all the pages of options described in Chapter 2,
    and then click Install to start installing Ubuntu. But, after that, the installer
    doesn''t finish and gets stuck a few percent shy of 100.


    There are lots of reasons why this might happen, most of which relate to misbehaving
    hardware. I briefly described a few of the things you can try in this section,
    but because the underlying problem might be peculiar to the hardware in your computer,
    you will probably need to ask for help on the Ubuntu forums.


    Wait for a while Installation takes longer on some computers than others. There
    are many reasons why this could happen (such as problems getting hardware to work),
    but if you give it an extra 20 or 30 minutes, it might finish.


    Disconnect the Internet If you are connected to the Internet, the installer might
    try to fetch extra settings or look for package updates while it is running. If
    something goes wrong when it tries to do this, it could stall, and the installation
    won''t finish. Restart your computer and boot from the live CD again, but make
    sure you disconnect from the Internet before starting the installer.


    Disconnect any unnecessary devices Some computer hardware can confuse the installer
    just by being plugged in. Turn off your computer, and disconnect or switch off
    any devices that you don''t absolutely need to have attached. Printers, scanners,
    USB wireless cards, and external hard disks in particular should be disconnected.
    Then, start the computer, and attempt the installation again. Once installation
    is complete, you should be able to plug everything back without any problems.


    Check the integrity of the CD If the CD has a fault on it, the installer might
    not be able to access something that it needs from the disc. See "My Computer
    Won''t Boot from the CD" on page 376 for advice on how to check the integrity
    of the CD.


    # Something Goes Wrong Before Ubuntu Finishing Boot


    Boot problems are especially awkward—if Ubuntu won''t start, how can you access
    the software you need to fix the problem? To get around this particular annoyance,
    you might need to start the computer from a live CD (like the one included with
    this book) or use some special options to help the process along.


    This section covers the two most common classes of boot problems, GRUB errors
    and kernel problems. There''s some general advice for other types of boot problem
    too, including tips for dual-booters struggling to get Windows to start.'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# I Get a GRUB Error


    When you try to start your computer, you might be left with a black screen, which
    says there was a GRUB error. This means there is a problem with the GRUB bootloader,
    which is responsible for telling your computer''s hard-ware to start Ubuntu. Fixing
    these errors involves typing a few cryptic-looking commands or booting off a live
    CD, be prepared for that. You can find a short guide to handling common GRUB errors
    at https://help.ubuntu.com/community/Grub2#GRUB%20Errors/.


    # I Get a Kernel Panic or the Computer Freezes


    Kernel panics have a scary name for a reason. If you get an error message saying
    there was a kernel panic, something pretty serious went wrong in Linux-land, and
    you''ll probably find that can''t use the computer until you fix the problem.
    Fortunately, these errors are rare, and even if you do, you should be able to
    fix it without too much work. I should also note that kernel panics are only serious
    in that they make difficult to run soft-ware on the computer—the physical hardware
    side of your computer won''t be damaged at all, once you get the software working
    again, everything will be back to normal. So really, there''s no need to panic
    at all.


    Freezes and kernel panics often go in hand, but they''re not necessarily the same
    thing. You''ve probably seen a computer freeze before—moving the mouse or pressing
    keys on the keyboard does nothing, and the display stays frozen. If the computer
    freezes, all you can do is give a minute or two to see whether it wakes up and
    if, restart the computer or turn off by holding the power button for a few seconds.


    You can try a few things if you keep getting kernel panics or freezes, detailed
    in the following sections. If nothing seems to be working, ask for advice in the
    Ubuntu forums, and with a bit of luck, you''ll see be up and running again.


    A lot of freezes are caused by problems with hardware devices. If you recently
    bought some new hardware, try unplugging it and see whether you still get the
    freezes. If you recently installed system updates, the driver for some hardware
    could be causing the problem too. It''s worth unplugging any un-necessary hardware
    (such as scanners, printers, external hard drives, and the like) to check whether
    they''re causing the problems.


    # Disabled Drivers


    Some freezes are caused by problems with accelerated graphics drivers ("Games/Compiz
    Don''t Work: Installing Accelerated Graphics Drivers" on page 394) or restricted
    drivers for other hardware (see your Network/Wireless Card, on page 30). If you
    suspect that this might be the case, disable the restricted drivers if you can.
    To do this, select System > Administration > Hardware Drivers to open the Hardware
    Drivers tool (Figure 21-3). Select a currently activated driver, and click Remove.
    Then, restart the computer to see whether you experience any more freezes.'
  merge: -1
  img_proc: true
