- pgno: 356
  md: '# 17B-3: Running and Anglicizing Schnapsen


    Now Schnapsen is in your home folder, it''s time to run it. Open a new Terminal
    window, and then do the following:


    +   1. Move into the new Schnapsen folder by typing `cd Schnapsen` and pressing
    ENTER.


    +   2. Type `java -jar Schnapsen.jar` (be sure to place a space between java and
    jar and use a caret `^` at the beginning of `Schnapsen`), and press ENTER. Schnapsen
    will soon appear, after which you can start playing ... if you speak German.


    In case you''re wondering, here''s what you did in that last line: The first part
    of the command string, java, calls the Java Runtime Environment into action; the
    -jar flag tells Java that you are going to be running a JAR file, which is what
    a Java script is called); and the last part is the actual file you are going to
    run, Schnapsen.jar. (In the future, if you choose to run other Java-based applications,
    just follow the pattern: java -jar application_name.jar.)


    +   3. To switch the interface to English, go to the Settings menu, and select
    Sprache -> English.


    +   4. If you are not familiar with the German card faces and suits (referred
    to as Traditional in this game), you can switch them over the French suits you
    probably know (diamonds, hearts, spades, clubs) by going to Settings menu and
    selecting French in both the Cards'' set and Trump sign menu (Figure 17-18).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_356_0.png)


    Figure 17-18: Switching from German to French suits and card faces in Schnapsen


    You are now set to play. There are some basic rules in the Help menu, but you
    can also learn the rules of Schnapsen (and any other card game in the world) in
    greater depth at http://www.pagat.com/. Have fun!'
