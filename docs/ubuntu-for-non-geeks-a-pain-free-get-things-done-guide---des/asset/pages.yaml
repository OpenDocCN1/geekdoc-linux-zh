- pgno: 346
  md: '# 3D Games


    Most of the games I''ve mentioned so far are a well, . . . two-dimensional. Sure,
    2D games can be fun—I''ve certainly lost a significant portion of my life to Sudoku—but
    they don''t have the excitement factor that you get from shooting hordes of aliens
    or crashing a high-powered sports car into a wall. Unfortunately, games designers
    have traditionally neglected Linux to concentrate on the significantly larger
    Windows market, up until a couple of years ago there were few Linux-friendly 3D
    games to choose from. As the penguin has gone in popularity, however people have
    started to notice, and more Windows games now come with a Linux version.


    The open source gaming community has on leaps and bounds tou, and there are really
    high-quality games now. In this section I''ll run through a few of my favorites,
    after first making sure that your computer can handle the strain of 3D graphics.


    # Checking for Hardware Acceleration


    To play 3D games, you need a graphics card that can handle hardware acceleration.
    Without hardware acceleration, your computer''s processor has to do all of the
    fancy graphics rendering (a task for which it isn''t designed), so your games
    end up running at a snail''s pace, if at all. Most modern graphics cards have
    hardware acceleration support built, but whether it is enabled depends on the
    state of the Linux driver for your card. You can find out how good 3D support
    is for your graphics card at https://wiki.ubuntu.com/HardwareSupportComponentsVideoCards/


    If you want to know whether the minimum level of acceleration required to play
    games, then open a Terminal (Accessories ▸ Terminal), type glxinfo | grep rendering,
    and press ENTER. (That vertical line is the "pipe" symbol and can normally be
    inserted by pressing SHIFT+ on your keyboard.) If you get a message telling that
    glxinfo isn''t installed, use the Ubuntu Software Center to install mesa-utils
    and then try again.


    If hardware acceleration is enabled, you''ll see rendering: Yes in the Terminal.
    That''s good news, because it means you can skip to the next section and put your
    teeth into three-dimensional gaming goodness.


    If you received the message direct rendering: No instead, you''ll need to install
    different graphics drivers if you want hardware acceleration to work. See "Games/Compiz
    Don''t Work: Installing Accelerated Graphics Drivers" on page 394 for instructions.


    Many of the graphics drivers for Linux cannot handle anti-aliasing, which is the
    feature that removes jagged edges from graphics, making them smoother and more
    life-like. If you can''t live without anti-aliasing, you should also see Chapter
    21 for information on installing a better graphics driver.


    NOTE


    Chapter 7'
  merge: -1
