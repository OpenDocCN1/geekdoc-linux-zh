- pgno: 31
  md: '# INTRODUCTION


    ![](img/58abec7ac6c22ade6357fd77ea421da3_31_0.png)


    If you''re standing in the aisle of your local bookstore reading this right now,
    you may well be wondering who this book is for. Ubuntu for Non-Geeks, as you might
    imagine, is for readers who are interested in Linux but who feel the need for
    a jumping-off point of sorts.


    If you''re familiar with computers but unfamiliar with Linux, or if you are somewhat
    familiar with Linux but not with Ubuntu, this book is for you. This is not primarily
    a book for those seasoned geeks or power users; it is an introductory guide that
    will provide you with some hands-on experience that will get you up, running,
    and comfortable with the Ubuntu Linux distribution without pain. Think of this
    book as a map, a compass, and a comfy pair of hiking boots, rather than a harness,
    a rope, and a set of cramps.


    # Version Compatibility


    This fourth edition of Ubuntu for Non-Geeks is based on Ubuntu 10.04 (Lucid Lynx)
    Desktop edition. The CD bundled with this book is the Ubuntu Desktop CD, which
    lets you both try Ubuntu without installing it and install'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Ubuntu to your hard drive once you''re ready. It''s called a live CD. You can
    boot your computer from the CD and run Ubuntu directly off the CD without touching
    your hard disk so that you can see if like Ubuntu and make sure that Ubuntu will
    work with your hardware, if running the live CD, you like what you see and everything
    seems to work, you can install Ubuntu on your computer using the same disc. (There
    are instructions for doing so in Chapter 2.)


    The world of computers is dynamic, and there may be changes in the software and
    the links to the files in this book after publication. Please see http://www.edgy-penguins.org/UFNG/for
    updates.


    # Concept and Approach


    This book is intended as both a handy reference and a dynamic learning experience:
    You''ll get some-hand experience as you work through it. The text is organized
    by increasing skills, so as much as possible you won''t be asked to do something
    that you''ve already learned. In addition, you can pick the various morsels of
    knowledge you acquire through exercises, or projects.


    The projects in this book serve a secondary purpose as well: By working through
    them, you will learn to configure and customize your Ubuntu system. By the time
    you finish this book, you should have pretty good mastery over Ubuntu.


    These chapters should give you a better idea of what is in store:


    Chapter 1: Becoming a Penguinista—Welcome to the World of Linux

    What''s Linux? What''s Ubuntu? What''s a distribution? Can I...? Will me ...?
    Chapter 1 holds the answers to these and many other questions you might have as
    it introduces you to the world of Linux and what it takes to get it up and running
    on your machine.


    Chapter 2: Wading and Diving—Running and (If You Like) Installing Ubuntu

    The CD that comes with this book works as both a live CD and install Ubuntu. Chapter
    2 tells you how to run a live Ubuntu from the CD, and assuming you catch the Linux
    bug after doing so, how to install Ubuntu on your hard disk either as your sole
    operating system or together with Windows.


    Chapter 3: A New Place to Home—Getting to Know the Desktop

    Regardless of whether you are an emigré from the Windows or Mac worlds, you''re
    probably already familiar with the concept of a desktop. Chapter 3 points out
    the differences between Ubuntu''s GNOME desktop and the one on your previous operating
    system, and teaches you a number of cool tricks you can use to customize the look
    and feel of things. It also includes couple couple of GNOME Easter eggs (hidden
    surprises).'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Chapter 4: More Webbed Feet—Connecting to the Internet


    “Have computer, cybertravel” could be the mantra of the Internet age, and that
    being the case, Chapter 4 is an indispensable part of your Ubuntu experience.
    In this chapter, you will learn how to connect to the Internet and set up wireless
    and mobile broadband connections. You''ll also find tips for using a modem and
    some handy troubleshooting advice just in case you struggle to get connected.


    # Chapter 5: Slipping and Sliding—Exploring the Internet, Linux Style


    With Chapter 4 behind you, it''s time to get serious about all this Internet and
    start putting it to good. Chapter 5 takes you on a tour of Ubuntu''s suite of
    Internet applications, in particular the Firefox web browser. You''re introduced
    to Ubuntu''s email and instant messaging tools before embarking on a crash course
    in social networking with Twitter and Gwibber.


    # Chapter 6: Rounding Out the Bird—Downloading, Installing, and Updating the Easy
    Way


    The default Ubuntu installation includes most of the software you need, for free
    and waiting on the Internet. But there is still much more available out there,
    Chapter 6 teaches you how to easily download and install applications using the
    Ubuntu Software Center. You''ll learn about system and application updating and
    how to broaden your software horizons using third-party repositories.


    # Chapter 7: A Tiny Nest—File and Disk Handling in Ubuntu


    From creating folders to copying files to browsing your system and network, Chapter
    7 covers all things file management. You''ll learn how to work with USB storage
    devices, transfer files via Bluetooth, data CDs and DVDs, deal with CD-RW disks
    and multissection CDs, and create space-saving compressed archives of files and
    folders.


    # Chapter 8: Dressing Up the Bird—Customizing the Look and Feel of Your System


    Tired of looking at the same old desktop? Feeling nostalgic for your previous
    operating system? Chapter 8 tells you how to beat the déjà vu by changing the
    look and feel of just every element of your system and how to control of Ubuntu''s
    visual effects engine, Compiz.


    # Chapter 9: Simple Kittens—Getting to Know the Linux Terminal and Command Line
    ... and the Good Things It Can Do


    Many people stay away from Linux because they perceive it as a system in which
    everything still needs to be done by entering commands. That perception is, as
    the saying goes, a load of squashed avocados. Still, there is a lot of cool stuff
    that can be done via the command-line Terminal, and Chapter 9 will tell you all
    about it as it tames your fears and piques your interest in commands. Really.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Chapter 10: Gutenbergird—Setting Up and Using Your Printer and Scanner


    Just about everyone with a computer has or needs a printer. Chapter 10 tells you
    exactly how to get your printer (or scanner) working with Ubuntu.


    # Chapter 11: Polyglot Penguins—Linux Speaks Your Language


    Need to j off a note in Urdu? Write a book in Korean? Send a letter in Chinese
    to your friend in Chengdu? Chapter 11 gives you what you need to read and write
    in just about any language in the world.


    # Chapter 12: Penguins at Work—Getting Down to Business in Linux


    Work can be a drag, especially when there are many other things you could be doing.
    Still, wearing the ''ole'' fingers to the bone is part of life for just everyone
    outside of a Jane Austen novel, and you''ll be glad to know that Linux has lots
    to offer in this regard. Chapter 12 introduces you to the various productivity
    applications available.


    # Chapter 13: Brush-Wielding Penguins—Linux Does Art


    Those with an artistic bent will find Chapter 13 especially useful. Working with
    your digital camera, modifying images, and building web albums are just some of
    the topics covered.


    # Chapter 14: Tux Rocks—Music to a Linux


    Chapter 14 is the music lover''s treasure trove. You''ll learn how to rip CDs,
    encode MP3 or Orbis audio files, and create your own mix-and-match audio CDs.
    Several audio ripping and playback applications are also covered.


    # Chapter 15: Pluggin'' in the Penguin—Working with your iPhone, iPod, and Other
    Digital Media Devices


    Do you have an iPod? A Android? A $19 MP3 player from the flea market? Want to
    use it in Ubuntu? Chapter 15 tells you how.


    # Chapter 16: Couch Penguins—Video and DVD Playback in Ubuntu


    Sitting in your dorm room figuring out how to play your DVD copy of the Baxter
    on your Ubuntu-ized computer? Just finished filming a video of your sibling talking
    while asleep and want to do some creative editing of the evidence? Chapter 16
    covers these and other video-related topics.


    # Chapter 17: Feathered Flippers—Linux Gaming


    If music and art don''t keep your mind off enough, Chapter 17 presents you with
    more diversions: games. In addition to learning what your system comes with, you
    will also learn how to add more and even how to run Java-based games.


    # Chapter 18: Penguins at the Gates—Working with Ubuntu in a Windows World


    Like or not, Microsoft Windows is probably to stay here (for the foreseeable future,
    at least). Chapter 18 shows you how to share files between Windows and Ubuntu
    over a network, install Windows fonts, and even'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'install Windows programs to run under Ubuntu. Dual-booters take note:

    You''ll learn how to access your Windows files from Ubuntu and change

    the boot menu.


    # Chapter 19: Defending the Nest—Security


    Although Linux is about as safe and secure as an operating system as you

    are likely to use it, Chapter 19 tells you how to add a few additional lines of

    defense to your system.


    # Chapter 20: A Colony of Penguins—The Ubuntu Community


    If there''s one thing that sets Ubuntu apart from most Linux distribu-

    t, it''s the friendly, ever-growing Ubuntu community that surrounds

    it. In Chapter 20 you''ll learn how to participate in the Ubuntu commu-

    ity by reporting bugs, sharing ideas, and talking to other users.


    # Chapter 21: Winded Wings—Fixing Common Problems


    Don''t panic! If a computer problem crops up and is spoiling your fun,

    flip Chapter 21 and take heed of the many (and varied) trouble-

    shooting tips. You''ll find for the most common issues, and

    some general advice on diagnosing and treating your poor PC.


    # Appendix A: Installing Ubuntu from a USB Drive


    What with the proliferation of netbooks in recent years, installing

    Ubuntu from CD is beginning to see a little passé. Appendix A shows

    You how install Ubuntu from a USB memory stick, which will be par-\icularly useful
    if your computer lacks a CD drive or if you found the disc

    included with this book far too attractive to be used as a coaster.


    # Appendix B: Ubuntu Desktop Cbs for AMD64, Opteron, or Intel Core


    The CD bundled with this book is designed to work with i386 processors.

    It will also work with most 64-bit processors, although not in 64-bit mode.

    If you''ve got what it to run Ubuntu in 64-bit mode, Appendix B will

    show how to get what you need to do it.


    # Appendix C: Manually Partitioning Your Hard Disk


    If the basic partitioning device in Chapter 2 wasn''t enough for you,

    Appendix C shows you how to carve out your hard disk as you desire,

    free from the constraints of the Ubuntu installer''s sensible, but ulti-\imately
    simple, suggestions. If you''re a dual-booter and want an easy way

    share files between Windows and Ubuntu, this is for you.


    # Appendix D: Resources


    Are you crazy for Ubuntu and want to say so? Check out a forum. Do you

    have a hardware compatibility question? Some websites seem to have all

    t answers. Are you looking for free downloads, or do you want to read

    up on the other Linux distributions? Appendix D is a great start to.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# How to Use This Book


    You can use this book simply as a reference, but that''s not the main idea behind
    its design. Ideally, you should go through the book by chapter, doing the projects
    along the way. This will give you a much broader understanding of how things are
    done (and of how you can get things done), and it will reduce the chance for anxiety,
    confusion, and worse, mistakes.

    It is best to read this book and complete its projects when you are relaxed and
    have time to spare. Nothing makes things go wrong than working in a rush. And
    keep in mind that Linux and the projects in this book are fun, not just work exercises.
    Linux is fun so enjoy it!


    # About the Conventions Used in This Book


    There are a few points worth noting about the conventions used in this book. Items
    in **bold** type are ones that you need to click or manipulate in any way, such
    as buttons, tabs, and menus. Where words or phrases are defined, they have been
    set in *italics*. Text to input into a Terminal window is in a `monospace` font.


    # About the Projects in This Book


    The projects and other information in this book are primarily geared toward readers
    who have installed Ubuntu using the CD that comes with this book. Most of the
    information also applies to Ubuntu live sessions run from the CD. Note, however,
    some projects and actions cannot be performed in live sessions because they require
    write access to your hard disk, which is not possible during live sessions.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# BECOMING A PENGUinist


    Welcome to the World of Linux


    ![](img/58abec7ac6c22ade6357fd77ea421da3_37_0.png)


    In this first chapter, we begin our project to get you up and running in the world
    of Linux. If you have already made the commitment and have Ubuntu installed on
    your machine, you are essentially ready to go. Others of you might have made the
    commitment psychologically but have yet to act on that commitment. And some of
    you are probably reading these words in the aisle of a bookstore, wondering about
    Linux and about whether you should spend your money on this book or on a latte
    every morning for the next couple of weeks. For those in this last group, I can
    only say—“Get this book.” Save the wear and tear on your stomach and nerves.


    In any case, the first thing we need to do is get you up to what Ubuntu is all
    about, why you might want to install and use it, and what you will need in order
    to do so. I expect you will have lots of questions along the way and, if you are
    like most people, a few doubts. I hope that the time you finish this book and
    have your Linux system up and running, your doubts will be gone and your questions,
    for the most part, will be answered. Anyway, until you are ready to make the commitment,
    you can still follow along, because the CD that comes with this book contains,
    in addition to the'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Ubuntu installer, a live Ubuntu environment—meaning that you can get a taste
    of the Ubuntu Linux experience without having to even touch your hard drive. You
    can kick back, put your worries in check, and go with the flow.


    # What Is Linux?


    Your computer, despite being a collection of highly sophisticated parts, is just
    ... well, a collection of highly sophisticated parts. On its own, it can do nothing
    other than switch on and off and spin a disk or two. For it to do anything truly
    useful, it needs an operating system (OS) to guide it. The OS takes a well-educated
    but completely uneducated handler of a machine and educates it, at least so that
    it will understand what you want it to do.


    You already know of have probably used at least one of the many operating systems
    that exist today, or in the past. Windows, DOS, OS/2, and Mac OS are all operating
    systems, and Linux is another. It is different from these other operating systems,
    in terms of both its capabilities and its heritage. Linux is the kernel, which
    was created by computer enthusiast Linus Torvalds, a member of Finland''s Swedish
    ethnic minority, who wanted to create a Unix-like system that would work on home
    computers—particularly him.


    Rather than keeping his creation to himself, Torvalds opened it up to the world,
    to speak, and cangeeks around the globe to make it better and more powerful. It
    is this combination of applications built around the core of the Linux kernel
    that is the essence of all Linux distributions today.


    Linux has acquired many fans and followers since its creation in 1991. Its devotees
    praise Linux for its many features, as well as being robust, libre, free and open.
    Despite these positive characteristics, Linux, is on its own, just a text-based
    system. There is no pretty desktop, and there are no windows or charming little
    icons to make you safe and comfy when you are behind the keyboard. Powerful though
    it may be, Linux is strictly a black-screen, command line-driven operating system.
    I guess you could think of it as OS on steroids, though a Linux purist will surely
    cringe at the


    Although you can use Linux by itself, accomplishing all your tasks by typing commands
    on a black screen (the most common way of doing things when Linux is used as a
    server), you don''t have to do that. It is fair to say that the advent in 1984
    of the Macintosh and its easy-to-use graphical interface (GUI, pronounced “goo-ee”),
    DOS began suffering akin to GUI envy. They began clamoring for a GUI to call their
    own. The final result was Windows, which gave DOS a GUI and eased many command-users
    into the Microsoft world.


    Similarly, many members of the Linux world felt the need and desire to go graphical.
    The community at developed various GUIs (window managers and desktop environments)
    and a subsystem with which to handle (somewhat confusingly referred to as the
    X Window System) to bring about the'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'change. The graphical desktop environment that is included in your distribution—GNOME—is
    one example of the fruit of that development.


    # About the Penguin


    You may have been wondering about the penguin in the chapter title, so I might
    well explain that now. The penguin was chosen by Linus Torvalds as the Linux mascot,
    and what has come to be thought of as the Linux penguin was designed by Larry
    Ewing and is named Tux (see Figure 1-1). This explains not only the ornithological
    references and graphics throughout the book but also why there are so many penguin
    icons in Linux distributions and so many programs that include *penguin* or Tux,
    such as TuxRacer, XPenguins, and Pingus. This, combined with the fact that Linux
    is a revolutionary OS, helps why Linux users are sometimes referred to as *Penguinistas*.
    True, Ubuntu doesn''t play the penguin as much as other distributions, but Linux
    is Linux, and so the penguin lives in Ubuntu...just a bit less conspicuously.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_39_0.png)


    Figure 1-1: Tux, the Linux mascot


    # Why Should You Use Linux?


    People use Linux for different reasons. For many, it is a matter of power, stability,
    multilingual capabilities, or even personal philosophy. However, for others, crass
    as it may sound, it is a matter of money. Just think for a moment what it usually
    costs to get started with an operating system. Go to wherever it is to buy software,
    and take a walk down the aisles. Make a list in head of all the things you want
    to buy and how much each costs: an office suite; a game or two; maybe a graphics
    program with which to make yourself look better in your digital photos; and a
    collection of all those firewall, antispan, antivirus, and adwareware programs
    that you really need to protect yourself in the Windows world. Do not do the math.


    After you pick yourself off the floor, you will understand that we are talking
    big bucks here. On the other hand, for the price of this book, you will have all
    of the things you wanted and more in the Linux world. Despite the'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'worries that many people have, making the move to Linux means not only savings
    for you but also more computing versatility. You will not be hamstrung at some
    point along the way because you don''t have this or program when you need it—you''ll
    have it all from the get-go or be able to download it—and at no cost!


    You might counter with the fact that there are a lot of free applications out
    there for other operating systems, but c''mon, let''s face it—these are often
    limited in terms of their capabilities. Programs with a little more are mostly
    shareable, and most shareable programs are limited in some way, or you use them
    for a short time unless you are paying for them. Sure, their costs are relatively
    low, but $25 and $35 everything adds up to a considerable chunk of change. There
    is also the problem that some of these programs, unknown to you, install backdoors
    or keyloggers or make your system a garden of adware. Finally, at least in my
    experience, the majority of such programs are hardly worth the money asked.


    # Is It All Just About Money?


    Although money is important to the average user, it is certainly not the only
    reason for taking the Linux plunge; there is a variety of other reasons well.
    As I mentioned, Linux is noted for its stability. Running your current system
    for a month without a reboot for more than a year without a hitch or decrease
    in performance. Linux is well known to run without a reboot. With its multilingual
    capabilities, Linux is also a perfect choice for language students or users in
    a multilingual environment.


    In addition, Linux is infinitely customizable: You can get your system to look
    and act the way you want to without being "wizarded" to death. And then there
    are the applications that come with most Linux distributions. In addition to their
    variety, most are up to industry standard, with many such as Evolution, the GIMP,
    and Inkscape, being sources of envy for those outside the Linux world.


    Finally, with the advent of Microsoft''s Windows 7 and its demands hardware requirements
    (especially if you want to take advantage of its most touted features), you may
    find your current machine on the fast track to obsolescence. Turning it into a
    Linux machine will ensure several more years of working life. After all, it''s
    a shame to put good hardware out to pasture early.


    # But Is Linux Really Ready for the Desktop?


    Despite the advances Linux has made in recent years, this question still pops
    quite often, and that''s fair enough. But consider this: When you install a program
    on your current Windows system and get an error message saying that the program
    can''t run because some DLL is missing, or when you connect a piece of hardware
    and can''t get it to run, no one asks if that operating system is ready for the
    desktop.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'In my experience, I have found no reason to doubt that Linux is ready. Sure,
    Linux has its occasional quirks, but so does every other operating system. If
    my mother, a computer wiz, can hardly do the work she needs to do and can keep
    herself amused until the middle of the night using her Linux system (without blowing
    the whole thing up), I think it''s pretty safe to say that you''ll all right too.


    # What Is a Distribution?


    An operating system consists of a lot of files that perform a lot of different
    functions. And because there is no Linux corporation to package and distribute
    the files that make Linux, the task of getting Linux onto your computer in working
    order, along with the applications that you are likely to want, has fallen to
    a varied group of entities—companies, universities, groups, and even private individuals.
    These entities create Linux system and application collections called *distributions*,
    or distros. You could bypass such distros and collect everything you''d need to
    set up a system on your own, but would undoubtedly lose your mind in the process.
    Most people, even the geekiest, opt for the distros.


    Most of these distros, whatever their ultimate audience, basically consist of
    the same main elements; the core operating system (that''s the Linux kernel mentioned
    earlier); or some installer program to get all the system parts and applications
    installed on your machine; the Window System to provide graphical interface support;
    or one more graphical desktop environments; and a series of applications, as word
    processors, audio players, and games; as well as all the files needed to make
    these things work.


    There are, of course, a large number of distros. Some are geared toward specific
    audiences, such as businesses, educators, gamers, students, programmers, system
    administrators, and specific language users. What makes each distro different
    is the software that is bundled with the Linux kernel, as well as other convenience
    features such as the package (or application) installation mechanism and the installer
    for the system itself. Some distros are especially appropriate for home users
    because of their ease of use. Ubuntu, a relative newcomer to the Linux world,
    is joining other distros that have long been popular in the ease-of-use arena,
    as Mandriva, SUSE, and Fedora Core. Although some of these entities charge for
    their distros, most also provide them free for download.


    # What Is Ubuntu?


    Ubuntu is a completely free, easy-to-use, and extremely popular Linux distribution
    that is geared toward the desktop user. It is one of the hottest Linux distros
    in the marketplace today with what could be described as a social agenda behind
    it.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Ubuntu is the brainchild of South African millionaire entrepreneur Mark Shuttleworth,
    who is probably better known for being one of the first space tourists—the first
    African in space, to be exact. Shuttleworth invested more than $10 million in
    starting the Ubuntu Foundation based on his belief in free software and in order
    to fix what he describes as "bug #1”—Microsoft’s dominance of the desktop marketplace
    (https://bugs.launchpad.net/ubuntu/+bug/1).


    As Shuttleworth states philosophy in his blog (available at https://wiki.ubuntu.com/MarkShuttleworth):


    I believe free software brings us into a new era of technology, and holds the
    promise of universal access to the tools of the digital era. I drive Ubuntu because
    I would like to see that delivered as reality.


    As you can see, it’s a vision thing.


    Bestitting the nationality and goals of the man who brought it into being, the
    word Ubuntu comes from the Zulu and Xhasa languages. Ubuntu, according to Wikipedia,
    is a concept meaning something along lines of "humanity towards others" or "I
    am because we are." If you''re interested, the 2005 film In My Country, although
    not one of the greatest films ever produced, is on many levels a 100-minute examination
    of the concept of Ubuntu.


    # Why Ubuntu Then?


    With so many distros out there, you might wonder why you should opt for Ubuntu.
    Well, as they say, numbers don''t lie, and Ubuntu''s popularity is not without
    good cause. These traits are especially crowd pleasing:


    # Easy to install


    It''s fair to say that most Linux distributions these days are easy to install
    (and easily easier and faster to install than Windows). Ubuntu is right in line
    with these improvements, and the fact that you can install it with only a few
    clicks while running the live CD means it is pretty ready to go whenever you are.


    # Easy to use


    Ubuntu is easy to use that it is very Windows-like in operation, and yet it''s
    more Linux-like than other Windows user-oriented distributions. It is designed
    with the needs of real people in mind, not just comput-nerds and geeks.


    # DEB based


    Ubuntu is based on the Debian distribution, which means that Debian''s very convenient
    DEB package system for application handling and installation. The two preconfigured,
    package installers that come with Ubuntu make installing applications even easier.
    So many packages are available for Debian systems like Ubuntu that you are likely
    to find more software out there than you''ll ever know what to do'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Up-to-date


    Some distros are updated at a snail''s pace, while others strive to be so cutting
    edge that they are often plagued with bugs. Ubuntu, with its six-month release
    cycle, tries to stay as up-to-date as possible, while at the same time making
    that they are not released before they are ready for prime time. In this way,
    you are ensured of having any-to-date yet buggy distro at your disposal.


    # Dependable and robust


    I know these things come as mere hype, but after you smack Ubuntu around a bit,
    you come to understand what they mean. Knock things down and around, and they
    bounce right back—this is very important for beginners who often have a knack
    for screwing things up. Nothing turns a new user off more than a twitchy system
    that has to be velvet-loved all the time.


    # Desktop user-oriented


    A lot of Linux distributions, although quite capable in the desktop arena, cater
    more to geeks and developers, taking up valuable disk space with a lot of junk
    you''ll probably never use. Ubuntu''s purpose is to grab market share from the
    Redmond folks, so the needs of the common end user are always in mind. The result
    is that Ubuntu''s GNOME desktop-environment is a very comfy place for the average
    user to be.


    # Hardware Compatibility


    Well, of this background babble; it''s time to get things rolling. If you haven''t
    installed Linux on your machine yet and are wondering whether you can, rest assured:
    Ubuntu will run on most machines out today. Of course, you never know until you
    get up and running. There are so many minor parts to your machine that it is difficult
    to say whether each part will cooperate with your installation. There are video
    cards, sound chips, LAN cards, monitors, and so on, and all they need to be considered.


    # Diving In


    If you are going to buy a new machine to run Ubuntu, then it is reasonable to
    do a bit of worrying and check things out but if you are going to install it on
    the machine you have, I recommend just diving in. After all, you don''t really
    have to install anything the first time. You have a live CD right here in this
    book, after all, so you can just pop CD in your drive, boot your machine, and,
    biff, bam, zoom, you''ll be up and running (or not) in a minute or two. If everything
    seems to go as it should... well, your worries are over, and you can go ahead
    and install the system when you''re ready and willing. That is one of the Ubuntu
    advantages—not only all the essentials fit on a single CD (compared to four or
    more other distros), but that CD is both a live operating environment and the
    installer! You can''t get more convenient than that.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# When Research Is Required


    If you don''t work out for you with the live CD, you can start taking a look at
    Chapter 21. If you don''t find the answer to your problem there, search the Web
    to see whether you can identify what of your hardware puzzle is causing your problems.
    (Or if you are looking to buy a machine to install Ubuntu, that is supported by
    Linux.) Of course, before you do this, you should know what models of hardware
    you have, central processing unit (CPU), monitor, and video card if you want to
    be able to find out anything. Identifying your CPU and monitor should be easy
    enough, but the motherboard and video card may require a bit more searching.


    If you have no documentation that clearly states the make and model of these devices,
    you can find out most things you need to know from within Windows by going to
    the Windows Control Panel, double-clicking System, and then clicking the Hardware
    tab in window. Once on the Hardware tab, click the Device Manager button, and
    see what you can find about your components. Sometimes the information there is
    limited, so you might intend to try a software application such HWINFO (http://www.hwinfo.com/)
    or Sandra (http://www.softwares.net/) to get more useful details, such as the
    specifications of your motherboard or the supported video modes for your current
    setup.


    Both HWINFO and Sandra should give you the information you need about your motherboard,
    but if they don''t (or if you don''t feel like bothering with), you can always
    just open the case of your computer and look at your board, though I wouldn''t
    recommend doing so if you have a laptop. Once inside, you needn''t worry about
    damaging anything because you don''t need to touch anything—so don''t. You may
    need a flashlight to find it, the model name and number should be stamped somewhere,
    either in the middle of the board or around the edges. Mine, for example, says
    quite clearly in the middle of the board “AOPen MX46-533V”. You should be looking
    for similar information.


    Once you have your information, you can do a variety of things to check your hardware''s
    compatibility with Ubuntu. You can also search Yahoo! or search the plus Linux.


    You can also post a question to the Ubuntu Forums (http://www.ubuntuforums.org/)
    or one of the other Linux forums or mailing lists on the Web. Chapter 20 might
    provide you with additional sources of information, and Appendix D lists still
    other others. When posting a forum, just write that you are a newbie and want
    to know whether anyone has any experience using Ubuntu with the board (or other
    hardware) in question. You will probably get a few responses. Linux users are
    usually rather evangelical in trying to draw in new Penguinists.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Hardware Requirements


    All worries about compatibility aside, you will need to meet some minimum hardware
    requirements:


    +   - Any computer with a 1 GHz or higher i386-based processor, or an Intel or
    AMD 64-bit processor

    - About 5 gigabytes (GB) of hard disk space, though having at least 10GB would
    be a bit more comfy

    - Sufficient memory (RAM)


    NOTE The CD that comes with this book is designed to work on machines with i386-based
    processors (basically, all the Pentium chips, including Celeron, Xeon, and the
    new Core Duo, as well as processors from AMD). Though this CD will install Ubuntu
    on a computer with an AMD or Intel 64-bit processor, it will run in 32-bit mode.
    To make full use of your 64-bit processor, you need to download the 64-bit version
    of Ubuntu. Additional information is provided in Appendix B.


    As random access memory (RAM), the official specs tell you that you need a minimum
    of 512 megabytes (MB) to run Ubuntu. Although you can no doubt get by this, you''d
    get with much more you. My basic rule of thumb, no matter what OS I am dealing
    with, it is that you recommend (not the minimum) memory plus at 128MB. Regardless
    of what the official specs say, put in more. You won''t regret it


    Saying "more memory you have, the better" might sound a bit silly, and perhaps
    even cavalier, but trust me on this. When you have too little memory, no matter
    what system you are running, weird things happen: Applications seem to take years
    to open or not at all, make forever to render their little icons, and freezes
    and general system meldowns happen more often. In other words, running your machine
    on too little RAM is sort like trying to do jumping jacks in a broom closet. Sure,
    you could do it, but you would be contorted, and you''d be smashing your hands
    into the walls every 1.4 seconds.


    Fortunately it is pretty hard to find a machine with less than 512MB of RAM these
    days (256MB, perhaps on the really old beasts!), but if you do happen to have
    such a machine, you can at least solace in the fact that memory is relatively
    cheap, so for it.


    # Good News for 64-Bit Machine Users


    It is again important to mention that the CD that comes with this book is designed
    to work on machines with i386-based processors, which pretty much covers the vast
    majority of PCs out. If your machine is 64-bit compatible, you will be glad to
    know that it will work, albeit not in 64-bit mode. Sorry, but no.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Fortunately, there is good news for those of you who were a bit disappointed
    by the content of that previous paragraph. Ubuntu is available in a native 64-bit
    version. Check Appendix B for information on how to get it. The information provided
    there will also be of use for i386 users who have to lose or damage the disc that
    comes with this book.


    # Mixed News for Mac Users


    Those of you with pre-Intel era PowerMacs (such as those with G3, G4, and G5 processors)
    may be aware that previous Ubuntu releases have been available in PowerPC versions.
    Unfortunately, as of the Ubuntu 7.0 Feasty release, this is no longer the case.
    This means that if you are a Power Mac user, you will have to use one of the older
    Ubuntu releases or use an unofficial, community-supported release of Ubuntu 10.04
    Lucid Lynx (or on that name in the following section) for PowerPCs (http://cdimage.ubuntu.com/ports/).


    Of course, if you are using an Intel-based Mac, you will be in luck: The disc
    that comes with this book will work on your Mac. After all, the i i386 stands
    for "Intel"


    # Speaking Ubuntu


    It''s worth noting that you are bound to come across a lot of weird phrases when
    dealing with Ubuntu, especially when searching for information on the Net. In
    particular, I am referring to seemingly incongruous phrases, such as Warty Turnbull,
    Hoary Hedgehog, Breezy Badger, Ducky Drake, Edgy Ej, Feasty Faun, Guilty Gideon,
    Hardy Heron, Intrepid Ives, Jaunty jackalope, and Karmic Koala. These are the
    unique code of each of the releases of Ubuntu since its first appearance in 2004.
    The important one for you to remember is that of the current release, which is
    the one on your book''s disc: 10.04,


    You are also likely to come across a few other variations of the Ubuntu theme.
    These are Ubuntu, a KDE-based version of Ubuntu; Edubuntu, a special version of
    Ubuntu designed for the classroom; Xubuntu, a lightweight version of Ubuntu based
    on the XFCE desktop; and Ubuntu Studio, a new flavor of Ubuntu, aimed at "creative
    people," which contains a strong set of graphics, video, and music applications.
    There''s even a slimmed-version of Ubuntu, called Ubuntu Network Edition, designed
    specifically-


    # Where Do I Go From Here?


    Now that you know more about the world of Linux and Ubuntu and you have your disc
    in hand, it''s time to get down to it. If you have already installed Ubuntu on
    your machine, it''s time to flip ahead to Chapter 3. If your machine is still
    Linuxless, though, it''s time to take it out for a spin and see what you like
    it. So now, strap yourself down in front of that computer, click on your spurs,
    and go straight to the next chapter. It''s time to become a Penguinist!'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 2


    # WADING AND DIVING


    Running and (If You Like) Installing Ubuntu


    ![](img/58abec7ac6c22ade6357fd77ea421da3_47_0.png)


    As I have already mentioned, one of the great things about Ubuntu is that it comes
    on a live CD, which means that you can try it before you install it . . . or never
    install it at all,


    if that''s what you prefer. Better yet is the fact, unlike earlier editions of
    Ubuntu, you don''t need an additional CD if you choose to install it—the Ubuntu
    Desktop CD functions as both a live CD and an install CD. And in the good-better-best
    swing of things, the best point of all is that installation from the live CD is
    actually much, much easier than any other installation process you''ve dealt with,
    and it gives you more than one way to go about it.


    In this chapter, I will cover the basics of starting up and running Ubuntu from
    the live CD and then, assuming you''ve caught the Linux bug, the painful-steps
    of installing Ubuntu on your hard disk as your sole operating system, in its own
    partition on your hard disk in a traditional dual-boot setup (with Windows in
    its own partition), or, for the slightly less adventurous, from within your Windows
    system. If your computer doesn''t have a CD drive, don''t worry,'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'can still join in—take a look at Appendix A to see how you can run or

    install Ubuntu from a USB drive instead. Whatever way you end up

    going about things, let''s put this book to use and get Ubuntu and running.


    # Going for a Dip


    To get a taste of what Ubuntu is all about (and check out your hardware to

    whether it''s all comfy-cozy with Ubuntu), there is probably no better way

    to go run Ubuntu directly from the live CD. To do this, just place the

    Ubuntu Desktop CD in your drive and restart your. When the

    machine starts up, it should boot up from the CD, and after a second or two,

    you should see a Ubuntu startup screen with a couple of icons at the

    bottom of it. If the screen does not appear and your instead boots

    into your usual operating system, then it is very likely that your machine''s

    BIOS settings need to be changed to allow boot from a CD.


    You can access your machine''s BIOS by restarting and then pressing-

    ever the onscreen instructions assign to accessing the BIOS setup.

    This is usually DELETE or F1 (F2, F10, and ESC are also common), but not

    machine are the same. If the onscreen information passes by fast that you

    it miss, you can check your user''s manual to see what the correct key is. Once
    you

    get into the BIOS setup, change the boot sequence so that your drive is first.


    Once your machine boots from the live CD and you see the purple

    Ubuntu startup screen, either you can wait for a few seconds for Ubuntu to start

    ing into the CD proper or you can press a key (any key) to display a

    menu where you can choose your language and other settings. The default set-

    tings should suffice for our purposes, so leave the keyboard untouched for a

    few seconds, and purple will give way to a loading screen (also purple).


    After a couple of minutes or so, the loading screen will disappear, and

    in place will come an Install window like the one in Figure 2-1. You

    now be able to use your mouse as well as the keyboard, so unless you want

    to change the language using the list on the left of the screen, click the Try

    Ubuntu 10.04 boot to start a live session. After a few seconds of load-

    ing, you''ll be presented with an Ubuntu desktop, all run from the CD. And

    remember, your hard disk will go untouched, so rest easy—you''re not going

    to change, let alone hurt. When you get to this point, you''re ready

    to roll—I''ll hold off on talking about that until Chapter 3.


    > Special input mechanisms that are required for typing certain languages (that
    is,

    Chinese, Japanese, and Korean) are not supported in live sessions.


    If you''d like to get out of the live CD and return your computer to normal,

    click the power button at the top right of the screen, choose Restart,

    then choose Restart again from the window that appears. After a little while,

    You''ll be able to remove the CD from the drive and press ENTER. The

    computer will restart and return you to your normal Windows desktop soon after.

    If you have no luck with the Restart button for some reason, it would be safe

    to just turn your computer off and then on using the power button on

    the front of it.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_49_0.png)


    # # Choices, Choices, Choices—Installation Options


    If you have already installed Ubuntu on your machine, are satisfied running it
    from the live CD, or haven''t made up your mind what to do, you can skip the rest
    of this chapter and continue to the next one to get started working-with the Ubuntu
    desktop. If, however, you haven''t installed Ubuntu yet and are ready and ready
    to do so, then you had better stay where you are and continue reading.


    # ## Going for a Swim—Installing Ubuntu Inside Windows (the Wubi Installer)


    It used to be that if you enjoyed Ubuntu enough to run it off your hard disk but
    were afraid to do it for fear of damaging the delicate state of your Windows setup,
    you were . . . well of luck. Things have changed, because there is now an installation
    option called Wubi that lets you install directly on your Windows C drive as if
    it were any other Windows program. Once installed, every time you start up your
    machine, you will be able to choose between starting up into Windows or Ubuntu
    from the Windows bootloader screen. Your Windows system stays as it is; you don''t
    have to partition your hard disk; and if you want to get rid of Ubuntu later for
    what-ever reason, you can do so like you would with any other Windows application.
    It''s a great way to go about things for the faint of heart.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Admittedly, this approach could be described as a half measure, in that it
    doesn''t really give you the full experience you would normally get from a dedicated
    Ubuntu installation. It also takes longer to install, because Wubi needs to download
    the installation files from the Internet (the right ones aren''t on the CD). But
    it is a pretty good compromise—it runs quicker and is, much more usable and enjoyable
    than an Ubuntu live session. You also have the added benefit of being able to
    save files and settings to disk, which means you can follow along anything described
    in this book. Pretty cool.


    If this alternative installation approach doesn''t seem appealing to you, move
    on to "Taking the Full Plunge—Installing Ubuntu Outside of Windows" on page 16.
    If you have made up your mind and would like to know a bit more about this Wubi
    installer, point your browser to http://wubi-installer.org/. If, on the other
    hand, you''ve decided that the Wubi installer is the answer to your prayers, here''s
    what you need to do: Insert the Ubuntu live CD that comes with this book into
    your computer''s drive while Windows is up and running. A window like the one
    in Figure 2-2 will automatically appear.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_50_0.png)


    Figure 2-2: An Ubuntu live CD automatically launched in Windows


    +   1. In that window, click the Install inside Windows button. The Ubuntu Installer
    window will appear (Figure 2-3).

    2. Use the Installation drive to specify where you want the Ubuntu files to be
    put. Make sure you have enough space on that drive!

    3. Windows and Linux can''t share the same disk space, so you need to set some
    aside for by Ubuntu only (you can easily reclaim the space by uninstalling Ubuntu,
    discussed in a moment). Choose how much disk space you''d like to have available
    in Ubuntu by selecting a size from the Installation size drop-down list. Anything
    less than 6GB will be very restrictive.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '4. Leave the Desktop environment set to its default value (Ubuntu), and then
    choose a username and a password. Click the Install button once you''re happy
    with your choices.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_51_0.png)


    Figure 2-3: Choosing to install Ubuntu inside Windows


    5. If your machine is not already connected to the Internet at any point, you
    will be told to get it connected. Do so if you need to, and click the Retry button
    if the warning window appears.

    At this point, Wubi will begin downloading the files it needs to create a bootable
    Ubuntu installation within your Windows environment. Depending on your connection
    speed, this could take quite some time.

    After all is done, you will see a window like the one in Figure 2-4 asking you
    to reboot.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_51_1.png)


    Figure 2-4: Ubuntu has completed the first phase of its inside-Windows installation.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   6. Select Reboot now and click the Finish button in that window, after
    which your machine will reboot.


    +   7. When the machine restarts, you will see the Windows bootloader, a black
    screen with white text, which allows you to decide whether to boot up in Windows
    or in Ubuntu. Use your down arrow key to select Ubuntu, and then press ENTER.


    Your machine will then begin the Ubuntu startup process, which should be new territory
    for you. Once the Ubuntu desktop appears, Ubuntu will get to working things up
    for you, which might take a bit of time, depending on the speed of your machine.
    When it''s done, you will be delivered to the login screen (Figure 2-5); you can
    now flip to Chapter 3, because you are done here.


    If you decide that you do not want to keep Ubuntu on your machine, you can remove
    it from within Windows by going to the Windows Control Panel, selecting Add or
    Remove Programs, and then selecting Wubi for removal.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_52_0.png)


    Figure 2-5: The Ubuntu login screen


    # Taking the Full Plunge—Installing Ubuntu Outside of Windows


    If you don''t already have Windows installed on your machine, you can skip this
    section. If you do, you are going to have decide which you want to keep it.


    It is possible to have both Windows and Linux installed on the same machine and
    for them to happily coexist. This is known as a dual-boot setup. It has also become
    incredibly easy to set up such a system. I started out with a


    16 Chapter 2'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'dual-boot, though I eventually found that I used the Linux side of things exclusively.
    Having so much disk space being taken up by a Windows system I didn''t use seemed
    a waste of prime real estate, so eventually I dumped the whole thing and went
    for a straight Linux-only setup.


    My feeling is that you should try the Wubi route of installing Ubuntu inside Windows
    first and then, when you''re ready, go for a Linux-only setup and ditch Windows
    completely. Most people find Ubuntu can do anything they need, so there''s no
    need to dual-boot unless you require some specific application that has no equivalent
    on Linux.


    If you opt for a dual-boot setup, starting up in either system is easy. When you
    start up your machine, you will be greeted by the GRand Bootloader (better known
    as grub) screen, from which you can choose to continue booting Linux or choose
    Windows instead. After that, boot proceeds for the system you selected. This setup
    works fine and is easy to use, so you needn''t worry.


    So as you see, either you decide to go, you can''t really go wrong. Just be sure
    to back up your important files before starting the installation. Proceed with
    common sense, patience, and a positive attitude, and you''ll be fine. In short,
    don''t worry.


    # Getting Ready for Action


    There is less you need to prepare for an Ubuntu installation than many Linux distributions.
    Once you''ve decided whether you want to go the dual-boot route, you all really
    need to have on hand your single Ubuntu Desktop CD, and for guidance and security,
    the only mental energy you''ll probably need to expend is to come up with a username
    and user password, as you do for most operating systems.


    # Usernames and User Passwords


    Your username is something that will be quite a bit. You will need to click it
    every time you boot up your system, other things, so be sure it is something you
    can live with. It can be just your first name or your initials whatever you want
    it to be. It must, however, begin with a lowercase letter, followed by numbers
    and/or lowercase letters. For example, is simply rig but you could use something
    like hope42, though that would get rather tiring to look at.


    You also need to come up with a user password, which you will need to type every
    time you log in. You will need to use it when you install new software or change
    system settings, as well. It should be a minimum of eight characters in length
    and consist of numbers and letters (upper lowercase) for improved security. You
    can, of course, get by fewer characters and only letters if you prefer. The installer
    will advise you if the password is unacceptable, so don''t worry too much. Be
    sure to write it down and keep the paper you''ve written it on in a safe place
    so you don''t end up locking yourself out of your system.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'NOTE If you experience working with other Linux distributions, you may be surprised
    to learn that the root account is disabled by default in Ubuntu. There is, therefore,
    no installation step for inputting a root password. You can check the forums (http://www.ubuntuforums.org/)
    to learn ways of getting around this setup. You can also set up a root password
    later at any time after the system is installed, so if having a root account is
    important to you, don''t worry.


    # Dual-Booters Take Note


    If you are going to creating a dual-boot setup, it is a good idea to defragment
    your Windows disk before moving on to installing Ubuntu. This step isnt strictly
    necessary, but it can make the repartitioning phase of the installation process
    a little faster, and it helps guard against unwanted surprises.


    If you are using Windows Vista or Windows 7, your system is set up to automatically
    defragment your hard disk on a regular basis, so you should be to go without any
    additional effort on your part. On other versions of Windows, you''ll have to
    defragment your disk manually. In Windows XP, you can do this by double-clicking
    **My Computer**, right-clicking the icon for hard disk, and selecting **Properties**.
    You can then defragment your hard disk by clicking the **Tools** tab in the Properties
    window and clicking the **Defragment Now** button. In Windows 2000, you can do
    this by going to the **Start** menu and selecting **Control Panel** ► **Administrative
    Tools** ► **Computer Management** ► **Disk Defragmenter**, while in Windows 98
    and some other versions, you can do the same by selecting **Programs** ► **Accessories**
    ► **System Tools** ► **Disk Defragmenter**. Defragmenting can take quite a while,
    so you might want to leave it overnight.


    # Doing the Deed


    Well, now that I''ve covered all that preliminary stuff, let''s get down to the
    actual Linux installation. Set this book on your lap so you can follow along,
    and then get ready for action. It''s time to do the deed!


    Fortunately for you, the installation process is extremely easy, because there
    are very few steps in what you actually have to do anything. Most of what you
    will be is clicking buttons on your screen. Hard about that, eh?


    Of course, when you look at the directions and descriptions listed here, it may
    look a long and cumbersome process. It is not. It will be over more than you can
    imagine. As a beginner frequently referring to this text, you might take a bit
    longer, course, but all in all, the whole process is faster and easier than for
    Windows or Mac OS X. And keep in mind that for Windows and OS X you are installing
    the operating system with just a few bundled applications. In an Ubuntu installation,
    on the other hand, you are installing not only the operating system itself but
    also most of the applications you will ever want or need to use. Use this will
    be getting a lot done in one fell swoop.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'One more thing before we start. Some people approach installing a system with
    a good deal of trepidation. The process makes them nervous, as the house is going
    to go up in smoke if they click the wrong somewhere along the line. Needless to
    say, there is no need for concern. As long as you have backed up your data, you
    will be OK. If you screw up the installation the first time out, so what? Just
    start again. No harm done, because you have nothing to lose. Just make sure you
    give yourself more time than you need for the process. Don''t start installing
    one hour before you have to be at work or before you meet your friend downtown.
    Rushing makes do weird things. Make things easy on yourself by giving yourself
    plenty of time and, as I mentioned before, backing up any data you would mourn
    the loss of.


    If you''re ready, here are the steps:


    +   **Start ''er up.** If you haven''t already done, boot up your machine from
    the Ubuntu Desktop CD.

    **Start the installation.** This time, when you get to the Install Ubuntu window
    in Figure 2-1, click the **Install Ubuntu 10.04** button to start the installation.
    This will open the first page of the installation wizard, Where are you? (Figure
    2-6).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_55_0.png)


    *Figure 2-6: Selecting your location from the Where are you? screen*


    +   **Choose your location.** The Ubuntu installer will select the default location
    for the installation language you have chosen. If your location is different,
