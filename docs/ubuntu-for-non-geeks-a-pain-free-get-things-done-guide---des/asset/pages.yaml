    in order to see it work. The application you''ll be installing is one I had searching
    for ever it since I moved to the world of Linux, a 20-card Austrian card game
    called Schnapsen, shown in Figure 17-17.


    To start, you will need to download and extract Schnapsen. Here''s what you need
