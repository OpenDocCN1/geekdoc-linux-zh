    ![](img/58abec7ac6c22ade6357fd77ea421da3_70_0.png)


    Figure 3-9: Selecting a new panel launcher icon


    6. Click the Open button in that window, which will close it.


    7. You will then be back at the Launcher Properties window, which should now look
