- pgno: 333
  md: 'Download and install VLC from the Ubuntu Software Center, once installed, run
    it by selecting Applications ▶ Sound & Video ▶ VLC media player. To view DVDs
    with VLC, insert a DVD into your drive, select Open VLC media player in the drop-down
    menu button in window that appears, and then click OK.


    # Editing Digital Video with PiTiVi


    Digital video cameras have become increasingly common in recent years, and still
    digital cameras (and even phones!) have also become more impressive in terms of
    their video-handling capabilities. In addition, and more and more people are sharing
    their video creations on YouTube—it''s far to say that digital video is just ubiquitous.
    Linux support for video processing is also catching up, though it''s not 100 percent
    there.


    Ubuntu''s default video editor is called PiTiVi (Figure 16-6). You can run it
    by going to the Applications menu and selecting Sound & Video ▶ PiTiVi Editor.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_333_0.png)


    Figure 16-6: PiTiVi video editor


    As you will immediately see, PiTiVi lacks the bells and whistles of applications
    like iMovie or Windows Live Movie Maker. It is really little more than a movie
    editor, allowing you only to trim and combine video clips. Some of its'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'greatest limitations are its inability to capture video from digital video
    cameras or video streams, its inability to apply transitions or effects to videos,
    and, to top it all off, its inability to add titles to videos. Although these
    features are promised for the future, the fact that they are not available now
    makes the decision to bundle PiTiVi with Ubuntu a peculiar one.


    Limitations and peculiarities aside, the actual process in PiTiVi is relatively
    straightforward. You start a new project and define its name and settings (Project
    Settings). You add files to that project, either by dragging and dropping from
    your home folder to the PiTiVi window or by clicking the Import clips button and
    selecting the files you want to add via the Import clip that appears. The files,
    now called clips, will then appear in the Clip Library pane of the PiTiVi window.
    From that pane, you can drag the clips you want to work on to the timeline below
    and split the clips, delete the embarrassing or boring bits, and combine files
    (Figure 16-7). Be sure to save your project as you go along.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_334_0.png)


    Figure 16-7: Editing video with PiTiVi


    Once done with your editing, you can produce your new film by clicking the Render
    project, after which a Render window will appear. In that window, click the Choose
    File button, and then give your new film a title in the Choose file to render.
    This will be the name of the actual file that will be produced. Once done, click
    OK, and then click the Render'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'button. The progress of the rendering process will be shown in the Render project
    window, and when it is done, the words Rendering Complete will appear. You can
    then close the Render project window and PiTiVi, to be sure to save your project
    when prompted to do so.


    For more detailed information on using PiTiVi, have a look at the user manual,
    which is available from the PiTiVi site at http://www.PiTiVi.org/


    # Project 16B: Capturing Digital Video with Kino


    When you want to transfer a digital image or a digital video from your digital
    still camera to your computer, you just have to download it from camera to computer.
    When you want to transfer a video clip from your computer from a digital video
    (DV) camera that saves its data on tape or from a video stream, however, there
    is no way to simply drag it from one place to another. You have to capture the
    video stream to disk while you play it, and to do that you need some sort of software
    solution. This is usually found in the form of your system''s video editor; however,
    as mentioned in the previous section, Ubuntu''s bundled video editor, PiTiVi,
    is not capable of doing this. This means you will have to install another editor,
    and the old-time favorite for this is Kino (Figure 16-8).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_335_0.png)


    Figure 16-8: Another digital video editor, Kino'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# 16B-1: Installing Kino and Setting Up Your System


    The first and easiest step is to download and install Kino. Just go to the Ubuntu
    Software Center to do this. Once installed, you can take a look at Kino by selecting
    Applications > Sound & Video > Kino. At this point, you can use Kino to work with
    video files you already have on your hard disk and start capturing video. If,
    however your camera connects to your computer via a FireWire (IEEE 1394) connector,
    you must perform a few steps the first time around so your system can recognize
    the connection:


    +   Connect your camera to your computer using the FireWire cable that came (or
    if you were forced to buy for) your camera.

    Turn on your DV camera in play mode. Once you''ve done this, the raw1394 module
    will appear in your system''s /dev directory, though you won''t see any indication
    of this up front.

    After a few seconds, turn off your camera, but leave the cable connected.

    Open a Terminal window, type cd /dev, and press ENTER.

    In the same window, change the permissions of the raw1394 module so that everyone
    on your machine can read and write to it by sudo chmod +rw raw1394 and pressing
    ENTER.

    Type your password when prompted, and then press ENTER.


    If all goes without a hitch, you will be returned to your user prompt without
    any other messages appearing in the Terminal. You can then close the Terminal
    window.


    # 16B-2: Capturing and Editing Digital Video with Kino


    Once you have gone through the preparatory steps, you are ready to capture video
    from your camera. To do this, connect your camera to your computer (if it isn''t
    already connected), turn on your camera to Play mode, and start up Kino. Once
    Kino is open, click the Capture tab to locate the playback pane.


    Now you can use the playback controls located below the playback pane. These control
    buttons actually control the functions of your camera. Start by clicking the Rewind
    button until you get to the beginning of the video segment you want to capture.
    Once you get there, click the Play button after which the video on your camera
    will play back within the Kino window. When you reach the point at which you want
    to start capturing, click the Capture button just above the play back controls
    in the Kino window. Kino will start capturing your video to disk (in your home
    folder by default) and show you what it is capturing in the main pane of the window
    (Figure 16-9). To keep things easy to manage, the captured video stream will be
    split into several files, which depends on the length of the video played.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_337_0.png)


    **Figure 16-9:** Capturing video from your digital camera with Kino


    When you get to the point where you''d like to stop capturing, click the **Stop**
    button. You can then view the captured video by clicking the **Edit** tab and
    then using the playback controls at the bottom of the playback pane. You can also
    view the video in Timeline view (as shown in Figure 16-10) to navigate between
    the various segments of the video: Click the **Timeline** tab, click the segment
    you want to view, and then use the playback controls below the playback pane.


    If you feel like getting a bit arty, you can also try the FX tab in Kino (some
    examples of which are shown in Figure 16-11) by clicking the FX tab and then playing
    around with the various effects in the words *Filter*. Make your choice, and specify
    the segment you''d like to convert (or at least experiment) by typing the beginning
    and ending frames in the boxes below the word *Overwrite*. To see the results
    of the filter without saving the changes to disk, click the **Play** button. If
    you decide you want to convert the segment to keep the effect, click the **Render**
    button, and Kino will create a new file of just that segment. You can also double-click
    those files (as well as the original captures) to view them in Totem, which is
    better suited to viewing videos as Kino.'
  merge: -1
  img_proc: true
