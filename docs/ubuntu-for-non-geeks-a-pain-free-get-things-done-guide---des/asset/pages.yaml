- pgno: 359
  md: '# 18


    # PENGUINS AT THE GATES


    Working with Ubuntu in a Windows World


    ![](img/58abec7ac6c22ade6357fd77ea421da3_359_0.png)


    Despite the rapidly growing popularity of Linux, it''s still very much a Windows
    world. If you''re anything like me, you''ll often find yourself working with people
    who use Windows, so it''s important to know how to make Ubuntu happily coexist
    with Microsoft''s ubiquitous OS. Fortunately,


    Linux is just about the most accommodating operating system available and has
    no problems sharing files, reading Windows disks, and so forth. In fact, your
    Ubuntu programs properly support a wider range of file formats than their Windows
    equivalents; on more than one occasion I''ve tried to open a file in Windows,
    failed, and then booted into Ubuntu I could open it effortlessly.


    Of course, sharing files with others may not be your only Windows-related worry,
    especially if you''re a dual-booter. Plenty of people decide to run both Windows
    and Linux on their computer, so it pays to know how to minimize the bureaucracy
    involved in switching between the two. If you kept Windows for the sole purpose
    of running a specific application and can''t find a Linux-compatible equivalent
    to it, perhaps you can save the effort of dual-booting altogether and simply install
    the program directly onto Ubuntu. I told you Linux was accommodating... itll''t
    even adopt Windows programs as its own!'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'Over the course of this chapter, you''ll learn how to make the most of your
    double operating system setup: You''ll install Windows fonts, install some Windows
    programs, and share files on a Windows network. And if that''s not quite enough
    Windows for you, you''ll even see how to run Windows (in a window!) in Ubuntu.
    You might want to sit in a dark room for this—if youre not tired of windows already,
    you''ll be by the end of this chapter!


    # Project 18A: Accessing Files on Your Windows Partition (for Dual-Booters)


    If you decided to dual-boot with Windows when you installed Ubuntu, you''ll have
    a partition lurking somewhere on your hard disk filled with your Windows files
    and programs (Chapter 2 if you need a refresher on how work). You can access files
    on Windows by mounting the partition from within Ubuntu. When you mount a partition,
    the files are made available to you through Nautilus (and other programs)—mounting
    is Linux''s way of recognizing a partition and preparing it for use.


    # 18A-1: Mounting Your Windows Partition


    Mounting your partition in Linux used to be a bit of a chore, but that isn''t
    the case anymore (least not in Ubuntu). In fact, all you do is open a Nautilus
    window and click the Windows partition in the side pane.

    You will most likely find at least two hard disk icons in the side pane, so it
    is possible that you won''t be which one your Windows partition actually is. Just
    remember that your Linux partition is represented by the hard disk icon File System.
    Things aren''t so simple for the Windows partition, unfortunately. It could be
    labeled OS (as shown in the side pane in Figure 18-1) or with the size of the
    partition followed by the word Media (or if your Windows partition is 80GB in
    size, it might appear as 80GB Media in the left pane). Or, it might be something
    else entirely. Which one it is, necessary—it won''t hurt if you get it wrong.


    Now that you know which disk is, it''s time to get mounting! Just click the icon
    for the Windows partition in the Nautilus side pane. An Authenticate window may
    appear; type your Ubuntu password, and click the Authenticate button if it does.
    A new window showing the contents of your Windows partition will then appear.


    > NOTE If you hibernated rather than quit Windows, you will most likely receive
    a "Cannot volume. You are not privileged to mount this volume." error message
    when trying to mount your Windows partition. Some hibernated partitions cannot
    safely read-write mounted in Linux, because adding new files while Windows is
    hibernated could seriously confuse it when it starts up again. To get full access
    to the drive, be sure to shut Windows down rather than hibernating.'
