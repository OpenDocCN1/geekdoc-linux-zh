    might prefer to use that as the default system. To make the change, use the Ubuntu
    Software Center to install Startup-Manager, and then open it by selecting **System
    > Administration > StartUp-Manager**. You''ll probably be asked to enter your
    password, so do that and wait a little while it loads. Click the **Boot options**
    tab in the Startup-Manager window (Figure 18-5), and select Windows from the **Default
    operating system** drop-down list. The actual name of the Windows option will'
