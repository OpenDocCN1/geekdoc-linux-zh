- pgno: 327
  md: '# # 16


    # ## COUCH PENGUINS


    ### Video and DVD Playback in Ubuntu


    ![](img/58abec7ac6c22ade6357fd77ea421da3_327_0.png)


    Now that I''ve covered much of what Ubuntu can do in terms of audio, it''s time
    to turn your attention to what is arguably the second most important of its talents
    in the CNN/MTV-era world: video. Ubuntu is quite capable in terms of video playback,
    allowing you to view video files you download from the Internet or from your digital
    movie camera, video CDs (VCDs), DVDs, and some Internet video streams. It allows
    you to download movies from your digital video camera and then edit them.


    # ### DVDs


    Your system allows you to play DVDs; however, due to licensing concerns, playback
    is limited to unencrypted discs by default. Unfortunately, this rules out a vast
    majority of the DVD movies you buy or rent at your local video shop and leaves
    you with a rather limited choice of movies that you can play on your computer.
    Given the limited offerings in the unencrypted DVD world, you will no doubt want
    to enable your system to play the encrypted variety.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Project 16A: Installing Support for Encrypted DVDs


    As I already mentioned, Ubuntu does not allow you to play encrypted DVDs from
    the start. For you to watch such DVDs (and that would be the vast majority of
    them), you need to install a whole bunch of stuff, crucially, the package libvdread4.
    Fortunately, if you installed the audio support files I mentioned in Chapter 14,
    you''re halfway there. If you didn''t install them or you just want to double-check,
    start by running the Ubuntu Software Center, and make sure you have these files
    and a few useful others installed. If anything is missing, install it. Here''s
    what you need to have:


    +   - gst-plugins-base

    - gstreamer0.10-plugins-good

    - gstreamer0.10-plugins-ugly

    - gstreamer0.10-plugins-bad

    - gst-ffmpeg

    - libvdread4


    Now you''ve come to the final and essential step required for this project. For
    your task, you''re going to have to the trusty ol'' Terminal (Applications ▸ Accessories
    ▸ Terminal). Once the Terminal is open, type the following command, and press
    ENTER:


    ```

    sudo apt-get install libvdread4

    ```


    With just any other application, you would be done at this point, but libvdread4
    requires you to run an installation script that comes with it in order to fully
    get the job done. To run the script, go back to the Terminal, type the following,
    and press ENTER:


    ```

    sudo /usr/share/doc/libvdread4/install-css.sh

    ```


    Once the Terminal returns you to the user prompt, the process will be done. Trying
    a DVD in your drive—Totem should open and start playing the DVD. (You''ll learn
    more about Totem soon.) If it doesn''t work, open the Ubuntu Software Center,
    and check to make sure all the support plugins listed earlier are installed. If
    everything is there, go back to the Terminal, and perform the last two steps again.


    # Can I Play Foreign DVDs?


    Your computer can play DVDs of any broadcast standard (NTSC, PAL, or SECAM) and
    any regional encoding. This is a better setup than the DVD player you have hooked
    up to your TV, because the vast majority of stand-alone players in the United
    States (I would venture to guess 99.9 percent) do'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'not allow you to play anything other than Region 1 N discs (NTSC being the
    broadcast standard in the United States and what its televisions are designed
    to display, while the DVD region is 1). This information is usually provided on
    the back of DVD packages (see the examples in Figure 16-1), though the packaging
    for most discs produced for the U.S. market does not include it.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_329_0.png)


    Figure 16-1: Examples of regional encoding labels on DVD packages


    Despite the wonderful everything-goes nature of your computer in terms of DVD
    playback, there is a serious caveat to bear in mind. Depending on the manufacturer
    of your DVD drive, you will be able to switch back and forth between DVDs of differing
    regional encodings only four or five times. that the drive will be locked into
    the regional encoding of the disc you were playing at time ... forever. This is
    unrelated to your operating system--it is strictly a hardware matter. The only
    exception to this region-lock are those labeled Region Free or ALL (sometimes
    inaccurately labeled as Region 0), which can be played on any DVD player in any
    region and thus do not register as a regional switch when you plop one of them
    in your computer''s drive.


    If your drive eventually lock into one regional encoding, especially one for which
    you have few DVDs, there is some good news. That comes in the form of Videolan''s
    libdvdcss2, the library that installed in Project 16A. The libdvdcss library allows
    you to play back encrypted DVDs. In addition to that primacy, libdvdcss2also,
    in theory, allows you to play back DVDs from multiple regions if your drive is
    already locked into one region. This does by performing a cryptic attack (to use
    Videolan''s for it) on your drive until it can find the key for that. Of course,
    this process of cryptic bombardment can take several minutes, so it is not the
    optimal way of getting about things. Besides being stuck, though. Whether this
    process of bypassing is remains a subject of debate, so if you are concerned about
    such things you should do a little research.


    # Totem Movie Player


    The default video player in Ubuntu is Totem, which as you can see in Figure 16-2,
    has a very simple interface that makes using quite simple. You can run Totem by
    selecting Applications > Sound & Video > Movie Player. You can also run it, as
    you have just learned, by simply playing a DVD in your drive, because Ubuntu is
    set up to run Totem any time you so.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_330_0.png)


    Figure 16-2: Totem movie player


    # ### Using Totem to play DVDs, VCDs, and Other Multimedia Files


    As I have mentioned, you can play a DVD in Totem by simply placing your DVD in
    the drive, after which Totem will open and begin playing your movie. If you''ve
    got a copy of Red Detachment of Women on VCD that you''re reaching to watch, can
    you do so in the same way. Just pop the VCD in your drive; Totem should start
    up and begin playing it.


    Not only does Totem play DVDs and VCDs, but it can also play MPEG files, and because
    you installed that big cocktail of packages I keep on about, it can play WMV files
    too. You can play such files by double-clicking them directly or going to the
    Totem Movie menu, selecting Open, and navigating to the video file you want to
    view.


    # ### Totem as an Audio Player?


    You may have noticed on the Display tab of the Preferences window that there was
    a Visual Effects section. Well, those visual effects aren''t for the videos you
    play but are visualizations to accompany your audio files when played via Totem
    (Figure 16-3). Yes, Totem not only does video but also does audio. In fact, it
    is, somewhat oddly, the default audio player for Ogg Vorbis and MP3 files in Ubuntu.
    Just double-click one of those files, and sure enough, Totem will be the application
    that pops up, blasting your ears


    294 Chapter 16'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'out with your favorite melodies. Of course, you can also play files from the
    Totem Movie menu by selecting Open and then navigating to the songs you want to
    play. If you have a CD in your disc drive, you can even use Totem as a CD player
    by going to the Movie menu and selecting Play Disc ‘Audio Disc’.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_331_0.png)


    Figure 16-3: Totem as an audio player


    # A Couple of Other Cool Totem Features


    Totem has a couple other features that you might like to know about. One is its
    ability to perform screen captures of whatever video you happen to be viewing
    at the time. You just select Edit ▸ Take Screenshot, and you''ve got yourself
    a screen capture—a still image taken from a video file.


    Another feature worth mentioning is Totem’s Sidebar. As you no doubt noticed,
    at the bottom-right corner of the Totem window there is a Sidebar button. If you
    click that button, a new window will open at the right side of the Totem window.
    In that pane you can select and listen to BBC podcasts; search for and watch YouTube
    videos (Figure 16-4); and load, create, and save play-lists. You can select from
    among these various functions from the drop-down menu button at the top of the
    Sidebar.


    The playlists you create consist of any combination of supported video or audio
    files, providing you with the whole multimedia banana. Any time you play a file
    in Totem, that file appears in the Playlist pane, and you can add items to the
    list by simply dragging the files from your desktop or any Nautilus window.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_332_0.png)


    Figure 16-4: Viewing YouTube videos in Totem


    # # An Alternative to Totem: VLC Media Player


    Although the Totem video player has made great strides since it first appeared,
    some users find it somewhat temperamental and quirky. Luckily there are alternatives,
    like the VLC media player. VLC (Figure 16-5) is a very capable alternative player
    and is also available on Mac and Windows platforms. Like Totem, it also handles
    audio files as well as video and audio streams, including YouTube.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_332_1.png)


    Figure 16-5: VLC media player at rest and at play


    296 Chapter 16'
