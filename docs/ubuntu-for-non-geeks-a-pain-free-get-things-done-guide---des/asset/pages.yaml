    # Telling People When You Don''t Want to Chat


    Chatting is good, but very few people have the stamina to do it all day long.
    Once you''ve connected to an IM network, it can be annoying if people try to start
    conversations while you''re busy. Fortunately, there''s an easy way of letting
    everyone know that you don''t want to be disturbed.


    On the top panel you should see your username next to a speech bubble. If you''re
    connected to an IM network, the bubble will be filled with a solid color, which
    means that other people can tell that you''re online. Click the speech bubble
    icon, and choose a different status (Away or Busy, for example) from the menu
    that pops up (Figure 5-17). Depending on the status you choose, other people either
    will be told you''re busy when they try to start a chat or won''t be able to see
