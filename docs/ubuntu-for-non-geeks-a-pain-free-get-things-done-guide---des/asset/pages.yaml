- pgno: 291
  md: 'Once you have installed gpaint, you can run it by selecting Applications ▸
    Graphics ▸ GNU Paint.


    # Inkscape


    The GIMP, like other so-called paint programs, creates bitmap images in various
    file formats. These are images in which the location and color of every pixel
    is recorded. The image is essentially a collection of dots, or pixels. The file
    you create is a rather hefty map of these pixels, and this tells your system where
    everything in your image is supposed to go when it is displayed or printed.


    Drawing programs, on the other hand, create vector images, which are actually
    collections of mathematical formula representing the various shapes in your image.
    This might sound unimportant to you, but such drawings have advantages in certain
    cases. One of these advantages is that vector images take the most important space
    on your hard disk as bitmaps. Another, and perhaps advantage is that shapes in
    vector images retain their smooth edges when the images are enlarged. A smooth
    circle created as a bitmap, enlarged to any extent, would begin to show jagged
    edges ("the jaggies") while the same circle in a vector image would remain smooth
    and no matter much you increased its size.


    If you''re interested in giving a drawing program go, then try Inkscape (see Figure
    13-11). To download and install it, do a search in the Ubuntu Software Center
    for inkscape. Once it is installed, you can run it by selecting Applications ▸
    Inkscape.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_291_0.png)


    Figure 13-11: Inkscape'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'If you would like to learn how to use Inkscape, go to the Inkscape home page
    at http://www.inkscape.org/. Be sure to click the Galleries link on page to see
    examples of what you can create with the program, as the image shown in Figure
    13-11, which is from http://plurib.us/svg-gallery/


    # Project 13C: Installing Picasa


    It wouldn''t be right to dedicate a whole chapter to Linux''s graphical capabilities
    without mentioning one of the newest entries in the Linux application arena—Picasa.
    Those of you coming from the Windows and Mac worlds are no doubt familiar with
    this popular image-viewing, organizing, and editing from Google, and you will
    not be pleased to discover that it is available for Linux. Picasa is not an open
    source application, which may cause some Linux diehards to turn away, but it is
    also free, feature-rich, nice to easy access to online photo blogs, photo finishers,
    and product providers, such as PhotoStamps, Shutterfly, Kodak, and even Walgreens
    (Figure 13-12).


    ![](img/58abec7ac6c22ade6357fd77ea421da3_292_0.png)


    Figure 13-12: Picasa


    # 13C-1: Downloading and Installing the Picasa Package


    Picasa is free, and getting it is relatively easy—just point your browser to http://picasa.google.com/linux,
    and click the Download Picasa for Linux button. Once on the download page, click
    the appropriate download link (that would be the one for Debian/Ubuntu i86 if
    you''re using the disc in this book).'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'After the download is complete, locate the Picasa DEB package on your hard
    disk, and double-click it. Click the Install Package button in the Package Installer
    window that appears. Provide your password if prompted for it, and then click
    OK to begin the installation. When the installation process is complete, you will
    be notified in the installation process window. After that, you can close both
    and the Package Installer window.


    # 13C-2: Running and Setting Up Picasa


    Once Picasa is installed, you can run it by going to the Applications menu and
    selecting Graphics > Picasa > Picasa > Other > Picasa (the location varies, even
    with difference user accounts on the same computer!). The first time you do this,
    you will be greeted by a warning telling you that Picasa can be integrated with
    GNOME so that whenever you hook up a digital camera to your computer, GNOME will
    run Picasa in order to handle the photo import process. Make the choice you feel
    most comfortable with, after another window about Picasa/Firefox integration will
    appear (click OK), and finally a Picasa License Agreement will wind up. Agree
    to what you''re asked by clicking Next and then in the next screen I Agree.


    Picasa will scan your desktop and home folder for images and add any images it
    finds to its library.


    Working with Picasa should be very straightforward, but if you want to find out
    more, check out http://picasa.google.com/linux/. On that page, you will find a
    basic overview, links to Linux-specific information (including FAQ and forum pages),
    and a Picasa Getting Started Guide.


    # Other Graphics Apps to Consider


    In addition to the graphics I have covered in this chapter, there are still more
    available. You can grab all of them via the Ubuntu Software Center. Although you
    can experiment with whatever you like, I will point out a few worth noting. If
    nothing else, these applications will give you an idea of the breadth of stuff
    out are waiting for.


    # gThumb Image Viewer


    In earlier editions of Ubuntu, an application called gThumb (Figure 13-13), handy
    for photo-handling chores, used to come preinstalled. Some folks still did. It
    has almost all the features as F-Spot and a few batch conversion capabilities.
    That said, it really boils down to whether you prefer F-Spot or gThumb (or even
    Picasa, for that matter). They''re all free and easy to use, try them all to see
    which you like. If you do, install gThumb via the Ubuntu Software Center by searching
    for gthumb. Once installed, run it by selecting Applications > Graphics > gThumb
    Image Viewer.'
