- pgno: 182
  md: '# 8D-1: Beautifying the Login Screen


    The software that displays the login screen is GDM, and it has its own hidden
    user account on your computer. This might seem a little strange, but this is the
    way Linux programs do things when they are shared between several users. What
    you need to do now is log in to this hidden user account and change the settings
    for GDM. Fortunately, it''s a pretty straightforward process and doesn''t even
    require you to log out of your account:


    +   Press ALT-F2 to open the Run Application window.

    Type gks -u gdm dbus-launch gnome-appearance-properties into the box, as shown
    in Figure 8-20.


    ![](img/58abec7ac6c22ade6357fd77ea421da3_182_0.png)


    Figure 8-20: Typing the command into the Run Application window


    +   Click Run. You''ll be asked for your password, so type it, and click OK.


    > Some extra icons might appear on your panel when you perform this step. Don''t
    worry, they''re harmless and will disappear when you log out and log back in again.


    +   The Appearance Preferences window should appear. This Appearance Preferences
    window works the same way as the one you used earlier in this chapter.


    +   Use the Background tab to change the wallpaper behind the login screen and
    the Theme tab to change how the login window looks.


    +   When you''re happy with your changes, click Close, and log out of your user
    account to get back to the login screen and inspect your changes.


    Take a look at Figure 8-21 to see what you can do. I changed the background to
    a delicious-looking picture of cherries and the login window to the brownish-orange
    Human theme, for a slightly more rural feel.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_183_0.png)


    #  8D-2: Adding a Picture to Your User Account


    Aesthetics aside, it''s time to make things a little more personal. What better
    way to do this than by adding a picture to your user account? Select System Preferences
    About Me, and when the window appears (Figure 8-22), click the button that looks
    like a blank face. The Select Image window will appear—choose one of the stock
    images from the list, or use the pane on the left of the screen to find a picture
    from elsewhere (a passport photo, perhaps). Now, click Open to finalize your selection,
    and the picture will appear next to your username in the About Me window.


    While you''re there, fill out some of the other information if you like. It''s
    not used for very much, but as anyone who has ever possessed a permanent marker
    knows, it can be fun to stamp your identity all over your things. When you''re
    finished, close the About Me window. The picture you choose will be displayed
    next to your username on the login screen the next time you start the computer
    (as you can see in Figure 8-21).'
