  md: '![](img/58abec7ac6c22ade6357fd77ea421da3_294_0.png)


    Figure 13-13: gThumb


    # Blender


    Perhaps one of the most impressive open source applications available today is
    Blender. Blender (Figure 13-14) is a professional-level 3D modeling, animation,
    and rendering program. It is rather complex, but that is the source of its power
    and popularity (it comes in versions for just about every operating system out
    there). If you would like to find out a bit about Blender before taking the time
    (and disk space) to install it, go to http://www.blender3.org/. Find it via the
    Ubuntu Software Center by searching for blender; once the program is installed,
    you can run it by selecting Applications ▸ Graphics ▸ Blender (fullscreen) or
    Blender (windowed).


    # QCad


