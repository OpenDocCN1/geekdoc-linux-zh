- pgno: 263
  md: '# 12


    # PENGUINS AT WORK


    Getting Down to Business in Linux


    ![](img/58abec7ac6c22ade6357fd77ea421da3_263_0.png)


    I have to admit it, when I think about the joys of computing, I tend to think
    of the more hedonistic, self-indulgent areas like gaming, music, and graphics.
    Still, as is the case for most computer users, what I usually end up doing on
    my computer is work, and writing this book falls into that category.


    Fortunately, Linux can get down to business and do it as well as the next OS.
    I think it''s safe to say that you are missing nothing and are probably- gaining
    quite a bit in terms of home and office productivity programs in the world of
    Linux. In this chapter, I''ll walk you through the Linux offerings in this department.


    # OpenOffice.org


    Whether they should be or not, people are quite obsessed with office suites, even
    though most people seldom need more than a word processor. The de facto standard
    among office suites is Microsoft Office, which is available in'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'both the Windows and Macintosh worlds. Of course, because it is a Microsoft
    product, you can be quite sure that no Linux version is available.


    Fortunately, Linux does have an exceedingly capable office suite in the form of
    OpenOffice.org, which is, incidentally, also freely available (as in free) on
    Windows and Mac OS versions. OpenOffice.org is not lightweight sour-grapes substitute
    for the Microsoft Office–less Linux world; it is a full-featured contender, and
    in some cases, OpenOffice.org is a clear winner.


    # OpenOffice.org Applications


    The entire OpenOffice.org office suite consists of a number of application modules,
    and the most commonly used ones bundled with Ubuntu. These include a word processor
    (Writer), a spreadsheet (Calc), and a presentation creator and player (Impress),
    all of which you can find by selecting Applications Office. In addition, there
    is a very handy drawing program (Draw), which you will find by selecting Applications
    Graphics. The database module (Base) and the mathematical formula editor (Math),
    which no longer packaged with Ubuntu, are still available as separate downloads
    via Ubuntu Software Center (by searching and marking openoffice.org-base and pages.


    Since giving full and detailed instructions on how to use each of these applications
    would take up an entire book (and there are books on the subject), I will simply
    introduce each module to you.


    # Writer


    As I mentioned earlier, the word processor is the office application that the
    majority of users turn to most often. Fortunately, OpenOffice.org Writer is a
    good one (see Figure 12-1). It is check-full of features and can read and save
    Microsoft Word files. Like Word, it will even let you save your documents as HTML
    files so that you can easily change your documents into web pages.


    As said, Writer is a very straightforward word processor, so I won''t go on about
    it, but if you would like an introduction to Writer (or the other OpenOffice.org
    modules), check out the various tutorials and other resources available at http://support.openoffice.org/


    # Calc


    Calc is the OpenOffice.org spreadsheet application, and is similar to Excel in
    terms of capabilities and general layout (see Figure 12-2). It can also, quite
    importantly, read and save Microsoft Excel files.


    Since people who use spreadsheets generally understand what they are all about
    and, after a bit of poking around, can figure out how to use them, I won''t go
    into any sort of primer about using Calc. However, because there are many others
    who don''t see any need to try using spreadsheets, I will mention a few of the
    simpler tasks that can be done with Calc, in the hope of enticing some of you
    into trying it.


    228 Chapter 12'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Peugeot Memories


    Yep, it wasn''t that long ago that I was back here in Japan looking for a new
    car to park in front of my new house. Of course, any of you who know me, also
    know that I am longed, and as such have quite a bit time of trying to fit behind
    the wheel of most right-hand driver car, especially when I would do that in Japan.
    However, and ever so deliberately pleased myself into the seat of a Peugeot 406.
