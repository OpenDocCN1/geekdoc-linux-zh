- pgno: 21
  md: '# ABOUT THE AUTHORS


    # Rickford Grant


    My computing life began long ago, in the Commodore/Atari days. No doubt inspired
    by Alan Alda''s television commercials at the time, I purchased my first machine,
    an Atari 600XL with a cassette drive for storage and 16KB of RAM—more than I thought
    I would ever need. Most of my time on that machine, I must admit, was spent playing
    cartridge-based games and transcribing pages and pages of machine code for the
    non-defunct magazine Antic to create even more games. Eventually, my interest
    in computers increased, especially after seeing my first (and actually the first)
    Macintosh at the UCLA bookstore. The very-in-face nature of the Mac''s operating
    system caused me to become an operating system maniac. To date, I have worked
    with a lot of different operating systems, including Mac OS up to and including
    OS X, every Windows version from 3.1 to 7, and even IBM''s most forgotten OS/2.


    Though tempted to join the Linux fray, I continued to steer away from it for a
    long time I could not help see it, as many others do, as a system for never-seen-the-light-of-day-faced,
    late-night Dr Pepper-drinking, Domino''s-pizza-eating compute geeks. However,
    when I moved to Japan and was suddenly surrounded by machines loaded with Japanese
    versions of Windows, I encountered numerous problems, especially language constraints.
    Since everything, including Help files, was written in Japanese, I ended up'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'using only fraction of the full potential of most software. Then there were
    those annoying Windows-type problems, such as the constant freezes and restarts
    and the gradual system slowdowns, which were eventually remedied by reinstalling
    the system. Getting the software I needed to do the things I wanted to do also
    took its toll on my wallet, and I began to rethink my resistance to Linux. With
    Linux''s multilingual support, system stability, and extensive free software packages,
    there were plenty of incentives for me to get over my preconceived notions about
    the typical Linux user.


    After a few attempts at getting Linux to work on the oddball, Frankenstein-like
    collection of junk that was my computer, I finally succeeded with a CD-based Knopp
    distribution, which worked well enough to reel me in a little further. I moved
    on to Mandrake (now known as Mandriva), since that was claimed to be the most
    newbie-friendly version, and then I SUSE as well, which I found to be rather quirky.
    Eventually, I tried Red Hat Linux and stuck to that because it didn''t give me
    any grief; and I, like others, do not want more grief than necessary.


    I started off with my three desktop machines at work and home up as dual-boot
    systems running both Linux and Windows, but I found myself using only Linux. Although
    I had expected to encounter numerous limitations in Linux that would force me
    to return to Windows, I actually increased my productivity. Other than lack of
    native support for Windows streaming media, I was actually able to do more because
    of the extensive software base that was now installed on my machine. Without having
    to fork out money I could afford to spend, I was able to manage my digital images,
    rip songs from CDs, create drawings, create PDF files, and do a variety of other
    things that I wasn''t able to do under Windows. It was only a matter of time before
    my dual-boot setups became Linux-only sets. I ceased to be a Windows user.


    Since those early Linux days, I have gone on to try a number of other distributions,
    including jAmD, Xandros, Damn Small Linux, and more recently, Ubuntu. I am happy
    that things that have continued to get better, and those early frustrations I
    suffered trying to get things to work with this machine or that piece of hardware
    have become more and more of the best. Best all, with more distributions being
    available as live CDs, which allow you to try Linux before you actually install
    it, you usually don''t have to take a leap of faith to get started.


    Of course, getting started in the world of Linux can be a bit intimidating, especially
    when you don''t have anyone around to help you out. In fact, I started writing
    this book as a primer on Red Hat 9 for my mother, who had just given one of my
    computers with Red Hat installed. At that time, I was not planning on writing
    a book at all; it was just that there really weren''t any books out there with
    average users in mind. The books available then were all more or less geek-oriented,
    and as such, they would just not do for the mother. Thus I created a somewhat
    elaborate instruction set that that would tell her everything she might want to
    do on the machine in a way that she could understand.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'My auntie caught hold of the “manuscript” and decided that I must try to publish
    it. I responded with the obligatory, “Yeah, right,” before putting it of my mind
    for a while. My auntie, being a persistent character, however, did not relent
    and so I moved to quiet her by submitting the book for publication. A speedy rejection
    would do the trick; however, I did not get a rejection slip, and instead my first
    book, Linux for Non-Geeks, based on Fedora Core I, was born. I later switched
    to Ubuntu, and the Non-Geeks followed along Ubuntu for Non-Geeks.


    I continued with two subsequent editions of the Ubuntu books, but my new job was
    making it harder and harder to devote the time to keep the book up-to-date and
    up-to-snuff and get it all written in a limited timeframe. It seemed to time in
    a coauthor to keep things moving. Phil Bull. Phil was the technical editor on
    the third edition of Ubuntu for Non-Geeks, and because of his familiarity with
    the book, in addition to his work on Ubuntu documentation, he seemed a perfect
    candidate for the job. The fact that he lives closer than I to Stanage Edge, where
    imagined myself one day standing, pushing the Keira Knightley Pride and Prejudice
    didn''t hurt matters either.


    So recus aside, having Phil on the project allowed me to not only update the book
    so to reflect changes in the system and applications, but also expand it to cover
    changes in available technology and hardware to address suggestions from readers
    of past editors. These changes, I believe, have for an even well-rounded volume
    than before—a book that even serves the original purpose of the series: helping
    you get into the world of Linux easily and comfortably.


    # Phil Bull


    I worked as the technical reviewer on the previous edition of Ubuntu for Non-Geeks.
    This time, Rickford and Bill felt that the book could use fresh input and me as
    coauthor. I was happy to oblige!


    So, what''s my background? Computers have taken up most of my free time since
    I was eight years old. I started playing games on my uncle''s old DOS machine,
    and soon found myself ripping apart my PC and putting it back again just to see
    how it worked. The geekiness doesn''t stop there; I taught myself to program using
    Microsoft Word and Visual Basic for Applications (ugh) when I was 14, and I worked
    in technical support for a while in my teens. However, physics became my life
    at the end of school, and now I study cosmology full time. I haven''t completely
    forgotten computers; it turns out that numerical simulations are pretty important
    in my line of work, and I currently spend a lot of time simulating particle collisions
    on an eight-core Mac inexplicably “WiganPier.”


    My Linux journey started off with an old copy of PC Pro magazine. There was an
    article on this, alien-looking operating system in there, and I just had to try
    it out. Unfortunately, my dial-up modem balked at the prospect of downloading
    a 650MB file, so I had to wait until some time around 2004, when a friend sent
    me a Xandros CD. The'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'rest, as they say, is history: I rapidly migrated to Fedora, and then settled
    down Ubuntu in 2006. Not long after, I started writing documentation for Ubuntu,
    a pastime that I''ve kept up ever since. I just love to figure out problems, and
    writing clear, understandable instructions for people feel more productive (and
    often, more challenging!) than the crossword.


    Writing with Rickford is, in many ways, the culmination of the last decade or
    so of my computing life, and I hope you will find my contributions to this volume
    fun, easy to read, and above all, useful. In the rest of this section, I''ll explain
    the changes I made and some of the logic behind them.


    All manner of online activities, formerly the preserve of hard-core nerds, are
    now part of the non-geek''s daily routine, so I''ve given Internet a significant
    overhaul to reflect this. New in this edition is introduction to social networking
    with Twitter and Gwitterber, setup instructions for "3G" mobile broadband connections,
    and extra tips using the Firefox browser.


    Ubuntu isn''t just a collection of software; there''s a large, friendly behind
    the project, and everyone is invited to participate. This can be a little unexpected
    for those used to the rigid, corporate world of computer stores and support hotlines
    that most operating systems inhabit, but the "community vibe" really is one of
    Ubuntu''s killer features. I''ve tried to get message across the new Chapter 20.
    You''ll learn about how to join and help out if you like. In particular, there''s
    lots on getting help and support via IRC and the forums.


    Computers go from time to time, so chances are you''ve learned a few tricks to
    deal with Windows hiccups or Mac disasters the years. However, experiencing a
    problem as a new Ubuntu user can be daunting, you may not have the experience
    of how to handle it. To help you out, I''ve included a whole new chapter of troubleshooting
    tips and tricks. Although some specific, common problems are covered, I''ve kept
    most of the discussion general. The idea is to equip you with a problem-solving
    toolkit comparable to the one you painstakingly built up the years for your previous
    operating system, and I hope that by end of Chapter 21 you''ll feel more confident
    if faced with an unexpected error or misbehaving hardware.


    One of the most common stumbling blocks for Linux newcomers is the first one—so
    we''ve really beefed up our coverage of this time around. A big chunk of Chapter
    21 is dedicated to solving installation problems, so you can feel more confident
    than ever to try Ubuntu. There''s one new appendix (A) dedicated to installing
    from a USB memory stick, which is the method of choice for owners of notebooks
    and other computers using a CD drive. Hard disk partitioning is another out-cited
    source of bewilderment, so I''ve added another new appendix (C) with advice on
    how to partition your hard disk during installation,


    Once Ubuntu is installed, you may find that certain aspects of your former operating
    system. For most people, that former operating system is Windows, so I''ve added
    a new chapter (18) on getting Ubuntu and'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Windows to play together nicely. There''s some enhanced coverage of Wine too,
    so running Windows programs in Linux need no longer be a chore.


    This Ubuntu release comes with some big changes in the way you install applications.
    Things are much simpler now, to reflect this we consolidated pretty much everything
    you know about software installation into Chapter 6. Gone are the ugly workarounds
    and complicated programs that were sometimes necessary to get a program installed;
    they''ve been replaced by safer, more elegant ways of doing things, like the Ubuntu
    Software Center, PPAS, and APT-URL.


    Finally, in response to the common, but erroneous, gripe that there are "no games
    for Linux," Rickford and I have dedicated the whole of Chapter 17 to the state-of-the-art
    in Linux gaming. (Rumors that it was inserted purely so that we could go off and
    play a bunch of games have been greatly exaggerated.) Don''t forget to check it
    out; we tried to include something for everyone.


    New material aside, we''ve been over the book with a fine-toothed comb to check
    that everything is accurate, up-to-date, and easy to understand. I hope you enjoy
    reading it. Oh, and one last thing . . . welcome to Ubuntu!'
  merge: -1
  img_proc: true
