    ![](img/58abec7ac6c22ade6357fd77ea421da3_490_0.png)


    # MY NEW® iPad


    A User''s Guide


    by WALLACE WANG


    Apple''s iPad has revolutionized the way consumers experience the Web, email,
    photos, and video. As all Apple gadgets, the basic features are easy to access
    and understand. But there''s a world of possibility beyond the basics, and many
    need guidance to make the most of their iPads. My New iPad takes readers step
    by step through the iPad''s many features—like surfing the Internet, sending email,
    listening to music, taking notes, reading eBooks, using apps, and playing with
    digital photos. And since no one wants to read a long, dry textbook to learn how
    to use them more now, author Wallace takes a practical, easy-to-follow approach
    and keeps the light tone.


    JUNE 2010, 368 PP., $24.95

    ISBN 978-1-59327-275-3


    ![](img/58abec7ac6c22ade6357fd77ea421da3_490_1.png)


    # THE ESSENTIAL BLENDER


    Guide to 3D Creation with the Open Source Blender


    edited by ROLAND HESS


    Blender is the only free, fully integrated 3D graphics creation suite to allow
    modeling, animation, rendering, post-production, and real-time interactive 3D
    with cross-platform compatibility. The Essential Blender covers modeling, materials
    and textures, lighting, particle systems, several kinds of animation, and rendering.
    It also contains chapters on the compositor and new mesh sculpting tools. For
    users familiar with other 3D packages, separate index topics using the terminology
    in those applications. The book includes 4 CD with Blender for all platforms as
    well as the files and demos from the book.


    SEPTEMBER 2007, 376 PP. W/CD, $44.95

    ISBN 978-1-59327-166-4


    ![](img/58abec7ac6c22ade6357fd77ea421da3_490_2.png)


    # FORBIDDEN LEGO


    Build the Models Your Parents Wanted You Against!


    by ULRIK PILEGAARD AND MI DOOLEY


    Written by a former master LEGO designer and a former LEGO project manager, this
    full-color book showcases projects that break the LEGO Group''s rules for building
    LEGO bricks—rules against building projects that projectile, cutting or gluing
    bricks, or using nonstandard parts. Many of these are back-room projects that
    LEGO''s master designers build under the LEGO radar, just to have fun. Learn how
    to build a catapult that shoots M&Ms, a gun that beams, a continuous-fire ping-pong
    ball launcher,


    AUGUST 2007, 192 PP., $24.95

