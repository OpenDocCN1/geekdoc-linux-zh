  md: '# COVER STORY


    # Building an IRC Bot


    # BasicBot''s Methods


    BasicBot provides many stub methods that are intended to be overridden by the
    developer. Every method is passed from the bot object itself as first parameter.
    The most interesting methods are said and tick.


    said is invoked every time the bot hears something in the channel. When that happens,
    the said method is passed a hash, which contains who, body, and address elements,
    others. who identifies the user who posted the message. body contains the message
    itself, and address informs if and how somebody was addressed (for example, if
    somebody wrote Tux: Hello!, the address field would contain Tux and the body field
    would contain Hello!) You''ll find an example of this method in action in Listing
    2.


    tick is an event that is called regularly. The tick event might be used for schedul-ing
    tasks that must be carried out repeatedly. If you want the bot to retrieve an
    RSS feed periodically, use tick. The tick event must return a numeric value equal
    to the number of seconds you want to wait before it is invoked again.


