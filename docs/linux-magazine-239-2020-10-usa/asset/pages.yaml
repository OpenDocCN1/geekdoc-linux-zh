  md: '# a Convergence Package


    Although the Linux PinePhone is still not ready for primetime, the company behind
    the product has upped the ante with a hardware add-on that makes it possible to
    turn that Linux-powered mobile platform into a full-blown desktop.


    The new Convergence Package is a limited edition option that makes use of the
    PostmarketOS, which is based on the Alpine Linux distribution that includes both
    mobile and desktop modes. In order to make this work, the PinePhone uses a docking
    station with two USB-A ports, an HDMI port, and a 10/100Mbps ethernet port.


    Because PostmarketOS is still in alpha development, it cannot be considered ready
    for consumer usage, however the core functionality (phone, SMS, LTE, GPS, GPU
    acceleration) are all operational.


    The Convergence Package phone specs aren’t


    going to wow anyone (especially if you’re looking for a flagship device). You’ll
    find an Allwin A64 chipset, a 64-bit Quad-core 1.2 GHz ARM Cortex-A53 CPU, a


    MALI-400MP2 GPU, 32GB of internal storage, 3GB


    of LPDDR3 SDRAM, a micro SD Card slot (which supports up to 2TB of storage), a
    single 5MP main camera and a 2MP selfie camera.


    The Convergence Package sells for $199 and is up for pre-order now ( https://store.pine64.org/product/
    )'
