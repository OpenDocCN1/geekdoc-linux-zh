  md: '# Bot Netiquette


    Bots can be helpful, but they can also be very intrusive, especially if a bug
    is triggered. As a matter of consideration towards other IRC users and towards
    the IRC administrators, keep the following common sense rules in mind.


    First, your bot should not flood channels. You must limit the rate at which your
    bot posts messages and prevent it from posting too many in a row. Bot::BasicBot
    has flood protection built in, so this should not be a big problem.


