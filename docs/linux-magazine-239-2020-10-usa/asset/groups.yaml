    锂电池为多个地点的测量类型提供了足够的功率，其功耗低、测量范围有限，且传感器可运行数年，且不需要到处拉乱电线。我之前工作过一种方案，让单元每隔 10 分钟睡眠一次，以提供季节性数据以便更好地规划种植，并具有报警功能以警报霜冻和高温。理想情况下，数据将以如下形式可用。


    LoRa [1] 是一种专为低数据速率、低功耗和远距离数据遥测设计的无线技术。此外，所需测量的传感器均以 I2C 设备的形式提供，使得所有设备可以通过总线汇合并连接到小型微控制器上。LoRaWAN
    广域网协议与公共网关和公共“着陆点”组成的网络协同工作，以保护数据安全。传感器产生的功率通过一个 MOS-FET 开关 [3] 提供给设备，因此设备在测量之间可以关闭电源。


    Andrew Malcolm (CEng, MIET) 致力于物联网（IoT）传感器工作。作为 Guru Systems (https://www.gurusystems.com/)（一家快速成长的物联网硬件和
    SaaS 公司）的资深工程师，他正致力于低碳能源项目。在空余时间，他喜欢结合软件工程。凭借对可用开源工具的掌握，他从不设计项目。


    你可以通过 andrewrussellmalcolm@gmail.com 联系 Andrew。


    图 1：自定义传感器设置。


    LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM | 第 239 期 | 2020年10月 | 57


    ![](img/4124af05f4c60b6759782ba44ba4bc7f_378_0.png)

    ![](img/4124af05f4c60b6759782ba44ba4bc7f_378_1.png)


    MAKERSPACE 仪表花园

    图 2：原理图 [6]。


    通过测量，我确认了在投入设计自己的 PCB（图 3）之前，传感器的待机功耗（图 2）小于 50µA，这对于机械限制严格的设计特别有帮助。LoRa 无线调制解调器通过
    SPI 总线连接到微处理器。电源由电池提供，无线天线采用螺旋设计以保持紧凑性。还可以将 STEP 文件 [7] 导出到其他 CAD/CAM 软件包，例如 FreeCAD（另一个免费开源软件包），因此
    PCB 可以集成到更大的微控制器中 [4]。


    PCB 设计包含一个锂电池支架、螺旋天线、编程连接器、螺丝孔，以及一个适配我所选外壳 Hammond 1551FGLGY [8] 的轮廓。选择微控制器是因为
    I/O 引脚、低功耗和小型封装之间的良好平衡。外壳盖子带有法兰，允许通过螺丝、线或扎带将其固定在支撑结构上。紧邻传感器簇的小孔允许空气和光线进入外壳。必须确保外壳垂直安装以防止积水。


    ## 原理图与 PCB 设计


    对于设计工作，我使用了 KiCad [5]，这是一个运行在 Linux 上的免费开源设计软件包，允许对布局进行 3D 可视化。


    传感器的软件改编自 STMicroelectronics 提供的示例，因此大部分软件涉及整合 I2C 传感器的驱动程序并为无线收发器格式化数据，该收发器可以同时在多个通道上发送和接收。我选择了一个由
    IMST [13] 生产的商用网关，它需要通过 SPI 总线与主机通信。


    IMST 提供了一个优秀的教程 [14]，介绍如何使用树莓派构建完整的网关，这增强了本文关于构造、软件设置和网关配置的逐步说明，并包含一个用于转发上行和下行数据包的完整软件应用程序。


    树莓派和网关 PCB 安装在一个带有外部天线的防水箱内（图 5），尽管网关目前安装在我的阁楼上，并与所有传感器通信均无问题。我在树莓派上设置了 WiFi，这样就不需要连接线。一旦微控制器配置、使用
    ARM 版本的 GCC 进行编译并生成代码，我就不需要特殊软件。


    图 3：KiCad 3D 查看器中的 PCB 组。

    图 4：在 CubeMX 中配置的微控制器引脚。


