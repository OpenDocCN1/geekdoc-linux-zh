    LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM


    # 引言：Linux 之声


    Linux 已经不再像二十年前那样，仅仅是程序员的乐场了。今天的 Linux 属于所有人，但即使你不是程序员，也必须习惯看到一些源代码。Doghouse –
    为什么选择 Alpha


    GitHub 开发平台是数百个开源项目的家园，如果你在 Linux 环境中花费了足够的时间，最终会访问 GitHub 下载一些源代码并自己进行编译。


    Jon “maddog” Hal 解释了他在 Linux/Alpha 项目中看到的许多优势。本月，我们通过一篇介绍如何使用 `hub` 命令行扩展与 GitHub
    仓库交互的文章，帮助你更深入接触 GitHub。


    # 使用 hub 使用 GitHub


    实用的 `hub` 命令行工具允许你从终端窗口管理 GitHub 仓库，这可以让自动化重复任务变得更加容易。我们将向你展示如何为服务器创建自己的扩展。


    在本月的杂志中，我们还向你介绍了 PulseEffects，这是一个酷炫的工具，它可以为 PulseAudio 音效添加均衡器和其他增强功能。


    # PulseEffects 78


    疯狂闪烁的均衡器曾是每台体音响系统基础设备的一部分。PulseEffects 升级了 PulseAudio 服务器，包含了这些滑块控制——并提供了更多功能。


    # FOSSPicks 82


    来看看这个动画强王者、平铺窗口管理器、数学软件、GitHub 浏览器等！


    # 教程 – Inkscape 脚本


    Inkscape 的扩展添加了许多实用功能。以下是编写自己的扩展的方法。


    LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM


    第 239期


    2020年10月


    Linux 之声 DOGHOUSE – 为什么选择 ALPHA


    # MADDOG 的 DOGHOUSE


    Jon “maddog” Hal 是一位作家、教育工作者、计算机科学家和自由软件先驱，自1994年以来一直是 Linux 的热心支持者。作者：JON “MADDOG”
    HALL


    # Linux 的早期时代


    回想起早年接触 Linux 的经历时，maddog 解释了当他第一次遇到 Linus Torvalds 以及 Linux/Alpha 项目，并促进 Linux
    迁移到 64 位系统时所看到的许多优势。他担任 Linux International® 的主席。


    我曾写过关于 Linux/Alpha 项目以及它是如何发生的，但我从未写过我为什么要鼓励它。今天我们拥有 1TB 的硬盘，可以容纳你所有的数据。但在 64
    位环境中，这是不实际的。

