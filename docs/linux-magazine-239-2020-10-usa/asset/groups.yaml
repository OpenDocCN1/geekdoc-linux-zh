    \ Inkscape 元素的子模块。在第 5 行，你导入了 `Circle` 元素，因为那是你想要画的内容。\n\n要找到你还可以导入的其他内容，你可以查看\
    \ `/usr/share/inkscape/extensions/inkex/elements/` 下的 `.py` 文件。是的，你必须阅读代码。我没有找到任何关于行内或其它地方描述可以导入的\
    \ XML 元素的文档。据我所知，你需要告诉 Inkscape 元素将去向何处。你通过指定圆的父级来实现这一点，在这种情况下就是你想要画的当前图层（第 9\
    \ 行）。你可以导入模块来创建圆、矩形、线条、文本和其他图形元素，并将这些内容的尺寸、名称和 ID 属性放在一个 Python 字典中——一个带有键和值的数组（这在稍后会很有用）。\n\
