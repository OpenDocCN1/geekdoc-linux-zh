    # Multiparameter Sensor


    ## Distributed weather monitoring in gardens


    Place long-range wireless sensors in a garden and keep track of ambient conditions
    with gauges and time-based graphs when the battery needs to be changed.


    The most important requirement for a sensor for this application is that it transmits
    data wirelessly, which, of course, implies battery power. I considered a number
    of wireless technologies, including WiFi and Bluetooth, but I rejected these on
    the basis of power consumption. A large 1000mAh battery would be the size of a
    matchbox.


    ## Instrumented Garden


    Many commercial sensors [2] meet these requirements, and it would be perfectly
    possible to build a sensor array from such devices. However, being a hardware
    engineer, I decided to design my own sensors (Figure 1) tailored to my own needs.


    The wired sensor is at a single, fixed location, only measures current temperature,
    and is too close to the house. To that end, I chose an enclosure the size of a
    matchbox. The sensor outside outside and an indicator inside for

