    \ 和 XFCE 等桌面环境。早期的 GTK3 继承了 GTK2，对于这些引擎，学习如何使用 CSS 进行主题定制的最好方法是研究现有的主题，然后尝试修改它。它曾经非常容易主题化，但在\
    \ 2015 年，GTK3 开发者移除了大部分对主题的支持。从 3.14 版本开始，GTK3 现在仅使用基于 CSS 标记的主题。这种变化也允许以各种方式组合选择器。目前，Adwaita\
    \ CSS 代码位于 `/usr/share/themes/`。要要求一个节点满足多个条件，请通过连接多个选择器将其合并为一。要限制匹配发生在某些其他节点内部，请将两个选择器写在在一起，并用空格隔开。\n\
    \n样式表是一个具有树形结构的文本文件：第一层定义一个 UI 小部件，第二层描述其外观，第三层用于更深层次的细节。\n\n下面的示例说明了 GTK3 如何使用自定义主题，但\
    \ Linux 社区需要更多的自由和更多的选择。\n\n```css\n.path-bar-box {\n    background-color: transparent;\n\
    \    background-image: none;\n    min-height: 20px;\n    min-width: 16px;\n  \
    \  padding: 2px 6px;\n}\n\n&:not(:backdrop) {\n    border-width: 2px;\n}\n```\n\
    \n目标是制作一个符合你个人口味的美观主题。为了实现这一点，我将从覆盖 `_common.scss` 文件中的通用定义开始。首先，为 `headerbar.titlebar`\
    \ 元素定义最小值，包括窗口按钮以及定义每个包含元素外观的全局颜色定义。这正是 Canonical 为其 Ubuntu 的 Yaru 主题所做的。\n\n\
    然而，如果你只有一个或极少数异常情况，那么仅在文件中修改需要的部分是有意义的。`gtk.css` 中的定义列表非常庞大，超过了 2,000 行代码，你就会明白为什么大多数主题开发者只是分叉\
    \ Adwaita 主题并维护一系列覆盖，而不是从零开始掌握它们。\n"
