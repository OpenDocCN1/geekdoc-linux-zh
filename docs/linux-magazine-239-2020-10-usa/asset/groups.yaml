- md: "\n## IN-DEPTH\n\n## Customizing GTK3 Themes\n\nThe looks for light and dark\
    \ theme and many other vendors take the same approach. Next goes the notebook\
    \ header, which represents the area with tabs just below the header bar (Listing\
    \ 3). \n\n### Altering a Theme\n\nThe values in pixels are my personal estimates,\
    \ but they are all smaller than what Adwaita suggests by default. This is the\
    \ right place to commit changes or other tweaks to alter the vanilla style sheet.\
    \ Many Linux users dislike the wide paddings and offsets in Adwaita. It’s not\
    \ just a matter of taste – those too-spacious elements eat a lot of screen real\
    \ estate in apps, but they are arbitrary. You still need to define a small override\
    \ of extra UI elements further to leave less space for useful content.\n\nYou\
    \ may find extra .scss files used to override certain style elements for design\
    \ in the current file (Listing 4). The padding part is rather obvious, but as\
    \ for the multiple min-height values, you need them to make sure that elements\
    \ within the same area have consistent height and fit nicely into the 24px-tall\
    \ entry panel. Elements like button, spinbutton, and row.activatable are 20px\
    \ tall and have one vertical padding of 4px, which adds up to the same 24px.\n\
    \nListing 1: gtk-light.scss\n```scss\n@import 'common';\n```\n\n```scss\n.nautilus-window\
    \ {\n  .path-bar-box {\n    border: 1px solid rgb(182,182,179);\n    border-radius:\
    \ 3px;\n    &:not(:backdrop) {\n      background-color: rgb(232,232,231);\n  \
    \  }\n  }\n}\n```\n\nFigure 2: A good theme is more than just CSS code. Buttons,\
    \ checkboxes, and lots of other elements use external artwork assets.\n\nListing\
    \ 2: headerbar.title Element\n\nOnce you have made the changes to folder to ~/.themes\
    \ and then apply the code, you need to compile the .scss theme using the appropriate\
    \ tool of your desktop environment (e.g., Gnome Tweak Tool). There is also the\
    \ great button source files should be processed as follows: the SASC generator\
    \ gtk-widgets-factory command that lets you easily see all GTK3 widgets at once\
    \ and check if they look correct with your theme (Figure 3).\n\n```scss\n.headerbar.titlebar\
    \ {\n  min-height: 0;\n  min-height: 16px;\n  min-width: 16px;\n  padding: 4px;\n\
    \  &.text-button {\n    min-width: 100px;\n  }\n}\n```\n\n```bash\n$ sassc -M\
    \ -t compact gtk-light.scss.css\n$ sassc -M -t compact gtk-dark.scss.css\n```\n\
    \n### Changing Colors\n\nPaddings and widths aren’t always an issue. Sometimes\
    \ all you need is to change the stock style sheet colors to more eye-pleasing.\
    \ If that is your case, consider the following sequence as a basic template.\n\
    \nFirst, make a copy of the theme you want to edit. Locate the _colors.scss file\
    \ and make some edits to it. In most cases, the following seven values are used\
    \ to define the palette: $base_color, $text_color, $bg_color, $fg_color, $selected_bg_color,\
    \ $selected_fg_color, and $top_highlight (pretty much self-explanatory). A common\
    \ convention is to use color values in HEX (#343536) or in plain text format (red,\
    \ green).\n\nConvert the main .scss file with SASSC. This will take color edits\
    \ into account: private lines from the _common.scss file and produce the resulting\
    \ ready-to-use CSS files. The only thing left is to rename files and put them\
    \ in the right places.\n\nCreate a folder with a theme name, then add the gtk-3.0\
    \ subfolder, and finally, copy your CSS file to the subfolder as gtk.css. Copy\
    \ the theme into the theme folder, and you can use the theme with new colors.\n\
    \nListing 3: notebook header\n```scss\nnotebook header {\n  spinbutton, button\
    \ {\n    margin: 0;\n    min-height: 20px;\n    padding: 0;\n    min-width: 16px;\n\
    \  }\n  tabs {\n    padding: 2px 4px;\n    margin: 0;\n  }\n  tab {\n    padding:\
    \ 0px;\n    min-height: 20px;\n  }\n  spinbutton {\n    min-width: 42px;\n   \
    \ padding: 0;\n    padding: 4px 12px;\n    margin: 0;\n  }\n}\n```\n\nListing\
    \ 4: UI Elements\n```scss\n.path-bar {\n  button {\n    min-width: 0;\n  }\n}\n\
    .path-bar-box {\n  padding: 1px 0;\n}\nentry {\n  min-height: 24px;\n  padding-top:\
    \ 3px;\n  padding-bottom: 4px;\n}\nswitch slider {\n  &.bottom tabs tab {\n  \
    \  min-height: 24px;\n    padding-top: 4px;\n    padding-bottom: 3px;\n    min-width:\
    \ 42px;\n  }\n  &.left tabs tab {\n    padding-right: 16px;\n  }\n  row.activatable\
    \ {\n    min-height: 20px;\n  }\n  &right tabs tab {\n    padding: 4px;\n  }\n\
    }\n```\n\n### Going Advanced with Oomox\n\nOomox, also known as Themix Designer\
    \ [4], is a graphical application for generating custom GTK3 themes. Oomox is\
    \ very easy to use, and it allows inexperienced Linux users to make their own\
    \ beautiful themes within minutes. The application comes with a collection of\
    \ presets that differ by color schemes, shape of the UI elements, paddings, and\
    \ sizes. It is very convenient to pick a preset in Oomox, and instantly generate\
    \ the theme-related settings, and final CSS files, puts them in correct folders,\
    \ Oomox saves users from manual effort. And nothing prevents you from examining\
    \ the resulting CSS code later on.\n"
  mdcn: "\n\n## 深度解析\n\n## 自定义 GTK3 主题\n\n浅色和深色主题的外观以及许多供应商采用了相同的方法。接下来是笔记本头部（notebook\
    \ header），它代表标题栏正下方标签页区域（列表 3）。\n\n### 修改主题\n\n像素单位的值是我个人的估值，但它们都比 Adwaita 默认建议的要小。这里是提交更改或其他调整以修改原始样式表的恰当位置。许多\
    \ Linux 用户不喜欢 Adwaita 中宽宽的内边距和偏移。这不仅仅是审美问题——这些过于宽敞的元素占据了应用程序大量的屏幕空间，而且这些设置是随机的。你仍然需要对额外的\
    \ UI 元素定义一个小的覆盖，以便为有用内容留出更多空间。\n\n你可能会在当前文件中发现额外的 .scss 文件，用于覆盖某些设计中的样式元素（列表 4）。内边距部分非常明显，但对于多个\
    \ `min-height` 值，你需要它们来确保同一区域内的元素具有一致的高度，并完美地适配到 24px 高的输入面板中。像按钮（button）、数字调节按钮（spinbutton）和\
    \ `row.activatable` 等元素的高度为 20px，并有 4px 的垂直内边距，加起来正好 24px。\n\n列表 1：gtk-light.scss\n\
    ```scss\n@import 'common';\n```\n\n```scss\n.nautilus-window {\n  .path-bar-box\
    \ {\n    border: 1px solid rgb(182,182,179);\n    border-radius: 3px;\n    &:not(:backdrop)\
    \ {\n      background-color: rgb(232,232,231);\n    }\n  }\n}\n```\n\n图 2：一个好的主题不仅仅是\
    \ CSS 代码。按钮、复选框以及许多其他元素使用了外部艺术资源。\n\n列表 2：headerbar.title 元素\n\n一旦你将文件夹移动到 `~/.themes`\
    \ 并应用代码，你就需要使用桌面环境的相应工具（例如 Gnome Tweak Tool）编译 .scss 主题。还有一个非常实用的按钮源文件应该按如下方式处理：SASC\
    \ 生成器 `gtk-widgets-factory` 命令可以让你一次性地看到所有的 GTK3 组件，并检查它们在你的主题下看起来是否正确（图 3）。\n\
    \n```scss\n.headerbar.titlebar {\n  min-height: 0;\n  min-height: 16px;\n  min-width:\
    \ 16px;\n  padding: 4px;\n  &.text-button {\n    min-width: 100px;\n  }\n}\n```\n\
    \n```bash\n$ sassc -M -t compact gtk-light.scss.css\n$ sassc -M -t compact gtk-dark.scss.css\n\
    ```\n\n### 修改颜色\n\n内边距和宽度并不总是问题所在。有时你只需要将默认样式表的颜色改为更护眼的颜色即可。如果是这种情况，请考虑将以下序列作为基础模板。\n\
    \n首先，复制你想要编辑的主题。找到 `_colors.scss` 文件并对其进行编辑。在大多数情况下，以下七个值用于定义调色板：`$base_color`,\
    \ `$text_color`, `$bg_color`, `$fg_color`, `$selected_bg_color`, `$selected_fg_color`\
    \ 和 `$top_highlight`（几乎不言自明）。通常的做法是使用 HEX 颜色值（#343536）或纯文本格式（red, green）。\n\n\
    使用 SASSC 转换主 .scss 文件。这将考虑到颜色更改：包含来自 `_common.scss` 文件的私有行，并生成最终可直接使用的 CSS 文件。剩下的工作就是重命名文件并将它们放置在正确的位置。\n\
    \n创建一个以主题名称命名的文件夹，然后添加 `gtk-3.0` 子文件夹，最后将你的 CSS 文件复制到子文件夹并重命名为 `gtk.css`。将主题拷贝到主题文件夹，你就可以使用新颜色的主题了。\n\
    \n列表 3：notebook header\n```scss\nnotebook header {\n  spinbutton, button {\n \
    \   margin: 0;\n    min-height: 20px;\n    padding: 0;\n    min-width: 16px;\n\
    \  }\n  tabs {\n    padding: 2px 4px;\n    margin: 0;\n  }\n  tab {\n    padding:\
    \ 0px;\n    min-height: 20px;\n  }\n  spinbutton {\n    min-width: 42px;\n   \
    \ padding: 0;\n    padding: 4px 12px;\n    margin: 0;\n  }\n}\n```\n\n列表 4：UI\
    \ Elements\n```scss\n.path-bar {\n  button {\n    min-width: 0;\n  }\n}\n.path-bar-box\
    \ {\n  padding: 1px 0;\n}\nentry {\n  min-height: 24px;\n  padding-top: 3px;\n\
    \  padding-bottom: 4px;\n}\nswitch slider {\n  &.bottom tabs tab {\n    min-height:\
    \ 24px;\n    padding-top: 4px;\n    padding-bottom: 3px;\n    min-width: 42px;\n\
    \  }\n  &.left tabs tab {\n    padding-right: 16px;\n  }\n  row.activatable {\n\
    \    min-height: 20px;\n  }\n  &right tabs tab {\n    padding: 4px;\n  }\n}\n\
    ```\n\n### 使用 Oomox 进阶\n\nOomox，也称为 Themix Designer [4]，是一个用于生成自定义 GTK3 主题的图形化应用程序。Oomox\
    \ 非常易用，它让没有经验的 Linux 用户可以在几分钟内创建自己的精美主题。该应用程序自带一系列预设，在颜色方案、UI 元素形状、内边距和尺寸上有所不同。在\
    \ Oomox 中选择一个预设并立即生成主题相关的设置以及最终的 CSS 文件，并将它们放在正确的文件夹中，Oomox 为用户节省了手动操作的精力。而且没有任何阻止你稍后检查生成的\
    \ CSS 代码。\n\n"
