    # 系统监控

    bashtop


    有很多用于你 CPU 的工具，就在它的运行监控系统之下，监控速度之上，平均负载百分比三剑客之上。


    在最初尝试它们之后，我们大多数人通常会求助于在命令行上使用 `top`，如果觉得充裕就用 `htop`。如果你对默认外观不满意，bashtop 可以配置为使用不同的主题（默认包含九个）。这些包括扁平和和阴影版本、深色和亮色，这些主题会改变你的主意。它是那种为了好莱坞风格黑客电影而制作的工具，或者是那种来自
    Amiga 命令行系统常用终端颜色方案（如 solarized）的工具。


    Bashtop 是该项目正在快速发展的证据。演示场景。它是监控的爆炸，没有颜色、阴影和运动。并且有一个雄勃的待办事项列表以免无聊。这一切都是通过一个全面的配置文件配置的，其中包含
    GPU 监控，还允许你精调输出中的许多单独元素。例如，你可以禁用某些元素，或者为元素的数据使用不同的源，或者将图表的水平分辨率翻倍，以便更容易看到进程何时影响你的系统性能。它已经是一个完全功能的实用程序，但只需从命令行运行。它将在没有任何进一步交互的情况下运行，甚至包括
    Docker 统计数据。这一切让 Bashtop 不仅是外观最好的命令行监控，而且是最强大的。


    并向你显示每个核心的 CPU 使用情况、带过滤的进程使用、通过条形图显示内存和存储使用以及网络带宽。对于每个核心甚至有一个微小的滚动直方图。


