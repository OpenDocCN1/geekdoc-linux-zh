    – does not require root privileges.


    # Secure with OpenSCAP


    The setools-gui package was already available in RHEL 7 and is now also on board
    in RHEL 8.2. The Australian Cyber Security Center also manages. One of the abbreviations
    is STIG, which stands for Security Technical Implementation Guide. RHEL 8.2, users
    of the Podman D-Bus API for the Logical Volume Manager (LVM). Users restricted
