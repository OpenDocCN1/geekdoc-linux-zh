    ## IN-DEPTH


    Programming Snapshot – Bootable USB with Go


    Create a bootable USB stick with terminal UI display Ready to Rumble


    A Go program writes a downloaded ISO file to a bootable USB stick. To prevent
    it from accidentally overwriting the hard disk, Mike Schilli provides it with
    a user interface and security checks. *By Mike Schilli*


    To test new Linux distributions on real hardware, a bootable USB stick with a
    downloaded image in ISO format will help with bootstrapping the installation.
    How hard would it be to write a similar booting tool in Go – one that actively
    waits for the USB stick to be plugged in and then asks the user for permission
    to copy to often bring up a Live system that can be played around with your heart’s
    content, possibly after a reboot? Always, by writing tools yourself, having to
    make some changes to the boot order in the BIOS, you’ll learn a few new techniques
    that you might find helpful going forward to solve new everyday tasks.


    How does the ISO file get onto the stick between different functions? Ultimately,
    this is done quite simply with a dd command that expects the ISO file as the input
    (if) and the device entry of the stick (for example /dev/sdd) as the output (of).


    The Art of Copying


    It is not trivial to copy an ISO file in at several gigabytes to another filesystem
    like the USB stick. Utilities like Ubuntu’s Startup Disk Creator make things even
    more convenient with a graphical UI, but there are some concerns. Under no circumstances
    like cp and dd do not read all the data in the source file from the disk in a
    single pass – this would take up a huge amount of precious RAM without shortening
    the process. Instead, such copy tools read the data from the source file, typically
    in megabyte-sized chunks, and keep writing them to the target file opened at the
    same time.


    The advantage is that things are kept flexible; you don’t need to change the code
    just because the data source changes, because the interface remains the same.
    This is exactly what the code from Listing 1 does. The cpChunks() function sends
    a percentage value to the channel after each copied chunk, which indicates the
    fraction of the bytes already copied in relation to the total number.


    To allow Go programmers to funnel many libraries accept the standard Reader and
    Writer interfaces. A library function expects a pointer to a Reader object from
    the caller and then uses Read() to draw data from it chunk by chunk. The Reader/Writer
    interface builds an abstraction on the data, regardless of its origin, whether
    it’s a JSON stream from a web server or blocks from the local filesystem read
    in via a file descriptor.


    Author

    Mike Schilli works as a software engineer in the San Francisco Bay area, California.
    Each month in his column, which has been running since 1997, he researches practical
    applications of Go Design: various programming languages. If you email him at
    mschilli@perlmeister.com he will gladly answer any questions.


    ## Go Design: Reader/Writer


    Listing 1: cpchunks.go


    ```go

    01 package main

    02 import

    03 (

    04  "bufio"

    05  "io"

    06  "os"

    07 )

    08

    09 func cpChunks(src, dst string, percent chan<- int) error {

    10  total := 0

    11  data := make([]byte, 4*1024*1024)

    12

    13  in, err := os.Open(src)

    14  if err != nil {

    15    return err

    16  }

    17  defer in.Close()

    18  reader := bufio.NewReader(in)

    19

    20  out, err := os.OpenFile(dst, os.O_WRONLY, 0644)

    21  if err != nil {

    22    return err

    23  }

    24  defer out.Close()

    25  writer := bufio.NewWriter(out)

    26

    27  defer out.Close()

    28

    29  for {

    30    count, err := reader.Read(data)

    31    total += count

    32    data = data[:count]

    33

    34    if err == io.EOF {

    35      break

    36    } else if err != nil {

    37      return err

    38    }

    39

    40    _, err = writer.Write(data)

    41    if err != nil {

    42      return err

    43    }

    44  }

    45  fi, err := in.Stat()

    46  if err != nil {

    47    return err

    48  }

    49

    50  percent <- int(int64(total) * int64(100) / fi.Size())

    51  return nil

    52 }

    ```

    '
