- md: "\n# IN-DEPTH\n## Finding Processes\n\nSince age is identical, the PID is used\
    \ as the criterion. Instead of the `ps` command, attempts from the `/proc` filesystem\
    \ are used as the basis. The required specification is found in detailed form:\
    \ `/proc/<pid>/stat`. It tells you the number of clock ticks after the Linux kernel\
    \ started. Instead, the value can also be written directly as 172800 trick; it\
    \ is based on the assumption that 86400 is useful for the number of seconds per\
    \ day when parameter is missing.\n\nThe fact that 2*24*60*60 corresponds to two\
    \ days of clock ticks each with clock speed of 100Hz (i.e., 100 ticks per second\
    \ [3]):\n\n### Listing 4: Compact Bash Variant\n\n```bash\nps -eaxah etimes,pid,user,cmd\
    \ | sort -nr | awk '$1 > 10*2*24*60*60 {print}' | head\n```\n\n### Listing 2:\
