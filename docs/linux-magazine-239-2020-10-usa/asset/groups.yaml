- md: "\n# Hit the ground running with Linux\n\n![](img/4124af05f4c60b6759782ba44ba4bc7f_29_0.png)\n\
    \nWant your friends and colleagues to make the switch to Linux?\nThis single issue\
    \ shows beginners how to:\n\n- install Linux\n- download and install free software\
    \ for your Linux system\n- play games\n- create documents and spreadsheets\n-\
    \ process photos\n- play music and videos\n- and much more!\n\nORDER ONLINE: shop.linuxnewmedia.com/specials\n\
    \n![](img/4124af05f4c60b6759782ba44ba4bc7f_30_0.png)\n\n# NEWS\n\nUpdates on technologies,\
    \ trends, and tools\n\n## THIS MONTH’S NEWS\n\n- 08 • LibreOffice 7 Now Available\n\
    - Microsoft Brings Procmon to Linux\n- 09 • New KDE Slimbook LibreOffice 7 Now\
    \ Available\n\nA major release of the most popular open source office suite, LibreOffice,\
    \ is now the Convergence Package available for download. The new release includes\
    \ numerous improvements across the suite. Although most users won't notice anything\
    \ obvious, there are numerous file compatibility improvements, which should go\
    \ a long way to make interoperability between LibreOffice and other suites even\
    \ better.\n\n## 10 • Flutter is Coming to Linux\n\n- • SUSE Rolls Out\n\nThe first\
    \ major compatibility improvement is that LibreOffice includes support for Service\
    \ Pack 2 for SLE ODF 1.3. Along with this update comes digital signatures for\
    \ documents and Open-PGP-based encryption of XML documents.\n\nMS Office compatibility\
    \ has been greatly improved with LibreOffice’s handling of DOCX, XLSX, and PPTX\
    \ files. With this new release, DOCX files now save in native 2013/2016/2019 mode\
    \ (instead of the outdated 2007 compatibility mode). Along those same lines, XLSX\
    \ sheet names longer than 31 characters are now supported, as well as the exporting\
    \ of checkboxes in XLSX.\n\nTool-specific improvements include semi-transparent\
    \ text support and better handling of quotes and apostrophes in Writer; new functions\
    \ for non-volatile random number generation, keyboard shortcuts for autosum in\
    \ Calc; semi-transparent text, subscripts return to default 8 percent, and PDFs\
    \ larger than 500 cm can be generated in Draw.\n\nNew features across the suite\
    \ include:\n\n- • Skia graphics engine and Vulkan GPU-based acceleration.\n- A\
    \ new icon theme.\n- New shapes galleries.\n- Glow and soft edge effects for objects.\n\
    \nFor more information about the release, read the official LibreOffice announcement\
    \ (https://blog.documentfoundation.org/blog/2020/08/05/announcement-of-libreoffice-7-0/).\n\
    \n## Microsoft Bringsrings Procmon to Linux\n\nThe Microsoft process monitor tool\
    \ has arrived for Linux. Process Monitor (otherwise known as Procmon), is a reimagined\
    \ version of the tool for Linux. For those that have worked with Procmon, you\
    \ know it's a convenient tool to view real-time file system activity. And for\
    \ developers, Procmon makes it easy to trace syscall activity on a given system.\
    \ Procmon also supports logging information to file (so you can analyze data at\
    \ a later time), is highly configurable, supports non-destructive filters, capturing\
    \ thread stacks and process details, and boot logging.\n\nAlthough the addition\
    \ of Procmon to Linux might not be terribly exciting to the average Linux desktop\
    \ user, for developers, Procmon could be a serious game changer.\n\nAt the moment,\
    \ Procmon is limited to Ubuntu 18.04 systems running a kernel between release\
    \ 4.18 and 5.3. You will also need cmake greater than or equal to 3.1 and libsqlite3-dev\
    \ greater than or equal to 3.22. Microsoft plans on adding more configurations\
    \ in later builds, so look for Procmon to be available to a wider range of distributions\
    \ soon.\n\n# MORE ONLINE\n\nTo find out exactly how to build Procmon on the supported\
    \ systems, head over to the official GitHub page (https://github.com/microsoft/ProcMon-for-Linux)\
    \ for the project.\n\n# ADMIN HPC\n\nhttp://www.admin-magazine.com/HPC/\n\n##\
    \ New KDE Slimbook Available\n\nLinux fans everywhere now have more choices than\
    \ ever. With distribution-specific laptops popping up left and right, it was only\
    \ a matter of time before a desktop received the same treatment. So when the KDE\
    \ Slimbook arrived, it was not only the first laptop to focus on the KDE desktop\
    \ environment, it was a well-spec’d thing of beauty.\n\nAnd with the rise of popularity\
    \ of the AMD Ryzen CPU, it makes perfect sense that the makers of the KDE Slimbook\
    \ (https://kde.slimbook.es/) would migrate their laptops to AMD’s processor.\n\
    \nThis new laptop easily falls into the Ultrabook category. With a magnesium case\
    \ that’s less than 20 millimeters thick and either a 14.1\" or 15.6\" display,\
    \ the new laptop tops weigh only 1.1 kg (for the 14.1\" option) and 1.5 kg (for\
    \ the 15.6\" version). The display is a full HD IPS LED panel and covers 100 percent\
    \ of the sRGB range, so colors will be accurate.\n\nAs for the CPU, the new Slimbook\
    \ features an AMD Ryzen 7 4800 H processor (which includes 8 cores, 16 threads,\
    \ and up to 64GB of DDR4 RAM running at 3200 MHz), which makes the KDE Slimbook\
    \ Ryzen edition the first of its kind for Linux pre-installed laptops.\n\nThe\
    \ KDE Slimbook includes 3 USB ports, a single USB-C port, an HDMI socket, RJ45\
    \ network port, and support for the new WiFi 6 standard. The 14\" unit starts\
    \ at EUR899 (about $1063) and the 15\" unit starts at EUR929 (about $1099). You\
    \ can order a KDE Slimbook from the online store at https://slimbook.es/en/store/slimbook-kde.\n\
    \n# ADMIN Online\n\n- Jeff Layton\n- Petros Koutoupnis\n- Rainer W. Gerling\n\
    - Mayank Sharma\n\nCaching with CacheFS\nFor read-heavy workloads, CacheFS is\
    \ a great environment caching mechanism for NFS and AFS.\n\nBuilding a virtual\
    \ NVMe drive\nAn economical and high-performing hybrid NVMe SSD is exported to\
    \ host servers that use it as a locally attached NVMe device. \n\nSolving the\
    \ security problems of encrypted DNS\nDNS encryption offers WiFi users for good\
    \ protection in public spaces; however, in the Linux enterprise, it prevents the\
    \ evaluation and filtering of name resolution.\n\nInterview with the MariaDB Foundation\
    \ board Chairman Eric Herman Eric Herman, Chairman of the MariaDB Foundation board,\
    \ sheds light on the evolving focus of the custodians of one of the most popular\
    \ and widely used databases.\n\n## PinePhone Now Offers a Convergence Package\n\
    \nAlthough the Linux PinePhone is still not ready for primetime, the company behind\
    \ the product has upped the ante with a hardware add-on that makes it possible\
    \ to turn that Linux-powered mobile platform into a full-blown desktop.\n\nThe\
    \ new Convergence Package is a limited edition option that makes use of the PostmarketOS,\
    \ which is based on the Alpine Linux distribution that includes both mobile and\
