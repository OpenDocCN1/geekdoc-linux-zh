    # MAKERSPACE Raspberry Pi Symfonisk


    写入 SD 卡 [10]，就像处理其他 Pi 操作系统一样。要设置 WiFi，在 PCBBOOT 分区创建 wpa_supplicant.conf 文件并在其中输入登录信息。可以参考
    wpa_supplicant.conf.sample 文件 [11]。


    现在手动将下载的插件拷贝到内存卡。要做到这一点，将 rt-plugins-0.0.6.tcz 和 rt-plugins-0.0.6.md5 文件写入 PCP_ROOT
    分区的 tce/optional 文件夹中。为了让系统在启动时加载插件，你需要在 tce/onboot.lst 文件中输入其文件名（rt-plugins-0.0.6.tcz）（见图
    4）。你可能需要以管理员权限启动文件管理器和编辑器来完成。


    此外，你可能希望扩大 PCP_ROOT 分区以使用整个内存；这样你就可以消除了构建交叉网络的需求，以后可以通过软件数字地完成。


    或者，你也可以首次启动 piCorePlayer 后这样做，但在你把组件装回外壳之前，需要将所需的插件拷贝到 SD 卡中。1GB 容量的内存卡即可。


