  mdcn: "\n\nPrometheus 是一个免费且开源的多维时间序列数据库，用于事件监控和告警，运行在 Linux 上。你可以在网上找到许多关于 Prometheus\
    \ 安装的优秀教程，因此你应该选择最适合你发行发行版的一个。（对于我的 Ubuntu 设置，我选择了 Linuxide 网站上的一个视频教程 [20]。）安装完成后，你应该能够浏览到\
    \ Prometheus 的主页。然而，为了发挥实际作用，你必须能够向 Prometheus 插入数据，因此需要回到 golang 代码来添加 Prometheus\
    \ 指标（列表 2）。\n\n图 7：weatherstation1 的设置。\n\n在指标部分之后，代码声明了一组二维解调器 [16]。你可以为网关提供维度的\
    \ Prometheus 向量，每个你喜欢的名称都对应一个（图 6），并选择测量值：hardware_id 和 time 是两个维度。因此，当你插入数据时，它是根据传感器的\
    \ ID 进行键值的 [17]。数据即使在公共网关上也是可用的，并且基于 MQTT 协议 [18]，还提供了 golang 的 SDK。一个简单的图表。\n\
    \n下一步是注册你的应用程序。应用程序唯一 ID (EUI) 将被存储，无需更改 [19]。仅需几行 golang 传感器代码，该设备即可被考虑。程序的入口点\
    \ main 订阅了服务，列出了用于注册的注册项。它将这些向量注册到 Prometheus（第 61-65 行），并启动一个 HTTP 服务器来提供指标（第\
    \ 67-71 行）。\n\n在第一个示例（列表 1）中，我只是通过访问 The Things Network 中的数据并根据你选择的名称设备设备写入文件。程序必须调用设备为此应用程序提供应用程序\
    \ ID 以及 weatherstation1, weatherstation2, ..., cation 访问密钥（第 24 和 25 行）以便\n\n\
    代码的其余部分与之前的版本相似，但不是将数据保存到文件，而是写入 Prometheus 网络。注意，时间戳是从元数据中提取的，它来自我的微处理器（EUI 是制造商程序化到其闪存内存中的唯一\
    \ 64 位数字），因此数据将带有测量值存储在正确的时间序列中（例如，第 131 行的温度），该值输入注册页上的 Device EUI 字段中（图 7）。\n\
    \n一旦启动此程序（在运行 Prometheus 的机器上），你可以将其存储在比扁平文件更复杂的结构中。注册后，生成的应用程序密钥也添加到设备代码中。当设备上电时，它会发送包含设备\
    \ EUI、应用程序 EUI 和应用程序密钥元组的注册请求。\n\n要查看数据，请使用 Data 标签（图 8）。负载（应用程序数据）已解密并以十六进制格式显示。在这种情况下，数据是一个逗号分隔的五个浮点数列表，代表温度、湿度、压力、强度和电池电压。元数据提供了有关数据包传输的一些细节，其中用有用时间戳，代表接收数据包的时间。\n\
    \n图 8：数据视图。\n\n2020年10月\n第 239 期\nLINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\n\n\
