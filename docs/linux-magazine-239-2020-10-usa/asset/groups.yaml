    # 平铺窗口管理器

    # Qtile


    不久前，平铺的 Plasma 和 Gnome 窗口管理器被认为是超级极客的（褒义的），可能类于 Gentoo 和 Linux from Scratch。这是因为从本质上说，将那些流行的桌面转变为平铺桌面，这一概念在曝光率、流行度和可用性方面经历了复苏。


    Qtile 是一个平铺窗口管理器，可以独立运行，也可以在 Gnome 内部运行。它们对如何交互提供的视觉提示很少，而这些都是可配置的。Qtile 是一个与你的桌面会话交互的现代选项。例如，有一种模式，新应用程序将全屏运行，即使当单个应用程序启动第二个、第三和第四个实例也是如此。而不是在启动第二个和第三个之前是可怜的全屏，xmonad
    风格和新的脚本平铺这些应用程序，Qtile 让你通过已经熟悉的快捷键 Alt+Tab 轻松地在它们之间切换，面板快捷键像秘密一样，而随后的占据空间是由任何秘密平铺模式设置的。


    在另一种模式下，你仍然可以像早期的平铺管理器那样堆叠新应用程序，让它们划分视图，并与其他快捷键在此视图和全屏视图之间切换。它构建在崭新的 Python 版本上，因此后端是现代的。它也相对容易通过
    `pip` 安装，但它需要替换正在运行的内容。你可以用鼠标选择它们，也可以将窗格从堆栈中拖到你想要的位置。如果秘密密钥微顶面板将这些布局显示为组，你通过秘密密钥可以回来。这可能是，并且
    Gnome 和 Plasma 中脚本的进一步组合激发了你的兴趣。


