    # IN-DEPTH


    ## Finding Processes


    In the next step, the user scans the processes and creates a list (Listing 18).
    A for loop then browses this list and analyzes each process with regard to the
    user and the process run time. If a process is within the period under one to
    a maximum of one and a half seconds, this is fine for everyday use.


    We would like to thank Tobias Klauser for his go-sysconf package and support in
    optimizing the Go variant. Both the Python script, as well as the Perl and Go
    implementations, make use of a matching library that offers easy access to the
    process information. The result is displayed (Listing 17). The output shows where
    the script was called with the parameter 1 and then processed via a pipe with
    grep to find all Bash instances called in the process list.


    ### Listing 18: Go Script Output


    ```

    $ ./list-processes 1 | grep bash

    ```


    User ID: 1000, Process ID: 604, Program name: bash, Started on 2020-04-14 11:31:51
    +020 CEST

    User ID: 1000, Process ID: 5318, Program name: bash, Started on 2020-04-16 16:15:21
    +020 CEST

    User ID: 1000, Process ID: 6984, Program name: bash, Started on 2020-04-16 19:04:52
    +020 CEST

    User ID: 1000, Process ID: 6998, Program name: bash, Started on 2020-04-16 19:08:57
    +020 CEST


    The Go library, however, still has room for extension. Functions that are already
    integrated in the Python library had to be built in the Go variant.


    If you compare all the solutions with regard, all variants with the exception
    of Bash variant 3 provide useful results. In terms of program size, Bash variant
    2 wins; the Go variant is the longest with more than 140 lines. The Python implementation
    falls in the lower middle range.


    Opinions differ significantly on comprehensibility and readability. Especially
    with Listing 11 (the compact Perl variant), even-hard Perl programmers need a
    moment (and the) documentation for the module we used) to understand it. The implementations
    in Python or Go may be longer, but can be more quickly understood by beginners.


