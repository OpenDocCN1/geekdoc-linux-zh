    # 新闻


    ## Linux 新闻


    ## Flutter 即将登陆 Linux


    Google 用于构建 Android、iOS、macOS 和 Windows 应用的开源 UI 框架增加了另一个平台……Linux。由于超过 500,000
    名开发者正在使用 Flutter（并有超过 80,000 个应用在该框架构建），这对于 Linux 应用程序可能是一个福音。


    但并非如此。Canonical（Ubuntu 的创建者和维护者）已指派专门人员负责此任务。事实上，Canonical 工程师经理 Ken VanDine 对此举措表示：


    > Canonical 正在对 Flutter 进行重大投资，投入了一支开发团队与 Google 开发者合作，为大多数 Linux 发行版提供最佳 Flutter
    体验。Canonical 将继续与 Google 合作，进一步改进对 Linux 的支持，并保持与其他支持平台的功能对齐。


    在 Google 方面，他们对 Flutter 引擎进行了大量工作，以便无论何种操作系统，都能提供更好的原生桌面体验。


    Flutter 的一个对开发者而言尤为重要的方面是，应用程序不需要为特定的桌面设备进行构建。


    使用 Google 的 Dart 语言，开发者可以编写一次应用程序，它（得益于 Flutter）就可以在移动设备和桌面设备上运行。随着 Google、Capital
    One、Square、eBay、BMW 和 SONOS 等公司已经在使用 Flutter……Linux 桌面面的未来无疑是光明的。


    欲了解更多信息，请查阅 Canonical 的官方公告（https://ubuntu.com/blog/canonical-enables-linux-desktop-app-support-with-flutter）。


    ## SUSE 发布


    ## SLE Service Pack 2


    SUSE 旗舰操作系统的最新迭代版本已发布。SUSE Linux Enterprise 15 Service Pack 2 现已可用，同时还有 SUSE Manager
    4.1。此版本为这一企业级平台带来了许多重要功能和改进。


    在云端方面，SLE 15 SP2 使用户能够更容易利用超大规模服务商提供的针对阿里云、Azure、AWS、Google、IBM 和 Oracle 的更新云镜像。


    通过 SP2，你还可以在 AWS 中部署大规模 HPC（高性能计算）系统，并获得 Elastic Fabric Adapter 和 Graviton2 CPU
    的支持。


    通过 SLE 15 SP2，用户能够从 openSUSE Leap 迁移到企业级平台（SUSE Linux Enterprise Server）。这一新选项是一个“先试后买”的发布方案，用户可以测试
    SLES，然后如果他们认为值得，就可以购买许可证。


    其他功能还包括：

    - 扩展的 Zypper 软件包搜索；

    - 现在已集成 SLE 软件开发包（SDK），使得开发包自动安装；

    - 默认安装 Python 3；

    - LDAP 和 OpenLDAP 已被 389 Directory Server 取代；

    - 订阅管理工具（Subscription Management Tool）已被仓库镜像工具（Repository Mirroring Tool）取代；

    - SLE Live Patching 现在已适用于 IBM Z 和 LinuxONE 平台。


    SLE 的最新版本基于 Linux 5.3 内核，可在 X86 64、Arm、IBM Power、IBM Z 和 LinuxONE 硬件架构上运行。


    欲了解更多信息，请参 SLE 15 SP 2 的 SUSE 通用列表（https://www.suse.com/c/suse-linux-enterprise-15-service-pack-2-is-generally-available/）。bit.ly/Linux-Update


    10

    2020年10月

    第239期

    LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM


    # 新闻


    ## 内内核新闻


    ## Zack 的内核新闻


    Linus Torvalds 最近将家庭系统升级到使用 GNU 编译器集合 (GCC) 10，这听起来可能没有那么重要。这导致构建几乎立即停止。”


    Linus 回答道：


    > “据我所知，GNU jobserver 没有那样的机制。”


    事实上，他说：“我让它们先运行了一会儿。Linux 内核会产生大量的警告信息。我想它总是将一个 `+` 字符作为一个标记，所以我猜可以扩展它来写入一些内容，以便在整个
    (NetBSD) 构建过程中正确使用单个作业管道，并在任何命令失败时用 ‘abort’ 标记刷新并重新填充。这并不意味着每个人都应该使用版本 10 或类似的东西。然而，Linus
    在升级后并没有发现编译 Linux 内核会产生大量的警告信息。”

