    The Convolver module (Figure 3) lets you modify the sound via convolution reverb
    [7] as if you were standing in a concert hall or. A selection of such files can
    be found, for example, in the Open Acoustic Impulse Response (OpenAIR) library
    [9], and in other open source projects such as the audio player foobar2000 [10].


    The impulse file is then loaded into the program by clicking on the waveform icon
    (Select impulse response file) and selecting the Import impulses option. Then
    enable the desired effect by pressing the Apply button.


    # Automatic Start


    In order for PulseEffects to automatically activate the settings you have changed,
    save your configuration via the Presets field and enable the Start service on
    login option in the settings, so that PulseEffects starts automatically when you
    log in the system in the future. In this way, the playback quality can be quickly
