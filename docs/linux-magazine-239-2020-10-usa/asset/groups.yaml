    Figure 2: Schematic [6].


    By measurement, I have confirmed that the standby consumption of the sensor (Figure
    2) before committing to design my own a PCB (Figure 3), which is especially helpful
    in designs with tight mechanical constraints, is less than 50µA. The LoRa radio
    modem is connected over an SPI bus to the microprocessor. Power is supplied by
    a battery, and the radio antenna is a helical design for compactness. It is also
    possible to export STEP files [7] to other CAD/ CAM packages, such as FreeCAD
    (another free and open source package), so the PCB can be incorporated into a
    larger microcontroller [4].


    The PCB design incorporates a battery holder for the lithium cell, the helical
    antenna, the connector for programming, screw holes, and an outline adapted to
    my chosen enclosure, a Hammond 1551FGLGY [8]. The microcontroller was chosen for
    the right mix of I/O pins, low power consumption, and a small package size. The
    lid of this enclosure has flanges that allows it to be attached to supporting
    structures with screws, wire, or cable ties. A small hole directly adjacent to
    the sensor cluster allows air and light into the enclosure. Care must be taken
    to ensure the enclosure is mounted vertically to prevent flooding.


    ## Schematic and PCB design


    For the design work, I used KiCad [5], a free and open source design package that
    runs on Linux and allows 3D visualization of the layout.


    Software for the sensor was adapted from an example provided by STMicroelectronics,
    so the bulk of software involves incorporating drivers for the I2C sensors and
    formatting the data for the radio transceiver, which can transmit and receive
    on several channels simultaneously. I chose a commercially available gateway produced
    by IMST [13] that requires a host computer communicating over an SPI bus.


    IMST provides an excellent tutorial [14] for building a complete gateway with
    a Raspberry Pi, which amplifies the step-by-step instructions in this article
    on construction, software setup, and gateway configuration and includes a complete
    software application for forwarding uplink and downlink packets.


    The Raspberry Pi and Gateway PCB are mounted in a weatherproof box with an external
    antenna (Figure 5), although the gateway is currently installed in my attic and
    communicates with all my sensors with no problems. I set up WiFi on the Raspberry
    Pi, so I don’t need to connect a cable. Once the microcontroller is configured,
    compiled with the ARM variant of GCC, and the code is generated, I don’t need
    special software.


