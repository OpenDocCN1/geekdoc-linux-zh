    ## 高级 LSM 特性


    `Lsm` 参数激活 LSM 子系统，并期望设置为 `Lsm=lockdown,yama`。为了实现锁定模式，内核受到了限制。你无法再使用 `kexec`
    参数来执行锁定。如果其他模块已经激活了 LSM，内核开发人员必须扩展 LSM 以允许系统直接启动到新内核。


    在之前的版本中，LSM 仅设计用于在用户空间（即为内核提供策略的环境）处于活动后处理问题。然而，攻击者可以修改系统，使其在运行后立即加载恶意代码。


    图 2：虽然你可以在系统启动时启用锁定模式，但这种选项并不安全。


