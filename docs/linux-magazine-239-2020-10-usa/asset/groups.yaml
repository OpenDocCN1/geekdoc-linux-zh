    ## Dispatcher Scripts\n\nAutomate network configurations with dispatcher scripts\n\
    \nDispatcher\n\nUse dispatcher scripts to mount a different network drive depending\
    \ on the location or automatically start a VPN connection without lifting a finger.\
    \ By Christoph Langner \n\nYou don’t have to search long for this—distributions\
    \ have the right tool on board kind of smart network management: Most in the form\
    \ of NetworkManager (Figure 1).\n\nYesterday at a conference, today at a downtown\
    \ office, tomorrow at a home office, the next day at an Internet cafe: Working\
    \ life is no longer limited to a single desk. For many employees, a reliable Internet\
    \ connection is all that is needed for a productive work day. Although working\
    \ from the road sounds simple, life on a laptop is often full of pitfalls and\
    \ complications. On your home LAN, you will want to mount the file shares from\
    \ your NAS, and on the open WiFi network of a cafe, you need a firewall to block\
    \ all access. In the secure office, services that run locally are allowed to broadcast.\n\
    \nThese different network-access cases require continual adjustments. If a computer\
    \ only connects to the network via a single wired Ethernet port, you can still\
    \ mount a network drive via /etc/fstab, or you will want to use autofofs if the\
