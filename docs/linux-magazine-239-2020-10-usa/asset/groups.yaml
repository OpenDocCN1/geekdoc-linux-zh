    \n# IN-DEPTH\n\n# Lockdown Mode\n\nSecuring the Linux kernel with lockdown mode\n\
    \nLock It Up\n\nLockdown mode makes your Linux system more secure and even prevents\
    \ root users from modifying the kernel of the operating system and reload modules\
    \ with new functionality. A Martin Loschwitz entitled “Linux Security Modules”\
    \ for more on a solution that arose from that heated debate.\n\nThe term lockdown\
    \ does not have particularly positive connotations at present, but prior to COVID-19,\
    \ the word was used in a very positive context as a term for air-tight security.\n\
    \nA highly sophisticated attacker can even replace central kernel features with\
    \ their own versions of modules to deliberately cover their tracks.\n\n# What’s\
    \ the Problem?\n\nWhich problem does the lockdown mechanism seek to solve? On\
    \ a conventional Linux system, anyone with root privileges can do whatever they\
    \ want. Modern computers therefore try to deffend themselves against this kind\
    \ of attack on the firmware side. UEFI has a separate mechanism known as Secure\
    \ Boot, which primarily affects the boot mode. Lockdown puts limits on the power\
    \ of system users – including the once-all-powerful system administrator (root).\
    \ Putting constraints on the root account might seem very strange to Unix/Linux\
    \ veterans, but security experts are happy to see this powerful new feature in\
    \ our dangerous times.\n\n# Long Time Ago\n\nWhen Linus finally incorporated the\
    \ lockdown patches into the official kernel at the end of 2019, many observers\
    \ described lockdown mode as a revolutionary new feature. But lockdown mode is\
    \ not a new invention. In fact, the work on implementing the function took almost\
    \ seven years. And for most of that time, the Linux kernel developers were arguing\
    \ – sometimes heatedly – about the right way to do it (Figure 1). See the box\
    \ about how to implement lockdown in a sensible way.\n\nFigure 1: Even in mid-2018,\
    \ the developers were still debating\n\nOCTOBER 2020 ISSUE 239\n\n![](img/4124af05f4c60b6759782ba44ba4bc7f_286_0.png)\n\
    \n```bash\n### Black on White (bash) \n# echo integrity > /sys/kernel/security/lockdown\n\
    #\n```\n\n# IN-DEPTH\n\n# Lockdown Mode\n\n# Linux Security Modules\n\nSome years\
    \ ago, when Linux kernel developers began exploring ways to implement additional\
    \ security features into the kernel. AppArmor and SELinux both use LSM, and Linus\
    \ in the kernel, they soon realized the challenge would be to support different\
    \ security compatible with LSM also technologies depending on the use case. I'll\
    \ tell you more about lockdown mode’s integrity and confidentiality modes later\
    \ in this article.\n\nThe very generic LSM interface allows other code to hook\
    \ into the kernel at certain points and implement security-rections. Compounding\
    \ this problem was the need to ensure that the solution would allow different\
    \ distributions to continue developing.\n\nIn principle, lockdown mode can still\
    \ be activated at run time by calling echo integrity or confidentiality. The lockdown\
    \ parameter can have two arguments: integrity and confidentiality.\n\nJust need\
    \ to append lockdown and yama, separated by a comma, to the existing parameters.\n"
