    查询并可视化数据（图 9）。\n\n其中一个向量简单地称为温度，所以如果你在查询框中输入它，按下 Execute，然后选择 Graph 标签，你就可以看到过去一小时内三个传感器的测量值。要查看不同的时间范围，你可以操作时间范围滑块。\n\
    \n数据分析与可视化\n\n由于 Prometheus 有限的图表功能，构建全功能控制仪表板是不太可能的。对于该任务，见图 9：查询温度数据。\n\n列表\
