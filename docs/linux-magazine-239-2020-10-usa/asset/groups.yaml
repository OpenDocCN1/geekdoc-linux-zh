    ## 深度解析


    编程快照 – 使用 Go 制作启动 USB 盘


    创建一个带有终端界面显示的可启动 USB 盘，准备就绪，待发


    一个 Go 程序将下载的 ISO 文件写入可启动的 USB 盘。为了防止其意外覆盖硬盘，Mike Schilli 为其提供了一个用户界面和安全检查。*Mike
    Schilli 著*


    在真实硬件上测试新的 Linux 发行版时，带有 ISO 格式下载镜像的可启动 USB 盘将有助于引导安装过程。用 Go 编写一个类似的启动工具会有多难呢——一个能够主动等待
    USB 盘插入，然后请求用户许可进行复制的工具，这通常带出一个让你尽情尝试的 Live 系统，可能在重启后依然可用？始终，通过自己编写工具并对 BIOS 中的启动顺序进行一些更改，你将学到一些以后解决日常新任务时可能会帮助的新技巧。


    ISO 文件是如何在不同函数之间传输到优盘的？根结底，这是通过非常简单的 `dd` 命令实现的，该命令将 ISO 文件作为输入（in），并将 USB 盘的设备节点（例如
    `/dev/sdd`）作为输出（out）。


    复制的艺术


    将几个 GB 大小的 ISO 文件复制到优 盘等另一个文件系统并非易事。像 Ubuntu 的“启动盘创建器”（Startup Disk Creator）之类的工具通过图形界面让事情变得更加方便，但存在一些问题。在任何情况下，`cp`
    和 `dd` 都不会一次性从磁盘读取源文件的所有数据——这会占用大量宝贵的内存，而不会缩短进程。相反，此类复制工具从源文件中读取数据（通常以 MB 为单位的分块），并保持将其写入同时打开的目标文件中。


    优点是保持了灵活性；你不需要因为数据源的改变而更改代码，因为接口保持不变。这正是列表 1 中的代码所做的。`cpChunks()` 函数在复制完每个数据块后向通道发送一个百分比值，表示已复制字节数占总数的比例。


    为了让 Go 程序员能够汇聚许多库，接受标准的 `Reader` 和 `Writer` 接口。库函数期望调用者传递一个 `Reader` 对象的指针，然后使用
    `Read()` 逐块地从中提取数据。`Reader/Writer` 接口在数据上构建了抽象，无论其来源是 Web 服务器的 JSON 流，还是通过文件描述符读取的本地文件系统块。


    作者

    Mike Schilli 在加州旧金山湾地区担任软件工程师。在他自 1997 年以来运行的专栏中，他每月研究 Go 设计：各种编程语言的实际应用。如果你通过
    mschilli@perlmeister.com 邮件他，他乐意回答任何问题。


    ## Go 设计：Reader/Writer


    列表 1: cpchunks.go


    ```go

    01 package main

    02 import

    03 (

    04  "bufio"

    05  "io"

    06  "os"

    07 )

    08

    09 func cpChunks(src, dst string, percent chan<- int) error {

    10  total := 0

    11  data := make([]byte, 4*1024*1024)

    12

    13  in, err := os.Open(src)

    14  if err != nil {

    15    return err

    16  }

    17  defer in.Close()

    18  reader := bufio.NewReader(in)

    19

    20  out, err := os.OpenFile(dst, os.O_WRONLY, 0644)

    21  if err != nil {

    22    return err

    23  }

    24  defer out.Close()

    25  writer := bufio.NewWriter(out)

    26

    27  defer out.Close()

    28

    29  for {

    30    count, err := reader.Read(data)

    31    total += count

    32    data = data[:count]

    33

    34    if err == io.EOF {

    35      break

    36    } else if err != nil {

    37      return err

    38    }

    39

    40    _, err = writer.Write(data)

    41    if err != nil {

    42      return err

    43    }

    44  }

    45  fi, err := in.Stat()

    46  if err != nil {

    47    return err

    48  }

    49

    50  percent <- int(int64(total) * int64(100) / fi.Size())

    51  return nil

    52 }

    ```


