- md: "\nup the Raspberry Pi system and prepare to access the individual speaker drivers\
    \ with the two stereo channels of the Amp2, you need plugins. They do the filtering\
    \ work for certain frequencies so that the player routes the high frequencies\
    \ to the tweeter and the low frequencies to the midrange driver.\n\n# First Start\n\
    \nNow remove the SD card from the card and switch on the system. After starting\
    \ the Raspberry Pi, piCorePlayer should be accessible over a web interface (Figure\
    \ 5) to use SlimServer [5] (formerly known as Logitech Media Server) because the\
    \ software is initially the easiest to set up. I chose the Linux Audio Developers\
    \ Plugin API (LADSPA) plugins by Richard Taylor [8]. You can discover the IP address\
    \ from the web front end of your WiFi router or with arp-scan:\n\n`sudo arp-scan\
    \ --localnet | grep Raspberry`\n\nAgain, the focus is on free (i.e., open) software.\
    \ Furthermore, you will want a centralized server with simple clients as playback\
    \ devices, with multiroom and speaker synchronization. As tinycore loads everything\
    \ into RAM on boot; the system is built out of different port, expandability with\
    \ plugins (e.g., many extensions set for Internet radio), and of course support\
    \ ZIPs that contain the files for streaming services. All loaded extensions are\
    \ merged into one filesystem in the RAM on which every time the system is running.\
    \ Most components of SlimServer provides most functions. Some of them require\
    \ are already prepackaged and can be downloaded as an extension; however, I used\
    \ a server installed in a Docker container on a NAS system. The server itself\
    \ is very easy to set up; you can find numerous instructions and how-tos on the\
    \ web [6].\n\nFirst, switch to Advanced Mode at the bottom. Then do the following:\n\
    \n- Update the player under Main Page | Full Update for the piCorePlayer used\
    \ in this project. The speaker can optionally be operated as a SlimServer, but\
    \ to do this, you would have to configure the function.\n- Update the extensions\
    \ under Main Page / Update, though quick to accomplish, it requires a running\
    \ player or a cross-connection in the (see the “First Start” section).\n- Check\
    \ for possible hotfixes under Main Page / HotFix. You will find a version that\
    \ I built myself in the download area.\n\nI will not be looking into setting up\
    \ the server, but instead cover setting up the speakers.\n\nSecond, go to the\
    \ Squeezelite Settings tab and set Amp2 as the audio output device, which appears\
    \ as HiFiBerry DAC+ (and Pro, AMP2). After a restart,\n\nFor the loudspeakers,\
    \ I decided to go for piCorePlayer [7]. The software is simple to set up, is easy\
    \ to expand, and runs on the Raspberry Pi. Start by downloading the image of the\
    \ current piCorePlayer and write the image to the SD card. Now flip the Card control\
    \ switch to disable the Raspberry Pi’s internal sound card.\n\n# OCTOBER 2020\n\
    # ISSUE 239\n# LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\n\n# piCorePlayer\n#\
    \ SQUEEZE AUDIO DEVICE\n\nMain CorePlayer functions\n- Squeeze is running\n- Restart\
    \ Squeeze with new settings\n- Update Squeeze Extensions\n- Install MP3 Libraries\
    \ for Squeeze\n- Go to Bluetooth page\n- Reload CorePlayer\n- Go to Diagnostics\
    \ page\n- Stop Squeeze\n\nAdditional functions\n- Stop Squeeze\n\n# Rasp Pi Symfonisk\
    \ MAKERSPACE\n\nspeaker console. To do this, connect to the speaker’s IP address\
    \ over SSH. By default, the system uses `tc` as the user and `piCore` (case sensitive)\
    \ as the password.\n\nFor the crossover (i.e., the treble and bass filters), you\
    \ have to edit the `/etc/asound.conf` file as shown in Listing 1. The only editor\
    \ the system comes with is the legacy Vi, which although outstanding in performance\
    \ is not completely intuitive. Beginners can learn the most important commands\
    \ in an old Linux Magazine article [12].\n\nThe configuration shown here creates\
    \ a chain of filters that is sent to the hardware over the equalizer and crossover.\
    \ The entry in `pcm.!default` redirects the default device to the plungequal equalizer.\
    \ Below you will find the equalizer settings in `pcm.plugequal` and `pcm.equal`.\n\
    \nThe `pcm.crossover` section integrates the plugins developed by Richard Taylor\
    \ that split the stereo signal into four channels: two channels (left and right)\
    \ above 3000Hz and two channels below 3000Hz.\n\nFigure 4: You have to copy the\
    \ plugin built for the piCorePlayer manually to `/etc/optional/` on the PCP_ROOT\
    \ partition.\n\nThe system then mixes the four channels into two mono channels,\
    \ one above 3000Hz and one below 3000Hz. The system then distributes these to\
    \ the tweeter and midrange drivers. The 3000Hz limit was purely empirical selection\
    \ – exact specifications can also influence the overall sound.\n\n# Setting Up\
    \ the Equalizer\n\nTo adjust the sound, use the integrated equalizer. To configure\
    \ it, connect to the speaker over SSH. Next, start the mixer by typing `alsixer`\
    \ and select the frequency ranges with the left and right arrow keys, press Esc\
    \ to exit.\n\nYou have now completed the basic configuration. The speaker should\
    \ work. However, it will still sound a little strange. The correct setting is\
    \ partly a matter of the location of the speaker. However, it is important to\
    \ note that, often, less is more.\n\n# Configuring the Drivers\n\nFor the following\
    \ settings, in the Squeezelite Settings tab, enter the name of the speaker (e.g.,\
    \ Room) and the IP address of the Media Server. Finally, turn on the ALSA Equalizer.\n\
    \nListing 1: Adjusted asound.conf\n```conf\n# default - Generated by piCorePlayer\n\
    .!default {\n    type plug\n    input.bindings.1 \"Input\"\n    output.bindings.3\
    \ \"Output\"\n    slave.pcm \"plugequal\"\n}\n\n2 {\n    type hw\n    card 0\n\
    \    input.bindings.0 \"Input\"\n    output.bindings.4 \"Output\"\n    slave.pcm\
    \ \"hw:1,0\"\n}\n\n3 {\n    type hw\n    card 1\n    input.bindings.1 \"Input\"\
    \n    output.bindings.5 \"Output\"\n    slave.pcm \"plug:crossover\";\n}\n\n4\
    \ {\n    type equal;\n    input.bindings.1 \"Input\"\n    output.bindings.3 \"\
    Output\"\n    library \"/usr/local/lib/ladspa/caps.so\"\n    controls { 3000 }\n\
    }\n\n5 {\n    type equal;\n    input.bindings.1 \"Input\"\n    output.bindings.5\
    \ \"Output\"\n    library \"/usr/local/lib/ladspa/caps.so\"\n    controls { 3000\
    \ }\n}\n```\n[/content]\n[content]\nup the Raspberry Pi system and prepare to\
