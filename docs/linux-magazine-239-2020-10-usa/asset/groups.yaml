    # 回顾


    Red Hat Enterprise Linux 8.2


    # 内核中更多 eBPF


    内核集成的 eBPF 虚拟机在 Linux RHEL 8.2 内内核中起着作用。该发行版支持三个依赖 eBPF 的组件：流控制传输协议（SCTP）和数据报拥塞控制协议（DCCP）。


    BPF 编译器集合（BCC）允许基于 eBPF 构建各种程序。同时，BCC 还拥有审计工具，用于监控 Linux 系统的性能和数据吞吐量。由于 ohmplugin
    工具get，BCC 支持 REST 接口。


