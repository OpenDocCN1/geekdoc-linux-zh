    ## #238/2020年9月

    # 加速你的系统


    如果你的系统运行在峰值性能，你的 Linux 体验将流畅得多。本月，我们关注一些及时的调优技术，包括内核新的压力停滞信息（PSI）功能。


    光盘包含：Bodhi Linux 5.1 和 openSUSE Leap 15.2


    ## #237/2020年8月

    # 摄像头与 Linux


    本月，我们探索了摄像头、屏幕录制以及一个酷炫的提词器工具。我们还查看了 PHP 构建模块、基于 HTML5 的无客户端远程访问工具 Guacamole，以及对实用的
    MystiQ 音频/视频转换工具的研究。


    光盘包含：Ubuntu Studio 20.04 和 Ubuntu 20.04


    ## #236/2020年7月

    # 更智能的目录


    全球计算机系统中使用的嵌套文件和目录的僵化结构创建于 60 多年前，专家认为我们可以做得更好。本月，你将学习一些用于 Linux 中进行语义文件标记的脚本。


    光盘包含：Fedora Workstation 32 和 Ubuntu “Focal Fossa” Desktop 20.04 LTS


    ## #235/2020年6月

    # Systemd 的新变化


    Systemd 是一个不断带来惊喜的谜。现在，这个领先的 Linux init 系统的新功能将改变你对用户主目录的认知。本月，我们将仔细研究 systemd-homed。


    光盘包含：Knoppix 8.6.1 和 OpenMandriva Lx Plasma 4.1


    ## #234/2020年5月

    # 边缘计算


    “边缘”（Edge）是科技新闻中的热门词汇，但它到底意味着什么？我们向你介绍一种可能改变我们对云端认知的兴奋新技术。


    光盘包含：Manjaro 19.02 Gnome 版和 SystemRescueCd 6.1


    ## #233/2020年4月

    # 传输到你的电视


    计算机与电视之间的界限早已模糊，但新的工具和新想法层出不穷。本月，我们重点介绍了 Linux 中一些创新的媒体应用，包括 Gnome Cast for TV
    和易用的 Serviio 媒体服务器。


