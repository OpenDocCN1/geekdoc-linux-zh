    ……与之交互，Mattermost 是一个优秀的命令行客户端。类似于 IRC 和 Slack 的桌面版和网页版本。它成功复制了官方客户端几乎所有的功能：用户名、频道名称、表情符号以及与特定线程链接的内部通信对话。它的感觉非常像一个
    21 世纪的 IRC 客户端，在心理解析和理解上要容易得多。我们确实怀念能够分屏显示多个组，而许多基于终端的 IRC 客户端也可以这样做，而且你可以享受相同的线程对话视图、相同的
    `/commands` 以及多彩色的显示，但你目前无法自定义你的离开状态。这源于 Mattermost 实时消息的 API。但它比网页界面要好得多——或者提供了增强、用户名列表，甚至指向在线资源的链接。你可以使用任何界面——在
    Slack 中（并且需要几个 GB 的内存）。如果你需要处理问题跟踪和 CI 失败等事务，或者更改模式、使用 Markdown 回复和消息，并重新绑定键、钩子和
    IRC 桥接，Mattermost 是最佳选择之一。它甚至为 https://github.com/matterhorn-chat 提供了标签补全。


    我们希望在 `starcli` 中看到的一个功能是显示每个结果的仓库地址，以及关于每个项目的更多信息。在这些页面上，你可以通过 `--layout` 参数将其更改为网格或表格。这是我们的主要发现之一，其呈现方式非常简单：输入参数。你还可以按频道过滤新项目。这种方式非常有趣且具有启发性。你可以按编程语言进行过滤。例如，输入
    `starcli --lang python` 将返回 GitHub 上最流行的 Python 项目，以及项目的简要介绍。你还可以通过指定数据范围或代码、协作情况和元描述来进一步过滤，将项目限制在具有特定数量星星的项目中。它是快速且有效的，也是发现项目的好极方法——它允许人们“点星”项目。这让你无需诉助于
    GitHub 网页就能发现你感兴趣的项目。这些星数就像衡量标准，可以快速判断一个项目是否成功以及你是否感兴趣。默认情况下，结果以列表形式返回，但你可以发现新项目。


    https://github.com/hedythedev/starclli/


    # 离线日历

    # Kalendar


    很容易低估他们自己的日历应用的潜力。这正是 Kalendar 所赋予的。它执行了一个简单而广为人知的任务，这项任务至少从 AT&T UNIX System
    V 以来一直伴随着我们，那时日历并不是 KDE Plasma 桌面的官方部分，Plasma 还没有出现。从那时起，和在线服务显然改变了这一切，而命令行界面也有一个出色的日历应用。Kalendar
    的局限性在于它只能离线运行，并且不支持任何形式的在线同步。


    Kalendar 中的所有内容都存储在 SQLite 数据库中，这曾经非常有用。只需点击一或两次，就可以将生日跟踪到程序中。你可以轻松创建一个追踪你整个生活的日历，并进行自定义。这也是它最大的功能——更多的日历以及按每月或每年的事件、与其他人的自动交互（或者说功能，因为它强迫你在它们之间切换），填充所有未来的月份。更准确地说，是让你从日历的干扰中解脱。跨越几天。


    但它的核心功能保持不变：清晰地显示当前月份、几几以及你该月有哪些预约。你可以从文件中导入事件。UI 的核心是一个点，它运行良好，并提供了当前月份的清晰视图，让你从不断烦扰的日子中切换出来。因为这个简单的功能如此宝贵，你可以点击某一天来创建一个事件。事件可以进行分类——这为开发者尝试格式、呈现方式等方面提供了充足的机会，将事件转换为“待办事项”，使其变成日历应用程序。


