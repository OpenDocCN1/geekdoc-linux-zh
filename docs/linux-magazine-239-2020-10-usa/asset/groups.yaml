    # 新闻


    内核新闻


    响应 Jason 代码的线程，这种解决方案可以让用户避免黑客式编码。他说：“添加任意的空 asm 语句来绕过它？黑客手段（Hacks）。全内存屏障？黑客手段。”他补充道，“散布空
    asm 语句或全内存屏障应该被像添加 `sleep()` 来‘绕过’并发 bug 一样谨慎对待。红旗。”


    “对我来说，这是一个坚决的‘不’。”


    “1) 除了极少数 Gentoo 用户外，没有人对内核广泛测试 -O3 —— 即使 Gentoo 在内核编译时也默认使用 -O2”


    “2) -O3 会导致代码大量膨胀，这意味着 vmlinux--linux/bzImage 和模块都会变得更大，并且从磁盘加载的速度会变慢”


    Linus 回复道：


    “胡说（BS）。”


    “3) -O3 **并不一定**会让代码运行得更快”


    “编译领域的人可能会称之为‘黑客手段’。但那位编译领域的人是**错的**。”


    “4) 如果 GCC10 为 -O2 优化级别移除了某些操作，你只需要将它们视为编译标志，而不是强制所有人默认使用 -O3。编译器需要多年时间才能为我们提供的所有基础设施，即使如此，编译器实际上也不会真正给我们一切——而且如果你只是让大家都开心，他们就会很快心的。”


    “5) 如果你仍然坚持使用 -O3，我我想给我们两个 KConfig 选项：


    多年来一直使用旧编译器。


    | 选项 | 值 |

    | :--- | :--- |

    | OPTIMIZE_O2 | -O2 |

    | OPTIMIZE_O3_EVEN_MOAR | -O3 |


    “这就是为什么存在内联 asm asm。它们是逃离‘等待编译领域的人为我们解决这个问题’这种过度限制的束缚——反正他们永远不会完全解决的。”


    这就结束了。


    # 针对缺失的规避方案


    # 未来的编译器特性


    这有点像不安全的 C 强制转换，以及允许人们编写‘不可移植代码’。一些编译领域的人会说这不好，不安全。最近——或者也许更准确的术语应该是关于编码风格的技巧注释。当然，它可能是不安全的，但点在于，它允许你做一些在过度限制的语言中并不一定**可能**做的事情。


    这出现在关于哪个 GCC 版本是最好的长期讨论中（即，哪个版本产生的代码、警告和错误最好）。这这一切都是在试图追踪内核 bug 而不经历痛苦的背景下进行的。


    “有时你需要打破规则。”


    “这就是为什么大家都在 C 这种‘不安全’语言中编写库函数的原因。因为你需要那些逃口来真正执行如内存分配器等的操作。”


    Linus Torvalds 最近对编码风格有一些有趣的评论，他提到他开始使用 GCC 10 进行编译。结果，许多开发者想要切换到相同的版本，以确保他们在向他发送补丁时可以看到
    Linus 将看到的相同的构建错误和警告。


    “这也是为什么我们有内联 asm 的原因——因为编译器永远不知道一切，也无法为人们想做的任何事情生成代码。”


    “任何**认为**编译器总是知道更多并应该拥有完全控制权的人都不应该编写编译器。他们应该去”


    Borisislav Petkov 指责那些开发者，说：“噢不，我们不想让 Linus 的内核坏掉。 ;-) 在角落里和朋友们一起吃胶水。”


