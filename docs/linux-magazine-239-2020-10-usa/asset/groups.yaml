    voiced on the Internet about the poor browser, which Microsoft was trying to force
    feed state of the Firefox browser, I just want to state for the record: to the
    world. Since then, the competition has gotten like Firefox. I use it all the time,
    and it does everything I need much better. Chrome has stolen their thunder from
    it do. When I click on a video, it plays. When I click on a Firefox, coming not
    just the leading Microsoft alternative-download link, I get the file. Some reviewers
    say Firefox is “slow” compared to Chrome. I haven''t experienced that. I don''t
    really know how it would perform in a speed test, but it is putting ultra-clunky
    Internet Explorer to rest in favor of the Edge browser. It doesn''t really matter,
    because I get what I click on without spending a lot of time waiting. I keep Enhanced
    Tracking Protection turned on, and I don''t worry quite so much (although as with
