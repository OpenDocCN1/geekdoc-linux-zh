    # 锁定模式 (Lockdown Mode)


    Linux 内核中的某些模块甚至存在了几十年。事实是，各种软件工具已经开始依赖被显式标记为“不安全”的功能。在**完整性模式（integrity mode）**下，内核防止
    root 用户使用加载此类模块的参数。如果 root 用户尝试使用该参数，`/proc/line` 文件中定义了锁定参数，并取决于它是否具有适用锁定模式的值。因此，内核开发人员认为锁定模块加载了不安全的模块，用户将立即看到内核返回的“拒绝访问”（Permission
    Denied）响应。


    ### 锁定模式（续）


    内核开发人员不得不扩展 LSM 以允许系统直接启动到新内核。


    被识别为不安全的 MMIO 操作会被内核阻止，某些使用 `perf` 的方式也是如此。另一个重要事实是：如果系统意外重启，所有警报都应该响。这对于**机密性模式（confidentiality
    mode）**尤为如此。如果机密性模式不适合你的系统，你可以使用完整性模式，它可以防止攻击者有系统地打开安全漏洞。这解释了为什么完整性模式也会全面禁用这些操作。对于移动系统来说也很有趣的是：锁定模式禁用了休眠功能。


    大多数情况下，突然重启是由于硬件设备或驱动程序损坏。但你需要快速明确根源。问题也可能是攻击者在更改引导加载程序后重启了系统。如果你想使用锁定模式，我建议监控系统配置的几个额外因素。

