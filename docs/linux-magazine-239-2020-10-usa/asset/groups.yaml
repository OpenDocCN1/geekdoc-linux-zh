    # 回顾


    发行版巡礼 – Debian 衍生版


    ## Debian 衍生版


    创新的后代


    Debian 的流行不仅在于其发行本身，还在于其衍生的众多衍生版。这些衍生版不仅仅是 Debian 的重新标记版本，它们添加了自己的定制。这里有几个我们认为有趣的。阅读
    Byfield 以了解这些众多 Debian 衍生版的采样。Debian 和 Debian GNU/Linux 本身就是一个非常流行的发行版。


    在 DistroWatch 上，Debian 自 2002 年以来一直位列软件包数量前十名，但衍生版的维护者绝大多数选择与 Fedora 以外的任何其他发行版合作。目前，Ubuntu
    是目前 Debian 最受欢迎的衍生版。在 DistroWatch 上，只有七个发行版基于 Debian Testing。曾几何一段时间，Ubuntu 的人气似乎可能会取代
    Debian，但今天两者是互补的。在 DistroWatch 上，如今的发行版中有七个（总计占比略高于 6%）吸引了新用户以及想要获得更多实践经验的高级用户。


    成为 Debian 衍生版意味着什么？在大多数情况下，衍生意味着对 Debian 仓库的依赖。事实上，在 DistroWatch 活跃发行版中，有四个（64%）基于
    Debian（AMD64, ARM, S390X 和 Power），或其最流行的衍生版 Ubuntu（共十一个），而 Debian 支持 `dpkg` 和
    `apt` 来帮助协调脚本。许多衍生版以及这些子发行版在近年来也依赖 Debian 安装程序，该程序经过移植，使得 Ubuntu 的支持变得容易得多。此外，Ubuntu
    的大部分软件包源自 Debian，保持了与主流 Linux 的兼容性。即使衍生版有自己的安装程序，它通常也会使用主要发行版之一，作为 Debian 安装程序针对中文写系统的简化版本。最常见的元素意味着用户可以轻松地从一个衍生版移动到另一个衍生版，Debian
    的流行并不意外。重要的是，Ubuntu 在其开发早期强调桌面端，使其比 Debian 更易于使用。Debian 一直以严谨著称，使其成为人们快速产生归属感的强有力选择。


    尽管近年来 Ubuntu 侧于服务器，但它早期在桌面上的开发为其赢得了声誉。Debian 维护衍生版意味着某些文件的位置可能与 Fedora 或 Arch
    不同。此外，Ubuntu 的绝大多数软件包源自 Debian，并修改了纯混合发行版（按需要维护它们的发行版）。一个例子是麒麟（Kylin）。


    ## Ubuntu


    近年来，标准 Ubuntu 一直非常活跃。更糟糕的是，它放弃了长期支持的 Unity 系统，转而采用 Gnome 作为桌面。然而，Ubuntu 也支持各种变体，如
    Kubuntu、Lubuntu 和 Xubuntu。它的大多数变体都带有特定的桌面安装，尽管 Ubuntu Studio 专注于多媒体工具。除了制作自己的发行版外，Devuan
    还提倡它所谓的“Init 自由” [14]：即使用除 systemd 外的任何 init 系统启动计算机的权利。在过去的 20 年里，Devuan 支持 System
    V 风格的 init、OpenRC 和 runit。我建议始终手留一个最新版本以备不时。


    ## Devuan


    由于对缺乏民主感到不满，少数开发者创立了 Devuan（可在本月的 DVD [13] 获取），并支持大多数 Linux 兼容硬件。


    ## Linux Mint


    Linux Mint [9] 最广为人知的是 MATE（其对 Gnome 2 的分支）以及 Cinnamon（ Debian 安装程序的高级版本）。


    ## KDE Neon


    2014 年，KDE 开始开发自己的桌面环境，包括重新引入的 Plasma。KDE Neon 是这三个领域最新进展的快照。它是一个基于 Ubuntu 的版本。


    ## Debian Edu/ Skolelinux


    Debian Edu [15] 现在是 2006 年两个衍生版合并的结果：挪威的 Skolelinux 和法国的 Debian Edu。在 SLX Debian
    Labs 的下，Debian Edu 有两个目标：推广自由软件以及确保各地的儿童都能用自己的语言使用计算机。


    ## Trisquel


    Trisquel [11] 是软件编译列表中少数几个 Debian 衍生版之一。自由软件协会自由发行版列表 [12] 中的其他一些并非基于 Debian。


    ## Tails


    Tails [18] 是一个 Debian 衍生版，仅使用 Debian 的稳定（Stable）仓库以确保安全。Tails 从闪存盘、DVD、硬盘分区或虚拟机中运行，其灵感源于依赖非自由软件的软件。Incognito
    是一个同步开发的类似发行版，由 Tor 项目以及 Debian 资助。


    '
