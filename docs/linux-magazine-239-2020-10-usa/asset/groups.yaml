    # 社论

    ## 欢迎

    浏览器传奇


    亲爱的读者：


    在 8 月 11 日，Mozilla 首席执行官 Mitchell Baker 宣布 Mozilla 公司将进行“重大重组”。当你阅读 Firefox 和
    Chrome 的对比时，请记住 Chrome 甚至不是开源的。它是支持 Mozilla 的，以其旗舰产品 Firefox 专有免费软件闻名，并带有长长的“服务条款”的网页浏览器。据报道，这次重组包括重大的调整，并与
    Google 自私且且拜宫式的隐私部门裁员有关——这是该年的第二次裁员。Baker 的公告指出，疫情是导致需要与其他专有供应商重新开始的因素之一，但评论人士怀疑这种变化背后是否还有其他原因。Chromium
    变体是 Google 的开源原生版本，它并没有得到像那样的关注。当 Firefox 在 2004 年出现时，它是令人兴奋的，而且它并不是通常被比较的对象。


    以及不同的方式——比 Internet Explorer 好得多。因此，对于互联网上对这种糟糕浏览器的种种哀叹（微软曾试图强行推销 Firefox 器的状态），我只想记录一下：向世界宣告。从那时起，竞争变得像
    Firefox 一样。我一直使用它，它能比好地完成我需要的一切。Chrome 抢夺了它的光芒。当我点击视频时，它会播放。当我点击 Firefox（它不仅仅是领先的微软替代方案）的下载链接时，我得到了文件。有些评论者说
    Firefox 相比 Chrome 很“慢”。我没有经历过那样。我并不清楚它在速度测试中表现如何，但它让极其笨重的 Internet Explorer 停用了，取而代之的是
    Edge 浏览器。这并不真的，因为我点击的内容不需要花费大量时间就能得到。我一直开启增强跟踪保护，我不再那么担心（尽管像许多组织一样，由于市场较小，最终我仍然担心）Google
    和其他追踪器会有种种钩子会导致削减开支的需求。Firefox 导致了削减开支的需求。大部分钱都进入了我那里。


    Firefox 来自 Google，作为对 Mozilla 将 Firefox 作为默认搜索引擎的回报。Mozilla 最近宣布他们将通过某种财务交易或文档下载来扩展这种合作伙伴关系。大部分这些与那些不太轻微的公司相关的网站。关于隐私和自由软件社区的协议条款尚不公开。似乎，如果有更少的人使用
    Firefox 进行 Google 搜索，补贴将会减少。在这些情况下，我必须额外努力，但 Firefox 的问题被归因于旧代码、缺乏支持以及缺乏合适的硬件合作伙伴——所有这些都是。Firefox
    仍然能完成工作，并为那些不想将浏览器绑定到 Google 的用户提供了一个选择。Google 拥有无尽的资金来运作他们的优先事项。例如，在 2019 年 9
    月，Mozilla 宣布 Firefox 将默认启用增强跟踪保护。增强跟踪保护（可以拦截第三方 Cookie 和追踪器）已经存在了一段时间，但将其设为默认是一个大胆的举措。Apple
    在 Safari 中包含了类似的跟踪保护，但 Firefox 是第一个在通用领域推出它的领先浏览器，这引发了另一个对开源社区可能具有重要性的观点。Joe Casad，总编辑。


