    \n# 深度解析\n\n# 锁定模式 (Lockdown Mode)\n\n使用锁定模式保护 Linux 内核安全\n\n锁起来\n\n锁定模式让你的 Linux\
    \ 系统更加安全，甚至防止 root 用户修改操作系统内核以及重新加载带有新功能的模块。关于这种从激烈争论中产生的解决方案，可以参考 Martin Loschwitz\
    \ 撰写的《Linux 安全模块》（Linux Security Modules）。\n\n“Lockdown”一词目前并没有特别积极的内涵，但在 COVID-19\
    \ 之前，这个词被用于一个非常积极的语境，指的是密不透风的安全。\n\n极其复杂的攻击者甚至可以用自己的模块版本替换核心内核功能，以此故意掩盖踪迹。\n\n\
    # 问题何？\n\n锁定机制试图解决什么问题？在传统的 Linux 系统上，任何拥有 root 权限的人都可以随心所欲。因此，现代计算机尝试在固件侧防御这种攻击。UEFI\
    \ 有一种名为安全启动（Secure Boot）的独立机制，它主要影响启动模式。锁定模式限制了系统用户的权限——包括曾经无所不能的系统管理员（root）。对\
    \ root 账户实施限制对 Unix/Linux 老兵来说可能显得非常奇怪，但安全专家们乐于在我们危险的时代看到这一强大的新功能。\n\n# 很久以前\n\
    \n当 Linus 最终在 2019 年底将锁定补丁整合到官方内核时，许多观察者将锁定模式描述为一项革命性的新功能。但锁定模式并不是发明。事实上，实现该功能的工作花了几乎七年的时间。在大部分时间里，Linux\
    \ 内核开发者一直在争论——有时非常激烈——正确的方法（图 1）。请参见关于如何合理实现锁定的说明框。\n\n图 1：即使在 2018 年年中，开发者们仍在争论\n\
    \n2020 年 10 月第 239 期\n\n![](img/4124af05f4c60b6759782ba44ba4bc7f_286_0.png)\n\n\
    ```bash\n### 黑底白字 (bash) \n# echo integrity > /sys/kernel/security/lockdown\n\
    #\n```\n\n# 深度解析\n\n# 锁定模式\n\n# Linux 安全模块 (LSM)\n\n几年前，当 Linux 内核开发者开始探索在内核中实现额外安全功能的方法时，AppArmor\
    \ 和 SELinux 都使用了 LSM。Linus 在内核中……，他们很快意识到挑战将是支持兼容 LSM 的不同安全技术，具体取决于使用场景。我将在本文稍后为你详细介绍锁定模式的完整性（integrity）和机密性（confidentiality）模式。\n\
    \n通用的 LSM 接口允许其他代码在内核的某些点挂钩并实现安全策略。更棘手的是，还需要确保该解决方案允许不同的发行版继续开发。\n\n在原则上，可以通过调用\
    \ `echo integrity` 或 `confidentiality` 在运行时激活锁定模式。`lockdown` 参数有两个参数：integrity\
    \ 和 confidentiality。\n\n只需在现有参数后添加用逗号分隔的 `lockdown` 和 `yama` 即可。\n"
