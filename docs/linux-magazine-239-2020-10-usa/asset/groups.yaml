  mdcn: '


    # 警告


    在处理设备内部部件时，请注意主板上的电容器，因为即使此时扬声器未连接电源插座，存储的能量也存在电击危险。


    当你在打开外壳工作且扬声器连接到市电时，你必须小心对 230/120V 部分进行适当绝缘并释放卡扣。


    图 2：黑色小卡扣锁定电缆。要将其拉下，你不能接触设置的任何部分。


    66


    2020年10月


    第 239 期


    LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM


    树莓派 Symfonisk MAKERSPACE


    # 外部电源


    调整电源，旋转电源单元上的小型输出端；输出旁边的螺丝完全旋转到另一端即为松开状态。


    作为集成电源的替代方案，可以考虑使用外部电源，例如故障笔记本电脑留下的电源。然而，在这种情况下，需要更改扬声器软件，更改树莓派外壳背部的布线，以便能够从外部访问。


    # 扩展输入


    要进行连接，只需将 HiFiBerry Amp2 插入树莓派。这些板卡不仅通过树莓派的 GPIO 或引脚在断开之前进行通信。通过 GPIO，HiFiBerry
    还提供控制排线，通过一个小盖板固定，在拔出连接外设（如 USB 以太网线，见图 2）的排线之前，你必须用螺丝刀打开它。如果你使用的是 Pi Zero W 而不是
    WH 版本，你首先需要焊接 GPIO 引脚，并且还可以扩展其中一个 USB 端口，这为使用此网适配器提供了可能。


    这里的所有步骤都应该轻松完成并测试功能。虽然操作此网适配器需要一点技巧，但在实践中，它比你想象的要容易。你带有分离组件的外壳就在你面前。


    在 Symfonisk 扬声器的正面，有一排细小的控制按钮。项目的目标之一是确保剩余的播放器不会丢失其原始外观。部件仅通过螺丝固定在外壳上，因此外观完好。因此，此操作的电源拆解相应简单。


    要做到这一点，焊掉旧电缆，连接部分将留在后板上。某些电缆胶在机箱上，但稍加小心即可轻松重新连接。你需要一个针间距为 0.5mm 的 FFC/FPC 10 脚适配器。适配器上有
    10 根扁平线。将重新连接的线连接到背部的插座。适配器带有原始 Sonos 电缆。对于转换过程中所有电缆的长度，使用机箱外的宽度，因此非常容易进行测试和修正。使用万用表测量哪根线提供哪种功能。Sonos
    电缆左侧有小保险丝，然后将所有部分重新装好。建议使用直径大于 1mm 的硬芯铜线，保持平直。如果你使用的是没有提供这些导线的 FPC 适配器，Symfony，由于需要处理
    230V（欧盟、澳洲）或 120V（北美），你可能需要再次拆解树莓派。扩展部分可以用利刀小心地去除。


    # 修改电源


    电源单元（明纬华 HDR-60-15）非常紧凑（且同时支持 230V 和 120V），因此非常适合转换。Symfonisk 似乎没有更改分配。播放/暂停使用一个
    4 欧姆中音驱动器和一个 8 欧姆高音器。（另见“外部电源”。）


    HiFiBerry 建议为他们的 Amp2 树莓派功率放大器使用 18V 60W 3A 的电源。HDR-15 是 15V 电源单元，但具有高达 18V 的调节输出。为了简化你的工作，请使用表
    2 中的信息映射电线。极性并不重要，因为它使用的是交流电。


    外壳插座的焊点应用热缩胶管或热熔胶进行绝缘。接下来，将适配器电源的一个输出端连接到 Amp2 的输入端。如所述，这样你可以立即为树莓派供电。


    # 重新布线


    适配器根据表 2 中的映射将开关线焊接到 Amp2 引脚上，这些线的选择是正确的。总而言之，你只需要一根线以防干扰 Amp2 功能。你需要焊接并注意极性（即以正确的方式连接正负极），且不要使用连接器；否则，扬声器的震动可能会导致连接松动。由于引脚非常非常近，建议用热缩管对单个焊接引脚进行绝缘。


    现在使用原始 Sonos 电缆连接扬声器。你可以只需拔掉 Sonos 扬声器主板的连接器。连接时，必须观察极性：Sonos 电缆在较大的插头上为正极。将每个扬声器连接到立体……


    # 表 2：Sonos 面板映射


    | 适配器 | 功能 | 树莓派 Header 引脚 | GPIO 编号 |

    | :--- | :--- | :--- | :--- |

    | + 1 | 播放/暂停 | 23 | 11 |

    | + 2 | 播放/暂停 | 23 | 11 |

    | + 3 | 绿色 LED | 16 | 23 |

    | + 4 | 红色 LED | 18 | 24 |

    | + 5 | GND | 20 | 20 |

    | + 6 | 黄色 LED | 22 | 25 |

    | + 7 | GND | 20 | 20 |

    | + 8 | 白色 LED | 15 | 22 |

    | + 9 | + | 21 | 9 |

    | + 10 | - | 19 | 1 |


