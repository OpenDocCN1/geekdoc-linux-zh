    该功能在 Linux 5.4 中进入内核，即锁定模式（lockdown mode）。在 2020 年 6 月，这种模式对于由 root 加载的现在已包含在许多桌面系统的
    Linux 中。例如，当 ACPI 项目中的漏洞最终导致安全术语变得毫无意义时。然而，企业级发行版允许内核代码绕过 UEFI 安全启动接口——例如 UEFI。


    基于组件的安全活动略显落后。在编写本文时，Ubuntu 20.04 LTS 是唯一一个企业级发行版且已通过锁定模块（lockdown module）。


    锁定模式让所有管理员非常清楚地意识到，内核应该使用官方的锁定模式。锁定模式绝非仅仅是在特殊场景下提供额外安全性的抽象安全特性。在 RHEL 系统上，该功能尚不可用；但预计
    Red Hat 将在未来的 RHEL 8 版本中提供补丁。SUSE 也计划提供补丁。


    难以相信的是，在 2020 年，仍然有谈论安全内部和外部网络的安全概念。在七多年后，首席开发人员 Matthew Garrett 成功地将一项切实的功能集成到
    Linux 内核中，该功能可以直接并衡量系统的安全性。一旦攻击者获得了系统未授权的 root 权限，几乎所有的安全措施都是致命无效的。[1] Matthew
    J. Garrett 关于锁定模式的文章立即提供了实质性的改进-[1]。内核开发人员巧妙地通过锁定的形式提交了补丁来阻止这一点：https://mjg59.dreamwidth.org/55105.html。


    # 深度解析


    ## 查找进程


    ### 按启动时间查找进程


    Ghost Hunter


    如何通过启动时间查找 Linux 系统上运行的进程？这个问题听起来很平凡，但答案比表面看起来要复杂。作者：Axel Beckert 和 Frank Hofmann。本文比较了使用
    Bash、Python、Perl 脚本以及 Go 编程语言的若干种潜在解决方案。作为一个计算集群 [1] 的维护者，Frank 还为他的用户提供了基于公平使用原则的计算商业软件。该软件提供有限的许可证密钥（例如，MATLAB
    [2] 仿真软件提供10 个密钥）。其中某些计算可能耗时一周。当计算完成且进程终止时，许可证密钥会自动返回空闲密钥池，并供另一个用户获取。然而，如果用户忘记结束进程，由于所有密钥都已分配，将无法再发放密钥。


    我们的目标是找到一种解决方案，能够检测仍在运行且启动至少在 10 天之前的进程，然后以排序后的列表输出结果。


    - 你必须设置 `LC_TIME` 环境变量以确保本地月份名称不会突然出现（`env LC_TIME=C`）。

    - 日期在单数字前有额外的空格。为了排序，你必须使用 `sed` 参数将其替换为零（列表 1 中的第 5-6 行）。

    - 输出还将包含用户的登录名或用户 ID、PID、执行的程序以及相应进程开始的时间。

    - 启动日期包含字母月份而非数字；你必须将其转换为数字。这可以通过内置工具完成。对于第 7-18 行所示的基于 Bash 的解决方案，你需要旧的 `procps
    3.3.0` 版本或更高版本（早期版本缺乏此处使用的一些功能）。

    - 日期组件的顺序是：早于 10 天的日期。如果发现发现不适合排序的项（例如第一个月份、符合此标准的进程），他们可以使用 Bash 来明确对该进程应该发生什么。第一个显而易见的解决方案是基于
    `ps` 命令并结合四个组件：`awk`、`date`、`sed` 和 `sort`。


    Linux 内核管理进程。`ps` 支持输出字段 `lstart`，它将进程的启动时间（和日期）以统一的长格式列出。`/proc` 文件系统对用户可用可用。在命令行中，`ps`
    是进程管理的可靠接口。


    遗憾的是，`ps` 最初有几十个选项，特别是因为它还可以根据相对规格计算数据，而且它的输出通常也不清晰。这可以通过一点努力来解决。虽然发现并实现组合解决方案（列表
    1）很快，但解析 shell 代码或可能的脚本语言使其变得相对难以读懂且相当孤立。我们在该解决方案中遇到了以下问题：


    - “现在起 10 天前”的规格通过调用 `date -d ''now -10 days''` 返回。此日期告诉你自进程启动以来的秒数，在 `sort` 调用中减少了进程数量，显著增加了复杂性，因为你必须指定包括日期在内的所有字段，而可以非常灵活地格式化输出。

    - 如果在调用脚本时不指定任何参数，它将显示所有大于 10 天的进程。这缩短了命令，使其可以用单行编写。列表 4 返回了所有超过两天的进程。

    - 所有进程都在同一秒内启动，在 `sort` 中识别出的进程号是从头开始重新分配的。

    - 所有数字字段必须在 `sort` 中显式指定；否则 `sort` 将仅将第一个字段视为数字。


    然而，这种变体也适用于长时间，尽管其限制是 65,535 个进程，但现在列表 1 的输出在没有一秒精度限制的情况下，Linux 也可以处理更大的进程 ID
    (PID)，这很明显，因为 PID 1 并没有出现在列表的开头。这可以通过读取 `sort` 的输出来修复。


    列表 1：第一次尝试

    ```bash

    #!/bin/sh

    if [ -n $1 ]; then limit=$1; else limit=10; fi

    date="$(date ''+%Y %m %d %T'' -d "now -$limit days")

    env LC_TIME=C ps -eahx pid,lstart,user,cmd |

    sed -e ''s/^//'' |

    awk -v d="$date" ''$1 < d'' |

    sort -k2,2 -k3,3 -k4,4 -k5,5 -k6,6 -k7,7

    ```


    列表 3：排序输出

    ```bash

    $ ./list-processes.sh | head

    2020 04 03 22:32:34 1 root init

    2020 04 03 22:32:34 2 root kthreadd

    2020 04 03 22:32:34 3 root [rcu_gp]

    2020 04 03 22:32:34 4 root [rcu_par_gp]

    2020 04 03 22:32:34 6 root [kworker/0:H-kblockd]

    2020 04 03 22:32:34 9 root [mm_percpu_wq]

    2020 04 03 22:32:34 10 root [ksoftirqd/0]

    2020 04 03 22:32:34 11 root [rcu_sched]

    2020 04 03 22:32:34 12 root [migration/0]

    ```

