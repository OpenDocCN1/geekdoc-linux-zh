    # 快速上手 Linux


    ![](img/4124af05f4c60b6759782ba44ba4bc7f_29_0.png)


    想让你的朋友和同事也切换到 Linux 吗？

    本期将向新手展示如何：


    - 安装 Linux

    - 为你的 Linux 系统下载并安装免费软件

    - 玩游戏

    - 创建文档和电子表格

    - 处理照片

    - 播放音乐和视频

    - 以及更多！


    在线购买：shop.linuxnewmedia.com/specials


    ![](img/4124af05f4c60b6759782ba44ba4bc7f_30_0.png)


    # 新闻


    技术、趋势和工具的更新


    ## 本月新闻


    - 08 • LibreOffice 7 现已发布

    - 微软将 Procmon 引入 Linux

    - 09 • 新版 KDE Slimbook LibreOffice 7 现已发布


    最流行的开源办公套件 LibreOffice 的主版本现已作为收敛包（Convergence Package）提供下载。新版本包含了整个套件的众多改进。虽然大多数用户不会察觉到明显的差异，但文件兼容性得到了大量改进，这将极大地提升
    LibreOffice 与与其他套件之间的互操作性。


    ## 10 • Flutter 即将登陆 Linux


    - • SUSE 推出


    第一个重大兼容性改进是 LibreOffice 包含了对 SLE ODF 1.3 服务包 2 的支持。随此更新一同而来的还包括文档的数字签名，以及基于 Open-PGP
    的 XML 文档加密。


    通过 LibreOffice 对 DOCX、XLSX 和 PPTX 文件的处理，MS Office 的兼容性得到了提高。在这一新版本中，DOCX 文件现在以原生
    2013/2016/2019 模式保存（而不是过时的 2007 兼容模式）。同样，现在还支持长度超过 31 个字符的 XLSX 表格名称，以及 XLSX 中复选框的导出。


    特定工具的改进包括：Writer 支持半透明文本，并改进了对引号和撇号的处理；Calc 引入了非易失性随机数生成的新功能以及自动求和的快捷键；Draw 支持半透明文本、下标恢复默认的
    8%，并可以生成大于 500 cm 的 PDF。


    整个套件的新功能包括：


    - • Skia 图形引擎和基于 Vulkan 的 GPU 加速。

    - 新的图标主题。

    - 新的形状库。

    - 对象的发光和软边缘效果。


    有关此版本的更多信息，请阅读 LibreOffice 官方公告（https://blog.documentfoundation.org/blog/2020/08/05/announcement-of-libreoffice-7-0/）。


    ## 微软将 Procmon 引入 Linux


    微软进程监视工具已登陆 Linux。Process Monitor（也称为 Procmon）是该工具针对 Linux 系统的重新设计版本。对于那些用过 Procmon
    的人来说，你们知道这是一个查看实时文件系统活动的便捷工具。对于开发者来说，Procmon 能够轻松追踪给定系统上的系统调用（syscall）活动。Procmon
    还支持将信息记录到文件中（以便稍后分析数据），具有高度可性，支持非破坏性过滤器、捕捉线程栈和进程详情以及启动日志。


    尽管将 Procmon 引入 Linux 对普通 Linux 桌面用户来说可能并不令人兴奋，但对于开发者来说，Procmon 可能会是一个严重的游戏改变者。


    目前，Procmon 仅限于运行内核在 4.18 到 5.3 之间的 Ubuntu 18.04 系统。你还需要大于等于 3.1 的 cmake 以及大于等于
    3.22 的 libsqlite3-dev。微软计划在后续版本中添加更多配置，因此请关注即将支持更广泛的发行版。


    # 更多在线资源


    要确切如何在支持的系统上构建 Procmon，请访问项目的官方 GitHub 页面（https://github.com/microsoft/ProcMon-for-Linux）。


    # ADMIN HPC


    http://www.admin-magazine.com/HPC/


    ## 新版 KDE Slimbook 已发布


    各地的 Linux 粉丝现在拥有比以往任何时候更多的选择。随着特定发行版的笔记本电脑层出不穷，桌面得到同样对待只是时间问题。因此当 KDE Slimbook
    问世时，它不仅是第一款专注于 KDE 桌面环境的笔记本，而且是一个精良的美品。


    随着 AMD Ryzen CPU 的兴起，KDE Slimbook 的制造商（https://kde.slimbook.es/）将笔记本迁移到 AMD 处理器是完全合理的。


    这款新笔记本轻松进入 Ultrabook 类别。其镁合金外壳厚度小于 20 毫米，配备 14.1 英寸或 15.6 英寸显示屏，重量最高仅 1.1 kg（14.1
    英寸版）和 1.5 kg（15.6 英寸版）。显示屏为高清 IPS LED 面板，覆盖 sRGB 范围的 100%，因此色彩非常准确。


    至于 CPU，新的 Slimbook 配备 AMD Ryzen 7 4800 H 处理器（包含 8 核16 线程以及高达 64GB 频率为 3200 MHz
    的 DDR4 RAM），这使得 KDE Slimbook Ryzen 版本成为 Linux 预装笔记本电脑中的首次。


    KDE Slimbook 包含 3 个 USB 端口、一个 USB-C 端口、一个 HDMI 插口、一个 RJ45 网络端口并支持新的 WiFi 6 标准。14
    寸机型起 899 欧元（约 1063 美元），15 英寸机型起 929 欧元（约 1099 美元）。你可以从在线商店购买 KDE Slimbook：https://slimbook.es/en/store/slimbook-kde。


    # ADMIN Online


    - Jeff Layton

    - Petros Koutoupnis

    - Rainer W. Gerling

    - Mayank Sharma


    使用 CacheFS 进行缓存

    对于读取密集型工作负载，CacheFS 是 NFS 和 AFS 的极佳缓存机制。


    构建虚拟 NVMe 驱动器

    一种经济且高性能的混合 NVMe SSD 被导出到宿主机服务器，作为本地连接的 NVMe 设备。


    解决加密 DNS 的安全问题

    DNS 加密为 WiFi 用户在公共场所提供了良好的保护；但在 Linux 企业环境中，它阻止了对域名解析的评估和过滤。


    采访 MariaDB 基金会主席 Eric Herman

    MariaDB 基金会主席 Eric Herman 阐明了最受欢迎且广泛使用的数据库之一的守护者不断演变的重心。


