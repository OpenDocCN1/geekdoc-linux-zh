    Trisquel 是一种基于 Ubuntu 的通用发行版，默认使用 MATE 桌面环境和 Gnome 技术。它首次于 2004 年发布，面向教育和创意。虽然在数量上较少，但
    Trisquel 在普及度上占有一席之地。许多教育软件面向低年级学生，包括学习字母表和分数的应用、Amazing、电子邮件和新闻订阅。此外还包含了一些用于几何和图表分析等专业领域的工具。


    此外，Trisquel 拥有超过 50 个用于匿名文件共享的本地工具。大多数用户可能想要标准版（Standard）或网络安装版（Net Install），但对于更高级的学生，还有针对旧机器和有限资源的
    Mini 版本，以及针对儿童的 Sugar Toast 版本，同时所有学生都能从象棋和打字导师软件中受益。也许 Trisquel 中最重要的工具是 Tor，它允许匿名浏览并阻止非匿名的入流量。对于那些希望系统没有任何专有应用程序或固件中二进制块（binary
    blobs）的人来说，Trisquel 是一个领先的选择。所有这些工具都需要时间来配置。


    然而，Tails 的文档消除了对先验知识的需求。因此，几乎任何人都可以在几小时内拥有一个受良好保护的系统。


    # Knoppix

    Knoppix [16] 于 2000 年 9 月创立并以其开发者 Klaus Knopper 命名，是最老的 Debian 衍生版之一。


    # Devuan

    systemd 的采用在 Linux 开发者之间引发了激烈的辩论。这种辩论在 Debian 中尤为激烈。它可以安装到硬盘上，但最初的设计目的是用于系统救援的
    Live 光盘，这仍然是它的主要用途。CD 和 DVD


    # elementary OS

    elementary OS [19] 的首页（其贡献者以严谨著称）将其描述为“快速、开源且尊重隐私的 Windows 和 macOS 替代品”。然而，elementary
    OS 作为近期关注美学的发行版的领先代表而为人所知。


    # 测评

    Distro Walk – Debian 衍生版


    在几十年后，某个 Linux 发行版占据主导地位似乎是不可避免的。这并不意味着 Debian 能够作为创新者的上游源来重塑自己。但事实是，它基于 Ubuntu，却配备了深度修改的
    Gnome 桌面，拥有自己的窗口管理器、程序栏、邮件客户端和桌面实用程序。其结果经常与 macOS 或类似的 deepin 和 Zorin 等 Debian
    衍生版相比较，这些系统同样强调行为和功能性的桌面。传统上，Linux 桌面上的美学被忽视而转而追求功能，但 elementary OS 深受许多用户的青睐。然而，它的有效性有时是以定制化更少为代价的。潜在用户应该意识到，尽管结构简单以鼓励下载，但输入零支付即可免费下载
    elementary OS。


