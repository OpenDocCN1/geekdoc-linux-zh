- md: "\nThe first step in installing hub is to make sure that First and foremost,\
    \ it saves you time by letting you've got the correct version of Git. At the clone\
    \ or create GitHub private repositories from your command line, run the following\
    \ command:\n\n```bash\n$ git --version\n```\n\nBecause hub also makes use of the\
    \ power inherent in the command line, you can also use it to automate repetitive\
    \ tasks.\n\nThis article describes the benefits of hub. I'll take you through\
    \ the basics of using it.\n\nThis command will return your Git version. In order\
    \ to give you an example of what hub can do, and to use hub, the version must\
    \ be 1.7.3 or newer. If Git is missing, or if you have an older version, don't\
    \ worry: You can easily install a new version. One of Advantages of hub\n\nthe\
    \ most popular (and, to my mind, the best) ways to install it is to use Homebrew\
    \ [4], an open-source package manager, but you used by GitHub is not a bad system.\
    \ It allows lows beginners to start using GitHub easily, and but you can also\
    \ use the package manager for advanced users, it offers a good selection of automated\
    \ tools and an intuitive way to complete most common tasks. To install brew, the\
    \ command-line utility for Homebrew, enter the following command:\n\n```bash\n\
    $ /bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)\"\
    \n```\n\nThis command will install to ~/.linuxbrew, but your workflow Hub provides\
    \ these benefits, although you sudo the command if you want to change this.\n\n\
    Now you can install hub using brew:\n\n```bash\n$ brew install hub\n```\n\nallowing\
    \ you to do anything you can with a command line interface – from wildcards to\
    \ scripting – and giving you all of this functionality in GitHub. For users who\
    \ are accustomed to working at the command line, hub is simply faster than working\
    \ with the GitHub GUI – at least for complicated projects. But keep in mind that\
    \ hub is intended for advanced users. If you're new to GitHub, it is a good idea\
    \ to become familiar with the GitHub basics before jumping into hub.\n\nYou can\
    \ then do a sanity check by looking for the version of hub you have installed:\n\
    \n```bash\n$ hub version\n```\n\n```bash\ngit version 2.25.0\n```\n\n```bash\n\
    hub version 2.14.1 #\n```\n\n## Before You Begin\n\nHub integrates directly with\
    \ your GitHub account, so it poses a potential security risk. This risk is relatively,\
    \ and most developers who wish to use it low. Now that you have working version\
    \ of hub, I'll introduce you to some of the basic functions.\n\nWhen you get started,\
    \ you'll likely want to create a new repo on GitHub. To do that, navigate to any\
    \ folder where you want to initialize Git: and where you created a Git repo. Then\
    \ run:\n\n```bash\n$ cd Documents\n```\n\n```bash\n$ mkdir Test; cd Test/\n```\n\
    \n```bash\n$ git init\n```\n\n```bash\n$ git commit -m 'Adding a test file'\n\
    ```\n\n```\n[master (root-commit) 07035c94e038] Adding a test file\nInitialized\
    \ empty Git repository in /Users/SudeshnaSur/Test/.git/\n1 file changed, 1 insertion(+)\n\
    create mode 100644 test.txt\n```\n\nHub has now initialized a GitHub repository\
    \ for you, but at the moment, it's empty because Git only sees files that have\
    \ recently been changed.\n\n```bash\n$ git status\nOn branch master\nnothing to\
    \ commit, working tree clean\n```\n\nSo now, place any file inside your new repo,\
    \ and add some text to it using echo:\n\n```bash\n$ echo \"Hello\" > test.txt\n\
    ```\n\nAnd that is all: You've now initialized a repo, made a change, and committed\
    \ it. The change will appear in the repo against your email address. This is the\
    \ basic process of working with hub, and you'll quickly see that it's far faster\
    \ than working with the GitHub GUI directly. Next, check the git status, and you'll\
    \ see that, as per right now, there are no commits:\n\n```bash\n$ git status\n\
    On branch master\nNo commits yet\nUntracked files:\n  test.txt\n```\n\n## Going\
    \ Started\n\nUp until this point, you've used hub to complete tasks that you could\
    \ have done easily on the GitHub GUI. However, as just a little taste of the present\
    \ more advanced features of hub, I'll show you how to automatically create a new\
    \ GitHub repo from the local system.\n\nNext, run git add:\n\n```bash\n$ git add\
    \ .\n```\n\nIf you run hub create, hub automatically create a new repo on GitHub\
    \ with the same name as the current directory on your local system: By using this\
    \ command, you have now staged the changes but not yet committed them. In order\
    \ to commit the changes, you'll need a GitHub account. If you don't already have\
    \ a GitHub account, you can create one using this step-by-step guide [5].\n\n\
    Now you need to tell your local version of Git to use your account, so you'll\
    \ need to provide it with your account's username and email address. These details\
    \ will be contained in every commit message you add to any repo, so that anyone\
    \ else looking at the code can see that you are the author. To add these details\
    \ to your local version of Git, run the following:\n\n```bash\n$ git remote -v\n\
    ```\n\n```\norigin git@github.com:YourRepo/Test.git (fetch)\norigin git@github.com:YourRepo/Test.git\
    \ (push)\n```\n\nEven better, using the following command will link your repository\
    \ with the remote mirror:\n\n## Going Further\n\n## Everyday Tasks\n\nMost of\
    \ the basic tasks that use GitHub can now be done straight from the command line.\
    \ These tasks include cloning or creating repositories, browsing projects, listing\
    \ issues, or just staying up date with projects. If you're worried about sending\
    \ your email address to everyone who has access to a particular repo, there's\
    \ a feature to hide it. You can just set your email address to your GitHub credentials\
    \ [6], in order that other users only see your email address. To clone a project,\
    \ run:\n\n```bash\n$ hub clone project_name\n```\n\nTo clone another project:\n\
    \n```bash\n$ hub clone github/hub\n```\n\n## Automation and API\n\nPerhaps the\
    \ most powerful feature of hub, and one that more experienced developers will\
    \ find extremely useful, is the ability to script GitHub tasks via the command\
    \ line. You can also list or create issues, pull requests, or GitHub releases\
    \ in the format of your choice. For instance, to list the URLs of the last 20\
    \ pull requests for the develop branch, To list the latest issues in the current\
    \ repository you can run and limit the number of issues returned to 10:\n\n```bash\n\
    $ hub pr list --limit 20 --base develop\n```\n\n```bash\n$ hub issue --limit 10\
    \ --format='%t [%H] | %U%n'\n```\n\nTo see all the issues of a repository on the\
    \ project's page:\n\n```bash\n$ hub browse --issues\n```\n\nThe functionality\
    \ of hub is then further increased by the hub api extension [7], which allows\
    \ you to make any requests that the GitHub API can handle. Support for the API\
    \ greatly increases the reach and power of hub, because it means you can work\
    \ with more advanced tools like GraphQL\n\n## Starting a New Project\n\nStarting\
    \ a new project is also much easier from terminal than via the standard GitHub\
    \ interface. To create a repository to host a new project simply run:\n\n```bash\n\
    $ git init\n```\n"
  mdcn: "\n安装 hub 的第一步是确保你安装了正确版本的 Git。首先，它通过让你拥有正确的 Git 版本来节省你的时间。在命令行克隆或创建 GitHub\
    \ 私有仓库时，请运行以下命令：\n\n```bash\n$ git --version\n```\n\n由于 hub 也利用了命令行固有的功能，你也可以用它来自动化重复任务。\n\
    \n本文介绍了 hub 的用处。我将带你了解使用它的基础知识。\n\n此命令将返回你的 Git 版本。为了给你一个 hub 能做什么的示例并为了使用 hub，版本必须是\
    \ 1.7.3 或更高版本。如果缺少 Git，或者你使用的是旧版本，不要担心：你可以轻松安装新版本。**hub 的优势之一**\n\n安装它最流行（在我看来是最好）的方法是使用\
    \ Homebrew [4]，它是一个开源软件包管理器，但你为 GitHub 使用的系统并不是一个坏系统。它让初学者能够轻松开始使用 GitHub，但你也可以为高级用户使用该软件包管理器，它提供了一系列优秀的自动化工具和完成大多数常见任务的直观方法。要安装\
    \ brew（Homebrew 的命令行实用程序），请输入以下命令：\n\n```bash\n$ /bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)\"\
    \n```\n\n此命令将安装到 ~/.linuxbrew，但你的工作流 Hub 提供了这些好处，尽管如果你想更改它，可以使用 sudo 命令。\n\n现在你可以使用\
    \ brew 安装 hub 了：\n\n```bash\n$ brew install hub\n```\n\n这允许你使用命令行界面完成你可以做的任何事情——从通配符到脚本——并在\
    \ GitHub 中为你提供所有这些功能。对于习惯于在命令行工作的用户来说，hub 显然比操作 GitHub GUI 快得多——至少对于复杂的项目是如此。但请记住，hub\
    \ 是为高级用户设计的。如果你是 GitHub 的新手，在跳跃到 hub 之前，先熟悉 GitHub 的基础知识是一个好主意。\n\n然后你可以通过查看已安装的\
    \ hub 版本来进行健康检查：\n\n```bash\n$ hub version\n```\n\n```bash\ngit version 2.25.0\n\
    ```\n\n```bash\nhub version 2.14.1 #\n```\n\n## 在开始之前\n\nHub 与你的 GitHub 账户直接集成，因此存在潜在的安全风险。这种风险相对较小，大多数想要使用它的开发者并不担心。现在你已经有了可以运行的\
    \ hub 版本，我将向你介绍一些基础功能。\n\n当你开始时，你可能想在 GitHub 上创建一个新仓库。要实现这一点，请导航到任何你想初始化 Git 或已创建\
    \ Git 仓库的文件夹：然后运行：\n\n```bash\n$ cd Documents\n```\n\n```bash\n$ mkdir Test; cd\
    \ Test/\n```\n\n```bash\n$ git init\n```\n\n```bash\n$ git commit -m 'Adding a\
    \ test file'\n```\n\n```\n[master (root-commit) 07035c94e038] Adding a test file\n\
    Initialized empty Git repository in /Users/SudeshnaSur/Test/.git/\n1 file changed,\
    \ 1 insertion(+)\ncreate mode 100644 test.txt\n```\n\nhub 现在已经为你初始化了一个 GitHub\
    \ 仓库，但目前它是空的，因为 Git 只能看到最近更改更改的文件。\n\n```bash\n$ git status\nOn branch master\n\
    nothing to commit, working tree clean\n```\n\n现在，在你的新仓库中放置任何文件，并使用 echo 向其添加一些文本：\n\
    \n```bash\n$ echo \"Hello\" > test.txt\n```\n\n就这样：你现在初始化了一个仓库，做了一个更改并提交了它。更改将出现在仓库中，并对应你的邮箱地址。这是使用\
    \ hub 的基本流程，你会很快发现它比直接操作 GitHub GUI 快得多。接下来，检查 git 状态，你会发现目前还没有任何提交：\n\n```bash\n\
    $ git status\nOn branch master\nNo commits yet\nUntracked files:\n  test.txt\n\
    ```\n\n## 开始使用\n\n到目前为止，你一直在使用 hub 完成那些本可以在 GitHub GUI 上轻松完成的任务。然而，为了让你领略一下 hub\
    \ 目前一些更高级的功能，我将向你展示如何从本地系统自动创建新的 GitHub 仓库。\n\n接下来，运行 git add：\n\n```bash\n$ git\
    \ add .\n```\n\n如果你运行 `hub create`，hub 会自动在 GitHub 上创建一个与你本地系统当前目录同名的新仓库：通过使用此命令，你现在已经暂存了更改但尚未提交它们。为了提交更改，你需要一个\
    \ GitHub 账户。如果你还没有 GitHub 账户，可以使用此分步指南 [5] 创建一个。\n\n现在你需要让你的本地 Git 版本使用你的账户，因此你需要提供账户的用户名和邮箱地址。这些细节将包含在添加到任何仓库的每个提交消息中，这样任何查看代码的人都能看到你是作者。要将这些细节添加到你的本地\
    \ Git 版本中，请运行：\n\n```bash\n$ git remote -v\n```\n\n```\norigin git@github.com:YourRepo/Test.git\
    \ (fetch)\norigin git@github.com:YourRepo/Test.git (push)\n```\n\n更好的是，使用以下命令将你的仓库与远程镜像链接起来：\n\
    \n## 进阶\n\n## 日常任务\n\n大多数使用 GitHub 的任务现在都可以直接从命令行完成。这些任务包括克隆或创建仓库、浏览项目、列出问题或保持项目更新。如果你担心向访问特定仓库的用户发送你的邮箱地址，有一个功能可以隐藏它。你可以将邮箱地址设置为\
    \ GitHub 凭据 [6]，以便其他用户只看到你的用户名。要克隆项目，运行：\n\n```bash\n$ hub clone project_name\n\
    ```\n\n克隆另一个项目：\n\n```bash\n$ hub clone github/hub\n```\n\n## 自动化与 API\n\nhub\
    \ 最强大的功能之一，也是经验丰富的开发者认为非常有用的功能，就是通过命令行对 GitHub 任务进行脚本化的能力。你还可以按照喜欢的格式列出或创建问题、拉请求或\
    \ GitHub Release。例如，列出开发 分支最后的 20 个拉请求，列出当前仓库中最新的问题你可以运行并限制返回的问题数为 10：\n\n```bash\n\
    $ hub pr list --limit 20 --base develop\n```\n\n```bash\n$ hub issue --limit 10\
    \ --format='%t [%H] | %U%n'\n```\n\n在项目页面查看仓库的所有问题：\n\n```bash\n$ hub browse --issues\n\
    ```\n\nhub 的功能通过 hub api 扩展 [7] 进一步增强，允许你处理 GitHub API 可以处理任何请求。对 API 支持极大扩展了\
    \ hub 的范围和威力，因为这意味着可以使用 GraphQL 等更高级的工具\n\n## 开始新项目\n\n从终端启动新项目也比标准的 GitHub 界面简单得多。要创建一个托管新项目的仓库，只需运行：\n\
    \n```bash\n$ git init\n```\n"
