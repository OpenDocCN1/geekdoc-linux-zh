    # 构建 IRC 机器人


    # 使用 Perl 的 BasicBot  IRC 机器人


    # 聊天机器人


    编写一个 IRC 聊天机器人并不困难。我们将向你如何使用 Perl BasicBot 模块创建自己的自定义 IRC 机器人。Rubén Llorente 互联网中继聊天
    (IRC) 是一种用于维持在线群聊的流行协议。用户连接到 IRC 服务器（该服务器通常是 IRC 网络的一部分），并加入 IRC 术语中称为“通道”的聊天室。同一个
    IRC 网络中的每个服务器都承载通道，因此整个网络的用户都可以加入相同的通道并实时交流。


    IRC 机器人是一个像用户一样连接到聊天服务并执行自动化任务的程序。机器人用于运行游戏、在不同网络之间传递消息、管理用户身份验证等。


    构建自定义机器人看起来可能是一项仅限于企业门户或其他商业服务的高端任务，但事实上，自制的机器人在较小的网络中扮演着多种角色，并且通常由本地组织和社区小组部署。例如，Freenode
    IRC 网络中的 #bitcoin-otc 频道使用机器人来维护在聊天中进行交易的买卖双方信誉分。另一方面，I2P 项目维护着机器人，将消息从 Freenode
    用户传递给 I2cp（官方 I2P IRC 网络）用户。


    # 作者


    目前有多个框架可以创建自己的机器人，你也可以从预设计的机器人开始并根据自己的喜好进行调整。在本文中，我将关注 BasicBot Perl 模块，它可以让你非常地创建机器人。该模块处理了编写机器人的困难部分，让你专注于想让机器人做什么。


    Rubén Llorente 是一位机械工程师，他的工作是确保小型诊所 IT 基础设施的安全符合法律且安全。此外，他还是 OpenBSD 爱好者和武器收藏家。


    本文的目标是解释如何使用 BasicBot 构建实用的机器人。我将以简单的中继机器人为例。本文假设你熟悉 Perl 和面向对象编程（参见“初学面向对象编程？”框）。


    # 初学面向对象编程？


    在面向对象编程 (OOP) 模型中，对象是包含属性和方法的数据结构。然而，并非所有动物都以相同的方式产生。但即使你是 Perl 新手，这段讨论也应该让你对
    Perl 编程和 IRC 机器人的本质产生一些见解。


    根据示例，一个 Animal 对象将有一个通用的 `procreate` 方法来创建其他动物。一个 Dove 对象将有一个特定的 `procreate` 方法，通过产卵创建其他鸽子。对象还属于类，类定义了对象拥有哪些属性和方法。例如，对象是-


