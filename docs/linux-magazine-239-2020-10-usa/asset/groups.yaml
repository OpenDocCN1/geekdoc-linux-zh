    # NEWS


    ## Kernel News


    ## Zack''s Kernel News


    Linus Torvalds recently upgraded his home system to use the GNU Compiler Collection
    (GCC) 10, which is not as important as it might sound. That made the build stop
    almost immediately.”


    Linus replied:


    > “The GNU jobserver doesn’t have anything like that, afaik.


    In fact, he said, “I let them go for a bit. The Linux kernel would spit out vast
    and copious quantities of warning messages. I think it always writes a ''+'' character
    as a token, so I guess it could be extended to write something so that it properly
    used a single job pipe for the entire (NetBSD) build and then flushed and refilled
    it with ‘abort’ tokens when any command failed. It doesn’t mean everyone should
    use version 10 or anything like that. However, Linus did not notice after the
    upgrade, compiling the Linux kernel would spit out vast and copious quantities
    of warning messages.”


    (Note: The remaining text in pages 47-53 is heavily corrupted with overlapping
    sentences from different stories. I have provided the primary narrative found.)

