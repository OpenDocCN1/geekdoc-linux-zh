    在方便时可以进行替换，提供了相似的选项以及它特有的一些选项。find 的搜索策略被称为深度优先搜索 (DFS) [3]。从根目录开始，该算法会向下遍历整个目录分支直到到达底部，然后它会垂直返回，在进入下一个分支之前搜索完整个分支。


