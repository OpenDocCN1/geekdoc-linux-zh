- md: "\nThe .inx file draw_circle.inx is pretty straightforward overhaul of the scripting\
    \ API, and you probably find it forward. Lines 1 and 2 tell Inkscape routine stuff\
    \ what happened with the docs – nothing like the version, character encoding,\
    \ and type of the.\n\nThe little documentation there is on the API is still XML\
    \ being used. The <name> tag (line 3) establishes what will show up in Inkscape’s\
    \ menus, and <id> is for the old version and is completely obsolete. It gives\
    \ your extension an identifier that you must make sure is unique so it doesn’t\
    \ clash with any other extension.\n\nInkscape’s extension system is just as bad.\
    \ Again, it has been made obsolete by Inkscape 1.0, and it is mainly listings\
    \ of code devoid of parameters. As you will see later, if your extension requires\
    \ parameters, you would put them here also, but, for the time being, let’s just\
    \ get a circle with a fixed radius and fixed location drawn.\n\n# Listing 1: draw_circle.inx\
    \ (l)\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<inkscape-extension\
    \ xmlns=\"http://www.inkscape.org/namespace/inkscape/extension\">\n  <name>Draw\
    \ Circle</name>\n  <id>org.linuxmagazine.inkscape.effects.drawcircle01</id>\n\
    \  <effect>\n    <effects-menu>\n      <submenu name=\"Render\"/>\n    </effects-menu>\n\
    \  </effect>\n  <script>\n    <command location=\"inx\" interpreter=\"python\"\
    >draw_circle.py</command>\n  </script>\n</inkscape-extension>\n```\n\nListing\
    \ 1 tells the latest version of Inkscape that draw_circle.py is the name of the\
    \ script and that the path is relative to the .inx file (location=\".inx\"). As\
    \ you will be saving them both to the same directory, there is no need to specify\
    \ a path along with the script name. The <command> tag also informs Inkscape of\
    \ the interpreter it needs to run the script, in this case Python.\n\nSpeaking\
    \ of Python scripts, check out Listing 2.\n\n# Listing 2: draw_circle.py (l)\n\
    \n```python\n#!/usr/bin/env python\n# coding=utf-8\nimport inx\nfrom inx import\
    \ Circle\n\nclass DrawCircle (inkex.EffectExtension):\n    def effect(self):\n\
    \        parent = self.svg.get_current_layer()\n        style = {'stroke': '#000000',\
    \ 'stroke-width': 1, 'fill': '#FF0000'}\n        circle_attrs = {'style': str(inkex.Style(style)),\
    \ 'classes': 'mycircle'}\n        inkex.addNS('label', 'inkscape')\n        circle_attrs.update({'cx':\
    \ '100', 'cy': '100', 'r': '100'})\n        parent.add(Circle (**circle_attrs))\n\
    \nif __name__ == '__main__':\n    DrawCircle().run()\n```\n\nThis is the program\
    \ itself, and Lines 1 and 2 are housework – what interpreter to use and the character\
    \ encoding for the file itself. Importing inx (line 4) brings in Inkscape’s Python\
    \ extension module. The inx family of modules has submodules for shapes, text,\
    \ and other Inkscape elements. On line 5 you import the Circle element, because\
    \ that is what you’re going to draw.\n\nTo find out the other things you can import,\
    \ you can look into the .py files under /usr/share/inkscape/extensions/inkex/elements/.\
    \ Yes, you have to read the code. There is no documentation on line or elsewhere\
    \ that I could find that described XML into the elements you can import. As far\
    \ as I have read, you need to tell Inkscape where the elements is going to go.\
    \ You do that by specifying the circle's parent, in this case, the current layer\
    \ you want to draw (line 9). You can import modules to create circles, rectangles,\
    \ lines, text, and other graphical elements, and the attributes of the size, names,\
    \ and IDs of these things in a Python dictionary – an array with keys and values\
    \ (this comes handy later).\n\nHow an extension works is that you define your\
    \ main function (line 7). Within the class, you have sets of modules inherited\
    \ from inkex that you only use one module. The unit will depend on whatever unit\
    \ is pixels, meters, etc. The style dictionary contains details regarding the\
    \ stroke (the circle's outline), such as its color, thickness, etc., and also\
    \ for the fill. In this case, the stroke is going to be black with width. The\
    \ fill is going to solid red.\n\nThe style dictionary is then passed into another\
    \ dictionary (line 11) that also contains the label for circle drawn using our\
    \ custom extension.\n\n# Listing 3: draw_circle.inx (l)\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<inkscape-extension xmlns=\"http://www.inkscape.org/namespace/inkscape/extension\"\
    >\n  <name>Draw Circle</name>\n  <id>org.linuxmagazine.inkscape.effects.drawcircle01</id>\n\
    \  <param name=\"radius\" type=\"int\" min=\"1\" max=\"1000\" gui_text=\"Radius:\"\
    >100</param>\n  <effect>\n    <effects-menu>\n      <submenu name=\"Render\"/>\n\
    \    </effects-menu>\n  </effect>\n  <script>\n    <command location=\"inx\" interpreter=\"\
    python\">draw_circle.py</command>\n  </script>\n</inkscape-extension>\n```\n\n\
    The gui_text option is the label that will be shown next to the object (mycircle\
    \ – line 12), on the field. You can also use_gui_text, and then the label will\
    \ be marked for translation for the Inkscape translation team.\n\nYou then pass\
    \ that as a list of parameters to inkex's Circle () module using Python's ** operator.\
    \ Getting on to the Python bit, Listing 4 shows how you deal with arguments passed\
    \ on to the script. On lines 8 and 9, you overload another of inkex's methods,\
    \ in this case add_arguments (). You use this method to read in all the parameters\
    \ passed on by the dialog, and the document will update showing a circle.\n\n\
    The pars.add_argument works virtually the same as other Python modules used for\
    \ parsing parameters passed from the command line.\n\nPicking apart line 9, \"\
    --radius\" is the name of the field in <param> ... </param> that you set up in\
    \ pear under Extensions | Render in the menu. Click draw_circle.inx. It will also\
    \ double up as the name of the variable containing the value of the parameter.\
    \ Look at line 17 in the effect () function, and you can see how you get to it.\n\
    \nOne thing has changed in the .inx file: On line 5, you add the <param> ... </param>\
    \ tags. This automatically creates a dialog when you click Draw Circle.... It\
    \ also adds an element indicating the menu entry that clicking will to a dialog.\
    \ Your dialog currently contains one field, radius, that expects an integer number\
    \ within the range of 1 and 1,000. You could have just as easily made it a float\
    \ that would've allowed you to input numbers with decimal points.\n\n# Listing\
    \ 4: draw_circle.py (l)\n\n```python\nimport argparse\nimport inx\n\nclass DrawCircle\
    \ (inkex.EffectExtension):\n    def __init__(self, *args):\n        super(DrawCircle,\
    \ self).__init__(*args)\n        self.options = argparse.ArgumentParser(description=\"\
    Draw circle\")\n        self.options.add_argument(\"--radius\", type=int, default=100,\
    \ help=\"Radius of the circle\")\n        self.opt = self.options.parse_args()\n\
    \n    def effect(self):\n        parent = self.svg.get_current_layer()\n     \
    \   style = {'stroke': '#000000', 'stroke-width': 1, 'fill': '#FF0000'}\n    \
    \    circle_attrs = {'style': str(inkex.Style(style)), 'classes': 'mycircle'}\n\
    \        circle_attrs.update({'cx': '100', 'cy': '100', 'r': str(self.opt.radius)})\n\
    \        parent.add(Circle (**circle_attrs))\n```\n"
  mdcn: "\n\n`.inx` 文件 `draw_circle.inx` 是脚本 API 一个非常直观的重写，你可能会觉得它很直接。第 1 行和第 2 行告诉\
