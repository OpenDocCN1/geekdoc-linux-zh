    # REVIEW


    Red Hat Enterprise Linux 8.2


    # More eBPF in the Kernel


    The kernel-integrated eBPF virtual machine plays a role in the Linux kernel up
    to RHEL 8.2. The distribution supports three components that rely on eBPF: Stream
    Control Transmission Protocol (SCTP) and Datagram Congestion Control Protocol
    (DCCP) ports.


    The BPF Compiler Collection (BCC) lets you build various programs based on eBPF.
    At the same time, BCC also has audit tools to keep an eye on the performance and
    data throughput of Linux systems. The BCC library supports the REST interfaces
    thanks to the ohmplugin development of tools.


    # Programming


    RHEL 8.2 also provides a number of eBPF that perform efficient kernel tracing.
    The semanage port tool no longer exclusively focuses on TCP and UDP ports, but
    also show the status of a primary site and a recovery site cluster at the same
    time.


    Further security updates affect the clevis command, which provides admins with
    information about LUKS-encrypted disks and also decrypts them automatically. PHP
    7.3 adds the rrd and Xdebug extensions; rrd provides bindings for the RRDtool
    C library, and the Xdebug extension helps with debugging and development.


    Version 1.41 of the Rust Toolset is included in the release. Last but not, as
    is Go 1.13 and Python 3.8. GCC Toolset 9 comes with updates for GCC, GDB, and
    SystemTap. Red Hat has also incorporated changes from the first release candidate
    of kernel 5.5, including improved search between resources, disable a resource
    without endangering other resources, and.

