    THE BROWSER SAGA


    Dear Reader,


    On August 11, Mozilla CEO Mitchell Baker announced a “significant restructuring”
    of the Mozilla Corporation. When you are reading comparisons of Firefox and Chrome,
    keep in mind that Chrome is not even open source. It is pro-Mozilla best known
    for its flagship product, the Firefox proprietary freeware, with a long-winged
    "Terms of Service” web browser. The restructuring is said to include significant
    and links to Google''s self-serving and Byzantine privacy staff reductions – the
    second layoffs of the year. Baker''s announcement points to the pandemic as a
    factor in the need makes (or dictates) with other proprietary vendors for a new
    start, but commentators wonder if other reasons are behind the change. The Chromium
    variant is Google''s open source native, and it doesn''t receive nearly as much
    attention from. When Firefox appeared on the scene in 2004, it was exciting, and
    it isn''t what usually gets compared to.


