    Tuned 系统调优工具现在已最新的上游版本 2.13 中可用。Tuned 监控系统并可以根据预期用途的配置（profiles）优化性能。你将找到针对高数据吞吐量、低延迟和节能的配置。更新后的
    Tuned 在 RHEL 8.2 中带有一个新的依赖架构的调优框架，支持多个新的包含指令。针对 sap-hana、latency-performance 和
    realtime 调优配置也提供了更新。


    BIND DNS 服务器已移动到基础版本 9.11.13，该版本引入了用于安全技术实施指南（Security Technical Implementation
    Guides）的新算法、命令和变体；它包含了关于加固你系统安全性的建议。


    # SELinux 扩展


    BIND 还支持一种基于 SipHash-2-4 的 DNS cookies 算法，如 RFC 7873 所述。`tcp-highwater` 显示每次运行中并发
    TCP 客户端的最大数量，而 `BIND-named-checkconf` 命令考虑了 DNS64 网络扩展，该扩展允许来自 IPv4 上的的 IPv6 客户端进行
    NAT。基于这些建议以及相关工具和类型的 Red Hat 客户现在正期待一个合适的 pro-


    `udica` 是随 RHEL 8.2 引入的工具，可自动生成自适应容器的 SELinux 安全策略。SCAP 是安全内容自动化协议，Red Hat 用户用它进行自动化系统监控和预定义的安全策略合规检查。


    如果容器报告了由 `udica` 引起的拒绝访问，它将根据需要更改关联的安全策略。在这种情况下，管理员根据需要进行检查。


    在发生分布式拒绝服务（DoS）攻击时，得益于新的过期答案函数，服务器不再返回 SERVERFAIL 消息，而是退回到旧的缓存记录。该功能可以通过配置文件或远程控制通道（rndc）激活或禁用。


    配备了新的配置和 OpenSCAP 的 kickstart 文件，客户可以检查其系统是否符合 STIG 标准。此外为 SELinux 增加了一套新的 `setroubleshoot`
    插件。`setroubleshoot` 可以检测被阻塞的内存访问，并为管理员提供如何处理的建议。`scap-security-guide` 软件包还包含了针对国防信息系统（Defense
    Information Systems）文件的配置和相应的 kickstart。国防信息系统局（DISA）的核心策略，它是美国国防部的一个机构，成立于1960年（ACSC），并创造了许多缩写
    [2]，这些缩写大多与容器软件有关——与 Docker 不同，它们不需要 root 权限。


    # 使用 OpenSCAP 安全


    `setools-gui` 包在 RHEL 7 中已可用，现在也配备了 RHEL 8.2。澳大利亚网络安全中心也管理。一个缩写是 STIG，代表安全技术实施指南。RHEL
    8.2 用户用于逻辑卷管理器（LVM）的 Podman D-Bus API。受 SELinux 限制的用户允许管理用户会话或守护进程，可以使用 `oscap-podman`
    工具扫描 RHEL 8.2 中的容器，例如通过运行 `systemctl --user` 命令。


    # 8.2 发布说明


    RED HAT ENTERPRISE LINUX 8.2

    Red Hat Enterprise Linux 8.2 发布说明

    Red Hat 客户内容服务

    法律声明


    关于

    发布说明提供了 Red Hat Enterprise Linux 8.2 随附改进和新增的高级概述，并记录了此版本中的重要更改以及显著的错误修复、技术预览、弃用功能以及其他详细信息。


    - 5. 新功能

    - 5.1 安装程序和用法创建

