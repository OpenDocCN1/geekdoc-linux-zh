    # 新闻


    内核新闻


    但总来说，Paul 认为，他觉得他应该确保另一种优化可以提高 gmake 的终止能力，因为这些级别不会产生警告，而且这是 Linus 所请求的。


    - -Og 导致的问题比 -O3 更多


    Linus、Paul 和 David 随后立即就该涉及的功能实际设计展开了技术讨论。在讨论的某个时刻，Linus Torvalds 回复了 Jason 的话。显然，他们三个人都对那个将内核转换为
    GNU make 源代码以使用 -O3 代替 -O2 的原始补丁非常熟悉：


    最终，该线程在没有定论的情况下结束了。


    > “我不认为这是明智的。”


    总是有新的努力来清理它。通常情况下，我们对几乎任何事情很少有高循环计数。解决方案是更改内核。这一次的解决方案似乎是更改 GNU make。”


    > “-O3 甚至没有被作为一个选项是有原因的。”


    > “也许情况发生了变化，也许它们已经改进了。但我想看到这类事情的具体数字。”


    > “不那么激进地内联并不一定是一件坏事。它可以是，但”


    Linux 传统上一直在与 GCC 就究竟什么构成“错误”作斗争。但我实际上也做过良好的 GCC 优化。最近，关于 GCC 内联过多导致生成更差代码的最严重
    bug 报告，Jason A. Donenfeld 报告说，`(if (unlikely()))` 测试，为了让编译时间更快，可能的路径是导致栈帧增长，并且在使用
    `-flto` 时，似乎导致了栈溢出。


    > “所以就内联器的工作方式来说，‘O3 内联更多’ 并不是一个有效的论点。”


    由于现在的 -O3 不应该具有后文提到的内联问题，他在随后的帖子中补充道，“显然，与 10 年前具有同一组 bug，这次提交将新内核编译默认设置为我们。当使用
    gcc >= 10 时，我们可以通过‘noinline’ 和‘always_inline’来修复显而易见的情况在对内核进行如此彻底的更改之前，我们需要听听
    GCC 开发人员的意见。”


    Linus 还提供了一个他在 2011 年提交的关于该主题的错误报告链接：构建系统。


    https://gcc.gnu.org/bugzilla/show_bug.cgi?id=49194.


    Arnd Bergmann 同意，表示：“我也想听听 gcc 开发人员关于 O2 和 O3 之间通用建议的反馈，以及它们如何随时间演变。”他还评论道，“你在那个旧的
    gcc bug 报告中提出了一个非常有服力的论点，即不要陷入那些似乎在版本之间改变含义的 gcc 内联切换的兔子窝，这很有说服力。”他补充说，“从个人而言，我更感兴趣的是提高内核的编译速度，并最终为自己的构建支持
    -Og 或其某些变体。”


    所以 Jason 似乎终于准备放弃这个补丁了。而且，在测试的最后，但当然，也想，测试。


