    \ repetitive tasks.\n46 Lockdown Mode\nLockdown mode makes your Linux system more\
    \ secure and even prevents root users from modifying the kernel.\n78 PulseEffects\n\
    PulseEffects upgrades the PulseAudio sound server to include an equalizer and\
    \ other enhancements. Here’s how to write your own.\n88 Tutorial – Inkscape Extensions\n\
    Inkscape’s extensions add many useful features.\n50 Finding Processes\nWe show\
    \ you how to find a process running on a Linux system by start time.\n\n# DVD\n\
    5\nLINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\nISSUE 239\nOCTOBER 2020\n\nThis\
    \ Month’s DVD\n# Debian 10.5 and Devuan 3.0\nTwo Terrific Distros on a Double-Sided\
    \ DVD!\n\n# Debian “Buster” 10.5\n# Devuan “Beowulf” 3.0\n\nFounded 1993 by Linux\
    \ pioneer Ian Murdock, Devuan is a Debian fork that was first released in 2018.\
    \ The reason for the fork was Debian 8’s adoption of systemd as an init system.\
    \ An init system is the first process that begins on Linux. It runs until the\
    \ machine is closed down and starts other processes. Devuan partly objected to\
    \ how the decision was made to use systemd, on the grounds that the final decision\
    \ was made by Debian's Technical Committee. It also objected to systemd itself,\
    \ on the grounds that it goes far beyond the traditional purpose of an init system\
    \ to be a manager of the entire operating system.\n\nDebian is one of the oldest\
    \ active Linux distributions. Today, with almost 1,300 developers and 60,000 packages,\
    \ Debian is also one of the largest. It is the basis of dozens of other distributions,\
    \ including Ubuntu and Linux Mint, which have become distro powerhouses in their\
    \ own right.\n\nOne of Debian's strengths is its installer. While Debian can be\
    \ installed in 15 minutes, the installer also offers the option of step-by-step\
    \ customization. This option makes the Debian Installer ideal for troubleshooting.\
    \ Sometimes, it can install Linux when other installers cannot.\n\nAs a reaction\
    \ to the Debian decision, Devuan advocates support of multiple init systems. It\
    \ calls this position Init Freedom, echoing the four freedoms that are the basis\
    \ of free software as defined by the Free Software Foundation.\n\nOrdinary users\
    \ can choose the amount of software freedom they have. The main section of its\
    \ repository contains only free software, but users can also choose to use the\
    \ contrib (free software that depends on proprietary software) or non-free (proprietary\
    \ software) sections. During installation, Devuan currently supports the older\
    \ System V init, as well as OpenRC. Other init systems are also being considered\
    \ for support. From this preliminary position, Devuan has branched out to\n\n\
    *Defective discs, but that reputation is obsolete. Please send an email to subs@linux-magazine.com.\
    \ Linux Magazine disc has been tested and is to the best of our knowledge free\
    \ of malicious software and defects, Linux Magazine cannot be held responsible\
    \ and is not liable for any disruption, loss, or damage to data and computer systems\
    \ related to the use of this disc.*\n"
  mdcn: "\nPerl BasicBot 模块。深入了解如何直接与 IRC 交互。本期还包括：\n\n- Flutter 即将登陆 Linux\n- SUSE\
    \ 为 SLE 推出服务包 2\n- 分发器脚本（Dispatcher Scripts）–\n- NetworkManager 允许您编写脚本，在移动到不同位置时自动调整配置（第\
    \ 28 页）。\n-清理构建警告\n- 改进内核代码生成\n- 解决缺失 Future 的规避方案\n- 自定义 GTK3 主题 –\n\n### 编译器特性\n\
    GTK3 工具包是 Gnome 和许多桌面应用程序的基础。了解如何创建自定义 GTK3 主题（第 34 页）。在 MakerSpace 中学习分布式天气监控，并转至\
    \ LinuxVoice 查看关于创建 Inkscape 扩展的教程。\n\n# 评测\n14 发行版漫 – Debian 衍生版\n18 红帽企业 Linux\
    \ 8.2\nDebian 的人气不仅限于其发行版，还扩展到其产生的众多衍生版。这些衍生版不仅仅是 Debian 的重命名版本，它们添加了各自独特的定制。\n\
    \n# \n3 评论\n6 DVD\n95 往期回顾\n96 特色活动\n97 征稿稿\n98 预览\n\n4\n2020年10月\n第 239 期\nLINUX-MAGAZINE.COM\
    \ | LINUXPROMAGAZINE.COM\n\n# LINUXVOICE\n\n# 深度\nLINUX MAGAZINE\n2020年10月\n\n\
    ### MAKERSPACE\n26 分发器脚本\n使用分发器脚本根据 VPN 连接挂载不同的网络驱动器，无需动手。\n\n32 自定义 GTK3 主题\n\
    我们将展示 GTK3 主题的组成以及您如何根据自己的喜味进行定制。\n36 编程快照 – 使用 Go 制作启动 USB\n一个 Go 程序将下载的 ISO\
    \ 文件写入可启动 USB 闪盘。为了防止其意外覆盖硬盘，Mike Schilli 为其提供了用户界面和安全检查。\n\n### 极佳发行版\n双面 DVD！\n\
    详情请见第 6 页\n65 树莓派 Symfonisk\n41 Charly 专栏\n测量接口吞吐量并提供历史记录的工具并不容易找到。VnStat 管理这种平衡并受到了\
    \ Charly 的青睐。\n42 命令行 – find 和 bfs\n根据您的搜索需求，在搜索目录时用 bfs 替换 find 可能会获得更快的结果。OpenToonz,\
    \ Qtile, starcli, Fermentrack, industry 等。\n73 欢迎来到 Linux Voice。\nGraham 探讨了 OpenToonz,\
    \ Qtile, starcli, Fermentrack, industry 等。\n74 Doghouse – 为什么是 Alpha\n回顾早期使用 Linux\
    \ 的经历，madd 解释了他在项目中看到的许多优势。\n75 GitHub 与 hub\n这个实用的命令行工具允许您从终端窗口管理 GitHub 仓库，这可以更容易地自动化重复任务。\n\
    46 锁定模式\n锁定模式让您的 Linux 系统更安全，甚至防止 root 用户修改内核。\n78 PulseEffects\nPulseEffects\
    \ 升级了 PulseAudio 音频服务器，包含均衡器和其他增强。这里是编写您自己的方法。\n88 教程 – Inkscape 扩展\nInkscape\
    \ 的扩展添加了许多实用功能。\n50 查找进程\n我们向您展示如何通过启动时间查找 Linux 系统上运行的进程。\n\n# DVD\n5\nLINUX-MAGAZINE.COM\
    \ | LINUXPROMAGAZINE.COM\n第 239 期\n2020年10月\n\n本月 DVD\n# Debian 10.5 和 Devuan\
    \ 3.0\n双面 DVD 上的两个极佳发行版！\n\n# Debian “Buster” 10.5\n# Devuan “Beowulf” 3.0\n\n\
    Devuan 由 Linux 驱驱 Ian Murdock 于 1993 年创立，是 Debian 的分支，首次于 2018 年发布。分叉的原因是 Debian\
    \ 8 采用了 systemd 作为 init 系统。init 系统是 Linux 上启动的第一个进程。它一直运行到机器关闭并启动其他进程。Devuan 对使用\
    \ systemd 的决策过程表示反对，理由是最终决定是由 Debian 技术委员会做出的。它还反对 systemd 本身，理由是它远超 init 系统的传统目的，成为了整个操作系统的管理器。\n\
    \nDebian 是最老的活跃 Linux 发行版之一。今天，拥有近 1,300 名开发者和 60,000 个软件包，Debian 也是最大的发行版之一。它是几十种其他发行版的基础，包括\
    \ Ubuntu 和 Linux Mint，这些发行版已成为各自的发行版强手。\n\nDebian 的优势之一是它的安装程序。虽然 Debian 可以在 15\
    \ 分内安装，但安装程序提供了逐步定制的选项。此选项使得 Debian 安装程序成为故障排除的理想选择。有时，它可以在其他安装程序无法运行时安装 Linux。\n\
    \n作为对 Debian 决策的回，Devuan 主张支持多个 init 系统。它将这种立场称为“Init Freedom”（初始化自由），呼应了自由软件基金定义的自由软件基础的四种自由。\n\
    \n普通用户可以选择拥有的软件自由程度。仓库的主部分仅包含自由软件，但用户也可以选择使用 contrib（依赖专有软件的自由软件）或 non-free（专用软件）部分。在安装期间，Devuan\
    \ 目前支持旧的 System V init 以及 OpenRC。还在考虑支持其他 init 系统。从这一初步立场出发，Devuan 分支出了\n\n*光盘存在缺陷，但这种声誉已经过时了。请发送邮件至\
    \ subs@linux-magazine.com。Linux Magazine 光盘已通过测试，据我们所知，没有恶意软件和缺陷，Linux Magazine\
    \ 不承担任何责任，对于与使用本光盘相关的任何数据和计算机系统的中断、丢失或损坏不承担法律。*\n\n"
