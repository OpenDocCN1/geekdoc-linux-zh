    \ the four channels into two mono channels, one above 3000Hz and one below 3000Hz.\
    \ The system then distributes these to the tweeter and midrange drivers. The 3000Hz\
    \ limit was purely empirical selection – exact specifications can also influence\
    \ the overall sound.\n\n# Setting Up the Equalizer\n\nTo adjust the sound, use\
    \ the integrated equalizer. To configure it, connect to the speaker over SSH.\
    \ Next, start the mixer by typing `alsixer` and select the frequency ranges with\
    \ the left and right arrow keys, press Esc to exit.\n\nYou have now completed\
    \ the basic configuration. The speaker should work. However, it will still sound\
    \ a little strange.\n\n# Configuring the Drivers\n\nFor the following settings,\
    \ in the Squeezelite Settings tab, enter the name of the speaker (e.g., Room)\
    \ and the IP address of the Media Server. Finally, turn on the ALSA Equalizer.\n\
    \nListing 1: Adjusted asound.conf\n```conf\n# default - Generated by piCorePlayer\n\
    .!default {\n    type plug\n    input.bindings.1 \"Input\"\n    output.bindings.3\
    \ \"Output\"\n    slave.pcm \"plugequal\"\n}\n\n2 {\n    type hw\n    card 0\n\
    \    input.bindings.0 \"Input\"\n    output.bindings.4 \"Output\"\n    slave.pcm\
    \ \"hw:1,0\"\n}\n\n3 {\n    type hw\n    card 1\n    input.bindings.1 \"Input\"\
    \n    output.bindings.5 \"Output\"\n    slave.pcm \"plug:crossover\";\n}\n\n4\
    \ {\n    type equal;\n    input.bindings.1 \"Input\"\n    output.bindings.3 \"\
    Output\"\n    library \"/usr/local/lib/ladspa/caps.so\"\n    controls { 3000 }\n\
    }\n\n5 {\n    type equal;\n    input.bindings.1 \"Input\"\n    output.bindings.5\
    \ \"Output\"\n    library \"/usr/local/lib/ladspa/caps.so\"\n    controls { 3000\
    \ }\n}\n```\n"
  mdcn: "\n为了搭建 Raspberry Pi 系统并通过 Amp2 的两个立体声通道访问各个扬声器驱动，你需要插件。这些插件对某些频率进行过滤工作，以便播放器将高频路由到高音器，并将低频路由到中音驱动器。\n\
    \n# 首次启动\n\n现在从卡槽取出 SD 卡并启动系统。启动 Raspberry Pi 后，可以通过 Web 界面（图 5）访问 piCorePlayer\
    \ 以使用 SlimServer [5]（以前称为 Logitech Media Server），因为该软件最初设置起来最简单。我选择了 Richard Taylor\
    \ [8] 编写的 Linux 音频开发者插件 API (LADSPA) 插件。你可以通过 WiFi 路由器的网页前端或使用 `arp-scan` 发现 IP\
    \ 地址：\n\n`sudo arp-scan --localnet | grep Raspberry`\n\n再次，重点是免费（即开源）软件。此外，你可能希望有一个中心化服务器，配合简单的客户端作为播放设备，并实现多房间和扬声器同步。由于\
    \ tinycore 在启动时将所有内容加载到内存中；系统由不同的端口、通过插件实现的扩展性（例如为互联网电台设置了许多扩展）以及当然支持包含流媒体服务 ZIP\
    \ 包组成。所有加载的扩展都会合并到系统每次运行时内存中的一个文件系统中。SlimServer 的大部分组件提供了大部分功能。其中某些所需功能已经预包并可以作为扩展下载；然而，我使用了安装在\
    \ NAS 系统 Docker 容器中的服务器。服务器本身非常容易设置；你可以在网上找到大量的说明和教程 [6]。\n\n首先，切换到底部的高级模式（Advanced\
    \ Mode）。然后执行以下操作：\n\n- 在 Main Page | Full Update 下更新本项目使用的 piCorePlayer 。扬声器可以选择作为\
    \ SlimServer 运行，但要这样做，你需要配置该功能。\n- 在 Main Page / Update 下更新扩展，虽然完成很快，但它需要正在运行的播放器或交叉连接（参见“首次启动”部分）。\n\
    - 在 Main Page / HotFix 下检查可能的热补程序。你会在下载区域找到一个我自己构建的版本。\n\n我将不会介绍服务器的设置，而是介绍扬声器的设置。\n\
    \n其次，进入 Squeezelite Settings 标签页并将 Amp2 设置为音频输出设备，它显示为 HiFiBerry DAC+（以及 Pro,\
    \ AMP2）。重启后，\n\n对于扬声器，我决定使用 piCorePlayer [7]。该软件设置简单，易于扩展并运行在 Raspberry Pi 上。首先下载当前\
    \ piCorePlayer 的镜像并将镜像写入 SD 卡。现在拨动卡槽控制开关以禁用 Raspberry Pi 的内部声卡。\n\n# 2020 年 10\
    \ 月\n# 第 239 期\n# LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\n\n# piCorePlayer\n\
    # SQUEEZE 音频设备\n\nCorePlayer 主要功能\n- Squeeze 正在运行\n- 使用新设置重启 Squeeze\n- 更新 Squeeze\
    \ 扩展\n- 为 Squeeze 安装 MP3 库\n- 进入蓝牙页面\n- 重新加载 CorePlayer\n- 进入诊断页面\n- 停止 Squeeze\n\
    \n附加功能\n- 停止 Squeeze\n\n# Rasp Pi Symfonisk MAKERSPACE\n\n扬声器控制台。为此，通过 SSH 连接到扬声器的\
    \ IP 地址。默认情况下，系统使用 `tc` 作为用户，`piCore`（大小敏感）作为密码。\n\n对于分频器（即高音和低音滤波器），你必须如列表 1\
    \ 所示编辑 `/etc/asound.conf` 文件。系统自带的编辑器是旧版的 Vi，虽然性能出色，但并不完全直观。初学者可以在旧的 Linux Magazine\
    \ 文章 [12] 中学习最重要的命令。\n\n这里显示的配置创建了一个过滤器链，该链通过均衡器和分频器发送到硬件。`pcm.!default` 中的条目将默认设备重定向到\
    \ `plqual` 均衡器。你将在下方找到 `pcm.plugequal` 和 `pcm.equal` 中的均衡器设置。\n\n`pcm.crossover`\
    \ 部分集成了 Richard Taylor 开发的插件，这些插件将立体声信号分为四个通道：两个 3000Hz 以上的通道（左和右）和两个 3000Hz 以下的通道。\n\
    \n图 4：你必须手动将为 piCorePlayer 构建的插件复制到 PCP_ROOT 分区的 `/etc/optional/` 目录下。\n\n系统随后将这四个通道混合为两个单声道通道，一个在\
    \ 3000Hz 以上，一个在 3000Hz 以下。系统随后将这些分配给高音器和中音驱动器。3000Hz 的限制纯粹是经验选择——精确的规格也会影响整体音质。\n\
    \n# 设置均衡器\n\n要调整声音，请使用集成的均衡器。要配置它，通过 SSH 连接到扬声器。接下来，输入 `alsixer` 启动混合器，并使用左右方向键选择频率范围，按\
    \ Esc 退出。\n\n你现在已完成基础配置。扬声器应该可以工作了。然而，它听起来仍然有些奇怪。正确的设置部分取决于扬声器的位置。然而，重要的是，少即是多。\n\
    \n# 配置驱动程序\n\n对于以下设置，在 Squeezelite Settings 标签页中输入扬声器的名称（例如 Room）和媒体服务器的 IP 地址。最后，开启\
    \ ALSA 均衡器。\n\n列表 1：调整 asound.conf\n```conf\n# 由 piCorePlayer 生成\n.!default {\n\
    \    type plug\n    input.bindings.1 \"Input\"\n    output.bindings.3 \"Output\"\
    \n    slave.pcm \"plugequal\"\n}\n\n2 {\n    type hw\n    card 0\n    input.bindings.0\
    \ \"Input\"\n    output.bindings.4 \"Output\"\n    slave.pcm \"hw:1,0\"\n}\n\n\
    3 {\n    type hw\n    card 1\n    input.bindings.1 \"Input\"\n    output.bindings.5\
    \ \"Output\"\n    slave.pcm \"plug:crossover\";\n}\n\n4 {\n    type equal;\n \
    \   input.bindings.1 \"Input\"\n    output.bindings.3 \"Output\"\n    library\
    \ \"/usr/local/lib/ladspa/caps.so\"\n    controls { 3000 }\n}\n\n5 {\n    type\
    \ equal;\n    input.bindings.1 \"Input\"\n    output.bindings.5 \"Output\"\n \
    \   library \"/usr/local/lib/ladspa/caps.so\"\n    controls { 3000 }\n}\n```\n"
