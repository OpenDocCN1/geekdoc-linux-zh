    You’ll find references to "shifting and monitoring capabilities." The authorized
    changes. RHEL 8.2 also lets you manage memory resources via cgroup v2, setting
    quotas to prevent individual processes from hogging too much memory.


    The Tuned system tuning tool is now available in the latest upstream version 2.13.
    Tuned monitors the system and can optimize performance based on profiles that
    depend on the intended use. You will find profiles for high data throughput, low
    latency, and energy-saving. The updated Tuned comes with a new architecture-dependent
    tuning framework in RHEL 8.2, supporting several new include directives. Updates
    are available for the sap-hana, latency-performance, and realtime tuning profiles.


    The BIND DNS server has moved to a basic version 9.11.13, which introduces new
    algorithms, commands, and variants for Security Technical Implementation Guides;
    it consists of recommendations for hardening the security of your own systems.


    # SELinux Extension


    BIND also supports an algorithm for SipHash-2-4-based DNS cookies, as described
    in RFC 7873. The tcp-highwater shows the maximum number of competing TCP clients
    per run, and BIND-named-checkconf command takes into account DNS64 network extensions
    that allow NAT from IPv6 clients on IPv4 servers. Red customers who base their
    security on these recommendations and the associated tools and types now look
    forward to a suitable pro-


    udica, a tool introduced with RHEL 8.2, generates SELinux security policies automatically
    adapted to containers. SCAP is the Security Content Automation Protocol that Red
    Hat users deploy for automated system monitoring and predefined security policy
    compliance.


    If a container reports an access denial caused by udica, it will change the associated
    security policy if desired. In this case, the admin checks as needed.


    In case of a distributed denial-of-service (DoS) attack, the servers no longer
    return SERVERFAIL messages but fall back on old cached records thanks to the new
    stale-answer function. The feature can be (de)activated by the configuration file
    or the remote control channel (rndc).


    Armed with the new profile and the kickstart file for OpenSCAP, customers can
    check whether their systems are STIG-compliant. There is also a new set of setroubleshoot
    plugins for SELinux. setroubleshoot detects the blocked memory access and gives
    the admin advice on how to proceed. The scap-security-guide packages also include
