- md: "\n## Use modern \"say\" instead of \"print\"\n\nhardwired values here for simplicity's\
    \ sake. \n\nuse 5.010; \n\nSince we wanted the output as a \n\n## Minimal parameter\
    \ parsing: If a number is passed as parameter floating-point number to look nice,\
    \ output this number of processes, otherwise 10. The output is restricted to just\
    \ two decimal places using printf – the \n\n```perl\nmy $max = @ARGV ? $ARGV[0]\
    \ : 10;\n```\n\nthe clock ticks are no more accurate than this anyway. sort then\
    \ numerically sorts the two relevant fields as columns.\n\n## Use the Proc::ProcessTable\
    \ module\n\nuse Proc::ProcessTable; \n\n## Create a disposable object and save\
    \ the process table it generated\nmy $table = Proc::ProcessTable->new->table;\
    \ \n\nThe first numeric column lists the number of clock ticks, while the second\
    \ lists the user ID. \n\nThe solution comes quite close to our objective, but\
    \ cannot display the usernames for the processes. In addition, some processes\
    \ that were definitely started long after the system booted (for example, the\
    \ Tor Browser) unexpectedly appear as if they were started zero seconds after\
    \ the system booted. The init process, on the other hand, did not start until\
    \ 468 clock ticks or 4.68 seconds after startup. In the test case, this was probably\
    \ because the hard disk encryption password had to be entered first. Removing\
    \ awk from the code and specifying the matching fields 22 and 21 visual processes.\n\
    \n## Schwartzian transform of table\n```perl\nmy @result = \n# Sort the list,\
    \ first by start time and then by PID\nsort { ($a->[0] <=> $b->[0]) or ($a->[1]\
    \ <=> $b->[1]) }\n# Use only the start time, PID and UID of the process\nmap {\
    \ [ $_->start, $_->pid, $_->uid ] } # The array following the dereferenced scalar\
    \ is the data source\n@table;\n\n# Output the results by classical iteration\n\
    foreach $p (@result[0..$max-1]) {\n    say sprintf('PID: %6i | Start: %s | UID:\
    \ %s', $p->[1], ''.localtime($p->[0], $p->[2]));\n}\n```\n\n## IN-DEPTH\n### Finding\
    \ Processes\n\n### Listing 11: Compact Perl Variant\nEach list entry contains\
    \ four data fields: PID, program or call name, time of creation, and username.\
    \ \n\nThe second function, calculateTimestamp(), calculates the time, which serves\
    \ as a limit filter to filter out irrelevant processes later.\n\nThe main program\
    \ first calls the getListOfOfProcesses() function and then sorts the list of processes\
    \ by their creation times and PIDs. This results in the output shown in Listing\
    \ 07, which contains all the processes identified with their owners, PIDs, program\
    \ names, and creation times. \n\n```perl\n#!/usr/bin/perl\nuse Proc::ProcessTable;\n\
    \nsub getListOfOfProcesses {\n    my @processes;\n    my $table = Proc::ProcessTable->new->table;\n\
    \    foreach my $row (@$table) {\n        push @processes, $row;\n    }\n    return\
    \ @processes;\n}\n\nsub calculateTimestamp {\n    my ($sec, $min, $hour) = @_;\n\
    \    return localtime($sec, $min, $hour);\n}\n\n# ... (rest of Perl logic)\n```\n\
    \n### Listing 12: Import Required Modules\n```go\npackage main\n\nimport (\n \
    \   \"bufio\"\n    \"fmt\"\n    \"io/ioutil\"\n    \"log\"\n    \"os\"\n    \"\
    strconv\"\n    \"strings\"\n    \"time\"\n\n    \"github.com/mitchellh/go-ps\"\
    \n    \"github.com/tkla/go-sysconf\"\n)\n```\n\n### Listing 14: Time Frame\n```go\n\
    // Compute time frame\n// Current time - days * 24h * 60min * 60s\ntimeBoundary\
    \ := time.Now().Unix() - timeLimit64*24*60*60\n\n// Determine boot time from /proc/stat\
    \ in seconds since 11970\n// available in /proc/stat in the line starting with\
    \ btime\nfileHandle, err := os.Open(\"/proc/stat\")\nif err != nil {\n    log.Fatalf(\"\
    Error calling os.Open(): %v\\n\", err)\n}\ndefer fileHandle.Close()\n\nscanner\
    \ := bufio.NewScanner(fileHandle)\nfor scanner.Scan() {\n    currentLine := scanner.Text()\n\
    \    if strings.HasPrefix(currentLine, \"btime\") {\n        dataFields := strings.Fields(currentLine)\n\
    \        bootTime = dataFields[1]\n        break\n    }\n}\n```\n\n### Listing\
    \ 13: Variables\n```go\nvar bootTime string\nvar userID string\n\n// Convert string\
    \ to numeric value\nbootTime64, err := strconv.ParseInt(bootTime, 10, 64)\nif\
    \ err != nil {\n    log.Fatalf(\"Error: %v\\n\", err)\n}\n// Suppress date and\
    \ time output\nlog.SetFlags(0)\n```\n\n### Listing 15: CLK_TCK\n```go\n// Reference\
    \ value stored for CLK_TCK: Values per second\ntimeLimit64 := int64(10)\nclkTck,\
    \ err := sysconf.Sysconf(sysconf.SC_CLK_TCK)\nif err != nil {\n    log.Fatalf(\"\
    Error calling Sysconf\")\n}\n```\n\n### Listing 16: Process List\n```go\n// Get\
    \ process list\nprocessList, err := ps.Processes()\nif err != nil {\n    log.Fatalf(\"\
    Error in call to ps.Processes()\")\n}\ntimeLimit64 = timeLimitArg\nlog.Printf(\"\
    Set time limit to %d days\\n\", timeLimit64)\n```\n\nWant to search for all Bash\
    \ processes almost like a pipe at the command line or in shell scripts, grep can\
    \ help you filter the output. The data source is at the end (Listing 10). The\
    \ following steps, which are part of the main function, include the variable definitions\
    \ and parameters (Listing 13), time frame and boot time (Listing 14), or command-line\
    \ parsing (it outputs all processes, sorted).\n\nAs with Python, you would not\
    \ want to program everything yourself in Perl, all of this in just one CLK_TCK\
    \ (Listing 15), and routines for retrieving (Listing 16) and evaluating by browsing\
    \ the /proc filesystem. In stead, you should first look at the Comprehensive Perl\
    \ Archive Network (CPAN [5]). The Go programming language has recently gained\
    \ in popularity among developers, since there may already be a Perl module for\
    \ accessing the process operation, which is why we offer an approach.\n\nIf nothing\
    \ is specified, the program sets the default value to 10. And, lo and behold,\
    \ there is a appropriate solution in Go. Our solution is based on two modules,\
    \ go-ps [9] and go-sysconf [10].\n\nWith the data already determined, you first\
    \ create an instance of sysconf, which provide functions for reading processes\
    \ and retrieving a reference to a data structure with the entire process table.\
    \ It then determines the boot time in it. You could certainly iterate through\
    \ the table with loops, but neither of the two time modules currently support\
    \ iterating in seconds since January 1, 1970 (Listing 14).\n\nTo evaluate time\
    \ stamps correctly, the clock ticks are determined with the sysconf module [7].\
    \ However, if you like functional programming (à la Lisp), you can use a Schwartzian\
    \ transform. This works as shown in Listing 15.\n\nOur Go script has about 150\
    \ lines; we have split it into several listings for clarity. The first step (Listing\
    \ 12) contains the package definition and imports the required modules.\n"
  mdcn: "\n\n## 使用现代的 \"say\" 代替 \"print\"\n\n为了简单起见，这里使用了硬编码的值。\n\n`use 5.010;`\n\
    \n由于我们希望输出作为一个 \n\n## 极简参数解析：如果传递一个浮点数作为参数（为了美观），则输出该数量的进程，否则输出 10 个。使用 `printf`\
    \ 将输出限制在两个小数位——这已经 \n\n```perl\nmy $max = @ARGV ? $ARGV[0] : 10;\n```\n\n时钟滴答的准确性也不会比此高。`sort`\
    \ 然后将两个相关的字段作为列进行数值排序。\n\n## 使用 Proc::ProcessTable 模块\n\n`use Proc::ProcessTable;`\n\
    \n## 创建一个临时对象并保存它生成的进程表\n`my $table = Proc::ProcessTable->new->table;`\n\n第一个数字列列出了时钟滴答数，第二列列出了用户\
    \ ID。\n\n该解决方案非常接近我们的目标，但无法显示进程的用户名。此外，某些确定在系统启动后很久才启动的进程（例如 Tor 浏览器）意外地显示为在系统启动后零秒启动的。另一方面，`init`\
    \ 进程直到启动后 468 个时钟滴答或 4.68 秒才启动。在测试用例中，可能是因为必须先输入硬盘加密密码。从代码中移除 `awk` 并指定匹配字段 22\
    \ 和 21 可以可视化进程。\n\n## 表的 Schwartz 变换\n```perl\nmy @result = \n# 对列表排序，先按启动时间，再按\
    \ PID\nsort { ($a->[0] <=> $b->[0]) or ($a->[1] <=> $b->[1]) }\n# 仅使用进程的启动时间、PID\
    \ 和 UID\nmap { [ $_->start, $_->pid, $_->uid ] } # 紧跟引用标量后的数组是数据源\n@table;\n\n\
    # 通过经典迭代输出结果\nforeach $p (@result[0..$max-1]) {\n    say sprintf('PID: %6i | Start:\
    \ %s | UID: %s', $p->[1], ''.localtime($p->[0], $p->[2]));\n}\n```\n\n## 深度解析\n\
