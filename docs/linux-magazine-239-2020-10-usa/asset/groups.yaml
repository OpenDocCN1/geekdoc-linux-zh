    # 深度解析


    ## 查找进程


    在下一步中，用户扫描进程并创建一个列表（列表 18）。然后使用一个 `for` 循环遍历此列表，并根据用户和进程运行时间对每个进程进行分析。如果进程处于在一秒到最多一秒半之间的时间范围内，那么这对于日常使用是足够的。


    我们要感谢 Tobias Klauser 提供的 `go-sysconf` 包以及对优化 Go 变体的支持。Python 脚本以及 Perl 和 Go 实现都使用了一个匹配的库，可以轻松访问进程信息。结果所示（列表
    17）。输出显示了脚本是如何带有参数 1 被调用的，然后通过管道通过 `grep` 处理以找到进程列表中调用的所有 Bash 实例。


    ### 列表 18：Go 脚本输出


    ```

    $ ./list-processes 1 | grep bash

    ```


    用户 ID: 1000, Process ID: 604, Program name: bash, Started on 2020-04-14 11:31:51
    +020 CEST

    User ID: 1000, Process ID: 5318, Program name: bash, Started on 2020-04-16 16:15:21
    +020 CEST

    User ID: 1000, Process ID: 6984, Program name: bash, Started on 2020-04-16 19:04:52
    +020 CEST

    User ID: 1000, Process ID: 6998, Program name: bash, Started on 2020-04-16 19:08:57
    +020 CEST


    然而，Go 库仍然有扩展空间。已经集成在 Python 库中的函数在 Go 变体中必须手动构建。


    如果你比较所有的解决方案，除了 Bash 变体 3 之外，所有变体都提供了有用的结果。在程序大小方面，Bash 变体 2 胜出；Go 变体最长，超过 140
    行。Python 实现处于中低水平。


    对于可理解性和可读性，意见分很大。特别是对于列表 11（紧凑的 Perl 变体），即使是熟练的 Perl 程序员也需要时间（以及我们使用的模块的文档）来理解它。Python
    或 Go 的实现可能更长，但学者更容易理解。


