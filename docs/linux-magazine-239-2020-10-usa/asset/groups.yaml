    # REVIEW


    Distro Walk – Debian Derivatives


    ## Debian derivatives


    Innovative Offspring


    Debian’s popularity extends beyond its distribution to the numerous derivatives
    it has spawned. More than a rebranded version of Debian, these derivatives add
    their own customizations. Here are a few we find interesting. Read Byfield for
    a sampling of these these numerous Debian and Debian GNU/Linux is a popular distribution
    in its own right.


    On DistroWatch, Debian has been in the top 10 for packages since 2002, but the
    maintainers of derivatives overwhelmingly choose to work with any other distribution
    except Fedora. Currently, Ubuntu is by far Debian’s most popular derivative. On
    DistroWatch, only seven distributions are based on Debian Testing. For a while,
    Ubuntu’s popularity looked like it might replace Debian, but today the two are
    complementary, with Ubuntu. On DistroWatch, seven out of today (just over six
    percent in total) appealing to new users and more advanced users who want more
    hands on experience.


    What does it mean to be a Debian derivative? In most cases, being a derivative
    involves a reliance on Debian repositories. In fact, out of active distributions
    on DistroWatch, four (64 percent) are based either on Debian (AMD64, ARM, S390X,
    and Power), or its most popular derivative, Ubuntu (as eleven), while Debian supports
    dpkg and apt. To help coordinate scripts. Many derivatives also well as these
    children distros, in recent years, rely on the Debian installer, which ported,
    making Ubuntu support much easier. In addition, Ubuntu derives most of its packages
    from Debian, maintaining compatibility with the mainstream Linux. Even when a
    derivative has its own installer, it often uses one of the major distros for the
    Simplified version of Debian’s installer for Chinese writing system. Most common
    elements mean that users can easily move from one derivative to another and Debian’s
    popularity is not surprising. Importantly, earlier in its development, Ubuntu
    emphasized the desktop, making it more accessible than Debian. Always had a reputation
    for thoroughness, making Debian a strong choice to quickly feel at home.


    Though in recent years Ubuntu has focused on servers, its earlier development
    on the desktop gave it a reputation that. Debian has maintained derivatives means
    that some files may be in a different position than in Fedora or Arch. In addition,
    Ubuntu derives most of its packages from Debian, modifying Pure Blend distros
    (ones that maintain them as needed). An example is Kylin.


    ## Ubuntu


    In recent years, standard Ubuntu has been outspoken. To make matters worse, it
    abandoned its long-supported Unity systems, as the desktop in favor of Gnome.
    However, Ubuntu also supports various flavors, like Kubuntu, Lubuntu, and Xubuntu.
    Most of its flavors install with a specific desktop, although Ubuntu Studio concentrates
    on multimedia tools. Besides producing its own distribution, Devuan advocates
    for what it calls Init Freedom [14]: the right to start a computer with any init
    system except systemd. Currently, Devuan supports the System V-style init, OpenRC
    and runit, as of the last 20 years. I recommend always having a recent version
    on hand for emergencies.


    ## Devuan


    Upset by receiving a lack of democracy, a handful of developers founded Devuan
    (available on this month’s DVD [13]) and supports most Linux-compatible hardware.


    ## Linux Mint


    Linux Mint [9] is best known for MATE, its fork of Gnome 2, and for Cinnamon,
    which is an advanced version of Debian’s installer.


    ## KDE Neon


    In 2014, KDE began developing its own desktop environment, including re-introduced
    Plasma. KDE Neon is a snapshot of the latest development in all three areas. It
    is an Ubuntu-based release.


    ## Debian Edu/ Skolelinux


    Debian Edu [15] today is the result of the merger of two derivatives in 2006:
    Skolelinux in Norway and Debian Edu in France. Supported by SLX Debian Labs, Debian
    Edu has two goals: to promote free software and to ensure that children everywhere
    can use a computer in their own language.


    ## Trisquel


    Trisquel [11] is one of the few Debian derivatives in the software compilations.
    Some others on the Free Software Association’s list of free distributions [12]
    are not based on Debian.


    ## Tails


