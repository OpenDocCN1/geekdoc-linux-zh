    # Modifying the Power Supply


    The power supply unit (Mean Well HDR-60-15) is very compact (and works with both
    230V and 120V) and therefore is well suited for the conversion. The Symfony does
    not appear to have changed the assignments. Play/Pause uses a 4-ohm midrange driver
    and an 8-ohm tweeter. (See also the “External Power Supply”.)


    HiFiBerry recommends a power supply with 18V and 60W at 3A for use with their
    Amp2 Raspberry Pi power amplifier. The HDR-15 is a 15V power supply unit but has
    an adjustable output of up to 18V. To simplify your work, use the information
    in Table 2 to map the wires. The polarity is not important, because it uses alternating
    current.


