  mdcn: "\n\n# 深度解析\n## 查找进程\n\n由于年龄（age）相同，因此使用 PID 作为标准。我们没有使用 `ps` 命令，而是尝试从 `/proc`\
    \ 文件系统获取数据作为基础。详细的规范可以在此处找到：`/proc/<pid>/stat`。它告诉你 Linux 内核启动后的时钟滴数（clock ticks）。此外，该值也可以直接写入\
    \ 172800 trick；这是基于这样一个假设：在缺少参数的情况下，86400 是每天的秒数。\n\n2*24*60*60 对应两天的时钟滴数，每个时钟频率为\
