    \ and making it a string, which is what inkex's Circle method expects.\n\nThere\
    \ are many other types of parameters you can use to make other complex dialogs.\
    \ A boolean parameter, for example, generates a checkbox to set a true/ false\
    \ value. You can set the default value to true or 1, or false or 0. An optiongroup\
    \ parameter generates a set of radio buttons from which you can choose one predefined\
    \ value – the different choices are created with <option> elements.\n\nFortunately,\
    \ this is one area with good documentation, so you can read about the different\
    \ types of fields you can use [1].\n\n**Figure 2: Adding <param> ... </param>\
    \ to your .inx file generates a dialog box where you can set fields – in this\
    \ case, the circle’s radius. Have a look at Listing 5 for an overview of some\
    \ of these fields in action.**\n\nOCTOBER 2020 ISSUE 239\nLINUX-MAGAZINE.COM |\
    \ LINUXPROMAGAZINE.COM\n\nTUTORIAL – INKSCAPE SCRIPTS LINUX VOICE\n\nListing 4:\
    \ draw_circle.py (l)\n\na text box that lets you input a value circle, but you\
    \ already saw that in the example above.\n\n```python\n#!/usr/bin/env python\n\
    # coding=utf-8\nimport inkex\nfrom inkex import Circle\n\ndef effect(self):\n\
    \    parent = self.svg.get_current_layer()\n    style = {'style': '#000000', 'stroke-width':\
    \ 1, 'fill': '#FF0000'}\n    circle_attrs = {'style': str(inkex.Style(style)),\
    \ 'cx': '100', 'cy': '100', 'r': str(self.options.radius)}\n    \n```\n\nLines\
    \ 9 to 13 and 15 to 19 do something more interesting (Figure 3). Say you want\
    \ to offer your users some options that allow them to choose where to place the\
    \ circle on the page – right; and at the top, in the middle, or at the bottom\
    \ of the page. This is one of those cases where the optiongroup comes in handy,\
    \ but you can give it a appearance=\"combo\" option. This makes the options appear\
    \ in a combo box, like a drop-down menu.\n\n```python\n    inkex.addNS('label',\
    \ 'inkscape'):\n    parent.add(Circle (**circle_attrs))\n\nif __name__ == '__main__':\n\
    \    DrawCircle ().run()\n```\n\nThe notebook widget (lines 21 to 28) creates\
    \ a set of tabs that can contain other widgets. Your users can switch between\
    \ each tab and input parameters into the fields they contain. In this example,\
    \ the notebook color-picker even comes with a color box. You could, of course,\
    \ have one widget contains two pages, each containing a color box on top of another,\
    \ but putting them in a notebook is more elegant. color, one for the stroke of\
    \ the circle and another for the fill. As you can see in Figure 3, these color\
    \ boxes are very complete and let your users set not only colors, but also the...\n\
    \nAlso note that, despite notebook being a container for other widgets, you still\
    \ have to capture a value from it when you process the input.\n\n# Listing 5:\
    \ draw_circle.inx (II)\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
    <inkscape-extension xmlns=\"http://www.inkscape.org/namespace/extension\">\n \
    \ <id>org.linuxmagazine.inkscape.effects.drawcircle</id>\n  <name>Draw Circle</name>\n\
