    # ANIMATION by Studio Ghibli


    OpenToonz is an open source animation software that has been used by Studio Ghibli
    for many of their films. It is a powerful and versatile tool that is suitable
    for both beginners and professionals. The software provides a variety of features
    for creating high-quality 2D animations.


    The interface of OpenToonz can be complex, but the software is well worth the
    effort. There are many tutorials and resources available online to help you learn
    how to use it.


    One of the key features of OpenToonz is its drawing system, which allows you to
    create beautiful and detailed illustrations using a variety of brushes and pens.
