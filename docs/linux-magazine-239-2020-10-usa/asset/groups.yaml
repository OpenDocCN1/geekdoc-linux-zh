    # 深度解析


    命令行工具 – find 和 bfs


    Stack Exchange [5]，但启用广度搜索最简单的方法是安装 bfs，它在类 Debian 发行版的仓库中。在安装了 find 和 bfs 后，你可以选择可能提供最快结果的搜索工具。


    共享选项


    find（图 3）和 bfs（图 4）共享了大多数相同的选项。它们最大的区别在于命令本身，并且它们是独特的 GNU 项目，其特点是每个选项的长格式前只跟跟一个连字符，而不是两个。最明显的区别是
    bfs 对文件和目录进行了颜色编码。


    对于这两个命令，其结构非常简单。图 2：bfs 搜索方法：BFS 水平搜索目录，例如，在下降到下一层之前搜索一整层目录。


    find FILENAME


    由 C. Y. Lee 编写，作为一种线缆布布算法。这种后期实现源于一个选择。时间是因果链，搜索整个系统以寻找该文件。如果是这样，那么就充分解释了为什么 BFS
    没有被引入早期计算——很少有人听说过它。然而，你可以通过指定起始目录来节省时间：你更有可能使用 DFS。相比之下，BFS 可能是在点对点网络中寻找相邻节点的最佳选择。


    bsf START-DIRECTORY FILENAME


    作为策略，DFS 或 BFS 都不像 BitTorrent 那样在 GPS 搜索中天生优于其他。find 则是用于寻找类似的附近位置（例如常量或酒店），或者在社交网络中。在指定目录时，标准缩写是
    `/` 表示根目录，`~` 表示文本，尽管你可以发现许多声明可以找到符合某些标准的人：`.` 表示当前目录，或者居住在彼此一定距离内的人。


    大多数选项都是用于缩小搜索标准（从而提高搜索速度）的过滤器，最适合搜索整个目录树。然而，上下文可能变化巨大，以至于此类泛化结论是毫无意义的——也许在标准的
    Linux 安装中也是如此。


    应用的搜索标准（因此影响搜索速度）并不提供搜索策略的选择。由于对当前目录及其子目录有更高的熟悉度，因此存在一种偏好。


    带有数据库的搜索工具（如桌面应用 Recoll）提供的结果比许多命令行工具更快。通常，如果你知道或怀疑目标可能在哪里，其中一种工具就会成为明确的选择。例如，如果你怀疑你正在寻找的文件是
    `-name NAME`（这使得搜索区分大小写），紧接着是 `-iname NAME`（忽略大小写）。然而，单靠搜索本身，策略的选择是有限的。使用 find
    时，如果你怀疑文件在根目录下六七层目录处，那么 DFS 可能会在 BFS 之前找到它。


    BFS 也可以通过常见的文件属性进行过滤，例如设置最大或最小深度级别选项，或将搜索限制在当前文件系统中。对于组 ID (-gid GID)、组 (-group
