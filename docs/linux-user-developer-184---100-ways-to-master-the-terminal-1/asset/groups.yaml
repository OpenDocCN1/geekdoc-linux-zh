    # 功能级终端


    ## 与 shell 交互


    让你的 shell 操作更轻松的实用技巧


    ### >_61 别名 (Aliases)


    别名为你经常使用的命令创建快捷方式，或添加默认选项。在某些情况下，执行 `alias rm=''rm -i ''` 可以在删除文件时询问“你确定吗？”。你可以通过运行
    `alias` 来查看别名的完整列表。如果创建的别名与命令同名，你可以通过在命令名前面加上 `\` 来使用原始命令，例如 `\rm`。


    ### >_62 TAB 自动补全


    开始输入命令并按 Tab 键；如果有多个选项，你的 shell 将提供备选方案。例如，当你输入：`ls /somepath/tovery/longfilename`
    时，配合：


    ```

    ls | /someAltAtinTab

    ```


    ### >_63 运行多个命令


    使用分号在 shell 中运行多个命令。


    ```

    command1; sleep 5; command 2

    ```


    ### >_64 离线你的 shell


    使用 screen 启动一个新的 shell，你可以从中分离并通过 SSH 从另一台电脑重新连接。screen 对于运行任务非常有用，特别是在远程操作时。


    ### >_66 当另一个命令成功时运行一个命令


    && 运算符会检查第一个命令的返回码，如果它执行成功，则继续执行下一个命令。


    ```

    command1 && command2

    ```


    相反的使用使用 `||`；只有当第一个命令失败时，才会运行第二个命令。


    ### >_67 记录你的 shell 会话


    运行脚本，你输入的所有内容及其输出都将被记录到一个文件中。完成后按 Ctrl+D，文件 `typescript` 将包含你所做一切的副本。


    ### >_68 重定向


    通常情况下从键盘读取输入并输出到 shell。你可以通过重定向来更改这一点。`<somefile` 从文件读取，`>file` 输出到文件；`>>file`
    追加到文件末尾。`>&2` 重定向标准错误，而 `2>&1` 将两者都重定向到同一个地。


    ### >_69 学习脚本


    这些命令本身非常强大，但当你一次在 shell 中运行它们（甚至同时运行多个命令）时，它们就会变得非常灵活。简单的脚本很容易编写（你可以通过阅读《Linux
    on bash》来深入学习制作脚本）。最基本的是，它们只是一个要运行的命令列表，每行一个。在顶部放置行 `#!/bash` 使其识别为 shell 脚本。


    ### >_70 配合 sudo 重定向


    你是否尝试过使用 `sudo echo something >file` 写入文件结果结果因写入权限问题失败了？那是因为重定向是以你的用户身份（而非 sudo）运行的。解决方案是使用
    `tee`，它可以同时输出到终端和文件，例如：


    ```

    echo something | tee -a somefile

    ```


    ### >_65 历史记录 (History)


    shell 维护着你运行过的命令列表，这非常有用。按方向键向上滚动。按 Ctrl+R 搜索你之前使用过的命令，shell 将为你显示最近的匹配项。再次按查看上一个，依此类推。输入
    `!!` 将运行上一个命令，所以如果你忘记使用权限，请运行 `sudo !!`


    ```

    @zphouch ~/.history 01%

    10 systemctl status sshd

    11 systemctl status dev_sdb1

    12 list-units

    13 list-unit-files

    14 journalctl -f

    15 journalctl -f

    16 history

    17 tree

    18 smartctl -H /dev/sda

    sudo smartctl -H /dev/sda

    d25 df

    df uname -a

    @zphouch ~/.history

    ```


    ## 文件系统


    挂载内部和外部文件系统


    ### >_71 挂载文件系统的命令是：

    - 挂载文件系统

    - `sudo /dev/sdX /mount/point` 其中 `sdX` 是设备名。挂载点可以是任何地方。文件系统通常会自动检测，或者你可以使用 `-t`
    指定


    ### >_72 使用 dd 复制完整的文件系统


    `dd` 将磁盘分区按位复制到指定的文件。它的大小与原始分区一样，或者你可能想通过管道压缩输出：


    ```

    dd if=/dev/sdX of=/home/user/file.img

    ```


    ### >_73 另一种挂载方法


    如果设备列在 `/etc/fstab` 中，你只需要传递设备或挂载点。`fstab` 包含了你的选项，文件系统可以作为普通用户挂载。


    ### >_74 挂载外部驱动器


    如果设备列在 `/etc/fstab` 中，你可以像挂载它，桌面自动挂载器会处理这一点，因为它挂载在 `/dev/sdb1` 并由普通用户挂载。


    ### >_75 剩余空间


    使用 `df` 列出所有文件系统的已用和可用空间。通常以块报告空间，但 `-h` 提供人类可读的值。如果空间足够，使用 `-i` 检查


    ### >_76 将闪存数据写入磁盘


    Linux 会缓存数据，立即写入更快并减少闪存驱动器的损坏。如果你想确保所有数据提交到磁盘，在复制文件到闪存后运行 `sync`。


    ### >_77 查看已挂载的内容


    带有选项的 `mount` 命令提供了使用命令行参数格式化的易读输出，是脚本中获取内容的更好方法。


    ### >_78 挂载网络驱动器


    这与挂载本地设备类似，设备被指定为 NFS 服务器或 Samba 共享的主机/路径。类型由 `-t` 指定。


    ### >_79 修复损坏的文件系统


    如果文件系统损坏，它不能处于挂载状态，这意味着你可能需要从光盘启动运行它。内容很重要且没有备份（为什么？），先用 `dd` 复制一份。


    ### >_80 为你的文件系统添加标签


    当自动挂载器挂载 USB 闪存时，存在则使用文件系统的标签作为挂载点。否则使用 UUID。你可以为现有文件系统添加标签，为每个类型设置：


    ```

    label /dev/sd1

    ```


    在不提供标签的情况下运行其中任一个，它将告诉你。


    | /sys/fs/cgroup/cpuuset | cgroup | cgroup |

    | /sys/fs/cgroup/cpuacct | cgroup | cgroup |

    | /sys/firmware/efi/efivars | cgroup | cgroup |

    | /dev/nfs | devfs | devfs |

    | /dev/loop | varfs | varfs |

    | /sys/fs/cgroup/ids_misc | system-1 | autofs |

    | /proc/nfs | procfs | procfs |

    | /dev/tmpfs | tmpfs | tmpfs |

    | /dev/pts | devpts | devpts |

    | /dev/devpoint | depoint | depoint |

    | /dev/hupages | hugst | hugst |

    | /run/user/1000 | tmpfs | tmpfs |

    | /tmp | tmpfs | tmpfs |

    | /dev/nfs_nblk | btrfs | btrfs |


    # 精通终端


    ## 系统信息


    使用 `uname` 报告内核、OS、CPU 类型并打印。带有 `-a` 参数的命令报告所有信息


    ### 84 列出所有硬件


    `lshw` 命令列出你所有的硬件。它很长，所以你可以将其传递给分页器如 less。你还可以使用 `-html` 标志将其输出为 HTML，用于粘贴到网页中（甚至是一个奇特的
    HTML 电子邮件中）。


    ### 85 查找文件


    `find` 命令本身就非常强大，搜索文件系统不再如此困难。这样搜索：`find . -iname "embarrassing*"`


    ### 81 测试你的驱动器健康


    驱动器有一个名为 SMART 的监控系统（你可能需要在主板 BIOS 中启用它）。使用 `smartctl` 命令访问它。


    ### 86 更快的 find


    搜索文件系统不再是瞬时的。定位文件数据库。输出非常简单，在脚本中特别有用。理想情况下配合 root 使用。


    ```

    $ smartctl -i /dev/sda

    smartctl -H /dev/sda

    smartctl -t /dev/sda

    ```


    第一个命令打印关于驱动器的信息，第二个命令报告其健康状况，第三个运行测试。测试在后台运行，你可以继续使用驱动器。


    ### 87 检查剩余空间


    `df` 命令显示目录及其内部使用的空间，但提供了更友好的视图。不带参数时，它显示每个磁盘的剩余空间。使用 `-x` 报告特定的文件系统


    快速技巧

    排序

    当命令运行以报告某些内容（如 `df`），将输出传递给 `sort -n` 以按数字顺序排序。添加 `-k` 标志将显示每个驱动器的内核驱动。


    ### 88 检查剩余内存


    `free` 命令用于此功能不可思议。你可以添加 `-h` 选项来查看人类可读的值——而不是字节、兆字节和千字节。它已经在空内存上运行了一段时间，因为 Linux
    使用空内存进行缓存；`free` 显示了内存，以及最后一列中实际用的内存


    ### 89 简要信息


    使用 `uname` 报告一个或多个内核、OS、CPU 类型并打印。带有 `-a` 的命令报告特定组件


    ### 90 极其详细的信息


    安装并运行 `inxi` 来查看系统的详细信息。输出很短，但你可以通过 `-v` 后跟1 到 7 的数字来增加详细程度，或者你可以告诉它显示特定子系统的信息。


