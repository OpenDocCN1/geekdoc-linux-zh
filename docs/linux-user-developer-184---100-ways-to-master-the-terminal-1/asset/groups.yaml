    # 让 Linux 进入太空


    # 太空中的 Linux


    正如 Mike Bedford 报道的，Linux 是 NASA 许多太空探索的关键，但自矛盾的是，它的影响力并非无处不在。


    NASA 在今年早些时候曾登上新闻，其位于木星轨的太空探测器“朱诺号”（Juno）距离这颗巨行星的云顶仅 900 公里。特别为令人印象深刻的是大红斑的详细图像，那是一场直径是地球
    1.3 倍的风暴，可能已经持续了超过 350 年。


    与此同时，在 250 公外，火星探测器庆祝了登陆红行星表面的一周年。虽然冰冰没有 2012 年那么多，但它在未来许多年内继续为科学家揭引人注目的照片和数据。


    设计其他航天器涉及复杂的工作、任务规划和运行，以及所需的图像和数据需要某些高性能计算机，特别是对于科学和工程应用，你完全可以预期 NASA 首先且是一个 Linux
    用户。作为一种操作系统，可以说 Linux 确保了美国美国航天机构的通用支持。在这里我们查看 Linux 是如何被使用的，更重要的是它在世界上最快计算机 500
    强列表中的应用。由于它在超级计算领域中占据主导地位，这些设施完全依赖 Linux。高性能计算用户引用的益处包括 Linux 的模块化特性、可扩展性、社区支持和低成本。


    # 高级超级计算


    作为 NASA 所有部门的设施，NASA 的超级计算设施涉及了一系列令人惊叹的不同应用。近年来，它变得越来越受欢迎，特别是对于太阳系之外的任务——特别是对于那些在我们宜居带内可行、可能承载生命的任务。这不仅仅是为了已探测到的行星，考虑到银系中最不可想象的恒星；显然，这完全关乎黑客技术，一项只有最快的计算机才能应对的工作。


    由于 NASA 可能以其独特的太空探索而闻名，埃姆斯研究中心（Ames Research Center）计算设施的使用是在航天器设计期间。事实上，所有最近的任务在建造之前都经过了那里。NASA
    目前的一个高关注项目是 NASA 高级超级计算部门 (NAS)，它拥有四台超级计算机。第一名是 Pleiades（昴星团），它以昴星团中的一颗恒星命名，执行千万亿级计算（以核心为单位，每秒执行万亿次浮点运算），并拥有空间发射系统（SLS）及相关猎户座（Orion）开发的第
    15 位荣誉。


    位于埃姆斯研究中心的 NASA 高级超级计算部门 (NAS) 拥有四台超级计算机。第一名是 Pleiades。


    在固体燃料助推器分离期间模拟 SLS 火箭的空气动力力，Pleiades 超级计算机被要求分析航天器部分周围的气流。


