    # Tutorial


    # Piano HAT


    # Make musical passwords


    Mozart meets Moonraker with a Pi project for musically encoding your secrets using
    Pimori''s Piano HAT


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_67_0.png)


    Nate Drake

    is is a technology journalist, specialising in cybersecurity and retro tech.


    # Resources


    +   - Piano HAT

    - http://bit.ly/PianoHAT


