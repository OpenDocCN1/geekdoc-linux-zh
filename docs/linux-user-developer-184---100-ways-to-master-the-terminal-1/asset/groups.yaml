    Adding -k show the kernel driver for each drive.


    +   88 Check free memory

    The command for this is unimaginably free. You can add the -h option to see human-readable
    values - instead of kilobytes, megabytes and gigabytes. It shows has been running
    for a while with free memory, because Linux uses unused memory for caching; free
    shows, along with how much memory is actually available, in the last column.


    83 About the kernel

    If your kernel was built with the module support, you can view its entries in
    the configuration file at /proc/config.gz, so you can see exactly what hardware
    and features have support included.


    +   89 Brief information

    Use uname to report one or more of the kernel, OS, CPU type and print. The command
    with -a reports specifically components to report on. The output is simple and
    particularly useful when scripting.


    84 Listing all hardware

    lshw command lists all of your hardware. It is long, so you can pipe it into a
    pager like less. You can also output it to HTML with the -html flag, for pasting
    in a web page (or even a wacky HTML email).


    +   90 Really detailed information

    Install and run inxi to see a detail of your system. The output is brief, but
    you can increase it with -v followed by a number up to 7, or you can tell it to
    show information on particular subsystems.'
