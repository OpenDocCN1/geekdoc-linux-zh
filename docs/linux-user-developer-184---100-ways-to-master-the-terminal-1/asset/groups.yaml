    filesilo.co.uk


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_67_1.png)


    The Pimoroni Piano HAT is an extraordinarily useful board that can turn your Raspberry
    Pi into an electronic keyboard. The keys are responsive to touch and each has
    an LED which can light up as you play. Mozart has thoroughly considered an excellent
    library of coding samples for Pi which enable you to crank out tunes within minutes
    of your Piano HAT.


    In this project we will explore the basics of attaching the Piano HAT to your
    Pi, as well as how to generate 8-bit tones and play piano and sounds. We will
    then learn to use the custom ''pianahat-password'' scripts to decode your password
    by playing music. Using notes, the first script, piano-password.py, allows you
    to recover a password by playing the notes that you wish to hide, such as a password
    or email address. Use the second script, piano-decode.py, to decode your hidden
    secret.


    installation is complete, sudo apt-get update and sudo apt-get upgrade to bring
    Raspbian fully up to date.


    The Piano HAT itself is very easy to install. Marry the Pi GPIO pins to the connector
    on the HAT. The Piano HAT is compatible with all models of Raspberry Pi; however,
    if you have a Pi Zero or Zero W, you will need to attach a GPIO header.


    # 02 Download installation scripts


    ```

    curl https://get.pimoroni.com/pianohat | bash

    ```


    Read the message above and press Enter to continue. The installer will ask you
    if you wish to install the Piano HAT samples. Confirm you wish to do this, as
    you can use these to check the Piano HAT is working later.

    Installing the samples also downloads some of the Python modules you will need
    to use the Pi scripts, such as NumPy.

    If successful, the installer will display: ''All done, enjoy your Piano HAT!


    # 01 Set up your Pi and add Piano HAT


