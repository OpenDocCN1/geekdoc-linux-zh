    things look good is the hard part. So I need to find the right case for it. I''m
    looking for something that will work and is using new technology to bring life
    back to obsolete.


    ### When can you see the voice code design?


    Yes, I think that Amazon released this code for the Raspberry Pi: https://github.com/alexa/alexa-raspberry-pi.
    I used that straight away. I did an Alexa project just over a year ago. Now that
    was one of the first published.


    # Components list


    - Raspberry Pi 3

    - 1988 intercom

    - 2.3-inch Visaton FR58

    - 8-ohm full-range speaker

    - Voice HAT accessory board

    - Voice HAT microphone board

    - Arcade-style push button

    - 4-wire cable

    - 5-wire daughter board


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_64_0.png)


    # WIRELESS INTERCOM


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_64_1.png)


    Tight fit

    The microphone in the Voice Kit sits on its own board and turned out to be a "natural
    fit" for the top of the intercom case. However, Martin was able to place the Raspberry
    Pi 3 at the edge, although he was able to expose the HDMI port having the Pi in
    that position.


    Snug speaker

    The speaker from the Voice Kit is 3 inches wide which isn''t going to fit in the
    intercom, so Martin needed to find an alternative that was sturdy and as good
    quality - turned out to be a 2.3-inch Visaton FR58 speaker.


    # Switch to talk


    To keep retro feel, Martin retained the original look of the intercom''s "talk"
    button. He did this by making sure the switch from the unit was held in a retaining
    screw that also had a hidden button place. In case of future, he was able to use
    an existing screw-thread for this important job.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_64_2.png)


    # Google Juice


    In Martin''s video (http://bit.ly/IntercomDemo) he and his 10-year-old daughter
    demonstrate how they used the Kit to activate Google Assistant a click of a "talk"
    button. The intercom has also been used to activate a custom command that triggers
    the lights of all house by activating a WiFi smart socket. The code for the Voice
    Kit has been updated in significant ways since Martin finished his project and
    you can change a few lines of code to activate the Assistant by pressing a button,
    tapping your hands or just saying "OK Google" to trigger a device listening more.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_64_3.png)


    To integrate the Pi-powered intercom with as many smart devices as possible in
    his home Martin had to join together actions from various services he had added
    to this IFTTT account.


    He says putting the intercom together involved a tricky break. Martin says that
    he had the "case" even some problems before getting perfect for the moment. As
    a result he had to use many plastic protrusions inside the case, such as posts,
    with a rotary tool to make sure all the components fitted.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_64_4.png)


