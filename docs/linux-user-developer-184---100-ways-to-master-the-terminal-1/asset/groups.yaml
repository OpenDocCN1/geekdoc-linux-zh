    # 更多内容..


    ## 在 shell 中使用的实用技巧和命令


    ### 通配符


    使用通配符匹配多个文件。使用以下命令将它们复制到当前目录：


    ```bash

    cp *.jpg dest/

    ```

    - `*` 匹配除 / 之外的任意字符序列

    - `?` 匹配单个字符


    ### 处理归档文件


    如果文件包在 `.tar` 之后有扩展名，它们是被压缩过的，`tar` 命令可以处理。


    ```bash

    tar tvf file.tar.bz2

    tar xf file.tar.xz

    ```


    第一个命令列出归包的内容：

    第二个命令将其解压到当前目录。


    ### Windows ZIP 文件


    使用 `unzip -l some.zip` 查看 ZIP 压缩文件的内容。使用 `-d` 参数指定目录。


    ### 搜索


    在文件中搜索匹配模式的行。若要查找文件中的错误，可以使用：


    ```bash

    grep -i err log

    ```


    grep 默认对大小写敏感；使用 `-i` 可以更改此设置。


    ### 查看文件的开头或结尾


    `head` 和 `tail` 命令显示文件的第一行和最后一行。可以使用 `-n` 选项查看指定行数的。


    ```bash

    tail -n 1 somefile

    ```


    ### 什么是文件？


    Linux 不使用文件来区分文件类型，而是查看内容。`file` 命令会告诉你文件包含的数据类型，通常还会提供更多信息——例如图像的尺寸。


    ```bash

    file file2..

    ```


    ### 内容计数


    报告每个文件（或来自标准输入）的行数、单词和字符数，并给出所有文件的总数。如果你对其中一个值感兴趣，可以使用 `-c`、`-w` 或 `-l`。


    ### 读取标准输入


    如果没有文件名，许多命令将通过管道而非文件接受标准输入，这意味着从标准输入（stdin）读取。后者的优点是程序可以同时从标准输入和一个文件中读取数据。


    ### 修改文件


    流编辑器（Stream Editor）用于编辑文本流。它非常强大，也可以用于搜索和替换等简单任务。它可以作用于文件、标准输入上的文本或文件名。要替换 bar
    中所有的 foo 出现处，你可以使用：


    ```bash

    sed -i s/foo/bar/ somefile

    ```


    `-i` 选项用修改后的版本替换文件，而不是简单地输出数据。


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_30_0.png)


    > 快速提示

    > 当使用 sed 的 `-i` 选项直接修改文件时，使用 `.bak` 创建原始文件的备份。


