    # Feature Master terminal


    # Work with the shell


    Important tips to work with your shell easier


    # >_61 Aliases


    The alias creates shortcuts to commands you often use, or add options as default.
    For some instances, do alias rm=''rm -i ''are you sure?'' prevents when deleting
    files. You can see the full list of aliases by running alias on own. If an alias
    has been created with a name of command, you can use the original command by prefixing
    it with \, for example "\rm".


    # >_62 TAB completion


    Start typing a command and press the Tab key; your shell will offer alternatives
    if there is more than one. For example, when you type: ls /somepath/tovery/longfilename
    with


    ```

    ls | /someAltAtinTab

    ```


    # >_63 Running multiple commands


    semicolons to run them in shell.


    ```

    command1; sleep 5; command 2

    ```


    # >_64 Detach your shell


    Use screen to start a new shell from which you can detach and reconnect, from
    a different computer over SSH. screen is very useful for running tasks, especially
    when remotely.


    # >_66 Run one command if another command succeeds


    The && operator looks at the return code of the first command and proceeds with
    the next command if it executed successfully.


    ```

    command1 && command2

    ```


    For the opposite use, ||; the second command is only run if the first fails.


    # >_67 Record your shell session


    Run script and everything you type and its output be recorded to a file. Press
    Ctrl+D when you''re finished and the file typescript will contain a copy of everything
    you did.


    # >_68 Redirection


    Normally read input from the keyboard and output to the shell. You can change
    this with redirection. <somefile reads from the file, >file outputs to the file;
    >>file appends to the end of an file. >2 redirects the standard error, while &2
    redirects both to the same destination.


    # >_69 Learn scripting


    These commands are powerful on their own, but they really come alive when you
    run them in the shell, or even several commands, all at once. Simple scripts are
    easy to write (you can dive into making yours by reading Linux on bash). At most
    basic, they are a simple list of commands to run, one per. Put the line #!/bash
    at the Top to have it recognised as a shell.


    # >_70 Redirect with sudo


    Have you tried to write to a file with sudo echo something >file only to will
    fail on write permissions? That''s because the redirection is running as your
    user -- sudo. The solution is to tee, which outputs to a terminal and a file at
    the same time, like:


    ```

    echo something | tee -a somefile

    ```


    # >_65 History


    The shell maintains a list of the commands you have run, which can be very handy.
    Press the arrow key to scroll back. Press Ctrl+R to search for a command you used
    previously and the shell will show you the most recent matching. Press again to
    see the previous one and so on. Typing !! will run the previous command, so if
    you forgot to use privileges, run sudo !!


    ```

    @zphouch ~/.history 01%

    10 systemctl status sshd

    11 systemctl status dev_sdb1

    12 list-units

    13 list-unit-files

    14 journalctl -f

    15 journalctl -f

    16 history

    17 tree

    18 smartctl -H /dev/sda

    sudo smartctl -H /dev/sda

    d25 df

    df uname -a

    @zphouch ~/.history

    ```


