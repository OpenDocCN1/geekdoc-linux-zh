    Not to be out, the (Open-RISC) project has posted a 13-patch series for its cleanup
    and at latest revision of the work. Stanford Horne''s patches are interesting
    because they include a detailed discussion of ordering semantics for OpenRISC
    and hardware used to ensure they get it right. A lot of effort has recently gone
    into formal analysis of memory models used by modern computer architectures in
