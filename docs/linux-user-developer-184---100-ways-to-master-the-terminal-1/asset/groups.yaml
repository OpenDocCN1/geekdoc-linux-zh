    ## 酷睿（Intel Inside）


    那么，什么是管理引擎（Management Engine）？为什么用户可能想要禁用它？想象一下有一个“黑盒”运行在你 Linux 机器的最低层，它控制着系统的每一个部分，而你无法访问或控制它。这是你拥有的一个英特尔组件，它被称为管理引擎（ME）。ME
    是英特尔 CPU 上的独立处理器核心（MCP），它运行你的操作系统，但它与操作系统的交互中存在漏洞。


    （AMT）（活动管理技术）模块存在于英特尔管理引擎内部。这些 AMT 模块（或英特尔 vPro 开启的功能）用于带外修复工作，并对你的机器进行监控、维护、更新和升级。这意味着，在企业环境中充分使用的带有英特尔
    ME 的机器，是可以被远程访问以进行移除和定位的。然而，禁用或限制 ME 通常非常复杂，这就是为什么 Purism 这样一家制造商会有如此多的硬件配置、硬件熔丝和固件选择。


    最近，在某些活动管理技术（Active Management Technology）中发现了漏洞


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_12_0.png)


    上方：带有板载编程的 SPI 闪存芯片和 IC EEPROM，ZeroPhone 可以作为 x86 设备或自由路由器固件运行


    ## 你有足够胜任的焊接技能来完成这个吗？


    我不认为作为第一个项目是可能的。我认为这是第二次或第三次项目。此外，它的很大一部分是硬焊在树莓派外壳的 Pick & Play Module（即插即用模块）上的。因此我可以提供已经组装好硬焊零件的套件。即便如此，如果没有硬焊技巧，我不认为人们可以自己完成——我可以帮助简化过程。例如，有一个
    GitHub (https://github.com/purism/zerophone) 列出了所有需要的零件列表。所有易于与按钮组装的硬焊零件示例——你只需要帮助并固定按钮即可。如果你能焊接一个组件，你就能以这种形式焊接所有组件。那些购买困难或昂贵的零件，对我来说太贵了，我也不愿意接受过高的价格。


    ## 所以你热衷于将所有组件的价格控制在 50 美元以下吗？


    对我来说，是的，但这是材料成本的大致情况。树莓派现在大约 40 美元，我可能会增加 5 美元的组件，但如果是我的套件并且需要进行包装，那么成本就不会是 50
    美元了。但我希望至少在 50 美元以下，因为这是一个实际的限制，超过这个界限，花钱就很难证明合理。


    ## 对于手机本身，软件的情况是怎样的？你使用的是什么操作系统？


    有比 Linux 更好的操作系统吗？Linux 非常棒，就因为有了树莓派。但树莓派的价值在于软件。它很棒。尽管有一些闭源部分（这是问题），但我认为在谈论单板计算机时，它是目前支持最好的系统之一。他们拥有资源并考虑了用户反馈。


    所以你正在寻找树莓派发行版的精简版本？这意味着桌面环境。这正是我想要的，并且确保在不使用桌面的情况下使用它（默认最小化安装或你直接从 USB 驱动器启动）。现在提到它，就是
    Python。我们没有 X Server，或者供我们使用的 GNOME Linux 库。我认为使用一些小型框架是一个很好的开始。它们都是各种类型的 Android
    框架，但我不知道任何可以使用的 UI 框架。屏幕有一个帧缓冲区，但我开发的内容还没有这种东西。所以我我有选择使用我自己的一些，或者使用所有应用程序并编写以使用所有可用终端库，或者花时间制作某种帧缓冲区。


    '
