    ### > 21 Starting and stopping services

    Your computer runs many services, also as daemons, in the background.


    ### > 22 Status service

    ```

    systemctl status apache

    ```

    it tells you whether the service is running.


    ### > 23 Services style

    ```

    systemctl start apache

    ```

    There are corresponding stop, restart and commands.


    ### > 24 Listing services

    ```

    systemctl list-units

    ```

