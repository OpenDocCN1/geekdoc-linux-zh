    ## Test eight-bit synth keyboard


    ## Download pianohat-password


    If you choose to download the Piano HAT in the previous step, there is now a folder
    named Pimoroni in your home folder containing some examples you can write with:


    Now that you''ve satisfied the Piano HAT working correctly and understand its
    basic functions, it''s time to download pianohat-password, which is a modified
    version of the example script simple-piano.py.


    Connect a speaker or pair of earphones to the Pi. Next, using Terminal, run the
    following command to transform your Pi into an eight-bit synthesizer:


    Open a Terminal on your Pi and run:


    ```bash

    sudo python /home/pi/Pimoroni/pianohat/examples/eight-bit-synth

    ```


    ```bash

    git clone https://github.com/nate-drake/pianohat-password.git

    ```


    Alternatively, copy the necessary scripts over the L&U cover or via Fileilla.
    If you do, don''t forget to place the folder in the same folder as the scripts
    in order to have them tones as you play:


    Before proceeding, run the commands to install the required software for:


    - sudo apt-get install build-essential libffi-dev

    - sudo pip install pyscryptome


    ## Test simple piano and bit tones


    ## Review password entry


    When you are tired of bit-bit tones, press Ctrl-C and run another example Piano
    script:


    Open your Explorer and navigate to the folder named pianohat-password. Right-click
    on the script piano-password.py, then open it using the Thny IDE or the Text Editor.


    - sudo python /home/pi/Pimoroni/pianohat/examples/simple-piano.py


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_68_0.png)


    Press a key to ''make beautiful music''. These tones are generated using the Pygame
    module, specifically the make_sound method to create 8-bit tones with your frequency,
    bitrate and sample rates.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_68_1.png)


    When the script runs, it also plays the notes that will appear on your keyboard.
    The ''instrument'' button launches the procedure confirm_password.


    The value is a list, which is used to store the password as you play. Scroll down
    to the password each time a key is pressed, the relevant number (chord) is displayed
    and this value is added to the list firstpw.


    This script uses WAV files to play the piano notes or drums (use the ''instrument''
    to switch between the two).


    ## Review password input


    Next, scroll down to the procedure confirm_password. This procedure is launched
    when the user presses the ''instrument'' button to set the password.


    In the first instance, the script will display the equivalent to the keys. The
    for loop is used to play back the notes through your speaker every 0.7 seconds,
    to ensure you remember them.


    Use the piano to set the password, then locate it in the file browser. Right-click
    the link to open it with Thny IDE.


    As you see, the script will proceed each time one of the 16 buttons on the Piano
    HAT keyboard is pressed. Piano keys are numbered according to note and octave.
    For instance, the first octave of C is numbered 24.


    If you are about security, you might well use a # to comment out these lines,
    since it''s generally a bad idea security-wise to show your password in plain
    text.


    ## Tutorial Piano HAT


    ## MD5 hash


    The password is then converted from a list (firstpw) to a string (strpw), for
    preparation in before hashing.


    ## 11 Review text description


    Cryptographically inclined readers may have noticed that the piano password generates
    an MD5 hash. This MD5 hash is then converted to another hash using bcrypt. The
    advantage of doing this is that bcrypt automatically uses a unique ''salt'' for
    each password it encrypts.


    ## 08 Review password hashing


    The decode_text procedure first loads your encrypted data from pianowait. If you
    decided to change the location or name of the file holding your encrypted text
    in the piano password, make sure to change it accordingly.


    Once the password has been converted to a string, the piano password-script generates
    an MD5 hash. This MD5 hash is then converted to another hash using bcrypt. Anyone
    who has the same password as you will have exactly the same hash.


    The beauty of encryption is that it''s symmetric - the same password used to encode
    data can be used to decode it. Here the procedure takes the key you entered and
    displays them via the Terminal window.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_69_0.png)


    Since each bcrypt is unique, the salt is saved to a hidden file named pianahash.
    Feel free to change the filename and location if you wish.


    ## 09 Review encode text


    Once the password has been saved, the piano password-script uses the encode_text
    procedure. This makes use of the Pycrypto library. The raw_input (now simply input
    in Python 3) prompts you to enter your secret password.


    The encryption algorithm used is AES, which uses 128-bit (byte) blocks of data.
    The procedure uses a loop to pad the output. If you want to change the scheme,
    you may need to edit it.


    The input is saved to a hidden file pianowait in the same folder as the piano-script.
    Feel free to change this if you wish.


    Both the pianobian and pianof files are read-only to make sure the data isn''t
    corrupted. If you want changes, change the option to r+.


    ## 12 Create your first password


    Having got your password with the Python code, open Thonny Text Editor and open
    Terminal. Make sure your speakers or headphones are connected and run the piano-script
    with:


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_69_1.png)


    - sudo pianobian-pianof-password.py


    The script will come and ask you to enter your notes. Remember, you can move up
    or down the notes using the buttons below the ''Instrument'':


    In the example, we''ve used the five-note melody Enounters of the Third Kind (C,
    G, A, F). You could use any tune that you remember easily. Make a choice of the
    character numbers as a password as.


    ## 13 Encode your message


    Press the ''Instrument'' key when you have finished entering your password. It
    will be stored in the Terminal as a series of numbers corresponding to the buttons,
    as shown above. The script will play back the notes you entered and will go to
    get a hash.


    Now you have your secret. There''s no real limit to what this can be. Feel free
    to encode a password, for a friend, or to a.


    ## 10 Review password confirmation


    Close the password.py script and open decode.py using the Thny IDE. This will
    allow you to view your previously hashed password.


    This procedure essentially works similarly to encode_text. The script loads the
    hashed password and compares it to the notes you entered. If successful, it launches
    the procedure_decode. The decrypted text is displayed below:


    ## 14 Decode your password


    When ready to retrieve your data, reopen Terminal on your PC or connect via SSH
    and then:


    ```bash

    sudo python pianat-password/decode

    ```


    Play your musical password, then press the ''Instrument'' button. If the password
    is incorrect, you''ll see a message to that effect and the script will exit. If
    the password is correct, the script will display the message ''Correct'' and you''ll
    see the decrypted text displayed below:


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_70_0.png)


    ## 15 Changing tones


    Sharp-eyed readers will have noticed that in modifying the instrument to enter
    passwords, you can now choose between drums and piano tones. If you are more of
    a hi-hat than a, you can use drum sounds exactly like. Open Terminal on your PC
    and copy the drums to the piano-password folder.


    ```bash

    cp -r /home/pi/pianat/examples/sounds/ /home/pi/pianat-password/sounds

    ```


    Make sure to move the piano folder outside the folder, by moving it to the trash.
    This ensures there''s only one instrument for the script to decode.


    ## 16 Add to your scripts


    The piano password scripts are functional but as it stands, you can now use one
    encoded script as a Playing passwords


    If you''ve played piano before, Pimon has put excellent tutorial for you. Open
    a Terminal and run:


    ```bash

    sudo Pimon/pianat/examples/learn-to-play

    ```


    Each of the keys on the Piano has a built-in MIDI, simply press a key and you''ll
    hear the sound immediately. the Twinkle, Twinkle, Little Star tutorial has added
    advantage that you can press any other key to change the song or stop it early.


    Once you feel comfortable with the basics, if you want to change the melody and
    chords, visit https://random.bepripimetel.com/. Use the Options button to increase
    the number of notes up to 7 sets. This will allow you to generate a set of unique
    integers. You can use the same numbering system (1–660) outlined in the script
    for notes, or make up your own.

