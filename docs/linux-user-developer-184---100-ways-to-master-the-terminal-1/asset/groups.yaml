    \n## 优点\n\n提供了流畅的用户体验，界面整洁且布局合理。\n\n## 缺点\n\n安全性增强以更高的硬件要求和陡峭的学习曲线为代价。\n\nQubes\
    \ 菜单中的所有虚拟机现在位于一个多标签面板中，你可以在那里控制 Qubes 的各个方面。这影响了半虚拟化的效果，并有助于为每个自定义 AppVM 准备应用程序。Qubes\
    \ 消耗资源比普通发行版多得多。然而，列表并没有显示你的系统是否满足运行支持 Intel VT-x 或 AMD-V 的 Qubes 的最低要求。此外，虽然你可以用\
    \ 8GB 内存完成，但 Qubes 仍然是一个非常沉重的系统。\n\n# 总结\n\n在视觉方面，Qubes OS 安装的开发者通过使界面更加直观来帮助简化管理。这一方向上最重要的变化是删除了\
    \ Qubes 应用管理器，它的功能被认为在其他地方是不必要的。例如，系统托盘中有一个 Qubes 管理器，允许你监控和管理 AppVM。\n\n旧的遗留模式已被现代界面所取代。对新用户有意义的\
    \ Qubes 小部件和应用也得到了清理。\n\n虽然 Qubes 仍然是一个非常沉重的系统，但它并不是为多用户系统设计的。执行 dom 的用户控制控制，并且没有虚拟虚拟化\
    \ OpenGL，因为这将为 GUI 架构引入巨大的复杂性，所以不要期望在自己的 AppVM 中玩 Steam 游戏。\n\n"
