    | | 取消全选 |\n| | 完成 |\n\n> 当我们在浏览器中打开网站时，我们使用端口和套接字的方式与此项目相同\n\n- 选择项目\n- 将项目导入到工作区\n\
    - 隐藏工作区中已存在的项目\n- 添加到项目\n- 小部件： \n\n| < 上一步 | 下一步 > | 完成 |\n\n调用 `Server.accept()`（阻塞）直到其他程序尝试连接端口\
    \ 8009。当连接发生时，套接字被创建，客户端和服务器都可以使用它来往复发送文本。\n\n注意，如果在该 IP 地址的端口上没有服务器程序广播，那么 Java\
    \ 将抛出一个异常。我们的代码需要妥善处理此异常。\n\n下一步是学习如何使用流（streams）来实现。如果你知道如何使用 `System.in` 和 `System.out`\
    \ 在控制台上读写文本，你已经知道如何使用流了。由于套接字的输入输出与使用控制台相同，你只需要将 `System.in` 替换为套接字的输入，将 `System.out`\
    \ 替换为套接字的输出。\n\nJava 拥有一个强大的网络库。`java.net` 包让在所有程序中实现这一点变得简单。在我们的服务器程序，如果我们要在端口\
