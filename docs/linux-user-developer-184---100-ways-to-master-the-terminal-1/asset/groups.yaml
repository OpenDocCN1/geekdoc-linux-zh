    ```


    ### > 01 Listing files


    Lists the contents of the specified directory, or the current one if no argument.
    The -l option enables long format with information. Files are sorted alphabetically;
    use -t to sort by date and -S to sort by size. use -r to reverse the sort.


    ### > 05 Moving a file


    ```

    mv file1 file2

    ```


    Moves, or renames, file to file. Again, if file2 is a directory, it moves file1
    inside it. Note that file2 can be a directory. Add -i or -n to prevent overwriting
    the existing names.


    ### > 06 Deleting files


    ```

    rm file1 file2...

    ```


    Deletes the given files - be very careful when using these wildcards. If in doubt,
    add the -i option to ask for confirmation. You cannot remove directories unless
    you add the -f and -r options - be careful with!


    ### > 07 Creating directories


    ```

    mkdir /dir/subdir1

    ```


    Creates subdirectories in your home directory. This will fail if /dir does not
    exist or if subdir1 does. To avoid errors and create a hierarchy in one go, add
    the -p option.


    ### > 02 Changing ownership


    ```

    chown user:group file

    ```


    The chown command changes the ownership of the given path, which may be relative
    or absolute. With no arguments, it changes to your home directory. cd - to see
    where you are now, pwd.


    ### > 08 Changing ownership..


    ```

    chown user:group files

    ```


    Changes the ownership of the given files to user and group. If you use the group,
    only the user is changed. If you use colon (:) but not the group, the default
    group is changed. You normally need root to run this.


    ### > 03 A more structured listing


    ```

    tree

    ```


    Shows the contents of your home directory (- which is a shortcut for home) in
    a tree layout. This makes it easy to see the relationship of files, but it can
    get very long. Use -L to restrict tree to levels.


    ### > 09 ... permissions


    ```

    chmod +x file

    ```


    Sets the permissions of a file, +x means set for all users, leaving others unchanged.
    You can use multiple options; the last one applies to all, or root, to change
    its permissions.


    ### > 04 Copying a file


    ```

    cp file1 file2

    ```


    Copies file1 to file2; if file2 is a directory, file1 is copied into it. The -p
    preserves timestamps and permissions, otherwise file2 will have the current time.
    If file1 is a directory, use -r option, or -a combines -r and -p.


    ### > 10 Matching directories


    ```

    rsync -a dir1/ dir2/

    ```


    Syncs the contents of two directories. All files in dir1 but not dir2 (or different)
    are copied. To remove files from dir2, add --delete. Add -n to see what will be
    done without doing it.


    img/3eaaaaf4dd2065fe8f3d6fb19ba774d_21_0.png

    img/3eaaaaf4dd2065fe8f3d6fb19ba774d_21_1.png


    ## Networking


    ## Commands for working with the network


    - **11 What is your computer called?** Find your computer''s network name with
    hostname; -f to get the full name including the domain; -a to see your computer''s
    IP address, run it with it.


    - **12 List network information**

    ```

    addr show

    ```

    The ip command is the successor to ifconfig. Both can be used to show information
    about your network interfaces, including IP address, hardware address, status
    and more statistics.


    - **13 Check connection**

    ```

    ping google.com

    ```

    tests the connection to the given host. The numbers returned are round-trip time
    for small packets. If it fails to communicate, it may be that your network is
    down, the server is down or there is DNS problem. Try starting again.


    - **14 Look up an address**

    ```

    dig example.com

    ```

    queries your default name servers for the IP address of the hostname you give.
    You can also tell it to use a different name server, such as Google''s, by using
    8.8.8.8. An alternative program for this is nslookup.


    - **15 Scan for networks**

    ```

    iw -a

    ```

    the iw command finds information about networks in range, such as signal strength
    and whether they are active. To get more information about the network you are
    currently connected, use ifconfig command.


    - **16 Copy to another computer**

    ```

    scp file user@hostname:some/path

    ```

    This uses SSH to copy to a remote computer. If the remote path starts with a /,
    it is absolute, otherwise it is relative to the remote user''s home directory.
    You can reverse the options to copy a remote file to the local system.


    - **17 Log in remotely**

    ```

    ssh user@hostname

    ```

    SSH, or Secure Shell, opens a shell session on a remote computer. If you do not
    specify the user, your current username is used. The password is asked for that
    of the user on the remote computer. You can also add commands to the end of the
    line, which will be run on the remote computer.


    - **18 Sync again**

    ```

    rsync user@hostname:dir/

    ```

    We saw on the previous page, but we can also use rsync to synchronize with a remote
    computer. With scp, you can also use SSH to handle the transfer.


    - **19 Send email for the command line**

    ```

    ns -s "test mail" example.com

    ```

    You can quickly send information from the command line, the -s sets the subject,
    which is quoted if it contains spaces. The body of the email is read from standard
    input, or from a file.


    - **20 Share files**

    ```

    python -m http.server

    ```

    This runs a web server at the current directory on port 8000. There''s no real
    security, but it is a quick and easy way of sharing between computers on your
    local network, especially, if the target device or user can use a terminal.


