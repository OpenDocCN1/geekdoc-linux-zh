    ### 85 Finding files

    Finding one in a terabyte of data makes the proverbial search look small. The
    command searches your file system like this:

    - find . -iname "embarrassing_photo*"


    ### 81 Test your drives'' health


    Drives have a self-monitoring system called SMART (you may need to enable it in
    your motherboard''s BIOS). Use the command to access it with smartctl.


    ### 86 Faster find

    searching the file system is no longer instant. Locate daily a database of files.
    The output is simple and particularly useful when scripting. Use it, ideally with
    root.


    ```

    $ smartctl -i /dev/sda

    smartctl -H /dev/sda

    smartctl -t /dev/sda

    ```


    The first command prints information about your drive, the second reports its
    health and the third runs the test. The tests run in the background, so you can
    continue to use the drive.


    ### 87 Check free space


    The command shows space used by directories and within them, but gives a friendlier
    view. Without arguments, it shows free space left on each disk. Pass a directory
    to find the holes. Use the -x option to report to the current system.


    QUICK TIP

    Sort it

    When a command runs to report something, like df, pipe the output to sort -n to
    sort the list in numerical order. Adding the -k flag will show the kernel driver
    for each drive.


    ### 88 Check free memory


    The command for this is unimaginably free. You can add the -h option to see human-readable
    values - instead of kilobytes, megabytes and gigabytes. It has been running for
    a while with free memory, because Linux uses unused memory for caching; free shows,
    along with how much memory is actually available, in the last column.


    ### 89 Brief information

    Use uname to report one or more of the kernel, OS, CPU type and print. The command
    witha reports specifically components to report on.


    ### 84 Listing all hardware

    lshw command lists all of your hardware. It is long, so you can pipe it into a
    pager like less. You can also output it to HTML with the -html flag, for pasting
    in a web page (or even a wacky HTML email).


    ### 90 Really detailed information

    Install and run inxi to see a detail of your system. The output is brief, but
    you can increase it with -v followed by a number up to 7, or you can tell it to
    show information on particular subsystems.

