    ## Can Atari make Linux gaming big?


    ## Legendary game master identifies a Steam machine-sized hole


    As ever, we know that Atari is crowdfunding a Linux-based console is a big one.
    Since merging with Infographics in 2008, Atari has released – licensed – number
    of classic hardware rivals. Now has come close to meeting expectations, but the
    Atibox might just change that.


    Running Linux, and featuring a customised AMD processor with Radeon graphics and
    various memory configurations, the (optional) wood-panelled console evokes memories
    of the classic 2600. This time, gaming, media apps and web browsing are all possible.


    But why Linux? Here''s the encouraging part: "Most devices have closed systems
    and restrict content. Linux lets us open; you can access and control the OS, run
    games you want, bought from other platforms (if compatible)... This approach means
    that us


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_7_0.png)


    Above The Atibox offers wood-panelled-option of wood panelling


    well as being a great gaming device, Atibox is also a full experience for the
    TV, bringing you streaming, applications, browsing, and more.


    Expected to cost $249-$299, the Atibox is launching on Indiegogo and special editions,
    early access to bonuses being offered to backers.


    In a world where Steam remains largely unknown, and Android console gaming has
    inexplicably failed to make its mark, history''s stood against Atari, but we''ll
    have to wait and see.


    # HARDWARE


    ## GNOME and Plasma back Purism Linux phone-support


    Following news of the Purism Librem 5, two big hitters in the open source world
    have announced their intention to get involved.


    With the first partnership between Purism and KDE in a venture that will ensure
    plenty of resources are supporting the Plasma Mobile porting to the Librem 5.
    This is an ideal team: KDE Plasma will well go up-to-date base on its operating
    system, while Purism is set to fulfill its goals of developing a mobile OS with
    full encryption. But does this mean Plasma Mobile will be the default OS on the
    Librem 5? Time, the initial announcement said that GNOME UI will be embraced by
    October.


    Unsurprisingly, the need to date is the GNOME Foundation, which has expressed
    interest in supporting porting the Librem 5 as a GNOME/GTK phone device. The GNOME
    Foundation is committed to partnering with Purism to create hardware sets, tools,
    emulators, and build awareness around mobile GNOME/GTK for the Librem 5.


    However, the Foundation''s investment with Librem 5 comes at a price: Purism''s
    crowdfunder must meet their goal. If successful, GNOME will get to help "enhance
    GNOME Shell and general performance of the system with Purism to enable better
    on the 5."

