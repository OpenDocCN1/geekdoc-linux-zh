    # File formats


    Converting files from one format to another


    ## Converting document files


    ### Office files

    LibreOffice can run on the command line without GUI between types. For example:


    ```

    libreoffice --convert-to xlsx spreadsheets

    libreoffice --convert-to docx

    ```


    ### Extract images from a PDF file

    pimages extracts images embedded in PDF documents; pdfimages -png somefile.pdf
    will extract all the images and write each to a separate file, with .png extension.
    Use pdfinfo to list the details of images rather than extracting them.


    ### Convert pages

    Pages are written in GROFF; you can convert to PostScript with -t and pipe to
    your printer or maybe already installed.


    ```

    man -t someprog lpr

    man -t someprog ps2ascii

    ```


    ### Image conversion

    ImageMagick convert is used for this; you can even determine file types from the
    filename.


    ```

    convert photo.jpg photo.jpg

    ```

    unchanged, is so very fast. The order of arguments is important as they are likely
    to follow the next file on the command line, so-code must be the input file.


    ### Audio conversion

    ffmpeg converts Vorbis files to MP3 easily. To convert all the files in the current
    directory:


    ### Resizing images

    ImageMagick does it again!


    ```

    convert photo.jpg -resize 200x200 photo

    convert photo.jpg -resize 50% -quality 50 newphoto.jpg

    ```


    ```

    ogg2 -bitrate 256

    ```

    As you expect this convert images from JPG to PNG.


    ### Text files

    use22txt to convert a text file from a Windows-using file, then use22dos for sending
    the file to back.


    The first method resizes the image to fit in a box of given size and converts
    it to PNG. The second reduces both the size and quality to a JPEG image.


    ### Convert to plain text

    Commands pdftext and html2txt extract the text from a format, such as a PDF or
    an HTML file. You may need to play with the options: use PDF layouts the -layout
    option to keep the text readable.


    ### Video converter

    Video formats are complex, sometimes you just want to change the format to watch
    on phone. One of the main programs for video conversion is ffmpeg.


    ### Identify media files

    Mplayer comes with the identify command, which gets all of useful information
    about the contents of a file, like length in seconds and resolution, along with
    codecs and bitrate.


    ```

    ffmpeg -i video.mp4 -codec copy video.mp4

    ```

    This converts the file while keeping the contents.


    > See images

    If you are in a terminal, you can use the ImageMagick command''s display command.


    # Master terminal


    # Process control


    View and manage running programs and processes


    > QUICKTIP

    > Kill a program

    You can kill a GUI program from terminal with xkill. Run the command and click
    on the window you want to kill.


    - 41 List running processes

    ps aux

    This lists all processes running on your computer — you may sort them by the number.
    This sort command needs to be piped to a parser or grep to find what you are looking
    for. Use it with care or killall would terminate all scripts running.


    - 42 Tell a program to reload its config

    Some programs notify you when their files change; others only take note when they
    start. In the latter case, you can use killall to send a HUP signal, which tells
    them to reload.


    - 43 Show resources

    Run top to see a list of processes sorted by CPU usage, along with overall stats
    on processor and memory. Processes are sorted by CPU usage; press keys to sort
    by.


    - 44 Kill a process by name

    killall works like it accepts a program name. This means it will kill all running
    processes with that name.


    - 45 Who started what?

    The output from ps shows many processes running. To see how they were started,
    run pstree, which lists the processes in a tree so you can see the parent process
    of each running program.

    ![](img/3eaaa4dd2065fe8f3d6fb19ba774d_25.png)


    - 49 Find a program''s PID

    Every process has a unique ID which was assigned when it started. You can find
    the PID of a running process with pgrep. This returns a list of PIDs if you have
    several instances, however you can use more than one argument to match the full
    command line.


    - 50 Link in /proc

    The /proc directory contains a wealth of system information, including a directory
    for each process by PID. Some of the information in here is esoteric, but there
    is stuff too; /proc/PID contains the full command line; /proc/children lists the
    processes it launched.


    # Package management


    Install, and remove software on your computer


    - 51 Update packages list

    ```

    apt-get update

    ```

    When using the APT package manager, the update command should be run before anything
    else it syncs the list of available packages with what is available on the servers.


    - 52 Upgrade packages

    ```

    apt-get upgrade

    ```

    A similar-looking command with a very different purpose, it upgrades all installed
    packages to the latest version. It will tell you what it is going to do and ask
    for confirmation, so check the list for any obvious gaps before letting it proceed.


    - 53 Install new packages

    ```

    apt-get install package

    ```

    This installs the package you give it. Additionally, it checks whether any other
    packages are needed for the software (dependencies) and whether you want to install
    them. Replace with remove to remove packages. In some apt-get commands, you can
    use -s to see what would be done without actually installing anything.


    - 54 sudo is your friend

    ![](img/3eaaa4dd2065fe8f3d6fb19ba774d_26.png)

    Installing and removing software requires permissions. In older times we used
    root, which required you to know the root password, enabling them to do anything
    on the system. The current practice is to use sudo, which runs the command with
    root privileges, but only if authorised to do so. sudo is not like root - it can
    be configured to allow users to run specific commands or with specific arguments.
    To run a command, prefix it with sudo:


    - 55 RPM updates

    ```

    rpm -U packagename

    ```

    RPM is the other package management system, used by Fedora and openSUSE.-U updates
    the package to its latest version or installs it if not already on your system.


    - 56 Table of packages

    ```

    dpkg --selections

    ```

    A low-level tool for managing Debian packages. dpkg keeps a table of all the packages
    installed. You can save this to a file or pipe it to the command to save a copy,
    which could be useful when administering a remote computer over SSH.


    - 57 Install packages on RPM

    ```

    yum/dnf update

    ```

    While RPM is still popular, the popular command is so yum and dnf are replacements
    for Fedora and Red Hat, so the command to install a package is yum install package.


    - 58 Update packages

    If this command is followed by the name or more packages, those will be updated
    to the latest versions. If no names are specified, every package installed on
    your system will be updated if an update is available.


    > QUICK TIP

    > USB boot

    GRUB allows you to boot Linux distributions from fast USB attached storage on
    local disks. This is useful when you are on local disks and are short of space.


    - 59 No dependencies needed

    Dependencies can hang around after you have removed the package. apt-get autoremove
    will clean up these on Debian systems; yum/dnf also does the same for RPM.


    - 60 No need to restart

    When a new version of Debian is released, instead of downloading an ISO and reinstalling,
    apt-get dist-upgrade gives virtually the same effect, without the downtime.

