    # 命令行 vs 图形界面


    为了终止语句，我们使用关键字 `esc`。


    如果我们想打印出 `y` 以外的内容，可以将其作为参数传递给 `y`：`yes linux` 将一直打印，直到被强制停止。


    当你习惯了在 OE 中编程时，使用命令行可能看起来很奇怪，但它有自己的优势。正如你所看到的，对于小型任务使用 CLI（命令行界面始终是一个好主意，因为命令行工具在小型任务的编程中非常有效。


    ## 管道：yes 命令

    当我们引入管道时，可能会给人一种印象，认为它们只对按行输入的程序有用，但事实并非如此。每个命令行程序都从 `stdin` 读取输入，因此可以接受来自管道的输入。


    # 处理事物的头尾（head 和 tail）


    例如，许多包管理器（如 APT, YUM, Yum, Pacman）在安装软件前会提示用户输入 `Y`：


    两个非常有用的命令是 `head` 和 `tail`。`head` 打印输入的几行，而 `tail` 打印最后几行。


    ```

    $ sudo apt-get install

    $ y

    ```


    ```

    $ yes | head -3

    ```


    如果你要安装多个软件，你可能不想每次都按 `Y`。幸运的是，Linux 提供了一个可以帮助你的命令。这个命令被称为 `yes`，它会一直打印字母 `Y`，直到你按下
    `Ctrl+C` 停止它：


    在这里，命令行开关 `-n` 告诉 `head` 打印前 5 行输入。


    ```

    $ /usr/bin/starttail -n2

    deallocctt

    ```


    在这种情况下，`tail -n` 打印文件 `/usr/bin/starttail` 的最后 2 行，这是一个在 Linux 发行版上显示 Windows
    系统消息的脚本。练习：运行命令 `head -5` 和 `tail -n5`。这两个命令有什么区别？为什么这种差异是必要的？


    ```

    $ yes

    y

    y

    <Ctrl+C>

    ```


    这意味着你可以通过管道包管理器的输出来跳过确认步骤：


    # 链接命令


    ```

    $ yes | apt-get install

    $ y

    ```


    在这里，一切都会被自动打印。由于 `yes` 无限打印 `y`，无论程序请求多少次确认，都会持续。


    我们使用 `tail` 命令来显示配置的最后（最多）几行


    ```bash

    #!/bin/bash

    /configure

    make install

    ```


    然而，这是不对，因为这三个字符串都可能失败。如果 `configure` 或 `make` 阶段任何一个失败，你就不希望执行脚本剩余部分。


    为了处理这种情况，Bash 提供了双 `&&` 运算符。只有当第一个命令执行成功且退出码为零时，第二个命令才会运行。


    ```bash

    #!/bin/bash

    /configure && make && make install

    ```


    这样，如果脚本 `config` 以退出码 0 失败，剩余步骤将不会运行。


    `&&` 的反向运算符是双管道运算符 `||`。这意味着只有当第一个命令以非零退出码终止时，第二个命令才会运行。


    ```

    mkdir tmp echo "Failed to create directory"

    ```


