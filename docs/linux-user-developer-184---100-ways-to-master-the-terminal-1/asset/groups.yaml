    ## VIDEO EDITOR


    ### OpenShot 2.4

    The easy-to-use cross-platform video editor


    Editing videos on Linux is perhaps a similar point to where gaming on Linux was
    before the arrival of Steam – but not very popular.


    It is strange, considering that unlike the pre-Steam era there are quite a few
    new features in open source video editors within your distribution or its repositories.
    One of the easiest to get with is OpenShot 2.4 which is a stability-focused release
    with an import of the work without any crashing tags. The release also improves
    existing functions and adds a few new ones as well. One of the biggest changes
    is the improvement in how the editor keeps track of changes. By storing the undo/redo
    actions in the file, the new version enables the usability of the timeline. The
    interface exporting capabilities have been expanded and now support JPG, PNG,
    BMP, MP4 and many other video export formats. The major new addition to this release
    is the ability to quickly insert freezes into the video clips without needing
    to Freeze and Freeze & Zoom presets.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_89_0.png)


