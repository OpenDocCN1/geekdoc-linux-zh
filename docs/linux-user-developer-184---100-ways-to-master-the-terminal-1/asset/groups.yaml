- md: "\n# Ghost Detector\n\n## A Pi owner's guide to ghosts and how to catch them\n\
    \nDeploy the Pi, Enviro pHAT and an infrared camera to evidence of anything up\
    \ to a Class 5 Full-Roaming Vapor.\n\n## Dan Aldred\n\nDan Aldred is a Raspberry\
    \ Pi enthusiast, teacher and coder who has temporarily diversified ghost bustin'\
    \ (Because it makes him feel good).\n\n## Resources\n\n- Raspberry Pi\n- Enviro\
    \ pHAT http://bit.ly/EnviroppHAT\n- LISPARO www.lisiparo.com\n- Black Hat Hack3r\
    \ http://bit.ly/HatHack3r\n\n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_71_0.png)\n\
    \nAs that author says, your distinctly deserves learning to know that if a ghost\
    \ or spectre is present, there are environmental changes that can occur. The first,\
    \ the room may feel cold due to a sudden drop in temperature; second, objects\
    \ may move to a new location. Perhaps you may observe a coloured light or a bright\
    \ white light to clear the supernatural world for movement—as a book flying from\
    \ the room or the table rocking or a door opening all on its own.\n\nEnviro pHAT\
    \ is the perfect hardware suite to catch ghosts. It packs four different sensors,\
    \ let us measure temperature, pressure, level, color, 3 axis motion, compass heading\
    \ and light. They state that \"It's ideal for monitoring conditions in your home,\
    \ garage or garden. Set up a web server with Flask and monitor everything from\
    \ anywhere.\" They failed to mention that you can also use it to catch ghosts.\n\
    \nCombine setting up the Enviro pHAT With the Pi Camera, Terminal window and update\
    \ an infrared (IR) LED ring and you have the perfect set to capture photographic\
    \ evidence of your spectral visitors.\n\n## 01 Install the required software\n\
    \nBegin setting up your Raspberry Pi and installing the required software libraries.\
    \ Open a Terminal window and update the OS, then install the Enviro pHAT by typing\
    \ the command on line three. We will download and install the required software\
    \ and example programs. To use an audio warning, add it to file library, mpg321,\
    \ then shut down your Pi by typing the command `sudo shutdown`, unplug the power\
    \ supply.\n\n```\nsudo apt-get update\n```\n\n```\nsudo apt-get upgrade\n```\n\
    \nUse the BMP280 temperature sensor to measure a stop in temperature, the TCS3472\
    \ light and RGB color sensor to pick up changes in light, the LSM303D accelerometer/magnetometer\
    \ sensor.\n\nTutorial files available: filesilo.co\n\n```bash\nsudo curl -s5 https://git.pimoroni/envirobash\
    \ | bash\nsudo apt-get install mpg321\n```\n\nraspi-config and select the required\
    \ setting. Reboot your Raspberry Pi.\n\n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_72_0.png)\n\
    \n## 02 Set up the hardware\n\nNext, to connect the hardware. We recommend that\
    \ you use the Mini Hat Hack3r; although the peanut website pinotyz.com provides\
    \ a wiring guide which means you should attach the Pi Camera Module with the base\
    \ stripping away from the HDMI port. Next, attach the\n\n```python\nfrom camera\
    \ import PiCamera\nfrom time import sleep\ncamera = PiCamera()\ncamera.start_preview()\n\
    sleep(5)\ncamera.capture('/home/pi/Desktop/image.jpg')\ncamera.stop_preview()\n\
    ```\n\n## 03 Wire up the LISIPARO\n\nThe LISIPARO requires only four wires. Attach\
    \ power wire, the one on the right, to the 5V pin (physical pin 2). The two middle\
    \ pins are used for GND connections. Any two of these physical board pins can\
    \ be: 6, 9, 14, 20, 25, 30, 34 and 39. The tutorial uses GPIO 10 (physical pin\
    \ 19). Attach wires required (refer to Fig 1)\n\n## 04 Test the camera\n\nCreate\
    \ a small program to test the Pi Camera. Camera is connected, enabled and working\
    \ correctly. Open your Python editor and copy the program below. This will start\
    \ a camera preview which you can view on your monitor. The camera will take a\
    \ picture and save to Pi desktop. If it does not work, check the camera is connected\
    \ correctly, it is enabled in the Pi settings and that the code is correct:\n\n\
    ## 05 Import the modules\n\nTo create this program, Begin this step by opening\
    \ a new Python file; this will hold the main program for the Ghost Detector. The\
    \ import modules - system, os - to write the image files back to disk. For import\
    \ the Pi Camera functions and line five, the GPIO script. On the last, import\
    \ the main Enviro_pHAT features: light, weather (for the temperature) and motion.\n\
    \n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_72_1.png)\n\n# 5 VOLT\n# GND PINS\n\
    \n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_72_2.png)\n\nFig 1: Wire the LISIPARO\
    \ to 5v power and ground\n\n# Ghost Detector\n#!/usr/bin/python\nimport sys\n\
    import os\nimport time\nfrom camera import PiCamera\nimport RPi.GPIO as GPIO\n\
    from enviro_pHAT import light, weather, motion\n\n# variables for the sensor\n\
    file_name = \"\"\nreadings = []\nz = 0\n\ndef create_ghost():\n    global file_name\n\
    \    GPIO.output(18, GPIO.HIGH)\n    time.sleep(0.2)\n    print(file_name)\n\n\
    # Setup GPIO\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(10, GPIO.OUT)\n\n# Establish\
    \ the current temperature\nstart_temp = weather.temperature()\nprint(\"The room\
    \ is \", start_temp)\n\nwhile True:\n    current_temp = weather.temperature()\n\
    \    print(\"Current temperature is\", current_temp)\n\n## 08 Create a function\
    \ - 1\n\nThe main program works by checking a reading and if it falls within a\
    \ range then it triggers the LED. By naming the function, set it to HIGH. Create\
    \ a circuit on pin 10 and blink them.\n\n## Create a camera function - 2\n\nGet\
    \ the camera function by overwriting the name and setting GPIO 10 to LOW, increment\
    \ the filename by one using the code `file_name=int(file_name)+1`. The `int` converts\
    \ the value so that it can be added to; however, filenames are not integers, so\
    \ you must convert\n\n```python\ncamera.capture(file_name + \".jpg\")\ntime.sleep(3)\n\
    GPIO.output(10, GPIO.LOW)\nfile_name=int(file_name)+1\nfile_name=str(file_name)\n\
    ```\n\n## What is cron?\n\nCron is used as a time-based job scheduler that permits\
    \ you to schedule jobs or shell scripts to run periodically or automate system\
    \ maintenance programs such as disk or administration tasks.\n"
  mdcn: "\n\n# 幽灵探测器\n\n## 树莓派用户幽灵指南及如何捕获它们\n\n部署树莓派、Enviro pHAT 和红外摄像头，以捕捉高达 5 级全漫游蒸汽的任何迹象。\n\
    \n## Dan Aldred\n\nDan Aldred 是一位树莓派爱好者、教师和编码人员，他兼职了幽灵猎人工作（因为这让他感觉很好）。\n\n## 资源\n\
    \n- 树莓派 (Raspberry Pi)\n- Enviro pHAT http://bit.ly/EnviroppHAT\n- LISPARO www.lisiparo.com\n\
    - Black Hat Hack3r http://bit.ly/HatHack3r\n\n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_71_0.png)\n\
    \n正如那位作者所说，你完全应该知道如果幽灵或鬼魂存在，会发生环境变化。首先，房间可能会因为温度突然下降而感到寒冷；其次，物体可能会移动到位置。也许你可能会观察到彩色光或明亮的白光，为超自然世界的活动清理道路——例如一本书从房间飞走、桌子摇动或门自动打开。\n\
    \nEnviro pHAT 是捕获幽灵的完美硬件套。它集成了四种不同的传感器，让我们测量温度、压力、水位、颜色、三轴运动、罗针方向和光线。它们声称：“它适用于监控家里、车库或花园的状况。使用\
    \ Flask 设置 Web 服务器并从任何地方监控一切。”它们没有提到你也可以用它来捕获幽灵。\n\n将 Enviro pHAT 的设置与树莓派摄像头、终端窗口以及更新红外\
    \ (IR) LED 灯环结合，你就有有了一套完美的设备，用来捕捉幽灵访客的摄影证据。\n\n## 01 安装所需的软件\n\n开始设置你的树莓派并安装所需的软件库。打开终端窗口并更新操作系统，然后输入第三行的命令安装\
    \ Enviro pHAT。我们将下载并安装所需的软件和示例程序。若要使用音频警告，请将其添加到文件库 `mpg321`，然后输入命令 `sudo shutdown`\
    \ 关闭你的树莓派并拔掉电源。\n\n```\nsudo apt-get update\n```\n\n```\nsudo apt-get upgrade\n\
    ```\n\n使用 BMP280 温度传感器测量温度停止，使用 TCS3472 光线和 RGB 颜色传感器捕捉光线变化，使用 LSM303D 加速度计/磁力计。\n\
    \n教程文件可用：filesilo.co\n\n```bash\nsudo curl -s5 https://git.pimoroni/envirobash\
    \ | bash\nsudo apt-get install mpg321\n```\n\n运行 `raspi-config` 并选择所需的设置。重启你的树莓派。\n\
    \n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_72_0.png)\n\n## 02 设置硬件\n\n接下来是连接硬件。我们建议你使用\
    \ Mini Hat Hack3r；虽然花生网站 pinotyz.com 提供了接线指南，这意味着你应该将带有树莓派摄像头模块的底座连接到 HDMI 端口。接下来，连接\n\
    \n```python\nfrom camera import PiCamera\nfrom time import sleep\ncamera = PiCamera()\n\
    camera.start_preview()\nsleep(5)\ncamera.capture('/home/pi/Desktop/image.jpg')\n\
    camera.stop_preview()\n```\n\n## 03 接线 LISIPARO\n\nLISIPARO 仅需四根线。将电源线（右侧的）连接到\
    \ 5V 引脚（物理引脚 2）。中间两个引脚用于 GND 连接。这些物理板引脚中的任意两个可以是：6, 9, 14, 20, 25, 30, 34 和 39。教程使用了\
    \ GPIO 10（物理引脚 19）。参考图 1 将 LISIPARO 连接到 5V 电源和地\n\n## 04 测试摄像头\n\n创建一个程序来测试摄像头。打开你的\
    \ Python 编辑器并复制下面的代码。这将启动摄像头预览，你可以从中查看。摄像头将拍摄照片并保存到桌面。如果不起工作，请检查摄像头是否连接、启用且代码正确。\n\
    \n## 05 导入模块\n\n要创建这个程序，从第五行开始导入模块：`sys`, `os`。这将主程序写入磁盘。对于 Enviro pHAT 的功能：光线、天气和运动（针对温度）。\n\
    \n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_72_1.png)\n\n## 06 创建函数 - 1\n\n主程序通过检查读取值来工作，如果它落在范围内，就会触发\
    \ LED。通过命名函数，将其设置为高。在引脚 10 上创建一个电路并让它们闪烁。\n\n## 07 创建摄像头函数 - 2\n\n通过重写名称获取摄像头函数，并将\
    \ GPIO 10 设置为低，使用代码 `file_name=int(file_name)+1` 增加文件名。`int` 转换值以便进行加法；但文件名不是整数，所以你必须转换\n\
    \n```python\ncamera.capture(file_name + \".jpg\")\ntime.sleep(3)\nGPIO.output(10,\
    \ GPIO.LOW)\nfile_name=int(file_name)+1\nfile_name=str(file_name)\n```\n\n## 08\
    \ 编写脚本\n\n# 幽灵探测器\n#!/usr/bin/python\nimport sys\nimport os\nimport time\nfrom\
    \ camera import PiCamera\nimport RPi.GPIO as GPIO\nfrom enviro_pHAT import light,\
    \ weather\n\n# 传感器的变量\nfile_name = \"\"\nreadings = []\nz = 0\n\ndef create_ghost():\n\
    \    global file_name\n    GPIO.output(18, GPIO.HIGH)\n    time.sleep(0.2)\n \
    \   print(file_name)\n\n# 设置 GPIO\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(10, GPIO.OUT)\n\
    \n# 建立当前温度\nstart_temp = weather.temperature()\nprint(\"房间温度为 \", start_temp)\n\
    \nwhile True:\n    current_temp = weather.temperature()\n    print(\"当前温度为\",\
    \ current_temp)\n\n"
