    +   >_41 List running processes

    ps aux

    This lists all processes running on your computer — you may sort them by the number.
    This sort of command needs to be piped to a parser or grep to find what you are
    looking for.


    so use it with care -killall python would terminate all Python scripts running
    on your computer.


    +   >_46 Tell a program to reload its config

    Some programs notify you when their configuration files change; others only take
    note of the file when they start. In the latter case, you can use killall to send
    the HUP signal, which tells them to reload.


    +   >_42 Show resources

    Run top to see a list of processes sorted by CPU usage, along with overall stats
    on processor and memory. Processes are sorted by CPU usage; press keys to sort
    by a different criterion — press H to see options.


    +   >_47 Who opened the file

    If you get an error saying you cannot delete or modify a file if it is open, you
    can see which processes have opened files with lsof. With many of these commands,
    the output is is surprisingly long, but grep is friend in finding the file.


    ```

    kill -HUP 12345

    ```


    lsof | grep somefile

    The fuser command can be used for this.

    Suspend a program


    +   >_43 Kill a process

    Use killall by a process number, gained from ps or top, to send a TERM to kill
    it. This tells the process to shut down cleanly. If it refuses, use the -KILL
    option.


    +   kill -KILL 1235


    +   >_44 Kill a process by name

    killall works like kill it accepts a program name of a process. This means it
    will kill all running processes with that name,


    +   >_49 Find a program''s PID

    Every process has a unique ID, the PID it was assigned when it started. You can
    find the PID of a running process with pgrep program. This returns a list of PIDs,
    if you have several instances of a program running, however, you can use more
    than one argument to match the full command line each. You can also use -f to
    match the full command line, useful for finding the PID of a script.


    +   >_45 Who started what process?

    The output from ps shows many processes running. To see how they were started,
    run pstree, which lists the processes in a tree so you can see the parent process
    of each running program.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_25_0.png)


    +   >_50 Link in /proc

    The /proc directory contains a wealth of system information, including a directory
    for each process by PID. Some of the information in here is pretty esoteric, but
    there is some stuff too; /proc/PID/cmline contains the full command invocation
    line; /proc/PID/children lists the PIDs of the processes it launched.


