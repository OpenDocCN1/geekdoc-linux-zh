    \n### 还有制作过其他项目吗？\n\n是的，最近我几个月前曾尝试组装了一个，但效果不理想，因为尺寸不合适。那是外壳的问题，如果不拆掉的话我做不到。回想起来，我应该仔细看下我写的代码。更改了语言，它是读出华氏温度的。脚本中有几行可以修改，让\
    \ Alexa 执行任何你想让它做的操作。\n\n### 在此之后你脑子里还有其他项目吗？\n\n我真的很想做一些实用的东西。我从未做过机器人，当我做会说话的兔子时，有一些很容易制作的小功能。我想为家里做一些实用的带语音控制的东西，但让东西好看是最困难的部分。所以我需要为它找到合适的外壳。我正在寻找一种能够运行并使用新技术让过时事物焕发生机。\n\
    \n### 你什么时候能看到语音代码的设计？\n\n是的，我想亚马逊发布了用于树莓派的这段代码：https://github.com/alexa/alexa-raspberry-pi。我直接使用了它。我在多年前做过一个\
    \ Alexa 项目。现在亚马逊发布了针对树莓派的这段代码。\n\n# 组件列表\n\n- 树莓派 3\n- 1988 年对讲机\n- 2.3 英寸 Visaton\n\
    - 8 欧姆全频扬声器\n- Voice HAT 板板\n- Voice HAT 板板\n- Arcade 风格按钮\n- 4 线线缆\n- 5 线板\n\n\
    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_64_0.png)\n\n# 无线对讲机\n\n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_64_1.png)\n\
    \n 紧凑贴合\n对讲机内的麦克风位于自己的电路板上。然而，马丁将树莓派 3 放置在边缘，以便暴露 HDMI 接口。\n\n 紧凑扬声器\n套件中的扬声器宽度非常合适。\n\
    \n# 说话切换\n\n为了保持复古感，马丁保留了对讲机“说话”按钮的外观。他通过确保单元上的开关固定在螺丝处来实现这一点。以备将来，他可以使用现有的螺纹来完成这项工作。\n\
    \n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_64_2.png)\n\n# Google 动力\n\n在马丁的视频中（http://bit.ly/IntercomDemo），他和十岁的女儿演示了他们如何通过点击“说话”按钮激活\
    \ Google 助手。对讲机还被用于通过激活一个 WiFi 智能插座触发家里所有的灯。自从马丁完成项目以来，Voice Kit 的代码有了重大更新，你可以修改几行代码，通过按下按钮、拍手或直接说“OK\
    \ Google”来触发设备进行监听。\n\n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_64_3.png)\n\n\
    为了将树莓派驱动的对讲机与尽可能可能的智能设备集成，马丁不得不将他添加到 IFTTT 账户的各种操作组合在一起。\n\n"
