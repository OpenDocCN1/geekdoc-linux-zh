    ### TruPax 9B

    LUUSER FRESH FOSS 你可以使用许多发行版的安装程序来加密整个分区。然而，如果你只是想让几个文件免受窥视，这可能大材小用了。TruPax 也可以加密与
    VeraCrypt 兼容的文件，但既然你可以轻松使用直观的 VeraCrypt 应用，为什么要用 TruPax 呢？首先，如果你加密整个分区，你需要对它将存放的文件大小有一定的了解。一旦创建，此加密容器就无法调整大小，当你发现它没有足够的空间存放文件时，这会格外痛苦。另一方面，当你选择要用
    TruPax 加密的文件时，它会创建一个与选择文件大小相同的容器。不过，如果你以后需要，也可以向加密卷添加更多空间。如果你想在一段时间后解密该卷，你就不需要在发行版组的存储中了。所以如果你获取了容器，只需要调用
