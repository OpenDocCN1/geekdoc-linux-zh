    www.openshotvideo.com


    ## ENCRYPTION TOOL


    ### TruPax 9B

    LEUXUSER FRESH FOSS You can encrypt entire partitions using the installers of
    many distributions. However, this might be an overkill if you just want to keep
    a handful of files away from prying eyes. TruPax can also encrypt files compatible
    with VeraCrypt but why would you use TruPax when you can easily use the intuitive
    VeraCrypt app? For one, if you encrypt an entire partition you need to have some
    idea about the size of the files it''s going to house. Once created, this encrypted
    container cannot be resized, which is particularly painful when you find it doesn''t
    have enough space for the files. On the other hand, when you select the files
    you wish to encrypt with TruPax it creates a container of the exact same size
    as the selected files. However, you can also add some more space to the encrypted
    volume if you need it later on. If you want to decrypt the volume after some time,
    you won''t need to be in the repositories of distributions group. So if you grab
    the container you just need to call the /install.sh to anchor the app to /opt/trupax
    as was the application to the menu. The app''s graphical interface is intuitive
    to operate - select the files and folders you want to encrypt, create the container
    with a name and press the Volume button.


    Save disk by creating encrypted silos that are just the right size for your files.


    Unlike VeraCrypt, TruPax creates encrypted containers that not hidden volumes.


    Great for... Marking multiple files into one encrypted container.

    http://bit.ty/TruPax


    ## SYSTEM RECOVERY


    ### DDRRescue-GUI 1.71

    Use the powers of ddrescue from the convenience of a GUI


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_90_0.png)


    If you''ve ever lost data due to hardware failure, chances you have been asked
    to copy the block-level copies of the failing drive into another input. Use the
    ddrescue utility for recovering **data**. The best thing about ddrescue is that
    it does not write zeros to the output when it runs into errors. So, every time
    you run it on the disk, it skips the gaps without wiping out the already recovered
    data. The only downside is that ddrescue is a command line tool and you might
    prefer a graphical interface to use it instead. DDRRescue-GUI, as the name suggests,
    provides the powerful utility inside a graphical interface. This significantly
    lowers the terry barrier and makes ddrescue accessible to a whole lot of users.
    DDRRescue-GUI is written in Python and has a very low footprint, which makes it
    usable on older computers. The utility''s interface is much like the corporate
    KDisk tool, so workflow is straightforward. Just fire up the tool and select the
    disk that needs to be imaged. For a more effective recovery process, you should
    also specify the location for a log file that tracks the recovery process but
    also comes in handy when you want to restore the image. You''ll find precompiled
    binaries and source on the project''s Launchpad page.


    ## Pros

    The graphical user interface makes ddrescue accessible to inexperienced users.


    ## Cons

    The GUI doesn''t expose all the functionalities of the CLI utility.


