    ## File systems


    Mount and work with internal and external file systems


    ### >_71 The command to mount a file system is:

    - Mount a file system

    - sudo /dev/sdX /mount/point where sdX is the device name. The mount point can
    be anywhere. The file system is usually detected automatically, or you can use
    -t to specify


    ### >_72 Copy a complete file system with dd will make a bit-for-bit copy of the
    disk partition to the given file. it will be as large as the original partition,
    or you may want to pipe the output through compress:


    ```

    dd if=/dev/sdX=/home/user/file.img

    ```


    ### >_73 Another way to mount if a device is listed in /etc/stab, you only need
    to pass the device or mount point fstab. fstab contains your options, the file
    system can be mounted as regular user.


    ### >_74 Mount external drives if a device is listed in /etc/stab, you can mount
    it like, but this might then lose permissions as normal user. Desktop automounter
    takes care of that, as it is mounted at /dev/sdb1 and it is mounted by the regular
    user.


    ### >_75 Free space


    Use df to list the used and available space on all file systems. it normally reports
    space in blocks, but -h gives human-readable values if there is enough space,
    use -i to check for


    ### >_76 Flash data to disk


    Linux caches data, writing it immediately is faster and reduces wear on flash
    drives. if you want to make sure all data is committed to disk, run sync when
    you have just copied a file to flash drive.


    ### >_77 See what is mounted


    The command mount with options gives a more readable output formatted with command-line
    arguments, making a better way of getting something in scripts.


    ### >_78 Mount network drives this is similar to mounting local devices, except
    the device is specified as hostname/path/ for NFS servers or Samba shares. The
    type is -t specifies.


    ### >_79 Repair damaged file system


    if a file system becomes corrupted, you must not be mounted, which means you may
    have to boot from a CD to run it. the contents are important and not backed up
    (why?), make a copy with dd first.


    ### >_80 Add labels to your file systems


    When an automounter mounts a USB stick, it uses the file system''s label as the
    mount point if exists. Otherwise it uses the UUID. you can add a label to an existing
    file system, making it different for each type:


    ```

    label /dev/sd1

    ```


