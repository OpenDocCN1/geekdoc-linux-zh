    \n上个月，我们看到 Bash 脚本可以作为一种专门的编程语言。Bash 脚本功能非常丰富，我们学习了条件判断、变量、循环、命令行参数和函数。\n\n这个月，我们继续之前的课程：Bash\
    \ 脚本有许多强大的结构。我们还将学习更改和分组输出的复杂方法，以及如何使用我们在第一篇文章中遇到的管道（pipelines）来链式命令。我们上个月学到，Bash\
    \ 中的每个命令、函数都会返回状态码，这一事实在整个文中将非常重要。\n\n几周后，你将对 Shell 脚本感到相当熟悉，你应该努力开始编写脚本来加速你日常执行的任务。你可以在脚本中使用广泛的工具；例如，你可以使用\
    \ `xdotool` 程序自动按下按键和点击鼠标。我们将专注于 Shell 脚本的现实应用，从……开始。\n\n在本期中，我们探索了这样一个事实：Linux\
    \ 中的每隔一个命令、函数或脚本都会带数字代码退出，其中 0 表示正常退出（这在某些其他基于数字的退出中是不常见的），其他表示退出。我们将从标准输入读取文本到变量中。`read`\
    \ 正常以代码 0 退出，但当它遇到文件结束符（EOF）时会以代码 1 退出，因为用户按了 Ctrl+D。下面的代码可以轻松地读取一行文本并进行处理。Bash\
    \ 中的 `while` 循环的行为与其他语言中的行为类似。`while` 循环和 `case` 语句用于生产级 Shell 脚本：\n\n```bash\n\
    while read -r line; do\n  if [ \"$line\" != \"exit\" ]; then\n    case \"$line\"\
    \ in\n      exit) break\n      *) echo \"$line\"\n    esac\n  fi\ndone\narray=(${line[@]})\n\
    if [ \"${array[0]}\" = \"ERROR\" ]; then\n  echo \"ERROR: not found\"\n  return\
    \ 1\nfi\nreturn 0\n```\n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_37_0.png)\n\n\
    John Bowers 是编程和计算机科学的大学导师。他喜欢亲自动手，并且每天使用终端。\n\n# 资源\n\n- 运行 shell 的终端（任何 Linux\
    \ 的标准配置）可用文件：of.com\n\n38\n\n每当命令行程序从控制台运行时，它都可以从另一个程序接收输入。例如：\n\n```bash\nwhile\
    \ read line\ndo\n  echo \"You typed: $line\"\ndone\n```\n\n```bash\nuntil curl\n\
    do\n  sleep 5\ndone\n```\n\n```bash\ncase $1 in\n  run)\n    run_main_code\n \
    \   ;;\n  test)\n    run_tests\n    ;;\n  help)\n    display_help\n    ;;\n  *)\n\
    \    echo \"Invalid argument\"\n    ;;\nesac\n```\n\n## Case 语句\n\n在 Bash 中处理处理多个值时，case\
    \ 结构是 switch 结构的更优雅的替代方案。\n\n让我们深入检查一下它。第一行 `case $1 in` 意味着我们根据 `$1` 的值进行分支。这后面跟着一系列\
    \ case 参数，每个参数由一个模式和一些代码组成。例如，如果命令行参数是 `run`，那么\n\n```bash\ncase $1 in\n  run)\n\
    \    run_main_code\n    ;;\n  test)\n    run_tests\n    ;;\n  help)\n    display_help\n\
    \    ;;\n  *)\n    echo \"Invalid argument\"\n    ;;\n  else)\n    echo \"Please\
    \ use 'run', 'test' or 'help'.\"\n    ;;\nesac\n```\n\ncase 语句用于根据命令行参数决定做什么，它会匹配第一个项，Bash\
