    Station X 配备了高达 GT 1050 的专用 Nvidia 显卡的“重型轰炸机”。当然，如果没有市场，这一切将无法实现，Vassallo 对未来充满乐观：“我认为我们正处于
    Linux 软件和硬件的复兴时期。Linux 应用和桌面环境从未像现在这样令人兴奋；我非常期待 Station X 加入像 System76 和 Purism
