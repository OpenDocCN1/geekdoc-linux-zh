    # 短篇故事


    # 肢体贷款


    当他们按住他并强行移除他的肢体时，Christopher 的脖子青青了。他曾反抗，但无是无用的；现在他被遗弃在路边的一辆旧车里，在欠款之前变得无家可归且孤独。


    泪水顺着脸流下，他再无法出现在他们面前。他站在墙边，希望自己能坐起来。


    怎么会变成这样？一年前，他从一家公司获得了一笔廉价的贷款，用假肢替换了他的手脚以获得高薪。一只流浪狗嘴里叼着人类头骨在附近看着。


    “好孩子，他没有背叛他的恐惧。”试图踢掉柔软的面具，并感到一阵抽动。他低吼道。


    “走开，”就在他面前。“你好”


    当他向下看时，他看到这些有足够力量装载重货的生物卡车。


    “滚蛋，”他说。


    “我们可以帮助你，”她蹲下，掉了一个廉价的假手。“老实说，发生了什么？”


    那是水沟里的派对，面前只剩下小的小球。


    “我付不起款项，所以他们没收了我的车、房子和我拥有的所有。哦，他们还标记了腿。”


    其中一个女人摸着并站在他面前。


    “跟得上吗？你会帮吗？”


    两个男人带着里面的 Christopher 离开了。他握住了她的手。然后我们其他人工作，你，吗？”


    “Kenneth”


    “你想做什么？”


    “不。必须付钱的。我不能承担你的费用，”她和我们并肩走时问道，“我们是慈善机构，绝对不能照顾你。现在面对台阶。”


    “是吗？如果我不相信你。”


    当他们把他抬进货车后后，他看到了地板上的手臂和腿。


    “它们是我的，”他说。


    “Shane，”他说，“你是独特的，没收的它们没有商业价值。它们有……”


