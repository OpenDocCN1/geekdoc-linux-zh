    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_86_2.png)\n\n## 性能与效率之间的平衡极具沉浸感\n\n银色外壳可能被误认为是苹果的产品。贴合程度和效率非常出色。\n\
    \n## 优点\n\n性能出奇地好，配置均衡，辅以丰富的优质选择和慷大的接口。\n\n## 缺点\n\n键盘需要一些时间适应，风扇运行可能比较激进；价格相当昂贵。\n\
    \n...将桌面 PC 放入微型机箱中，而制作成功产品的关键是在适当的地方进行妥协，以提供良好的体验——Pocket 的核心是 Intel Atom z7250\
