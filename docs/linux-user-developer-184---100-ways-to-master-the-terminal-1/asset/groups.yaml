  mdcn: "\n\n# Java 教程\n\n第三部分\n\n## 学习 Java：将你的 Java 游戏广播到网络\n\nJohn Gowers\n他是一位编程与计算机科学的大学导师，深耕\
    \ Java。他热于在他获取的每一个设备上安装 Java。\n\nJava 拥有一个功能齐全的网络库，允许程序在不同的计算机之间通信\n\n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_45_0.png)\n\
    \n# 资源\n\n- OpenJDK 1.8 JDK openjdk.net\n- JavaFX javafx.net/projects/openfx\n\
    - Eclipse IDE www.eclipse.org\n- Telnet 客户端 www.github.org/software/telnet\n\n\
    教程可用文件 files.co.uk\n\n当我们思考计算机网络时，我们想的是万维网，我们可以用它发送消息、观看视频或进行视频通话。事实上，我们在设备上进行网络连接只需要通过一种名为“套接字”（socket）的设备将计算机连接到其他计算机，并使用套接字来发送文本。我们发送的文本是\
    \ HTML 格式；它并不一定加密，但在所有情况下都使用了相同的机制。Java 语言拥有丰富的网络库，允许我们利用这些特性为我们自己的程序服务。\n\n在本教程的结束时，你已经在单台计算机上构建了一个冒险游戏。我们将将其变为一个网络游戏，其中服务器在一台计算机上，而用于游戏的图形客户端可以在另一台计算机上。我们可以在此基础上构建，制作出游戏的多人在线版本。\n\
    \n安装完成后，如果 Eclipse 已经打开，请确保重启它。如果你已经完成了上个月的教程，上个月的重要部分是这个月我们将在 Eclipse 中导入项目并将其复制到拷贝磁盘中。要做到这一点，打开\
    \ Eclipse 并从菜单栏顶部选择 File > Import... . 。在弹出的图中，选择 General > Importing Projects\
    \ into LWBD Disc，然后点击‘Browse...’ 并导航到该路径。点击‘Finish’ 导入项目。\n\n我们没有为本期提供任何额外的代码：直接使用上个月的代码即可。\n\
    \n# 网络概念\n\n本教程的计划如页面顶部的图所示。我们将程序分为两个独立的部分：“客户端”和“服务器”。服务器将通过名为“套接字”的设备与客户端通信，套接字是一种允许文本通过网络从一个程序流到另一个程序的通道。我们想展示如何设置我们的网络，以便在不使用现有代码的情况下实现这一点；现在我们不再直接与游戏通信，我们的\
    \ GUI 现在将与此处的套接字通信\n\n# 入门\n\n本教程不需要任何特殊软件，但如果你在这个月加入我们，你应该确保在你的系统上安装了 OpenFX。寻找一个名为\
    \ openfx 的包。一旦你拥有了它，游戏将使用套接字进行输入和输出。\n\n网络上的计算机通过称为 IP 地址的数字进行标识；例如 185.30.157.1。计算机还有\
    \ 65,536 个“端口”，由用于发送和接收信息的数字标识。我们通过用冒号分隔 IP 地址和端口号来引用特定的特定的机器；例如 185.30.157.1:\n\
    \n如果一个程序想要广播到某台机器上的特定端口，我们称之为“服务器”。如果客户端想要执行工作，我们需要第二个程序，称为“客户端”，它将与服务器通信。客户端可以运行在与服务器相同的同一台计算机上，也可以运行在不同的计算机上。由于客户端知道\
    \ IP 地址和端口，它可以尝试建立连结。如果服务器接受了连接，套接字就会产生，客户端和服务器就可以通过它交换信息。\n\n这是计算机网络的基础通用原理。当我们在浏览器中打开网站时，我们与该网站构建的端口建立一个套接字。Web\
    \ 服务器被配置为使用 HTML、CSS、JavaScript 等文本格式通信，而我们的浏览器被配置为将这些格式解释为网页。\n\n# 导入项目\n\n左：Eclipse\
    \ 方便从归档文件导入项目\n\n![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_46_0.png)\n\n| 选择根目录：\
