    # PyDev


    Caught between being an open plug-in and a proprietary IDE


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_82_0.png)


    - You can use PyDev by plugging it into Eclipse or via a standalone crowdsourced
    Eclipse IDE


    ## Coding essentials


    Just because PyDev is as a plug-in, don''t assume it''s lacking features. You
    get the usual IDE conveniences with PyDev that you get with other standalone editors
    such as syntax highlighting, code completion/folding. On top of it, PyDev includes
    a remote debugger to debug programs as well.


    ## Assistance


    Similarly, PyDev provides code analysis features to help avoid indent errors in
    your programs. PyDev also includes code referencing that enables you to quickly
    find custom methods. With PyDev you also get wizards for Google App Engine and
    Django projects. Also integrated is the PyLint code quality checker.


    ## Plug-ins


    Since it is distributed as a plug-in to the various (and most monstrous) Eclipse,
    you can take advantage of Eclipse''s marketplace to add new features. Support
    for version control systems like Git can be added via plug-ins. However, many
    plug-ins will only work for Eclipse''s primary programming language, Java.


    ## Usability


    Setting up PyDev requires more effort than the other IDEs, since it involves installing
    the Eclipse. The PyDev interface is bolted onto Eclipse''s multi-window interface
    which is chock-full of icons. Unless you are already used to working with Eclipse,
    getting with its interface does not offer the same returns as the other IDEs.


    ## Overall


    Despite being available as a plug-in, PyDev can stand up to the other standalone
    editors in its group test. However, all things considered, it''ll only be useful
    to people who work with Eclipse.


    # Thonny


    An approachable and feature-rich IDE that has a sparse appearance


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_82_1.png)


    - Thonny stands out from the others with its smattering of buttons and a mere
    window of menus, but plug-ins are on hand if you need them.


    ## Coding essentials


    It has much experience that a beginner needs. Code completion works well and syntax
    highlighting. Its debugging is simple and effective through so you can look into
    how expressions are evaluated. Function calls are displayed within a window, with
    several local variables and code type.


    ## Assistance


    Because of its goal, you don''t expect the same conveniences from Thonny as other
    editors. Thonny has limited occurrences to help with user types and also distinguishes
    local variables from global. When you use object-oriented code, you can select
    objects in the Variables window and use Object Inspector to check their type and
    attributes.


    ## Plug-ins


    Unlike Eclipse, Thonny however has a simple interface for fleshing the editor
    with plugins. There is currently one plug-in that supports microbit. Thonny also
    has a graphical interface to Thonny''s package manager that allows you to install
    additional packages and libraries.


    ## Usability


    This is area where Thonny truly runs. It''s very easy to install and absolutely
    no learning curve in the IDE. You can fire up Thonny and starting out code, irrespective
    of your skill level. The IDE has a simple menu structure with options and you
    can add new features to the interface with your experience and requirements of
    your code.


    ## Overall


    By far one of the most approachable IDEs that will help you learn skills. Its
