    # 信息收集


    信息收集是所有工作的第一阶段。欢迎来到信息收集（带报告），尽管它是任何渗透测试任务中最枯燥、最最重要的阶段。在这个阶段，你将同时执行被动发现和主动发现。这些工具利用公共来源收集信息，而不触碰目标系统。此外，作为足迹，某些工具会留下某种程度的交互，这被称为“指纹识别”（fingerprinting）。


    大多数渗透测试人员（包括你）发现大部分时间都花在这里了。无论你选择 Google 还是 Bing，你都可以使用许多知名工具来自动化（在程度上）提取和排序这些信息。诸如
    Recon-ng (http://github.com/recon-ng)、Spider (http://spider.net/) 和 Maltego (http://maltego.com/)
    等工具被证明非常有用。这些工具利用了 Censys、Shodan 和 Twitter 等在线服务（通过它们的 API）。所以，最好拥有有效的账户。


    上方：**OSINT 技术**允许你对目标进行被动发现而不会留下任何痕迹。


    **右集成工具**（如 Nmap）非常适合执行指纹识别和漏洞评估。


    要做的第一件事是选择你的工具（如 Kali Linux、渗透测试发行版）并能够编写你的敏感数据。渗透测试人员在任何时候可能执行多项评估，因为这些评估必须与彼此隔离。


    一旦你对系统和目标有了良好的理解，就可以对可能的攻击建模。想象发现了一个具有公共 IP 地址的客户端。遗憾遗憾的是，没有快照。使用 VPN 进行评估的渗透测试人员必须确保未分类的流量不会从他们的接口泄漏。如果你有点被害妄症，就设置代理规则。在收集的数据中，可能会出现一些“唾手可得的果实”：遗留系统（教程，4）、开放的
    SMTP 中继、一些仍在运行的旧 CMS。


