    ## 11 复习文本描述


    对密码感兴趣的读者可能注意到，钢琴密码生成了一个 MD5 哈希值。然后该 MD5 哈希值使用 `bcrypt` 转换为另一个哈希。这样做的好处是 `bcrypt`
    会为其加密的每个密码自动使用唯一的“盐”（salt）。


    ## 08 复习密码哈希


    `decode_text` 过程首先从 `pianowait` 加载你的加密数据。如果你决定更改存储钢琴密码中加密文本的文件位置或名称，请确保进行相应的更改。


    一旦密码转换为字符串，`piano password-script` 就会生成一个 MD5 哈希值。然后该 MD5 哈希值使用 `bcrypt` 转换为另一个哈希。任何与你拥有相同密码的人将拥有完全相同的哈希。


    加密的美之处在于它是对称的——用于编码数据的相同密码也可以用于解码它。在这里，该过程获取你输入的密钥并通过终端窗口显示它们。


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_69_0.png)


    由于每个 `bcrypt` 都是唯一的，盐被保存在一个名为 `pianahash` 的隐藏文件中。如果你愿意，可以随时更改文件名和位置。


    ## 09 复习编码文本


    一旦密码被保存，`piano password-script` 就会使用 `encode_text` 过程。这利用了 `Pycrypto` 库。`raw_input`（在
    Python 3 中简单为 `input`）提示你输入秘密密码。


    使用的加密算法是 AES，它使用 128 位（字节）块的数据。该过程使用循环来填充输出内容。如果你想更改方案，可能需要编辑它。


    输入被保存到与钢琴脚本相同文件夹的隐藏文件 `pianowait` 中。如果你愿意，可以随时更改此处。


    `pianobian` 和 `pianof` 文件都是只读的，以确保数据不损坏。如果你想进行更改，请修改选项。


