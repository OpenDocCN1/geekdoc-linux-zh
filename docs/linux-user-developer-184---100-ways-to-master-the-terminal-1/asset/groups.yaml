    Updates released for three security-focused including pen-testing tools, anonymous
    browsing and forensics software.


    ### Subgraph OS


    Debian-based Subgraph OS offers several weekly updates for anonymity including
    a hardened kernel and firewall, while internet traffic is routed to Tor. Everything
    encryption is supported, while the file system is also encrypted.


    ### Parrot Security OS


    Based on Debian, Parrot Security OS includes standard features for penetration
    testing, cryptography, ethics, and other tools. It shares many tools with Kali.


    ### Kali Linux


    Another Debian-based security-focused Linux penetration testing platform with
    many tools, Kali Linux also supports ARM devices and includes four desktop environments.


