    # Lorelei 的故事


    一个五岁女孩如何通过众筹获得了一个机器人假肢（在她的家人和许多友好陌生人的帮助下）


    - Bodo Hoenen

    是一位社会企业家，开源创新组织 Devix 的创始人。


    **核心信息**

    一对父女团队为一条机器人假肢的设计众筹了资金，并为女儿制作了一个假肢，她的女儿因为一种罕见疾病导致肩部和左臂瘫痪。


    谁在激励 Bodo？

    Bodo 说，在 Devix，他受到了两个人的影响：一位是获奖的漫画家，另一位是政府作家、倡导创业精神的 Leadleader。


    除了 TED-Leadleader 外，另一位是 Clay Shirley。Clay Shirley 被 TED 创始人 Anderson 描述为对互联网“技术”产生社会经济影响的“思考者”。


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_17_0.png)


    急性脊节性髓炎 (AFM) 是一种影响神经系统的疾病，康复率仅为 2%。


    这样的诊断是残酷的，即使当他们涉及到自己的孩子的帮助时，这也是 Bodo Hoenen 和他的家人在 2016 年夏天面临的局面，当时他们发现她患有 AFM。这种疾病影响脊髓，在
    Lorelei 的案例中导致了她的肩部和左臂瘫痪。“假肢是唯一有帮助的东西，”Hoenen 说，“但从结果来看，只有两个孩子有了显著的康复……”


    捕捉大脑发出的信号并将其转换为控制执行器和 VR 的信息。

