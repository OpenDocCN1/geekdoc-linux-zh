    You''ll need an Arduino board, a way of connecting to your internet router and
    SD card capability. For this tutorial, we use the Arduino Leonardo and the Ethernet
    shield. You''ll need to insert the shield into the Arduino''s header pins and
    connect your to the router with an Ethernet cable. You''ll also need to power
    your Arduino - but for now, you''ll need to power it with a USB cable.


    You should log into your router, identify your device''s IP address and check
    that you have configured it correctly. If you don''t have the administrator login,
    you might be able to determine its network address using nmap or arp -a. At the
    end of the example "WebServer" sketch under Ethernet Library sketches), you''ll
    need to change your IP and MAC addresses to match.


    The benefit of using an Arduino and programming your server is that you can control
    other commands of your while from an up to date device, controlling items around
    your home. You could be controlling a kettle, the garage door, or even controlling
    motors on some kind of robot you could build yourself, feeding back to the server
    on your browser. Arduino server can be the gateway into your world.


