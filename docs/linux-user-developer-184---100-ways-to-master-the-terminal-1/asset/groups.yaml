    这很奇怪，因为与非-Steam 时代不同，你的发行版或其存储库中的开源视频编辑器中已经有了相当多的新功能。最容易获取的之一 OpenShot 2.4，这是一个以稳定性为中心的发布版本，导入工作时不会出现任何崩溃标记。该版本还改进了现有功能，并添加了一些新功能。最大的变化之一是改进了编辑器跟踪更改的方式。通过在文件中存储撤销/重做（undo/redo）操作，新版本使得时间线更具可用。界面导出功能已经扩展，现在支持
