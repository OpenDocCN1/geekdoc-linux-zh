    ## Station X 发布 Lifeline 笔记本电脑


    新款 Linux 笔记本是经过精调的 Manjaro 驱动设备


    位于 Bletchley 的 Station X 正在推出其 Lifeline 笔记本电脑的 Manjaro 特别版。该产品将于10月发售，配备第七代 i7
    处理器、8GB至32GB DDR4 RAM、带有第二个硬盘位的500GB SSD以及 Intel 610/620 显卡，售价1250镑。


    Station X 并非推出自己的系统，而是与 Linux 世界现有的原生开发团队合作，为目标设备提供高度定制的发行版。它还支持超过26种其他设备。


    Simon Vassallo 告诉我们，“Manjaro 特别版是由 Manjaro 团队从零开始设计的——这意味着它不仅仅是一个版本，而是从底层开始完全完善的体验。我们从6月起一直与
    Manjaro 团队合作，为 Manjaro 社区以及整个整个 Arch 社区创造一些特别的东西。”


    Vassallo 表示，这个定制版本涵盖了“调整过的内核设置、电源和性能设置，甚至是音频设置，以确保机器获得最佳电池续航、动力和体验。Manjaro 软件特别版将通过
    Manjaro 仓库维护和更新——因此机器也将获得更新。此外还将提供软件支持和自定义资产，如‘独家主题、壁纸’。”


    其他团队（如 Debian 和 Solus）正与 Station X 合作开发定制发行版，这些版本将出现在 Station X 的“世界 Linux”ARM架构计算机集群的其他设备上。除了轻量级的
    Lifeline，网站还推出了 Harrier 和 Hardware Blender（硬件搅拌机）。


    “我们对命名非常谨慎，”Vassallo 说，“因为我们使用特定时期的特征来反映每台机器的品质和属性。”作为一个例子，他提到了 Lancaster（兰开斯特战斗机）。


