    RISC-V is a modern, royalty free, fully open source computer architecture that
    was developed as an offset of research at the University of Berkeley in California
    and is now backed by both a growing community and a non-profit foundation. RISC-V
    is available as a specification as well as software modules (GEMU) to help design
    source code that can be used to ''synthesize'' logic into FPGAs (programmable
    gate arrays) in real chips and


