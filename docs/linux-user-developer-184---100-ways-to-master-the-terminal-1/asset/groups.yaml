    # PyDev


    徘于开源插件与私有 IDE 之间


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_82_0.png)


    - 你可以通过将 PyDev 插件到 Eclipse 中或通过独立的众包式 Eclipse IDE 来使用它。


    ## 编程核心功能


    仅仅因为 PyDev 是以插件形式存在的，就不要假设它缺少功能。通过 PyDev，你可以获得与其他独立编辑器相似的常用 IDE 便捷功能，如语法高亮、代码补全/折叠等。在此基础上，PyDev
    还包含一个远程调试器，可用于调试程序。


    ## 辅助功能


    同样，PyDev 提供了代码分析功能，帮助避免程序中出现缩进错误。PyDev 还包含代码引用功能，允许你快速找到自定义方法。使用 PyDev，你还获得了针对
    Google App Engine 和 Django 项目的向导。此外，还集成了 PyLint 代码质量检查器。


    ## 插件


    由于它是作为插件分发给各种（也是最庞大的）Eclipse 的，你可以利用 Eclipse 市场来添加新功能。可以通过插件添加对 Git 等版本控制系统的支持。然而，许多插件仅适用于
    Eclipse 的主要编程语言 Java。


    ## 可用性


    设置 PyDev 比其他 IDE 需要花费更多精力，因为它涉及到安装 Eclipse。PyDev 的界面是外接到 Eclipse 的多窗口界面上的，而该界面密密麻麻全是图标。除非你已经习惯了使用
    Eclipse，否则熟悉它的界面并不会像其他 IDE 那样的回报。


    ## 总体


    尽管可以作为插件使用，但 PyDev 在其同类测试中完全可以与其他独立编辑器相衡。然而，考虑到所有因素，它只对使用 Eclipse 的人有用。


    # Thonny


    一个平易近人且功能丰富但外观简洁的 IDE


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_82_1.png)


    - Thonny 以其零星的按钮和单一的菜单窗口脱颖而出，但如果你需要，也有插件可用。


    ## 编程核心功能


    它拥有初学者非常需要的许多经验。代码补全和语法高亮运行良好。它的调试简单有效，因此你可以查看表达式是如何求值的。函数调用显示在一个窗口内，带有几个局部变量和代码类型。


    ## 辅助功能


    由于其目标，你不会期望 Thonny 提供像其他编辑器那样的便利。Thonny 帮助用户类型的次数有限，并且区分局部变量和全局变量。当你使用面向对象的代码时，可以在变量窗口中选择对象并使用对象检查器（Object
    Inspector）检查它们的类型和属性。


    ## 插件


    与 Eclipse 不同，Thonny 拥有一个简单的界面来通过插件丰富编辑器。目前有一个支持 microbit 的插件。Thonny 还具有指向 Thonny
    包管理器的图形界面，允许你安装额外的包和库。


    ## 可用性


    这是 Thonny 真正胜出的领域。它非常容易安装，且 IDE 中完全没有学习曲线。你可以启动 Thonny 开始编写代码，无论你的技能水平如何。IDE 具有简单的菜单结构并带有选项，你可以根据自己的经验和代码需求向界面中添加新功能。


    ## 总体


    到目前为止，它是最容易上手且能帮助你学习技能的 IDE 之一。它的功能集与其教学学习者的目标保持一致，它的调试器值得一提。


    # 评测 Python IDE


    # 简要：对比并总结我们的结论


    | | Eric | PyCharm CE | PyDev | Thonny |

    | --- | --- | --- | --- | --- |

    | 编程核心功能 | 整合了你可能需要的所有编程功能，甚至更多 | IDE 充满了许多实用的功能，可以帮助你高效编写代码 | 以 Eclipse 插件形式提供，但仍然很复杂
    | 拥有所有能帮助新用户掌握 Python 的功能 |

    | 辅助功能 | 包含帮助创建 GUI 元素和管理大型项目的功能 | 仅比 Eric 为编码者提供的便利性稍差一点 | 分析功能和创建 Django 项目的向导
    | 不像其他编辑器那样提供通用的编程辅助 |

    | 插件 | 提供了一个包含超过 40 个插件的近乎完整的列表来帮助 IDE | CE 版本提供了许多插件，某些可能无法与 Python 配合 | 作为其他
    IDE（Eclipse）的插件有插件 | 目前仅提供插件，但 pip 包管理器至关重要 |

    | 可用性 | 编辑器最弱的点，将迫使用户通过入门 | 界面比 Eric 好，但仍有其特殊之处 | 设置比其他的都更容易且直观 | 与其他相比，它让开始编码变得非常容易
    |

    | 总体 | 一个面向未来的 IDE，可以在用户的整个使用周期内运行，但并不完美 | 一个界面复杂的复杂的 IDE，对大多数用户易于使用 | 作为 Eclipse
    的插件，PyDev 对 Eclipse 用户来说其实很有意义 | 一个帮助新来者的聪明 IDE |


    # 获胜者是 ...


    # Eric


    你可能会对我们的选择感到惊讶，特别是考虑到 Eric 相当繁忙且不直观的界面。与其他一些编辑器不同，我们倾向于让 IDE 提供更多美观的特性。你无法避免翻阅手册以发挥其最大作用。从
    Thonny 开始的所有编辑器都需要花时间阅读文档来掌握各自的细微差别。Eric 需要休息了，因为它的界面功能会导致它流失大量用户。Thonny 因为关注有限而被排除。它是
    Android 开发最好的 IDE，但提供的功能恰好不会让你感到压力。对于不熟悉或不习惯 Eclipse 的人来说，PyDev 并不。


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_83_0.png)


    - Eric 包含了多种偏好，允许你自定义各个方面。


    这就留下了 PyCharm 和 Eric。虽然 PyCharm 的界面更直观，但你可以在不阅读文档的情况下使用。然而，一旦你花些时间适应，你会发现 Eric
    比 PyCharm 或任何其他编辑器都更全面。这对于创建图形界面尤其如此。你还可以使用该 IDE 协作进行项目。


    Mayank Sharma


