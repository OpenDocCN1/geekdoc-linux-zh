    So, what is Management Engine and why might users want to deactivate it? Imagine
    having a "black box" operating at the lowest level of your Linux machine with
    control over every part of the system and you couldn''t access this or control
    it. It is an Intel that you''ve got and it''s called Management Engine (ME). ME
