    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_70_0.png)


    # 15 Changing tones


    Sharp-eyed readers will have noticed that in

    modifying the instrument to enter passwords,

    can now choose between drums and piano

    tones. If you are more of a hi-hat than a

