    在制造过程中，我的预算不太可能耗尽。是的，这更多是关于现实性。


    我认识的两个人已经在尝试组装当前版本了，还有六个人将组装下一个版本。我已经为他们购买了零件，现在我正在进行 PCB 设计。因此，当组装成为真正的首要任务时。归根结底，这是一项无人提供的服务，但它是完全可以实现的。


    ## 你成功地让 ZeroPhone 支持了 3G


    它基本上只需要将 2G 替换为 3G 即可，这是可行的，但我受限于正在使用的 2G 芯片的尺寸，我正在尝试设计这些尺寸。两周前，当我完成 3G 升级板时，我遇到了一些局限性，我正在考虑如何绕过它们，要么增加手机的尺寸，要么基本上让某个部分稍微凸出来。我明智地找到了解决方案，以便在下一个版本中制作
    PCB。但它是众筹的优先考虑事项之一。


    对于想要获取 ZeroPhone 或对该项目感兴趣的人，有一份调查卷。我收集了一些回复，我认为，由于 3G 是最受需求的功能，我必须在众筹中提供 3G，否则将是一个非常严重的劣势。


    ## 你还为 ZeroPhone 添加了插件。能告诉我们关于它们吗？


    我不确定树莓派提供的接口是否可行，但有很多免费的接口。我甚至将这些接口连接到 ZeroPhone 的侧面，我在想，为什么不做一些对编程和闪存（flashing）用的用的子呢？然后我明白了，例如，我可以设计一个带有
    Bios 芯片电路甚至 Intel 内部盒（或类似东西）的板。


    我可以将其插入 ZeroPhone 扩展板中，并使用可用的 BIOS 编程工具来读写内存内容，在我在使用它们时，可以将其用于 ME Cleaner（一个帮助
    Purism 的实用工具）。我还可以修改 BIOS 镜像并刷回手机，我为此需要一台笔记本电脑。这是我的侧边项目之一，我意识到 ZeroPhone 也是一个非常强大的硬件黑客平台，那些额外的端口会让它比现在更好，这是我可以做的，让硬件黑客变得更加用户友好。


