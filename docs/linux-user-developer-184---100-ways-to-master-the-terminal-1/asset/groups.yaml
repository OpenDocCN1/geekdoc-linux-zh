    in the actual form of real integrated circuits from a number of firms. A startup
    SiFive is working on many aspects, including low-cost development kits. Palmer
    D recently released version 9 of the patches to enable Linux kernel support for
    testing showcase of the ''asm-genric'' reference used for new arch and ports as
    the unofficial gateway to new hardware. If merged, RISC-V will be enabled upstream
    in Linux 4.15.


