    the team to move away from PV. The forward-hardwards architecture is supported
    by kernels that nearly all support Second Level Address Translation (SLAT). However,
    this is a gap-stop measure and Qubes OS will still support PV VMs for now, which
    provides the best characteristics of all virtualisation options.


    # Cons


    The security enhancements come at the price of higher requirements and a steep
    learning curve.


    All the VMs in the Qubes menu list now in a multi-tabbed panel where you can control
    various aspects of Qubes OS. This affects the effect of the parvirtualisation
    and helps prepare a separate app for each custom AppVM. Qubes has alone much more
    resources than a typical Linux distribution. The list shows, however, not whether
    your system meets the minimum requirements to run Qubes with support for Intel
    VT-x or AMD-V. Also, while you can get it done with 8GB of RAM, Qubes still feels
    like a very heavy--weight system.


    # Summary


    On the visual side of things, the developers of a Qubes OS installation have helped
    to simplify the management by making the interface more intuitive. The most important
    change in this direction is the removal of the Qubes App manager, whose duties
    have been deemed to be unnecessary in other places. For example, there''s a Qubes
    manager in the system tray that enables you to monitor and manage AppVMs.


    Old legacy patterns have been replaced by a modern interface. Qubes widgets and
    apps that will make sense to new users have also been cleaned up.


    While Qubes still feels like a very heavy-weight system, it isn''t designed as
    a multi-user system. The user who does dom controls the controls and doesn''t
    virtually virtualise OpenGL, as that would introduce a great deal of complexity
    to the GUI infrastructure, so don''t expect to play Steam games within an AppVM
    of its own just.


    Mayuresh Sharma


    it''ll make you virtually immune to attacks.


