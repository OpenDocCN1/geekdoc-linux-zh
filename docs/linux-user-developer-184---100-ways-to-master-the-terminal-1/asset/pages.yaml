  md: '# SYSTEM RECOVERY


    # DDRRescue-GUI 1.71


    Use the powers of ddrescu from the convenience of a GUI


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_90_0.png)


    If you''ve ever lost data due to hardware failure, chances you have been asked
    to copy the block-level copies of the failing drive into another input. Use the
    ddrescue utility for recovering **data**. The best thing about ddrescu is that
    it does not write zeros to the output when it runs into errors. So, every time
    you run it on the disk, it skips the gaps without wiping out the already recovered
    data. The only downside is that ddrescu is a command line tool and you might prefer
    a graphical interface to use it instead. DDRRescue-GUI, as the name suggests,
    provides the powerful utility inside a graphical interface. This significantly
    lowers the

    terry barrier and makes ddrescu accessible to a whole lot of users. DDRRescue-GUI
    is written in Python and has a very low footprint, which makes it usable on older
    computers. The utility''s interface is much like the corporate KDisk tool, so
    workflow is straightforward. Just fire up the tool and select the disk that needs
    to be imaged. For a more effective recovery process, you should also specify the
    location for a log file that tracks the recovery process but also comes in handy
    when you want to restore the image. You''ll find precompiled binaries and source
    on the project''s Launchpad page.


    # Pros


    The graphical user interface makes ddrescu accessible to inexperienced users.


    # Cons


    The GUI doesn''t expose all the functionalities of the CLI utility.


    # Great for...


    Quickly making a block-level copy easy.


    http://bit.ly/ddrescu-gui


    # UNIFIED MESSAGING


    # Rambox 0.5.12


    # Bring all communications under one roof


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_90_1.png)


    Virtually all desktop shops with a default messaging app allows you to sign into
    multiple online services. It''s a great help, as these apps track only far of
    popular services. Rambox, on the other hand, has a huge mandate. With its latest
    release, you can sign into many messaging and email services visually! The app
    is fairly intuitive to use. Every added service within its own tab, from where
    you browse the message history, writes to your contacts, or other features of
    communicator supported by the service. The app also displays notifications and
    parks itself in the system. When you walk away from the computer, no one can read
    your messages. Rambox also has the ability to sync configurations if you use the
    app on multiple computers. The OS supports your personal information, Rambox uses
    the partition persist with <webtag> to create a persistent connection. The app
    is available as an AppImage binary that you can use without installation on Linux
    distribution.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_90_2.png)


    Above are the apps your services include (Gmail, Skype, WhatsApp and Telegram


    # Pros


    Unifies all messaging services inside a neat graphical app that''s easy to use
    and install.


    # Cons


    Can get slow and lag if you sign into several services, especially on older computers.


    # Great for...


    Tracking communications from multiple sources.


    www.rambox.org'
