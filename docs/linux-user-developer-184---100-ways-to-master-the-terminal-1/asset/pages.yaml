  md: '# Feature Master terminal


    # Services with background programs and logging


    Work with background programs and logging


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_23_0.png)


    > 21 Starting and stopping services

    Your computer runs many services, also as daemons, in the background. On destructros
    using the system service management, there are controlled by scripts in /etc/init.d,
    so you would start Apache with:


    ```

    /etc/init.d start

    ```


    > 22 Status service

    As well as the start example above, the system scripts also take a status option
    that tells you whether the service is running or not.


    ```

    systemctl status apache

    ```


    > 23 Services system style

    System uses the systemctl command to manage services, so you can start one with
    like:


    ```

    systemctl start apache

    ```


    There are corresponding stop, restart and status commands, which do exactly what
    they say.


    > 24 Listing services

    Systemd unit usage is simple unlike /etc/init.d where system users can use systemctl
    list-units to see all active services and systemctl list-unit-files to see all
    available services.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_23_1.png)


    > 25 Auto-starting services

    With SysInit you create a symlink from the init file to the /etc directory corresponding
    to your default runlevel to have the service start at boot. System users can systemctl
    enable apache2 to do this, and to disable it.


    > 26 Log watching

    Many programs write to what''s going on in real time watching it. Use tail -f
    on the system log file, /var/log/messages:


    ```

    tail -f /var/log/messages

    ```


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_23_2.png)


    > 27 Log watching – system style

    Systemd uses the journalctl command to work with the system


    ```

    journalctl -f

    ```


    You may have to use sudo to see all events.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_23_3.png)


    # Working with system logs


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_23_4.png)


    > 28 Looking for trouble

    Systemd''s journalctl is easy to look for certain events. After this reboot from
    a kernel upgrade:


    ```

    journalctl -b -p err

    ```


    -b shows only events since last reboot; -p err shows events marked as error or
    worse.


    > 29 Filtering the logs

    Watching in the log real gives a lot of irrelevant output, use grep to keep it
    in focus. For example, if you want to see what happens when you plug in a USB
    device, run:


    ```

    tail -f /var/log/messages | grep -i usb -e

    ```


    > 30 Add your own entries to the system log

    You can do this using logger, e.g.:


    ```

    logger I want to use the command line more than one!

    ```


    The message will be added to various system log files in /var/log.


