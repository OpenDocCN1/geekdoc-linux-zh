    # Object streams


    Using the ObjectInputStream and ObjectOutputStream classes, we can send objects
    across a socket, rather than text. You can send an object over a socket easily.


    ```

    | ObjectInputStream in = new ObjectInputStream(socket);

    | ObjectOutputStream out = new ObjectOutputStream(socket);

    ```


    We can write the objects to the socket using ObjectOutputStream and read them
    back with ObjectInputStream. These classes work by converting the objects into
    text and then back to objects at the other end of the socket. If you use these
    classes you will be forced to write and read in the Java serialization format.
    However, Java serialization is not understood by other programming languages.
    If you are using Java, or any language with a similar Java serialization format,
    you can send these objects across the socket. If it''s only information that the
    client shouldn''t have access to, or if you want to protect the eggs, use a method
    to hide the eggs before putting them inside the packet.


