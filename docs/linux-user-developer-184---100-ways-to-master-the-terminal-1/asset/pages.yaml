  md: 'NASA was in the news earlier this year as Juno, its space probe in orbit Jupiter,
    flew within just 900km of the giant planet''s cloud tops. Of particular impressive
    were detailed images of the Great Red Spot, a storm 1.3 times the diameter of
    the Earth, which might have raged for over 350 years.


    Mileanso, 250 kilometres away, Mars rover celebrated the first anniversary of
    its touch-down on the surface of the Red Planet. While not as much space ice as
    was back in 2012, it continues to reveal eye-catching photos and data to scientists
    for many years to come.


    Designing these other spacecraft involves complex work, planning and operating
    their missions, and the imagery and data that require, some performance computers,
    and especially for science and engineering applications, you might reasonably
    expect NASA to be first and foremost a Linux user. As an operating system, it
    would be to suggest that Linux ensures universal support at America''s space agency.
    Here we look at how Linux is used and, even more importantly, the applications


    In the Top 500 list of the world''s fastest computers, Since it''s so dominant
    in the world of supercomputing, these facilities rely square on Linux. Benefits
    cited by users of high-performance computing include Linux''s modular nature,
    its scalability, community support and low cost.


    # Advanced supercomputing


