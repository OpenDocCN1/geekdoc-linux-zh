  md: '# # Tutorial


    # # Essential Linux


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_39_0.png)


    # Command line vs GUI


    In order to terminate the statement, we use the keyword esc.


    If we want to print out something other than y, we can pass it to y as a command-argument:
    yes linux will print until it is forced to stop.


    When you are used to programming in OE, it might seem strange to use a command
    line but it has its advantages. As you can see, there is always a good idea to
    use the CLI for small tasks as command line tools are very effective in programming
    in small tasks.


    ## pipes: the yes command

    When we introduced pipes, we might have given the impression that they are only
    useful for programs that take input-by-line, but this is not the case. Every command-line
    program reads input from stdin and can therefore take input from pipes.


    # Making head and tail of things


    As an example, many package managers (e.g., APT, YUM, Yum, Pacman) prompt the
    user to type Y for before installing software:


    Two commands that are useful are head and tail. head prints the first few lines
    of input, while tail prints the last lines first.


    ```

    $ sudo apt-get install

    $ y

    ```


    ```

    $ yes | head -3

    ```


    If you install multiple software, you might want to not have to press Y every
    time. Luckily, Linux provides a command that will help you. This command is called
    yes, and it does print out the letter Y until you stop it by pressing Ctrl+C:


    Here, the command-line switch -n tells head to print out the first 5 lines of
    input.


    ```

    $ /usr/bin/starttail -n2

    deallocctt

    ```


    In this case, tail -n prints the last 2 lines of the file /usr/bin/starttail,
    a script that shows the Windows system message on Linux distributions.


    Exercise: run the command head -5 and tail -n5. What is the difference between
    the two commands? Why is this difference necessary?


    ```

    $ yes

    y

    y

    <Ctrl+C>

    ```


    That means you can skip skipping by piping the output from your package manager:


    # Chaining commands


    ```

    $ yes | apt-get install

    $ y

    ```


    Here, everything is automatically printed. Since yes prints out y infinitely,
    this will continue however how many times the program asks for confirmation.


    We use the tail command to display the last (most) lines of config


    ```

    #!/bin/bash

    /configure

    make install

    ```


    However, this isn''t right, because each of these three strings is prone to failure.
    If either the configure or the make stage fails, then you won''t want the rest
    of the script to execute.


    To deal with cases like this, Bash provides the double && together operator. The
    second command will only run if the first one executes with


    ```

    #!/bin/bash

    /configure && make && make install

    ```


    This way, if the script config fails with zero exit code, the remaining steps
    will not run.


