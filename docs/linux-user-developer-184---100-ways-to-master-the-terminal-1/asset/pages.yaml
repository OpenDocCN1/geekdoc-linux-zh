  md: '# # Package management


    Install, and remove software on your computer


    #  51 Update packages list


    ```

    apt-get update

    ```


    When using the APT package manager, the update command should be run before anything
    else it syncs the list of available packages with what is available on the servers.


    #  52 Upgrade packages


    ```

    apt-get upgrade

    ```


    A similar-looking command with a very different purpose, it upgrades all installed
    packages to the latest version. It will tell you what it is going to do and ask
    for confirmation, so check the list for any obvious gaffes before letting it proceed.


    #  53 Install new packages


    ```

    apt-get install package2

    ```


    This installs the package you give it. Additionally, it checks whether any other
    packages are needed for the software (dependencies) and whether you want to install
    them. Replace with remove to remove packages. In some apt-get commands, you can
    use -s to see what would be done without actually installing anything.


    #  54 sudo is your friend


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_26_0.png)


    Installing and removing software requires permissions. In older times we used
    root, which required you to know the root password, enabling them to do anything
    on the system. The current practice is to use sudo, which runs the command with
    root privileges, but only if authorised to do so. sudo is not all or like root
    - it can be configured to allow users to run specific commands or with specific
    arguments. To run a command, prefix it with sudo:


    #  55 RPM updates


    ```

    rpm -U packagename

    ```


    RPM is the other package management system, used by Fedora and openSUSE.-U updates
    the package to its latest version or installs it if not already on your system.


    #  56 Table of packages


    ```

    dpkg --selections

    ```


    A low-level tool for managing Debian packages. dpkg keeps a table of all the packages
    installed. You can save this to a file or pipe it to the command to save a copy,
    which could be useful when administering a remote computer over SSH.


    #  57 Install packages on RPM


    ```

    yum/dnf update

    ```


    While RPM is still popular, the popular command is so yum and dnf are replacements
    for Fedora and Red Hat, so the command to install a package is yum install package.


    #  58 Update packages


    If this command is followed by the name or more packages, those will be updated
    to the latest versions. If no names are specified, every package installed on
    your system will be updated if an update is available.


    > QUICK TIP USB boot


    GRUB allows you to boot Linux distributions from fast USB attached storage on
    local disks. This is useful when you are on local disks and are short of space.


    #  59 No dependencies needed


    Dependencies can hang around after you have removed the package. apt-get autoremove
    will clean up these on Debian systems; yum/dnf also does the same for RPM.


    #  60 No need to restart


    When a new version of Debian is released, instead of downloading an ISO and reinstalling,
    apt-get dist-upgrade gives virtually the same effect, without the downtime.'
