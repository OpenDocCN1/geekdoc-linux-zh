  md: '# # File systems


    Mount and work with internal and external file systems


    # ## 71 The command to mount a file system is:


    +   - Mount a file system

    - sudo /dev/sdX /mount/point


    ...where sdX is the device name. The mount point can be anywhere. The file system
    is usually detected automatically, or you can use -t to specify.


    # ## 72 Copy a complete file system with dd


    ...will make a bit-for-bit copy of the disk partition to the given file. it will
    be as large as the original partition, or you may want to pipe the output through
    compress:


    ```

    dd if=/dev/sdX of=/home/user/file.img

    ```


    # ## 73 Another way to mount


    if a device is listed in /etc/stab, you only need to pass the device or mount
    point command and it will read all other from fstab. fstab contains your options
    in the users field, the file system can be mounted/unmounted by a regular user.


    # ## 74 Mount external drives


    if a device is listed in /etc/stab, you can mount it as you like, but this might
    then lose permissions as a normal user. Desktop automounter takes care of that,
    as if it is mounted at /dev/sdb1 and it is a Windows system, it is mounted by
    the regular user.


    # ## 75 Free space


    Use df to list the used and available space on all file systems. it normally reports
    space in file system blocks, but -h gives human-readable values. if there is enough
    space, use -i to check for free inodes.


    # ## 76 Flash data to disk


    Linux caches disk data, not writing it immediately. this is faster and reduces
    wear on flash drives. if you want to make sure all data is committed to disk immediately,
    run sync. returns when all data is written – which could be a while if you have
    just copied a file to a flash drive.


    # ## 77 See what is mounted


    The command mount with options, but gives a more readable output, it''s output
    is formatted with command-line arguments, making a better way of getting something
    in scripts.


    # ## 78 Mount network drives


    This is similar to mounting local devices, except the device is specified as hostname/path/
    for NFS servers or Samba for Windows shares. The type is a - nt or -t cf specifies.


    # ## 79 Repair damaged file system


    if a file system becomes corrupted, you can repair it with fsck;.


    The file system must not be mounted, which means you may have to boot from a CD
    to run it. the contents are important and not already backed up (why?), make a
    copy with dd first.


    # ## 80 Add labels to your file systems


    When an automounter mounts a USB stick, it uses the file system''s label as the
    mount point if exists. Otherwise it uses the UUID. you can add a label to an existing
    file system, making it different for each type:


    ```

    label /dev/sd1 Music

    ```


    run either of these without giving a label and it will tell you the existing.


    | /sys/fs/cgroup/cpuuset | cgroup | cgroup |

    | /sys/fs/cgroup/cpuacct | cgroup | cgroup |

    | /sys/firmware/efi/efivars | cgroup | cgroup |

    | /dev/nfs | devfs | devfs |

    | /dev/loop | elivarfs | elivarfs |

    | /sys/fs/cgroup/nids_misc | system-1 | autofs |

    | /proc/nfs | procfs | procfs |

    | /dev/tmpfs | tmpfs | tmpfs |

    | /dev/pts | devpts | devpts |

    | /dev/devpoint | depoint | depoint |

    | /dev/hupages | hugst | hugst |

    | /run/user/1000 | tmpfs | tmpfs |

    | /tmp | tmpfs | tmpfs |

    | /dev/nfs_nblk | btrfs | btrfs |'
