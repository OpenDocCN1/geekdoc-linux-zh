    # HARDWARE


    # Station X launches Lifeline laptop


    New Linux notebook is finely tuned Manjaro-powered machine


    Bletchley-based Station X is revealing a Manjaro special edition of its Lifeline
    laptop. Available from October with either an i7 processor (7th gen), 8GB DDR4
    RAM up to 32GB, and a full 500GB SSD with space for a second drive, and Intel
    610/620 graphics, starting at £1250.


    Station X is not spinning off its own but is partnering with existing, native
    development teams in the Linux world to provide distributions, highly customised
    for the target device. It also supports for over 26 others.


    Simon Vassallo tells us that "Manjaro Special Edition has been designed from the
    ground up by the Manjaro team—meaning it is not just a, but a fully refined experience
    from the kernel-level up. We have been working with the Manjaro team since June
    to create something special for the Manjaro community and the wider Arch community
    as a whole."


    This customized edition, says Vassallo, covers "tweaked kernel settings, power
    and performance settings, and even sound settings to get the best battery life,
    power, and experience out of the machine. The special edition of the Manjaro software
    will be maintained and updated via the Manjaro repos—so updates will come to the
    machine as well. There will also be software support and custom assets, like "exclusive
    themes, wallpapers."


    Other teams, such as Debian and Solus, are working with Station X to develop custom
    distributions which will appear on other devices in Station X''s World Linux ARM-armed
    fleet of computers. Along with the lightweight Lifeline, site also has a Harrier,
    Hardware Blender.


    "We are very careful about the naming," says Vassallo, "as we use the characteristics
    of those actual period to reflect the qualities and attributes of each machine."
    As an example, he cites the Lancaster


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_5_1.png)


    Above Can the lightweight Lifeline show up beside proprietary laptop competition?


    Station X''s "heavy bomber" with dedicated Nvidia graphics up to GT 1050. None
    of this would be possible if there was no market, of course, and Vassallo is upbeat
    about the future: "I think we are in a renaissance of both Linux software and
    hardware. The Linux application and desktop environments have never been more
    exciting; I''m excited for Station X to join more established providers like System76
    and Purism!"


    Learn more at stations.rocks.


    6'
