  md: '# Can Atari make Linux gaming big?


    # Legendary game master identifies a Steam machine-sized hole


    As ever, we know that Atari is crowdfunding a Linux-based console is a big one.
    Since merging with Infographics in 2008, Atari has released – licensed – number
    of classic hardware rivals. Now has come close to meeting expectations, but the
    Atibox might just change that.

    Running Linux, and featuring a customised AMD processor with Radeon graphics and
    various memory configurations, the (optional) wood-panelled console evokes memories
    of the classic 2600. This time, gaming, media apps and web browsing are all possible.

    But why Linux? Here''s the encouraging part: "Most devices have closed systems
    and restrict content. Linux lets us open; you can access and control the OS, run
    games you want, bought from other platforms (if compatible)... This approach means
    that us


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_7_0.png)


    Above The Atibox offers backers option of root wood panelling


    well as being a great gaming device, Ataribox is also a full experience for the
    TV, bringing you streaming, applications, browsing, and more.

    The Ataribox project has a clear plan, and along with a bunch of pre-installed
    classic games, the console will be able to play games from Steam, It.io and other
    digital download services.


    Expected to cost $249-$299, the Ataribox is launching on Indiegogo and special
    editions, early access to bonuses and more being offered to backers.

    In a world where Steam remains largely unknown, and Android console gaming has
    inexplicably failed to make its mark, history''s stood against Atari Atari, but
    we''ll have to wait and see.


    As well as being a great gaming device, Ataribox is also a full experience for
