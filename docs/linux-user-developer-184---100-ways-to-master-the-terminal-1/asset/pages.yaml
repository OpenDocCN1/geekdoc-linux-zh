    D recently released version 9 of the patches to enable Linux kernel support for
    testing showcase of the ''asm-genric'' reference used for new arch and ports as
    the unofficial gateway to new hardware. If merged, RISC-V will be enabled upstream
    in Linux 4.15.


    # OpenRISC patch


    Not to be out, the (Open-RISC) project has posted a 13-patch series for its cleanup
    and at latest revision of the work. Stanford Horne''s patches are interesting
    because they include a detailed discussion of ordering semantics for OpenRISC
    and hardware used to ensure they get it right. A lot of effort has recently gone
    into formal analysis of memory models used by modern computer architectures in
    recent years, and consequently that many programmers often fail to understand.
    Paul McKinney''s free source book is Parallel Programming Handling, And, If So,
    What Do You Know About? is one of the best resources, and is actively involved.


    Work is ongoing to teach the RISC groups about how to better handle OOM (out-of-memory)
    conditions. The Linux ''OOM Killer'' (yes, that is its real name) runs whenever
    the system is running low on RAM and exhausted other options such as ''swapping''
    unused application data to disk, an action formerly called ''paging''. The Linux
    kernel has limited logic known as ''Son Kill the process?'' That tries to prevent
    the system from breaking, but is free to kill any process it deems to be memory
    hazard. The container work aims to solve this by prioritizing killing processes
    in preference to other critical system tasks or specific or collection of containers.
    Mills has continued working on cleaning up the Linux kernel SMB (Common Intermediate
    File System) for talking to Windows PCs, with well as extended support for Linux
    4.15, as well as a developmental patch using RDMA (remote memory access) using
    SMB Direct for low-latency, high-performance file copying between Linux and Windows
    networks. Linux introduces flaw from Kees Code of the security team. He has been
    working on kernel security for many years. His latest contributions enable structure
    for randomisation for kernel structures, making it harder to exploit security
    bugs by introducing an unpredictability to the in-place memory buffer overflow
