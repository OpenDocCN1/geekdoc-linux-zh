  md: '# Feature Linux Space


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_35_0.png)


    educational activities and outreach, human research, physical sciences, and technological
    development and demonstration. Given that these experiments have mostly been devised
    by academics outside NASA, this preference for Linux isn''t at all surprising.
    It''s interesting to note that Robot 2, the robot that is putting through its
    tasks on the ISS, runs an embedded version of Linux on 38 PowerPC-based processors.
    According to NASA, this isn''t just used for research but also for the operation
    of the space station. To its humankind, Robot 2 can take over simple, repetitive
    or particularly dangerous tasks in places such as the ISS.


    Above Simulating the aerodynamic forces of the SLS rocket, during separation of
    the solid fuel boosters, the Pleiades supercomputer


    Right NASA''s Robotman2 humanoid robot, currently flying on the International
    Space Station, has an embedded Linux kernel at its core


    > We migrated functions to Linux because we needed an operating system that was
    stable and reliable


    other things, aerodynamic performance, temperature distribution; and others. In
    a recent press release, NASA indicated that, with the SLS alone, had consumed
    220 million hours of computing time over two decades.


    Since Robot 2 is approaching human dexterity, such as changing out an air filter
    can be performed without modifications to the existing design.


    # Linux in orbit


    NASA''s use of Linux isn''t restricted to its superconducting facilities. In 2010,
    the space agency had a major policy shift in the use of open operating systems.
    The laptops on board the ISS were migrated from Windows to Deep Linux. Keith Chvatal
    of NASA extended the project, migrating key functions to Linux because we needed
    an operating system that was stable and reliable - one we could use in-house.
