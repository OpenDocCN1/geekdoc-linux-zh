    # HARDWARE


    # GNOME and Plasma back Purism Linux phone hardware-support


    Following news of the Purism Librem 5, two big hitters in the open source world
    have announced their intention to get involved.


    With the first partnership between Purism and KDE in a venture that will ensure
    plenty of resources are supporting the Plasma Mobile porting to the Librem 5.
    This is an ideal team: KDE Plasma will well go up-to-date base on its operating
    system, while Purism is set to fulfill its goals of developing a mobile OS with
    full encryption. But does this mean


    that Plasma Mobile will be the default OS on the Librem 5? Time, the initial announcement
    said that GNOME UI will be embraced by October.

    Unsurprisingly, the need to date is the GNOME Foundation, which has expressed
    interest in supporting porting the Librem 5 as a GNOME/GTK phone device. The GNOME
    Foundation is committed to partnering with Purism to create hardware sets, tools,
    emulators, and build awareness around mobile GNOME/GTK for the Librem 5 phone.


    However, the Foundation''s investment with Librem 5 comes at a price: Purism''s
    crowdfunder must meet their goal. If successful, GNOME will get to help "enhance
    GNOME Shell and general performance of the system with Purism to enable better
    on the 5."

    With a focus on security, privacy and freedom, is the Librem 5 something that
    has just come to happen. Will other big names collaborate on producing a workable
    mobile Linux operating system before the crowdfunding goal is reached?'
