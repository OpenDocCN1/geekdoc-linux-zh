    # WIRELESS INTERCOM


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_64_1.png)


    Tight mice

    The microphone in the AY Voice Kit sits on its own board and turned out to be
    a "natural fit" for the top of the intercom case. However, Martin was able to
    place the Raspberry Pi 3 at the edge, although he was able to expose the HDMI
    port having the Pi in that position.


    Snug speaker

    The speaker from the AY Voice Kit is 3 inches wide which isn''t going to fit in
    the intercom, so Martin needed to find an alternative that was sturdy and as good
    quality - turned out to be a 2.3-inch Visaton FR58 speaker.


    # Switch to talk


    To keep retro feel, Martin retained the original look of the intercom''s "talk"
    button. He did this by making sure the switch from the unit was held in a retaining
    screw that also had a hidden button in place. In case of future, he was able to
    use an existing screw-thread for this important job.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_64_2.png)


    # Google Juice


    In Martin''s video (http://bit.ly/IntercomDemo) he and his 10-year-old daughter
    demonstrate how they used the Kit to activate Google Assistant a click of a "talk"
    button. The intercom has also been used to activate a custom command that triggers
    the lights of all of house by activating a WiFi smart socket. The code for the
    AY Voice Kit has been updated in significant ways since Martin finished his project
    and you can change a few lines of code to activate the Assistant by pressing a
    button, tapping your hands or just saying "OK Google" to trigger a device listening
    more.


