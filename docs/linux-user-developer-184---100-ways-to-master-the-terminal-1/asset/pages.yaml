  md: '# # A few more..


    # ## Handy tips and commands to use in your shell


    # ### Wildcards


    Use wildcards to match multiple files. Copy them to the current directory, use


    +   * cp *.jpg dest/

    * matches any sequence of characters except /

    * matches a single character.


    # ### Handling tariffs


    if (file archives) have an extension after the .tar, they''re compressed by the
    tar command can handle them.


    ```

    tar tvf file.tar.bz2

    tar xf file.tar.xz

    ```


    The first command lists the contents of a tariff:

    The second unpacks it to the current directory.


    # ### Windows ZIP files


    View the contents of a ZIP compressed file with unzip -l some.zip

    drop - d to use it


    # ### Search


    search files for lines matching a pattern. To look for errors in a file, you could
    use:


    ```

    grep -i err log

    ```


    grep is sensitive by default; -i changes it


    # ### Viewing the beginning or end of file


    The head and tail commands show the first and last lines of a file. The -n option
    can be used to view a number of lines.


    ```

    tail -n 1 somefile

    ```


    # ### What is a file?


    Linux does not use files to distinguish file types, but looks at the contents.
    The command file will tell you type of data a file contains, and often more –
    like the dimensions of an image.


    ```

    file file2..

    ```


    # ### Counting content


    ...report the number of lines, words and characters in each of the files it is,
    or from standard input, with the total for all files. Use -c, -w or -l if you
    are interested in only one of these values.


    # ### Reading standard input


    Many commands will accept standard input via a pipe instead of file if filename
    is given as a filename, which means to read from stdin. The latter has the advantage
    that a program can read from standard input and one file.


    # ### Changing files


    The Stream Editor is used to edit streams of text. It is extremely powerful but
    can be used for simple tasks like search and replace. It works on files or text
    on standard input, he the name. To replace all occurrences of foo in a bar, you
    use:


    ```

    sed -i s/foo/bar/ somefile

    ```


    The -i replaces the file with the changed version instead of simply output the
    data.


