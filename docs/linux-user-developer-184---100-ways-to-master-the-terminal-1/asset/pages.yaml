    moving forward. Traditional LTS kernels are maintained by Greg K-H every couple
    of years, in collaboration with users such as Google, for use in their next Android
    kernel. The LTS stream feeds into an Android common tree that then feeds into
    kernel versions used by SoC (system-on-chip) manufacturers, and the kernel trees
