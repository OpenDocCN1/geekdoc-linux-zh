  md: '# # Networking


    # ## Commands for working with the network


    +   - **11 What is your computer called?**nFind your computer''s network name
    with hostname; -f to get the full name including the domain; -a to see your computer''s
    IP address, run it with -1.


    +   - **12 List network information**

    ip addr show

    The ip command is the successor to the ifconfig. Both can be used to show information
    about your network interfaces, including IP address, hardware address, status
    and more arcane statistics.


    +   - **13 Check connection**

    ping google.com

    tests the connection to the given host. The numbers returned are round-trip time
    for small data packets. If it fails to communicate, it may be that your network
    is down, the server is down or there is a DNS problem. Try starting again.


    +   - **14 Look up an address**ndig example.com

    this queries your default name servers for the IP address of the hostname you
    give. You can also tell it to use a different name server, such as Google''s,
    by using 8.8.8.8 example.com An alternative program for this is nslookup.


    +   - **15 Scan for networks**niwlist -a

    the iwlist command finds information about networks in range, such as signal strength
    and whether they are active. To get more information about the network to you
    are currently connected, use the ifconfig command.


    +   - **16 Copy to another computer**nscp file user@hostname:some/path

    This uses SSH to copy to a remote computer. If the remote path starts with a /,
    it is absolute, otherwise it is relative to the remote user''s home directory.
    You can reverse the options to copy a remote file to the local system.


    +   - **17 Log in remotely**nssh user@hostname

    SSH, or Secure Shell, opens a shell session on a remote computer. If you do not
    specify the user, your current username is used. The password is asked for that
    of the user on the remote computer. You can also add commands to the end of the
    line, which will be run on the remote computer.


    +   - **18 Sync again**nrync user@hostname:dir/

    We saw on the previous page, but we can also use rsync to synchronize with a remote
    computer. With scp, you can also use SSH to handle the transfer.


    +   - **19 Send email for the command line**ns -s "test mail" example.com

    You can quickly send information from the command line, the -s sets the subject,
    which is quoted if it contains spaces. The body of the email is read from standard
    input, or from a file.


    > Seek help

    Most commands can be run with --help, to give a quick reminder of the available
    options.


    Directory listing for /local/share/

    - desktop-launchers/

    - local-share/

    - ainfo/

    - applications/

    - user-desktop/

    - audiobooks/

    - backup/

    - badger/

    - binary/

    - color/

    - data/

    - desktop-couch/


    +   - **20 Share files**

    python -m http.server

    This runs a web server at the current directory on port 8000. There''s no real
    security, but it is a quick and easy way of sharing between computers on your
    local network, especially, if the target device or user can use a terminal.'
