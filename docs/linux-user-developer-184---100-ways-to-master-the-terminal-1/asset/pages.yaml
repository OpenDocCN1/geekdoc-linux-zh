  md: '# Tutorial


    # Arduino


    # Create your own HTTP server powered by Arduino


    Arduinos are designed for hardware, but the right model can still power through
    a lot of computing


    Establishing an online presence is a task easily accomplished with a personal
    website. While websites are a great platform to showcase your skills, there''s
    no reason we can''t show off our Arduino and avoid paying money to host content
    on a server at the same time. This means we are going to begin a series of tutorials
    where we take the microcontroller board out of its comfort zone and transform
    it into a simple HTTP web server.


    Another might be ringing in your head right now: aren''t Arduino meant for hardware
    projects? Well, they also have a maximum size and a relatively small amount of
    memory to work with. An small computer like the Raspberry Pi won''t be able to
    do much (if any) server-side processing. There are arguments against using an
    Arduino for this. However, if you have a Mega then this isn''t the case at all,
    and if you have a Mega then the program size isn''t an issue and you can do it
    all.


    # 01 Set up the hardware


    You''ll need an Arduino board, a way of connecting to your internet router and
    SD card capability. For this tutorial, we use the Arduino Leonardo and the Ethernet
    shield. You''ll need to insert the shield into the Arduino''s header pins and
    connect your to the router with an Ethernet cable. You''ll also need to power
    your Arduino - but for now, you''ll need to power it with a USB cable.


    You should log into your router, identify your device''s IP address and check
    that you have configured it correctly. If you don''t have the administrator login,
    you might be able to determine its network address using nmap or arp -a. At the
    end of the example "WebServer" sketch under Ethernet Library sketches), you''ll
    need to change your IP and MAC addresses to match.


    The benefit of using an Arduino and programming your server is that you can control
    other commands of your while from an up to date device, controlling items around
    your home. You could be controlling a kettle, the garage door, or even controlling
    motors on some kind of robot you could build yourself, feeding back to the server
    on your browser. Arduino server can be the gateway into your world.


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_41_0.png)


    ![](img/3eaaaaf4dd2065fe8f3d6fb19ba774d3_41_1.png)


    # Alexander Smith


    is a computational physicist who teaches Arduino to grad students and discourages
    people from doing lab work manually.


    # Resources


    +   - Arduino board: Uno, Leonardo or Mega


    +   - Arduino IDE

    www.arduino.cc


    +   - Ethernet & SD shield

    Available in many online stores


    +   - microSD card


    +   - A basic text editor'
