    ## 3. Bugs


    > > "Nobody actually creates perfect code the first time around, except me. But
    there''s only one of me."

    > > Linus Torvalds, 2007 [44]


    With so many rules about when the load balancing does or does not occur, it becomes
    difficult to reason about how long an idle core would remain idle if there is
    work to do and how long a task might stay in a runqueue waiting for its turn to
    run when there are idle cores in the system. Since there are very few developers
    who "create the perfect code the first time around", this complexity leads to
    bugs. Understanding the bugs is necessary to appreciate why they evade conventional
    testing and debugging tools. Therefore, we describe the bugs first and delay the
    presentation of the tools that we used to confirm and understand them until Section
    4. Table 4 summarizes the bugs described in this section.


    ### 3.1 The Group Imbalance bug


    #### The bug.


    We encountered this bug on a multi-user machine which we used to perform kernel
    compilation and data analysis using the R machine learning package. We suspected
    that this system, a 64-core, eight-node NUMA server, did not use all available
    cores for highly-threaded computations, instead crowding all threads on a few
    nodes. We illustrate this bug with the output from our visual tool, shown on Figures
    2a and 2b. In the time period shown in the figure, the machine was executing a
    compilation of the kernel (make with 64 threads), and running two R processes
    (each with one thread). The make and the two R processes were launched from 3
    different ssh connections (i.e., 3 different ttys).


    ![](img/784531c49b2139b7953fa84543328260_5_0.png)


    **Figure 2:** The Group Imbalance bug. Y-axis shows CPU cores. Nodes are numbered
    0-7. Each node contains eight cores.


    Figure 2a is a heatmap colour-coding the number of threads in each core''s runqueue
    over time. The warmer the colour, the more threads a core hosts; white corresponds
    to an idle core. The chart shows that there are two nodes whose cores run either
    only one thread or no threads at all, while the rest of the nodes are overloaded,
    with many of the cores having two threads in their runqueue. After investigation,
    we found that the scheduler is not balancing load because of:

    - the complexity of the load-tracking metric

    - the hierarchical design


    Let us first focus on the load. Remember that a thread''s load is a combination
    of its weight and how much CPU it needs. With autogroups, the thread''s load is
    also divided by the number of threads in the parent autogroup. In our case, a
    thread in the 64-thread make process has a load roughly 64 times smaller than
    a thread in a single-threaded R process. Discrepancies between threads'' loads
    are illustrated in Figure 2b, which shows the combined load of threads in each
    core''s runqueue: a darker colour corresponds to a higher load. Nodes 0 and 4,
    the ones running the R processes, each have one core with a very high load. These
    are the cores that run the R threads. The Linux load balancer steals work from
    other runqueues based on load; obviously the underloaded cores on Nodes 0 and
    4 should not steal from the overloaded core on their own node, because that core
    runs only a single thread. However, they must be able to steal from the more loaded
    cores on other nodes. Why is this not the case? Remember that to limit algorithmic
    complexity, the load balancing algorithm uses a hierarchical design. When a core
    attempts to steal work from another node, or, in other words, from another scheduling
    group, it does not examine the load of every core in that group, it only looks
    at the group''s average load (line 11 of Algorithm 1). If the average load of
    the victim scheduling group is greater than that of its own, it will attempt to
    steal from that group; otherwise it will not. This is the exact reason why in
    our situation the underloaded cores fail to steal from the overloaded cores on
    other nodes. They observe that the average load of the victim node''s scheduling
    group is not any greater than their own. The core trying to steal work runs on
    the same node as the high-load R thread; that thread skews up the average load
    for that node and conceals the fact that some cores are actually idle. At the
    same time, cores on the victim node, with roughly the same average load, have
    lots of waiting threads. A valid question to ask is whether work stealing should
    occur in this case, since theoretically we want threads with a higher load to
    get more CPU time than threads with a lower load. The answer to that question
    is "yes": the Linux CFS scheduler is work-conserving in nature, so threads may
    get more than their fair share of CPU cycles if there are idle cores in the system;
    in other words, idle cores should be always given to waiting threads. As we have
    seen in the scenario illustrated here, this is not necessarily the case.


    #### The fix.


    To fix the bug, we changed the part of the algorithm that compares the load of
    scheduling groups. Instead of comparing the **average** loads, we compare the
    **minimum** loads (lines 11 and 15 of Algorithm 1). The minimum load is the load
    of the least loaded core in that group. If the minimum load of one scheduling
    group is lower than the minimum load of another scheduling group, it means that
    the first scheduling group has a core that is less loaded than *all* cores in
    the other group, and thus a core in the first group must steal from the second
    group. This algorithm ensures that no core of the second group will remain overloaded
    while a core of the first group has a smaller load, thus balancing the load across
    cores. Note that this fix works, because load is also balanced *inside* the groups
    (because of load balancing calls at lower levels of the hierarchy). Just as the
    original algorithm, we use the special cases of group imbalance (line 13 of Algorithm
    1) to deal with corner cases due to tasksets. These modifications add no algorithmic
    complexity to the scheduler as computing the minimum load of a scheduling group
    and its average have the same cost. In our experience, this fix does not result
    in an increased number of migrations between scheduling groups (ping-pong effect).


    #### Impact on performance.


    Figure 2c is a trace of the execution of that workload with the fix applied (showing
    a heatmap of runqueue sizes, in the same fashion as Figure 2a). After we fixed
    the bug, the completion time of the make job, in the make/R workload described
    earlier in this section, decreased by 13%. The completion time of the two R processes
    did not change. Performance impact could be much higher in other circumstances.
    For example, in a workload running `1u` from the NAS benchmark³, and four single
    threaded R processes, `1u` ran 13× faster after fixing the Group Imbalance bug.
    `1u` experienced a super-linear speedup, because the bug exacerbated lock contention
    when multiple `1u` threads ran on the same core. ³The NAS benchmark comprises
    a set of small programs designed to help evaluate the performance of supercomputers
    [32].


