    of type (2) per second, and 68,000 events of type (3) per second, for a total
    of around 186,200 events per second. Consequently, when active our profiler uses
    3.6 MB of RAM per second on a machine with 64 cores. In practice the profiler
    is only active when a bug is detected, and its impact on performance negligible
    in the nonbuggy case.


    In addition to the changes in the Linux kernel, we also wrote a kernel module
    that makes it possible to start and end a profiling session on demand, and to
