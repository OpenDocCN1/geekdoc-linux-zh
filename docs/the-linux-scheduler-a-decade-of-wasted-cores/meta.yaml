    load balancing logic is probably _trivial_. Patches already exist, and I don''t
    feel that people can screw up the few hundred lines too badly.

    > —Linus Torvalds, 2001 [43]


    Conceptually, load balancing is simple. In 2001, CPUs were mostly single-core
    and commodity server systems typically had only a handful of processors. It was,
    therefore, difficult to foresee that on modern multicore systems load balancing
    would become challenging. Load balancing is an expensive procedure on today''s
    systems, both computationally and communication-wise, because it involves modifying
    remotely cached data structures, causing extremely expensive cache misses and
    synchronization. As a result, the scheduler goes to great lengths to avoid executing
    the load-balancing procedure often. At the same time, not executing it often enough
    may leave runqueues unbalanced. When that happens, cores might become idle when
    there is work to do, which hurts performance. So in addition to periodic load-balancing,
    the scheduler also invokes "emergency" load balancing when a core becomes idle,
    and implements some load-balancing logic upon placement of newly created or newly
    awoken threads. These mechanisms should, in theory, ensure that the cores are
    kept busy if there is work to do. We next describe how load balancing works, first
    explaining the algorithm and then the optimizations that the scheduler employs
    to maintain low overhead and to save power. Later we show that some of these optimizations
    make the code more complex and cause bugs.


    ## 2.2.1 The load balancing algorithm

    Crucial for understanding the load balancing algorithm is the metric that the
    CFS scheduler uses to track load. We begin by explaining the metric and then describe
    the actual algorithm.


    ### The load tracking metric

    A strawman load-balancing algorithm would simply ensure that each runqueue has
    roughly the same number of threads. However, this is not necessarily what we want.
    Consider a scenario with two runqueues, where one queue has some number of high-priority
    threads and another queue has the same number of low-priority threads. Then high-priority
    threads would get the same amount of CPU time as low-priority threads. That is
    not what we want. One idea, then, is to balance the queues based on threads''
    weights, not their number. Unfortunately, balancing the load based solely on thread
    weights is not sufficient either. Consider a scenario with ten threads in two
    runqueues: one thread is of high priority and nine threads are of low priority.
    Let us assume that the weight of the high-priority thread is nine times higher
    than those of the low-priority threads. With the load balanced according to threads''
    weights, one runqueue would contain the high-priority thread, while the other
    would contain the nine low-priority threads. The high-priority thread would get
    nine times more CPU than the low-priority threads, which appears to be what we
    want. However, suppose that the high-priority thread often sleeps for short periods
    of time, so the first core often goes idle. This core would have to frequently
    steal work from the other core''s runqueue to keep itself busy. However, we do
    not want work stealing to become the common case, because this defeats the purpose
    of per-core runqueues. What we really want is to balance the runqueues in a smarter
    way, accounting for the fact that the high priority thread does not need a whole
    core. To achieve this goal, CFS balances runqueues not just based on weights,
    but based on a metric called load, which is the combination of the thread''s weight
    and its average CPU utilization. If a thread does not use much of a CPU, its load
    will be decreased accordingly. Additionally, the load-tracking metric accounts
    for varying levels of multithreading in different processes. Consider a scenario
    where we have one process with lots of threads, and another process with few threads.
    Then the threads of the first process combined will receive a lot more CPU time
    than the threads of the second process. As a result, the first process would use
    most of the CPU cycles and starve the other process. This would be unfair. So
    as of version 2.6.38 Linux added a group scheduling feature to bring fairness
    between groups of threads (cgroup feature). When a thread belongs to a cgroup,
    its load is further divided by the total number of threads in its cgroup. This
    feature was later extended to automatically assign processes that belong to different
    ttys to different cgroups (autogroup feature).


    ### The load-balancing algorithm

    A basic load balancing algorithm would compare the load of all cores and then
    transfer tasks from the most loaded core to the least loaded core. Unfortunately
    this would result in threads being migrated across the machine without considering
    cache locality or NUMA. Instead, the load balancer uses a hierarchical strategy.
    The cores are logically organized in a hierarchy, at the bottom of which is a
    single core. How the cores are grouped in the next levels of the hierarchy depends
    on how they share the machine''s physical resources. In the example provided here
    we describe the hierarchy on our experimental machine (see Table 5), where pairs
    of cores share functional units (e.g., FPU), and groups of eight cores share a
    last-level cache (LLC). A group of eight cores sharing an LLC form a NUMA node.
    Different NUMA nodes have varying connectivity as explained below and as shown
    in Figure 4. Consequently, on our target system, at the second level of the hierarchy
    we have pairs of cores, and at the next level we have groups of eight cores, each
    sharing an LLC (e.g., a NUMA node). NUMA nodes are further grouped according to
    their level of connectivity [23]. Nodes that are one hop apart from each other
    will be at the next level, and so on. An example of such a hierarchy is shown
    in Figure 1.


    ![Figure 1: A machine with 32 cores, four nodes (eight cores per node) and SMT-level
    sharing among pairs of cores. The four grey areas represent the scheduling domains
    relative to the first core of the machine. Note that at the second level of the
    hierarchy we have a group of three nodes. That is because these three nodes are
    reachable from the first core in one hop. At the 4th level, we have all nodes
    of the machine because all nodes are reachable in 2 hops. Figure 4 shows the connectivity
    between the nodes on our system.](img/784531c49b2139b7953fa84543328260_3_0.png)


    Each level of the hierarchy is called a *scheduling domain*. The load balancing
    algorithm is summarized in Algorithm 1. Load balancing is run for each scheduling
    domain, starting from the bottom to the top. At each level, one core of each domain
    is responsible for balancing the load. This core is either the first idle core
    of the scheduling domain if the domain has idle cores whose free CPU cycles can
    be used for load balancing, or the first core of the scheduling domain otherwise
    (Lines 2–9). Following this, the average load is computed for each scheduling
    group of the scheduling domain (Line 10), and the *busiest* group is picked, based
    on heuristics that favor overloaded and imbalanced groups (Line 10). If the busiest
    group''s load is lower than the local group''s load, the load is considered balanced
    at this level (Line 16). Otherwise, the load is balanced between the local CPU
    and the busiest CPU of the group, with a tweak to ensure that load balancing works
    even in the presence of tasksets (Lines 18–23).


    ```plaintext

    Algorithm 1 Simplified load balancing algorithm.

    {Function running on each cpu cur_cpu:}

    1: for all sd in sched_domains of cur_cpu do

    2:   if sd has idle cores then

    3:     first_cpu = 1st idle CPU of sd

    4:   else

    5:     first_cpu = 1st CPU of sd

    6:   end if

    7:   if cur_cpu ≠ first_cpu then

    8:     continue

    9:   end if

    10:  for all sched_group sg in sd do

    11:    sg.load = average loads of CPUs in sg

    12:  end for

    13:  busiest = overloaded sg with the highest load (or, if inexistent) imbalanced
    sg with highest load (or, if inexistent) sg with highest load

    14:  local = sg containing cur_cpu

    15:  if busiest.load ≤ local.load then

    16:    continue

    17:  end if

    18:

    19:  busiest_cpu = pick busiest cpu of sg

    20:  try to balance load between busiest_cpu and cur_cpu

    21:  if load cannot be balanced due to tasksets then

    22:    exclude busiest_cpu, goto line 18

    23:  end if

    ```


    It starts from the lowest-to-highest level of the hierarchy and balances the load
    one level below. For example, on the system in Figure 1 the core will begin at
    the pair-of-cores level and will balance the load between the two individual cores
    contained therein. Then, it will proceed to the level of the NUMA node, balancing
    the load one level below (among pairs of cores, in this case), but **not between
    individual cores of the NUMA node**. In a scheduling domain, the sets of cores
    among which the load balancing is performed are called *scheduling groups*. At
    the NUMA node domain, there will be four scheduling groups, each corresponding
    to a pair of cores. The core will find the busiest scheduling group other than
    its own and will steal tasks from the busiest core in that group.


    ### 2.2.2 Optimizations

    The scheduler prevents duplicating work by running the load-balancing algorithm
    only on the *designated core* for the given scheduling domain. When each active
    core receives a periodic clock tick and begins running the load-balancing algorithm,
    it checks whether it is the lowest-numbered core in the domain (if all cores are
    busy), or if it is the lowest-numbered idle core (if any core is idle). This is
    shown in Line 2 of the Algorithm. If this condition holds, the core deems itself
    as designated and continues to run the algorithm.'
