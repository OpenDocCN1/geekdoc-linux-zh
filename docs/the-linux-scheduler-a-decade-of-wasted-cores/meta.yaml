    in the system. Applications are launched with 64 threads, the default configuration
    on our 64-core machine. The Missing Scheduling Domains bug causes all threads
    of the applications to run on a single node instead of eight. In some cases, the
    performance impact is greater than the 8× slowdown that one would expect, given
    that the threads are getting 8× less CPU time than they would without the bug
    (they run on one node instead of eight). lu, for example, runs 138× faster! Super-linear
    slowdowns occur in cases where threads frequently synchronize using locks or barriers:
    if threads spin on a lock held by a descheduled thread, they will waste even more
