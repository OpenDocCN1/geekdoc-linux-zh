    that last less than a millisecond to perform background operations, such as logging
    or irq handling. When this happens, the load balancer observes a heavier load
    on the node that runs the transient thread (Node A), and migrates one of the threads
    to another node (Node B). This is not an issue if the transient thread is the
    one being migrated, but if it is the database thread, then the Overload-on-Wakeup
    bug will kick in. Node B now runs an extra database thread, and the threads, which
    often sleep and wake up, keep waking up on Node B, even if there are no idle cores
    on that node. This occurs, because the wakeup code only considers cores from the
    local node for the sake of better cache reuse.


    We now understand how a thread might wake up on a loaded core despite the presence
    of idle cores in the system. Note in Figure 3 that the system eventually recovers
    from the load imbalance: the load balancing algorithm finally migrates threads
    from overloaded cores to idle cores. The question is, why does it take several
    milliseconds (or even seconds) to recover?


    Note that there are two kinds of idle cores in the system: short-term and long-term.
    Short-term idle cores go idle for short periods, because the database thread running
    on that


    core intermittently sleeps due to a synchronization or I/O event. Ideally we want
    the load balancing events to migrate a thread from an overloaded core to a long-term
    idle core. Migrating to a short-term idle core is of little help: a thread that
    used to run on that core will shortly awaken, and as we have seen, the scheduler
    may place it on another loaded core in the same node due to the cache locality
    optimization.⁵ The imbalance will thus persist.


    Unfortunately, when the scheduler considers where to migrate a thread from the
    overloaded core, it makes no distinction between short-term and long-term idle
    cores. All it does is to check whether the core is idle at the moment when the
    load-balancer is invoked. Remember from Section 2.2.1 that the load balancing
    algorithm is invoked at different levels of the hierarchy by the "designated core".
    If there are multiple idle cores eligible to be "designated", only one gets chosen.
    If we are lucky, the long-term idle core gets chosen, and the balance gets restored.
    This is exactly what happens in Figure 3, when the system eventually recovers
    from the imbalance. However, as we observed, pure luck is not enough to maintain
    optimal performance.


    # *The fix.*


    To fix this bug, we alter the code that is executed when a thread wakes up. We
    wake up the thread on the local core—i.e., the core where the thread was scheduled
    last—if it is idle; otherwise, if there are idle cores in the system, we wake
    up the thread on the core that has been idle for the longest amount of time. If
    there are no idle cores, we fall back to the original algorithm to find the core
    where the thread will wake up.


    Waking up the thread on a long-term idle core may have implications for power
    consumption. Cores that have been idle for a long time usually go into a low-power
    mode. Waking up a thread on that core will force the core to exit that mode and
    run at full power. For that reason, we only enforce the new wakeup strategy if
    the system''s power management policy does not allow cores to enter low-power
    states at all. Furthermore, our fix only matters for workloads where threads frequently
    go to sleep and awaken and where the system is intermittently oversubscribed (there
    are more threads than cores). In these situations, waking up threads on long-term
    idle cores makes sense. In other situations, since thread wakeups are rare, our
    fix does not significantly alter the behavior of the scheduler.


    Looking for a long-term idle core in the system adds no overhead to the wakeup
    function: the kernel already maintains a list of all idle cores in the system,
    so picking the first one (this is the one that has been idle the longest) takes
    constant time.


