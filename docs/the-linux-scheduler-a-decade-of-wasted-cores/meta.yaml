    We first describe how Linux''s Completely Fair Scheduling (CFS) algorithm works
    on a single-core single-user system (Section 2.1). From this perspective, the
    algorithm is quite simple. Then, in (Section 2.2) we explain how limitations of
    modern multicore systems force developers to work-around potential performance
    bottlenecks, which results in a substantially more complex and bug-prone implementation.


    # **2.1 On a single-CPU system, CFS is very simple**


    Linux''s CFS is an implementation of the weighted fair queueing (WFQ) scheduling
    algorithm, wherein the available CPU cycles are divided among threads in proportion
    to their weights. To support this abstraction, CFS (like most other CPU schedulers)
    time-slices the CPU among the running threads. The key decisions made in the scheduler
    are: how to determine a thread''s timeslice? and how to pick the next thread to
    run?


    The scheduler defines a fixed time interval during which each thread in the system
    must run at least once. The interval is divided among threads proportionally to
    their weights. The resulting interval (after division) is what we call the timeslice.
    A thread''s weight is essentially its priority, or niceness in UNIX parlance.
    Threads with lower niceness have higher weights and vice versa.


    When a thread runs, it accumulates vruntime (runtime of the thread divided by
    its weight). Once a thread''s vruntime exceeds its assigned timeslice, the thread
    is pre-empted from the CPU if there are other runnable threads available. A thread
    might also get pre-empted if another thread with a smaller vruntime is awoken.


    Threads are organized in a runqueue, implemented as a red-black tree, in which
    the threads are sorted in the increasing order of their vruntime. When a CPU looks
    for a new thread to run it picks the leftmost node in the red-black tree, which
    contains the thread with the smallest vruntime.


    # **2.2 On multi-core systems, CFS becomes quite complex**


    In multicore environments the implementation of the scheduler becomes substantially
    more complex. Scalability concerns dictate using per-core runqueues. The motivation
    for per-core runqueues is that upon a context switch the core would access only
    its local runqueue, when it looks for a thread to run. Context switches are on
    a critical path, so they must be fast. Accessing only a core-local queue prevents
    the scheduler from making potentially expensive synchronized accesses, which would
    be required if it accessed a globally shared runqueue.


    However, in order for the scheduling algorithm to still work correctly and efficiently
    in the presence of per-core


