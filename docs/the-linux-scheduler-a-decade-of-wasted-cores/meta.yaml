    Our sanity checker is different from an assertion or a watchdog in that, in our
    case, it must be specifically tailored to check for conditions that are acceptable
    for a short period of time, but unacceptable if they persist. While an assert
    would fire as soon as the desired invariant is violated, a sanity checker must
    minimize the probability of flagging short-term transient violations, and catch
    long-term violations with a high probability. The load balancer runs every 4ms,
    but because of the hierarchical design multiple load balancing attempts might
    be needed to recover from invariant violation in a bug-free system. We conservatively
    set $M$ to 100ms to virtually eliminate the probability of false positives. The
    monitoring that occurs during that period tracks thread migration, creation and
    destruction, because it is these events that can help the system to recover. Tracking
    these events requires adding a function call in the `move_thread`, `fork` and
    `exit` functions that check where threads are migrated. The overhead of this function
    call is negligible. To meet this requirement we implement the sanity checker as
    follows. The invariant check is invoked periodically at an interval $S$. If the
    invariant violation is detected, we actively monitor additional scheduler events
    (described below) for a short time period $M$ to see if this is a "legal" short-term
    violation that is promptly fixed by the scheduler. If it is not fixed, we record
    profiling information (described below) and flag a bug. The probability of detecting
    the actual bugs, i.e., long-term invariant violations, depends on the frequency
    and duration of the invariant violation. In most cases we described, once the
    bug triggers an invariant violation, the system never recovers. Such invariant
    violations are trivially detected by the sanity checker. In one case (the Overload-on-Wakeup
    bug), invariant violations persisted for shorter periods, on the order of hundreds
    of milliseconds, then disappeared and reappeared again. In this case, the probability
    of catching the violation depends on the total fraction of time that the system
    spends in the undesirable state. If the fraction is small, the chances of detecting
    the bug are also small, but so is the impact on performance. Longer-lasting and/or
    more frequently occurring violations are detected with a higher probability. Furthermore,
    if the bug-triggering workload keeps running, the chances that the sanity checker
    detects the bug during at least one of the checks keep increasing. We set $S$
    and $M$ to minimize the overhead and the probability of false positives and to
    maximize the probability of detecting the actual bugs. Our setting for $S$ is
    one second; If the bug is detected, the sanity checker begins gathering profiling
    information to include in the bug report. We use **systemtap** to profile calls
    to all load balancing functions (e.g., `load_balance`, `select_task_rq.fair`)
    along with all the statements executed by these functions and the values of the
    variables they use. We used these profiles to understand how the load-balancing
    functions were executed and why they failed to balance the load. Note that we
    do not record the part of the execution when the bug is triggered, but this is
    not an issue because we only want to understand why all load balancing calls fail
    during a significant period of time. Monitoring with `systemtap` has a high overhead
    (around 7% in our measurements), so we only begin profiling after detecting the
    bug and stop profiling after 20ms. Thanks to its small size, the sanity checker
    is easily portable between kernel versions, and does not conflict with patches
    that modify the scheduler. We originally implemented the sanity checker in Linux
    3.17. Porting to 4.3 only required changing one line of code (the `do_posix_clock_monotonic_gettime`
    function, that we used to get timing data, changed its name).


    ## 4.2 Scheduler Visualization tool

    The visualization tool we are about to describe was tremendously helpful in gauging
    the nature of bug symptoms and further understanding their root causes. The tool
    illustrates salient scheduling activity over time (the charts from this tool were
    shown to illustrate the bugs in the previous section). These charts rely on additional
    instrumentation of the kernel, whose overhead is negligible. Our visual tool makes
    it possible to profile and to plot (1) the size of run queues, (2) the total load
    of run queues, and (3) the cores that were considered during periodic load balancing
    and thread wakeups. In order to provide maximum accuracy, it does not use sampling,
    instead, it records every change in the size of run queues or load, as well as
    a set of considered cores at each load rebalancing or thread wakeup event. To
    keep the overhead low, we store all profiling information in a large global array
    in memory of a static size. Each element of this array is an event that corresponds
    to either (1), (2), or (3):

