    - [3] Ftrace。https://www.kernel.org/doc/Documentation/trace/ftrace.txt。

    - [4] KernelShark。http://people.redhat.com/srostedt/kernelshark/HTML/。

    - [5] Linux 4.3调度器变更“可能影响所有现有SMP工作负载”。http://www.phoronix.com/scan.php?page=news_item&px=Linux-4.3-Scheduler-SMP。

    - [6] SystemTap。https://sourceware.org/systemtap/。

    - [7] J. Antony、P. P. Janes和A. P. Rendell。探究非一致性内存访问（NUMA）架构上的线程与内存放置策略：Solaris与Linux系统，UltraSPARC/FirePlane与Opteron/HyperTransport架构。载于第13届高性能计算国际会议论文集，HiPC''06，2006年。

    - [8] S. Blagodurov、S. Zhuravlev和A. Fedorova。多核系统上的内容感知调度。《ACM计算机系统汇刊》，28:8:1–8:45，2010年。

    - [9] S. Blagodurov、S. Zhuravlev、M. Dashti和A. Fedorova。多核系统上NUMA感知资源争用管理的案例。载于2011年美国enix年度技术会议论文集，USENIX
    ATC''11，2011年。

