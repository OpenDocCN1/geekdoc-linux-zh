    我们的健全性检查器验证的不变量如算法2所示。该算法用于验证：当一个核心的运行队列中存在等待线程时，不会有其他核心处于空闲状态。我们致力于保持代码简洁，哪怕这会提升算法复杂度，以尽可能降低健全性检查器本身出现缺陷的概率。这有助于确保除了极短程序外的所有程序的不变量违规都能被检测到，同时将开销保持在较低水平。在我们的系统中，当$S=1$时，即使面对多达10000个线程的工作负载，测得的开销也低于0.5%。


