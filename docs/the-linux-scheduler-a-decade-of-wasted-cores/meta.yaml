    # 3.4 The Missing Scheduling Domains bug


    The bug. When a core is disabled and then re-enabled using the /proc interface,
    load balancing between any NUMA nodes is no longer performed. The bug is due to
    an incorrect update of a global variable representing the number of scheduling
    domains in the machine. When a core is disabled, this variable is set to the number
    of domains inside a NUMA node. As a consequence, the main scheduling loop (line
    1 of Algorithm 1) exits earlier than expected.


    As a result, threads can only run on the node on which they ran before the core
    had been disabled (even if the node they run on is not the same as that on which
    the core was disabled and then re-enabled). For processes created after disabling
    the core, all threads will run on the same node as their parent process. Since
    all processes are usually created from the same "root" process (e.g., sshd daemon
    and the ssh processes it spawns), this bug usually results in all newly created
    threads executing on only one node of the machine, regardless of the number of
    threads.


    Figure 5 shows a visualization of this bug. An application with 16 threads is
    launched on the machine. After the threads have been created, all cores on Node
    1 run two threads (orange horizontal lines). The blue vertical lines originating
    from Core 0 represent the cores considered by Core 0 when it tries to steal work.
    Because the loop exits earlier than it should, Core 0 only considers cores local
    to its node, and not cores of Node 1.


    The fix. We traced the root cause of the bug to the code that regenerates the
    machine''s scheduling domains. Linux regenerates scheduling domains every time
    a core is disabled. Regenerating the scheduling domains is a two-step process:
    the kernel regenerates domains inside NUMA nodes, and then across NUMA nodes.
    Unfortunately, the call to the function generating domains across NUMA nodes was
    dropped by Linux developers during code refactoring. We added it back, and doing
    so fixed the bug.


