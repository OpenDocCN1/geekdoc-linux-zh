    我们追踪到该缺陷的根源在于重新生成机器调度域的代码：Linux 会在每次核心被禁用时重新生成调度域，重新生成调度域是一个两步流程：内核首先重新生成 NUMA
    节点内的域，再重新生成跨 NUMA 节点的域。不幸的是，Linux 开发者在代码重构过程中遗漏了生成跨 NUMA 节点域的函数调用。我们将其添加回来，成功修复了该缺陷。


