    ## 3.3 The Overload-on-Wakeup bug

    ### The bug.

    The gist of this bug is that a thread that was asleep may wake up on an overloaded
    core while other cores in the system are idle. The bug was introduced by an optimization
    in the wakeup code (`select_task_rq_fair` function). When a thread goes to sleep
    on Node *X* and the thread that wakes it up later is running on that same node,
    the scheduler only considers the cores of Node *X* for scheduling the awakened
    thread. If all cores of Node *X* are busy, the thread will wake up on an already
    busy core and miss opportunities to use idle cores on other nodes. This can lead
    to a significant under-utilization of the machine, especially on workloads where
    threads frequently wait. The rationale behind this optimization is to maximize
    cache reuse. Essentially, the scheduler attempts to place the woken up thread
    physically close to the waker thread, e.g., so both run on cores sharing a last-level
    cache, in consideration of producer-consumer workloads where the woken up thread
    will consume the data produced by the waker thread. This seems like a reasonable
    idea, but for some workloads waiting in the runqueue for the sake of better cache
    reuse does not pay off.


    This bug was triggered by a widely used commercial database configured with 64
    worker threads (1 thread per core) and executing the TPC-H workload. This workload,
    in combination with transient short-lived threads from other applications, triggers
