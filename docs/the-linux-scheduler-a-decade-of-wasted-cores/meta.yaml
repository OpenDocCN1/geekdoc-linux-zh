    ## 3.5 Discussion

    The first question to ask is whether these bugs could be fixed with a new, cleaner
    scheduler design that is less error-prone and easier to debug, but still maintains
    the features we have today. Historically though, this does not seem like it would
    be a long-term solution, in addition to the fact that the new design would need
    to be implemented and tested from scratch. The Linux scheduler has gone through
    a couple major redesigns. The original scheduler had high algorithmic complexity,
    which resulted in poor performance when highly multithreaded workloads became
    common. In 2001, it was replaced by a new scheduler with O(1) complexity and better
    scalability on SMP systems. It was initially successful but soon required modifications
    for new architectures like NUMA and SMT. At the same time, users wanted better
    support for desktop use cases such as interactive and audio applications which
    required more changes to the scheduler. Despite numerous modifications and proposed
    heuristics, the O(1) scheduler was not able to meet expectations and was replaced
    by CFS in 2007. Interestingly, CFS sacrifices O(1) complexity for O(log n) but
    it was deemed worthwhile to provide the desired features. As the hardware and
    workloads became more complex, CFS too succumbed to bugs. The addition of autogroups
    coupled with the hierarchical load balancing introduced the Group Imbalance bug.
    Asymmetry in new, increasingly more complex NUMA systems triggered the Scheduling
    Group Construction bug. “NUMA-ness” of modern systems was responsible for the
    Missing Scheduling Domains bug. Cache-coherency overheads on modern multi-node
    machines motivated the cache locality optimization that caused the Overload-on-Wakeup
    bug. The takeaway is that new scheduler designs come and go. However, a new design,
    even if clean and purportedly bug-free initially, is not a long-term solution.
    Linux is a large open-source system developed by dozens of contributors. In this
    environment, we will inevitably see new features and “hacks” retrofitted into
    the source base to address evolving hardware and applications. The recently-released
    Linux 4.3 kernel features a new implementation of the load metric. This change
    is reported to be “done in a way that significantly reduces complexity of the
    code” [5]. Simplifying the load metric could get rid of the Group Imbalance bug,
    which is directly related to it. However, we confirmed, using our tools, that
    the bug is still present. Kernel developers rely on mutual code review and testing
    to prevent the introduction of bugs. This could potentially be effective for bugs
    like the Missing Scheduling Domains and Scheduling Group Construction that are
    easier to spot in the code (of course, it still was not effective in these cases),
    but it is unlikely to be reliable for the more arcane types of bugs. Catching
    these bugs with testing or conventional performance monitoring tools is tricky.
    They do not cause the system to crash or to run out of memory, they silently eat
    away at performance. As we have seen with the Group Imbalance and the Overload-on-Wakeup
    bugs, they introduce short-term idle periods that “move around” between different
    cores. These microscopic idle periods cannot be noticed with performance monitoring
    tools like htop, sar or perf. Standard performance regression testing is also
    unlikely to catch these bugs, as they occur in very specific situations (e.g.,
    multiple applications with different thread counts launched from distinct ttys).
    In practice, performance testing on Linux is done with only one application running
    at a time on a dedicated machine – this is the standard way of limiting factors
    that could explain performance differences. In summary, conventional testing techniques
    and debugging tools were not helpful to us in either confirming the bugs, after
    we initially suspected them, or understanding their root causes. Our experience
    motivated us to build new tools, using which we could productively confirm the
    bugs and understand why they occur. The following section describes the tools.


    ## 4. Tools

    ### 4.1 Online Sanity Checker

    Sanity checker is a term we use to describe a mechanism for periodically checking
    an invariant that must be maintained.⁶ All our fixes will be submitted to the
    kernel developers shortly.'
