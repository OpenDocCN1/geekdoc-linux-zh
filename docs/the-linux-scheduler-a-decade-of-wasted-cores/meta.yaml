    ## 3.4 缺失调度域缺陷

    ### 缺陷说明

    当通过 `/proc` 接口禁用某个核心后再重新启用时，任意 NUMA 节点之间的负载均衡将不再执行。该缺陷源于对代表机器调度域数量的全局变量的错误更新：当核心被禁用时，该变量会被设置为单个
    NUMA 节点内的域数量。因此，主调度循环（算法1第1行）会过早退出。其后果是，线程只能在核心被禁用前所在的节点上运行（即使该节点与核心被禁用并重新启用的节点并非同一个）。对于禁用核心后创建的进程，其所有线程都将在与其父进程相同的节点上运行。由于所有进程通常都由同一个“根”进程（例如
    sshd 守护进程及其派生的 ssh 进程）创建，因此该缺陷通常会导致所有新创建的线程仅在机器的单个节点上执行，无论线程数量多少。图5展示了该缺陷的可视化结果：我们在机器上启动了一个包含16个线程的应用程序，线程创建完成后，节点1上的所有核心各运行两个线程（橙色横线）。从核心0发出的蓝色竖线代表核心0尝试窃取任务时考虑的核心，由于循环过早退出，核心0仅考虑其所在节点的核心，不会考虑节点1的核心。


