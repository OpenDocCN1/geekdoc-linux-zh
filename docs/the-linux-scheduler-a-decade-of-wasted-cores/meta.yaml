    Figures 2, 4, and 5 are examples of these plots.


    In our experience, confirming and understanding the tricky performance bugs described
    in this paper, and detecting them across kernel versions was substantially more
    productive after we developed these tools. Since the tools catch important bugs,
    while at the same time being simple, virtually overhead-free and easy to port
    across kernel versions, we believe that it is a good idea to keep them as part
