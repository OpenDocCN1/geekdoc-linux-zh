- img_proc: true
  md: 'These bugs have different root causes, but a common symptom. **The scheduler
    unintentionally and for a long time leaves cores idle while there are runnable
    threads *waiting in runqueues*. ** Short-term occurrences of this condition are
    acceptable: the system may temporarily enter such a state when, for instance,
    a thread exits or blocks or when a thread is created or becomes unblocked. Long-term
    occurrences are not an expected behavior. The Linux scheduler is work-conserving,
    meaning that it should never leave cores idle if there is work to do. Long-term
    presence of this symptom is, therefore, unintentional: it is due to bugs and it
    hurts performance.


    We provide fixes to these bugs, and observe substantial performance improvements.
    Synchronization-intensive applications experienced many-fold speedups; one barrier-heavy
    scientific application ended up running 138 times faster.² Kernel wake and a TPC-H
    workload on a widely used commercial DBMS improved performance by 13% and 14%
    respectively. The TPC-H query most affected by the bug sped up by 23%.


    Detecting these bugs is difficult. They do not cause the system to crash or hang,
    but eat away at performance, often in ways that are difficult to notice with standard
    performance monitoring tools. With the TPC-H workload, for example, the symptom
    occurred many times throughout the execution, but each time it lasted only a few
    hundreds of milliseconds – too short to detect with tools like htop, sar or perf.
    Yet, collectively these occurrences did enough damage to slow down the most affected
    query by 23%. Even in cases where the symptom was present for a much longer duration,
    the root cause was difficult to discover, because it was a result of many asynchronous
    events in the scheduler.


    We initially suspected scheduler bugs when we observed unexplained performance
    in the TPC-H database workload, which we were evaluating for a different project.
    Conventional tools were unhelpful to us in either confirming the bugs or understanding
    their root causes. To that end, we designed two new tools. The first tool, which
    we call *a sanity checker*, periodically checks for the violation of the aforementioned
    invariant, catches the bugs on a live system and collects a trace with relevant
    information for offline analysis. The second tool visualizes traces of scheduling
    activity to expedite debugging. These tools were easy to port between kernel versions
    (from Linux 3.17 through 4.3), ran with negligible overhead and consistently detected
    invariant violations. Keeping them in the standard tool belt can help reduce future
    occurrence of this class of bugs.


    The rest of the paper is organized as follows. Section 2 describes the architecture
