    The bug originates from an attempt to improve the performance of Linux on large
    NUMA systems. Before the introduction of the bug, Linux would balance the load
    inside NUMA nodes and then across all NUMA nodes. New levels of hierarchy (nodes
    1 hop apart, nodes 2 hops apart, etc.) were introduced to increase the likelihood
    for threads to remain close to their original NUMA node.


