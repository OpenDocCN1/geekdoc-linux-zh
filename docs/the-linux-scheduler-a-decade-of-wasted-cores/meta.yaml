  md: '# The Linux Scheduler: a Decade of Wasted Cores


    Jean-Pierre Lozi

    Université Nice Sophia-Antipolis

    jplozi@unice.fr


    Fabien Gaud

    Coho Data

    me@fabiengaud.net


    Baptiste Lepers

    EPFL

    baptiste.lepers@epfl.ch


    Vivien Quéma

    Grenoble INP / ENSIMAG

    vivien.quema@imag.fr


    Justin Funston

    University of British Columbia

    jfunston@ece.ubc.ca


    Alexandra Fedorova

    University of British Columbia

    sasha@ece.ubc.ca


    # Abstract


    As a central part of resource management, the OS thread scheduler must maintain
    the following, simple, invariant: make sure that ready threads are scheduled on
    available cores. As simple as it may seem, we found that this invariant is often
    broken in Linux. Cores may stay idle for seconds while ready threads are waiting
    in runqueues. In our experiments, these performance bugs caused many-fold performance
    degradation for synchronization-heavy scientific applications, 13% higher latency
    for kernel mke, and a 14-23% decrease in TPC-H throughput for a widely used commercial
    database. The main contribution of this work is the discovery and analysis of
    these bugs and providing the fixes. Conventional testing techniques and debugging
    tools are ineffective at confirming or understanding this kind of bugs, because
    their symptoms are often evasive. To drive our investigation, we built new tools
    that check for violation of the invariant online and visualize scheduling activity.
    They are simple, easily portable across kernel versions, and run with a negligible
    overhead. We believe that making these tools part of the kernel developers'' tool
    belt can help keep this type of bug at bay.


    Classical scheduling problems revolve around setting the length of the scheduling
    quantum to provide interactive responsiveness while minimizing the context switch
    overhead, simultaneously catering to batch and interactive workloads in a single
    system, and efficiently managing scheduler run queues. By and large, by the year
    2000, operating systems designers considered scheduling to be a solved problem;
    the Linus Torvalds quote is an accurate reflection of the general opinion at that
    time.


    Year 2004 brought an end to Dennard scaling, ushered in the multicore era and
    made energy efficiency a top concern in the design of computer systems. These
    events once again made schedulers interesting, but at the same time increasingly
    more complicated and often broken.


    Our recent experience with the Linux scheduler revealed that the pressure to work
    around the challenging properties of modern hardware, such as non-uniform memory
    access latencies (NUMA), high costs of cache coherency and synchronization, and
    diverging CPU and memory latencies, resulted in a scheduler with an incredibly
    complex implementation. As a result, the very basic function of the scheduler,
    which is to make sure that runnable threads use idle cores, fell through the cracks.


    The main contribution of this work is the discovery and study of four performance
    bugs in the Linux scheduler. These bugs cause the scheduler to leave cores idle
    while runnable threads are waiting for their turn to run.¹ Resulting performance
    degradations are in the range 13-24% for typical Linux workloads, and reach 138×
    in some corner cases. Energy waste is proportional. Since these bugs undermine
    a crucial kernel sub-system, cause substantial, sometimes massive, degradation
    of performance, and evade conventional testing and debugging techniques, understanding
    their nature and provenance is important.


    # 1. Introduction


    > > "And you have to realize that there are not very many things that have aged
    as well as the scheduler. Which is just another proof that scheduling is easy.">

    > — Linus Torvalds, 2001 [43]


    ¹ This occurs even though the scheduler is not explicitly configured to save power
    by purposefully leaving cores unused so they can be brought into a low-power state.'
