    # 5. Lessons Learned


    We now reflect on the lessons learned during this study and identify open problems.


    The bugs we described resulted from developers wanting to put more and more optimizations
    into the scheduler, whose purpose was mostly to cater to complexity of modern
    hardware. As a result, the scheduler, that once used to be a simple isolated part
    of the kernel grew into a complex monster whose tentacles reached into many other
    parts of the system, such as power and memory management. The optimizations studied
    in this paper are part of the mainline Linux, but even more scheduling optimizations
    were proposed in the research community.


    As of circa 2000, dozens of papers described new scheduling algorithms catering
