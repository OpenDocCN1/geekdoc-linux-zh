    # 4.2 Scheduler Visualization tool


    The visualization tool we are about to describe was tremendously helpful in gauging
    the nature of bug symptoms and further understanding their root causes. The tool
    illustrates salient scheduling activity over time (the charts from this tool were
    shown to illustrate the bugs in the previous section). These charts rely on additional
    instrumentation of the kernel, whose overhead is negligible. Our visual tool makes
    it possible to profile and to plot (1) the size of run queues, (2) the total load
    of run queues, and (3) the cores that were considered during periodic load balancing
    and thread wakeups. In order to provide maximum accuracy, it does not use sampling,
    instead, it records every change in the size of run queues or load, as well as
    a set of considered cores at each load rebalancing or thread wakeup event. To
    keep the overhead low, we store all profiling information in a large global array
    in memory of a static size. Each element of this array is an event that corresponds
    to either (1), (2), or (3):


    +   - For (1), we instrument kernel functions `add_nr_running` and `sub_nr_running`,
    which are the only functions that directly alter the variables that stores the
    size of each run queue. In these functions, we store an event in our global array
    that contains a timestamp, the core number, and the new runqueue size.

    - Similarly, for (2), we instrument kernel functions `account_entity_enqueue`
    and `account_entity_dequeue`, which are the only functions that directly alter
    the variables that store the load of each run queue. In these functions, we store
    an event in our global array that contains a timestamp, the core number, and the
    new load.

    - Finally, for (3), we instrument kernel functions `select_idle_sibling`, `update_sg_lb_stats`,
    `find_busiest_queue` and `find_idlest_group`. In these functions, we store an
    event in our global array that contains a timestamp, as well as a bit field with
    0''s for cores that were not considered during the operation, and 1''s for cores
    that were.


    Implementing these changes in the Linux kernel took less than 150 lines of code.
    In order to write an event, a thread


    uses an atomic increment instruction to find the position in the array where to
    write the event; it then writes its event to memory which may incur a cache miss.
    On our architecture, 20 bytes are sufficient to store each event. In Section 3,
    the application that produced events at the highest frequency was the commercial
