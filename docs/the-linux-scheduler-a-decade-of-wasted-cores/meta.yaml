    Overload-on-Wakeup bug!). Though visualization is conceptually simple, implementing
    effective tools is not easy. Execution traces can be very large, so visualizing
    everything is not feasible and not useful. Understanding what to visualize and
    how to let the user effectively explore the trace when the user does not know
    what they are looking for is an important open problem. There most certainly exists
    research on this topic in the visualization community, but the systems community
    needs to more actively embrace those techniques and adapt them to the specificity
    of the problems we solve in systems.


    NUMA systems, which was closely tied to how threads are being scheduled [7, 14,
    18, 38], and algorithms that scheduled threads to minimize communication latency
    on systems with an asymmetric interconnect [23]. All of these algorithms showed
    positive benefits, either in terms of performance or power, for some real applications.
    However, few of them were adopted in mainstream operating systems, mainly because
    it is not clear how to integrate all these ideas in scheduler safely.


    If every good scheduling idea is slapped as an add-on to a single monolithic scheduler,
    we risk more complexity and more bugs, as we saw from the cases studies in this
    paper. What we need is to rethink the architecture of the scheduler, since it
    can no longer remain a small, compact and largely isolated part of the kernel.
    We now understand that rapid evolution of hardware that we are witnessing today
    will motivate more and more scheduler optimizations. The scheduler must be able
    to easily integrate them, and to have a way of reasoning about how to combine
    them. We envision a scheduler that is a collection of modules: the core module
    and optimization modules. The core module embodies the very basic function of
    the scheduler: assigning runnable threads to idle cores and sharing the cycles
    among them in some fair fashion. The optimization modules suggest specific enhancements
    to the basic algorithm. For example, a load-balancing module might suggest an
    alternative load balancing schedule that avoids excessive overhead. A cache affinity
    module might suggest waking a thread on a core where it recently ran. A resource
    contention module might suggest a placement of threads that reduces the chances
    of contention-induced performance degradation. The core module should be able
    to take suggestions from optimization modules and to act on them whenever feasible,
    while always maintaining the basic invariants, such as not letting cores sit idle
    while there are runnable threads. Deciding how to combine multiple optimizations
    when they conflict, e.g., if a cache affinity module and a resource contention
    module suggest different thread placements or if a load balancer risks to break
    memory-node affinity as it moves threads among runqueues, is a difficult open
    problem in scheduling.


    # **6. Related Work**


    # **Performance bugs.**


    Performance bugs are a recurring problem for operating systems. The Linux Kernel
    Performance project [13] was started in 2005 to combat performance regressions.
    Despite this effort, performance bugs are repeatedly reported by OS researchers.
    Boyd et al. [10] reported a variety of scalability bugs, and Harji et al. [20]
    reported other kinds performance bugs in 2.6 kernels.


    Mollison et al. [30] proposed a tool that performs regression testing specifically
    for schedulers. It targets realtime schedulers implemented as plug-ins for the
    LInux Testbed for MUltiprocessor Scheduling in Real-Time Systems (LITMUS^RT) project.
    The tool is limited (e.g., it does not take blocking into account) and does not
    target the Linux kernel''s fair scheduling policy (CFS).


    To combat performance bugs, Perl et al. [33] proposed to add assertions to kernels
    to check that function calls finish in a timely manner. Shen et al. [39] built
    a throughput model for checking the performance of I/Os. These techniques detect
    performance bugs using assertions, which is not applicable for detecting a problematic
    load imbalance in the scheduler. Temporary load imbalances are expected and not
    problematic. Therefore, our online sanity checker uses a different design to discriminate
    between problematic and non-problematic invariant violations.


    # **Kernel correctness.**


    A large body of work has also been done on verifying system correctness. RacerX
    [15] and Eraser [37] detect deadlocks and race conditions. Erickson et al. [16]
    detect data races in kernel modules. It would be ideal to extend these systems
    to target performance bugs, which do not necessarily result in systems crash;
    however, this is a difficult problem because short-term invariant violations are
    acceptable in our environment.


    D3S [25], Likely Invariants [36], and ExpressOS [28] use invariants and predicates
    to check correctness of simple operations (e.g., ensure that a variable is within
    a certain range). Our online sanity checker makes it possible to detect more subtle
    incorrect states of the system (i.e., systems with cores that are idle for a long
    time while other cores are overloaded), and it could be integrated into operating
    systems to validate higher-level design choices.


    Another lesson we learned as a result of this work is the crucial importance of
    visualization tools. Understanding the root causes of the bugs we described would
    not have been possible without visualization of the execution events relevant
    to the problem. Visualizing execution is definitely not a new idea. While isolated
    clusters of system developers (e.g., certain engineering teams at Google [26,
    40]) have embraced it, the developer community at large is missing effective visualization
    tools. There are many great trace-gathering tools, such as systemtap, Pivot tracing
    [27], or Intel Processor Tracing. However, without effective visualization, developers
    tend to only summarize and aggregate the information available in the traces,
    which obscures outliers that are responsible for bugs and performance problems
