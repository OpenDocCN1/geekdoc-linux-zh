    [23]. All of these algorithms showed positive benefits, either in terms of performance
    or power, for some real applications. However, few of them were adopted in mainstream
    operating systems, mainly because it is not clear how to integrate all these ideas
    in the scheduler safely. If every good scheduling idea is slapped as an add-on
    to a single monolithic scheduler, we risk more complexity and more bugs, as we
    saw from the case studies in this paper. What we need is to rethink the architecture
    of the scheduler, since it can no longer remain a small, compact and largely isolated
    part of the kernel. We now understand that rapid evolution of hardware that we
    are witnessing today will motivate more and more scheduler optimizations. The
    scheduler must be able to easily integrate them, and to have a way of reasoning
    about how to combine them. We envision a scheduler that is a collection of modules:
    the core module and optimization modules. The core module embodies the very basic
    function of the scheduler: assigning runnable threads to idle cores and sharing
    the cycles among them in some fair fashion. The optimization modules suggest specific
    enhancements to the basic algorithm. For example, a load-balancing module might
    suggest an alternative load-balancing schedule that avoids excessive overhead.
    A cache-affinity module might suggest waking a thread on a core where it recently
    ran. A resource-contention module might suggest a placement of threads that reduces
    the chances of contention-induced performance degradation. The core module should
    be able to take suggestions from optimization modules and to act on them whenever
    feasible, while always maintaining the basic invariants, such as not letting cores
    sit idle while there are runnable threads. Deciding how to combine multiple optimizations
    when they conflict, e.g., if a cache-affinity module and a resource-contention
    module suggest different thread placements or if a load balancer risks breaking
    memory-node affinity as it moves threads among runqueues, is a difficult open
    problem in scheduling.


    ## **6. Related Work**


    ### **Performance bugs.**

    Performance bugs are a recurring problem for operating systems. The Linux Kernel
    Performance project [13] was started in 2005 to combat performance regressions.
    Despite this effort, performance bugs are repeatedly reported by OS researchers.
    Boyd et al. [10] reported a variety of scalability bugs, and Harji et al. [20]
    reported other kinds of performance bugs in 2.6 kernels. Mollison et al. [30]
    proposed a tool that performs regression testing specifically for schedulers.
    It targets real-time schedulers implemented as plug-ins for the Linux Testbed
    for Multiprocessor Scheduling in Real-Time Systems (LITMUS^RT) project. The tool
    is limited (e.g., it does not take blocking into account) and does not target
    the Linux kernel''s fair scheduling policy (CFS). To combat performance bugs,
    Perl et al. [33] proposed to add assertions to kernels to check that function
    calls finish in a timely manner. Shen et al. [39] built a throughput model for
    checking the performance of I/Os. These techniques detect performance bugs using
    assertions, which is not applicable for detecting a problematic load imbalance
    in the scheduler. Temporary load imbalances are expected and not problematic.
    Therefore, our online sanity checker uses a different design to discriminate between
    problematic and non-problematic invariant violations.


    ### **Kernel correctness.**

    A large body of work has also been done on verifying system correctness. RacerX
    [15] and Eraser [37] detect deadlocks and race conditions. Erickson et al. [16]
    detect data races in kernel modules. It would be ideal to extend these systems
    to target performance bugs, which do not necessarily result in system crashes;
    however, this is a difficult problem because short-term invariant violations are
    acceptable in our environment. D3S [25], Likely Invariants [36], and ExpressOS
    [28] use invariants and predicates to check correctness of simple operations (e.g.,
    ensure that a variable is within a certain range). Our online sanity checker makes
    it possible to detect more subtle incorrect states of the system (i.e., systems
    with cores that are idle for a long time while other cores are overloaded), and
    it could be integrated into operating systems to validate higher-level design
    choices.


    Another lesson we learned as a result of this work is the crucial importance of
    visualization tools. Understanding the root causes of the bugs we described would
    not have been possible without visualization of the execution events relevant
    to the problem. Visualizing execution is definitely not a new idea. While isolated
    clusters of system developers (e.g., certain engineering teams at Google [26,
    40]) have embraced it, the developer community at large is missing effective visualization
    tools. There are many great trace-gathering tools, such as SystemTap, Pivot tracing
    [27], or Intel Processor Tracing. However, without effective visualization, developers
    tend to only summarize and aggregate the information available in the traces,
    which obscures outliers that are responsible for bugs and performance problems.
    Model checking has also been used to detect bugs in kernels. CMC [31] injects
    states in the kernel to find implementation bugs. Yang et al. [45] found errors
    in file systems (e.g., deadlocks) using model checking. Model checking is a useful
    approach to find bugs before they happen. The scheduler is particularly challenging
    to model check due to the large number of possible workloads and intricacies of
    hardware behavior (e.g., topology, behavior of sleeping cores). Model checkers
    could be used to find crash bugs in the scheduler, but to the best of our knowledge,
    none of these works could be used to detect more subtle performance bugs.


    Formal verification is a method for proving software correctness by analyzing
    the source code. Traditionally, formal verification was limited to small codebases
    and languages other than C, but recently, through the heroic efforts of several
    OS researchers, formal verification was applied to OS kernels [11, 12, 21]. Even
    so, these state-of-the-art methods do not apply to the bugs described here, because
    they are limited to single-threaded environments and do not have a way of reasoning
    about time. Formal tools work by describing the system as a series of state transitions,
    pre-conditions and post-conditions, and then reason whether any state transitions
    may lead to violation of post-conditions given the possible pre-conditions. The
    problem is that in our environment, short and intermittent violations of post-conditions
    (i.e., idle cores in the presence of waiting threads) are totally acceptable.
    It is the long-term violations that are problematic. Unfortunately, existing tools
    do not have the mechanisms allowing to reason how timing affects transient violation
    of invariants. Extending these tools to work in multithreaded environments and
    to reason about time could make them more suitable, but having Linux developers
    write formal specifications will be another hurdle for adoption of these tools.


    ### Tracing.

    Due to the complexity of some of the bugs we encountered, the Overload-on-Wakeup
    bug in particular, profiling tools were not sufficient to fully understand their
    causes: we needed traces in order to precisely follow the behavior of the scheduler.
    Many tracing tools have been proposed to help detect performance bugs. Event Tracing
    for Windows [2] and DTrace [1] are frameworks that make it possible to trace application
    and kernel events, including some scheduler events, for the Microsoft Windows,
    Solaris, macOS X and FreeBSD operating systems. The Linux kernel comes with its
    own set of tracers, such as Ftrace [3] and SystemTap [6]. Some additional tools
    such as KernelShark [4] produce graphical traces. Our online sanity checker does
    not provide a novel way to monitor events, and directly relies on SystemTap for
    this purpose. What our sanity checker does that is not included in these tools,
    however, is detecting an invariant violation in order to only monitor events while
    a performance bug is occurring: running existing tracing tools all the time would
    be of little use to detect performance bugs, since they would produce large amounts
    of data that would overwhelmingly consist of non-buggy execution traces, with
    no way to jump to the buggy sections of these traces. Moreover, our visualization
    tool is capable of monitoring very fine-grained scheduler events that were crucial
    to understanding some of the performance bugs presented in this paper, such as
    individual scheduling events (which makes it possible to plot which scheduling
    event was responsible each time a thread moves across cores), or individual iterations
    in the work-stealing loop (which makes it possible to monitor which cores are
    considered during load balancing).


    ## **7. Conclusion**

    Scheduling, as in dividing CPU cycles among threads, was thought to be a solved
    problem. We show that this is not the case. Catering to the complexities of modern
    hardware, a simple scheduling policy resulted in a very complex, bug-prone implementation.
    We discovered that the Linux scheduler violates a basic work-conserving invariant:
    scheduling waiting threads onto idle cores. As a result, runnable threads may
    be stuck in runqueues for seconds while there are idle cores in the system; application
    performance may degrade many-fold. The nature of these bugs makes it difficult
    to detect them with conventional tools. We fix these bugs, understand their root
    causes, and present tools, which make catching and fixing these bugs substantially
    easier. Our fixes and tools will be available at http://git.io/vaGOw.


