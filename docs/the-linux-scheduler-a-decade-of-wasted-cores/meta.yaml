    bugs. Understanding the bugs is necessary to appreciate why they evade conventional
    testing and debugging tools. Therefore, we describe the bugs first and delay the
    presentation of the tools that we used to confirm and understand them until Section
    4. Table 4 summarizes the bugs described in this section.


