    # ## 2.2.1 The load balancing algorithm


    Crucial for understanding the load balancing algorithm is the metric that the
    CFS scheduler uses to track load. We begin by explaining the metric and then describe
    the actual algorithm.


    **The load tracking metric.** A strawman load-balancing algorithm would simply
    ensure that each runqueue has roughly the same number of threads. However, this
    is not necessarily what we want. Consider a scenario with two runqueues, where
    one queue has


    some number of high-priority threads and another queue has the same number of
    low-priority threads. Then high-priority threads would get the same amount of
    CPU time as low-priority threads. That is not what we want. One idea, then, is
    to balance the queues based on threads'' weights, not their number.


    Unfortunately, balancing the load based solely on thread weights is not sufficient
    either. Consider a scenario with ten threads in two runqueues: one thread is of
    high priority and nine threads are of low priority. Let us assume that the weight
    of the high-priority thread is nine times higher than those of the low-priority
    threads. With the load balanced according to threads'' weights, one runqueue would
    contain the high-priority thread, while the other would contain the nine low-priority
    threads. The high-priority thread would get nine times more CPU than the low-priority
    threads, which appears to be what we want. However, suppose that the high-priority
    thread often sleeps for short periods of time, so the first core often goes idle.
    This core would have to frequently steal work from the other core''s runqueue
    to keep itself busy. However, we do not want work stealing to become the common
    case, because this defeats the purpose of per-core runqueues. What we really want
    is to balance the runqueues in a smarter way, accounting for the fact that the
    high priority thread does not need a whole core.


    To achieve this goal, CFS balances runqueues not just based on weights, but based
    on a metric called load, which is the combination of the thread''s weight and
    its average CPU utilization. If a thread does not use much of a CPU, its load
    will be decreased accordingly.


    Additionally, the load-tracking metric accounts for varying levels of multithreading
    in different processes. Consider a scenario where we have one process with lots
