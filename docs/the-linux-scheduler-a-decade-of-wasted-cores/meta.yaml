    Power-related optimizations may further reduce the frequency of load balancing
    on an idle core. Originally, idle cores were always awoken on every clock tick;
    at this point they would run the load-balancing algorithm. However, since version
    2.6.21 Linux has the option (now enabled by default) to avoid periodically waking
    up sleeping cores: they enter a *tickless idle* state, in which they can reduce
    their energy use. The only way for a core in this state to get work when another
    core is overloaded is to be awoken by another core. To this end, on each scheduling
    tick, if a core deems itself "overloaded", it checks whether there have been tickless
    idle cores in the system for some time, and if so, it wakes up the first tickless
    idle core and assigns it the role of **NOHZ balancer**. The NOHZ balancer core
    is responsible, on each tick, to run the periodic load balancing routine for itself
    and on behalf of all tickless idle cores.


    On top of periodic load balancing, the scheduler also balances load when waking
    up threads. When a thread wakes up, after sleeping or waiting for a resource (e.g.,
    locks, I/O), the scheduler tries to place it on the idlest core. Special rules
    apply when the thread is awoken by another thread (waker thread). In that case
    the scheduler will favour cores sharing a cache with the waker thread to improve
    cache reuse.


    # 3. Bugs


    > > "Nobody actually creates perfect code the first time around, except me. But
    there''s only one of me."

