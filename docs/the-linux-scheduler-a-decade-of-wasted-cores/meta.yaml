    We modified the construction of scheduling groups so that each core uses scheduling
    groups constructed from its perspective. After the fix, when cores of Node 1 and
    2 try to steal tasks at the level of the machine, Nodes 1 and 2 are no longer
    included in all scheduling groups. The cores are thus able to detect an imbalance
    and to steal work.


