    # **The fix.**


    To fix the bug, we changed the part of the algorithm that compares the load of
    scheduling groups. Instead of comparing the **average** loads, we compare the
    **minimum** loads (lines 11 and 15 of Algorithm 1). The minimum load is the load
    of the least loaded core in that group. If the minimum load of one scheduling
    group is lower than the minimum load of another scheduling group, it means that
    the first scheduling group has a core that is less loaded than *all* cores in
    the other group, and thus a core in the first group must steal from the second
    group. This algorithm ensures that no core of the second group will remain overloaded
    while a core of the first group has a smaller load, thus balancing the load across
    cores. Note that this fix works, because load is also balanced *inside* the groups
    (because of load balancing calls at lower levels of the hierarchy). Just as the
