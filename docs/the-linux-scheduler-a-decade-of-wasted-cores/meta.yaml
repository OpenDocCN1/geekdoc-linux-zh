    among threads sharing data [41] and determined the optimal number of cores to
    allocate to multhreaded workloads [17]. There were algorithms that addressed the
    scheduling of threads on asymmetric multicore CPUs [22, 35] and algorithms that
    integrated scheduling with the management of power and temperature [19]. Finally,
