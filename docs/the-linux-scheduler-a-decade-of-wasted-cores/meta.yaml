    > 我想，要让调度器使用每CPU队列，再配合一些跨CPU负载均衡逻辑，应该是_相当简单的_。相关补丁已经存在了，我觉得没人能把这几百行代码搞得太糟。\n>\
    \ —莱纳斯·托瓦兹，2001年 [43]\n\n从概念上讲，负载均衡很简单。2001年时，CPU大多是单核的，商用服务器系统通常只有少数几个处理器，因此很难预见到，在现代多核系统中，负载均衡会变得颇具挑战性。在如今的系统中，负载均衡是一项开销很高的操作，无论是计算开销还是通信开销都很大，因为它涉及修改远程缓存的数据结构，会引发成本极高的缓存未命中和同步操作。因此，调度器会尽量避免频繁执行负载均衡操作。但另一方面，如果执行频率过低，又可能导致运行队列失衡。出现这种情况时，即使有待处理任务，核心也可能处于空闲状态，从而影响性能。因此，除了周期性负载均衡外，调度器还会在核心空闲时触发“紧急”负载均衡，并在新建线程或新唤醒线程被分配时执行部分负载均衡逻辑。理论上，这些机制可以确保只要有待处理任务，所有核心都能保持忙碌。接下来我们将介绍负载均衡的工作原理，首先讲解相关算法，然后说明调度器为降低开销、节省电量所采用的优化措施。后文我们将说明，部分优化措施会增加代码复杂度，甚至引发缺陷。\n\
    \n## 2.2.1 负载均衡算法\n理解负载均衡算法的关键在于CFS调度器用于追踪负载的指标。我们首先讲解该指标，再介绍实际的算法。\n\n### 负载追踪指标\n\
    一个朴素的负载均衡算法会简单地确保每个运行队列中的线程数量大致相同，但这未必是我们想要的效果。考虑这样一种场景：两个运行队列中，一个队列有若干高优先级线程，另一个队列有数量相同的低优先级线程，那么高优先级线程会和低优先级线程获得相同量的CPU时间，这显然不是我们想要的。因此，有人提出可以根据线程的权重而非数量来平衡队列。但不幸的是，仅基于线程权重来平衡负载也是不够的。\n\
    再考虑另一种场景：两个运行队列中共有10个线程，其中1个是高优先级线程，9个是低优先级线程。我们假设高优先级线程的权重是低优先级线程的9倍。如果按照线程权重平衡负载，一个运行队列会放高优先级线程，另一个放9个低优先级线程，高优先级线程会获得9倍于低优先级线程的CPU时间，这看起来符合我们的预期。但如果高优先级线程经常短时间休眠，那么对应的核心就会频繁空闲。这个核心需要频繁从其他核心的运行队列中偷取任务来保持忙碌，但我们不希望偷取任务成为常态，因为这会违背每核心独立运行队列的设计初衷。我们真正需要的是用更合理的方式平衡运行队列，要考虑到高优先级线程并不需要占用整个核心。\n\
    为实现这一目标，CFS调度器不仅基于权重，还基于一个名为“负载”的指标来平衡运行队列，该指标是线程权重和其平均CPU利用率的结合。如果某个线程的CPU使用率很低，它的负载值也会相应降低。此外，负载追踪指标还会考虑不同进程的多线程程度差异。考虑这样的场景：一个进程有很多线程，另一个进程只有少量线程，那么前一个进程的所有线程加起来会获得远多于后一个进程线程的CPU时间，最终前一个进程会占用大部分CPU周期，导致后一个进程“饥饿”，这显然是不公平的。因此，从2.6.38版本开始，Linux新增了组调度功能，以实现不同线程组之间的公平性（即cgroup功能）。当线程属于某个cgroup时，其负载还会进一步除以该cgroup内的线程总数。该功能后来被扩展，可自动将属于不同tty的进程分配到不同的cgroup中（即自动分组功能）。\n\
    \n### 负载均衡算法\n基础的负载均衡算法会比较所有核心的负载，然后将任务从负载最高的核心迁移到负载最低的核心。但不幸的是，这样做会导致线程在整台机器上迁移，却不会考虑缓存局部性或NUMA架构的影响。因此，负载均衡器采用了分层策略。\n\
    核心会被逻辑地组织成层次结构，最底层是单个核心。更高层级中核心的分组方式，取决于它们如何共享机器的物理资源。本节我们以实验用机器（见表5）的层次结构为例进行说明：在这台机器中，成对的核心共享功能单元（例如浮点单元FPU），每8个核心为一组共享最后一级缓存（LLC）。共享一个LLC的8个核心组成一个NUMA节点，不同NUMA节点的互连方式有所不同，具体说明和展示见图4。因此，在我们目标系统的层次结构中，第二层是成对的核心，下一层是每8个核心一组、共享同一LLC的组（即NUMA节点）。NUMA节点还会根据互连层级进一步分组[23]。间隔为一跳的节点会放在同一层级，以此类推。这类层次结构的实例如图1所示。\n\
    ![图1：一台拥有32核心、4个节点（每节点8核心）、支持SMT层级共享的机器。四个灰色区域代表相对于机器第一个核心的调度域。注意：在层次结构的第二层，我们有三个节点组成的组，这是因为这三个节点都可以从第一个核心一跳到达。在第4层，我们拥有机器的所有节点，因为所有节点都可以在2跳内到达。图4展示了我方系统中节点之间的互连关系。](img/784531c49b2139b7953fa84543328260_3_0.png)\n\
