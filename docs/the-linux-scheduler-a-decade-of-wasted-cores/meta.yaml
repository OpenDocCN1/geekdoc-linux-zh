  md: 'Model checking has also been used to detect bugs in kernels. CMC [31] inject
    states in the kernel to find implementation bugs. Yang et al. [45] found errors
    in file systems (e.g. deadlocks) using model checking. Model checking is a useful
    approach to find bugs before they happen. The scheduler is particularly challenging
    to model check due to the large number of possible workloads and intricacies with
    hardware behavior (e.g., topology, behavior of sleeping cores). Model checkers
    could be used to find crash bugs in the scheduler, but to the best of our knowledge,
    none of these works could be used to detect more subtle performance bugs.


    Formal verification is a method for proving software correctness by analyzing
    the source code. Traditionally, formal verification was limited to small codebases
    and languages other than C, but recently, through heroic efforts of several OS
    researchers, formal verification was applied to OS kernels [11, 12, 21]. Even
    so, these state-of-the-art methods do not apply to the bugs described here, because
    they are limited to single-threaded environments and do not have a way of reasoning
    about time. Formal tools work by describing the system as series of state transitions,
    pre-conditions and post-conditions, and then reason whether any state transitions
    may lead to violation of post-conditions given the possible pre-conditions. The
    problem is that in our environment, short and intermittent violations of post-conditions
    (i.e., idle cores in the presence of waiting threads) are totally acceptable.
    It is the long-term violations that are problematic. Unfortunately, existing tools
    do not have the mechanisms allowing to reason how timing affects transient violation
    of invariants. Extending these tools to work in multithreaded environments and
    to reason about time could make them more suitable, but having Linux developers
    write formal specifications will be another hurdle for adoption of these tools.


    # Tracing.


    Due to the complexity of some of the bugs we encountered, the Overload-on-Wakeup
    bug in particular, profiling tools were not sufficient to fully understand their
    causes: we needed traces in order to precisely follow the behavior of the scheduler.


    Many tracing tools have been proposed to help detect performance bugs. Event Tracing
    for Windows [2] and DTrace [1] are frameworks that make it possible to trace application
    and kernel events, including some scheduler events, for the Microsoft Windows,
    Solaris, MacOS X and FreeBSD operating systems. The Linux kernel comes with its
    own set of tracers, such as Ftrace [3] and SystemTap [6]. Some additional tools
    such as KernelShark [4] produce graphical traces.


    Our online sanity checker does not provide a novel way to monitor events, and
    directly relies on SystemTap for this purpose. What our sanity checker does that
    is not included in these tools, however, is detecting an invariant violation in
    order to only monitor events while a performance bug is occurring: running existing
    tracing tools all the time would be of little use to detect performance bugs,
    since they would pro-duce large amounts of data that would overwhelmingly con-


    duce large amounts of data that would overwhelmingly consist of non-buggy execution
    traces, with no way to jump to the buggy sections of these traces. Moreover, our
    visualization tool is capable of monitoring very fine-grained scheduler events
    that were crucial to understanding some of the performance bugs presented in this
    paper, such as individual scheduling events (which makes it possible to plot which
    scheduling event was responsible each time a thread moves across cores), or individual
    iterations in the work-stealing loop (which makes it possible to monitor which
    cores are considered during load balancing).


    # 7. Conclusion


    Scheduling, as in dividing CPU cycles among threads was thought to be a solved
    problem. We show that this is not the case. Catering to complexities of modern
    hardware, a simple scheduling policy resulted in a very complex bug-prone implementation.
    We discovered that the Linux scheduler violates a basic work-conserving invariant:
    scheduling waiting threads onto idle cores. As a result, runnable threads may
    be stuck in runqueues for seconds while there are idle cores in the system; application
    performance may degrade many-fold. The nature of these bugs makes it difficult
    to detect them with conventional tools. We fix these bugs, understand their root
    causes and present tools, which make catching and fixing these bugs substantially
    easier. Our fixes and tools will be available at http://git.io/vaGOw.


