- md: '## The Linux Scheduler: a Decade of Wasted Cores

    Jean-Pierre Lozi

    Université Nice Sophia-Antipolis

    jplozi@unice.fr

    Fabien Gaud

    Coho Data

    me@fabiengaud.net

    Baptiste Lepers

    EPFL

    baptiste.lepers@epfl.ch

    Vivien Quéma

    Grenoble INP / ENSIMAG

    vivien.quema@imag.fr

    Justin Funston

    University of British Columbia

    jfunston@ece.ubc.ca

    Alexandra Fedorova

    University of British Columbia

    sasha@ece.ubc.ca


    ## Abstract

    As a central part of resource management, the OS thread scheduler must maintain
    the following, simple, invariant: make sure that ready threads are scheduled on
    available cores. As simple as it may seem, we found that this invariant is often
    broken in Linux. Cores may stay idle for seconds while ready threads are waiting
    in runqueues. In our experiments, these performance bugs caused many-fold performance
    degradation for synchronization-heavy scientific applications, 13% higher latency
    for kernel make, and a 14-23% decrease in TPC-H throughput for a widely used commercial
    database. The main contribution of this work is the discovery and analysis of
    these bugs and providing the fixes. Conventional testing techniques and debugging
    tools are ineffective at confirming or understanding this kind of bugs, because
    their symptoms are often evasive. To drive our investigation, we built new tools
    that check for violation of the invariant online and visualize scheduling activity.
    They are simple, easily portable across kernel versions, and run with a negligible
    overhead. We believe that making these tools part of the kernel developers'' tool
    belt can help keep this type of bug at bay. Classical scheduling problems revolve
    around setting the length of the scheduling quantum to provide interactive responsiveness
    while minimizing the context switch overhead, simultaneously catering to batch
    and interactive workloads in a single system, and efficiently managing scheduler
    run queues. By and large, by the year 2000, operating systems designers considered
    scheduling to be a solved problem; the Linus Torvalds quote is an accurate reflection
    of the general opinion at that time. Year 2004 brought an end to Dennard scaling,
    ushered in the multicore era and made energy efficiency a top concern in the design
    of computer systems. These events once again made schedulers interesting, but
    at the same time increasingly more complicated and often broken. Our recent experience
    with the Linux scheduler revealed that the pressure to work around the challenging
    properties of modern hardware, such as non-uniform memory access latencies (NUMA),
    high costs of cache coherency and synchronization, and diverging CPU and memory
    latencies, resulted in a scheduler with an incredibly complex implementation.
    As a result, the very basic function of the scheduler, which is to make sure that
    runnable threads use idle cores, fell through the cracks. The main contribution
    of this work is the discovery and study of four performance bugs in the Linux
    scheduler. These bugs cause the scheduler to leave cores idle while runnable threads
    are waiting for their turn to run.¹ Resulting performance degradations are in
    the range 13-24% for typical Linux workloads, and reach 138× in some corner cases.
    Energy waste is proportional. Since these bugs undermine a crucial kernel sub-system,
    cause substantial, sometimes massive, degradation of performance, and evade conventional
    testing and debugging techniques, understanding their nature and provenance is
    important.


    ## 1. Introduction

    > "And you have to realize that there are not very many things that have aged
    as well as the scheduler. Which is just another proof that scheduling is easy."

    > — Linus Torvalds, 2001 [43]


    ¹ This occurs even though the scheduler is not explicitly configured to save power
    by purposefully leaving cores unused so they can be brought into a low-power state.


    These bugs have different root causes, but a common symptom. **The scheduler unintentionally
    and for a long time leaves cores idle while there are runnable threads *waiting
    in runqueues*. ** Short-term occurrences of this condition are acceptable: the
    system may temporarily enter such a state when, for instance, a thread exits or
    blocks or when a thread is created or becomes unblocked. Long-term occurrences
    are not an expected behavior. The Linux scheduler is work-conserving, meaning
    that it should never leave cores idle if there is work to do. Long-term presence
    of this symptom is, therefore, unintentional: it is due to bugs and it hurts performance.
    We provide fixes to these bugs, and observe substantial performance improvements.
    Synchronization-intensive applications experienced many-fold speedups; one barrier-heavy
    scientific application ended up running 138 times faster.² Kernel make and a TPC-H
    workload on a widely used commercial DBMS improved performance by 13% and 14%
    respectively. The TPC-H query most affected by the bug sped up by 23%. Detecting
    these bugs is difficult. They do not cause the system to crash or hang, but eat
    away at performance, often in ways that are difficult to notice with standard
    performance monitoring tools. With the TPC-H workload, for example, the symptom
    occurred many times throughout the execution, but each time it lasted only a few
    hundreds of milliseconds – too short to detect with tools like htop, sar or perf.
    Yet, collectively these occurrences did enough damage to slow down the most affected
    query by 23%. Even in cases where the symptom was present for a much longer duration,
    the root cause was difficult to discover, because it was a result of many asynchronous
    events in the scheduler. We initially suspected scheduler bugs when we observed
    unexplained performance in the TPC-H database workload, which we were evaluating
    for a different project. Conventional tools were unhelpful to us in either confirming
    the bugs or understanding their root causes. To that end, we designed two new
    tools. The first tool, which we call *a sanity checker*, periodically checks for
    the violation of the aforementioned invariant, catches the bugs on a live system
    and collects a trace with relevant information for offline analysis. The second
    tool visualizes traces of scheduling activity to expedite debugging. These tools
    were easy to port between kernel versions (from Linux 3.17 through 4.3), ran with
    negligible overhead and consistently detected invariant violations. Keeping them
    in the standard tool belt can help reduce future occurrence of this class of bugs.


    The rest of the paper is organized as follows. Section 2 describes the architecture
    of the Linux scheduler. Section 3 introduces the bugs we discovered, analyzes
    their root causes and reports their effect on performance. Section 4 presents
    the tools. In Section 5 we reflect on the lessons learned as a result of this
    study and identify open research problems. Section 6 discusses related work and
    Section 7 summarizes our findings.


    ## 2. The Linux Scheduler

    We first describe how Linux''s Completely Fair Scheduling (CFS) algorithm works
    on a single-core single-user system (Section 2.1). From this perspective, the
    algorithm is quite simple. Then, in (Section 2.2) we explain how limitations of
    modern multicore systems force developers to work around potential performance
    bottlenecks, which results in a substantially more complex and bug-prone implementation.


    ### 2.1 On a single-CPU system, CFS is very simple

    Linux''s CFS is an implementation of the weighted fair queueing (WFQ) scheduling
    algorithm, wherein the available CPU cycles are divided among threads in proportion
    to their weights. To support this abstraction, CFS (like most other CPU schedulers)
    time-slices the CPU among the running threads. The key decisions made in the scheduler
    are: how to determine a thread''s timeslice? and how to pick the next thread to
    run? The scheduler defines a fixed time interval during which each thread in the
    system must run at least once. The interval is divided among threads proportionally
    to their weights. The resulting interval (after division) is what we call the
    timeslice. A thread''s weight is essentially its priority, or niceness in UNIX
    parlance. Threads with lower niceness have higher weights and vice versa. When
    a thread runs, it accumulates vruntime (runtime of the thread divided by its weight).
    Once a thread''s vruntime exceeds its assigned timeslice, the thread is pre-empted
    from the CPU if there are other runnable threads available. A thread might also
    get pre-empted if another thread with a smaller vruntime is awoken. Threads are
    organized in a runqueue, implemented as a red-black tree, in which the threads
    are sorted in the increasing order of their vruntime. When a CPU looks for a new
    thread to run it picks the leftmost node in the red-black tree, which contains
    the thread with the smallest vruntime.


    ### 2.2 On multi-core systems, CFS becomes quite complex

    In multicore environments the implementation of the scheduler becomes substantially
    more complex. Scalability concerns dictate using per-core runqueues. The motivation
    for per-core runqueues is that upon a context switch the core would access only
    its local runqueue, when it looks for a thread to run. Context switches are on
    a critical path, so they must be fast. Accessing only a core-local queue prevents
    the scheduler from making potentially expensive synchronized accesses, which would
    be required if it accessed a globally shared runqueue. However, in order for the
    scheduling algorithm to still work correctly and efficiently in the presence of
    per-core


    ² As we explain later in the paper, scheduling shortcomings exacerbated lock contention.'
