    ## Linux调度器：被浪费的核心的十年

    Jean-Pierre Lozi

    Université Nice Sophia-Antipolis

    jplozi@unice.fr

    Fabien Gaud

    Coho Data

    me@fabiengaud.net

    Baptiste Lepers

    EPFL

    baptiste.lepers@epfl.ch

    Vivien Quéma

    Grenoble INP / ENSIMAG

    vivien.quema@imag.fr

    Justin Funston

    University of British Columbia

    jfunston@ece.ubc.ca

    Alexandra Fedorova

    University of British Columbia

    sasha@ece.ubc.ca

    ## 摘要

    作为资源管理的核心组成部分，操作系统线程调度器必须遵循以下这条简单的恒定规则：确保就绪线程被调度到可用核心上运行。尽管这条规则看似简单，但我们发现Linux中常常会违反该规则。就绪线程在运行队列中等待时，核心可能会空闲数秒之久。在我们的实验中，这些性能缺陷导致对同步开销较高的科学应用程序性能下降数倍，内核编译的延迟升高13%，同时一款广泛使用的商业数据库的TPC-H吞吐量下降了14%-23%。本研究的主要贡献是发现、分析这些缺陷并提供修复方案。传统的测试技术和调试工具无法有效确认或理解这类缺陷，因为它们的症状往往十分隐蔽。为了推进研究，我们开发了新型工具，能够在线检测对该恒定规则的违反情况，并可视化调度活动。这些工具简单易用，可轻松跨内核版本移植，且运行开销几乎可以忽略。我们相信，将这些工具加入内核开发者的工具库，有助于避免这类缺陷的出现。


    经典的调度问题主要围绕设置调度时间片的长度展开，目标是在最小化上下文切换开销的同时提供交互响应能力，在单一系统中同时支持批处理与交互式工作负载，并高效管理调度器运行队列。总体而言，到2000年时，操作系统设计者普遍认为调度问题已经得到解决；林纳斯·托瓦兹的那句话准确反映了当时的主流观点。2004年Dennard缩放定律终结，多核时代随之到来，能效也成为计算机系统设计的首要关注点。这些事件让调度器再次成为研究热点，但同时也使其变得越来越复杂，且常常出现故障。我们近期对Linux调度器的研究显示，为了规避现代硬件的棘手特性带来的压力——比如非均匀内存访问延迟（NUMA）、缓存一致性及同步的高开销，以及CPU与内存延迟的差异——最终导致调度器的实现极为复杂。因此，调度器最基本的职能——确保可运行线程使用空闲核心——反而被忽视了。本研究的主要贡献是发现并研究了Linux调度器中的四个性能缺陷。这些缺陷会导致调度器在可运行线程等待运行机会时让核心处于空闲状态。¹
    由此导致的典型Linux工作负载的性能下降幅度在13%-24%之间，部分极端场景下更是达到138倍。能源浪费与此成正比。由于这些缺陷破坏了关键的内核子系统，会导致严重的（有时是灾难性的）性能下降，并且能够躲过传统的测试与调试技术，因此理解它们的本质和来源至关重要。


    ## 1. 引言

    > “你必须意识到，没多少东西能像调度器一样历经时间考验依然表现良好。这恰恰证明了调度是件简单的事。”

    > —— 林纳斯·托瓦兹，2001年 [43]


    ¹ 这种情况的出现，尽管调度器并未被显式配置为刻意留空核心以使其进入低功耗状态来节能。


    这些缺陷的根源各不相同，但症状一致。**调度器会在存在可运行线程*处于运行队列中等待*的情况下，无意间长时间让核心处于空闲状态。** 这种状态的短期出现是可以接受的：例如线程退出、阻塞，或是线程被创建、解除阻塞时，系统可能会暂时进入这种状态。长期出现该状态则不属于预期行为。Linux调度器是工作保持型的，意味着只要有待处理任务，就不应该让核心空闲。因此，该症状长期存在属于非预期情况：这是由缺陷导致的，会损害性能。我们针对这些缺陷提供了修复方案，并观察到了显著的性能提升。对同步开销较高的应用程序而言，运行速度提升了数倍；一款对内存屏障依赖程度极高的科学应用程序最终运行速度提升了138倍。²
    在一款广泛使用的商业数据库管理系统上，内核编译和TPC-H工作负载的性能分别提升了13%和14%。受该缺陷影响最大的TPC-H查询速度提升了23%。


    检测这些缺陷难度很高。它们不会导致系统崩溃或卡死，但会悄悄消耗性能，而且通常很难通过标准性能监控工具察觉。例如，在运行TPC-H工作负载时，该症状在执行过程中出现了多次，但每次仅持续数百毫秒——时间太短，无法通过htop、sar或perf这类工具检测到。但累计起来，这些情况足以让受影响最严重的查询速度下降23%。即使在症状持续时间更长的情况下，也很难找到根本原因，因为这是调度器中大量异步事件共同导致的结果。我们最初怀疑存在调度器缺陷，是在为一个不同项目评估TPC-H数据库工作负载时，观察到了无法解释的性能问题。传统工具既无法帮助我们确认缺陷，也无法帮助我们理解其根本原因。为此，我们设计了两款新工具。第一款工具我们称之为*健全性检查器*，它会周期性地检测上述恒定规则的违反情况，在运行中的系统上捕捉缺陷，并收集包含相关信息的追踪数据以供离线分析。第二款工具可以可视化调度活动追踪数据，加快调试速度。这些工具很容易在不同内核版本间移植（支持Linux
    3.17到4.3版本），运行开销几乎可以忽略，且能够稳定检测到对恒定规则的违反情况。将这些工具纳入标准工具库，有助于减少这类缺陷未来的出现。本文其余部分安排如下。第2节介绍Linux调度器的架构；第3节介绍我们发现缺陷、分析其根本原因并阐述其对性能的影响；第4节介绍我们开发的两款工具；第5节总结本研究获得的经验教训，并指出尚未解决的研究问题；第6节讨论相关研究；第7节总结我们的研究成果。


    ## 2. Linux调度器

    我们首先介绍Linux的完全公平调度（Completely Fair Scheduling，CFS）算法在单核单用户系统上的运行原理（见2.1节）。从这个角度看，该算法十分简单。随后，在2.2节中我们将解释现代多核系统的局限性如何迫使开发者规避潜在的性能瓶颈，最终导致实现变得极为复杂，更易出现缺陷。


    ### 2.1 在单CPU系统上，CFS十分简单

    Linux的CFS是加权公平队列（Weighted Fair Queueing，WFQ）调度算法的实现，该算法会将可用CPU周期按线程的权重比例进行分配。为了实现这一抽象逻辑，CFS（和大多数其他CPU调度器一样）会为运行中的线程分配CPU时间片。调度器需要做出两个关键决策：如何确定线程的时间片长度？以及如何选择下一个要运行的线程？


    调度器会定义一个固定的时间间隔，系统内的每个线程都至少要在该间隔内运行一次。该间隔会按照线程的权重比例进行分配，分配后的结果就是我们所说的“时间片”。线程的权重本质上就是它的优先级，在UNIX术语中也称为“nice值”。nice值越低的线程权重越高，反之亦然。线程运行时会累计虚拟运行时间（vruntime，即线程运行时间除以其权重）。一旦线程的虚拟运行时间超过其分配的时间片，若存在其他可运行线程，该线程就会被从CPU上抢占。如果有虚拟运行时间更小的线程被唤醒，当前线程也可能被抢占。线程会被组织在运行队列中，该队列以红黑树实现，线程按照虚拟运行时间从小到大的顺序排列。当CPU需要寻找新的运行线程时，会选择红黑树中最左侧的节点，该节点包含的是虚拟运行时间最小的线程。


    ### 2.2 在多核系统上，CFS变得十分复杂

    在多核环境中，调度器的实现会变得复杂得多。出于可扩展性考虑，必须使用单核心运行队列。使用单核心运行队列的原因是，发生上下文切换时，核心只需要访问本地运行队列来寻找要运行的线程。上下文切换处于关键路径上，因此速度必须足够快。只访问核心本地队列可以避免调度器进行可能开销较高的同步访问，如果访问全局共享的运行队列就需要这类同步操作。


    ² 正如我们在后文所解释的，调度方面的不足加剧了锁争用。

    '
