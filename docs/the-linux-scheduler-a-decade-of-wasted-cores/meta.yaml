    该算法从层次结构的最底层开始，逐层向上处理，每次平衡低一层的负载。例如，在图1所示的系统中，核心会从成对核心层级开始，平衡该组内两个独立核心之间的负载。之后会进入NUMA节点层级，平衡其下一层（也就是本例中的成对核心）的负载，但**不会平衡NUMA节点内各个独立核心之间的负载**。在调度域中，执行负载均衡的核心集合被称为*调度组*。在NUMA节点域中，会有4个调度组，每个对应一对核心。核心会找到自身所属调度组之外的最忙调度组，并从该组的最忙核心处偷取任务。\n\
