  /tmp(/dev/vg00/lvol7): 42306 total allocated Kb 28873 free allocated Kb 3433 used\
  \ allocated Kb 0% allocation\n/usr(/dev/vg00/lvol8): 598200 total allocated Kb 283706\
  \ free allocated Kb 314494 used allocated Kb 52% allocation\n/var(/dev/vg00/lvol9):\
  \ 259341 total allocated Kb 68893 free allocated Kb 190448 used allocated Kb 73%\
  \ allocation\n/stand(/dev/vg00/lvol1): 43046 total allocated Kb 28522 free allocated\
  \ Kb 14524 used allocated Kb 33% allocation\n/(/dev/vg00/lvol3): 75359 total allocated\
  \ Kb 53928 free allocated Kb\n```\n\n\n\n\n\n## 磁盘使用与管理\n\n```\n21431 used allocated\
  \ Kb\n28 % allocation used | | | |\n```\n\n上述输出来自一个生产系统。`df -k` 命令报告了文件系统中可用的千字节数，以及分配给该文件系统的总千字节数。输出还显示了已使用的千字节以及文件系统使用的百分比。这些信息非常有用，因为你可以此确定系统空闲空间在哪里，以及有多少空间可用于额外的存储。\n\
  \n请记住，并非所有空闲空间对标准用户都是可用的。UNIX 要求文件系统和目录留有足够的空间以保证它们能够增长。你的系统管理员经常使用 `df` 命令作为其工具套件的一部分来管理系统。根据经验，当文件系统的空闲空间低于\
  \ 10% 百时，就是时候开始归档并删除旧的未用文件以释放空间了。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n### 注意\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n再次强调，请务必阅读你特定系统的文档；惠尔-惠提到有一个更好的命令 `bdf`。\n\n`df` 命令的输出引出了另一个有趣的点。注意文件系统名称后面的 `/dev/vgxx/lvolxx`（例如\
  \ `/usr (/dev/vg00/lvol8`）。这表明文件系统正由卷管理器管理，更具体说是惠尔-惠的逻辑卷管理器（LVM）。简而言之，这意味着当文件系统装满时，只需向组成该文件系统的磁盘池中添加另一个硬盘驱动器。\n\
  \n## 进程\n\n本章以讨论 UNIX 进程结束。`process`（进程）简单来说就是正在执行的程序。你到目前见过的每个命令实际上都是某人编写的用于执行有用功能的程序。UNIX\
  \ 系统设计成能够同时处理许多程序的执行。这背后的思想是虚拟机。简单来说，虚拟机意味着每个人似乎都独立拥有机器的全部权限。每个用户都可以执行命令或程序，而不必担心其他用户在做什么。在大多数情况下，这种自主性是真实的。然而，如果另一个用户正在运行一个占用机器大部分资源的程序，其他用户就会知道，因为他们的程序和命令运行得比正常慢。这时你的系统管理员就会介入进行性能调优。系统管理员可能会增加内存、磁盘或\
  \ CPU 来解决问题。他可能会要求所有的 `hog` 程序在特定小时内运行，以免影响其他用户。无论他们做出什么选择，目标都是让用户社区工作尽可能高效且经济。看看你可以如何查看机器上正在运行的进程。在\
  \ shell 提示符处，输入 `ps -ef`。\n\n```\nUID      PID    PPID   C  STIME       TTY    \
  \ TIME  COMMAND\nroot       0      0  0  Oct 28      ?       1:05   swapper\nroot\
  \       1      0  0  Oct 28      ?       0:00   init\nroot       2      0  0  Oct\
  \ 28      ?       0:36   vhand\nroot       3      0  0  Oct 28      ?       308:2\
  \   daemon\nroot       4      0  0  Oct 28      ?       8:7    ash\nroot       7\
  \      0  0  Oct 28      ?       356:35  isr\nroot      70     0  0  Oct 28    \
  \  ?       0:0    lvmkd\nroot       1      0  0  Oct 28      ?       0:0    lvmkd\n\
  root       2      0  0  Oct 28      ?       0:0    lvmkd\nroot      13      0  0\
  \  Oct 28      ?      26:35   vx_sched_thread\nroot      14      0  0  Oct 28  \
  \    ?       5:16   vx_iflush_thread\nroot      15      0  0  Oct 28      ?    \
  \   5:24   vx_ifree_thread\nroot      16      0  0  Oct 28      ?       5:45   vx_inactive_cache\n\
  root      17      0  0  Oct 28      ?       1:35   vx_delxwri_thread\nroot     \
  \ 18      0  0  Oct 28      ?       1:18   vx_logflush_thread\nroot      19    \
  \  0  0  Oct 28      ?       0:07   vx_attrsync_thread\nroot      20      0  0 \
  \ Oct 28      ?       0:17   vx_inactive_thread\nroot      21      0  0  Oct 28\
  \      ?       0:0    vx_inactive_thread\nroot     2194      0  0  Oct 28      ?\
  \      14:0   ora_dbwr\nroot     2192      0  0  Oct 28      ?       0:0    ora_smon\n\
  root     2503      0  0  Oct 28      ?      48:0   ora_pmon\nroot     2519     \
  \ 0  0  Oct 28      ?       9:46   ora_lgwr\nroot     8735      0  0  Oct 28   \
  \   ?      20:32   sh\nroot     8765      0  0  Oct 28      ?      22:26   sh\n\
  ```\n\n现在让我们看看输出。你从标题中注意到几列源于此输出；你只需要理解对此项重要的几列。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n\n\n\n\n#进程信息\n\n- `UID`: 进程所有者的用户 ID。\n- `PID`: 进程的进程 ID。\n- `PPID`: 父进程的进程 ID。\n\
  - `STIME`: 进程的启动时间。如果超过 24 小时，则显示启动日期。\n- `TTY`: 进程的控制终端。\n- `TIME`: 进程的累计执行时间。\n\
  - `COMMAND`: 正在执行的命令。\n\n注意，我们简写输出的最后一条显示了执行 `ps -ef` 命令的进程。还要注意它正方的进程——这是该命令的父进程。通过查看此类报告，我们可以看到\
  \ UNIX 如何在特定时间点执行系统中运行的命令和程序。如果我们再次执行 `ps -ef` 命令，我们将看到新旧进程的混合。这是因为某些程序在机器的整个生命周期内一直留留在系统中。这些程序属于操作系统，并执行必要的资源管理以保持系统正常运行。\n\
  \n在完成这一切之后，你仅仅触及了 UNIX 计算能力方面的冰一角。正如我在章节开头说的，即使是知识最丰富的 UNIX 专家，起初也和你现在一样。你学习得越多、对\
  \ UNIX 操作系统及其工具越熟悉，你指尖的计算能力就越大。\n\n## 第 4 章：输入 UNIX 命令的规则\n作者 Steve Moritsugu\n\
  第 81 页\n\n## 识别 UNIX Shell 提示符\n### 理解命令、选项和参数，并在它们之间添加必要的空格\n### 为命令添加注释\n### 从\
  \ Man 页面（帮助页）获取帮助\n### 从重排索引（Permuted Index）获取帮助\n### 命令未找到错误\n### 设置目录的路径\n\n##\
  \ Shell 提示符回顾\n让我们看看当我登录到 UNIX 系统时发生了什么：\n\n```\nlogin: mor\nPassword:\nLast login:\
  \ Fri Mar 13 17:33:22 from :0 Sun Microsystems Inc. SunOS 5.6 Generic\n$ _\n```\n\
  \n登录时出现的消息会因系统而异。在前面的示例中，在登录信息完成后，系统显示一个美元符号（`$`），光标停在它旁边等待输入。美元符号被称为 `prompt`（提示符），因为它提示用户输入命令。\n\
  \n生成美元符号提示符的程序是 `shell`（外壳）。shell 程序是一个命令行解释器，允许用户输入命令。本章的目的是介绍向 shell 输入 UNIX 命令的规则。主要有三种\
  \ shell 程序，它们在大多数商业 UNIX 系统上都可用：\n- Bourne shell\n- C shell\n- Korn shell\n\nKorn\
  \ shell 的语法是 Bourne shell 的超集，因此两者非常兼容。Bourne shell 和 Korn shell 都使用美元符号提示符。该规则的唯一例外是当你以系统管理员\
  \ `root` 身份登录时。由于 root 账户共同拥有所有文件和目录，它可以无视文件或目录权限进行更改。当你以 `root` 登录时，系统会显示特殊的 shell\
  \ 提示符——井号（`#`），提醒你这是一个全能账户，你必须小心不要犯任何错误，或者不要离开终端让任何人访问。\n\n### Root 注意事项\n为系统管理员一个普通的\
  \ UNIX 账户并在大多数时间使用是一个好主意。仅在需要时使用 `su` 命令变为 `root`。\n\n如果你看到百分号（`%`）作为 shell 提示符，你可能处于\
  \ C shell 中。C shell 的语法和规则与 Bourne 及 Korn shell 不同，因此它为普通用户显示不同的提示符。如果你以 `root`\
  \ 登录，C shell 将像 Bourne 和 Korn shell 一样使用井号提示符。\n\n第 82 - 83 页\n\n\n\n\n你可能会遇到的其他\
  \ shell（特别是在 Linux 下）包括 `tcsh`（它类似于 C shell）以及 `bash`（后者又称为 GNU Bourne-Again Shell，它结合了\
  \ C shell 和 Korn shell 的有用功能）。\n\n可以为特定用户自定义 shell 提示符（prompt）。如果你处于网络环境中，有时会看到你的\
  \ shell 提示符包含你的系统名称。例如：\n\n```\nsparcster$ _\n```\n\n这是一个非常有用的提示符，因为网络允许你登录到各种 UNIX\
  \ 主机，有时你可能会混淆自己当前正在访问哪种系统。shell 提示符并不一定以通常的 shell 提示符字符结束，如下面的示例所示：\n\n```\n[sparcster]\
  \ _\n```\n\n在 Korn shell 中（但 Bourne shell 不行），可以将当前目录作为 shell 提示符的一部分。请看以下示例：\n\n\
  ```bash\n/usr/fred > cd /tmp\n/tmp > cd /usr/jane/reports\n/usr/jane/reports > cd\
  \ acme/fiscal97/glaccounts\n/usr/jane/reports/acme/fiscal97/glaccounts > ls\nacme\n\
  report6\nreport7\n/usr/jane/reports/acme/fiscal97/glaccounts > _\n```\n\n在这里，shell\
  \ 提示符包含了当前目录，并以大于号（`>`）结束。你的当前目录从 `/usr/fred` 开始。当你切换到 `/tmp` 时，你可以看到 shell 提示符会自动跟踪我们的当前目录。请注意，当前目录可能包含许多子目录并变得很长，留给你输入命令的空间非常小。你仍然可以输入长命令，因为命令会自动换到下一行并继续显示你的输入。然而，当你想要查看之前的命令时，这可能会难以阅读。\n\
  \n正如你所看到的，shell 提示符可以以许多不同的形式出现。当你第一次登录时，请花一点时间看看你的 shell 提示符在该系统中是如何显示的，这样你以后就能识别出它。正如你在本章中看到的，使用\
  \ UNIX 必须掌握的技能之一就是识别你何时处于 shell 提示符状态，何时进入了某种意外情况。有关 UNIX shell 的更多信息，请参阅第 27 页。\n\
  \n### UNIX 命令行选项、参数和注释\n\n在 shell 提示符处，你需要向 UNIX 输入命令。一个 UNIX 命令可以是一个简单的单词：\n\n\
  ```bash\nexit\n```\n\n在这里，`exit` 命令允许你结束 shell 并返回登录提示符。如果 `exit` 不起作用，尝试 `logout`\
  \ 命令或使用 `Ctrl+D`。\n\n```\ndate Sun Mar 15 07:30:49 PST 1998\n```\n\n### 大小写敏感\n\n\
  大小写敏感——单词是大写、小写还是两者的组合——非常取决于具体情况。在 UNIX 中，你必须警惕大写和小写。许多命令需要参数（也称为参数），参数是告诉命令要操作对象的单词。\n\
  \n```bash\nrm acme pegasus\n```\n\n在这个示例中，`acme` 和 `pegasus` 是 `rm` 命令的参数。`rm` 是删除文件的命令。注意多个参数之间用空格分隔，而不是逗号。\n\
  \n```bash\ncd /tmp\n```\n\n在这个示例中，`/tmp` 是 `cd` 命令的参数，它允许你更改当前目录。注意在 UNIX 中，没有消息就是好消息。在这个示例中，你知道\
  \ `cd` 命令执行成功了，因为 shell 提示符在下一行重新出现，且没有错误信息。\n\n```bash\ncd /tmp\n```\n\n在命令和任何参数之间加上一个空格是非常重要的。在接下来的示例中，你可以看到某些消息可能是坏消息：\n\
  \n```\ncd/tmp\ncd/tmp: not found\n```\n\n\n\n在这里，`cd` 命令后不小心漏掉了空格。首先注意，在出现下一个 shell\
  \ 提示符之前，你收到了一条消息。你必须仔细阅读任何消息，因为它们通常意味着你的命令执行失败了（否则 UNIX 根本不会生成任何消息）。初学者往往会输入一系列命令，忽略这些消息，然后纳闷为什么程序不起作用。\n\
  \n在在上一个示例中，你可能认为 `cd` 命令失败是因为系统找不到 `/tmp` 目录。这是不对的。更仔细地观察错误信息：`cd/tmp` 未被找到。UNIX\
  \ 下的大多数命令实际上是编译好的程序或脚本工具，它们存在于单独的磁盘文件中。系统正在告诉你，`cd/tmp` 不是一个有效的命令，也就是说，磁盘上没有名为该名称的系统实用程序。\n\
  \n让我总结一下到目前为止的要点：\n\n1. 在 shell 提示符处，你输入的第一个单词必须是一个 UNIX 命令。\n2. 大多数 UNIX 命令必须以小写输入（但也有例外）。\n\
  3. 如果命令需要后续接参数，你必须在命令后输入一个空格。\n4. 然后，你可以根据该命令需要输入一个或多个参数。多个参数必须用空格分隔。\n5. 你必须为命令、参数以及命令行上的所有单词输入正确的大小写字母。\n\
  \n### 另另\n\n- 关于 `date` 命令的更多信息，请参阅第 72 页\n- 关于 `rm` 命令的更多信息，请参阅第 191 页\n- 关于 `cd`\
  \ 命令的更多信息，请参阅第 42 页\n\n### 在命令行中添加注释\n\n在后续的一些示例中，我将为命令行添加注释，因此现在让我向你介绍注释。`comment`（也称为\
  \ `remark`）包含供人类读者的解释性文字。在 UNIX shell 中，任何以井号（`#`）开头的单词都被视为注释的开始。注释一直持续到行尾。\n\n\
  ```\nrm amet # no longer needed so free up the disk\n```\n\n在这个示例中，`rm` 命令后面跟着一个注释。shell\
  \ 将忽略从井号（`#`）到行尾的所有内容。注释主要用于脚本编程，即把 UNIX 命令保存在文本文件中。如果你想让井号开始一段注释，必须在它前面加一个空格。否则，它只是一个普通字符（尽管我建议不要在文件名中使用它）。\n\
  \n### 空格分隔符\n\nUNIX 允许使用一个或多个空格或制表符任意组合来分隔命令、选项和参数。这些分隔符简称为 `white spaces`（空白）。\n\
  \n```\nrm amet # no longer needed so free up the disk\n```\n\n### 为命令输入选项\n\n大多数\
  \ UNIX 命令允许在命令行指定选项，以修改命令的操作方式。看下面的示例：\n\n```\nls -l /tmp\n```\n\n文件名特意以井号（`#`）开头，这样你就必须在处理文件之前停下来思考。shell\
  \ 无法访问 `#acme`，因为它是一个注释，但它可以访问 `./#acme`。\n\n在这里，`ls` 是你之前见过的用于列出目录文件的命令。`-l` 是\
  \ `ls` 命令的一个选项，导致它以长格式列出，显示文件的详细信息以及文件名。注意命令后有一个空格，这是要求的。注意使用破折号（`-`）来表示区分选项和参数。在这个示例中，`-l`\
  \ 是修改 `ls` 运行方式的选项。`/tmp` 是 `ls` 命令的一个参数，告诉 `ls` 要列出哪个目录。选项必须紧跟命令之后，并在命令的任何参数之前。还要注意我们处于\
  \ C shell 中，因为我们使用的是百分号（`%`）shell 提示符。\n\n```\nls -l -a /tmp # case 1\nls -a -l\
  \ /tmp # case 2\nls -la /tmp # case 3\nls -al /tmp # case 4\n```\n\n\n\n在这些示例中，你可以看到\
  \ UNIX 在输入多个（简单）选项时展现了极大的灵活性。`-a` 是 `ls` 的另一个选项（如果你对 `ls` 的所有功能感兴趣，请参阅附录 A，“UNIX\
  \ 命令”以获取更多信息）。\n\n上述四种情况都是实现同一目的的不同且有效的方法。注意，我在每行开头都使用了井号（#）来开始注释，正如我们在前一节中讨论的那样。Shell\
  \ 会忽略从井号到行尾的所有文本，这允许我添加解释性文字，以便让你们知道我指的是哪一行。\n\n在情况 1 中，我指定了每个选项，并在前面加了连字符。注意每个选项和参数之间需要一个空格。在情况\
  \ 2 中，注意选项的顺序并不重要。在情况 3 中，注意简单的单字母选项可以组合成复合选项，并在前面加一个连字符。在情况 4 中，注意选项可以以任何顺序组合在复合选项中。\n\
  \n注意，选项并不是通用的。一个命令的 `-v` 在与另一个命令配合时可能意味着完全不同的意思。你可能会发现某些命令的某个选项具有相同的含义，但其他命令的该选项字母却具有完全不同的含义。还要注意，某些选项在某些\
  \ UNIX 版本上可能不支持，或者该选项在另一个 UNIX 版本上可能会导致完全的结果。\n\n如果选项不是单字母，它们就无法组合成复合选项，如下：\n\n\
  ```bash\n$ find / -mount -print\n```\n\n在这里，调用 `find` 命令时带了两个选项：`-mount` 和 `-print`。这两个选项不能组合成复合选项。此外，`find`\
  \ 是一个选项顺序会产生差异的命令示例。\n\n某些 UNIX 命令并不总是要求在其选项前使用连字符：\n\n```bash\n$ tar tv\n```\n\n\
  `t` 和 `v` 是 `tar` 命令的选项。由于历史原因，这是通常不使用连字符的命令。大多数现代 UNIX 版本（包括 SCO 和 Solaris）允许在\
  \ `tar` 选项前加连字符，因此在指定选项时它不需要与其他命令有所不同，例如：\n\n```bash\n$ tar-tv\n```\n\n记住，必须按照以下顺序输入命令并用空格分隔：\n\
  \n1. 命令名称。\n2. 任何所需的选项，前面加一个连字符。\n3. 任何所需的参数。\n4. 任何所需的注释。在注释开头加一个空格和一个井号。\n\n另需参考\n\
  - 关于 `ls` 命令的更多信息，请参阅第 151 页。\n- 关于 `find` 命令的更多信息，请参阅第 153 页。\n- 关于 `tar` 命令的更多信息，请参阅第\
  \ 340 页。\n\n### 选项参数\n\n某些选项需要自己的参数，例如：\n\n```bash\n$ lp -dn3 laser \n```\n\n`lp`\
  \ 是打印文件的命令。`-d` 是 `lp` 的选项，允许你指定使用哪个打印机。同样，`-n` 是 `lp` 的选项，用于指定每个文件的打印副本数。`laser`\
  \ 是 `lp` 命令的参数，用于指定要打印的文件。\n\n大多数命令允许或要求在选项及其参数之间留空格。我通常首先尝试使用空格，因为这样整个命令更具可读性。如果遇到错误，会在不留空格的情况下重试命令。提示：使用命令行编辑可以方便地编辑和提交之前的命令。\n\
  \n当你第一次学习英语语法时，将句子拆分为主语、谓语、介词和介词宾语有助于你提高阅读能力并构建正确的句子。同样，将 UNIX 命令行分析为命令、选项、选项参数和命令参数，有助于你更好地理解你所遇的命令，也有助于你构建正确的\
  \ UNIX 命令。\n\n### 在哪里可以获得帮助？(*man*)\n\n\n\n\n有 100 多个标准的 UNIX 命令和实用程序。每个命令可能有选项；某些命令可能有\
  \ 15 个或更多选项。这些选项并不是通用的，那么你到底如何记住所有命令的所有选项呢？幸运的是，你不需要这样做。UNIX 维护了一套在线手册，提供了关于每个命令及其选项的信息。\n\
  \n# 从 man 页（帮助页）获取帮助\n\n你使用 `man` 命令来访问这些信息：\n\n```bash\n$ man ls\n```\n\n此命令将向你显示如何使用\
  \ `ls` 命令的在线手册页。这个过程被称为查看 `ls` 的 man 页。大多数商用 UNIX 系统都有类似的 man 页。让我们看看我的 Solaris\
  \ 系统上 `ls` 的 man 页：\n\n```text\nUser Commands                   ls(1) \n\nNAME\n\
  \    ls - 列出目录内容 \n\nSYNOPSIS\n    /usr/bin/ls [ -aAbcCdfFgilLmnopqrRstux1 ] [ file...\
  \ ]\n    /usr/xpg4/bin/ls [ -aAbcCdfFgilLmnopqrRstux1 ] [ file... ]\n```\n\n`SYNOPSIS`（概要）部分在其他系统上有时被称为\
  \ `SYNTAX` 或 `USAGE`。它显示了组合此命令所需的格式。方括号 (`[]`) 中的条目是可选的。注意，`ls` 命令支持大量的命令选项。它允许将一个或多个文件名作为\
  \ `ls` 命令的参数。这个示例显示 Solaris 支持两种形式的 `ls` 命令。在 man 页的后面，它会指出两种形式之间的差异。\n\n```text\n\
  DESCRIPTION 对于每个目录文件，ls 会列出目录\n    的内容；对于每个普通文件，ls 会重复其名称\n    以及请求的任何其他信息。输出默认按字母顺序排序。当没有参数时\
  \ ...\n```\n\n`DESCRIPTION`（描述）部分内容很长，所以让我跳过这里，向你展示介绍命令行选项的地方：\n\n```text\nOPTIONS\
  \ 支持以下选项：\n    -a 列出所有条目，包括以点 (.) 开头的条目，这些通常不会被列出。\n    -A 列出所有条目，包括以点 (.) 开头的条目，但工作目录\
  \ (.) 和父目录 (..) 除外。\n    -b 强制将不可打印字符以八进制 \\ddd 符号打印。\n```\n\n由于 `ls` 有许多可用选项，这一部分也很长。事实上，如果你打印\
  \ `ls` 的 man 部分，大约会有七页长。在某些 UNIX 系统上，man 页的文本太多，以至于在你读完之前它就已经超出了屏幕。在这种情况下，你必须将 `man`\
  \ 的输出通过管道交给分页实用程序：\n\n```bash\n$ man ls | pg\n```\n\n在其他系统上，man 页会在每页结束时自动暂停，但你必须确定你使用的是哪种分页器，并输入正确的命令来移动和结束会话。我将在第\
  \ 6 章“列出、查找、显示或打印文件”中的“每次显示一个文件/管道”节中介绍如何执行操作。以下是无论你使用哪种分页器都能让你进行操作的基础知识：\n\n- 要跳到下一页，请按\
  \ Enter 键或空格键。\n- 要结束 man 会话，请按 `Q` 键。你可能还需要按 Enter 键。\n\n有关 `man` 命令本身的更多信息，请输入此命令：\n\
  \n```bash\n$ man man\n```\n\n### 另请\n更多关于每次显示一个文件的信息，请参阅第 160 页\n\n# 识别系统子程序的 man\
  \ 页\n等等，更多关于每次显示一个文件的信息，请参阅第 160 页\n\n# 识别系统子程序的 man 页\n\nman 页按节划分，涵盖了用户从 shell\
  \ 运行的命令、系统管理命令、文件格式、在 UNIX 下编写 C 程序时可用的系统子程序等。某些命令（例如 `kill` 命令）也是 C 语言子程序的名称。\n\
  \n### 设置 man 分页器 PAGER\n\n如果你系统上的 `man` 没有对输出进行分页，或者你不喜欢它调用的分页器，请将 `PAGER` 设置为你喜欢的分页器（例如：`PAGER=pg`），然后执行\
  \ `export PAGER`。\n\n### 系统调用\n\n```text\nSystem Calls                   kill(2)\n\
  \nNAME\n    kill - 向进程或进程组发送信号\n\nSYNOPSIS\n    #include <sys/types.h>\n    #include\
  \ <signal.h>\n\n    int kill(pid_t pid, int sig);\n\nDESCRIPTION\n    kill() 向进程或进程组发送信号。\
  \ ...\n```\n\n\n\n在本示例中，注意名称 `kill` 后面跟着括号内的 man 章节编号。同样请注意 SYNOPSIS（概要）部分中的 `#include`\
  \ 语句。`#include` 始终表示你正在查看一个 C 语言子程序，而不是你可以在 shell 提示符下输入的命令。执行 `man man` 可以查看如何指定\
  \ man 章节的搜索顺序。如果你不编写 C 语言程序，可能希望设置 `man`，使其在检查系统子程序之前先检查帮助页的命令章节。\n\n`man` 命令只会显示它遇到的第一个章节的帮助页。使用\
  \ `man` 命令的 `-a` 选项可以搜索所有章节。如果第一个帮助页是系统子程序，那么显示的第二个帮助页可能来自你感兴趣的命令章节。通常有一个 `man`\
  \ 选项可以告诉它你感兴趣哪个 man 章节，这样它将只搜索该章节。\n\n### 快速在帮助页中查找信息\n\nUNIX 初学者会一页一页地阅读帮助页，这很困难，因为每个命令都包含大量信息需要处理。通过快速扫描页面，你还可能会漏掉重要的参考。\n\
  \n中级 UNIX 用户知道如何使用斜杠 (`/`) 命令快速将光标移动到所需信息。例如，如果我正在查看 `df` 命令的帮助页，我想知道块的尺寸是基于 512\
  \ 字节块还是 1024 字节块。与其一页一页地查看，我可能会输入此命令：\n\n```bash\n/512\n```\n此命令告诉分页实用将光标移动到它找到的请求字符串（在这种情况下为\
  \ `512`）的下一个位置。要找到相同字符串的下一次出现，输入：\n\n```bash\n/\n```\n高级 UNIX 用户知道，由于帮助页可能包含格式化输出的特殊控制字符，帮助页中的斜杠命令可能找不到指定的字符串，尽管你在视觉上可以在几页之后找到该字符串。我将在第\
  \ 6 章的“清理帮助页 (`col`)” (Cleaning up Man Pages (`col`)) 节中解释这一问题及其解决方案。以下是高级 UNIX\
  \ 用户启动 `man` 命令的方式，以便斜杠命令能够正确地找到所有字符串：\n\n```bash\n$ man ls -bx pg\n```\n你可以用你喜欢的分页器替换\
  \ `pg`。有关清理帮助页的更多信息，请参见第 168 页的“另参见”（SEE ALSO）。\n\n### 如果不知道命令，如何找到所需的 man 页面\n\n\
  要使用 `man` 命令，你必须提供拼写正确的 UNIX 命令。但如果你不知道该命令该怎么办？例如，假设我想将当前一个队列中的打印作业移动到另一个打印机。我该如何查找执行此操作的命令？\n\
  \n要查找特定主题的 UNIX 命令，请使用 `man` 的 `-k` 选项。例如：\n\n```bash\n$ man -k print\n```\n`accept(1m)`\
  \ - 接受或拒绝打印请求\n`acctcom(1)` - 搜索并打印进程计数文件\n`asa(1)` - 将 FORTRAN 回车控制输出转换为可打印格式\n\
  `cancel(1)` - 取消打印请求\n`curs_printw(3x)` - 在 curses 中打印格式化输出\n`devinfo(1m)` - 打印设备信息\n\
  \n`-k` 选项告诉 man 搜索每个命令的描述，查看它是否与给定的参数（在本例中为 `print`）有关。这里显示的输出是 Solaris 的。该输出包含了超过\
  \ 100 个描述中包含单词 print 的命令。\n\n在第 15 章“搜索文件或管道”（Searching for a File or Pipeline）中，你将看到如何使用\
  \ `grep` 命令过滤掉你不想要的行并留下你需要的行。在下面的示例中，我使用 `grep` 来查找这 100 多行中是否有任何可以将打印请求从一个打印机移动到另一个打印机的命令：\n\
  \n```bash\n$ man -k print | grep lpmove\n```\n`lpmove(1m)` - 移动打印请求\n`lprm(1b)`\
  \ - 从打印队列删除打印请求\n\n啊！有一个移动打印请求的命令，叫做 `lpmove`。为了了解更多关于 `lpmove` 的信息，我现在可以执行此命令：\n\
  \n```bash\n$ man lpmove\n```\n当然，你可能不像我在示例中那样容易地找到你寻找的命令。你通常需要搜索各种相关的关键词并尝试不同的过滤词才能获得成功。例如，如果我查找的是\
  \ transfer（传输）而不是 move（移动），我就找到了我在找的命令。\n\n如果你的系统不支持 `man` 的 `-?` 选项，请尝试 `apropos`\
  \ 命令：\n\n\n\n\n# $ apropos print\n\n有时 `man-k` 或 `apropos` 命令会失败，并给出错误信息，说明在运行之前必须创建\
  \ `whatis` 数据库。通常该信息会建议运行 `catman-w` 来创建此数据库。SCO UNIX 使用了不同的命令 `makewhatis` 来创建此数据库。请参阅\
  \ `man` 帮助页获取适用于你系统的信息。创建此数据库通常需要 root 权限。\n\n## 参见\n\n* 有关 `grep` 命令的更多信息，请参见第\
  \ 380 页\n\n### 使用置换索引 (Permuted Index)\n\n置换索引是某些 UNIX 系统自带的一本书，提供了查找感兴趣主题的其他方法。为了帮助你理解置换索引，我创建了一个包含两个条目的置换索引：一个针对\
  \ `lpmove`，另一个针对 `lprm`：\n\n```\nlpmove(1m) - move print requests\nlprm(1b) - remove\
  \ print request from the print queue\nlpmove(1m)-move print requests\nlpmove(1m)-move\
  \ print requests\nlprm(1b)-remove print requests from the print queue\nlprm(1b)-remove\
  \ print requests from the print queue\nlpmove(1m)-moveprint requests\n```\n\n第 96\
  \ 页\n\n每个条目都会被置于置换索引中多次，对应该行中的每个重要单词。请注意，所有条目的中间都有一个间隔。置换索引根据紧随间隔之后的单词按字母顺序排列。每个条目都包含多次，以便其每个关键词都能紧跟在间隔之后。当你想要通过关键词查找条目时，请按字母顺序在间隔之后找到你想要的词汇。然后查看整个条目，看它是否是你感兴趣的内容。\n\
  \n## 错误\n\n要执行 UNIX 命令、实用或 shell 脚本，只需在 shell 提示符输入命令名称，包括命令所需的任何选项和参数。某些命令是内置在\
  \ shell 中的，但大多数标准命令是存储在 `/bin`、`/usr/bin/`、`/etc/`、`/usr/local/bin`、`/sbin` 等目录下的程序文件。如果你尝试运行命令，可能会得到这样的错误：\n\
  \n```\n$ myscript: not found\n$ ./myscript\n```\n\n在你开始编写自己的 shell 脚本时，看到这种 notfound（未找到）错误是很常见的。如果脚本在当前目录下，请通过\
  \ `./scriptname` 运行文件。这可能会解决问题。如果你仍然得到 `command` notfound 错误，请检查命令拼写是否正确、是否使用了正确的大小（大写、小写或混合大小写），以及命令后是否留有空格以与任何选项或参数分开。检查该命令的帮助页。如果帮助页没有说明，可能是你系统上的\
  \ UNIX 版本不支持该命令。\n\n某些 UNIX 系统提供系列分层产品（额外付费软件）。为了使用某些命令，你必须购买包含该命令的额外软件包。现在 UNIX\
  \ C 编译器已是一项额外付费的项目。因此，在你尝试运行 `cc` 命令或 `make` 命令时，会收到 `command` notfound 错误，直到你购买并安装了该软件。有时可以从网上下载免费软件替代品，以提供相同或类似的功能。许多主要\
  \ UNIX 供应商的网站都有此类免费软件的链接。\n\n## 参见\n\n* 有关编写脚本的更多信息，请参见第 25 章，第 67 页\n\n### 设置命令的路径\n\
  \n当你运行 `ls`、`cp` 和 `rm` 等命令时，你不需要担心它们是在 `/bin` 还是 `/usr/bin`。这是因为 `PATH` 变量使得运行命令变得简单。你可以使用\
  \ `echo` 命令显示 `PATH` 变量当前的内容：\n\n```\n$ echo $PATH\n/usr/bin:/usr/ucb:/etc:.\n```\n\
  \nshell 前前的美元符号 ($) 表示我们正在引用该变量的内容。`PATH` 包含一系列由冒号 (:) 分隔的目录名称。必须指定每个目录的完整路径。目录的顺序很重要，因为它决定了\
  \ shell 如何查找你输入的命令。\n\n第 98 页\n\n让我们看看当你向 shell 输入 UNIX 命令时会发生什么。\n\n\n\n\n\nShell\
  \ 首先检查命令名称是否包含斜杠 (`/`)。如果名称包含斜杠，shell 将使用该名称作为路径名并尝试执行该文件。以下是一些包含斜杠的命令示例：\n\n```bash\n\
  $ /usr/fred/bin/myscript -p acme\n$ ./yourscript file1 file2\n```\n\n如果命令名称不包含斜杠，shell\
  \ 将检查 `PATH` 中的每个目录，寻找具有正确名称的可执行文件，并尝试尝试运行找到的第一个。例如，假设 `PATH` 包含：\n\n```bash\n/bin:/usr/bin:/usr/local/bin\n\
  ```\n\n```bash\n$ ls /usr/fred\n```\n\n这个命令字是 `ls`，它不包含斜杠。因此，shell 将检查 `PATH` 中的第一个目录，在我们的示例中是\
  \ `/bin`。如果 `/bin/ls` 是可执行文件，shell 将尝试运行该程序且不再检查 `PATH` 中的任何其他目录。如果 `/bin/ls` 不存在、不是普通文件或不可执行，shell\
  \ 将移动到下一个目录，在我们的示例中是 `/usr/bin`。如果 `/usr/bin/ls` 是可执行文件，shell 将尝试运行它且不再检查 `PATH`\
  \ 中的任何其他目录。一旦 shell 尝试了 `PATH` 中的所有目录均未找到可执行文件，它将给出一个 *command not found* 错误。\n\n\
  ### 将当前目录添加到 PATH\n\n如果你的 UNIX 命令不包含斜杠，则只会检查 `PATH` 中的目录。有些人人还希望检查当前目录。这通常只在你编写自己的\
  \ shell 脚本并希望在处于脚本所在目录时方便地运行它们时才有用。\n\n要将当前目录包含在 `PATH` 变量中，请添加点目录（.）或空目录。我更倾向于添加点目录，因为这是指示当前目录的常用方法。然而，你应该能够识别\
  \ `PATH` 中的空目录，因为这涉及到安全问题（我们稍会介绍）。\n\n以下是在 Bourne shell 或 Korn shell 中使用点 (`.`)\
  \ 将当前目录添加到 `PATH` 的示例：\n\n```bash\nPATH=/bin:/usr/bin:.:/usr/local/bin\n```\n\n\
  在这里，我们设置了 `PATH`，在 `/bin` 和 `/usr/bin` 之后、`/usr/local/bin` 之前搜索当前目录。这里是更多使用点的示例：\n\
  \n```bash\nPATH=/bin:/usr/bin:/usr/local/bin:.  # 情况 1\nPATH=.:/bin:/usr/bin:/usr/local/bin\
  \   # 情况 2\nPATH=$PATH:.                         # 情况 3\n```\n\n在情况 1 中，只有当在前三个目录中未找到时，我们才会搜索当前目录。在情况\
  \ 2 中，我们在其他目录之前搜索当前目录。在情况 3 中，我们保留 `PATH` 的默认值，并将当前目录指定为最后一个搜索目录。\n\n作为简便方法，你可以使用空目录来表示当前目录。空目录就像点一样，但不要放点，只放额外的冒号\
  \ (`:`)。例如：\n\n```bash\nPATH=/bin:/usr/bin::/usr/local/bin  # 情况 1\nPATH=:/bin:/usr/bin:/usr/local/bin\
  \   # 情况 2\nPATH=/bin:/usr/bin:/usr/local/bin:     # 情况 3\nPATH=$PATH:         \
  \                 # 情况 4\n```\n\n在情况 1 中，在 `/usr/bin` 之后搜索当前目录。在情况 2 中，在其他目录之前搜索。在情况\
  \ 3 和 4 中，在 `PATH` 中的其他目录之后搜索。\n\n### PATH 的安全影响\n\n\n\n通常情况下，你不应该在 `PATH` 的开头指定当前目录。出于安全考虑，如果你要将当前目录添加到\
  \ `PATH`，请将其添加到末尾。否则，黑客可以在 `/tmp` 或其他常用目录中创建名为 `cp` 或 `ls` 等常用命令名称的文件。如果你在该目录下执行该命令，你运行的是黑客程序而不是系统程序。出于同样的原因，`PATH`\
  \ 中的任何目录都不应对用户具有写权限。\n\n### 软件包\n\n如果你向系统添加了新软件包，该软件包可能希望你将其可执行目录添加到 `PATH`。软件包的安装脚本可能会修改\
  \ `/etc/profile`。以 root 添加软件包后，重新登录并检查你的 `PATH`。确保目录顺序是合理的，特别是如果通过添加操作进行了修改。\n\n\
  ### 命令在哪里？(type, whence)\n\n有时知道你运行的命令的完整路径是有用的，特别是当它们运行不正常且你想调查原因时。`PATH` 可能包含许多目录，因此幸好有一些命令可以检查\
  \ `PATH` 并告诉你命令的完整路径。这些命令中最用的是 `type` 命令，它在 Bourne shell 和 Korn shell 中都可以工作：\n\n\
  ```bash\n$ type ls\n/usr/bin/ls\n...\nls is a tracked alias for /usr/bin/ls\n```\n\
  \n\n\n\n在这里，`type` 会接收你输入的命令并确定该命令的完整路径。\n\n如果你的系统不支持 `type` 命令，请使用 `which` 命令或\
  \ `whence` 命令来获取命令的完整路径：\n\n```bash\n$ which ls\n$ whence ls\n```\n\n通常，`which`\
  \ 命令仅在 Bourne shell 中有效。通常，`whence` 命令仅在 Korn shell 中有效。\n\n### 用户在输入 UNIX 命令时常见的错误\n\
  \nUNIX 对初学者来说可能非常令人沮丧。起初，UNIX 似乎非常挑剔，并且对你输入的每一个内容都反对意见。我在这里列出了初学者常犯的错误，以帮助你避免它们。\n\
  \n### 错误的大小写\n\n在 UNIX 下，以下文件名将指向不同的文件：\n\n* `acme`\n* `aCme`\n* `acMe`\n* `acmE`\n\
  * `ACME`\n* `acME`\n* `aCMe`\n* `AcMe`\n* `AcMe`\n* `AcmE`\n* `Acme`\n* `aCME`\n\
  * `AcME`\n* `acME`\n\n所有这些文件可能同时在同一个目录中运行，因为在 UNIX 下，字母是大写还是小写至关重要。起初，你的眼睛可能注意不到本该小写却写成大写的字母，反之亦然。要小心手写的\
  \ UNIX 命令指令，因为人们在书写时往往不注意大小写。\n\n### 错误的空格\n\n正如本章前面提到的，命令、选项和参数不能一起运行。它们必须通过空格隔开。在命令或路径中间插入空格同样是无效的。\n\
  \n### 误用方向键、Insert、Page Up 等\n\n避免使用键盘上的特殊键，例如方向键、`Insert` 键、`Home` 键、`End` 键以及\
  \ `Page Up` 和 `Page Down` 键。Linux 是良好整合这些键的 UNIX 变体。对于大多数其他类型的 UNIX 系统，使用这些特殊键会在文件、电子邮件甚至文件名中插入插入序列。一旦你插入了这些垃圾内容，想要删除它们会非常困难。\n\
  \n如果你在文本文档、电子邮件或文件名中发现这样的垃圾：\n\n```\n^A^B^C^D\n```\n这是由于用户尝试使用方向键重新定位光标来纠正拼写错误导致的。\n\
  \n要显示文件名中的控制字符，请使用 `ls-b` 选项：\n\n```bash\n$ ls acme\nacme\n$ ls -b\nacme\nabm^M\n\
  ```\n\n在这里，`ls` 似乎显示同一目录下有两个名为 `acme` 的文件，我们知道这是不可能的。通过给 `ls` 添加 `-b` 选项，我们可以看到第二个文件名中的控制字符。该文件名是由用户创建的，他想将输出重定向到\
  \ `acme` 但误输入了 `abm`。他按了两次左方向键，并在 `bm` 之上输入了 `cme`，以便命令行显示为 `acme`。用户从未意识到自己犯了错误，因为一切看起来都很正常。\n\
  \n### 使用 Backspace VS Delete 修正错误\n\n你应该如何退回并纠正输入错误？这取决于情况。退回和纠正错误的方法有两种：\n\n1.\
  \ 使用 `Backspace` 键或 `Ctrl+H`。\n2. 使用 `Delete` 键或 `Ctrl+?`。\n\n之所以变得复杂的原因是，在某些键盘上，`Delete`\
  \ 键发送的是 ASCII DEL (127) 字符。在其他键盘上，它发送的是一个 ESC 序列。`Backspace` 键会发送 `Ctrl+H` 或 ASCII\
  \ DEL。有时 `Backspace` 是可编程的，特别是当你使用 PC 登录 UNIX 时。有时 `Backspace` 会发送 `Ctrl+H`，而 `Shift+Backspace`\
  \ 会发送 DEL，反之亦然。\n\n为了消除困惑，请输入此命令：\n\n\n\n\n```bash\n$ stty -a speed 38400 baud\n\
  eucw 1:0:0:0, scrw 1:0:0:0\nintr = ^c; quit = ^\\; erase = ^?; kill = ^u;\neof =\
  \ ^d; eol = <undef>; eol2 = <undef>; swtch = <undef>;\nstart = ^q; stop = ^s; susp\
  \ = ^z; dsusp = ^y;\nrprnt = ^r; flush = ^o; werase = ^w; lnext = ^v;\n-parenb -parodd\
  \ cs8 -cstopb -hupcl creadad -clocal -loblk\n-crtscts -crtsxoff -parext\n-ignbrk\
  \ brkint ignpar -parmrk -inpck istrip -inlcr -igncr\nicrnl -iuclc\nixon -ixany -ixoff\
  \ imaxbel\nisig icanon -xcase echo echoe echok -echonl -noflsh\n-tostop echoctl\
  \ -echoprt echoke -defecho -flusho -pendin\niexten\nopost -olcuc onlcr -ocrnl -onocr\
  \ -onlret -ofill -ofdel tab3\n```\n\n### 删除字符 (Erase Character)\n\n第四行告诉你是系统是如何期望你删除字符的。你会看到\
  \ `erase` 被设置为 `^H`、`^?` 或 `DEL`。\n\n要测试删除键，请输入此命令：\n```bash\n$ datex\n```\n删除字母\
  \ `x` 并按回车键。如果你看到了系统日期和时间，说明你使用了正确的键来删除字母 `x`。尝试分别使用 `Ctrl+H`、`Delete`、`Backspace`\
  \ 和 `Shift+Backspace`，看看其中哪一个可以成功删除字母 `x`。希望你能够找到一个与当前设置兼容的删除字符。\n\n如果没有，请按照如下方式将你的删除字符更改为\
  \ `Ctrl+H`：\n```bash\n$ stty erase Ctrl+H\n```\n在这里，通过按住 `Ctrl` 键然后按 `H` 键来输入 `Ctrl+H`。不要按\
  \ `C` 再按 `R` 再按 `L` 最后按 `H`。现在你应该能够使用 `Ctrl+H` 来退格输入了。如果你希望此更改永久，可以将此 `stty` 命令添加到你的\
  \ `.profile` 中。\n\n### 使用三种引号类型\n\nUNIX 使用所有不同的引号字符：\n- `\"` 引号，我称之为双引号。\n- `'`\
  \ 撇点键，我称之为单引号。\n- `` `` 反引号，我称之为反引号（back quote）。\n\n这些引号键在 UNIX 下下各有不同的用途，因此你必须根据不同情况使用正确的键。为了在一个参数中包含空格，请使用双引号或单引号包裹该参数：\n\
  ```bash\n$ mail -s'Meeting next week' fred jane Harvey\n```\n在这里，`mail` 命令允许使用 `-s`\
  \ 选项来指定发送邮件的主题。`-s` 选项接受该选项的参数，即主题文本。单引号使 `Meeting next week` 短语成为一个完整的参数。\n\n以下是错误的做法：\n\
  ```bash\n$ mail -s Meeting next week fred jane Harvey\n```\n在这里，单单词 `Meeting` 是邮件的主题，而短语\
  \ `next week` 是接收此邮件的用户列表的一部分。稍后你会收到一封邮件，提示系统无法交付给名为 next 和 week 的用户。\n\n当你想要包含\
  \ shell 变量时，使用双引号：\n```bash\n$ mail -s \"$PROJECT\" fred jane Harvey\n```\n在这里，邮件的主题将包含两个词：shell\
  \ 变量 `$PROJECT` 的内容和单词 `proposal`。\n\n当你想要使用 shell 替换时，使用反引号。这允许你获取一个命令的输出并将其作为另一个命令中的文本：\n\
  ```bash\nlp `cat flist`\n```\n在这里，反引号内的命令将首先运行，显示文件 `flist` 的内容。该输出随后将替换原始命令中反引号内的单词。因此，`lp`\
  \ 命令将紧跟一个 `flist` 文件中包含的文件名列表。随后将执行 `lp` 命令将这些文件打印到默认系统打印机。\n\n#### 另参 (SEE ALSO)\n\
  - 有更多关于反引号和命令替换的信息，请参第 245 页\n- 有更多关于正则表达式模式的引号的信息，请参第 393 页\n\n### UNIX 在告诉我什么？\
  \ (What Is UNIX Telling Me?)\n\n某些 UNIX 消息非常晦涩。本节告诉你如何解释常见的错误指示，以便你快速轻松地纠正错误。\n\n\
  #### 用法错误 (Usage Errors)\n\n当你输入 UNIX 命令时，可能会收到的错误类型是用法错误：\n\n\n\n\n\n# cp 用\n\n\
  ```bash\ncp [-fip] source_file target_file\ncp [-r|-R][-fip] source_file... target_file\n\
  ```\n\n## 错误信息概述\n\n记住“没有消消息就是好消息”，这个错误意味着出现了一些问题，你的命令没有执行成功。在这种情况下，错误信息意味着以下所有内容：\n\
  \n- 命令没有执行，是因为你犯了错误。\n- 你误用了此命令。\n- 这里是正确的用法（语法），希望你能够重新正确输入。\n\n此用法错误是在告诉你 `cp`\
  \ 同时需要 `source_file` 和 `target_file`，但你没有在命令行中同时输入这两个参数。用法说明还显示了可能的有效选项。由于它们显示在方括号中，因此不是必需的（是可选的）。\n\
  \n## > 符号 (PS2 提示符)\n\n大于号（`>`）被称为 PS2 提示符。它出现在如下情况下：\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n## 用法意味着误用\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n我见过很多初学者忽略用法信息，并奇怪为什么不起作用。每当你看到用法信息时，请记住它是一个错误信息。你搞乱了命令，所以它没有正常运行。\n\n```bash\n\
  $ mail -s\"tomorrow jane fred\" > quit\n> exit:q!\n```\n\n当 UNIX 认为你正在输入一个多行命令时，就会出现\
  \ PS2 提示符。shell 在下一行使用这个独特的 PS2 提示符来警告你，你输入的内容是上一行开始的命令的一部分。在前面的示例中，注意到 mail 命令缺少闭合的双引号，因此命令是不完整的。PS2\
  \ 提示符出现在下一行。在这种情况下，用户没有识别出 PS2 提示符并感到困惑，因为系统停止了对其命令的响应。他无法退出到 shell 提示符或重新登录。他应该使用\
  \ `Ctrl+C` 或 Delete 键终止该命令并重新输入整个命令。\n\n某些情况下 PS2 提示符是有效的。例如：\n\n```bash\n$ lpstat\
  \ -t |\n> grep '^p104-' |\n> awk '{print $1}' |\n> while read $RR\n> do\n> cancel\
  \ $RR\n> done\n```\n\n## 管道命令\n\n如果一行以管道符号（`|`）结束，这向 shell 表示该管道命令的剩余部分将在下一行输入。如果一个管道由多个命令组成，将每个命令放在单独的一行可以提高可读性。注意\
  \ PS2 提示符出现了，确认了我们正在输入一个长多语句命令。\n\n如果你误触发了 PS2 提示符，请按 `Ctrl+C`、`Delete` 或 `Shift+Backspace`\
  \ 来终止命令并返回 shell 提示符。参见后文关于中断键（intr key）的讨论。\n\n## 换到下一行\n\n与许多命令一样，`grep` 可以在指定了要在文件中查找的模式后接受文件名列表。如果没有提供文件，`grep`\
  \ 将从标准输入读取要处理的行。这并不会将任何输出管道到 grep，因此它只是在等待键盘输入。\n\n```bash\n$ grep 'acme'\n```\n\
  \n光标停留在第二行。如果你识别出了问题，你可能会让命令运行一会儿，认为它很快就会完成。但如果没有输入，它永远不会完成。\n\n## 无法获取文件名状态 (Can't\
  \ Stat)\n\n`stat` 子程序是 UNIX 工具确定文件或目录信息的一种方式。如果命令无法 stat 文件名，就无法获取该信息。请检查确保你已正确输入了命令，并正确拼写了命令中的任何文件名或目录。还要检查预期的文件是否存在以及类型是否正确（例如目录文件与普通文件）。\n\
  \n## 当你的会话似乎挂起时该怎么办\n\n\n\n\n\n如果你正处于 `vi` 中，你可能仍然处于插入模式。在这种情况下，你输入的所有命令都会显示在屏幕上，但不会被执行。按下\
  \ `Esc` 键退出插入模式。尝试现在是否可以使用普通的 `vi` 命令来检查你的文件，然后保存并退出，或者在不保存更改的情况下退出。如果这不能解决问题，请尝试下一个建议。\n\
  \n如果你在一个分页程序（pager program）中，输入会显示在屏幕上但不会被处理。按下 `Q` 键然后按 `Enter` 键，查看是否会终止分页程序并将你带回\
  \ shell 提示符。如果这不能解决问题，请尝试下一个建议。\n\n尝试终止你正在运行的任何命令。按下 `Ctrl+C`、`Delete`、`Backspace`、`Shift+Backspace`\
  \ 和 `Ctrl+\\`，看看是否有任何一个可以将你带回 shell 提示符。如果这不能解决问题，请尝试下一个建议。\n\n你的某些终端设置可能被干扰了。输入以下内容，但不要按下\
  \ `Enter` 键：\n\n```bash\nCtrl+J stty sane\n```\n\n现在回到建议列表的开头，再次尝试这些建议。如果这不能解决问题，请尝试下一个建议。\n\
  \n如果你正在使用 Windows PC 或通过网络连接到 UNIX 的终端，可能是 UNIX 窗口没有焦点。点击窗口内部以选择它。一旦被选中，窗口的轮廓应该变得更深。在输入上述代码行后，回到建议列表的开头并再次尝试。如果这不能解决问题，请尝试下一个建议。\n\
  \n确保连接你到 UNIX 系统的电缆连接稳固。通常电缆应该紧紧拧好以避免连接问题。如果你发现电缆松动并纠正了它，请回到列表开头并再次尝试这些建议。如果这不能解决问题，请尝试下一个建议。\n\
  \n你的终端或 Windows PC 可能丢失了正确的设置。你应该记录如何设置你的终端或 Windows PC 以及如何检查设置是否正确。如果你从未这样做过，请使用相同的终端或\
  \ PC 程序检查附近的另一站，并将其设置与你的进行比较。如果你发现设置错误并进行了纠正，请回到列表开头并再次尝试这些建议。如果这不能解决问题，请尝试下一个建议。\n\
  \n某些网络或设备问题可能需要 10 分钟才会超时并将控制权交还你的工作站。如果你只卡住了几分钟，请总共等待 10 分钟，然后回到列表开头并再次尝试这些建议。如果这不能解决问题，请尝试下一个建议。\n\
  \n如果你通过终端连接，尝试关闭终端电源，数到 20，然后重新开启终端。这可能允许你再次与 UNIX 通信。警告：不要关闭 UNIX 系统本身。如果你不确定其中的区别，请不要继续。向你的系统管理员寻求帮助。\n\
  \n如果你通过 Windows PC 连接，请启动另一个到 UNIX 的连接并查看是否可以登录。如果成功，请终止无响应的窗口，并在新窗口中工作。\n\nUNIX\
  \ 系统本身可能宕机了，或者网络可能断了。询问其他用户是否也遇到了相同的问题。如果是，请向系统或网络管理员报告此情况。\n\n作为最后手段，如果你在终端而非 Windows\
  \ 工作站上，你可能需要杀死你的进程，看看新的登录提示符是否允许你通过以下程序登录：\n\n### 如何杀死进程以获取新登录\n\n1. 如果你在 Windows\
  \ 工作站上，关闭 UNIX 窗口以结束该会话。启动一个新的 UNIX 窗口开始另一个会话。\n2. 如果你处于挂挂的终端上，前往另一个终端或工作站并使用相同的\
  \ ID 登录。\n3. 输入此命令，将 `fred` 替换为你的登录 ID：\n```bash\nwho -u | grep fred\n```\n你应该看到类似这样的输出：\n\
  ```\nfred term/a Mar 15 19:12 . 9476 (10.1.1.7) fred pts/1 Mar 15 20:30 . 0302 (10.1.1.1)\n\
  ```\n4. 使用 `tty` 命令确定你当前的工作端口。例如：\n```bash\n$ tty /dev/term/a\n```\n5. 在 `who-u`\
  \ 输出中找到对应挂起会话的行。`tty` 不匹配你当前的工作会话。寻找行末尾或附近的 PID 数字。在前面的示例中，PID `9476` 是工作会话的，因此\
  \ PID `0302` 必须是挂起的会话。如果你的结果不明，请寻求帮助。不要继续。\n6. 如果你确定了挂起会话的 PID，通过输入以下两个 kill 命令来杀死该会话，将\
  \ `1032` 替换为挂起会话的 PID：\n```bash\n$ kill 1032\n$ kill -9 1032\n```\n\n\n\n\n## 7.\
  \ 转到挂起的会话并检查是否出现了新的登录提示符。如果是，请继续登录。如果没有，请向系统管理员寻求帮助。\n\n### 另请参考\n- 关于从 Windows\
  \ 访问 UNIX 的更多信息，请参阅第 589 页。\n- 关于 X 终端的更多信息，请参阅第 120 页。\n- 关于 `ps` 和进程的更多信息，请参阅第\
  \ 316 页。\n- 关于杀死进程的更多信息，请参阅第 320 页。\n\n### 预检你的 Intr 和删除键 (`stty`)\n在本章前面的部分，我们讨论了如何确定你的删除字符以及必要时如何更改它。你可以使用相似的过程测试你的字符并在必要时进行更改。输入此命令：\n\
  \n```bash\n$ date\n```\n\n不要按回车键。按下 `Ctrl+C`、`Delete`、`Backspace` 和 `Shift+Backspace`，看看这些键是否有哪个能让你回到\
  \ shell 提示符。如果是，输入 `date`（但不要按回车键）并再次尝试同一个键。如果它让你回到了 shell 提示符，那么它就是你的 `intr` 键。记录下该工作站对应的按键，因为它连接到了\
  \ UNIX。如果没有任何键或组合键有效，请按回车键进入一个新的 shell 提示符。输入此命令：\n\n```bash\n$ stty intr Ctrl+C\n\
  ```\n\n按住 `Ctrl` 键然后按 `C` 键输入 `Ctrl+C`。不要先按 `C` 然后 `R` 然后 `L` 最后按 `C`。现在你可以使用 `Ctrl+C`\
  \ 来中断并终止当前作业。如果你想让此更改永久生效，可以将 `stty` 命令添加到你的 `.profile` 中。\n\n### 将输出或错误保存到文件中\n\
  每个 UNIX 命令都可以访问三个功能：\n- 标准输入 (`stdin`)\n- 标准输出 (`stdout`)\n- 标准错误 (`stderr`)\n\n\
  通常，所有的 UNIX 命令都使用系统提供的标准输出例程来显示其结果。命令使用标准错误例程显示任何错误信息。这些标准输出和标准错误例程的编写方式使得 shell\
  \ 很容易将输出重定向到文件或管道而不是屏幕。命令使用了标准输出或标准错误例程，但它们并不知道输出实际上发送到了屏幕、文件，还是通过管道交给另一个 UNIX 命令。\n\
  \n并不是所有命令输出都进入标准输出或标准错误。某些错误信息会发送到系统控制台，因此不会通过标准错误，所以它们无法被重定向或保存到文件中。同样，某些命令输出可以直接发送到物理设备（例如用户的终端）。在这种情况下，输出无法被重定向或保存到文件中。然而，大多数命令输出都去往标准输出，大多数命令错误都指向标准错误。\n\
  \n- 关于标准输出或错误的更多信息，请参阅第 30 页。\n\n### 将命令输出保存到文件 (>)\n在 Bourne shell 或 Korn shell\
  \ 中，使用大于号 (`>`) 将标准输出重定向到文件而不是屏幕：\n\n```bash\n$ cal 1998 > thisyear\n```\n\n在这里，`cal`\
  \ 命令的输出将被存入一个名为 `thisyear` 的文件中，且不会显示在屏幕上。重定向输出到文件会在文件不存在时创建它。要将输出保存到当前目录，请使用基作为文件名。要将输出保存到不同的目录，请使用绝对或相对路径来指定文件。\n\
  \nshell 在实际执行命令之前会设置重定向。然后，shell 会从命令中移除所有重定向符号和文件，因此命令在运行时永远不会看到它们。以下操作与刚才的 `cal`\
  \ 命令等效：\n\n```bash\n$ cal > thisyear 1998\n$ > thisyear cal 1998\n```\n\n因此，在命令的任何位置指定重定向都没有区别。如果你在\
  \ Bourne shell 或 Korn shell 中，要创建一个空文件，请输入以下内容：\n\n```bash\n$ > filename\n```\n\n\
  如果此命令给你返回 `Invalidnullcommand` 错误，说明你处于 C shell 中，该命令在那里不起作用。`>` 是 `1` 的简写。它们是等价的；因此，这两个命令是等效的。\n\
  \n\n\n\n\n```bash\n$ cal 1998 > thisyear\n$ cal 1998 1> thisyear\n```\n\n标准输出是通道\
  \ 1，这解释了 `1>` 中的 `1`。\n\n在较旧的 UNIX 系统上，你必须创建一个空文件，如下所示：\n\n```bash\n$ cat /dev/null\
  \ filename # 旧方法，不再使用\n```\n\n如果你准备覆盖一个已存在的文件，shell 不给出任何警告。因此，在将输出重定向到该文件之前，你应该确保你的目标文件没有包含重要数据。\n\
  \n### 另另\n\n有关重定向的更多信息，请参阅第 30 页。\n\n### Korn Shell 中的 noclobber 选项\n\nKorn shell\
  \ 有名为 `noclobber` 的选项，它可以防止你重定向到已存在的文件：\n\n```bash\n$ date > junk # step 1\n$ date\
  \ > junk # step 2\n$ set -o noclobber # step 3\n$ date > junk # step 4\nksh: junk:\
  \ file already exists\n$ date >| junk # step 5\n$ date > junk # step 6\nksh: junk:\
  \ file already exists\n$ set +o noclobber # step 7\n$ date > junk # step 8\n```\n\
  \n在步骤 1 中，我们通过将 `date` 命令的输出重定向来创建一个名为 `junk` 的文件。在步骤 2 中，我们用新信息覆盖旧的 `junk` 文件。注意没有产生错误。在步骤\
  \ 3 中，我们在 Korn shell 中开启了 `noclobber` 选项。在步骤 4 中，我们再次尝试重定向到 `junk` 文件，但操作失败，并提示文件已存在。在步骤\
  \ 5 中，注意即使开启了 `noclobber`，我们也可以使用大于符号（`>|`）来覆盖存在的文件。在步骤 6 中，注意对于普通重定向，`noclobber`\
  \ 仍然有效。在步骤 7 中，我们使用 `+o` 取消 `noclobber`。在步骤 8 中，注意我们可以进行重定向。\n\n### 输入文件不能同时作为输出文件\n\
  \n由于 shell 在命令开始之前会初始化输出文件，你不能将同一个文件同时用 UNIX 命令或管道的源和目标。\n\n```bash\n$ grep -v discontinued\
  \ pricelist > pricelist # 不行\n```\n\n在这个示例中，我们想要删除文件 `pricelist` 中所有包含 `discontinued`\
  \ 单词的行，并将结果保存到同一个文件中。在 `grep` 命令开始之前，`pricelist` 文件被初始化为空文件用于输出。因此，它找到了一个空源并立即结束，导致目标文件为空。使用管道时也是如此：\n\
  \n```bash\n$ sort acme | grep -v discontinued > acme # 不行\n```\n\n实现此目的的方法是使用一个临时中间文件：\n\
  \n```bash\n$ sort acme | grep -v discontinued > /tmp/tmp$$ # step 1\n$ mv /tmp/tmp$$\
  \ acme # step 2\n```\n\n在这里，我们将管道或 UNIX 命令的输出保存到临时文件中，如果磁盘空间足够，通常放在 `/tmp` 中。我建议你使用以\
  \ `$` 结尾的文件。这会在文件末尾附加一个唯一数字，这样同时运行执行相同代码的其他用户就不会干扰我们。在步骤 2 中，我们获取临时文件并覆盖原始文件，完成操作。\n\
  \n## 保存到文件 (2>)\n\n你可以独立于保存输出来保存错误信息。由于标准错误是通道 `2`，因此使用 `2>` 将错误保存到文件中：\n\n```bash\n\
  $ anycommand 2> anycommand.err # case 1\n$ anycommand > log 2> errs # case 2\n$\
  \ anycommand 2> errs > log # case 3\n$ anycommand > log # case 4\n```\n\n在情况 1 中，标准输出没有被重定向，因此它显示在屏幕上，而任何错误都会进入名为\
  \ `anycommand.err` 的文件，因此不会在屏幕上显示。在情况 2 中，标准输出到一个文件，标准错误去往另一个文件。在情况 3 中，在标准输出之前重定向标准错误或反之，没有区别。在情况\
  \ 4 中，标准输出被重定向到一个文件。标准错误没有被重定向，因此任何错误将出现在屏幕上。\n\n## 将输出或错误追加到文件 (>>)\n\n使用双大于符号（`>>`）将标准输出或标准错误追加到文件中。*追加*（append）意味着保留文件中当前信息，并将新信息添加到文件末尾。如果文件不存在，此命令将创建它。\n\
  \n```bash\n$ anycommand >> outlog 2>> errlog\n```\n\n由于标准输出和标准错误是独立的，你可以根据需要只追加到其中一个文件而不是另一个：\n\
  \n```bash\n$ anycommand 2>> errlog > anycommand.out\n```\n\n\n\n\n\n# 将输出和错误保存到同一个文件\
  \ (2>&1)\n\n要将标准输出和标准错误保存到同一个文件中，请使用 `2>&1` 重定向标准错误：\n\n```bash\nanycommand > anycommand.out\
  \ 2>&1\n```\n\n你不能在 `2>&1` 内部放置任何空格，但在 `2` 之前必须有一个空格。在命令行中，`2>&1` 必须在重定向标准输出之后。`2>&1`\
  \ 表示将标准错误重定向到与标准输出相同的地方。\n\n### 将输出复制到文件和屏幕 (tee)\n\n`tee` 管道的名称源于一个流过液体的管道图像，它随后呈\
  \ T 形分形成两根管道，使得一半液体流向一个方向，另一半流向另一个方向。对于 UNIX，`tee` 实际上会将重复的信息发送到两个不同的地方：标准输出和一个文件：\n\
  \n```bash\nanycommand | tee filename\n```\n\n在这里，`anycommand` 的输出被存储在指定的 `filename`\
  \ 中。相同的信息也会发送到标准输出，由于它没有被重定向，因此将显示在你的屏幕上。\n\n```bash\nanycommand | tee file1 | grep\
  \ -v discontinued | tee file2 | pg\n```\n\n这个示例展示了在一个管道中使用两个 `tee` 管道。第一个 `tee`\
  \ 管道将 `anycommand` 的输出保存到 `file1` 中。相同的信息进入标准输出，并传递给 `grep`，后者会删除任何包含 `discontinued`\
  \ 单词的行。`grep` 的输出随后保存到 `file2` 中，并逐页显示在屏幕上。\n\n`tee` 命令的 `-a` 允许将输出追加到指定的 `filename`：\n\
  \n```bash\nanycommand | tee -a filename\n```\n\n# 第 5 章 UNIX 用户界面 (GUI)\n\n### 介绍\
  \ GUI 和 X Windows\n\nUNIX 可以运行在廉价的字符 ASCII 终端上，这些终端通常被限于 80 列 24 行文本或有限的图形字符。UNIX\
  \ 还可以利用更贵的位图显示器，显示器可以显示图片、图像和图形，并使用鼠标与用户进行交互。第二种交互方式被称为 GUI，即图形用户界面。\n\nGUI 屏幕看起来非常像\
  \ PC 上的 Windows 屏幕，带有被称为图标的小图片，代表程序和功能。与 Windows 一样，GUI 也使用鼠标使用户户通过指向图标并点击或双击来做出选择。UNIX\
  \ GUI 通常还提供滚动条、按钮、对话框和菜单。这些元素可以让 UNIX 变得易用得多，特别是对于偶尔使用 UNIX 的 Windows 用户，他们可能记得输入\
  \ UNIX shell 命令所需的命令、选项和语法。即使对于经验丰富的 UNIX 用户来说，GUI 图标和图形通常也能对正在发生的情况提供更清晰的视图。由于\
  \ GUI 允许你在屏幕的窗口中启动 shell 命令行会话，它兼顾了两种者的优点。事实上，GUI 允许多个命令行窗口同时运行，每个窗口都相互独立运行。用户可以使用鼠标与这些不同的\
  \ shell 窗口交互，甚至从一个窗口剪切并粘贴文本到另一个。\n\n### X Windows\n\n大多数 UNIX GUI 实现都基于在 MIT 开发的\
  \ X Window 系统（也称为 `X11`），并由构成 X 联盟的各个公司进一步增强。`X11` 提供了一个图形例程库，可用于创建使用图形显示元素和鼠标输入的应用程序。尽管许多\
  \ UNIX GUI 实现运行在 UNIX 系统自身的控制台上，但 `X11` 也允许图形程序运行在通过以太网连接到主机 UNIX 系统的站上。`X11` 软件也可用于连接到\
  \ UNIX 系统的 Windows PC 和 Macintosh 系统运行图形程序。\n\n## UNIX 系统的通用环境 (CDE)\n\n（提供的文本列出了\
  \ CDE 相关主题的目录）：\n- 在 UNIX 下使用图标 (GUI)\n- 作者：steve Moritsu\n- 在 UNIX 下使用鼠标 (GUI)\n\
  - 什么是 X Windows 和 Motif？\n- 包含 Solaris UNIX 和两个 GUI\n- UNIX 系统的通用环境 (CDE)\n- 如何使用\
  \ CDE\n- 从 CDE 运行 UNIX 命令\n- 从 CDE 编辑文本文件\n- CDE 文件管理器\n- 通过 CDE 邮件处理程序发送和读取邮件\n\
  \n\n\n\n\n还有被称为 X 终端（X Terminals）的低成本工作站，它们是带有图形显示器和鼠标的极简计算机站。它们拥有 CPU 和内存，但通常没有硬盘。它们通过网络连接到\
  \ UNIX 主机，并可以运行 X11 应用程序。UNIX 主机负责高层程序计算，而 X 终端负责低层图形处理。这减轻了 UNIX 主机的开销，并允许在无需完整\
  \ PC 成本的情况下运行图形应用程序。\n\n### 窗口管理器\n\n窗口管理器是一种利用 X 窗口系统在图形屏幕上的窗口中启动任务、更改窗口大小、将窗口最小化为图标、将窗口最大化为全屏等的软件。其中最常见之一是由开放软件基金会（OSF，一家公司组成的联盟）开发的\
  \ Motif 窗口管理器。\n\n### 控制台 GUI\n\n大多数 UNIX 系统都有一个被称为系统控制台（system console）的特殊工作站。通常，这是一个带有鼠标和键盘的位图显示器，非常靠近计算机系统本身。控制台是显示任何意外系统警告的地方。控制台通常在计算机首次启动或关机时与计算机交互。在大型公司中，UNIX\
  \ 计算机及其控制台通常被锁在计算机部门内部，普通用户永远见不到它们。另一方面，还有专门供主用户使用的 UNIX 工作站，该用户坐在控制台前运行 CAD（计算机辅助设计）或动画等应用程序。\n\
  \n现在的许多 UNIX 系统都提供了可以在系统控制台上运行的 GUI。在某些 UNIX 系统上，除了 GUI 控制台外，所有终端都是基于字符的，此时 GUI\
  \ 控制台是唯一可以运行图形应用程序和显示图像的工作站。如果你的系统连接到互联网，UNIX GUI 控制台可能支持 Web 浏览器以便上网。如果你的系统有如 WABI\
  \ 等应用程序，UNIX GUI 控制台可以运行 Windows 应用程序。如果你的系统网络包含运行 X11 的 X 终端或 PC，它们可能也能运行与图形 UNIX\
  \ 控制台相同的应用程序。\n\n### Solaris 桌面\n\nSolaris 是来自 SunSoft Inc.（Sun Microsystems Inc.\
  \ 的子公司）的操作系统。Solaris 的底层是 Sun 版本的 UNIX，称为 SunOS（目前为 5.6，基于 SVR4）。由于之前的 SunOS 4.x\
  \ 版本基于 BSD UNIX，因此当前的 SunOS 尽管是 System V (SVR4) 类型的 UNIX，但仍然提供许多 BSD 工具。Solaris\
  \ 还包含了 Sun 对 UNIX 的网络扩展，并包含了登录系统控制台时可以选择的两种不同的 GUI。这些在后续关于 OpenWindows 和 CDE 的章节中描述。与大多数\
  \ UNIX GUI 一样，它们提供了图形控制应用程序，用于编辑文本文件、操作文件和目录、读取/发送电子邮件以及执行系统管理。除了这些标准应用程序外，Solaris\
  \ 还提供了许多其他。实际上，Solaris 为大多数应用程序提供了两个版本：OpenWindows 版本和 CDE 版本。有关 BSD 和 SVR4 的更多信息，请参阅第\
  \ 19 页。\n\n### Solaris GUI: OpenWindows\n\n旧版本的 Solaris 提供了一个名为 OpenWindows 的 GUI，基于\
  \ Open Look Manager。图 5.1 显示了该 GUI 在一个屏幕上打开两个窗口示例：\n\n1. 一个 UNIX 命令行窗口（称为 `cmdtool`）\n\
  2. 文件管理器窗口\n\n![8227-0123a.gif](img/7b05f7fad269af1e56393d7e915798b.gif) 图 5.1 Solaris\
  \ 旧版 GUI：OpenWindows。\n\n注意每个窗口的左上角都有一个三角形。如果你单击该三角形，将看到以下选项。（双击没有效果）。括号 () 中的文字是选项含义的描述\n\
  \n- 关闭（Close）\n- 最小化（Minimize，最小化为图标）\n- 全屏（Full Size，还原）\n- 切换（Toggle）\n- 移动（Move，允许移动整个窗口）\n\
  - 调整大小（Resize，允许更改窗口大小）\n- 后置（Back，将窗口移至其他窗口后面）\n- 刷新（Refresh）\n- 退出（Quit，终止并关闭此窗口）\n\
  \n\n\n\n如果你将光标移动到背景的空白区域并点击右键，将看到这些选项：\n\n### 程序\n- **属性**：（设置配色方案。）\n- **工作站信息\
  \ . . .**：（系统名称和 IP 地址、内存、版本。）\n- **帮助 . . .**\n- **退出 . . .**：（注销。）\n\n### 工具\n\
  如果你选择“工具”，将看到这些选项：\n- **刷新**\n- **重置**\n- **功能键**\n- **窗口控制**\n- **保存工作区**：（登录时自定义。）\n\
  - **锁定屏幕**：（输入密码解锁。）\n- **挂起**\n- **控制台**：（启动命令会话以接收系统错误。）\n\n如果你选择“程序”而不是“工具”，你将看到这些选项：\n\
  - **文件管理器**：（创建目录、复制文件、重命名、删除、磁盘。）\n- **电源管理器**：（设置空闲时自动关机。）\n- **文本编辑器**：（使用鼠标编辑文件。）\n\
  - **邮件工具**：（发送/接收邮件。）\n- **日历管理器**：（安排预约、会议。）\n- **命令工具**：（历史记录、命令与文件之间的剪切/粘贴。）\n\
  - **Shell 工具**：（简单的 tty 命令行。）\n- **时钟**\n- **计算器**\n- **性能计数器**：（监控 CPU 使用率、磁盘等。）\n\
  - **打印**：（管理打印队列。）\n- **音频工具**：（录制/播放声音。）\n- **磁带工具**：（保存/恢复/列出磁带文件。）\n- **图像工具**：（查看/保存\
  \ GIF, JPEG, PostScript, TIFF, . . .）\n- **截图**：（保存 GUI 屏幕图像。）\n\n\n\n\n# GUI 组件\n\
  \n- **图标编辑器 (Icon Editor)**：（创建您自己的图标。）\n- **绑定器 (Binder)**：（将文件类型与图标、应用程序等连接。）\n\
  - **AnswerBook2**：（在线文档。）\n- **演示 (Demos)**：（如何运行各种应用程序。）\n\n## OpenWindows 文本编辑器\n\
  \nOpenWindows 文本编辑器提供了一个独特的分屏选项，允许您在同一个文件的两个部分之间进行编辑或剪切粘贴。请注意，本章稍后描述的名为 `CDE` 的其他\
  \ Solaris GUI 自带的文本编辑器并不具备此功能。然而，大多数 OpenWindows 程序都可以从 `CDE` 应用程序器的 OpenWindows\
  \ 部分运行。相反，OpenWindows 无法运行较新的 `CDE` 应用程序。\n\nOpenWindows 有一项功能，可以防止您指定的窗口在在使用后立即消失。在某些\
  \ OpenWindows 菜单或窗口中，左上角会出现一个小图钉图标。如果您点击图钉，它将固定您的窗口或菜单，使其在您做出选择后不会消失。您稍后可以从该窗口或菜单进行其他选择。如果您不再需要从该窗口或菜单进行任何选择，请点击图钉取消固定并允许其关闭。\n\
  \n这种较旧的 OpenWindows GUI 仍然适用于当前的 Solaris 系统，供那些不想切换到后续章节讨论的名为 `CDE` 的新 GUI 用户使用。\n\
  \n## Common 桌面环境 (CDE)\n\nSolaris 包含一个名为通用桌面环境 (`CDE`) 的第二个 GUI，它基于 `X Window System`\
  \ 和 `Motif Window Manager`。惠尔特-帕洛洛德、IBM 和 Sun 共同贡献了 `CDE` 的开发，因此这种相同的 GUI 现在出现在它们的\
  \ UNIX 版本中：`HP-UX`、`AIX` 和 `Solaris`。\n\nSCO UNIX 采用了 `CDE` 标准。在它最新的发行版本 `UnixWare\
  \ 7` 中，SCO UNIX 将 CDE GUI 作为默认设置。学习了这个 GUI 后，你将会发现在许多 UNIX 平台上找到它。\n\n在 `CDE` 登录屏幕上，有一个标记为\
  \ `Options` 的按钮。可用选项之一是“安全会话 (`Failsafe Session`)”，这在您错误配置了显卡或屏幕分辨率时非常有用。登录 Solaris\
  \ GUI 时，您可以在较旧的 OpenWindows 和较新的 `CDE` 之间进行选择。在 SCO `UnixWare 7` 上，您可以在较新的 `CDE`\
  \ GUI 和旧版 SCO 系统上的 `Panorama GUI` 之间进行选择。\n\n### 图 5.2：Solaris 2.x 上 CDE 的主面板\n\n\
  图 5.2 显示了 Solaris 2.x 上 `CDE` 的主面板。以下是标记数字的说明：\n\n1. 点击此栏操作 `CDE` 主面板：移动（其位置）、最小化（将主面板最小为图标）、置底（将主面板置于任何重叠窗口下方）、刷新、注销。\n\
  2. 显示当前时间。\n3. 显示当前的和日期。\n4. 点击此三角形查看“文件夹 (Folders)”：`Home`（访问主目录）、`Floppy`（访问磁盘）、`CD-ROM`（访问\
  \ CD-ROM）。\n5. 点击此三角形查看“个人应用程序 (Personal Applications)”：`Text Editor`（文本编辑器）、`Terminal`（UNIX\
  \ 命令行）、`Web browser`（网络浏览器）。\n6. `邮件应用程序 (Mailer application)`（发送/接收电子邮件）。\n7. `锁定此工作站\
  \ (Lock this station)`（提示 UNIX 解锁）。\n8. 四个独立的桌面区域可以打开窗口。\n9. `EXIT`（注销 UNIX）。\n\
  10. 闪烁的 LED 表示 GUI 正在忙。\n11. 点击此三角形查看“打印机 (Printers)”选项。\n12. `样式管理器 (Style Manager)`（配置颜色、字体、背景、键盘、鼠标、蜂鸣声、屏幕、窗口、启动）。\n\
  13. 点击此三角形查看“应用程序 (Applications)”选项。\n14. 点击此三角形查看“帮助 (Help)”选项（在线文档）。\n15. `垃圾桶\
  \ (Trash Can)` 图标（将项目拖到此图标处即可删除）。双击此图标可查看可用文件：`Put Back`（还原）、`Shred`（永久删除）。\n16.\
  \ 点击此处最小化主面板。\n\n\n\n\n\n## 图 5.2 CDE 的主面板。\n\n在图 5.2 中，数字 4、5、11、13 和 14 指向三角形。当你点击三角形时，会打开一组选项。当选项打开时，三角形会翻转并指向下方，提醒你如果再次点击三角形，选项将会消失。每个三角形下方是该区域选项中的一个图标。它是一个快速启动图标，因为你可以点击该图标并直接从主面板启动它，而无需点击三角形并打开所有选项。\n\
  \n要更改主面板中三角形下方的快速启动图标，请遵循以下步骤：\n\n1. 点击三角形以打开选项。\n2. 将光标置于所需的图标上。\n3. 右键点击一次。\n\
  4. 选择“复制到主面板”（`Copy to Main Panel`）。\n5. 点击三角形以关闭选项。现在，你所需的图标应该已经出现在主面板中了。\n\n在图\
  \ 5.3 中，我们已经点击了“个人应用程序”（Personal Applications）三角形来打开那些选择。以下是图中标记数字的说明：\n\n17. 点击此栏可获得这些选项：移动（Move，将此菜单保留在桌面上以便访问）、降低（Lower，将此菜单置于任何重叠窗口之下）、关闭（Close，关闭此菜单）。\n\
