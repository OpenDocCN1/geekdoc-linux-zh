  \ Editor，点击此处进入图形文本编辑器）。\n20. 终端（Terminal，点击此处进入命令行窗口）。\n21. 网页浏览器（Web Browser，点击此处启动\
  \ Java 浏览器）。\n22. 菜单按钮（Menu button，点击此向下三角形可关闭菜单。三角形将指向向上，表示它可以用于打开菜单）。\n23. 主面板快速访问图标（Main\
  \ Panel quick access icon，这允许快速访问菜单中的一个项目。在示例中，它目前被设置为终端应用程序，但可以像之前描述那样轻松更改）。\n\n\
  图 5.3 个人应用程序。使用 Motif 窗口。\n\n在图 5.4 中，我们使用 CDE 主面板启动了一个应用程序。使用 Motif 窗口管理器的 CDE\
  \ 以及我们启动的每个应用程序都将在各自的 Motif 窗口中运行。图 5.4 显示了所有 Motif 窗口应用程序可用的窗口控件。\n\n为什么不能使用垃圾箱？如果你在\
  \ CDE 中删除文件，可以从垃圾箱中恢复文件。然而，你无法从命令行这样做。使用 `rm` 命令时要小心，因为没有撤销删除的操作。\n\n24. 点击此菜单按钮可获得这些选项：移动（Move，移动此窗口）、大小（Size，调整窗口大小）、最小化（Minimize，将窗口缩小为图标）、最大化（Maximize，将窗口放大为全屏，从此菜单恢复以撤销此操作）、降低（Lower，将此窗口置于任何重叠窗口之下）、关闭（Close，终止应用程序并关闭窗口）。切换菜单栏（Toggle\
  \ Menu Bar，移除或恢复下方项目 29）。双击此菜单按钮作为调用关闭的快捷方法。\n25. 标题栏（Title bar），在此点击并拖动可移动整个窗口\n\
  26. 此窗口中运行的应用程序名称\n27. 最小化按钮（Minimize button，将窗口缩小为图标\n28. 最大化按钮（Maximize button，将窗口放大为全屏）（再次点击此处可撤销此操作）。\n\
  29. 菜单栏（Menu bar，选项取决于应用程序）\n30. 滚动条（Scrollbars）将根据需要出现在右侧或底部。\n\n图 5.4 窗口控件。\n\n\
  \n\n\n如果你启动了多个应用程序，每个程序都将有自己的窗口。在向该应用程序输入文本之前，你必须先点击窗口内的任何位置来选择该窗口。这被称为激活该窗口或赋予该窗口焦点。活动窗口的边框颜色会变得更深。选择一个窗口将自动取消选择其他窗口。当窗口未被选中时，其边框将变为中性灰色。\n\
  \n在 `CDE Style Manager` 的 `Window` 部分中，你可以选择以下项之一：\n\n- `点击窗口内位置以激活`(Point in Window\
  \ to Make Active)\n- `点击窗口以激活（默认）`(Click in Window to Make Active)\n\n选择 `Point\
  \ in Window to Make Active` 允许你只需将鼠标移动到该窗口即可选择它。我个人不喜欢这个设置，因为当我需要在屏幕的一端移动到另一端时，所有的窗口都会跳动，但不同的用户可以对此选项有不同的设置。\n\
  \n你可以通过之前列出的菜单按钮更改窗口大小（调整尺寸），或者通过将光标置在窗口的一个角上并拖动来放大或缩小窗口。\n\n你可以通过之前列出的菜单按钮重新定位窗口在屏幕上的位置（即移动它），或者通过将光标置于标题栏内并拖动窗口到其新位置。\n\
  \n如果一个窗口在另一个窗口后面，你可以通过之前列出的菜单按钮将上方窗口降低（即将其放在另一个窗口后面）。或者，你可以点击下层窗口的任何可见部分，使其全部在前景中显示。\n\
  \n### 在窗口之间传输文本\n\nMotif 允许你轻松地在两个窗口之间传输文本。窗口可能运行不同的应用程序；例如，你可以将文本从电子邮件传输到文本编辑器，或者将文本从帮助文档传输到\
  \ `UNIX` shell 命令中。传输文本有一种简单的方法，以及一种方法允许相同文本被记住并多次输入的长期方法。\n\n#### 如何单次传输\n\n1.\
  \ 将光标移动到目标文本处选中所需的文本，按住鼠标左键并将光标拖动到文本末尾。然后释放左键。\n2. 将鼠标光标移动到你想放置文本的地方，无论是在同一个窗口还是不同的窗口。如果该窗口正在运行\
  \ `UNIX vi` 命令，请使用 `vi` 命令定位 `vi` 光标，如果你还没有在该窗口中执行操作，则输入 `insert` 或 `append` 命令。\n\
  3. 点击鼠标中键或右键以插入文本。\n\n#### 如何保存文本并粘贴一次或多次\n\n1. 将光标移动到目标文本处选中所需的文本，按住鼠标左键并将光标拖动到文本末尾。然后释放左键。如果你有一只三键鼠标，现在可以通过移动鼠标指针并点击中键来粘贴选中的文本。如果你有一只双键鼠标，则必须执行以下步骤。\n\
  2. 在菜单栏中，点击 `Edit` 然后点击 `Copy` 以保存选中的文本。或者，如果 `Edit` 也显示 `Cut` 命令，你可以使用它保存文本并将其从当前应用程序中移除。\n\
  3. 将鼠标光标移动到你想放置文本的地方，无论是在同一个窗口还是不同的窗口。点击一次设置文本光标。如果该窗口正在运行 `UNIX vi` 命令，请使用 `vi`\
  \ 命令定位 `vi` 光标，如果你还没有在该窗口中执行操作，则输入 `insert` 或 `append` 命令。\n4. 在菜单栏中，点击 `Edit` 然后点击\
  \ `Paste` 在光标处插入保存的文本。如果你处于 `vi` 中，现在手动按 `Esc` 键退出 `Insert` 模式。\n\n### CDE 支持什么？\n\
  \nCDE 可用于 `HP-UX`、`AIX`、`Solaris` 等。这些版本中的通常都支持基础 CDE 应用程序，例如：\n\n- `File Manager`（创建、复制、删除文件和目录）\n\
  - `Text Editor`（编辑文本文件）\n- `Terminal`（运行 shell 命令）\n- `Mailer`（发送和读取电子邮件）\n- `Print\
  \ Manager`（查看 `UNIX` 打印队列）\n- `Help`（查看此系统的在线文档）\n\n某些系统（如 `Solaris`）增加了许多可以从 CDE\
  \ 调用的其他应用程序，这些在其他系统中是找不到的。在 Solaris 下，你可以通过将光标移动到屏幕的空白部分、点击右键然后点击 `Programs` 来访问这些额外应用程序。Solaris\
  \ 2.6 程序：\n\n\n\n\n# CDE 应用概述\n\n- **文件管理器**:（创建、拷贝、移动、删除文件和目录）\n- **文本编辑器**:（用于编辑\
  \ UNIX 文本文件）\n- **邮件服务器**:（发送和读取电子邮件）\n- **日历**:（安排预约、会议）\n- **网络浏览器**:（HotJava）\n\
  - **终端**:（运行 UNIX shell 命令）\n- **控制台**:（类似于终端，但接收系统控制台错误）\n- **时钟**:（可以放置在桌面上的图形时钟）\n\
  - **计算器**:（科学和财务图形化计算器）\n- **性能仪表**:（图形化显示随时间变化的系统占用）\n- **打印管理器**:（查看 UNIX 打印队列）\n\
  - **音频**:（录制和播放音频文件）\n- **查看器**:（查看/保存 GIF, JPEG, PostScript, TIFF 等）\n- **截图**:（保存\
  \ GUI 屏幕图像）\n- **图标编辑器**:（创建自己的图标）\n- **样式管理器**:（自定义 CDE 的外观）\n- **应用管理器**:（访问更多程序）\n\
  - **桌面应用**:（程序以及 CDE 程序开发工具 App Builder）\n- **桌面控制**:（样式管理器和无障碍访问）\n- **桌面工具**:（格式化软盘、压缩文件等实用程序）\n\
  \n## 信息\n\n- **信息**:（Readme 文件和 Answerbook2）\n- **OpenWindows**:（来自旧版 OpenWindows\
