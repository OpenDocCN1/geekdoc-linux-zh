  \ 46290 USA\n\n第 1 页\n\n# 引言\n\n欢迎使用 UNIX。UNIX 系统因其卓越的可靠性而深受。它们通常运行数月或多年而不出现任何系统问题或崩溃。在任何计算机配置中，UNIX\
  \ 系统通常都能提供最佳的性能、最高的吞吐量以及最大的并发用户支持。UNIX 提供了无与伦比的扩展性，允许计算机系统既可以作为单用户工作站，也可以作为支持数百并发用户访问公共数据库的服务器。UNIX\
  \ 提供了丰富的实用程序、网络和编程工具，以及适用于几乎每个业务和行业的定制应用程序。UNIX 通过为您提供快捷方式来提高生产力，并回报您投入的时间和精力，并通过揭示其秘密，让您能够深入内部发现并修复错误，并根据您的喜好定制系统。随着新\
  \ CPU 芯片的开发，UNIX 卓越的可移植性将允许您在迁移到更新、更快的机器时，保留您的软件投资。\n\nUNIX 命令具有如 `ls`、`mv`、`awk`、`grep`\
  \ 和 `sed` 等名称，通过这些命令，UNIX 专家可以用几行代码完成其他情况下可能需要数小时工作或通过特殊编程才能实现的任务。事实上，微软刚刚发布了 Windows\
  \ NT 的 UNIX 服务附加包，其中其他功能允许允许 25 多个 UNIX 命令和 Korn shell 在 Windows NT 下运行。\n\n第 2\
  \ 页\n\n另一方面，也有人喜欢 UNIX 但认为它晦涩、简洁且不友好。UNIX 假设你清楚自己在做什么，如果你输入了无意义的命令，它通常不会发出任何警告。初学者经常会在此卡壳并不得不寻求帮助。每个命令都像一个独立的王国，有它们自己的语言、习俗和传说。\n\
  \n# 本书简介\n\n如果您是 UNIX 初学者，这本书将帮助您避开大多数初学者都会会掉入的陷阱。它将帮助您理解底层概念和命令，使它们变得易懂并让您记忆得更好。本书不需要\
  \ MS-DOS 背景，但如果您熟悉 MS-DOS，您会发现某些内容是相似的。\n\n如果您已经使用 UNIX 多年，现在准备好提高精通程度，这本书将为您提供帮助。它基于我在南加利州教授\
  \ UNIX 的多年经验。特别是第 9 章以及第 15 章和第 16 章，阐述了复杂的主题，我将这些主题组织成了层层递进的内容。\n\n如果您是 Linux 用户，本系列中有一本名为\
  \ *Using Linux* 的书，您可以在那里找到比本书更关于 Linux 使用和设置的特定信息。然而，由于任何书中都有大量内容涵盖了安装以及设置用户、磁盘、打印机、调制解调器、网络、`tcp/ip`、Web\
  \ 服务器、DNS 等，您可能会发现 Linux 下提供的标准 UNIX 概念和命令覆盖范围没有本书如此详尽。\n\n第 3 页\n\n\n\n\n\n多位作者为本书编写了章节，以帮助我们赶上出版截止日期，我非常感谢他们的帮助。作为主作者，我很乐意听取读者对本书的意见或问题。我的电子邮件地址是\
  \ `mori@dtrbus.com`。\n\n我计划为本书列出一份更错修订列表，希望它能足够优秀并达到出版第二版的标准。我正在与出版商讨论制作一本配合此本书的练习题和答案练习册。如果读者们愿意购买此类练习册，请告诉我。\n\
  \n我工作的公司 DTR Business Systems 为我担任本书的主作者提供了职能支持。DTR 在全国范围内支持一个 UNIX 增值转销商网络。遗憾的是，我无法通过电子邮件提供免费的\
  \ UNIX 支持，但我确定，如果您需要商业级 UNIX 产品或服务，我们可以为您推荐相关资源。\n\n# 本书内容\n\n## 第一部分：什么是 UNIX？\n\
  \n### 第 1 章：UNIX 和 Shell 导论\n讨论了什么是 UNIX、它的历史以及为什么会有这么多不同的版本。本章通过最近发布的 64 位 `SVR5`\
  \ 将历史更新到了最新状态。它涵盖了您在书中其余部分需要的某些基础但基本的 UNIX 概念。\n\n### 第 2 章：UNIX 目录与路径名\n展示了如何访问\
  \ UNIX 目录和文件。本章涵盖了绝对路径与相对路径，这在构建 UNIX 文件命令至关重要。\n\n### 第 3 章：显示系统信息\n展示了您在登录新系统时可以运行的命令，提供有关您的登录和工作站、其他用户、系统及其文件系统和进程的信息。\n\
  \n### 第 4 章：输入 UNIX 命令的规则\n解释了命令语法，让您知道哪些空格是必须的，哪些是非法的。它描述了 `man` 命令，该命令允许您查询命令用法和选项。展示了命令行中常见的错误以及如何解释常见的\
  \ UNIX 响应。它描述了当工作站卡住时该怎么办。告诉您如何将命令的输出或错误保存到文件中。\n\n### 第 5 章：UNIX 用户界面 (GUI)\n描述了\
  \ `X Window` 系统，该系统允许您使用鼠标和图形图标。它以 `Solaris` 为例。它涵盖了在许多类型的 UNIX 系统中常见的桌面环境（CDE），包括作为文本编辑器、文件管理器和电子邮件处理程序的图形化应用程序。\n\
  \n## 第二部分：与 UNIX 文件操作\n\n### 第 6 章：列出、查找、显示或打印文件\n涵盖了使用 `ls` 列出文件、使用 `find` 查找文件、使用\
  \ `cat`、`pg`、`less`、`nl`、`od`、`strings`、`banner` 和 `col` 显示文件。还涵盖了打印文件、检查队列、移动打印作业以及使用\
  \ `pr` 格式化输出。\n\n### 第 7 章：复制、移动、重命名或删除文件\n涵盖了如何通过简单示例执行不同目录执行这些操作。还涵盖了创建硬链接和软链接。\n\
  \n### 第 8 章：修改、合并和分割文件\n涵盖了如何排序文件；如何仅文件的开头或结尾；以及对文件进行加密、压缩和编码为可打印文本格式。涵盖了如何使用 `sort`、`paste`\
  \ 和 `join` 合并文件。涵盖了如何使用 `split` 和 `csplit` 分割文件。\n\n### 第 9 章：生成和使用文件列表\n涵盖了如何使用文件名生成通配符，为可以操作多个文件的\
  \ UNIX 命令生成所需的文件列表。它还描述了如何使用反引号和 `xargs` 处理文件列表，特别是当匹配的文件过多导致通配符无法处理时。\n\n### 第\
  \ 10 章：按日期、大小或内容比较文件\n展示了如何使用 `ls` 命令按照最后访问、最后修改或文件大小列出文件。展示了如何使用 `find` 列出在给定时间范围内修改或访问的或特定大小的文件。展示了如何以及何时使用\
  \ `diff`、`sdiff`、`diff3`、`comm`、`cmp` 和 `sum` 比较文件内容。\n\n## 第三部分：用户与系统管理\n\n###\
  \ 第 11 章：文件权限与系统安全\n讨论和密码安全，以及如何在 UNIX 下设置用户和组以共享某些文件和目录，同时限制其他内容。涵盖了文件和目录权限以及数字和符号模式下的\
  \ `chmod` 命令。涵盖了 `umask` 如何影响分配给新文件和目录的权限。讨论了 `SUID` 和 `SGID` 位的安全影响。\n\n### 第 12\
  \ 章：启动、关闭和作业管理\n涵盖了如何启动和关闭 UNIX 系统。讨论了用户和系统管理员如何在系统启动、登录以及预定义时间或周期性间隔自动作业。涵盖了作业优先级以及如何设置和更改优先级。讨论了作业控制以及如何暂停、恢复和杀死后台作业。\n\
  \n### 第 13 章：使用 tar 和 cpio 保存和恢复文件\n涵盖了 UNIX 设备名称，特别是磁带和磁盘。涵盖了如何使用 `tar` 备份目录或选定文件、列出备份内容以及恢复文件的策略和注意事项。然后针对\
  \ `cpio` 涵盖了相同的内容。\n\n\n\n\n\n# 第 14 章，管理系统资源\n涵盖了文件系统和磁盘配额。\n\n## 第四部分：UNIX 文本处理\n\
  \n### 第 15 章，在文件或管道中搜索行\n描述了如何使用 `grep` 显示包含模式的行。它涵盖了正则表达式，这是一个极其重要但困难的话题，并将其分解为系列分层的课程。它涵盖了\
  \ `egrep` 中的扩展正则表达式。它涵盖了从命令行使用 `perl` 和 `awk` 来提供搜索模式的额外功能。\n\n### 第 16 章，在文件或管道中替换或删除文本\n\
  描述了如何使用 `sed` 利用正则表达式的力量来修改行。它涵盖了从命令行使用 `perl` 和 `awk` 为替换和删除文本提供额外功能。它还涵盖了使用 `cut`、`tr`\
  \ 和 `uniq` 修改或删除行或字符。\n\n### 第 17 章，使用 vi 编辑文本文件\n展示了学习所有基础编辑所需的前 10 条 `vi` 命令。它涵盖了接下来要学习的八条命令。它列出了各种用于插入文本和移动光标的\
  \ `vi` 命令，引入了分离单词与包含单词及非单词的概念。它列出了用于删除和更改文本的 `vi` 命令。\n\n### 第 18 章，让 vi 编辑器为你工作\n\
  展示了 `vi` 在快速处理任何重复性编辑任务中的威力。它并没有学习独立的 `vi` 内置命令，而是展示了如何调用 `sed` 和 `awk` 进行搜索和替换操作，使用\
  \ `sort` 进行排序，使用 `grep -v` 选择性地删除行、加密部分、插入横幅、打印部分以及统计部分内的行数。它展示了如何 `cut`、粘贴以及设置所需的\
  \ `vi` 选项。\n\n### 第 19 章，Korn Shell 中的命令行编辑\n展示了如何召回之前的命令、修改并执行它们。这一章的简易性掩盖了它的实用性，因为它让\
  \ UNIX 专家能够分阶段地构建出优雅的命令行结构。\n\n### 第 20 章，介绍 emacs 编辑器\n描述了另一个具有强大功能和灵活性的 UNIX 编辑器。许多用户倾向于这种\
  \ `vi` 的替代方案。\n\n## 第五部分：与其他用户和系统通信\n\n### 第 21 章，通过调制解调器访问其他系统\n描述了如何使用 `write`\
  \ 和 `talk` 与另一个用户进行在线对话。它涵盖了如何向另一个用户发送电子邮件以及读取任何邮件。它提到了 `wall` 向所有用户广播。\n\n### 第\
  \ 22 章，在网络或互联网上访问其他系统\n涵盖了 TCP/IP 基础、如何使用 `telnet` 和 `rlogin` 登录网络中的另一个系统、如何使用 `ftp`\
  \ 和 `rc` 传输文件，以及如何使用 `rsh`（某些 UNIX 系统上称为 `cmd`）执行命令。\n\n### 第 23 章，从 Windows 访问\
  \ UNIX\n展示了如何在 Windows 上设置 TCP/IP，如何使用 Windows `ftp` 在 UNIX 和之间之间传输文件，如何使用 Windows\
  \ `telnet` 登录 UNIX，如何将你的 Windows 连接到互联网，然后在那里使用 `telnet` 和 `ftp` 连接到互联网上的任何 UNIX\
  \ 服务器。它还涵盖了如何在 Windows 上使用调制解调器，以及如何使用 `Netscape` 读取邮件和发送回复。\n\n### 第 24 章，UNIX\
  \ 与互联网\n展示了如何从 UNIX 浏览互联网；如何使用 Web 浏览器下载软件；如何下载并使用 `Lynx`（一种在 UNIX 终端上用于互联网浏览的字符界面浏览器）；如何使用\
  \ `make` 编译软件；如何在互联网上访问 UNIX 供应商并获取帮助（例如，UNIX 需要的 2000 年补丁）；如何访问安全公告；以及如何在 UNIX\
  \ 上阅读网络新闻。\n\n## 第六部分：Shell 编程\n\n### 第 25 章，编写 Bourne Shell 脚本\n涵盖了使用 Bourne Shell\
  \ 脚本语言编写程序。它描述了 shell 变量、提示符、用户输入、命令行参数、`if` 测试、检查命令结果、计算、特殊变量、用法错误、循环处理命令行参数、调试、循环处理一组文件，以及\
  \ `case` 语句。\n\n### 第 26 章，编写 awk 脚本\n涵盖了使用 `awk` 语言进行编程，该语言与 C 语言语法相似。它包含了变量、字符串、操作符、内置函数、数组、数组函数、`if`\
  \ 语句、循环、获取输入的 `getline`、用于格式化输出的 `printf`、自定义函数以及执行 UNIX 命令的 `system` 命令。\n\n###\
  \ 第 27 章，编写 Perl 程序\n涵盖了使用 `perl` 进行编程，它通常用于 UNIX 和 Windows 上查找和显示网站信息。本章涵盖了内置变量、`if`\
  \ 语句、循环、函数、数组、文件访问、哈希数组、字符串和调试。它没有涵盖 CGI 编程，但本章中的所有元素在 CGI 编程中都是用。\n\n## 第一部分 什么是\
  \ UNIX？\n\n### 1 UNIX 和 Shell 简介\n### 2 UNIX 目录与路径名\n### 3 显示系统信息\n### 4 输入 UNIX\
  \ 命令的规则\n## 5 UNIX 图形用户界面 (GUI)\n\n\n\n\n\n# 第 1 章 UNIX 与 Shell 简介\n作者 Steve Mor\
  \ Moritsugu\n\n## 基础硬件与软件术语\n\n### 什么是 UNIX\n### UNIX 的历史\n### 不同类型的 UNIX\n### UNIX\
  \ 对比 Windows\n### UNIX 的结构\n## UNIX Shell\n### 标准输入、输出和错误\n## 管道与过滤器\n### UNIX 之道\n\
  \n## UNIX 是一种操作系统\n为了解释 UNIX 是什么，我将首先介绍一些关于计算机硬件、软件，以及应用程序与操作系统的非常基础术语。如果你已经了解了这些内容，请随时跳过接下来两个关于计算机硬件和软件概述的章节。\n\
  \n### 计算机硬件概览\n计算机硬件是指你可以触碰的物理元件。例如，大多数计算机都有一个用于打字的键盘，以及一个用于查看输出的显示器或屏幕。安置计算机的箱子（其机箱）将包含更多硬件，例如一个或多个硬盘驱动器，这些设备允许你存储数据。你可能听过容量高达\
  \ 500 兆字节（MB）或吉字节（GB）的驱动器。`Mega` 代表百万，`giga` 代表十亿。`Byte`（字节）是计算机单位，相当于文档中的一个字符。因此，一个\
  \ `500MB` 的磁盘可以存储 500 份各包含一百万字符的文档。一个 `2GB` 的磁盘容量是 `500MB` 磁盘的四倍。另一个硬件组件是内存或 `RAM`。内存容量通常是\
  \ 2 的幂，例如 `32MB` 或 `256MB`。某些非常强大且昂贵的计算机拥有 GB 内存。内存是计算机的工作空间，因此更大的内存允许计算机更好地运行。`CPU`（中央处理器）是一个至关重要的硬件元件。它是计算机的大脑，允许它遵循一组程序指令进行计算，并处理存储在内存或硬盘驱动器中的信息。你可能听过英特尔处理器，例如奔腾芯片，但也存在其他与英特尔完全不同的\
  \ `CPU` 类型，例如 RISC 处理器（精简指令集计算机），如 PowerPC。某些计算机拥有多个 `CPUs` 以提高性能。\n\n计算机还可以包含其他系统组件，例如一个或多个磁带驱动器、软磁盘驱动器或\
  \ CD-ROM 驱动器。这些组件也可以称为外围设备和辅助设备，但这些术语通常留给连接设备，如终端、打印机和调制解调器。\n\n### 计算机软件概览\n计算机的一组指令被称为程序。程序存储在硬盘上，从\
  \ `RAM` 运行，控制 `CPUs` 并使用外围设备。为了将这种编程与计算机的硬件部分区分来，被称为软件。计算机软件可以分为以下几类：\n\n- **应用程序**：应用程序是设计为为用户提供特定功能的程序。例如，文字处理程序允许用户输入、修改文档并将其打印出来。应用程序涵盖了业务的几乎每个方面，如会计、工资单、库存、销售点管理和预约调度。应用程序也存在用于科学或财务计算、个人及家庭使用以及游戏。使用应用程序的人被称为终端用户。\n\
  - **语言**：计算机语言是让被称为“程序员”的人能够创建计算机程序的软件程序。诸如 `BASIC`、`FORTRAN` 和 `COBOL` 等计算机语言已经存在多年，且仍在使用。新计算机语言的开发是为了为程序员编写程序提供更好的工具。例如，`Visual\
  \ BASIC` 提供了图形工具，用于编写在 Windows 下运行的程序。`Java` 为运行在万维网上的应用程序提供了图形工具。`C` 语言是一种古老、多用途且高效的语言，如今仍然非常受欢迎，此外还有\
  \ `C++`，`C++` 是 `C` 的修订版本，支持更新的面向对象编程方法，使得编写复杂程序变得更容易。\n- **操作系统**\n- **实用程序**\n\
  \n\n\n\n\n# 操作系统\n\n操作系统是整个计算机的核心控制程序，负责控制正在运行的任务。它还将将硬盘组织成文件，文件是磁盘块的集合，用于存储我们想要保留在一起的信息。操作系统允许为每个文件赋予一个名称，称为文件名，以便人类能够告诉计算机访问哪些磁盘块。文件可以被组入目录，而目录又可以分组成更大、更具包容性的目录。\n\
  \n操作系统使用户户能够运行应用程序并执行系统功能，如创建目录和复制文件。操作系统负责调度和运行计算机上的所有任务。它允许用户登录并使用系统。它控制所有系统资源，如内存、磁盘文件、磁带驱动器、CD-ROM\
  \ 驱动器、调制解调器、打印机、终端和网络连接。UNIX、MS-DOS、Windows 95、Windows NT 和 Apple Macintosh 都是今天常用的不同操作系统的示例。UNIX\
  \ 是一个操作系统而不是应用程序，因此不要期望在 Windows 系统上找到它作为一个程序。\n\n许多用户对可用应用程序的了解远比对可用操作系统及其功能的了解深入。当你首次启动系统时，在运行任何应用程序之前，必须启动操作系统。这个启动操作系统的过程被称为“唤起系统”（bringing\
  \ up the system）；也称为“启动”（booting up）。在启动过程中，操作系统会初始化所有设备，这意味着它向它们发送任何所需的指令，以便它们准备好使用。系统启动后，操作系统对大部分或所有系统硬件具有完全控制权——尤其是磁盘驱动器。当应用程序想要访问或在磁盘驱动器上创建文件时，它们并不这样做。相反，它们请求操作系统代它们完成。多个应用程序可以同时访问不同的文件。操作系统跟踪哪些程序在使用哪些文件。如果多个程序同时请求访问磁盘，操作系统将决定优先处理哪个请求。操作系统还会确定用户是否有权限访问某个文件，如果没有权限则阻止访问。\n\
  \n## 工具程序\n\n工具程序（Utilities）是较小的、独立的程序，通常范围较窄，提供单一能力或单一功能领域，例如备份工具。工具程序可能与操作系统或应用程序强耦合，意味着它们是必不可少、不可替代的一部分。工具程序也可能是松耦合的，例如该工具是可选的、需要额外付费的、共享软件或免费软件、必须从互联网下载，或者由与提供操作系统或应用程序的不同的公司销售。\n\
  \n## UNIX 的历史\n\n20 世纪 60 年代后期，开发了一种使用计算机的新方法，称为分时系统。在分时系统中，计算机可以通过给每个任务分配有限的时间来同时运行任务。分时系统使用户能够能够直接与计算机交互。计算机可以立即向他们显示程序中的任何错误，他们修正错误并重新运行任务而无需长时间等待。贝尔实验室联合电气（GE）和麻理工学院（MIT）开发了一个名为\
  \ Multics 的分时系统。然而，在 1969 年被取消了，因为 Multics 太复杂且太困难。汤森（Thompson）、里奇（Ritchie）和其他贝尔实验室的人继续开发他们自己的分时系统。\n\
  \n当时开发了许多其他计算机操作系统。更快、更强大的计算机正在开发中。在那个时代，每台新计算机都有自己独特的操作系统。每当计算机制造商开发一台新计算机时，它也必须提供一个运行在该计算机上的操作系统。它还会提供运行在该操作系统上的新工具程序和应用程序。这些被称为“专有系统”（proprietary\
  \ systems），因为计算机制造商拥有在该计算机上运行的唯一操作系统。用户被锁定在该供应商处，由其为该机器提供基础且必要的软件。\n\nUNIX 故事中的一个关键事实是，当时\
  \ AT&T 由于法律限制无法扩展到计算机业务。因此，AT&T 没有开发和销售自己的计算机系统。他们从其他公司购买计算机。因为他们在越来越多的多的计算机上使用\
  \ UNIX，他们想找到一种方法，将其轻松移动到他们可能购买的不同计算机上运行。\n\n\n\n\n大多数操作系统，包括早期的 `UNIX`，都是用汇语言编写的。汇语言被称为低级计算机语言，因为每条指令都是计算机硬件的基本操作。低级语言通过寄存器和内存访问工作，而这些构成了计算机的基础操作。因此，汇语言程序员可以编写出非常紧凑且高效的循环——这对于反复使用的操作系统代码至关重要。诸如\
  \ `BASIC`、`FORTRAN` 和 `COBOL` 等高级语言则与机器级相去甚。它们提供的编程工具和概念使得编写程序变得容易得多，但产生的代码没有汇语言代码那样高效。\n\
  \n汤普（Thompson）和其他人意识到，随着新计算机的出现，能够将 `UNIX` 移植到这些计算机上运行是极其重要的。他们还意识到，如果继续用汇语言编写 `UNIX`，那么将整个系统移植到新计算机将花费过多的精力。汤普开发了一种名为\
  \ `B` 的语言，里奇（Ritchie）对其进行了改进并将其命名为 `C`。到 1973 年，他们已经用这种新的、级 `C` 编程语言重写了几乎所有的 `UNIX`，而这种语言在编写操作系统代码时仍然非常高效。他们现在可以在几种不同类型的计算机上提供相同的操作系统。他们继续为\
  \ `UNIX` 添加新功能，撰写关于 `UNIX` 内部的论文，并将其提供给对设计概念以及能够在许多计算机上运行这一事实感兴趣的大学。大学和其他计算机公司开始使用并扩展\
  \ `UNIX` 以满足自身需求，提供了 `UNIX` 的新特性和变体。\n\n我第一次在 20 世纪 80 年代中期遇到 `UNIX`。我是一个操作系统小组的成员，为\
  \ `Point 4` 微型计算机编写并支持一种专有操作系统。在当时，我们的整个专有操作系统和所有用户数据都可以放入一个 20MB 的磁盘驱动器中。它只需要 128KB\
  \ 的内存即可运行。`UNIX` 对当时的专有系统并不构成威胁，因为 `UNIX` 需要更多的磁盘空间、内存和 CPU 功率；因此，它的性价比不高。所有计算机制造商都提供自己的高度优化的专有操作系统，这些系统可以在最小磁盘和最小内存下运行。这些专有时分系统仍然将计算机用户锁定在某一家公司的计算机产品中。这导致了高价格，因为这家公司必须承担所有的程序开发；因此几乎没有竞争。\n\
  \n到 1990 年，计算机格局发生了巨大的变化。`UNIX` 赢得了与专有系统的战斗。内存和磁盘的硬件成本下降了很多，使得 `UNIX` 需要的额外内存和磁盘不再是一个主要的考虑因素。`UNIX`\
  \ 的大卖点在于它是一个开放系统，这意味着用户不再被锁定在专有系统中。由于 `UNIX` 是用高级语言编写的，它可以轻松地移植到其他类型的计算机上，在旧计算机上运行的所有应用程序也可以轻松地移植到新计算机上。开放\
  \ `UNIX` 系统的价格比专有系统有竞争力得多。同时，由于贝尔实验室（Bell Laboratories）、伯克利（Berkeley）等大学以及太阳微系统公司（Sun\
  \ Microsystems）等公司的共同努力，`UNIX` 拥有一极其丰富的工具和功能。随着 `UNIX` 势头增长，编写新软件应用程序的公司选择为 `UNIX`\
  \ 平台编写程序，以便他们的软件可以在各种硬件上运行，这再次加速了专有系统的终结。尽管某些计算机供应商仍提供或支持专有操作系统，但他们通常也提供一种替代的 `UNIX`\
  \ 产品线。\n\n### UNIX 如何构建互联网\n\n互联网（`Internet`）起源于国防部（`DARPA`）的一个项目，旨在连接政府、军事和大学计算机。随着网络主机系统数量的增加，他们需要一种有效的方法将信息以包的形式从一个系统通过网络中的其他系统发送到目的地。随着网络的增长，他们需要动态路由来绕过糟糕的连接。开发的数据包路由协议被称为\
  \ `TCP/IP`，最早在加利福尼亚大学伯克利分校的 `UNIX` 中实现。`UNIX` 和 `TCP/IP` 成为互联网的骨干，将成千上万乃至数百万计算机连接在一起。`UNIX`\
  \ 和互联网上的其他服务器通过万维网（`World Wide Web`）提供了大量的数据、研究、新闻、时事和人文类内容。通过这种方式，数百万在使用 `UNIX`\
  \ 系统的人甚至根本不知道它的存在。\n\n### 有哪些类型的 UNIX 系统？\n\n当计算机供应商将 `UNIX` 移植到自己的机器上时，他们通常会给它一个独特的名称。下节提供了销售\
  \ `UNIX` 系统的计算机公司部分列表（无顺序）。此列表显示了供应商是否给 `UNIX` 起起了特殊名称，以及他们是否给所售的系统起起了特殊名称。\n\n\
  #### 表 1.1 部分销售 UNIX 的公司\n\n| 计算机公司 | UNIX 操作系统 |\n| :--- | :--- |\n| AT&T | `UNIX\
  \ SVR3` |\n| AT&T | `UNIX SVR4` |\n| 太阳微系统/SunSoft | `SunOS`（作为 `Solaris` 的组件） |\n\
  | 太阳微系统/SunSoft | `Interactive UNIX` |\n| 惠普公司 (HP) | `HP-UX` |\n| Data General\
  \ (DG) | `DG-UX` |\n| Novell | `UnixWare`（早期版本） |\n| Santa Cruz Operation (SCO)\
  \ | `UnixWare` |\n| Santa Cruz Operation (SCO) | `OpenServer` |\n| Santa Cruz Operation\
  \ (SCO) | `XENIX` |\n| 微软 | `XENIX`（早期版本） |\n| IBM | `AIX` |\n| 硅图形 (SGI) | `IRIX`\
  \ |\n| 数字设备公司 (DEC) | `ULTRIX` |\n| 数字设备公司 (DEC) | `Digital UNIX` |\n\n\n\n\n# NCR\
  \ | NCR UNIX\n\n| NCR | NCR UNIX |\n| :--- | :--- |\n| 西门子数字信 (SNI) | Reliant UNIX\
  \ |\n| Caldera | Caldera OpenLinux |\n| RedHat Software | RedHat Linux |\n| 非商业来源\
