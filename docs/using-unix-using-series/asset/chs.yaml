  \ |\n| `/var/spool` | 各种打印缓冲目录。 |\n\n绝对路径名是一种引用文件的方法，其中指定了从根目录开始的所有目录。绝对路径始终以斜杠开头，表示它从根目录开始（例如，`/reports/abc`\
  \ 指向 `reports` 子目录下的 `abc` 文件）。\n\n目录的行政控制：对目录具有写权限的用户对该目录拥有有效的行政控制。除了创建文件外，他们还可以删除和重命名其他用户的文件，即使他们没有修改这些文件的权限。如果设置了目录粘滞位（sticky\
  \ bit），拥有写权限也不会赋予对目录的行政控制权。\n\nANSI 美国国家标准协会。\n\n\n\n\n\n## API (应用程序接口)\n计算机操作系统、应用程序或第三方工具所规定的特定方法，程序员在编写应用程序时可以通过该方法向操作系统提出请求。也称为应用程序设计员接口（Application\
  \ Programmers Interface）。\n\n## 应用程序数据文件\n通常是多个文件中的一个，包含该应用程序的数据。\n\n## 应用程序\n一种软件程序，通常是许多程序之一，为应用程序提供部分编程功能。\n\
  \n## 应用程序\n一个或多个提供特定功能的软件程序，例如会计应用程序。\n\n## Arguments\n参见 *parameters*。\n\n## ARPA\n\
  参见 *DARPA*。\n\n## ASCII\n美国信息交换标准代码。用于在大多数计算机的内存中表示字符。\n\n## AT&T UNIX\n在 AT&T 贝尔实验室开发的\
  \ UNIX 原始版本，后来被称为 UNIX 系统实验室。许多当前的 UNIX 版本都是其后代；即使是 BSD UNIX 也是源自早期的 AT&T UNIX。\n\
  \n## awk\n由 A.V. Aho、P.J. Weinberger 和 Brian W. Kernighan 开发的编程语言。该语言构建在 `C` 之，包含了\
  \ `grep` 的正则表达式搜索，并添加了 `C` 语言中缺失的高级字符串和数组处理。`nawk`、`gawk` 是该语言的版本。\n\n## 后台作业\n\
  你启动但独立于你的键盘和屏幕运行的任务，以便你可以做其他事情。许多重要的 UNIX 进程作为后台作业运行，等待用户请求或其他事件（这些通常被称为系统守护进程）。参见\
  \ *Foreground job*。\n\n## 备份\n将 UNIX 系统、应用程序和数据文件存存储在可移动介质上以备将来取用的过程。\n\n## Basename\n\
  路径中不包含斜杠 `/` 的最长右侧部分（例如，在 `/usr/fred/reports/acme` 中，`acme` 是该路径的 basename）。basename\
  \ 可以是任何类型的文件，包括目录。此外，书中使用的 `basename` 也可以指代没有斜杠且没有目录部分的文件。\n\n## Bash\n代表 GNU Bourne\
  \ Again Shell（GNU 再次 Bourne 壳），包含了大多数 Bourne shell (`sh`) 和 Korn shell (`ksh`) 的增强功能。\n\
  \n## Boot 或 boot up（启动）\n启动操作系统（UNIX）的过程。\n\n## Bourne shell\n所有 UNIX 系统上的标准 shell，支持基础编程但很少提供用户便利性。\n\
  \n## BSD UNIX\n由伯克利软件发行版（Berkeley Software Distribution）开发并在加州大学伯克利分校编写的 UNIX 版本。\n\
  \n## Berkeley Software Distribution（伯克利软件发行版）\n\n## C\n由 Brian W. Kernighan 和 Dennis\
  \ M. Ritchie 开发的编程语言。`C` 语言具有高度移植性，适用于包括主机、PC 以及的 UNIX 系统在内的许多平台。\n\n## CAD\n计算机辅助设计。\n\
  \n## Cast（类型转换）\n用于强制类型转换的编程结构。\n\n## CD-ROM\n紧凑光学只读存储。存储在与音乐 CD 相同物理形式上的计算机可读数据。容量大、价格廉、速度比硬盘慢，且仅限于读取。存在某些版本是可写入的（`CD-R`，可录光型），以及其他可以写入一次或多次的格式。\n\
  \n## C shell\n由 Bill Joy 在伯克利编写的 UNIX 用户界面。它具有类似于 `C` 语言编程的语法。\n\n\n\n\n\n# 术语表\n\
  \n- **CGI**: 通用网关接口。在 Web 页面与服务器上执行的程序或脚本之间传输数据的方法。这些程序可以处理数据，并通过动态创建 HTML 将结果返回给用户的浏览器。\n\
  \n- **字符设备 (Character)**: 用于与字符型 I/O 设备（如终端、打印机或网络通信线路）通信的设备文件。所有 I/O 访问都被视为一系列字节（字符）。\n\
  \n- **字母字符 (Characters, alphabetic)**: 字母 `A` 到 `Z` 以及 `a` 到 `z`。\n\n- **字母数字字符\
  \ (Characters, alphanumeric)**: 字母 `A` 到 `Z`、`a` 到 `z`，以及数字 `0` 到 `9`。\n\n- **控制字符\
  \ (Characters, control)**: 任何不可打印字符。这些字符用于控制设备、分隔记录以及在打印机上出页。\n\n- **数字字符 (Characters,\
  \ digits)**: 数字 `0` 到 `9`。\n\n- **数值字符 (Characters, numeric)**: 数字 `0` 到 `9`。\n\n\
  - **校验和 (Checksum)**: 通过累加文件内所有字符产生的数值。该总和允许你快速检查文件是否与另一个文件匹配。通过比较校验和，你可以快速检查两个文件可能包含相同的内容，或者一个文件的内容是否仍与其计算校验和时的内容相同。通常在添加每个字符后，会对总和进行移位或旋转（类似于乘以\
  \ 2）。这被称为旋转校验和，它可以检测数据相同但顺序不同的文件。校验和的目标是：两个文件之间的微小差异应产生校验和之间的巨大差异。如果两个文件的校验和相同，那么它们极可能包含相同的内容。如果它们的校验和不同，则这两个文件一定不相同。\n\
  \n- **子目录 (Child directory)**: 与子目录相同。\n\n- **子进程 (Child process)**: 由另一个进程或任务启动的进程或任务，被称为父进程。\n\
  \n- **子进程 (Child process)**: 见 `subprocess`。\n\n- **子 Shell (Child shell)**: 见 `subprocess`。\n\
  \n- **类 (Class)**: 具有属性（数据）和行为（代码或函数）的对象模型。它也被视为抽象形式的对象的集合。\n\n- **命令替换 (Command\
  \ substitution)**: Shell 的一种功能，允许使用包含另一个 UNIX 命令的反引号（`` ``）将该命令的输出替换为当前命令中的单词。\n\
  \n- **命令行编辑 (Command-line editing)**: UNIX Shell 支持调回之前输入的命令、对其进行修改，然后执行新版本。命令历史可以在会话之间保留（你昨天执行的命令在今天登录时可以使用）。某些\
  \ Shell 支持命令行编辑模式，该模式使用 `vi` 或 `emacs` 编辑器的子集进行命令的调回和修改。\n\n- **命令行历史 (Command-line\
  \ history)**: 见 `Command-line editing`。\n\n- **命令行参数 (Command-line parameters)**:\
  \ 用于指定传递给执行程序或过程的参数。也称为命令行参数。\n\n- **注释 (Comment)**: 为人类读者准备的解释性文字。通常注释有特殊的起始字符，以便计算机会忽略它们。在\
  \ UNIX Shell 编程中，使用井号（#）来开始注释。其他编程语言可以使用其他起始字符作为注释。\n\n- **配置文件 (Configuration files)**:\
  \ 用于初始化和设置特定命令及程序环境的信息集合。Shell 配置文件用于设置用户环境。\n\n- **包含单词 (Contained words)**: 在\
  \ `vi` 中，包含单词是任何字母和数字的组合。它们通过标点符号、空格、制表符和行尾与其他单词隔开。例如，`abc-def=3` 包含三个单词：`abc`、`def`\
  \ 和 `3`。见 *分隔单词* (Separated words) 和 *非单词* (Non-words)。\n\n\n\n\n\n### CPU\nCPU\
  \ 中央处理单元。计算机的大脑，即计算引擎和逻辑控制器。\n\n### 当前目录\n作为任何相对路径基准的目录。如果没有没有指定目录，许多 UNIX 命令将假定此目录。使用\
  \ `cd` 命令更改你的当前目录。\n\n### 守护进程 (Daemon)\n一种与系统相关的后台进程，通常以 root 权限运行并处理来自其他进程的服务请求。\n\
  \n### DARPA（美国国防部）\n国防高级研究计划局。资助了 TCP/IP 和 ARPAnet（互联网的前身）的发展。\n\n### 数据库服务器\n参见\
  \ *Server, database*。\n\n### 默认目录\n与当前目录相同。\n\n### 设备文件\n用于实现物理设备访问的文件。这为 UNIX 下访问存储介质提供了一种统一的方法；数据文件和设备（如磁带和通信设施）都被实现为文件。对于程序员来说，它们之间没有本质区别。\n\
  \n### 设备节点\n用于访问磁带驱动器或软磁盘等硬件的一种文件。\n\n### 数字 (Digit)\n0 到 9 之间的字符之一。数字始终是一个单个字符。一个或多个数字组成一个数字。\n\
  \n### 目录\n组织和收集文件的一种手段。目录本身是一个文件，由其包含的文件列表组成。根目录 `/` 是最顶层，所有其他目录都包含在其中（直接或间接地）。目录可能包含其他目录，这些称为子目录。\n\
  \n### 目录导航\n在目录之间移动的过程被称为导航。你的当前目录被称为工作目录。你的登录目录被称为默认目录或主目录。使用 `cd` 命令，你可以在目录树结构中上下移动。\n\
  \n### Dirname\n路径名中从开始到最后一个内部斜杠 `/` 的部分。例如，在 `/usr/fred/reports/acme` 中，`/usr/fred/reports`\
  \ 就是 `dirname`。如果路径名中没有斜杠 `/`，则其 `dirname` 由点 `.` 表示，代表当前目录。参见 *Basename*。\n\n###\
  \ DNS\n域名服务器。用于在互联网上的机器名称（`name.domain.com`）与数字型 IP 地址（`123.45.111.123`）之间进行转换。\n\
  \n### DOS\n磁盘操作系统。基于使用磁盘存储命令的操作系统。它也是个人计算机上 MS-DOS 和 PC-DOS 的通用名称。MS-DOS 是微软销售的版本，PC-DOS\
  \ 是 销售的版本。两者都基于微软的代码。\n\n### Page\n8\n\n### Double\n双精度浮点数。\n\n### dpi\n每英寸点数。\n\
  \n### 电子邮件\n通过电子介质而非本地邮政发送的消息。有许多设计用于处理局域网（LAN）环境中邮件的专用系统；其中大多数也可以通过互联网发送。大多数互联网（开放）电子邮件系统使用\
  \ MIME 来处理附件数据（可以是二进制的）。\n\n### EBCDIC\n扩展二进制编码进制交换码。用于大型机计算机内存中表示字符的编码。\n\n###\
  \ Ed\n一种用于行文本编辑的常用工具。\n\n### Elm\n交互式邮件程序。\n\n### emacs\n一种免费提供的编辑器，现在是 GNU 软件发行的一部分。最初由\
  \ Richard M. Stallman 在 20 世纪 70 年代末在麻省理工学院编写，适用于许多平台。它具有极强的扩展性并有自己的编程语言；该名称代表使用宏进行编辑（editing\
  \ with macros）。\n\n\n\n\n\n# F\n\n### 封装 (Encapsulation)\n将数据（属性）和函数（以代码形式的行为）组合成对象的过程。数据和函数在对象内部紧密耦合。这并不是所有程序员都能按照自己的方式访问结构中的数据，而是必须使用与该数据关联的代码。这促进了代码复用和处理数据的标准化方法。\n\
  \n### 环境变量 (Environment variables)\n参见 `Variables, environmental`。\n\n### 转义字符 (Escaped\
  \ characters)\n前面带有反斜杠（`\\`）的字符。通常我们转义一个字符是为了消除它的特殊含义，但有时我们转义普通字符是为了赋予其特殊含义。\n\n\
  ### 以太网 (Ethernet)\n一种网络方法，系统连接到单一共享总线，且所有流量对每台机器都可见。数据包包含接收者的标识符，只有该机器应该处理该数据包。\n\
  \n### 表达式 (Expression)\n常量、变量或操作数与运算符的组合。用于设置值、执行计算或设置比较模式（正则表达式）。\n\n### FIFO\n\
  先进先出。参见 `Pipe, named`。\n\n### 文件压缩 (File compression)\n对数据应用数学公式的过程，通常会导致数据占用空间更小的形式。压缩文件可以解压，恢复原始文件。\n\
  \n### 索引文件 (File, indexed)\n基于文件结构的文件，可以根据特定的键（名称、员工编号等）或按顺序检索数据。键存储在索引中。`UNIX`\
  \ 操作系统不直接支持此；通常由程序员实现或使用来自 ISV 的工具。一种典型形式被称为 `ISAM`。\n\n### 行顺序文件 (File, line sequential)\n\
  参见 `File, text`。\n\n### 顺序访问文件 (File, sequential)\n这个短语可以指只能按顺序访问（而非随机访问）的文件，也可以指没有记录分隔符的文件（通常是固定长度，但\
  \ `UNIX` 不知道长度是多少，也不关心）。\n\n### 文件字节 (File bytes)\n存储在设备（通常是磁盘或磁带）上的字节集合。可以是源代码、可执行二进制文件或数据。\n\
  \n### 文本文件 (File, text)\n带有记录分隔符的文件。可以是固定长度或可变长度；`UNIX` 工具可以处理这些文件，因为这些工具可以判断记录何时结束（通过分隔符）。\n\
  \n### 文件名 (Filename)\n用于标识数据集合（文件）的名称。如果没有 `pathname`，则假设它在当前目录下。\n\n### 文件名生成 (Filename\
  \ Generation)\n通配符命令行中模式词可以使用的特殊字符。Shell 将模式词替换为匹配该模式的现有文件列表。不要将这些通配符与正则表达式通配符混淆。\n\
  \n### 全限定文件名 (Filename, fully qualified)\n用于标识数据集合（文件）及其位置的名称。它包含文件的路径和名称；通常，`pathname`\
  \ 是完全指定的（绝对路径）。参见 `Pathname` 和 `Pathname, absolute`。\n\n### 文件系统 (Filesystem)\n\
  构建在磁盘驱动器部分或磁盘结构（如 `RAID`）中的分级目录系统。非根文件系统在访问之前必须挂载到目录上（有时在根目录下）。对挂载点目录的所有访问都是在访问文件系统所在的磁盘扇区。这与\
  \ `DOS` 将磁盘分区指定为 `D:` 或 `E:.` 的惯例不同。文件系统通常无法增长，因此你系统上的某些目录可能已满，而其他目录仍有未使用的磁盘块。文件系统存储在磁盘分区中，有时被称为磁盘分区。参见\
  \ `Mount` 和 `Mount point`。\n\n### 指令 (Finger)\n用户信息查询程序。\n\n\n\n\n\n# 防火墙\n一种用于从外部（通常是互联网）为内部网络提供受控入口的系统。这用于防止外部或未经授权的系统访问你内部网络上的系统。该功能取决于具体的软件包，但典型特性包括过滤数据包和过滤数据报文、系统（名称或\
  \ IP 地址）别名，以及拒绝来自某些 IP 地址的数据包。在理论上，它提供了防止来自外部恶意程序或人员的保护。它还可以防止内部系统访问外部互联网。该名称源于连接建筑之间或单个建筑内部的物理屏障，这种屏障旨在防止火从一个地方蔓到另一个地方。\n\
  \n## Flags\n参见*选项*（Options）。\n\n## Float\n单精度浮点数。\n\n## 前台作业\n一个正在运行并占用你的键盘和屏幕的任务。参见*后台作业*（Background\
  \ job）。\n\n## FSF\n自由软件基金会。\n\n## FTP\n文件传输协议或文件传输程序。一种在通过 `TCP/IP` 连接的系统之间传输文件的平台无关方法。确保即使在传输过程中发生错误，文件也能正确传输。通常可以处理字符集转换（`ASCII`/`EBCDIC`）和记录终止符解析（`UNIX`\
  \ 的换行符，MS/PC-DOS 的回车符加换行符）。\n\n## 全路径\n与绝对路径相同。\n\n## 网关\n一种硬件、软件和网络连接的组合，提供一种架构与另一种架构之间的链接。通常，网关用于连接\
  \ `LAN` 或 `UNIX` 服务器与大型主机（使用 `SNA` 进行网络，因此被称为 `SNA 网关`）。网关也可以是内部和外部网络之间的连接（通常称为防火墙）。参见*防火墙*（Firewall）。\n\
  \n## GID\n组 ID 号。\n\n## 通配符（Globbing）\n参见*文件名生成*（Filename generation）。\n\n## GNU\n\
  GNU 代表 Not UNIX，是 `UNIX` 环境中常见的自由软件包的名称，这些软件包由 MIT 的 GNU 项目分发，很大程度上归功 Richard Stallman\
  \ 的努力。这个递归缩写（GNU 包含该缩写作为其中一个单词）是对 Richard Stallman 的玩笑。一本关于操作系统设计的教科书书名为：`GNU`：`GNU`\
  \ 不是 `UNIX`，且 `GNU` 遵循那条路径。\n\n## GPL\n通用公共许可证。\n\n## grep\n一种在文件中搜索模式的常用工具。`egrep`\
  \ 允许使用扩展（因此有 `e` 前缀）正则表达式；`fgrep` 使用有限表达式（因此有 `f` 前缀）进行搜索。\n\n## GUI\n图形化用户界面。\n\
  \n## 在此文档（Here document）\n`<<` 重定向运算符，被称为在此文档，允许将程序的键盘输入（`stdin`）包含在脚本中。\n\n## 隐藏文件\n\
  文件名以点（`.`）开头的的文件或目录。某些工具默认不会处理隐藏文件（例如 `ls` 和文件名生成通配符）。隐藏文件通常是系统文件和配置文件，在处理数据文件时不应包含它们。\n\
  \n## HTML\n超文本标记语言。用于描述万维网网页。它是用于通过标签定义在互联网上可用的页面的文档语言。浏览器解释 HTML 以显示所需的信息。\n\n\
  ## I-node\n用于描述文件及其存储。目录包含 i-node 与路径/文件名之间的交叉引用。也称为 `inode`。磁盘数据结构中的文件条目（通过 `ls\
  \ -i` 查看）。\n\n## ICMP\n网络控制消息协议。`TCP/IP` 的一部分，提供网络层管理和控制。\n\n\n\n\n\n# 继承\n一种面向对象的软件复用方法，通过使用现有的属性和行为并在此基础上扩展，基于现有类开发新类。如果基对象是汽车（具有引擎、四个轮子和轮胎等属性；以及加速、转向、减速等行为），那么跑车就会修改这些属性：引擎可能比默认的更大或马力更高，四个轮子可能包括合金轮毂和高速轮胎；行为也会被修改：更快的加速、更小的转弯半径、更快的减速。\n\
  \n# 初始化级别\n与运行级别（run level）相同。\n\n# inode 节点号\n给定文件在 inode 表中的条目编号。参见 `Inode`。每个文件系统都有自己的\
  \ inode 表，因此如果两个不同的文件位于同一系统的不同文件系统中，它们可能会有相同的 inode 节点。参见 `Filesystem`。\n\n# inode\
  \ 表\n参见 `Inode`。\n\n# inode\n一种表条目，存储了关于文件的所有信息，但文件名和实际文件数据除外。inode 包含文件所有者、组、权限、最后访问/修改的日期/时间等字段。每个\
  \ UNIX 文件系统都包含一个 inode 表，用于跟踪磁盘上该区域的所有文件。参见 `Filesystem`。内存中也有一个 inode 表，用于跟踪所有当前正在引用的文件。\n\
  \n# Int\n整数。\n\n# 互联网服务提供商\n专门连接您到互联网的公司。\n\n# 互联网\n不同网络的集合，提供了在它们之间移动数据的能力。它构建在\
  \ `TCP/IP` 协议之上。最初由 DARPA 开发，后由 NSF 接管，现已脱政府控制。\n\n# IRC 继聊天\n基于服务器的应用程序，允许组人员通过文本对话进行同时通信。IRC\
  \ 类似于民用频段无线或某些公告板上的聊天室。某些聊天可以是私密的（仅限受邀请人员）或公开的（任何人都可以加入）。IRC 现在支持音频和文本；对于文件交换也有用。\n\
  \n# ISAM\n索引访问方法。在 UNIX 和其他系统中，ISAM 指一种以键或顺序方式访问数据的方法。UNIX 操作系统不直接支持 ISAM 文件；它们通常是附加产品。\n\
  \n# ISO\n国际标准组织。\n\n# ISP\n参见 `Internet service provider`。\n\n# ISV\n独立软件供应商。对除您的硬件供应商之外的软件供应商的通用称呼。\n\
  \n# K&R\nKernighan 和 Ritchie。\n\n# 内核\n操作系统的核心，处理内存分配、设备输入输出、进程分配和用户访问等任务。与其它操作系统相比，UNIX\
  \ 的内核通常较小。\n\n# 键\n这些是触发某些功能而不是显示字符的键。文件结束键（EOF）告诉 UNIX 不再有输入；它通常是 `Ctrl+D` 键。\n\
  \n# Korn shell\n一种具有广泛脚本（编程）支持的 UNIX 用户界面。由 David G. Korn 编写。该 shell 具有命令行编辑功能，并能接受为\
  \ Bourne shell 编写的脚本。\n\n# L LAN\n局域网（Local area network）。网络硬件、软件、台式计算机、服务器和主机直接连接的集合。一个局域网可以是整个大学校园。\n\
  \n# 限制\n参见 `Quota`（配额）。\n\n# LISP\n列表处理语言。\n\n# 登录\n用户获取 UNIX 系统访问权限的过程。这也可以指在登录提示符处输入的用户\
  \ ID。\n\n\n\n\n\n- `lp`: 行式打印机。\n- `lpc`: 行式打印机控制程序。\n- `lpd`: 行式打印机守护进程。\n- `lpq`:\
  \ 打印机打印队列检查程序。\n- `lprm`: 打印机打印队列作业删除程序。\n- `ls`: 列出目录命令。\n\n## M\n\n- **Magic number（魔数数）**:\
  \ 嵌入在某些文件中的数字，允许系统通过查阅魔数表来确定该文件内容的类型。\n- **Man page（手册页）**: `man` 命令的输出，显示来自 UNIX\
  \ 在线手册的页面，告知你如何使用大多数 UNIX 命令以及该命令提供的可用选项。\n- **Memory, real（物理内存）**: 系统内部正在使用的存储空间（硅基器件；过去是磁铁芯存储器）。\n\
  - **Metacharacter（元字符）**: 对 shell 具有特殊含义的字符。它会被 shell 或命令转换为其他内容。\n- **Filename\
  \ Wildcard（文件名通配符）**: 例如，`*` 会被 shell 转换为当前目录下所有文件的列表。\n- **MIME Multipurpose Internet\
  \ Mail Extensions（多用途互联网邮件扩展）**: 一套协议或方法，用于在电子邮件中附加二进制数据（可执行程序、图像、声音文件等）或额外的文本。\n\
  - **motd**: 日期消息（Message of the day）。\n- **Mount（挂载）**: 将预定义的磁盘驱动器或磁盘子系统分区（例如 RAID）变为系统可用的行为。系统维护一个当前挂载文件系统的内部挂载表。\n\
  - **Mount commands（挂载命令）**: 通常在系统启动时自动运行。见 filesystem（文件系统）和 Unmount（卸载）。\n- **Mount\
  \ directory（挂载目录）**: 与挂载点相同。\n- **Mount point（挂载点）**: 一个标准的 UNIX 目录（本但不包含文件和子目录），`mount`\
  \ 命令将其作为另一个磁盘驱动器或磁盘子系统（例如 RAID）中文件系统的访问点。挂载后，挂载点目录中的文件和目录将消失。相反，挂载文件系统的文件和目录似乎出现在挂载点目录中。挂载点目录内的任何访问或更改实际上都发生在挂载的文件系统中。见\
  \ *Filesystem（文件系统）* 和 *Mount（挂载）*。\n- **Multitasking operating system（多任务操作系统）**:\
  \ 支持多个作业并发运行的操作系统，特别是单个用户可以启动多个并发运行的作业。\n- **Multi-user operating system（多用户操作系统）**:\
  \ 支持多个用户连接到系统的操作系统。\n- **mwm**: Motif 窗口管理器。\n\n## N\n\n- **Netnews（网络新闻）**: 这是一个松散控制的讨论组集合。消息（类似于电子邮件）发布在特定区域，然后人们可以进行评论，公开地回复同一处（发布响应）供他人看到。同一主题的消息集合称为线程（thread）。有些小组经过了审核，这意味着未经所有者批准不发布任何内容。大多数小组不是，且组名不能保证讨论内容与之相关。此的正式术语是\
  \ Usenet news。\n- **NFS Network file system（网络文件系统）**: 一种将挂载到远程系统的磁盘连接到本地系统的方法，就像它们物理连接在一起一样。\n\
  - **NNTP Netnews Transport Protocol（网络新闻传输协议）**: 用于在 TCP/IP 之上传输 Netnews 或 Usenet\
  \ 消息。关于传输消息的更多信息，请参阅 *Netnews（网络新闻）*。\n\n\n\n\n### 非单词 (Non-words)\n在 `vi` 中，非单词是指任何标点符号组。例如，`abc---def=3`\
  \ 包含两个非单词：`---` 和 `=`。参见*包含的单词*和*分离的单词*。\n\n### 对象 (Object)\n从本质意义上说，对象是指具有物理属性的东西，例如汽车、橡胶球和云。这些东西具有属性和行为。它们可以被抽象为数据（属性）和代码（行为）。它们不再仅仅是通过函数来处理数据，而是被封装在一个被称为对象的包中。\n\
  \n### 运算符 (Operator)\n对值或变量执行函数的元字符。加号（`+`）是一个将两个整数相加的运算符。\n\n### 选项 (Options)\n\
  特定程序或命令的指示器，用于控制该程序的行为。有时称为标志（flags）。`ls` 命令的 `-a` 选项显示以 `.` 开头的文件（如 `.profile`、`.kshrc`\
  \ 等）。如果没有它，无论使用什么通配符，这些文件都不会显示。这些用于命令行。另见*参数 (Parameters)*。\n\n### OSF\n开放软件基金会\
  \ (Open Software Foundation)。\n\n### 参数 (Parameters)\n通过命令行传递给命令或程序的数据。这些可以是控制命令工作方式的\
  \ `options`。某些参数根据其在命令行上的位置具有特殊含义。\n\n### 父目录 (Parent directory)\n包含另一个目录的目录被称为该子目录的父目录。\n\
  \n### 父进程 (Parent process)\n创建或派生称为子进程的子任务的进程或作业。\n\n### 父 shell (Parent shell)\n\
  控制另一个 shell 的 shell（通常是登录 shell），通常被称为子 shell 或子外壳。参见*Shell*。\n\n### 密码 (Password)\n\
  用于与用户 ID 结合使用以获得 UNIX 系统权限的安全代码。\n\n### 路径名 (Pathname)\n一种包含斜杠的文件引用方法——即指明包含该文件的目录。参见*相对路径\
  \ (Relative)*和*绝对路径 (Absolute pathnames)*。\n\n### Perl\n由 Larry Wall 开发的编程语言。（Perl\
  \ 代表 Practical Extraction and Report Language 或 Pathologically Eclectic Rubbish\
  \ Language；两种解释均同样有效）。该语言提供了 shell 编程、`awk` 和 `sed` 的功能以及许多增强功能。它通常用于为 UNIX 和 Windows\
  \ 编写 CGI Web 脚本。\n\n### 权限 (Permissions)\n当应用于文件时，它们是控制文件访问的属性。有三个访问级别：所有者（文件创建者）、组（属于系统确的相关组的人员）和其他（所有人）。权限通常用\
  \ `r` 表示读取，`w` 表示写入，`x` 表示执行。执行标志也用于搜索目录。\n\n### PGP\n极好的隐私系统 (Pretty Good Privacy)。\n\
  \n### PID\n进程 ID 数字 (Process ID Number)：UNIX 下的每个作业或进程都列在一个名为进程表的表中。该表中的作业条目即为其\
  \ ID 数字或 `PID`。\n\n### Pine\n交互式邮件程序。\n\n### 管道 (Pipe)\n将一个 UNIX 命令的输出重定向并作为第二个\
  \ UNIX 命令的输入的方法或动作。这消除了使用文件存储临时结果的需要。管道会自动调节其流量，因此其占用的磁盘空间远小于临时文件所需的空间。\n\n### 管道文件\
  \ (Pipe file)\n参见*命名管道 (Pipe, named)*。\n\n### 管道符号 (Pipe sign)\n竖线字符（`|`）。\n\n###\
  \ 命名管道 (Pipe, named)\n普通管道（将一个命令的输出重定向到另一个命令的输入）的扩展功能。\n\n\n\n\n（一个程序成为另一个程序的输入）。与其其将\
  \ `stdout` 连接到 `stdin`，不如将一个程序的输出发送到命名管道，而另一个程序从同一个文件中读取数据。这是通过一种被称为管道文件或 `FIFO`\
  \ 的特殊文件实现的。操作系统确保了数据的正确顺序。管道文件中实际上存储了很少或没有数据；它仅充当两者之间的连接。\n\n### Pipeline（管道线）\n\
  一组通过管道相互链接的 UNIX 命令序列。参见*Pipe*（管道）。\n\n### Piping（管道操作）\n使用管道的行为。参见*Pipe*（管道）。\n\
  \n### POSIX\n可移植操作系统接口，UNIX。`POSIX` 是基于 UNIX 的开放系统标准族。该名字归功于理德·斯尔曼（Richard Stallman）。由\
  \ IEEE 工作组 1003.2 (`POSIX.2`) 开发的 `POSIX` Shell 和工具标准侧重于命令解释器接口和实用程序。\n\n### PostScript\n\
  Adobe 系统公司（Adobe Systems, Inc.）打印机语言。\n\n### PPID\n父进程 PID：启动正在考虑的当前进程或作业的进程 `PID`（参见\
  \ `PID`）。\n\n### PPP\n点对点协议。串行链路（调制解调器）上的互联网协议。\n\n### pppd\n点对点协议守护进程。\n\n### Present\n\
  同于当前目录。\n\n### Print\n能力数据库。（注意：根据上下文，可能意指“打印能力数据库”）\n\n### Process（进程）\nUNIX 下的离散运行程序。用户的交互式会话是一个进程。进程可以调用（运行）并控制另一个程序，该程序被称为子进程。最终，程序所做的一切都是操作系统的子进程。\n\
  \n### Process identifier（进程标识符）\n在 `ps` 命令标题中显示为 `PID`。分配给系统中运行的每个进程的唯一数字。\n\n###\
  \ pwd\n打印工作目录命令。\n\n### Quota（配额）\n对用户或进程实施的系统限制的一般描述。它可以适用于磁盘空间、内存使用、CPU 使用、最大打开文件数以及许多资源。\n\
  \n### Quoting（引用）\n使用单引号和双引号来否定正常的命令解释，并将引号内的所有单词和空格拼接为单段文本。\n\n### R\n正则表达式（regular\
  \ expression）的缩写。这个短语在技术上是冗的，因为正则表达式本身就是一种模式。更高级的 UNIX 用户应该省略这个词，直接称为正则表达式。\n\n\
  ### R.E.\n通配符（wildcard）的缩写。参见*Regular expression*（正则表达式）。\n\n### RAID\n廉价/独立磁盘冗余阵列。`RAID`\
  \ 子系统允许你将多个磁盘组合成一个更大的结构，提供条带化（通过均衡磁盘负载来提高性能）、镜像（以防止介质或驱动器故障）或校验（以便在无需双倍数据驱动器数量的情况下提供冗余）。\n\
  \n### RCS\n版本控制系统。\n\n### Recursively processing（递归处理）\n递归处理一个目录意味着其所有的子目录也会被处理，这些子目录的子目录也会被处理，以此此类推。这意味着无论距离起始目录有多少层，所有的子目录都将被处理。\n\
  \n### Redirection（重定向）\n将数据流从默认值引导的过程。输入可以重定向以从文件获取数据或另一个程序的输出。标准输出可以发送到另一个程序或文件。错误可以发送到另一个程序或文件。\n\
  \n\n\n\n### 正则表达式\n可能包含一个或多个正则表达式通配符的模式。也是大型正则表达式中子模式元素的名称。参见`正则表达式通配符`。\n\n###\
  \ 正则表达式通配符\n这些是特殊字符，允许我们以通的方式在文件和管道中指定模式。这些通配符模式被 `grep`、`sed`、`awk` 和 `Perl` 等工具用于查找要显示或修改的所需文本。请勿将其与文件名生成通配符（Filename\
  \ Generation Wildcards）混淆。\n\n### 普通文件\n包含用户或系统数据、文本、编程等的 UNIX 文件，它与目录、设备节点、命名管道、信号量或共享内存文件有所区别。这是\
  \ UNIX 系统上常见的文件类型。\n\n### 相对路径\n一种引用文件的方法，其中文件名的目录部分指示为相对于当前目录的相对路径。相对路径从不以斜杠开头，例如，`reports/abc`\
  \ 指向当前目录下 `reports` 子目录下的 `abc` 文件。参见`相对路径`。\n\n### 备注\n与注释（comment）含义相同。\n\n###\
  \ RFC\n意见请求（Request For Comment）。用于创建 Internet 和 TCP/IP 相关标准的文档。\n\n### rlogin\n\
  远程登录。提供与 `Telnet` 相同的功能，但增加了不需要受信任客户端提供密码的功能，这可能引发安全问题。参见`Telnet`。\n\n### 根目录\n\
  包含所有其他目录和文件的主系统目录。它由单个斜杠 `/` 表示。\n\n### root 用户\nUNIX 系统管理员，也称为超级用户（superuser）。root\
  \ 被视为所有文件的共同所有者，因此拥有访问系统上所有文件的权限。\n\n### 路由\n在两个不同网络之间移动网络流量的过程；当两台机器之间存在多个连接时，决定采取哪条路径。它可以绕过中断发送流量。\n\
  \n### RPC\n远程过程调用。提供了从本地调用运行在远程系统上的函数或子程序的能力。\n\n### RPM\n红帽软件包管理器（Red Hat Package\
  \ Manager）。\n\n### 运行级别\n在 System V 中，一个从 0 到 6 的数字，用于描述系统状态。\n\n### 脚本为为 UNIX 工具编写的程序，包括\
  \ shell、`awk`、`Perl`、`sed` 等。参见`Shell 脚本`。\n\n### SCSI\n小型计算机接口（Small computer interface）。\n\
  \n### sed\n一种用于流编辑的常用工具，具有 ed 语法。\n\n### 分隔\n在任何由空格、制表符或换行符分隔的字符组中。也称为定界符。参见`delimited`。\n\
  \n### 服务器数据库\n关系型数据库软件，如 Oracle、Sybase。其他系统连接到此数据库获取数据。\n\n### SGID\n设置 ID（Set ID）。\n\
  \n### Shell\nUNIX 中处理用户输入并调用其他程序的部分。包括一种编程语言（例如 Bourne shell、C shell、Korn shell、tcsh\
  \ 和 bash）。\n\n### Shell 环境\nshell 程序（Bourne, Korn, C, tcsh 和 bash）的调用选项和预设变量，这些变量定义了\
  \ UNIX 命令行和程序执行界面的特性、功能和特征。\n\n### Shell 命令提示符\nUNIX shell 显示的单个字符或字符集，用户可以在其中输入一个或多个命令。\n\
  \n\n\n\n\n- **Shell 脚本**：使用 Bourne、Korn 或 C shell 等支持的 shell 语言编写的程序。\n- **信号 (Signal)**：一种特殊的标记或中断，用于操作系统和其他程序向程序通信特殊事件。\n\
  - **进入目录 (Sit in a directory)**：对进入当前目录或切换到某个目录的非正式说法。（例如，如果你位于 `/tmp` 目录，访问这些文件将变得更容易。）\n\
  - **SLIP**：串行链路互联网协议。通过串行链路（调制解调器）上网。该协议负责分帧和控制线路上 `TCP/IP` 数据包的传输。通常 `PPP` 比 `SLIP`\
  \ 更好。\n- **SNA**：系统网络架构。IBM 的网络架构。\n- **特殊文件 (Special files)**：同设备节点。\n- **Spool\
  \ 文件 (Spool files)**：用于排队等待打印的文件临时副本，一直保留直到打印完成。该术语也适用于许多其他系统进程（如 `uucp`）所持有的临时文件。\n\
  - **stderr**：程序的标准错误输出，默认发送到屏幕。可以重定向到文件。\n- **stdin**：程序的标准输入，默认从键盘读取。可以重定向到文件或另一个程序的输出。\n\
  - **stdout**：程序的标准输出，默认发送到屏幕。可以重定向到文件或另一个程序的输入。\n- **流 (Stream)**：数据的顺序集合。对于 `UNIX`\
  \ 操作系统而言，所有文件都是流。对它来说，文件没有结构；结构是由应用程序（如 `ISAM` 软件包或关系型数据库）所施加的。\n- **子目录 (Subdirectory)**：包含在另一个目录中的目录。如果你指的是某个给定目录的所有子目录，那么你指的不仅是它的直接子目录，还包括其子目录的每一个子目录。请参见\
  \ `Directory`。\n- **子网 (Subnet)**：网络中共享共同 IP 地址组件的部分。出于安全和性能考虑而使用。\n- **子进程 (Subprocess)**：在另一个进程（通常称为父进程）控制下运行的进程。参见\
  \ `Process`。\n- **子 shell (Subshell)**：在另一个 shell（通常称为父 shell，即登录 shell）控制下运行的 shell。参见\
  \ `Shell`。\n- **子树 (Subtree)**：由一个目录及其每一个文件、子目录，以及它们的每一个文件和子目录（尽可能延伸）组成的 `UNIX`\
  \ 树的一部分。\n- **SUID**：设置用户 ID (Set user ID)。\n- **超级用户 (Superuser)**：通常指 root 操作员。\n\
  - **系统管理员 (System administrator)**：负责维护 `UNIX` 系统和用户管理事务员。也称为系统经理 (system manager)，尽管该术语在\
  \ DEC VAX 安装中常见。\n- **系统经理 (System manager)**：参见 `System administrator`。\n- **tar**：磁带归档工具。\n\
  - **TCP**：传输控制协议。\n- **TCP/IP**：传输控制协议/互联网协议。这一对协议，也是构成互联网基础的工具和协议组的通用名称。最初开发用于将系统连接到\
  \ `ARPAnet`。\n- **tcsh**：一种类似于 C shell 的用户界面，具有命令行编辑功能。\n\n\n\n\n- **Telnet Protocol**:\
  \ 用于通过交互式（字符用户界面）终端访问远程系统。使用 `Telnet` 协议的终端模拟器通常被称为 `telnet` 或 `tnvt100`。\n- **telnet**:\
  \ 远程登录程序。\n- **Termcap**: 终端能力数据库。\n- **Terminal**: 一种硬件设备，通常包含一个阴极射线管（屏幕）和键盘，用于人类与计算机系统的交互。不支持图形或图像。\n\
  - **Text processing languages**: 文本处理语言是在文本编辑器中开发文档的方法，其中嵌入了处理格式的命令。文件通过一个执行这些嵌入命令的处理器，生成格式化的文档。这些包括\
  \ `roff`、`nroff`、`troff`、`RUNOFF`、`TeX`、`LaTeX` 甚至是大型机的 `SCRIPT`。\n- **TFTP**: 简单文件传输协议或简单文件传输程序。一种在通过\
  \ `TCP/IP` 连接的系统之间传输文件的系统无关方法。它与 `FTP` 的不同在于它不保证文件传输的性，不对用户进行身份验证，并且缺少许多功能（例如 `ls`\
  \ 命令）。\n- **Tin**: 交互式新闻阅读器。\n- **Truncate**: 截断/删除超出某些限制的末尾部分（例如，限制为 14 个字符）。\n\
  - **UDP**: 数据报协议。`TCP/IP` 的一部分，用于不需要交付的控制消息和数据传输。在这种情况下，应用程序必须确保数据传输。\n- **UID**:\
  \ 每个登录用户都有一个标识数字，称为 `UID`，列在 `/etc/passwd` 中。参见 User ID。\n- **UIL**: Motif 界面语言。\n\
  - **umount**: 执行卸载操作的命令。参见 Unmount（卸载）。\n- **Unmount**: 从系统挂载表中移除文件系统的操作，这将导致系统无法访问其内容（直到再次挂载）。这还将挂载点目录转换回普通目录，其原有内容现在可用。参见\
  \ Filesystem（文件系统）、`Mount（挂载）和 Mount point（挂载点）。\n- **URL**: 统一资源定位符。指定互联网材料的协议、格式、登录（通常省略）和位置的方法。\n\
  - **Usenet**: 参见 Netnews。\n- **UUCP**: UNIX 到 UNIX 复制程序。用于构建早期的、非正式的网络，以传输文件、电子邮件和\
  \ Netnews。\n- **Variables, attributes**: 设置变量类型的修饰符。变量可以可以是字符串或整数、左对齐或右对齐、只读或可更改，以及其他属性。\n\
  - **Variables, environmental**: 环境变量。在 shell 控制的区域内存储数据和值（字符串和整数）的地方，以便当前进程和子进程可以使用。它们可以是当前\
  \ shell 局部的，也可以供子 shell 使用（已导出的）。\n- **WAN**: 广域网。一种某些网络连接涉及电话公司的网络（例如数字线路、`ISDN`\
  \ 或 `T1`）。\n- **Web**: 参见 World Wide Web（万维网）。\n- **Whitespace**: 一个或多个空格和制表符，通常用于分隔命令和命令参数（例如，除非包含引号内，否则文件名）。\n\
  - **World Wide Web**: 互联网上运行软件并使用通用协议 (`HTTP`) 进行通信的服务器和服务的集合。\n\n\n\n用户无需记住这些资源的位置，通过\
  \ URL 从一个 Web 页面链接到另一个。\n\n- **工作目录**：与当前目录相同。\n- **WWW**：参见*世界维网 (World Wide Web)*。\n\
  - **WYSIWYG**：所见即所得。\n\n### **X**\n- **X Window System**：由 MIT 开发的窗口和图形系统，用于客户端/服务器环境。\n\
  - **X11**：参见*X Window System*。\n- **X**：参见*X Window System*。\n\n### **Y**\n- **yacc**：另一种编译器。\n\
