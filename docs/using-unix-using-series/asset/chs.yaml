  \ `gzip` 工具解压，然后从包含的 `tar` 文件中提取信息。完成后，你可能需要将二进制文件拷贝到 `/usr/local/bin`，并将 man 页面拷贝到\
  \ `/usr/local/man`，或者让系统管理员为你完成。\n\n```\ncat unz532x-sol.tar.Z | gzip -d | tar xvf\
  \ -\n```\n\n## 目录可用文件\n- `COPYING`\n- `README`\n- `WHERE`\n- `unzip`\n- `unzip.1`\n\
  - `unzip.doc`\n- `unzipsfx`\n- `unzipsfx.1`\n- `unzipsfx.doc`\n- `zipinfo`（指向 `unzip`\
  \ 的符号链接）\n- `zipinfo.1`\n- `zipinfo.doc`\n- `zipgrep`\n- `zipgrep.1`\n- `zipgrep.doc`\n\
  - `funzip`\n- `funzip.1`\n- `funzip.doc`\n\n准备好所有必要的工具后，你就可以下载 Lynx 的源码了。\n\n##\
  \ Lynx 源码\n```\nftp -i www.slcc.edu\nConnected to SOL.CCCC. FTP server (UNIX System\
  \ Release 4.0) ready.\nName (www.slcc.edu:marler): anonymous\nGuest login ok, send\
  \ ident as password.\nPassword: username@host.com\nGuest login ok, access restrictions\
