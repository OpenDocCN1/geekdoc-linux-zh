  \ Down` 键在文件中移动。你可以使用 `Home` 键回到行首，使用 `End` 键移动到行尾。\n\n你有两种输入文本模式。在 `Insert` 模式下，光标将是一条细线，你在行中间输入的任何字符都会将行的其余部分向右推。你可以通过按下\
  \ `Insert` 键切换到 `Overstrike` 模式，或者点击 `Options` 然后点击 `Overstrike`。光标将变为一个方块，你在行中间输入的任何文本将覆盖该处的现有文本。你可以通过再次按下\
  \ `Insert` 键或再次点击 `Options` 和 `Overstrike` 来切换模式。\n\n`Backspace` 键将删除光标左侧的字符。如果光标是一个块，`delete`\
  \ 键将删除光标下的字符。如果光标是一条线，`delete` 将删除光标右侧的字符。你可以通过拖动一段文本来显示它，然后按 `Delete` 键来删除该文本。\n\
  \n你可以在本文内部或窗口之间进行剪切粘贴或复制粘贴。请参见上一节关于在窗口之间传输文本的介绍。这是一个文本编辑器，而不是文字处理器。没有字体类型或大小选项。\n\
  \n### CDE 文本编辑器--检查拼写\n\n要检查当前文件的拼写，点击 `Edit, Check Spelling`。这将打开一个如图 5 所示的对话框。以下是图中标记数字的解释：\n\
  \n1. Word（单词）是在你的文件中发现的问题。\n2. Suggestion（建议）是拼写检查器找到的最佳替代方案。\n3. 显示其他有效单词。你可以双击其中一个来替换你的单词。\n\
  4. 显示文件有多大比例已通过拼写检查。\n5. `Change` 表示将 Word 替换为 Suggestion 一次。\n6. `Change All` 表示在整个文件中将\
  \ Word 替换为 Suggestion。\n7. `Skip` 表示忽略此 Word，但稍后如果发现相同的 Word 仍会标记。\n8. `Skip All`\
  \ 表示在整个文件中忽略此 Word。\n9. `Learn Word` 将此词添加到你的个人字典中作为有效单词，这样在你对任何文件运行拼写检查时，它都不会再被质疑。\n\
  10. `Options` 允许你查看并从个人字典中删除单词。\n11. `Stop` 停止拼写检查，但保持拼写检查对话框打开以便轻松重新启动。\n12. `Close`\
