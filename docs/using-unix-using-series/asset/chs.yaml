  \n##在 CDE 中运行 Shell 命令\n\n`Terminal` 应用程序创建一个 CDE 窗口，你可以在其中输入 shell 命令，就像在字符终端上一样。你可以在多个窗口中运行此\
  \ `Terminal` 应用，因此同时运行并观察多个 UNIX 命令。你甚至可以如前节所述，在两个 UNIX Terminal 会话之间或 CDE 应用与 UNIX\
  \ Terminal 会话之间剪切粘贴文本。\n\n要启动 `Terminal` 应用，请点击图 5.3 所示的 `Terminal` 图标。在 Solaris\
  \ CDE 下，你也可以通过移动到屏幕空白区域、右键点击然后选择 `Terminal` 来启动此应用。\n\n在图 5.4 中，我们启动了 `Terminal`\
  \ 命令行。以下图中标记的特定 `Terminal` 应用数字的说明：\n\n1. **窗口 (Window)**：点击此处获取选项：新建会话，关闭/终止此窗口。\n\
  2. **编辑 (Edit)**：点击此处获取选项：拷贝高亮文本，粘贴已保存文本。\n3. **选项 (Options)**：点击此处获取选项：终端特性（例如，允许\
  \ 132 列，允许换行），窗口大小，字体大小。\n\n当你启动 `Terminal` 窗口时，你不需要登录，因为你在 CDE 会话开始时已经登录了。如果你在\
  \ `Terminal` 窗口中输入 `exit`，将结束该窗口但不会结束 CDE 会话。要结束 CDE 会话，请点击 `EXIT` 单词（如图 5.2 所示）。\n\
  \n## 在 CDE 中编辑文本文件\n\n`Text Editor` 是一个 CDE 窗口应用程序，你可以在其中创建和修改 UNIX 文本文件和系统文件。你也可以如之前所述，在此编辑器与其他\
  \ CDE 应用（如 UNIX Terminal 会话）之间剪切粘贴文本。\n\n要启动 `Text Editor` 应用，请点击图 5.3 所示的 `Text\
  \ Editor` 图标。在 Solaris CDE 下，你也可以通过移动到屏幕空白区域、右键点击、选择 `Programs` 然后选择 `Text Editor`\
  \ 来启动此应用。\n\n### CDE 文本编辑器--打开文件\n\n在 `Text Editor` 中，你必须首先打开想要编辑的任何文件。点击 `File`,\
  \ `Open`。你会看到一个图 5.6 所示的对话框。以下是图中标记数字的说明：\n\n1. **文件 (Files)**：该框显示了可以通过双击文件名来打开的文件。\n\
  2. **过滤器 (Filter)**：该框显示了一个正则表达式模式，用于隐藏 Files 框中的某些名称。`[^.]*` 是默认值，用于隐藏隐藏文件（即以点开头的文件）。`^*`\
  \ 将显示所有文件（隐藏和非隐藏），`a^*` 将仅显示以字母 a 开头的文件。\n3. **路径或文件夹 (Path or folder)**：该框显示 Files\
  \ 框中所示文件的 UNIX 目录。它初始为你的当前目录，但你可以将其改为任何所需的目录。点击右侧的三角形获取你可以选择的之前或其他目录的列表。\n4. **文件夹\
  \ (Folders)**：该框显示路径框中目录的子目录。双击其中任何一个，该新目录的内容将显示在 Files 框中。你也可以点击 `..` 返回上一级父目录。\n\
  \n\n\n\n5. 在 `Filename` 框中，你可以输入所需文件的完整路径，而无需设置其他任何框。在此处按 Enter 键打开该文件。\n6. 点击 `OK`\
  \ 打开文件名框中显示的文件。\n7. 点击 `Update` 更新 `Files` 和 `Folders` 框中的内容，包括任何最近更改。\n8. 点击 `Cancel`\
  \ 终止打开文件的尝试。\n\n![8227-0137a.gif](img/6b23f4b003f9e7fbe60e89ffe4e11425.gif)\n图 5.6\
