  \n### CDE 文本编辑器--格式化段落\n\n在 UNIX `vi` 命令中，格式化段落可能困难。这可能会导致某些文件的段落某些行太短，某些行太长。你可以使用\
  \ CDE 文本编辑器编辑这些文件并格式化问题的段落。启动 CDE 文本编辑器并打开所需的文件。将光标移动到问题的段落。点击 `Format`，然后点击 `Settings`。你会看到如图\
  \ 5.8 所示的对话框。在此框中，设置左右边界的列数。然后选择你所需的段落对齐方式：`Left`（左对齐）、`Right`（右对齐）或 `Center`（居中对齐）。\n\
  \n\n\n\n你也可以选择 `Justify`（两端对齐）同时进行左右对齐，这会让你的段落看起来是整齐的块状。你可以点击 `Paragraph` 仅格式化当前段落，或点击\
  \ `All` 格式化整个文档。定义好设置后，下次需要格式化时，点击 `Format`，然后点击 `Paragraph` 或 `All`。\n\n![8227-0140a.gif](img/a6f1aee29ddc0a67ac579c60b2515d4c.gif)\n\
