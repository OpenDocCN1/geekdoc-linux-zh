  \ `Zip` 2.2, Solaris/SPARC 执行文件（无加密） |\n\n## 支持加密的二进制文件\n支持加密的二进制文件可通过 `ftp://ftp.icce.rug.nl/info/UNIX/SUN/`\
  \ 获取：\n- 129862 | 1997 年 11 月 9 | `zcr22x-41x.zip` | `Zip` 2.2, SunOS 4.x 执行文件（带加密）\
  \ |\n- 127574 | 1997 年 11 月 15 | `zcr22x-sol.zip` | `Zip` 2.2, Solaris/SPARC 执行文件（带加密）\
  \ |\n- 103685 | 1997 年 11 月 8 | `zcr22x-x86.zip` | `Zip` 2.2, Solaris/x86 执行文件（带加密）\
  \ |\n\n## 技术说明\n`SunOS 4.x` 执行文件已 `SunOS 4.1.4` 和 `Solaris 2.5.1` 下通过测试，其速度与原生 `Solaris\
  \ 2.x` 二进制文件几乎无异。然而，有报告称它们在 `Solaris 2.4` 下运行并不良好，因此提供了两种版本。\n\n`x86` 二进制文件是在 `Solaris\
  \ 2.4` 下使用 `SC2.0.1` 编译的。\n\n## 文档与源码\n所有的 `Info-ZIP` 包包含文档。源码位于 `../../src`。\n\
