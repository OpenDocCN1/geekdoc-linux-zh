  \n# 使用 CDE 邮件程序读取/发送电子邮件\n\nUNIX 的 `mail` 和 `mailx` 工具对于 UNIX 新手来说非常困难。图形化的 CDE\
  \ Mailer 应用程序让发送和接收电子邮件变得简单得多。它还可以处理附件，这是 `mail` 和 `mailx` 工具无法处理的。启动 CDE Mailer，点击主面板中的\
  \ `Mail` 图标（见图 5.9 中的数字 6）。随后你将看到如图 5.11 所示的 Mailer 窗口。以下是图中标记数字的说明：\n\n1. 菜单栏\n\
  2. 此窗口显示信箱中每个邮件项目占的一行。行开头的 `N` 表示该项目从未被读过。菱形表示该项目包含一个或多个附件。\n3. 此窗口显示窗口 1 中当前选中邮件项的正文。\n\
  4. 只有在存在附件时此窗口才会出现。\n5. 删除当前邮件项。\n6. 跳转并显示下一个邮件项。\n7. 跳转并显示上上一个邮件项。\n8. 点击此处回复发送者。这会将收到的邮件文本添加到回复中。\n\
  9. 点击此处将此邮件项副本转发给另一个用户。\n10. 点击此处编写并发送新邮件。你也可以包含附件。\n11. 打印邮件项。\n\n![8227-0143a.gif](img/ada6bf14363f36cfb77d5d103072314a.gif)\n\
  图 5.11 CDE Mailer。\n\n\n\n\n# 第二部分：与 UNIX 文件操作\n\nCDE 邮件器允许你设置自己的邮件别名。如果你经常向一组固定的人员发送邮件，此功能将非常有用。点击\
  \ `Options`，然后点击 `Aliases`。为该组创建一个别名名称，例如 `salesteam`。在 `Addresses` 下输入人员列表。然后点击\
  \ `Add` 添加此别名。现在，你可以向 `salesteam` 发送一封邮件，该邮件将发送给组内的每位成员。\n\n还有许多其他功能。你可以创建一个包含有用且具个人标识文本的签名，并将其添加到发出的邮件中。你可以设置\
  \ `Vacation Message`（休假回复），在指定的指定的日期内自动对收到的邮件进行回信。你可以在撰写邮件时检查拼写。你可以为邮件消息创建模板。你可以创建其他邮箱，以按项目分离和归档信函。所有这些及更多内容在“帮助”部分都有介绍，并带有超链接，可以帮助你快速到达所需的章节。\n\
  \n# 第 6 章列出、查找、显示或打印文件\n作者 Steve Moritsugu\n\n## 确定文件类型和文件内容类型\n\n### 列出和查找文件\n\n\
  ### 分页显示文件\n\n### 添加行号和处理控制字符\n\n### 使用标题\n\n### 打印文件和管道\n\n### 检查打印队列\n\n### 取消作业\n\
  \n### 为打印格式化输出\n\n## 介绍文件\n\n我们从第 2 章“目录和路径名”中已经了解许多关于 UNIX 知识。从那一章，我们了解到 UNIX 通过称为\
  \ `inode`（索引节点）的数字来访问文件。人类则通过文件名访问文件，文件名可以包含任何字母、数字或标点符号，现代 UNIX 系统允许文件名包含数百个字符。所有文件都组织在树形目录系统中。然后我们可以通过`绝对`路径或`相对`路径访问任何文件。\n\
  \n### 如何确定文件类型 (ls)\n\nUNIX 下最常见的文件类型称为`regular file`（普通文件）。程序、数据文件、文档、文本文件、系统实用程序和系统配置表都是普通文件。`COBOL`\
  \ 或 `BASIC` 等应用程序语言可以在 UNIX 下创建顺序文件（从头到尾按顺序读取）或索引文件（包含键字段，可快速访问所需数据）。对于 UNIX 来说，这些都是普通文件。\n\
  \nUNIX 不支持连续文件（即连续文件的所有块分配在磁盘的一个区域内相邻）。由于 UNIX 是一个`多用户、多任务`操作系统，磁盘服务来自多个用户和多个作业请求，将一个文件的所有块聚集在一起的好处有限。\n\
  \n`Directories`（目录）是 UNIX 下第二常见的文件类型。它们包含该目录内的文件名列表以及每个文件的 inode 号。每个目录都是 UNIX 文件，因此它也有一个\
  \ inode 号。\n\n另一种重要的文件类型是`device file`（设备文件），也称为`device node`（设备节点）。对硬件设备（如磁带驱动器或软磁盘）的所有访问都是通过访问该设备节点文件完成的。存在两种设备节点：用于原始访问设备的字符设备节点，和用于经过处理后访问设备的块设备节点。某些设备可以通过字符节点和设备节点同时进行访问。设备节点也被称为`special\
  \ files`（特殊文件）。\n\n另一种重要的文件类型是`symbolic link`（符号链接），它是指向系统中另一个文件的指针。\n\n还有几种其他 UNIX\
  \ 文件类型由系统使用，但普通用户永远不需要了解它们。\n\n### 如何确定文件类型\n\n1. 输入 `ls -l`。在接到指示前不要按回车。`ls` 的\
  \ `-l` 选项将显示每个文件的详细信息，包括文件类型。\n\n\n\n\n2. 输入一个空格，然后输入要列出的文件或文件。你可以指定当前目录下的 `basename`，也可以指定指向另一个目录的绝对路径或相对路径。如果你在此输入一个目录名称，`ls`\
  \ 将显示该目录中每个文件的信息。\n3. 按回车键执行你的命令。输出每行开头的字符将根据下表告诉你该文件的 UNIX 文件类型：\n\n### 表 6.1 `ls\
  \ -l` 使用的文件类型字母。\n\n| 文件类型字母 | 描述 |\n| :--- | :--- |\n| - | 普通文件 |\n| d | 目录 |\n\
  | l | 符号链接或软链接 |\n| b | 块设备节点文件 |\n| c | 字符特殊设备节点文件 |\n| p,s,m | 你可能会遇到的其他类型 |\n\
  \n以下是上述步骤的示例，显示了各种文件类型。`ls` 命令是一个系统命令，`passwd` 是文本文件，`fd0` 是软驱的设备节点，`tmp` 是目录，而\
  \ `uncompress` 是指向压缩程序的符号链接。\n\n```\nls -ld /bin/ls /etc/passwd /tmp /dev/fd0 /dev/rfd0\
  \ /usr/bin/uncompress\n-r-xr-xr-t   1 bin      bin           43296  May 13  1997\n\
  /bin/ls\nbrw-rw-rw-   2 bin      bin           2, 64  Feb 13 10:11\n/dev/fd0\ncrw-rw-rw-\
  \   2 bin      bin           2, 64  Feb 13 10:11\n/dev/rfd0\n-rw-rw-r     1 bin\
  \      auth          3001  Feb 16 16:01\n/etc/passwd\ndrwxrwxrwt   7 sys      sys\
  \           3072  Feb 20 11:16  /tmp\nlrwxrwxrwx   1 root     root            40\
  \  Feb 13 10:02\n/usr/bin/uncompress -> /usr/bin/compress\n```\n\n在前面的示例中，我们使用 `ls`\
  \ 的 `-l` 选项产生包含每个文件详细信息的长列表。我们使用 `-d` 选项是为了让 `ls` 显示目录本身的信息，而不是按照它的习惯显示目录的内容。关于符号链接的更多信息，请参见第\
  \ 197 页\n\n### 确定文件内容的类型\n\n要确定文件内容的类型，请使用 `file` 命令。为命令提供你想确定类型的文件名：\n\n```\nfile\
  \ /bin/ls: ELF 32-bit MSB executable SPARC Version 1, dynamically linked, stripped\n\
  ```\n\n在前面的示例中，我们看到 `/bin/ls` 文件是一个系统程序，它被编译为为运行 Solaris 的 SPARC 系统产生执行代码。在下一个示例中，我们使用星号（`*`）文件名通配符来确定当前目录下所有非隐藏文件的类型：\n\
  \n```\nfile * acmetab: ascii text\nreport7: English text\nreport8: empty file\n\
  rpio: executable shell script\ncpiofile: ASCII cpio archive\n```\n\n在前面的示例中，`file`\
  \ 命令会对文件内容的类型做出最佳猜测，通常仅基于分析文件的开头。在某些情况下，该命令会使用文件中嵌入的魔数（magic number），并在魔数表中查找内容类型（通常在\
  \ `file /etc/magic` 中找到）。\n\n### 使用 `ls` 列出文件\n\n我们可以使用 `ls` 命令列出当前目录或不同目录下的文件名。\n\
  \n1. 在 shell 提示符下，输入 `ls`。在接到指示之前不要按回车。\n2. 输入一个空格，然后输入任何所需的选项（请参附录中 `ls` 下的可能选项列表及其含义）。如果存在多个选项，可以像示例所示逐个输入：\n\
  ```\nls -l -a -L\n```\n选项也可以组合成一组，如下所示：\n```\nls -la\n```\n3. 输入空格，然后输入一个或多个要列出的目录或文件。在输入的每个目录或文件之间输入空格。输入目录会导致\
  \ `ls` 的输出出该目录的内容（除非指定了 `-d` 选项）。此文件和目录列表也可以包含由文件名通配符模式生成的文件列表。如果文件名或目录位于当前目录，只需输入其\
  \ `basename`。否则，输入该文件或目录的绝对路径或相对路径。\n4. 如果你想一次显示一次 `ls` 的输出（这样行在你可以阅读之前不会离开屏幕），输入一个空格。然后输入此行：\n\
  ```\npg\n```\n\n### 理解坏数字错误\n\n\n\n\n如果你遇到此 UNIX 错误，意味着该程序正在检查文件中的一个特殊标记（即魔数，magic\
  \ number），以确认该文件具有预期的内容类型。如果文件的魔数错误，则它要么是损坏了，要么是错误的文件。\n\n你可以将 `pg` 替换为 `more` 命令或\
  \ `less` 命令，取决于你的 UNIX 系统支持哪种分页器工具以及你最喜欢的分页器工具。这些内容在本章的稍后部分会有更详细介绍。\n\n5. 除了执行第\
  \ 4 步，你还可以选择将 `ls` 的输出保存到文件中。输入一个空格，然后输入此行：\n```bash\n> filename\n```\n将 `filename`\
  \ 替换为你想要保存结果的文件的绝对或相对路径。\n\n6. 除了执行上述第 4 或第 5 步，你还可以选择一次性完成这两个步骤——即将结果保存到文件中，并同时逐页查看结果。输入一个空格，然后输入此行：\n\
  ```bash\ntee filename pg\n```\n将 `filename` 替换为你想要保存结果的文件的绝对或相对路径。你可以将 `pg` 替换为\
  \ `more` 命令或 `less` 命令，取决于你的 UNIX 系统支持哪种分页器工具以及你最喜欢的分页器工具。这些内容在本章的稍后部分会有更详细介绍。\n\
  \n7. 按回车执行你的命令。\n\n以下是一个 `ls` 命令示例：\n```bash\nls -l pg\n```\n1 2 4 4\n\n在前例和接后的示例中，命令的每个单词下方都出现了生成该单词的步骤编号。在前例中，我们以长格式列出当前目录下的所有非隐藏文件，以查看每个文件的详细信息。我们使用\
  \ `pg` 工具逐页显示结果。\n\n这是另一个 `ls` 命令示例：\n```bash\nls -aid /usr/reports /usr/jane/*\
  \ > ls.save\n```\n1 2 3 5 5\n\n在这个示例中，`-a` 选项向我们显示非隐藏文件和隐藏文件。`-i` 选项显示文件的 `inode\
  \ number` 及其名称。`-d` 选项显示列出的任何目录本身而非其内容。接下来，我们指定要列出的文件。第一个是 `/usr/reports`。如果这是一个目录，由于\
  \ `-d` 选项的作用，我们将看到该目录的信息（而不是该目录的内容）。在此示例中，该文件被指定为绝对路径。第二个要列出的文件是 `/usr/jane/*`，这是一个文件名通配符（Filename\
  \ Wildcard）。shell 会将此模式单词替换为 `/usr/jane` 中所有非隐藏文件的列表。然后 `ls` 命令对所有这些文件名进行操作，就像我们逐个输入它们而不是输入通配符模式一样。该命令的结果不会显示在屏幕上，而是进入当前目录下的\
  \ `ls.save` 文件中。\n\n另请参考\n关于重定向和管道的更多信息，请参阅第 26 页。\n关于文件名通配符的更多信息，请参阅第 23 页。\n\n\
  ### 如何通过名称查找文件\n\n`find` 命令可以轻松遍历 UNIX 树的全部或部分，并向你显示它找到基名（basename）的位置。在每天处理几十个文件时，很容易丢失路径。`find`\
  \ 可以帮助你根据各种标准定位文件。\n\n### 根据名称查找文件\n\n如果你只知道目标文件的基名，但不知道其路径，可以使用 `find`。当你只知道基名的一部分时，甚至可以使用文件名通配符（第\
  \ 9 章介绍）。\n\n1. 在 shell 提示符下，输入 `find`。在接到指示前不要按回车。\n2. 输入一个空格，然后输入你想开始搜索的目录。像它是当前目录的子目录一样输入目录。否则，输入目录的绝对或相对路径。要搜索整个系统，请输入此行作为根目录：\n\
  ```bash\n/\n```\n\n\n\n\n若仅搜索当前目录及其子目录，请输入点（`.`）；这表示当前目录。`find` 命令会搜索起始目录的所有子目录（除非在下方第\
  \ 5 步中提供了 `-mount` 选项）。\n\n如果系统中有很多文件，`find` 完成可能需要很长时间。如果你能指定根目录（`/`，即整个系统）以外的起始目录，那么\
  \ `find` 命令将执行得快得多。\n\n3. 输入一个空格，然后输入 `-name`。\n\n4. 输入一个空格，然后输入你正在查找的文件名。如果你只知道名称的一部分，请使用此标符号输入该名称部分：\n\
  ```\n'*partname*'\n```\n例如，如果您要找的文件名包含 acme，请输入：\n```\n'*acme*'\n```\n在读过文件列表和文件名生成通配符（第\
  \ 9 章）之后，你可以使用任何这些通配符来指定你正在查找的文件。记住将通配符模式放在单引号内。\n\n5. 如果需要，你现在可以输入任何其他搜索标准，以便只查看特定大小、所有者、权限等的文件。请参阅附录中\
  \ `find` 条目获取此类选项列表。例如，你现在可以添加 `-mount` 选项，防止 `find` 挂载点进入其他文件系统（即其他磁盘驱动器）。\n\n\
  6. 输入一个空格，然后输入：`-print`。\n按 Enter 完成你的 `find` 命令。你也可以执行下方更有挑战性的第 7 步来代替第 6 步。\n\n\
  7. 输入一个空格，然后输入：`-exec ls -l {}`。这是第 6 步的替代方案。它向你显示与 `ls -l` 相同的文件信息。如果需要，你也可以输入\
  \ `-exec` 后跟不同的命令，以便对选定的每个文件执行某些操作。有关 `-exec` 的更多信息，请参阅附 `find`。\n\n8. 如果你想逐页查看\
  \ `find` 命令的输出（这样行在你阅读它们之前就不会离开屏幕），请输入一个空格。然后输入此行：\n```\npg\n```\n你可以将 `pg` 替换为\
  \ `more` 或 `less`，取决于你的 UNIX 支持哪种分页器以及你最喜欢的分页器。这些内容在本章稍后的部分会有详细介绍。\n\n9. 与执行第 8\
  \ 步相比，你也可以选择将 `find` 的结果保存到文件中。输入一个空格，然后输入此行：\n```\n> filename\n```\n将 `filename`\
  \ 替换为想要保存结果的文件的绝对或相对路径。\n\n10. 与执行第 8 步或第 9 步相比，你也可以选择同时完成这两件事；即你可以将结果保存到文件中并逐页查看结果。输入一个空格，然后输入此行：\n\
  ```\ntee filename pg\n```\n将 `filename` 替换为想要保存结果的文件的绝对或相对路径。你可以将 `pg` 替换为 `more`\
  \ 命令或 `less` 命令，取决于你的 UNIX 系统支持哪种分页器以及你最喜欢的分页器。这些内容在本章稍后的部分会有详细介绍。\n\n11. 按 Enter\
  \ 执行你的命令。\n\n12. `find` 命令的输出是一个路径列表。每个路径都从你在第 2 步中指定的目录开始。如果你在第 2 步中指定了绝对路径，所有生成的文件都是绝对的。如果你在第\
  \ 2 步中指定了相对路径，则所有文件都是相对的。这是一个 find 命令示例，每个单词下方是生成该单词的程序步骤：\n```\nfind /usr/fred\
  \ -name report7 -print\n```\n在前面的示例中，起始目录是一个绝对路径，因为它以 `/` 开头。因此，该 `find` 命令生成的所有路径也是绝对路径。以下是上述\
  \ `find` 命令的一些可能输出：\n```\n/usr/fred/report7\n/usr/fred/acme/reports/report7\n/usr/fred/pegasus/report7\n\
  ```\n这是另一个 find 命令示例，再次显示了生成命令每个单词的程序步骤。该 find 命令的起始目录是点（`.`），它表示当前目录。该命令在当前目录及其子目录中找到包含部分名称\
  \ `report27` 的所有文件名。`-user` 选项告诉 `find` 考虑...\n\n\n\n仅包含用户 `Fred` 拥有的文件。此 `find`\
  \ 命令的结果同时输出到名为 `/tmp/findlog` 的文件和屏幕上，逐页显示。\n\n```\nfind . -name '*report27*' -user\
  \ fred -print | tee /tmp/findlog | pg\n```\n\n前一个命令的起始目录是一个相对路径，命令的输出也是以点（`.`）开头的相对路径。以下是前一个命令的可能输出：\n\
  \n```\n./casereport273a ./1998/reports/acme.report27-2-98\n```\n\n### 延伸\n关于后台运行作业更多信息，请参第\
  \ 319 页。\n\n关于使用 `find` 根据最后访问日期或最后修改日期查找文件的更多信息，请参第 153 页。\n\n### find 选项对比 find\
  \ 操作 (*find*)\n\n`find` 命令有许多选项，包括 `-name` 和 `-user`，它们允许我们指定文件被 `find` 命令选取时必须满足的条件。`-type`\
  \ 是另一个 find ，允许我们指定文件类型（例如目录或普通文件）。不满足 find 条件的文件不会被选取。（参见附录中 `find` 的条目获取可能的 find\
  \ 选项列表。另见 `find` 的帮助页。）这些 find 选项可以以任何组合和顺序使用。\n\n在指定所有所需的选项后，你应该用一个或多个操作来结束你的 `find`\
  \ 命令。`-print` 选项是最常用的操作，因为它只需指示系统显示找到的文件。如果你忘记包含操作，某些系统将默认假设为 `-print`。但在其他系统上，`find`\
  \ 将花费所需的时间来定位文件，但由于你忘记输入操作，它将不会显示任何内容。始终指定操作是一个好习惯。\n\n另一个实用的操作是 `-exec`，它允许我们指定一个在每个找到的文件上运行的\
  \ UNIX 命令。在命令中使用 `{}` 来指定插入文件名的位置。该命令必须以空格后跟 `\\;` 结尾。。以下是一个 `find -exec` 命令的示例，它查找任何基名为\
  \ `core` 的文件并将其从系统中删除。`rm` 的 `-f` 选项意味着如果你对被删除的文件没有写权限，则不需要确认；也就是说，它对所有删除操作都给予强制确认。\n\
  \n```\nfind / -name core -print -exec rm -f {} \\;\n```\n\n注意上述命令中发生了两个操作：`-print`\
  \ 显示找到的 core 的路径，以及`-exec` 删除它们。以下是一个重命名当前目录及其子目录下所有普通文件的 find 命令示例。该命令为所有普通文件名添加了\
  \ `.old`。\n\n```\nfind . -type f -exec mv {} {}.old \\;\n```\n\n### 如何查找内容包含某个单词的文件\
  \ (*find,grep*)\n\n有时你对文件名一无所知，但你知道文件中包含某个独特的单词。你可以像这个例中一样找到所有此类文件：\n\n```\nfind\
  \ / -exec grep {} /dev/null \\;\n```\n\n将 `WORD` 替换为你想要搜索的单词。你可以在 `WORD` 中包含正则表达式通配符（在第\
  \ 15 章“搜索文件或管道中的行”中介绍），但此时你应该将 `WORD` 括在单引号中。在前面的示例中，`find` 命令调用 `grep` 命令检查系统中的每个文件，查看其是否包含给定单词。包含第二个空文件（`/dev/null`）会导致\
  \ `grep` 显示文件名以及包含该单词的行。\n\n前面的示例让你对如何使用 `find` 和 `-exec` 有了概念，但也要意识到这种方法效率低下，需要很长时间才能完成，因为它调用了多次\
  \ `grep` 命令。这里是实现相同功能的更高效的方法：\n\n```\nfind / -print | xargs grep WORD /dev/null\n\
  ```\n\n`xargs` 的用法在第 9 章中描述。这种方法更高效，因为 `xargs` 对每组文件只调用一次 `grep`。\n\n### 延伸\n关于\
  \ `xargs` 的更多信息，请参第 247 页。\n\n### 在 find 选项中使用逻辑 AND、OR 和 NOT\n\n每当你指定多个 find 选项时，所有选项都必须通过，文件才能被选取。这在实际上是逻辑与（AND）的情况。\n\
  \n```\nfind / -name acme -user fred -type d -print\n```\n\n\n\n上一个示例包含三个选项和一个操作。文件必须通过所有三个选项才能执行该操作。在这种情况下，基名（basename）必须是\
  \ `acme`，且所有者必须是 `fred`，并且它必须是一个目录。\n\n可以使用 `-o` 命令来表示逻辑或（OR），并可以使用*转义*的括号进行分组，如下例所示：\n\
  \n```bash\nfind / \\( -name acme -o -user fred \\) -type d -print\n```\n\n在上述示例中，我们正在寻找基名为\
  \ `acme` 或所有者为 `fred` 的文件。无论哪种情况，如果让 `find` 选择并显示这些文件，它们必须是目录。请注意，转义括号周围必须有空格。\n\
  \n为什么要使用转义括号？\n\n通常情况下，我们使用括号是为了告诉 shell 在子壳中运行括起来的命令。我们对括号进行转义（即在前面加一个反斜杠 `\\`），是为了告诉\
  \ shell 忽略它们并将它们传递给 `find` 命令。\n\n感叹号（`!`）可以用于反转或否定某个条件，如下例所示：\n\n```bash\nfind\
  \ / ! -user fred -print\n```\n\n在上述示例中，`find` 显示所有所有者不是 `fred` 的文件。请注意，感叹号（`!`）周围必须有空格。\n\
  \n### 显示文件\n\n以下是 UNIX 环境下显示文件的命令和选项的概述。\n\n## 显示小文件\n\n显示小文件的标准方法是使用 `cat` 命令：\n\
  \n```bash\ncat filename\n```\n\n在 UNIX 中，`cat` 一词与“显示”是同义词，因此指令可能会让你 `cat` 一个文件，或者提到\
  \ `catting` 一个文件。\n\n## 分页显示文件/管道\n\nUNIX 命令没有一次显示一屏（即一页）结果的选项。这是因为你始终可以将输出管道到你喜喜欢的分页器（pager）工具，并让它一页页显示输出。UNIX\
  \ 下有三种常用的分页器：`pg`、`more` 和 `less`。\n\n遗憾的是，你不能只学习其中一个，因为某一个在某些类型的 UNIX 系统上可能不存在。每个分页器都有一套略有不同的命令。某些工具（如\
  \ man 页面）会自动调用这些分页器之一，这让初学者感到很困难，因为现在你必须弄清楚你处于哪种分页器中以及如何让它工作。\n\n通常，商业 UNIX 系统提供\
  \ `pg` 和 `more`。`pg` 选项的功能最全，但 `more` 通常是默认分页器。商业 UNIX 系统通常不提供 `less` 分页器。Linux/GNU\
  \ 提供 `less` 分页器，但通常不提供 `pg` 或 `more`。\n\n这些分页器都有两种用法：\n\n1. 在命令行上指定一个或多个文件，如下例：\n\
  ```bash\npg file1 file2\nmore file1 file2\nless file1 file2\n```\n\n2. 你可以将输出管道（`|`）到这些任何一个分页器。这将一次显示\
  \ `ls -l` 的输出：\n```bash\nls -l | pg\nls -l | more\nls -l | less\n```\n\n如果你既将输出管道到分页器，又给分页器提供了文件列表，分页器将显示文件列表并忽略管道数据。\n\
  \n如何识别你处于哪种分页器中：\n如果每个屏幕的底部看起来像这样，那么你正在运行 `pg` 工具：\n```\n--More--(34%)\n```\n如果看起来像这样，你正在运行\
  \ `more`：\n```\nFilename (34%)\n```\n如果看起来像这样，你正在运行 `less`：\n```\n--More--\nstdin\n\
  ```\n\n如何跳转到下一页：\n- `pg`: 按下 `ENTER` 键\n- `more`: 按下空格键\n- `less`: 按下空格键\n\n如何跳转到上一页：\n\
  - `pg`: 按减号 (`-`）\n- `more`: 按 `Ctrl+B`\n- `less`: 按 `Ctrl+B`\n\n如何跳转到 `STRING`\
  \ 的下一次出现处：\n- `pg`: 按下 `/`\n- `more`: 按下 `/`\n- `less`: 按下 `/`\n\n如何跳转到文件末尾：\n-\
  \ `pg`: 按下 `$`\n- `more`: 按下 `G`\n- `less`: 按下 `G`\n\n如何回到文件开头：\n- `pg`: 按下 `1`\n\
  - `more`: 按下 `1G`\n- `less`: 按下 `1G`\n\n如何重新显示当前页：\n- `pg`: 按下 `.`\n- `more`: 按下\
  \ `Ctrl+L`\n- `less`: 按下 `Ctrl+L`\n\n如何显示分页器中可用命令的帮助菜单\n- `pg`: 按下 `h`\n- `more`:\
  \ 按下 `h`\n- `less`: 按下 `h`\n\n\n\n\n\n# 如何向下滚动半页\n(当你对屏幕底部的内容感兴趣并想查看周围行时，这非常有用)\n\
  \n- `pg`: `d`\n- `more`: `d`\n- `less`: `d`\n\n## 即使不在文件末尾如何退出分页器\n- `pg`: `q`\n\
  - `more`: `q`\n- `less`: `q`\n\n## 比较商业 UNIX 系统上的 pg、`more` 和 `less`\n\n商业 UNIX\
  \ 系统通常不提供 `less`。`less` 拥有 `pg` 的所有功能，并且 `more` 命令的一致超集。`more` 的功能非常有限——通常没有方法跳到末尾或向后移动。当你通过管道\
  \ (`|`) 使用 `more` 时，情况尤为如此。\n\n`pg` 比 `more` 更用，因为它可以后移动、跳转到文件结尾、跳转到文件开头等。遗憾的是，无法通过\
  \ `pg` 确定你处于文件的什么位置。\n\n在巨大的管道中使用 `pg` 时要小心。当你显示管道输出并使用 `pg` $ 命令时，可能需要很长时间才能完成，因为系统会将遇到的所有文本保存在临时文件中，以便你根据需要返回第一页。某些系统没有足够的临时空间来存储大文件，当空间耗尽时，所有用户任务都可能被中断，系统可能会崩溃。`pg`\
  \ 有一个功能在你想要定位文件中某个单词的所有出现处时非常有用。通常这很难，因为查找单词的斜杠 (`/`) 命令从当前屏幕的末尾开始搜索。如果一个屏幕上有多个出现处，你可能会漏掉一些。“巨大”到底有多大？你什么时候需要开始担心使用管道会导致系统崩溃？分页器通常在\
  \ `/tmp` 中构建临时文件。使用 `df` 命令检查 `/tmp` 中有多少空闲块，或者如果 `df` 未显示 `/tmp` 则检查根目录。该空闲块计数就是你的限制，但为了安全起见，你不应该达到那个程度。\n\
  \n## 使用 `pg` 查找字符串的所有出现处\n\n1. 使用 `pg` 查看文件或管道。\n2. 在运行 `pg` 时，输入此行：`/string/b`\n\
  \   - 将 `string` 替换为你要查找的文本。如果没有 `/b`，找到的字符串将放在屏幕的第一行。`/b` 告诉 `pg` 将本次及以后搜索找到的行放在屏幕底部。\n\
  3. 要查找 Find 相同字符串的下一个出现处，输入此行：`/`\n   - 系统将使用上一个字符串。因为第 2 步中给了 `/b`，字符串的下一个出现处将位于底行。如果没有第\
  \ 2 步中的 `/b`，你可能会漏掉某些出现处，因为 `/` 假设你已经在当前屏幕的任何地方找到了所有匹配项，并从屏幕底部开始搜索。\n4. 根据需要重复步骤\
  \ 3 直到文件末尾。\n\n### 另外\n关于 `df` 命令和文件系统可用块更多信息，请参见第 93 页\n\n### 在文件显示中添加行号 (`nl`,`cat`)\n\
  你可以使用 `nl`（编号行）或 `cat -n` 为文件或管道的显示添加行号，例如所示：\n\n```\n$ cal | nl     1 February\
  \ 1998\n      2 S M Tu W Th F S\n      3  1 2 3 4 5 6 7\n      4  8 9 10 11 12 13\
  \ 14\n      5 15 16 17 18 19 20 21\n      6 22 23 24 25 26 27 28\n\n$ cal | cat\
  \ -n\n      1     February 1998\n      2  S M Tu W Th F S\n      3  1 2 3 4 5 6\
  \ 7\n      4  8 9 10 11 12 13 14\n      5 15 16 17 18 19 20 21\n      6 22 23 24\
  \ 25 26 27 28\n      7  8\n```\n\n在前面的示例中，我们取了一个月的日历并将其通过化，以便每行都编号。请注意 `cat -n`\
  \ 会为所有行编号。`nl` 命令则不对空行编号。然而，某些选项可以改变这种行为。\n\n- 要对所有行（包括空行）编号，输入此行：`cat -n nl -ba`\n\
  - 要仅对非空行编号，输入此行：`cat -nb nl`\n\n\n\n\n\n`cat` 和 `nl` 都接受命令行上的文件列表。如果没有提供任何文件，它们将从标准输入读取内容，这样你就可以将数据管道传输这些命令。某些\
  \ UNIX 系统可能并不同时支持这两个命令，因此了解这两个命令是否都可用是很有用的。\n\n## 显示包含控制字符的文件 (cat, od, strings)\n\
  \n文本文件仅包含打印字符，而二进制文件可以包含所有可能的字符值，包括我们所说的*控制字符*的范围。如果你将二进制文件显示在屏幕上，文件中的控制字符可能会为你的终端设置不必要的模式，导致后续所有输出显示为乱码或无意义，甚至可能让你的终端完全停止响应。\n\
  \n在显示未知文件之前，请使用本章开头讨论的 `file` 命令来查看它是否为文本文件。如果不是文本文件，那么简单地将其显示在屏幕上是不安全的。确实有一些安全的方法可以查看二进制文件的文本，正如我们将在本节中看到的那样。\n\
  \n`od` 命令代表 octal dump（八进制转储）。该命令以八进制（即使用 8 计数法）显示文件或管道中的每个字，如下例所示：\n\n```bash\n\
  # od /bin/ls | head -5\n0000000 077505 046106 000402 000400 000000 000000 000000\
  \ 000000\n0000020 000002 000002 000000 000001 000001 007374 000000 000064\n0000040\
  \ 000000 040140 000000 000000 000064 000040 000005\n```\n\n`od` 的 `-b` 选项将每个字拆分为\
  \ 2 个字节或字符，如下例所示：\n\n```bash\n# od -b /bin/ls | head -5\n0000000 177 105 114 106\
  \ 001 002 001 000 000 000 000 000\n0000020 000 002 000 002 000 000 001 000 001 016\
  \ 374 000\n0000040 000 000 100 140 000 000 000 000 064 000 040 000 00\n```\n\n`od`\
  \ 的 `-c` 选项向你显示输出中的任何打印字符，如下例所示：\n\n```bash\n# od -c /bin/ls | head -5\n0000000\
  \ 177 105 114 106 001 002 001 000 000 000 000 000\n0000020 000 002 000 002 000 000\
  \ 001 000 001 016 374 000\n0000040 000 000 100 140 000 000 000 000 064 000 040 000\
  \ 00\n```\n\n在这里，`strings` 命令显示任何长度约为四个字符或更长的打印字符字符串。注意在在上一个示例中，打印字母 `ELF` 出现在文件开头附近，但\
  \ `strings` 并没有报告它，因为在该部分不存在四个打印字符。\n\n```bash\n# strings /bin/ls | head -5\n```\n\
  \n你可以使用 `strings` 的 `-n` 选项设置显示字符串的最小长度。\n\n## 使用大字体显示文本 (banner)\n\n`banner` 命令可以用于大字母显示短消息，如下例所示：\n\
  \n```text\n# banner hello\n#  #  ######  ######  ######  ####\n#  #  #      #  \
  \    #      ####\n#  #  #      #      #      ####\n#  #  #      #      #      ####\n\
  #  #  #      #      #      ####\n#  #  #      #      #      ####\n#  #  ###### \
  \ ######  ######  ####\n```\n\n## 在二进制文件中寻找文本线索\n\n在二进制程序中寻找打印文本在解决程序无法运行的问题时非常有用。有时，二进制文件中包含的文本错误消息、用法信息以及文件和目录名称可以提供启动程序所需的线索。\n\
  \n这种技术在打印作业之间创建分隔页时非常有用，因为它生成的文本易读且突出。当你需要将输出到文件中时，可以重定向 `banner` 的输出。\n\n\n\n\n\
  \n`banner` 命令将不同的单词放在不同的行上。如果你希望将这些单词放在同一行，请在每个空格前加上反斜杠（`\\`）来转义任何空格，或者像此例所示，将任何空格包含在单引号或双引号中：\n\
  \n```\nbanner \"Acme Corp.\"\n```\n\n`banner` 的最大行长度为 10 个字符。该命令会截断超出长度的任何字符。\n\n\
  ### 显示 DOS 文件 (*col*)\n\nDOS/Windows 下的文本文件每行都以回车符（carriage return）和换行符（linefeed）结束。UNIX\
  \ 文本文件仅以换行符结束，UNIX 称为 `newline character`。如果你将一个 DOS 文本文件引入 UNIX 并尝试用 `vi` 编辑它，可能会看到文件显示如下：\n\
  \n```\n |\n|\nPage 168\n\n这是一个来自 DOS^M 系统、通过磁盘或通过^M 网络下载的文本文件^M。^M\n```\n\n每段每行末尾的\
  \ `Ctrl+M` 是回车符。有多种方法可以使用 `col` 命令来移除 `Ctrl+M`，`col` 是一个过滤控制字符的实用程序。\n\n要从现有 DOS\
  \ 文本文件创建 UNIX 文本文件，请输入此行：\n\n```\ncol -bx < dosfile > unixfile\n```\n\n如果你在 `vi`\
  \ 中发现每行都以 `^M` 结尾，请输入此行：\n\n```vi\n%! col -bx\n```\n\n前面的命令使 `vi` 对每一行应用 `col -bx`，从而移除每行末尾的\
  \ `^M`。你现在可以继续编辑。\n\n### 清理 man Pages (*col*)\n\n如果你将帮助页（man page）保存到文件中，你可能会发现单词中间夹杂着\
  \ `^H` 或退格键字符。`^H` 是给打印机的指令，要求返回并再次加粗打印该字符，或为该字符加下划线。以下是一个显示 `^H` 的保存帮助页示例：\n\n\
  ```\nNAME    ls-list contents of directory\nSYNOIS\n    /usr/bin/ls [-aAbcCdfFgilLmnopqrRux1]\
  \ [file...]\n    /usr/xpg4/bin/ls [-aAbcCdfFgilLmnopqrRux1] [file...]\nDESCRIPTION\n\
  \    For each file that is a directory, ls lists the contents of the directory;\
  \ for each file that is an ordinary file, ls repeats its name and any other information\
  \ requested.\n```\n\n你可以像上一节所示，从命令行或在 `vi` 中运行 `col -bx`。以下是运行 `col -bx` 后相同的帮助页文件：\n\
  \n```\nNAME    ls-list contents of directory\nSYNOPS\n    /usr/bin/ls [-aAbcCdfFgilLmnopqrRux1]\
  \ [file...]\n    /usr/xpg4/bin/ls [-aAbcCdfFgilLmnopqrRux1] [file...]\nDESCRIPTION\n\
  \    For each file that is a directory, ls lists the contents of the directory;\
  \ for each file that is an ordinary file, ls repeats its name and any other information\
  \ requested.\n```\n\n这也解释了为什么在帮助页中，你使用 `/` 搜索字符串时，man 却说它不存在，但你随后在帮助页的后面找到了该字符串。为什么之前没找到？答案可能是因为它是一个重要词汇，因此包含了一些\
  \ `Hs`。你可以通过如下方式输入 man 命令来提高搜索帮助页的能力：\n\n```\nls col -bx\n```\n\n`col -bx` 移除了关键字中的\
  \ `Hs`，使得 `/` 能够在搜索中找到它们。\n\n另参 *更多关于帮助页的信息，请参阅第 90 页*\n\n### 打印文件\n\n通常 UNIX 系统上存在一个或多个打印机。系统管理员为每台打印机命名，以便用户指定希望输出输出的打印机或打印机组。用户使用\
  \ `lp` 或 `lpr` 命令打印到指定的打印机。\n\n### 介绍 UNIX 打印系统\n\n实际发生的情况是，打印的文本被保存在一个系统磁盘文件中，称为\
  \ *spool file*。每个不同的打印作业都有自己的 spool 文件。`lp/lpr` 命令实际上执行得非常快，因为将所有文本保存到磁盘文件中并不花费长时间。这个过程被称为打印请求排队。在后台运行的打印调度程序会等待指定的打印机变得可用，然后打印该打印机队列中的下一个作业。\n\
  \n\n\n\n\n假打印（Spooling）提供了许多优势。通过假打印，打印机在打印你的作业时不会占用你的工作站（对于大型打印作业，这可能是一个缓慢的过程）。所有作业都通过一个打印机调度程序进行，因此不存在两个用户同时向同一台打印机打印会导致输出相互交错的危险。\n\
  \n假打印也有一些缺点。在假打印程序终止之前，假打印作业不会开始打印。这一事实提供了一个明显的优势，即打印机可以始终以全速运行，因为它不需要等待程序计算和磁盘访问来生成下一行打印输出。当一个作业需要长时间（例如六小时）来生成输出时，缺点就显现了。在六小时的任务完成后，打印才会开始，因此用户必须等待更长时间才能获得打印输出。\n\
  \n应用程序可以打开并直接输出到打印机设备。对于前段文字中的示例，直接打印机允许在整个六小时的程序运行期间进行打印，因此当假打印打印机刚开始输出时，直接打印机已经完成了大部分打印工作。\n\
  \n当你在打印机上有支票和表单，并希望从应用程序控制表单的正确居中时，直接打印机也更有用。应用程序通常会打印一些测试表单，并要求用户在打印批量表单之前检查表单对齐。除非应用程序关闭输出通道，否则假打印机无法打印测试表单，这会导致打印机处于开启状态，从而浪费已经加载的表单。\n\
  \n直接打印机很难防止用户的输出相互交错。应用程序通常会在打印机在使用期间锁定打印机，迫使所有其他用户等待作业完成。不同的应用程序通常使用不同的锁定机制，因此一个应用程序的输出可能会与另一个应用程序的输出交错。如果有多个应用程序使用同一台打印机，通常需要假打印来防止输出交错。\n\
  \n每当 UNIX 文档提到打印时，它通常指的是打印队列/假打印系统。本节的其余部分也均指打印队列/假打印系统。\n\n### 如何确定你的系统打印机名称 (`lpstat`)\n\
  \n要获取系统上的打印机名称列表，请输入此行：\n\n```\nlpstat -p -D\n```\n\n`lpstat` 命令显示打印机状态。`lpstat`\
  \ 的 `-p` 选项将输出限制为显示打印机及其可用性。`lpstat` 的 `-D` 选项显示该打印机的描述（如果有的话）。你应该会看到类似下面的输出：\n\n\
  p104 idle enabled since Sat Aug 23 16:32:49 available\np108 idle enabled since Thu\
  \ Aug 21 16:28:28 available: Laser III by copy room\np206 idle enabled since Feb\
  \ 14 16:50:49 available: LaserJet in Accounting\n\n前面的示例显示三个可用的打印机名称：`p104`、`p108`\
  \ 和 `p206`。它们目前都处于空闲状态，这意味着它们没有在打印任何作业。没有被禁用（例如，没有正在维修）。但无法确定打印机 `p104` 位于建筑的哪里；它可能在\
  \ 104 室，但也可能是起始于 104 室但后来移动到 237 室的打印机。\n\n### 如何打印文件或管道 (`lp`, `lpr`)\n\nUNIX 下有两个通用命令处理文件或管道打印：\n\
  \nUNIX 假打印也适用于网络打印机。可以使用本节中的相同命令向网络上的打印机打印。系统管理员必须配置配置打印机，以便它们出现在 `lpstat` 中。`lp`（系统实用程序）或\
  \ `lpr`（BSD 实用程序）。你应该学习这两种打印命令，以便在仅提供其中一种的 UNIX 系统上工作。以下步骤描述了如何打印一个或多个文件。\n\n####\
  \ 如何打印文件或管道输出\n\n1. 如果你正在打印一个或多个文件，请跳到第 2 步。否则，在 shell 提示符处，输入你想打印其输出的 UNIX 命令。以管道符号\
  \ `|` 结束命令。`|` 符号周围的空格是的。在接到指示前不要按回车。现在转到第 3 步。\n2. 如果你正在打印一个或多个文件，请先使用 `file` 命令检查它们，如本章开头所示。确保这些是文本文件。如果你不小心打印了二进制文件，可能会浪费大量的打印纸，并让其他人对你生气。\n\
  3. 输入 `lp` 或 `lpr`。\n\n\n\n\n\n1. 输入你的系统支持的任何命令。如果你不确定，可以尝试一个。如果你选择的命令不支持，运行该命令时将得到“找不到命令”（command\
  \ not found）的错误。\n\n4. 如果你想指定去哪个打印机，请遵循以下指令：\n   - 对于 `lp`，输入一个空格然后输入 `-d`。\n  \
  \ - 对于 `lpr`，输入一个空格然后输入 `-P`。\n   - 输入所需的打印机名称。\n   如果你跳过此步骤，输出将发送到系统默认打印机；如果不存在默认系统打印机，你的命令将产生错误。\n\
  \n5. 如果你想指定打印份数，请遵循以下指令：\n   - 对于 `lp`，输入一个空格然后输入 `-n`。\n   - 对于 `lpr`，输入一个空格然后输入\
  \ `-#`。\n   - 输入要打印的份数。\n\n6. 如果你想打印一个或多个文件，输入一个空格然后列出每个文件，并用空格分隔。如果文件在当前目录下，只需列出其文件名（basename）。否则，输入每个文件的绝对路径或相对路径。你也可以使用一个或多个文件名生成通配符模式（Filename\
  \ Generation Wildcard）来生成文件列表。\n\n7. 按回车执行你的命令并队列输出。你应该能看到输出显示了一个请求 ID（request id），以便跟踪任务是否已经打印，从而中止打印，例如：\n\
  ```\n$ ls -l lp request is hp-85 (standard input)\n```\n\n### 检查打印队列 (`lpstat`)\n\
  在 System V 上，你可以通过输入不带选项的 `lpstat` 来检查打印队列中的请求，例如：\n```\n$ lpstat hp-85 mori 11946\
  \ Feb 23\nhp-86 fred 203 Feb 23\n```\n`lpstat` 输出的每行都以打印任务请求 ID 开头，以打印机名称开头。在前例中，fred\
  \ 和 mori 都在大约相同时间为打印机 `hp` 排了打印任务。mori 先到达，他的任务目前正在 `hp` 上打印。尽管 fred 的任务很小（只有 203\
  \ 个字符），但在 mori 的任务完成之前，他的任务将不会打印。\n\n如果你的系统不支持 `lpstat`，请尝试使用 `lpq` 获取排队打印任务列表，例如：\n\
  ```\n$ lpq -P printer-name -l\n```\n如果你的系统中没有 `lpq`，请尝试 `lpc`。进入 `lpc` 后，有用的命令是\
  \ `help` 和 `quit`。\n\n### 取消打印任务 (`cancel`, `lprm`, `q`)\n在 System V 上，你可以通过请求 ID\
  \ 取消打印任务。使用上一节所示 `lpstat`、`lpq` 或 `lpc` 来确定你想取消哪个当前请求，例如：\n```\n$ lpstat hp-85 mori\
  \ 11946 Feb 23\nhp-86 fred 203 Feb 23\n$ cancel hp-85\nrequest \"hp-85\" canceled\n\
  $ lpstat\nhp-86 fred 203 Feb 23\n```\n在 BSD UNIX 上，使用带有任务号的 `lprm` 来移除（即取消）当前的打印请求。在\
  \ AIX UNIX 上，使用 `qcan` 取消打印请求，例如：\n```\n$ qcan -P printer -x jobid\n```\n在所有所有系统中，非\
  \ root 用户都可以取消他们提交的任务；root 可以取消任何打印任务。\n\n字体 从故障打印机上移动打印请求 (`lmove`)\n如果打印机出现故障，系统管理员（root）可以使用\
  \ `lmove` 命令将该打印机的部分或全部待处理打印请求移动到另一个打印机。\n要将一个或多个特定的打印任务移动到另一台打印机，root 可以此语法：\n\
  ```\n$ lmove list-of-req-ids new-printer\n```\n要显示指定打印机的所有用户的待处理打印任务请求 ID，root 可以输入此语法：\n\
  ```\n$ lpstat -p printer-name\n```\n\n\n\n\n移动打印作业\n\n要将所有打印作业从损坏的打印机移动到另一台打印机，`root`\
  \ 可以进入语法：\n\n```\nlpmove broken-printer new-printer\n```\n\n这将损坏的打印机移出服务，使其不再接受新的打印作业。\n\
  \n# 如何为打印格式化输出\n\n如果你在针式连续进纸打印机上打印输出，输出最令人不满意的部分将是打印在每页的顶部和底部没有留出任何边距。如果你在激光打印机上打印输出，你会发现所有输出都从最左侧边距开始，并为你留出了装订页面或打三孔的空间。这类问题可以在打印之前通过\
  \ `pr` 命令对输出进行处理来解决。\n\n默认情况下，`pr` 会在每页的顶部和底部添加一个五行的页眉和页脚。页眉包含页码、日期/时间和文件名（如果不是通过管道传递的话）。`pr`\
  \ 命令接受命令行上的文件列表。如果没有给出文件列表，你可以将输出通过管道传给 `pr`。然后，你可以直接将 `pr` 的输出重定向到打印机，如下两个示例所示：\n\
  \n```\npr file1 acme* | lp prog2 | pr | lpr -Paccting\n```\n\n使用 `pr` 的主要问题是确定打印机每页的行数。在这里，`pr`\
  \ 假设每页 66 行，这在许多打印打印机上并不适用，会导致页面中间出现分页。要设置每页行数，使用长度选项 `-l`，如下示例所示：\n\n```\npr -l60\
  \ file\n```\n\n由于 `pr` 通常不在每页结束时发送分页符，你必须将长度设置为所需的精确值，否则你会在输出的后续页面中间发现分页。在本章之前，讨论过如何为输出的每行编号。打印带行号的输出将帮助你确定你的打印机要使用的值。至少打印\
  \ 10 页输出以确保你使用的是正确的值。\n\n你可以使用 `-f` 选项告诉 `pr` 在每页结束时发送分页符，如下示例所示：\n\n```\npr -f\
  \ file\n```\n\n如果在非常长的输出的页面上出现分页问题，这种方法会非常有用。如果你在标准尺寸的纸上每页只打印少数行，这种方法会更有效。如果输出是到你的屏幕上（也就是说，如果没有重定向），那么\
  \ `-f` 将导致蜂鸣声并等待你在第一页开头按 `Enter` 键。如果你在终端上运行非常有用，因为你可以调整表单顶部。如果你在进纸式终端上运行，请对 `pr`\
  \ 使用 `-p` 选项，这样它会在每页开始时蜂鸣并等待 `Enter` 键。\n\n要为输出设置左边距，使用 `-o` 选项偏移打印，如下示例所示：\n\n\
  ```\npr -o5 file\n```\n\n在在上述示例中，`pr` 在每行输出的开头打印五个空格。默认（如果没有给出 `-o` 选项）偏移为 0。\n\n\
  要在每页顶部设置自定义标题而不是文件名，请使用 `-h` 选项。要在新页眉中包含空格，请将整个页眉包含在双引号或单引号中。警告：你必须在 `-h` 后面包含空格，否则你的整个输出将是乱码，如下示例所示：\n\
  \n```\npr -h \"    Acme Proposal    \" acmeprop | lp\n```\n\n要使输出双倍行间距，对 `pr` 使用\
  \ `-d` 选项。\n\n要为输出的每行编号，使用 `-n` 选项。在 `-n` 之后跟随一个可选的用于行号的字符数。如果没有给出值，默认为 5 个字符，如下示例所示：\n\
  \n```\npr -n file -n4 file\n```\n\n虽然 `pr` 会为正文中所有的行（甚至是空行）编号，但它不会为每页页眉和页脚中的行编号。行号从\
  \ 1 开始并在整个文档中增加，也就是说，它永远回到 1。\n\n要将输出中的制表符扩展相应数量的空格，使用 `-e` 选项。要将默认的制表设置从八列更改，请在\
  \ `-e` 之后跟随新值，如下示例所示：\n\n```\npr -e file -e8 file\n```\n\n在打印大于八个字符的制表符列时，这非常有用。\n\
  \n然后 `pr` 可以按列显示你的输出，如下示例所示：\n\n```\npr -3 file\n```\n\n在上述示例中，`-3` 告诉 `pr` 将输出跨页面组成三个等大小的列。注意，`pr`\
  \ 不会将普通的行长度输出转换为列。你必须先手动组合你的输出，使没有一行超过列宽（三列为页面的 1/3，四列为页面的 1/4，依此类推）。任何长列宽的文本将被截断——也就是说会丢失。\n\
  \n\n\n\n\n# 第 7 章 复制、移动、重命名或删除文件\n作者 Steve Moritsugu\n\n## 使用相对路径\n\n### 复制文件\n\
  ### 移动文件\n### 重命名文件\n### 删除文件\n### 为同一文件创建多个名称\n\n## 选择目标路径\n\n在本章中，`absolute`（绝对路径）和\
  \ `relative pathnames`（相对路径）的概念非常重要。如果需要的话，你可以在第 2 章“UNIX 目录与路径”中复习它们。该章节还讨论了大多数\
  \ UNIX 系统上的标准目录。在那个讨论中，`/tmp` 被提到作为临时文件的目录。当用户想要创建一些小型临时文件（也称为 `scratch files`）时，这是一个非常适合用户使用的目录。\n\
  \n由于所有用户都可以在 `/tmp` 中创建文件，请为你的文件选择一个不太可能被其他用户使用的名称——例如，将你的登录 ID 作为名称的一部分。我通常会在此类文件中添加\
  \ `junk` 或 `tmp` 单词。每当我以后遇到创建的带有 `junk` 或 `tmp` 字样的文件时，都可以自由地删除它们，而无需花时间去评估它们的内容。\n\
  \n第 2 章还提到了每个用户都有一个家目录（home directory）。某些系统会让一组用户共享同一个家目录，但通常你有一个独有的家目录。因此，这是存储你想要保留一段时间的文件的好地方。\n\
  \n在你的家目录下创建子目录是一个好主意，这样你就可以组织文件。组织文件的传统方法之一是按文件类型或功能。例如，你可以为文本文件创建一个目录，为可执行程序创建另一个目录（可执行文件会被放在\
  \ `bin` 目录中）。拥有一个 `bin` 目录的优势是，你可以将其添加到你的 `PATH` 中，这样无论你当前在哪个目录，都可以轻松执行该目录中的任何程序。\n\
  \n我建议按项目来组织你的家目录。为每个项目创建一个目录，并将与该项目相关的所有文件放入该目录。如果是一个复杂项目，你可以创建子目录。这种组织方式的好处在你需要清理不需要的文件以清理磁盘空间时就会体现出来。许多项目在几个月或一年后就不再需要了。按项目组织让你能够轻松地删除与该项目相关的所有文件。\n\
  \n如果你需要创建任何大文件或创建数千个文件，你应该咨询系统管理员。如果你用尽了文件系统中的磁盘空间或 `inodes`，可能会导致严重问题。`df` 命令可以显示每个文件系统中的可用磁盘空间和可用\
  \ `inodes`。如果你需要大量的磁盘空间，系统管理员可能会在另一个文件系统中为你创建一个供使用的目录。\n\n另：\n- 绝对路径和相对路径，第 42 页\n\
  - 标准目录，第 40 页\n- 家目录，第 44 页\n\n## 处理权限拒绝（Permission-Denied）错误\n\n要在目录内创建文件和子目录，你需要该目录的写入权限。如果你创建了该目录，你通常拥有该目录的写入权限。如果该目录属于别人，你可能需要请求他/她开放该目录的写入权限。他/她可能不愿意对所有人开放写入权限。传统的\
  \ UNIX 方法为需要共享文件和目录的用户创建一个新组，将这些文件和目录分配给该组，并允许组员拥有写入权限但不允许所有人。然后你必须请求 `root`（系统管理员）将你加入该组。\n\
  \n另：\n- 权限，第 273 页\n\n### 在当前目录内复制、移动或重命名 (*cp,mv*)\n\n\n\n\n要重命名文件，我们使用 UNIX 的\
  \ `mv` 命令将其移动到新名称。这不会发生实际的数据传输（除非我们将其移动到不同的文件系统）。如果我们复制文件，则会创建一个不同名称的新文件，并将源文件的所有内容复制到新文件中。\n\
  \n### 如何在目录内复制/移动/重命名文件\n\n1.  确保你处于目标目录。如果你不确定当前在哪个目录，可以使用此命令显示当前目录：\n```bash\n\
  pwd\n```\n\n2.  在 shell 提示符下，如果你想移动（即重命名）文件，请输入以下内容：\n```bash\nmv\n```\n如果你想复制文件，请输入此：\n\
  ```bash\ncp\n```\n在接到指示之前，不要按回车键。注意，该命令只有两个字母，而不是整个单词。\n\n3.  输入一个空格，然后输入 `-i`。这是现代\
  \ UNIX 系统上一个实用的选项，但在旧的 UNIX 系统中不可用。如果你准备覆盖一个现有文件，它将发出警告。\n\n4.  某些 UNIX 系统（如 Solaris\
  \ 或 Linux）允许为 `cp` 命令使用 `-p` 选项，这可以在复制时保留文件的所有者、组和权限。（你可以在你系统的 `cp` 手页中检查此。）如果你以\
  \ root（系统管理员）身份运行，此选项效果最好。如果你要在 `cp` 中包含此选项，请输入空格然后输入 `-p`。\n\n5.  输入一个空格，然后输入要移动或复制的现有文件名。输入\
  \ `basename`，因为它位于当前目录下。此文件必须已经存在，因此有时被称为现有文件或源文件。\n\n6.  输入一个空格，然后输入要创建的新文件名。这被称为目标文件。以\
  \ `basename` 输入此目标文件。此 `basename` 不能与当前目录中的任何其他文件或子目录匹配。你的新文件名可以开头并包含任何大小写字母、数字、下划线（`_`）、横线（`-`）或点（`.`）。旧的\
  \ UNIX 系统限制为 14 个字符，但现代 UNIX 系统允许 `basename` 超过 100 个字符（但请不要取得那么长）。除非你想让它成为隐藏文件，否则不要以点开头你的新文件名，让它与你的普通文件分开。\n\
  \n7.  按回车键执行你的命令。\n\n8.  如果你收到 Usage 错误并提示 `-i` 不是有效选项，说明你的 UNIX 系统不支持该选项。请不要带上\
  \ `-i` 选项重新输入整个命令。如果 `-i` 选项在你的系统上不起，你必须在执行任何 `mv` 或 `cp` 命令之前手动检查目标是否存在。\n\n9.\
  \  如果你收到 Permission Denied（拒绝访问）类型的错误，要么是你没有权限读取源文件，要么是你没有权限向目录写入并在那里创建新文件。请参见上一节关于处理拒绝访问错误的说明。\n\
  \n10. 如果你收到此消息：`overwrite dest-file?`，`-i` 选项正在提醒你所选择的目标文件已存在。你现在可以选择输入 `y` 并覆盖文件，或输入\
  \ `n` 取消复制或移动。如果你不确定，输入 `n` 然后显示目标文件的内容（参见上一章）以查看你是否需要保留它。\n\n11. 没有消息就是好消息。如果没有生成任何消息并且直接返回到\
  \ shell 提示符，说明你的复制或移动成功了。\n\n### 复制、移动或重命名到不同的目录\n\n本节假设你已经阅读了之前关于执行复制操作的章节。本节讨论了当源文件和目标文件位于不同目录时如何使用复制或移动。\n\
  \n-i 选项和自动大灯\n\n在 C shell 和 Korn shell 下，可以为你的登录 ID 设置别名（alias），这样 `-i` 选项就会自动添加到你输入的任何\
  \ `cp` 和 `mv` 命令中。我个人没有这样做，原因和我不不喜欢自动关闭的车灯的原因相同——它会养成你驾驶其他汽车、在其他登录名下或在其他 UNIX 系统上工作的坏习惯。\n\
  \n选项 #1 是对复制或移动的源和目标都使用绝对路径。这样无论你当前目录在哪里都不重要。这种方法的缺点是需要输入大量内容，因此很少被使用。\n\n\n\n\n\
  # 为两个目录设置 Shell 变量\n\n选项 #2 是执行命令时处于源目录中（这意味着它是是当前工作目录）。此时你可以使用基名（basename）来指定源文件。你必须使用绝对路径或相对路径来指定目标文件。当你需要在源目录中执行后续命令时，此选项非常有用。\n\
  \n选项 #3 是处于目标目录中，使用绝对路径或相对路径指定源文件，并使用基名（basename）指定目标文件。当你需要在目标目录中执行后续命令时，此选项非常有用。\n\
  \n选项 #4 是处于某个可以方便访问源目录和目标目录的附近目录。例如考虑此拷贝命令：\n\n```bash\ncp -i /usr/fred/reports/acme/report7\
  \ /usr/fred/reports/98Jan/report7\n```\n\n注意，`/usr/fred/reports` 是源目录和目标目录共有的，因此你可以待在那里，并使用此处所示的方便相对路径访问文件：\n\
  \n```bash\ncd /usr/fred/reports\ncp acme/report7 98Jan/report7\n```\n\n选项 #5 是当你需要像下文那样在同一个两个目录之间拷贝多个不同文件时，使用你自己的\
  \ Shell 变量。\n\n## 步骤\n\n1. `cd` 进入源目录。\n2. 输入：`SD=`pwd``。在前面的命令中，你获取 `pwd` 报告的当前目录，并使用反引号将该目录名称保存到变量\
  \ `SD` 中。你可以选择自己的变量名。我选择大写的 `SD` 代表源目录，以免与通常小写的 UNIX 命令混淆。\n3. `cd` 进入目标目录。\n4.\
  \ 输入：`DD=`pwd``。\n5. 现在在两个目录之间拷贝或移动文件变得简单。`SD` 和 `DD` 包含绝对路径，因此当前目录是什么并不重要。要从源目录拷贝文件到目标目录，输入以下命令：\n\
  \n```bash\ncp -i $SD/filename $DD/.\n```\n\n注意，如果目标文件名与源文件名相同，则不需要指定目标文件名。注意下文所述，我在目录名称后面添加了斜杠点（`.`）。有关变量的更多信息，请参见第\
  \ 30 页\n\n## 确定文件的去向 (cp, mv)\n\n并不总是容易预测 `cp` 或 `mv` 将创建哪个目标文件。这是因为结果取决于目标是否已存在的目录。例如：\n\
  \n```bash\nmv /usr/jane/acme /usr/fred/reports\n```\n\n如果 `reports`（在 `/usr/fred`\
  \ 中）是一个目录，`mv`（或 `cp`）将把源文件 `acme` 移动（或拷贝）到 `reports` 目录中。因此，结果文件名将为：`/usr/fred/reports/acme`。\n\
  \n注意，在这种情况下，源目录 `/usr/jane` 仅告诉我们去哪里寻找源基名。被移动或拷贝的只是源基名。源目录中的任何目录都不会被带走。\n\n如果指定的路径\
  \ `/usr/fred/reports` 不存在，`mv`（或 `cp`）将创建它并将 `acme` 的内容放入其中。因此，结果将是一个名为 `/usr/fred/reports`\
  \ 的普通文件。\n\n如果 `reports` 在 `/usr/fred` 中作为一个普通文件存在，我们将得到相同的结果。旧的 `reports` 文件将丢失，文件\
  \ `acme` 的内容将放在它的位置。不会有关于 `reports` 旧内容被覆盖的警告，因为在这个示例中我们没有使用 `-i` 选项。每当你将文件拷贝或移动到目录时，我建议在目录名称后加上斜杠点（`.`）。例如：\n\
  \n```bash\nmv acme /usr/fred/reports/\n```\n\n斜杠点（`.`）告诉系统我预期 `/usr/fred/reports`\
  \ 是一个目录，并将 `acme` 文件移动到该目录。如果 `reports` 不是已存在的目录，命令将失败并显示错误信息，我会收到出问题的提示。如果 `reports`\
  \ 恰好是一个已存在的文件，在前面的命令中添加斜杠点（`.`）可以防止覆盖 `reports` 文件并丢失其数据。\n\n\n\n\n我不建议仅仅添加斜杠（`/`），因为这在许多\
  \ UNIX 系统上是非合法的语法。\n\n以下是一个示例，使用斜杠点（`/..`）可以防止数据丢失：\n\n```\nmv file1 /usr/fred/reports\n\
  mv file2 /usr/fred/reports\nmv acme /usr/fred/reports\n```\n\n在上述述示例中，用户预期 `/usr/fred/reports`\
  \ 是一个存在的目录；然而，事实并非如此。因此，第一条命令在 `/usr/fred` 中创建了一个名为 `reports` 的普通文件，其中包含了 `file1`\
  \ 的所有数据。第二条命令用 `file2` 的内容覆盖了 `reports` 文件。`file1` 的内容现在已完全从系统中消失且无法找回。（注意，在这里使用\
  \ `-i` 选项会提供一个救命的警告。）第三条命令将再次覆盖 `reports`，因此 `file2` 的内容也将丢失且无法找回。以下是我推荐的相同操作序列：\n\
  \n```bash\nmv -i file1 /usr/fred/reports/.\nmv -i file2 /usr/fred/reports/.\nmv\
  \ -i acme /usr/fred/reports/.\n```\n\n如果 `/usr/fred/reports` 不是一个目录，第一条命令将报错并失败。在目标目录后添加斜杠点（`/.`）也更容易理解\
  \ `mv` 或 `cp` 的预期结果。这对于编写操作说明以及我们在 shell 脚本中插入命令时（将在稍后的章节中介绍）都是如此。\n\n### 将文件列表复制/移动到目录\
  \ (cp, mv)\n\n如果 `cp` 或 `mv` 的目标是一个目录，则源可以包含一个或多个普通文件；即文件列表。例如：\n\n```bash\ncp -i\
  \ file1 file2 file3 /data/acme/.\n```\n\n在例例中，`file1`、`file2` 和 `file3` 将复制到 `/data/acme`\
  \ 目录。如果有两个或多个源文件，目标必须是一个目录；否则你将得到错误。在随后的章节中，你将看到可以使用文件名通配符创建文件列表，这些列表可以用于 `cp` 和\
  \ `mv`。例如：\n\n```bash\ncp -i acme /usr/fred/ac/.\n```\n\n另参：文件名通配符，见第 232 页\n\n\
  ### 处理确认请求\n\n如果 `mv` 或 `rm` 正准备覆盖或删除一个已存在的文件，这些命令将检查你是否有权限写入该文件。如果没有，它将像如下所示请求确认：\n\
  \n```\nmv: dest-file: override protection 400 (yes/no)?\n```\n\n在某些系统上，确认信息非常简短。例如：\n\
  \n```\n400?\n```\n\n对于此确认信息，`mv` 正准备覆盖另一个用户的文件，且该用户没有给你写入或修改此文件的权限。然而，你对该目录拥有管理员权限，因此你可以覆盖权限。该文件的三个权限数字为\
  \ XXX（上例中为 `400`）。你是否仍然想覆盖此文件？请输入 `y` 表示是，或输入 `n` 表示否。\n\n### 移动/重命名目录 (mv)\n\n\
  你可以使用 `mv` 命令移动或重命名目录。通过这种方式，可以将目录从 UNIX 目录结构中移除，并重新连接到树的不同部分。该目录的所有子目录将随之移动。假设该文件存在于系统中：`/usr/fred/reports/compsys/pegasus`。\n\
  \n注意 `pegasus` 位于 `compsys` 目录。现在假设我们执行这条命令：\n\n```bash\nmv /usr/fred/reports/compsys\
  \ /usr/fred\n```\n\n对于 `mv` 和 `cp`，如果指定的目标是一个已存在的目录，目标将在该目录下创建。在本例中，我们知道 `/usr/fred`\
  \ 是一个目录。根据本章前面的部分，我们知道 `mv`（以及 `cp`）只取源文件名并将其放入现有的目标目录。因此，`compsys` 的新绝对路径如下：`/usr/fred/compsys`。\n\
  \n`pegasus` 文件的新绝对路径将是：`/usr/fred/compsys/pegasus`。\n\n在示例中，`mv` 命令从 UNIX 目录树结构中移除了目录\
  \ `compsys` 及其所有文件和子目录，并将 `compsys` 及其所有文件和子目录重新连接到了新位置。\n\n\n\n\n旧版本的 UNIX 如果你尝试将目录移动到不同的文件系统，它会报错并终止。许多现代\
  \ UNIX 系统可以毫无问题地完成此操作。\n\n## 复制整个目录子树 (`cpio`)\n\n有时，你可能想要将一个目录及其所有的子目录和文件复制到目标目录。某些\
  \ UNIX 系统提供了一个 `copy` 命令（拼写为 `copy`），如果你使用 `-r` 选项就可以实现此操作，该选项意味着*递归地*复制子目录；即：无论嵌套多少层，都复制所有的子目录。其他\
  \ UNIX 系统可能为 `cp` 提供 `-r` 选项以允许对目录进行递归。然而，某些 UNIX 系统（尤其是较旧的）并不提供任何递归复制或 `cp` 选项。\n\
  \n有一种使用 `cpio` 命令递归复制目录子树的方法，它在旧版 UNIX 系统和新系统上都适用。你只需要为所有系统学习一种技术，而且它比其他方法更具灵活性。\n\
  \n### 复制整个目录子树\n\n1. 如果源目录包含多个用户拥的文件，且你希望目标目录能够准确镜像源目录的所有权和权限，则你必须以 `root` 身份登录以执行此操作。\n\
  2. 确定源目录的精确绝对路径。源目录的每个文件和子目录都将被复制到目标目录。\n3. 确定目标目录的精确绝对路径。目标目录将为源目录（及其子目录）的每个子目录和文件创建一个副本。\n\
  4. `cd` 进入源目录。\n5. 输入 `pwd` 确保你正处于源目录。\n6. 输入：\n```\nfind . -print | cpio -pvum\
  \ dest-dir\n```\n将 `dest-dir` 替换为目标目录。你可以使用绝对路径或相对路径表示 `dest-dir`。当你运行此命令时，`cpio`\
  \ 会在复制整个目录时显示每一个文件名。\n7. 在步骤 6 中，以下 `cpio` 选项是可选的，可以根据需要添加或省略一个或多个：\n    - `-a`:\
  \ 将每个文件的最后访问日期/时间重置为 `cpio` 访问该文件之前。如果包含了 `-m` 选项，则无法使用此选项。\n    - `-d`:根据需要创建目标目录。\n\
  \    - `-L`:跟随软链接（见下一节），以便复制所指向的文件而非指针文件。\n    - `-m`: 保持每个目标文件的最后修改日期/时间与源目录相同。如果包含了\
  \ `-a` 选项，则无法使用此选项。\n    - `-u`: 无条件覆盖任何现的目标文件，否则较旧的文件不会覆盖较新的文件。\n    - `-v`: 详细输出，在复制每个文件时列出它。\n\
  \n关于 `cpio` 的更多信息，请参阅第 355 页。`tar` 也可以复制目录树。我之所以讨论如何使用 `cpio` 复制目录树，是因为旧版本的 `tar`\
  \ 无法恢复空目录或设备文件，无法保留目录的所有者、组或权限。如果你使用 `cpio`，就不需要担心这些旧版 `tar` 的局限性。\n\n## 删除文件 (`rm`)\n\
  \n在许多情况下你必须删除文件和目录，根据文件所在的位置，你采取的每种操作都有特殊的注意事项。UNIX 有许多用于这些过程的命令和选项。以下章节将详细介绍可用的命令和选项。\n\
  \n### 删除当前目录下的文件 (`rm`)\n\n#### 如何删除当前目录下的文件\n\n1. 确保你处于目标目录中。如果你不知道当前在哪个目录，请使用此命令显示当前目录：\n\
  ```\npwd\n```\n\n\n\n\n## 使用 rm 命令\n\n2. 在 shell 提示符下，输入：\n```\nrm\n```\n在接到指示之前，不要按回车键。要删除文件，我们使用\
  \ `remove` 命令。注意，该命令只有两个字母，而不是整个单词。\n\n3. 之前我们讨论过 `rm` 和 `mv` 的确认请求。如果你想在删除你没有权限修改的其他用户的文件时，防止出现确认请求，请输入一个空格，然后输入以下内容：\n\
  ```\nrm -f\n```\n这个强制删除或替换的选项当你确定要删除某组确定的文件时非常有用。\n\n4. 如果你正在删除一组文件，可以通过输入一个空格然后输入以下内容，让\
  \ `rm` 对其中的每一个文件都请求确认：\n```\nrm -i\n```\n这个交互式选项在你使用通配符模式指定要删除的文件列表时非常有用，可以确保你不会删除比预预期更多的文件。\n\
  \n5. 输入一个空格，然后输入一个或多个要删除的文件名，并用空格分隔。每个文件名都作为基名（basename）输入，因为它们位于当前目录下。\n\n6. 请仔细检查你的命令，因为如果你操作错误，并没有\
  \ `undelete` 命令可以使用。按回车键执行你的命令。\n\n7. 没有消息就是好消息。如果没有生成任何消息并直接返回到 shell，说明你的删除操作成功了。\n\
  \n### 在不同目录中删除文件\n单个 `rm` 命令可以删除多个目录中的文件。在 `rm` 命令的文件列表中，只需包含目标文件或文件的绝对路径或相对路径即可。请复习本章中关于如何构建路径的上一一节。\n\
  \n### 删除文件列表\n`rm` 命令允许指定文件列表。该列表可以通过文件名通配符生成（见第 9 章）。例如：\n```\nrm acme/*\n```\n\
  \n### 删除整个目录子树\n要删除一个目录，它必须是完全空的，除了点 (`.`) 和双点 (`..`) 条目外。的。如果你确定要删除一个目录及其所有的文件、子目录，以及它们所有的子目录，可以通过一个简单的命令来实现。在使用此命令时必须非常小心，因为如果操作错误，没有办法将文件找回来。删除整个目录及其内容的步骤在第\
  \ 7 章（关于目录）和路径部分已介绍过。\n\n### 另需参考\n有关删除整个目录树的更多信息，请参见第 53 页\n\n### 为同一文件创建多个名称 (ln)\n\
  目录是一种具有两个的文件：\n1. 跟踪该目录中包含的文件名和子目录。\n2. 跟踪这些文件名中每个对应的 inode 号。\n\n当你在 UNIX 下访问一个文件名时，系统会根据该文件名的目录条目确定使用哪个\
  \ inode 条目。UNIX 允许多个文件名引用给定的 inode 号，这在实际上允许同一个文件拥有多个名称。由于文件名不是 inode 信息的一部分，因此一个文件的每个名称都是同等有效的。哪个名称先出现并不重要。将这些名称视为文件的副本是不正确的，因为只引用了同一个\
  \ inode。这意味着如果你使用一个名称更改了文件，那么当你通过该文件的其他名称访问它时，该更改将是可见的。\n\n当你为同一个文件拥有多个名称时，每个名称被称为指向该文件的硬链接（hard\
  \ link）。在 UNIX 的分级目录系统中，当你想要将同一个文件放在两个不同的目录时，允许一个文件有多个名称或硬链接是有用的。例如，假设我有一个客户目录……\n\
  \n\n\n\n为我的每个客户准备一个文件，其中包含他们的名称、地址、电话号码和交易历史。假设我还有一个供应商目录，用于存储我购买产品的的公司，供应商目录中的每个文件都包含供应商名称、地址、电话号码和交易历史。\n\
  \n现在，假设有些公司从我这里购买物品，因此它们应该在客户目录中；但我也从他们那里购买物品，所以它们应该在供应商目录中。我可以通过创建两个硬链接来解决这个问题。也就是说，我可以在客户目录中创建一个文件，同时将该文件放在供应商目录中。通过使用硬链接，这些文件并不是彼此的副本；它们是同一个文件的两个名称。因此，如果我在客户目录中更新了该公司的电话，该更改将自动反映在供应商目录中的该公司上。\n\
  \n如果有一个大文件，硬链接占用的空间比复制文件要少得多。无论有多少个硬链接，文件只有一份。\n\n### 另另\n\n- 关于 UNIX 目录的更多信息，请参阅第\
  \ 36 页\n- *使用硬链接创建多个名称 (ln)*\n\n### 为现有文件创建硬链接\n\n现在你已经了解了硬链接以及它们的优势，以下是为文件创建额外硬链接（即为访问特定文件创建另一个名称）的步骤。\n\
  \n1. 确保你知道现有文件的完整路径，以及想要赋予该现有文件的新硬链接的名称。现有文件必须是普通文件，不能是目录。硬链接文件名不能已经作为文件、目录、链接等被占用。\n\
  2. 要创建的新硬链接必须与现有文件位于同一个文件系统中。如果你不确定你的文件系统边界在哪里，请输入此命令：\n```bash\ndf\n```\n你可能会看到如下的输出：\n\
  ```\n/          724074 blocks\n/boot      13780 blocks\n/u         601622 blocks\n\
  /data      1776032 blocks\n/u/tmp     42302 blocks\n```\n在上述 `df` 的输出中，左列显示文件系统的目录名称。要确定两个绝对路径是否位于同一个文件系统中，请将路径的开头部分与\
  \ `df` 输出中最长的匹配文件系统目录匹配。如果两个文件匹配到同一行 `df` 输出，则它们在同一个文件系统中。例如，`/u/tmp/reports` 将位于\
  \ `/u/tmp` 文件系统（因为我们取最长匹配项）。`/u/reports/acme` 将位于 `/u` 文件系统。因为它们在不同的文件系统中，它们不能是同一个文件的硬链接。另一个例子是，`/usr/fred/reports`\
  \ 位于 `/` 文件系统。`/acme/Jan23` 也位于 `/` 文件系统。因此，它可以为 `/usr/fred/reports` 创建硬链接。\n3.\
  \ 在 shell 提示符处，输入 `ln`。在接到指示前不要按回车键。\n4. 输入空格，然后输入现有文件的名称。你可以以绝对或相对路径的形式输入。\n5.\
  \ 输入空格，然后输入你想要为现有文件创建的硬链接名称。你可以以绝对或相对路径的形式输入新链接。\n6. 按回车键完成命令。\n\n### 查找文件的所有链接\
  \ (ls)\n\n要确定一个文件有多少个硬链接，请输入以下命令：\n```bash\nls -l filename\n```\n以下是一个示例输出：\n```\n\
  -r-xr-xr-x 3 bin bin 15176 Jul 15 1997 compress\n```\n在权限之后、所有者和组之前，有一个字段称为链接数（link\
  \ count），在前面的示例中数字为 3。这意味着 `compress` 命令（位于 `/bin` 目录）共有三个名称来引用同一个文件。其中一个名称是 `compress`，所以该文件还有两个我们未知的名称。\n\
  \n要确定同一目录下是否对该文件有更多硬链接，请输入以下命令：\n```bash\nls -li sort\n```\n以下是一个示例输出：\n```\n-r-xr-xr-x\
  \ 1 bin bin 10832 Jul 15 1997 col\n-r-xr-xr-x 1 bin bin 6344 Jul 15 col\n```\n\n\
  \n\n\n\n```text\n5529 -r-xr-xr-x  3 bin     bin           15176 Jul 15\n5529 -r-xr-xr-x\
  \  3 bin     bin           15176 Jul 15\n5529 -r-xr-xr-x  3 bin     bin        \
  \   15176 Jul 15\n5530 -r-xr-xr-x  1 bin     bin           30596 Jul 15\n5531 -r-xr-xr-x\
  \  1 bin     bin           39916 Jul 15\n```\n\n`ls` 命令的 `-i` 选项会导致 `ls` 在行开头显示\
  \ inode 编号，这非常适合应用 `sort` 命令，使得以相同 inode 编号开头的行将排列在一起。注意上一个例子，`compress`、`uncompress`\
  \ 和 `zcat` 都具有相同的 inode 编号（`5529`）、相同的权限（`r-xr-xr-x`）、相同的所有者、组、大小（`15176`）以及最后修改日期。因为它们具有相同的\
  \ inode 编号且处于同一个目录下，所以它们是指向同一个文件的硬链接——即同一个文件的不同名称。\n\n如果没有找到所有的硬链接，那么其中某些必须存在于其他目录。要找到所有匹配给定\
  \ inode 编号的文件名，请输入以下命令：\n\n```bash\nfind /STARTDIR -inum INODE -print\n```\n\n将\
  \ `INODE` 替换为你要查询的 inode 编号。将 `/STARTDIR` 替换为从 `df` 命令中获取的文件系统目录（正如你在第 2 步中所看到的）。例如：\n\
  \n```bash\nfind /-inum 1724836-print /usr/fred/acme /usr/jane/acme/project/data/pegasus\n\
  ```\n\n在上述步骤的第 2 步中，你了解了如何确定路径是否在同一个文件系统中。Inode 编号会在其他文件系统中重用用于其他不相关的文件。只有当具有相同\
  \ inode 的文件位于同一个文件系统时，它们才是指向同一个文件的硬链接。利用这一知识可以忽略 `Find` 报告的非正确文件系统中的。\n\n### 另类\n\
  - 有关 `ls` 命令的更多信息，请参阅第 15 页。\n- 有关文件系统的更多信息，请参阅第 72 页。\n\n### 删除硬链接 (`rm`)\n如果一个文件有多个硬链接，它就有多个名称。如果你使用\
  \ `rm` 命令删除这些名称之一，其余名称和文件内容将不受影响，只是文件的总链接计数会减 1。如果你删除一个链接数为 1 的文件名，该 inode 的链接计数将变为\
  \ 0，这意味着没有名称可以访问该文件了。一旦链接计数归零，该文件将从系统中被删除。文件被删除后，无法将其找回。\n\n### 使用软链接/符号链接创建指针 (`ln`)\n\
  还有另一种为同一个文件创建多个名称的方法。你可以为现有文件创建一个软链接，也称为符号链接。与硬链接相比，软链接有两个优势：\n\n1. 你可以为目录软链接。\n\
  2. 你可以为另一个文件系统的文件或目录创建软链接。\n\n软链接是一个小文件，在 `ls -l` 的输出中用箭头 (`->`) 表示。例如：\n\n```text\n\
  ls -l /usr/spool lrwxrwxrwx 1 root root 10 Feb 13 09:19 /usr/spool -> /var/spool\n\
  ```\n\n在上例中，`/usr/spool` 是指向 `/var/spool` 的软链接。SVR 引入的更改之一是将 spool 目录从 `/usr` 移动到\
  \ `/var`。SVR 通常创建 `/usr/spool` 为指向 `/var/spool` 的软链接。这使得用户和程序能够继续访问 `/usr/spool`，软链接会导致他们实际访问\
  \ `/var/spool`。在上例中，注意 `/usr/spool` 是一个大小只有 10 个字符的文件；也就是说它的内容是 `/var/spool`，长度为\
  \ 10 个字符。注意行开头的类型为 `l`，表示软链接。注意所有用户的权限均为 `rwx`。这允许所有用户访问该软链接。然而，读/写/执行权限将由被指向的文件决定。\n\
  \n### 创建软链接/符号链接\n1. 确定所需的软链接以及你希望它指向的文件的绝对路径。在创建链接时，被指向的文件不必存在。被指向的文件可以是目录，且可以位于与软链接不同的文件系统中。软链接文件名不能已已占用。\n\
  2. 在 shell 提示符下，输入 `ln -s`。在接到指示前不要按回键。\n3. 输入一个空格，然后输入被指向文件的完整路径。\n4. 输入一个空格，然后输入要创建的软链接文件名。可以是绝对路径也可以是相对路径。通常首选绝对路径。\n\
  \n\n\n\n5. 按回车键完成您的命令。旧的 UNIX 系统不支持软链接（soft links）。某些 UNIX 系统仅允许 root（系统管理员）创建软链接。\n\
  \n## 确定命令是否遵循软链接\n\n使用硬链接时，文件的每个名称与其他文件的任何名称都没有区别。相反，软链接与它指向的文件完全不同。大多数命令都会遵循软链接，这意味着当你要求它们访问软链接时，它们实际上会访问软链接所指向的文件。\n\
  \n### 避免将目录链接到自身\n\n像下面的命令可以将目录链接到自身：\n\n```\nln -s dir2 dir2\n```\n\n现代 UNIX 系统上的\
  \ `cd` 命令会检测到此错误并立即报告“Bad Directory”（目录错误）。通常情况下，对被指向的文件使用绝对路径是最安全的。\n\n例如，如果你使用\
  \ `vi` 编辑软链接，它将编辑软链接所指向的文件。如果该文件不存在，你就拥有了一个过期的软链接（stale soft link），一个指向空处的链接。在这种情况下，`vi`\
  \ 会给出“No Such File”（找不到文件）错误，尽管软链接确实存在。\n\n某些 UNIX 命令不会遵循软链接，这意味着它们对软链接本身进行操作。例如，`mv`\
  \ 和 `rm` 不遵循链接，这允许你重命名或删除软链接。请检查各个命令的帮助页（man pages），以查看它们是否遵循软链接并对指向的文件进行操作。\n\n\
  以下是 Solaris 系统上 `rm` 的节录：如果文件是符号链接，将删除链接，但它所指向的文件或目录不会被删除。用户删除符号链接不需要写入权限，只要他们在该目录下具有写入权限。前面的节录告诉我们\
  \ `rm` 不遵循链接。它对软链接本身进行操作。\n\n以下是 Solaris 系统上 `ls` 的节录：-L 如果参数是符号链接，则列出链接引用的文件或目录而不是链接本身。这个节录告诉我们\
  \ `ls` 通常不遵循链接。它提供关于软链接的信息。如果我们为 `ls` 添加 `-L` 选项，它将遵循链接并显示指向的文件。\n\n以下是 Solaris\
  \ 系统上 `file` 的节录：如果文件是符号链接，默认会遵循该链接并对符号链接指向的文件进行测试。\n\n有关 `man` 命令的更多信息，请参阅第 89\
  \ 页。\n\n## 第 8 章 修改、合并和分割文件\n作者：Steve Moritsugu\n\n- 对文件、多个文件或管道中的行进行排序\n- 显示文件或管道的第一行或最后一行\n\
  - 加密文件以便只有你才可以解密\n- 压缩/解压缩文件\n- 将二进制文件转换为简单文本格式\n- 对一组文件进行排序\n- 连续连接文件\n- 粘贴文件使对应行并排显示\n\
  \n\n\n`sort` 将所有指定的文件合并到其工作区，对工作区进行排序，然后将结果显示在标准输出（除非你将输出重定向到文件或将其传递给另一个命令）。\n\n\
  `sort` 命令也可以作为典型的 UNIX 过滤器在管道中使用，如下所示：\n\n```bash\nls acme* *.c | sort | uniq\n\
  ```\n\n在 във述示例中，`sort` 从标准输入读取由 `ls` 命令生成的行。然后，`sort` 将这些行按字母顺序排列，并将它们传递给标准输出。在\
  \ във述示例中，来自 `sort` 的标准输出被传递给 `uniq` 命令，以删除任何重复行。\n\n如果你在 `sort` 命令之后指定了任何文件名，它将从这些文件获取输入，而不是从标准输入获取。以下是\
  \ `sort` 的错误用法：\n\n```bash\nls acme* *.c | sort acme* | uniq # incorrect sort usage\n\
  ```\n\n上述示例是错误的，因为在 `sort` 命令之后指定了一个或多个文件名，因此 `sort` 将不会从标准输入读取，并且会忽略由 `ls` 命令生成的输出。\n\
  \n### 另请\n\n- 有更多关于管道（piping）的信息，请参阅第 31 页。\n- 有更多关于文件名生成通配符（Filename Generation\
  \ Wildcards）的信息，请参阅第 232 页。\n\n### 为什么 UNIX 命令内置排序或分页选项？\n\n如果用户希望从任何 UNIX 命令获得排序输出、分页输出或一次一页的排序输出，用户只需管道到\
  \ `sort` 或管道到 `pg`，或者先管道到 `sort` 再管道到 `pg`。通过这种方式，UNIX 工具更加高效。\n\n### 确定行的排序方式 (ASCII)\n\
  \n`sort` 根据行内字符的 ASCII 值排列行。你通常可以通过输入此命令查询 ASCII 序列：\n\n```bash\nman ascii\n```\n\
  \n以下是 Solaris 系统的示例输出：\n\n| 000 | NUL | 001 | SOH | 002 | STX | 003 | ETX | 004\
  \ | EOT | 005 | ENQ | 006 | ACK | 007 | BEL |\n| 010 | BS | 011 | HT | 012 | NL\
  \ | 013 | VT | 014 | NP | 015 | CR | 016 | SO | 017 | SI |\n| 020 | DLE | 021 |\
  \ DC1 | 022 | DC2 | 023 | DC3 | 024 | DC4 | 025 | NAK | 026 | SYN | 027 | ETB |\n\
  | 030 | CAN | 031 | EM | 032 | SUB | 033 | ESC | 034 | FS | 035 | GS | 036 | RS\
  \ | 037 | US |\n| 040 | SP | 041 | ! | 042 | \" | 043 | # | 044 | $ | 045 | % |\
  \ 046 | & | 047 | ' |\n| 050 | ( | 051 | ) | 052 | * | 053 | + | 054 | , | 055 |\
  \ - | 056 | . |\n| 057 | / | 060 | 0 | 061 | 1 | 062 | 2 | 063 | 3 | 064 | 4 | 065\
  \ | 5 | 066 | 6 |\n| 067 | 7 | 070 | 8 | 071 | 9 | 072 | : | 073 | ; | 074 | < |\
  \ 075 | = | 076 | > |\n| 077 | ? |\n| 100 | @ | 101 | A | 102 | B | 103 | C | 104\
  \ | D | 105 | E | 106 | F |\n| 107 | G | 110 | H | 111 | I | 112 | J | 113 | K |\
  \ 114 | L | 115 | M |\n| 116 | N | 117 | O | 120 | P | 121 | Q | 122 | R | 123 |\
  \ S | 124 | T | 125 | U |\n| 126 | V | 127 | W | 130 | X | 131 | Y | 132 | Z | 133\
  \ | [ | 134 | \\ | 135 | ] |\n| 136 | ^ | 137 | _ | 140 | ' | 141 | a | 142 | b\
  \ | 143 | c | 144 | d | 145 | e |\n| 146 | f | 147 | g | 150 | h | 151 | i | 152\
  \ | j | 153 | k | 154 | l | 155 | m |\n| 156 | n | 157 | o | 120 | p | 121 | q |\
  \ 122 | r | 123 | s | 124 | t | 125 | u |\n| 126 | v | 127 | w | 130 | x | 131 |\
  \ y | 132 | z | 133 | { | 134 | | | 135 | } |\n| 176 | ~ |\n| 177 | DEL |\n\n\n\n\
  \n有时你会发现标题以感叹号（`!`）开头，这样即使对输出结果进行排序，它们仍然位于输出的开头。\n\n字符排序的顺序被称为*排序序*（collation sequence）。尽管\
  \ `ASCII` 是美国标准的排序顺序，但其他国家有时会有特殊的键盘和字母表。因此，你可能会遇到不同的排序序。\n\n### 另参\n\n有关帮助页（man\
  \ pages）的更多信息，请参第 90 页。\n\n### 排序时忽略开头空格 (sort -b)\n\n如果行以相同的字符开头，它们的顺序将由行第一个不同的字符决定。例如，开头有许多空格的长行将排在开头较少或没有空格的长之前，因为根据\
  \ ASCII 表，空格的排序顺序在任何非空格字符之前。例如：\n\n```bash\n$ sort tstfile      zebra\n    monkey\n\
  \  apple\n```\n\n要在排序时忽略行开头的空格，请使用 `-b` 选项，如下：\n\n```bash\n$ sort -b tstfile   apple\n\
  \    monkey\n      zebra\n```\n\n### 按数值大小排序 (sort -n)\n\n这种从左到右的原则也适用于以数字开头的行。例如：\n\
  \n```text\n|\n|\n```\n```bash\n$ sort numfile 10oranges\n5apples\n66grapes\n```\n\
  \n前面的行之所以被排序，是因为 1 在 5 之前。若要根据行首数字的数值大小对行进行排序，请使用下所示的 `-n` 选项：\n\n```bash\n$ sort\
  \ -n numfile 5apples\n10oranges\n66grapes\n```\n\n`-n` 选项也能处理负数和分数。例如：\n\n```bash\n\
  $ sort -n numfile3 -30bananas\n-2pineapples\n5.44apples\n5.5apples\n10oranges\n\
  66grapes\n```\n\n在下一个示例中，数字是右对齐的，这意味着数字可能从不同的列开始，但它们结束于同一列。\n\n```bash\n$ cat numfile2\
  \    5pencils\n   2032crayons\n   153erasers\n```\n\n在上述情况下，以及每当你有以右对齐数字头的行时，都不需要\
  \ `-n`，因为普通排序将按数值大小排列它们，如下：\n\n```bash\n$ sort numfile2    5pencils\n   153erasers\n\
  \   2032crayons\n```\n\n使用 `-n` 选项时，它会忽略行开头所有的空格，就像同时也提供了 `-b` 选项一样。如果任何行不以数字开头，`-n`\
  \ 将这些行视为零值，并将它们排在以数字开头的行之前。\n\n### 将结果保存回原始文件\n\n`sort` 将排序后的行输出到标准输出。这意味着输出将显示在你的屏幕上，原始文件不会受到影响。要将结果保存到文件中，你可以将标准输出重定向到不同的文件，如下：\n\
  \n```bash\nsort file1 > file2\n```\n\n在上述命令中，排序后的输出将放入 `file2` 而不会显示在你的屏幕上。如果你想修改一个文件使其所有行都处于排序状态，请使用临时文件，如下：\n\
  \n```bash\nsort acme > tmpfile$$ && mv tmpfile$$ acme\n```\n\n在第一行中，我将排序输出保存到名为\
  \ `tmpfile$$` 的临时文件中。`$$` 是一个特殊的 shell 变量，可以提供我的进程号。我在 `tmpfile` 名称中添加 `$$` 是为了使其唯一，即：避免在我在使用该文件名时，其他用户可能也在使用\
  \ `tmpfile` 名称。第二行使用 `mv` 删除旧的未排序的 `acme` 文件，并将其替换为排序后的 `acme` 文件。\n\n注意，你不能在管道中将同一个文件既作为输入文件又作为输出文件。例如：\n\
  \n```bash\nsort acme > acme # 这是错误的\n```\n\n上述命令会失败，因为 shell 会首先设置重定向指向一个空的 `acme`\
  \ 文件。然后 shell 将启动 sort 进程，该进程会发现 `acme` 是空的，从而产生一个空的输出文件。`acme` 的内容现在丢失且无法恢复。\n\n\
  ### 合并忽略大小写排序 (sort -f)\n\n\n\n\n在 ASCII 序列中，所有以大写字母开头的行都会在任何以小写字母开头的行之前排序。要忽略大小写进行排序，请为\
  \ `sort` 添加 `-f` 选项。这被称为将大写和小写字母合并。例如：\n\n```bash\n$ sort tstfile APPLE\nAPPLE\n\
  Orange\nbanana\ngrape\n\n$ sort -f tstfile\nAPPLE\nbanana\ngrape\nOrange\n```\n\n\
  ### 忽略排序结果 -o 选项\n`sort` 命令实际上有一个 `-o` 选项，它允许你仅使用一个命令将排序后的结果保存到原始文件上。其他 UNIX 命令没有此选项，因此我向你展示了一种保存排序结果的方法，该方法适用于任何向标准输出写入内容的\
  \ UNIX 命令。\n\n```bash\n$ ls -s total\n660\n15 acme\n625 pegasus\n20 report7\n```\n\
  \n### 反逆排序 (sort -r)\n要按反序对行进行排序，请为 `sort` 添加 `-r` 选项。这与 `-n` 选项配合使用时特别有用，当你想先看到最大值时。例如，`ls\
  \ -s` 将列出当前目录下的文件，并以文件块大小在前面。（你可以查看附录中的 `ls` 命令。）\n\n```bash\n$ ls -s total\n660\n\
  15 acme\n625 pegasus\n20 report7\n```\n\n当文件很多时，很难在视觉上识别出大文件。我们可以将输出通过给 `sort`，让\
  \ `sort` 按从大到小排列文件。\n\n```bash\n$ ls -s | sort -rn\n```\n在此示例中，请注意我们是如何结合 `-r` 和\
  \ `-n` 选项的。实际上，排序的 `-n` 选项并不是真正需要的，因为数字是右对齐的。注意 `total` 行出现在了最后。因为它不是以数字开头的，`-n`\
  \ 将其视为零值。在上一个示例中，为什么 `total` 行中的 `660` 出现在最后？答案是：`-n` 在寻找行首的数字（任何前导空格之后）。任何以非字母开头的行（如\
  \ `total` 行）都被视为具有零值。\n\n### 排序时忽略标点符号 (sort -d)\n如你所见，标点符号遍布于整个 ASCII 表格，因此会影响以标点符号开头的行的排序顺序，如下：\n\
  \n```bash\n$ sort tstfile \"orange\"\n'grape'\n<apple>\nmelon\n{banana}\n```\n\n\
  要忽略标点符号并仅对字母、数字、空格和制表符进行排序，请使用 `-d` 选项按字典顺序排序如下：\n\n```bash\n$ sort -d tstfile <apple>\n\
  {banana}\n'grape'\nmelon\n\"orange\"\n```\n\n排序选项 `-d` 不能与 `-n` 选项结合，因此如果行以标点符号开头，仅使用\
  \ `sort` 选项无法按大小对数字排序。\n\n### 根据行内的字段排序 (sort +n)\n`sort` 命令将任何空格或制表符序列视为新字段。例如，在\
  \ `ls -l` 最后一行的每一列下方，我标注了它所在的字段编号。假设我们想按第 5 字段（字节大小）对此输出进行排序。\n\n```bash\n$ ls -l\
  \ total\n-rw-r-- 1 mori users 17157 Feb 11:31 acme\n-rw-r-- 1 janepf accounting\
  \ 1972 Feb 11:31\n-rw-r-- 1 mori users 196484 Feb 11:33\n```\n\n注意字段 4 和字段 5 在每行的起始列位置不同。要让\
  \ `sort` 忽略或跳过行中的某些字段，请使用 `+n` 选项（其中 `n` 是跳过的字段数）。\n\n```bash\n$ ls -l | sort +4\
  \ # 这不是我们想要的 total\n-rw-r-- 1 mori users 17157 Feb 11:31 acme\n-rw-r-- 1 mori users\
  \ 196484 Feb 11:33\n-rw-r-- 1 janepf accounting 1972 Feb 11:31\n```\n\n在之前的示例中，`sort\
  \ +4` 表示跳过 4 个字段并从第 5 字段开始排序，该字段文件的字节大小。然而，第 5 字段从该字段的前导空格开始。当你跳过前 4 个字段时，剩余行的排序如下：\n\
  \n```\n   17157 Feb 1 11:31 acme\n196484 Feb 1 11:33\n1972 Feb 1 11:31\n```\n\n\
  注意，当你跳过前 4 个字段时，数字并不是右对齐的。因为我们想按大小排序行，且第 5 字段没有右对齐，我们将添加 `-n` 选项来获取我们想要的输出：\n\n\
  ```bash\n$ ls -l | sort -n +4 total\n-rw-r-- 1 janepf accounting 1972 Feb 11:31\n\
  ```\n\n\n\n\n\n```\n-rw-r--r--  1 mori      users       17157 Feb  1 11:31 acme\n\
  -rw-r--r--  1 mori      users       196484 Feb  1 11:33\n```\n\n![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)\n\
  report07\n\n当使用 `+n` 选项跳过字段排序时，字段开头的空格数量会影响排序。如果我们想要排序的字段包含数字，使用 `-n` 选项按大小排序，并忽略该字段开头的空格。如果我们想要排序的字段包含文本，使用\
  \ `-b` 选项排序以忽略该字段开头的空格。如果我们想要排序的字段包含开头空格，且文本有需要忽略的开头标点，则使用 `-bd` 同时忽略开头空格和开头标点，如下所示：\n\
  \n```bash\nsort -bd +3 report8\n```\n\n### 基于主键和次键的排序 (`sort +m -n`)\n\n假设我们有一个朋友文件，列出了几个朋友的名字、中间名首字母、姓氏和城市。注意按姓氏排序时会发生什么：\n\
  \n```bash\nsort +2 friends     # 这不是我们想要的\nWilliam A.  Smith, St. Louis\nJames B.\
  \ Nguyen, Los Angeles\nHenry H. Nguyen, Yuba City\nMary K. Zornan, Cleveland\nMary\
  \ A. Zornan, Pittsburgh\n```\n\n注意到 Smith 排在最前面，是因为该条目中 Smith 之前恰好有两个空格，而“空格-空格”在“空格-字母”之前，就像\
  \ `aa` 在 `ab` 之前一样。我们可以通过添加 `-b` 选项来忽略开头空格，如下：\n\n```bash\nsort -b +2 friends  \
  \   # 这更接近我们的想要\nJames B. Nguyen, Los Angeles\nHenry H. Nguyen, Yuba City\nWilliam\
  \ A.  Smith, St. Louis\nMary K. Zornan, Cleveland\nMary A. Zornan, Pittsburgh\n\
  ```\n\n现在注意到两个 Nguyen 条目是按城市排序的。这是可以理解的，因为我们跳过了前两个字段并对行的剩余部分进行了排序。如果我们想先按姓氏排序，如果姓氏相同，再按名字排序呢？我们将此过程称为使用主排序键和次排序键。在这个例子中，姓氏为主排序键。名字和中间名首字母是次排序键，当两行具有相同的主排序键时使用它。你甚至可以指定使用更多级别的排序键，前提是所有更高层级的排序键都相同。你可以指定忽略主键中的开头空格但不忽略次键中的。你可以指定按正常顺序对主键排序，但如果主键相同，则按反向顺序对次键排序。你可以指定忽略主键或次键的一个或多个字符。你可以按大小对主键排序而按文本对次键排序。\n\
  \n### 使用主字段和次字段\n\n1. 如果你准备将内容传递给 `sort`，请输入生成待排序输出的命令。接着输入管道符号 (`|`)。管道符号 (`|`)\
  \ 周围的空格可选可选。在收到指令前不要按回车键。\n2. 输入 `sort`。在收到指令前不要按回车键。\n3. 如果你想让任何排序选项全局应用于主键、次键和所有排序键，请输入空格，然后输入一个连字符\
  \ (`-`)，紧接着输入此列表中所需的选项：\n   - `b`: 忽略开头空格\n   - `d`: 忽略开头标点（如果未指定 n）\n   - `f`:\
  \ 忽略大小写\n   - `n`: 按大小排序数字并忽略开头空格\n   - `r`: 反反顺序排序\n4. 输入一个空格，然后输入 `+m`。将 `m` 替换为要跳过的字段数量，以到达主排序键的第一个字段。\n\
  5. 如果你想忽略主排序键开头的字符，输入 `.n`。将 `n` 替换为要忽略的起始字符数量。例如，`+3.2` 表示跳过三个字段，然后跳过两个字符，因此我们从第\
  \ 4 个字段的第 3 个字符开始排序；即从字段 `m+1` 开始从第 `n+1` 个字符开始排序。因为对字段的部分进行排序很少见，所以通常省略 `.n`。\n\
  6. 现在你可以输入这些选项之一应用于此排序键：\n   - `b`: 忽略开头空格\n   - `d`: 忽略开头标点（如果未指定 n）\n   - `f`:\
  \ 忽略大小写\n   - `n`: 按大小排序数字并忽略开头空格\n   - `r`: 反向顺序排序\n   例如，`+3.2bfr` 表示该排序键的找到方式是跳过三个字段，然后跳过两个字符并忽略开头空格、忽略大小写，且仅为此排序键按反向顺序排序。\n\
  7. 输入一个空格，然后指定主排序键的结束。使用符号 `-m.nOPTS`，其中：\n   - `m` 是结束字段编号（不是跳过的字段数）\n   - `n`\
  \ 是第 `m` 个字段最后一个字符之后包含的字符数量\n\n\n\n\n\n`OPTS` 可以是第 6 步描述的 `b`、`d`、`f`、`n` 或 `r`，但在实践中只有\
  \ `b` 用于定义排序字段的结束位置。因为很少会在排序字段的中间结束，所以通常会省略 `.nOPTS` `。如果完全省略了 `-m.nOPTS`，则排序键被认为延伸到行尾。\n\
  \n### 8. 由于前面的步骤较为复杂，让我们停下来，总结一下在正常情况下如何指定主排序键：\n\n```\nsort -GGG +xOPTS -y\n```\n\
  \n其中：\n- `GGG` 可以是排序选项 `b`、`d`、`f`、`n` 或 `r`，并将全局应用于主、次要以及所有的排序键。\n- `+x` 表示跳过多少字段以到达主排序键。\n\
  - `OPTS` 可以是排序选项 `b`、`d`、`f`、`n` 或 `r`，并将仅应用于主排序键。\n- `-y` 表示哪个字段结束了主排序键。\n\n例如：\n\
  ```\nsort -f +2b -4\n```\n在上面的示例中，`-f`（忽略大小写）应用于所有的排序键。主键的起始通过跳过两个字段并忽略前导空格来找到。主排序键在字段\
  \ 4 结束。因此，在这个示例中，字段 3 和 4 构成了主排序键。\n\n### 9. 输入一个空格，然后以与指定主键相同的方式输入次排序键。例如：\n\n\
  ```\nsort -GGG +m.nOPTS -m.nOPTS +m.nOPTS -m.nOPTS          ppppppppppppppppp sssssssssssssss\n\
  ```\n\n在前面的格式中，重复的字母 `p` 表示指定主排序键开始和结束的位置。重复的字母 `s` 表示指定次排序键开始和结束的位置。\n\n去掉较少使用的选项，这里是主键和次键的简化格式：\n\
  ```\nsort -GGG +xOPTS -y +xOPTS -y          ppppppp ssssss\n```\n\n### 10. 可以通过在命令中添加更多的起始和结束规范来添加更多的排序键。例如：\n\
  ```\nsort -GGG +xOPTS -y +xOPTS -y +xOPTS -y +xOPTS -y          ppppppp ssssss 3333333\
  \ 4444444\n```\n记住，除非两行具有相同的主排序键，否则次排序键不会被使用。除非两行的主键和次键都相同，否则三级（第三阶）排序键不会被使用。\n\n\
  ### 11. 如果你正在将内容传递给此 sort 命令并且已经输入了所有的排序字段规范，请按回车键完成命令。否则，你现在可以输入一个空格以及一个或多个要排序的文件名列表。如果你列出了多个文件名，请用空格分隔每个名称。列表可以包含文件名生成通配符模式。然后按回车键完成你的命令。\n\
  \n现在我们可以完成之前开始的示例，并按姓氏对 `friends` 文件进行排序。如果姓相同，则按名和中间名首字母排序。如果这些也相同，则按城市排序到行尾。这里是实现所有这些内容的\
  \ sort 命令：\n\n```bash\n$ sort -b +2 -3 +0 -2 +3 friends\nHenry H. Nguyen, Yuba City\n\
  James B. Nguyen, Los Angeles\nWilliam A. Smith, St. Louis\nMary A. Zornan, Pittsburgh\n\
  Mary K. Zornan, Cleveland\n$\n```\n\n有时你会遇到 `-k` 选项，它允许排序键。大多数系统都支持较新和旧的方法。以下是使用旧方法处理\
  \ `friends` 文件的等命令：\n```\nsort -k3,3 -k2,2 -k4,4 friends\n```\n\n简化格式为：\n```\nsort\
  \ -kaOPTS,b\n```\n`aOPTS,b` 是此排序键的起始字段（不是跳过）。`OPTS` 可以是 `b`、`d`、`f`、`n` 或 `r`，并将仅应用于此键。`b`\
  \ 是此键的结束字段。\n\n### 显示文件的起始行 (*head, sed*)\n\n 仅显示文件的前几行，请使用 `head` 命令，如下：\n```bash\n\
  head groceries friends\n```\n`head` 接受命令行上的文件列表。当给出多个文件时，`head` 将用一个小小的横幅识别每个文件的起始，如下：\n\
  ```\n== groceries ==\n5 apples\n3 grapes\n2 melons\n== friends ==\nJames B. Nguyen,\
  \ Los Angeles\nHenry H. Nguyen, Yuba City\nWilliam A. Smith, St. Louis\nMary A.\
  \ Zornan, Pittsburgh\nMary K. Zornan, Cleveland\n```\n\n\n\n\n\n`head` 通常显示最多 10\
  \ 行输出。当你想要查看多个文件的某些行时，这非常有用。要显示更多或更少的行，请对 `head` 使用 `-n` 选项，如下所示：\n\n```\nls -lt\
  \ | head -20\n```\n\n在前面的示例中，`-20` 选项导致 `head` 最多显示 20 行。在前面的示例中，你还可以看到如果命令行上没有指定文件作为参数，`head`\
  \ 将从标准输入读取，因此你可以在管道中使用它。在这个示例中，`ls -lt` 按最近修改的顺序显示文件，因此整个管道显示了最近修改的 20 个文件。\n\n\
  如果你的系统上没有 `head` 命令，你可以像这样使用 `sed` 命令：\n\n```bash\nsed nq filename\n```\n\n将 `n`\
  \ 替换为要显示的起始行数，如下所示：\n\n```bash\nls -lt | sed 5q\n```\n\n此示例仅显示前五行。前一个示例还说明了如果命令行上没有指定文件，`sed`\
  \ 将从标准输入读取，因此它也可以用于管道。如果命令行上给了多个文件，`sed nq` 将显示这些文件的前 *n* 行，但它不会像 `head` 那样识别文件名。\n\
  \n**另参**：有关 `sed` 命令的更多信息，请参阅第 417 页\n\n## 显示文件或管道的结束行\n\n要仅显示文件的结束行，请使用 `tail`\
  \ 命令，如下所示：\n\n```\ntail filename\n```\n\n`tail` 命令通常在命令行上接受一个文件名。`tail` 通常显示文件的最后\
  \ 10 行。要指定显示最后几行，请对 `tail` 使用 `-n` 选项，如下所示：\n\n```bash\nls -lt | tail -20\n```\n\
  \n此示例仅显示来自 `ls` 命令的最后 20 行（你可以在附录中查看 `ls` 命令的选项）。前一个示例还说明，如果没有提供文件名，`tail` 将从标准输入读取，因此可以用于管道。\n\
  \n要从文件的第 `n` 行开始显示到文件末尾，请使用带有 `+n` 选项的 `tail`。例如：\n\n```\ntail +350 filename\n```\n\
  \n警告：`tail` 输出是限制的。在许多 UNIX 版本上，`tail -n` 被限制为最多数百或几千行。`tail` 接受较大的 `-n` 值，但它不会显示那么多行。前一个示例将从文件的第\
  \ 350 行开始并显示到文件末尾的所有行。要观察文件中添加的内容（例如日志文件），请输入：\n\n```bash\ntail -f filename\n```\n\
  \n`tail` 将首先显示文件的最后 10 行。命令不会在那里停止。它将继续跟踪文件，随着新行被添加到文件末尾，`tail` 将把它们显示在你的屏幕上。这将一直持续直到你按下\
  \ `INTR` 键（通常是 `Ctrl+C` 或 `Delete`）。\n\n## 加密文件或管道\n\n如果你有机密文本信息或数据，可以使用 `crypt`\
  \ 命令对信息进行加密或乱码，只有知道正确密码或密钥的人才能解密——即解乱信息并使用它。请注意，自 `crypt` 命令以来加密技术已经取得了进步，据报道今天有几种程序可以破解这种安全性。为了获得更好的加密，请研究来自某些\
  \ UNIX 供应商、技术书店以及互联网提供的 `pgp` 或 `des`。\n\n### 如何使用 Crypt 加密文件\n\n1. 确保你知道要加密文件的完整路径。该文件可以是文本文件也可以是数据文件。\n\
  2. `cd` 到包含要加密文件的目录。\n3. 输入 `crypt < EXISTING-FILE > tmpfile`。将 `EXISTING-FILE`\
  \ 替换为要加密的文件基名。`tmpfile$$` 是我们在此过程中使用的临时文件。按照所示所示输入该名称，但请注意 shell 将用某些数字替换 `$$` 以使名称唯一。\n\
  \n\n\n\n确保唯一性，以免当其他用户同时在同一目录下执行相同操作时发生冲突。\n\n4. 在输入第 3 步中型命令后，你将看到此提示：\n`Enter key:`\n\
  \n输入一个或多个字符或单词作为加密密钥。出于安全考虑，你输入的内容不会显示在屏幕上，因此请缓慢且仔细地输入密钥。\n\n**警告**：你将需要知道此密钥的准确拼写，以便稍后解密并使用你的文件。该密钥没有后门，因此如果你忘记了该密钥，就无法解密你的文件。\n\
  \n5. 在第 4 步中输入密钥后，`tmpfile$$` 将存储加密后的信息。\n\n6. 通过输入以下命令测试 `tmpfile$$`：\n```bash\n\
  crypt < tmpfile$$ > tmp2$$\n```\n你将再次看到此提示：\n`Enter key:`\n\n输入与加密该文件相同的密钥。请注意，同一个密钥用于加密和解密信息。\n\
  \n7. 输入 `cmp EXISTING-FILE tmp2$$`。\n将 `EXISTING-FILE` 替换为想要加密的原始文件名。此 `cmp` 命令应该直接返回\
  \ shell 提示符而没有任何输出，表示两个文件是相同的。如果不是，说明出了问题。请勿继续此操作。可能是你输入的密钥错误。尝试返回第 6 步。如果第 7 步显示文件不同，请按如下方式删除临时文件：\n\
  ```bash\nrm tmpfile$$ tmp2$$\n```\n并返回此操作的第 1 步。\n\n8. 输入 `mv tmpfile$$ EXISTING_FILE`。\n\
  将 `EXISTING-FILE` 替换为想要加密的原始文件名。这将用加密版本替换原始文件。\n\n9. 输入 `rm tmp2$$`。这删除了我们不再需要的另一个临时文件。\n\
  \n要解密文件，请输入以下：\n```bash\ncrypt < ENCRYPTED-FILE > DECRYPTED-FILE\n```\n将 `ENCRYPTED-FILE`\
  \ 替换为要解密的文件。将 `DECRYPTED-FILE` 替换为你想要创建的任何新。确保该名称已存在，因为该名称会被此命令覆盖。`crypt` 将输出此提示信息：\n\
  `Enter key:`\n\n输入与加密文件相同的密钥。你也可以在命令行中提供密钥。例如：\n```bash\ncrypt \"Mary had a lamb\"\
  \ < file1 > file2\n```\n当你想在 shell 脚本中使用 `crypt` 而不想被提示从键盘输入密钥时，这非常有用。但请注意，任何读取\
  \ shell 脚本的人都能看到密钥是什么；这安全性不高。\n\n加密软件通常不包含在你的 UNIX 系统中，因为美国政府有规定，将此类安全技术出口到国外。如果你的商业\
  \ UNIX 系统上没有加密功能，你可能会发现它在国内范围内是可用的。请咨询你的 UNIX 供应商。\n\n 压缩文件 (*compress, gzip*)\n\
  \n压缩文件意味着对其内容进行编码，使其尺寸变小，并且在以后需要时可以恢复到原始大小和内容。文件可以压缩到多小取决于文件中的数据。包含许多重复字符的文本文件，压缩后的尺寸可以比包含随机数据的二进制文件小得多。\n\
  \n文件通常压缩有两个原因：\n- 它们占用更少的磁盘空间。例如，你可能会压缩一组很少使用但必须保持可访问的归档文件。\n- 可以在更短的时间内传输到另一个系统。如果你通过慢速调制调器下载文件，这可能是一个因素。\n\
  \n在 UNIX 下，你可以使用两个命令来压缩文件：\n\n\n\n\n\n# compress 和 gzip\n\n`compress` 在大多数 UNIX\
  \ 系统上都可用。`gzip` 通常能提供更好的压缩效果——也就是说生成的压缩文件比 `compress` 命令更小。然而，`gzip` 通常不是标准 UNIX\
  \ 发行版的一部分。\n\n使用 `compress` 命令压缩文件，请输入以下命令：\n\n```\ncompress FILENAME\n```\n\n将\
  \ `FILENAME` 替换为要压缩的文件。`compress` 会创建一个同名但后缀为 `.Z` 的压缩文件并删除原始文件。仅在 SCO UNIX OpenServer5\
  \ 上，`compress` 有一个 `-H` 选项，它可以使用更好的压缩方法并生成更小的文件，且这些文件仍可以使用标准的 `uncompress` 进行解压。Solaris\
  \ 2.6 未为 `compress` 提供此选项。\n\n使用 `gzip` 压缩文件，请输入以下命令：\n\n```\ngzip FILENAME\n```\n\
  \n将 `FILENAME` 替换为要压缩的文件。`gzip` 会创建一个同名但后缀为 `.gz` 的压缩文件并删除原始文件。\n\n要在 `gzip` 中获得最佳压缩效果，请添加\
  \ `-9` 选项，如下所示：\n\n```\ngzip -9 FILENAME\n```\n\n共有从 `-1` 到 `-9` 的九个选项。如果你主要考虑的是快速完成压缩，即使文件不是尽可能小，请使用\
  \ `-1`。如果你主要考虑的是让结果尽可能小，请使用 `-9`，这将花费更多时间来完成。可以使用中间的任何数字作为速度与大小之间的权衡。如果未给出值，默认为\
  \ `-6`。\n\n## 如何解压文件\n\n1. 输入 `uncompress`。如果要解压的文件以 `.Z` 结尾，输入 `gunzip`。如果解压的文件以\
  \ `.gz` 结尾，在收到指令前不要按回车键。\n2. 输入空格，然后输入要解压的文件名，该文件名必须以 `.Z` 或 `.gz` 结尾。\n3. 按回车键执行此命令。文件将被解压，文件名中的\
  \ `.Z` 或 `.gz` 后缀将被移除。## 将文件编码为可传输的简单文本 (uuencode)\n\n在邮件正文中发送信息时，信息必须是简单的、可的文本字符。当你从命令行使用\
  \ UNIX `mailx` 命令时，无法包含附件，因此任何要发送的二进制文件必须转换或编码为一段简单的文本字符。我们称此过程为 `uuencoding`，其中\
  \ `uu` 是用于 UNIX 到 UNIX 传输工具的标准 UNIX 前缀。\n\n`gzip` 通常可以下载，但通常不随商业 UNIX 系统提供，通常可以通过专门提供你运行的\
  \ UNIX 平台共享软件或免费工具的互联网网站下载（例如 `www.sun.com`、`www.ibm.com` 或 `www.sco.com`）。\n\n\
  如果你拨入了另一个 UNIX 系统并想下载或上传二进制文件，`uuencoding` 也很有用。`cu` 中的 `~put` 和 `~take` 命令仅下载或上传文本文件。二进制文件可以先被\
  \ `uuencoded` 为文本文件。这些文件可以被传输，然后 `uudoded` 还原为原始二进制格式。\n\n在 shell 提示符下 `uuencode`\
  \ 一个文件，请输入：\n\n```\nuuencode BINFILE DESTFILE TEXTFILE\n```\n\n将 `BINFILE` 替换为要编码的二进制文件。将\
  \ `DESTFILE` 替换为要在目标系统上创建的文件名。将 `TEXTFILE` 替换为你系统中创建带有 `uuencoded` 信息的文件名。\n\n要对另一个\
  \ UNIX 命令或管道的输出进行 `uuencode`，请输入：\n\n```\nCMD | uuencode DESTFILE TEXTFILE\n```\n\
  \n将 `CMD` 替换为生成要 `uuencoded` 输出的 UNIX 命令或管道。\n\n在 `TEXTFILE` 传输到另一个 UNIX 系统后，你可以输入以下内容将其还原为原始格式：\n\
  \n```\nuudecode TEXTFILE\n```\n\n上述命令会创建二进制文件并将其命名为 `DESTFILE`，该名称是在运行 `uuencode`\
  \ 时指定的。\n\n\n\n\n\n要在运行 `uudecode` 之前确定 `DESTFILE` 是否会被创建，请输入：：\n\n```\nhead TEXTFILE\n\
  begin 660 /usr/fred/acme M?T5,1@$! 0           (  P !    <)T$\"#0   !0I@       #0\
  \  (  &\nM \"@ $@@ 0   8     T     -($\"      #      P      4           P    /0\n\
  M             !,          !           !    -    #2 ! @     9'X\nM &1^   %      !\
  \     $    \"8?@  F X%\"      #@)@  5$8    <      $\n```\n\n在第一行中，你可以看到当此文件被 `uudec`\
  \ 解码时，它将创建一个名为 `/usr/fred/acme` 的文件。如果你想更改 `uudecode` 创建的目标文件，可以编辑此文件中的名称。这在于 UNIX\
  \ 和 Windows 之间发送 uuencoded 文件时尤为有用。注意，其余行都以字母 `M` 开头。一个 `begin` 行后跟许多行 `M` 行通常表示这是一个\
  \ uuencoded 文件。\n\n如果你在邮件中收到带有 uuencoded 文件的邮件，你可以保存此邮件并对其进行 `uudecode`，而无需删除 uuencoded\
  \ 行前后的邮件行。\n\n## 另此\n\n关于使用 `cu` 的更多信息，请参见第 252 页。\n\n## 合并文件\n\n本节介绍了几个可以用于各种目的合并文件内容的命令。\n\
  \n### 邮件下的 uuencode/uudecode\nWindows 下某些邮件程序支持 `uuencode/uudecode`。如果你想从 Windows\
  \ 向 UNIX 发送二进制文件，这将非常有用。点击 `uuencode` 将二进制文件的文本版本直接插入你的邮件中。这不是附件！如果你在 Windows 邮件中收到\
  \ uuencoded 数据，请点击 `uudecode` 将数据保存到文件中。你可能需要调整 uuencoded 文本中的目标文件名。\n\n### 对多个文件进行排序\
  \ (sort)\n我们在本章开头介绍过 `sort`。如果在命令行上带有一个文件列表调用 `sort`，`sort` 将首先合并它们的内容，然后按排序顺序显示合并后的内容，如下：\n\
  \n```\nsort file1 file2 file3 > bigsort\n```\n\n### 串联文件 (cat)\n若要按顺序合并文件，请使用 `cat`\
  \ 命令：\n\n```\ncat file1 file2 file3 > bigfile\n```\n`cat` 命令的名称源于 concatenation（连接）。\n\
  \n### 并排粘贴文件 (paste)\n`cat` 命令是按顺序合并。`paste` 命令则是并排合并。`paste` 输出的第 1 行包含 `file1`\
  \ 的第 1 行，然后是一个制表符，接着是 `file2` 的第 1 行，然后是制表符，最后是 `file3` 的第 1 行，此类推。同样，第 2 行包含每个文件的第\
  \ 2 行。要以此种方式粘贴文件，请输入：\n\n```\npaste file1 file2 file3...\n```\n\n如果 `colors` 文件每行一种颜色，`fruits`\
  \ 文件每行一个水果，将它们拼接将产生如下输出：\n\n```\npaste colors fruits\nred   green apple\nblue  banana\n\
  yellow melon\n```\n\n### 根据连接字段合并已排序的文件 (join)\n`join` 命令允许你将一个文件中某行的数据与第二个文件中对应行的数据进行合并。相应的行是通过查找具有匹配\
  \ `join` 字段的行来指定的。两个文件都必须经过排序。你可以指定哪个字段为连接字段，且该字段在两个文件之间可以不同。你可以指定从每个文件中提取什么数据。以下是一个示例。\n\
  \n我的一个朋友正在研究股市。他加入了一个服务，该服务每天向他发送一个包含平均股票价格的文件。他想将这些小文件合并成一个大的历史文件，以便他一眼看出特定股票价值是在上涨还是下跌。以下是第\
  \ 1 天的示例文件，它只包含三只股票：\n\n```\nABC 2/8 DEF 24/8 GHI 6/8\n```\n\n这是第 2 天的文件：\n\n```\n\
  ABC 3/3 BCD 12/2 DEF 22/8 GHI 5/5\n```\n\n这是第 3 天的文件：\n\n```\nABC 5/5 BCD 14/3 DEF\
  \ 22/5\n```\n\n\n\n\n你可以看到，在第 2 天我们获得了一只新股票 BCD。在第 3 天，我们丢失了股票 GHI。每个文件的第 3 行并不总是同一只股票；因此，我们无法使用\
  \ `paste` 命令来合并这些文件。这就是 UNIX `join` 命令用的任务。在这个示例中：\n\n我们使用股票名称作为连接字段。\n\n```bash\n\
  $ join -t'   ' -a1 -a2 day1 day2 ABC    2 1/8    2 3/8\nBCD   12 2/8\nDEF   24 5/8\
  \   22 7/8\nGHI     6 3/8     6 5/8\n```\n\n在前面的示例中，`-t` 允许我们指定字段分隔符。在这种情况下，制表符（tab）将每个文件中的股票名称与其平均值隔开。因此，在\
  \ `-t` 选项之后指定了一个制表符进行连接。`-a1` 和 `-a2` 意味着包含文件 1 和文件 2 中的所有行。否则，将列出连接字段值在两个文件中都出现的行。在这个示例中，股票\
  \ BCD 仅出现在文件 2 中，因此如果没有指定 `-a2`，它将不会包含在连接输出中。\n\n```bash\n$ join -t'   ' -a1 -a2\
  \ day1 day2 | join -t'   ' -a1 -a2 - day3\nABC    2 1/8    2 3/8    2 5/8\nBCD \
  \  12 2/8   14 3/8\nDEF   24 5/8   22 7/8   22 5/8\nGHI     6 3/8     6 5/8\n```\n\
  \n在前面的示例中，`day1` 和 `day2` 的连接输出与 `day3` 相连接。注意一个 `join` 命令的输出如何通过管道到另一个 `join` 命令，如果该\
  \ `join` 命令将连字符（`-`）作为文件名之一表示标准输入。\n\n要处理连接字段不是每行第一个字段的情况，请为 `join` 添加 `-j` 选项。在\
  \ `-j` 之后输入每个文件中连接字段的字段编号。例如：\n\n```bash\n$ join -j 3 file1 file2\n```\n\n要处理两个文件之间连接字段不是相同编号的情况，请使用\
  \ `-j` 后紧接 `nm`，其中 `n` 是 1 或 2（代表文件 1 或文件 2），`m` 是该文件中作为连接字段的字段，如下所示：\n\n```bash\n\
  $ join -j 2 -j 4 file1 file2\n```\n\n在这个示例中，连接字段是文件 1 中的第 2 个字段，但在文件 2 中是第 4 个字段。要为\
  \ join 输出的每行仅显示某些特定字段，请使用 `-o` 选项，其后跟一个用空格分隔的 `n.m` 条目列表，其中 `n` 是 1 或 2（代表 `file1`\
  \ 或 `file2`），`.m` 指定该文件中第 `m` 个字段，如下所示：\n\n```bash\n$ join -j 2 -j 4 -o 1.1 2.3\
  \ 2.5 file1 file2\n```\n\n### join 有多用处？\n\n一些 UNIX 籍暗示你可以通过 `join` 实现整个关系型数据库。其他的\
  \ UNIX 籍完全没有提到 `join`。我发现 `join` 在某些情况下合并来自不同文件的数据很有用。然而，由于 `join` 功能非常有限，我会使用 `awk`\
  \ 或 `perl` 来对数据文件进行查询和编写报告。前面的示例将由 `-o` 选项控制每行显示三个字段：`1.1` 意味着首先显示 `file1` 中的第 1\
  \ 字段，`2.3` 意味着接着显示 `file2` 中的第 3 字段，`2.5` 意味着最后显示 `file2` 中的第 5 字段。\n\n### 将一个文件分成多个文件\n\
  \n有时，将一个文件分成较小文件是有用的。例如，如果一个文件无法放入磁盘，你可以将其分成多个可以放入磁盘的小文件。另一个例子是，当使用 `cu` 拨入另一个 UNIX\
  \ 系统时，可以在系统之间传输文件。由于没有错误检查，干扰行可能会导致目标文件损坏。在这种情况下，我通过将文件分成几个较小文件然后分别传输获得了成功。使用 `cat`\
  \ 命令，可以通过连接这些小文件来简单地恢复原始文件。\n\n### 将文件分成等长度的片段 (*split*)\n\n如何将文件分成等长度的段\n\n1. 在\
  \ shell 提示符处，输入 `split`。在接到指示前不要按回车键。\n2. 输入一个空格，然后输入 `-LINES`。将 `LINES` 替换为放入每个文件段的行数；例如，`-400`\
  \ 表示创建每个长 400 行的小文件。如果省略此步，每个片段将创建为 1,000 行。\n3. 输入一个空格，然后输入要拆分的文件。如果文件在当前目录下，只需输入其文件名。如果文件不在当前目录，请输入其绝对或相对路径。该文件不会受到此命令的影响。\n\
  \n\n\n\n4. 输入一个空格，然后输入分段前缀。第一个分段将以分段前缀后接 `aa` 开始。第二个段后面是 `ab`，然后是 `ac`，以此此类推。如果给定的前缀较小，例如，现有文件将被拆分为\
  \ `smallaa`、`smallab`、`smallac`、`smallad` 等的分段。如果跳过此步骤，分段前缀将为 `x`（即 `xaa`、`xab`、`xac`\
  \ 等）。\n5. 按回车键执行此命令。\n\n要从分段重新创建原始文件，可以使用文件名生成通配符。例如：\n\n```bash\ncat small* > bigfile\n\
  ```\n\n`small*` 将匹配 `smallaa`、`smallab`、`smallac` 等。如果其他文件也以该前缀开头但不是大文件的分段，你可以使用更具体的通配符模式来规避它们。例如：\n\
  \n```bash\ncat smalla[a-f] > bigfile\n```\n\n# 按章节标题分割文件 (*csplit*)\n\n`csplit`\
  \ 命令允许你根据文件内部的上下文将文件分割成段。\n\n## 按重复的章节关键词分割文件\n\n1. 确定一个出现在每个章节标题中的关键词。例如，如果每个关键章节标题都以单词\
  \ *Chapter,* 开头，那么 `Chapter` 就是关键词。如果没有单一关键词出现在每个章节标题中，则无法使用此方法。\n2. 在 shell 提示符下，输入\
  \ `csplit -k`。在指示之前不要按回车键。\n3. 输入一个空格，然后输入要分割的现有文件名称。\n4. 输入一个空格，然后输入单引号（`'`）和斜杠（`/`）。\n\
  5. 输入章节关键词。\n6. 输入斜杠（`/`），然后输入单引号（`'`）。\n7. 输入一个空格，然后输入 `{}`。按回车键执行此命令。\n8. 忽略错误信息：out\
  \ of range（超出范围）。我们告诉它在必要时创建分段，但通常数量会少于该值。\n9. 这将创建名为 `xx00`、`xx01`、`xx02` 等的文件。每个段将包含直到包含关键字行（如第\
  \ 1 步所述但不包含）的所有行。如果 `Chapter` 是关键词，`xx00` 将包含到 Chapter 1 开始之前的所有行；`xx01` 将包含 Chapter\
  \ 1 的所有行，直到但不包含 Chapter 2，以此此类推。\n\n## 按唯一关键词分割文件\n\n1. 当你能够识别出每个章节开头的唯一单词时，使用此方法。\n\
  2. 在 shell 提示符下，输入 `csplit`。在指示之前不要按回车键。\n3. 输入一个空格，然后输入要分割的现有文件名称。\n4. 输入一个空格，然后在斜杠（`/`）之间输入结束第一个段的关键词。包含该关键词的行将作为第二个段的开始。\n\
  5. 输入一个空格，然后在斜杠（`/`）之间输入结束第二个段的关键词。包含该关键词的行将作为第三个段的开始。\n6. 继续在斜杠（`/`）之间输入关键词，直到定义所有段。按回车键执行你的命令。\n\
  7. 这将创建名为 `xx00`、`xx01`、`xx02` 等的文件。这是上述操作的示例：\n\n```bash\ncsplit existing-file\
  \ '/INSTRUCTIONS/' '/WARNINGS/' '/APPENDIX 1'\n```\n\n![arrow.gif](img/4505ed21b36ef4ebf4df520603bad.gif)\n\
  \n通过上述操作将创建四个分段文件：`xx00`、`xx01`、`xx02` 和 `xx03`。`xx00` 将包含直到包含 `INSTRUCTIONS` 的行之前的所有行。`xx01`\
  \ 将从 `INSTRUCTIONS` 行开始，一直找到 `WARNINGS` 单词为止。`xx02` 将从包含 `WARNINGS` 单词的行开始。`xx03`\
  \ 将从包含短语 `APPENDIX 1` 的行开始，并包含文件中其余的所有行。\n\n\n\n\n\n# 使用文件名生成通配符 (*, ?, [...]) 创建文件列表\n\
  \n## 检查哪些命令允许文件列表\n\n## 处理文件名通配符错误参数列表过长 (arg List Too Long)\n\n## 使用反引号 ('') 创建文件列表\n\
  \n## 处理反引号错误空格 (No Space)\n\n## 使用 `xargs` 处理极长的文件列表\n\n# 使用文件名生成通配符\n\n大多数文件命令都可以对一个或多个文件运行。例如，文件命令可以处理以下内容：\n\
  * 单个文件\n* 几个文件\n* 数百个文件\n* 数万个文件（当然，这要困难得多。）\n\n一如既往，UNIX 能够提高工作效率。在这种情况下，UNIX 通过提供一种方法，使用非常短的按键序列向命令输入一系列很长的文件名，来提高效率。用户可以在任何命令中输入一个或多个模式单词，shell\
  \ 将把每个模式替换为匹配该模式的所有文件名列表。模式单词是指任何包含表 9.1 所示通配符字符之一的单词。\n\n### 表 9.1 文件名生成通配符字符。\n\
  \n| 字符 | 描述 |\n| :--- | :--- |\n| `*` | 匹配零或多个任意字符 |\n| `?` | 匹配任意单个字符 |\n| `[...]`\
  \ | 匹配括号内的任意一个备选项目 |\n| `[!...]` | 匹配列出字符以外的任何字符 |\n\n### 生成以模式开头、结尾或包含模式的名字 (*)\n\
  \n我们将从星号 (`*`) 通配符开始，因为它是所有通配符中最强大且最易理解的，因此也是最常用的。这里有一个例子：`rm report*` 是删除（即移除）一个或多个文件的\
  \ UNIX 命令。`report*` 是一个模式单词，因为它包含了表 9.1 给出的三个通配符字符之一。在命令开始执行之前，shell 将重新组合命令，将模式单词替换为匹配该模式的所有现有文件名列表。从表\
  \ 9.1 可以看出，星号 (`*`) 匹配零或多个任意字符。因此，`report*` 是一个模式，匹配所有以 report 开头并后跟零或多个任意字符的现有文件名。\n\
  \n#### 表 9.2 使用 `rm report`。\n\n会被 `rm report*` 删除的文件：\n| Report |\n| :--- |\n|\
  \ report2 |\n| reports |\n| 1reporters |\n| Reportacme |\n| report.acme |\n| report-98.01.15\
  \ |\n\n不会被 `rm report*` 删除的文件：\n| Filename | 模式不适的原因 |\n| :--- | :--- |\n| Report\
  \ | 大写 R 不匹配该模式 |\n| 98report | 文件名不以 report 单词开头 |\n| report.acme | 此名称中的 Report\
  \ 拼写错误 |\n\n### 删除所有以模式开头的文件\n\n1. 输入 `rm`。我们使用 `rm` 作为示例，但该步骤适用于任何操作文件的命令。\n2.\
  \ 输入空格，然后输入模式。该模式定义了我们想要查找的前缀。\n3. 输入星号 (`*`)，然后按回车键完成命令。\n4. shell 将接受你的命令并对其重新组合，将模式单词替换为匹配该模式的所有现有文件名列表。然后\
  \ shell 将执行 `rm` 命令，其删除文件列表就像是你直接在命令行输入了这些文件一样。\n\n我们可以修改上述过程，以删除所有以模式结尾或包含模式的文件。要像下表所示使用星号，你需要学习三个实用的短语。短语的措辞会告诉你星号\
  \ (`*`) 应该出现在模式之前、之后还是两侧。\n\n#### 表 9.3 星号 (*) 文件名用用短语。\n\n| 有用短语 | 示例 | 描述 |\n\
  | :--- | :--- | :--- |\n| Start with ... (...开头) | `rm acme*` | 删除所有以 acme 单词开头的文件名\
  \ |\n| End with ... (...结尾) | `rm *acme` | 删除所有以 acme 单词结尾的文件名 |\n| Contain ...\
  \ (包含...) | `rm *acme*` | 删除所有包含 acme 单词的文件名 |\n\n\n\n\nShell 会预处理并通所有文件名通配符模式展开为匹配的文件列表；然而，并非所有命令都能接受文件列表。例如：\n\
  \n### 通配符（wildcard）一词源于何？\n\n在某些卡牌游戏（如扑克牌）中，王牌（Joker）是一种通配符，你可以将其用作牌组中需要的任何其他牌牌。星号\
  \ `*` 是一种极其强大的通配符，因为它可以代表零个或多个任意字符（噢，我的意思是字符）。我真希望下次玩扑克牌时能有一个星号 `*` 通配符。\n\n```\n\
  pwd report*\n```\n这没有任何意义，因为 `pwd` 仅显示当前目录，不期望命令行中后续有任何参数。同样，\n\n```bash\ncd report*\n\
  ```\n如果有多个目录都以 `report` 单词开头，那么这个命令也是意义的，因为你一次只能切换到一个目录。\n\nUNIX 的 `man` 命令（在线手册）为我们提供了关于如何使用每个\
  \ UNIX 命令的详尽信息，包括语法（即如何正确组合命令元素）。以下是几个命令的语法，用于说明 man 手页中是如何记录文件列表的。\n\n#### 表 9.4\
  \ man 手页如何指示文件列表。\n\n| 来自 man 的命令语法 | 我的描述（man 手页未包含） |\n| :--- | :--- |\n| `head\
  \ [ -count ] [ file . . . ]` | 显示文件列表的开头行。 |\n| `sort [-cmu] . . . [ files ]` |\
  \ 对文件列表的内容进行排序。 |\n| `tail [+/-number][lbc] [-f] [ file ]` | 显示给定单个文件的结束行。 |\n|\
  \ `tr -cds] [string1 string2]` | 将字符从标准输入输出。 |\n| `cp file1 file2` | 将 `file1` 复制到\
  \ `file2`。 |\n| `cp files directory` | 将文件列表复制到目录。 |\n\n在前面的表格中，请忽略 `-count` 或 `-cmu`\
  \ 等命令选项，现在关注如何为这些命令指定文件名。注意 `head` 和 `sort` 命令都允许指定文件列表；其中一个使用 `file . .`，另一个使用\
  \ `files` 来表示允许一个或多个文件。`tail` 命令仅允许单个文件。`tr` 命令不允许任何文件名。`cp` 命令有两种模式：第一种模式将单个文件复制到另一个，第二种模式将文件列表复制到目录。命令方面方面不同\
  \ UNIX 类型之间可能不同。因此，请检查你所在系统的 man 手页，以查看特定命令是允许文件列表、单个文件还是完全不允许文件。\n\n参见第 89 页\n\n\
  本书的附录包含了如何使用每个命令的摘要，以及关于该命令各个方面的描述所在。从附录中，这里是 `sdiff` 和 `sort` 命令的前几行。注意 `sdiff`\
  \ 不允许文件列表，因此我们不会在 `sdiff` 命令中使用通配符模式。注意 `sort` 允许文件列表，我们可以通过使用一个或多个通配符模式来组合它。`sort`\
  \ 用法下的括号 `[...]` 告诉我们文件列表是可选的，意味着可以提供零或多个文件名。\n\n重定向不允许文件名通配符。Shell 不会对任何用于重定向（即\
  \ `>`、`>>`）的文件名进行展开。当重定向到一个包含星号的文件名时（该名称通常是某个名称的快捷方式），如果该名称存在，你将创建一个包含星号的名称。\n\n\
  \n\n标准的 UNIX 文档通常极力避免使用 `wildcard`（通配符）一词。文档通常将其称为文件名生成模式字符、普通 shell 参数语法或 shell\
  \ 模式元字符。我认为 `wildcard` 这个术语非常恰当且更容易理解，因此我在书中使用了它。\n\n文中提到了以下文件：\n- `inventory-after-special-order`\n\
  - `pricelist`\n- `reports-in-old-format`\n- `sales-Jan-1997-to-Dec-1997-adjusted-for-new-commission-structure`\n\
  - `security.memo`\n\n如果我想删除销售文件，星号 `*` 通配符可以节省我大量的打字工作，如下所示：\n\n```\nrm sales*\n\
  ```\n\n然而，我不能将命令缩短为：\n\n```\nrm s*\n```\n\n这将删除不仅仅是销售文件的其他内容。\n\n## 使用星号 (*) 作为快捷方式\n\
  \n1. 在你想要访问的文件中找到一个独特的模式，该模式在任何其他文件名中都不存在。这个独特模式可以是文件名的开头、结尾或中间任何位置。\n2. 输入所需的 UNIX\
  \ 命令，后跟适当的 `*` 通配符模式，以选择所需的文件而不选择任何其他文件。\n\n### 文件列表中的目录\n\n由星号 `*` 通配符（以及本章讨论的其他通配符）生成的文件列表可以包括普通文件（参见词表）、目录、设备文件等。无论文件类型如何，所有匹配模式的文件名都会在列表中。如果无法无法该类型的文件，它将对该文件报告错误并继续处理列表。\n\
  \n```\nrm abc*\nabc: directory\nabc25: directory\n```\n\n在前面的示例中，星号生成的列表包含了两个目录名称。`rm`\
  \ 确实删除了所有文件名匹配模式的普通文件。`rm` 也针对目录输出了错误信息，表明它没有处理它们。通常情况下，我会忽略这些目录错误，因为我通常使用通配符模式来处理一组文本或数据文件。错误信息的出现是一件好事，它告诉我哪些内容没有被处理，以便我在我想对它们采取进一步行动。\n\
  \n### 从多个模式生成一个文件列表\n\n一个文件列表可以由多个通配符模式生成，如下所示：\n\n```\nrm acme* report*\n```\n\n\
  在这个示例中，两个通配符模式由空格隔开，组成一个要删除的文件列表。任何以单词 `acme` 开头和任何以单词 `report` 开头的文件都位于同一个删除列表中。\n\
  \n请注意，多个列表可能会多次生成同一个文件名。例如：\n\n```\nrm acme* *.sav\n```\n\n在前面的示例中，任何以 `acme` 开头并以\
  \ `.sav` 结尾的文件将在列表中两次，因此会被打印两次。在本章稍后的部分中，你将学习如何解决这个问题。有关 `rm` 命令的更多信息，请参阅第 169 页。\n\
  \n### 在列表中包含隐藏文件\n\n以点开头的文件名被称为隐藏文件，因为 `ls` 命令通常会隐藏它们（即忽略它们），除非为 `ls` 添加 `-a` 选项来显示所有文件。隐藏文件通常是系统文件，隐藏它们是为了防止在用户列出或处理数据和应用程序文件时它们不会被显示或受到影响。\n\
  \n通配符也遵循这一约定，忽略隐藏文件，除非在通配符模式中明确指定它们。例如：\n\n```\nrm *-sav\n```\n\n前面的命令将删除任何以 `-sav`\
  \ 结尾的非隐藏文件。然而，`.acme-sav` 以 `-sav` 结尾，但不会被删除，因为开头的星号 `*` 无法匹配文件名开头的点。\n\n\n\n要删除所有以\
  \ `-sav` 结尾的隐藏文件，请使用此命令：\n```bash\nrm .*-sav\n```\n此命令仅删除以点（`.`）开头并以 `-sav` 结尾的文件。要同时删除以\
  \ `-sav` 结尾的隐藏和隐藏文件，请使用此命令：\n```bash\nrm  *-sav  .*-sav\n```\n此命令使用两个通配符模式来创建一个待删除的文件列表。为了清晰起见，我额外添加了一些空格。\n\
  \n# 在其他目录生成文件列表\n\n你已经看到星号（`*`）可以匹配除开头点以外的任意零或多个字符。还有第二个例外：星号不能匹配斜杠（`/`）目录分隔符。这是一个很好的规则。否则，像下面的命令：\n\
  \n```bash\nrm *-sav\n```\n\n将会遍历整个系统寻找以 `-sav` 结尾的文件并进行删除。因为星号（`*`）不能匹配斜杠（`/`），列表仅限于当前目录中匹配模式的文件。\n\
  \n我们可以通过绝对路径或相对路径显式地生成当前目录以外目录中的文件名。例如：\n\n### 表 9.5 使用不一定在当前目录的文件列表\n\n| UNIX 命令\
  \ | 描述 |\n| :--- | :--- |\n| `rm *-sav` | 删除当前目录下任何以 `-sav` 结尾的文件 |\n| `rm /tmp/*-sav`\
  \ | 删除 `/tmp` 目录下任何以 `-sav` 结尾的文件 |\n| `rm /tmp/*/*-sav` | 删除 `/tmp` 下任何子目录中任何以\
  \ `-sav` 结尾的文件 |\n| `rm /*-sav` | 删除根目录下任何以 `-sav` 结尾的文件 |\n| `rm */*-sav` | 删除当前目录下任何子目录中任何以\
  \ `-sav` 结尾的文件 |\n| `rm *-sav */*-sav` | 删除当前目录或当前目录下任何子目录中任何以 `-sav` 结尾的文件 |\n\n\
  在本章稍后的部分，我们还会遇到其他通配符，如问号（`?`）和括号（`[]`），请记住它们也可以像星号（`*`）一样在其他目录生成文件列表。\n\n## 在特定位置允许字符\
  \ (?)\n\n问号（`?`）通配符匹配除开头点（`.`）或斜杠（`/）之外的任意单个字符。它允许我们精确指定在其他模式之前、之后或之间允许多少个字符位置。例如：\n\
  \n```bash\nrm report-?\n```\n此命令删除任何以 `report-` 开头且后恰好接一个字符的文件名。\n\n### 表 9.6 rm\
  \ report-?\n\n| 文件名 | 模式不匹配的原因 |\n| :--- | :--- |\n| `report` | `report` 后没有连字符（`-`）\
  \ |\n| `report-` | 连字符（`-`）后没有字符 |\n| `report-33` | 连字符（`-`）后字符过多 |\n| `acme.report-4`\
  \ | 不以 `report` 开头 |\n\n与星号（`*`）一样，`?` 通配符不能匹配开头点或斜杠（`/）。\n\n## 指定固定长度的文件名\n\n方括号（`[]`）允许你为文件名中的该位置指定一个范围范围，但开头的点或斜杠除外。当你想要访问所有长度完全相同的文件时，问号通配符也非常有用。例如：\n\
  \n```bash\nrm report-??\n```\n此命令删除所有以 `report-` 开头且包含三个字符的文件名。\n\n## 在特定位置允许字符\
  \ ([])\n\n方括号（`[]`）允许你为文件名中的该位置指定字符备选，但开头的点或斜杠除外。假设，有二十多个文件名以 `report-` 开头，我们只想删除以下文件：\n\
  \n```bash\nrm report-[1-5mv]\n```\n括号内两个字符之间的连字符（`-`）允许该闭区间范围内的所有字符。不要在括号内包含任何空格或逗号，除非它们本身就是文件名中的字符备选。\n\
  \n\n\n如果 `report-3` 不存在会怎样？没有问题，前面的命令不会生成任何错误信息。这些通配符模式从现有文件中选择匹配该通配符模式的文件名。\n\n\
  ```\nrm report-[4m51-3v]\n```\n\n上面的示例等同于上一个示例。以这种方式混杂备选项并不是好习惯。不过，它说明了选项可以以任何顺序列出。使用连字符（`-`）的范围必须按从低到高指定。例如，应指定\
  \ `b-g` 而不是 `g-b`。注意上一个示例中括号中的 `51` 意味着 `5` 和 `1` 都是文件名中该位置的备选项。该模式不会匹配 `report-51`，因为方括号只匹配备选项中的单个字符，而不是多个字符。\n\
  \n### 表 9.7：`rm report-[1-5mv]`\n\n会被 `rm report-[1-5mv]` 删除的文件：\n* report-1\n*\
  \ report-2\n* report-3\n* report-4\n* report-5\n* report-m\n* report-v\n\n不会被 `rm\
  \ report-[1-5mv]` 删除的文件：\n| 文件名 | 模式不匹配的原因 |\n| :--- | :--- |\n| report | report\
  \ 后面没有连字符 (`-`)。 |\n| report- | 连字符 (`-`) 后面没有字符。 |\n| report-33 | 连字符 (`-`) 后面字符太多太多。\
  \ |\n| report-6 | 6 不是允许的选项之一。 |\n| report-x | x 不是允许的选项之一。 |\n| acme.report-4 |\
  \ 不以单词 report 开。 |\n\n方括号内的星号（`*`）或问号（`?`）不会被视为通配符。然而，在文件名中包含星号或问号并不是好主意；因此，你通常不会在方括号内包含它们。\n\
  \n如果你想将连字符（`-`）作为备选项之一，请将其放在方括号内的第一个或最后一个字符。例如：\n\n```\nrm report-[a-g-]\n```\n\n\
  ### 表 9.8：`[...]` 通配符的更多示例\n\n| 通配符模式 | 描述 |\n| :--- | :--- |\n| `report[0-9]` |\
  \ 匹配 report 后跟一个数字 |\n| `report[0-9][0-9]` | 匹配 report 后跟两个数字 |\n\n| 通配符模式 | 描述\
  \ |\n| :--- | :--- |\n| `[A-Z]*` | 匹配所有以大写字母开头的文件 |\n| `report[0-9][a-zA-Z]` | 匹配\
  \ report 后跟一个数字，再跟一个大写或小写字母 |\n\n与星号一样，括号通配符无法匹配开头的点或斜杠。\n\n#### 在模式 `[...]` 中指定不允许的字符\n\
  \n如果方括号内的字符列表以感叹号（`!`）开头，则任何一个字符都会匹配该通配符，括号列表内的字符除外。例如：\n\n不要被“至少”这个词误导。`^(*[a-z][a-z])`\
  \ 选择以至少两个字母结尾的文件名。这意味着星号可以在最后两个字母之前提供更多字母。创建以至少两个字母结尾的通配符模式是最简单的情况（如所示）。创建以恰好或仅两个字母结尾的模式则更困难。\n\
  \n```\nrm acme[!2-5x].c\n```\n\n上面的示例删除了任何以 `acme` 开头、包含一个不是 `2`、`3`、`4`、`5` 或 `x`\
  \ 的字符、并紧跟 `.c` 的现有文件。\n\n### 表 9.9：`rm acme[!2-5x].c`\n\n会被 `rm acme[!2-5x].c` 删除的文件：\n\
  * acme1.c\n* acme6.c\n* acme9.c\n* acmea.c\n* acmeb.c\n\n不会被 `rm acme[!2-5x].c`\
  \ 删除的文件：\n| 文件名 | 模式不匹配的原因 |\n| :--- | :--- |\n| acme.c | acme 和 .c 之间需要一个字符。 |\n\
  | acme2.c | 2 被明确禁止。 |\n| acme77.c | acme 和 .c 之间只允许一个字符。 |\n| acmex.c | x 被不允许的，但\
  \ X（大写）是允许的。 |\n| acmeb.m | 不以 .c 结尾。 |\n| f-acme9.c | 不以 acme 开头。 |\n\n\n\nShell\
  \ 在缓冲区中处理命令行，在较旧的 UNIX 系统上，该缓冲区有几百个字符，而在较新的 UNIX 系统上，它有几千个字符或更长。如果通配符模式生成的文件列表溢出了命令行缓冲区，执行此部分命令或使用部分文件名将是危险的，因此\
  \ shell 会立即终止操作，如下例所示：\n\n```bash\n$ rm report*\nrm: arg list too long\n```\n\n\
  UNIX 的准则是“没有消息就是好消息”。来自 `rm` 命令的提示信息表示存在问题。在前面的例中，以 `report` 开头的文件名太多，导致 shell 的命令行缓冲区溢出；因此，shell\
  \ 不允许命令启动。某些用户错误地认为，可能 `rm` 命令在出现错误之前已经删除了一些以 `report` 开头的文件。他们不断重复执行相同的命令，希望列表会变得越来越小，直到命令最终成功，但事实是永远不会成功。\n\
  \n解决此问题的一种变通方法是将一个命令拆分为多个命令，每个命令指定一组较小文件组。例如：\n\n```bash\nrm report[a-m]*\nrm report[n-z]*\n\
  rm report[!a-z]*\nrm report\n```\n\n本章的剩余部分将讨论不使用文件名通配符的其他文件列表用法，因此当你遇到 `arg list\
  \ too long` 错误时可以使用这些方法。\n\n### 使用反引号（`` ``` ）生成文件列表\n\n除了文件名生成通配符外，反引号（`` ```）是另一种我们可以用于许多目的的（且不同的）机制，包括为命令生成文件列表。反引号（``\
  \ ```）是另一种单引号，更准确的名称是重音（grave accent）。\n\n使用反引号获取 UNIX 命令或命令序列的标准输出，并将该输出作为另一个命令的一部分。这种技术被称为命令替换。例如，如果我有一个名为\
  \ `flist` 的文件，其中包含我想删除的文件列表，我可以如下所示删除所有这些文件：\n\n```bash\nrm `cat flist`\n```\n\n\
  在键盘上找到反引号（`` ```）：它通常与波浪号（`~`）位于同一个键上。反引号（`` ```）从左上到右下倾斜，但没有反斜杠（`\\`）长。不要把它与单引号（`'`）混淆，单引号是从右上到左下倾斜，或者有时完全倾斜。\n\
  \n#### 使用反引号生成列表\n\n1. 输入你将用于处理列表的 UNIX 命令。（在接到指示之前不要按回车键。）可以使用任何接受文件列表的 UNIX 命令，如\
  \ `rm`、`lp`、`sort` 等。\n2. 输入一个空格，然后输入一个反引号（`` ```）。\n3. 输入 UNIX 命令序列，该序列将在标准输出中生成所有你想处理的文件。该序列可以是管道中的一系列\
  \ UNIX 命令。如果文件都不在当前目录下，则此命令必须为每个文件生成正确的相对路径或绝对路径。多个文件名可以通过空格分隔，或者在不同的行输出，因为反引号会将每个换行符转换为空格。\n\
  4. 输入一个反引号（`` ``` ）并按回车键执行命令。\n\n反引号还可以解决我们无法通过通配符模式解决的问题。假设你想打印所有以 `acme` 开头或以\
  \ `.c` 结尾的文件。使用通配符模式，例如 `lp acme *.c` 会导致重复打印。我们现在可以使用反引号来解决这个问题：\n\n```bash\nlp\
  \ `echo acme *.c | sort | uniq`\n```\n\n在前面的例中，`echo` 命令生成了以 `acme` 开头或以 `.c` 结尾的文件列表。然后该列表通过管道传递给\
  \ `sort`，使得重复项彼此相邻。结果再次通过管道传递给 `uniq`，`uniq` 会忽略任何与之前行相同的行，即删除了重复行。随后，反引号使该列表成为\
  \ `lp` 命令的一部分，因此打印的文件将不会有重复。\n\n与单纯的文件名通配符相比，反引号让我们对生成的文件列表进行更细粒度的控制。以下命令用于删除所有以\
  \ `acme` 开头的文件，但以 `-sav` 结尾的 `acme` 文件除外：\n\n```bash\nrm `echo acme* | grep -v '-sav$'`\n\
  ```\n\n让我为你分析一下这个命令的各个部分。\n\n\n\n\n```bash\necho acme | grep -v '-sav$'\n```\n将生成所有以\
  \ `acme` 开头的文件列表。它使用正则表达式语法仅显示不以 `-sav` 结尾的行；因此，`grep` 会从我们的文件列表中删除任何以 `-sav` 结尾的文件。随后，反引号会将此生成的列表提供给\
  \ `remove` 命令。\n\n另另参阅\n有关 `cat` 命令的更多信息，请参阅第 160 页。\n有关 `grep` 命令和正则表达式的更多信息，请参阅第\
  \ 380 页。\n\n### 处理反引号“无空间”错误\n\n如果反引号生成的文件列表过长，命令可能会失败并显示如下的错误信息：\n\n```\nsh: no\
  \ stack space\nor\nksh: no space\n```\n\n较新版本的 UNIX 似乎能够处理比早期版本长得多的反引号列表。如果使用反引号出现\
  \ `list is too long` 错误，要解决此问题，请参阅本章中关于 `xargs` 的章节。\n\n### 使用 `xargs` 处理文件列表\n\n\
  到本章为止，我们一直使用通配符在命令行上生成文件列表，但如果匹配模式的文件过多，该技术可能会失败。反引号可以从 UNIX 命令的管道中生成文件列表，从而让我们对列表中的文件有更多的控制权。然而，如果生成的文件名过多（特别是在旧版系统上），反引号可能会失效。我们可以在命令行级别使用另外一种技术来处理文件列表。它提供了对列表的控制，与反引号提供的程度相同，但它对可处理的文件数量没有限制。实现所有这一切的方法就是\
  \ `xargs` 命令。当你有成千上万甚至数百万个文件需要处理时，`xargs` 能够胜任这项工作。\n\n1. 输入 UNIX 命令或管道，该命令将在标准输出上生成你想要处理的文件列表（在接到指示前不要按回车键）。如果文件不在当前目录，列表应包含每个文件正确的相对路径或绝对路径，而不仅仅是文件名。该命令可以简单的\
  \ `cat flist`，其中 `flist` 是一个包含要处理的文件名的文件。\n2. 输入管道符号 (`|`)。管道符号前后的空格可选可选。\n3. 输入\
  \ `xargs`。\n4. 输入一个空格，然后输入将处理该文件列表的命令。随后跟上该命令所需的任何选项。\n5. 按回车键执行此序列。第 1 步输入的命令将生成文件列表。第\
  \ 2 步的管道将这些文件作为输入提供给 `xargs`。`xargs` 将使用其收到的子集构建并执行第 4 步输入的命令。`xargs` 会多次调用第 4 步的命令，直到处理所有文件。不存在参数列表过长的危险，因为它不会一次性处理整个列表。\n\
  \n以下是一个使用 `xargs` 的示例：\n\n```bash\ncd /usr\nls gl* | xargs chmod a+r\n```\n\n在这个示例中，我们想为\
  \ `/usr` 下所有以 `gl` 开头的文件添加所有人的读取权限。首先，我们尝试使用通配符 (`gl*`)。由于匹配模式的文件过多，我们得到了 `list\
  \ too long` 错误。如果你在上述步骤在使用 `xargs` 时遇到 `list too long` 错误，请将 `xargs` 改为：\n\n```bash\n\
  xargs -n 20\n```\n\n这会强制 `xargs` 发出多次命令，其中任何一个命令从标准输入中使用最多 20 个参数。UNIX 系统上的 `xargs`\
  \ 通常不需要 `-n` 选项，因为 `xargs` 会自动调整命令行上的参数数量，以确保任何命令都不会遇到 `arg list too long` 错误。\n\
  \n\n\n\n\na. 一个 UNIX 命令以及可能的选项。\n\nb. 由文件名通配符生成的生成列表。\n\n2. 输入一个使用正则表达式通配符生成相同列表的\
  \ UNIX 命令。（在指示之前不要按回车键。）例如，如果你使用此文件名通配符：\n`abc*`\n你可以使用以下命令生成相同的列表：\n```\nls grep\
  \ '^abc'\n```\n（见表 9.10）\n\n3. 输入管道符号 (`|`)，然后输入 `xargs`。\n管道符号周围的空格可选可选。\n\n4.\
  \ 输入一个空格，然后输入步骤 1.a 中的 UNIX 命令和选项。\n\n5. 按回车执行你的命令。\n\n### 表 9.10 文件名通配符到正则表达式通配符的转换。\n\
  \n| 文件名通配符 | 等效正则表达式序列 | 其它 |\n| :--- | :--- | :--- |\n| `abc*` | `ls grep '^abc'`\
  \ | 有更多关于管道的信息，请参阅第 31 页 |\n| `*abc` | `ls grep 'abc$'` | 有更多关于命令行参数的信息，请参阅第 84\
  \ 页 |\n| `*abc*` | `ls grep 'abc'` | |\n| `abc[0-9]` | `ls grep '^abc[0-9]$'` |\
  \ |\n| `[!A-Z]?.c` | `ls grep '^[^A-Z]\\.c'` | |\n\n### 第 10 章 按日期、大小或内容比较文件。\n\
  作者 Steve Moritsugu\n\n按最后修改日期或最后访问日期比较、列出或查找文件\n\n按大小比较、列出或查找文件\n\n显示文本文件中差异的方法\n\
  \n比较非文本文件\n\n比较不同系统上的文件\n\n查找同名的相同文件\n\n### 按修改日期比较文件\n\nUNIX 系统包含许多文件，有时一个项目中就有成千上万个甚至更多。有了这么多文件，用户通常需要以各种方式比较文件。我们可以按日期比较，查看哪些文件修改得最近，或者哪些文件长时间未被访问。我们可以按大小比较，哪些是占用磁盘空间最大的文件。我们经常想要按内容比较，找出重复文件（浪费磁盘空间）。有时我们需要比较两个不同系统之间的文件，查看哪个系统拥有程序的最新副本，或者两个系统是否具有相同的数据。如果你将文件从一个系统传输到另一个系统，比较它们的内容以确保传输成功是非常用的。这些类型的比较是本章的主题。\n\
  \n#### 按修改日期比较文件 (*ls*)\n\n只需列出当前目录下的文件，请使用 `ls` 命令（有关 `ls` 及其选项的信息，请参阅附录）。以下是 `ls`\
  \ 的一些典型输出：\n\n```\ntotal 4 -rw-------  1 lindap  group      552 Feb  1 08:48 acme.linda\n\
  -rw-r--r--  1 samw    prog      552 Aug 13 1996 acme.sam\n-rw-r--r--  1 stevem \
  \ group      420 Feb  1 09:07 report.bak\n-rw-r--r--  1 stevem  group      552 Jan\
  \ 31 18:48 report.sav\n```\n\n查看此输出，我们看到有两个 report 文件。但哪一个是更新呢？有两个 acme 文件，但哪一个是最近被使用过的？\n\
  \n要确定文件最后修改的时间，请使用此命令：\n```\nls -l\n```\n\n`ls` 的 `-l` 选项使其以长格式列出，这提供了关于每个文件的更多信息（包括最后修改日期/时间）。随后你应该会看到类似下面的输出：\n\
  \n\n\n\n\n现在我们可以看到 `report.bak` 最后修改时间是 2 月 1 日上午 09:07。我们知道这是在上午，因为 `ls` 会将晚上 9:07\
  \ 显示为 21:07。注意，它没有显示年份。这可能是指的是前一年的 2 月吗？答案是否定的，因为 `ls` 遵循以下规则：如果事件发生于一年以内，它会显示时间而不是年份；如果事件发生在一年多以前，它会显示年份而不是时间。查看\
  \ `acme.sam` 所在的行，它是一个更旧日期的示例，它显示了年份而不是最后修改时间。\n\n在这种情况下，`ls -l` 显示 `report.bak`\
  \ 包含比 `report.sav` 更新的内容，而 `acme.linda` 比 `acme.sam` 新得多。\n\n按最后修改时间比较文件的一种非常有用的方法是将它们从旧到新（或反之）全部列出来。\n\
  \n```\nls -lt\n```\n\n`-t` 选项导致 `ls` 按日期/时间列出文件，而不是按字母顺序排列。你应该看到按修改日期/时间从新到旧排列的文件，如下：\n\
  \n```\nls -lt total 4\n-rw-r--r--  1 stevem  group          420 Feb  1 09:07 report.bak\n\
  -rw-------  1 lindap  group           552 Feb  1 08:48 acme.linda\n-rw-r--r--  1\
  \ stevem  group          552 Jan 31 18:48 report.sav\n-rw-------  1 samw    prog\
  \            552 Aug 13 1996 acme.sam\n```\n\n如果你最近更改了几个文件并想快速找到它们，这就会很有用。\n\n要将从旧到新的顺序反过来，请使用此命令：\n\
  \n```\nls -ltr\n```\n\n`-r` 选项导致 `ls` 反转其正常顺序（无论是日期/时间还是字母顺序）。字母 `l`、`t` 和 `r` 可以以任何顺序指定。你现在看到的输出如下：\n\
  \n```\nls -ltr total 4\n-rw-------  1 samw    prog            552 Aug 13 1996 acme.sam\n\
  -rw-r--r--  1 stevem  group          552 Jan 31 18:48 report.sav\n-rw-------  1\
  \ lindap  group           552 Feb  1 08:48 acme.linda\n-rw-r--r--  1 stevem  group\
  \          420 Feb  1 09:07 report.bak\n```\n\n这对于寻找长时间未更改的文件可能很有用。\n\n### 按最后访问时间比较文件\
  \ (ls)\n\n要确定文件最后一次访问的时间，请使用此命令：\n\n```\nls -lu\n```\n\n`ls` 的 `-u` 选项将 `-l` 长格式输出更改为显示最后访问的日期和时间，而不是最后修改时间。访问可能意味着有人查看了文件、复制了它、打印了它等，但没有修改它。你应该看到类似下方的输出：\n\
  \n```\nls -lu total 4\n-rw-------  1 lindap  group           552 Feb  1 08:48 acme.linda\n\
  -rw-------  1 samw    prog            552 Feb  3 10:14 acme.sam\n-rw-r--r--  1 stevem\
  \  group          420 Feb  2 12:21 report.bak\n-rw-r--r--  1 stevem  group     \
  \     552 Jan 31 18:48 report.sav\n```\n\n由于这些文件都没有指定年份，我们知道所显示的日期都都在过去一年内。\n\n\
  UNIX 不跟踪文件的创建日期\n\nUNIX 为每个文件维护了第三个日期和时间：最后 inode 更改时间，可以通过向 `ls -l` 添加 `-c` 选项来显示。我曾见过关于该选项显示文件创建日的错误引用。inode（见术语表）在文件创建时会更改，当你更改其所有者、组或权限时也会更改。\n\
  \n和以前一样，通过从最近访问到最久未访问列出文件来比较文件访问是非常用的。添加 `-t` 选项（`ls-t`）按日期/时间列出文件，而不是按名称，即从最近访问到最久未访问。添加\
  \ `-r` 选项（`ls -ltr`）反转顺序，使最先访问的文件首先列出。当你磁盘空间不足并想要归档和清理无人使用的文件时，这可能很有用。`ls` 命令的字母可以以任何顺序指定。\n\
  \n有关所有 `ls` 选项的摘要，请参见第 778 页。\n\n### 比较并查找比给定文件更新的文件 (find)\n\n\n\n\n在实践中，`ls` 命令允许我们比较仅存在于一个目录中的文件。可以使用\
  \ `find` 命令（参见附录）来比较目录子树（或整个系统）中的所有文件，并列出所有比给定文件修改更晚的文件。如果我们想确保给定文件包含最新信息，这将非常有用。\n\
  \n`find` 命令可以在一条命令中搜索系统上的许多目录或所有目录。以下是帮助你组合所需 `find` 命令的步骤。\n\n### 列出比给定文件修改更晚的文件\n\
  \n1. 输入 `find`。\n2. 在接到指示前，不要按回车键。\n3. 输入一个空格，然后输入你想要开始搜索的目录。`find` 也会搜索该目录的所有子目录。要搜索整个系统，请输入\
  \ `/`。\n4. 输入一个空格，然后输入 `-newer`。\n5. 输入一个空格，然后输入给定的文件名。完成此命令输入后，`find` 将显示所有比该给定文件修改更晚的文件。如果文件在当前目录中，只需输入其名称。如果它在当前目录之外的目录，请输入其路径。\n\
  6. 如果需要，你现在可以输入任何其他搜索准则，例如只想查看特定大小、所有者、权限的文件。参见附录中关于 `find` 的条目获取此类选项列表。\n7. 输入一个空格，然后输入\
  \ `-print`。按回车键，完成你的 `find` 命令。`find` 应当显示比给定文件修改更晚的文件列表。你也可以执行更具冒险性的步骤 7，而不是此第\
  \ 6 步。\n8. 输入一个空格，然后输入 `-exec ls -l \\;`。按回车键，完成你的 find 命令。这是完成 find 命令的替代方案（替代步骤\
  \ 6）。这将为你显示与 `ls` 相同的每个文件的详细信息。你也可以输入 `-exec` 后跟一个不同的命令，以便对选定的每个文件执行其他操作。\n\n示例\
  \ 1：\n```\nfind /usr/fred -newer reports/acme -print\n```\n命令中每个单词下方对应的是生成该单词的步骤步骤。此\
  \ `find` 命令将搜索 `/usr/fred` 及其所有子目录，并显示任何比给定文件修改更晚的文件路径。给定文件是当前目录下 `reports` 子目录中的\
  \ `acme` 文件。\n\n示例 2：\n```\nfind / -newer acme -user fred -exec ls -l {} \\;\n```\n\
  这是另一个 `find` 命令。它将在整个系统中搜索任何比当前目录下 `acme` 文件修改更晚的文件。它将忽略任何所有者不是 `fred` 的文件。它将对满足两个条件的文件显示详细的\
  \ `ls` 输出。\n\n`find` 的此 `-newer` 选项适用于增量备份，即你只想备份自上次备份以来更改的文件。你的备份脚本在备份时应该修改一个虚拟文件。使用\
  \ `find` 命令找到所有自该虚拟文件以来修改过的文件。然后使用 `cpio` 备份由该 `find` 生成的所有文件名。\n\n**另参：**\n在本章中，你已经了解了如何使用\
  \ `ls` 命令按日期列出文件来比较文件，这样你就可以轻松挑选出最近访问或最少访问的文件，以及最近修改或最少修改的文件。使用 `ls` 命令无法比较多个目录中的文件。\n\
  \n`find` 命令可以访问整个目录子树或整个系统。`find` 可以显示所有在 `x` 天前访问或修改的文件。以下是帮助你组合所需 `find` 命令的步骤。\n\
  \n### 列出访问/修改时间早于/晚 x 天的文件\n\n1. 输入 `find`。\n2. 在接到指示前，不要按回车键。\n3. 输入一个空格，然后输入你想要开始搜索的目录。`find`\
  \ 也会搜索该目录的所有子目录。要搜索整个系统，请输入 `/`。\n4. 输入一个空格，然后输入 `-atime`、`-ctime` 或 `-mtime`。\n\
  \   - `atime` 检查最后访问日期/时间。\n\n\n\n\n## 文件属性\n\n- `mtime` 检查最后修改日期/时间。\n- `ctime`\
  \ 检查最后索引节点（inode）更改日期/时间。\n\n4. 输入空格，然后输入加号或减号，再输入要检查的天数。\n   - `-atime +90` 意味着最后访问是在\
  \ 90 天以前；即在过去的 90 天内没有被过。\n   - `-mtime -7` 意味着最后修改是在 7 天内。\n5. 如果需要，你现在可以输入任何其他所需的搜索标准，以便只查看特定大小、所有者、权限等的文件。参见附录中关于\
  \ `find` 的条目以获取此类选项列表。\n6. 输入空格，然后输入 `-print`。\n   按回车，完成你的 `find` 命令。此时 `find`\
  \ 将显示比给定文件修改更晚的文件列表。你也可以选择更具挑战性的第 7 步，而不是第 6 步。\n7. 输入空格，然后输入 `-exec ls -l {} \\\
  ;`。\n   按回车，完成你的 `find` 命令。这是完成 `find` 命令的第 6 步替代方案。这将向你显示与 `ls -l` 相同的每个文件的详细信息。如果需要，你也可以输入\
  \ `-exec` 后接不同的命令，对每个选定的文件执行其他操作。参见附录中关于 `find` 的条目获取更多关于 `-exec` 的信息。\n\n这是一个之前的\
  \ `find` 命令示例。它将搜索目录 `/usr/fred` 及其所有子目录。它将显示任何最后访问在 90 天以前的文件路径名；即在过去的 90 天内未被访问的文件。\n\
  \n```bash\nfind /usr/fred -atime +90 -print\n```\n\n这是另一个 `find` 命令。它将在整个系统中搜索任何在\
  \ 7 天内修改过且由用户 `fred` 拥有的文件。它将显示任何匹配文件的详细输出。\n\n```bash\nfind / -mtime -7 -user fred\
  \ -exec ls -l {} \\;\n```\n\n为了比较所有文件并找到哪些是最近被访问（或修改）的，在你的 `find` 命令的 `-atime`、`-mtime`\
  \ 或 `-ctime` 选项中选择一个合适的数字数值是非常重要的。某些值可能会找到太多文件，因此无法准确定你正在寻找的极端文件。其他值可能过于极端，导致找不到匹配的文件。继续调整你的天数值，直到得到你想要的结果。\n\
  \n另另参见：有关 `find` 命令的更多信息，请参见第 770 页\n\n按大小比较文件\n\n就如同按日期比较文件一样，当我们按大小比较文件时，我们通常想挑选出最大的文件。我们可以使用\
  \ `ls` 命令挑选出一个目录中最大的文件。我们也可以使用 `find` 命令搜索整个目录树或整个系统，以定位最大或最小的文件。\n\n### 确定文件大小\n\
  \n要确定当前目录下文件的字符数大小，请使用以下命令：`ls` 的 `-l` 选项会产生类似下面的详细输出：\n\n```\ntotal 3\n-rw-r--r--\
  \ 1 users 17157 Feb 1 11:31 report02\n-rw-r--r-- 1 users 19728 Feb 1 11:31 report04\n\
  -rw-r--r-- 1 users 196484 Feb 1 11:33 report07\n```\n\n在前面的示例中，`report07` 是最大的文件，有\
  \ 196,484 个字符。\n\n### 按大小列出文件\n\n按大小比较一组文件的最佳方法之一是使用 `ls` 并将其输出通过到 `sort` 命令。在文件按大小排序列出后，比较它们并快速确定最大或最小的文件要容易得多。\n\
  \n```bash\nls -l | sort -bn +4\n```\n\n`|` 符号使用管道（见术语表）获取 `ls -l` 的输出并使用 `sort`\
  \ 命令（见附录）对其处理。这里使用的 `sort` 选项有：\n- `+4`: 忽略前四个字段，因此按大小进行排序。\n- `-b`: 批量排序（Batch\
  \ sort）。\n- `-n`: 数值排序。\n\n\n\n\n\n-   按数字排序，而非字母排序\n-   `-b`\n-   忽略大小前面的领先空格\n\
  \n我们将看到类似如下的输出：\n```\ntotal 3 -rw-r--r--  1 mori      users           1972 Feb \
  \ 1 11:31 report04\n-rw-r--r--  1 mori      users           17157 Feb  1 11:31 report02\n\
  -rw-r--r--  1 mori      users         196484 Feb  1 11:33 report07\n```\n\n要按从大到小的顺序列出文件，请使用此命令：\n\
  ```bash\nls -l | sort -bnr +4\n```\n为 `sort` 添加 `-r` 选项会反转顺序，因此文件将按从大到小列出。\n\n**另参**\n\
  *有关管道的更多信息，请参阅第 26 页*\n*有关 `sort` 命令的更多信息，请参阅第 202 页*\n\n### 按大小查找文件\n\n你也可以使用 `find`\
  \ 命令来列出所有大于或小于给定块大小的文件。`find` 会在一个命令中搜索系统上的许多或所有目录。以下是帮助你编写所需的 `find` 命令的步骤。\n\n\
  #### 列出大于或小于给定大小的文件\n\n1. 输入 `find`。\n2. 在接到指示前不要按回车键。\n3. 输入一个空格，然后输入你想要开始的目录。`find`\
  \ 也会搜索该目录的子目录。要搜索整个系统，请输入 `/`。\n4. 输入 `-size`。\n5. 输入 `+number` 或 `-number`。`+600`\
  \ 表示文件大于 600 块。`-200` 表示文件小于 200 块。大多数系统假设每个块为 512 字节（即字符），但某些系统每个块使用 1024 字节。检查你系统上\
  \ `find` 的帮助页，查看 `-size` 选项每个块使用多少字节。\n\n为了帮助你将 MB（兆字节）转换为块，这里有两个粗略的经验法则：\n- 2000\
  \ 个 512 字节的块 = 1MB（约）\n- 1000 个 1024 字节的块 = 1MB（约）\n\n例如，要查找约 10MB 或更大的文件，我会指定 `+20000`\
  \ 个 512 字节块或 `+10000` 个 1024 字节块。\n\n5. 如果需要，你现在可以输入任何其他搜索标准，以便只查看特定大小、所有者、权限等的文件。查看附录中关于\
  \ `find` 的条目获取此类选项列表。\n6. 输入 `-print`。\n按回车键，完成你的 `find` 命令。你也可以采取更具冒险性的第 7 步代替第\
  \ 6 步：\n7. 输入 `-exec ls -l {} \\;`。这是第 6 步的替代。你也可以使用 `-exec` 后接不同的命令对每个文件执行某些操作。这将显示\
  \ `ls -l` 显示的输出。（第 26 页）查看 `find` 条目以获取有关 `-exec` 的更多信息。这里是另一个示例：\n```bash\nfind\
  \ /usr/bin -size +600 -print\n```\n这将在 `/usr/bin` 中搜索大于 600 块的文件并显示其路径。\n```bash\n\
  find / -size -200 -group acct -exec ls -l {} \\;\n```\n这将在系统中搜索小于 200 块且同样属于 `acct`\
  \ 组的文件，并产生与 `ls -l` 显示相同的输出。\n\n\n\n\n\n# 显示两个文件的差异 (*diff*)\n\n要显示两个文本文件之间的差异，请使用此命令：\n\
  \n```bash\ndiff file1 file2\n```\n\n你应该看到类似下面的输出：\n\n```\n287c287\n<          Now\
  \ is the time for all good men to come to the ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)aid\
  \ of\n>          Now is the time for all good men to go to the aid\n```\n\n由于在这个示例中\
  \ `diff` 的输出很少，这意味着这两个文件非常相似。`diff` 输出大量内容则说明文件之间差异很大。如果在下一个 shell 提示符出现之前没有任何输出，则说明两个文件是完全相同的。\n\
  \n在 `diff` 找到两个文件之间的任何差异后，它会向前查看两个文件，尝试寻找一个文件中的后续行是否匹配另一个文件的后续行。通过这种方式，它可以识别新增的行、删除的行和修改的行。以\
  \ `<` 符号开头的行来自第一个文件。`>` 符号表示第二个文件中不同的行。系统只显示不同的行。上面的示例显示，两个文件之间的唯一区别是第一个文件中的单词 *come*\
  \ 在第二个文件中被改为 *go*。\n\n在前面的输出中，`287c287` 表示将第一个文件转换为第二个文件的指令。在这种情况下，`c` 表示第一个文件的第\
  \ 287 行必须更改以匹配第二个文件的第 287 行。其他可能的指令是 `a`（添加行）和 `d`（删除行）。在实践中，大多数 UNIX 用户会查看显示的行差异，并忽略除行号信息以外的指令。\n\
  \n使用 `diff` 的 `-b` 选项可以使其忽略行末尾的空格和制表符。它会将任何连续的空格和制表符视为一个空格。如果你想比较两个文件，但想忽略其中一个文件的左侧（即空格更多）比另一个文件大的事实，这就会非常有用。\n\
  \n# 并排显示差异 (*sdiff*)\n\n要并排显示两个文件之间的差异，请使用此命令：\n\n```bash\nsdiff file1 file2\n```\n\
  \n你应该看到类似下面的输出：\n\n```\nreport02          report07          report05\nreport09 \
  \         <\nreport04          report03          report03 >report01\n```\n\n左列显示第一个文件的行。右侧列显示第二个文件的行。`<`\
  \ 符号显示出现在第一个文件但不在第二个文件中的行。`>` 符号显示出现在第二个文件但不在第一个文件的行。`|` 符号显示两个文件之间不同的行。`sdiff`\
  \ 适用于比较短单词列表或文件名列表，但对于较长的行，可能非常难以阅读。\n\n# 显示三个文件之间的差异 (*diff3*)\n\n要显示三个文件之间的差异，请使用此命令：\n\
  \n```bash\ndiff3 file1 file2 file3\n```\n\n这里显示了三个文件的内容：\n\n表 10.1 三个文件的内容\n\n|\
  \ file1 | file2 | file3 |\n| :--- | :--- | :--- |\n| green | green | yellow |\n\
  | blue | blue | blue |\n| red | red | green |\n| yellow | yellow | brown |\n| blue\
  \ | blue | tan |\n| green | green | red |\n| brown | brown | orange |\n| pink |\
  \ azure | black |\n| red | red | gray |\n| orange | orange | |\n| black | black\
  \ | |\n| gray | gray | |\n\n该命令将产生如下输出：\n\n```\n====3 1:1,3c\n2:1,3c\n  green\n\
  \  blue\n  red\n3:0a\n====\n1:8c\n  pink\n2:8c\n  azure\n3:5c\n  tan\n```\n\n`====`\
  \ 分隔在三个文件中找到的每个差异部分。`====n` 表示文件 *n* 与其他两个文件不同。`====` 表示三个文件在这一部分都不同。以下是对上述 `diff3`\
  \ 输出的注释：\n\n====3 表示文件 3 与另外两个文件不同，如下 ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)：\n\
  \n1:1,3c 表示文件 1 的第 1 至 3 行的内容与以下文件相同：\n\n2:1,3c 表示文件 2 的第 1 至 3 行包含这 3 行\n\n\n\n\
  \n如下所示的行：\ngreen\nblue\nred\n\n`3:0a` 意味着文件 `3` 必须在第 `0` 行之后添加上述 3 行，才能与另外两个文件相同。\n\
  \n`====` 意味着三个文件在接下来的区域均不同：\n\n`1:8c` 意味着文件 `1` 的第 `8` 行包含：pink\n`2:8c` 而文件 `2`\
  \ 的第 `8` 行包含：azure\n`3:5c` 而文件 `3` 的第 `5` 行包含：tan\n\n# 在排序后的文本文件中查找共同和唯一的行 (*comm*)\n\
  \n如果两个文本文件按排序（即按字母顺序）排列，`comm` 命令可以轻松地显示两个文件中共同的以及唯一的行。要执行此操作，请输入以下命令：\n\n```bash\n\
  comm file1 file2\n```\n\n你应该看到类似下面的输出：\n\n```\nreport21 report23\nreport29 report33\
  \ report34\nreport35 report91\n```\n\n最左侧列显示第一个文件特有的行；因此，`report23`、`report34` 和\
  \ `report91` 只存在于第一个文件。中间列显示第二个文件特有的行；所以 `report29` 和 `report37` 只存在于第二个文件。第三列显示两个文件共同的行。在这种情况下，`report21`、`report33`\
  \ 和 `report35` 存在于两个文件中。\n\n我们可以为 `comm` 添加选项来抑制一或多列，如下：\n\n```bash\ncomm -1 file1\
  \ file2 # 抑制第 1 列，因此显示第 2 和 3 列\ncomm -23 file1 file2 # 仅显示文件 1 特有的行\ncomm -13 file1\
  \ file2 # 仅显示文件 2 特有的行\ncomm -2 file1 file2 # 仅显示共同行\n```\n\n记住，文件必须处于排序状态 `comm`\
  \ 才能工作。如果你有两个未排序的文件需要比较，可以使用 `sort` 命令（见附录）创建这些文件的排序版本，然后在排序后的版本上使用 `comm` 命令。\n\
  \n如果开头有制表符，请不要使用 `comm`。`comm` 使用一个制表符来开始中间列的行，使用两个制表符来开始右列的行。如果你的文件以一个或多个制表符开头，`comm`\
  \ 的输出将是不正确的。\n\n# 通过内容比较任意类型 (*cmp*)\n\n要比较任何类型的文件（即使它们不是文本文件），请使用此命令：\n\n```bash\n\
  cmp file1 file2\n```\n\n你应该看到类似下面的输出：\n\n```\nfile1 file2 differ: char 26, line\
  \ 3\n```\n\n如果 `cmp` 在没有显示任何消息的情况下返回到 shell 提示符，则文件是完全相同的。`cmp` 在找到第一个差异后停止，因此它不会告诉你是两个文件有多相似。使用\
  \ `cmp` 的 `-l` 选项列出两个文件之间所有的差异。\n\n# cmp 对比 diff\n\n如果你只想知道两个文件是否相同，`cmp` 比 `diff`\
  \ 更快，因为它在发现第一个差异时就会停止。`cmp` 适用于所有类型的文件；`diff` 仅处理文本文件。然而，`diff` 会显示实际差异。`cmp` 不尝试输出差异。在二进制文件上使用\
  \ `diff` 可能会让屏幕处于未知状态。\n\n# 比较不同系统上的文件\n\n如果你将文件传输到另一个系统，你可能想验证文件是否完整到达。`diff`、`sdiff`\
  \ 和 `cmp` 只能比较相同系统上的文件。要比较存在于不同系统的两个文件，请在系统上运行此命令：\n\n```bash\nsum -r filename\n\
  ```\n\n你应该看到类似下面的输出：\n\n```\n35424 14 filename\n```\n\n\n\n\n`sum` 命令会对文件的完整内容计算校验和（参见术语表）。在前面的输出中，35424\
  \ 是该文件的校验和。14 是以块（blocks）为单位的大小。如果两个文件的校验和不匹配，则这两个文件不相同。如果校验和相同，则这两个文件相同的概率极高。校验和算法（即计算方法）在几乎所有类型的\
  \ UNIX 系统上都是相同的，允许即使 UNIX 系统类型不同，也可以比较远程文件。\n\n### 概率有多大？\n\n`sum` 产生的校验和范围最高可达约\
  \ 65,000。通常情况下，如果两个文件的校验和相同，那么它们内容仍然不同的概率只有 65,000 分之一。\n\n请注意，`sum` 报告的块大小在两种不同类型的\
  \ UNIX 系统之间可能存在两倍差异。这是因为某些 UNIX 系统使用每块 512 字节来计算文件大小，而另一些系统则使用每块 1024 字节。例如，SunOS\
  \ Version 4（基于 BSD）使用每块 1024 字节，而使用 SunOS Version 5（基于 System V）的 Solaris 2.x 则使用每块\
  \ 512 字节。请注意，`sum` 命令使用的字节块大小可能与在向文件添加额外块时使用的内部逻辑块大小不同。\n\n`sum` 的 `-r` 选项使其使用更好的（循环的）校验和计算方法，该方法能够更好地检测文件顺序及内容上的差异。如果你想额外确认两个文件是否相同，可以利用这两种不同的计算方法，如下：\n\
  \n### 采取额外步骤以确保文件相同\n\n1. 在第一个系统上，执行以下操作：\n```\nsum filename sum -r filename\n```\n\
  2. 在第二个系统上，执行相同的操作：\n```\nsum -r filename sum -r filename\n```\n3. 检查两个 `sum` 计算的结果是否相同。检查\
  \ `sum-r` 计算的结果是否相同。注意，`sum` 的结果不应与 `sum -r` 的结果匹配。\n4. 如果两种类型的校验和都匹配，则文件是相同的（概率极高）。虽然存在极小的概率两个文件不同但仍产生相同的校验和，但两个不同的文件同时符合这两种方法的可能性极低。\n\
  \n### 寻找不同名称下的相同文件\n\n要快速确定目录中哪些文件是相同的，请使用此命令：\n```\nsum -r *\n```\n你应该看到类似下面的输出：\n\
  ```\n22792 192 acme.980201\n6948 21 report02\n14252 15 report04\n22792 192 report05\n\
  ```\n如果输出超出了屏幕，请重新运行命令并将输出通过到 `less`。在前面的示例中，`acme.980201` 和 `report05` 具有相同的校验和块大小。因此，它们极可能是相同的。如果我们需要\
  \ 100% 确定，可以在这两个文件上使用 `diff` 或 `cmp`。`report02` 和 `report04` 的校验和与其他文件不同，因此无法与它们或相互匹配。你可以使用\
  \ `*` 以外的通配符来生成需要校验和的文件列表。\n\n**另请参**\n*有关如何使用通配符创建文件列表的更多信息，请参第 232 页*\n\n\n\n\n\
  # 关注危险的 SUID、SGID 权限\n\n## 登录安全 - 第 274 页\n\n当你想要登录 UNIX 系统时，系统会提示你输入登录名和密码。登录名是你在该\
  \ UNIX 系统上的唯一标识。密码是你账户的密钥，如果经过仔细选择，它就能保证除 `root` 之外的任何人都无法访问你的个人文件。。\n\n### 更改你的登录名\n\
  \n系统管理员可以更改你的登录名，但正如前文所述，这并不被建议。\n\n你可以自己更改密码，但你的登录名将永远不变。如果你更改了登录名，你的电子邮件地址也会随之改变，人们将不知道如何在计算机上联系你。你可以将登录名看作你的个人姓名，而将密码看作你家里的钥匙。\n\
  \n### 无效登录后的延迟\n\n如果你输错了密码，会收到一条信息显示登录无效。在几秒钟延迟之后，计算机会再次要求你输入登录名和密码。\n\n设置这种延迟是为了防止有人反复尝试使用不同的密码登录你的账户。有了延迟，一个程序每小时只能尝试大约\
  \ 500 种不同的密码。如果没有这种延迟，这样的程序每小时可能会尝试超过一千次密码。\n\n### 次级密码 - 第 275 页\n\n在某些系统中，当你想要使用调制解调器、传真机或其他设备时可能会遇到密码。当你想要启动受许可并因此限制的程序时，也可能遇到密码。\n\
  \n对设备设置密码的原因可能是为了将设备限制给特定的人群。例如，可以将调制解调器的使用限制仅限于大学员工，而不是学生用户。\n\n这种限制可以通过在设备所在的组中设置组来实现。这样，只有该组的成员才对设备具有读写写/执行权限。与组方案相比，设备上的密码限制有一个主要优势：即，即使有人猜中了你的登录密码，他在使用该设备之前，仍然必须猜中该设备的密码。此条的教训是：不要将你的登录密码作为次级密码的相同密码。如果你这样做，安全性将会受到破坏。\n\
  \n### 密码老化 - 第 276 页\n\n在某些系统中，你的密码有效期有一个最长时间，到期后系统会要求你更改。这种设计旨在提高系统的安全级别，主要通过两种方式实现：\n\
  \n当你定期更改密码时，别人可能（从你肩后）获知你密码的机会就会减少。某人可能需要多次尝试才能窃取完整的密码，因此定期更改减少了密码被完全窃取的概率。\n\n\
  如果有人获取了你密码的加密版本（加密密码的描述将在本章稍后的部分出现），他可能会通过对单词进行加密并将加密结果与你密码的加密版本进行比较，从而系统地尝试破解你的密码。每个密码的使用时间越短，别人通过这种方式破解你密码的机会就越小。\n\
  \n除了限制密码的最长有效期外，某些系统还限制了密码的最短有效时间。这是为了确保你不会有一个一直坚持要使用的偏好密码。这可以防止你在系统提示更改密码时使用一个虚假密码，然后迅速切换回你喜爱的密码。\n\
  \n只要按照下一节描述的方法妥善使用密码，在系统每次要求你更改密码时，选择一个新密码应该并不困难。妥善使用密码可以增加安全性，确保其他人无法访问你的个人文件、电子邮件账户等。\n\
  \n### 更改你的密码\n\n你想要更改密码的原因有以下几个：\n\n* 因为你怀疑有人猜中了你的密码，或者目睹了你输入密码\n* 因为系统要求你定期更改密码\n\
  * 因为提供给你的初始密码难以记忆，或者系统要求在首次登录时必须更改密码\n\n\n\n\n# 密码安全\n\n从技术上讲，三到七个字母的密码也是合法的，但黑客可能会优先尝试这些密码。如果他们拥有你密码的加密版本，只需要几个小时到几天就能猜出这些密码。\n\
  \n- 选择一个至少八个字符的密码（只有前八个字符有效，但如果你觉得更多字符更容易记忆，欢迎使用八个以上的字符）。\n- 使用小写字母和大写字母。\n- 使用键盘上非字母的字符。例如，数字或某些特殊字符（如美元符号、引号或小于号）都是密码的良好补充。\n\
  - 选择一个不在字典、书籍或任何可能通过电子方式获取的文本中的密码。\n- 选择易记密码有几条良好的规则：取一首诗、格言或歌曲中每个单词的首字母，并将其中一些字母大写（可能在中间某包含一个非字母）。例如，使用“There\
  \ is more to love than meets girl”这个短语，它可以为你生成密码 `TimTbmg`（注意这个密码长度为九位，所以最后的 `g`\
  \ 可以省略，但包含它可能会更容易记忆）。\n- 选择两个相互相关的单词并用非字母将它们结合。例如，`dog` 和 `capital`，可能会生成密码 `cApI`、`dOg=capi`\
  \ 或 `dogcapital`。如果你选择两个对你来说有某种联系（但其他人不知道）的单词，可能会更容易。使用上一个例子，你可能在访问完首府的某人后的周末买了一只狗！\n\
  \n选择好好密码后，是时候真正更改你的登录密码了。根据你的系统，你应该使用 `ypasswd`、`nispasswd` 或 `passwd`。如果你不知道应该用哪一个，请先尝试\
  \ `ypasswd` 和 `nispasswd`；如果这两个命令的结果都未找到，请尝试 `passwd`。\n\n当你调用适当的命令后，系统会要求你输入旧密码。（通过先要求旧密码，即使别人发现了你忘记注销的终端，也无法更改你的密码。）接下来，系统会要求你输入新密码。最后，系统会要求你重新输入新密码，以确保你没有输入错误。\n\
  \n## 谁能看到你的密码？\n\n为了完全理解你的密码有多秘密（或多不秘密），你需要了解密码机制的工作原理。当你选择一个新密码时，它会被加密为一个文本字符串并保存在系统上。无法进行逆运算——也就是说，给定一个加密的密码，你无法找到未加密的版本（技术上讲，这是可能的，但概率极低。这种过程即使在最快的计算机上也可能需要数千年）。当你想要登录系统时，未加密的密码（即你登录时输入的密码）将与计算出的加密版本进行匹配。\n\
  \n在旧的 UNIX 系统中，加密后的密码位于 `/etc/passwd` 文件，而每个人都可以读取该文件。这产生了一个潜在的安全漏洞；访问系统的用户可以使用前面描述的方法破解其他用户的密码。后来开发了一种许多系统今天仍在使用的新方法，被称为“影子密码”（shadow\
  \ passwords）。其核心思想是将加密密码从 `/etc/passwd` 文件中移除，并将其隐藏在一个仅供 root 和登录程序（即 SUID root\
  \ 程序）可读取的文件中。要检查你的系统是否使用影子密码，可以查看 `/etc/passwd` 文件。如果第二个字段包含 13 个字母（看起来是随机的），那么它就不是（这\
  \ 13 个字母实际上是你的加密密码）。\n\n## 允许用户成为另一个用户或 root (su)\n\n有时，你想访问另一个用户的文件或以另一个用户的身份运行程序。一种方法是……\n\
  \n\n\n\n\n实现这一点的方法是注销并让用户在你的终端上登录。然而，有一种更简单的方法！使用 `su`（切换用户）命令，你可以将 shell 所有者更改另一个用户。\n\
  \n输入 `suusername` 会将 shell 的所有者更改为用户 `username`。如果你不提供用户名，将切换到 root。在输入 `su` 命令后，你自然需要提供指定用户的密码。\n\
  \n当你使用 `su` 更改 shell 的所有权时，shell 仍然知道原始用户是谁（由于环境变量的原因）。这有时可能是一个理想的效果，有时则不是。如果你希望在在使用\
  \ `su` 时重置所有环境变量，你应该提供一个连字符作为参数，即 `su -username`。\n\n# 系统组规划\n\nUNIX 系统上的每个文件恰恰属于一个用户和一个组。这种所有权决定了谁可以读取和编辑该文件，如果该文件是执行文件，则谁可以执行它。目录具有类似的权限，你稍后会看到。\n\
  \n通过使用带有适当选项的 `ls` 命令可以看到所有权信息：\n\n```\nls -ldg security.html -rw-r--r--  1 blackie\
  \ users      12383 Mar 15 10:27\n```\n![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)security.html\n\
  \n在第一列中，你可以看到文件的权限；在第三列中，你可以看到文件的所有者（blackie 就是我）；在第四列中，你可以看到文件所属的组。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n## 查找文件名\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n第二列是给定文件的数字。如果这是一个普通文件，则它是该文件的硬链接数。对于目录，这个数字是二 加上子目录的数量；每个子目录都通过 `..` 链接到该目录，而它所在的目录则以目录名对其进行引用。\n\
  \n如果几个人需要处理一组文件，他们并不需要以同一个用户的身份登录。相反，应该创建一个组，并将文件集放在该组中并赋予适当的权限。例如，你需要为用户和组设置读取和写操作权限。组不能由普通用户维护，但必须由超级用户（`root`）管理。作为普通用户，你可能同时处于多个组中。要查看你所在的组，请输入\
  \ `groups`。\n\n### 理解文件和目录权限\n\n在以下章节中，我们将使用 `file` 一词泛指文件和目录，使用 `plain file` 指代文件（不是目录）。在上节中，你看到\
  \ `ls` 可以告诉你关于文件的权限信息：\n\n```\nls -ldg security.html -rw-rr  1 blackie users   \
  \   12383 Mar 15 10:27\n```\n![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)security.html\n\
  \n这些权限信息分为四组。![![227-0280a.gif](img/910f4379734630b0f5124fbc70f719a.gif) 图 1。第一个字符表示文件类型：\n\
  \n- `d` 表示目录\n- `-` 表示普通文件\n- `s` 表示符号链接\n- `b` 表示块特殊设备\n- `c` 表示字符特殊设备\n\n最后两种类型通常在\
  \ `/dev` 目录中看到。接下来是三个三个字母组成的块。第一个块控制文件所有者的权限，第二个块控制与文件同组的人员的权限，第三个块控制其他人（即既不是文件所有者也不是文件所在组的人）的权限。\n\
  \n在这三个块中，用连字符代替字母表示该位置本可能出现的字母缺失。这确保了 `ls` 的输出始终具有相同的宽度，并且第四位置的字母始终保持不变。三个块中每个块的第一个字母可能是字母\
  \ `r`，它表示文件的读取权限。普通文件（即不是目录）的读取权限意味着该块描述的人员可以读取该文件。\n\n\n\n\n\n目录的读取权限表示目录的内容可以被列出——也就是说，有人可以看到目录中包含哪些文件。这并不意味着文件的内容可以被读取，或者文件的属性可以被列出。\n\
  \n三个块中的每个块的第二个字母可以是字母 `w`，表示写权限。对于普通文件，这表示该文件可以被编辑。对于目录，这意味着可以在目录中创建新文件。\n\n每个组的第三个字母表示执行权限。如果它是字母\
  \ `x`，则具有以下含义：对于普通文件，该文件是一个程序，可以通过在命令行输入其名称来执行。对于目录，你可以访问其内容——也就是说，当开启 `x` 权限时，你可以执行以下操作：\n\
  \n- 你可以读取文件内容（如果文件允许读取）。\n- 你可以进入子目录（使用 `cd`），前提是该子目录允许这样做。\n- 你可以获取关于目录内容的信息（例如文件权限、创建日期和大小）。\n\
  \n第三个字母也可能指代其他内容，见下表。\n\n### 表 11. 执行位的附加选项\n\n| 类型 | 用户 | 组 | 其他 |\n| :--- | :---\
  \ | :--- | :--- |\n| **文件** | `s`: 1) 文件对用户有 `x` 权限。2) 该文件是一个 SUID 程序。 | `S`: 1)\
  \ 文件对用户没有 `x` 权限。2) 该文件是一个 SUID 程序。 | `s`: 1) 文件对组有 `x` 权限。2) 该文件是一个 SGID 程序。 |\
  \ `S`: 1) 文件对组没有 `x` 权限。2) 该文件是一个 SGID 程序。 |\n| **目录** | `s`: 1) 目录对组有 `x` 权限。2)\
  \ 在此目录中创建的新文件，其组所有权将设置为目录（而不是用户的默认组）。 | `S`: 1) 目录对组没有 `x` 权限。2) 在此目录中创建的新文件，其组所有权将设置为目录（即不是用户的默认组）。\
  \ | `t`: 1) 目录对其他人有 `x` 权限。2) 其他人可以在目录中创建新文件，但不能删除他人的文件。 | `T`: 1) 目录对其他人没有 `x`\
  \ 权限。2) 其他人可以在目录中创建新文件，但不能删除他人的文件。 |\n\n### SUID/SGID 程序\n\n正如你之前通过 `su` 命令所看到的，你可以将\
  \ shell 的身份更改为另一个用户。然而，这要求你知道另一个用户的密码，除非你已经是 root 用户。在某些特定情况下，这种限制是不可接受的，如下例所示。\n\
  \n名为 `/etc/passwd` 的密码文件仅允许 root 写（也就是说只有 root 可以编辑此文件）。当你想要更改密码时，必须更改此文件的内容。这是通过\
  \ `passwd` 程序实现的，它是一个 SUID 程序（设置用户 ID）。当该程序被执行时，进程的身份会从你变为 root。这种身份转变发生时不会你询问密码。`passwd`\
  \ 程序是通过 `chmod` 程序被设置为 SUID 程序的。同样，一个程序也可以在执行时切换用户组。这样的程序被称为 SGID 程序。\n\n### 粘滞位保护你的文件\n\
  \n对目录具有写权限的用户对该目录拥有有效的管理控制权。除了创建文件外，这些用户还可以删除和重命名其他用户的文件，即使他们没有修改这些文件。\n\n这可能会产生一个问题，例如如果你是大学的一位老师，想创建一个让学生存放作业的目录。问题在于，如果你给了学生了该目录的写权限，他们也将获得该目录的管理控制权，从而拥有删除其他学生作业的能力！\n\
  \n解决这个问题的办法是在目录上设置粘滞位（sticky bit）。这赋予了学生对目录的写权限，但没有赋予他们管理控制权。在这种情况下，你按照如下方式设置权限：\n\
  \n```\nchmod u=rwx,og=wxt directory\n```\n\n这提供了 `drwx-wx-wt` 权限。我特意去除了组和其他人的读取权限。这样一来，学生就无法看到目录中的文件，从而无法知道是谁提交了作业。\n\
  \n\n\n\n\n当你为特定作业设置好小组后，为该作业的文件应以该小组的组身份创建。这可以通过三种方式实现：\n\n1. 你可以创建文件并在稍后使用 `chgrp`\
  \ 命令更改它们的组身份。\n2. 你可以更改新创建的文件所所属的默认组。这可以通过 `newgrp` 命令完成，但它只在你调用 `newgrp` 命令的 shell\
  \ 中生效。要通过这种方式更改用户组，只需调用命令 `newgrp group` 即可。\n3. 你可以在目录上设置 SGID 位。通过这种方法，在该目录中创建的新文件将具有与目录相同的组身份；因此，它们不会共享创建者的组身份。若要为目录设置\
  \ SGID 位，请输入 `chmod g+s directory`。\n\n### 目录的读取和执行权限\n\n许多人对目录的读取权限和执行权限的使用感到困惑。让我们仔细观察以下四种情况。\n\
  \n### 没有读取权限且没有执行权限\n在这种情况下，该目录是关闭的。\n\n### 具有读取权限和执行权限\n在这种情况下，该目录允许列出文件内容、列出目录内容以及访问子目录（如果子目录允许此类）。\n\
  \n### 具有读取权限但没有执行权限\n这是一个很少发生的奇特情况。用户可以看到文件名，但无法访问它们、获取其属性信息，也无法进入子目录。\n\n### 没有读取权限但具有执行权限\n\
  在这种情况下，用户可能无法列出目录内容，但如果他们知道文件名，则可以访问文件。这在你的主目录上设置这种权限非常方便。例如，通过这种权限，人们最终可能会进入目录并看到你的\
  \ .emacs 文件（如果该文件具有权限），但他们可能看不到你拥有的其他文件。换句话之，用户只能看到你告诉他们你拥有且他们有权限查看的文件。\n\n# 修改权限/所有者/用户组\n\
  \n可以使用 `chmod` 命令更改文件和目录的权限。该命令既可以使用数字参数（精确说明权限应该是什么），也可以使用符号参数（可以只更改部分权限，例如仅更改用户的权限）。\n\
  \n只有拥有给定文件所有者的用户才能更改该文件的权限。（当然了，该规则的例外是超级用户，他可以做任何事情！）\n\n`chmod` 程序通过使用 `-R` 选项（R\
  \ 代表递归）更改层级结构中所有文件的权限。\n\n### 使用数字模式设置权限 (chmod)\n\n`chmod` 命令使用数字来更改文件和目录的权限。这是设置权限的一种非常方便（且快速）的方法。其思想是用四个数字来描述权限，其中每个数字描述一个组：\n\
  \n1. SUID、SGID 和粘滞位 (sticky bit)\n2. 文件所有者的权限\n3. 组的权限\n4. 其他人的权限\n\n在每个组中，每个选项都关联着一个数字。组的值是权限和。第一组中的可用选项包括：\n\
  1. 目录粘滞位\n2. SGID 位\n3. SUID 位\n\n因此，如果你想让文件具有 SUID 和 SGID，你应该使用数字 6（即 2+4）。如果你不想选择这三个选项中的任何一个，则应该使用\
  \ 0。\n\n三个权限块中的每个块的可用选项包括：\n1. 执行权限\n2. 写入权限\n3. 读取权限\n\n因此，如果你想为名为 `myfile` 的文件赋予用户读写权限，而仅赋予组和其他人读取权限，你应该执行以下命令：\n\
  \n\n\n\n\n```bash\nchmod 0644 myfile.\n```\n\n前导零可以省略，因此以下命令与之前的命令相等：\n\n```bash\n\
  chmod 644 myfile.\n```\n\n表 11.2 和 11.3 显示了给定选项的数值表示。\n\n### 表 11.2 SUID、SGID 和粘滞位（Sticky\
  \ bits）。\n\n| 数值 | 描述 |\n| :--- | :--- |\n| 0 | -SUID -SGID -Sticky bit |\n| 1 |\
  \ -SUID -SGID +Sticky bit |\n| 2 | -SUID +SGID -Sticky bit |\n| 3 | -SUID +SGID\
  \ +Sticky bit |\n| 4 | +SUID -SGID -Sticky bit |\n| 5 | +SUID -SGID +Sticky bit\
  \ |\n| 6 | +SUID +SGID -Sticky bit |\n| 7 | +SUID +SGID +Sticky bit |\n\n### 表 11.3\
  \ `chmod` 命令的权限数值表示。\n\n| 数值 | 描述 |\n| :--- | :--- |\n| 0 | -r -w -x |\n| 1 | -r\
  \ -w +x |\n| 2 | -r +w -x |\n| 3 | -r +w +x |\n| 4 | +r -w -x |\n| 5 | +r -w +x\
  \ |\n| 6 | +r +w -x |\n| 7 | +r +w +x |\n\n## 使用符号模式 (`chmod`) 设置权限\n\n在上一节中，你已经了解了如何使用数值模式设置文件权限。这种方式的主要缺点是，无法在不改变当前模式的情况下，一次性为所有文件和目录添加写权限。\n\
  \n使用符号模式，你可以仅修改文件和目录的部分权限。\n\n符号模式的语法如下：`<who><operator><permission>`\n\n- `<who>`\
  \ 是字符 `u`、`g`、`o` 中的零或多个：\n  - `u`: 用户\n  - `g`: 组\n  - `o`: 其他\n  - `a`: 所有权限（用户、组和其他人）\n\
  \  如果省略了 `<who>`，则默认为 `a`，但会考虑文件创建掩码的值（参见下一节关于文件创建掩码 `umask`）。\n- `<operator>` 为\
  \ `+`、`-` 或 `=`。该选择表示：\n  - `+`: 添加权限\n  - `-`: 移除权限\n  - `=`: 为 `<who>` 指定组设置绝对权限\n\
  - `<permission>` 是 `r`、`w`、`x`、`s`、`t`、`u`、`g` 和 `o` 之一：\n  - `r`: 读取权限\n  - `w`:\
  \ 写权限\n  - `x`: 执行权限\n  - `X`: 如果文件是目录或该文件具有执行权限，则赋予执行权限\n  - `s`: 当 `<who>` 为 `u`\
  \ 时为 SUID，当 `<who>` 为 `g` 时为 SGID\n  - `t`: 当 `<who>` 为 `o` 时为粘滞位\n\n`u`、`g`、`o`\
  \ 分别表示权限来自用户、组或其他。可以通过逗号重复 `<who>`、`<operator>` 或 `<permission>` 来同时更改多个权限。\n\n\
  ### 示例\n\n- 为名为 `myfile` 的文件为组和其他人添加读取权限：\n```bash\nchmod go+r myfile\n```\n- 为给定目录下的所有文件为组和其他人添加读取权限：\n\
  ```bash\nchmod go+r *\n```\n- 为给定目录及其子目录下的所有文件和目录为组和其他人添加读取权限：\n```bash\nchmod -R\
  \ go+r *\n```\n- 让用户仅在知道他们想要访问的文件名时，才能访问你家主目录中的文件：\n```bash\nchmod go=r /home/user/\n\
  ```\n\n\n\n\n为了稍微放宽限制，让用户组能够看到你拥有的文件，但对其他人隐藏此选项，请输入此行：\n\n```bash\nchmod g=rx,o=r\
  \ /home/user/\n```\n\n要让给定目录下的所有文件和目录对用户组开放权限，请输入此行：\n\n```bash\nchmod g+rX *\n\
  ```\n\n这将产生以下效果：\n- 对所有文件和目录将添加读取权限。\n- 对所有目录将添加执行权限。\n- 对已经具有用户、用户组或其他用户执行权限的文件将添加执行权限。\n\
  \n# 修改文件的所属组 (chgrp)\n\n使用 `chgrp` 命令，你可以更改文件、目录或整个目录层次结构的所属组。语法如下：\n\n```bash\n\
  chgrp <group> <file> - 更改单个文件或目录的组\nchgrp -R <group> <file> - 更改目录及其所有子目录的组\n```\n\
  \n你必须是你想要更改的文件的所属组的成员。要查看你所属的组，请使用 `groups` 命令。\n\n# 修改文件的所有者 (chown)\n\n在上一节中，我们学习了如何更改文件的权限和组，但文件可以更改所有者吗？这个问题的答案是既肯定又否定！是的，你可以使用\
  \ `chown` 命令更改文件的所有者；但不，普通用户（即不是 root 用户）不能这么做！\n\n如果你真的想把一个文件交给别人，你有两种可能：\n- 将其作为附件通过邮件发送给他。\n\
  - 赋予文件读取权限（仅持续几秒钟），让对方复制文件，然后删除你的副本。\n\n# 设置新文件的默认权限 (umask)\n\n通过 `umask` 命令，你可以为新文件的权限设置一个模式。`umask`\
  \ 是一个类似于数值型 `chmod` 使用的数字，由三位 0 到 7 之间的数字组成。设置该数字的原因是技术性的，因此在此不再描述。唯一需要理解的是，当创建新文件时，它们将具有由\
  \ `umask` 描述的权限。在表 11.4 中，你可以看到特定数字描述的权限。\n\n表 11.4 umask 命令的数字示图。\n\n| 值 | 描述 |\n\
  | :--- | :--- |\n| 7 | -r -w -x |\n| 6 | -r -w +x |\n| 5 | -r +w -x |\n| 4 | -r\
  \ +w +x |\n| 3 | -r -w -x |\n| 2 | +r -w +x |\n| 1 | +r -w -x |\n| 0 | -r +w +x\
  \ |\n\n因此，为了赋予用户对新文件的完全访问权限 (rwx)，并赋予用户组和其他仅读取权限，你应该使用命令 `umask 044`。如果你使用 `umask\
  \ 033`，创建的普通文件将赋予用户读写权限，并赋予其他人读取权限。\n\n# 监控危险的 SUID、SGID 权限\n\nSUID 和 SGID 文件是危险的，因为它们可能会赋予未经授权的用户\
  \ root 权限，至少是以另一个用户的身份运行程序的权限。SUID 程序对黑客来说非常方便，因为它们为 root 账户创建一个后门，即使 root 将密码更改为黑客不知道的密码，该后门仍然可用。\n\
  \n然而，存在一种简单的方法可以验证自上次检查以来系统上没有出现新的 SUID 程序，即使用命令 `crontab`、`find` 和 `diff`。要使用这种策略，你必须拥有支持\
  \ `-perm` 选项 `find` 程序。如果你的版本不支持，你可以从 gnu 存档中下载（URL: `http://www.gnu.org/order/ftp.html`）。\n\
  \n\n\n通过 `find / -perm ++s` 命令，你可以递归遍历整个文件系统，并搜索具有 SUID 或 SGID 权限的文件。列表 11.1 中的脚本就执行了此操作，并将输出保存到名为\
  \ `suid.info` 的文件中。使用 `diff` 将此文件与上一次运行的文件进行比较，从而只输出新的 SUID/SGID 程序（或已消失的 SUID/SGID\
  \ 程序）。\n\n### 列表 11.1 用于搜索新 SUID/SGID 程序的程序\n\n```sh\n#!/bin/sh\ntest -e suid.info\
  \ && mv suid.info suid.info.old\ntest ! -e suid.info.old && touch suid.info.old\n\
  find / -perm ++s suid.info\ndiff suid.info suid.info.old\n```\n\n你对该程序需要的一个更改是为它提供一个你想要保存\
  \ `suid.info` 文件的完整路径。如果你将这个小程序设置为每天执行一次的 `cron` 任务，你就设置了一个用于检查新 SUID/SGID 文件的系统。只有当出现新的\
  \ SUID/SGID 程序时，你才会收到 `cron` 任务产生的邮件，否则它不会输出任何内容。\n\n## SUID/SGID 文件，挂载文件系统时\n\n\
  在某些 UNIX 变体中，`mount` 命令支持 `nosuid` 选项。这意味着使用此选项挂载的文件系统不会赋予 SUID/SGID 程序特殊含义（即它们将不会成为\
  \ SUID/SGID 文件）。如果没有此选项，挂载的文件系统可能会带来问题，如下例所示。\n\n假设你是大学校园内某研究所 UNIX 系统的系统管理员。某一天，另一个研究所的系统管理员问你，你是否方便帮忙挂载他\
  \ UNIX 系统上的一个文件系统，以便你们的共同学生可以在你的系统中访问他们的文件（位于他的硬盘上）。你应该如何回答？这会影响你系统的安全性吗？\n\n如果你没有在\
  \ `mount` 时使用 `nosuid` 选项关闭 SUID/SGID，这绝对会影响你系统的安全性。如果另一个系统是敌意的，他可能会在你挂载的文件系统上创建一个\
  \ SUID-root 壳，并获得对你文件系统的 root 权限。即使他不是敌意的，你也应该考虑，如果他系统的 root 密码没有你的那么安全会发生什么。答案可能是黑客破解了\
  \ root 密码，从而获得了访问你系统的权限。\n\n## 第 12 章 启动、关闭和作业管理\n\n### 启动系统\n\n完全启动 UNIX 并允许用户登录进行工作所需的步骤在不同系统之间差异很大。这是因为\
  \ UNIX 被不同的计算机公司移植到了许多不同计算机和处理器上。在最简单的情况下，你只需打开电源，UNIX 系统就会自动启动。系统将在几分钟后准备就绪，但取决于固件、网络连接、设备初始化等，也可能需要更长时间。其他系统不会自动启动，你必须输入特定命令来启动它们。在大多数系统中，普通用户永远不需要担心这个问题，因为系统位于由计算机操作员和管理员维护的限制区域。然而，在桌面系统和家庭系统中，所有者是唯一的操作员/管理员。我无法告诉你启动每个系统所需的特定步骤，但我可以告诉你一般的阶段。\n\
  \n#### 移除启动介质\n\n`Booting`（启动）是将软件加载到内存中的过程，这使得程序或操作系统能够运行。大多数系统可以从几种类型的设备启动。例如，大多数\
  \ i86 系统配置为先从 A 驱（软磁盘）启动，如果软驱中没有磁盘，则从 C 驱（硬盘）启动。其他机器可能从 CD-ROM 或磁带启动。在启动系统之前请移除此类介质，因为\
  \ UNIX 通常从硬盘启动。\n\n#### 在主计算机启动前开启辅助子系统\n\n某些系统具有外部磁盘驱动器、磁带驱动器或端口连接盒，它们通过电缆连接到主系统。通常，这些设备应该在主计算机启动之前通电并准备就绪。如果你不这样做，系统可能无法启动，或者在系统以这些设备在线的状态重新重启之前，它将无法使用那些设备。\n\
  \n\n\n\n# 开机诊断\n\n大多数计算机在首次启动时都会运行某种诊断程序。这可能只是快速的内存测试。某些计算机会运行一系列测试，这些测试可能持续几分钟或几小时，除非你知道如何结束诊断，否则它们可能会一直运行下去。在首次启动\
  \ UNIX 系统时，你应该观察屏幕输出，以便熟悉典型的信息。这样，如果检测到硬件问题，你至少能识别出某些异常之处。通常，启动过程会扫描系统上的所有设备。如果某个设备响应过慢或完全没有响应，你可能遇到了硬件问题。\n\
  \n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n**警告：** 使用不当可能会严重损坏系统\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n我可以为你提供通用的指南，但总会有例外。因此，在没有针对特定计算机的操作指导之前，请不要启动系统。\n\n# 将 UNIX 内核加载到内存\n\n启动的下一步是将\
  \ UNIX 内核文件加载到内存中。内核包含了访问系统磁盘、显示器、键盘和其他硬件所需的驱动代码。在某些系统中，你会收到一个启动提示符，从中你可以指定启动选项要加载的特殊内核。有时启动需要你输入一个复杂的命令字符串，其中包含了包含内核文件的主磁盘设备地址。\n\
  \n## 另另参考\n\n![sarrow.gif](img/ad91af06ad96c57f0a338bded4c42f0e.gif) *更多关于 UNIX\
  \ 内核的信息，请参见第 27 页*\n\n# 挂载根磁盘并检查 (*fsck*)\n\n启动过程包含一个阶段，以检查操作系统上次是否正常关机。如果不是，根文件系统可能会损坏，你可能会看到如下消息：\n\
  \n```\nfsstat: mount failed. Possibly damaged filesystem. okay to check the root\
  \ filesystem (y/n)?\n```\n\n此检查是由名为 `fsck` 的程序执行的。有时 `fsck` 在不等待响应的情况下启动。如果你足够好，`fsck`\
  \ 将报告一系列紧密的阶段消息：\nPhase 1: Check Blocks and Sizes\nPhase 2: Check Names\nPhase 3:\
  \ Check Connectivity\n以此此类推。\n\n如果你运气不好，阶段消息将充斥着听起来难听的错误，例如：\n```\nEXCIVE BAD BLOCKS\
  \ I=1432 FILE SIZE ERROR=257 DUP I=13827 DUP/BAD I=374 OWNER=17 MODE=700 SIZE=14328\
  \ FILE=/data/main (REMOVE?)\n```\n![arrow.gif](img/4505ed21b6bad.gif)\n\n这些错误中的每一个都指示可能的数据损坏或文件丢失。有时会有成千上万这样的错误，系统必须从备份恢复或重新加载。某些现代\
  \ UNIX 系统提供了日志文件系统，使它们更有效地抵抗不当关机或系统崩溃等问题。使用 UPS（不间断电源）也是明智之举，它包含一个电池，可以在断电时防止系统崩溃。\n\
  \n# 单用户模式\n\n当 UNIX 启动时，许多系统允许操作员停在单用户模式，在该模式下，系统仅经过部分初始化，可以执行维护功能。在某些系统中，必须使用特殊的命令序列才能进入单用户模式。出于安全考虑，大多数系统要求用户输入\
  \ root 登录才能进入单用户模式。在单用户模式下，你以 root（超级用户）权限运行。如果你在单用户模式下输入 `exit`，你不会获得另一个登录提示符。相反，系统将退出单用户模式并通常启动多用户模式。\n\
  \n# 多用户模式\n\n如果系统没有停在单用户模式，它将继续初始化系统和设备进入其主运行模式，称为多用户模式。UNIX 在启动时通常非常详细，在每个子系统激活时会给你提供如下启动消息：\n\
  \n```\nMounting filesystems cron started, pid=274\nNetwork daemons started: portmap\
  \ inetd routed\nprinting subsystem started\n```\n\n再次，尝试学习你系统的启动消息，即使你不知道它们的含义，这样当启动过程中发生异常时你就能识别出来。一旦初始化完成，你应该通过任何系统端口登录系统。\n\
  \n# System V 运行级别\n\n| 运行级别 | 描述 |\n| --- | --- |\n\n\n\n\n\n# 运行级别 (Run Levels)\n\
  \n| 运行级别 | 说明 |\n| :--- | :--- |\n| 0 | 完全关闭状态；准备断电 |\n| 1 | 维护模式/单用户模式 |\n| 2 |\
  \ 多用户模式 |\n| 3 | 导出了文件系统的多用户模式 (Solaris) |\n| 3, 4, 5 | 可自定义运行级别（因站点而异） |\n| 5 |\
  \ 关机并断电 (Solaris) |\n| 6 | 标准关机并重启 |\n\nAIX 和 SCO UNIX 通常运行在运行级别 2。Solaris 通常运行在运行级别\
  \ 3。有时存在 `s` 或 `S` 状态表示单用户模式，它与运行级别 1 仅有细微区别。你可以通过 root 输入以下命令显示当前的运行级别：\n\n```bash\n\
  # who -r run-level 2 Feb 18 08:13 2 0 S\n```\n\n上面的示例显示你当前处于运行级别 2，这是你于 2 月 18 日\
  \ 08:13 进入的。上一个运行级别是 `S`（单用户模式），这是你每次启动系统时经过的状态。\n\n## 关闭系统\n\n正如我们在上一节中看到的，在切断之前正确关闭\
  \ UNIX 对于防止文件损坏或丢失至关重要。UNIX 提供了许多关闭系统的命令，例如 `powerdown`、`reboot`、`haltsys` 或 `init\
  \ 0`。请小心使用此类命令。手册页会告诉你，在安全运行某些命令之前，所有用户必须已经注销、卸载文件系统并关闭网络。通常情况下，你应该使用 `shutdown`\
  \ 命令，它设计用于安全地关闭系统。\n\n### 关闭系统的具体步骤\n\n1. 以 root 身份登录。\n2. 使用 `who` 和 `ps` 命令确保用户或程序没有在更新系统中的文件。\n\
  3. 关闭所有在系统关闭之前需要特殊关机处理的数据库。按照相应的步骤进行操作。\n4. 输入 `cd /` 以验证你在关闭系统时处于根目录。如果你在某个挂载目录中，稍后卸载该目录可能会遇到问题。\n\
  5. 你会遇到两个版本的 `shutdown` 命令：System V 版本（用于 SCO）和 BSD 版本（用于 AIX）。Solaris 提供了这两个版本，取决于你的\
  \ `PATH` 变量。现在继续执行 System V 或 BSD 关机程序。如果你不确定使用哪个版本的 shutdown，请先尝试 System V 方法并输入所有可能的选项：`-g`、`-i`\
  \ 和 `-y`。如果你应该使用 BSD 版本的 shutdown，你会收到错误，但不会造成任何伤害。\n\n#### 运行 System V 关机\n\n1.\
  \ 确保你以 root 身份登录。\n2. 输入 `shutdown`，但在接到指令前不要按回车键。\n3. 输入空格，然后输入 `-g MIN`。此选项指定宽限期。将\
  \ `MIN` 替换为分钟，向所有用户广播系统即将关机的消息。（如果省略了 `-g`，默认等待一分钟）。输入 `-g 0` 立即关闭系统而无需等待。只有在你非常确定没有应用程序文件正在更新时才执行关机（参见附录中\
  \ UNIX 命令对*应用程序文件*的定义）。\n4. 输入空格，然后输入 `-i RLEVEL`，其中 `RLEVEL` 是以下数字之一：\n    - `0`\
  \ 完全关闭系统（准备断电）\n    - `1` 进入维护模式/单用户模式\n    - `5` 关闭并断电（仅限 Solaris 系统）\n    - `6`\
  \ 关闭并自动重启\n    如果未指定 `-i` 选项，大多数系统将默认进入运行级别 0；但某些系统（如 Solaris）将进入运行级别 1（单用户模式）。\n\
  5. 如果你确定要关闭系统，输入空格，然后输入 `-y`。\n6. 按回车键执行命令。如果你在 shutdown 时没有包含 `-y` 选项，当宽限期结束，系统会询问你（是否）仍想关闭系统。输入\
  \ `y` 继续关机命令；输入 `n` 终止关机命令。\n\n#### 运行 BSD 关机\n\n1. 确保你以 root 身份登录。\n2. 输入 `shutdown`，但在接到指令前不要按回车键。\n\
  3. 输入空格。\n4. 如果你想关闭系统电源，输入 `-h` 选项。\n\n\n\n\n\n如果你想重启系统，请输入 `-r` 选项。\n\n5. 输入一个空格。\n\
  6. 你现在有三个选项：\n    - 如果你确定可以立即关闭系统，请输入 `now`。\n    - 输入 `+MIN`，其中 `MIN` 是系统在定期广播关机消息期间等待的分钟数。\n\
  \    - 输入 `HH:MM`，其中 `HH` 和 `MM` 是系统关机前的小时数和分钟数。\n7. 按 Enter 键执行你的命令。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n### 防止 UPS 损坏数据库\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  某些 UPS 在长时间停电时会关闭系统。如果你有一个必须在系统关闭之前关闭的数据库，你必须配置你的 UPS 软件以先正确关闭数据库。\n\n### 在启动或关机时自动化作业\n\
  UNIX 在允许作业根据系统事件或时间日期自动运行方面体现了极大的灵活性。其中某些机制仅供 root 用户（系统管理员）使用，但许多机制所有用户均可以使用。以下章节描述了\
  \ root 用户可以执行的最常见功能。\n\n#### System V UNIX 启动时的自动化作业 (rc.d)\n仅 root 用户可以自定义并添加在系统启动时自动运行的作业。某些系统使用\
  \ System V 方法；其他系统（甚至是 S4 系统）使用 BSD 方法。查看名为 `/etc` 的目录。如果你的系统拥有 `rc`、`rc0` 和 `rc2`\
  \ 文件，并且拥有 `rc.d`、`rc0.d` 和 `rc2.d` 目录，则它在使用 System V 类型的启动程序或脚本。这些被称为 `rc scripts`（rc\
  \ 代表 run control，运行控制），因为这些脚本控制你如何进入或离开运行级别。`rc2` 是当系统切换到运行级别 2（多用户模式）时运行的脚本程序。`rc2`\
  \ 脚本使用 `rc2.d` 中的文件，如下面的 SCO UNIX 示例所示：在第一个字母之后，每个脚本都有一个数字控制脚本运行的顺序。表 12.2 显示了每个脚本第一个字母的含义：\n\
  \n##### 表 12.2 System V 脚本前缀。\n| 前缀 | 含义 |\n| :--- | :--- |\n| **K** | 通过运行此脚本杀死进程\
  \ |\n| **S** | 通过运行此脚本启动进程 |\n| **P** | 如果该范围内没有 S 脚本，则并行运行 P 数字脚本（仅限 SCO UNIX）\
  \ |\n\n例如，在之前的列表中，你可以看到 `lp` 打印系统首先启动，然后是 `tcp`，最后是 `nfs`。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  **警告**：初学者不应修改此目录。错误会导致系统无法启动。\n\n### 修改 System V 启动脚本\n1. 在此目录中，创建一个名称以 `S99` 开头的自定义脚本。这将导致脚本在其他初始化脚本之后执行。设置所有者、组和权限以与该目录中的其他文件匹配。可以有多个以\
  \ `S99` 开头的脚本。\n2. 在你的 `S99` 脚本中，输入你想在系统进入多用户模式时运行的系统命令。对每个命令、目录和文件使用完整路径名；例如，你应该使用\
  \ `/etc/shutdown` 而不是 `shutdown`。如果不确定，请使用 `type` 命令确保你拥有命令的正确完整路径，如下例所示：\n\n```\n\
  type shutdown shutdown is /sbin/shutdown\n```\n\n\n\n\n\n### 3. 不要在此 `rc2.d` 目录中创建脚本的备份副本。如果你这样做了，例如\
  \ `S99yourscript.bak`，它将在每次启动时与 `S99yourscript` 一起执行，因为它们都在 `/etc/rc2.d` 中。\n\n\
  ### 4. 使用 `&` 在后台运行子任务，以防止出现系统挂起和无法重启的情况；例如，可以使用 `stty` 命令设置端口的波特率，但如果设备未就绪（例如，调制解调器正在等待呼入），`stty`\
  \ 可能会一直挂起直到设备就绪。如果这个 `stty` 命令在你的 rc 脚本中，系统也会挂起，你将不得不重置并进入单用户模式来修复问题。为了防止此类问题，请创建一个访问所需端口的脚本，并在\
  \ rc 脚本中后台调用该脚本，如下所示：\n\n```\n/usr/startup/portsetup &\n```\n\n### 5. 如果你的函数需要在系统启动期间执行某些特定代码，并在系统关闭时执行其他代码，你应该执行此额外步骤。将你的脚本副本放入\
  \ `/etc/init.d`，并使用不以 `S99.` 开头的名称。Solaris 使用硬链接来实现此操作；SCO。OpenServer 5 使用复杂的符号链接。要了解如何在你的系统上进行操作，请查看\
  \ `rc2.d` 和 `init.d` 中的其他脚本并遵循它们的示例。其思想是让一个脚本同时处理该函数的启动和关闭任务。该脚本应将 `$1` 保存为模式，然后如果该模式是启动状态，脚本应执行启动代码；当该模式停止时，脚本应执行关闭代码。完成后，将此脚本链接到多用户启动目录（`/etc/rc2.d`）或关闭目录（`/etc/rc0.d`），并为启动任务添加\
  \ `S99`，或为关闭任务添加 `K##`。\n\n#### 在 System V UNIX 上实现系统关闭时的任务自动化 (rc0.d)。\n\n在 System\
  \ V 类型的系统中，有一个名为 `/etc/rc0.d` 的目录，其中包含与 `/etc/rc2.d` 类似的脚本。你可以将脚本添加到 `rc0.d` 中，以便在系统切换到运行级别\
  \ 0（完全关闭状态）时运行。\n\n通常一个更好的主意（在 BSD 系统中同样有效）是按照下面的步骤创建你自己的脚本。\n\n##### 用于调用关闭操作的自定义脚本\n\
  \n1. 输入命令 `shutdown` 并按回车。你会看到如下的输出：\n```\n$ shutdown\nshutdown is /sbin/shutdown\n\
  ```\n这是 `shutdown` 的完整路径。\n2. 使用 `cd` 命令切换到 `shutdown` 所在的目录。\n3. 创建一个文本文件并命名为 `shut`（这不是一个标准名称，你可以为\
  \ `shutdown` 命令的替代方案选择不同的名称）。\n4. 插入你想在关闭系统期间运行的命令。然后用以下几行结束你的脚本：\n```\ncd shutdown\
  \ OPTS\n```\n将 `OPTS` 替换为你的系统上 `shutdown` 需要的选项。\n5. 使用 `chmod`、`chown` 和 `chgrp`\
  \ 命令赋予 `shut` 与 `shutdown` 相同的权限、所有者和用户组。\n6. 现在，每当你想关闭系统时，都使用 `shut` 命令代替 `shutdown`。\n\
  \n**注意**：存在某些管理员或系统进程使用 `shutdown` 命令而非你的 `shut` 脚本的风险。这是一个关键问题，请向 `/etc/rc0.d`\
  \ 添加关闭脚本，而不是创建这个 `shut` 脚本。\n\n**警告**：有关编写 shell 脚本的更多信息，请参见第 637 页。\n\n#### 在 BSD\
  \ 上实现系统启动时的任务自动化 (rc scripts)\n\n如果你的系统使用 BSD 启动脚本，你会发现许多以 `rc` 后跟点开头的脚本，例如 `rc.net`。所有这些\
  \ rc 脚本都在 `/etc` 目录下。然而，并不是所有的 rc 脚本都会系统启动期间运行。\n\n如果你在 AIX UNIX 系统上运行以下命令：\n```\n\
  ls -lu /etc/rc*\n```\n\n\n\n\n\n| 你将看到类似以下的输出： |\n\n```text\n-r-xr-xr--  1  bin\
  \      bin           1786 Aug 21 16:03 /etc/rc\n-rw-r--r--  1  root     system \
  \       48 Feb  4  1996 /etc/rc.bak\n-r-xr-xr--  1  bin      bin           2502\
  \ Feb  4  1996 /etc/rc.bsdnet\n-r-x------  1  root     system        21187 Feb \
  \ 4  1996 /etc/rc.motpowerfail\n-rw-r--r--  1  root     system        571 Feb  4\
  \  1996 /etc/rc.ncs\n-r-xr-xr--  1  bin      bin           7352 Aug 21 16:03 /etc/rc.net\n\
  -r-xr-xr--  1  bin      bin           4554 Aug 21 16:03 /etc/rc.net.serial\n-rw-r--r--\
  \  1  root     system        982 Feb  4  1996 /etc/rc.netls\n-rwxr-xr-x  1  root\
  \     system        4201 Aug 21 16:04 /etc/rc.nfs\n-rwx------  1  root     system\
  \        29511 Feb  4  1996 /etc/rc.powerfail\n-rwxrwxr--  1  root     system  \
  \      4180 Aug 21 16:04 /etc/rc.tcpip\n```\n\n`ls` 的 `-lu` 显示了 `rc` 脚本最后被访问的时间。你可以看到，在\
  \ 8 月 21 日 16:04 的上次重启中，只有五个脚本被使用了。其他 `rc` 脚本自 1996 年以来未被访问过。以下是来自 `/etc/inittab`\
  \ 文件的内容，该文件在启动时执行其中一些 `rc` 脚本：\n\n```text\nc::init:/sbin/rc.boot 3>/dev/console\
  \ 2>&1 # Phase 3 of system boot\npowerfail::powerfail:/etc/rc.motpowerfail -t 5\
  \ 2>&1 # Power Failure Detection\nrc:2:wait:/etc/rc 2>&1 -tboot>/dev/console # User\
  \ checks\ntcpip:2:wait:/etc/rc.tcpip >dev/console 2>&1 # Start TCP/IP daemons\n\
  nfs:2:wait:/etc/rc.nfs >dev/console 2>&1 # Start NFS Daemons\n```\n\n要在系统启动时运行任务，你必须将该任务插入到启动时运行的\
  \ `rc` 脚本中。这是一项经验丰富的程序员的工作，初学者不应尝试。错误可能会导致你的系统以后无法正常启动。\n\n### 由任何用户自动化任务 (`profile`,\
  \ `cron`, `at`, `batch`)\n\n普通用户可以自动化特定的任务，使其在登录时、特定时间或特定某天运行。系统管理员使用类似的机制来定期运行系统进程。\n\
  \n#### 在用户登录时自动化任务\n\n每个 Bourne 或 Korn shell 在登录期间都会执行两个文件：`/etc/profile` 或 `.profile`（位于用户家目录中）。\n\
  \n只有 `root` 用户可以修改 `/etc/profile`，因为该文件的更改会影响所有用户的登录。出于安全考虑，你不应给其他人该文件的写入权限。\n\n\
  **安全提示**：在修改 `/etc/profile` 或 `.profile` 时请使用两个屏幕。如果你在更改这些文件时出错，可能会导致即使是 `root`\
  \ 用户也无法重新登录。在更改 `/etc/profile` 或 `.profile` 后，确保你仍然能从另一个屏幕成功登录。如果失败了，你仍然登录在第一个屏幕，可以纠正或撤销你的更改。\n\
  \n用户通常可以修改他们自己的 `.profile` 文件，以便在登录时设置环境偏好。（在某些系统中，管理员可能允许用户对 `.profile` 读取权限但不写入权限，以防止用户对其\
  \ `.profile` 文件进行错误或不理想的更改。）执行 `/etc/profile` 和 `.profile` 中的行，其效果等同于用户在登录后立即在键盘上输入了这些相同的行。例如，来自\
  \ `/etc/profile` 或 `.profile` 的 `exit` 命令会将用户带回登录提示符并强制重新登录。\n\n`/etc/profile` 和\
  \ `.profile` 是设置 shell 变量（如 `PATH`、`CDPATH`、`TERM` 和 `umask`）的好地方。也可以自动设置端口的首选 `stty`\
  \ 选项。对 `/etc/profile` 的更改会影响所有用户，但这些更改可以通过用户家目录下 `.profile` 中的代码进行修改。在 `root/.profile`\
  \ 中添加 `df` 允许 `root` 在每次 root 登录时查看可用磁盘空间。\n\n\n\n\n\n`/etc/profile` 也可以用于为系统添加额外的安全性。例如，使用标准的\
  \ Bourne shell 编程，`/etc/profile` 可以检查用户是否通过调制解调器端口登录，如果是，则只允许在受限制的时间登录，或要求输入额外的密码。如果\
  \ `/etc/profile` 代码执行了 `exit` 命令，用户的登录将终止，该用户将返回初始登录提示符。\n\n# 定期重新运行任务调度 (*cron*)\n\
  \nUNIX 维护了一组名为 `crontabs`（时间表）的表，其中包含了调度为定期运行的任务。对于每个提交了 cron 任务的用户，通常有一个表或文件（通常位于\
  \ `/usr/spool/cron/crontabs`）。系统将使用该用户的账户运行该任务。\n\n要检查是否提交了任何 `cron` 任务并查看它们，你需要使用\
  \ `crontab` 命令的 `-l` 选项（列出）。如果你以 `root` 身份登录，可能会看到如下输出：\n\n```\n# crontab -l 17\
  \ 5 * * 0 /etc/cleanup > /dev/null\n0 2 * * * 0,4 /usr/lib/cron/logchecker 3 3 *\
  \ * * /usr/lib/cleantmp > /dev/null\n1 3 * * * /etc/setclk -rd1800 > /dev/null 2>&1\n\
  5 18 * * 1-5 /usr/lib/sa/sa2 -s 8:00 -e 18:01 -i 1200 -A\n30 1 * * 2,3,4,5,6 /etc/edge.nightly\
  \ -MB -n root -d\n/dev/null 1>/dev/null 2>&1\n5 4 * * 0 /etc/shutdown -g5 -i6 -y\n\
  ```\n\n`crontabs` 中的每一行都有六个字段，用一个或多个空格或制表符分隔。表 12.3 描述了这六个字段及其内容。\n\n### 表 12.3\
  \ crontabs 中的字段。\n\n| 字段 | 功能 | 可能的值值范围 |\n| :--- | :--- | :--- |\n| 1 | 小时内的分钟\
  \ | 0-59 |\n| 2 | 一天中的小时 | 0-23 |\n| 3 | 每月的几几 | 1-31 |\n| 4 | 一年中的月份 | 1-12 |\n\
  | 5 | 星期几 | 0-6 (0 代表星期日) |\n| 6 | 要运行的命令 | |\n\n你可以使用连字符 (-) 表示连续范围。一个字段中的多个值可以以任何顺序指定，并应用逗号（且没有空格）分隔，例如\
  \ `1,3,7,2,25`。在表 12.3 中，要运行的命令（第 6 字段）可以是 UNIX 命令或 shell 脚本。使用完整路径名来引用所有文件以及不在\
  \ `/bin` 或 `/usr/bin` 中的任何命令。如果你是第一次使用 `cron`，请尝试只使用 `date` 命令，该命令将通过 `cron` 邮件发送给你。另一个良好的第一个\
  \ cron 脚本是在你的主目录或 `/tmp` 中创建一个小型结果文件，其结果显示在此：\n\n```bash\necho cron test `date`\
  \ > /tmp/fred.cron.tst\n```\n\n## 添加/删除/修改 Cron 任务\n\n1. 以想要修改的 cron 任务的用户身份登录。（除非绝对必要，否则不要以\
  \ `root`  cron 任务。）如果你以前从未添加过 cron 任务，请使用 `root`、`sys`、`adm` 或 `uucp` 以外的账户，以便先练习添加和删除测试\
  \ cron 任务。\n2. 输入 `cd` 进入你的主目录。\n3. 除非通过 `cron` 运行的命令极其简单，否则使用 `vi` 或编辑器创建一个 shell\
  \ 脚本（在此过程中称为 cron 脚本）。在该 cron 脚本中，插入你想从 `cron` 运行的命令。每当你想要从 `cron` 运行一系列多个命令时，都应该使用\
  \ cron 脚本。直接从终端运行你的 cron 脚本进行测试。在 cron 脚本中，对任何要访问的文件使用完整路径名。对于任何不在 `/bin` 或 `/usr/bin`\
  \ 中的系统命令，使用完整路径名。如果你是第一次使用 `cron`，请尝试只使用 `date` 命令，该命令将通过 `cron` 邮件发送给你。\n4. 在 shell\
  \ 提示符处，如下所示测试你的 cron 脚本。（注意：逻辑）如果系统在计划运行任务的时间点处于关闭状态，则该任务将被跳过。如果系统开机，它将在下一个计划的时间点再次运行。\n\
  5. 接下来，缓慢且仔细地输入此命令：\n`crontab -l > cronfile`\n如果你收到提示“No such file”或“Can't open\
  \ file”的错误，说明你没有 cron 任务。只需忽略此错误并继续下一步。\n6. 在第 5 步中，如果不小心漏掉了 `-l` 选项，你可能会删除所有的 cron\
  \ 任务。如果你丢失了 `root` cron 任务，重要的系统功能将被禁用。此步骤其余部分讨论了如果不小心漏掉 `-l` 选项，如何尝试保存你的 cron 任务。缺少\
  \ `-l` 选项会导致你当前的 crontabs 处于危险。你将看到 PS2 提示符（通常是大于号），这意味着 shell 正在等待键盘输入以替换你当前的 crontabs。按下你的\
  \ `INTR` 键（通常是 `Ctrl+C` 或 `DEL`）来取消此命令。如果 `INTR` 键无效，请到另一个端口并正确执行第 5 步。然后返回此端口并输入你的\
  \ `EOT` 键（通常是 `Ctrl+D`）来清空你当前的 crontabs。\n为了完全避免讨厌的 PS2 提示符，某些用户使用此命令代替第 5 步中描述的命令：\n\
  `cp /usr/spool/cron/crontabs/MYID cronfile`\n\n\n\n\n\n将此行中的 `MYID` 替换为你的登录 ID。\n\
  \n某些用户使用 `crontab -e`（这会自动调用默认的 `EDITOR`）。然而，如果你忘记了 `-e` 选项，你仍然面临此步骤中描述相同的问题。\n\n\
  ### 7. 输入 vi cronfile。（你可以使用任何文本编辑器编辑此文件。）现在，你应该能看到之前讨论的六字段格式的所有当前正在运行 cron 任务。例如，你可能会看到如下行：\n\
  \n```\n17 5 * * 0 /etc/cleanup > /dev/null\n```\n\n如果你的登录账户从未提交过 cron 任务，则此 cronfile\
  \ 将是空的。如果该 cronfile 是空的但本不应该是空的（例如，root 的 cronfile 不应为空），请返回第 1 步并重新开始。如果你丢失了之前的\
  \ cron 条目，你将不得不将它们重新输入。\n\n### 8. 使用文本编辑器修改任何现有的 cron 任务，并以六字段格式向此文件添加新任务。如果你在此过程的第\
  \ 3 步中创建了 cron 脚本，请向该文件添加一个新的六字段行，并在最后一个字段中填写你 cron 脚本的完整路径。编辑完成后，保存工作并退出编辑器。此 cronfile\
  \ 只是临时文件，所以如果你不喜欢保存的结果，请返回第 5 步并重新开始。\n\n### 9. 输入 cat cronfile。\n\n确保此文件包含所有先前的\
  \ cron 任务的正确六字段条目以便保留，加上你添加的任何修改过的或新的 cron 任务。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n注意：此文件必须包含该登录账户运行的所有 cron 任务。如果你从此文件中删除一个条目，你将从 cron 中删除它，且它将来将不再运行。\n\n### 10.\
  \ 输入 crontab cronfile。\n\n这将提交你的更改，替换你之前所有的 cron 任务。如果你收到错误提示说不允许提交 cron 任务，请参见后文章节“按用户启用和禁用\
  \ cron/at/batch”。\n\n### 11. 输入 crontab -l 以显示你当前提交的 crontab 条目。然后查看在此过程中较早出现的关于此命令的警告。\n\
  \n另另\n- 关于使用 `vi` 编辑的信息，请参第 449 页和第 471 页。\n- 关于显示文件的信息，请参第 147 页。\n- `![sarrow.gif](img/ad91af06ad9c57f0a338bded4c42f0e.gif)`\n\
  - 在 Crontabs 中使用星号 (*) 通配符。\n\n#### 在 Crontabs 中使用星号 (*) 通配符。\n\ncrontab 允许如表 12.4\
  \ 所示使用星号 (`*`) 通配符。注意，这是 crontab 通配符，而不是文件名通配符或正则表达式通配符。\n\n关于 crontab 字段 1 的提示：小时内的分钟。如果你在字段\
  \ 1 中发现星号（为了让你的任务每小时内运行 60 次），这通常是一个错误。避免在每个 cron 任务的分钟字段中放置 0，因为这可能会影响每小时开始时的性能。对于那些不需要正好在整点开始的任务，请错开它们的分钟值。\n\
  \n表 12.4 在 crontabs 中使用星号 (*)。\n\n| 字段 | 星号在该字段中的含义 |\n| :--- | :--- |\n| 1. 小时内的分钟\
  \ | 每分钟执行一次任务，每小时执行 60 次 |\n| 2. 一天中的小时 | 每小时执行一次任务，每天执行 24 次 |\n| 3. 每月的几几 | 忽略此字段并使用字段\
  \ 5 |\n| 4. 每年的月份 | 每月执行一次任务，每年 12 个月 |\n| 5. 星期几几 | 忽略此字段并使用字段 3 |\n\n在字段 3 和 5\
  \ 中都使用星号意味着该任务每天运行。\n\n#### 运行清晨的工作日任务\n\n这里有一个典型的 crontab 错误：\n\n```\n30 1 * *\
  \ 1-5 /u/backup\n```\n\n这家公司从周一到周五上班，并希望在每个工作日的凌晨 1:30 执行备份。然而，使用此命令，周五的工作将等到下周一早上\
  \ 1:30 才会被备份。由于周末沉重的建筑维护工作和电力问题更频繁，这种做法并不好。以下是修正后的条目，它也会在周六早上运行备份：\n\n```\n30 1\
  \ * * 2-6 /u/backup\n```\n\n\n\n\n\n出于同样的原因，这对该公司来说并不是一个好的条目：30 1 * * * /u/backup\n\
  \n因为周六和周日办公室没有人，所以磁带不会被更换，而周五晚上的备份（实际上在周六凌晨运行）将在周六晚上和周日晚上被重写。周末的电源问题可能会导致文件损坏，然后这些损坏的文件将替换掉周五晚上良好的备份。\n\
  \n### 另此\n有关更多关于备份的信息，请参阅第 327 页。\n\n### 在特定日期/时间调度一次性任务\nUNIX 的 `at` 命令允许你安排任务在稍后的预定时间运行一次。如果你想多次运行该任务（例如定期运行），请参阅上一节中关于\
  \ `crontab` 命令的介绍。\n\n#### 使用 at 命令调度任务\n1. 以将要用于运行任务的账户的用户的身份登录。仅在绝对必要时才使用 root\
  \ 用户。\n2. 输入 `at`，但在没有收到指示前不要按回车键。\n3. 输入一个空格，然后使用以下三种方法之一指定运行命令的时间：\n    - **方法\
  \ 1**：仅输入时间，例如：`03` 表示凌晨 3 点，`17` 表示下午 5 点，`0704` 表示早上 7:04，`7:04pm` 表示晚上 7:04。任务将在接下来的\
  \ 24 小时内于请求的时间运行。\n    - **方法 2**：输入时间和日期，例如：`Sat pm`、`Aug 24 7:04pm`。任务将在未来一年内的请求日期的请求时间运行。\n\
  \    - **方法 3**：提供偏移量，例如：`now + 5 min`、`now + 2 days`。\n4. 按回车键执行此行。光标将移动到没有提示符的下一行，并在那里等待更多输入。如果你在此处遇到错误，请参阅后文的章节“按用户启用和禁用\
  \ crontab/at/batch”。\n5. 输入你想稍后运行的命令。按照你正常运行该命令的方式精确输入。然后按回车键提交命令。你可以继续输入更多命令，每条命令后都按回车键。\n\
  6. 完成命令后，光标应位于空白行的开头。输入你的 EOT 键（通常是 Ctrl+D），你的正常提示符就会出现。\n\n#### 使用示例\n你可以使用 `at`\
  \ 的 `-l` 选项来列出你当前的任务。你可以使用 `-r` 选项删除已计划的任务。下面的示例说明了这些选项用法。它展示了一个你可能想要测试 `at` 的快速命令。如果你删除该任务，它将在五分钟后在当前目录下创建一个垃圾文件。\n\
  \n```bash\n$ at now + 5 min date > junk\nwarning: commands will be executed using\
  \ /bin/sh\njob 88071220.a-9910:0 at Sat Feb 21 06:27:00 1998\n\n$ at -l\n88071220.a-9910:0\
  \    Sat Feb 21 06:27:00 1998\n\n$ at -r 88071220.a\nat: 88071220.a does not exist:\
  \ No such file or directory\n```\n\n\n\n\n在上面的示例中，注意 `at` 命令的 `-l` 选项显示任务何时运行，但不会显示将运行哪个命令。注意\
  \ `-r` 选项需要输入完整的任务 ID。\n\n如果系统在 `at` 任务预定运行期间关机状态，则 `at` 任务将在系统重新启动后立即运行（与 `cron`\
  \ 不同）。你甚至可以编写一个 `at` 任务使其定期重新进入队列运行。你可以在 `at` 脚本的末尾添加如下的一行：\n\n```\necho \"sh jobname\"\
  \ | at 2330 sat next week\n```\n\n# 调度在负载低运行时执行单次任务 (batch)\n\n`batch` 命令可用于系统认为负载足够低时运行任务，这意味着你无法预测它何时运行。如果你的系统始终处于高负载状态，那么\
  \ `batch` 对你来说不是一个实用的命令，因为它永远无法启动你的任务。\n\n## 使用 batch 命令\n\n1. 输入 `batch` 并按回车键。光标将移动到下一行，且没有提示符，它将在那里等待更多输入。如果你在此处遇到错误，请参见后文章节\
  \ `按用户启用和禁用 crontab/at/batch`。\n2. 输入你想稍后运行的命令。按照你正常运行该命令的方式完全输入。按回车键提交命令。你可以继续输入更多要按顺序执行的命令。每个命令后都按回车键。\n\
  3. 当你完成命令输入后，光标应位于空行的开头。输入你的 EOT 键（通常是 `Ctrl+D`），你的正常 shell 提示符就会出现。\n\n## 按用户启用和禁用\
  \ crontab/at/batch\n\nroot 用户（系统管理员）可以修改这两个文件来允许或拒绝用户使用 crontabs：\n\n`/usr/lib/cron/cron.allow`\n\
  `/usr/lib/cron/cron.deny`\n\nroot 用户还可以修改以下两个文件来允许/拒绝用户使用 `at` 或 `batch` 命令：\n\n\
  `/usr/lib/cron/at.allow`\n`/usr/lib/cron/at.deny`\n\n如果存在 `allow` 文件，则只有文件中列出的用户可以使用该命令。如果不存在\
  \ `allow` 文件，则使用 `deny` 文件。在这种情况下，除 `deny` 文件中列出的用户外，所有用户都可以使用该命令。\n\n## 任务优先级\n\
  \n以下章节涵盖了查看和更改运行进程优先级的必要命令。\n\n### 查看任务及其优先级 (ps)\n\n你可以使用 `ps` 的 `-lf` 选项来显示每个运行中的进程（任务）及其当前的优先级。例如，请看这里：\n\
  \n```\n$ ps -lf F S UID PID PPID C PRI NI ADDR SZ STIME TIME CMD\n20 S mori 9998\
  \ 9374 6 73 20 fb11e798 132 fb11e798 06:54:41 ttyR030 00:00:00 -ksh\n20 O mori 10020\
  \ 9998 7 48 20 fb11e8f0 160 06:55:23 ttyR030 00:00:00 ps -lf\n30 S mori 10021 9998\
  \ 2 78 20 fb11ecf8 72 fb11ecf9 06:55:23 ttyR030 00:00:00 pg\n```\n\n标记为 `NI` 的列显示进程的\
  \ nice 值（在此情况下为 20）。nice 值越高，获取系统资源和时间的优先级就越低（对系统中的其他用户越“友好”）。表 12.5 概述了典型的 nice\
  \ 值。\n\n表 12.5 nice（优先级）值\n\n| 类型 | 范围 | 默认值 |\n| :--- | :--- | :--- |\n| BSD |\
  \ 1 到 19 | 0 |\n| System | -20 到 20 | 0 |\n\n### 以低优先级启动任务 (nice)\n\n1. 输入 `nice`，但在接到指示之前不要按回车键。\n\
  2. 输入一个空格，然后输入 `VAL`，将 `VAL` 替换为 1 到 19 之间的数字。值越大，对其他用户越友好。仅 root 用户可以输入 `--VAL`\
  \ 来降低 nice 值，从而将其任务优先级提高高于其他用户。然而，root 用户必须小心，不要将优先级调得太高，以至于任务接管并禁用所有系统功能。\n3. 输入一个空格，然后输入想要运行的命令。如果你输入的是管道，请为管道的每个阶段都输入一个\
  \ `nice` 命令。（参见下一个示例。）按回车键执行你的命令。\n\n你的 `nice` 或 `renice` 可能会有所不同。\n\n\n\n\n查看你的\
  \ `man` 页面了解 `nice` 和 `renice`。在某些系统中，nice 值的范围以及以正数还是负数形式输入可能与此处描述的有所。\n\n此示例展示了在管道中的每个命令都必须显式地调用\
  \ `nice` 命令。该命令将 `ps` 的输出传递给 `pg`。请注意，`ps` 的 nice 增量为 5，`pg` 的 nice 增量为 7。选择不同的值仅是为了说明一点；通常你会对两者使用相同的值。\n\
  \n```bash\n$ nice -5 ps -lf | nice -7 pg   F S      UID    PID  PPID  C  PRI NI\
  \      ADDR    SZ WCHAN     STIME      TTY         TIME CMD\n20 S      mori 10042\
  \  9996  5  73  20  fb11e798  132  fb11e798 07:12:35  ttyR029     00:00:00  -ksh\n\
  20 O      mori 10066 10042  9  44  25  fb11e8f0  160 -07:13:24  ttyR029     00:00:00\
  \  ps -lf\n20 S      mori 10067 10042  5  76  27  fb11ecf8   72  f093d7c0 07:13:24\
  \  ttyR029     00:00:00  pg\n```\n\n注意 `pg` 命令的 nice 值为 27。这是因为 `nice -7` 意味着在默认值\
  \ 20 的基础上增加 7 个点。\n\n## 更改现有作业的优先级 (*renice*)\n\n现代 UNIX 系统支持 `renice` 命令，允许你更改已启动进程的\
  \ nice 值。但是，你必须首先使用 `ps` 命令查找目标进程的 `PID` 值（参见之前的 `ps` 示例）。\n\n**注意**：请参术表以获取 `PID`\
  \ 值的定义。\n\n### 更改现有作业的优先级 (*renice*)\n\n1. 输入 `renice` 命令，但在接到指示之前不要按回车键。\n2. 输入一个空格，然后输入选项\
  \ `-n`。\n3. 输入一个空格，然后输入 `VAL`，其中 `VAL` 是 1 到 19 之间的数字。这代表增加 nice 值的幅度，从而降低作业的优先级。\n\
  4. 输入一个空格，随后输入你要更改的进程（作业）的 `PID`。\n5. 你的命令看起来应该这样：\n```bash\nrenice -n 5 10042\n\
  ```\n按回车键执行你的命令。\n\n### 何时使用 `nice`、`at` 和 `batch`\n\n- 当你需要作业完成但想尽量减少对其他用户的影响时，使用\
  \ `nice` 或 `renice`。\n- 使用 `at` 确保作业在指定时间之前不运行。\n- 使用 `batch` 利用系统空闲时间，但不要在繁忙系统上使用\
  \ `batch`。\n\n## 后台作业 (&)\n\nUNIX 是一个多任务操作系统。这意味着通常情况下，你可以启动多个作业，且所有作业将并发运行。你的工作站不会因等待它们完成而被占用。你甚至可以指定作业序列，使得在上一个作业完成之前下一个作业不会开始。\n\
  \n### 启动后台作业 (&)\n\n要在后台启动作业，只需在 UNIX 命令末尾加一个空格和一个 ampersand (`&`)，如例所示：\n\n```bash\n\
  $ make acmesys > acme.log 2>&1 &\n```\n以下是该命令各部分的详细说明：\n\n- `make` 是一个可能需要很长时间完成的命令；因此，你可以在后台运行它，使其不会占用你的工作站。\n\
  - `> acme.log` 将 `make` 的输出重定向到名为 `acme.log` 的文件中。在启动后台运行时这是一个好主意，因为输出会被保存以便日后查看。如果不这样做重定向输出，它仍然会显示在屏幕上，可能会与其他输出混合。\n\
  - `2>&1` 将 `make` 命令的任何错误消息重定向到与标准输出相同的文件文件中（因此你将 make 的输出和错误保存在同一个文件中）。\n- `27903`\
  \ 是作业号，也称为进程 ID 或 `PID`。如果你保存了这个数字，稍后可以使用它检查该作业。\n\n### 防止注销杀死后台作业 (*nohup*)\n\n\
  \n\n\n\n退出系统通常会终止所有后台作业。某些 shell 会警告你已停止了作业。如果你此时再次输入 `exit`，将终止这些作业并退出系统。`nohup`\
  \ 命令允许你启动后台作业，这些作业在你注销系统时不会被杀死。\n\n## 使用 `nohup` 启动后台作业\n\n1. 在 shell 提示符下，输入 `nohup`。在接到指令之前，不要按回车键。\n\
  2. 输入一个空格，然后输入你想运行的 UNIX 命令。如果需要，请记住重定向标准输出和标准错误消息。\n3. 输入一个空格，然后输入和符号 (`&`)。\n\
  4. 按回车键在后台执行你的命令。现在，你的注销将不会终止该后台作业。\n\n如果你没有重定向标准输出和标准错误，`nohup` 命令将自动创建一个名为 `nohup.out`\
  \ 的文件来保存它们。\n\n## 杀死后台作业 (`kill`)\n\n如果你记录了启动后台作业时显示的 `PID`，那么可以使用两个 `kill` 命令中的任意一个轻松终止该作业。以下步骤展示了如何使用这两个命令。\n\
  \n### 如何通过 PID 终止作业\n\n1. 从 shell 提示符下，输入 `kill PID`，其中 `PID` 是你想终止的进程的 PID 数字。双检输入的数字是否正确。然后按回车键。此\
  \ `kill` 命令将赋予作业一个优雅终止的机会，关闭应用程序并移除锁文件和临时文件。不会显示任何消息。\n2. 现在输入命令 `kill -9 PID`，其中\
  \ `PID` 是你在步骤 1 中使用的相同数字。双检输入的数字是否正确。然后按回车。此 `kill` 将结束即使无响应的命令。虽然你可以在步骤 1 之后立即执行步骤\
  \ 2，但你可能想等待两秒让步骤 1 完成。\n3. 如果步骤 2 给出 `No such PID` 错误，请忽略该错误。这意味着步骤 1 已经足够结束任务，步骤\
  \ 2 是多余但无害的。如果你不记得你的 `PID` 数字，可以使用 `ps` 命令查询。\n\n### 使用 `ps` 查找 PID 数字\n\n1. 从 shell\
  \ 提示符下，输入以下两个命令：\n   ```\n   ps -ef\n   ps aux\n   ```\n   某些系统支持这两个命令，但有时只有一个能产生结果。\n\
  2. 使用在你系统上有效的命令，查看初始标题以找到 `PID` 列、用户 (`UID`) 列和命令 (`CMD`) 列。\n3. 如必要，重新运行命令并将其通过到\
  \ `pg`、`more` 或 `less`，以便逐页查看。或者，你可以将 `ps` 命令的输出通过到 `grep` 以过滤出你感兴趣的行。请注意，这也会移除标题。\n\
  4. 找到你想终止的命令。检查用户列以确保该命令是你启动的。\n5. 找到该命令的 `PID`。然后你就可以按照通过 PID 终止作业的步骤操作了。\n\n这是一个用于查找后台作业的命令示例。然而，输出在处理过程中被截断。由于\
  \ `ps` 可以显示许多进程，该命令已使用 `^C`（在 Solaris 上）终止。\n\n```\nps -ef UID PID PPID C STIME\
  \ TTY TIME CMD\nroot 0 0 0 Feb 20 ? 0:02 sched\nroot 1 0 0 Feb 20 ? 0:15 /etc/init-\n\
  root 2 0 0 Feb 20 ? 0:00 pageout\nroot 3 0 0 Feb 20 ? 1:02 fsflush\nroot 289 1 0\
  \ Feb 20 ? 0:00 /usr/lib/saf/sac -t 300\n```\n\n假设你正在运行之前的命令来查找早些启动的 `find` 命令。你可以使用\
  \ `grep` 来过滤出你需要的行，如下所示：\n\n```\nps -ef | grep find | grep -v grep\nroot 27961 27955\
  \ 5 13:53:33 pts/1 0:03 find / -name acme -print\n# ps -ef | grep find\n```\nroot\
  \ 27967 27955 0 13:54:19 pts/1 0:00 grep find\n```\n\n从 `CMD` 字段（最后一个字段），你可以看到两个提到\
  \ find 的进程。查看第 2 列，你看到 PID 27961 是你想终止的 find 进程。注意 PID 27967 是正在查找 find 的 grep 进程；换句话说，grep\
  \ 在查找 find 时看到了自己。\n\n\n\n\n\nacme -print\n\n当你知道想要终止的进程 PID 时，可以输入以下行来杀死进程：\n\n\
  ```\nkill 27961\nkill -9 27961\n```\n\n### 另另\n有关 grep 的更多信息，请参阅第 380 页。\n\n###\
  \ Korn Shell 下的额外作业控制\n在上一节中，我们涵盖了适用于所有 shell（包括 Bourne shell）的后台作业用法。新的 shell 通过引入名为\
  \ *job control*（作业控制）的功能，使得处理后台作业变得简单得多。例如，某些系统已为 Bourne shell 添加了作业控制，可以通过 `jsh`\
  \ 调用。本节描述了其他作业控制命令，它们与 `jsh` 类似：分别是用于 C shell 的 `csh` 和用于 Korn shell 的 `ksh`。\n\n\
  #### 列出后台作业 (*jobs*)\n要列出任何支持作业控制的 shell 中的所有后台作业，进入 shell 提示符并输入 `jobs`。你会看到如下输出：\n\
  \n```\n$ jobs [4] + Running find/-name acme-print > /tmp/acme.find &\n[3] - Stopped\
  \ (SIGTSTP) find\n[2] - Stopped (SIGTSTP) bc\n[1] - Stopped (SIGTSTP) vi acme\n\
  ```\n\n作业编号位于每行开头的括号中。最近一次在前台的作业（最近在你的屏幕上活跃的作业）用加号 (`+`) 表示。次近的作业用减号 (`-`) 表示。注意，你再也不需要担心\
  \ PID 了。\n\n#### 挂起和恢复作业 (Ctrl+Z, bg, fg)\n作业控制最强大的应用之一是将前台作业（占用你键盘和屏幕的作业）挂起到后台，以便输入其他命令，稍后恢复该挂起作业。在某些\
  \ SCO UNIX 操作系统中，极少数工具支持 `Ctrl+Z` 这种方法；在这些系统中，只有 `vi` 命令可以生效。但在 Solaris 和 AIX 下，`Ctrl+Z`\
  \ 似乎对每个工具都有效。你可以用它在前台和后台之间移动作业。这在 Korn shell 中是事实，但在 `jsh` 中不是。\n\n#### 将作业移动到后台并返回前台\n\
  1. 确保你处于支持作业控制的 shell 中，例如 Korn shell（而不是 Bourne shell）。如果你不确定，使用命令 `exec ksh` 调用\
  \ Korn shell。\n2. 输入任何需要一些时间完成的 UNIX 命令。不要在命令末尾输入最后的符号 (`&`)，该作业将在前台运行并占用你的键盘和屏幕。\n\
  3. 要将该作业移动到后台，按下 `Ctrl+Z`。你应该看到如下确认信息，其中了你正在运行的命令：\n```\n^Z[1] + Stopped (SIGTSTP)\
  \ find/-name acme-print > /tmp/acme.find\n```\n如果没有看到此类消息，说明你的 shell 不支持作业控制，或者你的\
  \ UNIX 版本不支持使用 `Ctrl+Z` 挂起作业。你现在将获得一个系统提示符，可以在那里输入其他命令。你之前的作业已被挂起（它不再运行）。\n4. 输入\
  \ `jobs`，你会看到如下输出：\n```\n[2] + Stopped (SIGTSTP) find/-name acme-print > /tmp/acme.find\
  \ &\n[1] - Stopped (SIGTSTP) find\n```\n5. 要让作业在后台继续运行，在 shell 提示符处输入 `bg %JOBID`，其中\
  \ `JOBID` 是 `jobs` 命令显示的作业编号。如果该作业是加号 (`+`) 表示的最近的作业，你可以完全省略 `%JOBID`。\n6. 再次输入\
  \ `jobs`。现在你应该看到如下输出，表示你的作业正在运行：\n```\n[2] + Running find/-name acme-print > /tmp/acme.find\
  \ &\n[1] - Stopped (SIGTSTP) find\n```\n7. 要将你的作业带回前台，在 shell 提示符处输入 `fg %JOBID`，其中\
  \ `JOBID` 是你想带回前台的作业编号。正在运行的命令将出现在屏幕上，指定的作业将再次获得你的键盘和屏幕的控制权。\n\n#### 在 Korn Shell\
  \ 下杀死后台作业 (kill)\n通过作业控制，终止后台作业变得很容易。\n\n\n\n\n\n# 使用作业控制终止后台作业\n\n1. 在 shell 提示符下，输入\
  \ `jobs` 来确定你想终止的作业的作业号。这应该是一个小的数字，不大于显示的作业总数。这**不是** PID 进程标识号。\n2. 输入命令 `kill\
  \ %JOBID`，其中 `JOBID` 是要终止的作业号。\n   - 或者，要终止最近的一个作业，你可以输入 `kill %%`。\n   - 或者，要终止倒数第二个作业，你可以输入\
  \ `kill %2`。\n\n# 在输出前暂停后台作业 (stty)\n\n某些后台作业会运行很长时间，然后显示结果。你可能希望作业在后台继续运行，但在你准备好之前停止输出。\n\
  \n## 在输出前挂起作业\n\n1. 在 shell 提示符下，输入 `stty stop`。这将导致新的后台作业在启动前暂停。这种模式将持续到你注销。\n\
  2. 输入你需要的 UNIX 命令并以 `&` 结尾，使其在后台运行。按回车键。\n3. 在 shell 提示符下，输入 `jobs`。根据 `jobs` 命令的输出判断后台作业是否正在运行。如果后台作业的状态为\
  \ `running`，则它尚未准备好输出。\n4. 当 `jobs` 命令显示你的后台作业为 `stopped` 时，它已准备好提供输出。\n   - 注意：可以将\
  \ `stty stop` 命令放在你的 `.profile` 文件中，这样每次登录时都会设置它。\n   - 输入 `fg %JOBID`，其中 `JOBID`\
  \ 是挂起作业的编号。这将作业带回前台并启动输出，以便你在需要的时间在屏幕上查看输出。\n\n# 第 13 章使用 `tar` 和 `cpio` 保存和恢复文件\n\
  \n## 通 UNIX 设备、磁带和磁盘设备\n\n### 使用 `tar` 备份\n- 列出 `tar` 备份文件\n- 从 `tar` 备份恢复文件\n\n\
  ### 使用 `cpio` 备份\n- 列出 `cpio` 备份文件\n- 从 `cpio` 备份恢复文件\n\n## 备份用户文件\n\n`备份`文件意味着制作这些文件的副本，以便在需要时能够恢复这些文件。文件可以复制到硬盘上，但通常情况下是备份到磁带或磁盘上，这样在硬盘损坏时可以保护你的数据。备份可以通过网络在另一个系统的磁带驱动器上进行。`归档`是备份的另一种说法。备份到磁带或磁盘的文件称为数据的`归档副本`。这些磁带或磁盘归档也可用于将数据传输到另一个系统。本节讨论了用户如何备份自己的文件，无论是为了保护数据还是为了传输数据。root\
  \ 用户可以备份整个系统。本章还讨论了系统备份，它与用户备份相似，但有额外的考虑因素。如果你的 UNIX 系统位于计算机运行区域的限制区域，你可能不允许靠近实际计算机。在这种情况下，你无法为了备份目的插入磁带或磁盘。你可能需要提交此类备份请求，并与系统管理员或计算机运行部门安排时间。管理员可能会告诉你，系统上的所有文件都会定期备份，因此你不需要自己进行特殊的备份。如果是这样，当你需要恢复某些文件时，请向他们了解流程。\n\
  \n\n\n\n网络用户可能会对磁带和软盘设备感到困惑。我曾见过 Windows 用户通过 `telnet` 连接到 UNIX，这允许用户登录并运行 UNIX\
  \ 命令。相反，用户会将软磁盘插入 Windows 软盘驱动器，并尝试通过输入 UNIX 命令来访问 UNIX！这是行不通的，因为 UNIX 命令访问的是 UNIX\
  \ 系统上的软盘驱动器。网络和 `telnet` 的魔力允许你在远端的 UNIX 系统上运行命令，但任何 UNIX 软盘命令访问的都是那个远程 UNIX 系统上的软盘，而不是你自己的\
  \ Windows PC。在这种情况下，你可以使用如 Windows `ftp` 等工具将 UNIX 文件带到本地系统，然后将其备份到本地软盘驱动器。\n\n\
  本章不是为从远程系统访问 UNIX 的网络用户准备的。本章针对那些物理接触 UNIX 计算机本身的用户。要备份文件，请将你自己的软磁盘或磁带插入 UNIX 机器。然后，运行在本章中讨论的\
  \ UNIX 命令将文件备份到该软盘或磁带。最后，取出软盘或磁带并存在安全的地方，直到你需要恢复这些文件的备份副本（如果需要的话）。\n\n在插入带有你想要恢复的重要文件的软盘或磁带时要小心。系统上的其他用户，即使是另一个城市的远程用户，也可能启动软盘或磁带操作，从而覆盖你的磁带。软盘和磁带通常有一个小滑块，可以移动以写保护你的介质并防止写入。\n\
  \n### 另需参考\n- 有关 `ftp` 文件传输的更多信息，请参见第 583 页\n- *UNIX 设备文件*\n\n### UNIX 设备文件\n在 UNIX\
  \ 中，有特殊文件允许你访问物理设备。这些文件被称为*设备文件*（device files）或*设备节点*（device nodes）。如果你将输出重定向到特殊设备文件，输出将发送到物理设备。如果你从特殊设备文件重定向输入，输入（如果有）将来自该设备。某些设备更为复杂，其设备节点只能通过特定方式或特殊程序访问。\n\
  \n按照惯例，所有的特殊设备文件都存储在 `/dev` 目录下。这导致设备文件的完整路径以 `/dev/` 开头，表示这不是一个普通的 UNIX 文件。每个设备文件都是指向该设备驱动程序的指针。*驱动程序*（driver）是一个包含子程序的软件程序，可以根据所需的设备函数进行调用（例如，读、写、回退、寻道等）。\n\
  \n让我们查看 Solaris 2.6 上的一些设备文件。访问软盘的文件恰好包含 diskette 一词（其他 UNIX 系统并非如此）。这些文件实际上是许多设备名称的符号链接，因此我为\
  \ `ls` 添加了 `-L` 选项以跟踪符号链接并查看实际设备文件，如下：\n\n```\nls -L /dev/diskette\nbrw-rw- 1 root\
  \ sys 36, 2 Apr 10:57 /dev/diskette\nbrw-rw- 1 root sys 36, 2 Apr 10:57 /dev/diskette0\n\
  crw-rw- 1 root sys 36, 2 Apr 27 11:24 /dev/rdiskette\ncrw-rw- 1 root sys 36, 2 Apr\
  \ 27 11:24 /dev/rdiskette0\n```\n\n在前面的示例中，注意行首的字符（代表文件类型）是字母 `b` 或 `c`。`b` 代表*块*（block）设备文件；`c`\
  \ 代表*字符*（character）设备文件。字符设备也称为*原始*（raw）设备。它是一个简单一个接一个传递字符的驱动程序。这被称为*顺序访问*（sequential\
  \ access）。块驱动程序用于更复杂的情况，允许对软磁盘的特定块进行随机访问。某些设备只有字符设备而块设备（例如，磁带机仅允许顺序访问）。\n\n在同一个示例中，注意缺少文件大小。文件大小通常列在组之后、最后访问日期之前。设备文件没有大小，而是有两个用逗号分隔的数字：主号（major\
  \ number）和设备号（minor number）。在本示例中，列出的所有文件主号均为 36，设备号均为 2。这些设备文件不包含关于设备的代码或数据。事实上，设备文件是完全空的，这就是为什么没有列出大小。访问系统中所有设备的驱动代码链接在一起形成一个巨大的\
  \ UNIX 内核。设备文件的主号表示应使用内核中的哪个驱动程序来访问该设备。设备号为驱动程序提供关于该设备的额外信息。\n\n有些人会错误地将 `/dev`\
  \ 文件从一个 UNIX 系统复制到另一个 UNIX 系统，认为他们正在将驱动代码传输到新系统。由于 `/dev` 文件仅是内核的指针，你可以理解为什么他们的尝试失败了。\n\
  \n### 确定使用什么设备名称\n在本章中，我解释了如何使用 `tar` 和 `cpio` 来备份和恢复文件。你可以在所有 UNIX 系统上使用这些命令。然而，你必须确定使用什么设备名称。这因系统而异。最佳做法是联系系统管理员，询问哪些设备名称可用于备份，以及是否有必须遵守的特殊规则。遗憾的是，系统文档通常不涵盖设备名称。但有一些\
  \ man 页有助于查找设备名称：\n\n- Solaris：针对软盘设备：`man -s 7D fd`\n针对 SCSI 磁带设备：`man st`\n\n\n\
  \n\n\n# 设备文档\n\n## 手册页引用\n\n- **SCO UNIX OpenServer**: 软磁盘设备：`man fd`。SCSI 磁带设备：`man\
  \ Stp`。\n- **SCO UNIX UnixWare 7**: 软磁盘设备：`man 7 fd`。SCSI 磁带设备：`man 7 tape`。\n-\
  \ **AIX 4.x**: 软磁盘设备：`man fd`。SCSI 磁带设备：`man rmt`。\n- **Linux**: 软磁盘设备：`man fd`。SCSI\
  \ 磁带设备：`man st`。\n\n## 通过关键字查找设备\n\n在其他 UNIX 系统上，如果支持使用 `man -k` 通过关键字查找手册主题，请尝试以下命令来查找可能设备的帮助页：\n\
  \n```bash\nman -k flop\nman -k disket\nman -k tape\nman -k scsi\n```\n\n在 Solaris\
  \ 上，使用以下命令：\n```bash\nman -k tape\n```\n\n该命令产生的输出包含以下行：\n\n```\nrmt (1m) - remote\
  \ magtape protocol module | Page 332\nst (7d) - driver for SCSI tape devices\nstli\
  \ (8) - Silo Tape Library Interface\n```\n\n## 设备名称\n\n在 AIX 4.x 上，有一个非常有用的命令：`lsdev\
  \ -C`。该命令显示系统上每个设备的信息。以下是该命令的部分输出：\n\n```\nhdisk0 Available 04-B0-00-0,0 4.0 GB\
  \ SCSI Drive\nhdisk1 Available 04-B0-00-1,0 4.0 GB SCSI Drive\nrmt0 Available 04-B0-00-4,0\
  \ 4GB Tape Drive\ncd0 Available 04-B0-00-5,0 CD-ROM Drive\n```\n\n在陌系统中，没有简单的方法可以确定要使用的确切设备名称。我们查看了一些可以使用的命令来获取这些设备名称的线索。再次，最好的建议是询问你的系统管理员或系统中任何使用你想要使用的设备员。\n\
  \n## 磁带驱动\n\nUNIX 系统上常见的磁带机类型是 SCSI 磁带机。这些设备需要计算机中安装 SCSI 控制器卡。然后可以将 SCSI 磁盘驱动器、SCSI\
  \ 磁带机和 SCSI CD-ROM 驱动连接到 SCSI 控制器。系统管理员必须设置每个新的 SCSI 设备，尽管某些 UNIX 系统在启动时会自动检测新的\
  \ SCSI 设备。任何管理设置过程因系统而异。\n\n以下是一些常见的 SCSI 磁带机类型：\n\n- **四分之一英寸盒式 (QIC) 流光磁带**：四分之一是指磁带的宽度。这些磁带机有不同的型号。有些容量仅为\
  \ 250 MB；有些容量高达 26 GB。许多大型磁带机可以读取在较小 QIC 磁带机上写入的磁带。\n- **4-mm DAT**：这种驱动器的常见型号存储\
  \ 4 GB 原始数据，压缩后高达 8 GB。磁带长度有 90 米或 120 米。更长的磁带可以存储更多数据。磁带有多种样式，如 `DDS` 或 `DDS-II`，因此为你的驱动器获取正确的磁带类型非常重要。\n\
  - **8-mm Exabyte 螺旋扫描**：这种驱动机的常用类型容量为 2.3 GB 或 5 GB。9 迹半英寸磁带机通常具有低（800 bpi）、中（1600\
  \ bpi）或高（3200 bpi）密度设置。它们也被称为*卷式 (reel to reel)* 驱动器。由于成本原因，除了在政府机构交换或提交数据外，它们很少使用。新磁带机的出现和列表的更新频繁。例如，现在有了\
  \ Trevan、`AIT` 和 `DLT` 磁带机。如果你打算购买磁带盒来备份文件，请确保为你的驱动器购买正确的磁带类型和长度。最好的方法记录下当前使用的磁带品牌和型号。\n\
  \n## UNIX 磁带设备名称\n\nSCSI 磁带的 UNIX 驱动名称简单根据其添加到系统的顺序对每个磁带机进行编号。此磁带编号是一个逻辑数字，与任何物理值（如\
  \ SCSI 目标 ID 号）都没有关系。以下是某些特定 UNIX 系统的 SCSI 设备名称：\n\n- **Solaris**: `/dev/rmt/0`,\
  \ `/dev/rmt/1`, `/dev/rmt/2` 等。\n- **SCO UNIX OpenServer**: `/dev/rStp0`, `/dev/rStp1`,\
  \ `/dev/rStp2` 等。\n- **SCO UNIX UnixWare 7**: `/dev/rmt/ctape1`, `/dev/rmt/ctape2`\
  \ 等。\n- **AIX 4.x**: `/dev/rmt0`, `/dev/rmt1`, `/dev/rmt2` 等。\n- **Linux**: `/dev/st0`,\
  \ `/dev/st1` 等。\n\n\n\n\n\n上述列表显示，要在 Solaris 系统上使用第一个磁带驱动器，您可以使用 `/dev/rmt/0`。要使用添加到\
  \ SCO UNIX OpenServer 系统中的第二个磁带驱动器，您可以使用 `/dev/rStp1`。\n\n大多数系统允许为特定的磁带驱动器提供多个设备名称。每个名称具有相同的设备号（因为使用相同的内核驱动程序），但具有不同的设备号，以修改磁带驱动器的功能。常见的备用设备名称是不回带磁带设备名称。使用标准磁带设备名称时，访问磁带的\
  \ UNIX 命令在磁带操作完成且磁带完全回带之前不会结束。如果您改用不回带磁带设备，则不会执行最后的这个回带操作。这将磁带定位在最后一次访问的文件之后，以便在该点可以读取或写入新文件，磁带驱动器硬件支持此操作。\n\
  \n以下是 SCSI 磁带设备 0 的一些备用名称：\n\n| Solaris | |\n| :--- | :--- |\n| `/dev/rmt/0` | 标准设备名称\
  \ |\n| `/dev/rmt/0n` | 不回带设备 |\n| `/dev/rmt/0l` | 选择低密度 |\n| `/dev/rmt/0m` | 中等密度\
  \ |\n| `/dev/rmt/0h` | 高密度 |\n| `/dev/rmt/0u` | 超高密度 |\n| `/dev/rmt/0c` | 压缩 |\n\
  | `/dev/rmt/0b` | BSD 行为 |\n\n这些选项可以组合使用。\n\n以下是 `/dev/rmt` 目录下的可用设备文件：\n\n| | |\n\
  | :--- |\n| `0` |\n| `0bn` |\n| `0cb` |\n| `0cn` |\n| `0hb` |\n| `0hn` |\n| `0lb`\
  \ |\n| `0ln` |\n| `0b` |\n| `0c` |\n| `0cbn` |\n| `0h` |\n| `0hbn` |\n| `0l` |\n\
  | `0lbn` |\n| `0m` |\n| `0mn` |\n| `0u` |\n| `0un` |\n| `0ub` |\n| `0un` |\n| `0mb`\
  \ |\n| `0mbn` |\n\n| SCO UNIX OpenServer | |\n| :--- | :--- |\n| `/dev/rStp0` |\
  \ 标准设备名称 |\n| `/dev/nrStp0` | 不回带设备 |\n| `/dev/xStp0` | |\n\n\n\n\n\n# SCO UNIX\
  \ UnixWare 7 - 第 335 页\n\n发布特殊命令：\n\n| 设备名称 | 描述 | AIX 4.x |\n| :--- | :--- | :---\
  \ |\n| `/dev/rmt/ctape1` | 标准设备名称 | |\n| `/dev/rmt/ntape1` | 非回带设备 | |\n| `/dev/rmt/nrtape1`\
  \ | 留存而非回带设备 | |\n| `/dev/rmt/utape1` | 关闭时卸载 | |\n| `/dev/rmt0` | 低容量，打开时留存，关闭时回带\
  \ | Y |\n| `/dev/rmt0.1` | | N |\n| `/dev/rmt0.2` | | Y |\n| `/dev/rmt0.3` | | Y\
  \ |\n| `/dev/rmt0.4` | | Y |\n| `/dev/rmt0.5` | | N, N |\n| `/dev/rmt0.6` | | N,\
  \ N |\n| `/dev/rmt0.7` | | Y, Y, N |\n| `/dev/rmt0` | Linux | N |\n| `/dev/st0`\
  \ | 标准设备名称 | |\n| `/dev/nst0` | 非回带设备 | |\n\n磁带在使用前不需要进行格式化。然而，某些应用程序在第一次为此程序使用磁带时必须对其进行初始化，但应用程序应根据需要提示您。应定期对四分之一英寸（QIC）盒磁带进行重新张紧，以确保在读写过程中磁带流转顺畅，从而实现最大的数据可靠性。在使用完非回带设备节点后，您应该在移除磁带之前执行\
  \ `rewind` 命令。以下列表提供了在几种类型的 UNIX 系统上对第一个磁带驱动器进行留存或回带的 shell 命令：\n\n```bash\nmt -f\
  \ /dev/rmt/0 retention\nmt -f /dev/rmt/0 rewind\n```\n\n\n\n\n\n# 磁带设备管理\n\n| 操作系统\
  \ | 命令 |\n| :--- | :--- |\n| SCO UNIX OpenServer | `tape reten /dev/rStp0`, `tape\
  \ rewind /dev/rStp0` |\n| SCO UNIX UnixWare 7 | `tape reten /dev/rmt/ctape1`, `tape\
  \ rewind /dev/rmt/ctape1` |\n| AIX 4.x | (无保留命令) `mt -f /dev/rmt0 rewind` |\n| Linux\
  \ | `mt -f /dev/st0 retention`, `mt -f /dev/st0 rewind` |\n\n## 磁盘驱动器\n\n### 软磁盘\n\
  软磁盘为备份或传输文件及程序提供了方便的方法，但它们存储的数据量远少于磁带备份。常见的软磁盘驱动器是 3.5 英寸软驱器。每张双面高密度软磁盘的容量为 1.44\
  \ MB。在过去，你还能找到盒装容量较低的单面或低密度软磁盘，但这些现在已经很罕见。有些系统使用较旧的 5.25 英寸软驱器。双面高密度 5.25 英寸软磁盘只能容\
  \ 1.2 MB。5.25 英寸软磁盘也曾有容量较低的单面或低密度品种。你可能会遇到较新的 2.88 MB 软磁盘，它们需要特殊的驱动器才能容纳 2.88 MB\
  \ 的容量。有些 UNIX 系统完全没有软驱。\n\n### UNIX 软磁盘设备名称\n`/dev` 目录下通常有若干软磁盘设备文件，用于处理这些单面和低密度磁盘。例如，在\
  \ SCO UNIX OpenServer 上，软磁盘设备名称包含 `48`、`96` 或 `135`，表示磁盘每英寸的道数；`ss` 或 `ds` 表示单面或双面；以及\
  \ `15`、`18`、`21` 或 `36` 表示每道的扇区数。\n\n以下显示了 SCO UNIX OpenServer 上软磁盘驱动器 `fd0` 的各种设备：\n\
  \n```bash\ncd /dev\nls -CF fd0\n```\n\n我们可以忽略大多数此类设备名称，因为小于 1.44 MB 的软磁盘已经很少使用了。在以下列表中，我提供了最常见的\
  \ 1.44 MB 3.5 英寸软磁盘设备文件。我也提供了 2.88 MB 3.5 英寸软磁盘的设备名称，以防你遇到这种扩展容量驱动器。大多数 UNIX 系统现在还提供自动感应软磁盘设备文件，它可以根据软磁盘的格式化容量自动调整。你可以使用这些自动感应设备进行大多数操作，但某些\
  \ UNIX 系统不允许在格式化时使用自动感应设备。我在软磁盘文件列表中也包含了格式化软磁盘的完整命令：\n\n| 操作系统 | 设备文件 | 格式化命令 (1.44\
  \ MB) |\n| :--- | :--- | :--- |\n| SCO UNIX OpenServer | `/dev/fd0` (自动感应块设备文件)\
  \ | `format /dev/diskette` |\n| SCO UNIX OpenServer | `/dev/rdiskette` (自动感应字符设备或原始设备文件)\
  \ | `format /dev/rdiskette` |\n| SCO UNIX OpenServer | `/dev/fd013536` (2.88 MB\
  \ 块设备文件) | `format /dev/fd013536` |\n| SCO UNIX OpenServer | `/dev/rfd013536` (2.88\
  \ MB 字符设备或原始设备文件) | `format /dev/rfd013536` |\n\n**注意：** 在 Solaris 下，有一个卷管理守护进程\
  \ (`vold`) 想要完全控制所有软磁盘和 CD-ROM 驱动器。在 `vold` 运行时，你无法从命令行访问这些设备。\n\n\n\n\n\n| 设备路径\
  \ | 描述 | 命令 |\n| :--- | :--- | :--- |\n| `/dev/rfd0135ds18` | 1.44 MB 字符设备或原始设备文件\
  \ | 使用 `format /dev/rfd0135ds18` 格式化 1.44 MB 磁盘 |\n| SCO UNIX UnixWare 7 | | |\n\
  | `/dev/dsk/f0t` | 自动感应块设备文件 | |\n| `/dev/rdsk/f0t` | 自动感应字符设备或原始设备文件 | |\n| `/dev/dsk/f03et`\
  \ | 2.88 MB 块设备文件 | |\n| `/dev/rdsk/f03et` | 2.88 MB 字符设备或原始设备文件 | |\n| `/dev/dsk/f03ht`\
  \ | 1.44 MB 块设备文件 | |\n| `/dev/rdsk/f03ht` | 1.44 MB 字符设备或原始设备文件 | 使用 `format /dev/rdsk/f03ht`\
  \ 格式化 1.44 MB 磁盘 |\n| AIX 4.x | | |\n| `/dev/fd0` | 自动感应块设备文件 | |\n| `/dev/rfd0`\
  \ | 自动感应字符设备或原始设备文件 | |\n| `/dev/fd0.36` | 2.88 MB 块设备文件 | |\n| `/dev/rfd0.36` |\
  \ 2.88 MB 字符设备或原始设备文件 | |\n| `/dev/fd0.18` | 1.44 MB 块设备文件 | |\n| `/dev/rfd0.18`\
  \ | 1.44 MB 字符设备或原始设备文件 | 使用 `format -d /dev/rfd0` 格式化 1.44 MB 磁盘 |\n| 第 339 页 |\
  \ Linux | |\n| `/dev/fd0` | 自动感应块设备文件（无） | |\n| `/dev/rfd0` | 自动感应字符设备或原始设备文件（无）\
  \ | |\n| `/dev/fd0E2880` | 2.88 MB 块设备文件（无） | |\n| `/dev/rfd0E2880` | 2.88 MB 字符设备或原始设备文件（无）\
  \ | |\n| `/dev/fd0H1440` | 1.44 MB 块设备文件（无） | |\n| `/dev/rfd0H1440` | 1.44 MB 字符设备或原始设备文件（无）\
  \ | 使用 `format /dev/fd0H1440` 格式化 1.44 MB 磁盘 |\n| 选择 *tar* 或 *cpio* 或其他备份程序 | |\
  \ |\n\n\n\n\n\n`tar` 和 `cpio` 是所有类型 UNIX 系统中常见的两种传统工具，它们允许你保存和恢复文件。UNIX 系统上还有许多其他备份工具，它们比\
  \ `tar` 或 `cpio` 更好用且更容易上手。它们的名称包括 `dump`、`ufsdump`、`Lone Tar`、`BackupEdge`、`bru`、`mksysb`、`Solaris\
  \ Data Backup`、`ARCserve`、`Legato Networker` 等。其中某些是特定类型 UNIX 的标准工具，某些是从第三方提供的付费软件。对于自己的\
  \ UNIX 系统，你应该调查适用于你类型 UNIX 的可用备份程序，并选择提供最全功能的一个。\n\n### 警告：恢复完整备份并非易事\n\n你可能认为由于你有了完整备份，你的系统就是安全的。然而，在许多类型的\
  \ UNIX 上，在恢复备份之前，你必须重新安装并重新配置操作系统（这可能听起来很困难，甚至更难）。在评估备份程序时，应为能够在紧急情况下自动恢复整个系统的工具打出高分。\n\
  \n### 既然有更好的程序，为什么还要考虑 tar 或 cpio？\n\n答案是，`tar` 和 `cpio` 很有价值，因为你几乎在所有的 UNIX 系统上都能找到它们。假设你正在奔波，将访问十个不同的\
  \ UNIX 系统，并希望每个站点加载一个演示程序。你会带什么种类型的演示程序备份？如果这些是未知系统，最稳妥的方法是带上演示程序的 `tar` 或 `cpio`\
  \ 备份。由于同样的原因，如果你需要将软件发送到许多不同的 UNIX 系统上，`tar` 或 `cpio` 是一个明智的选择。\n\n如果你从支持多种类型 UNIX\
  \ 系统的供应商那里接收软件，收到的软件很可能是 `tar` 或 `cpio` 格式。\n\n学习 `tar` 和 `cpio` 对你来说很有价值，因为你可能会收到任何形式的数据。然而，`tar`\
  \ 是一个更容易使用的工具，许多供应商选择这种格式来发送他们的软件产品。`tar` 对于备份特定文件或目录非常方便。它可以递归地备份任何目录，这意味着会备份该目录下的所有文件和子目录，以及这些子目录的所有文件和子目录，以此类推。\n\
  \n在互联网上，你有时会看到扩展名为 `.tar` 的文件，这表示一个 tar 归档。这意味着使用 `tar` 将一组文件保存了一个单一磁盘文件，这样只需要下载一个文件而不是多个文件。你可能还会看到扩展名\
  \ `.tgz`，它是一个经过 `gzip` 压缩的 tar 归档，这样下载速度会更快。\n\n`tar` 在历史上具有一些局限性，这使得它不适用于备份整个系统（参见后文章节）。然而，`cpio`\
  \ 在备份内容方面提供了更好的灵活性和控制，但这使得 `cpio` 使用起来更复杂。使用 `cpio`，你可以选择只备份目录的一部分或选择排除目录的一部分，而\
  \ `tar` 无法做到。在从备份中恢复文件时，`cpio` 提供的灵活性比 `tar` 大得多。`cpio` 允许你进行增量备份，这意味着你备份自上次备份以来更改的文件；而\
  \ `tar` 不。尽管 `cpio` 增加了复杂度，但它是执行完整备份的更好选择，特别是在旧的 UNIX 系统上。\n\n后续章节将讨论如何在系统备份和恢复中使用\
  \ `tar` 和 `cpio`。\n\n### 使用 tar 备份和恢复文件\n\n你会发现，关于 `tar` 的这一节使用的措辞与后续关于 `cpio` 的章节大部分相同。这两个命令具有相似的功能，仅有某些特定细节有所不同。备份目录子树\n\
  \n`tar` 是 tape archive（磁带归档）实用工具，因为典型的 UNIX 备份是在磁带驱动上进行的。`tar` 也可以备份到软磁盘或磁盘文件。这是一个备份一个完整目录的\
  \ basic `tar` 命令示例：\n\n```bash\n$ cd /usr/fred/projects $ tar cvf /dev/XXX? .\n\
  ```\n\n首先使用 `cd` 切换到要备份的目录。`tar` 会递归地备份该目录，自动包含所有文件、子目录及其内容。以下是该 `tar` 命令中其他元素的描述：\n\
  \n\n\n\n\n# Tar 命令\n\n## 选项\n\n- `c`: 创建备份。在此 tar 选项列表中，第一个字母必须是 `c`、`x` 或 `t`。\n\
  - `v`: 详细模式（显示正在备份的文件名）。\n- `f`: 允许指定要备份到的设备或文件。\n- `/dev/XXX?`: 非常重要，必须将此替换为你想要备份的磁带或软磁盘设备名称。（我们在\
  \ ... 章节中介绍过这些设备名称。）你也可以指定一个磁盘文件名来存放 tar 归档。\n- `.`: 点是一个相对路径，表示当前目录为要备份的目录。某些用户会错误地在此处使用星号\
  \ `*` 而不是点，但星号不会备份该目录下的隐藏文件（以点开头的文件）。\n\n## 使用示例\n\n给 tar 一个有效的 `/dev` 名称。不要假设在某一个系统上有效的设备在另一个系统上也能工作。当你输入\
  \ tar 命令时，请双倍检查用于备份路径的 `/dev` 拼写。如果你使用了错误的设备名称或拼写错误，tar 将把你的文件备份到磁盘文件中，这可能会耗尽可用的磁盘块并导致系统崩溃。\n\
  \n当你运行此 tar 命令时，你可能会看到类似下面的输出：\n\n```bash\n$ cd /usr/fred/projects $ tar cvf /dev/XXX?\
  \ .\na ./0K\na ./acme/ 0K\na ./acme/report6 1K\na ./pegasus/ 0K\na ./pegasus/1997/\
  \ 0K\na ./pegasus/1997/expenses 1K\na ./pegasus/1997/sales 4K\na ./pegasus/1998/\
  \ 0K\na ./pegasus/1998/expenses 8K\na ./pegasus/1998/sales 10K\n```\n\n由于我们使用了 tar\
  \ 的 `v` 选项，我们可以看到每个正在备份的目录和文件名，以及文件的大小。每行开头的字母 `a` 告诉我们文件正在被归档（保存到备份软磁盘或磁带上）。如果数据量很大，备份可能需要数小时才能完成。一旦\
  \ tar 备份完成，我们可以包含备份的介质称为 tar 归档（tar archive）。根据介质类型，我们也可以将备份称为 tar 软磁盘（tar diskette）或\
  \ tar 磁带（tar tape）。\n\n如果你省略了 `v` 选项，在 tar 备份期间不会显示文件名：\n\n```bash\n$ cd /usr/fred/projects\
  \ $ tar cf /dev/XXX? .\n```\n\n## 备份指定的目录或文件\n\n你可以使用以下命令为 tar 指定特定的文件或目录列表进行备份：\n\
  \n```bash\n$ cd /usr/fred/projects $ tar cvf /dev/XXX? ./acme* ./reports/1997 ./reports/1998\n\
  ```\n\n`./acme*` 说明 shell 通配符可以用来生成文件列表，在这种情况下，这些是所有以 acme 开头的文件和目录。`./reports/1997`\
  \ 说明可以指定目录。这些目录会被递归地备份。上一个示例指定了要备份的路径，这是推荐的做法。\n\n### 另参\n有关星号 (**) 通配符的更多信息，请参第\
  \ 232 页。\n\n## 列出 tar 归档的目录\n\n输入以下命令向标准输出显示 tar 归档的内容（保存在该 tar 软磁盘或磁带上的文件名）：\n\n\
  ```bash\n$ tar tvf /dev/XXX?\ndrwxr-xr-x 1001/10 0 Apr 28 21:23 1998 ./\ndr-xr-x\
  \ 1001/10 0 Apr 28 21:24 1998 ./acme/\n-r--r--r-- 1002/10 29 Apr 28 21:24 1998 ./acme/report6\n\
  drwxr-xr-x 1001/10 0 Apr 28 21:25 1998 ./pegasus/\ndrwxr-xr-x 1001/10 0 Apr 28 21:26\
  \ 1998 ./pegasus/1997/\n-rw-r--r-- 1001/10 135 Apr 28 21:26 1998 ./pegasus/1997/expenses\n\
  -rw-r--r-- 1001/10 3281 Apr 28 21:27 1998 ./pegasus/1997/sales\n```\n\n`t` 显示备份的目录列表。在此\
  \ tar 选项列表中，第一个字母必须是 `c`、`x` 或 `t`。此操作不会保存或恢复任何文件。`/dev/XXX?` 应该替换为 tar 设备或备份文件名。当你运行此\
  \ tar 命令时，你可能会看到如下所示输出：\n\n\n\n\n\n# 销售 / 支出\n\n```\ndrwxr-xr-x 1001/10        \
  \ 0 Apr 28 21:27 1998 ./pegasus/1998/\n-rw-r--r-- 1001/10      7995 Apr 28 21:26\
  \ 1998 ./pegasus/1998/\n-rw-r--r-- 1001/10      9463 Apr 28 21:27 1998 ./pegasus/1998/\n\
  ```\n\n## 销售\n\n`$ 让我选取此输出的第三行并解释每个字段。这一行以 `report6` 结尾。\n\n```\n-r--r--r--  这是文件类型和权限，就像\
  \ `ls -l` 显示的一样。\n1002/10 1002 表示该文件的所有者（UID 号）。10 表示文件的所属组（GID 号）。\n29  这是文件以字节为单位的大小。\n\
  Apr 28 21:24 1998 这是文件的最后修改日期和时间。\n./acme/report6 这是备份中的文件名。\n```\n\n如果你省略了 `v`\
  \ 选项，则只显示文件名：\n\n```\n$ tar tf /dev/XXX? ./acme\n./acme/report6\n./pegasus/\n./pegasus/1997/\n\
  ./pegasus/1997/expenses\n./pegasus/1997/sales\n./pegasus/1998/\n```\n\n请注意，列出目录所需的时间与最初写入\
  \ `tar` 归档的时间相同。\n\n## 使用 tar 恢复归档\n\n为了使用 `tar` 备份中的任何文件，我们必须首先将所需的文件或多个文件从 `tar`\
  \ 磁带或软磁盘恢复到硬盘上。然而，在使用 `tar` 恢复一个大型 `tar` 归档之前，有几个重要的细节需要检查。以下章节将介绍此类问题，例如检查磁盘空闲块、绝对和相对路径、规划文件恢复的位置、绕过绝对文件名的限制以及切换到正确的目录。\n\
  \n### 检查磁盘空闲块\n\n检查各种文件系统中的磁盘空闲块是非常重要的，因为任何 UNIX 文件系统如果用尽了可用块，应用程序可能会报错，这可能导致数据库处于损坏状态。如果根文件系统用尽了块，整个\
  \ UNIX 系统可能会崩溃。同样，任何文件系统中的可以创建的文件数量都是有限的。`df` 显示每个文件系统还可以创建多少个文件。在恢复归档之前，请先检查文件系统是否即将用尽文件。\n\
  \n以下是 `df` 命令的示例：\n\n```\n$ df /dev/dsk/c0t0d0s0  154776 blocks 46382 files\nusr\
  \             /dev/dsk/c0t0d0s6  240348 blocks 254137 files\n/proc             \
  \  0 blocks 940 files\n/dev/fd             0 blocks 0 files\n/export/home    /dev/dsk/c0t0d0s3\
  \  3456112 blocks 427351 files\n/opt            /dev/dsk/c0t0d0s5  382996 blocks\
  \ 268002 files\n/tmp             swap  198216 blocks 9636 files\n/export/home/data\
  \ /dev/dsk/c0t0d1s0  8231524 blocks 933162 files\n```\n\n你将在 `df` 中为你的 UNIX 系统中存在的每个文件系统看到一行。在上面的示例中，有八个文件系统。每个文件系统通过行开头的目录来识别。你可以通过查找\
  \ `df` 中最长的起始目录来确定目录位于哪个文件系统。例如，`/export/home/data/acme` 位于 `/export/home/data`\
  \ 文件系统，而不是 `/export/home` 文件系统，因为你使用了最长的 `df` 目录。\n\n## 另阅\n\n有关 `df` 和文件系统的更多信息，请参阅第\
  \ 74 页。\n\n\n\n\n\n# 检查绝对路径与相对路径\n\n在从 tar 备份中恢复任何文件之前，请列出 tar 目录并检查文件名是否以斜杠（`/`）开头。绝对路径或全路径以斜杠开头。相对路径则不以斜杠开头。\n\
  \n查看以下示例：\n\n```bash\n$ tar tvf /dev/XXX? drwxr-xr-x 1001/10      0 Apr 28 21:23\
  \ 1998 /mori/\ndr-xr-x--- 1002/10      0 Apr 28 21:24 1998 /mori/acme/\n-r--r--r--\
  \ 1002/10      29 Apr 28 21:24 1998 /mori/acme/report6\n$ tar tvf /dev/XXX? 1001/10\
  \      0 Apr 28 21:25 1998 /mori/pegasus/\ndrwxr-xr-x 1001/10      0 Apr 28 21:26\
  \ 1998 /mori/pegasus/1997/\n-rw-r--r-- 1001/10      135 Apr 28 21:26 1998 /mori/pegasus/1997/expenses\n\
  -rw-r--r-- 1001/10      3281 Apr 28 21:27 1998 /mori/pegasus/1997/sales\ndrwxr-xr-x\
  \ 1001/10      0 Apr 28 21:27 1998 /mori/pegasus/1998/\n-rw-r--r-- 1001/10     \
  \ 7995 Apr 28 21:26 1998 /mori/pegasus/1998/expenses\n-rw-r--r-- 1001/10      9463\
  \ Apr 28 21:27 1998 /mori/pegasus/1998/sales\n```\n\n在这个示例中，所有文件名都以斜杠开头（例如，`/mori/acme/report6`）。因此，上面的\
  \ tar 包含了绝对路径。\n\n现在考虑这个示例：\n\n```bash\n$ tar tvf /dev/XXX dr-xr-x--- 1002/10  \
  \    0 Apr 28 21:24 1998 ./acme/\n-r--r--r-- 1002/10      29 Apr 28 21:24 1998 ./acme/report6\n\
  drwxr-xr-x 1001/10      0 Apr 28 21:25 1998 ./pegasus/\ndrwxr-xr-x 1001/10     \
  \ 0 Apr 28 21:26 1998 ./pegasus/1997/\n-rw-r--r-- 1001/10      135 Apr 28 21:26\
  \ 1998 ./pegasus/1997/expenses\n-rw-r--r-- 1001/10      3281 Apr 28 21:27 1998 ./pegasus/1997/sales\n\
  drwxr-xr-x 1001/10      0 Apr 28 21:27 1998 ./pegasus/1998/\n-rw-r--r-- 1001/10\
  \      7995 Apr 28 21:26 1998 ./pegasus/1998/expenses\n-rw-r--r-- 1001/10      9463\
  \ Apr 28 21:27 1998 ./pegasus/1998/sales\n```\n\n在前面的示例中，所有文件名都以点斜杠（`./`）开头。因为它们不是斜斜开头，所以它们是相对路径而不是绝对路径。\n\
  \n最后，来看这个示例：\n\n### 文件将恢复到何处\n\n如果路径以斜杠开头，tar 通常会将该文件仅恢复到该绝对路径。这可能是危险的，因为我们得到的是每个文件的旧版本，会丢失自备份以来所做的任何更新。在恢复此文件之前，最好的做法是将该文件的当前版本复制一份，以确保保留所有更新。\n\
  \n例如，假设我们显示目录表，并在输出中看到这一行：\n`-rw-r--r-- 1001/10 135 Apr 28 21:26 1998 /mori/pegasus/1997/expenses`\n\
  \n然而，如果 tar 归档文件使用相对路径，我们可以将文件恢复到许多不同的目录。这非常有用，例如当我们想从 tar 备份的旧文件中查找信息，而不覆盖该文件的当前版本时。在这种情况下，我们将备份文件恢复到临时工作目录，查找所需信息，完成后删除旧文件。\n\
  \n另参\n关于相对路径和绝对路径的更多信息，请参阅第 49 页。\n\n\n\n\n\n```\n-rw-r--r-- 1001/10      135 Apr\
  \ 28 21:26 1998 ./mori/pegasus/1997/expenses\n-rw-r--r-- 1001/10      135 Apr 28\
  \ 21:26 1998 mori/pegasus/\n```\n\n无论哪种情况，我们的备份文件使用的都是相对路径。你可以通过在要恢复的相对路径开头插入当前目录，来预测\
  \ `tar` 将恢复这些文件的位置。\n\n例如，如果我的当前目录是 `/tmp`，那么 `tar` 将把上节中的 `expenses` 文件恢复到这个绝对路径：\n\
  \n```\n/tmp/mori/pegasus/1997/expenses\n```\n\n另一个例子是，如果我的当前目录是 `/mori/pegasus`，那么\
  \ `tar` 将把上节中的 `expenses` 文件恢复到这个绝对路径：\n\n```\n/mori/pegasus/mori/pegasus/1997/expenses\n\
  ```\n\n最后，如果我的当前目录是 `/`（根目录），那么 `tar` 将把上节中的 `expenses` 文件恢复到这个绝对路径：\n\n```\n/mori/pegasus/1997/expenses\n\
  ```\n\n总结来说，如果 `tar` 归包包含绝对路径，`tar` 将这些文件（从磁带或软磁盘）恢复到它们的原始位置。如果归包包含相对路径，`tar` 将通过将当前目录添加到\
  \ `tar` 路径中来决定恢复文件的路径。\n\n## 考虑绝对文件名的变解决方案\n\n如果你使用绝对文件名创建 `tar` 归包，你（通常）只能将这些文件恢复到它们的原始位置。这是\
  \ `tar` 一个既伟大又令人沮丧的限制。因此，`tar` 的文档通常建议你在执行 `tar` 备份时使用相对路径。在本书之前使用 `tar` 备份目录的章节中，我只了如何使用相对路径进行备份。\n\
  \n在 Linux/GNU 系统下，`tar` 在创建 `tar` 备份时会自动剥离开头的斜杠，因此 `tar` 归包始终使用相对路径。然而，你仍可能通过两种方式在\
  \ Linux/GNU `tar` 下遇到绝对路径带来的烦恼：你可以使用特殊的 Linux/GNU `tar -P` 选项来保留开头的斜杠，或者你可能会收到来自另一个系统的写入绝对路径的磁带。\n\
  \nSCO UNIX 下 `tar` 有一个非常好的 `-A` 选项，可以在恢复时抑制开头的斜杠。这样你就可以像处理 `tar` 归包中的相对路径一样恢复绝对路径。你可以将\
  \ `-A` 选项添加到 `tar` 选项列表的任何位置，只要它在初始 `x` 选项之后即可。我在 AIX、Solaris 或 Linux/GNU 上没有找到这个\
  \ `-A` 选项。\n\n如果 `tar` 中的绝对路径对你来说大问题，请查看你的系统是否支持 `pax` 命令，它能够读取 `tar` 归包并支持通过 `-s`\
  \ 选项修改文件名。\n\n### 切换到正确的目录\n\n如果 `tar` 归包中的文件使用绝对路径，那么在执行 `tar restore` 命令之前切换到哪个目录都没有区别。\n\
  \n如果 `tar` 归包中的文件是相对的，那么在使用 `tar` 恢复相对文件时，最关键且最危险的决定之一就是在开始 `tar restore` 之前切换到哪个目录。因为你正在恢复一个或多个旧归包文件，存在无意覆盖这些文件当前版本的危险。要确定切换到哪个目录，请比较磁带上的路径与你想恢复文件位置的绝对路径：\n\
  \n**示例 1**\n- `tar` 归包中的路径：`./mori/pegasus/1997/expenses`\n- 恢复后的目标绝对路径：`/tmp/restoredata/mori/pegasus/1997/expenses`\n\
  - 执行 tar restore 之前切换的目录：`/tmp/restoredata`\n\n**示例 2**\n- `tar` 归包中的路径：`mori/pegasus/1997/expenses`\n\
  - 恢复后的目标绝对路径：`/mori/pegasus/1997/expenses`（即我们想将文件恢复到原始位置）\n- 执行 tar restore 之前切换的目录：`/`\n\
  \n**示例 3**\n- `tar` 归包中的路径：`mori/pegasus/1997/expenses`\n- 恢复后的目标绝对路径：`/pegasus/1997/expenses`\n\
  - 执行 tar restore 之前切换的目录：我们无法仅通过设置当前目录来完成此示例。可以通过更复杂的步骤完成，例如创建一个指向根目录 (`/`) 的符号链接目录\
  \ `mori`，或者将文件恢复到某个临时目录然后移动到目标位置。\n\n### 将所有文件恢复到原始目录\n\n\n\n\n你可能不想使用最简单的恢复方法，即将所有文件放回它们所在的地方。如果你这样做，就会毁掉那些包含最新信息的文件，并用备份中带有旧信息的文件来替换它们。现在你明白为什么我之前说你可能不想这样做了。这种操作很少执行。例如，如果某次重大更新操作出现问题，导致所有当前文件都损坏了，你可能希望从备份中从较旧但未损坏的版本恢复所有文件。\n\
  \n要将 `tar` 备份中的所有文件恢复到原始目录，请切换到你最初创建备份的目录。然后执行此处所示的 `tar restore` 命令：\n\n```bash\n\
  cd /usr/fred/projects \ntar xvf /dev/XXX?\n```\n\n`/usr/fred/projects` 只是一个示例目录名。请替换为你创建备份的目录。如果\
  \ `tar` 归包包含绝对路径，那么你切换到哪个目录都无关。\n\n`x` 意味着从备份中提取文件。此 `tar` 选项列表中的第一个字母必须是 `c`、`x`\
  \ 或 `t`。提取（恢复）文件始终是一个危险的操作，因为你必须确保不会覆盖错误的文件。\n\n`/dev/XXX?` 应该替换为你的 `tar` 归包的文件或设备名称。\n\
  \n这是一个示例显示了运行此命令时屏幕的状况：\n\n```bash\ncd /usr/fred/projects\ntar xvf /dev/XXX?\nx\
  \ ., 0 bytes, 0 tape blocks\nx ./acme, 0 bytes, 0 tape blocks\nx ./acme/report6,\
  \ 29 bytes, 1 tape blocks\nx ./pegasus, 0 bytes, 0 tape blocks\nx ./pegasus/1997,\
  \ 0 bytes, 0 tape blocks\nx ./pegasus/1997/expenses, 135 bytes, 1 tape blocks\n\
  x ./pegasus/1997/sales, 3281 bytes, 7 tape blocks\nx ./pegasus/1998, 0 bytes, 0\
  \ tape blocks\nx ./pegasus/1998/expenses, 7995 bytes, 16 tape blocks\nx ./pegasus/1998/sales,\
  \ 9463 bytes, 19 tape blocks\n```\n\n注意每一行都以 `x` 开头，表示该行显示的文件是从 `tar` 归包提取到磁盘的。\n\
  \n### 将所有文件恢复到不同的目录\n\n请注意，从 `tar` 归包将所有文件恢复到不同目录的过程仅在 `tar` 归包中包含相对路径时才可用。请前面的章节以检查绝对与相对路径，检查磁盘空块，并选择一个有大量可用块的文件系统。然后切换到正确的目录。这是一个示例：\n\
  \n```bash\ncd /tmp\ntar xvf /dev/XXX?\nx ., 0 bytes, 0 tape blocks\nx ./acme, 0\
  \ bytes, 0 tape blocks\nx ./acme/report6, 29 bytes, 1 tape blocks\nx ./pegasus,\
  \ 0 bytes, 0 tape blocks ./pegasus/1997, 0 bytes, 0 tape blocks\nx ./pegasus/1997/expenses,\
  \ 135 bytes, 1 tape blocks\nx ./pegasus/1997/sales, 3281 bytes, 7 tape blocks\n\
  x ./pegasus/1998, 0 bytes, 0 tape blocks\nx ./pegasus/1998/expenses, 7995 bytes,\
  \ 16 tape blocks\nx ./pegasus/1998/sales, 9463 bytes, 19 tape blocks\n```\n\n在这个示例中，`tar`\
  \ 备份中的 `acme` 和 `pegasus` 目录被恢复到 `/tmp` 目录。如果另一个文件系统有足够的可用磁盘块，你可以选择 `/tmp` 以外的目录。再次警告：如果\
  \ `tar` 归包包含绝对路径，你的当前目录将被忽略，文件将恢复到它们的原始位置，这可能是灾难性的！\n\n### 仅恢复选定的目录或文件\n\n如示例所示，可以只恢复选定的目录或文件。重要的是要按照\
  \ `tar` 目录列表中出现的精确格式指定目录或文件，包括任何前导斜杠 (`/`) 或点斜杠 (`./`）。任何目录都会被递归恢复。考虑以下命令：\n\n```bash\n\
  cd desired-dir\ntar xvf /dev/XXX? ./acme/report6 ./pegasus/1997\n```\n\n`desired-dir`\
  \ 应该替换为你想要执行 `tar` 命令的目录。`/dev/XXX?` 应该替换为 `tar` 文件或设备。`./acme/report6` Illust 了如何恢复一个文件。`./pegasus/1997`\
  \ Illust 了如何恢复一个目录及其所有的文件和子目录。注意，恢复选定文件花费的时间与最初写入 `tar` 归包的时间一样。\n\n### 设置和使用 tar\
  \ 备份设备表\n\n许多 Solaris 和 SCO UNIX 等 UNIX 系统允许将常用的 `tar` 设备放在名为 `/etc/default/tar`\
  \ 的文件中。这是来自 Solaris 2.6 的该文件示例：\n\n```\n# device block size archive0=/dev/rmt/0\
  \ 20\narchive1=/dev/rmt/0n 20\narchive2=/dev/rmt/1 20\narchive3=/dev/rmt/1n 20\n\
  archive4=/dev/rmt/0 126\narchive5=/dev/rmt/0n 126\narchive6=/dev/rmt/1 126\narchive7=/dev/rmt/1n\
  \ 126\n```\n\n\n\n系统管理员可以使用常用的 tar 设备名称来替换此文件中显示的设备名称。这允许在 `tar` 命令中使用单个数字来指定目标设备：\n\
  \n```bash\ntar cv2 .\n```\n\n在上述示例中，`2` 指的是 `/etc/default/tar` 中的 `archive2` 条目。根据上方的\
  \ `/etc/default/tar` 文件，上述 tar 命令等同于以下命令：\n\n```bash\ntar cvf /dev/rmt/1 .\n```\n\
  \n如果没有指定数字，Solaris 默认使用 `archive0` 设备。SCO UNIX 则查找以 `archive=` 开头的行。对于最常用的 tar 设备，请使用此默认情况：\n\
  \n```bash\ntar cv .\n```\n\n### 设置 tar 块大小（Blocking Size）\n\n`tar` 允许使用 `b` 选项设置块大小，范围为每条磁带记录\
  \ 1 到 20 块（每块 512 字节）。如果未指定 `b` 选项，默认值为 20。`tar` 在 UNIX 命令中的独特之处在于，所有的选项字母都先指定，然后按照选项字母的顺序列出这些选项的任何参数：\n\
  \n```bash\ntar cvfb /dev/XXX? 10 .\n```\n\n注意在上述命令中，`f` 选项指定在 `b` 选项之前，因此 `/dev/XXX?`（`f`\
  \ 选项的参数）必须在 `10`（`b` 选项的参数）之前指定。\n\n指定 `b` 选项的唯一情况是尝试读取一条以非标准默认值 20 写入的磁带。\n\n###\
  \ 局限性\n\n`tar` 在历史上存在许多局限性。新版本的 `tar` 移除了其中许多限制，但你仍应该意识到这些问题并进行测试。\n\n-   注意多卷备份（即超过一盘磁带容量的\
  \ tar 备份）。旧版本的 `tar` 不允许延续到第二盘磁带，或者无法可靠地处理这种情况。在使用它或将每组文件备份到单盘磁带之前，请进行彻底测试。\n- \
  \  `tar` 不备份目录。它会在恢复时根据需要创建目录，但所有者、组和权限与原先不同。\n-   `tar` 不备份空目录。只有当有文件需要恢复到该目录时，它才会创建目录。\n\
  -   `tar` 不备份 `/dev` 设备文件。这使得 `tar` 成为完整系统备份的糟糕选择。\n-   `tar` 无法从磁带坏点之后恢复文件。\n\n\
  ### 使用 cpio 备份和恢复文件\n\n你会发现这一节关于 `cpio` 的内容使用了与之前 `tar` 章节大部分相同的表述。这两个命令的功能相似，只有某些特定细节和示例在两个章节之间有所。`tar`\
  \ 和 `cpio` 章节本身是完整的，彼此之间复杂的引用。\n\n#### 备份目录子树\n\n`cpio` 代表 *copy in/out*（输入/输出），它允许你将文件备份到磁带、软磁盘或磁盘文件。以下是一个备份一个完整目录的\
  \ Basic `cpio` 命令示例：\n\n```bash\ncd /usr/projects\nfind . -print | cpio -ocvaB >\
  \ /dev/XXX\n```\n\n首先使用 `cd` 切换到备份的目录。然后使用 `find` 命令将所有路径名传递给 `cpio` 进行备份。以下是 `cpio`\
  \ 命令其他元素的描述：\n\n-   `$` 代表 shell 提示符。你的 shell 可能有所不同。\n-   `find . -print`: 此 `find`\
  \ 命令列出当前目录下所有文件和子目录的相对路径。\n-   `cpio`: 一个通过执行输入或输出来备份文件的 UNIX 命令。此 `cpio` 归档通常保存在磁带或软磁盘上，也可以保存在磁盘文件中\n\
  -   `-ocvaB`: `cpio` 命令的选项。逐个查看每个字母：\n-   `o`: 将文件输出到归档中。`cpio` 的第一个选项字母应该是 `i`（输入）或\
  \ `o`（输出）。\n\n\n\n\n-   写入 ASCII 头部以提高移植性，以便在另一个系统上读取此磁带。\n-   `v`: 详细模式（显示正在备份的文件名）。\n\
  -   `a`: 将每个备份文件的最后访问日期重置为运行 `cpio` 之前的状态。\n-   `B`: 设置磁带块大小为 5120 字节。某些磁带（如 `DAT`\
  \ 磁带或 `Exabyte` 磁带）需要大于 1 的块大小。\n-   `/dev/XXX`: 非常重要的是将其替换为你想要备份的磁带或磁盘设备名称（我们在本章开头介绍过这些设备名称）。你也可以指定一个磁盘文件名来存储\
  \ `cpio` 归包。\n\n当你运行此 `cpio` 命令时，你可能会看到如下输出：\n\n```bash\n$ cd /usr/fred/projects\
  \ $ find . -print | cpio -ocvaB > /dev/XXX?\nacme\nacme/report6\npegasus\npegasus/1997\n\
  pegasus/1997/expenses\npegasus/1997/sales\npegasus/1998\npegasus/1998/expenses\n\
  pegasus/1998/sales\n50 blocks\n```\n\n由于我们使用了 `v` 选项，可以看到每个正在备份的目录和文件。如果数据量很大，备份可能需要几小时才能完成。`cpio`\
  \ 备份完成后，我们可以包含备份的介质称为 `cpio` 归包。根据介质类型，我们也可以将其称为 `cpio` 磁盘或 `cpio` 磁带。注意在备份结束时，`cpio`\
  \ 会告诉你备份占用了多少块（在本例中为 50 blocks）。在磁带标签上记录这个数字是一个好主意。如果你想恢复这块磁带，你就知道硬盘上需要多少空闲块了。\n\
  \n如果你省略了 `v` 选项，则在 `cpio` 备份期间不会显示文件名，只在最后显示备份大小：\n\n```bash\n$ cd /usr/fred/projects\
  \ $ find . -print | cpio -ocaB > /dev/XXX?\n50 blocks\n```\n\n`cpio` 还允许使用 `V` 选项，它会在每备份一个文件时仅打印一个点（.）。这允许你观察备份进度，并确保备份正在进行，而不会因为输出过多拖慢备份速度：\n\
  \n```bash\n$ cd /usr/fred/projects $ find . -print | cpio -ocaB > /dev/XXX?\n..........\n\
  50 blocks\n```\n\n### 备份指定的目录或文件\n\n`cpio` 只备份你通过管道传递给它的文件名。如果你给它一个目录名，它只会备份该目录而不包含其内容。要备份整个目录，你必须使用像\
  \ `find` 的工具来提供该目录内的所有文件路径。我们可以这样备份选定的单个文件：\n\n```bash\n$ cd /usr/fred/projects\
  \ $ ls ./acme* ./pegasus/report7 cpio -ocaB > /dev/XXX?\n```\n\n`ls` 列出了由 `cpio`\
  \ 备份的文件。这在 Linux/GNU 系统上可能不起作用，因为 `ls` 可能会在文件名结尾添加特殊指示。`./acme*` 说明了 Shell 通配符可以用于生成文件列表（在这种情况下是所有以\
  \ acme 开头的文件）。`./pegasus/report7` 说明了另一个要备份的文件。上一个示例指定了要备份的相对路径，这是推荐的操作。\n\n我们可以通过如下方式将多个目录备份到\
  \ `cpio`：\n\n```bash\n$ cd /usr/fred/projects $ ( find ./expenses -print | find\
  \ ./pegasus -print ) cpio -ocaB > /dev/XXX?\n```\n\n括号 `()` 用于组合多个 `find` 命令并将合并后的输出发送给\
  \ `cpio`。行开头的大于符号 `>` 是 PS2 提示符。Shell 会打印此符号（而不是用户），以表示它正在等待上一行开始的命令。\n\n我们可以通过如下方式备份单个文件和完整目录：\n\
  \n```bash\n$ cd /usr/fred/projects $ ( echo ./acme* ./pegasus/report7; find ./expenses\
  \ -print; find ./pegasus -print ) cpio -ocaB > /dev/XXX?\n```\n\n然后我们可以如下方式使用 `grep\
  \ -v` 排除选定的文件：\n\n```bash\n$ cd /usr/fred/projects $ ( echo ./acme* ./pegasus/report7;\
  \ find ./expenses -print; find ./pegasus -print ) | grep -v /tmp/; grep -v junk\
  \ cpio -ocaB > /dev/XXX?\n```\n\n\n\n\n\n前面的示例备份了以下文件：\n\n- 当前目录下所有以 `acme` 开头的文件\n\
  - `pegasus` 子目录下的 `report7`\n- `expenses` 目录下的所有文件和目录\n- `pegasus` 目录下的所有文件和目录\n\
  \n然而，从上述文件中，从备份中排除以下内容：\n\n- 路径名中包含 `/tmp/` 的任何文件或目录\n- 路径名中包含 `junk` 的任何文件或目录\n\
  \n# 列出 cpio 存档的目录列表\n\n输入以下命令来向标准输出显示 `cpio` 存档的内容（已保存在此 `cpio` 磁磁盘或磁带上的文件名）。\n\n\
  ```bash\ncpio -itcvB < /dev/XXX\n```\n\n在此命令中，`i` 表示从已创建的 `cpio` 存档中输入。`cpio` 选项列表中的第一个字母必须是\
  \ `i` 或 `o`。`t` 显示备份的目录列表。此操作不会保存或恢复任何文件。\n\n在某些 UNIX 系统上，`cpio` 会自动检测磁带是否在使用 `c`\
  \ 选项写入的，因此从磁带读取时不需要 `c` 选项。在其他 UNIX 系统上，如果你在 `cpio` 上使用 `c` 选项，会报错。\n\n当你运行此 `cpio`\
  \ 命令时，可能会看到类似这样的输出：\n\n```bash\ncpio -itcvB < /dev/XXX\ndr-xr-x 4 mori staff 0 Apr\
  \ 28 22:23 1998 .\ndr-xr-x 2 jane 0 Apr 28 22:24 1998 acme\n-r--r-- 1 jane staff\
  \ 29 Apr 28 22:24 1998 acme/report6\ndr-xr-x 4 mori staff 0 Apr 28 22:25 1998 pegasus\n\
  -rw--r-- 1 mori staff 135 Apr 28 22:26 1998 pegasus/expenses\n-rw--r-- 1 mori staff\
  \ 3281 Apr 28 22:27 1998 pegasus/sales\ndr-xr-x 2 mori staff 0 Apr 28 22:27 1998\
  \ pegasus\n-rw--r-- 1 mori staff 7995 Apr 28 22:26 1998 pegasus/expenses\n-rw--r--\
  \ 1 mori staff 9463 Apr 28 22:27 1998 pegasus/sales 50 blocks\n```\n\n此输出包含与 `ls\
  \ -l` 显示相同的字段。\n\n如果省略了 `v` 选项，则只显示文件名：\n\n```bash\ncpio -itcB < /dev/XXX\nacme/report6\n\
  pegasus/1997\npegasus/1997/expenses\npegasus/1997/sales\npegasus/1998/expenses\n\
  pegasus/1998/sales 50 blocks\n```\n\n注意，列出目录列表所需的时间与最初创建 `cpio` 存档的时间一样长。\n\n# 使用\
  \ cpio 恢复存档\n\n为了使用 `cpio` 备份中的任何文件，我们必须先将所需的文件或文件从 `cpio` 磁带或磁磁盘恢复到硬盘。在使用 `cpio`\
  \ 恢复大型 `cpio` 存档之前，有几个细节需要检查。以下章节将解决这些问题，如检查磁盘空块、绝对路径和相对路径、规划文件恢复的位置、解决绝对限制以及切换到正确的目录。\n\
  \n## 检查磁盘空块\n\n检查各种文件系统中的磁盘空块是非常重要的，因为如果任何 UNIX 系统用尽了可用磁盘块，应用程序可能会报错并终止，这可能导致数据库损坏。如果根文件系统用尽了块，整个\
  \ UNIX 系统可能会崩溃。\n\n请回顾上一节“检查磁盘空块”。关于 `df` 命令的注释适用于 `cpio`。在这方面，`cpio` 相比 `tar` 的一个优势是它会告诉你完整备份中的块数，因此你知道大约恢复完整备份需要多少可用块。\n\
  \n## 检查绝对路径与相对路径\n\n在从 `cpio` 备份中恢复任何文件之前，列出 `cpio` 目录列表并检查文件名是否以斜杠 (`/`) 开头。绝对路径或全路径以斜杠开头。相对路径不以斜杠开头。\n\
  \n考虑以下示例：\n\n`/mori/acme/report6` — 此文件名是绝对路径。\n`acme/report6` — 此文件名是相对路径。\n\n\n\
  \n\n\n`cpio` 会移除文件名中任何开头的点斜杠 (`./`)，因此 `./acme/report6` 被保存为 `acme/report6`，这是一种等效形式。\n\
  \n## 规划文件还原的位置\n\n在前面的章节中，我们看到 `cpio` 备份可能包含绝对路径或相对路径。如果路径以斜杠开头，则该路径是绝对路径。这意味着 `cpio`\
  \ 只能将文件从备份中还原到它们来源的原始目录，而不论当前目录位于何处。这可能是危险的，因为我们将恢复每个文件的旧版本，从而覆盖新版本，并丢失自制作 `cpio`\
  \ 备份以来所做的任何更新。\n\n例如，假设我们显示 `cpio` 目录列表，并在输出行中看到这一行：\n\n```\n-rw-r--r--  1 mori\
  \  staff 135 Apr 28 21:26 1998, /mori/pegasus/1997/expenses\n```\n\n`/mori/pegasus/1997/expenses`\
  \ 是一个绝对路径。`cpio` 通常只能将此文件还原到磁盘上的该绝对路径。在还原此文件之前，拷贝该文件的当前版本将是一个好主意，这样就能保留所有更新。\n\n\
  如果 `cpio` 存档中的文件使用相对路径，我们可以将文件还原到许多不同的目录。这非常有用，例如当我们想要从 `cpio` 备份的旧文件中查找信息，而不覆盖该文件的当前版本时。在这种情况下，我们将备份文件还原到一个临时工作目录，查找所需信息，然后在完成后删除旧文件。\n\
  \n假设我们显示 `cpio` 目录列表，并看到文件名既不以点也不以斜杠开头：\n\n```\n-rw-r--r--  1 mori  staff 135 Apr\
  \ 28 21:26 1998, mori/pegasus/1997/expenses\n```\n\n在这种情况下，我们的备份文件是相对路径。你可以通过在相对路径开头插入当前目录来预测\
  \ `cpio` 将这些文件还原到何处。\n\n例如，如果我的当前目录是 `/tmp`，那么 `cpio` 将上段落中的 `expenses` 文件还原到此绝对路径：\n\
  \n```\n/tmp/mori/pegasus/1997/expenses\n```\n\n另一个例子是，如果我的当前目录是 `/mori/pegasus`，那么\
  \ `cpio` 将上段落中的 `expenses` 文件还原到此绝对路径：\n\n```\n/mori/pegasus/mori/pegasus/1997/expenses\n\
  ```\n\n再另一个例子，如果我的当前目录是 `/`（根目录），那么 `cpio` 将上段落中的 `expenses` 文件还原到此绝对路径：\n\n```\n\
  /mori/pegasus/1997/expenses\n```\n\n总结来说，如果 `cpio` 存档包含绝对路径，`cpio` 将这些文件（从磁带或磁盘）还原到它们的原始位置。如果存档包含相对路径，`cpio`\
  \ 将文件还原到通过将当前目录添加到 `cpio` 路径确定义的路径。\n\n## 考虑绝对文件名的变通方案\n\n如果你使用绝对文件名创建 `cpio` 存档，你只能将这些文件还原到它们的原始位置（通常情况下）。这是\
  \ `cpio` 一个非常大且令人沮丧的限制。出于这个原因，`cpio` 的文档通常建议在执行 `cpio` 备份时使用相对路径。在本书之前关于使用 `cpio`\
  \ 备份目录树的章节中，我只记录了如何使用相对路径进行备份。\n\nUNIX 下的 `cpio` 有一个很好的 `-A` 选项，可以在还原时抑制领先斜杠。你可以在选项列表的任何地方添加\
  \ `-A` 选项。我在 AIX、Solaris 或 Linux 上没有找到它。如果 `cpio` 中的绝对路径对你是一个大问题，请查看 `pax` 命令，它应该能够读取\
  \ `cpio` 存档并支持通过 `-s` 选项修改任何文件名。\n\n## 切换到正确的目录\n\n如果 `cpio` 存档中的文件使用绝对路径，执行 `restore`\
  \ 命令之前切换到哪个目录都没有。\n\n如果 `cpio` 存档中的文件是相对的，在使用 `cpio` 还原相对文件时最关键且危险的决定之一是在开始 `restore`\
  \ 之前切换到哪个目录。由于你正在还原一个或多个旧文件，存在无意覆盖这些文件当前版本的危险。要确定切换到哪个目录，请将磁带上的路径与你想还原文件的绝对路径进行比较，如下例所示：\n\
  \n### 示例 1\ncpio 存档上的路径：\n```\nmori/pegasus/1997/expenses\n```\n\n\n\n\n\n### 恢复后的期望绝对路径\n\
  `/tmp/restoredata/mori/pegasus/1997/expenses`\n\n### 执行 cpio restore 之前需要切换的目录\n\
  `/tmp/restoredata`\n\n#### 示例 2\n| cpio 归包中的路径 | 恢复后的期望绝对路径（将文件恢复到原始位置） | 执行 cpio\
  \ restore 之前需要切换的目录 |\n| :--- | :--- | :--- |\n| `mori/pegasus/1997/expenses` |\
  \ `/mori/pegasus/1997/expense` | `/` |\n\n#### 示例 3\n| cpio 归包中的路径 | 恢复后的期望路径 |\
  \ 执行 cpio restore 之前需要切换的目录 |\n| :--- | :--- | :--- |\n| `mori/pegasus/1997/expenses`\
  \ | `/pegasus/1997/expenses` | `/usr/fred/projects` |\n\n### 将所有文件恢复到原始目录\n恢复文件可能是复杂且危险的：你可能会覆盖掉错误的文件。我将向你展示几种恢复方法，并讨论它们的优缺点。\n\
  \n你可能不想使用最简单的恢复方法，即将所有文件放回它们来源的地方。如果你这样做，就会破坏掉包含最新信息的文件，并用备份中带有旧信息的文件来替换它们。现在你明白为什么我说你可能不想这样做了。这种操作很少执行；例如，当重大更新操作出现问题且所有当前文件都损坏时，你可能希望从备份中较旧但未损坏的版本中恢复所有文件。\n\
  \n要将 cpio 备份中的所有文件恢复到原始目录，请切换到你最初制作备份的目录。然后执行此处所示 `cpio restore` 命令：\n\n```bash\n\
  cd /usr/fred/projects\npio -icvdum < /dev/XXX\n```\n\n`/usr/fred/projects` 只是一个示例名称。请输入你制作备份的实际目录。如果\
  \ cpio 归包包含绝对路径，那么切换到哪个目录都无关。\n\n输入备份中的文件。此 `cpio` 选项的第一个字母必须是 `i` 或 `o`。输入（恢复）文件始终是一个危险的操作，因为你必须确保不会覆盖错误的文件。我们已经查看了\
  \ `c`（ASCII 头文件）和 `v`（详细模式）。\n\n`d` 根据需要创建目录。否则，不允许备份中的较旧文件覆盖磁盘上的较新文件。`m` 保留文件最后修改的日期和时间，使其与备份时保持一致。否则，此恢复操作将被视为文件修改。`/dev/XXX`\
  \ 应该替换为你的 cpio 归包的文件或设备名称。以下是一个显示运行此命令时屏幕内容的示例：\n\n```bash\ncd /usr/fred/projects\n\
  cpio -icvdum < /dev/XXX\n.\nacme\nacme/report6\npegasus\npegasus/1997\npegasus/1997/expenses\n\
  ```\n\n### 将所有文件恢复到不同的目录\n我们无法仅通过设置当前目录来完成这个示例。这可以通过更复杂的步骤完成，例如创建一个 `mori` 子目录作为指向根目录\
  \ (``) 的符号链接，或者将文件恢复到某些临时目录，然后将它们移动到目标位置。\n\n```bash\ncd /tmp\ncpio -icvdum < /dev/XXX\n\
  .\nacme\nacme/report6\npegasus\npegasus/1997\npegasus/1997/expenses\n```\n\n\n\n\
  \n\n# pegasus/1997/expenses\n# pegasus/1997/sales\n# pegasus/1998\n# pegasus/1998/expenses\n\
  # pegasus/1998/sales\n\n50 块\n\n在本示例中，`cpio` 备份中的 `acme` 和 `pegasus` 目录被恢复到 `/tmp`\
  \ 目录。如果该文件系统有足够的可用磁盘块，你可以选择 `/tmp` 以外的目录。\n\n再次警告：如果 `cpio` 归档包含绝对路径，将忽略你的当前目录并将文件恢复到它们的原始位置，这可能是灾难性的！\n\
  \n## 仅恢复选定的目录或文件\n\n如下例所示，可以只恢复选定的目录或文件。非常重要的一点是按照 `cpio` 目录中的出现精确指定目录或文件，包括任何前导斜杠\
  \ (`/`)。目录不会被递归恢复（`cpio` 不恢复目录的内容）。如果你想恢复整个目录，必须使用通配符。\n\n```bash\ncd desired-dir\n\
  cpio -icvdum < /dev/XXX? acme/report6 'pegasus/1997/*'\n```\n\n将 `desired-dir` 替换为你想要执行\
  \ `cpio` 命令的目录。将 `/dev/XXX?` 替换为 `cpio` 文件或设备名称。\n\n`acme/report6` 演示了如何恢复文件。`'pegasus/1997/*'`\
  \ 演示了如何恢复目录及其所有的文件和子目录。（注意单引号：我们必须防止 shell 将星号 (`*`) 作为文件名生成通配符进行处理。）\n\n请注意，恢复选定文件的时间与最初写入\
  \ `cpio` 归档的时间相同。\n\n### 设置块大小\n\n`cpio` 允许使用 `-B` 选项将块大小设置为 512 字节。可以使用 `-C` 选项代替\
  \ `-B` 设置更大的块大小。较大的块可能有助于备份到高性能驱动器的性能：\n\n```bash\ncd desired-dir\nfind .print |\
  \ cpio -ocC4096 > /dev/XXX?\n```\n\n注意在上一个命令中，使用 `-C` 来设置 4096 字节的磁带块大小。读取此磁带时必须使用相同的\
  \ `-C` 值：\n\n```bash\ncpio -icvdumC4096 < /dev/XXX?\n```\n\n另参：有关如何使用 `cpio` 将目录树从磁盘的一个部分复制到另一部分的更多信息，请参第\
  \ 189 页\n\n# 第 14 章 管理系统资源：磁盘空间\n\nUNIX 系统连接了许多资源。这些资源包括 I/O 子系统（管理磁盘）、终端、CPU、内存等。在这里，我们将关注如何管理\
  \ UNIX 系统上的磁盘空间。各种系统资源由系统管理员管理，管理员可以通过 `root` 超用户身份登录并添加、修改或删除资源。尝试管理资源本质上是危险的，因为修改任何或所有资源可能会影响一个或多个用户。\n\
  \n磁盘空间是以文件系统为单位管理的。一个 `filesystem` 由其下的一个或多个目录子目录组成。你可以有多个磁盘卷，它们构成一个 `filesystem`，目录或文件可以位于\
  \ `filesystem` 的任何地方。文件或目录不能跨越 `filesystems`。\n\n磁盘系统的层级结构如下：\n- 物理磁盘\n- 分区\n- 文件系统\n\
  - 目录和文件\n- 子目录和文件\n- 文件\n\n如果你必须增加目录空间，必须向该目录所在的分区或 `filesystem` 添加更多空间。\n\n###\
  \ 挂载文件系统\n\n在访问 UNIX 系统中设置的目录之前，系统管理员必须将物理磁盘上的 `filesystem` 挂载。在系统启动时，系统会挂载 `/etc/filesystem`\
  \ 文件中定义的所有真实挂载点。在其他时候，你可以手动挂载文件系统。\n\n你可以使用以下命令获取已挂载文件系统的列表：\n\n```bash\nmount\n\
  ```\n\n\n\n\n\n系统将返回类似的内容：\n\n```\nnode    mounted     vfs    date             options\
  \  over ----  -------  -------    ---    ------    ---------\n/dev/hd0  /      \
  \     jfs    Dec 17 08:04   rw, log  =/dev/hd8\n/dev/hd3  /tmp       jfs    Dec\
  \ 17 08:04   rw, log  =/dev/hd8\n/dev/hd1  /home      jfs    Dec 17 08:06   rw,\
  \ log  =/dev/hd8\n/dev/hd2  /usr       jfs    Dec 17 08:06   rw, log  =/dev/hd8\n\
  ```\n\n对于每个文件系统，`mount` 命令列出了节点名称、设备名称、挂载点、虚拟文件系统类型、挂载日期时间以及其选项。你可以使用以下选项：\n\n```\n\
  \n- `rw`: 读写。\n- `ro`: 只读。\n- `bg`: 允许你在后台处理挂载操作。如果挂载失败，系统将继续尝试挂载指定的로系统。 ```\n\n\
  如果你想以读写选项挂载名为 `xyz` 的文件系统，可以使用以下命令：\n```\nmount -o rw /dev/hd4/xyz\n```\n另一方面，如果你想挂载定义在\
  \ `/etc/files` 中的所有文件系统，可以使用 `/etc/files`。然后你可以使用以下命令：\n```\nmount -a\n```\n\n###\
  \ 卸载文件系统\n\n如果你想对文件系统进行任何维护，必须使该文件系统处于离线状态。你可以使用 `umount` 命令来卸载文件系统。例如，如果你想卸载名为\
  \ `xyz` 的文件系统，可以使用以下命令：\n```\numount xyz\n```\n但是，如果该文件系统的任何一个文件正在被使用，你就无法卸载它。`umount`\
  \ 不会提供关于哪些文件正在被使用或是谁在使用的详细信息。你可以使用该命令的 `-f` 选项强制卸载：\n```\numount -f xyz\n```\n但是，如果你这样做，使用文件的程序将无法正常终止，你可能会丢失某些信息。\n\
  \n### 空间信息\n\n要评估文件系统的可用空间，可以使用 `df` 命令。如果你想查看所有系统的详情，可以使用以下命令：\n```\ndf .\n```\n\
  系统将返回以下内容：\n```\nDevice    512-blocks  free  %used  iused  %iused  Mounted on\n\
  /dev/hd0  19368      9976  48%   4714  5%     /\n/dev/hd1  24212      4808  80%\
  \   5031  19%    /usr\n/dev/hd2  9744       9352  4%    1900  4%     /site\n/dev/hd3\
  \  3868       3856  0%    986   0%     /usr/venus\n```\n在某些系统中，空间以 512 字节块的形式显示，你可以使用\
  \ `df` 命令配合 `-k` 标志以 1024 字节块显示空间。在其他系统上，空间默认以 1024 字节块显示。\n\n如果你想显示特定目录空间使用情况，可以使用以下命令：\n\
  ```\ndf .\n```\n现在你已经知道哪个文件系统可能空间不足（使用 `df`），你可以使用 `du` 命令找到哪些文件占用了空间。要获取当前目录的磁盘占用情况，可以使用以下命令：\n\
  ```\ndu -k\n```\n你将从系统获得以下响应：\n```\n240  ./test\n120  ./test/file2\n20   ./test/file3\n\
  8    ./info\n16   ./info/lost\n264  .\n```\n每行显示子目录所占用的 1024 字节数，并在最后显示总计。如果你想找到目录及其子目录中每个文件的大小，可以使用以下命令：\n\
  ```\ndu -k -a\n```\n\n\n\n\n\n你也可以使用 `find` 命令来查找文件的大小。此外，`find` 命令还允许你列出大小等于、小于或大于特定大小的文件。\n\
  \n如果你想查找当前目录中大小恰好为 100000000 字节的文件列表，可以使用以下命令：\n\n```bash\nfind . -size 100000000c\
  \ -print\n```\n\n如果你想查找当前目录中大小大于 100000000 字节的文件列表，可以使用以下命令：\n\n```bash\nfind .\
  \ -size +100000000c -print\n```\n\n如果你想查找当前目录中大小小于 100000000 字节的文件列表，可以使用以下命令：\n\
  \n```bash\nfind . -size -100000000c -print\n```\n\n# 为用户限制磁盘空间\n\n作为磁盘管理工作的一部分，你可以限制用户可以使用磁盘空间限额，或者限制用户可以创建的文件的大小。\n\
  \n你可以使用 `quota` 命令来限制用户使用的空间量。你可以通过此命令查看用户的当前配额：\n\n```bash\nquota -u user1\n```\n\
  \n系统将返回如下：\n\n```\nQuotas for user1 (uid 502): Filesystem blocks limit grace Files\
  \ limit grace\n/u      20     55   60      20     60  65\n```\n\n你可以获取文件系统以及用户 keith\
  \ (uid 502) 的配额：\n\n```\nFilesystem blocks limit grace Files limit grace\n/u   \
  \   20     55   60      20     60  65\n```\n\n你可以通过此处所示的 `repquota` 命令获取文件系统 `/u`\
  \ 上所有用户的配额列表：\n\n```bash\nrepquota -u /u\n```\n\n系统将返回如下：\n\n```\nBlock limits File\
  \ limits User used soft hard grace used soft hard grace\nroot    - 3920     0  \
  \   0           734     0    0\ndavec  +-  28     8    30 3 days     3     0   \
  \ 0\nkeith  -   48     0     0               7     0    0\n```\n\n在第一列 `davec` 旁打印的\
  \ `+` 表示该用户已超过限制。\n\n你可以使用 `edquota` 命令修改用户的磁盘配额。如果你想让 `user2` 的磁盘配额与 `user1` 相同，可以使用以下命令：\n\
  \n```bash\nedquota -p user1 user2\n```\n\n你可以设置进程可以创建的最大文件大小。这通过限制进程一次可创建的文件的大小，来帮助管理磁盘空间。你可以使用以下命令来显示进程的文件限制：\n\
  \n```bash\nulimit -f\n```\n\n系统将返回：\n\n```\n4194303\n```\n\n这意味着最大文件大小为 4194303\
  \ 块（每块 512 字节）。系统管理员可以使用以下命令修改文件大小限制：\n\n```bash\nulimit -f 5000000\n```\n\n# lost+found\
  \ 目录\n\n`fsck` 工具会对任何未被目录项引用的文件在 `lost+found` 目录中创建一个条目。如果系统在删除过程中宕机，文件可能无法被正确删除；在这种情况下，`fsck`\
  \ 可能会 `lost+found` 中创建一个条目。系统管理员应该检查 `lost+found` 中创建的文件和目录，并决定是删除它们还是通知相关用户采取纠正措施。\n\
  \n# 其他磁盘管理命令\n\n完成此之后，你仍然需要一些空间，因为原始文件在完全压缩之前不会删除。你可以使用以下命令对名为 `xyz` 的文件进行原地压缩：\n\
  \n```bash\ncompress xyz\n```\n\n压缩后的文件将被命名为 `xyz.Z`。压缩释放出的空间可能从原始占用空间的 90% 开始不等。实际压缩效果取决于文件内部的数据以及所使用的压缩算法。\n\
  \n\n\n在某些情况下，你可以将违规文件归档到存档文件中然后删除这些文件以获取所需的磁盘空间。可以使用 `tar` 命令来实现此操作。如果你想将当前目录下所有以\
  \ `test` 开头的文件归档，可以使用以下命令：\n\n```bash\ntar cf test.tar test*\n```\n\n该命令会创建一个名为\
  \ `test.tar` 的归档，稍后可用于提取文件。要从归档中提取文件，你可以使用以下命令：\n\n```bash\ntar xf test.tar\n```\n\
  \n# 第四部分 UNIX 文本处理\n\n## 15 在文件或管道中搜索行\n## 16 在文件或管道中替换或删除文本\n## 17 使用 *vi* 编辑文本文件\n\
  ## 18 让 *vi* 编辑器为你工作\n## 19 Korn Shell 中的命令行编辑\n## 20 介绍 emacs 编辑器\n\n---\n\n# 第\
  \ 15 章：在文件或管道中搜索行\n\n### 查找包含模式的行 (*grep*)\n要查找并显示文件中包含某个名称或模式的行，你可以使用 `grep` 命令（稍后我会告诉你它的名字是从哪里来的）。例如，假设你有一个员工文件，每行包含一个员工的名称和信息。要只显示该文件中包含名称\
  \ `Smith` 的行，你需要输入：\n\n```bash\ngrep Smith employee-file\nSmith, Carl - 555-6379,\
  \ hired 3-7-92, dept 6\nSmith, Dennis - 555-3291, hired 8-27-96, dept 2\nSmithers,\
  \ Jane - 619/555-1720, hired 4-4-89, dept 2\n```\n\n在上面的输出中，注意到只显示了包含单词 Smith 的行。其他员工的行并没有显示。注意最后一行，Smith\
  \ 是作为 Smithers 名字的一部分被找到的。\n\n### 显示文件中包含模式的行\n1. 在 shell 提示符下，输入：`grep`。在接到指示之前，不要按回车键。\n\
  2. 输入一个空格，然后输入你想在文件内容查找的模式。该模式可以是一个名称或任何字符序列。这种模式被称为*正则表达式*（regular expression），可以包含特殊的通配符（我将在本章稍后部分介绍）。如果模式包含任何标点符号或空格，你需要将模式括在单引号或双引号中。（我将在本章进一步讨论这一点。）通常情况下，一个实用的经验是始终将模式括在单引号中。\n\
  3. 输入一个空格，然后输入一个或多个用空格分隔的文件名。如果文件在当前目录下，只需输入每个文件的 `basename`（请参术语表获取 `basename`\
  \ 的定义）。如果文件不在当前目录下，请为每个文件输入绝对路径或相对路径。你可以使用文件名生成通配符模式（Filename Generation Wildcard\
  \ patterns）来替换列表中所有文件的某一部分。\n4. 按回车键执行你的命令。\n5. `grep` 会显示任何包含模式的行的标准输出，即使该模式包含在一个较大的单词中。如果你在步骤\
  \ 3 中指定了多个文件，`grep` 会显示文件名以及包含模式的行，如下所示：\n\n```bash\ngrep Acme report* report3:\
  \   Acme Enterprises   1,373,383,234 world-wide\nreport.acme.13:of the four Acme\
  \ divisions, it is the least\n```\n\n\n\n\n如果你在命令行中为 `grep` 提供文件列表，它会在这些文件中搜索给定的模式，并仅显示包含该模式的行。如果你不提供文件列表，`grep`\
  \ 将从标准输入读取输入，因此 `grep` 可以用于管道中，如下例所示：\n\n```bash\n$ who | grep smith\nsmith    \
  \  tty3     Mar  6 19:48\nsmith      ttya03   Mar  6 17:23\n```\n\n在上面的命令行中，`who`\
  \ 询问哪些用户正在登录。`who` 命令的输出被传递给 `grep`，后者查找包含 `smith` 名称的行，无论它是完整单词还是较大单词的一部分。请注意，在管道中使用\
  \ `grep` 时，不能在搜索模式之后指定任何文件名。\n\n`grep` 是典型的 UNIX 过滤器。可以想一下咖啡机中的纸过滤器。过滤器盛着咖啡渣和热水。过滤器允许液体咖啡通过，但留下了咖啡渣。过滤器的工作是有选择性地允许你想要的东西通过，并阻塞你不想要的东西以便它们无法通过。这就是\
  \ `grep` 所所的，特别是当你在管道中使用它时。在上面的示例中，你从 `who` 命令开始。但因为你只想看到引用 `smith` 的行，`grep` 传递了这些行。`grep`\
  \ 阻塞了所有不包含 smith 的行——你可以说它过滤掉了这些行，因为你不想看到它们。由于某些输出可能包含数万行甚至更多，`grep` 是 UNIX 下一个极其重要且经常使用的实用程序，它可以过滤掉你不需要的行，让你专注于你感兴趣的行。\n\
  \n**另参**\n\n- 有关文件列表的更多信息，请参阅第 231 页。\n- 关于过滤器和管道的更多信息，请参阅第 31 页。\n\n### 在选择行时忽略大小写\
  \ (`grep -i`)\n\n要在使用 `grep` 搜索模式时忽略大小写，你需要为 `grep` 添加 `-i` 选项，如下例所示：\n\n```bash\n\
  $ grep -i acme report7\nThe Acme account is currently handled by Linda. It is once\
  \ they merged with ACME INDUSTRIES, their stock value Pauley, Mr. Robert Kacmeth,\
  \ Ms. Jean Bensen, and other\n```\n\n当你在 `grep` 中使用 `-i` 选项时，无论你指定大写、小写还是混合大小写的模式都可以。在上面的示例中，`-i`\
  \ 选项指示 `grep` 找到所有包含模式的行，无论它是以大写、小写还是混合情况出现。如果没有 `-i` 选项，只有当行的大小写与模式的大写完全匹配时，`grep`\
  \ 才会显示该行。在旧版本的 UNIX 中，使用 `-y` 代替 `-i` 来忽略大小写。某些较版本的 UNIX 允许使用 `-y` 向兼容，但建议使用 `-i`。\n\
  \n### 将选行保存到文件中 (`grep`)\n\n你可以使用重定向（>` 或 `>>`）将 `grep` 的输出保存到文件中，如下：\n\n```bash\n\
  grep 'Acme Shoes' /usr/fred/report > acme/file\n```\n\n在这个示例中，你正在查找模式 `Acme Shoes`。由于它包含空格，你必须用单引号或双引号将模式括起来。要查找的文件列表由文件名模式指定，该模式指定了\
  \ `/usr/fred` 目录下所有以 `report` 开头的文件。命令告诉 `grep` 将所有匹配的行保存到当前目录下 `acme` 子目录中的 `file`\
  \ 文件中。`grep` 不会在屏幕上显示行，因为输出被重定向了。\n\n这是另一个类似的示例：\n\n```bash\nwho | grep fredp >>\
  \ file\n```\n\n在这里，你检查用户 `fredp` 是否正在登录。如果是，你想让 `grep` 将 `who` 报告的登录信息追加到 `file`\
  \ 文件。\n\n### 将选行管道到其他命令 (`grep`)\n\n`grep` 经常用于管道以过滤掉不需要的行，以便其他命令处理所需的行。要查看这是如何工作的，请考虑以下示例：\n\
  \n```bash\n$ who | grep fredp | wc -l\n3\n```\n\n在这个示例中，`who` 生成了每个当前登录用户的列表。`grep`\
  \ 将该列表缩减为仅提到 `fredp` 的行。`wc -l` 统计它接收到的行数。从输出中，你可以看到用户 `fredp` 目前同时登录在三个端口。但这个结果可能是误导性的，因为即使找到的模式是较大单词的一部分，`grep`\
  \ 也会认为该行匹配匹配。在示例中，假设有一个名为 `fredpenn` 的用户。注意字符串 `fredp` 位于 `fredpenn` 内部。如果 `fredpenn`\
  \ 登录了三个端口，而 `fredp` 完全没有登录呢？你会得到相同的结果。\n\n\n\n\n\n# 选择你的模式 (`grep`)\n\n使用 `grep`\
  \ 的技巧很大程度上取决于明智地选择要搜索的模式，特别是模式的开头和结尾。例如，使用以下 `grep` 命令可能不是一个好主意：\n\n```\n$ grep\
  \ ' acme' report*\n```\n\n此命令要求在模式的 `acme` 之前有一个空格，以避免匹配如 `Dacmer` 这样的单词。然而，要求开头有空格并不是好主意，因为如果\
  \ `acme` 位于行首或在引号内，`grep` 将无法找到它（因为 `acme` 开头不是空格）。\n\n假设你有一个巨大的 `phone-list` 文件，其中包含如下行：\n\
  \n```\nBower, Linda 714/555-8182\nDecker, Tom 818/714-6192\nMellinger, Fred 714/639-1215\n\
  Smith, Will 714/909-3818\nSmithson, Charlie 818/603-2194\n```\n\n要快速查找姓氏为 `Smith`\
  \ 的人，你可以输入：\n\n```\n$ grep Smith, phone-list Smith, Will 714/909-3818\n```\n\n注意，你之所以可以在\
  \ `grep` 模式末尾添加逗号，是因为文件中名字后面确实有一个逗号。逗号允许你显示 `Smith` 同时避开 `Smithson`。这个逗号并不是 `grep`\
  \ 的功能；它仅仅是文件设置方式的结果。\n\n要统计区号为 `714` 的人数，你可以输入此命令：\n\n```\n$ grep 714/phone-list\
  \ | wc -l\n```\n\n你之所以可以指定 `/`，是因为你的文件在区号和电话号码之间确实有一个 `/`。在模式中使用 `/` 允许你忽略它是否是电话号码的一部分（只要不是区号即可）。再次，`/`\
  \ 并不是 `grep` 命令的功能。它展示了你如何观察数据并明智地选择模式，以返回你想要看到的行。\n\n## 显示不包含模式的行 (`grep -v`)\n\
  \n`grep` 也可以用作反向过滤器：可以使用它来移除包含特定模式的不需要的行，以便查看剩余内容。要显示不包含模式的行，请配合 `grep` 使用 `-v`\
  \ 选项使其作为反向过滤器工作，例如所示：\n\n```\n$ who | grep -v guest | wc -l\n```\n\n在这里，`who` 会为每个登录系统的每个用户显示一行。`grep`\
  \ 命令随后使用反向过滤器排除包含单词 `guest` 的行，这样所有其他登录都将通过，但 guest 登录将被忽略。`grep` 的输出随后通过管道传给 `wc\
  \ -l`，用于统计排除 guest 登录后的登录人数。\n\n## 为找到的行添加行号 (`grep -n`)\n\n要让 `grep` 显示包含模式的行的行号，请为\
  \ `grep` 添加 `-n` 选项：\n\n```\n$ grep -n Acme report\n13:Acme Industries\n246:Pacific\
  \ Acme Ltd\n1202:Paul Acmeersch\n```\n\n如你所见，`grep -n` 先显示行号，然后是匹配模式的行。如果在多个文件上显示行号的\
  \ `-n` 选项，`grep` 的输出将以文件名开头，然后是行号，如下例所示：\n\n```\n$ grep -n Acme report*\nreport2:25:Acme\
  \ Enterprises\n... (继续)\n```\n\n## 显示包含模式的文件名 (`grep -l -c`)\n\n有时你只是想知道哪些文件引用了特定模式。如果每个文件中几万行都提到该模式，普通的\
  \ `grep` 输出将太长，无法轻易分析。要仅显示包含模式的文件名，请配合 `grep` 使用 `-l` 选项列出文件名，而不是包含模式的行：\n\n```\n\
  $ grep -l Acme report*\nreport2\nreport.acme\n```\n\n要显示每个文件名以及该文件中包含模式的行数，你可以使用\
  \ `grep` 的 `-c` 选项，如下：\n\n```\n$ grep -c Acme report*\nreport2:1\nreport4:0\nreport8:3\n\
  report12:0\nreport.acme:1\nreport.pegasus:0\n```\n\n## 查找包含两个模式的行 (`grep | grep`)\n\
  \n\n\n\n你可以使用两次 `grep` 来实现双重过滤。行必须同时包含两个模式才能通过，如下所示：\n\n```bash\n$ grep -i acme\
  \ report* | grep merge report7:246:once they merged with ACME INDUSTRIES, their\
  \ stock value\nreport.acme:45:whose former name was Acme Inc. until they merged\n\
  ```\n\n```bash\n$ grep -i acme report* | grep merge report*\n```\n\n`grep -c` 统计的是行数，而不是出现次数。\n\
  \n在查看 `grep -c` 的输出时，人们经常犯一个常见的错误，认为文件名旁边的数字是模式在文件中出现的次数。但请注意，`grep -c` 统计的是行数，而不是出现次数。如果模式出现了\
  \ 10 次，但都在同一行中，`grep -c` 将显示结果为 1，而不是 10。\n\n在这个示例中，你将 `grep` 管道传输给另一个 `grep` 以实现双重过滤。要通过第一个过滤器，行必须包含大写或小写的\
  \ `acme` 单词。要通过第二个过滤器，行还必须包含 `merge` 单词。输出显示了行中同时包含这两个模式的行。第二个模式出现在行中第一个模式之前或之后都没有关系。将\
  \ `grep` 管道到 `grep` 设置了一个逻辑与（AND）条件，这意味着行必须同时满足两个条件才能通过。\n\n注意，第二个 `grep` 命令不能指定任何文件，这样它才会从标准输入读取并处理第一个\
  \ `grep` 命令的输出。以下示例显示了人们有时会犯的错误：\n\n```bash\n$ grep -i acme report* | grep merge\
  \ report*\n```\n\n不要犯这个错误。这个示例不会产生错误，但它无法实现你的预期目标。因为第二个 `grep` 命令被赋予了一个文件列表，它忽略了来自第一个\
  \ `grep` 的输出。你在这里得到的是通信失败。第二个 `grep` 命令是一个独立的单一过滤器，它只查找包含 `merge` 的行并显示它们，即使它们不包含\
  \ `acme`。第一个 `grep` 命令做了一无用功，因为它的输出被忽略了。\n\n你还可以将普通过滤器与反向过滤器结合，如示例所示：\n\n```bash\n\
  $ grep -i acme report* | grep -v Dacmer\n```\n\n在这里，你首先使用普通过滤器来查找包含大写或小写 `acme`\
  \ 的行。但请注意，第一个过滤器找到了包含 `Dacmer` 的行，因为 `Dacmer` 包含了 `acme`。第二个 `grep` 是一个反向过滤器，会从第一个过滤器中移除行。结果是包含\
  \ `Acme` 但不包含 `Dacmer` 的行。然而，这里仍然存在一个问题：任何包含 `Acme` 和 `Dacmer` 的行都会被反向过滤器删除。稍后你会看到\
  \ `perl` 如何通过忽略其他单词中的模式来过滤掉整个单词。\n\n哪个过滤器应该放在第一个？如果你有一个双重过滤器，无论你以什么顺序应用过滤器，得到的结果都是相同的。但为了提高效率，第一个过滤器应该是过滤掉最多行的那个。这样第二个过滤器的工作就会少很多。\n\
  \n### 行中的通配符匹配（正则表达式）\n\n让 UNIX 变得非常强大的特性之一是模式可以指定你在文件中查找的内容。你已经在文件名通配符中看到了这一点，它允许你根据模式形成文件列表。在本节中，你将遇到正则表达式。\n\
  \n正则表达式是你想要搜索的字符字符串。正则表达式可以组合成一个更大的表达式。正则表达式可以包含特殊字符或元字符。我将这些特殊字符称为正则表达式通配符，以区分区别于文件名通配符。\n\
  \n尽管正则表达式很复杂，但了解它们很重要，因为它们是 UNIX 的基本工具，赋予了它许多力量和优雅。在本章中，你将看到如何使用正则表达式在文件中查找所需的行。在接下来的章节中，你将学习如何修改文件。有关文件名通配符的更多信息，请参阅第\
  \ 232 页。\n\n### 选择包含模式的行 (grep)\n\n这是一个典型的 grep 命令：\n\n\n\n\n```bash\ngrep acme\
  \ report7\n```\n\n如果你输入此命令，`grep` 将搜索文件 `report7` 的内容，并显示所有包含字符串 `acme` 的行，即使 `acme`\
  \ 是某个较大单词的一部分。请注意，模式 `acme` 可以位于行中的任何位置，`grep` 都会显示该行。\n\n## 选择以模式开头的行 (`^*`)\n\n\
  如果你只想查看以 `acme` 开头的行怎么办？你可以通过添加一个正则表达式通配符来实现。如下所示，你可以在模式的开头添加脱字符符号（`^`），它也称为“帽号”或“caret”：\n\
  \n```bash\ngrep '^acme' report7\n```\n\n注意搜索模式周围的单引号。通常情况下，给模式加上单引号是一个好主意（但有一种情况下你应该使用双引号；你稍后会学到这一点）。正如你可能记得的，如果模式包含任何标点符号或空格，你通常会在模式周围加上单引号。但即使没有标点符号或空格，使用单引号也没有坏处。\n\
  \n在上面的示例中，脱字符符号（`^`）是一个表示行首的正则表达式通配符。因此，只有以 `acme` 开头的行才会匹配模式。在输出中，`grep` 将显示这些行，包括行中\
  \ `acme` 之后的任何文本。\n\n脱字符符号（`^`）只有在出现在模式开头时才是一个通配符字符。例如，考虑以下命令：\n\n```bash\ngrep\
  \ '2⁴' mathproblems\n```\n\n在这里，`grep` 将显示行中任何位置包含 `2⁴` 的行。脱字符符号（`^`）只是另一个要搜索的字符，因为它没有出现在模式的开头。\n\
  \n要搜索以脱字符符号（`^`）开头的行，你需要输入这样的命令：\n\n```bash\ngrep '^^' filename\n```\n\n在上面的示例中，第一个脱字符符号（`^`）是表示行首的正则表达式通配符。第二个脱字符符号（`^`）不是通配符；它表示字面上的脱字符（`^`）。要指定开头的脱字符（`^`）是字面的\
  \ `^` 而不是表示行首，你可以在它前面加一个反斜杠（`\\`）：\n\n```bash\ngrep '\\^acme' report7\n```\n\n在这个示例中，`grep`\
  \ 搜索并显示行中任何位置包含 `^acme` 的行。请注意，每一行都有开头。因此，以下命令将匹配文件中的每一行：\n\n```bash\ngrep '^' report7\n\
  ```\n\n## 选择以模式结尾的行 (`$`)\n\n如果你只想查看以 `acme` 结尾的行怎么办？你可以通过在模式末尾添加另一个正则表达式通配符——美元符号（`$`）来实现：\n\
  \n```bash\ngrep 'acme$' report7\n```\n\n在这里，美元符号（`$`）是一个表示行尾的正则表达式通配符。因此，只有以 `acme`\
  \ 结尾的行才会匹配模式。`grep` 随后显示这些行，包括行中 `acme` 之前的任何文本。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n美元符号（`$`）只有在出现在模式末尾时才是通配符；否则它表示字面上的美元符号。要指定搜索作为行最后一个字符的字面美元符号，请在美元符号（`$`）前面加一个反斜杠（`\\\
  `）。\n\n\n\n\n\n```\nacme\nthe end of the line\n```\n\n例如，此行并不匹配之前指定的模式：\n```\nacme\
  \ acme\n```\n尽管该行以 `acme` 开头并以 `acme` 结尾，但它并不匹配。如果你从左到右将正则表达式 `^acme$` 与行 `acme\
  \ acme` 进行比较，很容易看出该正则表达式允许行中仅存在 `acme`。\n\n这里是另一个结合使用脱字符（`^`）和美元符号（`$`）的示例：\n```\n\
  grep '^$' report7\n```执行此命令，`grep` 会搜索并显示所有空行，即行尾紧跟在行首之后。\n\n现在考虑另一个示例：\n```bash\n\
  grep '$^' report7\n```\n在这里，脱字符（`^`）不是通配符，因为它没有出现在模式的开头。同样，美元符号（`$`）也不是通配符。因此，此\
  \ `grep` 命令会搜索并显示文件 `report7` 中在行任意位置包含美元符号（`$`）后跟脱字符符号（`^`）的行。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n`grep` 的名字是从哪里来的？\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ `ed` 是一种在 `vi` 出现之前常用的文本编辑器。在 `ed` 编辑器中，`g/re/p` 是一个用于全局搜索由斜杠（`/`）括起来的正则表达式并打印每一行的命令。当开发出一个独立的实用程序来执行相同的功能时，它保留了\
  \ `ed` 的名称但去掉了斜杠。\n\n### 在正则表达式中包含 Shell 变量\n\n你可以在正则表达式中使用 Shell 变量，如下：\n```\n\
  who | grep $LOGNAME\n```\n在此示例中，`$LOGNAME` 通常包含用户名。`who` 显示所有登录情况，`grep` 过滤掉不需要的行，只显示用户已登录的行。\n\
  \n如果 Shell 变量与其他模式元素相邻，请使用以下大括号 `{}` 将其括起来：\n```bash\ngrep \"${prefix}acme${SUFFIX}\
  \ Inc\" report7\n```\n对于此示例，假设 `$prefix` 包含 `g4` 且 `$SUFFIX` 包含 `UK`。该示例将执行以下命令：\n\
  ```bash\ngrep \"g4acme-UK Inc\" report7\n```\n由于模式包含空格，你必须将其用双引号括起来。更多信息请参阅后文关于正则表达式引号的章节。\n\
  \n另参阅 ![sarrow.gif](img/ad91af06ad96c57f0a338bded4c42f0e.gif) 获取更多关于 Shell 变量的信息\n\
  \n### 在正则表达式中包含命令替换\n\n正则表达式还可以包含你使用命令替换指定的元素，命令替换通过反引号（`` `` ``）或 `$()` 表示。例如，查看以下命令：\n\
  ```bash\ngrep \"report`date '+%Y'\" report\n```\n在此示例中，正则表达式由两个元素组成：\n1. 单词 `report`\n\
  2. 这个反引号内的命令：`date '+%Y'`\n\n在第二个元素中，`+%Y` 是 `date` 命令的一个选项，告诉它以四位数字显示当前年份。反引号（``\
  \ ` `` 和 `` ` ``）获取所包含命令的输出，将其替换到当前命令行中，并移除反引号内的命令。\n\n因此，如果当前年份是 1998 年，之前的 `grep`\
  \ 命令等同于：\n```bash\ngrep \"report1998\" report\n```\n当你使用命令替换时，正则表达式可以包含由任何其他 UNIX\
  \ 命令或管道生成的元素。\n\n\n\n\n\n# 使用正则表达式以防止问题\n\n如果你的正则表达式不包含标点符号或空格，则无需将其放在任何类型的引号中。不过，你也可以在模式周围使用双引号或单引号。\n\
  \n如果你的正则表达式确实包含标点符号或空格，但没有使用任何 Shell 变量或命令替换（如前所述），你应该将整个正则表达式封装在单引号中。这可以确保 Shell\
  \ 不会尝试将某些标点符号解释为 Shell 指令、文件名通配符等。如果你的正则表达式包含任何反斜杠（`\\`），请在每个反斜杠之前额外添加一个反斜杠（`\\\
  ` ）。\n\n然而，这些规则有一个例外。如果你的正则表达式包含一个或多个单引号（`'` ），请在正则表达式中的每个标点符号和空格前面加上反斜杠（`\\` ），并且*不要*将其封装在任何引号中。例如，假设你想搜索包含包含单引号的以下精确字符串：\n\
  \n`item '73' corneil`\n\n要实现这一点，你会使用以下 `grep` 命令：\n\n```\ngrep item\\ \\'73\\' corneil\
  \ filename\n```\n\n但是，如果你的正则表达式使用了 Shell 变量或命令替换，你应该将整个正则表达式封装在双引号中。然后，在你的正则表达式中出现的任何以下字符前面加上反斜杠：\n\
  \n- 美元符号（`$` ），如果它不是 Shell 变量的开头\n- 反引号（`` ` `` ），如果它没有包裹命令替换\n- 你的正则表达式内部的双引号（`\"\
  ` ）\n- 你还必须将任何单独的反斜杠（`\\` ）改为四个反斜杠（`\\\\\\\\` ），因为 Shell 会移除其中的两个，并且为了让 grep 正常工作，实际的反斜杠前面必须先跟一个反斜杠。\n\
  \n例如，假设 `$cost` 是一个包含金额的 Shell 变量，你想找到 report 中包含以下内容：`\"honest\"s$cost` 的所有行\n\n\
  你会使用此 `grep` 命令：\n\n```\ngrep \"\\\"honest\\\"s\\$cost\" report\n```\n\n或者，你也可以像这里所示，在正则表达式的区域周围结合使用单引号和双引号：\n\
  \n```\ngrep '\"honest\\'s\\\\'$cost\"' report\n```\n\n但注意，如果 `$cost` 包含标点符号，情况可能会变得复杂。\n\
  \n## 允许正则表达式的 UNIX 命令\n\n只有以下命令允许使用正则表达式：\n- `grep`, `egrep`, `fgrep`, `sed`\n-\
  \ `awk`\n- `perl`\n- `vi`（在搜索和替换时）\n\n## 文件名通配符与正则表达式的比较\n\n有时人们会困于何时使用正则表达式，何时使用文件名模式。以下指南可以缓解一些困惑：\n\
  \n- 当你想搜索文件或管道的内容时，使用正则表达式。只有少数命令支持使用正则表达式；请参见前一节。\n- 当你想根据模式创建文件名列表时，使用文件名模式。许多\
  \ UNIX 命令接受命令行上的文件列表。\n\n### 在特定位置允许任意字符 (*.*)\n\n点（`.` ）是一个正则表达式通配符。它代表任何字符，允许你精确地指定在其他模式元素之前、之后或之间允许多少个字符位置。以下命令显示点字符使用的示例：\n\
  \n```\ngrep 'dog.bone' report\n```\n\n给定该命令，`grep` 将显示所有包含 dog、紧跟任意单个字符、然后是 bone\
  \ 的行。例如，它可能会返回包含以下字符串的行：\n\n- dog-bone\n- dog bone\n- dog/bone\n- dogEbone\n\n\n\
  \n第 396 页\n\n然而，`grep 'dogbone'` 不会显示包含 dogbone 的行，因为在那种情况下 `dog` 和 `bone` 之间没有字符分隔。若想在正则表达式中匹配实际的点号\
  \ `.`，需要在点号前加一个反斜杠 `\\`，如下所示：\n\n```\ngrep '5\\.25' report\n```\n该命令将显示任何包含 5.25\
  \ 的行。在点号之前需要反斜杠 `\\` 是为了防止 `grep` 将该点号误认为匹配任意字符的正则表达式通配符。\n\n方括号 `[]` 允许你为正则表达式中该位置的字符指定一组备选字符，如下例：\n\
  \n```\ngrep 'dog[-EZ1-3]bone' report\n```\n根据该命令，`grep` 将显示包含以下任何字符串的行：\n- dog-bone\n\
  - dogEbone\n- dogZbone\n- dog1bone\n- dog2bone\n- dog3bone\n\n但注意，除非行中包含了允许的 bone\
  \ 引用，否则 `grep` 将不会显示包含以下字符串的行：\n- dog4bone（因为 4 不是允许的备选字符）\n- dogEZbone（因为方括号仅表示模式中的单个字符）\n\
  \n在方括号 `[]` 内部，两个字母或数字之间的连字符 `-` 表示一个范围。若要将连字符 `-` 视为普通字符，必须将其放在列表的开头或结尾。若要将右括号\
  \ `]` 视为字符，应将其放在 `[]` 中的第一个列表元素。方括号内的点号 `.`、星号 `*`、左括号 `(` 或反斜杠 `\\` 都被视为字面量，没有特殊含义。现在考虑以下命令：\n\
  \n```\ngrep '[0-9][0-9][0-9]' report\n```\n在这里，`grep` 显示任何包含三个（或更多）连续数字的行。即使你只搜索三个数字，`grep`\
  \ 也可能会找到三个以上的数字，因为该模式并没有限制在三个数字前后出现更多数字。这是另一个例子：\n\n```\ngrep '^[A-Z]' report\n\
  ```\n根据该命令，`grep` 将显示所有以大写字母开头的行。\n\n在模式位置指定禁止的字符 `[^...]`\n\n如果方括号中的列表以脱字符符号 `^`\
  \ 开头，它将匹配列表之外的任何单个字符。例如，给定以下命令：\n\n```\ngrep 'acme[⁰-9]' report\n```\n`grep` 将显示所有包含\
  \ acme 且后跟一个字符的行，只要该字符不是数字。它不会显示以 acme 结尾的行，因为在这一模式中 acme 后面必须有一个字符。这里是另一个例子：\n\n\
  ```\ngrep '[^a-z]' report\n```\n\n第 397 页\n\n文件名生成通配符（Filename Generation Wildcards）中的方括号与正则表达式通配符非常相似。然而，为了排除方括号中的字符，文件名生成通配符使用感叹号\
  \ `!` 作为第一个字符，而正则表达式通配符则使用脱字符符号 `^` 作为第一个字符。\n\n指定正则表达式元素出现的次数 `{n}`\n\n在指定正则表达式时，你可以使用简写方法来指定上一个正则表达式元素出现的次数。这种简写方法使用转义的大括号\
  \ `\\{` 和 `\\}`。以下是一个带有转义括号的命令示例：\n\n```\ngrep '2[0-9]{10}000' report\n```\n\n\n\
  \n在此命令中，正则表达式告诉 `grep` 查找一个 2，后面紧跟正好 10 个数字，最后是 000。`grep` *并没有*将其读取为一个 2，后面跟任意一个数字，再跟\
  \ 10 个数字。它将其读取为一个 2，后面跟 10 次数字（而不是 11 次），最后是 000。\n\n## 指定元素出现的次数\n\n1. 在 shell\
  \ 提示符下，输入包含包含正则表达式的所需命令。输入你想要重复的模式元素。该模式元素可以是一个简单的字母、数字，也可以是正则表达式通配符，如点 `.` 或中括号\
  \ `[]`。在没有接到指示之前，请勿按回车键。\n2. 输入 `{`。（除非接到指令要求，否则请勿输入任何空格。）\n3. 输入上一个模式元素所需的出现次数。\n\
  4. 如果该数字是最小次数，且你希望允许模式重复更多次数，请输入逗号 `,`。\n5. 如果有一个想要允许模式元素重复的最大次数，请现在输入该数字。\n6. 输入\
  \ `}`。\n7. 现在完成正则表达式的其余部分及命令。完成后，按回车键执行你的命令。\n\n考虑以下示例：\n\n```\ngrep '$[0-9]{3,5}\\\
  .' report7\n```\n\n给定此命令，`grep` 将显示所有包含美元符号 (`$`)、后面紧跟至少三个数字且不超过五个数字、最后是一个点号 (`.`)\
  \ 的行。注意，点号被转义了，它不是通配符。\n\n这是另一个示例：\n\n```\ngrep '[a-zA-Z]{2,}' report7\n```\n\n\
  此命令将显示所有包含 2 个或更多大写或小写字母单词的行。注意这里的逗号是多余的；你将在关于无界或更多通配符的章节中学习到这一点。\n\n## 指定正则表达式元素的零次或多次出现\
  \ (*)\n\n星号 `*` 是一个正则表达式通配符，你可以用它作为表达式 `{0,}` 的简写。星号 (`*`) 告诉 `grep` 允许上一个正则表达式元素出现零次或多次。不要将其与文件名通配符\
  \ `*` 混淆，后者的含义完全不同，且用于完全不同的语境。\n\n以下命令展示了如何使用星号正则表达式通配符：\n\n```\ngrep 'ab*c' report7\n\
  ```\n\n在此命令中，`b*` 表示 `grep` 允许出现零次或多次 `b`。给定此命令，`grep` 将显示包含以下任何字符串的行：\n\n- ac (0\
  \ 次 b)\n- abc (1 次 b)\n- abbc (2 次 b)\n- abbbc (3 次 b)\n- abbbbc (4 次 b)\n- 以此类推，包括\
  \ abbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbc\n\n为什么 UNIX 脚本中包含 `[ ]`？因为由于左边距存在空格或制表符，某些\
  \ `grep` 命令可能包含类似 `^[]*acme` 的模式。中括号内的字符是一个空格和一个制表符。该模式用于在在零个或多个空格或制表符的左边距之后，立即查找\
  \ `acme`。\n\n要表示任意字符的零次或多次，你可以将点和星号结合使用 (`.*`)，例如所示：\n\n```\ngrep 'dog.*bone' report7\n\
  ```\n\n此命令将显示包含以下字符串的行：\n\n- dogbone\n- dog-bone\n- doggy bone\n- My dog has a bone.\n\
  - My dog is named Rover. Please add a soup bone to the grocery list.\n\n上述命令不会显示\
  \ dog 在某行而 bone 在下一行的情况。整个正则表达式必须在同一行内。\n\n\n\n另一个例子，这个命令：\n\n```bash\ngrep '[0-9]*'\
  \ report7\n```\n\n它将显示所有包含零或多个数字的行。文件的每一行都会被显示，因为文件的每一行都包含零或多个数字。（数一数每行中的数字，你会发现我是对的。）\n\
  \n```bash\ngrep '[0-9][0-9]*' report7\n```\n\n此命令显示任何包含一个数字、后跟零或多个数字的行。本质上，它会找到并显示所有包含一个或多个数字的行。\n\
  \n```bash\ngrep '$[0-9][0-9]*.' report7\n```\n\n给定此命令，`grep` 显示任何包含美元符号（`$`）、其后跟一个或多个数字、最后是一个点（`.））的行。上一个命令与这个命令也是等价的：\n\
  \n```bash\ngrep '$[0-9]\\{1,\\}' report7\n```\n\n每当你看到正则表达式元素连续出现两次并跟一个星号（`*`）时，记住你可以使用如下命令来查找一个或多个该元素：\n\
  \n```bash\ngrep 'abb*c' report7\n```\n\n此命令告诉 `grep` 显示任何包含 a、其后跟一个或多个 b、其后跟一个 c\
  \ 的行。\n\n### 丢弃无边界的“或更多”正则表达式通配符\n\nUNIX 提供了几种方法来表示某个元素的使用次数为次数或更多。例如，你可以使用以下任何一种：\n\
  \n- `a{6,}`（6 个或多个字母 a）\n- `b*`（0 个或多个字母 b）\n- `cc*`（1 个或多个字母 c）\n- `ddd*`（2 个或多个字母\
  \ d）\n\n比较这两个命令：\n\n```bash\ngrep '[0-9]\\{3,\\}' report7\ngrep '[0-9]\\{3\\}' report7\n\
  ```\n\n这两个命令中的第一个将显示包含三个或多个数字的行。第二个命令没有对这三个数字之后可能出现的内容进行限制。因此，第二个命令允许在三个数字之后出现更多数字。换句话说，它也会显示包含三个或多个数字的行。换句话说，尽管你在第一个命令中指定了“或更多”，而在第二个命令中没有指定，这两个命令的输出是完全相同的。\n\
  \n这两个命令的情况也是一样的：\n\n```bash\ngrep 'abb*' report7\ngrep 'ab' report7\n```\n\n第一个命令将显示包含\
  \ a、其后跟一个或多个 b 的行。第二个命令将显示包含 ab 的行。然而，这两个命令是等价的，因为任何包含 a、其后跟一个或多个 b 的行也包含 a、其后跟一个\
  \ b（反之亦然）。尽管如此，不带“或更多”的命令更好，因为它效率更高且更容易理解，而且你可以预测结果。\n\n我将这些情况称为“无边界的‘或更多’情况”，因为你没有在“或更多”元素的前后指定模式元素。如果该“或更多”元素（在元素之前或之后）是无边界的，请从你的\
  \ `grep` 命令中省略“或更多”部分。这将使 `grep` 命令更高效，你也能更好地理解 `grep` 命令将输出什么内容。\n\n这里是一些有边界的“或更多”情况：\n\
  \n```bash\ngrep \"abb*c\" report7\ngrep '^[0-9]*$' report7\ngrep '$[0-9]\\{5,\\\
  }' report7\n```\n\n在这些命令中，在“或更多”通配符的前后都指定了模式元素。然而，这里的“或更多”是有意义的；如果省略，将会改变命令的输出。\n\
  \n### egrep 中可用的正则表达式通配符\n\n`egrep` 命令是 `grep` 的扩展版本，它允许一些 `grep` 不支持的正则表达式通配符。然而，`egrep`\
  \ 不支持使用大括号 `{}` 来指定出现次数。有时 `egrep` 的正则表达式通配符集被称为*扩展正则表达式*或*全正则表达式*。`egrep` 的语法与\
  \ `grep` 相同。\n\n### 使用 egrep 指定元素出现一次或多次\n\n要指定上一个模式元素被使用一次或多次，你可以在 `egrep` 中使用加号（`+`）通配符，如下所示：\n\
  \n```bash\negrep 'ab+c' report7\n```\n\n此命令将显示包含 a、其后跟一个或多个 b、其后跟 c 的行。`grep` 不支持加号（`+`）通配符。\n\
  \n### 使用 egrep 指定元素出现零次或一次\n\n要指定元素出现零次或一次，你可以在 `egrep` 中使用问号（`?`）：\n\n\n\n\n```bash\n\
  egrep 'Mrs?. Smith' report7\n```\n\n上述命令将显示包含此类字符串的行：\n\n```\nMr. Smith\nMrs. Smith\n\
  ```\n\n然而，它不会显示包含 Mrss. Smith 的行。问号（`?`）前面必须有一个反斜杠（`\\`），或者包含在双引号或单引号内（如所示）。`grep`\
  \ 不支持问号（`?`）通配符。\n\n### 搜索多个模式中的一种\n\n使用 `egrep`，你可以搜索并显示包含多个模式之一的行。你使用竖线（`|`）分隔这些模式，该符号也用作管道符号（`|`）。这是一个示例：\n\
  \n```bash\negrep 'acme|pegasus|apollo' report7\n```\n\n此命令将显示包含 acme 或 pegasus 或\
  \ apollo 的行。竖线（`|`）前面必须有一个反斜杠（`\\`），或者包含在双引号或单引号内（如所示）。\n\n括号 `()` 可用于竖线（`|`）选择进行分组，如下所示：\n\
  \n```bash\negrep 'project (acme|pegasus|apollo)' report7\n```\n\n此命令将显示包含 project\
  \ acme 或 project pegasus 或 apollo 的行。\n\n### 仅在 perl 中可额外正则表达式通配符\n\n`perl` 是一种运行在\
  \ UNIX 和 Windows 下的完整语言。虽然它没有包含在任何商业 UNIX 发行版中，但大多数 UNIX 系统都可以通过互联网轻松获取。如果你的系统中可用\
  \ `perl`，你可以将其作为一个类似 grep 的命令行工具，提供 `grep` 或 `egrep` 不具备的搜索和显示功能。\n\n### 使用 Perl\
  \ 查找包含模式的行\n\n1. 如果你要在管道中使用 `perl`，请输入生成供 `perl` 处理输出的 UNIX 命令。以管道符号（`|`）结束此序列。在收到指示之前不要按回车。\n\
  2. 输入 `perl -ne 'print if /'`。`perl` 的 `-e` 选项允许你在命令行输入一行 perl 代码。`-n` 选项允许 perl\
  \ 处理标准输入的每一行或命令行上指定的任何文件。在收到指示之前不要按回车。\n3. 输入要搜索的模式。你可以包含 `grep` 和 `egrep` 的任何正则表达式。表示重复次数的大括号\
  \ `{}` 前面不应该有反斜杠（`\\`），不像在 `grep` 中那样的。\n4. 输入 `/`。\n5. 如果你想忽略模式中的大小写，输入 `i`。\n\
  6. 如果你想忽略模式中的空格，输入 `x`。\n7. 输入单引号 `'`。\n8. 如果你不是通过管道传递给 `perl`，请输入空格，然后输入一个或多个要搜索的文件名。\n\
  9. 按回车键执行你的命令。这是一个完整的示例：\n\n```bash\nperl -ne 'print if /[acme0-9]/ix' report7\n\
  ```\n\n在此示例中，正则表达式放置在斜杠（`/`）之间。同样，你在最后一个斜杠（`/`）之后使用 `x` 选项，以便在正则表达式中插入空格以提高可读性。另一个\
  \ `perl` 特性是在大括号 `{}` 前面不使用反斜杠。\n\n### 查找不是更大单词一部分的单词\n\n使用 `perl`，你可以搜索不是更大单词一部分的单词。这使用\
  \ `grep` 或 `egrep` 是困难或无法做到的。要指定单词边界，请在 `perl` 的正则表达式中输入 `\\b`。在 `perl` 中，单词可以包含大写或小写字母、数字或下划线字符（`_`）。\n\
  \n```bash\nperl -ne 'print if /\\bin\\b/ix' report7\n```\n\n此命令将显示 `report7` 中任何包含单词\
  \ `in` 的行。通过在单词 `in` 前后 `\\b`，你可以指定单词 `in` 不能是更大单词的一部分。\n\n\n\n\n因此，输出将不会包含 `tin`、`bin`、`dinner`\
  \ 或 `into` 单词的行。然而，如果 `in` 位于行首、行尾或周围有标点符号，则它会被显示出来。\n\n在以下命令中：\n```bash\nperl -ne\
  \ 'print if /\\b in /ix' report7\n```\n`\\b` 只出现在单词 `in` 之前。该命令将显示所有包含以 `in` 开头的单词的行，包括\
  \ `into` 或 `intend` 等较大的单词。\n\n要指定某个位置不在单词边界上，您可以使用 `\\B`，例所示：\n```bash\nperl -ne\
  \ 'print if / in \\B /ix' report7\n```\n此命令将显示所有包含 `in` 字符串作为较长单词部分的行，例如 `inn`、`into`\
  \ 或 `dinner`。然而，单词 `tin` 和 `bin` 将不会匹配模式，因为它们在单词 `in` 之后有一个单词边界。\n\n**另另**\n有关 `perl`\
  \ 的更多信息，请参阅第 717 页。\n\n## 关闭正则表达式通配符\n\n要关闭正则表达式通配符的特殊性质，请如示例所示在它前面加上反斜杠（`\\`）：\n\
  ```bash\ngrep '2\\*3' mathreport\n```\n在这里，您正在查找字符串 `2*3`，因此您必须关闭星号（`*`）的含义。如果有大量的通配符需要关闭，可以使用\
  \ `fgrep` 命令，它不允许正则表达式通配符。对于 `fgrep` 来说，所有字符都是普通字符。因此，通过此命令：\n```bash\nfgrep '*****'\
  \ report\n```\n您可以查找所有包含五个或更多星号的行。不过，您不需要在每个星号前面加反斜杠，因为您使用的是 `fgrep` 命令而不是 `grep`。\n\
  \n`fgrep` 也用于忽略 变量内容中的通配符，例所示：\n```bash\nfgrep \"$USERINPUT\" report\n```\n\n###\
  \ 避免使用 fgrep 的两个原因\n`fgrep` supposed supposed 是快速 grep，因为它不需要处理正则表达式。然而，它通常是所有 `grep`\
  \ 命令中最慢的。X/Open (Ver 2) 规范认为 `fgrep` 已过时，并倾向于使用等效命令 `grep -F`。\n\n## 检查特定字段以选择行\
  \ (awk)\n`awk` 是一种在所有商业系统中可用的扩展编程语言。您可以使用它的子集作为类似于 grep 的行工具，提供 `grep` 或 `egrep`\
  \ 不具备的搜索和显示功能。\n\n**另**\n有关 `awk` 的更多信息，请参阅第 671 页。\n\n### 如果单字段精确匹配则显示行 (awk)\n\
  `grep` 检查整行是否匹配。如果您只想检查行的某个特定字段，可以使用 `awk` 实现。\n\n### 根据单字段的精确匹配显示行\n1. 如果您准备在管道中使用\
  \ `awk`，请输入将生成供 `awk` 处理输出的 UNIX 命令。以管道符号（`|`）结束此序列。在收到指示前不要按回车键。\n2. 输入 `awk '$FNUM\
  \ ==`。\n3. 将 `FNUM` 替换为您想要检查的字段编号。对于 `awk`，您用一个或多个空格或制表符分隔字段。第一个字段是 `1`。最后一个字段可以通过将\
  \ `FNUM` 替换为 `NF` 来指定（如 `awk '$NF ==`）。在收到指示前不要按回车键。\n4. 输入一个空格，然后输入由双引号括起来的搜索模式。不允许使用通配符。（如果您想使用通配符，请查看下一节。）\n\
  5. 输入单引号（`'`）。\n6. 如果您没有通过管道到 `awk`，请输入一个空格，然后输入一个或多个要搜索的文件名。\n7. 按回车执行您的命令。这里是一个示例：\n\
  \n\n\n\n\n```bash\nawk '$3 == \"acme\"' report7\n```\n该命令将显示 `report7` 中第 3 字段仅包含\
  \ `acme` 单词的行。\n\n### 根据单个字段的数值显示行 (*awk*)\n\n你可以使用相同的格式，当某个特定字段包含数值时显示该行。数值周围不需要加双引号。你可以进行以下测试：\n\
  \n- `==` 等于\n- `!=` 不等于\n- `>` 大于\n- `>=` 大于等于\n- `<` 小于\n- `<=` 小于等于\n\n```bash\n\
  awk '$1 > 3.6' yearend.rpt\n```\n上一个命令将显示 `yearend.rpt` 中所有第 1 字段包含大于 3.6 的数字的行。如果该字段（第\
  \ 1 字段）以字母开头（即它不是数值），awk 会将其视为一个大到无法实现的数值。\n\n### 当单个字段存在正则表达式匹配项时显示行 (*awk*)。\n\
  \n在检查匹配字符串时要使用正则表达式，请将测试操作从 `==` 改为波浪号 (`~`)，并在正则表达式周围加上斜杠 (`/` )如下所示：\n\n```bash\n\
  awk '$3 ~ /^acme[0-9]/' report7\n```\n该命令将显示 `report7` 中所有第 3 字段以 `acme` 开头并跟一个数字的行。\n\
  \n`awk` 允许使用 `egrep` 相同的表达式通配符，包括：\n- `+` 匹配前一个元素出现一次或多次\n- `?` 匹配前一个元素出现零次或\n-\
  \ `|` 允许的模式\n- `()` 用于模式分组\n\n`awk` 和 `egrep` 一样，不允许使用 `{}` 来指定出现次数。\n\n### 根据多个条件显示行\
  \ (*&&,|*)\n\n若要在显示行之前检查两个条件，请使用 `&&` 表示逻辑与（AND）。例如，在该命令中：\n\n```bash\nls -l | awk\
  \ '$3 == \"fred\" && $5 > 2300'\n```\n`awk` 正在检查 `ls` 输出的第 3 字段，即每个文件的所有者。它同时检查第\
  \ 5 字段，即文件的大小（字节）。该命令将仅显示所有者为 fred 且大于 2300 字节的文件。\n\n若要检查一个条件或另一个条件是否真，请使用 `||`\
  \ 表示逻辑或（OR），例如：\n\n```bash\nls -l | awk '$3 == \"fred\" || $5 > 2300'\n```\n该命令将显示所有所有者为\
  \ fred 或大小大于 2300 字节的文件。若要对条件进行分组，如下所示使用括号 `()`：\n\n```bash\nls -l | awk '($3 ==\
  \ \"fred\" || $3 == \"jane\") && $5 > 2300'\n```\n该命令将显示所有者为 fred 或 jane 的文件，前提是大小大于\
  \ 2300 字节。\n\n# 第 16 章 从文件或管道中替换或删除文本\n作者 Steve Moritsugu\n\n## 将一个字符串替换为另一个\n\n\
  ### 使用正则表达式模式查找替换项\n### 在替换中使用找到的文本\n### 删除字符串\n### 使用 Shell 变量进行替换\n### Perl 中的特殊替换功能\n\
  ### 替换不是较大单词部分的单词 (*perl*)\n\n\n\n\n\n上一章展示了如何使用正则表达式通配符在文件或管道中查找包含模式的行。该章还展示了正则表达式通配符看起来与文件名生成通配符（Filename\
  \ Generation Wildcards）相似，但尽管它们使用了一些相同的通配符字符，它们是两组用于完全不同目的通配符。本节将教你如何替换行中的子字符串，以及如何使用正则表达式模式来定义要替换的字符串。\n\
  \n### 另参\n有关关于正则表达式通配符的更多信息，请参阅第 388 页。\n\n## 用另一个字符串替换字符串 (*sed*, 正则表达式)\n\n在显示文件输出时将一个字符串替换另一个字符串，请如下使用\
  \ `sed` 命令：\n\n```bash\nsed 's/Mr. Smith/Ms. Wilson/g' report7\n```\n\n`sed` 是流编辑器。它在逐行处理数据流时，执行我们指定的任何编辑更改。\n\
  \n`'s/Mr. Smith/Ms. Wilson/g'` 是我们提供给 `sed` 的编辑命令。该命令通常包含在单引号中，以防止内部的标点符号被 shell\
  \ 解释。如果你想将任何 shell 变量作为编辑命令的一部分，请使用双引号而不是单引号。\n\n`'s/Pattern/Repl/g'` 是 `sed` 命令的一般格式。`Pattern`\
  \ 是要搜索的字符串，`Repl` 是用于替换的字符串。`Pattern` 可以包含正则表达式通配符，但 `Repl` 不可以我们的示例搜索字符串 `Mr. Smith`\
  \ 并将其所有出现的地方替换为字符串 `Ms. Wilson`。即使 `Pattern` 是一个较大单词的一部分，情况也是如此；例如，`Smithson` 将变成\
  \ `Wilsonson`。我们将在本章稍后的部分中看到 Perl 如何防止这种情况。\n\n`report7` 是 `sed` 处理的文件。你也可以指定一个文件列表，`sed`\
  \ 将显示每个文件的内容并进行指示的替换。可以使用文件名生成通配符来生成文件列表。请注意，`sed` 将更改后的输出显示到标准输出；它不会修改文件本身。该命令的输出随后可以管道到另一个命令，或者重定向到文件中。\n\
  \n以下是在管道情况下的使用的相同 `sed` 命令：\n\n```bash\ncat report* | sed 's/Mr. Smith/Ms. Wilson/g'\n\
  ```\n\n`report*` 不是正则表达式通配符。它是一个文件名生成通配符，生成所有以单词 *report* 开头的文件列表。`cat` 命令将这些文件输出到标准输出，并管道到我们刚刚分析的相同\
  \ `sed` 命令。`sed` 的输出将逐页显示在屏幕上。\n\n## 在 sed 搜索字符串中使用正则表达式通配符\n\n上一章讨论了正则表达式（R.E.）通配符。请查看附录中的通配符部分以快速参考所有特殊符号。这是一个在搜索字符串中使用\
  \ R.E. 通配符的 `sed` 命令示例：\n\n```bash\nsed 's/JPC[^A-Za-z]*SPR/JPC-SPR/g'\n```\n\n\
  在这个示例中，`[^A-Za-z]` 是正则表达式通配符，表示任何非大写或小写字母的字符。`[^A-Za-z]*` 是正则表达式通配符，表示零或多个任何非字母字符。`JPC[^A-Za-z]*SPR`\
  \ 是上述 `sed` 命令中搜索的模式。它正在寻找 `JPC` 后面跟着 `SPR`，中间有零或多个非字母字符。该模式可以在以下每一行中找到，最后一行除外：\n\
  \nJPCSPR company long history of JPC-SPR relations\nmany JPC/SPR employees\nJPC*SPR\
  \ company president negotiate contracts\ntwo companies, JPC and SPR, merged\n\n\
  在这些行中，作者在引用公司名称时并不一致，但我们可以使用 R.E. 通配符模式来匹配所有不同的引用，并将它们替换为一个一致的引用。以下显示了在运行我们的示例 `sed`\
  \ 命令后，之前的行的显示情况（该命令在此重复）：\n\n\n\n\n\n```bash\nsed 's/JPC[^A-Za-z]*SPR/JPC-SPR/g'\
  \ report7\n```\nJPC-SPR 公司悠久的 JPC-SPR 关系、许多 JPC-SPR 员工、JPC-SPR 公司总裁、四次 JPC-SPR 投票、谈判\
  \ JPC-SPR 合同、两家公司 JPC 和 SPR 合并。注意最后一行没有匹配正则表达式 (R.E.)，因此该行未进行替换。\n\n### 将替换后的输出保存到原始文件中\
  \ (sed)\n\n`sed` 将替换后的行显示到标准输出。如果你想替换文件的内容，必须使用两个 UNIX 命令和一个临时文件。例如：\n\n```bash\n\
  sed 's/pattern/repl/g' report7 > /tmp/sed$$\nmv /tmp/sed$$ report7\n```\n\n这种技术在第\
  \ 4 章中介绍过。\n\n### 另另参考\n有关将输出保存到原始文件的更多信息，请参阅第 114 页。\n\n### 每行仅进行一次替换 (sed)\n\n\
  从替换命令中移除 `g` 标志，使每行最多只替换一次。如果没有 `g` 标志，我们仍然会在模式出现的每行中进行一次替换，但在任何给定行上的替换次数都不会超过一次。例如：\n\
  \n```bash\nsed 's/IBW/MCC/' partslist\n```\n\n假设前述命令提到的文件 `partslist` 如下行：\n```\n\
  402 IBW-10 IBW(4),IBW(5) 403-6 IBW-11-6 IBW(3),NT(16)\n527 GRV-6 GRV(13),NT(14)\n\
  ```\n\n前面的 `sed` 命令将把这些行替换为：\n```\n402 MCC-10 MCC(4),MCC(5) 403-6 MCC-11-6 MCC(3),NT(16)\n\
  527 GRV-6 GRV(13),NT(14)\n```\n\n注意，每行中只有第一个 `IBW` 被替换了。当你使用脱符号 (`^`) R.E. 通配符或美元符号\
  \ (`$`) R.E. 通配符时，应该省略 `g` 标志（参见附录中的通配符部分）。例如：\n\n```bash\nsed 's/^[ \\t]*Chapter/Section/'\
  \ book3\n```\n\n在这个示例中，`[ \\t]` 是一个 R.E. 通配符，表示空格或制表符。方括号内有一个空格和一个制表字符。`^[ \\t]*`\
  \ 表示行开头零或多个空格或制表符。`^[ \\t]*Chapter` 表示左侧边缘的 `Chapter` 单词，该单词可以缩进但仍匹配模式。前面的 `sed`\
  \ 命令仅在 `Chapter` 是行的第一个单词（忽略任何前导空格）时，才会将 `Chapter` 替换为 `Section`。如果 `Chapter` 有缩进，替换后的单词\
  \ `Section` 将不会缩进。我们将在下一节介绍如何保留通配符，这将允许替换具有相同的缩进。如果你在配合脱符号 (`^`) 或美元符号 (`$`) R.E.\
  \ 通配符时包含 `g` 标志，你的命令仍然有效。`g` 标志只是多余的且效率略低，因为当你使用这两种 R.E. 通配符时，每行不可能会多于一个匹配项。\n\n\
  ### 更改分隔符 (sed)\n\n紧随 `s` 的字符是标记搜索模式和替换字符串开始与结束的分隔符。斜杠 (`/`)、冒号 (`:`) 和百分号 (`%`)\
  \ 是常用的分隔符。这三个命令的作用完全相同：\n\n```bash\nsed 's/xxx/yyy/g' report7 # 分隔符是斜杠 (/)\nsed\
  \ 's:xxx:yyy:g' report7 # 分隔符是冒号 (:)\nsed 's%xxx%yyy%g' report7 # 分隔符是百分号 (%)\n\
  ```\n\n选择一个不在搜索模式或替换字符串中的字符作为分隔符。例如，将所有的 `/usr/fred` 替换为 `/usr/jane`，我会选择斜杠 (`/`)以外的分隔符。例如：\n\
  \n```bash\nsed 's:/usr/fred:/usr/jane:g' report7\n```\n\n某些 UNIX 系统允许上述三种常用符号外的任何字符作为分隔符。或者，如果你不想更改分隔符，可以在分隔符字符前加上反斜杠\
  \ (`\\`)，以便在源字符串或目标字符串中使用它。以下行与前面的示例等效，但更难阅读：\n\n\n\n\n\n```bash\nsed 's/\\/usr\\\
  /fred/\\/usr\\/jane/g' report7\n```\n\n## 从行中移除（删除）字符串 (`sed, R.E.*`)\n\n要移除或删除一个字符串，请使用\
  \ `sed` 替换命令并指定一个空替换字符串。例如：\n\n```bash\nsed 's/ (LPX)//g' report\n```\n\n此示例会搜索空格后跟着括号\
  \ `(LPX)` 的内容，并在任何找到它的地方删除这六个字符。\n\n## 选择性替换或删除\n\n我们可以限制 `sed` 作用的行范围以执行替换或删除。做到这一点的一种方法是指定起始行号和结束行号。例如：\n\
  \n```bash\nsed '14,253 s/Mr. Smith/Ms. Wilson/g' report7\n```\n\n- `14` 指定了 `sed`\
  \ 开始替换的起始行号。行 `1` 是文件或管道的第一行。\n- `253` 指定了 `sed` 替换的最后一行号。\n\n使用美元符号（`$`）来指定文件的最后一行，如下：\n\
  \n```bash\nsed '14,$ s/Mr. Smith/Ms. Wilson/g' report7\n```\n\n此命令在你想要处理文件的大部分，但包含一个不想处理的头部部分时非常有用。\n\
  \n选择性替换或删除模式的另一种方法是指定一个必须出现在待处理行中的匹配模式。例如：\n\n```bash\nsed '/Acme/s/Mr. Smith/Ms.\
  \ Wilson/g' report7\n```\n\n在前面的示例中，替换将只会在包含匹配字符串 `Acme` 的行上发生。除了 `Acme`，我们还可以使用一个包含\
  \ R.E. 通配符的匹配模式。如果匹配模式包含斜杠（`/`），请在它前面加一个反斜杠（`\\`），如下：\n\n```bash\nsed '\\usr\\/fred/s/Mr.\
  \ Smith/Ms. Wilson/g' report7\n```\n\n在例例中，替换只会在包含匹配字符串 `/usr/fred` 的行上发生。你也可以使用初始的\
  \ `\\x` 来选择任何字符 `x` 作为匹配模式的分隔符。例如：\n\n```bash\nsed '\\:/usr/fred:s/Mr. Smith/Ms.\
  \ Wilson/g' report7\n```\n\n在前面的示例中，替换只会在包含匹配字符串 `/usr/fred` 的行上发生。\n\n如果你想处理一段连续的行，但不知道起始和结束行号，可以使用模式来指定开始和结束，如下：\n\
  \n```bash\nsed '/^Chapter 2/,/^Chapter 3/s/Mr. Smith/Ms. Wilson/g' report\n```\n\
  \n在此示例中，替换将发生在该区域的所有输出行上，该区域的第一行包含 `Chapter 2,` 单词（其前面可能有一些领先空格）。替换区域结束于包含 `Chapter\
  \ 3` 的行（允许有前导空格）。注意两个模式都在斜杠（`/`）中并用逗号分隔。\n\n## 使用特殊字符\n\n要在搜索模式中搜索字面星号（`*`）或点（`.`），请在该字符前加一个反斜杠（`\\\
  `），这样 `sed` 就不会将其视为通配符。例如：\n\n```bash\nsed 's/321\\.43/421.43/g' report7\n```\n\n\
  在前面的示例中，反斜杠（`\\`）表示点不是通配符，因此 `sed` 将搜索 `321.43` 并将该精确字符串的所有出现处替换为 `421.43`。\n\n\
  没有办法可以搜索从一行开始并在另一行结束的模式。你不能在搜索模式或替换字符串中使用 `\\n`。你可以使用经过转义的换行符在替换字符串中开始换行，如下：\n\n\
  ```bash\n$ date\nsed 's/ /\\/g'\nSun\nMar\n22\n11:38:09\nPST\n1998\n$\n```\n\n在此示例中，你正在将输出中的每个空格更改为换行符。注意在\
  \ `sed` 替换字符串中按下回车键换行之前，我们在前面放了一个反斜杠。随后，我们得到了 `PS2` 提示符（`>`），它告诉我们我们仍在输入上一个命令的一部分。然后我们输入剩余的\
  \ `sed` 命令。\n\n若要在搜索或替换字符串中包含字面单引号（`'`），你不能像之前的示例中那样使用单引号来包裹字符串。同样，使用前面的反斜杠来转义内部的单引号（`'`）也没有帮助。你必须将\
  \ `sed` 命令周围引号改为双引号，如下：\n\n```bash\nsed \"s/it's/it is/g\" report7\n```\n\n\n\n\n\
  \n请参阅后续章节了解在使用 `sed` 时使用双引号而非单引号时可能遇到的其他问题。\n\n# 在搜索或替换字符串中使用 Shell 变量\n\n如果你在搜索或替换字符串中经常使用某个短语，可以将其保存在\
  \ Shell 变量中以便重复使用，如下所示：\n\n```bash\nCO=\"Acme\"\n```\n\n要在 `sed` 命令中使用 Shell 变量，请使用双引号而非单引号，如下所示：\n\
  \n```bash\nsed \"s/president of $CO/chairman of $CO/g\" report7\n```\n\n该命令搜索 `president\
  \ of Acme` 并这些单词更改为 `chairman of Acme`。\n\n如果 Shell 变量与其他字母、数字或下划线相邻，请用花括号 `{}`\
  \ 将变量括起来，如下所示：\n\n```bash\nsed \"s/president of ${CO}Ltd/chairman of ${CO}Ltd/g\"\
  \ report7\n```\n\n上一个命令搜索 `president of AcmeLtd` 并将这些单词更改为 `chairman of AcmeLtd`。\n\
  \n在使用双引号而非单引号时，你还必须在以下内容之前加上反斜杠 (`\\`)：\n- 美元符号 (`$`)，如果它不是 Shell 变量的开头\n- 反引号 (``\
  \ ` ``)，且未包含替换内容\n- 字符串内部的双引号 (`\"`)\n- 你还必须将搜索或替换字符串中的任何字面反斜杠 (`\\`) 更改为四个反斜杠 (`\\\
  \\\\\\`)。（因为 Shell 会移除其中两个，而反斜杠前面必须有一个反斜杠来表示字面上的反斜杠。）\n\n另请参：关于 Shell 变量的信息，请参阅第\
  \ 30 页\n\n# 不要替换 0 次或多次出现的内容 (*sed*)\n\n假设 `report7` 包含以下行：\n```\nfive trucks XXX\
  \ three XX cars\n```\n\n假设我们想将任何组 `Xs` 替换为问号 (`?`)。以下是错误的做法：\n\n```bash\nsed 's/X*/?/g'\
  \ report7 # 错误方法\n```\n\n以下是上一个命令的输出：\n```\n? trucks ? ? cars\n```\n\n我们之所以多次看到替换字符串的原因是，在任何两个字符之间总是存在任何字符的零次出现。如果我有字母\
  \ `ab,`，那么这两个字符之间字母 `X` 的出现次数为零。要修正上一个 `sed` 命令，我们应该指定一个或多个 `Xs`，而不是零或多个 `Xs`。\n\
  \n以下是使用的正确 `sed` 命令：\n\n```bash\nsed 's/XX*/?/g' report7 # 正确方法\n```\n\n`XX*` 指定一个\
  \ `X` 后跟零或多个 `Xs`，这等同于一个或多个 `Xs`。该命令的输出如下：\n```\nfive trucks ? cars\n```\n\n# 在替换字符串中使用、通配符匹配的内容\
  \ (*sed*)\n\n如果你用转义的括号将正则表达式（R.E.）模式的部分或全部括起来，`sed` 将记住匹配该模式部分的精确字符。然后你可以在替换模式中使用\
  \ `\\1` 使用该被记住的字符串。使用 `\\2` 用于第二个被记住的模式，依此类推。以下是在本章之前分析过的一个示例：\n\n```bash\nsed 's/^[\
  \ ]*/Chapter/Section/'\n```\n\n它将 *Chapter* 更改为 *Section*，但正如我们看到的，替换字符串丢失了它先前的左侧边距。我们可以如下进行修正：\n\
  \n```bash\nsed 's/^\\([ ]*\\)Chapter/\\1Section/'\n```\n\n`\\([ ]*\\)` 使用转义的括号来记住在\
  \ *Chapter* 单词之前左侧边距发现了多少空格或制表符。`\\1` 插入该被记住的字符串。\n\n\n\n\n目标字符串中的 `\\1` 会恢复被记住的字符串。\n\
  \n这里有一个不同的示例。假设 `report7` 包含最多六位数字的行。例如：\n\n```\n12345 cartons and 534723 sets 73293\
  \ boxes of 24 items\n1837 containers of 144 packages\n```\n\n我们可以使用 `sed` 在数字中插入逗号以使其更具可读性，如下：\n\
  \n```\nsed 's/\\([0-9]\\{1,3\\}\\)\\([0-9]\\{3\\}\\)/\\1,\\2/g' report7\n```\n\n\
  `([0-9] \\{ 1,3 \\})` 是要查找的模式的第一部分。它匹配一个、两个或三个连续的数字。这些是在上一章中讨论过的通配符。另请附录中的“通配符”部分。我添加了空格以便你看到模式中的元素，但在实际命令中是不允许空格的。匹配到的实际数字被记录为第一个记住的字符串（`\\\
  1`）。\n\n`([0-9] \\{ 3 \\})` 是要查找的模式的第二部分。它匹配三个连续的数字。这些数字必须紧跟模式的第一部分。将这两个模式结合起来，我们的命令就会查找（并替换）任何四个到六个连续数字。此正则表达式（R.E.）匹配到的实际数字被记录为第二个记住的字符串。\n\
  \n`\\1,\\2` 是替换字符串。它由第一个记住的字符串、逗号以及第二个记住的字符串组成。因此，我们在原始数字之间加上逗号并放回去。`sed` 可以使用许多标点符号。当我开始使用\
  \ UNIX 时，我会自动忽略任何带有大量标点符号的 `sed` 命令。这是 UNIX 可能晦涩难的典型例子。我希望曾有人告诉我如何将此类模式分解为简单的元素。命令行上的模式匹配是赋予\
  \ UNIX 优雅和力量的特性之一。这是该命令的输出：\n\n```\n12,345 cartons and 534,723 sets 73,293 boxes\
  \ of 24 items\n1,837 containers of 144 packages\n```\n\n### 消除除搜索模式以外的内容 (*sed*)\n\
  \n假设 `report7` 包含如下行：\n\n```\nIncome in Jan 52384 as reported in accounting report.\n\
  Income in Feb 63283 as reported in accounting report.\nIncome in Mar 61966 as reported\
  \ in accounting report.\n```\n\n假设我们只想显示月份和金额，并想删除行中剩余的文本。与其为要删除的剩余文本构建模式，我们还有另一种选择：为要保留的文本构建模式，这样更容易。我们可以通过将找到的文本作为搜索模式并记住，来消除除搜索模式以外的内容，如下：\n\
  \n```\nsed 's/.*\\([A-Z][a-z][a-z][0-9]\\{5\\}\\).\\1/' report7\n```\n\n`.*` 结束了我们的搜索模式。它指定了模式前后任意零或多个字符，因此整行都将被替换。`(...)`\
  \ 将记住匹配我们模式的字符，以便我们可以在替换中使用它们。\n\n`[A-Z][a-z][a-z]` 匹配以大写字母开头的三个字母月份。\n\n`[0-9]\\\
  {5\\}` 匹配五个连续的数字。\n\n替换字符串中的 `\\1` 只将匹配到的月份和金额放回，替换掉整行。这是该 `sed` 命令的输出：\n\n```\n\
  Jan 52384\nFeb 63283\nMar 61966\n```\n\n这种技术在设置来自某些 UNIX 命令的值的 shell 变量时也非常有用。我们可以使用\
  \ `sed` 提取我们需要的模式并将其保存到变量中，正如下一节所讨论的那样。\n\n\n\n\n# 规则：正则表达式通配符匹配最长跨度\n\n以下是 UNIX\
  \ `id` 命令的输出：\n\n```bash\n$ id uid=501(mori) gid=100(users) groups=100(users),11(floppy)\n\
  ```\n\n我们可以使用 `sed` 从 `id` 的输出中提取当前登录用户名，该名称位于第一组括号内。以下是实现的一种错误方法：\n\n```bash\n\
  $ id sed 's/.*(\\(.*\\)).*/\\1/'      # 错误方法 floppy\n```\n\n`.*` 是我们模式的开始和结束，使得我们可以像前一节讨论的那样替换整行内容。\n\
  \n`( ... )` 告诉 `sed` 我们正在寻找括号内的文本。\n\n`\\(.*\\)` 告诉 `sed` 记住括号内找到的所有实际字符。\n\n替换字符串中的\
  \ `\\1` 告诉 `sed` 替换内容仅包含括号内找到的内容。\n\n### 第 425 页\n\n由于正则表达式通配符总是匹配最长跨度的这一规则，上述命令找到了最后一个括号内的单词。在待搜索模式的开头，我们有\
  \ `.*`，它表示括号之前的零个或多个字符。这可以匹配行中直到第一个括号、第二个括号……或最后一个括号的所有内容。我们可以通过将第一个 `.*` 替换为 `[^]*`\
  \ 来接近正确结果，`[^]*` 表示左括号以外的零个或多个字符。例如：\n\n```bash\n$ id sed 's/[^(]*\\(.*\\*/\\1/'\
  \ # 仍然错误 mori)gid=100(users),11(floppy)\n```\n\n现在问题是，中间的 `.*` 因为最长跨度规则匹配了从第一个左括号到最后一个右括号的所有字符。我们可以通过将中间的\
  \ `.*` 替换为 `[^)]*` 来修正这个问题，`[^)]*` 表示右括号以外的零个或多个字符，如下：\n\n```bash\n$ id sed 's/[^(]*([^)]*\\\
  )).*/\\1/' # 正确 mori\n```\n\n现在我们提取了第一个括号的内容。我们可以使用相同的结构将结果放入 shell 变量中，如下：\n\n\
  ```bash\nMYLOGIN=`id sed 's/[^(]*([^)]*\\)).*/\\1/'` # 提取第一个括号\n```\n\n### 正则表达式通配符是贪婪的\n\
  \n我们可以使用术语“贪婪”（greedy）来描述匹配行中最长可能字符字符串的通配符。\n\n### 使用 Perl 替换或删除字符串\n\nperl 是一门完整的编程语言，可以在\
  \ UNIX 和 Windows 下运行。尽管它通常没有随任何 UNIX 发行版一起发布，但大多数 UNIX 系统都可以通过互联网获取。如果你的系统上有 Perl，你也可以将其作为简单的命令行工具使用，提供\
  \ sed 无法提供的替换功能。\n\n对于简单的替换，如果你对 perl 使用 `-pe` 选项，perl 就像 `sed` 一样。以下两个命令是等价：\n\n\
  ```bash\nsed 's/Mr.Smith/Ms.Wilson/g'\nperl -pe 's/Mr.Smith/Ms.Wilson/g'\n```\n\n\
  本章之前讨论了 `sed` 的 `g` 标志。它对 perl 意味着同样的意思：处理行上的所有模式，而不仅仅是行中的第一次出现。像 `sed` 一样，你可以对\
  \ perl 省略 `g` 标志，如下：\n\n```bash\nperl -pe 's/Mr.Smith/Ms.Wilson/'\n```\n\n上述命令只会替换行中第一次出现的\
  \ Mr. Smith。同一行中 Mr. Smith 的其他出现不会被替换。\n\nperl 不像 `sed`、`grep` 和 `awk` 那样在用于重复次数的大括号\
  \ `{}` 之前或用于记忆字符串的括号 `()` 之前使用反斜杠 (`\\`)。如果你想在模式中将括号作为字面字符表示，必须在 perl 中使用前面的反斜杠。只有当字面括号的形式为\
  \ `{n}`、`{n,}` 或 `{n,m}` 时，才需要前加反斜杠，因为这些可能会与正则表达式通配符混淆。\n\n虽然 perl 可以完成很多事情，但在这一节中，我将查看\
  \ perl 中 sed 无法实现的命令行替换能力。\n\n### 另参阅\n\n\n\n\n\n有关 R.E. 通配符和 Perl 的更多信息，请参阅第 30\
  \ 页。\n\n有关 Perl 编程的更多信息，请参阅第 717 页。\n\n### 如何匹配最短跨度 (*perl*)\n\n`perl` 支持但 `sed`\
  \ 不支持的通配符之一是问号（`?`）。在另一个通配符（例如 `*` 或 `+`）之后使用它，可以将该通配符的匹配范围限制在最短的跨度上。现在我们可以更轻松地解决前一节中的\
  \ ID 提取问题了。例如：\n\n```bash\n$ id perl -pe 's/.*?\\((.*?)\\*/\\1/' mori\n```\n\n`.*?(`\
  \ 表示左括号之前的任意零或多个字符。`?` 表示匹配最短跨度，因此该模式会匹配行中直到并包括第一个左括号的所有内容。\n\n`(...)` 记录匹配到的实际字符。`perl`\
  \ 在此处不使用反斜杠（`\\`）。\n\n`\\(.*?\\)` 表示左右括号之间的最短跨度。这限制我们只匹配一组括号内的内容。\n\n### 增强模式的可读性\
  \ (*perl*)\n\n`x` 标记（仅在 `perl` 中可用）允许在搜索模式中加入空格，以便分离元素以提高可读性。模式中的所有空格除非在前面有反斜杠（`\\\
  `）跟进，否则都会被忽略。我们可以将此应用于 `id` 提取命令：\n\n```bash\n$ id perl -pe 's/.*?\\(.*)\\*/\\1/'\n\
  ```\n\n以下是带有 `x` 标记并为了可读性添加空格相同的命令：\n\n```bash\n$ id perl -pe 's/.*? \\(.*?\\).*/\\\
  1/x'\n```\n\n### 替换不作为更大单词部分的单词 (*perl*)\n\n在本章较早之前，我们看过了这条命令：\n\n```bash\nsed 's/Mr.\
  \ Smith/Ms. Wilson/g'\n```\n\n我们看到它也会将 `Mr. Smithson` 改为 `Ms. Wilsonson`。如果你的 UNIX\
  \ 系统上安装了 `perl`，可以通过使用 `\\b` 通配符（它在 `perl` 中匹配单词边界）来避免这种情况，如下所示：\n\n```bash\nperl\
  \ -pe 's/Mr. Smith\\b/Ms. Wilson/g'\n```\n\n`Mr. Smith` 匹配模式并会被替换。`Mr. Smithson`\
  \ 不匹配模式，不会被替换。如果 `Mr. Smith` 后面跟着标点符号或行尾，它仍然满足 `\\b`（单词边界）条件并会被替换。多个 `\\b` 通配符可以使用搜索模式的开头、结尾和内部。关于\
  \ `\\b` 通配符的更多信息，请参阅第 40 页。\n\n### 替换字符串或另一种 (*perl*)\n\n使用竖线（`|`）在搜索模式中分隔不同的备选项，如下：\n\
  \n```bash\nperl -pe 's/cars|trains|planes/vehicles/g'\n```\n\n上述命令将搜索单词 `cars`、`trains`\
  \ 或 `planes`，并将每一个替换为单词 `vehicles`。\n\n我们可以使用括号对备选方案进行分组，如下所示：\n\n```bash\nperl\
  \ -pe 's/in (two|four)(cars|trains)/by freight/g'\n```\n\n上述命令将查找以下短语：\n- in two\
  \ cars\n- in four cars\n- in two trains\n- in four trains\n\n它会将这四个短语的所有出现处替换为单词\
  \ `by freight`。\n\n这些括号还会记录匹配的实际文本，可以作为 `\\1` 或 `\\2` 被引用。如果你不想记录模式，请使用 `(?:...)`，如下所示：\n\
  \n```bash\nperl -pe 's/in (?:two|four)(cars|trains)/in three \\1/g'\n```\n\n\n\n\
  \n`||` 在此处允许匹配单词 `two` 或 `four`。它不会记录匹配到的内容。\n\n`|(cars|trains)` 在此处允许匹配单词 `cars`\
  \ 或 `trains`，并且会记录匹配到的内容。\n\n`\\1` 允许我们在替换部分中使用被记录的字符串（`cars` 或 `trains`）。\n\n##\
  \ 在匹配 R.E. 模式时忽略大小写\n\n在使用 `sed` 进行替换时，忽略大/小写会非常繁琐。例如：\n\n```bash\nsed 's/[aA][cC][mM][eE]\
  \ [cC][oO][rR][pP]\\./Acme Inc./g' report7\n```\n\n`/i` 标志会让 `perl` 忽略大小写，允许我们编写如下等效命令：\n\
  \n```bash\nperl -pe 's/acme corp\\./Acme Inc./gi' report7\n```\n\n## 选择性替换或删除\n\n\
  我们可以使用 `if /Q.R.E./` 格式添加限定正则表达式（R.E.），在 `perl` 中进行选择性的替换或删除，其中 `Q.R.E.` 是限定正则表达式的缩写。\n\
  \n```bash\nperl -pe 's/Mr.Smith/Ms.Wilson/g if /acme/' report7\n```\n\n在在上述示例中，`if\
  \ /acme/` 设置了 `Q.R.E.`，使得将 `Mr. Smith` 替换为 `Ms. Wilson` 的操作只会在包含 `acme` 的行上发生。\n\
  \n## 使用 awk 替换或删除字符串\n\n`awk` 是一种所有 UNIX 系统都提供的强大的编程语言。正如在前章提到的，当我们需要根据特定字段的内容选择性地处理行时，可以使用简单的命令行形式运行\
  \ `awk`。\n\n另需参考\n关于使用 `awk` 显示行的信息，请参阅第 407 页\n关于 `awk` 编程的信息，请参阅第 671 页\n\n##\
  \ 基于字段的替换或删除\n\n在之前的章节中，我们学习了当特定字段等于指定值时如何显示文件中的行。例如：\n\n```bash\nawk '$3==\"acme\"\
  ' report7\n```\n\n在此示例中，只有当 `report7` 中的行第 3 字段完全匹配单词 `acme` 时，该行才会被显示。\n\n可以修改该命令，在第\
  \ 3 字段匹配单词 `acme` 的行上搜索并替换正则表达式（R.E.）模式，如下：\n\n```bash\nawk '$3==\"acme\" {gsub(\"\
  R.E.\",repl)}{print}' report7\n```\n\n`$3` 是要检查的字段编号。`$1` 是第一个字段。`$NF` 表示行的最后一个字段。每个字段由一个或多个空格或制表符分隔。`acme`\
  \ 是要检查的示例字符串。由于使用了 `==`，它可能不包含任何 R.E. 通配符。`R.E.` 是可能包含通配符的搜索模式。`repl` 用于替换行中所有匹配搜索模式的字符串。`repl`\
  \ 字符串中的 `&` 将替换为匹配整个 R.E. 的字符。`report7` 是要处理的示例文件也可以指定包含文件名通配符的文件列表。如果没有提供文件，`awk`\
  \ 将从标准输入读取，因此你可以从其他命令通过管道向其传递。\n\n单引号内部不需要空格。我添加空格是为了可读性，因为它们是被允许的。如果你只想删除所选行上的\
  \ R.E. 模式，将 `repl` 字符串更改为空字符串，如下：\n\n```bash\nawk '$3==\"acme\" {gsub(\"R.E.\",\"\
  \")}{print}' report7\n```\n\n\n\n\n\n若只想替换行中第一次出现的内容，而不替换该行中其他出现的内容，请使用 `sub` 而不是\
  \ `gsub`，如下：\n\n```bash\nawk '$3 == \"acme\" { sub (\"R.E.\",\"\") } {print}' report7\n\
  ```\n\n正如我们在上一章通过 `grep` 看到的那样，我们可以使用 `==`、`!=`、`>`、`>=`、`<` 或 `<=` 等运算符来测试字段中的数值。\n\
  \n```bash\nawk '$3 > 6.7 { gsub (\"repl\") } {print}' report7\n```\n\n在上一个命令中，只有当字段\
  \ 3 包含大于 6.7 的数值时才会发生替换。我们也可以将替换限制在特定字段包含正则表达式模式的行，如下：\n\n```bash\nawk '$3 ~ /Q.R.E./\
  \ { gsub (\"R.E.\",\"repl\") } {print}' report7\n```\n\n`Q.R.E.` 是对“合格正则表达式”（qualifying\
  \ R.E.）的缩写，即该正则表达式必须出现在行的某处，替换才会发生。我们可以使用 `||` 表示“或”（OR），使用 `&&` 表示“与”（AND）来组合多个条件，如下：\n\
  \n```bash\nawk '$2 <= 3.14 && $3 ~ /acme/ { gsub (\"R.E.\",\"repl\") } {print}'\
  \ report7\n```\n\n在前面的示例中，除非两个条件都成立，否则不会发生替换：字段 2 小于等于 3.14 且字段 3 等于或包含 `acme`（即指定的\
  \ Q.R.E. 模式）。\n\n### 仅显示指定字段\n\n当我只想显示行中的某些特定字段时，我经常使用 `awk`。使用 `{ print $n }` 来仅输出输出中的字段\
  \ `$n`，如下：\n\n```bash\nls -l report7 | awk '{print $5}'\n```\n\n在前面的示例中，我们使用 `awk`\
  \ 仅打印 `ls -l` 的字段 `$5`，这给了我们 `report7` 文件的字节大小。我们可以使用相同的命令将大小保存到变量中，如下：\n\n```bash\n\
  SIZE=`ls -l report7 | awk '{print $5}'`\n```\n\n在上一个命令中，我们使用反引号将 `report7` 的大小保存到变量\
  \ `SIZE`。我们可以像这个示例一样同时显示字段 9 的名称和字段 5 的大小：\n\n```bash\nls -l | awk '{print $9, $5}'\n\
  acme 17263\nreport7 2966\nreport8 34238\n```\n\n我们可以在输出中使用双引号指定字面量。我们还可以使用制表符让列对齐得更好。在下面的示例中，我在\
  \ `$9` 和 `$5` 之间的双引号内指定了一个制表符作为唯一字符：\n\n```bash\nls -l | awk '{print \"file: \"\
  \ $9 \" \" $5}'\nfile:acme 17263\nfile:report7 2966\nfile:report8 34238\n```\n\n\
  另一个例子。在 `ls -l` 的输出中，字段 3 是所有者。我们已经见过如何让 `awk` 根据特定字段的内容处理字段。例如：\n\n```bash\nls\
  \ -l | awk '$3 == \"root\" {print \"file: \" $9 \" \" $5}'\n```\n\n在这个示例中，只有当文件所有者为\
  \ root 时，我们才会显示文件名和大小。在下一个示例中，我们检查字段 2 以查看文件的链接数是否大于 4，如下：\n\n```bash\nls -l | awk\
  \ '$2 > 4 {print \"file: \" $9 \" \" $5}'\n```\n\n在下一个示例中，只有当字段 4（组名）包含正则表达式模式时，我们才会显示文件信息。例如：\n\
  \n```bash\nls -l | awk '$4 ~ /^work/ {print \"file: \" $9 \" \" $5}'\n```\n\n在前面的示例中，只有当字段\
  \ 4（文件所在组）以单词 work 开头，我们才会显示文件名和大小。正如我们之前通过 `awk` 看到的，我们可以分别使用 `||` 作为“或”条件，使用 `&&`\
  \ 作为“与”条件，如下：\n\n```bash\nls -l | awk '$2 > 4 && $4 ~ /^work/ {print \"file: \"\
  \ $9 \" \" ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)\" $5}'\n```\n\n\
  ### 条件替换特定值 (*awk*)\n\n我们可以通过添加符合此格式的 `awk` 动作来有条件地替换输出字段的值：\n\n```awk\nawk {if(condition)\
  \ $n=value}{print action}\n```\n\n这通常用于在当字段低于或高于某个阈值时对其进行修改。\n\n```bash\nls -l |\
  \ awk '{if ($5 > 20000) $5=20000} {print \"file: \" $9 ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)\"\
  \ $5}'\nfile:acme 17263\nfile:report7 2966\nfile:report8 20000\n```\n\n\n\n\n\n\
  在在上的示例中，`report8` 的值大于 20000，但我们使用 `awk` 命令将最大的报告值设置为 20000。我们也可以将值设置为双引号中的某个单词，如下：\n\
  \n```bash\nls -l | awk '{if ($5 > 20000) $5=\"overflow\"} {print \"file: \" $9 \"\
  \    \" $5}'\n```\n```text\nfile: acme      17263\nfile: report7  2966\nfile: report8\
  \  overflow\n```\n\n### 将字段格式化为直列 (awk)\n\n`awk` 具有许多 C 语言特性，包括 `printf` 函数。例如：\n\
  \n```bash\nls -l | tail +2 | awk '{ printf(\"Name: %16s, Size: %5d, Blocks: %6.2f\\\
  n\", $9, $5, $5/512)}'\n```\n```text\nName:             acme, Size: 17263, Blocks:\
  \   33.72\nName:            report7, Size:  2966, Blocks:    5.79\nName:       \
  \     report8, Size: 34238, Blocks:   66.87\n```\n\n`ls -l` 是我们示例的第一行。注意，shell 管道可以在管道符号\
  \ (`|`) 之后拆分，延续到下一行。\n\n`tail +2` 允许我们忽略 `ls -l` 输出的第一行，该行包含了文件开始之前的总块数。\n\n`printf(\"\
  格式化字符串\", v1, v2, ...)` 是 `printf` 函数的通用形式。格式字符串可以包含诸如 `Name:` 这样的字面量。它应该以 `\\n`\
  \ 结尾，表示换行。\n\n我们示例中的 `%16s` 表示格式字符串之后的第一个变量应该使用至少 16 个字符位置来显示。16 之后的 `s` 表示以字符串的格式显示该值。在我们的示例中，该规格被用于显示文件名。\n\
  \n`%5d` 表示格式字符串之后的下一个变量或值应该使用至少 5 个字符位置来显示。5 之后的 `d` 表示以十进制整数的格式显示该值，即一个没有小数部分的整数。在我们的示例中，该规格被用于显示以字节为单位的大小。\n\
  \n`%6.2f` 表示格式字符串之后的下一个值应该使用至少 6 个字符位置来显示。6.2 之后的 `f` 表示以浮点数的格式显示值，即带有小数部分的数字。`.2`\
  \ 表示在小数点右侧显示两位小数。在我们的示例中，该规格被用于显示以块为单位的计算大小。\n\n`$5/512` 是我们为块大小所做的计算。`$5` 是字节大小，因此\
  \ `$5/512` 是块大小。\n\n我们可以在百分号 (`%`) 之后输入负号 (`-`)，使 `printf` 在字段中左对齐输出，如下：\n\n```bash\n\
  ls -l | tail +2 | awk '{ printf(\"Name: %-16s, Size: %-5d, Blocks: %-6.2f\\n\",\
  \ $9, $5, $5/512)}'\n```\n```text\nName: acme         , Size: 17263, Blocks:   33.72\n\
  Name: report7      , Size:  2966, Blocks:    5.79\nName: report8      , Size: 34238,\
  \ Blocks:   66.87\n```\n\n当在字段中左对齐输出时，字段后紧跟逗号就不太好看了，因此我们可以从格式字符串中删除逗号，如下：\n\n```bash\n\
  ls -l | tail +2 | awk '{ printf(\"Name: %-16s  Size: %-5d  Blocks: %-6.2f\\n\",\
  \ $9, $5, $5/512)}'\n```\n```text\nName: acme          Size: 17263  Blocks: 33.72\n\
  Name: report7       Size:  2966  Blocks: 5.79\nName: report8       Size: 34238 \
  \ Blocks: 66.87\n```\n\n现在注意，数字列在右对齐时更容易比较。让我们回到对两个数值字段进行右对齐，并在第二个字段后重新加上逗号，如下：\n\
  \n```bash\nls -l | tail +2 | awk '{ printf(\"Name: %-16s  Size: %5d, Blocks: %6.2f\\\
  n\", $9, $5, $5/512)}'\n```\n```text\nName: acme          Size: 17263, Blocks: \
  \  33.72\nName: report7       Size:  2966, Blocks:    5.79\nName: report8      \
  \ Size: 34238, Blocks:   66.87\n```\n\n是的，现在注意数字列更容易比较了。如果任何一个值都超过了我们指定的长度，完整的值将会被显示，并且其他列将发生偏移，如下：\n\
  \n```bash\nls -l | tail +2 | awk '{ printf(\"Name: %-16s  Size: %5d  Blocks: %-6.2f\\\
  n\", $9, $5, $5/512)}'\n```\n\n\n\n\n\n| Name: acme Size: 17263, Blocks: 33.72 |\n\
  | Name: long-long-long-filename Size: 1993126, Blocks: 3892.82 |\n| Name: report7\
  \ Size: 2966, Blocks: 5.79 |\n| Name: report8 Size: 34238, Blocks: 66.87 |\n\n##\
  \ 按列位置删除字符 (cut)\n\n我们可以使用 UNIX `cut` 命令从文件列表或管道中删除指定的列位置并显示结果。`cut` 的 `-c` 选项允许我们指定一个列位置范围。该命令的思考方式是：我们将从输出中剪出这个范围并将其保留，而丢弃其余部分，如下：\n\
  \n```bash\n$ date Sun Mar 22 17:58:40 PST 1998\n$ date | cut -c5-10\nMar 22\n```\n\
  \n在前面的例中，`-c5-10` 指定我们想要保留第 5 到第 10 列，并丢弃其余部分。我们可以指定多个范围，并用逗号分隔，如下：\n\n```bash\n\
  $ date | cut -c5-10,24-28\nMar 22 1998\n```\n\n在范围中省略结束数字，可以允许该范围延伸到行的末尾，如下：\n\n\
  ```bash\n$ date | cut -c5-10,24-\nMar 22 1998\n```\n\n`cut` 的 `-f` 选项可用于制表符分隔字段时指定字段号，如下：\n\
  \n```bash\n$ cat data2 acme\t1978\t24.6\nsaturn\t1953\t8.3\nwondra\t1981\t16.7\n\
  cut -f1,3 data2\nacme\t24.6\nsaturn\t8.3\nwondra\t16.7\n```\n\n在这个例中，`-f1,3`  `cut`\
  \ 剪出并保留第 1 和第 3 字段。\n\n如果使用制表符以外的字符作为字段分隔符，可以使用 `-d` 选项指定该字段字符，如下：\n\n```bash\n\
  $ cat data3 acme:1978:24.6\nsaturn:1953:8.3\nwondra:1981:16.7\ncut -d: -f1,3 data3\n\
  acme:24.6\nsaturn:8.3\nwondra:16.7\n```\n\n虽然可以将 `-d` 字段分隔符设置为空格，但在大多数情况下这并不可用，因为\
  \ `cut` 不允许将多个空格视为单个字段分隔符。例如：\n\n```bash\n$ cat data4 xxx  yyy   zzz\n$ cut -d'\
  \ ' -f1,3 data4\nxxx yyy\n```\n\n在前面的例中，数据文件中 `xxx` 和 `yyy` 之间有两个空格。`yyy` 和 `zzz`\
  \ 之间有三个空格。因此 `cut` 认为文件 `data4` 具有以下内容：\n\n`field1:xxx field2:empty field3:yyy field4:empty\
  \ field5:empty field6:zzz`\n\n如果你难以理解这一点，可以将空格想象成冒号（`:`），如下：`xxx::yyy:::zzz`。每当两个冒号（实际上是两个空格）连在一起时，它们之间有一个空字段，如下：`xxx::yyy:::zzz`。\n\
  \n我们通常认为一组空格是一个字段。因此，对于显示空白分隔的字段，`awk` 比 `cut` 更有用。例如：\n\n```bash\n$ cat data4 xxx\
  \  yyy   zzz\n$ awk '{print $1,$3}' data4\nxxx zzz\n```\n\n## 从 UNIX 命令中提取字段\n\n\
  如果你想从 UNIX 命令的输出中提取字段，你应该使用 `awk` 按字段号提取，还是使用 `cut` 按列位置提取？许多命令允许通过这两种方法提取字段。以 `ls\
  \ -l` 为例：\n\n```bash\n$ ls -l -rw-r--r--  1 mori     users      2966 Mar 22 15:08\
  \ report7\n```\n\n文件名是输出中大小变化最大的字段，所以幸运的是它是最后一个字段。如果它是第一个字段，长文件名会将所有其他字段移出并改变它们的位置。在\
  \ `/dev` 目录中，`ls -l` 的字段数量发生了变化，如下：\n\n```bash\n$ ls -l /dev | head -5\ntotal 13\n\
  crw-------  1 root  root      134 Jan 20 1997 apm_bios\ncrw-------  1 root  root\
  \       16 Feb 18 1994 arp\ncrw-rw-rw-  1 root  sys        10 Jul 17 1994 atibm\n\
  crw-rw-rw-  1 root  sys        14 Jul 18 1994 audio\n```\n\n\n\n\n在此目录下，文件的第 5 字段没有大小。相反，它们有两个由逗号和空格分隔的值。这使得文件名位于第\
  \ 10 字段，而不是其他目录中的第 9 字段。因此，要编写一个程序从包含 `/dev` 目录的 `ls -l` 输出中提取文件名，使用 `cut` 比使用 `awk`\
  \ 更好。尽管在某些系统上，你可能会遇到非常长的组名或巨大的文件大小，这迫使你调整所使用的列位置。\n\n```\n-rwxr-xr-x   1  root \
  \     bin             2688  Oct 15  1995 arch\n-rwxr-xr-x   1  root      bin   \
  \          61201  Aug  6  1995 ash\n-rw-rw----    1  mori      group           1828\
  \  Mar 19  14:56 Main.dt\n-rw-rw----    1  mori      group             231  Feb\
  \ 19  19:04 Personal.dt\n```\n\n在前面的示例中，你看到了来自两个不同系统的 `ls -l` 输出。前两行来自 Linux 系统。后两行来自\
  \ SCO UNIX。注意，这两个版本的 UNIX 之间 `ls -l` 的列位置是不同的。如果我想写一个程序来从 `ls -l` 中提取文件名，并想让它在 Linux\
  \ 和 SCO UNIX 上都能运行，我将使用 `awk` 来提取第 9 字段（只要程序不需要处理来自 `/dev` 目录的 `ls -l`）。\n\n从 UNIX\
  \ 命令输出的字段中提取信息的程序非常常见。有些会使用 `awk`，有些会使用 `cut`。当字段中的值变得很大或者你想在不同的系统上运行相同的程序时，可能会出现问题。只要你意识到这些问题点，通常可以快速发现问题并通过修改提取代码来解决。例如，你可能需要更改\
  \ `cut` 命令中使用的列位置，或者更改 `awk` 命令中使用的字段。\n\n## 在文件或管道中替换/删除字符 (`tr`)\n\n`tr` 命令允许我们将一个特定字符的所有出现处转换为另一个字符。它还允许我们删除特定字符的所有出现。`tr`\
  \ 不允许在命令行上直接处理文件，因此你必须通过管道将任何数据传递给 `tr` 进行翻译。\n\n### 确定你的 UNIX 系统是哪种类型的 `tr`\n\n\
  遗憾的是，有两个版本的 `tr`。它们的区别在于是否要求在字符范围周围使用方括号 `[]`。某些 UNIX 版本有一种类型的 `tr`；其他版本则是另一种类型的\
  \ `tr`。\n\n以下是不带括号版本的 `tr` 的工作方式：\n```\necho abcdef | tr 'a-c' '1-3'\n123def123\n\
  ```\n在该命令中，`echo` 将字母 `abcdef` 发送给 `tr` 命令。`tr` 查找每个字母。如果找到，它将其转换为第二个列表中对应的字符。如果在第一个列表中没有找到该字符，则将其原样传递到输出。\n\
  \n带括号版本的 `tr` 工作方式相同，但它要求对范围使用方括号，如下：\n```\necho abcdef | tr '[a-c]' '[1-3]'\n123def123\n\
  ```\n以下 UNIX 版本要求 `tr` 使用括号：\n- HP-UX\n- SCO UNIX 3.2\n- Solaris 2.x (SunOS 5.x)\n\
  \n以下 UNIX 版本不需要括号：\n- SCO UNIX 3.5 (OpenServer 5)\n- Linux (Slackware 3.0.0)\n-\
  \ IBM AIX 4.x\n\n这是一个你可以在系统上运行的简单测试，以查看你有哪种类型的 `tr` 命令：\n```\necho abc[] | tr '[a-c]'\
  \ '12345'\n```\n如果 `tr` 需要括号，你将看到此输出：\n```\n123def123\n```\n如果 `tr` 不需要括号，列表中的括号将被视为任何其他字符；因此它将给出此输出：\n\
  ```\n12345\n```\n\n### 将大写转换为小写或反之亦然 (`tr`)\n\n`tr` 最常见的用途之一是将所有大写字母映射（即翻译）为小写字母，如下所示：\n\
  ```\necho ABCdef | tr \"[A-Z]\" \"[a-z]\"\nabcdef\n```\n\n\n\n\n\n# 不要使用 `tr` 来替换字符串\n\
  \n`tr 'wilson' 'smith'` 会将所有的 `ws` 翻译为 `ss`，所有的 `is` 翻译为 `ms`以此此类推。当你想要替换字符串时，请使用\
  \ `sed`，如下：`sed 's/wilson/smith/g'`\n\n即使你的 `tr` 版本不需要括号，也请使用上述示例中的方括号。如果你的版本需要括号，第一个列表中的\
  \ 26 个字符将映射到第二个列表中对应的 26 个元素。如果你的版本不需要括号，第一个列表中的 28 个字符将映射到第二个列表的 28 个字符。在这两种情况下，左括号（`[`）都会作为左括号（`[`）传递，右括号（`]`）也是如此。\n\
  \n我们可以如下所示将小写转换为大写：\n\n```bash\necho ABCdef[] | tr \"[a-z]\" \"[A-Z]\" ABCDEF[]\n\
  ```\n\n## 将每个字符的第八位置零 (`tr`)\n\n文本文件通常每个字符的第八位设置为零。这也被最高位。如果设置为 1，它会将字符的含义变为某些扩展字符集，这可能会导致奇怪符号的出现甚至导致你的终端崩溃。下载文件时，你可能会得到一个无法显示的文件，因为它包含某些第八位开启（即设置为\
  \ 1）的字符。我们可以使用 `tr` 来关闭第八位，如下：\n\n```bash\ntr \"[\\201-\\376]\\377\" \"[\\001-\\\
  176]\\177\" < file1 > file2\n```\n\n`file1` 是某些字符第八位开启的文件。`file2` 将由 `tr` 命令创建，它是\
  \ `file1` 的拷贝，但所有字符的第八位都已关闭。即使你的 `tr` 版本不需要括号，也请使用括号，因为相同的命令在所有 UNIX 系统上都能运行。大多数系统允许我们在范围中包含\
  \ `\\377`，但 SCO UNIX 3.2v 不行。因此，我在上一个命令中在方括号范围之外单独指定了 `\\377`，以便该命令适用于所有类型的 UNIX\
  \ 系统，包括 SCO UNIX 3.2v。\n\n如果你需要开启所有字符的第八位，可以使用类似的命令：\n\n```bash\ntr \"[\\001-\\\
  176]\\177\" \"[\\201-\\376]\\377\" < file1 > file2\n```\n\n## 删除选定的字符 (`tr`)\n\n\
  你可以使用 `-d` 选项配合单个列表从管道中删除选定的字符，如下：\n\n```bash\ntr -d '!@#$%^&*()' < file1 > file2\n\
  ```\n\n该命令从 `file1` 中删除选定的标点符号字符，并将结果保存到 `file2` 中。\n\n如果控制字符出现在数据或文本文件中，可能会导致问题。终端用户在不支持箭头键的应用程序中使用箭头键时，可能会无意输入控制字符。下一个\
  \ `tr` 示例显示了如何删除除制表符和换行符以外的所有控制字符：\n\n```bash\ntr -d '[\\001-\\010][\\013-\\037]\\\
  177' < file1 > file2\n```\n\n上述命令应用于 `tr` 需要括号的系统。如果在另一种类型的系统上使用，它还会删除输出中我们需要的括号。对于不需要括号的系统，这里是删除除制表符和换行符以外的所有控制字符的相同命令：\n\
  \n```bash\ntr -d '\\001-\\010\\013-\\037\\177' < file1 > file2\n```\n\n## 将大多数控制字符翻译为一个错误字符\
  \ (`tr`)\n\n与其删除所有控制字符，你可能想将它们翻译为某些字符，作为内容已修改修改的错误指示。使用 `[X]` 作为第二个字符串，将第一个列表中的所有字符翻译为字符\
  \ `X`，如下：\n\n```bash\ntr '[\\001-\\010][\\013-\\037]\\177' '[^*]' < file1 > file2\n\
  ```\n\n上述命令将除制表符和换行符以外的所有控制字符翻译为脱号（`^`）。如果你的系统不需要括号，请使用这种形式的 `tr` 命令：\n\n```bash\n\
  tr '\\001-\\010\\013-\\037\\177' '[^*]' < file1 > file2\n```\n\n注意，即使在范围不使用括号的第二种情况下，`[^*]`\
  \ 周围也是需要括号的。\n\n## 替换/删除整行\n\n有几种方法可以替换或删除整行。\n\n\n\n\n\n# 替换整行 (sed)\n\n要完全替换包含特定模式的任意行，你可以如下使用\
  \ `sed` 命令：\n\n```bash\nsed 's/.*acme.*/  ***canceled***  /'\n```\n\n`acme` 代表要查找的模式。你可以将其替换为任何所需的正则表达式（R.E.）。\n\
  \n`.*acme.*` 匹配包含 `acme` 的整行，因此整行都将被替换。\n\n# 删除包含 R.E. 模式的行 (grep)\n\n要完全删除任何包含模式的行，对\
  \ `grep` 使用 `-v` 选项，如下：\n\n```bash\ngrep -v 'R.E.'\n```\n\n`grep` 的 `-v` 选项会反转 `grep`\
  \ 的含义。`grep` 不再显示包含模式的行，而是只显示不包含模式的行，从而从输出中移除任何包含模式的行。\n\n另另：有关 `grep` 命令的更多信息，请参阅第\
  \ 30 页。\n\n# 删除行 (uniq)\n\n使用 `uniq` 命令从输出中删除任何与前一行完全匹配的行。假设我们有一个名为 `cars` 的文件，其中包含不同品牌的汽车，如下所示：\n\
  \n```bash\n$ cat cars\nford\npontiac\nBMW\nford\npontiac\n```\n\n这是对该文件执行 `uniq`\
  \ 命令的输出：\n\n```bash\n$ uniq cars\nford\npontiac\nBMW\n```\n\n在前面的文件中，只有第 2 行与前一行匹配，因此它被删除了。你可以看到该文件中还有其他匹配的行，但\
  \ `uniq` 没有删除它们，因为它们并不相邻。注意，`sort` 命令会将相同的行并置相邻，如下所示：\n\n```bash\n$ sort cars\n\
  BMW\nford\nford\npontiac\npontiac\n$ sort cars | uniq\nBMW\nford\npontiac\n```\n\
  \n在这个示例中，我们通过先对行进行排序让 `uniq` 运行得更高效。我们可以通过将上一个命令的输出通过到 `wc -l` 来统计行数，从而计算文件中不同汽车的数量，如下所示：\n\
  \n```bash\n$ sort cars | uniq | wc -l 3\n```\n\n`uniq` 的 `-u` 选项仅显示唯一的行——即没有相邻匹配行的行。例如：\n\
  \n```bash\n$ sort cars | uniq -u\nBMW\n```\n\n`-d` 选项仅显示重复的行，如下：\n\n```bash\n$ sort\
  \ cars | uniq -d\nford\npontiac\n```\n\n`-c` 选项统计每行重复的次数，如下：\n\n```bash\n$ sort\
  \ cars | uniq -c\n1 BMW\n3 ford\n2 pontiac\n```\n\n另另：有关 `sort` 命令的更多信息，请参阅第 202\
  \ 页。\n\n# 第 17 章 使用 vi 编辑文本文件\n\nSteve Moritsugu\n\n## 开始使用 vi 文本编辑器\n\n## 学会 10\
  \ 个命令，你就可以编辑一切\n\n### 接下来需要学习的八条命令\n### 插入文本的所有方法\n### 在文档中移动的所有方法\n### 删除文本的所有方法\n\
  ### 修改文本的所有方法\n\n## 介绍 vi 文本编辑器\n\n\n\n\n\n文本编辑器允许你创建和修改文本文档，这些文档仅包含你可以在键盘上输入的字母和字符。相比之下，文字处理器不仅允许编辑文本，还允许通过选择字体大小和样式来更改文本的呈现。在\
  \ UNIX 下，简单的文本文件极其重要。除少数例外外，所有的 UNIX 系统管理工作最终都是通过编辑自定义系统并控制其运行的文本文件完成的 Shell 脚本和\
  \ C 程序是由程序员以文本文件的形式输入的。即使是 Internet Web 页面也是简单的文本文件，其字体、颜色和图形都是作为文本指令指示 Web 浏览器的。\n\
  \n`vi` 是所有 UNIX 系统上都可用的文本编辑器。不要在 `vi` 中寻找字体选择，因为它不是文字处理器。有些 UNIX 用户不喜欢 `vi`，因为你必须记住所有的命令。它没有下拉菜单来帮助你剪切、粘贴或替换文本。`vi`\
  \ 内部没有帮助功能（但我将教你如何解决这个问题）。\n\n某些类型的 UNIX 系统提供了 `vi` 的替代方案，例如 `emacs`、`pico` 或适用于\
  \ UNIX 的 `WordPerfect`。有些用户在 Windows 下编辑文本，然后将其下载到 UNIX。如果你只在一个 UNIX 系统上工作，并且能保证永远不需要在不同的系统上工作，请选择系统上可用的任何文本编辑器。然而，如果你处理多种类型的商业\
  \ UNIX 系统，你可能会发现将你喜欢的编辑器移植到每个系统中是一场徒劳的战斗。在这种情况下，请跟随我学习这一关于 `vi` 的章节，我将让你轻松学会基础知识。`vi`\
  \ 就像 UNIX：入门很难，但一旦你开始，就可以做一些强大的事情，这一切都是值得的。\n\n## 如何开始 vi\n\n## 如何启动和结束 vi\n\n1.\
  \ 在 shell 提示符处，输入 `vi`。（不要按回车。）\n2. 输入一个空格，然后输入你要编辑的文件名。（不要按回车。）如果文件尚不存在，`vi` 将为你创建它。如果文件在另一个目录中，请输入其\
  \ `pathname`。如果你只想练习 `vi`，请看以下内容。高级用户可以在此阶段省略文件名；这允许你进入 `vi`，但你必须记住在退出 `vi` 之前保存你的工作。\n\
  3. 按回车键。`vi` 将启动并显示你的文件内容。由于 `vi` 是全屏编辑器，它会在超出文件末尾的行开头放置波浪号 (`~`)）。如果你正在编辑一个新文件，屏幕上的所有行都会以波浪号开头，直到向这些行中插入文本。\n\
  4. 注意，你所有的更改都在工作区中进行，而不是在文件本身。如果你在退出 `vi` 之前没有保存工作，所有的编辑将丢失。\n5. 完成编辑后，按 `Esc` 然后输入以下内容：\n\
  ```\n:wq (保存工作并退出 vi)，或者输入：\n:q! (放弃[即，丢弃]你的更改并退出 vi)\n```\n按回车键完成此步骤。\n\n## 创建用于\
  \ vi 练习的文件\n\n如果你是 UNIX 的初学者，你可能还没有任何可以安全编辑的文件；因此，请按照此程序创建一个临时文件，可以用它来练习 `vi`。\n\
  \n### 如何使用 vi vi\n\n1. 登录 UNIX。\n2. 在 shell 提示符处，输入 `> cal-junk`。按回车键执行此行。在任何仅用于练习且以后可以删除的文件名中使用\
  \ `junk` 单词。此步骤将创建一个你可以编辑的文本文件。\n3. 当你想练习 `vi` 时，在 shell 提示符处，输入 `vi-junk`。按回车键执行此行。\n\
  4. 完成 `vi` 练习后，按 `Esc` 然后输入以下内容：\n```\n:wq (保存工作并退出 vi) 或 :q! (放弃[即，丢弃]你的更改并退出 vi)\n\
  ```\n按回键完成此步骤。要删除此练习文件，输入以下内容：\n```\nrm cal-junk\n```\n按回车键执行此行。完成工作后清理现场是良好的习惯，但在练习\
  \ `vi` 期间，你可以延迟几天几周删除此文件。\n\n## 仅需 10 条 vi 命令即可编辑任何内容\n\n\n\n\n\nvi 中有超过 75 个独立的字母和标点命令需要学习。你应该从哪里开始呢？这里有需要学习的前\
  \ 10 个 vi 命令，它们将让你能够编辑任何内容。如果你是 vi 初手，请按照前面的步骤创建一个 `cal-junk` 练习文件，以免意外修改重要文件。\n\
  \n## 使用 h, j, k, l 移动\n\n在 vi 中，你可以通过输入表 17.1 所示的命令来移动光标。\n\n永远不要在 `/etc/passwd`\
  \ 上练习。这是一个关键的系统文件，你不应该动它，特别是当你以 root 登录时。实际上，不要对 `/etc` 中的任何文件进行练习。不要以 root 身份进行练习。\n\
  \n### 表 17.1 使用 h, j, k, l 移动\n\n| vi 命令 | 说明 | 助记 | 备用键 |\n|---|---|---|---|\n\
  | h | 向左移动 | 最左侧字符 | 左箭头键 |\n| j | 向下移动 | j 到行下方 | 下箭头键 |\n| k | 向上移动 | k 循环向上 |\
  \ 上箭头键 |\n| l | 向右移动 | 最右侧字符 | 右箭头键 |\n\n这四个键 `h`, `j`, `k`, `l` 在键盘上彼此相邻。表中的助记方法将帮助你记住每个键的作用。例如，小写的\
  \ `j` 位于行下方，提醒你它是“向下”（down）。\n\n不要过度依赖箭头键作为备用。有时你会发现 vi 中除了箭头键外，所有功能都能正常工作，因为箭头键需要终端设置、键盘以及某些系统文件（如\
  \ `termcap` 或 `termin`）之间的良好协调。即使箭头键在大多数情况下都能用，在连接缓慢或负载过重的系统或网络上，它们也可能变得不可靠。学习使用\
  \ `h`、`j`、`k` 和 `l` 而不是箭头键，也将有助于你以后进行键映射以及在 Korn shell 中进行命令行编辑（这是一个非常有用的功能）。\n\n\
  当你在 vi 中输入 `h`、`j`、`k` 或 `l` 时，屏幕不应该回显这些字符。相反，光标应该向所需的方向移动。你不需要按 `Enter` 来执行命令。如果\
  \ `h`、`j`、`k` 或 `l` 出现在屏幕上，说明你某种方式进入了插入模式并将这些字符插入了工作区。按 `Esc` 退出插入模式；`h`、`j`、`k`、`l`\
  \ 就能正常工作了。\n\n注意大写锁定下的 `J` 键。如果你不小心开启了大写锁定，使用 `h`、`k` 或 `l` 移动是无害的。但 `j` 是向下，而 `J`\
  \ 是合并行。多个 `J` 会合并许多行，在你还没反应过来之前就已经成了一团糟。在下一章关于映射的内容，我将展示一种防止这种情况的方法。\n\n除非工作区的该位置有文本，否则\
  \ vi 不允许你移动到那里。你不能越过行尾。你不能从最后一行向下。如果你编辑一个空文件，在输入某些文本之前，你将无法移动。\n\n另另：有关命令行编辑的更多信息，请参阅第\
  \ 497 页\n\n错误蜂鸣声\n\n如果你尝试在 vi 中执行非法命令（例如从最后一行向下移动），vi 会发出蜂鸣以指示错误。可以关闭此功能（`:set noerrorbells`），但\
  \ vi 初学者应该留意错误蜂鸣声并从这些错误中学习。\n\n使用重复计数\n\n你可以直接在大多数 vi 命令之前加上一个重复计数。`50h` 将向左移动 50\
  \ 个字符。`999j` 将向下移动 999 行。有了重复计数，很容易向上或向下移动很距离，这在巨大的文件中是必要的。如果给定的光标移动重复计数太大，结果将取决于你所使用的哪种\
  \ UNIX。如果 vi 发出蜂鸣，光标将不会移动。如果没有蜂鸣，vi 已将你移动尽可能远并停止在工作区的最后一个字符或行。\n\n使用 i 插入\n\n这是要学习的第五个\
  \ vi 命令。输入 `i` 进入插入模式。在插入模式下，你输入的所有文本都会在当前光标位置输入到工作区。按 `Esc` 关闭插入模式；这会让你回到 vi 命令模式。你可以在每行后按\
  \ `Enter` 在一次插入中输入多行。\n\n使用 x 和 dd 删除\n\n\n\n\n## vi 命令概述\n\n这是要学习的第六个 vi 命令。输入\
  \ `x` 可以删除光标所在位置的一个字符。`25x` 将删除 25 个字符。vi 会减小任何大于行剩余部分的重复计数，以便只删除当前行的剩余部分，而不会影响后续行。\n\
  \n**提示：** 注意插入模式（Insert mode）下的箭头键。如果你在插入模式下尝试使用箭头键，在某些系统上可能无法产生你预期的更改。在移动光标之前，请按\
  \ `Esc` 退出插入模式。然后将光标移动到下一个区域并输入 `i` 重新进入插入模式。\n\n这是要学习的第七个 vi 命令。输入 `dd` 删除当前行。在输入\
  \ `dd` 时，你可以处于行的任何位置。`25dd` 将删除 25 行，包括当前行在内的所有行。\n\n### `dd` 的名字是怎么来的？\n\nvi 有有一种约定，双字母命令作用于整行。`cc`\
  \ 更改整行；`yy` 复制（yank）整行；而 `dd` 删除整行。\n\n### 使用 `J` 合并行\n\n与某些编辑器不同，vi 没有可以通过删除来合并两行的行尾字符。合并两行的唯一方法是使用\
  \ `J` 命令。`5J` 将合并 5 行。`J` 和 `2J` 的作用相同：它们都会合并行。第二行开头的任何空格都会缩减为单个空格。\n\n### 使用 `:wq`\
  \ 保存并退出\n\n到目前为止，你所有的更改都修改了 vi 工作区，这是一个临时文件。要保存工作并退出，请输入以下内容：`:wq`。冒号会让光标移动到最后一行，`w`\
  \ 和 `q` 会显示在屏幕上。按回车完成此命令以及任何其他以冒号（:）开头的 vi 命令。\n\n### 使用 `:q!` 放弃更改\n\n这是要学习的第十\
  \ vi 命令。如果你不喜欢你的更改，可以通过输入 `:q!` 在不保存回原始文件的情况下退出 vi。这将让你回到 shell 提示符并丢弃你所做的所有编辑。请注意，通过\
  \ `:q!` 丢弃编辑更改后，你以后无法改变主意并找回它们。\n\n**提示：** 使用退格键（backspaces）取消冒号（:）命令。如果你输入了类似 `:q!`\
  \ 的命令，然后改变了主意，**不要**按 `Esc`，因为这将执行 `:q!` 命令并丢弃所有更改。要取消冒号命令，请反复按退格键或 `Ctrl+H` 直到光标离开最后一行。左箭头键无法实现此功能。这就完成了使用\
  \ vi 需要的 10 个命令。你现在可以编辑任何内容了。练习这 10 个命令一段时间。然后阅读本章的后续章节，查看你应该掌握的下一组 vi 命令。\n\n##\
  \ 为 vi 添加帮助功能\n\nvi 内部没有帮助功能，这使得如果你偶尔使用它，它会变得很难用。这里是在你在 vi 中添加一个帮助功能的方法。\n\n1. 使用\
  \ vi 创建一个文本文件 `/tmp/vihelp`，内容如下：\n\n```echo \"(You may put repeat count BEFORE\
  \ most commands.)\"\n:q!--abort vi without saving\ncW--change word(s) until ESC\n\
  x dd--delete char(s) or line(s)\nG--go to end of file\n1G--go to line of file\n\
  i--insert text until ESC\nA--insert at end of line until ESC\nJ--join lines\nh,j,k,l--move\
  \ left,down,up,right\nCtrl+L Ctrl+R--repaint the screen\nr--replace one char\n:wq--save\
  \ and exit\n:f--show filename, current line, size\nu--undo\n```\n\n2. 确保你在第一行和最后行包含了引号（''）。\n\
  3. 以 root 身份登录或要求你的系统管理员执行后续操作。\n\n\n\n\n4. 输入 `ls -l /usr/bin/vihelp`。\n\n我们希望看到\
  \ `No such file.` 消息。\n\n如果此文件已经存在，请**不要**继续此操作。\n\n5. 输入以下命令：\n\n```bash\ncd /usr/bin\
  \ mv /tmp/vihelp vihelp\nchmod 755 vihelp\n```\n\n6. 现在退出并以非 root 用户身份重新登录。\n\n\
  7. 输入 `vi` 编辑任意测试文件，并通过输入以下内容来检查新的帮助功能：\n\n```vi\n!:vihelp\n```\n\n8. 当你阅读完帮助信息并准备恢复\
  \ `vi` 编辑时，按下 Enter 键。\n\n9. 你可以根据需要使用 `vi` 来扩展文件 `/usr/bin/vihelp` 中的帮助信息。请确保最后的引号出现在最后行的末尾。\n\
  \n# 接下来学习这八个 `vi` 命令\n\n## 按 `Ctrl+L` `Ctrl+R` 重绘屏幕\n有时在通过调制解调器线路或慢网络时，屏幕上可能会出现乱码，或者光标最终停留在与\
  \ `vi` 认为的位置不同的行。如果光标在错误的行上，当你向右移动空格时，你会看到来自其他行的字符出现。为了解决这个问题，按下这两个字符 `Ctrl+L` `Ctrl+R`\
  \ 来重绘屏幕以匹配工作区状态。某些终端只需要 `Ctrl+R` 或只需要 `Ctrl+L` 即可重绘屏幕。如果你同时使用两者（无论顺序如何），它适用于所有情况！\n\
  \n## 使用 `u` 撤销更改\n`vi` 会记住最后一次的插入、删除或修改。如果你想撤销它，请在 vi 命令模式下输入 `u` 命令。执行 `u` 命令时，你不需要位于更改所在的行附近。移动光标的命令会被\
  \ `u` 命令忽略且无法被撤销（实际上，光标移动命令可以通过输入 `` ` `` 来撤销）。第二次 `u` 命令将撤销撤销操作，再次恢复上一次更改。第三次 `u`\
  \ 命令将切换撤销状态并移除上一次更改。第四次 `u` 命令将再次恢复上一次更改，以此此类推。如果你使用 `5J` 命令合并了五行，执行 `u` 命令会将它们拆分成原始的行。第二次\
  \ `u` 将再次将它们合并。你可以观察行在每次输入 `u` 命令时神奇地合并然后又分离。这是学习更多 `vi` 命令的极佳方法。\n\n## 出错时使用 `u`\
  \ 命令\n1. 有时，意外的控制字符或行噪声会导致 vi 屏幕上出现乱码。按下 `Ctrl+L` `Ctrl+R` 重绘当前屏幕并清除乱码。\n2. 输入 `u`\
  \ 命令撤销上一次更改。光标将移动到该更改的位置。\n3. 多次输入 `u` 以观察更改的切换。如果该更改是意外导致的不良副作用，请再输入一或两次 `u` 来撤销该错误的更改。\n\
  \n## 在行尾追加文本\n`A` 命令将光标移动到行末尾。然后它允许你从该字符之后开始插入。按下 `Esc` 退出模式。\n\n## 定期保存你的工作\n如果你在会话中进行了大量更改，定期保存工作是明智的。输入\
  \ `:w`。这样，如果你不小心按错了按键或系统崩溃，你可以重新登录，磁盘文件将包含已保存的内容。\n\n## 保存到不同的文件\n你可以通过输入以下内容将工作保存到与正在编辑的不同的文件中：\n\
  \n```vi\n:w newfile\n```\n例如，如果我正在编辑关键文档，我可能会输入：\n\n```vi\n:w doc1\n```\n在更多编辑之后，我可能会输入：\n\
  \n```vi\n:w doc2\n```\n\n\n\n\n# 处理写入权限失败\n\n当尝试保存工作时，`vi` 可能会返回类似 `Permission Denied`（拒绝访问）或\
  \ `Read Only`（只读）的错误。\n\n## 在 `vi` 中处理保存文件的错误\n\n1. 尝试使用此命令保存文件：\n```bash\n:w!\n\
  ``````\n2. 如果失败，按如下方式临时保存工作：\n```bash\n:w /tmp/cantwrite :q\n``````\n3. 现在，你可以将\
  \ `/tmp/cantwrite` 中的更改移动到目标的文件名或目录。\n\n## 使用 `r` 替换单个字符\n\n输入 `r` 替换一个字符。输入的下一个字符将显示在屏幕上，替换光标位置的字符。然后你将回到命令模式，准备好输入新的\
  \ `vi` 命令。\n\n## 使用 `cW` 修改单词\n\n使用 `cW` 修改单词\n\n1. 将光标移动到要更改的单词或多个单词的开头。\n2. 如果你想更改多个单词，输入要更改的单词数量。不要按回车键。\n\
  3. 输入 `cW`。美元符号 (`$`) 将出现在最后一个更改单词的末尾。不要按回车键。\n4. 开始输入替换文本。它可以比被更改的单词短，也可以长。它的单词可以更少或更多。你可以使用回车键输入多行。如果新文本较长，随着你的输入，行的剩余部分将向右移动。\n\
  5. 输入所有替换文本后按 `Esc`。如果新文本比被替换的单词短，行的剩余部分将自动向左移动以填充空格。\n6. 这是一个示例命令：\n```bash\n3cWacmeESC\n\
  ```\n上述命令将更改（替换）三个单词（包括光标所在的单词）。它会将这三个单词替换为单个单词 `acme`。\n\n## 使用 `1G/G` 跳转到文件开头/结尾\n\
  \n输入数字然后按大写 `G` 跳到该行，例如 `1475G` 将将光标移动到工作区的第 1475 行。如果文件没有那么多行，它会发出错误提示。对于 C 语言程序员来说，快速跳转到文件中的特定行非常有用，因为编译器通常会报告发生错误的源代码行号。`G`\
  \ 命令的两个常用用途是 `1G` 跳到文件开头和 `G` 跳到文件结尾。\n\n## 使用 `:f` 查看文件名、大小和当前位置\n\n输入 `:f` 查看你正在编辑的文件名、当前所在的行以及文件的总行数。例如：`\"\
  Modified line 43 of 35\"`\n\n## 帮助你使用 `vi` 的技巧\n\n这里是需要学习的第三组 `vi` 命令。\n\n### 使用\
  \ `U` 恢复整行\n\n在 `vi` 命令模式下，大写 `U` 将撤销自你移动到该行以来的所有更改。离开该行后，你将失去将其恢复到原始状态的能力。\n\n\
  ## 使用 spell 查找拼写错误的单词\n\n标准 UNIX 仅具有基本的拼写检查功能。以下步骤演示了如何使用它。\n\n### 如何查找拼写错误的单词\n\
  \n1. 从 shell 提示符输入：\n```bash\nspell < filename\n```\n（filename 是要拼写检查的文件。）将 `pg`\
  \ 替换为你喜的工具，以便逐页查看结果。\n2. 所有未知单词将显示在屏幕上，每行一个。不会显示拼写错误单词所在的上下文（即完整行）。\n3. 在脑中标记任何拼写错误的单词，然后手动使用\
  \ `vi` 在文件中一个一个查找并纠正它们。\n\n\n\n\n\n# 段落格式化\n\n如果你正在使用标准的英文段落，vi 的令人沮丧的限制之一就是当你需要延长或缩短段落内部某一行时。长度不正常的行在段落中间看起来非常不协调。你可以通过将文本移动到下一行或从下一行拉取文本来修复该异常行；但现在下一行又变成了长度不正常。你随后必须手动调整每一行直到段落末尾。\n\
  \n这里是处理这种情况的两种更简单的方法。\n\n## 如何使用 Fmt 格式化段落\n\n1. 在 shell 提示符下，输入以下内容：\n```\nfmt\n\
  ```\n如果 get 错误 `Not found`，说明你的 UNIX 版本不支持 `fmt`。如果未找到 `fmt`，请跳过此步骤并使用以下步骤进行格式化。SCO\
  \ UNIX OpenServer 5 不提供 `fmt`，但在 Solaris 2.x、AIX 4.x 和 Linux 上可用。\n\n2. 在 vi 中格式化段落，将光标移动到段落开头。输入以下内容：\n\
  ```\n!fmt\n```\n这应该调整段落中其余行，使得没有行太长或太短。如果这不起作用，输入 `u` 撤销该更改，并改用下一个步骤。\n\n3. `fmt`\
  \ 命令假设段落的左边距是正确的。如果左边距也需要调整，输入：\n```\n!fmt-c\n```\n\n如果你的系统上没有 `fmt` 且行中没有制表符，以下是一个效果良好的段落格式化步骤。如何格式化段落：\n\
  \n1. 输入 `cd` 进入主目录。\n2. 输入 `cp .exrc .exrcbak` 备份你当前的 `.exrc` 文件。如果 `.exrc` 不存在，请忽略任何\
  \ `cp` 错误（在这种情况下，不需要备份）。\n3. 输入 `vi .exrc`。\n4. 查看此文件的完整内容，并确保没有哪行以 `map` 开头。如果有这样的行，请**不要**继续此操作。\n\
  5. 确保有一行以 `set wrapmargin=` 或 `set wm=` 开头。如果你没有找到这样的行，请在文件末尾输入此行：\n```\nset wm=10\n\
  ```\n6. 按 `Esc` 然后按 `Q`。光标将跳到最后一行并出现冒号。\n7. 输入 `map g072lBi`。不要按回车。\n8. 按 `Ctrl+M`。按\
  \ `Esc`。按 `Ctrl+V`。按 `Esc`。现在按回车。\n9. 输入 `vi`。屏幕底部应该应回显 `vi` 单词。按回车。\n10. 输入 `:wq`\
  \ 将你的更改保存到 `.exrc` 并退出 `vi`。\n11. 输入 `cat -v .exrc` 检查一切是否顺利。在文件末尾，你应该看到这一行：\n`map\
  \ g072lBi^M^[`\n如果出现错误，请使用 `vi` own 正该行。如有必要，从备份恢复 `.exrc` 并重新开始。\n12. 上述步骤准备了 `.exrc`\
  \ 文件，每个登录用户仅需执行一次。现在使用 `vi` 编辑一个包含需要格式化段落的测试文件。确保文件已备份，以防出现问题。将光标移动到需要格式化的段落开头。\n\
  13. 数一下段落中的行数。输入该数字后跟 `J`，将段落中的所有行合并为一条长行。\n14. 重复输入 `g` 直到段落的所有行都已格式化。\n\n## 恢复丢失的编辑\n\
  \n\n\n\n\n在 shell 提示符中输入 `vi -r`。\n\n1. 你将看到一个文件列表，这些文件是 `vi` 在编辑它们时异常终止而保留的。这些实际上是\
  \ `vi` 工作区文件，它们可能包含某些尚未保存到磁盘文件的编辑。\n\n2. 如果你看到了想要查看的文件，输入以下内容：\n```\nvi -r filename\n\
  ```\n文件名必须与列表中显示的完全一致，即按照显示的内容精确输入任何前置的目录名称。\n\n3. 使用 `vi` 查看文本后，如果你决定保留这些信息，请输入：\n\
  ```\n:w absfile\n```\n`absfile` 代表你想要保存为该文件的文件的完整路径。\n\n4. 按照以下方式退出 `vi`：\n```\n\
  :q\n```\n\n5. 在你通过这种方式恢复文件并退出 `vi` 后，该文件将从保留列表中移除，你将无法再次尝试恢复它。定期检查你的保留文件并进行恢复、保存或丢弃是一个好习惯，以防止\
  \ `vi` 保存文件在保留区域堆积。\n\n# 以只读模式启动 vi\n\n若要在只读模式下编辑文件，请在命令行中将 `vi` 替换为 `view`。`view`\
  \ 以只读模式启动。如果你尝试写入文件，`view` 将报错提示该文件是只读的。对于那些只想查看内容而不打算进行更改的情况，这是一种很好的预防措施。我特别建议\
  \ root（即系统管理员）用户在仅查看配置文件时使用 `view`。你可以如下所示覆盖只读模式并保存更改：\n```\n:w!\n```\n\n# vi 插入命令表\n\
  \n| 命令 | 描述 |\n| :--- | :--- |\n| `i` | 在光标前插入文本，直到按下 `Esc` |\n| `I` | 在行首插入文本，直到按下\
  \ `Esc` |\n| `a` | 在光标后插入文本，直到按下 `Esc` |\n| `A` | 在行尾插入文本，直到按下 `Esc` |\n| `o` |\
  \ 在当前上方打开新行并插入，直到按下 `Esc` |\n| `O` | 在当前下方打开新行并插入，直到按下 `Esc` |\n\n# 在 vi 中移动\n\n\
  `vi` 中的许多光标命令允许我们移动到屏幕的不同部分或我们正在编辑的文件。首先，我们需要介绍如何计算单词，这对于移动、删除和替换非常有用。\n\n## 使用分离单词、包含单词与非单词的区别\n\
  \n分离单词（或定界单词）是指任何由一个或多个空格、制表符或行尾分隔的字符组。包含单词是指任何由标点符号、空格或行尾分隔的字母或数字组。`Hudson-on-the-Bay`\
  \ 是一个分离单词，但四个包含单词。每个双连字符（--）都是一个非单词。因此，`Hudson-on-the-Bay` 包含了包含单词和非单词。下表显示 `w`\
  \ 命令允许我们按包含单词和非单词向前移动。下一章将展示分离单词与包含单词的有用之处。\n\n# vi 移动命令表\n\n| 命令 | 描述 |\n| :---\
  \ | :--- |\n| `hjkl` | 向左/下/上/右移动 |\n| `0` | 移动到当前行首 |\n| `^` | 移动到当前行第一个单词的开头 |\n\
  | `$` | 移动到当前行的最后一个字符 |\n| `wb` | 向前/后移动一个包含单词或非单词 |\n| `WB` | 向前/后移动一个分离单词 |\n\
  | `eE` | 移动到当前包含/分离单词的末尾 |\n| `LMH` | 移动到屏幕上最低/中间/最高的行 |\n| `{}` | 移动到上一个/下一个段落的开头\
  \ |\n| `Ctrl+FC+B` | 向前/后移动一整屏 |\n| `Ctrl+DC+U` | 向下向上移动半屏 |\n| `nG` | 跳到第 `n` 行\
  \ |\n| `1GG` | 跳到第一/最后一行 |\n\n# 通过搜索字符串移动\n\n将光标移动到特定模式\n\n1. 在 `vi` 命令模式下，输入 `/`\
  \ 在工作区内向前搜索。输入 `?` 在工作区内向后搜索。光标将移动到屏幕的最后一行并显示 `/` 或 `?`。在接到指示前不要按回车键。\n\n\n\n\n\
  2. 输入要搜索的模式。按回车键执行。光标将移动到该模式的下一次出现处。你的模式可能包含第 15 章中描述的正则表达式通配符模式。\n3. 如果在文件的剩余部分没有找到该模式，`vi`\
  \ 将绕回并从文件的另一端开始搜索。如果 `vi` 必须绕回，通常会显示此消息：`Wrapped`。如果模式在整个文件中任何处都不，光标将留在原处，并显示此消息：`Not\
  \ found`。\n4. 要重复上一次搜索，输入 `n`。这将找到相同模式的下一次出现处。\n5. 要反反方向重复上一次搜索，输入 `N`。如果你之前是在文件中正向搜索，`N`\
  \ 将在文件中反向查找下一个出现处。\n\n## 在行内移动到特定字符\n\n如果你通过互联网登录到 UNIX 系统，可能会发现对 `vi` 按键的响应有几乎让人无法忍受的延迟。与其计算移动多少个字符或单词，当我需要通过一个命令向右移动到目标字符时，我经常使用\
  \ `vif` 命令。\n\n### 在行内移动到特定字符\n\n1. 确定我想移动到的字母或数字。我通常避开元音，因为它们在行中太常见。\n2. 输入 `f`\
  \ 后跟所需的字母或数字。\n3. 光标将移动到该字符的下一次出现处。\n4. 输入 `;` 移动到该字符的下一次出现处。\n\n### 寻找匹配的括号符号\n\
  \n如果你是程序员，可能需要使用嵌套的括号符号（如 `( { ] )` 输入复杂的公式。例如：\n```\nprintf(\"%d\", ...)\n```\n\
  `vi` 理解这种嵌套，可以自动找到匹配的闭合或开启括号、中括号和大，即使它们在不同的行。将光标放在所需的括号符号上并按下 `%`，即可移动到该嵌套层级的匹配括号符号上。\n\
  \n## 设置标记以便返回那里\n\n`vi` 为处理巨大的文本文件提供了极大的便利。`vi` 可以标记并返回到文件中多达 26 个不同的位置。\n\n###\
  \ 设置标记并返回标记处\n\n1. 将光标移动到文件中的目标位置并输入 `ma`。`m` 是标记此处的 `vi` 命令，`a` 是我们稍后引用此处的名称或标签。我们可以使用字母表中的任何字母；因此我们可以设置最多\
  \ 26 个标记。\n2. 要稍后返回该处，输入：`'a` 或 `` `a``。\n3. 单引号 (`'`) `a` (`'a'`) 表示跳转到包含标记 `a`\
  \ 的行开头。\n4. 反引号（`` ` ``）表示跳转到设置标记时所在的精确字符。\n\n## 删除文本的 vi 命令\n\n在下表中，请注意 `vi` 删除命令是如何基于光标移动的。你可以在大多数这些命令前加上重复计数。\n\
  \n| vi 命令 | 描述 |\n| :--- | :--- |\n| `dd` | 删除字符(s)/整行 |\n| `D` | 从光标删除到行尾 |\n|\
  \ `dwW` | 向前删除到下一个包含的/分隔的单词 |\n| `dB` | 向后删除到下一个包含的/分隔的单词 |\n| `dE` | 删除到包含的/分隔的单词末尾\
  \ |\n| `d0$` | 删除到当前行的开头/结尾 |\n| `dh` | 删除左侧/右侧字符 |\n| `d{}` | 删除到上一个/下一个段落的开头 |\n\
  | `d'a` | 删除到包含标记 `a` 的行开头 |\n| `d``` | 删除到包含标记 `a` 的精确字符 |\n\n## 恢复被删除的文本\n\n`vi`\
  \ 会将之前的删除操作自动存在编号缓冲区中。如果你删错了，只要意识到得快，就可以将其找回。注意，许多 UNIX 系统只保存通过 `d` 命令删除的文本，而不是\
  \ `x` 命令。\n\n### 从编号缓冲区恢复被删除的文本\n\n1. 将光标移动到某些空行，你可以很容易看到任何可能恢复的文本。\n2. 输入 `1p`。最近删除的文本将插入到光标处。\n\
  \n\n\n\n3. 如果这不是你想要的内容，输入 `u` 撤销插入并移除不需要的文本。\n4. 输入一个点（`.`）。这将插入上一次最近删除的文本。\n5.\
  \ 如果这不是你想要的内容，输入 `u` 撤销插入并移除不需要的文本。\n6. 继续输入这两个字符：点（`.`）和 `u`。\n\n这允许你查看所有九个编号的删除缓冲区（delete\
  \ buffers），以检查所需的文本是否可以恢复。\n\n# 用于更改文本的 `vi` 命令表\n\n下表显示了 `c` 命令将更改多少文本。待更改区域的末尾会显示一个美元符号（`$`）。输入新的替换文本，完成后按\
  \ `Esc` 键。行中剩余文本将根据需要向左或向右移动。\n\n如果显示待更改区域末尾的美元符号不在你的预期位置，请按 `Esc`，整个区域将消失。然后立即按\
  \ `u`，该行将恢复到原始文本。\n\n在下表中，请注意 `vi` 更改命令是基于光标移动命令的。\n\n你可以在大多数这些命令之前加上一个重复次数。\n\n\
  ### 表 17.5 用于更改文本的 `vi` 命令表\n\n| `vi` 命令 |  |\n| :--- | :--- |\n| `cc` | 更改整行 |\n\
  | `C` | 从光标处更改到行尾 |\n| `cwcW` |向前更改到下一个包含/分离的单词 |\n| `cbcB` | 向后更改到上一个包含/分离的单词 |\n\
  | `ceE` | 更改到包含/分离单词的结尾 |\n| `c0$` | 更改到当前行的开头/结尾 |\n| `chl` | 向左/右更改字符 |\n| `c{}`\
  \ | 更改到上/下一个段落的开头 |\n| `c'a` | 更改到包含标记 `a` 的行的开头 |\n| `c`a` | 更改到包含标记 `a` 的精确字符\
  \ |\n\n### 替换文本\n输入 `r` 替换一个字符。输入新字符。`vi` 将准备接受新命令。不要按 `Esc`。输入 `R` 进入替换模式（Replacement\
  \ mode）。现在你输入的任何内容都将替换当前文本。按 `Esc` 结束此模式。\n\n# 第 18 章让 vi 编辑器为你工作\nSteve Moritsu\
  \ \n\n### 如何快速完成编辑\n### 如何将一系列 `vi` 命令映射到按键\n### 映射 `J` 以防止意外\n### 在整个文档中全局替换文本\n\
  ### 在文档章节中进行文本替换\n### 更改左边缩进\n### 全局和部分文本替换\n### 剪切、复制与粘贴\n\n第 472 页\n\n### 使用 .\
  \ 重复编辑\n`.` 命令重复上一次的插入、删除或修改，但将其应用于当前位置。问题在于，它只重复最后一次更改。例如，假设你正在写一封信，想要反复更改一个三个单词的公司名称（如\
  \ Acme Products）。如果你先删除了旧的三个单词名称，然后插入新名称，最后替换你写错的一个字符；那么你做的最后一次更改就是替换一个字符。点命令现在可以反复这个最后一次更改，但重复替换一个字符并不是一个有用的操作。\n\
  \n`.` 命令是 `vi` 的强大工具之一。要使用它，你必须首先能够通过单个 `vi` 命令完成你的更改。你可以在该命令之前加上重复次数。然后点命令就可以根据需要重复那个有用的命令。在前面的示例中，我们想要替换三个单词，所以我们应该使用以下：\n\
  \n```3cw\n```\n\n`3` 是重复次数，因为我们想要更改三个单词。`c` 命令允许我们输入任何长度的新内容来替换指定的文本，直到按 `Esc` 为止。`w`\
  \ 表示包含单词（contained words），这意味着第三个单词后的任何标点符号都不会被更改。我们在上一章中讨论了分离单词与包含单词的区别。`3cW` 将更改三个分离或由空格分隔的单词，这也会更改随后的任何标点符号。\n\
  \n\n\n在成功执行过一次 `3cw` 后，我们现在可以找到想要更改的三个单词的下一次出现处，并将光标移动到那里。按下点键 (`.`)，当前包含的三个单词将被替换为之前输入的相同文本。将光标移动到下一次出现处并按下点键，按需要替换整个文档中所有的三单词序列。这是选择性替换，因为你可以查看每次出现的情况，并根据需要决定在何时按下点号。在移动过程中要避免进行其他编辑的诱惑，因为会导致点号命令忘记你的三单词更改并记住新的更改。下一节将向你展示如何进一步地自动化这种选择性的查找和替换。在此之前，还有几点。\n\
  \n注意，`3cw` 是一个语法命令，它没有指定原始内容——这意味着点号 (`.`) 命令可以用于任何所需的三个单词。如果有几个三个单词组成的公司名称，点号命令可以将任何一个更改为我们的新文本。只需将光标移动到任何三单词模式并按下点键即可。\n\
  \n有时，要更改的文本可能包含不同数量的单词，但它们总是适用于相同数量的字符，例如表格中的条目。假设我们的表格条目长度为 15 个字符，我们想要输入相同的新条目来替换几个不同的条目。成功使用点命令的关键是构建一个单一的\
  \ `vi` 命令来重复。在这种情况下，我们的第一个命令可以是以下任意一个：\n\n```\n15cl R\n```\n\n`15cl` 使用 `l` 命令向移动，因此\
  \ `15cl` 更改光标右侧的 15 个字符，包括当前字符。由于这是表格，我们需要精确地输入 15 个字符，以便新文本完全契合表格大小。我们还可以使用 `R`\
  \ 命令在一个命令中精确地替换 15 个字符。\n\n### 使用 `n` 和 `.` 搜索并选择性重复编辑\n\n我们可以将重复上一次搜索的 `n` 命令与点号命令结合，以此快速完成重复性的编辑工作。注意，当你想要查看每一行以决定是否应该更改它时，此程序有用。如果你不需要查看每次出现的情况，请使用本章后面讨论的全局或部分文本替换步骤。\n\
  \n### 双指编辑\n\n1. 启动 `vi` 以编辑你想选择性替换某些文本的文档。\n2. 输入 `1G` 确保你处于文档开头。\n3. 输入 `/pattern`，其中\
  \ `pattern` 是你想要替换的单词。这会将光标移动到该模式的第一次出现处。\n4. 决定是否想要保留紧跟在模式后的任何标点符号，例如句号 `.` 或引号。如果是，使用包含单词（contained\
  \ words）。如果不是，使用分离单词（separated words）（在前面的关于点命令的节中会有更多讨论。）\n5. 计算要替换的单词数。对于分离单词，每个单词由空格或制表符分隔。对于包含单词，计算要替换的非单词数量。输入该数字。不要按回车。\n\
  6. 输入字母 `c`。不要按回车。\n7. 对于包含单词，输入 `w`。对于分离单词，输入 `W`。美元符号 (`$`) 将显示要更改文本的结束。\n8. 如果美元符号\
  \ (`$`) 没有出现在正确的位置，按下 `Esc`，然后输入 `u`。这将恢复原始文本。回到第 4 步再次尝试。\n9. 输入新的替换文本。它可以比原始文本长或短。完成后按下\
  \ `Esc`。\n10. 按下字母 `n` 转到模式的下一次出现处进行替换。查看它并决定是否要在那里进行替换。\n11. 如果你想进行替换，输入点号 (`.`)。你的新文本将替换该模式。\n\
  12. 现在为了实现真正的速度，将一个食指放在点键上，另一个食指放在 `n` 键上。按下 `n` 跳到模式的下一次出现处并查看它。只有在你想替换时才按下点。通过这种双指编辑，你可以在几分钟内替换几百处出现的内容。\n\
  \n另另\n*有关关于包含单词与分离单词的更多信息，请参第 465 页*\n\n不要忘记你可以撤销错误\n\n\n\n当你进行双指编辑时，可能会在本想按 `n`\
  \ 键时按到了点号。点号会导致你的上一次更改被再次应用。要纠正这个错误，只需输入 `u` 来撤销上一次更改。\n\n# 将按键映射到常用的命令序列\n\n点号（`.`）命令的局限性在于它只能重复你执行的最后一次插入、删除或修改编辑命令。有时，通过\
  \ `n` 命令和点号命令无法完成重复编辑，因为每次重复都需要执行多个编辑命令和/或移动命令。\n\n我们可以通过将一个未使用的命令键映射到一串 vi 编辑命令和/或移动命令序列来处理这种情况。在上一章关于\
  \ vi 的介绍中，你已经看到如何将字母 `g` 映射到一个可以格式化段落的命令序列。字母映射后，将光标置于并按下该字母。随后映射到该字母的命令就会被执行。\n\
  \n然而，在映射按键之前，你必须确认你的终端是否支持在可视模式下 `Ctrl+V`。`Ctrl+V` 对于映射至关重要，因为它允许你将控制字符作为映射序列的一部分输入。某些终端需要特殊的序列来使用\
  \ `Ctrl+V`，因此你需要首先检查这一点。\n\n## 检查可视模式下是否支持 Ctrl+V\n\n1. 在 shell 提示符下，输入 `vi`。\n\
  2. 按回车键执行此命令。注意不要指定文件名。\n3. 在 `vi` 中，输入冒号（`:`）。光标应该移动到最后一行，那里会出现一个冒号（`:`）。\n4. 按\
  \ `Ctrl+V` 输入任意控制字符。\n5. 观察你的屏幕。如果底部看起来像这样：\n`:^` 且光标直接位于脱号（`^`）下方，则你的终端支持可视模式下的\
  \ `Ctrl+V`。如果你的屏幕显示任何其他结果（例如底部是空行），则你的终端不支持支持可视模式下的 `Ctrl+V`。\n6. 连续两次 `Esc`。\n\
  7. 输入冒号（`:`）。\n8. 输入 `q!`，然后按回车。你现在应该已经回到了 shell 提示符。\n\n现在我们准备好映射一个字符了。这里有一个映射示例可以让你感受映射的功能。假设我想映射可用的\
  \ `v` 键，使得每次我在命令模式下输入 `v` 时，都会执行以下操作：\n\n- 移动到行：`j`\n- 回到行首：`0`\n- 向右移动 15 个字符：`15l`\n\
  - 将后续 10 个字符替换为 acme：`10clmeESC`（`10cl` 表示将右侧的 10 个字符更改为输入的内容，直到我按下 `ESC`）\n- 到行尾并插入连字符（`-`）：`A-`\
  \ 注意我们使用大写的 `A` 命令在行尾插入。\n- 然后插入 `Dept 2` 并结束插入模式：`Dept2ESC`\n\n以下是实现所有操作的 `map`\
  \ 命令：\n\n```\nmap vj015l10clme^A-Dept2^\n```\n\n在上一条命令中，请注意以下点：多个 vi 命令可以组合在一起形成我们的映射。命令之间不要留留任何空格。`Esc`\
  \ 字符显示在 `[` 上方。控制字符前面通常带有一个脱号（`^`）。如果你在映射中插入回车键，它将显示为 `^M`。在映射命令的每个控制字符或回车键之前，你必须按下\
  \ `Ctrl+V`。按下 `Ctrl+V` 会让 `vi` 显示脱号（`^`），提醒你紧接着输入的字符如果是控制字符，将被视为行中的另一个普通数据字符。现在你准备好实际设置映射了。\n\
  \n## 如何将按键映射到命令序列\n\n1. 从命令模式（即不是插入模式）输入冒号（`:`）。光标应该移动到屏幕的最后一行，那里会出现一个冒号（`:`）提示符。在接到指令前不要按回车。\n\
  2. 在前面的步骤中，你确定了终端是否支持可视模式下的 `Ctrl+V`。如果你的终端不支持（或者你不确定），从 vi 命令模式输入 `Q`。注意这是一个大写的\
  \ `Q`。不要按回车。光标将到屏幕底部并出现冒号（`:`）提示符。你现在退出了可视模式。这一步不需要，但如果你的终端支持可视模式下的 `Ctrl+V`，执行它也是无害的。\n\
  3. 输入 `map`。\n\n\n\n\n\n| 在接到指示前请勿按回车。 | \n\n4. 输入一个空格，然后输入想要映射的对应命令字母。你应该避免使用任何作为\
  \ `vi` 命令的字母，因为在映射了该字母后，你将无法再次执行该命令。实际上，只有五个大写或小写字母不是 `vi` 命令：`g`、`K`、`q`、`v`、`V`。我通常将\
  \ `g` 映射为格式化段落，如前所示。我不建议映射大写的 `K`，因为 `h`、`j`、`k` 和 `l` 被用于移动光标，如果不小心开启了大写锁定（Caps\
  \ Lock），我们不希望这些光标移动字母干扰到我们的文本。因此，我建议你使用小写的 `v` 或大写的 `V` 作为要映射的命令字母。\n\n5. 输入一个空格，然后输入在每次按下映射字母时要执行的\
  \ `vi` 命令序列。正如你之前看到的，在命令序列中的任何控制字符或 `Esc` 或 `Enter` 键之前，先输入 `Ctrl+V`。`Ctrl+V` 会在你的控制字符前出现一个光抑符（`^`）。\n\
  \n6. 现在按回车完成你的映射命令。因为你没有在此之前加 `Ctrl+V`，所以这个 `Enter` 键会终止映射命令。\n\n7. 如果你的终端不支持 `Ctrl+V`，你仍停留在带有冒号（`:`）提示符的最后一行。输入\
  \ `vi` 然后按回车。这将让你回到可视模式（Visual mode）。\n\n8. 你的光标现在应该已经离开底行，处于 `vi` 命令模式，准备好输入 `vi`\
  \ 命令，包括你刚刚映射的新型命令字母。\n\n当你有数百个重复的编辑更改需要进行时，加速这一过程的最佳方法是像之前讨论的那样设置双指编辑：使用 `n` 命令搜索下一个要修改的模式，并使用点（`.`）命令重复上一次更改。如果上一次更改太复杂无法通过单个命令完成，请设置一个映射，使得可以通过单个字母（如\
  \ `v` 键）完成整个命令序列。使用斜杠（`/`）命令找到第一个要修改的地方。现在将一个食指放在 `n` 键上，另一个食指放在 `v` 键上。按 `n` 找到下一个要修改的位置。只有在你想要修改它时才按\
  \ `v`。\n\n当你退出 `vi` 时，将会丢失你的映射。在上一章关于 `vi` 的章节中的格式化部分，你看到过如何将字母 `g` 的映射写入用户主目录下一个名为\
  \ `.exrc` 的文件中。注意，在这个文件中你写了完整的 `map` 命令，但没有在 `map` 单词前加冒号（`:`）。在用户主目录的 `.exrc` 中设置的任何映射在你每次使用\
  \ `vi` 时都可用。\n\n### 防止文本混乱\n\n如果你使用 `h`、`j`、`k` 和 `l` 移动光标而不是方向键，你会发现，如果不小心开启了大写锁定，输入\
  \ `H`、`K` 和 `L` 是无害的。`H` 将光标移动到屏幕上最高的一行。`K` 不是一个命令（只要你不映射这个字符）。`L` 将光标移动到屏幕上最低一行。\n\
  \n### 为什么 `Ctrl+V` 在某些终端上会有问题？\n\n如果你的 `TERM` 设置为 `vt10`，向下箭头会发送一个 `Ctrl+V`。如果你在\
  \ vi 中按下 `Ctrl+V`，vi 会认为按了向下箭头。我们可以通过使用 `Q` 临时退出来消除这个问题。或者，如果你的 `TERM` 设置为 `ansi`，只要你不使用\
  \ `Ctrl+V`，就不会有这个问题。\n\n### 防止误触 `J` 导致的问题\n\n1. 将此映射放入你用户主目录下的 `.exrc` 文件中：`map\
  \ J J:`\n2. 完成后，如果你不小心输入了几个大写的 `J`，第一个 `J` 将合并两行，然后在底行进入冒号（`:`）模式。其余的 `J` 将无害地出现在底行上。当你意识到自己的错误后，只需一直按退格键（Backspace）或\
  \ `Ctrl+H` 直到你移动到最左侧并离开最后一行。\n3. 如果你想撤销执行的单个 `J` 命令的效果，请输入 `u`。你现在已经完全从错误中恢复了。\n\
  \n\n\n\n\n如果你确实想合并多行，仍然可以在 `J` 前面加上重复次数。这将合并请求的行数，然后进入最后一行行的冒号模式（Colon mode）。只需按\
  \ `Backspace` 或 `Esc` 即可退出最后一行并继续你的其他编辑。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n不要映射 `K` 键。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n在四个光标移动命令 `h`、`j`、`k` 和 `l` 中，只有 `j` 在不小心开启 Caps Lock 的情况下会出问题。然而，如果你映射了 `K` 键，你可能会有两个问题的键。\n\
  \n# 全局和局部文本替换\n\nvi 内置了一个冒号命令 `g`，用于全局搜索并替换所有出现特定模式的次数。然而，由于你在前面的章节中刚刚学习了如何使用 `sed`\
  \ 和 `awk`，我将向你展示如何使用其他 UNIX 命令（如 `sed` 和 `awk`）来修改整个文件或文件的任何部分。学习了这项技术后，你可以做比全局\
  \ `g` 命令多得多的操作。\n\n## 在整个文件中替换 R.E. 模式\n\n### 如何在文档中全局替换模式\n\n1. 在 vi 命令模式下，输入冒号（`:`）。这应该会将光标移动到等待冒号提示的最后一行。\n\
  2. 输入以下内容：\n```\n:sed/R.E./newstring/g\n```\n这告诉 vi 将下面的 UNIX 命令应用到文件的所有行。`sed`\
  \ 是我们在上一个章节中看过的流编辑器。`s` 是用一个字符串替换另一个字符串的 `sed` 命令。`R.E.` 代表正则表达式（regular expression）。输入要搜索的字符串，其中可以包含\
  \ `R.E.` 通配符。`newstring` 代表放置在找到的 R.E. 字符串位置的替换字符串。`g` 告诉 `sed` 只要发现源字符串，就多次执行此替换。你可以省略\
  \ `g`，以告诉 `sed` 只替换每行中第一次出现的源字符串，而不替换同一行中的后续出现。![arrow.gif](img/4505ed21b36ef4ebf4df520fc03bad.gif)\n\
  \n3. 按回车键（Enter）执行你的命令。\n4. 更改将应用到所有行，你现在应该回到了 vi 命令模式。在某些类型的 UNIX 系统上，你可能会被提示按\
  \ Enter 或 Return 键。\n5. 检查你文件的每一行，看看你对所所的更改是否满意。如果不满意，可以通过输入 `u` 命令来撤销所有更改。记住 `u`\
  \ 命令只能撤销上一次更改，因此在执行这些替换后立即检查文件。\n\n另另：![sarrow.gif](img/ad91af06ad9657f0a338bded4c42f0e.gif)\
  \ *有关关于 R.E. 模式的更多信息，请参阅第 388 页*\n\n## 在文件的部分区域替换 R.E. 模式\n\n使用上一节的技术，你也可以仅在文件的部分进行操作（这在介绍过的全局\
  \ `g` 命令中是不可能的）。以下步骤利用了你可以在文件中设置标记（marks）来引用该行的事实，正如你在早之前的章节中看到的那样![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n为什么不用内置的 vi 命令呢？vi 支持两个内置的冒号命令 `g`（全局）和 `s`（替换），我没有在本书中介绍它们，因为调用外部 `sed` 命令可以实现这两个内置命令相同的功能。这让你有更多机会练习\
  \ `sed`，它是一个重要的 UNIX 命令，并向你展示了如何调用外部 UNIX 命令来处理你的文本（你以后将不得不这样做）。\n\n### 如何在文件的部分区域替换字符串\n\
  \n1. 在 vi 中，将光标移动到想要进行文本替换区域区域。\n2. 输入 `ma`。这将在该行设置标记 `a`。如果标记 `a` 已经用于标记文件的另一行，你可以选择任何其他字母作为你的标记。你最多可以设置\
  \ 26 个标记。\n3. 将光标移动到要修改区域的最后一行。\n4. 输入 `!'a`。在接到指示之前不要按回车键。如果你使用了不同的标记，请更改前面示例中的字母\
  \ `a`。注意引号是单引号，而不是反引号。这应该将光标带到最后一行，那里应该出现一个感叹号（!）提示。\n\n\n\n\n\n5. 输入以下内容：\n```\n\
  sed 's/R.E./newstring/g'\n```\n这是我们在上一个逐步操作过程中分析过的完全相同的 `sed` 命令。\n\n6. 按回车键执行你的命令。\n\
  \n7. 更改将应用于你文件的该部分，你现在应该返回了 `vi` 命令模式。在某些类型的 UNIX 系统上，你可能会被提示按回车或 Return 键继续。\n\n\
  检查你的文件行，查看你对所做的更改是否满意。如果不满意，你可以输入 `u` 命令来撤销所有更改。记住 `u` 命令只能撤销上一次更改，因此在执行这些替换后请立即检查文件。\n\
  \n总结一下：\n- `:%!sed ...` 在整个文件中进行替换\n- `!'a sed ...` 替换到标记或向前到标记\n\n### 另请参考\n有关在\
  \ `vi` 中设置标记的更多信息，请参阅第 467 页。\n\n### 在 vi 中进行条件文本替换*\n\n我们可以将前一节中的 `sed` 命令替换为其他\
  \ `sed` 命令或其他完全不同的命令，以便我们能够很好地控制 `vi` 中文本替换的方式。\n\n```\nsed '/R.E.1/s/R.E.2/newstring/g'\
  \ # 通用形式\n```\n```\nsed '/acme$/s/^president/chairperson/g' # 示例\n```\n第一行显示了我们也可以在\
  \ `vi` 中用于条件替换文本的修改后的 `sed` 命令的通用形式。在这种形式的 `sed` 命令中，`sed` 将搜索 `R.E.2` 并将其替换为 `newstring`，但仅限于包含\
  \ `R.E.1` 的行。在第二行中，你可以看到使用这种形式的 `sed` 的示例。\n\n在那个示例中，如果 `president` 出现在行首，我们将将其替换为\
  \ `chairperson`，但前提是该行以单词 `acme` 结尾。\n\n```\nawk '$n == \"sstring\" {gsub(\"R.E.2\"\
  ,\"newstring\")};print}' # 通用形式\n```\n```\nawk '$3 == \"K6697\" {gsub(\"D...\",\"\
  M46253\")};print}' # 示例\n```\n第一行显示了我们也可以在 `vi` 中用于条件替换文本的 `awk` 命令的通用形式。使用 `awk`，我们可以检查特定字段以决定是否应该对该行进行文本替换。在这种形式的\
  \ `awk` 命令中，`awk` 搜索所有次数的 `R.E.2` 并将其替换为 `newstring`，但仅限于字段 `n` 确匹配 `sstring` 的行。在第二行中，你可以看到使用这种形式的\
  \ `awk` 的示例。在那个示例中，每当 `D` 后面跟着三个字符时，`D` 和那三个字符将被替换为 `M46253`，但前提是行的第 3 字段包含 `K6697`。\n\
  \n```\nawk '$n >= numval {gsub(\"R.E.2\",\"newstring\")};print}' # 通用形式\n```\n```\n\
  awk '$3 >= 16.2 {gsub(\"D...\",\"M46253\")};print}' # 示例\n```\n这个示例显示了与前面的 `awk`\
  \ 命令类似的通用形式。当你想要进行替换，但仅当特定字段包含大于或等于 `numval` 的值时，使用这种 `awk` 形式。可以用以下符号替换：\n- `>=`\n\
  - `<=`\n- `==`\n- `!=`\n- `>`\n- `<`\n\n```\nawk '$n ~ /R.E.1/ {gsub(\"R.E.2\",\"\
  newstring\")};print}' # 通用形式\n```\n```\nawk '$3 ~ /P[0-9]$/ {gsub(\"D...\",\"M46253\"\
  )};print}' # 示例\n```\n上一个示例再次显示了与之前两个 `awk` 命令类似的通用形式。当你想要进行替换，但仅当特定字段包含 `R.E.`\
  \ 模式时，使用前述形式。在此特定的特定示例中，每当 `D` 后面跟着三个字符时，`D` 和那三个字符将被替换为 `M46253`，但前提是行的第 3 字段以\
  \ `P` 后跟一个数字结尾。\n\n### 修改行的缩进\n\n你可以使用 `sed` 命令通过向左边距添加空格或删除空格来更改缩进。\n\n```\nsed\
  \ 's/^ *//'\n```\n前面的 `sed` 命令删除了文件中所有行的前导空格。\n\n```\n!'a sed 's/^ *//'\n```\n这个\
  \ `sed` 命令删除了到标记 a 的当前行的前导空格。\n\n```\nsed 's/^/   /'\n```\n前面的 `sed` 命令为文件的每行添加了三个前导空格。\n\
  \n\n\n\n\n```bash\n!'a sed 's/^/   /'\n```\n此 `sed` 命令会在从当前行开始的每行开头添加三个空格，以进行标记。\n\
  \n# 在 vi 中移动/复制文本段\n\n移动和复制文本可以通过多种方式实现。我将向你展示如何使用标记（marks）来完成，因为我认为这能给你提供最好的控制力和最理想的结果。\n\
  \n## 在同一文件中移动/复制文本\n\n1. 在 vi 中，将光标移动到要移动或复制文本的开头。\n2. 输入 `ma`。此命令无需按回车键即可执行。它在该行设置标记\
  \ `a`。如果标记 `a` 已用于标记该文件的其他行，你可以选择任何其他字母作为标记。你最多可以设置 26 个标记。\n3. 将光标移动到要移动或复制段的最后一行。\n\
  4. 如需移动文本，输入 `d'a`。此命令无需按回车键即可执行。它会删除从当前行到标记 `a` 的所有文本，并将其保存到所谓的无名缓冲区（unnamed buffer）中。\n\
  5. 如需复制文本，输入 `y'a`。此命令无需按回车键即可执行。它会复制从当前行到标记 `a` 的所有文本，并将其保存到无名缓冲区中。\n6. 将光标移动到放置移动或复制文本的正上方行。如果你想将文本移动或复制到文件开头，则必须在文件开头插入一个空行，以便你能够处于想要插入位置的上方行。\n\
  7. 输入 `p`。此命令无需按回车键即可执行。它将插入之前步骤 4 或 5 保存到无名缓冲区中的所有文本。\n\n## 在文件之间移动/复制文本\n\n1.\
  \ 使用 vi 编辑源文件，即包含要移动或复制文本的文件。\n2. 将光标移动到要移动或复制文本的开头。\n3. 输入 `ma`。此命令无需按回车键即可执行。它在该行设置标记\
  \ `a`。如果标记 `a` 已用于标记该文件的其他行，你可以选择任何其他字母作为标记。你最多可以设置 26 个标记。\n4. 将光标移动到要移动或复制段的最后一行。\n\
  5. 如需移动文本，输入 `d'a`。此命令无需按回车键即可执行。它会删除从当前行到标记 `a` 的所有文本，并将其保存到缓冲区 `b` 中。如果缓冲区 `b`\
  \ 已在使用，你可以选择任何其他字母作为缓冲区。你最多可以拥有 26 个缓冲区，对应字母表中的每个字母。\n6. 如需复制文本，输入 `y'a`。此命令无需按回车键即可执行。它会复制从当前行到标记\
  \ `a` 的所有文本，并将其保存到缓冲区 `b` 中。如果缓冲区 `b` 已在使用，你可以选择任何其他字母作为缓冲区。你最多可以拥有 26 个缓冲区，对应字母表中的每个字母。\n\
  7. 如果在此文件中进行了任何想要保留的文本修改，请现在保存。输入 `:w`。前一个命令将 vi 工作空间写入文件。此时不要退出 vi，因为那会清除所有无名缓冲区和具名缓冲区。\n\
  8. 输入 `:e file2`。冒号（`:`）e 会切换你正在编辑的文件，同时保留命名缓冲区中的文本。将前一个命令中的 `file2` 替换为你想要移动或复制保存文本的文件名。\n\
  \n\n\n\n9. 在此新文件中，将光标移动到该文件中目标位置正上方的一行，以便放置移动或复制的文本。如果你想将文本移动或复制到文件的开头，你必须在文件开头插入一个空行，这样你就可以处于想要插入位置的正上方行。\n\
  \n10. 输入 `bp`。此命令无需按回车键即可执行。它会粘贴——即插入之前第 5 或 6 步中保存在缓冲区 `b` 中的所有文本。\n\n### 设置插入文本的选项\n\
  \n在 `vi` 中，`set` 命令允许你开启或关闭 `vi` 中的各种模式。本节将介绍能够增强文本输入的模式。\n\n#### 设置 vi 始终显示输入模式\n\
  \n有时人们在 `vi` 中操作会遇到困难，因为他们忘记了自己处于插入模式（Insert mode）还是命令模式（Command mode）。我见过初学者创建的文件中包含如下这样的行：\n\
  \n```\n:wq :w!q\n:wq!\nwq\nq\n:q\n```\n\n`vi` 有一种模式，可以在屏幕右下角告诉你你正处于插入模式、替换模式（Replace\
  \ mode）、追加模式（Append mode）等。要开启此模式，请输入：\n\n```\n:set showmode\n```\n\n```\n|\n|\n\
  第 488 页\n||\n```\n\n要关闭此模式，请输入：\n\n```\n:set noshowmode\n```\n\n#### 在行尾处开启自动换行（Autowrap）\n\
  \n`vi` 有一种模式，会在你插入文本时检查你是否接近行尾。如果是，它会将当前单词移动到下一行的开头，就好像你在该单词开始之前刚刚按了回车键一样。开启此模式后，你永远不需要手动按回车键。`vi`\
  \ 会为你自动换行行。要开启此模式，请输入：\n\n```\n:set wrapmargin=10\n```\n\n`set wrapmargin=10` 命令会导致任何距离行尾\
  \ 10 个字符以内的单词自动换行到下一行的起始位置。你可以设置一个比 10 更大或更小的数字，来决定你希望换行结束的位置。要关闭此模式，请输入：\n\n```\n\
  :set wrapmargin=0\n```\n\n此命令可以缩写为 `wm`，如下所示：\n\n```\n:set wm=10\n```\n\n#### 在行首处开启自动缩进（Autoindent）\n\
  \n如果你在具有缩进左边的文档中使用 `vi`，那么开启自动缩进对你很有帮助。当你在插入、追加或替换模式下进入下一行时，`vi` 会自动输入与上一行相同数量的空格。要关闭此模式，请输入：\n\
  \n```\n:set noautoindent\n```\n\n你可以将此命令缩写为 `ai`，如下：\n\n```\n:set ai :set noai\n\
  ```\n\n```\n|\n第 489 页\n9|\n```\n\n#### 使用缩写处理长字符串\n\n如果你有一个经常输入的长短语，可以设置一个输入缩写，`vi`\
  \ 会在你输入缩写后立即将其展开。\n\n##### 设置和使用 vi 缩写\n\n1. 在 `vi` 中，输入 `:` 然后输入 `abbrev`。\n2.\
  \ 输入空格，然后输入你用来表示要插入长短语的缩写。\n3. 输入空格，然后输入长短语本身。\n4. 按回车设置此缩写。\n5. 要使用已设置的缩写，在 `vi`\
  \ 中进入插入模式并开始输入文本。在你输入的文本中，插入该缩写。你应该看到 `vi` 立即将该缩写展开为长短语。\n\n#### 行号\n\n在 `vi` 中，有一种模式可以在文件的每行之前显示行号。这些行号并不会插入到文件本身，而只是显示在屏幕上。如果你正在编译\
  \ C 语言程序且编译器告诉你在第 1453 行有错误，这就会非常有用。要开启 `vi` 行号显示，请输入：\n\n```\n:set number\n```\n\
  \n\n\n要关闭此模式，请输入：\n\n```\n:set numberumber\n```\n\n该命令可以缩写为 `nu`，如下所示：\n\n```\n\
  :set nu\n:set nonu\n```\n\n# 使用 / 或 ?? 搜索时忽略大小写\n\n为了在使用斜杠 (`/`) 向前搜索字符串或使用问号 (`?`)\
  \ 反向搜索字符串时忽略大小写，请输入以下内容：\n\n```\n:set ignorecase\n```\n\n要关闭此模式，请输入：\n\n```bash\n\
  :set noignorecase\n```\n\n你可以将此命令缩写为 `ic`，如下：\n\n```bash\n:set ic\n:set noic\n```\n\
  \n## 将你的选项保存到 .exrc 中\n\n如果你希望每次进入 vi 时都使用某些 `:set options`，你可以在家目录下创建一个名为 `.exrc`\
  \ 的文件。它可以包含设置选项、映射命令和缩写，如下所示：\n\n```\nset autoindent set ignorecase\nset showmode\n\
  set wm=10\nmap g 072lBi^M^[\nmap J J:\nabbrev SVR4 UNIX, System V, Release 4\n```\n\
  \n注意，该文件中的每一行*都没有*以冒号 (`:`) 开头。\n\n关于主目录的更多信息，请参见 ![arrow.gif]() 第 44 页\n\n## 利用其他命令在\
  \ vi 中工作\n\n你之前已经看到如何将 `sed` 应用于部分或行。你可以利用该技术在 vi 中使用其他 UNIX 命令。\n\n## 在 vi 中检查\
  \ UNIX 命令\n\n在 vi 中编辑时，你可能想通过运行 UNIX 命令或管道来查找某些信息。你可以在 vi 模式下通过输入以下来实现：\n\n```\n\
  !:cmd\n```\n\n将 `cmd` 替换为所需的运行 UNIX 命令或管道。该命令的输出将显示在你的屏幕上。最后，它会提示你按 Enter 键。然后将返回\
  \ vi 模式准备好对文件进行编辑。你在上一章关于 vi 编写显示帮助信息的脚本时已经见过这个过程。在那个练习中，我们使用冒号叹 (`!`) 来运行 `vihelp`\
  \ 脚本，以便查看帮助信息并恢复编辑。\n\n```\n!:cal 1998 pg\n```\n\n上一个示例显示了 1998 年的日历，一次一页。你现在可以使用\
  \ `pg` 在 1998 年的日历中切换，查找特定日期是星期几。在结束此 `cal 1998` 管道后，你会自动恢复到 vi 编辑，当前屏幕将完全刷新。\n\n\
  ## 将其他 UNIX 命令的输出插入你的文件\n\n你可以通过将光标移动到空行，将任何 UNIX 命令或管道的输出插入到文件中。然后输入：\n\n```\n\
  !!cmd\n```\n\n将 `cmd` 替换为所需的运行 UNIX 命令或管道。双叹号 (`!!`) 会将你所在的行作为标准输入提供给该命令。该命令的输出将替换文件中当前的行。\n\
  \n```\n!!cal 1998\n```\n\n此示例将 1998 年的日历插入到文件中替换当前行。或者，你也可以使用 vi 内置命令 `:r filefile`\
  \ 将 `filefile` 的内容插入到光标位置。`filefile` 可以指定为文件名、绝对路径或相对路径。\n\n## 排序部分文件\n\n在 vi 中，你可以通过输入以下内容对文件的所有行进行排序：\n\
  \n```\n:%sort\n```\n\n你可以输入任何所需的排序选项（参见附录 A）。文件的所有行都将传递给 `sort` 命令。sort 命令的输出将替换文件的当前内容。如果你不喜欢结果，可以输入\
  \ `u` 来撤销上一次修改。\n\n\n\n\n# 如何排序文件的部分内容\n\n1. 将光标移动到要排序部分的开头。\n2. 输入 `ma`。此命令无需按回车键即可执行。它会在该行设置标记\
  \ `a`。如果标记 `a` 已被用于标记文件的其他行，你可以选择任何其他字母作为标记。你最多可以设置 26 个标记。\n3. 将光标移动到要排序部分的最后一行。\n\
  4. 输入 `!'a sort`。在 `sort` 之后输入任何所需的选项（参见附录 A）。按回车键执行此命令。\n5. 现在，该部分中的行将将完成排序。\n\n\
  **另请参阅**\n关于 `sort` 命令的更多信息，请参阅第 202 页。\n\n## 删除匹配模式的行\n\n在 vi 中，你可以通过输入以下命令删除文件中所有包含正则表达式（R.E.）的行：\n\
  \n```\n:%grep -v'R.E.'\n```\n\n你可以输入任何所需的 `grep` 选项（参见附录 A）。文件的所有行将传递给 `grep` 命令。`grep`\
  \ 命令的输出将替换文件的当前内容。如果你不喜欢结果，可以输入 `u` 来撤销该修改。\n\n### 删除部分中包含模式的行\n\n1. 将光标移动到想要删除包含模式行的部分的开头。\n\
  2. 输入 `ma`。此命令无需按回车键即可执行。它会在该行设置标记 `a`。如果标记 `a` 已被用于标记文件的其他行，你可以选择任何其他字母作为标记。你最多可以设置\
  \ 26 个标记。\n3. 将光标移动到该部分的最后一行。\n4. 输入 `!'a grep -v R.E`。在 `grep` 之后输入任何所需的选项（参见附录\
  \ A）。遵循 `grep` 的标准规则，包括在正则表达式模式周围添加任何必要的引号。按回车键执行此命令。\n5. 现在，该部分中包含正则表达式的行将被删除。\n\
  \n**另请参阅**\n关于 `grep` 命令的更多信息，请参阅第 380 页。\n\n## 加密/解密整个或部分文件\n\n如果你的 UNIX 支持 `crypt`\
  \ 命令，你可以将上一节中的技术应用于 `crypt`。\n\n```\n:%crypt\n```\n\n上述的 vi 命令将要求你输入密钥。然后它将使用该密钥对整个文件进行加密或解密。请仔细保管你的密钥，因为没有它无法解密文本。\n\
  \n```\n!'ac\n```\n\n上述 vi 命令将从当前行到标记 `a` 的文件部分进行加密或解密。\n\n**另请参阅**\n关于 `crypt` 命令的更多信息，请参阅第\
  \ 217 页。\n\n## 在文档中插入横幅\n\n你可以使用 UNIX `banner` 命令更改行，使每个字符高度约为 10 个字符，如下所示：\n\n\
  ```\n!!banner\n```\n\n此 vi 命令将文件的当前行通过给 `banner`，并用 `banner` 的输出替换该行。\n\n**另请参阅**\n\
  关于 `banner` 命令的更多信息，请参阅第 167 页。\n\n## 打印文件的部分\n\n1. 在 vi 命令模式下，输入以下内容：\n\n```\n\
  :w\n```\n\n\n\n\n# 从 vi 中打印文件的某个部分\n\n1. 在 vi 命令模式下，输入以下内容：\n```\n:w\n```\n此 `vi`\
  \ 命令将文件写入磁盘，在执行后续步骤之前执行此操作是至关重要的。\n2. 在要打印部分的起始处设置标记 `a`。\n3. 移动到要打印部分的末尾并输入：\n\
  ```\n!'a lp\n```\n你可以使用 `lp` 或 `lpr`，具体取决于你的系统支持哪一个。你可以添加任何所需的选项，例如选择目标打印机或打印份数。\n\
  4. 上述命令会从你的文件中删除所有要打印的行。输入 `u` 可以撤销删除操作并将这些行恢复到你的文件中。在执行步骤 3 之后立即运行 `u` 命令是非常重要的。\n\
  \n**另请参阅**：有关关于打印的更多信息，请参阅第 169 页。\n\n# 统计文件中部分的行数/单词数/字符数\n\n1. 在 vi 命令模式下，输入以下内容：\n\
  ```\n:w\n```\n此 `vi` 命令将文件写入磁盘，在执行后续步骤之前执行此操作是至关重要的。\n2. 在要统计部分的起始处按如下方式设置标记 `a`：\n\
  ```\nma\n```\n3. 移动到要统计部分的末尾，并输入：\n```\n!'a wc\n```\n4. 上述命令会删除所有要统计的行，并将其替换为三个数字：\n\
  该部分的行数\n该部分的单词数\n该部分的字符数\n如果你需要这些数字中的任何一个，请将其记录。\n5. 输入 `u` 可以撤销删除操作并将这些行恢复到你的文件中。在步骤\
  \ 3 之后立即运行 `u` 命令是非常重要的。\n\n## 编辑多个文件\n\n你可以给 `vi` 提供一个要编辑的文件列表，如下所示：\n```\nvi report\n\
  ```\n当你完成一个文件的编辑时，保存它 (`:w`) 并使用 `:n` 开始编辑列表中的下一个文件。\n\n# Korn Shell 中的命令行编辑\n\n\
  在 UNIX 或任何其他操作系统上工作时，你必须使用终端上的可用键来纠正输入错误。然而，并不是所有键盘的布局都是相同的，而且可能没有相同的键。由于由于原因，你可能无法纠正键入错误，并发现自己需要重新输入整个命令字符串。\n\
  \nKorn shell 提供了在命令行中编辑命令的两种方式。你可以使用编辑器 `vi` 的按键，也可以使用编辑器 `emacs`。根据你熟悉的哪种编辑器，你可以调用其中任一选项进行命令行编辑。你必须显式地调用\
  \ `vi` 或 `emacs` 命令行编辑选项。如果你没有在 `.profile` 文件中这样做，那么默认将获得 Korn Shell 的行编辑选项，而这些选项是有限的。\n\
  \n## 调用命令行选项\n\n如果你熟悉 `vi`，那么你可以在命令行上使用以下命令，或将其放在 `.profile` 文件（在登录时执行）中，以使用 `vi`\
  \ 命令进行命令行编辑：\n```\nset -o vi\n```\n另一方面，如果你熟悉 `emacs` 编辑器，请使用以下命令：\n```\nset -o\
  \ emacs\n```\n你任何时候只能激活其中一个。最后一次执行的命令将生效。\n\n\n\n\nKorn shell 会保留整个会话期间的命令历史。这意味着，即使你注销，你仍然可以使用\
  \ Korn shell 命令 `fc` 获取你在上一个会话中输入的命令。历史记录默认存储在 `$HOME/.sh_history` 文件中，其中 `$HOME`\
  \ 是用户的家目录。如果你想修改历史文件的文件名，可以修改系统变量 `HISTFILE` 中指定的名称。你可以将以下命令包含在 `.profile` 文件中来修改历史文件名。\n\
  \n```bash\nexport HISTFILE=$HOME/myhistoryfile\n```\n\n如果你想查看最近的命令列表，可以使用以下命令：\n\
  \n```bash\nfc -l\n```\n\n系统输出如下：\n\n```\n\n如果你想查看最近的 10 条命令的列表，可以使用以下命令：\n\n```bash\n\
  fc -l -10\n```\n\n左侧的数字是历史文件中的命令行号。较大的数字表示比较小的数字更接近当前的命令。如果你想查看指定行范围内的命令，可以使用以下命令：\n\
  \n如果你想查看最近的 10 条命令的列表，可以使用以下命令：\n\n```bash\nfc -l -10 -5\n```\n\n系统输出如下：\n\n```\n\
  \n如果你想查看最近的 10 条命令的列表，可以使用以下命令：\n\n```bash\nfc -l -10 -5\n```\n\n如果你想查看最近的 10 条命令的列表，可以使用以下命令：\n\
  \n```bash\nfc -l -10 -5\n```\n\n系统输出如下：\n\n```\n\n如果你想查看最近的 10 条命令的列表，可以使用以下命令：\n\
  \n```bash\nfc -l -10 -5\n```\n\n如果你想查看最近的 10 条命令的列表，可以使用以下命令：\n\n```bash\nfc -l\
  \ -10 -5\n```\n\n系统输出如下：\n\n```\n\n如果你想查看最近的 10 条命令的列表，可以使用以下命令：\n\n```bash\nfc\
  \ -l -10 -5\n```\n\n如果你想查看最近的 10 条命令的列表，可以使用以下命令：\n\n```bash\nfc -l -10 -5\n```\n\
  \n系统输出如下：\n\n```\n\n如果你想以倒序顺序查看命令列表，可以使用以下命令：\n\n```bash\nfc -l -r\n```\n\n系统输出如下：\n\
  \n```\n\n如果你想查看最近的 10 条命令的列表，可以使用以下命令：\n\n```bash\nfc -l -10 -5\n```\n\n如果你想执行历史文件中的某一个命令，可以使用\
  \ `fc` 命令配合 `-s` 参数。如果你只想执行最近的命令，可以使用以下命令：\n\n```bash\nfc -s\n```\n\n例如，如果你想执行第\
  \ 18 行的命令，可以使用以下命令：\n\n```bash\nfc -s 18\n```\n\n## 编辑模式\n\n`vi` 命令行编辑器像源编辑器一样有两个模式：输入模式和命令模式。\n\
  \n在输入模式下，你输入命令并按 `Enter` 键表示执行该命令。你可以在输入模式下随时使用 `Esc` 键切换到命令模式。在命令模式下，你可以导航到已输入命令的任何部分并进行修改，包括在命令中间插入字符串。在命令模式下，可以使用一个或多个字母来激活\
  \ `vi` 的不同的编辑命令。在命令模式下，如果你按下没有 `vi` 命令的键，通常会听到终端发出的提示声。在 `vi` 命令模式下，小写字母的含义与大写字母不同。\n\
  \nKorn shell 会保留你之前输入的命令历史。你可以使用命令行编辑命令来调用这些命令，并在执行之前对其进行修改或添加。现在来看在使用 `set -o vi`\
  \ 将 `vi` 设置为命令行编辑器后的一些命令行编辑命令细节。这些按字母顺序讨论：\n\n- `a`: 插入模式，在当前光标位置后插入文本。\n- `A`:\
  \ 插入模式，在行尾插入文本。\n- `b`: 允许光标向后移动字符。你可以在前面加一个数字 *n* 来重复 *n* 次。\n\n\n\n\n\n# 命令参考\n\
  \n| 命令 | 说明 |\n| :--- | :--- |\n| `b` | 允许光标移动到上一个单词（由空格或分隔符划分的文本）。你可以在前面加上数字 `n`\
  \ 来重复执行 `n` 次。 |\n| `C` | 删除从当前位置到行尾的所有字符，并允许你输入新字符。 |\n| `dd` | 删除整行文本。 |\n| `D`\
  \ | 从当前光标位置删除到行尾。 |\n| `e` | 将光标移动到当前单词的末尾。你可以在前面加上数字 `n` 来重复执行 `n` 次。 |\n| `E`\
  \ | 将光标移动到当前由空白符分隔的单词的末尾。你可以在前面加上数字 `n` 来重复执行 `n` 次。 |\n| `f` | 后跟一个字符，将光标移动到下一个指定字符出现的位置。你可以在前面加上数字\
  \ `n` 来重复执行 `n` 次。 |\n| `F` | 后跟一个字符，将光标移动到上一个指定字符出现的位置。你可以在前面加上数字 `n` 来重复执行 `n`\
  \ 次。 |\n| `G` | 取出命令历史中最早的命令。你可以在前面加上数字 `n` 来定位到命令历史中的第 `n` 条命令。 |\n| `h` | 将光标向左移动一个字符。你可以在前面加上数字\
  \ `n` 来重复执行 `n` 次。 |\n| `i` | 将你置于光标位置之前的插入模式以输入文本。 |\n| `I` | 将你置于行第一个非空白字符之前的插入模式。\
  \ |\n| `j` | 取出命令历史中的下一个命令。你可以在前面加上数字 `n` 来重复执行 `n` 次。 |\n| `k` | 取出命令历史中的上一个命令。你可以在前面加上数字\
  \ `n` 来重复执行 `n` 次。 |\n| `l` | 将光标向右移动一个字符。你可以在前面加上数字 `n` 来重复执行 `n` 次。 |\n| `n` |\
  \ 重复命令历史文件的上一次搜索。搜索方向是从最近的命令到最旧的命令。 |\n| `N` | 重复命令历史文件的上一次搜索。搜索方向是从最旧的命令到最近的命令。\
  \ |\n| `p` | 在光标位置后插入来自删除或复制缓冲区的文本。你可以在前面加上数字 `n` 来重复执行 `n` 次。 |\n| `P` | 在光标位置前插入来自删除或复制缓冲区的文本。你可以在前面加上数字\
  \ `n` 来重复执行 `n` 次。 |\n| `r` | 后跟一个字符，用指定的字符替换当前光标位置的字符。你可以在前面加上数字 `n` 来重复执行 `n`\
  \ 次。 |\n| `R` | 将你进入替换模式，在该模式下你可以覆盖从当前光标位置开始的所有字符。你可以越过当前的最后一个字符。按 Esc 键结束替换模式。\
  \ |\n\n第 502-503 页\n\n\n\n\n\n# Vi 命令行参考\n\n- `S`: 删除当前命令行行并进入插入模式以输入文本。\n- `t`\
  \ 后跟一个字符：将光标移动到当前命令行行中下一次出现的指定字符处。\n- `T` 后跟一个字符：将光标移动到当前命令行行中上一次出现的指定字符处。\n- `u`:\
  \ 撤销对命令行行进行的最后修改。如果重复执行 `u` 命令，将在修改后的命令行行和未修改的命令行行之间切换。\n- `U`: 通过撤销所有修改来恢复命令行行中的原始文本。\n\
  - `v`: 以当前命令行行的内容进入 `vi` 编辑器。然后你可以使用标准的 `vi` 命令对其进行编辑。使用 `:wq` 退出时，每行命令将按顺序执行。你可以在其前面加一个数字\
  \ `n` 来编辑历史记录中的第 `n` 行。\n- `w`: 将光标移动到命令行行中的下一个单词。你可以在其前面加一个数字 `n` 来重复 `n` 次。\n\
  - `W`: 将光标移动到命令行行中下一个由空格分隔的单词。你可以在其前面加一个数字 `n` 来重复 `n` 次。\n- `x`: 删除光标位置的字符并将其保留在删除缓冲区。你可以在其前面加一个数字\
  \ `n` 来重复 `n` 次。\n- `X`: 删除光标位置之前的字符并将其保留在删除缓冲区。你可以在其前面加一个数字 `n` 来重复 `n` 次。\n- `yy`:\
  \ 复制当前命令行行并将其保留在复制缓冲区中。\n- `Y`: 复制从光标位置到行尾的文本并将其保留在复制缓冲区中。\n- `0`: 将光标移动到命令行行第一个非空格、非制表符的字符。\n\
  - `$`: 将光标移动到命令行行的最后一个字符。\n- `-`: 与 `j` 相同。你可以在其前面加一个数字 `n` 来重复 `n` 次。\n- `+`: 与\
  \ `k` 相同。你可以在其前面加一个数字 `n` 来重复 `n` 次。\n- `0`: 将光标移动到命令行行的第一个字符。如果你在其前面加一个数字 `n`，光标将移动到命令行行的第\
  \ `n` 个字符位置。\n- `/` 后跟一个字符串并按回车键：在命令历史文件中搜索指定的字符串，范围为命令中的任意位置，方向从最近的命令到最旧的命令。\n\
  - `/^` 后跟一个字符串并按回车键：在命令历史文件中搜索位于命令开头的指定字符串，方向从最近的命令到最旧的命令。\n- `?` 后跟一个字符串并按回车键：在命令历史文件中搜索指定的字符串，范围为命令中的任意位置，方向从最旧的命令到最近的命令。\n\
  \n\n\n\n\n- `?` 后紧跟 `^` 和一个字符串，然后按回车键。\n- `^` 在命令历史文件中，按照从最旧命令到最近命令的方向，搜索命令开头匹配指定字符串。\n\
  - `~`\n- 将小写字母修改为大写字母，或反之亦然。\n- `#` 在命令行开头插入井号（`#`）并执行，使其进入命令历史文件。该命令不会被实际执行，因为开头的\
  \ `#` 符号意味着 Korn shell 将其视为注释。\n- `=` 显示与当前单词匹配的文件名。\n- `*` 将当前单词替换为以匹配当前单词开头的文件和目录列表。\n\
  - `Space` 与 `l` 相同。\n- `Enter` 执行当前命令。\n- `Control` 后紧跟字母 `l` 重绘当前行。\n- `Alias`\
  \ 你可以使用 `alias` 命令为命令字符串定义快捷方式。别名有两种类型：普通别名和跟踪式别名（tracked alias）。*跟踪式别名*会向你显示命令的完整路径。你可以单独使用\
  \ `alias` 命令来生成当前环境中设置的所有别名列表。如果你像如下所示使用 `-t` 命令，将获得所有跟踪式别名的列表：`alias -t`。\n- 你可以使用\
  \ `alias` 命令为一个命令或多个命令定义别名。在下面的示例中，为 `ls` 命令设置了别名仍为 `ls`，但带有 `-l` 选项。\n\n```\nalias=\"\
  ls -l\"\n```\n\n# 第 20 章 介绍 emacs 编辑器\n作者 Jesper Pedersen\n\n## 开始 emacs\n按键绑定\n\
  定义宏\n搜索与替换文本\n文档拼写检查\n主模式与辅助模式\n获取 emacs 帮助\n继续使用 emacs\n\n文本编辑器允许你创建和修改文本文档，这些文档包含你在键盘上输入的字母和字符。相比之下，使用文字处理器你不仅可以编辑文本，还可以通过选择字体大小和样式来更改文本的呈现方式。\n\
  \n本章将向你介绍最先进的文本编辑器：emacs。关于 emacs 有句常用俗言：*如果一件事在 emacs 中无法完成，那么它根本就不值得做*。以下一些 emacs\
  \ 基本功能列表让你大致了解它的含义：\n\n- 极其实用的撤销功能。\n- 每隔 300 个字符自动保存文件，或大约每 30 秒一次。这保证了在发生程序/电源/人为故障时，你只会丢失极少的工作。\n\
  - 通过 Info 系统（一种类似于万维网超文本格式）提供的大量在线帮助。\n- 针对不同任务的模式，包括加速工作的功能和键盘绑定（例如编写 HTML 文档、C\
  \ 程序、LaTeX 文档）。\n- 拼写检查设施（例如 `ispell` 程序）。\n- 可以大幅提高你工作速度的强大宏。\n- 增量搜索。\n- 使用正则表达式进行搜索和替换。\n\
  \n\n\n\n\n# Emacs\n\n将键盘上的按键绑定到你的特定需求上。\n\nemacs 让你能够在计算机上完成几乎任何事情（以及所有事情……）。以下列表仅列出了在\
  \ emacs 中值得执行的一些任务：\n\n- 使用 `ediff` 对文件进行差异比较\n- 查找文本文件中的差异\n- 读取/撰写邮件\n- 在其他文件系统上编辑文件\n\
  \n最重要的是，emacs 具有极高的配置配置。你可以根据自己的需求对其进行任何自定义！（本章展示了许多自定义示例供你参考。）\n\n## 技术术语\n\n为了真正向你解释\
  \ emacs，有必要介绍一些技术术语。当你理解了这些术语后，这个主题将变得更容易理解和上手。深入理解这些术语也将为你进一步构建关于 emacs 的知识打坚实的基础。掌握了以下基础术语，你就可以在\
  \ emacs info 页面中开始建设性地搜索信息：\n\n- **Buffer (缓冲区)**：缓冲区是 emacs 中的基本编辑单元。一个缓冲区对应于正在编辑的一个文本文件。虽然你可以拥有多个缓冲区，但一次只能编辑一个。不过，你可以同时显示多个缓冲区。通常情况下，一个缓冲区包含你正在编辑的文件文本。\n\
  - **Point (光标)**：光标指的是如果你向给定缓冲区插入文本，文本将出现的位置。每个缓冲区恰有一个光标。\n- **Region (区域)**：区域是指被选中的文本。许多函数可以作用于整个缓冲区，也可以仅作用于区域（例如拼写检查）。\n\
  - **Ctrl+X**：这是 `Control+X` 的含义：按下 `Ctrl` 键不放同时按下 `x`；然后释放。\n- **M+X**：这是 `Meta+X`\
  \ 的含义：按下标记为 `Meta` 的键（如果没有标记为 `Meta` 的键则按 `Alt`），并保持住同时按下 `X`；然后释放两个键。如果你的键盘没有 `Meta`\
  \ 键，或者你通过 `Telnet` 登录（此时 `Meta` 键可能不起），你可以使用替代键：`Esc+X`。按下 `Escape` 键（通常标记为 `Esc`），松开，然后按下\
  \ `X`。\n- **emacs 菜单栏**：在 `X` 环境和非 `X` 环境下运行 emacs 的区别在于窗口顶部是否存在菜单栏。然而，在较版本的 emacs\
  \ 中，即使在非 X 模式（也称为文本模式）下运行时也可能发现菜单栏。如果你的 emacs 版本早于 `19.22`，你应该考虑更新你的 emacs 安装。新版本具有许多让升级非常值得的功能。\n\
  \n## 启动 emacs\n\nemacs 可以在有或没有 `X` 的情况下运行。本章假设你拥有 `X` 窗口。如果没有 `X` 窗口也不要担心；以下信息并不代表你拥有它。\n\
  \n要启动 emacs，只需输入 `emacs`。这将弹出一个类似于图 20.1 的窗口。工具栏位于窗口顶部。你可以像使用 Windows 中的工具栏一样使用它。它的内容会根据你正在的操作而变化。\n\
  \n工具栏下方是缓冲区。起初它包含一些启动信息。当你开始输入时，缓冲区的内容会被替换为你的文本。\n\n窗口底部是状态行，采用反色显示。在 emacs 会话开始时，状态栏包含以下信息：\n\
  \n- 文本 `emacs:` 的左侧有五个横线。这表示缓冲区已与磁盘上的文件同步（即缓冲区的内容与磁盘上的文件内容一致）。如果缓冲区内容被更改，五个横线将被替换为文本\
  \ `--`。\n- 文本 `emacs:` 旁边是缓冲区名称。因为你还没有加载任何文件，该缓冲区只是名为 `scratch` 的虚拟缓冲区。当你打开一个文件时，文件名将显示在这里。\n\
  - 接下来是关于你启动了什么模式的信息（文本 `Fundamental`）。例如，如果你加载了 HTML 模式，这里可能是 HTML。\n\n\n\n\n\n\
  接下来是点所在的行号（文本 `L1`）。\n\n最后，你会看到关于你正在查看缓冲区哪个部分的信息。`All` 表示整个缓冲区可见。其他选项有：`Bot` 文本底部；`Top`\
  \ 文本顶部；以及缓冲区向下 `8%` 处。\n\n状态行下方是一个空行。当 emacs 需要你提供信息时，此行用于与你进行交互。\n\n# 打开/保存文件以及退出\
  \ emacs\n\n## 如何使用鼠标打开文件\n\n1. 从 `Files`（文件）菜单中选择 `Open File`（打开文件）。\n2. 输入你想要编辑的文件名。（如果你输入了一个不存在的文件名，将创建一个新文件；然后将打开这个新文件。）\n\
  3. 现在文件已加载到缓冲区中，你可以尽情意地编辑它。要在缓冲区内移动，请使用光标方向键。\n\n当你选择菜单栏中的某项时，应该非常关注项目旁边列出的快捷键。如果你学会了这些快捷键，你与\
  \ emacs 的交互速度将大幅提高，从而能够完成更多工作。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n## 输入命令和插入文本\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n与 `vi` 不同，emacs 没有“编辑模式”（Editing mode）和“命令模式”（Command mode）。在 emacs 中，你使用 `Ctrl`\
  \ 键和 `Meta` 键输入命令；直接输入即可插入文本。\n\n## 如何不用鼠标打开文件\n\n1. 按下 `Ctrl+x, Ctrl+f`。\n2. 输入你想要编辑的文件名。\n\
  3. 完成编辑后，你可以按 `Ctrl+x, Ctrl+s` 保存文件，或者从菜单栏中选择 `Files, Save Buffer`（文件，保存缓冲区）。\n\
  4. 退出 emacs，从 `Files` 菜单中选择 `Exit Emacs`，或使用快捷键 `Ctrl+x, Ctrl+c`。\n\n## 使用撤销功能\n\
  \nemacs 拥有非常强大的撤销机制，当你后悔某次修改时可以提供帮助。要撤销修改，请进入 `Edit`（编辑）菜单并选择 `Undo`。（绑定为 `Ctrl+_`；即按\
  \ Control 再按下划线）。如果你连续执行多次撤销操作，将撤销相应数量的修正。请注意，emacs 可能会将多个文本插入命令合并为一个实体。这意味着一个撤销命令可能会删除几个单词。\n\
  \n关于撤销功能一个非常重要的点是：撤销操作也可以被“撤销”！（也就是说，撤销和重做是相同的功能。）通过一个例子可以说明这一点。\n\n### 撤销命令示例\n\
  \n1. 启动 emacs。\n2. 在不同行上输入 `1`、`2`、`3`、`4`。\n3. 现在不断撤销直到删除了 `3` 和 `4`。\n4. 输入 `5`。\n\
  5. 现在开始撤销并观察。你会发现 `5` 被删除了，然后 `3` 和 `4` 再次插入。如果你继续撤销，你会看到 `4`、`3`、`2` 以及最后的 `1`\
  \ 将被删除。\n\n## 剪切和粘贴\n\n计算机优于普通打字机的功能之一是剪切和粘贴，这允许你在文档中移动文本、将文本复制到多处等。要标记一段文本，你可以使用鼠标或键盘。\n\
  \n### 使用鼠标复制/剪切文本\n\n1. 将鼠标悬停在你想要标记的文本的开头。\n2. 按住鼠标左键。在按住鼠标键的同时，拖动到选择结束的位置。\n3.\
  \ 放开鼠标键。\n4a. 如果你想将文本复制到剪贴板（且不想从缓冲区删除它），选择 `Edit` 菜单并点击 `Copy`。\n4b. 如果你想将文本剪切到剪贴板（并从缓冲区删除删除），选择\
  \ `Edit` 菜单并点击 `Cut`。\n\n### 使用键盘复制/剪切文本\n\n1. 将光标（记住是插入光标）置于想要选择的文本开头。\n\n\n\n\n\
  \n# 使用鼠标\n\n你只能在 emacs、Xemacs 或在 X 环境下的较新版本的 emacs 中使用鼠标。\n\n1. 按 `Ctrl+spacebar`（即\
  \ Control 键和空格键）。在缓冲区底部，会出现 `Mark`（标记）设置的文本。\n2. 移动到你想让选择结束的位置。\n3a. 如果你想将文本复制到剪贴板，请按\
  \ `M+w`（`M` 是 Meta 键）。\n4b. 如果你想将文本剪切到剪贴板，请按 `Ctrl+w`。\n\n虽然记住这些键绑定似乎很困难，但你应该非常努力地去尝试；这将使你与\
  \ emacs 的交互变得快得多。例如，当你想要剪切和粘贴时，你就不再需要去拿鼠标了。\n\n## 使用鼠标将最近一次选择的内容粘贴到缓冲区\n\n1. 将鼠标悬停在你想要粘贴文本的位置。\n\
  2. 按下鼠标中间键。\n\n## 使用键盘将最近一次选择的内容粘贴到缓冲区\n\n1. 将光标置于你想要粘贴的位置。\n2. 按 `Ctrl+y`。\n记住，emacs\
  \ 保存了撤销的多个步骤。对于选择也是如此：你可以粘贴一个不是最近一次选择的内容。\n\n## 使用鼠标将不是最近一次选择的内容粘贴到缓冲区\n\n1. 将光标置于你想粘贴文本的位置（通过光标方向键移动，或者在该位置点击鼠标左键）。\n\
  2. 从 `Edit`（编辑）菜单中选择 `Select`（选择）和 `Paste`（粘贴），然后选择你想粘贴的选择项。\n\n## 使用键盘将不是最近一次选择的内容粘贴到缓冲区\n\
  \n1. 将光标置于你想要粘贴的位置。\n2. 按 `Ctrl+y` 粘贴最近一次选择。\n3. 现在，你可以通过按 `M+y` 遍历旧选择列表，直到到达你想要的选择项。\n\
  \n## 备份\n\nEmacs 会定期将你的缓冲区保存到磁盘，以确保如果你在退出前不小心没有保存缓冲区，该内容也不会丢失。当 emacs 打开一个备份文件更更新的文件时，它会建议你从自动保存的文件恢复数据。自动保存的文件与原始文件同名，区别是自动保存的文件名开头和结尾都有\
  \ `#` 字符。如果你收到了备份通知，使用 `diff` 命令查看原始文件和自动保存文件之间的差异可能是个好主意。\n\n## 恢复自动保存的文件\n\n1.\
  \ 按 `M+x`。\n2. 输入 `recover-file` 并按回车。\n3. 输入文件名并按回车。\n4. Emacs 会询问你是否确定这么做。如果是，输入\
  \ `yes` 并按回车。\n\n## 键绑定\n\n你现在脑中可能有三个重要的问题：\n\n1. 为什么这些绑定如此困难且如此不符合直觉？\n2. 我有机会学会所有这些的绑定吗？\n\
  3. 我可以更改绑定，例如将撤销功能绑定到 `Ctrl+backspace` 吗？\n\n简单的回答是：1) 你没有更重要的事情要担心吗？2) 可以；3) 可以。下面是更详细的回答。对于第一个问题，即你是否会学会所有不同的绑定，我可以给出肯定的回答。只要你强制自己在有替代方案时不使用鼠标，这会随着时间的推移而变得自然。\n\
  \n\n\n\n\n这些绑定的原因并不十分清晰，但一个合理的猜测是，因为 Emacs 并不是从零开始设计的，而是多年开发的结果。由于向后兼容性问题，键位才变成了现在这样。不过，似乎有一套通用计划：\n\
  \n键盘上所有的字母、数字和符号，如果在不按下 `Control` 或 `Meta` 键的情况下按下，将插入该按键上给出的标签。\n\n在按下 `Control`\
  \ 或 `Meta` 键时，可以使用非常常用的函数。（例如，`go to end of line` 绑定到 `Ctrl+e`，`undo` 绑定到 `Ctrl+_`（即\
  \ Control 和下划线），`paste` 绑定到 `Ctrl+y`。）\n\n如果 `Control` 前缀绑定到一个处理特定按键字符的函数，那么 `Meta`\
  \ 前缀将作用于单词（如果这对于该函数有任何意义的话）。同样，如果 `Control` 前缀作用于行，那么 `Meta` 前缀将作用于句子。示例包括：`Ctrl+t`\
  \ 交换两个字符；`M+t` 交换两个单词；`Ctrl+e` 将光标移动到行尾；以及 `M+e` 将光标移动到句尾。\n\n较少使用的函数通过前缀 `Ctrl+x`\
  \ 绑定。示例包括：`Ctrl+x, Ctrl+c` 退出 Emacs；`Ctrl+x 2` 将窗口分成二，每个窗口一个缓冲区。\n\n特定模式下的函数以 `Ctrl+C`\
  \ 为前缀。\n\n极少使用的、或认为不适合绑定到键盘上的函数完全没有绑定，但可以通过按下 `M+x` 并输入函数名称来访问。\n\n## 如何查看所有键盘绑定列表\n\
  \n1. 按下 `Ctrl+h`, `Ctrl+B`。这应该分割窗口。在其中一个窗口中将出现所有绑定的描述。\n2. 按下 `Ctrl+x, o`。这将选择移动到包含描述的窗口。\n\
  3. 使用方向键浏览文本。\n4. 完成后，按下 `Ctrl+x, 0`（零）来隐藏缓冲区。\n5. 当你找到一个听起来有趣的函数时，可以获取它的更多信息：\n\
  \n### 如何查看函数的描述\n\n1. 按下 `Ctrl+h, f`。\n2. 输入你想查询信息的函数名称（例如，`open-line`）。\n3. 完成后按下\
  \ `Ctrl+x, 1` 隐藏窗口。（这次是 `Ctrl+x, 1`，因为选择器在你想要保留的窗口中。）\n\n现在我们几乎准备好按照你的个人喜好重新绑定键盘了。然而，在此之前，了解特定按键存在哪些绑定是非常用的。这些信息可以通过按下\
  \ `Ctrl+h, c` 然后按下你想考虑的按键来获取。此操作将显示绑定在该按键上的函数名称。要获取有关该函数的更多信息，请遵循之前的说明。\n\n### 如何重新绑定按键\n\
  \n1. 按下 `M+x`。\n2. 输入 `global-set-key` 在所有缓冲区中绑定按键，或输入 `local-set-key` 只在给定缓冲区中绑定按键。\n\
  3. 按下 `Enter`。\n4. 按下你想重新绑定的键。\n5. 输入你想绑定到该按键的函数名称。\n\n现在你可以按照自己的意愿绑定键盘了。然而，你仍然需要学习如何将绑定从会话保存下来。位于你主目录下的名为\
  \ `.emacs` 的文件是 Emacs 的设置文件。该文件中的信息在每次启动 Emacs 时都会被读取。文件使用一种名为 `emacs LISP` 或简称\
  \ `elisp` 的语言编写。以下描述仅适用于全局键绑定。绑定本地键要困难得多，因为需要某种对其适用于哪些缓冲区的描述。这超出了本书的范围。\n\n### 如何将按键绑定保存到\
  \ *.emacs 文件\n\n1. 按照之前的描述创建键绑定。\n2. 按下 `M+x`。\n3. 输入 `repeat-complex-command` 并按下\
  \ `Enter`。\n4. 使用上/下方向键浏览历史列表，或者按下 `M+p` 和 `M+n` 直到找到以 `(global-set-key.` 开头的一行。\n\
  5. 将此行复制到剪贴板。\n6. 按下 `Ctrl+g`。（这会让你的扬声器发出哔的一声，缓冲区应该消失。）\n\n\n\n\n7. 打开你主目录下的 `.emacs`\
  \ 文件。\n8. 到该文件的合适位置并粘贴。这应该会插入文本（`global-set-key`）。\n9. 保存文件。\n\n## 使用 Control+Shift\
  \ 进行键绑定\n\n不同的模式可能会重新绑定按键，从而无视你已经绑定的键。通过使用 `Control+Shift` 作为你自己的键绑定的前缀，可以避免这种情况。\n\
  \n## 定义宏\n\n计算机比人类更擅长的主要事情之一就是处理琐碎、重复的工作。emacs 拥有宏可以帮助你完成此类任务。`macro`（宏）是一种允许你记录一系列按键序列以供以后播放的功能。\n\
  \n### 如何录制宏\n\n1. 按 `Ctrl+x(`。（这开始录制。）\n2. 执行你想记录的按键操作。\n3. 按 `Ctrl+x)`。（这结束录制。）\n\
  \n如果你想同时保留多个定义的宏，你需要为它们命名。\n\n### 如何为宏命名\n\n1. 按 `M+x`。\n2. 输入 `name-last-kbd-macro`\
  \ 并按回车。\n3. 为新定义的宏输入一个名称。\n\n你可以通过按 `Ctrl+x, e` 调用上一个定义的键盘宏（无论是否命名）。你可以通过按 `M+X`\
  \ 输入其名称并按回车来调用命名的键盘宏。如果你为宏命了名，就可以将其绑定到按键上（如前一节所述）。\n\n宏的生存周期仅与 emacs 同等。当你关闭 emacs\
  \ 时，除非将它们保存到 `.emacs` 文件，否则所有定义的宏都会消失。\n\n### 如何将宏保存到 *.emacs* 文件中\n\n1. 如前所述定义宏。\n\
  2. 如前所述为定义的宏命名。\n3. 如果你想将宏绑定到按键上，请按前一节所述操作。\n4. 打开你的 `.emacs` 文件并进入其中的合适位置。\n5.\
  \ 按 `Ctrl+1, M+x`。\n6. 输入 `insert-kbd-macro` 并按回车。\n7. 输入定义的宏名称并按回车。\n\n### 重复宏\n\
  \n当你定义了一个宏后，你可能经常使用它（甚至可能几百次）。为了实现这一点，你可以使用 emacs 的重复功能。如果你按住 `Control` 并输入一个数字（保持\
  \ `Control` 按下状态），则后续命令将执行相应的次数。（这并不是 100%准确的，但在大多数情况下是正确的。）因此，如果你想重复执行 20 次宏，请按\
  \ `Ctrl+2 Ctrl+0 Ctrl+x, e`。（这是 `Control 20`，以及执行宏的键盘前缀。）\n\n通常，你可能希望在几行上执行宏。一个例子是在文本区域的每行开头插入\
  \ `>`。\n\n### 使用重复宏在区域的每行开头插入\n\n1. 录制一个在行首插入 `>` 的宏。\n2. 转到该区域的起始行。\n3. 按你为此宏绑定的按键（例如\
  \ `Control+spacebar`）。\n4. 转到该区域的末尾。\n5. 按 `M+x`。\n6. 输入 `apply-macro-to-region-lines`\
  \ 并按回车。\n\n### 使用鼠标选择\n\n\n\n\n\n你也可以通过鼠标选择区域来完成第 24 步。\n\n如果你需要创建一个涉及插入数字（增加或减少）的宏，请访问\
  \ `ftp://archive.cis.ohiostate.edu/gnu/pub/emacs/elisp-archive/functions/counter.el.Z`。这里不再对其进行描述，因为它不是标准\
  \ emacs 发行版的一部分。然而，它的安装非常简单，而且证明极其有用。如果前面的站点很忙，请尝试镜像站点 `ftp://src.doc.ic.ac.uk/gnu/emacsBits/elisp-archive/`。\n\
  \n如果你发现自己正处于一种键盘声音发出 *Tik taak tik tik . . . Tik taak tik tik . . . Tik taak tik\
  \ tik* 的情况下，那么可能值得考虑创建一个宏！\n\n# 搜索和替换文本\n\n当你编写程序或文档时，可能经常想在文档中搜索特定的文本。emacs 有几个用于搜索文本的函数。本节将描述这些函数。\n\
  \n另一个你经常发现自己的任务是将某些文本替换为其他文本。共有三种搜索方式：\n\n## 普通搜索\n在此类搜索中，你输入想要搜索的文本；emacs 将跳转到该文本首次出现的地方。然后你可以要求它跳转到第二次、第三次出现的地方，依此类推。\n\
  \n## 增量搜索\n在此类搜索中，emacs 在你输入第一个字母时就会开始搜索。随着你输入更多字母，emacs 会在文档中进一步搜索，以反映你对所搜索内容信息水平的增加。\n\
  \n## 正则搜索\n在此类搜索中，你可以像在 shell 中那样添加通配符（尽管通配符是通过一种称为正则表达式的特殊方式构造的）。\n\n有两种替换文本的方法：\n\
  \n### 普通搜索和替换\n在这种策略中，你输入想要替换的文本以及想要替换进去的文本。然后对于每个匹配项，emacs 会询问你是否想要替换该匹配项。\n\n\
  ### 正则搜索和替换\n在正则搜索和替换中，你可以使用正则表达式来替换文本。例如，你可以将 `.*` 替换为 `...`。\n\n# 增量搜索\n\n最常用的搜索类型是增量搜索。因此，让我们从这种搜索开始吧。\n\
  \n要使用增量搜索向前搜索，请按下 `Ctrl+s`。要向后搜索，按下 `Ctrl+r`。在你按下 `Ctrl+s` 或 `Ctrl+r` 后，你可以输入你正在搜索的字母。每当你添加一个新字母，emacs\
  \ 都会测试找到的单词是否匹配（通过使用之前的字母进行搜索）。如果不符合，emacs 将在你的文档中继续搜索。当你添加了足够数量的字母后，可以按下 `Ctrl+s`\
  \ 或 `Ctrl+r` 使用目前已输入的字母继续搜索。通过这种方式，你就可以在输入字母和按下 `Ctrl+s` 或 `Ctrl+r` 之间切换。\n\n增量搜索比普通搜索快得多，因为你不需要输入整个单词。例如，如果你正在搜索\
  \ `miscellaneous` 这个词，只需输入 `misc` 可能就足够。如果 `misc` 在文档中出现多次，在普通搜索中你可能需要重新开始。但在增量搜索中，你只需要输入字母\
  \ `e`，这将让你搜索 `ce`（这不会匹配 `calculation` 单词）。\n\n在一种情况下，普通搜索优于增量搜索，即你的剪贴板上有要搜索的单词。\n\
  \n如何使用普通搜索\n1. 按下两次 `Ctrl+s` 或 `Ctrl+r` 进行普通向前搜索；相应的进行向后搜索。\n2. 输入你想要搜索的字母。或者，如果字母位于剪贴板上，按下\
  \ `Ctrl+y`。\n\n## 普通搜索和替换\n\nemacs 有一个将一个字母序列替换为另一个的函数。该函数替换从缓冲区当前位置到缓冲区末尾的文本。\n\
  \n如何搜索和替换\n1. 按下 `M+%`。（这是 `query-replace` 函数。）\n2. 输入你想要替换的文本，并按回车。\n3. 输入你想要插入的文本，并按回车。\n\
  \n\n\n\nemacs 现在将跳转到文本的首次出现处，并询问你想做什么。你有以下几种选择：\n\n- 按 `y` 替换该匹配项并跳转到下一个。\n- 按 `n`\
  \ 跳过该匹配项并跳转到下一个。\n- 按 `!` 替换该匹配项以及后续之后的所有匹配项。\n- 按 `q` 停止替换。\n- 按逗号键（（`）替换当前匹配项，但不会立即移动光标点。（要重新开始替换，请按\
  \ `y`。）\n\n# 正则表达式搜索与替换\n\n有两个用于正则表达式增量搜索的函数，分别绑定到 `Ctrl+M+s` 和 `Ctrl+M+s` 用于正向和反向搜索。还有一个名为\
  \ `query-replace-regexp` 的函数（未绑定到任何按键），用于使用正则表达式进行搜索和替换。\n\n正则表达式超出了本书的范围。因此，我不会解释所有细节，而是向你展示一个它的强大示例。更多信息，你应该查阅\
  \ info 页面。\n\n## 示例：将 `printf(''. . .')` 替换为 `write ...`\n\n假设你想将所有模式 `printf(\"\
  \ . . . \")` 的出现处替换为 `write . . .`。三个点代表的文本在 `write` 之后应与引号之间的文本相同。也就是说，`printf(\"\
  Hello world\")` 应该被替换为 `write Hello world`。普通的替换在这里是不行的，因为你可能期望模式 `\")` 出现在几处，但那里并不匹配\
  \ `printf(\".`。\n\n首先，我们必须创建一个匹配 `printf(\"...\")` 的正则表达式，其中三个点可以是任何内容。这是通过正则表达式\
  \ `printf([^*)` 完成的。好的，让我们一步步来：\n\n1. `\\b` 匹配单词边界。这样我们的替换就不会替换掉例如 `sprintf(...)`，因为在开头有一个\
  \ `s`。\n2. 这只是要匹配的普通文本。\n3. `(` 开始一个正则分组。如果我们希望在替换中引用括号之间的文本，这是必须的。\n4. 方括号 `[]`\
  \ 表示一个要匹配的字符列表。列表开头的 `^` 字符表示该列表应该是被取反的（也就是说，它是一个不应该包含的字符列表）。总而言之，这个元素表示可以匹配不同于右括号的单个字符。\n\
  5. `*` 表示前一个元素可以被匹配任意次数。配合方括号，这表示可以读取任意数量的字符，只要它不是结束括号。\n6. `)` 结束第 3 部分开始的分组。\n\
  7. 要匹配的普通文本。\n8. `\\b` 匹配单词边界（见第 1 部分）。\n\n正则表达式尝试匹配尽可能多的内容。因此，如果第 4 部分没有规定结束括号是非合法的，它将从第一个\
  \ `printf` 一直读取到最后一个 `printf`（单个点号可以匹配任何字符）。\n\n现在我们准备好进行替换了。将 `printf ...` 替换为\
  \ `write ..`\n\n1. 按 `M+x`。\n2. 输入 `query-replace-regexp` 并按回车。\n3. 输入 `printf([^*)`\
  \ 并按回车。\n4. 输入 `write\\1` 并按回车。\n\n现在 emacs 将询问你是否替换 `printf ...` 的首次出现。注意替换字符串中的\
  \ `\\1`。它将展开为被替换文本中括号内匹配到的文本。\n\n## 编译匹配项列表\n\n有时你想看到匹配给定文本搜索的所有行列表。这可以通过函数 `list-matching-lines`\
  \ 实现。它没有绑定到任何按键；因此，访问它需要使用 `M+X`。如果给此函数提供一个数字前缀（通过之前描述的重复计数方式，按住 Control 并输入数字），将显示相应数量的行作为上下文。\n\
  \n### 如何获取所有匹配项列表\n\n1. 如果你想看到上下文（即匹配行周围的行），按住 Control 键，输入要作为上下文显示的行数。\n2. 按 `M+x`。\n\
  \n\n\n3. 输入 `list-matching-lines` 并按回车。\n4. 输入你正在查找的文本。（从技术层上说，这实际上是一个正则表达式。只要你不是搜索\
  \ `+`、`*`、`(`、`)`、`\\|`，你就永远不会察觉这一点。）\n\nemacs 现在会将窗口一分为二，你将在其中一个窗口中看到列表。通过点击其中一个匹配项的鼠标中间键，另一个窗口将更新视图以显示该匹配项。\n\
  \n完成后，你可以通过按下 `Ctrl+x, 1`（如果你位于想要保留的窗口中）或 `Ctrl+x, 0`（如果你位于想要移除的窗口中）来关闭带有匹配列表的窗口。\n\
  \n图 20.2 显示了在上下文 1 中创建的此类列表示例。\n\n### 搜索中的大小写问题\n\nemacs 是高度可配置的。你已经看到如何将键盘绑定到你的个人偏好。内置函数可以使用变量来控制，这些变量会指示它们如何工作。\n\
  \n有一个变量可以告诉 emacs 搜索应该是区分大小写还是不区分大小写。如果其值设置为 `t`（elisp 中的 True），搜索将不区分大小写。然而，如果将其设置为\
  \ `nil`（elisp 中的 False），搜索将区分大小写。\n\n![8227-0526a.gif](img/d221025122760f0ffc16580aa2f2e96d.gif)\n\
  图 20.2 使用 *list-matching-lines* 显示匹配列表。\n\n### 启用不区分大小写的搜索\n\n1. 按 `M+x`。\n2. 输入\
  \ `set-variable` 并按回车。\n3. 输入 `case-fold-search`。\n4. 输入 `t` 以启用不区分大小写的搜索，或输入 `nil`\
  \ 在搜索中使用大小写。\n5. 按回车。\n\n### 拼写检查\n\nemacs 有一个非常实用的接口叫做 `ispell`：拼写检查器。如果你的系统中没有安装\
  \ `ispell`，可以通过 FTP 从 `ftp://ftp.gnu.org/pub/gnu/` 下载它。\n\n基本上，emacs 提供了三个函数：`ispell-word`（绑定到\
  \ `M+$`）、`ispell-region` 和 `ispell-buffer`。\n\n要启动 `ispell`，按 `M+x` 并输入其中一个函数的名称（你以前见过这个过程，记得吗？）。现在\
  \ emacs 将开始拼写检查。如果你只检查单个单词且单词是正确的，它会显示 `miscellaneous is correct`。如果你检查一个区域或整个缓冲区，emacs\
  \ 在完成缓冲区处理后显示 `Spell-checking done`。\n\n在出现拼写错误的情况下，emacs 会高亮显示在字典中未找到的单词，并提供可能的选项列表。你可以通过按下单词旁边列出的数字从列表中选择正确的单词，如图\
  \ 20.3 所示。\n\n![8227-0527a.gif](img/57871d5158c65c4bac18e73c9e6f16ad.gif)\n图 20.3\
  \ 使用 emacs 进行拼写检查。\n\n如果 emacs 没有猜到正确的单词，你可以通过按下 `r`（`r` 代表 replace）、输入单词并最后按回车手动输入。如果该单词在整个文档中可能会被多次拼写错误，那么按下大写的\
  \ `R` 可能更好的主意，它会要求替换，然后执行 `query-replace`。这样你就不需要为每个拼写错误的出现输入替换内容。\n\n相反，如果该单词是一个拼写正确的新表达式，你可以按下空格键接受本次的单词，按下\
  \ `a` 在整个缓冲区生命周期内接受该单词，或按下 `i`（`i` 代表 insert）将单词插入你的个人字典中。\n\n使用 `ispell` 还有额外的选项。要查看这些选项，按\
  \ `Ctrl+h, f` 并输入 `ispell-help`。\n\n### 主模式与要模式\n\n当你编写 HTML 文档时，你会发现希望 emacs 以一种方式配置。当你编写\
  \ C++ 程序或普通信件（即发给你母亲的生日信）时，你会希望它以完全不同的方式配置。\n\n两种配置之间的差异示例包括：\n\n- 文本缩进的方式。（在 C++\
  \ 模式下，缩进级别在左括号处增加，在右括号处减少。）\n- 绑定到 `Ctrl+c` 前缀键的函数集。\n- 菜单的内容。（C++ 模式添加了一个名为 C++\
  \ 的菜单项。）\n\n\n\n\n所有此类配置都保存在名为 `modes` 的包中。大多数编程语言都存在相应的模式；例如 C、C++、Java、Python、TCL、汇编语言、HTML、LISP、TeX、AmsTeX、LaTeX\
  \ 等等。\n\n针对特定 `language` 的模式被称为 `major modes`（主模式）。另一种类型的模式（称为 `minor modes`，次要模式）是那些对\
  \ emacs 行为进行细微更改的模式。你一次只能加载一个主模式，但可以同时加载许多次要模式。你想要加载的次要模式集在不同的主模式下可能是相同的。\n\n次要模式的示例包括：\n\
  \n*   **自动填充模式 (Auto-fill mode)**：开启此次要模式时，emacs 会自动插入换行符。你可以将光标移动到该列并按下 `Ctrl+x,\
  \ f` 来配置换行符发生的列位置。\n*   **鼠标避让模式 (Mouse-avoidance mode)**：当加载此次要模式时，如果光标太近，光标会自动移开。\n\
  *   **字体锁定模式 (Font-lock mode)**：当启用 `Font-lock mode` 时，文本会在你输入时进行字体化。\n*   **自动压缩模式\
  \ (Auto-compress mode)**：当此次要模式激活时，emacs 会自动压缩和解压文件。\n*   **列数模式 (Column-number\
  \ mode)**：启用此次要模式时，状态栏会显示列数。\n\n要查看主模式列表，请参考标题为 Getting Help About emacs\" 的章节。\n\
  \n### 加载次要模式\n\n你可以通过按下 `M+X` 并输入其名称来切换次要模式的开启或关闭。\n\n次要模式有两种类型：独立于缓冲区的和依赖缓冲区的。在前面的列表中，`Mouse-avoidance\
  \ mode`、`Auto-compress mode` 和 `Column-number mode` 是独立缓冲区的；`Auto-fill mode` 和 `Font-lock\
  \ mode` 是依赖缓冲区的。\n\n你希望默认可用的独立缓冲区次要模式可以在 `.emacs` 文件中通过在括号内输入模式来启动。考虑以下示例：\n\n```lisp\n\
  ; 分号是 .emacs 文件中的注释\n(mouse-avoidance-mode) ; 以其默认设置启动 mouse-avoidance-mode\n; 另一种启动方式，这次带有一个参数，描述了它应该如何启动。只需使用这些命令中的一个。\n\
  mouse-avoidance-mode 'exile\n```\n\n某些次要模式可能有一个可选参数（如所述的 `Mouse-avoidance mode`）。要查看给定模式是否有任何选项，你应该查看带有模式名称的函数描述（使用\
  \ `Ctrl+f, f`）。\n\n依赖缓冲区的次要模式默认启动要困难一些。有一种在主模式启动时启动次要模式的通用方法，即使用 `hooks`（钩子）。钩子是在主模式启动时可以调用的额外函数。每个主模式都有一个名为\
  \ `mode-name-hook` 的钩子。在使用 Text mode 时，在 `.emacs` 文件中启动 `Auto-fill-mode` 所需的代码如下：\n\
  \n```lisp\n(add-hook 'text-mode-hook (function\n    (lambda () (auto-fill-mode 1))))\n\
  ```\n\n### 加载主模式\n\n你仍然可以通过按下 `M+X` 并输入其名称为给定缓冲区选择主模式。然而，你无法通过这种方式关闭它（因为缓冲区始终应该恰好有一个主模式）。因此，要关闭一个主模式，你必须开启另一个。（存在一种几乎没有任何功能的主模式，被称为\
  \ Fundamental mode。你可以切换到这种模式来关闭特定的模式。）\n\n你可以通过在文件的第一行放置模式来告诉 emacs 启动主模式，如下所示：\n\
  \n```c++\n// mode++\n```\n注意行开头的两个斜杠，这告诉 C++ 编译器不要尝试编译该指令。\n\n另一种让 emacs 自动启动主模式的方法是根据文件名告诉它启动哪种模式。通过这种方式，你可以告诉\
  \ emacs 以 `.c` 结尾的文件应该以 C 启动，以 `.doc` 结尾的文件应该以 Text 模式启动。这是通过设置变量 `auto-mode-list`\
  \ 实现的。你可以可以使用示例作为模板：\n\n```lisp\n(setq auto-mode-list (append (list\n  (\"\\\\.html\"\
  \ . html-helper-mode)\n  (\"Makefile\" . makefile-mode))\n  auto-mode-list))\n```\n\
  \n\n\n\n\n在你开始以这种方式定义许多模式之前，先检查变量 `auto-mode-alist` 可能值得的，因为许多模式指定符是默认定义的。可以通过按下\
  \ `Ctrl+h`、`v`，输入 `auto-mode-alist` 然后按下 `Enter` 来检查。\n\n# 获取关于 emacs 的帮助\n\nemacs\
  \ 有许多在线帮助，范围从按键绑定的描述到 emacs 的通用介绍不等。它们的共同点是可以通过按键前缀 `Ctrl+h` 获取。在以下列表中，你可以获得可用信息的概览：\n\
  \n- `Ctrl+h`, `Ctrl+h` (描述帮助)。这是你需要记住的最重要的按键绑定。它是所有按键绑定索引的入口。\n- `Ctrl+h, f` (描述函数)。给定一个函数名，它将提供有关该函数的文档。（我们已经见过许多此类示例了。）\n\
  - `Ctrl+h, v` (描述变量)。给定一个变量名，该函数将描述该变量。变量用于配置 emacs 在不同情况下的工作。\n- `Ctrl+h, c` (描述按键)。通过此函数，你可以发现给定按键的功能。\n\
  - `Ctrl+h, w` (命令所在)。当你发现一个喜欢的函数时，你可能想知道它是否绑定到了某个键上，如果是，绑定在哪里。此函数可以帮助完成此任务。\n- `Ctrl+h,\
  \ a` (查找)。当你搜索执行特定任务的函数时，此函数非常有用。它允许你输入命令名称的一部分，然后它将列出所有匹配项。\n- `Ctrl+h, p` (查找软件包)。此函数允许你根据类别搜索软件包和模式。这是寻找增强\
  \ emacs 配置项的极佳方法。\n- `Ctrl+h, i` (加载 info)。这会加载 info 页面。见下节。\n\n## Info 页面\n\n如果你按下\
  \ `Ctrl+h, i`，你将进入巨大的信息世界，即 info 页面。info 页面类似于 Web 上使用的 HTML 页面，不同文档之间有超链接。如果你通过按下问号\
  \ (`?`) 开始这段旅程，将进入一个包含 info 系统中按键绑定的页面。以下是四个重要的操作：\n\n- 如果你在引用上方按下 `Enter`，你将进入它所引用的文档。（引用是**粗体**的。）如果你有这样的鼠标，也可以通过点击引用上方的鼠标中间键跟随超链接。\n\
  - 当你跟随超链接后，可以按下 `l` 回到来源文档。（这是字母 `l`。）\n- info 页面像书一样组织，具有顺序页面（这与 HTML 文档不同，HTML\
  \ 文档的给定页面可能有多个“下一页”）。通过这种方式，你可以逐页阅读 info 页面。你可以通过 `n,` 进入下一页，通过 `p` 回到上一页。\n- 如果你按下\
  \ `i`,`，将会被要求在给定的 info 页面集的索引中查找一个单词。接下来，将加载描述该单词的页面。\n\n图 20.4 显示了一个 info 页面的示例。在第一行，你可以看到指向上一页（按页面顺序）和上方页面的引用。注意，没有\
  \ `Next` 页面；这是该章节的最后一个。文本 `Entering emacs` 是一个超文本引用，它被高亮显示是因为在取截图时鼠标悬停在文本上。窗口底部有四个指向子章节的引用。\n\
  \n![8227-0533a.gif](img/e8b99bb3b5ed3fe0e2724cc4e56e59c8.gif)\n\n## 继续使用 emacs\n\
  \n在 Web 上，你可以在 `http://www.imada.dk/Technical/Refcards/` 找到 emacs 的参考卡，这可能帮助你记忆所有的按键绑定。（Jesper\
  \ K.）\n\n我写了一个程序，我认为它对 emacs 初学者非常有价值。它被称为 Dotfile Generator，是一个帮助你设置许多 emacs 变量的配置工具。Dotfile\
  \ Generator 可以从它的首页 `http://www.imada.dk/~blackie/dotfile` 下载。\n\n在 `ftp://ftp.gnu.org/pub/gnu/`\
  \ 你可以找到两个关于 elisp 的手册：一本名为 `elisp-manual` 的参考手册和一本名为 `emacs-lisp-introduction` 的介绍。（该介绍是给编程新手的！）\n\
  \n## 额外的 emacs 软件包\n\n你已经看到了 emacs 的许多功能。然而，它最强大的功能之一仍待探索。也就是说，emacs 具有使用用户代码进行扩展的能力。在早之前的一个章节中，你已经看到如何在\
  \ `.emacs` 文件中跨会话保存你的按键绑定和宏。你还可以编写完全新的函数，这些函数可以通过 `M+X` 和另一个绑定的键来访问。\n\n\n\n\n\n\
  这种能力从字面上讲是用户共享的。许多人已经开发了与 emacs 一起使用的额外功能，其中许多功能已经直接随 emacs 一起发行了。在网络上，你可以找到一千多个供\
  \ emacs 使用的包。请查看以下地址：`ftp://archive.cis.ohio-state.edu/pub/gnu/emacs/elisp-archive`。这些包包含了主模式（major\
  \ modes）、次模式（minor modes）以及大量的用户函数。\n\n### 文中未提到的实用 emacs 函数列表\n\n表 20.1 列出了 emacs\
  \ 函数（我相信它们非常有用）。\n\n#### 表 20.1 适用的 emacs 命令。\n\n| 函数 | 绑定的按键 | 描述 |\n| :--- | :---\
  \ | :--- |\n| `downcase-word` | `M+l` | 将从起始点到单词末尾的所有字母转换为小写。 |\n| `capitalize-word`\
  \ | `M+c` | 将首字母设为大写，单词其余部分设为小写。 |\n| `upcase-word` | `M+u` | 将光标点到单词末尾的所有字母转换为大写。\
  \ |\n| `beginning-of-line` | `Ctrl+a` | 将光标移动到行首。 |\n| `end-of-line` | `Ctrl+e`\
  \ | 将光标移动到行尾。 |\n| `goto-line` | 未绑定 | 询问用户行号并跳转到该行。 |\n| `kill-line` | `Ctrl+k`\
  \ | 如果光标不在行尾，则将文本移动到行尾；否则，删除换行符。 |\n| `kill-buffer` | `Ctrl+x, k` | 删除当前缓冲区。 |\n\
  | `TX fill-paragraph` | `M+q` | 重新排列给定的段落，使所有行都填满。 |\n\n---\n\n# 第五部分 与用户和其他系统通信\n\
  \n## 21 通过调制解调器访问其他 UNIX 系统（第 539 页）\n## 22 在网络或互联网上访问其他 UNIX 系统（第 563 页）\n## 23\
  \ 从 Windows 访问 UNIX（第 589 页）\n## 24 UNIX 与互联网（第 611 页）\n\n### 第 21 章通过调制解调器访问其他系统（第\
  \ 539 页）\n\n本章主要介绍如何通过调制解调器（modem）访问其他 UNIX 系统。我将提供逐步说明，引导你完成与这种系统间通信相关的常见任务。\n\n\
  在此之前，需要涵盖一些基础知识。记住，UNIX 是一个多用户操作系统环境，因此它需要对可用（且共享的）系统资源实施一些基本的控制。在成功利用这些资源之前，你必须对它们是如何配置的有一个基本的了解。\n\
  \n本章从一些概念开始。我们将首先查看一些通用特性和要求。之后，我们将重点介绍你需要如何进行配置。最后我们将以具体细节结束。\n\n#### 调制解调器通信概述\n\
  调制解调器就像电话。和任何标准电话一样，它们处理传入和传出的数据。因此，当调制解调器拨打号码时，必须由另一个调制解调器接听才能进行有意义的通信。但毕竟，给一个不通相同语言的人打电话有什么意义呢？\n\
  \n一旦两个调制解调器连接起来，两个主机之间进行有效通信成为可能的。通常，这种通信可以实现文件和资源共享以及远程应用程序的执行。\n\n#### 串口设备\n\
  UNIX 系统使用名为 `devices` 的特殊文件来让用户访问系统硬件。这些设备通常存储在 `/dev` 子目录中，一个或多个文件提供对特定硬件的访问。\n\
  \n#### 图 21.1 连接 UNIX 主机\n图 21.1 总结了在两个远程主机之间建立连接涉及的事件。这为确定过程每个阶段阶段涉及的设备提供了有用的指南。（第\
  \ 541 页）\n\n\n\n\n\n任何特定系统上串口端口的具体数量和名称取决于硬件配置和 UNIX 的版本。幸运的是，有一些常见的标准实现可以作为我们的指南。\n\
  \n通常，大多数硬件平台都有四个串口端口，分别称为 `COM1`、`COM2`、`COM3` 和 `COM4`。这些端口对应的 UNIX 设备文件通常称为 `/dev/ttyS0`、`/dev/ttyS1`、`/dev/ttyS2`\
  \ 和 `/dev/ttyS3`。这些设备的具体名称可能会根据你运行的 UNIX 类型（flavor）而有所不同。\n\n回想图 21.1，你需要能够配置 UNIX\
  \ 来同时处理拨入（dial-in）和拨出（dial-out）调制解调器服务。UNIX 根据你想要使用的服务提供不同的设备文件，你应该尽量记住使用正确的设备。提供拨出设备的设备通常被称为\
  \ `/dev/cua1`、`/dev/cua2`、`/dev/cua3` 和 `/dev/cua4`。相应的 `/dev/ttyS1` 到 `/dev/ttyS4`\
  \ 设备通常留作拨入使用。\n\n由于你的调制解调器物理上连接到串口上，因此你访问它的唯一方法是通过相应的设备文件。了解你的 UNIX 系统上配置了哪些端口以及哪些可用是重要的。下一节概述的任务将帮助你检查存在哪些串口设备驱动程序。\n\
  \n### 检查串口设备文件\n\n了解你的 UNIX 系统上有哪些设备是重要的。\n\n#### 查找可用串口设备\n\n1. 输入 `ls -l /dev/ttyS?`\
  \ 并按回车。\n2. 出现类似下面的设备列表：\n```\ncrw--w--w-  1 root  root    4, 64 Mar 14 20:56 /dev/ttyS0\n\
  crw--w--w-  1 root  root    4, 65 Mar 14 20:56 /dev/ttyS1\ncrw--w--w-  1 root  root\
  \    4, 66 Mar 14 20:56 /dev/ttyS2\ncrw--w--w-  1 root  root    4, 67 Mar 14 20:56\
  \ /dev/ttyS3\n```\n3. 输入 `ls -l /dev/cua?` 并按回车。\n4. 出现类似下面的设备列表：\n```\ncrw--w--w-\
  \  1 root  root    5, 64 Mar 14 20:56 /dev/cua0\ncrw--w--w-  1 root  root    5,\
  \ 65 Mar 14 20:56 /dev/cua1\ncrw--w--w-  1 root  root    5, 66 Mar 14 20:56 /dev/cua2\n\
  crw--w--w-  1 root  root    5, 67 Mar 14 20:56 /dev/cua3\n```\n\n这些设备文件的具体名称可能有所不同，取决于\
  \ UNIX 版本和类型。例如，在大多数 SCO UNIX 和 Linux 实现中，拨出线路的串口设备文件称为 `/dev/ttyna`，拨入线路的串口设备文件称为\
  \ `/dev/ttynA`，其中 `n` 代表串口号。\n\n### 串口通信配置\n\n现在我们已经确定了 UNIX 主机可以使用的设备，我们有一些服务配置任务需要完成。这些配置任务取决于我们将启用拨入设备、拨出设备还是两者的结合。一个非常重要的考虑因素是有效控制。我们需要确保一旦某个用户占用了一个设备，在通话完成之前，其他用户无法访问该设备。\n\
  \n#### 串口通信拨入\n\n当用户拨入时，你希望在输入有效的用户名和密码后向他显示登录提示符。UNIX 通过不同程序之间的交互来实现这一点。`init`\
  \ 进程是你每当启动 UNIX 系统时运行的第一个进程。因此，一个名为 `/etc/inittab` 的特殊文件至关重要，它告诉它该做什么。实际上，`init`\
  \ 并不聪明，它依赖于 `/etc/inittab`。\n\n示例 `/etc/inittab` 文件的节：\n```\n# Serial lines\ns1:45:respawn:/sbin/getty\
  \ 19200 ttyS0\ns2:45:respawn:/sbin/getty 19200 ttyS1\ns3:45:respawn:/sbin/getty\
  \ 19200 ttyS2\ns4:45:respawn:/sbin/getty 19200 ttyS3\n```\n这可以作为 `init` 如何行使其对可用设备权限的示例。\n\
  \n\n\n\n`/etc/inittab` 文件中任何条目的语法都非常简单。每个条目由四个不同的部分（字段）组成，用冒号（:）分隔。第一个字段称为 `tag`，它是一个任意值，用于在\
  \ `/etc/inittab` 文件中提供索引。列表 21.1 列出了标记为 `s1`、`s2`、`s3` 和 `s4` 的独立标签，每个标签对应四个可用的串口设备。\n\
  \n第二个字段告诉 `init` 进程在哪个运行级别（run level）执行该特定条目。列表 21.1 中的所有条目都是针对运行级别 4 和 5 的。第三字段告诉\
  \ `init` 在第四个字段指定的程序完成后应该做什么。在列表 21.1 中，该字段包含单词 `respawn`，意味着在程序终止后重新启动它。\n\n第四个字段最有趣，因为它包含了你想让\
  \ `init` 运行的程序名称。在我们的示例中，这是一个名为 `/etc/getty` 的程序。该程序带有两个选项运行：第一个是连接的调制解调器的最大比特特率，第二个是串口设备文件\
  \ `/dev/ttyS1` 到 `/dev/ttyS4`。\n\n`/etc/getty` 是一个监控程序。它读取名为 `/etc/gettydefs` 文件，该文件用于存储任何连接调制解调器的配置设置，包括调制解调器支持的数据速率、流控制和校验位设置等。`/etc/getty`进程读取\
  \ `/etc/gettydefs` 并等待调制解调器接收电话。当拨入电话到达时，`/etc/getty` 会启动一个登录进程，向拨入的用户显示登录提示符，然后终止。\n\
  \n让 `init` 将 `/etc/getty` 分配给你的任何串口设备文件，为处理拨入用户请求提供了一种有效方法。当通话完成后，shell 程序终止，`init`\
  \ 进程会重新启动另一个 `/etc/getty`进程来监控下一次拨入电话。通过这种方式，你的串口设备的生命循环就会持续下去。\n\n## 拨出的串口配置\n\n\
  为了能够从你的 UNIX 系统拨出，你需要能够从 `/etc/getty` 进程获取对串口设备的控制权。最好的方法是编辑特定串口设备的 `/etc/inittab`\
  \ 条目，将第三字段中的 `respawn` 设置更改为 `off`：\n\n```\nS3:45:off:/etc/getty 19200 ttyS3\n```\n\
  \n如果你想同时进行拨出和拨入电话怎么办？使用上述配置，你只能安装两个调制解调器和两条电话线（一个入站，一个出站）。然而，还有另一种替代方案。它利用锁文件（lock\
  \ files）来记录串口设备何时被使用（无论是拨入还是拨出通话），在通话完成之前防止其他对该设备的访问。这种替代方案使用一个名为 `/etc/uugetty`\
  \ 的程序及其相关的配置文件 `/etc/conf.uugetty`。\n\n为 配置串口设备同时进行拨入和拨出访问\n\n1. 使用 `vi` 命令编辑 `/etc/inittab`\
  \ 文件，输入 `vi /etc/inittab` 并按回车。\n2. 滚动查看 `/etc/inittab` 以找到控制连接调制解调器的串口设备现有条目。\n\
  3. 在行开头放置 `#` 字符以注释掉该条目。生成的行看起来如下：\n```\n#s2:45:respawn:/etc/getty 19200 ttyS2\n\
  ```\n4. 输入 `o` 使用 `vi` 编辑器开启新行，然后输入以下文本：\n```\nS2:456:respawn:/etc/uugetty ttyS2\
  \ 19200\n```\n5. 保存 `/etc/inittab` 文件并按 `Esc` 键然后按 Shift+ZZ 退出 `vi` 程序。\n6. 完成 `/etc/inittab`\
  \ 文件的编辑后，你需要指示 `init` 进程读取你的新配置。要做到这一点，在 shell 提示符下输入以下命令：\n```bash\nkill -HUP 1\n\
  ```\n\n前面的步骤演示了如何通过使用 `/etc/uugetty` 配置你的系统以接受并回答拨入请求。需要注意的是，通过在你的任何串口设备上运行 `/etc/uugetty`，该设备将不再可用于拨出。在示例中，通过在\
  \ `/dev/ttyS2` 设备上运行 `/etc/uugetty`，你实际上为拨入请求预留了该设备。如果你只有一个有一个调制解调器和电话线，处理同时拨入和拨出请求可能会棘手。\n\
  \n然而，并非一切无望。UNIX 提供了另一组串口设备文件供你用于拨出目的。在 Linux 和 SCO UNIX 系统，这些文件被称为 `/dev/cua#`，其中\
  \ `#` 指端口号。例如，在前面的步骤中，你配置了 `/dev/ttyS2` 设备以接受拨入电话。要使用同一个调制解调器和电话线进行拨出请求，你可以使用相应的拨出设备\
  \ `/dev/cua2`。只要没有人在同时拨入系统，你就可以使用 `/dev/cua2` 设备拨出电话，并让 `/etc/uugetty` 空闲监控连接的入站电话。\n\
  \n## 使用 cu 程序登录\n\n\n\n既然你已经配置了 `/etc/getty` 来监听传入的电话，让我们尝试拨号接入系统。大多数 UNIX 版本都提供一个名为\
  \ `cu` 的标准通信程序，全称是 call UNIX（拨打 UNIX）。`cu` 程序非常基础，不具备许多商业通信软件包中常见的各种华丽功能。不过，`cu`\
  \ 功能完全完备。本节将探索如何利用该程序完成简单的主机到主机之间的通信。管理员通常将 `cu` 程序用作故障排除工具，因为它提供了一种测试串口设备、控制文件和调制解器配置的简单且有效的方法。\n\
  \n在我们研究 `cu` 的高级功能之前，让我们从检查你的配置开始。\n\n### 使用 cu 登录另一个 UNIX 系统\n\n1. 在 shell 提示符下输入\
  \ `cu` 并按回车启动 `cu` 程序。该程序将返回以下语法语句：\n```\nUsage: cu [options] [system or phone number]\n\
  ```\n\n2. 我的调制解器连接到 COM3 端口，因此我需要指示 `cu` 使用设备 `/dev/cua2`。在 shell 提示符下，我输入 `cu -l\
  \ /dev/cua2` 来使用该串口设备启动 `cu`。你应该输入相同的命令，并替换为你正在使用的设备名称。\n\n3. 如果一切配置正确，`cu` 程序将回显单词\
  \ `Connected` 并等待进一步指令。如果 `cu` 回显了类似下面的消息，说明你遇到了问题：\n``````\ncu: open (/dev/ttyS2):\
  \ Permission denied\ncu: /dev/ttyS2: line in use\n```\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n#### 保持 init 信息同步\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ 你可以使用从 `/dev/ttyS1` 到 `/dev/ttyS4` 的任何设备，但如果你这样做了，你需要告诉 `init` 不要针对该设备运行 `/etc/getty`\
  \ 或 `/etc/uugetty`。类似这样的消息意味着有其他东西正在使用该特定线路。那个其他东西可能是 `init` 进程，它可能正在运行 `/etc/getty`。\n\
  \n4. 使用 `vi` 程序打开 `/etc/inittab` 文件，并确保该串口条目已被注释。记住，如果你更改了 `/etc/inittab` 文件，你需要告诉\
  \ `init` 进程重新读取该文件。这可以通过两种方式实现：输入 `init q` 并按回车，或者输入 `kill -HUP 1` 并按回车。\n\n5. 如果\
  \ `cu` 程序最初回显 `Connected`，但随后立即回显显示 `cu: hangup` 的错误消息，说明你正在连接到一个没有调制解器的串口。确定你的调制解器连接到哪个线路，并使用正确的设备重新运行\
  \ `cu`。\n\n6. 如果你成功将 `cu` 连接到调制解器，输入 `at`。在输入时你可能看不到字符，但你应该能看到屏幕上回显 `OK`。这条消息来自你的调制解器，它在告诉你它运行正常且在线。\n\
  \n7. 输入 `ate1` 并按回车。调制解器将在屏幕上回显 `OK`。现在你输入的内容都将显示出来。\n\n8. 现在让我们尝试连接到你的远程主机。输入 `atdt`\
  \ 后加上主机调制解器的电话号码。调制解器会忽略任何空格。如果你通过 PBX 拨号，可能需要先拨打 9 以访问外部线路。你可以输入逗号来表示暂停，为交换机分配线路留出额外。\n\
  \n9. 调制解器将拨号并连接到远程调制解器。在远程主机上，`/etc/getty` 或 `/etc/uugetty` 程序将注意到传入的电话并发布登录提示，该提示将回显在你的屏幕上。使用你的用户名和密码登录。\n\
  \n10. 要断开连接，输入 `exit` 退出远程 shell。系统将通过回显括号中的系统名称来响应。然后输入 `..`\n\n### 配置 cu\n\n可以配置\
  \ `cu` 程序拨打远程系统，而无需指定使用哪种设备，也不需要直接连接调制解器来拨打电话号码。通过这种方式，你可以为系统配置一个或多个拨出线路，并要求 `cu`\
  \ 程序获取第一条可用线路并自动拨打所需的电话号码。\n\n`cu` 程序使用与 `uucp` 程序套件相关的四个配置文件。这些配置文件通常位于 `/usr/lib/uucp/`\
  \ 子目录下，分别称为 `Devices`、`Dialers`、`Systems` 和 `Permissions`。重要的是，这四个配置文件是相互关联的，必须相互交叉引用才能成功工作。下面的步骤将引导你完成这些文件的示例配置。\n\
  \n\n\n\n## 1. 进入 vi 设备\n（注意文件名中的大写字母 D）。在该文件中，你需要定义想要使用的串口端口，并对这些端口设置引用，这些引用可以供\
  \ `/usr/lib/uucp/Systems` 和 `/usr/lib/uucp/Dialers` 配置文件使用。以下代码演示了 `Devices` 文件中条目的的语法：\n\
  \n```text\n# /usr/lib/uucp/Devices \n#为每个用于拨号输出的串口设备添加定义\nmodem cua1 - 19200 hayes\n\
  modem cua2 - 19200 hayes\nmodem cua3 - 19200 hayes\nmodem cua1 - 19200 hayes\n```\n\
  \n`Devices` 文件中的每一行都指向 `/dev` 中一个定义的拨出设备。你需要识别调制解调器和最高可用调制解调器速度，以及用于识别连接到此端口的设备类型的关键字。注意所有条目都使用相同的关键字\
  \ `modem`。这样一来，拨出请求就能简单地获取第一个可用端口，而无需等待特定设备释放。\n\n## 2. 在 /usr/lib/uucp/Devices\
  \ 文件中输入新行\n输入 `o` 然后输入 `modem device - 19200 hayes`（将单词 *device* 替换为你的拨出设备文件名称）。按\
  \ `Esc` 然后按 `Shift+ZZ` 退出并保存 `/usr/lib/uucp/Devices` 文件。\n\n## 3. 编辑 /usr/lib/uucp/Dialers\
  \ 文件\n输入 `vi Dialers`（同样，注意文件名中的大写字母 D）。在该文件中，你需要定义 `cu` 或 `uucp` 程序发送给调制解调器的初始化设置。这是一个示例：\n\
  \n```text\n# /usr/lib/uucp/Dialers \n#为 Drivers 文件中定义的每个调制解调器添加定义\nhayes =W-, \"\
  \"ATZ OK ATDT\\T CONNECT\n```\n\n## 4. 引用 hayes 关键字\n你需要引用位于 `/usr/lib/uucp/Devices`\
  \ 文件中的 `hayes` 关键字。按 `o` 输入新行并输入以下内容：\n\n```text\nhayes =W-, \"\"ATZ OK ATDT\\T\
  \ CONNECT\n```\n\n`ATZ` 命令重置调制解调器，并预期调制解调器返回 `OK`。`ATDT` 命令在 `cu` 程序中应该常见。`\\T`\
  \ 指向为系统定义并从 `/usr/lib/uucp/Systems` 文件传递的电话号码。\n\n## 5. 保存并退出\n按 `Esc` 然后按 `ZZ`\
  \ 保存 `/usr/lib/uucp/Dialers` 文件。\n\n## 6. /usr/lib/uucp/Systems 文件\n`/usr/lib/uucp/Systems`\
  \ 文件定义了拨号的系统名称、应使用的端口类型、允许无人连接的调度（专门针对 `uucp` 程序）、拨号电话号码，以及连接后允许自动登录的一些脚本命令。这是一个示例：\n\
  \n```text\n# /usr/lib/uucp/Systems \n#为用户想要访问的远程系统添加定义。\nHorse MoTuWe0800-1700 modem\
  \ 19200 123456 \"\\nlogin:-login:name word:pass\nJupiter Any modem 19200 123456\
  \ \"\\nlogin:-login:username word:password\nRemote Any modem 19200 12345678\n```\n\
  \n## 7. 为远程连接编辑 Systems 文件\n输入 `vi /usr/lib/uucp/Systems` 编辑此文件。按 `o` 进入新行并输入：\n\
  \n```text\nremote Any modem 19200 12345678\n```\n\n这为 `cu` 程序定义了一个条目，使其可以在全一天中的任何时间，使用\
  \ `/usr/lib/uucp/Devices` 文件中所示的任何类型为 `modem` 的设备连接到你的远程系统。此外，你还指定了连接速率和拨号电话号码。按\
  \ `Esc` 和 `ZZ` 保存并退出文件。\n\n## 8. 配置 /usr/lib/uucp/Permissions 文件\n在远程 UNIX 系统上，你需要配置\
  \ `/usr/lib/uucp/Permissions` 文件以允许自己远程登录，并定义你想提供的读写权限。打开或创建 `/usr/lib/uucp/Permissions`\
  \ 文件，并添加以下行：\n\n```text\nLOGNAME=local_machine\nMACHINE=local_machine\nSENDFILE=yes\n\
  ```\n\n当你允许无人 `uucp` 访问你的 UNIX 主机时，`/usr/lib/uucp/Permissions` 文件至关重要。在这种情况下，文件中应为所有允许访问的主机定义条目，并应针对以下关键字提供条目：\n\
  \n- `MACHINE`: 系统名称\n- `LOGNAME`: 日志文件中系统名称\n- `CALLBACK`: 在给定号码建立连接后回拨的号码\n- `REQUEST`:\
  \ 指定远程系统是否可以请求文件\n- `SENDFILE`: 明确远程系统是否可以发送文件\n\n\n\n\n\n- 规定远程系统是否可以发送文件。\n- READ：指定远程系统可以读取的目录。\n\
  - WRITE：指定远程系统可以写入的目录。\n- COMMANDS：指定 uux 可以执行的命令。\n9. 按 `Esc` 然后按 `ZZ` 保存权限文件并退出到\
  \ shell 提示符。\n\n### 使用 `cu` 程序\n\n你现在可以使用你的新配置文件来改进 `cu` 程序的操作。此外，你还可以探索一些其他的 `cu`\
  \ 的功能，例如传输文件。\n\n#### 使用 `cu` 传输文件\n\n1. 登录 UNIX 并输入 `cu-z remote`（其中 *remote* 是你在\
  \ `/usr/lib/uucp/Systems` 文件中指定的系统名称）。`cu` 程序将自动连接到远程系统，并返回用于用户名和密码的登录提示符。\n2. 登录到远程系统。然后输入命令\
  \ `~?`。`cu` 程序将显示可用命令列表。\n3. 输入 `~put` 将文件传输到远程主机。\n4. `cu` 程序将提示你输入要传输到远程系统的本地文件。输入本地文件名。\n\
  5. `cu` 程序将提示你文件传输到远程系统后的名称。你可以直接按回车键使用相同的名称。\n6. `cu` 程序将指示传输何时完成。\n7. 输入 `~.`\
  \ 断开连接并返回 shell 提示符。\n\n列表 21.2 展示了上述步骤的执行情况，显示了将文件 `/home/report` 传输到远程连接的系统。注意，也可以使用其他转义序列来传输文件。输入\
  \ `~?` 命令可以列出你的 `cu` 程序实现中的可用命令。\n\n**警告**：尽管 `cu` 程序可以在系统之间传输文件，但它执行时不进行任何错误检查或恢复。应该使用\
  \ `sum` 命令来对潜在的数据损坏进行一致性检查。\n\n#### 使用 *cu* 传输文件\n\n转义序列：\n- `~local_host`\n- `~.`\
  \ 挂断\n- `~!CMD` 运行 shell\n- `~$CMD` 将 stdout 输出到远程\n- `~CMD` 从远程接收 stdin\n- `~+CMD`\
  \ 将 stdin 和 stdout 都重定向到远程\n- `~#` 发送中断 (break)\n- `~cDIR` 切换目录\n- `~>` 发送文件\n-\
  \ `~<` 接收文件\n- `~p FROM TO` 发送到 Unix\n- `~t FROM TO` 从 Unix 接收\n- `~s VAR VAL` 设置变量\n\
  - `~s VAR` 设置布尔值\n- `~s!VAR` 取消布尔值\n- `~v` 列出变量\n- `~z` 挂起\n- `~%` 发送中断\n- `~%cd\
  \ DIR` 切换目录\n- `~%put FROM TO` 发送文件\n- `~%take FROM TO` 接收文件\n- `~%nostop` 无 XON/XOFF\n\
  - `~%stop` 使用 XON/XOFF\n\n```\nconnected\n~put\nfile to send: /home/report\nRemote\
  \ file name [report]:\n...\nfile transfer complete\nconnected\n~.\nDisconnected\n\
  ```\n\n#### 在本地系统上运行命令\n\n1. 登录 UNIX 并使用 `cu -z remote` 连接到远程主机（其中 *remote* 是你在\
  \ `/usr/lib/uucp/Systems` 文件中配置的远程系统主机名）。连接到远程主机后，使用有效的用户 ID 和密码登录。\n2. 在 shell\
  \ 中输入 `vi /home/cu_remote_file` 在远程主机上创建一个名为 `/home/cu_remote_file` 的新文件。按 o 并输入\
  \ This is a test of the `cu` program.。按 Esc 键然后按 ZZ 保存文件并返回 shell 提示符。\n3. 输入命令\
  \ `sum cu_remote_file`。`sum` 程序将输出两个数字：文件 `cu_remote_file` 的 16 位校验和，以及该文件大小的估计值。记下这两个值。\n\
  4. 输入 `~%take /home/cu_remote_file /home/cu_local_file` 将文件传输到本地 UNIX 主机，并使用相同的文件名保存。\n\
  5. 当 `cu` 表明传输完成后，你可以通过对传输后的副本运行 `sum` 命令来检查文件是否已无错误传输。\n\n\n\n\n5. 输入 `~! /bin/sh`\
  \ 以从 cu 程序内部在本地系统上运行 shell。在 shell 提示符下，输入 `sum cu_local_file` 然后按回车。与之前一样，`sum`\
  \ 程序将输出两个数字。将这些数字与步骤 3 中生成的数字进行比对。如果传输过程中没有错误，这些数字将是相同的。\n6. 输入 `exit` 返回 cu 程序。退出远程连接并按\
  \ `~.` 退出 cu 程序。\n\n在配置好用于 cu 操作的文件后，你还可以运行 uucp 命令。\n\n## 通过 uucp 传输文件\n\nUUCP\
  \ 代表 UNIX-to-UNIX Copy（复制程序）。它不仅仅是一个程序，而是一套实用程序，提供了一种跨越物理分布的 UNIX 平台传输文件和执行应用程序的方法。uucp\
  \ 套件最常用于无人值文件传输，特别是系统之间的电子邮件传输。然而，用户也可以使用这些程序来满足自己的文件传输需求。\n\n## 创建文件传输程序\n\n1.\
  \ 登录 UNIX 并创建一个名为 `uucp_data` 的测试文件。\n2. 在 shell 提示符下，输入 `uucp uucp_data remote!/home/uucp_data`。\n\
  3. 使用 `vi` 编辑 `/usr/lib/uucp/Systems` 文件，并为你主机 `remote` 创建的条目添加以下命令。在电话号码之后，添加以下测试：\n\
  ```\n\" \\rgin:-gin:<userid> word:<password>\n```\n将 `<userid>` 和 `<password>` 替换为\
  \ `remote` 上有效的用户名和密码。\n4. `uucp` 命令将引用 `/usr/lib/uucp/Systems` 文件并定位到 `remote`\
  \ 的条目。当找到引用时，将与 `remote` 主机建立，`uucp` 将使用用户名密码对自动登录。一旦登录完成，文件 `uucp_data` 将被传输`uucp`\
  \ 将终止连接。\n5. `uucp` 程序期望若干提供额外功能的参数。可以使用 `-m` 切换强制系统在传输完成后返回一封电子邮件。在 shell 提示符下输入以下命令：\n\
  ```\nuucp -m uucp_data remote!/home/uucp_data\n```\n然后按回车。\n6. 同样，如果你将文件复制到远程系统，你可能希望在文件到达时通知该系统的用户。你可以通过\
  \ `-n` 切换来实现。使用以下命令在文件传输完成后向远程系统上的用户 `Lauren` 发送电子邮件：\n```\nuucp -nLauren uucp_data\
  \ remote!/home/uucp_data\n```\n\n### 限制用户放置文件的位置\n\n需要编辑 `/usr/lib/uucp/Permissions`\
  \ 文件以允许将文件传输到指定位置。在之前的示例中就是如此。但是，限制用户在远程系统上放置文件的位置是一个良好的习惯。通常这应该是 `/usr/spool/uucp`\
  \ 或 `/usr/spool/ucpp`。\n\n## 运行远程命令\n\n`uux` 程序是 uucp 套件的一部分。它允许拥有权限的用户在远程主机上执行命令。再次，该命令的执行通过\
  \ `/usr/lib/uucp/Permissions` 文件控制。\n\n1. 登录 UNIX 并发布 `uuxdate` 命令。\n2. 程序将在远程主机上执行\
  \ `date` 命令并将结果返回给你的 shell。\n通常，`uux` 命令不会由用户直接执行，而是作为电子邮件和网络新闻服务器等应用程序的一部分使用的。出于这个原因，大多数系统会在\
  \ `/usr/lib/uucp/Permissions` 文件中限制 `rmail` 和 `rnews` 程序的执行。\n\n## 检查 uucp 任务状态\n\
  \n用户可以通过 `ustat` 程序检查任何待处理的 uucp 文件传输请求的状态。\n\n1. 登录 UNIX，并在 shell 提示符下输入 `ustat`。\n\
  2. 将显示当前队列中的作业列表。这里是一个示例：\n```\njupiter 02/14-20:45:00 (POLL) mars 02/14-20:53 S\
  \ jupiter filename.txt 48871\n```\n![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)/home/james/docs/sams/uucp/filename.txt\n\
  \n\n\n\n3. 默认情况下，`uustat` 仅显示由执行 `uustat` 命令的用户所排队的任务。要显示所有当前调度的任务，请输入 `uustat -all`。\n\
  \n你可以带有一些可选参数运行 `uustat` 程序，以获取有关单个 uucp 程序性能的额外信息。\n\n# 带参数运行 uustat\n\n1. 输入 `uustat\
  \ -e` 并按回车。这将提供所有当前排队的程序执行请求的列表。\n\n2. 输入 `uustat -m` 并按回车。该命令将生成连接到远程主机状态的摘要。例如：\n\
  \n```text\nremote        05/23 - 10:15    CALLER SCRIPT FAILED dtcg02        05/30\
  \ - 11:30     LOGIN FAILED\njupiter         05/30 - 11:30    CONN FAILED (CALLER\
  \ ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)SCRIPT FAILED)\n```\n\n\
  上述代码说明了到三个主机（remote、dtcg02 和 jupiter）失败的 uucp 连接。\n\n## 取消 uucp 请求\n\n你可以使用 `uustat`\
  \ 程序取消待处理的 uucp 文件传输或程序执行请求。\n\n### 使用 uustat 取消 uucp 请求\n\n1. 登录 UNIX。在 shell 提示符下，通过输入\
  \ `vi /usr/lib/uucp/Systems` 编辑 `/usr/lib/uucp/Systems` 文件。\n\n2. 按 `O` 键添加新行，然后输入以下内容：\n\
  ```text\nnohost Never modem 19200 123456\n```\n定义了一个名为 `nohost` 的新系统，它永远不会被 uucp\
  \ 程序调用。\n\n3. 通过向已知永远不会发送的 `nohost` 传输请求向 uucp 队列放入消息。输入以下内容并按回车：\n```text\nuucp\
  \ /home/uucp_data nohost!/home/uucp_data\n```\n\n4. 输入 `uustat`。你会看到类似下面的代码行：\n\
  ```text\nnohostN001 nohost root 03-15 02:25 Sending ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)/home/uucp_data\
  \ (1864 bytes) to /home/uucp_data ![fc4f3a8aef38b56941e55505c60ecaf.gif](img/fc4f3a8aef38b56941e55505c60ecaf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60ecaf.gif](img/fc4f3a8aef38b56941e55505c60ecaf.gif)\n\
  ```\n使用 `uustat` 取消时请注意 Lock。命令 `uustat -K`（大写 K）将移除所有当前排队的 uucp 请求。使用 `uustat`\
  \ 取消任务时，请确保 Lock 键没有被意外设置。\n\n5. 要删除传输请求，输入以下命令：\n```bash\nuustat -k nohostN001\n\
  ```\n\n## 通过调制解调器扩展网络 (PPP)\n\n点点协议（PPP）提供了一种通过调制解调器到调制解调器连接传输 IP 包的方法。两个远程主机之间的\
  \ PPP 连接为所有远程用户和应用程序提供通过单个调制解调器链路相互访问的方法，而不是将通信限制在任何时刻的单个用户。\n\n通过这种方式，可以使用 PPP\
  \ 扩展网络，使得远程主机可以像位于同一个本地局域网（LAN）一样协作。但应该，通过拨号线路连接的两个系统之间的通信速度将比 LAN 连接慢一个数量级。\n\n\
  ## 配置简单的 PPP 连接\n\n在任何 UNIX 主机上配置 PPP 操作都有三个不同部分：在远程系统（接受接入的系统）上创建 PPP 用户帐户、开发 Chat\
  \ 脚本以及执行 PPP 守护进程。让我们逐一检查。\n\n### 创建 PPP 用户帐户\n\n1. 建议设置一个专用用户账户来控制 PPP 的执行。以 root\
  \ 用户身份登录远程系统并创建一个新账户。然后编辑 `/etc/passwd` 文件，使其看起来类似于：\n```text\nppp_user:e9prWE5B4fs:501:202:ppp\
  \ execution account: ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)/tmp:/usr/lib/ppp/ppp-on\n\
  ```\n需要注意的是，GID 和 UID 值将取决于特定系统，你在 `/etc/passwd` 中创建的密码也是如此。\n\n\n\n第二个字段。启动程序指示为文件\
  \ `/usr/lib/ppp/ppp-on`，这是一个用于开启 ppp 服务的配置脚本。\n\n2.  在开启 PPP 服务之前，你需要在你的调制解调器之间建立连接。这与你之前查看使用\
  \ `cu` 程序进行远程登录时类似：在远程系统上输入用户名和密码之前，你必须先连接，让本地调制解调器拨号远程主机的电话号码。`chat` 程序为你提供了一种为\
  \ PPP 执行此操作的有效方法。\n\n输入以下内容创建一个新的 PPP chat 脚本：\n\n```bash\nvi /usr/lib/ppp/ppp-chat\n\
  ```\n\n然后按回车键。\n\n3.  输入 `o` 添加以下行，并替换为你系统的正确用户名（通常为 `ppp` 或 `ppp_user`）、密码和电话号码：\n\
  \n```text\nATZ OK ATDT12345678 CONNECT login: ppp word: <password>\n```\n\n注意，`chat`\
  \ 程序使用的语法与你在 `/usr/lib/uucp/Systems` 配置文件中输入的条目非常相似。第一条条目重置调制解调器，调制解调器会发送 `OK`。然后，chat\
  \ 脚本拨打你远程主机的电话号码。一旦收到 `CONNECT` 消息和登录提示，chat 脚本将发送用户名，并在随后的密码提示处再次发送密码。\n\n4.  按\
  \ `Esc` 然后按 `ZZ` 保存并退出新的 `/usr/lib/ppp/ppp-chat` 文件。\n\n4.  通过输入以下命令创建启动 PPP 连接的\
  \ shell 脚本：\n\n```bash\nvi /usr/lib/ppp/ppp-on\n```\n\n并该文件包含以下条目：\n\n```bash\n\
  #!/bin/sh\n#script to activate ppp connection\npppd connect \"chat -f /usr/lib/ppp/ppp-chat\"\
  \n/dev/cua2 19200\n/dev/cua2-detach 130.100.0.5:130.200.0.20 defaultroute\n```\n\
  \n注意，在这个示例中，我将 PPP 的拨号设备设置为 `/dev/cua2`，并将本地和远程地址设置为 `130.100.0.5` 和 `130.200.0.20`。你应该修改这些以反映你的配置。完成后，按\
  \ `Esc` 键然后按 `ZZ` 保存文件并返回 shell 提示符。\n\n5.  你需要对此文件设置权限，允许 root 用户执行该脚本并激活 PPP 连接。为此，请输入：\n\
  \n```bash\nchmod 744 /usr/lib/ppp/ppp-on\n```\n\n6.  运行 shell 脚本建立 PPP 链路。\n\n###\
  \ 停止连接\n\n通过向 `pppd` 进程 ID (PID) 发挂断信号来移除现有的 PPP 连接。`pppd` 进程将其 PID 存储在它在 `/var/lock`\
  \ 子目录下创建的设备文件中。该文件名将与串口设备相关。对于我的 PPP 配置，我使用了串口设备 `/dev/cua2`，因此我的锁文件名为 `/var/lock/LCK..cua2`。\n\
  \n注意：许多 UNIX 版本提供了基本的 shell 脚本来开启和关闭 PPP 连接。虽然这些文件通常被称为 `ppp-on` 和 `ppp-off`，但它们的目录位置在不同的\
  \ UNIX 版本之间差异很大。输入 `find / -name ppp -o* -print` 以在系统中定位这些文件，然后按回车键。\n\n### 移除 PPP\
  \ 连接\n\n1.  以 root 用户登录并输入 `cat /var/lock/LCK..cua2`。这将在屏幕上显示数字，它是当前使用 `/dev/cua2`\
  \ 的 `pppd` 的 PID。\n2.  通过 `kill -HUP PID` 发送挂断信号告诉 `pppd` 终止，其中 `PID` 是步骤 1 返回的数字。\n\
  \n本章解释了你如何访问连接到你的 UNIX 系统的调制解调器。然而，值得注意的是，在许多 UNIX 版本中，系统设备文件名可能存在细微差异。需要注意的是，在过去的几年里，其他更高效有效的\
  \ UNIX 主机间文件传输方法已逐渐取代了 UUCP 的使用。可以说，发现依赖 UUCP 作为文件传输机制的 UNIX 主机已变得相当普通。UUCP 的衰落很大程度上归因于越来越多使用\
  \ Sendmail 程序传输电子邮件。但永久连接到互联网的主机日益增多对其发展也没有帮助。如果主机需要通过互联网持续连接，那么采用批处理文件传输方法是有价值的。\n\
  \n\n\n在某种程度上，UUCP 的衰落换来了 PPP 的获益，因为启用 PPP 的连接已成为提供 Internet 接入的首选方式。本章阐述了你如何配置 UNIX\
  \ 主机以建立瞬时的 PPP 连接。但需要注意的是，大多数 PPP 连接是作为持久性连接建立的，且 `ppp-off` 脚本永远不会被运行。\n\n# 第 22\
  \ 章：访问网络或互联网上的其他系统\n作者：James Edwards - 第 563 页\n\n## 一些网络概念\n在开始之前，你需要掌握一些基础知识。网络涉及许多需要安装和配置的硬件与软件组件。图\
  \ 22.1 提供了一个实用的起点，说明了这些组件如何相互结合以提供网络连接性。\n\n![227-0564a.gif](img/5ec3e821a67d5498cf12705c7d78e4.gif)\
  \ 图 22.1 网络连接的组件。图 22.1 展示了一个 UNIX 主机连接到以太网网络，并使用 TCP/IP 协议与邻近主机通信。这一切是如何结合在一起的？嗯，以太网为我们主机的物理连接提供了基础。在主机连接后，它们就可以通过\
  \ TCP/IP 协议进行通信。这些协议为主机提供了相互操作的方法，例如执行远程程序、共享资源和传输文件。第 564 页\n\nTCP/IP 协议族是 UNIX\
  \ 网络系统的核心。本章将介绍这些协议的操作。尽管这一章不能让你立即成为 TCP/IP 专家，但你将获得足够的信息和指导，让你能够充分使用这些协议并连接到网络。\n\
  \n以太网是迄今最常见的物理网络传输形式。然而，也存在其他形式，包括令牌环（token ring）、FDDI 和异步传输模式（ATM），其中某些可能听起来很熟悉。尽管这些网络类型都采用不同的特性和功能，并且都需要截然不同的配置，但它们之间确实存在某些相似之处。事实上，图\
  \ 22.1 中概述的相同通用连接组件在所有这些物理网络类型中都适用。本章详细研究了以太网，因为它是你最可能需要交互的网络形式。\n\n### 检查你的网络连接\n\
  你首先需要物理上将你的系统连接到网络。这是通过使用网络接口卡，或 `NIC`（读作 *nick*）来实现的。`NIC` 需要物理地安装在你的 UNIX 系统中。系统主板上的若干被称为\
  \ `slots`（槽）的连接点是专门为此目的预留的。事实上，许多 UNIX 系统在厂家出厂时已经安装了 `NIC`。\n\n在将 `NIC` 物理安装到你的系统中后，你需要告诉\
  \ UNIX 如何识别并与其通信。在 UNIX 中，所有与硬件的通信都通过称为“设备”（devices）的特殊文件处理。这些设备需要在内核中进行配置。因此，当你添加一个新的\
  \ `NIC` 时，需要确保内核已有相应的设备文件可用。通常情况下，你的系统会在系统启动时自动检测已安装的 `NIC` 的存在及其当前配置。然而，在某些 UNIX\
  \ 版本中，有必要运行配置程序来告知系统新添加的 `NIC`。第 565 页\n\n你需要运行的配置程序取决于你正在使用的 UNIX 版本。这些程序通常是菜单驱动的，并引导用户配置新设备。要确保\
  \ UNIX 内核已识别新设备条目的一种相对简单的方法是查看系统启动时显示的消息。这些信息可能会飞闪而过，使得检查非常困难。幸运的是，这些信息也会被写入一个特殊的日志，可以使用\
  \ `dmesg` 命令进行显示。第 566 页\n\n\n\n\n1. 输入命令 `dmesg | more` 并查找与以太网设备的引用。\n\n2. 根据你系统的启动过程，`dmesg`\
  \ 的内容可能太大且杂乱，难以翻阅查找以太网驱动程序的引用。如果是这样，输入 `dmesg | grep eth` 来准确定任何定义的设备。列表 22.1 展示了该命令在我的\
  \ `dmesg` 文件上的执行结果。\n\n列表 22.1 查找以太网卡。\n```\n# dmesg | grep eth eth0: WD80x3 at\
  \ 0x300, 00 00 C0 FE 55 28, IRQ 5, 0xca00\n```\n\n3. `dmesg` 的输出显示了已安装 NIC（NIC）的当前配置。在列表\
  \ 22.1 的示例中，UNIX 设备 `eth0` 对应使用 IRQ 5 安装的 NIC，内存地址为 `ca000`，I/O 通道 `300`。这些值是制造商提供的默认值。如果我想更改其中任何值，必须遵循\
  \ NIC 制造商的说明进行操作。\n\n4. 现在你已经知道 UNIX 系统如何引用已安装的 NIC，你可以使用名为 `ifconfig`（读作 *if config*）的接口配置程序对其进行配置。许多（但并非所有）版本的\
  \ UNIX 都为我们提供了通过 `netstat` 命令确认设备存在的方法。输入 `netstat -i` 并按回车。此命令显示所有系统接口的状态，任何未配置的接口其设备名称旁边都会有一个星号。\n\
  \n### 检查 IP 地址\n\n每个 NIC 都需要分配一个唯一地址以便 TCP/IP 协议正常工作。分配的 IP 地址取自可用的 32 位二进制地址空间。然而，为了简单易于使用，你可以使用被称为“十进制点表示法”（Decimal\
  \ Dot Notation）的概念来引用此地址空间。十进制点表示法的操作是将一个 32 位 IP 地址分为四个相等的部分，每部分长 8 位。这些 8 位值中的每一个都可以表示为十进制，每个十进制数之间用点隔开。列表\
  \ 22.2 说明了这一点；注意当地址被划分并表示为十进制数时，引用它将变得容易得多。\n\n列表 22.2 通过十进制表示法表示 IP 地址。\n```\n\
  00000110000001100000001000000001 - 32 位二进制值\n10.10.2.1 - 分为 4 个等部分的十进制值\n```\n\n\
  记住你使用 TCP/IP 协议在网络内的不同主机之间移动数据。要成功实现此点，每个主机都需要唯一的 IP 地址。事实上，一个网络主机对于每个安装的 NIC 可以有多个\
  \ IP 地址。你可以使用名为 `ifconfig` 的标准程序为 NIC 分配 IP 地址。以下任务提供了一个快速示例：\n\n1. 以 root 身份登录\
  \ UNIX（只有 root 用户可以执行 `ifconfig` 命令）。\n2. 在命令行输入以下命令：`ifconfig eth0 130.100.10.1`，将\
  \ `eth0` 替换为已安装并配置的 NIC 设备名称，并将 `130.100.10.1` 替换为你想分配给此接口的 IP 地址。\n3. 你也可以运行 `ifconfig`\
  \ 命令来报告任何已安装接口的配置。要做到这一点，输入 `ifconfig -a`。使用 `-a` 开关告诉 `ifconfig` 报告所有安装接口的配置。列表\
  \ 22.3 提供了一个示例。\n\n列表 22.3 ifconfig 配置详情。\n```\n#ifconfig -a le0:flags=63<UP, BROADCAST,\
  \ NOTRAILERS, RUNNING>\n  inet 10.252.10.66 netmask fffe0 broadcast 10.252.10.95\n\
  eth0:flags=63<UP, BROADCAST, NOTRAILERS, RUNNING>\n  inet 130.100.10.1 netmask fffff000\
  \ broadcast 130.100.255.255\neth1:flags=63<UP, BROADCAST, NOTRAILERS, RUNNING>\n\
  \  inet 10.252.10.33 netmask fffe0 broadcast 10.252.10.63\n```\n\n注意列表 22.3 中的 `ifconfig`\
  \ 报告 `eth0` 的 IP 地址为 `130.100.10.1`，掩码值为 `130.100.255.255`。为了理解 IP 地址，你需要意识到该地址同时标识了主机地址和网络地址。掩码值用于指示\
  \ IP 地址的哪部分是主机部分，哪部分是网络部分。掩码的构建方式是使用二进制 1 覆盖地址的网络部分，这对于十进制点表示法中的每个十进制数都等于 255。如果我们将提供的掩码应用于任何\
  \ IP 地址，它将揭示地址的主机部分和网络部分。列表 22.4 中的后续示例提供了一个掩码如何使用的示例。\n\n列表 22.4 检查掩码值。\n```\n\
  00000110000001100000001000000001 - 分为 4 个等部分 10.10.2.1 - 每个表示为十进制值\n255.255.0.0\
  \ - 十进制掩码值\n11111111111111110000000000000000 - 二进制掩码值\nmasked.masked.2.1 - 掩码覆盖了前两个十进制数留下主机地址\n\
  10.10.host.host - 掩码覆盖了网络\n```\n\n\n\n总的来说，IP 地址空间被分为三个主要组，称为地址类。每种类都提供了一个适用于特定网络类型的地址空间。表\
  \ 22.1 详细列出了这些分类的划分情况，指出了地址范围和典型的网络用途。\n\n### 表 22.1 理解整个 IP 地址空间\n\n| 地址类 | 地址范围\
  \ | 默认掩掩码 | 典型用途和功能 |\n| :--- | :--- | :--- | :--- |\n| A 类 | 1.0.0.0 127.255.255.255\
  \ | 255.0.0.0 | A 类地址包含较少量的网络地址，但每个网络可以寻址超过 1600 万个主机。 |\n| B 类 | 128.0.0.0 191.255.255.255\
  \ | 255.255.0.0 | B 类地址空间为大量中等网络提供了支持，每个网络包含超过 6 万个主机。 |\n| C 类 | 192.0.0.0 223.255.255.255\
  \ | 255.255.255.0 | C 类地址空间为数百万小规模网络提供了支持，每个网络最多包含 254 个主机。C 类限制 223.255.255.255\
  \ 以上地址空间被保留并应被忽略。 |\n\n表 22.1 表明，你只需通过地址的第一个十进制数字就可以判断该 IP 地址属于哪一类；通过使用默认掩掩码值，你可以自动确定网络号和主机地址。\n\
  \n在配置 IP 地址时，你可以选择使用默认掩掩码值，或者指定你自己的掩码，从而能够引用更多的网络，每个网络包含更少的主机。这些额外的网络被称为子网络（subnetworks），因为它们地址类的子集，而掩码现在被称为子网络掩码（subnet\
  \ mask）。你可以使用 `ifconfig` 程序来定义子网络掩码值。\n\n1. 以 root 管理员身份登录 UNIX。输入 `ifconfig a`\
  \ 来报告系统中安装的所有接口的当前配置。选择一个接口。我将使用接口 `eth0`。你应该将该接口的引用替换为你自己的接口。\n2. 输入 `ifconfig\
  \ eth0 130.100.10.1`，然后按回车。\n3. 输入 `ifconfig eth0`，注意掩码值被设置为 B 类的默认值 `255.255.0.0`，或者如果你的系统以十六进制显示，则为\
  \ `ffffffff0000`。\n4. 输入 `ifconfig eth0 130.100.10.1 netmask 255.255.255.0`，然后按回车。\n\
  5. 输入 `ifconfig eth0`，注意掩码被设置为值 `255.255.255.0`，或者如果你的系统以十六进制显示，则为 `ffffffff00`。\n\
  \n`ifconfig` 程序具有许多额外选项，允许用户更改 TCP/IP 协议在给定接口上的运行方式。这些设置的细节超出了本章的范围。要需更详细的功能划分，请参考\
  \ UNIX 的 `man` 页面。在退出 `ifconfig` 程序之前，进行最后一次更改是有帮助的：设置广播值。\n\n在 TCP/IP 协议的发展过程中，产生了两种关于接口应如何向任何网络上的所有主机发送数据包的流派。记得我们讨论过的，IP\
  \ 地址由主机部分和网络部分组成。两种方法都认为 IP 地址的网络部分需要被识别，但其中一种方法决定此网络内的所有主机将通过主机部分中的全 1 来识别，而另一种方法则指定为全\
  \ 0。随着时间的推移，全 1 占据了主导地位。到目前，它是最常见的设置；然而，由于该选项存在，检查你的接口配置以确保你正在使用正确的设置是非常关重要的。\n\n\
  创建一个任务列表来说说明如何使用 `ifconfig` 程序报告接口配置并记录全 0 广播，然后将其更改为全 1。该列表还说明了 `ifconfig` 命令的完整用法，包括\
  \ IP 地址、子网络掩码和广播地址。\n\n1. 以 root 管理员身份登录 UNIX，并输入以下命令（将指定值替换为匹配你的配置和地址需求）：`ifconfig\
  \ eth0 130.100.10.1 netmask 255.255.255.0 broadcast 130.100.10.0`。然后按回车。\n2. 输入\
  \ `ifconfig eth0`，注意该接口的广播地址已设置为 `130.100.10.0`。\n3. 现在配置接口以全 1 广播（记住这是最常用的设置）。为了实现这一点，输入以下命令：`ifconfig\
  \ eth0 130.100.10.1 netmask 255.255.255.0 broadcast 130.100.10.255`，并按回车。\n4. 输入\
  \ `ifconfig eth0`，注意该接口的广播地址已设置为 `130.100.10.255`。\n\n### 为 UNIX 主机命名\n\n通过 IP 地址引用\
  \ UNIX 主机可能会很繁琐；通过给你的主机命名可以让事情变得更容易。为了做到这一点，你在 `/etc/hosts` 文件中提供一个条目：\n\n1. 以 root\
  \ 管理员身份登录 UNIX（更改主机名是只有 root 才能执行的操作之一）。\n2. `/etc/hosts` 文件用于将主机名与我们系统的 IP 地址关联。当我们引用此主机名时，系统将引用\
  \ `/etc/hosts` 文件来确定对应的 IP 地址。`/etc/hosts` 文件可以扩展以包含对我们需要访问的其他主机的引用。\n\n\n\n\n\n\
  # 网络工具使用\n\n进入 `/path/to/xxx` 目录，找到 `xxx.json`。\n\n在表达式 `cvar = avar + bvar` 中，加法运算符（+`）将\
  \ `avar` 与 `bvar` 相加，得到它们的和 `cvar`。\n\n在 `List.of(arg0, arg1, arg2)` 中，`List` 接口的方法\
  \ `of()` 接受一系列元素，返回它们的只读列表。\n\n之后这样调用 `cmd arg0 arg1`：\n\n```bash\nif (condVar >\
  \ someVal) {\n    console.log(\"xxx\")\n}\n```\n\n## 编辑 hosts 文件\n\n3. 编辑 `/etc/hosts`\
  \ 文件。输入以下命令：`vi /etc/hosts` 然后按 Enter。Listing 22.5 提供了一个 `/etc/hosts` 文件的示例。文件中的排列方式如下。\n\
  \n4. `/etc/hosts` 文件中的每一行都提供主机到 IP 地址的映射。多个主机（作为别名）可以对应同一个 IP 地址。按 `o` 在 `/etc/hosts`\
  \ 文件中添加新行。输入接口的 IP 地址，按 `Tab` 键输入主机。\n\n5. 在 Listing 22.5 示例中，我为地址 `130.100.50.1`\
  \ 添加了 `fin.sales.catfish.com` 的条目。按 `Esc` 然后 `Shift+ZZ` 保存并退出 `/etc/hosts` 文件。\n\
  \nListing 22.5 是 `/etc/hosts` 文件的样本。每个条目对应一个特定的主机。\n\n```text\n# include and entry\
  \ for the loopback interface\n127.0.0.1               localhost\n# include entries\
  \ for host machines here\n# IP address         hostname            alternative names\n\
  #\n130.100.10.1        www.catfish.com      web\n130.100.10.10       man.catfish.com\
  \      manhost     loghost\n130.100.50.1        fin.sales.catfish.com\n10.100.4.2\
  \          mars.catfish.com\n# corporate nameserver\n10.193.10.1         dns.catfish.com\
  \     namsrv\n```\n\n## 使用 Ping 测试连接\n\n`ping` 程序是 TCP/IP 网络中最常用的工具。`ping` 用于测试主机之间的连通性。这是通过“控制消息报协议”（简称\
  \ `ICMP`）的操作实现的。\n\n`ping` 程序通过向远程主机发送 `ICMP ECHO REQUEST` 包来工作。当主机接收到包时，会返回一个 `ICMP\
  \ ECHO_RESPONSE` 包。通过这种方式，我们使用 `ping` 工具具有两个用途：确认主机之间的端到端连通性，以及测量往返延迟或到达远程主机的速度。\n\
  \n1. 登录 UNIX。不需要 root 权限，任何人都可以运行 `ping` 命令。\n2. 滚动到 `/etc/hosts` 文件中需要添加条目的行。你可以通过按\
  \ `j` 键或方向键来实现。在示例中，我移动到 `130.100.50.1` 条目并移动到行尾。\n3. 按 `a` 在此行添加新别名。输入新主机名 `accounts`。\n\
  4. 可以指示 `ping` 向远程目标发送多少个 `ICMP` 包；在我们的示例中，我们没有指定数量，因此命令需要通过控制中断（Ctrl+C）终止。默认情况下，数据包长度为\
  \ 56 字节；基础上增加了 8 字节的 `ICMP` 头。远程主机返回 `ECHO_RESPONSE` 包。对于这些包，`ping` 工具将显示递增的序列号、生存时间（`ttl`）值（每经过一个网关减\
  \ 1）以及以毫秒为单位的往返延迟。\n5. 也可以指定主机名而不是 IP 地址。如果这样做，`ping` 在执行连接测试前需要先解析主机。输入以下命令：`ping\
  \ mars.catfish.com` 然后按 Enter。\n\n```bash\nping 130.100.10.1 (130.100.10.1): 56\
  \ bytes data\n64 bytes from 130.100.10.1: icmp_seq=0 ttl=252 time=215 ms\n64 bytes\
  \ from 130.100.10.1: icmp_seq=1 ttl=252 time=216 ms\n64 bytes from 130.100.10.1:\
  \ icmp_seq=2 ttl=252 time=217 ms\n64 bytes from 130.100.10.1: icmp_seq=3 ttl=252\
  \ time=216 ms\n64 bytes from 130.100.10.1:\n--- ping statistics ---\n5 packets transmitted,\
  \ 5 packets received, 0% packet loss\nround-trip min/avg/max = 215/216/217\n```\n\
  \n取决于 UNIX 版本，`aix`、`sco` 和 `linux` 的工作方式与 Listing 22.6 一。此外，其他 PC 系统的 TCP/IP 实现也是这种方式。然而，Solaris\
  \ 自带的 `ping` 版本如你概述所示所示。\n\n\n\n\n\n```\n64 bytes from 130.100.10.1: icmp_seq=2.\
  \ ttl=252 time=217. ms\n64 bytes from 130.100.10.1: icmp_seq=3. ttl=252 time=216.\
  \ ms\n64 bytes from 130.100.10.1: icmp_seq=4. ttl=252 time=216. ms\n^c\n\n---PING\
  \ STATISTICS-----------------------------------------------\n5 packets transmitted,\
  \ 5 packets received, 0% packet loss\nround-trip min/avg/max = 215/216/217\n```\n\
  \n## 检查域名服务是否正在运行\n\n在前面的节中，我概述了 `/etc/hosts` 文件的操作，并指出了该文件如何提供在 IP 地址和主机名之间进行映射的便捷方法。使用\
  \ `/etc/hosts` 文件的局限性之一是你需要确保网络中的所有主机都具有相同的地址映射。随着我们网络主机数量的增加，这显然会带来一些巨大的维护问题。更重要的是，想象一下，如果我们必须在\
  \ `/etc/hosts` 文件中为我们想要访问的任何主机创建 IP 地址条目，那么互联网访问将变得多么低效！\n\n`ping` 程序的实现在不同的 UNIX\
  \ 实现之间有所不同，需要使用不同的开关设置来启用某些功能。例如，如果你在 Sun 工作站上输入 `ping mars.catfish.com`，你会期望响应显示\
  \ `mars.catfish.com` 是活跃的。如果你想获得如列表 22.6 和 22.7 所示的统计数据，你需要使用 `-s` 开关并指定数据包大小以及你想发送的\
  \ `ECHO_REQUEST` 包的数量。例如，命令 `ping -s mars.catfish.com 56 5` 将告诉 `ping` 向远程主机 `mars.catfish.com`\
  \ 以五个独立的请求包发送 56 字节的数据。\n\n显然，需要一种替代方案。这种替代方案就是域名系统，或者简单地称为 `DNS`。`DNS` 通过一组分层数据库提供主机名到\
  \ IP 地址的映射。在 `DNS` 的帮助下，可以查询单个主机（域名服务器）并定位任何网络主机。现在，域名服务器将跟踪其所属网络内的 IP 地址和主机名，但它知道如何以及向何处转发网络或网域之外的主机请求。通过这种方式，我们就可以定位并维护像互联网这样大型网络的\
  \ IP 到主机名的映射了。\n\n所以，有两个问题：1. 我们如何知道我们的主机已配置为使用 DNS？2. 我们如何告诉我们的 TCP/IP 程序去访问此配置？嗯，所有的\
  \ TCP/IP 程序只要被提供 IP 地址或主机名，就可以正常工作。然而，如果提供的是主机名，程序首先需要将该名称解析为 IP 地址。此解析过程从检查查找本地\
  \ DNS 配置开始；如果查找失败，程序将尝试在 `/etc/hosts` 文件中查找匹配的条目；如果仍然失败，它将发布 `unknown host`（未知主机）的错误信息。\n\
  \n在你的 UNIX 主机上创建一个解析文件。输入 `vi /etc/resolv.conf` 然后按回车。如果 `resolv.conf` 文件不存在，在使用\
  \ `vi` 时会创建一个。按 `o` 键开始新的一行，并输入 `domain catfish.com`。然后按回车。你需要在配置文件中包含 DNS 服务器的\
  \ IP 地址。要做到这一点，输入关键字 `nameserver`，后跟一个空格和你的网络 DNS 服务器的 IP 地址。保存文件并按 `Esc` 键按 `Shift\
  \ ZZ` 退出 `vi` 程序。\n\n列表 22.8 展示了我的 `/etc/resolv.conf` 文件，它包含了两个 DNS 服务器的引用：一个主服务器和一个备用（备份）服务器。\n\
  \n### 列表 22.8 一个 /etc/resolv.conf 文件示例。\n\n```\n# /etc/resolv.conf\n# 默认域设置\ndomain\
  \ catfish.com\nnameserver 130.100.10.10\nnameserver 130.100.10.50\n```\n\n\n\n\n\
  重要的是，`ping` 程序并不总是能准确地反映你是否已连接互联网。这是因为某些公司限制了允许从互联网进入的应用程序流量类型。如果你的 `ping` 程序因“主机不可达”（host\
  \ unreachable）的错误信息失败，请尝试使用 Web 浏览器连接到主要的互联网网站。\n\n如果你仍然无法访问互联网，可能是因为你需要通过代理服务获取访问权限。`proxy`\
  \ 由安全的第三方代表用户提供应用程序服务。这个第三方被称为 `proxy server`（代理服务器），它通常（但并非总是）集成在互联网防火墙服务器中。使用\
  \ `proxy` 意味着单个用户无需与外部设备进行直接通信，从而增加了网络安全性。\n\n如果你的站点正在使用代理，你需要确保你的应用程序如 `Telnet`、`FTP`\
  \ 和 Web 浏览器已配置为使用代理服务。此配置涉及输入运行代理的主机 IP 地址，以及应用程序运行的端口号。图 22.2 展示了我的 Web 浏览器程序如何配置代理服务器和端口。\n\
  \n![8227-0578a.gif](img/e6b52eaed6cfdcb29635f1575b01c8dd.gif)\n图 22.2 配置 Web 浏览器使用代理服务。\n\
  \n# 通过网络登录 UNIX\n\n在建立连接后，你可以开始在网络上执行某些应用程序。下一节将检查若干应用程序的执行情况，并说明可以实现哪些功能。\n\n##\
  \ 使用 Telnet 登录\n\n1. `Telnet` 程序为我们提供了登录并访问远程主机资源的能力。`Telnet` 程序将远程主机名或 IP 地址作为参数，并尝试打开与指定主机连接。输入以下命令，将指定的主机替换为你自己的主机名：`Telnet\
  \ www.catfish.com`。然后按回车。\n\n2. `Telnet` 程序将首先尝试解析主机 `www.catfish.com`。注意列表 22.9\
  \ 中它是如何做的，然后使用 IP 地址连接到远程服务器。一旦连接成功，将显示登录提示。\n\n```\nListing 22.9 An Telnet connection.\n\
  # telnet www.catfish.com.\nTrying 130.100.10.1...\nConnected to www.catfish.com.\n\
  Escape character is '^'. (www.catfish.com)\nlogin:\n```\n\n3. 输入有效的用户名和密码登录远程主机。登录成功后，输入\
  \ `who` 查看还有哪些用户登录在此主机上。要退出，输入 `exit` 并按回车。\n\n4. `Telnet` 程序也可以在交互模式下工作。为了演示这一点，输入\
  \ `Telnet` 并按回车。\n\n## rlogin 比 Telnet 更优吗？\n\n`rlogin` 程序是许多用于在 TCP/IP 网络上运行的 r-utilities（`r`\
  \ 代表远程，远程）之一。该程序与 `Telnet` 程序非常相似，允许用户在远程主机上操作终端会话。然而，与 `Telnet` 不同，`rlogin` 程序不需要我们提供用户名和密码。\n\
  \n`r-utility` 程序引用了两个配置文件：`/etc/hosts.equiv` 以及一个可选存储在用户主目录下的名为 `.rhosts` 的文件。假设我们的网络中有两个主机，一个叫\
  \ `jupiter`，另一个叫 `mars`，它们都在 `catfish.com` 域内。\n\n所有网络用户在每个主机上都有账户，用户名构造方式相似（两个用户名都是名字首字母加姓氏的形式，例如\
  \ `jedwards`）。通过配置 `/etc/hosts.equiv` 文件，我们可以允许用户仅需登录到本地机器并使用 `rlogin` 程序，即可访问任一机器。以下任务列表说明了如何实现这一目标：\n\
  \n1. 以 root 管理员身份登录 UNIX，输入 `vi /etc/hosts.equiv` 并按回车。\n\n2. 按 `o` 然后按回车向 `/etc/hosts.equiv`\
  \ 文件添加新的一行。在这一新行上，为你想要提供访问权限的主机添加条目。在我的示例中，我会输入 `jupiter.catfish.com`。保存并退出 `/etc/hosts.equiv`\
  \ 文件。\n\n3. 注销 root 用户，然后使用另一个用户账户登录到 `jupiter.catfish.com` 服务器。在 shell 提示符下，输入以下命令：`rlogin\
  \ mars.catfish.com`。然后按回车。`rlogin` 命令会将登录请求转发到远程主机。服务器通过在自己的 `/etc/hosts.equiv`\
  \ 中查找用户的本地主机名来检查等效性。如果找到匹配项，则允许登录并在远程主机上启动 shell 程序。\n\n此时，我们可以通过在特定用户的主目录中创建 `.rhosts`\
  \ 文件来启用类似的功能。考虑相同的主机配置。但假设我们没有配置 `/etc/hosts.equiv` 文件，却需要为其中一个用户账户提供主机之间的等效访问权限。\n\
  \n1. 以用户身份登录 `mars.catfish.com` 主机。使用 `vi` 程序在用户主目录下创建一个名为 `.rhosts` 的新文件。这类似于：：`vi\
  \ $HOME/.rhosts`\n\n\n\n\n2. 按 `o` 开始新行并添加以下条目：`jupiter.catfish.com  jedwards`。第一个条目是远程主机名；第二个是我们将赋予等效权限的主机上的登录账户名。完成后，保存文件并退出\
  \ `vi`。\n\n3. 登出 `mars.catfish.com` 主机并使用用户名 `jedwards` 登录 `jupiter.catfish.com`。现在，在\
  \ UNIX shell 提示符下，执行命令：`rlogin mars`。然后按回车。再次，由于我们已经在主机之间创建了等效关系，你将自动登录到 `mars`\
  \ 服务器，而无需提供用户名或密码。\n\n通过这些示例，你应该能看到 `/etc/hosts.equiv` 或 `.rhosts` 的配置都可能成为一项非常强大的资产，但同时也引发了一些严重的安全问题。不诚实的用户可以对这两个文件中的任何一个进行更改，从而访问任何主机账户。以下点为限制滥用主机等效性提供了一些指南：\n\
  \n- 为 `/etc/hosts.equiv` 文件设置有效的权限权限。\n- `/etc/hosts.equiv` 文件的权限应设置为仅允许 `root`\
  \ 编辑。系统的其他用户需要读取访问，但建议不要启用该文件对所有人可读。\n- 绝不要在 `/etc/hosts.equiv` 文件中包含加号 (`+`)。\n\
  - 加号本身提供对任何及所有主机的等效性，这意味着从所有网络主机都授予对任何同名账户的访问。不诚实的用户要访问远程主机账户唯一需要做的就是在他们的本地机器上创建一个同名的账户。\n\
  - 仅包含特定主机的名称，而不包含单个账户。\n- 避免允许用户创建 `.rhosts` 文件。通常情况下，之前对 `/etc/hosts.equiv` 文件检查的相同安全规则也需要适用于\
  \ `.rhosts` 文件。然而，由于任何用户都可以在自己的家目录下创建 `.rhosts` 文件，要确保每个文件内部的语法将是一场管理上的噩梦。建议通过 `/etc/hosts.equiv`\
  \ 文件设置任何所需的账户等效关系，不要使用 `.rhosts` 文件。在需要不同名称账户之间存在等效性时，应始终提供账户用户名和密码。\n\n### 跨网络传输文件\n\
  \n`Telnet` 和 `rlogin` 命令提供了远程用户访问系统的方法，但不是一种跨网络传输文件的有效方法。这些缺陷通过文件传输协议（或简称为 FTP）的操作得以缓解。下一节将检查\
  \ FTP 的操作，并说明如何使用它在 UNIX 主机之间传输文件。FTP 既可以通过命令行操作，也可以交互式操作。让我们从交互式来看。\n\n1. 以任意用户身份登录\
  \ UNIX，但不要登录 `root` 账户。在 shell 提示符下，输入命令 `ftp` 并按回车。\n2. `ftp` 程序将进入命令模式并提供提示符 `ftp>`。输入单词\
  \ `open` 并按回车。\n3. FTP 将提示你想要连接的远程主机名称。在此提示符处，我输入了主机名 `ftp.catfish.com` 来访问我的 FTP\
  \ 机器。输入你网络内另一个 UNIX 系统的主机名。\n4. 如果成功，远程服务器将提示你输入用户名然后是密码。在你的系统上输入这些信息。FTP 将通知你操作成功并返回到\
  \ `ftp>` 提示符。我们现在已连接到远程服务器并可以传输文件。列表 22.10 提供了这些任务的插图。\n\n#### 列表 22.10 使用 ftp 访问远程主机\n\
  \n```\n# ftp> open (to) ftp.catfish.com.\nConnected to ftp.catfish.com. \n220 ftp\
  \ server (Monday, March 30 12:12:22 EST 1998) ready.\n.\nName (ftp.catfish.com.\
  \ james\n331 password required for james.\nPassword: *******\n230 Guest login ok,\
  \ access restrictions apply.\nftp>\n```\n\n#### 列表 22.11 使用 ftp 列出文件\n\n`ftp` 程序允许你显示并移动远程服务器上的文件。输入命令\
  \ `ls -l` 并按回车。FTP 提供了 `ftp.catfish.com` 上的文件列表。\n\n```\nftp> ls -l\n200 Okay\n\
  Opening connection for /bin/ls\ntotal 6\n-rw-rw-r-x  1 root     1634 Apr 4 1996\
  \ cu_mor\n-rw-r--r--  1 root      424 Apr 4 1996 source.c\n-rw-rw--r--  1 root \
  \    3234 Apr 4 1996 fam.c\n-rw-rwxr--  1 root      634 Apr 4 1996 pigsou.c\n-rw-rw-r-x\
  \  1 root     1634 Apr 4 1996 cracko.4\n-rw-r-xrwx  1 root      234 Apr 4 1996 sevent\n\
  226 Transfer complete.\nftp>\n```\n\n6. 让我们从 `ftp.catfish.com` 将 `source.c` 文件传输到我们的本地主机。在此之前，让我们切换到本地主机上的家目录；我们通过\
  \ `ftp` 命令 `lcd` 执行此。输入以下内容，将文件引用替换为你自己的家目录：`lcd /home/james`。\n\n\n\n\n\n7. 要传输文件，输入\
  \ `get source.c` 并按回车。`ftp` 程序将传输该文件，并指示传输何时完成。\n\n## 使用 FTP 传输多个文件\n\n1. `ftp`\
  \ 程序也可以一次性传输多个文件。让我们通过传输 `ftp.catfish.com` 远程目录中的所有文件来尝试一下。然而，在在此之前，我们我们需要对当前的 `FTP`\
  \ 会话进行一些调整。\n\n2. 注意列表 22.11，远程子目录中包含的一些文件实际上是可执行文件。因此，我们需要告诉 `ftp` 以 `Binary`（二进制）模式而非\
  \ `Text`（文本）模式传输这些程序。这可以通过输入单词 `binary` 并按回车来实现。\n\n3. 此外，我们不需要一个接一个地传输文件，而是可以使用\
  \ `mget` 命令一次性传输多个文件。但是，默认情况下，`mget` 程序将在 `Interactive mode`（交互模式）下工作，对每个文件进行提示。我们可以通过关闭\
  \ `FTP Interactive mode`（FTP 交互模式）来克服这个问题。输入单词 `prompt` 即可完成。\n\n4. 现在我们准备好从远程主机传输所有文件了。输入命令\
  \ `mget` 并按回车。`ftp` 程序将提示要获取的文件。输入 `*.*` 来传输所有文件。`FTP` 将逐个传输文件，指示每次传输何时完成，以及性能统计数据，如传输时间和系统之间复制的字节数。\n\
  \n5. 列表 22.12 提供了这些任务的总结。注意我还添加了 `FTP` 命令哈希值。这会导致 `FTP` 每传输 1024 字节就在屏幕上打印一个哈希标记（`#`）。这可能非常有用，特别是当需要传输大文件时。你应该注意，不同的\
  \ UNIX 版本之间哈希标记之间的字节数可能会略有不同。\n\n列表 22.12 使用 FTP 传输多个文件。\n\n```\nftp> binary\n200\
  \ type set to I.\nftp> prompt\nInteractive mode off\nftp> hash\nHash mark printing\
  \ on\nftp> mget\n(remote-files) *.*\nlocal: cu_mar remote: cu_mar\n200 Okay\n```\n\
  \n```\n150 Opening connection for XXX (bytes). 226 Transfer complete.\nlocal: source.c\
  \ remote: source.c\n200 Okay\n150 Opening connection for XXX (bytes). ####\n226\
  \ Transfer complete. 4560 bytes received in 0.0467 secs (9.5e+02 K/sec)\nlocal:\
  \ frames.c remote: frames.c\n200 Okay\n150 Opening connection for XXX (bytes). ################################\n\
  226 Transfer complete. 11595 bytes received in 0.347 secs (3.3e+02 K/sec)\nlocal:\
  \ pigsou.c remote: pigsou.c\n200 Okay\n150 Opening connection for XXX (bytes). #################################################\n\
  226 Transfer complete. 1570 bytes sent in 0.01432 secs (1.9e+02 K/sec)\nlocal: cracko.4\
  \ remote: cracko.4\n200 Okay\n150 Opening connection for XXX (bytes). #\n226 Transfer\
  \ complete. 240 bytes sent in 0.00299 secs (1.9e+02 K/sec)\n```\n\n注意：可以在 `ftp`\
  \ 提示符处按问号（`?`）键显示所有可用的 `FTP` 命令。此外，请记住在设置 `prompt`、`hash`、`binary` 等命令时，这些都是切换命令，可以通过再次输入该命令来重置。\n\
  \n`ftp` 工具可将文件从本地主机传输到远程主机。其实现方法与之前类似。然而，不要使用 `get` 和 `mget`，而是使用 `put` 和 `mput`。\n\
  \n## 使用 rcp 传输文件\n\n就像 `rlogin` 为我们提供了使用 `Telnet` 的替代方案一样，另一个 `r-utilities` 也为我们提供了使用\
  \ `FTP` 传输文件的替代方案。使用 `rcp` 需要在用户主目录下配置 `.rhosts` 文件。以下示例将在阐述该工具的操作之前，引导我们完成必要的置的\
  \ `.rhosts` 配置。\n\n1. 使用普通账户登录远程主机，而不是使用 root 用户。输入以下命令在账户主目录下创建一个新的 `.rhosts` 文件：`vi\
  \ $HOME/.rhosts`。然后按回车。\n\n2. 按 `o` 在此文件中开启新行，并输入你的本地主机名称以及你想授予访问权限的主机账户名。例如，我的本地主机是\
  \ `jupiter.catfish.com`，在该主机上的账户名是 `jedwards`。因此，我在远程主机的 `.rhosts` 文件中了如下条目：`jupiter.catfish.com\
  \ jedwards`。\n\n3. 保存 `.rhosts` 文件，退出 `vi` 并注销远程主机。现在你准备好执行任何 `r-utilities` 了。\n\
  \n\n\n\n4. 登录到你的本地主机（你在第 2 步中添加条目的那个主机）。输入以下命令创建一个用于测试 `rcp` 实用的新文件：`touch testfile`。然后按回车。输入以下命令运行\
  \ `rcp` 实用，将该文件的副本放在远程服务器 `mars.catfish.com` 的主目录下：\n\n```\nrcp testfile mars.catfish.com/home/jedwards/testfile\n\
  ```\n\n5. 传输完成后，登录远程主机并检查文件是否已复制。执行此操作，输入 `rlogin mars.catfish.com`，然后输入 `ls -l$HOME/testfile`。\n\
  \n6. 使用 `rcp` 程序传输文件相比 `ftp` 程序的的一个优势是，它能够对整个目录结构进行递归拷贝。以下命令提供了这方面的示例：\n\n```bash\n\
  rsh -r catfish.com:/usr/lib/source /backup/source\n```\n\n该命令将子目录 `/usr/lib/source`\
  \ 及其所有的底层子目录和文件复制到本地子目录 `/backup/source`。使用 `FTP` 实现类似功能的唯一方法是使用 `tar` 将 `/usr/lib/source`\
  \ 下的所有文件打包，然后传输该文件。显然，`rcp` 为我们提供了更大的灵活性。\n\n# 在网络中的另一个系统上执行命令\n\n`rsh` 程序（有时读作\
  \ *rush* 或 *r-s-h*）提供了一种无需先登录即可在远程主机上执行命令的方法。正如程序名称所示，它是 r 系列工具的另一种。因此，在使用该命令之前，需要应用在本章之前介绍过的\
  \ `/etc/hosts.equiv` 和 `.rhosts` 配置。\n\n1. 在远程主机的 `.rhosts` 文件中为你的本地 UNIX 主机创建一个条目。在我的情况下，我会通过登录主机\
  \ `mars.catfish.com`（我的远程主机）并输入 `vi $HOME/.rhosts`，然后在保存并退出文件之前添加条目 `jupiter.catfish.com`。\n\
  \n2. 注销远程主机并登录本地主机。输入以下命令 `rsh mars.catfish.com /bin/ls` 来执行 `rsh` 命令以便在远程主机上运行\
  \ `/bin/ls` 程序。然后按回车。\n\n3. `rsh` 命令将生成远程主机 `$HOME` 目录的文件列表。尝试在远程主机上执行一些可执行文件。以下是一些示例。\n\
  \n4. 输入命令 `rsh mars.catfish.com /bin/sh` 在远程主机上启动一个 UNIX shell。\n\n5. 命令 `rsh mars.catfish.com\
  \ who` 会显示当前登录到远程主机的用户。\n\n6. 执行 `rsh` 命令时不指定要在远程主机上执行的命令，结果将是用户登录到远程主机，这与我们使用 `rlogin`\
  \ 命令的结果相同。要尝试这样做，请输入命令 `rsh mars.catfish.com`。\n\n## 结语\n\n本章概述的任务使你能够让主机接入网络。这将为你运行所有常用的网络应用程序和访问远程系统提供基础。\n\
  \n值得注意的是，由于市面上有近 30 种不同的 UNIX 版本，程序操作和语法的一些差异将显而易见。我尝试采用了一种涵盖大多数主流 UNIX 版本方法的方法；如既常，最好参考你系统的帮助页（man\
  \ pages），以获取本章涵盖的命令和程序的特定版本选项。\n\n# 第 23 章从 Windows 访问 UNIX\n\n作者：James Edwards\n\
  \n## Windows 与 TCP/IP\n\n### 拨号网络\n\n大多数用户在 PC 上运行 Windows 系列操作系统之一。这些用户可能需要与他们网络内部或互联网等公共网络中的\
  \ UNIX 主机进行通信。在本章中，我们将介绍为 Windows 95 用户提供访问 UNIX 方法。\n\n### 即插即用\n\nWindows 操作系统以其即插即用功能为傲。这意味着什么？嗯，当\
  \ PC 上添加调制解调器等新设备时，Windows 会自动尝试识别并配置它。如果需要任何额外的配置信息，Windows 会自动启动一个简单的程序，引导并提示用户提供完成配置所需的信息。\n\
  \n总的来说，操作系统非常出色地完成了这些任务，特别是与任何版本的 UNIX 相比！但是，有很多“陷阱”是你应该注意，本章将识别其中的一些问题。\n\n###\
  \ TCP/IP\n\nTCP/IP 协议是网络领域事实上的标准。Windows 为这些协议提供了原生支持，并带有名为*向导*（wizard）的简单程序，引导用户完成必要的安装和配置过程。\n\
  \n\n\n为了在 Windows 下局域网连接启用有效的 TCP/IP 网络支持，需要配置三个独立的组件：Microsoft 网络客户端、网络接口卡（NIC）适配器以及\
  \ TCP/IP 协议。所有这些配置步骤都依赖 Windows 控制面板中的“网络”图标；以下任务将引导您完成在 Windows 中启用 TCP/IP 网络所需的步骤。\n\
  \n### 启用 TCP/IP 网络\n\n1. **打开控制面板。** 这可以通过点击任务栏上的开始按钮来实现。然后高亮 `Settings` 并点击 `Control\
  \ Panel` 。控制面板打开后，双击网络图标。\n\n2. **在网络窗口中，点击`Configuration` 标签。** 检查窗口下方“已安装以下网络组件”字样下显示的组件列表。要连接到网络，您必须确保存在三个项目：`Client\
  \ for Microsoft Networks`、`NIC Adapter` 和 `TCP/IP Network Adapter`。\n\n3. **如果配置中不存在其中任何项目**，可以通过先点击\
  \ `Add` 按钮来添加它们。您将看到四个选项：添加客户端、协议、适配器或服务。让我们先逐步添加网络客户端。\n\n### 将协议与适配器关联\n\n当安装了多个网络适配器时，Windows\
  \ 95 使用箭头将网络协议与特定的网络适配器相关联。如果只配置了一个网络适配器，Windows 则不提供这种关联，而是直接在网络窗口中列出协议名称。\n\n\
  4. 在 `Component Type` 框中选择 `Client`，然后点击 `Add` 按钮。选择 `Microsoft` 为制造商，并在网络窗口下选择\
  \ `Client for Networking` 选项。点击 `OK` 确认此选择。\n\n5. **以类似的方式添加`NIC Adapter`：** 点击\
  \ `Add` 按钮，选择 `Adapter` 选项，再次点击 `Add` 按钮。高亮您安装的 `NIC` 的制造商；如果没有显示确切的 `NIC`，请点击 `Have\
  \ Disk` 并按照指示从软盘加载 `NIC` 厂商的驱动程序。点击 `Add` 按钮然后点击 `OK` 按钮确认。\n\n6. **接下来，让 Windows\
  \ 加载`TCP/IP` 协议**，并配置其在已安装的 `NIC` 上使用。点击 `Add` 按钮，这次选择 `Protocol`。点击 `Add` 按钮，并在可用列表中选择\
  \ `Microsoft`。指定 `TCP/IP` 为要添加的网络协议，并通过点击 `OK` 按钮完成操作。\n\n7. **在此阶段，我们已经加载了所有网络组件**，但尚未配置其中任何一个。首先，配置\
  \ `NIC`。在“已安装以下网络组件”下的选项窗口中，点击一次您的 `NIC Adapter` 项目。\n\n8. **点击`Properties` 按钮然后点击\
  \ Driver type。** 选择 `Enhanced Mode (32 bit and 16 bit)` NDIS 驱动程序选项。点击 `Bindings`\
  \ 标签，并勾选 `TCP/IP NIC Adapter` （其中 `NIC` 将反映您的 NIC 制造商）。点击 `OK` 按钮完成此配置。\n\n9. **现在配置`TCP/IP`\
  \ 协议。** 在“已安装以下网络组件”窗口标题栏下，点击一次 `TCP/IP NIC Adapter`，然后点击 `Properties` 按钮。\n\n10.\
  \ **点击`IP address` 标签。** 如果您已被分配 IP 地址，点击一次 `Specify an IP Address` 选项，然后输入您的 IP\
  \ 地址和相应的子网掩码。如果您将通过 `DHCP` 服务器分配 IP 地址，请勾选 `Obtain an IP Address Automatically`\
  \ 选项。\n\n11. **点击`Bindings` 标签**，并勾选 `Microsoft Client` 选项框。点击 `OK` 按钮保存此更改。\n\n\
  12. **所有剩余设置完全是可选的。** 然而，另一个重要选项是 `DNS` 的配置。如果您计划使用 `DNS`（例如为了能够连接互联网），请点击一次 `Enable\
  \ DNS` 选项按钮。在提供的配置框中，添加您想要作为 PC 名称的主机名以及它的域名（例如 `host` 和 `domain.com`）。\n\n13. **您还必须在`DNS\
  \ Server Search Order` 下添加 DNS 服务器的 IP 地址**。点击 `Add` 按钮添加 DNS 引用，然后点击 `OK` 按钮保存这些设置。\n\
  \n### 使用 Ping 测试连接\n\n\n\n\n`ping` 工具作为标准 Windows 操作系统的一部分自带的，它是确认我们的 PC 配置和排除网络连接故障的极佳工具。遗憾的是，Windows\
  \ 自带的 `ping` 版本是一个 DOS 程序，因此必须在 Windows DOS 框中运行。以下任务说明了我们如何使用此命令。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n## 使用 hosts 文件代替 DNS\n\nWindows 支持使用 hosts 文件作为 DNS 的替代方案。该文件位于 Windows 子目录中，其语法与\
  \ UNIX 主机上使用的格式完全相同，将单个 IP 地址映射到指定的主机名。如果您无法访问 DNS 服务器，且不想使用 IP 地址引用您的 hosts，`\\\
  Windows\\hosts` 文件提供了一个非常有用的替代方案。\n\n## 使用 Ping 工具\n\n1. 调出 Windows 任务栏并点击一次“开始”按钮。将光标移动到“运行”选项并点击一次。出现“运行”对话框。在打开提示符处输入以下命令行：`ping\
  \ 130.100.10.2`（将我的 IP 地址替换为您在自己的接口配置中使用的 IP 地址）。\n\n2. `ping` 程序执行，但由于它是一个 DOS\
  \ 程序，它会首先打开一个 DOS 窗口。`ping` 向指定的接口发送请求包，要求其立即响应。如果您正确配置了 PC，您应该看到与图 23.2 所示类似的响应。\n\
  \n![8227-0594a.gif](img/8600cea9e4075f1862eae7eef0ec07ec.gif)\n图 23.2 探测本地接口以检查连接性。\n\
  \n3. 如果您配置了 `\\Windows\\hosts` 文件或可以访问 DNS 服务器，可以使用主机名代替 IP 地址。要进行测试，请激活 DOS 框并输入\
  \ `ping hostname`（将 `hostname` 替换为您的远程主机名）。\n\n## 查看本地 TCP/IP 设置\n\nWindows 提供了一个允许我们查看当前网络配置详细信息的实用工具。该工具称为\
  \ `winipcfg.exe`，位于 `Windows` 子目录中。让我们通过此工具查看某些功能。\n\n### 探测 IP 地址\n\n需要记住，如果您使用主机名，`ping`\
  \ 程序必须在测试主机连接性之前解析该主机名。如果由于某种原因您指定的名称无法解析，`ping` 将无法报告该主机是否可达。因此，在使用 `ping` 时，指定\
  \ hosts IP 地址比指定其主机名更佳。\n\n### winipcfg 工具\n\n1. 调出任务栏并点击一次“开始”按钮，然后点击“运行”菜单选项。这将弹出一个对话框；输入\
  \ `\\Windows\\winipcfg` 作为您想要打开的程序，并按回车键。\n\n2. `winipcfg` 程序启动并显示一个与图 23.3 所示类似的窗口。如图\
  \ 23.3 所示，`winipcfg` 程序显示了可以帮助排除故障的有用信息。\n\n![8227-0595a.gif](img/48382e7409821e608b1c5.gif)\n\
  图 23.3 使用 winipcfg 显示的 TCP/IP 信息。\n\n3. 如果您已为 PC 配置拨号上网网络，点击箭头激活下拉列表并选择 PPP 适配器。`winipcfg`\
  \ 显示该接口的配置。\n\n4. 点击“更多”按钮；`winipcfg` 将展开并包含许多与您的连接相关的额外信息。图 23.4  PPP 适配器配置的插图。\n\
  \n![8227-0595b.gif](img/57660943c71417818c6f3a39cb617ef.gif)\n图 23.4 使用 winipcfg\
  \ 显示 TCP/IP 详情。\n\n## 使用 ftp 与 UNIX 传输文件\n\nWindows 提供了用于文件传输的 ftp 程序标准实现。与 Windows\
  \ 版本的 ping 和 telnet 程序一样，ftp 仅作为 DOS 程序提供。然而，它仍然是 Windows 和 UNIX 主机之间传输文件的实用且有效的方法。\n\
  \n\n\n\n\n## 使用 winipcfg 进行故障排除\n\n如果你的 IP 地址是通过 DHCP 自动分配的，那么使用 `winipcfg` 将证明特别有用。一旦你知道了\
  \ IP 地址，就可以更有效地进行故障排除。此外，请注意 `winipcfg` 显示上的两个额外按钮：`Release All`（全部释放）和 `Renew All`（全部更新）。如果接口确实通过\
  \ DHCP 获取了 IP 地址，这些按钮将为你提供释放或更新你正在使用的 IP 地址的方法。\n\n## 使用 ftp 传输文件\n\n1. 为了使用 `ftp`\
  \ 从远程主机传输文件，你必须确保该主机能够接受你的 `ftp` 请求。为了做到，主机必须运行 `ftp` 服务端进程。要确认这一点，请登录到远程主机并输入以下命令：\n\
  ```bash\ncat inetd.conf | grep ftp\n```\n如果服务器可以处理入站 `ftp` 客户端请求，将显示类似下面的响应：\n\n\
  列表 23.1 检查远程 UNIX 主机上是否运行了 `ftp` 服务器。\n\n```bash\ncat /etc/inetd.conf | grep ftp\
  \ ftp      stream  tcp      nowait  root    /usr/sbin/tcpd\n       /usr/sbin/wu.ftpd\n\
  ```\n\n2. 要激活 `ftp` 程序，将光标移动到任务栏并点击 `Start` 按钮。点击一次 `Run` 菜单，会出现一个对话框，要求你想要执行的程序名称。输入\
  \ `ftp` 并按 `Enter`。\n\n3. 出现一个 DOS 窗口，以及 `ftp` 命令提示符 `ftp>`。\n\n4. 输入 `?` 以显示可用命令列表。你必须先与远程主机建立连接。在下面的示例中，我连接到名为\
  \ `ftp.catfish.com` 的服务器。输入以下命令，将指示的主机名替换为你的远程服务器名称：`open ftp.catfish.com` 然后按 `Enter`。\n\
  \n5. 如果成功，远程服务器将提示你输入用户名然后是密码。输入这些信息；`ftp` 会在你成功时通知你并返回 `ftp>` 提示符。你现在已连接到远程服务器并能够传输文件。图\
  \ 23.5 释了这些任务。\n![8227-0597a.gif](img/297a8fb7d35278a8893248a45611e42.gif) 图 23.5\
  \ 使用 ftp 远程 UNIX 主机\n\n6. `ftp` 程序允许你显示远程文件并在远程服务器上包含的文件系统之间移动。输入命令 `dir` 然后按 `Enter`。`ftp`\
  \ 会显示远程主机当前目录的列表。\n\n7. 要从远程主机传输文件到你的 Windows PC，输入命令 `get filename`（其中 `filename`\
  \ 是远程主机上的文件名），然后按 `Enter`。`ftp` 程序将传输文件并指示传输何时完成。\n\n8. 同样，你可以从你的 Windows PC 传输文件到远程\
  \ UNIX 主机。要做到这一点，输入 `put filename`（其中 `filename` 是要传输的文件名）。这次，当 `ftp` 报告传输完成时，输入\
  \ `dir` 并按 `Enter`。生成的目录列表现在也应该包含你刚传输的文件。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ Windows 与 ftp\n\nWindows 版本的 `ftp` 与第 22 章所示的 UNIX 版本相同。第 22 章中概述的额外特性和功能也可以适用于\
  \ Windows 版本。\n\n## 关于网络\n\n如果你想登录到跨 TCP/IP 的任何主机，你必须使用 `telnet`。该程序作为 Windows 系统的一部分提供，为\
  \ TCP/IP 网络提供终端设施。\n\n## 使用 Telnet 登录 UNIX\n\n1. 要启动 `telnet`，点击 `Start` 按钮并选择 `Run`\
  \ 选项。在 `Run` 对话框中输入 `telnet` 并点击 `OK` 按钮启动程序。\n\n2. 要连接到远程主机，点击 `Connect` 选项，然后点击\
  \ `Remote System` 选项。\n\n3 显示一个 Connect 选项框。输入你的远程 UNIX 主机的主机名或 IP 地址。记住，如果你输入主机名，你必须配置了\
  \ DNS，或者在你的 `\\Windows\\hosts` 文件中有该主机的条目。图 23.6 提供了插图。\n![8227-0598a.gif](img/8609a5fdd9d99b80ccd3d10bc642cda2.gif)\
  \ 图 23.6 登录主机\n\n\n\n\n\n## 图 23.6 使用 telnet 跨 TCP/IP 连接登录。\n\n4. 点击“连接”（Connect）按钮激活连接。应显示远程主机的登录界面，供您提供用户名和密码。\n\
  5. 要断开主机连接，请点击“连接”（Connect）菜单项并选择“断开”（Disconnect）选项。\n\n## 拨号上网\n\nWindows 为您提供了两种通过拨号连接访问\
  \ UNIX 主机的选项。一种方案是配置您的 Windows PC，使其能够通过调制调器连接运行 TCP/IP 协议。此选项允许您运行本章在此之前概述的任何基于\
  \ TCP/IP 的应用程序，并且通常是为 PC 连接互联网时选择的路径。\n\n另一种方法是配置 Windows 以允许用户具备登录远程主机的能力。此选项允许您访问远程主机上的文件和资源；但该选项的局限性在于，它一次只能访问单个远程主机。接下来的章节将介绍这两种方法。\n\
  \n### 通过互联网访问 UNIX 主机\n\n要通过互联网访问主机，您必须完成四项任务：安装并配置调制解调器、配置调制解调器的物理端口、配置网络设备和协议，以及配置连接脚本，该脚本将拨打您的互联网服务提供商电话并在您配置的设备上启动通信。\n\
  \n以下任务列表提供了该过程的简要指南，从安装和配置调制解调器开始。\n\n#### 通过互联网访问 UNIX 主机\n\n1. 点击任务栏上的“开始”按钮。将光标移动到“设置”（Settings）菜单选项，然后右键点击“控制面板”（Control\
  \ Panel）选项。当控制面板文件夹打开时，双击“调制解调器”（Modems）图标。如果您已经安装了调制解调器，会弹出“调制解调器属性”对话框。如果是这种情况，请在继续之前右键点击“添加”（Add）按钮。\n\
  2. 打开“安装新调制解调器”（Install a New Modem）窗口。点击“下一步”（Next）按钮运行安装向导，Windows 将引导您完成安装过程。点击“下一步”继续此过程。\n\
  3. 系统将您是否让 Windows 搜索新安装的硬件；选择“否”（NO）选项并点击“下一步”。从显示的设备类型列表中选择“调制解调器”（Modem）并点击“下一步”。\n\
  4. 勾选“不要搜索我的调制解调器，我将从列表中选择”（Dont My Modem, I Will Select It from a List）选项并点击“下一步”按钮。打开一个新窗口；在提供的选项下选择您的调制解调器制造商和型号。\n\
  5. 点击“下一步”按钮继续安装，并选择调制解调器将使用的 COM 端口。Windows 尝试安装您的调制解调器——在完成过程中，屏幕可能会空白几秒。完成后，将显示一个窗口报告安装过程成功；点击“完成”（Finish）按钮退出安装向导。\n\
  6. 按“完成”按钮将调出“调制解调器属性”（Modem Properties）窗口。为了有效完成安装过程，您必须定义 Windows 如何使用该调制解调器；这通过点击窗口内的“拨号属性”（Dialing\
  \ Properties）按钮来实现。\n7. “拨号属性”（Dialing Properties）屏幕会提示您输入本地拨号区码，以及在拨打任何位置之前是否需要拨打特殊号码。如果您的调制解调器线路通过电话交换机（PBX）连接并需要拨打\
  \ `9` 才能访问外部电话线路，可能会出现这种情况。根据您自己的环境对“拨号属性”屏幕进行任何更改。8 点击“确定”（OK）按钮保存并退出“拨号属性”屏幕，再次退出“调制解调器属性”屏幕。\n\
  \n下一步是确保您的 COM 端口设置与您在安装期间为调制解调器配置的设置相对应。这通过访问再次位于控制面板内的“系统”（System）图标来实现。以下任务总结了我们需要做的设置。\n\
  \n#### 配置端口设置\n\n1. 要打开控制面板，点击任务栏上的“开始”按钮。将光标移动到“设置”（Settings）菜单选项，然后右键点击“控制面板”（Control\
  \ Panel）选项。打开控制面板文件夹；双击“系统”（System）图标。\n2. “系统属性”（System Properties）窗口打开；点击“设备管理器”（Device\
  \ Manager）选项卡，然后双击您连接调制解调器的 COM 端口。点击“端口设置”（Port Settings）选项卡调整显示的值，使其与您为调制解调器配置的值相对应。\n\
  3. 点击“确定”保存设置并返回“系统属性”窗口，然后点击“确定”关闭此窗口并返回控制面板文件夹。\n\n在安装好调制解调器和通信端口后，您必须设置并配置 TCP/IP\
  \ 协议以便能够通过这些设备进行通信。这通过完成以下步骤来实现。\n\n#### 配置 TCP/IP 协议\n\n\n\n\n\n1. 点击开始按钮，然后选择`Settings`（设置），最后选择`Control\
  \ Panel`（控制面板）。双击`Network`（网络）图标。\n\n2. 点击`Configuration`（配置）选项卡并检查当前已配置的组件列表。为了配置拨号网络，必须存在以下两个项目：`Dial-up\
  \ Adapter`和`TCP/IP Dial-up Adapter`。如果缺少其中任何一项，则必须添加。如果你需要添加项目，请点击`Add`按钮。你将看到四种可以添加的选项：客户端、协议、适配器和服务。\n\
  \n如果你需要添加拨号适配器，请点击`adapter`选项并点击`Add`按钮。在`Network Protocols`窗口中，选择`Microsoft`作为制造商，并选择`Dial-up\
  \ Adapter`。点击`OK`按钮确认操作。\n\n如果你需要添加`TCP/IP`协议的`Dial-up Adapter`选项，请点击`Add`按钮，点击`protocol`选项，然后再次点击`Add`按钮。在网络协议窗口中选择`Microsoft`作为制造商，并选择`TCP/IP`作为网络协议。点击`OK`按钮完成操作。\n\
  \n3. 现在进行 TCP/IP 协议配置：在`The Following Network Components Are Installed`窗口中，点击`Dial-up\
  \ Adapter`。点击`Properties`按钮，然后点击`Driver Type`选项并选择`Enhanced Mode (32 bit and 16\
  \ bit) NDIS Driver`。点击`Bindings`选项卡，然后勾选`TCP/IP Dial-up Adapter`。点击`OK`按钮完成此操作。\n\
  \n4. 在`The Following Network Components Are Installed`窗口中，点击`TCP/IP Dial-up Adapter`，然后点击`Properties`按钮。此屏幕提供了配置\
  \ TCP/IP 协议参数的地方。图 23.7 提供示例。\n\n![8227-0602a.gif](img/4cf935ab5ed2a5933b816c603022f84c.gif)\n\
  图 23.7 配置 TCP/IP 参数。\n\n5. 需要配置的关键项是 Windows 电脑的 IP 地址。要执行此操作，点击`IP Address`选项卡。如果你已经被分配了使用的\
  \ IP 地址，点击`Specify an IP Address`按钮，然后输入你的 IP 地址和子网掩码。如果你还没有分配 IP 地址，点击`Obtain an\
  \ IP Address Automatically`选项。\n\n6. 如果你的电脑能够使用 DNS，点击`DNS Configuration`选项卡。接下来，勾选`Enable\
  \ DNS`按钮，以及你的电脑的主机名和域名。然后在在`DNS Search Order`窗口中添加 DNS 服务器的 IP 地址并点击`Add`按钮。\n\n\
  7. 最后，点击`OK`按钮保存配置并退出。你的调制解调器已配置，设备端口和协议也已设置。现在你必须指示 Windows 如何建立连接；这是通过`Dial-up\
  \ Networking`选项实现的。以下任务说明了必要的配置步骤。\n\n### 配置拨号网络\n\n1. 双击`My Computer`图标、`Dial-Up\
  \ Networking`文件夹和`Make New Connection`图标。这会启动一个向导程序，引导你设置新的拨号网络会话。\n\n2. 输入一个描述该会话名称，并选择向导应使用的调制解调器。点击`Next`按钮继续。\n\
  \n3. 输入你要拨打的服务器电话号码，根据需要包含国家代码和区号代码。点击`Next`按钮，向导会通知你会话配置已完成。点击`Finish`按钮保存并退出。\n\
  \n4. 你的会话保存在`Dial-up Networking`文件夹中。选择此图标并右键点击，然后选择`Properties`选项，然后选择`Server Type`按钮。显示如图\
  \ 23.8 所示。\n\n5. 此对话框允许我们指定哪些协议可以在建立的连接上运行。点击`TCP/IP Settings`按钮并输入 TCP/IP 配置。此特定连接的这些信息将覆盖控制面板中指定的值。这允许你为你可能建立的任何特定连接配置不同的\
  \ TCP/IP。\n\n![8227-0604a.gif](img/320c23723a6af825d40eed859d883.gif)\n图 23.8 为拨号网络指定服务器类型。\n\
  \n6. 要激活此会话，双击 Dial-up Networking 中的 Session 图标。会出现一个对话框，提示输入你的用户名和密码以及要拨打的电话号码。输入你的用户名和密码并点击`Connect`按钮。\n\
  \n7. Windows 将拨打指定的电话号码，并尝试使用你的用户名和密码进行连接。建立连接后，你可以使用任何 TCP/IP 程序通过此连接访问远程服务器。\n\
  \n*通过终端连接访问 UNIX 主机*\n\n\n\n\n\n# 第 21 章通过调制调器访问其他 UNIX 系统\n\n本文说明了 UNIX 主机如何通过使用调制调器和拨号线路提供远程登录支持。Windows\
  \ 通过其 `HyperTerminal` 程序提供了类似相当的功能。该程序允许配置 PC，使其能够与远程主机建立终端连接。\n\n## 配置 HyperTerminal\
  \ 访问 UNIX 主机\n\n1. 要使用 `HyperTerminal` 配置连接，请点击“开始”按钮并将光标移动到“程序”菜单选项。Windows 将显示你\
  \ PC 上可用的程序组。选择“附件”，然后选择 `HyperTerminal`。\n2. 在 `HyperTerminal` 文件夹中，双击名为 `Hypertrm.exe`\
  \ 的程序。这会启动 `HyperTerminal` 配置程序，它将引导你完成其余的必要配置步骤。\n3. 为新连接输入名称，并从可用列表中为该连接选择一个图标。点击“确定”继续。\n\
  4. `HyperTerminal` 会提示你想要连接的远程主机的电话号码。要完成此信息，请通过下拉框添加国家和区号信息。`HyperTerminal` 将帮助你完成这些步骤。\n\
  5. 点击“连接方式”窗口末尾的箭头，选择你希望 `HyperTerminal` 使用的调制调器。完成输入这些信息后，点击“确定”按钮继续。\n6. `HyperTerminal`\
  \ 在“连接”对话框中显示你要拨打的号码，以及你拨号的所在地。图 23.9 展示了此示例。\n7. 如果你必须更改配置的远程主机电话号码，可以通过点击“修改”按钮来实现。此操作将显示连接的“属性”窗口（参见图\
  \ 23.10）。\n8. 点击“电话号码”选项卡允许你更改远程主机的电话号码，包括国家和区号。该选项卡还允许你通过点击“配置”按钮更改连接调制调器的配置。\n\
  9. 点击“设置”选项卡。此屏幕上的可用选项允许你更改终端会话的外观感觉。只要你确保 `仿真` 设置为 `自动检测`，就不需要对这些设置进行任何更改。点击“确定”按钮返回“连接”对话框。\n\
  \n10. 点击“拨号属性”按钮，告诉 `HyperTerminal` 你从哪个位置拨号。如果你经常旅行并需要从不同的位置访问远程主机，此选项特别有用。点击“确定”按钮返回“连接”对话框。\n\
  11. 对你的连接设置满意后，点击“拨号”按钮建立远程连接。连接建立后，远程 UNIX 主机将向你显示登录屏幕，在其中输入你的用户名和密码。\n\n## 在远程主机之间传输文件\n\
  \nHyperTerminal 提供了一种简单有效的方法，用于与远程主机之间传输文件。要实现这一点，主机必须采用如 Kermit 等通信服务器软件通过拨号连接下载文件的方法。以下步骤说明了\
  \ `HyperTerminal` 用户如何使用该软件传输文件。\n\n### 使用 HyperTerminal 文件\n\n1. 按照之前描述使用 `HyperTerminal`\
  \ 连接到远程 UNIX 主机，并使用有效的用户名和密码登录。\n2. 在远程主机上，输入 `kermit` 启动 `kermit` 文件传输程序。输入 `set\
  \ file type binary` 并按回车告知远程主机你要从 PC 上传二进制文件，然后输入 `receive` 将主机置于接收你文件的正确模式。按 `Alt+X`\
  \ 退出回到 `HyperTerminal` 程序。\n3. 点击 `HyperTerminal` 程序中的“传输”菜单选项，然后点击“发送文件”选项。弹出的对话框中你可以输入要传输的文件名，或点击“浏览”按钮找到该文件。选择文件后，点击“发送”按钮开始传输。\n\
  4. `HyperTerminal` 也可从远程系统接收文件。这可以通过选择“传输”菜单下的“接收文件”选项来设置。使用“浏览”按钮指定传输文件的放置位置，然后使用远程主机上的传输程序将文件发送到你的\
  \ `HyperTerminal` 会话。\n\n![图 23.10 更改 HyperTerminal 连接的拨号属性。](img/ed36847-0606b.gif)\n\
  \n## 在 Windows 上通过 Netscape 读取和发送 UNIX 电子邮件\n\n\n\n\nNetscape Communicator 应用程序套件主要是一个浏览器浏览器；然而，它也提供了电子邮件功能。Netscape\
  \ 应用程序的运行需要 Windows PC 通过 `TCP/IP` 连接到互联网。这可以通过通过 `NIC` 或 `modem`（调制调器）建立的网络连接来实现。\n\
  \n## 配置 Netscape Communicator 用于电子邮件\n\n1.  点击 `Start` 按钮，选择 `Programs` ，滚动到 Netscape\
  \ 文件夹，然后点击 `Netscape Navigator` 图标来启动 Netscape Navigator。或者，如果你已经创建了该应用程序的快捷方式，只需双击快捷方式图标即可启动。\n\
  \n2.  在 Netscape 选项栏上选择 `Window`，然后选择 `Netscape Mail`。Netscape 会显示电子邮件客户端并提示输入 `user\
  \ id` 和密码以访问你的远程电子邮件账户。连接后，电子邮件窗口看起来应该与图 23.11 类似。\n\n3.  新邮件会自动放置在你的 `Inbox`（收件箱）文件夹中。点击窗口右上角的\
  \ `Inbox` 文件夹；Netscape 会指示未读消息。\n\n4.  `Inbox` 中每条消息的摘要行会显示在该窗口的右侧。你可以通过点击其中任何一条消息来打开它，消息将出现在\
  \ Netscape 电子邮件客户端底部的窗口中。\n\n![8227-0609a.gif](img/bd3f7aca161491b0eacc7050610452c2.gif)\n\
  图 23.11 Netscape 电子邮件客户端。\n\n5.  将鼠标箭头移动到这三个窗口之间的任何一个分隔符上，移动时你会发现光标形状发生了变化。按住鼠标键并移动鼠标，各个窗口的大小就会改变。\n\
  \n6.  要发送消息，点击 `File`，然后点击 `New Mail Message` 菜单选项。或者，使用快捷键 `Ctrl+M`。\n\n7.  出现\
  \ `Message Composition`（消息撰写）框；输入收件人的电子邮件地址，或者点击 `Mail To` 按钮显示通讯录。图 23.12 插图。\n\
  \n![8227-0609b.gif](img/4da739b518ec0c8c74601f4d0eb1.gif)\n图 23.12 使用 Netscape Navigator\
  \ 创建新的电子邮件消息。\n\n8.  点击 `Attachment` 按钮向你的电子邮件添加附件。点击 `Attach File` 按钮以找到文件，点击 `Open`\
  \ 按钮选中高亮文件，然后点击 `OK` 继续。\n\n9.  点击 `Send` 按钮。如果你没有在主题行中输入任何内容，Netscape 会再次提示你输入邮件主题。如果需要，请输入主题然后按\
  \ `OK` 继续。\n\n# 第 24 章 UNIX 与互联网\n作者：Gordon Marler\n\n### 在 UNIX 上冲浪网 \n### 从互联网下载软件\n\
  ### 使用基于字符的浏览器 (Lynx)\n### UNIX 厂商网站\n### 访问 UNIX 技术支持\n### 访问免费（非支持的）软件\n### 阅读网络\n\
  \n部分首批能够访问万维网（World Web）的机器中运行着 `Mosaic`，这是一个由伊利诺伊大学国家超级计算机应用中心（`NCSA`）开发的 X-Windows\
  \ 应用程序。它运行在多个版本的 `UNIX` 上，今天仍然可用，尽管它不具备最新一代的一些更优功能。\n\n后来出现了诸如 `Netscape Navigator/Communicator`、`Sun\
  \ HotJava` 和 `Lynx` 等浏览器。如果你的 `UNIX` 版本没有 X-Windows，或者你没有运行它的适当硬件，你仍然可以运行 `Lynx`，因为它只需要一个哑终端。\n\
  \n表 24.1 运行在 UNIX 上的浏览器及其获取位置。\n\n| 浏览器 | 位置 |\n| :--- | :--- |\n| Netscape Navigator/Communicator\
  \ | `http://home.netscape.com/` |\n| NCSA Mosaic | `ftp://ftp.ncsa.uiuc.edu/Mosaic/binaries/2.6/`\
  \ |\n| Lynx | `ftp://www.slcc.edu/pub/lynx/release2-8/` |\n| Sun HotJava | `http://www.javasoft.com/products/hotjava/`\
  \ |\n\n表 24.1 中提到的位置可能是你熟悉的格式，因为今天许多公司在广告中放置了统一资源定位符（`URLs`）；这些看起来像这样：`http://www.somecompany.com/`。这些\
  \ URL 的 `http` 部分告诉你的 Web 浏览器在与 `http://` 之后指定的 Web 服务器通信时使用哪种协议。\n\n为了帮助你熟悉这些协议以及何时可能想要使用它们，表\
  \ 24.2 列出并描述了许多常用的协议。\n\n\n\n\n\n## 表 24.2 URL 协议标识符及其用途。\n\n| 协议 | 目的 |\n| :---\
  \ | :--- |\n| `http://` | 用于指定网页 |\n| `https://` | 用于指定安全网页，该网页在发送到你时会进行加密 |\n|\
  \ `ftp://` | 指定使用文件传输协议来上传/下载文件 |\n| `news://` | 指定将用作网络新闻 (Usenet) 服务器的主机 |\n|\
  \ `file:/<pathname>` | 允许你将本地文件加载到浏览器中（注意此协议中冒号后只有*一个*斜杠） |\n| `gopher://` | 指定提供\
  \ Gopher 服务的主机 |\n\n请记住，互联网上的许多 Web 服务器可以针对其网站的不同部分提供表 24.2 中列出的一项、多项或全部服务。许多服务器至少提供前三项服务。通常，如果你想找某公司的网站，可以假设其\
  \ URL 会非常接近 `http://www.*companyname.*com`，除非另一家名称相似的公司已经使用了该地址。\n\n### 寻找正确的网站\n\
  \n如果你正在尝试猜测某公司的网站地址，结果却进入了其他公司的网站，你通常会发现一个指向你真正想去的地方的链接。这是一个例子：\n\n你想访问 PC 卡制造商\
  \ Diamond Multimedia 的首页。你尝试了 `http://www.diamond.com`，但发现这是 SI Technology, Inc.\
  \ 的网站。但是！这里有一个指向 Diamond Multimedia 网站的链接：`http://www.diamond.com`。\n\n你会很快发现万维网并不是中心化组织的，信息分布在巨大的区域内。如果你在寻找特定的内容，你要么得知道它在哪里，要么需要帮助来寻找。`search\
  \ engines`可以为你提供帮助。这些引擎通常是大型 UNIX 服务器，会发送 `spiders`（蜘蛛）或 `robots`（机器人）。它们会寻找、检查并索引它们能找到的每个\
  \ Web 服务器上的每一个网页。我在表 24.3 中列出了目前可用的几个引擎。你可以查看它们并选择一个最适合你的。每个引擎都有其自己的方法，让你在其各自的目录中指定想要搜索的内容。某些服务的目录比其他更好，但这会随着时间的推移而变化。每个引擎都有方便的帮助功能，可以帮助你进行基础搜索。高级搜索功能每种服务器类型大约需要一页来解释。\n\
  \n### 表 24.3 几个 Web 搜索引擎。\n\n| | |\n| :--- | :--- |\n| AltaVista | `http://www.altavista.digital.com/`\
  \ |\n| Yahoo! | `http://www.yahoo.com/` |\n| Lycos | `http://www.lycos.com/` |\n\
  \n取决于你的 UNIX 机器所在的位置，你的机器和互联网之间可能存在一个 `firewall`（防火墙）。如果你在公司访问互联网，且你的公司具有任何规模，那么情况很可能是这样。如果你在家里通过互联网服务供应商访问互联网，你可能不需要担心这个问题。\n\
  \n### 自动代理\n\n在某些站点，系统管理员不会给你你的代理服务器的名称，而是会给你一个指向自动代理文件的 URL，你必须将该 URL 输入到浏览器中。该文件包含一个脚本，每当你启动浏览器时都会自动加载，并对你的浏览器进行编程，智能智能地选择代理服务器。这种功能用于具有多个代理服务器的站点，这样你就不需要担心在此刻将浏览器指向哪一个代理。然而，你必须使用支持此功能的浏览器。Netscape\
  \ Communicator 现在绝对支持它。其他浏览器也在效仿。\n\n如果你确实有一个防火墙，你的系统或网络管理员可能已经设置了 `proxy server`（代理服务器），你必须采取一些特殊步骤让浏览器使用代理服务器，而不是尝试直接通过防火墙并失败。防火墙保护你的网络免受互联网的入侵，但也阻止了你出去。解决办法是建立一个代理服务器，它是唯一允许直接访问或从互联网访问的机器。实际上，你的浏览器将请求代理服务器去获取网页，然后当网页到达时，代理服务器将其交给你的浏览器。不要担心这会很慢；代理服务器从\
  \ Web 获取信息的速度通常比你直接获取要快，而且安全得多。\n\n\n\n\n\n你只需要知道代理服务器的名称和它正在监听的端口。然后你告诉你的浏览器，就可以开始之旅了！唯一棘手的地方可能是，表\
  \ `24.1` 中列出的每种协议都可能有自己独立的代理服务器！这在那些拥有海量网络流量的网站非常常见。稍后将展示一个我设置 `Lynx` 浏览器时的示例。\n\
  \n# 从互联网下载软件\n\n你已经在第 24 章中学习了如何通过 `UNIX` 命令行通过 `FTP` 下载文件，但你也可以使用 Web 浏览器来完成相同的操作。使用浏览器要简单得多，因为你只需要做的就是指向和点击。\n\
  \n绝大多数提供你所需软件的 Internet 网站都允许你使用 `anonymous ftp` 来下载你想要的文件。`anonymous FTP` 的惯例是使用\
  \ `anonymous` 作为用户名，然后提供你的电子邮件地址作为密码。某些浏览器（如 `Netscape Navigator`）允许你选择一种偏好设置，如果你在\
  \ URL 中没有指定用户名，它会自动发送 `anonymous` 作为你的用户名并将你的电子邮件地址作为密码。\n\n如果你没有可以为 `anonymous\
  \ FTP` 设置偏好选项的浏览器，或者你正在尝试访问一个要求使用特定用户名和密码的 FTP 站点，你可以通过浏览器显式地输入 `FTP` 会话的用户名和密码。URL\
  \ 的语法如下：\n\n```\nftp://username:password@the.ftp.site.com/\n```\n\n### 另请阅读\n*有关通过\
  \ ftp 传输文件的信息，请参阅第 596 页*\n*下载 Lynx。*\n\n对于这个示例，我假设你还没有浏览器。因此，你可能需要使用 `UNIX` 命令行来执行\
  \ `FTP` 传输。`Lynx` 的源代码可以在 `www.slcc.edu` 的 `/pub/lynx/release-8/` 目录下通过 `FTP` 获取。由于\
  \ `Lynx` 源代码是以 `tarred`, `zipped` 文件（不是压缩或 `gzipped` 文件）格式分发的，你还需要获取一个 `unzip` 工具，而\
  \ `UNIX` 默认并不带有该工具。你可以在 `ftp.cdrom.com` 的 `/pub/infozip/UNIX/` 目录下找到为几乎所有版本的 `UNIX`\
  \ 编译的免费程序。\n\n# 读取和写入 zip 文件\n\n我知道在这一章中不应该讨论压缩，但 `Lynx` 开发者用于压缩其源代码的压缩工具实际上源于 `PKZIP`\
  \ 工具。因此，该工具并不是 `UNIX` 的一部分，在涵盖 `UNIX` 压缩的章节中也没有讨论过。这意味着标准的 `UNIX` 压缩工具无法读取这些 `PKZIP`\
  \ 文件。\n\n然而，正如 `UNIX` 中常见的情况一样，有人花时间编写了一个读取/写入这些 `PKZIP` 文件的工具，并免费提供给你。你只需要自己获取并安装它，或者要求你的系统管理员为你操作。我删除了\
  \ `FTP` 输出中不是特别帮助的部分。请注意，`FTP` 服务器上的这些消息可能会随时变化，而且经常会变化。\n\n```\n% ftp -i ftp.cdrom.com\
  \ Connected to wcarchive.cdrom.com.\n220 wcarchive.cdrom.com FTP server (Version\
  \ DG-2.12 Tue 24 18:40 ST 98) ready.\nName (ftp.cdrom.com:anonymous):\n331 Guest\
  \ login ok, send your complete email address as password.\nPassword: username@host.com\n\
  230 Welcome to wcarchive-home site for Walnut Creek ROM.\n230 There are currently\
  \ 3000 users out of 3000 possible.\n230 Please send mail to ftp-bugs@ftp.cdrom.com\
  \ if you experience any problems. Please also let us know if there is something\
  \ we don't have you think we should!\n230 Guest login ok, access restrictions apply.\n\
  ftp> binary\n200 Type set to I.\nftp> hash printing on (8192 bytes/hash mark).\n\
  ftp> cd /pub/infozip/UNIX/\n250 This directory contains executables for UNIX systems\
  \ that generally not ship with a C compiler.\n250 AIX/ executables for IBM AIX on\
  \ RS/6000\n250 CLIX/ executables for Intergraph CLIX\n250 CONVEX/ executables for\
  \ ConvexOS\n250 DEC/ executables for DEC Digital UNIX (OSF/1) and Ultrix\n250 FreeBSD/\
  \ executables for FreeBSD 2.x on Intel\n250 HP/ executables for HP/UX\n250 LINUX/\
  \ executables for Linux on\n250 QNX/ executables for QNX on Intel\n250 SCO/ executables\
  \ for SCO UNIX\n```\n\n\n\n\n# Silicon 平台的执行文件\n\n- **SGI/**: 适用于 Silicon Graphics\
  \ Irix 的执行文件\n- **SUN/**: 适用于 SPARC 上 SunOS 和 Solaris 2.x 的执行文件\n\n## 问题报告\n请将 `Zip`\
