  \ total 3786\n```\n- `CHANGES`\n- `features.html`\n- `features.txt`\n- `index.html`\n\
  - `index.txt`\n- `lynx2-8` (目录)\n- `lynx2-8.zip` (1669681 bytes)\n- `lynx2-8.zip-lst`\
  \ (25671 bytes)\n- `ssl.html` (2085 bytes)\n- `ssl.txt` (1786 bytes)\n\n\n\n\n\n\
  # 二进制传输完成\n\n226 二进制传输完成。\n\n本地：`lynx2-8.zip` 远程：`lynx2-8.zip`\n\n在 67 秒内接收了 1669681\
  \ 字节 (24 Kbytes/s)\n\nLynx 的源代码位于一个 zip 压缩包中，因此只需对其运行 `unzip` 实用即可。这将创建 Lynx 源码目录并将所有源代码放入其中。\n\
  \n```bash\n% unzip lynx2-8.zip Archive:  lynx2-8.zip\n   creating: lynx2-8/\n  \
  \ inflating: lynx2-8/COPYHEADER\n   inflating: lynx2-8/COPYING\n   inflating: lynx2-8/INSTALLATION\n\
  \   inflating: lynx2-8/LYMessages_en.h\n     .....\n```\n\n本节包含以下几点假设：\n\n1. 你拥有适用于你版本\
  \ UNIX 的 C 编译器套件，或者你安装了 GNU C 编译器。对于大多数用途，首选 GNU 编译器，因为它实际上优于大多数商业编译器。非常棒，尤其是它是免费的。\n\
  2. 你拥有随 C 编译器套件一起提供的 `make` 实用，或者你安装了 GNU make 实用。两者之间没有优劣之分。\n\n要了解更多关于 GNU 编译器和\
  \ `make` 等 GNU 产品的信息，你可以访问 Free 基金会网站：http://www.gnu.org。你将在那里找到所有 GNU 产品的文档和源代码。它们不仅是免费提供的，而且通常比你版本\
  \ UNIX 自带的工具更好用。\n\n与许多当前的 UNIX 发行版一样，Lynx 软件包包含了 GNU `autoconfig` 实用程序，它会分析你的 UNIX\
  \ 版本并确保进行所有正确的设置，以便能够顺利地编译 Lynx。任何此类包的顶层源码树中都有一个 `configure` 脚本。你只需要运行 `configure`，它就会为你的机器创建相应的\
  \ `Makefile`。\n\n```bash\n% cd lynx2-8\n% ./configure\ncreating cache ./config.cache\n\
  checking host system type... sparc-sun-solaris2.5.1\nchecking for gcc... gcc\nchecking\
  \ whether the C compiler (gcc) works... yes\nchecking whether the C compiler (gcc)\
  \ is a cross-compiler... no\nchecking whether we are using GNU C... yes\n.....\n\
  updating cache ./config.cache\ncreating ./config.status\ncreating makefile\ncreating\
  \ WWW/Library/unix/makefile\ncreating src/makefile\ncreating src/chrtrans/makefile\n\
  creating lynx_cfg.h\n```\n\n现在你已经为你的平台配置好了 Lynx 源码，你可以让 `make` 实用程序为你编译它：\n\n```bash\n\
  % make\n```\n\n如果 Lynx 编译成功，你可以通过输入以下命令来安装它：\n\n```bash\n# make install\n```\n\n\
  你需要对系统上的 `/usr/local/` 拥有 root 权限，或者让你的系统为你安装 Lynx。\n\n## 使用基于字符的浏览器 (Lynx)\n\n\
  既然你已经费力构建了可以在你机器上运行的 Lynx 二进制文件，你现在终于可以使用它了！\n\n1. 首先，如果你的站点位于防火墙后，你需要确保已设置好使用相应的代理服务器（如果可用）。咨询你的系统管理员查询代理服务器的名称以及通信的端口。如果你不在防火墙后，请跳到第\
  \ 3 步。\n2. 在知道代理服务器名称和端口后（在本例中，我们将服务器称为 `relay.mycompany.com`，端口为 `8080`），在运行 Lynx\
  \ 之前，你需要设置几个环境变量。为了简单起见，假设你的代理服务器是以下所有协议的代理：HTTP、HTTPS 和 FTP。如果事实不是，你的系统管理员可以告诉你。\n\
  \n如果你使用的是 C Shell，请将以下放入你的登录脚本中：\n\n```\nsetenv http_proxy http://relay.mycompany.com:8080\n\
  setenv https_proxy http://relay.mycompany.com:8080\nsetenv ftp_proxy ftp://relay.mycompany.com:8080\n\
  ```\n\n如果你使用的是 Bourne/Korn Shell，请将以下放入你的登录脚本中：\n\n```bash\nhttp_proxy=http://relay.mycompany.com:8080/\n\
  export http_proxy\n```\n\n\n\n\n\n```bash\nhttps_proxy=http://relay.mycompany.com:8080/;\
  \ export\nftp_proxy=http://relay.mycompany.com:8080/; export\n```\n\n### 3. 现在你可以运行\
  \ Lynx\n在命令行中，输入 `lynx`。\n\n使用 Lynx 非常直观。这里是最常用命令的表格。\n\n#### 表 24.4 Lynx 命令简表。\n\
  \n| 命令 | 描述 |\n| :--- | :--- |\n| `g` | 跳转到 URL，允许你输入一个 URL 进行访问。 |\n| `*/pattern`\
  \ | 在当前网页中搜索模式。 |\n| `Up arrow` (向上箭头) | 在当前网页的超链接中向上移动。 |\n| `Down arrow` (向下箭头)\
  \ | 在当前网页的超链接中向下移动。 |\n| `Return` (回车) | 进入当前选中的超链接。 |\n\n### UNIX 供应商网站\n\n大多数\
  \ UNIX 供应商都活跃在网上，并根据你支付的支持费用多少，允许对网站的技术支持内容进行不同程度的访问。有几个供应商会维护一个独立的站点作为其网站的主入口，另一个站点专门用于\
  \ UNIX 支持。\n\n#### 查找支持\n\n我包含了每个供应商网站的主入口，因为这些入口永远不会改变。如果你发现表 24.5 中的 UNIX 支持页面发生了变化，你始终可以确定，只要你进入该供应商的主入口，就能找到指向新\
  \ UNIX 支持页面的链接。\n\n#### 表 24.5 UNIX 供应商网站\n\n| 供应商 | 主入口 | 支持 |\n| :--- | :--- |\
  \ :--- |\n| Sun Microsystems (SunOS, Solaris) | `http://www.sun.com` | `http://sun.sby.com`\
  \ |\n| Hewlett-Packard (HP-UX) | `http://www.hp.com` | `http://us-support.hp.com`\
  \ |\n| IBM (AIX) | `http://www.ibm.com` | `http://www.rs6000.ibm.com/support/` |\n\
  | Silicon Graphics (IRIX) | `http://www.sgi.com` | `http://www.sgi.com/software/`\
  \ |\n\n### 访问 UNIX 支持\n\n每个 UNIX 供应商都提供多种技术支持。其中一些是免费的，但大多数服务要求你与供应商签订支持合同。本节回顾了每种支持类型以及如何获取它们。虽然每个供应商处理支持的方式略有不同，但以\
  \ Sun 的支持系统作为示例。\n\n当你购买 UNIX 系统时，通常可以选择购买硬件和软件的共同支持，这可能包括操作系统、捆绑软件工具，以及你选择购买的任何非捆绑工具，例如特殊的编译器或应用程序。你通常可以选择几个服务级别中的一种，范围从工作时间内的每周五天协助，到每周七天、每天\
  \ 24 小时的服务。Sun 将这些服务计划称为 SunSpectrum，并并在 `http://www.sun.com/service/support/sunspectrum/index.htm`\
  \ 上说明了这些计划的运作方式。大多数供应商都有非常相似的服务。\n\n最近，供应商开始提供独立于硬件的软件支持。Sun 将此称为 `Software Only`（仅软件）或\
  \ `Software Subscription`（软件订阅）服务。他们在 `http://www.sun.com/service/support/sw_only/index.html`\
  \ 讨论了该提供的具体组件。随着时间的推移，这种服务可能会变得越来越普遍，因为许多个人和企业只想购买软件支持，并在硬件问题出现时再进行处理。\n\n#### 升级服务电话\n\
  \n如果你发现的问题严重影响了你，技术支持人员没有及时给你回电，或者他们看起来过度缺乏经验，你可以对电话进行 `escalate`（升级）。你这样做的方法是拨回技术支持中心，提供你的服务订单号，并要求与升级经理通话。你可以向他解释糟糕的服务，并要求提高电话的优先级。只有在极端紧急情况下，或者软件支持工程师就是不回你电话时，你才需要这样做。我通常一年只需要这样做一次左右。\n\
  \n\n\n\n谈到网站，供应商正不断通过其支持网站提供越来越多的支持能力。如果你访问 Sun 的网站，你会发现某些支持服务是免费提供的，例如补丁、常见问题解答（FAQ）和文档。\n\
  \n网站的某些部分仅限于拥有支持合同的客户。这里提供的服务包括在补丁数据库上使用搜索引擎的能力，以帮助你找到困扰你特定硬件和软件组合的问题，并指引你找到可以解决该问题的补丁。（关于补丁的更多信息将在稍后的几个章节中介绍。）其他合同服务还包括下载特殊的系统诊断工具，以及查看在线文档，例如白皮书、问题症状和解决方案报告，以及如何从一个操作系统过渡到另一个版本的信息等。\n\
  \n获取技术支持的最后一种通常是最实用的，而且是免费的！我们将在本章最后讨论如何使用 Usenet，但值得提到的是，对于存在过的每种计算机类型和操作系统，都有一组新闻组。通常你会发现专家经常出没这些新闻组，他们通常非常乐意为你提供所需的任何帮助。然而，通常情况下，你可能有的任何问题（特别是如果你是新手）已经有人问过数百次了。如果是这样，它通常会包含在每个新闻组每月左右发送一次的常见问题解答（FAQ）消息中。这是一条单一的消息，包含了自特定新闻组主题创建以来所有被问过且回答过的支持问题。在向新闻组的每个人询问你的特定问题之前，阅读这条消息将为你省去很多麻烦（以及避免收到垃圾邮件）。关于此类新闻组具体名称的更多信息见本章末尾。\n\
  \n## 获取免费（非官方支持）软件\n\n所有供应商都提供一些内部开发的免费软件来监控你的系统。它们之所以是免费的，是因为它们没有官方支持。如果你想报告有关这些软件的问题，必须联系工具的原始作者，根据他们当前的工作量，他们可能可以，也可能做不了。\n\
  \nSun 的此类工具的一个示例是 SymbEL，最初被称为 Virtual Adrian，可以通过 `http://www.sun.com/sun-on-net/performance/se3/`\
  \ 获取。它允许你分析操作系统内核的内部运行机制，并报告你可以进行哪些修改以获得更好的性能。你会注意到，文档中明确指出该软件包不受官方支持，但他们感谢通过电子邮件提供的反馈，并会考虑任何增强请求。\n\
  \n此类工具的运行效果实际上非常好。问题在于找到它们，因为非支持的应用程序不会被显著地展示。如果你知道想要的工具名称，只需将这些名称输入 Web 搜索引擎就是一个相当简单的过程，至少可以获得关于从何获取最新副本的提示。值得注意的是，并非所有此类程序都是由供应商创建或提供的。有些是由经验丰富的程序员编写的，他们希望与所有人分享。\n\
  \nUsenet 是另一个可以寻找或在本在本章稍后讨论的此类工具的地方。\n\n## 检查补丁/更新\n\n供应商会免费提供某些补丁。定期检查网站是否有新补丁发布是一个好主意，因为这可以让你保持最新状态。如果你在供应商处有支持，你的处会好得多，因为在更新发布时你会立即通过电子邮件收到通知。如果你有支持，还可以使用\
  \ Sun 上一个非常好用的工具（在其他平台上也有类似的工具）来确定应该应用哪些补丁。该工具称为 `patchdiag`，它会将你系统中当前加载的补丁与 Sun\
  \ 目前建议你加载的补丁进行比较。然后它会生成一份报告，告诉你你加载了什么，应该加载什么。它甚至有专门的章节描述影响应用程序和安全的补丁。\n\n关于 UNIX\
  \ 机器上的补丁有一点：许多供应商对于永久删除补丁程序替换的任何文件是有必要的谨慎。因此，他们将它们隐藏起来，以防你某天想要撤销补丁。请注意，你可能会因此丢失一些磁盘空间。随着针对同一个问题的不同补丁不断更新，在一个补丁之上再应用另一个补丁会占用越来越多的磁盘空间。如果你有时间但没有剩余磁盘空间，可以在应用新补丁之前删除旧补丁。通常当你升级操作系统时，这些补丁残留会被完全删除，因此你可以找回空间。\n\
  \n\n\n\n# 检查安全公告\n\n针对你所使用的特定版本 UNIX 的安全公告通常会在供应商的网站上非常显眼地显示。通常还会提供免费的历史安全警报存档。每份公告都描述了操作系统中可能被掌握相关信息的人所破坏的部分。它还描述了阻止该威胁所需的补丁或操作。\n\
  \n安全漏洞的补丁几乎总是免费提供的。你可以选择偶尔手动检查新的安全公告，也可以加入每份独立安全公告中都会重点提到的邮件列表。此后，当针对你的特定平台发布公告时，你会自动收到通知。\n\
  \n# 检查千年（2000 年）问题\n\n除非你过去几年一直一直在睡觉，否则你一定听过 2000 年将带给整个计算世界的所有问题。这些问题中的绝大多数都与一个事实有关：许多应用程序和某些操作系统在编写时，将年份的前两位硬编码在到处（即\
  \ 1999 年中的 \"19\"）。在数据库和其他存储日期的其他文件中，只有年份的最后两位实际上发生了变化。因此，当 2000 年到来时，这些应用程序会将年份的最后两位改为\
  \ 00，对它们来说，年份看起来变成了 1900 年。\n\n正如你所想象的，这将导致随着时间推移而依赖日期演变的程序变得有些困惑，并对它们控制的数据进行一些糟糕的操作。像银行记录、账单程序等，除非在\
  \ 1999 年 12 月 31 日之前发现并修复这些程序，否则可能会受到影响。\n\n整件事之所以发生，是因为开发这些应用程序和操作系统的人并不知道在 2000\
  \ 年到来时，还会有人使用他们的应用程序，甚至使用同一台计算机。一些开发者仍然留着以相同方式编写处理日期敏感信息程序的坏习惯。\n\n大多数 UNIX 供应商都非常重视这个问题，并花费了大量精力检查他们的系统管理和通用系统程序，以确保它们都符合\
  \ 2000 年标准。如果你运行的是他们旧版本的操作系统，他们可能提供了你现在就可以应用以修复这些问题的补丁。新版本的 UNIX 声称完全符合 2000 年标准。如果你与\
  \ UNIX 供应商签支持合同，这些补丁会在他们的支持网站上显眼显示，并可以直接下载到你的系统中进行应用。如果你没有向 UNIX 供应商购买支持合同，大多数供应商仍通过其支持网页的免费服务部分提供\
  \ 2000 年补丁，因为这对保持你的系统运行至关重要。\n\n当然，仅对你的 UNIX 操作系统和供应商提供的工具进行补丁可能是不够。你可能从其他供应商那里购买了应用程序，你需要直接向他们查询或访问他们的网站。与\
  \ UNIX 供应商一样，大多数应用程序供应商都会在其支持网站的首页声称已提供针对 2000 年问题的解决方案。\n\n# 在 UNIX 上阅读网络新闻\n\n\
  互联网上最老的活动之一是阅读网络新闻（Network News），也称为 Usenet。Usenet 本质上是一个巨大的个人讨论主题集合，范围从职位招聘（`misc.jobs.offer`）到如何管理你的计算机（`comp.sys.sun.admin`），再到如何照顾你的非洲灰鹦鹉（`alt.pets.parrots.african-grey`）。通常，你可以与特定主题的专家交流，如果你是该领域的专家，也可以提供建议。\n\
  \n每个新闻组的内容都非常具体，但只有在新闻组受管理的情况下才会强制执行这一点。受管理的新闻组有一个分配的管理员，他会阅读发送到新闻组的每条消息，以验证它是否属于那里。如果不属于，他就会将其拒绝。未管理的新闻组通常是自由讨论的，但人们通常足够礼貌，固于当前话题。如果小组失去控制，它可能会从整个\
  \ Usenet 的所有新闻服务器中被删除。\n\n新闻组按层级结构排列，新闻组名称中的第一个词最不具体，随着你进入新闻组名称后续，它会变得越来越具体。表 24.4\
  \ 列出并解释了这一惯。\n\n### 表 24.6 若干 Usenet 新闻组层级的顶层\n\n- comp.* 与计算机相关的新闻组（例如，`comp.sys.sun`,\
  \ `comp.sys.hp`）\n- rec.* 娱乐新闻组（例如，`rec.humor`, `rec.gardens.roses`）\n- sci.* 与科学相关的新闻组（例如，`sci.math`,\
  \ `sci.archaeology`）\n- alt.* 备选新闻组（例如，`alt.binaries.startrek`）\n- misc.* 不属于任何其他地方的杂主题\n\
  \n当你选择一个新闻组进行读取/写入时，被称为“订阅”该新闻组。当你发送一条消息以包含在新组中时，被称为“向新闻组发帖”。当你这样做时，大约需要一天的时间才能过滤到全球所有的新闻服务器，然后人们很可能会对你写的内容进行回复。过去，你必须每天扫描新闻组，手动寻找对你原始问题/评论的任何回复。坦率地说，如今的大多数新闻阅读器都提供了一种名为“线程”（threading）的功能，它能找到原始帖子并将对它们的任何回复按时间顺序紧跟在原始帖子之后。你会发现\
  \ `trn`（线程化阅读新闻）和 Netscape 提供了此功能，尽管 Netscape 将新闻组称为讨论组，并将你用于阅读新闻的浏览器部分称为 Collabra\
  \ Discussions。\n\n\n\n\n仅有一个新闻阅读客户端是不够让你能够读取和发布 Usenet 消息的。你需要访问新闻服务器的权限。如果你在一个大型站点，你的系统管理员可能已经设置了新闻服务器，或者与其他站点安排了提供这项服务。无论什么情况下，你的系统管理员都可以告诉你该服务器的名称，以便你连接它。如果你的\
  \ UNIX 机器是独立的，并且你通过互联网服务提供商访问互联网，你可以询问他们他们的新闻服务器名称是什么。在知道新闻服务器的名称后，设置环境变量 `NNTPSERVER`\
  \ 使其指向该服务器。大多数新闻阅读客户端在启动时都会寻找此环境变量，并使用它来识别应该连接的新闻服务器。\n\n# NNTP\n\n`NNTPSERVER`\
  \ 代表网络新闻传输协议服务器（Network News Transfer Protocol SERVER）。\n\n1.  你想使用 `trn` 读取网络新闻。首先，确保\
  \ `trn` 可用。如果没有，请你的系统管理员为你安装它（或等效程序）；或者，如果你是独立操作，可以下载它的源代码并自行编译。安装完成后，你就可以进行下一步。\n\
  2.  从系统管理员或互联网服务提供商处获取你的新闻服务器名称，并相应地设置你的 `NNTPSERVER` 环境变量。在本示例中，假设新闻服务器名称为 `news.mycompany.com`。\n\
  \n### 对于 Bourne、Bash 和 Korn Shell 用户\n```bash\nNNTPSERVER=news.mycompany.com; export\
  \ NNTPSERVER\n```\n\n### 对于 C Shell 用户\n```bash\nsetenv NNTPSERVER news.mycompany.com\n\
  ```\n\n3.  现在运行 `trn` 并订阅所有的 `comp.sys.sun.*` 新闻组。在命令行中输入 `trn`。（以下输出中行尾的加粗术语反映了你作为响应输入的内容。）\n\
  \n```\n |\n|\n```\n使用模式或 `g newsgroup.name` 添加新组。如需移除你不感兴趣的新闻组，请使用 `u` 命令。`noread`\
  \ 不读取已订阅新闻组中的消息。订阅新闻组请使用 `g<newsgroup>` 命令。\n\n```\nEnd of newsgroups -- what next?\
  \ a comp.sys.sun\nNewsgroup comp.sys.sun.admin not in newssrc -- subscribe? y\n\
  Put newsgroup where? $\nunread articles in comp.sys.sun.admin -- now? y\n```\n\n\
  4.  当你输入 `comp.sys.sun` 时，你指示 `trn` 在整个新闻组列表中搜索标题中包含 `comp.sys.sun` 的任何组，并逐一询问你是否想要订阅每一个。如果说是，它会询问你想将该新闻组放在当前订阅新闻组列表的什么位置。按下美元符号\
  \ ($) 将此新闻组放在你当前列表的末尾。在你添加所有新闻组后，你将获得机会阅读每个组中的消息。\n5.  如果你想向任何新闻组发布消息，可以在 `trn`\
  \ 内的任何地方通过输入 `!P` 来操作。系统会询问你想向哪个新闻组发送消息。如果你愿意，可以通过逗号分隔新闻组名称来一次指定多个新闻组。\n6.  在 `trn`\
  \ 中任何时候按下 `h` 键都将向你显示帮助菜单。\n\n如前讨论的，新闻组处理特定版本的 UNIX。阅读针对你所用版本的特定组非常有帮助，而且当你需要提问时会更有帮助，因为你是在一个只处理该主题的论坛中发言。但你需要了解这些新闻组是什么。好消息是，新闻组的名称遵循特定的模式。表\
  \ 24.7 显示了主要的 Sun 新闻组及其用途。\n\n### 表 24.7 Sun 特定的新闻组\n\n| 新闻组 | 目的 |\n| :--- | :---\
  \ |\n| comp.sys.sun.announce | 使用 Sun 计算机的人感兴趣的主要公告 |\n| comp.sys.sun.admin | 关于\
  \ Sun 计算机系统管理的信息 |\n| comp.sys.sun.apps | 关于在 Sun 计算机上运行的的信息 |\n| comp.sys.sun.hardware\
  \ | 关于 Sun 计算机硬件的信息 |\n| comp.sys.sun.misc | 不符合任何其他新闻组的 Sun 计算机杂杂 |\n| comp.sys.sun.wanted\
  \ | 通常是对 Sun 硬件的请求，有时也包括软件 |\n\n如果你使用的是惠尔惠谱（Hewlett-Packards），不要放弃。只需将上表中的 `sun`\
  \ 替换为 `hp`，你的平台就有相同的新闻组。其他版本的 UNIX 也有类似的新闻组。\n\n\n\n\n# 由 Gordon Marler \n\n## 编写/执行简单脚本\n\
  - 创建/使用自定义变量\n- 与用户交互\n-在命令行上提供脚本输入 (`$1`)\n- 根据测试结果执行代码 (`if`)\n- 执行算术计算 (`expr/bc`)\n\
  - 特殊 Shell 变量\n- 结束脚本并设置退出状态 (`exit`)\n\nBourne shell 是标准 shell，可以在存在过的每一种 UNIX\
  \ 变体中找到。尽管它可以被认为是 Korn shell 的子集，但许多人仍然使用 Bourne shell 编写脚本，因为其在不同版本的 UNIX 之间具有保证的移植性。\n\
  \n你已经看到 shell 可以作为 UNIX 的命令行界面使用，但它也包含编程结构，使你能够将重复的命令序列提取并在脚本中实现自动化。这方面的一个例子是找到你当前在系统中运行的所有程序并将它们报告给你。你还可以让脚本与你交互，并根据你的输入做出决策。这方面的例子是：脚本询问你一个特定的用户名，然后找到系统中所有属于该用户的程序并将它们报告给用户。\n\
  \n在我们开始之前，有一个简单的规则：井号（`#`）字符表示其后的后续字符都是注释的一部分，除非 `#` 是第一行的第一个字符，否则 shell 将不会解释它们。你稍后就会明白为什么。\n\
  \n### 编写/执行脚本\n你可以从创建一个非常简单的 Bourne 脚本开始，它可以打印 Hello World 并退出。\n\n1. 首先，你需要创建一个存放脚本的空文件。将此文件命名为\
  \ `testscript`。输入 `touch testscript`。\n2. 为了确保该文件被视为可执行脚本，你必须开启该文件的执行权限。输入 `chmod\
  \ +x testscript`。\n3. 现在，你需要在文件中放入一些内容让 UNIX 知道这是一个 Bourne 脚本。大多数 UNIX 版本都能识别 `#!`\
  \ 符号。如果文件的前两个字符是 `#!`，UNIX 将将文件第一行的其他所有内容视为解释器（通常是 shell），用于执行该文件的内容。在这种情况下，我们希望\
  \ Bourne shell 执行我们的文件内容，因此我们将使用 `vi` 或其他编辑器输入 `testscript` 文件的第一行：`#!/bin/sh`。\n\
  4. 打印“Hello World”通过输入文件的第二行来实现：`echo \"Hello World.\"`。\n5. 你可以通过运行脚本来测试它：\n```bash\n\
  ./testscript Hello World\n```\n6. 你完成后的脚本看起来应该是这样的：\n```bash\n#!/bin/sh\necho \"\
  Hello World\"\n```\n有关操作脚本的更多信息，请参阅第 28 页。\n\n### 创建/使用自定义变量\n你经常发现，将脚本中运行的命令输出存储起来供稍后使用非常方便。或者，你可能想编码某些信息（例如长路径），但你不想在每次在脚本中使用它时都输入整个路径。如果此路径以后需要更改，如果可以在脚本中仅一处进行更改并在整个脚本中生效就太好了。要实现这一点，你必须创建一个变量。shell\
  \ 以任何字母或下划线（`_`）开头，后跟零或多个数字、字母或下划线。\n\n要给变量赋值，你使用等号（`=`）以及你想要赋值给变量的值。注意，不能在等号前后使用空格。请学习这些示例：\n\
  \n```bash\nLocalBinaries=/usr/local/bin\nTMP=/tmp\n_mybinaries=/home/gmarler/bin\n\
  rocket_0=apollo\n```\n\n\n\n\n\n- `0_rocket=mercury`\n- 无效的首字符不能为数字\n- `myvar =\
  \ myvalue`\n- `=` 符号周围存在非法空格\n\n要检索存储在变量中的值，可以在变量名前面加上一个美元符号 (`$`)。也可以通过用大括号 (`{...}`)\
  \ 包围变量名并在整个表达式前面加上一个美元符号 (`$`) 来实现。稍后你就会看到这种情况下何时是必要的。\n\n让我们写一个脚本来设置变量并打印它的值：\n\
  \n1. 遵循 `Writing/Executing a Simple Script` 章节中的第 13 步，但文件名命名为 `testscript2`。\n\
  2. 在脚本的第二行，将名为 `tmp_dir` 的变量设置为 `/tmp`。输入：`tmp_dir=/tmp`。\n3. 在下一行，打印变量 `tmp_dir`\
  \ 的值。输入：`echo \" Variable tmp_dir contains: $tmp_dir.`。\n4. 保存你的脚本文件。它现在应该包含以下内容：\n\
  ```bash\n#!/bin/sh\ntmp_dir=/tmp\necho \"Variable tmp_dir contains: $tmp_dir\"\n\
  ```\n5. 测试你的脚本：`./testscript2`\n`tmp_dir contains: /tmp`\n\n我提到过当你想要检索存储在变量中的值时，可能需要使用\
  \ `${variable}` 语法。当你打算以如下方式使用变量值时，这是确实成立的：`mv ${filename}${OLD}`\n\n在这里，我们的意图是两次使用存储在变量\
  \ `filename` 中的文件名：第一次是引用原始文件名，第二次是为原始文件创建一个新名称，并在末尾加上 `OLD`。你可能会犯一个错误，尝试像这样写：`mv\
  \ $filename$OLD`\n\n这会尝试将变量 `filename` 所引的文件移动到变量 `filenameOLD` 所引的名字，而该变量并不存在。从这个例子中，你可能看出，养成始终使用\
  \ `${variable}` 形式引用变量内容的习惯是好的，因为因为它总是有效的。\n\n### 使用反引号设置变量\n\n与其手动设置所有变量的值，你可以运行一个程序并将其输出存储在变量中。你可以通过反引号（``\
  \ `` `）包围想要捕输出的命令来运行它。这被称为命令替换，因为 shell 会获取你在反引号中输入的命令，将其作为一个独立的程序运行（就像你在命令行中输入它一样），然后获取输出并替换整个反引号表达式。反引号与键盘上的波浪号\
  \ (`~`) 位于同一个键上。\n\n你可以通过编写一个脚本来收集你的用户名、运行脚本的计算机名称以及当前日期并打印信息信息来测试此功能。\n\n#### 测试设置变量的反引号方法\n\
  \n1. 遵循 `Writing/Executing a Simple Script` 的第 1-3 步，但将文件命名为 `system_info`。\n2.\
  \ 将 `date` 程序的输出存储在变量 `today` 中。输入：`date`。\n3. 通过运行 `whoami` 查找你的登录身份并存储在变量 `identity`\
  \ 中。输入：`whoami`。\n4. 查找机器名称并将其存储在变量 `machine` 中。输入：`hostname`。\n5. 以优的格式打印出来。输入\
  \ `echo \"Hello, today is $date. I am logged in as $identity on machine $machine.\"\
  `。\n6. 保存你的脚本。它看起来应该是这样的：\n```bash\n#!/bin/sh\ntoday=`date`\nidentity=`whoami`\n\
  machine=`hostname`\necho \"Hello, today is $date. I am logged in as $identity on\
  \ machine $machine\"\n```\n7. 测试脚本：`./system_info`\nHello, today is Thu Mar 12 01:03:27\
  \ PST 1998. I am logged in as gmarler on machine proteon`\n\n### 使用引号\n\n\n\n\n\n\
  如果反引号中的命令将产生多行输出，你必须确保将反引号中的命令括在双引号中。否则，输出中的换行符将被剔除，你将得到一行非常长且难看的内容！如果你打算在将此类命令的输出存储在变量后使用\
  \ `echo` 打印它，双引号也是必要的。\n\n你需要确保你想要通过反引号执行的命令实际上可以被你的 shell 脚本找到。你可以通过在脚本内部显式地设置\
  \ `PATH` 环境变量来实现这一点。你之所以这样做是因为没有设置此变量的脚本将继承运行脚本的用户 `PATH`。如果该用户的路径与你（脚本作者）不相同，脚本在为该用户运行时可能会莫名其妙地运行失败。\n\
  \n### 另请参考\n- *有关更多关于设置路径以及查找要运行的程序实际路径的信息，请参阅第 97 页和第 100 页*\n\n### 使用 whoami 和\
  \ hostname\n你想编写一个运行 `whoami` 和 `hostname` 命令的脚本，并且你非常确定无论由谁运行该脚本，它都能实际找到这两个命令。方法如下：\n\
  \n1. 找到这些命令所在的目录。在 Solaris 上，`whoami` 位于 `/usr/ucb/whoami`，而 `hostname` 位于 `/usr/bin/hostname`。\n\
  2. 现在你已经知道需要在脚本中创建一行（最好是第一行），指定你希望在 `PATH` 中包含 `/usr/ucb` 和 `/usr/bin`。该行看起来应该是这样的：`PATH=/usr/ucb:/usr/bin`\n\
  3. 以下是整个脚本的示例：\n\n```bash\n#!/bin/sh\nPATH=/usr/ucb:/usr/bin\nmyhost=`hostname`\n\
  myidentity=`whoami`\necho \"My username is $myidentity, and machine name is $myhost\"\
  \n```\n\n字体 与用户交互\n本节演示了在本章之前讨论的一些命令，并向你的命令集中添加了一些新命令。\n\n#### 显示标题和提示符 (echo)\n\
  你已经使用 `echo` 命令来输出脚本操作的结果。然而，你也可以用它来打印任何你想让用户看到的输出。默认情况下，`echo` 会打印你提供的信息加上换行符，因此除非另作指定，否则你会被强制到下一行。\n\
  \n`echo` 命令允许使用以下转义字符，帮助你创建标题、标题和提示符：\n- `\\c`: 打印到此处的文本而不跳到下一行。适用于输入提示符。\n- `\\\
  n`: 换行。适用于强制让其后的文本在下一行打印。\n- `\\t`: 制表符。适用于格式化标题和提示符。\n- `\\\\`: 用于在行中插入反斜杠字符。\n\
  - `\\0xx`: 用于插入不可打印的控制字符。`0xx` 是 ASCII 字符的八进制表示。这个零是必须的。\n\n#### 利用已知知识打印有关用户的信息\n\
  1. 首先，为你的信息表打印一个标题。在标题前使用几个制表符使其大致居中，并在其后留一个额外的空行，以与表格的其他部分隔开。由于 `echo` 已经强制你换到下一行，你只需要在末尾再添加一个换行符：\n\
  \   ```bash\n   echo \"\\t\\tCURRENT USER INFORMATION\\n.\"\n   ```\n2. 你需要运行脚本的用户的用户名供后续命令使用；因此你将其保存在变量中：\n\
  \   ```bash\n   identity=`whoami`\n   ```\n3. 现在你将打印一些关于用户的信息。注意反引号命令被直接用在输出的行内。这些命令会被执行，并且它们的输出会在打印前被替换到文本中：\n\
  \   ```bash\n   echo \"My Unix username is: `whoami`\"\n   echo \"My Unix machine\
  \ name is: `hostname`\"\n   echo \"My current directory is: `pwd`\"\n   ```\n\n\n\
  \n\n4. 最后，你打印出当前运行此脚本的用户在系统中正在运行的所有程序列表。注意行中间的换行符（`\\n`）。这强制该 `echo` 命令的后续输出从下一行开始显示。行的剩余部分是一个反引号命令，它获取系统中所有正在运行的程序列表（`ps\
  \ -ef`），并将该输出传递给 `grep` 命令，以搜索运行该脚本的用户正在运行的所有程序。注意，这里必须使用双引号；否则反引号命令的多行输出将显示为一整行。\n\
  \n```\necho \"Programs I am currently running: \\n `ps -ef | grep $identity`\"\n\
  ```\n\n5. 这是完整的脚本：\n\n```bash\n#!/bin/sh\necho \"\\t\\tCURRENT USER INFORMATION\\\
  n\"\n\nidentity=`whoami`\n\necho \"My Unix username is: `whoami`\"\necho \"My Unix\
  \ machine name is: `hostname`\"\necho \"My current directory is: `pwd`\"\necho \"\
  Programs I am currently running: \\n `ps -ef | grep $identity`\"\n```\n\n通常，你还可能想使用\
  \ `echo` 让用户知道你期望某些输入。当你这样做时，可以在某行上打印提示符并让用户在下一行输入其响应，也可以允许用户在与提示符相同的行内输入响应。\n\n\
  这行代码将打印 Please enter your password，然后将光标移动到下一行。\n\n```bash\necho \"Please enter\
  \ your password\"\n```\n\n这行代码将打印 Please tell me your name:、一个空格，然后在空格后留出光标。如你所见，`\\\
  c` 格式字符防止光标跳到下一行。\n\n```bash\necho \"Please tell me your name: \\c\"\n```\n\n现在你已经打印了提示符，让我们下一节查看如何读取用户的响应。\n\
  \n### 将用户输入读入 Shell 变量 (read)\n\n现在你已经知道如何向用户输出，是时候学习如何接受用户输入并在脚本中使用它了。`read` 函数就此此目的。关于这个函数需要记住的是它只接受一种类型的输入：任意长度的文本（最多\
  \ 1024 个字符），并且必须紧跟回车键。在按下回车键之前，`read` 函数对用户输入的内容不会任何操作。\n\n以下步骤显示了如何要求用户输入任何用户名，然后报告该用户当前运行的程序。\n\
  \n#### 报告运行中的程序\n\n1. 首先，提示用户输入用户名，并将光标留在同一行：`echo enter a username: \\c`。\n2. 现在，将响应读入名为\
  \ `username` 的变量中：`read username`。\n3. 现在打印一个格式化的页头，并使用 `username` 变量找到该用户正在运行的所有程序。我们将该信息存储在变量\
  \ `programs` 中：\n   ```bash\n   echo \"\\n\\t\\tCURRENT USER INFORMATION\\n\" programs=\"\
  `ps -ef | grep $username`\"\n   ```\n4. 我们现在再次使用 `username` 变量打印一行，随后是两个回车符和 `program`\
  \ 变量的内容：\n   ```bash\n   echo \"User $username is running the following programs:\
  \ \\n\\n $programs\"\n   ```\n\n5. 这是完整的脚本：\n\n```bash\n#!/bin/sh\necho \"Please\
  \ enter a username: \\c\"\nread username\necho \"\\n\\t\\tCURRENT USER INFORMATION\\\
  n\"\nprograms=\"`ps -ef | grep $username`\"\necho \"User $username is running the\
  \ following programs: \\n\\n $programs\"\n```\n\n关于 `read` 的另一个要点是，它可以用于将值读入多个变量。\n\
  \n```bash\necho \"Please enter your firstname, lastname, age and weight\" read lastname\
  \ age weight\n```\n\n然而，如果用户输入的值多你读取的变量数量，则 `read` 命令中的最后一个变量将接收所有额外值。在以下示例中，如果用户响应提示输入了\
  \ John Smith 20 160，那么变量 `firstname` 将包含 John，而变量 `lastname` 将包含 Smith 20 160。这可能不是你想要的结果。\n\
  \n### 在命令行上提供脚本输入 ($1)\n\n\n\n\n\n到为止，我们创建的脚本要么完全不需要用户的任何输入，要么在每次运行时都必须与用户直接交互。你通常会发现，在启动脚本时提供它所需的所有信息非常方便，这样它在运行过程中就不会向你提问任何问题。如果你打算在后台运行脚本，这一点尤为重要，因为你没有机会给此类脚本提供额外输入，因为后台运行会使其与终端断开。当另一个脚本将运行你的脚本并为其传递信息时，这种方法也有用。\n\
  \n当你运行脚本并像这样为其传递参数时：\n\n`myscript arg1 arg2 arg3 ...`\n\n在你的脚本内部，特殊变量 `$1`、`$2`\
  \ 和 `$3` 分别被设置为 `arg1`、`arg2` 和 `arg3`。这种机制一直有效到 `$9`。如果你需要处理超过九个参数，则需要使用另一种涉及 `for`\
  \ 指令的方法。该指令将在几几节后进行讨论。\n\n值得注意的是的是，`$0` 被设置为你的脚本的实际名称（在本例中为 `myscript`）。当你想要打印信息消息并在其中包含脚本名称时，可能会发现这非常方便。\n\
  \n### 根据测试结果执行代码 (if)\n\n所有编程语言都有某种方法根据条件是否真来决定是否执行代码。Shell 通过 `if` 语句为你提供。`if`\
  \ 语句的完整格式如下：\n\n```bash\nif conditional then\n    command\n    ...\nelif conditional\n\
  then\n    command\n    ...\nelse\n    command\n    ...\nfi\n```\n\n这是它的工作原理：在所有情况下，`conditional`\
  \ 都是你可以执行的任何命令。如果命令的退出状态为零 (0)，意味着它执行成功，那么紧接着 `conditional` 之后的命令将被执行，直到遇到下一个 `else`、`elif`\
  \ 或 `fi`。如果命令的退出状态不是零，意味着命令以某种方式失败了，那么 `conditional` 之后的命令将被跳过，直到遇到下一个 `else`、`elif`\
  \ 或 `fi`。\n\n`elif` 语句如果存在，代表 else if（否则如果），它允许你在进入 `else` 语句或退出整个 `if` 语句之前测试另一个条件。语句的这部分不是必须的，提供以备你需要时使用。`else`\
  \ 语句如果存在，则仅在之前的 `conditional` 不为真时执行。语句的这部分也不是必须的。\n\n如果你不把关键字 `then` 单独放在一行，只要使用分号将其与\
  \ `conditional` 分隔，就可以将其与 `if` 或 `elif` 关键字同一行。\n\n```bash\nif conditional; then\n\
  elif conditional; then\n```\n\n你会注意到条件可以是任何命令，但它通常是 `test` 命令。让我们来看看它是如何工作的。\n\n\
  #### 检查文件类型、大小或权限\n\n`test` 命令允许你做的之一是检查文件系统对象（文件或目录）的多个属性，并根据这些属性在脚本中做出决策。下表不是\
  \ `test` 用于文件系统对象的选项完整列表，但它涵盖了最常用的。\n\n**表 25.1 用于文件系统对象的 test 选项。**\n\n| 选项 | \
  \ |\n| :--- | :--- |\n| `-d file` | 文件是目录吗？ |\n| `-f file` | 文件是普通文件吗？ |\n| `-r\
  \ file` | 该文件可被此脚本读取吗？ |\n| `-w file` | 该文件可被此脚本写入吗？ |\n| `-x file` | 该文件可被此脚本执行吗？\
  \ |\n| `-s file` | 文件长度是否大于零？ |\n\n让我们创建一个文件并对其运行若干次测试。首先，让我们创建一个文件并设置权限：\n\n```bash\n\
  touch /tmp/test\nchmod 755 /tmp/test\n```\n\n现在我们可以编写脚本了。让我们从使用两个独立的 `if` 语句开始：\n\
  \n```bash\nMYFILE=\"/tmp/test\" if test -d $MYFILE then\n    echo \"My file is a\
  \ directory!\"\nfi\nif test -f $MYFILE then\n    echo \"My file is an ordinary file!\"\
  \nfi\n```\n\n如果你原样保存并运行它，你应该会得到如下输出：\n\n```\n% ./testif My file is an ordinary file!\n\
  ```\n\n这是你预期的。现在让我们创建一个名为 `testif2` 的新脚本。在这里我们将使用 `elif` 和 `else` 语句：\n\n```bash\n\
  MYFILE=\"/tmp/test\" if test -d $MYFILE then\n    echo \"My file is a directory!\"\
  \nelif test -f $MYFILE then\n    echo \"My file is an ordinary file!\"\nfi\n```\n\
  \n\n\n\n\n```bash\nthen\n    echo \"My file is an ordinary file!\"\n    if test\
  \ -w $MYFILE\n    then\n        echo \"This file is writeable too!\"\n    else\n\
  \        echo \"This file is not writeable\"\n    fi\n    if test -r $MYFILE\n \
  \   then\n        echo \"This file is readable!\"\n    else\n        echo \"This\
  \ file is not readable\"\n    fi\nfi\n```\n\n注意，你可以将一个 `if` 语句放在另一个 `if` 语句内部。按照当前的文件权限，该脚本应该输出如下：\n\
  \n```bash\n./testif2 My file is an ordinary file!\nThis file is writeable too!\n\
  This file is readable!\n```\n\n4. 现在让我们稍微修改一下文件的权限，关闭它的写入权限，以便我们测试脚本。\n\n```bash\n\
  chmod -w /tmp/testfile\n```\n\n5. 现在再次运行脚本：\n\n```bash\n./testif2 My file is an\
  \ ordinary file!\nThis file is not writeable\nThis file is readable!\n```\n\n###\
  \ 另另参考\n相关相关信息请参阅第 286 页。\n\n值得注意的是，你不需要为每个想要测试的条件都编写一个独立的 `if` 语句。如果对你要完成的任务方便，你可以将多个\
  \ `test` 命令组合在同一行。在下表中，`exp` 代表 `test` 命令的任何选项。\n\n#### 表 25.2 组合 test 命令的运算符\n\n\
  | 表达式 | 说明 |\n| :--- | :--- |\n| `test exp[1] && test exp[2]` | 如果 `exp[1]` 和 `exp[2]`\
  \ 都为真，则整个命令为真。 |\n| `test exp[1] \\| test exp[2]` | 如果 `exp[1]` 或 `exp[2]` 为真，则整个命令为真。\
  \ |\n| `test ! exp[1]` | 如果 `exp[1]` 结果为真，则现在变为假，反之亦然。 |\n\n### Test 命令的另一个示例\n\n\
  1. 现在我们可以写一个短一点的脚本，命名为 `testif3`。让我们先把文件的权限改回来。\n\n```bash\nchmod +w /tmp/testfile\n\
  ```\n\n2. 我们将测试该文件是否是一个普通文件、是否可写以及是否可读：\n\n```bash\nMYFILE=\"/tmp/testfile\" if\
  \ test -f $MYFILE && test -w $MYFILE && test -r $MYFILE\nthen\n    echo \"My file\
  \ is an ordinary file, and it is writeable and readable!\"\nfi\n```\n\n3. 现在，如果文件里什么都没有，即使开启了执行位，尝试将其作为程序运行也是没有意义的对吧？让我们让脚本测试这种情况并告诉我们。请注意，`-s`\
  \ 测试只有在文件大小大于 0 时才返回真 (0)，如果文件大小恰好为 0 则返回假 (1)。因此，我们通过使用 `!` 运算符来反转测试含义。这使得语句的逻辑如下：如果文件是可执行的*且*文件长度为\
  \ 0，则打印消息。\n\n```bash\nif test -x $MYFILE && test ! -s $MYFILE then\n    echo \"\
  This file is empty! Why would you try to execute it?\"\nfi\n```\n\n4. 让我们脚本的输出：\n\
  \n```bash\n./testif3 My file is an ordinary file, and it is writeable and readable!\n\
  This is empty!\n```\n\n另一种编写 `test` 命令的方法可以让它在脚本中更具可读性，并使用方括号（``）：`[ -x file ]`。\n\
  \n不要忘记空格。当你在脚本中使用这种形式的 `test` 时，你必须确保在左方括号（`[`）*之后*加上空格，并在右方括号（`]`）*之前*加上空格。否则，这会导致语法错误。`[\
  \ -x file ]` 等于 `test -x file`。\n\n从现在起，我们将对 `test` 命令使用 `[...]` 语法。\n\n### 检查变量内容\n\
  \n除了检查文件属性外，你还可以使用 `test` 查看变量中的内容，并根据其内容做出决策。对于想要解释为字符串的变量以及想要解释为整数的变量，有单独的运算符。\n\
  \n#### 表 25.3 test 的字符串运算符\n\n| 表达式 | 说明 |\n| :--- | :--- |\n| `-n *string` | 如果\
  \ `string` 有值（不为空）则返回真 |\n| `-z *string` | 如果 `string` 无值（为空）则返回真 |\n| `*string1\
  \ = string2` | 如果 `string1` 与*string2* 相同则返回真 |\n| `*string1 != string2` | 如果 `string1`\
  \ 不与 `string2` 相同则返回真 |\n\n\n\n\n几个示例可以清楚地说明这些是如何工作的。你可以使用这些语句中的任何一个脚本中 `if` 语句的条件部分。你应该记住，传递给\
  \ `test` 的任何变量都应该用双引号括起来。\n\n### 检查值\n\n首先，我们可以检查一个变量是否有任何值。\n\n```bash\nmyvar=\
  \ if [ -z \"$myvar\" ]; then\n   echo \"This variable has no value\"\nfi\n```\n\n\
  然而，上一个示例可能会让你碰钉，如果变量 `myvar` 包含某些非字母数字字符，例如等号（`=`），因为 `test` 会认为你正试图给一个变量赋值！为了确保这种情况永远不会发生，你可以使用另一种结构，你会发现这种结构在\
  \ shell 脚本中非常常见。\n\n```bash\nmyvar= if [ X = X\"$myvar\" ]; then\n   echo \"This\
  \ variable has no value\"\nfi\n```\n\n你看到它是如何工作的了吗？如果 `myvar` 没有值，该语句将简化为：`X` 等于\
  \ `X` 吗？这显然是真。。\n\n### 字符串比较\n\n现在让我们对字符串变量进行一些比较。\n\n```bash\nanimal1=\"pig\" animal2=\"\
  cow\"\nif [ $animal1 = $animal2 ]; then\n   echo \"These animals are the same\"\n\
  elif [ $animal1 != $animal2 ]; then\n   echo \"These animals are different\"\nfi\n\
  ```\n\n### 整数比较\n\n如果存储在变量中的字符串是数字，你需要使用另一组运算符将它们视为数字处理。你需要区分这种区分，正如你从以下示例中看到的那样。记住，这些运算符只对整数有效。它们不理解带有小数点的数字。\n\
  \n**表 25.4 用于 test 的整数运算符。**\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `int1 -eq int2`\
  \ | `int1` 等于 `int2` |\n| `int1 -ne int2` | `int1` 不等于 `int2` |\n| `int1 -gt int2`\
  \ | `int1` 大于 `int2` |\n| `int1 -ge int2` | `int1` 大于等于 `int2` |\n| `int1 -lt int2`\
  \ | `int1` 小于 `int2` |\n| `int1 -le int2` | `int1` 小于等于 `int2` |\n\n```bash\nvalue1=\"\
  6\" value2=\"00005\"\nif [ \"$value1\" -ne \"$value2\" ]; then\n   echo \"values\
  \ are not equal\"\nfi\nif [ \"$value1\" -eq 6 ]; then\n   echo \"value1 is equal\
  \ to 6\"\nfi\nif [ \"$value2\" -eq 5 ]; then\n   echo \"value2 is equal to 5\"\n\
  fi\n```\n\n现在，如果你在最后两个测试中使用字符串运算符 `=` 而不是整数运算符 `-eq`，你将无法收到任何一个的输出。那是因为 `value1`\
  \ 中的 `6` 后面有一个空格，而 `value2` 中的 `5` 之前有四个零，字符串运算符寻找的是精确字符匹配，而不是数值匹配。\n\n### 检查命令结果\n\
  \n我知道我说 `if` 语句的条件部分通常是 `test` 命令的形式，但你可以使用任何在成功完成时返回零 (0)、在失败时返回其他任何数字的命令或程序。\n\
  \n例子是，如果你想知道系统中是否有人运行 `vi` 文本编辑器。实际上，这个脚本将定位系统中运行的任何 `vi` 程序，以及由 `ps -ef` 生成的包含\
  \ \"vi\" 字样的任何内容。\n\n```bash\nif ps -ef | grep \"vi\"; then\n   echo \"Yep, someone\
  \ is running vi\"\nelse\n   echo \"No one is running vi at this time\"\nfi\n```\n\
  \n注意我们运行了 `ps -ef`，将其输出通过到 `grep`，并告诉它查找任何以最后两个字符 vi 结尾的行。如果 `grep` 搜索成功，它将返回零状态码，并返回确认\
  \ `vi` 运行在系统某处的行。注意，只检查*条件*部分中运行的最后一个命令的状态码。\n\n让我们看看上述的输出：\n\n```\n1234 pts/0 \
  \   S    0:00 0:00 vi\n```\n是的，vi 正在运行\n```\n\n发生了什么？嗯，第一行输出是由运行 `ps -ef | grep\
  \ \"vi\"` 产生的。如果你不想让运行脚本的人看到*条件*程序的输出，你可以将此类程序的输出重定向到 `/dev/null`。修改后的行看起来像这样：\n\
  \n```bash\nif ps -ef | grep \"vi\" > /dev/null; then\n```\n\n只要你在*条件*中运行的程序向*标准输出*发送了任何信息，那就是没问题的。然而，如果它们还向*标准错误*发送了任何信息消息或错误，如果你不想看到这些消息混杂在你的输出中，你就必须更改该行以将它们都发送到\
  \ `/dev/null`。在这种情况下，该行将变为：\n\n```bash\nif ps -ef | grep \"vi\" > /dev/null 2>&1;\
  \ then\n```\n\n\n\n你实际上不需要使用 `if` 就能获得这些结果。你可以使用 `&&` 和 `||` 运算符来连接你想要在特定条件下执行的一系列命令。首先，让我们来看如何查看这些运算符。\n\
  \n你可以将 `command1 && command2` 理解为：当且仅当 `command1` 执行成功时，才执行 `command2`。你可以将 `command1\
  \ || command2` 理解为：如果 `command1` 没有执行成功，则执行 `command2`。\n\n你可以使用这些运算符连接你认为必要的任意数量命令。这里有一个常见任务的示例：将日志文件复制到另一个位置以备日后检查，然后再清空当前日志文件。你不希望在确定到另一个位置的复制成功之前允许当前日志文件被清空。\n\
  \n```bash\ncp ${logfile} ${logfile}.1 && cp /dev/null ${logfile}\n```\n\n你可以重写这段代码，给出一个友好的短消息，通知用户脚本无法复制日志文件。括号的作用是确保由\
  \ `&&` 连接的命令在 `echo` 可能运行之前已经过完全评估。如果前两个命令都成功，则 `echo` 将永远不会执行。\n\n```bash\n(cp\
  \ ${logfile} ${logfile}.1 && cp /dev/null ${logfile}) || echo \"Could not copy ${logfile}\
  \ to ${logfile}.1\"\n```\n\n这比写等价的内容短一点（但没有那么易读）：\n\n```bash\nif cp ${logfile} ${logfile}.1;\
  \ then\n    cp /dev/null ${logfile}\nelse\n    echo \"Could not copy ${logfile}\
  \ to ${logfile}.1\"\nfi\n```\n\n### 执行计算\n\n你可能已经注意到，到为止所有的示例都严格处理文本，没有提到如何处理数值计算。这是因为\
  \ shell 认为一切都是文本；它只将数字视为 ASCII 字符。如果你需要执行任何类型的数值计算，你必须使用 shell 外部的程序并通过反引号（backquote）来为你完成。这些程序的输出可以赋值给变量，或者通过\
  \ `echo` 命令直接打印。如果你只需要执行整数计算，可以使用表达式评估程序 `expr`。\n\n#### 表 25.5：`expr` 中使用的数学运算\n\
  \n| 表达式 | 运算操作 | 结果 |\n| :--- | :--- | :--- |\n| `result=`expr 5 + 4`` | 加法 | `result=9`\
  \ |\n| `result=`expr 5 - 4`` | 减法 | `result=1` |\n| `result=`expr 5 \\* 4`` | 乘法\
  \ | `result=20` (注意星号 `*` 必须用反斜杠转义) |\n| `result=`expr 4 / 2`` | 除法 | `result=2`\
  \ |\n| `result=`expr 5 % 4`` | 余数（模） | `result=1` (即 5 除以 4 余 1) |\n| `result=`expr\
  \ 5 / 4`` | 除法 | `result=1` (记住，`expr` 除了整数计算外什么也做不了) |\n\n如果你需要在脚本中使用浮点数数学运算，你可以使用\
  \ `bc` 来进行计算。你必须确保在每次使用 `bc` 时都为它指定的小数位精度。\n\n#### 转义 `expr` 命令\n\n`expr` 中的乘法使用星号\
  \ (`*`)，但你必须用反斜杠对其进行转义。为什么？因为如果你这样做，星号将被解释为通配符，并匹配目录中的所有文件。\n\n为了获得两位小数，我们必须使用 `bc`\
  \ 中的 `scale` 指令。为了获取兆字节数，我们将千字节数除以 1024。注意我们使用双引号来保护命令不被 shell 解释：\n\n```bash\n\
  diskspace_mb=`echo \"scale=2; $diskspace_kb/1024\" | bc` echo $diskspace_mb\n```\n\
  \n在这种情况下，你应该得到以下输出：\n\n```\n1765.69\n```\n\n\n\n\n\n为了方便起见，shell 预定义了一些变量，其中一些会脚本的运行而改变，另一些则在脚本的生命周期内固定设置。\n\
  \n### 检查指定的命令行参数数量 (`#`)\n\n当有人运行你的脚本时，确保他或她传递了正确数量的参数总是很有好的。当你的脚本运行时，shell 会将 `$#`\
  \ 设置为该数字。你可以使用已经讨论过的整数比较操作符对其进行检查。\n\n如果你知道你必须向脚本传递三个选项，例如，你可以这样检查：\n\n```bash\n\
  if [ \"$#\" -ne 3 ]; then\n   echo \"Sorry, you did not pass the necessary 3 arguments\
  \ to this script\"\nfi\n```\n\n通常情况下，你会在脚本执行任何其他操作之前进行此测试。\n\n### 检查上一个命令的状态 (`$?`)\n\
  \n在运行一个命令后，确保它执行正常并采取相应的行动是一个非常好的主意。每当在 UNIX 上执行命令时，它在停止运行时都会返回一个退出状态码。shell 会捕获该退出状态码的值并将其存储在特殊变量\
  \ `$?` 中。然而，你必须立即检查这个变量，因为一旦执行下一个命令，它就会被重置。此外，不要尝试对 `$?` 变量运行测试；这样做会重置它的值！除非你只想将其打印给用户，否则请先保存到临时变量中。\n\
  \n通常，如果命令执行成功，变量的值为零 (0)，如果执行失败，则为任何非零数字（通常为 1）。\n\n在第一个示例中，我们将尝试在将原始日志文件设置为零长度并压缩副本之前，将日志文件复制到另一个位置：\n\
  \n```bash\ncd /adm cp messages.1\nSTATUS=$?\nif [ \"$STATUS\" -eq 0 ]; then\n  \
  \ compress messages.1 & # Run the compress in the background\nelse\n   echo \"not\
  \ make a copy of the original file\"\nfi\n```\n\n如果上示例中的 `cp` 命令失败，是因为发生了错误，例如文件系统满了，或者磁盘本身真的有问题。并不是所有命令在这种失败情况下都会返回非零值。正如你所看到的，测试命令根据比较是否有效来返回零或一。\n\
  \n```bash\nfirstname=\"john\" lastname=\"smith\"\n[ \"$firstname\" = \"$lastname\"\
  \ ]\necho $? # 这将打印 1，因为它们不相等\n[ \"$firstname\" = \"john\" ]\necho $? # 这将打印 0，因为它们相等\n\
  ```\n\n### 使用非冲突的临时文件 (`$$`)\n\n如果你编写了一个许多人认为很有用的脚本，那么可能有许多人会同时运行它。如果这个脚本在运行时需要打开临时文件，你需要采取措施，防止一个脚本副本覆盖另一个同时运行的脚本副本的临时文件。幸运的是，`$$`\
  \ 变量允许你做到这一点。每当你运行一个脚本时，`$$` 会被设置为该脚本的进程 ID (PID)。\n\n这使得一个脚本的 `$$` 变量不太与同一系统中运行的该脚本的任何副本相同。因此，你可以将此变量作为脚本需要创建的任何临时文件名的一部分。\n\
  \n假设你想编写一个脚本，它接收一个文件，使用 `nl` 命令对其中的每一行进行编号，临时保存该文件的修改版本，然后将临时文件的内容打印到屏幕上：\n\n```bash\n\
  if [ \"$#\" -ne 1 ]; then\n   echo \"This script wants 1 argument\"\n   exit\nelse\n\
  \   nl $1 > /tmp/$$ # Run the nl command on the file\n   cat /tmp/$$ # Print the\
  \ contents of the temp file to the screen\nfi\n```\n\n### 将所有参数传递给另一个命令 (`*`)\n\n\
  现在你知道如何使用 `$#` 计算传递给脚本的参数数量，那么如何获取参数本身的列表呢？特殊变量 `$*` 包含了该列表。\n\n如果你想让脚本使用 `ls` 对你在命令行上指定的任何文件进行长列表显示，你可以这样写：\n\
  \n```bash\nif [ \"$#\" -eq 0 ]; then\n   echo \"This script takes at least one argument\"\
  \n   exit\nfi\nlisting=`ls -l $`\necho \"$listing\"\n```\n\n如你所见，`ls` 获取了你传递给脚本的所有命令行参数。因此，如果脚本名为\
  \ lister，并且你这样运行它：\n\n```bash\n./lister core /tmp/test\n```\n\n它等同于输入以下内容：\n\n```bash\n\
  ls -l core /tmp/test\n```\n\n\n\n\n\n# 结束脚本并设置完成状态 (`exit`)\n\n当你的脚本完成工作并准备终止时，显式地返回一个退出状态比让\
  \ shell 猜测退出状态应该是什么样的要好。特别是当你是因为错误条件退出时，这一点尤为重要，因为你想通知任何可能调用你脚本的脚本。通常情况下，如果你的脚本正常退出，给出一个退出状态零\
  \ (0) 是很好的，这样任何可能调用你的脚本都可以检查你的退出状态，并确信一切正常。\n\n我们在之前的几个示例中使用过 `exit` 命令，但从未带过参数。你传递给\
  \ `exit` 的任何参数将作为你脚本的退出状态。这里有一个简单的示例，展示了如何根据几次测试的结果顺利或非顺利地退出脚本。\n\n```bash\nif cp\
  \ ${filename} ${filename}.1; then\n    echo \"Compressing ${filename}.1\"\n    compress\
  \ ${filename}.1\n    cp /dev/null ${filename}\n    exit 0      # 噢！顺利退出，任务完成\nelse\n\
  \    echo \"Could not copy ${filename} to ${filename}.1\"\n    exit 1      # 哎！非顺利退出\n\
  fi\n```\n\n# 提供正确的 UNIX 使用错误提示\n\n你可能已经注意到，当你使用错误的数量或错误的类型的参数运行 UNIX 命令时，命令会向你发送一条简短的消息，让你知道它所需的参数数量和顺序。到目前为止的示例，我们只打印了一条消息说输入的信息错误。我们没有给用户关于他应该输入什么的提示。\n\
  \n这里有一个示例，展示了你应该每个脚本第一个测试中放置什么。在这个示例中，脚本的第一部分将文件复制到归档位置，压缩归档文件，然后删除原始文件。它要求你至少提供一个文件名来执行此操作。\n\
  \n```bash\nif [ $# -eq 0 ]; then\n    echo \"Usage: $0 ...\"\n    echo \"Please\
  \ enter filename(s) to be archived\"\n    exit 1\nfi\n```\n\n# 遍历每个命令行参数 (`for`)\n\
  \n你经常会在脚本中有一列表项目，需要对其执行特定的操作。`for` 循环结构可以帮助实现。它的通用格式如下：\n\n```bash\nfor variable\
  \ in list-of-items... do\n    command\ndone\n```\n\n其中，`variable` 被设置为 `list-of-items`\
  \ 中的每个值，并且每当 `variable` 变化时都会运行 `command`。\n\n记得我们讨论过 `$1`, `$2`, ... `$9` 变量，我们说明过你只能通过它们引用程序的前九个参数。使用\
  \ `for` 循环，你可以访问任意数量的参数。你刚刚知道了 `$*` 变量的用途，所以让我们使用 `for` 循环来打印传入如下运行的脚本的所有命令行参数：\n\
  \n`myscript dog cat horse`\n\n现在 `$*` 应该包含 `dog cat horse`。在 `myscript` 内部代码如下：\n\
  \n```bash\nfor arg in $* do\n    echo $arg\ndone\n```\n\n因此，脚本的输出是每个命令行参数打印在单独的一上：\n\
  \n```\ndog\ncat\nhorse\n```\n\n让我们用同样的思想写一个脚本，获取命令行给出的所有文件名并对其进行压缩（如果存在）。\n\n```bash\n\
  if [ \"# -eq 0 ]; then\n    echo \"This command requires at least one argument\"\
  \n    echo \"$0: filename-to-compress...\"\n    exit 1\nfi\nfor FILE in $* do\n\
  \    if [ -f \"$FILE\" ]; then\n        echo \"Compressing $FILE now\"\n       \
  \ compress $FILE\n    else\n        echo \"Sorry, filename $FILE does not exist\"\
  \n    fi\ndone\n```\n\n# 调试你的脚本\n\n如果脚本没有按照你的预期运行，或者某个变量似乎没有你认为它应该有的值，你可以做几件事来调试问题。最简单的方法是对\
  \ Bourne shell 使用 `-x` 选项。你可以通过修改脚本的第一行使其看起来像这样：\n\n```bash\n#!/bin/sh -x\n```\n\
  \n或者，你可以直接带 `-x` 选项对你的脚本运行 shell，如下：\n\n`sh -x scriptname`\n\n这两种方法实现相同；shell 被指示逐行打印脚本中的每一行，展开任何变量以显示它们包含的值，并运行任何反引号命令，显示它们的结果。在这样打印每一行之后，它实际上会被执行。这里有一个示例脚本，我们将开启调试模式运行它：\n\
  \n```bash\n#!/bin/sh\n1.machine=`hostname`\n2.identity=`whoami`\n```\n\n\n\n3. `date=`date``\n\
  4. `echo \"Hello, today is $date\"`\n5. `echo \"I am logged in as user $identity\
  \ on machine $machine\"`\n\n![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)\n\
  \n开启调试模式运行 `info`：\n\n```bash\nsh -x ./info\n```\n\n1. + hostname\n2. machine=proteon\n\
  3. + whoami\n4. identity=gmarler\n5. + date\n6. date=Sat Mar 21 19:22:28 PST 1998\n\
  7. + echo Hello, today is Sat Mar 21 19:22:28 PST 1998\n8. Hello, today is Sat Mar\
  \ 21 19:22:28 PST 1998\n9. + echo I am logged in as user gmarler on machine proteon\n\
  10. I am logged in as user gmarler on machine proteon\n\n### 调试脚本。\n\n1. 脚本的第一行由调试输出的第\
  \ 1 和 2 行表示。注意，反引号包裹的 `hostname` 命令在第 1 行被标记为加号 (+)，告知你这是一个外部执行的命令。第 2 行显示了结果。变量\
  \ `machine` 现在的值为 `proteon`，即机器名称。\n\n2. 脚本的第二行在调试输出的第 3 和 4 行中执行。第 3 行显示正在执行外部命令\
  \ `whoami`，第 4 行显示该命令的输出被赋值给变量 `identity`。\n\n3. 脚本的第三行显示在调试输出的第 5 和 6 行中。第 5 行显示正在执行外部命令\
  \ `date`，第 6 行显示其输出被赋值给变量 `date`。\n\n4. 脚本的第四行显示在调试输出的第 7 和 8 行中。注意第 7 行展开了 `date`\
  \ 变量。第 8 行是你即使不以调试模式运行脚本也会看到的输出。\n\n5. 脚本的第五行显示在调试输出的第 9 和 10 行中。第 9 行展开了 `identity`\
  \ 和 `machine` 变量的值，第 10 行打印了你通常从该脚本看到的输出。你也可以使用 `-xv` 选项，它会产生更详细的脚本输出。另一种更困难或至少更繁琐的调试方法是使用大量的\
  \ `echo`，打印你在脚本中设置的变量值（例如传递给脚本的命令行参数），以确保你获取了你认为应该的信息。\n\n### 遍历项目列表 (*)\n\n你可以使用\
  \ `for` 手动输入想要遍历的整个项目列表：\n\n```bash\nfor x in 1 2 3 4 5 do echo $x done\n```\n\n\
  你也可以直接在脚本中创建想要遍历的项目列表，或者通过反引号操作符让外部程序为你完成。\n\n### 处理目录中的所有文件\n\n在之前的示例中，我们编写了一个脚本，可以在运行脚本时压缩你指定的文件。你也可以编写一个脚本，获取目录中的所有文件并对它们进行处理（例如压缩），这样你就不需要在命令行上指定任何内容，除非是包含文件的目录。让我们试试这个：\n\
  \n```bash\nif [ \"$#\" -eq 0 ]; then\n  echo \"This command requires at least one\
  \ argument\"\n  echo \"$0: directory-containing-files-to-compress ...\"\n  exit\
  \ 1\nfi\nfor DIR in $*\ndo\n  if [ ! -d \"$DIR\" ]; then\n    echo \"Sorry, directory\
  \ $DIR does not exist\"\n    exit 1\n  fi\n  for FILE in `ls $DIR`\n  do\n    if\
  \ [ -d \"$FILE\" ]; then\n      echo \"Yikes!, this is a directory\"\n    else\n\
  \      echo \"Compressing $FILE\"\n      compress $FILE\n    fi\n  done\ndone\n\
  ```\n\n如你所见，我们不需要测试文件是否存在，因为脚本生成了文件列表。我们只需要确保指定的目录确实存在。我们还需要检查目录是否也包含其他目录。\n\n###\
  \ 处理目录树中的所有文件\n\n现在我们已经处理了目录中的所有文件，如果目录本身包含另一个目录，以此类推呢？我们可能希望也处理所有子目录中的文件。这里有一个处理这种情况的示例。\n\
  \n#### 处理文件\n\n1. 一如常，开始脚本前确保输入了正确数量的参数。在这种情况下，一个参数就足够了，但它是必须的。\n\n```bash\nif [\
  \ \"$#\" -eq 0 ]; then\n  echo \"This command requires at least one argument\"\n\
  \  echo \"$0: directory-containing-files-to-compress ...\"\n  exit 1\nfi\n```\n\n\
  2. 现在，获取命令行上提到的每个目录并确保它们确实存在。\n\n```bash\nfor DIR in $*\ndo\n  if [ ! -d \"$DIR\"\
  \ ]; then\n    echo \"Sorry, directory $DIR does not exist\"\n    exit 1\n  fi\n\
  ```\n\n3. 我们使用 `find` 命令生成每个目录下的完整文件列表。然后我们可以检查 `find` 返回的每一行，查看它描述的是否文件（它可能描述子目录、符号链接或管道），如果是文件，则对其进行压缩。\n\
  \n\n\n\n\n```bash\nfor FILE in `find $DIR -print` do\n    if [ -f \"$FILE\" ]; then\n\
  \        echo \"Compressing $FILE now\"\n        compress $FILE\n    else\n    \
  \    echo \"Yikes, This is not a file\"\n    fi\ndone\n```\n\n# 从项目列表中选择项 (case)\n\
  \n如果你希望脚本能为用户提供一组菜单选项，并根据其响应采取操作，`case` 语句是一种非常方便的实现方法。它的格式如下：\n\n```bash\ncase\
  \ value in\n    pattern1 )\n        command ...\n        command;;\n    pattern2\
  \ )\n        command ...\n        command;;\n    ...\n    patternx )\n        command\
  \ ...\n        command;;\nesac\n```\n\n其中 `value` 是任何将与模式 `pattern[1], pattern[2],\
  \ ..., pattern^x` 进行比较的文本字符串。匹配到 `value` 的第一个模式之后的 `command` 列表将被执行。通常会使用一个全捕模式（如\
  \ `*`）作为最后一个模式，用以捕获任何未预料到的或用户输入错误的内容。请注意每个模式部分的最后一个命令后必须使用双分号（`;`）。不要忘记这些；否则，你执行的命令将比预期的多！\n\
  \n下面的示例涵盖了一个允许你压缩、详细列出或删除文件的脚本。\n\n### 压缩、列出或删除文件\n\n1. 首先，你需要打印出菜单供用户选择。注意使用 `\\\
  c` 字符以确保抑制换行，光标将停留在冒号后等待输入。\n```bash\necho \"What would you like to do:\n1. Compress\
  \ a file\n2. Do a long listing of a file\n3. Delete a file\nselect one of the above\
  \ (1-3): \\c\"\n```\n\n2. 现在你可以在用户输入后读取其选择，并将其传递 `case` 语句。\n```bash\nread selection\n\
  case \"$selection\" in\n```\n\n3. 现在你已经有了他的选择，`case` 语句将涵盖每种情况。第一个是要选择压缩的文件。你会提示文件名，确保它确实存在，然后对其压缩。\n\
  ```bash\n1)  echo \"Enter filename to compress: \\c\"\n    read filename\n    if\
  \ [ -f \"$filename\" ]; then\n        compress $filename\n    else\n        echo\
  \ \"Bad filename\"\n    fi;;\n```\n\n4. 第二种可能的选择是对文件执行详细列出。同样地提示文件名，确保它存在，然后执行列出。\n\
  ```bash\n2)  echo \"Enter filename to list: \\c\"\n    read filename\n    if [ -f\
  \ \"$filename\" ]; then\n        ls -l $filename\n    else\n        echo \"Bad filename\"\
  \n    fi;;\n```\n\n5. 现在是第三个要删除的文件。你提示文件名，确保它存在，然后将其删除。\n```bash\n3)  echo \"Enter\
  \ filename to delete: \\c\"\n    read filename\n    if [ -f \"$filename\" ]; then\n\
  \        rm $filename\n    else\n        echo \"Bad filename\"\n    fi;;\n```\n\n\
  6. 最后，你想要执行全捕操作，并将其报告为菜单中的错误选择。然后结束 `case` 语句。\n```bash\n*)  echo \"Incorrect selection\"\
  ;\nesac\n```\n\n# 第 26 章编写 awk 脚本\n作者 David B. Horvath, CCP\n\n## 何时使用 awk\n\n##\
  \ awk 的特性\n### 基础\n### 动作 (Actions)\n### 高级输入与输出\n### 函数\n### 编写报告\n### 瞬时命令\n\n\
  \n\n`awk` 有多个版本：原始的 `awk`、`nawk`、`POSIX awk` 和 `gawk` (GNU awk)。`nawk` 创建于 1985\
  \ 年，是 *The awk Programming Language* 一书中描述的版本（参见本章末尾“总结”部分对该书的完整引用）。`POSIX awk`\
  \ 定义在《信息技术标准，可移植操作系统接口第 2 部分：Shell 和工具第 2 》中，该标准由 ANSI 于 1993 年 4 月 5 日批准（IEEE 是电气与电子工程师协会）。`gawk`\
  \ 基于 `POSIX awk`。\n\n`GNU` 缩写代表 `GNU is Not UNIX`（GNU 不是 UNIX）。它是一系列在 UNIX 环境中常见的有用软件包的名称，由\
  \ MIT 的 GNU 项目分发。这些软件包通常是免费的，可以在互联网的各个地方获取（如果你想在软磁盘或磁带等物理介质上获取副本，则需要支付费用）。这些软件包的开发是一个协作过程，由许多志愿者完成。这项工作在很大程度上由\
  \ Richard M. Stallman（`emacs` 编辑器的开发者之一）领导。\n\n### 什么是 awk\n`awk` 语言（所有版本）是一种功能强大的模式匹配和处理语言。它会搜索文件（或多个文件）中匹配指定模式的记录。当找到匹配项时，会执行指定的动作。作为程序员，你不需要担心打开文件、循环文件、读取每条记录、处理文件结束符或在完成后关闭文件。这些细节都会自动为你处理。创建一个简短的\
  \ `awk` 程序很容易，因为许多细节都由语言自动处理了。它还有许多用于处理文件的功能。\n\n### 何时使用 awk\n`awk` 有许多可能的用途，包括从文件中提取数据、统计文件中的出现次数以及创建报告。`awk`\
  \ 语言的基本语法与 `C` 编程语言匹配；如果你已经熟悉 `C`，你就熟悉了大部分 `awk`。在很多方面，`awk` 是 `C` 的更简单版本，因为它处理字符串和数组的方式是（动态的）。如果你还不认识\
  \ `C`，学习 `awk` 会让学习 `C` 变得稍微容易。`awk` 对于快速原型设计或尝试将要在 `C` 等其他语言实现的想法也非常有用。你不需要担心一些细微的细节，内置的自动化功能会处理它们。你只需要关注基本功能。\n\
  \n### 何时不使用 awk\n`awk` 适用于文本文件，而不是二进制文件。因为二进制数据可能包含像记录终止符（换行符）的值，或者完全没有，`awk` 会产生困惑。如果你需要处理二进制文件，请查看\
  \ `Perl` 或使用传统的编程语言如 `C`。\n\n### awk 的特性\n作为 UNIX 环境的一部分，`awk` 非常灵活，包含预定义变量、自动化许多编程任务、提供常规变量、支持\
  \ C 格式输出并且易于使用。它允许你结合 shell 脚本和 C 编程的优处。\n\n### awk 中的变量\n在 `awk` 中通常有许多不同的方法来完成同一个任务。程序员可以决定哪种方法最适合他们的应用程序。通过内置变量和函数，许多常规编程任务会自动执行。`awk`\
  \ 会自动读取每条记录，将其拆分为字段并在需要时进行类型转换。变量的使用方式决定了它的类型；不需要（也没有方法）声明任何类型的变量。当然，`awk` 支持标准的\
  \ `C` 编程结构，如 `if/else`、`do/while`、`for` 和 `while`。`awk` 不支持 `switch/case` 结构。它支持用于格式化输出的\
  \ `C printf()`，还有一个用于简单输出的 `print` 命令。\n\n### awk 基础\n与其他 UNIX 工具（`shell`、`grep`\
  \ 等）不同，`awk` 需要一个程序（称为 `awk` 脚本）。这个程序可以简单到一行，也可以复杂到几千行（我曾开发过一个 `awk` 程序，可以在多个层级通过多个控制断点总结数据；它差差\
  \ 1000 行）。\n\n\n\n`awk` 程序可以通过多种方式在命令行或程序文件中输入。`awk` 可以接受来自文件的输入、从另一个程序的管道的输入，甚至可以直接从键盘输入。输出通常发送到标准输出设备，但可以将其重定向到文件或管道到另一个程序。输出也可以直接发送到文件，而不是标准输出。\n\
  \n## 从命令行使用 awk\n\n使用 `awk` 最简单的方法是在命令行上编写程序，接受来自标准输入设备（键盘）的输入，并将输出发送到标准输出设备（屏幕）。列表\
  \ 26.1 显示了这种最简单的形式；它会打印输入记录中的字段数量以及该记录本身。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n### 关于列表 26.1 及其他的一些说明\n\n`Ctrl+D` 是显示你应该按下（并按住）`Ctrl`（或 Control）键然后按下 `D` 的一种方式。这是\
  \ UNIX 的默认文件结束键。如果这在你的系统上不起作用，请使用 `stty -a` 来确定应该按哪个键。该操作或键在屏幕上的另一种显示是 `^d`。\n\n\
  整个 `awk` 脚本包含在单引号 `' '` 中，以防止 shell 解释其内容。这是操作系统或 shell 的要求，而不是 `awk` 语言的要求。\n\n\
  #### 列表 26.1 awk 最简单的用法。\n\n```awk\nawk '{print NF \":$0}'\n```\n6: Now is the time\
  \ for all\n7: Good Americans to come to the Aid\n3: of Their Country.\n不要问你能为 awk\
  \ 做什么，而要问 awk 能为你做什么。\n16: 不要问你能为 awk 做什么，而要问 awk 能为你做什么。\n\n#### 如何运行本章中的示例\n\n\
  所有示例将展示如何作为实现 `awk` 语言的 UNIX 命令使用 `awk`。你的机器可能同时拥有 `awk` 和 `nawk`，仅有 `awk` 命令（实现旧的\
  \ `awk`、`nawk`、`POSIXawk` 甚至 `gawk`），或者只有 `gawk`。你必须使用适用于你机器的命令。\n\n`NF` 是预定义变量，设置为每条记录的字段数。`$0`\
  \ 是该记录。单个字段可以引用为 `$1`、`$2` 等。\n\n你也可以将 `awk` 脚本存储在文件中，并通过 `-f` 标志在命令行上指定该文件名。如果你这样做，就不需要将程序包含在单引号中。\n\
  \n`gawk` 以及其他符合 POSIX 标准的 `awk` 版本通过使用多个 `-f` 选项支持指定多个程序。这允许你对同一份输入执行多个 `awk` 程序。个人而言，我倾向于避免这样做，因为这会变得有点混乱。\n\
  \n```bash\n$\n```\n```bash\nawk '{print NF \":$0}' < inputs\n```\n\n可以通过直接在命令行上列出多个文件来指定，它们将按照指定的顺序进行处理。输出可以通过正常的\
  \ shell 功能重定向以发送到文件或管道到另一个程序：\n\n```bash\nawk '{print NF \":$0}' > outputs | more\n\
  ```\n\n当然，输入和输出可以同时进行重定向。\n\n### 脚本命名\n\n我倾向于用 `.awk` 文件类型（后缀）保存我的 `awk` 脚本，以便在查看目录列表时一目了然。我最常用的使用\
  \ `awk` 的方式之一是通过将另一个命令的输出管道到 `awk` 来处理其输出。如果我想创建一个包含文件名和权限的自定义文件列表，我会执行这样的命令：\n\n\
  \n\n\n\n```bash\nls -l | awk '{print $NF, \" \", $1}'\n```\n\n`$NF` 是最后一个字段（即文件名，我偷懒了不想数字段个数来确定它的数字）。`$1`\
  \ 是第一个字段。`ls -l` 的输出被传递给 `awk`，由它为我进行处理。\n\n输入 `awk` 命令时请要小心。\n\n如果你在程序文件名之前忘记了\
  \ `-f` 选项，你的程序将被视为数据。\n\n如果你在命令行中编写 `awk` 程序，但将其置于数据文件名之后，它也将被视为数据。\n\n如果我将 `awk`\
  \ 脚本放入一个文件（命名为 `lser.awk`）并将其输出重定向到打印机，我将得到如下所示命令：\n\n```bash\nls -l | awk -f lser.awk\
  \ | lp\n```\n\n请参本章稍后的“实时执行”（On-the-Fly）章节，获取更多使用 `awk` 脚本处理管道数据的示例。\n\n## 处理（模式与动作）\n\
  \n每个 `awk` 语句由两部分组成：模式（pattern）和动作（action）。模式决定了何时执行动作，当然，动作是程序员希望发生的行为。如果没有模式，动作将始终执行（该模式可以被认为默认为真）。\n\
  \n有两个特殊的模式（也称为块）：`BEGIN` 和 `END`。`BEGIN` 代码在从文件中读取第一条记录之前执行，用于初始化变量和设置如控制断点等内容。`END`\
  \ 代码在到达文件末尾后执行，用于任何清理工作（例如在报告中打印最终总计）。其他模式则对从文件中读取的每条记录进行测试。\n\n通用的程序格式是将 `BEGIN`\
  \ 块放在顶部，紧接着是任何模式/动作对，最后将 `END` 块放在末尾。这并不是语言的要求，这只是大多数人的习惯做法（主要是为了可读性考虑）。\n\n###\
  \ 使用 BEGIN 和 END 的贴士\n\n`BEGIN` 和 `END` 块是可选的；如果你使用它们，每个最多一个。不要编写两个 `BEGIN` 块，也不编写两个\
  \ `END` 块。\n\n动作包含在大括号（`{ }`）中，可以由一个或多个语句组成。如果你省略模式部分，它将默认为真，这会导致对文件的每一行都执行动作。如果你省略动作，它将默认为\
  \ `$0`（打印整个记录）。\n\n模式在动作之前指定。它可以是一个正则表达式（包含在一对斜杠 `/` 之间），用于匹配输入记录的一部分，也可以是一个包含比较运算符的表达式。它也可以是由表达式和正则表达式组合而成的复合或复杂模式、范围模式。\n\
  \n## 正则表达式\n\n`awk` 使用的正则表达式与 `grep`、`egrep` 以及 UNIX 编辑器 `ed`、`ex` 和 `vi` 使用的相似。它们是用于指定和匹配字符串的符号。正则表达式由字符（如字母\
  \ `A`、`B` 或 `c`）组成，这些字符在输入中匹配自身，还包括元字符。元字符是具有特殊（元）含义的字符；它们不匹配自身，而是执行某些特殊功能。表 26.1\
  \ 显示了元字符及其行为。\n\n#### awk 中的正则表达式元字符\n\n| 元字符 | 含义 |\n| :--- | :--- |\n| `\\` |\
  \ 转义序列（下一个字符具有特殊含义，`\\n` 是换行符，`\\t` 是制表符）。任何被转义的元字符将匹配到该字符（仿佛它不是元字符）。 |\n| `^` |\
  \ 匹配字符串的开头。 |\n| `$` | 匹配字符串末尾。 |\n| `.` | 匹配任意单个字符。 |\n| `[ABC]` | 匹配 A、B 或 C 中的任意一个。\
  \ |\n| `[A-Ca-c]` | 匹配 A、B、C、a、b 或 c 中的任意一个（范围）。 |\n| `[^ABC]` | 匹配 A、B、C 以外的任何字符。\
  \ |\n| `Desk\\|Chair` | 匹配 Desk 或 Chair 中的任意一个。 |\n| `[ABC][DEF]` | 拼接。匹配 A、B 或\
  \ C 中的任意一个，后面紧跟 D、E 或 F 中的任意一个。 |\n| `*` | `[ABC]*` 匹配 A、B 或 C 的零次或多次出现。 |\n| `+`\
  \ | `[ABC]+` 匹配 A、B 或 C 的一次或多次出现。 |\n| `?` | `[ABC]?` 匹配空字符串或 A、B 或 C 中的任意一个。 |\n\
  | `()` | 组合正则表达式。例如，`(Blue\\|Black)berry` 匹配 Blueberry 或 Blackberry。 |\n\n\n\n\n\
  \n# 尝试组合\n\n所有这些模式都可以组合形成复杂的搜索字符串。\n\n典型的搜索字符串可以用于搜索特定的字符串（例如 `Report Date`）、不同格式的字符串（例如五月的不同拼写方式，如\
  \ `may`、`MAY`、`May`），或作为字符组（任何拼出五月月份的大写和小写字母组合）。这些看起来如下所示：\n\n```awk\n/Report Date/\
  \ { print \"something\" } /(may)(MAY)(May)/ { print \"something else\" } /[Mm][Aa][Yy]/\
  \ { print \"something completely different\" }\n```\n\n## 比较运算符与模式\n\nawk 使用的比较运算符与\
  \ C 语言和 UNIX Shell 中的运算符相似。它们是用于指定和比较值（包括字符串）的记法。单靠正则表达式将匹配输入记录的任何部分。通过将比较操作与正则表达式相结合，可以对特定字段进行测试。\n\
  \n表 26.2 显示了比较运算符及其行为。\n\n### 表 26.2 awk 中的比较运算符。\n\n| 运算符 | 含义 |\n| :--- | :---\
  \ |\n| `==` | 等于 |\n| `<` | 小于 |\n| `>` | 大于 |\n| `<=` | 小于或等于 |\n| `>=` | 大于或等于\
  \ |\n| `!=` | 不等于 |\n| `~` | 匹配正则表达式 |\n| `!~` | 不匹配正则表达式 |\n\n使用比较运算符可以允许你对字段执行特定的比较，而不是针对整个记录。记住，你也可以使用\
  \ `$0` 而不是特定字段对整个记录执行操作。典型的搜索字符串可以用于搜索第一个字段中的名称（`Bob`）并用正则表达式与特定字段比较：\n\n```awk\n\
  $1 == \"Bob\" { print \"Bob stuff\" } $2 ~ /(may)(MAY)(May)/ { print \"May stuff\"\
  \ } $3 !~ /[Mm][Aa][Yy]/ { print \"other May stuff\" }\n```\n\n## 复合模式运算符\n\nawk\
  \ 使用的复合模式运算符与 C 语言和 UNIX Shell 中的运算符相似。它们是将其他模式（表达式或正则表达式）组合成复杂逻辑形式的记法。\n\n表 26.3\
  \ 显示了复合模式运算符及其行为。\n\n### 表 26.3 awk 中的复合模式运算符。\n\n| 运算符 | 含义 |\n| :--- | :--- |\n\
  | `&&` | 逻辑与 |\n| `\\|` | 逻辑或 |\n| `!` | 逻辑非 |\n| `()` | 用于分组复合语句的括号 |\n\n如果你想执行某些操作（例如，如果第一个字段包含值\
  \ `Bob` 且第四字段包含值 `Street`），你可以使用如下所示的复合模式：\n\n```awk\n$1 == \"Bob\" && $4 == \"\
  Street\" {print \"message\"}\n```\n\n## 范围运算符\n\n范围模式比类型类型复杂：它在第一个模式被匹配时设置为真，并直到第二个模式变为真为止保持为真。关键在于文件需要按照范围模式匹配的字段进行排序。否则，它可能会过早设置为真或提前结束。范围模式中的各个模式由逗号（（`,`）分隔。如果你目录中有\
  \ A 到 Z 命名的 26 个文件，你可以像列表 26.2 所示显示文件的范围。\n\n```bash\nls | awk '$1 == \"B\", $1\
  \ == \"D\"'\nB C D\nls | awk '$1 == \"B\", $1 <= \"D\"'\nB ... continues\n```\n\n\
  ### 列表 26.2 续。\n\n```bash\nls | awk '$1 == \"B\", $1 > \"D\"'\nB C D E _\n```\n\n\
  第一个示例显而易见——显示了 B 和 D 之间所有的记录。其他示例不那么直观，但要记住的关键是模式在第二个条件为真时完成。第二个 `awk` 命令只显示 B，是因为\
  \ C 小于或等于 `D`（使得第二个条件为真）。第三个 `awk` 显示从 B 到 E，因为 E 是第一个大于 `D` 的项（使得第二个条件为真）。\n\n\
  ## 处理输入\n\n\n\n\n当 `awk` 读取每条记录时，它将其分解为字段，然后搜索匹配的模式以及要执行的相关操作。它假设每条记录占据一行（根据定义，换行符表示记录的结束）。仅包含空白或空（仅有换行符）的行也被视为记录，只是字段非常少（通常为零）。\n\
  \n### 流程控制\n你可以使用 `next` 语句强制 `awk` 读取文件的下一条记录（停止搜索模式匹配）。`next` 类似于 C 语言中的 `continue`\
  \ 命令，控制权返回到最外层循环。在 `awk` 中，最外层循环是自动读取文件。如果你决定完全退出程序，可以使用 `exit` 语句。`exit` 的作用就像到达了文件末尾，并将控制权传递给\
  \ `END` 块（如果存在）。如果 `exit` 位于 `END` 块中，程序将立即退出。\n\n### 字段分隔符\n默认情况下，字段由空格分隔。对于 `awk`\
  \ 来说，有一个空格还是多个空格都并不重要；当发现第一个非字符时，下一个字段便开始。你可以通过将变量 `FS` 设置为该字符来更改字段分隔符。要将字段分隔符设置为冒号（`:`），即\
  \ `/etc/passwd` 中的分隔符，请编写以下代码：\n\n```awk\nBEGIN { FS = \":\" }\n```\n\n文件的通用格式如下：\n\
  ```text\ndavid:!:207:1017:David B Horvath,CCP:/u/david:/bin/ksh\n```\n\n如果你想列出系统中所有人的姓名，请使用以下：\n\
  ```bash\ngawk --field-separator=: '{ print $5 }' /etc/passwd\n```\n你将看到所有人的名字列表。在这个示例中，我通过\
  \ `gawk` 命令行选项（`--field-separator=`）在命令行设置了字段分隔符变量（`FS`）。我也可以使用 `-F :`，所有版本的 `awk`\
  \ 都支持它。\n\n第一个字段是 `$1`，第二个是 `$2`，依此类推。整条记录包含在 `$0` 中。你可以通过引用 `$NF` 获取最后一个字段（如果你懒得数的话）。`NF`\
  \ 是记录中的字段数量。\n\n### 编写你的程序\n`awk` 的妙之处在于，除少数例外外，它像 C 语言一样是自由格式。空行会被忽略。语句可以放在同一行，也可以按你喜欢的任何形式拆。`awk`\
  \ 识别空白字符，就像 C 一样。以下两行本质上是相同的：\n\n```awk\n$1==\"Bob\"{print\"stuff\"}\n$1 == \"Bob\"\
  \ { print \"stuff\"}\n```\n\n引号内的空格是有意义，因为它们将出现在输出中或用于比较。其他空格则没有。你也可以拆分操作（但你必须将左大括号与模式放在同一行）：\n\
  \n```awk\n$1 == \"Bob\" { print \"stuff\" }\n```\n\n你可以在操作中包含多个语句。如果你将它们放在同一行，则需要使用分号（`;`）来分隔它们（这样\
  \ `awk` 就能判断一个语句何时结束，另一个何时开始）。打印多行看起来所示：\n\n```awk\n$1 == \"Bob\" { print \"Bob\
  \ stuff\"; print \"more stuff\"; print \"last stuff\"; }\n```\n\n你也可以将语句放在不同的行上。当你这样做时，就不需要编写分号，代码看起来如下：\n\
  \n```awk\n$1 == \"Bob\" {\n    print \"Bob stuff\"\n    print \"more stuff\"\n \
  \   print \"last stuff\"\n}\n```\n\n### 注释\n充分利用注释。行中井号（`#`）之后的任何内容都会被 `awk` 忽略。这些是为程序员阅读设计并帮助理解程序代码的注释；通常，程序中放置的注释越多，越容易维护。\n\
  \n个人而言，我习惯在每个语句后编写分号，因为我在 C 语言中必须这样做。对于 `awk` 来说，下面的示例与上一个相同（但你可以看到分号）：\n\n```awk\n\
  $1 == \"Bob\" {\n    print \"Bob stuff\";\n    print \"more stuff\";\n    print\
  \ \"last stuff\";\n}\n```\n\n### 操作\n程序的操作是告诉 `awk` 在匹配到模式时执行什么部分。如果没有模式，它默认为真。没有操作的模式默认为\
  \ `{print $0}`。\n\n\n\n\n# Actions\n所有动作都包含在花括号 (`{ }`) 之中。左大括号应该与模式出现在同一行；除此之外外，没有其他限制。一个动作由一个或多个动作组成。\n\
  \n# 变量\n除了简单的查找和打印类程序外，你将需要保存数据。这是通过使用变量来实现的。在 `awk` 中，有三种变量：字段变量、预定义变量和用户定义变量。你已经见过前两种的示例：`$1`\
  \ 是包含输入记录中第一个字段的字段变量，而 `FS` 是包含字段分隔符的预定义变量。\n\n### 用户定义变量\n用户定义变量是你创建的变量与其他许多许多语言不同，`awk`\
  \ 不需要要求你在在使用变量之前对其进行定义或声明。在 `C` 中，你必须声明变量所包含的数据类型（如 `int`、`float`、`char` 等）。在 `awk`\
  \ 中，你只需使用该变量。`awk` 会尝试根据变量的使用方式来确定变量中的数据。如果你在变量中放入字符数据，它会被视为字符串；如果你放入数字，它会被视为数值。\n\
  \n`awk` 还会在数据类型之间进行转换。如果你在变量中放入字符串 `123` 稍后对其进行计算，它将被视为数字。这种做法的危险在于，当你对字符串 `abc`\
  \ 进行计算时会发生什么？`awk` 会尝试将字符串转换为数字，得到转换错误，并将该值视为数值零！这种逻辑错误可能很难调试。\n\n```awk\nBEGIN\
  \ {total = 0.0; loop = 0; first_time = \"yes\";}\n```\n\n忘记像这样在 `BEGIN` 动作中初始化你的变量。像\
  \ `C` 语言一样，`awk` 要求变量以字母或下划线开头。字母可以是大写也可以是小写。变量名的其余部分由字母、数字或下划线组成。对于你自己以及任何在你离开后需要维护代码的人来说，让变量名具有意义且具有描述性会很好。虽然你可以将变量名全部写为大写，但这是一个坏习惯，因为预定义变量（如\
  \ `NF` 或 `FS`）是大大写的。将预定义变量输入为小写（例如 `nf` 或 `fs`）是一个常见的错误；`awk` 不会产生任何错误，这个错误可能很难调试。变量的行为将与正确的拼写不同，你将得预期的期的。\n\
  \n# 预定义变量\n`awk` 提供了若干预定义（也称为内置）变量。这些变量用于为你的程序提供有用数据；它们也可以用于通过将它们设置为特定值来更改 `awk`\
  \ 的默认行为。表 26.4 总结了 `awk` 中的预定义变量。早期版本的 `awk` 不支持所有的变量。\n\n### 表 26.4 awk 预定义变量\n\
  | 变量 | 含义 | 默认值（如果有） |\n| :--- | :--- | :--- |\n| `ARGC` | 命令行参数的数量 | |\n| `ARGIND`\
  \ | 当前处理文件在 `ARGV` 中的索引 | |\n| `ARGV` | 命令行参数数组 | |\n| `CONVFMT` | 数字的转换格式 | `%.6g`\
  \ |\n| `ENVIRON` | UNIX 环境变量 | |\n| `ERRNO` | UNIX 系统错误消息 | |\n| `FIELDWIDTHS` |\
  \ 以空格分隔的输入字段宽度字符串 | |\n| `FILENAME` | 当前输入文件的名称 | |\n| `FNR` | 当前记录数 | |\n| `FS`\
  \ | 输入字段分隔符 | 空格 |\n| `IGNORECASE` | 控制大小写敏感性 | 0 |\n| `NF` | 记录中的字段数 | |\n| `NR`\
  \ | 读取的记录数 | |\n| `OFMT` | 数字的输出格式 | `%.6g` |\n| `OFS` | 输出字段分隔符 | 空格 |\n| `ORS`\
  \ | 输出记录分隔符 | 换行 |\n| `RS` | 输入记录分隔符 | 换行 |\n| `RSTART` | match 函数匹配的字符串的起始位置 |\
  \ |\n| `RLENGTH` | match 函数匹配的字符串长度 | |\n| `SUBSEP` | 下标分隔符 | `\\034` |\n\n`V` 是支持变量的第一个实现。`A`\
  \ = `awk`，`N` = `nawk`，`P` = `POSIX awk`，`G` = `gawk`。\n\n`ARGC` 变量包含传递给程序的命令行参数数量。`ARGV`\
  \ 是一个包含 `ARGC` 个元素的数组，包含命令行参数本身。第一个是 `ARGV[0]`，最后一个是 `ARGV[ARGC-1]`。`ARGV[0]` 包含正在执行的命令名称\
  \ (`awk`）。`awk` 命令行选项不会出现在 `ARGV` 中——它们由 `awk` 自身解释。\n\n\n\n\n\n数字的默认转换（输入）格式存储在\
  \ `CONVFMT`（转换格式）中，默认格式字符串为 `%.6g`。有关格式字符串含义的更多信息请参见标题为 `printf` 的章节。\n\n`ENVIRON`\
  \ 变量是一个数组，包含了为你的 UNIX 会话定义的环境变量。下标是你想要获取值的环境变量的名称。\n\n如果你想让程序根据环境变量中的值执行特定的代码，可以使用以下语句：\n\
  \n```awk\nENVIRON[\"TERM\"] == \"vt100\" {print \"Working on a Video Tube!\"}\n\
  ```\n\n如果你正在使用 VT100 终端，你将获得消息 `Working on a Video Tube!`。请注意，只有在你使用字面量时，才在环境变量周围加上双引号。如果你有一个名为\
  \ `TERM` 且其包含字符串 `TERM` 的变量，则应省略双引号。\n\n如果在在重定向、读取或关闭文件期间发生系统错误，`ERRNO` 变量将包含相应的\
  \ UNIX 系统错误信息。\n\n`FIELDWIDTHS` 变量提供了一种固定长度字段的功能，而不是使用字段分隔符。要指定字段的大小，你可以将 `FIELDWIDTHS`\
  \ 设置为一个字符串，该字符串包含由空格或制表符分隔的每个字段的。设置此变量后，`gawk` 将根据指定的宽度拆分输入记录。要恢复使用字段分隔符，可以给 `FS`\
  \ 赋一个新值。\n\n`FILENAME` 变量包含当前输入文件的名称。由于命令行上可以指定不同的（甚至是多个）文件，这为你提供了确定正在处理哪个输入文件的方法。\n\
  \n`FNR` 变量包含当前记录在当前输入文件中的行数。它会在命令行指定的每个文件被重置。它包含的值始终小于或等于变量 `NR`。\n\n用于分隔字段的字符存储在变量\
  \ `FS` 中，默认值是空格。你可以通过命令行选项或在程序内部更改此变量。如果你知道你的文件将使用空格以外的某个字符作为字段分隔符（例如使用冒号的 `/etc/passwd`\
  \ 文件），你可以在程序中使用 `BEGIN` 模式来指定它。\n\n你可以通过 `IGNORECASE` 变量控制 gawk 正则表达式的大小敏感性。当设置为默认值\
  \ 0 时，模式匹配会检查正则表达式中的大小写。如果你将其设置为非零值，则会忽略大小写（字母 `A` 将匹配字母 `a`）。\n\n`NF` 变量在每个记录被读取后被设置，包含字段的数量。字段由\
  \ `FS` 或 `FIELDWIDTHS` 变量决定。\n\n`NR` 变量包含读取的记录总数。它永远不会小于 `FNR`，`FNR` 在每个文件会被重置为零。\n\
  \n数字的默认输出格式存储在 `OFMT` 中，默认格式字符串为 `%.6g`。有关格式字符串含义的更多信息请参见标题为 `printf` 的章节。\n\n输出字段分隔符包含在\
  \ `OFS` 中，默认值是空格。当你在 `print` 语句中使用逗号时，就会输出这个字符或字符串，例如如下所示：\n\n```awk\nprint $1,\
  \ $2, $3;\n```\n\n该语句打印文件的前三个字段，并用空格隔开。如果你想用冒号分隔它们（例如对于 `/etc/passwd` 文件），只需将 `OFS`\
  \ 设置为新值即可：`OFS=\":\"`。\n\n你可以通过将 `ORS` 设置为新值来更改输出记录分隔符。`ORS` 默认值为换行符（`\\n`）。\n\n\
  `match()` 函数调用匹配的任何字符串的长度存储在 `RLENGTH` 中。它与预定义变量 `RSTART` 配合使用以提取匹配字符串。\n\n你可以通过将\
  \ `RS` 设置为新值来更改输入分隔符。`RS` 默认值为换行符。\n\n更改输入字段（`$1`、`$2` 等）或输入记录（`$0`）会导致其他预定义变量发生变化。如果你原始输入记录有两个字段而你设置了\
  \ `$3=\"third one\"`，那么 `NF` 将从 2 变为 3。\n\n`SUBSEP` 变量包含用于分隔多维数组下标的值。默认值为 `\\034`，即双引号字符（`\"\
  `）。\n\n### 字符串\n\n\n\n\n\n`awk` 支持两种通用类型的变量：数值型（可以由字符 0 到 9、`+` 或 `-` 以及小数点 `.`\
  \ 组成）和字符型（可以包含任何字符）。包含字符的变量通常被称为字符串。字符字符串可以包含有效数字、单词等文本，甚至可以是格式化的电话号码。如果字符串包含有效数字，`awk`\
  \ 可以自动将其转换并像数值变量一样使用；如果你尝试将一个包含格式化电话号码的字符串作为数值变量使用，`awk` 将尝试将其转换并作为包含值为零的数值变量来使用。\n\
  \n### 字符串常量\n\n字符串常量始终包含在双引号 `\"\"` 中，长度可以从零（一个 `empty` 字符串）到多个字符。具体的最大长度随 UNIX\
  \ 版本而异；就个人而言，我从未达到过这个上限。双引号不会存储在内存中。一个典型的字符串常量可能如下：\n\n```awk\n\"Using UNIX\"\n\
  ```\n\n#### 在比较中使用字符串常量\n\n在本章之前的章节，你已经看到过字符串常量在比较和 `print` 语句中的用法。\n\n### 字符串运算符\n\
  \n实际上只有一个字符串运算符，那就是连接。你可以通过仅将多个字符串（常量或变量的任意组合）放在在一起来组合它们。列表 26.1 使用 `print` 语句实现了这一点，字符串\
  \ `:` 在输入记录（`$0`）之前。列表 26.3 显示了连接字符串的几种方法。\n\n#### 列表 26.3 连接字符串。\n\n```awk\nBEGIN{x=\"\
  abc\"; y=\"ghi\"; z=x y; z2=\"A\"x\"y\"C\"; print x, y, z, z2}\n```\n变量 `x` 设置为两个连接字符串；打印结果为\
  \ `abcdef`。变量 `y` 设置为一个字符串供变量 `z` 使用。变量 `z` 是两个变量的连接，打印为 `abcdefghi`。最后，变量 `z2`\
  \ 显示了字符串常量和变量的连接，打印为 `AabcdefghiC`。如果你在 `print` 语句中省略逗号，所有字符串将连接在一起，如下所示：\n\n```awk\n\
  abcdefabcdefghiAabcdefghiC\n```\n\n### 内置字符串函数\n\n除了这一个字符串操作（连接）之外，`awk` 还提供了许多处理字符串的函数。表\
  \ 26.5 总结了 `awk` 中的内置字符串函数。早期版本的 `awk` 不支持所有这些函数。\n\n#### 表 26.5 *awk* 内置字符串函数。\n\
  \n| 函数 | 用途 |\n| :--- | :--- |\n| `gsub(*reg*, *string*, *target*)` | 每当匹配到正则表达式\
  \ `reg` 时，就替换 `target` 字符串中的 `string` |\n| `index(*search*, *string*)` | 返回 `search`\
  \ 字符串在 `string` 中的位置 |\n| `length(*string*)` | `string` 中字符的数量 |\n| `match(*string*,\
  \ *reg*)` | 返回 `string` 中匹配正则表达式 `reg` 的位置 |\n| `printf(*format*, *variables*)`\
  \ | 根据 `format` 写入格式化数据；`variables` 是你想要的数据 |\n| `split(*string*, *store*, *delim*)`\
  \ | 根据分隔符 `delim` 将 `string` 拆分为 `store` 中的元素 |\n| `sprintf(*format*, *variables*)`\
  \ | 根据 `format` 返回一个包含格式化数据的字符串；`variables` 是你想要在字符串中的数据 |\n| ` `(*format*, *timestamp*)`\
  \ | 根据 `format` 返回格式化的日期或时间字符串；`timestamp` 是由 `systime()` 函数返回的时间 |\n| `sub(*reg*,\
  \ *string*, *target*)` | 在第一次匹配到正则表达式 `reg` 时，替换 `target` 中的 `string` |\n| `substr(*string*,\
  \ *position*, *len*)` | 返回从 `position` 开始长度为 `len` 个字符的子字符串 |\n| `tolower(*string*)`\
  \ | 返回 `string` 中的字符的等小写形式 |\n| `toupper(*string*)` | 返回 `string` 中的字符的等大写形式 |\n\
  \n`V` 是第一个支持变量的实现。`A` = `awk`，`N` = `nawk`，`P` = `POSIX awk`，以及 `G` = `gawk`。\n\n\
  \n\n\n\n## Awk 函数\n\n`index(search, string)` 函数返回 `search` 字符串在 `string` 中首次出现的位置（从左侧计数）。如果省略了\
  \ `string`，则返回 0。\n\n`length(string)` 函数返回 `string` 中字符的计数。`awk` 在内部跟踪字符串的长度。\n\n\
  `match(string, reg)` 函数确定 `string` 是否包含由 `reg` 定义的字符集。如果匹配，则返回匹配的位置，并设置变量 `RSTART`\
  \ 和 `RLENATH`。\n\n`printf(format, variables)` 函数根据 `format` 字符串将 `variables` 转换并写入格式化数据。该函数与\
  \ C 语言中的 `printf()` 函数非常相似。关于此函数和格式字符串的更多信息，请参阅本章后面标题为 `printf` 的节。\n\n`split(string,\
  \ store, delim)` 函数根据 `delim` 字符串将 `string` 分拆为数组 `store` 中的元素。返回 `store` 中元素的数量。如果省略了\
  \ `delim` 字符串，则使用 `FS`。要将一个由斜杠（/）分隔的日期拆分为其组成部分，请编写以下代码：\n\n```bash\nsplit(\"08/12/1962\"\
  , results, \"/\")\n```\n\n函数调用后，`results[1]` 包含 08，`results[2]` 包含 12，`results[3]`\
  \ 包含 1962。与 `split` 函数使用时，数组从第一个元素开始。这同样适用于包含文本的字符串。\n\n`sprintf(format, variables)`\
  \ 函数的行为与 `printf` 函数相似，但它返回结果字符串而不是写入输出。它根据 `format` 字符串将 `variables` 转换并产生格式化数据。该函数与\
  \ C 语言中的 `sprintf()` 函数非常相似。关于此函数和格式字符串的更多信息，请参阅本章后面标题为 `printf` 的节。\n\n`strftime(format,\
  \ timestamp)` 函数根据 `format` 字符串返回格式化的日期或时间；`timestamp` 是自 1970 年 1 月 1 日午夜以来的秒数。`systime`\
  \ 函数返回这种形式的值。格式与 C 语言的 `strftime()` 函数相同。\n\n`sub(reg, string, target)` 函数允许你用另一组字符替换\
  \ `string` 中第一次出现的另一个字符（以正则表达式 `reg` 的形式定义）。该函数返回替换的次数。如果省略了 `target`，则输入记录 `$0`\
  \ 为目标。这模仿了 `ed` 编辑器中的 `substitute` 命令。\n\n`substr(string, position, len)` 函数允许你根据起始位置\
  \ `position` 和长度 `len` 提取子字符串。如果省略 `len` 参数，则返回剩余字符串。\n\n`tolower(string)` 函数将 `string`\
  \ 中的大写字母转换为小写返回。任何其他字符将直接返回，不进行任何转换。\n\n`toupper(string)` 函数将 `string` 中的小写字母转换为大写返回。任何其他字符将直接返回，不进行任何转换。\n\
  \n## 特殊字符串常量\n\n`awk` 支持从键盘输入或具有特殊含义的特殊字符串常量。如果你想让双引号（\"）作为一个字符串常量（`x = \"\\\"\"\
  `），如何防止 `awk` 认为第二个（你真正想要的那个）是字符串的结束？答案是使用转义，或者告诉 `awk` 下一个字符具有特殊含义。这是通过与 UNIX 其他部分相同的反斜杠（\\\
  ）字符实现的。表 26.6 显示了 `awk` 支持的大多数常量。\n\n### 表 26.6 awk 特殊字符串常量\n\n| 表达式 | 意义 |\n| :---\
  \ | :--- |\n| `\\\\` | 包含反斜杠的意思 |\n| `\\a` | 警报或铃声字符 |\n| `\\b` | 退格 |\n| `\\f`\
  \ | 换页 |\n| `\\n` | 换行符 |\n| `\\r` | 回车 |\n| `\\t` | 制表符 |\n| `\\v` | 垂直制表符 |\n\
  | `\\\"` | 双引号 |\n| `\\xNN` | 表示 `NN` 是十六进制数 |\n| `\\0NNN` | 表示 `NNN` 是八进制数 |\n\n\
  ## 数组\n\n当你有多个相关数据时，你有两个选择：创建多个变量，或者使用数组。数组允许你将一组相关数据保留在一起。你通过在方括号（[]）中包含下标来访问数组中的单个元素。通常，你可以在任何可以使用普通变量的地方使用数组元素。`awk`\
  \ 中的数组具有大多数其他语言缺乏的特殊能力：它们是动态的；稀疏的；而且下标实际上是字符串。你不需要声明一个变量为数组，也不需要在第一次使用元素时定义最大元素数量，它是动态创建的。因为这样，最初不会分配内存块；在标准的编程实践中，如果你想累积一年中每月的额，将分配\
  \ 12 个元素，即使你目前只处理十二月。`awk` 数组是稀疏的；如果你正在处理十二月，那么只有该元素会存在，而其他 11 个（空）月份不存在。\n\n\n\n\
  \n\n根据我的经验，最后一种能力是最用的：下标可以是字符串。在大多数编程语言中，如果你想根据字符串累积数据（例如按州或国家计算销售总额），你需要两个数组：州或国家名称（字符串）和数值销售数组。你需要搜索州或国家名称以找到匹配项，然后使用销售数组中的相同元素。`awk`\
  \ 会替你完成这些工作。你可以使用州或国家名称作为下标在销售数组中创建一个元素，并像下面一样直接访问：\n\n```\ntotal_sales[\"Pennsylvania\"\
  ] = 10.15\n```\n\n然而，`awk` 并不直接支持多维数组。\n\n## 数组函数\n\n从 `nawk` 开始的 `awk` 版本提供了几个专门用于数组的函数：`in`\
  \ 和 `delete`。`in` 函数测试元素是否在数组中。`delete` 函数用于从数组中删除元素。\n\n如果你有一个以州为下标的数组，并想确定某个州是否在列表中，可以将以下内容放入条件测试中（关于条件测试的更多信息，请参见“条件流”章节）：\n\
  \n```\n\"Delaware\" in total_sales\n```\n\n你还可以在循环中使用 `in` 函数来遍历数组中的元素（特别是当数组是稀疏或关联数组时）。这是\
  \ `for` 循环的一种特殊情况，在 `for` 语句章节中有描述。\n\n要删除数组元素（例如特拉华州），你可以编写以下代码：\n\n```bash\ndelete\
  \ total_sales[\"Delaware\"]\n```\n\n当数组元素被删除时，它已从内存中移除。该数据将不再可用。在完成对元素的使用后，删除数组元素或整个数组是一个良好的习惯。虽然内存很便宜且容量充足（特别是使用虚拟内存的情况下），但如果不清理，你最终会耗尽内存。\n\
  \n你不能一条语句删除数组中的所有元素。你必须遍历所有元素并逐个删除。你不能直接删除整个数组；以下操作是无效：\n\n```\ndelete total_sales\n\
  ```\n\n## 多维数组\n\n尽管 `awk` 不直接支持多维数组，但它提供了一种模拟这些数组的机制。对于程序员来说，这种区别非常微不足道。你可以以 C\
  \ 程序员熟悉的格式（方括号内）指定多个维度：\n\n```\narray[5,3] = \"Mary\"\n```\n\n这被存储在一个单维数组中，下标实际上存储为\
  \ `5SUBSEP3` 的形式。预定义变量 `SUBSEP` 包含下标组件的分隔符值。它默认是双引号，因为下标本身不太可能出现引号。记住，引号用于包含字符串；它们本身不会作为字符串的一部分被存储。如果你需要在多维数组下标中使用引号字符，则可以随时更改\
  \ `SUBSEP`。\n\n如果你想按城市和州（或国家）计算销售总额，你将使用一个二维数组：\n\n```\ntotal_sales[\"Philadelphia\"\
  ,\"Pennsylvania\"] = 10.15\n```\n\n你可以在条件语句中使用 `in` 函数：\n\n```\n(\"Wilmington\"\
  ,\"Delaware\") in total_sales\n```\n\n你还可以在循环中使用 `in` 函数来遍历不同的城市。\n\n## 内置数值函数\n\
  \n`awk` 提供了许多用于计算特殊数值的数值函数。表 26.7 总结了 `awk` 中的内置数值函数。早期版本的 `awk` 不支持所有这些函数。\n\n\n\
  \n\n\n### 表 26.7 `awk` 内置数值函数\n\n| V | 函数 | 目的 |\n| :--- | :--- | :--- |\n| A |\
  \ `atan2(x, y)` | 返回 `y/x` 弧度值的反正切值 |\n| N | `cos(x)` | 返回 `x` 弧度值的余弦 |\n| A | `exp(x)`\
  \ | 返回 `e` 的 `x` 次方 |\n| A | `int(x)` | 返回截断为整数的 `x` |\n| A | `log(x)` | 返回 `x`\
  \ 的自然对数 |\n| N | `rand()` | 返回 0 到 1 之间的随机数 |\n| N | `sin(x)` | 返回 `x` 弧度值的正弦 |\n\
  | A | `sqrt(x)` | 返回 `x` 的平方根 |\n| A | `srand(x)` | 初始化（种子）随机数生成器；如果省略 `x`，则使用 `systime()`\
  \ |\n| G | `systime()` | 返回自 1970 年 1 月 1 日午夜以来的当前秒数 |\n\nV 是支持变量的第一种实现。`A` = `awk`，`N`\
  \ = `nawk`，`P` = `POSIX awk`，`G` = `gawk`。\n\n### 算术运算符\n\n`awk` 支持多种数学运算。表 26.8\
  \ 汇总了这些运算符。\n\n### 表 26.8 `awk` 算术运算符\n\n| 运算符 | 目的 |\n| :--- | :--- |\n| `x^y`\
  \ | 将 `x` 升幂 `y` 次 |\n| `x**y` | 将 `x` 升幂 `y` 次（与 `x^y` 相同） |\n| `x%y` | 计算 `x/y`\
  \ 的余数（模） |\n| `x+y` | 将 `x` 加到 `y` |\n| `x-y` | 从 `x` 中减去 `y` |\n| `x*y` | `x` 乘以\
  \ `y` |\n| `x/y` | `x` 除以 `y` |\n| `-y` | 取 `y` 的反数（切换 `y` 的符号）；也称为单元负 |\n| `++y`\
  \ | 将 `y` 加 1（前缀增） |\n| `y++` | 使用 `y` 的值然后加 1（后置增） |\n| `--y` | 将 `y` 减 1（前缀减）\
  \ |\n| `y--` | 使用 `y` 的值然后减 1（后置减） |\n| `x=y` | 将 `y` 的值赋予 `x`。`awk` 也支持运算符赋值（`+=`,\
  \ `-=`, `*=`, `%=`, `^=`, `**`） |\n\n`awk` 中的所有数学计算均使用浮点数（即使你将其视为整数）。\n\n### 条件流\n\
  \n从本质上讲，`awk` 程序中的动作是有条件的。如果其模式为真，则执行该动作。你也可以通过使用 `if` 语句让条件程序在动作内部流转。\n\n`if` 语句的一般流程如下：\n\
  \n```\nif (condition)\n    为真时执行的语句\nelse\n    为假时执行的语句\n```\n\n`condition` 可以是表\
  \ 26.2 和 26.3 中所示任何有效模式组合。`else` 是可选的。如果你有多个语句要执行，需要将语句封装在大括号（`{ }`）内，就像 C 语法一样。\n\
  \n你也可以根据需要堆叠 `if` 和 `else` 语句：\n\n```\nif (\"Pennsylvania\" in total_sales)\n  \
  \  print \"我们有宾夕法尼亚的数据\"\nelse if (\"Delaware\" in total_sales)\n    print \"我们有特拉华的数据\"\
  \nelse if (current_year < 2010)\n    print \"天王星仍然是一个行星\"\nelse\n    print \"没有一个条件被满足。\"\
  \n```\n\n### 空语句\n\n根据定义，`if` 需要一个（或多个）语句来执行；在某些情况下，逻辑可能非常直接，即你想执行的代码在条件为假时发生。当反转逻辑以在条件为真时执行代码变得困难或难看时，我使用了这种方法。\n\
  \n解决这个问题的办法很简单：只需使用空语句，即分号（`;`）。空语句满足了 `if` 执行所需的语法要求；它只是什么都不做。\n\n你的代码看起来会像下面：\n\
  \n```\nif (($1 <= 5 && $2 > 3) || ($1 > 7 && $2 < 2)) ;    # 空语句\nelse\n    我真正想要执行的代码\n\
  ```\n\n### 条件运算符\n\n`awk` 有一个运算符实际上有三个参数：条件运算符。该运算符允许你在代码的任何地方应用 if-测试。\n\n条件语句的一般格式如下：\n\
  \n```\ncondition ? 真-结果 : 假-结果\n```\n\n尽管这看起来像是 `if` 语句的重复，但它可以让你的代码更易于读。如果你有一个由员工姓名和请假天数组成的数据文件，你可以使用以下内容：\n\
  \n\n\n\n\n```awk\n{ print $1, \"has taken\", $2, $2 != 1 ? \"s\" : \"\", \"of ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)sick\
  \ time\" }\n```\n\n如果员工只请了一天病假，该命令将输出“day；如果员工请了零天或多于一天的病假，则输出“days”。生成的句子更具可读性。使用\
  \ `if` 语句编写相同的示例会更复杂，且如下所示：\n\n```awk\nif ($2 != 1)\n    print $1, \"has taken\"\
  , $2, \"days of sick time\"\nelse\n    print $1, \"has taken\", $2, \"day of sick\
  \ time\"\n```\n\n### 循环\n\n从本质上说，`awk` 程序是一个大循环，它读取输入文件中的每条记录并处理相应的模式和动作。在动作内部，经常会有重复的需求。`awk`\
  \ 通过 `do`、`for` 和 `while` 语句支持循环，这些语句与 C 语言中的语句相似。\n\n注意块语句（大括号）。\n\n在条件语句和循环语句中，忘记给多条语句加上大括号是一个常见的编程错误。与\
  \ `if` 语句一样，如果你想在循环中执行多条语句，必须将它们包含在大括号中。\n\n### do 语句\n\n`do` 语句提供了一个至少执行一次的循环结构。条件或测试在循环内容执行完毕后进行。\n\
  \n#### do do while\n\n`do` 语句有时也被称为 `do while` 语句。它的形式如下：\n\n```awk\ndo statement\
  \ while (condition)\n```\n\n`statement` 可以是一条语句，也可以是包含在大括号中的多条语句。`condition` 是任何有效的测试，类似于在\
  \ `if` 语句中使用的测试。通常，你必须在循环内部更改条件中变量的值。如果不这样做，你将陷入死循环，因为测试结果永远不会改变（也就不会变为假）。\n\n###\
  \ 循环控制 (break 和 continue)\n\n如果你需要，可以提前退出循环（而无需给条件中的变量分配某个虚假值）。`awk` 提供了两种实现方法：`break`\
  \ 和 `continue`。\n\n- `break` 导致退出最内层循环。它的行为就像测试立即判定为假一样。循环中 `break` 之后的剩余代码都不会执行。这在你需要尽早处理某些错误时非常有用。\n\
  - `continue` 导致当前循环返回测试阶段。循环中 `continue` 之后的剩余代码都不会执行。这在你有某些想要暂时跳过的代码时非常有用。\n\n\
  ### for 语句\n\n`for` 语句适用于对项目进行计数。它有两种通用形式：\n\n```awk\nfor (loop = 0; loop < 10;\
  \ loop++) statement\nfor (subscript in array) statement\n```\n\n第一种形式初始化变量（`loop\
  \ = 0`），执行测试（`loop < 10`），然后执行循环内容（`statement`）。随后修改变量（`loop++`）并再次测试。只要测试为真，`statement`\
  \ 就会执行。\n\n\n\n\n\n你可以使用许多不同的方法修改循环控制变量。这里展示了自增运算符（`loop++`），因为它是最常用的运算符（例如，用于遍历数组）。任何有效操作都可以此处此处，甚至是像这样的操作：`loop\
  \ = loop * 2 + another_variable`。\n\n在第二种形式中，`statement` 在执行时，下标 `subscript` 会被设置为\
  \ `array` 中的每一个下标。这使得你即使在不知道下标值的情况下，也能遍历数组。这对于多维数组非常有效。\n\n`statement` 可以是一条语句，也可以是用大括号括起来的多个语句。条件\
  \ `(loop < 10)` 是任何有效的测试，类似于在 `if` 语句中使用的测试或用于触发动作的模式。\n\n第 700 页\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n### 注意事项\n\n通常情况下，你不希望在循环体内修改循环控制变量（`loop` 或 `subscript`）。让 `for` 语句为你完成这项工作，否则你可能会得到难以调试的行为。\n\
  \n对于第一种形式，变量的修改可以是任何有效操作（包括函数调用）。在大多数情况下，它是自增或自减。\n\n`for` 循环是遍历未知大小数据的好方法：\n\n\
  ```awk\nfor (i=1; i<=NF; i++) print $i\n```\n\n当前记录中的每个字段都将单独打印在一行。作为程序员，我编写代码时并不知道记录中有多少个字段。变量\
  \ `NF` 会会在程序运行时告诉我结果。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n后置还是前置？\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n这个示例展示了后置自增。无论使用后置（`loop++`）还是前置（`++loop`），结果都是样的。只需保持一致即可。\n\n### while 语句\n\n\
  最后的循环结构是 `while` 循环。它是最通用的，因为只要条件为真它就会执行。其通用形式如下：\n\n```awk\nwhile(condition) statement\n\
  ```\n\n`statement` 可以是一条语句，也可以是用大括号括起来的多个语句。`condition` 是任何有效的测试，类似于在 `if` 语句中使用的测试或用于触发动作的模式。\n\
  \n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n#### 修改条件的值\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n通常，你必须在循环内修改条件中变量的值。如果不这样做，你将陷入无限循环，因为测试（`condition`）永远不会改变（变为变为假）。如果在遇到 `while`\
  \ 之前条件为假，则循环的内容将不会执行。这与 `do` 不同，`do` 至少会执行循环一次。\n\n#### 高级输入输出\n\n除了 `awk` 提供的简单输入输出外，你可以利用许多高级功能进行更复杂的处理。默认情况下，`awk`\
  \ 会自动读取并遍历你的程序；你可以更改这种行为。你可以强制输入来自不同的文件，导致循环提前回收（不执行任何动作就读取下一记录），甚至读取下一记录。你甚至可以从其他命令的输出中获取数据。\n\
  \n第 701 页\n\n在输出端，你可以格式化输出并将其发送到文件（标准输出设备以外）或作为另一个命令的输入。\n\n##### 输入\n\n你不需要在 `awk`\
  \ 中编写标准的输入循环过程。它读取记录，然后搜索模式匹配并执行相应的动作。如果在命令行上指定了多个文件，它们将按顺序处理。只有在你想要改变这种行为时，才需要进行任何特殊的编程。\n\
  \n#### next 和 exit\n\n`next` 命令会导致 `awk` 立即读取下一记录并执行模式匹配和相应的动作执行。通常情况下，它会执行你任何匹配模式的动作中的所有代码。`next`\
  \ 会导致忽略此记录的任何额外的匹配模式。\n\n\n\n\n\n在除 `END` 之外的任何动作中，`exit` 命令的行为就像到达了文件末尾。所有模式/动作中的代码执行将停止，并执行\
  \ `END` 模式中的动作。在 `END` 模式中出现的 `exit` 是一个特殊情况；它会导致程序结束。\n\n## getline\n\n`getline`\
  \ 语句用于显式地读取一条记录。如果你有一个看起来像两个物理记录的数据记录，这种方法会特别有用。它会执行标准的字段拆分（设置 `$0`、字段变量、`FNR`、`NF`\
  \ 和 `NR`）。如果读取成功，返回值 `1`；如果失败，返回零（到达文件末尾）。如果你想显式地读取整个文件，可以编写如下代码：\n\n```\n{ while\
  \ (getline == 1)  {\n    # 处理输入的字段\n}\n}\n```\n\n你还可以使用 `getline *variable` 的形式让\
  \ `getline` 将输入数据存储在字段中，而不是利用标准的字段处理。当这样使用时，`NF` 被设置为 0，而 `FNR` 和 `NR` 会加 1。\n\n\
  ### 从文件输入\n\n你可以使用 `getline` 从特定文件输入数据，而不是命令行列出的文件。通用形式为 `getline < *filename`。当这样编写代码时，`getline`\
  \ 会执行标准的字段拆分（设置 `$0`、字段变量和 `NF`）。如果文件不存在，`getline` 返回 `-1`；成功返回 `1`，失败返回 `0`。\n\n\
  ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n如果你使用 `getline > \"filename\"` 将数据读取到程序中，`FNR` 和 `NR` 都不会改变。\n\n你可以将数据从指定文件读取到变量中。你也可以将\
  \ `filename` 替换为 `stdin` 或包含文件名的变量。\n\n### 从命令输入\n\n使用 `getline` 语句的另一种方法是接受 UNIX\
  \ 命令的输入。如果你想对系统中的每个人执行某些处理（例如，向他或她发送一条消息），可以编写如下代码：\n\n```\nwhile (\"who -u\" getline)\
  \ {\n    # 处理来自 who 命令的每一行\n}\n```\n\n`who` 命令只执行一次，它的每一行都由 `getline` 处理。你也可以使用\
  \ `getline variable` 的形式。\n\n### 结束文件或命令\n\n每当你使用 `getline` 从指定的文件或命令获取输入时，在处理完数据后应该将其关闭。awk\
  \ 允许打开的文件数量有一个最大限制；这个数字随操作系统的配置而异（命令输出被视为一个文件）。在用完文件后关闭它们，可以减少达到限制的概率。\n\n关闭文件的语法如下：\n\
  \n```\nclose(\"*filename\")\n```\n\n`filename` 是在 `getline` 中指定的（它也可以是 `stdin`、包含文件名的变量，或与\
  \ `getline` 使用的精确命令）。\n\n## 输出\n\n输出有几个高级功能：格式化输出、将输出发送到文件以及将输出作为其他命令的输入进行管道。`printf`\
  \ 命令用于格式化输出，而不是查看 awk 决定使用的任何默认格式（那种格式通常很难看），你可以指定它的外观。\n\n### 格式化输出 (printf)\n\n\
  `print` 语句为你生成简单的输出。如果你希望能够对数据进行格式化（例如产生固定列），你需要使用 `printf`。`printf` 的优点是它使用的语法与\
  \ C 语言中的 `printf()` 函数非常相似。`printf` 的通用格式如下所示（只有在包含表达式时才需要括号）：\n\n```\nprintf(format-specifier,\
  \ variable1, variable2, ..., variableN)\n```\n\n变量是可选的，但 `format-specifier` 是强制的。经常会有包含\
  \ `format-specifier` 的 `printf` 语句（用于打印不变量的消息）：\n\n```\nprintf(\"Program Starting\\\
  n\") printf(\"\\f\")  # 输出换页\n```\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n习惯使然\n\n\n\n\n个人而言，我使用第二种，因为我习惯了用 C 语言编码。\n\n`format-specifier` 可以由文本、转义字符或实际的打印说明符组成。说明符以百分号（`%`）开头，后面跟着一个可选的数值用于指定字段大小，然后是格式类型（描述变量类型或输出格式）。如果你想在输出中打印百分号，则使用\
  \ `%%`。\n\n字段大小可以由两个用小数点（`.`）隔开的数字组成。对于浮点数，第一个数字是整个字段的大小（包括小数点）；第二个数字是小数点右侧的位数。对于其他类型的字段，第一个数字是最小字段大小，第二个数字是最大字段大小（实际打印的字符数）；如果你省略了第一个数字，它将取最大字段大小的值。\n\
  \n打印说明符决定了变量的打印方式；还有修饰符可以改变说明符的行为。表 26.9 显示了打印格式说明符。\n\n### 表 26.9 `awk` 的格式说明符。\n\
  \n| 格式 | 含义 |\n| :--- | :--- |\n| `%c` | ASCII 字符 |\n| `%d` | 整数（十进制） |\n| `%i`\
  \ | 整数，与 `%d` 相同 |\n| `%e` | 使用科学计数法的浮点数 (1.00000E+01) |\n| `%f` | 浮点数 (10.43) |\n\
  | `%g` | `awk` 在 `%e` 或 `%f` 显示格式之间选择（较短的那个），并抑制不重要的零 |\n| `%o` | 无符号八进制（基 8）数（整数）\
  \ |\n| `%s` | 字符串 |\n| `%x` | 无符号十六进制（基 16）数（整数） |\n| `%X` | 与 `%x` 相同，但使用 ABCDEF\
  \ 代替 abcdef |\n\n如果你尝试使用 `%c` 打印数值，它将作为字符打印（该值对应的 ASCII 字符）。\n\n修饰符改变说明符的默认行为。列表\
  \ 26.4 显示了各种说明符和修饰符的使用。\n\n### 列表 26.4 `printf` 格式说明符和修饰符。\n\n```c\nprintf(\"%d\
  \ %3.3d %03.3d %.3d %-.3d %3d %-3d\\n\", 64, 64, 64, 64, 64, 64, 64)\nprintf(\"\
  %c %c %2.2c %-2.2c %2c %-2c\\n\", 64, \"abc\", \"abc\", \"abc\", \"abc\", \"abc\"\
  )\nprintf(\"%s %2s %-2s %2.2s %-2.2s %.2s %-.2s\\n\", \"abc\", \"abc\", \"abc\"\
  , \"abc\", \"abc\", \"abc\", \"abc\")\nprintf(\"%f %6.1f %06.1f %.1f %-.1f %6f\\\
  n\", 123.456, 123.456, 123.456, 123.456, 123.456, 123.456)\n```\n**输出：**\n```\n\
  64   64  064  64 -64   64  64\n@  a  a  a   a  a\nabc abc abc ab  ab ab ab\n123.456000\
  \  123.5 0123.5 123.5 123.5 123.456000\n```\n\n- 使用整数或十进制（`%d`）说明符时，字段大小默认为所打印值的大小（数值\
  \ 64 为两个数字）。如果你指定的字段大小比该值大，则会自动获得填充字段。所有数值字段都是右对齐的，除非你使用减号（`-`）修饰符，该符号会导致其变为左对齐。如果你只指定了字段大小并希望填充字段剩余部分，必须使用零修饰符（在字段最小大小之前）。\n\
  - 使用字符（`%c`）说明符时，无论你使用的字段最小或最大大小是多少，无论值包含多少字符，都只从输入中打印一个字符。注意，作为字符打印的值 64 显示为 `@`。\n\
  - 使用字符串（`%s`）说明符时，除非你指定了字段最大值，否则将打印整个字符串。默认情况下，字符串是左对齐的，除非你使用减号（`-`）修饰符，该符号会导致其变为右对齐。\n\
  - 使用浮点（`%f`）说明符时，字段大小默认为 .6（小数点左侧和右侧各 6 位）。如果你在格式的小数后指定数字，则小数点右侧将打印相应位数且`awk` 会对数字进行四舍五入。所有数值字段都是右对齐的，除非你使用减号（`-`）修饰符，该符号会导致变为左对齐。如果你希望字段零填充，必须使用零修饰符（在字段最小大小之前）。\n\
  \n### 输出到文件\n\n你可以将输出（来自 `print` 或 `printf`）发送到文件。以下操作创建一个新文件（或清空现有文件），其中包含打印的消息：\n\
  \n```bash\nprintf(\"hello world\\n\") > \"datafile\"\n```\n\n如果你多次执行此语句或其他重定向输出到\
  \ `datafile` 的语句，输出将保留在文件中。文件的创建/清空仅在程序第一次使用该文件时发生。\n\n\n\n\n要向现有文件追加数据，你需使用以下命令：\n\
  \n```bash\nprintf (\"hello world\\n\") >> \"datafile\"\n```\n\n### 输出到命令\n\n除了将输出重定向到文件外，你还可以将程序的输出作为另一个命令的输入。你可以编写类似如下的代码：\n\
  \n```bash\nprintf (\"hello world\\n\") | \"sort -t`\n```\n\n任何其他将数据管道到同一命令的输出语句，在管道符（`|`）之后都会指定完全相同的命令，因为\
  \ `awk` 正通过这种方式跟踪哪个命令正在接收来自你程序的哪些输出。\n\n### 关闭输出文件或管道\n\n每当你将输出发送到文件或管道时，都应该在处理完数据后将其关闭。`awk`\
  \ 允许打开的文件数有一个上限。这个数字随操作系统版本或个人账户配置而异（管道被视为一个文件）。通过在完成工作后关闭文件，可以减少达到限制的几率。\n\n关闭文件的语法如下：\n\
  \n```bash\nclose(\"filename\")\n```\n\n`filename` 是输出语句中指定的名称（也可以是 `stdout`、包含文件名的变量，或与管道一起使用的精确命令）。\n\
  \n### 函数\n\n除了内置函数（如 `gsub` 或 `srand`），你还可以编写自己的函数。用户定义函数是创建在代码中多处访问的代码块的手段。它们还可以用于构建一个常用例程的库，这样你就不必重复编写相同的算法。\n\
  \n用户定义函数不是原始 `awk` 的一部分；它们被添加到 `nawk` 中并在较新版本中得到了支持。使用函数包含两个部分：定义和调用。函数定义包含要执行的代码（函数本身），而调用则将执行从主代码临时转移到函数。命令执行通过两种方式传回主代码：隐式返回和显式返回。当\
  \ `awk` 到达函数末尾（右大括号 `}`）时，它会自动（隐式地）将控制权返回给调用例程。如果你想在底部之前离开函数，可以显式地使用 `return` 语句提前退出。\n\
  \n#### 函数定义\n\n`awk` 函数定义的通用形式如下：\n\n```awk\nfunctionname(parameter list) { the\
  \ function body }\n```\n\n你编写函数的方式就像编写任何其他动作集一样，并将其放置在任何可以放置模式/动作集的地方。如果你仔细考虑，定义中的\
  \ `functionname(parameter list)` 部分可以被视为一种模式，而 `function body` 可以被视为动作。\n\n`gawk`\
  \ 支持另一种函数定义形式，其中 `function` 关键字缩写为 `func`。其余语法相同。\n\n使用用户定义变量时要加小心。在使用用户定义函数时，调用时必须在函数名后立即紧跟包含参数列表的括号。当你使用内置函数时，这并不是强制要求的。\n\
  \n#### 26.5 定义和调用函数\n\n```awk\nBEGIN { print_header() }\n\nfunction print_header()\
  \ {\n    printf(\"This is the header\\n\");\n    printf(\"this is a second line\
  \ of the header\\n\");\n}\n```\n\n\n\n\n函数内部的代码仅在从 `BEGIN` 动作调用该函数时执行一次。该函数使用了隐式返回方法。\n\
  \n## 函数参数\n\n与 C 语言一样，`awk` 通过值传递参数给函数。换句话说，它会创建原始值的副本并将副本传递给被调函数。即使函数更改了该值，原始值也会保持不变。\n\
  \n任何参数都在函数定义中列出并用逗号分隔。如果你没有参数，可以留参数列表（括号内）为空。\n\n列表 26.6 是列表 26.5 的扩展版本；它展示了 `awk`\
  \ 函数参数的值传递特性。\n\n### 列表 26.6 传递参数。\n\n```awk\nBEGIN {\n    pageno = 0;\n    print_header(pageno);\n\
  \    printf(\"the page number is now %d\\n\", pageno);\n}\n\nfunction print_header(page)\
  \ {\n    page++;\n    printf(\"This is the header for page %d\\n\", page);\n   \
  \ printf(\"this is a second line of the header\\n\");\n}\n```\n输出:\nThis is the\
  \ header for page 1\nthis is a second line of the header\nthe page number is now\
  \ 0\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n`awk` 不执行参数验证。\n\n当你调用函数时，列出的参数可以比预期的多或少。任何多余的参数会被忽略，任何缺失的参数默认为零或空字符串（取决于如何使用）。页码在第一次调用\
  \ `print_header` 之前初始化，并在函数内部递增。在函数调用后打印时，它仍然保持原始值。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n你可以利用缺乏函数参数验证的特点。它可以被用来在被调函数内部创建局部变量，即在函数定义中列出的变量比函数调用中使用的变量多。我强烈建议注释说明这些额外的参数实际上被用作局部变量。\n\
  \n被调函数有几种方法可以通过显式返回或直接使用调用程序中的变量来调用程序中的变量（这些变量通常已经是全局变量）。\n\n## 函数的显式返回（return 语句）\n\
  \n如果你想返回一个值或提前退出函数，需要编写一个 `return` 语句。如果你没有编写，函数将在右大括号（`}`）处结束。我个人倾向于将它们写在底部。\n\n\
  如果调用代码期望从你的函数获取返回值，你必须以以下格式编写 `return` 语句：\n\n`return variable`\n\n扩展列表 26.6 以允许函数更改页码，列表\
  \ 26.7 展示了 `return` 语句的使用。\n\n### 列表 26.7 返回值。\n\n```awk\nBEGIN {\n    pageno =\
  \ 0;\n    pageno = print_header(pageno);\n    printf(\"the page number is now %d\\\
  n\", pageno);\n}\n\nfunction print_header(page) {\n    page++;\n    printf(\"This\
  \ is the header for page %d\\n\", page);\n    printf(\"this is a second line of\
  \ the header\\n\");\n    return page;\n}\n```\n输出:\nThis is the header for page\
  \ 1\nthis is a second line of the header\nthe page number is now 1\n\n更新后的页码被返回给调用函数的代码。\n\
  \n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n`return` 语句允许你仅向调用程序返回一个值。\n\n## 编写报告\n\n在 `awk` 中生成报告涉及一系列步骤，每一步都为下一步产生输入。编写报告通常是一个三步过程：选取数据、排序数据以及美化输出。\n\
  \n\n\n\n\n# 复杂报告\n\n使用 `awk` 可以快速创建复杂的报告。相比于用其他语言（如 `C`）编写，进行字符串比较、动态构建数组以及利用关联数组要容易得多。不需要在数组中搜索与文本键匹配的项，而是可以将该键直接作为数组的下标。\n\
  \n我曾使用 `awk` 生成过具有三级控制间符（control breaks）的报告，同一个控制间符内包含多个报告部分，并有多个汇总页。每个级别的控制符都有一个汇总页，最后再加上一个总页；如果某个控制符没有特定类型的数据，则汇总页也不会包含该数据。如果某个控制符只有一个成员，则不会创建该级别的汇总页。（这在实际上只有一层控制符——即最高层——时节省了大量的纸张。）\n\
  \n该报告最终包含了超过 1000 行 `awk`（具体来说是 `nawk`）代码。它的运行时间比同等的 `C` 程序稍长，但创建它花费的程序员时间少得多。因为它容易创建和修改，所以我通过原型设计进行开发。用户简要描述他们想要的内容，我生成报告。他们决定需要更多的控制间符，于是我添加了它们；接着他们意识到汇总页上浪费了大量纸张，因此按照描述对报告进行了修改。\n\
  \n## 响应用户变化\n\n在未知最终结果的情况下进行增量式开发，这让我觉得更容易也更有趣。通过对用户变化做出响应，用户非常开心！\n\n## 提取数据\n\n\
  正如本章开头提到的，许多系统并不产生所需格式的数据。在处理存储在关系型数据库中的数据时，有两种提取数据的方法：使用带有 `SQL` 的查询工具，或者编写一个程序从数据库获取数据并以所需的格式输出。`SQL`\
  \ 查询工具的格式化能力有限，但可以提供快速方便的数据访问访问。\n\n我发现的一种非常有用的技术是将数据从数据库提取到文件中，然后通过 `awk` 脚本对文件进行处理，以生成所需的精确格式。需要时，`awk`\
  \ 脚本甚至可以创建用于查询数据库的 `SQL` 语句（指定要选择的行的键值）。当查询工具在数值字段前放置一个空格，而某个要在其他系统中使用该数据的程序（如 `COBOL`）必须移除该空格时，可以使用以下示例：\n\
  \n```\n{ printf(\"%s%s%-25.25s\\n\", $1,$2,$3);}\n```\n当 `awk` 将输入记录拆分为单独字段时，它会自动移除字段分隔符（空格字符），且\
  \ `printf` 中的格式化字符串说明符是连续的（它们之间没有任何空格）。\n\n## 动态生成命令\n\n将一个命令的输出管道到另一个命令的能力非常强大，因为第一个命令的输出变成了第二个命令可以处理的输入。单行\
  \ `awk` 程序的一个频繁用法是列表创建命令。`find` 命令可以产生符合其条件的文件列表，或者它可以执行一个接受单个命令行参数的单一命令。你可以通过以下命令查看目录（及子目录）中符合特定条件的文件：\n\
  \n```\n$ find . -name \"*.prn\" -print\n./exam2.prn ./exam1.prn ./exam3.prn\n```\n\
  \n或者通过以下命令打印这些文件的内容：\n\n```\nfind . -name \"*.prn\" -exec lp \\;\n```\n\n`find`\
  \ 命令会将单独的文件名插入 `{}` 位置并执行命令。如果你想执行一个需要两个参数的命令，或者执行多个命令，仅通过 `find` 是无法实现的。你可以创建一个接受单个参数并在多处使用的\
  \ Shell 脚本，或者创建一个单行的 `awk` 程序：\n\n```\n$ find . -name \"*.prn\" -print | awk '{print\
  \ \"echo bak \" $1; print \"cp \" $1 \" \" $1\".bak\"}'\necho bak ./exam2.prn\n\
  cp ./exam2.prn ./exam2.prn.bak\necho bak ./exam1.prn\ncp ./exam1.prn ./exam1.prn.bak\n\
  echo bak ./exam3.prn\ncp ./exam3.prn ./exam3.prn.bak\n```\n\n为了让命令实际执行，你需要将这些命令管道到其中一个\
  \ Shell 中。以下示例使用了 Korn Shell；你可以使用你喜欢的任何：\n\n```\n$ find . -name \"*.prn\" -print\
  \ | awk '{print \"echo bak \" $1; print \"cp \" $1 \" \" $1\".bak\"}' | ksh\n```\n\
  \n\n\n\n在每次复制发生之前，都会显示消息。如果你想在多个子目录的文件中搜索字符串（使用 `grep` 命令），这也会非常方便。许多版本的 `grep`\
  \ 命令不会显示所搜索的文件名，除非你使用通配符（或在命令行上指定了多个文件名）。以下示例了如何使用 `find` 搜索 C 源文件，使用 `awk` 创建 `grep`\
  \ 命令来查找错误信息，并使用 shell 的 `echo` 命令来显示正在搜索的文件：\n\n```bash\nfind . -name \"*.c\" -print\
  \ | awk '{print \"echo \" $1; print \"grep error-message \" $1;}'\n```\n\n同样的技术可以用于对一系列子目录中的源代码进行\
  \ lint 检查。我定期在 shell 脚本中执行以下命令来检查所有的 C 代码：\n\n```bash\nfind . -name \"*.c\" -print\
  \ | awk '{print \"lint \" $1 \" > \" $1\".lint\"}'\n```\n\n某个系统上的 lint 版本会将代码错误作为标题行打印，然后将问题的代码以列表的形式列在下方。`grep`\
  \ 显示标题，但不会显示详细行。`awk` 脚本会打印从标题到第一行空行（lint 章节结束）的所有内容。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n如果有疑问 . . .\n\n如果有疑问，在将输出管道到 shell 执行之前，可以先将输出传给 `more` 或 `pg` 以查看所生成的命令。\n\n\
  ### 最后一个内置函数：system\n\n还有一种不属于字符或数字类型的内置函数：`system`。`system` 函数执行传递给它的参数作为字符串。这允许你在\
  \ `awk` 代码有需要时即时执行命令或脚本。你可以编写一个报告，并在完成后自动打印到纸上。代码类似于列表 26.8 “使用 `system` 函数”所示。\n\
  \n```awk\nBEGIN {\n    pageno = 0;\n    pageno = print_header(pageno);\n    printf(\"\
  page number is now %d\\n\", pageeno);\n}\n# 报告的生成代码将写在这里\nEND {\n    close(\"report.txt\"\
  );\n    system(\"lpr -Pprinter report.txt\");\n}\n\nfunction print_header(page)\
  \ {\n    page++;\n    printf(\"This is the header for page %d\\n\", page) > \"report.txt\"\
  ;\n    printf(\"this is a second line of the header\\n\") > \"report.txt\";\n  \
  \  return page;\n}\n```\n\n这是第 1 页的标题\n这是标题的第二行\n页码现在是 0\n\n输出结果与列表 26.6 相同，不同之处输出显示在打印机上而不是屏幕上。在打印文件之前，你必须先关闭它。\n\
  \n### 结语\n\n本章介绍了各种实现下的 `awk` 编程语言。这是一门非常强大且实用的语言，允许你搜索数据、从文件中提取数据、即时创建命令，甚至创建整个程序。作为一种原型语言，它非常有用，你可以快速创建报告。在展示给用户后，可以快速进行修改。虽然它的效率不如\
  \ C 语言编写的程序，但远未低到无法创建生产环境程序的程度。如果 `awk` 程序的效率是一个问题，可以将其转换为 C。\n\n更多信息，请参考以下内容：Aho,\
  \ Alfred V., Brian. Kernighan and Peter J. Weinberger. *The awk Programming Language.*\
  \ Addison-Wesley, 1988 (copyright AT&T Bell Lab). 另另你系统上 `awk`、`nawk` 或 `gawk` 的\
  \ man 页面。\n\n### 第 27 章编写 Perl 程序\n作者 Pitts\n\n#### 编写/执行简单的 Perl 脚本\n#### 与用户交互\n\
  #### 特殊 Perl 变量\n#### 控制结构\n#### Perl 中常用的函数\n#### 数组操作\n#### 文件操作\n#### 系统操作\n\n\
  \n\n\n本章将为你介绍如何编写 Perl 脚本。本教程使用 Perl 5 版本编写。本章中提到的某些内容无法在 Perl 4 版本中运行。其目的是为 Perl\
  \ 初学者提供足够的信息，使其能够编写自己的程序，以提高在现实世界中的性能。本章主要涉及三个领域：用户输入、处理和输出，并重点关注用户输入和处理。基础输出将以向输出到标准输出（显示器）和文件的形式涵盖。\n\
  \n## 什么是 Perl？\n\n首先，Perl 是什么？Perl 是一种几乎适用于任何场景的编程语言。Perl 的作者拉里·沃尔（Larry Wall）说，它代表“病态折衷的垃圾列表器”（Pathologically\
  \ Eclectic Rubbish Lister）。在你有机会使用 Perl 一段时间后，我认为你也会同意一个更好的定义是“实用提取与报告语言”（Practical\
  \ Extraction and Reporting Language）。习惯于 C 语言的人会发现它的语法与此相似，但更好。你还会发现，由于不需要 C 语言相关的编译，工具的设计和更改变得快速而简单。这是没错的；Perl\
  \ 不是编译的。Perl 是一种解释型语言。Perl 在运行时编译，因此速度几乎与编译后的 C 程序相当，但编写代码像编写 Shell 程序一样简单。对于习惯了\
  \ awk 或 sed 的人来说，Perl 利用正则表达式提供了模式匹配。基本上，Perl 已经成为 C、Shell 脚本、TCL 以及其他与系统管理相关的编程语言和技术的替代品。\n\
  \n幸运的是，Perl 并不止于此。它是一门完整的语言，准备好处理编程社区的复杂需求。Perl 已用于基因组项目中的 DNA 制图；最流行的邮件列表管理器 Majordomo\
  \ 就是用 Perl 编写的。Perl 被用于数千（字面上意义）其他项目。有关如何使用 Perl 的更多信息，请参见全面 Perl 存档网络 (www.perl.com)。\n\
  \n## 编写/执行简单的 Perl 脚本\n\n我上过的每一门编程课程都是从设计 Hello World 程序开始的。本章也不例外。我们可以从命令行显式地运行\
  \ Perl 脚本开始。假设 Perl 可执行文件的位置在你的路径中，以下程序：\n\n```\nperl -e 'print \"Hello world!\\\
  n\";\n```\n\n将输出以下内容：\n\n```\nHello world!\n```\n\n`-e` 告诉 Perl 执行其后的内容。这种方法限制为\
  \ 80 个字符。如果你需要超过 80 个字符的内容，你需要将行放在文本文件中。该文件将完成两件事：首先告诉计算机要做什么（调用 Perl 解释器），其次告诉\
  \ Perl 解释器要解释什么。\n\n你可能会问这是如何实现的？正如你从 Shell 脚本经验（如果有的话）中所知，你使用脚本的第一行来告诉计算机调用哪个程序。例如，如果我要调用\
  \ ksh 程序，我的第一行看起来如下：\n\n```\n#!/bin/ksh\n```\n\n在 Perl 中，情况是类似的。你有一个井号（!），后面跟着解释器的位置。因此，你新程序的第一行应该像这样：\n\
  \n```\n#!/bin/perl\n```\n\n此行之后的所有内容都将作为参数发送给程序（在此例中为 Perl）。因此，Hello World 程序可以像这样的文件：\n\
  \n```\n#!/bin/perl print \"Hello World!\\n\";\n```\n\n诚然，这算不上什么程序。然而，它足以确保 Perl\
  \ 运行并且你对文件拥有正确的权限。为了让 Perl 读取并执行脚本，脚本必须为运行程序的人设置了读取和执行权限。`-r-x------` 将允许脚本所有者运行\
  \ Perl 程序，而 `-------r-x` 将允许任何人运行程序。\n\n### 关于终止符的快速说明\n\n每行代码必须以某种形式的终止符结束。Perl\
  \ 中有两种终止符。第一种是分号（`;`）。它用于结束一行代码。第二种是右大括号（`}`）。它用于结束一个代码块。许多初学者（甚至是专家）都会忘记终止符。\n\n\
  当你忘记终止符时会发生什么？程序仍然会尝试编译，但几乎会在缺少分号的下一行报错，或者在程序结束处因缺少大括号而报错。\n\n为什么终止符如此重要？终止符的作用用于告诉\
  \ Perl 一行或一个代码块何时结束，这样它就知道如何处理该代码。对于 Perl 来说，硬回车没有意义。例如，以下两组代码在 Perl 视角来看是相同的。第二组对我们人类来说更容易读：\n\
  \n```\n$first_name=\"David\";\n$last_name=\"Pitts\";\n$work=\"Best Consulting\"\
  ;\n```\n\n```\n$first_name=\"David\"; $last_name=\"Pitts\"; $work=\"Best Consulting\"\
  ;\n```\n\n因此，格言说：要终止，否则就会被终止！\n\n## 与用户交互\n\n\n\n\n拥有一个可以输出内容的程序是可以的。该流程的下一步是允许程序与用户进行交互。实现这种交互有多种方法：可以向程序传递参数，也可以从命令行获取输入。\n\
  \n在继续之前，让我花一点时间说明一下 Perl 中使用的主要数据类型。它们是字面量、包括字符串、数组和哈希引用的变量、文件句柄以及 here-iss。接下来的章节将对这些每种类型给出简要描述和示例。\n\
  \n## 字面量\n\n`Literals` 是实际的值。`Literals` 名如其名。例如，有数值字面量 `1`、`2`、`3`、`4` 等。还有字符串字面量\
  \ `abc`、`xyz`、`Fred`、`Sylvia` 等。某些字符不是字面量，而是元字符。这些字符匹配除自身以外的内容。这些元字符是 `\\ ( ) [\
  \ ] { } ^ $ * + ?`。\n\n在一个章节内没有空间详细解释所有这些内容的含义。如果你有任何正则表达式的经验，大部分对你来说应该熟悉。一个需要理解的重要点是反斜杠。反斜杠（`\\\
  `）可以将元字符转换为字面字符。它也会将某些字面字符转换为元字符；例如，`\\n` 是换行，`\\t` 是制表符。\n\n## 变量\n\n`Variables`\
  \ 是用于存储值的命名存储位置。该值可以是一个数字、字符、数字和字符的字符串，或者程序认为合适的任何内容。以下是一些变量的示例。\n\n- `$var`: 一个简单的标量变量。\n\
  - `@var`: 在标量上下文中整个数组，即数组中元素的数量。\n- `$var[4]`: 数组的第五个元素（和大多数计算机一样，数组的第一个元素是第 0 个元素，而不是第一个）。\n\
  - `$d = @var`: `$d` 是指向数组的引用。\n- `$d[4]`: 由 `$d` 引用的数组的第五个元素。\n- `$var[-1]`: 数组\
  \ `@var` 的最后一个元素。\n- `$var[$x][$y]`: 数组 `@var` 中第 `$x` 个元素的第 `$y` 个元素。\n- `$#var`:\
  \ 数组 `@var` 的最后一个索引。\n- `%var`: 在标量上下文中整个哈希，如果哈希有元素则为真（哈希被称为关联数组）。\n- `$var{'Name'}`:\
  \ 来自哈希 `%var` 的一个值。\n- `$d = %var`: `$d` 是指向哈希 `%var` 的引用。\n- `$d{'Name'}`: 由 `$d`\
  \ 引用的哈希中的值。\n- `@var{'x','y'}`: `%var` 的切片；相当于 ($var{'x'},$var{'y'})。默认情况下，所有变量都是全局变量。这意味着如果你在程序的某个部分或子程序中使用变量，然后在其他部分使用它，它仍然指向同一个位置，并且在一个地方对其进行的任何更改都会影响另一个地方的变量。声明局部变量有两种方法。我在这里不会讨论它们的区别，但有一个例外：局部声明的变量会将值传递到从当前子程序调用的另一个子程序中，而\
  \ `my` 则不会。使变量变为子程序局部的两种方法是使用 `my` 和 `local` 标识。这意味着子程序获得了这些变量的自己的副本，对这些变量的任何操作都不会影响该程序外部同名的变量。以下示例展示了如何使用\
  \ `my` 和 `local` 标识。\n\n```perl\nmy $name = \"David\"; local @brothers_family =\
  \ (\"John\", \"Kathy\", \"Pat\", \"Emily\");\nmy ($John, $Kathy, $Pat, $Emily) =\
  \ @brothers_family;\n```\n\n\n\n注意，以下不是将变量 `$x` 和 `$y` 初始化为局部变量正确方法：\n\n```perl\n\
  my $x, $y = 1;\n```\n\n这等同于以下写法：\n\n```perl\nmy $x; $y = 1;\n```\n这会将 `$x` 初始化为局部变量，并将\
  \ `$y`（全局地）设置为 1。\n\n第 723 页\n\n## 代码引用\n代码引用指的是子程序（subroutines）。子程序是一段代码，可以从程序的不同位置被调用，用以处理程序目标的某部分。如果子程序返回有意义的值，它也被称为函数。子程序包含两个部分：首先是实际的代码段；其次是调用该代码的内容。\n\
  \n子程序使用保留字 `sub` 定义，后面跟一个空格，然后是子程序的名称。整个子程序包含在 `begin` 和 `end` 括号（`}{}`）中，如下子程序所示。\n\
  \n使用井号（`#`）开始注释。注释从井号开始一直延伸到行尾。因此，如果你想写行注释，必须在每行的开头放置一个井号。\n\n```perl\nsub weekday\
  \ { # determine day of week\n$y=$year;\n$d=$mday;\n$m=$month;\n@d= (0,3,2,5,0,3,5,1,4,6,2,4);\n\
  @day=(Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday);\n$y-- if\
  \ $m < 3;\n$weekday = $day[($y+int($y/100)+int($y/400)+$d)%7];\n# end of sub weekday\n\
  ```\n\n要调用子程序，需要在子程序名称前加上取符符号（`&`）。例如，要调用 `weekday` 子程序，你可以这样做：\n\n```perl\n&weekday\n\
  ```\n\n也可以通过将参数放在括号内传递给子程序。\n\n```perl\n&subroutine(list);\n```\n这等同于向程序传递参数列表。因此，我将关于这点的讨论推到本章稍后的“将输入作为参数”章节。\n\
  \n## 文件句柄\n文件句柄（filehandle）赋予文件、管道、套接字或设备的一个符号名称。在对文件、管道、套接字或设备进行操作时，你使用的是文件句柄而不是实际名称。下面的示例显示了文件句柄的一种用法。\n\
  \n```perl\nopen(FILE, \"$filename\"); @file = <FILE>;\nclose FILE;\n```\n第一行打开与变量\
  \ `$filename` 关联的文件。现在该文件将使用文件句柄 `FILE` 来引用（它可以是任何名称；我使用 `FILE` 是为了提醒自己这是一个文件；同样，如果我打开一个目录列表，我会使用\
  \ `DIR`）。第二行将整个文件保存为名为 `@file` 的数组。最后，第三行通过关闭文件句柄关闭与变量 `$filename` 关联的文件。\n\n表 27.1\
  \ 显示了如何根据不同目的打开文件。\n\n| 命令 | 说明 |\n| :--- | :--- |\n| `open(FILE, \"<\")` | 从现有文件读取\
  \ |\n| `open(FILE, \">\")` | 创建并打开文件（覆盖现有文件） |\n| `open(FILE, \">>\")` | 向文件追加（不覆盖现有文件）\
  \ |\n| `open(FILE, \\|\")` | 设置输出过滤器 |\n| `open(FILE, \"|\")` | 设置输入过滤器 |\n\n第 724\
  \ 页\n\n如你所见，文件句柄可以命名为任何名称。打开后，可以使用文件句柄访问文件，直到它被显式关闭。\n\n## Heroc\nHeroc 是一种面向行的引用形式。它通常用于打印多行内容。使用带有\
  \ heredoc 的单个打印语句比逐个打印每一行要快。引用 heredoc 的是使用两个小于号（`<<`），后面紧跟一个用于结束引号内容的字符串（小于号和字符串之间不要有空格）。忘记在语句末尾加上分号，以便\
  \ Perl 知道语句何时结束。以下是使用 heredoc 打印多行的示例。\n\n```perl\nprint<<\"Print_to_here\";\nMy\
  \ name is $f_name $l_name\nI live at:\n   $street\n$city, $state $zip\nPrint_to_here;\n\
  ```\n\n如果在两个小于号后加上空格，或者没有使用字符串来结束引号内容，打印语句将一直打印到遇到空行为止。因此，如果我在第一行的 `<<` 和字符串之间放了一个空格，那么打印出来的将只有第一行，而不是整个内容。\n\
  \n## 特殊 Perl 变量\n\n\n\n\nPerl 具有几个特殊的内置变量。这些变量具有特定的值，或者在无需程序指示的情况下采用特定的值。表 27.2\
  \ 列出并描述了这些特殊变量。\n\n### 表 27.2 特殊 Perl 变量\n\n| 变量 | 用途或功能 |\n| :--- | :--- |\n| `$_`\
  \ | 默认输入和模式搜索空间。 |\n| `$.` | 与最后读取的文件句当前行相关的行号。 |\n| `$/` | 输入记录分隔符。 |\n| `$,` |\
  \ 打印操作的输出字段分隔符。 |\n| `$` | 字符串中插值数组元素的连接符。 |\n| `$\\` | 打印运算符的输出记录分隔符。 |\n| `$#`\
  \ | 打印数字的输出格式。 |\n| `$*` | 设置为 1 以在字符串内多行匹配。 |\n| `$?` | 上一次 `...` 命令、`close`、`pipe`\
  \ 或系统操作返回的状态。 |\n| `$]` | Perl 版本号。 |\n| `[` | 数组第一个元素的索引，以及子字符串第一个字符的索引。 |\n| `$;`\
  \ | 用于模拟多维数组的下标运算符。 |\n| `$@` | 上一次 `eval` 或 `do` 命令返回的错误信息。 |\n| `$!` | 如果在字符串上下文中，产生相应的错误字符串；在数值上下文中，产生\
  \ `errno` 的当前值。 |\n| `:$` | 字符串后可以断开以填充格式中延续字段的字符集。 |\n| `$0` | 正在执行的 Perl 脚本的文件。\
  \ |\n| `$$` | 运行当前脚本的 Perl 解释器的进程 ID。 |\n| `$<` | 当前 Perl 进程的实际用户 ID。 |\n| `$>`\
  \ | 当前 Perl 进程的有效用户 ID。 |\n| `$(` | 当前 Perl 进程的实际组 ID。 |\n| `$)` | 当前 Perl 进程的有效组\
  \ ID。 |\n| `$^A` | 行和写操作的累加器。 |\n| `$^D` | 使用 `-d` 传递给 Perl 的调试标志。 |\n| `$^F` |\
  \ 最高的系统文件描述符。 |\n| `$^I` | 使用 `-i` 传递给 Perl 的就地编辑扩展。 |\n| `$^L` | 格式中使用的分页符。 |\n\
  | `$^P` | 内部调试标志。 |\n| `$^T` | 当前 Perl 程序启动的时间。 |\n| `$^W` | 传递给 Perl 的 `-w` 选项的值。\
  \ |\n| `$^X` | 调用此 Perl 解释器的名称。 |\n| `$%` | 当前选定输出通道的页码。 |\n| `=$` | 当前输出通道的页长度。\
  \ |\n| `$-` | 当前页剩余的行数。 |\n| `~$` | 当前报告格式的名称。 |\n| `$^` | 当前页首格式的名称。 |\n| `$` |\
  \ 如果设置为非零（默认为 0），则强制在当前选定的输出通道上的每次打印或写入后进行刷新。 |\n| `$ARGV` | 从 `< >` 读取时当前的文件名。\
  \ |\n| `$&` | 上一次成功匹配的字符串。 |\n| `$'` | 上一次成功匹配之前的字符串。 |\n| `` ` `` | 上一次成功匹配之后的字符串。\
  \ |\n| `$+` | 上一次搜索匹配的最后一个括号。 |\n| `$1..$9` | 包含上一次匹配模式中对应括号组的子模式。 |\n| `@_` | 子程序的参数数组；如果不是数组上下文，也由\
  \ `split` 使用。类似于 `$_`。 |\n| `@ARGV` | 脚本的命令行参数。 |\n| `@EXPORT` | 包默认导出的方法名称。 |\n\
  | `@EXPORT_OK` | 包在显式请求时可以导出的方法名称。 |\n| `@INC` | 包含 `do` 和 `require` 评估脚本的路径列表。\
  \ |\n| `@ISA` | 包的基类列表。 |\n| `%ENV` | 环境变量。 |\n| `%INC` | 使用 `do`、`require` 和 `use`\
  \ 包含的文件列表。 |\n| `%OVERLOAD` | 可用于重载包中的运算符。 |\n| `%SIG` | 用于设置各种信号的信号处理器。 |\n\n许多程序允许在实例化时传递参数。程序必须足够聪明，以知道如何处理这些参数。Perl\
  \ 中调用的任何例程也是如此。坦率地说，Perl 有一个内置数组，可以捕获从命令行传递它的任何参数。该数组就是 `@argv` 数组。在任何语言中，数组元素的编号从零（0）开始。因此，如果向程序传递两个参数，第一个值将是数组的第\
  \ 0 个元素，第二个参数将是数组的第一个元素。\n\n`@argv` 数组是默认数组。有几种方法可以从数组获取信息。正如前面提到的，可以引用元素。如果使用这种方法，值将保留在数组中。获取信息的另一种方法是将其移出数组。使用\
  \ `shift` 命令，我们可以一次移除数组上的元素，并将数组中的所有其他元素向下移动一个。\n\n例如，假设你有如下数组：\n\n```\n@argv =\
  \ (1,2,3,4);\n```\n\n你可以像这样将数组第一个元素的值赋给变量：\n\n```perl\n$number = $argv[0];\n```\n\
  \n\n\n这会将 `$number` 赋值为 \"1\"，而 `@argv` 的值为 (1,2,3,4)。接下来的示例将 `$number` 赋值为 \"1\"\
  ，但此时 `@argv` 的值将变为 (2,3,4)。\n\n```perl\n$number = shift @argv; # 这等同于仅对 @argv 数组执行\
  \ shift = shift。\n```\n\n## 在命令行上提供脚本输入\n\n在实例化程序时，并不一定需要向程序传递变量。也可以从命令行读取输入。这是通过使用尖角运算符（angle\
  \ operator）实现的。尖角运算符使用一个名为 `STDIN` 的特殊文件句柄。通过将输入句柄放在小于号和大于号之间，我们可以从命令行获取输入。该值必须赋值给变量，并且包含了输入数据时使用的硬回车符。下一行代码获取标准输入并将其保存到变量\
  \ `$input` 中。\n\n```perl\n$input = <STDIN>; chomp($input);\n```\n第二行删除了字符串末尾的硬回车符。\n\
  \n## 控制结构\n\n`Control structures` 为程序提供了根据标准做出并并操作的能力。Perl 基本上有两种类型的控制结构：条件结构和交互结构。条件结构基于这样的概念：如果某事为真，则执行一次操作。交互结构（也称为循环）基于这样的概念：如果某事为真，则持续执行某些操作直到其不再为真。这引出了一个问题：什么是真？\n\
  \n### 什么是真？\n\n这是一个困扰了哲学家千年的问题。幸运的是，我们是程序员而不是哲学家，我们知道什么是真。真可以分为两种。观察真的第一种方法是简单值。如果该值等于\
  \ nil 或零，它就是假的；否则，它是真的。因此，在前面的示例中，如果 `$value` 是任何非 nil 或零的值（即它具有某些值），就会被打印；否则不会。以下是一些使用这种基本格式的示例，展示了真与假之间的区别。\n\
  \n```perl\n$value = \"\"; if ($value) { print $value }\n```\n什么都没有被打印，因为 `$value`\
  \ 是 nil。\n\n```perl\n$value = \"David\"; if ($value) { print $value }\n```\n打印了\
  \ David，因为 \"David\" 既不是 nil 也零。\n\n另一种观察真的方法是使用真值表来观察一个值如何与另一个值比较。要查看这些真值表，我们必须先理解\
  \ Perl 中是如何进行比较的。取决于比较的是字符串还是数字，比较方式有所不同。表 27.3 显示了数字和字符串的关系运算符及其含义。\n\n表 27.3 数字和字符串的关系运算符\n\
  \n| 数字 | 字符串 | 含义 |\n| :--- | :--- | :--- |\n| `>` | `gt` | 大于（假时返回 \"\"，真时返回 1）。\
  \ |\n| `>=` | `ge` | 大于等于（假时返回 \"\"，真时返回 1）。 |\n| `<` | `lt` | 小于（假时返回 \"\"，真时返回\
  \ 1）。 |\n| `<=` | `le` | 小于等于（假时返回 \"\"，真时返回 1）。 |\n| `==` | `eq` | 等于（假时返回 \"\"\
  ，真时返回 1）。 |\n| `!=` | `ne` | 不等于（假时返回 \"\"，真时返回 1）。 |\n| `<=>` | `cmp` | 比较（左侧小于右侧时返回\
  \ -1，相等时返回 0，左侧大于右侧时返回 1）。 |\n\n使用上表，我们可以写出一些复杂的 `if` 命令。\n\n```perl\nif ($value\
  \ == 24) { print $value } if ($value == 24 && $name eq \"David\") { print $name\
  \ } if ($value == 24 || $name eq \"David\") { print $value }\n```\n第一行可能是容易理解的：如果\
  \ `$value` 的值为 24，则打印 `$value` 的值。接下来的两行使用逻辑运算符允许复杂的检查 set 来判断真假。双和符号 `&&` 是逻辑与（AND），双管道符号\
  \ `||` 是逻辑或（OR）。在逻辑与中，`&&` 两侧的值都必须为真，整个语句才为真。在逻辑或中，只需一侧为真即可。它们使用以下基础真值表。\n\n| 比较\
  \ | 值 | True && True | True || False | True && False | False || False |\n| :---\
  \ | :--- | :--- | :--- | :--- | :--- |\n| True && True | True | True | True | |\
  \ |\n| True || False | True | True | True | | |\n| True && False | False | | True\
  \ | False | |\n| False || False | False | False | False | False |\n\n\n\n\n\n# 根据测试结果执行代码\
  \ (if)\n\n现在我们已经获取了输入（无论是来自命令行还是标准输入），我们就可以对其进行处理了。对输入最常见的处理方式是测试结果，并且如果结果符合特定条件，则执行某些操作。这种测试结果通过\
  \ `if` 命令完成。`if` 命令的语法是动词 `if` 后跟一个真值语句。在真值语句之后，如果该语句评估为真，则执行一个代码块；否则，将跳过该代码。一个简单的\
  \ `if` 语句看起来如下：\n\n```perl\nif ($value) {print $value}\n```\n\n## 决策 (if-else)\n\
  \n具备检查某事真假的能力是可以的，但在许多过程中，我们希望更进一步：即如果某事为真，则执行某件事；如果为假，则执行另一件事。这在 Perl 中可以通过 `if-else`\
  \ 语句轻松实现。\n\n```perl\nif ($value eq \"True\") {\n  do something\n} else {\n  do\
  \ something\n}\n```\n\n这是最基础的操作了：一个简单的“是”或“否”问题，每个选项都接收一组独立的指令。当然，通过 `elsif` 动词，可以根据某些条件执行分级工作（即：如果第一个条件为假，则检查下一个条件）。下面的示例显示，如果该值为真，则执行某些操作；如果为假，它会检查另一个值，并根据该值执行若干种操作中的一种。\n\
  \n```perl\nif ($value eq \"True\") {\n  do something\n} elsif ($range <= 22) {\n\
  \  do something\n} elsif (($range > 22) && ($range <= 44)) {\n  do something\n}\
  \ elsif (($range > 44) && ($range <= 70)) {\n  do something\n} else {\n  do something\n\
  } # end\n```\n\n## 遍历每个命令行参数 (for)\n\n`if` 语句有助于在存在选择时确定该做什么。当你想要按照特定次数循环一系列代码时，就会使用\
  \ `for` 命令。例如，你想执行某项任务，直到某个变量（如 `counter`）达到某个特定值。用英语描述，你的做法可能如下所示：![4f3a8aef3b56941e5550c604caf.gif](img/4f3a8aef3b56941e5550c604caf.gif)\
  \ 将 `counter` 初始化为 0。如果 `counter` 小于或等于 10，则运行系列命令。当 `counter` 大于 10 后，继续执行程序的剩余部分。\n\
  \nPerl 的 `for` 循环语法与 C 语言相同。格式如下：\n\n```perl\nfor(initial_value;while true;change_value)\
  \ {\n  do ![arrow.gif](img/450ed21b36ef4f4df520fc03bad.gif)stuff\n}\n```\n\n这是一个带有实际变量的示例，有助于理解上述内容：\n\
  \n```perl\nfor ($counter=0; $counter <= 10; $counter++) {\n  do stuff\n}\n```\n\n\
  注意，`for` 循环有三个部分。首先，你有 `for` 循环的初始状态（`$counter = 0`）。其次，你定义了在什么条件下执行代码（当 `counter`\
  \ 小于或等于 10 时）。最后，你有一个用于修改循环状态的表达式（增加 `$counter`）。只要真值条件为真（`$counter <= 10`），循环就会继续执行。\n\
  \n你可能已经发现 `for` 循环在本质上与 `while` 循环是相同的。语法不同，但概念是一的。不过，为了完整起见，这里有一个使用 `while` 循环实现的相同循环以便以便观察区别：\n\
  \n```perl\nwhile ($counter <=10) {\ndo stuff\n}\n```\n\n两者之间的主要区别在于，`do stuff` 代码中必须存在对状态变量的变化，否则你将陷入死循环。\n\
  \n## 遍历整个对象 (foreach)\n\n`foreach` 循环类似于 `for` 循环。`foreach` 循环用于对整个标量值（如数组）执行一组指令。语法非常简单；我将再次用通白英语给出，然后用\
  \ Perl 给出。\n\n\n\n\n用通俗易懂的话来说，你可以认为对于我集合中的每个实体，执行这些指令。听起来很简单吧？事实它也确实如此。以下是 `foreach`\
  \ 命令的 Perl 版本：\n\n```perl\nforeach $value(@array) { do stuff }\n```\n\n在前面的示例中，数组\
  \ `@array` 的每个元素都被赋值给变量 `$value`。然后，执行代码块。没有必要在这里定义该变量（`$value`）。如果缺失了它，在循环执行时，特殊变量\
  \ `$_` 将包含每个元素的值。这里有一个真实世界的示例，可能有助于你理解这一点。\n\n例如，假设你想打开一个文件，将其内容保存到数组中，并检查每行是否包含\
  \ `\\n`，然后将其替换为 `<br>`。这是一个很好的循环示例。判断这是一个循环函数的关键在于“检查每行”的句语句。这样的程序看起来可能像这样：\n\n\
  ```perl\n#!/site/bin/perl \nopen (FILE,\"filename\") die \"File not found: $!\\\
  n\";\n@file=<FILE>;\nclose(FILE);\nforeach (@file) {\n    $_ =~ s/\\\\n/<br>/g;\n\
  \    push (@temp, $_);\n} # end of foreach (@file)\nopen (FILE< \">filename\");\n\
  print FILE @temp;\nclose FILE;\n```\n\n## Perl 中常用的函数\n\n虽然可能需要一百页或更多的内容才能简要描述 Perl\
  \ 的所有函数，但列出一些处理数组、列表和标量的常用函数就足够了；这让初学者能够制作非常强大且复杂的工具。因此，本节将对一些最常用的函数进行简要描述并提供示例。在此之前，需要对泛指函数说明几点。\n\
  \n函数可以作为表达式中的项使用。其中一些函数接受一个 `list` 作为参数。这种列表可以是标量和列表值的任何组合，但整个列表将被视为一个单维的列表值。列表中的元素必须用逗号分隔，或者用\
  \ `=>`（逗号的简写形式）分隔。\n\n函数的参数不需要加括号。许多程序员在参数周围使用括号，以帮助将其与函数名区分开，并指示它们是参数。然而，必须小心，因为位置错误的括号往往会导致许多意想不到的结果。下面的示例将有助于这一点这一点：\n\
  \n```perl\nprint 1+1+1;      # 输出 \"3\"\nprint (1+1)+1;    # 输出 \"2\"\nprint +(1+1)+1;\
  \   # 输出 \"2\"\nprint ((1+1)+1);  # 输出 \"3\"\n```\n\n如你所见，空格的影响很小或没有影响，但括号的影响很大。我们将看到的函数属于以下几类：数组、文件、哈希和变量。这些函数可以分为这些类别，尽管其中某些确实属于多个类别：\n\
  \n- **数组操作**：`pop`, `push`, `shift`, `unshift`, `splice`\n- **文件操作**：`open`, `close`\n\
  - **哈希操作**：`each`, `keys`, `values`\n- **系统操作**：`time`, `localtime`, `system`\n\
  - **变量操作**：`++`, `--`, `chomp`, `split`, `join`\n\n一个准确的观察者会注意到，其中某些并不是真正的函数（`.`,\
  \ `++`, `--`），但它们足够重要，会被包含进来。\n\n## 数组操作\n\n数组可以被视为栈。因此，可以从栈的末端添加或删除内容。通过从数组的开头和结尾添加和删除内容的能力，我们可以执行先进先出（FIFO）和后进先出（LIFO）的功能。也可以从栈的中间删除内容。考虑到这一点，我们来看以下函数。\n\
  \n### Pop 和 Push\n\n下面的示例使用 `foreach` 语句读取数组的每行。然后对每行进行搜索和替换，并将该行的结果推（push）到一个名为\
  \ `@temp` 的数组。\n\n```perl\nforeach $line(@stuff) {\n    $line =~ s/$search/$replace/g;\n\
  \    push (@temp, $line);\n} # end of foreach $line\nprint @stuff,\"\\n\",@temp;\n\
  ```\n\n### Pop\n\n如果省略了 `ARRAY`，函数将弹出 `@ARGV` 或 `$_`。下面的示例从数组中弹出每个元素，执行与前例相同的搜索和替换程序，并将结果推入第二个数组中。\n\
  \n```perl\nwhile (@ARGV) {\n    $argument = pop;\n    $argument =~ s/$search/$replace/g;\n\
  \    push (@temp, $argument);\n} # end of while (@ARGV)\n```\n\n\n\n\n```perl\n\
  print @temp, \"\\n\\n\", @ARGV;\n```\n\n## 这两个示例之间有什么区别？\n\n有两个区别。让我们来看 print 语句的输出。在两个示例中，`$search\
  \ = \"David\"` 和 `$replace = \"John\"`，传递的参数都是 \"David was here.\"\n\npush 示例的输出如下：\n\
  ```\nJohnwashere.\nJohnwashere.\n```\n\npop 示例的输出如下：\n```\nhere.wasJohn\n```\n\n\
  区别在于，在 pop 示例中，`@ARGV` 失去了所有的值，因为它们从列表中被弹出（移除），而在第二个示例中，每个值只是被引用了。第二个区别是，在 pop 示例中，输出与输入相反。你能猜出为什么吗？\n\
  \n## Shift and Unshift\n\nShift 和 unshift 与 push 和 pop 相似，它们作用于数组的另一侧。push 和 pop\
  \ 在数组的末尾添加和删除项，而 unshift 和 shift 在数组的开头添加和删除项。我们将使用与 push 和 pop 类似的示例，并看看有什么区别。不过，首先是它们的语法：\n\
  \n```perl\nunshift ARRAY, LIST\n```\n\n记住，`unshift` 将项插入数组前面，这意味着它将它们添加到数组的开头。\n\
  \n```perl\nforeach $line (@ARGV) {\n    $line =~ s/$search/$replace/g ;\n    unshift(@temp,\
  \ $line);\n} # end of foreach $line (@stuff)\n\nprint @temp,\"\\n\\n\",@ARGV;\n\
  ```\n\n**示例输出：** \n```\nhere.wasJohn\nJohnwashere.\n```\n\n注意，`@temp` 与输入参数 ![arrow.gif](img/4505ed21b36ef4fdf520fc03bad.gif)\"\
  David was here.\" 是反的。\n\nshift\n\n与之对应，如果给了 ARRAY，`shift` 会从 `@ARGV` 中移除项。\n\n\
  ```perl\nwhile (@ARGV) {\n    $argument=shift;\n    $argument~ s/$search/$replace/g;\n\
  \    unshift(@temp, $argument);\n}\nwhile (@ARGV)\nprint @temp, \"\\n\\n\",@ARGV;\n\
  ```\n\n**示例:**\n```\nhere.John\n```\n\n注意，尽管它是先从栈顶获取项，但它又先将它们放回开头。因此，新数组 `@temp`\
  \ 现在按顺序包含了所有参数。\n\n## Splice\n\n有时，我们想要获取数组较大的一部分，或者想要从中间取出某些东西。这就是 `splice` 的用途。事实上，我们可以用\
  \ `splice` 代替 `shift`、`unshift`、`pop` 和 `push`。`splice` 的语法如下：\n\n```perl\nsplice\
  \ ARRAY, OFFSET, LENGTH, LIST\nsplice ARRAY, OFFSET, LENGTH\n```\n\n该函数从数组中删除由 `OFFSET`\
  \ 和 `LENGTH` 指定元素，并用 `LIST` 中的元素（如果有）替换它们。`Splice` 返回从数组中移除的元素。如果省略 `LENGTH`，它将移除\
  \ `OFFSET` 之后的所有内容。\n\n下表显示了如何使用 `splice` 代替 `push`、`pop`、`shift` 和 `unshift` 来移除数组中间的一部分。\n\
  \n| Splice | 等效操作 |\n| :--- | :--- |\n| `splice(ARRAY, OFFSET, 0, LIST)` | `unshift(ARRAY,\
  \ LIST)` |\n| `splice(ARRAY, ##, LENGTH, LIST)` | `push(ARRAY, LIST)` |\n| `splice(ARRAY,\
  \ 0, LENGTH)` | `shift(ARRAY)` |\n| `splice(ARRAY, -1, 1)` | `pop(ARRAY)` |\n| `splice(ARRAY,\
  \ OFFSET, LENGTH, LIST)` | `ARRAY[OFFSET] = LIST` |\n\n你看到那个看起来很特殊的变量 `$#array`\
  \ 吗？该值返回数组中最后一个元素的索引。通过给它加 1，我们得到了 `OFFSET` 值（数组从 0 开始计数；OFFSET 从 1 开始计数）。\n\n\n\
  \n\n\n对文件进行最常见的两种操作是打开和关闭。关闭文件非常简单，我们将首先讨论这一点。打开文件取决于你打算对该文件做什么，因此需要花一点额外的时间来解释它。\n\
  \n## Close\n\n在 Perl 5 之前的版本中，关闭文件句柄（filehandle）并不是一个必要步骤。当程序结束或用具有相同 `FILEHANDLE`\
  \ 名称打开一个新文件时，文件会自动关闭。但无法保证这在 Perl 的未来版本中仍然依然有效，而且，关闭你所打开的任何文件也是良好的编程规范。如果你不记得文件句柄是什么，请参阅讨论它们的上一个章节。其语法非常简单：\n\
  \n```perl\nclose FILEHANDLE;\n```\n\n我在这里给您提供一个例子，尽管这应该是显而易见的：\n\n```perl\nopen\
  \ (FILE, $file); $file=<FILE>;\nclose FILE;\n```\n\n## Open\n\n打开文件是通过打开文件并赋予其一个文件句柄完成的。然后在程序中引用该文件句柄。打开文件有多种原因：为了读取、写入或追加。下表显示了打开文件的不同方式。\n\
  \n| 命令 | 功能 |\n| :--- | :--- |\n| `open (FILE, \"filename\")` | 从现有文件读取 |\n| `open\
  \ (DAVID, \"<filename\")` | 显式打开文件（与上述相同） |\n| `open (church, \">filename\")` |\
  \ 创建文件并打开进行写入（覆盖现有文件） |\n| `open (log,\">>filename\")` | 追加到文件（不覆盖现有文件） |\n| `open(file,\
  \ \"| output-pipe-command\")` | 设置输出过滤器 |\n| `open(file, \"input-pipe-command\"\
  )` | 设置输入过滤器 |\n\n如你所见，知道你打算对文件做什么非常重要；否则，你可能会意外删除现有文件，或向你本想覆盖的文件中追加内容。\n\n## Hash\
  \ Manipulation\n\n哈希数组（Hash arrays）与普通数组不同。哈希数组是一种关联数组。普通数组是索引列表，每个项通过其索引数字引用，而哈希是一个键值对（value\
  \ pairs）列表。在键值对中，第一个项（key）引用第二个项（value）；当引用第一个项时，返回的就是第二个项的值。你可以通过以下代表周期的哈希数组轻松地理解这一点：\n\
  \n```perl\n%day_of_the_week = (0, Sunday, 1, Monday, 2, Tuesday, 3, Wednesday, 4,\
  \ Thursday, 5, Friday, 6, Saturday);\n```\n\n哈希也可以这样这样定义：\n\n```perl\n%day_of_the_week\
  \ = (0 => 'Sunday', 1 => 'Monday', 2 => 'Tuesday', 3 => 'Wednesday', 4 => 'Thursday',\
  \ 5 => 'Friday', 6 => 'Saturday');\n```\n\n注意，最后一对后面的逗号必须存在。现在我们已经有了哈希，可以查看 `each`、键和值，并看看它们与\
  \ `%day_of_week` 的关系。\n\n`each` 返回一个包含两个元素的列表，由哈希中下一个键和值组成。`each` 函数的独特之处在于，你可以通过连续调用\
  \ `each` 来遍历整个哈希。在遍历哈希时，你不向其中添加元素，但可以从中删除元素。\n\n`keys %hash` 返回哈希的所有键（keys）。\n\n\
  `values %hash` 返回哈希的所有值（values）。\n\n\n\n\n\n此函数返回哈希中的所有值。\n\n此示例列出了我们 `%day_of_the_week`\
  \ 哈希中的每一个值。\n\n```perl\nwhile (($key, $value) = each %day_of_the_week) {\n    print\
  \ \"$key has value $value\\n\";\n}\n```\n\n该程序的运行结果如下：\n\n```\n0 has value Sunday\n\
  1 has value Monday\n2 has value Tuesday\n3 has value Wednesday\n4 has value Thursday\n\
  5 has value Friday\n6 has value Saturday\n```\n\n# 系统操作\n\n对于这些函数来说，“系统操作”并不是一个准确的术语。基本上，它们是从系统中读取某些内容，或者执行一次系统调用。我们也可以在这里包含其他函数（例如\
  \ `exec`、`fork`、`kill` 和 `times`），但这些是最基本的。\n\n### time\n\n`time` 返回自 UNIX 诞生（1970\
  \ 年 1 月 1 日世界时）以来的秒数。它可以用于确定文件自上次访问以来已经多久，或者完成一项任务需要多久。`time` 的一个常见功能是作为 `localtime`\
  \ 的参数。关于如何使用此函数的示例请参见 `localtime` 函数章节。\n\n### localtime\n\n此函数返回一个包含当前时区修正后时间的九元素列表。这九个元素如下表所示，以及它们可能的值。\n\
  \n| 元素 | 可能的值 |\n| :--- | :--- |\n| seconds | 0..59 |\n| minutes | 0..59 |\n| hour\
  \ | 0..23 |\n| day | 1..31 |\n| month | 0..11 |\n| year | 当前年份减去 1900 |\n| day of\
  \ the week | 0..6 |\n| day of the year | 0..364 |\n| 是否为夏令时 | 0..1 |\n\n以下示例获取当前日期并打印时间、日期、星期、一年中的第几天以及是否为夏令时。你会注意到为了处理以零开头的值而的一些修改。此外，夏令时被更改为了\
  \ True 或 False。\n\n```perl\n#!/usr/bin/perl\n($sec, $min, $hour, $mday, $year, $wday,\
  \ $yday, $isdst) = localtime(time);\n$year+=1900;\n$yday++;\nif ($sec < 10) { $sec\
  \ = \"0\".$sec; }\nif ($min < 10) { $min = \"0\".$min; }\nif ($hour < 10) { $hour\
  \ = \"0\".$hour; }\nif ($isdst) {$isdst = \"True\"} }else { $isdst = \"False\" }\n\
  %tday = (\n    0 => 'Sunday',\n    1 => 'Monday',\n    2 => 'Tuesday',\n    3 =>\
  \ 'Wednesday',\n    4 => 'Thursday',\n    5 => 'Friday',\n    6 => 'Saturday',\n\
  );\n%tmonth = (\n    0 => 'January',\n    1 => 'February',\n    2 => 'March',\n\
  \    3 => 'April',\n    4 => 'May',\n    5 => 'June',\n    6 => 'July',\n    7 =>\
  \ 'August',\n    8 => 'September',\n    9 => 'October',\n    10 => 'November',\n\
  \    11 => 'December',\n);\nprint \"Time:  $hour:$min:$sec\\n\";\nprint \"Today:\
  \  $tmonth{$mon} $mday,$year\\n\";\nprint \"Day of the week: $tday{$wday}\\n\";\n\
  print \"Day of the year: $yday\\n\";\nprint \"Daylight Savings?: $isdst\\n\";\n\
  ```\n\n正如你所想象的，`time` 和 `localtime` 函数非常适合日志、报告以及其他需要知道事件发生时间的应用程序。\n\n```perl\n\
  system(` `)\n```\n\n\n\n\n\n`system` 命令允许 Perl 程序访问系统。调用系统有两种方法：第一种是使用 `system`\
  \ 命令；第二种是将命令放在反引号（back-ticks）之间。进行系统调用的问题在于它极大地限制了代码的可移植性。`system` 命令的优点之一是它会阻塞\
  \ `SIGINT` 和 `SIGQUIT`，防止程序被杀死。此外，通过 `system` 调程序执行结果可以保存到变量中，允许程序检查结果并根据结果执行任何必要的步骤。这里列出了非常简单的示例。幸运的是，Perl\
  \ 内部有执行此任务的方法；因此，你可以保持程序的移植性。\n\n```perl\n$cur_dir = `ls`;\n```\n\n实际调用系统命令看起来如下：\n\
  \n```perl\n$cur_dir = system (ls); # 括号不是必须的。\n```\n\nPerl 假设你清楚自己在做什么，因此它允许你随心所欲。像\
  \ `$remove = \\`rm -r \\` 这样的命令可能会毁掉整个系统！\n\n## 变量操作\n\n变量操作被分为几不同的组。首先是自增和自减符号（`++`\
  \ 和 `--`）、点（`.`），然后是 `split` 和 `join`。最后是 `chomp` 命令。我们将按照这个顺序讨论这些主题。\n\n### ++\
  \ 和 --\n\n这两个符号将变量的值加一或减一。以下示例展示了将变量 `$penny` 增加一，然后减去一。\n\n```perl\n$penny++; $penny--;\n\
  ```\n\n你会发现这比下面的写法快得多：\n\n```perl\n$penny += 1;\n$penny = $penny - 1;\n```\n\n###\
  \ .\n\n点（`.`）用于连接字符串。给定以下字符串：\n\n```perl\n$string1 = \"University of Kentucky\"\
  ; $string2 = \"are the best players ever!\";\n$string3 = $string1.$string2;\n```\n\
  \n在打印时会产生以下输出：\nUniversity of Kentuckyare the best players ![](img/4505ed21b36efb4eb4df5206fc03bad.gif)ever!\n\
  \n连接时没有在字符串之间留空格；因此，我们必须手动添加。可以这样做：\n\n```perl\n$string3 = $string1.\" \".$string2;\n\
  ```\n\n在打印时会产生以下结果：\nUniversity of Kentucky are the best players ![](img/4505ed21b36efb4eb4df5206fc03bad.gif)ever!\n\
  \n如果连接数字字符串，它们会像文本一样拼接在一起；这并不是相加。例如，以下行会生成 123456：\n\n```perl\n$a=123; $b=456;\n\
  $c=$a.$b;\nprint $c;\n```\n\n### split\n\n`split` 用于将分隔符字符串转换为列表。\n\n```perl\nsplit\
  \ /PATTERN/,EXPR,LIMIT;\nsplit /PATTERN/,EXPR;\nsplit /PATTERN/;\n```\n\n该函数扫描由\
  \ `EXPR` 提供的字符串，寻找由 `/PATTERN/` 指定的分隔符。然后将该字符串分割为一组子字符串。如果 `LIMIT` 设置为非零正整数，则字符串被分割成不超过于该数量的子字符串。在此过程中，匹配到的\
  \ `/PATTERN/` 部分会消失。\n\n以下示例展示了如何将 `/etc/passwd` 文件分割成七不同的字段。账户行是以冒号分隔的，因此我们根据冒号模式进行搜索。\n\
  \n```perl\n($user,$password,$uid,$gid,$gcos,$home,$init_prog) = split (/:/, @passwd);\n\
  ```\n\n因此，`split` 将大字符串拆分为较小的字符串。`join` 函数则取小字符串并将它们连接成大字符串。\n\n### join\n\n```perl\n\
  join EXPR,LIST;\n```\n\n`join` 获取字符串并将它们连接成单个字符串，并使用 `EXPR` 作为分隔符。这与 `split` 函数相反。以下示例获取了与密码条目相关的七个元素，并使用冒号作为\
  \ EXPR 将它们连接在一起。\n\n```perl\n$entry = join (':',$user,$password,$uid,$gid,$gcos,$home,$init_prog);\n\
  ```\n\n\n\n\n# chomp\n\n`chomp VARIABLE`; `chomp LIST`; `chomp;`\n\n`chomp` 用于移除所选字符串（或）末尾的换行符。如果省略了\
  \ `VARIABLE` 或 `LIST`，它将处理 `$_`。`chomp` 的一个常见用途是移除来自键盘输入的换行符。\n\n```perl\nprint\
  \ \"Spell out the answer to this math problem: 2 + 2= Answer: \";\n$answer = <STDIN>;\n\
  chomp $answer;\nif ($answer eq \"four\" || $answer eq \"Four\") { \n    print \"\
  Right! The answer is four (4)\" \n}\nelse { \n    print \"Sorry! The answer is four\
  \ (4)\" \n}\n```\n\n如果你注释掉 `chomp $answer` 这一行，那么无论你输入什么答案，结果都将为假，因为我们的 if 语句正在寻找的是\
  \ \"four\" 或 \"Four\"，而这两个字符串中都不包含换行符。\n\n## 调试你的脚本 (-d)\n\nPerl 调试器并不是一个独立的程序。相反，你通过带有\
  \ `-d` 选项调用 Perl 来进入调试模式（Debug mode）。在调试模式下，你能够检查源代码、设置断点、转储函数调用栈、修改变量值等。本节并不会详述调试器的所有功能，也不会提供所有可用命令。本节的作用是向你介绍基础调试命令，并展示如何获取更多信息。具体来说，这里展示的内容包括如何设置、列出和删除断点；如何单步执行程序；如何检查和修改变量的值；如何获取帮助。\n\
  \n我将使用以下短程序作为描述调试器的基础。该程序名为 `rep.pl`，用于在文件中搜索并替换字符串。你会注意到我添加了 `-d` 选项，以便 Perl 在调试模式下运行。\n\
  \n```perl\n#!/usr/bin/perl -d\n# 打开文件，替换字符串的所有出现处。\n# Usage: rep string string2\
  \ file\n$file = @ARGV[2];\n$search = @ARGV[0];\n$replace = @ARGV[1];\nif ($file\
  \ eq \"\") {\n    print \"Usage: rep.pl [search] [replace] [file]\\n\";\n}\nelse\
  \ {\n    open(FILE, \"$file\") or die \"File not found: $!\";\n    @stuff = <FILE>;\n\
  \    close FILE;\n    foreach $line (@stuff) {\n        $line =~ s/$search/$replace/g;\n\
  \        push(@temp, $line);\n    }\n    open(FILE, \">$file\");\n    print FILE@temp;\
  \ close FILE;\n}\n```\n\n当我运行这个程序时，Perl 会以调试模式启动。这意味着代码会被编译。如果存在编译错误（例如缺少分号），调试器将不会运行。假设没有编译错误，调试器将会启动，并看起来如下所示：\n\
  \n```\nLoading DB routines from perl5db.pl version 1 Emacs support available.\n\
  Enter h or h' for help.\nmain::./rep.pl:6): $file = @ARGV[2];\nDB<1> By the way,\
  \ I ran the program with the following command:\nrep.pl david\n```\n在我们查看某些字符串的值以及程序本身的最终输出时，这将非常重要。\n\
  \n### 列出代码 (-l)\n\n我想做的第一件事是列出我的代码。输入字母 l 即可列出代码。这会产生以下内容：\n\n```\nDB<1> l 6> $file\
  \ = @ARGV[2];\n7:   $search = @ARGV[0];\n8:   $replace = @ARGV[1];\n9:   if ($file\
  \ eq \"\") {\n10:    print \"Usage: rep.pl [search] [replace] [file]\\n\";\n11:\
  \ }\n12: else {\n13:    open(FILE, \"$file\") or die \"File not found: $!\";\n14:\
  \    @stuff = <FILE>;\nDB<1>\n```\n\n调试器用 `==>` 指向当前行（第 6 行）。你会注意到它跳过了程序开头的注释并到了第\
  \ 6 行。默认情况下，调试器列出 10 行代码。你可以通过放置一个起始行号，加上一个连字符和你想打印的行数来指定任何范围。因此，如果我告诉它我想打印程序的前三行，它看起来像这样：\n\
  \n```\nDB<2> l 1-3\n#!/usr/bin/perl -d\n2    #\n3    # 打开文件，替换字符串的所有出现处。\n```\n\n\
  ### 执行一行代码 (-n)\n\n在我列出代码之后，现在我想 own 执行第一行。我通过输入字母 n 来执行第一行。这告诉调试器执行该行并进入下一行。产生了以下内容：\n\
  \n```\nmain::./rep.pl:7):    $search = @ARGV[0];\nDB<3>\n```\n\n### 打印变量值\n\n在此时，我告诉它执行接下来的两行代码。这给了我其他可以处理的内容。现在我想知道变量\
  \ `$_`、`$ARGV[0]`、`$ARGV[1]` 和 `$ARGV[2]` 的值。\n\n```\nDB<3> print $_\nDB<4> print\
  \ $ARGV[0]\ndavid\nDB<5> print $ARGV[1]\nDB<6> print $ARGV[2]\nDB<7>\n```\n\n\n\n\
  \n正如我所料的，`$_` 的值是空的。`$ARGV[0]` 的值是 `\"david\"`，而 `$ARGV[1]` 和 `$ARGV[2]` 也是空的。我想把\
  \ `$ARGV[1]` 的值改为 David 而不是空。\n\n我通过告诉变量它应该是什么来实现此点的，如下所示：\n\n```perl\nDB<7> $ARGV[1]=\"\
  David\"\nDB<8> print $ARGV[1]\nDavid\n```\n\n事实上，你可以从调试器命令行执行任何 Perl 命令，它将影响你正在运行的程序。唯一的限制是，每个提示符只能输入一条命令，并且在命令末尾不需要加分号。\n\
  \n### 断点 (Breakpoints)\n\n你可以使用断点在程序中设置一个或多个停止点。断点一旦设置，它就会告诉调试器在运行到这一行时停止执行。在我们的示例中，我想在第\
  \ 10 行设置一个断点。我希望程序停止在 `if` 语句处，这样我就可以确定具体的值了。要设置断点，你使用字母 `b` 后加上行号。可选的是，你还可以在那里放置一个条件。如果放置了条件，只有当运行到该行且条件为真时，断点才会停止程序执行。因此，我想做的是设置一个当\
  \ `$file` 等于 `\"\"` 时停止程序的断点。该命令看起来如下：\n\n```perl\nDB<5> b 10 $file eq \"\" DB<6>\
  \ l 6-15\n6=> $file = $ARGV[2];\n7  $search = $ARGV[0];\n8  $replace = $ARGV[1];\n\
  9\n10 b if ($file eq \"\") {\n11 print \"Usage: rep.pl [search] [replace] [file]\"\
  ;\n12\n13 else {\n14 open(FILE, \"$file\") die \"File not found\";\n15 @stuff =\
  \ <FILE>;\n```\n\n你注意到第 10 行看起来不同吗？它的行号旁边有一个 `b`。这就是调试器指示断点的方式。现在我想让调试器运行到遇到断点的地方。我通过输入字母\
  \ `c` 来实现。我在 `c` 后面跟着一个 `w`，这样我就可以看到当前行周围的代码窗口。\n\n```perl\nDB<7> c main::./rep.pl:10):\
  \ if ($file eq \"\") {\nDB<7> w\n7  $search = $ARGV[0];\n8  $replace = $ARGV[1];\n\
  9\n10=>b if ($file eq \"\") {\n11 print \"Usage: rep.pl [search] [replace] [file]\"\
  ;\n12\n13 else {\n14 open(FILE, \"$file\") die \"File not found\";\n15 @stuff =\
  \ <FILE>;\n16 close FILE;\n```\n\n现在我想再看一眼我的变量 `$ARGV[0]` 和 `$ARGV[1]`，所以我输入了以下命令：\n\
  \n```perl\nDB<7> print $ARGV[0] $ARGV[1];\n```\n\n记得，我说过过每行一条命令。在这里我写了两个命令。我告诉它打印两个值。这里是命令的结果：\n\
  \n```text\nScalar found operator expected at (eval) line 2, at end of line\neval('@@,\
  \ $, /, @W) = @saved;package main; $@ = $@DB::db_stop;\nprint $ARGV[0] $ARGV[1];\n\
  called at /usr/lib/perl5/perl5db.perl line 153\nDB::eval called at /usr/lib/perl5/perl5db.perl\
  \ line 1062\nDB::DB called at ./rep.pl line 10\n(Missing operator before ?)\neval('@@,\
  \ $, /, @W) = @saved;package main; $@ = $@DB:\nSegmentation fault\n```\n\n嗯，这告诉我了两点。首先，每行使用一条命令。其次，它告诉我如果发生错误，就会发生段错误（segmentation\
  \ fault）， Perl 程序将会崩溃。所以，我重启重试。我重新添加了断点，以便保持与之前相同的条件。但我现在意识到，我不想要那个断点。我现在需要删除它。要删除断点，你输入小写的\
  \ `d`。如果 `d` 后面跟着行号，则会移除该行的断点。大写的 `D` 将删除所有断点。\n\n```perl\nDB<2> d 10\n6  $file\
  \ = $ARGV[2];\n7  $search = $ARGV[0];\n8  $replace = $ARGV[1];\n9\n10 if ($file\
  \ eq \"\") {\n11 print \"Usage: rep.pl [search] [replace] [file]\";\n12\n13 else\
  \ {\n14 open(FILE, \"$file\") die \"File not found\";\n15 @stuff = <FILE>;\n```\n\
  \n我在第 10 行的断点现在消失了。我添加了一些断点，现在我想列出它们。我通过大写的 `L` 来实现，如下：\n\n```perl\nDB<7> L ./rep.pl:\n\
  6  $file = $ARGV[2];\n  break if (1)\n11 print \"Usage: rep.pl [search] [replace]\
  \ [file]\";\n  break if (1)\n```\n\n似乎我设置了三个断点：第 6 行、11 行和 15 行。用一个大写的 `D` 将删除它们所有的，我就准备就绪了。\n\
  \n```perl\nDB<7> D Deleting all breakpoints...\n```\n\n\n\n\n调试器还可以做很多事情。要详细介绍其中所有的功能需要用一整个章节的内容。因此，在我们结束关于调试器的章节之前，让我向你介绍一个进一步理解调试器的来源。这个来源就是内置在调试器内部的帮助功能。如果你只输入一个\
  \ `h`，你将获得一个所有可用命令选项的详细列表。如果你像我一样，阅读速度快到跟不上它在屏幕上滚动的速度。因此，如果你输入 `h h`，它将以不同的格式提供相同的列表。这种格式是双列列表，应该可以适应单个屏幕。每个命令后面都有一个关于该命令功能的简短描述。我看到\
  \ `v` 显示模块的版本，例如：\n\n```\nDB<10> v 'Term/ReadLine.pm' => '/usr/lib/perl5/Term/ReadLine.pm'\n\
  'dumpvar.pl' => '/usr/lib/perl5/dumpvar.pl'\n'perl5db.pl' => '1 from /usr/lib/perl5/perl5db.pl'\n\
  ```\n\n最后，当你完成时，只需输入 `q` 即可退出程序。\n\n# 结语\n\nPerl 是一种功能完备且强大的语言，它结合了 C 语言的力量和 Shell\
  \ 编程的易用性。然而，Perl 并不止于此。Perl 支持面向对象。Perl 可以与其他语言结合，包括 C、TK 和 Java。它易于使用，并且有强大的后端支持。\n\
  \n有关 Perl 的更多信息，请访问 Perl 官网 www.perl.com。你可以在那里找到 Perl 的最新版本以及 Perl 存档网络（CPAN），其中有大量的代码，大部分代码与\
  \ Perl 本身采用相同的版权许可。你还可以在那里找到常见问题解答（FAQs）。如果你遇到困难，也可以去 `comp.lang.perl.misc` 新组并在那里提问。\n\
