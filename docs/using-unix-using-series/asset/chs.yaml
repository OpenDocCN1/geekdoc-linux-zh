  \ | GNU/Linux |\n| Linus Torvalds | Linux kernel |\n| Debian | Debian GNU/Linux\
  \ |\n\n列表并非完整。例如，Bull 和摩托罗达等其他公司销售使用 `AIX` 操作系统的计算机系统。Unisys 销售运行 `UnixWare` 的计算机。其他备受尊敬的公司也销售\
  \ UNIX 和 Linux 系统。列出的某些产品可能是已被新产品取代的老产品。列出的某些公司可能不再销售所列的特定 UNIX 产品。\n\n### 非 AT&T\
  \ UNIX\n\n当你观察 UNIX 系统首次通电时，你可能会看到一长系列版权声明，感谢多年来为 UNIX 贡献软件的各种公司和组织。你可能看到的版权声明之一来自加州大学摄政委员会，感谢他们在伯克利大学在\
  \ UNIX 上所做的大量工作。在该大学产生的 UNIX 被称为 `BSD`，即伯克利软件发行版。\n\n第 21 页\n\n许多 BSD 工具已成为所有 UNIX\
  \ 软件包的标准。FreeBSD 是 BSD 的扩展，其中受版权保护的 AT&T UNIX 代码已被删除或重写，以便其可以在没有通常 UNIX 版税和源代码限制的情况下发行。有关更多完整信息，请参阅网络上的\
  \ `www.freebsd.org`。\n\nLinus Torvalds 编写了自己的 UNIX 内核，这是操作系统的主要执行部分。他将内核命名为 `Linux`；尽管它模拟了\
  \ UNIX 的主要功能，但它没有使用任何限制的代码。他的内核与自由软件基金会的 `GNU` 项目工具一起发行，该项目代表 `GNUs` 而非 UNIX。该项目的目标是创建一个自由的\
  \ UNIX 系统。它创建了许多重要的自由软件工具，如 `GNU C Compiler` 和 `GNU emacs` 文本编辑器。将 `Linux` 内核与 `GNU`\
  \ 工具结合，最终创建了一个完全没有 AT&T UNIX 版权和版税的完整类 UNIX 系统。此版本的 UNIX 可用于商业目的。它受名为 `GPL` 的特殊许可限制，该许可防止操作系统的源代码受到限制或版权化。有关更多完整信息，请参阅\
  \ `www.gnu.org` 和 `www.linux.org`。\n\n商业 UNIX 系统通常运行在支持大量用户的昂贵计算机上。它们通常由计算机操作人员维护。普通用户甚至看不到\
  \ UNIX 机器，只能看到连接在上面的终端。所有的系统管理功能都由计算机人员完成。普通用户甚至无法查看大多数系统配置文件。相反，这些自由的非 AT&T UNIX\
  \ 系统允许 UNIX 加载到家用计算机上。用户可以安装并管理自己的个人 UNIX 系统。事实上，他们通常没有选择，因为家庭很少有自己的数据处理部门。这些自由\
  \ UNIX 系统可以作为 Web 服务器、电子邮件处理器或 `DNS` 服务器连接到互联网。一些公司为自由 UNIX 添加新模块，使其与新硬件同步。一些公司提供商业支持。\n\
  \n第 22 页\n\n尽管如此，在大型企业中使用自由 UNIX 仍然存在犹豫情绪。尽管如此，这种 UNIX 在 UNIX 的演变中起着重要作用。\n\n###\
  \ UNIX 如何区别 MS-DOS/Windows\n\n从一开始开始，UNIX 被设计为一种多用户、分时操作系统，可以高效处理多个用户。个人电脑（或 PC）是沿着完全不同的路径开发的。PC\
  \ 有一个键盘、一个屏幕和一个鼠标；因此它们仅适应单用户。在 MS-DOS 或 Windows 下支持单用户的同一处理器，在 UNIX 下可能可以支持 100\
  \ 个用户。\n\nWindows 软件的外观和感受与传统的基于字符的 UNIX 软件非常不同。如果 Windows 用户启动任务，处理器通常会有大量的剩余功率；因此，Windows\
  \ 用户习惯了忙碌的屏幕和以图形方式显示任务进展的彩色指示。相比之下，传统的 UNIX 在任务完成之前输出的消息很少。请记住，当 UNIX 运行你的任务时，它可能同时运行着其他\
  \ 100 个任务。任何浪费的努力或输出都会减慢他人的速度。\n\n今天，UNIX 和 Windows 之间的差异不再那么明显了。许多 UNIX 系统是单用户工作站，用户利用鼠标点击图标并操纵窗口。某些\
  \ Windows 系统直接为从串口或另一台 Windows PC 登录的用户运行任务。某些 Windows NT 和 UNIX 服务器完全没有直接用户。它们为网络提供服务，如打印共享、文件共享、电子邮件或互联网访问。许多\
  \ UNIX 系统可以运行 Windows 程序（例如，通过 `WABI`）。许多 Windows 系统可以运行 UNIX 工具，如 `vi`、`awk` 和\
  \ `shell`（通过 `MKS` 工具）。\n\n第 23 页\n\n\n\n\nUNIX 和 Windows 之间的一个主要区别是用户从哪里获取系统应用程序。在本地\
  \ PC 商店，可以获得广泛的通用实用程序。无论你从事什么行业，文字处理、电子表格和支票簿对账等程序通常都是实用的。相反，你很少能在 PC 商店找到任何 UNIX\
  \ 应用程序。UNIX 的强大之处之一是它是为特定行业编写自定义软件的极佳平台。UNIX 支持许多编程语言、数据库和程序开发工具。它是一个开放系统，因此可以运行在许多不同的硬件系统上。UNIX\
  \ 开发人员通常研究某一个行业，例如牙科诊、木材店、汽车配件店或花店。他们创建一系列应用程序，将该特定业务所需的所有功能计算机化，并使用所需的术语、特殊规章、表格和会计方法。我们可以将这些称为**垂直应用**：针对一个目标业务的完整应用集；而\
  \ PC 商店通常销售的是**水平应用**，即一个应用程序具有足够的通用性，适用于广泛的业务。软件开发者使用 UNIX 创建一个交钥匙系统，即终端用户只需转动钥匙开启系统，然后使用提供的自定义程序来运行其业务。\n\
  \n如今，Windows 系统正在相互联网，以提供 UNIX 提供的多用户功能。软件开发者正在创建 Windows 图形多用户程序，其视觉效果和体验比传统的 UNIX\
  \ 字符应用程序更时尚。UNIX 可以通过特殊的 X Windows 工作站支持图形应用程序；然而，这些工作站无法运行 PC 商店的 Windows 软件。在太阳科技（Sun\
  \ Microsystems）及其对 Java 语言的支持下，人们正努力利用万维网的成功提供多用户图形 Web 应用程序。通过 Web 浏览器运行应用程序提供传统\
  \ UNIX 字符应用程序所缺乏的时尚图形视觉效果的一种方法。这些应用程序可以在局域网上运行，也可以在互联网上运行。它们可以在低成本的网络计算机上运行，这些是专门为运行浏览器应用程序而设计的最小计算机站。主机服务器可以是\
  \ Windows 或 UNIX；这对于软件开发公司非常有吸引力。基于浏览器的应用程序会成为新的应用标准吗？只有时间能给出答案……\n\n## UNIX 标准与修订\n\
  \n表 1.1 列出了许多修改 UNIX 并以 UNIX 以外的名称发行操作系统的公司，例如 `HP-UX` 或 `SunOS`。在书中，你有时会看到完成某项任务的两种或三种方法，因为某些类型的\
  \ UNIX 计算机只能以第一种方式完成，某些只能用第二种，而某些只能用第三种。在一家公司里，你可能经常使用几种不同类型的 UNIX 服务器，其命令存在此类差异。如果你连接到互联网等广域网，你会遇到更多\
  \ UNIX 主机，其 UNIX 与你习惯的略有不同。起初你可能会发现这种多样性令人困惑。\n\n作为回答，让我描述一下 UNIX 就像汽车收音机。所有的汽车收音机都可以播放音乐、调节音量和换台。然而，它们在旋钮、按钮或滑块的位置和使用上有很大差异。音量控制并不总在左侧。但如果你租了一辆车，通常仍然可以让收音机工作。人们习惯于拨弄控制装置，直到实现他们想要的功能。同样，当你在一个命令与你习惯的\
  \ UNIX 略有不同的系统上工作时，不需要恐慌。在了解主要变体后，如果命令以某种方式不起作用，你只需尝试其他标准方法。\n\n标准化 UNIX 的努力随处可见，试图在不同的硬件和供应商平台上统一命令。`POSIX`\
  \ 是来自一个名为 `IEEE` 的组织的标准，许多类型的 UNIX 都遵循该标准。国际组织 `X/Open` 提供了 `X3`、`X4` 和 `Spec11`\
  \ 等 UNIX 标准。许多公司如 `IBM`、`HP` 和 `Sun` 采用了通用桌面环境 (`CDE`) 来为 UNIX 提供统一的外观和体验。`SVID`（System\
  \ V Definition）是另一种让 UNIX 更统一的标准。它有助于了解 UNIX 如何演进，以预判在未知系统中可能会出现哪些变化。\n\n最初，UNIX\
  \ 是在 AT&T 贝尔实验室开发的，他们将这些名称赋予 AT&T UNIX 的连续修订版本：\n- 第六版 (Sixth edition)\n- 第七版 (Seventh\
  \ edition)\n- `System III`（他们跳过了 `System IV`）\n- `System V`（罗马数字五）\n- `System V,\
  \ Release 2`（缩写为 `SVR2`）\n- `System V, Release 3` (`SVR3`）\n- `System V, Release\
  \ 4` (`SVR4`）\n\n`SVID` 描述了基于 AT&T `System V UNIX` 的 UNIX 标准。\n\n在 AT&T 开发的同时，加州大学伯克利分校正在修改\
  \ UNIX 的早期版本。他们的 UNIX 版本是 `BSD`，代表伯克利软件发行（Berkeley Software Distribution）。`BSD`\
  \ 为 UNIX 增加了许多重要功能，但其中一些功能与 AT&T 添加的新功能重叠。今天，所有 UNIX 系统都可以根据它们基于 System V UNIX 还是\
  \ BSD UNIX 的程度进行分类。目录 `/etc/rc2.d` 的存在表示基于 System V 的 UNIX，而该目录的缺失通常表示基于 BSD 的 UNIX。以下是某些\
  \ System V 和 BSD 之间特定命令差异的示例：\n\n\n\n\n\n# System V 与 BSD 打印\n\n| System V | BSD\
  \ |\n| :--- | :--- |\n| `shutdown -g3 -i0 -y` | `shutdown -h +3` |\n| `lp -dlaser2\
  \ -n2 acme` | `lpr -Plaser2 -#2 acme` |\n\n如果你的系统不支持用于打印的 System V `lp` 命令，它可能使用的是\
  \ BSD 的 `lpr` 命令。某些系统同时支持这两个打印命令。例如，SunOS rev 4 是一个 BSD UNIX 变体。其下一个主要版本 SunOS rev\
  \ 5 从 BSD 切换到了 SVR4，该版本结合了 (System V) SVR3、XENIX、BSD 和 Sun 的特性。SunOS rev 5 仍然支持\
  \ rev 4 BSD 版本的工具作为可选替代方案。SunOS rev 5 的用户可以自定义他们的 UNIX 会话，以便默认使用 System V、BSD 或\
  \ XPG4 版本的工具。（这是通过更改 `PATH` 变量来实现。）\n\n## 另请参考\n- *关于 `PATH` 变量的更多信息，请参阅第 97 页*\n\
  \n## AT&T 之后的 UNIX\n最初，AT&T 开发并许可了 UNIX，控制着限制性的源代码，并向销售 UNIX 的公司收取版税。1991 年左右，AT&T\
  \ 创建了一家名为 UNIX System Laboratories 的公司负责此。1993 年左右，Novell 从 AT&T 手购买了 UNIX。Novell\
  \ 整合了部分 NetWare 技术并创建了基于 SVR4 的 UnixWare。Novell 将 UNIX 商标转给了 X/Open Company Ltd.，该公司发布标准并认证某个\
  \ UNIX 版本是否符合标准。Novell 保留了许可 UNIX System V 源代码的权利。1995 年左右，Santa Cruz Operation\
  \ (SCO) 从 Novell 手购买了 UNIX。随后，SCO 有两个主要的 UNIX 支持分支：它自己的 OpenServer 和 UnixWare。今年（1998\
  \ 年），SCO 与若干主要的 UNIX 供应商联合发布 UnixWare 7，该版本包含了 UNIX 的下一个主要版本：SVR5，这是一个 64 位 UNIX\
  \ 操作系统。这并不是唯一的 64 位 UNIX 操作系统，因此 UNIX 市场仍然存在着良性竞争。\n\n## 你必须掌握的重要 UNIX 概念\n以下章节涵盖了你需要理解的\
  \ UNIX 系统的基本特性。\n\n### 内核 (Kernel)\n在图 1.1 中，你可以看到 UNIX 系统表示为三个同心圆。最内层的圆被称为内核，指的是操作系统的核心。内核是操作系统中最隐藏的部分。它包含了被称为驱动程序的代码；这些程序允许系统控制所有硬件、磁盘等。\n\
  \n![UNIX kernel, utilities, and shell](img/8bf015b4f90d6fffa18dc.gif)\n\n下一个圆代表系统工具和命令。当你运行像\
  \ `vi` 这样的命令时，它使用内核内部的程序在你的屏幕上显示输出、从键盘获取输入并在磁盘上保存文件。\n\n### UNIX 外壳 (Shell)\n最外层的圆代表\
  \ UNIX Shell。Shell 是一个接受用户命令并启动所请求命令的程序。Shell 是用户看到的 UNIX 操作系统的全部——就像你观察鸡蛋或坚果时，你看到的只是外层，而看不到内部的复杂性。Shell\
  \ 不仅仅是传递你输入的命令。Shell 允许用户在后台运行命令；这意味着在命令运行时用户的工作站不会被占用。Shell 允许用户使用通配符来指示应该处理哪些文件。Shell\
  \ 实际上支持一种完整的编程语言，允许根据其他命令的结果执行条件执行命令，并使用循环来重复命令序列。\n\nUNIX 上实际上有许多 Shell 程序，不同的用户可以同时使用他们偏好的、不同的\
  \ Shell。下表中的前三个 Shell 通常在大多数商用 UNIX 系统上可用。\n\n### 表 1.2 可用的 UNIX Shell\n\n| Shell\
  \ 名称 | 命令 |  |\n| :--- | :--- | :--- |\n| Bourne shell | `sh` | 在所有 UNIX 系统上可用 |\n\
  | C shell | `csh` | 类似于 C 语言的语法 |\n| Korn shell | `ksh` | Bourne shell 的超集 |\n|\
  \ Bash shell | `bash` | 包含 C shell 和 Korn shell 的特性 |\n| tcsh shell | `tcsh` | 类似于\
  \ C shell |\n\n由于每个 Shell 都是系统工具，你只需要输入表 1.2 所示的命令即可开始使用特定的 Shell。\n\n\n\n\n尽管 C\
  \ shell 在用户便利性方面比 Bourne shell 有所改进，但它的某些语法与 Bourne shell 不兼容。由于 Bourne shell 脚本非常常见，C\
  \ shell 用户必须学习这两种 shell 的语法并避免混淆它们。\n\nKorn shell 提供了与 C shell 相似的用户便利性。它具有强大的命令行编辑能力（这是\
  \ C shell 并不具备的），可以使用 `vi` 或 `emacs` 编辑命令，这允许你检索之前的命令、对它们进行编辑并执行。Korn shell 是 Bourne\
  \ shell 的超集，因此它们之间没有语法冲突。Korn shell 比 Bourne shell 提供了更强大的编程结构。然而，如果你需要在未提供 Korn\
  \ shell 的旧版 UNIX 系统上运行程序，则应避免使用这些结构。\n\n## Shell 提示符\n\n要使用 UNIX 系统，系统管理员（称为 `root`）必须为你创建一个供使用的账户。UNIX\
  \ 会话的开始看起来大致如下：\n\n```\nacme login: fred Password:\nTERM = (vt100)\n$ _\n```\n\n\
  在登录提示符处，你必须识别身份并输入密码（出于安全考虑，输入时将不会显示）。美元符号（`$`）是 shell 提示符，表示 UNIX 已准备好让你输入命令。美元符号（`$`）后面的下划线字符（`_`）代表等待输入的光标。以下是标准的\
  \ shell 提示符：\n\n- Bourne shell 或 Korn shell：`$`\n- C shell：`%`\n- 无论什么 shell 的 root\
  \ 登录：`#`\n\nshell 提示符可以自定义包含你的系统名称、当前目录或其他字符。以下是你可能会遇到的一些 shell 提示符：\n\n```\nacme$\
  \ _ /usr/fred> _\n[acme] _\n```\n\n你必须处于 shell 提示符处才能输入命令。你也可以像第 5 章描述的通过图形界面（GUI）使用\
  \ UNIX。警告：`root` 登录是全能系统管理员。如果你是新手，请远离 `root` 登录。如果你以根身份出错，可能会崩溃或损坏你的 UNIX。\n\n\
  ## Shell 变量\n\nshell 支持变量。单词、短语和其他信息可以保存到命名变量并在以后使用。某些变量对 shell 有特殊含义，并控制系统的运行。例如，`TERM`\
  \ 变量应该设置为你正在使用的终端类型；否则，屏幕输出可能包含乱码。许多 shell 变量使用全大写字母，以避免与 UNIX 命令（通常为小写）混淆。\n\n\
  ## 标准输出、标准错误、标准输入\n\nUNIX 下程序程序不会直接将消息显示在屏幕上。相反，它们调用一个特殊的输出程序，称为标准输出（简称 `stdout`）。`stdout`\
  \ 通常设置为输出到你的屏幕，但 `stdout` 可以轻松重定向到打印机等设备或磁盘文件。这是 UNIX 真正优雅的元素之一。程序和工具将其输出到 `stdout`，因此它们不知道输出实际上去了哪里。shell\
  \ 可以根据需要将 `stdout` 重定向到设备或文件。\n\n```\ncal\n$ cal > /dev/lp0\n$ cal > /usr/year\n\
  ```\n\n在第一个示例中，`cal` 将日历输出到 `stdout`。在第二个示例中，大于号（`>`）将 `stdout` 重定向到打印机设备（`/dev/lp0`）。在第三个示例中，`stdout`\
  \ 被重定向到磁盘文件（`/usr/year`）。\n\n还有一个用于显示错误消息的特殊程序。这被称为标准错误（简称 `stderr`）。`stderr` 通常发送到你的屏幕，以便你可以看到任何错误消息。但同样，shell\
  \ 可以轻松地将 `stderr` 重定向到设备或文件，而不受 `stdout` 的影响。\n\n有一个用于执行输入的特殊程序。这被称为标准输入（简称 `stdin`）。如果程序从\
  \ `stdin` 获取输入，shell 可以通过从设备或磁盘文件重定向来提供这些输入。例如，如果一个工具在开始运行之前总是问三个问题，你可以将问题的答案放入磁盘文件，然后重定向该磁盘文件以提供输入，这样你就不需要自己输入内容了。\n\
  \n## 管道与过滤器\n\n一个命令的 `stdout` 可以被重定向为另一个命令的 `stdin`，创建从一个命令到另一个命令的直接管道。我们称这种操作为*管道*，并使用竖线（`|`）作为管道符号。\n\
  \n```\nls | pg\n```\n\n\n\n在前面的示例中，`ls` 是列出当前文件的 UNIX 命令。如果你单独运行 `ls` 且文件超过 25 个，某些名称会在你读到它们之前就超出屏幕。`pg`\
  \ 是一个逐页显示输出的 UNIX 命令。它在显示下一页之前会等待用户输入。我们可以将 `ls` 的输出直接管道传输到 `pg`，这样我们就可以一次查看一个文件名了。\n\
  \n某些 UNIX 命令显示的信息非常多，以至于我们正在寻找的行会丢失。`grep` 是一个只显示包含所需模式的行的 UNIX 命令，如下例所示：\n\n```bash\n\
  ls | grep acme\n```\n\n在前面的示例中，`ls` 将输出所有文件。这些文件不会直接显示在屏幕上，而是被管道传输到 `grep`。`grep`\
  \ 只显示名称中某个包含 `acme` 的文件名。`grep` 就像一个咖啡过滤器。热水和咖啡渣都进入过滤器。过滤器过滤掉我们不需要的东西（咖啡渣），并让我们需要的东西（咖啡液）通过。同样地，`grep`\
  \ 过滤器过滤掉了我们不需要的行，并只通过包含所需模式的行。*过滤器*一词可以用于任何可以在管道中使用并按需修改输出的 UNIX 工具。\n\n## 用户与组\n\
  \nUNIX 是一个多用户系统。通常，每个用户必须使用唯一的登录名称登录，以便系统知道是谁刚刚登录了。该系统会跟踪该用户的文件和邮件。\n\n组是用户的集合。用户可以属于多个组。每个组都有一个组名。每个文件都有所有者：拥有该文件的用户。每个文件属于属于组，该组通常是创建文件用户的主组。第\
  \ 11 章“文件权限与系统安全”将更详细讨论用户、组和权限。\n\n## 获取 UNIX 访问\n\n商业 UNIX 往往运行在数据处理部门昂贵的计算机上。公司和机构可能提供供你登录\
  \ UNIX 服务器的终端。然而，在使用 UNIX 系统之前，你必须获得一个 UNIX 账户。\n\nLinux/GNU 和 FreeBSD 是非 AT&T 的\
  \ UNIX，它们通过杂志、电脑交易市场、PC 商店、技术商店、订购以及互联网销售。你可以通过互联网从 `www.sco.com` 获取免费的 SCO 许可。你还可以以低廉的价格订购安装媒体。此优惠仅用于非商业用途。Sun\
  \ 还为 Intel 计算机提供了其操作系统的成本非商业版本，称为 Solaris x86。这些 UNIX 系统可以加载到家用计算机上。然而，这个过程需要一个可用的分区，并且不适合初（Linux\
  \ 可以加载到 DOS 系统或直接从 CD-ROM 运行）。如果你在同一台计算机上运行 Windows，除非你有信心在万一出错时恢复 Windows 和所有文件，否则不要加载\
  \ UNIX！如果你加载了自己的系统，你将学习到关于 UNIX 和计算机的大知识。\n\n## 遵循 UNIX 之道\n\n以下是一些帮助你适应 UNIX 的通用规则。\n\
  \n## 没有消息就是好消息\n\n由于一个命令的输出通常作为输入管道传输到另一个 UNIX 命令，因此命令不会输出不必要的消息。如果命令执行成功，它会直接返回\
  \ shell 提示符而没有任何其他输出。不要期待完成消息或状态消息。另一方面，如果产生了任何输出，这就是引起警报的原因。仔细研究任何输出，因为这可能是出现错误的指示。\n\
  \n## 命令是构建块\n\n许多 UNIX 命令看起来是原始的或未完成的。将它们想象成原始的构建块。你可以通过在管道中放置一系列命令来创建你自己的命令。大多数命令没有打印选项，因为你可以将输出管道传输到打印机。大多数命令没有排序选项，因为你可以将输出管道传输到\
  \ `sort`。\n\n### 最少按键\n\nUNIX 允许熟练的用户使用最少的按键完成奇迹。你可以在常用命令中看到这种减少按键的趋势：\n- `ls`（列出文件）\n\
  - `rm`（删除文件）\n- `cp`（复制文件）\n- `mv`（移动文件）\n- `cd`（切换目录）\n- `pg`（分页显示输出）\n\n\n\n\n\
  # 第 2 章：UNIX 目录与路径\n作者 Steve Mor Moritsugu\n\n## UNIX 目录树结构\n\n### 标准 UNIX 目录\n\
  ###绝对路径和相对路径切换目录\n### 切换到主目录\n### 切换到父目录\n### 创建和删除目录\n### 快速访问常用目录\n\n## 介绍 UNIX\
  \ 目录树结构\n\nUNIX 在一个或多个磁盘驱动器上存储用户数据等信息。每个磁盘驱动器的容量通常以兆字节（MB）为单位，每兆字节等于一百万个字符。例如，一个\
  \ 500 MB 的硬盘可以存储 50,000 份文档，每份文档有 10,000 个字符。某些磁盘驱动器的容量以千字节（`1 GB = 1000 MB = 1,000,000,000\
  \ 字符`）甚至太字节（`1 TB = 1000 GB = 1,000,000,000,000 字符`）为单位。![ad91af06ad96c57f0a338bded4c42f0e.gif](img/ad91af06ad96c57f0a338bded4c42f0e.gif)\n\
  \n### 变化速度有多快\n当我开始接触计算机时，我的系统只有 10 MB 的磁盘空间。今天，一个名为 UnixWare 7 的新 UNIX 版本规格说明它支持\
  \ 76,800 TB 的磁盘空间。这比我旧的 10 MB 硬盘大了 76 亿倍。太惊人了！\n\n由于有这么多数据需要跟踪，所有这些信息都被分成了相关信息的集合，称为文件。如果你写一封信给亲戚，这封信的内容将全部存储为一个文件。文件在系统中可以发挥不同的功能。有些文件是文档，有些是程序，有些是数据文件或其他类型。UNIX\
  \ 下每个文件都有一个名为 inode 号（参见术语表）的数字，UNIX 用它来访问文件。为了方便人类操作文件，每个文件也可以通过名称进行访问。\n\n旧版本\
  \ UNIX 的文件名只能包含 14 个字符。大多数现代 UNIX 系统允许更长的文件名，有时可达数百个字符。文件名可以开头或包含任何字母、数字、标点符号或空格，但在实践中，应避免在文件名中使用空格和大多数标点符号，因为这会让它们在命令行中难以使用。\n\
  \nUNIX 系统可能有成上万万甚至更多文件需要跟踪。为了简化这一点，文件被分组为相关文件的集合，称为目录。将目录想象成文件夹或容器，你可以将相关文件放入其中。例如，如果你给你的阿姨\
  \ Alice 写了 20 封信，你可以将这 20 个文件放在一个名为“阿姨信”的目录中。我可能会将目录命名为 `auntAlice`，因为我不希望在文件或目录名称中包含空格。同样，目录可以组合在一起并放入更大的目录中。例如，我可以创建一个名为\
  \ `correspondence` 的目录，其中包含 `auntAlice` 目录。\n\n### 根目录包含所有其他目录\n根目录始终由单个斜杠 `/` 表示。每当你看到\
  \ `/` 符号时，请将这个 `/` 想象成生长在地下的树根，固定着我们的树形结构。\n\n### 寻找名称的路径（全路径）\n图 2.1 显示了三个从根目录\
  \ (`/`) 出的文件：\n- `report`\n- `usr`\n- `tmp`\n\n图 2.1 UNIX 目录树结构。\n\n有关 `PATH` 变量的更多信息，请参阅第\
  \ 97 页。\n\n\n\n\n我们说这三个文件位于根目录下。在真实的 UNIX 系统中，根目录下会有更多文件，因此图 2.1 仅向你展示了示例 UNIX 目录树的一部分。\n\
  \n`usr` 和 `tmp` 目录包含图 2.1 所示的其他目录和文件。在 UNIX 中，目录以文件的形式存在于磁盘上，该文件负责跟踪该目录的内容。因此，目录是一种特殊类型的文件。\n\
  \n还有其他类型的文件。例如，字符设备节点和块设备节点文件允许 UNIX 访问系统中的硬件设备。UNIX 系统上的大部分文件被称为普通文件，即包含文本、数据或程序的文件。次于常见的文件类型是目录。所有其他类型的文件（如设备节点文件）都很少遇到。\n\
  \n在图 2.2 中，显示 `tmp` 目录包含一个名为 `report7` 的普通文件。注意，根目录（`/`）也包含一个名为 `report7` 的普通文件。事实上，我们的树示例显示了位于不同目录下的四个\
  \ `report7` 文件。只要位于不同的目录，UNIX 允许不同内容拥有相同的文件名。\n\n在任何一个目录下，所有文件名必须是唯一的。无论该文件是否为目录都是如此。出于这个原因，我无法在根目录下同时拥有一个名为\
  \ `usr` 的普通文件和一个名为 `usr` 的目录。\n\n不要将 UNIX 目录名与 DOS 目录名混淆。\n\nDOS 使用类似的目录树，也从根目录开始增长。然而，DOS\
  \ 使用反斜杠（`\\`）作为根目录和分隔目录名的符号，而 UNIX 使用斜杠（`/`），它也被称为正斜杠（`/`）。\n\n图 2.3 突出了我们树中的其中一个\
  \ `report7` 文件。文件的完整名称包含了为了获取所需文件而必须经过的所有目录。你可以看到，这一系列被高亮显示为链的目录形成了一条穿过树的路径，通向你想要的文件，因此我们称这种名称为全路径。有了全路径，就不必担心有人误认为你指的是树中的其他某个\
  \ `report7` 文件。全路径也被称为绝对路径。\n\n图 2.3 全路径 `/usr/fred/report7`。\n\nUNIX 中的目录\n\n在大多数\
  \ UNIX 系统上，你都会遇到一些标准目录名。我已经提到过，所有的 UNIX 系统都会有一个根目录（`/`）。\n\n标准 UNIX 目录名\n\n`/tmp`\
  \ 和 `/usr/tmp` 目录被系统用于存储临时文件。用户也可以在那里存储临时文件，但要小心，系统可能会定期清理（或删除）`tmp` 目录中的旧文件，且无任何警告。文件会在\
  \ `/tmp` 中保留多久呢？系统经常会删除 `/tmp` 或其子目录下 7 或 14 天未被访问的文件。有时，系统管理员在面临磁盘空间突然不足时，会不分时间地删除\
  \ `/tmp` 中的所有文件。\n\n`/dev` 是根目录下的一个目录，包含访问硬件（如磁带驱动器软磁盘）的特殊节点。这些设备节点可以存在任何地方，但按照惯例被存放在\
  \ `/dev` 或其子目录下，以提醒我们处理的是设备而不是普通文件。\n\n`/bin` 是根目录下的一个目录，存放系统实用程序，例如 `ls` 命令。`bin`\
  \ 是二进制可执行文件的缩写。今天，`bin` 术语也可以用于命名其他可执行文件目录，无论它们是二进制文件还是文本文件，例如 `/usr/bin`。\n\n`/usr`\
  \ 是根目录下的一个目录，存放用户文件以及支持用户程序所需的系统实用程序。例如，`/bin` 存放基本系统运行所需的实用程序，而 `/usr/bin` 存放用户和用户程序所需的系统实用程序。`/usr/lib`\
  \ 存放有用系统表和子程序的库。`/usr/spool` 存放置池文件，这些是排队打印文件的临时副本，一直保留到打印完成。`/usr/spool` 还存放许多其他系统进程（如\
  \ uucp）持有的临时文件。`/usr/bin`、`/usr/lib` 和 `/usr/spool` 是操作系统的重要部分，将 `/usr` 专门用于系统并将实际的用户数据和程序放在其他目录中通常是明智之举。\n\
  \n\n\n\n### SVR4 (Solaris) 中的新目录\n\n`lost+found` 是根目录及其他目录下的一个目录，当系统崩溃导致文件名丢失时，系统会将文件数据存储在这里。如果你在系统崩溃后丢失了重要数据，可能会在这里找到它们。\n\
  \n`/home` 是一个专门用于用户主目录的目录，用户可以在其中存储个人文件。（请参阅下文关于主目录的章节。）\n\n`/sbin` 和 `/usr/sbin`\
  \ 包含专门用于系统管理和系统操作的可执行文件。\n\n`/stand` 是某些 SVR4 系统（但不是 Solaris）上的特殊目录，专门用于存放 UNIX\
  \ 内核和启动文件。\n\n`/var` 包含系统变量信息文件，即内容随时间变化的临时文件和日志。`/var` 取了旧的 `/usr/spool` 目录。\n\n\
  # 切换到另一个目录\n\n能够在 UNIX 目录树中自由移动对于 UNIX 用户来说是一项非常重要的技能。\n\n### 切换目录并查看其内容 (cd, ls)\n\
  \n如果你每次引用文件都必须指定完整路径，那么 UNIX 将变得非常难用。一如既往，UNIX 有一种快捷方式来减少输入量。你可以指定一个目录作为我们的当前目录，这允许我们在不提供完整路径的情况下引用该目录中的文件名。当前目录充当默认目录，因为当你没有指定使用哪个目录时，系统就会使用它。\n\
  \n当前目录的其他名称为：\n- 工作目录 (working directory)\n- 当前目录 (present directory)\n- 当前工作目录\
  \ (present working directory)\n- 默认目录 (default directory)\n\n想象一下，我们已经开始从根目录沿着 UNIX\
  \ 树行走，并决定某处停下来，看看从那个角度可以看到什么。想象你正坐在树的某个分支上。你只能坐在目录里，而不能坐在文件中。你所在的目录被称为你的当前目录。我们可以使用\
  \ `cd` 命令加上想要切换的目录名称来更改当前目录。在图 2.1 中，如果我执行：\n\n```\ncd /usr/fred\n```\n\n那么我的当前目录将变为\
  \ `/usr/fred`。通过切换到 `/usr/fred`，你可以轻松访问该目录中的任何文件。你可以在 shell 提示符（此处用美元符号 `$` 表示）处输入\
  \ `ls` 命令列出当前目录下的所有文件。以下示例显示了如果你的文件与图 2.1 相同，你会看到的输出：\n\n```\ncd /usr/fred\nls\n\
  docs\nreports\n```\n\n如果 `report7` 是你当前目录中的一个普通文件，你可以直接通过 `report7` 访问它。你不需要指定哪个目录下的\
  \ `report7` 文件，因为当你没有提供完整路径时，系统会认为你指的是当前目录。\n\n## 使用 basenames 和 dirnames\n\n文件名通常包含一个目录部分（我将其称为\
  \ `dirname`）和一个最后的基准名称（我将其称为 `basename`）。这个 `basename` 不包含任何斜杠 (`/`)，因此也不包含任何目录名。`basename`\
  \ 可能表示普通文件也可能表示目录。`dirname` 指明了如何到达所需的 `basename`。如果提供的路径仅为基名称，则你用点 (`.`) 来指示它的\
  \ `dirname`，你稍后会看到点是一个代表当前目录的符号。例如：\n\n表 2.1 一些示例的 `dirnames` 和 `basenames`。\n\n\
  | full pathname | --dirname | --basename |\n| :--- | :--- | :--- |\n| `/usr/fred/report7`\
  \ | `/usr/fred` | `report7` |\n| `/usr/fred/docs` | `/usr/fred` | `docs` |\n| `report7`\
  \ | `.` | `report7` |\n\n## 显示你的当前目录名称\n\n要显示当前目录的名称，请输入：\n\n```\npwd\n```\n\n\n\
  \n\n当你使用 `cd` 命令且不指定目录时，它会将你带到主目录，也就是说，你的主目录变成了你的当前目录。\n\n主目录的名称可能因系统而异，但它通常包含你的登录用户名。例如，如果你以用户\
  \ `jane` 的身份登录，在某个 UNIX 系统上你的主目录可能是 `/usr/jane`。在另一个 UNIX 系统上（特别是 SVR4，例如 Solaris）它可能是\
  \ `/home/jane` 甚至是其他内容。要显示你的主目录名称，请输入：\n\n```bash\n$ cd $pwd\n/home/fred\n```\n\n\
  即使你不知道主目录的名字，`cd` 命令也会带你回到主目录。随后，`pwd` 命令会告诉你你到达了哪里，即你主目录的名称。在上面的示例中，`/home/fred`\
  \ 就是该用户的主目录。\n\n### 切换到绝对目录\n\n正如我们之前看到的，我们可以通过带有绝对路径（即完整路径）的 `cd` 命令来设置当前目录。如果你不知道完整路径的确切拼写，请使用后文“切换到目录”章节中描述的方法。如果你知道确切的拼写，可以通过\
  \ `cd` 命令直接切换到该目录。确保你的目录以开头的 `/` 起始。\n\n例如，要切换到 `/usr/fred/reports`，输入：\n\n```bash\n\
  cd /usr/fred/reports\n```\n\n要切换到根目录，输入：\n\n```bash\ncd /\n```\n\n### 切换到当前目录的子目录（相对）\n\
  \n如果我们想切换到当前目录的子目录，我们可以使用另一个快捷方法。我们可以指定一个相对路径，显示如何从我们所在的位置到达目标位置。例如，在图 2.1 中，假设以下情况成立：`/usr/fred`\
  \ 是我们的当前目录，`/usr/fred/docs/98sales` 是我们想要切换到的目录。\n\n我们可以通过完整路径到达那里：\n\n```bash\n\
  cd /usr/fred/docs/98sales\n```\n\n然而，由于 `/usr/fred` 是当前目录，使用如下相对路径会更简单：\n\n```bash\n\
  cd docs/98sales\n```\n\n注意，相对路径不以斜杠 `/` 开头，因为它们没有指示返回根目录的路径。因此，相对路径被称为部分路径。它们之所以被称为相对，是因为它们基于我们的当前目录。例如，下表显示了相对路径随当前目录变化的情况：\n\
  \n表 2.2. 根据当前目录到达 `/usr/fred/docs/98sales` 的相对路径\n\n| 当前目录 | 命令 | 结果 |\n| :--- |\
  \ :--- | :--- |\n| `/usr/fred` | `cd docs/98sales` | `/usr/fred/docs/98sales` |\n\
  | `/usr/fred/docs` | `cd 98sales` | `/usr/fred/docs/98sales` |\n| `/usr/fred` |\
  \ `cd docs/98sales` | `/usr/fred/docs/98sales` |\n| `/usr` | `cd fred/docs/98sales`\
  \ | `/usr/fred/docs/98sales` |\n| `/` | `cd usr/fred/docs/98sales` | `/usr/fred/docs/98sales`\
  \ |\n\n### 分步切换到目录\n\n有时，你对目标目录有一个模糊的想法，但不知道具体如何到达那里，或者不知道每个中间目录的确切拼写。有时你认为自己知道这些信息，但你的\
  \ `cd` 命令执行失败并报错：No such file or directory（没有此类文件或目录）。这里有一个可以帮助你的方法：提示：起始斜杠 `/`\
  \ 意味着从根目录 `/` 开始。学会注意路径的第一个字符。如果它以斜杠 `/` 开始，那么它就是绝对路径，包含了回到根目录 `/`的所有目录。\n\n分步切换到目录\n\
  \n1. 在脑海中确定通往目的地必须到达的第一个目录。如果你想使用相对路径，第一个目录将是你当前目录的子目录。如果你想使用绝对路径，那么第一个目录就是根目录 `/`。如果你不确定，在脑海中计划从根目录开始。\n\
  2. 如果你使用相对路径，跳过此步进入第 3 步。如果你使用绝对路径或决定从根目录开始，请执行第 2 步。输入：\n\n```bash\ncd /\n```\n\
  \n在这一步以及此过程中的每一步之后按下回车键。现在你处于根目录。\n3. 如果你不确定下一步要去哪个目录，或者不确定其拼写，输入：\n\n\n\n```\n\
  ls -CF\n```\n\n在此步骤以及此过程中的每一步之后，请按回车键。`ls`（参见附录）将向你显示从这里可以到达的所有文件和目录名称。`ls` 的 `-C`\
  \ 选项将以列显示输出。`ls` 的 `-F` 选项将在目录名称末尾添加斜杠（`/`），以便你将其与普通文件区分来。\n\n如果文件太多导致输出超出了屏幕，你可以通过输入以下命令之一来逐页查看输出：\n\
  \n```\nls -CF | pg ls -CF | more\nls -CF | less\n```\n\n`pg`、`more` 和 `less` 是用于逐页查看输出的实用。如果你的系统没有这些工具之一，你将立即看到错误：Command\
  \ not found（未找到命令）。在这种情况下，请尝试显示的其他替代方案。要进入下一页，请按回车键或空格键。若要在结束前退出，请输入 `q`。\n\n###\
  \ 4. 在确定要进入的下一个目录的正确名称后，按照如下方式切换到该目录：\n\n```\ncd nextdir\n```\n\n将 `nextdir` 替换为你所需的目录名。注意，在此\
  \ `cd` 命令中不要输入任何斜杠（`/`）。如果此命令 get No such file（无此类文件）错误，请重复上面的步骤 3 并双检你的拼写。如果你 get\
  \ permission error（权限错误），你可能没有切换到该目录的权限。\n\n### 5. 如果步骤 4 中的 `cd` 命令执行成功，我们现在离目标又近了一个目录。反复重复步骤\
  \ 3 和 4，直到你到达所需的目录。\n\n#### 另另\n- ![arrow.gif](img/arrow.gif) 有更多关于列表的信息，请参第 15\
  \ 页\n- ![arrow.gif](img/arrow.gif) 有更多关于逐页查看的信息，请参第 16 页\n\n### 访问当前目录 (.)\n####\
  \ 返回上一级父目录 (..)\n\n\n\n\n```bash\ncd ../reports/acme\n```\n\n如果你不确定需要返回多少级目录（`..`），可以使用“小步步进”的方法，例如：\n\
  \n```bash\ncd ..\nls -CF\n```\n\n第 49 页\n\n```bash\ncd reports\nls -CF\ncd acme\n\
  ```\n\n每个 `ls` 命令都会列出当前目录的内容，因此你可以看到可以进入的可用目录。记住，在任何小步步进的过程中，不要以斜杠（`/`）开头任何目录名称，因为那将带你直接回到根目录。\n\
  \n*返回上一个目录。*\n\nKorn shell 中的 `cd` 命令有一个 Bourne shell 中不具备的额外选项：\n\n```bash\ncd\
  \ -\n```\n\n它会将你带回上一次所在的目录。该命令也可以轻松地在两个目录之间来回切换，例如所示：\n\n```bash\ncd /data\n# 现在在\
  \ /data 中做一些工作\ncd /usr/fred\n# 现在在 /usr/fred 中做一些工作\ncd -\n# 现在你回 /data\ncd -\n\
  # 现在你回到了 /usr/fred\ncd -\n# 现在你回到了 /data\n# 等等\n```\n\n### 如何构建文件的相对路径\n\n在本书中，指令经常会指定输入目标文件的绝对路径或相对路径。绝对路径包含了一直到根目录的所有父目录。这很容易理解，但需要大量的键盘输入。\n\
  \n如果你的当前目录就是包含目标文件的目录，你只需通过其基名（`basename`，参见术语表）即可访问该文件，这比输入绝对路径要短得多。\n\n第 50 页\n\
  \n`basename` 是相对路径的一个示例，因为获取文件的路径是从你的当前目录开始的。不要在 `basename` 前加斜杠（`/`），因为那将表示绝对路径，告诉系统在根目录中查找该\
  \ `basename`，而不是在当前目录中。\n\n要使用相对路径访问当前目录的子目录（即子目录）中的文件，请输入此相对路径：\n\n```\nchild-dir/filename\n\
  ```\n\n将 `child-dir` 替换为目标子目录的名称。再次注意，相对路径不能以斜杠（`/`）开头。例如，如果当前目录下有一个名为 `reports`\
  \ 的子目录，而你想访问该目录下的 `acme` 文件，则相对路径为：\n\n```\nreports/acme\n```\n\n要访问隔了多级子目录的文件，请输入如下相对路径：\n\
  \n```\nsub-dir/its-sub-dir/its-sub-dir/filename\n```\n\n这种路径的优势在于，你不需要指定回到根目录的每一个目录。\n\
  \n要访问当前目录的父目录中的文件，请输入此相对路径：\n\n```\n../filename\n```\n\n正如你在本章较早之前看到的那样，点-点（`..`）表示父目录。\n\
  \n通过使用多个点-点（`..`）条目，可以使用相对路径访问整个系统中的任何其他文件或目录，例如：\n\n```bash\n../../../..//usr/jane/accounts/progs/acme\n\
  ```\n\n在实践中，多个点-点条目难以理解且并不常见。相对路径的使用频率比绝对路径高得多，因为减少了打字工作量。\n\n### 创建新目录 (mkdir)\n\
  \n创建新目录有三种方法：\n\n1. 进入你想创建新目录的父目录。你可以指定绝对路径或相对路径到达那里。输入：\n2. 留在原地并创建它\n3. 同时创建所有中间目录。\n\
  \n### 进入父目录并创建新目录\n\n1. cd 进入你想创建新目录的父目录。你可以指定绝对路径或相对路径到达那里。输入：\n\n\n\n\n\n# mkdir\n\
  \n`mkdir new-dir`\n\n将 `new-dir` 替换为你想要创建的新目录名称。不要在 `new-dir` 中包含任何斜杠 (`/`)。`mkdir`\
  \ 将创建所需的目录目录。\n\n若要停留在当前目录并在其他地方创建新目录，请输入 `mkdir` 命令，后跟要创建的新目录的完整路径或相对路径。如果中间的任何目录不存在，`mkdir`\
  \ 将执行失败并显示错误信息。\n\n## 创建新目录及所有中间父目录\n\n1. 输入：\n```\nmkdir -p\n```\n（在接到指示前不要按回车键。）\n\
  \n2. 输入一个空格，然后输入要创建的新目录的完整路径或相对路径。然后按回车键完成此命令。`mkdir` 的 `-p` 选项会使其创建路径中任何不存在的父目录以及给定路径中的最终目录。\n\
  \n### 删除现有目录 (`rmdir`)\n\n1. 输入：\n```bash\ncd dir-name\n```\n将 `dir-name` 替换为要删除目录的绝对路径或相对路径。\n\
  \n2. 输入：\n```bash\nls -aF\n```\n查看当前目录下的所有文件，包括文件名以点 (`.`) 开头的文件。要删除目录，该目录下不能包含点\
  \ (`.`) 和双点 (`..`) 以外的任何文件。\n\n3. 如果第 2 步列出了大量文件，请确保你确实想删除所有这些文件及其所在的目录。如果你确定，请进入下一个程序“删除整个子树”。如果第\
  \ 2 步仅显示少量文件或目录，请继续执行此程序的第 4 步。\n\n4. 第 2 步中 `ls` 的 `-F` 选项会导致 `ls` 在文件名后添加斜杠 (`/`)\
  \ 以表示目录。如果要删除的目录中有子目录，必须通过从头开始对每个子目录及其子目录的子目录执行此程序来先删除它们。\n\n5. 在删除目录之前，必须删除该目录中的所有普通文件。要删除当前目录下的文件，请输入：\n\
  ```bash\nrm file-name\n```\n将 `file-name` 替换为要删除的文件。`rm` 是删除（即移除）文件的 UNIX 命令。\n\n\
  6. 一旦目录中除了点 (`.`) 和双点 (`..`) 之外没有所有普通文件和子目录，输入：\n```bash\ncd ..\n```\n移动到要删除目录的父目录。你无法在目录内部时删除它。\n\
  \n7. 输入以下命令删除目录：\n```bash\nrmdir dir-name\n```\n将 `dir-name` 替换为要删除的空目录的相对路径或绝对路径。`rmdir`\
  \ 是删除（即移除）空目录的 UNIX 命令。\n\n## 删除目录子树\n\n可以使用一条命令删除目录及其所有存在的文件和子目录（即整个目录子树）。然而，此命令非常强大，因此非常危险，必须非常小心地输入以避免悲剧。\n\
  \n1. 确保你知道要删除目录的准确拼写和完整路径。使用 `cd` 和 `ls` 命令切换到该目录，并列出其内容以及任何子目录的内容。确保你想要删除所有这些文件和子目录。确保你删除的是用户创建的目录，而不是系统所需的目录，特别是当你以\
  \ root 身份登录时。\n\n2. 输入：\n```bash\ncd parent-name\n```\n将 `parent-name` 替换为要删除目录的父目录的绝对路径或相对路径。\n\
  \n\n\n\n\n输入 `pwd` 以确认你已到达正确的目录。\n\n### 4. 输入：\n```bash\nls -dF dir-name\n```\n\
  将 `dir-name` 替换为要删除的目录。此命令应该显示相同的 `dir-name`，后面跟着一个斜杠 (`/`)。如果你看到错误信息：No such file（无此类文件），说明出了问题。返回此步骤的第\
  \ 1 。\n\n### 5. 输入：\n```bash\nrm -rf dir-name\n```\n将 `dir-name` 替换为要删除的目录。此命令非常危险。在按下回车键之前，请双检拼写是否正确。`rm`\
  \ 命令通常只删除普通文件而不删除目录。`rm` 的 `-r` 选项会导致 `rm` 递归删除指定的目录及其文件，以及所有的子目录及其文件、所有的子目录及其文件，以此类推。没有撤销选项。\n\
  \n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n在以 root 身份运行时，避免使用 `rm -r`。\n\n![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\
  \ ![fc4f3a8aef38b56941e55505c60e4caf.gif](img/fc4f3a8aef38b56941e55505c60e4caf.gif)\n\
  \n指定的 `dir-name` 出现错误或拼写错误（例如错误的空格或斜杠 (`/`)），可能会抹除 UNIX 系统的重要部分并使其完全无法运行。没有撤销选项。为了更安全，如果你的\
  \ shell 允许，可以将 `rm` 别名为 `rm -i`。\n\n### 提高访问目录的效率\n\n在长目录名之间切换可能会变得疲惫且沮丧。这里是一些可以帮助你的技巧。\n\
  \n### 为常访问的目录设置 CDPATH\n\n在第一章中，我们看到了如何设置 shell 变量来定制系统如何为运行。Bourne shell 和 Korn\
  \ shell 都有一个名为 `CDPATH` 的变量，只要这些目录具有独特的名称，你就可以轻松地进入最常用的目录。一旦设置了 `CDPATH`，你就可以 `cd`\
  \ 进入常用目录的基名（basename），就像你坐在这些目录的父目录中一样。\n\n### 设置和使用 CDPATH\n\n1. 列出你最常 `cd` 进入的目录的完整路径列表。列表可以存在脑海中、草稿纸上、文件中等。如果这些目录的基名大部分是唯一的，这个过程将对你有所帮助。\n\
  2. 为最常访问目录的父目录创建一个新的完整路径列表。我将其称为 `CDPATH` 列表。\n3. 将 `CDPATH` 列表排序，使得你最常 `cd` 进入的目录的父目录排在前面。\n\
  4. 如果任何你常 `cd` 的目录具有相同的基名，将最常使用基名的父目录放在最少使用基名的父目录之前。此过程将允许你仅访问其父目录在列表中排靠前的那个相同基名。其他目录中的其他相同基名必须使用完整路径或相对路径访问。\n\
  5. 决定是在检查 `CDPATH` 中的所有目录之前还是之后检查当前目录中的给定基名。如果在之前，则当前目录覆盖或优先级高于 `CDPATH` 目录；如果在之后，则\
  \ `CDPATH` 覆盖或优先级高于当前目录。\n\n例如，假设你输入：\n```bash\ncd docs\n```\n假设 `docs` 目录既是当前目录的子目录，也是\
  \ `CDPATH` 中某个目录的子目录。我们可以通过控制当前目录的优先级是高于还是低于 `CDPATH` 目录，因此我们可以控制最终进入哪个 `docs` 目录。\n\
  \n6. 输入：\n```bash\nCDPATH=\n```\n在接到指示之前不要按回车键。在 `=` 符号周围不要留任何空格。\n7. 如果希望当前目录的优先级高于\
  \ `CDPATH` 目录，输入：\n```bash\n.:\n``` （即点加冒号）且没有空格。\n8. 输入你 `CDPATH` 列表中的所有完整路径，使用冒号\
  \ (`:`) 分隔每个项目。不要以冒号 (`:`) 结束列表。不要输入任何空格。\n\n\n\n\n`:`（即冒号）且没有空格。\n\n10. 按回车键完成你的命令。这里是一个完整命令的示例：\n\
  \n```bash\nCDPATH=.:/usr/fred/reports:/data/acme\n```\n\n11. 现在，每当你 `cd` 到一个 `basename`\
  \ 时，shell 都会按照顺序搜索 `CDPATH` 中的每个目录，直到找到给定的 `basename` 成为 `CDPATH` 中某一个父目录的子目录。然后，它将带你进入该目录。\n\
  \n12. 除非你在 `.profile` 中设置了此 shell 变量定义，否则你每次登录都必须重新输入整个 `CDPATH=` 行内容。\n\n### 另需参考\n\
  \n- 有关如何在 `.profile` 中设置 shell 变量定义以便在每次登录时自动执行的配置，请参阅第 307 页。\n- 有关不同 shell 的更多信息，请参阅第\
  \ 27 页。\n\n### 保存/访问常用目录名称\n\n有时，你会发现有些目录是你想要多次返回的，但频率又没高到需要更新 `CDPATH`。你可以创建并使用自己的临时\
  \ shell 变量，以便方便返回这些目录。\n\n#### 保存/访问常用目录名称\n\n1. `cd` 进入一个你知道自己多次返回的目录。\n2. 输入：\n\
  ```bash\nD1=`pwd`\n```\n请确保你输入的是反引号（`` ``）而不是单引号（''）。不要在该命令中输入任何空格。此命令会将当前目录的完整路径保存到变量\
  \ `D1` 中。\n3. 要返回到 `D1` 中的目录，输入：\n```bash\ncd $D1\n```\n注意，你必须在变量前加上 `$` 符号才能使用其内容，但在设置内容时不需要。\n\
  4. 遵循步骤 1 到 3，你可以设置并使用其他变量（如 `D2` 或 `D3`）来记住并在几个目录之间轻松地切换。\n5. 你可以选择更具描述性的变量名，例如：\n\
  ```bash\nCUSTS=`pwd` REPORTS=`pwd`\n```\n在执行上述命令之前，你必须位于目标目录中。你不能选择已存在的 shell 变量名。输入：\n\
  ```bash\nenv\n```\n查看现有变量列表。\n6. 如果你忘记了变量存储的是哪个目录，可以使用 `echo` 命令显示其内容，例如：\n```bash\n\
  echo $D1\n```\n7. 如果你想让某些变量永久化，这样就无需每次登录都重新设置，请按照上述过程所述，在 `.profile` 中进行设置。\n\n\
  ### 显示系统信息\n\n作为 UNIX 系统上的新用户，你可能最想做的事情之一就是查看系统内部的真实样貌。UNIX 系统维护着关于你是谁、你的当前环境如何以及你正在做什么的详细信息。这些信息中的大部分可以通过简单的命令或更深入的\
  \ shell 编程语言获取。\n\n\n\n\n请记住，存在许多版本的 UNIX，你的输出结果可能与此处看到的并不完全相同，请务必根据你自己的系统文档检查你在此处使用的命令。好好的消息是，在学习了这些命令后，你几乎可以坐在任何一台\
  \ UNIX 机器上并开始工作。让我们通过几个实用的命令，看看你可以获取关于你系统的哪些信息。\n\n# 显示关于你和你的系统的信息\n\n让我们先让 UNIX\
  \ 告诉它对你当前会话的了解。这些信息非常重要，因为你在系统中的身份决定了你能够执行的许多命令和程序。你要知道，一个 `userid`（ `uid` ）拥有所有程序，而\
  \ UNIX 命令本质上就是一种程序，并且它为这些程序和命令赋予了特定的权限。现在，让我们来看几条可以告诉你当前登录会话相关信息的命令。\n\n## whoami\
  \ 命令\n\n第一个要探索的命令是 `whoami` 命令。\n\n1. 在 shell 提示符下，输入 `whoami`。\n2. 根据你的系统不同，你应该在一一行中看到你的\
  \ `userid`，并在下方看到 shell 提示符：\n```\n$ whoami\nnick_humes\n```\n3. 我们可以通过输入 `who i`\
  \ 来稍微修改此命令以查看更多信息。\n1. 在 shell 提示符下，输入 `who i`。\n2. 你应该看到类似的信息：\n```\n$ who i\n\
  nick_humes tty1 Mar 18 12:12\n```\n3. 如你所示，此命令提供了更多信息；它返回了你的用户名、终端以及你登录系统的初始日期和时间。\n\
  \n## id 命令\n\n另一个你会发现频繁使用的有用命令是 `id` 命令。\n\n1. 在 shell 提示符下，输入 `id`。\n2. 你应该看到系统返回的以下信息：\n\
  ```\n$ id\nuid=101(nick_humes) gid=20(users)\n```\n该命令返回了你的用户 ID (`uid`) 和组 ID (`gid`)。这些信息非常有用，因为它告诉你当前在系统中的身份。你需要了解这一点，这是\
  \ UNIX 的强大功能之一：只要你有有效的密码，就可以切换到另一个用户。你也可以更改当前的用户组所属关系。这些功能非常有价值，因为你可能需要以与登录时不同的用户和用户组身份运行程序。\n\
  \n## tty 命令\n\n另一个你应该检查的命令是 `tty` 命令。此命令告诉你你所使用的终端，或者如果你是通过网络登录的，则告诉你你连接的伪终端（pseudo-terminal）。伪终端意味着你不是通过物理连接直接到机器；而是通过网络连接。让我们来看一个例子。\n\
  \n1. 在 shell 提示符下，输入 `tty`。\n2. 你应该看到类似下面的内容：\n```\n$ tty /dev/ttyp1\n```\n3. 系统返回你的终端用于连接到系统的设备名称。请注意输出\
  \ `/dev/ttyp1` 在设备号之前有一个 `p`。这表示该设备是一个伪终端。如果你直接通过系统控制台登录机器，你将看到以下内容：\n```\n$ tty\
  \ /dev/console\n```\n\n## 变量\n\n环境变量 `$TERM` 告诉系统你想要模拟的终端类型。根据你所处的系统和终端，你可以模拟字符终端（character\
  \ terminal）或 X-Windows 终端（X-Windows terminal）。X-Windows 类型终端赋予你图形能力，而基于字符的终端则没有。你可以在登录机器后立即通过检查你的系统来确定你的环境变量是否已经激活。看看如何查看你的\
  \ `$TERM` 设置以及在需要时如何更改它。\n\n1. 在 shell 提示符下，输入 `echo $TERM`。\n2. 系统会将 `TERM` 的值回到屏幕：\n\
  ```\n$ echo $TERM\n100\n```\n3. 如果你使用的是 `ksh` (Korn shell) 或 `sh` (posix shell)\
  \ 并且想要更改 `TERM` 的值，你需要执行以下步骤：\n1. 在 shell 提示符下，输入 `TERM=vt220;export $TERM`。\n2.\
  \ 要检查 `TERM` 是否已更改，你需要输入 `echo $TERM`。\n3. 你会看到 TERM 被设置为 vt220。\n\n\n\n\n\n在 `csh`\
  \ (C shell) 中，你可以通过以下步骤来更改 `TERM`：\n\n1. 在 shell 提示符处，输入 `set term=vt220`。\n2. 输入\
  \ `set` 来检查 `TERM` 是否更改。\n   ```\n   set\n   ```\n3. 你将看到所有的环境变量设置。在输出中，你应该能看到类似下面这一行的内容：\n\
  \   ```\n   term    vt100\n   ```\n\n`stty` 命令用于设置或显示终端当前的 I/O 选项设置。你使用 `stty` 来设置有用的功能，例如退格键（backspace）或进程中断键。让我们来看例子：\n\
  \n1. 在提示符处，输入 `stty -a`。\n   ```\n$ stty -a \n   speed 9600 baud; line = 0;\n  \
  \ rows = 0; columns = 0\n   min = 4; time = 0;\n   intr = ^C; quit = ^^\\; erase\
  \ <undef>; kill = ^U\n   eof = ^D; eol = ^@; eol2 <undef>; swtch <undef>\n   stop\
  \ = ^S; start = ^Q; susp <undef>; dsusp <undef>\n   werase <undef>; lnext <undef>\n\
  \   parenb -parodd cs7 -cstopb hupcl -cread -clocal\n   ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)\
  \ -loblk -crts\n   -ignbrk brkint ignpar -parmrk -inpck istrip -inlcr\n   ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)-igncr\
  \ icrnl -iuclc\n   ixon -ixany ixoff -imaxbel -rtsxoff -ctsxon -ienak\n   ig-icanon\
  \ -iext-case echo eechok-echon\n   ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)-nofsh\n\
  \   -echoctl-echop-echoke-flus-pend\n   opost-olconcr-ocr-onret-ofill-del\n   ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)-tost\n\
  $\n   ```\n2. 从前面的输出中，你可以看到有很多设置。大多数情况下，你只需要修改其中几个。注意输出输出中 `erase` 设置是未定义的（`<undef>`）。将其设置以使其对退格键（`<Backspace>`）起工作。`CTRL-H`\
  \ 是 Control 键和 H 键的组合。`CNTR-H` 是退格键的默认值。你使用 `stty` 命令告诉系统使用此按键序列来执行退格功能。\n   在 shell\
  \ 提示符处，输入 `stty erase ^H`。\n   ```\n$ stty erase ^H\n   ```\n3. 现在查看输入 `stty -a`\
  \ 的结果：\n   ```\n$ stty -a \n   speed 9600 baud; line = 0;\n   rows = 0; columns\
  \ = 0\n   min = 4; time = 0;\n   intr = ^C; quit = ^^\\; erase = ^H; kill = ^U\n\
  \   eof = ^D; eol = ^@; eol2 <undef>; swtch <undef>\n   stop = ^S; start = ^Q; susp\
  \ <undef>; dsusp <undef>\n   werase = ^K; lnext <undef>\n   parenb -parodd cs7 -cstopb\
  \ hupcl -cread -clocal -loblk\n   ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)-crts\n\
  \   -ignbrk brkint ignpar -parmrk -inpck istrip -inlcr\n   ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)-igncr\
  \ icrnl -iuclc\n   ixon -ixany ixoff -imaxbel -rtsxoff -ctsxon -ienak\n   ig-icanon\
  \ -iext-case echo eechok-echon\n   ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)-nofsh\n\
  \   -echoctl-echop-echoke-flus-pend\n   opost-olconcr-ocr-onret-ofill-del\n   ![arrow.gif](img/4505ed21b36efb4ebf4df5206fc03bad.gif)-tost\n\
  $\n   ```\n如你所见，退格键已设置。\n\n### 显示关于用户的信息\n你已经准备好学习有关登录系统的其他用户的命令了。首先通过 `who` 命令查看谁登录了系统。\n\
  \n   在 shell 提示符处，输入 `who`。\n   ```\n$ who   Tim_Wilson      ttyp1   Mar 19 18:27\n\
  \   Emily_Wilson    tty10   Mar 19 18:30\n   oracle          ttyp2   Mar 19 15:27\n\
  \   Taylor_Klausner  typd5  Mar 19 10:20\n   Marissa_Klausner ttypd1  Mar 18 06:00\n\
  \   BPierce         ttyp7   Mar 19 19:17\n   BWood           ttyp47  Mar 19 14:00\n\
  \   CSarjent        ttyp10  Mar 19 11:27\n   singleton       ttyp19  Mar 19 08:27\n\
  \   Zach_Wilson      ttyp15  Mar 19 09:27\n   Travis_Wilson   ttyp17  Mar 19 12:27\n\
  \   Berglund         ttyp21  Mar 19 12:12\n   Ed_Lewis        ttyp35  Mar 19 12:13\n\
  \   Tony_Amico      console Mar 19 12:00\n$\n   ```\n从输出可以看出，有很多用户在系统中。注意某些用户是直接连接的（tty\
  \ ID），而其他用户是通过网络连接（ttyp ID）。还要注意 `ttyp1` 和 `ttyp5` 与其他不同，因为这些用户是通过调制解调器登录的。你还可以看到管理员之外的人员登录了系统控制台。这具有潜在的危险，因为在系统中通过登录系统控制台更容易获得特权。你可以使用这个简单的命令来查看谁登录了系统、他们是如何进入系统的以及何时登录的。\n\
  \n让我们看看 `who` 命令的另一个用法。这次我们将用该命令显示有关你的 UNIX 机器的一些信息。\n   ```\n$ who -b\n   system\
  \ boot  Oct 28 13:35\n   ```\n\n\n\n上述输出告诉我们机器启动（或重启）的日期时间。如果你在下班前启动了一个任务，第二天回来发现计算机崩溃了，那么知道这个信息会有用。在与系统管理员交流之前，你找到的任何信息都将有助于解决你遇到的任何问题。\n\
  \n另一个显示有关用户和系统信息的命令是 `uptime` 命令。以下是它的用法示例：\n\n在 shell 提示符下，输入 `uptime`。\n\n```bash\n\
  $ uptime 8:00pm up 142 days, 6:25, 2 users, load average: 0.51, 0.52, 0.52\n```\n\
  \n输出告诉我们当前时间是晚上 8:00，系统已运行了 142 天 6 小时 25 分钟。当前有两个用户登录到系统。系统管理员使用平均负载（load average）来帮助评估系统性能。\n\
  \n现在让我们来看看如何通过特殊选项使用 `uptime` 命令，以获得与 `w` 命令相同的输出。\n\n在 shell 提示符下，输入 `uptime -w`。\n\
  \n```bash\n$ uptime -w 7:55pm up 142 days, 6:20, 2 users, load average: 0.51, 0.52,\
  \ 0.52\nUser tty login@ idle JCPU PCPU what\ndwilson tty1 6:27pm 3 uptime -w\nroot\
  \ tty2 7:53pm sh\n```\n\n现在输入 `w` 命令。\n\n在 shell 提示符下，输入 `w`。\n\n```bash\n$ w 7:55pm\
  \ up 142 days, 6:21, 2 users, load average: 0.51, 0.52, 0.52\nUser tty login@ idle\
  \ JCPU PCPU what\ndwilson tty1 6:27pm 3\nroot tty2 7:53pm sh\n```\n\n如你所见，两个命令产生了相同的输出。然而，使用\
  \ `w` 命令比记住 `uptime` 命令的选项要简单一点。\n\n你 world 使用的另一个命令是 `finger` 命令。该命令显示以下内容：\n\n\
  -   登录名。\n-   用户的全名（如果列在密码文件中）。\n-   终端状态（`write` 命令允许用户通过终端直接相互通信）。\n-   用户的空闲时间。\n\
  -   用户的登录时间。\n-   任何存放在用户 `.plan` 文件中的计划信息。该文件位于用户的家目录下。\n-   任何存放在用户 `.project`\
  \ 文件中的项目信息。该文件也位于用户的家目录下。\n-   用户的办公室信息（如密码文件列所示）。\n-   用户的电话号码（如密码文件列所示）。\n\n你可以使用\
  \ `finger` 命令显示注册在系统上的其他用户信息。请记住，即使这些用户没有登录，你也可以看到关于他们的信息。在这个示例中，显示了用户 `<laLaurie>`；请替换为你你想要使用\
  \ `finger` 命令的用户。\n\n在 shell 提示符下，输入 `finger laurie`。\n\n```bash\n$ finger laurie\n\
  Login: Laurie\nDirectory: /home/laLaurie\nOffice: 101\nPhone: 555-1234\nIdle: 0.01\n\
  Login: Mon 8:00\n```\n\n`mesg` 命令控制这种与终端交互的能力。`mesg` 命令返回你的终端接收其他用户消息当前当前（超级用户始终可以向另一个用户发送消息）。\n\
  \n假设在以下示例中 `mesg` 设置为 `y`：\n\n```bash\n$ mesg\ny\n```\n\n现在将此设置更改为 `n`。\n\n```bash\n\
  $ mesg n\n```\n\n在 shell 提示符下，输入 `mesg`。\n\n```bash\n$ mesg\nn\n```\n\n\n\n$mesg\
  \ is n\n\n现在让我们来看看当用户能够接收消息时，`finger` 命令的输出看起来是所示所示：\n\n```\n$ finger llarie\nLogin\
  \ name: llarie In real life: Linda Laurie\nBldg: Indy, Work phone: 317.555.7180\n\
  Directory: /home/llaurie Shell: /usr/bin/sh\nOn since Mar 21 14:59:15 on ttyp1 from\
  \ Hydra.\nPlan: Oracle 8.1 Web Server\n```\n\n注意，（messages off）输出已经不再出现。你现在可以通过如\
  \ `write` 等程序与该用户进行交互。\n\n# 显示有关 UNIX 密码文件的信息\n\n与大多数安全系统一样，UNIX 要求用户不仅要在系统中注册，还必须通过提供用户\
  \ ID 和密码来验证其登录。不过，这并非万无一失，因为用户有时会将密码与他人共享，或者有人会使用其他用户的密码。\n\n首先，查看 UNIX 密码文件（`passwd`）。以下是位于\
  \ `/etc` 目录下的密码文件示例。\n\n```\nroot:Thisisasecret:0:3::/:/sbin/sh daemon:*:1:5::/:/sbin/sh\n\
  bin:*:2:2::/usr/bin:/sbin/sh\nsys:*:3:3::/:\nadm:*:4:4::/var/adm:/sbin/sh\nuucp:*:5:3::/var/spool/uucppublic:/usr/lbin/uucp/uucico\n\
  lp:*:9:7::/var/spool/lp:/sbin/sh\nnuucp:*:11:11::/var/spool/uucppublic:/usr/lbin/uucp/uucico\n\
  hpdb:*:20:1:ALLBASE:/:/sbin/sh\nnobody:*:-2:-24::/:\noracle:BJXXXX3HTWSls:201:200:,,,:/home/oracle:/usr/bin/sh\n\
  cfliss:XXXXXXXXXXXXX:100:200:,,,:/home/cfliss:/usr/bin/sh\ndwilson:Can'tguessme!:101:200:DanWilson,Indy,317.555.5555,:/home/dwilson:/usr/bin/sh\
  \ own\n```\n\n`passwd` 文件中的每一行都标识系统中的单个用户。每个字段由冒号（`:`）分隔。你可以按照如下方式分解每个条目：\n\n- 登录名\n\
  - 加密后的密码\n- 数字用户标识符\n- 数字组标识符\n- 用户信息字段\n- 用户主目录\n- 登录时使用的 Shell 程序\n\n在上述 `passwd`\
  \ 示例中，你会注意到某些账户的加密密码字段中有一个星号（`*`）。这会指示操作系统防止任何人直接登录这些账户。\n\n## 修改用户信息\n\n如果你想更改用户字段中的信息，请尝试以下操作：\n\
  \n1. 在 shell 提示符下，输入 `chfn dwilson`。默认值打印在 `[]` 中。如要接受默认值，输入 `<return>`。若要留空，请输入单词\
  \ `none`。\nName [Daniel Wilson]: Daniel Wilson Location (Ex: St Paul) [Chicago]:\
  \ Carmel Office (Ex: 1234) [317.555.555]: 800.555.5555 Home Phone (Ex: 555555) []\n\
  \n2. 查看你的更改，请执行以下步骤：\n   . 在 shell 提示符下，输入 `grep -i dwilson /etc/passwd`。\n\n```bash\n\
  $ grep -i dwilson /etc/passwd\n```\n\n\n\n大多数 UNIX 版本都支持影子密码（shadow passwords）。正如你在上面的\
  \ `passwd` 文件示例中所看到的，你可以看到每个设置了密码的用户的加密密码（虽然创建没有密码的用户账户是可能的，但不建议这样做）。这在某种程度上是一个安全问题，因为其他用户可以使用这些信息来破解其他用户的密码。为了防止这种情况，UNIX\
  \ 厂商开始实施影子密码系统。该系统将加密密码信息放在另一个目录下的特殊影子密码文件中，该目录只有特权用户才能访问。某些系统拥有一个 `/etc/shadow`\
  \ 文件，只有特权用户可以访问。无论哪种方式，目标都是防止普通用户读取加密密码。\n\n# 更新用户信息\n\n你可以使用此命令在不涉及系统管理员的情况下更新你的用户信息。请检查你的系统手册或帮助页（man\
  \ pages），以查看你的 UNIX 版本是否支持此命令。\n\n# 组文件\n\n另一个值得的系统文件是组文件。该文件也位于 `/etc` 目录下，维护了你所属的主组和关联组列表。让我们来看一个组文件的示例，并识别组成它的组件。\n\
  \n```\nroot::0:root other::1:root,hpdb\nbin::2:root,bin\nsys::3:root,uucp\nadm::4:root,adm\n\
  daemon::5:root,daemon\nmail::6:root\nlp::7:root,lp\ntty::10:\ndeveloper::99:dwilson,ssmith,cfliss\n\
  nuucp::11:nuucp\nusers::20:root,dwilson,ssmith,cfliss\nnogroup:*:-2:\ndba::200:oracle,dwilson,ssmith,cfliss\n\
  ```\n\n注意，一个用户可以存在于多个组中。你在 `passwd` 文件中的条目决定了你的主组身份。cfliss 账户的主组是 200 (dba)。但她也是\
  \ developer (99) 和 users (20) 组的成员。\n\n现在是查看如何使用 `passwd` 命令更改密码的好时机。\n\n在 shell\
  \ 提示符下，输入 `passwd`。\n\n```\n$ passwd Changing password for msch\nOld password: <Old\
  \ Password>\nNew password: <New Password>\nRe-enter new password: <New Password>\n\
  ```\n\n`passwd` 命令会以交互方式引导你完成密码更改。\n\n### 显示系统信息\n\nUNIX 系统为用户提供了许多命令，使其能够获取有关系统的信息。普通用户可以执行各种命令，从告诉他们日期和时间的命令到提供有关\
  \ UNIX 系统当前状态详细信息的命令不等。在本节中，你将学习普通用户如何利用可用命令从系统中获取信息。\n\n### 获取日期 (date)\n\n让我们先学习如何显示系统的日期和时间。在\
  \ shell 提示符下，输入 `date`。\n\n```\n$ date Sun Mar 22 10:25:28 CST 1998\n```\n\n你还可以添加格式选项来更改日期的显示方式。以下是几个示例。\n\
  \n在 shell 提示符下，输入 `date %+j`。\n\n```\n$ date %+j 081\n```\n上面的示例打印了儒略日（Julian date），这是一年中当前数的数的表示。\n\
  \n在 shell 提示符下，输入 `date %+D`。\n\n```\n$ date %+D 03/22/98\n```\n上面的示例使 `date` 命令以\
  \ mm/dd/yy 格式打印日期。\n\n输入 `date %+I:%M%p`。\n\n```\n$ date %+I:%M%p 11:20AM\n```\n\
  这个示例提供了带有 am 或 pm 显示的时间。\n\n在 shell 提示符下，输入 `date \"+%A %B %e %Y\"`。\n\n```\n$ date\
  \ \"+%A %B %e %Y\" Sunday March 22 1998\n```\n这个示例显示了如何显示完整的星期几名称、完整的月份名称、日期以及完整的四位年份。正如你从每个示例中看到的，带有格式选项的\
  \ `date` 命令允许用户以几乎任何格式格式显示日期。\n\n### 获取系统名称信息 (uname)\n\n现在让我们看看如何显示系统的正式名称。执行此操作的命令是\
  \ `uname` 命令。\n\n\n\n\n# 系统信息\n\n在 shell 提示符下输入 `uname -a`。\n\n```bash\n$ uname\
  \ -a HP-UX Hydra B.10.20 E 9000/890 7047254010 unlimited user\n```\n\n该输出可以分解为以下组件：\n\
  - 操作系统名称\n- 用于标识系统的网络系统名称\n- 操作系统发行版本\n- 操作系统版本\n- 机器及型号数字\n- 机器 ID 号\n- 操作系统许可证\n\
  \n请检查您的系统手册以获取适用于您机器的详细说明。如果您使用的是惠普（Hewlett-Packard）系统，上述示例适用。*理解 UNIX 文件系统*。\n\n\
  # UNIX 文件系统\n\nUNIX 环境支持所谓的层次文件系统和文件/目录结构。这意味着您的文件系统（以及目录）呈现出倒置树状。人们有时将这种结构称为树。这种目录结构类似于更熟悉的\
  \ MS-DOS 布局。树的顶端被称为根目录。根目录之下是所有其他目录。\n\n所有目录都维护在 UNIX 文件系统中。这种文件管理方法更容易将文件分区到磁盘上。另一个好处是，如果系统丢失了非系统磁盘驱动器，系统只需只需更换驱动器并从备份中恢复数据。层次文件系统通过使数据的实际位置对您透明化，为分配文件空间提供了灵活性。作为用户，您无需关心数据是位于物理驱动器\
  \ A 还是 B。将文件和目录逻辑地映射到物理驱动器的工作完全由管理员负责。作为用户，您可能没有权限更改文件系统的配置。\n\n# 磁盘使用\n\n现在查看 `df`\
  \ 命令。通过此命令，您可以查看文件系统及其大小。在 shell 提示符下输入 `df -k`。\n\n```\n/data1(/dev/vg01/lvol1):\
  \ 1803132 total allocated Kb 162443 free allocated Kb 1640689 used allocated Kb\
