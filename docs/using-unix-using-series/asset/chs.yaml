  \n## 冒号模式下的替换\n- `!! cmd` 用 `cmd` 的输出替换当前行。\n- `!a cmd` 从光标处到标记 `a` 应用 `cmd`。\n\
  - `!a sed 's/st1/st2/g'` 将从光标到标记 `a` 找到的字符串 `st1` 替换为 `st2`。\n- `%! sed 's/st1/st2/g'`\
  \ 替换整个文件的 `st1`。`st1` 可以包含表达式通配符。\n\n## 复制、粘贴以及删除与粘贴\n- `ya` 复制到包含标记 `a` 的行开头。\n\
