  \ 和 SunOS 信息）\n\n### CDE 中的详尽帮助\n\n图 5.5 显示了 CDE 文本编辑器应用程序中的部分帮助目录。每个 CDE 应用都包含关于该程序屏幕和选项的有用信息。帮助文档使用了超文本链接（类似于网页），点击带有下划线的短语即可直接跳转到特定文档。超文本文档非常出色，因为它能向你展示章节中每个主题的概述，并让你快速进入到选择的主题和相关主题。\n\
