    # Feeding Audio from Windows


    Your Icecast server may be running at a hosting service in Texas and you''re sitting
    at somebody''s system in Wisconsin. Don''t worry. If you have a network connection
    to the server, you can stream your audio content from the Windows system to the
    Icecast server using the Oddcast media tool.


    Here''s a procedure for using the Oddcast plug-in in Winamp to broadcast to a
    Windows system using a microphone:


    +   **1. Download Winamp.** Download and install Winamp to your Windows system.
    You can get it from .winamp.com.


    +   **2. Download Oddcast.** Download and install the Oddcast Winamp plug-in (at
