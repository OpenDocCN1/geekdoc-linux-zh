  md: '# Chapter 4 — Creating a Personal Video Recorder with MyTV 81


    Now that the OS is set up and running, you need to finish with partition layout
    of a logical volume on top of software RAID (/dev/md3). This section is not required,
    but if you want to add more drive space to your system in the future, this is
    how to prepare for it without having some GBs of data around. With LVM, you simply
    add drives to the system (let''s hope in the form of RAID arrays), and add those
    resources to the logical volume. No reformatting, copying files, or ever so much
    as a reboot (if you''re using USB or dev1394 drives!). LVM or no LVM? It''s your
    call.


    On my system I run SATA drives, which are as (/dev/sda instead of /dev/hda), but
    no matter. Setting up a logical volume atop your software RAID-1 mirror (/dev/md3
    (if you''re using RAID) will look pretty much same regardless (except when you
    poke around with disk at the raw partition level).


    If you''re planning on using LVM and adding more drives to your logical volume
    in the future, then you probably want to do it in the form of RAID (either hardware
    RAID-5 or 1, or software RAID-1). Because adding multiple drives under one system
    (like LVM) decreases the overall reliability of that system. So you can balance
    this game by adding not single drives, but RAID-1 arrays. This will reduce your
    chances of losing all your data some day!


