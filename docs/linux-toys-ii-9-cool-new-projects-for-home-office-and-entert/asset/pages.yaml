    system (free), and a few pieces of extra hardware (reasonable). Some projects,
    such as the MythTV video recorder in Chapter 4, will work better with more expensive
    hardware, and others, like the Linux Terminal Server Project in Chapter 12, are
    designed specifically to take advantage of minimal hardware.


    The cool thing is that if you are short on cash and time, you have few limitations
    on what you can accomplish with these projects. The software you need either free
    or range from an old 486 you found in a dumpster to the best multimedia PC you
    can find.


