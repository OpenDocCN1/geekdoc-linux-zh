    # Identifying a log file


    No log files are used by Heyu (LOG_DIR NONE). However, you can replace NONE with
    a full path to a directory (for example, /home/chris/.heyu/). You can then use
    that log file to monitor Heyu activities, such as indications when Heyu scripts
    are launched and output from those scripts. The following line shows how the modified
    LOG_DIR option should appear to the log of /home/chris/.heyu/ directory:


    ```

    LOG_DIR /home/chris/.heyu/

    ```


    If you have configured Heyu to be the root of your user (in /etc/heyu/x10.conf),
    you can put the log file in the standard system log directory, /var/log.


    ![](img/1b8a24a162893627b8005ac678b79236_225_0.png)


    # Adding a SCRIPT


    The SCRIPT directive is the most powerful directive you can use with Heyu. By
    defining a SCRIPT, you can tell Heyu to look for some event to occur (such as
    an X10 signal to turn on light B1) and react to that by running any command in
    Linux. Here is an example from the x10config file:


    ```

    ALIAS doorbell B1

    SCRIPT doorbell on : play $HOME/sounds/barking_dog.wav

    ```


    In the previous example, the where doorbell is assigned to code/unit B1. Then
    the SCRIPT says that if the doorbell is turned on, run the command on the file
    $HOME/sounds/barking_dog.wav. The SCRIPT directive and launch condition (doorbell
    on) are followed by two colons. After the two colons you can enter any command
    you like.


    # Using a schedule file (x10.sched)


    You can upload a schedule file from your computer to your CM11A device to have
    X10 signals sent scheduled directly from that device. This allows your X10 to
    continue, even when your computer is off. Based on the following entry, the file
    x10.sched in $HOME/.heyu is used:


    ```

    SCHEDULE_FILE x10.sched

    # SCHEDULE_FILE normal.sched

    # SCHEDULE_FILE vacation.sched

    ```'
