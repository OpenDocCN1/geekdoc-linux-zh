  md: '# Understanding Live Linux Distributions


    The concept behind a live distribution (often referred to as a LiveCD or LiveDVD)
    is to be able to separate the computer operating system from the fixed hard disk
    on a computer. By storing an read-only operating system on a removable medium
    (CD, DVD, pen drive, or zip drive), you can:


    +   - Bypass any operating systems stored on the computer''s hard disk

    - Carry around all your favorite applications and data, without carrying a computer

    - Use an operating system and applications you are comfortable with to access
    data stored on the computer''s hard disk


    # Beginning KNOPPIX


    KNOOPPIX is the best known of the live distributions. It was first created to
    fit on a CD, and therefore referred to as a LiveCD distribution. Because KNOPPIX
    was made to run from a read-only medium, some tricks had to be performed to get
    it to work:


    +   - Running operating systems seems to be able to write to the file system,
    so RAM and swap area were used to act as the file system.

    - Applications were linked from the CD to their proper locations in the file system
    and uncompressed and on the fly when they were requested.


    overcome some of the challenges of running Linux on a computer without requiring
    a hard disk:


    +   - Options to save system settings and set up persistent desktops that data
    could be stored on hard disk or removable read/write media were added.

    - Smaller distributions were created (as Damn Small Linux) that could run entirely
    in RAM on low-RAM machines, so you could pop out your CD and use the drive while
    the Linux was still running. This also makes the operating system run fast! (I
    describe how to run DSL from RAM near the end of the chapter).


    Some people liked these live systems so much, they came up with ways of installing
    KNOPPIX, Damn Small Linux, and others on hard disk.'
  merge: -1
