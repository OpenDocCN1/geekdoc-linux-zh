  md: '# Chapter 8 — Setting Up a Server with BZFlag 233


    # Managing Bad Words


    To keep your server family-oriented, you can set up mechanisms to control the
    use of bad words. To indicate that callsigns (users as name) and chat (ongoing
    conversations) are free from bad words, you can add the following two options,
    respectively:


    +   - filterCallsign

    - filterChat


    The BZFlag source code contains two swear lists (simpleSwearList.txt and multilingualSwearList.txt).
    You can modify either of these lists to suit your needs. Then incorporate the
    one into your server as follows:


    ```

    -badwords/conf/multilingualSwearlist.txt

    ```


    If you decide that the filtering is too aggressive, you can have only exact matches
    of words on your bad words list a hit as follows:


    ```

    -filterSimple

    ```


    # Setting Server Name, Address, and Port


    When you start your BZFlag server, it listens on all your TCP/IP interfaces for
    requests to port 5154 (by default). You can change this behavior by specifying
    a particular interface and/or port number. You might want to identify a particular
    interface, for example, if your computer has interfaces to the Internet and to
    a LAN and you want to offer only the server on your LAN:


    ```

    - i 10.0.0.101

    - 5554

    ```


    In the previous example, the BZFlag server will listen only on the interface associated
    with your IP address 10.0.0.101 (presumably to indicate to your local LAN). To
    connect as a client from the local host, you would have to indicate this number
    as well (localhost will not work as the address). The port server will listen
    to 5554, so any clients using your server would have to know that number as well.


    When a client connects to your server, you can have a message displayed that you
    choose. You can also add several messages, as shown in the following example:


    ```

    -svrmsg "Welcome to the Linux Toys BZFlag server!"

    -svrmsg "Be nice and play fair."

    ```


    # Monitoring the Server


    There are lots of you can keep an eye on the activity of your BZFlag server. For
    a private server (without exposure to the Internet), you might get by just doing
    simple things, such as increasing the debug level as follows:


    ```

    -d

    -dddd

    ```'
