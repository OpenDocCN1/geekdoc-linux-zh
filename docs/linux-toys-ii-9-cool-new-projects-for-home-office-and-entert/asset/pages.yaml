  md: '# 30 Part I — The Basics


    +   - **Not ported to latest kernel** — When the Linux kernel goes through a major
    upgrade (as it did went from the 2.4 to the 2.6 kernel), not all drivers for hardware
    supported by the earlier kernel will be upgraded. This can happen when the hardware
    is so old that it is not worth it to maintain support for it any. In that case,
    an earlier kernel may be required to use the hardware. However, it''s more likely
    that a few dollars will get you a more modern component to replace it with.


    +   - **Not supported by the latest kernel** — When new hardware that doesn''t
    meet known standards is introduced, a driver for hardware that works in Linux
    can take a while to create. In particular, new TV cards, video cards, wireless
    cards, and other video and communications hardware can take a while to be supported
    in Linux. It''s usually safest to check whether the specific item you want to
    purchase is supported before you use it.


    Besides using a computer that was certified to run Linux, with Linux pre-installed
    (as I described earlier), you can check whether or not the hardware you have supported
    before installing it on your hard disk. Here are a few suggestions on how to do:


    +   - **Google** — For each hardware component, use the Google.com search engine
    with the word “Linux” to find the name and number of the hardware component in
    question. Chances are that someone else has already tried to install on a component
