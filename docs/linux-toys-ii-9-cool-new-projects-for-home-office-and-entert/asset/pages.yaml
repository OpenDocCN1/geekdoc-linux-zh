    # “How Do I Choose Hardware for Clients?”


    As I described with the “my 486” question, the computers you use as then clients
    can be always-away computers these today. If you are using them in a professional
    setting, however, the key is that you can leave off everything you would expect
    in a PC (hard disk, CD/DVD, and floppy drive) and include just a motherboard and
    a network card. Check out www.disklessworkstations.com for new client workstations
    that are certified to work with the Linux Terminal Server.


    The server you use with your thin client setup, must be up to the task of supporting
    as many clients as you expect to use simultaneously. That means:


    +   * Lots of RAM — Because all of the applications run by each client are actually
    running on the server (aside from the GUI, which runs on each client), you need
    to have enough 128MB of RAM for each thin client simultaneously using the server.'
