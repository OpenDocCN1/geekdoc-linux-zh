  md: '# 346 Part V — Appendices


    +   Check directory space usage. You can check the space used in a directory and
    all sub-directories using the command as follows:


    ```

    $ du -h /home/chris | less

    ```


    With the command using the -h to make it human-readable), you can see how much
    disk space is being consumed in a particular directory structure (in this case,
    all files and subdirectories under the /home/chris directory). By piping the output
    to the less command, you can page through the output. To see the total disk space
    used in a directory and its subdirectory, you can type the du -sh command instead.


    +   Check what processes are running. The ps command lists information from the
    system table about running processes. Here is an example:


    ```

    $ ps -ef | less

    ```


    The ps command lists the processes that are currently running on your system.
    The -ef options give you a good set of information relating to all processes currently.
    You can see which user is running the process, the process ID, the date process
    was started, and how much CPU time it has consumed. At the end of each line, you
    can see the full command name that is running.


    +   Check processes live. Using the top command, you can see the list of running
    processes, sorted in different ways. To start the top command, simply type the
    following:


    ```

    $ top

    ```


    The top command shows all running processes in a live, changing format. By default,
    processes are displayed by how much CPU time they are currently consuming (most
    from the top down). You can sort by how much memory each is using (type m), CPU
    usage (type c) or other attributes. Information at the top of the screen shows
    how much memory and swap space are being used.


    # Monitoring Logs and Mail


    Errors and activities associated with hardware detection and system services are
    logged in files in the /var/log directory. You can check logs using the less command,
    or watching them in a tail -f /var/log/messages. Red Hat Enterprise Linux systems
    come with a handy graphical tool for checking out log files. From a RHEL desktop,
    select Applications -> System Tools -> System Logs to see the System logs window
    (shown in Figure B-3).


    If you have difficulty problems during boot-up, you can check the Boot Log, Kernel
    Startup Log, or System Log. Check the X11 Log for troubles with your video card.
    Check the Mail regularly to make sure no one has taken your work as a spam relay.
    The System Log (/var/log/messages) is probably the best place to check for the-going,
    general health of your computer.


    The System Logs window flags any message that look like a potential problem by
    adding a red X in the left column. In the example shown in Figure B-3, there were
    problems reading a DVD I I had inserted that were flagged in the System Log.'
