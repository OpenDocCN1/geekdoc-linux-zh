    # Booting Workstations Using Etherboot


    Instead of booting from a bootstrap downloaded from the server (with PXE), you
    can create a boot image for starting the boot process. The Etherboot project (www.etherboot.org)
    offers software that you can use to create the boot image to start your LTSP workstations
    from a CD or floppy.


    You can create Etherboot ROM images from the www.ROM-o-matic.net Web site. The
    following procedure can help you create a floppy disk or Etherboot image (based
    on instructions from the www.ROM-o-matic.net site):


    +   1. ROM-o-matic.net. Open the www.ROM-o-matic.net Web site by your browser
    and select the link to the latest release (I used Etherboot 5.4.0). You will see
    a page for dynamically generating an Etherboot image.

    2. Choose NIC. The ROM image must contain the PCI ID of your network interface
    card, so the proper driver can be added to the image. You can determine the NIC
    in your computer using the lspci command (assuming that Linux is running or that
    you can boot a Linux Live CD using the Linux Toys II CD). Here''s how:


    ```

    $lspci -n | grep 020

    02.06.0 Class 0200: 10ec:8139 (rev 10)

    ```


    The lspci command lists information about PCI cards on your system. Most NICs
    appear as Class 0200. The identifier after the class number identifies the family
    (10ec for a RealTek NIC) and the specific identifier (8139 for the RTL8139 Fast
    Ethernet controller). Use the number that was output for your card and select
    it in the NIC/ROM box.


    +   3. ROM format. You can output the ROM as a bootable ISO image (that can be
    used on CD, DVD, or floppy medium) or zdisk (that can be used to produce a floppy
    image). There are other formats available as well. I used "Floppy bootable ROM
    (.zdisk)\ to create a boot floppy and "ISO bootable image without legacy floppy
    emulation, (.iso)\ to create a CD/DVD image.'
