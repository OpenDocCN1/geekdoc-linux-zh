  md: '# Appendix B — ABCs Using Linux 345


    > Caution

    It is generally considered good security practice to not stay logged as root user
    for long periods of time. For general desktop use, you should log in as a regular
    user, then only become root user to do the administrative tasks you need. When
    you are done running administrative commands, exit the root shell or close the
    administrative window.


    # Administrative Tasks


    # Common Linux Tasks


    The following are some common administrative tasks you might do with your Linux
    system, from a personal desktop to an enterprise-level server.


    # Checking System Resources


    There is no shortage of tools for checking the status of your Linux system. You
    want to make sure that you are not out of disk space, that your process is not
    being overloaded and that you have enough RAM to run the applications you need.
    Here are a few tools you can run to do those things.


    Try checking the man pages for any of the commands listed in the following sections
    you can use them with.


    +   - Check file system usage. You can use the df command to check how much space
    is available and used on each file system. Here is an example:


    ```

    $ df -h

    File system Size Avail% Mounted on

    /dev/hda6 9.7G 8.0G 1.3G 87% /

    /dev/hda1 99M 11M 83M 12% /boot

    /dev/hda2 49G 16G 31G 34% /home

    ```


    The df command lists how much space is available on your mounted file systems.
    This will mostly cover your hard disk partitions, but it will also show mounted
    CDs, flash drives, floppies, or other removable media as well. The -h option displays
    the output in human-readable form (megabytes and gigabytes, instead of 1K blocks).'
  merge: -1
