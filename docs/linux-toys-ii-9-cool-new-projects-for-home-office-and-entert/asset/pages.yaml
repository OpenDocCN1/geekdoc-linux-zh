    # Understanding Battle Zone Capture the Flag


    Like many open source projects, BZFlag was begun by a single person as a small
    idea that just took off. Chris Schoenen started what became BZFlag as part of
    his graduate studies in computer graphics at Cornell University in 1993. The project
    started as a demo program to spin a 3D model with a mouse.


    When a friend suggested that Schoenen make the demo into a game, he created tank
    models, the ability to shoot the tanks, and so that the game could be played against
    other players on a LAN. The game grew in popularity at Cornell and, over time,
    features were added such as teams, team bases, and Capture-the-style game play.
    With the addition of capture-the-flag, the game''s name changed from to BZFlag.


    More than a dozen years later, BZFlag (http://BZFlag.org/) has a thriving community,
    with more than 3,000 registered users and 34,000 articles at the BZFlag forums
    (http://my.BZFlag.org/bb/). At any time, there are dozens of public BZFlag servers
    running and waiting for you to join. New worlds and features are constantly being
    created and available for joining.


    The current BZFlag maintainer is Tim Ricker. Many other contributors to the project
    are listed as well. These include David Léonard, Jeremiah "CobraA1" Moss, Frank
    Siegert, "Chestal" Thilo, Colin Baker, David Thorbridge, Daryll Strauss, Dave
    Brosius, Sean Morrison, Alfredo Tupone, and David Remenak.'
