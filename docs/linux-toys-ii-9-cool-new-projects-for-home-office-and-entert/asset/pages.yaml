  md: '# 268 Part IV — Small Business Projects


    Linux applications that can play audio streams from Icecast over the network include
    XMMS, Rhythmbox, and MPlayer. Often, the URL to an Icecast audio stream is embedded
    in a Web page, from which your browser can launch a helper app to play the content
    or use an inline plugin (such as mplayer plug-in) to play the content. You can
    also publish the URL to your radio station on public Icecast Stream Directories
    (sometimes referred to as YP directories).


    Figure 10-1 shows how you can put together open source components to create your
    own radio station.


    ![](img/1b8a24a162893627b8005ac678b79236_292_0.png)


    Figure 10-1: Stream audio from a microphone, sound card, and playlist on a client
    machine through an Icecast server to the public.


    The path for starting your radio station begins with starting up the Icecast server.
    Next, configure the type of audio input you want by creating a playlist or configuring
    your sound card. Then you start a source client (such as IceS2) to direct that
    audio input in a stream to the Icecast server.


    It’s important to understand the difference between the Icecast server and the
    source clients that produce the audio content that the server broadcasts. The
    Icecast server never decides what content to play. The source client, as IceS2
    or Muse, is responsible for directing streaming content to the Icecast server,
    which simply broadcasts audio stream to audio players on your LAN or on the Internet.
    It’s possible (in fact, it’s quite normal) for the source client, Icecast server,
    and audio players to be running on different machines.


    * WiSeek'
