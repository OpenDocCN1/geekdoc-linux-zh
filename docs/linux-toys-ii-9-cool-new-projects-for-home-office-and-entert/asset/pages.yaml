  md: '# Chapter 7 — Automating Home Lights and Gadgets with X10 201


    SCENE blinker on Al1; off Al1; on Al1; off Al

    USERS normal_lights on front-porch; on back-porch

    SCENE tv_on on tv_set; dimb living-room 10

    USERS night_lights dimb front-porch; dimb back-porch $1


    The first SCENE, assigned to the name blinker, code/unit A1 and off twice each.
    The normal_lights USERSYN uses the aliases earlier (front-porch and back-porch)
