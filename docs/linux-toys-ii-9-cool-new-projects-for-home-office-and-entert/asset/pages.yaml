    # Using Workstations in Schools and Public Places


    While the "playing" features I described involve adding features to your client
    workstations, configuring LTSP as school workstations or kiosk mode mostly involves
    taking features away. Also, if kiosks are going to be used in public places, they
    need to be secured (both physically and in terms of the software they can run).


    Libraries and schools, where budgets are often tight, have made excellent use
    of the LTSP project to create specialized workstations so they can continue to
    use old or low-cost hardware. Here is some information about LTSP-related projects
    used in libraries and schools:


    +   * K12LTSP.org—This project created a custom version of Fedora Core for configuring
    LTSP servers and workstations that are appropriate for schools.


    +   * Linux and Library Web Kiosks—This presentation by Sam Deljeore at St. Louis
    University (www.edu.org/lita/litaevents/2004Porum/PS_Linux_Web_Kiosks.ppt) describes
    advantages of Linux and LTSP in libraries. (It''s a PowerPoint presentation, but
    it runs fine in OpenOffice.org.)


    A web browser is a natural application to run in kiosk mode. The idea is to configure
    your workstation clients once on the server, after which you can have lots of
    workstations that:


    +   * Boot directly to the web browser or other application in full-screen mode


    +   * Restrict users from running different applications or otherwise accessing
    the operating system


    +   * Display only a set of locations to restrict what the users can see'
