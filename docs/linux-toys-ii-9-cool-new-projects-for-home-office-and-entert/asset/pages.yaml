- img_proc: true
  md: '# Chapter 8 — Setting Up a Server with BZflag 217


    1. Create the configuration file. Open the /etc/bzfs.conf file using any text
    editor (such as edit or vi) and add any options you want to use with your server.
    There are dozens of options available for the bzfs server utility. To read about
    them, type man bzfs. Here is a sample configuration file you could begin with:


    ```

    # If default port (5154) is busy, use fallback port

    -pf

    ```


    ```

    # Give the buildings random height

    -h

    ```


    ```

    # Set maximum number of players to 30

    -mp 30

    ```


    ```

    # Set maximum simultaneous shots per player to 1.

    -ms 1

    ```


    ```

    # Disallow all bad flags

    -f bad

    ```


    ```

    # Sets number of super flags existing at a time to 10.

    -s + 10

    ```


    ```

    # Increase debugging level (twice)

    -d

    -d

    ```


    ```

    # Quit after serving a single game.

    -g

    ```


    I highlighted (in bold) the actual options (lines beginning with # are comments).
    Save the file when you have entered the information. Because the configuration
    file could contain information such as the server password that you don''t want
    everyone to see, you should restrict access to the file. For example, you make
    it so that the user running the server utility is the only one who can read it,
    as follows (replacing username with your user''s name):


    ```

    # chown username /etc/bzfs.conf

    # chmod 700 /etc/bzfs.conf

    ```


    As I mentioned, there are tons more options you can add to this file to tune how
    the game is run. But this should be enough to get started.


    2. Start the bzfs server utility. You can (and should) run the bzfs server utility
    as a regular (non-root) user. So, as a regular user from any shell, type the following:


    ```

    $ bzfs -conf /etc/bzfs.conf

    style: 2

    super flags allowed

    ```'
