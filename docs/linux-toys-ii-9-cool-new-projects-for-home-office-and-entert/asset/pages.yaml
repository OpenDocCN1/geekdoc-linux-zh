    # Summary


    The Linux Terminal Server (ltsp.org) is one of the best open source projects for
    making use of old or inexpensive computer hardware. Configure an LTSP server to
    provide the software that workstations on your LAN need to boot. Multiple workstations
    can all browse the Web, use email, write documents, or do thousands of others
    you can do with Linux, through the LTSP server.


    LTSP provides a centralizing the administration and resource allocations on one
    server. All the client work has to do is connect to the server over a LAN, boot
    up (using special PXE or Ethernet features), and log in. Using standard Linux
    user accounts, desktop applications, and configuration tools, users can operate
    their LTSP workstations as though they were working directly from the server’s
    monitor and keyboard.


    Once you understand the basic LTSP technology, you can enhance your LTSP server
    and workstations in various ways. A workstation can be configured to access a
    local printer or run local applications. Workstations can be locked down to provide
    special-use kiosks, for tasks such as Web browsing or library catalog searches.
    You can adapt and deploy your own specialized Linux distribution, as the K12LTSPorg
    project did when they created an LTSP-enabled distribution of Fedora suitable
    for schools.'
