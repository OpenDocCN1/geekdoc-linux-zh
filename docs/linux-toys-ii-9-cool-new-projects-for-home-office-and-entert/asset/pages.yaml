  md: '# Chapter 9 — Building a Dedicated SOHO Firewall 263


    # # Other Uses for Devil-Linux


    Various open source firewall/router/gateway distros have been popping up all over
    the place. I have seen them installed from small offices and libraries to lawyers''
    offices and car dealerships, and they really empower small-to-medium IT consultants.
    For example, by simply turning on the built-in squid proxy, AntiVirus/AntiSpam
    mail relay software, and Snort IDS systems, just about any moderately tech-savvy
    person is empowered to offer quality IT services to the community or small business
    sector.


    This free of open source empowerment has revolutionized the IT industry as before.
    Even big companies such as Linksys are using these types of solutions in the little
    blue boxes that you see at Walmart and CompUSA. The application, scope, and use
    are up to you, and because it''s all GPL source, the software is free, and you
    can modify it to meet your specific needs and services, as it should be.


    #  Running WiFi Access Points


    Another SOHO/using of open source firewalls that are quickly gaining popularity
    is the placement of the hardware into a rugged, weathered, Pelican case (see .pelican.com)
    with a WiFi card and cables. These weatherproof systems are then used as wireless
    access points with packages like NoCatSplash for for (or free) WiFi hot spots.
    In this type of configuration you would want to ditch the floppy and go with USB
    flash or CF storage device for higher reliability)


    You can see the obvious advantage of a rugged DIY WiFi system for under $200,
    compared to the $800–$4000 similar commercial setups. Often, the commercial solutions
    use some of the same software that you''ve covered here!


    #  Running a 3NIC DMZ Firewall Configuration


    If you''re doing any DNAT or port redirection, as a small company might do if
    it had a Web server inside its network, you might need to look into running a
    Demilitarized Zone (DMZ) configuration to protect your network by putting your
    Web server in a protective buffer.


    A DMZ can be configured in Devil-Linux by simply adding a third network card,
    the 3NIC firewall configuration from the setup system, and just entering the hardware
    and service setup variables for it. This allows you to run a Web server, mail
    server, or any externally accessible system within a “DMZ bubble”, if you will.


    The DMZ area is not fully exposed to the Internet, but does have access to your
    internal LAN either. Just as you select and customize the 2NIC firewall.rules
    file, you can also select and customize the 3NIC firewall.rules config file. See
    the Devil-Linux documentation for more information on this very popular and secure
    configuration.'
  merge: -1
