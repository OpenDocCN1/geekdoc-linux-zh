  md: '# # Setting Up a Game Server with BZFlag


    While the number of popular computer games for Microsoft Windows still far outstrips
    those available for Linux, as a gaming server, Linux is an extremely popular platform.
    Linux server software is available for hundreds of commercial games, allowing
    your Linux server to bring together dozens or hundreds of online gamers at a time.


    From the pure, open source standpoint, there are some fun games that have completely
    free client and server software that you can set up and play against others on
    your LAN or over the Internet. These include board games (such as Go and Atlantik),
    strategy games (such as freevic), and battle games (such as BZFlag).


    To try your hand at setting up and playing from your own gaming server, I describe
