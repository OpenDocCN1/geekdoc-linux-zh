  md: 'Keep in mind that this firewall/router project is designed for a network that
    you expect to be

    small and stable, but for which you still want fast performance. If you decide
    to start running

    apps as a squid proxy server or a SNORT intrusion detection system (IDS), you''re
    going to

    need a bit more horsepower and storage. Running applications like those will usually
    require a

    hard drive for the large files that will be generated and stored, and more RAM
    is always a good

    thing In fact doubling the amount of RAM that you think need is usually a good
    forward-

    thinking rule of thumb. So where you think need only 64MB, use 128MB.


    ![](img/1b8a24a162893627b8005ac678b79236_268_0.png)


    # Underclocking Gets You More


    The purpose of this section is to help you take a normal, older desktop-quality
    system and

    make it like a high-availability, rock-solid whatever that can run for years on
    end without

    so much a reboot. To do this, you have to take an already slower system, turn
    the speed

    down a bit (called underclocking) to make it cooler so that you can pull the fan
    off the

    CPU. Running a system without the need for moving parts such as fans and drives
    will

    greatly increase your long-term stability and reliability.


    The whole idea of high-dollar, high-availability enclosures with redundant power
    supplies,

    RAID drive arrays, temperature monitoring, and fine cooling is for your enterprise-level

    outfits — but remember the engineer''s mantra: KISS (Keep It Stupid). Another
    way

    to design a system for stability is to simply decrease its operational parameters,
    far below

    normal operating rates.


    By example, my system is composed of an old AMD K-2 400 MHz system that I''ve

    "tuned" to 250 MHz and a large heat sink from which I removed the fan. When

    underclocking and pulling off the fan, the only thing you have to worry about
    is the size of

    your heat sink and watching the temperature of the processor (see the related
    sidebar on heat

    sinks). You can''t just pull the fan off and pull the system on line or the CPU
    will quickly cook

    itself. First you want to decrease the CPU speed (by around one-half) and then
    pull the

    fan off the CPU heat sink (it''s screwed on).


    If you have a motherboard/BIOS configuration that gives you real-time temperature
    feedback,

    check the temperature before and after you turn down the CPU MHz and pull the
    fan.

    The actual CPU speed is usually controlled via the BIOS/software settings, or
    via a DIP

    switch or jumper settings on the motherboard. The CPU speed is achieved by multiplying
    the

    bus-speed by the CPU multiplier. Double not messing with the front side bus (FSB)

    clock speed (rated in MHz). Instead, turn down the clock multiplier. Usually AMD
    and

    some Pentium systems have multiplier settings of something like 2, 2.5, 3, 3.5,
    4, 4.5, and

    5.5. With a 100 MHz FSB clock, that will result in anything from 200 to 550 MHz.


    ![](img/1b8a24a162893627b8005ac678b79236_268_1.png)


    You might want to have a dry hair to blow room-temperature air on your CPU/sink

    just in case, that after removing the fan, the CPU/sink gets too hot.'
