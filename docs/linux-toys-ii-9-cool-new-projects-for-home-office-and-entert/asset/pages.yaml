  md: '# Future Directions for MoviX


    Roberto De Leo has many plans for future development of MoviX projects. Here are
    some of the future plans he passed on to me. If you are interested in helping
    with any of these develop-ments, please contact Roberto through the MoviX Web
    site.


    +   - Builder — A set of scripts for compiling MoviX/MoviX binaries from scratch
    is already in the works. The scripts were written by Rémi Turbault and will be
    released soon. They could help users set up new drivers or build their own dedicated
    distributions. The dedicated distributions could focus on other applications.
    Roberto suggested strictly such as Movix, Doomix, or Whetherix could grow from
    this.

    - Encoding — Currently, the process of grabbing and encoding video is not part
    of the MoviX projects. MPlayer needs the mencoder utility, which Roberto hopes
    to add to MoviX menu so a user could encode videos from a card from a MoviX distribution.

    - GUI — Instead of the interface, which lets users choose from three different
    sections, Roberto would like to have one high-quality GUI to operate the project
    (as MythTV). In the best case, the GUI would be customizable to different dedicated
    distributions. (If any MythTV developers, or anyone else for matter, would like
    to help the MythTV frontend to MoviX or develop a new frontend, please contact
    Roberto.)


    Once the MoviX distributions are fairly stable, Roberto would like to branch out
    into other dedicated distributions. Here are some examples he mentioned:


    +   - ePicTX — A distribution that can autoboot and play a CD or DVD full of photos.
    If a similar feature is not added to MPlayer, it could be done directly by eMovieX

    - eGamis — A distribution containing your favorite game that you''ll be able to
    play on every PC without wasting installing anything. With eGamis including a
    network game (such as Doom and related games), eGamis could make up a LAN party
    quick and easy. You won''t have to spend half your LAN installing the games and
    fighting with Windows or other client operating systems to make everything work.

    - eParted — A distribution containing only QtParted that people could use to partition
    their hard drives before installing an operating system.


    Using tools that the MoviX project will make available, Roberto encourages people
    to create distributions like these and others that would benefit from being bundled
    with a simple, dedicated distribution.'
