    # XDMCP Configuration


    On Fedora and Red Hat Enterprise Linux, the X display manager does not listen
    for XDMCP or chooser as a security concern. You must change this behavior to allow
    graphical logins for your LTP workstations. The easiest way to do this is from
    the Login Screen setup window (before you enable the XDMCP service using the ltspcfg
    command). From the LTP server, the following:


    +   1. From the desktop panel, select Desktop → System Settings → Login Screen.
    (If prompted, login as root user)

    2. Click the XDMCP tab. A set of XDMCP settings appears.

    3. Select XDMCP. All XDMCP fields are enabled, as shown in Figure 11-4.


    ![](img/1b8a24a162893627b8005ac678b79236_328_0.png)


    FIGURE 11-4: Enable XDMCP to present login screens to client workstations.'
