  md: '# # Making Bootable Movies with eMoviX


    If you are just like me and do all your video recording in Linux, you may wonder
    how you can share the TV shows, personal videos, and other media content with
    friends and family who don''t use Linux. How can you get the video from your hard
    disk to the people you care about in a way that they can play it?


    Well, instead of just hoping they have a way to play your favorite video format,
    why not give your home movie with a player that you know can play it? In fact,
    why not give them the operating system with it you know that your player will
    run?


    What I''m talking about are bootable movies. Using eMoviX (a special version of
    theMoviX multimedia distribution), you can create a CD or DVD image that contains:


    +   - Video files - You can put as much content as fit on the bootable CD or DVD.
    You can also add music files (MP3 and Ogg Vorbis) or other types of content that
    can be played by the MPlayer media included with eMoviX.

    - eMoviX - This Micro Linux is generated for playing movies. It doesn''t contain
    more than a mini Linux (created using User-Mode Linux and Debian packages) and
    MPlayer (to play the movies). All the software adds about 10MB to the disk space
    you use.


    From almost any PC, your friends and family will be able to boot up and immediately
    begin playing your video from the CD or DVD you give them. It''s also a great
    way to introduce them to the use of Linux as a multimedia system.


    This chapter describes how to capture video in Linux, combine that to make a bootable
    ISO image, burn that to CD or DVD, and play back the content. If you enjoy eMoviX,
    you''ll probably want to try the full MoviX² distribution (also included in this
    book). Later in the chapter, I describe how you can use MoviX² to play more kinds
    of multimedia content you can grab from a local hard disk, network, or other CD
    or DVD media.'
  merge: -1
