    When you are using the x10.sched file, you can check the file for errors before
    uploading it to the CM11A by typing the following command:


    # heyu upload check


    The results of the check are placed in the report.txt file in that directory.
    If the check without working errors, you can compile the schedule file and upload
    the memory image to the CM11A EEPROM by typing the following command:


    # heyu upload


    If there are no errors in the schedule file, x10record, x10macroref, x10image,
    and report.txt files are written to the $HOME/.heyu directory. The x10record stores
    the mode and time of the schedule file you uploaded most recently, so Heyu knows
    the correct offset to use when the CM11AS clock needs to be.


    The x10macroref file lists EEPROM addresses of the macros that were uploaded,
    so they can be used by the Heyu monitor and state engine. The x10image is a 1024-binary
    file image of the EEPROM and is used by heyu commands. Finally, the report.txt
    file contains details about the processing of data that was uploaded to the EEPROM.


    To check when the uploaded schedule file expires, type the following command:


    # heyu upload status

    Schedule:/home/chris/.heyu/x10.sched


    Expanded timers = 89 Max days/dawn over the 366 day period = 3 minutes. Interface
    memory free = 18%

    See file /home/chris/.heyu/report.txt for details.

