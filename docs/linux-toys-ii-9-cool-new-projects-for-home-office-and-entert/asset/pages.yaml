  md: '# # Creating a Web Photo Gallery


    While taking tons of digital photographs is easy, sharing digital photos has turned
    out to be a lot more challenging. Email systems were not designed to handle multi-megabyte
    attachments. Printing out every picture cousin Millie might like to see just isn''t
    feasible. Creating your own Web photo gallery is a great alternative.


    Gallery (http://gallery.sourceforge.net) is a high-quality, open source project
    for publishing and managing your digital photographs on the Web. Gallery gives
    you a lot of control over your content. You can authenticate users to manage what
    each person can see or add to the gallery. With Gallery, you also have minute
    control over every aspect of the look-and-feel of your albums.


    This chapter describes how to install, set up, configure, and maintain your own
    Gallery digital server.


    # ## Overview of Gallery


    Gallery is a Web-based software package that allows you to publish and maintain
    collections of photo albums. The package contains extraordinary flexibility in
    configuring how the main gallery, the albums in Gallery, and the photographs themselves
    are displayed and managed.


    To set up and control Gallery, you will need to have an administrative (admin)
    user assigned to your personal gallery. That user has total control over the functioning
    of your server. A Web-based configuration wizard lets the admin user check that
    all the components needed by Gallery from the operating system are available.
    It then lets you define specific settings to relate to your personal gallery and
    albums.


    Gallery provides lots of ways for visitors to browse, search, and sort the images
    in your photo gallery. Hooks in Gallery let you or any visitors send images from
    your gallery to professional printing services to have prints made of the images
    you choose. (The admin needs to choose which printing service to make this feature
    available on a particular gallery.)


    By creating user accounts, the admin can also allow selected users to create their
    own albums and then add, delete, and modify the images in those albums.


    # # chapter 3


    # ## in this chapter


    +   - Installing Gallery

    - Checking and configuring Gallery

    - Creating photo albums

    - Using Gallery

    - Administering Gallery

    - Troubleshooting Gallery'
