  md: "# Chapter 11 — Building a Thin Client Server with LTSP 303\n\nTFTP services\
    \ run in a cloud environment in Red Hat Linux systems. (The location may be different\
    \ on other Linux systems).\n\nThe workstation002 in the preceding code shows an\
    \ example of a configuration for a workstation that will boot by PXE network boot\
    \ (see the section \"Booting Up the Workstations\"). The influx.0 file on the\
    \ server is a 16KB bootstrap file (rather than the 2MB vmlinuz file used to boot\
    \ the machine). It's necessary for the bootstrap file to start first, and then\
    \ load the kernel because the PXE feature on the network card cannot handle more\
    \ than 32KB file.\n\nYou can add as many workstations (hosts) as you want. You\
    \ can use the IP address scheme and the host-naming scheme, or come up with your\
    \ own. You will, however, need to determine the MAC address of each network card\
    \ used for workstation and for each hardware Ethernet entry.\n\nIf a Linux version\
    \ is running on the workstation, you can determine the MAC address by using /sbin/ifconfig.\
    \ In a DOS window in a Windows system, type ifconfig. The MAC address will be\
    \ listed by HWaddr or Physical Address, respectively.\n\n![](img/1b8a24a162893627b8005ac678b79236_327_0.png)\n\
    \nThe example you've seen is a fairly secure way of configuring LTSP, as only\
    \ computers with specific network cards (based on unique MAC addresses) can connect\
    \ to it. In many cases, you might simply want to let any machine that connects\
    \ to your LAN be able to boot up to the LTSP server. Here is how the subnet section\
    \ might look in a more open LTSP setup:\n\n```\nsubnet 10.0.0.50 255.255.255.0\
    \ {\nrange 10.0.0.10 10.0.0.200;\nif subscribing (option vendor-class-identifier,\
    \ 0, 9) = \"PXClient\"\n filename = \"/ltsps/2.4.26-ltsp-2\"; # PXE Boot Loader\n\
    else\n filename = \"/vmlinuz-2.4.26-ltsp-2\"; # Ethernet kernel\n}\n```\n\nIn\
    \ this example, the DHCP server will handle addresses in the range of 10.0.0.102\
    \ to 10.0.0.300. To tell which of boot loader to use, the DHCP server checks if\
    \ the vendor-class-identifier from each client is PXClient. If it is, the vmlinuz-pxeb\
    \ boot kernel is used. If it is not, the vmlinuz-2.4.26-ltswp boot kernel (Etherboot)\
    \ is used.\n\nThis example was adapted from the LTSP DHCP page, where a longer\
    \ example (including PPC boots) is shown (http://wiki.ltsp.org/wiki/bin/view/Ltsp).\
    \ Refer to that page for more details on setting up DHCP for LTSP server.\n\n\
    # TFTP Configuration\n\nAfter starting the ltspcfg command, type 4 to set up your\
    \ server's TFTP service (ftpd daemon). When prompted, type y to enable the service.\
    \ In Fedora or other Red Hat system, this sets ftpd to start automatically, but\
    \ it doesn't start the service immediately. (Press Enter to return to the menu)."
