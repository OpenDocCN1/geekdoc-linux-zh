  md: '# # Creating a Personal Video Recorder with MythTV


    # chapter 4


    We’re at a key point in history, where separate activities such as watching TV,
    surfing the Web, checking out local weather, and flipping through the family photo
    album is in the process of fundamentally changing. Convergence of several key
    multimedia and Internet technologies is making it possible for all audible, visual,
    and informational to be consolidated into a single device in the home or office.


    Personal Video Recorders (PVRs) such as TiVo lead the way in this media revolution.
    But similar technologies like MythTV and others are picking up the ball and running
    with it. No longer limited to recording and playing back TV shows, these Media
    Centers are taking on every aspect of our media lives.


    MythTV is an open source, modular PVR project that is evolving faster and gaining
    features than any other media system. With its add-ons, it has grown from a PVR
    to a full-blown Media Center. In addition to performing all the normal PVR-type
    of recording and archiving your favorite shows to VCD (Video CD) or DVD, it also
    stores your music in countless formats.


    MythTV can intelligently play back the songs it notices you like more than others,
    detect and skip commercials (which PVRs no longer allow you to do), and serve
