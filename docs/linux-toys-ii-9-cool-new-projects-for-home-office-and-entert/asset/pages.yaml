  md: '# Rolling Your Own Devil-Linux System


    These amass distros don''t lock you in; they are designed to be open. Instead
    of just burning the preconfigured boot.iso CD and starting with that software
    set, the Devil-Linux system, for example, comes with all the tools and documentation
    that you need to customize, build, and burn your own customized distro ISO image.


    For a more personally hardened solution that you could potentially sell to a client,
    you could build a custom Devil-Linux distro that boots and runs totally from a
    128MB CompactFlash card. This level of customization is not only possible; it''s
    encouraged! With these types of flexibility in place, the list of uses is literally
    endless.


    # Summary


    You can build your SOH firewall system with nothing more than spare parts, some
    planning, and a little patience. You can take a single PC broadband connection,
    and put several hundred machines on that connection behind a firewall/gateway/router.


    The hardware can be specially tuned to be extremely reliable with uptime on the
    order of years. Combine with this all of the additional software services that
    you can simply enable or modify on your dedicated firewall, and you suddenly have
    a plethora of options for what you can do with such a system.


    Remember, before you dive in, be sure to sit down and figure out what you actually
    want to do first, iron out the types of services that you need, and plan your
    resulting network layout. After doing those tasks, you can intelligently choose
    the firewall distro that best suits your needs, detail the hardware requirements
    of the project, as well as conceptualize and design your specific needs into the
    solution.


    After you put together a system in this manner, you will really understand the
    security that the system does and does not provide you and your internal LAN.
    Security is no longer an illusion for you. It''s real, you know where its boundaries
    are, and as a result, you will be ahead of the guy who just went out and bought
    his firewall off the shelf.'
