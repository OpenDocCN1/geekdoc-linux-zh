    Another to keep up on your system health is to check the root account''s mailbox
    on your system. Often, email to the root user is forwarded to another user, especially
    in the case where the system administrator is managing a lot of systems. There
    are several background processes (called daemons) and cron jobs (commands set
    up to run at particular times) that monitor your system activities and send to
    the root user with any potential problems. Here are some examples:


    +   - diskcheck: This script runs hourly to check if any of your partitions have
    low disk space. It sends an email to the root user if a partition is low on space.

    - logwatch: The logwatch package is configured to scan through your log files
    and reports of interesting and suspicious activities (which it alerts to the root
    user).

    - sudoers: If some user not configured to use sudo to gain root access tries to
    do, an email is sent to the root user to note that fact.


    There are other software packages that run programs using the cron facility (from
    /etc/cron.daily, /etc/cron.hourly, /etc/cron.monthly, and /etc/cron.weekly) that
    send messages containing information or problems related to processing the root
    user. It''s a good idea to check the cron directories to get a sense of the kind
    of applications your system is running on an on-going basis.


