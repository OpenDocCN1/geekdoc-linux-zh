  md: '# 256 Part III — Home Projects


    If you do not have the CPU and RAM resources to run a caching bind/name server
    on your devil-linux gateway, consider running the lightweight dnsmasq service.
    It is a simple way of using the NAT feature of Devil-linux along with the dnsmasq
    service for DNS forwarding and for a small network of internal machines. Dnsmaq
    is not configurable from the Devil-Linux text GUI, so you will have to configure
    it manually. More information on this service can be found at http://thekelly.org.uk/dnsmasq/doc.html.
    Also see the example configuration file at /etc/dnsmasq.example.


    # LoginPW

    You need to change the default blank login password to a more secure one. The
    LoginPW option on the Main Menu (see Figure 9-5) is the firewall''s root password
    that you will be asked for logging into the system from console or via ssh as
    root. Make it secure that you will remember, but something that you don''t have
    to write down.


    # Config


    The Config option on the Main Menu allows you to save all your changes to the
    floppy disk, a critical step to remember.

    The system compares your changes to the files on the floppy and asks you if you
    still want to save your config to floppy. Press y. It will take a minute or so
    to save the changes.

    Now out of the configuration screen, and back at the root prompt, type reboot:


    ```

    root@Devil:~ # reboot

    ```


    You should be able to let the system reboot unattended.

    After Devil-linux reboots, hook a laptop or any of your internal PCs up to the
    switch that your SOHO firewall is booting DHCP on and boot the internal laptop
    or PC. Does it get onto the network? Type / the internal system to see if your
    internal machine has an IP address (windows, use ipconfig).

    Next, from the internal laptop or PC, ping 192.168.1.1 (the internal firewall
    interface), and then ping 216.239.37.99 (google.com IP). Finally, ping google.com.
    Did they work? If so, your internal machines are now online and using your firewall
    and its DNS and it all works! Congratulations! Don''t start hooking all your machines
    to the LAN just you. You should change the DHCP configuration to meet the requirements
    of the network you designed (referred to Table 9-1).


    # Customizing Your DHCP Network Configuration


    We have basic functionality and Internet access. Before hooking all your computers
    up and hanging out DHCP assignments and leases, consider what settings you need
    to customize (see Table 9-1) on your firewall/gateway/router. This level of configuration
    detail can''t be done with the regular text-GUI configuration interface of Devil-Linux.
    To modify your DHCP server settings for the IP addresses on your own LAN, you
    must manually edit your dhcp.conf file.'
