  md: '# 146 Part II — Multimedia Projects


    # From Your Hard Disk


    MiViX looks for partitions on your hard disk and automatically mounts them (read-only)
    so you can play video, audio, or digital images from there. Select a file to play
    from your local hard disk, open the MPlayer menu (left-click the mouse) and select
    Open → Play file. Select the /discs directory.


    In the /discs directory you should see your hard disk partitions mounted. In my
    case, there were three partitions on the first hard disk: disc0.part1, disc0.part3,
    and disc0.part5. Click to subdirectories of any of the mounted partitions and
    select video or audio to files.


    # From the Network (FTP)


    By starting up a network connection (if a DHCP server is available) or entering
    your own IP addresses (as described earlier in this chapter), you open the possibility
    of being able to grab content from other places on the network. One way to open
    your system to upload content is by turning FTP service to your MiViX system.


    Follow these steps to start the FTP service so you can upload video to your MiViX
    system:


    +   1. Select Alt+F1 to go to the MiViX menu screen.

    2. Select Play → FTP Server → On. This should start the bftpd server.

    3. Select Alt+F3 to go to the shell prompt.

    4. Open a directory for writing on your MiViX system so you can copy content there.
    To do that, unmount the directory you want to remount it with read/write access.
    For example:


    ```

    # mount /discs/disc0.part3

    # mount -rw /dev/discs/disc0/part3 /discs/disc0.part3

    ```


    The partition you want to open may be a different one (such as part1 or part2).


    +   5. Type ifconfig eth0 and look for your IP address (listed after inet:).

    6. From another computer on your network (with the current directory containing
    you want to transfer to your MiViX computer), use an ftp command to connect to
    your MiViX player. For example:


    ```

    # ftp 10.0.0.98

    220 Welcome to the MiViX FTP Server.

    Name (10.0.0.98:root):

    ```


    Press Enter to log in to the MiViX FTP server. it should drop you into the /discs
    directory on your MiViX computer.


    +   7. Next, change to the directory you want to put the content and put the content
    there. For example:


    ```

    ftp> cd /discs/disc0.part3

    ftp> put myvideo.mov

    ```'
