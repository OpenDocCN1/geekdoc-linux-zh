    # Choosing Your Hardware


    This section explains the various configurations that MythTV can be set up in,
    and the ramifications this will have on your required hardware set. Your media
    playing and recording needs dictate what type of hardware you need to build the
    home-DVR system of your dreams.


    # Frontend Only or Backend Frontend?


    MythTV is not a single "recorder/player" type device like TiVo. MythTV is actually
    an advanced client/server multimedia system that serves entertainment content
    much as a network server serves HTML content to a browser.


    Put another way, the MythTV is divided into a MythTV backend (server) component
    that schedules, captures, and stores more content, and a MythTV frontend (player)
    that displays and interacts with you, the end. The frontend component communicates
    with the MythTV backend to pull the content and interact with the gallery, A/archives,
    and other parts of the MythTV system, and display the requested media wherever
    you want to view it. This could be on a remote laptop somewhere on the home network,
    or on a machine that is running the backend and also happens to be connected to
    your TV.


    Because MythTV is divided into client and server components, you can have one
    large backend and storage system in one, and then several frontend systems in
    different parts of the house (over a LAN), all accessing the single backend media
    center for content. This is a very nice feature that no other home media system
    at this price can match.


    The MythTV backend is usually centrally located wherever your TV inputs and connection
    are situated. That also happens to be where most people end up watching or interacting
    with their AV systems. If you''re building only one system for that, then system
    will need to run both the client (frontend) and the server (backend).


    In a smaller MythTV frontend system (player only) you can get away with running
    MythTV on a fairly modest hardware set, such as a 1 to 2 GHz system with 256MB
    of RAM and 10GB hard drive. If you need to run a single backend frontend (player
    + recording/re-encoding/storage) setup, as this chapter guides you through, the
    hardware requirements are much higher. I recommend a 2.5 to 3 GHz processor, 256
    to 512MB of RAM, and'
