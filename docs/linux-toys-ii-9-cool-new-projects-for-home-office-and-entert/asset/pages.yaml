    # Managing Hardware Devices


    While hardware detection has improved in recent years with Linux, there are times
    when Linux will not detect a device or properly identify it. At those times, it
    helps to know something about tools for listing, modifying, and loading drivers
    in Linux.


    Device drivers and modules define the interface between your computer''s hardware
    and the applications you run. Because there are so many potential device drivers
    that you might need, only the most basic drivers are built into the Linux kernel
    when you boot the computer or plug in a module device, using what are called `loadable
    modules`.


    If your hardware device is properly detected, it will either run from a driver
    that is built into the kernel or an appropriate module to handle it (if that module
    is known and available). If some piece of hardware is not working when you install
    Linux (maybe a sound card or Ethernet card, for example), there are some things
    you can figure out what wrong:


    +   1. Check the boot log. Run the command to print the kernel ring buffer, which
    contains information about your bootprocess:

    `$ dmesg > bootinfo.txt`

    Look at `bootinfo.txt` file you just created. It should contain information about
    what happened when the hardware was detected and what might have gone wrong. If
    you cannot solve the problem yourself, search in a Linux mailing list or online
    forum for information to help you debug the problem.

    2. Search for a solution. Use your favorite search engine to search for the name
    of the hardware that is not being detected and the word Linux. Chances someone
    else ran into a problem with the same hardware might offer insights.

    3. Try Small Linux or KOPPIX. Live bootable CDs, such as KOPPIX and Damn Linux,
    are doing a good job detecting hardware and loading the correct driver. If you
    suspect there might be a problem with some piece of hardware on your computer
    in installs Linux, it can even be a good idea to try KOPPIX or DSL before you
    install permanently on your hard drive. DSL is included on the Linux Tails II
    CD, so you can boot to DSL and check how well Linux can run


    In some cases, you will need to get a module that is not included with your Linux
    distribution. Once it is installed, the next reboot might properly load the module.
    Or you might have to


    ```

    $ dmesg > bootinfo.txt

    ```'
