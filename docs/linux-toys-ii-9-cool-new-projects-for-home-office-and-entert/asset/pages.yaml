  md: '# 262 Part III — Home Projects


    # DNAT or Port Forwarding (Optional)


    The last common change people like to set up, especially in a small office environment,
    is a Destination NAT DNAT configuration, also referred to as port forwarding.
    This is an optional configuration by which you can direct all incoming traffic
    on a specific destination port to a internal destination IP and port.


    Port forwarding is commonly done with HTTP, for example. In this process, an incoming
    request on port 80 gets redirected to an internal IP address. For example, in
    the network design you had a staging/development server on 192.168.1.7. With DNAT/forwarding
    set up, you can redirect all traffic coming in port 80 or 8080 to this staging
    server. You can set this up very easily using the well-documented example in the
    firewall.rules file:


    ```

    # Uncomment/modify the next 4 lines to forward to an internal IP.

    # SERVER_IP=192.168.1.1 # Internal IP of server.

    # PORT=22 # 22 + ss. Change to 80 for web server, etc.

    # IPTABLES -A PREROUTUTING -i $(OUT_DEV) -t nat -p TCP --dport $PORT

    $PORT -j DNAT --to $(SERVER_IP):$PORT

    # IPTABLES -A FORWARD -p TCP -d $(SERVER_IP) --dport $PORT

    # -i $(OUT_DEV) -o $(INT_DEV) -j ACCEPT

    ```


    Just uncomment the last 4 lines (being mindful of the line wrapping) and modify
    them to redirect incoming port 80 (Web) requests to the 192.168.1.7 on port 80,
    like this:


    ```

    # Uncomment/modify the next 4 lines to forward to an internal IP.

    SERVER_IP=192.168.1.7 # Internal IP of web server.

    # PORT=80 # traffic directed to staging web server.

    # IPTABLES -A PREROUTING -i $(OUT_DEV) -t nat -p TCP --dport $PORT

    $PORT -j DNAT --to $(SERVER_IP):$PORT

    # IPTABLES -A FORWARD -p TCP -d $(SERVER_IP) --dport $PORT

    # -i $(OUT_DEV) -o $(INT_DEV) -j ACCEPT

    ```


    Again, this change by restarting the firewall init script:


    ```

    # etc/init.d/firewall start

    ```


    Do some testing, and if save your new config to floppy using the save-config command.


    By setting up your firewall requests for a port to another computer on your network,
    you are adding risk to your internal network. In the preceding example, any attack
    on port 80 (used for Web) of your firewall will be forwarded to your internal
    server. If internal server is not patched, and someone on the outside launches
    a Web attack on it, there is the very real that that could compromise (or crack
    into) your internal server. In other words, port forwarding effectively bypasses
    your firewall security for those ports you allow forwarding. Firewalls do not
    prevent you from having to maintain any other fundamental security steps such
    as OS/service patching and password policies.


    If you are going to allow DNAT or port forwarding, you definitely want to look
    into running your firewall with a third network card in what''s called a Demilitarized
    Zone, or DMZ, as described in the following section.'
