  md: '# Chapter 9 — Building a Dedicated SOHO Firewall 259


    # # Locking Down Your Firewall


    Now that you have a basic, assumed firewall in place, you can start looking at
    ways to customize it.


    Why do I say "assumed" secure? Because of the fundamental security tenet that
    if you''t truly understand how the inside of your security system works and what
    its weaknesses are, security is just an illusion. In this principle, I encourage
    you to at least know where your firewall script is located (in case anyone ever
    asks about it), and even have a peek inside and to follow the flow of its Access
    Control List (ACL) style.


    If you want to look about the default 2NIC firewall startup script (assuming that
    your configuration chose), it is very well documented and easy to modify: The
    Devil-Linux firewall rule set is located at `/etc/init.d/firewall.rules`.


    If you''re not comfortable with iptables and don''t want to bother with learning,
    check out some of the firewall-building tools like Fwbuilder or Shorewall (mentioned
    earlier). If you wouldn''t mind getting to know more about iptables, check out
    chapters of Linux Troubleshooting Bible or Linux Bible, 2005 Edition, another
    online iptables beginner guide is www.siliconvalleycie.com/linux-hn/iptables-intro.htm,
    or if you want a bit more, see `http://iptables-tutorial.frozentextweb.net/`.


    Some aspects of your firewall you may want to secure what the default config includes,
    while others may want to loosen. For example, you might want to loosen firewall
    rules to do DNAT or port forwarding your firewall settings to poke holes in your
    firewall to allow certain protocols to traverse to all your internal hosts (not
    recommended unless required)


    A good security tip is to disable root ssh logins all together. To do this, simply
    open the configuration file `/etc/ssh/sshd_config` and change the `#PermitRootLogin
    yes` line to `PermitRootLogin no`. Restart the sshd service and verify your configuration
    to your media. This is how you log in as a non-root user, and then use the `su
    - or sudo command to perform root-privileged operations. To do this, you would
    need to add a new user to your Devil-Linux configuration, because no-administrative
    users are configured by default.


    Before you do, however, take a look at the setup that you have, and what it currently
    looks like to people beyond your LAN as well as in the outside world.


    # Give It a Sniff, Inside and Out


    First you will want to see how the network profile of your firewall locks to someone
    on the inside of your network, so that you can see if anything is unexpectedly
    exposed. Use the following command:


    ```

    # nmap -sS -O 192.168.1.1

    Starting nmap 3.70 ( http://www.insecure.org/nmap/ ) at 2005-04-01 23:15 EST

    Interesting ports on 192.168.1.1:

    ```'
