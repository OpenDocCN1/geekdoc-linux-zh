  md: '# Chapter 3 — Creating a Web Photo Gallery


    1. Insert the Linux Toys II CD in your CD drive. If your CD mounts automatically,
    you can skip the first command. If it doesn''t, run the following (possibly replacing
    /media/cdrecorder with the location where your CD was mounted) as root user from
    a terminal:


    ```

    # mount /media/cdrecorder

    ```


    2. Next, change to the RPMS directory for Gallery and run the installme script
    as follows:


    ```

    # cd /media/cdrecorder/RPMS/ch03-gallery

    $ .installme

    ```


    This installs all RPMS needed for this project (in this case, just the jade package).


    # Installing Gallery


    The following is a procedure for initially installing Gallery on your Linux server:


    > The copy of the Linux Toys II CD comes directly from the Gallery project web
    site. Before you install it, check the Gallery site at http://gallery.sourceforge.net
    to see if any critical packages are available. In fact, if Gallery 2.0 is available,
    you should consider that instead (although much of the user interface will differ
    from what is shown here). At the very last, I recommend subscribing to the gallery-announce
    mailing list (low-bandwidth) to get notices of any critical updates.


    1. Unpack Gallery to a directory accessible to your Web server. Wherever you unpack
    the software, it will create a subdirectory named *gallery*. If you are going
    to make your Gallery public (or at least available on your LAN), you must install
    them in a location that can be accessed by the Web server. For example, a Gallery
    installation for a user named chris, might go in the /home/chris/public_html/gallery/.
    A system-wide installation might go into /var/www/html/.


    Here is what you type from a Terminal window to unpack the Linux Toys II CD for
    a personal installation of Gallery (subtitle your user name for chris):


    ```

    $ mkdir /home/chris/public_html

    $ cd /home/chris/public_html

    $ tar xvfz /media/cdrecorder/Sources/ch03-gallery/gallery*gz

    ```


    2. In your directory, create .htaccess and config.php files and a directory called
    albums, and set ownership to your user name (for example, use the user name chris)
    and group to apache as follows:


    ```

    $ touch gallery/.htaccess gallery/config.php

    $ mkdir gallery/albums

    $ chown chris:apache gallery/.htaccess gallery/config.php

    $ chown chris:apache gallery/albums

    $ chmod 664 gallery/.htaccess gallery/config.php

    ```'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# 38 Part II — Multimedia Projects


    3. To make sure that the Apache server can access the Gallery files if they are
    installed in your home directory, you can change permissions as follows:


    ```

    $ chmod 711 $HOME

    $ chmod 775 $HOME/public_html

    ```


    4. If you are installing Gallery for the /var/www/html/gallery directory, you
    do not need to configure Apache in any special way to access Gallery. However,
    to have access Gallery from your home directory, you need to modify the /etc/httpd/conf.httpd.conf
    to allow the public_html directory for the selected user to be able publish Web
    content. First, you should comment the UserDir line to appear as follows, so that
    feature is not disabled:


    ```

    # UserDir disable

    ```


    Next, add the following Directory entry to allow content to be published from
    the chosen directory. For example, here is what you would put if Gallery were
    installed in the /home/chris/public_html directory:


    ```

    <Directory /home/chris/public_html/gallery>

    AllowOverride Options FileInfo

    </Directory>

    ```


    At this point you should be ready to start checking and configuring the Gallery
    software if you like just installed.


    ![](img/1b8a24a162893627b8005ac678b79236_62_0.png)


    There is a lot more you can do to configure an Apache Web server, if you like.
    Some more detailed Apache setup is covered in books as Red Hat Fedora and Enterprise
    Linux 4 Bible. Also, Apache itself comes with an extensive online manual that
    is very useful once you understand the bases (http://localhost/manual).


    # Checking and Configuring Gallery


    To check that your basic setup is working properly, you can run the Gallery Configuration
    Wizard. To run the wizard, start your Web server, and open the index.php file
    in your Gallery''s gallery/setup directory. Here''s how to do that:


    +   1. To start your Apache server, follow the type as root user:


    ```

    # /etc/init.d/httpd start

    ```


    +   2. To start the configuration wizard, use any Web browser and open the index.php
    file from your Gallery setup directory. For example, if your setup meets these
    conditions


    +   - Apache was set up to allow users to publish Web content from the public_html
    directory in their home directories.

    - A user named chris installed Gallery to the gallery directory in /home/chris/public_html
    on the localhost.'
