    various temperature measurements that your system provides.


    Play around with a cold blower and dry which temperature is which, (being careful
    not to allow your system to overheat). After that, you will note which like 1,
    2, and 3 are output from sensors -f, and what you would like 1, 2, and 3 to be
    called.


