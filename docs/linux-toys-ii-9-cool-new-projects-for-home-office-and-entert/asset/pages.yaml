  md: '# Chapter 2 — Finding What You Need


    # "Can I Get Linux Pre-Installed on a Computer?"


    Yes. Everything from low-cost home desktop systems to high-end workstation and
    servers are being sold today with Linux preinstalled. The Linux.org site maintains
    a list of vendors who sell computers with Linux preinstalled. You can find that
    list at www.linux.org/vendor/system.


    Companies such as Pogo Linux (www.pogolinux.com) and Penguin Computing (www.penguincomputing.com)
    offers workstations with Fedora or Red Hat Enterprise Linux preinstalled for $1,000
    or $1,800, respectively. With a PC from those companies, you can start right in
    and building Linux Toys II projects.


    If you are looking for a laptop with Fedora certified, check out Linux Certified
    (www.linuxcertified.com). Laptops with Fedora started at under $1,000.


    There are also very end PCs being-marked with Linux preinstalled. A company called
    Linare offers desktop computers starting under $200 with Linux preinstalled and
    laptops for under $500 that are being sold Wal-Mart and Amazon.com. They come
    with a Linare operating system. If you want to take a chance on one of the computers,
    you can install Fedora or RHEL on if the projects don''t work in Linare.


    The trend is towards more and expensive computers becoming available with Linux
    installed. Buying a computer with all hardware components certified to run Linux
    can save you some the problems that put off many first-time Linux users. For example,
    to Linux running on a computer that has Windows preinstalled often requires resizing
    the disk, dealing with winmodems and winprinters (software-driven hardware that
    is tricky to get working-in Linux), and potentially messing up the boot loader
    when you install Linux.


    # "How Do I Pick Hardware for an Entertainment System?"


    There are several qualities to look for in a PC that you plan to put in your entertainment
    system. Some specific issues for choosing an entertainment system PC are included
    in the MyTV PVR project (see Chapter 4). Here are a few of the highlights:


    +   - **Quiet — You don''t want a fan that makes a lot of noise. Spend a few extra
    dollars and get one that is particularly quiet.


    +   - **Elegant case — You don''t want to put a desktop case on your stereo system.**
    The case used for the MyTV project was LC11M from SilverStone Technology (www.silverstonetek.com).
    The dimensions are similar to a common stereo component (424 mm wide by 96 mm
    high by 430 mm depth). Using a Micro ATX motherboard allows the case to be smaller
    than you would need for a standard ATX motherboard, and still have room for the
    video cards, hard disks, and other components you need. Figure 2-2 shows a picture
    of this case.'
