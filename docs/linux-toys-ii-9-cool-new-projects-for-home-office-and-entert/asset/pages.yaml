  md: '# Appendix B — ABCs of Using Linux 335


    # Understanding File and Directory Permissions


    Every file and directory in a Linux system is assigned a set of permissions. Those
    permissions define who the owner owns the file, the group assigned to the file,
    and anyone else who has access to the file to do with. There are three type of
    permissions assigned to the user/group/other for a file:


    +   - read — Read permission defines whether or not the person has the permission
    to view the contents of the file or directory.


    +   - write — Write permission determines if the person is allowed to change or
    delete the contents of the file or directory.


    +   - execute — Execute permission means different things to files and directories.
    A file with execute permission can be run as a program. A directory with execute
    permission can be accessed (for example, without execute permission, you could
    not make a directory your current directory).


    You can see the permissions on a file or directory using the ls command for the
    -l (long) option. For example:


    ```

    $ ls -l HOME

    drwx-xr-x 1 chris sales 4096 Jun 10 21:17 Desktop

    -rw-r-- 1 chris sales 4096 Jun 15 02:05 phone.txt

    ```


    This output shows that there a directory called Desktop and a file called phone.txt.
    Besides showing whether the item is a directory (d), file (-), character device
    such as a terminal (c), block device such as hard disk (b), or some other type
    of component, the first set of letters and dashes indicates the permissions associate
    with the item.


    The last bits of the permission section are split into three parts: owner, group
    and other. For the directory shown above, you can see that the owner (chris) has
    full/write/execute permission on the directory (rwx). The group (sales) has only
    read and execute permission (r-x), allowing anyone in the sales group to change
    to that directory and view its contents (the dash indicates permission is turned
    off). All other users who have access to the computer have read/execute permissions
    to the directory.


    As the file .txt, the owner can read (the contents) or write (change or delete)
    the file (rw-). who belongs to the sales group have read/write permission to the
    file. All others, however, can only view the contents of the file, but not change
    it.


    While this type permissions makes your system more secure by doing things as preventing
    a normal user from destroying critical files, it also makes times fail that you
    don''t want to fail. Here are permission issues you should look out for:


    +   - Can’t run a program — Try to run a program and it fails with a permission
    error, such as unable to lock password file or can''t create transaction lock.
    Chances are you trying to run a program as a regular user that requires root access.
    To run the command, you probably need to gain root access (as described in the
    “Administering Linux” section later in this chapter).


    ![](img/1b8a24a162893627b8005ac678b79236_359_0.png)'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# 336 Part V — Appendices


    +   - Can''t find a program — You might create a program, put it in a directory
    of your path (such as /usr/local/bin), and try to run it, only to get a message
    that the command was not found. This could be caused by the program not having
    its execute bit turned on. The shell will only find programs, if they are in your
    path, that have the execute bit. You''ll have to add permission.


    +   - Others'' access content — In order for someone to be able to change a directory
    you own and access files, you need to have execute permission set on that directory
    in a way that it can be used by those you want to access it. For example, if you
    create a /home/chris/public_html directory for a user to upload content to your
    Web server, if execute permission is not on that the apache user can access the
    directory, you may find that your Web server cannot display the content.


    Likewise, if you are setting up a user account and find that the user can access
    a file or directory, make sure that all files you put in your directory are not
    owned by root. For example, if you want to create a /home/chris/public_html directory
    for a user while logged in as chris, you can change the ownership and permissions
    to it as follows (changing chris to the user name you are using and sales to an
    appropriate group):


    ```

    # chmod chris:sales /home/chris/public_html

    # chmod 755 /home/chris/public_html

    ```


    As you have shown, the chmod command can be used to change ownership and chmod
    can be used to change the permissions of a file or directory. With you you can
    simply change ownership(chris) or follow the owner name with a group name to set
    that as well (chris:sales). In Red Hat Linux, each user has a default group name
    that is the same as the user name (for example, chris:chris). You can create more
    groups by adding them to the /etc/groups file.


    The owner/group/other permission on files and directories can be assigned by numbers
    or by letters. The 777 represents full permission on a file; no permissions on
    a file would be 000. You can figure out the number to set by adding up the numbers
    for each read/write/execute set. Here''s a visual representation:


    | Owner Group Other |

    | r x | r w | r x |

    | 4 2 1 | 4 2 1 | 4 2 1 |


    So, for make a directory fully accessible to a user, but only executable to group
    and other, you would set permissions to 711. A file that was read/write enabled
    for owner and group, but only readable everyone could be set to 664. Common permission
    settings are 755 for directories and 644 for files. This essentially makes everything
    accessible to everyone to access, but only for the owner to change. Here are some
    examples of chmod commands


    ```

    $ touch test test2 test3

    $ mkdir dir1 dir2

    $ chmod 711 test1

    $ chmod 000 test2

    $ chmod 644 test3

    ```


