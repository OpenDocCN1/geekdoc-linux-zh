  md: '# Chapter 11 — Building a Thin Client Server with LTSP 301


    # Interface Selection


    After starting the ltspcfg command, type 2 to select which Ethernet network interface
    from your server connects to the thin clients. Your server might have two (or
    more) network interface cards (NICs) if, for example, it is connected to a LAN
    (that goes to the thin clients) and an Internet connection (such as DSL or ISDN
    hardware). Select the appropriate interface so that an arrow (------) appears
    under the Used column.


    # DHCP Configuration


    After starting the ltspcfg command, type 3 to set your DHCP service (dhcpd). After
    you have responded to the prompts, you will need to edit the /etc/dhcp.conf file
    (as described a bit later). Here are descriptions of those prompts and the results
    on a Fedora or other Red Hat system:


    +   * Enable dhcp daemon — Y to turn on the DHCP service (to start the dhcp daemon
    when the system starts up)

    * Build a dhcpd.conf file — Y to create the configuration file used by the dhcpd
    daemon (if you already have a dhcpd.conf file, the LTSP information is created
    in a different file: /etc/dhcpd.conf.sample.


    > There are lets ways to set up a DHCP server. I recommend that you refer to the
    dhcpd page (man page dhcp), as well as other manuals (dhcrelay, dhcp.leases, and
    dhcp-event) for further information on configuring DHCP.


    ![](img/1b8a24a162893627b8005ac678b79236_325_0.png)


    On a Fedora system, after the preceding steps are done, the dhcp service should
    be to run when the system starts (run level 5) and the dhcpd.conf file should
    be filled with default settings. At this point, you can edit the /etc/dhcpd.conf
    file in another Terminal and tailor it to the needs of your client network. The
    next steps will tell you through that file and how you want to change it.


    In the following lines, dynamic DNS is off (the dhcpd.conf man page for Dynamic
    DNS Updates if you want to learn about this feature) and default and maximum lease
    times are set to 21600 seconds (6 hours). Lease values set the amount of time
    a client can keep an IP before it needs to be renewed.


    ```

    dns-update-style      none;

    default-lease-time   21600;

    max-lease-time       21600;

    ```


    The next lines are how to lay out your network. You will need to edit these lines
    to suit your environment. Refer back to Figure 11-2 to see how we configured our
    sample client configuration.


    For example, we chose to set up a LAN using private IP addresses 10.0.0.100 through
    10.0.0.104 (you can use up to IP address 10.0.0.254 in this arrangement). The
    IP address of the server that has the LAN is 10.0.0.100 (it has an additional
    IP address facing the Internet on another network interface card).'
