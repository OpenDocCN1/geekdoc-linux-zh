  md: '# About the Author


    **Christopher Negus** landed a job in 1984 at AT&T Bell Laboratories in Summit,
    N.J., in the group that developed the UNIX operating system. Because he had used
    UNIX before (and had even written programs in BASIC), he was considered "technical"
    and started out writing about computer network protocols.


    Over the next eight years, Chris helped write (and rewrite) the thousands of pages
    of documentation that accompanied the UNIX operating system. He stayed with the
    same organization, even after AT&T spun it off into UNIX System Laboratories and
    then to Univivel, before the organization was sold (with the UNIX source code)
    to Novell in 1992. (Yes, this is the infamous SCO source code!)


    Over the following decade, Chris wrote or contributed to about a dozen UNIX books.
    In 1999, he made the transition to Linux with a vengeance when he wrote *Red Linux
    Bible*. Since that time, the book has become a computer bestseller and in its
    various editions has sold over 240,000 copies worldwide.


    Between editions of *Red Hat Linux Bible*, Chris wrote *Linux Bible, 2005 Edition*
    and co-wrote *Linux Troubleshooting Bible* with Thomas Weeks. (Tom contributed
    two chapters to this book as well.)


    The original *Linux Toys* and now *Linux Toys II* reflect Chris''s attempts to
    put together open source software into fun and useful projects. The projects in
    this edition reflect Chris''s collaboration with leaders and maintainers from
    a handful of excellent open source initiatives.'
