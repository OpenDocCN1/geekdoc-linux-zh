  md: '# # Chapter 8 — Setting Up a Game Server with BZFlag


    # ### Options for bad flags


    Players don''t have to hang on bad flags forever. Here are some options that allow
    players to get rid of bad flags:


    +   - -sa

    - -st 2

    - -sw


    The -sa option allows antidote flags in the world to get rid of bad flags. The
    -st option sets the number of seconds after which a bad flag is dropped (20 seconds
    here). The -sw option sets the number of wins after which a bad flag is dropped
    (2 wins in this example).


    # Setting Game Boundaries


    As a BZFlag server administrator, you can set what ends a game. Game ending can
    be based on time or score. Here are some examples:


    +   - -time 7200

    - -timemanual


    In the example shown, the game will end 7200 seconds (two hours) after the first
    client connects. By adding -timemanual option, the time will start after the /countdown
    command is issued, instead of the first client connection. Instead of, you can
    have the game based on score. Here are some examples:


    +   - -mps 50

    - -mts 300


    The first option (-mps 50) ends the game after a player scores 50 points. As an
    alternative, you could have the end after a team reaches a certain number of points
    (-mts 300 ends the game after a team reaches 300 points).


    If you want to have a rotating server or if you are doing a timed game, you can
    indicate that the server should quit after one game. You can do this with the
    -g option:


    +   -g


    # Modifying Worlds and Maps


    BZFlag allows you to create your own worlds or include worlds from other servers
    running BZFlag. There are several options you can use to select and customize
    the worlds you use with BZFlag server. With the -b option, you can randomly rotate
    buildings (only during Capture-the-flag games):


    +   -b


    Using the -density option, you can control how dense the buildings are. For random
    worlds, you can set the density to a number between 1 and 10 (with 5 as the default):


    +   -density 7'
