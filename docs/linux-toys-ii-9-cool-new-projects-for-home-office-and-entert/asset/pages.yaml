  md: '# Building a Dedicated SOHO Firewall


    One of the rites of ascension for the modern Linux geek is the task of setting
    up his own home network with dedicated firewall/router. Building your own SOHO
    (Small Office/Home Office) is simple and also a great way to significantly enhance
    the usability and security of your home or office broadband experience.


    At one point, I broke down and bought an off-the-shelf firewall router/gateway
    combo unit, until a friend convinced me to do it myself. That path opened up a
    whole world of local and small business opportunities, not more than to give you
    a great learning experience that came with it.


    Building your own firewall/gateway, router, or any system for matter, does more
    than give you the real security of your own systems. If you take the time to design,
    and build a system around your specific set of service and security requirements,
    you''ll be well away from the guy who went out and bought some shrink-wrapped
    solution off the shelf. The commercial solution promotes security, without the
    understanding of what so-called security is really doing on inside, or what its
    weak points are.


    In the Linux Times, I learned to set up a home file/print server, router box that
    is convenient for running everything under one hood. However, for this chapter
    I''m going to drill down and focus on the SOHO firewall/router functions by showing
    how you will need to design and build your own Linux-based, hard-drive, high-availability
    firewall/router with no moving parts.


    This is the type of router/gateway you need if you''re going to be (or installing)
    a network connection that simply can''t go down because of a hard drive crash
    or failed CPU pan. This is the type of firewall "device" that you can put on an
    Uninterruptible Power Supply, stick in a closet, and forget about. After you get
    one of these dedicated firewalls up and running, you can often achieve an uptime
    (without a reboot) on the order of years instead of just months with a “doing”
    home network server. Because there''s no hard drive to worry about, backups are
    a thing of the past.


    # chapter 9


    # in this chapter


    +   - Choosing a firewall

    - Picking and modifying the hardware

    - Designing your network

    - Booting and configuring your firewall

    - Securing your firewall and poking holes for access

    - Other uses for Devil-Linux'
