  md: '# # Automating Home Lights and Gadgets with X10


    By automating your home using X10 devices and software (provided with this book),
    you can control the lights, garage doors, alarms, sprinklers, or most other appliance
    you can plug in or wire in. That control can come from a handheld remote, centralized
    switches, or (you guessed it) .. Linux.


    While there are lots of ways to turn your lights and appliances off and on with
    X10, managing X10 from your computer adds the ability to automate those activities.
    Using Linux as your operating system and open source software, you have the further
    advantage of being able to tailor those tools to your needs.


    This chapter starts off using two X10 hardware starter packs and two X10 open
    source projects:


    +   **Firecracker and the BottleRocket project** - Using an inexpensive Firecracker
    X10 kit and BottleRocket (mlug.missouri.edu/~tym) you can request simple on/off
    and dimming functions from X10 lights and appliances. Several Web-based and GUI
    controls are available that rely on BottleRocket.


    +   **ActiveHome and the Heyu project** - The Heyu version 2 project (www.heyu.org)
    includes a broad range of X10 features, including the ability to work with X10
    hardware that communicates in two directions and off X10 schedules to an ActiveHome
    device (so schedules continues, even with your computer off). With Heyu, software
    can detect the state of devices and react to X10 events from those devices (such
    as turning on a light when motion is detected).


    To do this, all you need is a PC that has RS232 serial port (or Linux installed)
    and a few dollars more of X10 equipment. You can grow these projects to incorporate
    a large number of X10 devices and create scripts for automating X10 activities.
    For newer PCs supplied with USB ports but no RS232 serial port, both BottleRocket
    and Heyu will work with a USB-to-Serial adapter. (Before purchasing such an adapter,
    make sure it is compatible with your version of Linux.)


    # chapter 7


