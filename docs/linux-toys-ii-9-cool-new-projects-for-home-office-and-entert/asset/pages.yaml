  md: '# 242 Part III — Home Projects


    # Step 2: Prepare and Check the ISO Image


    After you download the image or copy it from the Linux Toys II CD to a directory
    on your hard disk (for example, the $HOME/dev-linux directory), you''ll notice
    that it''s not a normal ISO file, but a compressed tar of 170–200MB in size:


    ```

    $ cd $HOME/dev-linux

    $ ls -lah dev-linux-1.2.5-i486.tar.bz2

    -rw-r--r-- 1 weeks 179M 29 22:48 dev-linux-1.2.5-i486.tar.bz2

    ```


    Before decompressing, you should first verify that it''s good by checking the
    tar/bz file md5sum, or fingerprint, against the Web site it says should be:


    ```

    $ md5sum dev-linux-1.2.5-i486.tar.bz2

    f0902ae728c72be061d6be02ec3e dev-linux-1.2.5-i486.tar.bz2

    ```


    Check that the md5 checksum matches on the page.dev-linux.org/downloads/. If the
    checksum matches, decompress the tar with the following command:


    ```

    $ tar xjf dev-linux-1.2.5-i486.tar.bz2

    ```


    Windows users cannot decompress bz2 files with regular WinZip. To decompress the
    dev-linux*.tar file, Windows will need a utility such as ZipZag from http://zip.com/
    or IzArc from http://izarc.org/. Just realize that this large file will take a
    while to decompress, as it is several hundred megabytes. For doing md5sums on
    Windows, there is no way to do this. You will have to download a md5sum tool,
    such as the md5sum command line tool available from www.pc-tools.com/net/32/md5sum/.
    Or you simply boot the Linux Toys II CD and use the md5sum command from md32.


    After you have downloaded the bz2 file, check into the directory and have a look:


    ```

    $ cd dev-linux-1.2.5-i486/

    $ ls -lah

    total 201M

    drwxr-xr-x 3 weeks 4.0K May 15 12:42

    drwxrxr-wx 3 root 4.0K Aug 20 23:22

    -rw-r--r-- 1 weeks 208M May 15 12:42 bootcd.iso

    -rw-xr--x 1 weeks 3.6M May 15 12:52 custom-cd

    -rw-r--r-- 1 weeks 3.4M May 15 12:52 DL-build-config

    -rw-r--r-- 1 weeks 3.8M May 15 12:52 DL-kernel-config

    drwxr-xr-x 2 weeks 4.0K May 15 12:42 docs

    -rw-r--r-- 1 weeks 788K May 15 12:42 etc.tar.bz2

    -rw-xr--x-- 1 weeks 14K May 15 12:42 install-on-usb

    ```


    You want that 200MB bootcd.iso file, then you''re good to go.


    # Step 3: Burn the ISO to CD


    Descriptions of how to burn ISO CDs to Linux using k3b or cdrecord are contained
    in Chapter 5. However, for many cases in Linux, assuming that you have a CD-R
    or CD-RW drive, you can easily burn an ISO to CD with this command:'
