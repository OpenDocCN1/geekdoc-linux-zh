  md: '# 238 Part III — Home Projects


    # # Choosing Your Firewall


    There are quite a few ways to set up a dedicated firewall. More traditional methods
    consist of installing a full or partial Linux distribution (or distro) to a hard
    drive, adding a firewall scripting tool or GUI (such as FWBilder or Firestarter),
    and then configuring iptables and packet forwarding on that system. An easier
    commercial way is to buy a specialized firewall subscription that installs on
    a hard drive and gives you a nice point-and-click Web interface, and whose updates
    and intrusion signatures are centralized (as Astaro Linux).


    These solutions all work, but if you''re looking for a cheap, rock solid, "install
    and away"type system (no hard drive to crash, or subscriptions to maintain), you
    need to look out one of the CD- or floppy-based firewall distros in this chapter.
    Their big stability feature is that they boot the CD or floppy media, and then
    run out of the system''s RAM. As a result, they require no hard drive, and require
    little in the way of hard resources.


    The really great thing about running these CD-based or "Live" distros is that
    most of them simply boot off the CD or CD store all of your configurations on
    floppy or other media (USB flash drive, even hard). Upgrading to the latest version
    is usually as simple as downloading the latest version of the ISO (a pre-made
    CD-ROM image), and then rebooting your firewall off the new CD. Your system settings
    are read off the configuration floppy or USB thumb drive. That makes for the easiest
    upgrade ever!


    And as an added security, with this type of configuration, the CD-ROM is read-only
    So after you get your configuration set up and saved out, you set the write-protect
    tab of the floppy (open), and if your system ever is compromised, it''s totally
    non-writeable! That is, you just reboot and any traces of an intruder are gone.(Although
    after you get a system locked down and your firewall set up, intrusion into the
    firewall itself is unlikely).


    Here are some of the most popular and feature-rich live/floppy distros to consider:


    +   **Devil-linux (www.devil-linux.org)** — Good all around CD boot firewall distro.
    Weighing at around 200MB on CD, and using a configuration floppy, USB thumb drive,
    CD-ROM, hard drive or CompactFlash card, this seems to be one of the easiest and
    more secure dist. It can handle both two and three network interface card (NIC)
    setups just fine.


    Devil-linux includes all the regular types of gateway/router services — everything
    from lain DHCP and DNS/DNS caching service, to VPN squid proxy, Apache Web Server
    with PHP, NTP (network time), and Anti-Spam Antivirus mail gateway filtering.
    It features a very nice security model, as all binaries are compiled with the
    buffer overflow protecting GCC Stack Smashing Protector and GRSecurity. Devil-linux
    requires a 48/66 processor, 32MB RAM, a bootable ATA/SCSI CD-ROM/USB drive, and
    a 1.44MB floppy or a USB flash drive.'
