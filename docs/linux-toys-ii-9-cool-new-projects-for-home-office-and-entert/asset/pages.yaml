  md: '# 26 Part I — The Basics


    # Choosing Hardware


    An original concept of Linux Toys was to be able to reuse, otherwise useless computer
    hardware to make fun stand-alone projects. While reusing old hardware is still
    a great goal for some of the projects in Linux II (in fact, the LTSP project in
    Chapter 11 is a better project for reusing old PCs than anything in the first
    Linux Toys), some projects go to the other extreme. For example, Chapter 4 on
    the MyTV project describes a personal video recorder that doesn''t skimp on hardware.


    Each project in this book describes any special hardware requirement for the project.
    You can view the information in this section as a bunch of tips and guidelines
    for reusing or purchasing the computer hardware we need to do these projects.
    That information is presented in the form of a Frequently Asked Questions list.


    # “Can I Use Any of These Projects on My Old 486?”


    Yes! The Terminal Server Project (described in Chapter 11) supports client machines
    as old as an Intel 486 processor with a minimum of 32MB of memory (text-only mode).
    That''s because the client computer is running a Linux system that is just enough
    to drive the graphical interface (or shell interface), mouse, and keyboard. The
    rest of the work is done on the server.


    Because of the projects in this book start with an assumption of Fedora Core 4
    as the base operating system, the minimum requirements of that system set the
    supported hardware. That minimum is a Pentium II, with different amounts of RAM
    required, depending on whether you want to use a GUI or just run from the command
    line. (See Appendix C for hardware requirements for installing Fedora Core 4.)


    If you want to try a different Linux system, however, using a 486 on all but the
    most demanding projects (such as the MyTV project in Chapter 4) might be possible.
    I recommend using Slackware, Debian, or Gentoo Linux distributions, and then installing
    the Linux II software later.


    With an old machine, a problem bigger than the processor in successfully running
    Linux could be the RAM and hard disk. If the old computer has only 32MB of RAM,
    you won''t be able to run GNOME or KDE desktops (if at all). You'' in text mode
    or perhaps a minimal window manager. Older computers may not have the disk space
    for a reasonable Linux install. Disks of 500MB were not uncommon just a few years
    ago and the minimal Fedora Core install is about 600MB.


    Bottom line: it''s the LTSP project for very old hardware. For any machine that
    has a CD drive, you can try any of the bootable images included with Linux II
    (including booting the Linux II CD itself). Start with a Pentium II or better
    processor for most of the other projects.'
