  md: '# Installing and Preparing Fedora Core


    You can drop MythTV on top of any of a dozen distributions and then do weeks of
    battling to get it all working. There are even disturbs built around MythTV such
    as knoppMythTV. This chapter takes one of the easier paths to MythTV Nirvana and
    us established procedure based on "Step-by-step guide to building a MythTV System
    on Fedora Core 3 w/atrps, by Jarod C. Wilson, available at

    http://wilseton.com/mythtv/fcmyth.php.


    Jarod''s guide, when it is installed, installs MythTV atop the quick moving and
    well-supported Fedora Core distro, and is an excellent choice for getting a well-rounded
    distro as PVR system. In addition, combined with the apt for RPM system and ATrpms
    repository, installing MythTV becomes almost trivial.


    Apt is a port of Debian''s apt that was adapted to work with RPM-based distributions.
    It gives the utility that provides a simpler, safer way to install and upgrade
    packages. Apt features complete installation ordering, multiple source capability,
    and several other unique features. This, combined with the ATprms repository,
    allows you to install non-Red Hat-based packages (such as MythTV) that are built
    upon the original Red Hat-sourced OS packages.


    # Don''t Stray Far from the Path


    This chapter and the package versions seen are all based on the aforementioned
    hardware set, Fedora Core 3, and MythTV 0.18 running on MySQL 3.23 on the backend.
    At the time of this writing, Fedora Core 4 has just been released, and MythTV
    v0.18.1 is verified to work on these instructions. By the time you read this,
    later versions of Fedora Core may be available. Even so, the basic steps of installing
    both the OS and the MythTV suite atop remain much the same. Try to ensure that
    these directions will be Fedora-compatible, but keep in mind that you may need
    to fill in some blanks with newer distributions. In such cases, you will find
    that Jarod''s guide will help you.


    If you decide to use a different distribution, or a radically different hardware
    set, you can still use this chapter as a guide; however, don''t be surprised if
    you wander off into the dark wood and become devoured by wolves. If you run into
    problems, look for help in the author-Jarod''s guide, and the MythTV mail lists
    at

    http://mythtv.org/mailman/listinfo.


    # Before Installing the Operating System


    You should not install MythTV atop any old system unless you know you''re doing,
    and that you meet all the hardware and software dependencies for MythTV and your
    hardware set.'
