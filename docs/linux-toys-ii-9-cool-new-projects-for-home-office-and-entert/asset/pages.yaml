    # Managing Players


    If you are running a public BZFlag server, managing the players who use that server
    is an

    important task. BZFlag gives you the ability to determine how players are assigned
    and

    authenticated. It also gives you the tools for banning players, if necessary.


    # Managing Player Sign-On


    Using the -autoteam option, players are added to your server based on the teams
    with the\lowest number of players and the lowest scores or kill ratios.


    ```

    -autoteam

    ```


    You can limit the total number of players and the total number of players for
    each team.

    Likewise, you can limit how many players can be on each team. Here are examples:


    +   -mp 50

    -mp 5,5,5,5,5,5,7


    In the first example (-mp 50), the server is limited to a total of 50 players.
    The second example

    sets limits on each team and observers, in the following order: rogue, green,
    blue, purple,

    and observer. So, five players are allowed on each team and seven observers are
    allowed.


    # Communicating with Players


    Players and the server administrator can type messages to each other during a
    BZFlag game.

    Table 8-1 includes some keys you can type to start a message, and Table 8-2 includes
    commands

    you can use while in a message mode. Here are some special ways of communicating

    with users beyond those already described.


    You can have a broadcast message sent to users every 15 minutes, using the -admsg
    option.

    Here''s an example:


    ```

    -admsg "You are on the XYZ BZFlag Server. Be nice, play fair"

    ```


    You can specify a file where users can report problems, using the -reportfile
    option as

    follow:


    ```

    -reportfile myreport.txt

    ```'
