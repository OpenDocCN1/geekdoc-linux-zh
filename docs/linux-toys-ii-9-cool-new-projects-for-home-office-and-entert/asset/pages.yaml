  md: '# Running an Internet Radio Station with Icecast


    # chapter 10

    in this chapter


    O you aspire to be the next AI Franken, Rush Limbaugh, or other political ide
    with a mass market radio audience? Or, do you believe you can create a better
    mix of music than any local DJ? If so, you don''t have to wait for a major radio
    network to discover your talent. You can set up your own Internet radio station
    with Icecast and start streaming your music and talk today.


    With your own Internet radio station you can:


    +   - Broadcast lectures or commentary over sports events


    +   - Promote a rock band, high school, or other performing events


    +   - Play whatever you like 365 days a year, 24 hours day to anyone who will
    listen.


    At the heart of this Internet radio station chapter is the Icecast project. Icecast
    is a powerful and versatile tool for streaming audio across computer networks.
    It can be configured to stream audio in Ogg Vorbis or MP3 format(with other audio
    formats, and even some video formats, available as well).


    To feed to your streaming Icecast server, you can grab audio from a playlist(of
    songs or speech files), your sound card, microphone, or a mixture of those input
    types. Several different source client applications are available to feed that
    content, IceS2, Muse, and Oddcast.


    +   - Understanding Icecast and IceS2 streaming audio


    +   - Configuring your Icecast server and source clients


    +   - Publishing your radio station


    +   - Playing back your radio station


    There are two distinctly different IceS source clients that are maintained by
    two active, different, development efforts. I focus on the IceS2 source client
    that is used for broadcasting audio in Ogg Vorbis format. The IceS0.x source client
    is available, and can be used to broadcast audio in MP3 format to an Icecast server.
    (By the way, Ice5 is short for Icecast Source.)'
