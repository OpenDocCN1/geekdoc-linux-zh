    | General settings | Locations and URLs | Images/video processing | Embedded Galleries
    | Main Gallery page | Optional tools | Languages and borders |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Email and Registration | Gallery slideshow | Watermarking | Statistics | Technical
    | RSS Feeder |


    **3-2:** Customize your Gallery settings.


    With Gallery, as most software packages, it''s not a bad idea to go through all
    the configuration setting to see how Gallery is set up and where there are opportunities
    to tweak it. Each tab contains a different set of options. Some configuration
    settings are required (they appear with a red asterisk).


    The following is a combination of required settings and options I recommend you
    consider changing to the way you want to use Gallery.


    # General Settings Tab


    You will almost surely want to change your own title, password, and initial skin
    (which provides the look and feel of your gallery). Here are descriptions of those
    fields.


    +   - **Gallery Title** — Choose a name to appear on your gallery.

    - **Admin Password** — Enter a password for the administrator (admin) user account.

    - **Skins** — Choose the skin for your gallery. (See the "Changing Gallery Attributes"
    section for details on setting the look and feel of your gallery:)

    - **Default upload method** — A form-based upload will be the default type of
    upload that Gallery users use to upload images to your gallery. Other choices
    include Mini-App, Full-App, or URL.


    # Locations and URLs Tab


    You need to tell Gallery where your albums, temporary directory, and gallery itself
    are located on hard disk. You must also identify the Web addresses (URLs) of your
    gallery. From the Locations and URLs tab, you can make the following changes:'
