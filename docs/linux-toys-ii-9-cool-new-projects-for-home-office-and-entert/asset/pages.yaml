  md: '# Chapter 7 — Automating Home Lights and Gadgets with X10 207


    For details on Heyu configuration, the following man pages contain excellent coverage
    of Heyu features: heyu, x10config, x10sched, and x10scripts. (Simply type man
    followed by one of those man names to view its contents).


    If you have questions about Heyu that aren''t answered in any of the man pages,
    you can refer to the Heyu Users Forum (http://groups.yahoo.com/group/heyu_users/).


    # Troubleshooting X10


    If you are having trouble X10 working properly, there are some troubleshooting
    tips that might help you out.


    +   - Noise on power lines — Power supplies on some electronic devices include
    conditioning circuits that are designed to clean up noise on power lines. These
    devices (including computers, stereo systems, surge protectors, and other devices)
    will actually absorb X10 transmissions. Other electronic devices can block X10
    transmissions by putting noise on the power lines (such as electronic computers,
    fluorescent lights, and electric chargers).


    Smarthome.com has noted many customer questions about X10 sets worked fine for
    a long time, but suddenly stopped. They noted that the usual problem is that some
    new piece of electronic equipment was added to the home. In particular, they noted
    that certain televisions (Sony, Philips, Magnavis, Emerson), computers (usually
    off-brand clones), phone and notebook computer chargers, satellite receivers,
    fax machines, surge power strips, and UPS systems for computers, can suck X10
    signals.


    If you think X10 signals are suffering from noise on your power lines, there are
    devices you can purchase to clean up the noise. An example of this kind of device
    is the FilterC Plug-in Noise Filter (www.smarthome.com/1626.html).


    +   - Not working on all phases — Most homes use a dual-phase electrical system.
    A transceiver connected to one 110-volt phase of a house may have to communicate
    with devices on the other phase. Because 220-volt devices (such as stoves or dryers)
    are connected to both 110-volt phases in the house, the trick is to get X10 signals
    to pass through those interfaces. Sometimes, the stove or dryer will need a device
    that can pass through. A more permanent solution can be to get X10 signals from
    a 220-volt outlet. An example of such a device is the SignalLink Plug-in Coupler-Repeater
    (www.smarthome.com/4828.html).


    +   - Transceiver not working — The firecracker serial dong may not have a lot
    of reach. Try moving the transceiver unit to your computer and see if that helps.


    +   - Device stops responding — If a particular device stops responding to requests,
    it''s possible that it may have blown a fuse. The fuse is often just a thin wire
    (as described here at www.pigselectronics.com/tektips/tip15.html). If you are
    handy with electronics, you might be able to replace this simple fuse yourself
    (possibly violating the warranty, of course, as the Web site notes).'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# 208 Part III — Home Projects


    +   - X10 devices turn on themselves or encryption protection. In other words,
    anyone passing by with X10 transmitter might be able to turn on your sprinklers,
    open your garage door, or dim your lights. Other apartments in your building or
    homes connected to the same transformers at the power company might be able to
    turn on your devices. And it''s not unheard of modules to be turned on or off
    by noise or spikes on the AC power line. That''s something to consider when you
    are deciding what appliances you feel comfortable connecting to your X10 devices.


    In most cases, you can simply change the house code on your X10 devices. While
    A is the most common house code used, if you are in an area where a lot of people
    may be using X10, you should consider using a later code (such as L, M, or N).
    In most cases, that should solve the problem (if someone isn''t actively trying
    to get at your X10 devices).


    # Summary


    Although X10 is a fairly simple protocol, it can be a fun and effective way to
    turn on and off lights and appliances, as well as respond to conditions detected
    by X10 devices (such as motion detectors). Using open source software, such as
    BottleRocket and Heyu, not only can you control your X10 devices from Linux, you
    can also automate when those devices are turned on, turned off, or dimmed.'
  merge: -1
