- img_proc: true
  md: '# Chapter 11 — Building a Thin Client Server with LTSP 305


    4. Adjust the XDMCP settings, if necessary. For example, you might change the
    maximum number of remote sessions (if you need more or less than the default 16
    remote sessions).


    5. You may need to restart your graphical login for the XDMCP changes to take
    effect. There may be a better way to do this, but in Fedora, I usually close all
    windows except a Terminal window and type init 3 as root user. Then, after X is
    shut, I type init 5 to restart the graphical login.


    ![](img/1b8a24a162893627b8005ac678b79236_329_0.png)


    XDMCP service is offered through port 177. Because this service is not secure,
    you should block access to that port from any network interfaces on your server
    that has the Internet.


    When you have the Login Setup window open, you can do several things to adjust
    how the login screen will behave on your workstations. Here are some things you
    should consider changing:


    +   **Remote greeter —** The Remote greeter is set to “Standard greeter,” which
    means the login screen will have a plain, single-color background. You can change
    it to “Graphical greeter,” which will cause remote workstations to see the same
    Fedora Core or Red Hat Linux login screen that they see from the server console.


    +   **Remote welcome string —** By default, the Remote welcome string is set to
    %n where %n is replaced by the name of your server. You can change that to anything
    you want to appear on the login screen each remote workstation.


    +   **Backgrounds and themes —** On both the Standard and Graphical greeter tabs
    (depending which one you are using), you can change the look and feel of the login
    screen. Instead of a plain background, you can choose a different color or an
    image. You can add a different logo (other than those used by Red Hat) or change
    the whole theme of the graphical greeter.


    You can also enable or disable features for security and accessibility on the
    Login Setup window.


    At this point, you can go back to lets and run command 7 (to configure the XDMCP
    display manager to allow the user at each workstation to login to the server).
    Type y to enable XDMCP. Next, you are given the option to have a text-based login
    on the server, and not use the graphical login (while retaining its on the workstations).


    # Host/Address Setup (/etc/hosts)


    Because you are creating only one server and a few workstations in this configuration,
    /etc/hosts file is an acceptable way to map host names to addresses. For the server
    and each workstation, I’m going to add its name and associated IP address. The
    alternative is to configure the computers in a DNS server or remember and use
    only IP addresses.'
