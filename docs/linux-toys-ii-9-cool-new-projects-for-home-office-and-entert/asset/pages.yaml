  md: '# 118 Part II — Multimedia Projects


    # Problems with DVD Menus


    The default media player for MythTV (MPlayer) does not support DVD menus. After
    searching various forums, and finally landing back on Jarod''s page, I found that
    MPlayer could not support DVD menus, mine does. To fix this problem, go into the
    mythfrontend setup, down into the DVD settings, and change the player line


    ```

    mplayer dvd://-dvd device @ -fs -zoom -vo

    ```


    to this:

    xine -pfhq --no-splash dvd://


    That will not only give you DVD menus, but allow you to control every aspect of
    DVD player, plus an amazing set of frame advance, zoom, and smooth motion controls
    ... all of which work in the DVD menus yourself you can''t do with a store-bought
    DVD player!


    # Problems with Removable CD/DVDs


    KDE is nice, but it can be annoying too. Sometimes you''ll pop a CD in KDE will
    see that it has content and mount, it not the MythTV app to eject it. Once again,
    Jarod''s guide to the rescue. Logged into KDE as the mythtv user, just need KDE''s
    autorun feature for the desktop media, like this:


    ```

    $ rm -kde/Autostart/Autorun.desktop

    ```


    And all your problems go away.


    # Email Notification of Problems


    Like any other Linux system, when a RAID device fails, or there are file system
    or hardware errors, your MythTV will try to email the administrator of the server.
    With any Linux system, email for all parts of the system goes to the root user.
    You can set the local root user''s email to be addressed elsewhere, either on
    or off the box, by editing the /etc/aliases file and changing the root user''s
    email address like this:


    ```

    # vim /etc/aliases

    ```


    ```

    # Person who should get root''s mail

    root: tweeks@example.com

    ```


    Then recreate the aliases db (the binary file that''s built from the file that
    you just edited) as follows:


    ```

    # newaliases

    ```


    Now when there''s a system RAID problem (such as a failed device), you start running
    out of space, or the system has some other problem, you''ll get an email about
    it. I wonder if Microsoft Media Center does that!'
