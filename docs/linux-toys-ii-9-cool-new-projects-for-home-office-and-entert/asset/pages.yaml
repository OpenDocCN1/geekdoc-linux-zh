  md: '# Chapter 8 — Setting Up A Game Server with BFlag215


    You can extract the packages used to write this chapter from the Linux Toys II
    CD. From an installed Fedora Core system, insert the Linux Toys II CD. The CD
    should mount automatically. If it doesn''t, open a Terminal, become root user
    (type su -) and type the following:


    ```

    # mount /media/cd*

    ```


    With the mounted CD, type the following:

    # /media/cd*/RPMS/ch08-game/installme


    If you would like to get a later copy of BFlag, the package is part of the Fedora
    repository. You can install the bflag package over the Internet (as root user)
    by simply typing yum bflag from a shell. Or you update the existing package by
    typing yum bflag.


    If you are installing the BFlag server on another Linux system, you can use the
    tarball for BFlag that is included in the SOURCE directory of the Linux Toys II
    CD. Precompiled packages for other Linux systems are also available. The BFlag
    download page (http://sourceforge.net/project/showfiles.php?group_id=3248) or
    the unofficial BFlag Wiki page provide further information (http://BFlag.org/wiki/Download).


    # Step 3: Configuring the Server Computer


    Before you start the BFlag server process (which actually handles the interactions
    between the BFlag players), you need to configure the server computer to make
    it available and secure the network. To start with that, I''ll describe how to
    set up your server on a private LAN, to play among your family or on your LAN.


    Let''s assume that the server computer, there are computers on your LAN that you
    want to allow to play BFlag. If possible, assign a static IP address (which doesn''t
    potentially change at reboot) to the server. Identify a port number from which
    the service is offered and make service available to the computers on your LAN.


    +   1. Get an IP address. If you are on a private LAN, you can choose your own
    IP addresses from a set of IP addresses. If you already have set addresses you
    are using, choose one for the server and assign it to each time the network interface
    is brought up. (For an Internet server, you can get a static IP address assigned
    from your ISP or your local system administrator).

    2. Assign the static IP address. From a desktop on Fedora Core, select the Desktop
    button in the panel, and then choose Settings -> Network interface (preferably
    eth0) to see the Ethernet Device window. From that window, select Statically Set
    IP Address). For the example on my private LAN, I used the IP address 10.0.0.101
    and subnet mask 255.255.255.0. Other computers on the LAN can be assigned static
    IP addresses of 10.0.0.102 through 10.0.0.106.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# 216 Part III — Home Projects


    3. Assign a name. The client really just needs a way to get the IP address. If
    there is a public, Internet server, you can purchase and register your DNS name.
    If you don''t know how to do, you can speak to your ISP or of a gazillion domain-name
    registers on the Internet today. I am talking about a LAN, in this example, you
    can add the server''s host name and address to the /etc/hosts file of each Linux
    client that wants to play the game. For example, if you wanted to call the server
    flag, you could add this entry to computer''s /etc/hosts file:


    ```

    10.0.0.1 flag

    ```


    After that, the Linux client could address the server by the name.


    4. Open a firewall. The BZFlag server (bzfs) listens for BZFlag game requests
    on a particular port. The registered IANA port number, and default port number
    used by the server, for BZFlag is 5154 (client for that port number used by default).
    So you need to allow access to that port if your server has an active firewall
    (which it should).


    Linux uses iptables for firewall. The way that iptables is configured in Fedora,
    you can open access to ports from the Security Level Configuration Window (select
    Settings -> Security Level and Firewalls). 5154:tcp, 5154:udp. Or you could simply
    set your entire LAN as a trusted device (if you do trust).


    You can change the default port to any port you like (avoiding popular port numbers
    such as listed in /etc/services file). However, the client will have to specify
    that number specifically when it connects to it. The default port should be 5154,
    but you can type the command bzfs -help | grep p to make sure it hasn''t been
    changed on your server.


    ![](img/1b8a24a162893627b8005ac678b79236_240_0.png)


    With your server running on LAN, you can proceed to configuring the BZFlag server
    on that computer.


    # Step 4: Configuring the BZFlag Server


    While you can start the BZFlag server by simply running the bzfs server with lots
    of options after tailing, it''s more convenient to add them to a configuration
    file that is fed to the server: BZFlag project leaves open the choice of file
    to use to put your configuration information in (although bzfs.conf is used in
    some examples). For my example, I''ll put the options in the /etc/bzfs.conf file.


    The same download sites noted earlier for getting software to install the BZFlag
    server client for various platforms. Software from the SourceForge BZFlag project
    offers (http://sourceforge.net/projects/bzflag) includes versions for Windows,
    Mac OS X, Linux, PowerPC, and several different Linux systems (including Fedora/Red
    Hat, Mandrake, and Slackware).


    ![](img/1b8a24a162893627b8005ac678b79236_240_1.png)'
  merge: -1
