  md: '# 228 Part III — Home Projects


    # Configuring Flags


    As a BZFlag server administrator, you can control what flags are in your BZFlag
    world, what flags are excluded, and how many of a selected flag you want to have.
    Flags can be in the BZFlag world all the time, or can be generated at random.


    You identify with the one- or two-character codes listed in Table 8-3. Use the
    +f option with a code to guarantee that a particular flag is in the world. Use
    the -f option to guarantee a particular flag isn''t in the world. Here are some
    examples:


    ```

    +f JP

    +f BU

    +f CL

    +f CL

    -f CL

    -f T

    -f N

    ```


    In the previous example, at least one jumping flag (JP) and one burrowing flag
    (BU) are assured to be in the world. At least three cloaking flags (CL) are assured
    of being there. There will be no tiny flags (T) or narrow flags (N).


    You can turn off all flags by adding a -f bad. You can add multiple team color
    flags (there''s only one by default in Capture-the-flag) by adding more +f options
    (for example, +f R to add a red flag).


    Flags normally appear on the ground. To allow them to appear on top of buildings
    as well, you could add the following option:


    ```

    -fb

    ```


    Use the +s and -s options to indicate an extra number of super flags are available
    at all times and up to a certain number of super flags are available at any time,
    for example:


    ```

    +s 10

    -s 15

    ```


    The preceding lines indicate that there will be at least 10 super flags available
    at all times and could have up to 15 player available at any time.


    When the last player on a team leaves the game, their team flag is reset after
    30 seconds. You can change the reset time using the -fttimeout option. For example,
    for a 45-second timeout, add:


    ```

    -fttimeout 45

    ```


    # Options for good flags


    You can limit how many shots someone can take with a good flag before dropping
    it. For example, the following options allow a tank with an invisible bullet (IB)
    flag to fire 15 times or a rapid fire (F) flag to fire 30 times before losing
    the flag:


    ```

    -sl IB 15

    -sl F 30

    ```'
