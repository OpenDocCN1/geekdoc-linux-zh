  md: '# Chapter 9 — Building a Dedicated SOHO Firewall 241


    # Step 1: Get the ISO


    You can use either version of Devil-Linux that is on the Linux Toys II CD or download
    a copy of Devil-Linux yourself. The following sections describe those two approaches.


    # Using Devil-Linux from the Linux Toys II CD


    The Linux Toys II CD contains the Devil-Linux 1.2.5 ISO image. It is contained
    in the isos/ch09-firewall directory under the following name:


    ```

    devil-linux-1.2.5-i486.tar.bz2

    ```


    Because this chapter was tested against version, using it gives the best chance
    of matching the descriptions in the chapter. So, if you like, you can simply copy
    this file to your hard disk. For example, from a running Linux system (such as
    Fedora Core), you can insert the Linux Toys II CD and type the following:


    ```

    $ mkdir $HOME/firewall

    $ cp /dev/cd*/ch09-firewall/devil-linux* $HOME/devil-linux/

    ```


    With Devil-linux copied to a directory on your hard disk, you can perform Step
    2.


    # Getting Devil-Linux from the internet


    You can get a more version of Devil-Linux by downloading the Devil-Linux ISO on
    the Internet (such as SourceForge.net). Getting a later version of Devil-Linux
    gives you a better chance of having the latest features and fixes, which will
    probably mean some differences from descriptions in this chapter.


    To download the ISO, go to www.devil-linux.org or for the SourceForge project
    site at http://sourceforge.net/project/files.php?group_id=34096. There are several
    packages (the latest is always best), and all processor architecture types available:
    486, 586-SMP, and 686-SMP.


    SMP means Symmetric Multiprocessor, and for multi-processor systems, the kernel
    and code work on single-processor systems, too. There is also a Server version,
    which has the GRSecurity feature disabled. This is not intended for you to use
    as a firewall, as it is missing a security feature. The Devil-Linux project provides
    this version because GRSecurity can interfere with some server applications.


    > If you don''t have a Pentium or better processor, you will have to use the 486-based
    ISO, which of minimally requires a 486. If you have at least a Pentium I or AMD6,
    the 586 version will work on higher processors as well. The Intel P-Pro, III-,
    Celeron-, and AMD Athlon/Duron-based systems are all 686-class processors, making
    them appropriate for a 686 version of Devil-Linux.


    I recommend downloading the latest architecture that your system can run, and
    downloading from one of SourceForge'' well-maintained network of mirror sites.
    Place the Devil-Linux download file into a directory on your hard disk that has
    at least 400MB of disk space available (for example, you could place it in a $HOME/devil-linux/directory).


    ![](img/1b8a24a162893627b8005ac678b79236_265_0.png)'
