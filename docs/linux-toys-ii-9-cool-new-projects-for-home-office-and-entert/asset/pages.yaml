  md: '# 322 Part V — Appendixes


    The purpose of this appendix is to describe the software included with Linux Toys
    II is organized on the CD, tell you how to install software for the projects contained
    in each chapter, and tell you how to get later versions of that software as it
    becomes available.


    # Using the Toys II CD


    The Toys II CD contains a small, bootable Linux system and the software packages
    you need to create the projects described in this book. It can be used in one
    of two ways:


    +   **Install software from the CD**— With Linux running, you can insert the CD
    into your drive and install the software for each chapter to your Linux system
    (using the RPMs or tarballs).


    +   **Boot the CD directly**— You can insert the CD into your computer''s CD drive
    and reboot the computer, to boot directly to a version of Linux called Damn Small
    Linux. With Damn Small Linux, you can do the project described in Chapter 6 for
    configuring a pen drive. You can also run client software for some of the other
    projects described in this book.


    To view the contents of the Linux Toys II CD, insert the CD into your computer''s
    CD drive while the computer is running. In Fedora or RHEL, you will see an icon
    representing the CD on your desktop. Double-click the icon to display the contents
    of the CD in a folder window. Here''s what you should see:


    +   **RPM/**— The RPM directory contains separate directories for each chapter
    in the book that requires software. Each chapter directory contains the RPM files
    that are needed with that chapter and an installime that can be run to install
    all the RPMs in directory. Each RPM package ends in a .rpm suffix.


    +   **Sources/**— The Sources directory includes a directory for each chapter
    that contains the tarballs/gz format that are available. Each tarball ends in
    .tar.gz or .tgz suffixes. In most cases, you can use the tarballs to compile the
    software from source code. In other cases, such as the Gallery project (Chapter
    3), the software is in a format it does not need to be compiled.(In the case of
    Gallery, the software consists of perl scripts and HTML.)You can also find some
    ISO images (for example, the eMovIX ISO image for Chapter 5) that can be simply
    burned to CD or other removable media.


    +   **SRPMS/**— The SRPMS directory includes separate directories for each chapter
    that contain the source code needed to modify and rebuild RPM files. Each source
    RPM ends in a .src.rpm suffix.


    +   **isos/**— The isos directory contains ISO images used for several of the
    projects. For the eMovIX project I include the eMovIX bootable media player. ISO
    images are also included for the LTSP and Devil-Linux projects.'
  merge: -1
