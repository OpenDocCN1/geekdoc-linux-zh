  md: '# 348 Part V — Appendices


    Linux stores information about hard partitions and removable media that it expects
    to consistently monitor in a particular location in the /etc/fstab file. Typically,
    the hard partitions will be mounted automatically when you boot Linux. Removable
    media will be mounted when the media is inserted or connected.


    Different Linux systems have different ways of dealing with automounting of removable
    media. However, the Linux Standards Base seeks to standardize many aspects of
    Linux systems, is moving away from mounting removable media in the /mnt directory
    and toward mounting media in the /media directory. (Damn Small Linux uses /mnt
    to mount removable media.)


    Beginning with Fedora Core 3, Red Hat has done a lot to improve the handling of
    removable storage media (CD, DVD, and floppy drives, as well a USB storage media
    such as pen drives). There are also many good tools for managing storage media
    (as hard disks).


    The Hardware Abstraction layer (hald) is configured in many Linux systems (including
    Fedora Core) to detect when removable media are inserted or connected. It tries
    to mount media in subdirectories of the /media directory. If you are running the
    GNOME desktop, those items show up as desktop icons. Double-click on the icon
    to open the CD, DVD, USB, or other media.


    You should know the names used to identify your media devices. Hard drives are
    identified by the letters hd, so the first hard drive on your system will be accessible
    through the /dev/hda device, the second would be /dev/hdb, and so on. Primary
    partitions on each device are numbered 1 to 4 (hda1, hda2, and so on), with the
    first partition starting at h3. SCSI drives are named similarly, starting with
    /dev/sda, /dev/sdb, and so on. The first partition on the first SCSI drive is
    /dev/sda1, then /dev/sda2, and so on.


    Both IDE and SCSI devices represent removable media as well as hard disks. For
    example, the computer I am using right now CD/DVD burner is located at /dev/hdb
    and my digital camera (when I connect to a USB port) shows up as /dev/sda1.


    Why do you care about all this? Because there may come a time when you want to
    mount and mount file systems. At some point, you will probably want to add a hard
    disk, define partitions, and create file systems on it. (For more on these topics,
    I recommend Hat Fedora and Enterprise Linux 4.) For now, here are a few examples
    of working with your storage media:


    +   # mount /dev/hdb/media/cdrecorder


    Assuming your CD/DVD burner is the second IDE drive (/dev/hdb), the mount command
    will just make the contents of the CD or DVD in that drive available from the
    /media/cdrecorder directory. To unmount the drive, you can run the following command:


    +   # umount /media/cdrecorder


    At this point, you can eject the media (type eject /media/cdrecorder or just press
    the button on the drive). If the unmount fails, there is something still accessing
    the drive. Quit any applications that have files open on the drive and change
    directories (cd $HOME) from any shell for which the current directory is on the
    removable medium.'
