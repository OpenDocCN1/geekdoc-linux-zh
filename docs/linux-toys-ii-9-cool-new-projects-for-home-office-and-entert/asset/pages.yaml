  md: '# 4 Part I — The Basics


    +   - The spirit of open source sharing is the pieces of software so that that
    together everyone can benefit. Examples of this spirit include the ease with which
    you can share virtual worlds in the BZFlag tank game or download selected games,
    office applications, or network tools to use the Damn Small Linux pen.

    - Reuse an old PC — While the latest Windows operating system won''t run on eight-year-old
    PC sitting in your closet, many of the PCs in this book will. If you can get an
    Ethernet card for it, even your old 486 machine can probably be used for the Linux
    Terminal Project.

    - Most PCs that can boot from a CD will run the bootable Linux Toys II projects
    on emOIX and the Linux-fire CD. At the very least, you should be able to boot
    the Linux Toys II to try out Damn Small Linux (which includes a graphical interface
    with streamlined applications).

    - Play with computer hardware — Some of the projects are purely software-oriented
    (so they can run on most PCs), a few have the chance to put together and play
    with the hardware as well. Follow the instructions in the MyTV project to build
    a video recorder with a wireless keyboard, a remote control, and a slick case
    that will fit in any entertainment center. Create a firewall for Dev-Linux that
    includes the switch for attaching the computers in your home or small office Linux.
    Add X10 modules wherever you want to interact with lights and appliances using
    BottleRocket or Heyu software.


    To make sure your projects are accurate and backed up by experts, most chapters
    have been reviewed by the creator or project lead for the featured software. Many
    of the projects follow open source initiatives that have active, on-going development
    efforts and vibrant community forums and listings. Those will fail if you get
    stuck or want to continue grow with the Linux Toys II projects you build.


    # Learning About Linux


    The projects in Linux Toys II reflect the growing phenomenon of open source software
    and the Linux operating system. For the computer enthusiast or professional, Linux
    is now in so many places (PCs, enterprise computers, handheld and wireless devices,
    and so on) you can hardly ignore it. And if you''re going to need it anyway, why
    not learn about it while you build some toys?


    > If this is your first exposure to Linux, see the “How Can Software Be Free?”
    section in this chapter. It describes how the licensing for open source software
    works.


    # Using Specialized Linux Systems


    Freedom to use the software you choose in the way that you want has always been
    at the heart of Linux and the open source software movement. Because you can take
    apart all the


    ![](img/1b8a24a162893627b8005ac678b79236_28_0.png)'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 1 — Introduction to Linux II


    component parts of Linux and put them back again as you like, you can end up with
    Linux systems that include everything you might ever want or only the exact components
    you need.


    Here are some ways in Linux II projects you can use specialized versions of Linux:


    +   - Multimedia player—The EMoWiX and MobiXi projects include a specialized Linux
    system, geared toward playing multimedia content. Not only does the resulting
    Linux system have to be installed on a hard disk, but it is small enough to run
    from RAM. So you can remove the CD containing Linux and insert a CD containing
    video, music, or digital images.


    +   - Efficient desktop system—Damn Small Linux (DSL) fits on a bootable basically
    (50MB), which contains elements to do Web browsing, email, word processing, and
    other desktop activities. (The project based on DSL describes how to install it
    to a rewritable pen drive.)


    +   - Thin client—While the other Linux systems described typically boot from
    CD or other medium, the Linux Terminal Server Project (LTSP) helps you get the
    Linux system that runs on a client server from the network. LTSP can be configured
    to boot from a DHCP server via a network card (using PXE or Ethernet) on a cheap
    PC or stripped-down workstation.


    Each of the projects described can help you learn about the most basic issues
    related to booting a Linux system. Once you get familiar with these concepts,
    you will probably want to begin customizing your own Linux systems to do what
    you want.


    # Working with Servers


    Several of the Linux II projects describe how to set up and offer particular kinds
    of servers from your computer to the Internet. Sharing servers is not something
    that should be done alone (I''ll give you about a billion warnings before the
    book is done). However, learning how to set up servers from the services of your
    home or office LAN (provided you''ve built a sturdy firewall, which I also recommend)
    is a great thing.


    Here are some of the server projects you can try out in Linux II:


    +   - Sharing photos—Web servers can do more than just HTML pages. The Gallery
    project includes a full-featured Web-based interface for controlling and sharing
    albums of digital images. In this project, you can use features for setting up
    a Web server, man-aging, and organizing digital content.


