  md: '# Chapter 8 — Setting Up a Server with BZFlag 213


    # Setting Up a BZFlag Server


    The BZFlag project includes both client (the firing tanks) and server (that connect
    together lots of players shooting tanks) software runs on a variety of platforms.
    These platforms include UNIX derivatives (Irix, Linux, FreeBSD, Mac OS X) and
    Microsoft Windows.


    The example in this chapter illustrates how to configure a BZFlag server to run
    in Fedora Core Linux. The Linux Toys II CD contains an RPM of the BZFlag software
    that you can install and configure. To begin with, I''ll assume you are configuring
    BZFlag to be played on a LAN, among people in the same home, office, or school.
    Extending the BZFlag server to share the service on the Internet is fairly simple
    from a technical standpoint but has implications I will go into.


    # Step 1: Choosing Server Hardware


    Almost any computer is capable of running Linux can be configured as a BZFlag
    server. In fact, BZFlag maintainer Tim Riker says they have run a BZFlag server
    on a Sharp Zaurus and a Links WRT54AG router! Because we are using Fedora Core
    Linux in our example, check the hardware requirements for Fedora and how it is
    described in Appendix C. Aside from basic Linux requirements, there are a few
    issues you should consider about your hardware.


    # Networking Hardware


    The computer must have networking hardware. Contributors to the BZFlag project
    suggest that the amount of network bandwidth you need to serve BZFlag should start
    at 5Kbps for each player. However, as more players are added, the connection is
    not linear. So you need more than twice the bandwidth if you twice the number
    of players. Therefore, the BZFlag team recommends against using a dial-up 56Kbps
    modem, which would be limited to a 3 or 4 Kbps transfer rate, to connect your
    server to the network.


    The server will send more data than it receives, as data from each client must
    be sent separately from the server to each of the other clients. The key to choosing
    a good setup is lots of good bandwidth (particularly upstream). Here are some
    tips from the BZFlag project that relate to the type of connection you may have:


    +   **Digital Subscriber Line**(Check your DSL connection offers better upstream
    and downstream speeds. Often, the DSL provider will allow much higher downstream
    speeds, so if you have the downstream speed (which they usually do) that number
    won''t reflect how many players you can serve. With a 256 Kbps upstream connection,
    you should be able to serve up to eight players. You computer typically needs
    an Ethernet card to use this type of connection.

    **Cable modem**(Your cable modem connection will always have lower upstream bandwidth
    than downstream because these types of connections are generally intended for
    home use. A cable modem connection limited to a 128 Kbps upstream connection will
    support up to five players. As with, your computer needs an Ethernet card to connect
    to a cable modem.'
