    +   - **Hardware compatibility lists** — Fedora Core, which I recommend for the
    projects in this book, does not offer an official hardware compatibility list.
    However, you can find information about known problems with hardware when you
    install Fedora Core in the release notes (fedora.redhat.com/docs/release-notes).
    Red Hat Enterprise, however, maintains a list of hardware that is certified to
    work with RHEL (http://bugzilla.redhat.com/hwcert). Searching the Red Hat database
