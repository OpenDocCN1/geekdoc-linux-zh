    apt. Particularly if you are using one of the Linux Toys projects that can be
    used as an internet server (such as Gallery or Icecast), you want to be sure that
    you have all the latest enhancements.


    Red Hat, Inc., uses Fedora Core as a test bed for features that go into Red Hat
    Linux products. Although they make no guarantees that Fedora Core will work (or
    that anyone else will if it doesnt), Red Hat relies on testing and community support
    that goes on Fedora to ensure the quality of their Enterprise products. I have
