    # Accessing Your Hard Disks


    You don''t need to access your hard disks to run DSL or other KNOPIX-based LiveCD
    technology. You can simply run from your computer''s RAM and removable media (CD,
    DVD, or pen drive). However, if you want to get stuff off your hard disk to use
    with DSL, it''s pretty easy to do so.


    # Mount a disk partition


    A tool on the panel on the right side of your DSL screen (see the box marked floppy
    6-3) lets you step through available storage partitions on your computer and mount
    those that can be mounted. Click the right or left arrow to display partition
    names as floppy, cddrom, sda (probably your pen drive), hda (probably the first
    partition on your IDE hard drive), and so. To mount a device, simply click the
    icon to the left of those others (it turns green when it''s mounted).


    If you are interested in an old-school, manual way to work with your disk partitions,
    refer to "Understanding Partitions in Small Linux" sidebar.


    ![](img/1b8a24a162893627b8005ac678b79236_191_0.png)


    Fedora uses the Logical Volume Management (LVM) file system type for the root
    file system / by default. Small Linux cannot get around this problem during Fedora
    Core installation by assigning your partitions as ext3 instead of LVM. Fedora
    is already installed with LVM, however, you will have to boot Fedora from hard
    disk to get the files you want. With booted, you can copy files directly to the
    pen drive or to another medium (such as CD) to get the files to DSL later.


    Go ahead and mount any other partitions you want to get from during the DSL configuration
    process. Here are a few tips about working with these partitions:


    +   **NTFS file systems can be mounted read-only in DSL. While read/write support
    is available for NTFS partitions from Linux, it is not considered stable and is
    not included with DSL. So, you can get from NTFS partitions, but not to write
    to them.


    +   **Supported Linux partitions can be read or write from DSL. However, to protect
    you from yourself, DSL requires that you have root permission to write to a hard
    disk partition (for example, sudo cp file /mnt/hda3). Also, standard Linux permits,
    so a file that is read-only cannot be copied without root permission.'
