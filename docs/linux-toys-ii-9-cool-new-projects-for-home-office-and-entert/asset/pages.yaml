  md: "# Chapter 4 — Creating a Personal Video Recorder with MythTV 77\n\nAlthough\
    \ ReiserFS is considered superior to the ext3 file system, on any Red Hat-based\
    \ system, if you ever find yourself in an emergency boot/recovery situation, the\
    \ Red Hat environment (including the boot CD rescue) is more ext3. With ext3,\
    \ you will have a better chance of getting your data back. Additionally, if an\
    \ ext3 file system is ever corrupted beyond the point of being able to mount,\
    \ ext3 allows for the fallback mount options of ext2 r/w or ext2 modes to assist\
    \ you in recovering your operating system data. This is why we still use ext3\
    \ on /boot / partitions.\n\n# Network/Firewall Settings\n\nFor these install settings,\
    \ set is the following:\n\n+   * DHCP (if on a DHCP network, but use static IP\
    \ if possible)\n* Firewall (allow SSH, HTTP, and HTTPS)\n* SELinux = warn\n\n\
    # Installing Packages\n\nAccording to the recommendations in Jarod's guide, along\
    \ with a few of my own additions, install the following package groups and subpackages:\n\
    \n+   * Window System\n* KDE Desktop Environment\n* Web Server (if you want to\
    \ use MythWeb Web frontend interface for MythTV)\n* MySQL Database (be sure mysql-server\
    \ is selected under the “Details” page)\n\nOther packages that you might want\
    \ to consider installing include:\n\n+   * Xfce-desktop (in case the KDE is so\
