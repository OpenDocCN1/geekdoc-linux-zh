    # Step 4: Creating and Uploading Schedule Files


    A Heyu schedule file provides a way to preset X10 activities in a file that can
    be uploaded to the EEPROM memory in the CM11A device. With the schedule file,
    you don''t need to keep your computer on all to continue your X10 activities.


    You can start by making a copy of the schedule file that comes with the Heyu package
    (x10.schedule.sample) and editing it. For example:


    ```

    $ cd $HOME/etc/heyu/x10.schedule.sample

    # cp /etc/heyu/x10.schedule.sample x10.schedule

    # vi x10.schedule

    ```


    The statements in a Heyu file are of three kinds: macros, triggers, and timers:


    +   - **macro**: These statements define sequences of X10 to be transmitted over
    the power line.

    - **trigger**: These statements specify a particular macro to be executed upon
    receipt of a specific X10 On or Off signal over the power line.

    - **timer**: These statements specify particular macros to be executed and the
    times when they are to be executed.


    The following are examples of these statements:


    ```

    macro patio_on 0 on A1; dimb A3 6

    macro 0_patio_off off 0 minutes; off A2; off A3

    timer socalled 05/01-11/30 dusk:30 22:00 patio_on on patio_off

    trig B1 on patio_on

    trig B1 off patio_off

    ```


    The two macro statements define named patio_on and patio_off with the signals
    to be transmitted to turn on/off A1, A2, and A3 after a delay of 0 minutes. (Note
    that ALIAS will be used instead of A1, A2, and A3 if those devices are defined
    in the configuration file.)


    The timer statement sets the CM11A unit to execute the patio_off every day of
    the week (smtwtfs) except from May 1 through Nov 30 at 30 minutes after dusk (30
    minutes after sunset). That statement says to execute the patio_off macro at 10:00
    p.m. (22:00) on same dates. (Clock times are always programmed as local clock
    time. Heyu automatically adjusts for Standard and Daylight Savings Time as required.)


    The trigger statements are for manual execution of the macros using a remote controller
    to send an On or Off signal to address B1. You can have timer statements without
    trigger statements and vice-versa.'
