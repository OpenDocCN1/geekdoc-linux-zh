    > Note Gallery has many contributors to list here: http://gallery.sourceforge.net/wiki.php?page=Development%20Team
    for a more list of contributors.


    Gallery software is available for free. If you like the software, however, I encourage
    you to support the project in any one of ways. On the Gallery home page (gallery.sourceforge.net),
    you can click the Gallery button to give a donation to keep the project going.
    Or, select the Support Link to find out how you can pay the Gallery team or install
    your Gallery software.


    To get more information about Gallery or become involved with the Gallery community,
    select the Wiki Link from the Gallery home page. From there, you can find out
    about Gallery mailing lists, tutorials, documentation, development, and other
    ways of getting to know more about Gallery: The Gallery Development Team page
    earlier also tells how to join the team.


    Linux Toys II and describes the well-tested Gallery 1.5. As of this writing, Gallery
    2.0 is in development. By the time you read this, Gallery 2.0 will probably be
    available.


    Gallery 2.0 features a complete rewrite of the Gallery interface, but includes
    all the features described in this chapter. You can check the Gallery Web site
    for information on upgrading from Gallery 1.5 to 2.0 or simply choose to download
    the later 2.0 version and use that instead of the software included with this.


    # Installing Linux


    To run Gallery in Linux, you need to have at least Apache Web server software
    and PHP scripting software installed on the Linux system on your server. There
    is also a variety of optional tools you will need for tasks such as photo manipulation
    (such as NetPBM or ImageMagick).


    I tested this using Fedora Core 4, as described in Appendix C, with the packages-mentioned
    added. The only software package needed (aside from the Gallery toolbar described
    in the next section) that doesn''t come in Fedora Core 4 is the jhead package.
    The jhead utility is needed if you want to work with EXIF header information in
    your images. You can install that package from the Linux Toys II as follows:'
