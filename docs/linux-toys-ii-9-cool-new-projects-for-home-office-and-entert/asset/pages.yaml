    # Getting Network and Administrative Tools


    So far, the applications I''ve described that you can add to DSL are desktop oriented.
    There are a variety of other tools you can download and install on DSL from the
    DSL Extension Panel. Here are some examples:


    +   **Net** — For accessing resources on the Internet or other networks are available
    by selecting the Net button. Applications you might consider including Thunderbird
    Email client (mozilla-thunderbird), Samba file and print services for Windows
    (samba), and Bittorent peer-to-peer download client (torrent-cli). You can also
    find a selection of Web browsers, ICQ clients, news readers, and other Web applications.


    +   **System** — For administering and tuning your DSL system are available from
    the System button. Tools include iptables (iptables), dpkg to enable apt to get
    Debian applications for DSL, and GRUB bootloader (grub). If you have an NVIDIA
    video card, consider adding the NVIDIAIA driver (especially if you plan to play
    video or do gaming or other-intensive applications).


    # Step 7: Changing Your DSL Desktop Features


    While the DSL desktop is very attractive, it''s likely that you''ll want to change
    the look and feel of the desktop to suit your tastes and match how you use the
    computer. There are some ways you can change your DSL desktop and save those changes
    when you reboot.


    +   **Change themes.** DSL comes with several themes already installed. From the
    DSL Extension Panel, you can click the Themes to download other themes that will
    work with the fluxbox window manager (which is the default with DSL). To change
    your current theme, right-click the desktop and from the menu select Desktop →
    Styles, and then choose the theme you want. Figure 6-6 shows the Liquidglass theme.'
