  md: '# Introduction


    # The Linux Toys II CD


    The CD that comes with this book contains the software you need to complete the
    Linux II projects. Each chapter describes packages from the CD you need for the
    project. Most of the Linux Toys II software is in RPM format (which is the format
    used to install software in Fedora Core and Red Hat Enterprise Linux).


    Although binaries of Linux Toys II software were built and tested to run on Fedora
    Core, the source code is included on the Linux Toys II CD as well. If you are
    predisposed to so, it should be possible to build most projects on other Linux
    distributions. (See Appendix A for descriptions of the software included on the
    Linux Toys II CD).


    # The Linux Toys (and Linux Toys II) Web sites


    There are two separate Web sites associated with Linux Toys II:


    +   - Linux Toys at Wiley (www.wiley.com/go/negus)—Wiley Publishing, Inc., the
    publisher of Linux Toys and Linux Toys II, maintains a Web page that pertains
    to issues surrounding the purchase and features of the book.


    +   - Linux Toys Web Site (www.linuxtoys.net)—Come to the LinuxToys.net site for
    further information about the Linux Toys II projects.


    # On with the Show


    I hope that you are excited to try out these projects as I am to bring them to
    you. If you are a Linux expert, feel free to jump into the project of your choice.
    If you are new to Linux, be sure to go through the introductory materials and
    step through the appendixes to get a feel for how to use Linux. Okay, let''s go!'
