  md: '# Chapter 11 — Building a Thin Client Server with LTSP 307


    # Workstation Configuration Setup (lts.conf)


    The lts.conf file located in the /opt/ltsp/i386/etc directory on the server contains
    important information needed by each workstation. After starting the ltspcfg command,
    typing 10 creates an lts.conf file you can begin with.

    The Default entry in the lts.conf file looks like following:


    ```

    ```

    SERVER            = 10.0.0.100

    XSERVER           = auto

    MOUSE_PROTOCOL   = /PS/2*

    MOUSE_DEVICE      = /dev/psaux

    MOUSE_RESOLUTION  = 400

    MOUSE_BUTTONS     = 3

    USE_XFS          = N

    SERVER_01        = startx

    ```

    ```


    Make sure that the SERVER line represents the IP address of your LTS server. The
    XSERVER line tells each client to auto-detect the type of card it has, so the
    client can start up the right driver for the X display. By a PS/2, three-button
    mouse (/dev/psaux device) is configured. By default, each client gets the fonts
    it needs from the NFS shared directory (USE_XFS = n), so no additional font is
    used. The Windows System is started on the first screen by launching the startx
    command.


    > The lts.conf file has a format that is similar to old Windows .INI files. The
    [Default] section can be used for all the workstations, while specific workstations,
    [station001] for example, can override settings from the [Default] section. Besides
    using names, you can also use IP addresses or MAC addresses in the brackets.


    In many cases, X.org will work fine for the workstations to start up. If you need
    additional tuning, you can add a separate entry for any workstation that needs
    it. For:


    ```

    ```

    [station001]

    XSERVER = XF86_SVGA

    RUNLEVEL = 3

    n```

    ```


    In this case, X.org will detect the card of the workstation (station001) so the
    XF86_SVGA driver (from the XFree8 project) is used instead. I also choose to start
    this in run level 3 (instead of 5), so it will boot to a text-based prompt.


    > There are many parameters that you can enter into the lts.conf file. For details
    on these parameters, I recommend you to refer to "Chapter 9 - lts.conf Entries,"
    from the LTSP manual (www.ltsp.org/documentation). Also, in this chapter, I describe
    how to add an entry to open a local shell on a workstation.


    # Step 4: Startup Services on the Server


    Although you should have configured the services needed by your workstations to
    boot up, they may not all be started yet. To check that those services are running,
    run the ltspcfg'
