    screen, type a user name (something like parker or alban). Next, type your full
    name (like John W. Parker or Alan Bourne). Then type your password in the Password
    text box and in the Confirm Password text box. Click Next.


    If some of network authentication is used, such as LDAP, Kerberos, or SMB authentication,
    you can click the Network Login button. The "Enabling Authentication" sidebar
    for information on choosing different authentication.


    +   - Sound card — Select to play a test sound. If you can hear the sound at all,
    click Yes when prompted. You may need to turn up the volume to hear it.

    - Install additional software — If you have a Fedora CD other than the Fedora
    installation CDs or DVD, you can install it. Insert the CD you want to install
    and click the appropriate button.'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# 370 Part V — Appendices


    # Enabling Authentication


    In most situations, you will enable shadow passwords and MD5 passwords (as selected
    by default) to authenticate users who log in to your computer from local passwd
    and shadow password files. To change that behavior, you can select the Network
    Login button during the User Account setup in Fedora Setup Agent (firstboot).


    The shadow file prevents access to encrypted passwords. MD5 is an algorithm used
    to encrypt passwords in Linux and other UNIX systems. It replaces an algorithm
    called crypt, was used with early UNIX systems. When you enable MD5 passwords,
    your users can have longer passwords that are harder to break than those encrypted
    with crypt.


    If you are on a network that supports one of several different forms of network-wide
    authentication, you may choose one of the following features:


    +   - Configure NIS—Select this button and type the DNS Domain name and NIS server
    location if your network is configured to use the Network Information System (NIS).
    Instead of selecting an NIS, you can click the check box to broadcast to the server
    on your network.


    +   - Configure LDAP—If your organization gathers information about users, you
    can click this button to search for authentication information in an LDAP server.
    You can enter the LDAP server name and optionally an LDAP distinguished name to
    look up the user information your system needs.


    +   - Configure Hesiod—If your organization uses Hesiod for holding user and group
    information in DNS, you can add the LHS (domain prefix) and RHS (Hesiod default
    domain) to use for doing Hesiod queries.


    +   - Configure Kerberos Support—Click this button to enable network authentication
    through Kerberos. After enabling Kerberos, you can add information about a Kerberos
    Realm (a group of Kerberos servers and clients), KDC (a computer that issues Kerberos
    tickets), and Admin server (a server running the Kerberos kadmind daemon).


    +   - Configure SMB—Click this tab to configure your computer to use Samba for
    file and print sharing with Windows systems. If you enable SMB authentication,
    you can enter the name of the server for your LAN and identify the Group your
    computer belongs to.


    The Fedora Setup Agent is complete. Click Next to continue.


    When Fedora starts up next time, it will boot normally to a login prompt. A graphical
    boot screen is displayed (instead of a scrolling list of services starting up).
    If you miss the old scrolling list, you can view it by clicking the Details button
    or by pressing Ctrl+Alt+F1. Then go back by pressing Ctrl+Alt+F8.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '# Appendix C — Installing Linux 371


    > **Caution** If you have multiple operating systems on your computer (such as
    Windows and Fedora), and after a Fedora install you find that the other operating
    system is no longer available on your boot screen, don''t panic and don''t immediately
    reinstall. You can usually recover from the booting the Fedora install disk in
    rescue mode (type linux rescue) and using the grub-install command to reinsert
    the proper MBR. If you are uncomfortable working in emergency mode, seek out an
    expert to help you.


    # Going Forward After Installation


    If your Fedora Core system installed successfully, you are ready to start using
    it. Before you head off to install Linux Today software, however, there are a
    few things I strongly recommend you do:


    +   **Updates** — As bugs and security vulnerabilities are discovered in Fedora
    and RHEL, updates to your software packages are made available. The Red Hat Network
    icon in the panel will alert you if updates are available (with a blinking red
    exclamation point). If you have an Internet connection, select that to run up2date,
    or (as root user) run update to get available updates downloaded and installed
    on your computer.

    **Check your security** — Any computer connected to a public network, such as
    the Internet, needs to be secured. In particular, if you are offering services
    to the Internet, you can see with the Gallery (see Chapter 3) or Icecast (see
    Chapter 10) projects in this book, you need to make sure that your computer is
    properly secured and monitored. Security features that you should learn about
    include user accounts, file/directory permissions, iptables firewalls, and SELLinux.
    You can learn about these features in books such as Red Hat Fedora and Enterprise
    Linux 4 or by reading HOWTOs from the Linux Documentation project (http://tldp.org).\**Learn
    the desktop and the shell** — Refer to Appendix B for some basics on using the
    desktop and the shell to work with Fedora. Many of the topics covered there apply
    to other Linux systems as well.'
