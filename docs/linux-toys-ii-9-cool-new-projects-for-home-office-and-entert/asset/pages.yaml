    # Getting Linux Toys Software


    After you have Fedora or any other Linux system installed, you just have to add
    the software that is specific to each Linux II project you want to build. All
    of the software needed to create the Linux II projects are on the CD that comes
    with this book (or is easily downloaded) in the following forms:


    +   - RPMs Prebuilt binaries for each of the Linux II projects are included on
    the CD in the form of RPM Package Management (RPM) files. These RPMs were created
    specifically to run on Fedora Core or Red Enterprise Linux systems. However, it
    might be possible to use them on other systems that support RPM packages or by
    extracting the software from these packages and installing them on other Linux
    systems.


    RPM packages can be installed and managed using the rpm command. You can also
    use software tools such as yum or apt to install and maintain software packages
    over the network.


    +   - Tarballs A tarball is a single file that contains a set of files. The names
    come from the tar command, which is used to make the tarballs. Tar stands for
    archive because when was created back in the UNIX days, magnetic tape was the
    primary medium for archiving software. The tar command has many, many options
    for creating, listing, appending, and extracting tar files. For the projects in
    this book, you are most interested in extracting files from a tarball directory,
    and then compiling and installing the software to use on a Linux system.


    If you are using a Linux distribution other than Fedora or RHEL, the tarballs
    included with this CD is the best way to get them. Tarballs are the most common
    way to distribute the source code for open source projects for several reasons.
    For one, you can put all the files in an entire project into one (making it easy
    to pass around). For another, every Linux and UNIX system includes the tar command,
    so you can be sure that you can extract all the files you need to your system.


    Usually the tar file will be compressed, offset by the open source gzip. Instead
    of ending in .tar, the archive file ends in .tar.gz Because tar includes an option
    to uncompress gzipped archives, you can extract the project to your system in
    one step. After, you usually need a C compiler to compile and install the software
    on your Linux system. Some projects these days, don''t need'
