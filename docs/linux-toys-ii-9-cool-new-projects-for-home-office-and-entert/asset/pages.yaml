  md: '# Using the Linux Toys II CD


    The software needed to create the Linux Toys II projects described this book requires
    from various open source projects, covered by the GPL or similar licenses. Most
    of the software you need is included on the CD that comes with Linux Toys II.
    The form that most of the software includes:


    +   - RPM binary packages— These are prebuilt binary packages that you can install
    on a Fedora or Red Hat Enterprise Linux system. In other words, just install the
    RPMs and start stepping through instructions in the chapter.

    - Source code tarballs— These are compilations that include the source code for
    all necessary files for each chapter. In most cases, you must complete these files
    to run on whatever Linux system you are using. Because of differences among Linux
    distributions, there is no guarantee that descriptions in this book will work
    exactly as written when you install from source code on a Linux distribution other
    than the ones we recommend.

    - Source code RPMs— These include the source code associated with the binaries
    each RPM. You can use the RPMs to rebuild.

    - ISO images— Some of the Linux Toys II projects can be booted or installed from
    ISO images included in the isos/ directory for the Linux Toys II CD. An ISO image
    is a single file that typically includes a set of software, organized in a file
    system, that can be burned to a CD, DVD, or other removable medium. Often that
    the image can be booted directly or used as a medium for installing software permanently
    in Linux.


    Many of the projects require that you install a Linux operating system before
    you begin. I recommend Fedora Core or Red Hat Enterprise Linux because the prebuilt
    RPMs included with this book should just run on those systems without modification.
    However, most Linux systems should work fine, provided you can adapt to differences
    among Linux systems (such as different locations of configuration files and ways
    of starting services).


    # appendix


    ![](img/1b8a24a162893627b8005ac678b79236_345_0.png)


    # in this appendix


    +   - Using the Linux Toys II CD


    +   - Finding updated software for each chapter'
  merge: -1
