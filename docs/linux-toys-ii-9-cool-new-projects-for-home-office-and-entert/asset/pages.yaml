  md: '# ABCs of Using Linux


    While I try to make the Linux Toy II projects as foolproof as possible, there''s
    going to be a time when file permissions are wrong, a piece of hardware is not
    detected properly, or a server just doesn''t work. For those times, you''re going
    to have break out of our step-by-step procedures and get around in Linux yourself.


    Because I recognize that everyone Linux Toy II is not a Linux expert, I have devoted
    this appendix to giving you some basics using Linux. These basics are not purely
    introductory-level Linux commands and concepts. Instead they will help you, troubleshoot,
    and enhance your Linux Toys projects.


    If you are new to Linux, stepping through this appendix is a good place to start.
    Beyond this appendix, I recommend that you get a more complete, general Linux
    book that will cover commands, administration, services, and other features in
    more depth. Red Hat Linux Bible (the latest edition is titled Red Fedora and Enterprise
    Linux 4 Bible) is a good place to start if you are using any Red Hat Linux system.
    Linux Bible, 2005 Edition covers a broader range of Linux distributions and will
    help you select one working with it.


    If you don''t have a Linux system installed on a computer, you can try the shell
    commands described in this chapter by booting the CD that comes with this book
    to Damn Small (DSL). Because DSL contains a reduced set of Linux features, you
    will have to do a permanent install of Fedora Core (or other Linux) to use some
    of the graphical administrative tools described here.


    # appendix


    # in this appendix


    +   - Using the shell


    +   - Using the desktop


    +   - Administering Linux


    # Using the Shell


    The Linux shell is the most basic way of working with a Linux system. While not
    every Linux system offers a graphical interface, they all offer a shell interface.
    Once you learn to run commands, get around the file system, and deal with administrative
    tasks from the shell, you have skills that are useful for any Linux and UNIX system
    that you encounter.'
  merge: -1
  pgno: 353
- img_proc: true
  md: 'You may see a shell when you login (if you don''t boot to a graphical interface).
    If not, to get to a shell you can open a Terminal window from a graphical interface
    by clicking the right mouse button and selecting Terminal Window or Xterm from
    menu (or Damn Small Linux). The following two examples show what your command
    line prompt might look like:


    ```

    [chris@mycomputer ~$]

    ```


    or


    ```

    [root@mycomputer ~#]

    ```


    A dollar ($) at the end of a command line prompt indicates that you are logged
    in as a regular user (also often referred to as the super user). The command line
    prompt is configurable. However, the information contained in these examples is
    typical for many Linux systems. Your user name and computer are separated by an
    @ character (chris@mycomputer). That''s followed by the name of the current directory.
    ~ indicates your home directory (which is /home/chris in the first case). Otherwise,
    you will see the name of the current directory (in the second example, the current
    directory is tmp).


    A install of a typical Linux system can offer more than 3000 commands and nearly
    1000 administrative commands. But don''t worry. For the most part, you can get
    started with a couple dozen commands.


    # Tips for Using Commands


    Before I start showing some commands, here are a few tips to help you understand
    how to use Linux commands:


    +   man pages — If you want to find out more about a command (or for that matter,
    a configuration file, programming function, system call, device name, or most
    other Linux components), you should reading man (short for manual) pages. Man
    pages were used to document the first UNIX systems and continue to be the way
    that command line and programming components are documented today.

    The downside of man pages is that you need to know what you are looking for and
    they don''t typically lead you through a whole task. So they are best used as
    a way of learning or remembering particular options for a command. For example,
    if you just want to know what option to use with df command to view how much disk
    space you have available, you can type:

    man df


    Man pages aren''t included with Damn Small Linux. However, if you have a connection
    to the Internet, running man in Damn Small Linux will get the man page you request
    from the Internet.


    ![](img/1b8a24a162893627b8005ac678b79236_354_0.png)'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Appendix B — ABCs of Using Linux 331


    **Finding commands** — Sometimes you will type a command and get an error message
    as:


    ```

    bash: whatever: command not found

    ```


    Two reasons why this may happen are that the software was not installed, or the
    command is not in your path. To solve the first problem, you have to install the
    software-package containing the command. (Appendix A explains how to install Linux-software.)
    The second problem requires a bit more explanation.


    When you type a command, the shell looks for that command in a set of predefined
    directories called your path. You can see what directories are in your path by:


    ```

    $echo $PATH

    /usr/local/bin:/bin:/usr/bin:/usr/X11R/bin:/home/chris/bin

    ```


    This is an example of a PATH for a regular user (in this case). If you were to
    simply type the date command, the shell would first look in the /usr/local/bin
    then the /bin directory (where it would find the date command and run it). In
    other words, the shell will go from left to right checking each directory in your
    path until the command is found.


    On occasion, a software package will put a command in a non-standard location.
    If a command is not in your path (or if it appears in more than one directory),
    you can type the full path to the command, for example, /bin/date. Or you can
    add a directory to your path. For example, add the directory /opt/bin to your
    path, and add this to .bashrc=/opt/bin:$PATH


    ```

    export PATH=$opt/bin:$PATH

    ```


    Many administrative commands are not in the path of a regular user, since they
    are intended for the root user. If you run echo $PATH as the root user, you will
    see /sbin and /usr/sbin directories in the root user''s path, in addition to those
    in the regular user''s path. (Unlike in other Linux systems, in Damn Small Linux,
    you will see all administrative directories in your PATH, but only able to use
    administrative commands as root or by running sudo.)


    Besides commands that sit in directories on your computer, there are also built-in
    commands (such as cd, pwd, and echo), aliases, and functions. These will override
    any commands in your path directories. For example, the rm command is often aliased
    as rm -i, to be prompted to confirm each file before removing it.


    Here are a few ways to find out the commands that are available:


    +   * alias

    * man builtins

    * type mount


    The alias command shows any aliases that are set. The man builtins shows a list
    and descriptions of shell builtin commands. The type command shows the location
    of any command you give it as an argument (in this case, it will show the mount
    command is in /bin/mount).'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# 332 Part V — Appendices


    **Use command completion** — Using command completion can save you a bunch of
    typing. By typing part of a command and pressing the Tab key, bash will try to
    complete the rest of the command from the commands it finds in your path, aliases
    and shell built. If there is potentially more than one command that could be used
    to complete what you have typed, press Tab and the shell displays all possible
    values. For example:


    ```

    $ us<Tab>

    usbview usermount      users      star

    userinfo  userpasswd      sleep

    $ $

    ```


    The output shows that there are seven commands in the user''s path that begin
    with the us. At this point, you could type a few more letters and hit Tab, or
    simply type the command you want. Completion is also available for directories
    (/var/sp> to complete the /var/sp directory), user names (ro<-Tab to complete
    the root user''s home directory), and environment variables ($PA<-Tab to complete
    the $PA variable.


    **Recalling commands** — The bash keeps a history of the commands you have run
    with it. You can recall those commands in several different ways. This can be
    very handy, especially if you want to run a long command again. After you recall
    a command, you can edit it and run it again. Here''s an example of the history
    command for displaying your history:


    ```

    $ history 5

    968 cd /usr/sbin

    969 ls | wc

    970 man mount

    971 pwd

    972 tail -f /var/log/messages

    ```


    The following history command determines how many of the recent commands you want
    to see (here, you see the five most recent). Simply typing history displays your
    entire history list.


    There are different ways you can run a previous command. Using an exclamation
    (!), to refer to command lines from your history by number or position in the
    list. Here are a few examples:


    ```

    $ !968

    $ !-5

    $ !!

    ```


    The first example (!968) runs the 968th command line in your history list. The
    next example (!-5) runs the command line you ran five commands ago. The last (!!)
    runs the previous command you ran.


    Step through your command history using the up and down arrows, and left and right
    arrows to move any of the command line you want to change. After making your edits
    to the command, press Enter to run the modified command.'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Appendix B — ABCs of Using Linux 333


    # Moving among Files and Directories


    The file system is represented by a hierarchy of directories and files, each level
    of which is separated by a slash (/). The root of the file system (not to be mistaken
    for the root user) is simply a /.


    Major directories below the root are /etc (which contains configuration files),
    /home (which contains user directories), /bin and /sbin (which contains commands),
    /dev (which contains device files for accessing hardware), and /var (which hold
    changeable data). The home directory for the root user is /. Temporary files can
    be put in the /tmp directory. There are other directories at the root level, but
    we will start with these.


    As you begin Linux you will use your home directory (for example, if your username
    is chris, your home directory would be /home/chris) to store most of your user
    data. Most configuration files you need to change in the /etc directory. To set
    up a public server, you would put data in /var/www (Web server), /var/ftp (FTP
    server), /var/mail (mail server), or /var/named (Domain name server), to name
    a name few.


    To familiarize yourself with the Linux system, you should try running some file
    system commands. Here are some common commands for moving around the file system
    and working with directories:


    ```

    $ $HOME

    home/chris

    ```


    The echo command can be used to display an environment variable or just a string
    of characters. In this case, by echoing the value of $HOME, you can show the current
    user''s directory is /home/chris. The home directory of a regular user is typically
    in the /home directory under the user''s name. The /root directory is typically
    the root user''s home. To change to a directory, you can use the cd command. Here
    are examples:


    ```

    $ cd

    cd /tmp

    cd /usr/share/doc

    cd /var/log

    cd public_html

    cd ..

    ..

    ```


    The cd command with no options takes you to your home directory. An option beginning
    with a slash (/) indicates that it is the full path to the directory you want
    (/tmp, /usr/share/, /var/log). With no beginning slash, the option is assumed
    to be a relative path (so you were in /home/chris, the command cd public_html
    would move you to /home/chris/public_html). A dash (--) option takes you to the
    previous directory and two dots (...) takes you to the directory above the current
    directory.


    Type this to see your current directory:


    ```

    $ pwd

    ```'
  merge: -1
