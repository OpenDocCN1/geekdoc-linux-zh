  md: '# Chapter 6 — Customizing a Live Linux Pen Drive 163


    # USB-ZIP or USB-HDD Install


    To create a DSL install that can be booted from your pen drive as USB-ZIP or USB-HDD,
    one of the following:


    +   **USB-ZIP** — Right-click the desktop and select Apps → Tools → Install to
    USB Pendrive → For USB-ZIP Pendrive. This install will run in a pen drive with
    a small boot partition and a second partition that contains all its remaining
    disk space. Most computers will be able to boot the resulting pen drive.


    +   **USB-HDD** — Right-click the desktop and select Apps → Tools → Install to
    USB Pendrive → For USB-HDD Pendrive. A DSL USB Pendrive Installation screen appears.
    All data is placed on one partition on the pen drive for this install. Only recent
    model PCs can be counted on to boot USB-HDD formatted pen drives.


    With either USB-ZIP or USB-HDD, prompted select **y** to drive. The Following
    are the questions you are asked in the course of reformatting your pen drive and
    installing DSL for these two installs:


    +   **Installation or upgrade?** — If this is a new install (type i), your entire
    pen drive will be erased. For an upgrade (type u), new DSL files will overwrite
    the old ones.


    +   **Target device** — Enter the device name representing the pen drive (such
    as *sda*, as you determined early).


    +   **DSL location** — Identify the location of your DSL ISO file. You can simply
    use the one included in the *Linux* Toy or DSL CD (the letter I), a file from
    your hard disk or other device (type f), or from the Web (type w). For this example,
    I chose the letter L (lowercase L), although you might be able to get a later
    version by choosing w.


    +   **Boot options** — You can change boot options every time run your DSL drive
    boots. If you know it will always run on a minimal display, you might add vga=normal.
    If you know it will always run on a computer with lots of RAM, add the toram option
    (see the booting DSL section for further information on running from RAM). Other
    boot options can let you automatically start services for remote login (ssh),
    file sharing (nfs), system logging (syslog), (lpd), Web service (monkey), and
    file transfer (ftp).


    +   **Language** — If you are using a language/keyboard other than English, you
    can type a code for it here (cs, da, de, es, fr, nl, it, pu, ru, and sk are supported).
    Or press Enter to continue in English with a U.S. keyboard.


    This is your last chance to quit the DSL pen drive install. After the next step,
    DSL begins reformatting your pen drive.


