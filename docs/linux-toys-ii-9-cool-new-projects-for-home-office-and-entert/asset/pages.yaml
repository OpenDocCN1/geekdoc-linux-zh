    # Expanding on LTSP


    Following the instructions so far in this chapter, you should have a fairly efficient
    set of workstations running off your server. Once you log in, your session from
    each workstation should look exactly as if you were logging into the monitor that
    is directly connected to the server itself.


    Because you directly log into the server, after the workstations are up and running,
    there is no need for special configuration between the clients and server. Standard
    Linux user permissions will allow you to share files, printers, an Internet connection,
    and any hardware configured on the server, without special server settings.


    To wrap up this chapter, I''ve added some ways to extend your LTSP project. They
    include the following:


    +   - Drawing from each workstation — You are actually running a separate, Linux
    operating system on each workstation (which, for the most part, should be invisible
    to you). section "Playing with Location Features" suggests opportunities for drawing
    further on your workstations'' processors and hardware. You can have more applications
    than just the X server running locally on your workstation and you can take advantage
    of printers and other hardware connected.


    +   - Locking down workstations as kiosks — A common use of them is to lock them
    as controlled, special-use stations for a specific application. One such application
    is to run each workstation as a Web browser kiosk, allowing only a browser window
    to run at each workstation, serving up a limited set of content. The section "Using
    Workstations in Schools and Public Places" describes some efforts to use LTSP
    workstations as public kiosks.'
