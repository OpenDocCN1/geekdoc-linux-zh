  md: '# Appendix C — Installing Linux 365


    The swap partition is often set to twice the size of the amount of RAM on your
    computer (for example, for 256MB RAM you could use 512MB of swap). Linux uses
    swap when active processes have filled your system''s RAM. At that point, an inactive
    process is moved to swap space. You get a performance hit when the inactive process
    is moved to swap and another when that process restarts (moves back to RAM). For
    example, you notice a delay on a busy system when you reopen a Window that has
    been minimized for a long time.


    The reason to have enough swap space is when RAM and swap fill up, no processes
    can start until something completes. Bottom line: Add RAM to get better; add swap
    if processes are failing to start. Red Hat suggests a minimum of 32MB (text mode
    only) and a maximum of 2GB of swap space.


    ![](img/1b8a24a162893627b8005ac678b79236_389_0.png)


    Fedora uses Logical Volume Manager (LVM) software to set up your partitions by
    default. While this feature is useful if you think you want to expand a partition
    by adding more space from another disk, or there are cases where you may not want
    to use LVM partitions. For example, you will not be able to access your LVM partitions
    from Damn Linux (as described in Chapter 6) because DSL can''t read LVM partitions.
    For that reason, it might be better to assign your linux file systems to ext3
    type.


    Click the Next (and OK to accept any changes) to continue.


    +   11. Configure boot loader. All bootable partitions and default boot loader
    orders are displayed. By default, the install process will use the GRUB boot loader,
    install the boot loader in the master boot record of the computer, and choose
    Fedora Core as your operating system to boot.


    ![](img/1b8a24a162893627b8005ac678b79236_389_1.png)


    With the GRUB boot loader, you have the option to add a GRUB password. The password
    protects your system from having potentially dangerous options sent to the kernel
    by someone without password. This password can be different from the root password
    you are asked to enter.


    The names for each bootable partition will appear on the boot loader screen when
    the system starts. Change a partition name by clicking it and selecting Editing.
    To change the location of the boot loader, click "Configure advanced boot loader
    options" and continue to the next step. If you do not to install a boot loader
    (because you don''t want to change the current boot loader), click "Change boot
    loader" and select "Do not install a boot loader." (If the defaults are ok, skip
    the step.)


    +   12. Configure advanced boot loader. Where to store the boot loader, select
    one of the following:

    * Master Boot Record (MBR) — This is the preferred place for GRUB. It causes GRUB
    to control the boot process for all operating systems installed on the hard disk.

    * First Sector of Boot Partition — If another boot loader is being used on your
    computer, you can have GRUB installed on your Linux partition (first sector).
    This lets you have the other boot loader refer to your GRUB loader to boot Fedora
    Core.'
