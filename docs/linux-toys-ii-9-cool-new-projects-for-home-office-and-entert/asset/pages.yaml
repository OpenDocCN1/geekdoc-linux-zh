  md: '# How Can This Software Be Free?


    In recent years, the term "free software" has generally been replaced by the term
    "open source software" in hopes of clarifying what the movement is all about.
    Just as "freedom" in society doesn''t mean you can do anything you want (such
    as restrict other people''s freedom), freedom with open source software comes
    with some responsibility. The responsibility are meant to encourage continued
    development of free software, when use the code in certain ways (See the "Open
    Source Software Definition" sidebar).


    A programmer who creates open source software typically attaches one of many available
    open source licenses to it, defining how it is used. The intention of most open
    source licenses is to encourage people to make changes to the software and share
    those with others.


    # Understanding GPL and Other Licenses


    The most of the open source licenses (and the that covers most software in Linux
    distributions) are the GNU General Public License (GPL) from the Free Software
    Foundation (www.gnu.org). You can see that license at the end of this book or
    at www.gnu.org/licenses/gpl.html. As the GPL states, when software authors commit
    to making their software GPL, license allows you to:


    +   - Distribute copies of free software (and charge for this service if you wish)

    - Receive source code or get it easily if you want it

    - Change the software or use pieces of it in new free programs

    - Know you can do these things


    There are lots of other licenses that can be used to create open source-ish kinds
    of software. The Free Software Foundation maintains a list of some licenses (with
    their own comments about how well they conform to the GNU view of free software)
    at its Web site (www.gnu.org/licenses/license-list.html).


    # Building Projects with Open Source


    As for Linux and other open source for building useful and expandable projects,
    there are several reasons why I think open source software is the best way to
    do:


    +   - No licensing fee for each toy—You can build 1 or 1000 of each toy. Other
    than the time you spend, it won''t cost you more than the nothing you paid in
    the first place (or just the one copy of Fedora Core, Red Hat Enterprise Linux,
    or other system you bought).

    - No hiding the code—You can see and change all the code in your Linux Toys II.
    If you don''t like what it does, rewrite it yourself.'
