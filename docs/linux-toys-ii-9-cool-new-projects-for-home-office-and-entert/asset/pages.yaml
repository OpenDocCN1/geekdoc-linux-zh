  md: '# 160 Part III — Home Projects


    3. Press Enter to start Damn Small Linux. If your PC is configured to boot from
    CD (as most are), DSL will boot from CD, try to detect your hardware, start up
    a desktop system, and connect to the network. (If you have a wired or wireless
    card on the PC and an available DHCP server on your network, DSL should be online
    automatically.)


    If either you see the DSL boot screen or see the boot screen, but the boot fails,
    refer to the "If I Can''t Damn Small Linux" sidebar.


    DSL is configured to boot to a graphical desktop (init state 5). If you see the
    DSL desktop, you are now ready to start configuring your DSL pen drive.


    # "If I Can''t Damn Small Linux?"


    While Damn Small Linux will boot fine on most PCs, in some cases you will need
    to give it a bit of help. Here are some things you can try:


    +   * Check BIOS—If the process totally bypasses your CD, check that your PC''s
    BIOS is capable of booting from CD. Do this by entering Setup when the computer
    first boots, checking boot order, and making sure that CD comes before your hard
    drive.


    +   * Boot options—If you see the DSL boot prompt, but the boot fails, try pressing
    F2 or F3 from the prompt. You will see available boot options. If it is scrambled,
    try dsl vga=normal (minimal VGA) or dsl fb8006 (other fb options on a laptop).
    If DSL is not able to detect certain devices, disabling them by entering dsl by
    one of the following: nosci, popcmia, nousb, noaop, noswasp, noapic, nomce, or
    oddnoc. Using dsl failsafe causes to boot from CD with no hardware damage.


    +   * Boot floppy—If you can''t boot from CD at all, you can start the boot process
    from a floppy disk. The DSL project includes the bootfloppy.img and bootfloppy-img
    file you can use to start DSL from a floppy, and then continue the startup process
    from a CD or USB drive, respectively. I included those images in the Linux Toys
    II (isosch6-dammsall directory) or you can download them from damsmalllinux.org.
    So, from any Linux system, with bootfloppy in the current directory and a blank
    floppy in the first floppy drive, the typing to copy the DSL floppy image to:


    ```

    # dd if=/dev/fd0

    ```


    The same concept can be used if you are unable to boot DSL from a pen drive. To
    to use a boot floppy from a USB pen drive, change bootfloppy.img to bootfloppy-usb.img
    to create a floppy disk.


    If your computer is not capable of booting Damn Small Linux to a graphical display,
    you should consider the project on another computer. Although DSL can run in text
    mode, of the procedures in this chapter will have you a working GUI.


