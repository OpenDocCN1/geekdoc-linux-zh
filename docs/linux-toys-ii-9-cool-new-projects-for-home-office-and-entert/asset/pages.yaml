  md: '# 188 Part III — Home Projects


    I was able to purchase a basic four-piece Firecracker kit (one-way computer interface,
    remote control, transceiver, and one lamp module) for $39.99. The basic ActiveHome
    CK11A kit (two-way computer interface, remote control, credit card control, two-way
