    # Enabling Secure Shell (ssh) Service


    When many users set up a machine, one of the first network services they turn
    on is thentsecure shell (ssh daemon). The ssh daemon listens for requests that
    allow

    to log in, copy files, and remotely execute commands securely from anywhere.


    After installing Red Hat or other Linux systems, the ssh service is often on by
    default.

    Type ps -ef | grep ssh to see if the daemon is running. If not, you can start
    the service in

    Red Hat Linux systems by typing the following (as root user):


    ```

    # /etc/init.d/sshd start

    # chkconfig sshd

    ```


    With the ssh daemon running, you can log in to the computer from your LAN or other
    net-using the ssh command. You can identify your computer by name (provided you

    are DNS or have mapped your host names to addresses in your /etc/hosts file) or

    i address. Here is an example:


    ```

    $ ssh john@example.com

    The authenticity of host ''example.net (10.0.0.1)'' can''t be established.

    RSA key fingerprint is 8b:21:08:e7:41:c0:d9:b2:93:w1:af:fe5:da2.

    Are you sure you want to continue connecting (yes/no)? yes

    john@example.com password: *******

    [john]

    ```


    In this example, you are logged in as user john to the host named example.com.\Once
    you are logged in, you can use the same commands as if you were logged into the

    shell. Because it is a secure shell, all transactions are encrypted, so snooping
    the

    line cannot see what you are doing. You can even log in directly as root, although
    good practice

    to log in as a different user and root as needed.


    The scp is another command you can use to communicate with a computer that is

    running the ssh daemon. With scp, you can securely transfer files across your
    network con-nection.Here is an example of an scp command:


    ```

    $ scp -r /home/chris/gallery/ chris@server:/home/chris/

    chris''s password: *******

    ```


    The command line just shown, recursively (-r) copies the entire contents of the
    gallery

    directory (and all its subdirectories) to the /home/chris directory on the machine

    called chris as the user name. This is a handy and safe way to pass files from
    one

    machine to another.'
