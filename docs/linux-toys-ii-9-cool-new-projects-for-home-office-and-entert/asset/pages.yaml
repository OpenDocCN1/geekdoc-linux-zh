  md: '# Chapter 11 — Building a Thin Client Server with LTSP 295


    The following sections describe how to install and set up the LTSP software to
    allow your computer to run as an LTSP server. In general, you will be doing the
    following on the server:


    +   - Installing LTSP software

    - Setting up the software needed by LTSP client workstations

    - Configuring services on the server so that clients can get what they need from
    the server


    The way your LTSP server will be configured depends on how your thin clients are
    configured to boot up and how the server identifies each client allowed to access
    it. There are many ways to configure client access to the server. The example
    in this chapter manually assigns a few computers to be thin clients, based on
    the MAC address of each computer''s network card and the type of boot each does
    (such as Ethernet or PXE boot). This makes sure that only computers with specific
    network interface cards are allowed to use the LTSP server. Figure 11-2 shows
    an example of a network configuration consisting of one LTSP server and four thin
    clients.


    ![](img/1b8a24a162893627b8005ac678b79236_319_0.png)


    FIGURE 11-2: Specific thin clients can access the server, based on a MAC address.'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'The configuration shown in Figure 11-2 is used to set up the services on your
    server in the rest of this procedure. It shows a single LAN with one server and
    four clients (IP addresses 10.0.0.100 through 10.0.0.104). The server acts as
    a route to the Internet for the thin clients, and also provides the services they
    need to boot and communicate on the network.


    I suggest that you keep your own set of information, either on a diagram like
    this or in a list, that contains the data you need to set up your LTP configuration.
    Some information will be specific to your situation. For example, you will get
    your own DNS addresses from your ISP and assign your own domain name to the computers
    on your LAN.


    # Step 1: Install the Server Software


    In Fedora Core or Red Hat Enterprise Linux, you can install the LTP-utils RPM
    (On other Linux or UNIX systems, install the LTP-utils TGZ package, as explained
    in the text facts.)


    To install from RPMs, insert the Linux Toys II CD on your drive. If your CD mounts
    automatically, you can skip the first command. If it doesn''t, run the following
    (replacing /media/cdrecorder with the location of where your CD was mounted) as
    root from Terminal:


    ```

    # mount /media/cdrecorder

    # cd /media/cdrecorder/RPM/ch11-terminalserver

    # ./installme

    ```


    If that installed, you can continue to the next step. If you are using a different
    Linux or UNIX system, you can install the LTP-utils tgz package instead. Copy
    the file from the CD that contains it to a temporary directory. Then, with your
    current directory, type the following to root user:


    ```

    # mkdir /tmp/ltsp

    # cd /tmp/ltsp

    # tar xzf /media/cdrecorder/Sources/chil-terminalserver/ltsputils-0.11.tgz

    # cd ltsp_utils

    # ./install.sh

    ```


    Whether installed from an RPM or TGZ file, the result should be three commands
    installed on your system. The commands are ltspinfo, ltspadmin, and ltspcfg.


    # Step 2: Add Client LTP Software to the Server


    To begin installing LTP software that will be needed by your thin clients, you
    must have at least 400MB of disk space available in the partition /opt/ltsp directory
    or other directory, if you choose. If you already have the LTP software available
    on CD or your hard disk, you shouldn''t need any additional space at the moment.


    If you don''t have an internet connection, you can install the LTP files from
    the LTP image contained on the Linux Toys II CD. You need to burn the ltsp-4.1.0-iso
    file from the isos/chil-terminalserver directory in the Linux Toys II to a blank
    CD. (Chapter 5 includes a description of how to burn a CD) Insert the CD into
    your computer and continue with the following procedure.


