    # Step 1: Configuring Heyu


    The Heyu software can read from a configuration file to define many features used
    by the Heyu command. That configuration file is typically set up in one two ways:


    +   * /etc/heyu — By default, the main configuration file for Heyu is /etc/heyu/x10.conf.
    If that configuration file is used, related configuration files (such as x10record,
