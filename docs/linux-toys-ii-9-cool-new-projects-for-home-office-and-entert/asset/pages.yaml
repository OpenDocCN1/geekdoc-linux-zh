  md: '# 126 Part II — Multimedia Projects


    **Network — If you have an Ethernet card and a DHCP server on your network, you
    can play content from MobiiX² that you get from the Internet or your private LAN.
    You can also make an NFS directory or access Internet radio stations. You can
    also launch an FTP server and upload content to your MobiiX system from another
    computer on the network.


    Although the focus of the chapter is on creating bootable movies with eMoviX,
    if you find that you like MobiiX you might well use MobiiX² your own personal
    media player. After the section on creating your bootable movies, check out the
    “More Ways to Use MobiiX” later in this chapter.


    # Hardware Requirements


    You can use any PC running Linux to make eMoviX movies and burn them to CD or
    DVD. You can play them on almost any PC, regardless of what operating system is
    installed on. Because eMoviX includes a minimal Linux operating system (by MobiX
    creator Roberto De Leo), it can run on machines with 600 MHz Pentium with 64MB
    RAM, although I do some tweaking at the boot prompt (which I talk about later)
    to get best performance.


    On the capturing side, there are a lot of ways to get the video you want to share.
    In particular, you can use the hardware described for the MyMyth TV project (see
    Chapter 4). Essentially, you need hardware for capturing video input (such as
    a TV capture card) and encoding processing power and RAM to be the task of handling
    the recording and processing personally.


    > Refer to Chapter 4 for information on selecting a TV capture card. In most cases,
    the more money you spend on a supported TV capture card, the more processing you
    can offload to the card. In other words, you might be able to encode the video
    on a lower-end PC with a card that does a lot of the work.


    ![](img/1b8a24a162893627b8005ac678b79236_150_0.png)


    # Making a Bootable Movie


    Getting a video or recorded television to show in a form where it can play on
    almost any PC is the point of this. The basic steps for doing including the recorded
    video, joining that recorded video together with MobiX software to form a bootable
    image, and burning that to CD or DVD.


    Although your bootable eMoviX movie will work on most PCs, there are a few limited
    cases where some boot options are needed to get the video to play (or at least
    to). So the last steps of this procedure are dedicated to describing boot options
    (for getting eMoviX to boot in special situations) and MPlayer keys (to control
    the movie with the keyboard over it''s playing).


    Figure 5-1 illustrates the general steps in making and playing an eMoviX bootable
    movie.'
