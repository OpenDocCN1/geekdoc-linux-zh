    # Adding Passwords


    To administer the BZFlag server, you need to add a password, and then enter password
    when you connect to the server. Add a password to the server using the -password
    option in the server configuration file follows:


    ```

    -password myg00dpwd

    ```


    After you connect to the server (for example, by starting a game with bzflag and
    identifying the server), you can enter a message (for example, type N) to send
    the password. Here''s what you would type:


    ```

    /password myg00dpwd

    ```


    The server will say You are now administrator! if the password was correct. You
    can then do administrator to your BZFlag process. Managing passwords for the users
    on your server is a different issue. As the administrator, you identify the password,
    users, and group file. Then, each user adds a password to his callsign when he
    connects to the server. Here are examples of options you can add to your server
    configuration file:


    ```

    -passdb server.pass

    -userdb server.users

    -groupdb server.groups

    ```


    Just giving file names, as shown above, creates these password files in your current
    directory. If you like, you can give a full or relative path instead. The first
    time players sign on to a server, they associate passwords with their callsigns.
    They can do this from a message mode using the /register command as follows:


    ```

    /register YUrGNUpwd

    ```


    Following the /register command is the password associated with the current player
    (choose your own password). After the player is logged in, the next step is to
    enter the password using, the /identify command:


    ```

    /identify YUrGNUpwd

    ```


    The player is now registered and logged in. A (+) will appear next to the user''s
    name on the score sheet. The player will also have access to extra commands that
    were not available to unregistered users.


    # Kicking Off and Banning Players


    If you are setting up a BZFlag server for your home or small office, presumably
    you will not be dealing with cheating and other abusive behavior. However, on
    public servers, dealing with players who cheat, are abusive, or otherwise disrupt
    the flow of the game is a major issue with gaming servers (including BZFlag).'
