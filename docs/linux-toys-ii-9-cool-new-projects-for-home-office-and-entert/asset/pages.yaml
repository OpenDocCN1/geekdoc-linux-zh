    $49.99. On occasion, you can find better deals, or be sure to shop around.


    Beyond the X10 starter kits, you can purchase as many X10 lamp modules, appliance
    modules, switches, remotes, or other devices that you like. So, depending on which
    interface you are starting with, choose the other X10 hardware items that interest
    you, and then either to use the BottleRocket or Heyu transreceiver that follows.


    # Choosing Transceivers


    Although X10 works through the power lines in the house, often X10 requests are
    transmitted from wireless devices (such as key pads and computer modules) that
    send signals through the air to X10 transceivers. These transceivers transmit
    the X10 commands to the house wiring, where they can be picked up by other X10
    transceivers.


    Here are a few issues to consider when you are choosing an X10 transceiver:


    +   - **Number of house codes** — Expensive X10 transceivers will operate only
    on a single house code (represented by a letter A to P that you choose). So, if
    you have only one of those transceivers, all devices must be on that house code
    (and you can have only 16 of them), unless you need inexpensive transceiver. To
    talk to multiple house codes (communicate with multiple units), however, purchase
    a transceiver that can receive all 16 house codes.

    - **Antenna** — Many X10 transceivers have a single antenna attached directly
    to the transceiver. To improve reception, some transceivers come with external
    antennas that can be placed several feet away from where the transceiver is plugged
    into a power outlet.


    Instead of using an RF transmitter, you can use a device that sends signals directly
    into your power lines. An example of this type of device is the CM11A computer
    interface that plugs directly into a power outlet and receives signals from your
    computer''s serial port.


    # Choosing Plug-in Modules


    Plug-in modules are about the size of a large bar of soap and plug directly into
    a power outlet. There are plug-in lamp modules and appliance modules:


    +   - **Lamp modules** — These modules typically allow you to plug in a lamp or
    other light source that is up to 300 watts.

    - **Appliance modules** — These modules typically support lights up to 500 watts,
    but can also be used to turn on and off appliances. For example, the appliance
    might be a television up to 400 or 500 watts or a motor with one-third horsepower.'
