    > CAUTION


    Setting up CGI-x10 script is easy. Setting up your Web server on a system such
    as Fedora, which tries to make your Web server as secure by default, is a bit
    tricky if you''re not used to it. Here are the basic steps to go through.


    +   1. Run Security Level Configuration. From the desktop, select Desktop → Security
    Level. In the Security Level Configuration window, your Firewall Options tabs
    tell you whether or not your firewall is enabled or external Web service is allowed
    (it can be off and still allow you to run the CGI-x10 script from the local computer).


    The SELinux tab shows you whether or not SELinux is enabled and being enforced.
    If it is, to run the cgi-x10 script, you need to select HTTPD Service and Allow
    HTTP support. You should now be able to run CGI scripts from your Web server.


    +   2. Open access to serial port. To use the CGI-x10 interface, the Web server
    needs to be able to write to your port so the br command can send X10 signals
    to it. Because server ports are assigned to root (owner) and ucoup (group), with
    read-write permission to open (660), you can have that user gain access to those
    ports by simply adding user to ucoup. As root, use the /etc/ucroup group file
    with any text editor and change the ucoup line to appear as follows:


    ```

    ucoup:x:14:ucoup, apache

