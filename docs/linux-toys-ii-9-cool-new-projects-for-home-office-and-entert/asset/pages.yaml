  md: '# 280 Part IV — Small Business Projects


    For the input modules (I''m describing playlists as input at the moment), the
    following input settings ices to take input from a playlist.


    ```

    <input>

    <module>playlist/basic</module>

    <param name="type">basic</param>

    <param name="file">/home/chris/myces/playlist.txt</param>

    <!-- random play --

    <param name="random">0</param>

    <!-- if the playlist gets updated, start at beginning -->

    <param name="restart-after-reload">0</param>

    <!-- if set to 1, plays once through, then exits. -->

    <param name="once">0</param>

    </input>

    ```


    I didn''t change any of the input values in this case, except for the location
    of the playlist.txt file. Using the default, Ice2 takes its input from a playlist
    (playlist.txt) shown here in the /home/chris/myces directory). Files (or speech
    files) are played in order by turning off the random option (random 0) and are
    repeated after the list has played (once 0). The playlist begins playing again,
    from the beginning, if the playlist is updated.


    You can have one instance, or many instances, of an audio stream.


    You can direct an instance of an audio stream to a different point or a different
    server. Each instance can be encoded at a different bitrate. Having multiple instances
    of stream going to different servers allows transmission to continue, even if
    a particular Ice server goes down. Having multiple instances on the same server
    allows you to offer different levels of audio quality, to work better on different
    speeds.


    ```

    <instance>

    <hostname>LinuxToys.net</hostname>

    <port>8000</port>

    <password>kuul4word</password>

    <count>myplaylist.ogg</count>

    </instance>

    ```


    As Icecast was configured in a previous step (to listen on all interfaces at LinuxToys.net),
    you could run it from another computer. In that case, the host name would look
    like this (depending on the name or IP address of your Icecast server):


    ```

    <hostname>LinuxToys.net</hostname>

    ```


    There are a bunch of other parameters associated with an instance that are probably
    not necessary for you to change. For example, if ices fails to connect to the
    machine containing the Icecast server, it will attempt to reconnect five times
    (with seconds between each attempt) before failing. (Change reconnectattempts
    to -1 to continue trying).


    The final set of instance parameters determines the nominal bitrate (64,000),
    sample rate (44,100) and channels (2) assigned to the stream. These settings must
    match the input data for channels and sample rate.)'
