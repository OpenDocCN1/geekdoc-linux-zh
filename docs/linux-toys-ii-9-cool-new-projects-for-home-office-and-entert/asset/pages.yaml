    # Step 3: Installing DSL on Your Pen Drive


    With DSL running on your computer from the Linux Toys II CD, the following procedure
    describes how to format your pen drive, and then install DSL to it. To install
    DSL on your pen drive, follow these steps:


    +   1. Insert the pen drive into a USB port on your computer (but don''t mount
    it).


    +   2. Determine the name of the device associated with your pen drive. In many
    cases, the drive device is /dev/sda and will include a single partition: /dev/sda
    (for the first device on the SCSI drive). If you don''t know the device name is,
    open a terminal (right-click, select XShells → Root Access), and then type the
    following:


    ```

    # /bin/fdisk -l

    Disk /dev/sda: 1024 MB, 1024966656 Bytes

    32 heads, 63 sectors/track, 933 cylinders

    Units = cylinders of 2016 * 512 = 1032192

    ```


    In my case, the pen drive has 1GB of storage and is formatted for a single FAT16
    (DOS) file. The device name I would enter for the pen drive (that might be your
    device as well) is sda.


    | Device Boot | Start | End | Blocks | Id System |

    |---|---|---|---|---||

    | /dev/sda | 1 | 922 | 999813+ | 6 FAT16 |


    It''s important that you get the device name for your pen drive here. If you have
    one device storage as a SCSI drive, your pen drive may be sdb, sdc, and so on.
    Be sure you have the right device name because in the next few steps you are going
    to erase everything on that drive! Also, don''t erase the existing partition number
    (for example, sda); enter the name that designates the entire drive to be erased
    (for example, sda).


