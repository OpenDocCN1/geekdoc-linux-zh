  md: '# Patches and Updates


    It is very important that you keep up with patches and updates for Gallery. Keep
    an eye on the Gallery Project page (http://gallery.sourceforge.net) to see when
    updates are available. If you are using Gallery as a public server, you must also
    keep up with patches from the Linux distribution you are using with Gallery. It''s
    a good strategy to subscribe to the lowvolume Gallery Announce mailing list http://gallery.sourceforge.net/lists.php
    where you''ll receive notifications about important updates.


    # Summary


    Gallery is a powerful, open source application for publishing and managing all
    of your digital images so that you can publish them on your local LAN or on the
    public Internet. With Gallery, you can define who has access to view and change
    the contents of your Gallery server. You also have a lot of control over the look
    and arrangement of elements in your gallery and its albums.'
