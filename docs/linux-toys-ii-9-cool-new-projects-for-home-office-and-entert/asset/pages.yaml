    Gallery Configuration Wizard: Step 2


    In this step you customize various settings for Gallery. If it''s the first time
    you''ve used Gallery, you''ll notice that we''ve tried to pick reasonable defaults
    for you. Even, you''ll probably have to make at least some changes. If you''ve
