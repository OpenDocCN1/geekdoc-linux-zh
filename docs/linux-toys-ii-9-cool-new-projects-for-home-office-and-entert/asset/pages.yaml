    # # Switch Recommendation


    When building one of these SOHO firewalls, I also recommend getting a very small,
    very cheap 100 Mbps auto-crossover detecting switch for interconnecting your other
    internal clients to your firewall/gateway. The auto-crossover detecting feature
    will save you much eye strain as you squint at CAT5 cables, trying to discern
    between a crossover arrangement of those eight little CAT5 switches, and a straight-through
    CAT5 cable arrangement.


    Get a switch with at least eight ports so that you can provide connections for
    some small home/office machines, and have a couple extra for guests or stringing
    to another switch or even a WiFi (wireless) Access Point.


    > A very cheap, small, fairly robust switch that I''ve fallen in love with for
    this purpose is the GigaFast E2800-8-Port 10/1000Mbps Network Switch (see Figure
    9-3), available from most online computer networks and e-tails such as www.newegg.com
    or www.tigerdirect.com. This powerful and cheap switch is built reliably, has
    eight auto-sensing, auto-negotiating, crossover detection ports, and can be found
    for $160! You can''t really go wrong.


    If you need a larger switch, GigaFast offers 16- and 24-port models, and their
    line has a built-in mini AC power supply so that you can bypass the wall DC power
    supply. These eight-port models are perfect for this purpose because they just
    slide into a 5.25-inch drive bay and can be screwed mounted if desired. Very nice
    indeed for a single enclosure design!'
