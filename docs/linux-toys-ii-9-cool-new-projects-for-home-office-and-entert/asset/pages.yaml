  md: '# Part III — Home Projects


    | IP Address | Assigned to |

    |--- | --- |

    | 192.168.1.100 through 192.168.1.250 | Miscellaneous employee or guest machine
    IP leases |

    | 192.168.1.251 | Reserved |

    | 192.168.1.252 | Reserved |

    | 192.168.1.253 | Reserved |

    | 192.168.1.254 | WiFi Access reverse gateway/router (trusted itself) |


    This type of arrangement offers a well laid IP space arrangement with a little
    room for growth. What might your IP range you think you could use in a small office
    environment? Might you need additional IPs? If you''re not sure, double the ones
    that you currently allocated. What about if this were a home configuration? Just
    remember that you are going to have servers, workstations, or other devices that
    people need to access on a regular basis, considering them a static IP address.


    # Other Network Services and Configuration Options


    In SOHO gateway/router configurations, the machine that gives out IP addresses
    also running naming services (or DNS) for the internal group. This saves on company
    bandwidth and increases the overall speed of using Internet name-based services
    because recursive DNS services like this do''s called DNS caching.


    The first after on your network browse to google.com or ebay.com, that DNS record
    is cached and stored locally on your network internal servers to access more quickly
    in the future. To enable this service on your Devil-Linux gateway, you need to
    turn on DNS, and set DHCP to point the internal clients to your internal Devil-Linux
    gateway''s IP address for DNS resolution. You''ll find more out in this section
    "Configuring the Network and Startup Services" in this chapter.


    Other internal services that small gateway servers sometimes include ssh (Secure
    Shell) access, so that administrators can log in and check things out and make
    small changes to the server from their desktop. You may also want to offer Network
    Time Protocol or NTP from your small gateway. With NTP properly set up, your gateway
    will go out and sync itself against Internet-connected atomic clocks, and in turn
    allow your client and server machines to sync it. This is an overlooked but strongly
    recommended configuration.


    Some other services that you might want to kick the tires on and check internally
    are NTOP and TTHTOP is a very powerful little network monitoring tool that shows
    you the traffic flowing across your gateway as well as the source and destination
    IPs by country. You get to by internally pointing a Web browser to http://192.168.1.1:8080.'
