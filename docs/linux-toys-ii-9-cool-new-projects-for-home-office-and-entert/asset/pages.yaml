  md: '# Hardware Requirements


    The hardware needed to capture TV with MyTV via FireWire is a FireWire port on
    your machine and a MyTV-supported cable receiver. At the time of writing, the
    following cable receivers are supported by MyTV:


    +   - Motorola DC6200


    +   - Motorola DC6400


    +   - Seattle Atlanta 3250


    Only the Motorola DC6200 supports changing the channel via the FireWire cable
    on MyTV.


    FireWire ports can be provided in different ways. They can be included on the
    PC''s motherboard, on a sound card such as the Creative SoundBlaster Live series,
    or provided by a standalone FireWire PCI card. FireWire included on the motherboard
    is the most convenient method, as it requires no additional hardware.


    Unfortunately, not all on-board FireWire devices are supported in Linux or by
    the FireWire video software. If your PC does not have on-board FireWire, or the
    on-board FireWire is not supported by Linux or by capturing the software, you
    should look to a PCI device to provide a FireWire port. Obviously, you don''t
    want to purchase a sound card to get a FireWire port if the PC already has a functional
    sound card. The majority of PCI FireWire cards work well with Linux and capturing
    software. Be sure when purchasing such a card that the vendor has a good return
    policy the card should be supported.


    # Software Packages Needed


    MyTV packages now include most of the software packages to use FireWire capturing
    as dependencies. However, one extra package, libie61883-utils, must be installed
    by hand. This package provides some utilities to work with the FireWire subsystem.
    This package can be installed with the following:


    ```

    # apt-install libie61883-utils

    ```


    # Loading Kernel Modules


    First the two modules to work with the FireWire ports. These modules are named
    ieee1394 and ohci1394. Use the lmod command to ensure that these are loaded:


    ```

    # lmod grep 1394

    ohci1394    39177 0

    ieee1394    302873 1 ohci1394

    ```


    In order to capture video through FireWire, the raw1394 kernel module must be
    loaded. However, before this module can be loaded you must first create device
    entries. These entries are necessary to interact with the udev subsystem. To create
    the necessary device entries, issue these commands as root on the MyTV system:


    ```

    # mknod /dev/raw1394 c 171 0

    # mnod /etc/udev/devices/raw1394 c 171 0

    ```'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Chapter 4 — Creating a Personal Video Recorder with MythTV 103


    After these device have been created, the raw1394 kernel module can be loaded
    as follows:


    ```

    # modprobe raw1394

    ```


    To ensure that this module loads properly after the system reboots, you must edit
    the /etc/

    modprobe.conf file. Open this file in a text editor and add the following as one
    continuous

    line to the bottom of the file:


    ```

    install ohci1394 /sbin/modprobe --ignore-install ohci1394;

    /sbin/modprobe raw1394

    ```


    # Attaching the Cable Receiver


    At this point, the cable receiver can be attached to either the PC or the PC''s
    FireWire port. Should there

    multiple FireWire ports, it does not matter which of

    ports are used. Ensure that the cable receiver is powered up and then connect
    ends

    of the FireWire cable. Now the cable receiver can be powered up. The log file
    /var/log/

    messages can be checked for contents similar to the:


    ```

    ieee1394: Host ID: BUS[0-01:0023] GUID[00090a9400000380]

    ieee1394: Node ID: BUS[0-01:0023] GUID[000f99ffea323c6]

    ieee1394: raw1394: /dev/raw1394 device initialized

    ```


    This means that the cable receiver was detected via the FireWire port and the
    capture

    device associated with it was initialized for use. If all has gone well, the next
    step is to scan for

    device and test a capture.


    # Scanning for the Device and Testing a Capture


    In order to capture content from the cable receiver, the system must know which
    FireWire port\and which node device is detected. You can scan for it by using
    the plugreport util-

    ity. The output is from plugreport on a system with a cable receiver attached
    to

    port 0, node 1:


    ```

    # plugreport

    Host Adapter 0

    ============

    ```


    ```

    Node 0 GUID 0x0090a94000003380

    ieblec61883 error: error reading oMPR

    ieblec61883 error: error reading iMPR


    Node 1 GUID 0x000f99ffea323c6

    oMPR n_plugs=1, data_rate=2, bcast_channel=63

    OCR[0] online=1, bcast_connection=0, n_p2p_connections=1

    channel=0, data_rate=2, overhead_id=0, payload=376

    iMPR n_plugs=0, data_rate=2

    ```


    Seeing values for oMPR, oPCR, and iMPR under Node 1 shows that the device is attached

    there. The port and node information will be needed for testing captures and configuring

    MythTV.'
