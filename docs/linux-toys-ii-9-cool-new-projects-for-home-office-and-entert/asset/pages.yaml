- img_proc: true
  md: '# 334 Part V — Appendixes


    To refer to your home directory, or a subdirectory of your home directory, you
    can refer to either $HOME or a tilde character (-). For example, either of the
    two commands could be used to go to the public_html directory in your home directory
    (for example, /home/chris/public_html):


    ```

    $ cd $HOME/public_html

    $ cd -~/public_html

    ```


    Listing Files and Directories

    ls lists the contents of a directory. For example, to show a short list the contents
    of your home directory, a long list, and a list that also includes hidden files
    (that begin with a dot), change to your home directory and type the following:


    ```

    $ cd -

    $ ls -l

    $ ls -a

    ```


    You can display your file listing in many different ways using options for ls.
    -t sorts files by the time they were last modified, -C lists files in columns,
    and -S lists files by size. Often, you can use options (for example, ls -l -S
    lets you sort files by size and show the actual size, along with other information
    about each file).


    Creating and Removing Files and Directories

    You can create a new directory using the mkdir command. For example:


    ```

    $ mkdir ~/mydocs/

    ```


    The result is a directory named mydocs in your home directory. You could remove
    that directory (provided it were empty) by typing:


    ```

    $ rmdir ~/mydocs/

    ```


    If the directory were not empty, you could use a command such as the following
    to remove it and its contents:


    ```

    $ rm -rf ~/mydocs/

    ```


    To remove a file, you can simply use the rm command. For example:


    ```

    $ rm ~/myfile

    ```


    To rename a file or directory (or actually, move it to a different name), use
    the mv command as follows:


    ```

    $ mv ~/README.txt ~/README_SHELL.txt

    ```


    To make a copy of a file, use the cp command as follows:


    ```

    $ cp ~/README_SHELL.txt ~tmp

    ```'
