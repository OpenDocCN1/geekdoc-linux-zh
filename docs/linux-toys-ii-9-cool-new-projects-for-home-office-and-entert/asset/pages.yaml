  md: '# Chapter 3 — Creating a Web Photo Gallery


    +   - **Short URLs enabled** — Checks whether the Apache Web server includes the
    mod_rewrite modules. This module lets you direct people to your gallery using
    shorter, easier-to-read URLs. If the module is being loaded, you should see a
    line similar to the following in your system''s /etc/httpd/httpd.conf file:

    `LoadModule mod_rewrite modules/mod_rewrite.so`


    It is also possible to provide mod_rewrite support for your personal gallery,
    provided that your .htaccess file is accessible (which it should be at this point).


    +   - **NetPBM image modules** — Checks that a set of NetPBM tools, used for converting
    images into different formats, is available on your system. (For Fedora Core,
    these tools come in the netpbm-tools package).

    - **Image** — Checks that a set of ImageMagick tools for manipulating images is
    available on your system. (For Fedora Core, these tools come in the ImageMagick
    package).

    - **Access EXIF headers** — Checks that the jhead utility is installed. Gallery
    uses jhead to examine EXIF headers that are embedded in JPEG images created by
    many digital cameras. To download or get more information about jhead, check the
    following site: www.sentex.net/~mwandel/.


    +   - **Lossless rotation of JPEG images** — Checks if the jpegptrans is installed.
    This utility is needed for Gallery to be able to do lossless rotations of JPEG
    images.


    +   - **PHP support for translations** — Checks if your version of PHP includes
    support for GNU gettext. Proper support is needed to support fast translations
    into different languages.


    +   - **Number of languages available** — Checks how many languages are supported
    by your version of Gallery. If the language is not there, go to the Gallery download
    page and look for gallery language packs. (The Version I installed supports for
    35 different languages. There are about 70 languages available from the Gallery
    site).


    +   - **Multilingual capabilities** — Checks if all supported Gallery locales
    are available on your system. Gallery enables these locales to enable multilingual
    and appropriate date/time formats for supported languages.


    +   - **Latest Gallery files** — Checks that the latest versions of Gallery files
    are being used. If you use a pre-release version of Gallery, you may see a warning
    that files are more recent than expected. You can probably continue without a
