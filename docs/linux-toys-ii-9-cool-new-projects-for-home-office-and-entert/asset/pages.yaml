  md: '# Chapter 8 — Setting Up a Game Server with BZFlag 211


    # Playing BZFlag


    Battle Zone capture the Flag (BZFlag) is a tank game you can play against others
    over a LAN or the Internet. Using a tank in first-person shooter mode, you play
    as an individual or as a tank, blowing up opponents along the way while trying
    not to let others blow you up. There are major game styles:


    +   - Free-for-all — In Free-for-all, you simply try to destroy other tanks more
    often than they destroy you. The final objective is to store more points than
    your opponents.


    +   - Capture-the-flag — In Capture-the-flag, each team tries to protect its own
    flag (or flags) from being grabbed by an opponent and take it to the opponent''s
    base. If you get hold of an opponent''s flag and take it to your base, you destroy
    all opponents on that, subtract a point, and add point to your team.


    +   - Rabbit Hunt — In Rabbit Hunt, you try to hunt and destroy the tank designated
    as the rabbit (typically a white tank). Once that happens, the next leading scorer
    becomes the rabbit (if you are the rabbit, you try to stay as long as you can.


    When you join a game, you join as a member of one of the following:


    +   - Team — You can join a game as a member of one of four teams, designed by
    color: red, green, blue, or purple. When you play on a team, you try to work together
    with teammates to capture flags, protect your own, and destroy opponents as much
    as possible.


    +   - Rogue — As a rogue, there is nobody to help you You also play alone.


    +   - Observer — As an observer, you travel around battles without playing. Press
    F8 to change from roaming freely to tracking from one of the players or tracking
    the team. The default mode is to track the winning player. If that player is destroyed,
    you switches to the player with the next highest score.


    Flags are important part of BZFlag. Obviously, protecting the flags of your team
    (which appears in your team''s color) is an important part of the Capture-the-flag.
    However, in any game type, you can give tank special skills by picking up flags
    as you travel around the world. These flags are referred to as super flags.


    A super flag is white, but has no markings to distinguish it from other flags.
    When you pick up a flag (by driving over it), you find out it is and immediately
    get its special attributes. (You can use identity flag if you have one, to determine
    the identity of a flag without picking it up.) Some flags are good, while others
    are bad. See Table 8-3 later in this chapter for a listing of flags and their
    attributes.


    Figure 8-2 shows an example of BZFlag world. Two tanks are moving through the
    foreground, with the one to the left carrying the team''s flag. Another tank is
    blowing up in the background. A white flag on the left side of the screen is a
    super flag that carries with it special ability. On the bottom of the screen,
    you can see a radar view of the world, while messages related to game play and
    chatting appear on the bottom right.'
