  md: '# Chapter 4 — Creating a Personal Video Recorder with MythTV 117


    Select Watch TV and check whether you get your channels. If you get a black screen,
    an error message about your /dev/video device, or snow or the like, and everything
    is hooked up correctly, you probably have some type of/capture card problem.


    Problems? Look in /var/log/messages as you start MythTV frontend. You can often
