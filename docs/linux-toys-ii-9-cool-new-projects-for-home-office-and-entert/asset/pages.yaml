  md: '# Chapter 6 — Customizing a Live Linux Drive 161


    # Step 2: Preparing to Install DSL on Your Pen Drive


    Before you begin installing on your pen drive, check to make sure that:


    +   - You are ready to completely erase your pen drive. (If there is anything
    on the pen drive that you want to keep, make a copy of it.)

    - Your PC has a USB port that matches your pen drive (DSL 1.1 or USB 2.0).

    - The drive is not mounted. (You can either insert the pen drive until later in
    the process or unmount it, probably by typing sudo mount /dev/sda or unmounting
    it from the mount.app tool in the DSL panel.)


    ![](img/1b8a24a162893627b8005ac678b79236_185_0.png)


    To perform many of the steps in this chapter you need root access. Like KNOPPIX,
    DSL doesn''t give you a password to gain root access. However, it does have you
    ask for root access. Here are a few ways you can gain root access: right-click
    the desktop, select Xshells -> Root Access (open to a shell with root access);
    use the sudo command to gain a command as the root user (as in sudo mount /dev/sda
    command shown previously). You could also run elFM as super-user with I told by
    Robert Shinglelecker that future DSL will allow the regular DSL user to automatically
    have root permission (with a later DSL, you may have to gain root access to this
    chapter).


    Consider the type of computer you will boot before you choose to install DSL on
    your pen drive. Here are your choices:


    +   - USB-ZIP — Most PCs that are capable of booting from a USB device will be
    able to boot a USB-ZIP device. Because USB-ZIP is an older standard, however,
    it has limitations. The partition on the USB drive must meet limited DSL size
    specifications. To deal with this problem, a USB-ZIP pen drive for DSL creates
    a small partition and assigns the rest of the pen drive to a separate partition.
    In cases where you may want to boot from a lot of different computers, USB-ZIP
    is your best choice.

    - USB-HDD — Newer computers will be able to boot the pen drive using the USB-HDD
    boot style. However, the USB-HDD boot option is not available in many older computers.
    The USB-HDD configured pen drive can be accessed once the boot, you can start
    the process for a USB-HDD drive from a floppy disk or CD and then continue it
    from the USB-HDD pen drive.


    ![](img/1b8a24a162893627b8005ac678b79236_185_1.png)


    See the "Starting Up your DSL Pen Drive" section later in this chapter for information
    on starting your DSL drive installation from a floppy or cd.


    +   - Embedded boot (within Windows and Linux) — There is an embedded version
    of DSL available that you can boot DSL on a computer that is actively running
    Windows. DSL will appear in a window on your Windows desktop! When you do to install
    of that type of image on your pen drive, DSL includes the QEMU emulator. That
    combination allows you to launch DSL in its own window on your Windows or Linux
    desktop.'
