  md: '# # Introduction to Linux Toys II


    The same building blocks used to create the world''s most powerful computer system
    (Linux) can also be used as the foundation for creating fun, interesting, and
    useful projects. If you have a PC and this book (and are okay with adding a few
    extra pieces of hardware, which I describe later), you''re ready to start.


    Welcome to Linux Toys II.


    Linux Toys II is my second attempt (the first being Linux Toys) to gather up a
    few projects how to make them. In the few years since Linux Toys was published,
    the pool of open source software on how to base base projects has grown astronomically.
    As a result, you will find Linux Toys II projects to be more solid and more engaging
    than those in the first book (See the description of the differences between the
    two books in this chapter).


    Besides fun, Linux Toys II projects offer you other opportunities:


    +   - Learn Linux — While this book might be a bit challenging if you have never
    used Linux before, I have done what to simplify instructions and add some primers
    (Appendix B and C) for using and installing Linux. You might consider getting
    a more detailed book on installing, configuring, and using Linux (such as Red
    Hat Fedora and Enterprise Linux 4) to back up if you are a first-time Linux user.


    Experienced Linux users, I tried to remove a lot of hunting and pecking you have
    to get a project going and to expose you to some areas of Linux you may not tried
    before.


    +   - Exercise freedom — By building these computer projects with open source
    software, you are generally free to add, take apart, recompile, or change the
    software elements of these projects without breaking proprietary licensing agreements.
    (See the description of what you can and cannot do with “free” software layer
    in this chapter.)'
