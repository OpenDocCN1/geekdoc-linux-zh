  md: '# Part III — Home Projects


    ![](img/1b8a24a162893627b8005ac678b79236_272_0.png)


    # CD-ROM, Floppy, and USB Thumb Drives


    As for the last major components, all you need is a general purpose ATA CD-ROM
    drive that''s less than five years old (no CD-R media reading issues) and a 1.44MB
    floppy drive. If you''re like me, you can probably assemble all of these parts
    laying around in your geek closet. If you''re using a newer motherboard that supports
    USB, you can use a small USB thumb drive instead of the floppy drive. The smallest
    thumb drive, 8 or 16MB, are more than you''ll ever need.


    # Designing Your Network


    This section addresses some additional variables to consider in planning and laying
    out a small office or home network. These variables include items such as your
    internal network''s IP space, IP pre-allocation or static mappings, file servers,
    print servers, and as alternate DNS servers, network devices, alternate network
    gateways, and the like.


    # DHCP Configuration


    The network that connects by default on most home firewalls is a single block
    of IP addresses, ranging from 1 to 254. You need to decide how to slice the IP
    space to allocate IPs for known internal machines, known network devices, and
    as dynamic IPs for guests or unknown visitors to your network (such as a friend''s
    laptop).


    Because you have always-on PCs or servers as part of your network, and you want
    the IPs on those machines to remain static and never change, the IPs of 2 through
    9 should be reserved (1 is the internal address of the firewall/gateway/router
    itself). At the upper end of the network you also have a few IPs (perhaps 251–254,
    with 255 being the reserve broadcast IP for your LAN) that you want to reserve
    for various network devices (such as a wireless gatewayrouter or Access Point).'
