  md: '# Introduction


    Supporting the Linux operating system are thousands of open source initiatives,
    building code for everything from word processors, to Web servers, to programming
    tools. While many of these initiatives help to make Linux the world''s most powerful
    operating system, others produce software that is flat-out fun.


    Linux® Toys II is here to show you some of the fun!


    In Linux Toys II, I give you the software, the shopping list, and the steps to
    put together projects using open source software and PC hardware. Some projects
    will run even on 486 with 32MB of memory (for example, a client in the Linux Terminal
    Server project), which others encourage you to build a completely tricked-out
    entertainment system-style PC (for example, the MythTIV project).


    Most projects will run on any standard PC built in the past ten years so you can
    decide how a fancy computer you want to use. Once you have built your Linux Toys
    projects, you don''t have to stop. You can further enhance your projects because
    of the open source works:


    +   ■ The building nature of Linux—You can continue to add software from the thousands
    of open source components available for Linux. So you can add your favorite applications
    to your custom Linux pen drive, incorporate a database application to store images
    or music for a server, or include a graphical front end to control your home lighting.


    +   ■ Thriving communities—Most of the Linux Toys II projects are built on open
    source initiatives that have activity, thriving supporting them. You can learn
    more about each project by participating in forums or joining mailing lists. You
    can become a contributor to each effort by creating software or documentation
    ... or buying a T-shirt.


    If you are new to Linux, you can learn the basics of Linux in Appendix B and procedures
    for installing a particular version of Linux (Fedora Core) in Appendix C. All
    the projects should run on most Linux systems (if you are willing to compile them).
    However, if you are a first-time Linux user, using instructions for Fedora Core
    Linux and using the pre-built software packages (in RPM format) can save you some
    trouble.


    So, welcome to Linux Toys III! To get started, all you need is this book and a
    PC for the basic projects. In some cases, you can just boot the Linux Toys II
    CD (which contains a custom version of Damn Small Linux) to get started. For other
    projects, you need an installed Linux system and some extra hardware that throughout
    the book.'
