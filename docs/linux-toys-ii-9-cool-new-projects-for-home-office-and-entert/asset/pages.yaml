    # Using the Desktop


    In recent years, extraordinary improvements have been made to the graphical interfaces
    that are available with Linux systems. Along with those changes have come improved
    graphical tools for administering the system.


    Whether or not you have a graphical interface on your Linux system depends on
    whether or not X and related software has installed and whether it has set to
    start automatically. If you see a graphical login screen, you already have a GUI.
    If you see a text-based prompt, you must start the GUI yourself (using something
    like the startx).


    If you have a powerful computer and a full install of KDE or GNOME desktop environments,
    using one of those desktop environments gives you the advantage of integrated
    applications (with such as shared boards and drag-and-drop features). However,
    if you are using a low-end computer, you might want to use a more streamlined
    GUI (X and a simple manager), as we recommend for our projects. Damn Linux uses
    the efficient fluxbox window manager.


    Most Linux distributions use either XFree or X.org for X Window system. Because
    many of the most popular Linux systems have moved to X.org in the past few years,
    I''m going to describe what you need to know to get a desktop working in Linux
    using X.org as your X server.'
