    identify it to the br command. To add, add a -x option. For example, use the second
    serial port (COM2), add -x /dev/tty1 to the br command lines following.


    Here are some examples of the br command.


    I show the br command running as a regular user (assuming you added that to the
    uucp group in the /etc/group file, as described earlier). If you prefer, you can
    simply run the br command as root user.


    This command simply turns on the X10 device at C1:


    ```

    $ br C1 ON

    ```


    This turns off C1:


    ```

    $ br C1 OFF

    ```


    You can identify a particular house code (-c), and then turn several units (-n)
    or off (-f) on the same command line. The following example turns on the device
    at C1 and turns off the device at C2:


    ```

    $ br -c -n 1 -f 2

    ```


    You can turn on or off a bunch of devices at once by separating unit numbers by
    commas. For example, to turn on C1, C2, and C3 and turn off C4 and C5, type the
    following:


    ```

    $ br -c -n 1,2,3 -f 4,5

    ```


    You can also turn all lights on for a particular house code. The following commands
    turn all lights on for code C, and then turn all lights off.


    ```

    $ br C LAMPS_ON

    $ br C LAMPS_OFF

    ```


    There are few different ways to dim lights. You can dim and brighten a light by
    assigning a number to it from -12 to 12. The first command in the following list
    turns the light at C1. The next command dims the previous light (c1) four notches
    (-d 4). The command that brightens the two lights not (-d 2):


    ```

    $ br C1 ON

    $ br -c C -d 4

    $ br -c C -d 2

    ```


    You can also use BR and DIM options to increase or decrease light on the unit
    that was most recently turned on or off. The first command that follows turns
    on the light on unit C1.


    ```

    $ br C1 ON

    $ br C DIM

    ```


    If the br command is working as described, you can create scripts that you can
    use to set off a sequence of br commands immediately or at set times, using the
    cron facility.


