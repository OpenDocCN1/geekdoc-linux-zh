  md: 'Analog television output — Analog TV/RF output directly to a TV is probably
    the least desirable, simplest easiest to implement if you have an older TV without
    SVideo, RGB, or digital video inputs. For this type of setup, you need a TV tuner
    that features the TV-output RF/F connector (like cable on your VCR). This is not
    desirable because you''re taking the signal from baseband analog, back up to RF,
    which picks up more signal noise (signal degradation and lack of fidelity) along
    the way. If your display technology limits you to this option, you will need to
    use a cable that has this TV-output, such as the Haueppage PVR-350, the most popular
    card for this type of setup.


    Analog SVideo output — Analog SVideo output directly to a TV/monitor with SVideo
    cables is the best way to get a great display out of an all-analog setup, or TV/monitor
    must have this SVideo input option. For this type of output, you must have a motherboard
    with an embedded GeForce/NVIDIA chip, or a GeForce-based video card with the SVideo
    output connector. This is a nice configuration because MyThumbs''s video signal
    conditioning features (such as interlacing and smoother flickering) can be offloaded
    from your machine''s main processor to the NVIDIA chip to handle. This gives you
    a better display at the maximum resolution you set handle, plus additional signal
    enhancing effects handled by the special chips on the graphics card. If your TV/monitor
    does not have an SVideo input, you can also use the composite output of your GeForce
    card, with noticeable signal quality compared to SVideo out.


    Analog RGB/SVGA output — Either 15-pin or discrete BNC output directly into a
    high-resolution TV/monitor or LCD/DLP projector is an even better all-analog option
    (technically, RGB is actually an analog signal). Although many readers probably
    have a TV-sized RGB display, if you do have no display options (such as DVI or
    HDMI) this is your best option of setup.


    Using RGB is as good as analog, as you are staying as close to the original signal
    as possible with analog; plus you can still get all the NVIDIA chip special features,
    and the additional bandwidth capacity of the RGB signal format. This configuration
    is especially nice if you have a large-screen LCD or DLP projector. Some theater-ready
    projectors can display HDTV, also FireWire and DVI is being the predominant way
    to get HDTV on projectors and other HD devices.


    Be careful about running RGB colors from 6 to 10 feet as signal induction, and
    ghosting can occur. For required long-distance hooks (such as cable up to a ceiling-mounted
    projector), there are after-market RGB long haul amplifiers as well as wireless
    transmitters. Just be aware that these amplifiers add a stage into your content''s
    path and as such will introduce some signal quality loss.


    Digital DVI or HDMI — Digital DVI or HDMI to TV/monitor is probably the most common
    way to get your digital. While some high-end HDTV plasma and projection sets have
    DVI, newer sets with HDMI inputs (with the signal being backward-compatible with
    DVI if you use an adapter).'
