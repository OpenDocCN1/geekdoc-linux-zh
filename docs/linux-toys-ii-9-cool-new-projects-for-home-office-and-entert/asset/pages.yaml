  md: '# Chapter 6 — Customizing a Live Linux Drive 169


    # Browse your files


    At this point, the mounted partition is part of your Damn Linux file system. You
    can use the shell, a file manager, or any application to access files from your
    mounted partitions.


    DSL comes with the Emelfim file manager. Open it icon on your desktop. In DSL,
    storage devices are mounted under the /mnt file system. So enter /mnt into the
    location box, and then click to enter the directory containing your mounted disk
    partition (sda1, hda2, and so on). Open a directory on the other side of the Emelfim
    file manager to copy files from one directory to the other.


    # Accessing the Network


    If you have an Ethernet card that is plugged into a high-speed Internet connection
    or a LAN switch that has a DHCP server on the line, you might have immediate access
    to the Internet when you boot DSL. DSL looks for a DHCP server when it boots and
    configures your network interface if it finds one.


    DSL starts with the Dillo web browser on screen. To check if your network is working,
    just type a Web address into the location box or click a link to the DSL site
    to make sure you can access the Internet.


    However, if you do not network access, there are a few ways to set up an Internet
    connection from DSL. Start by right-clicking the desktop to show the DSL menu.
    Then select System -> Setup and choose from the following:


    +   **Wired Ethernet card (netcardfig)** — If DHCP did not get your network interface
    up when you started DSL, you manually configure your Ethernet card. You will need
    to choose an IP address, mask, broadcast address, default gateway, and DNS server.
    If you do not know this information, you should be able to get it from your Internet
    service provider (ISP) or network administrator.


    +   **Dial-up PPP** — Use this selection to create a Point-to-Point Protocol connection
    to your ISP over phone lines. To do this, you will have a supported modem, the
    telephone number of your ISP, DNS servers used, the type of authentication (PAP,
    CHAP, and so on), and your username and password needed to complete your dial-up
    connection to the ISP. To dial the ISP, use the provider name you entered into
    the PPP box and Dial.


    +   **DSL/PPPoe (ifconfig, iwconfig, ndiswrapper, or prism2)** — Because wireless
    networking cards that are native to Linux are not as easily available as they
    are for wired cards, DSL offers several ways to configure your networking cards.
    For wireless cards that were detected and had a Linux driver available, iwconfig
    lets you identify that interface and add information needed to use that card (such
    as its device name, channel number, as well as SID and WEP identifiers).'
