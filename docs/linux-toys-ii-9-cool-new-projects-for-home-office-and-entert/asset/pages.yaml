  md: '# 360 Part V — Appendices


    # Installing Fedora on a Laptop


    Because laptops can contain non-standard equipment, before you begin installing
    a laptop you should find out other people''s experiences installing Linux on your
    model. Do that by visiting the Linux on Laptops site (www.linux-on-laptops.com).


    Most modern laptops contain bootable CD-ROM and/or DVD drives. If yours doesn''t,
    you probably need to install from a device connected to a USB or PCMIA slot on
    your laptop. PCMIA slots let you connect a variety of devices to your laptop using
    credit card-sized cards (sometimes called PC Cards). Linux supports hundreds of
    PCMIA devices. You can use your laptop''s PCMIA slot to install Fedora from several
    different types of PCMIA devices, including:


    +   * DVD drive

    * CD-ROM drive

    * LAN adapter


    If you would like to know which PCMIA devices are supported in Linux, see the
    SUPPORTED CARDS file (located in the /usr/share/doc/pcmia-cs* directory).


    # Beginning the Installation


    If you have properly prepared to install Fedora, you can click Back to make changes
    to earlier screens. Through-out of the procedure, once you go forward before being
    warned that packages are about to be written to hard disk, there''s no turning
    back. Most items that you can configure after Fedora Core is installed.


    If your computer contains any data that you want to keep, be sure to back it up
    now. Even if you have multiple partitions, and don''t expect to write over the
    partitions you want, a backup is a good precaution in case something should go
    wrong.


    +   1. Insert the DVD or first CD-ROM. This procedure assumes you are booting
    installation and installing from either the DVD or CD set that is available from
    the Fedora project sites or from books, as Red Hat Core and Enterprise Linux 4.

    2. Start your computer. If you see the Fedora Core installation screen, continue
    to the next step.


    If you don''t see installation, your DVD or CD-ROM drive may not be bootable.
    Creating a bootable floppy is no longer an option because the 2.6 kernel doesn''t
    fit on a floppy. However, you may have the choice of making your DVD or CD-ROM
    drive bootable or copying an image to a bootable USB device (such as a pen drive).
    Here''s: Restart the computer. Immediately, you should see a message telling you
    how to go into Setup, by pressing the F1, F2, or Del key. Enter setup and look
    for an option such as Boot Options or Boot from.'
