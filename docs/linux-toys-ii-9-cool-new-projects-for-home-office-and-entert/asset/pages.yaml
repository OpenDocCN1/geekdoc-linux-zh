  md: '# Chapter 8 — Setting Up a Game Server with BZFlag 235


    # Using Central Registration for BZFlag


    BZFlag now offers (as bzflag-2.0) a mechanism for centrally registering users.
    This service lets a user have a consistent identity on multiple BZFlag servers
    by keeping the same callsign and password. This same callsign can be used to identify
    you on BZFlag forums.


    The following procedure steps you through the registration of a user for BZFlag:


    +   1. Open the BZFlag forum page (http://my.BZFlag.org/bb).

    2. Click the Register button in the upper-left corner of the page. The Registration
    Agreement Terms page appears.

    3. Click to agree to the registration terms. The Registration Information page
    appears.

    4. Add at your Username (this is your callsign), email address (to receive confirmation
    of your registration), and password (twice). You can also add other publicly visible
    information (ICQ number, AIM address, Yahoo Messenger, and so on) and set preferences
    (HTML, notify of new messages, and the like). Then click Submit.

    5. In a few minutes, check your email. A message welcoming you to BZFlag forums
    should arrive. Visit the link in that message to activate your account.


    The next time you join a BZFlag game (as described earlier in this chapter), enter
    your user name (callsign) and password. You will see the Global Login Approved!
    when you connect to the gaming server. You may be asked again to identify yourself
    to the server. If so, type `/identify password` (using your password of course).


    Besides using your callsign to play BZFlag, you can also use it to identify yourself
    to BZFlag forums. Without a valid callsign, you can read forum messages, but you
    can''t post any messages yourself.


    # Summary


    Setting up a gaming server can be a fun way to play with your friends or family
    in your home, school, or other organization. The BZFlag game described in this
    chapter is easy to set up, but offers fun and challenging game play, as as many
    features for a server administrator (that''s you) to tailor the game in different
    ways. While this Linux toy is meant to be used on a private LAN, BZFlag can be
    configured as a public network gaming server, as well as a private one.'
