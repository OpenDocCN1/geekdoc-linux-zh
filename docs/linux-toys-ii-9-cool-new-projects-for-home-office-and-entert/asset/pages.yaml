    # Setting up Playlists


    The IceS2 source client can stream Ogg Vorbis audio to an Icecast server from
    a playlist or live audio input. For example, I''m using IceS2 to stream audio
    from a playlist of prerecorded music.


    If metadata was included with a song in Ogg Vorbis, information that will be transmitted
    with the audio file as well. That way, the audio player connects to your Icecast
    server can display the artist and song as it is playing.


    From IceS2 source client, the playlist can be a simple list of files that represents
    your songs or speech files. These songs can be copied using the vorbis-tools (which
    is part of the vorbis-tools package that includes ogg123, eggginfo, and other
    Ogg Vorbis tools) and cdparanoia.


    ![](img/1b8a24a162893627b8005ac678b79236_302_1.png)


    The original Linux Toys includes a jukebox project that rips, compresses, and
    stores from music CDs in Ogg Vorbis format. Besides sorting songs into directories
    by artist and album, the stored songs include metadata identifying the song title,
    artist, and album. Using that project, you could create files for streaming with
    Ice2.


    If you are interested in viewing the metadata included in an Ogg Vorbis audio
    file, you can use the vorbiscomment utility that comes with the vorbis-tools package.
    Here''s an example:


    ```

    # vorbiscomment -l "01-My_Song.ogg"

    TITLE=My Music Song

    ARTIST=Chris Negus

    TRACKNUMBER=1

    TRACKTOTAL=18

    ALBUM=Greatest Open Source Hits

    GENRE=Classical

    ```


    Using the vorbiscomment utility, you can also append or modify comments in an
    Ogg Vorbis audio file. To find out other information about an Ogg Vorbis file,
    such as its bitrate and play-back time, you can use the ogginfo command.


