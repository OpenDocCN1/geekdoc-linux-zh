  md: '# Chapter 4 — Creating a Personal Video Recorder with MythTV 73


    This chapter provides an overview of the specialized Fedora install that you will
    need to perform for MythTV.


    If you are not familiar with the Fedora Core installer or comfortable manually
    creating and tweaking partitions like the like, please refer to Appendix C for
    details on general Fedora Core installs. After you''re familiar with the Fedora
    install, the general partition, and packing GUI look and feel, feel free to come
    back to this section for the quick OS install requirements for the upcoming MythTV
    packages and drivers.


    # About Your Disks and Partition Layout


    I assume you want to store your TV shows, videos, and family albums locally on
    the base you are building. Given that, you system will be rock solid and the data
    secure, also remain flexible and allow for future system growth.


    To meet both of these demands if you should, use two hard drives in a software
    RAID-1 mirror (for the redundancy and stability) and then on top of that run a
    growable Logical Volume (LVM2) file system. If this seems daunting, don''t sweat
    it. Fedora Core includes built-in support for both LVM2 and software RAID.


    > Note Software RAID-1, or mirroring, will ensure that if one drive fails you
    dont lose all of your home videos or photos. In the event of a drive failure,
    it emails you that there are problems. A logical volume "device" on top of your
    system RAID mirror partition adds the ability to grow your video content file
    system by simply adding more drives in the future and merging them with your existing
    video partition.


    The following partition directions allow either a single drive with logical volume
    setup or a dual drive with software RAID-1+LV configuration. If you are going
    to use only one drive plus LV, on that drive you will set up four partitions,
    the last of which will be an LVM-type partition. If you choose the dual drive
    RAID-1 plus LV setup, you will need two identical drives, each having a total
    of four partitions, mirroring each partition between them, and later setting up
    the logical volume manually after the first boot.


    > Caution If you''re not comfortable with modifying partitions, partition types,
    and generally getting under the hood in Linux, this may be a little advanced.
    Because you''re starting with seemingly blank drives, there''s no harm playing
    around and getting the hang of the partition customization, but be sure that you
    have it right before continuing on past this section.


    When you start your Fedora install (not yet), the file systems of /boot/ and 12GB,
    will be partitioned for you. You will also set a swap partition, which is typically
    between one-half to two times the amount of RAM on your computer (e.g., 512MB
    swap to 2GB RAM in my case). The last partition, named /video (where MythTV keeps
    its large file content), will take up the rest of the drive and is formatted as
    a ReiserFS file system, per the upcoming custom install directions.'
