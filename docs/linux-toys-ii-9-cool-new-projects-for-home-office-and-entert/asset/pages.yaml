  md: '# Chapter 4 — Creating a Personal Video Recorder with MyTV 71


    # Assembly Tips


    Here are a few details to watch for when assembling your system:


    +   - Cooling in your system is absolutely critical. Be sure not to cover any
    vent holes on your drives with the case metal (your drive should have “do not
    cover” indicators if it is important). Also, on the remarked Silverstone case,
    all the air pulled into the system comes from the bottom and front intake vents
    and center parts of the case, and is ejected at the side (next to the CPU fan)
    and rear power supply). Be sure that these areas are open and the case is not
    “boxed” in or your PVR can become a small oven that will cool itself and any surrounding
    electronics.


    ![](img/1b8a24a162893627b8005ac678b79236_95_0.png)


    The most critical cooling component of your system is your CPU heat sink/fan assembly.
    In particular, the interface between your CPU and heat sink is the most critical,
    fine-adjustments that you can make.


    Many stock CPU heat sinks (even some of the expensive/pretty ones) do not have
    a mirror-smooth finish. This is critical for an efficient CPU to have heat conduction
    and cooling. This is even more critical in a PVR because you''re trying to do
    more with less (more with fan rotations and noise).


    To get the absolute performance out of your heat sink/CPU cooling system, clean
    and home, or lap your heat sink (where the CPU touches) to a mirror finish using
    progressively finer and finer grains of abrasives until you can see your reflection
    in it. Make sure you cannot see any patterned grooves, scratches, or “lines.”
    Then you can go back and apply a little heat sink compound, install the heat sink/fan
    assembly, resulting in a PVR temperature that is 10-20° (F) colder than before.
    For tips on CPU heat sinking, see this overclocking site: http://overclocksclub.com/guides/hotsinkingguide.php.


    +   - Don''t crim SATA cables. If using SATA, be sure not to crimp the SATA cables.
    Doing so can cause I/O errors and endless loops. If you do tie them or loosely
    bend them thinner than the diameter of a pencil. Going much further will cause
    problems.


    +   - Adjust fan controls. Take advantage of BIOS/motherboard auto fan control
    settings and use low temperature activation thresholds (around 104°) but hotter
    than 120°. You will also have to configure these if you enable the link i2c and
    lm_sensor kernel modules (as mentioned later in the chapter). Experiment with
    the 2.6 kernel''s /sys/bus/i2c/devices/...pwm settings to explore the best speed
    parameters for your i2c controlled fans.


    +   - Separate cables. When routing your external power, and audio cables, be
    sure that you don''t run all in parallel or tie them all together. Running highly
    dynamic, copper cables alongside power cables can introduce humming and noise.
    Although this is less of a problem with digital links (and moot with optical links),
    you should still keep your “big voltage,” “analog little voltage,” and “digital
    signals” (USB cables, VGA, mice, keyboards, Ethernet, and so on) physically separate
    as much as possible.'
