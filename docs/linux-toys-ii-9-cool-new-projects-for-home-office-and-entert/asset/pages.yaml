  md: '# Chapter 3 — Creating a Web Photo Gallery 43


    +   - Album Directory — Type in the directory where you will store your photo
    albums. If you don''t have owner, you might set this directory to /var/www/html/albums.
    If you don''t have root privilege on the computer, a common place to put your
    albums is in the gallery directory for your home directory: /home/chris/public_html/gallery/albums.
    (The latter is how I had created directory in the chapter.)


    +   - Temporary Directory — Type the name of the temporary directory. Often the
    /tmp directory is used. However, if the open_baseddir is set in /etc/php.ini file,
    limiting the area in which Gallery is able to write to the file system, you will
    have to assign the temporary to a file system follow the open_baseddir directory.
    Also, whatever temporary directory you choose must be writable by the apache user.


    +   - Gallery URL — The address of the Gallery software. For example, with Gallery
    installed in the home directory for the user named chris, in the directory /home/chris/public_html/gallery,
    the Gallery URL would be http://localhost/ If Gallery were in /var/www/html/gallery,
    the Gallery URL would be http://localhost/gallery.


    +   - Albums URL — The address of your Gallery albums. For example, if the albums
    were /home/chris/public_html/gallery/albums, the Albums URL would be http://localhost/~chris/gallery/albums.


    # Email and Registration Tab


    This set of options has to do with using email with Gallery. To use any of the
    options, you must first set the Enable email option to yes on the Email and Registration
    tab. Before turning this feature on, however, I recommend you refer to the "Managing
    Gallery Users" section. This will help you decide which level of user interaction
    you want to allow on your gallery.


    If you do set the Enable email option to yes, you can then use the following options
    with Gallery:


    +   - Admin email address — Enter an address to which users can email questions
    and concerns. That address can also be used to automatically alert you of activities
    from the users of your gallery.


    +   - Sender email address — Enter an address that Gallery will use as its return
    address when sent out. This can be the same as the Admin email address.


    Again, the other settings on this tab let you to do things as allow users to register
    their own albums, have the administrator monitor changes users make to the albums,
    and identify how Gallery interacts with the mail server. You can also create a
    Welcome message that will be sent to new users (who) can add placeholders that
    will read in information such as the Gallery name, admin email address, and the
    user''s name and password.'
