    are graphical tools for managing many of these files, you will surely find needing
    to change a configuration file at some point. To do that, you will need to use
    a text editor.


    There is no shortage of text editors available with Linux. If you are using a
    graphical editor with your Linux system, there are some very easy-to-use text
    editors that you let move using a mouse and menus (such as gedit). Nano-based
    editors that provide menus from a shell (no GUI required) include the joe editor.
    Damn Linux includes a graphical text editor named beaver (right-click the desktop
    and select Apps → Editors → Beaver or type beaver). Old-school Linux and UNIX
    users tend to use vi or emacs editors.


