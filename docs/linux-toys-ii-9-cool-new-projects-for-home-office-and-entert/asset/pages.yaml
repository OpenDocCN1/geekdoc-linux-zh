  md: '# Introduction


    # How This Book Is Organized


    There are five parts to this book. Part I has introductory material. Parts II,
    III, and IV contain the actual projects. The appendices contain information on
    getting and installing software, as well as a few basics on using Linux (in particular,
    Fedora Core or Red Hat Enterprise Linux). Here''s a larger description of these
    sections.


    # Part I: The Basics


    Chapter 1 lays out the approach to the Linux Toys II projects. Chapter 2 goes
    into detail about finding hardware and software.


    # Part II: Multimedia Projects


    Chapters in this part contain sound, video, and digital image projects. Chapter
    3 describes how to set up a Gallery, a Web-based server for sharing digital images
    over a network. Chapter 4 shows how to put together the hardware and software
    to make a MythTV personal video recorder that''s suitable for your home entertainment
    unit. Chapter 5 shows how to use eMovix to turn your personal videos intoable
    movies. It then covers how to play a variety of multimedia content using MoviX.


    # Part III: Home Projects


    These chapters contain useful and personal home projects. Chapter 6 describes
    how to create a customized Linux distribution from Damn Linux that runs on a pen
    drive. Chapter 7 shows how to use Heyju and BottleRocket software to control lights
    and devices in your home using the X10 protocol. Chapter 8 describes how to set
    up a gaming server with the BZFlag tag battle game, which you can play in your
    home, small office, or even over the Internet. To protect your home or small office
    computer network, Chapter 9 describes how to build and configure a custom firewall
    using Devil-Linux.


    # Part IV: Small Business Projects


    While intended as exercises as real business opportunities, the projects in this
    section help you configure a couple of server types. Chapter 10 describes how
    to set up an Icecast server so you can create your own streaming station on the
    Internet or other network. Chapter 11 tells how to use the Linux Terminal Server
    to fill a home, school, or small business with fully functional client computers
    for a fraction of the cost of complete workstations.


    # Appendices


    The appendices contain supporting information for the rest of the book. Appendix
    A describes the Linux Toys II CD that is included with the book. Appendix B describes
    some of the basic skills you need to use this book. Appendix C walks you through
    installing Linux (using Red Hat Fedora Core or Enterprise Linux as examples).'
