  md: '# 344 Part V — Appendixices


    # Administering Linux


    Whole books are written on the subject of administering Linux systems. In a few
    paragraphs in this appendix, however, I want to point you toward a few important
    things you should know to get on the root path to administering your Linux system.


    # The root User Account


    Every Linux system has a root user account. The root user is the owner of most
    system configuration files and administrative applications. So, to do things as
    users, configure the network, start and stop services, and install software, you
    need access to the root user account.


    There are several ways to access your system as the root user:


    +   — Login — You can login with the root user name and password. Then, all commands
    run from the shell or the desktop as the root user.


    +   — Run graphical administration — When you run any graphical administration
    tool, you can launch it as a regular user. Before the window opens, you are prompted
    to enter the root password to access the window.


    +   — Use the su command — Using the su command from the shell, while you are
    logged in as a regular user, gives you root privilege from the shell. If use su
    to become the root user, type the:


    ```

    $ su

    Password: ********

    ```


    Enter the password, as requested, and your shell changes from a dollar sign to
    a pound sign (#). Note the default following the su command. This causes the root
    environment to start when you get root privilege. Without the default, you won''t
    have such things as /bin and /usr/sbin added to your path or any shell environment
    variables (from the /root/.bashrc file) added to your shell environment.


    You should run any administrative commands you choose at this point. When you
    are done, exit the root environment by typing exit. You will become the original
    user again.


    +   — Use sudo command — If you want users to have limited access to root privileges
    without giving away the root password, you can configure the sudo facility. Add
    a user to the wheel group (/etc/group) and uncomment one of the %wheel lines in
    the /etc/sudoers file to allow that full access to administrative command, while
    that is logged in as himself. Or, you can configure users to only have access
    permission to run particular administrative commands.


    Some bootable Linux systems, including Damn Linux, come with the /etc/sudoers
    file already configured to allow the default user name (such as knoppix or dsl)
    to run sudo on without entering a password. The presumption is that the system
    owner is running the bootable Linux system. So there is no restriction on what
    you can do, but to protect you from changing a system file by mistake, you explicitly
    have to ask for root permission using sudo.'
  merge: -1
  pgno: 368
