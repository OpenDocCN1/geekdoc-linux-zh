  md: "Each package can be a little different in how it wants to create and install\
    \ its components.\nTherefore, I recommend that you copy the expanded archive file\
    \ to a directory, then go to that directory and look for the INSTALL or README\
    \ file for specific instructions on how to proceed. If there are any specific\
    \ instructions you need for installing the project from a tarball, they will be\
    \ included in the chapter that describes that project.\n\nThe following is a general\
    \ procedure that you should run as root from a Terminal window to unzip and extract\
    \ the files for a particular project. In this example, the tarball is named `whatever.tar.gz`\
    \ and is located in the `sources/` directory on the CD.\n\n+   1. Insert the Linux\
    \ Toys II in your computer's CD drive.\n2. If the CD does not mount automatically\
    \ (which it should), mount it by typing something like the (your drive may have\
    \ a slightly different name):\n   # mount /media/cdrecoder\n3. Create a directory\
    \ where you want to put the source code and change it to:\n   # mkdir -/-LinuxToys\n\
    \   # cd -/-LinuxToys\n4. Unzip and extract the source code from the tarball as:\n\
    \   # tar xvf /media/cdrecoder/sources/whatever.tar.gz\n5. Change to the directory\
    \ created by the tar command and read through the INSTALL or README file for further\
    \ instructions:\n   # cd -/-LinuxToys/whatever\n   # less INSTALL\n\nTypical instructions\
    \ for compiling and installing from source code include .configure, make, and\
    \ make install. As I said, instructions vary from project to project. You will\
    \ be expected to have a compiler (gcc) and the make command (such as gmake) to\
    \ build the binaries you need from source code.\n\n# Installing SRPMs\n\nThe CD\
    \ includes the source code RPM (SRP) for each RPM package included with Linux\
    \ Toys II. You can install them using a standard rpm command (for example, rpm\
    \ -uhv whatever.src.rpm), instead of placing config files, and directories on\
    \ your system use, the rpm command places the source code in subdirectories of\
    \ the `/usr/src` directory. You can then modify the source code as you please\
    \ and rebuild a new RPM and/or SRP file with your changes using the `rpmbuild`\
    \ command.\n\nThere are a few ways to go about rebuilding SRPMs into binary RPM\
    \ packages. If you simply want to rebuild a binary package from the SRPM, without\
    \ changing any of the source code, you can do the following:\n\n```\n$ rpmbuild\
    \ --rebuild whatever-1.1.src.rpm\n```"
