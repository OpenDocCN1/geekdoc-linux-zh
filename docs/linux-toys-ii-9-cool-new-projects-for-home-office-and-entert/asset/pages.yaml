  md: '# 44 Part II — Multimedia Projects


    # Other Setup Sections


    I''ve skipped over several sections from the Gallery that are less critical for
    just getting your gallery up and running. Some of these settings are covered later
    in this chapter. There is a brief overview, however, of the tabs I have skipped
    over, to help you decide if you want to change any of those settings going forward:


    +   Toolkits/image processing — Gallery allows you to use several tools for converting
    and manipulating images. The settings on this tab identify which tools to use
    (if you have a choice) and where those tools are located. By default, ImageMagick
    is used for manipulating images, although you can also use NetPBM if both are
    missing. You can download NetPBM binaries from the Gallery Web.


    +   Embedded Gallery — If Gallery is embedded in a content management system (CMS)
    environment, you may need to add some additional options to get the CMS to work
    with Gallery, you can add those options on this tab.


    +   Main Gallery Page — The settings on this tab define the appearance of the
    main Gallery page. Refer to the “Changing Attributes” section later in this chapter
    for information on tuning these settings as you would like.


    +   Optional tools — Settings that define the tools that Gallery can use to manage
    a bunch of image files at once that are grouped in formats such as zip and rar,
    and are set on this tab. The tab also identifies the locations of some tools that
    can be used for working with JPEG files.


    +   Languages and locales — Gallery is delivered with support for 35 different
    languages. This tab lets you set the language to use by default (English is set
    initially). You can set displays of languages. You can also set date/time stamps
    to use.


    +   Gallery slideshow — Because the slideshow feature can be a big performance
    hit on your server, it is disabled by default. If you select either Ordered or
    Random for your Slideshow (instead of Off), slideshows of the albums will be available
    to visitors.


    +   Comments — You can allow visitors to comment on the images in your gallery,
    based on this tab. Comments can be allowed per photo, per album, or both. Many
    options are available to set who can make comments and who can view them. (See
    the section “Changing Attributes” later in this chapter for more information related
    to comments).


    +   Watermarking — If you want watermarks placed on your images, you can identify
    the directory that contains the watermarks (in PNG, TIFF, or GIF formats). The
    directory must be accessible by the apache user to have them applied to the images
    in your Gallery.


    +   Statistics — You may want to display information about each photo thumbnail,
    along with that thumbnail itself. Also, as you get a feel for the size and activity
    of your gallery, you might want to adjust settings related to caching. Those actions
    can be done from the Statistics tab.'
  merge: -1
