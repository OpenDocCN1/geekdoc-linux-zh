    Next you to check the services you need on an LTSP server are available.


    # Step 3: Configure Services for the Workstations


    The LTSP server must be provide several services to the LTSP thin clients. Those
    services include:


    +   DHCP — Using Dynamic Host Configuration Protocol (DHCP), the server can pass
    information to the client that it needs to begin its boot procedure. This can
    include its IP address, DNS servers, gateways, and other information.


    +   TFTP — The Trivial File Transfer Protocol (TFTP) server is a simple file transfer
    server, used for primarily booting workstations (as you are doing so) that each
    client can copy the files from the server.


    +   NFS — With Network Files Systems (NFS) software, a server can make a directory
    (and its subdirectories) available to computers on the network. A client, with
    proper permissions, can mount that directory and access the files in that as they
    existed. Because LTSP clients have no disk at all, any files that are not stored
    in RAM are made using NFS from the server.


    +   XDMCP — The Display Manager Protocol (XDMCP) is a protocol to implement graphical
    login displays. It has been implemented in most popular X Window System managers
    (such as XDM, GDM, and KDM) to handle how the clients'' graphical displays are
    launched and how the initial graphical login screen appears and acts.


    The following steps check your Linux or UNIX system for the services just listed,
    as well as the existence of needed configuration files (such as hosts and exports
    files). If there services missing, the procedure will help you get them installed
    and running.


    ![](img/1b8a24a162893627b8005ac678b79236_322_0.png)


    I started with a fairly complete install of Fedora Core 4 on my LTSP server. I
    have everything LTSP to get started. Consider adding the software packages shown
    in the preceding list from your Linux distribution, as they already have been
    tested to work with your distribution. Components needed by XDMCP come in the
    x11-xorgs packages, which you help you get with most GNOME and KDE installs.'
