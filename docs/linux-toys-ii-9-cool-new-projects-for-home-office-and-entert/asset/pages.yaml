    fail a red "Serious Warning" or "Warning" box. A "Serious Warning" needs to be

    corrected, while a "Warning" might require a fix in certain situations or may
    not be a problem

    at all (I talk about specific cases later).


    The system check performs the following items:


    +   - **Gallery version** Checks the version of Gallery you are using. A link
