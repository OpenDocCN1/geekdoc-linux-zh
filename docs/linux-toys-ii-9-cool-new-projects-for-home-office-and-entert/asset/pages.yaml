  md: '# 182 Part III — Home Projects


    # CD Boot to Pen Drive


    Same as with the floppy USB boot, but you can start the boot process from a DSL
    CD (such as the Linux II CD). You can tell the CD to continue from the USB pen
    drive by typing `dsl from=/dev/sda1` from the boot prompt (assuming the pen drive
    is on your first SCSI device). (The prompt may be able to skip the pen drive because
    the DSL CD looks for and find other DSL distributions on a pen drive that''s inserted.)


    # Embedded Pen Drive Boot within Windows or Linux


    If you did intend install of DSL to your pen drive, you can boot DSL directly
    from Windows or Linux while those systems are running. While you will take a hit
    running DSL inside of Windows or Linux, it’s a good way to get your email or get
    on the Web from a computer without rebooting.


    To try out, start up any Windows or Linux system. Then do the following:


    +   1. Insert your pen drive with the embedded DSL install into a USB port. In
    Windows and Linux desktops, an icon will appear on the desktop or in the My Computer
    folder.


    +   2. Open the icon representing your pen drive. You should see a folder displaying
    the top-level directory of that drive.


    +   3. To start DSL that it appears in the desktop, launch one of the following
    commands, depending on whether you are currently in Windows or Linux. For Windows,
    launch the following:


    `dsl-windows.bat`


    If you are in Linux, launch the following:


    `dsl-linux.sh`


    As by magic, a QEMU window will open on the desktop and a DSL desktop will boot
    up in that window. Click in that window to use it as you would any DSL desktop
    system. Press the Ctrl+Alt keys to return mouse control outside of that window.
    When you shut down DSL as you would normally when done. Close the QEMU window.


    Although the embedded DSL pen install I described cannot boot up directly, using
    a DSL boot CD, you can use your embedded DSL pen drive. With the pen drive inserted,
    you can type the following from the DSL boot prompt:


    ```

    boot: dsl from=/dev/sda1 qemu frugal

    ```


    # Booting DSL from RAM


    When normally boots, you must keep your CD or pen drive inserted during its entire
    operation. That’s because of the DSL system is mounted and accessed directly from
    the original medium. This allows DSL to run on computers with very little RAM
    (as little as 32MB).


    If you have lots of RAM available, however, you can have all of DSL loaded into
    RAM and run from there. Not only will this give you a performance boost, but you
    can also remove'
