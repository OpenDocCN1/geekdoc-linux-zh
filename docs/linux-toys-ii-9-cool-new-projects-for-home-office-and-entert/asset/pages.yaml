  md: '# Chapter 10 — Running an Internet Radio Station with Icecast 269


    If you are using your Internet radio station to support a cause or promote a band,
    you can add a URL to your Icecast station on your own Web page. You can provide
    your own images and text, then offer links that play a live stream or select from
    static files or playlists. You can also list your radio station with public Icecast
    directory sites called Icecast Stream Directories.


    At that point, it''s up to clients of your Internet radio station to use an audio
    player that supports Icecast to connect to the URL (something like http://hostname:8000/newradio.ogg)
    to play the audio stream. Most Linux systems with different clients are capable
    of playing Icecast streams, Rhythmbox, XMMS, and ogg.123. Winamp is a Windows
    audio player that can play Icecast streams.


    This project takes you through the process of configuring an Internet radio station
    based on the Icecast server. I recommend (and describe) several different tools
    for delivering the audio source to the Icecast server and playing it back from
    a client.


    > I was fortunate to have Michael Smith, one of the key developers of Icecast,
    Ice2, vorbis-torbis and other Xiph.Org projects, review this chapter for technical
    accuracy. His perspective on how the different components fit together and which
    need special descriptions has greatly improved the chapter.


    # Overview of Internet Radio Station Setup


    To help you create and play your Internet radio station, I''ve divided the Internet
    radio station into five major components. The text in this chapter follows the
    audio content from its source to the final playback by someone listening to the
    stream (although this is generally how various streams run from one end to the
    other, you''ll need to configure the stream in a somewhat different order):


    +   Audio source — With the tools described in this project, you can take your
    audio source from a playlist of files (containing Ogg Vorbis or MP3 audio files)
    or audio stream from your sound card (line in, microphone, and so on), or another
    audio stream that is streamed from elsewhere. In Linux, you can also use ALSA
    or OSS sound systems.


    +   Source client — The audio stream is taken by the source client, which then
    forwards it to the Icecast server. There are several good choices for source clients.
    The Icast (with Icecast) relies on a simple configuration file for setting up
    where it gets and directs the audio stream. MuSE (Multiple Streaming Engine) provides
    an intuitive graphical interface for configuring Ogg Vorbis or MP3 streams that
    can connect specifically to Icecast servers. There are also Windows clients you
    can use to direct an audio stream to Icecast, including the Oddcast plug-in for
    Winamp.'
