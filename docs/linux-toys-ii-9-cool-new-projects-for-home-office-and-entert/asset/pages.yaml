  md: '# Chapter 7 — Automating Home Lights and Gadgets with X10 187


    In Figure 7-1, two different Linux applications are illustrated for controlling
    X10 devices. BottleRocket software can communicate with an X10 Firecracker device
    — a little dongle that connects to your serial port and RF to send X10 signals
    to a transceiver. Heyu software talks to ActiveHome hardware that connects to
    a serial port, plugs directly into an electrical outlet to send X10 signals.


    Once X10 signals are sent to your power lines, they can control a variety of modules.
    You can plug lamps or appliances into external modules that are plugged into your
    outsets. Or you can get modules that are wired directly into your lights or appliances,
    so they are hidden behind the walls.


    To improve signal, you can use X10 amplifiers and receivers. Often, these devices
    are connected to 220-volt power outlets, to control signals across multiple 110-volt
    power sources in a house. However, there are signal boosters that can be hard-wired
    into your house.


    X10 protocol supports one-way and two-way communication. However, not hardware
    for transmitting X10 signals can also receive feedback from X10 modules (and not
    all X10 modules are two-way). But regardless of whether you are using one-way
    or two-way transmitters, you can use lamp and applique modules to turn devices
    on and off.


