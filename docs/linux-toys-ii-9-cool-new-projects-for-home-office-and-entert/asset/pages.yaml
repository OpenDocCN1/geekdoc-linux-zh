  md: '# 286 Part IV — Small Business Projects


    Adding Your Radio Station to a Web Site

    How you add your radio station to a Web Site, once it is up and running, is entirely
    up to you. To make it accessible to visitors to your personal or business Web
    site, simply add a link to the radio station''s URL (such as http://example.com:8000/mymusic.ogg).
    Once your visitors select the link, the player that is configured for their browser
    to play Ogg Vorbis will open and begin playing your streaming audio.


    # Step 5: Listening to Your Internet Station


    To your playing radio station, you need an application that can play Icecast audio
    streams from a Web address (URL). Don''t worry. There are a lot of them available.
    Given the IceS2 and Muse source client examples shown above, the URLs you would
    enter to listen to Icecast streams from these clients could like:


    ```

    http://linuxxtoys.net:8000/playlist.ogg

    http://10.0.3:8000/live.ogg

    ```


    Here are a few of audio players that are available to Icecast broadcasts:


    +   - Rhythmbox (http://rhythmbox.org)—Launch from a menu or by typing rhythmbox.
    From the toolbar, select Music -> New Internet Radio Station. In the URL to the
    radio station for it to start playing.


    +   - MMS (www.xmms.org)—Launch from a menu or by typing xmms. Right-click on
    the player and select Location Place. Use the URL to the radio station for it
    to start playing.


    +   - ogg123 (www.xiph.org/ogg/vorbis)—For this command line Ogg Vorbis player,
    simply type the command name with the radio station ogg123 http://host:8000/live.ogg)
    to begin playing.


    +   - Winamp (www.winamp.com)—From this popular Windows audio player, File ->
    Play URL. Type the type in the URL to the radio station for it to start playing.


    # Administering Your Radio Station


    Once your radio station is up and running, there is a lot you can do to check
    it and make sure it is running smoothly. Here are a few ideas:


    +   - Check status—The Icecast Status Page can be displayed from any Web browser
    by typing the IP address and port (for example, http://localhost:8000). The status
    page shows the name of the current stream, the stream title, and description.
    You can also see information about how many listeners are listening the stream
    at the moment, the quality of the recording, and the song that is currently playing.
    Click the Click to Listen link to hear the stream. Click the Reload button on
    your browser to update the current song and number of listeners.'
