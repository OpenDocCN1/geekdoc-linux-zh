    # Administering Gallery


    Although initial configuration of your gallery can be pretty simple, there are
    a lot of ways you change your gallery setup to modify the look of your gallery
    and configure what others can do to it. The following sequences describe features
    that you can do as administrator (admin login) to further configure a running
    gallery.


    # Adding Photos to Albums


    Using the default photo dialog box, you can type the file names and captions for
    up to five photos to be added to an album at a time. This explanation explains
    how to add more than five individual images at a time to an album.


    After you have selected the album you want to add images to, click the login button
    and log in as admin. Then, from the album actions box, select add photos. From
    the Add Photos pop-up window, there are few ways to add photos to your album:


    +   Increase Form — You can increase the number of photos you can upload to Gallery
    on the Form of the Add Photos window from 5 to 10, so you can upload up to 10
    photos and captions at a time from your local hard disk.


    +   Zip files — Instead of entering a zip file into the Tab, you can enter the
    name of a zip file on your local hard disk. Gallery will expand the contents of
    that zip file into individual image files. To create a zip file on most Linux
    systems, you could use the zip command. For example, to zip all JPEG images (assuming
    they are ended in jpg) from the current directory to a file called myzip.zip,
    you could type the following:


    ```

    $ zip myzip *.jpg

    ```


    +   Web address — Click the URL from the Add Photos pop-up window and type the
    address of an image file or zip file (containing images) to the location box.


    +   Local directory — Click the URL from the Add Photos pop-up window and type
    a local directory name on the server. A list of image files contained in that
    directory appears. You can check the images you want in list and click Add Files
    to install the selected images in the current album.


    +   Slurp Web page — Slurp all images located on a selected Web page. Just add
    a URL to a Web page, and select from the images on that page to load them on the
    server.


    Besides identifying the image (or images) you want to load, you can also identify
    files of metadata to download along with your images. That metadata can contain
    such information as captions, keywords, and other relevant data for the images.'
