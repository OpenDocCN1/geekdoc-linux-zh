    # Maintaining and Troubleshooting Gallery


    Any server that is exposed to the Internet requires some watching and occasional
    maintenance. A Gallery photo server is no exception. The following section describes
    some administrative tasks for your Gallery server that might be helpful to you.


    # Forget Your Admin Password?


    If you forget your admin password, you can add a blank file named resetadmin to
    your gallery/setup directory. Go to the login page, refresh it, and you will be
    able to get in again.


    If you are not able to change configuration, run the following command from your
    gallery/directory:


    ```

    $ ./configure.sh

    ```


    Now go to your browser and request setup under the gallery directory to run the
    configuration wizard again. For example, http://localhost/chris/gallery/setup/index.php
    will open the Gallery Configuration Wizard which the examples shown in this chapter.


    # Performance and Debugging


    The Gallery Configuration Wizard screen (presented in Step 2 of the "Checking
    and Configuring Gallery" section) has a Technical tab with several settings that
    can help you debug and tune your Gallery server. If you are having problems with
    your Gallery server, set the Debug mode to "High (former Debug on)" instead of
    "Debug for a while. Be sure to turn it off when you have figured out the problem
    debugging can be a strain on system performance if it is on a live system.


    To tune your Gallery server, you can try any of the other options in Step 2 of
    the Gallery Configuration Wizard. You can set the time limit to something other
    than 30 seconds (the default) if operations are timing out without enough time
    to complete. You can turn on the Use Syslog option to report user login, logout,
    and errors using the Linux syslog facility. There are also options for caching
    data.'
  merge: -1
