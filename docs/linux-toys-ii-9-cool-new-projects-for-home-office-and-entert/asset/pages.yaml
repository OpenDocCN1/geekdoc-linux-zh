  md: '# Understanding Partitions in Damn Small Linux


    When DSL boots up, it looks to see what storage media drives (hard disks, CD,
    floppy, DVD, pen drive, and so) are connected to your computer. It then looks
    to see what file systems are available on separate areas of the disk (called partitions).
    An entry for each partition is added to the /etc/fstab file. Here''s an example
    of /etc/fstab file:


    ```

    # Added by KNOPPIX

    /dev/sda1 /mnt/sda ext2 noauto,users, exec 0 0


    # Added by KNOPPIX

    /dev/hda1 /mnt/hda1 ntfs noauto,users,exec,ro,uid=1001,gid=50 0 0


    # Added by KNOPPIX

    /dev/hda2 /mnt/hda2 vfat noauto,users,exec,mask=000,uid=1001,gid=50 0


    # Added by KNOPPIX

    /dev/hda3 /mnt/hda3 ext3 noauto,users,exec 0 0

    ```


    /etc/fstab file from a system running Damn Small Linux where the hard drive was
    configured to boot both Windows and Linux. For clarity, I''m not showing lines
    from this file that do not apply to this discussion.


    The lines in this example were all added after being detected by DSL (noted by
    the Added KNOPPIX comments). The first entry (/dev/sda1) and /dev/hda2) are NTFS
    and VFAT partitions, respectively, that were created by the Windows system. The
    last partition (/dev/hda3) is a Linux ext3 file system where I have Fedora Linux
    installed. For each entry, the device name (/dev/sda) is followed by the point
    in the file system where the partition is mounted (/mnt/sda).


    To make any of the partitions just accessible, you can use the mount command (as
    root user). Most of the information needed to mount each partition is already
    in the /etc/fstab file, the mount command can be quite simple. For example, to
    mount the Linux partition, I use the mount command followed by the device name
    or mount point, as follows:


    ```

    $ sudo mount /mnt/hda3

    ```


    +   - For the partitions of being able to read and write from Windows or Linux
    partitions from DSL, use VFAT and ext3 file system types, respectively, when you
    first install those systems. Some people create a large, separate VFAT partition
    on computers that can be booted to different operating systems, to get the greatest
    flexibility in sharing data.'
