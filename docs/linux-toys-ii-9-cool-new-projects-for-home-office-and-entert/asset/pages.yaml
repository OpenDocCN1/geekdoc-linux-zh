    # Step 2: Setting Up Audio Input or Playlists


    With Icecast up and ready to stream audio to the Internet, you are ready to configure
    the computer that will provide source content to the Icecast server. The computer
    you use to do this can be:


    +   - An Icecast—You can install the Ice2 or Muse source client on the Icecast
    server and provide both the audio source and Internet stream from the same computer.


    +   - A Desktop system—If your sound card, microphone, or music files are on your
    home computer and is on a server in Texas, you can configure your Desktop system
    to stream your audio content to the Icecast server before broadcast.


    Icecast doesn''t care if the content you direct it to is on the same computer,
    a remote Linux system, or a remote Windows system. Regardless of which system
    you use, however, there are some steps to prepare your streaming audio content.


    # Configuring the Sound Card


    The source clients I describe later stream audio input from your sound card through
    either OSS or ALSA systems in Linux. A PCI audio card should be detected and configured
    when you boot your computer. Check what sound card has been detected for your
    computer, type:


    ```

    # lspci -vvv grep -i audio

    ```


    If your sound card doesn''t work, use the information from this output to check
    a forum or an Internet search to find out if there is a problem with audio in
    Linux. The ALSA project supports a sound card (www.alsa-project.org/alsa-doc)
    where you can search sound cards by parameters.


    If your audio card is working properly, you need to select which device you want
    to capture (mic, line, and so on) and turn the others. To change audio levels
    and the capture device for your sound card, use a mixer application such as auymixer
    or alsamixer. In auxmix, use the arrow to move the cursor to the device you want
    to capture from and press the space bar (so a red CAPTURE appears over the device'
