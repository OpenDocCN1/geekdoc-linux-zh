  md: '# Chapter 4 — Creating a Personal Video Recorder with MythTV 85


    # LVM Terminology 101


    A physical volume is just that: a single physical partition or disk (i.e., hardware)
    that you have marked as using by the LVM system. A physical volume, PV, gets cut
    into small chunks (called Physical Extents or PEs) at the time that it is assigned
    to a new or existing volume group (such as /dev/vg0).


    A volume group is just a logical abstraction of one or more physical volumes,
    so that you can refer to this group of PV/PE resources by a name for management
    purposes. For example, you could have one volume group dedicated to low-cost IDE
    drives, one for faster SCSI drives, and for higher-cost RAID arrays. The name
    that I''ve given my volume group in this section is vg0, and this is the name
    that allows me to reference the association of any logical volume to a specific
    set of volume group resources (/dev/md3 in my case).


    The volume group is also the level at which you control the size of the chunks
    your physical volume into. The default chunk, or PE size, is 4MB (from the command
    line), and I will be using 32MB chunks because I want to be able to grow file
    systems very large.


    Some or all of your PV/PE chunks get associated with a volume group, and then
    glued together, or allocated, from your volume group to form your logical volume
    or LV (for instance, /dev/videoLV), which is now like a partition that you can
    then format and mount. The difference between using a single drive versus your
    new logical volume is that "device" can have more PE chunks added to its parent
    volume group (from other drives in the system). PE chunks can then be allocated
    to your logical volume, which can now become larger than any single drive in the
    system!


    To grow your logical volume, you simply add a new drive to the system (even hot
    swap USB or FireWire), mark it as a physical volume, pull PV/PE chunks to the
    volume group, and finally allocate more (or all of them) to the mounted volume.
    That''s like making a partition larger without rebooting! You don''t have to fight
    storage flexibility on old-fashioned drives and partitions.


    After growing the LV, the only thing that remains to be done is growing the file
    system that resides on top of the LV to access the additional space. But ext3
    (using ex2tonline) and ReiserFS (using resize_reiserfs) support this feature on
    the fly without so much as a reboot or a file system resize. Very powerful indeed!


