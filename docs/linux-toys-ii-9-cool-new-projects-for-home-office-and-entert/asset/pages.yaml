  md: 'Using the recommended dual-drive RAID+LV configuration, be sure to set all
    of the "partition-type" settings to "Software RAID" (or type "fd" viewed from
    fdisk) on each disk, combining them into their respective RAID device (such as
    /dev/mdX) and only assigning the RAID devices their respective file systems and
    mounts. Otherwise, you''ll mess up your install and have to start over.


    Again, if you''re doing the two-drive RAID setup, setting up your RAID-1 arrays
    /dev/md0-3, but configuring only the first three at this time to have /boot, swap,
    and /. Later in the chapter, I step through making the last /dev/md3 into a logical
    volume and mount it at /viode.


    If you need to access hard disk partitions from a bootable Linux, such as Damn
    Small Linux, you should know that many of them (including DSL) cannot access hard
    disk partitions that are configured for LV andor RAID.


    ![](img/1b8a24a162893627b8005ac678b79236_100_0.png)


    # Starting Your Install


    When you start your install, you need to type linux reiserfs at the boot: prompt
    of the installer so that it will offer the ReiserFS file system as one of the
    supported files. ReiserFS support because it, or another large-file-friendly file
    system such as xfs, is best suited for handling large files and many files as
    well as a PBR. To get install time and RPM package support for ReiserFS, you need
    to install the boot partition that you want it as an option. At the boot prompt,
    type **linux reiserfs**:


    ```

    boot: linux reiserfs

    ```


    Select Custom install and "Manually partition with disk druid.\ Refer back to
    Figure 4-4 and create all of your partitions as outlined previously (depending
    on whether you''re setting up a single drive or a dual-RAID configuration). The
    accompanying table shows what your partition layout looks like, running a dual-RAID+LV
    configuration.


    | Device | Mount Point | File System | Size |

    |---|---|---|--|

    | /dev/md0 | /boot | ext3 | 100MB |

    | /dev/md1 | swap | swap | 512MB |

    | /dev/md2 | | ext3 | 12GB |

    | /dev/md3 | not used yet | (eventually, ReiserFS) | rest of drive(s) |


    If you are not running RAID on two drives, your partitions will be /dev/sda1-/dev/hda4
    (or /dev/sda1-/dev/sda3 if SCSI or SATA). Also, if you are not using a two-drive
    RAID-1 setup, you may set up your partition at install time (either /dev/hda3
    or /dev/sda3) as a ReiserFS-formatted volume and mount it to /viode.


    ![](img/1b8a24a162893627b8005ac678b79236_100_1.png)'
