    a generic setting to get going. Then you can tune it after the system is installed.


    Red Hat Fedora and RHEL systems offer a Display Settings window that lets you
    choose a monitor type and video color, and then to start the Display Settings
    window, select Desktop → System Settings →


    If your display is broken, then you can''t even get to a Display Settings window,
    you can try to configure it by using X from the command line. The trick is to
    run the xorg command to probe your hardware and create a xorg.conf file. First,
    exit from the broken X and return to a shell by pressing Ctrl+Alt-Backspace. Then
    create, and insert an X configuration file where it can be used by system when
    X starts. Here is an example:


    ```

    # X xorg -configure

    # X -xf86config /root/xorg.conf.new

    ```


    The Xorg command probes your video hardware and creates an xorg.conf file in your
    home directory (presumably /root). Then, run the X server, identifying the xorg.conf
    file you just created as an X configuration file by using the -xf86config option,
    as shown.


    > Note: If this doesn''t get a working X screen (with an X for your mouse cursor),
    you may have broken or unsupported video hardware. Check the xorg.log in /var/log
    for information about the graphics chipset that is detected. Use a search engine,
    with the chipset and the word Linux as keywords to find information on other people''s
    experiences with your video hardware.


