  md: '# 310 Part IV — Small Business Projects


    +   **PXE booting** — If your computer hardware supports PXE booting, this is
    probably the easiest method to use. To use this method, your network interface
    card must be PXE-enabled and your computer''s BIOS must be able to select PXE
    as a boot method.

    - **Etherbot booting** — You can create an Ethernet image that you put on a CD
    or floppy disk. Wait, no—- **Ethernet booting** — You can create an Ethernet image
    that you put on a CD or floppy disk. Once that medium boots, your workstation
    gets the rest of the data it needs over the network from the LTSP server.


    The following sections describe how to prepare for and boot your LTSP workstations
    using either the PXE or Ethernet methods.


    # Booting Workstations Using PXE


    The Pre-boot Execution Environment (PXE) is a feature available on most Ethernet
    network interface cards (NICs). It allows a client computer to get a small boot
    program from another computer to begin the boot process. Using PXE (pronounced
    "pixie”), a completely diskless client can boot from the network — no floppy,
    CD, or hard drive is needed.


    When you power up your workstation, the PXE client checks the network for a DHCP
    server that is configured to provide the bootstrap program, and then uses TFTP
    to copy the bootstrap into the RAM. Luckily for us, we have already configured
    a server to provide these services (see the description of station002 the "DHCP
    Configuration" section earlier).


    To get a PXE boot to work on your workstation, you probably have to do a few things
    to your computer:


    +   **Check the BIOS** — Power up your computer and quickly press the key required
    to go into setup mode.

    - **Enable PXE** — Some computers will have a separate way of enabling or disabling
    PXE functionality. While you are checking BIOS settings, look for Network Boot
    or PXE and make sure that is enabled. If you have multiple NICs, you may also
    need to select which one to use as the PXE card.

    - **Add PXE in the boot order** — When a computer powers up, it checks the boot
    order in the BIOS to determine how to start the operating system. Typically, it
    will check removable media (CD or floppy drive), and then the computer''s hard
    disk to find a bootable operating system. To use PXE, you need to set PXE as the
    first boot device in the BIOS.


    With the BIOS properly set, save the changes and continue the boot process. If
    everything is working properly, you should see a series of messages that show
    PXE sending out a DHCP request, gathering IP address information, downloading
    the bootstrap file, and starting up the Linux kernel that will drive your local
    display.'
