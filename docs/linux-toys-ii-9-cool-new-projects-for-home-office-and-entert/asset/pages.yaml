  md: '# Chapter 5 — Making Bootable Movies with eMovieX 147


    You can now go to the MoviX² machine again and open the video you just copied
    to computer using the MPlayer menu or controller.


    # From the Network (NFS)


    You can mount a directory from another computer on your LAN that is shared using
    Network File System (NFS) and play content from your MoviX² player. NFS is a popular
    method of sharing directories of files among Linux and UNIX systems.


    Before you mount a remote directory in MoviX², your MoviX² system must be connected
    to the network and the computer containing the directory you want to make sure
    it is available on the network. There''s no room for a complete description of
    NFS here (where you must check out Red Hat Fedora and Enterprise Linux for that),
    there is a quick procedure for sharing your NFS from a Red Hat Linux (Fedora or
    RHEL) system:


    +   1. From the computer sharing the directory (server), make sure you have an
    active network connection and that your firewall doesn''t access to the NFS service
    to your MoviX² system (open port 2049).

    2. Add an entry (as root user) to /etc/exports file that contains the directory
    you want to share. For example, if you put a copy of a video in the /tmp/movie
    directory, you might mount /etc with everyone on your LAN (read-only) by adding
    the following to your /etc/exports file on the server:

    /tmp/movie * (ro)

    3. Start the NFS service on the server (as root user) by typing the following:

    # /etc/init.d/nfs start


    +   4. Back on your MoviX² system, you can mount the remote directory from the
    MoviX² menu. First go to the menu (Alt+F1). Then select Play -> Mount Remote Volume
    to see the Remote Volume form.


    +   5. With the server name or IP address, you can identify the directory you
    want to mount and mount it on the location on the local system where you want
    to mount it. For example, if the IP address of yours is 10.0.0.2, you can find
    in the following information to have the /tmp/movie directory mounted locally:


    ```

    Volume to mount:

    10.0.0.2:/tmp/movie

    Mount point:

    /discs/server1

    File system:

    nfs

    ```


    By default, you may not need any extra mount options. MoviX² would automatically
    mount it read-only. However, view the mount page (type man mount and search for
    NFS) to see the options you may want to add to the NFS mount command.


    +   6. Select Save. The directory /discs/server1 should have been created, with
    the remote NFS directory mounted on it.


    +   7. From the MoviX² menu or the MPlayer menu, you can select to open a file,
    go to the /discs/server1 directory, and open any content you want to play.'
