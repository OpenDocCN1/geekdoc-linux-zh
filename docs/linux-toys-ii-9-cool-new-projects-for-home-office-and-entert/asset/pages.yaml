  md: '# Chapter 9 — Building a Dedicated SOHO Firewall 249


    # About DHCP and Network Address Translation on Router/Gateways


    Dynamic Host Configuration Protocol (DHCP) is the protocol by which a machine
    can ask for an IP address, and a DHCP server (running dhcpd) answers the client
    and leases (allows it to borrow) an IP address for the duration of its time on
    that given network. In the configuration in this example, the Internet firewall/gateway/router
    gets its IP address (on eth0) from the broadband provider. This is done by the
    cable modem (for cable broadband) when it serves DHCP to give your firewall IP
    address.


    The firewall in turn is running DHCP internally to serve out multiple IP addresses
    to all the clients. The firewall also serves as a gateway/router that does Network
    Address Translation (NAT) to masquerade all of your IP addresses behind the single
    external IP address on the firewall.


    Some uninitiated think you are creating many IPs for free that this is in some
    illegal- This is simply not the case. Running a NAT gateway with private IPs is
    not illegal; it is the standard way of allowing many machines in your home or
    office to share and use a single externally routable Internet IP address, without
    taking more Internet IPs from your broadband provider (or the Internet). This
    is very similar to the way that a company''s PBX system abstracts or masquerades
    many private phone extensions behind a single main phone number.


    So with this logic, your average SOHO network IP space layout might look something
    like Table 9-1.


    | Table 9-1: Network IP Assignments

    | IP Address | Assigned to |

    | 192.168.1.1 | Static firewall/gateway/router to Internet |

    | 192.168.1.2 | File, media, fax, and print server |

    | 192.168.1.3 | Backup server |

    | 192.168.1.4 | Admin PC #1 |

    | 192.168.1.5 | Admin PC #2 |

    | 192.168.1.6 | Admin remote access machine |

    | 192.168.1.7 | Staging/development workstation |

    | 192.168.1.8 | Reserved |

    | 192.168.1.9 | Reserved |'
