    # Step 5: Playing Your emViX Video


    An exact PC you can use to play the bootable movie you just created is difficult
    to determine exactly. Important factors are the amount of RAM, processor speed,
    and the video card. Also, smaller videos play better than those run in full screen.


    Feedback received by Roberto De indicates that people are able to run emViX movies
    on a computer with little as a 600 MHz Pentium with 64MB of RAM. If you have an
    older PC, consider getting a higher-quality, somewhat ideal video card (such as
    an ATI mach64 or Matrix g200 video).


    To play your bootable movie, insert the CD or DVD into the drive on your computer.
    Reboot the computer. You will see the emViX splash screen and a boot prompt. At
    that point, you can:


    +   - **Start the movie boot** — Enter or simply wait a few seconds and the movie
    will start. Press 0 and 9 keys to adjust the volume. Press m to display the Menu.
    Press p to pause (or unpause) the playback. Press q to quit playback. See Table
    5-1 for other options.

    - **Run a different boot label** — When emViX boots, it runs the emViX by default.
    The emViX label causes emViX to choose the best driver to use for your video card.
    You can type emViX manually and add additional boot options to it.


    5-4 shows the emViX boot screen.


    If the movie does not play properly, try some of the boot options described in
    the next section.


    # Starting Play with Different Boot Labels


    The following boot labels are available, if the default doesn''t work the way
    you would like. Simple type any of these labels at the emViX prompt to get to
    work.


    +   - **vesa** — Use the generic driver, which works on most video cards.

    - **vesaFB** — Use the generic vesa frame buffer driver. There are other labels
    that will use the vesa frame buffer drivers at specific resolutions. These include
    vesaFB640 (640 x 480 resolution), vesaFB800 (800 x 600), and vesaFB1024 (1024
    x 768), or vesaFB1400 (1400 x 1050).

    - **aa** — Use the ASCII art driver to display the image. You can also use the
    aa1024 (1024 x 768 resolution) and aa1280 (1280 x 1024 resolution) labels.

    - **TV** — Initialize any applications needed to activate the TV-out jack on your
    card.'
