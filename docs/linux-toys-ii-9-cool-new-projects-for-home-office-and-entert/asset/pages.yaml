    As a point of reference, my AMD 400 underclocked to 250 MHz was running memest
    at 120° (warm-hot to touch) under, running the firewall until full throttle it
    was actually cool to the touch (98°).


    Don''t forget to have a good heat sink-to-CPU thermal interface (with silicon
    compound), the sink may actually feel cool to the touch while your CPU is actually
    burning up, as the heat never gets acquired from the CPU into the heat sink!


    ![](img/1b8a24a162893627b8005ac678b79236_270_0.png)


    # Networking Hardware


    Assuming you''re hooking up some form of SOHO broadband (2–6 Mbps ADSL or cable
    modem), you want at least 10 Mbps card on the outside, and a 100 Mbps card on
    the inside. Common and popular 10 Mbps cards are any ne2(or no driver in the Linux
    kernel) or 3COM 3c509 (3c509 module in the kernel). These of older card types
    require a non-PNP memory I/O option setting to io=0x300 (or whatever the memory
    address is set to by yours)


    For a common and inexpensive 100 Mbps cards, the RealTek 8139-chipset is common
    (look on the little chip itself). The kernel module for the 8139 is usually 8139.
    The high-end 100 Mbps cards also mean notice the Intel Pro 200 chipset (which
    uses the expo1 kernel module). You should try these PCI cards work, if they''re
    easier to set and usually faster. I address all NIC1 driver configuration issues
    later in the section on configuring Devil-Linux.


    While you can''t see it in the black-and-white figure, that the external Internet
    facing, or untrusted, interface cable is red (for danger) and the internal cabling,
    or at least the cabling going from the firewall to the switch, is green to indicate
    the trusted side of the firewall. Some security buffers prefer use of this firewall
    color-coding so that the interfaces, and relative risk levels of the two connections,
    are never confused. As for the hardware itself, it can be mounted in any old PC
    case, or in a custom 19-inch rack mount. It is essential, however, that you not
    use a cheap power supply with a cheap fan will burn out within a year of continuous
    use.'
