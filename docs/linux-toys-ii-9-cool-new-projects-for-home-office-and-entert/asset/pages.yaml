  md: '# Appendix A — Using the Linux Toys II CD


    +   - KNOPPIX—The KNOPPIX directory contains the bootable image of Damn Small
    Linux. Other files needed to boot Damn Small Linux are contained in the isolinux
    directory. No installation is required to use the Damn Small Linux files from
    those directories (although the project in Chapter 6 describes how to install
    Damn Small Linux to a pen drive).


    Decide which form of the software you want to use, and then proceed to the next
    section for general information on using the Linux Toys II software in different
    forms.


    # Installing from RPMs


    Within each chapter directory is a file installme. You can run the installme file
    for a chapter to install all the RPM files available for that chapter. For example,
    as root from a Terminal, you could install all RPM packages for Chapter 8 as follows:


    ```

    # /media/cd*/RPM/cd08*/installme

    ```


    This action runs the rpm command to install each RPM file in the directory. The
    name of your CD (shown as cd*) may have any of several names (cdrom, credo, and
    so on). Instead of installing all RPMs for a chapter at once, you could use the
    rpm command directly:


    ```

    # cd/cd*/RPM/cd08*

    # rpm -Uhv *.rpm

    ```


    Using the rpm command, you can also pick and choose which RPMs to install. The
    installme script will simply force all RPMs to be installed.


    If you want to see information about any of the RPMs, you can query an RPM using
    the -q option (see Chapter 8), or type the following:


    ```

    # rpm -qi bzflag

    ```


    If you decide to remove an RPM package, you can use the -e option. For example,
    to remove the bzflag RPM, type the following:


    ```

    # rpm -e bzflag

    ```


    # Installing from tarballs


    The tarballs included in the Linux Toys II CD can include different types of files.
    If a tarball contains the source code for the project, an INSTALL or README file
    included in the tar will describe exactly how to install the contents of the tarball.
    That typically includes the following:


    +   - Using the tar command to unzip and extract the files from the CD to a directory
    on your hard disk

    - Running a configure command to configure the software

    - Running one or more make commands to compile and install the software'
