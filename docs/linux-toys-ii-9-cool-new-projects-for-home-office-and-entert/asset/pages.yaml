  md: '# Appendix B — ABCs of Using Linux 351


    # Multi-user Tasks


    If you are managing a multi-user machine (where many people have login accounts),
    there are some additional tasks you will need to do. If you are doing a project
    such as the Web Photo Gallery in Chapter 3, you might want to allow different
    family members to have their own owner accounts, so they can upload their own
    images to the family gallery. Here are a couple of tasks related to managing users
    in Linux.


    # Adding and Removing Users


    From the command line, the useradd command is a convenient way to add user accounts
    to your Linux system. Here''s an example:


    ```

    # useradd -m jjones

    ```


    The useradd command just shows a new user jjones to the system (actually, the
    /etc/passwd file). By default, it also creates a home directory for that user
    (/home/jjones). The standard page for adding Web content for the user would be
    in the user''s public_html directory (for example, /home/jjones/public_html).


    Check the useradd page to see other options you can put on the command. You can
    modify user attributes using the usermod command. You can delete the user account
    using the userdel command (userdel jjones).


    ![](img/1b8a24a162893627b8005ac678b79236_375_0.png)


    > A user''s home directory and mailbox are still intact, by default, when you
    delete a user account. An ls -l of items will show them owned by the user ID number
    that was assigned to the user. To remove the home directory and mail spool file,
    add the -r option to the userdel command when you delete the user.


    # Limiting Disk Space


    A greedy user can consume all of your hard disk space. Using the quota software
    package, you can limit the amount of disk space a user can consume. Quota software
    with Red Hat Linux systems, as well as with other distributions.


    A full description of setting quotas is outside the scope of this book. However,
    you can find how to set up quotas in Red Hat Fedora and Enterprise Linux 4 or
    in the Quota-HOWTO (www.tld.org/HOWTO/Quota.html).


