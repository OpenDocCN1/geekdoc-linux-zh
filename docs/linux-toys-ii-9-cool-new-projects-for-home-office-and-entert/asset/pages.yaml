  md: '# Summary


    Video is one of the more entertaining things to do with a computer. By combining
    several open source projects (MPlayer, a kernel, minuscule, BusyBox, and other
    components), the MoviX project created a fun and useful way to manage multimedia
    content with a completely self-contained, bootable operating system.


    The eMovIX project lets you combine a micro MoviX distribution with your own video
    content to create bootable movies. For this chapter, I''ve put a step-by-step
    procedure for gathering video content, creating the bootable ISO image, burning
    it to CD or DVD, and playing back the content.


    If you like making and using eMovIX bootable movies, you almost certainly will
    want to try out the full MoviX multimedia distribution. Descriptions in this chapter
    tell you how to run various players (primarily MPlayer) to play your audio, video,
    and digital image content in MoviX². With features built into Movi², you can gather
    multimedia content to play from a local hard disk, CD, DVD, VCD, remote directory
    (NFS), FTP upload service, or Internet streaming audio (SHOUTcast and Icecast).'
