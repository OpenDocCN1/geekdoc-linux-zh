  md: '# 306 Part IV — Small Business Projects


    After the ltcfg command, type 8 to add entries to your /etc/hosts file. By typing
    w to configure /etc/hosts, a bunch of dummy entries are added to the /etc/hosts
    file. Next, use a text editor to edit the /etc/hosts (as root user). For this
    example, the entries added for LTSP would appear as follows:


    ```

    10.0.0.100 station001

    10.0.0.101 station002

    10.0.0.102 station003

    10.0.0.103 station004

    ```


    These names and addresses should match the ones you added to the dhcp.conf file.


    # Service Permission Setup (/etc/hosts.allow)


    You can add entries to the hosts.allow file on the server so that the workstations
    can access the services they need. After starting the ltspcfg command, type 9
    to add the following entries into the /etc/hosts.allow:


    ```

    bootpd: 0.0.0.0

    in.tftpd: 10.0.0.0

    portmap: 10.0.0.0

    ```


    The first entry allow bootpd to other computers from any address. The next entries
    allow anyone from the 10.0.0.network to access the TFTP (in.tftpd) and portmap
    services. If you are using different IP address pools than those that appear here,
    be sure to change these entries.


    # NFS Share Setup (/etc/exports)


    The files and directories you need to share from your NFS service need to be added
    to the /etc/exports file on the server. After starting the ltspcfg command, type
    10 and selecting y to add your entries to /etc/exports (ro). Here is how these
    entries appear:


    ```

    /opt/ltsp 10.0.0.0/255.255.255.0(ro,no_root_squash,sync)

    /var/ltsp/swapfiles 10.0.0.0/255.255.255.0(rw,no_root_squash,async)

    ```


    These two entries cover the /opt/ltsp and /var/ltsp/swapfiles directories to be
    shared with any computers on the 10.0.0.network. Both shared directories will
    allow the root user from client workstations to read and write (no_root_squash).
    The Lts own directory tree, however, is shared only as a read-only file system
    (ro) and allows new requests to the file system only when previous requests have
    been committed to storage (sync). Alternatively, the swapfiles directory will
    allow read and write requests to take place (which it must do as swap space for
    the clients) and allow new requests to take place (async), which can improve performance.


    ![](img/1b8a24a162893627b8005ac678b79236_330_0.png)


    Type man exports to see other options available to be set in the exports file
    for the NFS system.'
  merge: -1
