  md: '# 132 Part II — Multimedia Projects


    In the previous example, recording is taken from /dev/dsp and video from /dev/video0.
    Video is captured at 640 × 480 pixels. The video codec is mjpeg. The audio codec
    is mp2. The recording is taken from Television input in NTSC format (common in
    the United States; PAL is used in Europe). A fixed quality of 0 is used. For the
    example, 1800 frames are generated (one minute of video).


    You can cut the size of the video file by more than half (with some loss of quality)
    by changing mjpeg to mpeg4. You can reduce the video size further by reducing
    the video height and width (320 × 240). Here is an example of the command line:


    ```

    # ffmpeg -d /dev/dsp -s -v /dev/video0 \

    -w 320 -h 240 -v mpeg4 -input Television \

    -norm NTSC -vq 0 -sc F 1800 - test.avi

    ```


    When I run this second command, the size of the .avi file went from 18MB to 6.8MB.
    You should run MPPlayer on each output file to make sure the video quality is
    acceptable before using these settings to capture the video you want to.


    To create DnxX use the divxvrec command. Here is an example:


    ```

    # divxvrec -d /dev/dsp -s -v /dev/video0 \

    -w 320 -h 240 -input Television \

    -norm NTSC -F 1800 - test.avi

    ```


    I went with the lower frame size (320 × 240) because I was getting a lot of frames
    dropped at the higher size. In general, I get better quality video using mjpeg.
    A lot of factors are associated with your hardware and video input that can cause
    you to get different results. The key is to try different codecs and frame sizes
    to bring a level of quality and size that you can live with.


