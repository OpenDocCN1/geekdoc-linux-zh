  md: '# Chapter 6 — Customizing a Live Linux Pen Drive 183


    the boot medium if you like after DSL is running. This is especially nice, for
    example, if you are booting from CD and you want to use the CD drive to play music
    or backup files.


    To run from RAM you need at least 128MB of RAM on your computer. If you do, you
    can start booting DSL from RAM by typing the following from the DSL prompt you
    first boot:


    ```

    boot: dsl toram

    ```


    The initial boot will take longer than a normal DSL boot as the DSL image is copied
    to ramdisk. After that, however, you should see much faster performance out of
    DSL. Any of the supported boot formats can use the toram feature.


    # Summary


    The features and usefulness of live Linux distributions have grown dramatically
    in the past few years. Not only can distributions such as KNOPPIX and Damn Small
    Linux have a Linux system and running on your computer within a few minutes, they
    can also be customized and extended in many different ways.


    The project covered in this chapter is a customized version of Damn Small Linux
    that runs on a pen drive and includes the applications, settings, and data that
    you want to carry around you. Using the Linux Toys II CD, which contains a version
    of Damn Small Linux, I describe how to install DSL to the pen drive, add applications,
    customize settings, and then take the pen drive on the road so you can show everyone
    how smart you are.'
