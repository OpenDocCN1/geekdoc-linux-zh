  md: '# 74 Part II — Multimedia Projects


    # Using One Drive with a Logical Volume


    If you are going to use only one drive (no RAID mirror) you can set all up of
    this using one drive, all from within the installer (see Figure 4-4).


    # Using Two Drives with Software RAID-1 Plus a Logical Volume


    If you are going to the dual-drive RAID-1 mirror LV setup, you are a bit more
    complex than setting up a single drive with LV.


    +   - First, need to create four partitions on your two drives.

    - Next, merge each partition with its twin on the other drive by using the RAID
    button on the partitioning screen to make your RAID devices. When you do, give
    the first three RAID devices their formatted file system (ext3) and mount points
    (/boot, swap, and /), but do not format the last device (/dev/md3) a file system
    or mount point. The RAID partition will be set up with LVM and formatted.


    > See the Hat Enterprise Linux 4 System Administration Guide, located at http://redhat.com/docs/manuals/enterprise/RHEL-4-Manual/sysadmin-guide/ch-software-raid.html,
    if you need help on visualizing this in the GUI.


    ![](img/1b8a24a162893627b8005ac678b79236_98_0.png)


    Specifically, in you need to set up the four partitions on each of your disks
    (100MB /boot, 512MB swap, 12GB / and the rest of the drive), as "software RAID*
    partitions with no file system or mount point yet (Step A in Figure 4-4). You
    then mirror each partition across the disks (still in the installer) under the
    RAID tab (Step B), setting up ext3 file systems (or swap) and mount points for
    the first three partitions on top of your software RAID-1 device names. (See Step
    B: "boot" to /dev/md0, "swap" to /dev/md1 and "/" to /dev/md2).


    The last partition on each (/dev/md3) using the remaining drive space will also
    be made into a RAID mirror, but you will not format it until you install the OS
    (Step C). After, it will be your Logical Volume atop it (Step D), format it and
    permanently mount it as /video. That''s all of your content will be stored and
    what will allow for file system expansion.


    Figure 4-4 shows the multipartition arrangement and optional RAID-1 creation steps
    look like (note the device names).


    During the OS install (don''t start yet!), you will need to partition from the
    Fedora Installer, as shown in Figure 4-4.


    If you are doing on a standard IDE/ATA drive(s), you will use the device name
    /dev/sda (and /dev/hdc for a dual drive config). If you are using a SCSI or SATA
    drive(s), it will appear as /dev/sda and /dev/sdb for your second drive.'
