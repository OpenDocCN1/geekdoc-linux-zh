  md: '# Chapter 4 — Creating a Personal Video Recorder with MyTV 113


    # Inputs


    This section defines what MyTV should take as input from Tuner from physical sources.
    For example, the video device /dev/video0, paired with Tuner0, has its content
    associated with the provider stream channels of Channel-1 listings, or /dev/video
    paired with S-Video 1 and a DSS video source with its external channel commands,
    and so on. This step may vary a bit depending on your specific video source setup
    (e.g., analog cable versus DSS dish).


    With MyTV setup, and for cheap cable, the configured setup is:


    ```

    MPEG /dev/video0 (Tuner 0) -> Cable-1

    MPEG /dev/video1 (Tuner 1) -> Cable-1

    ```


    In other words, both of my video inputs are dedicated to the RF tunnels on my
    single PVR-500MCE, whose signal (and channel) is paired with the Cable-1 source.


    # Channel Editor


    The channel editor allows you to associate specific channel names with different
    video sources. For example, I could have channels 2-66 with my Cable-1 video source
    and another range of channels with a different video source called DSS-1. I could
    have another one channel VCR that takes input from the video source called VCR-1
    (for dubbing VHS tapes to VCDs or DVDs).


    I recommend leaving this area alone until you get a feel for how your setup works,
    and what you might like the channels and inputs to be decorated in your system.


    That''s it for your mightvideo setup. Press Esc to get out of the GUI.


    # Downloading Program Guide for the Backend


    Now that you have all the settings plugged in, you need to store these settings
    in the mythbackend database (mythconfig). To accomplish this, you will need a
    Internet connection. Start the mythbackend service, and then use the mythfilldatabase
    command sequence to populate the mythbackend system with its initial channel database,
    like this:


    ```

    # /etc/init.d/mythbackend start

    Starting mythbackend: [ OK ]

    #mythfilldatabase

    ```


    It may run for several minutes as it pulls down your channel lists and updates
    the database. Next, you can automate a program list download using mythfilldatabase
    so that your channel list is updated regularly from the listing provider. To do
    this, for a cron job, log in as the mytv user, crontab -e, and it will throw you
    into vi editor. Type i to go into insert mode, and then the following (all on
    one line):


    ```

    03 * * * sleep $(expr $RANDOM % 14400) && mythfilldatabase > /var/log/mythtv/mythfilldatabase.log
    2>&1

    ```'
