  md: '# 104 Part II — Multimedia Projects


    Testing captures can be done with the use of test-mpeg2. This utility can capture
    content directly from the FireWire node and redirect it to a file, which can be
    played with MPlayer. First, tune the cable receiver to a known working station.
    Use the remote or the buttons on the receiver itself to change the channel. Next,
    using the node information from the plugreport output, use the following line
    to capture content:


    ```

    $ test-mpeg2 -r 1 > testcap.ts

    liblec61883 warning: Overlaid connection on channel 0.

    You may need to manually set the channel on the receiving node.

    Starting to receive

    (Ctrl-C)

    ```


    Press Ctrl+C to stop the capture.

    Now the file can be viewed with mplayer to ensure proper capturing:


    ```

    $ mplayer -vo testcap.ts

    ```


    If the capture plays back correctly, the next step is configuring MyTV to use
    this device. If the capture does not play back correctly, review the preceding
    steps and ensure that the correct node is being used and that the cable receiver
    is receiving the cable signal correctly. This can be tested with a normal TV.


    # Fine-Grain Control of Drivers via /etc/rc.d/rc.local


    Many people have problems getting all of their drivers and modules to load in
    the order. For example, this is a rough idea of the order in which you want things
    to load on MyTV setup:


    +   1. OS boot

    2. MySQL server

    3. i2c/lm sensors modules and related modules and control

    4. ivtv hardware drivers

    5. LCD/VFD kernel module/driver (lirc_imon in my case)

    6. Lcdcd

    7. mythtv backend service


    Up to the point where the MySQL server starts, I allow my OS to load the standard
    boot runlevel (chkconfig settings). For the remaining items, I found it easier
    to get the precise timing control that I needed via the /etc/rc.d/.rc.local file.
    Admittedly, this is a dirty way to handle the startup of any package; however,
    it works if you can''t get your /etc/init.d/ files all working smoothly and playing
    nice with the other required daemons (lirc, Lcdcd, backend, and so on). My startup
    rc.local file looks like this:'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Chapter 4 — Creating a Personal Video Recorder with MythTV 105


    ```

    #!/bin/sh

    #

    # This script will be executed *after* all the other init scripts.

    # You can put your own initialization stuff here if you don''t

    # we want to do the full Sys V style init type control dance.


    touch /var/lock/subsys/local

    echo "-------Running rc.local------"

    ### TWW: First, set up motherboard specific i2c devices and lm_sensors & fans

    echo "Setting up i2c drivers and fan control"

    modprobe i2c-nforce2

    modprobe i2c-isa

    ## I2C chip bus

    modprobe eeprom

    modprobe we3627hf # from sensors-detect, just for my motherboard.

    # sleep 2 # optional

    /usr/bin/sensors -s # recommended

    echo 40 > /sys/bus/i2c/devices/2-0290/pwm # Playing with fan speeds

    sleep 2 # optional

    echo 240 > /sys/bus/i2c/devices/2-0290/pwm

    sleep 1

    echo 200 > /sys/bus/i2c/devices/2-0290/pwm # The final speed I want

    echo

    ## TWW: Putting it here and restarting mybackend further down

    echo "Installing IPTV.Card Drivers..."

    /sbin/modprobe itv tuner=57,55

    echo

    ## Installing VFD/LCD Drivers"

    modprobe lcdrc_imon

    echo -n " >/dev/lcd0

    echo -n "MythTV 0.18 Hello World;" >/dev/lcd0

    sleep 3

    /etc/init.d/lcd restart

    ## TWW: Here''s where I restart the mybackend to properly bind to itv

    echo "Restarting Mybackend"

    /etc/init.d/mybackend restart

    echo "-Done"

    ```


    # A Final Look at /etc/modprobe.conf


    As I''ve throughout this chapter, the /etc/modprobe.conf file is centrally

    important to your setup is the rc.local file, as it contains all the kernel module
    configura-

    tion that mybackend and the other parts of the system will be able to talk to

    hard. Here''s the /etc/modprobe.conf that I built:


    ```

    ## TWW: Everything in this section is from my stock OS install

    alias eth0 forcedeth

    alias scsi_hostadapter sata_nv

    alias snd-card-0 snd-intel8x0

    options snd-card-0 index=0

    ```'
