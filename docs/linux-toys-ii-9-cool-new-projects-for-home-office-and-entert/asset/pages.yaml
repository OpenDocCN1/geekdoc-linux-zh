  md: '# 24 Part I — The Basics


    # # Connecting to Open Source Projects


    There are literally thousands of open source projects available to you. Many of
    larger offer forums, mailing lists, documentation, and free downloads of their
    software. Projects offer formal support options and consulting service (if you
    want customized enhancements). Every kind of software category you can think of
    many open source offerings for you to choose from.


    A goal of Linux Tuxys II is to help you connect to the projects you like, whether
    they are projects described in this book or one you find while you are exploring
    on your own. In the original Linux Tuxys, we pierced much of software for the
    projects ourselves and offered our own forums. In Linux Tuxys II, I encouraged
    a much closer connection to the open source initiatives I drew from this book
    by:


    +   - Sticking to existing source projects, instead of piecing software from several
    different open source initiatives

    - Pointing to existing projects, mailing lists, FAQs, and other resources from
    these open source initiatives to learn more about them

    - Encouraging you to contribute to the open source communities you like directly,
    by helping code, write documentation, or give cash donations


    Volunteers maintain most open source projects. Small contributions by many people
    can go a long way. If you make enhancements to the code or fix bugs, feed it back
    to the project source so that others can gain from your work. In each chapter
    I describe how to connect to the open source initiatives that are included and
    described in this book so you can connect the projects directly if you want to
    find out about more.


    If the Linux Tuxys projects in this book have sparked your interest, there are
    lots of ways you can pursue other open source projects. There are gatherings on
    the Internet where you can find links to information and downloads for thousands
    of open source initiatives. The most popular projects to start are SourceForge.net
    and Freshmeat.


    > SourceForge.net and Freshmeat.net are both part of the Open Source Technology
    Group (www.ostg.org), which is a wholly owned subsidiary of VA Software (www.vasoftware.com).
    Other OSTG technology sites include Slashdot.org (where you get the latest open
    source news), NewsForge.com (another open source news site), and Linux.com (a
    resource for enterprise Linux products).


    # # Finding Projects at SourceForge.net


    SourceForge.net (http://sourceforge.net) tout itself as the world''s largest open
    source software development site. It recently surpassed 100,000 registered open
    source projects and 1,000,000 registered users. If you want to find out what open
    source projects are available and the status of each one, SourceForge.net is a
    great place to start.'
