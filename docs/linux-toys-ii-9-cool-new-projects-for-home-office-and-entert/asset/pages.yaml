    # Hardware Requirements for MythTV


    Because this chapter guides you through setting up a combination MythTV backend
    plus frontend system with multiple input sources, the hardware requirements are
    going to be steep. This system recommend includes:


    +   - No less than a 2 to 3 GHz processor

    - 512MB of RAM (used 1GB)

    - One (two) 250GB SATA-I drives (for running in a RAID-1 configuration for hardware
    redundancy/safety—see the sidebar RAID Versus Data Backups) for more on RAID

    - A dual tuner cable card for tuning or recording two different programs at the
    same time (a FireWire port and FireWire digital cable receiver)

    - An output card with Nvidia chipset

    - Either S-Video output or a DVI connector to go to the TV/monitor


    Of course, you will also need the regular case, power supply, keyboard, mouse,
    audio, and so forth, it needs to be in a layout that''s quiet, aesthetically pleasing,
    and not overly looking. It should look like it belongs next to your large screen
    TV and other AV equipment. Figure 4-1 shows the MythTV configuration I put together
    for this project.


    # RAID versus Data Backups


    RAID-1 is a hardware redundancy/availability technology that allows you to take
    two drives (or partitions on drives) and mirror the exact same data on each. When
    you write to drive, the same data goes to drive 2 nearly at the same moment.


    Mirroring drives with RAID-1 is automated at the system or hardware level. So
    if one of the drives eventually dies, the other will preserve your data integrity
    and the system will continue running. This system will notify you that there is
    a problem so that you can replace the bad drive and “rebuild”


    The hardware redundancy I just described, while not required for a project like
    MythTV, does protect you and your system from failed hardware because the data
    is written to both disks simultaneously. While this is a nice, it does not protect
    from user-defined files, file system corruption, or getting hacked. To get protection
    from these, you need to back up your important data at specific points in time
    to a place off the system.


    Where RAID gets you redundancy and availability, data backups give you data retention
    over time. Because of this, you must choose only one type of redundancy because
    of cost limitations, choose backups over RAID.


