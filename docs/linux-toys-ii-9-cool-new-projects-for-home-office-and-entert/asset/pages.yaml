  md: '# Chapter 9 — Building a Dedicated SOHO Firewall 243


    ```

    $ cdrecord -eject bootcd.iso

    ```


    After a few minutes, the CD will pop out and your firewall boot CD-R is ready
    to use.


    If that doesn''t work, you might have either the wrong default CD-R device or
    some other application may have control over it. You might need to run a cdrecord
    --scanbus or killall ksc command, and then cdrecord with difference settings (for
    example, cdrecord dev=dev/0,1.iso).


    ![](img/1b8a24a162893627b8005ac678b79236_267_0.png)


    Windows users: Many users seem to be confused about what an ISO file is and how
    to properly burn it. Most users choose Nero to burn their ISOs, here''s the easiest
    way to do so. Simply run Nero, exit from any early start wizards, select File
    -> Burn Image, select your bootcd.iso, and let it!


    # Step 4: Set Your Config File Media Aside For Now


    Devil-Linux doesn''t initialize a configuration method. At first, you can simply
    boot with the CD and the Live drive create a starter config file disk for you.
    For now, however, just set your floppy configuration media aside until your hardware
    is ready.


    You can take a sneak peek at your new firewall distro, but be careful not to run
    any of the related services while on a corporate or school network. Even though
    no dangerous services are run by default by Devil-Linux, unplugging your computer
    from the network when you try it out.


    In particular, take care not to inadvertently add services as DHCP. If your laptop
    broadcasting 192.168.1.x DHCP adverts, you''ll end up happily hijacking the Windows
    machines on the LAN. This means that if you''re a student, you''ll probably get
    out of school for hacking—or worse, if you''re an IT manager, you will be fired
    for interrupting your boss''s last-end eBay bidding!


    # Choosing Your Hardware


    The great thing about running a dedicated firewall is that it takes almost no
    horsepower to route and secure a 2 Mbps stream of data between two interface cards.
    In fact, on a moderate-speed broadband connection, you can quite do well with
    a 386X25 machine on the low end.


    However, as soon as you start wanting to run an internal DHCP server, internal
    caching DNS, NAT (masquerading), DNAT (port mapping), and stateful packet inspection,
    well, then you''re going to need a bit more horsepower—but dont worry. You will
    still be able to build a system on scrap parts, most of which you can find just
    lying around.


    For a very basic SOHO router/firewall configuration with simple DHCP, caching
    DNS, and basic SNAT IP masquerading, a P100 to P133 with between 32 and 64MB should
    do just fine.'
