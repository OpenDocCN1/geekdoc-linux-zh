  md: '# 214 Part III — Home Projects


    Some ISPs specifically don''t allow non-business Internet accounts to use their
    connections. If you get into the whole gaming server side, you will probably want
    to consider co-locating your server at an Internet service provider or renting
    access to a server at a company that specializes in gaming servers.


    > > Note


    ![](img/1b8a24a162893627b8005ac678b79236_238_0.png)


    The BZFlag procedure in this chapter focuses on configuring a BZFlag server in
    a home, school or other organization (on a LAN and behind a firewall). So, I''ll
    start with the assumption that your server and client computers all be connected
    to the same LAN, using wired or wireless Ethernet cards. Unless you are hosting
    a BZFlag LAN party on your, a normal 100 Mbps Ethernet interface should be able
    to handle the load easily.


    # Video card


    No graphical interface is required if you are just running the BZFlag server.
    However, if you want to run it on the client computer, you should have a video
    card that supports OpenGL 3D acceleration. Also, you can use an NVIDIA graphics
    acceleration card with proprietary drivers from NVIDIA, which will work.


    # Sound card


    As with the video card, no sound is required for Rts (artsd daemon) or other sound
    servers. So, you will probably want sound cards for your client computers, however.


    > > Note


    ![](img/1b8a24a162893627b8005ac678b79236_238_1.png)


    BZFlag does not have direct support for Rts (artsd daemon) or other sound servers.
    So, sound might not work on your BZFlag client if you have a sound server running.
    To adjust sound levels, you can amass. I used the Master and PCM sliders to adjust
    the sound on my Fedora system.


    # Step 2: Installing Linux and BZFlag Software


    Before you begin installing BZFlag, you need a running Linux system on the computer
    that you want to use as your BZFlag server. Here''s how:


    +   1. Install Fedora Core 4 (or other Linux system) on the computer that you
    want to use as your BZFlag server. You can use a text-only, minimal install (see
    Appendix C) to run your server. However, you need a graphical interface (GNOME,
    KDE, or simple X window) if you want to play BZFlag 4 from that machine as well.

    2. From the Fedora Core 4 system, you can install the following RPM packages from
    the Linux Tests II:

    * bzflag (Contains both the bzflag client and server software)

    * adns (Contains the adns name system client library (used for resolving DNS names
    and addresses))


    > > Note


    ![](img/1b8a24a162893627b8005ac678b79236_238_2.png)


    If you get a later version of BZFlag, it may not require the adns package. The
    BZFlag project plans to switch to c-ares (http://daniel/haxx.se/projects/c-ares)
    instead.'
