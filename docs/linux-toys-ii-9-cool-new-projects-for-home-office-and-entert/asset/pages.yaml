  md: '# 194 Part III — Home Projects


    Step 3: Creating BottleRocket Scripts and cron Jobs

    You can create your own shell scripts containing BottleRocket commands to control
    your X10 devices. Gathering together a bunch of br commands in one script saves
    you typing sequences over and again. However, it also lets you launch that set
    of commands at times using cron.


    Here''s an example of how to create a script that launches a few br commands,
    and then sets it up to run by cron:


    +   1. From a terminal window (or other shell) create a bin directory in your
    home directory.


    ```

    $ mkdir HOME/bin

    ```


    +   2. Using any text editor, open a file to create the script. For example, to
    use the nedit command to create a script named br_script, you could type the following:


    ```

    $ nedit HOME/bin/br_script

    ```


    If your Linux system doesn''t have nedit installed, you can try getid or edit
    instead.


    +   3. Add the sequence of br commands you want to run to the br_script file.
    For example, you could add the following lines to turn on and dim two lights:

    /usr/local/bin/br A2 on

    sleep 20

    /usr/local/bin/br -c A -d -5

    /usr/local/bin/br A3 on

    sleep 60

    /usr/local/bin/br -c A -d -7


    This sequence of commands simply turns on A2, waits for 20 seconds (sleep 20),
    and dims it out five notices. It turns on A3, waits for one minute, and dims down
    seven notices. You can use any br command lines, along with any functions, to
    set what lights and appliances are turned on, off, dimmed, or brightened. When
    you are done, save the file and close the editor.


    +   4. Make the script executable as:


    ```

    $ chmod 755 $HOME/bin/br_script

    ```


    +   5. To run it, either type the path to the script or (because it is probably
    in your path), you can type the script name:


    ```

    $ br_script

    ```


    Now, to run that script at a set time, you can set a cron job. I''ll start by
    giving you a quick review of what the cron facility is and how it works.


    The cron facility starts with a daemon program (crond) that runs continuously
    in the back-ground for cron jobs that have been set up. Cron jobs are set up in
    one of these ways:


    +   By adding a line to the /etc/crontab file that indicates what program to run
    and when to run it.'
  merge: -1
  pgno: 218
