    # ## Other Linux Distributions


    Unlike the original Linux Toys, where the CD supplied only RPMs and source RPMs
    that were intended for Fedora and Red Hat Enterprise, this book makes it bit easier
    to install projects on other Linux distributions. If you are willing to create
    the projects from source code, you can extracting and compiling the source code
    provided on the Linux Toys II on your Linux system.


    There are some issues with other Linux distributions, however. Because the projects
    have not been checked on every type of Linux, there may be issues that cause the
    project not to work. In other words, you may need a particular utility or library
    that is not included with the Linux distribution you are using. While you can
    get whatever component is missing for your distribution, it may need some detective
    work.


    The following is a quick rundown of a few Linux distributions:


    +   - **Debian GNU/Linux (www.debian.org)** — Debian is known for being extraordinarily
    stable. The Debian project is committed to an open development process, in terms
    of sharing, and providing public tracking tools and support programs. There are
    more than 15,000 software packages associated with the Debian project. Because
    of its excellent software packaging tools, many other Linux distributions are
    based on Debian. This includes KNOPPX, Ubuntu, Damn Small Linux, and others.


    +   - **SUSE (www.novel.com/suse)** — Like Red Hat Enterprise Linux, SUSE is geared
    toward Enterprise computing. SUSE is owned by Novel, Inc., which was the world''s
    most successful computer networking company with its NetWare operating system.
    With SUSE, you can get professional support, training, documentation, and other
    commercial offerings that may be helpful to deploy many Linux systems. SUSE includes
    the YaST interface, which offers graphical tools for administering your Linux
    system.


    +   - **Slackware (www.slack.com)** — As one of the earliest Linux distributions
    still in existence, Slackware offers a very streamlined approach to Linux. Many
    users consider Slackware to be among the best ways to learn Linux because it doesn''t
    use a lot of graphical tools to support the basic operations of your Linux system.
    The distribution is compact, requiring only a two-CD set to get going. You can
    configure versions of Slack that will run on older computers with less power.


    +   - **Gentoo Linux (www.gentoo.org)** — For people who like to fine-tune and
    tweak their Linux systems, Gentoo is an excellent choice. Every component of Gentoo
    can be built from scratch to perfectly match your hardware and desired software
    configuration. Like Slackware, Gentoo is a good way to learn what goes inside
    your Linux system because installation and setup instructions contain many manual
    features that are hidden from you with distributions such as SUSE and Red Hat
    Enterprise. Gentoo features the port tools for software installation, which are
    based on the BSD ports.'
