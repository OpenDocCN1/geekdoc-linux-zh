  md: '# Chapter 5 — Making Bootable Movies with eMovieX 125


    MoViX² can fit on a mini CD (about 50MB). Once MoViX is loaded, you can eject
    the CD and insert your own content to play. That content can include:


    +   - **Video** — As with eMovie, with MoViX² you can play any video file that
    is supported by the MPlayer media player.


    +   - **Music** — Along with supporting audio with your movies, MoViX² includes
    support for a variety of audio codes that are popular for playing music. In particular,
    you can use commercial CDs, WAV, Ogg Vorbis, and MP3 audio formats to play.


    +   - **Images** — You can display image files using the slideshow software included
    with MoViX². The images will change at set intervals. You can select music to
    play in the background music during the slide show.


    +   - **Streaming audio** — With your PC connected to the Internet or other network,
    you can play streaming audio from SHOUTcast or Icecast Internet radio sites.


    > In Chapter 10, I describe how to set up an Icecast server to serve your own
    radio station. Once you set that project, you can use MoViX² to play your streaming
    audio or other content from your radio station.


    The fact MoViX² runs in such a small amount of memory, and doesn''t require that
    your CD be mounted when you play content, gives you a lot of flexibility in where
    you get the content that you play. Here are some of the types of media from which
    you can play content in MoViX:


    +   - **Music CD** — You can play the table of contents from a music CD and select
    songs. As the music plays, the creator artist, album, and song names are displayed,
    provided information that has been embedded in the audio file.


    +   - **Movie DVD** — Because it is not legal in many countries to distribute
    the libvdcss library to play most commercial movie DVDs in MPlayer, it is not
    included with the MoViX package. With that library added to MoViX² (where legal),
    you can play DVD movies.


    +   - **Other CD and DVD content** — You can play any supported audio, video,
    or image files that you have on CD or DVD. You don''t even need more than one
    CD or DVD drive on your computer you can remove the MoViX² CD other you boot MoViX².


    +   - **VCD and XCD video** — A VideoCD (VCD) can hold up to 74 minutes of video
    and audio, stored in XCD-specific format of MPEG1. XCD is a data storage method
    that stores CD content in Mode 2 instead of Mode 1 format, to hold more data than
    what typically on a regular CD.


    +   - **Hard disk** — MoViX² automatically mounts (in read-only mode) any hard
    disk partitions it finds on the PC under the /discs directory. This is a great
    way to play your multimedia content from those mounted directories. This is for
    a Windows system, while still using the Linux tools you may feel comfortable with.


    ![](img/1b8a24a162893627b8005ac678b79236_149_0.png)'
