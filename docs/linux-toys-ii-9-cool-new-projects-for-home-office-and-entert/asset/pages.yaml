  md: '# 68 Part II — Multimedia Projects


    # What Is FireWire?


    FireWire is Apple Computer''s trademark name for the IEEE (pronounced eye triple
    e) 1394. FireWire is a fast external connection bus that can connect up to 63
    devices and transmit data up to 400 Mbps. It supports plug-and-play connectivity
    and is a very common interface on today''s computer hardware. FireWire has become
    the facto standard for high-performance digital video devices such as camcorders
    and now cable receivers, such as the Motorola DCT 6200.


    The Motorola DCT 6200 cable receiver becomes a very popular device for cable television
    providers to lease or sell to their customers. This unit is very nice and has
    an added bonus of a FireWire port. The port is an optional feature, so you must
    request it with the FireWire port from your cable TV provider. FireWire is not
    as recognizable as a term in the television industry as in the PC industry, so
    describe the port or as customer service people may not be familiar with FireWire.


    Starting with version 0.1 of MyTV, functionality was added to support capturing
    via FireWire. The Motorola DCT 6200 device was one of the first to be supported
    and continues to be the most tested/supported device. The DCT 6200 device decodes
    the cable stream and transmits (or re-encodes it) to an unencrypted mpeg2 stream,
    which then offers over the FireWire port. The unit will do for both standard and
    high-definition channel streams. Capturing of both standard-definition and high-definition
    streams is supported. With MyTV version 0.18.1 (current release at the time of
    this writing), software was added to change channels on the DCT 6200 device from
    within MyTV via the FireWire cable. Previously, an external program or external
    hardware was necessary to change the channel on the device. This was a major step
    forward for FireWire users of MyTV.


    The use of FireWire with MyTV has a few advantages. One of the biggest advantages
    is that it eliminates the need for a TV capture card. In the case of HDTV, this
    can save a significant amount of money. The system requirements for capturing
    via FireWire are as well because the DCT 6200 provides a straight MPEG stream.
    There is no need for transcoding the video. This is another money-saving advantage.
    Finally, it is very easy to add multiple recording sources via FireWire. Just
    connect more cable receivers to the built-in FireWire ports that are built in,
    or through an add-on PCI card.


    # Video Output Options


    This is how content (whether analog or digital) gets to your TV, monitor, or physically
    attached display device. This chapter focuses on using the analog SVideo output
    option, there are several output options to choose from to match your video display
    equipment and environment.'
