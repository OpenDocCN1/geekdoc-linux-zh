  md: '# 148 Part II — Multimedia Projects


    From the Network (Internet Radio Station)

    MoviX² is configured to immediately connect to SHOUTcast or Icecast radio stations
    if you are connected to the Internet. To open a SHOUTcast or Icecast streaming
    audio radio station, do one of the following, respectively, from the MoviX² menu
    (Alt+F1):


    +   - SHOUTCAST — Select Play → SHOUTcast Radios. From that menu, select the type
    of content and then the action to connect to. For example, if you Jazz → Swing,
    you would see the MoviX² audio screen with “SHOUTCAST radio: KCEA-FM Big Band
    Swing”

    - Icecast — Select Play → Icecast Radios. From that menu, select the type of content
    and then the action to connect to. for, play classical music you could select
    Classical → Symphonic. As with SHOUTCAST, you will see the audio screen with the
    name of the Icecast station displayed.


    In both cases, press the Esc key to quit the radio station and go back to the
    MoviX² menu.


    # More Ways to Use MoviX²


    Although MoviX and MoviX² are primarily to play video content, they can play other
    content as well. You can play music directly from an audio CD or display a slideshow
    of images, as described in the following sections.


    # Playing Music CDs


    To play a music CD, insert CD into your MoviX player''s CD drive. From the MoviX
    menu, select Play → Audio CD → Reload TOC (to load a table of contents of the
    CD). You can then select individual tracks to play (Play → Audio CD → PlayTrack)
    or play the whole CD (Play → Audio CD → Play). If the information is available,
    you will see the artist, album, and song information displayed for the music as
    it plays.


    # Playing Slideshow


    From the MoviX menu, you can select a directory of images to play as a slideshow
    and choose music to play along it. From the MoviX main page, do the following:


    +   1. Select Play → Slideshow → Select Background Music.

    2. From the menu that appears, set Set/change music.

    3. Use your mouse or keyboard keys to choose the song you want to play from your
    local file system (hard disk, CD, DVD, remote-mounted directory, and so on).

    4. Back at the main menu, select Play → Slideshow. Then choose the disk you want
    to choose your directory of images from.'
