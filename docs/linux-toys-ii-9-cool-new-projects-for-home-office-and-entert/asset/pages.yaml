  md: '# 200 Part III — Home Projects


    Setting the port

    Here''s an example of a setting you can use in your x10config file. This line
    sets serial

    port to which your CM11A device is connected to /dev/ttyS0 (COM1). You could change
    it

    to another serial port where it may be connected (/dev/ttyS1, /dev/ttyS2, and
    so on.


    ```

    TTY /dev/ttyS0

    ```


    Setting the default house code

    The default house code used by Heyu is A. You can change it to any letter from
    A to P.


    ```

    HOUSECODE A # B C D E F G H I J K L M N O P

    ```


    Creating an ALIAS

    Using an ALIAS, you can associate text strings with X10 devices (house code/unit
    number).

    This lets you use that might be easier to remember, back_porch, garage, or

    basement_stairs, instead of like A3 or J5. ALIAS are sensitive (Porch isndifferent
    from porch), limited to 32 characters, and can refer to one or more units.


    In an ALIAS, you can optionally include the type of module you are turning off
    or on. And

    For example, StdLM is a standard X10 one-way lamp module and StdAM is a standard
    X10

    one-way appliance module. The format (Type man x10config to see other supported
    modules.)

    of an ALIAS string is as follows:


    ```

    ALIAS Label Housecode|Unit_code [Module_Type]

    ```


    You can identify multiple units with a house code. For example, A1, A2, and A3
    can be

    identified as A1, 2 or Al-3. Here are several examples that are included in the
    x10config

    file.


    ```

    ALIAS front_porch A1 StdLM

    ALIAS back_porch A2 StdLM

    ALIAS porch_lights A1,2

    ALIAS tv_set A3 StdAM

    ALIAS living_room A4 LM14A

    ALIAS patio_landscape A8 StdAM

    ALIAS patio_lamppost A9 StdLM

    ALIAS all_unit_lights A8,9

    ```


    As you can see, intuitive names like tv_set and patio_landscape are each identified

    with or more house code/unit number. Some of the ALIASes also indicate that ALIASes

    represent appliance or lamp modules.


    Creating a SCENE

    The SCENE and USERS (which stands for USER-defined synonym) directives are ways
    of

    setting up a sequence of X10 signals to be sent. Currently, SCENE and USERSYN
    are the same,

    except that the values you set will appear in different Heyu show menus. (Type
    man

    x10config to find out more about SCENE and USERSYN directives.)'
