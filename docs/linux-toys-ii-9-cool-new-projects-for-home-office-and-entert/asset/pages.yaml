  md: '# Introduction


    # xxi


    # Conventions Used in This Book


    On occasion, there will be code or commands I want to highlight during a procedure.
    Here are some examples of text that is marked differently along the way.


    Sometimes in a procedure, I want to make a distinction between what you type and
    what is returned. In those cases, the entire input and output is marked as code,
    while the part that you type is marked in bold. For example:


    ```

    # ssh toy

    root@toy''s password: ******

    Last login: Tue Nov 22 12:58:49 2003 from music.linuxtoys.net

    #

    ```


    In this example, you type toy, and then a password (indicated by the asterisks
    in bold). The rest are the responses from the computer. This example shows a command
    typed to the shell. If you are new to Linux, remember that you should open a Terminal
    window to get to shell. When you see a prompt ending in a pound (#), it means
    you should be the root user when you run the command; when you see a dollar sign
    ($), you can be any user.


    Special notes, Caution, and Cross-Reference appear time to time. These paragraphs
    contain an extra bit of information or a special way of doing something, to watch
    out for, or a pointer to another chapter, respectively. Here''s an example:


    ![](img/1b8a24a162893627b8005ac678b79236_23_0.png)


    Note contains an extra bit of information.


    # What You Need for the Projects


    For all the projects, you will need a PC, the accompanying CD, and this book.
    Because the book includes a bootable Linux operating system on the CD, you can
    do a few of the projects with having Linux installed (most notably, the bootable
    pen drive project in Chapter 6). Most other projects require that you have a Red
    Hat Enterprise Linux or Fedora Core. Other Linux systems will work as well, but
    you will need to compile the software (the CD includes the source code) or get
    pre-built binaries from somewhere.


    ![](img/1b8a24a162893627b8005ac678b79236_23_1.png)


    The projects in this book were all built and tested using Red Hat Fedora 4 (although
    they should work on Red Hat Linux 4 x). If you are unfamiliar with Linux, I recommend
    my book Red Hat Fedora and Enterprise Linux 4 Bible (Wiley, 2005). It includes
    the complete Fedora Core 4 Linux operating system as well as more than 1,000 pages
    of descriptions for using Fedora Core and Red Hat Enterprise.


    Check Chapter 2 for an overview of the hardware and software requirements for
    Linux Tips II. Then refer to each project chapter to determine the special requirements
    for each particular project.'
