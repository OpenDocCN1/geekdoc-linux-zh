    # How Do I Choose Hardware for a Server?


    Projects such as the Gallery project (Chapter 3) and Icecast Internet Radio Station
    (Chapter 10) can be used as a Public server to share photos and audio broadcasts,
    respectively. While there are no special hardware demands, per se, for putting
    a server on the Internet (if you have an Ethernet card, an IP address, and a connection
    to the Internet, it will work, there are some issues you should consider.


    If you are betting your business on the server for these projects


    There are hosting companies, such as RackSpace, that set up and maintain hardware
    that they know to work well in Linux. If something goes wrong, they have lots
    of spare parts on hand and can get your server back up and running in a very short
    time. RackSpace is also good for Linux projects because it runs Red Hat Enterprise
    Linux servers, which will work for the projects described in this book.


    # How Do I Know if My Computer Will Run Linux?


    There are always enough cheap hardware component known to humankind working in
    Linux (one way or another). Some hardware, however, may not work without extra
    tweaking and some may not work for your particular version of Linux.


    Here are some reasons why particular hardware components may not "just work" with
    the Linux system you are installing:


    +   - Only Windows drivers available — Some hardware manufacturers do not publish
    the specifications of the drivers needed to access their computer hardware. This
    can make it very difficult for open source developers to create drivers needed
    to use the hardware in Linux. Drivers for certain software-driven mice (called
    widows), printers (called winprinters), and Webcams have been created by the open
    source community by sheer tenacity. In some cases, open source developers have
    created wrappers that can take advantage of existing Windows drivers. For example,
    the nidswrapper project can be used with Windows drivers to support a variety
    of wireless networking cards that don''t have native Linux Drivers.'
