  md: '# 358 Part V — Appendices


    From DVD/CD, Network, or Hard Disk?

    When you install Fedora, the distribution doesn''t have to come from the installation
    DVD or CD. After booting the installation DVD or CD and typing linux askmethod
    at the boot prompt, you are offered the choice of installing Fedora from the following
    locations:


    +   - Local DVD or CDROM — This is the most common method of installing Fedora
    and the one you get by simply pressing Enter at the installation boot prompt.
    All packages needed to complete the installation are on the DVD that comes with
    this book or the set of four CDs available from the Fedora project that contain
    the same software.

    - HTTP — Lets you install from a Web address (http://).

    - FTP — Lets you install from an FTP site (ftp://).

    - NFS image — Allows you to install from any shared directory on another computer
    or your network through the Network File System (NFS) facility.

    - Hard drive — If you can place a copy of the Fedora Core on your hard drive,
    you can install it there. (Presumably, the distribution is on a hard drive partition
    to you are not installing.)


    If you don''t have a bootable DVD or CD drive, there are other ways to start the
    installation. Unlike earlier Fedora and Red Hat Linux versions, Fedora 4 doesnt
    support floppy disk boot images (the Linux 2.6 kernel is not enough to fit on
    a floppy disk). Therefore, if you don''t have a bootable DVD or CD drive, you
    need to start the install process from some other medium (such as a USB device,
    PXE server, or hard drive).

    The following specialty installation types may also be of interest to you:


    +   - Boot CD — You can create a boot CD from the boot images contained on the
