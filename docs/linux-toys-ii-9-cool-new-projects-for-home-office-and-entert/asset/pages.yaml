  md: '# 226 Part III — Home Projects


    The point of this chapter is to focus on setting up a gaming server, the following
    sections describe BZflag game play from the perspective of the server. You can
    learn a lot about reading these sections on the types of games, flags, teams,
    and other issues related to setting up the server. For more information on game
    play, I recommend the following links:


    +   - BZFlag First Contact (http://shellshock.bzflag.bz/guides-firstcontact.html)—Contains
    a good overview of the project and tips for starting out your game.

    - BZFlag.org Forums (http://my.BZflag.org/bb/)—If you have questions about setting
    up or playing BZflag, the official forums are a great place to start.


    If you decide to use some public BZflag servers, consider registering your collign(user
    name) and password first. As of BZflag, version 2, the BZflag project has been
    offering a global registration service so each player can keep a consistent identify
    across multiple BZflag servers. Refer to the “Central Registration for BZflag”
    section later in this chapter for further information on this feature.


    # Customizing Your BZFlag Server


    With dozens of options available to the BZflag server (bzfs), there are many ways
    you can configure flags to control what players can do and how well you can manage
    game play. Read through the parts in this section to make decisions when you create
    your configuration file. Many administrators will create multiple configuration
    files to support different types of game play, sometimes rotating those files
    to provide different game experiences.


    # Setting Game Play Features


    As administrator of the BZflag server, you can choose the style of game being
    played and features that the players in your games can and can''t.


    # Changing Game Style


    If you choose a game, BZflag will run in Free-for-all mode when you start the
    server. To do a Capture-the-flag game instead, you can add the -c option to your
    configuration file:


    -c


    For Capture-the-flag using a random map, you can use the -cr option instead:


    -cr


    After -cr, you can add a number indicating building density (the default is 5).
    Each Capture-the-flag game uses one flag per team by default. You can add more
    flags using the +f option described later.'
