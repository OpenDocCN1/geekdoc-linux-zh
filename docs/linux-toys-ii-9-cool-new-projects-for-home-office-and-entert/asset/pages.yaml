  md: '# Chapter 7 — Automating Home Lights and Gadgets with X10 203


    It is possible to use Heyu in the way that I describe BottleRocket; just add a
    bunch of heyu commands to a shell script or launch them from a cron job. However,
    Heyu version 2 has a feature that lets upload a schedule file directly to the
    CM11A device, so your X10 scheduled commands can continue to run even if your
    computer is off.


    The following sections describe some ways of using the heyu command to manage
    your X10 activities.


    # Sending X10 signals


    The heyu command is capable of requesting any X10 command that the CM11A is capable
    of sending to X10 devices. These commands can incorporate any aliases you set,
    to act on the associated house code(s) or simply use the house code directly.
    Here are some examples:


    ```

    $ heyu on F5

    $ heyu off F3

    $ heyu lightson F

    $ heyu lightsoff F

    $ heyu allon F

    $ heyu alloff F

    ```


    The previous set of commands illustrates various ways to turn X10 devices on and
    off. The first command turns on the unit at F5. The second command turns off the
    unit at F3. The next two commands turn on and off all modules on house code F,
    respectively. The next two commands turn on and off all units (lights and appliances)
    on house code F.


    There are several ways to dim and brighten lights all heyu. Here are some examples:


    ```

    # heyu dim F5 7

    # heyu dim F3 9

    # heyu bright F 4

    ```


    The first command in the preceding code dims the light at F5 by 7 from whatever
    its current brightness is. The next command dims the light at F3 by 9 from full
    brightness. The next command brightens the light at F9 by 4 levels from its current
    state. The CM11A provides brightness levels 1–22 between fully dim and fully bright.


    There are a few direct commands you can try with Heyu. For a complete list, type
    man heyu.


    > A design goal of Heyu, by Charles Sullivan, is to, have a command corresponding
    to every CM11A native command that can go into an uploaded macro. As a result,
    Heyu has implemented some commands that aren''t useful. An example of a useless
    command is brightb (brighten after first brightening to full brightness).


    ![](img/1b8a24a162893627b8005ac678b79236_227_0.png)


    # Administering Heyu


    Using administrative options to the heyu command, you can change or check out
    the current state of your X10 activities. Here are some examples of commands you
    can type as the Heyu administrator:


    ```

    $ heyu reset

    $ heyu setclock

    $ heyu status F7

    $ heyu info

    ```'
