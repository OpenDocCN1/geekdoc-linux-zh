  md: '# Chapter 9 — Building a Dedicated SOHO Firewall 251


    You want to be very careful about running too many services on your firewall/gateway.
    The more programs that you run, the more you expose your network to attack, even
    from the inside. Remember, 80 percent of all successful hacker/cracker attempts
    come from within an organization!


    # Booting up and Configuring Your Firewall


    Now that you have all hardware together and your network plan laid out, you should
    run through a quick hardware setup checklist. Verify the following before you
    proceed:


    +   * Your CPU is running cool enough.

    * Your CD-ROM is hooked up correctly and configured as the master ATA device.

    * Your floppy drive cable isn''t backwards (if it is, the light will stay on).

    * Your config floppy is formatted ext2 (done via the command mke2fs /dev/fd0 from
    Linux).

    * Your motherboard BIOS is set to boot off the CD-ROM first.


    The rest of this section shows how to boot the system from a CD and use a default
    configuration, start applying your network layout settings and required services,
    configure your network card drivers, and configure your DHCP and firewall settings.


    Before booting Devil-Linux, consider booting the Linux Toys II CD first to determine
    the modules representing your network interface cards. Open a terminal and use
    lsmod | less less. Page through the list of loaded modules to find one representing
    your NICs. If you''re not sure which they are, type modprobe module, replacing
    module with the name of the one you suspect of being a NIC. That displays a description
    of the module. Discovering the modules for your NICs can save you some trouble
    when you go to configure your network interfaces Devil-Linux.


    # Starting the Boot


    At the boot menu (where you previously pressed m for memtest), press Enter. The
    boot screen should look like Figure 9-4.


    Let the machine boot normally, verifying that your boot ext2 configuration floppy
    is in the drive with the write-protect tab closed. The boot process will see the
    blank floppy and prompt you as follows:


    *** Found empty configuration media ***nShould I copy default configuration to
    it? (y/n) y'
