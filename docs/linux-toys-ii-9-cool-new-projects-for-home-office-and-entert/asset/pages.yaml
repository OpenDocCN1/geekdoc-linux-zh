    ![](img/1b8a24a162893627b8005ac678b79236_141_0.png)


    # FireWire Testing


    MythTV for FireWire is just like testing for any other input method. To Go to
    TV and tune to a channel the connection; you should see live TV content. Change
    channels to the internal channel changing via FireWire if a supported device is
    being used. If things are not working as expected, you may need to do troubleshooting.


    Problems using FireWire with MythTV will either be with the cable receiver, the
    MythTV system, or with the FireWire cable itself. Here are a couple of suggestions
    for handling problems with FireWire.


    +   **Cable receiver** — Because replacing the cable is easy, that troubleshooting
    is fairly obvious. On the cable receiver, check that the receiver is actually
    receiving video content and is able to display this content by other means than
    FireWire. It is also possible the FireWire ports on the cable receiver are not
    functional. If this is, replacing the cable receiver with active FireWire port(s)
    would be the appropriate action. Ask your provider for a unit with operational
    FireWire ports.

    **MythTV system** — Problems not related to the cable receiver or FireWire cable
    can be attributed to MythTV system. These problems could be anything from the
    FireWire ports on the PC itself to a misconfiguration within MythTV. Start with
    the easiest-to-fix information. work toward away-intensive tasks. Triple-check
    all configuration information. Reifying the port and node information using the
    plugreport and testing help you verify the connection to the cable receiver. Checking
    /var/log/messages help determine whether the FireWire ports on the PC are detected
    and functional. Finally, stepping through all the setup instructions one by one
    may lay a clue to where the failure may be.


