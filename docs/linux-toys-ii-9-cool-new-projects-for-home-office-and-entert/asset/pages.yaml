  md: '# Chapter 8 — Setting Up a Server with BZFlag 227


    For a rabbit game (where everyone tries to chase and destroy the tank assigned
    as the rabbit and the rabbit tries to stay alive), the rabbit can be assigned
    in different ways. You can have the person with the top score assigned to be the
    rabbit when the rabbit is destroyed as follows:


    ```

    -rabbit score

    ```


    You can have the person who kills the rabbit take over the rabbit, as follows:


    ```

    -rabbit killer

    ```


    Or you could have a random tank assigned to be the rabbit when the rabbit is destroyed:


    ```

    -rabbit-for-all random

    ```


    Free-for is recommended for learning the game, with special flags (-s) and teleporters
    (-t) enabled if you want to try out those features. To learn teamwork skills,
    try a basic Capture-the-flag game.


    # Enabling Game Features


    There are some special features you can add to make BZFlag more interesting (especially
    as you become more skilled). For example, you allow tanks to jump by adding the
    -j option to your configuration file:


    ```

    -j

    ```


    To make regular shots ricochet (guided missiles, super bullets, and shock waves
    don''t ricochet), add the +r option:


    ```

    +r

    ```


    Teleporters typically look like mesh screens with black and yellow stripes around
    them. When a tank drives through a teleporter, it is immediately transported to
    another teleporter. To enable teleporters, use the -t option:


    ```

    -t

    ```


    After each shot (by default), a player needs to reload before shooting again.
    To increase the maximum number of shots before reload, use the -ms option. For
    example, here''s how you allow two shots before a reload:


    ```

    -ms 2

    ```


    When a player kills a teammate, that player dies too (by default). You can have
    the player killed using the -tk option:


    ```

    -tk

    ```


    After a tank is destroyed, it reappears (after the player i or right-clicks the
    mouse) somewhere else on the field. This is referred to as spawning. Normally,
    tanks will spawn on the ground. Adding the following option, however, allows them
    to spawn on top of box-shaped buildings as:


    ```

    -sb

    ```


    Many other game play options have to do with managing flags, as described in the
    next section.'
