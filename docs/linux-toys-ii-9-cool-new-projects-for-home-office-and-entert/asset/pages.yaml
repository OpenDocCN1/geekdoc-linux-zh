  md: '# Chapter 4 — Creating a Personal Video Recorder with MythTV 107


    # Configuring MySQL Server for MythTV


    Follow these steps to prepare and configure MySQL Server for MythTV:


    +   1. Check that you have MySQL server installed and ready to go:


    ```

    # rpm -qa|grep ^mysql

    mysql-3.23.58-16.FC3.1

    mysql-dev-3.23.58-16.FC3.1

    mysql-server-3.23.58-16.FC3.1

    ```


    After you versions may differ, make sure that your packages appear to be installed.

    Also verify that the mysql service is set to be on at reboot time, and start it:


    ```

    # chconfig mysql

    # chconfig -list mysql

    0:off 1:off 2:on 3:on 4:on 5:on 6:off

    # /etc/init.d/mysql start

    ```


    Starting MySQL: [ OK ]


    +   2. Next, set MySQL database password to something that you will not forget

    (I recommend making it as same as the system''s root password):


    ```

    # mysql -u root mysql

    mysql> UPDATE USER SET Password=PASSWORD(''ROOT_PWD'') WHERE user=''root'';

    mysql> FLUSH PRIVILEGES;

    mysql> quit

    ```


    Change ROOT_PWD to what you want your MySQL database password to be.


    +   3. Import the schema MythTV database into MySQL:


    ```

    # mysql -u root -p < /usr/share/doc/mythtv-0.18.1/database/mc.sql

    ERROR 1064 at line 4: You have an error in your SQL syntax near ''TEMPORARY

    mythconn.*'' TO mythtv@localhost IDENTIFIED BY ''mythtv'' at line 1

    ```


    Enter the root password that you just set. The error 1064 at line 4 is line 5.

    You can ignore this if you use it (Fedora Core4/MySQL4 and newer should not show
    this error).


    +   4. Now you need to make some changes in the mysql server settings as well
    as the client. The main server configuration file is /etc/my.cnf. Edit this file
    and

    change the contents under the [mysql] section to roughly match the following for

    MySQL 3.23 (in Fedora Core 3):


    ```

    [mysql]

    datadir=/var/lib/mysql

    socket=/var/lib/mysql/mysql.sock

    ### Mythtv Adjustments for MySQL 3.23 ###

    set-variable = key_buffer = 16M

    set-variable = table_cache = 128

    set-variable = sort_buffer = 2M

    set-variable = myisam_sort_buffer_size = 8M

    ```'
