  md: '# 40 Part II — Multimedia Projects


    +   **PHP version** — Checks if you have a version of PHP that will work with
    your version of Gallery. PHP, which recursively scans for PHP: Hypertext Preprocessor,
    is a scripting language often used with Web development that is incorporated into
    Gallery. If you need a different version of PHP, go to your Linux distribution''s
    site and see if the version you need is available in binary form (such as an RPM
    or DEB package), or download the source code from the PHP Web site (www.php.net).


    +   **PHP defined variables** — Checks whether or not your version of PHP handles
    defined variables in a way that is required by Gallery. If this step fails, you
    probably need a later version of PHP.


    +   **PHP register_globals** — Checks whether or not the register_globals option
    is turned off. Gallery suggests that it be turned off for security reasons. If
    the option is turned on, you can turn off register_globals for the whole system
    or for your personal Gallery installation. To change it for your system, edit
    the /etc/php.ini file (as the root user) and change the register_globals = Off


    ```

    register_globals = Off

    ```


    If you have a personal installation of Gallery (for example, in the /home/chris/public_html/gallery/),
    you need to make two changes. First, add the following line to your .htaccess
    file in your gallery directory:


    ```

    php_flag register_globals 0

    ```


    Next, have the system administrator make the Apache httpd.conf file (probably
    in /etc/httpd/conf/httpd.conf). Replace /home/chris with the name of your home
    (or other directory) where you have installed Gallery:


    ```

    <Directory /home/chris/public_html/gallery>

    AllowOverride Options FileInfo

    </Directory>

    ```


    +   **PHP safe_mode** — Checks whether PHP is running in Safe mode. Safe mode
    is too restrictive for Gallery to run, so the safe_mode option must be off. If
    it is not, you can turn it off by changing the safe_mode line in the /etc/php.ini
    file to read as:


    ```

    safe_mode = Off

    ```


    +   **Enabled exec** — Checks that the exec function is enabled on your system.
    (Gallery uses exec to start image manipulation tools, such as ImageMagick and
    jpeg.)


    +   **Access to .htaccess file** — Checks that Gallery has access to the .htaccess
    file for your gallery directory. Without having read access to that, you won''t
    be able to change settings.


    +   **PHP magic quotes** — Checks whether magic quotes are enabled. Off recommended
    magic quotes can result in unexpected behavior if you use single quotes, double
    quotes, or backslash characters in Gallery titles or captions. To turn off magic
    quotes, edit the /etc/php.ini file and make sure that magic_quotes_gpc, magic_quotes_runtime,
    and magic_quotes_sybase are all set to Off.'
