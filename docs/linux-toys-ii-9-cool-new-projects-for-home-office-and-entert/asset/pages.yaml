  md: '# Chapter 11 — Building a Thin Client Server with LTSP 293


    # Choosing a Server


    It is a bit of an art to choose the server to support your LTSP workstations.
    Here are some things to consider:


    +   **Disk space** — Beyond the operating system (which can consume from 2GB to
    7GB of disk space for Fedora Core), you need an additional 400MB of disk space
    for the LTSP software. You must then consider how much disk space will be required
    for the users from each workstation. For a user who is writing some documents
    and storing a few images, 500MB might be plenty of space. For someone working
    with video or ISO images, 10GB may not be enough.


    +   **RAM** — Because applications used from each workstation are actually running
    on the server, RAM is not a place to skip if you want good performance for your
    clients. Luckily, one of the biggest memory hogs (the X server) is running on
    each workstation. Start with the minimum RAM requirements from Linux you installed
    and build from. The LTSP documentation says that the project has successfully
    run 50 workstations with 4GB of RAM.


    +   **Processors** — While RAM is potentially the biggest bottleneck, processor
    speed is probable next. For the 50-workstation configuration mentioned by LTSP,
    the processor was a dual-Pentium 4, 2.5 GHz configuration.


    +   **Ethernet NIC** — You will need an Ethernet NIC supported by Linux to communicate
    with the workstations.


    +   **Other hardware** — Because, presumably, this will be serving multiple users,
    you need to think about what you need to support all of these users. By consolidating
    everyone on one server, you might find cost-effective to invest in good backup
    hardware, printers, CD/DVD writers, and other hardware users you may need to access.


    # Choosing Client Workstations


    The list for choosing client workstations is more a list of what you don''t want
    than what you do. You do not need a hard disk, floppy drive, CD/DVD drive, or
    any storage medium (provided you have network interface cards that have boot capabilities).


    The client workstations require only enough horsepower to run a minimum Linux
    system mainly running to the X Windows server. The processor can be an ancient
    486. Because swap space is on the server, RAM can be as little as 32MB on each
    workstation.


    One tricky part, especially for older PCs, is making sure that you have a supported
    video card. If LTSP is unable to autodetect your video card, you will have to
    do some special configuration in your `lts.conf` file to indicate how to handle
    that. Although I describe how to set up a graphical workstation in this chapter,
    you also have the option of using the workstation without a GUI (shell-only login).'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# 294 Part IV — Small Business Projects


    While the view from the GUI on your workstation is the server''s processor and
    file system, there are ways of accessing some local hardware using LTSP. For example,
    the LTSP document describes how to connect a local printer to a workstation that
    you and others can access it from the server and other workstations.


    # Networking Hardware


    Each workstation will need at least one network interface card, appropriate cabling,
    and a network switch (or a hub). You can also use wireless NICs as to using a
    wired Ethernet network. On the workstations, if you are not booting from floppy
    disk or CD, you will need to have a network-bootable NIC (I describe how to use
    PXE to do network boots). NICs are available for under $10, so you might consider
    buying a new one if yours isn''t supported.


    A 100 Mbps switch can be found for under $20. An older hub will work (and you
    might be able to find one thrown away). But keep in mind that nearly every transaction
    from an LTSP workstation causes network traffic. So even a free 10 Mbps speed,
    where all workstations will see your network traffic, may not be worth the price.


    # Setting Up the Server


    If you have already chosen the computer that you will use as the server for this
    project, you are ready to set up the server. Here is how your LTSP server must
    be set up before you begin installing and configuring your:


    +   **Operating system** — Most Linux and UNIX systems should work as the server
    for this project. In my example, I use Fedora Core because it includes all the
    packages that LTSP needs and is an easy-to-install RPM package of ltsp-utils that
    works. When I installed Fedora Core, I had to make sure that packages were installed:
    nfs-utils, portmap, tftp-server, and a set of xorg-x1 packages (selecting GNOME
    or KDE when you install get the X packages you need). I used the default run level
    for a desktop system, which is level 5. (That the GNOME display mode to be enabled
    so it can be used by the clients well)

    For other systems, you will need to use the ltsp-utils package in TGZ format,
    which you have to un-tar and as described in this chapter. (There is nothing to
    compile because the utilities are all written in perl.) As the Linux services
    that LTSP requires, packaging, configuration files, start-scripts, and other features
    related to the services LTSP needs vary among Linux distributions.


    +   **Internet connection** — During the setup process, itself grabs the client
    software from the LTSP repository. To complete this procedure, you need an Internet
    connection from the server machine you are configuring. That machine should eventually
    have a LAN connection to your client machines. (You can bypass the Internet connection
    by using the LTSP ISO image, as described in the procedure. That ISO image is
    included on the Linux Toys II CD.)'
  merge: -1
