  md: '# Chapter 9 — Building a Dedicated SOHO Firewall 261


    # DROP External Ping Packets (Optional)


    One problem that I had with the default 2NIC setup was that everything but drop
    ICMP on the outside of the firewall. While some people say that you should leave
    ICMP on (ping/echo reply included), it has been my observation that it is easier
    for people to see you (or your firewall), the more you attack and the deeper the
    scans.


    To cut down on the number of potential intruders who you can find, disabling ICMP
    would be the quickest, easiest fix. To change this setting on the default firewall
    script that comes on Dev-Linux into the running /etc/init.d/ directory, and back
    up your firewall.rules file like this:


    ```

    # cd /etc/init.d/

    # ls -1 firewall.rules

    firewall.rules          <--- This is the live firewall script

    firewall.rules.2nic      <--- Only used as a template

    firewall.rules.3nic      <--- Only used if running a DMZ

    # cp -a firewall.rules firewall.rules-BAK <---"archive" the file

    ```


    You should always back up important configuration files like before editing them.
    If something goes terribly wrong, having a fallback position can be a lifesaver.


    ![](img/1b8a24a162893627b8005ac678b79236_285_0.png)


    Now edit your firewall.rules file, and add the following line to your iptables
    rules:


    ```

    # Allow Ping and friends.

    ## TWW: but drop all ext. pings Bv

    $(IPTABLES)-A INPUT -p icmp -i $(OUT_DEV) -j DROP

    $(IPTABLES)-A INPUT -p icmp -j ACCEPT

    $(IPTABLES)-A OUTPUT -p icmp -j ACCEPT

    ...

    ```


    To make these changes to the firewall.rules file, rerun the firewall init script:


    ```

    # /etc/init.d/firewall start

    ```


    Now, with the following command, restart your firewall from the outside:


    ```

    # nmap -sO 172.24.2.61

    Starting nmap 3.81 (http://www.inosec.org/nmap/) at 2005-05-04 20:03:26 CDT

    Note: Host seems down. If it is really up, but blocking our ping probes, -P0

    Mmap finished: 1 IP address (0 hosts) scanned in 2.565 seconds

    ```


    Great! Not only can ports be seen, but with the ICMP packet DROP rule, now nothing
    can be seen from a regular ping sweep (the fastest way that crashes scanners for
    machines).


    Don''t forget to save your work, and reboot to make sure all your changes are
    persistent:


    ```

    # save-config

    ```'
