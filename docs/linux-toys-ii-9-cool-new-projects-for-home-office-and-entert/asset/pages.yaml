  md: '# Building a Thin Client Server with LTSP


    # chapter 11


    Using a nicely loaded Linux server and a bunch of throwaway PCs, you can fill
    your small office, home, or classroom with usable workstations while saving thousands
    of dollars. With a little bit of setup (described in this chapter) you can reuse
    equipment destined for the scrap heap, often with no discernible loss of performance
    compared to running expensive PCs.


    The Linux Terminal Server Project (http://ltsp.org) was designed to use minimal
    hardware for workstations referred to as thin clients that are driven by a central
    server. Because the clients little more than a LAN card and the ability to drive
    a disc, mouse, keyboard, keyboard, almost any standard PC made in the past ten
    years can be used as a client.


    While setting up this project can be a stretch for new Linux users, it provides
    an opportunity to become familiar with a wide range of Linux features. In the
    process of setting up your LTSP server and clients, you will learn about configuring
    services (DHCP, TFTP, NFS, and XDMCP), working with boot images, and tuning and
    troubleshooting client workstations.


    # in this chapter


    +   - Understanding thin clients and servers


    +   - Getting a server and workstations


    +   - Setting up the server


    +   - Booting up the workstations


    +   - Troubleshooting the workstations


    +   - Expanding on LTSP


    > Although LTSP will run on a variety of UNIX and Linux systems, it entails a
    set of features that can vary from one system to the next. Using a Fedora or Red
    Hat Linux system will make the procedures a bit easier because Red Hat systems
    are used as examples in this chapter.


    ![](img/1b8a24a162893627b8005ac678b79236_313_0.png)'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Understanding Thin Clients, Servers, and LTSP


    Most of the work you do to use the LTSP project involves setting up the server
    so that all the software thin client needs to run is added to the server, configured,
    and ready to be grabbed. After the server is configured and networked to the clients
    (via a wired or wireless LAN), all you have to boot each workstation in a way
    that it can get what it needs from the server (I describe PXE and Ethernet methods
    for this).


    The first step is to choose a powerful enough server to handle the load and connect
    it to your workstations via a LAN. After that, the rest is setting up software.
    Figure 11-1 illustrates the general process of configuring your LTSP server and
    clients.


    ![](img/1b8a24a162893627b8005ac678b79236_314_0.png)


    The LTSP server is designed to run on a Linux or UNIX system. That server should
    also provide software for DHCP, TFTP, NFS, and XDMCP services. The LTSP software
    that you add to that consists of a few administrative commands (for getting the
    client software needed) and making sure that the server is configured for supplying
    that client software when they boot (The administrative utilities you download
    the client software from the network or get it from a local disk).


    The ltsp-packages contains the units ltspadmin (to download and install the LTSP
    client software onto the server) and ltspcfg (to check and configure services
    needed by LTSP). The CD that accompanies this includes ltsp-utils as an RPM for
    Red Hat Linux terms or zipped file for all. If you don''t have an Internet connection
    (which is the common method of grabbing LTSP software during the install procedure,
    the Linux II CD also includes the LTSP ISO images to provide all the software
    for the project.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# Chapter 11 — Building a Thin Client Server with LTSP 291


    LTSP stores the directory needed by each PXE workstation to operate in the /opt/ltsp/i386
    directory of the server. Most of the files and directories will be shared by all
    client workstations, you can edit the /opt/ltsp/i386/etc/ltsp.conf file to add
    specific settings relating to your workstation''s video card, mouse, run level,
    and other features.


    Services that you configure on your server for LTSP are so that the workstations
    can request what they need to run. DHCP must be set up to give each workstation
    its IP address and locations of such things as DNS servers on the network. However,
    LTSP also DHCP to identify the location of the bootstrap or Linux kernel each
    workstation needs to boot. The TFTPD service is used to actually download the
    bootstrap or kernel to each workstation.


    After a workstation boots, it is presented with a login screen (which is configured
    on the server using the XDMCP service). The user can log in through login screen
    using a regular user account on the server. The desktop, files, directories, processes,
    devices, and other components the user sees after login come from the server.
    The directory structure is provided by the server using the NFS service to share
    the /opt/ltsp directory (for the file system) and /var/opt/ltsp/swapfiles directory
    (to provide a swap area).


    I cover two ways for the workstation to boot: PXE and Etherboot. Although there
    are other boot methods, PXE will work for most workstations except for a PXE-enabled
    card. Etherboot allows you to load images that can be put on a floppy disk, copied
    to a CD, or from an eprom to boot the workstation.


    ![](img/1b8a24a162893627b8005ac678b79236_315_0.png)


    There are many features available in Linux for securing services, some of the
    features included in this project (such as NFS, TFTP, and X over a network) are
    not inherently secure. For that reason, I recommend using this project, as described
    here, to behind a secure firewall. If your server has an Internet connection,
    be sure that you block access to the LTSP services in your firewall so, but not
    from the Internet. Look to the LTSP project periodically for newer versions to
    patch potential security problems that might have been discovered after this book
    was printed.


    # Advantages of Thin Client Computing


    While being able to save money on workstations is a big incentive for doing this
    project, there are other ways of administering a group of workstations from a
    central server using LTSP:


    +   * **Backups**—Because for the workstations are all stored on one computer,
    you don''t have to manage separate backups from every computer in the group.


    +   * **Peripherals**—Instead of adding peripherals to every workstation, any
    peripherals (printers, scanners, removable media, and so on) attached to the server
    can be immediately available to every workstation without additional configuration.


    +   * **Central administration**—You can focus your security and administration
    efforts on the server. You don''t need to worry about each person''s work or what
    is being downloaded to hard disks over your LAN. You can focus your attention
    on managing user accounts, checking system load and watching network activity
    from the server.'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# 292 Part IV — Small Business Projects


    If you need to add workstations or there is an increase in system load, you can
    simply add resources (more RAM, processors, or hard disks) to the server. Total
    resource usage can be much more efficient because you don''t need to add all the
    resources a person might need to each workstation.


    # About the LTSP Project


    The Terminal Server Project (ltsp.org) is an open source project covered under
    the GPL. LTSP is actively developed and includes a very rich set of features that
    go well beyond the scope of this chapter.


    Jim McQuillan is the leader of the LTSP project and kindly agreed to review this
    chapter for accuracy. The primary contributors to the project include Jim McQuillan,
    Ron McKernan, Erick Tyack, Richard June, Andrew Williams, Jim Glutting, Scott
    Balneaves, Steve Switzerland, Mike Collins, Robbie Stanford, Gideon Rome, David
    Johnston, Chuck Leivaves, Ragnar Wisloff, and Bill Cavalieri.


    The LTSP project offers excellent documentation and support options. If you run
    into snaps during this chapter, there are some other LTSP resources you can turn
    to:


    +   **Documentation** — The LTSP documentation page (www.ltsp.org/documentation)
    provides links to a full set of LTSP documentation in English and Dutch, as well
    as translations in progress for French, Italian, Brazilian Portuguese, German,
    Norwegian, and Zulu. Earlier versions of LTSP also include Greek, Polish, and
    Finnish documentation.


    +   **Support** — LTSP offers several mailing lists, an IRC channel, and some
    support options in different languages (www.ltsp.org/support.php). There is also
    Wiki where you can find ways to learn and contribute (http://wiki.ltsp.org).


    While this is geared more towards old equipment, LTSP is also an excellent project
    for building high-performance client configurations in professional settings (which
    can save a lot of money). If you want help developing your environment, or simply
    to purchase certified LTSP workstations, you can visit the LTSP project''s DisklessWorkstations.Com
    company site (www.disklessworkstations.com). Purchasing products from this site
    helps the people who write LTSP


    # Getting a Server and Workstations


    The hardware you need for this LTSP project depends on the amount of load you
    expect to have. However, there are some guidelines that will help you choose the
    hardware you need for your LTSP server and workstations.'
