  md: '# Chapter 7 — Automating Home Lights and Gadgets with X10 205


    The sndc token indicates the origin of the signal from the Heyu command line.
    Signals received by the CM11A interface from the AC power line are identified
    in the monitor with the token rcei. To monitor your X10 activities, simply press
    Ctrl+C. To turn off the state engine, type the following:


    ```

    $ heyu stop

