  md: '# Chapter 7 — Automating Home Lights and Gadgets with X10 189


    +   **Heavy-duty appliance modules** — For high-wattage, 220V appliances (including
    water heaters, air conditioners, stoves, or pool pumps) you can purchase 20-amp
    appliance modules. For example, Leviton makes an appliance module that can turn
    your 220V devices on or off X10 or a local switch (see www.smarthome.com/2210i.html).


    On the whole, plug-in modules are fairly inexpensive. You usually get at least
    one with an X10 starter kit. More expensive modules will support two-way communications
    and include the capability to save settings, even if the unit is unplugged.


    # Choosing Hardwired Modules


    If you don''t like plug-in modules sticking out of the power outlets all over
    your house, there are some other options available. Many X10 devices are designed
    to be hardwired directly to your house wiring. Here are a few examples:


    +   * **Inline modules** — You get inline receiver modules that can go inside
    a lighting fixture or inside an electrical box.

    * **Wall modules** — By installing an X10 wall switch, a light can be turned on
    and off from an X10 signal or directly from the wall itself.

    * **Screw-in modules** — There are modules that screw directly into lamp sockets
    and receive X10 codes to turn the light bulb screwed into them or off.

    * **Motion detectors** — Most motion detectors will simply turn on a light that
    is connected to them. X10 motion detectors can be set to a house code, so they
    can turn on or off any X10 device in your house.

    * **Wired cameras** — These cameras can be configured to any house code and number,
    so that they can be turned on and off from your computer, a handheld device, or
    even a motion detector.


    # Choosing Other Interesting X10 Hardware


    Besides lights, motion detectors, and cameras, there are interesting X10 hardware
    devices you might not have thought of. To control a set of low-voltage X10 devices
    from a source, you can use a relay controller.


    Relay controllers are for good things like sprinkler systems, when you have multiple
    zones you want to control from a single location. Relay controllers come in sets
    of four (www.smarthome.com/2310.html) and eight (www.smarthome.com/2315m.html)
    relay inserts. Instead of plugging lamps or appliances into these devices, simply
    connect the wires for the devices you want to contact contacts.


    ![](img/1b8a24a162893627b8005ac678b79236_213_0.png)


    While it is possible to attach X10 modules to turn such things as fireplaces,
    heaters, HVAC dampers, and air conditioning on and off, it is dangerous to do
    so by its nature. In fact, it is possible for the power lines to turn a device
    on or off. Therefore, X10 devices should never be used to control devices that
    could injure people or property if they were to go off or on unexpectedly.'
