  md: '# 202 Part III — Home Projects


    You can see that additional schedule files are commented out, indicating that
    you can create and use extra schedule files if you like. Heyu comes with a sample
    schedule file in the /etc/heyu directory (x10_schedule.sample) that you can modify
    to use you like. (Creating schedule files is covered in more detail later in the
    chapter.)


    # Setting Mode


    With MODE to COMPATIBLE, the schedule file is set up to start on January 1 (current
    year) and will remain in effect for 366 days. So the schedule is active until
    December 31 on a leap year or 1 on other years. That''s the default, as shown
    here:


    ```

    MODE COMPATIBLE # COMPATIBLE HEYU

    ```


    With set to HEYU, the CM11A is a run with active clock, causing the schedule to
    begin on the date the schedule is uploaded. You can then use the PROGRAM_DAYS
    directive to set the number of days that the configuration file is valid. (Using
    the X10 ActiveHome software for Windows can cause trouble if you are running HEYU
    mode, if ActiveHome is allowed to reset the CM11A clock to begin on January 1.)


    The advantage of Heyu mode is that the schedule file can be reloaded at any time
    it expires and will be valid for the next 366 days (or a shorter period as described
    following), whereas COMPATIBLE mode the schedule must be reloaded exactly on January
    1 if it is to be accurate after date.


    As indicated by the following line, if you are in HEY mode, PROGRAM_DAYS is set
    to 366 days (which is the default). Setting this to a shorter period will provide
    better accuracy when Dawn-Dusk time events are included in an uploaded schedule.


    ```

    PROGRAM_DAYS 366 # [number of days 1 to 366]

    ```


    # Setting Latitude and Longitude


    Heyu needs to know the latitude and longitude of your location in order to calculate
    the times of dawn and dusk when referenced in a schedule file. It can be omitted
    until such time you want to create a schedule file that requires them. The format
    for these directives is illustrated in the example for Muleshoe, Texas:


    ```

    LATITUDE N34:14

    LONGITUDE W102:44

    ```


    In the example, the (N/E/W) is prefixed to the value of these variables expressed
    in degrees and minutes. (You can look up your latitude and longitude from the
    Astrodient site at www.astro.com/atlas.)


    There are other directives you can set in the $HOME/.heyu/x10config file as well.
    For a description of other available directives, refer to comments in that file,
    or type the command man x10config to read the configuration file''s man page for
    a complete list.


    # Step 2: Running Heyu Commands


    The heyu command is the primary tool for using Heyu. There are more than 70 he
    commands, to do everything from administration (such as monitoring and resetting
    house codes), to changing the state of the Heyu engine, by directly sending X10
    signals (unit on, off, dim, and like):'
