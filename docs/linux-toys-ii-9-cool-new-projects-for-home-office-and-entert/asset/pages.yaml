  md: '# 122 Part II — Multimedia Projects


    # Summary


    Building your own MythTV media center can be a daunting task, but one that will
    give you a much more powerful and useful media center than anything that is currently
    on the market.


    Step by step, I showed you how to take off the shell components and build your
    own Linux-based PVR media center system. With your MythTV project up and running,
    you can begin watching television, recording video, playing music, and managing
    digital images.


    MythTV is much more than just another PVR. It really changes the way you watch
    TV and interact with streaming information sources such as news and weather. And
    it even gives you a video game console and digital photo album. MythTV gets you
    this audio/video resource convergence, but still allows you access to those resources
    from anywhere on the network. Because a MythTV system is a full-blown (and powerful)
    computer system, you can hook up devices such as photo printers, scanners, faxes,
    answering systems, home automation hardware and software, motion detection cameras,
    and more.


    By building your own MythTV media center, not only do you get some of the coolest,
    most cutting-edge multimedia convergence technology all in one box, you also learn
    a lot about multimedia and real-time technologies on Linux. Not to mention that
    you''ll bowl over all your friends by showing them the sleek, cool side of what
    Linux can do.'
