    # Making Your BZFlag Server Public


    This is a test, remember. So, what I''ve described so far is a way of setting
    up a BZFlag in a fairly safe environment, such as your home or small office LAN
    that is behind a firewall or not connected to the Internet. Because it is so easy
    to make the BZFlag server public, however I would throw it in a few warnings:


    +   **Come and get me!** — Listing an unprotected Linux server in a public directory
    (such as those used with BZFlag) is like holding up a sign to bad guys that you
    want to get. Don''t advise this, or any other Linux service, until you have properly
    secured your Linux machine. If you don''t know how to do that, start with a book
    that covers the basics, such as Red Hat Fedora and Enterprise Linux 4 Bible (Wiley,
    2005). Follow up with a more in-depth book about how not to get hacked, as Linux
    Troubleshooting Bible (Wiley, 2004).


    +   **Keep up with patches** — Vulnerabilities in Linux are continually exposed
    and fixed. Keep up with available patches to your operating system and server
    software to limit your exposure.


    +   **Set up a chroot jail** — Again, to limit your exposure, you can set up your
    BZFlag server in a chroot jail. Running the server prevents anyone from getting
    across your entire file system. Using a non-root user limits an attacker''s ability
    to take over ownership of the machine. http://BZFlag.org/site tells you how to
    adding -public and -publicaddr options to your bzflags configuration file. Here
    are some examples:

    -public Linux Toys Server - -chroot%20Jail


    Actually adding to a BZFlag directory for public access is easy. You can do it
    by adding -public and -publicaddr options to your bzflags configuration file.
    Here are some examples:


    ```

    -public Linux Toys Server - Capture the Flag Tank Battle

    -publicaddr example.com:5154

    ```


    The -public option adverts your server to the Internet and identifies the one-line
    message that will be displayed from the BZFlag list that is queried by BZFlag
    clients. The -publicaddr option is used to indicate the address of the server
    (which may be different than the host your computer might give by default). The
    name must be a valid, Internet domain name system.'
