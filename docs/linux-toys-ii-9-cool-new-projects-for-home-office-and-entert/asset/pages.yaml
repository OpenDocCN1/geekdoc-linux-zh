  md: '# Chapter 6 — Customizing a Live Linux Drive 157


    # # Using Damn Small Linux


    The Live Linux included on the Linux II CD is called Damn Small Linux (http://damnsmallinux.org).
    It is derived from KNOPPIX, but instead of fitting on a 700MB CD, DSL can fit
    in only 50MB on the boot medium. This makes DSL an excellent choice for running
    from bootable business cards, small pen drives, or specialized devices with limited
    memory.


    Besides taking up much disk space, applications for DSL were chosen to get the
    maximum functionality while running as efficiently as possible. The small demands
    on the system also make DSL a good Linux project if you have less powerful hardware.
    The mini-computer you need to run DSL is 486DX CPU and 128MB of RAM.


    Because DSL is so small, the entire operating system can be run from RAM, with
    as little as 128MB of total RAM available. That, combined with efficient applications,
    can make DSL run faster than operating systems installed on hard drive.


    Another good of DSL that is appropriate to demonstrate how to set up a customized
    Live Linux distribution is its capability for installing applications tailored
    specifically for DSL and its ability to carry them across reboots. Likewise, any
    configuration or other files you create during a DSL session can be saved and
    carried across reboots.


    John Andrews created Damn Small Linux ''as an experiment to see how many useful
    desktop applications can fit into 500MB Live CD.'' Robert Shingledecker joined
    DSL version 0.5 and is the developer responsible for almost all the custom features
    (including those described in this chapter). Both have been extremely generous
    in providing feedback to me on this chapter.


    There is a active user forum and many user-contributed extensions. Ken Porter
    manages and interacts with the user community to support the library of user-contributed
    extensions.


    Damn Small Linux also has a very active forum in which you can participate (http://damnsmallinux.org/cri-bin/forums/ikonboard.cgi).
    If you want to support the project, DSL has an online store (http://damnsmallinux.org/store)
    where you can purchase DSL on a CD or pen drive, as well as purchase Mini ITX
    systems.


    # # Choosing a USB Pen Drive


    To create a customized Linux installation from Damn Small Linux, I chose to use
    a pen drive as the medium for several reasons. The first is that the medium is
    rewritable, so that both the operating system and data can be carried on the same
    medium. The size is very appealing (they can be smaller than a cigarette lighter)
    and prices have come down drastically in recent months. (I bought a 1GB USB pen
    drive for $50 and it seems to be working fine.)'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# 158 Part III — Home Projects


    In choosing a pen drive for a customized DSL pen drive, there are a few things
    you should know:


    +   - Pen drive is just one for solid-state USB storage devices that are typically
    shaped like a pack of gum. You might also hear people refer to them as flash drives,
    key drives, USB sticks, memory thumb drives, or similar names. They also come
    in different shapes.

    - All power for the pen drive comes from the USB port it connects to.

    - Because pen drives are typically encased in plastic, they can be harmed by scratches
    or dirt, the way that CDs, DVDs, and floppy disks can.

    - Available versions of USB pen drives are 1.0, 1.1, and 2.0. The 1.0 and 1.1
    versions run at speeds of 1.5 Mbit/s or 12 Mbit/s. The 2.0 versions can do of
    speeds up to 480 Mbit/s (although the highest reading speed is around 100Mbit/s).

    - Linux views pen drive as mass storage devices. Often, Linux desktop systems
    are configured to mount and display an icon for a pen automatically after it is
    inserted, without needing any additional drivers.

    - Computers with recent BIOS can be configured to boot directly from the USB drive
    (recognizing it as a USB-ZIP or USB-HDD device). Other computers may need to start
    the boot process from another medium before accessing the USB pen drive.


    The combination of cost, convenience, durability, and support by most modern computers
    makes a pen drive a good medium for creating a customized, bootable live Linux.


    # Making a Damn Small Linux


    Starting with the Damn Linux on the Linux Toys II CD that can come with this book,
    this chapter takes you the process of customizing your Damn Small Linux to run
    on a USB drive. I recommend you start with the following:


    +   - Linux Toys II CD

    - A USB drive that holds at least 64MB, although at least 128MB will give you
    more flexibility for configuring Damn Small Linux and adding your own data and
    applications (I used a 1GB pen drive).

    - A PC with a USB port. If possible, the PC should be set up to connect to the
    Internet because you''ll need a connection to download applications you want later.
    DSL can automatically connect to the Internet from a wired Ethernet connection
    that has a DHCP server on the line (as most connections from an ISP). (If the
    PC can''t boot from a USB port, you can use a floppy disk or CD to boot and access
    the pen drive, as described later).


    The basic procedure for customizing your own pen drive is to boot DSL from the
    Linux Toys II CD, install DSL to the pen drive, reboot DSL from the pen drive,
    and then add custom applications, settings, and data to the drive. Figure 6-1
    illustrates these steps.'
