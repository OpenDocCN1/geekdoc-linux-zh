  md: '# Chapter 11 — Building a Thin Client Server with LTSP


    # Playing with Local Workstation Features


    If your client workstations are capable of handling more than an X, why not take
    advantage of that? Here are a few things you can do to add printers and applications
    directly to your workstation.


    # Getting to Your Workstation''s Operating System


    If you want to open up the inner workings of your workstation, you can add LTSP
    "screen scripts" to open shell access to that workstation. Using screen scripts,
    you can add additional virtual terminals on the workstation that gives you a view
    of the local system.


    By default, one screen is open on each workstation, based on this entry in the
    lts.conf file Default section:


    ```

    SCREEN_01 = startx

    ```


    You can add an additional SCREEN_?? in a workstation section to allow you to open
    a shell on that workstation. For example, to have the second virtual terminal
    on the workstation namestation003 to open a shell, you could add an entry as follows:


    ```

    [station003]

    SCREEN_02 = shell

    ```


    Because SCREEN_01 is the GUI, the SCREEN_02 line to be able to open a shell from
    the second virtual terminal (press Ctrl+Alt+F2 on the workstation) to see a shell
    prompt and Ctrl+Alt+F1 to go back to the GUI. In this arrangement, SCREEN_01 gives
    you a view of the server system (files, directories, processes, and so on), SCREEN_02
    lets you process and files on the local file system. The second view shows you
    the limited Linux system running locally in RAM (type ps ax), providing enough
    features to allow the GUI framework (X Window System) to run.


    Besides "there are also ways of having a virtual terminal open to other types
    of services. You can add a telnet session (SCREEN_02 = rdesktop -f hostname) or
    log in to a windows server (SCREEN_02 = r hostname).


    # Using a Workstation Printer


    LTSP also includes features for connecting a printer to your local workstation
    and making that available to all the workstations in your LTSP group (if you choose).
    The workstation operating system uses a utility called lp_server to add printer
    server capability to the workstation. Here''s how you set up that:


    +   1. Connect your printer hardware to your workstation.


    +   2. On the server, add entries for PRINTER_0_DEVICE and PRINTER_0_TYPE to the
    definition for the workstation in the lts.conf file. For example, to add a printer
    to workstation002 that is connected to the first parallel port on the workstation,
    you could enter the following:


    ```

    [station002]

    PRINTER_0_DEVICE = /dev/lp0

    PRINTER_0_TYPE = P

    ```'
