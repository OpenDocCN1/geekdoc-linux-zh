  md: '# 124 Part II — Multimedia Projects


    # # Overview of MoviX² and eMoviX


    The MoviX project (http://movix.sourceforge.net) is a collection of several projects
    (eMoviX, MoviX²) designed to create a small Linux distribution that can be used
    primarily to players. MoviX² contains the most complete set of multimedia playing
    components. MoviX is a stripped-down version of MoviX, which you can use if you
    have less than 128MB of RAM on your computer. The eMoviX project was actually
    the first of the three projects and includes software for mastering ISO images
    of the player video content.


    Because MoviX is an actual, bootable Linux distribution, and not just a media
    player, you can play content nearly any PC — essentially ignoring whatever operating
    system is on the computer''s hard disk. The focus of this project is eMoviX, which
    is a micro version of MoviX² that was created to co-exist on a CD or DVD over
    video content.


    # # Understanding eMoviX


    The eMoviX project lets you create your own customized, MoviX² version that can
    boot and play your personal video content. The fact that eMoviX software is small
    (under 10MB) allows most of the software to be contained on the initial RAM disk
    (initrd.gz). Once the RAM disk is loaded into the kernel and booted, eMoviX has
    only to access the CD or DVD to get the video content.


    The eMoviX software includes a RAM disk that was built inside a User-Mode Linux
    session (http://usermodel.org) using Debian GNU/Linux packages. Roberto De created
    eMoviX to contain only components needed to support the player (such as extra
    drivers for audio and remote controls). eMoviX includes BusyBox (http://www.busybox.net),
    a single utility that includes many Linux commands. The parts needed to make the
    CD bootable come from the SYLINUX kernel (http://syslinux.zyter.org). As for the
    Linux kernel, 2.4.22 is included with the version of eMoviX that comes with this
    book.


    MPlayer (http://mplayerhq.hu) is the media player using eMoviX, and Advanced Linux
    Sound Architecture, ALSA (http://www.alsa-project.org) is the sound system. When
    you or your friends want to play back your movies, MPlayer plays in full screen.
    You can use your keyboard to control the playback (in this chapter, Table 5-1
    provides an MPlayer cheat sheet on how to use the keys).


    Limitations on what you can play with your eMoviX bootable movies are based on
    the codecs and video file formats that MPlayer supports and the size constraints
    of the medium (CD or DVD) you choose to use. In other words, the hardest part
    of this project is getting the video you want to include onto your computer.


    # # Understanding MoviX²


    Instead of booting directly to a custom video, the basic MoviX² boots to a set
    of menus that gives you more flexibility in the type of content you can play and
    how you play it.'
