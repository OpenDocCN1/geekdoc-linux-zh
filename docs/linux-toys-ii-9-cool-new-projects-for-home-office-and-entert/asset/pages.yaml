    (if you''re using the recommended Silverstone case).


    If you want a convenient way of looking for RPMs in Fedora Core''s stock RPM repository,
    the command up2date-nox--show-all > RPM-showall.txt once in a while. This will
    allow you to browse through all the Red Hat-sourced RPMs, otherwise or not.


    # Installing and Setting up the ATRMPS System


    The MythTV suite, as installed by Jarod''s guide, relies not on the stock Red
    Hat-sourced RPM/repository, but instead uses rpm.net instead of apt-based RPMs.
    It''s a pretty nice system, but on that it works a bit different than the up2date/yum
    method of downloading RPMs. To get this package repository and download engine
    working on your system, you first need to import directly to the signed RPMs that
    it provides. You can do this with one-line command:


    ```

    # rpm --import http://atrpms.net/RPM-GPG-KEY.atrpms

    ```


    Next, the quickest way to get apt for RPM on your system is to use ATRMPS''s own
    atrpms-kickstart package to get up and running:


    ```

    # rpm -Uvh http://atrpms.net/all/atrpms-kickstart-28-1rhfc3.i386.rpm

    ```


    > If you are running a different version of Fedora, to get the main ATRMPS Web
    page, click your version of Fedora, and download the appropriate atrpms-kickstart
    package. For example, at this time of writing, the Fedora Core 4 version of the
    package is located under http://atrpms.net/dist/fc4/atrpms-kickstart/. Click the
    first atrpms-kickstart file and Linux downloads installs the package for after
    you provide your root password.


    > If you have problems getting it, check the manual instructions on the atrpms.net
    site http://wilsonet.com/mythtv/install.html, or look for updates in Jarod''s
    guide at http://fcmyth.php#apt.


    After you apt-get system installed, to test your ability to talk to the repository
    by updating your local apt package data files:


    ```

    # apt-get update

    ```


    This should update your local package list and dependency tree.'
