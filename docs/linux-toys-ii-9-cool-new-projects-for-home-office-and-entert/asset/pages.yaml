- img_proc: true
  md: '# 232 Part III — Home Projects


    As an administrator of a public BZFlag server, there are some tools that you can
    use to kick out/or ban who don''t behave properly. The first trick is to detect
    the bad behavior and the second is to deal with it.


    Sometimes a player''s client takes too long to respond, causing the player''s
    movements to be followed by opposing players. This is called lag. In most cases,
    lag is just the result of a long-distance or someone with a slow Internet connection.
    If lag occurs repeatedly for long periods of time (600 milliseconds or more),
    it can disrupt the game experience for all players. It might also be an indication
    that the person is using lag time to ban the player after a certain number of
    warnings.


    The first issue is to set how high a lag is too high. Here, the lagwarn option
    is used to set the lag threshold to 600ms. A number above this results in a warning:


    +   - lagwarn 60


    Using the -lagdrop option, you can see how many times a player is warned about
    lag before being dropped. Here, players are dropped after four warnings:


    +   - lagdrop 4


    If you notice players repeatedly cheat or disrupt the game coming from a particular
    IP address (or set of addresses), you can add players to a ban list. The following
    identify the location of a banlist (-banfile) and indicate IP addresses to ban
    (-ban). The ban list takes effect at startup time and is updated during game play
    (as users are banned or removed from the ban list). Note that wild cards (*) can
    be used to indicate a range of IP addresses:


    +   - banfile $HOME/banfile

    - ban 10.0.2..*,192.168.1.50.2..**


    Sending the message repeatedly during game is considered spamming. You can set
    the threshold for the time between someone sending an identical message, and decide
    how many warnings about this behavior are given before the person is kicked off.
    Here are some options that relate to spamming messages during BZFlag play:


    +   - spamtime 9

    - spamtime 4


    In the preceding example, if an identical message is sent within nine seconds
    of the first, it is considered a spam message (-spamtime 9). After four warnings
    of behavior, the person is kicked off the server.


    Killing teammates more than you kill opponents is considered antisocial behavior.
    The following option kicks a person off if more than 25 percent of that person''s
    kills are their own teammates.


    +   - tkkr 25


    BZFlag also includes the ability for servers to offer a voting system to vote
    a player off the server. An administrator sets the percentage of people needed
    for a successful vote, votes needed to make a valid vote, and other attributes
    related to voting. (See the poll option on the bzfs page for details.)'
  merge: -1
  pgno: 256
