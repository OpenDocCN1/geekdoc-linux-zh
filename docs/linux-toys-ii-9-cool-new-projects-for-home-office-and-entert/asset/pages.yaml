    Feeding Audio from a Playlist (IceS2)

    To feed audio using the ices command and a playlist, you need to edit an ices-playlist
    .xml file. Create a directory to hold your playlist, and copy the ices-playlist.xml
    file as follows:


    ```

    # mkdir $HOME/myces

    # cd $HOME/myces

    # cp /usr/share/doc/ices-* /ices-playlist.xml $HOME/myces/

    ```


    In the ices-playlist.xml file, you can identify log file information (metadata)
    by the audio stream, the input type (in this case a playlist), and each instance
    of the stream. You can have multiple instances to send the audio stream to multiple
    servers or to the same server that will forward the stream under different names
    (mount points) or bitrates.


    A mount point in IceS2 is part of the URL of a stream that identifies particular
    stream uniquely on an Icecast server. The point name always begins with a slash
    (/).


    Step 1 contains examples of changes I made to a stream section of the ices-playlist.xml
    file. The steps describe how to create a playlist, start the ices command, and
    check the log files.


    +   1. Edit ices-playlist.xml. Open your $HOME/myces/ices-playlist.xml file using
    any text editor. The following takes you through parameters you should consider
    changing.


    > Information about ices activity is, by default, sent to the file /var/log/ices.log.
    You can change the location (as I changed mine to /chris/myces), the maximum size
    of the log (2,048KB), or level of log messages. You can also set console=1 (instead
    of 0) to have log messages go to the console of the log file.


    ```

    <path>/home/chris/myces</path>

    <logfile>ices.log</logfile>

    <!-- level=1=error,3=info,4=debug -->

    <level>4</level>

    <consolelog>0</consolelog>

    ```


    Information in the following metadata example sets the name, genre, and description
    of the audio stream to anything you like.


    ```

    <metadata>

    <name>MusicBlitz Radio</name>

    <genre>Alternative, rock and hip-hop</genre>

    <description>Eclectic mix of music, 24x7</description>

    </metadata>

    ```'
