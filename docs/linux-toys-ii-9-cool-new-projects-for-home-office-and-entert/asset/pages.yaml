    piece of hardware.


    If you are using a different Linux distribution, few offer complete hardware compatibility
    lists. Your best is to search Web sites and forums for your Linux distribution
    for any particular hardware item that is in question.


    As places where you can read about general hardware support in Linux, you can
    start with the Hardware section of the LDP HOWTO-Index (www.tldp.org/HOWTO/HOWTO-INDEX/hardware.html).
    That will provide you with links to other HOWs about Linux.


