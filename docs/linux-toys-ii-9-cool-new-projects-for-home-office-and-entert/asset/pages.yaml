    # Setting up the DataDirect Channel Listing Service


    DataDirect is a free Internet-based channel listing hosted by zap2it.com. It''s
    mostly a free service that you get in three-month chunks for occasionally filling
    out their devices. This is the new way in which MyThTV gets its channel listings.
    The old way, a setup that went every time they changed the look and feel of their
    Web interface, hinged on libcurl and screen scraping. This new DataDirect-based
    service is a real godsend.


    Subscribing to DataDirect


    To join the free (at money) service, you just need your postal zip code and a
    few minutes (and an Internet connection, of). If the instructions do not work,
    then something at MyThTV has probably changed. If the service stops working as
    described here, refer to the MyThTV guide at http://mythtv.org/mythtv-HOWTO-5.html#ss5.3
    or http://labs.zap2it.com/ for updated information.


    +   1. First, have a Web browser at http://zap2it.com/ and click New User? Sign-Up.
    Read the license agreement and click Accept.

    2. On the Subscription Registrations screen, enter the Certificate Code from MyThTV.org
    HOWTO

    www.mythtv.org/docs/mythtv-HOWTO-5.html#ss5.30

    3. Fill out the survey and click Submit.

    4. Move on to the Lollipop Wizard and plug in your zip code and channel provider,
    and start selecting the channels you receive with whatever cable/provider package
    that you have (see Figure 4-5). Remember to write down your name/password for
    this zap2it.com service, as you will be poking into your MyThTV configuration
    so that you can pull the channel listings over the Internet.'
