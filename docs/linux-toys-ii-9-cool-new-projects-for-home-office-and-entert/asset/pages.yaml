  md: '# Appendix C — Installing Linux 357


    # Installing Other Red Hat Linux Systems


    Much of the installation procedure described here is the same as you will find
    when you install a Red Hat Enterprise Linux system. However, here are a few issues
    you should be aware of if you are using the installation procedure in this chapter
    to install Red Hat Enterprise Linux.


    +   Instead of having a DVD or four-CD installation set, Red Hat Enterprise Linux
    consists of a different boot CD for AS and WS installs. After starting installation
    with the appropriate boot CD, both installs use the same set of additional CDs
    (marked disc2, disc3, and disc4).


    +   Installation classes for Fedora and Enterprise are different.


    +   Unlike the Fedora installation, which installs all CDs in order, Red Hat Enterprise
    Linux requires that you insert the boot CD again near the end of the install process.


    Aside from those differences, an installation of Red Hat Enterprise Linux 4 should
    closely match the instructions in this chapter. There are differences in packages
    which are included with the Fedora and Enterprise distributions,


    In addition to installing Fedora from the DVD or CDs, you have the option to use
    several different types of installation (hard disk, PXE, HTTP, or FTP to name
    a few). Most of these methods involve copying the Fedora Core software to an accessible
    hard disk or network location and launching a special type (such as linux askmethod)
    at the installation boot prompt.


    # Install or Upgrade?


    First you should determine if you are doing a new install or an upgrade. If you
    are upgrading an existing Red Hat Linux or Fedora system to the latest version,
    the installation process will try to layer your data files and configuration files
    as much as possible. This type of installation takes longer than a new install.
    A new install will simply erase all data on the Linux partitions (or hard disk)
    that you choose.


    > While you can upgrade to Fedora Core 4 from previous Fedora or Red Hat Linux
    systems (such as Red Hat Linux 8 or 9), you cannot upgrade to Fedora Core 4 from
    a Red Hat Linux system.


    ![](img/1b8a24a162893627b8005ac678b79236_381_0.png)


    If you choose to upgrade, you can save yourself some time (and disk space) by
    removing software packages you don''t need. An upgrade will just skip packages
    that are not installed and will not try to upgrade them.'
