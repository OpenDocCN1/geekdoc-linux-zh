  md: '# 234 Part III — Home Projects


    The first option sets a simple debugging level (-d). By adding more -d lines or
    putting a bunch of d on one line (-dddd) you can increase the amount of debugging
    information that is output to the server.


    If you want to watch the scoring from your server, you can add the -pintscore
    option:


    ```

    -pintscore

