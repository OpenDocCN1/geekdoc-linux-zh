  md: '# Chapter 9 — Building a Dedicated SOHO Firewall 245


    I started out with a CPU speed multiplier of 4x and an 100 MHz FSB/clock, for
    example, I just downed the system, removed the fan, and changed the multiplier
    down to around 50 to 65 percent of the CPU speed (2–5x multiplier). After you
    try that yourself, power the system back up and the CPU temperature in the real-time
    BIOS readings if you have that option. Hold down an arrow key for 5 minutes while
    the BIOS temperature to get some type of CPU load (which makes heat). Most utilities
    are extremely inefficient and place a few demands on the CPU. While testing, you
    will not wander your P2/P3/586/688 system to get much hotter than 125°F (-52°C).


    If you don''t have BIOS temperature indicators, you can do intensive RAM tests
    using Devil-Linux memtest utility (from the Memtest-8 package) and placing your
    hand on the side of the CPU. To do this, boot your Devil-Linux CD to the CD boot
    menu, ensuring your BIOS order has CD-ROM listed first, and at the Devil-Linux
    boot menu, type /memtest. It will hammer your system’s RAM and hold the system
    enough to get some type of “burn temperature reading.” Use the temperature test
    as your benchmark. If it’s too hot to touch your hand on more than 2 seconds,
    then you need to step down by half a multiplier and try again.


    # Importance of Heat Sink Size and Thermal Interfacing


    If you’re running a system without a fan, you need to be sure that your heat sink
    can dissipate the heat from the CPU quickly, even when under-clocked. This boils
    down to two things: is your heat sink large enough to dissipate the CPU’s thermal
    output and is your CPU-to-heat sink interface migrate heat out of your CPU and
    be radiated into the air.


    The size of your heat sink matters. If you have one of those 1-inch-high heat
    sinks with a fan, that probably won’t work without the fan. I recommend one of
    the larger 2–2.5-inch heat sinks (see Figure 9-2) before attempting this fan-less
    undering trick. Otherwise you could damage your CPU and/or system. As the CPU-to-heat
    sink interface, for this project I recommend using thermal compound (silicone
    grease) to thermally connect and conduct heat from your CPU to your heat sink.


    Some say that heat sink silicon compound is no good because on/off power cycling
    causes are called thermal migration or “edge pooling,” while most modern PC manufacturers
    now use Thermal Pads or Phase Changing materials. While thermal compound migration
    is a problem on desktop PC systems that are constantly turned on and off after
    day, your firewall will stay on for months or at years, this is not a problem.
    Just be sure that your heat sink and CPU surface are clean, smooth to the touch,
    and you apply the compound thicker than you would if you were lightly painting
    the surface. Globs are bad and messy.


    If you want to really increase the efficiency of your heat sink, check out the
    information in Chapter 4, in the section “Assembly Tips.” There is a useful link
    on how to lap (or polish) your heat sink’s CPU-side interface to easily knock
    10–20 degrees off your CPU temperature.'
