  md: '# Understanding X10


    If you have electrical power running through your home or business, you can probably
    use X10 to control your lights and various devices. X10 is a simple protocol that
    allows X10 devices to communicate across power lines in your building. It is a
    protocol that broadcasts codes that each X10 device connected to the same power
    system can. Each device responds to the codes based on its own settings.


    X10 devices are identified by an address that is represented by a single-letter
    code (from A to P) and a unit number (from 1 to 16). That lets you have up to
    256 controllable devices in your location. Because all devices see every command,
    however you can have multiple units with a particular house code/unit (for example,
    one code/unit number might turn on over outside lights).


    Although the X10 signals for turning devices on and off (or dimming them) are
    sent over your power lines, those signals can originate from radio frequency (RF)
    transmitters that talk to X10 devices (called transceivers). Those transmitters
    can be such as handheld remote or devices connected to your computer (which is
    what we are interested most with this project).


    Figure 7-1 shows an example of an X10 configuration that includes a variety of
    X10 devices controlled from handheld remotes and computers running Linux X10 applications.


    ![](img/1b8a24a162893627b8005ac678b79236_210_0.png)


    Figure 7-1: Control X10 devices from computers running Linux.'
