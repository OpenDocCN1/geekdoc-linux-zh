  img_proc: true
- pgno: 11
  md: '# Introduction to VoIP Security • Chapter 1


    Toll fraud occurs more frequently than most people realize (one estimates damages
    at $4 billion per year) primarily due to improperly configured remote access policies
    (DISA—Inward System Access) and voicemail; however, strong authentication codes
    and passwords, active call record accounting, and physical security controls reduce
    the risk of damage to toll fraud to reasonable levels. Although it is theoretically
    possible to “hack” SS7, only sophisticated techniques and direct access to the
    signaling channel make this possible.


    Unlike standards in data networking—for example, TCP/IP has been relatively stable
    for more than 20 years now—there is a high degree of inconsistency in support
    and implementation of VoIP-related standards, due to the rapid evolution of the
    standards themselves, and due to in vendors locking in customers to nonstandard
    protocol implementations. The consequence of this is that, in some cases, immune
    (vulnerable) applications have reached the market. Vendors are oftentimes familiar
    with their specific application protocol implementation, and when designing a
    security solution, aren’t always concerned about interoperability. This is actually
    ironic because some vendors want standards to foster interoperability.


    An additional difference between VoIP and common protocols is that both VoIP protocols
    run over dynamic IP address/port combinations. This has significant security implications
    that will be detailed later in this book. If you combine this (separate signaling
    and data channels) with the reality that users expect to be able to make both
    inbound and outbound calls, you should begin to realize that VoIP is more challenging
    to secure technically than common protocols that initiate with outbound client
    requests.


    VoIP is difficult to firewall. Additionally, since IP addressing information is
    cascaded within the signaling stream of H.323 and within SIP control protocols,
    encryption of these streams—an obvious security measure—reeks with NAT implementations.
    IPv4 was not invented with real-time communications and NAT in mind.


    In addition to the vulnerabilities and difficulties that we have summarized, converged
    networks offer an array of new vectors for traditional exploits and malware. This
    is due in part to the unique performance requirements of the voice fraction of
    converged networks, and in part that more intelligence (particularly in the case
    of SIP) is moved from the guarded center to the edge of the network. Increased
    network points of access increased network complexity—and complexity is the bane
    of security engineers. In addition, SIP may become particularly attractive as
    hacking target, due to its HTTP underpinnings, and the ease with which ASCII encoded
    packets can be manipulated.


    Are these new problems? Not all from malicious actions or inadvertent user errors,
    and from natural and man-made disasters. In recent years, systems have become
    more susceptible to these threats because computers have become more interconnected
    and, thus, more interdependent, and these systems have become accessible to a
    larger number of individuals. In addition, the number of


