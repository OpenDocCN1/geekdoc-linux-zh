- pgno: 337
  md: '# Introduction


    The past decade has seen an explosion of government regulation that will directly
    or indirectly affect VoIP implementation security. Some of these regulations can
    be addressed by selecting and implementing compliant equipment, but the vast majority
    of these are operational in nature, meaning that to ensure compliance you''ll
    need to pay more attention to (1) how your IP communications systems are designed
    and (2) how your organization''s business and IT operations are using the equipment
    once it''s live.


    For this chapter, each applicable set of regulations will be discussed separately.
    What you''ll want to ask yourself in each section is:


    +   - Does this regulation apply to me and my organization (or my client''s organization)?


    +   - Who in my organization has responsibility for overall compliance with this
    regulation? In some cases, the answer may be you if there'' isnt already someone
    designated, but for many of these regulations your organization is likely to have
    a person or group specifically designated as the leader for addressing compliance,
    particularly with regulations for which security is an ancillary component of
    the overall regulation.


    +   - Is it likely that my systems and/or operations are not compliant with this
    regulation today? If you suspect that remediation is necessary, it''s important
    to raise the concern to the appropriate level of management in a way that allows
    the issue to be corrected and reduce the risk of fines, negative publicity, or
    worse.


    > WARNING\Always consult experienced legal counsel (or your organization''s audit
    or compliance department) for legal advice regarding regulatory issues that could
    materially affect your organization. Although this chapter highlights the most
    common regulatory concerns surrounding VoIP, it cannot provide complete guidance
    for every situation or jurisdiction. For instance, VoIP itself is considered illegal
    in certain countries when it bypasses national carriers (sometimes known as PTTs)
    who may have a telecommunications monopoly. And new data privacy laws around the
    world seem to appear monthly.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Regulatory Compliance • Appendix C 335


    # NOTE


    Despite the aforementioned caveat, you may find that the compliance experts available
    to you are not familiar with VoIP and how to apply broad regulations like GLBA
    or HIPAA to voice and real-time communications systems. To help with these situations,
    pay special attention to the “Tools & Traps” sidebars in this chapter. They will
    provide specific guidance for you to share with a specialized compliance expert
    in that area of regulation.


    Don’t be surprised, if your experts choose to ignore the years after information.
    Many of the experts I’ve met over the years to apply these regulations narrowly
    and don’t want to open the door to unanticipated costs (common for internal experts)
    or expand the scope of compliance work without the billing expertise to address
    it (typical for external experts). If that happens to you, just make sure to complete
    your due diligence by advising your organization’s responsible executive (corporate
    counsel or chief compliance office) of your concerns in writing and leaving the
    matter in their hands.


    In the next sections, we''ll review regulations that may affect you or your organization.
    You may safely skip some of them, but here''s a quick way to tell which sections
    won’t apply to your organization:


    +   - If your organization is not public (listed on any U.S. stock exchange),
    then you can skip SOX.


    +   - If your organization isn’t involved with banking, consumer finance, securities,
    or insurance, then you can skip GLBA.


    +   - If your organization doesn’t handle any medical records (don’t forget your
    HR department and any health insurance-related records when considering this question),
    you can skip HIPAA.


    +   - If you’re not a telecommunications carrier (or effectively replace one,
    like a university for on-campus students, for example), then you can skip CALEA.


    +   - If you don’t have any physical locations in the United States or provide
    phone service there, then you can skip E911.


    +   - If you don’t have any customers, suppliers, or operations in an EU country,
    then you can skip the EU section, though if you operate in a state or country
    with data privacy regulations then this section might still be relevant.


