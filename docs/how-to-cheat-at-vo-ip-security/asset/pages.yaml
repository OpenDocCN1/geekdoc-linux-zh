- pgno: 149
  md: 'The second large class of Denial of Service (DoS) conditions occurs when devices
    within the internal network are targeted by a flood of packets so that they fail—taking
    out related parts of the infrastructure with them. As in DDoS scenarios described
    earlier in this chapter, service disruption occurs to resource depletion—primarily
    bandwidth and CPU resource starvation (see Figure 5.3). For example, some IP telephones
    will stop working if they receive a UDP packet larger than 65534 bytes on port
    5060.


    # Figure 5.3 An Internal Denial-of-Service Attack


    ![](img/c45efece24bfbfca8be768fba195d8a4_149_0.png)


    Neither integrity checks nor encryption can prevent these attacks. DoS or DDoS
    attacks are characterized simply by the volume of packets sent toward the victim
    computer; whether those packets are signed by a server, contain real or spoofed
    source IP addresses, or are encrypted with a fictitious key—none of these are
    relevant to the attack.


    DoS attacks are difficult to defend against, and because VoIP is just another
    IP network service, it is just as susceptible to Dos attack as any other IP network
    services. Additionally, DoS attacks are particularly effective against services
    such as VoIP and real-time services, because these services are most sensitive
    to adverse network status. Viruses and worms are included in this category as
    they often cause DoS or DDoS due to the increased network traffic that they generate
    as part of their efforts to replicate and propagate.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Threats to VoIP Communications Systems • Chapter 5 145


    How do we defend against these DoS conditions (we won''t use the term attack because
    DoS conditions are simply the unintended result of unrelated actions)? Let''s
    begin with internal Note. In Figure 5.3 VLAN 10 on the right is not affected by
    the service disruption on the left in VLAN 2. This illustrates one critical weapon
    the security administrator has in thwarting DDoS—network domains in separate compartments.
    Each compartment can be configured to be relatively immune to the results of DoS
    in the others. This is described in more detail in Chapter 8.


    Point solutions will also be effective in limiting the DoS conditions. For example,
    because strong authentication is seldom in VoIP environments, the message processing
    components must trust and process messages from potential attackers. The additional
    processing of bogus messages exhausts server resources and leads to a DoS. H.323
    Registration Flooding is an example of this, described in the list of DoS threats,
    later. In this case, message processing servers can mitigate this threat by limiting
    the number of registrations it will accept per a particular address (and/or a
    specific IP address). An intrusion prevention system (IPS) may be useful in fending
    off certain types of DoS attacks. These devices sit on the datapath and monitor
    passing traffic. anomalous traffic is detected (by matching against a database
    of attack signatures or by matching the results of an anomaly-detection algorithm)
    IPS blocks the suspicious traffic. One problem I have seen with these devices—particularly
    in environments with high availability requirements—is that they sometimes block
    normal traffic, creating their own type of DoS.


    Additionally, security administrators can minimize the chances of DoS by ensuring
    that IP telephones and servers are updated to the latest stable version and release.
    Typically, when a DoS warning is announced by bugraq, the vendor quickly responds
    by fixing the offending software.


    # Note


    > VoIP endpoints can be infected with new VoIP device or protocol-specific viruses.
    WinCE, PalmOS, SymianOS and POSIX-based softphones are especially vulnerable because
    they typically do not run antivirus software and have less robust operating systems.
    Aerial worms have already been detected in the wild. Infected VoIP devices create
    a new "weak link" for attacking other network resources.

    Compromised devices can be used to launch attacks against other systems in the
    same network, particularly if the compromised device is trusted (i.e., inside
    the firewall). Malicious programs installed by an attacker on compromised devices
    can capture user input, capture traffic, and relay user data over a "back channel"
    to the attacker. This is especially worrisome for softphone users.


    ![](img/c45efece24bfbfca8be768fba195d8a4_150_0.png)'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'VoIP systems must meet stringent service availability requirements. Following
    are some example DoS threats that cause the VoIP service to be partially or entirely
    unavailable by preventing successful call placement (including emergency/911),
    disconnecting existing calls, or preventing use of related services like voicemail.
    Note that this list is not exhaustive but illustrates some attack scenarios.


    +   **TLS Connection Reset** It is not hard to force a connection reset on a TLS
    connection (often used for signaling security between phones and gateways)—just
    the right kind of junk packet and the TLS connection will reset, interrupting
    the signaling channel between the phone and call server.


    +   **VoIP Packet Relay Attack** Capture and resend out-of-sequence VoIP packets
    (e.g., RTP SRC–SRC is an RTP header field that stands for Synchronization Source)
    to endpoints, adding delay to progress and degrading quality.


    +   **Data Tunneling** Not exactly an attack; return tunneling through voice calls
    creates, a new form of unauthorized modem. By transporting modem signals through
    a packet network using pulse code modulation (PCM) encoded packets or residing
    within header information, VoIP can be used to support a modem over an IP network.
    This technique may be used to bypass or undermine unauthorized data connections.
    This is similar in concept to the so-called ‘IP over HTTP’ (i.e., “Firewall Enhance
    Protocol” RFC 3093)—a classic problem for any ports opened from a internal sources.


    +   **QoS Modification Attack** Modify non-VoIP-specific protocol control information
    fields in VoIP data packets to and from endpoints to degrade or deny voice service.
    For example, if an attacker changes to 802.1Q VLAN tag or IP packet bits, either
    as a man-in-the-middle or by compromising device configuration, the attacker could
    disrupt the quality of service “engineered” for a VoIP network. By subordinating
    voice traffic to data traffic, for example, the attacker may substantially delay
    delivery of voice packets.


    +   **VoIP Packet Injection** Send VoIP packets to endpoints, injecting speech
    or noise into active call. For example, when RTP is used without authentication
    of RTPCP packets (and without SRC sampling), an attacker can inject RTPCP packets
    into a multicast group, each with a different SRC, which can grow the group size
    exponentially.


    +   **DoS against Supplementary Services** Initiate a DoS attack against other
    network services upon which the VoIP service depends (e.g., DHCP, DNS, BOOT).
    For example, in networks where VoIP endpoints only run on DHCP-assigned addresses,
    disabling the DHCP server prevents endpoints (soft- and handsets) from'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Threats to VoIP Communications • Chapter 5 147


    acquiring addressing and routing information they need to use of the VoIP service.


    +   **Control Packet Flood** VoIP servers or endpoints with unauthenticated call
    control packets, (e.g., H.323 GRQ, RRQ, URQ packets sent to UDP/1719). The attacker''s
    intent is to deplete/exhaust device, system, or network resources to the extent
    that VoIP service is unusable. Any open administrative and maintenance port on
    call processing and VoIP-related servers are a target for this DoS attack.


    +   **Wireless DoS** Initiate a DoS attack against wireless VoIP endpoints by
    sending 802.11 or 802.1X frames that cause network disconnection (e.g., 802.11
    Deauthenticate flood, 802.1X EAP-Failure, WPA MIC attack, radio spectrum jamming).
    For example, a Message Integrity Code attack exploits a standard measure whereby
    a wireless access point dissociates when it receives two invalid frames within
    60 seconds, causing loss of network connectivity for 60 seconds. In a VoIP environment,
    a 60-second service interruption is rather extreme.


    +   **Bogus Message DoS** Send VoIP servers or endpoints valid-but-forged VoIP
    packets to cause disconnection or busy condition (e.g., RTSP collision, forged
    RTP BY, forged CCMS, spoofed endpoint push). Such attacks cause the process to
    box a message and terminate a call, or mislead a calling party into believing
    the called party''s line is busy.


    +   **Invalid Packet DoS** Send VoIP servers or invalid packets exploit OS and
    TCP/IP implementation denial-of-service CVEs. For example, the exploit described
    in CAN-2002-0880 crashes Cisco IP phones using jolt, jolt2, and other common fragmentation-based
    DoS attack methods. CAN-2002-0835 crashes certain VoIP phones by exploiting DHCP
    DoS CVEs. Avaya IP phones may be vulnerable to zero port attacks.


    +   **Immature Software DoS** PDA/handheld softphones and first generation VoIP
    handsets are especially vulnerable because they are not mature or as scrutinized.
    VoIP call servers and PBXs run on OS platforms with many known CVEs. Any open
    administrative/maintenance port (e.g., HTTP, SNMP, Telnet) or vulnerable interface
    (e.g., XML, Java) can become an attack vector.


    +   **VoIP Protocol Implementation** Send VoIP servers or invalid packets to exploit
    a VoIP protocol vulnerability to a DoS attack. Several such exploits are identified
    in the MITRE CVE database (http://www.cve.mitre.org). For example, CVE-2001-00546
    uses malformed H.323 packets to exploit Windows ISA memory leak and exhaust resources.
    CAN-2004-0056 uses malformed H.323 packets to exploit Nortel BCM Dos vulnerabilities.
    Lax software update practices (failure to install all CVE patches) exacerbate
    risk.


    ![](img/c45efece24bfbfca8be768fba195d8a4_152_0.png)'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Chapter 5 - Threats to VoIP Communications Systems


    +   * Packet of Death Dos Flood VoIP servers or endpoints with random TCP, UDP,
    or ICMP packets to exhaust CPU, bandwidth, TCP sessions, and so on. For example,
    an attacker can initiate a TCP Out of Band DoS attack by sending a large volume
    of TCP packets marked "priority delivery" (the TCP Urgent flag). During any flood,
    excess processing interferes with the receiving system''s ability to process real
    traffic, initially delaying voice traffic processing but ultimately disrupting
    service entirely.


    +   * IP Phone DoS Send very large volume of call data toward a single VoIP endpoint
    to exhaust device''s CPU, bandwidth, TCP sessions, and so on. Interactive voice
    response systems, telephony gateways, conferencing servers, and voicemail systems
    are able to generate more call data than a single handle and should be leveraged
    to flood an endpoint.


    # # Call Hijacking and Interception


    Call interception and eavesdropping are other major concerns on VoIP networks.
