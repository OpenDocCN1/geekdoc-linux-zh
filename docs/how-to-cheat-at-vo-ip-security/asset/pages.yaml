  md: '# Chapter 3 • Architectures


    Endpoints (telephones, softphones, IVRs, voice mail, video cameras, etc.) are
    typically devices that end-users interact with. MS Netmeeting is an example of
    an H.323 endpoint. Endpoints provide voice-only or multimedia such as video and
    real-time application collaboration.


    Gateways handling signaling and media transport, are optional components. Gateways
    typically serve as the interface to other types of networks such as ISDN, PSTN,
    or other H.323 systems. You can think of a gateway providing “translation” functions.
    For example, an H.323 gateway will handle conversion of H.323 to SIP or H.323
    to ISUP (ISDN User Part) deinterexchange interexchange signaling procedures for
    the trunk control). Another way to think of this is that a gateway provides the
    interface between a packet-based network (e.g., a VoIP network) and a circuit-switched
    network (e.g., the PSTN). If a gatekeeper exists, VoIP gateways register with
    the gatekeeper and the gatekeeper finds the “best” for a particular session.


    Gatekeepers, are also optional, handle address resolution and admission to the
    H.323 network. Its most important function is address translation between symbolic
    alias addresses and IP addresses. For, in the presence of a gatekeeper, it is
    possible to call “Tom,” rather than 192.168.10.10. Gatekeepers also manage endpoints''
    access to services, network resources, and optionally can provide additional services.
    They monitor service usage and provide limited bandwidth management. A gatekeeper
    is not required in an H.323 system. However, if a gatekeeper is present, terminals
    must make use of the services offered by gateways. RAS defines these as address
    translation, admissions control, bandwidth control, and zone management. The gatekeeper
    and gateway functionalities are often present on a single physical device.


    MCUs support multicycling between three or more endpoints. The H.323 standard
    stands for a variety of ad hoc conferencing scenarios, either centralized or decentralized.


    Back-end servers (BES) are an important supplementary function in an H.323-based
    environment. BES may provide services for user authentication, service authorization,
    accounting, charging and billing, and other services. In a simple network, the
    gatekeeper or gateway provides such services.


