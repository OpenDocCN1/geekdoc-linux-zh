    # Peer to Peer


    Once the user agents have completed registering themselves, and making requests
    and receiving responses on the location of the user agent they wish to contact,
    the architecture changes from one of client/server to that of peer-to-peer (P2P).
    In a P2P architecture, user'
  merge: -1
