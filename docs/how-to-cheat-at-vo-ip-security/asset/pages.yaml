  md: '# The Hardware Infrastructure • Chapter 2 33


    # Registration Servers


    In a traditional PSTN or PBX switching system, where each user is at a fixed location,
    usu- tied in place by copper wires, routing calls (relatively speaking) Simple.
    So-called-me services on PSTN or PBX switches can add PSTN mobility. Forwarding
    or extension-to-cellular features can increase this sense of mobility, but all
    solutions require active user programming or rely on fixed forwarding algorithms
    and are rooted in the PSTN.


    But with VoIP, a user can be geographically located anywhere on the planet (as
    long as minimum QoS conditions are present). A registration server acts as a point
    of connection for mobile users. Johnny log in to the registration server from
    his hotel room in Amsterdam with an unknown IP address and the registration server
    will let the gateways know where to route his traffic. That Johnny can keep the
    same phone number matter he is physically located. A similar example can be seen
    with instant messaging networks. A user can log in using his screen name from
    home and be reachable to the same users as if he logged in from work. In the H.323,
    registration is a function of a gatekeeper; however, this can be a separate function
    in the SIP realm.


    # Redirect Servers


    A SIP redirect server acts as the traffic light at the VoIP intersection. Very
    like a web page with a redirect tag built in, a redirect server will inform a
    client if the caller is trying to reach had changed. Armed with the updated information
    from the redirect server, the client will rerthest the call using the new destination
    information. This takes some of the load off proxy servers and improves routing
    robustness. In this way, a call can be quickly diverted from a proxy, rather than
    require the proxy to complete the connection.


    # Media Gateways


    A gateway is a device that translates protocols in general by providing logic
    and translation between otherwise incompatible interfaces. A voice or media gateway
    in particular needs to translate between PSTN (trunking) protocols and interfaces
    and local line protocols and interfaces (though that s not universally true).
    In addition, the potential protocols and interfaces that a gateway now might support
    Ethernet and VoIP protocols as the voice gateway could have H.323 phones on one
    side and an ISDN trunk on the other (both digital) or a VoIP phone on one side
    and an analog loop to the carrier, even VoIP on both sides says, H.323 to the
    station and SIP trunk to the carrier). The point is that there are literally hundreds
    of different equipment classes that all fall under the voice gateway and thousands
    of classes that fall under to begin with.


    One class of VoIP media gateway connects traditional analog or digital phone equipment
    or networks to VoIP equipment or networks. A simple home-user implementation of
    a VoIP


