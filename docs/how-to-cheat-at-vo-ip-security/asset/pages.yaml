  md: '# Table 3.5 continued Layers of the OSI Model


    | Layer | Description |

    |---|---|

    | Physical | Physical layer defines electrical and physical specifications of
    network devices, and provides the means of allowing hardware to send and receive
    data on a particular type of media. At this level, data is passed as a bit stream
    across the network. |


    # SIP and the Application Layer


    Because SIP is the Session Initiation Protocol, and its purpose is to establish,
    modify, and terminate sessions, it would seem at face-value that this protocol
    maps maps to the Session layer of the OSI reference model. However, it is important
    to remember that the protocols at each layer interact only with the layers above
    and below. Programs directly access the functions and supported features available
    through SIP, disassociating from this layer. SIP is used to invite a user into
    an interactive session, and can also invite additional participants to existing
    sessions, such as conference calls or chats. It allows media to be added to or
    removed from a session, provides the ability to identify and locate a user, and
    supports name mapping, redirection, and other services. When comparing these features
    to the OSI model, it becomes apparent that SIP is actually an Application-layer
    protocol.


    The Application layer is used to identify communication partners, facilitate authentication
    (if necessary), and allows a program to communicate with lower layer protocols,
    so that in turn it can communicate across the network. In the case of SIP, it
    is used for setting up, maintaining and ending interactive sessions, and providing
    a method of locating and inviting participants into these sessions. The software
    being communicates through SIP, which passes the data down to lower layer protocols
    and sends it across the network.


    # SIP Functions and Features


    When SIP was developed, it was designed to support five specific elements of setting
    up and tearing down communication sessions. These supported facets of the protocol
    are:


    +   - User location, where the endpoint of a session can be identified and found,
    so that a session can be established


    +   - User availability, where the participant that is being called has the opportunity
    and ability to indicate whether he or she wishes to engage in the communication


    +   - User capabilities, where the media that will be used in the communication
    are established, and the parameters of that media are agreed upon'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Chapter 3 • Architectures


    +   - Session setup, where the parameters of the session are negotiated and established

    - Session management, where the parameters of the session are modified, data is
    transferred, services are invoked, and the session is terminated


    Although these are only a few of the issues needed to connect parties together
    so they can communicate, they are important ones that SIP is designed to address.
    However, beyond these functions, SIP uses other protocols to perform tasks necessary
    to allow participants to communicate with each other, which we''ll discuss later
    in this chapter.


    # User Location


    The ability to find the location of a user being able to translate a participant''s
    username to their current IP address of the computer being used. The reason this
    is so important is because the user may be using different computers, or (if DHCP
    used) have different IP addresses to identify the computer on the network. The
    program can use SIP to register the user with a server, providing a username and
    IP address to the server. Because a server now knows the current location of the
    user, other users can now find that on the network. Requests are redirected through
    the proxy server to the user''s current location. By going through the server,
    other potential participants in a communication can find the user, and establish
    a session after acquiring their IP address.


    # User Availability


    The user availability function of SIP allows a user to control whether he or she
    can be contacted. Users can set themselves as being away or busy, or available
    for certain types of communication. If available, other users can invite the user
    to join in a type of communication (e.g., voice or videoconferencing), depending
    on the capabilities of the program.


    # User Capabilities


    Determining the user''s capabilities involves determining what features are available
    on the programs used by each of the parties, and negotiating which can be used
    during the session. Because SIP can be used with different programs on different
    platforms, and it can be used to establish a variety of single-media and multimedia
    communications, the type of communication and its parameters needs to be determined.
    For example, if you were to call a particular user, your computer might support
    video conferencing, but the the person calling doesn''t have a camera installed.
    Determining the user capabilities allows the participants to agree on which features,
    media types, and parameters will be used during a session.


    ![](img/c45efece24bfbfca8be768fba195d8a4_94_0.png)'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Session Setup


    Session setup is where the participants of the communication connect together.
    The user who is contacted to participate in a conversation will have their program
    "ring" or produce some other notification, and has the option of accepting or
    rejecting the communication. If accepted, the parameters of the session are agreed
    upon and established, and the two endpoints will have a session started, allowing
    them to communicate.


    # Session Management


    Session management is the final function of SIP, and is used for modifying the
    session as it is in use. During the session, data will be transferred between
    the participants, and the types of media used may change. For example, during
    a voice conversation, the participants may decide to invoke other services available
    through the program, and change to a video conferencing. During communication,
    they may also decide to add or drop other participants, place a call on hold,
    have the call transferred, and finally terminate the session by ending their conversation.
    These are all aspects of session management, which are performed through SIP.


    # SIP URIs


    Because SIP was based on existing standards that had already been proven on the
    Internet, it uses established methods for identifying and connecting endpoints
    together. This particularly seen in the addressing scheme that it uses to identify
    SIP accounts. SIP uses addresses that are similar to e-mail addresses. The hierarchical
    URI shows the domain where a user''s account is located, and a host name or number
    that serves the user''s account. For example: myaccount@madesip.com shows that
    the account myaccount is located at the domain madesip.com. Using this method
    makes it possible to connect someone to a particular phone number or username.


    Because the addresses of those using SIP follow a username@domain format, the
    usernames for accounts must be unique within the namespace. Usernames and phone
    numbers must be unique as they identify which account belongs to a specific person,
    and when someone attempts sending a message or placing a call to someone else.
    Because the usernames are stored on centralized servers, the server can determine
    whether a particular user is available or not when a person initially sets up
    an account.


    URIs can also contain other information that allows it to connect to a particular
    user, such as a port number, password, or other parameters. In addition to this,
    although SIP URIs will generally begin with SIP;, others will begin with SIPs;,
    which indicates that the information must be sent over a secure transmission.
    In such cases, the data and messages are transported using the Transport Layer
    Security (TLS) protocol, which we will discuss later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# SIP Architecture


    Though we''ve discussed a number of the elements of SIP, there are still a number
    of essential components that make up SIP''s architecture that we need to address.
    SIP would not be able to function on a network without the use of various devices
    and protocols. The essential devices are that you and other participants would
    use in a conversation, allowing you to communicate with one another, and various
    servers may be be to allow the participants to connect together. In addition to
    this, there are a number of protocols that carry your voice and other data between
    these computers and devices. Together, they make up the overall architecture of
    SIP.


    # SIP Components


    Although SIP works in conjunction with other technologies and protocols, there
    are two fundamental components that are used by the Session Initiation Protocol:


    +   - User agents, which are endpoints of a call (i.e., each of the participants
    in a call)

    - SIP servers, which are computers on the network that service requests from clients,
    and send back responses


    # User Agents


    User agents are both the computer to make a call, and the target computer that
    is calling. These make the two endpoints of the communication session. There are
    two components to a user agent: a client and a server. When a user agent makes
    a request (such as initiating a session), it is the User Agent Client (UAC), and
    the user agent responding to the request is the User Agent Server (UAS). Because
    the user agent will send a message, and then respond to another, it will switch
    back and forth between these roles throughout a session.


    Even other devices that we''ll discuss are optional to various degrees, User Agents
    must exist for a SIP session to be established. Without them, it would be like
    trying to make a phone call without having another person to call. One UAC will
    invite the other into a session, and SIP can then be used to manage and tear down
    the session when it is complete. During this time, the UAC will use SIP to send
    requests to the UAS, which will acknowledge the request and respond to it. As
    a conversation between two people on the phone consists of conveying a message
    or asking a question and waiting for a response, the UAC and UAS will exchange
    messages and swap roles in a similar manner throughout the session. Without this
    interaction, communication couldn''t exist.


    Although a user agent is often software application installed on a computer, it
    can also be a PDA, USB phone that connects to a computer, or a gateway that connects
    the network'
