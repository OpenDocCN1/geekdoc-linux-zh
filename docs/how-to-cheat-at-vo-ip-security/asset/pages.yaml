    # Tools & Traps...


    # FPGAs


    FPGAs (Field Programmable Gate Arrays) are a class of general-purpose digital
    logic chips. Some of the larger FPGA vendors are Xilinx and Altera. FPGAs are
    dynamically programmable, support a wide range of signal processing, and offer
    true parallel processing. They may provide the hardware solution for processing
    every packet streams at multigabit wire speeds.


    Deep Packet Inspection is a promising technology in that it may help to solve
    these problems. DPI engines are situated at network boundaries where bandwidth
    and security controls are logically implemented. New, programmable ASICs coupled
    with efficient algorithms can realistically parse the entire contents of each
    packet at gigabit speeds. Also, combining Firewall and IDS within a single device
    should simplify device configuration and management. There are concerns as well.


    One of the primary benefits of the traditional firewall/IDS deployment is that
    the failure of one component does not leave the network completely unprotected.
    Deploying separate functionality avoids being locked into a single solution and
    vendor.


    Particular attention must be paid to firewall and deep packet inspection configurations
    to make sure they don''t introduce unacceptable latency. Implementation of some
    security measures can degrade QoS. These complications range from interruption
    or prevention of call setup by firewalls to encryption-produced latency and delay
    variation (jitter).


