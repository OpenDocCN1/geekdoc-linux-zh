  md: '# Chapter 9 IETF Encryption Solutions for VoIP


    tures), and data confidentiality (using encryption). S/MIME is not restricted
    to mail. It can be used with any transport mechanism that transports MIME data,
    such as HTTP or SIP message bodies (and certain SIP headers).


    S/MIME applies to the message body overall, but the SIP standard also provides
    a mechanism to apply S/MIME to protect sensitive headers. Message bodies like
    SDP are encrypted with S/MIME to keep integrity and remain confidential. However,
    the header information such as To, From, Call-ID, CSeq, and Contact cannot remain
    confidential end to end. They are indispensable information for intermediaries,
    such as SIP proxy servers, firewalls, or UAS, to establish the requested call.
    To overcome this issue, the information is provided in both plaintext and S/MIME
    encrypted format in a SIP message. The intermediaries may access to the information
    without being bothered to decrypt them. And the final recipient with a proper
    key to decrypt the information can capture the decrypted ones with plaintext to
    check message integrity and the sender''s identity.


    To understand how an S/MIME-based system delivers messaging secured to its destination,
    fundamentals of PKI-based messaging system is necessary. Figure 9.2 shows the
    overall operation and flow of keys and messages within and between the systems.


    +   1. The raw message is digested using a digestion algorithm. If digestion takes,
    it a much longer time to process raw messages with digital signatures. The digestion,
    or hashing, reduces the message size to one adequate for signing.

    2. Alice digests the message using a digital signature algorithm and appends the
    signature to the original message and to her certificate.

    3. A session key is randomly generated and used to encrypt the message, certificate,
    and signature using an encryption algorithm.

    4. The random session key is encrypted by Bob''s public key using a public key
    encryption algorithm and wrapped into the encrypted message. The resulting message,
    which is shown as a shaded box, is transmitted to the receiver.

    5. On the receiver side, a random session key is retrieved by decrypting it with
    Bob''s private key using the same algorithm that appears in step 4.

    6. With the recovered session key, the encrypted messages, certificate, and signature
    are all decrypted using the same algorithm as that in step 3. In this way, data
    confidentiality is achieved. Now, Bob needs to check if the message is really
    signed by Alice, and to make sure that it has not been tampered with while being
    transmitted.

    7. Using the same algorithm that appears in step 1, Bob digests the message.

    8. Bob verifies that Alice''s certificate is legitimate. If it is, Alice''s public
    key is retrieved from the certificate.


