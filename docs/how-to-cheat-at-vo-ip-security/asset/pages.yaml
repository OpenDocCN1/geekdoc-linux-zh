    In general, the first step in policy formulation is convincing management that
    policies are necessary. In today''s environment, this task is simplified by regulatory
    requirements and by the sheer number of security-related incidents reported in
    the popular press (see the previous section of this chapter for recent examples).
    Once management commits to security policy development, the individuals responsible
    for policy formulation are selected to form a security steering committee.


    One of the most common reasons policy fails is that policy too developed in a
    vacuum or by decree, and as a result, does not reflect the security needs of the
    entire organization. Being inclusive from the start will make it easier to mark
    the policy within the organization later; for order security policy to be appropriate
    and effective, it needs to have the acceptance and support of all levels of employees.


    The following is a list of individuals who should be involved in the creation
    and review of security policy documents:


    +   - Information or Site security officer (see the CSO discussion in the next
    section of this chapter)

    - Information technology technical staff (network managers, system administrators,
    etc.).

    - Help desk staff

    - Business unit heads or authorized representatives

    - Security emergency response team

    - Representatives of the user groups affected by the security policy

    - Management

    - Legal counsel

    - Human Resources


    The previous list is not necessarily comprehensive. The idea is to bring in representation
    from key stakeholders, management who have budget and policy authority, technical
    staff


