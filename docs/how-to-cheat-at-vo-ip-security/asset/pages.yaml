    # # NAT and IP Addressing


    Network Address Translation (NAT) is a method for rewriting the source and/or
    destination

    addresses of IP packets as they pass through a NAT device, which is often a router
    or firewall

    that separates two realms or domains on the Internet. NAT was initially proposed

    (RFC1631) in 1994 as a temporary solution to the problems of IP address space
    depletion

    and the rapidly increasing size of route addresses. At that time, they were divided
    into two

    classes: local and global addresses. Today we normally refer to these addresses
    as either private

    or public, and the private IP space often referred to as RFC1918 addresses.


