    a=rtmap:0 PCMU/8000

    a=rtmap:1 GSM/8000

    a=rtmap:101 telephone-event/8000

    ```


    # SDP Operation


    Once a device has been queried, usually by a client sending an SIP request, it
    forms an SDP packet to send back. This SDP packet supplies all of the critical
    information about the session capabilities that the device offers. In its simplest
    form, this data contains the owner information, the audio and video codecs supported,
    and which ports are accepted. On queries for particulars, the reply contains the
    session name, the session description, connection ports, and the range of time
    when the session will be active. All time stamps in SDP data are formed using
    Network Time Protocol (NTP) values. Additionally, the session ID and session version,
    which must be unique values, are generally created using NTP values to signify
    the current date and time.


    Much of the current SDP usage is documented in RFC 4317, which describes the SDP
    Offer/Answer model. In this model, when a client wishes to communicate with another,
    it


