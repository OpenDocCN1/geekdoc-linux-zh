  md: '# The Security Rule


    Within the Security Rule, there are general requirements that outline what a covered
    entity is required to document for compliance overall. Specific requirements then
    follow in four categories: Administrative, Physical, and Technical Safeguards,
    plus Organizational Requirements. Understanding the difference between the first
    three is crucial to the Security Rule:


    Administrative safeguards are administrative actions, and policies and procedures,
    to manage the selection, development, implementation, and maintenance of security
    measures to protect electronic protected health information and to manage the
    conduct of the covered entity’s workforce in relation to the protection of that
    information.


    Physical safeguards are physical measures, policies, and procedures to protect
    a covered entity’s electronic information systems and related buildings and equipment,
    from natural and environmental hazards, and unauthorized intrusion


    Technical safeguards means the technology and the policy and procedures for its
    that protect electronic protected health information and control access to it.


    With this mind, let''s start with the general requirements and objectives for
    the security rule, and the flexibility allowed in implementing and documenting
    standards in each of the four categories:


    +   (a) General requirements. Covered entities must do the following:


    +   (1) Ensure the confidentiality, integrity, and availability of all electronic
    protected health information the covered entity creates, receives, maintains,
    or transmits.


    +   (2) Protect against any reasonably anticipated threats or hazards to the security
    or integrity of such information.


    +   (3) Protect against any reasonably anticipated uses or disclosures of such
    information that are not permitted or required under subpart E of this part.


    +   (4) Ensure compliance with this subpart by its workforce.


    +   (b) Flexibility of approach.'
