    # # Multimedia Internet Keying


    Multimedia Internet Keying (MIKEY) is a simple key management solution intended
    to be used for one-to-one, simple one-to-many, and small size groups. It provides
    three different ways to transport or establish traffic encryption key (TEK): with
    the use of a preshares key, public-key encryption, and Diffie-Hellman (DH) key
    exchange.


    The preshared method and the public-key method are both based on key transport
    mechanisms, where the actual TGK (TG Generation Key) is pushed to the recipient(s).
    The Diffie-Hellman method, the actual TGK is derived instead the Diffie-Hellman
    values exchanged between peers.


    # # Session Description Protocol Security Descriptions


    SDP Security Descriptions specify a new SDP attribute crypto, which is used to
    signal and negotiate cryptographic parameters for SRTP media streams. The definition
    of the crypto attribute is limited to one-to-one unicast media streams. It assumes
    that the layering service of secured data transport protocol, IPSec, TLS, or SIP
    S/MIME, protects the SDP message containing the crypto attribute. The attribute
    describes the cryptographic suite, key parameters, and session parameters for
    the preceding unicast media line.


    ```

    a=crypto:<tag> <crypto-suite> <key-params> <session-params>

    ```


    where tag is a decimal number used as identifier for a particular crypto attribute;
    cryptosite is an identifier that describes the encryption and authentication algorithms
    like AES_CM_128_HMAC_SHA1_80; key-params consist of method and actual keying information;
