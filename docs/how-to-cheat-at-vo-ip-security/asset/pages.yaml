- pgno: 36
  md: '# Wireless PBX Solutions


    Several solutions for adding wireless extensions to PBX systems have been commercialized.
    Most PBX vendors have implemented proprietary 900 MHz-band solutions in the United
    States as well as the 1900 MHz Digital Enhanced Cordless Telecommunications (DECT)
    ETSI standard in Europe, which has driven widespread adoption of vendor-neutral
    wishes there. More recently, a number of WiFi solutions have become available,
    as well as combination WiFi/GSM solutions that allow a single device to work with
    both Cellular and Enterprise PBX infrastructure. See the warnings about WEP later
    in this chapter.


    # Other PBX Solutions


    Two other PBX solutions with security considerations become discussion: Call Detail
    Recording (CDR) systems and Voice Firewalls. CDR systems enable every call on
    a PBX to be recorded after it is complete using standardized format. This allows
    special reporting software to analyze data for forensic or diagnostic purposes.
    It is worth noting, however, that a CDR system will not allow you to stop a fraudulent
    call. For progress, you would need a voice firewall such as that by SecureLogix.
    Such a firewall allows you to see calls in real-time, apply policy based on type
    of call (voice, fax, or data), and set notifications, authentication requirements,
    or other policy based on rules very similar to those you might miss for data traffic
    on firewall.


    # PBX Alternatives


    Long before the appearance of VoIP, nonswitched alternatives to the PBX have been
    available. For systems less than 50 users, Key Telephone Systems (KTS) share outside
    lines directly and have dedicated intercom to talk between stations. Current generation
    key systems are more PBX-like than ever, so it may be hard to find distinction.
    But older systems won''t support advanced switching features like trunk-to-trunk
    transfer that can lead to toll fraud. So, so-called hybrid systems should be treated
    like a regular PBX when it comes to security.


    Centrix, IC, and Hosted IP-telephony services are carrier-based PBX alternatives
    that provide a direct dial plan plus the more popular switching features that
    an on-site PBX system. However, the switching equipment stays in the carrier''s
    infrastructure and is managed by the carrier. This is a mixed blessing since it''s
    likely to reduce the overall functionality and access policy tailoring to you
    if your organization uses such a service, but it does mean that the carrier should
    handle a larger share of the responsibility for any toll fraud that may result
    (and consequently not provide high-risk services like trunk-to-trunk dialing without
    extra security measures).


    More recently, the appearance of IP telephony has provided an opportunity for
    many manufacturers like Avaya to rearchitect their overall PBX approach and separate
    the functionality


