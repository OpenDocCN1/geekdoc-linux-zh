- pgno: 34
  md: '# PBX Adjunct Servers


    Most PBX systems have an adjunct server or two, providing voice messaging or call
    center functionality that isn''t part of the core PBX switching capabilities.
    The larger and more complex a network gets, the more demanding traffic becomes
    to the underlying hardware. Given the modularity of voice networks, we can off
    load of this functionality to other hardware that can be set to handle a specific
    task, rather than attempt to do everything itself. Of course, this also complicates
    the overall security model, so make sure you know how offloading impacts security.


    # Voice Messaging


    It''s hard to remember that voicemail was once a completely optional capability
    for PBX systems, but it''s still implemented as a separate server by most vendors
    using analog, digital, or IP trunks to integrate with the PBX. Some settings on
    voice messaging server can open the door to fraud and abuse, be sure to follow
    manufacturer recommendations for security—especially when it comes to changing
    default administrator passwords! Mailboxes using strong enough PINs? Are mailboxes
    closed down? Make sure you can answer these questions.


    ![](img/c45efece24bfbfca8be768fba195d8a4_34_0.png)


    > Notes from the Underground... Voice Messaging: Swiss Army Knife for Hackers?


    Voice messaging is not without its share of security considerations, though. Many
    vendors ship voice mail systems with default passwords installed, which some users
    opt to never change. These passwords are as simple as the number of voice mailbox
    itself, or a simple string of numbers like 12345. Hackers know when it''s easy
    to get in. That''s only the beginning when it comes to security attacks you may
    need to protect against your voice messaging systems. Here are a few other scenarios:


    +   - When attackers gain control over a compromised PBX system that ports DI
    and voice-mail, they might change the outbound greeting to something like "Hello?
    Yes, yes, that''s fine." Or just "Yes (pause) yes (pause)\... Then they call the
    collector and the operator what appears to be someone more than willing to accept
    charges! Some PBX and voice-mail systems send a special tone when a line is forwarded
    to voice-mail that may discourage this tactic since a savvy operator would recognize
    the tone. Does your organization know what''s happening with old or unused mailboxes?'
