  md: '# Important NIDS Features


    this simple example network setting, two network taps would have to be used to
    visualize all of the traffic—one on the uplink, and one on an inter VLAN port.


    Let''s now discuss the important features of NIDS.


    # Maintenance


    Most NIDS systems support centralized installation, configuration, and updating
    since in an enterprise network security administrator cannot physically access
    each sensor. In addition, most vendors support the automated download of signatures
    and software updates. Distribution and customization of the signature libraries
    and policies should be possible on a per-sensor basis and on a per-group basis
    (these groups should be defined by the security administrator) so the group signatures
    and policies do not have to be pushed to each sensor individually.


    Communication between the IDS components (sensors and manager console) should
    be encrypted using strong authentication (via key exchange or challenge). As mentioned
    earlier, NIDS Ethernet interfaces should be stealthy. Transmission of data via
    the sensing interface is prohibited, unless it is configured intentionally (TCP
    resets, which we discuss later in this chapter, may be an exception).


    # Alerting


    The management console should be configurable to support alerting via a variety
    of mechanisms, including SNMP traps, e-mail alerts, pager messages, syslog messages,
    SMS (short message service), IM, and console alerts.


    # Logging


    All alerts and header and payload data should be automatically stored in a central
    event database that is backed up regularly by SCP or other secure means.


    # Extensibility


    The NIDS should support simple integration of additional vulnerability assessment
    tools as Nmap or Nessus, and should provide support for the correlation of data
    from other IDSs (for example, NIDS and HIDS).


    # Response


    Some NIDS are able to actively respond to attacks or misuse by interfering with
    the particular message stream that generated the alert. This is normally accomplished
    via targeted TCP resets that eventually tear down the connection, or by dynamically
    altering firewall rules or'
