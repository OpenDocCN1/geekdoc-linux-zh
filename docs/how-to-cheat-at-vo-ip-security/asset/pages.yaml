    # DHCP


    The Dynamic Host Configuration Protocol (DHCP) is a protocol that was designed
    to allow network configuration of clients and workstations. Every workstation
    and device in a network must be assigned a unique IP address, as well as a subnet
    mask and gateway IP address. In a network environment where there are hundreds,
    thousands, of workstations, this could become administrative nightmare. DHCP is
    a popular answer to this problem, automatically assigning IP addresses and other
    relevant information to each individual device as it comes online.


    DHCP is a critical support protocol in the VoIP world because it allows VoIP phones
    and devices to be portable from one network to another. Instead of manually configuring
    the device after plugging it into each network, the device simply “pings” the
    network to find an DHCP server. The device then automatically receives an IP address
    and network details from the server and is immediately usable on the network,
    without any interaction with the user.


    The DHCP protocol was first discussed in RFC 1531 and RFC 1541 in 1993. Currently,
    RFC 2131 describes DHCP, and has made the previous RFCs obsolete. There are many
    RFCs that describe additional extensions and uses for DHCP—for example, DHCP for
    IEEE 1394 (RFC 2855) and DHCP for SIP servers (RFC 3361).


    # DHCP Protocol


    The primary function of DHCP is to supply critical network information to clients
    automatically, to reduce the effort of a network administrator in manually configuring
    various devices on a network. For DHCP to work, there must be a DHCP server (or
    relay) running on the network segment where clients will be connecting. The DHCP
    server listens con


