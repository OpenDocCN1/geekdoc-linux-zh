    # Security Implications for Skinny


    Similar in implications to the other protocols discussed previously, the largest
    problem with the Skinny (SCCP) protocol is the fact that all traffic that uses
    it is sent in the clear, with no encryption unless the device is capable and configured
    to support Transport Layer Security (TLS). Ultimately, this means that people
    with malicious intent on the same network segment are able to capture the traffic
    using a network sniffer. This allows such people to store recorded conversations,
    or to even capture the numbers that a particular phone dials during a time period.


    > NOTE

    While the SCCP/Skinny protocol was not designed for the transfer of secure data,
    some protocols are. Cisco CallManager 4.0 introduced SCCP, or simply "Secure Skinny"
    to add beefier security to a Cisco VoIP network. Secure SCCP encrypts all data
    between IP telephones and the Cisco CallManager using TLS.'
