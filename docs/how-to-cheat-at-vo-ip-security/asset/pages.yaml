  md: 'Architectures • Chapter 3 59


    # Transaction Capabilities Applications Part (TCAP)


    TCAP supports the passing and exchange of data within noncircuit-related communications.
    An example of noncircuit-related data is authentication of a user to a calling
    card plan.


    Communication within an SS7 network and its equipment are called signaling points,
    of which there are three; Service Switching Points (SSP), Service Transfer Points
    (STP), and Service Control Points (SCP).


    Service Switching Points (SSP) are the primary calling switches; they set up,
    manage, and terminate calls. When calls need to be routed outside of the SSP trunk
    group a request may be sent to a Service Control Point (SCP), which is a database
    that responds to and sends routing information to requesting switches that deliver
    the appropriate route for the type of call placed. A Service Transport Point (STP)
    is a packet switch that forwards messages down the appropriate link depending
    on the information contained within the packet.


    Figure 3.6 shows basic OSI and SS7 stacks. Links between the SS7 network are broken
    into six different types, letter A through E. Figure 3.7 illustrates a typical
    SS7 network topology with specific link type labeled. Table 3.2 describes each
    link.


