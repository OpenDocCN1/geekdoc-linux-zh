  md: '# Chapter 4 • Support Protocols


    There are various solutions that have come about to resolve issues like this.
    For one, the Session ID could be encoded into a public key that will be included
    in each packet, as well as a timestamp that acts as a digital signature. If the
    two devices are within the same localized network, a third-party server could
    be used to establish the identities of each device. Many such security implementations
    and solutions were drafted by various authors, including Hannes Tschofenig, in
    an Internet Draft located at www.tschofen.com/drafts/draft-ietf-rtsp-rsvp-sec-properties-06.txt.


    # SDP


    SDP, for Session Description Protocol, is a simple protocol that allows clients
    to share information about a multimedia stream to clients wishing to connect.
    Further extensions on the protocol also allow clients to share their multimedia
    abilities with other devices. As its name denotes, it is used primarily to describe
    a client''s abilities. It plays an integral in VoIP communications to share the
    fact that a communication session is taking place, and to provide information
    to other clients so that they have the ability to join and interact with the session,
    such as a group conference.


    SDP was first described in RFC 2327 in April 1998, and the original RFC still
    defines the protocol''s basic abilities today. There are updates, though, to the
    RFC, such as RFC 3266, which add IPv6 support to SDP. Other RFCs like the RTCP
    attribute in SDP (RFC 3605), TCP-Based Media Transport in SDP (RFC 4145) and PSTN/Internet
    Interworking (PINT), a set of extensions to SIP and SDP for IP Access to Telephone
    Call Services (RFC 2848). A fairly recent RFC, RFC 3407, allowed the clients to
    share their multimedia abilities to other devices.


    # SDP Specifications


    SDP is used as a specification protocol, not as an actual transport protocol (or
    even a session negotiation protocol, although higher-level protocols like SIP
    may add that capability over). In others, SDP does not actually transfer data
    between clients, but it establishes a structure for communicating the attributes
    for those data streams. The data must be transferred using another transport protocol,
    such as SAP, SIP, RTSP, or HTTP.The information contained within an SDP packet
    is in ASCII text, and although it was not designed for human readability, it is
    easy to decipher. An SDP packet is broken into multiple lines of text, where each
    line represents a single field and its corresponding value. Common data fields
    include


    +   * v (Protocol Version)


    +   * o (Owner of session, Session ID, Session Version, Network Type, and Owner''s
    IP Address)'
