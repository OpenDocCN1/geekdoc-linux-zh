- pgno: 180
  md: '# GTC


    Typically, password (PIN) information is read by a user from a token card device
    and entered as ASCII text into the client. GTC is similar to PAP in that passwords
    are sent in the clear.


    ![](img/c45efece24bfbfca8be768fba195d8a4_180_0.png)


    # Dictionary Attacks


    Passwords can be broken in real-time (active) and offline (passive) modes. The
    premise of a dictionary attack is by trying every possible combination or words
    (or tokens), an attacker will ultimately succeed in discovering secret passwords.
    A dictionary attack relies on the fact that a password is a common word, name,
    or concatenation of words with a minor modification such as a trailing digit or
    two. Longer passwords with a variety of characters (such as "Y20ea16r3-2e64A1EFing!")
    offer the greatest protection against dictionary attacks.


    During an online dictionary attack, an attacker tries to gain access by trying
    many possible combinations of passwords for a specific user. Online dictionary
    attacks can be prevented by password lockout mechanisms that lock out the user
    account after a certain number of invalid login attempts. Online attacks also
    show up in logs, which can indicate that this type of "loud" hacking activity
    occurred or is occurring. Offline attacks rely on the attacker''s ability to capture
    and record data from the datastream usually using a sniffer such as tcpdump or
    ethereal. These captured data can then be compared at leisure tables of hashes
    until a password is discovered or the attacker gives up. The offline attacks can
    be thwarted by changing passwords regularly and limiting attackers'' access to
    the datastream.


    # Public Key Infrastructure


    The very starting point of Internet or VoIP service is to correctly identify the
    user or voicing nodes, called subjects, without leaving any room for impersonation
    or spoofing. Subjects include all the entities that hold or issue certificates
    such as an entity or CA. IETF adopted Public-Key Infrastructure (PKI) is known
    to satisfactorily meet the needs of deterministic, automated identification, authentication,
    access control, and authorization functions.


    The IETF RFC 3280 specification profiles the format and semantics of certificates
    and Certificate Revocation Lists (CRL) for the Internet PKI. The goal of this
    specification is to develop a profile to facilitate the use of X.509 certificates
    within Internet applications. Such applications could include WWW, electronic
    mail, user authentication, and VoIP.'
