  md: '# Support Protocols • Chapter 4


    work segment and tamper with existing communications. In seeing connection offers,
    and their corresponding SDP replies, an eavesdropper could use the information
    to determine devices that are VoIP communications, and also spoof his way into
    an existing communication. An attacker may be able to collect SDP offers and reply
    them at a later time, overriding values for ongoing communications, with the potential
    to disable audio feeds. However, nearly all security issues with SDP can be solved
    by using protocols to handle user authentication, as with SIP.


    # Skinny


    The Skinny protocol is the casual name for a complex, lightweight VoIP protocol
    signaling scheme owned by Cisco Systems, Inc., and is in use for all VoIP telephones
    that Cisco produces. The formal name is SCCP, for Skinny Client Control Protocol,
    and was originally designed by the Siemens Corporation, which Cisco acquired.
    Skinny is a proprietary protocol that allows “skinny clients,” such as Cisco IP
    phones, to communicate with each other via Cisco CallManager (CCM). The skinny
    clients are small, user-friendly devices that work in conjunction with CCM. The
    CCM acts as a proxy to relay communications to H.323 clients and the PSTN.


    # Skinny Specifications


    Skinny SCCP is the exclusive protocol used by Cisco brand IP phones, as well as
    some phones developed by other manufacturers. Using the Skinny protocol, an IP
    phone will use normal TCP/IP to communicate with the Cisco CallManager. The Skinny
    phone needs to communicate with a non-Skinny client, then the CCM acts as a proxy
    gateway, allowing the two to communicate, at which time the phones use UDP. However,
    when a Skinny phone wishes to communicate with another Skinny phone, the two will
    use RTP/UDP packets for communication.


