- pgno: 52
  md: '# Introduction


    In this chapter we discuss the architecture of the Public Switched Telephone Network
    (PSTN), the architecture of networks based on the H.323 protocol, and the architecture
    of IP networks based on the Session Initiation Protocol (SIP). It is essential
    to include the PSTN and its associated risks when examining VoIP security. The
    PSTN has evolved considerably in recent years, but addition of VoIP services has
    created new and novel considerations for both data and voice. H.323 and SIP are
    signaling protocols—that is, they are involved in call setup, teardown, and modification.


    # PSTN: What Is It, and How Does It Work?


    Today, the PSTN is the most broadly interconnected communications system in the
    world, and is likely to remain so for least another decade or more. For voice,
    it has equal. VoIP services like Skype have banked on this; their business model
    depends on a steady flow of PSTN interconnect. But the PSTN provides FAX, data,
    tele, video, and hundreds of other multimedia services as well. And for decades,
    the PSTN has enjoyed a universal numbering scheme called E.164. When you see a
    number with “+\” and a country code, you are seeing an E.164 number. In most of
    the world, connectivity depends on the PSTN to deliver dedicated access circuits
    such as dial-up.


    In the early days, wired communications at its most advanced meant two (or more)
    devices sharing a single iron wire, whether you were using a telephone or telephone.
    A grounded wire to earth completed the circuit running between phones, each with
    its own battery to generate the current necessary to transmit. It was noisy and
    lines couldn''t run very far, and it was many decades before it could truly be
    a global network, much less a national one.


    To fully define yours PSTN, we’ll need to focus on several areas in turn. First,
    the physical “cable plant” required for signal distribution, from twisted-pair
    and coaxial to the latest fiber-optic cabling. Its signal transmission modes,
    combining analog and digital processing and transmission over electrical, optical,
    and radio interfaces. This directly affects the kinds of content it can carry.
    Third, the increasing sophistication of associated signaling (control) protocols
    and “intelligent network” design introduced with the Integrated Services Digital
    Network (ISDN). And finally, its associated operational and regulatory infrastructure
    on international, national, state, and local levels.


    # PSTN: Outside Plant


    The original premise behind the telephone exchange or Central Office (CO) was
    to run only one wire or set of wires into each house and have a centrally located
    facility for switching connections via operator (or automated equipment). Even
    though new homes'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Architectures • Chapter 3 47


    today may see six or more wire pairs, plus a coaxial cable for broadband cable
    television, the basic principle remains the same: each line to the customer forms
    a loop that passes through the CO.


    The collection of cabling and facilities that support all local loops outside
    the CO (or "wire center") is known as the "loop distribution plant" and is owned
    by the Local Exchange Carrier (LEC). It starts out from the CO in a large cable
    vault with primary feeder cable (F1) to reach over cover (or fiber) to the Serving
    Area Interface (SAI) for that area (look for a large grey or green box with doors
    mounted on a pedestal in most areas of the United States). F1 cable is typically
    6000 to 2000 or more pairs and must be buried because of its weight (although
    fiber-optic cable can be aerial if needed). It is armored or pressurized and generally
    is enclosed in a concrete trench all the way to the CO, with manholes or other
    access points at least 750 feet to allow for installation of repeaters (for digital
    trunks like the T1), loading coils, and other necessary equipment. In most of
    the world, the LEC is to keep F1 and SAI secure through physical locks, alarms,
    and so.


    At the SAI, feeds are cross-connected to secondary feeder F2 that goes out over
    underground to pedestal boxes where the distribution is split out or to aerial
    drops. Subscriber drop wires are then cross-connected to the F2 at that point.
    In rural areas, lower-level cable facilities (F3, F4, F5) may exist before a drop
    wire is terminated. A box is installed where the drop is terminated outside the
    subscriber''s premises and this box is considered the demarcation point for the
    LEC. All wiring from there to the CO is the responsibility of the LEC, and to
    the phones themselves is the subscriber''s responsibility (or that of the landlord).
    Physical security of that wiring—particularly in shared facilities—can be an issue
    in some cases. And F2 or lower feeds and pedestals are not well secured in general
    (and present the best opportunity to eavesdropper).


    Where growth or planning challenges have exhausted the supply of F1 or F2 pairs,
    it sometimes necessary for the LEC to install Remote Terminal (RT) equipment (sometimes
    called "pair systems") that connect multiple local loops on a digital T-carrier
    (using Time-Division Multiplexing (TDM) over a 4-wire carrier or fiber-optic cables),
    or via other Frequency-Division Multiplexing (FDM) systems. RT units are generally
    locked and alarmed, and it is much more difficult to eavesdrop on a digital trunk
    (such as a T-carrier) or FDM system because of the costly equipment required.
    Figure 3.1 shows a diagram of a central office equipped with outside distribution
    plant (ODP).


    In addition to the loop distribution plant, the LEC will have outside plant for
    trunking between central offices, the LEC and other Exchanges (IXCs) will have
    outside plant for long distance connections between COs and other switching centers
    such as toll centers. The LEC or other Competitive Local Exchange Carriers (CLECs)
    may run fiber for SONET (or SDH) rings (see Figure 3.2).


