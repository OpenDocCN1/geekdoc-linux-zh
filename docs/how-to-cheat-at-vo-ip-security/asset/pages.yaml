    Many enterprises, rather than buying certificates from assured CAs, create their
    own CAs and issue certificates to their internal users. It may work well between
    the internal users. When they want to establish secure communication with another
    enterprise, their certificates cannot be certified by a common root root because
    the two enterprises do not have a publicly verifiable CA in common.


    # Certificate and Key Exchange


    9.3 shows the handshake between client and server. The purpose of the handshake
    is first so that the client and server can agree on a set of algorithms that will
    be used to protect the data. Second, they need to establish a set of cryptographic
    keys that will be used by these algorithms.


    Figure 9.3 depicts the case where the client challenges the server’s authentication.
    A detailed explanation of 9.3 follows:


    +   1. With the ClientHello and ServerHello message, the client and server agree
    on a list of algorithms they will use.

    2. The server’s certificate and public key are contained in the Certificate Message.

    3. The client generates a random number, called a Pre-Master Secret key. Upon
    receiving a Certificate message, it checks authentication of the server’s certificate
    and extracts its public key. The Pre-Master Secret key is encrypted by the server’s
    public key and sent via the ClientKeyExchange message to the server. Meanwhile,
    the Key Derivation Function (KDF) generates a master key derived from the Pre-Master
    Secret key.

    4. On the server side, the ClientKeyExchange message is decrypted by the server’s
    private key, resulting in the Pre-Master Secret key. Using the same KDF as the
    client, the master key is derived from the Pre-Master Secret key.


