  md: '# Chapter 8 • Logically Segregate Network Traffic


    Midcom (Middlebox protocol) is an interesting concept that may organize all the
    additional components as adjuncts to firewalls. Essentially, midcom promises to
    allow applications, using a common language, to signal their requirements to trusted
    parties such as firewalls, SBCs, IPS (intrusion prevention systems), and NATs.
