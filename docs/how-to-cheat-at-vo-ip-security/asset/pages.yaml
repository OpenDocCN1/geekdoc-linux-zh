- pgno: 186
  md: '# Certificate Revocation List


    When a certificate is issued, it is expected to be in use for its entire validity
    period.

    However, various circumstances may cause a certificate to become invalid prior
    to the expiration of the validity period. Such circumstances include change of
    name, change of association between subject and CA (e.g., an employee terminates
    with an organization), and compromise or suspected compromise of the corresponding
    private key. Under such circumstances, the CA needs to revoke the certificate.


    CRL is similar to notices of stolen or lost credit cards reported to other credit
    companies. The CA periodically issues a signed data structure called a CRL. A
    CRL is a timestamped list identifying revoked certificates. The list is signed
    by a CA or CRL issuer and made freely available in a public certificate and CRL
    repository. Each revoked certificate is identified in a CRL by its serial number.
    When a system employing certificates uses a certificate for verifying a remote
    user''s digital signature, that system not only checks the certificate signature
    and validity, but also acquires a recent CRL and checks that the certificate serial
    number is not on that.


    # Certification Path


    If a public user does not hold a copy of the CA that signed the certificate including
    the CA''s name, then it might need an additional certificate to obtain that public
    key. A sample scenario appears in Figure 6.11. Let''s assume that Bob authenticated
    from Alice with his certificate signed by CA1. But Alice, whose certificate was
    signed by CA2, does not have the public key for CA1, which is required to validate
    Bob''s certificate. Then, Alice forms a certificate chain that contains both CA2''s
    and her certificate requests that CA1 provide a public key for CA1.


    # Figure 6.11 A Sample Certification Path


    +   - CA1 signed CA2 and Bob.

    - CA2 signed Alice.


    ![](img/c45efece24bfbfca8be768fba195d8a4_186_0.png)'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Chapter 6 - Confirm User identity


    In general, a chain of multiple certificates might be needed that make up a certificate
    containing the public key (the end entity) signed by CA, zero or more additional
    certificates originating from CAs signed by other CAs. Such chains, certification
    paths, are required because a public key user is initialized with only a limited
    number of CA public keys. Certification path processing verifies the binding between
    the subject name and public key. This requires obtaining a sequence of certificates
    that support that binding.


    Many organizations elect to create self-signed certificates for their public key
    infrastructure rather than purchase one or more from a Certificate Authority.
    In most cases, this is fine. However there are two differences between self-signed
    certificates and CA-signed certificates. SSL-enabled Web browsers normally recognize
    a CA-generated certificate and automatically allow a secure connection to be made,
    without prompting the user. Self-signed certificates generally generate an annoying
    (and sometimes nontechnical users, frightening) pop-up. CAs also guarantee the
    identity of the organization that is providing services to the browser or other
    certificate-enabled device.


    Before signing a certificate, a CA verifies the identity of the requesting organization.
    Thus, if you provide a certificate signed by a CA so that people who visit or
    call know that your infrastructure is owned by the organization who claims to
    own it.


    # Minor Authentication Methods


    Information security is often defined as a number of layers. The basis for this
    is the idea that every time and place a local or physical impediment can be created
    that might reasonably stop an attacker (without hindering normal users'' access
    to network resources) it should be done. 802.1x/EAP/EAP and PKI are alike, complex
    layers, that when implemented and maintained correctly, result in highly secured
    access. There are a number of less expensive, less labor-intensive measures that
    administrators can take also result in restricting network access to authorized
    devices.


    # MAC Tools


    A basic security rule is that endpoints cannot be trusted until the identity of
    the endpoint is confirmed, or authenticated. In the case of VoIP, a method for
    authentication of IP phones is the hardware or MAC address. The MAC (Media Access
    Control) is a six-byte address that is usually represented as hex numbers in the
    form AA-BB-CC-DD-EE-FF or AA:BB:CC:DD:EE:FF. The first three bytes represent the
    vendor ID and the remaining three bytes form a unique address for any network
    connected device. There are potentially 2^48 or 281,474,971,656 possible MAC addresses.
    The Web site http://coffer.com/mac_find/ is useful for doing MAC/Vendor lookups.


    ![](img/c45efece24bfbfca8be768fba195d8a4_187_0.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# MAC Authentication


    If an iPhone with an unknown MAC address attempts to download a configuration
    from a registration server, then that device should not receive a configuration
    automatic registration has been disabled. This setup prevents someone from placing
    a rogue or sniffer into the network, unless of course the person spoofs the MAC
    address in hopes of intercepting calls.


    # ARP Spoofing


    ARP spoofing is an essential part of call interception. If an attacker cannot
    successfully meddle with the switch''s ARP table then eavesdropping is virtually
    eliminated. Of course, unrestrained console access to a switch also offers the
    chance for call interception; however, appropriate physical security controls
    and good passwords will minimize this threat. This topic and countermeasures are
    discussed in detail in Chapter 8.


    # Port Security


    Since 802.1x is an emerging technology, not all devices support it. Devices that
    do not support 802.1x can be controlled by Media Access Control (MAC) address
    authentication. Devices with static IP addresses that do not support 802.1x (such
    as printers and IP phones) can be accommodated by utilizing various port security
    commands without the use of 802.1x (different switch vendors have different names
    for these commands). These devices should also be placed into their own VLAN.


    # Summary


    As VoIP evolves, the requirements for user and device authentication and authorization
    will evolve as well. VoIP and other contemporary network services necessitate
    increased requirements for identity management within and between organizational
    domains. Users often maintain multiple identities. VoIP endpoints proliferate.
    Individuals employ different usernames, passwords, and other identifying attributes
    in various online contexts, and they have trouble remembering all these usernames
    and passwords. The foundation of identity management is authentication services.


    Authorized access begins with authentication. We are all familiar with different
    forms of authentication—from the password used to log to your computer to the
    key that unlocks your front door. The conceptual framework for authentication
    is made up of three factors: “something you have” (a key or certificate),“something
    you know” (a password or secret handshake), or “something you are” (a fingerprint
    or iris pattern). Authentication validates users by one or a combination of these.


    User and device identities are not the same and need to be verified independently.
    This can be accomplished in a number of ways. Microsoft Kerberos and NTLM authentication


    ![](img/c45efece24bfbfca8be768fba195d8a4_188_0.png)'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Chapter 6 • Confirm User identity


    are the most widely used authentication schemes due to the large installed Windows
    2000 and XP base. These authentication schemes—particularly Kerberos—provide reasonable
    security; but Windows authentication is primarily a user authentication scheme,
    and may VoIP infrastructure components do not run on Windows. In addition, Windows
    authentication-cannot be used to restrict access to the layer 2 network.


    The two most used, general-purpose, user and device authentication methods are
    802.1x/EAP and PKI. Though they are functionally unrelated, both umbrella-like
    suites that provide frameworks for positively identifying users and devices based
    upon a spectrum of credentials. In addition, both of these approaches are extensible.

    802.1x and 11i/WPA2 rely on an Authentication Server (usually a switch or wireless
    access point) to authenticate users and to proxy user credentials, respectively.
    802.1x relies on EAP to carry out the authentication process. In the spirit of
    protocol isolation that has been successfully pulled off in the TCP/IP suite,
    802.1x provides support for EAP, which provides a framework for multiple authentication
    methods, including traditional passwords, token cards, Kerberos, digital certificates
    and public-key authentication.


    These EAP types are normally composed of an inner and outer type, and in many
    situations, inner and outer types can be mixed to correspond with an organization’s
    specific security requirements.


    PKI techniques, methods, and infrastructure components were developed principally
    to support secure information exchange over insecure networks such as the Internet
    where such features cannot otherwise be readily provided. PKI, however, can be
    used just as easily for information exchanged over private networks, including
    corporate internal networks. PKI can also be used to deliver cryptographic keys
    between users and devices (including IP phones and servers) securely.


    Other point solutions can be used to limit network access to all authorized devices.
    These are normally vendor-dependent, and typically involve some type of MAC address
    filtering or access lists.


    ![](img/c45efece24bfbfca8be768fba195d8a4_189_0.png)'
