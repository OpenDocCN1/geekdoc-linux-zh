- pgno: 367
  md: '# Appendix C · Regulatory Compliance


    FCC rulemaking that will take place in 2006 and beyond, directly affecting VoIP
    service providers.


    +   FCC "First Report and Order and Further Notice of Proposed Rulemaking," FCC
    05-153 (get a copy at www.askalea.net/docs/20050923-fcc-05-153.pdf or at www.fcc.gov),
    September 23, 2005, issued in response to the March 2004 Joint Petition.


    # Direct from the Regulations


    # SEC. 103. ASSISTANCE CAPABILITY REQUIREMENTS.


    +   (A) CAPABILITY REQUIREMENTS- Except provided in subsections (b), (c), and
    (d) of this section and sections 108(a) and 109(b) and (d), a telecommunications
    carrier shall ensure that its equipment, facilities, and services that provide
    a customer or subscriber with the ability to originate, terminate, or direct communications
    are capable of—


    +   (1) expeditiously isolating and enabling the government, pursuant to a court
    order or other lawful authorization, to intercept, the exclusion of any other
    communications, wire and electronic communications carried by the carrier within
    a service area to or from equipment, facilities, or services of a subscriber of
    such carrier concurrently with their transmission to or from the subscriber''s
    equipment, facility, service, or at such later time as may be acceptable to the
    government;


    +   (2) expeditiously isolating and enabling the government, pursuant to a court
    order or other lawful authorization, to access call-identifying information that
    is reasonably available to the carrier—


    +   (A) before, during, or immediately after the transmission of a wire or electronic
    communication (or at such later time as may be acceptable to the government);
    and


    +   (B) in a manner that allows it to be associated with the communication to
    which it pertains, except that, with regard to information acquired solely pursuant
    to the authority for pen registers and trap and trace devices (as defined in section
    3127 of title 18, United States Code), such'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# Regulatory Compliance • Appendix C


    call-identifying information shall not include any information that may disclose
    the physical location of the subscriber (except to the extent that the location
    may be determined from the telephone number);


    +   (3) delivering intercepted communications and call-identifying information
    to the government, pursuant to a court order or other lawful authorization, in
    a format such that they may be transmitted by means of equipment, facilities,
    or services procured by the government to a location other than the premises of
    the carrier; and


    +   (4) facilitating authorized communications interceptions and access to call-identifying
    information unobtrusively and with a minimum of interference with any subscriber''s
    telecommunications service and in a manner that protects—


    +   (A) the privacy and security of communications and call-identifying information
    not authorized to be intercepted; and


    +   (B) information regarding the government''s interception of communications
    and access to call-identifying information.


    Bottom line: CALEA at this level not only requires the media itself for a VoIP
    call, but a good of signaling information as well (labeled “call-identifying information”
    in the Act). In addition, you must facilitate the process and provide appropriate
    equipment to enable the surveillance to take place, although some cost recovery
    is permitted (this is an open issue, as you''ll see in the 2004 Joint Petition).
    If you''re a carrier (or substantial replacement for one) and fall under CALEA,
    every communications service that you provide to your customers must be capable
    of meeting these requirements.


    > NOTE\Although these terms are by no means unique to CALEA, it''s useful to review
    the different types of legal interception available to Law Enforcement Agencies
    (LEAs) today:


    +   1. Pen Register—what numbers were called by the target?

    2. Trap and Trace—what numbers called the target?

    3. Interception (Title III)—recorded conversation of the target (plus the other
    two items in this list). Most of the time, CALEA talks about this type of legal
    intercept.


