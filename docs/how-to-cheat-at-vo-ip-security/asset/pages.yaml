- pgno: 144
  md: '# Summary


    While there are more popular and interesting protocols in place to handle much
    of the VoIP traffic on networks and the Internet, there is also a very important
    set of support protocols that doesn''t share much of the limelight.These protocols
    are crucial in making sure VoIP networks operate, and that individual clients
    can communicate with each other quickly and efficiently. However, they also all
    have their own specific security risks and implications implemented.


    DNS is one such protocol which is required for most usage on the Internet. As
    the means by which domain names are resolved to IP addresses, it has ultimate
    control over where to send clients that are asking for directions to a particular
    machine. Proper care must be taken to ensure that network clients are using appropriate
    DNS servers that are trusted to direct devices properly.TFTP is mentioned as one
    of the primary protocols used to transfer small data files between a server and
    a device.Though its primary usage is transferring images to thin clients,TFTP
    is also critical in supplying configuration information to devices that do not
    have the means to store data. However, this configuration information could be
    sensitive in nature, if it contains authentication data, and to the protocol design,
    it will be sent in clear on the network, allowing anyone listening to gather it.
    HTTP is one of the most popular, and well-used,protocols in use today is the primary
    means for users to download data from Web servers. It is also commonly used in
    other applications and areas as to transfer data between computers. However, if
    SSL is not used, the information is also sent in clear and is visible to network
    sniffers.


    SNMP is one of the more useful protocols for network administrators since it allows
    applications to create a central repository of data involving all networked devices
    on a network segment. This data can be used to monitor network activity, improve
    performance, locate or resolve issues as they occur. It is also a protocol implemented
    into many VoIP telephones in use today. However, as earlier, many implementations
    of SNMP were not done correctly in some phone models, allowing malicious users
    to gather, modify, or erase data contained within these devices. DHCP is another
    useful protocol for network administrators across the world. DHCP allows IP addresses
    to be leased out to computers as online, eliminating the process of manually configuring
    each and every network device with a unique IP address. The use of DHCP allows
    for a greater number of devices to use a network during since many components
    are not running continuously. However, it dangerously supplies IP addresses and
    network information to unauthorized carriers. Various methods of protecting your
    network from this are available, as discussed in this chapter.


    RSVP is an important protocol in the VoIP world it would allow for static pathways
    to be constructed between two VoIP telephones across a network, or the Internet.
    This pathway uses Quality of Service controls to maintain a high-bandwidth connection
    between the two devices to avoid static and dropped connections. However, due
    to its unencrypted design, it'
