- pgno: 209
  md: '# Chapter 7 • Active Security Monitoring


    One measure that can be used to quantify a particular vulnerability is a "Threat
    Index." This index is based upon two independent metrics: perceived risk (Table
    7.2) and an estimated frequency (Table 7.3). The subsequent two-part identifier
    is formed by combining these two results, and is placed in the 3x3 matrix. The
    Threat Index (TI) has several purposes: First is to rapidly prioritize a discovered
    vulnerability. Severe or high TIs (Table 7.4) require immediate attention, and
    may also require more in-depth analysis by testers. Furthermore, the TI can be
    used to rapidly code particular vulnerabilities. For example, if a newly discovered
    vulnerability is ranked with a TI of H1, all members of the team immediately understand
    that this is a severe problem that requires immediate action, while a TI of L3
    indicates an insignificant issue.


    # Table 7.2 Risk Categories


    +   - High Risk (H) Loss of critical proprietary information, system disruption,
    or severe environmental damage

    - Medium Risk (M) Loss of proprietary information, severe occupational illness,
    or major system or environmental damage

    - Low Risk (L) Minor system or environmental damage


    # Table 7.3 Modified Definition of Defense Frequency Categories


    +   - Frequent (1) Likely repeated occurrences

    - Occasional (2) Possibility of repeated occurrences

    - Improbable (3) Practically impossible


    # Table 7.4 Threat Index


    | | High Risk (H) | Medium Risk (M) | Low Risk (L) |

    |---|---|---||

    | Frequent (1) | H1 | M1 | L1 |

    | Occasional (2) | H2 | M2 | L2 |

    | Improbable (3) | H3 | M3 | L3 |


    Your organization can apply these criteria in any way you see fit. The point is
    to determine as objectively as possible a method to prioritize threats against
    your infrastructure. You may use different rankings based upon different portions
    of the network infrastructure—for example, when testing data services, threats
    to data integrity may be particularly important, compared to voice services, where
    threats that negatively impact availability may be critical.'
  merge: -1
  img_proc: true
