  md: '# Chapter 2 • The Hardware Infrastructure


    whole. Regardless, understanding basic PBX terminology will help you understand
    the underlying architecture of the VoIP systems you may encounter, let''s start
    there.


    # PBX Lines


    In telephony, a line (or station line) connects endpoint equipment (digital terminals,
    analog phones, fax machines, modems, or even an IP phone through an IP network)
    to the PBX (or central office) for switching. An analog line is the private equivalent
    of a local loop or transmission facility.


    > A PBX is more like than your phone company to support ground phones and trunks
    on analog interfaces. Your phone at home sites control of the line by using loop
    start, which involves shortening the two ends of the line together to activate
    the circuit. Ground sends one of the leads to ground (typically ringing) to seize
    the line, which is much less likely to cause glare (a condition that arises when
    both sides on a line or trunk simultaneously seize the line).


    Typically, a PBX supports analog lines (and trunks) through a line card with 8,
    12, 16, 24, or more lines per card, which are then wired to a patch panel for
    interconnection through a structured cabling system to the analog phone or device.
    Most of the security concerns around analog lines center on how well protected
    the equipment and cabling systems are from eavesdropping and tampering. Ground
    starts will make that of service less likely because a special phone is required,
    but otherwise the same basic rules for protecting a PSTN line from tampering apply.


    Of course, line is also a generic term that may apply to power lines providing
    electricity to homes and businesses. But when we talk about an analog telephone
    line, we are talking specifically about the two wires involved: the first wire
    in a pair of phones, connected to the + side of the battery at the central office
    or PBX; it is named tip because it was the tip of an operator’s plug and because
    it was connected to the slip ring around the jack). Any equipment that works with
    Plain Old Telephone Service (POTS) will work with a PBX analog line configured
    for loop start. From a PBX, an analog line will nearly always be 2-wire through
    4-wire lines with Earth & Magnet (E&M), sometimes called Ear and Mouth) interfaces
    are supported from the same card for analog trunks.


    ![](img/c45efece24bfbfca8be768fba195d8a4_28_0.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# The Hardware Infrastructure • Chapter 23


    ![](img/c45efece24bfbfca8be768fba195d8a4_29_0.png)


    If you''ve ever taken the phone jacks that clutter the walls of your home, you
    are likely to see two (or three) pairs of wires, one Green/Red, the next Yellow/Black,
    then White/Blue, but for our purposes only the first pair is important. The Green
    wire, referred to as the Tip, is the positively charged terminal. The Red terminal,
    the Ring, is the neutral, which completes the circuit, enabling electrical signals
    to flow freely. Note that newer homes may use a more recent color scheme that
    is also used for Ethernet cabling. The first pair is White/Blue, then White/Orange,
    then White/Green and finally White/Brown. This scheme is what you''re most likely
    to see in structured cabling systems within buildings.


    Analog PBX systems supported only analog lines, but with the introduction of switching,
    a new class of digital line was developed: the digital line. In most PBX systems,
    a proprietary format for digital line signaling (and media) created requires the
    use of digital phones manufactured by that vendor. Some vendors, however, also
    support Integrated Services Digital Network (ISDN) via the ITU-standardized ISDN
    BRI. Most proprietary digital formats use a 2-wire system with 8 plugs and jacks,
    also 4-wire systems. ISDN uses a 2-wire system from the CO switch, which is 8-wire
    to the interface used by a phone terminal, the actual number of wires used will
    depend on several factors (such as which the phone has a built-in NT-1 interface).
    Also, many proprietary features will not be supported on ISDN phones, particularly
    when the phone is manufactured by a different vendor. And even in a newer vendor
    product line, you may discover that newer features are supported only on newer
    phones or phone firmware. In any case, digital lines for 8, 12, 16, or 24 lines,
    and ISDN lines for ISDN phones are supported by either ISDN trunk cards or special
    ISDN BRI line cards, which may come in several flavors depending on the ISDN BRI
    type.


    In the case of modern hybrid PBX or IP-PBX, there is an equivalent concept for
    IP to phones, but unlike analog or digital lines the IP isn''t necessarily tied
    down to a single interface on the PBX. In fact, the PBX can use multiple Ethernet
    ports to support an IP line, and IP phones can fail over to multiple IP-enabled
    PBX systems. The first IP line support built into most PBX systems leveraged the
    H.323 set of protocols or proprietary protocols like Cisco "skinny", but all new
    development on PBX systems today uses Session Initiation Protocol (SIP). The bottom
    line is that the concept of an IP line exists in virtually every VoIP system today,
    understanding how it is expressed in a specific VoIP system will give you an important
    handle to analyze its architecture and security.


    ![](img/c45efece24bfbfca8be768fba195d8a4_29_1.png)'
  merge: -1
