  md: 'Regulatory Compliance • Appendix C 389


    # Article 12 - Unsolicited calls


    +   1. The use of automated calling systems without human intervention (automatic
    calling machine) or facsimile machines (fax) for the purposes of direct marketing
    may only be allowed in respect of subscribers who have given their prior consent.


    +   2. Member States shall take appropriate measures to ensure that, free of charge,
    unsolicited calls for purposes of direct marketing, by means other than those
    referred to in paragraph 1, are not allowed either without the consent of the
    subscribers concerned or in respect of subscribers who do not wish to receive
    these calls, the choice between these options to be determined by national legislation.


    +   3. Member States may limit the application of paragraphs 1 and 2 to subscribers
    who are natural persons.


    # What an EU Data Privacy Consultant Will Tell You


    In addition to the EU eCommunications framework, you may need to worry about data
    contained in corporate directories. Any connection, use, disclosure, or other
    processing about an individual that resides within the EU requires careful handling
    that goes far beyond prescribed by the privacy provisions contained in U.S. law
    for GLBA or HIPAA with their associated regulations. This can create legal issues
    within the EU regardless of whether the individuals are employees, consumers,
    suppliers, or other legal entities. Cross-border data transfers may prohibit the
    transfer of such data to a jurisdiction without an equivalent data protection
    regime. For export to the United States, the FTC provides a Safe Harbor program
    that can meet this test, but there are significant tradeoffs to taking this route
    so you should consult with an EU data privacy expert before committing to this
    route. In many respects, addressing EU data privacy rules is more than science.


    ```

