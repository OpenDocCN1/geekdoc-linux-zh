- pgno: 195
  md: '# Chapter 7 • Active Security Monitoring


    +   - TCP header flags and options


    +   - A definition of the payload data to search (hex or ASCII)


    +   - A starting point for the payload search (offset) and the search depth


    Analysis of packet headers can be done economically since the locations of packet
    header fields are restricted by protocol standards. However, the payload contents
    are, for the most part, constrained. Therefore, searching through the payload
    for multiple patterns within the datastream can be a computationally expensive
    task. The requirement that these searches be performed at wirespeed only adds
    to the cost.


    Anomaly detection NIDS are based on the assumption that normal traffic can be
    defined, and that attack or misuse patterns differ from “normal” traffic. Heuristic-based
    signatures, on the other hand, use some type of algorithmic logic on which to
    determine their alarm decisions.


    ![](img/c45efece24bfbfca8be768fba195d8a4_195_0.png)


    > Heuristic is the art and science of discovery and invention. The word comes
    from the same Greek root as “eureka,” which means “I find.” Heuristics define
    a problem-solving technique in which the most appropriate solution is selected
    at successive stages of a program for the next step of the program. Heuristic
    approaches utilize simplification or an educated guest to reduce or limit the
    search for solutions. A heuristic can be a single algorithmic solution to a problem,
    but unlike an algorithm, heuristics does not guarantee optimal, or even feasible,
    solutions.


    These algorithms are often statistical evaluations of the type of traffic being
    inspected. An example of a heuristic signature is a signature used to detect a
    port scan. This signature defines a particular threshold of external probes against
    unique ports or combination of ports. The signature may be further restricted
    by specification of the types of packets (for instance, SYN only) when it reacts
    to. Interesting trends can be learned from this data, and it is possible to detect
    ongoing attacks based on these algorithms; however, the information that these
    systems provide is generally non specific and requires extensive human investigation
    before actionable intelligence is gathered.


    By creating baselines of normal behavior, anomaly-based NIDS are able to detect
    when current network behavior deviates statistically from the norm. This capability
    theoretically gives an anomaly-based NIDS the capacity to detect new attacks that
    are either unknown or detect attacks for which signatures exist.


    The major problem with this type of approach is that normal network traffic is
    difficult to define. Since normal network behavior can change easily and rapidly,'
