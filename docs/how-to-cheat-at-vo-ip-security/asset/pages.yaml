    the broadest possible acceptance. The role of legal counsel will vary from country
    to country.


    After the security steering committee is formed, the next step is to write policy.
    These can be written from scratch with this approach I do not recommend this as
    it is difficult to comprehend. A better method relies on modifying security policies
    or policy modules that can be found on the web (Gooling "security policies" garners
    over 306 million hits). Policies are available for free or can be existing security
    policies to perform a gap analysis—contrasting the proposed policies with existing
    conditions or perceptions.


    One approach to modifying either new or existing security policies is to perform
    a gap analysis the worksheet shown in Table A.1, you can compare an organization''s
    inventory of policies, procedures, standards, and guidelines to a checklist that
    identifies the security''s best practices.


    This worksheet should be sent to a set of individuals within the organization
    that represent each business unit. The individuals are asked to determine in their
    experience, whether or not a particular policy exists as a formal document, an
    informal document, a draft; or not exist, is not applicable, or is unknown. In
    addition, they are asked to rate, on a scale of 1–5 (with 5 equaling the highest
    priority), how important they feel each policy area was. They are limited to answering
    5 (high priority) to only 6 of the 24 categories.


    The questionnaires are returned, and the results are averaged. This gap analysis
    identifies important security policies, procedures, standards, and guidelines
    that are absent, and give some indication of the strengths and weaknesses of existing
    security policies.


