- pgno: 260
  md: '# Chapter 10 • Skype Security


    These points are covered in detail in a security analysis paper written by Simon
    Garfinkel and available at www.tacticaltech.org/files/Skype_Security.pdf. This
    paper is highly recommended for anyone with concerns about Skype''s VoIP security
    model and methods.


    The privacy of Skype is due to the encryption method Skype uses. Both voice calls
    using Skype and any instant messaging are encrypted, so there is a high level
    of privacy. This may change with government agencies looking to have the ability
    of monitoring traffic in a solution like Skype.


    Most of the time, Skype is available when it should be. But Skype and many other
    VoIP vendors have ongoing issues with availability compared the "old" telephone
    service. The telephone routinely has an uptime of 99.999 percent; people have
    become very used to this reliability, and they depend on this kind of uptime.
    Even under very adverse conditions, your POTS has a good chance of being up and
    working.


    This is unlike VoIP, where the connection can fail in a multitude of places. The
    gateway can fail, servers can fail, the ISP can fail—the list goes on. The telephone
    companies have had many years to work out how to build a redundant network, and
    the technology, although old style, is very robust. The VoIP companies are still
    working out standards, bugs, and billing issues as well as building a robust infrastructure.
    While mostly decentralized, Skype has some advantages in terms of robustness,
    but still has some weaknesses that administrators and users need to be aware of.The
    primary weakness at this point is the use of Skype servers for the username and
    password authentication. Without those, the Skype system fails.


    VoIP systems such as Skype and others have a distinct advantage in the category
    of resilience. If the building or location in which you are using Skype loses
    its Internet connectivity, just go somewhere else with an Internet access point,
    and you are back in business. No mess, no fuss, Skype will simply work again.
    In contrast to the traditional phone system, where the numbers are generally not
    portable, so if the building phone fails, you lose your phone connectivity until
    the phone company can reprogram switches and their network or you can forward
    the phone to a new number where else. Larger companies and corporations have multiple
    and redundant Internet connections and allow for rerouting to the reliability
    of a Skype type of solution.


    We now know through the analysis by Tom Berson of Anagram Labs that Skype ensures
    the integrity of the voice call. Administrators or engineers can now compare Skype
    to products from other vendors to provide the best solution.


    Skype is a closed protocol, but there has been some documentation on a few parts
    of the process by which Skype makes connections. Skype''s supernodes carry media
    stream traffic at times, which has the possibility of being a security risk, since
    the call is traversing an unsecured server. Remember, the supernode is any computer
    with sufficient RAM, CPU, and a public IP address not protected behind a NAT device.


