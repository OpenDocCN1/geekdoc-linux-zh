- pgno: 183
  md: '# Chapter 6 • Confirm User identity


    the message is signed (encrypted) with the sender''s private key. The encrypted
    value either is attached to the end of the message or is sent as a separate file
    together with the message. The sender''s public key that corresponds to this private
    key may also be sent with the message, either on its own or as part of a certificate.


    The receiver uses the sender''s public key to verify that the message hash calculated
    by the receiver (when certificates are used, the type of hashing algorithm will
    be included in the public key certificate sent with the message) is the same as
    the original hash. If the values match, the receiver is reasonably assured that
    the sender (the individual or device that owns the private key that corresponds
    to the public key) sent the information. The receiver also reasonably assured
    that the information has not been altered since it was signed. This exchange forms
    the basis for two key security principles: nonrepudiation (the identity of the
    sender) and message integrity (the contents of the message have not been altered
    in transit). Table 6.4 summarizes the intended use and owner of both public and
    private keys in public key cryptography.


    # Table 6.4 Key Usage in Public Key Cryptography


    | Function | Key Type | Key Owner |

    | --- | --- | --- |

    | Encrypt Data | Public Key | Bob (Receiver) |

    | Sign Data | Private Key | Alice (Sender) |

    | Decrypt Data | Private Key | Bob (Receiver) |

    | Verify Data Integrity | Public Key | Alice (Sender) |


    # Architectural Model and PKI Entities


    Figure 6.10 shows a simple view of the architectural model assumed by the PKI
    specification. This model is analogous to the credit card infrastructure. Even
    though the data is encrypted, the ways in which the entities in the two structures
    interact with each other are conceptually similar. Each PKI entity is an entity
    in the credit card infrastructure. We''ll define the following PKI entities:


    +   - End User of PKI certificates and/or end-user system is the subject of a
    certificate. Like a credit card reader in a retail store or restaurant, it reads
    a certificate (credit card number) and queries the credit card company for the
    card holder''s legitimacy and credit limits.


    +   - Certification Authority (CA) A system that issues PKI certificates.Think
    of credit card application processing, which checks an applicant''s credit history
    and issues a credit card.


    ![](img/c45efece24bfbfca8be768fba195d8a4_183_0.png)'
