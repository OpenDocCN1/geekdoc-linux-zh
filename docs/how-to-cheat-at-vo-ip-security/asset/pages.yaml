  md: '# Regulatory Compliance • Appendix C 363


    * Published in the Communications Assistance for Law Enforcement Act (CALEA) Flexible
    Deployment Assistance Guide, Fourth Edition

    Since the publication of this guide, the following developments have taken place:


    +   * September 23, 2004: FCC rules that all “push-to-talk” services are subject
    to CALEA

    * September 23, 2005: FCC responds to DOJ / FBI / DEA petition and issues Notice
    of Proposed Rulemaking (NPR.M) that will require broadband and VoIP providers
    to comply with CALEA; deadline be 18 months after final order.


    # CALEA Regulatory Basics


    Critical documents are required reading for those wanting to understand the intent
    of the original Act, and subsequent VoIP policy from the FCC, FBI, DOJ, and other
    agencies, particularly in the context of VoIP and its place in the latest CALEA
    rules. Here’s the short list; we’ll cover each of these in more detail later in
    the section:


    +   * The 1994 Act itself passed by Congress (see www.askalea.net/calea.html for
    a full copy) broadband wireiped applicability to all telecommunications technologies
    and added a new requirement to gather “call-identifying information” as part of
    a legal communications intercept

    * J-ST-025,“Lawfully Authorized Electronic Surveillance” published by the Telecommunications
    Industry Association (TIA) as a result of work started in 1995 to address CALEA;
    known initially as TIA/EIA SP 3580. J-ST-025 was first published by TIA in December,
    1997 (The current version required for FCC compliance is J-ST-025-A, published
    by the TIA in December, 2000—available for purchase at www.tia.org/standards/catalog/
    for nonmembers).

    * CALEA Third Report and Order, August 31 1999 (for a full copy, see www.fcc.gov/bureaus/Engineering/Technology/Orders/1999/fcc99250.pdf
    or .txt), defined capability in terms of J-ST-025 for wireline, cellular, and
    broadband PCS carriers, and specified that six of the nine additional capabilities
    in the FBI “CALEA punch list” would be required for CALEA compliance (subsequently
    incorporated into J-ST-025-A).

    * DOJ, FBI and Drug Enforcement Agency (DEA), “Joint Petition for Expedited Ruling”
    (www.askalea.net/docs/20040310.calea.jper.pdf) filed before the FCC March 10,
    2004 requested clear rules for how CALEA will be implemented on a wide variety
    of services, including packet technologies generally and VoIP specifically. Although
    not itself a regulation, this document serves as a roadmap


