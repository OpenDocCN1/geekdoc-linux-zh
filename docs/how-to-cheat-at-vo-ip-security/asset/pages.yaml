    Once a path has been created, with each router maintaining a reservation for the
    data, it must be updated routinely to remain open. If a router has not sent a
    RSVP and Path packet before the refresh interval on the path has exhausted, then
    the router will remove the reservation from itself. As RSVP and Path packets arrive
    to maintain the reservation, they may also make changes to it. If the path between
    the clients is to change to substitute, the recipient sends a new Path message
    with the updated path and it will become effective. Each router will continually
    update its stored information based on the packets continually during the transmission.


    Once the communication between the two devices has ended, they initiate a teardown
    of the path. Although, realistically they could just stop RSVP packets and even
    reservations on the routers would expire, it is recommended that they formally
    tear down the path immediately after finishing the connection. The teardown may
    be initiated by either side of the communication, or from any of the routers within
    the communication. A PathTear packet may be sent downstream from the sender, or
    a RSVPTear may be sent upstream from the receiver. As each router in the path
    receives a teardown packet, they will immediately remove the path reservation
    and forward the packet onto the next hop in the path.


    # Security Implications for RSVP


    Many of the security issues with the RSVP protocol involve actions that a person
    with malicious intentions could take to disrupt traffic or capture it. For one,
    as the Path and Resc packets are transmitted across the network, each has a session
    ID that can be used to uniquely identify a RSVP session. This data is also sent
    as clear text, where anyone who is armed with a network sniffer can capture the
    data. Knowing the session ID, a person could use the same session ID and send
    a Path message to one of the routers in the path. This new Path could alter the
    path of the network, leading the transmission to a completely different client
    than intended. Or, it could be used to disrupt the communication completely, preventing
    an RSVP connection to take place between the two devices.'
