    # RSVP


    RSVP, short for the Resource ReSerVation Protocol, is a protocol designed to allow
    clients on networks to negotiate bandwidth to provide and maintain a high Quality
    of Service (QoS) for a specific connection. Normally,TCP/IP will make a best effort
    to route packets from one machine to another as quickly as possible. However,
    due to the dynamic routing of internetworking, packets take completely different
    routes each time they are transmitted, this cannot be guaranteed. This creates
    a special issue for VoIP communication, which requires a high QoS to maintain
    seamless and non-interruptive communication between two people. VoIP can be an
    especially demanding protocol that requires long periods of high bandwidth and
    low latency, and without RSVP, these conditions may fall below acceptable levels
    which could result in a loss of quality or disconnections. RSVP allows a dedicated
    path across a network between each client so that packets are routed randomly,
    which retains a high level of bandwidth, and less latency. RSVP is especially
    useful for WAN connections within a global organization to maintain these sets
    inside a network, as many Internet routers do not support the protocol.


    The RSVP protocol was first described in RFC 2205 in late 1997. Further modifications
    were made to this RFC, and the best current practices for the RSVP protocol are
    now discussed in RFC 3936, created in late 2004. There are other RFCs that describe
    additional extensions and uses for the RSVP protocol. These include RSVP for LSP
    Tunnels (RFC 3209) and RSVP security properties (RFC 4230).


    ![](img/c45efece24bfbfca8be768fba195d8a4_135_1.png)'
