- pgno: 332
  md: '# The IP Multimedia Subsystem: True Converged Communications • Appendix B 329


    # SIP Security Vulnerabilities


    First let''s review some of the security vulnerabilities of SIP, so that we can
    better understand the security issues faced by early IMS. SIP was designed to
    make the communication system standard and open to any other system compliant
    SIP standards. SIP has many security vulnerabilities and is susceptible to being
    breached by hackers. The following list presents several well known SIP vulnerabilities.


    # Registration Hijacking


    SIP has registration hijacking vulnerability that is similar to man-in-the-middle
    attacks. An attacker sniffs a REGISTER message from a legitimate user and modifies
    it with its owner address as the contact address. Getting this fake message, the
    SIP registrar updates the contact address belonging to the legitimate address
    with the fake address. When incoming calls are received for the legitimate user,
    the proxy server refers to the registrar and redirects all the incoming calls
    to the fake address, which makes the man-in-the-middle attack successful.


    # IP Spoofing/Call Fraud


    An attacker impersonates another legitimate user with spoofed ID and sends an
    INVITE or REGISTER message. In IPv4, there is no way to block IP spoofing when
    SIP messages are sent in clear text and an attacker is able to use an arbitrary
    IP address easily. Hence, when an arbitrary IP address is sent to the registrar
    with the legitimate user account, the incoming calls that follow are transferred
    to the wrong address and are never sent to the correct user. When an INVITE message
    is sent to a user with an arbitrary destination IP address, the call is never
    sent or connected to the hacker''s terminal. If a hacker can use a legitimate
    IP address and make a call with that IP, he or she can execute fraud and make
    free calls.


    # Weakness of Digest Authentication


    SIP recommends the use of HTTP digest authentication that is based on the MD5
    digest algorithm. However, the MD5 digest algorithm is weak and cannot be used
    in an authentication system requiring high security. At the same time, SIP digest
    authentication algorithm does not include all header fields, which can be forged
    as well.


    # INVITE Flooding


    A hacker keeps sending INVITE messages with a fake address and paralyzes the user
    terminal or SIP proxy server. This attack is quite similar to SYN Flood attacks
    in TCP connections.


    ![](img/c45efece24bfbfca8be768fba195d8a4_332_0.png)'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# BYE Denial of Service


    A SIP signaling packet by default is in clear text and can be tampered with. If
    a hacker sniffs legitimate INVITE messages, he can counterfeit a legitimate BYE
    message and send it to one of the communicating parties, resulting in tear-down
    of the ongoing conversation.


    # RTP Flooding


    RTP Flooding is related to media transmission. Most media transmissions are based
    on RTP once the communication is set up with SIP signaling. With RTP Flooding,
    a hacker makes fake RTP packets and bombs either of the ends with the fake RTP
    packets, resulting in quality degradation or terminal reboot.


    # Spam over Internet Telephony (SPIT)


    A SPIT threat sends unsolicited calls to legitimate users that contain mostly
    prerecorded messages and that annoy people or congest a voicemail system to overflowing.


    # Early IMS Security Issues


    Early IMS refers to IMS systems that are not compliant with full IMS security.
    One of the key characteristics of early IMS is that it does not use the security
    binding between UE and P-CSCF and thus provides neither the integrity nor the
    message confidentiality that should be afforded to messages passed among UE, HSS,
    and P-CSCF.Therefore, IPSec is not used. Yet, the lower level Network Domain Security
    might provide security among lower level components as SEGs.


    Early IMS security addresses the threat of IP spoofing and presents a way to avoid
    this threat if full IMS security is not present. In SIP vulnerability, IP spoofing
    enables hackers to use an IMS account or IP address freely. To prevent IP spoofing,
    early IMS recommends the use of a RADIUS server in order to check the IP address
    of the IMPU. Early IMS security features combined with the use of a RADIUS server
    and HSS restrict users to only one IMPU at a time and registers it with the legitimate
    IP address. Hence, multiple IMPUs cannot be used for the same time for individual
    users. Because of these restrictions, users are not allowed the use of multiple
    devices such as mobile phones, VoIP phones, and Personal Digital Assistant (PDAs).
    Once the IMPU is registered with the legitimate IP address, the hacker is not
    able to spoof his IP address with a legitimate account, which does not match in
    the RADIUS server.


    However there are still security vulnerabilities left in early IMS. Because early
    IMS does not use passwords or secure keys, it might be easy for the hacker to
    sniff the legitimate REGISTER message and counterfeit it. Once the legitimate
    user deregisters from the HSS, the hacker is able to register with his or her
    own IP address to the legiti


    ![](img/c45efece24bfbfca8be768fba195d8a4_333_0.png)'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# The IP Multimedia Subsystem: True Converged Communications • Appendix B 331


    mate account and get into the system. When the hacker gets into the system with
    his or own IP address, the legitimate user is no longer able to get into the system.
    This vulnerability is just one aspect of early IMS security systems. Are there
    DoS attacks and SPIT issues


    One thing to note is that early IMS security does not adopt HTTP authentication
    in SIP, which requires a user account with its password and encrypts them with
    a digit algorithm. One of the main reasons for this is that HTTP digest can allow
    multiple users to get into the system at the same time if they share the same
    account and password. This makes appropriate billing difficult and thus, can have
    an impact on the service provider’s revenue.


    # Full IMS Security Issues


    Full IMS includes the security architecture that implements IPv6 and IPSec among
    IMS components. All user terminals (collectively called UE) have security keys
    and can encrypt messages as well as include digital signatures for security authentication.
    These characteristics against eavesdropping, tampering with messages, and IP spoofing.
    Full IMS security is also designed to block potential replay attacks since the
    encryption is based on the random numbers generated by HSS that are valid for
    a certain period of time.


    Full IMS tends to eliminate many of the vulnerabilities by SIP. Full IMS contains
    a certain degree of DOS vulnerabilities and SPIT problems. An attacker can capture
    the encrypted packets and figure out the IP addresses of P-CSC or S-CSC if mode
    is used with IPSec. Attackers can also bombard servers with massive DoS attacks
    with SYN Flooding or other kinds of attacks. If the network has a firewall and
    implements appropriate security policies such as rate limiting, the hacker at
    least might be able to use all the network bandwidth and disrupt IMS services.
    Full IMS is also vulnerable to SPIT attacks. A legitimate UE is able to get into
    the system and send SPIT attacks to target users easily. It can also compromise
    many servers and mastermind distributed DoS SPIT attacks using the compromised
    servers. It may quite difficult to detect DoS SPIT attacks since each compromised
    server acts like normal users, occasionally sending stealth attacks, Therefore,
    a proper protection mechanism is still to be designed.


