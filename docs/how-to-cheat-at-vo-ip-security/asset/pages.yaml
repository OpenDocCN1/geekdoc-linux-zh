  md: '# The Hardware Infrastructure • Chapter 2 29


    +   - Another security issue can arise when phone providers offer voice mail to
    their subscribers, but don''t require a password to access messages when the voicemail
    receiver receives the subscriber ANI (indicating that subscriber is calling from
    the mobile phone associated with that extension). By offering their users the
    “convenience” of quick access to their messages, these carriers may be opening
    the door to eavesdropping through ANI spoofing (which is discussed in more detail
    in Chapter 3) unless they have other methods of verifying the origin of a given
    call.


    +   - Eavesdropping on potentially confidential messages is a threat, but an attacker
    may potentially hijack phone calls intended for a victim as well. This can be
    de-one by changing their outbound message greeting to say “Hi, I’m Corey. Please
    call me at my new number...” and leave a number that they control, performing
    a man-in-the-middle attack on the intended recipient.


    +   - Another successful social engineering technique involves leaving messages
    within a voicemail system requesting passwords for “testing” or “administrative
    purposes” on another internal extension, lulling the victim into believing that
    the attacker is a legitimate employee at the target company.


    +   - The latest voice-messaging systems can be used to read e-mail using text-to-speech.
    Attackers know that a PIN for the voice messaging system is easy to guess, and
    this might be the easiest way for them to get to e-mail system.


    +   - And don''t forget fraud that can happen through dial-out capabilities on
    voicemail systems. Consider turning off this feature if it isn’t needed in your
    organization. Associated risks can also be mitigated by crafted PBX policy.


    # Interactive Voice Response Servers


    Perhaps you ran into an IVR when you noticed an incorrect charge on your phone
    bill, and you decide to speak with a customer service representative to clear
    things up. But when you dial the toll-free number on the bill, you are greeted
    with a labyrinth of options allegedly to help you self-navigate to the appropriate
    agent. This maze of menus is brought to you through an Interactive Voice Response
    (IVR) system. An IVR is a series of recorded greetings and logic that provide
    a caller with a way to route through the phone system as a means of convenience.
    Personal feelings about speaking with a recorded voice aside, IVRs are actually
    a pretty clever way of providing a caller with speedy call performance, taking
    much of the burden away from agents or operators.


    Today’s latest-generation IVR systems are built on VoiceXML interpreters, and
    may have sophisticated development environments. IVR security is a largely unexplored
    topic since each IVR system is like a unique application, but we occasionally
    hear poorly written IVR applications that are insecure or not sufficiently robust.


