  img_proc: true
- pgno: 200
  md: '# Active Security Monitoring • Chapter 7 195


    Access Control Lists block the connection. These active-response NIDS are often
    referred to as intrusion prevention systems (IPSs).


    Most administrators do not activate these features because of the risk of blocking
    normal traffic. Imagine that functionality was enabled on a system directly connected
    to the Internet. A clever attacker could send traffic to an IPS with a source
    address spoofed to that of an upstream router, and designed to trigger the NIDS.
    The resultant blocking of the upstream router could effectively remove the organization
    from the Internet. In a VoIP environment where availability is a key metric, IPSs
    are not recommended because of their potential to obstruct view traffic.


    # Limitations


    NIDS that rely on signatures must constantly update the signature database. Obviously,
    pure signature matching NIDS will not alert on attacks for which they have no
    signature. If signature definitions are too specific, signature-based NIDS may
    miss variations on known attacks. A common technique for creating new attacks
    is to modify existing attacks.


    Signature-based NIDS can also noticeable performance problems on systems when
    numerous attacks are matched concurrently. Additionally, signature-based NIDS
    inspection can be evaded. Secure Networks showed in 1998 that attacks which exploit
    fundamental TCP/IP problems—insertion, evasion, and Denial-of-Service attacks—are
    able to elude NIDS detection. Da Kaminsky showed he could send a series of fragmented
    packets to a NIDS that, based on the time and the operating system platform that
    they arrive, reassemble into an attack for platform that is not recognized by
    the NIDS.


    # Honeypots and Honeynets


    A honeypot is a computer system that is shielded from the Internet by a router
    or firewall that is transparent to an attacker. The honeynet masquerades as a
    normal undefined system, yet lets every attack taken it again and every operation
    that is performed on it. The goal of a honeypot is to lure an attacker into hacking
    the system in hopes of learning all the details of the attack. A honeypot is a
    system designed to illustrate the methods used by black-hats to probe for, and
    exploit, a system. Honeynets are networks that contain at least one honeypot.
    Typically, honeypets present a virtual network with virtual services and applications
    that look to an attacker like a real network. Honeypots and honeynets are learning
    tools, and can also be useful as canaries were used in mines to provide an early
    warning to miners if air conditions turned sour. Unlike NIDS and HIDS, where false
    positives are a common nuisance, honeypots and honeynets, if correctly configured,
    do not have a measurable false positive rate. Honeynets are often configured so
    that their IP space remains unoccupied IP space in an organization''s internal
    network. This configuration, anything that hits the honeynet is either an attack
    or a precursor to an attack this IP space is supposed unused. In its canary role,
    a honeypot can provide an early warning of a virus or worm attack.


    ![](img/c45efece24bfbfca8be768fba195d8a4_200_0.png)'
