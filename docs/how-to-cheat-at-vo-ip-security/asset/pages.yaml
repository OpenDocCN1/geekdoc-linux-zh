    # Logging


    Once you have turned off many services as consistent with proper server function,

    enabled logging. On Linux platforms the system logger (syslog) is controlled by
    the

    configuration file, /etc/syslog.conf. Syslog is a system utility for tracking
    and logging all

    type system messages from informational to critical. Each message sent to the
    syslog

    server is formatted as ASCII text, and has two descriptive labels associated with
    it. The first

    describes the function (facility) of the application that generated it. For example,
    applications

    such as kernel and cron generate messages with easily identifiable facilities
    named kernel and

    cron. The second describes the degree of severity of the message. There are eight
    levels of


