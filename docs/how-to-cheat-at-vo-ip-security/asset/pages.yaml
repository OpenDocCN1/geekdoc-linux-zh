    another way to lock down the OS X operating system.


    We cannot suggest strongly enough that you have a policy at the company detailing
    acceptable software use, spelling out definitions of “good” software and “bad”
    soft ware. Such a policy provides some cover for the company in case legal issues
    arise with the unauthorized use of Skype.


    # # Software Inventory and Administration


    Another method to block the use of Skype is to use a software inventory solution
    that is typically found in large organizations. Companies often scan the systems
    looking for specific software packages like port scanners and other potentially
    malicious tools and delete them as a part of a good security policy. You could
    do the control of Skype inside a corporation with a software inventory and distribution
    solution like SMS, Radia, and others.


    You could also use a script that attaches to all your remote machines, log on
    as an administrator, scan for unapproved applications and delete or disable those
    applications. This practice would work for smaller companies and those with non-Windows
    operating systems that may not have a software distribution solution.


    # # Firewalls


    Skype uses a modified form of the STUN protocol to deal with security like NAT
    on a firewall. Restricted ports are dealt with using random ports during the installation
    and use of HTTP and HTTPS. Between the use of ports 80 and 443 and the random
    ports, Skype can work around restricted firewalls.


    To see if you can pass through your firewall with Skype, you can use a free program
    called NAT Check, which can be found at http://midcom-p2p.sourceforge.net/. This
    NAT checking program is not from Skype, but Skype suggests it to verify your network
    capa bility with Skype. The NAT Check screen shown in Figure 10.1 is a typical
    home net work showing a good result:'
