    # Message Authentications


    Integrity service is obtained by running a one-way hash function on the message
    using a cryptographic key so that the receiver can ensure that the sender of the
    message possessed a secret key and that no party lacking cryptographic key modified
    the message while in transit.


    Figure 9.6 shows how the message authentication works. The one-way function, Hash-Based
    Message Authentication Code with Secure Hashing Algorithm 1 (HMAC-SHA1), is run
    over the header and payload with a secret key. The sender writes the HMAC-SHA1
    hash into the authentication tag, and the receiver runs the same computation and
    checks its result against the tag. If the two do not match, the message authentication
    is said to fail and the packet is discarded.'
