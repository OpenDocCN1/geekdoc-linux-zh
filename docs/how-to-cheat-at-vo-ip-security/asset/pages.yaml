  md: '# Public PK Key Cryptography Concepts


    Within the PKI framework, you are defined by the private keys you possess. From
    the point-of-view of PKI authentication authorities, you will first have to understand
    some basic cryptological concepts. In Figure 6.8 the concept of a secret key is
    presented. Alice and Bob are often used as examples of the two parties engaged
    in a secure communications channel, and we will use them. In this case, Alice
    and Bob both possess the same secret key. This can be a password, a token, or
    some other form of secret. Alice encrypts the plaintext that she wishes to send
    to Bob using her secret key. After Bob receives the ciphertext, he decrypts it
    using the same secret. The fact that the same key is used for both encryption
    and decryption determines that this is a symmetric exchange Symmetric Key Cryptography


    Figure 6.8 Symmetric Key Cryptography


    ![](img/c45efece24bfbfca8be768fba195d8a4_181_0.png)


    PKI relies on a public/private key combination.The public and private keys are
    mathematical entities that are related. One key is used to encrypt information
    and only the related key can decrypt that same information; however, if you know
    one of the keys, it is computationally unfeasible to calculate other.Your public
    key is something you make public. It is freely distributed and can be accessed
    by everyone. A corresponding (unique) private key is something that you keep secret.
    It is not shared with anyone. Your private key enables you to prove, unequivocally,
    that you are who you claim to be.'
