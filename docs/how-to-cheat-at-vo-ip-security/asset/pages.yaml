    > NOTE

    Signaling traffic is binary encoded using ASN.1 (Abstract Syntax Notation One)
    and per encoding rules. ASN.1 is not a programming language. It is a flexible
    notation that allows one to define a variety of data types. ASN.1 theoretically
    allows two or more dissimilar systems to communicate in unambiguous manner.

    ASN.1 encoding rules are sets of rules used to transform data specified in the
    ASN.1 language into a standard format that can be decoded on any system that has
    a decoder based on the same set of rules. The H.323 family of protocols can be
    compiled into a wire-line protocol using PER. PER (Packed Encoding Rules), a subset
    of BER, is a compact binary encoding that is used on limited-bandwidth networks.
    PER is designed to optimize the use of bandwidth, but the tradeoff—decoding PER
    PDUs has led to problems due to a number of factors including issues with oct
    alignment (PER encoding can be aligned or unaligned), integer precision (at times,
    a PER value may not contain a length field), and unconstrained character strings.


