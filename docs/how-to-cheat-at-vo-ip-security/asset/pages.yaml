- pgno: 339
  md: '# SOX: Sarbanes-Oxley Act


    Enacted in response to corporate scandals at Enron, Tyco, and Worldcom during
    2001, the Sarbanes-Oxley Act of 2002 was designed to bolster confidence in the
    financial reporting of publicly traded corporations in the United States. When
    he signed the Act into law, President Bush hailed it "the most far reaching reforms
    of American business practices since the time of Franklin Roosevelt." Since then,
    an estimated $5 billion has been spent by U.S.-listed corporations to comply with
    the act.


    # SOX Regulatory Basics


    Let''s take a few minutes to go through the Sarbanes-Oxley Act and what it requires,
    starting with what the regulations themselves explicitly require. Then we will
    look at related recommendations that SOX consultants and auditors are likely to
    recommend above and beyond the explicit legal requirements.


    # Direct from the Regulations


    When it comes to VoIP or any other application, Section 404 is the only part of
    SOX that even remotely applies. Section 404 is not long but it''s been for hundreds
    (perhaps thousands) of costly IT reporting and process changes ultimately attributed
    to Sarbanes-Oxley over the past few years, I''m going to reproduce it in its entirety—but
    first here''s the simple example:


    +   - 404(a) requires an annual report from management regarding the effectiveness
    of internal controls.

    - 404(b) requires an independent auditor to report on (and attest to) management''s
    annual report.


    So we''re really just talking about two reports here: one that''s signed by the
    officers of a company, and another that''s signed by their independent auditor
    (typically from a large accounting and consulting firm). However, since a negative
    report could have consequences in the stock market, being able to produce an acceptable
    report supported by your auditor is a big deal


    Here''s the actual text of the Sarbanes-Oxley Act of 2002:


    # Section 404 Management Assessment Of Internal Controls


    (a) RULES REQUIRED- The Commission shall prescribe rules requiring each annual
    report required by section 13 of the Securities Exchange Act of 1934 (15 U.C.
    78m) to contain an internal control report, which shall—'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Regulatory Compliance • Appendix C 337


    (1) state the responsibility of management for establishing and maintaining an
    adequate internal control structure and procedures for financial reporting; and


    (2) contain an assessment, at the end of the most recent fiscal year of the issuer,
    the effectiveness of the internal control structure and procedures for the issuer
    for financial reporting.


    (b) INTERNAL CONTROL EVALUATION AND REPORTING- With respect to the internal control
    assessment required by subsection (a), registered public accounting firm that
    prepares or issues the audit report for the issuer shall attest to, and on the
    assessment made by the management of the issuer. An attestation made under this
    subsection shall be made in accordance with standards for attestation engagements
    issued or adopted by the Board. Any such attestation shall not be the subject
    of a separate engagement.


    Now, if you''ve been part of an “SOX audit” you may be saying to yourself, “So
    does it say I need to have complex passwords and encrypted links and quarterly
    user reviews and validity testing and so?” And that’s an excellent question because,
    of course, it doesn’t at all. In fact, the new internal control audit standard
    (“Auditing Standard No. 2” or AS2) created by the Public Company Accounting Oversight
    Board (an organization created by the Act) addresses information technology only
    in terms of internal controls.


    However, Section 404 clearly states that the independent auditor must validate
    management’s internal controls report, which gives management a strong incentive
    to defer to the auditor. As large public companies found out in 2004 and 2005,
    a “disclaimer opinion” from an auditor suggesting that a company’s internal controls
    are inadequate to down its stock price. Thus, the best-practices advice given
    by an auditor or SOX consultant is very likely to be driven down through an organization
    as if the law required it when its not strictly true.


    Nevertheless, Section 404 speaks in terms of “internal controls,” it only makes
    sense to ask what an internal control really is. The commonly accepted definition
    comes from the Committee of Sponsoring Organizations of the Treadway Commission
    (COSO):


    Internal control is broadly defined as a process, effected by an entity’s board
    of directors, management and other personnel, designed to provide reasonable assurance
    regarding the achievement of objectives in the following categories:


    +   - Effectiveness and efficiency of operations.


    +   - Reliability of financial reporting.


    ![](img/c45efece24bfbfca8be768fba195d8a4_340_0.png)'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Compliance with applicable laws and regulations.


    +   - Compliance with applicable laws and regulations.


    What is most important to note about this definition is that it''s *not made in
    terms of technology (although organizations routinely use information technology
    as a *part* of the implementation of many internal controls). It''s not a report,
    or a policy, or a line of code by itself; rather it is an entire operational process.
    Given that, it''s easy to see that SOX really doesn''t care if you''re using VoIP
    or telephony for your business communications so long as any associated internal
    controls (as those for billing) are adequate. The critical standard to be met
    in designing a control “reasonable assurance”—not absolute assurance. According
    to COSO, adequate controls should provide visibility and focus but can be expected
    to take the place of effective management:


    The likelihood of achievement is affected by limitations inherent in internal
    control systems. These include the realities that judgments decision-making can
    be faulty, and breakdowns can occur because of simple error or mistake. Additionally,
    controls can be circumvented by the collusion of two or more people, and management
    has the ability to override the system. Another limiting factor is that the design
    of an internal control system must reflect the fact that there are resource constraints,
    and the benefits of controls must be considered relative to their costs.


    In other words, with the assumption that management can make appropriate executive
    decisions given the necessary background and context. If your control provides
    level of input to decision-makers, it is adequate.


    # What a SOX Consultant Will Tell You


    External auditors and other SOX consultants hired by your company have incentives
    to provide broad, conservative guidance regarding SOX best practices. Why? First,
    given Arthur Andersen''s collapse in the Enron debate, one lesson learned by the
    large audit firms was the importance of giving conservative guidance even if management
    might take issue with the cost/benefit ratio. Keep in mind, however, that your
    company''s independent auditor is prevented by SOX from offering nonaudit (consulting)
    services, these recommendations may force another consulting firm to join the
    process.


    The independent auditor has no reason to suggest to management that the extra
    work is unnecessary, as could only increase their liability in the post-Enron
    world.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Regulatory Compliance • Appendix C 339


    If you''re involved with security, that dynamic is a double-edged sword. On the
    plus side, some security best practices that you may have unsuccessfully lobbied
    for the past are suddenly now the new law of land in your company, with the full
    support of your CIO and CFO arriving in the name of SOX compliance. On the other
    hand, all sense of perspective when it comes to risk management seems to have
    lost in the process. Millions of dollars are spent to implement solutions like
    role definition (ERD), single sign-on (SSO), and identity and access management
    (IAM). At the same time, labor-intensive tasks like a quarterly user review that
    cannot be outsourced to consultants are taking large chunks of time from the operational
    resources that you need in order to address risks not tied to SOX. And good security
    practices not tied to SOX may fail off the management''s radar screen entirely.


    So what specific recommendations are you like to get from a SOX consultant for
    a VoIP system? Primarily, these are security best practices you may already be
    familiar with. Here''s what you might expect in a thorough SOX examination of
    a VoIP system that is deemed to have internal financial controls (because of external
    billing or internal charges, for example):


    +   **Logging and audit trails** Does your VoIP system log administrative changes
    and provide basic usage logs (in case, Call Detail Records (CDRs) or something
    equivalent)? If a billing process requires those logs then what is protecting
    them? More broadly, are the associated controls around billing system adequate?
    Are lists of authorized administrators and users reviewed for accuracy on a periodic
    basis (at least annually)?


    +   **Password complexity** Does your organization enforce consistent requirements
    for password complexity across applications, including the VoIP system? For example,
    a password must be at least eight characters with at least one uppercase letter
    and non-alpha character. Also, are default administrative passwords changed to
    comply (or default users removed)?


    +   **Password expiration** Does your organization enforce consistent expirationframes
    (example: 90 day expiration, 10 day warning) for passwords across all applications,
    including the VoIP system? Also, are accounts with expired passwords removed after
    a set timeframe?


    +   **Database user management** Do associated databases enforce complexity and
    expiration rules? Are default database users removed or assigned new passwords
    that comply?


    +   **Server (and database) vulnerability management** Do associated servers/databases
    receive regular vulnerability scans, virus scans with regular updates, and security
    patches as part of a vulnerability and patch management system?


    ![](img/c45efece24bfbfca8be768fba195d8a4_342_0.png)'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Appendix C · Regulatory Compliance


    +   - Server hardening Are unnecessary services, packages, and tools removed from
    the VoIP system? Are all VoIP processes running as a nonprivileged user?


    +   - Encrypted IP communications Do administrative and operational links prevent
    user data, and any other sensitive information from being seen in the clear? This
    means that Telnet and ftp have been replaced with their TLS-based equivalents
    (like ssh, sftp), external database connectivity runs over TLS, and (on a VoIP
    system) that signaling and media encryption are used.


    +   - Role-Based Access Control (RBAC) Do you have a fine-grained authorization
    scheme that allows you to grant access to each administrative and functional capability
    independently? For VoIP systems, does that mean there are separately granted administrative
    permissions for each area of configuration (such as networking, PSTN integration,
    user administration, etc.) and user-level permissions for different classes of
    testers, calling restrictions, and so on.


    +   - Segregation of Duties (SoD) Have you separated administrative, operational,
    and audit roles within your VoIP system so that, for instance, an auditor can
    access system logs without having the ability to change settings? To properly
    implement SoD, do you need to support RBAC.


    +   - Identity and Access Management (IAM) with Provisioning Have you tied the
    VoIP user and administrative identities back to enterprisewide directories and
    authentication schemes? In other words, do users and administrators accessing
    the VoIP system use the same IDs and passwords on the VoIP system as they would
    on other enterprise applications? Do directory attributes like groups enable automatic
    assignment of roles in the VoIP system''s RBAC scheme? Does VoIP system deprovisioning
    (or disable) happen automatically for a user that has been removed from the enterprisewide
    directory upon termination? Optional: Are new employees able to be provisioned
    automatically to the VoIP system as part of the on-boarding process?


    +   - Enterprise Role Definition (ERD) Has your organization identified across
    its business applications the employee roles and access required by those roles
    to be able to map the VoIP system''s roles into that enterprise scheme? Have those
    roles been screened for Segregation of Duties conflicts with the VoIP system included?
    Note that RBAC and IAM with Provisioning typically are required for an ERD system
    to work smoothly in practice.


    ![](img/c45efece24bfbfca8be768fba195d8a4_343_0.png)'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Tools & Traps...


    # Core SOX Compliance Issues for IP Communications Systems


    The only direct SOX impacts to VoIP and other communications systems are likely
    to be billing related if your VoIP system is part of a service billed to others
    or if your SOX controls consider it to be part of an internal control around PSTN
    usage costs being billed by your company. Of course, indirect impacts through
    IT security policies around user, password, logging systems, and database management
    are all likely since the VoIP system is part of the overall IT infrastructure
    of your organization.


    The SOX issue most likely to be ignored by your SOX team: internal controls for
    controlling VoIP through the PSTN create financial obligations (i.e., long-distance
    charges) so long as your long distance isn''t fixed-cost (or free), since abuse
    of IP communications systems could have a financial impact on your organization.
    In SOX terms, that means that the same controls used with critical systems should
    be evaluated for applicability to IP communications systems as well.


    # SOX Compliance and Enforcement


    It may surprise you to know that most of the Act itself is focused on new practices
    and penalties for independent auditors, not public companies. The Sarbanes-Oxley
    Act created the Public Company Accounting Oversight Board (PCAOB) to address the
    audit processes used for public companies. The Act gives the PCAOB the authority
    to register, investigate, and discipline public accounting firms and auditors.
    Oversight of the PCAOB falls to the Securities and Exchange Commission (SEC).
    Penalties for white-collar crime were increased and the SEC has some additional
    enforcement tools as part of the Act, but in general all nonaudit compliance and
    enforcement for SOX remains within the enforcement frameworks previously established
    at the SEC.


    # Certification


    Compliance is evaluated on an annual basis by two groups: the management of the
    public company itself (typically through your internal audit or compliance group)
    for the management report asserting that internal controls are adequate (i.e.,
    compliant with Sarbanes-Oxley requirements); and the company''s independent auditor
    for their attestation—either unqualified support of management''s report or a
    “disclaimer opinion” that raises concerns about the adequacy of internal controls.
    Just to complete the attestation process each year,


    ![](img/c45efece24bfbfca8be768fba195d8a4_344_0.png)'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# 342 Appendix C Regulatory Compliance


    large companies can be charged up to $1 million or more by their independent auditor—
    over and above the fees paid for corporate audit work. These costs (and potential
    con- flects the process can create with EU Data Protection directives) have prompted
    a number of European firms to de-list from American stock exchanges.


    SOX has no notion of "product certification" like some of the other regulations
    in this chapter.


    # Enforcement Process and Penalties


    Auditors and auditing organizations are investigated and sanctioned by the Public
    Company Accounting Oversight Board (PCAOB), and corporate officers and corporations
    are investi- gated and sanctioned by the SEC. For the PCAOB, the maximum penalty
    for "violations committed in the preparation and issuance of audit reports," was
    $110,000 in 2005 for an individual and $2.1 million for an entity. The SEC maximum
    penalty in 2005 for "intentional" or knowing conduct, including reckless conduct,
    and repeated instances of neglig- gent conduct was $800,000 for an individual
    and $15.825 million for an entity.


    The Act itself increased the maximum penalty for mail, securities, and wire fraud
    up to 25 years imprisonment, and established maximum penalties for CEOs and CFOs
    that made willful and knowing violations of financial statement and disclosure
    rules punishable by a fine of no more than $500,000 and/or imprisonment of up
    to five years. The latter garnered a lot of press at the time and resulted in
    increased attention to SOX by corporate chiefs.


    Both the SEC and PCAOB have processes in accept both anonymous tips and formal
    complaints. For the SEC, tips can be sent to enforcement@sec.gov and online forms
    can be found at www.sec.gov. The PCAOB can accept tips at tips@pcaobs.org or online
    at www.pcaobs.org.


    # GLBA: Gramm-Leach-Bliley Act


    The US Gramm-Leach-Bliley of 1999—commonly referred to as GLBA—is landmark legislation
    that completely reorganized the statutory and legislative framework in the 1930s
    for the banking and financial services market. In particular is Title V, Subtitle
    A, Section 501, which requires banking, consumer finance, securities, and insurance
    companies to develop and meet new standards for protection of consumer privacy
    and safe- guarding of financial institution infrastructure. Although VoIP systems
    were not specifically called out in the Act itself, the Federal Deposit Insurance
    Corporation (FDIC) and other financial regulatory agencies subsequently have issued
    VoIP-specific guidance to be used by regulated entities.


    ![](img/c45efece24bfbfca8be768fba195d8a4_345_0.png)'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# GLBA Regulatory Basics


    Because the regulatory scope of GLBA is extensive and we are really interested
    only in the privacy and security effects of the legislation (and specifically,
    for VoIP systems), we will limit our focus to Title V-PRIVACY. For those in the
    security community, every security reference to GLBA that you''ve seen is tied
    back to Title V, and we will review its contents later in chapter. In addition,
    we will discuss supplementary guidance from consultants and regulators (including
    the FDIC VoIP recommendation) to help you understand what your organization will
    need for your VoIP system to operate with compliance with GLBA.


    # Direct from the Regulations


    Title V is broken out into two subtitles. Subtitle A, “Disclosure of Nonpublic
    Personal Information,” is where we will center most of our attention, particularly
    in Section 501. Subtitle B, “Fraudulent Access to Financial Information” criminalizes
    the act of using false pretenses to obtain financial information from an institution
    except under certain law enforcement and investigative exclusions. We will not
    spend any more time with Subtitle B, but if you ever investigate someone''s financial
    information you would be wise to familiarize yourself with its contents.


    Of the 10 sections in Subtitle A, I am only going to reproduce section 501 in
    its entirety, since it is the basis for all of the GLBA security recommendations
    I encounter. The other nine talk through privacy definitions, enforcement, and
    the creation of detailed regulations from the GLBA. In any case, Section 501 is
    what we want to be most familiar with, and it is fairly straightforward:


    # SEC. 501. PROTECTION OF NONPUBLIC PERSONAL INFORMATION.


    (a) PRIVACY OBLIGATION POLICY- It is the policy of the Congress that each financial
    institution has an affirmative and continuing obligation to respect the privacy
    of its customers and to protect the security and confidentiality of those customers''
    nonpublic personal information.


    (b) FINANCIAL INSTITUTIONS SAFEGUARDS- In furtherance of the policy in subsection
    (a), each agency or authority described in section 505(a) shall establish appropriate
    standards for the financial institutions to their jurisdiction relating to administrative,
    technical, and physical safeguards—


    +   1. to insure the security and confidentiality of customer records and information;'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Appendix C • Regulatory Compliance


    (2) to protect against any anticipated threats or hazards to the security or integrity
    of such records; and


    (3) to protect against unauthorized access to or use of such records or information
    which could result in substantial harm or inconvenience to any customer.


    From this point onward, I''ll use the commonly accepted terminology for the rules
    created by this section. 501(a) and subsequent joint regulations are collectively
    known as the privacy rule and 501(b) with its joint regulations is called the
    safeguarding rule. In later in this chapter, you''ll notice HIPAA regulations
    follow a similar model, except the latter is called “security” instead of “safeguarding.”(That''s
    the way I think about GLBA as: privacy + security.)


    After the GLBA was signed, the Secretary of the Treasury, the National Credit
    Union Administration (NCUA), the Federal Trade Commission (FTC), and the Securities
    Exchange Commission (SEC) were required to create appropriate regulations as part
    Title V.The resulting documents can be found at the FTC at www.ftc.gov/os/2000/05/glb000512.pdf
    and the Office of the Comptroller of the Currency (OCC) at www.occ.tres.gov/ftp/release/0509fin.pdf.
    Detailed requirements for the privacy disclosures and opt-out procedures are spelled
    out in detail within these two documents (and if you like me, you receive the
    annual privacy disclosures they require in drives from financial institutions).
    In general, there are no VoIP disclosures within the privacy rule that aren''t
    directly addressed by the safeguarding rule, we''re going to spend the rest of
    this section on the safeguarding rule.


    Detailed regulations for the safeguarding were finalized in 2001 as the “Interagency
    Guidelines Establishing Information Security Standards” (see www.fdic.gov/regulations/laws/rules/2000-8660.html
    or www.occ.tres.gov/docs/2/25231.pdf for a typical copy), and it is these rules
    that you will want to become most familiar with, in particular, part III:


    # III. Development and Implementation of Information Security Program


    A. Involve the Board of Directors. The board of directors or an appropriate committee
    of the board of each bank holding company shall:


    +   1. Approve the bank holding company''s written information security program;
