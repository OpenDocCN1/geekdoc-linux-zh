- pgno: 301
  md: '# Appendix A • Validate Existing Security Infrastructure


    therein) theft, intrusion, vandalism, natural disaster, man-made catastrophes,
    and accidental damage (e.g., from electrical surges, extreme temperatures, and
    spilled coffee). It requires suitable emergency preparedness, reliable power supplies,
    adequate climate control, and appropriate protection from intruders.


    Statistics show that 70 percent of data theft is physical theft (Computer Associates/Pinkerton,
    2004). Physical security safeguards provide a first line of defense for information
    resources against physical damage, physical theft, and unauthorized disclosure
    of information.


    Safeguards can be broken down into two categories: human and environmental. Human
    safeguard recommendations are:


    +   - Console access should be restricted or eliminated.

    - Logon, boot loader, and other passwords must be a minimum of eight characters
    including at least one of each alpha, numeric, and ctl characters.

    - VoIP components must be located in a secure location that is locked and restricted
    to authorized personnel only.

    - Access to these components, wiring, displays, and networks must be controlled
    by rules of least privilege.

    - System configurations (i.e., hardware, wiring, displays, networks) must be documented.
    Installations and changes to these physical configurations must be governed by
    a formal change management process.

    - A system of monitoring and auditing physical access to VoIP components, wiring,
    displays, and networks must be implemented (e.g., badges, cameras, access logs).
    From the point at which an employee enters the building, it is recommended that
    there be a digital record of their presence.

    - The server room should be arranged in a way that people outside the room cannot
    see the keyboard (thus seeing users/admin passwords).

    - Any unused modems must be disabled/removed.

    - No password evidence (notes, sticky notes, etc.) is allowed around the system.


    Environmental safeguard recommendations are:


    +   - The CPU case should be locked and the key must be accounted for and protected.
    A backup key should be made and kept securely offsite (e.g., in a safety deposit
    box).

    - USB, CD-ROM, monitor port, and floppy disks drives should be removed, disabled,
    or glued shut.


    ![](img/c45efece24bfbfca8be768fba195d8a4_301_0.png)'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Validate Existing Security Infrastructure • Appendix A 299


    +   Adequate temperature and humidity controls must be implemented to avoid equipment
    damage.


    +   Adequate surge protectors and UPS must be implemented, maintained, and tested.


    +   Cleaning and maintenance people should be prohibited from the area surrounding
    the electronics.


    +   Food, drink, or smoking is prohibited in the same areas.


    Frequently, IT and security staff only considers IT security through the prism
    of logical (IT-related technical) security controls. However, it is often the
    case that lapses in physical perimeter security controls can contribute to weaknesses
    in IT security. Methodical testing and anecdotal evidence indicate that the physical
    security is insufficient to prevent unauthorized users from entering secured areas,
    resulting in easy access to the internal network.


    # NOTE


    Choke Points: Often, the largest failing of physical security is the lack of a
    single choke point for the authentication and admittance of authorized visitors.
    Following is a real-world example.


    Normally visitors are authenticated in a visitor registration area and are then
    admitted to an elevator area in a separate part of the building using a badge
    issued in the visitor registration area. The badge is designed to provide a visual
    indication once it has expired, and still-valid daily badges often can be discarded
    in trash receptacles. Since the elevator area is watched by a different group
    of people from those who authenticate the visitor, the guards at the elevator
    area have no idea whether a visitor is authorized or not than the possession of
    a valid visitor badge.


    In this example, multiple choke points result in virtually unrestricted physical
    access to the internal infrastructure.


    IP-PBX equipment should be located in a locked room with limited access. This
    type of access should be provided as a user authentication system with either
    a key-card or biometric device. The use of a keypad alone to gain access is not
    permitted. All methods of gaining entry into the room must provide for a list
    of users that have accessed the room along with a date/time stamp.


    ![](img/c45efece24bfbfca8be768fba195d8a4_302_0.png)'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Perimeter Protection


    Perimeter protection is designed as a deterrent to trespassing and to route employees,
    visitors, and the guests to selected entrances. Here are two useful examples.


    # Closed-Circuit Video Cameras


    CCTV cameras are relatively inexpensive to deploy and provide a large return on
    investment. The typical camera should be on a pan/tilt mounting and have a zoom
    lens, both of which should be controllable by the operator. These features permit
    the monitoring of wide area for general activity or the ability to zero in on
    a particular location.


    It is unrealistic to expect an operator to alert monitor for long periods of time.
    Furthermore, the system should be programmed for periodic sweeps or augmented
    with devices triggered by unusual events. All video output should be recorded
    for future replay if necessary. The videotapes should be archived for a minimum
    of 30 days. A videotape should be retired and physically destroyed after three
    complete usage cycles.


    # Token System


    A token is object physically carried by the user for authentication purposes.
    There are several different types of token identification methods including token
    cards, readers, and biometric devices. The most widely used method is a token
    card. The following is a sample of the different types of access cards.


    # Challenge/Response Tokens


    This device generates a random passcode, based upon a built-in algorithm that
    is combined with a user pin number. This resulting number is used, in combination
    with the standard username and password, for user verification method. Passcode
    sniffing and brute force attacks are futile since the result is good only for
    one specific period of time.


    # Dumb Cards


    An example of a dumb card is a photo identification badge. The photo and individual
    statistics supply enough information to complete the authentication process. Generally,
    the authentication process is a visual comparison of the ID and the face of the
    individual.


    # Smart Cards


    The classic example of a smart card is an ATM card. This device combines an individual
    PIN with information encoded on the card itself.'
