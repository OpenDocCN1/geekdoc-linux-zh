  md: '# Endpoints (User Agents)


    In a phone system, an endpoint on the network was known as a terminal, reflecting
    the fact that it was a slave to the switch or call-control server. Today''s endpoints
    possess much more intelligence, thus in the SIP world the term User Agent is preferred.
    This could be a hardware IP telephone, a softphone, or any other device or service
    capable of originating or terminating a communication session directly or as a
    proxy for the end user.


    # Softphones


    With the advent of VoIP technology, users are able to break free of classical
    restrictions of communication, namely the special-purpose phone terminal.A softphone
    is a piece of software that handles voice traffic through a standard computer
    speaker and microphone (or improved audio equipment that is connected through
    an audio or multimedia device). Softphones can emulate the look and feel of a
    traditional phone, using the familiar key layout of a traditional phone and even
    emanating the DTMF sounds when you dial a call. Or it may look more like an instant
    messaging (IM) client, and act like audio chat added to IM.


    Because a soft phone resides on a QoS, the principle of logically separating data
    and networks is defeated as the PC must reside in both domains.You will need to
    consider this when you design appropriate security policy for your VoIP network,
    although the long-term trends favor voice-data integration, while at best maintaining
    physical separation can be a only temporary strategy.


    Consumer softphones have exploded over the past few years and is nothing hotter
    than Skype in that space. The brainchild of the people who used the Kazaa sharing
    framework. Utilizing peer-to-peer technology and an encrypted signaling and media
    channel, Skype has proven to be easy to set up and use securely by end users,
    while simultaneously being a thorn in the side of network administrators. Because
    it aggressively jumps past waterfalls to create traffic, it is considered to be
    a threat by many enterprise security groups.


    One of Skype''s major enhancements for instant-messaging-based voice is its superb
    codec, which is actually better than used within traditional telephone infrastructure.
    This provides superior call quality when contacting Skype users.Another benefit
    of Skype is the ability to reach any phone in the PSTN by way of Skype gateways.
    With its PSTN gateway, Skype has become an attractive alternative for small overseas
    call centers and other Internet businesses.'
