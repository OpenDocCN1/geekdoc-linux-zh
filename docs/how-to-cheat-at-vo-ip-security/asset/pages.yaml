- pgno: 204
  md: '# SNMP


    The Simple Network Management Protocol (SNMP) is an application layer protocol
    that facilitates the exchange of management information between network devices.
    SNMP messages are encoded as ASN.1 using BER encoding, and run over UDP/161 and
    UDP/162. SNMP enables network administrators to manage network performance and
    find solve problems. Three versions of SNMP exist: SNMP version 1 (SNMPv1), SNMP
    version 2 (SNMPv2), and SNMP version 3 (SNMPv3). SNMPv1 and SNMPv2 have features
    in common, but SNMPv2 offers enhancements, such as additional protocol. Neither
    version provides for authentication or encryption. SNMPv3 includes, other things,
    a model for control and security as well as for a new architecture. SNMPv3 has
    yet to gain wide acceptance; thus, SNMPv1 and SNMPv2 will still predominate.


    An SNMP network normally consists of three key components: managed devices, agents,
    and network-management systems (NMSs). A managed device is a network node that
    contains an SNMP agent. Almost networked device functions as a managed device.
    An agent is a network-management software module that resides in a managed device.
    An agent has local knowledge of management information and translates into a form
    compatible with SNMP. An NMS executes applications that monitor and control managed
    devices. NMS provide the bulk of the processing and memory resources required
    for network management. Applications such as HP Openview or Tivoli are examples
    of NMSs.


    Managed devices are monitored and controlled using three basic SNMP commands:
    read, write, and trap. These commands are defined as follows:


    +   - The read command is used by an NMS to monitor managed devices.

    - The write command is used by an NMS to control managed devices.

    - The trap command is used by managed devices to asynchronously report events
    to the NMS.


    Additionally, SNMP and other applications (such as GetIF; see www.wtcs.org/snmp4etc/getif.htm)
    can read and display the Management Information Base (MIB). A MIB is a (sometimes
    vendor-supplied) collection of information about the managed device that is make
    available to the NMS.


    SNMP community strings and some device configuration data are often among the
    first findings in penetration tests or vulnerability assessments. Most administrators
    forget about this threat or simply ignore it.


    The best method for securing SNMP today is to turn it off. In VoIP networks, most
    IP-enabled telephones use SNMPv1 and SNMPv2 for configuration and performance
    mon-'
