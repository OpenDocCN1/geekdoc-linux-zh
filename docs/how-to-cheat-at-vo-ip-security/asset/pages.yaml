- pgno: 258
  md: '# Security


    Security on any VoIP network is of considerable importance, given the forensic
    importance of a phone call. On a conventional VoIP network, as well as on a traditional
    telephone network, the following information is logged:


    +   - The phone number that was dialed

    - When the number was dialed

    - When the call was connected

    - The duration of the call

    - When the call was disconnected


    Skype does log some of the preceding information, but only the last 10 records,
    and a history is not kept as you might see in other VoIP solutions. This raises
    legal questions if business is conducted over a Skype connection. You need to
    decide whether your security policy is on and whether logging call information
    is required. Some situations may require logging; others may not. Unauthorized
    use of Skype on a network can bring the following problems to the network administrator:


    +   - Skype file transfers can cut both ways: unauthorized flow of company data
    out or the download of files that could be compromised with worms, viruses, and
    the like have bypassed your firewalls and scanners.

    - Skype file transfers will be caught by an antivirus solution that has an “auto-protect”
    capability.

    - Skype users could consume a considerable amount of bandwidth unchecked on the
    network. A large company with a single T1 or a slower DSL circuit could easily
    have its WAN link overloaded by excessive VoIP traffic from Skype if all the users
    performed Skype calls.

    - Skype may take over private resources as a supernode, even if the user is not
    actively using the Skype client. This is mitigated by a corporate firewall or
    DSL/cable router or other NAT device.

    - The encryption of instant messaging can lead to exposure of private company
    data or other legal issues that cannot be monitored by a proactive staff.


    Skype is up front about using your computer, or as front as an end-user license
    agreement (EULA) can be. What is buried in the fine print of the EULA is the following
    article:'
