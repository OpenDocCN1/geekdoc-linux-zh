- pgno: 291
  md: '# Appendix A • Validate Existing Security Infrastructure


    approached in this fashion, information security becomes less an administrative
    and technical burden, and more of a competitive advantage.


    > A competitive advantage within a vertical can be gained by providing products
    or services that provide more benefits at a fixed price, or by providing the same
    benefits at a lower price. An organization can gain a competitive advantage by
    utilizing its resources (things like people, knowledge, reputation, brand) or
    its capabilities (processes, procedures, routines, etc.) more effectively than
    its competitors. Basically, a competitive advantage allows an organization to
    sustain profits that exceed the average for other organizations within its industry.
    In the context of information security, competitive advantage can be affected
    positively by implementing and maintaining a workable information security methodology.
    These processes can be regularly disseminated to clients and vendors, creating
    a reputation for honest and professional treatment of information. Any types of
    mishandling of client or vendor information—whether from hackers or from simple
    misuse—leads to reputation, brand, or knowledge damage, and consequently, loss
    of competitive advantage.


    Policy formulation is an important step toward standardization of enterprise security
    activities. The organization’s policy is management’s vehicle for emphasizing
    its commitment to IT security and making the expectations for associate involvement
    and account-ability. Policy formulation establishes standards for all information
    resource protection by assigning program management responsibilities and providing
    basic rules, guidelines, definitions, and processes for every person within the
    organization. One major aim of the policy is to prevent behavioral inconsistencies
    that can introduce risks. Ideally, policy should be sufficiently clear and comprehensive
    to be accepted and followed throughout the organization yet flexible enough to
    accommodate a wide range of data, activities, and resources.


    There is no single best process for developing a security policy. Much of the
    process is dependent upon variables such as the size, age, and location of an
    organization, the vertical that the organization occupies, the impact of regulation
    on the organization, and the organization’s sensitivity toward risk. Figure A.2
    shows how an approach to policy development and implementation can be organized.'
  merge: -1
  img_proc: true
