  md: '# EU and EU States’ eCommunications Regulations


    In April 2002, a European Union (EU) regulatory framework for electronic communications
    was adopted and went into effect in July 2003. In its introduction to the framework,
    the EU Information Society Directorate-General explains:


    The convergence of the telecommunications, media and information technology sectors
    demands a single regulatory framework that covers all transmission networks and
    services. The EU regulatory framework addresses all communications infrastructure
    in a coherent way, but does not cover the content of services delivered over and
    through those networks and services. There are five directives: the Framework
    Directive⁶ (2002/21/EC) and the Authorization Directive⁷ (2002/20/EC), the Access
    Directive⁸ (2002/19/EC), the Universal Service Directive⁹ (2002/22/EC) and the
    Privacy Directive¹⁰ (2002/58/EC). In addition, the Competition Directive (2002/77/EC)
    applies.


    The objectives set out in the EU regulatory framework are:


    +   - To promote competition by fostering innovation, liberalising markets and
    simplifying market entry;


    +   - To promote the single European market and;


    +   - To promote the interest of citizens.


    All Member States are required to implement the EU framework in their national
    law. The framework lays down the role of Member States and national regulatory
    authorities, the rights and obligations for market players, and the rights of
    users of electronic communications networks and services. In addition, Member
    States may take measures justified on the grounds of public health and public
    security as out in the EC Treaty, for example by imposing requirements for legal
    interception or critical infrastructure protection, and such measures are not
    covered by the EU regulatory framework.


    What many non-EU readers may not realize the degree to which EU regulations (particularly
    privacy regulations) will force specific policy and practice outside of the EU.
    Its effects (particularly with respect to VoIP) will be briefly discussed in this
    final section. At the present, the EU IS Directorate-General is soliciting public
    comment on VoIP policy for input into a future regulatory regime for VoIP.


    ![](img/c45efece24bfbfca8be768fba195d8a4_387_0.png)'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# EU Regulatory Basics


    Seven active EU Communications Directives with potential VoIP Implications that
    your organization may need to consider are listed here. Note that each of these
    directives is required to be expressed in the law for each EU nation, which may
    have additional regulatory measures of their own. In some cases (such with the
    German Data Privacy Law) national laws are considerably more restrictive than
    the EU directive. Here is the list:


    +   - Directive 97/66/EC Processing of personal data and protection of privacy
    (up to October 30, 2003)

    - Directive 2002/58/EC Privacy and electronic communications (from October 31,
    2003 onward)

    - Directive 2002/19/EC Access and interconnection

    - Directive 2002/20/EC Authorization of electronic communications and services
    (i.e., allocation of radio frequencies)

    - Directive 2002/21/EC Common regulatory framework

    - Directive 2002/22/EC Universal service and users'' rights relating to electronic
    communications networks and services

    - Directive 2002/77/EC On competition in the markets for electronic communications
    services


    Although VoIP is directly or indirectly addressed in each of these, this section
    will focus on the only VoIP security concern addressed in the EU electronic communications
    regulations, namely the privacy and electronic communications directives.


    # Direct from the Regulations


    Central to understanding EU privacy laws are the broad definitions used for personal
    data and its processing. We will focus on Directive 2002/58/EC since it establishes
    the minimum go-forward privacy framework for EU member states going forward with
    respect to electronic communications services. Note that specific references to
    ISDN and mobile networks in this directive, subsequent guidance from the EU Directorate-General
    has indicated that VoIP services will be expected to comply with this directive
    as well. Here is the relevant text within the directive:


    # Article 3 - Services concerned


    1. This Directive shall apply to the processing of personal data in connection
    with the provision of publicly available telecommunications services in public
    telecommunications networks in the Community, in particular


