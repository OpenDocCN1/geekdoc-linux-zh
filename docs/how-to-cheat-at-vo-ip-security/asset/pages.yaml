- pgno: 118
  md: '# Introduction


    Protocols as MGCP and SIP, or protocol umbrella groups like H.323, are usually
    the first things that come to mind when discussing VoIP technology. Although they
    are all great protocols in their own right, they depend on, and operate heavily
    with, support protocols. Many of the support protocols that are used by VoIP architectures
    enable services and features required for proper network operation.


    This chapter will cover several of the support protocols typically found in VoIP
    environments and some of the security implications that they bring with them.
    This chapter is not intended to be an all-inclusive tutorial on these protocols.
    Instead, the intent is to review their use and use any security implications involving
    your network.


    > It is important to keep in mind that most of these support protocols do not
    include any encryption or authentication mechanisms by default. For this reason,
    most of this traffic is susceptible to interception and/or modification. Proper
    network planning and configuration is thus essential.


    # DNS


    The Domain Name System (DNS) is a static hierarchical name architecture that relies
    on client/server communication for operation. DNS is a protocol that many use
    every day and may not know it. Whenever someone browses the Internet, DNS is used
    in the background to translate host names into IP addresses so that the proper
    network destinations can be found. DNS is equally important in VoIP networks for
    its ability to resolve endpoint addresses or allow gateway registration to all
    servers and gateways by name.


    DNS was created so that no one would be required to memorize the IP addresses
    of every host on a private network or the Internet. Most people have a hard time
    remembering one or two passwords, let alone billion IP addresses. With the development
    of DNS, the only requirement is knowledge of the target Web page name that you
    wish to go to. DNS resolves the target Web page name into one or more IP addresses.
    It has also been designed to allow the reverse or "inverse" resolution of IP addresses
    to host names.


    The DNS architecture was first discussed in detail in RFCs 881 through 883, and
    later updated in RFCs 1034 and 1035. Several of the newer RFCs include recommendations
    on how to secure the DNS architecture, including the addition of DNS security
    extensions'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'DNSSEC beginning with RFC 4033. The next few sections detail a high-level overview
    of the DNS architecture and several security threats associated with DNS systems.


    # DNS Architecture


    In order to better understand and be able to address the security concerns associated
    with DNS properly, it is important to have at least a high-level understanding
    of how DNS works. The hierarchy previously mentioned for DNS exists as a pyramid,
    with the highest level of the DNS architecture at the top. DNS is organized into
    myriad logical groupings called domains, which are further segmented into an endless
    number of subdomains. Figure 4.1 illustrates a sample hierarchy of the DNS system
    and is by no means exhaustive. The intent is to show the structure of the hierarchy.


    # Figure 4.1 Sample DNS Architecture


    ![](img/c45efece24bfbfca8be768fba195d8a4_119_0.png)


    Located at the top of the DNS hierarchy are the root DNS servers. The root DNS
    servers are located in the root DNS zone, annotated by a single ".", and are responsible
    for maintaining the location of the top-level domain servers (TLD). The TLD DNS
    server is one that is responsible for the management of one of the commonly associated
    address identifiers, such as .com, .net, .edu, or .org. The TLD DNS servers are
    assigned or "delegated" the responsibility by the root DNS servers. They are known
    as the authoritative server for that TLD. Likewise, the TLD DNS servers delegate
    the management of one of their subdomains. The subdomain DNS servers for brad.com
    would be responsible for any resource records (RR) for that subdomain as well
    as the location of any related subdomains (.hr.brad.com). The resource records
    are the entries for the host systems. This process of delegation distributes the
    load of the DNS system across many different servers.'
  merge: -1
  img_proc: true
- pgno: 120
  md: "# Fully Qualified Domain Name\n\nEach host has its own pointer for DNS, known\
    \ as a fully qualified domain name (FQDN). The FQDN is used to identify the path\
    \ taken through the DNS architecture to find the requested host. Figure 4.2 illustrates\
    \ what path is taken through the previously discussed DNS hierarchy from Figure\
    \ 4.1 to reach host pc1.\n\n# Figure 4.2 Fully Qualified Domain Names\n\n![](img/c45efece24bfbfca8be768fba195d8a4_120_0.png)\n\
    \nThere are a couple of things to keep in mind FQDNs. First of all, the explicit\
    \ FQDN path from the top of the hierarchy (root) is read from right to left, even\
    \ though most FQDN illustrations do not include the final dot to represent the\
    \ root domain, it is an implied part of the complete FQDN. Most applications,\
    \ like IE, will not append a trailing \". to the end of a Web resource. Followed\
    \ from right to left, the host pc1 follows a path out of the root domain, through\
    \ the TLD .com, to the .com subdomain .hr.com, and then finally into the .com\
    \ subdomain of .hr.com.\\ FDNs are entered into the DNS tables as one of several\
    \ types of RRs:\n\n+   * An A record is an address record, denoting a standard\
    \ host entry in the DNS table. The key here is that it is used to resolve an FQDN\
    \ to an IP address.\n\n+   * PTR records are used by the inverse lookup zones\
    \ in DNS. The PTR record resolves an IP address to a FQDN.\n\n\n\n\n\n SOA The\
    \ SOA record identifies zone information such as the zone name and serial number.\n\
    \n+   * MX records identify mail servers for the zone."
  merge: -1
  img_proc: true
