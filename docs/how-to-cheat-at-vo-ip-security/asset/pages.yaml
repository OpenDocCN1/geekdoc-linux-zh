- pgno: 300
  md: '# Validate Existing Security Infrastructure • Appendix A


    Implementation of the resulting security policies is also a process. Policy cannot
    merely be pronounced by upper management in a one-directive with high expectations
    of it being readily accepted and adopted. Rather, just as formulating and drafting
    policy involves a process, implementation similarly involves a process, which
    begins with the formal issuance of policy, and continues via user awareness training,
    announc communications utilizing an intranet or other company communications,
    review, and update of policy and policy definitions at regular intervals.


    Often there exists a lack of awareness of an organization''s IT security policies,
    among both the general user population and the IT staff. It is imperative that
    an organization undertake some form of education campaign among the general user
    population to raise awareness of both the existence of IT security policies and
    their contents.


    All employees should be required to read and acknowledge their understanding of
    parts of the IT security policy relevant to the general user population during
    the on-boarding process. As updates are made to the policies that affect the general
    user population, notices should be sent to the users so that they can acquaint
    themselves with the changes. It is not enough for these notices to be sent out
    by e-mail; the notification procedure must include some mechanism for the user
    to acknowledge receipt of the notice and understanding as to the changes to the
    policy.


    The IT staff should also consider conducting brief, in-person group trainings
    regarding the provisions of the IT security policy and physical security in general.
    These trainings are often more effective than impersonal mechanisms such as e-mail,
    which are often ignored or acknowledged without a full understanding of the contents
    of the message or notification. In-person trainings also allow the general user
    population to gain a full understanding of IT security issues, as it allows them
    to ask questions and voice concerns regarding the policy.


    In the process of raising awareness of IT security policies, it is important that
    the general user population understands the sanctions associated with violating
    these policies. A security policy that is not enforced, or that is enforced on
    an arbitrary basis, will be honored more in the breach than in the practice. The
    policies should include mechanisms for measuring compliance, detecting noncompliance,
    and responding to policy violations. The general user population must be aware
    of these mechanisms. These processes are necessary to make sure that users are
    held accountable for their actions, as well as to guard the consequences of inappropriate
    actions.


    A sample VoIP policy module is included at the end of this chapter. You can use
    this as a starting point for your own customized VoIP policy module.


    # Physical Security


    Physical security is an essential part of any security plan. Physical security
    refers to the protection of building sites and equipment (and all other information
    and software contained


    ![](img/c45efece24bfbfca8be768fba195d8a4_300_0.png)'
