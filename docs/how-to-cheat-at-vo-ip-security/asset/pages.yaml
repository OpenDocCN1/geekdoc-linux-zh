  md: '# Support Protocols • Chapter 4 115


    +   - NS NS records are used for name servers for the zone.


    +   - CNAME CNAME records act as alias records to allow for the translation of
    one host name into another.


    +   - INFO Provides information about hosts listed in the DNS table.


    +   - SRV SRV records identify SIP servers for the zone.


    # DNS Client Operation


    In order to locate the IP address for a host, the client''s application will send
    a request to a resolver on the same client system. The resolver will then formulate
    and send out the DNS query. From a high level, the query will typically follow
    a path of trial and error known as a recursive lookup. Figure 4.3 illustrates
    what a recursive lookup from a host, pc2, would like to find the IP address for
    host pc1.


    # Figure 4.3 Recursive Lookups Using DNS


    ![](img/c45efece24bfbfca8be768fba195d8a4_121_0.png)


    +   1. The client''s resolver sends its DNS query, which will be sent to the root
    domain.

    2. The root domain server does not have the RR for the host pc1, so the response
    is sent to redirect the resolver on pc2 to the TLD DNS server for .com since it
    knows .com is.

    3. The resolver, in turn, sends a query to the TLD DNS server for .com.'
