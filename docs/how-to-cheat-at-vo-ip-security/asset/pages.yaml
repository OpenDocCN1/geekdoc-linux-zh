    also include a ''realm'' (a name associated with the Web site) that notifies the
    user that they are accessing. When a client receives such a response, it will
    provide a log-in window to the user to input a name and password. These values
    will be transmitted back to the requesting server for verification. Because of
    HTTP''s design, these credentials will have to be constantly transmitted to the
    server for every data transmission. Each of these transactions transmit the the
    name and password in the clear.


    Another form of authentication supported by modern HTTP clients and servers is
    digest authentication, which is described in depth in RFC 2617. Digest authentication
    has an advantage over basic authentication that it does not clear a password over
    the network. Instead, an MD5 (Message Digest) value of the password is transmitted
    to the requesting server. The server then uses this digest value for password
    comparisons. However, digest authentication is not fully supported in many older
    web browsers. It also not fully protect a user''s credentials. The user name and
    other information about are transmitted in the clear. And, even though the password
    is obfuscated, a malicious user can capture the MD5 value and use it for future
    transactions with that particular server to use another person''s account.


    Many devices have recently provided support for HTTPS to overcome the openness
    of the HTTP protocol. HTTPS is a modification of HTTP where all data between a
    client and server are encrypted using the Secure Sockets Layers (SSL). In order
    for HTTPS to function, both the server and the client must be able to support
    it, and it must be specifically chosen as the form of communication in the URL.
    For example, instead of http://www.foo.com, a secure connection would use https://www.foo.com.


    # SNMP


    SNMP, for Simple Network Management Protocol, is a high-level protocol and architecture
    that allows for the monitoring and maintenance of network devices to detect problems,
    and to fine-tune the network for performance. There are two key versions of SNMP
    in today, SNMPv1 and SNMPv2. While the two share commonalities, there are some
    beneficial additions made to SNMPv2, as many people disagree the security protocols
    implemented into SNMPv2, it has remained less popular and less used than SNMPv1.
    Since that time, a newer version of SNMP was released: the Community-SNMP or SNMPv2c.
    However, the current standard, adopted in 2004, is SNMPv3. SNMP plays a useful
    role in maintaining and administering VoIP networks by allowing the person to
    easily monitor the bandwidth and performance of all the major components of a
    network.


    The SNMP protocol is defined under RFC 1157 as SNMPv1, and the characteristics
    of its immediate successor, SNMPv2, are defined in RFC 1902. SNMPv2c is officially
    detailed in RFC 1901 and in RFC 1908. SNMPv3 is defined in RFC 3411 and


