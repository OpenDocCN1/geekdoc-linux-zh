  md: '# RSVP Protocol


    The RSVP protocol works by transferring UDP packets to the recipient of the data
    transfer to its sender. This allows the data recipient to control whether to use
    regular TCP/IP or use a dedicated path of travel between the two clients. The
    connection initiates this path by sending a constructed RSVP packet to the connection
    initiator. This packet will contain a specific Message Type that indicates the
    action that should be acted upon. The common Message Types for an RSVP protocol
    are


    +   - Path

    - Resv (Reservation Request)

    - PathErr (Path Error)

    - ResvErr (Reservation Error)

    - PathTear (Path Teardown)

    - ResvTear (Reservation Teardown)

    - ResvConf (Reservation Confirmation)


    The RSVP packet also carries a data payload containing specific information on
    how the path should be constructed. The payload contains information such as:


    +   - Session (Destination IP, Tunnel ID, Extended Tunnel ID)

    - Hop (the neighboring router''s interval)

    - Time Values (the refresh interval)

    - Explicit Route (a list of routers between the two devices that creates the data
    path)

    - Adspec (specifies the minimum path latency, MTU, and bandwidth requirements)


    # RSVP Operation


    To create a dedicated path of travel, the RSVP protocol relies heavily on its
    Path and Resv messages. The Path message is used to define the path of routers
    to be used for communication between the two clients. This packet is sent from
    the receiving end of communication towards the sender. As it passes through each
    individual router, the router examines the packet to determine its neighboring
    IP addresses, which it must route packets to. The Resv message or Reservation
    request, is equally important. The Resv message is sent from each router to its
    neighboring router, one hop at a time. The Resv packet helps create the reservation
    on each router involved in the path. The transfer of Path and Resv packets is
    detailed in Figure 4.7.


    ![](img/c45efece24bfbfca8be768fba195d8a4_136_0.png)'
