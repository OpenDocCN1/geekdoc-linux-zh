    # Replay Protection


    SRTP packet-index determination deciphers the index of an invalid as well as a
    valid packet. There can be no integrity until the authentication key is determined.
    SRTP replay protection is the first line of defense against packets sent by an
    attacker.


    To counter replay attack, Rollover Counter (ROC) and sliding window are used.
    The 16-bit sequence number from the RTP header is added to the 32-bit SRTP ROC
    that is stored in the cryptographic context to get the 48-bit sequence number,
    which is the SRTP packet index for the particular packet. The packet index is
    encrypted with other parameters to generate key stream segments.


    As Figure 9.7 depicts, a received packet index must fall within range of the sliding
    window, and its corresponding "Received ?" bit must not be checked in order for
    the packet to be passed to the next processing step. If the packet does not meet
    the criteria, it is discarded. If an attacker chooses a sequence number at random,
    and the window size is 64, there is a 99.9 percent likelihood (1–64/2⁶) that the
    packet will be discarded before more computationally intense message authentication
    is applied.'
