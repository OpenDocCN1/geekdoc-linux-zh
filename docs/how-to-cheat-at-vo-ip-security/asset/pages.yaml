  md: '# PSTN: Switching and Signaling


    As the PSTN''s global reach and capabilities become more extensive, signaling
    became the most significant security concern within the PSTN. In its early days,
    signaling was no more complicated than taking the phone off-hook to let an operator
    know you wanted to make a call. Dialing gradually became automatic, first for
    operators, then later for subscribers. Today''s direct-dial, VoIP gateways, and
    myriad protocols only serve to increase the complexities and risks when it comes
    to signaling.


    Electromechanical switching equipment first appeared in 1891 Almon Strower''s
    patented Step by Step (SXS) system, although Bell System resistance to it would
    postpone its adoption for digital. The classic rotary dial was no automatic but
    Stronger invention that was finally adopted by the Bell System in 1919 with SXS
    switches. It would take until 1948 for Western Electric (the equipment R&D arm
    of the Bell system) to develop a superior automatic switching system, the crossbar
    switch. And not until the 1950s did Bell Labs embark on a computer-controlled
    switch point, but the 101 ESS PBX that resulted in 1963 was only partially digital.
    Also introduced that was the T1 circuit and Touch Phones, the Dual-Tone Multi-Frequency
    (DTMF) dialing scheme that is with us today. Despite the fact that switching was
    still analog, T1 circuits quickly replaced analog backbone circuits and most CO
    interconnect trunks. By 1965 Bell had the first central switch with computerized
    stored program control, the 1ESS offered new features like speed dialing and calling
    forwarding. Yet the 1ESS was still an analog switch at core. Thanks to T1 "robbed
    bit" signaling, however, all signaling was out of band, least from the phone phreaker''s
    perspective.


    Insiders suggest that AT&T was prepared to postpone true digital switching until
    the 1990s, but Northern Telecom changed their plans with the DMS-100 all-digital
    switching, introduced in the late 90s. The need for an all-digital AT&T alternative
    drove development of the The most common Class 5 (central) switches in North America
    are the Nortel DMS-100 and Lucent 5ESS, running ITU-T Signaling System Number
    7 (SS7) with ISDN support.


    The Class 5 switch is the first point where we can find the full suite of telephone
    services being handled in one place as part of the Intelligent Network model.
    A typical Class 5 switch can handle operator services, call waiting, long distance,
    ISDN, and other data services. The Class 5 switch tables that are queried for
    every service and will send the appropriate request to the place. For instance,
    when you pick up the phone in your house to make a long distance call, the Class
    5 switch detects the line is open and provides a timeslot in the switch (this
    is when the dial tone comes), then on the buttons pushed (dialed) the switch will
    send the call to the local carrier or to the long distance provider. If you dial
    a long distance call from a provider who is not your local provider, the switch
    will deliver the request to the closest switch that handles for that particular
    carrier. Class 5 switches act on demand (i.e., they set up, sustain, and tear
    down


    ![](img/c45efece24bfbfca8be768fba195d8a4_61_0.png)'
