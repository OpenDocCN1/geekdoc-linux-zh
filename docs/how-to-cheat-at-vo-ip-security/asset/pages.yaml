  md: '# Chapter 2 • The Hardware Infrastructure


    # Wireless VoIP Clients


    Over the past few years, an explosion of wireless VoIP solutions has hit the marketplace.
    Most of these solutions are immature and if broadly deployed completely overrun
    the available bandwidth of 802.11b (or g) networks that were not engineered for
    high-density voice, with QoS prioritization. And although 802.11a networks can
    handle higher VoIP densities, they present other backward-compatibility issues
    of their users. And we haven''t gotten to the security issues yet! Still, the
    promise of WiFi VoIP is tantalizing, and most enterprises that have deployed VoIP
    solutions have experimented with it. The idea of a combinedCellphone/VoIP phone
    (and perhaps PDA too) seems too compelling to ignore, even if power issues sideline
    the concept desired in the short term.


    # IP Switches and Routers


    Although their purpose is defined by a standard data network than VoIP, a router''s
    purpose is to connect two or more IP subnets at layer 3. An IP switch performs
    a similar function at layer 2. Routers and switches operate on the network and
    data-link layers, investigating the IP address or MAC address for each packet
    to determine its final destination and then forwarding that packet to its recipient.
    For VoIP, the biggest consideration at these levels are QoS markings and treatment
    such as DiffServ and RSVP, which should be supported by this infrastructure in
    a way that allows legitimate voice packets through high priority and shuts out
    malicious packets, particularly those aimed at causing DoS attacks. It might be
    better said than in some cases. If an attacker can inject QoS-marked packets into
    your network, will your QoS create a DoS condition for both voice and data?


    # Wireless Infrastructure


    Wireless access points and associated infrastructure are similarly an extended
    extension of the data network. However, the increasing use of VoIP clients within
    this infrastructure creates several unique security concerns (particularly Dos
    given that voice is a shared medium). In addition, wireless VoIP devices in the
    marketplace have lagged in implementation of the most current wireless encryption
    recommendations. All this should be taken into consideration in the design and
    operation of wireless VoIP.


    # Wireless Encryption: WEP


    When wireless networking was first designed, its primary focus was ease of implementation,
    and certainly not security.As any security expert will tell you, it''s extremely
    difficult to secure a system after the fact. WEP, the Wired Equivalent Privacy
    encryption scheme, was targeted at preventing theft-of-service and eavesdropping
    attacks. WEP comes in two major varieties, standard 64-bit and 128-bit encryption.
    256-bit and 512-bit implement-


    ![](img/c45efece24bfbfca8be768fba195d8a4_44_0.png)'
