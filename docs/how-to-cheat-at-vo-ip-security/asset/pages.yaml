- pgno: 184
  md: '# Figure 6.10 PKI Entities and Their Relationships


    ![](img/c45efece24bfbfca8be768fba195d8a4_184_0.png)


    +   - **Registration Authority (RA)** An optional system to which a CA delegates
    certificate management functions.


    +   - **CRL issuer** An optional system to which a CA delegates the publication
    of certificate lists. This entity manages the equivalent of a stolen or lost credit
    card report and distributes certificate revocation information.


    +   - **Repository** A system or collection of distributed systems that stores
    certificates and CRLs and serves as a means of distributing these certificates
    and CRLs to end entities. An analogy is a credit card holder database.


    Operational protocols deliver certificates and CRLs (or status information) to
    clients. A variety of methods to deliver certificates and CRLs are needed, including
    distribution procedures based on Lightweight Directory Access Protocol (LDAP),
    HTTP, File Transfer Protocol (FTP), and X.500.


    Management protocols support online interactions between PKI user and management
    entities. For example, a management protocol might be used between a CA and a
    client system with which a key is associated, or between two CAs that cross-certify
    each other. The set of functions potentially needing to be supported by management
    protocols include user registration, client initialization, user certification,
    periodic key update, revocation request, and cross-certification.'
