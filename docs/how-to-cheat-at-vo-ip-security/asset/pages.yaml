- pgno: 18
  md: '# Chapter 1 • Introduction to VoIP Security


    +   - Establishing connections (circuits) between the telephone sets of two or
    more users

    - Maintaining such connections as long as the users require them

    - Providing information for management and billing purposes.


    Additionally, the PBX usually supports dozens or hundreds of ancillary call functions
    such as call transfer, call forwarding, voicemail, and so on.


    The contemporary IP PBX functions in a similar fashion, although more functionality
    and intelligence is distributed to the endpoints depending upon the underlying
    protocols and architecture.


    > **Confidentiality, Integrity, and Availability:** A simple but widely applicable
    security model is the CIA triad—standing for Confidentiality, Integrity, and Availability—three
    key principles that should be guaranteed in any kind of secure system. This principle
    is applicable across the whole security spectrum. Confidentiality refers to mechanisms
    that ensure only authorized individuals may access secure information. Cryptography
    and Encryption are examples of methods used to ensure confidentiality of data.
    Integrity means that information is unchanged as it moves between endpoints. Availability
    characterizes the operational state of the network, and usually is expressed as
    “nines,” or the number of nines on both sides of the decimal point (i.e., 99.999%
    reliability equals “5 nines”). It is critical to ensure that information is readily
    accessible to the authorized sender and receiver at all times. The Availability
    component of this triad is practically important when securing converged networks.


    One of the first issues voiced by organizations implementing VoIP is the issue
    of the confidentiality of voice conversations. Unlike traditional telephone networks,
    which are circuit switched and relatively difficult to tap, voice traffic on converged
    networks packet switched and vulnerable to interception with the same techniques
    used to sniff other traffic on a LAN or WAN. Even an unsophisticated attacker
    can intercept and decode voice conversations.'
  merge: -1
  img_proc: true
