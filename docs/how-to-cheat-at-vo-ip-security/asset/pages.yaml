- pgno: 363
  md: '# CALEA: Communications


    # Assistance for Law Enforcement Act


    The Communications Assistance for Law Enforcement first arrived from the U.S.
    Congress in 1994 with a simple goal: improving wiretapping effectiveness for law-enforcement
    in an increasingly digital PST. Advances in telecommunications made prior wiretapping
    methods less effective and CALEA was intended to force all carriers and carrier-grade
    equipment vendors to provide consistent and accessible electronic monitoring capabilities.
    For private equipment, including PBX and similar business-class voice equipment,
    CALEA does not apply except when equipment was deemed a “substantial replacement”
    for the public telephone service.


    Between 1994 and 2004, CALEA eventually progressed to a rough set of technically
    standards backed by FCC regulations (and deep involvement by the Federal Bureau
    of Investigation (FBI) and Department of Justice (DOJ)), though packet communications
    were still a CALEA minefield. VoIP and broadband issues came to a head in August
    2004 when the FCC issued a Notice of Proposed Rulemaking and Declaratory Ruling
    (NPRM) for public comment, stirring up anew the privacy and civil-liberties debate
    (see the sidebar, “CALEA and the Xbox”). Since the new NPRM might be broad enough
    to force enterprises, universities, and previously excluded organizations that
    deploy VoIP to become subject to the revised regulations. Although several requests
    for clarification on that topic are still pending at the FCC, it’s clear these
    rules could substantially affect the design and deployment of enterprise VoIP.


    If you’re a carrier (of Voice, VoIP, or even just broadband IP), CALEA regulation
    is already a certainty (although in the case of broadband, there is a lot of work
    remaining even to agree on the technical standards, and the FBI has yet to specify
    capacity requirements required by the Act). And in spite of the fact that in November
    1994, the FCC ruled that VoIP was a “data service” for other regulatory purposes,
    the FCC and DOJ agreed that data services were still within the scope of CALEA.
    Although predictable, this nevertheless came as a shock to many carriers who had
    in recent years became comfortable with the FCC hands-off approach to data networks
    and VoIP despite pressure from the FBI and Department of Justice (DOJ).


    ![](img/c45efece24bfbfca8be768fba195d8a4_363_0.png)'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# Notes from the Underground...


    # CALEA and the Xbox?


    With the latest CALEA guidance for broadband, it''s applicability to VoIP and
    data networks that have become a new privacy battleground. Groups Like the Electronic
    Frontier Foundation have been heavily involved in the debate, and from their perspective,
    the consequences of the revised CALEA rules could have long-ranging—and possibly
    dire—consequences:


    “If the FBI gets its way, the NPRM''s tentative regulations will only be the tip
    of the iceberg. Soon, software companies, under threat of an expansive definition
    of CALEA''s requirements, will face economic incentives to create email and IM
    programs that are surveillance-ready. Many computer game consoles that people
    can use to play over the Internet, such as the Xbox, allow gamers to chat with
    each other while they play. If any communication program running on the Internet
    has to be CALEA-compliant before being bought and sold, what would stop law enforcement
    from pushing for a tappable Xbox?”


    Although it remains to be seen how far the FCC and DOJ take enforcement of CALEA,
    it seems unlikely that serious enforcement will happen outside of the carrier
    space (with the possible exception of organizations like universities that provide
    phone service over a large campus).


    Figure C.1 shows a timeline for the development of the CALEA.'
