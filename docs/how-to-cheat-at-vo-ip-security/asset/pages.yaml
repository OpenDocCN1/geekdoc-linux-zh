    # Interactive Media Service: Media Servers


    On the other hand, there is another kind of media server that actually contains
    DSP resources that it uses to process speech or video (and perhaps one more additional
    form of media).These may be involved in generating and receiving DTMF tones, executing
    the logic of an IVR system, converting text-to-speech or handling streaming or
    document in response to speech or DTMF input. It may orchestrate multicast call
    traffic, conference calls, handle translation between codecs, or fix processing.
    Media servers of this class may provide VoiceXML interpretation for interactive,
    dynamic voice applications.


    # Call or Resource Control: Media Servers


    This class of media server is responsible for managing communications resources
    at a higher level, such as handling control while managing media gateways that
    have DSP and gateway resources for the actual media manipulation. Most Media Servers
    support VoIP protocols but are also likely to support others as well, such as
    digital video or video trunks, or even analog video through media gateways. Examples
    of this kind of media server include call servers from PBX vendors that control
    separate gateways, voice processing servers that manage and redirect DSP resources
    located elsewhere, and call distribution systems that manage off-board call handling
    resources as switches and IVR systems.


    # The H.323 Gatekeeper


    This gatekeeper is the manager of one or more gateways, and is responsible for
    providing address translation (alias to IP address) and access control to VoIP
    terminals and gateways. A gatekeeper acts as the central authority for other gateways,
    allowing an administrator to quickly and authoritative roll changes across a voice
    network. Gatekeepers limit the number of calls at a given time on a network by
    implementing control over a proxy. AGatekeeper works like this: A user wants to
    make a call to another user at a different physical location, and he registers
    with a local gateway. The gateway then passes on his call information to the gatekeeper,
    which acts as a central hub to other gateways and users. The gatekeeper then passes
    setup information to the gatekeeper at the other office, which in turn hands it
    to the appropriate destination gateway, and finally to the desktop of the called
    party. Many call media servers include an H.323 gatekeeper.'
