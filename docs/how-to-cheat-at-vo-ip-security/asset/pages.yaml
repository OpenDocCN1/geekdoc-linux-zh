  md: '# Validate Existing Security Infrastructure • Appendix A


    All biometric devices rely upon some type of input device, such as a video camera,
    retinal scanner, thumb pad, or microphone. The data is digitized and compared
    to a stored record. If the match is within defined parameters access is granted.


    # Wire Closets


    Wire closets form a very important piece of the actual network as well as the
    data that travels on it. Many wire closets contain both network and telephone
    connections. Oftentimes cases exist where the wire closet is shared by many of
    the building occupants. The wiring closet can be a very effective launch point
    for internal attacks. It is well suited to the unobserved monitoring of a network.
    Recommend securing these sensitive locations. When available, they could be added
    to the already existing card key systems. This would automate the logging of who
    accessed the location and when. A recommended course of correction would also
    include the requirement that your organization''s representative be physically
    present during the entire period a collocated wire closet is accessed. What if
    the landlord access to the closet in a shared-tenant space (a common scenario)?
    One answer is to use the closet only for external PSTN connectivity and home-run
    all other wiring to a dedicated closet.


    ![](img/c45efece24bfbfca8be768fba195d8a4_304_0.png)


    Passwords: The Single Most Important Security Control

    You will see this axiom repeated several times in this text. Well-chosen passwords
    are the single most important element of any computer security policy. They are
    the front line of protection, and often the only line of protection, for user
    and administrative accounts. A single poorly chosen password may result in the
    compromise of an entire enterprise network. The first step in protecting against
    unauthorized access is to define, communicate, and enforce strong password policies.


