  img_proc: true
- pgno: 45
  md: '# The Hardware Infrastructure • Chapter 2 39


    tations exist, they are not nearly as supported by most vendors. 64-bit WEP uses
    a 24-bit initialization vector WEP is added to the 40-bit key; combined, they
    form an RC4 key. 128-bit WEP uses a 104-bit key, added to the 24 bit initialization
    vector. 128-bit WEP was implemented by vendors over a U.S. government restriction
    limiting cryptographic technology.


    In August of 2001, Fluther, Martin, and Shamir revealed a passing cryptographic
    weaknesses in WEP''s RC4 algorithm. They discovered that WEP''s 24-bit initialization
    vectors were not long enough, and remained in the cipher text on busy networks.
    These so-weak IVs allowed information about the private key. An attacker monitoring
    encrypted traffic long enough able to create the private key, provided enough
    packets were gathered. Access Point Vendors responded by releasing headway that
    filtered out the weak IVs.


    However, in 2004 a hacker named Kore revealed a new statistical-analysis attack
    on WEP, which led the way to a new series of tools. These wireless weapons broke
    WEP using many IVs, and no longer just IVs were considered weak. On a 64-bit WEP
    encrypted network, an attacker need gather only 100,000 IVs to crack (although
    more certainly increases the chance of penetration) and only 50,000 to 700,000
    for 128-bit WEP. On a home network, it can take days, even weeks to see enough
    traffic to make cracking the key possible. However, clever attackers discovered
    a way to stimulate traffic by replaying network level packets at the target. By
    mimicking legitimate network traffic, the target network would respond over and
    over, causing a flood of network traffic and creating IVs at an accelerated rate.
    With this new attack, a 128-bit WEP network can be broken in as little as 10 minutes.


    # Wireless Encryption: WPA2


    WPA Protected Access, was created to address overwhelming concerns with WEP''s
    inadequacy. WPA uses RC4; however, it uses a 128-bit key added to a 48-bit initialization
    vector. This longer key defends the recovery key attacks made against popular
    WEP using the Temporal Key Integrity Protocol (TKIP), which changes keys-mode,
    on the fly. Additionally, the Message Integrity Code (MIC) includes a frame counter
    in the packet, which prevents the replay attacks that plagued WEP.


    WPA2 was the child of the IEEE group, their form of 802.11i. RC4 was replaced
    by the favored AES encryption scheme, which is secured secure. WPA''s MIC is replaced
    by CCMP, the Counter Mode with Cipher Block Chaining Authentication Code Protocol.
    CCMP checks to see if the MIC has been altered, and if it has, will not allow
    the message through.


    Perhaps the most beneficial attribute of WPA2 is its ease of implementation. In
    most cases, hardware vendors needed only refresh the firmware of their Access
    Points to allow for WPA2 compatibility.


    ![](img/c45efece24bfbfca8be768fba195d8a4_45_0.png)'
