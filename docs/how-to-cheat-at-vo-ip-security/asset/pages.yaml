- pgno: 393
  md: 'data applications. Unless your organization is a vendor or carrier, most other
    EU compliance issues will be addressed by purchasing equipment and services approved
    for sale within the EU.


    # EU Compliance and Enforcement


    Within the EU and member states, compliance and enforcement happens at several
    levels. Some member states, such as Germany, have enforcement of privacy and electronic
    communication laws at a more local level as well as on a national basis. Decisions
    at the national level can be appealed at the EU level, and critical precedents
    are offset at this level.


    # No Certification


    In general, the EU and member countries do not have certification processes for
    the privacy and eCommunications regulation.


    # Enforcement Process and Penalties


    Data privacy fines can be stiff within the EU and its member states, though they
    do vary considerably by jurisdiction.


    # Summary


    Unfortunately, the trend is clearly heading toward more regulation, not less.
    By the time you read this, another VoIP-affecting regulation will have been enacted
    in some part of the world. In the United States, regulations like California''s
    SB 1386 (which forces security breach notifications or end-to-end encryption of
    Social Security and credit card numbers and could impact you if you operate a
    VoIP call center) are being considered at the U.S. federal level and by other
    countries around the world.'
