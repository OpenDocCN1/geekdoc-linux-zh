  md: '# Confirm User Identity • Chapter 6


    In Figure 6.9, Alice uses public key cryptography to send a ciphertext to Bob.
    She first locates Bob''s public key (normally from some type of directory service
    or from a previous secured document that Bob has sent to her) and encrypts the
    plaintext with Bob''s public key. She sends the encrypted text to Bob. Only Bob
    has the corresponding private key that can be used to decode the ciphertext.


    Note that in normal practice, for performance reasons, the actual ciphertext is
    encrypted using a secret key algorithm as shown in Figure 6.8. Symmetric algorithms
    are much faster than public/private key algorithms (asymmetric cryptography).
    A random key (the session key) is generated, and it is used with the symmetric
    algorithm to encrypt the information. The public key is used to encrypt that key
    and both are sent to the recipient. The private key is used to decrypt the session
    key, and the resulting session key is used to decrypt the actual data.


    # Figure 6.9 Public Key Cryptography


    ![](img/c45efece24bfbfca8be768fba195d8a4_182_0.png)


    The developers of public key cryptography were economical with keys. Both the
    public and private key are used for more than just encrypting and decrypting data
    or session keys. The private key is also used to digitally sign the message sent
    so that the sender''s identity is guaranteed. If the sender wishes to prove to
    a recipient that they are the source of information (perhaps they accept legal
    responsibility for it), the sender uses his or her (its) private key to digitally
    sign a message (a digital signature). Unlike a handwritten signature, a digital
    signature is different every time it is created. To create the digital signature,
    a hash of'
