  md: '# Validate Existing Security Infrastructure • Appendix A 305


    Linux provides a number of accounts that are not required for a media server or
    PBX. The rule of thumb is: if you do not require an account, remove it. Each additional
    account is one less possible avenue of access to the system.


    Create the "wheel" group if it doesn''t already exist, and populate group with
    administrators. The wheel group is a group of select individuals that can execute
    powerful commands, as /bin/su. By limiting the people that can access these commands,
    you enhance system security.


    If you exist on your system, lock down the .hosts, .netrc, and /etc/hosts.equiv.
    The r commands, which are deprecated for remote access nowadays, use these files
    to configure access to systems. To lock them down, touch the files, and then change
    the permissions to zero. This means only one root can create or alter the files.
    For example:


    ```

    /bin/touch /root/.hosts /root/.netrc /etc/hosts.equiv

    /bin/chmod 0 /root/.hosts /root/.netrc /etc/hosts.equiv

    ```


