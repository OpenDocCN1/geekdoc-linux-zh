- pgno: 176
  md: '# EAP-PEAP


    EAP-PEAP (Extensible Authentication Protocol-Protected Authentication Protocol)
    provides a method to transport secure authentication data, including legacy word-based
    protocols. PEAP accomplishes this by tunneling credentials over a TLS tunnel between
    PEAP clients and an authentication server. EAP-PEAP is the best combination of
    security and ease of deployment in Windows environments today. EAP-PEAP requires
    only a server certificate (which is simple enough to create for testing using
    the native MS Certification Authority) and client username/password combinations.
    EAP-PEAP is natively supported on Windows XP and Windows 2000 SP4 and above client
    platforms and IAS (Internet Authentication server). PEAPv0/EAP-MSCHAPv2 is the
    only thing that EAP-PEAP.


    # EAP-TLS


    EAP-TLS (Extensible Authentication Protocol-Tunled Transport Security) is supported
    primarily by the Funk RADIUS Protocol. EAP-TLS, like PEAP, is also relatively
    easy to deploy (it requires only a server-side certificate) and quite secure since
    it tunnels credentials inside a TLS tunnel; however, this Funk Software has not
    been supported by Microsoft on clients or IAS server. Thus, EAP-TLS requires the
    use of an additional software. TLS and PEAP are similar in other ways, but there
    are differences: TLS supports other EAP authentication methods and also supports
    inner authentication methods, PAP, CHAP, MS-CHAP, and MS-CHAPv2, whereas PEAP
    can tunnel only EAP-type protocols such as EAP-TLS, EAP-MS-CHAPv2, and EAP-SIM.


    # PEAPv1/EAP-GTC


    PEAPv1/EAP-GTC (Extensible Authentication Protocol-Generic Token Card) was defined
    in RFC2284 with one-time passwords, and MD5 was one of the initial set of EAP
    Types used in Request/Response exchanges. Cisco supports this type of EAP (v1,
    v.0) and Microsoft supports only PEAPv0.


    # EAP-FAST


    EAP-FAST (Extensible Authentication Protocol-Flexible Authentication via Secure
    Tunneling) was developed by Cisco. EAP-FAST authenticates both the client and
    the authentication server using a shared secret known as the Protected Access
    Credential (PAC). EAP-FAST is a certificate-free replacement for LEAP. FAST is
    is easy to implement in Windows/Cisco mixed environments, but this method is vulnerable
    to MITM (man the middle) attacks in which an attacker can acquire the MS-CHAPv2
    hash of the user''s passwords, which can be subjected to off-line dictionary attacks.'
