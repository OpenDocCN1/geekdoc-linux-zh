- pgno: 191
  md: '# Introduction


    At this point, we have examined and hardened the working existing security infrastructure,
    established procedures to confirm user and device identities, and logically separated
    voice and data traffic, allowing the network to now carry them. The next step
    in maintaining the security of this infrastructure is to monitor traffic and the
    state of key devices. This is accomplished by active monitoring.


    Plenty of commercial and open-source tools exist to help with this, and in this
    chapter we will look at several categories of them. We won''t, however, discuss
    in any detail the large commercial monitoring suites like NetIQ, SMARTS, BMC Patrol,
    HP OpenView Operations, HP Network Node Manager NNM, IBM Tivoli, Nortel Optivity
    NMS, Cisco Cisco, Sun Solstice SunNet Enterprise Manager, Microcom, Computer Associates
    Unicenter, and Microsoft Operations Manager 2000 (MOM). While we recommend that
    organizations employ one or more of these enterprise tools (particularly to monitor
    network jitter, packet loss, and latency), the configuration, use or integration
    of any one of these tools with VoIP monitoring is complex, dependent on both the
    suite chosen and the peculiarities of each particular network. For the reason
    we will have to leave this discussion to another time.


    A related class of tools for both monitoring and performance testing of VoIP networks
    includes like Empir Hammer, Bridge Network Verifier, and Shun’s Virtual Enterprise.
    These tools use different techniques and metrics to monitor the functionality,
    performance, scalability, and robustness of VoIP networks to provide signaling
    and media quality data on every call. Administrators can monitor high-level network
    metrics via integration with their existing Network Management Systems or drill
    into the details of any call down to include protocol and network messages.


    We will start off by discussing more intrusion detection (ID) technologies: NIDS
    (network-based) and HIDS (host-based). NIDS inspects all inbound and outbound
    network traffic and identifies patterns of data that may indicate a network or
    system attack. NIDSs are normally arranged in a multiple-sensor-to-one configuration,
    where the sensors reside on deployed appliances distributed at network junctions,
    and report back to a central management console. HIDS, on the other hand, normally
    reside on the server that they monitor also report back to a central management
    console. A third class of intrusion detection is exemplified by DShield or Shymante—intrusion
    detection—where global system attacks are reported to, and consolidated by, a
    central management server. Intrusion detection is a requirement in contemporary
    networks since it is not possible to stay away of eavesdropping and potential
    threats to modern computing systems.


    Next, we will take a look at logging, primarily focusing on syslog and SNMP. Syslog
    (system logger) provides a means to allow a machine to send event notification
    messages across IP networks to event message collectors (also known as syslog
    servers). The decision regarding how and what types of data should be logged is
    a critical responsibility of'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Active Security Monitoring • Chapter 7 187


    the system administrator. However, in most systems the sheer amount of logging
    data generated by system loggers can easily overwhelm most system administrators.
    We have witnessed organizations that react to events, not data contained in the
    logs, but according to the number of logs generated per unit of time. In order
    to deal with this mass of data, many system administrators develop scripts or
    tools to examine the log files and extract the important information. These tools
    are important because, without them, log data is often ignored. SNMP (Simple Network
    Management Protocol) is the primary transport for the aforementioned large tool
    suites. There are, however, simple point SNMP tools available, and we will offer
    suggestions regarding general SNMP usage.


    Finally, in this chapter, we will cover a section on penetration testing. Penetration
    testing is a means of monitoring the state of security controls on or VoIP network.
    The primary reason for testing systems or networks is to identify potential vulnerabilities
    and subsequently repair them. Penetration Testing (Pen Testing) is an intelligent
    combination of automated and manual examinations that are launched from either
    inside or outside the perimeter of a private network. This testingulates the threat
    from hackers and other parties, their attempts to enumerate and provide visible
    services.


    Although we are aware of production ready VoIP-specific NIDS, several are rumored
    to be in development. As a note: based upon data gathered from historical analysis
    of call flows, anomaly detection, particularly in a call center where traffic
    is more defined than in an converged network, may prove to be an effective NIDS
    strategy.


    # Network Intrusion Detection Systems


    Network Intrusion Detection Systems (NIDSs) are designed to alert administrators
    when malicious or illegitimate traffic is detected. Malicious traffic can consist
    of worm or exploit-based code, while illegitimate traffic (often termed “misuse”)
    consists of traffic that deviates from established security policy such as surging
    porn sites or peer-to-peer connections. Network-based IDS can monitor an entire,
    large network with only a few well-situated nodes or devices and impose little
    overhead on a network. NIDS are found in most computing environments today, no
    matter how well security controls are implemented it is impractical to maintain
    defenses against all known and potential threats to networked systems and applications.
    In VoIP environments, NIDSs provide an additional layer of defense.


    # NIDS Defined


    NIDS detects suspicious activity in three ways. First, the security community
    maintains an extremely large database of specific attack signatures. These signatures
    are programmed into the NIDS sensor, and are updated on a regular basis. Examples
    of attack signatures include Code Red, NIMDA, DoS attacks, buffer overflows, ASP,
    and CGI vulnerabilities. Second, the


    ![](img/c45efece24bfbfca8be768fba195d8a4_192_0.png)'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'NIDS sensors continuously monitor the network for anomalous behavior. Though
    not as specific as attack signatures, these anomalies are highly effective for
    the detection of port scans, distributed network probes, new forms of buffer overflows,
    and Denial-of-Service attacks. Third, all NIDS sensors can apply and detect security
    policy deviations. These policy deviations include the detection of unauthorized
    network services, applications running on unusual ports, and backdoor/Trojan activity.


    Signature-based NIDS are essentially network sniffers combined with a database
    of attack signatures. One of the most difficult (and necessary) tasks when configuring
    the NIDS is the job of de-tuning it. It is important that the number of false
    positives be reduced; otherwise, they will make meaningful analysis of the data
    impossible.


    # Components


    Most NIDS are configured in a client-(sensor)-to-server (management console) configuration.
    Many sensors report to one or several management consoles. Sensors can be dedicated
    appliances, can run as an application on a host running other applications, or
    can run independently in a virtual subsystem such as VMware or Xen. If the sensor
    does not reside on a dedicated appliance, then the OS of the host computer should
    be hardened.


    Because NIDS do not reside in the datapath one NIDS is used for management traffic,
    and a second NIDS is used for network traffic, the sensor Ethernet interface can
    be configured in a number of ways as receive only. Sensor hardware requirements
    are not particularly strict since the sensor normally inspects packets, and upon
    finding a signature or pattern match, sends subsequent data upstream to the management
    console for processing and visualization.


    The term “signature” refers to a set of conditions that, when met, indicate some
    type of intrusion event. Modern sensors contain a signature database consisting
    of 1000 to 2000 entries. Often, sensors inspect traffic based on a mixture of
    signature matching as well as pattern matching. Pattern matching is based on looking
    for a fixed sequence of bytes in a single packet. A more sophisticated method
    is stateful pattern matching. Stateful pattern matching is useful when the intrusion
    spans more than a single packet. Similar to antivirus software, a signature-based
    IDS requires regular access to an up-to-date database of attack signatures so
    recent exploits are not missed.


    Figure 7.1 is a simple illustration of the basic logic used by NIDS management
    systems when resolving an event reported by a remote sensor. The “Match IDS Rule”
    logic normally resides on the sensor. When a rule is matched (for example: “packet
    from outside to inside illegal SIP rerouting headers”), the data is forwarded
    to the management console where it is prioritized, logged, and visualized.'
