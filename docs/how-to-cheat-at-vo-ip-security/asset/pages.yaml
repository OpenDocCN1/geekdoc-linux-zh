- pgno: 10
  md: '# Chapter 1 - Introduction to VoIP Security


    possible without accepting significant risk. The goal is to be intelligently,
    economically, bal- ance risks.


    This book is based on the premise that in order to secure VoIP systems and applications,
    you must first understand them. In addition, efficient and economic deployment
    of secu- controls requires that you understand those controls, their limitations,
    and their interac- tions with one another and other components that constitute
    the VoIP and supporting infrastructure.


    # The Switch Leaves the Basement


    Telephone networks were designed for voice transmission. Data networks were not.
    Recently—within the last three to five—PBX functionality has moved logically (and
    even physically) from the closet or fenced room into the basement into the data
    networking space, from physical connectivity and management standpoints. Additionally,
    the com- pon of the converged infrastructure (gateways, gatekeepers, media servers,
    IP PBXs, etc.) are no longer esoteric variants of VxWorks, Oryx-Pecos, or other
    proprietary Unixes, or operating systems are not well known or distributed to
    be many hacking targets; but instead run on well-known, commonly exploited Windows
    and Linux OSes. SS7, which hardly did any data networking people understand, is
    slowly being replaced by SIGTRAN (which is basically SS7 over IP), H.323 (☺),
    and SIP (which is many things to many people), running over TCP/IP networks. By
    the way, hackers under- stand TCP/IP.


    Most people, if they even think about it, consider the traditional public switched
    tele-phone network (PSTN) secure. On the PSTN the eavesdropper requires physical
    access to the telephone line switch and an appropriate hardware budding device.


    > Whenever a telephone line is tapped, the privacy of the persons at both ends
    of the line is invaded, and all conversations between them upon any subject, and
    although proper, confidential, and privileged, may be overheard. Moreover, the
    tapping of one man’s telephone line involves the tapping of the telephone of every
    other person whom he may call, or who may call him. As a means of espionage, writes
    of assistance and general warrants are puny instruments of tyranny and oppression
    when compared with wire tap- ping.

    Justice Louis Brandeis, Olmstead v. United States, 1928.'
