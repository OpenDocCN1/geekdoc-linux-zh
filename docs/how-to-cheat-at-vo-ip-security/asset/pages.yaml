  md: '# Proxy Servers


    You can configure Skype to use the proxy server to gain access to the Internet.
    The address of the proxy server may not be easily determined by setting Internet
    Explorer’s Connection LAN Settings to Automatically detect settings. If you would
    like to determine the actual proxy server name to enter in the Skype configuration
    dialog, simply type netstat v at a command prompt. You will notice many Internet
    connections from the same port, most likely 8080 or 8088, from a machine on your
    network. That machine is most likely to be your proxy server. If you have more
    than one proxy server on your network, every time you log in, you may get a different
    proxy server with the automatic configuration. Manually defining the proxy server
    allows a network administrator to configure a single proxy server for Skype traffic
    and have more control over Skype traffic.


    # Embedded Skype


    Skype has signed contracts with some vendors to embed its client software into
    various products. These products are phone sets, small office/home office (SOHO)
    routers, and other network devices. Skype-enabled devices can have adverse effects
    on the security of your network if you do not know that "hidden" clients are in
    various pieces of hardware. The administrator must not only manage the network
    but also be aware of the hardware brought into the network. Be sure to understand
    the devices on your network and what they do to prevent unauthorized devices from
    using your network.


    # A Word about Security


    Many companies with an IT staff are or will ask, "Is Skype secure?" While writing
    this book, Skype released a Security White Paper by Tom Benson of Anagram Laboratories,
    a well-known cryptographer who outlines how Skype uses its encryption. This paper
    may be found at http://www.skype.com/security/.


    Companies that are aware and have a good security posture will question whether
    any voice software, or softphone as this technology is referred to, is enough
    to discuss anything from human resource issues, mergers and acquisitions to participating
    in conference calls. Benson’s paper should calm the fears of many security practitioners.
    However, many corporations will still wonder about the security of a softphone
    on a computer that is mobile or in a remote location, such as an employee’s home,
    hotel, or hotspot. For example, corporations will be concerned whether these mobile
    devices could get compromised with a recording device and record the calls and
    upload them to a Web site to be listened to by the masses or to the competition.

    These concerns are valid for any company and might even be the typical home user,
    but one of the guiding rules of security is to "classify your data." Companies
    must (1) determine what data, or in this case voice transmissions, must be protected;
    (2) determine


