    Microsoft Messenger. Also mentioning is the Lotus Domino IM chat that competes
    with Microsoft LCS in the enterprise instant messaging (and presence) space, well
    as Jabber, which can be tied together both public and private IM services using
    the XMPP protocol.


    Google Talk is the newest in the IM game. Though Google Talk is still in its infancy,
