- pgno: 26
  md: '# Introduction


    Even after of VoIP, business telephony equipment has remained focused on two areas:
    (1) reducing the cost of Public Switched Telephone Network (PSTN) connectivity
    and (2) adding business communications feature–functionality. Since the first
    private branch exchange (PBX) was introduced in 1879, business customers have
    sought cost savings by reducing the use of physical lines or trunks that interconnect
    with the PSTN. Most calls in a large organization remain within it, cost and security
    benefits accrue immediately by placing a telephone switch inside the organization.
    And with the introduction of digital switching nearly a century later, a new wave
    of feature–functionality became possible. For the first time in history, the enterprise
    telephony capabilities would surpass that offered directly by PSTN carriers. In
    some respects, the latest developments in VoIP are an extension of this pattern.


    > The basic architecture of the PBX over the past 100 years has evolved similarly
    to that of the PSTN and its switches over. If you''re interested in that evolution
    and how it has influenced today''s PBX designs, you may want to read Chapter 3
    before reading this chapter. Otherwise, consider this chapter to be a discussion
    of PBX architecture during the past decade and the interaction between the digital
    PBX and its VoIP equivalents.


    From a security perspective, it''s important to distinguish between several different
    architectures for business and consumer telephony. On the low end, Key Telephone
    Systems (KTS) for up to 50 users provide a basic means of sharing outside lines
    and using dedicated “intercom” to talk between stations, but do not provide actual
    switching services or advanced features (though the latest generation of such
    systems has blurred that distinction). The traditional PBX is likely to have an
    Ethernet interface for administration if it does not support VoIP, and IP-enabled
    (or hybrid) PBX systems can support VoIP interfaces in addition to classic analog
    or digital stations and trunks. IP-PBX systems dispense with most. In addition,
    Centrex, IP Centrex, and Hosted IP-telephony services are carrier-based alternatives
    that provide many of the same switching features as an on-site PBX system but
    place the switching equipment back into the carrier''s infrastructure. Each of
    these alternatives has a different security profile and may interface with VoIP
    solutions at different levels, so let''s review the critical differences between
    them and how they may affect your security strategy.'
