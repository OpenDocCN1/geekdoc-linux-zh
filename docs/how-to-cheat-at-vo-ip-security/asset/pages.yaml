  md: '# Figure 8.12 ESP Header: Transport Mode and Tunnel Mode


    ![](img/c45efece24bfbfca8be768fba195d8a4_229_0.png)


    In transport mode, ESP encrypts the entire packet. This means that the original
    IP datagram, including the original IP and protocol header, is encrypted. In this
    mode, when IP traffic moves between gateways, the outer, unencrypted IP header
    contains the IP addresses of the penultimate source and destination gateways,
    and the inner, encrypted IP header contains the IP source and destination addresses
    of the true endpoints. Even though ESP encrypts most of the IP datagram in either
    transport or tunnel mode, ESP is relatively compatible with NAT, since ESP does
    not incorporate the IP source or destination addresses in its keyed integrity
    check. Still, ESP has a dependency on TCP and UDP checksum integrity through inclusion
    of the pseudo-header in the calculation. As a result, when checksums are recalculated,
    they will be invalidated by passage through a NAT device (in some cases where
    UDP checksum is set to zero).


    NAT traversal uses ESP checksums used to verify packet integrity, as was showed
    earlier, NAT modifies those headers. If NAT updates the header checksum, ESP authentication
    will fail. If NAT does not update the checksum, TCP verification will fail. One
    way around this, if the transport endpoint is under your control, is to turn off
    checksum verification, but I''m not aware of anyone who has done this in production
    environments. A second, common means to do this is NAT before IPsec; this can
    be accomplished by locating the NAT device logically before the IPsec device.
    The most common form of NAT traversal relies solely on encapsulating IPsec packets
    in UDP in order to bypass NAT devices. The IPsec packet is encapsulated in a meta-UDP
