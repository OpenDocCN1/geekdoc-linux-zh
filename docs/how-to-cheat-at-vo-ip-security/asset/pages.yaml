- pgno: 46
  md: '# Chapter 2 • The Hardware Infrastructure


    Although considerably stronger than its older brother, WEP:WPA2 is not without
    guilt. WPA2 encrypted traffic is still susceptible to dictionary attacks since
    WPA2 uses a hashing algorithm that can be reproduced. Joshua Wright released a
    tool called coWPAtty, which is a brute-force cracking tool that takes a list of
    dictionary words and cracks them using WPA2 algorithms, one at a time. The encrypted
    value of each word is then compared against the encrypted value of captured traffic,
    and if the password is found, POOF! The packet becomes intelligible.


    But brute-force cracking is not guaranteed to yield results, it leverages a weakness
    found in almost all security mechanisms—the user. If a user chooses a password
    that is not strong enough, or uses semipedictic modifications (the use of 3 instead
    of “e”), the network will fail. It is recommended that users install a pass-phrase
    instead of a traditional password. A pass-phrase longer than eight characters,
    which includes nonalphanumeric characters, is much less likely to be discovered
    by brute-forcing methods. And never, ever, use a dictionary word as a password,
    as will often be discovered within minutes using freely available software from
    the Internet.


    When implementing VoIP, always use WPA2 or an alternative for protecting the VoIP
    stream (i.e., media and signaling encryption or IPSEC tunneling). Given the speed
    with which WEP can be cracked, it is almost pointless to use it if it adds encryption
    latency and creates a false sense of security.


    # Authentication: 802.1x


    802.1x is an authentication (to a lesser extent, authorization) protocol, whereas
    WEP/WPA are encryption protocols. And 802.1x can be used on wired networks as
    well, it is most common today on wireless networks. It acts as an added layer
    of protection for existing wireless security implementations like WEP or WPA2
    by requiring additional authentication to join a network beyond the shared secret
    authenticator with the encryption key.


    802.1x works by forcing users (or devices) to identify themselves before their
    traffic is ever allowed onto the network. This happens through the use of the
    Extensible Authentication Protocol (EAP) framework. EAP orchestrates password
    negotiation and challenge-response tokens, coordinating with the authentication
    server. 802.1x uses the EAP traffic inside of Ethernet, instead of over PPP, much
    keep in mind that there are a lot of different EAP methods available, so when
    you are comparing vendor support 802.1x in infrastructure and VoIP devices you
    need to pay careful attention to the specific methods supported.


    As soon as the connection starts, called an authenticator, detects that the link
    is active, it sends an EAP Request Identity to the requester known as the supplicant.
    The user then responds with an EAP Response Identity packet, which the authenticator
    passes to the authentication server, who grants or denies access (see Figure 2.2).


    Think of the supplicant as the guy trying to get into “Club WLAN” who asks the
    user at the door if he’s on the list. The authenticator then flags the bouncer
    (authentication


