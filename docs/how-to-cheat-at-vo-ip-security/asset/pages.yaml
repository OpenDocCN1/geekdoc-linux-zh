  md: 'Although RTP runs on top of UDP, which doesn''t ensure reliability of data,
    RTP does some reliability in the data sent between user agents. The protocol uses
    the Real-time Control Protocol to monitor the delivery of data sent between participants.
    This allows the user agent receiving the data to detect if there is packet loss,
    and allows it to compensate for any delays that might occur as data is transported
    across the network.


    # NOTE


    RTP was designed by the IETF Audio-Video Transport Working Group, and originally
    was specified as a standard under RFC 1889. Since then, RFC has become obsolete,
    but RTP remains a standard and is defined under RFC 3550. In RFC 2509, Compressed
    Real-time Transport Protocol (CRTP) was specified as a standard, allowing the
    data sent between participants to be compressed, so that the size was smaller
    and data could be transferred quicker. However, since CRTP doesn''t function well
    in situations without reliable, fast connections, RTP is still commonly used for
    communications like VoIP applications.


    # Media Gateway Control Protocol


    The Media Gateway Control Protocol (MGCP) is used to control gateways that provide
    access to the Public Switched Telephone Network (PSTN), and vice versa. In doing
    so, this protocol provides a method for communication on a network to go out onto
    a normal telephone system, and for communications from the PSTN to reach computers
    and other devices on IP networks. A media gateway is used to convert the data
    into a format that''s used on PSTN to one that''s IP networks use packets to transport
    data; MGCP is used to set up, manage, and tear down the calls between these endpoints.


    # NOTE


    MGCP was defined in RFC 2705 as an Internet standard by the IETF. However, the
    Media Gateway Control Protocol is also known as H.248 and Megaco. The IETF defined
    Megaco as a standard in RFC 3015, and the Telecommunication Standardization Sector
    of the International Telecommunications Union endorsed the standard as Recommendation
    H.248.


    ![](img/c45efece24bfbfca8be768fba195d8a4_107_0.png)'
