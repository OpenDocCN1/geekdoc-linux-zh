  md: '# LEAP


    LEAP (Lightweight Cisco Aironet Extensible Authentication Protocol) is an EAP
    authentication type used primarily in Cisco Aironet WLANs. LEAP supports strong
    mutual authentication, based upon a modified MS-CHAPv2 challenge/response, between
    the client and a RADIUS server using a login password as the shared secret. LEAP
    provides dynamic per-user, per-session WEP encryption keys. LEAP has been superseded
    by EAP-FAST due to the public availability of hash cracking tools such as ASAP.
    There is some disagreement regarding the value of complex password enforcement
    when using LEAP. When in doubt, use the longest, most complicated passwords that
    your username will agree to.


    # EAP-MD-5


    EAP-MD-5 (Extensible Authentication Protocol-Message Digest) is an EAP authentication
    type that provides base-level EAP support. EAP-MD5-Tunnled is an EAP protocol
    designed for use as an inner authentication protocol within a tunneling protocol
    such as EAP-TTLS or EAP-PEAP. This has additional security features, but has not
    been widely deployed.


