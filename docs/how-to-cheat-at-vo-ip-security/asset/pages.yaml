    # Protocols Used with SIP


    Although SIP is a protocol in itself, it still needs to work with different protocols
    at different stages of communication to pass data between servers, devices, and
    participants. Without the use of these protocols, communication and the transport
    of certain types of media would either be impossible or insecure. In the sections
    that follow, we will discuss a number of the common protocols that are used with
    SIP, and the functions they provide during a session.


    # UDP


    The User Data Protocol (UDP) is part of the TCP/IP suite of protocols, and is
    used to transport units of data called datagrams over an IP network. It is similar
    to the Transmission Control Protocol (TCP), except that it doesn''t divide messages
    into packets and reassembles them at the end. The datagrams don''t support sequencing
    of the packets as the data arrives at the endpoint, it is up to the application
    to ensure that the data has arrived in the right order and has arrived completely.
    This may sound less beneficial than TCP for transporting data, but it makes UDP
    faster because there is less processing of data. It is used when messages with
    small amounts of data, or with data that will be unaffected overall by a few units
    of missing data.


    Although an application may have features that ensure datagram have gone missing
    or out of order, many simply accept the potential of data loss, duplication, or
    errors. In these cases, it is more important that the data is passed quickly from
    one endpoint to another. If reliability were a major issue, then the use of TCP
    as a transport protocol would be a better choice over hindering the application
    with features that check for the reliability of the data it receives.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Notes from the Underground...


    # UDP Denial-of-Service (DoS) attacks


    Although denial-of-service (DoS) attacks are less common using UDP, data sent
    over this protocol can be used to bog down or shut down a system that victim to
    it. Because UDP is a connectionless protocol, it doesn''t need to have a connection
    with another system before it transfers data. In a UDP Flood Attack, the attacker
    will send UDP packets to random ports on another system. When the remote host
    receives the UDP packets, it will do the following:


    +   1. Determine which application is listening on the port.

    2. Find that no application is waiting on that port.

    3. Reply to the sender of the data (which may be a forged source address) with
    an ICMP packet of DESTINATION UNREACHABLE.


    Although this may be a minor issue if the remote host sends only a few of ICMP
    packets, it will cause major problems if enough UDP packets are sent to the host''s
    ports. A large number of UDP packets sent to the victim will cause the remote
    host to repeat these steps over and over. The victim''s resources are monopolized
    by receiving data that isn''t used by any application on the system, and ICMP
    packets are sent out to relay this to the attacker. Other clients will find the
    remote host unreachable, eventually the system could go down if enough UDP packets
    are sent.


    To reduce the chances of falling victim to this type of attack, a number of measures
    can be taken. Proxy servers and firewalls can be implemented on a network to prevent
    UDP from being used maliciously and filter unwanted traffic. For example, if an
    attack appeared to come from one source previously, you could set up a rule on
    the firewall that blocks UDP traffic from that IP address. In addition to this,
    charge and echo services, as well as other unused UDP services, could be disabled
    or filtered. Once these measures are taken, however, you should determine which
    applications on your network are using UDP, and monitor for signs of a UDP Flood
    Attack or other signs of misuse.


    # Transport Layer Security


    Transport Layer Security (TLS) is a protocol that can be used with other protocols
    like UDP to provide security between applications communicating over an IP network.
    TLS uses encryption to ensure privacy, so that other parties cannot eavesdrop
    or tamper with the messages. Using TLS, a secure connection is established by
    authenticating the client'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Architectures • Chapter 3 99


    and server, or User Agent Client and User Agent Server, and encrypting the connection
    between them.


    Transport Layer Security is a successor to Secure Socket Layer (SSL), which was
    developed by Netscape. Even though it is based on SSL 3.0, TLS is a standard that
    has been defined in RFC 2246, and is designed to be its replacement. In this standard,
    TLS is designed as a multiprotocol protocol that consists of:


    +   - TLS Handshake Protocol

    - TLS Record Protocol


    The TLS Handshake Protocol is used to authenticate the participants of the communication
    and negotiate an encryption algorithm. This allows the client and server to agree
    upon an encryption method and prove who they are using cryptographic keys before
    any data is sent between them. Once this has been done successfully, a secure
    channel is established between them.


    After the TLS Handshake Protocol is used, the TLS Record Protocol ensures that
    the data exchanged between the parties isn''t altered en route. This protocol
    can be used with without encryption, but TLS Record Protocol provides enhanced
    security using encryption methods like the Data Encryption Standard (DES). In
    doing so, it provides the security of ensuring data is modified, and others cannot
    access the data while in transit.


    ![](img/c45efece24bfbfca8be768fba195d8a4_105_0.png)


    The Transport Layer Security Protocol is not a requirement for using SIP, and
    if you''re using VoIP or other communication software to trade recipes or talk
    about movies with a friend, then using encryption might be overkill. However,
    in the case of companies that use VoIP for business calls or to exchange information
    that requires privacy, then using TLS is a viable solution for ensuring that information
    and data exchanged over the Internet are secure.


    # Other Protocols Used by SIP


    As mentioned, SIP does not provide the functionality required for sending single-media
    or multimedia across a network, or many of the services that are found in communications
    programs. Instead, it is a component that works with other protocols to transport
    data, control streaming media, and access various services like caller-ID or connecting
    to the Public Switched Telephone Network (PSTN). These protocols include:


    +   - Session Description Protocol, which sends information to effectively transmit
    data


