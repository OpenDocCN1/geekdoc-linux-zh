  md: 'Regulatory Compliance • Appendix C 359


    # HIPAA Compliance and Enforcement


    The Department of Health and Human Services (HHS) delegated compliance and enforcement
    along with the HIPAA Privacy Rule to the Office for Civil Rights (OCR) for allowing
    exceptions where state laws may conflict with HIPAA .The Centers for Medicare
    and Medicaid services (CMS) received delegated responsibility from HHS for enforcing
    the security rule, transactions, and code set standards (and identifiers when
    those are published).Through its Office of HIPAA Standards (OHS), CMS will enforce
    these rules and continue to ensure the insurance portability requirements under
    Title I of HIPAA.


    # No Certification


    No official certification process exists for covered entities under HIPAA, although
    HHS did authority to perform compliance reviews as part of the Act. Products are
    not certified as part of HIPAA (although it''s uncommon to see them promoted as
    if they were). Regardless, documentation as specified in the Security Rule and
    Privacy Rule must exist and might be reviewed by a business partner, for example,
    as part of a due-dilig process. Other than that, the only time you would have
    to produce it is if you are investigated by HHS or OCR in response to a complaint
    or as part of a compliance review.


    # Enforcement Process and Penalties


    In general, OCR acts on Privacy violations in response to complaints that are
    registered with it. OCR requires written notice but does accept e-mail at OCRComplaint@hhs.gov
    (see “How to File a Health Information Privacy Complaint” at www.hhs.gov/ocr/privacyhowto.html
    for more details). CMS has stated that the enforcement process for protection
    of HIPAA will be primarily compliance-driven, although their primary strategy
    is to encourage “voluntary compliance through technical assistance.” Penalties
    would be imposed as a last resort. When a complaint is received (typically through
    their Web site at www.cms.hhs.gov/Enforcement or via mail), CMS first allows the
    provider the opportunity to demonstrate compliance (or submit a plan for correction).
    Only if the provider fails to respond would penalties be considered.


    The Administrative Simplification Compliance Act (ASCA) permits the Secretary
    of HHS to ensure noncompliant covered entities within the Medicare program. In
    addition, the original HIPAA legislation permits civil monetary penalties of not
    more than $100 for each violation, with a cap of $25,000 per calendar year. In
    addition, criminal penalties can be imposed for certain wrongful disclosures up
    to a $250,000 fine and 10 years imprisonment for willful conduct.


