  md: '# 386 Appendix C - Regulatory Compliance


    via the Integrated Services Digital Network (ISDN) and public digital mobile networks.


    +   2. Articles 8 (www.bild.net/datapreEU1.htm#HD_NM_8), 9

    (www.bild.net/datapreEU1.htm#HD_NM_9) and 10

    (www.bild.net/datapreEU1.htm#HD_NM_10) shall apply to subscriber lines connected
    to digital exchanges and, when technically possible and if it does not require
    a disproportionate economic effort, to subscriber lines connected to analogue
    exchanges.


    +   3. Cases where it would be technically impossible or require a disproportionate
    investment to fulfill the requirements of Articles 8

    (www.bild.net/datapreEU1.htm#HD_NM_8), 9

    (www.bild.net/datapreEU1.htm#HD_NM_9) and 10

    (www.bild.net/datapreEU1.htm#HD_NM_10) shall be notified to the Commission by
    the Member States.


    # Article 4 - Security


    +   1. The provider of a publicly available telecommunications service must take
    appropriate technical and organizational measures to safeguard security of its
    services, if necessary in conjunction with the provider of the public telecommunications
    network to respect network security. Having regard to the state of the art and
    the cost of their implementation, these measures shall ensure a level of security
    appropriate to the risk presented.


    +   2. In case of a particular risk of a breach of the security of the network,
    the provider of a publicly available telecommunications service must inform the
    subscribers concerning such risk and any possible remedies, including the costs
    involved.


    # Article 5 - Confidentiality of the communications


    Member States shall ensure via national regulations the confidentiality of communications
    by means of public telecommunications network and publicly available telecommunications
    services. In particular, they shall prohibit listening, tapping, storage or other
    kinds of interception or surveillance of communications, by others than users,
    without the consent of the users concerned, except when legally authorized.'
