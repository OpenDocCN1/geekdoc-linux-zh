- pgno: 377
  md: '# 374 Appendix C · Regulatory Compliance


    The Commission found that these services can essentially replace conventional
    telecommunications services currently subject to wiretap switched voice service
    and dial-up Internet access. As replacements, the new services are covered by
    the Communications Assistance for Law Enforcement Act, or CALEA, which requires
    the Commission to preserve the ability of law enforcement agencies to conduct
    court-ordered wiret in the face of technological change.


    The Order is limited to facilities-based broadband internet service providers
    and VoIP providers that offer permitting users to receive calls, and place calls
    to, the public switched telephone network. Work. VoIP providers are called interconnected
    VoIP providers.


    The Commission found that the definition of “telecommunications carrier” in CALEA
    is broader than the definition of that term in the Communications Act and can
    encompass providers of services that are not classified as telecommunications
    services under the Communications Act. CALEA contains a provision that authorizes
    the Commission to deem an entity a telecommunications carrier if the Commission
    “finds that service is a replacement for a substantial portion of the local telephone
    exchange.”


    Because broadband Internet and interconnected VoIP providers need a reasonable
    amount of time to come into compliance with all relevant CALEA requirements, the
    Commission established a deadline of 18 months from the effective date of this
    Order, by which time newly entities and providers of newly covered services must
    be in compliance. The Commission also adopted a Further Notice of Proposed Rulemaking
    that will seek more information about whether certain classes or categories of
    facilities-based broadband internet access providers – notably small and rural
    providers and providers of broadband networks for educational and research institutions
    – should be exempt from CALEA.


    The Commission’s action is the first step to apply CALEA obligations to new technologies
    and services that are increasingly used as a substitute for conventional services.
    The Order strikes an appropriate balance between fostering competitive broadband
    and advanced services deployment and technological innovation on one hand, and
    meeting the needs of the law enforcement community on the other.


    The potential impact of this ruling is huge and will reverberate within the VoIP
    and broadband communities over the next few years. What is perhaps most surprising
    is the'
