  md: '# Chapter 2 • The Hardware Infrastructure


    gateway will have this ATA, or Analog Telephone Adaptor. At a minimum VoIP media
    gateway will have both phone interface (analog or digital) and an Ethernet interface.
    For an ATA, a regular analog phone is connected to the adapter, which then translates
    the signal to digital and passes it back over the Ethernet. Of course, media gateways
    can get more complex than this. PBX vendors have split the line-cabinet portion
    of the product and recast it as a media gateway, with the gateway under the control
    of a media server. IP routing connects added analog and digital voice/video interfaces
    to routers and recast them as media gateways. And in many respects these products
    do overlapping functionality even they may not be equivalent.


    # Firewalls and Application-Layer Gateways


    Within a firewall, special code for handling protocols (like ftp, which uses separate
    control and data paths like VoIP) provides the logic required for the IP address
    filtering and translation that must take place for the protocol to pass safely
    through the firewall. One name for this is the Application Layer Gateway (ALG).
    Each protocol that passes embedded addresses or operates with separate data (or
    media) and control streams will require ALG to pass through a deep-packet-inspection
    and filtering device. Due to the constantly changing nature of VoIP protocols,
    ALGs provided by firewall vendors are constantly playing a game of catch-up. Tests
    of real-time performance under load for ALG may reveal QoS standards cannot be
    met with a given ALG solution. This can cause VoIP systems to fail under load
    across the perimeter and have forced consideration of VoIP application proxies
    as an alternative.


    # Application Proxies


    A Proxy server acts as a translator for transactions or calls of different types.
    If Johnny''s phone speaks IAX and Jen''s phone speaks SIP, the proxy between them
    translates the message. Even if both sides speak the same protocol, be it HTTP
    or SIP; there are security security or NAT or other boundaries that call for either
    a proxy or packet manipulation in an Application Layer Gateway (ALG) within a
    firewall. The benefit of an application proxy is that it can be designed specifically
    for a protocol (or even a manufacturer''s implementation of it). In addition to
    allowing boundary traversal, a proxy can also be used as a means of access control,
    ensuring that a user has the rights to call before allowing it to proceed. And
    the best proxies can even guard against malformed packets and certain types of
    DoS attacks. Depending on the complexity of your call requirements, a proxy may
    be integrated into a PBX or Media Server, or it may be an entirely different piece
    of hardware.


