- pgno: 98
  md: '# Chapter 3 • Architectures


    The IP address of the user agent being contacted. This is different from a Proxy
    server, which forwards the request on your behalf, as the Redirect server essentially
    tells you to contact themselves.


    The Redirect server also has the ability to “fork” a call, by splitting the call
    to several locations. If a call was made to a particular user, it could be split
    to a number of different locations, so that it rang all of them at the same time.
    The first of these locations to answer the call would receive it, and the other
    locations would stop ringing.


    > NOTE

    RFC 3261 defines the different types of SIP servers as logical devices, meaning
    that they can be implemented as separate servers or as part of a single application
    that resides on a single physical server. In other words, a single physical server
    may act in all or one of these roles.

    In addition to this, the SIP servers can interact with other servers and applications
    on your network to provide additional services, such as authentication or billing.
    The SIP servers could access Lightweight Directory Access Protocol (LDAP) servers,
    database applications, or other applications to access back-end services.


    # Stateful versus Stateless


    The servers used by SIP can run in one of two modes: stateful or stateless. When
    a server runs in stateful mode, it will keep track of all requests and responses
    it sends and receives. A server that operates in a stateless mode wont remember
    this information, but will instead forget about what it does once it has processed
    a request. A server running in stateful mode generally is found in a domain where
    the user agent resides, whereas stateless servers are often found as part of the
    backbone, receiving so many requests that it would be difficult to keep track
    of them.


    # Location Service


    The location service is used to keep a database of those who have registered through
    a SIP server, and where they are located. When a user agent registers with a Registrar
    server, a REGISTER request is made (which we will discuss in the later section).
    If the Registrar accepts the request, it will obtain the SIP-address and IP address
    of the user agent, and add it to the location service for its domain. This database
    provides an up-to-date catalog of everyone who is online, and where they are located,
    which Redirect servers and Proxy servers can use to acquire information about
    user agents. This allows the servers to connect user agents together or forward
    requests to the proper location.


