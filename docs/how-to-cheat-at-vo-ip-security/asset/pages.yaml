- pgno: 147
  md: '# Introduction


    Converging voice and data on the same wire, regardless of the protocols used,
    upsent the ante for network security engineers and managers. One consequence of
    this convergence is that in the event of a major network attack, the organization’s
    entire telecommunications infrastructure can be at risk. Securing the VoIP infrastructure
    requires planning, analysis, and detailed knowledge about the specifics of the
    implementation you choose to use.


    Table 5.1 describes the general levels that can be attacked in a VoIP infrastructure.


    # Table 5.1 VoIP Vulnerabilities


    | Vulnerability | Description |

    |---|---|

    | IP infrastructure | Vulnerabilities on related non-VoIP systems can lead to
    compromise VoIP infrastructure. |

    | Underlying operating system | VoIP devices inherit the same vulnerabilities
    as the operating system or firmware they run on. Operating systems are Windows
    and Linux. |

    | Configuration | In their default configuration most VoIP devices ship with a
    forfeit of open services. The default services running on the open ports may be
    vulnerable to DoS attacks, buffer overflows, or authentication bypass. |

    | Application level | Immature technologies can be adapted to disrupt or manipulate
    service. Legacy applications (DNS, for example) have known problems. |


    # Denial-of-Service or VoIP Service Disruption


    Denial-of-service (DoS) attacks can affect any IP-based network service. The impact
    of a DoS attack can range from mild service degradation to complete loss of service.
    There are several classes of DoS attacks. One type of attack in which packets
    can simply be flooded into or at the target network from multiple external sources
    is called a distributed denial-of-service (DDoS) attack (see Figures 5.1 and 5.2).


    In this figure, traffic flows normally between internal and external hosts and
    servers. In Figure 5.2, a network of computers (e.g., a botnet) directs IP traffic
    at the interface of the firewall.'
  merge: -1
  img_proc: true
