    # PSTN Protocol Security


    If you thought that PSTN protocols are more secure than the IP protocols riding
    on PSTN access circuits, then prepare to be shocked. In some respects, one of
    the greatest threats to the Internet is the PSTN itself.


    # SS7 and Other ITU-T Signaling Security


    Despite the fact that ITU-T signaling protocols prior to SS7 are notoriously insecure
    (see the sidebar on Blueboxing and the Phone Phreaking community earlier in the
    chapter), they continue to be deployed around the world with old switching equipment
    that is vulnerable to toll fraud, eavesdropping, and other risks. If VoIP system
    will be interfacing with such equipment, take countermeasures to reduce potential
    exposure and liability, set alarms, and review logs.


    It is not to say that SS7 is particularly secure, but it is much harder for a
    subscriber to inject signaling into an SS7 network. That being said, the primary
    threat for SS7 networks are the peering arrangements (particularly among CLEC
    partners) for injection of false/or fraudulent signaling and other messaging information.
