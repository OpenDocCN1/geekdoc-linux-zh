  md: '# Chapter 2 • The Hardware Infrastructure


    DC-powered devices with a converter installed. This converter, called a picker
    or a tap, diverts the extra voltage from POE is the CAT5 cable and redirects it
    to a regular power jack.


    The major advantage of POE is that it allows greater flexibility in installing
    network equipment. Access points can be set up in remote locations that normally
    would be limited by its proximity to a power outlet. It is often easier to route
    cat5 cables outdoors (on an antenna or in a tree, for instance) when only network
    cable is required. POE is also very popular with supplementary low-power devices,
    such as IP telephones and webcams, computers!


    POE is regulated by the IEEE 802.3af standard. This standard dictates the device
    must provide 48 volts of direct current, split over two pairs of a four-pair cable.
    The maximum current is limited to 350 mA and a maximum load of 16.8 watts. Several
    vendors have proprietary (prestandard) implementations of POE, however in most
    cases newer equipment from these vendors are compliant with the IEEE standard
    (although at least one of these vendors advertises an ability for the client to
    request a lower or higher amount of current through a proprietary process of negotiation
    and beyond specifications within the standard).


    To properly address VoIP availability concerns concerning POE, be sure that the
    power injector, network equipment, and voice servers (gateways) can operate on
    battery power for a sufficient length of time, and consider use of a generator
    when appropriate.


    POE in action is pretty simple. The power source checks to see if the device on
    the other end of the wire is capable of receiving POE. If it is, the source then
    checks to see which pairs of wires the device will accept power. If the device
    is capable, it will operate in one of two modes, A or B. In mode A, power is sent
    one over pins 1 and 2, and received over pins 3 and 6. In mode B, power is sent
    over pins 4 and 5 and is received over pins 7 and 8. Although only one mode will
    be used at a time, a device must be able to use both A or B to be IEEE 802.3af
    compliant.


    # UPS


    No availability strategy can be considered without appropriate use of Uninterruptible
