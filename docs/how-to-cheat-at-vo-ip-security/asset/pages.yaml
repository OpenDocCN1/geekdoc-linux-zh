    service, at least one IMPU has to be registered in HSS in advance and the corresponding
    IMPI has to be authenticated. When a UE wants to be registered, it sends a SIP
    REGISTER message to the SIP registrar (in this case the corresponding S-CSCF).


    # Figure B.2 Authentication Message Flow in IMS


    ![](img/c45efece24bfbfca8be768fba195d8a4_330_0.png)


    The SIP REGISTER is passed to I-CSCF and to the corresponding S-CSCF that refers
    to HSS, and retrieves all the authentication information of the user from CSC
    with the CSC-Pull method. S-CSCF uses an Authentication Vector (AV) to conduct
