  md: '# Appendix A • Validate Existing Security Infrastructure


    ability to perform routine functions. This means that anything required should
    be disabled. Turn off all unnecessary services. Disable features that are not
    in use. Remove unnecessary applications. This maxim is particularly important
    when applied to critical infrastructure including servers, routers, firewalls,
    and on. Adhering to this principle will reduce the number of potential attack
    vectors on these systems.


    The potential for attack on the PBX system is real, and failure to secure a PBX
    and voice mail system can expose an organization to toll fraud, theft of proprietary
    information, loss of revenue, and loss of reputation. Hardening the PBX system
    components limits unauthorized access and use of system resources. The hardening
    process is OS-specific, but consists of: patching, removal of extraneous services,
    extending logging, removal of unnecessary administrative and user accounts, permission
    tightening, activation of internal security controls, and various other security
    tweaks.


    # Eliminate Unnecessary Services


    Most VoIP server platforms ship today on either the Windows or Linux operating
    systems. Typically, these services are delivered with many unnecessary services
    activated. These extra services are potential security risks. There are a large
    number of online and hard references that explain the details of hardening with
    Windows and Linux operating systems, so in this section we will survey the high
    points.


    On the Linux platform, examine the /etc/inetd.conf file. This file specifies the
    services for which the inetd daemon will. By default, /etc/inetd.conf is configured
    to activate a number of listening daemons. You can see these by typing:


    ```

    grep -v "#" /etc/inetd.conf

    ```


    Determine the services that you require, and comment out the unneeded services
    by placing a "#" sign in front of them. This is important, as several of the services
    run by by can pose security threats, such as popd, ipmd, and rsh.


    Next check your running services by typing:


    ```

    ps aux | wc -l

    ```


    This command will show you the services that are normally started by the .rc scripts.
    These scripts describe the services started by init. These scripts reside in /etc/rc.3
    (or /etc/rc.5 if you automatically boot to a GUI, such as Gnome or KDE). To stop
    a script from starting, replace the uppercase S with a lowercase s. You can easily
    start the script again by replacing the s with an S. Or use chconfig. The numbers
    in the name of startup scripts determine the sequence of initialization. This
    may vary depending upon the version and Linux distribution that you are used.
    Scripts with an uppercase K instead of an uppercase S are used to kill services
    that are already running.


    ![](img/c45efece24bfbfca8be768fba195d8a4_305_0.png)'
  merge: -1
  img_proc: true
