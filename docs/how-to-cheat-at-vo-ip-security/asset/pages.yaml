- pgno: 185
  md: '# Basic Certificate Fields


    Basic certificate fields for X.509 version 3 are shown in Table 6.5. The TBS certificate
    field contains the names of the subject and issuer, a public key associated with
    the subject, a validity period, and other associated information. It usually includes
    extensions that hold additional optional information. The subject field identifies
    the entity associated with the public key stored in the subject public key field.
    It also distinguishes a certificate is for an end entity, a CA, or a CRL. The
    Subject Public Key Info (SPKI) field is used to carry the public key and to identify
    the algorithm by which the key is used (e.g., RSA, DSA, or Diffie-Hellman).


    The signature algorithm field contains the identifier for the cryptographic algorithm
    used by the CA to sign the certificate.

    The signature value field contains a signature digitally added to the encoded
    TBS certificate. By generating this signature, a CA certifies the validity of
    the information in the TBS certificate. To be a more specific, the CA certifies
    the binding between the public key material and the subject of the certificate.


    # Table 6.5 Basic Certificate Fields for X.509


    | Certificate Fields | Attribute | Type |

    |---|---|---|

    | TBS Certificate | Version | V1, v2, v3 |

    | | Certificate Serial Number | Integer |

    | | Algorithm Id | Algorithm Object Id. |

    | | Issuer | Name |

    | | Validity | Not before time |

    | | Not after time |

    | | Subject | Name |

    | | Subject Public Key Info | Algorithm Id |

    | | Bit string |

    | | Issuer Unique Id | Bit string |

    | | Subject Unique Id | Bit string |

    | | Extensions | |

    | Signature Algorithm | | Algorithm Id |

    | Signature Value | | Bit string |'
