  md: '# S/MIME Messages


    To certify the sender or receiver, X.509 PKIX (RFC 3280) is adopted. S/MIME messages
    are a combination of MIME bodies and Cryptographic Message Syntax (CMS) content
    types.


    # Sender Agent


    Before using a public key to provide security services, the S/MIME agent verifies
    that the public key is valid. Sending agents should include any certificates for
    the user''s public key(s) and associated issuer certificates.This increases the
    likelihood that the intended recipient can establish trust in the originator''s
    public key.


    It should include at least one chain of certificates up to, but not including,
    a CA that it believes the recipient can trust as authoritative.


    # Receiver Agent


    Receiving agents handle an arbitrary number of certificates of arbitrary relationship
    to the message sender and to each other in an arbitrary order. These agents do
    not simply trust any self-signed certificates as valid CAs, but use another mechanism,
    not discussed here, to determine if this is a CA that should be trusted.


    # E-mail Address


    Sending agents force the e-mail address in the From or Sender header in a mail
    message to match an Internet address in the signer''s certificate. Receiving agents
    check to see that the address in the From or Sender header of a mail message matches
    an Internet address, if present, in the signer''s certificate.


    # TLS: Key Exchange and Signaling Packet Security


    TLS is based on SSL protocol version 3. The IETF standardized TLS as RFC 2246
    in January of 1999. SSLv3 is incompatible with TLS by design.TLS is a protocol
    that secures a channel between two machines. It has facilities for protecting
    data in transit and for identifying its peer by checking the peer''s X.509 certificate.


    The secure channel is transparent, meaning that the data passed through the channel
    is unchanged. The data is encrypted between client and server, but the data that
    one writes is exactly what the other end reads. Transparency allows any protocol
    that can run over TCP to run over SSL/TLS with minimal modification, which is
    very convenient. As depicted in Figure 9.1, TLS sits right above the TCP layer
    and below the SIP layer,


