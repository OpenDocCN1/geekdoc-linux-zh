    end-to-end delivery services of real-time audio and video. RTP provides payload
    identification, sequencing, time-stamping, and delivery monitoring. UDP provides
    multiplexing and checksum services. RTP can also be used with other transport
    protocols like TCP, and in conjunction with other signaling protocols like SIP
    or H.248.


    The actual media (e.g., the voice packets) first is encoded using an appropriate
    codec. The encoded audio stream is then passed via RTP, which is used to transfer
    the realtime audio/video streams over the Internet. Real-time transport control
    protocol (RTCP) is a requiredဆောင် of RTP for RTP streams. The primary function
    of RTCP is to provide feedback on the quality of the data distribution. Other
    RTCP functions include carrying a transport-level identifier for an RTP source,
    called a canonical name, which can be used by receivers to synchronize audio and
    video.


    > NOTE

    RTP runs on dynamic, even-numbered, high ports (ports > 1024), whereas RTCP runs
    on the next corresponding odd numbered, high port.


