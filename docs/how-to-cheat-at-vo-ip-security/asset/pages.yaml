- pgno: 227
  md: 'a large protocol suite designed to provide the following security services
    for IP networks: Data Integrity, Authentication, Confidentiality, and Application-transparent
    Security. IPSec secures packets and key transmission. Since we are interested
    in NAT and encryption, we''ll ignore most of the protocol suite including key
    exchange (IKE), and various hash and encryption algorithms, focus instead on the
    protocols that are used to secure packet flows.


    The AH and ESP protocols operate in two modes:Transport Mode can be visualized
    simply as a secure connection between two concurring hosts. In Tunnel Mode—more
    of a "VPN-like" mode—IPSec completely encapsulates the original IP datagram, including
    the original IP header, with a second IP datagram. ESP and AH normally are implemented
    independently, though it''s possible (but uncommon) to use them both together.


    The Authentication Header (AH) and the Encapsulating Security Payload (ESP) are
    the two main network protocols used by IPSec.The AH provide data origin authentication,
    message integrity, and protection against replay attacks, but has no provision
    for privacy—data is not encrypted.The key to the AH authentication process is
    the inclusion in the AH header of an Integrity Check Value (ICV)—a hash based
    upon a secret key that is calculated over a subset of the original IP header fields,
    including the source and destination IP addresses. AH guarantees (if implemented
    correctly) that the data received is identical to the data sent, and asserts the
    identity of the true sender. AH provides authentication for as much of the IP
    header as possible, as well as upper layer protocol data. However, some IP header
    fields (SIP, DIP, TTL, CHKSUM, and optionally, TOS, FLAGS, and OPTIONS) change
    in transit. The values of such fields are not protected by AH. In transport mode,
    AH is inserted after the IP header and before the upper protocol (TCP, UDP, ICMP,
    etc.). In tunnel mode, the AH header precedes the encapsulated IP header. Figure
    8.11 shows the AH transport and tunnel modes.


    In Figure 8.11, sections A and B show the location of the AH header in transport
    mode. Sections C and D show the location of the AH header in tunnel mode. The
    data field in all packets is not to scale (indicated by the double slanted lines).
    You can see from this that tunnel mode adds an additional 20 bytes to the length
    of each packet. None of the fields in this figure are encrypted.'
