  md: '# Summary


    DoS attacks, whether they are intentional or unintended, are the most difficult
    VoIP-related threat to defend against. The packet switching nature of networks
    allows multiple connections to share the same transport medium. Therefore, unlike
    telephones in circuit-switched networks, an IP endpoint can receive and potentially
    participate in multiple calls at once. On VoIP networks, resources such as bandwidth
    might be allocated efficiently and fairly to accommodate the maximum number of
    callers. This property can be violated by attackers who aggressively and abusively
    obtain an unnecessarily large amount of resources. Alternatively, the attacker
    simply flood the network with large number of packets so that resources are unavailable
    to all callers.


    In addition, viruses and worms cause DoS conditions due to the network traffic
    generated by these agents as they replicate and suck other hosts to infect. These
    agents are proven to wreak havoc on relatively well-secured networks. VoIP networks,
    by their nature, are exquisitely sensitive to these types of attacks. Remedies
    for DoS include logical network partitioning at layers 2 and 3, stateful firewalls
    with inspection capabilities, policy enforcement to limit flooded packets, and
    out-of-band management. Out-of-band management is required so that in the event
    of a DoS event, system administrators are still able to monitor the network and
    respond to additional events.


    Theft of services and information is also problematic on VoIP networks. These
    threats are almost always due to attack. Many of these can be thwarted by implementing
    additional security controls at layer 2.This includes layer 2 security features
    such as DHCP Snooping, Dynamic ARP Inspection, IP Source Guard, Port Security,
    and VLAN ACLs. The fundamental base for this class of attacks is the identity
    of one or more of the devices that participate is legitimate.


    Endpoints must be authenticated, and end users must be validated to ensure legitimacy.
    Hijacking and call interception revolves around the concept of fooling and manipulating
    weak or nonexistent authentication. We are familiar with different forms of authentication,
    from the password used to log in your computer to the key that unlocks the door.
    The conceptual framework for authentication is made up of three factors:“something
    you have" (a key or token), "something you know" (a password or secret handshake),
    or "something you are" (fingerprint or iris pattern). Authentication mechanisms
    validate users by one or a combination of these. Any type of unauthorized access,
    particularly key infrastructure components such as the IP PBX or DNS server, for
    example, can result in disagreeable consequences for both users and administrators.


    VoIP relies on a number of auxiliary services as part of the configuration process,
    as a means to locate users, manage servers and phones, and to ensure favorable
    transport, among others. DNS, DHCP, HTTP, HTTPS, SNMP, SSH, RSVP, and TFTP services
    have all been to the subject of successful exploitation by attackers. Potential
