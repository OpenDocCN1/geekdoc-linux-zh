    are parsed, who is responsible for parsing, and what type of log entries result
    in actionable alerts.


    In a VoIP environment, IP phones generate syslog messages and servers almost always.
    These messages should be sent to a centralized server where they are automatically
    parsed, and reports are generated at least on a daily basis. These logs are valuable
    and often ignored source of intrusion detection events and performance messages.
    For example, syslog can be configured to report failed login attempts, sudo (a
    command that changes a restricted user''s permissions to system level or root
    privilege) attempts, or any action that interacts with the PAM subsystem (Pluggable
