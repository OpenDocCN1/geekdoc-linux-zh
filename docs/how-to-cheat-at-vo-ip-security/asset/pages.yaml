  md: '# Chapter 11 • Skype Firewall and Network Setup


    +   1. The host initiates a request for the remote destination address and port.

    2. Since the address is remote, the router handles the request.

    3. The NAT router adds the entry for the internal host IP address and port to
    the translation table.

    4. The NAT router assigns a new port on the external interface IP address for
    the internal client and adds it to the translation table.

    5. The NAT router then initiates a connection to the remote host on the external
    network, through the firewall, substituting a new source port and IP address in
    the IP packet header.

    6. The remote host responds to the request to the external address and port.

    7. The firewall checks the IP address and port with the list of firewall rules.
    If the IP address the port is blocked, the test is checked. For Skype, this would
    be a UDP port, or if UDP is blocked,TCP port 443 or TCP port 80.

    8. The router uses the translation table to translate the response from the remote
    host from the external address and port to the original internal address and port
    of the host that initiated the request.


    # Home Users


    We strongly recommend that home users obtain a basic peer-to-peer-friendly, broadband
    router with firewall capabilities. In addition to a hardware-based router/firewall,
    you should always use a software-based firewall on each client machine. Windows
    XP has built-in firewall software that is enabled by default after you install
    Service Pack 2. Other options for software-based firewalls include products by
    McAfee, Symantec, and Zone Alarm. Skype should work right out of the gate on most
    home networks without requiring any further configuration. For home users, no
    modification is needed.


    Later in this chapter, we discuss how to improve the quality of the communication,
    which could require more configuration settings on your firewall.


    # Small to Medium-Sized Businesses


    Small to medium-sized businesses must use discretion to determine whether to use
    a simple implementation, as discussed for home users, or to provide a more robust
    firewall solution, such as the Symantec Firewall/VPN Appliance, Cisco Pix, or
    other SOHO solution. Regardless, we suggest that small and medium-sized businesses
    use software-based firewalls on each network client to provide an additional layer
    of security.


