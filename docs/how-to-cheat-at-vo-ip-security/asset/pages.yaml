- pgno: 259
  md: '# Article 4 Permission to Utilize


    4.1 Permission to utilize Your computer. In order to receive the benefits provided
    by the Skype Software, You hereby grant permission for the Skype Software to utilize
    the processor and bandwidth of your computer for the limited purpose of facilitating
    the communication between Skype users.


    4.2 Protection of Your computer (resources). You understand that the Skype Software
    will use its commercially reasonable efforts to protect the privacy and integrity
    of your computer resources and your communication, however, You acknowledge and
    agree that Skype cannot give any warranties in this respect.


    © Copyright Skype ELUA August 2005


    Please pay attention to these two sections of the EULA. The first, Section 4.1
    of the EULA, says that to use Skype, you give right to use your computer, processor,
    and bandwidth to help facilitate communication between Skype users. In other words,
    you give approval to be one of those supernodes that we discussed earlier in this
    chapter. Your computer can be a supernode only if you are an open client on the
    Internet and do not have NAT protection.


    The next section is also very important to administrators or anyone else with
    an interest in security. Section 4.2 of the EULA basically says that Skype will
    use reasonable efforts to protect your privacy and the integrity of your computer.This
    might be acceptable to the average home user, but most chief technology officers
    (CTOs) or other company managers will not be very happy to use an application
    like Skype sitting on their networks with this type of license in play.


    Several key properties are important to any discussion of security with respect
    to Skype. These properties are:


    +   - **Privacy** How secure is your conversation using Skype?

    - **Authenticity** Are you reaching the person you think is at the other end?

    - **Availability** Are Skype users always available when they are listed?

    - **Survivability** If the Skype network takes a hit, can Skype keep working.

    - **Resilience** Can the Skype user reconnect quickly when there is an outage?

    - **Conversation integrity** Does Skype lose bits of the conversation?

    - **System integrity** Does Skype work well with other applications?


    ![](img/c45efece24bfbfca8be768fba195d8a4_259_0.png)'
