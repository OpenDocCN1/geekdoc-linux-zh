  md: '# Active Security Monitoring • Chapter 7 203


    As an indication of the maturity of this field, SiVoUS (w.vopscurity.org) has
    been released. SiVoUS is the first publicly available vulnerability scanner for
    VoIP networks that use the SIP protocol.


    # Vulnerability Assessment


    Vulnerability assessment, one of the most important phases of penetration testing,
    occurs when your team maps the profile of the environment to publicly known or,
    in some cases, unknown vulnerabilities. Tools such as Nessus, Retina, and ISS
    Internet Scanner are all good choices at this stage. An excellent listing of the
    top 75 security tools can be found at www.inssecure.org/tools.html.


    When you are testing VoIP networks, it is not necessary to test every IP phone.
    Because of the offsets, sheer number of IP phones, vulnerability testing has the
    potential to generate enough network traffic that quality is negatively affected.
    Testing one particular IP phone per vendor is often adequate since configurations
    should be functionally identical.


    In most VoIP environments, it is possible to identify IP phones by their SNMP
    signature. Calling the IP phone directly—thus, bypassing any gateways or gatekeepers—can
    come-times yielding interesting information.


    # Exploitation


    The exploitation phase begins once the target system’s vulnerabilities are mapped.
    The testers attempt to gain privileged access to a target system by exploiting
    the identified vulnerabilities. This may take the form of running an exploit tool
    such as scalp.c or ii5hack.c, or launching a password guessing attack using THC-Hydra,
    a network authentication cracker. (An excellent resource of known/default accounts
    and associated passwords is located at w.phenoit.com/dpl/dpl.html).


    # Reporting


    Throughout the testing, the team should maintain a detailed journal of activities
    to account for effects and results of the testing procedures. This record will
    serve to distinguish the team’s activities from any other anomalies that occur
    during the course of the penetration test. Some techniques for capturing these
    data include the use of echo and logging. When appropriate, the use of screen
    captures can be an option.


    +   - Detailed results of the testing performed


    +   - What the results indicate


    +   - Recommendations on types of corrective actions


