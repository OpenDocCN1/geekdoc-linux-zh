    # SRTP: Voice/Video Packet Security


    SRTP, specified in RFC 3711, describes how to protect telephony media for encryption
    of the RTP packet payload, for authentication of the entire RTP packet, and for
    packet replay protection:


    +   1. Confidentiality of RTP packets protects packet payloads from being read
    by entities without the secret encryption key.

    2. Message authentication of RTP packets protects the integrity of a packet against
    forgery, alteration, or replacement.

    3. Replay protection ensures the session address (IP address, User Datagram Protocol
    [UDP] port, and Synchronization Source RC [SRC]) do not experience a DoS attack.


    The protocol is located between the RTP application and RTP transport layers,
    sitting like a "hump in a stack." It secures the confidentiality of RTP payloads
    and the integrity of all RTP packets by adopting the AES as a symmetric cryptographic
    key.The payloads from the RTP application are encrypted and encapsulated into
    an SRTP packet.


    The most sensitive issue in using SRTP is how the secret is shared between two
    nodes communicating in secret. The keys for these services are associated with
    the stream triple <IP address, UDP port, SSRC> and are called SRTP cryptographic
    context.


