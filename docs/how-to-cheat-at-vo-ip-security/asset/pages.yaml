- pgno: 221
  md: 'The Internet Assigned Numbers Authority (IANA) reserved three blocks of the
    IP address space for private internets:


    +   - 10.0.0.0–10.255.255.255 (10/8 prefix)

    - 172.16.0.0–172.31.255.255 (172.16/12 prefix)

    - 192.168.0.0–192.168.255.255 (192.168/16 prefix)


    NAT commonly is used to enable multiple hosts on private networks to access the
    Internet using a single public (routable) IP address. Note that although NAT commonly
    is used to map IP addresses from internal IP space to the public IP space, NAT
    can be used to map between any two IP domains. Additionally, NAT provides a security
    function by securing (hiding) private hosts from the publicly routed Internet.
    This short-term kludge has an enormous impact on the day-to-day functioning of
    the Internet, and has relevance to system administrators who are charged with
    securely transporting VoIP packet data across network boundaries.


    # How Does NAT Work?


    To a system in network, a NAT device appears to be the source/destination for
    all traffic originating from the NAT device. Hosts behind a NAT device do not
    have true end-to-end Internet connectivity and cannot directly participate in
    Internet protocols that initiate ofTCP connections from outside the NAT device,
    or protocols that split signing and media into separate channels.


    A NAT device examines and records IP header information from each packet within
    an active IP connection. It uses these data to multiplex or demultiplex traffic
    depending upon the direction of the traffic flows. Multiplexing, in this case,
    means two or more traffic streams are combined into a single outbound channel;
    demultiplexing refers to the process of separating a single inbound traffic stream
    into single traffic streams (see Figure 8.4).


    NAT devices manipulate a subset of the IP header information. To comprehend the
    sometimes complex interaction of NAT, encryption, and VoIP protocols, you will
    have to understand the IP header fields and how they are altered during the NAT
    and encryption processes. It is not necessary for you to understand these concepts
    if you are concerned only with a NAT device''s ability to hide internal network
    topology from the Internet, but as part of the process of securing VoIP communications,
    this information is critical. Get to know the headers shown in Figure 8.5.You''ll
    be seeing them frequently.'
