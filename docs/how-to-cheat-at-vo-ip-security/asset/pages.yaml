    +   1. Party B dials on the touch pad.

    2. Each digit is received by the switch and sends a silence tone and starts Inter
    Timer (IDT).

    3. IDT starts when the switch is awaiting a dialed digit and stops when the digit
    is pressed.


    After Party B dials the last number, the ring down sequence begins:


    +   1. When the digit receipt stops (or when the maximum dialed digits are pressed),
    the switch sends the request to the called number to allocate a time slot.

    2. When the call switch allows a time slot the party is switched to the call handler.

    3. Party A’s phone rings (unless it is already off-hook).


