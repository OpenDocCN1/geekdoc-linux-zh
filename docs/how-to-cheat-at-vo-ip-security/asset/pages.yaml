    the file that they wish to download when connecting.


    There are very strict regulations on how data is sent between computers, which
    allows client applications to be written easily. Similar to the FTP protocol,
    TFTP allows for data to be sent as either ASCII or binary. This data is sent in
    individual UDP packets between the devices. Of these packets, five types can be
    transmitted, each one identified by an operation code in the header of the data.


    +   - Read Request (RRQ)

    - Write Request (WRQ)

    - Data

    - Acknowledgement (ACK)

    - Error


    # TFTP File Transfer Operation


    When a client wishes to download a file from a TFTP server, it first sends a Read
    Request (RRQ) packet to the TFTP server. This packet identifies itself as an RRQ
    packet, and also specifies the name of the file the client wishes to download
    and the data mode (binary or ASCII). Likewise, if the client wishes to upload
    a file to a TFTP server, it sends an identical Write Request (WRQ) packet, which
    also contains the file name and data mode. The sender computer then immediately
    starts data packets to the recipient computer. If the data is greater than 512
    bytes in size, multiple packets will be sent. A packet that contains a data portion
    smaller than 512 bytes is the last packet in the transfer. Following the receipt
    of each data packet, the receiving computer sends an acknowledgement (ACK) packet
    to the sender, notifying that the transfer was successful. Figure 4.4 details
    this transfer between two computers.


    # Security Implications for TFTP


    Insom that TFTP was designed for simplicity and ease of use, any mechanisms normally
    used to secure data were not implemented into its protocol. It was originally
    planned by engineers that usernames and passwords should ever be required for
    TFTP access, but this has led to many security issues. This concern is also greater
    because TFTP packets are sent in the clear across, with no encryption. Given there
    is no authentication, and no encryption, TFTP is generally not recommended for
    the transfer of sensitive data. However, its role as a "bootstrap protocol" could
    allow usernames and passwords to be transferred in the clear across a network
    when these aren''t protected by higher-level mechanisms. Since TFTP is often used
    to download boot images from a remote server, and these images often contain sensitive
    data required to connect into various servers on the network, it is possible


