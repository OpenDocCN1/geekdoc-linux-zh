    # Power-over-Ethernet (IEEE 802.3af)


    As the name implies, Power-over-Ethernet (POE) eliminates the need to run a separate
    power supply to common networking appliances. POE works by injecting power using
    a switch or special power injector that pushes Direct Current (DC) voltage into
    the CAT5 cable. POE can be used directly with devices specifically designed for
    POE or other


