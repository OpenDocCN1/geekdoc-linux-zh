- pgno: 380
  md: '# Enforcement Process and Penalties


    The FCC requires appropriate CALE filings by each carrier and can impose fines
    when those filings are missing, incomplete, or otherwise not in line with CALE
    regulations. At this point, there have been no major fines but the threat of fines
    has kept carriers on top of all required filings. With the inclusion of VoIP it
    will be interesting to see if the FCC takes a "tough gut" stance on CALE enforcement
    once the current set of VoIP and packet-related CALE lawsuits has resolved.


    Elliott Eicken at Verizon Calea a "Four-Step Process" to describe the regulatory
    experience surrounding CALEA (and E911) compliance; it rings particularly true
    for me:


    +   1. Denial: "Not us!",


    +   2. Depression: "We can’t do it technically."


    +   3. Anger: "This is going to cost a fortune!",


    +   4. Acceptance: "CALEA and E911 are not going away; let’s make work."


    # E911: Enhanced

    911 and Related Regulations


    Within the United States and Canada, 911 is the official national emergency emergency
    number; calls to 911 are directed to the most appropriate Public Safety Answering
    Point (PSAP) dispatcher for local emergency medical, fire, and law enforcement
    agencies via specialized infrastructure. Enhanced 911 (E911) systems automatically
    show the PSAP a calling telephone number and location for wireeline phones using
    the Automatic Location Identifier (ALI) database (maintained specifically for
    PSAP use, it translates a phone number from Automatic Number Identification (ANI)
    to a physical location). In 1996 the FCC established the wireless E911 program;
    which, when fully implemented, will provide a PSAP with a precise location for
    911 calls. Figure C.2 is an example of an enhanced 911 system. In this system,
    the ALI Location Database translates an ANI into a physical location that can
    be used for emergency dispatch.


    Given all the progress around E911 it may come as a surprise that 911 failures
    due to incomplete VoIP E911 design have led to several high-profile, preventable
    deaths (accompanied by lawsuits and demand for increased regulation). In fact,
    the rise of VoIP carriers that are interconnected with the PSTN has been accompanied
    by major breakdowns in E911 capability that eventually forced an urgent VoIP E911
    order from the FCC in June, 2005. The first involves VoIP carriers not having
    adequate interconnection arrange-


    ![](img/c45efece24bfbfca8be768fba195d8a4_380_0.png)'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'ments to pass E911 calls. But the second is the more interesting problem. What
    happens when you register a VoIP phone over an IP network from any physical location
    in the world (so long as it can be connected to the Internet)?


