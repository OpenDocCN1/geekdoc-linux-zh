    # NOTE


    The key to the incompatibility of NAT and IPsec AH is the presence of the ICV,
    whose value depends partially on the values of the source and destination IP addresses,
    the IP header checksum, and either the TCP or UDP header checksum. The AH ICV
    calculation takes into account the mutable and predictable header fields that
    change as the packet moves hop to hop through the network, but because intermediate
    devices do not share the secret key, they cannot recalculate the correct ICV after
    NAT has altered the aforementioned header fields.


    ESP, on the other hand, was used initially for encryption; the ESP header is inserted
    after the IP header and before the upper layer protocol header (transport mode)
    or before an encapsulated IP header (tunnel mode).'
