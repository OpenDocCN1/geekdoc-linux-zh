  md: '# PSTN: Operational and Regulatory Issues


    Public Telephone and Telegraph (PTT) organizations are the highest-level monopoly
    (or monopoly) in each country, and are generally expected to comply with ITU-T
    standards for interoperability. Each PTT is regulated by its country of origin.
    In the United States, AT&T was broken up in 1982 into a long distance unit (AT&T
    at the Inter-exchange carrier (IXC) authorized only to carry long distance traffic),
    and reorganized of regional Bell Operating Companies were given a limited Local
    Exchange Carrier (LEC) role that until recently prevented them from selling interstate
    (or interLATA) long distance services. Competitive LECs (CLECs), in spite of regulatory
    advantages, less than 10% of local lines.


    > WARNING

    IP used for toll bypass is illegal in certain countries. Be sure you understand
    associated laws before implementing a VoIP system internationally.


    As part of the AT&T breakup, 160 local access and transport areas (LATAs) were
    created around area boundaries. Initially, LECs could not provide long distance
    service across and long distance companies could not provide local service, and
    some states have not removed these restrictions. Similar attempts to promote competitive
    services within specific countries are underway in various parts of the world.


    # PSTN Call Flow


    Now that we have discussed what makes up the PSTN, let''s put it all together
    and walk through a messaging sequence. Here we will start from a caller picking
    up the phone attempting to make a call.The flow will be broken down into off-hook,
    digit receipt, ring down, conversation, and on-hook sections. We will start by
    imagining someone (Party B) picking up the phone to make the call (to Party A,
    on the same CO switch). The following list outlines, in order, the actions performed
    by the network:


    +   Party B picks up the phone, and the off-hook sequence begins:

    1. The off-hook state is detected by the switch (loop or ground start).

    2. The switch establishes the time slot and sends a dial tone on the voice path.

    3. The switch awaits digits pressed by Party B.


    The digit receipt sequence is as follows:'
