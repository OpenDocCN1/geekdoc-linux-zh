- pgno: 58
  md: '# Chapter 3 • Architectures


    some challenges because VoIP is asynchronous. VoIP is also a packet technology
    (since it runs on packet networks), so it is subject to variations in latency
    and jitter and packet loss that are not significant issues in circuit networks
    because timeouts are guaranteed. On the other hand, the PSTN''s circuit network
    is far less efficient than any packet network because of the excess capacity it
    reserves.


    As T1 and other digital trunks were deployed in the PSTN, digitized voice services
    in 64Kbps increments, each called a Digital Signal 0 (D0)—became the switchable
    unit of the PSTN. A single DS0 is a 64Kbps channel equivalent to an analog line
    converted to digital via G.711. With the advent of TDM-based digital switches,
    the DS0 are aggregated by digital access and cross-connect systems (DACS) for
    transport or presentation to the switch via DS1 (1.5 Mbps) or DS3 (45 Kbps) interfaces.
    These digital switches communicate over T1 and other digital circuits to access
    and toll tandem, switching calls across the telephone network to destination switches.
    The DS0 voice channels are then split out to their original 64Kbps state and converted
    to analog onward towards the destination location.


    In fact, there is a full hierarchy to the T carrier system in North American and
    the E carrier system in Europe (as well the most recent SONET/SDH optical carrier
    system). Aggregation of voice and data channels at many levels can take place,
    and knowing how these systems can interact. Table 3.1 roughly defines the capacity
    and latency of the North American, Japanese, and European digital signal hierarchies
    in a single chart. I''ve never been able to find this information in one place,
    so I created a single chart to cover the whole range of PSTN transport solutions
    in use today.


    In Table 3.1, Bolded items are used most commonly in wide area networks overall.
    Note: ALTHOUGH SONET and SDH are directly equivalent to each other, the process
    of mapping between them and their T- or E-carrier counterparts requires the use
    of SONET Virtual Tributaries (VTs) and Virtual Tribut Groups (VTGs) or SDH Virtual
    Containers (VCs).


    As you can see from Table 3.1, 24 DS0 channels make up a T1, 28 T1 circuits make
    up a T3 or OC-1 link, and so forth. An OC-12 link can support up to 7936 channels
    if it''s broken out by DACS or Add Drop Multiplexer (ADM). 10 Gigabit Ethernet
    can run over an OC-192 SONET. These mappings are essential to increasing capacities
    for Internet access circuits as well when sizing for VoIP, since upper limits
    on Speed (left column) cannot be physically exceeded (note that actual throughput
    will be at least 10% lower because of overhead).'
