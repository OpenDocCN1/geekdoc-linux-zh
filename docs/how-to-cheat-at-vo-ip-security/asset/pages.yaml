  md: '# Tools & Traps...


    # Core E911-Compliance Issues

    for IP Communications Systems


    As CLEA, there is a bit more focus on equipment capabilities and standards as
    part of compliance. However, retrofitting a compliant solution over a noncompliant
    system isn''t necessarily difficult and expensive if it''s well planned. Regardless,
    E911 should be a critical part of your vendor-facing solution evaluation / procurement
    process.


    For enterprise VoIP systems, the critical considerations involve local regulations
    that require accurate information for ALI tables. Many enterprise system vendors
    have location databases, capabilities for end-user location self-reporting, and
    partnerships with third-party solutions for maintaining location information even
    when IP phones moved.


    # E911 Compliance and Enforcement


    The FCC and the National Association of Regulatory Utility Commissioners (NARUC)
    formed the Federal/State VoIP Enhanced 911 Enforcement Task Force to facilitate
    compliance with FCC VoIP 911 rules as well as any necessary enforcement. The Task
    Force is made up of FCC staff and representatives from various State PUCs, and
    operates in conjunction with NENA, the Association of Public Safety Communications
    Officials, and various state and local emergency authorities. The Task Force''s
    mission is to “develop educational materials to ensure that consumers understand
    their rights and the requirements of the FCC’s VoIP 911 Order; develop appropriate
    compliance and enforcement strategies; compile data; and share practices.


    # Self-Certification


    At this point, the FCC process requires a self-certification by each VoIP carrier
    that must be filed with the FCC. As standards emerge, some form of product certification
    for VoIP E911 may eventually take place.


    # Enforcement Process and Penalties


    Despite the number of extensions granted by the FCC in 2005, a number of fines
    and other penalties have been levied recently against noncompliant VoIP carriers.
    State and local agencies are also involved in enforcement and follow their own
    enforcement regimes.'
