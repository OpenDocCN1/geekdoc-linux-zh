  md: '# SNMP Architecture


    An SNMP implementation on a network involves three components to be integrated:
    the devices to be managed, agents, and Network Management Systems (NMSes). The
    devices to be managed are simple computers or devices on the network that reside
    on the network. These are the devices that an administrator would like to monitor
    on the network. Each device must have an agent installed on them, which is a software
    application that continually monitors the device for predefined events or errors
    and transmits them to a centralized management server, an NMS. The NMS collects
    all of the data that is routinely transferred from the various network devices
    and correlates it into useful information for an administrator to read and evaluate.


    However, even with all of these components working together on a network, there
    still must be a structure to all of the individual data that can be gathered across
    a network by an NMS. This is implemented by the use of a Management Information
    Base (MIB). See Figure 4.5 for a diagram on how these components work together.


    # Figure 4.5 SNMP Network Components


    ![](img/c45efece24bfbfca8be768fba195d8a4_130_0.png)


    # SNMP Operation


    The SNMP protocol works under a very simplified model of data collection and control
    of the managed devices. Only a few basic commands are used in the SNMP protocol,
    such as GETREQUEST, GETNEXTREQUEST, SETREQUEST, and TRAP. An SNMP invokes GETREQUEST
    to collect data from a device, and GETNEXTREQUEST to retrieve the'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Support Protocols • Chapter 4 125


    next value in a set. An NMS can also invoke SETREQUEST command to save data to
    a managed device. The TRAP command is the only one not initiated by the NMS; it
    is sent out by the client to report any unusual activity it has detected.


    On the client side, the Management Information Base MIB acts as a tree that catalogs
    all the various data components of the system or device. Each of these data components
    are known by their object identifiers (OIDs). The OID is made of multiple sets
    of numbers, separated by a period, in a structured order similar to that of an
    IP address. As a general rule, all OIDs begin with .1.3.6.1.4.1.9. To request
    a value, an established OID must be specified. For example, to request the system
    uptime, OID .1.3.6.1.2.1.1.2 is read.


    # SNMP Architecture


    The SNMP protocol has careful attention and configuration simply due to the amount
    of information that could be leaked to malicious users. Since this data is retrievable
    by anyone requesting it, there must be some safeguards in place to prevent unauthorized
    users from being able to read data, or modify it. This is performed by the use
    of a community string. A community string acts as a password to group data into
    either read-only or read-write areas. By default, most software is to use a default
    community string of “public” for their read-only data. Likewise, many implementations
    use a default community string of “private” for their read-write data. It is particularly
    dangerous to leave community strings in places, as they are well known to malicious
    users, and an unchanged read-write community string allows an attacker the ability
    to modify critical data on a device.


    ![](img/c45efece24bfbfca8be768fba195d8a4_131_0.png)


    Are You Allowing Sensitive Data to Be Leaked? Due to the open nature of SNMP,
    allowing anyone to easily request data, unique community strings should be defined
    for network components that you can administer. Proper care must be taken in evaluating
    IP phones to ensure that they do not have unsecured SNMP access available. Otherwise,
    all of your SNMP-enabled components, such as workstations, servers, routers, and
    phones, can disclose sensitive information to anyone who knows. Unless you are
    constantly monitoring network traffic, you may not know that this information
    is being gathered by malicious people within your network environment—or, even
    worse, being modified to cover unauthorized actions.


