    # Inner Authentication Types


    A number of inner authentication methods exist. The most commonly used is MS-CHAP-V2
    because it is relatively secure and it is supported natively on all recent Microsoft
    clients. Additionally, PAP, CHAP, MD5, GTC, and other inner authentication methods
    exist but are not nearly as commonly used. Interestingly, EAP itself can be tunneled
    within EAP.


    # MS-CHAP v2


    MS-CHAP v2 is a one-way encrypted password, two-way authentication process that
    provides mutual authentication between peers (see Figure 6.7). It differs from
    MS-CHAP-V1 because it piggybacks an additional peer challenge string (PCS) on
    the Response packet and an additional authenticator response on the Success packet.
    Both the authenticator server and the client change and authenticate each other.
    The message flow is as follows:


    # Figure 6.7 MS-CHAP-V2


    ![](img/c45efece24bfbfca8be768fba195d8a4_178_0.png)


    +   1. Authenticator sends a challenge consisting of a Session ID and random authenticator
    challenge string (ACS).


    +   2. Client (peer) sends a response containing an encrypted one-way hash of
    the session ID, username, a peer challenge string (PCS), the peer response (PR),
    and the user password (secret).


    +   3. Authenticator responds with another one-way hash (based on the client response)
    of a success/failure code, the authenticator response (AR), and the user’s password
    (secret).'
