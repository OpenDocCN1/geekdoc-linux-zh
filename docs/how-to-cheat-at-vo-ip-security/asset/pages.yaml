- pgno: 322
  md: '# Validate Existing Security Infrastructure • Appendix A


    # Purpose


    VoIP is a highly critical data application and as such, is subject to all the
    policies detailed in other security policy sections (this assumes that the VoIP
    Security Policy is part of a larger set of security policy modules). The purpose
    of this section is to provide an additional checklist to ensure that VoIP systems
    sharing the data network as a converged technology are implemented in a secure
    fashion.


    # Policy


    Security in an IP telephony environment includes all the security features of
    traditional telephony and adds all the security concerns of the data network.
    IP telephony converts voice to data and places these into IP packets. As such,
    packets can be “sniffed” just like any other data packet on the network, thereby
    raising issues of confidentiality. The operating systems underlying IP-PBXs and
    other gateway devices are susceptible to the same attacks that regularly disrupt
    other types of services.


    # Physical Security


    IP-PBX equipment must be located in a locked room with limited access. This type
    of access must be provided as a user authentication system with either a key-card
    or biometric device. The use of a keypad to gain access is not permitted. All
    methods of gaining entry into the room must provide for a list of users that have
    accessed the room along with a date/time stamp.


    # VLANs


    Logical separation of voice and data traffic via VLANs is required to prevent
    the VoIP streams from broadcast collisions, and to protect data network problems
    from affecting voice traffic.


    # Softphones


    Softphones that contain any type of advertising software must be banned in a highly
    secure environment. Softphone installation targets should be tested before deployment
    and those that do not encrypt user credentials should be prohibited.


    Because a softphone is an application running on an operating system, its security
    depends principally upon the status of the underlying OS, and is subject to the
    same security concerns as any other communications program including e-mail, browsing,
    and IM.


    # Encryption


    All VoIP systems should use a form of Media (RTP channel) Encryption in order
    to avoid the sniffing of VoIP data. All communications between network elements
    should be


    ![](img/c45efece24bfbfca8be768fba195d8a4_322_0.png)'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'encrypted. Complete end-to-end IP voice encryption is recommended to mitigate
    the threat of eavesdropping attempts. Additionally, all administrative access
    to critical server and net-work components must use encrypted protocols such as
    SSL and/or SSH. All access to remote administrative functions should be restricted
    to connections to the switch itself or to a designated management PC.


    # Layer 2 Access Controls


    The most comprehensive solution is to require all devices to authenticate on layer
    two using 802.1X before receiving layer three (IP) configuration settings.


    Additionally, consider enabling port security as well as MAC address filtering
    on distri-tion switches. The port security feature of these devices provides the
    ability to restrict the use of a port to a specific MAC address or set of MAC
    addresses. It is generally considered that this is difficult to implement and
    maintain, but with proper planning, port security does not have to be difficult.
    Several third-party tools are available to help manage and maintain port security
    in enterprise environments.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Summary


    In this chapter, we have discussed many of the ways that you can reuse portions
    of your existing security infrastructure as you add voice traffic to the mix.
    After you or your management has made the decision to move to a converged network,
    and before the new architecture is completed, it is important that one or more
    of the security group participate in the architectural discussions. "Bolting on
    ''security'' components and processes after the network and application architecture
    is finalized doesn''t work. Security as an afterthought usually results in a network
    that is insecure, as well as users who are frustrated because they now have to
    "do things differently."


    Adding VoIP to your network to introduce additional risks, your first step is
    to review your security policies. Do they exist? If so, are they current? Most
    associates know where to find them? Do they understand their responsibilities?


    In the section Security Policies, we discussed the steps involved in formulation
    of policy. We talked about implementation and communication of the policy guidelines,
    as well as who should be involved in the process. A sample VoIP Security policy
    is located near the end of the chapter. Feel free to use this as a template for
    your owns.


    In the section Physical Security, we discussed some of the measures and physical
    controls that are needed in a VoIP environment. A truly dedicated attacker, finding
    little means of accessing an organization''s internal IP network over a public
    network such as the Internet, will turn to physical penetration to bypass the
    organization''s logical perimeter security controls. This is not just a theoretical
    vulnerability; numerous indices of attackers using physical penetration to bypass
    logical perimeter security controls have been reported in the mainstream media.
    A comprehensive security strategy must ensure the efficacy of physical security
    as well as its logical or technical perimeter.


    The section on Server Hardening we went into some detail regarding hardening of
    specific platforms and the rationale for doing so. All hosts attached to the VoIP
    network should follow a standard procedure and be subjected to hardening before
    they are connected to the network. One group within the organization should bear
    the responsibility for maintaining standard build and hardening guidelines for
    Windows, Linux, AIX, and other UNIX and UNIX-like operating systems. This group
    should define these guidelines, ensure that these hosts are hardened and patched
    after deployment, and ensure that patches are updated periodically as appropriate.
    This group should also maintain a central registry of individuals and groups running
    these operating systems so that periodic audits can be conducted to guarantee
    that the systems do not deviate from the established security baseline.


    The section on Supporting Systems described the functions and security characteristics
    of VoIP supplementary services. The servers that host these services should be
    hardened and patched per security policy guidelines. Hardening of these servers,
    as mentioned earlier, should follow the principle of "Least Privilege." This means
    that nothing required'
