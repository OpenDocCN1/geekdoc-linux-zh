    # Summary


    We all heard “Consultant-speak.” Many of us practice it as well. I have done my
    best in this book to stay away from empty, jargon-laden speech, but I am sure
    it creeps in at times. Here is my favorite example:


    +   Consultant-speak: VoIP Security is dependent on management of Process.

    **What this really means:** Processes define how individuals perform their duties
    within an organization. For securing VoIP networks, the processes include proactive
    ones such as formulation of security policies, identity verification management,
    hardening of operating systems, firewall deployment and configuration, system
    backup procedures, and penetration testing; and reactive processes such as log
    analysis, network monitoring, forensics, and incident response. If a process does
    not exist (e.g., if a task is performed in an ad hoc fashion), then one should
    be created. The security policies, processes, and standard operating procedures
    (SOPs) that have already proven successful in securing your data networks need
    to reused and extended. The ones that don’t work should be discarded.


    Organizations that deploy or plan to deploy VoIP networks will have to work harder
    than security. Security will cost more and will require better administrators.
    We are getting to the point in networking where naïve system administration is
    not just bad practice; it may be criminal. Regulations such as Sarbanes-Oxley
    (SOX), GLBA, and CALEA in the United States, as well as DPEC in Europe, have been
    interpreted to mean that privacy violations will be treated as criminal acts.


