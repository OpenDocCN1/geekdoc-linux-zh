- pgno: 108
  md: '# Real-Time Streaming Protocol


    The Real-Time Streaming Protocol (RTSP) is used to control the delivery of streaming
    media across the network. RTSP provides the ability to control streaming media
    as much as you would control video running on a VCR or DVD player.Through this
    protocol, an application can use commands to play, pause, or perform other actions
    that effect the playing of media being transferred to the application.


    > NOTE

    ETF defined RTSP as a standard in RFC 2326, allowing clients to control streaming
    media sent to them over protocols like RTP.


    # Understanding SIP''s Architecture


    Now that we''ve looked at the various components that allow SIP to function on
    an IP network, let''s look at how they work together to provide communication
    between two endpoints on a system. In doing so, we can see how the various elements
    come together to allow single and multimedia to be exchanged over a local network
    or the Internet.


    The User agents begin by communicating with various servers to exchange exchange
    data. Until they can establish a session with one another, they must work in a
    client/server architecture, and make requests of servers and wait for these requests
    to be serviced. Once a session is established between the User agents, the architecture
    changes. Because a User agent can act as either a client or a server in a session
    with another User agent, these components are part of what is called a peer-to-peer
    (P2P) architecture. In this architecture, the computers are equal to one another,
    and both make and service requests made by other machines. To understand how this
    occurs, let''s look at several actions that a User agent may make establish such
    a session with another machine.


    # SIP Registration


    Before a User agent can even make a request to start communication with another
    client, each participant must register with a Registrar server. As in Figure 3.20,
    the User agent sends a REGISTER request to the SIP server in the Registrar role.
    Once the request is accepted, the Registrar adds the SIP-address and IP address
    that the User agent provides to the location service. The location service can
    then use this information to provide SIPaddress to IP-address mappings for name
    resolution.


    ![](img/c45efece24bfbfca8be768fba195d8a4_108_0.png)'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Figure 3.20 Registering with a SIP Registrar


    ![](img/c45efece24bfbfca8be768fba195d8a4_109_0.png)


    # Requests through Proxy Servers


    When a Proxy Server is used, requests and responses from user agents initially
    are made through the proxy server. As seen in Figure 3.21, User Agent A is attempting
    to invite User Agent B into a session. User Agent A begins sending an INVITE request
    to User Agent B through a proxy server, which checks with the location service
    to determine the IP address of the client being invited. The proxy server then
    passes this to User Agent B, who answers the request by sending its response to
    the proxy server, who in turn passes this response back to User Agent A. During
    this time, the two user agents and the proxy server exchange these requests and
    responses using SDP. After, once these have been completed and the proxy server
    sends acknowledgments to both clients, a session can be created between the two
    user agents. At this point, the two user agents can use RTP to transfer media
    between them and communicate directly.


    # Requests through Redirect Servers


    When a Redirect server is used, a request is made to the Redirect server, which
    returns the IP address of the user agent being contacted. As seen in Figure 3.22,
    User Agent A sends an INVITE request for User Agent B to the Redirect server,
    which checks the location service for the IP address of the client being invited.
    The redirect server then returns this information to User Agent A. Now User Agent
    A has this information, it can now contact User Agent B directly. The INVITE request
    is now sent to User Agent B, who responds directly to User A. Until this point,
    SDP is used to exchange information. If the invitation is accepted, then the two
    user agents would begin communicating and exchanging media'
