  md: '# Figure 1.1 Normal Message Flow


    ![](img/c45efece24bfbfca8be768fba195d8a4_16_0.png)


    In Figure 1.2, the request-response topology is different from the message flow
    shown in Figure 1.1. In this figure, an external host (IP Phone, PC softphone,
    etc.) attempts to place a call to an internal host. Since no session is established,
    stateful inspection or ALG firewalls will not allow this connection to complete.
    We talk about this in much more detail in Chapter 8.


    There are other differences. VoIP''s sensitivity to adverse network conditions
    is different enough quantitatively from that of most types of data traffic that
    the difference is qualitative. Real-time applications, including VoIP, place requirements
    on the network infrastructure that go far beyond the needs of simple best-effort
    IP transport. Each VoIP packet represents about 20 ms of voice on average. A single
    lost packet may not be noticeable, but the loss of multiple packets is interpreted
    by the user as bad voice quality. The simple math indicates that even a short
    IP telephone call represents the transport of large numbers of packets. Network
    latency, jitter (interpacket latency variation), and packet loss critically affect
    the perceived quality of voice communications. If VoIP is going to work, then
    the network must perform well—.'
