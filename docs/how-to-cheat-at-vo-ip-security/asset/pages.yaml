    proxies and registrars. SRV (service) records normally begin with an underscore
    (_sip.tcpserver.udp.domain.com) and consist of information describing service,
    transport, host, and other information. SRV records allow administrators to use
    several servers for a single domain, to move services from host to host with little
    fuss, and to designate some hosts as primary servers and others as backups.


    An attacker''s goal, when attempting a DNS Poisoning or spoofing attack, is to
    replace valid DNS A, SRV, NS records with records that point to the attacker''s
