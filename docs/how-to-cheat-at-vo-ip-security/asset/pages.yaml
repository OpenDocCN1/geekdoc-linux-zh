  md: 'The Internet, just as a Uniform Resource Locator (URL) is used to identify
    Web sites. The URI used by SIP incorporates a phone number or name, as SIP: user@syngress.com,
    which makes reading SIP addresses easier. Rather than reinventing the wheel, the
    development of SIP incorporates familiar aspects of existing protocols that have
    long been used on IP networks. The modular design allows SIP to be easily incorporated
    into Internet and network applications, and its similarities to other protocols
    make it easier to use.


    # RFC 2543 / RFC 3261


    The Session Initiation Protocol is a standard that was developed by the Internet
    Engineering Task Force (IETF). The IETF is a body of network designers, researchers,
    and vendors that are members of the Internet Society Architecture Board for the
    purpose of developing Internet communication standards. The standards they create
    are important because they establish consistent methods and functionality. Unlike
    proprietary technology, which may or not work outside of a specific program, standardization
    allows a protocol or other technology to be a standard, it can work the same way
    in any application or environment. In other words, because SIP is a standard,
    it can work on any system, regardless of the communication program, operating
    system, or infrastructure of the IP network.


    The way IETF develops a standard is through recommendations for rules that are
    made through Request for Comments (RFCs). The RFC starts as a draft that is examined
    by members of a Working Group, and during the review process, it is developed
    into a finalized document. The first proposed standard for SIP was produced in
    1999 as RFC 2543, but in 2002, the standard was further defined in RFC 3261. Additional
    documents outlining extensions and specific issues related to the SIP standard
    have also been released, which make RFC 2543 obsolete and update RFC 3261. The
    reason for these changes is as technology changes, the development of SIP evolves.
    The IETF continues developing SIP and its extensions as new products are introduced
    and its applications expand.


    > provide additional insight and information, answering specific questions you
    may have about SIP. The RFCs related to SIP can be reviewed by visiting the IETF
    Web site at www.ietf.org. Additional materials related to the Session Initiation
    Protocol Working Group also can be found at www.softarmor.com/sipwg/


