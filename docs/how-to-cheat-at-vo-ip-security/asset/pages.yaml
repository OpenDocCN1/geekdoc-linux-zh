  md: '# Chapter 3 • Architectures


    In Figure 3.18 you can see that the addition of security profile H.235.6 to the
    baseline security profile adds methods for Diffie-Hellman key management and encryption
    of the media streams. In this fashion, security profiles can be added to the H.323
    entities within your environment as to provide only the security controls dictated
