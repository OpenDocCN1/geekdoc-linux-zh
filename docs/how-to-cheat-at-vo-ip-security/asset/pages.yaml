- pgno: 32
  md: '# Tools & Traps...


    # Asterisk: The Open-Source PBX


    PBX servers were notiously expensive to justify when an organization wasn''t ready
    for a major capital outlay, plus they tended to rely on closed or proprietary
    architecture, which made PBX systems more expensive than they might otherwise
    have been. Then along came Asterisk, from the mind of Mark Spencer. Asterisk is
    an open-source PBX software that runs on many operating systems, including Linux,
    BSD, Mac, and even Windows. Asterisk requires very little in the hardware, with
    old Pentium 100MHz boxes with 64MB RAM still ample enough to power a small business.
    Aside from the relatively low hardware requirements, Asterisk doesn''t necessarily
    need any additional hardware, aside form from what your computer. Utilizing the
    popular Session Initiation Protocol (SIP) and the Inter-Asterisk Exchange Protocol
    (IAX), two increasingly ubiquitous VoIP technologies, Asterisk can make and take
    calls completely over the Internet or operate with special hardware like PCI T1/E1
    cards for PSTN connectivity. Users might purchase IDs from the VoIP provider to
    dial in their normal phones, or they may dial in a special software. We discuss
    sessions later in this chapter.


    The appeal of a PBX system is not only to businesses and campuses but also attackers,
    who have taken an increased interest in them all well, since PBX systems can support
    trunk-to-trunk transfer (i.e., dial-out again from the PBX after coming in one
    another). PBX security often is overlooked by enterprises until a big phone bill
    arrives, and often the hackers have no control at all when settings were changed
    from the manufacturer''s default. Try a Google search for “default password” and
    a PBX vendor and you''ll see how easy this can be. It is important to note that
    PBX vendors typically have provided detailed instructions on how to secure the
    PBX, the remaining responsibility lies completely on the operator of the PBX system,
    and any toll charges that may be obtained by fraud are left to be paid by the
    PBX owner. Attackers who have compromised a PBX system may set up their own private
    conference room, a “party-line” where they may hang out and extract illicit information
    on your dime.


    Other features can be a double-edged sword as well. PBX systems also provide a
    call-monitoring feature for managers to supervise their agents (or to record calls).
    You know those recordings that go, “Your call may be monitored for quality assurance
    and turning purposes”? Well, if you''re not careful, they might also be monitored
    for hazardous or larcinous purposes. And it may not be just calls to your call
    center that get monitored; if your monitoring system wasn''t properly designed
    or an intruder gets access to PBX administration at a high level, any call can
    be monitored.


    www.syngress'
