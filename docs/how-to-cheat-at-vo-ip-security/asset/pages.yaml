- pgno: 99
  md: '# Client/Server versus Peer-to-Peer Architecture


    In looking at the components of SIP, you can see that requests are processed in
    different ways. When user agents communicate with one another, another sees requests
    and responses to one another. In doing so, one acts as a User Agent Client, and
    the other fulfils the request as a User Agent Server. When dealing with SIP servers
    however, they simply send requests that are processed by a specific server. This
    reflects two different types of architectures used in network communications:


    +   * Client/Server

    * Peer-to-peer


    # Client/Server


    In a client/server architecture, the relationship of the computers are separated
    into two roles:


    +   * The client, which requests specific services or resources

    * The server, which is dedicated to fulfilling requests by responding (or attempting
    to respond) with requested services or resources


    An easy-to-understand example of a client/server relationship is seen when using
    the Internet. When using an Internet browser to access a Web site, the client
    would be the computer running the browser software, which would request a Web
    page from a server. The server receives this request and then responds to it by
    sending the Web page to the client computer. In VoIP, this relationship can be
    seen when a client sends a request to register with a Registrar server, or makes
    a request to a Proxy Server or Redirect Server that allows it to connect with
    another user agent. In all these cases, the client''s role is to request services
    and resources, and the server''s role is to listen to the network and await requests
    that it can process or pass onto other servers.


    The servers that are used on a network acquire their abilities to serve requests
    by the programs installed on it. Because a server may run a number of services
    or multiple server applications installed on it, a computer dedicated to the role
    of being a server may provide several functions on a network. For example, a Web
    server might also act as an email server. In the same way, SIP servers also provide
    different services. A Registrar register clients and also run the location service
    that allows clients and other servers to locate other users who have registered
    on the network. In this way, a single server may provide diversity functionality
    to a network that otherwise be unavailable.


    Another important function of the server is that, unlike clients that may be disconnected
    from the Internet or shutdown on a network when the person using it is, a server
    is generally active and awaiting client requests. Problems and maintenance aside,
    a dedicated server is up and running, that it is accessible. The IP address of
    the server


    ![](img/c45efece24bfbfca8be768fba195d8a4_99_0.png)'
