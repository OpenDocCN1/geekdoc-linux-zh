  md: '4. The TLD DNS server does not have the RR for the host pc1, so the response
    is sent to redirect the resolver on pc2 to .brad.com. DNS server since it knows
    where .brad.com.


    5. The resolver, in turn, sends a query to the DNS server for .brad.com.


    6. .brad.com DNS server does not have the RR for the host pc1, so the response
    is sent to redirect the resolver on pc2 to .hr.brad.com. DNS server since it knows
    where .hr.brad.com.


    7. The resolver, in turn, sends a query to the DNS server for .hr.brad.com.


    8. The authoritative DNS server for .hr.brad.com has the RR for the host pc1 and
    sends back the information to pc2. pc2 now has the IP address information for
    pc1, and may use it accordingly.


    > > NOTE,It is not required to have a separate DNS server for each subdomain.
    A single DNS server may be the authoritative DNS server for many, or all, of the
    subdomains in a corporation, although there are usually backup DNS servers for
    each primary DNS server.


    # DNS Server Operation


    The DNS server is responsible for cataloging all of the RRs that belong to any
    of the zones it is the authoritative DNS server for. It is also responsible for
    keeping track of any of the DNS servers that it has delegated subdomain responsibility
    to. By keeping track of the subdomains, the DNS server is able to redirect queries
    to the proper location in the event that the requested host RR does not reside
    on that server.


    DNS servers may also be configured to maintain a cache of domain names, as well
    as their respective IP addresses, as they are requested by clients. This configuration
    allows a DNS server to retrieve an IP address once and store the value for any
    subsequent queries by the same client or any other client.These entries are cached
    for a short period of time, equal to the Time Live (ttl) value applied to the
    code. When a client requests a particular name resolution, the DNS server will
    first attempt to find the records in its local database. If this search fails,
    the DNS server will attempt to contact a name server, if it is configured to do
    so, to request the value.


    Another important function that the DNS servers provide the replication of the
    DNS table, also as a zone transfer. The zone transfer ensures that all entries
    for a given zone will be available on all DNS servers in that zone. This is necessary
    so that DNS can provide'
