- pgno: 84
  md: '# H.235 Security Mechanisms


    H.235 is expected to operate in conjunction with other H-series protocols to utilize
    H.225 as its control protocol and/or use the H.225.0 RAS and/or Call Signaling
    Protocol. H.235''s major principle is that the security threat to communications
    is assumed to be eavesdropping on the network, or other method of diverting streams.
    The security issues related to DoS attacks are not addressed.


    This family of threats relies on the absence of cryptographic assurance of a request''s
    originator. Attacks in this category seek to compromise the message integrity
    of a conversation. This threat demonstrates the need for security services that
    enable entities to authenticate the originators of requests and to verify that
    the contents of the message and control streams have not been altered in transit.


    Authentication is, in general, based either on using a shared secret (you are
    authenticated properly if you know the secret) or on public key-based methods
    with certifications (you prove your identity by possessing the correct private
    key). The basis for authentication (trust) and privacy is defined by the endpoints
    of the channel. For a connection establishment channel, this may be between the
    caller (such as a gateway or IP telephone endpoint) and a hosting network component
    (a gateway or gatekeeper). For example, a telephone "trusts" that the gatekeeper
    will connect it with the telephone whose number has been dialed. The result of
    trusting an endpoint is the confidence to reveal the privacy mechanism (algorithm
    and key) to that element. Given the aforementioned information, all participants
    in the communications paths should authenticate any and all trusted elements.


    Encryption methods are defined as DES, 3DES, and AES.TLS (Transport Layer Security)
    and IPSec (IP Security) are recommended to secure layer 4 and layer 3 protocol
    messages, respectively. IPSec and TLS in the Transport Layer both use the same
    type of negotiation to set up tunnels, IPSec encrypts crucial header information,
    and TLS encrypts only the application payload of packet, thus TLS encryption retains
    IP addressing.


    The scope of the H.235 specification is shown in Figure 3.16. H.235 addresses
    the protocols that are shaded in grey.


    Let''s look at how the H.235 specification interacts with each protocol.


    +   H.245 The calling channel may be secured using TLS. Users may be authenticated
    either during the initial call connection, in the process of securing the H.245
    channel, and/or by exchanging certificates on the H.245 channel. Media encryption
    details often are negotiated in private control channels determined by information
    carried in the OpenLogicalChannel connection.'
