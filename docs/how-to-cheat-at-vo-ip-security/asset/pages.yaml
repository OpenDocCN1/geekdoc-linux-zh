  md: '# 802.11x and 802.11i (WPA2)


    The 802.1x protocol defines port-based, network access control that is used to
    provide authenticated network access control (see Figure 6.2). Although this standard
    is designed for wired Ethernet networks, it has been adapted for 802.11 WLANs.
    It is simply a standard for passing EAP over a wired or wireless LAN.


    Figure 6.2 EAPOL


    ![](img/c45efece24bfbfca8be768fba195d8a4_168_0.png)


    802.1x restricts unauthorized clients from connecting to a LAN. The client must
    first authenticate with an Authentication server, typically a RADIUS server, before
    the switch port is made available and the network can be accessed. EAP (Extensible
    Authentication Protocol) is a general authentication protocol that provides a
    framework for multiple authentication methods, including traditional passwords,
    token cards, Kerberos, Digital Certificates, and public-key authentication.


    WEP (Wireless Equivalent Privacy) has famously been known to be insecure (Anton
    Rager’s weppack was a subset of the first publicly available for this—http://wepcrack.source-forge.net/);
    however WEP protection of wireless networks is better than no encryption at all.
    The Wi-Fi Alliance (a consortium of major vendors—http://wi-fi.org/) is-


    responsible for drafting both the WPA (Wi-Fi Protected Access) and WPA2 standards.
    The Wi-Fi alliance also formed a VoWLAN (Voice over Wireless LAN) working group
    tasked with developing WMM (Wi-Fi Multimedia) QoS standards for VoIP and other
    multimedia over wireless networks.


