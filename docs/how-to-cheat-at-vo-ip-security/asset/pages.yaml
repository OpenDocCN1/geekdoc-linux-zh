    Each entity at both ends must have a legitimate certificate issued from a CA.
    Think of TLS as a transport layer like TCP on which you send SIP messages. There
    are open source SSL APIs that can be used to set up TLS connections programmatically.
    Once the connection is established, you basically write to the SSL socket, just
