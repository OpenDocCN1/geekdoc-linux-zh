    # Security Implications for DHCP


    A variety of security concerns come into play whenever DHCP is enabled on a network
    segment. These security issues don''t deal so much with leaked data such as passwords.
    Instead, they focus more on access into a network from unauthorized clients. A
    basic DHCP server runs under the assumption that any DHCP Discover and Request
    should be honored as an authorized client. In this setup, any device that requests
    network information will be able to receive it, no questions asked. However, this
    opens the door for physical access to the network to be plugged in by unauthorized
    devices and receive network access.


    A number of ways exists to reduce this network exposure, by modifying the network
    switches by modifying the DHCP configuration. Most of these security implementations
    involve verifying the MAC address of the client device before allowing it to receive
    an IP address. One of the more extensive fixes is to enable port security on the
    implemented network switches. With port security in place, the physical connection
    can be locked to allow only a single MAC address through it. This can prevent
    employees, contractors, from installing a small network hub or wireless router,
    and giving multiple devices access to the network.


    However, an easier method is to provide DHCP addresses to just devices All devices
    have a MAC address coded into them, and these addresses follow a set structure.
    The first six bytes of the MAC address specifies the vendor ID, or the company
    that manufactured the device. If you wish to restrict DHCP to just VoIP phones
    or devices on your network, this is possible by identifying the vendor ID on the
    devices and configuring the DHCP server to provide addresses only to devices that
    have the same vendor ID. For example, Grandstream Networks VoIP phones all have
    a vendor ID of 00:0B:82.


