- pgno: 373
  md: '# FCC CALEA Third Report and Order (August 1999)


    By 1999, the FCC was ready to require all carriers to implement the capabilities
    of the TIA J-standard and six FBI punch list carriers by June 30, 2002. Packet-mode
    communications capability (including VoIP) was to be implemented by September
    30, 2002 (though in practice CALEA extensions for packet continued until late
    2005). In addition, the FCC reached important conclusions regarding location information
    (not directly specified by the Act itself) and packet-mode communications capabilities.
    The FCC press release states:


    # Actions Regarding the Interim Standard (J-STD-025)


    The FCC concluded the following regarding the location information and packet-mode
    communications capabilities of the interim standard:


    **Location information:** The FCC required that location information be provided
    to law enforcement agencies (LEAs) under CALEA''s assistance capability requirements
    for "call-identifying information," provided that a LEA has a court order or legal
    authorization beyond a pen register or trace authorization. The FCC found that
    location information identifies the "origin" or "destination" of a communication
    and thus is covered by CALEA. The FCC, however, did not mandate that carriers
    be able to provide LEAs with the precise physical location of a caller. Rather,
    it permitted LEAs with the proper legal authorization to receive from wireline,
    cellular, and broadband PCS carriers only the location of a cell site at the beginning
    and termination of a mobile call.


    **Packet-mode communications:** The FCC required that carriers provide LEAs access
    to packet-mode communications by September 30, 2001. However, the Commission acknowledged
    significant privacy issues had been raised regarding the J-STD-025 treatment of
    packet-mode communications. Under the J-STD-025, law enforcement could be provided
    with access to both call identifying information and call content, even where
    it may be authorized to only call identifying information. Accordingly, the FCC
    invited TIA to study CALEA solutions for packet-mode technology and report to
    the FCC by September 30, 2000 on steps that can be taken, including particular
    amendments to the interim standard, that will better address privacy concerns.


    # Actions Regarding the Capabilities Requested by DOJ/FBI


    Of the nine items in the DOJ/FBI punch list, the following capabilities were required
    by the FCC:


    ![](img/c45efece24bfbfca8be768fba195d8a4_373_0.png)'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# Content of subject-initiated conference calls— LEA will be able to access
    the content of conference calls initiated by the subject under surveillance (including
    the call content of parties on hold), pursuant to a court order or other legal
    authorization beyond a pen register order.


    Party hold, join on conference calls— Messages will be sent to a LEA that identify
    the active parties of a call. Specifically, on a conference, these messages will
    indicate whether a party is on hold, has joined, or has been dropped from the
    conference call.


    Subject-initiated dialing and signaling information— Access to dialing and signaling
    information available from the subject will inform a LEA of a subject''s use of
    features (e.g., call forwarding, call waiting, call hold, and three-way calling).


    In-band and out-of-band signaling (notification message)— A message will be sent
    to a LEA whenever a subject''s service sends a tone or other network message to
    the subject or associate (e.g., notification that a line is ringing or busy, call
    waiting signal).


    Timing information— Information will be sent to a LEA permitting it to correlate
    call-identifying information with the call content of a communications interception.


    Dialed digit extraction—The originating carrier will provide to a LEA on the call
    channel any digits dialed by the subject after connecting to another carrier''s
    service., pursuant to a pen register authorization. The FCC found that such digits
    fit CALE''s definition of call-identifying information, and that they are generally
    available to carriers


    In requiring the six list capabilities, the FCC noted that it determined that
    of them constitute call-identifying information that is generally reasonably available
    to carriers and therefore required under CALE. The FCC found that although the
    cost to carriers of providing some of these five capabilities is significant,
    no automatic exemptions will be provided. Exclusions must be filed and approved
    on a case-by-case basis.

    The following punch list items were not required by the FCC:


    +   Surveillance status—Carriers would have been required to send a message to
    a LEA to verify that a wiretap had been established and was functioning correctly.'
