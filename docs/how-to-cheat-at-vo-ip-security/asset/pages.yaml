  md: '# Figure 8.10 Normal NAT Process with TCP


    ![](img/c45efece24bfbfca8be768fba195d8a4_226_0.png)


    Section A of Figure 8.10 shows the TCP/IP packet header prior to NAT. After passing
    through the first NAT edge device (section B), the four header fields are modified:
    the three IP header fields—source address, destination address, and checksum—and
