    particular environment. Many such devices also require user authentication to
    be able to fully access the configuration data. HTTP was first described in RFC
    1945 at HTTP 1.0 by its founder, Tim Berners-Lee. Currently, RFC 2616 is used
    to describe the HTTP 1.1 protocol; however, various others describe additional
    extensions and uses for the HTTP protocol. These include HTTP Authentication (RFC
    2617), Secure HTTP (RFC 2660), and CGI (RFC 3875).


    # HTTP Protocol


    The function of HTTP and its protocol was designed to be very straightforward
    and usable by many applications. When a client wishes to retrieve a file from
    an HTTP server, it simply creates a TCP session with the server and transmits
    a GET command with the name of the requested file (for example, /index.html HTTP/1.1).
    The HTTP server then responds back the appropriate data. The response will be
    either the data requested by the client, or an error message describing why it
    cannot send it. All of the commands within the HTTP protocol are regular ASCII
    text, with each line followed by a carriage return/line feed (CR/LF). In network
    logs, the CR/LF appear as hexadecimal 0x0D0A.


    # HTTP Client Request


    For a client to retrieve data from an HTTP server, it must know the exact filename
    and location to construct an appropriate file request. For most purposes, this
    information is supplied in the form of a uniform resource locator (URL), which
    specifies a particular HTTP server, directory path and file name (for example,
    www.digg.com/) a client wishes to visit this specific page, index.php, it must
    first make a connection to www.digg through DNS, which results in the IP address
    of 64.191.203.30. The client initiates a TCP connection and makes a request of
    GET /faq/index.php HTTP/1.1. This request also includes other information about
    the client, some of which may be required for HTTP 1.1, such as the host. An example
    of a full GET request is:


