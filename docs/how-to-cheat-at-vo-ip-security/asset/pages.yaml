    Last, the section on Unified Management detailed some of your responsibilities
    when designing the monitoring network for your VoIP infrastructure. Many open
    source network-monitoring tools exist that work as well as more expensive commercial
    packages. The tradeoffoff is that the open source tools are usually more difficult
