  md: 'The fundamental security services required for the SIP protocol are: preserving
    the confidentiality and integrity of messaging, preventing replay attacks or message
    spoofing, providing for the authentication and privacy of the participants in
    a session, and preventing denial-of-service attacks. Bodies within SIP messages
    separately require the security services of confidentiality, integrity, and authentication.
    Rather than defining new security mechanisms specific to SIP, SIP reuses wherever
    possible existing security models derived from the HTTP and SMTP space.


    SIP defines a set of security mechanisms that can be used by any SIP client or
    server to share authentication data (see Table 6.1).


    # Table 6.1 SIP Security Mechanisms


    | AUTHENTICATION METHOD | AUTHENTICATION TYPE | CONFIDENTIALITY | INTEGRITY |

    |---|---|---|--|

    | S/MIME | PUBLIC KEY INFRASTRUCTURE | YES | YES |

    | TLS | PUBLIC KEY INFRASTRUCTURE | YES | YES |

    | IPSEC | PUBLIC KEY INFRASTRUCTURE & PSK | YES | YES |

    | HTTP 1.1 DIGEST | PRE-SHARED KEY | NO | NO |


    Since SIP''s syntax is based on HTTP, it reuses HTTP Digest Authentication to
    authenticate endpoints. S/MIME, TLS, and IPSec can also be used to protect components
    of the SIP infrastructure. SIP can use TLS for signaling security between routing
    elements (hop by hop), as well as S/MIME for security of signaling end de. TLS
    is visible to users and other elements using the “sips:” scheme, similar to “https:”.


    The threats in this category rely on the absence of cryptographic assurance of
    a request originator. Attacks in this category seek to compromise the message
    integrity of a conversation and interfere with nonrepudiation. Often the goal
    of these attacks is economic or data theft. These threats demonstrate the need
    for security services that enable entities to authenticate the originators of
    requests and to verify that the contents of the message and control streams have
    not been altered in transit.'
