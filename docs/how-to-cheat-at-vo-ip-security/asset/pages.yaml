    # VoIP Telephony and Infrastructure


    With the introduction of VoIP came a new architectural flexibility that in theory
    can completely distribute PBX functionality across an entire infrastructure. We
    will review concepts in this section and discuss examples of this action, but
    keep in mind that few VoIP solutions take full advantage of every aspect described
