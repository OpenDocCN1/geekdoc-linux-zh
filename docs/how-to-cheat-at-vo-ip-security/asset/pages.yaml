  md: '# Chapter 8 • Logically Segregate Network Traffic


    segregation forces all DoS packets through the ACLs on the layer 3 device. The
    use of packet filtering or stateful inspection at these junctions is also recommended.
    As a side note, user authentication prior to the user''s accessing the telephony
    device will also reduce the possibility of internal DoS attacks.


    # VLAN Security


    VLAN function depends on the presence or absence of tag information. If the integrity
    of the tag information is assured, the logical security afforded by VLANs is legitimate
    as physical security. The key is to certify that tag information originates from
    the appropriate hosts and is unchanged in transit. A number of controls exist
    to verify this information as ARP inspection, DHCP spoofing, VACLs (VLAN ACLs),
    private and dynamic VLANs, port security, and 802.1X admission controls, but implementation
    of these is vendor specific and beyond the scope of this section. Additionally,
    the IEEE 802.1 Working Group has established drafts, particularly 802.1aj, that
    decompose security when two related MACs are in a relay configuration.


    # VLANs and Softphones


    Softphones present a security challenge in VoIP environment, particularly when
    VLANs are employed as a major security control. Several popular softphones (such
    as X-Lite) store encrypted in the Window''s registry even after installation of
    the program. Many softphones contain advertising software that attempts to "phone
    home" with private user information. Host-based IDS or firewall applications have
    limited use in this situation because softphones require that PC-firewalls open
    a number of high UDP ports as part of the media stream transaction. Additionally,
    any special permissions that the VoIP application has within the host-based firewall
    rule set will apply to all applications on that desktop (e.g., peer-to-peer software
    may use SIP by bypassing security policy prohibitions).'
