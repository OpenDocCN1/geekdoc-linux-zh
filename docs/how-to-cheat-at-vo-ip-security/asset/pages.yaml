    # HTTP


    The HyperText Transfer Protocol (HTTP) is one of the most well known, and well
    used, protocols on the Internet. It is the protocol by which Web pages are transmitted
    from Web servers to clients, but it is also used by many other applications to
    send data between-computers. For example, many peer-to-peer clients make use of
    the solid structure of HTTP to transfer data segments of shared files between
    peers. HTTP can be used to transmit both ASCII and binary data between computers.


    HTTP is commonly used in the VoIP community as a way for administrators to remotely
    administer and configure devices. Many network management devices offer a Web-based
    administration panel by which the device can be altered and configured for a'
