  md: '# Appendix C— Regulatory Compliance


    Continuity check tone (C-tone)— Electronic signal would have alerted a LEA the
    facility used for delivery of all content interception failed or lost continuity.


    Feature status— A LEA would have been notified when, for the facilities under
    surveillance, specific subscription-calling services were added or deleted.


    The FCC found that these three capacities, although potentially useful to LEAs,
    were not required by the plain language of CALEA. However, carriers are free to
    provide these capabilities if they wish to do so.


    # DOJ-FBI-DEA Joint Petition for Expedited Ruleaking (March 2004)


    Given CALE''s stated purpose, namely to “preserve law enforcement’s ability to
    conduct lawful electronic surveillance despite changing telecommunications technologies,”
    the DOJ, FBI, and DEA feel that key aspects of the law and its original intent
    were not being addressed by the FCC, carriers, and equipment manufacturers. The
    petition states:


    +   CALEA applies to all telecommunications carriers, and its application is technology
    neutral. Despite a clear statutory mandate, full CALEA implementation has not
    been achieved. Although the Commission has taken steps to implement CALEA, there
    remain outstanding issues that are in need of immediate resolution.


    To resolve the outstanding issues, law enforcement asks the Commission to:


    +   (1) formally identify the types of services and entities that are subject
    to CALEA;


    +   (2) formally identify the services that are considered “packet-mode services”;


    +   (3) initially issue a Declaratory Ruling or other formal Commission statement,
    and ultimately adopt final rules, finding that broadband access services and broadband
    telephony services are subject to CALEA;


    +   (4) reaffirm, consistent with the Commission’s finding in the CALEA Second
    Report and Order, that push-to-talk “dispatch” service is subject to CALEA;'
  merge: -1
  img_proc: true
- pgno: 376
  md: '(5) adopt rules that provide for the easy and rapid identification of future
    CALEA-covered services and entities;


    (6) establish benchmarks and deadlines for CALEA packet-mode compliance;


    (7) adopt rules that provide for the establishment of benchmarks and deadlines
    for CALEA compliance with future CALEA-covered technologies;


    (8) outline the criteria for extensions of any benchmarks and deadlines for compliance
    with future CALEA-covered technologies established by the Commission;


    (9) establish rules to permit it to request information regarding CALEA compliance
    generally;


    (10) establish procedures for enforcement action against entities that do not
    comply with their CALEA obligations;


    (11) confirm that carriers bear sole financial responsibility for CALEA implementation
    costs for post-January 1, 1995 communications equipment, facilities and services;


    (12) permit carriers to recover their CALEA implementation costs from their customers;
    and


    (13) clarify the cost methodology and financial responsibility associated with
    intercept provisioning.


    In general, existing FCC rules are incomplete, inconsistent, or otherwise inadequate
    in these areas and you should expect to see new or clarified regulations from
    the FCC over the next few years that address the DOJ/FBI/DEA concerns. Many of
    these will directly impact VoIP systems design and operational practices with
    carriers.


    # FCC First Report and Order and

    Further Notice of Proposed Rulemaking, (September, 2005)


    In response to the DOJ-FBI-DEA Joint Petition, the FCC ruled that CALEA does apply
    to providers of certain broadband and interconnected VoIP services. From the FCC
    press release:


