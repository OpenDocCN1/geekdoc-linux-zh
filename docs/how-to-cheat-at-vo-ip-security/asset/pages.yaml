- pgno: 12
  md: '# Chapter 1 • Introduction to VoIP Security


    with computer skills is increasing, more automated tools are available, and intrusion,
    or hacking techniques are becoming more widely known via the Internet and other
    media.


    Converged VoIP and data networks inherit all the security weaknesses of the protocol—including
    spoofing, sniffing, denial of service attacks, replay attacks, and message integrity
    attacks. All the legacy application servers serve as adjuncts in converged networks
    (DNS, SNMP, TFTP, etc.) will also be targets of attack as they have been on data
    networks. Viruses and worms will become a real threat to the telecommunication
    infrastructure.


    Hacking will converge as well.

    Unfortunately, even though the overwhelming majority of VoIP calls will occur
    unexpectedly between two or more trusted individuals—in the same way that most
    data sessions take place today—the public will focus on extraordinary examples
    of“the call that went bad.” Our challenge is to restrict these incidents to the
    best of our abilities.


    # What Is VoIP?


    Although VoIP, IP Telephony, and Converged Networks have all slightly different
    definitions, they are often used interchangeably. In this book, we will do the
    same. When using any of these terms, we are talking about the structures and processes
    that result from design and implementation of a networking infrastructure that
    accommodates data, voice, and multimedia communications. Today, it is all about
    voice. There are plenty of examples of streaming video, but the enthusiasm today
    to replace circuit-switched voice with packet-switched voice within the enterprise
    and at home across broadband connections.


    Why is this happening now? IP telephony adoption is ramping up dramatically for
    a number of reasons: traditional PBXs and related telecom equipment that was prepared
    for Y2K is beginning to reach end-of-life; IP switches are cheaper and potentially
    offer more features than traditional PBXs; data system administrators and their
    networks have become more mature, and thus, can support the quality of service
    that VoIP services require; and VoIP technology (particularly the products) have
    gotten better. VoIP is attractive to organizations and to broadband end-users
    as they attempt to derive more value from an infrastructure that is already paid
    for.


    # VoIP Benefits


    What converging voice and data on the same physical infrastructure promise? First,
    we may actually lower costs after all, due to the economies of supporting one
    network instead of two. Organizations also will save money on toll bypass, intralatal
    regional toll toll (also known local toll) charges, and all the “extra” services
    that POTS providers currently bill for.


    ![](img/c45efece24bfbfca8be768fba195d8a4_12_0.png)'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Introduction to VoIP Security • Chapter 1


    VoIP, from a management and maintenance point of view, is less expensive than
    two separate telecommunications infrastructures. Implementation can be expensive
    and painful, but is repaid in form of lower operating costs and easier administration.
    The pace and quality of IP application development is increasing step with VoIP
    adoption. Features that are unavailable on traditional systems, such as "click-to-talk"
    with presence awareness, can be rapidly modified and deployed. One voice encryption,
    which in the past was limited to select organizations, can now be used by anyone
    in a VoIP environment.


    An offered overlooked benefit of converting data and voice that organizational
    directions are often updated and consolidated as part of VoIP deployment process.
    This only enables changes and in itself also makes features as Push Directories
    possible. Push is the capability of application using the WML protocol to send
    content to the telephone. IP transforms the everyday telephone into an applications-enabled
    appliance. The addition of push enhances displays and/or audio to support a variety
    of applications (Web browsing, time reporting, emergency alerts, travel reservations,
    account code entry, announcements, branding via screensaver, inventory lookups,
    scheduling, etc.).


    # Note


    > Presence: Oftimes, when discussing VoIP, the term "presence" is thrown around.
    What is presence? Presence is a system for determining whether or an individual
    is available to communicate. In its simplest form, presence has nothing to do
    with location. In traditional telephony, presence can be determined to some extent
    by the status of the remote handset after a call is attempted. If the remote handset
    fails to go off-hook after eight to 10 rings, then the caller is probably not
    present. A busy tone indicates that the callee is probably present but unavailable.
    A better example of presence is instant messaging (IM). Instant messaging brought
    presence--ability to tell when others are available to chat--the masses. The next
    logical step was to incorporate location into the context of presence. Presence
    as a source of users'' state information has maturing over the past few years.
    In the enterprise the notion of presence is broader. Presence can refer to the
    type of position a person has (for example, management or call center operator),
    their physical and organizational location, and a constellation of other personal
    information.


    Convergence should simply telecommunications management. For example, a single
    management station or cluster can be used to monitor data and voice components
    via SNMP.As mentioned earlier in this chapter, directory management will be simplified
    as well.


