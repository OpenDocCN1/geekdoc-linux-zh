    # # What Is a Penetration/Vulnerability Test?


    These tests or pseudo-attacks are conducted by an objective evaluation team and
    emulate an attack on one or more computer systems to discover ways to breach the
    system''s controls, to obtain sensitive information, to unauthorized services,
    or to simulate damage to the system by denying service to legitimate users. Security
    testing comprises detailed inventory of network assets and a set of controlled
    attacks intended to find vulnerabilities in those network assets. The words attack
    and test are used to mean the same in the context of a security assessment.


    Penetration tests (pen-tests) usually refer to tests against perimeter defenses,
    while vulnerability testing refers to specific systems (host, applications, or
    networks). External attacks are loosely defined as that is launched from outside
    the perimeter of the private network. This kind of testing emulates the threats
    from hacker and other parties and is often concerned with breaching firewalls
    and other forms of perimeter security. On the other hand, for vulnerability testing
    the analyst is located where within the perimeter of the private network and emulates
    the threat experienced from internal staff, consultants, disgruntled employees,
    or in the event of unauthorized physical access or a compromise of the perimeter
    security, a hacker. The general rule of thumb is that internal threats comprise
    more than 60 percent of the total threat portfolio.


    Testing can consist of something as simple as an Nmap or Nessus scan, or it can
    be detailed as tests against a multitiered business application architecture requiring
    months of'
