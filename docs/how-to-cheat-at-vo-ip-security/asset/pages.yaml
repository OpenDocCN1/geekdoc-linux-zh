- pgno: 23
  md: '# Introduction to VoIP Security • Chapter 1


    I said earlier that the purpose of converging voice and data is to save money
    by running both types of traffic over the same physical infrastructure and to
    extend the spectrum of applications that can run over this infrastructure. In
    this architecture, packetized voice is subject to the same networking and security
    issues that exist on data-only networks. It seems to me that as organizations
    transition to this contemporary architecture there exists an uncustomized assumption:
    Users have come to expect and accept short outages and sometimes erratic network
    performance will not accept this type of performance when it comes to voice communications.
    Perhaps this is true, or perhaps. Cellular telephone come to mind here.


    Traditional telephone systems have an excellent track record for reliability,
    and most people never question whether they will receive a tone when they pick
    up their handsets. Contrast this with the reliability of traditional IP networks.
    These same people would never question the reliability of their telephone systems
    are accustomed to IP network outages and outages of systems that connect to the
    IP network. In a converged network, the loss of availability of the underlying
    IP network or the loss of availability of the IP equipment (call management and
    adjunct servers) means the loss of availability of the telephone system.


    Many organizations have reasonably well-secured logical perimeters (in far as
    they can define these perimeters); however, their overall security offers no real
    defense in depth. An enterprise network should offer multiple layers of defense—an
    intruder who manages to bypass one layer should then be confronted with additional
    layers, denying the intruder quick access. On most of these networks, an unauthorized
    user who manages to bypass a logical (and/physical) perimeter security controls
    has essentially unlimited access to all of internal assets on the internal IP
    network.


    Authorized users are also assumed trustworthy; they have essentially unlimited
    access to all assets on the network. The well of network-level security controls
    on the internal IP network exacerbates the risk of either malicious or accidental
    activity, including propagation of viruses and worms.


    Most people associate security attacks with the image of the lone hacker, a highly
    intelligent and motivated individual who attempts to penetrate an organization’s
    IT infrastructure using a public network as the Internet. Although unauthorized
    users do pose some risk to an organization’s IT assets, the most significant IT-related
    risk to most organizations is potential financial loss due to direct or collateral
    damage from a worm or virus.


    This point cannot be emphasized enough. The introduction of VoIP into an organization’s
    IP network exacerbates the potential financial losses from a virus or worm outbreak.
    The key to securing these networks—as we will see throughout this book—is to:


    +   1. Communicate and enforce security policies.


    +   2. Practice rigorous physical security.


    ![](img/c45efece24bfbfca8be768fba195d8a4_23_0.png)'
