    # HTTP Server Response


    Upon receiving a GET request from a client, a server first ensures that the file
    requested does exist. If not, the data is then sent back to the requesting client.
    If an error message is sent. Regardless of the action, a specific server response
    is sent back to the client that includes a status code. This status code informs
    the client of the response type.The most common is a 200 code, which informs the
    client that the file was found and will be sent. It is transmitted in the form
    of HTTP/1.1 200 OK, which indicates the HTTP protocol, the status code, and a
    brief description of the code. Other status codes include "404 Not Found," which
    indicates that the requested file could not be located by the server, and "500
    Internal Server Error," which indicates that there is a problem with the HTTP
    server. The following is an example of an HTTP response:


    ```

    HTTP/1.1 200 OK

    Date: Thu, 13 May 2004 10:17:12 GMT

    Server: Apache

    Last-Modified: Tue, 20 Apr 2004 13:17:00 GMT

    Accept-Ranges: bytes

    Content-Length: 18070

    Keep-Alive: timeout=15, max=100

    Connection: Keep-Alive

    Content-Type: text/html; charset=ISO-8859-1

    ```


    # Security Implications for HTTP


    Due to the simple design of HTTP, and the early state of the Internet when it
    was unveiled, security wasn''t a priority in the protocol. All data sent through
    HTTP was sent as clear text, which allowed any person to be able to sniff the
    traffic flowing across the wire and parse out sensitive data, such as usernames,
    passwords, and network configuration data. This is particularly dangerous since
    VoIP and network management devices use HTTP as a means to allow administrators
    to check the status of the device and to configure additional settings. A person
    with malicious intent on the same network segment as the device could pick out
    various usernames and passwords that may work on additional computers or devices.


    HTTP also supports multiple forms of authentication, which is a means by which
    the HTTP server can verify a user''s identity.The two authentication forms currently
    used are basic and digest authentications. When a server supports authentication,
    it sends a 401 "Authentication Required" response to clients that request sensitive
    data.This response will'
