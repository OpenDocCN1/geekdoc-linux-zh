    with Internet telephony, federating with SIP networks that provide access to an
    ordinary telephone dial tone. Google recently released a library called jibingle
    for programmers, allowing them to hack new functionality into Google Talk. It
    will be interesting to see where Google takes in the future.


    # Video Clients


    Most of us can probably think and recall episodes of The Jetsons when we were
    younger. Pictures of the AT&T PicturePhone from the 1964''s Fair. Movies have
    all but promised these devices to be a staple of every day in the future. And
    for decades, the video conference has been pushed by enterprises seeking to save
    money on travel (though investments in video conferencing equipment tend to sit
    around gathering chat). Live video on the Internet has its adherents, and today
    we see yet another wave of marketing aimed at the use of video. So, will video
    finally take off VoIP just like audio, or is there something different going on
    here?


    The video phone has tomorrow''s next thing for 50 years but the issue has been
    more social than technological. Certainly, popular instant messaging clients have
    included video chat capabilities for some time now, although each client typically
    supports only video between other users of the same client or messaging network.
    And it always gives me a kick to see everyone else that they''ve solved the gap
    with technology, the phone is well taken to here is stay in VoIP systems—even
    if it doesn''t get as much use as VoIP.


    The latest on the video bandwagon is the Skype 2.0 release. At only 15 frames
    per second and 40 to 75 kbps upload and download, Skype Video works well on a
    standard DSL line or better. Other popular IM clients with video include Microsoft''s
    Messenger and Yahoo Instant Messenger. AIM now offers video as well.


    H.323-based IP videoconferencing systems have been available in hardware and software
    from many sources for almost a decade at this point, so there''s no shortage of
    vendors in this space. And SIP phones are available from many of these vendors
    and from startup companies in the SIP space.


