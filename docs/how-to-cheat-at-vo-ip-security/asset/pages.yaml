- pgno: 335
  md: 'Appendix 8 • The IP Multimedia Subsystem: True Converged Communications


    # # Summary


    IMS promises a nice integration of IP and cellular networks. It allows both users
    and operators to take advantage of benefits from both sides. A mobile phone user
    gets comprehensive services available in both cellular network and Internet. At
    the same time, the embedment of QoS (Quality of Service) in the communication
    session improves the preservation of quality. It prevents the users from suffering
    quality degradation. Operators can also benefit from since they have flexible
    control over charging mechanism. They can select the appropriate charging method
    based upon the bandwidth or duration of time, so that they have higher revenue.
    Also the operator can select third-party services on top of the given services
    freely, which allows the operator to provide a variety of service to users.


    IMS enables many feature of convergence services but opens the IP network to security
    vulnerabilities. IMS addresses some security issues like unauthorized use, privacy,
    and density of services. A built-IPsec makes it hard to packet forgery, eavesdropping,
    and IP spoofing and session hijacking. Nevertheless, there is still room for the
    hackers to disrupt the service by layer 2 and 3 DoS attacks and Voice spam attacks.
    Additional security mechanisms like spam blockers IPS are needed to prevent these
    attacks.


