    # VLANs


    Logical separation of voice and data traffic via VLANs is recommended in order
    to prevent data network problems from affecting voice traffic and vice versa.
    In a switched network environment, VLANs create a logical segmentation of broadcast
    or collision domains that can span multiple physical segments. VLANs remove the
    need to organize and manage PCs or softphones based upon physical location, function,
    class of service, class of user, connection speed, or other criteria. The separation
    of broadcast domains reduces traffic to the balance of nature. Effective bandwidth
    is increased by the elimination of latency from router links. Additional security
    is realized if access to VLAN hosts is limited to only hosts on specific VLANs
    and not those that originate from other subnets beyond the router.


    VLANs, or virtual LANs, can be thought of as logically segmented networks mapped
    onto physical hardware. One or more VLANs can coexist on a single physical switch.
    Prior to the- predominant VLAN flavor is IEEE 802.1Q, as defined by the IEEE.'
