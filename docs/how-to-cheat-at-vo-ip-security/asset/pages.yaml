  md: '# Chapter 3 • Architectures


    Perhaps you have ordered and provisioned a voice or data T1 for your company or
    clients. Have you ever thought why only one T1 is needed for a company of 100
    employees with a PBX, knowing that only 24 channels can be used at any one time?
    The answer is that not everyone will be on the phone, receiving a fax, or otherwise
    using an available channel. Normally you can count on a six-to-ten ratio when
    calculating how many DS0s are. Those in sales and service industry may go as low
    as four-to-one because they are on the phone and need higher channel availability.
    With VoIP, sizing access circuits is important, because there are hard limits
    on the amount of data that can be pushed through circuit network, even if the
    number of channels isn''t so important. Less bandwidth might be required if G.729
    was used in place of G.711, but more would be required if the link also supported
    Internet access, especially if Quality of Service (QoS) limitations weren''t set
    up on the corresponding routers.


    In Figure 3.5 we see that the DACS can be used to combine a wide variety of digital
    signal inputs and present them through a single interface to the next hop, which
    might be a switch, multiplexing equipment, enterprise routing equipment, or something
    else. Keep in mind that although both voice and data traffic of any flavor can
    run over SONET, timing requirements won''t allow something like a T1 to run over
