    # Ports Required for Skype


    We''ll now discuss the ports that are required to use Skype.


    # Home Users or Businesses Using a DSL/Cable Router and No Firewall


    To use Skype, typical users will not need to configure anything on their DSL/cable
    routers or within the Skype software.


    # Small to Large Company Firewall Users


    Skype uses UDP and TCP to communicate with other Skype clients. If the UDP ports
    above 1024 are open outbound, and you allow UDP replies to return through the
    firewall, you can improve Skype''s voice quality and performance. Opening UDP
    ports could allow peers on your network to connect more efficiently by providing
    close neighbors on the P2P network


