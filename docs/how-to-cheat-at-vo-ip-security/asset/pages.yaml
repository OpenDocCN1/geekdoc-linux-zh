  md: '# Skype Firewall and Network Setup • Chapter 11 265


    are sent back to the external IP address and port of the NAT router, it translates
    the response and relays it back to the internal address and port that originated
    the request.


    Firewalls are Protocol layer rules engines. A firewall can be hardware or software
    based, and many routers include basic firewall functionality as an additional
    feature. A typical firewall provides a list of rules that are evaluated sequentially
    against the header data in the packet being processed. As each rule is examined
    against the packet header, the packet will be blocked, or the next rule will be
    evaluated. This process continues until the packet is blocked or all rules have
    been examined, in which case the packet is forwarded.


    A proxy server is similar to a firewall, but it works at the Application layer.
    Proxy servers have packet-filtering features. Packet filtering allows examination
    of the actual data transmitted within the packet itself. Packet filters are available
    on Windows XP, Windows 2000, and Windows Server 2003 products as part of the advanced
    features of the TCP/IP integration. However, because Skype encrypts the data it
    transmits, packet filtering is an ineffective means of managing Skype traffic.
    servers handle the requests for each protocol, whereas firewalls merely forward
    the traffic. If the proxy server is disabled, no traffic is allowed to pass. If
    you disable a firewall, you are turning off all rules processing and allowing
    all traffic to pass, which is not a recommended practice.


    In Figure 11.1, a single external IP address is exposed to the Internet. When
    hosts on the private network make a request, the following occurs:


