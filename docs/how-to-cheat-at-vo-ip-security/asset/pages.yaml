- pgno: 271
  md: '# Large Corporations


    Larger corporations must ensure that the many routers used on the LAN allow Skype
    traffic over UDP to pass to other clients on the LAN if they want to use Skype
    effectively.


    To better understand how Skype communicates, you need to get a picture of how
    the Skype network is organized. There are three basic rules in the Skype communication
    infrastructure. The rules consist of the following:


    +   * Skype client or peer

    * Supernodes

    * Login servers


    A Skype client is your computer running the Skype software. Supernodes are just
    Skype peer nodes that are not behind a restrictive firewall or a NAT router, and
    which therefore have unrestricted access to the Internet. Supernodes come and
    depending on the needs of the overall network. Any Skype client node can become
    a supernode if it is not behind a NAT router or blocking firewall and has sufficient
    CPU and bandwidth capacity.


    ![](img/c45efece24bfbfca8be768fba195d8a4_271_0.png)


    If a Skype client is behind a NAT router or firewall, the Skype client cannot
    establish a direct connection to another peer. In these situations, the supernode
    peers act as relaying agents to help Skype peers behind firewalls or NAT routers
    establish connections to other peers that are behind firewalls or NAT routers.
    Skype peers tend to connect to supernodes that are in relative proximity to their
    locations on the Internet. By connecting to nearby supernodes, Skype reduces utilization
    and decreases the latency in response times, thus providing a fast and scalable
    communication network.'
