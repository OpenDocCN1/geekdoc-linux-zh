- pgno: 213
  md: '# Introduction


    One of the principal advantages of converging voice and data is to save and simplify
    administration and management by running both types of traffic over the same physical
    infrastructure. With this in mind, it is ironic that most of the engineering effort
    expended during the VoIP architecture design phase focuses on logically separating
    this voice and data traffic.


    Packetized voice is indistinguishable from any other packet data at Layers 2 and
    3, and thus is subject to the same networking and security risks that plague data-only
    networks. The general idea that motivates the logical separation of data from
    voice is the expectation that network events such as broadcast storms and congestion,
    and security-related phenomena such as worms and Dos attacks, that affect one
    network will not impact the other. This is the principal consequence of compartmentalization.


    In practice, system and security administrators have a number of options to realize
    this logical division. Packet headers can be manipulated in order to separate
    datagrams and datastreams at Layer 2, to provide certain classes of packets with
    preferential treatment or more bandwidth; and to alter source and destination
    IP addresses. Firewalls (particularly VoIP aware), application layer gateways
    (ALGs), routers, and switches are inserted in the datapath to monitor and control
    traffic streams. Many devices now support robust access control lists (ACLs) that
    are used to fine-tune network and application access. Encryption is used to ensure
    data and signal channel authenticity, integrity, and privacy, but the encryption
    process results in subtle and not-so-subtle interactions with the methods that
    manipulate packet headers.


    Maintaining and securing contemporary data and voice networks is complex stuff—something
    not recommended for naive system administrators. The days are gone when works
    could be pieced together in an ad hoc framework in order to support google, e-mail,
    and ftp. Modern VoIP/data networks must be designed to support a sometimes bewildering
    array of applications—all with their own unique service requirements and SLAs—in
    an open, yet secure environment.


    To this end, in this chapter we look at the methods used to segregate voice and
    data into logically isolated networks that run over the same physical infrastructure.
    Figure 8.1 shows the components of this architecture. The primary elements of
    the security architecture are VLANs, QoS scheduling, firewalls, NAT and intelligent
    IP address space management, and ACLs. Encryption also plays a role in this. We
    will look at each of these technologies more in the following sections.


    Figure 8.1 is a diagram of a VoIP/data reference network that illustrates the
    major components involved in logical segregation of network traffic types. At
    the border between the Internet and the internal network, firewalls, ALGs, and
    router-based ACLs provide the first line of defense or security layer against
    illicit traffic and attackers. Within the internal domains, VLANs, QoS, private
    IP addresses, and NAT segregate VoIP traffic from


    ![](img/c45efece24bfbfca8be768fba195d8a4_213_0.png)'
