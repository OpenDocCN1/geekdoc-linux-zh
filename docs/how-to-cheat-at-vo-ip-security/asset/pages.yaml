    # # What You Need to Know about Configuring Your Network Devices


    We''ll now discuss configuring network devices in various environments.


    # # Home Users or Businesses Using DSL/Cable Router And No Firewall


    To use Skype typical home users will not need to configure anything on their DSL/Cable
    routers or with wireless unless they have an older DSL/Cable router that is not
    P2P friendly. Running NAT Check, discussed later in this chapter, and enabling
    the Technical Information in Skype''s Advanced options will help you determine
    if your router is capable of a Skype connection.


    # # Small to Large Company Firewall Users


    To provide the best performance on your network, you will need to tune your network
    to optimize handling of the Skype traffic. Skype leverages the use of UDP to provide
    the best possible quality with your peers. The NAT translation table is a volatile
    table that ages connections to free up room in the routing buffer for new connections.


    It is important that the NAT routers hold the definition for UDP datagrams sent
    from internal for at least 30 seconds. The delay ensures that there is ample time
    provided for a response to the original request initiated by the client. The translation
    table should consistently map the internal host address and port number for UDP
    traffic to be reliably translated from the external address and port to establish
    the communication. UDP has little overhead, but it is prone to lose it because
    it is not guaranteed to be delivered to the destination. Because it has little
    overhead, UDP is a faster method for communications.


    # # TCP and UDP Primer


    TCP requires a threeway handshake to verify that data reaches its destination,
    whereas UDP just sends that data, and does not require acknowledgment of delivery
    (see Figure 11.3). Because UDP does not require any of the overhead of the message
    structure, the messages are smaller, and UDP headers are all the same size. The
    UDP message structure makes the delivery much faster. Establishing communication
    sessions over TCP takes three trips instead of one trip UDP requires. The TCP
    headers are much larger and vary in size, so there is more overhead to process
    each TCP message as well.


    ![](img/c45efece24bfbfca8be768fba195d8a4_273_0.png)'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Figure 11.3 TCP and UDP Connections


    ![](img/c45efece24bfbfca8be768fba195d8a4_274_0.png)


    # NAT vs. a Firewall


    The UDP protocol uses datagrams that are sent to the Target, but are not guaranteed
    to be delivered to the Target. The result is faster communication with compact
    messages.


    Remember, if NAT device translates internal IP addresses to one or more external
    internet addresses. A firewall can also provide NAT functionality and includes
    intelligence to apply rules to the traffic that passes through the firewall. NAT
    devices such as a DSL/cable router may or not have firewall functionality.


    Skype also recommends that the firewall or Internet gateway support packet fragmentation
    and reassembly. Fragmenting the packets allows the stream of data to be broken
    into smaller packets that can be sent simultaneously over multiple ports to the
    destination. This packet fragmentation can dramatically improve quality and performance
    by allowing higher throughput, which in turn allows for more effective bandwidth.
    Some firewalls detect this type of UDP communication incorrectly as port scanning
    and block the host traffic. The result could be a degradation of Skype performance.


    Skype references to a tool called NAT Check by Bryan Ford. The tool can be located
