  md: '# Introduction to VoIP Security • Chapter 1 13


    # Tools & Traps...


    VoIPong is a SIP, H.323, SCCP sniffer utility that can be used to detect and capture
    VoIP calls. With the appropriate tools, VOIPong can dump the conversation to a
    separate wave file. The unfortunately named vomit (Voice over Misconfigured Internet
    Telephones) is an unrelated precursor to VoIPong that can translate tcpdump files
    of Cisco IP telephone sessions. Other tools such as VoIPrack, but these are not
    in the public domain.


    Although this concern is real, in my view, it is not the most important security
    threat VoIP faces, whether they are intentional or unintended, and are the most
    difficult VoIP-related threat to defend against. Amplitude Research (www.amplituderesearch.com)
    reported in 2005:


    +   Companies had their share of network security problems. Virus and worm attacks
    led the list of intrusions to 63 percent of companies reported that they have
    had such problems. Trojan attacks occurred at 58 percent of companies, while 35
    percent they suffered attacks from viruses or worms that were introduced internally.


    Viruses and worms account for more security-related financial damage than all
    other security threats combined. The network traffic generated by these as they
    replicate and seek out other hosts has been shown to wreak havoc on even relatively
    well-secured data networks. Although these, VoIP networks, by their nature, are
    exquisitely sensitive to these types of attacks and should be expected to be affected
    similarly.


    Security administrators can ensure confidentiality using one or several familiar
    tools. Conversations can be encrypted between endpoints or by tunneling conversations
    over VPNs. A PKI or certificate infrastructure, when implemented correctly, guarantees
    the identities of the two parties involved in a conversation and validates message
    integrity. How does this seem administrator guarantee availability when the network
    is under assault from the next incarnation of the Slammer worm? The answer, it
    turns out, is that through careful planning and use of controlled networks, the
    physically connected network can be logically segregated into compartments much
    like the bulkheads in a submarine, so that damage to one compartment is limited
    to only that compartment. Data network problems can be segregated from the VoIP
    network and vice versa. We will talk about this approach in much more detail later
    in the book.


    ![](img/c45efece24bfbfca8be768fba195d8a4_19_0.png)'
