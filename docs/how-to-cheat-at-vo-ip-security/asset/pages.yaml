    H.323 security controls so that, for example, they can be configured with your
    particular existing firewall infrastructure. We''ll discuss H.323 firewall issues
    in Chapter 8.


    # Understanding SIP


    As the Internet became more popular in the 1990s, network programs that allowed
    communication with other Internet users also became more common. Over the years,
    a need was seen for a standard protocol that could allow participants in a chat,
    videoconference, interactive gaming, or other media to initiate user sessions
    with one another. In other words, a set of rules and services was needed that
    defined how computers connect to one another so they could share media and communicate.
    The Session Initiation Protocol (SIP) was developed to set up, maintain, and tear
    down these sessions between computers.


    By working in conjunction with other protocols and specialized servers, SIP provides
    a number of important functions that are necessary in allowing communications
    between participants. SIP provides methods of sharing the location and availability
    of users and explains the capabilities of the software or device being used. SIP
    makes it possible to set up and manage the session between the parties. Without
    these tasks being performed, communication over a large network like the Internet
    would be impossible. It would be like a message in a bottle thrown in the occasion;
    you would have no way of knowing how to reach someone directly or whether the
    person could receive the message.


    Beyond communicating with voice and video, SIP has also been extended to support
    instant messaging and is becoming a popular choice that incorporates in many of
    the instant messaging applications produced. This extension, called SIMPLE, provides
    the methods of setting up a session in the same way as SIP. SIMPLE also provides
    information on the status of users, showing whether they are online, busy, or
    in some other state of presence. Because SIP is used in various methods of communications,
    it has become a widely used and important component of today''s communications.


    SIP was designed to initiate interactive sessions on an IP network. Programs that
    provide real-time communication between participants can use SIP to set up, modify,
    and terminate a connection between two or more computers, allowing them to interact
    and exchange data. The programs that use SIP include instant messaging, voice
    over IP (VoIP), video teleferencing, virtual reality, multiplayer games, and other
    applications that employ simplemedia or multimedia. SIP does not provide all the
    functions that enable these programs to communicate, but it is an important component
    that facilitates communication between two or more endpoints.


    ![](img/c45efece24bfbfca8be768fba195d8a4_88_0.png)'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Architectures • Chapter 3 83


    You could compare SIP to a telephone switchboard, who uses other technology to
    connect you to another party, set conference calls or other operations on your
    behalf, and disconnect when you''re done. SIP is a type of signaling protocol
    that is responsible for sending commands to start and stop transmissions or other
    operations used by a program. The commands sent between computers are codes that
    do such as open a connection to make a phone call over the Internet or disconnect
    that later on. SIP supports additional functions, such as call waiting, call transfer,
    and conference calling, by sending out the necessary signals to enable and disable
    these functions. Just as the telephone operator isn''t concerned with how communication
    occurs, SIP works with a number of components and can run on top of several different
    transport protocols to transfer media between the participants.


    # Overview of SIP


    One of the major reasons that SIP is necessary is in the nature of programs that
    involve messaging, voice communication, and exchange of other media. The people
    who use these programs may change locations and use different computers, have
    several usernames or accounts, or communicate using a combination of voice, text,
    or other media (requiring different protocols). This creates a situation that
    is similar to trying to mail a letter to someone who has several aliases, speaks
    different languages, and could change addresses at any moment.


    SIP works with various network components to identify and locate these endpoints.
    Information is passed through proxy servers, which are used to register and route
    requests to the user''s location, invite another(user) into a session, and make
    other requests to connect these endpoints. There are a number of different protocols
    that may be used to transfer voice, text, or other media, SIP runs on top of other
    protocols that transport data between other components of the network, data can
    be exchanged between these user agents regardless of where they are at any point.


    It is the simplicity of SIP that makes it so versatile. SIP is an ASCII- or text-based
    protocol, similar to HTTP or SMTP, which makes it lighter and more flexible than
    other signaling protocols (such as H.323). Like HTTP and SMTP, SIP is a request-response
    protocol, meaning that it makes a request of a server, and awaits a response.
    Once it has established a session, other protocols handle such tasks as negotiating
    the type of media to be exchanged, and transporting it to the endpoints. The reusing
    of protocols and their functions mean fewer resources are used, and minimizes
    the complexity of SIP. By keeping the functionality of SIP simple, it allows SIP
    to work with a wider variety of applications.


    The similarities to HTTP and SMTP are no accident. SIP was modeled after these
    textbased protocols, which work in conjunction with other protocols to perform
    specific tasks. As we will see later in this chapter, SIP is also similar to these
    other protocols in that it uses Universal Resource Identifiers (URIs) for identifying
    users. A URI identifies resources on


