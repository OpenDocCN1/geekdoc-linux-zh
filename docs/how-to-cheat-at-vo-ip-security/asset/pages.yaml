    # Security Patching and Service Packs


    In this section we''ll put down our thoughts on Best Practices for the application
    and determination of appropriate service packs and security patches for VoIP-related
    client and server computers.


    Service packs correct known problems and provide tools, drivers, and updates that
    extend product functionality, including updates, system administration tools,
    drivers, security updates, and additional components developed after the product
    was released. Service packs often contain many files, and are normally cumulative,
    but not always. Check before you apply the service pack. Normally, service packs
    are packaged for easy downloading and installation. Patches, on the other hand,
    are usually specific to a particular file. Security patches eliminate (hopefully)
    security vulnerabilities. Oftentimes, security patches are released in response
    to the public circulation of exploit code. Service packs and patches are often
    interrelated, and it is important to check that the patch is suitable for a particular
    service pack.


    Before applying any service pack or patch, read all relevant documentation. Schedule
    server outages and be sure to have a complete set of backups available, in case
    a restoration is required. If possible, test the update(s) on noncritical infrastructure
    first. Develop and follow change control procedures. A good change procedure has
    identified an owner, audit trail for any changes, a defined announcement and review
    period, testing procedures, and a well-understood back-out plan. A good rule of
    thumb is: If you don''t have a back-out plan, don''t patch.


    Only patch or update when you have to. It is likely that you have been part of
    a situation where a router or server function failed mysteriously. Typically,
    the vendor response is that you upgrade to a new operating system revision. The
    consequent upgrade results in a number of new, unrelated problems. Murphy’s Law
    dictates that this occurs only on the most critical infrastructure components
    at the most sensitive times. Alternatively, there are examples of a patch for
    one file that damages the functionality of unrelated file.


    ![](img/c45efece24bfbfca8be768fba195d8a4_315_0.png)'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'Validate Existing Security Infrastructure • Appendix A 313


    Test before patching. After patching, Then test again. If possible, monitor the
    updated production servers carefully for the first few days after the update.


    # Supporting Services


    VoIP relies upon an ancillary services as part of the configuration process, as
    means to locate users, for management, and to ensure favorable transport, among
    others. These include DNS, DHCP, LDAP, RADIUS, HTTP, HTTPS, SNMP, SSH, TELNET,
    NTP, and TFT. Other services that modify QoS are also required. We recommend that
    those services that support the VoIP infrastructure be dedicated to that. The
    following sections assume that the support infrastructure is protected from direct
    Internet traffic by a firewall, firewalls, IDS, IPS, or a combination of these.


    # DNS and DHCP Servers


    DHCP is used in VoIP environments to provide an IP address and other relevant
    information such as the gateway location, the subnet mask, the IP address of local
    DNS servers, the name and location of firmware and configuration servers, and
    other options. DHCP relies upon a broadcast mechanism to query for an IP address,
    so be to locate DHCP servers in separate broadcast domains in order to eliminate
    confusing addressing results.


    DHCP services may be susceptible to a Rogue DHCP server attack. During boot-up,
    the IP phone sends a DHCP request for its own IP address and the address of a
    RAS server. Because DHCP replies are not authenticated, a rogue DHCP server can
    reply with erroneous information resulting in, at best, a Denial of Service, and
    at worst, rousing to under the control of the attacker. One solution is to install
    an IDS on the VoIP-related subnets that could detect repeated DHCP requests (these
    are broadcast packets) and determine that an IP phone is having trouble booting.
    Alternatively, methods have been suggested [RFC3118] for authentication of DHCP
    messages. Unfortunately, few devices support these methods.


    ![](img/c45efece24bfbfca8be768fba195d8a4_316_0.png)'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Appendix A • Validate Existing Security Infrastructure


    ports. Another way to think about an ATA that it functions as an FXS to Ethernet
    gateway.


    A ForeignExchange Subscriber (FXS) port is a legacy term for an interface that
    connects to subscriber equipment (telephone, modem, or fax). An FXS interface
    points to the terminal endpoint equipment, and additionally, provides the primary
    services to the subscriber device: Dial Tone, Battery Current, and Ring Voltage.
    You plug your phone into an FXS port.


    The complementary member to an FXS is the ForeignExchange Office (FXO) port. This
    interface receives POTS service, typically from a Central Office (CO). If your
    ATA contains an FXO interface, then you connect this interface to the jack well.


    In May, 2005, a DoS exploit was announced that relied upon specially crafted DNS
    packets to Cisco IPs, ACNS, Unity Express, and ATAs. The only fix for this was
    to upgrade to a fixed software revision. This illustrates the necessity to stay
    informed of current software vulnerabilities, and to maintain some type of regular
    patching/update cycle.


    DNS services have a number of users within a VoIP environment, the most important
    being IP address name resolution. In a simple configuration, DNS services may
    be used to map a URI (Uniform Resource Locator) to one or more IP addresses. VoIP
    technology and infrastructure arrangements play a more central role in converting
    E164 defined phone numbers to IPs via the ENUM framework. One caveat in this arrangement
    is that synchronization and delegation of DNS servers must be managed and maintained
    carefully in order for the system to properly function.


    DHCP and DNS servers should be secured by hardening their respective operating
    systems, and in the case of DNS, ensuring that the BIND daemon is patched and
    up-to-date. Running a recent version of BIND generally means that you are running
    the most secure version of BIND. Additionally, you should disallow queries from
    unauthorized nameservers, ensure that your slave nameservers are allowed to update
    by requesting zone transfers, and BIND should run with least privilege—jailing
    or chroot the BIND daemon is always good. In high security environments it is
    worth using TSIG (transaction signatures) from nameservers to authenticate DNS
    messages (DNS & BIND, Albitz & Liu, 2001 for more detailed information).


    DNS traffic can also be difficult to correctly firewall, DNS traffic runs over
    port 53 TCP or UDP depending on the transaction. The problem is that in recent
    versions of BIND (8 and 9), nameservers, by default, send queries from random
    high-numbered ports to port udp/53 of the resolver (client). Resolvers also send
    their queries from random high-numbered ports to port udp/53 of the nameserver.
    One way to resolve (sorry for the pun) this issue is to allow from any port udp/53
    in both directions in the firewall. However, this is not a particularly elegant
    solution in that the control is not very granular. A better solution is to use
    the query-source option to force BIND to send queries from port 53. This enables
    more stringent control of DNS traffic on the firewall.


    ![](img/c45efece24bfbfca8be768fba195d8a4_317_0.png)'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# LDAP and RADIUS Servers


    LDAP (Lightweight Directory Access Protocol) is a protocol for accessing X.500
    directory services. LDAP is the de facto directory-based authentication, authorization,
    and search requests. An LDAP server is essentially a database optimized for read
    rather than write/read operations. LDAP services provide call routing and subscriber
    information within a VoIP environment. RADIUS (Remote Authentication Dial In User
    Service) is an AAA (authentication, authorization, and accounting) protocol for
    many types of applications ranging from router and switch to subscriber AAA in
    a VoIP environment.


    The LDAP directory stores information about objects on a network and makes this
    information available to applications, users, and network administrators. With
    LDAP, authorized networks can access resources anywhere on the network using a
    single login process. Within the enterprise, LDAP directories often comprise the
    corporate directory. Much of the data in these types of directories is considered
    security-critical data because it includes personal information including usernames,
    passwords, contact information, and, of course, telephone numbers and a conundrum.


    This leads to:The services provided by the LDAP directory server (or more typically,
    a cluster of servers) must be quickly and accessible by anyone or any machine
    with the appropriate login credentials. On this scenario the services must be
    completely inaccessible by any unauthorized user. Complicating this is that properly
    authorized users must be given enough, and only enough, authorization so that
    they can access their cognate data and no other.


    LDAP and RADIUS security tasks include hardening the operating system that the
    service resides upon and restricting access to port tcp/389 (LDAP) and ports tcp/1812
    and tcp/1813 (RADIUS) to only those agents that agree access. Additionally, most
    LDAP implementations provide for native (though complex) access control in the
    form of Access Control Lists (ACLs). Proper configuration of these ACLs is critical
    to securing your LDAP directory server; however, this task must be designed and
    implemented carefully.


    Lastly, LDAP provides no protection against sniffing or other attackers, whereas
    RADIUS provides some protection based on shared secrets. SSL v3 or TLS are recommended
    for securing LDAP data while in transmission. Normally these data are received
    over port tcp/636.


    # NTP


    Time synchronization often is overlooked during the design of network infrastructure.
    On a stand-alone computer or network device as a router or a switch, the which
    is usually based on inexpensive oscillator circuits, can drift by seconds each
    day. Over time, this drift leads to significant variation in the times of different
    network clocks. Why is this important for VoIP infrastructure and security?'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Appendix A • Validate Existing Security Infrastructure


    To begin with, any servers or other networked devices that participate in clusters
    for load balancing or high availability will inconsistently if their clocks are
    not synchronized. Network monitoring services (the next section) rely upon an
    accurate clock for determining the root-cause of network outages or delays. In
    forensic analysis, DHCP leases can be tied to specific workstations if the clocks
    on all machines are accurately synchronized. Directory services require accurate
    clocks. Windows 2000 and Windows 2003 are significant examples of this the default
    authentication protocol (Kerberos v5) for many domain functions use the workstation
    time as part of the ticketing process. Most importantly, from a security point
    of view, any type of logging, particularly if from different hosts are stored
    on a remote server, relies upon accurate timestamps to correlate specific events.


    For these reasons, it is recommended to create a time hierarchy as part of the
    foundation VoIP architecture.


    # SNMP


    SNMP is vital in VoIP networks, particularly for monitoring discrete systems and
    for traffic supervision. In addition, many vendors use SNMP as part of the IP
    telefono configuration process. SNMP traffic, at least for versions 1 and 2, is
    encoded using ASN.1 syntax and BER encoding; it is not encrypted. v3 traffic can
    be encrypted.


    Unfortunately, the default community strings associated with the most common versions
    of SNMP (v1 and v2) are well-known and easily guessed. These community strings
    act as passwords to allow access to the SNMP-managed device. The default read-only
    community string (public) allows a user to browse configuration information regarding
    the device or server. Information gathered in this manner can potentially be used
    to gain further access to the device.


    SNMP messages, like syslog messages, can be stolen by eavesdroppers, and these
    data can be used to determine the state and configuration of networked devices.
    Routers and switches can be reconfigured by the appropriate SNMP commands. Thus,
    it is recommended to use SNMP v3 for monitoring constraints and configuration
    of VoIP networks. If the use of SNMP v3 is not a valid option, due to network
    constraints or a lack of support by networked devices, it is essential to restrict
    SNMP to subnets that are segregated from the Internet and from the balance of
    the network.


    This can be accomplished in a number of ways including VLANs, firewalls, and access
    control lists. These methods are described in more detail in Chapter 8. Note that
    a number of different vendors (Utstarcom, Cisco, and Hitachi, for example) IP
    phones have shipped in the past 18 months with default SNMP read/write strings.
    This allows any remote to read, write, and erase the configuration of an affected
    device. Before you deploy your IP phones, check that the default community strings
    have been replaced by complex passwords. This highlights a key concept in securing
    SNMP on any type of network. Always check for presence of default community strings
    and if they exist, change them to complex strings.


    ![](img/c45efece24bfbfca8be768fba195d8a4_319_0.png)'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# SSH and Telnet


    SSH and Telnet are real-time protocols that are often used by VoIP system administrators
    for normal maintenance and troubleshooting. Telnet is a protocol commonly used
    for remote administration of servers and network devices. A major failing of Telnet
    is that it passes data in clear; it uses no encryption. Usernames and passwords
    used to log into remote devices traverse the IP network unencrypted and are susceptible
    to interception. Although many network administrators believe that this is mitigated
    by the use of a switched network, techniques and tools exist that allow interception
    of switched traffic.


    In the mid 1990s, sniffer software became more readily available (i.e., free),
    system administrators began to search for a secure replacement for Telnet, rsh,
    rcp and so on. SSLnet and SNP (Secure Network protocol) are two examples that
    have failed history. SSH (Secure Shell) became the facto choice for secure communication
    between networked devices. SSH allows an individual to log into another computer
    over a network, to execute commands on the remote machine, and to move files from
    one machine to another (SCP). It provides strong authentication and secure communications
    over insecure channels. A number of free SSH clients exist for both Windows and
    LINUX operating systems, and all servers support the SSH protocol.


    Recently, several versions have been vulnerable to the CRC32 Compensation Attack
    exploit. If you plan to use a version of SSH based upon OpenSSH, be sure to install
    the most up-to-date version available, run ssh protocol 2, and be sure to disable
    the option to drop back to SSH protocol 1.


    The message in this section is: There is no longer a place in any contemporary
    VoIP network for insecure, unencrypted administrative maintenance or troubleshooting
    traffic.


    # Unified Network Management


    Network management tools used on the data network can be used to monitor the entire
    converged infrastructure. It is one of the major advantages of a converged network.
    Existing network management tools may need to be updated to reflect the enhanced
    requirements of VoIP network. If possible, management traffic should be segregated
    to an out-of-band, dedicated management network.


    Proactive management of this complex environment ensures that the quality of voice
    calls will fall within acceptable limits. Voice quality is made up of both objective
    and subjective factors. The objective factors in assessing VoIP quality are delay,
    jitter, and packet loss. Delay is defined as the time it takes a packet to traverse
    the network from the sending node to the receiving node. It is usually estimated
    as the round-trip-time (RTT) divided by 2. jitter is defined as the variance or
    change in delay times. If RTT are greater than 250 to 300 msec, then voice quality
    will suffer. All three measurements are interrelated.'
  merge: -1
  img_proc: true
