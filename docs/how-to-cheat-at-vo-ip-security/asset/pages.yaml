  img_proc: true
- pgno: 64
  md: '# ISDN User Part (ISUP)


    Most countries are using ISUP to handle basic call components. ISUP works by defining
    the protocols used to manage calls between calling and called parties.


    Automatic Number Identification (ANI), or—when it is passed to a subscriber, known
    as Calling Party Identification Presentation (CLIP)—caller ID is passed to the
    PSTN (or back again) through ISDN trunks and displays the calling party''s telephone
    number at the called party''s telephone set during the ring cycle. ANI is used
    for Custom Local Area Signaling Services (CLASS) such as custom ringing, selective
    call forwarding, call blocking, and so on.


    ![](img/c45efece24bfbfca8be768fba195d8a4_64_0.png)


    A number of services aimed at private investigators, collections agencies, or
    law enforcement have sprung up since 2000 to pay-per-call ANI spoofing. The service
    works like this: After setting up, you choose the 10-digit ANI you want Caller
    ID to spoof (the LEC will typically add the business or individual associated
    with the ANI number), plus the target number you want to call, then the service
    calls and initiates the spoofed ANI call to the target number you''ve selected.
    Your target thinks you''re Pizza Hut calling back, or their mother, or whoever—you''re
    spoofing and you''ve fooled them into picking you up.


    What you may not know is that this can be done from any PBX with ISDN trunks that
    can support ANI. Most LECs have no way of validating the ANI you present to and
    happily pass that information over CallerID, whether it''s accurate or not. Note
    that this is different from the "Caller ID spoofing" that can be done after a
    caller picks up on some Caller equipment (with friends, but not very useful if
    the caller decides not to answer). Effectively, ANI spoofing "poisons the well"
    from which Caller ID gets its data.


    Some carriers have suggested that they will crack down on this practice, but since
    no comprehensive DID ownership database is kept across all LECs and CLECs there
    is no current method to verify an ANI in real-time when it''s been presented.


    # Signaling Connection Control Part (SCCP)


    The SCCP is used mainly for translating 800, calling card, and mobile telephone
    numbers into a single pointpoint destination code.'
