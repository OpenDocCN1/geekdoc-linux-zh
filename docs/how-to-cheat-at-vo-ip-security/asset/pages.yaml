  md: '# Chapter 3 • Architectures


    connections (as needed). This helps to reduce the amount of traffic over the lines
    when not needed, expanding the overall capacity of the system.These switches are
    real workhorse for telephone companies (LECs, CLECs, and even IXCs, though they
    can use a Class 4 switch in most cases). A Class 5 switch can handle thousands
    of connections per minute.


    # The Intelligent Network (IN), Private Integrated Services, ISDN, and QSIG


    The model drawn up in the 1980s and 1990s for advanced network functionality is
    the Intelligent Network (IN). Services such as 8XX-number lookups as well as Calling
    Cards, Private Integrated Services Network (PISNs), and many other advanced services
    are all possible through SS7, ISDN, and IN capabilities. PISNs are geographically
    dispersed networks that are connected via leased lines that allow for enhanced
    services such as multi-vendor PBX deployments, Voice VPNs (don''t get confused
    with data VPNs, they are a true private network for voice, just like that provided
    by a PBX), and even certain kinds of VoIP.A Private Integrated Service Network
    Exchange (PINX) lives within a PISN. Another application is with the QSIG protocol,
    which allows PBX products from other vendors to be used transparently to integrate
    all voice networks.


    QSIG (a Q.931 ISDN extension) as a protocol was reached upon since the early to
    mid 1990s. We will talk about ISDN in the next section, QSIG can be used to integrate
    systems even without ISDN. QSIG also leverages DPSS, which was developed prior
    to when the final QSIG protocol was agreed upon. Not used much in U.S. networks,
    DPSS had much of its life in the United Kingdom. Modern networks are using QSIG
    as the means to interconnect voice channels between PBXs while preserving critical
    information about caller and call state in the process.


    ISDN is a common-channel signaling (CCS) solution that works with media or data
    traveling one pair of wires while signaling control is handled over. Remembering
    back to our earlier discussions of the 64 kb in size, a typical ISDN will hold
    23 bearer (B) channels that carry voice and data and one (D) channel that carries
    signaling. All channels are 64kbps, so we have 24, 64-kb channels totaling 1536
    Mbps, or equivalent to a T1 and 30 B channels plus a D channel on an E-1, but
    in each case we lose one channel for signaling. Not only was the distance from
    the central office with ISDN trunks, but the customer also had to implement new
    equipment. This Customer Premise Equipment (CPE) required ISDN terminators in
    order to access the network. Today the use of ISDN in the provisioning and delivery
    of broadband Internet access with DSL and services pricing keeping competitive
    and affordable. Besides its use in the DSL services, ISDN still has an active
    share in providing redundant and emergency data network access to critical services
    and when when higher speed lines or primary access has been disrupted.


    ![](img/c45efece24bfbfca8be768fba195d8a4_62_0.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Architectures • Chapter 3 57


    Over the last 100 years, signaling has moved from operator-assisted modes to loop
    and disconnect modes, from single frequency to multrequency signaling, and now
    to common channel signaling using the ISDN signaling channel.


    # ITU-T Signaling System Number 7 (SS7)


    SS7 (or C7) is an ITU-T (formerly CCITT) standard that defines how equipment in
    the PSTN exchange data regarding call setup and routing. Other ITU-T signaling
    systems are used throughout the world, particularly:


    +   - ITU-T 4, Channel-Associated Signaling (CAS) with a 2VF (voice frequency)
    code in the voice band and 2040/2400 Hz supervisory tone

    - ITU-T 5 CAS with 2VF and a 2400/2600 Hz supervisory tone, plus inter-register
    codes with Multi-Frequency (MF) tones

    - ITU-T [5] R2 is a revision of ITU-T 5 but uses different frequencies


    What sets SS7 apart above all is the fact that it is Common Channel Signaling
    (CCS), not like its predecessors. Throughout the telecommunications industry the
    SS7 can be used for call setup, management and the down, call forwarding, carrier
    identification, toll free, LNP, and other service as implemented by carriers.
    Information passed through SS7 networks are communicated completely out of band
    meaning that signaling and media do not travel down the same path. The SS7 was
    loosely designed around the OSI 7-layer model. Figure 3.6 illustrates its basic
    similarities.


    # Message Transfer Parts 1, 2, and 3 (MTP)


    MTP level 1 is much the same as the physical layer (1) of the OSI. Here the electrical
    and physical characteristics of the digital signaling are addressed.The physical
    interfaces defined here are as we previously discussed DSU and T1. MTP level 2
    takes care of making sure transmissions are accurate from end to end, just like
    the Data Link layer issues such as flow control and error checking are handled
    in the MTP level 2 area. MTP level 3 reroutes calls away from failed links and
    signaling when congestion is present.


    # Telephone User Part (TUP)


    This is an analog system component. Prior to digital signaling the TUP was used
    to set up and tear down calls. Today most countries are using the ISDN User Part
    (ISUP) to handle this requirement.


    ![](img/c45efece24bfbfca8be768fba195d8a4_63_0.png)'
