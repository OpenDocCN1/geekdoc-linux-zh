  md: '# Are You Owned?


    # Consumer Softphone Gotchas


    Many consumer-oriented softphones contain advertising software that "phones home"
    with private user information. Several popular softphones (such as X-Lite) store
    credentials unencrypted in the Window''s registry even after uninstallation of
    the program. Softphones require that PC-based firewalls open a number of high
    UDP ports as part of the media transaction. Additionally, any special permissions
    that the VoIP application has within the host-based firewall rule set will apply
    to all applications on desktop (e.g., peer-to-peer software may use SIP for bypassing
    security policy prohibitions).


    Also consider that malware affecting any other software on the PC can also interfere
    with voice communications. The flip-side is also true—malware that affects VoIP
    software will affect all other applications on the PC and the data services available
    to that (a separate VoIP phone would not require access to file services, databases,
    etc.).


    # IM Clients


    Instant messaging is perhaps the dominant means of real-time communication on
    the Internet today. IM''s roots can be traced back to the Internet Relay Chat
    (IRC) networks, which introduced the chat room concept but did not track online
    presence and reached the popularity of IM. Just as IM is the next logical step
    from IRC, voice chat is the next leap from text-based chat. Most of today''s most
    popular IM clients have included voice functionality, AIM''s Instant Messenger,
    Yahoo! Messenger, and MSN Messenger. Skype opted another approach and created
    a chat client that focuses on voice as the star and chat as an afterthought. Even
    Google joined the award bandwagon, releasing Google Talk. Let''s take a look at
    these clients to see what makes them similar, and what makes them different.


    AIM, AOL''s IM, surely wasn''t the first on the scene, but it has the largest
    base of users. Initial AIM was limited to users of the AOL Internet service, but
    eventually it was opened up to the Internet as a whole. With the addition of a
    proprietary voice capability in late 1999, AOL was a VoIP pioneer of sorts.(although
    voice chat was first available through Mirabilis''s ICQ).Yahoo! Chat aboard the
    voice bandwagon soon after, and Google''s most recent client has included voice
    from the beginning. In 2005, Yahoo announced interoperability with Google and
    MSN (who also has a chat plug-in for messenger that is also used with its Live
    Communication Server product). In addition, Microsoft''s popular'
