    It is helpful to think of 802.1x not as a single protocol but rather as a security
    framework using, and provide security two critical functions—authentication (PSK
    or PKI, for example) and encryption (TLS or AES, for example). Note that 802.1x
    does not define either authentication or encryption methods (in fact these are
    defined largely through this choice of EAP type.


    Until the client is authenticated via 802.1x/EAP access control, the only protocol
    allowed the port to which the client is connected is Extensible Authentication
    Protocol traffic. After authentication is successful, traffic can pass through
    the port.


    # 802.1x/EAP Authentication


    Now we''ll define the terms associated with 802.1x/EAP authentication.


    # Supplicant (Peer)


    This is the other end of the point-to-point link; the end that is being authenticated
    by the authenticator. Generally this term refers to the client in an EAP exchange.


    # Authenticator


    Authenticator is a wireless access point (AP) or switch (NAS—Network Access Server).
    The authenticator maintains the network (WLAN or LAN) in closed state to all unauthenticated
    traffic. It does not authenticate directly, but instead tunnels the extensible
    authentication protocol (EAP) to an authentication server.


    # Authentication Server


    The authentication server performs the actual client authentication and instructs
    the authenticator to allow or reject the supplicant''s traffic. The authentication
    server is typically a RADIUS server.'
