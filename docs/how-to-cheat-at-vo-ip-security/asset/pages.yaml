  md: '# Active Security Monitoring • Chapter 7 205


    In Table 7.4, any vulnerability with a threat index of H1, H2, M1, M2, and L1
    requires immediate attention.


    # Summary


    An appropriate firewall policy can minimize the exposure of your internal networks.
    However, attackers are evolving their attacks and network subversion methods.
    These techniques include e-mail-based Trojan horses, stealth scanning techniques,
    and attacks which bypass firewall policies by tunneling over allowed protocols
    such as ICMP, HTTP, and DNS. Attackers are also getting better at using the ever-growing
    list of vulnerabilities to compromise the few services that are allowed through
    a firewall.


    Firewalls and Access Control Lists require security controls in any enterprise,
    but they are not sufficient in contemporary networks. Active monitoring of the
    network and attached devices provides not only one or more additional layers of
    defense, but also supplies data that may have a forensic utility. Active monitoring
    senses the following types of activities: network monitoring, network intrusion
    detection, host-based intrusion detection, syslog, and SNMP logging. Penetration
    and vulnerability testing monitors and validates existing controls.


    On enterprise networks, network monitoring is typically managed by a comprehensive
    tool suite such as OpenView. Traffic patterns and quantities, and device state
    are common measures. These tools supply data that can be useful to security administrators,
    particularly when combined with the results of recent penetration/vulnerability
    tests or with NIDS/HIDS data. Unfortunately, the correlation of these data is
    difficult even when using tools such as SMARTS (a root-cause correlation engine),
    because of the overwhelming amount of data that must be organized.


    NIDS and HIDS are complementary intrusion detection technologies. NIDS monitors
    the network for malicious or unauthorized traffic and HIDS monitors critical for
    changes to significant files and directories. Relay event data to a central management
    console for logging and visualization. Current NIDS use a combination of signature
    (pattern or regex) and anomaly-based detection. Both of these methods have benefits
    and drawbacks. Signature-based detection is quick, effective, and powerful, but
    it won''t catch attacks that have no signatures. Anomaly detection is theoretically
    a better method for detecting attacks, but suffers from the basic problem that
    it is difficult to define “normal” traffic on a network.


    Although functionally dissimilar, SNMP and syslog provide transport for event
    messages from the network or endpoints to a centralized information repository.
    SNMP is a highly structured, binary-formatted message type, while syslog messages
    are ASCII-based and relatively arbitrary within the confines of three defined
    fields. Neither protocol is encrypted. Thus, SNMP and syslog messages should always
    be limited to a constrained management network.


