    # Other Considerations


    Don''t assume that VoIP runs over IP it is considered to be “transmission via
    electronic media” by HIPAA. Within HHS General Administrative Requirements there
    is an official statement defining that:


    > Certain transmissions, including of paper, via facsimile, and of voice, via
    telephone, are not considered to be transmissions by electronic media, because
    the information being exchanged did not exist in electronic form before the transmission


    In general this excludes VoIP from HIPAA so long as the transmission is not recorded.
    Recording is the critical distinction. Within that section HHS notes:


