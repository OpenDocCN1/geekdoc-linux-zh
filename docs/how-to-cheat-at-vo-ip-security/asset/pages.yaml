    # VoIP Isn’t Just Another Data Protocol


    IP Telephony utilizes the Internet architecture, similar to any other data application.
    However—particularly from a security administrator’s point-of-view—VoIP is different.
    There are three significant reasons for this:


    +   - Voice conversations can be initiated from outside the firewall. Most client-driven
    protocols initiate requests from inside the firewall. Figure 1.1 shows the basic
    message flow of a typical Web browsing, e-mail, or SSH session.

    - The real-time nature of VoIP—get there a second too late, the packet is worthless.

    - Separation of data and signaling. Sessions, particularly unknown inbound sessions,
    that define addressing information for the data (media) channel in a discrete
    signaling channel do not interact with NAT and encryption.


    In Figure 1.1, a request is initiated by a client on the internal side of the
    firewall to a server daemon residing on an external host to the firewall. Firewalls
    are capable of stateful inspection which monitor the connection and inbound ports
    that port is associated with an established session. Application Layer Gateways
    (ALGs) will behave in a similar manner, proxying outbound and inbound connections
    for the requesting internal host. For the firewall administrator and the user,
    the session completes normally, and is as secure as the firewall’s permissions
    allow.


    ![](img/c45efece24bfbfca8be768fba195d8a4_15_0.png)'
  merge: -1
  img_proc: true
