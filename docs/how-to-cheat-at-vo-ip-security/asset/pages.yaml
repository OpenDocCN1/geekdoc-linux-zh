  md: '# Active Security Monitoring • Chapter 7 201


    code review and application testing. The ground rules for testing define successful
    completion.Testing is successfully concluded with:


    +   - A defined number of flaws are found.

    - A set level of penetration time has transpired.

    - A dummy target object is accessed by unauthorized means.

    - The security policy is violated sufficiently.

    - Money and resources are exhausted.

    - Internal resources are accessed.

    - Transaction data is captured.

    - A particular program or transaction is executed.

    - Access is gained to any user account.

    - Access is gained to a root/administrative account.

    - Network management systems are subverted.

    - The ability to remotely control resources is demonstrated.


    # Methodology


    The team should thoroughly investigate target systems and networks in a structured
    manner, documenting their findings as they proceed. The goal is to attempt to
    identify all the significant vulnerabilities on the network—including their location
    and implications—and recommendations for securing the affected systems. Testing
    results in a comprehensive, operational review or “snapshot” of the state of the
    network. Testing should include an analysis of the external network from the perspective
    of an outside hacker, and/or a review of the internal network from the perspective
    of a disgruntled employee or contractor.


    # Discovery


    The discovery process takes advantage of publicly available information that relates
    to your organization. Internet search engines, Who databases, network registrars,
    DNS servers, and company Web sites are all sources of information. This phase
    can yield data that your organization might wish to protect. Table 7.1 lists a
    number of recommended tools used during the discovery phase. All of these are
    either native UNIX tools or freeware, with the exception of WSPingPro.


