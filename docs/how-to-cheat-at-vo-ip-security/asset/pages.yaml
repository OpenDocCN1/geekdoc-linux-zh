- pgno: 201
  md: '# Host-Based Intrusion Detection Systems


    Host-based intrusion detection systems (HIDS) are applications that operate on
    information collected from individual computer systems. This vantage point allows
    an HIDS to analyze activities on the hosts it monitors at a high level of detail;
    it can often determine which processes and/ users are involved in malicious activities.
    Furthermore, NIDS are privy to the outcome of an attempted attack they can directly
    access and monitor the data files and system processes targeted by these attacks.


    Tripwire (the reference model for many of the following on HIDS) is described
    in more detail in the "Server Hardening" section of Appendix A. Tripwire operates
    on MD5 hashes of critical files, as defined by the system administrator. It is
    one model for host-based intrusion detection—like the secret agent trick of putting
    a hair on the doorknob to know if somebody’s been changing things your system—but
    only after this occurs.


    Alternatively, HIDS can utilize information from two types: operating system audit
    trails, and system logs. Operating system audit trails are generally generated
    at the innermost (kernel) level of the operating system, and are therefore more
    detailed and better protected than system logs. System logs are much obtuse and
    much smaller than audit trails, and are far easier to comprehend.


    Most HIDS software, like Tripwire, establishes a "digital inventory" of files
    and their attributes as baseline for monitoring any system changes. The "inventory"
    is usually a file containing MD5 checksums for individual files and directories.
    This must be stored offline on a secure, read-only medium that is not available
    to an attacker. On a server with no read-only media (a blade server, for example),
    one method to achieve this is to store the statically compiled intrusion detection
    application and its files on a remote computer. When you wish to run an HIDS report,
    SCP (secure copy) the remote files to /tmp (or its equivalent) on the target server
    and run them from there. When you modify any of the files, rerun the application,
    and make a new data set, which should be stored on the remote computer.


    HIDS surveillance is especially important for VoIP media, proxy, and registration
    servers and should be considered as part of the initial installation package.
    Indeed, vendors such as Cisco comes with every Call Manager license, and Avaya
    Media servers with a Web-enabled version of Tripwire installed and preconfigured.


    The downside to HIDS is that clever attackers who compromise a host can attack
    and subvert host-based HIDSs as well. HIDS cannot prevent DoS attacks. Most significantly,
    a host-based IDS consumes processing time, storage, memory, and other resources
    on the hosts where such systems operate. HIDSs that operate in a client-server
    mode (most of them) can also add to network traffic congestion.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Active Security Monitoring • Chapter 7 197


    # Logging


    Interestingly, when discussing system logging, tired metaphors seem most apt.
    System log information “is a goldmine” of useful information, but searching through
    this data is “like trying to find a needle in a haystack.” Tired metaphor or not,
    the preceding statement is true. Time-stamped logs generated by servers, gateways,
    firewalls, routers, and switches often contain invaluable-related information,
    but system administrators are normally overwhelmed with other maintenance and
    configuration chores that analyses of these logs are disregarded. The key to successful
    logging is to adopt the proper tools for your environment to automatically parse,
    visualize, and report log data. For example, many organizations utilize MRTG (Multi
    Router Traffic Gather—http://people.ee.ethz.ch/~oetiker/webtools/mrt/) to visualize
    router and switch SNMP data.


    # Syslog


    In its most simplistic, the syslog protocol provides a transport to allow a machine
    to send event notification messages across IP networks to event collectors—also
    known as syslog servers. Syslog is an odd protocol that was implemented on many
    platforms before the protocol was ratified by the IEEE in RFC3164. Rather than
    begin by defining the protocol, RFC3164 starts with “This document describes the
    observed behavior of syslog protocol."


    Syslog messages UDP/514 for transport, including the possibility of losing packets
    and never noticing, and also making it easy for anybody to forge fake packets,
    either to insert log events, or to flood the server. Syslog, at this time, does
    not provide for encryption, so the messages are sent in the clear and can be sniffed
    by anyone on the wire. Recently, a proposed draft has been submitted that describes
    a mechanism to add origin authentication, message integrity, replay-resistance,
    message sequencing, and detection of missing messages, but this is not commonly
    implemented. Several of the popular syslog replacements (including syslog-ng)
    use TCP for reliable delivery, and add a checksum and/or cryptographic signature
    to each log event.


    Syslog is native on UNIX platforms, but is not natively available on Microsoft
    Windows. The most common Windows syslog daemon is Kiwi Syslog (www.kiwisyslog.com).


    Syslog messages (ASCI-based) may be sent to logs, a local console, a remote syslog
    server, or a remote relay server. The facility collects messages and records them
    normally in log files /var/log. A facility is defined as a subsystem that generates
    messages. What is recorded and where it is placed depends on the facility configuration
    file (syslog.conf). Syslog also uses severity (or priority) to classify log messages
    by importance. The severity levels, from least to most important, are:


    www.synergy.com'
