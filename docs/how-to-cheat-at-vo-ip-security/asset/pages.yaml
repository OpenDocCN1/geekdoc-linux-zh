    +   - 5 = ONHOLD - call is placed on hold by you.


    +   - ?? FINISHED - call is finished.


    +   - ?? MISSED - call was missed.


    +   - 8 = REFUSED - call was refused.


    +   - 8 = BUSY - destination was busy i.e. pressed hang up button.


    +   - 10 = ONHOLD - call is placed on hold by other party.


    +   - 13 = CANCELED (Protocol 2)


    +   - ObjID: Ignore this information as it is not important.


    +   - Codec: ISAC is most commonly used (G729 and iLBC are also common)


    +   - Jitter: Network administrators need to look at jitter. Jitter varies in
    the time between each of the delivered packets of data arriving from the source
    to the destination. This could induce a bandwidth bottleneck or heavy traffic
    from the source causing some packets to arrive sooner than others. The common
    method for reducing jitter is to buffer data at the destination.


    +   - Packet Loss: Network administrators need to be aware of packet loss. This
    is the total percentage of packets that do not make it to or from each party in
    the conversation. This should be low, but will be something if you are using UDP,
    since delivery is not guaranteed.


    +   - Send packet loss: Network administrators should pay attention to this setting.
    This indicates how much data is not making it to the destination party in the
    call. If the Send packet loss is high, it means that something is causing the
    packets from getting to the remote client.


    +   - Recv packet loss: Network administrators should pay attention to this setting.
    This indicates how much data is not making it from the other party in the call.
    If the Receive packet loss is high, it means that something is preventing the
    packets from getting to you from the remote client.


    +   - Roundtrip: Network users and administrators can get information from this.
    The higher the number, the longer it takes for your voice to get to the other
    party and back. This should be low, and anything about 300ms starts to get choppy,
    reducing call quality. Look at SessionOut and SessionIN, or run NAT Check to determine
    why you are relating.


    +   - BM:This is related to the bandwidth and quality of the audio and is not
