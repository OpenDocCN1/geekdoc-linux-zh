- pgno: 14
  md: '# Chapter 1 · Introduction to VoIP Security


    # VoIP Protocols


    Two major VoIP and multimedia suites dominate today: SIP and H.323. Others (like
    H.248) exist, and we will discuss some of them in this book, but these are the
    two major players. For simplicity, I will define SIP and H.323 as signaling protocols.
    However, whereas H.323 explicitly defines lower level signaling protocols, SIP
    is really more of an application-layer control framework. The SIP Request line
    and header field define the character of the call in terms of services, authentication,
    and protocol features.


    Media transport is almost always handled by RTP and RTCP, also proposed and ratified
    by the IETF (and SCTP (Stream Control Transmission Protocol) is used for the IP
    version of SS7, known as SIGTRAN). The transport of voice over IP requires a large
    number of supporting protocols that are used to ensure quality of service, provide
    video resolution, firmware and software upgrades, synchronize network clocks,
    efficiently route calls, monitor performance, and allow firewall traversal. We
    will talk about these and others in detail in Chapter 4.


    SIP is a signaling protocol for Internet conferencing, telefono, presence, event
    notifications, and instant messaging. SIP is an IETF-ratified response-request
    protocol whose message flow closely resembles that of HTTP. SIP is a framework
    in which its sole purpose is to establish sessions. It doesn''t focus on other
    details. SIP messages are ASCII encoded. A number of open source SIP stacks exist.


    H.323, on the other hand, is an ITU protocol similar in philosophy to SS7. The
    H.323 standard provides a foundation for audio, video, and data communications
    across IP-based networks, using the Internet. The H.323 protocols are compiled
    using ASN.1 PER (Packet Encoding Rules)—a subset of BER—is a compact binary encoding
    that is used on limited-bandwidth networks. Also, unlike SIP, H.323 explicitly
    defines almost every aspect of call flow. The only source H.323 stack I am aware
    of is the OpenH323 suite.


    Both protocols rely upon supplementary protocols in order to provide ancillary
    services. Both protocols utilize TCP and UDP, and both open a minimum of five
    ports per VoIP session (calling, two RTP, and two RTCP). Both protocols offer
    comparable features, but they are not directly interoperable. Carriers tend to
    prefer H.323 because the methods defined by H.323 make translation from ISDN or
    SS7 signaling to VoIP more straightforward than for SIP, on the other hand, is
    text-based, works better with IM, and is typically implemented on less expensive
    hardware. H.323 has been the market leader, but SIP is displacing H.323.


    In Table 1.2, many of the more recent protocols that you will find in a VoIP environment
    are listed. We will talk about these and others in detail in Chapters 4 and 8.'
