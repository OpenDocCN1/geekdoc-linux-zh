    # Tools & Traps...


    # Core CALE-Compliance Issues for IP Communications Systems


    Unlike regulations like HIPAA, GLBA, or SOX, in CALE there is more focus on equipment
    capabilities and standards as part of CALEA compliance. Know which standard to
    apply (with J-ST-025B or T1.678 for VoIP). Retrofitting a compliant solution over
    a noncompliant system can be difficult and expensive for VoIP, so if you are required
    to comply with CALEA, make sure your equipment (software) supplier evaluation
    / procurement process adequately screens for CALEA support, and be sure to stay
    on top of FCC filings (and the latest FCC orders, since VoIP rules under CALE
    are still being worked out). Consider filing a comment with the FCC if you''re
    reading this early in the rulemaking process.


    # CALEA Compliance and Enforcement


    In general, the FCC (with input from the DOJ and FBI) is responsible for compliance
    (although there are minor aspects of CALEA that the DOJ can enforce directly).


    # Certification


    Individual LEAs can be CALE-certified, but in general that term isn''t applied
    to equipment or carriers. Equipment sold to carriers can (and should) be CALEA
    Section 100-compliant in the sense that it meets a standard accepted by the FCC
    (and/or FBI in some cases where a technical standard hasn''t been adopted by the
    FCC regulations). Use of CALEA-compliant equipment by a carrier will bring Section
    107 Safe Harbor provisions into play that service to is CALEA-compliant. However,
    it is a carrier and associated service that can be certified as compliant, by
    meeting Section 103 requirements directly with the agreement of the FBI (these
    have been phased out as technical standards now fill the gap that once required
    this FBI consent) or by meeting FCC mandates and Filing directly with the FCC
    for certification.'
