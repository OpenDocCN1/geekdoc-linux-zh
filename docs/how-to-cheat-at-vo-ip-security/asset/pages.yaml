  img_proc: true
- pgno: 391
  md: '(a) on a temporary basis, upon application of a subscriber requesting the tracing
    of malicious or nuisance calls; in this case, in accordance with national law,
    the data containing the calling subscriber will be stored and be made available
    by the provider of a public telecommunications network and/or publicly available
    telecommunications service;


    (b) on a per-line basis for organizations dealing with emergency calls and recognized
    as such by a Member State, including law enforcement agencies, ambulance services
    and fire brigades, for the purpose of answering calls.


    # Article 10 - Automatic call forwarding


    Member States shall ensure that any subscriber is provided, free of charge and
    via a simple means, with the possibility to stop automatic call forwarding by
    a third party to the subscriber''s terminal.


    # Article 11 - Directories of subscribers


    +   1. Personal data contained in printed or electronic directories of subscribers
    available to the public or obtainable through directory enquiry should be limited
    to what is necessary to identify a particular subscriber, unless the subscriber
    has given his unambiguous consent to the publication of additional personal data.
    The subscriber shall be entitled, free of charge, to be omitted from a printed
    or electronic directory at his or her request, to indicate that his or her personal
    data may not be used for the purpose of direct marketing, to have his or her address
    omitted in part and not to have a reference revealing his or her sex, where this
    is applicable linguistically.


    +   2. Member States may allow operators to require a payment from subscribers
    wishing to ensure that their particulars are not entered in a directory, provided
    that the sum involved is reasonable and does not act as a disincentive to the
    exercise of this right.


    +   3. Member States may limit the application of this Article to subscribers
    who are natural persons.'
