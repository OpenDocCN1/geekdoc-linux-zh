    The management console (MC) hardware requirement is normally stricter than that
    of the sensor since the MC is responsible for data correlation from multiple sensors,
    as well as storage, alerting, and visualization. Often, the MC also includes an
    integrated sensor.


    # Types


    NIDS are normally classified according to the methods they use for attack detection;
    either signature-based, or anomaly detection. Note, though, that almost all current
    NIDS use a mixture of these approaches. Signature-based approaches, as mentioned
    earlier in this chapter, rely on some type of pattern matching. NIDS sensors parse
    the IP packet, and make decisions by means of a simple rule-based logic that is
    based upon signatures or regular expression matching. In other words, they compare
    the data within a packet payload to a database of predefined attack signatures
    (a string of bytes). Additionally, statistical or historical algorithms may supplement
    static pattern matching. Attack signatures usually consist of one or more of the
    following:


    +   - Source and destination IP addresses, or an address or range


    +   - TCP/UDP source and destination ports and ICMP type/code


    +   - IP header flags and options'
