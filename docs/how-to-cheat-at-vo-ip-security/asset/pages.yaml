- pgno: 219
  md: '# QoS and Traffic Shaping


    VoIP has strict performance requirements. The factors that affect the quality
    of data transmission are different from those affecting the quality of voice transmission.
    For example, data generally is not affected by small delays. The quality of voice
    transmissions, on the one hand, is lowered by relatively small amounts of delay.
    VoIP call quality depends on three network factors, as mentioned earlier:


    +   - **Latency** The time it takes for a voice transmission (or any transmission)
    to travel from source to destination is increased as packets traverse each security
    node. Primary latency-producing processes are firewall/NAT traversal, negotiation
    of long ACLs, and traffic encryption/decryption.

    - **Jitter** the erratic delays) Jitter may be increased, because in circumstances,
    jitter is a function of hop count

    - **Packet loss** The number of non-QoS-aware routers and firewalls that ignore
    or fail to properly process Type of Service (ToS) fields in the IP header can
    influence packet loss.


    In the absence of QoS or Traffic shaping, data networks operate on a best-effort
    delivery basis, which means that all traffic has equal priority and an equal chance
    of being delivered in a prompt manner. However, when network congestion occurs,
    all traffic has equal chance of being dropped and/or delayed. When voice data
    is introduced into a network, it becomes critical that priority is given to the
    voice packets to ensure the quality of voice calls. The mechanisms used to accomplish
    this are generally referred to as traffic shaping.


    Traffic shaping is an attempt to organize network traffic in order to optimize
    and guarantee performance and/or bandwidth. Traffic shaping relies upon concepts
    as classification, queue disciplines, scheduling, congestion management, quality
    of service (QoS), class of service (CoS), and fairness.


    Common models use the Differentiated Services Code Point (DiffServ or DSCP, defined
    in RFC 2474 and others) IEEE 802.1Q/p specifies that each packet is classified
    upon entry into the network. The classification is carried in the IP packet header,
    using 6 bits from the deprecated IP type-of-service (ToS) field to carry the classification
    (code point) information, which ranges from 0 through 63. Generally, the higher
    number equates to higher priority.


    802.1Q defines the options for VLAN tagging. Twelve of the 16 bits within the
    two Tag Control Information bytes are used to tag each frame with a VLAN identification
    number. 802.1p uses three of the remaining bits (the User Priority bits) in the
    802.1Q header to assign one of eight different classes of service (0 = low priority;
    8 = high priority).'
  merge: -1
  img_proc: true
