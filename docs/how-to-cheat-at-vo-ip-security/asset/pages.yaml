- pgno: 91
  md: '# SIP and Mbone


    Although RFC 2543 and RFC 3261 define SIP as a protocol for setting up, managing,
    and tearing down sessions, and was designed for the Multicast Backbone (Mbone).
    Mbone originated as a method of broadcasting audio and video over the Internet.
    The Mbone is a broadcast channel that is overlaid on the Internet, and allowed
    a method of providing Internet broadcasts of things like IETF meetings, space
    launches, live concerts, and other meetings, and events. The ability to communicate
    with several hosts simultaneously allowed a way of inviting others into sessions;
    the Session Invitation Protocol (as it was originally called) was developed in
    1996.


    The Session Invitation Protocol was a precursor to SIP that was defined by the
    IETF MMUS working group, and a primitive version of the Session Initiation Protocol
    used today. However, VoIP and other methods of communications became more popular,
    SIP evolved into the Session Initiation Protocol. With added features the ability
    to tear down a session, it was still lightweight than more complex protocols like
    H.323. In 1999, the Session Initiation Protocol was defined as RFC 2543, and became
    a vital part of multi-media applications used today.


    # OSI


    In designing the SIP standard, the IETF mapped the protocol to OSI (Open Systems
    Interconnect) reference model. The OSI model is used to associate protocols to
    different layers, showing their function in transferring and receiving data across
    a network, and their relation to existing protocols. A protocol at one layer uses
    only the functions of the layer below it, while exporting the information it processes
    to the layer above it. It is a conceptual model that originated to promote interoperability,
    so that a protocol or element of a network developed by one vendor work with others.


    As seen in Figure 3.19, the OSI model contains several layers: Application, Presentation,
    Session, Transport, Network, Data Link, and Physical. As seen in this figure,
    communication starts at the Application layer and works its way down through the
    layers by step to the Physical layer. The information then passes along the cable
    to the receiving computer, which starts the information at the Physical layer.
    From there it steps back up the OSI layers to the Application layer where the
    receiving computer finalizes the processing and sends back an acknowledgement
    if needed. Then the whole process starts over.'
  merge: -1
  img_proc: true
