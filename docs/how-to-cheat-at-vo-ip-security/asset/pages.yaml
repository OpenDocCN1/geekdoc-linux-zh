    # NOTE


    Although we''re not going to do a deep dive on digital/analog conversion between
    U.S. and European standards will mean that slight differences between some conversion
    need to take place within a standard G.711-encoded channel in order for that to
    move from a T1 to an E1 or versa. Slight differences in PCM encoding algorithm
    (μ-law vs. A-law) may require conversion when voice or VoIP cross international
    boundaries. Of course, on a data circuit, that conversion is not going to happen
    automatically (if it did, it would scramble the data). But it can cause problems
    across a VoIP if you''re not careful.


    Similarly, when using a T1 circuit for data it''s important to make sure the circuit
    is properly configured since signaling modes can use what''s "robbed-bit" signaling,
    which is fine for circuit-based voice but will corrupt data running on it. For
    this reason, only 56K of the 64K channel could be used for data on early data
    circuits. Today, channel data can be provisioned that uses a full 64K.


    Back to the code exec, however. It''s worth pointing out that very complex trade-offs
    exist in code selection and they''re not simple as quality vs bandwidth. Some
    codecs require much more processing, others work poorly with modems, faxes, and
    other nonce applications (particularly low bandwidth codecs: it''s not hard to
    imagine the problems inherent in sending a 56 Kbps modem signal through a 4kbps
    voice-optimized codec). Even the best compression algorithms would struggle to
    represent in so few bits, not to mention the inherent distortion present in D/A-A/D
    conversion.


    With the introduction of the T1, timing becoming an important consideration for
    the PSTN. Digital circuits like the T1 must be pleochronous, meaning that their
    bit rate must vary only within a fairly limited range or problems can be created
    within the PSTN. In comparison, analog circuits are completely asynchronous. This
    requirement has forced a hierarchy of master clocks to be incorporated into its
    infrastructure.


    With the advent of SONET, a fully synchronous solution to the timing problem has
    arrived, with massive bandwidth that can be further enhanced with Wavelength Division
    Multiplexing (WDM)—basically the use of different colored light on a single optical
    fiber to increase capacity).ointers and bit-stuffing in SONET and SDH are used
    to minimize the impact of clock drift between digital circuits, the advent of
    VoIP has


