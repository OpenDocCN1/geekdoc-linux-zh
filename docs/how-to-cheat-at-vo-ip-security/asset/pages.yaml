- pgno: 111
  md: 'agents act as clients who request resources, servers that respond to those
    requests and provide resources. Because resources are not located on a single
    machine or a small group of machines acting as network servers, this type of network
    is also referred to as being decentralized.


    When a network is decentralized P2P, it doesn''t rely on costly servers to provide
    resources. Each computer in the network is used to provide resources, meaning
    that if one becomes unavailable, the ability to access files or send messages
    to others in the network is unaffected. For example, if one person''s computer
    at an advertising firm crashes, you could use SIP to communicate with another
    person at that company, and talk to them and have files transferred to you. If
    one computer goes down, there are always others that can be accessed and the network
    remains stable.


    In the same way, when user agents have initiated a session with one another, they
    become User agents and User servers to one another, and have the ability to invite
    additional participants into the session. As seen in Figure 3.23 each of these
    User agents can communicate with one another in an audio or video conference.
    If one of participants ends the session, or is using a device that fails during
    the communication, the other participants can continue as if nothing happened.
    This architecture makes communication between User agents stable, without having
    to worry about the network failing if one computer or device suddenly becomes
    unavailable.


    # Figure 3.23 Once SIP Has Initiated a Session, a Peer-to-Peer Architecture Is
    Used


    ![](img/c45efece24bfbfca8be768fba195d8a4_111_0.png)


    # Instant Messaging and SIMPLE


    Instant messaging (IM) has long been one of the most common and popular methods
    of communicating over IP networks. Whereas VoIP uses voice communication and videoconferencing
    uses images and sound, IM uses text messages to allow participants to converse.
    These text messages are sent in real-time between the users who use the same IM
    application, and allows an individual to essentially create a private chat room
    with another individual where they can send text messages to one another. Many
    applications will even provide the'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Chapter 3 • Architectures


    ability to add additional participants to the chat, creating a text-based conference
    room of multiple users.

    To manage the messages and identify whether specific users are online, an extension
    of SIP for instant messaging has been developed. SIMPLE is an acronym that stands
    for the Session Initiation Protocol for Instant Messaging and Presence Leveraging
    Extensions. Although the name is ironically less simple to remember, it is developed
    as an open standard for how individuals can determine the status of a person (i.e.,
    whether they are online, busy, etc.), and for managing the messages that go back
    and forth between the participants in a chat.


    # Instant Messaging


    In different variations, instant messaging has been around longer than the Internet
    has been popular. In the 1970s, the TALK command was implemented on UNIX machines,
    which invoked a split screen allowed users of the system to see the messages they
    typed in individual screens. In the 1980s, Bulletin Board Systems (BBSes) became
    popular, where people would use a modem to dial into another person''s computer
    to access various resources, such as message boards, games, and file downloads.
    On BBS, the system operator (SYSOP) could invoke a chat feature that allowed the
    SYSOP to send messages back and forth with the caller on a similar split-screen.
    If BBS had multiple lines, the callers could instant message with each other while
    they were online. As the Internet gained popularity, the ability to exchange messages
    with other users became a feature that was desired and expected.

    Today there are a large number of IM applications that can be used to exchange
    messages over the Internet and other IP networks. Although this is nowhere near
    a complete list, some of the most popular ones include:


    +   * AIM, America Online Instant Messenger

    * ICQ

    * Yahoo Messenger

    * MSN Messenger


    In addition to these, there are also applications that allow communication using
    VoIP or other media that provide the ability to communicate using text messages.
    Skype provides a chat feature that allows two or more users to communicate in
    a private chat room (see Chapter 10).

    One of the important features of any IM application is the ability to keep a contact
    list of those with you routinely communicate. In many programs the contact list
    is also known as a Buddy List. However, with this listing, it would be impossible
    to contact anyone if you didn''t know when contact was available. If a person
    had a high-speed'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Architectures • Chapter 3 107


    connection and was always connected to the Internet, then they might always appear
    online. As such, they would need a way of indicating that they were online but
    not available, or whether the person was available for one form of communication
    but not another. The ability to display each contact''s availability in a Buddy
    List when someone opens an IM application is called presence.


    # SIMPLE


    SIMPLE is an extension of SIP, which is used for maintaining presence information
    and managing the messages that are exchanged between the participants using instant
    messaging. Just as SIP registers users with a SIP server before they begin a session,
    SIMPLE registers presence information. When a user registers through SIMPLE, those
    with this user in their Buddy List can access information that the user is online.
    When the people who have the user in their lists are alerted that the user is
    online, they can initiate a chat. If the user needs to do some work and de change
    their status to busy, or goes away from their desk and changes their status to
    being away, then this information is updated in the IM applications that have
    this person as a contact. Generally, the presence of a user is indicated in these
    programs through icons that change based on the user''s status.


    Because SIMPLE is an extension of SIP, they are registered, and then send text-based
    requests to initiate a session. The messages are sent between user agents as individual
    requests between User agent clients and User agent servers. Because the messages
    are small, they can move between the two User agents quickly with minimal time
    lag even during peak hours.


    Although the IETF IM and Presence Protocol Working Group are still developing
    SIMPLE as a standard, it has been implemented by a number of IM applications.
    Windows XP was the first operating system to include SIMPLE, and is used by Microsoft
    Windows Messenger, and numerous other IM applications are also using SIMPLE as
    a standardized method for instant messaging.


    ![](img/c45efece24bfbfca8be768fba195d8a4_113_0.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Unfortunately, a drawback of IM applications is that it provides a potential
    gap in security. Although companies will monitor outgoing e-mail for illegal or
    inappropriate content, IM applications available to the public do not provide
    a centralized method of logging conversations that can be locked down. IM applications
    routinely offer a method of logging conversations, but these settings can be toggled
    on and off by the person using the program. This means that someone could inadvertently
    or maliciously expose sensitive information in Instant messages without anyone
    at the company ever realizing it.


    Added to this problem is the fact that IM applications provide the ability to
    transfer other forms of media between participants. IM applications can be used
    for file sharing, where one person sends a file to another through the program.
    This can result in activities like sharing music files at work, which albeit illegal
    is relatively harmless, it could also cause major issues if sensitive corporate
    files were being sent. Imagine an employee at a hospital or doctor’s office sending
    sensitive files, or a disgruntled employee sending out a secret formula to the
    public or competition, and its impact becomes more apparent.


    Because files may contain more than what you bargained for, the possibility of
    spyware or viruses being disseminated through instant messaging must also be considered.
    Some applications that have supported instant messaging include additional software
    that is spyware, which can obtain information about your system or track activities
    on your system. Even if the software used on a machine does not include spyware,
    the files sent between participants of a communication session can contain viruses
    or other malicious code. By opening these files, the person puts their computer
    and possibly their local network at risk.


    If a company wants to allow IM software installed on their machines, and doesn''t
    want to block IM communications to the Internet, they need to educate users and
    install additional software on the computers. Just as employees should know what
    information should not be discussed on a telephone or sent by mail, they should
    know these same facts, and files should be off-limits in other communications.
    In addition to this, anti-virus software should be installed, and regularly updated
    and run. To determine if spyware is installed on the machines, they should either
    invest in antivirus software that also looks for these programs or install additional
    software that searches for and removes them from the computer. In performing these
    steps, the risks associated with IM applications in a business can be decreased,
    making it safer for both the user and the company.


    ![](img/c45efece24bfbfca8be768fba195d8a4_114_0.png)'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Summary


    Today’s PSTN is more powerful than ever; it is now capable of delivering services
    that Alexander Bell could not ever imagined (like dedicated Internet access and
    SONET-based backbone links). The telecommunications industry that cares for the
    PSTN affects our everyday lives from our traditional telephone lines, cell phones,
    Internet access, wireless solutions, and cable television. The act of making a
    single phone call requires instantaneous network performance. The networks that
    make up the PSTN are always responding to a fast-changing environment that continues
    to demand reliability and capability.


    Digital multiplexing started with time division, now includes wavelength division,
    in all these cases, increased capacity from nearly full circle with the outside
    side cable plant was created in response to increased demand for telecommunications
    bandwidth.


    The design of the PSTN has changed from centered on a human operator to one leveraging
    large-scale automated switches that handle thousands of calls at once. Located
    within each center are the thousands of individual local loops coming in, such
    as the voice D50, plus DSL and many digital circuits from subscribers that are
    then collected via a DACS and presented on the network on high-speed digital interfaces
    to the switch.


    Adherence to industry-standard signaling and technological protocols, as the SS7
    and SIP, is necessary, but it may not be sufficient to the number of interconnected
    carriers continues to multiply.


    H.323 is a complex protocol suite. A number of H.323 VoIP-related protocols create
    channels made up of IP IP/port combinations. Each terminal-terminal connection
    requires, a minimum, four channels to be opened—two control channels per endpoint
    (one H.225 and H.245), and two unidirectional channels. Three of these (excluding
    the H.225 signaling traffic) are on dynamically allocated ports. In addition,
    users naturally expect to be able to make inbound and outbound calls. Because
    H.323 relies heavily on dynamic ports, packet filtering or inspection firewalls
    are not a viable solution, as every port 1024 would have to be opened to everyone
    on the Internet. Additionally, H.323 contains addressing information (port numbers)
    that are not rewritten by many NAT implementations.


    Therefore, few firewall solutions protecting H.323 must at least disable the control
    stream packets (H.245, H.225.0) and dynamically open up the firewall as needed.
    These features make the implementation of H.323 security complex. As if this is
    not enough complexity, signaling and control messages are binary encoded into
    ASN.1 rules. ASN.1 parsers have been exploited in a variety of implementations,
    and parsing takes time—adding latency to an already latency-sensitive application.
    H.323-aware firewalls, ALGs, and session border controllers (SBCs) have proven
    to be the task of effectively securing H.323 traffic without exposing internal
    networks to external attack.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'SIP works in conjunction with a variety of other protocols and specialized
    servers to provide communication between participants. Through SIP, User agent
    is able to find the location and availability of other users, the capabilities
    of the software or device they''re using, and provides the functions necessary
    to set up, manage, and tear down sessions between participants. This allows participants
    to communicate directly with one another, so that data can be exchanged effectively
    and (if necessary) securely.


    SIP is a standard of the Internet Engineering Task Force (IETF) under RFC 3261,
    and maps to the application layer of the OSI reference model. Because it isn''t
    a proprietary technology, implementations of it can be used on any platform or
    device, and can be used on any IP network. In addition to this, SIP also makes
    use of other standards, such as URIs, which are used to identify the accounts
    used in SIP.


    SIP''s architecture is made up of a number of different protocols and components
    that allow it to function. Its architecture begins as a client/server architecture,
    in which requests are made to SIP servers. As the servers serve these requests,
    they allow the participants to eventually communicate directly with one another,
    changing the architecture to a distributed peer-to-peer. As information is passed
    between these machines, a variety of different protocols are used, allowing data
    to be passed quickly between the computers, and securely if needed.


    Instant messaging is another technology where SIP is being used. An extension
    of SIP called SIMPLE is used to maintain presence information and manage messages
    that are exchanged between the participants. Because SIMPLE provides the same
    features as SIP and is also an open standard, it is being used increasingly in
    IM software, making SIP and SIMPLE a staple in communications on IP networks.'
  merge: -1
  img_proc: true
