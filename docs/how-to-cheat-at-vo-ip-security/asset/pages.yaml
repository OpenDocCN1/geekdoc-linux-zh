  md: '# Chapter 8 | Logically Segregate Network Traffic


    of 802.1q, Cisco''s ISL (Inter-Switch Link) was one of several proprietary VLAN
    proto-. ISL is now deprecated in favor of 802.1q. VLANs operate at layer 2 of
    the OSI model. However, a VLAN often is configured to map directly to an IP network
    or subnet, which gives the appearance that it is involved at layer 3.


    VLANs can be configured to map in various ways—by protocol (IP or IPX, for example)
    or based on MAC address, subnet, or physical port. They can be static, dynamic,
    or port-centric. Mechanically, VLANs are formed by either frame-tagging or frame-filtering.
    Frame- tagging, the more common mechanism, requires adding and removing a unique,
    2-byte L2 frame identifier so that switches may appropriately send and receive
    their cognate VLAN traffic. Frame-filtering relies upon the participating switches
    building and communicating a filtering database in order to forward traffic to
    its correct VLAN.


    In Figure 8.2, dotted lines represent VLAN 2 and solid lines represent VLAN 10.
    The presence of the two lines that form a trunk between the top level switches
