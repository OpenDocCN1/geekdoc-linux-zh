  md: '# Chapter 2 • The Hardware Infrastructure


    This flexibility and versatility is a huge advantage to VoIP, but it does come
    at a price. The phones are now sharing infrastructure and bandwidth with other
    devices (or perhaps the entire data network), quality-of-service (QoS) guarantees
    for packet loss, latency (how long each packet takes to arrive from the phone
    PBX), jitter (variability of latency across packets in a stream) now become the
    responsibility of the phone providing the network infrastructure. Additional vectors
    for Denial-of-service attacks on IP lines (either to the phone or the PBX) and
    Man-In-The-Middle (MITM) attacks must be considered. In my experience, the resulting
    loss of accountability from a single organization or vendor to multiple entities
    (or ROI calculations) for VoIP deployments.


    # PBX Trunks


    A trunk is a special kind of link that connects two telephone switches. If one
    of the switches is the PBX, the other could be a local or long-distance switch
    for PSTN, in which case we would call these local trunks or long-distance trunks,
    respectively (though it''s worth noting out that if you don''t have dedicated
    long-distance trunks you are likely to get distance services through local trunks).
    On the other hand, if the other end of the trunk is privately owned PBX, we would
    call these private trunks or tie lines, even if they happen to be routed through
    the PSTN (since the phone numbers they can reach can only be dialed from the private
    network). There are also trunks that can be both types through the use of Centrex
    or something called a Virtual Private Network (VPN—but it''s not the access VPN
    you may be familiar with the data world—this VPN is created by a carrier to let
    you keep a private dial plan across many sites on the same trunks that you use
    for regular PSTN access).


    Some trunks are so named because in the old days, Ma Bell saw to use thick, lead-covered
    cables. Others claim the trunk''s origin is derived from the very loop network
    resembles the branches of a tree, with trunks having similarity to... well, a
    tree. Regardless trunks are the main lines of the communications system, and the
    only case where a trunk is not connecting to a switch is when an adjunct server
    is involved (like a voice messaging system, an Automatic Call Distribution (ACD)
    server, an Interactive Voice Response (IVR) system, or similar system). In some
    cases, these servers may use emulation of trunking, so you''ll need to verify
    what is actually being used.


    Trunks can be analog, digital, or VoIP-based, just like station lines. Analog
    trunks can be as simple as a regular 2-wire POT line to the local CO switch, or
    a 4-wire E&M trunk that provides improved signaling (less glare). Channelized
    digital T1 come in two main flavors. The first and oldest type of T1 have 24 channels
    of 64 kilobit per second with robbed-bit signaling (signaling bits are robbed
    from the voice stream in a way that''s not noticeable to the ear). This type of
    T1 sends much less signaling data but cannot be used with 64 kb switched data
    because of the bits used for signaling, but


