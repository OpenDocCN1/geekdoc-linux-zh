- pgno: 230
  md: '# NAT as a Topology Shield


    UDP packet is stripped after it passes through the NAT device. This enables NAT
    and IPSec to function together but none of these are elegant solutions.


    NAT provides a security function by segregating hosts from the publicly routed
    Internet. Depending on your addressing requirements, NAT can isolate, to some
    extent, your VoIP network IP space from the balance of your internal network IP
    space. The large number of private RFC1918 IP addresses allows systems to intelligently
    address hosts and other network elements based upon location, function, or other
    criteria during the design phase of the VoIP network.


    External hosts cannot directly access a particular internal host if a NAT intervenes
    since the external host has no way of targeting it to a chosen IP address. Of
    course, when addresses are assigned dynamically, it becomes more problematic for
    an attacker to point to a specific host within the NAT domain. This may help protect
    internal hosts from external malicious content. At worst, NAT is an additional
    layer of security controls that you implement as part of your overall security
    architecture.


    The IPSec model is instructive that it illustrates a complex interaction between
    encryption and NAT. However, IPSec is not the only functional or proposed security
    mechanism for VoIP environments. SSL/TLS,S/MIME, HTTP 1.1 digest, and ZKTP have
    also been proposed as security instruments. Nor are all environments as simple
    as the symmetric examples we have seen on one or more devices on opposite sides
    of a NAT device. Asymmetric or hairpin call routing (a call from one phone behind
    a NAT to another phone behind the same NAT), in an environment where basic NAT
    and encryption issues have been resolved, can cause communications to fail.The
    point here is to introduce some of the concepts that you will come across as you
    design and troubleshoot in this area. We''ll see in the next section how encryption,
    NAT, and VoIP protocols work (or do not work) together.


    # Firewalls


    Firewalls are a key component of virtually any network security architecture.
    Firewalls demarcate inside from outside, trusted from untrusted networks, and
    they are used to separate VoIP data from data on internal networks. Two significant
    issues affect firewall performance with regard to VoIP:The first is that the boundary
    between inside and outside or trusted and untrusted networks gradually becomes
    less clear; the second is that firewalls fail to adequately process VoIP packets
    and sessions, particularly (as you were forewarned) if those session and packets
    are encrypted.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# A Bit of Firewall History


    Traditionally, firewalls have provided a physical and logical demarcation between
    the inside and the outside of a network. The first firewalls were basically just
    gateways between two networks with IP forwarding disabled. Most contemporary firewalls
    share a common set of characteristics:


    +   1. They are single points between two or more networks where all traffic must
    pass (choke point).

    2. They can be configured to allow or deny IP (and other protocol) traffic.

    3. They provide a logging function for audit purposes.

    4. They provide a NAT function.

    5. Their operating systems are hardened.

    6. They often serve as a VPN endpoint.

    7. They fail closed—that is, if the firewall crashes in some way, no traffic is
    forwarded between interfaces.


    # Shallow Packet Inspection


    Steven Bellovin classically stated, “Firewalls are barriers between ''us'' and
    ''them'' for arbitrary values of ''them.”


    Shallow packet inspection, in contrast to deep packet inspection, inspects only
    a few header fields in order to make processing decisions. IP packet filtering
    firewalls all share this same basic mechanism: As an IP packet traverses the firewall,
    the headers are parsed, and the results are compared to a rule set defined by
    a system administrator. The rule set, commonly based upon source and/or destination
    IP address, source and/or destination port, or a combination of the two, defines
    what type of traffic is subsequently allowed or denied. Packet filtering (and
    the code that performs these tasks) based upon parsing of IP headers has been
    common for many years.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Logically Segregate Network Traffic • Chapter 8 227


    # Tools & Traps...


    # Thank Goodness for GUIs


    Interestingly, some early (and not particularly popular) packet-filtering implementations
    required that the system administrator define specific byte fields with the packet
    headers, and the specific byte patterns to match against. Imagine setting up and
    troubleshooting a 100-field rule set on one of these systems!


    # Stateful Inspection


    Stateful Inspection Technology, a term coined by Check Point Software Technologies,
    described a method for the analysis and tracking of sessions based upon source/destination
    IP address and source/destination ports. A stateful inspection firewall registers
    connection data and compiles this information in a kernel-based state table. A
    stateful firewall examines packet headers and, essentially, remembers something
    about them (generally source/destination IP address/ports). The firewall then
    uses this information when processing later packets. Interestingly, Lance Spitzer
    (www.spitzner.net/) showed that, contrary to what we would expect, sequence numbers
    and other information is not utilized by Check Point to maintain connection state
    tracking. Stateful packet inspection firewalls, like packet firewalls, have very
    little impact on network performance, can be implemented transparently, and are
    application independent.


    # Medium-Depth Packet Inspection


    Application layer proxies or gateways (ALG) are a second type of firewall mechanisms.
    ALGs peer more deeply into the packet than packet filtering firewalls but normally
    do not scan the entire payload. Unlike packet filtering or stateful inspection
    firewalls, ALGs do not route packets; however the ALG accepts a connection on
    one network interface and establishes the connection on another network interface.
    An ALG provides intermediary services for hosts that reside on different networks,
    while maintaining complete details of the TCP connection state and sequencing.
    In practice, a client host (running, for example, a Web browser application) negotiates
    a service request with the AP, which acts as a surrogate for the host that provides
    services (Web server). Two connections are required for a session to be completed—one
    between the client and the ALG, and one between the AP and the server. No direct
    connection exists between hosts.


    www.synergy.com'
