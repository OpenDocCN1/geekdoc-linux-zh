    # H.323 Protocol Specification


    H.323 protocol suite allows dissimilar communication devices to communicate with
    each other. H.323 (which is implemented primarily at versions 4 and 5 as of the
    time of writing) is a sometimes Byzantine international protocol published by
    the ITU that supports interoperability between differing vendor implementations
    of telephony and multimedia products across IP-based networks. provide for real-time
    audio, video, and/or data communications. Support for audio is mandatory; support
    for data and video is optional.


    The H.323 specification defines four different H.323 entities as the functional
    units of a complete H.323 network (see Figure 3.9). These components of an H.323
    system include endpoints (terminals), gateways, gatekeepers, and multipoint control
    units (MCUs).


    Figure 3.9 H.323 Entities


