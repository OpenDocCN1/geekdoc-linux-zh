  md: 'the greater in a VoIP environment, the greater packet loss, VoIP does not tolerate
    the packet loss (dropped media packets are not resent), thus the greater packet
    loss, the lower the voice quality. Active monitoring and management of voice quality
    in VoIP environment is a must to identify and reduce such undesirable occurrences.


    If you are responsible for network monitoring in your VoIP environment, then a
    number of tools—in a range from freeware to expensive commercial—are available
    to you. At the low end (price-wise, but not feature-wise) are tools like MRTG,
    NTOng, Nagios, and a host of SNMP-based agent-managers. At the high end, tools
    like HP OpenView, Tivoli, and SMARTS not only discover and manage network objects,
    but in some cases, attempt to determine the root cause of network problems. The
    key security issue in ruling your own security monitoring infrastructure is that
    you segregate network traffic to a dedicated, secure, management network.The other
    key point is managing your own network monitoring professionals who dedicate humans
    to the task of reading, analyzing, and acting upon the resultant data.


    Many clients use third-party remote management of VoIP infrastructure components.
    How do you choose between different vendor offers? What are the criteria you should
    use when making this decision? Hopefully, the next several paragraphs will give
    you some insight into this process.


    First, you will require a secure and auditable path between your managed sites
    and the vendor sites that support delivery of services. One of the most challenging
    problems in remote management of large networks is the complexity of security
    administration. This can be a difficult issue to solve technically as mutual trust,
    at what point, becomes an issue. Technical workarounds for this include multiple
    layers of firewalls—some of which are managed by each party; coincident visualization
    of all encrypted traffic that spans the two networks; and sturdy, enforced, and
    audited role-based access controls (RBAC).


    You should specify that the remote management services incorporate a standards-based
    approach that ensures secure maintenance and monitoring for multivendor support.
    Standards will enable visibility into the processes that are used to monitor your
    network. Check that all regulatory requirements that are relevant for your particular
    industry are met, including a strong audit trail for all transactions. Ensure
    that the remote manager provides a single point of alarm coordination, ticketing,
    and inbound/outbound access to the corporate network; and that a customer self-service
    maintenance portal with unrestricted access to audit trail information and reports
    is available. Last, be certain that you retain access and control of the devices
    within your own infrastructure.


