- pgno: 123
  md: "# Support Protocols • Chapter 4\n\na resilient operating architecture. Two\
    \ types of zone transfers can be found between DNS servers: full and incremental.\
    \ A full zone transfer is exactly as it sounds, a complete transfer of zone information\
    \ between DNS servers. An incremental zone transfer, on the other hand, is one\
    \ where only changed information is exchanged between DNS servers. Incremental\
    \ zone transfers make more efficient use of bandwidth and network resources, but\
    \ not all DNS server vendors support the new implementation.\n\nZone transfers\
    \ are based on several items, including serial numbers and refresh intervals.\
    \ The secondary DNS server will request a zone transfer from the primary DNS server\
    \ and there is a serial number embedded in the response. If the secondary server\
    \ receives the response and a serial number lower than or equal to the serial\
    \ number of its current version table, the response will not be used to update\
    \ the server's table. However, if the serial number is higher, the DNS table will\
    \ be updated to what is enclosed in the response.\n\nThe refresh interval is used\
    \ to identify how often the secondary server should request a zone transfer from\
    \ the primary server. It is used as a polling mechanism to help ensure that the\
    \ secondary server remains up-to-date with the current DNS information. NOTIFY\
    \ messages may also be used by the primary DNS server to tell the secondary servers\
    \ when changes have been made to the DNS table. When the secondary DNS server\
    \ receives the NOTIFY, it can request a zone transfer to enable table synchronization.\n\
    \n# Security Implications for DNS\n\nDNS is a core component of modern networking,\
    \ and as such, is a rather attractive target for many attackers. When the DNS\
    \ architecture was developed, security was not included as part of the design.\
    \ There was nothing designed into the architecture for authentication, origin\
    \ authentication, or data encryption. Some recent advancements in DNS have helped\
    \ to alleviate some of the current security concerns, they have not been able\
    \ to remove them altogether.\n\nThe dangers of DNS are well publicized and well\
    \ documented, owing to its long life on the Internet. More information on these\
    \ security threats, how they are performed, and how to protect your DNS servers\
    \ can be found at www.dnssec.net/dns-threats.php. There is also an RFC on DNS\
    \ Threats, as RFC 3833. Several types of attacks should be kept in mind regarding\
    \ your DNS deployment, and some best practices can be employed to help lessen\
    \ your exposure:\n\n+   - DNS footprinting (using DNS zone data to learn host\
    \ names, subdomains, andnets)\n- Denial of Service (DoS)\n  1. SYN flooding of\
    \ DNS server\n  2. Transfer of blank DNS table\n- DNS cache poisoning\n\n![](img/c45efece24bfbfca8be768fba195d8a4_123_0.png)"
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Chapter 4 • Support Protocols


    # TFTP


    The Trivial File Transfer Protocol (TFTP) is a simplified protocol used to transfer
    files from a server to client. Unlike older file protocols, such as FTP,TFTP was
    designed to work in pure simplicity, requiring less overhead and interaction.
    Its primary usage today is in computers and devices that do not have storage devices,
    commonly known as “thin clients PCs”. Without offline storage, especially one
    that can be updated, it is difficult to maintain how such devices can operate.
    Instead of booting off a hard drive or ROM, these devices use TFTP to request
    data from a central server and use TFTP to request configuration data during their
    operation. Also, devices can use TFTP to request firmware updates which they can
    flush to their ROM chips up the built-in software code. This is especially useful
    sets of data can be stored for individual user devices within a corporate environment.


    The role of TFTP in transferring data is well throughout the computer industry.
    Virtually all modern computers support the ability to boot from the network. In
    this mode, the computer will need to locate a TFTP server on its network segment
    once it boots. In finding one, the client requests a bootable image, usually in
    the form of a floppy disk. Once it receives the data, the client will then proceed
    to boot from the image, as if it was an actual floppy disk or CD-ROM.


    In the VoIP community,TFTP has a critical role in allowing VoIP and telephones
    to obtain configuration data from centralized servers. These devices are built
    with flash ROM memory chips that contain simplified hardware architecture that
    does not allow for continual access to memory. Data is only written to the device’s
    memory and read continuously by the internal operating system.


    The TFTP protocol was first described in 1980 as IEN (Internet Experiment Note)
    133. Its first RFC was RFC 783, which was later updated in RFC 1350. However,
    there are various RFCs that also describe individual actions and abilities that
    TFTP could be used for. These include Bootstrap loading (RFC 906) and TFTP multicasting
    (RFC 2090). The next sections of the chapter detail a high-level overview of the
    TFTP architecture and several related security threats associated with the protocol.


    # TFTP Security Concerns


    In order to better understand and be to address the security concerns associated
    with TFTP properly, it is important to have at least a high-level understanding
    of how TFTP works. Unlike other file transfer protocols, TFTP operates by transmitting
    UDP packets. While connectionless UDP packets are generally frowned upon for reliable
    data transmissions, they allow for a simpler implementation in the protocol, as
    well as faster transfer speeds. The abilities of the protocol are also very limited,
    only for the ability to read and write data. The protocol does not have any mechanism
    displaying information about


