    The Security mechanisms of paths 1 and 2 are specified in the security document
    as follows (the fifth reference in the Related Resources section):


    +   1. Provides mutual authentication. The HSS delegates the performance of subscriber
    authentication to the S-CSCCF. However the HSS is responsible for generating keys
    and challenges. The long-term key in the ISIM and the HSS is associated with the
    user private identity (IMPI). The subscriber will have one network internal IMPI
    and at least one external public identity (IMPU).

    2. Provides a secure link and security association between the User Equipment
    (UE) and a P-CSCCF for protection of the Gm reference point.


    IMS security covers the initial secure authentication that occurs between the
    ISIM and the HSS in user devices are authenticated through a secure link. Once
    the user device is authenticated and allowed to use IMS, the IMS security provides
    a communication mechanism through which all the information can be transmitted.


    To summarize IMS security, all the UAs are authenticated before they are allowed
    to get into the system. The HSS is the central component for the security policy.
    The HSS gives commands for what kinds of security algorithm is used and provides
    correct authentication information for all the users. Each UA or ISIM, which is
    a term indicating the collection of IMS security data and functions on a Universal
    Integrated Circuit (UICC), has built-in authentication information in the UICC.'
