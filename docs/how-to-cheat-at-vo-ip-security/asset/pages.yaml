    # A New Security Model


    Access to network services is more important than ever. The growing availability
    and maturity of Web services combined with advanced directory integration makes
    it easier to integrate information systems between business partners. Companies
    are moving their applications out from behind the veil and onto the edges of their
    networks, where they can participate in dynamic, Internet-based transactions with
    customers and business partners. The network perimeter is becoming impossible
    to define as. Intranets, extranets, business partner connections, VPN (Virtual
    Private Networks), and other RAS (Remote Access Services) blur the definition
    of a trusted internal user; and critical corporate data may be located on handhelds,
    laptops, phones—anywhere.


    VoIP distributes applications and services throughout the network. In a VoIP environment,
    IP phones (obviously) are distributed throughout the infrastructure as well. Voice
    devices incorporate microcontrollers and digital signal processors in order to
    perform voice compression and decompression, line and acoustic echo cancellation,
    DTMF (Dual Tone, Multi-Frequency—Tone Dial), detection, and network management
    and signaling. IP phones are smart, and depending upon the vendor, IP phones act
    as clients for a number of network protocols. This means that the number of ingress/egress
    points will increase, and that processor cycles and memory—intelligence—are shifted
    to the logical edge of the network. This is a reversal of the traditional security
    model, where critical data is centralized, bounded, and protected.


    This means that from a strategic viewpoint, converged networks, regardless of
    whether they are based on H.323, SIP, or other protocol, require a new way of
    thinking about information security (see Figure 1.3).


    > "Trust no one" is a bit of overstatement but since every functioning system
    has to trust someone at some point or it won''t work at all. A more concise (but
    not catchy) axiom might be: "Don’t assume you can trust anyone."The point here
    is this—Any system administrator, user, or device must be authenticated and authorized,
    regardless of its location, before it is able to access any network resources.
    Period.


    ![](img/c45efece24bfbfca8be768fba195d8a4_21_0.png)'
