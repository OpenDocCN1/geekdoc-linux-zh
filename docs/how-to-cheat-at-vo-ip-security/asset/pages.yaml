    Reading this packet, you can see that the owner line describes the packet sender
    is "alice", who is listening for connections on host.atlanta.example.com. This
    data is sent to the person with whom she wishes to communicate. Once the other
    person has received the data and wishes to continue the connection, an answer
    packet is returned. Here is an example of this answer:


    ```

    v=0

    o=bob 2808844564 2808844564 IN IP4 host.biloxi.example.com

