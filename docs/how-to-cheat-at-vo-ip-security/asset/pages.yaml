    stantly for incoming UDP packets on port 67, a port reserved for DHCP usage. When
    a new, DHCP-enabled device is connected to the network, it sends a broadcast packet
    to detect any running DHCP servers. The DHCP server responds with a DHCP offer,
    which contains an assigned IP address.


    Eight types of packets are used within the DHCP protocol:


    +   - Discover

    - Offer

    - Request

    - Decline

    - ACK

    - NAK

    - Inform


    # DHCP Operation


    When a client joins a network, either by being plugged into the network segment
    or by being powered on, it does not have an IP address assigned to it. In order
    to request one, it sends a DHCP Discover packet to the broadcast IP address 0.0.0.0
    to 255.255.255.255, which allows the packet to reach every single device on the
    network segment. This packet may include information about the client itself,
    as the network interface''s MAC address and the computer''s guest host.


    Once a server has received a DHCP Discover packet, it immediately checks the next
    available number in the range (scope) of IP addresses. Optionally, the DHCP server
    will also compare the requester''s MAC address against a local table to determine
    if the client is allowed to receive an IP address. After an address has been chosen,
    a DHCP Offer packet is transmitted back to the requesting client, targeted by
    its MAC address. This packet includes the assigned IP address, the lease time
    of the IP address, subnet mask, gateway and DNS servers, as well as other network
    information that is to be implemented into the client.


    Once the client has received a DHCP Offer packet, it responds with a DHCP Request
    packet. This packet is similar to the original DHCP Discover packet and it is
    sent from 0.0.0.0 to 255.255.255.255. This packet serves to notify the server
    that the client has accepted the assigned IP address and also notifies other clients
    on the network segment that the assigned IP address has been taken. Finally, the
    server responds to the client with a DHCP Acknowledgement (ACK) to confirm the
    address has been received. This communication between the client and DHCP server
    is detailed in Figure 4.6.


