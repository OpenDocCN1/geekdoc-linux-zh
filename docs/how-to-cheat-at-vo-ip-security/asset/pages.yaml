    # WARNING


    It''s tempting to think of HIPAA documentation as something you can ask the VoIP
    (or other product) vendor to take care of you, but there are two reasons why I
    don''t recommend it. First, the vendor is not on the hook for the HIPAA processes;
    suppose they agree to a process for you, but it''s one that you can''t reasonably
    implement—it''s your organization that will be held responsible by regulators,
    not the vendor. Second, remember that HIPAA is about your organization''s operational
    processes, not any specific software or hardware. Unless you''re hiring a consultant
    specifically for that process asking an equipment vendor to document that process
    for you makes about much sense as asking your local car dealer to pass a driving
    test for you . Maybe you salesman who takes you on just to close the sale, but
    doesn''t really make it appropriate or legal (and it won''t make you a safe driver).


    What needs to be documented? Each of the items within the four main categories
    of the security rule: Administrative, Physical, and Technical Safeguards, plus
    Organizational Requirements. Since these are lengthy sections, I''m going to summarize
    and highlight specific parts from each that are likely to come into play with
    VoIP systems. You''ll want to consult the Security Rule for specific details if
    you believe a listed standard will apply to your VoIP system.


    # Administrative Safeguards with VoIP Applicability


    +   - Documented security management process to prevent, detect, contain, and
    correct security violations. Required elements: risk analysis, risk management,
    sanction policy, and logging/activity review.


    +   - Authorization policies and procedures must be established to grant access
    to PHI only to those who require it. Addressable elements: Authorization and/or
    supervision, workforce clearance procedure, termination procedure.


    +   - Security awareness and training program. Addressable elements: security
    reminders, malicious software protection, log-in monitoring, password management.


    +   - Security incident procedures. Required elements: response and reporting.


