  md: 'criticality ranging from emergencies to debugging emergencies signifying the
    most critical messages. All system logs reside in /var/log/etc/syslog.conf can
    be configured to store messages of different severities in different files, and
    on remote computers. Many references exist on the Web that describe configuring
    syslog on Linux. A good one is http://www.siliconvalleycie.com/linux-hn/logging.htm.


    Note that remote syslog messages are encapsulated in UDP packets, and until RFC3411
    is updated, messages are not encrypted. Thus, anyone on the LAN can sniff the
    syslog traffic. This may be an issue if extended debug messages are generated
    by a critical server and sent across the LAN.


    Windows does not ship with a native syslog daemon; instead, Windows relies upon
    the System Event Notification manager to track system events as Windows log, network,
    and power events. The System Event Notification manager also notifies COM+ subscribers
    of events. A number of syslog addons for Windows recommend the Kiwi Syslog Daemon.
    The Kiwi product is a free-featured syslog daemon that is free in its basic edition.
    The extended version can be very useful that it allows logging to any ODBC-compliant
    databases. Kiwi offers a free syslog generator that simplifies testing of syslog
    functions and connections.


    Additionally, under Windows, you''ll want to extend logging via the Domain Security
    Policy and Local Security Policy snap-ins. These determine which security events
    are logged into the Security log on the computer (successful attempts, failed
    attempts, or both). (The Security log is part of Event Viewer). Under the Audit
    Policy table, logging can be enabled for nine particular security-related events.
    You should have at least auditing of failed log events, successful or failed policy
    change events, successful or failed account management, successful or failed privilege
    usage. Note that if the server is in a domain, domain security policies will override
    local security policies.


    # Permission Tightening


    Under Windows, permission tightening is an art. In addition, the process is significantly
    different depending upon whether the server version is Windows 2000 or Windows
    2003. In these operating systems, Microsoft created a complex and powerful set
    of relating files, folder, and user permission control that are, too complex for
    most system administrators to understand and configure. In my view, the complexity
    of configuring permissions leads to more security-related events than bad coding
    on Microsoft platforms, because most administrators rely on default permissions.
    I will note that with Windows 2003, Microsoft has created a more secure platform
    with regard to default permissions. Unfortunately, we don''t have the space to
    cover the intricacies securing Windows permissions here. Suffice to say that if
    you are given the option, choose Windows 2003 as the base OS rather than Windows
    2000.


