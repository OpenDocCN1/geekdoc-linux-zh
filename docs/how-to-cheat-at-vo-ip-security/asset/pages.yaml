- pgno: 327
  md: '# Introduction


    The IP Multimedia Subsystem (IMS) is a next-generation multimedia communication
    framework that encompasses mobile, fixed, packet-switching, and traditional circuit-switching
    communication systems. It has been proposed by the Third Generation Partnership
    Project (3GPP) and the Voice over Internet Protocol (VoIP) framework, especially
    the Session Initiation Protocol (SIP) standard. The 3GPP is a standards organization
    driven by wireless carriers and equipment manufacturers at producing globally
    applicable applications and services for Third Generation (3G) Mobile Systems
    based on GSM (Global System for Mobile Communication). The 3GP is also working
    with the Internet Engineering Task Force (IETF) on SIP-related standards. The
    goal of IMS is to provide a wide spectrum of services with ease and consistency.
    These services include video-conferencing, Push-to-Talk (PTT), Text-to-Speech
    (TTS), instant messaging (IM), content sharing, and multipart gaming. To achieve
    this goal, IMS uses an open IP protocol and extension of SIP.


    SIP is standardized by the IETF as signaling protocol. Its architecture is highlighted
    by a User Agent (UA), which is a terminal, and a set of servers, including proxy
    server, registration, redirection server, and so on. From its inception, SIP has
    gaining momentum due to its open architecture and extension to mobile device and
    multimedia communication. Because SIP signaling protocol is based on Hypertext
    Transfer Protocol (HTTP) and ASCII-based encoding, it is easy to understand. SIP
    also sits side with a standard media protocol Real-time Transport Protocol (RTP),
    also standardized by the IETF RTP is a vehicle with which any kind of media can
    be digitized as the media is digitized with a proper codec. For instance, one
    of the popular voice codes in VoIP systems is G.711. This codec samples at 8000
    times/sec, also digitizing and transmitting at 64K bit/sec. With a G.711 codec,
    each packet has a 160-byte payload (214 packet size with header information),
    and VoIP phone sends 50 packets in one. If there is a need for compression, a
    VoIP phone can transmit the digital voice with a compressed format (for instance
    G.729 format), saving bandwidth. Value can be easily transmitted with SIP and
    RTP protocols if it is digitized with an appropriate format such as H.264 or any
    of the MPEG series formats such as MPEG1, MPEG2, MPEG4, or H.264.


    IMS architecture extends to SIP and 3GPP architecture and adds several components
    suitable for mobile communication. It was driven originally by the 3GPP to boost
    the packet-switched services and attract more users to the packet-switched domain.
    To do so, it adds three important features in the GSM-based packet-switched network
    that offers Internet services such as surfing the Web and accessing e-mail:'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# The IP Multimedia Subsystem: True Converged Communications • Appendix B 325


    +   1. It requires QoS (Quality of Service) in a session, so that the quality
    of service can be met. Existing packet-switched network not guarantee the quality
    of service and users may have a fluctuation of service depending on the situation.


    +   2. It adds a flexible charging mechanism that operators are able to charge
    appropriately for multimedia services. For example, operators can charge the conferencing
    based on the time used or any other reasonable measure rather than the bandwidth
    that the service consumes, which may end up unacceptable to a customer.


    +   3. It provides integrated services to users and offers ample room for third
    parties to provide services. Operators do not need to stick to the services that
    the large vendors offer, but have flexibility to offer a variety of services developed
    by third parties.


    The architecture of IMS extends the SIP and 3GPP architecture and adds several
    components that are suitable for mobile communication.


    # IMS Security Architecture


    IMS has its own security architecture in addition to the general 3GPP security
    architecture named Network Domain Security. Network Domain Security addresses
    security issues at the IP layer and recommends IPSec as the basic security mechanism
    among Gateways (SEGs). SEG is a security component that sits in each network domain
    and communicates with SEGs of the destination domain. As shown in Figure B.1,
    the IMS-specific security covers the security issues between the IP Multimedia
    Services Identity Module (ISIM) and HSS (path 1), UA and P-CSCF (path 2); the
    Network Domain Security covers the other paths that are implementing IP protocol
    (paths 3, 4, 5). ISIM and UA are collectively called UE (User Equipment). Suppose
    that P-CSCF and S-CSCF are located in different networks, each of which implements
    its own security policy. In this case, all the traffic between P-CSCF and S-CSCF
    traverse two SEGs in a way that packets are encrypted in a SEG and decrypted in
    the other end of SEG. The two SEGs have their own security binding (Key exchange
    and encryption/decryption algorithm), implementing IPSec.


    ![](img/c45efece24bfbfca8be768fba195d8a4_328_0.png)'
