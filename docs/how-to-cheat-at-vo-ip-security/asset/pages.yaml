  md: '# ARP Spoofing


    ARP is a fundamental Ethernet protocol. Perhaps for this reason, manipulation
    of ARP packets is a potent and frequent attack on VoIP networks. Most network
    administrators assume that deploying a fully switched network to the desktop prevents
    the ability of network users to sniff traffic and potentially capture sensitive
    information traversing the network. Unfortunately, several techniques and tools
    exist that allow any user to sniff traffic on a switched network because ARP has
    no provision for authenticating queries or replies. Additionally, ARP is a stateless
    protocol, most operating systems (Solaris is an) update their cache when receiving
    ARP reply, regardless of whether they have sent out an actual request.


    Among these techniques, ARP redirection, ARP spoofing, ARP hijacking, and ARP
    cache poisoning are related methods for disrupting the normal ARP process. These
    terms frequently are interchangeably and confused. For the purpose of this section,
    we’ll refer to ARP cache poisoning and ARP spoofing as the same process. Using
    freely available tools such as ettercap, Cain, and sniff, an evil IP device can
    spoof a normal IP device by sending unsolicited ARP replies to a target host.
    The bogus ARP reply contains the hardware address of the normal device and the
    IP address of the malicious device. This “poisons” the host’s ARP cache (see Figure
    5.5).


    Figure 5.5 ARP Spoofing (Cache Poisoning)


