  md: '# Logically Segregate Network Traffic • Chapter 8 237


    A general rule-of-thumb is outbound ACLs are more efficient than inbound ACLs
    since the inbound logic must be applied to every packet, the outbound logic is
    applied only to those packets exiting a particular interface. ACLs are normally
    applied at layers 3 and 4 of the OSI model, but some vendors (Cisco and Extreme,
    example) offer layer 2 ACLs, and others (Alaton/Nortel, example) offer ACLs at
    layers 5 and below.


    ACLs, in coordination with VLANs, QoS, and firewalls, are powerful tools for segregation-VoIP
    traffic from all other traffic. Additional services may be permitted or denied
    based upon the client’s infrastructure requirements.


    # Summary


    Logically separate data from voice traffic. Plan on establishing at least two
    VLANs and your VoIP system components on a separate VLAN with 802.1p/q QoS (Quality
    of Service) and VLAN tagging. Limit physical and terminal access to your switch
    consoles to only authorized personnel.


    Traffic shaping is normally associated with ensuring performance, but it also
    plays a role in security. Voice and data on separate logical VLANs share the same
    bandwidth. If hosts on the data VLAN become infected with viruses or worms that
    flood the network with traffic, VoIP traffic remains unaffected if traffic shaping
    has been configured to ensure that VoIP traffic has priority. The reverse is also
    true.


    Access control lists find new utility at layer 3 of the internal networks, acting
    to fintune and control traffic. Keep ACLs simple and apply only to specific ports
    in order to minimize their processing requirements.


    Network Address Translation (NAT) will continue to be a major obstacle in VoIP
    migrations until IPv6 becomes commonly adopted. Encryption across a NAT device
    is particularly problematic as both H.323 and SIP embedded layer-3 routing and
    signaling information include the IP datagram payload.


    There is no simple solution for securely handling calls that originate externally.
    Packet filtering and stateful inspection can open a "pinhole" through which replies
    pass. However, particularly in the case of SIP-based solutions, translated IP
    address prevents incoming calls from reaching the correct recipient.


    One promising approach is to combine an application layer gateway with a stateful
    packet filtering firewall. In this approach, an ALG software module running in
    close proximity to a NAT firewall device updates payload and header data invalid
    by address translation. Complicating this solution is that the ALG software must
    be configured to be aware of the internal network architecture; and it requires
    that the ALG software understand the higher-layer protocol that it needs to "patch,"
    thus each protocol requires a separate ALG module.


    One particular technology that looks promising with regard to making firewalls
    intelligent and VoIP-aware is Deep Packet Inspection (DPI). Deep Packet Inspection
    may enhance


