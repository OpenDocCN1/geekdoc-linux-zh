- pgno: 245
  md: '# Introduction


    There are competing beliefs of VoIP signaling protocols, H.323 from the ITU and
    the SIP from the IETF. Accordingly, there are also two groups of VoIP security
    protocols accompanying each other. For H.323 is a group of protocols named H.235.x,
    and the other for SIP includes TLS, S/MIME, and SRTP. They are not completely
    exclusive to exclude each other. Some components are overlapped, as X.509 digital
    certificate, TLS secured transport, and SRTP encryption. In this chapter, we will
    fill our main focus on protocol suites for SIP from the IETF, and then a brief
    introduction to ITU suites (H.235 group); pointers to individual components are
    presented for the investigative reader.


    # Suites from the IETF


    Realizing the security issues present in VoIP, the IETF picked up three landmark
    security protocols in the SIP standard—Transport Layer Security (TLS), Secure/Multipurpose
    Internet Mail Extensions (S/MIME), and Secure Real-Time Transfer Protocol (SRTP)—to
    be used for securing SIP service. The basic approach consisting of adding a security
    layer below the existing VoIP protocol rather than crafting a new security protocol.
    The layered architecture is shown in Figure 9.1. The advantage of this approach
    is that existing protocol implementation can be reused for secured communication
    by adding security layers.


    In general, TLS, which was chosen to protect SIP signaling messages, provides
    an upper layer secured tunnel to its peer entity. It is basically a successor
    of Secure Sockets Layer (SSL) version 3. The Service Data Unit (SDU) from the
    upper layer is encrypted before transmission. At the other end, the received Protocol
    Data Unit (PDU) is decrypted and passed to the upper layer. Each entity at both
    ends must have a legitimate certificate issued from a Certificate Authority (CA),
    which is mandatory for the TLS handshake operation. SIP signaling is passed through
    the secured tunnel.'
