- pgno: 233
  md: 'Additionally, ALGs typically possess the ability to a limited amount of packet
    filtering based on rudimentary application-level data parsing. ALGs are considered
    by most people to be more secure than packet filtering firewalls, Cisco''s protocol
    firewall and scalability factors have limited their distribution. An adaptive
    (coined Gauntlet), dynamic, or proxy filtering is a hybrid of packet filtering
    and application layer gateway. Typically, the adaptive proxy monitors traffic
    streams and checks for the start of a TCP connection (ACK, SYN-ACK, ACK). The
    packet information from these first few packets is passed over the OSI stack and
    if the connection is approved by the proxy security intelligence, then a packet
    filtering rule is created on the fly to allow this session. Although this is a
    clever solution, UDP packets, which are stateless, cannot be controlled using
    this approach.


    Although current stateful firewall technologies and ALGs provide for tracking
    the state of a connection, most provide only limited analysis of the application.
    Several firewall vendors, including Check Point, Cisco, Symantec, Netscreen, and
    NAI have integrated additional application-level data analysis into the firewall.
    Check Point, for example, initially added processes for Telnet, FTP, and HTTP
    to the FW-1, but have since replaced the Telnet proxy with an SMTP proxy. Cisco''s
    Pix-fix protocol initially provided limited application parsing of FTP, HTTP,
    H.323, RSH, SMTP, and SQLNET. Both vendors have added support for additional applications.
    To sum up, the advantages of ALGs is that they do not allow any connections between
    internal and external hosts; they offer user and group-level authentication; and
    they are able to analyze specific application commands inside the payload of data
    packets. Their drawbacks are that ALGs tend to be slower than packet filtering
    firewalls, they are not transparent to users, and each requires its own dedicated
    DPI policy/processing module.


    # Deep Packet Inspection


    To the limits of Packet Filtering, Application Processes, and Stateful Inspection,
    a technology known as Deep Packet Inspection (DPI) was developed or (marked) DPI
    analyzes the entire packet, and may buffer, assemble, and inspect related packets
    as a session. DPI operates at L3-L7 of the OSI stack.


    DPI engines parse the entire IP packet, and make forwarding decisions by means
    of a rule-based logic that is based upon signature or regular expression matching.
    That is, compare the data within a packet payload to a database of predefined
    attack signatures (string of bytes). Additionally, statistical or historical algorithms
    may supplement statistic pattern matching.


    The issue with DPI is that packet data contents are virtually unstructured compared
    with the highly structured packet headers (the previous section on NAT for more
    details). Analysis of packet headers can be done efficiently since the locations
    of packet header fields are restricted by protocol standards. However, the payload
    contents are, for the most, unconstrained. Searching through the payload for multiple
    string patterns within the datream is a computationally expensive task. And as
    wire speeds increase, the require


