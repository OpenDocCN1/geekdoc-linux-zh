  md: '# Understanding the Basics...


    # Avoid Skype Call Relays and File Transfer Relays


    If you do not want to relay your Skype calls or Skype file transfers, configure
    your network-to avoid this.


    # Blocking Skype


    To block Skype on their networks, administrators will, at best, find it difficult,
    since Skype, like Kazaa, was designed to intentionally get around the normal network
    security blocks. One of the few ways is to look at HTTP traffic and make sure
    that the headers and information are really HTTP traffic and not something like
    Skype just using port 80 to take advantage of the open port on most networks.
    Some vendors, such as BlueCoat and Verso, claim they can block Skype traffic.
    BlueCoat and Verso are enterprise-level solutions and therefore very expensive
    security appliances that are designed for large networks. BlueCoat recommends
    blocking Skype by preventing download of the Skype application and using protocol
    filters on the BlueCoat proxy. BlueCoat provides a free white paper titled "Best
    Practices for Controlling Skype within the Enterprise" available for download
    from its website, www.bluecoat.com/resources/resources/whitepapers.html.


    Verso attempts to block Skype by matching Skype communication patterns referred
    to as signatures. The Verso appliance has an active client that can receive updates
    to the appliance’s "black list" and algorithms used to block internet traffic,
    such as Skype. Additional technical information on blocking Skype will be discussed
    in Chapter 11.


    # Firewalls


    A security best practice is to block the use of the high-numbered ports on your
    firewall. Also, taking the approach of blocking everything outbound and allowing
    only what you need is recommended, with the understanding that it will mean more
    work for the security or network administrator. This approach is becoming much
    more common on firewalls, so if you have problems with your Skype connection,
    check your firewall to make sure it is not configured to block all traffic unless
    explicitly allowed on the outbound side.


    # Downloads


    If you have the capability to block certain downloads, you can block the Skype
    executables (skype.exe) from being downloaded. Using group policies can help prevent
    the installation of'
