- pgno: 33
  md: '# The Hardware Infrastructure • Chapter 27


    The bottom line when it comes to PBX features is that you need to read the associated
    security recommendations carefully. Some vendors have assembled detail guides
    for addressing toll fraud and feature access that are well over 100 pages, and
    you would be wise to find out what documentation exists. And don''t forget to
    back up your PBX regularly so that you don''t lose the security you created! More
    critically, if a VoIP vendor does not have these kinds of capabilities, would
    be wise to find out what can be done to reduce exposure to toll fraud. In some
    cases, the lack of feature-functionality in many VoIP solutions is a blessing
    because it reduces the opportunities for security-affecting misconfiguration.
    Yet at best this is a temporary benefit since VoIP solutions are becoming more
    sophisticated each and every year.


    ![](img/c45efece24bfbfca8be768fba195d8a4_33_0.png)


    # Toll Fraud


    Attackers have discovered a myriad of ways to make all the long distance calls
    they want from your PBX system, leaving you with the hefty collect-call charges.
    Here are a few:


    +   Even with security elsewhere, a caller can transfer to extension 9011 on a
    system where dialing 9 goes to an outside line and 011 is the international direct
    dial access code. Make sure your employees (particularly those that answer many
    external calls) know about this and consider using your PBX''s trace feature to
    track down the source of such calls (when you have even the call transferred to
    your security department as part of the trace feature)


    +   Attackers can read the same manuals online that your systems administrators,
    and the smart ones will figure out how to get around the obvious restrictions.
    For instance, if trunk access codes are restricted, it really won''t matter how
    well you''ve locked out other dial restrictions. And just because you don''t use
    your local trunks for long distance doesn''t mean an attacker won''t.


    +   Adding support for IP softphones or WiFi phones to a PBX means that a softphone
    or wireless phone could be used by a remote attacker who can get your IP network
    (by wire or wireless) for toll fraud and other nefarious purposes. In this case,
    defense of your IP network overall is what will minimize exposure to the PBX,
    but it''s important that the PBX not weaken overall IP security (by allowing WEP-based
    security on wireless networks shared by voice and data, for instance).


    ![](img/c45efece24bfbfca8be768fba195d8a4_33_1.png)'
