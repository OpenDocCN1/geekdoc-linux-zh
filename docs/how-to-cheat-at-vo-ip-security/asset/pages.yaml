- pgno: 100
  md: '# Peer to Peer


    change, meaning that clients can always find it on a network, making it important
    for such functions as finding other computers on the network.


    A peer-to-peer (P2P) architecture is different from the client/server model, as
    the computers involved have similar capabilities, and can initiate sessions with
    one another to make and receive requests from one another. Each computer provides
    services and resources, so if one becomes unavailable, another can be contacted
    to exchange messages or access resources. In this way, the user agents act as
    both client and server, and are considered peers.


    Once a user agent is able to establish a communication session with another user
    agent, a P2P architecture is established where each machine makes requests and
    responds to the other. One machine acting as the User Agent client will make a
    request, while the other acting as the User Agent server will respond to it. Each
    machine can then swap roles, allowing them to interact as equals on the network.
    For example, if the applications used file sharing, a U could request a specific
    file from the UAS and download it. During this time, the peers could also be exchanging
    messages or talking using VoIP, and once these activities are completed, one could
    send a request to terminate the session and end the communications between them.
    As seen by this, the computers act in the roles of both client and server, but
    are always peers by having the same functionality of making and responding to
    requests.


    # SIP Requests and Responses


    Because SIP is a text-based protocol like HTTP; it is used to send information
    between clients and servers, and User Agent clients and User Agent servers as
    a series of requests and responses. When requests are made, there are a number
    of possible signaling commands that might be used:


    +   - REGISTER Used when a user agent first goes online and registers their SIP
    address and IP address with a Registrar server.

    - INVITE Used to invite another User Agent to communicate, and then establish
    a SIP session between them.

    - ACK Used to accept a session and confirm reliable message exchanges.

    - OPTIONS Used to obtain information on the capabilities of another user agent,
    so that a session can be established between them. When this information is provided
    a session isn''t automatically created as a result.

    - SUBSCRIBE Used to request updated presence information on another user agent''s
    status. This is used to acquire updated information on whether a User agent is
    online, busy, offline, and so on.


    ![](img/c45efece24bfbfca8be768fba195d8a4_100_0.png)'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Architectures • Chapter 3 95


    +   - NOTIFY Used to send updated information on a User''s current status. This
    sends presence information on whether a User is online, busy, offline, and so
    on.


    +   - CANCEL Used to cancel a pending request without terminating the session.


    +   - BYE Used to terminate the session. Either the user agent who initiated the
    session, or the one being called can use the BYE command at any time to terminate
    the session.


    When a request is made to a SIP server or another user agent, one of possible
    responses may be sent back. These responses are grouped into six different categories,
    with a three-digit numerical response code that begins with a number relating
    to one of these categories. The various categories and their response code prefixes
    are as follows:


    +   - Informational (1xx) The request has been received and is being processed.


    +   - Success (2xx) The request was acknowledged and accepted.


    +   - Redirection (3xx) The request can''t be completed and additional steps are
    required (such as redirecting the user agent to another IP address).


    +   - Client error (4xx) The request contained errors, so the server cannot process
    the request


    +   - Server error (5xx) The request was received, but the server cannot process
    it. Errors of this type refer to the server itself, and they do not indicate that
    another server will be able to process the request.


    +   - Global failure (6xx) The request was received and the server is unable to
    process it. Errors of this type refer to errors that would occur on any user,
    so the request wouldn''t be forwarded to another server for processing.


    A wide variety of responses that apply to each of the categories. The different
    responses, their categories, and codes are shown in Table 3.6.


