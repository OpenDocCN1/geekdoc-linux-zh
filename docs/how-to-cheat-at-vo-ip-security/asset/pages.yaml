  md: '# Appendix 8 * The IP Multimedia Subsystem: True Converged Communications


    agreement with the user, the AV consists of five elements: a random number RAND,
    an expected response XRES, a Cipher Key (CK), an Integrity Key (IK), and an authentication
    token AUTN. S-SCSF sends an AV request to HSS together with the AVs (for instance,
    n), wanted.


    Upon receipt the AV request from S-SCSF, HSS sends an order of n AVs. Once S-SCSF
    receives them, it uses them on a first-in/first-out basis and sends them for authentication
    challenge to the UE. S-SCSF sends a SIP 4xx Auth_Challenge, that is, an authentication
    challenge to the UE including the range RAND, the authentication token AUTN in
    SM4. The challenge also includes the IK and the CK for the P-CSCF. S-SCSF also
    stores the RAND sent to the UE for use in case a synchronization failure should
    occur.


    When the P-CSCF sends SM5 it stores the key(s) and forwards the rest of the message
    to the UE, that is not revealed in the clear text. When the UE gets the challenge,
    it takes the AUTN, includes the MAC and a sequence number SQN and checks if the
    MAC is the same as XMAC and the SQN is correct. If both are successful, the UE
    performs the authentication, response RES using the random number, and authentication
    token. The UE puts it into the Authorization header and sends back to the P-CSCF
    that forwards it to the S-SCSF.


    When S-SCSF receives the SM9, it retrieves the active XRES for that and checks
    the validity of the authentication information by the UE. If the user is successfully
    authenticated, the S-SCSF sends a SIP 2xx Auth_OK message to I-CSCF that forwards
    the same message to the UE and completes the authentication procedure.


    # IMS Security Issues


    IMS was from its inception designed to be secure to eliminate many of the vulnerability
    issues that plague existing packet-based communication systems. The security of
    IMS has been specially fortified with the built-in security of IPv6. For instance,
    the use of IPSec could eliminate the vulnerabilities such as eavesdropping, tampering,
    and spoofing. However, it is expected to take a substantial amount of time to
    migrate from the existing IPv4-based network to IPv6. Hence 3GPP came up with
    a compromise solution called IMS. Early IMS uses IPv4 and it is expected that
    this model will be a popular implementation early IMS may not be fully compliant
    with the security features defined in TS 33.203 because of the potential lack
    of support IMS interface and inability to support the IPSec on UE platforms. Because
    IMS implementation is based on SIP, it also carries many security vulnerabilities
    as SIP. With the full IMS implementation based on IPv6 and when the security is
    in place, it is inevitable that IMS will have Denial of Service (DoS) attacks.


