- pgno: 369
  md: 'The rest of the act lays out regulatory mandates and responsibilities, mainly
    targeted at the FCC. Sections 102, 104, 107, and 109 mandate that the FCC establish
    regulations for systems security and integrity, associated technical requirements,
    and determinations for specific equipment, facility, or services. An important
    concept is also part of Section 107 and are known as “Safe harbor standards.”
    Section 107(a)(2) of CALEA allows a carrier to be deemed in compliance with CALEA’s
    capability requirements in Sections 103 and 106 if it complies with an appropriate
    publicly available technical standard. Also in Section 107 is a provision that
    allows a carrier to petition for an extension of the CALEA deadline when appropriate
    standards or technology is not available. Here’s the complete text of Sections
    106 and 107:


    # SEC. 106. COOPERATION OF EQUIPMENT MANUFACTURERS AND PROVIDERS OF TELECOMMUNICATIONS
    SUPPORT SERVICES.


    (a) CONSULTATION- A telecommunications carrier shall consult, necessary, in a
    timely fashion with manufacturers of its telecommunications transmission and switching
    equipment and its providers of telecommunications support services for the purpose
    of ensuring that current and planned equipment, facilities, and services comply
    with the capability requirements of section 103 and the capacity requirements
    identified by the Attorney General under section 104.


    (b) COOPERATION- Subject to sections 104(e), 108(a), and 109 (b) and (d), a manufacturer
    of telecommunications transmission or switching equipment and a provider of telecommunications
    support services shall shall, on a reasonably timely basis and at a reasonable
    charge, available to the telecommunications carriers using its equipment, facilities,
    or services such features or modifications as are necessary to permit such carriers
    to comply with the capability requirements of section 103 and the capacity requirements
    identified by the Attorney General under section 104.


    # SEC. 107. TECHNICAL REQUIREMENTS AND STANDARDS; EXTENSION OF COMPLIANCE DATE.


    (a) SAFE HARBOR-


    (1) CONSULTATION- To ensure the efficient and industry-wide implementation of
    the assistance capability requirements under section 103, the Attorney General,
    in coordination with other Federal, State, and local law enforcement agencies,
    shall consult with appropriate associations and standard-setting organizations
    of the telecommunications


    ![](img/c45efece24bfbfca8be768fba195d8a4_369_0.png)'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'industry, with representatives of users of telecommunications equip-

    ment, facilities, and services, and with State utility commissions.


    (2) COMPLIANCE UNDER ACCEPTED STANDARDS- A telecommunications carrier shall be
    found to be in compliance with the assistance capability requirements under section
    103, and a manufacturer of telecommunica-tions transmission or switching equipment
    or a provider of telecommu-nications support services shall be found to be in
    compliance with section 106, if the carrier, manufacturer, or support service
    provider is in compliance with publicly available technical requirements or standards
    adopted by an industry association or standard-setting organization, or by the
    Commission under subsection (b), to meet the requirements of section 103.


    (3) ABSENCE OF STANDARDS- The absence of technical requirements or standards for
    implementing the assistance capability requirements of section 103 shall not—


    +   (A) preclude the telecommunications carrier, manufacturer, or telecommu-nications
    support services provider from deploying a technology or ser-vice; or

    (B) relieve a carrier, manufacturer, or telecommunications support ser-vices provider
    of the obligations imposed by section 103 or 106, as appli-cable.


    +   (3) COMMISSION AUTHORITY- If industry associations or standard-set-ting organizations
    fail to issue technical requirements or standards or if a Government agency or
    any other person believes that such require-ments or standards are deficient,
    the agency or person may petition the Commission to establish, by rule, technical
    requirements or standards that—


    +   (2) protect the privacy and security of communications not authorized

    to be intercepted;


    +   (3) minimize the cost of such compliance on residential taxpayers;


    +   (4) serve the policy of the United States to encourage the provision of

    new technologies and services to the public; and


    ![](img/c45efece24bfbfca8be768fba195d8a4_370_0.png)'
  merge: -1
  img_proc: true
- pgno: 371
  md: '(5) provide a reasonable time and conditions for compliance with and the transition
    to any new standard, including defining the obligations of telecommunications
    carriers under section 103 during any transition period.


    (C) EXTENSION OF COMPLIANCE DATE FOR EQUIPMENT, FACILITIES, AND SERVICES


    +   (1) PETITION- A communications carrier proposing to install or deploy, or
    having installed or deployed, any equipment, facility, or service prior to the
    effective date of section 103 may petition the Commission for 1 or more extensions
    of the deadline for complying with the assistance capability requirements under
    section 103.


    +   (2) GROUNDS FOR EXTENSION- The Commission may, after consultation with the
    Attorney General, grant an extension under this subsection, if the Commission
    determines that compliance with the assistance capability requirements under section
    103 is not reasonably achievable through application of technology available within
    the compliance period.


    +   (3) LENGTH OF EXTENSION- An extension under this subsection shall extend for
    no longer than the earlier of—


    +   (A) The date determined by the Commission as necessary for the carrier to
    comply with the assistance capability requirements under section 103;


    +   (B) the date that is 2 years after the date on which the extension is granted.


    +   (4) APPLICABILITY OF EXTENSION- An extension under this subsection shall apply
    to only that part of the carrier’s business on which the new equipment, facility,
    or service is used.


    These extensions, once routine, are now scrutinized more closely by the FCC, FBI,
    and DOJ. For packet-based solutions like VoIP, the existence of adequate technical
    standards is forcing equipment manufacturers and carriers to show compliance with
    CALEA.


    # J-STD-025 and Other Technical Standards


    Shortly after CALEA was enacted, work began in SubCommittee TR–45.2 of the Telecommunications
    Industry Association (TIA) to create an appropriate technical interface'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'between Law Enforcement Agencies (LEAs) and Interim stand J-STD-025 was developed
    specifically to define services and features required by CALEA for "wineline,
    cellular, and broadband PCS carriers to support lawfully-authorized electronic
    surveillance, and specifies interfaces necessary to deliver intercepted communications
    and call-identifying information to a law enforcement agency.


    # Note


    J-STD-025 and subsequent TIA technical standards referenced by FCC regulations—although
    available to the public—are not free. They can be purchased on the TIA Web site
    (see www.tiaonline.org/standards/CALEA_JEM for more information) or through the
    Alliance for Telecommunications Solutions (ATIS—see www.atis.org/atis/docstore/for
    more information). In general, most of the standards referenced in this section
    require membership or document fees to be paid in order to access the associated
    standard.


    Originally published in December, 1997,J-STD-025, the standard was the subject
    of a March 27, 1998, Joint petition to the FCC from the DOJ and FBI, who argued
    that it was deficient in nine specific areas. This list commonly referred to as
    the FBI "punch list" of additional capabilities, which of were subsequently required
    by the FCC and incorporated into the revised J-STD-025-A specification, published
    by TR-45.2 in May, 2000. Since that time, a number of standards were developed
    by other industry groups and are recognized by the FBI and FCC as meeting the
    safe harbor provisions of CALEA. Many of these have been coordinated with ongoing
    TR-45 LAES on J-STD-025. Among these standards:


    +   - TIA TR-45 LAES J-STD-025B for CDMA2000 packet data intercepts

    - T1P1.T724 for GPRS packet data intercepts

    - T11.T678 for VoIP and other wire-line data intercepts

    - PKT-SP-ESP-103-40113 for PacketCable data intercepts

    - AMTA Electronic Surveillance for ESMR Dispatch Version 1.0 for ESMR Push-To-Talk
    intercepts

    - American Association of Paging Carriers (AAPC) Paging Technical Committee (PTC)
    CALEA Suite of Standards, Version 1.3 for Traditional Paging, Advanced Messaging,
    and Ancillary Services (see www.pagingcarriers.org/ptc.asp for freely available
    standard)'
