- pgno: 218
  md: '# Tools & Traps...


    We recently observed a situation where plugging in a single phone brought down
    a substantial piece of the network. The IP phone had two RJ45 plugs in the back
    and a technician mistakenly plugged both of these into a nearby axis switch running
    STP. No one realized (until later) that the IP phone failed to bridge spanning
    tree BPDUs. The resulting broadcast storm took out several cores. This problem
    was solved temporarily with a bit of glue and some RJ45 plugs.


    The most important rule for securing softphones is to harden the underlying operating
    system. Malware that affects any other application on the PC can also interfere
    with voice communications. The flip-side is also true—malware that affects the
    VoIP software will affect all other applications on the PC and the data services
    available to the PC (a separate VoIP phone would require access to file services,
    databases, etc.). Softphones that contain any type of advertising software must
    be banned in a secure environment. Softinstallation targets should be tested before
    deployment and those that do not encrypt user credentials should be prohibited.


    Because PC workstations are necessarily on the data network, using a soft system
    conflicts with the requirement to separate voice and data networks since the principle
    of logically separating voice and data networks is defeated because the PC must
    reside in both domains. One solution to this is dual home workstations—dedicated
    one NIC to the data domain and one NIC to the voice domain. This arrangement still
    allows for possible routing of information between domains via a workstation.
    Cisco recently has introduced a Certificate Trust List (CTL) that contains among
    other information, the IP addresses of trusted VoIP peers. However, this feature
    is available only in selected IP phones and requires, for the most part, setup
    and maintenance of a complex certificate infrastructure. Additionally, unless
    complex firewall rules are implemented, non-VoIP related data can enter the voice
    domain from গ্রহণের. Frankly, there is no single good security solution to the
    issue of softphones on workstations in split voice/data environments. In a highly
    secure environment, your best choice is to ban them by policy and monitor for
    illicit usage via IDS or IPS.'
