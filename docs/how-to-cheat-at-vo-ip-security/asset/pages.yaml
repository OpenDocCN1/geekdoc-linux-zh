    the midcom protocol has yet to be finalized by the IETF.


    # STUN, TURN, and ICE


    The following protocols and frameworks are methods for enabling SIP, but not H.323,
    to work in the presence of NATs. STUN (Simple Traversal of UDP through NATs) is
    a client server protocol designed to enable an endpoint to discover its IP address
    and the type of NATs between the endpoint and its peer. The STUN protocol describes
    a STUN-enabled client for private IP space and its means of communication with
    a public STUN server. The public STUN server informs the private client of the
    client''s public IP (IP address and port) within following list of public STUN
    servers active at the time of this writing:


    +   - stun.fwdnet.org 69.90.168.14

    - stun.fwd.org 64.186.56.73

    - stun01.siphone.com 69.0.208.27

    - stun.softjys.com 69.3.254.11

    - stun.voxgratia.org 83.103.82.85

    - stun1.vovida.org 128.107.250.38

    - xtnnels1.xten.net 64.69.76.23


    STUN is relatively successful in residential VoIP deployments, but it is not an
    enterprise solution for a number of reasons. Key among these are STUN does not
    support TCP (TCP conformance is mandated by the SIP draft), and STUN does not
    work in the presence of symmetric NATs (the binding table entry for a symmetric
    NAT is based on source IP and port, and destination IP and port), which are the
    most common type of NATs in the enterprise.


    STUN has been enhanced by the addition of the TURN protocol (Traversal Using Relay
    NAT). TURN is identical in syntax and general operation to STUN, but differs in
    behavior. In a similar STUN exchange, the private client sends a UDP packet to
    a public STUN server. The STUN server copies the last (closest to the STUN server)
    public IP address and mirrors this information to the private STUN client. No
    resources or band-'
