    The layers of the OSI reference model have different functions that are necessary
    for transferring data across a network, and mapping protocols to these layers
    make it easier to understand how they interrelate to the network as a whole. Table
    3.5 shows the seven layers of the OSI model, and briefly explains their functions.


    # Table 3.5 Layers of the OSI Model


    | Layer | Description |

    |---|---|

    | 7: Application | The Application layer is used to identify communication partners,
    facilitate authentication (if necessary), and allows a program to communicate
    with lower layer protocols, so that in turn it can communicate across the network.
    Protocols that map to this layer include SIP, HTTP, and SMTP. |

    | 6: Presentation | The Presentation layer converts data from one format to another,
    such as converting a stream into a pop-up window, and handles encoding and encryption.
    |

    | 5: Session | The Session layer is responsible for coordinating sessions and
    connections. |

    | 4: Transport | The Transport layer is used to transparently transfer data between
    computers. Protocols that map to this layer include TCP, UDP, and RTP. |

    | 3: Network | The Network layer is used to route and forward data so that it
    goes to the proper destination. The most common protocol that maps to this layer
    is IP. |

    | 2: Data Link | The Data Link layer is used to provide error correction that
    may occur at the physical level, and provide physical addressing through the use
    of MAC addresses that are hard-coded into network cards. |'
