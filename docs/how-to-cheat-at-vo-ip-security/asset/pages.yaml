    # What a HIPAA Consultant Will Tell You


    My experience with HIPAA consultants is that of few them have thought about what
    happens when you record a VoIP conversation and what documentation is required
    for the system overall when you do. Nearly all agree that VoIP by itself does
    not create HIPAA requirements. The question is how documentation is required for
    voicemail and other recording technologies.


    Given the flexibility the Security Rule allows, my suggestion is to document just
    part of the system involved in recording, or even with limited scope there will
    be plenty to document. If the VoIP system connects or interfaces with an Interactive
    Voice Response (IVR) system, that may need to be documented as well if it can
    be used as a gateway to PHI contained on a database system behind it.


    ![](img/c45efece24bfbfca8be768fba195d8a4_361_0.png)


    # Core HIPAA-Compliance Issues

    for IP Communications Systems


    Although HIPAA regulations only briefly touch on voice communication systems at
    all, several general principles still apply. The first, use of VoIP by itself
    does not create any electronic records unless some related system is recording
    a session containing Protected Health Information (PHI). In that case, the system
    doing the recording will fall under HIPAA requirements. This means that voice
    messaging and calling equipment may require fully documented HIPAA-compliant operational
    processes. Second, if a VoIP-related system (such as a VoIPXML server) is a gatekeeper
    to databases or other record-keeping systems that contain PHI, then HIPAA will
    also apply. Another example of this is an IVR system that front-ends patient records
    or billing systems.'
