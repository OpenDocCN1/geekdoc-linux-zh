    It secures the confidentiality of RTP payloads and the integrity of all RTP packets
    by adopting the Advanced Encryption Standard (AES) as a default encryption/decryption
    algorithm using a symmetric cryptographic key. It also protects against replayed
    packet attack. The most sensitive issue in SRTP is how the secret key can be shared
    between two communicating nodes. Embedding the manually in all the phones is too
    cumbersome and error prone. For efficiency, RTP and SRTP can be implemented as
    one layer, rather than two separate layers. TLS and SRTP are the key components
    that play a major role in securing VoIP service.


    However, there may be supporting protocols or an infrastructure that can authenticate
    users, validate node/user certificates, exchange cryptographic keys. Each of these
    elements should work together in harmony to produce secure VoIP service.


    # S/MIME: Message Authentication


    In order to secure Internet mail, the message must be protected from tapping and
    tampering, and the receiver must also be correctly identified. The reason why
    Spam e-mailing thrives these days is that the e-mailer can be easily forged or
    spoofed.

    Secure/Multipurpose Internet Mail Extensions (S/MIME), specified in the Certificate
    Handling (RFC 3850) and Message Specification (RFC 3851) RFCs, provide a standard
    for public encryption and for signing e-mail encapsulated in the popular MIME
    format. S/MIME provides the following cryptographic security services for electronic
    messaging applications: authentication, message integrity, nonrepudiation of origin
    (using digital signa


