    providers to provide then their new and existing subscribers with 911 service
    no later than November 28, 2005.The FCC accompanying press release gives an excellent
    summary of the resulting regulations:


    > Specifically, as a condition of providing interconnected VoIP service, each
    interconnected VoIP provider must, in addition to satisfying the subscriber notification,
    acknowledgment, and labeling requirements set forth in section 9.5(e) of the Commission''s
    rules.'
