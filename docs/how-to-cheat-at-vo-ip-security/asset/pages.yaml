- pgno: 390
  md: '# Regulatory Compliance • Appendix C 387


    # Article 8 - Presentation and restriction of calling and connected line identification


    +   1. Where presentation of calling-line identification is offered, the calling
    user must have the possibility via a simple means, free of charge, to eliminate
    the presentation of the calling-line identification on a per-call basis. The calling
    subscriber must have this possibility on a per-line basis.


    +   2. Where presentation of calling-line identification is offered, the called
    subscriber must have the possibility via a simple means, free of charge for reasonable
    use of this function, to prevent the presentation of the calling line identification
    of incoming calls.


    +   3. Where presentation of calling-line identification is offered and where
    the calling line identification is presented prior to the call being established,
    the called subscriber must have the possibility via a simple means to reject incoming
    calls where the presentation of the calling line identification has been eliminated
    by the calling user or subscriber.


    +   4. Where presentation of connected line identification is offered, the called
    subscriber must have the possibility via a simple means, free of charge, to eliminate
    the presentation of the connected line identification to the calling user.


    +   5. The provisions set out in paragraph 1 shall also apply with regard to calls
    to third countries originating in the Community; the provisions set out in paragraphs
    2, 3 and 4 shall also apply to incoming calls originating in third countries.


    +   6. Member States shall ensure that where presentation of calling and/or connected
    line identification is offered, the providers of publicly available telecommunications
    services inform the public thereof and of the possibilities set out in paragraphs
    1, 2, 3 and 4.


    # Article 9 - Exceptions


    Member States shall ensure that the provider of a public telecommunications network
    and/or publicly available telecommunications service may override the elimination
    of presentation of the calling line identification:


    ![](img/c45efece24bfbfca8be768fba195d8a4_390_0.png)'
