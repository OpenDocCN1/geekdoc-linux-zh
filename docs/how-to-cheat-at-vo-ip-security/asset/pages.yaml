  md: '# The Hardware Infrastructure • Chapter 2 25


    can 56kbps switched data. ISDN T1 trunks have 22 channels of voice (bearer, or
    B channels) and a 64 channel for signaling (the data, or D channel) that can support
    ISDN User Part (ISUP) messages, including Automatic Number Identification, which
    allows calling and called number information to be sent (although it can be spoofed;
    as discussed in Chapter 3). In Europe and internationally, the E1 is the typical
    digital interface, with an ISDN BRI carrying 30 channels (30B+D) as opposed to
    the 23 supported by ISDN T1 (23B+D).


    VOIP trunks come in various flavors, including H323, SIP, and proprietary protocols
    like Inter-Asterisk eExchange (IAX). In some cases, IP-enabled PBX systems use
    gateway control protocols with VOIP trunks, as Simple Gateway Control Protocol
    (SGCP), H.248/Megaco/Media Gateway Control Protocol (MGCP), Skinny Gateway Control
    Protocol. One of the difficult problems with VOIP trunks, however, is feature
    transparency between vendors. ISUP/Q931 or its private equivalent (QSIG) has the
    most complete feature interoperability, and standards for mapping these onto H323
    and SIP, but these are not evenly supported by PBX vendors at this point. Robust,
    reliable interfacing between different PBX vendors over VOIP is not easy to find
    (and is still a challenge over tie lines).


    # PBX Features


    PBX systems provide a plethora of features typically offered by a telephone provider,
    such as call waiting, three-way calling, conference calling, voicemail, additional
    call appearances, and many other routing features. Some vendors count 600 or more
    separate features among their capabilities, far more than offered by any carrier
    on a central office switch as subscriber services. But often overlooked in this
    list are those used for access control.The PBX is effective farewell to the PSTN
    and voice access as PBX capacity per-minute and geographic costs associated with
    each call, each of PBX capability should be a critical consideration for product
    selection, configuration, and ongoing operations. At the same time, the data security
    community is rarely concerned with this characteristic because it''s not a data
    issue, yet even in a VoIP system will be PSTN connectivity; whatever might with
    this?


    Say a company has 200 employees, each with a phone on their desk. Without a PBX,
    each employee would require their own pair of copper wires from the CO, each with
    their own phone number that routes to their desk. However, it''s a safe bet that
    not all 200 employees will be on the phone all the time, and it''s likely that
    most of calls will be to other employees. This is where a PBX really pays off.
    A business or campus will need many fewer lines from the Local Exchange Carrier
    (LEC); in the previous example, the company might require only 40 outlets, routing
    those calls onto the PSTN trunk lines as necessary on per call basis. They also
    rent 200 Direct Inward Dial (DID) numbers from the LEC, which terminate those
    trunk lines. The PBX will then route the inbound call based upon which DID number
    was dialed to reach it.


