    VLANs provide some security and create smaller broadcast domains by creating logically
    separated subnets.s are a common, sometimes noisy phenomenon in data networks.
    Creating a separate VLAN for voice reduces the amount of broadcast traffic (and
    unicast on a shared LAN) the telephone will receive. Separate VLANs can result
    in more effective bandwidth utilization, and reduce the processor burden on IP
    telephones and PCs by freeing them from analyzing irrelevant broadcast packets.
    Management traffic can be segregated on a management VLAN so that SNMP and syslog
    traffic do not interfere with data traffic. This also has the benefit of adding
    a layer of security to the management network. Additionally, VLANs can be used
    in conjunction with various quality of service mechanisms (see next section) to
    further isolate and prioritize voice traffic.


    The consequences of DoS attacks can be mitigated by logically separating voice
    and data segments into discrete VLANs. Segregation of network traffic requires
    IP traffic pass through a Layer 3 device, thereby enabling the traffic to be inspected
    at the ACL level. VLAN


