    # HIPAA: Health Insurance Portability and Accountability Act


    Within the U.S. Health Insurance Portability and Accountability Act of 1996, Congress
    adopted a broad road of reforms and standards to improve healthcare and health
    insurance and move toward electronic transaction processing and recordkeeping..
    As of the 1996 Act, Congress acknowledged the need for privacy standards, but
    it failed to produce them in time to meet its deadline; that job fell to the Department
    of Health and Human Services (HHS), which issued the final rule for privacy in
    December 2000. The final security rule was issued by HHS in February 2003.


    # HIPAA Regulatory Basics


    The privacy and security mandates that can affect VoIP systems are in Title II,
    Subtitle F, Part C – Administrative Simplification. There are three aspects to
    Title II, Code Sets, and Security; HHS has issued detailed regulations for all
    three, but only the two that can apply to VoIP systems are Privacy and Security.


    Critical to understanding HIPAA is the concept of Protected Health Information
    (PHI) or Individually Identifiable Health Information (IIHI). Think of IIHI or
    PHI as any set of information that contains health-related data for an individual
    that can be traced back to that person. In order to share health-related information
    with other individuals or groups that participate in a patient’s care, a Covered
    Entity (organization subject to HIPAA) must first receive the patient’s consent
    to share PHI with those participants (insurance, billing, physicians, hospitals,
    pharmacies, and so forth). Protection of PHI by a Covered Entity is the objective
    of the HIPAA Privacy Rule and Security Rule.


    # Direct from the Regulations


    Privacy in HIPAA is addressed in Section 264 (ofTitle II, Subtitle F, Part C).
    The HHS Privacy Rule is based on this in the Act:


    +   The recommendations under subsection (a) should address at least the following:
    (1) The rights that an individual who is a subject of individually identifiable
    health information should have. (2) The procedures that should be established
    for the exercise of such rights. (3) The uses and disclosures of such information
    that should be authorized or required.


    Three years and over 52,000 comments later, the first HHS Final Rule for Privacy
    was published, and after four more amendments (the last of which was in April
    2003)


