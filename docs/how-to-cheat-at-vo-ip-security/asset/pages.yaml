- pgno: 298
  md: '# Validate Existing Security Infrastructure • Appendix A


    Regardless of the starting point, my experience has that policy development is
    an iterative process—policy first is broken down into modules (see sidebar for
    an example listing of high-level modules), modules are assigned to the appropriate
    individuals, and each module is then edited by steering committee members. After
    several cycles through this process, a draft version 1.0 is produced.


    The draft security policy document should be evaluated by the security steering
    committee based upon a number of characteristics:


    +   - Is the scope of the document appropriate?


    +   - To whom does the policy apply (i.e., all employees, full-time employees
    only, contractors, consultants, customers)?


    +   - Are the organization''s information assets comprehensively defined and are
    the appropriate controls implemented?


    +   - Is the policy consistent with existing corporate directives and guidelines,
    and with applicable legislation and regulations?


    +   - Is the document concise? Can it be understood and remembered by all affected
    parties? I''ve seen several security policies numbered over 100 pages. I believe
    that, in the case of security policy development, shorter is always better. Any
    policy longer than 40 to 50 pages will not be read or remembered by most users.


    +   - Are the policy guidelines reasonable? That is, can the normal person follow
    the policy directives and still perform their regular duties? Are the consistent
    with current technology, organizational culture, and mission?


    +   - Does the document leave room for good judgment? All relevant personnel should
    be responsible for exercising good judgment regarding the reasonableness of personal
    use resources. Employees should understand that effective security is a team effort
    involving the participation and support of all who deal with information and/or
    information systems.


    +   - Is the document extensible?'
