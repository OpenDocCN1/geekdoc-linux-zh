- pgno: 165
  md: '# Chapter 6 • Confirm User identity


    # Introduction


    Authentication is a measure of trust. The point of this chapter is to illustrate
    trust complexities and to cover authentication of both user identity and device
    identity.These identities are not equal. Authentication in the networking world,
    in general, is based either on using a shared secret (you are authenticated if
    you know the secret) or on public key-based methods with certificates (you prove
    your identity by possessing the correct private key). Authentication establishes
    the identities of users and devices to agree that that is in accord with your
    security policies. Authorization, on the other hand, establishes the amount and
    type of network and application resources authorized individuals and devices are
    able to access.


    Device authentication can be automated and transparent to the user based on assigning
    and verifying a unique profile for the device.This profile may include attributes
    such as model, serial number, MAC address, IP address, physical location, time-of-day,
    and on, and may include a shared secret or a certificate. Device authentication
    literally blocks rogue endpoints from accessing any network. In a VoIP environment,
    this prevents malicious devices from placing unauthorized calls or causing other
    mischief. Some of the 802.1x and 802.11 standards described later in this chapter
    can be used as part of an automated authentication process.


    Everyone who has logged on to a computer is familiar with user authentication.
    Users identify themselves to an authenticator by presenting credentials. The most
    common of these are username/password combination, although using other methods
    including biometric or token-based methods. Common network-based authentication
    methods include Windows domain authentication, NIS+, and Kerberos. Windows 2000
    and later platforms offer two default authentication mechanisms:MS Kerberos and
    NTLM. Most users believe that logging on to an account in a Windows domain gives
    them access to the network. That is not true. When the Kerberos protocol (the
    default) is used for network authentication, the user''s first access is to the
    domain authentication service, which ultimately provides access to network resources.


    In order to secure VoIP networks, the identity of both the user and the device
    must be verified. This is accomplished in a number of ways. Network-based authentication
    methods such as those mentioned earlier in this chapter often used, and in many
    environments, this authentication is considered sufficient for virtually unrestricted
    access to network resources. However, as we argued in Chapter 1, network boundaries
    are disappearing, network users are increasingly mobile, more types and quantities
    of devices are registering with the network, and devices no longer even require
    a physical link to network resources. The addition of VoIP resources to the existing
    infrastructure adds to this complexity.The aforementioned mechanisms are not sufficient
    to cope with these new sophisticated technologies.


    Some simple fixes are available. User identity can be confirmed using a method
    as simple as HTTP Digest authentication, and devices can simply be filtered by
    MAC address lists.'
  merge: -1
  img_proc: true
