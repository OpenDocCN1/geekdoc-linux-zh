- pgno: 276
  md: '# Chapter 11 • Skype Firewall and Network Setup


    latency and improving quality call. Allowing UDP ports prevents internal contention
    of port translation in the NAT translation table.


    In a perfect world, all outgoing TCP ports would be open through the firewall
    or Internet gateway. If it is not possible to allow all outgoing ports,TCP port
    80 should be opened. Using port 80 is a standard practice. When Skype attempts
    to log on, it tries to connect using random ports. If Skype cannot connect, it
    attempts to connect via port 80. If port 80 cannot be opened, Skype attempts to
    use port 443. There is no guarantee that Skype will work through port 80 if the
    firewall or proxy server is restricting traffic to the HTTP. By restricting traffic
    to HTTP, the proxy server or firewall can scan the packets to ensure the data
    is actually HTTP data. Skype does not use HTTP and will function correctly through
    port 80 if traffic is restricted to HTTP traffic. If you receive errors #1101,
    #1102, or #1103 the firewall may be blocking port 80.


    When Skype installs, it will select a random UDP port to communicate. This port
    setting is found in the Connection tab under Options (see Figure 11.5) and is
    an adjustable setting and stored in the shared.xml file for each computer and
    will be the same for all users of Skype. If you want to allow relayed Skype calls
    and relayed file transfers, you can open the UDP port on your firewall that is
    specified in Skype to allow for better voice call quality and faster file transfers.


    Understanding that these UDP ports changes the normal corporate security policy,
    proper approval and risks associated with opening anything on your firewall should
    be weighed prior to opening these settings. Discuss this thoroughly with your
    information security team on the impacts and what additional layers of security
    could be implemented to mitigate any risks, as enabling a client-side personal
    firewall solution discussed earlier in this chapter. You could allow TCP/or UDP
    inbound on ports in Skype options for all clients internal to the firewall. If
    necessary, Skype will use TCP ports 80 and 443, respectively, to communicate with
    other Skype peers, and this will create Skype calls and slow file transfers.


