  md: '# Small to Large Companies


    In large companies, this will not be feasible and may possibly be against the
    corporate security policy and allow networks, but this does remain an option for
    medium-sized businesses that desire better communication quality and the flexibility
    to modify their firewall rules. Some firewalls allow rules to be enabled during
    a specific time frame, and outside of that window, the rule is disabled. If you
    wish to limit the use of Skype to only off-business hours, this type of feature
    would provide better security without leaving the port open all the time. With
    any modification to your firewall rules, be sure to check your corporate security
    policy and with corporate security and network team to gain approval and to understand
    the potential risks that are associated with opening any ports on a firewall to
    an internal client. Additional layers of security should be implemented if this
    configuration is to be used. If any peer-to-peer communication is allowed, it
    is recommended that the clients have a personal firewall solution to further protect
    the systems from malicious activity.


    # How to Block Skype in the Enterprise


    From a security and network administrator''s point of view, the very same features
    that make Skype connect reliably through a restrictive firewall present a challenge
    to preventing or blocking Skype traffic on a network. Skype is very robust and
    can function with access to all port 80. Most applications allow outbound Web
    traffic, so port 80 (HTTP) must remain open. Port 443 is the SSL port (HTTPS),
    and secure Web sites require this port to remain open. It is not as simple as
    blocking ports to prevent Skype from functioning.


    Several tasks must be completed to block Skype in your enterprise. The first step
    is to block access to the Skype downloads to prevent the executable from being
    installed on your client machines. This practice is referred to as blacklisting.
    This step is not entirely effective by itself, since some users might already
    have the Skype client installed or be installing the package from no CD or thumb/flash
    drive.


    It is good practice to prevent unnecessary applications from accessing the Internet.
    The best way to achieve this is by blocking all ports on the firewall and then
    selectively allowing known traffic to pass, the "deny all unless explicitly allowed"
    mentality. In addition, you may choose to restrict access to Internet Internet
    except those that have been approved by your organization. This is referred to
    as white listing, and although it requires more maintenance, it is much more secure.


    Another method to prevent communication over the Internet is to use packet filters.
    Packet filters examine the data inside the headers of transmitted packets. This
    information can be used to create rules to dump messages that contain headers
    that meet the filter criteria.


    Unfortunately, Skype data is encrypted, so packet filters are unable to examine
    the information in the data packets; therefore, packet filtering is useless. However,
    a hardware device is pur'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Skype Firewall and Network Setup • Chapter 11 283


    ported to identify the signature of Skype communication and block Skype traffic
    based on that identification.


    In a corporate enterprise environment, you may have other software solutions that
    allow the use of application filters on the desktops. This is another effective
    way to block Skype. The method of policies depends on the platform, but essentially,
    the concept is the same. When a user attempts to execute a program that is defined
    as disallowed, the process that monitors the client will prevent the program from
    executing. An example of this would be to use Microsoft Systems Management Server
    and define a restriction on the Skype.exe executable. Network Associates and Symantec
    have similar features built in to their groupby products.


    Skype is very effective at finding ways to communicate with other Skype peers.
    There is no straightforward way to block Skype in the enterprise. The most effective
    method is to prevent the program from running at all or scan for it on all systems
    that are not approved and delete from each system.


