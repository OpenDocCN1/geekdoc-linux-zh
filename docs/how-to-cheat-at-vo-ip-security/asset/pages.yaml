    In this example, Alice is initiating a connection with Bob. Alice’s Offer packet
    identifies that she supports three types of audio connections (PCMU, PCIA, and
    iBC), as well as two types of video connections (H.261 and MPV). Once Bob’s client
    has received the invitation and parsed the values, it chooses a compatible audio
    and video format and reports back. In the answer packet shown earlier in this
    chapter, Bob’s client responds back wishing to communicate with PCMU audio and
    MPV video.


