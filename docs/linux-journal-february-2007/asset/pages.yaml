    # Integrating Perl with PHP


    The greatest advantage of integrating Perl with PHP is its ability to access CPAN
    modules. While CPAN modules are done via Perl, you can use the interpreter to
    call them from PHP. So, if you want to do anything, which is not PHP—for example,
    it allows you to write to IO ports. Writing to IO ports is the exclusive domain
    of C++ programs, but with Perl, even the Perl scripting language can have the
    capability to write to IO ports. The example below discusses the features of PHP::Interpreter
    to allow Perl/PHP integration. The interpreter, invoked via Perl::Interpreter,
    has a class that allows PHP to communicate with Perl. The access of the class
    in this case will


    ```

    1. <?php

