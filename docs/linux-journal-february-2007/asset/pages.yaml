  md: "# Simple Access Berkeley DB Using STldb4\n\nSTldb4 C++ programming with the\
    \ Berkeley DB is simpler and more effective.\n\nBEN MARTIN\n\nThe Berkeley library\
    \ provides a solid implementation of the B-Tree and Hash file structures. The\
    \ implementation includes support for transactions, concurrent access to database\
    \ files from multiple processes, and secondary indexing as well. In this article,\
    \ I use the term database to refer to a file or hash managed database that supports\
    \ various lookup types.\n\nThe standard distribution of Berkeley DB comes with\
    \ both C and C++ APIs. Unfortunately, the Berkeley DB C API is very different\
    \ from modern C++ designs, such as smart pointers, standard I/O streams, iterators,\
    \ etc. As a concrete example of the lack of reference counted pointers, the Berkeley\
    \ DB API for db:get(), shown in Listing 1, includes two pointers and the ownership\
    \ of the memory for these is not immediately obvious.\n\nListing 2. STldb4 Setting\
    \ and Getting Values\n\n```\n#include <iostream>\n#include <STldb4/stldb4.hh>\n\
    using namespace std;\n\nint main(int argc, char **argv) {\n  Database *db = new\
    \ Database(DB_BTREE, argv[1]);\n  db(\"foo\") = \"bar\";\n  cerr << \"foo is set\
    \ to: \" << db(\"foo\") << endl;\n  return 0;\n}\n```\n\nListing 1. Berkeley DB\
    \ C++ API db:get()\n\n```\n#include <db.h>\nint db_get(DB *db, const char *key,\
    \ char *data, uint32_t *flagsize);\n```\n\nThe STldb4 shows how to make the Berkeley\
    \ DB from C++. The STldb4 API makes to simple database interface while still making\
    \ memory management easier. The Berkeley DB object behaves similarly to a C++\
    \ collection allowing upserts and settings of elements using an array interface.\
    \ For example, shown in Listing 2, a database created with arg(argv[1]) will contain\
    \ a Berkeley DB-tree file containing the foo-bar data.\n\nThe standard Database\
    \ and the reference constructor for this class is shown in STldb4 where the smart\
    \ pointer for foo will handle. Databases are created using the constructor and\
    \ destroyed using the operator(). The main difference between ours and C++ is\
    \ that create creates a database object for the specified B-tree or will create\
    \ a new database at the path if it not exists.\n\nIn example 1, you don't have\
    \ to delete the database explicitly, because the smart pointer to the database\
    \ object will handle that\n\nStandard C++ collections have such features, as size(),\
    \ iterators; (begin(), end()), get(), and insert(). Our Berkeley DB also provides\
    \ partial versions of the latter methods. The partial versions allow the looking\
    \ up of key in a B-tree file. A bidirectional iterator is returned by many of\
    \ the methods.\n\n# Storing Objects\n\nOne major difference between the Database\
    \ and a C++ collection is that the key and value are not portable. The main reason\
    \ for this is that the items in Database object are not in RAM but are read from\
    \ disk. In order not to limit the flexibility offered by Berkeley DB, the Database\
    \ supports storing arrays of heterogeneous collections of objects.\n\nThe listed\
    \ objects are created using implicit construct and stored in heap objects. Shown\
    \ in Listing 5, the Person class stores many objects about the people. The implicit\
    \ constructor takes a DatabaseValue&Ref, which is returned by the array operator\
    \ in Database. A Person object is implicitly converted to a std::string to be\
    \ enabled to be stored as disk. As man\n\nWhen storing in the database, using\
    \ the standard I/O"
