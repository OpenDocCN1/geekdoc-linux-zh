  md: "# # Gnullad and Void\n\n# # Tech Tips with Gnullad and Void\n\nRecovered a\
    \ MySQL table and save partition images.\n\n### Hey sweeties, I'm Void, and my\
    \ husband Chester kept some tips for you all. Like I last time, Chester isn't\
    \ so talker, so I'm here to do the writing! Now, I know you ain't had much time\
    \ to spend in tips since last month, but we can't be doing this service for all\
    \ you without their help. So in a time, honey, we can keep this thing up. We use\
    \ the hosting for these things, and you've made it out for us we will pay you\
    \ $10 for every tip you use. If there is some impact on your database, then Chester\
    \ can use. He'll pick 'em and I'll sort it out in them. In the meantime, we'll\
    \ get that editor stick in another tip, and we'll get a gooodle from! Paddy's\
    \ here.\n\n### Hedge Upgrade Bets by AMD64\n> Sometimes it doesn't make sense\
    \ to assume upgrades are a good thing. Partition to save an image of your old\
    \ version first. The new version might impact the image out just one back—Chester\n\
    \nI run multiple distributions for various reasons. For example, I run 32-bit\
    \ Ubuntu and 64-bit Ubuntu. I spend more time on 64-bit Ubuntu, but some packages\
    \ are easier to use and on 32-bit Ubuntu, Skyluke, for instance.\n\n# ### Recover\
    \ a MySQL table with Zanda Recovery Method\n\n> Somebody save a MySQL table. Drop\
    \ your DBA. If you then do this—Chester says\n\nA MySQL database administrator:\
    \ You can recover your MySQL database, somebody drops table in the MySQL application\
    \ (for example the 'accounts' table in a SugarCRM). The application no longer\
    \ works. How can you recover the data from it?\n\nThe answer is binary logs. Binary\
    \ logs track all updates to the database. If binary logs are enabled on the server,\
    \ you can use the mysqlbinlog tool to recover the MySQL database.\n\nA more comprehensive\
    \ solution is to use the Data Recovery Method (RMR) for MySQL. The RMR tool allows\
    \ you to recover the binary logs and directly restore the database from incremental\
    \ backup but without downtime.\n\n### Running Partition on 64-bit AMD64\nPartition\
    \ is finicky and refuses to run on a 64-bit system. Beyond that, there is a partition\
    \ package you can use for AMD64, but it doesn't work. In case, I want to boot\
    \ AMD64 and upgrade my 32-bit Ubuntu into 64-bit, so the fact it works on 32-bit.\n\
    \nOr is it? It is actually quite easy to get partition working on AMD64. Simply\
    \ download the basic form of partition using the de-facto method. Then create\
    \ the partitions with the/dev/sd disks. Then it should work fine under Linux.\n\
    \nYou should check if you have a /dev/dev image before using the partition. If\
    \ you don't, it will be greeted with a screen the like\n\n```\n# mysql-zrm -action\
    \ restore --source-directory=/var/lib/mysql/sugarcrm/binlog.000006089510163/\n\
    \n# mysql-zrm -action restore --source-directory=/var/lib/mysql/sugarcrm/binlog.000006089510163/\n\
    --start-point 1160\n```\n\nHere we do recover incremental backup from the drop\
    \ table in SugarCRM. Do two commands to restore from the incremental backup to\
    \ Sept 15th, 2006, without executing the drop TABLE at log position 11599.\n\n\
    ```\n# mysql-zrm -action restore --backup-set sugarcrm \n--source-directory=/var/lib/mysql/sugarcrm/binlog.000006089510163/\
    \ \n--start-point 1160\n```\n\nSee the Zanda Recovery Method for MySQL for more\
    \ information: mysqldump.zanda.com - Paddy Steen\n\n![](img/6ad2c38f7c331af69e079dec652dce53_22_0.png)\n\
    \nFigure 1. Partition waits the /dev/dev image created.\n\n20 | February 2007\
    \ | linuxjournal.com"
