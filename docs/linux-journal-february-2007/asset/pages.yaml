  md: '# # Painless Thumbdrive Backups


    Exploit udev rules to back up Flash drive daily or every time you insert it.


    **ANDREW FABROW


    **Raise your hand** if you''ve ever lost (or worried you lost) a USB thumbdrive.
    You spent hours frantically searching the house, and then you realized that you
    didn''t check your pockets thoroughly where you put that load in.


    You have a backup of all that data, right? You religiously hope so. You copy the
    data to a backup directory and set a regular schedule.


    That sounds like an awful lot of work for me, and I want to avoid boring working.
    Naturally, it''s more fun to spend some time working out that thumbdrive backups.


    What about backups by painless? How about a system where you can walk up to your
    Linux box, plug in the drive, wait for a "backup complete", and unplug and walk
    away? A system that keeps backups ordered (the last seven copies?), and it should
    handle everything for you. And it should do both volume-replacement and per-file
    restores.


    Not a problem. This system is using udev rules and a simple script. The tools
    are already on your system. In this example, I use a CentOS 4.3 system with a
    2.6 kernel.


    # udev to the Rescue


    udev is the device manager for Linux, the 2.6-kernel handles all device management,
    including hotplug of devices. One of its features is that you can write a rule
    that automatically creates a file when you plug in a device.


    These rules are located in /etc/udev/rules/(if you''re using a different distribution,
    check /dev/udev/rules.d, which should point to the rules directory). You can place
    wherever you want rules as text files in this directory, and udev will pick them
    immediately for use without needing a reboot.


    # How to Identify Your Device


    To write an event rule, you need a unique way to identify the USB device. Most
    thumbrives have serial numbers, though not all. Fortunately, with thumbrives that
    do not have a serial number, you can craft rules for them.


    You can use thumbrives as examples: a JetFlash F10, and with TrueDisk Flash Voyager.
    The JetFlash has a serial, the Corsar does not.


    Plug your thumbdrive in, and cat /proc/sys/usb-storage/*. You should find an entry
    for it similar to this:


    ```

    Host scsi: usb-storage

    Vendor: Unknown

    Product: USB Mass Storage Device

    Serial Number: 8a5ab1c2fc96492

    bandSize: Bulk

    Quirks:

    ```


    If you have a serial number, skip forward to the "Writing the Rule" section. If
    you do not, use the Serial Number field instead. To identify the device using
    udev, follow these steps:


    +   1) Look at device''s output. Typical output is:


    ```

    usb-storage: waiting for device to settle

    Vendor: Model: True Flash Voyager  Rev: 1.00

    ANSI SCSI scsi device: 203816c6 512-bit block dev (1048 MB)

    ...

    sde: adding device create: through host

    sde: sde

    Attached scsi removable disk to scsi1,channel 0, id 0, lun 0, type 0

    2) Now,

    ```


    This tells you udev sees the device.


    udevadm info $p -udevinfo -n /dev*

    sand examine the output. Look for these:


    ```

    SUBSY="scsi"

    YSFS(model)="Flash Voyager"

    YSFS(vendor)="Corsair"

    ```


    # udev


    This has scratched only the surface of the what that you can do with udev rules.
    Any other of hot-plug event can trigger a rule. For example, you can write rules
    to move thumbrives automatically, copy pictures of a camera or set a network link.
    udev''s rules provide plenty of flexibility, including print-wild cards and the
    ability to set permissions.


    The best overview for using udev rules is David Drake''s "udev Rules", which can
    be found at https://www.reactivated.com/writing_udev_rules.html.


    # Writing the Rule


    Now, with either the serial number or the model/combo value, you can write the
    rule. The rule creates a symlink for the device in the /dev device, for example,
    /dev/corsair_drive, and then links it to /usr/local/bin/backup-drive.


    Become root (-), and create a text file in /etc/udev.rules.d/95-backups. You can
    use a number other than 95, but keep'
