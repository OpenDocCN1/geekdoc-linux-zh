  md: "# # awk Not So Awkward\n\nI don't have Dave's awk credit (see Dave's November\
    \ 2006 column). I do not have access to the Web files, or version of Linux. However,\
    \ I know that his solution can be written with awk. Using AIX and HP-UX, I dummy\
    \ up a log file, cheated on the date command and tested my solution.\n\nBelow\
    \ is awk code that I duplicated Dave's example:\n\n```\n#!/bin/sh\n\nLOGFILE=\"\
    home/limol/logs/intuitive/access_log\"\nawk '\n  if (index($0, YESTERDAY)) {\n\
    \    hits++\n    bytes+=$10\n    remail++\n  }\nEND {\n    printf(\"Calculating\
    \ transfer data for %s\\n\", YESTERDAY)\n    printf(\"Sent %d bytes of data %d\
    \ hits\\n\", bytes, hits)\n    printf(\"For an average of %f bytes/hit\\n\", bytes\
    \ / hits)\n    printf(\"Estimated monthly transfer: %d bytes (bytes * 30)\\n\"\
    , bytes)\n  }' -v YESTERDAY=$(date -v-day \"+%%d/%b/%Y\") \"$LOGFILE\"\n```\n\n\
    +   - Rory Hammond\n\napplication layer for the data (such as FTP in \"normal\"\
    \ mode), requiring the NAT router to handle and inspect every modify packet.\n\
    \nUnfortunately, the Dee-Ann recommended is still available but unsupported for\
    \ Linux; their Linux guy left the project. But, all is lost; Linux will not be\
    \ back. A new Linux starting called PSC2, and the new version is\n\n+   - Bob\n\
    \n# ### SSH and DenyHosts\n\nRegarding the worry about SSH dictionary attacks\
    \ (Lt., June 2006). \"A Server of Myself\" by Your's George Belkofsky; the wonderful\
    \ DenyHosts:with details...\n\nDenyHosts intercepts incoming connections into\
    \ your server (many SSH, but it can be FTP or anything else with a login/password\
    \ and log file) and blocks IP addresses by automatically adding to deny.hosts.\n\
    \nI put it to run on a new Web server a month, and it has already more than 7000,000\
    \ failed attempts!\n\nBesides, also you share your whitelist with DenyHosts' Web\
    \ site, feeding a mega-blocklist of the really bad guys.\n\n+   - Carlos Vidal\n\
    \n# ### Java Java Java\n\nI've been waiting and waiting for Java after. How about\
    \ Java (Ajax before Ajax), Java servlets (and real cross-platform stuff). I look\
    \ forward to hearing and reading about it.\n\n+   - Mark Molenda\n\nWe have just\
    \ such an article in the list!—Ed.\n\n# ### PlayStation on Linux\n\nIn the May\
