  md: "# Linux environment can access dozens of filesystems,\n\non the local hard\
    \ drive or somewhere on the network. Linux can run many tools to manipulate Windows\
    \ filesystems or repair Windows partitions.\n\nOne of tools comes from the Linux-NTFS\
    \ Project. One resizes partitions. Utility work much more individually. One can\
    \ clone NTFS partitions. It is the best tool to recover Windows partitions from\
    \ a centralized storage image and update images across a network. But, because\
    \ those tools are Linux, they benefit from the power of the Linux environment.\
    \ These tools help you when you're dealing with a dual-boot system making it indispensable\
    \ if you have a large network. By relied redirection, pipes and scripting, it\
    \ is easy to automate many important tasks from Linux.\n\nNow, download the ntfs\
    \ source, and save it in a handy directory. Operating as root, it will help you\
    \ when you build the NTFS package (the actual version may have changed by the\
    \ time you read this).\n\n# The Software\n\n```\ntar -xzvf ntfs-1.13.1.tar.gz\n\
    cd ntfs-1.13.1\n./configure\nmake\nmake install\n```\n\nWhen building ntfs using\
    \ the FUSE library you will get a clean result while running the configure command:\n\
    \n# Installation\n\nThe utilities are widely available and supported. Packages\
    \ are available for all Linux distributions that have package managers, and the\
    \ software itself is included in the Linux Live CD. Many distributions include\
    \ the tool to be run only by the root user. To see if these tools are installed\
    \ in your installation, consult the package managers which list all where the\
    \ software is installed.\n\nEven if the software or documentation are absent,\
    \ you can install them yourself. For those, SUSE, Debian and Ubuntu, search for\
    \ the package name and install it. For some distributions, you may need to compile\
    \ it from source. Note that the Each Edition of Debian includes the ntfs tool,\
    \ and the package in the Source version does not. Red HatFedora distributions\
    \ do not support it. For RedHat NTFS drivers are available directly from the Linux-NTFS\
    \ Project. Of, consult the actual home page of the project for more information,\
    \ as well as the source code and instructions for forking the complete set of\
    \ tools.\n\n```\nchecking for FUSE_MODULE, configure: WARNING: \ntfsmount requires\
    \ FUSE version > 2.3\n```\n\nThis shouldn't be faulty to install the other tools,\
    \ but you will not be able to compile ntfs. If you are using RedHat Fedora, you\
    \ might not have even the kernel driver in place. It is strongly recommended that\
    \ you install a custom kernel with the kernel-ntfs driver or install the FUSE\
    \ libraries before leaving.\n\nAt this point, if you have already installed ntfs\
    \ or if you already looked at the ntfs page, you may see the complete list of\
    \ tools. Here is the part of the man page:\n\n+   ntfsformat() - Format a partition\
    \ using NTFS,\ntfscat() - Dump a file to the standard output\nntfsclone() - Clone,\
    \ create, or restore an image of NTFS partition.\ntfslocate() - Locate the location\
    \ of any sector or cluster on NTFS.\nntfscheck() - Verify on file on NTFS partition.\n\
    tfsfix() - Check and fix common errors, the that make windows perform a thorough\
    \ check next time it.\ntfsinfo() - Show information about an NTFS partition or\
    \ one of the directories or within.\ntfslabel() - Show, or set, an NTFS partition's\
