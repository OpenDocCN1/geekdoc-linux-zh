  md: "# Listing 1. Backup Script\n\n# INDEPTH\n\n```\n#!/bin/bash\n\n# Thumbnail\
    \ backup script from Linux Journal\n\n####################################\n#\
    \ CONFIG section\n\n# where you want the backups to be kept\nBACKUP_DIR=/thumb\n\
    \n# how many old backups to keep\nGENERATIONS=$+\n\n# backup only once a day\n\
    # set to 0 if you want a backup every time\n# insert your thumbdrive\nBACKUP_ONCE_DAY=1\n\
    \n# completion sound when backup is done\nSOUND=$/usr/share/sounds/XDE_Beep_ClockTime.wav\n\
    \n# END CONFIG\n####################################\n```\n\n# To Recover\n\n\
    If you lose your thumbdrive and want to restore your thumbdrive to its replacement,\
    \ simply dd the backup image to the new thumbdrive,\n\n```\ndd if=corsair_drive.backup.0\
    \ of=/dev/corsair_drive\n```\n\nOr, if you want to grab only some files from the\
    \ backup, do this:\n\n```\nmkdir /mt/thumb\nmount -o loop corsair_drive.backup.0\
    \ /mt/thumb\n```\n\nYou can now copy files from /mt/thumb.\nIf you are using TrueCrypt\
    \ to encrypt your thumbdrive, you can mount the backup image in the same way:\n\
    \n```\ntruecrypt corsair_drive.backup.0 /mt/thumb\n```\n\nThat's as basic as we\
    \ make thumbbricks.\nIf you're too lazy to plug your drive and come back when\
    \ it comes...well, stay away from laundromat!\n\nAndrew Fabio has an Oracle DBA,\
    \ he still works at home and welcomes your comments sent to andrewfabro.org.\n\
    \n```\n# main program\n\n# wait for device to settle\nsleep 10\n\n# make sure\
    \ no one is able to copy our backups\nmask 0777\n# check the directory\nDEVICE=$1\n\
    if [ ! -d $BACKUP_DIR ]; then\n  mkdir -p $BACKUP_DIR\nfi\n\n# backup only once\
    \ per day\nif [ $BACKUP_ONCE_DAY -gt 0 ]; then\n  TODAY=$($BACKUP_DIR/$DEVICE).device_today\n\
    \  find $BACKUP_DIR -name name($DEVICE).backup $($DEVICE).device_today -a -mtime\
    \ +1 -delete\n  if [ -f $TODAY ]; then\n    exit\n  fi\n  touch $TODAY\nfi\n\n\
    # rotate backups\ncd $BACKUP_DIR\nlet GENERATIONS=$1\nwhile [ $GENERATIONS -ge\
    \ 1 ]; do\n  let NEWFILE=$DEVICE.backup $GENERATIONS\n  if [ -f $DEVICE.backup\
    \ $GENERATIONS ]; then\n    mv $DEVICE.backup $GENERATIONS $NEWFILE\n  fi\n  let\
    \ GENERATIONS=$GENERATIONS-1\ndone\n\n# do the backup\ndd if=$DEVICE of=$($BACKUP_DIR)/($DEVICE).backup.0\
    \ /dev/null 2>&1\n# notify us that it's done\naplay $($SOUND) > /dev/null 2>&1\n\
    ```\n\n![](img/6ad2c38f7c331af69e079dec652dce53_97_0.png)\n\nwww.linuxjournal.com\
    \ February 2007 | 95"
