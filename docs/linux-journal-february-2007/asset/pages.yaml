  md: "# A Touch of Elegance\n\nI hesitate to issue with an author like Dave Taylor,\
    \ [his script] uses repeated (and in many cases redundant) systems and divisions\
    \ to achieve what simple multiplications can do (Dave's December 2006 column?).\
    \ It also converts to the wrong units. (See man for a discussion.)\n\nA simple\
    \ algorithm to achieve such effect is embedded in this hash as follows:\n\n```\n\
    #!/bin/sh\n# Script for numeric scaling $1 = number, $2 = iterations\n\nfor ((i\
    \ = 1; i <= $2; i++))\n\n  dk=1024\n  mi=$((dk*$dk)) # 1048576 without type risks\n\
    \  gi=$((dk*$mi)) # 1073741824 your account details\n\n  value=$1\n  if [ $value\
    \ -lt $dk ]; then\n    units=\"bytes\"\n  elif [ $value -lt $mi ]; then\n    units=\"\
    KB\"\n  elif [ $value -lt $gi ]; then\n    units=\"MB\"\n  else\n    units=\"\
    GB\"\n  fi\n\n  printf \"%s %s\\n\" \"$value\" \"$units\"\n  \n\n  if [ \"$units\"\
