  md: '# INDEPTH


    # Interview with

    Christof Witting

    and Jerry Fields

    df dbobjects


    dbobjects emerges as a unique blend of company and community. NICOLAS PETRELEY


    LI: Can you tell me about the history of dbobject?

    Christof: dbobject is the native Java and NET object database created since 2000
    by a group of developers around Carl Neiberg. dbobject was driven by users who
    felt there was an urgent need for an object persistence solution that was more
    efficient and better than performing inconsistent solutions


    In 2004, the software was successfully delivered to a handful of early customers,
    but it was ready for prime time. I was asked to join as CEO to grow the company.
    Today, dbobject is based in Silicon Valley.


    dbobject brought us to the open-source world, as we know from SQL, and fellow
    friends from Silicon Valley, such as Mark Leslie, leading CEO of Vertas (and our
    company), Vinod Khoda, CEO of Wind River, who joined our board early. Jerry Fields
    is here with us today to help us learn more about objects.


    LI: What is it and how are your customers using it?

    Christof: dbobject is an embeddable object persistence solution—and this is because
    it is an object database without servers. We call it an object database. Unlike
    Oracle, MySQL, or AS/400—large-scale, single-server, solutions—dbobject is an
    embeddable database that responds to method calls from the application code.


    Transactions span a broad range of domains (such as products and consumers online),
    mobile applications (such as delivery systems), packaged software (on a PC) or
    server-side middleware, and caches (such as in a SCADA system) all within reliability
    timelines.


    The unifying aspect is extreme reliability, high performance even with constrained
    resources, and it has to be Java and just like Java.


    LI: Would it be accurate to say that the market for dbobjects exists due to the
    popular adoption of a JVM in embedded systems?

    Jerry: Yes. Christof said where Java goes, dbobject goes. Rather than "embedded
    systems", I prefer to talk about device software.


    Traditionally, most software was written in C or C++.


    with a strong focus on hardware rather than best software practices. But the world
    is becoming increasingly sophisticated, with more memory, faster CPUs, and most
    important connectivity. Both and the data they deal with are becoming much more
    complex. The software we need to catch reality—Java and Net provide two ways to
    do that. The SQL-only approach? It''s too cumbersome, slow, and not agile enough.


    In many industries and practices, especially in mobile, you now see more practices
    and techniques, from servers and PCs to smaller devices. Thanks to mobile! It''s
    this convergence of technologies and practices, where Java-embedded (and Net)
    virtual machines is gaining rapid traction. And, dbobject is the optimized object
    persistence database for this space. This is why I am so excited to do this company


    LI: What are the key differences in version 6?


    Christof: Performance, performance, performance.


    LI: That''s most of it. In this product space you should focus on performance,
    because it''s the main concern of over developers. A product that doesn''t address
    performance in this space is either not user-driven or simply not enough drive.


    For the new version 6, it''s not about being a little faster. Version 6 has ten
    to times faster response times, in some cases being about a hundred times faster,
    enabling a new set of functions (such as OQED queries and applications, for example,
    where we have also significantly reduced memory consumption up to 90% and more)


    LI: How did all these significant changes come about?


    Christof: The technical answer is the use of a B-Tree index architecture, first.
    Then there''s the fact that we spent six months, which allowed us to achieve our
    amazing results.


    Our customer team provided all the links to this open space. The product release
    cycle was key. Their number one priority is performance, but there are also many
    other, less spectacular than improvements, such as data fragmentation, new server-
    technology and improved API


    LI: How did you engineer version 6 in a user-driven fashion?

    Christof: We started in early 2006 with a survey that gathered more than 1,000
    responses. Then we gathered together with users at the dbobject Conference in
    July 2006. Then we talked to some of the customers whose features we were producing,
    we were getting feedback, in two-hour interviews—because the release cycle of
    our continuous builds is! Our weekly planning meetings are now held on Skype,
    so the development team is always in touch with the community of users around
    us.


    LI: How much of the changes in version 6 were the result of Open Source community?


    Christof: This distinction is concerned. The community is as much a part of us
    as any community member is part of our company. It is not an ''us'' and ''them'';
    there is only ''we''. It''s a collaborative approach. You earn your place by merit
    (and contributions), not by rank, seniority, or politics.


