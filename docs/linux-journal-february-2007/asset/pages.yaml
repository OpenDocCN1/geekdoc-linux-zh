  md: '# # Tools for Accessing Linux Partitions in Windows


    Accessing Linux partitions from Windows can be a challenge. It is not lost, however,
    the Open Source community has risen to the challenge and created excellent software
    to solve this problem. This article focuses on LTOOLS, which is advanced interfaces
    that allow users to access a range of Linux filesystems. First, let''s look through
    some other software that could help.


    # # A SHORT PRIMER ON FILESYSTEMS


    Some readers might wonder what a filesystem really is. A filesystem basically
    defines the method for storing and retrieving files. But why so many? "Why are
    there so many filesystems? Why can''t we just choose one best way to retrieve
    data from a disk and make that filesystem standard for all operating? Different
    users use different filesystems. For example, users who are targeted at enterprise
    users use NTFS, which was targeted at ordinary users with enhanced security.


    # # Ext2fssd


    Ext2fssd is an open-source project that allows access to ext2 and ext3 partitions
    from Windows and can be downloaded without rebooting. ext2fssd.projects.net/ext2fssd
    works as a driver, not a regular application. Using Ext2fssd as a driver integrates
    ext2 partitions into Windows and allows access to them as if they were a native
    format and enables read/write support. This is unique, as it is one of the first
    Linux filesystems supported, and many new Linux filesystems, as ext3 and ext4
    are backward-compatible with it. Thus, the driver can work with ext4 too. However,
    with respect to ext4, you will need to add the mainline kernel to your system.
    But, when using ext4 with Ext2fssd, you will be using the features of ext2, not
    other additional features, such as enhancing journaling capabilities, not used


    "supporting an OS for a filesystem basically means that we define the data structures
    to operate the filesystem. If the OS supports NTFS, the disk can also add support
    for other filesystems, such as NTFS, because the structure of the data on the
    disk, the encryption algorithms and so, are not known to the public. This is why
    it is proving to be a challenge to support NTFS in Linux.


    ![](img/6ad2c38f7c331af69e079dec652dce53_61_0.png)


    Figure 1. Ext2fssd makes ext2 filesystem look like any other filesystem in Windows.


    # # rfstools


    Rejstools has become a popular Linux tool, because of its fault-tolerance capabilities.
    rfstools allows access to ReFS2 partitions within Windows. It only supports read-only
    access, and according to the developers, there have no plans to change that. The
    tool is available for free at rfs.org.


    # # Installation of LTOOLS


    LTOOLS works with various disk filesystems, which we will detail later. After
    the installation, the procedure runs in your environment and creates a menu called
    LTOOLS from which you can access your Linux filesystems. LTOOLS works with all
    Windows versions, however, all of the except for Windows XP and Windows 7. It
    provides two different consoles for Win9 and and NTFS


    # # Overview of LTOOLS-Command-Line


    The command-line interface provides basic functionality for writing and retrieving
    data from LTOOLS. The commands have the following format:


    ```

    idr.bat

    ```


    This command lists directories; however, it is not a script. This script, depending
    on your system, invokes either of the two programs: Ldr or Idnt. The first one
    is for NTFS and the second one for Windows.

    Many LTOOLS commands have a logical syntax. For example, partition names are logical.
    So, if I want to copy a file vars.conf from /root (which is on /devhd2) to C:
    drive; I would do the following


