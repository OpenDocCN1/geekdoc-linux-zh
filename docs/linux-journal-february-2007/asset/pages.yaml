  md: '# Integrating PHP and Perl


    PHP and Perl are both powerful, they can even reach each other.


    IRFAN HABIB


    Perl is a language often associated with text processing and CGI. PHP is a language
    often associated with dynamic Web pages. Both are very popular languages among
    Web developers. Often, each of these languages is used at the expense of the other.
    Hard-core Perl developers would love to develop in PHP, and PHP developers want
    to stick with Perl.


    As in the Usual Source, there is a level of zealotry between languages where one
    is much better than the other. This article is not for you! This article is for
    those who search for a more pragmatic approach and use both languages at work
    and at time. Personally, I have used languages and have discovered which is best
    for certain tasks and try to integrate the strengths of each as much as possible
    to complete whatever.


    Perl is excellent at system administration and text processing, among other things.
    This means, if you want to do some extensive text processing on a file, Perl is
    a great tool. It provides handy regular-expression-based tables, which makes it
    so easier easier search and transform content. Perl also has many powerful features
    that make it very versatile. PHP, having an extensive framework, has thousands
    of extensions available in CPAN, which allows you to do anything from virtual
    hosting to database connections. But Perl is not as flexible as many other languages;
    it is much more convenient with Perl.


    PHP is excellent at integrating with databases. PHP is incredibly integrated with
    HTML Web pages. That''s why it has had such popularity for many years. It has
    mature support for numerous popular free or non-free databases and MSS SQL (SQL
    Server) much better than any other open-source language. I have tried two CPAN
    extensions for Perl to get it to work with MySQL, with limited success. However,
    PHP has seamless support for MySQL and MSS SQL out of it.


    I was involved in a project where the entire project was written in Perl. I had
    a lot of code needed to connect to MySQL server. I knew I would have to rewrite
    it in PHP to avoid the pain of setting up MySQL for installation. That why I searched
    for the Internet for a way to integrate languages in a manner that would allow
    me to avoid rewriting. And I found the PHP-CPAN module. PHP-Interpreter was perfect.


    I was able to integrate the two languages to an extent that starts to be both
    are more extensions of each other. PHP-Interpreter allows me to use PHP for databases
    and other features natively in Perl, and I was able to use Perl''s CPAN modules
    to extend my PHP programs.


    Actually, the PHP-Interpreter module''s main function is to encapsulate an embedded
    PHP interpreters. It provides proxy methods (like AUTOLOAD) the conversion of
    Perl code to PHP (and vice versa), and the ability for PHP to call Perl subroutines
    similarly and the


    symbol table. The goal of this package is to construct a bridge for Perl code
    and PHP code by side.


    To demonstrate the power of this module, we code two examples how to show each
    of them: PHP-Interpreter, integrating PHP with Perl. Each example shows in which
    languages complement each other to produce powerful code.


    # EXAMPLE 1

    Integrating PHP with Perl


    In this first example, we create an application to monitor failed logins via SSH
    to our server. The target is script and malicious users to compromise a system
    and gain access to it. The script identifies the IPs of the attackers from MS
    SQL server database. We use Perl to do what it''s best-processing logs files.
    We will continuously monitor the /var/log/auth file which shows the failed failed
    to login. We use the Perl extension to connect to MS SQL server. Then we implement
    this in PHP and show how the two languages can be seamlessly used and used when
    they complement each other.


    # Setting Up PHP-Interpreter


    Setting up PHP-Interpreter is a standard Perl module installation. You can get
    it from search.cpan/dist/PHP-Interpreter. Unpack it, and compile the


    ```

    perl Makefile.PL

    ```


    Compile:


    ```

    perl make

    ```


    And, install it:


    ```

    make install

    ```


    You can do an:


    ```

    perl2interpreter.php -> php_interpreter

    ```


    and keep the documentation file for reference use:


    We also use the CPAN module File-Tail, which allows us to monitor a log file continuously.
    You can get it from search.cpan/dist/File-Tail. Unpack it, and compile the


    ```

    perl Makefile.PL

    ```


    ```

    make

    ```


    ```

    make install

    ```


    Now, fire up a text editor, and start coding:


    +   1. use PHP::Interpreter;

    2. use File::Tail;'
