  md: '# Terra Soft''s Yellow Dog Linux for PlayStation 3


    Linux people simply rock, don''t? A case in point is Terra Soft, which has ported
    its Yellow Dog Linux (YDL) to the PlayStation 3 (PS3). Hopefully by the time you
    read this, you can finally get your hands on PS3, because we can''t.

    With Sony blessing and support from the Barcelona Supercomputing Center, YDL is
    a full OS for PS3, which is based on Fedora 5 and comes with more than 1500 packages.
    In this project, Terra Soft also collaborated with Haizelter and the Enlivenment
    development team to integrate the Blitz, which the firm will provide an "unprecedented"
    level of freedom and interface aesthetic.\nInstall and source YDL are available
    for download; DVDs are available for purchase from Terra Soft''s on-line store.\nwww.terrasoft.com


    ![](img/6ad2c38f7c331af69e079dec652dce53_49_0.png)


    ![](img/6ad2c38f7c331af69e079dec652dce53_49_1.png)


    # ADLINK Technology''s NuPro-851


    ADLINK Technology just brought for you a full-sized, single-board computer, like
    the NuPro-851. The NuPro-851 is a PiKem 1.0 device that supports 800MHz FSB with
    a hyper-threading Intel Atom, dual-core DDR2 memory at 400MHz and an Intel G475
    architecture capable of performing 2048MIPS with 5.8GB/s peak memory bandwidth.
    The product also features 951G and 16CH, USB 2.0 connectivity and two-port Dual-Ethernet
    Marvell 888802 controllers. ADLINK says the product is "ideal for industrial controllers
    and equipment providers", because it places high emphasis on integrity, reliability
    and strict version control. And all other ADLINK products comply with the European
    Union''s report on environmentally sounds.\nwww.adlink.com


    # Pete Goodlife''s Code Craft (No Starch Press)


    It''s always true to buzz over No Starch and see the latest deals for geeks. If
    you don''t Star Search now, you''ll find Pete Goodlife''s brand-new book Code
    Craft: The Practice of Writing Excellent Code. The book''s purpose is to take
    a programmer to the next level, from writing great code that is easy to understand.
    Code Craft is language-agnostic and covers not only presentation style, accurate
    naming, error handling but also effective teamwork, development processes and
    documentation. A free chapter is available at No Starch''s Web site.\nwww.nostarch.com


    # AXIGEN''s Mail Server


    Just when you thought the dizzy array of options for mail servers couldn''t get
    more dazzling, AXIGEN releases version 2.0 of its Mail Server. The product provides
    "all-in-one functionalities, ranging from e-mail communication to antivirus and
    anti-spam integration." In the new edition, AXIGEN has added many features, including
    a backup and recovery module, a full-security toolkit, antivirus and anti-spam
    applications, and scalable Webmail, a reporting engine for more than 100 definable
    reports, a wizard for creating e-delivery routes and orders. The Mail Server is
    currently available in both the English and German languages and runs on major
    distributions. An evaluation edition is available at AXIGEN''s Web site.\nwww.axigen.com


