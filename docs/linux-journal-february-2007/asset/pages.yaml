  md: '# COLUMNS


    # AT THE FORGE


    ![](img/6ad2c38f7c331af69e079dec652dce53_26_0.png)


    # # Scriptacularous


    Scriptacular is a scriptaceous of lifetimes for Ajax.


    **Ajax is the hot new Web development paradigm that uses JavaScript to send and
    then handle asynchronously HTTP requests.** The past few months, this column has
    looked into different ways to spawn and handle Ajax calls. The most complicated
    way to do it is using XMLHttpRequest object, and then using it to script to the
    user''s browser as well as specify which JavaScript function will handle the response.
    I believe that we can simplify this by greatly using Prototypes, a JavaScript
    library that includes many of the shortcuts and utility functions that are use
    to beginners.


    The good news is that Prototype does make everything more straightforward. But,
    one of the things most people want to do is create more flexible GUIs. This is
    especially true now that Web applications are becoming desktop-like; users expect
    to have the same sense of freedom and control that their native applications provide.


    Just as with Ajax, there are ways to create and handle these behaviors on your
    own. But why would you, when there are libraries available? Several of these are
    Scriptacular, MooKit and Dojo. Dojo is actually a complete top-to-bottom JavaScript
    library; I expect to look at it in a future installment. This month, however,
    we will look at Scriptacular, an open-source library written by Thomas Fuchs.
    Scriptacular makes it so easy to spice up your HTML files without having to deal
    with the low-level JavaScript.


    # ## Basics of Scriptacular


    Installing Scriptacular is easy. Download the latest version of scriptacular.js
    and install the six JavaScript files (in the directory) wherever you want in your
    web project.


    Actually, installing Scriptacular could be easier than this. If you use a recent
    version of Ruby on Rails, you can see the Rails documentation for a description
    of how to use these libraries directly, as well as from code.


    Scriptacular 1.5 is used in this article, although Prototype 1.5 is likely be
    used by the time this column is published. Thus, there might be some differences
    between the function names here and the final description.


    To use Scriptacular, you need to include two script tags in your HTML page to
    load and then Scriptacular:


    ```

    <script src="javascript/prototype.js" type="javascript"></script>

    <script src="javascript/scriptacular.js" type="javascript"></script>

    ```


    # ## Simple Effects


    So, what might you want to do with Scriptacular? One of the most common uses is
    in the creation of visual effects. Each effect is defined as a method within the
    Object. You can create an effect by calling:


    ```

    new Effect.EffectName(''id'')

    ```


    where EffectName is the name of the effect you want, and id is the ID of the HTML
    element that will trigger the effect. For example, if we have the following header:


    ```

    <h2 id="header">the header</h2>

    ```


    we can make it fade by invoking:


    ```

    Effect.Fade(''header'')

    ```


    Of course, it makes sense for this to happen when particular events occur. Listing
    1 contains a simple HTML file, effects, with buttons labeled effect and fade headline.
    By clicking the button invokes Effect. After the fade the node with an ID of headline
    appears. The node then fades out again. Effect.Fade uses($0) to restore the node
    with that id.


    To make the headline, we set the following


    Listing 1. effects


    ```

    <head><title>Scriptacular</title>

    <script src="javascript/prototype.js" type="javascript"></script>

    <script src="javascript/scriptacular.js" type="javascript"></script>

    </head>

    ```


    ```

    <body>

    <h2 id="header">welcome</h2>

    <p>welcome to the page of effects</p>

    <input type="button" value="Fade headline" onclick="Effect.Fade(''header'')"></p>

    <input type="button" value="Appear headline" onclick="Effect.Appear(''header'')"></p>

    </body>

    </html>

    ```


    24 | February 2007 www.linux.com'
