  md: '# Words, Words, Words...


    When it comes to being understood and sharing information,

    it''s not just about open source, it''s about open standards.


    **What are you doing Francois?** Our guests will be here any moment, and you are
    still sitting in front of your computer. I agree with you that it''s a good idea
    to store all these old documents in OpenDocument format. I admire your desire
    to ensure the long-term usage of these documents by converting them from their
    proprietary format, but that is not easy. Converting thousands of documents from
    hundreds of people on our data network. Converting them one at a time as you are
    doing will take forever, and we are running out of time. There is a much better
    way to do this with you and it''ll be on it tonight.


    Vite to the chair I see you are coming to the door now. There are six guests in
    Paso Pablo Zinfandel in the East wing, right next to the old marked door—I would
    really have you check that come out so we can find out what back to greet our
    guests, Vite!

    Welcome, mes, to Chez Marcel, where Linux and open source are paired with some
    of our best wines. Your table is ready and waiting, so please sit down and make
    yourself comfortable. My faithful waiter, Francois, will return shortly with your
    drinks. For tonight, we were discussing a project to convert all of our proprietary
    documents to the OpenDocument format or ODT. This is the OAS OpenDocument XML
    (extensible Markup Language), an open standard for documents. The OpenDocument
    format is the closest thing to document format because it is free and application-neutral.
    You are guaranteed support and portability, especially as the European Commission
    and the state of Massachusetts, are starting to adopt the OASIS OpenDocument format
    for the first time in their history.

    Ah, Francois, you so made it back with the wine. Please, pour for our guests.
    Enjoy, amis. This wine is rich and juicy, with wonderful blackberry raspberry
    flavors, a little de pepper.

    Ah, where is I? Oh, yes—converting OpenDocument makes sense, but we will stay
    with Word for now, not so much for technical reasons, as simple as inertia. The
    sheer volume of documents we need to deal with is the reason that OpenOffice.org
    was designed to support the Microsoft Office format thoroughly as it does. So,
    if you want to switch to the OASIS OpenDocument format, OpenOffice.org provides
    a way to do that. Rather than converting documents one by one, the Document Converter
    speeds up the process by allowing you to run all the documents in a specific directory
    in one pass. It also works in both directions, meaning you can


    convert from Word to OpenOffice format and vice versa. The conversion creates
    a new file but leaves the original as it is. Here''s how you do it:


    From the menu bar, select your document to Wizards, select Document Converter
    from the submenu. To convert your Office documents, click the Next button, then
    check off the types of documents you want (Figure 1). You can convert Excel and
    PowerPoint documents at the same time.


    ![](img/6ad2c38f7c331af69e079dec652dce53_30_0.png)


    ![](img/6ad2c38f7c331af69e079dec652dce53_30_1.png)


    Figure 1. By selecting the types of documents you want to convert.


    The next screen asks you to choose the documents you want to convert or just one
    of them. Then you type in the name of the directory you want to import from and
    save. You can use the same directory or choose another. You need to specify the
    name of the folder where you want the converted documents if you want. You can
    convert Excel and PowerPoint documents at the same time.


    ![](img/6ad2c38f7c331af69e079dec652dce53_30_2.png)


    Figure 2. If you want to convert Excel and PowerPoint documents as well, you''ll
    need a similar dialog for each one.


