  md: "# INDEPTH\n\nListing 1. example.xml\n\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    \ standalone=\"no\"?>\n<root>\n  <file size=\"200GB\">\n    <file>filesystems\
    \ inside XML</file>\n    <file myttr=\"foo\">Something blue</file>\n  </file>\n\
    </root>\n\nListing 3. Generating a Translated Filesystem for example.xml\n\nxsltfs://\n\
    context\ntfile\nexample.xml\nexample.xml?stylesheet=foo.xml\nrootelement\nmyfoo\n\
    mybar2\n\nListing 2. example.xsl\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
    <stylesheet xmlns=\"http://www.w3.org/1999/XSL/Transform\"\nversion=\"1.0\">\n\
    \  <xsl:output method=\"xml\"/>\n  <xsl:template match=\"\">\n    <root>\n   \
    \   <xsl:apply-templates/>\n    </root>\n  </xsl:template>\n  <xsl:template match=\"\
    file3\">\n    <content>\n      <xsl:value-of select=\"@url\"/>=\"Content\"\n \
    \   </content>\n  </xsl:template>\n  <xsl:template match=\"file7\">\n    <content>\n\
    \      <xsl:value-of select=\"@url\"/>=\"myattr\"\n    </content>\n  </xsl:template>\n\
    </stylesheet>\n\nListing 4. Exploring Our New XSL Filesystem\n\n$ bash\n$ URL=xsltfs://context/file/tmp/example/example.xml?stylesheet=example.xml\n\
    $ cd /tmp/example\n$ ls\nexample-rev example.xml example.xsl\n$ export LIBFERRIS_XLTSFS_SHEETS=pwd\n\
    $ ferris -1 $URL\root\n$ ferris -1 $URL/root\n2 file3\n3 file7\n$ fcat $URL\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<root>\n  <content\
    \ name=\"file3\">\n    original-url=\"file:///tmp/example.xml/root/file3\"/>\n\
    \    <filesystem inside XML/></content>\n  </content>\n  <content name=\"file7\"\
    >\n    original-url=\"file:///tmp/example.xml/root/file7\"/>\n    <foot/></content>\n\
    \  </content>\n</root>\n\nallows you to translate a filesystem at any point by\
    \ using an XSL transform. The location of the XSL files is determined by an xslpaths\
    \ variable used in librestis. The xslpaths mapping to virtual paths is specified\
    \ using a C API; avoiding the use of the `/` character ensures there are no ambiguities\
    \ for files in ferris.\n\nThe result of applying a stylesheet to the example filesystem\
    \ will be the contents of a directory at that location. For example, example-filesystem\
    \ is a virtual directory.\n\nWithout any use of `/`, the filenames and parameters\
    \ are used to specify the name of a virtual directory that xslfs makes. There\
    \ is no ambiguity, because the name is embedded directly into the path of the\
    \ virtual directory. This is shown in the examples below.\n\nPart of the example\
    \ is shown in Listing 3 to make things clear. The output of the example uses the\
    \ Gtk-like syntax to name a virtual directory. librestis creates this virtual\
    \ directory to allow direct navigation into the translated filesystem. The rootelement\
    \ of the translated filesystem, in XML, is the document root of the result of\
    \ applying the foo.xsl stylesheet.\n\nthe filesystem is rooted at example.xml.\
    \ Filesystems live inside the context subdirectories of xslfs; to allow other\
    \ parameters and permissions to be in the same directory as example.\n\nThe path\
    \ is set using the XSL stylesheets to join the ferris-path with virtual-path.\
    \ In addition, the LIBFERRIS_XLTSFS_SHEETS environment variable allows to pass\
    \ the path and reverse direction located. This makes using xslfs with the FUSE\
    \ module from shell scripts simple, as you do not need to install your stylesheets.\
    \ Stylesheets are stored in a location where librestis can read them.\n\nFor the\
    \ examples of this have, I have the stylesheets stored in /tmp/example. If I am\
    \ running examples from the example directory, it is sufficient to put into my\
    \ xlspath—see the example in Listing 4.\n\n74 | February 2007 | www.linuxjournal.com"
