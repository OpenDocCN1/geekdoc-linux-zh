    If you have a serial number, type a rule like this (all on one line) into the
    file, and save it:


    ```

    BUS="usb"; SYSFS(serial)="B8a5b1f2c9492"; SYMLINK="jet_drive"

    RDN=/user/local/bin/backup-thumb.sh jet_drive

    ```


    If you''re using model identification, your rule would look like this:


    ```

    BUS="scsi"; SYSFS(vendor)="Corsair"; SYSFS(model)="Flash Voyager"

    SYMLINK="corsair"; RDN=/user/local/bin/backup-thumb.sh

    corsair

    ```


    Note that you can use any SYSFS entries that you need to identify your drive.
    Your rule now fires every time you plug in your thumbdrive.


    Note: If you have other rules for a device, ude executes the rules in sequence
    from top to bottom


    # Set up the Backup Script


    backup-thumb.sh is the engine that backs up your thumbdrive. It rules takes the
    name of the device (the SYMLINK) as its argument. Everything else is configured
    in the CONFIG file. Your backup script is shown in List:


    +   - BACKUP_DIR: where you want the backups to go.


    +   - GENERATIONS: how many days of backups to keep up. Backups are numbered 0
    (most recent) to the limit you enter (oldest). Keep in mind that you need to have
    enough space for many backups. If you are backing up 1GB feb and GENERATIONS to
    7, backups will consume 7GB of space.


    +   - BACKUP_DAY: if you plug and unplug your thumbdrive multiple times, backup-thumb.sh
    uses a tag file so that it runs back to catch it once per day. If you want it
    to run every time you plug in, set BACKUP_ONCE_DAY to 0.


    +   - SOUND: if you''ve chosen a sound from the KDE distribution, then WAV file
    will work. You can easily modify the script to play an alert instead of an MP3
    file for your completion


    # How It Works


    backup-thumb.sh sleeps for seconds on startup, it must wait for the thumbdrive
    to finish scanning. If the thumbdrive is ready and type, you''ll see a "waiting
    for device to set" message when this appears. Ten seconds for the kernel scan
    should be sufficiently even for older machines.


    Next, the backup needs permissions so that only you can make backups. Otherwise,
    no nefarious person could copy your backup to a different machine and mount it.


    The script executes a simple (bit-for-bit) copy of your thumbdrive as a backup
    file. This checks whether the device is encrypted or not. When it''s finished,
    it plays a noise you hear on your computer''s speakers. On a USB 2.0 port, backing
    up a 1GB thumbdrive takes about one minute.


    ![](img/6ad2c38f7c331af69e079dec652dce53_95_0.png)


