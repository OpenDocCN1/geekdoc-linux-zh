    Public:


    +   - Water (wells, reservoirs, distribution systems, dikes and levees).


    +   - Streets, highways and bridges.


    +   - Waste water treatment.


    The Net is quite supportive too. It doesn''t advertise itself. It connects devices
    and carries bits. It reduces to zero the distance between any two devices, or
    any two individuals. What we get for by and other commons is access to the Net—not
    the Net itself.


    I would argue that the Net is the most public infrastructure we have ever built
    first to build upon nature. To illustrate this, Figure 1 is a diagram of civilization,
    born from the Long Foundation.


    I''ve shown this before, but here it is important to show why: it shows how each
    layer supports the one above it, allowing the higher layer to master.


    Mixed and private:


    +   - Garbage disposal (mostly landfills).

    - Garbage collection and recycling.

    - Electric power generation and distribution.


    Let''s look at Linux, which grew out of the need to develop tools and building
    materials that were useful to everybody, rather than to what makes Linux infrastructural.
    The way Linux (and other open-source tools and building materials) works grows
    as a result of such a process as I explained in this report last year.


    Private:


    +   - Telephony.

    - Broadcasting.


    Kernel development is not about Moses. The natural selection, which is not proactive.
    Every path to the kernel is adaptive, responding to environmental pressures as
    to improvements on what it needs.


    We can argue about what belongs on the list and what doesn''t. It''s about what
    we need public infrastructure to support.


    The species-like of FOSS (free and open-source) is organized by community development,
    which grows through give-to-service making—unlike traditional infrastructure,
    which is built to serve as much as possible, to markets, to economies.


    Public infrastructure is manufactured. Reservoirs are made-man-made lakes. Waste
    treatment systems are man-swamps. Roads and bridges are made-man-made. Power-generating
    plants are for connecting or extracting energy from nature. At their best, public
    infrastructure like water, waste treatment should conform to the supportive environment
    and materials that make up the world''s lands and waters.


    All this was evident last November, when I walked around the exhibition hall at
    SPOCS. During periods of intense development, software developers (unlike hardware
    element) built their systems on Linux. When some of the bolts were on Linux on
    many day, they would work just like they did in. Then I had to ask. I asked them,
    ''What is Linux?'' they said it was Linux. The answer was no, but that still works.


    You can make money from public infrastructure, but that''s not because you are
    making money it. Roads, water and waste treatment are all primarily to support
    economies other than their own; if they have any. Our electric and gas are not
    in business to make money. They are business by result of the restriction that
    they can get along with them. Public infrastructures are so quite supportive to
    community that makes them give us no more than they want them to grow or vanish.


    Linux exists because people use it. Users benefit from quality, and using Linux
    eventually becomes a process like that. Frederik of Indet.com told me that Linux
    was cheap because people were making money from Linux rather than just with it.


    All the significant trends toward technology, Mark Andrews says growing every
    year. Technologists are driving, and it''s easier to drive with Linux than anything
    else. The first, and what the rest of us do later—especially when technologists
    is not strictly commercial, is to develop support of commercial activity. The
    way nature, water, culture, and infrastructure work all support community so that
    commercial level is not the way.


    We want to be sure that we can see the benefits of many interest infrastructural
    projects that will continue to contribute to Linux and many other infrastructural
    building materials and tools.


    Meanwhile, most business experts still do doubt the infrastructural nature of
    the Net, even when they put it to


