  md: '# Creating SELinux Policies Simplified


    SELinux does not have to be hard to manage as many people might think


    IRFAN HABIB


    Modern Linux distributions ship with a plethora of security features and tools,
    one of the most important features added to kernel have been the inclusion of
    SELinux.

    SELinux solves one of the most challenging problems in security. How to control
    users or processes. Trusted users, as root in the kernel should be supposed to
    have access only by the system administrator; however, this leads to a problem.
    What happens if a malicious user gets root access and gains control of the system?
    Malicious users are not the only problem; misconfiguration of a security tool
    can be abused. Besides this, a vulnerability is discovered through improper access
    control. SELinux secures systems from these security issues by implementing mandatory
    access control. SELinux is based on the Flask security architecture. Discussion
    of the Flask architecture is included in this article.

    To understand mandatory access, we must go through the currently deployed system
    model called discretionary access control (DAC). The classification of access
    is discretionary in a subject with a certain set of access permissions is capable
    of granting permissions on objects. For example, any program you run is based
    on the user who started it. You have a certain number of permissions that you
    can grant to others (for example, root).

    Any particular permission (read, write and so on) can be denied to another access
    to access and on object. In instance, DAC systems control the validation of credentials
    prevent them from getting stored information.


    # A Brief Look at SELinux Internals


    In SELinux, the security policy is defined in a text file in the m4 language.
    It is compiled when the policy is finalized, and at boot, loaded into the memory.
    Only the security server can map policy decisions on the permissions of an object.

    SELinux policy consists of components called access objects, which require access
    from client objects, submitted to the security server and enforces the resulting
    decisions.


    The implementation of the security server uses a combination of two mechanisms,
    Type Enforcement (TE) and Role-Based Access Control (RBAC).


    # Type Enforcement


    Type enforcement makes decisions based on what kind of object requests the permissions.
    For example, a process or a socket. Type enforcement could include an object labeling
    system, with access mapping (from the object requesting and the type of the object),
    a return that determines the decision of the actions of the object.


    # Role-Based Access Control


    Role-based access control assigns permissions to objects in a computer system
    based on the role they play within the system. In practice, this means a process
    is restricted based on the user who is allowed at the time and number of other
    uses.


    How processes, file objects and sockets communicate with each other is defined
    by the security policy. The security policy governs the interaction between objects
    through rules.

    At present, SELinux provides binary compatibility with existing applications and
    compatibility with kernel modules. The current implement-


    # Getting and Installing SELinux


    # Installation of sepolicy


    sepolicy is a web-based tool that enables an administrator to administer SELinux
    policies from a Web browser. The interface allows users to verify every action
