  md: "# Beneath the Surface\n\nDon't fear the modular-command-line power of Linux.\n\
    \n![](img/6ad2c38f7c331af69e079dec652dce53_42_0.png)\n\n**JOHN MADDOG HALL** I\
    \ was walking the beach with the Polycows when I saw a small tide pool. I was\
    \ stopped there and looked at some of the life under the rocks.\nMost people look\
    \ under the rocks in a tidal pool or in a freshwater stream, but they find-there\
    \ is a lot of interest and necessary life because they are a very important part\
    \ of the world. Most people only see the glossy surface of the ocean or the stream,\
    \ but they never look any deeply.\nThe same is true with Linux. I have noticed\
    \ that there has been a lot of work on graphical interfaces, with translucent\
    \ windows and different ways of displaying desktops—all of which\nin my opinion,\
    \ the real power of Linux comes from the command-line interface that resides below\
    \ this glossy surface and allows people to manipulate huge amounts of data.\n\
    \ do not expect everyone to learn every type of command-line interface or small\
    \ language, but if you do not at least one or two, you will never know how powerful\
    \ your system can be.\n\nSome people think that it takes a lot of study to “know”\
    \ command-line programming. However, if you approach task systematically, you\
    \ can learn it over time, taking advantage of learning cycles.\nThe first thing\
    \ you should do is to get a book on Linux for Users. A Desktop Quick Guide by\
    \ Figures, Weiss, and (O'Reilly) is a good start. Another good one is Linux Command\
    \ Line by Barrett, also free. Linux Network by Haugna and Wiley is also good.\n\
    Read the book, but not without demerssing in the thinking about it and what you\
    \ have to do to automate that. You will probably find some command-line programs\
    \ that would help make yours.\nWhen you are in Linux, execute a terminal emulator,\
    \ such as one of the others. Always try to find a command mode you like and then\
    \ try to use it and something to get things done.\nWith practice with commands,\
    \ such as grep, ls, and piping them together, you can filter the data to match\
    \ what the command requires. If you create a file of ASCII characters that you\
    \ would like to use in the command-line interface just sort the file, and you're\
    \ done.\nThen, start putting the commands together using the pipe system (|).\
    \ Note that this is not easy if you lowercase or upper-case the | is typically\
    \ found with some of the other characters and keyboards, unless above the Enter\
    \ key.\nBy starting the pipe and is the end\n\n# In opinion, the real power of\
    \ Linux that resides below this glossy surface and allows people to manipulate\
    \ huge amounts of data.\n\nMany years ago, the company where I was working needed\
    \ to get a new piece of software to update our customers. The customers were to\
    \ receive the software represented by two different operating systems, and my\
    \ company was having a clear-cut ability to report this. This estimated time for\
    \ the clerk to do this was nine months, which was almost as long as the customers\
    \ received it.\nI asked if this could be done because the customers were waiting\
    \ for the software. “No,” it won’t be “done,” because the databases were incompatible\
    \ and different. There were no program that could reach across the systems to\
    \ pull the data, and put both files on my (at that time) Linux system. In a quarter\
    \ of a day, using the stream editor sed(1), I was not only able to correlate the\
    \ data but also to produce mailing labels for the shipping boxes with an order\
    \ of being. The managers could not believe it.\n\nls | grep 'e'\n\nThis will show\
    \ you every file in your directory with the letter e in its name.\nThis kind of\
    \ study should be the focus of expressions—ways of describing patterns of data\
    \ that are used for searching or matching other strings of characters. The aforementioned\
    \ books also cover issues of regular expression syntax and some tricky tricks.\n\
    Although different programs use different types of regular expressions, they tend\
