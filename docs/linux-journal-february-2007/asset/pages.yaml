  md: '# FEATURE: CITADEL


    # Uninstallation


    Uninstalling a Citadel instance installed via the Easy Install method is:


    +   1. Delete the three directories mentioned above

    (/usr/local/webcit/citadel and /usr/local/citadelsupport).


    +   2. Remove and WebCit entries from the initab file\ (typically /etc/initab).


    +   3. Type the command init q to restart it.


    Gone.


    # Initial Configuration


    We used the WebCit interface to configure and use our Citadel, but underneath
    the nice GUI beats the heart of a text-mode BBS. All of the configuration and
    much of the daily use of the Citadel system can be used via the text mode Citadel
    from a time of days gone. By said, that communication is largely lost to most
    modern-day users, so we focus on WebCit for the job alone.


    Having said, we still need to log in to Linux for other reasons, so we have to
    change the way Citadel defaults and needs to be redirected somewhere else to get
    any work done. There are a variety of ways to do this, but since Linux provides
    a configurable syslog daemon, it seems logical to change the conf file (on Debian)
    and point the local facility to a log file somewhere else out of the.


    When you first log in to this new WebCit the interface becomes the administrator-level
    user. To create the administrator account, point your Web browser to the host
    and log in. After the installation, enter a user name and password, and press
    the New User button (Figure 1). You''ll know you are administrator if you see
    the administration button on the bottom left of the menu where you logged in (Figure
    2).


    To edit the wide-configuration, click the administration, and you''ll be brought
    into organized and complete sets. Main menus are at the top of the page, and clicking
    each one brings the settings for that item. Citadel is also a text-mode BBS underneath
    the WebCit interface, and some of the configuration options you make will take
    effect.


    A good although of all the items is outside the scope of this, the most important
    is the Network tab, if you''re using LDAP. Under the Network tab, you can enable
    services and modify the properties that you need to change. The directory tab
    is for your LDAP settings. If you''re not using LDAP, you can skip this.


