  md: '# Analyzing Your Search Keywords


    Screen the unwanted results of your search access logs.


    **Last month**, we started exploring how you can use a shell script to extract
    and analyze the HTTP_REFERER values of your Web server log and identify the most
    common terms and phrases that people used to find your pages. Sounds useful, isn''t
    it?


    The problem is, much more nuanced than it seems. Last month, we wrapped up with
    the following shell script:


    ```

    #!/bin/sh


    ACCESSLOG=/var/logs/httpd.access_log

    ngrep ''google.com/search'' $ACCESSLOG | \

    awk ''{print $1}'' | \

    cut -d'' '' -f2 | cut -d''&'' -f1 | \

    sed ''s/%22/ /g;s///g'' | \

    sort | \

    uniq -c | \

    sort -rn \

    head -5

    ```


    Ah, so we can see that there are two valid searches here, one for "wicked cool
    scripts" and one for "Barbara nessa%2bpouses". Not sure what the latter one''s
    about, but it''s useful and important to see. Frequently, screening out false
    results helps to remove those that include an equal sign: grep -v "=$"


    Rather than that at the very end of the long pipe in the script, I placed it after
    the invocation to strip out false as soon as possible in the pipeline. Now it
    looks like:


    ```

    grep ''google.com/search'' | \

    awk ''{print $1}'' | \

    cut -d'' '' -f2 | cut -d''&'' -f1 | \

    sed ''s/%22/ /g;s///g'' | \

    grep -v "=$" \

    sort | \

    sort -rn

    ```


    Notice that the result still includes the item name of the part (q), so that''s
    not incorrectly matched in the new grep. Now we have the results:


    When I ran this, here''s what I saw:


    ```

    $ google-searches.sh | head -10

    94 hit

    10 client:safari

    6 client:firefox-a

    4 source:navdclient

    4 client:opera

    ```


    That''s weird, it doesn''t search terms, other values that are included with search
    strings from sites like Google that say you''ve constrained searches to English-language
    sites only, but it identifies the user''s Browser as Apple''s Safari and so.


    # Screening Out False Matches


    The problem is resolved when we look at the first ten results rather than the
    first five:


    ```

    $ google-searches.sh | head -10

    94 hit

    10 client:safari

    6 client:firefox-a

    4 source:navdclient

    4 client:opera

    3 wicked cool scripts

    ```


    This doesn''t get us a lot of traffic, so let run the very same query as my far-busier
    AskDaveTaylor.com. The results are more interesting:


    ```

    $ google-searches.sh | head -10

    5 standalone player

    4 help

    4 create a myself

    4 Documents and Settings

    4 install-null

    3 view my accounts that are set to private

    3 i hear music on runescape

    2 transfers to file zip

    2 sync v botrola mac

    ```


