  md: '# Cross-Over Applications


    In cases, stubborn applications keep people from moving to the environment they
    desire. Some of these applications are needed frequently and may be handled by
    a product, such as VMware (vmware.com) or Win4Lin (winlin.com), to allow you to
    run applications simultaneously, albeit at a slight performance hit.


    Another great option is CodeWeavers'' CrossOver products (codewavers.com), now
    available for the Intel OS systems. CodeWeavers is based on the free Wine Project,
    and the parent company has been helpful in extending and enhancing Wine''s capabilities
    for many years.


    # Final Steps


    Although we have heard of migrations that have gone cold turkey (turning off one
    system while having heard of many that failed), Nothing takes the place of a good
    transition strategy when going running of the two systems is best, along with
    testing to see achieved data is still available on the new systems.


    Another good trick is to get the enthusiastic workers involved early and make
    sure they have a good experience as they migrate to the new tools. Every office
    has people like this. They buy the latest and greatest gadgets, and are openly
    receptive to new things. Once they are enthusiastic about the new system, they
    can help move people through.


    # Last Recommendations


    Do not be afraid to think outside of the box. I met a man with very old legacy
    code that was working on very old hardware. He was concerned that the very old
    hardware was becoming more and more difficult to replace, and wanted to port it
    to Linux. I told him he could just run a hardware emulator, to support his applications
    and customers "forever". He looked at me strangely, smiled, and walked away.


    Likewise there is Free Software, DOS emulator that allows DOS applications "forever",
    and modern-day CPU speeds makes these applications run blissingly fast.


    Use portable languages like Perl, Python and others to make your applications
    run on many systems as possible.


    Finally, when whatever you have works, write a paper about it, talk to your local
    Linux User Group, give a talk to LinuxWorld or write an article for Linux Journal.
    After all, more or other people are exactly where you are today and would like
    to have more freedom in their software.


    -Jon "maddog" Hall


