    \ name=\"root\" original-url=\"/home/ben/xslt/\n  example.xml/root/files inside\
    \ XML?>\n<context name=\"root\" original-url=\"/home/ben/xslt/\n  example.xml/root/file\"\
    foo?>\n$ cat\n$ v1. translated.xml\n  - makes changes to reverse sheet\n    inserting\
    \ CHANGE_A and change into the elements\n$ ferrisXalanTransform -s example-rev.xml\
    \ -n\n  - translated.xml\n```\n\n## Rolling Custom Stylesheets\n\nFor testing\
    \ purposes, the LIBFERRIS_XSLTS_DONT_UPDATE_introspection is variable, ferris\
    \ returns the stylesheet adjustment and logs what it does but not actually updates\
    \ the system.\n\nThere are a few hints and shown in Listing 1 | I agree here as\
    \ the input fileitem. This allows setting up custom and reverse stylesheets.\n\
    \nTo get the vertices of the XML, ferris uses with its fileitem option. I also\
    \ need to reuse the example.xml to get the fileitem and explicitly select any\
    \ attributes that the xml element will not use.\n\nThe modification of the file\
    \ is shown in Listing 1. The reverse stylesheet can be applied to the translated\
    \ example.xml. Ferris outputs only only, non-destructive change is done by applying\
    \ through/LIBFERRIS,XSLTS_DONT_UPDATE_introspection. Make sure ferris-logging\
    \ is set in the debug-ferris-\n\n## Some Future Directions\n\nThe main feature\
    \ is the automatic development of the reverse stylesheet. This would make setting\
    \ up nodes in the stylesheet file, which would require editing nodes in the transformed\
    \ file.\n\nMore plugins for ferris-to-stylesheet could handle data from local\
    \ sources, such as user authentication in OpenOffice.org. This would be nice.\
    \ Support for joining zip of targets would allow the creation of native OpenOffice\
    \ documents.\n\nMore options of patch would probably become available for the\
    \ reverse stylesheet to use.\n\nResources for this article: http://www.linuxjournal.com/article/9513.\n\
    \nBen Martin has working on filesystems for than ten years. He is currently working\
    \ towards a PhD at the University of Melbourne, Australia. combining Filesystems\
    \ with Concept Analysis to improve human-filesystem interaction.\n\n78 | February\
    \ 2007 | www.linuxjournal.com\n\n## Growing a World of Linux Professionals\n\n\
    LPI-Japan\n- LPI-China\n- LPI-North America\n- LPI-South Asia\n- LPI-Latin America\n\
    - LPI-Deutsch\n\nWe at the Linux Professional Institute believe the best way to\
