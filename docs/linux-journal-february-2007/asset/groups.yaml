    ## 所有人不可避免的迁移


    这期 Linux 关乎迁移，这对我意味着许多意义。人们，甚至少数家庭只使用一种操作系统。


    我们大多数毕业生使用运行 OS（一种 BSD 衍生版）的苹果笔记本电脑。许多这些 Linux 爱好者使用 Ubuntu 或 Blackberry。许多人因为工作被迫使用
    Windows 系统。


    就像德国的某人，Washington经常经常“迁移到 Linux 的成本”，并利用这种“成本”来推高我们喜爱的操作系统的总体成本（TCO），而不承认免费用户对其其他事务的控制权具有更高的价值。


    我也相信它迫使了更多“迁移”，让客户从 DOS 移动到 Windows 31、Windows NT、Windows XP、Windows 2000 和 ME，我们现在正在寻找向
    64 位时代的演进。虽然我们可以帮助解决 64 位操作系统和迁移问题（Linux 在 1995 年就迁移到了 64 位），但我们将全程提供支持。然后，在 Linux（以及其他操作系统）伴而来的阶段和日子里，会有机会与
    Linux 生产者竞争，进行“测试”、“测试”、“测试”。


    加入附近的用户组，并注册迁移列表。如果你不是该列表的新手，只需阅读存档即可，如果有人向你提问，只需查询并等待。


    当你担心自由软件时，请关注自由软件基金会（Free Foundation）和自由软件专业学院（FSPI）的目标。FSF 讨论了标准的重要性，以及如何确保你不会被锁定在任何特定系统中。FSPI
    告诉你自由系统管理员需要以更少的精力管理的益处。


