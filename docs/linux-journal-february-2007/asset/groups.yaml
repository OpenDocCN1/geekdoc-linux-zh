  - "[PAGE 12]\n\n# A Touch of Elegance\n\nI hesitate to issue with an author like\
    \ Dave Taylor, [his script] uses repeated (and in many cases redundant) systems\
    \ and divisions to achieve what simple multiplications can do (Dave's December\
    \ 2006 column?). It also converts to the wrong units. (See man for a discussion.)\n\
    \nA simple algorithm to achieve such effect is embedded in this hash as follows:\n\
    \n```\n#!/bin/sh\n# Script for numeric scaling $1 = number, $2 = iterations\n\n\
    for ((i = 1; i <= $2; i++))\n\n  dk=1024\n  mi=$((dk*$dk)) # 1048576 without type\
    \ risks\n  gi=$((dk*$mi)) # 1073741824 your account details\n\n  value=$1\n  if\
    \ [ $value -lt $dk ]; then\n    units=\"bytes\"\n  elif [ $value -lt $mi ]; then\n\
    \    units=\"KB\"\n  elif [ $value -lt $gi ]; then\n    units=\"MB\"\n  else\n\
    \    units=\"GB\"\n  fi\n\n  printf \"%s %s\\n\" \"$value\" \"$units\"\n  \n\n\
    \  if [ \"$units\" != \"\" ]; then\n    value=$(echo \"scale = 2; $value / $div\"\
    \ | bc)\n  fi\n\necho \"$value units\"\n```\n\nRunning 1000 iterations of each\
    \ on an HP laptop with AMD 2500 showed the revised version to take approximately\
    \ one-quarter of the time (local, user, and system) of original.\n\nAlan Rock\n\
    \nalso worked, when the team arrived to connect to the Internet, what did they\
    \ find? Every piece of equipment was either broken or missing. It was discovered\
    \ that some of the teachers were responsible for some of the theft.\n\nPS. Long\
    \ live KDE!\n\nGeoff\n\nAs we write in-this, we also find a reason why Ubuntu\
    \ seems to be a favorite, yet readers de prefer KDE over GNOME by a significant\
    \ margin. People prefer to refer to variants of Ubuntu, even when it's not better\
    \ than we do some of Linux Ubuntu. Some of us use Ubuntu installed and then use\
    \ KDE (essentially converting to Kubuntu).\n\n# Why Ubuntu and not KDE?\n\nI have\
    \ read a little bit about this Ubuntu, the 2005 Choice Edition, but that you chose\
    \ KDE over Ubuntu. It seems to me that when you were going to pick Ubuntu, you\
    \ chose GNOME, and when you were going choosing KDE, you chose Kubuntu, or you\
    \ simply mean (Kubuntu in general for your Editors' choice distribution)\n\n#\
    \ Erratum\n\nSome of the code was incorrectly mentioned in George Belets's 'The\
    \ Alchemist of Your Own' in December 2006. For the corrected version of the article,\
