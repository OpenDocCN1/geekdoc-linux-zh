- md: "\n# Terra Soft's Yellow Dog Linux for PlayStation 3\n\nLinux people simply\
    \ rock, don't? A case in point is Terra Soft, which has ported its Yellow Dog\
    \ Linux (YDL) to the PlayStation 3 (PS3). Hopefully by the time you read this,\
    \ you can finally get your hands on PS3, because we can't.\n\nWith Sony blessing\
    \ and support from the Barcelona Supercomputing Center, YDL is a full OS for PS3,\
    \ which is based on Fedora 5 and comes with more than 1500 packages. In this project,\
    \ Terra Soft also collaborated with Haizelter and the Enlivenment development\
    \ team to integrate the Blitz, which the firm will provide an \"unprecedented\"\
    \ level of freedom and interface aesthetic.\n\nInstall and source YDL are available\
    \ for download; DVDs are available for purchase from Terra Soft's on-line store.\n\
    www.terrasoft.com\n\n# ADLINK Technology's NuPro-851\n\nADLINK Technology just\
    \ brought for you a full-sized, single-board computer, like the NuPro-851. The\
    \ NuPro-851 is a PiKem 1.0 device that supports 800MHz FSB with a hyper-threading\
    \ Intel Atom, dual-core DDR2 memory at 400MHz and an Intel G45 architecture capable\
