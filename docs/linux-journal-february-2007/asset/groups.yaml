    \ Webmail、支持 100 多种可定义报告的报告引擎以及用于创建电子邮件传递路由的向导。邮件服务器目前提供英语和德语版，并运行在主流发行版上。Agile\
    \ 网站提供评估版。\nwww.agile.com\n\n请将 Linux 相关产品的发布信息发送至 gray@linuxjournal.com 的 James\
    \ Gray，或 Linux Journal, 175 NW Market Street, Seattle, WA 98107。\n\n# Linux 下\
    \ NTFS 工具的力量\n\n一些最优秀的 Windows 工具可能就在你的 Linux 分区里\n\nLinux 环境可以访问本地硬盘或网络上某处的几十个文件系统。Linux\
    \ 可以运行许多工具来操纵 Windows 文件系统或修复 Windows 分区。\n\n这些工具来自 Linux-NTFS 项目。其中一个工具可以调整分区大小。另一个工具则更具独立性。可以从集中存储镜像中克隆\
    \ NTFS 分区，并在网络上更新镜像。但由于这些工具是 Linux 程序，它们受益于 Linux 环境的力量。当你处理双系统系统时，这些工具会非常有帮助，如果你有一个大型网络，它们是不可或缺的。通过依赖重定向、管道和脚本，可以轻松从\
    \ Linux 自动化许多重要任务。\n\n现在，下载 ntfs 源码并将其保存在方便的目录中。以 root 身份运行，将在你构建 NTFS 包时提供帮助（当你读到这里时，实际版本可能已经变化）。\n\
    \n# 构建\n\n```\ntar -xzvf ntfs-1.13.1.tar.gz\ncd ntfs-1.13.1\n./configure\nmake\n\
    make install\n```\n\n使用 FUSE 库构建 ntfs 时，你在运行 `configure` 命令时将得到干净的结果：\n\n# 安装\n\
    \n这些工具广泛可用并受支持。所有带有包器的 Linux 发行版都有相应的软件包，软件本身包含在 Linux Live CD 中。许多发行版包含仅供 root\
    \ 用户运行的工具。要查看你的安装系统中是否安装了这些工具，请咨询列出所有软件安装位置的包管理器。\n\n即使缺少软件或文档，你也可以自行安装。对于 SUSE、Debian\
    \ 和 Ubuntu，请搜索包名并进行安装。对于某些发行版，你可能需要从源码编译。注意，Debian 版本包含 ntfs 工具，而 Source 版本的包不包含。Red\
    \ Hat Fedora 发行版不支持它。对于 RedHat，可以直接从 Linux-NTFS 项目获取 NTFS 驱动程序。请咨询该项目的实际主页以获取更多信息，以及全套工具的源码和说明。\n\
    \n```\nchecking for FUSE_MODULE, configure: WARNING: \nfsmount requires FUSE version\
    \ > 2.3\n```\n\n安装其他工具不应该有问题，但你将无法编译 ntfs。如果你使用的是 RedHat Fedora，你可能甚至内核驱动都没有装好。强烈建议在离开之前安装带有\
    \ `kernel-ntfs` 驱动的自定义内核，或者安装 FUSE 库。\n\n到此时，如果你已经安装了 ntfs，或者你已经查看过 ntfs 页面，可以看到完整的工具列表。以下是\
    \ `man` 手页的一部分：\n\n- ntfsformat() - 使用 NTFS 格式化分区\n- ntfscat() - 将文件导出到标准输出\n\
    - ntfsclone() - 克隆、创建或恢复 NTFS 分区的镜像\n- ntslocate() - 定位 NTFS 上任何扇区或簇的位置\n- ntfscheck()\
    \ - 验证 NTFS 分区上的文件\n- ntfsfix() - 检查并修复常见错误\n- ntfsinfo() - 显示 NTFS 分区或某个目录的信息\n\
    - ntfslabel() - 显示或设置 NTFS 分区的卷标签\n- ntfslist() - 列出 NTFS 分区文件信息\n- fsmount()\
