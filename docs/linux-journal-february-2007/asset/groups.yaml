    也就是说，通常情况下，如果一个进程执行另一个进程，第二个进程将失败，而不会在安全上下文中运行。如果启动了子进程，子进程将以自身的身份在域中运行。然而，如果它尝试在另一个域中启动进程，Linux
    将需要确定是否允许这样做。与许多事情不同，事务必须通过 SELinux 策略显式授权。这就是权限如何以类似方式工作的一个示例。


