    We realize the importance of providing a global standard of measurement. To assist\
    \ in this effort, we are launching a Regional Enablement Initiative to ensure\
    \ we understand, nurture and support the needs of the enterprise, governments,\
    \ educational institutions and individual contributors around the globe.\n\nWe\
    \ encourage you to contact our new regional partners listed above. Together we\
    \ are growing a world of Professionals.\n\n## Stable. Growing.\n\n## Simple Access\
    \ Berkeley DB\n\nOne major difference between the Database and a C++ collection\
    \ is that the key and value are not portable. The main reason for this is that\
    \ the items in Database object are not in RAM but are read from disk. In order\
    \ not to limit the flexibility offered by Berkeley DB, the Database supports storing\
    \ arrays of heterogeneous collections of objects.\n\n## Storing Objects\n\nThe\
    \ listed objects are created using implicit construct and stored in heap objects.\
    \ Shown in Listing 5, the Person class stores many objects about the people. The\
    \ implicit constructor takes a DatabaseValue&Ref, which is returned by the array\
    \ operator in Database. A Person object is implicitly converted to a std::string\
    \ to be enabled to be stored as disk.\n"
