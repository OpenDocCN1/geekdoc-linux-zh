    # The Citadel Groupware Server

    Microsoft Exchange, Meet Your Replacement

    Jon Watson


    # Installation


    He has time to consider moving to a smoother, more robust system. The analysis
    has been done, the meetings held, the presentations complete, and now it''s go.
    Installing and configuring a Linux server isn''t going to be easy. What if they
    want uninterrupted functionality so they can continue their job?


    I cover the Easy Installation method here not only because it''s easy, but it''s
    also fairly demanding on resources and therefore quite likely that anyone can
    make use of it. Just also the requirement for the Easy Installation method is—and—preferably
    fast—internet connection.


    The installation might require the toolchain or build environment to be present
    on the target platform. If you''d like to set up SSH connections to the server,
    you can use the following command to install or verify your build:


    One of the wonders of the Free and Open Source world is the Citadel server. Created
    by a single developer, Citadel started in 1998 as a version of the already-existing
    Linux. Almost every modern desktop distribution is based on Linux.


    ```

    apt-get install build-essential curl libssl-dev

    ```


    Before installing, it''s worth noting that Citadel is designed as a black box
    system running on your server. Part of that box means Citadel authenticates against
    its own database and not your system database. If you want to authenticate against
    your own server database, you must export the CITADEL_URL variable before running
    the Citadel install:


    Citadel boasts all of the functionality of a modern group server. One of the miracles
    that Citadel can perform is that it can replace Exchange with less fuss and even
    less cost.


    ```

    export CITADEL_URL=citadel

    ```


    Many organizations are coming to the realization that they are hit by Microsoft''s
    licensing fees and hardware requirements. Organizations can prepare for some of
    these costs, many are easily avoidable with Citadel.


    Now that the server is ready, it''s time to install Citadel.


    It isn''t necessarily observed over the top, many organizations will still need
    to upgrade their hardware in order to run it. And, sooner or later—upgrade cost
    is a never-ending source of pain for some organizations, because not only server
    and software need to be upgraded to avoid bottlenecks and unwanted workloads.


    ```

    curl http://easycitadel.org/install | sh

    ```


    Depending on the size of your organization, Citadel might not require a robust
    server in the closet, and finding a replacement for Exchange is often a show-stopper.
    Citadel is humble, and it brings a lot of power to the party, it doesn''t assume
    you that


    # How to Get It


    It''s always practical to test everything on a test server before moving it into
    a production environment. Swapping your mail server is no different, and you should
    keep your mail server testing as far away as possible.


    Configuring Citadel is several orders of magnitude easier with an Internet-connected
    server, however, because you can use the Easy installation process.


    As of this writing, the current version of Citadel is 6.84. I highly recommend
    a trip to the site in order to obtain the most current version of the server and
    the latest version of the installation instructions.


    Our testing environment consisted of Debian Sarge with a 2.6 kernel running in
    VMware Player 1.0.2. For particular we selected the Web Server installation option,
    but virtually any installation category should, as Citadel installs everything
    it needs. In the past, we have installed and run Citadel on a Debian server proper,
    and in both cases the installation was flawless.


