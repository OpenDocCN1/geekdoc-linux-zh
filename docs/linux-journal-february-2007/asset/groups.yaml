  mdcn: "\n\n## awk 并不那么笨拙\n\n我没有 Dave 那样对 awk 的赞誉（参见 Dave 在 2006 年 11 月的专栏）。我无法访问\
    \ Web 文件，也没有相应版本的 Linux。然而，我知道他的解决方案可以用 awk 编写。在 AIX 和 HP-UX 上，我伪造了一个日志文件，通过作弊的方式修改了\
    \ `date` 命令的时间，并测试了我的解决方案。\n\n以下是我复制的 Dave 示例的 awk 代码：\n\n```bash\n#!/bin/sh\n\
    \nLOGFILE=\"home/limol/logs/intuitive/access_log\"\nawk '\n  if (index($0, YESTERDAY))\
    \ {\n    hits++\n    bytes+=$10\n    remail++\n  }\nEND {\n    printf(\"Calculating\
    \ transfer data for %s\\n\", YESTERDAY)\n    printf(\"Sent %d bytes of data %d\
    \ hits\\n\", bytes, hits)\n    printf(\"For an average of %f bytes/hit\\n\", bytes\
    \ / hits)\n    printf(\"Estimated monthly transfer: %d bytes (bytes * 30)\\n\"\
    , bytes)\n  }' -v YESTERDAY=$(date -v-day \"+%%d/%b/%Y\") \"$LOGFILE\"\n```\n\n\
    - Rory Hammond\n\n数据的应用层（例如“普通”模式下的 FTP），这需要 NAT 路由器处理并检查每一个修改的数据包。\n\n遗憾的是，Dee-Ann\
    \ 推荐的那个仍然可用，但不支持 Linux；他们的 Linux 专家已经离开了该项目。但是，一切都完蛋了；Linux 不会回来了。一个名为 PSC2 的新\
    \ Linux 项目启动了，新版本是\n\n- Bob\n\n### SSH 与 DenyHosts\n\n关于 SSH 字典攻击的担忧（参考 2006 年\
    \ 6 月）。由 George Belkofsky 编写的《我的服务器》（*A Server of Myself*）；以及精彩的 DenyHosts：详细介绍……\n\
    \nDenyHosts 拦截进入你服务器的入站连接（许多是 SSH，但也可以是 FTP 或任何带有登录/密码和日志文件的服务），并通过自动添加到 `deny.hosts`\
    \ 中来封锁 IP 地址。\n\n我让它在一个新的 Web 服务器上运行了一个月，它已经已经记录了超过 7,000,000 次失败尝试！\n\n此外，你还可以将你的白名单与\
    \ DenyHosts 网站共享，从而提供一个包含真正坏子的超级黑名单。\n\n- Carlos Vidal\n\n### Java Java Java\n\
    \n我一直在等待 Java 的到来。Java 怎么样呢（Ajax 之前的 Ajax），Java servlets（以及真正的跨平台东西）。我期待听到并读到关于它的消息。\n\
    \n- Mark Molenda\n\n我们的列表恰好有这样一篇文章！——编辑。\n\n### Linux 上的 PlayStation\n\n在《LI》2006\
    \ 年 5 月份中，有一篇由 De-Earl Barnett 写的关于上述主题的文章。\n\n## Linux 笔记本电脑\n$799 起售价\n\n![](img/6ad2c38f7c331af69e079dec652dce53_11_0.png)\n\
    \n## Linux 桌面式电脑\n$375 起售价\n\n![](img/6ad2c38f7c331af69e079dec652dce53_11_1.png)\n\
    \n## Linux 服务器\n$899 起售价\n\n![](img/6ad2c38f7c331af69e079dec652dce53_11_2.png)\n\
    \n感谢《LI》提供本月最佳列表。永远记住：有 Linux 用户，然后是社会的其他部分。\n\n- Dev Casin\n\n### 一 Linux，多面孔\n\
    \n在（《LI》2006 年 12 月份）中，Jon Alexander 描述了他的朋友 James 如何通过登录不同的桌面环境来引起他的兴趣。如果他能登录多个桌面并在\
    \ Linux 和其他操作系统之间切换，他会为了实际需要而包含几个桌面环境。此外，不要忘记 Linux 支持的虚拟桌面。\n\n- James Knott\n\
    \n### 窃取的轨迹\n\n读到 Jon \"madad\" Hall 在这篇文章中的经历很有意思，文章标题为：《人民的软件》（*Software of\
    \ the People*，参见《LI》2006 年 12 月份的 UpFront 栏），并将其与我们俱乐部几年前的经历进行对比。\n\n俱乐部委员会决定了成员是否会将他们的多余设备捐赠给俱乐部。俱乐部会将这些设备捐赠给索韦托的一所学校，并将其建立为连接互联网的本地网络。\n\
    \n安装工作顺利，本地网络\n\n## 别墨守成规！去用 CUB！\n\n![](img/6ad2c38f7c331af69e079dec652dce53_11_3.png)\n\
    \n![](img/6ad2c38f7c331af69e079dec652dce53_4)\n\n## 优雅之触\n\n我犹豫是否采用像 Dave Taylor\
    \ 这样的作者，他的脚本使用了重复的（在许多情况下）系统和分区来实现本简单乘法就能完成的功能（Dave 在 2006 年 12 月的专栏？）。实现这种效果的简单算法嵌入在此哈希中，如下：\n\
    \n```bash\n#!/bin/sh\n# 用于数值缩放的脚本 $1 = 数字, $2 = 迭代\n\nfor ((i = 1; i <= $2; i++))\n\
    \  dk=1024\n  mi=$((dk*$dk))\n  value=$1\n  if [ $value -lt $dk ]; then\n    units=\"\
    bytes\"\n  elif [ $value -lt $mi ]; then\n    units=\"KB\"\n  elif [ $value -lt\
    \ $gi ]; then\n    units=\"MB\"\n  else\n    units=\"GB\"\n  fi\n\n  printf(\"\
    %s %s\\n\" \"$value\" \"$units\")\n\n  break -n 1\n  value=$(echo \"scale = 2;\
    \ $value\" | bc)\n```\n\n"
