    ## Security Contexts: Users, Roles and Domains


    The role is what represents the user in SELinux, the domain is the object. The
    security context is a multi-part string, usually in the form user:role:type:level.
    The user is the identity of the process, the role is the set of permissions the
    process can use, the type is the domain the process runs in, and the level is
    the sensitivity of the process.


