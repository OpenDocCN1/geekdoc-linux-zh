    - Electricity generation.\n- Waste treatment.\n- Landfills.\n\n#### Private:\n\
    - Telephony.\n- Broadcasting.\n- Garbage collection.\n- Energy extraction.\n\n\
    #### Mixed:\n- Roads.\n- Reservoirs.\n- Power plants.\n- Water systems.\n\n###\
