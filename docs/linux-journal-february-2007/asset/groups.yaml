    \ and public commitment to build out the Net happened quickly and with as much\
    \ capacity as possible, the goals are the same: Net build-out is a top priority.\n\
    \nMeanwhile, in the US, we have left it to TV and telephone companies that have\
    \ never squandered opportunities (like AT&T, which has never busted), but have\
    \ pocketed millions in federal subsidies for fiber build-outs. Here's how networking\
    \ pioneer (and co-founder of the spreadsheet) Bob Brill puts it:\n\n> \"For those\
    \ worried about competition, it would be better to do worse than in a system where\
    \ there is a fundamental conflict of interest; today's providers have a very strong\
    \ incentive not to maintain security—especially when burdened with costs that\
    \ do not increase the value of their service.\"\n\nThis is why fiber deployment\
    \ like Verizon's FIOS is better at building out delivering high-definition (and\
    \ competing with cable TV), rather than delivering Internet connectivity. The\
    \ fiber we are laying for FIOS is really a cable TV plant disguised as a Network.\
    \ Passive Optical as a distribution from a head to the terminals at each home;\
    \ though they do have capacity to send data. A single fiber has gigabits of traffic.\
    \ There's so much capacity that we could simplify the approach to emulate cable\
    \ TV. The 15Mbps required for Internet service is less than 1% of what they have!\n\
    \nHere, 'Direct and transparent funding is useful, but under the current legal\
    \ system, we do not have the grant to provide any incentive—we can all add this.'\
    \ The problem is funding the Internet is as hard as building roads, because we\
    \ waste time, easements, railways or power lines with large trenches mapping across\
    \ for a matter of contention and fiber-optic cabling in the ground, or hanging\
    \ cables from places that are already—deploying wireless fiber with \"backhaul.\"\
    \ \n\nBob Brill's perspective is for individuals and communities tied to build\
    \ their own DIY (do-yourself) \"plant\" and connect in their own ways with each\
    \ other; bypassing the cable-duopoly and the \"regulator\"—this word, and it's\
    \ an excellent one that governs it. Local DIY networking is currently in Copenhagen,\
    \ where I wrote about long ago. Not particularly for the Organization for European\
    \ Communities, which is the top country in development and growth. The US is 12th\
    \ in penetration and 17th in growth.\n\nThere are options to use local grants\
    \ for DIY Net build-out \"projects\" by cities and counties—so far across the\
    \ country. In Utah, Mercury—a town with a 33k Hispanic population and $8 million\
    \ (Utah's largest farm plant)—spending around $8 million on a wireless build-out\
    \ that intends to deliver gigabit to every neighborhood in Utah.\n\nUtah is a\
    \ fiber-build that sells to wholesale customers. One of the early fiber-builds\
    \ in New York. In Vermont, Burlington is currently building out a \"triple play\"\
    \ (Internet, phone, and video) retail. Each offer is different, but all of them\
    \ have one thing: 1) they don't want the carriers, and 2) they're doing for every\
    \ city, organization—and not for common people.\n\nNaturally, the communities\
    \ oppose them. They say access is coming (with competition) which is highly ironic,\
    \ given the carriers have a monopoly-like regulatory protection for the public.\
    \ The carriers have been lobbying for anti-monopoly law at state and federal levels.\
    \ One of their successes is the Local Government Access Act, which was passed\
    \ at the behest of the courts to \"level the playing field\" for them. The law\
    \ has had no effect, except in Lafayette.\n\nEverywhere you look, the carriers\
    \ are at odds with their own concerns. November 7th saw the voters in Electricity's\
    \ decide to build out a fiber-based network.\n\nThe next election is going to\
    \ be heated, especially with a likely new US Congress that features a Democratic\
    \ Party majority. In the past, neutrality legislation failed, introduced by Democrats,\
    \ defeated by Republicans. The Republicans are looking for a way to kill the bill\
    \ they introduced in 2001. And now, the carriers can fight back if that legislation\
    \ is set up by PR as we all know.\n\nThere are matters worth answering by one\
    \ brief and simple question: Is the Net or public infrastructure? The carriers\
    \ can say. To help find the answer, here is a list of infrastructures, inserted\
