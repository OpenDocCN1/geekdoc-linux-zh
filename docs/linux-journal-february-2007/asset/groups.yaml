    ```


    Along same lines, Linux also has the commands shown in Table 1. NTFS is supported
    via the above-mentioned tools. NTFS also ships with rfifo, which can be used to
    read from NTFSPartitions. To edit the hard disk under NT2000/XP Linux, you need
    administrator privileges. Under a user account, you may not be able to access
    the hard disks. NTFS does not respect Linux windows. This means if users were
    to mount the device, they could not edit files without root privileges.


    # LTOOS Net Framework Client


    The .NET framework is one of the most-feature clients available in LTOOS. To run
    it, you need to download a copy of the Microsoft .NET framework from (https://www.microsoft.com):


    ![](img/6ad2c38f7c331af69e079dec652dce53_62_0.png)


    the modifications necessary to get it running.


    # LTOOS Java Framework Client


    If your Windows is Windows 95/98/ME and the interface does not support the .NET
    framework, for the Java interface, you need a copy of the Java Runtime Environment,
    which you can download from java.sun.com. The interface has features analog to
    the .NET client.


    # LTOOS Web-Based Interface


    The best interface in LTOOS, based on my experience, is to run with a built-in
    web server, LTOOS-Linux, which allows users to start and access files via a web
    browser. This is very great if you want to share files with other people. However,
    LTOOS-Web is globally accessible, so if you configure it properly, it could be
    accessible from any local network that has access to it. The LTOOS-Web server
    is still in beta, however, it will be fixed in future releases.


    LREADIn is still has some limitations, including issues with some browsers such
    as Internet Explorer, which relies on the server-side response. LREADIn, in its
    current version, has been implemented as a mono-threaded application and cannot
    handle multiple people at the same time, which leads to concurrency issues. Furthermore,
    most user inputs (and filenames) are not validated. If a file is formatted incorrectly
    or misinterprets a hard disk, the Web server can go into an unstable state, which,
    fortunately, does not result in data loss.


    # Conclusion


    Linux is increasingly more support for filesystems. LTOOS provides a unified way
    through an interface of filesystems. However, for Linux filesystems in Windows
    there is still no way to support open-source filesystems without external drivers.


    Available drivers for using disks, such as in ext2 and ext4, are not integrate
    with LTOOS. Windows is an imperfect area, and here it would be a serious problem
    to integration. However, when Windows stands the difference between MS and Linux,
    the Open Source community must focus on improving filesystems.


    ![](img/6ad2c38f7c331af69e079dec652dce53_62_1.png)


