    Caro abbonato,


    Come annunciato in precedenza tramite Linux Journal, a seguito della sospensione
    dell''edizione in lingua italiana di Linux Journal, continuerà a ricevere l''edizione
    elettronica in lingua inglese.


    Sicuramente apprezzerà i vantaggi di ricevere più rapidamente le notizie del settore
    in edizione integrale.


    Cogliamo l''occasione per segnalare i prossimi convegni organizzati da Duke Italia:


    ## Business Mobility, 2007

    Milano 22 Febbraio


    - Lavorare in mobilità - Messaggistica - VOIP – Accesso agli Host mobili - Gruppi
    di lavoro mobili - Accessione di dati in campo.


    ## Garantire la Sicurezza e la Disponibilità di Dati e Sistemi

    Torino 28 Febbraio


    Nelle imprese le soluzioni di backup-up e di recupero dati di Symantec garantiscono
    i massimi livelli di continuità e di sicurezza operativa agli utenti.


    ## Soluzioni Avanzate, Sistemi e Server per la PMI, 2006

    Milano 22 Marzo


    L''infrastruttura di rete e la crescente richiesta di banda, affidabilità, protezione
    degli accessi, monitoraggio.


    ## Security and Business Continuity, 2007

    Milano 19 Aprile


    Architetture e strategie per assicurare la Business Continuity nelle imprese –
    Sicurezza degli accessi – Sistemi di storage e tecniche di protezione dei dati.


    La informiamo che l''accesso ai conveg è gratuito.


