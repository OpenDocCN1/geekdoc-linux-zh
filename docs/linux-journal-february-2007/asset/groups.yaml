- md: "\n## Virtual Filesystems Are Virtual Office Documents\n\nUse librbis, XML and\
    \ XSLT to create virtual filesystems and documents. **BEN MARTIN**\n\nFilesystems\
    \ can be made into virtual office documents. The old Unix slogan \"everything\
    \ is a file\" together with the xsltf/ filesystem allows for transparent editing\
    \ relational databases, and arbitrary XML with OpenOffice.\n\nThe librbis filesystem\
    \ presents both files and data. The boundaries of what is considered a file include\
    \ such as PostgreSQL, LDAP and Firefox as well as standard Web items, as HTTP,\
    \ FTP, and MIDI.\n\nReverse filesystems allow documents to be synthesized from\
    \ other directories. A collection of existing files allows a filesystem to show\
    \ the union of those bases.\n\nOpenOffice can now save the file. The filesystem\
    \ then applies a reverse XSLT and updates the input filesystem (in this case a\
    \ PostgreSQL) to reflect your changes.\n\nTo support this, you will have two XML\
    \ files. The first stylesheet translates an input file into the format you are\
    \ interested in. The second XML file (the reverse stylesheet) provides the inverse.\
    \ The second file should become optional if it can be inferred from the actions\
    \ of the translation.\n\nReverse stylesheets update each explicit URL or relative\
    \ path. The reverse XSLT method specifies the reverse stylesheet to update the\
    \ attribute for each file to be updated. This can be convenient for xslltfs where\
    \ URLs play a role in both the source and target. For example, when you save a\
    \ document in OpenOffice, the source URI will be available to the reverse stylesheet\
    \ to use update.\n\nAlthough there are difference between librbis filesystem and\
    \ the XML model data, there are also many similarities. A file's metadata is created\
    \ as Extended Attributes (EAs), which map to XML elements in the file element.\
    \ An element difference between a file and an XML model data is that the ordering\
    \ of elements is not guaranteed to be preserved.\n\nThe reverse stylesheet is\
    \ conceptually similar to applying diff and patch to files. The reverse stylesheet\
    \ creates a list of changes to make a relative path for each file and the patch\
    \ is then applied. The reverse stylesheet as the root element returns an attribute\
    \ that can strip the attribute from the path. If this is true, we can create new\
    \ files where the reverse stylesheet specifies a relative path that does not exist\
    \ in the current filesystem.\n\nBecause of the relation with XML model data, librbis\
    \ filesystem supports viewing every file as a Document Object. It is possible\
    \ to treat any file as an XML document, as the lines between what is a file and\
    \ what is XML are often blurred.\n\nReverse filesystems may contain the entries\
    \ of the current filesystem. This is not required, but if it is, the translation\
    \ will be fully available in the translated filesystem.\n\nMany modern applications\
    \ use their documents as XML. Filesystems and XML can be interchanged with librbis,\
    \ this allows you to use XML editors to edit files. One downside with using XML\
    \ editors to edit the files is that the schema of the XML file usually does not\
    \ match the layout of the file.\n\nThe following sections show two uses: creating\
    \ new virtual filesystems and editing documents from the current filesystem. This\
    \ is often achieved by using custom filesystems handlers.\n\nThe xsltfs can be\
    \ used to create a translated file that matches the application it is expecting.\
    \ For example, you could take a table in PostgreSQL as the database and have that\
    \ table into a spreadsheet file, which you then load into OpenOffice.\n\nThe xsltf\
    \ shown in Figure 2 create our translated filesystems from the input file. It\
    \ is important to note that the input file in this case is generated from an XML\
    \ file.\n\nThe possibilities become even more interesting when the supported filesystem\
    \ is considered. After you make some changes to the reverse stylesheet in,\n\n\
    The translated file can be used just like any other file with the command-line\
    \ tools, fdisk, find and so on. The xsltfs/ URL scheme in librbis lives above\
    \ most other URL.\n\n72 | 2007 | www.linuxjournal.com\n\n# SOFTWARE DEVELOPMENT\
    \ WEST 2007 CONFERENCE & EXPO\nMARCH 19-23, 2007 | SANTA CLARA CONVENTION CENTER\
    \ | SANTA CLARA, CA\n\nALL THE KNOWLEDGE YOU NEED\n\nEARLY BIRD DISCOUNT\nRegister\
    \ by FEB 23\nSAVE UP TO $300\n\nCELEBRATING YEARS!\n\n# OVER 200 SESSIONS IN 14\
    \ IN-DEPTH TRACKS\n\n- Business of Software\n- C++\n- Java\n- NET\n- Ruby\n- Modeling\
    \ & Design\n- People, Projects & Methods\n- Requirements & Analysis\n- Security\n\
    - Testing & Quality\n- Web 2.0\n- Services/SDA\n- XML\n\nSTROUSSTRUP & STUTTER\
    \ ON C++\nBACK BY POPULAR DEMAND:\nJoin C++ creator Barnes Stroustrup and renowned\
    \ C++ expert Herb Stutterun for an in-depth two-day tutorial on C++.\n\n# NEW\
    \ THIS YEAR: RUBY, WINDOWS VISTA AND WEB 2.0!\nPLUS: Keynotes, Expo, Birds-of-a-Feathers,\
    \ Panels, Case Studies, Roundtables, Parties and Special Events\n\nREGISTER TODAY\
    \ AT WWW.SDEXPO.COM\n\n## INDEPTHH\n\nListing 1. example.xml\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<root>\n  <file size=\"\
    200GB\">\n    <file>filesystems inside XML</file>\n    <file myttr=\"foo\">Something\
    \ blue</file>\n  </file>\n</root>\n```\n\nListing 3. Generating a Translated Filesystem\
    \ for example.xml\n\n```\nxsltfs://context/file/example.xml\n```\n\nListing 2.\
    \ example.xsl\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<xsl:stylesheet\
    \ xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\" version=\"1.0\">\n  <xsl:output\
    \ method=\"xml\" encoding=\"utf-8\"/>\n  <xsl:template match=\"\">\n    <root>\n\
    \      <xsl:apply-templates/>\n    </root>\n  </xsl:template>\n  <xsl:template\
    \ match=\"file3\">\n    <content>\n      <xsl:value-of select=\"@url\"/>=\"Content\"\
    \n    </content>\n  </xsl:template>\n  <xsl:template match=\"file7\">\n    <content>\n\
    \      <xsl:value-of select=\"@url\"/>=\"foot\"\n    </content>\n  </xsl:template>\n\
    </xsl:stylesheet>\n```\n\nListing 4. Exploring Our New Filesystem\n\n```bash\n\
    $ export LIBFERRIS_XLTSFS_SHEETS=/tmp/example\n$ cd /tmp/example\n$ ls\nexample.xml\
    \  example.xsl\n$ cat xsltfs://context/file/example.xml?stylesheet=example.xml\n\
    ```\n\nOutput of:\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"\
    no\"?>\n<root>\n  <file name=\"file3\">\n    original-url=\"file:///tmp/example.xml/root/file3\"\
    >filesystems inside XML\n  </file>\n  <file name=\"file7\">\n    original-url=\"\
    file:///tmp/example.xml/root/file7\">foot\n  </file>\n</root>\n```\n\nThe result\
    \ of applying a stylesheet to the example will be the contents of a directory\
    \ at that location. For example, example-filesystem is a virtual directory. Without\
    \ any use of `/`, the filenames and parameters are used to specify the name of\
    \ a virtual directory. There is no ambiguity, because the name is embedded directly\
    \ into the path of the virtual directory. This is shown in the examples below.\n\
    \nPart of the example is shown in Listing 3 to make things clear. The output of\
    \ the example uses the Gtk-like syntax to name a virtual directory. librbis creates\
    \ this virtual directory to allow direct navigation into the translated filesystem.\
    \ The root element of the translated filesystem, in XML, is the document root\
    \ of the result of applying the foo.xsl stylesheet.\n\nThe path is set using the\
    \ XSL stylesheets to join the ferris-path with virtual-path. In addition, the\
    \ LIBFERRIS_XLTSFS_SHEETS environment variable allows to pass the path and reverse\
    \ direction located. This makes using xslfs with the FUSE module from shell scripts\
    \ simple, as you do not need to install your stylesheets. Stylesheets are stored\
    \ in a location where librbis can read them.\n\nFor the examples of this have,\
    \ I have the stylesheets stored in /tmp/example. If I am running examples from\
    \ the example directory, it is sufficient to put into my xlspath—see the example\
    \ in Listing 4.\n"
  mdcn: "\n\n## 虚拟文件系统即虚拟办公文档\n\n使用 librbis、XML 和 XSLT 来创建虚拟文件系统和文档。**BEN MARTIN**\n\
    \n文件系统可以转换为虚拟办公文档。传统的 Unix 口号“一切皆文件”结合 xsltf/ 文件系统，允许使用 OpenOffice 透明地编辑关系型数据库以及任意\
    \ XML。\n\nlibrbis 文件系统同时呈现了文件和数据。被视为“文件”的边界包括 PostgreSQL、LDAP 和 Firefox，以及标准的\
    \ Web 项目，如 HTTP、FTP 和 MIDI。\n\n反向文件系统允许从其他目录合成文档。现有文件的集合允许文件系统显示这些基准（bases）的集。\n\
    \nOpenOffice 现在可以保存该文件。文件文件系统应用反向 XSLT 并更新输入文件系统（在此例中为 PostgreSQL）以反映你的更改。\n\n\
    为了支持这一点，你将拥有两个 XML 文件。第一个样式表将输入文件转换为你感兴趣的格式。第二个 XML 文件（反向样式表）提供反向转换。如果可以从转换的动作中推断出来，则第二个文件应该是可选的。\n\
    \n反向样式表更新每个显式的 URL 或相对路径。反向 XSLT 方法指定反向样式表来更新每个需要更新的文件的属性。这对于 URL 在源和目标中都起作用的\
    \ xslltfs 来说非常方便。例如，当你在 OpenOffice 中保存文档时，源 URI 将供反向样式表用于进行更新。\n\n尽管 librbis 文件系统与\
    \ XML 模型数据之间存在差异，但它们也有许多相似之处。文件的元数据作为扩展属性（EAs）创建，这些属性映射到文件元素中的 XML 元素。文件与 XML\
    \ 模型数据之间的元素差异在于，元素的顺序不保证能被保留。\n\n反向样式表在概念上类似于对文件应用 diff（差异比较）和 patch（补丁）。反向样式表创建一个更改列表，为每个文件生成一个相对路径，然后应用补丁。反向样式表作为根元素返回一个属性，该属性可以从路径中剥离属性。如果这成立，我们可以创建新文件，其中反向样式表指定的相对路径在当前文件系统中并不存在。\n\
    \n由于与 XML 模型数据的关联，librbis 文件系统支持将每个文件视为一个文档对象（Document Object）。可以将任何文件视为 XML 文档，因为文件与\
    \ XML 之间的界限往往是模糊的。\n\n反反文件系统可能包含当前文件系统的项目。这不是强制要求的，但如果是的话，翻译在翻译后的文件系统中将完全可用。\n\
    \n许多现代应用程序将其文档作为 XML。文件系统和 XML 可以通过 librbis 进行交换，这允许你使用 XML 编辑器编辑文件。使用 XML 编辑器编辑文件的一个缺点是，XML\
    \ 文件的架构通常与文件的布局不匹配。\n\n以下章节展示了两个用途：创建新的虚拟文件系统以及从当前文件系统编辑文档。这通常通过使用自定义文件系统处理器实现。\n\
    \nxsltfs 可用于创建一个与应用程序期望格式匹配的翻译文件。例如，你可以将 PostgreSQL 中的表作为数据库，并将该表转换为电子表格文件，然后将其加载到\
    \ OpenOffice。\n\n图 2 所示的 xsltf 从输入文件创建我们的翻译文件系统。需要注意的是，在这种情况下，输入文件是由 XML 文件生成的。\n\
