    # Decision Making by SELinux


    There are two types of decisions: SELinux must make concerning subjects, and objects:
    Access decisions and transition decisions.


    Access decisions involve deciding which objects are allowed access or creating
    new things that remain in the same domain. Access decisions are easy to understand:
    see our example /home/selinux/messages.txt?


    Transition decisions, are a bit more complex. They involve the invocation of processes
    in different domains than the one in which subject is running or the context


