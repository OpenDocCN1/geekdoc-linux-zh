    +   - Telephony.

    - Broadcasting.


    Kernel development is not about Moses. The natural selection, which is not proactive.
    Every path to the kernel is adaptive, responding to environmental pressures as
    to improvements on what it needs.


    We can argue about what belongs on the list and what doesn''t. It''s about what
    we need public infrastructure to support.


    The species-like of FOSS (free and open-source) is organized by community development,
    which grows through give-to-service making—unlike traditional infrastructure,
    which is built to serve as much as possible, to markets, to economies.


    Public infrastructure is manufactured. Reservoirs are made-man-made lakes. Waste
    treatment systems are man-swamps. Roads and bridges are made-man-made. Power-generating
    plants are for connecting or extracting energy from nature. At their best, public
    infrastructure like water, waste treatment should conform to the supportive environment
    and materials that make up the world''s lands and waters.


    All this was evident last November, when I walked around the exhibition hall at
    SPOCS. During periods of intense development, software developers (unlike hardware
    element) built their systems on Linux. When some of the bolts were on Linux on
