    4 或更高版本），使用 `pdf23`。还有一个 `pdfascii` 程序。它会让你选择输出的 PDF 版本。你也可以使用 `htm2txt` 和 `postcss`
    将 PDF 文档转换为 HTML 或 ASCII 文档。你还可以找到名为 `ps2ascii` 的程序，它的功能大同，处理带有所有 HTML 标签的编码文本。`htm2text`
    程序的设计理念是输出文件，你需要使用 `-o` 指定它。


