    [john@ubuntu] Installing QEMU module...

    [john@ubuntu] [OK] QEMU module installed in /lib/modules/5.4.0-generic/

    [john@ubuntu] Starting WinLin Pro.

    ```


    ## FEATURE: WINLIN


    Now it is time to install my single instance. We used Windows XP Home, installed
