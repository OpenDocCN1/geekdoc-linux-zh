    # The Almost Inevitable Migration for All


    This Linux issue is about migration, which means so many things to me. People
    and even few homes use only one operating system.


    Most of us graduates use Apple notebooks running OS, a BSD derivative. Many of
    these Linuxates use Ubuntu or Blackberries. Many are forced to use Windows systems
    due to work.


    Like a certain in Germany, Washington often talks about the ''cost of migration
    to Linux'' and uses this ''cost'' to boost the Cost of Ownership (TCO) of our
    favorite operating system, without acknowledging the higher value of free users
    have control over their other things.


    I also believe that it has forced more ''migrations'' by making its customers
    move from DOS to Windows 31, Windows NT, Windows XP, Windows 2000 and ME we are
    now looking for an evolution to the 64-bit era. Although we could help with the
    64-bit operating systems and migration issues (Linux moved to 64-bit in 1995),
    we will be there along the way. Then, there will be times in the stages and days
    that have come with Linux (and other operating systems) to compete with the producers
    of Linux to ''test'', ''test'', ''test''.


    User Group near you, and sign up for the migration list. If you are not a newbie
    to the list, Simply read at the archives, and if someone asks you a question,
    just look it up and wait.


    While you are afraid about Free Software, look into the objects of the Free Foundation
    and Free Software Professional Institute (FSPI). The FSF talks about the importance
    of standards and how to ensure that you are not locked into any specific system.
    The FSPI tells you the benefit of free systems administrators need to manage with
    less effort.


    Other organizations investigate the Free Software Foundation, the Open Source
    Initiative and others who believe that a better idea of Free Software is all.


    Next, list your activities and needs. Do not say ''I have more and more generic
    needs.'' Instead, list the more specific needs. For example, ''I need a word processor,
    ''I need a presentation tool.'' Or, ''I need a database, and I need to be object-oriented.''
    If you start listing your needs you will find a solution with much smaller, lighter-weight
    system with less memory and CPU needs.


    And, you may find that certain parts are better than others. Then you can make
    a decision to use a more solution for one particular or a more general solution
    for all needs.


    While you are focusing on the needs of the solutions, make sure you evaluate their
    future flexibility and scalability.


    In addition, to start your think, consider a Free Software developer or a system
    administrator who is familiar with Free Software. All other things will help,
    but it is easier (due to the quality of the source code used in the projects,
    the more) the community already there will help your company''s solutions.


    A friend of mine was a system administrator for a company that was all Free Software.
    Every day he use Free Software to help do his job, and every night at the computer,
    and on the couch, we would change, he would write additional code and submit it
    to the source pool. Then, he would go in and find that lot of other people were
    doing


    the same thing. His comment to me was: ''mad,, it is like talking into a megaphone...
    I say so little and I get back so.'' Just to show that I am not chaotic in this
    case, I like to keep my home and his business and all other systems have windows
    under their watch.


    After you have determined your needs, you can start thinking about all other things.


    # Trade-offs in Cost


    It is not reason that some of the users of Free Software were in the generation
    of enterprise-applications and systems that users did not see or care the cost
    of maintaining, as they were so stable, large-scale, and free. Free software manifested
    in servers, freewords, web servers, and server-plugins.


    Would people change their system to the same machine which they already had, high-performance
    hardware device? Maybe not if it had to flip finally to a smaller, easier-to-use
    environment like mobile. Or if you are a virtualization user, the idea of a different
    partition for your servers allows for freedom to allow for better stability between
