    the process.


    ## Profile-Based Provisioning


    WinLin uses profile-based provisioning. In this method it means that only one
    profile needs to be configured. All other users will inherit from it, and this
    is also the only profile where updates, patches and applications need to be maintained.
    Once a master profile has been configured, individual users can then use it.


    ## Create a Master Profile


