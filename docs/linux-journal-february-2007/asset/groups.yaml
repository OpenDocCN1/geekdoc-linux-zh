    ## LAMP 引入了 J


    你可以在 LAMP 后面加上字母 J 并拼出任何单词。因此，有些人开始将带有 Java 的 Linux“栈”称为“LAMP”；LAMP-。但这些名称似乎从都不正统——因为
    Java 当时并没有一个能够通过 L+ 字母表标准的开源许可证。


    在 2005 年 12 月的 Syndicate 会议上，当我与 Jonathan Schwartz 在舞台上对话时，这位 CEO 向我暗示了这一点。Sun
    公司 一直以来都在暗示他们将为 Java 采用 GPL 协议。


    这种情况在 2006 年 11 月 13 日发生了变化（我们现在回到这个时刻），当时 Sun 最终宣布它将在 GPL 第二版本下发布，自许可证 Nexus
    推出作为 Java Linux“使命”诞生以来，即使在过了三年后，它一直坚持这一观点。


    Jonathan 在他的博客中写道：“GPL 是用于管理 GNU/Linux 演变的相同许可证——将其带给社区并降低成本（而且，如果我们选择了 GPL，第
    2 版并不是它的走向……）。”


    - Jonathan Schwartz 的博客：blogs.com/jonathan

    - Jonathan Schwartz 的博客文章：blogs.com/jonathan/entry/feeling_network_effect

    - Jim Thompson：smallworks.com


    或者并不是 Solaris，事实是，Jim 还有一个问题：“Solaris 是要成为原始的免 GPL 平台，还是说下一步是什么？”“Ubuntu 会提供哪个版本来通过
    GPL 版的 Solaris 内核来分散注意力吗？”


    重新绘制你的结论。


    ## Linux 笔记本电脑。支持。


    自 1999 年以来，Emperor.Linux 一直向大学、企业和个人 Linux 爱好者提供预装 Linux 笔记本电脑解决方案。我们专注于为 IBM、联想、戴尔、索尼和松下的各种笔记本和平笔记本安装
    Linux 系统。我们提供多种 Linux 发行版以及双启动选项。我们自定义运行的分区，并提供对以太网、PCMCIA、USB、EVDO、宽带、火线（FireWire）、X-server
    等的支持。我们所有的系统都提供一年的电话和邮件 Linux 技术支持，并适用完整的制造商保修。


    电话和邮件技术支持、制造商保修、用户手册


