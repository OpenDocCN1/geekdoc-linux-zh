    ## 分析你的搜索关键词


    从你的搜索访问日志中筛选掉不希望的搜索结果。


    **上个月**，我们开始探索如何使用 shell 脚本来提取并分析 Web 服务器日志中的 HTTP_REFERER 值，并识别人们查找你的页面时最常用的术语和短语。这听起来很有用，不是吗？


    问题是，这比看起来要复杂得多。上个月，我们编写了以下 shell 脚本：


    ```bash

    #!/bin/sh


    ACCESSLOG=/var/logs/httpd.access_log

    ngrep ''google.com/search'' $ACCESSLOG | \

    awk ''{print $1}'' | \

    cut -d'' '' -f2 | cut -d''&'' -f1 | \

    sed ''s/%22/ /g;s///g'' | \

    sort | \

    uniq -c | \

    sort -rn \

    head -5

    ```


    啊，我们可以看到这里有两个有效的搜索，一个针对 "wicked cool scripts"，另一个针对 "Barbara nessa%2bpouses"。我不确定后者是什么意思，但看到它是有用且重要的。通常，过滤掉虚假结果有助于移除那些包含等号的项：grep
    -v "=$"


    我没有在脚本长管道的最末尾添加它，而是将其放在调用 之后，以便在管道中尽早过滤掉虚假结果。现在看起来是这样：


    ```bash

    grep ''google.com/search'' | \

    awk ''{print $1}'' | \

    cut -d'' '' -f2 | cut -d''&'' -f1 | \

    sed ''s/%22/ /g;s///g'' | \

    grep -v "=$" \

    sort | \

    sort -rn

    ```


    注意，结果仍然包含了部分的项名称 (q)，所以它在新的 grep 中没有被错误匹配。现在我们有了结果：


    当我运行这个命令时，我看到了以下内容：


    ```bash

    $ google-searches.sh | head -10

    94 hit

    10 client:safari

    6 client:firefox-a

    4 source:navdclient

    4 client:opera

    ```


    这很奇怪，它搜索的不是术语，而是来自 Google 等网站的搜索字符串中的其他值（例如显示你已将搜索限制在英语网站上），但它识别出了用户的浏览器是苹果的 Safari
    等。


    ## 过滤虚假匹配


    当我们查看前十个结果而不是前五个结果时，问题就解决了：


    ```bash

    $ google-searches.sh | head -10

    94 hit

    10 client:safari

    6 client:firefox-a

    4 source:navdclient

    4 client:opera

    3 wicked cool scripts

    ```


    这并没有带给我们很多流量，所以让我们为我那个忙得多的 AskDaveTaylor.com 运行相同的查询。结果更有趣：


    ```bash

    $ google-searches.sh | head -10

    5 standalone player

    4 help

    4 create a myself

    4 Documents and Settings

    4 install-null

    3 view my accounts that are set to private

    3 i hear music on runescape

    2 transfers to file zip

    2 sync v botrola mac

