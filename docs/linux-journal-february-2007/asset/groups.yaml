    # It''s this convergence of technologies and practices, where Java embedded (and
    .NET with Windows mobile) is gaining ground rapidly.


    ![](img/6ad2c38f7c331af69e079dec652dce53_71_0.png)


    At our board meetings, we feel this invisible stakeholder community sitting right
    there—and she has a bit in say way in how we allocate resources.


    **LJ:** We''ve been hearing developers cry for a day database without the overhead
    of SQL for a long time, I know comparing something like MySQL or PostgreSQL to
    a JVM-based database is largely unfair. But I''m so sorry if this question seems
    unfair. If the first, to listen to this demand?


    **Christof:** Its focus is on the developer rather than the DBA. We don''t get
    well with DBAs—and its enterprise IT organization. We do well with applications
    developer "owns" the data in terms of anticipating administration needs in order
    without relying on runtime administration. Just think of the software in your
    car. You expect your vendor to take care of the administration, don''t you? Or
    do you want to be a DBA to defrag your central CPU?


    There are many applications that the database developers don''t see because they
    talk to CIOs and DBAs day and day. Although they have "light,"compact" or "embedded"
    products, they are usually just testers to lead you into their full-server model.
    But these products are not optimized for mobile, nor are themselves organizations.
    The big vendors hold more than 5-10% market share, according to Chris Langford
    s reference at VDC, write their own performance solutions today!


    **Jenny:** Combine with the power of open source, totally new paradigm, which
    is essentially a low-cost and distribution model for software, and you can use
    a small, focused layer like dbobjects (like Just Keepep, Boris or MySQL) which
    has a real impact in the market, despite its inately limited resources.


    Because database is so often connected to the user community, developers know
    who they are and what they want. Because database developers can write and deploy
    code immediately, without going through management and purchasing, as for the
    prototyping stage. Then, developers can manage with a working, demonstrable project.
    There''s really no decision-making process involved—it''s a done deal. From a
    database perspective, it allows very low software and marketing costs, which in
    turn feeds back to development and using users and customers. Compared to a traditional
    software and marketing structure, it''s really lovely.


    ![](img/6ad2c38f7c331af69e079dec652dce53_71_1.png)


    Christof Wittig


    Jenny Fiddler


    *Jenny:* That''s the really exciting part of db40. At Wind River, we were working
    hard to find ways to connect and engage the developer community, but it was a
    challenge. The Open Source, and especially db40, has honestly connected the tool
    to the community in a way that will lead us to a much more low-friction market.


    *Christof:* The way db40 was built of no more than 15,000 registers is impressive.
    I''m thrilled to think we will be able to build a company in this space today,
    and db4objects have a fantastic job to walk their their day. Open-source and community
    collaboration is not only a label, it''s also a true commitment. The user community
    is an integral part of product development and support.


    So the timing is from right-left, the open-source perspective and the technical
    perspective.


