    \nBen Martin 在文件系统领域工作了十年。他目前正在澳大利亚墨尔本大学攻读博士，致力于将文件系统与概念分析相结合，以改进人类与文件系统的交互。\n\
    \n78 | 2007年2月 | www.linuxjournal.com\n\n## 培养 Linux 人才世界\n\nLPI-日本\n- LPI-中国\n\
    - LPI-北美\n- LPI-南亚\n- LPI-拉丁美洲\n- LPI-德国\n\n我们 Linux 专业人士协会（LPI）相信，推广 Linux 和开源软件采用的最佳方式是培养全球范围内才华横溢、合格且认证的\
    \ IT 专业人才。\n\n我们只能通过当地的“实地”合作伙伴组织网络来实现这一点。这些合作伙伴了解该行业并理解 IT 劳动力的需求。通过这种积极的“区域赋能”（Regional\
    \ Enablement）政策，我们正在寻找当地合作伙伴，并协助他们在促进 Linux 和开源专业化方面所努力。\n\n我们意识到提供全球衡量标准的重要性。为了协助这项工作，我们启动了“区域赋能倡议”，以确保我们理解、培养并支持全球企业、政府、教育机构和个人贡献者的需求。\n\
    \n我们鼓励您联系上述的新的区域合作伙伴。让我们共同培养人才世界。\n\n## 稳定。增长。\n\n## 简单访问 Berkeley DB\n\nDatabase\
    \ 与 C++ 集合之间的一个主要区别是，键和值是不可移植的。其主要原因是 Database 对象中的项不在内存中，而是从磁盘中读取的。为了不限制 Berkeley\
    \ DB 提供的灵活性，Database 支持存储异构对象集合的数组。\n\n## 存储对象\n\n这些对象使用隐式构造创建并存储在堆对象中。如列表 5 所示，Person\
    \ 类存储了关于人的许多对象。隐式构造函数接收 `DatabaseValue&Ref`，这是 Database 中数组运算符返回的类型。Person 对象被隐式转换为\
    \ `std::string`，以便存储到磁盘。\n\n"
