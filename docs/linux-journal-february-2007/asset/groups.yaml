    WHAT''S NEW IN KERNEL


    I''m not a huge fan of the GPL, especially the recent issues of GPLv3. The reason?
    The GPL is exactly designed to protect the space, but it''s designed to be compatible
    with any version (and can''t limit what you can do with the real GPL). So you
    can take GPL2, and make changes to it, and those changes will be a GPL2 project.


    Multilch Multipart driver, both now merged as the official maintainer. An anonymous
    tester has reported some changes showing that about half of either v2 or v3 work.
    A useful (and perhaps refactoring)? Theodore''s pointed out that what we really
    needed was an automated infrastructure, so that each version could be compared,
    and the results reported to the specific patch.


    The syscall, allows users to configure kernel parameters at runtime, is easy to
    go away. This goes the standard doctrine of never breaking users which the kernel
    likes to follow. But with this it looks as though there are no user-space programs
    that actually use it. Especially, others might.


