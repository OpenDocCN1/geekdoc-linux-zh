    其中一个例子是：接下来，我们创建一个带有 `ID` 属性的 `<div>` 部分。我们添加了 `style` 属性以保持 `div` 在我们修改其样式之前隐藏状态。


    你想要的，但如果你输入的到目前匹配一个数字文本字符串，我们就提供了自动补全的机会。这是


    # Scriptuous 让我们能够轻松美化我们的 HTML 文件，而无需深入底层的 JavaScript。


    最后，我们可能会为 Autocompleter.local 添加一些 JavaScript。


    在许多方面与组合框（combo box）相似，但在 Windows 上要长得多


    （某些 Scriptuous 已经创建了 Autocompleter 类，它与组合框非常相似。）


    ```

    <div id="dist-complete" style="display:none"></</div>

    ```


    ```

    <script type="javascript">

    autocompleter.local(''dist'', ''dist_complete'',

    [''Red'', ''Fedora'', ''Debian'', ''Gento'',

    [''Knoppix'', ''Ubuntu'', ''Kubuntu'']);

    </script>

    ```


    补全字段，类型不同。list 列出了列表。第一个被称为 Autocompleter.Local，t 匹配列表在 Scriptuous 中。来自远程 HTTP
    服务器的文本字段。


    `Autocompleter.local` 的构造函数接受参数：ID、我们将要插入其中的的 `div` 的 ID、一个包含补全字符串的数组以及一些选项（目前为空）。如果你尝试在代码编辑器中输入这些内容，将会失败并出现所有错误，因为文本字段和代码编辑器将会损坏。


    为了使用 `Autocompleter.local`，我们首先创建一个文本字段，就像我们在 HTML 表单中做的那样：


    通过包含一个 HTML 页面（在列表中），我们设置属性以完成补全工作。当用户在文本字段中开始输入时，Scriptuous 会等待 0.4 秒。如果用户停止输入，或者如果文本字段包含一个或多个字符，它将尝试在列表中查找匹配项。如果找到了，它将填全文本字段的剩余部分。


    ```

    <input type="text" id="dist_name" text_field autocomplete="off" />

    ```


    如果多于一个（正如我们在示例中让用户输入 `K`，它匹配一个 `Knnoix` 等菜单），系统将显示一个菜单，用户可以通过点击从中选择。


    # 结论


    列表 2. 完整的 html


    Protobuf 由 Scriptuous 的 Alex 编写，能够解决许多程序员的；然而，Protobuf 的功能扩展到让程序员；它提供任何直接的查询接口，Scriptuous
    是一个 Web 应用程序中的 SQL。它应该-


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0//EN"

    "http://www.w3.org/TR/html41/strict.dtd">

    <html xmlns="http://www.w3.org/1999">

    <head>

    <title>特殊效果</title>

    <script src="scriptuous.js" type="javascript"></script>

    <script src="scriptuous.js" type="javascript"></script>

    </head>

    <body>

    <h2>我们的发行版在这里</h2>

    <input type="text" id="dist_name" text_field autocomplete="off" />

    <div class="auto-complete" id="dist_complete" style="display:none"></</div>

    <script type="javascript">

    autocompleter.local(''dist'', ''dist_complete'', [''Red

    Fedora'', ''Debian'', ''Gento'',

    [''Knoppix'', ''Ubuntu'', ''Kubuntu''],);

    </script>

    </body>

    </html>

    ```


    Scriptuous 有几个功能供你探索，包括拖放和 JavaScript，这不仅对于那些没有意图创建 UI 元素的 JavaScript 程序员，也是最后一个问题。


