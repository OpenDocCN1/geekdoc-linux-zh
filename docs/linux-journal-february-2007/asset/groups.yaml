  mdcn: "\n## Gnullad 与 Void\n\n## 使用 Gnullad 和 Void 的技巧\n\n恢复 MySQL 表并保存分区。\n\n###\
    \ 嘿，亲爱的们，我是 Void，我的丈夫为你们保留了一些技巧。像上次一样，Chester 并不怎么啰嗦，所以我上上个月没有花太多时间，但我们无法为所有人提供这项服务。因此在那个时候，亲爱的，我们可以让这一切运行起来。我们使用这些东西进行托管，并且我们为每个技巧支付了\
    \ $10。如果你的数据库有某些影响，Chester 可以使用它。他会挑选并进行处理。在此期间，我们将在另一个技巧中获取编辑器，并从 Paddy 那那里获得。\n\
    \n### AMD64 升级赌注\n> 有时，假设升级是件好事并不意味着要先分区保存旧版本的镜像。新版本可能会影响镜像——Chester 运行了多种发行版。例如，我运行了\
    \ 32位的 Ubuntu 和 64 位的 Ubuntu。我在 64 位 Ubuntu 上花费了更多时间，但某些包在 32 位 Ubuntu 上更容易使用。\n\
    \n## 使用 Zanda 恢复方法恢复 MySQL 表\n\n> 某人保存了 MySQL 表。如果你执行此操作——Chester 说。\n\n数据库管理员：你可以恢复\
    \ MySQL 数据库，某人删除了一个表（例如 'accounts' 表）。应用程序不再工作了。你如何从中恢复数据？\n\n答案是二进制日志。二进制日志跟踪数据库的所有更新。如果服务器上启用了二进制日志，你可以使用\
    \ `binlog` 工具恢复 MySQL 数据库。\n\n更全面的解决方案是使用数据恢复方法 (RMR)。MR 工具允许你从备份中直接恢复二进制日志和数据库，无需停机。\n\
    \n### 在 64 位上运行分区\n分区非常敏感且拒绝在 64 位系统上运行。此外，有一个适用于 AMD64 的分区包，但它不起作用。在这种情况下，我想将\
    \ 32 位 Ubuntu 启动并升级到 64 位，以便它在 32 位上运行。\n\n或者呢？在 AMD64 上获取分区其实很容易。只需使用事实方法下载基础分区。然后创建\
    \ `/dev/sd` 分区。它们在 Linux 下应该运行良好良好。\n\n在使用分区之前，你应该检查是否有 `/dev/dev` 镜像。如果没有，将会像下面这样显示：\n\
    \n```bash\n# mysql-zrm -action restore --source-directory=/var/lib/mysql/sugarcrm/binlog.0000060895163/\n\
    \n# mysql-zrm -action restore --source-directory=/var/lib/mysql/sugarcrm/binlog.0000060895163/\n\
    --start-point 1160\n```\n\n在这里我们恢复 SugarCRM 的增量备份。使用两个命令从 9 月 15 日的增量备份恢复，无需执行日志位置\
    \ 11599。\n\n```bash\n# mysql-zrm -action restore --backup-set sugarcrm\n--source-directory=/var/lib/mysql/sugarcrm/binlog.0000060895163/\
    \ \n--start-point 1160\n```\n\n更多信息请查看 MySQL Zanda 恢复方法：![](img/ad2c38f7c331af69e079dec652ce53_22_0.png)\n\
    \n图 1。等待 `/dev/dev` 镜像创建。\n\n20 | 2007年2月 | linuxjournal.com\n\n## 四核。\n别再说了！\n\
