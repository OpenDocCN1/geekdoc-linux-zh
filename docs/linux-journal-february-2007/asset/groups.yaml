    LI：您能介绍一下 dbobject 的历史吗？

    Christof：dbobject 是自 2000 年以来由 Carl Neiberg 周围的一群开发者创建的原生 Java 和 NET 对象数据库。dbobject
    的动力源于用户，他们觉得迫切需要一种比执行不一致的解决方案更高效、更好的对象持久化解决方案。


    在 2004 年，该软件已成功交付给少数早期客户，但它已经准备好进入主流市场了。我被邀请加入 CEO 以发展公司。如今，dbobject 总位于硅谷。


    dbobject 带我们进入了开源世界，正如我们从 SQL 中了解的那样，以及来自硅谷的好友，例如 Vertas（以及我们公司）的首席 CEO Mark Leslie，Wind
    River 的 CEO Vinod Khoda（他早就加入了我们的董事会）。Jerry Fields 今天与我们在一起，帮助我们更多了解对象。


