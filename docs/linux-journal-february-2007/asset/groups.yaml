  - "[PAGE 84]\n\n# INDEPTH\n\nfunction shows, this thinner mapper appear that the\
    \ Database is storing Person objects.\n\n# Secondary Indexing\n\nSometimes you\
    \ might find that you are storing multiple keys by which you would like to be\
    \ able to find a quick item. For example, if you are storing contact information,\
    \ you might want to look up people based on their name or e-mail address.\n\n\
    You could achieve this by storing each person's information using the name as\
    \ the key, and maintaining a secondary database from e-mail address. To find a\
    \ person by e-mail, you would use the e-mail-keyed database to find the name and\
    \ then use the name to find the actual information. Maintaining indexes like this\
    \ is highly error-prone, and more, the secondary indexes in Berkeley DB do this\
    \ for you automatically.\n\n+   5 Listing and Reading Objects with STLdb4\n\n\
    ```\n#include <iostream>\n#include <STLdb4/stldb4.h>\n\nusing namespace STLdb4;\n\
    using namespace std;\n\nclass Person {\npublic:\n    string email;\n    string\
    \ name;\n    string phoneNumber;\n    explicit Person(const string& name,\n  \
    \                  const string& ph = \"\")\n        : email( ), name(name ),\
    \ phoneNumber(ph) {}\n};\n\nPerson(const DatabaseValueRef& r) {\n    string ss;\n\
    \    ss << string(r);\n    getline(ss, name, \"\\0\");\n    getline(ss, email,\
    \ \"\\0\");\n    getline(ss, phoneNumber, \"\\0\");\n}\n\n```\n\nThe above example\
    \ can be implemented by using the primary key value stored as the person and a\
    \ secondary index on the e-mail addresses. This setup is shown in Figure 1. I\
    \ refer to name-to-person mapping as the main database and the e-mail look-up\
    \ database as the secondary index.\n\n| Secondary Index | Main Database |\n|---|---|\n\
    | Email Address | key: name\n| value: Person information |\n\nFigure 1. Secondary\
    \ Index for Look-Up by E-Mail Address\n\nThe main concern when using STLdb4 is\
    \ how to extract your data. When you use functions on STLdb4 to help you, the\
    \ GetOffset() returns a template object of the same type and return all the data\
    \ from that offset to the end of the item as the key. The GetOffsetLengthSecIndex()\
    \ is similar, but returns the length. The GetNullTerminatedString() takes an offset\
    \ and a skip count to extract the null-terminated string from a given offset.\
    \ If you have thirty-two integers followed by four null-terminated strings as\
    \ your format, you could use an offset of 20 and a skip of 2 to extract the third\
    \ null-terminated string as your secondary index.\n\nAssuming the use of Person\
    \ from class 5, the listing 6 creates and uses secondary indexes on the e-mail\
    \ address for your objects. Because the database starts with our data, creating\
    \ the extraction function with GetNullTerminatedString() will return an offset\
    \ and skip one null-terminated string for the email address.\n\nI perform a partial\
    \ look-up using the secondary index. The equal method finds both the lower and\
    \ upper bound for partial key match. In this case, I find any e-mail addresses\
    \ that begin with a letter. The output from the program is shown in Listing 7.\
    \ Note that the first of the iterator is the key from the secondary index, and\
    \ the second is the data from the main database. The main data for this look-up\
    \ is available through getPrimaryKey() on the iterator.\n\n# Transactions\n\n\
    Transactions are supported by either a explicit transaction to object each method\
    \ or by setting the implicit transaction on Database objects. The later style\
    \ can be convenient in cases the overloaded array operator is used, which does\
    \ not allow a transaction to be passed (in only one argument) back to the array\
    \ operator.\n\n```\nint main(const char **argv) {\n    fh_database db = new Database(DB_BTREE,\n\
    \        \"/tmp/db.db\");\n\n    db->insert(\n        make_pair(\n           \
    \ \"Alex\", \"Person\", \"alex@foo.com\"\n        ));\n    db->insert(\n     \
    \   make_pair(\n            \"Barry\", \"Person\", \"barry@bar.com\"\n       \
    \ ));\n\n    Person *p = db[\"Barry\"];\n    cout << \"Barry email address: \"\
    \ << endl;\n    cout << p->email << endl;\n\n    return 0;\n}\n```\n\n82 | February\
    \ 2007 www.linuxjournal.com"
