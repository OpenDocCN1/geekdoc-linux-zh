    # 专栏


    # 适合所有人的 LINUX


    ## 转变心态


    ![](img/6ad2c38f7c331af69e079dec652dce53_44_0.png)


    ### 文档之星 (DOC STARS)


    在我们想要它之前，我们无法获得网络；它是在电话和电缆服务之上的重力。


    互联网在 21 世纪发挥的作用，正如道路在 20 世纪的作用，以及铁路在 19 世纪的作用一样。我们需要在尽可能的地方将网络扩展到最大的可能容量。这在经济上是行的，而且文化效益将随着连接性和可访问性的增加而增加，这一点是不言而喻的。我们应该做什么？怎么做、何处做以及由谁来做？


    在韩国、日本、荷兰等国家，私人和公共部门对建设网络的投入非常迅速，且尽可能地提供了容量，其目标是相同的：网络建设是重中之重。


    与此同时，在美国，我们将其交给了电视和电信公司处理，这些公司从未浪费过机会（比如 AT&T，它从未破产），但在光纤建设方面骗取了数百万的联邦补贴。网络先驱（也是电子表格的联合创始人）鲍·布里尔（Bob
    Brill）这样说的：


    > “对于那些担心竞争的人来说，在一个存在根本利益冲突的系统中表现得会更好；今天的提供者有强烈的动机不去维护安全性——尤其是当承担着不会增加其服务价值的成本时。”


    这就是为什么像 Verizon 的 FIOS 这样的光纤部署在构建高清传输（并与电缆电视竞争）方面，而不是提供互联网连接。我们为 FIOS 铺设的光纤实际上是一个伪装成网络的电缆电视系统。被动光作为从机房到每个家庭终端的传输方式；尽管它们确实具有发送数据的能力。单根光纤具有吉比特级的流量。容量是如此大，以至于我们可以简化方法来模拟电缆电视。互联网服务所需的
    15Mbps 不到他们拥有容量的 1%！


    在这里，“直接且透明的资助是有用的，但在现行的法律体系下，我们没有拨款来提供任何激励——我们都可以加入这一点。”问题在于，资助互联网与修建道路一样困难，因为我们浪费时间、地役权、铁路或电力线，为了争端和地下的光纤布线而跨越大型深沟，或者从已经有的地方悬挂电缆——部署带有“回传”的无线光纤。


    鲍·布里尔的观点是，个人和社区应该建立他们自己的 DIY（自己为自己）“设施”，并以他们自己的方式相互连接；绕过电缆双头垄断和“监管者”——这个词非常准确，它统治着这一切。本地
    DIY 网络目前在哥本哈根，我很久以前就在那里写过。这并不是特别针对欧洲共同体组织，那里是发展和增长的领先国家。美国在渗透率排名第 12，增长率排名第 17。


    城市和县有利用当地赠款进行 DIY 网络建设“项目”的选择——目前遍布全国。在犹州，水星市（Mercury）——一个拥有 3 万西班牙裔人口和 800 万美元（犹他州最大的农场设施）的城镇——正花费约
    800 万美元进行无线建设，意在为犹他州的每个社区提供吉比特级网络。


    犹他州是向批发客户销售的光纤建设。它是纽约早期的光纤建设之一。在佛蒙特州，伯尔林顿正在建设“三位合一”（互联网、电话和视频）零售业务。每个方案都不同，但它们都有一个共同点：1)
    他们不想要运营商，2) 它们是为每个城市、组织做的——而不是为了普通人。


    自然地，社区反对了他们。他们说接入即将到来（随着竞争的出现），这将是极具讽刺性的，因为运营商对公众拥有类似于垄断的监管保护。运营商一直在州级和联邦层面游说反垄断法。他们的成功之一是《地方政府接入法案》，该法案是在法院的要求下通过的，旨在为他们“公平竞争”。该法律除了拉法菲尔之外没有产生任何影响。


    随处可见，运营商的利益与自身的利益意见相左。11 月 7 日，电力部门的选民决定建设基于光纤的网络。


    下一次选举将非常激烈，特别是可能会出现一个由民主党占多数的新任美国议会。过去，中立性立法失败了，由民主党提出，被共和党击败。共和党正在寻找方法杀掉他们在 2001
    年提出的法案。而现在，如果这项立法像我们所知的那样被建立，运营商可以反击。


    '
