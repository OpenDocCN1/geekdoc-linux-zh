    # # Virtual Filesystems Are

    Virtual Office Documents


    Use librbis, XML and XSLT to create virtual filesystems and documents. **BEN MARTIN


    Filesystems can be made into virtual office documents. The old Unix slogan "everything
    is a file" together with the xsltf/ filesystem allows for transparent editing
    relational databases, and arbitrary XML with OpenOffice.


    The librbis filesystem presents both files and data. The boundaries of what is
    considered a file include such as PostgreSQL, LDAP and Firefox as well as standard
    Web items, as HTTP, FTP, and MIDI.


    Reverse filesystems allow documents to be synthesized from other directories.
    A collection of existing files allows a filesystem to show the union of those
    bases.


    OpenOffice can now save the file. The filesystem then applies a reverse XSLT and
    updates the input filesystem (in this case a PostgreSQL) to reflect your changes.


    To support this, you will have two XML files. The first stylesheet translates
    an input file into the format you are interested in. The second XML file (the
    reverse stylesheet) provides the inverse. The second file should become optional
    if it can be inferred from the actions of the translation.


    Reverse stylesheets update each explicit URL or relative path. The reverse XSLT
    method specifies the reverse stylesheet to update the attribute for each file
    to be updated. This can be convenient for xslltfs where URLs play a role in both
    the source and target. For example, when you save a document in OpenOffice, the
    source URI will be available to the reverse stylesheet to use update.


    Although there are difference between librbis filesystem and the XML model data,
    there are also many similarities. A file''s metadata is created as Extended Attributes
    (EAs), which map to XML elements in the file element. An element difference between
    a file and an XML model data is that the ordering of elements is not guaranteed
    to be preserved.


    The reverse stylesheet is conceptually similar to applying diff and patch to files.
    The reverse stylesheet creates a list of changes to make a relative path for each
    file and the patch is then applied. The reverse stylesheet as the root element
    returns an attribute that can strip the attribute from the path. If this is true,
    we can create new files where the reverse stylesheet specifies a relative path
    that does not exist in the current filesystem.


    Because of the relation with XML model data, librbis filesystem supports viewing
    every file as a Document Object. It is possible to treat any file as an XML document,
    as the lines between what is a file and what is XML are often blurred.


    Reverse filesystems may contain the entries of the current filesystem. This is
    not required, but if it is, the translation will be fully available in the translated
    filesystem.


    Many modern applications use their documents as XML. Filesystems and XML can be
    interchanged with librbis, this allows you to use XML editors to edit files. One
    downside with using XML editors to edit the files is that the schema of the XML
    file usually does not match the layout of the file.


    The following sections show two uses: creating new virtual filesystems and editing
    documents from the current filesystem. This is often achieved by using custom
    filesystems handlers.


    The xsltfs can be used to create a translated file that matches the application
    it is expecting. For example, you could take a table in PostgreSQL as the database
    and have that table into a spreadsheet file, which you then load into OpenOffice.


    The xsltf shown in Figure 2 create our translated filesystems from the input file.
    It is important to note that the input file in this case is generated from an
    XML file


    The possibilities become even more interesting when the supported filesystem is
    considered. After you make some changes to the reverse stylesheet in


    The translated file can be used just like any other file with the command-line
    tools, fdisk, find and so on. The xsltfs/ URL scheme in librbis lives above most
    other URL


    72 | 2007 | www.linuxjournal.com'
