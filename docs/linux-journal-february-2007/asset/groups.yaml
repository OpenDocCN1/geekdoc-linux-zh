    \ Ubuntu and 64-bit Ubuntu. I spend more time on 64-bit Ubuntu, but some packages\
    \ are easier to use on 32-bit Ubuntu, Linux, for instance.\n\n## Recover a MySQL\
    \ table with Zanda Recovery Method\n\n> Somebody save a MySQL table. Drop your\
    \ DBA. If you then do this—Chester says\n\nA MySQL database administrator: You\
    \ can recover your MySQL database, somebody drops a table in the MySQL application\
    \ (for example the 'accounts' table in a SugarCRM). The application no longer\
    \ works. How can you recover the data from it?\n\nThe answer is binary logs. Binary\
    \ logs track all updates to the database. If binary logs are enabled on the server,\
    \ you can use the mysqlbinlog tool to recover the MySQL database.\n\nA more comprehensive\
    \ solution is to use the Data Recovery Method (RMR) for MySQL. The RMR tool allows\
    \ you to recover the binary logs and directly restore the database from incremental\
    \ backup but without downtime.\n\n### Running Partition on 64-bit AMD64\nPartition\
    \ is finicky and refuses to run on a 64-bit system. Beyond that, there is a partition\
    \ package you can use for AMD64, but it doesn't work. In case, I want to boot\
    \ AMD64 and upgrade my 32-bit Ubuntu into 64-bit, so the fact it works on 32-bit.\n\
    \nOr is it? It is actually quite easy to get partition working on AMD64. Simply\
    \ download the basic form of partition using the de-facto method. Then create\
