    # 在 Windows 中访问 Linux 文件系统


    你不需要等待微软支持 Linux 文件系统即可从 Windows 访问你的 Linux 文件。


    IRFAN HABIB


    在新的操作系统无法无法你的数据可能是进行操作系统迁移的最严重障碍之一。对于用户来说，切换到一个无法与其数据互操作的系统几乎没有个人动力，因为该系统对他们来说实际上是无用的。


    Linux 在允许 Windows 用户从 Linux 访问 Windows 分区方面表现出色。大多数 Windows 文件系统都是可用的，包括对 FAT16/32
    的无缝支持以及对 NTFS 越发完善的支持。还有一些工具可以实现从 Linux 对 NTFS 驱动器的完全完整支持。数据访问并不局限于本地主机。


    Samba 允许 Linux 用户通过网络访问 Windows 计算机上的共享数据。因此，我们可以说，对于 MS Windows 用户来说，访问数据不再是迁移到
    Linux 的障碍。


    然而，随着 Linux 进军桌面领域，许多人使用 Linux 执行某些任务，然后转向 Windows 使用在 Linux 上不可用的软件，例如高端游戏、Adobe
    Photoshop 以及没有等效程序的各种特定应用程序。当人们使用此类应用程序时，他们通常需要访问自己的 Linux 分区。Windows 并不支持 Linux
    文件系统。因此，Linux 双启动用户必须使用某些工具来访问他们的 Linux 文件系统。


    ## 在 Windows 中访问 Linux 分区的工具


    从 Windows 访问 Linux 分区可能是一个挑战。然而并非没有，开源社区已经迎接了挑战并创建了优秀的软件来解决这个问题。本文重点介绍 LTOOLS，这是一种允许用户访问多种
    Linux 文件系统的高级接口。首先，让我们看看其他可以提供帮助的软件。


    ## 文件系统的简要介绍


    某些读者可能会好奇文件系统到底是什么。文件系统基本上定义了存储和检索文件的方法。但为什么这么多？“为什么有这么多文件系统？为什么我们不能选择一种从磁盘检索数据的最佳方法，并将该文件系统作为所有操作系统的标准？”不同的用户使用不同的文件系统。例如，针对企业用户的用户使用
    NTFS，而 NTFS 是针对具有增强安全性的普通用户的。


    ## Ext2fssd


    Ext2fssd 是一个开源项目，允许从 Windows 访问 ext2 和 ext3 分区，且无需重启即可下载。ext2fssd.projects.net/ext2fssd
    作为驱动程序，而不是普通的应用程序。将 Ext2fssd 作为驱动程序可以将 ext2 分区集成到 Windows 中，并像访问原生格式一样访问它们，同时启用读/写支持。这是独特的，因为它是最早支持的
    Linux 文件系统之一，并且许多新的 Linux 文件系统如 ext3 和 ext4 都与它后兼容。因此，该驱动程序也可以与 ext4 工作。然而，对于
    ext4，你需要向系统添加主内核。但是，当使用 Ext2fssd 使用 ext4 时，你使用的是 ext2 的功能，而不是其他附加功能（例如增强的日志功能）。


    为文件系统支持操作系统意味着我们定义了操作文件系统的数据结构。如果操作系统支持 NTFS，磁盘也可以添加对其他文件系统的支持（如 NTFS），因为磁盘数据的结构、加密算法等对公众未知。这就是为什么在
    Linux 中支持 正 证明是一个挑战。


    图 1. Ext2fssd 让 ext2 文件系统看起来像 Windows 中的任何其他文件系统一样。


    ## rfstools


    Rejstools 因为其容错能力已成为流行的 Linux 工具。rfstools 允许在 Windows 内访问 ReFS 分区。它仅支持只读访问，根据开发者的说法，还没有更改的计划。该工具可以在
    rfs.org 免费获得。


    ## LTOOLS 的安装


    LTOOLS 适用于各种磁盘文件系统，我们稍后会详细介绍。安装后，程序将在你的环境中运行并创建一个名为 LTOOLS 的菜单，你可以从那里访问你的 Linux
    文件系统。LTOOLS 适用于所有 Windows 版本，Windows XP 和 Windows 7 除外。它为 Win9 和 NTFS 提供两个不同的控制台。


    ## LTOOLS 命令行概述


    命令行界面提供了从 LTOOLS 写入和检索数据的的基本功能。这些命令具有以下格式：


    ```

    idr.bat

    ```


    此命令列出目录；但它不是一个脚本。该脚本根据你的系统调用两个程序之一：Ldr 或 Idnt。第一个用于 NTFS，第二个用于 Windows。

    许多 LTOOLS 命令具有逻辑语法。例如，分区名是逻辑性的。因此，如果我想从 /root（位于 /devhd2）将文件 vars.conf 复制到 C:
    盘；我将执行以下操作


    ## 特性：在 Windows 中访问文件系统


    ```

    read.bat --s=/dev/hd2 /root/var.inc C:\var.inc

    ```


    同样，对于 Linux，你将使用


    ```

    write.bat --s=/dev/hd2 C:\var.inc /root/var.inc

    ```


    与此，Linux 还有表 1 所示的命令。


    [content]

    （注：the the the the the the the the the the the the the the the the the the the
    the the the text.


    ## 表 1：LTOOLS 命令


    | 名称 | 说明 | 大小 | 类型 | 日期 |

    |---|---|---|---|---|

    | read.bat | 从 Linux 读取并复制文件到 DOS | `read.bat --s=/dev/hd2 /root/var.inc C:\var.inc`
    | | |

    | write.bat | 从 DOS 复制文件到 Linux | `write.bat --s=/dev/hd2 C:\var.inc /root/var.inc`
    | | |

    | idle.bat | 删除文件（目录） | | | |


