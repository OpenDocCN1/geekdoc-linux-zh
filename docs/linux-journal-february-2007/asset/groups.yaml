    \ as an external drive, as it has the ability to handle large files—some operations\
    \ need space as large as your Windows partition. If you have an external drive\
    \ formatted as FAT32 system, it will have a size limit that is too small for most\
    \ use. If your computer is installed with NTFS, you will be able to boot from\
    \ a Linux CD, as Knopix.\n\nNotice that the native driver for NTFS is still experimental\
    \ and claims that it is not ready. Nevertheless, however, you can clone a stable\
    \ Windows XP undoubtedly in just minutes. If you have an NTFS filesystem on the\
    \ first partition of the first drive and are running from Linux on the same computer,\
    \ the command would back up NTFS as a single file.\n\n```\nntfsclone /dev/sda1\
    \ /usr/backup/ntfs.img\n```\n\nThe uppercase O in this allows the software to\
    \ overwrite the image, but if you create it it will be in absent. If this is not,\
    \ it will leave it in a state to allow you to mount ntfs.img using loopfile, make\
    \ a mountpoint:\n\n```\nmkdir /usr/local/backup/mtpt\n```\n\nThen, use ntfs and\
    \ the same syntax you would use for an ordinary mount:\n\n```\nntfs -o loop /usr/local/backup/ntfs.img\
