  - '[PAGE 60]


    # Accessing Linux Filesystems in Windows


    You don''t have to wait for Microsoft to support Linux filesystems to get at your
    Linux files from Windows.


    IRFAN HABIB


    Lack of access to your data in a new operating system may be one of the most severe
    impediments for doing an OS migration. There is little personal incentive for
    users to switch to a system that can''t interoperate with their data, as the system
    would be practically useless to them.


    Linux has a great job in allowing Windows users to access the Windows partitions
    from Linux. For a majority of Windows filesystems is available, as seamless support
    for FAT16/32 and but increasingly complete support for NTFS. There are also tools,
    which enable complete support for NTFS drives from Linux. Data access is not restricted
    to the local host.


    Samba allows Linux users to access their shared data on Windows computers over
    a network. Hence, we can say that, for MS Windows users, access to their data
    is no longer an impediment to Linux migration.


    However, as Linux advances into the desktop, many people use Linux for some tasks
    and then turn to Windows for software that is not available on Linux, such as
    high-end games, Adobe Photoshop and various-specific applications for which no
    equivalent exists. When people are using such applications, they generally require
    access to their Linux partitions. Support for Linux filesystems is nonexistent
    in Windows. Thus, Linux dual-booters must use some tools to access their Linux
    filesystems.


    58 | February 2007 www.linuxjournal.com'
