- md: "\n# Accessing Linux Filesystems in Windows\n\nYou don't have to wait for Microsoft\
    \ to support Linux filesystems to get at your Linux files from Windows.\n\nIRFAN\
    \ HABIB\n\nLack of access to your data in a new operating system may be one of\
    \ the most severe impediments for doing an OS migration. There is little personal\
    \ incentive for users to switch to a system that can't interoperate with their\
    \ data, as the system would be practically useless to them.\n\nLinux has a great\
    \ job in allowing Windows users to access the Windows partitions from Linux. For\
    \ a majority of Windows filesystems is available, as seamless support for FAT16/32\
    \ and increasingly complete support for NTFS. There are also tools, which enable\
    \ complete support for NTFS drives from Linux. Data access is not restricted to\
    \ the local host.\n\nSamba allows Linux users to access their shared data on Windows\
    \ computers over a network. Hence, we can say that, for MS Windows users, access\
    \ to their data is no longer an impediment to Linux migration.\n\nHowever, as\
    \ Linux advances into the desktop, many people use Linux for some tasks and then\
    \ turn to Windows for software that is not available on Linux, such as high-end\
    \ games, Adobe Photoshop and various-specific applications for which no equivalent\
    \ exists. When people are using such applications, they generally require access\
    \ to their Linux partitions. Support for Linux filesystems is nonexistent in Windows.\
    \ Thus, Linux dual-booters must use some tools to access their Linux filesystems.\n\
    \n## Tools for Accessing Linux Partitions in Windows\n\nAccessing Linux partitions\
    \ from Windows can be a challenge. It is not lost, however, the Open Source community\
    \ has risen to the challenge and created excellent software to solve this problem.\
    \ This article focuses on LTOOLS, which is advanced interfaces that allow users\
    \ to access a range of Linux filesystems. First, let's look through some other\
    \ software that could help.\n\n## A SHORT PRIMER ON FILESYSTEMS\n\nSome readers\
    \ might wonder what a filesystem really is. A filesystem basically defines the\
    \ method for storing and retrieving files. But why so many? \"Why are there so\
    \ many filesystems? Why can't we just choose one best way to retrieve data from\
    \ a disk and make that filesystem standard for all operating? Different users\
    \ use different filesystems. For example, users who are targeted at enterprise\
    \ users use NTFS, which was targeted at ordinary users with enhanced security.\n\
    \n## Ext2fssd\n\nExt2fssd is an open-source project that allows access to ext2\
    \ and ext3 partitions from Windows and can be downloaded without rebooting. ext2fssd.projects.net/ext2fssd\
    \ works as a driver, not a regular application. Using Ext2fssd as a driver integrates\
    \ ext2 partitions into Windows and allows access to them as if they were a native\
    \ format and enables read/write support. This is unique, as it is one of the first\
    \ Linux filesystems supported, and many new Linux filesystems, as ext3 and ext4\
    \ are backward-compatible with it. Thus, the driver can work with ext4 too. However,\
    \ with respect to ext4, you will need to add the mainline kernel to your system.\
    \ But, when using ext4 with Ext2fssd, you will be using the features of ext2,\
    \ not other additional features, such as enhancing journaling capabilities, not\
    \ used\n\nsupporting an OS for a filesystem basically means that we define the\
    \ data structures to operate the filesystem. If the OS supports NTFS, the disk\
    \ can also add support for other filesystems, such as NTFS, because the structure\
    \ of the data on the disk, the encryption algorithms and so, are not known to\
    \ the public. This is why it is proving to be a challenge to support NTFS in Linux.\n\
    \nFigure 1. Ext2fssd makes ext2 filesystem look like any other filesystem in Windows.\n\
    \n## rfstools\n\nRejstools has become a popular Linux tool, because of its fault-tolerance\
    \ capabilities. rfstools allows access to ReFS2 partitions within Windows. It\
    \ only supports read-only access, and according to the developers, there have\
    \ no plans to change that. The tool is available for free at rfs.org.\n\n## Installation\
    \ of LTOOLS\n\nLTOOLS works with various disk filesystems, which we will detail\
    \ later. After the installation, the procedure runs in your environment and creates\
