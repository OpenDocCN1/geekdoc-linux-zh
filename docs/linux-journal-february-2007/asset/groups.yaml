    \n# mysql-zrm -action restore --source-directory=/var/lib/mysql/sugarcrm/binlog.000006089510163/\n\
    --start-point 1160\n```\n\nHere we do recover incremental backup from the drop\
    \ table in SugarCRM. Do two commands to restore from the incremental backup to\
    \ Sept 15th, 2006, without executing the drop TABLE at log position 11599.\n\n\
    ```bash\n# mysql-zrm -action restore --backup-set sugarcrm \n--source-directory=/var/lib/mysql/sugarcrm/binlog.000006089510163/\
    \ \n--start-point 1160\n```\n\nSee the Zanda Recovery Method for MySQL for more\
    \ information: mysqldump.zanda.com - Paddy Steen\n\n![](img/6ad2c38f7c331af69e079dec652dce53_22_0.png)\n\
