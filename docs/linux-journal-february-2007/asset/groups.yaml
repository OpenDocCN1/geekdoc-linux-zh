    - 13. 2006 年 10 月 Next 前 10 大中基于 Linux 的房屋数量：5


    如果存在可行替代方案，最好永久使用，但它可能运行得良好。不过，Chuck Albert 已自愿在需要时担任内核-linux 维护者。


    - 14. 2006 年 10 月 Next 前 10 大中基于 Free 的房屋：2


    最新的提交是多媒体卡（MultiMedia Card）和安全数字（Secure Digital）系统，Pierre Ossman 开始自己编写补丁，因为之前的维护者
    Russell King 已经退役并取消了订阅。同时，J Slab 为 Media/Input 驱动添加了新条目。


