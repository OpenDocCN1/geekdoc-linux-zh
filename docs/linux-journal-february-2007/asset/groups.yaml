- md: "\n## awk Not So Awkward\n\nI don't have Dave's awk credit (see Dave's November\
    \ 2006 column). I do not have access to the Web files, or version of Linux. However,\
    \ I know that his solution can be written with awk. Using AIX and HP-UX, I dummy\
    \ up a log file, cheated on the date command and tested my solution.\n\nBelow\
    \ is awk code that I duplicated Dave's example:\n\n```bash\n#!/bin/sh\n\nLOGFILE=\"\
    home/limol/logs/intuitive/access_log\"\nawk '\n  if (index($0, YESTERDAY)) {\n\
    \    hits++\n    bytes+=$10\n    remail++\n  }\nEND {\n    printf(\"Calculating\
    \ transfer data for %s\\n\", YESTERDAY)\n    printf(\"Sent %d bytes of data %d\
    \ hits\\n\", bytes, hits)\n    printf(\"For an average of %f bytes/hit\\n\", bytes\
    \ / hits)\n    printf(\"Estimated monthly transfer: %d bytes (bytes * 30)\\n\"\
    , bytes)\n  }' -v YESTERDAY=$(date -v-day \"+%%d/%b/%Y\") \"$LOGFILE\"\n```\n\n\
    - Rory Hammond\n\napplication layer for the data (such as FTP in \"normal\" mode),\
    \ requiring the NAT router to handle and inspect every modify packet.\n\nUnfortunately,\
    \ the Dee-Ann recommended is still available but unsupported for Linux; their\
    \ Linux guy left the project. But, all is lost; Linux will not be back. A new\
    \ Linux starting called PSC2, and the new version is\n\n- Bob\n\n### SSH and DenyHosts\n\
    \nRegarding the worry about SSH dictionary attacks (Lt., June 2006). \"A Server\
    \ of Myself\" by Your's George Belkofsky; the wonderful DenyHosts:with details...\n\
    \nDenyHosts intercepts incoming connections into your server (many SSH, but it\
    \ can be FTP or anything else with a login/password and log file) and blocks IP\
    \ addresses by automatically adding to deny.hosts.\n\nI put it to run on a new\
    \ Web server a month, and it has already more than 7,000,000 failed attempts!\n\
    \nBesides, also you share your whitelist with DenyHosts' Web site, feeding a mega-blocklist\
    \ of the really bad guys.\n\n- Carlos Vidal\n\n### Java Java Java\n\nI've been\
    \ waiting and waiting for Java after. How about Java (Ajax before Ajax), Java\
    \ servlets (and real cross-platform stuff). I look forward to hearing and reading\
    \ about it.\n\n- Mark Molenda\n\nWe have just such an article in the list!—Ed.\n\
    \n### PlayStation on Linux\n\nIn the May 2006 issue of LI, there was an article\
    \ by De-Earl Barnett on the above subject.\n\n## Linux Laptops\nStarting at $799\n\
    \n![](img/6ad2c38f7c331af69e079dec652dce53_11_0.png)\n\n## Linux Desktops\nStarting\
    \ at $375\n\n![](img/6ad2c38f7c331af69e079dec652dce53_11_1.png)\n\n## Linux Severs\n\
    Starting at $899\n\n![](img/6ad2c38f7c331af69e079dec652dce53_11_2.png)\n\nThanks\
    \ LI for the best list on the month. Always remember: there are Linux users and\
    \ then there is the rest of society.\n\n- Dev Casin\n\n### One Linux, Many Faces\n\
    \nIn his (December 2006 issue of LI), Jon Alexander described how his friend James\
    \ wanted to interest him, by logging in with different desktops. If he could have\
    \ logged with multiple desktops and then switched between Linux and OS, he would\
    \ have included a couple of desktops for good needs. Also, don't forget about\
    \ the virtual desktops that Linux supports.\n\n- James Knott\n\n### Thieving Trajectories\n\
    \nIt was interesting to read Jon \"madad\" Hall's experience in this article titled:\
    \ Software of the People (see the UpFront Section of the December 2006 issue of\
    \ LI and compare it with our experience club had a few years ago.\n\nThe club\
    \ committee decided if the club members would donate their redundant equipment\
    \ to the club. The club would donate the equipment to a Soweto school and set\
    \ it up as a local network connected to the Internet.\n\nThe installation went,\
    \ and the local network\n\n## DONT BE SQUARE! GET CUB!\n\n![](img/6ad2c38f7c331af69e079dec652dce53_11_3.png)\n\
    \n![](img/6ad2c38f7c331af69e079dec652dce53_4)\n\n## A Touch of Eleg\n\nI hesitate\
    \ to issue with an author like Dave Taylor, his script uses repeated (and in many\
    \ cases) systems and divisions to achieve what simple multiplications do (Dave's\
    \ December 2006 column?). A simple algorithm to achieve such effect is embedded\
    \ in this hash as follows:\n\n```bash\n#!/bin/sh\n# Script for numeric scaling\
    \ $1 = number, $2 = iterations\n\nfor ((i = 1; i <= $2; i++))\n  dk=1024\n  mi=$((dk*$dk))\n\
    \  value=$1\n  if [ $value -lt $dk ]; then\n    units=\"bytes\"\n  elif [ $value\
    \ -lt $mi ]; then\n    units=\"KB\"\n  elif [ $value -lt $gi ]; then\n    units=\"\
    MB\"\n  else\n    units=\"GB\"\n  fi\n\n  printf \"%s %s\\n\" \"$value\" \"$units\"\
    \n\n  if [ \"$units\" != \"\" ]; then\n    value=$(echo \"scale = 2; $value /\
    \ $div\" | bc)\n  fi\necho \"$value units\"\n```\n\nRunning 1000 iterations of\
    \ each on HP laptop with AMD showed the revised version to take approximately\
    \ one-quarter of the time (local, user, and system) of original. Also worked,\
    \ when the team arrived to connect to the Internet, what did they find? Every\
    \ piece of equipment was either broken or missing. PS. Long live! As we write\
    \ in, we also find a reason why Ubuntu seems to be a favorite, yet readers prefer\
    \ KDE by a significant margin. People refer to variants of Ubuntu. Some of us\
    \ use installed and then use (essentially converting distribution).\n\n### Why\
    \ Ubuntu and not KDE?\n\nI have read a little bit about this Ubuntu, the 2005\
    \ Choice Edition, but that you chose KDE over Ubuntu. It seems to me that when\
    \ you were going to pick Ubuntu, you chose Gnome, and when you were choosing KDE,\
    \ you simply mean (Kubuntu in general for Editors' choice)\n\n## Erratum\n\nSome\
    \ of the code was incorrectly mentioned in George Bellets' 'The Alchemist of Your'\
    \ in December 2006. For the corrected version, please see www.linuxjournal.com/article/8337.\n\
    \n## LINUX JOURNAL\n\n## At Your Service\n\n## MAGAZINE\n\nPRINT SUBSCRIPTIONS:\
    \ Renewing your subscription, addressing your payment, and viewing our customer\
    \ service-subscriptions can be done online at www.linuxjournal.com. Alternatively,\
