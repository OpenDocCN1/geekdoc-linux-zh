    # 无痛式 U 盘备份


    利用 udev 规则每天或每次插入 U 盘时对闪存进行备份。


    **ANDREW FABROW**


    如果你曾经丢失过（或担心丢失过）USB U 盘，请**举起手来**。你花了几个小时时间在家里疯狂搜寻，然后才意识到自己根本没有仔细检查过塞进那个东西的口袋。


    你有所有这些数据的备份，对吧？你满心诚恳地希望是如此。你将数据拷贝到备份目录，并设置了定期计划。


    对我来说，这听起来工作量非常大，而且我想避免枯燥的工作。自然，花些时间研究出这种 U 盘备份方案会更有趣。


    那么，“无痛备份”呢？有没有这样一个系统：你可以走到 Linux 电脑前，插入驱动器，等待“备份完成”，然后拔掉走人即可？这个系统能够保持备份有序（保留最后七份副本？），并且应该能为你处理好一切。而且，它应该同时支持卷级替换和单文件恢复。


    没问题。这个系统使用了 udev 规则和一个简单的脚本。这些工具已经存在于你的系统中。在示例中，我使用的是一个带有 2.6 内核的 CentOS 4.3 系统。


    ## udev 救场


    udev 是 Linux 的设备管理器，2.6 内核处理所有设备管理，包括设备的热插拔。它的功能之一是你可以编写一条规则，在插入设备时自动创建一个文件。


    这些规则位于 `/etc/udev/rules/`（如果你使用的是不同的发行版，请检查 `/dev/udev/rules.d`，它应该指向规则目录）。你可以根据意愿在在该目录的任何位置将规则作为文本文件放置其中，udev
    会立即 pick取并供使用，而无需重启。


    ## 如何识别你的设备


    要编写事件规则，你需要一种独特的方法来识别 USB 设备。大多数 U 盘都有序列号，尽管并非所有都有。幸运的是，对于没有序列号的 U 盘，你可以为它们编写规则。


    你可以使用这些 U 盘作为示例：JetFlash F10 和 TrueDisk Flash Voyager。JetFlash 有序列号，而 Corsair
    则没有。


    插入你的 U 盘，运行 `cat /proc/sys/usb-storage/*..`。你应该找到一个类似下面的条目：


    ```

    Host scsi: usb-storage

    Vendor: Unknown

    Product: USB Mass Storage Device

    Serial Number: 8a5ab1c2fc96492

    BandSize: Bulk

    Quirks:

    ```


    如果你有序列号，请直接跳到“编写规则”部分。如果没有，请使用 `Serial Number` 字段。要使用 udev 识别设备，请遵循以下步骤：


    - 1) 查看设备的输出。典型输出如下：


    ```

    usb-storage: waiting for device to settle

    Vendor: Model: True Flash Voyager  Rev: 1.00

    ANSI SCSI scsi device: 203816c6 512-bit block dev (1048 MB)

    ...

    sde: adding device create: through host

    sde: sde

    Attached scsi removable disk to scsi1,channel 0, id 0, lun 0, type 0

    ```

    - 2) 现在，


    这告诉你 udev 已经看到了该设备。


    运行 `udevadm info $p -udevinfo -n /dev*` 并检查输出。寻找这些内容：


    ```

    SUBSY="scsi"

    SYSFS(model)="Flash Voyager"

    SYSFS(vendor)="Corsair"

    ```


    ## udev


    这仅仅触及了使用 udev 规则可以做的事情的角。任何其他热插事件都可以触发规则。例如，你可以编写规则来自动移动 U 盘、拷贝相机照片或设置网络链路。udev
    规则提供了充分的灵活性，包括打印通配符和设置权限的能力。


    关于使用 udev 规则的最佳概览是 David Drake 的“udev Rules”，可以在 https://www.reactivated.com/writing_udev_rules.html
    找到。


    ## 编写规则


    现在，有了序列号或型号/组合值，你就可以编写规则了。该规则会在 `/dev` 设备中为该设备创建一个符号链接，例如 `/dev/corsair_drive`，然后将其链接到
    `/usr/local/bin/backup-drive`。


    切换到 root 用户 (-)，并在 `/etc/udev.rules.d/95-backups` 中创建一个文本文件。你可以使用 95 以外的数字，但请记住
    udev 进程是按字母数字顺序排列的，最好让本地进程列在前面。


    如果你有序列号，在文件中输入如下规则（全部写在一行）并保存它：


    ```

    BUS="usb"; SYSFS(serial)="B8a5b1f2c9492"; SYMLINK="jet_drive"

    RUN=/user/local/bin/backup-thumb.sh jet_drive

    ```


    如果你使用的是型号识别，你的规则看起来像这样：


    ```

    BUS="scsi"; SYSFS(vendor)="Corsair"; SYSFS(model)="Flash Voyager"

    SYMLINK="corsair"; RUN=/user/local/bin/backup-thumb.sh corsair

    ```


    注意，你可以使用任何你识别驱动器所需的 `SYSFS` 条目。你的规则现在每次插入 U 盘时都会触发。


    注意：如果你对设备有其他规则，udev 会按照从上到下的顺序执行规则。


    ## 设置备份脚本


    `backup-thumb.sh` 负责将 U 盘备份到备份目录并在每次插入时执行。


    （注：此处原文未提供具体的脚本内容，仅有描述，根据指令要求，我已翻译给定文本的描述部分。）


