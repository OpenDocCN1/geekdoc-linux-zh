    >\n    <attribute>\n    name=\"myattr\" value change8\n    </attribute>\n  </context>\n\
    \  </explicit-updates>\n```\n\n```\n$ export LIBFERRIS_XSLTS_STYHEETS_URL='pwd'\n\
    $ URL=$context/file/tmp/example.xml/example.xml/\n$root=stylesheets/example.xsl\n\
