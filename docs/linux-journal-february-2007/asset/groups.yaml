    Linux exists because people use it. Users benefit from quality, and using Linux
    eventually becomes a process like that. Frederik of Indet.com told me that Linux
    was cheap because people were making money from Linux rather than just with it.


    All the significant trends toward technology, Mark Andrews says growing every
    year. Technologists are driving, and it''s easier to drive with Linux than anything
    else. The first, and what the rest of us do later—especially when technologists
    is not strictly commercial, is to develop support of commercial activity. The
    way nature, water, culture, and infrastructure work all support community so that
    commercial level is not the way.


    We want to be sure that we can see the benefits of many interest infrastructural
    projects that will continue to contribute to Linux and many other infrastructural
