    # 使用 Win4Lin 打破硬件升级周期

    WINDOWS 虚拟桌面服务器


    通过 Win4Lin VDS 将 Windows 交付给 Linux 客户端，实现向 Linux 的滑迁移。


    Jon Watson


    ## WinLin 虚拟服务器


    WinLin Virtual Server (winlin.com) 是一种客户端/服务器解决方案，可将组织从昂贵且高维护的 Windows 基础设施迁移到更健壮、更精的
    Linux 基础。只需点击鼠标即可将单份 Windows 直接交付到多个用户的桌面。


    如果你的用户只需要在 Linux 桌面运行某个特定的应用程序，你并不希望他们拥有完整的 Windows 桌面。如今从 Windows 迁移到 Linux，所需要的是灵活性，而非成本。


    Linux 服务器的成本通常低于 Windows 服务器。因此，可以使用 WinLin 来打破硬件升级周期。使用 Linux 后，组织面临的硬件和软件升级需求将会减少。


    尽管关于总拥有成本 (TCO) 的问题双方都有论点，且结论通常是 Linux 更便宜，但迁移基础设施所带来的财务负担是不容忽视的。WinLin 允许在更换基础软件的同时，让员工继续在熟悉的
    Windows 环境中操作。


    WinLin 提供了无限的喘息空间。一旦操作系统基准完成更换，组织可以选择留在 Linux 环境中，也可以利用 Linux 工具满足其功能性应用程序的优势。


    WinLin 为桌面提供了“应用程序”，这意味着用户可以在运行 Windows 的同时运行 Linux 应用程序。Windows 应用程序可以直接启动在 Linux
    桌面上。


    除了基础设施问题外，运行 VDS 服务器还可以对属性、更新和维护进行中心化管理。通过服务器中心化，组织在终端用户快速迭代周期中面临的变化将减少。


    现有的 Linux 系统可以在其偏好的 Linux 发行版运行。


    VDS 与客户端/服务器虚拟机 (VM) 解决方案不同。大多数 VM 服务器提供有限的应用程序集。WinLin 提供的是完整的桌面。如果客户端不支持 X 协议，可以通过虚拟终端、VNC
    或 Noarent 使用替代的“显示”方法，这些方法在使用安装了 Web 浏览器时效果非常好。


    WinLin 管理员的主要任务之一是保持 Windows 的补丁和更新，以保护客户端免受 Windows 每天面对许多安全漏洞和攻击栈。如所述，VDS 提供单个
    Windows 实例进行补丁和更新，不仅节省了时间，还降低了安全漏洞的风险。


    此外，由于终端用户的体验是主环境和本地存储设置的结合，只需注销并重新登录会话即可保留镜像和设置。


