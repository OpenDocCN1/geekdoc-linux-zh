    \ February 2007 | 81\n\n## INDEPTH\n\nfunction shows, this thinner mapper appear\
    \ that the Database is storing Person objects.\n\n## Secondary Indexing\n\nSometimes\
    \ you might find that you are storing multiple keys by which you would like to\
    \ be able to find a quick item. For example, if you are storing contact information,\
    \ you might want to look up people based on their name or e-mail address.\n\n\
    You could achieve this by storing each person's information using the name as\
    \ the key, and maintaining a secondary database from e-mail address. To find a\
    \ person by e-mail, you would use the e-mail-keyed database to find the name and\
    \ then use the name to find the actual information. Maintaining indexes like this\
    \ is highly error-prone, and more, the secondary indexes in Berkeley DB do this\
    \ for you.\n\n### Reading Reading Objects\n\n```cpp\n#include <iostream>\n#include\
    \ <STLdb4/stdb4.h>\n\nusing namespace STLdb4;\nusing namespace std;\n\nclass Person\
    \ {\npublic:\n    string email;\n    string name;\n    string phoneNumber;\n \
    \   explicit Person(const string& name, const string& ph = \"\")\n        : email(name),\
    \ phoneNumber(ph) {}\n};\n\nPerson(const DatabaseValue& r) {\n    string ss;\n\
    \    ss << string(r);\n    getline(ss, name, \"\\0\");\n    getline(ss, email,\
    \ \"\\0\");\n    getline(ss, phoneNumber, \"\\0\");\n}\n```\n\nThe above example\
    \ can be implemented by using the primary key value as the person and a secondary\
    \ index on the e-mail addresses. This setup is shown in Figure 1. refer to name-to-person\
    \ mapping as the main database and look-up database as secondary index.\n\n| Secondary\
    \ Index | Main Database |\n|---|---|\n| Email Address | key: name |\n| value:\
    \ Person | information |\n\nWait, the GetOffset() returns a template object of\
    \ the same type and return all the data from that offset to the end of the item.\
    \ The GetOffsetIndex() is similar, but returns the length. The GetTerminatedString()\
    \ takes an offset and skip count to extract the null-terminated string from a\
    \ given offset. If you have thirty-two integers followed by four null-terminated\
    \ strings as your format, you could use an offset of 20 and a skip of 2 to extract\
    \ the third null-terminated string. Assuming the use of Person from class 5, listing\
    \ 6 creates and uses secondary indexes on the e-mail address. Because database\
    \ starts with our data, creating the extraction function with GetTerminatedString()\
    \ will return an offset and skip one null-terminated string for the email address.\
    \ I perform partial look-up using the secondary index. The equal method finds\
    \ both the lower and upper bound for partial match. In this case, I find any e-mail\
    \ addresses that begin with a letter. The output from the program is shown in\
    \ Listing 7. Note that the first of iterator is the key from the secondary index,\
    \ and the second is the data from the main database. The main data for this look-up\
    \ is available through getPrimaryKey() on the iterator.\n\n## Transactions\n\n\
    Transactions are supported by either explicit transaction method or by setting\
    \ the implicit transaction on Database objects.\n\n```cpp\nint main(const char\
    \ **argv) {\n    fh_database db = new Database(DB_BTREE, \"/tmp/db.db\");\n\n\
    \    db->insert(make_pair(\"Alex\", \"Person\", \"alex@foo.com\"));\n    db->insert(make_pair(\"\
    Barry\", \"Person\", \"barry.bar.com\"));\n\n    Person *p = db[\"Barry\"];\n\
    \    cout << \"Barry email address: \" << endl;\n    cout << p->email << endl;\n\
    \n    return 0;\n}\n```\n\n82 | February 2007 www.linuxjournal.com\n\n### Listing\
    \ 6. Secondary Indexing\n\n```cpp\nunlink(\"/tmp/play.db\");\nunlink(\"/tmp/play.sec.db\"\
    );\n\nfh_database db = new Database(DB_BT, \"/tmp/play.db\");\nDatabase->sec_id_callback\
    \ f = getIfNotatedSecId(0,1);\nf_database sec_id = Database::SecondaryIndex(f,\
    \ DB_BTREE, \"/tmp/play.sec.db\");\n\ndb->insert(make_pair(\"alex\", Person(\"\
    Alex\", \"alex@foo.com\")),\n    make_pair(\"alfred\", Person(\"Alfred\", \"alfred.bar.com\"\
    )));\ndb->insert(make_pair(\"andrew\", Person(\"Andrew\", \"andrew@foo.com\")),\n\
    \    make_pair(\"barry\", Person(\"Barry\", \"barry.bar.com\")));\n\npair<Database::Iterator,\
    \ Database::Iterator> p = db->range_partial(\"string\");\nfor(Database::Iterator\
    \ i = p.first; i != p.second; ++i) {\n  string prim;\n  if (i->getPrimaryKey(prim))\
    \ {\n    cout << \"primary: \" << prim << endl;\n    cout << \"first: \" << i->first\
    \ << endl;\n    cout << \"second: \" << i->second << endl;\n    Person p = *i->second;\n\
    \    cout << \"person name: \" << p.name << endl;\n    cout << \"email: \" <<\
    \ p.email << endl;\n  }\n}\n```\n\n### Listing 7. Secondary Indexing Program Output\n\
    \n```\ndi...\n  primary:alex\n  first:alex@foo.com\n  second:Alex@foo.com\n  Person\
    \ name: Alex email:alex@foo.com\ndi...\n  primary:alfred\n  first:alfred.bar.com\n\
    \  second:Alfred@bar.com\n  Person name: Alfred email:alfred.bar.com\n```\n\n\
