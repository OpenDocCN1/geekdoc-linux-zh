    context allows it to write a new file, the file will inherit the security context;
    with a different security context, SELinux will need to make a type decision.


    Get the picture? Transition decisions are necessary because the same file or resource
    may be used in multiple domains/processes and if transitions are a normal part
    of system operation. But, if domains can be changed arbitrarily, attackers will
    have a much easier time doing mischief.


