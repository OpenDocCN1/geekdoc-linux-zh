    \n函数这个更薄的映射显示 Database 正在存储 Person 对象。\n\n## 二级索引\n\n有时你可能会发现你存储了多个键，以便你能够快速找到某个项目。例如，如果你正在存储联系信息，你可能想根据姓名或电子邮件地址来查找人员。\n\
    \n你可以通过使用姓名作为键存储每个人的信息，并维护一个来自电子邮件地址的二级数据库来实现这一点。要通过电子邮件查找人员，你将使用以电子邮件为键的数据库查找姓名，然后使用姓名来查找实际信息。维护这样的索引很容易出错，而\
    \ Berkeley DB 的二级索引会为你完成这些工作。\n\n### 读取对象\n\n```cpp\n#include <iostream>\n#include\
    \ <STLdb4/stdb4.h>\n\nusing namespace STLdb4;\nusing namespace std;\n\nclass Person\
    \ {\npublic:\n    string email;\n    string name;\n    string phoneNumber;\n \
    \   explicit Person(const string& name, const string& ph = \"\")\n        : email(name),\
    \ phoneNumber(ph) {}\n\nPerson(const DatabaseValue& r) {\n    string ss;\n   \
    \ ss << string(r);\n    getline(ss, name, \"\\0\");\n    getline(ss, email, \"\
    \\0\");\n    getline(ss, phoneNumber, \"\\0\");\n}\n```\n\n上面的示例可以通过使用主键作为 person\
    \ 以及对电子邮件地址的二级索引来实现。这种设置如图 1 所示。参考将姓名到人的映射作为主数据库和二级索引数据库。\n\n| 二级索引 | 主数据库 |\n\
    |---|---|\n| 电子邮件地址 | 键：姓名 |\n| 值：Person | 信息 |\n\n等待，`GetOffset()` 返回相同类型的模板对象，并返回从该偏移量到项目结束的所有数据。`GetOffsetIndex()`\
    \ 类似，但返回长度。`GetTerminatedString()` 获取一个偏移量和跳过次数，以从给定的偏移量提取终止字符串。如果你的格式是32个整数后接四个终止字符串，可以使用\
    \ 20 的偏移量和 2 的跳过来提取第三个终止字符串。假设使用类 5 中的 Person，Listing 6 创建并使用了电子邮件地址的二级索引。因为数据库从我们的数据开始，使用\
    \ `GetTerminatedString()` 创建的提取函数将返回一个偏移量和一个终止字符串。使用二级索引执行部分查找。`equal` 方法找到部分匹配的下和上限。在这种情况下，迭代器的第一个是二级索引的键，第二个是主数据库的数据。此主数据可以通过迭代器上的\
    \ `PrimaryKey()` 获取。\n\n## 事务\n\n通过显式事务方法或在 Database 对象上设置隐式事务来支持事务。事务的使用方法在 Listing\
    \ 9 中所示。\n\n```cpp\nint main(const char **argv) {\n    fh_database db = new Database(DB_BTREE,\
    \ \"/tmp/db.db\");\n\n    db->insert(make_pair(\"Alex\", \"alex@foo.com\"));\n\
    \    db->insert(make_pair(\"Barry\", \"barry.bar.com\"));\n\n    Person *p = db[\"\
    Barry\"];\n    cout << \"Barry email address: \" << endl;\n    cout << p->email\
    \ << endl;\n\n    return 0;\n}\n```\n\n82 | 2007年2月 www.linuxjournal.com\n\n###\
