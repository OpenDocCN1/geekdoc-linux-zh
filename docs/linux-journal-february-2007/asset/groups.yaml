    数据库环境是用于配置将要使用的组伯克利数据库的环境。在带有多个数据库文件的并发数据存储中使用数据库环境，允许你有多个应用程序对数据库文件进行读写，Berkeley\
    \ DB 会处理锁定以确保文件不会损坏。STLDB4 中的默认环境实际上是一个新环境。数据库环境使用 Environment::setDefault 方法创建，可用于使用单个数据库环境的应用。列表\
    \ 11 所示的代码使用数据库环境来保护数据库文件免受进程的并发访问。首先，创建一个新的数据库环境并将其设置为默认。可以使用 Database::set_compare()（可以是函数指针或新函数）更改数据库中元素的顺序。有关\
