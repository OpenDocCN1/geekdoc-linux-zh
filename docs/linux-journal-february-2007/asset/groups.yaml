  mdcn: '


    ## 特性：CITADEL


    ## 卸载


    卸载通过快速安装（Easy Install）方法安装的 Citadel 实例步骤如下：


    - 1. 删除上述三个目录 (/usr/local/webcit/citadel 和 /usr/local/citadelsupport)。

    - 2. 从 initab 文件（通常为 /etc/initab）中移除 WebCit 条目。

    - 3. 输入命令 `init q` 重启它。


    完成。


    ## 初始配置


    我们使用 WebCit 界面来配置和使用 Citadel，但在精美的 GUI 界面背后，跳动的是文本模式 BBS 的心脏。Citadel 系统的所有配置和大部分日常使用都可以通过以前的文本模式
    Citadel 完成。话虽如此，这种通信方式对大多数现代用户来说已经基本失传，因此我们仅专注于使用 WebCit 来工作。


    尽管如此，出于其他原因我们仍然需要登录 Linux，因此必须更改 Citadel 的默认方式，并将其重定向到其他地方以完成工作。实现此点的方法有很多，但由于
    Linux 提供了可配置的 syslog 守护进程，更改配置文件（在 Debian 上）并将本地设施（local facility）指向其他地方的日志文件似乎是合理的。


    当你首次登录这个新的 WebCit 时，界面将变为管理员级用户。要创建管理员账户，请将网络浏览器指向主机并登录。安装后，输入用户名和密码，然后点击“新用户”（New
    User）按钮（图 1）。如果你在登录菜单的左下方看到“管理”（administration）按钮，你就知道自己是管理员了（图 2）。


    要编辑全局配置（wide-configuration），点击管理，你将进入组织且完整的设置集。主菜单位于页面顶部，点击每一项都会进入该条目的设置。Citadel
    在 WebCit 界面下方也是一个文本模式 BBS，你所做的某些配置选项将会生效。


    对所有项目进行良好的概述不在本文的范围内，最重要的是“网络”（Network）标签页，如果你在使用 LDAP。在“网络”标签页下，你可以启用服务并修改你需要更改的属性。“目录”（directory）标签页用于你的
    LDAP 设置。如果不使用 LDAP，可以跳过此项。


    你可能想快速查看“访问”（Access）标签页，确保它反映了你希望新用户注册账户的方式。


    在允许用户进入 WebCit 界面之前，你可能想对网站进行一些自定义。在你浏览任何内容时，你可能想要构建 POP、SMTP 或 IMAP 服务，或者跳过其中任何一个并保持运行。


    此外，还有一个 Web 界面 WebCit，用户可以通过它在本地或离开本地个人信息管理器客户端时，获取其所有的电子邮件、日历和联系人信息。如果你选择使用 WebCit，Citadel
    不会假设可以在非端口上运行 WebCit，并让任何未绑定 80 端口的网站处于开启状态。


    对于好奇的人来说，Citadel 安装在 /usr/local/citadel，WebCit 安装在相应位置。支持库可以在 /usr/local/citadelsupport
    中找到。


    64 | 2007年2月 * www.linuxjournal.com


    '
