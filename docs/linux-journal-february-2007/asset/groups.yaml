    # Break the Hardware Upgrade Cycle with Win4Lin

    WINDOWS VIRTUAL DESKTOP SERVER


    Smooth Migration to Linux by delivering Windows to Linux clients via Win4Lin VDS.


    Jon Watson


    ## WinLin Virtual Server


    WinLin Virtual Server (winlin.com) is a client/server solution that can be used
    to migrate an organization from an expensive and high-maintenance Windows infrastructure
    to a more robust and sleek Linux base. How a single copy of Windows can be delivered
    directly to multiple users'' desktops with a click of a mouse.


    You don''t want your users to have a full Windows desktop if they only need a
    specific application delivered to the Linux desktop. It''s flexibility, not cost,
    that makes Linux servers required for moving from Windows to Linux today.


    Linux servers are generally lower than those of Windows servers. Therefore, WinLin
    can be used to break the hardware upgrade cycle. With Linux, organizations are
    faced with fewer hardware and software upgrades required.


    Although arguments can be made on either side of the Total Cost of Ownership (TCO)
    issues, which have come to conclude that Linux is cheaper, the financial burdens
    of migrating your infrastructure. WinLin allows the baseline software to swap
    out while still employees continue to operate in their familiar Windows environment.


    WinLin offers indefinite breathing room. Once the OS baseline has swapped out,
    organizations can choose to remain in the Linux environment or enjoy the benefits
    of using Linux tools to fulfill their functional applications.


    WinLin offers "application" to the desktop, meaning that users can run Linux applications
    alongside Windows. Windows applications can be launched directly into the Linux
    desktop.


    Aside from the infrastructure questions, running a VDS server allows for a centralized
    management of property, updates and maintenance. By centralizing the server, organizations
    will face fewer changes on the end-user rapid-generation cycle.


    Existing Linux systems can be used under their preferred Linux distribution.


    VDS is different from a client/server virtual machine (VM) solutions. Most VM
    servers provide a limited set of applications. WinLin provides a full desktop.
    If the client cannot support X protocols, the alternative "display" methods can
    be used via Virtual Terminal, VNC or Noarent, which are pretty nice when using
    a Web browser installed on it.


    One of the main tasks for WinLin administrators is keeping Windows patched and
    updated to protect clients from the many security vulnerabilities and attack stacks
    that Windows has on a daily basis. As mentioned, VDS offers a single instance
    of Windows to patch and update, which only takes less time, but also reduces the
    risk of security vulnerabilities.


    Further, because the end users'' experience is a combination of the master environment
    and their local stored settings, simply logging in and logging back with their
    session preserves the image and their settings.


    ## Clients


    WinLin recommends using the native Linux Terminal Server for clients in order
    to make use of all the advantage a native WinLin client connection offers. However,
    there are several ways to connect to a VDS, and if you''re in need of seamless
    setup, any client will get what they need.


    Connection to the VDS can be made via VNC, Telnet, or SSH (with X11 forwarding
    enabled). For Telnet and SSH, the (DISPLAY) environment variable must be set.
    In general, the remote login options are suitable only for high-speed environments,
    such as local LAN. WAN may provide enough bandwidth to use these methods. Connections
    are also possible using the RealVNC, the NoMachine and Tarenta.


    If you don''t want a way to connect to the VDS, you simply use...


    ## Licensing


    A base license starts at $2,500 for 25 seats. Licenses can be obtained in various
    increments to enable VDS to handle up to 1000 users. Whether your client needs
    1000 users is up to you. It''s important to note that these licenses are for VDS
    and not for Windows. Windows requires you to have your own Windows licenses under
    Microsoft''s terms is not included, existing licenses can be used by...


    ## Download and Installation


    The current version of WinLin VDS is 3.0, 3.5 is in tail-end beta and will be
    released later to go to print. It doesn''t make a lot of sense to write about
    a potentially moving target, especially when 3.0 is a stable version.


    WinLin Pro and VDS are binary, but different licenses offer different difference.
    There are RPM and DEB packages for 32-bit and 64-bit WinLin. The installation
    is a process for Linux, and that''s when the support comes in.


    There is no upgrade from WinLin Pro to WinLin VDS, so if you''ve installed it,
    you have to install a VDS with it using a license key.


    VDS clients are available for Linux, Solaris and Windows, but the source is also
    available for download, which allows many to compile a client for any platform.


    ## Install the Server


    Download the packages from the WinLin site (ftp.winlin.com/releases/linux/index.html).
    Here they are available as 32-bit and 64-bit, as well as RPM and DEB files.


    We downloaded the 32-bit RPM package and installed it on a machine with 1GB of
    RAM running a distribution of Ubuntu 18.04 LTS. The installation was successful
    except because Ubuntu''s "edge" kernel had issues with the WinLin clients. The
    server works perfectly now and no issues have been reported since then. It is
    also possible that some sharp-eyed readers may be detecting different problems
    in screenshots of the screens.


    VDS can be installed without a touch. The VDS installation manual details the
    configuration for supported distros which must be installed before installing
    VDS. The installation requires the QEMU module to provide speedy performance.
    As you''ve already installed the desktop, the building of said module will be
    largely to you (Figure 1).


    ```bash

    $ john@ubuntu:~/documents/winlin-vds.sh

    [john@ubuntu] ./winlin-vds_3.0-amd64.sh

    [john@ubuntu] Starting script...

