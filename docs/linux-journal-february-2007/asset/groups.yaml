- md: "\n# DEPTH\n\n| Listing 8. Using Implicit Transactions with STLdb4 |\n\n```cpp\n\
    #include <iostream>\n#include <STLdb4/stldb4.hh>\n\nusing namespace STLdb4;\n\
    using namespace std;\n\nint main(int,char**)\n{\n  Environment::setDefault(new\
    \ Environment(\"/tmp\"));\n\n  fh_database db = new Database(\n    new Transaction(),\
    \ DB_BTREE, \"/tmp/play.db\");\n\n  db->start();\n  db[\"foo\"] = \"bar\";\n \
    \ cerr << \"Initial value: \" << db[\"foo\"] << endl;\n  db->commit();\n\n  db->start();\n\
    \  db[\"foo\"] = \"newbar\";\n  cerr << \"Middle value: \" << db[\"foo\"] << endl;\n\
    \  db->abort();\n\n  cerr << \"Final value: \" << db[\"foo\"] << endl;\nreturn\
    \ 0;\n}\n```\n\n| Listing 10. Using RAII Transactions with STLdb4 |\n\n```cpp\n\
    int main(int,char**)\n{\n  Environment::setDefault(new Environment(\"/tmp\"));\n\
    \  fh_database db = new Database(\n    new Transaction(), DB_BTREE, \"/tmp/play.db\"\
    );\n\ntry\n{\n  fh_trans tr = new Transaction();\n  tr->setDefaultDestructorAbort(true);\n\
    \  db->setImplicitTransaction(tr);\n  tr->commit();\n\n  // (RAII with transactions)\n\
    \  // Don't setImplicitTransaction() in this block\n  fh_trans tr = new Transaction();\n\
    \n  tr->setDefaultDestructorAbort(true);\n  db->set(\"foo\", \"First setting\"\
    , 0, tr);\n  Database::iterator iter = db->find(\"foo\",tr);\n  *iter = \"this\
    \ is something evil\";\n  tr->commit();\n}\ncatch (const std::exception& e) {\n\
    \  cerr << e.what() << endl;\n}\nreturn 0;\n}\n```\n\n| Listing 9. Using Explicit\
    \ Transactions with STLdb4 |\n\n```cpp\nfh_trans trans = new Transaction();\n\
    fh_database db = new Database(\ntrans, DB_BTREE, \"/tmp/play.db\");\ndb->start(DB_BTREE,\
    \ \"/tmp/play.db\");\ndb[\"foo\"] = \"bar1\";\ndb[\"foo\"] = \"bar2\";\ntrans->commit();\n\
    \n// Create a implicit transaction and go join\ntrans = new Transaction();\ndb->setImplicitTransaction(trans);\n\
    db[\"foo\"] = \"bar3\";\ndb->set(\"foo\", \"bar22\", 0);\n// we'd not put these\
    \ changes in all trans\ntrans->abort();\n```\n\nAcquisition RAII programming to\
    \ wrap a transaction automatically if any exception occurs in the code. This style\
