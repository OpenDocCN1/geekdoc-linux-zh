    花些时间研究 SELinux，可以少受一些零日攻击的伤害。


    **SELinux** 是美国安全局（NSA）对 Linux 强制访问控制（MAC）的强大实现，看起来可能像是一项艰巨的任务。它包含许多组件，这些组件带有统一的、充满缩写词术语标记（这是一个双关语），在
    Linux 已经就绪的架构之上增加了一些非常密密的抽象层。更糟糕的是，SELinux 的大部分文档似乎仅由专家编写。好吧，人们都这么说，而且这又是谁的 LDAP
    了，但正如 LDAP（我们在 2003 年 7 月、8 月和 9 月刊中介绍过），如果你想学习一些基本概念，SELinux 并不需要做那些事情。


