    # Long Live the Freedom of Linux that is begging for proper mediums.


    ## A window of opportunity awaits us


    ![](img/6ad2c38f7c331af69e079dec652dce53_98_0.png)


    Nick Peter, Editor in Chief


    Microsoft is running scared, and has good reasons to be afraid. Vista is destined
    to be a disappointment, an expensive one for many, and is not likely to fail.
    If Vista will fill many desktops, it will be because people from one single Microsoft
    group, I don''t know anyone who cares about Vista, let alone anyone who is excited
    about its release.


    The window of opportunity has now been opened. But Microsoft is now trying to
