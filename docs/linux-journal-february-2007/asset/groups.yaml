    \ - 从 NTFS 分区恢复删除的文件\n\n列出的许多工具对开发者比对维护网络或双系统系统的人更有用。其中一些工具是真正的救星，而 ntfs 是所有这些工具中最好的。\n\
    \nwww.linuxjournal.com 2007年2月 | 4\n\n"
