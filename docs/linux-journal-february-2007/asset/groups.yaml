    As you might guess, it would be impossible to use if you had to rule every possible
    object. SELINUX gets around this in two ways: (1) By taking the ''default'' stance
    which is not explicit; (2) By controlling subjects and objects in various ways.
    Both of these things have positive and negative consequences.


    The ''default'' stance allows you to have rules/policies that define what you
    expect and, much further than all possible behaviors. But also, it requires you
    to have the most secure design principle any access control can handle. It also
    works by (any interaction) between user and command on your system.


    This is why the ''targeted'' SELinux policy in Red Enterprise Linux 4 and Core
    3 allows to restrict only those particular services; giving free freedom to run
    all processes not needed by SELinux, and it is not the most secure way to use
    SELinux, nor is it the way SELinux originally intended to be used. But it is a
    justifiable compromise.


    The use of SELinux''s various groupings (groups, types, contexts and so on) is
    obvious; improved efficiency over having specific individuals users, permissions
    and objects. How does SELinux group subjects, permissions and objects?


    # Security Contexts: Users, Roles and Domains


    Every individual object and subject is controlled by SELinux and is governed by
    a security context, each of a user,


    role and a domain (also called type)

    A user is what represents an individual user, whether human or daemon; SELINUX
    allows many types of users separate from Linux DAC. In security contexts for the
    users, the label indicates SELINUX owns the subject (which, must be a process);
    In security contexts the label indicates SELINUX user owns the object.


    A role is like a user in the Linux DAC, but can be assumed by any of the authorized
    users, who may be authorized to assume different roles at times. The difference
    is that in SELinux, a user may use only one role at a time, and switch roles by
    changing the role in a security context where the role specified is operating
    for that particular context.


    A domain is like a combination of subjects and objects that interact with each
    other. Domains are also called types, and there are many different types of them.
    In the Linux DAC-used SELinux, there is only one type.


    In this model, each process (subject) is assigned to a domain (called Type Enforcement),
    and it is the part of the SELinux implementation in Fedora and Red Hat Enterprise.
    The policy controls the interaction between domains.


    I''d like to explain how-de-this works further, if you want to see an example
    of SELinux context.


