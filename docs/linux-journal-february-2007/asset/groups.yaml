    ```

    onclick="new Effect.Fade(''header'')")

    ```


    Each of the effects has a number of settings, each of which is a default value
    provided by Scriptaculous. To override one or more of these defaults, pass one
    or more of them in the invocation:


    ```

    onclick="new Effect.Fade(''header'', {delay: 2, duration: 10})",

    ```


    In some cases, as with the appear/fade duo in Listing 1, it seems a bit silly
    to have two buttons. After all, what happens if I click on fade twice? It would
    be more reasonable to have a single button that turns the header on and off vice
    versa. The library supports this toggle effect. For example, we can remove one
    button and give the second one a handler that looks like this:


    ```

    onclick="new Effect.toggle(''header'', ''appear")

    ```


    Now, clicking on that toggles the visibility of the header, using appear and fade
    to turn the header on


    and off. We can do the same thing with the blind (BlindUp and BlindDown) and slide
    (SlideUp and SlideDown) effects as well. We can also combine a toggle with the
    parameters shown early:


    ```

    onclick="new Effect.toggle(''header'', ''appear'', (delay: 2, duration: 10)",

    ```


    Only a few effects are useful. For removing text, as is one in the following:


    ```

    new Effect.Fold(''header")

    ```


    Others are made to get the user''s attention. For example, we can highlight our
    headline by doing this:


    ```

    new Effect.Highlight(''header")

    ```


