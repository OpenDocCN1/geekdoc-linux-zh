    # LINUX FOR SUITS


    Public:


    +   - Water (wells, reservoirs, distribution systems, dikes and levees).


    +   - Streets, highways and bridges.


    +   - Waste water treatment.


    The Net is quite supportive too. It doesn''t advertise itself. It connects devices
    and carries bits. It reduces to zero the distance between any two devices, or
    any two individuals. What we get for by and other commons is access to the Net—not
    the Net itself.


    I would argue that the Net is the most public infrastructure we have ever built
    first to build upon nature. To illustrate this, Figure 1 is a diagram of civilization,
    born from the Long Foundation.


    I''ve shown this before, but here it is important to show why: it shows how each
    layer supports the one above it, allowing the higher layer to master.


    Mixed and private:


    +   - Garbage disposal (mostly landfills).

    - Garbage collection and recycling.

    - Electric power generation and distribution.


    Let''s look at Linux, which grew out of the need to develop tools and building
    materials that were useful to everybody, rather than to what makes Linux infrastructural.
    The way Linux (and other open-source tools and building materials) works grows
    as a result of such a process as I explained in this report last year.


