    another. In account, and it reads the messages from a file, which would be /home/selinux/messages.txt.
    We need to access that file and we need to write to it.


    The heart of the blink''s context will be its domain, and when we call blink,
    it SELinux creates a domain with the name _blink. This domain is allowed to access
    the file /home/selinux/messages.txt and write to it.


    The file /home/selinux/messages.txt has its own context of them. The file is used
    by many users, but because they decide objects, not subjects, the policy will
    check the call-object role. Objects, which are defined in policy, decide who has
    access to them, not the other way around.


