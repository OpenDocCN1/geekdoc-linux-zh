    `wvText somedocument.docx`


    输出将直接显示在你的屏幕上，因此你可能想将其重定向到 pdf 或通过管道传输（或更少）。还有 `pdfw` 可以转换为 Latex，以及使用 LibreOffice
    创建 Abi 兼容文档等。查阅该网站以获取所有信息——


