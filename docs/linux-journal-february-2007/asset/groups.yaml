    # 让 Linux 的自由万岁，它渴望获得合适的载体。


    ## 机机窗口等待着我们


    ![](img/6ad2c38f7c331af69e079dec652dce53_98_0.png)


    Nick Peter，主编


    微软正处于恐惧之中，并且有充分的理由害怕。Vista 注定会令人失望，对许多人来说它是价格昂贵的，而且它不太可能失败。如果 Vista 占据了许多桌面，那将是因为来自微软某一个特定小组的人——我不认识任何人在乎
    Vista，更不用说谁对它的发布感到兴奋了。


    机遇的窗口现在已经开启。但微软现在正试图尽全力将其关闭。有关更多细节，请参阅我在《Linux Journal》网站上的文章，[Windows 与 Linux
    的五年之约](http://www.linuxjournal.com/1000121/)


    愿上帝保佑，保佑了那些拒绝签署任何东西的人。


    这项显著的工作为我们提供了一个无价的机遇窗口，让桌面从 Windows 转移出来。既然迁移到 Linux 桌面如此容易（或困难），为什么还要再等一年呢？


    现在让 Linux 发行版比现在更加自由、在自由上，这比以往任何时候都重要。


    我提议的自由是：


    - 1. 如上述网页所述，让你你所有的电脑都脱离任何 Novel/USE 软件。

    - 2. 不要给微软付钱，这样微软就不会让你支付侵权罚款。OpenGL 可能是某个某人的东西，因为“某人”实际上不太可能是客户。糟糕的公关会建立他们的信任，而在微软，他们可能会为了另一某事起诉某人，并将其计入总量，永久地解决这些问题。如果你需要支持微软的保护，你就让这种情况发生。

    - 3. 任何微软可以声称是专利侵权的东西。


    同时，针对微软可以用其专利声称的任何东西进行保护并替换。这是一个很好的停留点。微软在其中一次糟糕的交易中从 SGI 手中购买了专利。


    由于发行者之间存在这么多联系，潮起会让百船齐升。Red Hat 开始预装 Ubuntu。如果 Ubuntu 成为像 Red Hat 一样的标准无专利发行版，它将帮助每个小组获得系统所施加的压力。


    - 5. 让 Linux 桌面和开源应用无免费

    - 6. 并且比以往任何时候都假设 Linux。在这种情况下，会有更多电脑白痴使用 Linux。因此，目标是充分利用以用户为导向的应用程序。这些应用程序并将所有最常用的功能带到表面。界面管理程序
    LPhoto 是处理这个 Windows 窗口的极佳方法，对于那些喜欢红色调节、打印以及窗口底部四个标签页中所有常用功能的人。你可以进入不那么流行的操作系统的菜单，比如旋转照片。


    不要移除功能或任何东西。将它们放在用户界面上。你会惊讶于一个程序可以变得多么友好，以及这个 Windows 窗口是如何组织这些功能的。


    开发者们已经在努力让事情变得更好，但将实用程序注入应用程序的速度还不够快，但这为了掌握这个 Windows 窗口的所有细节是至关重要的。


    - 5. 用更多的免费软件填补免费领域的漏洞


    腾出一些时间为 Linux 世界创建稳健的元素，因为目前还没有像 Quick 和 Ticker 这样的对应功能。Linux 开发者需要赶上诸如 Quick
    这样的东西。


    Java 很快就会免费。只需开始爆炸式地安装 Java，所有的 JVM 将是 GPL——这会让许多 Java 应用无需从发行版制作。


    但有几件事是必要的，并且需要足够的时间关注。通过 Vista，我们可以很快简化这个机遇窗口，在非常不久的将来引发一场 Linux 革命。


    Nicholas Peter 是《Linux Journal》的主编，也是一名程序员老师、分析师和顾问，从事 Linux 工作已十多年。


    96 | 2007年2月 www.linuxjournal.com


    ![](img/6ad2c38f7c331af69e079dec652dce53_99_0.png)


    # Rackspace – 由狂热支持（Fanatical Support™）的托管托管


    快速的服务器、安全的数据中心和最大的带宽都是很好的。事实上，我们每年在这些上面投入了大量资金。但我们相信托管企业网站和应用程序不仅仅需要技术。它需要狂热支持。


    狂热支持并不是一个巧妙的口号，而是我们的客户与我们合作时体验到的现实。这是我们重新构客户服务的方式，为我们的一切带来前所未有的响应速度和价值。它从我们第一次和你交谈时开始，并且永不结束。


    联系我们查看狂热支持如何为您服务。


    > 感谢授予我们 2005 年《Linux Journal》读者选择奖“最喜爱的网络托管服务”


    1.888.571.8976 或访问 www.rackspace.com


    ![](img/6ad2c38f7c331af69e079dec652dce53_99_1.png)


    # 世界最快的 InfiniBand 交换机

    来自你信任了 24 年的公司


    ![](img/6ad2c38f7c331af69e079dec652dce53_100_0.png)


    Microway 的 5GHz FastTree DDR InfiniBand 速度是竞争对手的两倍。FastTree 架构使得创建 24 端口集群成为可能。24
    端口交换机的模块化设计旨在保持低延迟。非阻塞织织网结构实现了高性能计算。


    Microway 的 5GHz FastTree DDR InfiniBand 速度是竞争对手的两倍。FastTree 架构使得创建 24 端口集群成为可能。24
    端口交换机的模块化设计旨在保持低延迟。非阻塞织网结构实现了高性能计算。


    Microway 的 5GHz FastTree DDR InfiniBand 速度是竞争对手的两倍。FastTree 架构使得创建 24 端口集群成为可能。24
    端口交换机的模块化设计旨在保持低延迟。非阻塞织网结构实现了高性能计算。


    Microway 的 5GHz FastTree DDR InfiniBand 速度是竞争对手的两倍。FastTree 架构使得创建 24 端口集群成为可能。24
    端口交换机的模块化设计旨在保持低延迟。非阻塞织网结构实现了高性能计算。


    ## 利用 16 核 Opteron 核心的动力

    72 端口 FastTree 配置


    采用不锈钢架构的 RuggedRack™ 旨在保持低延迟。前置电源的 RuggedRack™ 便于拆卸。外部空气的 RuggedRack™ 提供了卓越的冷却。四个八核
    Opteron 核心的 RuggedRack™ 提供了高性能。


