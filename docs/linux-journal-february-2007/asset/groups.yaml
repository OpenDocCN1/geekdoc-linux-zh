  mdcn: "\n\n## Linux.NTFS 工具\n\n处理稀疏文件，但我发现现在更高的版本中其性能尚可。你可以将 NTFS 用作外部驱动，因为它具有处理大文件的能力——某些操作需要与你的\
    \ Windows 分区一样大的空间。如果你有一个格式化为 FAT32 系统的外部驱动，它的大小限制对于大多数用例来说太小了。如果你的电脑安装了 NTFS，你将能够从像\
    \ Knopix 这样的 Linux CD 启动。\n\n注意，NTFS 的原生驱动仍处于实验阶段，并声称尚未准备就绪。尽管如此，你无疑可以在几分钟内克隆一个稳定的\
    \ Windows XP 镜像。如果你在第一个硬盘的第一个分区上有 NTFS 文件系统，并且在同一台电脑上运行 Linux，则该命令会将 NTFS 备份为单个文件。\n\
    \n```\nntfsclone /dev/sda1 /usr/backup/ntfs.img\n```\n\n此处的大写 O 允许软件覆盖镜像，但如果你创建它，它将是缺失的。如果不是这样，它将留处于一种状态，允许你使用\
    \ loopfile 挂载 `ntfs.img`，并创建一个挂载点：\n\n```\nmkdir /usr/local/backup/mtpt\n```\n\
    \n然后，使用 ntfs 以及你用于普通挂载时相同的语法：\n\n```\nntfs -o loop /usr/local/backup/ntfs.img\
    \ /usr/local/backup/mtpt\n```\n\n然后，ntfs 命令默认读取/写入文件系统。文件可以轻松地复制、移动和删除。当然，存在一些跨平台问题，例如，当行结束时需要设置字符。\n\
    \n使用原生驱动给出了以下语法：\n\n```\nntfs -o loop,ntfs-utf8 /usr/local/backup/ntfs.img /usr/local/backup/mtpt\n\
    ```\n\n此说明还意味着提供了兼容 Windows 的字符集。如果你选择不使用它，请用 Emacs 启动。在 Windows 环境中编辑文件，或者在运行\
    \ Notepad 的情况下可能会更好。\n\n如果你想要只读访问，使用这种方法的成功取决于你的内核版本。这种方法很复杂，可能会失败。如果失败，行为将是回退到只读挂载。旧版本的驱动对于这两种方法都是相同的。对于包含挂载的设备，如下：\n\
    \n```\numount ntfs\n```\n\nntfs 文件可以像其他（任何）文件一样移动和复制。在安全的地方，它可以被压缩、存储并恢复到原始状态。副本可以被编辑然后恢复到原始状态。恢复原始文件的命令（在备份所在的目录中）如下：\n\
    \n```\nntfsclone -save-image /dev/sda1 -O /usr/local/backup/ntfs.img\n```\n\n\
    有时，较小的 ntfsclone 会采用允许镜像高效压缩的标志。这使得从本地硬盘和通过网络的克隆过程快得多。这里有一个示例，使用了示例镜像，正如第一个示例中所示：\n\
    \n```\nntfsclone -restore-image /dev/sda1 /usr/backup/ntfs.img\n```\n\n这个镜像除非被恢复到原始分区或不同的文件，否则。恢复到原始分区将发生如下：\n\
    \n- C++ 完整 Windows 功能\n- C/PEG - ANSI 最小占用\n- 免费\n- 快速执行速度\n- 完全可 ROM 的\n- 随带完整源码\n\
    - 开发工具包括 FontCapture、PEG WindowBuilder、ImageConvert\n- 安装的完整驱动程序\n- 行业自定义\n- 领先\
    \ NTFS 支持\n- 支持所有流行的处理器、控制器和 I/O 设备\n- 多语言支持 - 2 字节字符集 & UNICODE 编码\n- 事件驱动编程模型\n\
    - 应用设计服务\n\n在上面，-O 已被友好的 --overwrite 标志取代。它们是同一件事。所有标志都可以表示为友好的单词（对于英语读者），大多数可以表示为单字母：\n\
    \n- 全球范围内知识且及时的支持\n- 包含 Paint Shop Pro 的完全授权版本：9\n\n50 | 2007 | www.linuxjournal.com\n\
    \n## ntfsresize --info ntfs.img\n\n现在到了不错的部分。ntfsclone 将其数据发送到标准工具。这意味着你可以选择各种压缩工具、通过网络传输的各种模式等。任何尊重标准输入的工具都可以处理镜像。\n\
    \n软件将报告如下内容：\n\n备份压缩镜像：\n\n| ntfsresize v11.2 | |\n| :--- | :--- |\n| 设备名称 | ntfs.img\
