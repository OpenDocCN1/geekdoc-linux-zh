    # INDEPTH


    ## Interview with Christof Witting and Jerry Fields

    dbobjects


    dbobjects emerges as a unique blend of company and community. NICOLAS PETRELEY


    LI: Can you tell me about the history of dbobject?

    Christof: dbobject is the native Java and NET object database created since 2000
    by a group of developers around Carl Neiberg. dbobject was driven by users who
    felt there was an urgent need for an object persistence solution that was more
    efficient and better than performing inconsistent solutions


    In 2004, the software was successfully delivered to a handful of early customers,
    but it was ready for prime time. I was asked to join as CEO to grow the company.
    Today, dbobject is based in Silicon Valley.


    dbobject brought us to the open-source world, as we know from SQL, and fellow
    friends from Silicon Valley, such as Mark Leslie, leading CEO of Vertas (and our
    company), Vinod Khoda, CEO of Wind River, who joined our board early. Jerry Fields
    is here with us today to help us learn more about objects.


    LI: What is it and how are your customers using it?

    Christof: dbobject is an embeddable object persistence solution—and this is because
    it is an object database without servers. We call it an object database. Unlike
    Oracle, MySQL, or AS/400—large-scale, single-server, solutions—dbobject is an
    embeddable database that responds to method calls from the application code.


    Transactions span a broad range of domains (such as products and consumers online),
    mobile applications (such as delivery systems), packaged software (on a PC) or
    server-side middleware, and caches (such as in a SCADA system) all within reliability
    timelines.


    The unifying aspect is extreme reliability, high performance even with constrained
    resources, and it has to be Java and just like Java.


    LI: Would it be accurate to say that the market for dbobjects exists due to the
    popular adoption of a JVM in embedded systems?

    Jerry: Yes. Christof said where Java goes, dbobject goes. Rather than "embedded
    systems", I prefer to talk about device software.


    Traditionally, most software was written in C or C++ with a strong focus on hardware
    rather than best software practices. But the world is becoming increasingly sophisticated,
    with more memory, faster CPUs, and most important connectivity. Both and the data
    they deal with are becoming much more complex. Both and the data they deal with
    are becoming much more complex. Both and the data they deal with are becoming
    much more complex. Both and the data they deal with are becoming much more complex.
    Both and the data they deal with are becoming much more complex. Both and the
    data they deal with are becoming much more complex. Both and the data they deal
    with are becoming much more complex. Both and the data they deal with are becoming
    much more complex. Both and the data they deal with are becoming much more complex.


    LI: What are the key differences in version 6?

    Christof: Performance, performance, performance.


    LI: That''s most of it. In this space you should focus on performance because
    it''s the main concern of developers. A product that doesn''t address performance
    in this space is either not user-driven or simply not enough. For version 6, it''s
    not about being little faster. Version 6 has ten times faster response times,
    in some cases being about a hundred times faster, enabling a new set of functions
    (such as queries for example, where we have also reduced memory consumption up
    to 90% and).


    LI: How did all these changes come about?

    Christof: The technical answer is the use of B-Tree index architecture first.
    Then there''s the fact that we spent six months, which allowed us to achieve our
    amazing results. The product release cycle was key. Our customer team provided
    all the links to open space.


    LI: How did you engineer version 6 in a user-driven fashion?

    Christof: We started in early 2006 with a survey that gathered more than 1,000
    responses. Then we gathered together with users at the Conference in July 2006.
    Then we talked to some customers whose features we were producing, we were getting
    feedback because the release cycle of our continuous builds! Our weekly meetings
    are now held, so the development team is always in touch with the community around
    us.


    LI: How much of the changes in version 6 were the result of Open Source?

    Christof: This distinction is concerned. The community is as much a part of us
    as any company member is. It is not ''us'' and ''them''; there is only ''we''.
    It''s a collaborative approach. You earn your place by merit (and contributions),
    not by rank, or politics.


    It''s this convergence of technologies and practices, where Java embedded (and
    .NET with Windows mobile) is gaining ground.


    ![](img/6ad2c38f7c331af69e079dec652dce53_71_0.png)


    At our board meetings, we feel this invisible stakeholder community sitting right
    there—and she has a bit in how we allocate resources.


    LJ: We''ve been hearing developers cry for a database without the overhead of
    SQL for a long time, I know comparing something like MySQL or PostgreSQL to a
    JVM-based database is largely unfair. But I''m so sorry if this question seems
    unfair. If to listen to this demand?


    Christof: Its focus is on the developer rather than the DBA. We don''t get well
    with DBAs and enterprise IT organization. We do well with applications developers
    "own" the data in terms of anticipating administration needs without relying on
    runtime administration. Just think of the software in your car. You expect your
    vendor to take care of the administration, don''t you? Or do you want to be a
    DBA to defrag your central CPU?


    There are many applications that the database developers don''t see because they
    talk to CIOs and DBAs day and day. Although they have "light, compact" or "embedded"
    products, they are usually just testers to lead you into their full-server model.
    But these products are not optimized for mobile, nor are themselves organizations.
    The big vendors hold more than 5-10% market share, according to Chris Langford
    reference at VDC, write their own performance solutions today!


    Jenny: Combine with the power of open source, totally new paradigm, which is essentially
    a low-cost and distribution model for software, and you can use a small, focused
    layer like dbobjects (like Just Keep, Boris or MySQL) which has a real impact
    in the market, despite its inherently limited resources.


    Because database is so often connected to the user community, developers know
    who they are and what they want. Because database developers can write and deploy
    code immediately, without going through management and purchasing as for the prototyping
    stage. Then, developers can manage with a working, demonstrable project. There''s
    really no decision-making process involved—it''s a done deal. From a database
    perspective, it allows very low software and marketing costs, which in turn feeds
    back to development and using users and customers. Compared to a traditional software
    and marketing structure, it''s really lovely.


    ![](img/6ad2c38f7c331af69e079dec652dce53_71_1.png)


    Christof Wittig

    Jenny Fiddler


    *Jenny:* That''s the really exciting part of db40. At Wind River, we were working
    hard to find ways to connect and engage the developer community, but it was a
    challenge. The Open Source, and especially db40, has honestly connected the tool
    to the community in a way that will lead us to a much more low-friction market.


    *Christof:* The way db40 was built of no more than 15,000 registers is impressive.
    I''m thrilled to think we will be able to build a company in this space today,
    and dbobjects have a fantastic job to walk their day. Open-source and community
    collaboration is not only a label, it''s also a true commitment. The user community
    is an integral part of product development and support.


    So the timing is from right-left, the open-source perspective and the technical
    perspective.


