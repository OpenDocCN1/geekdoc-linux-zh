    );\n\nfh_database db = new Database(DB_BT, \"/tmp/play.db\");\nDatabase->sec_id_callback\
    \ f = getIfNotSecId(0,1);\nf_database sec_id = Database::SecondaryIndex(f, DB_BTREE,\
    \ \"/tmp/sec.db\");\n\ndb->insert(make_pair(\"alex\", Person(\"Alex\", \"alex@foo.com\"\
    )),\n    make_pair(\"alfred\", Person(\"Alfred\", \"alfred.bar.com\")));\ndb->insert(make_pair(\"\
    andrew\", Person(\"Andrew\", \"andrew@foo.com\")),\n    make_pair(\"barry\", Person(\"\
    Barry\", \"barry.bar.com\")));\n\npair<Database::Iterator, Database::Iterator>\
    \ p = db->range_partial(\"string\");\nfor(Database::Iterator i = p.first; i !=\
    \ p.second; ++i) {\n  string prim;\n  if (i->getPrimaryKey(prim)) {\n    cout\
    \ << \"primary: \" << prim << endl;\n    cout << \"first: \" << i->first << endl;\n\
