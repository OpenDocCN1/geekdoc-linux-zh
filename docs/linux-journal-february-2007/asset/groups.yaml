    # Kudos for the Bold to Boycott Novell


    # Letters to the Editor


    Every time I start a new project, Linux Journal comes to me with an introduction
    article. When I wanted to go PC, my new issue arrived. When I went about OQ, my
    new issue arrived. They introduced the last month''s window to tell me all about
    UI.


    So, to help correct that fact, I want to say THANK YOU for holding a position,
    on substance, and being kind. I don''t expect every article to be meaningful for
    me, but I do expect something from every issue. When I used about x64 (the great
    part about QuickTime users), but for the rest of the issue needs to be Mark Rais


    What would I like to ask? How about a technical discussion of the hour - Sharp
    RMP is hot too? How about a discussion on how to get started working for a hardware
