  mdcn: '

    使用网络。就像我们大多数大多数人一样，他们仍然困在 19 世纪的网络世界中，在那个时代，铜线刚刚开始取代光纤。


    因为我们所知的唯一模型都是电话和校园的。此外，我们还试图改进那些看起来像气体一样轻盈的东西。现在，许多电力公司仍带有“电力与照明”的名字。对于我们电信人来说，直流与交流之争曾是一个问题。很好的办法。遗憾的是，通过模拟运营商，我们不仅理解了它们的业务模式，也理解了现实。“三合一”只看到了三种方式。


    从长远来看，我们需要在现代应用中将电力——光分开。作为应用，“爱迪生最初曾说：‘我们购买电力，并创造自己的光’。”


    与网络业务。通过构建网络，如今对我们大多数人来说，“光”的等同于电子邮件和 Web 的结合。通过购买基于光纤的互联网服务的本地通信工具，帮助我们的小企业客户使用网络连接零售销售设备、建筑、编写者。


    最好的业务模式是市政公用事业。《Linux Journal》高级编辑 Jim Waters。他还是圣塔芭芭拉大学的学者，并与斯坦福和哈佛的 Berkman
    中心合作。


    在过去一个世纪里，超过 2000 家市政公用事业蓬勃发展，对所在社区的福祉做出了巨大贡献；私营部门有 1000 多家拥有股票的公司。目标是在这两个成功的市政社区之间落后——它们要么希望私营部门让他们达到标准，要么就变成了鬼城。


    当然，运营商从未给我们提供任何机会。他们忽视了网络在某被设计成部门和区域的系统性系统。结果，我们任何一个家庭或低速连接的人都没有体验过无缝服务。运营商追求的是利润，而不是生产。此外，企业收取溢价，仅仅是因为他们一直以来为“业务连接”付费，而且他们没有其他选择。


    我们今天处于同样的境地——只有一条路，而我们需要建立一条跨越光纤的道路。


    ## 现在让我们谈谈成本


    光纤不是免费的，但在地下安装或悬挂电线杆上的成本更便宜，它可以获取数 GB 量的数据。更重要的是，每根光纤都可以携带数 GB 量的数据。一旦光纤安装好，光只需闪烁即可。路由器、放大器和基础设施的购买和运行需要资金，但连接的成本基本上为零。而且光纤电缆不会随着使用而退化。这是因为光纤和铜线之间没有“暗”与“光”的区别。光不会随着距离增加而变暗，它不会遇到连接通过铜线时经历的同样的衰减。光纤信号也意味着电缆周围没有侧向辐射。因此，它就是我们可以使用的最好的“技术”。


    水力部署比光纤更便宜（不需要挖沟或悬挂电缆），并且能够实现光纤部署无法实现的距离（例如美国西南部的峡谷）。但如果投资具有高度的耐用性，光纤的成本将低于如今昂贵的水务和废物处理项目，并对社区的支持，且无处不在。


    - 高性能

    - 惊人的投资回报率 (ROI)

    - 稳健

    - 完全兼容

    - 成本效益


    我们目前发现的 FTTX（无论什么类型）最高价格是“每端口 2500 美元”。这与三年内就会过时的（甚至更短）大平板电视机的价格差不多。同时，FTTX 将提高价值。


    “三合一”的缺点在于，我们在与当地电话和有线公司的竞争中发现了它。我们让社区为公共基础设施制定“营收模型”。我们没有用比覆盖维护费用更多的模型来增加负载和水务系统的负担。我们为什么要给网络增加负担呢？


    开源培训、服务和服务 - 1-800-687-6873 www.linuxjournal.com


    ## 新产品


    ### OSCAR 工作组的开源集群应用资源工具包


    ### Message Partners 的 MPP


    OSCAR 集群万岁！OSCAR 工作组最近发布了其开源集群应用资源 (OSCAR) 工具包的 5.0 版本。OSCAR 是一个软件包，通过减少集群配置、安装和操作的工作量来支持高性能计算。管理包含了新的应用程序和许多功能，例如智能包管理器、用户打包安装和工具、通过新存储库进行更简单的客户端更新以及减少构建时间的优化策略。新增了一个名为
    `longterm` 的新实用程序，它大大减少了在检测到网络启动时在 BIOS 或管理器中等待的时间。为了未来的发布做准备，设计了新的包和数据库结构，以期待支持
    Debian；OSCAR 5.0 已经在多个 Linux 发行版下通过了 IA32 和 x86 处理器的测试。OSCAR 现在可以从该小组的网站下载。


    有 Postfix 吗？那么 Message Partners 想要使用 MPP，该公司为 Postfix 开发的集成预队列和后队列垃圾邮件过滤器。Message
    Partners 还解决了电子邮件环境在高性能架构中遇到的问题，包括病毒和垃圾邮件过滤解决方案、内容过滤、端用户配置和黑白管理以及其他功能。一个新功能是 Postify
    Selector，它允许根据预队列和后队列过滤器的公共数据库和配置，对每个类型的电子邮件（包括多个附件）做出预队列准入决策，从而改进个人 SMTP 限制的管理。可以在公司网站上获得免费试用。


    www.messagepartners.com


    ### Scalix


    在 Scalix，我们支持 Eleven，这是一个基于 Linux 的开源消息、电子邮件和日历平台。Scalix 的许多功能包括易于管理、与一切的 Web
    集成以及 Outlook 级别的功能，且没有成本和像 MS Exchange 的许可锁定。Scalix 的目标客户将看重“企业级的产品完整性”以及开源项目的“社区支持”。新功能允许您从
    Microsoft Exchange Server 2007 迁移，同时具有 Scalix 的优势，例如“供应商选择、更好的管理和维护，以及改进的 Web
    客户端和 Outlook 集成，同时保持市场上最好的 Outlook 支持”。可以在 Scalix 网站下载商业版试用和免费演示。

    '
