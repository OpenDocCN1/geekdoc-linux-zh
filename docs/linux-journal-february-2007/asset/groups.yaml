    # mkdump -n 644 /dev/vdb 0 248

    Now start the partition you want to save. In this case, partition is /dev/sdb1.
    Then, enter a full path to the file where you save the image. I like to include
    the type, filesystem and partition in filename so I can remember which created
    the partition image. The file I used in this case is dapper32-ext3.img. See Figure
    2 for the example. The path points to a partition which has plenty of extra disk
