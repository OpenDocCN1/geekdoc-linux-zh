    \ a JetFlash F10, and with TrueDisk Flash Voyager. The JetFlash has a serial,\
    \ the Corsair does not.\n\nPlug your thumbdrive in, and cat /proc/sys/usb-storage/*..\
    \ should find an entry for it similar to this:\n\n```\nHost scsi: usb-storage\n\
    Vendor: Unknown\nProduct: USB Mass Storage Device\nSerial Number: 8a5ab1c2fc96492\n\
    bandSize: Bulk\nQuirks:\n```\n\nIf you have a serial number, skip forward to the\
    \ \"Writing the Rule\" section. If you do not, use the Serial Number field instead.\
    \ To identify the device using udev, follow these steps:\n\n- 1) Look at device's\
    \ output. Typical output is:\n\n```\nusb-storage: waiting for device to settle\n\
    Vendor: Model: True Flash Voyager  Rev: 1.00\nANSI SCSI scsi device: 203816c6\
    \ 512-bit block dev (1048 MB)\n...\nsde: adding device create: through host\n\
    sde: sde\nAttached scsi removable disk to scsi1,channel 0, id 0, lun 0, type 0\n\
    ```\n- 2) Now,\n\nThis tells you udev sees the device.\n\n`udevadm info $p -udevinfo\
    \ -n /dev*` and examine the output. Look for these:\n\n```\nSUBSY=\"scsi\"\nSYSFS(model)=\"\
    Flash Voyager\"\nSYSFS(vendor)=\"Corsair\"\n```\n\n## udev\n\nThis has scratched\
    \ only the surface of the what that you can do with udev rules. Any other of hot-plug\
    \ event can trigger a rule. For example, you can write rules to move thumbrives\
    \ automatically, copy pictures of a camera or set a network link. udev's rules\
    \ provide plenty of flexibility, including print-wild cards and the ability to\
    \ set permissions.\n\nThe best overview for using udev rules is David Drake's\
    \ \"udev Rules\", which can be found at https://www.reactivated.com/writing_udev_rules.html.\n\
    \n## Writing the Rule\n\nNow, with either the serial number or the model/combo\
    \ value, you can write the rule. The rule creates a symlink for the device in\
    \ the /dev device, for example, /dev/corsair_drive, and then links it to /usr/local/bin/backup-drive.\n\
    \nBecome root (-), and create a text file in /etc/udev.rules.d/95-backups. You\
    \ can use a number other than 95, but keep mind that your dudes processes in alphanumeric\
    \ order, and it's better to have local processes listed.\n\nIf you have a serial\
    \ number, type a rule like this (all on one line) into the file, and save it:\n\
    \n```\nBUS=\"usb\"; SYSFS(serial)=\"B8a5b1f2c9492\"; SYMLINK=\"jet_drive\"\nRUN=/user/local/bin/backup-thumb.sh\
    \ jet_drive\n```\n\nIf you're using model identification, your rule would look\
    \ like this:\n\n```\nBUS=\"scsi\"; SYSFS(vendor)=\"Corsair\"; SYSFS(model)=\"\
    Flash Voyager\"\nSYMLINK=\"corsair\"; RUN=/user/local/bin/backup-thumb.sh corsair\n\
    ```\n\nNote that you can use any SYSFS entries that you need to identify your\
    \ drive. Your rule now fires every time you plug in your thumbdrive.\n\nNote:\
    \ If you have other rules for a device, udev executes the rules in sequence from\
    \ top to bottom.\n\n## Set up the Backup Script\n\nbackup-thumb.sh is the engine\
    \ that backs up your thumbdrive. It takes the name of the device (the SYMLINK)\
    \ as its argument. Everything else is configured in the CONFIG file. Your backup\
    \ script is shown below:\n\n- BACKUP_DIR: where you want the backups to go.\n\
    - GENERATIONS: how many backups to keep. Backups are numbered 0 (most recent)\
    \ to N (oldest). Keep in mind that you need to have enough space for many backups,\
    \ and GENERATIONS will consume space.\n- BACKUP_ONCE_DAY: if you plug and unplug\
    \ your thumbdrive multiple times, backup-thumb.sh uses this tag so that it runs\
    \ once per day. If you want it to run every time you plug in, set BACKUP_ONCE_DAY\
    \ to 0.\n- SOUND: if you've chosen a sound from KDE distribution, then WAV file\
    \ will work. You can easily modify the script to play an alert instead of MP3\
    \ file for completion.\n\n## How It Works\n\nbackup-thumb.sh sleeps for seconds\
    \ on startup, it must wait for the thumbdrive to finish. If the thumbdrive is\
    \ ready, you'll see a \"waiting for device set\" message when this appears. Ten\
    \ seconds should be sufficient for older machines. Next, the backup needs permissions\
    \ so that only you can make backups. Otherwise, no person could copy your backup\
    \ to a different machine and mount it. The script executes a simple (bit-for-bit)\
    \ copy of your thumbdrive. This checks whether the device is encrypted or not.\
    \ When it's finished, it plays a noise you hear on your computer's speakers. On\
    \ USB 2.0 port, backing up thumbdrive takes about one minute. From Fedora to Knix,\
    \ these are the latest resources you'll need to succeed.\n\n## To Recover\n\n\
    If you lose your thumbdrive and want to restore your thumbdrive to its replacement,\
    \ simply dd the backup image to the new thumbdrive:\n\n```\ndd if=corsair_drive.backup.0\
    \ of=/dev/corsair_drive\n```\n\nOr, if you want to grab only some files from the\
    \ backup, do this:\n\n```\nmkdir /mt/thumb\nmount -o loop corsair_drive.backup.0\
    \ /mt/thumb\n```\n\nYou can now copy files from /mt/thumb. If you are using TrueCrypt\
    \ to encrypt your thumbdrive, you can mount the backup image in the same way:\n\
    \n```\ntruecrypt corsair_drive.backup.0 /mt/thumb\n```\n\nThat's as basic as we\
    \ make thumbbricks. If you're too lazy to plug your drive and come back when it\
    \ comes...well, stay away from laundromat! Andrew Fabio has an Oracle DBA, he\
    \ still works at home and welcomes your comments sent to andrewfabro.org.\n\n\
    ```bash\n# main program\n\n# wait for device to settle\nsleep 10\n\n# make sure\
    \ no one is able to copy our backups\nchmod 0777\n# check the directory\nDEVICE=$1\n\
    if [ ! -d $BACKUP_DIR ]; then\n  mkdir -p $BACKUP_DIR\nfi\n\n# backup only once\
    \ per day\nif [ $BACKUP_ONCE_DAY -gt 0 ]; then\n  TODAY=$BACKUP_DIR/$DEVICE.device_today\n\
    \  find $BACKUP_DIR -name $DEVICE.backup $DEVICE.device_today -a -mtime +1 -delete\n\
    \  if [ -f $TODAY ]; then\n    exit\n  fi\n  touch $TODAY\nfi\n\n# rotate backups\n\
    cd $BACKUP_DIR\nlet GENERATIONS=$1\nwhile [ $GENERATIONS -ge 1 ]; do\n  let NEWFILE=$DEVICE.backup\
    \ $GENERATIONS\n  if [ -f $DEVICE.backup $GENERATIONS ]; then\n    mv $DEVICE.backup\
    \ $GENERATIONS $NEWFILE\n  fi\n  let GENERATIONS=$GENERATIONS-1\ndone\n\n# do\
    \ the backup\ndd if=$DEVICE of=$($BACKUP_DIR)/($DEVICE).backup.0 /dev/null 2>&1\n\
    # notify us that it's done\naplay $($SOUND) > /dev/null 2>&1\n```\n\n### Listing\
    \ 1. Backup Script\n\n```bash\n#!/bin/bash\n\n# Backup script from Linux Journal\n\
    \n####################\n# CONFIG section\n\n# where you want the backups to be\
    \ kept\nBACKUP_DIR=/thumb\n\n# how many old backups to keep\nGENERATIONS=7\n\n\
    # backup only once a day\n# set to 0 if you want a backup every time\n# insert\
    \ your thumbdrive\nBACKUP_ONCE_DAY=1\n\n# completion sound when backup is done\n\
    SOUND=/usr/share/sounds/XDE_Beep.Clock.wav\n\n# END CONFIG\n####################\n\
    ```\n"
