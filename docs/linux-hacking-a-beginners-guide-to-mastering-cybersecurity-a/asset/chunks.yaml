    ## Chapter 1: basic and advanced linux concepts


    Linux developed linux in 1970 because an open source operating system, modified
    by many users. It is possible to create different variations. Linux has different
    variations commonly referred to distributions used by several computers. Primary
    and advanced concepts that users must be familiar before starting the installation
    process. Basic concepts include:


    - `pwd`: users are supposed to get certain paths whenever terminals opened. `pwd`
    is used to know the path of the directory. It is effective because it reveals
    the current path and gets users in the right way. Moreover, it highlights the
    whole path where users present. `pwd` stands for the represented directory. It
    makes work easy by giving the absolute path which comprises the root, the basis
    of the linux file system.


    - `cd`: this concept is used to move to a certain directory. It is helpful because
    it gives directions and saves time. For example, if you have a project folder
    and want to go to the home folder, `cd` becomes handy. All you have to do is to
    write the home name, and you will be taken to that particular folder.


    - `ls`: this concept is and initial for a list. Its work is to list all directories
    and files that are in a certain directory. One can be used alongside other combinations
    to get results. It helps to get hidden and hard to get files. It also helps to
    get recent files in directory.


    - `touch`: this concept is used to create a file on any path. It has no restrictions,
    and the file can be anything. One can create an empty, text file, or zip file.


    - `sudo`: this concept is widely used in linux. Users employ it to perform any
    task and get administrative privileges. It is preferred by many because it makes
    work easy and gives them access to services reserved for some people. `sudo` stands
    for superuser do.

