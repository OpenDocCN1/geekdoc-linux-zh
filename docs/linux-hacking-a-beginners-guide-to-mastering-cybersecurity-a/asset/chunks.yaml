    # Bash Command Tricks and Shortcuts


    Many users press the up arrow, scrolling down and hitting up to redo the command.
    However, this is unnecessary work and there is easier way of doing things. Instead
    running the command by typing: `sudo!!` and bash will run it and previous commands.
    It looks like this when you run the sequence:


    ```bash

    mkdir /etc/asp

    permission denied

    ```

    It can also look like this: `sudo mkdir /etc/asp/ft`. When you key `!!`, the full
    command is derived from the terminal and informs you what was executed.


    Another trick is to use the `!` shortcut, which informs bash that you want to
    repeat the arguments from the previous command to the current one. It becomes
    in handy for commands with several arguments you want to repeat. To make work
    easy, created some files and changed the permission on them. It is easy to change
    the permission on the files and becomes difficult only in some instances. You
    can search your history by pressing `Ctrl+R`, and it will pop up the good thing
    about bash that it does reverse search on your history and when results appeared
    immediately you start typing.


    When running a shell, keep in mind that it is running inside the predefined destination
    in your file system. The system has a directory where the shell starts out. If
    you get lost, run the `pwd` command to check which folder you are in. We used
    `cd` command to change directories, which is followed by a valid destination directory.
    To run a program, type the name of the program and press enter. It will open fast
    and make you think you clicked on the gui.


