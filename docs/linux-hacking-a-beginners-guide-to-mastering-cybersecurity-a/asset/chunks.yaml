    # Kali Linux 简介


    有些人更倾向于安装经过加密的 Kali Linux。在某些情况下，我们拥有不希望他人访问的敏感数据，我们愿意花费额外的时间来保护数据，这就是加密版 Linux
    发挥用场的地方。得益于 Kali，你现在可以在 USB 驱动器或硬盘上安装并加密 LVM。如果你对其中一种不熟悉，可以使用另一种。这样做的好处是，其安装过程与普通的
    Kali Linux 安装相似。


    唯一的区别在于安装时需要选择并加密 LVM 分区。对于加密版的 Kali Linux 安装，你需要兼容的计算机硬件。其要求与普通的 Kali Linux 安装相似。一旦你设置好准备工作，下载了
    Kali Linux 并将其刻录到 USB 驱动器，然后将计算机设置为从 CD/USB 启动。安装过程非常相似，仅在于你现在处理的是 LVM 加密的 Kali
    Linux 安装。在开始之前，你需要安装介质。


    最好使用 USB 闪盘，并从下载的 Kali 页面选择镜像制作，确保你已经清空了驱动器。需要注意的是，写入可能需要一些时间，因此在整个过程中你需要保持耐心。一旦你将
    USB 闪盘插入要安装 Kali 的计算机并启动它，选择该 USB 驱动器作为启动设备。安装 Kali Linux 并非易事，但如果你熟悉 Debian，应该很容易发现这并没有太大问题。配置好驱动器后，Kali
    将启动安装过程。如果你是 Debian 用户，某些地方可能看起来不同，但安装过程并不漫长。完成后，系统会提示你接下来的该做什么。


    ## 为什么你应该安装 Kali Linux？


    有几个理由说明你应该安装 Kali Linux。与其他软件不同，它是免费的。


    它还有更多工具可供选择，用户可以自由权衡方案。它还支持多语言，使用户可以使用母语进行操作。虽然渗透工具是用英语编写的，但用户发现使用自己熟悉的语言可以更方便地定位并随时使用工具。Kali
    Linux 是可定制的。开发者现在知道没有人会完全接受他们的人的设计，因此允许人们根据自己的喜好定制 Kali。Kali 也很有吸引力，因为它自带了用于获取网络安全的工具。它处理安全相关的领域，例如攻击监控、捕获和导出文件以进行广泛分析。这是通过使用第三方工具、测试检查漏洞、攻击伪造访问点、身份验证和重放攻击来实现的。


    这些工具的设计支持强大的脚本化。随 Kali Linux 一同的另一个工具是 `nmap`。这是一种用于安全审计和网络发现的开源网络映射工具。它采用原始扫描器来发现网络上可用的主机以及它们提供的服务类型。它还会根据可用主机判断操作系统。`nmap`
    也用于进行网络资产盘点和主机监控。当你需要强制破解身份验证服务时，这种方法非常有效。它还用于对 telnet、SMB、HTTP 和 FTP 进行快速字典攻击。你也可以用它来破解
    Web 扫描器或数据包制作工具。它也可以以类似的方式使用，用于扫描计算机漏洞。


    ## 安装后操作


    在安装 Kali Linux 之后，你需要做一些工作。虽然 Kali Linux 非常高效，但它并不具备运行日常渗透测试的所有要素。你可以采用一些技巧并安装
    `nmap`，这是一种用于安全审计和网络发现的开源网络映射工具。它采用原始扫描器来发现网络上可用的主机以及它们提供的服务类型。它还会根据可用主机判断操作系统。`nmap`
    也用于进行网络资产盘点和主机监控。当你需要强制破解身份验证服务时，这种方法非常有效。它还用于对 telnet、SMB、HTTP 和 FTP 进行快速字典攻击。你也可以用它来破解
    Web 扫描器或数据包制作工具。它也可以以类似的方式使用，用于扫描计算机漏洞。


