    格式是 Python 的首要概念，与其他脚本语言不同，它非常重要。Python 解释器通过格式来确定代码是如何分组的。一致性比细节更重要。


    ### Python 中的格式

    例如，如果你有一组代码想要从`双倍缩进`开始，那么一致性对于 Python 识别这些代码是否属于同一组至关重要。在其他格式化语言中，格式是可选的，但在 Python
    中是必须的。与任何其他脚本和编程语言一样，Python 可以添加注释。


    添加注释是非常重要的，这可以告诉阅读者你正在讨论的内容。注释由解释代码目的的句子或单词组成。虽然注释不是必不可少的，但当你以后回来，无法确切想起该脚本在谈论什么时，它们会有很大帮助。解释器不会看到注释，带有注释的行会被跳过，直到遇到一行需要执行的代码。


    与其他语言类似，`#` 被用于开始行注释。Python 的另一个重要概念是模块（modules）。Python 允许用户将代码代码分组在模块中。如果你想使用某个模块，必须导入它。模块是赋予
    Python 所有强大功能的重要特性。它们构成了 Python 脚本语言的基础。此外还有字面量常量（literal constants），用户需要它们来获取字面值。


    ### 道德黑客

    道德黑客有编写脚本的习惯，最近许多人选择 Python 作为此类任务的语言。Python 被用于道德黑客的原因有很多。黑客始于许多年前，并在铁路俱乐部诞生。年来，黑客技术不断演变，包含了在暗网中穿梭的复杂工具和技巧。随着越来越多的人意识到数据隐私和数据保护，入侵系统已变得棘手。


