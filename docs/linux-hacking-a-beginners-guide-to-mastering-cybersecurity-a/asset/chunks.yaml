    # Bash 命令技巧与快捷键


    许多用户会按下向上方向键，向下滚动后再按向上键来重新执行命令。然而，这是多余的工作，其实有更简单的方法。你可以通过输入：`sudo!!` 来运行命令，bash
    将运行该命令以及上一个命令。当你运行该序列时，它看起来如下：


    ```bash

    mkdir /etc/asp

    permission denied

    ```

    它也可能像这样：`sudo mkdir /etc/asp/ft`。当你输入 `!!` 时，终端会派生出完整的命令并告知你执行了什么。


    另一个技巧是使用 `!` 快捷键，它告诉 bash 你想将上一个命令的参数重复到当前命令中。这对于带有多个需要重复的参数的命令来说变得非常方便。为了方便操作，创建了一些文件并更改了它们的权限。更改文件权限很容易，只有在某些情况下才会变得困难。你可以通过按下
    `Ctrl+R` 搜索历史记录，这会弹出 Bash 的一项棒功能：对你的历史记录进行反向搜索，当结果立即出现时，你开始输入即可。


    运行 shell 时，请记住它是在你文件系统中预定义的目录内运行的。系统有一个 shell 启动的目录。如果你迷路了，运行 `pwd` 命令检查你所在的文件夹。我们使用
    `cd` 命令更改目录，后面跟着一个有效的目标目录。要运行程序，输入程序名称并按回车。它会打开得很快，让你觉得自己点击了 GUI（图形界面）。


    每一位黑客都应该努力学习如何使用编程语言来提高自己的技能。虽然使用可用资源也可以，但你应该成长并开发更好的工具来帮助你纵横网络世界，因为你最清楚自己想要什么，你有能力获取实用的工具来帮助你实现目标。技术以难以想象的方式改变了世界。每天都有新的黑客手段被开发出来，黑客从未停歇。如果你继续使用旧工具，你永远无法达到黑客们发展的水平。你要意识到，改进后的安全系统虽然不会停止攻击，但可以将追溯到你身上。


    在黑暗中穿行的另一个技巧是使用更新的工具。黑客数量大幅增加，每位黑客都必须了解当前的工具，以便在黑客游戏中保持竞争力并变得更加强大；了解人们过去使用的工具能让你保持领先。互联网是你的朋友，不必措手不及。此外，有些人提供了关于如何使用此类工具的廉价培训。对于理解原理并保持信息灵通的人来说，黑客不会在终点的开始时就认为自己无所不知。虽然你不能信任任何人，有志的黑客如果没有基本的脚本技能将无法走远。缺乏此类技能将限制你只能使用他人开发的工具，这降低了你被杀毒软件发现的概率。公司知道黑客攻击正在上升，它们已经采取了安全措施来保护自己。入侵检测系统在发生入侵时提醒公司。这就是为什么学习
    Python 脚本技能很重要。拥有这些技能将你提升为专业黑客，增加成功的机会并将风险降至最低。


    事实上，它消除了风险！Python 的某些特性使其对于黑客攻击非常重要。它自带了功能强大的内置库。你应该考虑添加 Python 模块，因为它们提供了各种功能，如
    `math` 模块、异常处理，还提供了加密服务。尽管拥有 Python 有许多优势，你仍然需要第三方模块。Python 拥有大量的第三方模块，这就是为什么黑客选择它进行脚本编写。如果你需要安装第三方模块，可以下载、解压并运行
    Python 安装命令。


    ```bash

    tar -xf python-nmap-0.2.gz

    ```

    之后，切换目录到新目录：


    ```bash

    cd python-nmap-03

    ```


    现在你已经熟悉了如何在 Python 中安装模块，输入：


    ```bash

    python setup.py install

    ```


    '
