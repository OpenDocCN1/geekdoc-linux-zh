    This help helped you understand the concept of encryption, let us use an example:
    suppose a person sends a text to a friend who stays in a public platform. however,
    someone named Ed hacks the security of the communication and redirects the message
    to him. this is where cryptography becomes in the user uses a key to encrypt the
    message and sends, but this time Ed cannot decode the message because it is encrypted.
    the receiver will be given a decryption key to use once he receives the message.
    if Ed manages to hack the system midway and changes the message, he will get error
    information when he attempts to decrypt it. in this way, he will know that the
    message was intercepted and is unreliable. people who do not encrypt messages
    faced the risk of getting the wrong message and never knowing about it.


    Cryptography is used to protect the integrity and authenticity of messages. the
    idea of having electronic keys in communication network is to ensure that the
    recipient gets the right message without interference. through the help of secured
    systems, the recipient can decode the message using cryptographic keys and algorithms.
    anytime communication takes place over an electronic network; there is always
    a risk of interference. hence, people took security measures via cryptography
    to overcome risks. there were important elements that created the platform for
    cryptography, including authentication, privacy, non-repudiation, and integrity.
    there were also different cryptographic algorithms and keys to suit the needs
    of users. cryptography plays a crucial role in securing information and the image
    of a company.


    Cryptography is used by big companies like Uber, Lego, and eBay. this is because
    security threats have increased in the last few years and customers felt safe
    using services that prioritized their safety. when a company goes the extra mile
    to protect its customers, it boosts customers’ confidence and the brand. on the
    other hand, some firms cared less about customer safety and did not want to incur
    extra expenses. in today''s society, customers were well informed and opted for
    brands that cared about their welfare. firms started hiring security specialists
    to educate them on cryptography and its application. cryptography has employment
    opportunities for professionals. however, it takes time and commitment to learn
    how it works. patient and committed individuals had easy time understanding and
    encrypting messages.


    There were different aspects of security and applications that users should know
    about. they changed from secured commerce to protecting health information. cryptography
    is an essential aspect of securing information. however, it is not enough to guarantee
    security. it started with encryption, commonly known as plaintext. encrypted data
    which was decrypted to plaintext. cryptography method used determines the encryption
    and decryption processes. cryptography linked to the development of mathematical
    algorithms used to encrypt messages.


