    这被称为代码注入，只不过攻击者向网站注入恶意代码，并在每当受害者访问该网站时执行这些恶意的客户端脚本。要让你在受害者的网页中运行恶意脚本，你必须找到一种向该浏览器注入代码的方法。你需要跟踪受害者，并找到他经常访问的网站。了解受害者经常访问的地方可以使黑客获取其
    cookie，并使他们能够发送 HTTP 请求。


    人们通过 DNS 欺骗来黑入系统。使用这种方法，黑客成功地将流量从合法服务器重定向到恶意服务器。这导致毫无防备的用户进入恶意网页。为了让黑客能够伪造 DNS，他会将损坏的域名数据引入
    DNS 缓存。然后，他确定 DNS 请求的去向并窃取敏感信息。在获取所需信息后，攻击者会重定向流量。黑客喜欢这种方法，因为它允许他们将流量从合法浏览器重定向到恶意浏览器。


    为了获得对系统的未经授权访问，黑客可以实施点击劫持。这是指攻击者通过在可点击的内容下隐藏超链接来操纵用户的点击。这种策略允许黑客欺骗页面用户在不知情的情况下点击链接。在这种情况下，黑客主要关心的不是黑入，而是让用户点击网页。点击劫持是通过将超链接隐藏在用户会被诱导点击的内容之下实现的。例如，攻击者可以放置并吸引一个广告，促使上网用户点击链接。


    它也可以是一个社交分享按钮，如果是恶意的，攻击者会将用户发送到另一个网站，在另一个那里执行不同的攻击。Google 攻击（Googled hacking）是黑客获取网页访问权限的另一种方法。即黑客通过
    Google 等搜索引擎寻找敏感信息或受害者。这是他们轻松寻找目标的一种简单方法。基于查询的 Google 攻击允许人们识别有关目标页面的敏感信息。Google
    锁定查询并没有阻止黑客找到用于破解网站的工具。黑入系统的另一种极佳方法是使用恶意软件破坏计算机。他们将使用伪装的文件欺骗受害者下载并安装。例如，黑客常用的恶意软件会随用户信任的其他邮件一同引入。下载后，他们会观察后门控制器以获取系统的访问权限。


    黑客还利用链接来轻松黑入系统。这是一种用于黑入 Linux 服务器的方法。这是一个广为人知且经常使用的快捷方法。攻击者使用链接访问根目录。这使得即使用户对服务器的访问受限，黑入也成为可能。这种方法的工作原理是在权限受限目录与目标目录之间创建一个链接。例如，在访问权限受限的情况下，通过链接轻松地访问服务器。


    一旦他获取了根服务器的访问权限，更改文件和插入恶意代码就变得容易。攻击者可以决定暴露隐藏的数据。任意代码执行是另一种黑入系统的极佳方法。这种技术涉及在目标计算机上执行命令。一旦受害者的计算机与攻击者的机器分离，执行的代码就被认为已经发生。这是通过接管程序的指令指针实现的，该指针指向下一行要处理的代码。


    恶意软件感染可以被用于执行任意代码执行。或者，攻击者可以使用伪造的无线接入点来渗透系统。如果受害者没有注意到，他们可能会注意到开启的 Google 攻击数量。这是黑客利用伪造无线接入点让用户输入密码的一种简单方法。要让你在受害者的网页中运行恶意脚本，你必须找到一种向该浏览器注入代码的方法。你需要跟踪受害者，并找到他经常访问的网站。了解受害者经常访问的地方可以使黑客获取其
    cookie，并使他们能够发送 HTTP 请求。

