- fmt: "\n# Terminal and Shell\n\nIf you ever wanted to access to the cloud server,\
    \ you must use either a terminal shell. It enables users to carry out commands\
    \ within minutes. Moreover, administrative tasks can be done alone through the\
    \ terminal. It facilitates packaged installation, file manipulation, and user\
    \ management. Owners are not not to worry about poor usage because they can monitor\
    \ and track users. It is also interactive, and users only need to specify commands\
    \ in order for it to run. Once the user types and presses enter, it executes the\
    \ command.\n\n## Navigation\n\nAll Linux filesystems are categorized in a directory\
    \ tree. It allows users to create directories inside other directories and gives\
    \ them easy access. This means that files can be in any directory. `pwd` helps\
    \ users to see which directory they are in. For example, `pwd` can create `/home/foo`,\
    \ which means that the current directory is `foo`. The user can also create a\
    \ new directory in the current working directory. For instance, to create a directory\
    \ root: `mkdir root`, then `rmdir root` if it is no longer useful. The user will\
    \ only delete empty directories.\n\n## File Manipulation\n\nAnother basic Linux\
    \ concept is file manipulation is impossible to use files with (changed directory).\
    \ We can only view files. For example, if we have a file `biz` in our current\
    \ directory, `cat biz` translates to cat. It prints the information of `biz` to\
    \ the terminal. It is impossible to read content in the log files. The output\
    \ can be paginated into less to facilitate the printout of the contents of `biz`.\
    \ It will be done line at a time from the beginning of the file. Spacebar can\
    \ be used to advance page. Alternatively, arrow keys can be employed to move up\
    \ and down the line. You can press `Ctrl+L` to remove less. The user can create\
    \ a new file called `foobiz` by using `touch bar`.\n\n## Copying\n\n`cp` is another\
    \ concept that plays an integral role in Linux. It is used to copy files from\
    \ one directory to another. We can only copy files. For example, if we have a\
    \ file `biz` in our current directory, `cat biz biz` prints the copy of `biz`\
    \ to the terminal. It is impossible to read content in the log files. The output\
    \ can be paginated into less to facilitate the printout of the contents of `biz`.\
    \ It will be done line at a time from the beginning of the file. Spacebar can\
