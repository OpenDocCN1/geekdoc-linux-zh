  trans: '

    # Overview of Cryptography


    Cryptography includes public-key encryption and symmetric encryption. Symmetric
    encryption is typically used for purposes such as authentication. Hash functions
    are used to ensure the integrity of messages. They utilize mathematical algorithms
    to encrypt messages; for example, `SHA-1` is one instance. Hash algorithms are
    also widely used in public-key encryption. One of the most important advancements
    in the field of cryptography is the Diffie-Hellman protocol, described a professor
    at Stanford University who first described public-key encryption. This relies
    on the availability of keys, that is, you possess a key.


    ## Principles of Public-Key Encryption


    Public-key encryption uses principles based on multiplication and factorization.
    For example, if you have two prime numbers (such as `5` and `7`) and calculate
    their product to get `35`, you now want to derive those two prime numbers. Suppose
    you have the number `35` and want to know these primes; you will eventually get
    these numbers, but it may take much longer to obtain the derived values. The problem
    is scaled: if we used two 200-bit primes, their product would be 400 bits long.
    While this example seems insignificant, it represents the key pairs used in public-key
    encryption.


    General public-key encryption uses a pair of linked keys, but the keys are not
    always interchangeable. One key does not need to know the other. One key is used
    to encrypt plaintext, while the other is used for decryption. This does not depend
    on which key is used, because both keys are necessary for it to work.


    In public-key encryption, the public key is considered public, and the owner can
    see it. However, if they want to obtain the other key, the private key remains
    private. For example, if you want to send a message, you use the recipient''s
    public key to encrypt certain information, and the recipient will use their private
    key to decrypt the message. This technology is based on using the recipient''s
    private key to determine the information, allowing the message to be decrypted.
    Messages encrypted with a public key cannot be decrypted unless one possesses
    the private key.


    ## Symmetric Encryption


    Another method is symmetric encryption. It uses a fixed-length hash, making the
    recovery of plaintext difficult. Furthermore, hash algorithms are used to obtain
    a digital fingerprint of a file to ensure its integrity. If the file is altered,
    the recipient will calculate another hash value; if they are equal, it indicates
    the system is secure.


    Therefore, this ensures security and integrity. Symmetric encryption is irreversible.


    Commonly used hash algorithms today include `MD5` and `MD4`. Extended hash algorithms
    are applied to various areas of information security, such as hash values in hash
    libraries based on fixed-length hashes. Considering window input, a file of 1-10
    bytes might be calculated. The hash library sets up hash values corresponding
    to files, ensuring that passwords may be encrypted within files. Through in-depth
    research and standards, hash values represent similar input values.


    These three encryption technologies are important for decoupling reasons. Each
    technology is optimized for specific cryptographic applications. For instance,
    hash algorithms are ideal for ensuring data integrity because any change in content
    will require the recipient to recalculate the hash value, while the sender encrypting
    the same message would produce a different hash; the hash function ensures data
    integrity. Key encryption is perfect for encrypted messages because it provides
    message confidentiality and privacy. Encryption keys used in encryption systems
    are themselves encrypted. In some encryption systems, keys can be discovered from
    known encrypted files, which might be overlooked in malware investigations.

    '
