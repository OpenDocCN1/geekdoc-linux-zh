  trans: '

    Bash 是 Linux 发行版中的默认终端并被广泛使用。然而，与 Python 相比，它的启动时间较长。Bash 也不兼容 zsh 和 sh 等所有 shell。与
    Python 相比，它缺乏好用的实用程序和调试工具。它还缺乏各种函数、多线程和数据结构。另一方面，Python 在处理任何任务时表现普遍良好，且语法简单。它拥有改进后的调试工具，使其成为开发复杂软件应用程序的理想选择。


    许多人更倾向于使用图形界面而不是命令行。然而，这是一个错误方法，因为图形用户界面倾向于展示人们认为软件应该做什么的功能，但事实并非总是如此。


    在 Windows 上进行编程会导致恶意软件和病毒引起严重问题，这与事实大不符。因此，那些使用命令行界面的人认为他们所做的是正确的。而在其他时候，你会因为一个简单的图形错误而卡住或电脑死机。在命令行界面上工作更好，因为它速度快，而且你清楚自己在处理什么。


    然而，并不是每个人都喜欢编写程序和使用 shell。除了编写程序之外，使用某些软件比使用图形界面还要糟糕。Shell 脚本使用非常优雅，允许你传输文件的输出。Shell
    脚本相当简单，但 Python 更加强大。它的优势在于流文本编辑器的 sed 命令。你可以结合 shell 脚本和 Python 脚本来创建并执行命令链。有些人认为认为
    Python 可以替代 Bash shell。Bash 和 Python 都是通用型语言，它们各有优缺点。


    Bash 是 Linux 发行版中的默认终端，在性能方面它被广泛使用。然而，这并不能取代 Python。在处理大型程序时，情况会变得复杂，而且，Python
    是一门面向对象的语言，你必须了解它们之间的区别。在寻找优雅的脚本语言时，Python 是其中之一。然而，Bash 则不那么理想化。在处理文件、存储输入和克隆磁盘时，Bash
    具有用于无缝脚本的良好命令。无论你的系统变得多么混乱，它都提供了另一种现实：命令行界面提供了一种与计算机交互的直接方式，并让你从不断拖拽和点击那些假设基于文本命令的小框中解脱。这些应用程序缺乏图形界面且并不重要。相反，使用命令行界面与这些实用程序进行交互。你应该出于解耦的原因关注功能。首先，它能让你洞察系统是如何运作的。此外，某些路由任务只能通过命令行提示符完成。还有一些可以在日常自动化任务中使用的关键工具。你需要安装
    Bash shell 以便于顺畅的黑客操作。年来，随着 Linux 和 macOS 内置了命令行，Bash 变得越来越流行。


    它目前作为内置功能在 Windows 10 版本中提供。命令行 shell 是操作系统的一部分，这种想法很有吸引力。另一些人认为它被集成到了计算机中，而没有意识到它只是一个程序。shell
    的运行方式使得用户从特定位置输入命令，你将获得类似的结果。你可以使用 shell 脚本通过顺序单独组织命令。Bash 包含许多功能。


    为了增加成功的机会，请为你的 shell 启用 `append` 选项。通过运行命令 `sd append` 可以轻松启用此选项。这样做可以方便多个终端会话快速写入历史。你会发现大多数环境中没有启用此选项，这会导致打开会话时丢失历史记录。或者，你可以使用
    sudo 重复上一条命令。

    '
