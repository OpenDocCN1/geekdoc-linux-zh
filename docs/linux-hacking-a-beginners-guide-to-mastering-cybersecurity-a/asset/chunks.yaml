    # 终端与 Shell


    如果你想访问云服务器，必须使用终端 壳（terminal shell）。它允许用户在几分钟内执行命令。此外，管理任务也可以通过终端独立完成。它方便了软件包的安装、文件操作和用户管理。所有者无需担心使用不当的问题，因为他们可以监控和跟踪用户。它还具有交互性，用户只需指定命令即可运行。一旦用户输入并按下回车键，命令就会执行。


    ## 导航


    所有的 Linux 文件系统都归类在一个目录树结构中。它允许用户在其他目录内部创建目录，并方便他们轻松访问。这意味着文件可以位于任何目录中。`pwd` 帮助用户查看当前所在的目录。例如，`pwd`
    可以显示 `/home/foo`，这意味着当前目录是 `foo`。用户还可以在当前工作目录中创建一个新目录。例如，要创建一个根目录：`mkdir root`，如果它不再需要，则执行
    `rmdir root`。用户只会删除空目录。


    ## 文件操作


    另一个基础 Linux 概念是文件操作，即无法使用文件（更改目录）。我们只能查看文件。例如，如果我们当前目录下有一个文件 `biz`，`cat biz` 相当于
    cat。它会将 `biz` 的信息打印到终端。无法直接在日志文件中读取内容。输出可以分页到 `less` 中，以便于打印 `biz` 的内容。它将从文件开始逐行处理。空格键可用于翻页。或者，可以使用方向键向上或向下移动。你可以按
    `Ctrl+L` 退出 `less`。用户可以使用 `touch bar` 创建一个名为 `foobiz` 的新文件。


    ## 复制


    `cp` 是 Linux 中另一个起着重要作用的概念。它用于将文件从一个目录复制到另一个目录。我们只能复制文件。例如，如果我们当前目录下有一个文件 `biz`，`cat
    biz biz` 将 `biz` 的副本打印到终端。无法直接在日志文件中读取内容。输出可以分页到 `less` 中，以便于打印 `biz` 的内容。它将从文件开始逐行处理。空格键可用于翻页。或者，可以使用方向键向上或向下移动。你可以按
    `Ctrl+L` 退出 `less`。用户可以使用 `touch bar` 创建一个名为 `foobiz` 的新文件。


    ## CPU


    `cp` 是 Linux 中另一个起着重要作用的概念。它用于将文件从一个目录复制到另一个目录。我们只能复制文件。例如，如果我们当前目录下有一个文件 `biz`，`cp
    biz biz` 将 `biz` 的副本打印到终端。无法直接在日志文件中读取内容。输出可以分页到 `less` 中，以便于打印 `biz` 的内容。它将从文件开始逐行处理。空格键可用于翻页。或者，可以使用方向键向上或向下移动。你可以按
    `Ctrl+L` 退出 `less`。用户可以使用 `touch bar` 创建一个名为 `foobiz` 的新文件。


    ## 进程


    进程用于从一个目录文件夹中删除文件的概念。它通过删除新位置的文件文件来创建一个空间。用户需要指定文件将要复制的位置。


    ## 内核


    每个计算机系统都有运行操作系统的程序。内核是这组程序中最重要的程序。它负责引导并具备系统优化运行所需的步骤。其他程序缺乏此类实用程序。内核为用户提供交互式体验，并使计算机完成所有工作。它为系统所有部分提供了关键设施，以及高层软件的各种功能。因此，使用的是操作系统而不是内核。操作系统有两个主要功能：为在计算机系统上的应用程序提供执行环境；第二个功能是与硬件组件交互并服务可编程元素。某些启用的用户程序允许与硬件元素交互。


    ## 抽象


    相反，Linux 从所使用的应用程序隐藏了计算机物理结构的所有细节。这就是内核在评估请求和与硬件组件交互变得方便的地方。现代操作系统依赖特定硬件功能的可访问性来实现这种机制。它依赖于数据中不允许的特性。


    ## 多用户系统


    多用户系统用于运行来自许多用户的众多应用程序。这意味着应用程序独立且并发运行。它们竞争资源，包括内存、CPU 和磁盘。计算机独立执行命令，每个应用程序在执行时无需担心其他程序做什么。


    每个应用程序都是自给自足的不需要不需要程序。当用户必须从一个应用程序切换到另一个应用程序时，速度会变慢并导致难以及时转向其他事情。现代内核的大多数问题已经减少了延迟，让每个程序都能获得快速响应。


