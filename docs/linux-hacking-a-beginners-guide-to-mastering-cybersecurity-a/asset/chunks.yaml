    # 加密学概述


    加密（Cryptography）包括公密钥加密和对称加密。对称加密通常用于身份验证等目的。哈希函数（Hash function）用于确保消息的完整性。它利用数学算法来加密消息，例如
    `SHA-1` 是一个例子。哈希算法在公密钥加密中也被广泛使用。加密学领域最重要的进展之一是迪菲-赫尔曼（Diffie-Hellman）协议，他在斯坦福大学的教授首次描述了公密钥加密。这依赖于密钥的可用性，即你拥有一个密钥。


    ## 公密钥加密的原理


    公密钥加密使用了基于乘法（Multiplication）与质因数分解（Factorization）的原理。例如，如果你有两个两个质数（如 `5` 和 `7`）并计算它们的积得到
    `35`，现在你想要推导出这两个质数。假设你有一个数字 `35` 并且想要知道这些质数，你最终会得到这些数字，但可能需要更长的时间来获取到得出的的值。问题被放大了：如果我们使用了两个
    200 位的质数，那么它们的积将拥有 400 位。虽然这个例子看起来微不足道，但它代表了在公密钥加密中使用的密钥对（Key pairs）。


    通用公密钥加密使用一对连接的密钥，但已知的密钥并不总是启用的。一个密钥不需要知道另一个密钥。一个密钥被用于加密明文（Plaintext），而另一个密钥则用于解密。这并不取决于使用哪个密钥，因为两个密钥都是必需的，以便进行工作。


    在公密钥加密中，公密钥被认为是公开的，并且所有者都可以看到它。但如果他们想要获取另一个密钥，那么私钥（Private key）仍然是私有的。例如，如果你想要发送消息，你将使用接收者的公钥加密某些信息，接收者将使用其私钥解密消息。这种技术可以基于使用接收者的私钥来确定信息，然后就可以解密消息。使用公钥加密后的消息是无法被解密的，除非拥有私钥。


    ## 对称加密


    另一种方法是对称加密。它使用一个固定长度的哈希，使得明文的恢复变得困难。此外，哈希算法被用于获取文件的数字指纹（Digital fingerprint），以确保文件的完整性。如果文件被更改，接收者将计算另一个哈希值，如果它们相等，则说明系统是安全的。


    因此，这保证了安全性和完整性。对称加密是不可逆的。


    今天常用的哈希算法包括 `MD5` 和 `MD4`。扩展哈希算法应用于各种信息安全，如哈希库（Hash libraries）中的哈希值基于固定长度的哈希。考虑到窗口输入，可能计算
    1-10 字节的一个文件。哈希库的设置了哈希值对应于文件，这确保了加密密码（Passwords）可能被加密的文件。经过深入的研究和标准，哈希值代表了相似的输入值。


    这三种加密技术对于解耦的原因是重要的。每种技术都针对特定的加密应用进行了优化。例如，哈希算法对于确保数据完整性是理想的，因为内容的改变会导致接收者需要重新计算另一个哈希值，而发送者加密的相同消息将产生不同的哈希值，哈希函数确保了数据完整性。密钥加密是完美的加密消息，因为它提供了消息的机密性和隐私。加密密钥在加密系统中被使用的密钥被加密了。在某些加密系统中，密钥可以发现已知加密的文件，这在恶意软件调查中可能被忽略了。

