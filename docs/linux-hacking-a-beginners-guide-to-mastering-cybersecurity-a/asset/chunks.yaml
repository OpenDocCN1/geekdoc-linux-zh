    This is called code injection, only that the attacker injects malicious code into
    a website and executes the malicious client-side script whenever the victim visits
    the website. For you to run the malicious script in the victim''s web page, you
    must find a way to inject code into the said browser. You need to track the victim
    and find the website that he visits frequently. Knowing where the victim visits
    regularly gives the hacker access to his cookies and enables him to send HTTP
    requests.


    People hacked into systems through DNS spoofing. Using this method, the hacker
    manages to divert traffic from a server to a malicious one. It leads unsuspecting
    users to malicious web pages. For the hacker to spoof DNS, he brings in a corrupt
    domain name data into the DNS cache. He then determines where the DNS requests
    go and steals sensitive information. After getting the needed information, the
    attacker redirects traffic. Hackers love this method because it allows them to
    divert traffic-legitimate browsers to malicious ones.


    To gain unauthorized access into systems, hackers can practice clickjacking. This
    is where the attacker manipulates a user''s clicks by hiding hyperlinks under
    clickable content. This tactic allows hackers to trick page users into clicking
    links without their knowledge. In this case, the hacker is not primarily concerned
    with hacking but by causing the user to click on a web page. Clickjacking is done
    by concealing hyperlinks under something that the user will be lured to click.
    For example, the attacker can place and attract an ad to motivate the surfer to
    click on the link.


    It can also be a social sharing button, and in case it is malicious, the attacker
    sends the user to another website where a different attack is carried out. Googled
    hacking is another way hackers used to gain access to web pages. It is where the
    hacker looks for sensitive information or victims through search engines such
    as Google. This is and an easy way for them to find easily targets. Googled hacking
    based on queries allows people to identify sensitive information about the target
