    ## 第 5 章：服务器与网络


    该章节在 1996 年引入了第一个计算机网络。这是一件大事事，因为它是同类中的第一个，并创造了连接计算机的新方式。它也为互联网的发展奠定了基础。在此之前，计算机网络非常有限且功能有限。今天，它们已经发展到包含各种设备。服务器的目的是确保信息在计算机网络之间流。。


    服务器可以是一个通过网络向其他计算机提供数据的系统或计算机。与服务器共享数据的计算机称为客户端。不同类型的服务器，包括虚拟服务器、电子邮件服务器等。在过去的
    20 年里，某些技术和计算机应用程序变得越来越流行。因此，应用程序中微小的弱点导致全球许多计算机容易受到攻击。扮演蠕虫病毒角色并影响许多计算机的自动化软件片段形成了一个庞大的框架。公司已经采取了措施保护自己免受风险的影响，但仍然面临许多风险。其他一些则教育了员工并警告他们不要点击网站，但黑客总能找到方法将他们引入陷阱。

