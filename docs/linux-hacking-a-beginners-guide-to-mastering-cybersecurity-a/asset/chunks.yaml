    To ensure security, random wireless clients each are denied access to WLAN components
    that have the ability to connect into a wireless medium referred to as stations.
    The stations have network interface controllers that had two types of WLAN: private
    home and enterprise-class WLAN. Enterprise-class WLAN uses several access points
    to broadcast signals to wide areas. These access points have many features apart
    from small offices or homes. Private home WLAN employs one or two access points
    to broadcast signal. Most retail stores have tools for installing home or small
    office WLAN. Another type of network is is and SAN (storage area network). It
    is a kind of land with high speed and special used networks. It facilitates data
    storage and replication on business networks via servers. Such technology resembles
    network-attached storage.


