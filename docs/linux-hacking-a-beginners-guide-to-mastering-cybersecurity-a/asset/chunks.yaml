    不同类型的黑客：许多企业和个人使用对组织至关重要的计算机，这使得目标黑客被分类为小组以便于识别。他们从事的是伦理黑客。然而，他们必须遵循的规则是黑箱的。第二类黑客是为了个人利益而入侵系统的系统。他们的类别是仅出于良好意图进行黑客攻击，但不请求许可。人们黑客攻击的原因各异；有些人是为了赚快钱，而另一些仅仅是为了好。有些人通过黑客系列学习，黑客攻击被那些挑战系统和以组织为导的年轻人认为是酷的。


    黑客攻击是指获取计算机系统的未经访问权限。黑客的数量多年来呈指数级增长。他们通过破解密码和获取系统访问权限来入侵系统。“破解”（cracking）一词用于描述获取加密密码以访问系统的方法。破解系统的黑客是指入侵单个系统或一组系统的个人或多个人。黑客可以决定入侵网站、网络或社交媒体账户以获取密码访问权限；黑客破解算法程序。黑客攻击不是一种新现象，但技术每天都在变化。


    在试图驯服黑暗面时，政府使用的黑暗应用程序并非用于入侵系统。所使用的方法是分布式拒绝服务（DDoS），它通过向网络泛洪假请求使服务不可用。黑客使用计算机淹没服务器并最终导致系统崩溃。

