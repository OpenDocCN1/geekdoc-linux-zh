    ❖ 使用 VPN


    对于暗网用户来说，使用 VPN 是重要的，他们需要并希望有一个平台能帮助保护个人信息（包括地址和身份），同时让你免受数据泄露的侵害。然而，涉及到 VPN 问题时，并非一切一律适用。因此，你的
    VPN 至少应该符合最低标准。在这种情况下需要考虑的一个重要因素是，你选择的 VPN 应该来自鼓励数据保留的国家。在这种情况下，你的信息更有可能得到更好的保护。


    ❖ 避免宏


    运行脚本和宏的应用程序对于想要保持位置私密性的你来说可能存在风险。这些功能在 YouTube 等正常网站上可能是需要的。但是，当你进入暗网，如果某个网站开始要求你启用脚本时，那绝对有问题，你应该留神确保你的电脑不被恶意软件和病毒感染。


    ❖ 小心你的下载


    暗网完全不安全，这就是为什么你在那里下载内容时必须格外小心。不幸的是，恶意代码可以被封装在任何文件中，而你可能并没有察觉到这些封装是被用来将病毒安装到你的系统中的。有时，使用与操作系统隔离的虚拟机甚至会更好。


    你可能每天都需要上网，并理解使用高级工具和具备适当技能的黑客攻击是多么频繁，以至于你可能无法完全理解互联网（尤其是网页）周围的危险。如果你认为互联网是安全的，后果可能是致命的。例如，你不应该信任互联网上的任何人，并始终保持小心，以免在无意中用恶意软件感染你的电脑。简而言之，对暗网上的这些人保持怀疑态度，因为那些搜索某些东西的人极可能无法预测人的任何行为。训练你的大脑去识别这种处于潜在的危险。


