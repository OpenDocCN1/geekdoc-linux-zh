    ## 引言


    恭喜你选择《Linux 黑客》来学习网络安全基础知识，并通过伦理的 Linux 和精确的计算机配置进入每一个操作系统，成为一名黑客。关于这个主题有很多电子书，但你选择了这本书来帮助你理解
    Linux 黑客的世界。


    黑客技术目前是一个非常流行且酷的话。越来越多的人和企业已经将技术融入生活中以使工作变得简单。黑客也从先进技术中受益，因为他们拥有工具来推进自己的目标。有许多工具可以在不被检测到的情况下入侵系统。虽然公司已经采取措施阻止黑客活动，但有些公司并没有幸运地完全阻止它。


    随着你的继续阅读，你将学习 Linux 的基础、概念以及更多知识，这些将帮助你构建一个关于 Linux 操作所需知识的完整蓝图。你还将理解围绕 Linux
    的复杂性以及它为何仍然流行。正如前面提到的，许多其他作者也写过关于 Linux 的书，而你选择了这本书来帮助你理解。再次感谢，并保证本书经过精心准备，在今天具有实用价值。


    ## 第 1 章：基础与高级 Linux 概念


    Linux 开发于 1970 年，因为它是一个许多用户修改的开源操作系统。可以创建不同的变体。Linux 有不同的变体，通常被称为用于若干计算机的发行版。在开始安装过程之前，用户必须熟悉初级概念。基础概念包括：


    - `pwd`：用户在每次打开终端时都应该获取特定的路径。`pwd` 用于获取目录路径。它是有效的，因为它显示了当前路径并让用户处于正确的位置。此外，它高亮了用户所处的整个路径。`pwd`
    代表“工作目录”（present working directory）。它通过提供包含根目录（Linux 文件系统的基础）的绝对路径使工作变得简单。


    - `cd`：这个概念用于移动到特定目录。它很有帮助，因为它提供了方向并节省时间。例如，如果你有一个项目文件夹并想进入主目录，`cd` 就变得非常方便。你只需要输入主名称，就会带你进入特定的文件夹。


    - `ls`：这个概念是列表（list）的缩写。它的作用是列出特定目录下的所有目录和文件。可以与其他组合使用来获取结果。它可以帮助获取隐藏和难以的文件。它还可以帮助获取目录中的最近文件。


    - `touch`：这个概念用于在任何路径上创建文件。它没有限制，文件可以是任何类型。用户可以创建一个空的文本文件或压缩包。


    - `sudo`：这个概念在 Linux 中被广泛使用。用户利用它执行任何任务并获取管理员权限。它被许多人青睐，因为它让工作变得简单，并让他们访问为某些人保留的服务。`sudo`
    代表“超级用户执行”（superuser do）。


