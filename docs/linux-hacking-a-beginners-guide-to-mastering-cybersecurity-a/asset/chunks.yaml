    ## Chapter 6: cyber-attacks and malware


    A cyberattack is a concerted effort by individuals or groups of people to reach
    the information system belonging to another person/people. The attacker is usually
    after some benefits from infiltrating the victim’s network. The rate of cyberattacks
    has skyrocketed over the years, and officials are worried. Despite measures being
    implemented to thwart similar attacks, this has not prevented new attackers from
    joining the dark web. Businesses are affected by cyberattacks every day, and there
    is no guarantee that they can stop for good. Cybercrime is ongoing because people
    want to take advantage of vulnerable business systems.


    Most of the time, attackers are after ransom money and other times they do it
    for fun. Others attack systems to retaliate against past treatment. Cyber threats
    are also being launched with wrong motives as some attackers want to render systems
    useless to show that they hacked activists. The network was infected by malicious
    software, allowing attackers to control the network without knowing what is happening.
    The severity of attacks increased when systems were overwhelmed by distributed
    denial of service (DoS).


    There are different types of cyber attacks, and one is malicious malware: ransomware,
    spyware, worms, and viruses. These take advantage of vulnerability to launch attack.
    Today, even after organizations paid huge sums of money to recover data, they
    were not off the hook. Attackers continued demanding more money, while others
    did not return data after receiving payment. It becomes a cycle of making the
    system useless. Once the attacker has infiltrated the system, they can virtually
    do anything he wants.


    There are different types of malware, but the most destructive one is ransomware.
    It means to freeze files and demand ransom. The number of cyber-attackers has
    increased with more opting to engage in ransomware because they stand to gain
    again. The thing is that attackers stole sensitive information and replaced it
    with huge ransom. In return, organizations paid heavily in exchange for data.
    Attackers figured that they could make more from stealing information and demanding
    ransom. Today, even after organizations paid huge sums of money to recover data,
    they were not let off the hook. Attackers continued demanding more money, while
    others did not return data after receiving payment. It becomes a cycle of making
    the system useless. Once the attacker has infiltrated the system, they can virtually
    do anything he wants.

