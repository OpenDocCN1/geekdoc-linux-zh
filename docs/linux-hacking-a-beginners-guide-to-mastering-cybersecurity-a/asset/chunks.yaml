    ## Wireless exploitation


    Wireless connectivity gained popularity over the years. it had been since 1971
    when the first demonstration of wireless data network was provided. it was forgotten
    until the 1980s when another technique of sending packets was enhanced. wi-fi
    technology gained ground in the 1990s. companies realized the importance of connection
    mobility in business expansion. For example, what if someone wants to present
    a powerpoint presentation with no computer? might have a laptop but does not have
    the internet. the powerpoint presentation needs a stream of the internet. the
    use of a wireless local area network (wlan) allowed him to move around with a
    laptop and give the presentation. wireless works in a similar way to wired ethernet
    protocol. and an access point that supports wireless was used to grab packets
    coming through the wired connection. it emits a radio frequency which is captured
    by the receiving node. the fact that wi-fi is mobile makes it fascinating, but
    since data is constantly passed through the air, it represents great security
    risks.

