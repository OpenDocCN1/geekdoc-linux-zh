    为了确保安全，每个随机无线客户端都被拒绝访问能够连接到称为“站点”（stations）无线介质的 WLAN 组件。这些站点拥有网络接口控制器，具有两种 WLAN：家庭级和企业级
    WLAN。企业级 WLAN 使用多个接入点向广阔区域广播信号。与小型办公室或家庭的接入点相比，这些接入点具有许多其他功能。家庭级 WLAN 采用一个或两个接入点来广播信号。大多数零售店都有安装家庭或小型办公室
    WLAN 的工具。另一种网络类型是 LAN 和 SAN（存储区域网络）。它是一种高速且特殊用途的局域网。它通过服务器在业务网络上促进数据存储和复制。这种技术类似于网络附属存储（NAS）。


