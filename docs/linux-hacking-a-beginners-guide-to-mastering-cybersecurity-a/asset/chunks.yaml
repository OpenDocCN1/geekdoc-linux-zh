    # Ethics of Hacking


    Therefore, hacking becomes unethical when it does not look at the broader picture.
    Hacking is done for myriad reasons, such as exposing corrupt individuals, bringing
    down fraudulent firms or shutting down services. Any hacking that does not help
    others is unethical and is fought against by relevant authorities. The number
    of unethical hackers has increased over the years, with more people becoming interested
    in the dark web.


    ## Hackers hierarchy (using and abusing services)


    There is a real hacker’s hierarchy that informed the hacking world. The first
    level is the script kiddies, and many hackers fell under this category. A large
    number of hackers were bored teenagers who were looking for ways to have fun.
    Those who had access to computers and delved into the world of hacking without
    prior knowledge of what it entails. Others had basic programming skills and felt
    that they were ready to start hacking. Essentially, script kiddies were amateurs
    and knew nothing about hacking.


    They used hacking programs developed by others and did not know how to develop
    their own. They depended on others and cannot make basic hacking decisions with
    confidence. We all know that a hacker must be confident to pull off risky parts
    of this work. Acknowledgment gives you power and confidence and amateur lacks
    basic acknowledgment and questions everything he/she does. Many people start as
    amateurs and progress to become renowned in the field. The only thing that is
    needed is patience to learn and grow. If someone tells you they knew how to hack
    without depending on someone they were lying to you. No one was born knowing everything,
    and this also applies to hack. There is no shame in starting as amateur.


    It only becomes problematic if you do not move past that stage. One of the reasons
    why script amateurs never grew is because they only hacked to show off their peers.
    They hacked for fund and did not have a plan or goal. They found thrill in crashing
    systems, and that is the end of it. This level of hacking is less risky but a
    nuisance. While they did not pose big threats, other times, they got lucky and
    hit targets successfully.


    The second level of hackers is the hacking group. They had more power than script
    kiddies and can cause great harm to organizations. The common hacking group is
    elusive which launched attacks on countries. They posed a threat to industry and
    measures had been implemented to stop their activities. However, nothing much
    changed, and hacking groups still exist.


    The level of hackers activists who had religious, political or social goals. Sometimes
    they knew how to hack without their adversaries. For example, a hacker hacked
    and hit the opposition. Many people were pushed by strong beliefs and changed
    their viewpoints. The only group that is to support candidates. This group was
    harmless because they mainly focused on pertinent issues in society such as pornography
    or trafficking. There is no group of hackers that has deised the security of the
    industry and government bodies.


    The fourth level of hackers is professionals. None posed more threat to the world
    than these professionals. They had unmatched skills that allowed them to get away
    with any hacking activity. They participated in. They used hacking tools from
    other hackers and the fact that they took time to learn to hack. They were not
    ordinary hackers you met or heard about the news. These hackers who passed for
    ordinary citizens. When you met a black hat professional, you would think that
    they worked across the streets.


    They mastered the tricks of hacking, and it was hectic to figure out. It took
    equally good hackers to discover what they were doing and even so, it was still
    hard to bring them down. A black hat professional knows the loopholes to look
    out for and strikes at the right time. He does not get involved in activities
    that might compromise his identity and chose his companions precisely. One of
    the things that bring down seasoned hackers is trusting the wrong people. It can
    be tempting to boast to others about your achievement in the hacking world, but
    a professional is not that careless. He/she knows the value of silence in the
    dark web.


    They only opened up when talking to fellow hackers or someone that felt they would
    never betray them. Even so, they preferred listening over sharing their experiences.
    They had coding skills and were determined to gain access to unauthorized services.
    It might be difficult first, but a professional never loses hope after all. No
    one said that it would be easy.

