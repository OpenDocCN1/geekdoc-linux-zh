    # 第 2 章：Linux 安装


    ## 要求


    在加入这一行列之前，你需要了解 `Linux` 并不是每个人的菜。仅仅因为它为他人带来了惊人的效果，并不意味着它对你也能产生同样的结果。仅仅因为别人觉得它繁琐或恼人，也不意味着你也会有类似的经历。这归结于你的需求以及对系统的了解。


    多年来，`Linux` 变得越来越流行，这有一个很好的解释。如今，得益于系列电影和随之而来的刺激，人们发现黑客攻击很酷。越来越多的人在舒适的家里成为黑客专家。奇怪的是，一些几乎没有接触过电脑的人也正在使用
    `Linux` 和 `Kali` 作为他们的主发行版。


    许多 `Linux` 工具被用于黑客攻击，而且数量每天都在增加。然而，`Kali` 的初衷并非如此。许多人没有意识到的是，他们并不必须只使用 `Kali`。相反，每种
    `Linux` 发行版工具都能让特定任务变得更简单。


    既然你已经知道 `Linux` 是多么棒了，你一定急于安装它。然而，在安装软件之前，你需要考虑某些事情。你必须了解硬件要求和缺点。其中一点是，用户开发的 Linux
    拥有硬件访问权限。另一个挑战是，许多为设备编写的专用接口不支持对接口一无所知的用户。在某些情况下，黑客尝试对接口的假设进行编写。


    Linux 包含了为笔记本电脑保留的特殊功能，例如支持设备的 AMD 驱动程序。大多数硬件支持仍在开发中。因此，某些发行版可能没有现有的功能。用户应该关注那些在不考虑因素的情况下更改系统最新版本的硬件供应商。如果你想安装
    `Linux`，你已经准备好了要考虑的主板要求。


    目前，`Linux` 支持带有 `x86`、`Pentium` 和 `Pentium` 的系统。它结束了对非 Intel 架构的支持，例如 Motorola、MIPS
    和 `SPARC`。某些端口自然地比其他端口更成熟。拥有 `x80386` 及以上处理器的人应该使用这些处理器来让工作更轻松。此外，系统主板应该采用 ISA
    和 `PCI` 布局。注意这些术语很重要，因为它们决定了系统界面的外观。


    在安装 `Linux` 之前，你还需要注意内存要求。`Linux` 受许多人青睐，是因为与其他操作系统相比，它运行所需的内存很少。这意味着为了安装而获取大内存的麻烦较少。你只需要
    `8MB` 的 RAM 就可以运行。为了保险起见，系统上至少需要 `16MB` 以获得最快速度。磁盘空间上的内存量。


