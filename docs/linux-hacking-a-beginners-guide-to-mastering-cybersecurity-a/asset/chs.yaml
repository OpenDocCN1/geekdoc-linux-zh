  ### 高级概念


  每个用户都应该了解高级编辑器。例如，你可以使用此类工具轻松地编辑文件。它们看起来像 Windows，但功能更强大。此外，它们还开启了一些使其独具特性的功能，包括语法高亮和多重编辑，这让你的工作变得轻松。每当你打开文件夹时，你就能理解高亮的作用。你还可以使用编辑器来简化工作。许多人在第一次遇到编辑器时感到困惑，但很快就发现它相对容易使用。第一次打开文件夹时，打字可能会很困难，系统会持续运行。这可能会让人感到沮丧并导致许多人放弃。起初的困惑是因为编辑器是以模式运行的。第一模式是命令模式，可以在其中输入命令。你可以命令打开或替换文件。第二种模式是插入视图，允许用户输入文本。用户应该理解，它虽然没有吸引人的界面，但仍然非常高效。它能强大地编辑文本并促进学习。得知许多人在第一次遇到编辑器时觉得难用，你可以使用教程来了解它的工作原理。它打开时带有教程。


  另一个高级 Linux 概念是 `grep`。这是一个非常实用的概念，可以搜索用户需要的任何文件。它通常用于搜索特定的字符串。你可以检查输出以查看任务是否正确发生。如果确定的事件发生在“现在”，你就必须输入“right
  now”。有很多选项可以指定 `grep` 的位置。另一个高级概念是 `ps`。该命令显示系统管理器正在运行的所有任务。你可以通过输入 `ps` 查看系统运行情况。然而，出于安全考虑，用户只能看到自己的进程。过去曾发现有人处理他人的进程，因此引入了安全措施。


  `Kill` 是另一个重要的 Linux 概念。该命令补充了 `ps` 命令，允许用户结束由之前的命令显示的进程。如果某个进程没有响应，你可以使用语法来杀掉该进程。你可以使用
  `kill-0` 来消除无响应的进程。`-HUP` 也用于 `kill` 概念。它不会删除进程，而是强制其重新加载配置。如果你有一个正在运行的服务，并想由于配置文件的更改而重启它，`-HUP`
  就会非常有用。这是重载命令的一个极佳替代方案。由于这些功能强大的 Linux 概念，在 Linux 中可以组合命令组。你可以利用工具来执行任务并将结果传递给另一个任务。例如，当你运行
  `ps aux` 命令时，屏幕上可能会弹出难以阅读的输出。管道符号 `|` 用于将输出发送到 `grep` 进行搜索。这个过程被称为管道，管道用于连接不同的事物。





  ## 第 2 章：Linux 安装


  ### 要求


  在加入这一行列之前，你需要了解 `Linux` 并不是每个人的菜。仅仅因为它为他人带来了惊人的效果，并不意味着它对你也能产生同样的结果。仅仅因为别人觉得它繁琐或恼人，也不意味着你也会有类似的经历。这归结于你的需求以及对系统的了解。


  多年来，`Linux` 变得越来越流行，这有一个很好的解释。如今，得益于系列电影和随之而来的刺激，人们发现黑客攻击很酷。越来越多的人在舒适的家里成为黑客专家。奇怪的是，一些几乎没有接触过电脑的人也正在使用
  `Linux` 和 `Kali` 作为他们的主发行版。


  许多 `Linux` 工具被用于黑客攻击，而且数量每天都在增加。然而，`Kali` 的初衷并非如此。许多人没有意识到的是，他们并不必须只使用 `Kali`。相反，每种
  `Linux` 发行版工具都能让特定任务变得更简单。


  既然你已经知道 `Linux` 是多么棒了，你一定急于安装它。然而，在安装软件之前，你需要考虑某些事情。你必须了解硬件要求和缺点。其中一点是，用户开发的 Linux
  拥有硬件访问权限。另一个挑战是，许多为设备编写的专用接口不支持对接口一无所知的用户。在某些情况下，黑客尝试对接口的假设进行编写。


  Linux 包含了为笔记本电脑保留的特殊功能，例如支持设备的 AMD 驱动程序。大多数硬件支持仍在开发中。因此，某些发行版可能没有现有的功能。用户应该关注那些在不考虑因素的情况下更改系统最新版本的硬件供应商。如果你想安装
  `Linux`，你已经准备好了要考虑的主板要求。


  目前，`Linux` 支持带有 `x86`、`Pentium` 和 `Pentium` 的系统。它结束了对非 Intel 架构的支持，例如 Motorola、MIPS
  和 `SPARC`。某些端口自然地比其他端口更成熟。拥有 `x80386` 及以上处理器的人应该使用这些处理器来让工作更轻松。此外，系统主板应该采用 ISA 和
  `PCI` 布局。注意这些术语很重要，因为它们决定了系统界面的外观。


  在安装 `Linux` 之前，你还需要注意内存要求。`Linux` 受许多人青睐，是因为与其他操作系统相比，它运行所需的内存很少。这意味着为了安装而获取大内存的麻烦较少。你只需要
  `8MB` 的 RAM 就可以运行。为了保险起见，系统上至少需要 `16MB` 以获得最快速度。磁盘空间上的内存量。





  追求职业信息安全的道德黑客，拥有一个以安全为导向的操作系统至关重要，而有效的操作系统有助于按时完成繁琐的任务。有许多基于 Linux 的操作系统，但 Kali
  Linux 仍然是所有中最好的。它被用于道德黑客网络安全评估和渗透测试。由于黑客、渗透测试和道德黑客等几个原因，目前最好的 Linux 发行版 Kali Linux
  仍然是许多人的喜爱，因为它预装了多种命令行黑客工具，这些工具被认为是全球最出道德黑客工具。


  ### 安装过程


  在计算机上安装 Linux 相对容易。你需要具有兼容性的硬件来辅助这一过程。硬件要求并不多，但良好的硬件会带来更好的性能。在开始安装过程之前，你至少需要 20GB
  的磁盘空间。你还需要足够的 `i386` 内存，且至少为 1GB。你还需要一个 CD-DVD 驱动器或 USB 启动支持。一旦满足了所有要求，下载 Kali Linux，将其刻录到
  DVD 并在 BIOS 中设置计算机从 CD 启动。


  视频和显示器要求也会影响 Linux 的安装过程。Linux 以支持所有标准 CGA、Hercules、VGA 和现代显示器界面而闻名。你可能在大多数时候使用鼠标，但也会使用未图形图形环境的
  Linux 应用程序。通过启动选定的安装介质开始安装。你将看到 Kali Linux 的启动界面，并获得选项供选择。你可以选择文本模式或图形化安装，选择你偏好的语言和位置。你会被要求使用合适的键位映射配置键盘。完成后，你可以指定你的地理位置。


  安装 Kali Linux 的人员会将镜像复制到你的硬盘并询问网络接口。一旦获得这些信息，你需要为系统输入主机名。Kali 允许为系统使用域名名。root 用户是默认用户，可以轻松更改。


  一旦设置好时间，安装程序将检查你的磁盘并提供选项供选择。对于更常规的选择，经验丰富的用户可以选择手动分区。你可以将文件保留在一个相互分离的分区中。安装程序会做出更改，你必须分析你的磁盘配置。一旦点击继续，安装程序将在磁盘上进行工作，安装过程就快结束了。


  Linux 的良好之处是它是开源且免费的，任何具有编程技能的人都可以使用。它可以根据用户的需求修改并适应为新的操作系统。此外，Linux 非常易用，并具有许多使其成为理想选择的特性。Linux
  不需要防病毒软件。它与服务器配合使用时也非常可靠，并且可以连续启动运行多年。低维护性对所有人来说都很方便。Linux 有多个发行版，包括 Debian、Ubuntu
  和 Fedora，安装过程对所有版本都是相同的。你可以使用 CD-ROM 安装 Linux。你可以从互联网下载 ISO 文件并将其保存在 CD-ROM 中。


  或者，你可以将其制作可启动并存储在 USB 闪存中。要从 USB 闪存启动，你需要遵循某些步骤。在将 USB-ROM 连接到计算机后，重启它，然后在启动时按 Enter
  键。继续选择 CD-ROM 以开始启动过程。你可以通过按下驱动器并选择给定选项来选择手动启动。完成后，安装程序将显示驱动器并结束。


  加载程序负责 Linux 的安装。加载程序启动计算机。





  ### Kali Linux 简介


  有些人更倾向于安装经过加密的 Kali Linux。在某些情况下，我们拥有不希望他人访问的敏感数据，我们愿意花费额外的时间来保护数据，这就是加密版 Linux
  发挥用场的地方。得益于 Kali，你现在可以在 USB 驱动器或硬盘上安装并加密 LVM。如果你对其中一种不熟悉，可以使用另一种。这样做的好处是，其安装过程与普通的
  Kali Linux 安装相似。


  唯一的区别在于安装时需要选择并加密 LVM 分区。对于加密版的 Kali Linux 安装，你需要兼容的计算机硬件。其要求与普通的 Kali Linux 安装相似。一旦你设置好准备工作，下载了
  Kali Linux 并将其刻录到 USB 驱动器，然后将计算机设置为从 CD/USB 启动。安装过程非常相似，仅在于你现在处理的是 LVM 加密的 Kali
  Linux 安装。在开始之前，你需要安装介质。


  最好使用 USB 闪盘，并从下载的 Kali 页面选择镜像制作，确保你已经清空了驱动器。需要注意的是，写入可能需要一些时间，因此在整个过程中你需要保持耐心。一旦你将
  USB 闪盘插入要安装 Kali 的计算机并启动它，选择该 USB 驱动器作为启动设备。安装 Kali Linux 并非易事，但如果你熟悉 Debian，应该很容易发现这并没有太大问题。配置好驱动器后，Kali
  将启动安装过程。如果你是 Debian 用户，某些地方可能看起来不同，但安装过程并不漫长。完成后，系统会提示你接下来的该做什么。


  ### 为什么你应该安装 Kali Linux？


  有几个理由说明你应该安装 Kali Linux。与其他软件不同，它是免费的。


  它还有更多工具可供选择，用户可以自由权衡方案。它还支持多语言，使用户可以使用母语进行操作。虽然渗透工具是用英语编写的，但用户发现使用自己熟悉的语言可以更方便地定位并随时使用工具。Kali
