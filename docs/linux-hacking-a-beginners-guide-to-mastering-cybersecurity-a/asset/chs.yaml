  ## 暗网：概述与风险


  有些人为了之前的任主而这样做，另一些人则是为了获取财务利益。正如在之前的章节中讨论讨论的，利用网络并索要赎金以返回敏感信息的攻击者数量正在上升。黑客正试图通过新方法来使利益最大化，因为这个行业充斥着大量黑客，每个人都在努力生存。只有那些发现并利用了网络漏洞的人才能脱颖而出。


  有些人还利用网络来测试自己的技能。一些计算机专业的学生想要测试自己的能力，而对他们来说，最好的方法就是确定他们是否可以入侵系统。另一些人这样做是因为他们感到压力，想在朋友面前显得很酷。人们利用网络的原因有很多，唯一的问题是这种现象正在迅速蔓延，组织需要尽快找到解决方案。在那些展示渗透网络有多酷的系列电影让局面失控之前，毫无疑问，网络攻击在短期内不会结束。组织正在尽一切努力通过加强其安全计划来保护自己免受攻击。然而，在缓解无线网络和网络攻击方面，仍有许多工作需要完成。第一步是教育人们了解安全风险、他们在预防中所扮演的角色，并使用有效的策略从根源上缓解风险。


  ### 暗网详解


  所谓的“网页”（The Web）基本上指的是全球信息网的存在。然而，另一方面存在着“暗网”（Dark Web）。暗网是你所认为的超越了普通 Google、Amazon
  以及其他主流网站安全范围的区域。它就像房间角落里的一个暗室，而更令人惊讶的是，当涉及到暗网时，还有一个更宏大的概念，这被称为“深网”（Deep Web）。


  深网被人们认为是一个超越普通网页安全范围的区域。有些人也利用网络来测试自己的技能，但当涉及到暗网时，有一个更宏大的概念，这被称为深网。深网是人们认为的一个区域，而暗网网站也十分复杂，这就是我们汇编这些内容以了解暗网的原因。


  与传统网页不同，暗网存在于网络之上并覆盖在上面上。与普通网页不同，暗网需要特殊的配置，以及一些特殊的工具才能访问。暗网并不结束于你每天使用的搜索引擎；有时暗网与“暗网网络”（Darknet）交替使用。暗网网络包含了从小型到较大的热门点对点网络。暗网用户的位置和身份仍然未知且不可追踪，主要是因为加密系统是分层的。中介平台等平台部署的加密技术确保了上述特定命名暗网网站的匿名性和保护。


  ### 洋葱网络（The Onion Network）


  要访问暗网，你必须通过像 Tor 这样的平台。如果你是暗网领域的新手，可能还不知道，那么知道 `Tor` 代表 `onion routing`（洋葱路由）将是有益的。它也代表隐形互联网项目。其他使用
  `.onion` 域名的网站用于匿名访问互联网，而 `Tor` 提供了不同类型的服务，即匿名托管网站。暗网用户的位置和身份仍然未知且不可追踪，主要是因为加密系统是分层的。


  中介平台等平台部署的加密技术确保了上述特定命名暗网网站的匿名性和保护。然而，使用暗网的人被称为暗网用户。参考下文关于网络加密性质的内容，我们将进入深入讨论暗网以及你可以从中学到什么。





  有趣的是，它最初的设计是为了帮助保护美国的在线情报通信。然而，随着时间的推移，它的角色发生了演变，现在可以作为一种浏览器，帮助人们访问我们认为“暗网”的部分。它实现这一点的方法之一是允许访问
  `.onion` 网站，而这些网站只能在特定的网络上被找到。如果你好奇 Tor 到底是什么，请继续阅读下文：


