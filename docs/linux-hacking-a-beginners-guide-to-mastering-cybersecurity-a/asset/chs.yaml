  ## 第 6 章：网络攻击与恶意软件


  网络攻击是个人或团体为了进入属于他人的信息系统而付出的共同努力。攻击者通常希望通过渗透受害者网络来获取某些利益。年来，网络攻击的频率急剧增加，官员们对此表示担忧。尽管实施了相应措施来阻止类似的攻击，但这并没有阻止新的攻击者加入暗网。企业每天都受到网络攻击的影响，无法保证它们能够彻底停止。网络犯罪持续不断进行，因为人们想要利用脆弱的业务系统获利。


  大多数时候，攻击者是为了索要赎金，其他时候是为了好玩。还有人攻击系统是为了对过去的待遇进行报复。网络威胁还可能出于错误的动机而发起起攻击，因为一些攻击者想要通过让系统瘫用来证明他们黑入了活动人士的系统。网络被恶意软件感染，允许攻击者在不知道发生了什么的情况下控制网络。当系统被分布式拒绝服务（DoS）攻击压倒时，攻击的严重性随之增加。


  网络攻击有多种类型，其中一种是恶意恶意软件：勒索软件、间谍软件、蠕虫和病毒。这些软件利用漏洞发动攻击。今天，即使组织支付了巨额资金来恢复数据，他们仍无法脱身。攻击者继续索要更多金钱，而另一些人在收到付款后也没有返回数据。这变成了一个让系统无法使用的循环。一旦攻击者渗透了系统，他们几乎可以做任何想做的事。恶意软件有多种类型，但破坏性最大的是勒索软件。这意味着冻结文件并索要赎金。随着网络攻击者数量增加，越来越多的人选择参与勒索软件，因为他们可以再次获利。问题是攻击者偷取了敏感信息并将其变成了巨额赎金。作为交换，组织付了沉重代价以获取数据。攻击者发现通过偷取信息和索要赎金可以获得更多利润。今天，即使组织支付了巨额资金来恢复数据，他们仍无法脱身。攻击者继续索要更多金钱，而另一些人在收到付款后也没有返回数据。这变成了一个让系统无法使用的循环。一旦攻击者渗透了系统，他们几乎可以做任何想做的事。





  ### 网络攻击与注入方法


  另一种类型的网络攻击是注入攻击，通过向 Web 应用程序注入数据来实施欺骗和窃取信息。例如，攻击者使用日志注入、SQL 注入或代码注入来操纵应用程序。欺骗（Spoofing）正成为一种常见的网络攻击方法。这种计算机安全黑客攻击将数据放入
  DNS 缓存中，导致命名服务器返回无效的 IP 地址。


  ### 暴力破解与凭据窃取


  某些攻击者使用暴力破解从客户端窃取信息。这是一种试错策略，攻击者并不完全确定自己的操作是否有效，但仍会为之。这种攻击会导致大量的猜测，攻击者利用这些猜测来获取用户密码和银行详情等数据。犯罪分子是使用这种方法破解加密数据的人。此外，攻击者可以使用会话劫持（session
  hijacking）来窃取信息并攻击受保护的用户会话。攻击者通过窃取存储用户会话的 cookie 来获取数据。一些用户禁用了 cookie，但大多数人并不知道其重要性。


  拒绝服务（DoS）攻击是指使用户无法使用服务。这是通过向目标发送流量，导致用于拒绝服务的单一系统崩溃来实现的。另一种类型的网络攻击是字典攻击，通过检查常用密码列表来获取原始密码。


  ### 基于系统的攻击


  使用户暴露于风险的基于系统的攻击包括病毒，这是一种在用户不知情的情况下发送到计算机文件中的恶意程序。它在执行时会通过向其他系统插入副本来自我复制。蠕虫（Worm）也可用于执行攻击。蠕虫是一种可以自我复制的恶意软件，以便传播到其他系统。它的原理与病毒类似，但源自邮件附件，诱骗受害者认为这些附件来自信任的资源。


  后门（Backdoor）是一种使用狡诈策略绕过验证过程的方法。创建后门是为了允许访问应用程序。攻击者利用此访问系统。恶意程序可能会导致计算机设置发生意外变化。用户可能不会察觉到一切看起来正常，直到他们打开应用程序。


  ### 检测与预防


  公司意识到，向攻击者妥钱并不能解决问题。情况会变得更糟；其他类型包括根内核包（rootkits）、间谍软件和提权访问工具。某些仅下载不必要广告的软件让攻击者能够在用户不知情的情况下收集数据。许多攻击者使用恶意软件执行攻击而不被发现。他们曾将搜索重定向到特定页面。页面流量较低的机构雇佣攻击者将用户重定向到他们的网站。


  这是一种用于欺骗用户访问不想要页面的流行策略。有些人利用它从竞争对手网站吸引客户。接管计算机控制的自动化脚本。这使得攻击者能够在互联网上发起攻击。间谍软件（Spyware）是攻击者用于窃取信息的软件。它通过在用户不知情的情况下从硬盘中发送数据来工作。由于其易于获取和使用，使用间谍软件的人数随时间推移而增加。





  一旦恶意软件安装在系统上，其目标就是与安装它的攻击者进行通信。它从命令与控制服务器（C2 服务器）接收指令。这些服务器隐藏在互联网上，用户无法发现它们。许多攻击者利用
  DNS 使其恶意软件获取域名和 IP 所在地，这有助于管理和驱逐受害者。即使在用户添加或删除功能时，它也能允许轻松访问。这些服务器负责命令恶意软件窃取信息、向其他计算机传播风险、捕获击键并启用摄像头。它还会发出擦除指令以规避检测。攻击者已经精通了这些技能，想要捕获他们变得异常困难，甚至几乎是不可能的。当攻击者在攻击系统后删除服务器时，很难得知到底发生了什么。


  网络安全是指保护网络、程序和设备免受攻击的过程。网络攻击正在日益增加，各机构正在采取措施保护自己。防止网络攻击的最佳防御方法是建立强大的网络安全体系并在整个系统中实施分层保护。要让一个网络安全计划生效，需要强大的网络安全决策和技术。好消息是，你不需要成为安全专家也能保护自己免受攻击。每天都有各种类型的网络威胁威胁设备，它们分为三类：完整性、机密性和可用性。针对机密性的攻击包括窃身份信息和银行详情等。攻击者通常窃取机密信息并在暗网上出售它们。


  这些信息被远在天边的人利用。针对可用性的攻击发生在攻击者阻止用户访问其信息，直到他们支付赎金。攻击者渗透受害者的网络并阻止其访问网站。组织有时会支付赎金，并在之后解决安全问题以避免产生漏洞。针对完整性的攻击发生在个人信息泄露并影响人们对你的失去信任时。多年来，网络安全已经不断演进，包含了用于确保安全的复杂策略。企业通过保持信息灵通并对在线分享的内容保持谨慎，在互联网上保护自己。人们之所以说“互联网记忆是永恒的”是有原因的。那些曾未意识到网络安全必要性的公司，现在正聘佣安全专家来解决他们关注的领域并确保安全。目前，他们已经实施了使用杀毒软件等工具的安全措施来确保安全。


  ## 第 7 章：密码学


  你是否好奇过密码是如何安全存储的？或者在在线购买商品时，信用卡信息是如何保持隐私的？这些问题的答案就是密码学。多年来，网络攻击的频率不断增加，在线公司已引入密码学来保护客户的敏感信息。密码学帮助他们为用户提供安全保障。




  某些信息看似并不重要，但可能被攻击者用来造成巨大的危害。例如，电子邮件账户信息经过加密以防止现在被滥用，你可能好奇什么是密码学。事实上，密码学是防止防止第三方访问而安全传输信息的过程。许多公司都深信密码学，因为它能帮助他们避免信息丢失或第三方干扰。人们闯入对话有多种原因，例如窃取信息、破坏他人声誉或为了经济利益。


  无论原因何，密码学都能帮助个人和组织规避风险并保护数据。加密过程中使用了多种加密算法。第一个使用的是**对称密钥加密**，它使用同一个公共密钥来锁定和解锁加密条。它为发送者和接收者提供相同的密钥。对称密钥算法的一个优点是它们速度很快，因为密钥不需要很长。然而，共享密钥时存在风险，因为第三方可能会拦截它，从而导致整个系统的崩溃。对拦截的恐惧导致某些人避免使用对称密钥加密。


  另一种加密类型是**非对称密钥加密**。在这种算法中，只有接收者拥有密钥，并可以选择使用公钥锁定发送的数据。非对称密钥加密的工作原理是接收者生成两个密钥，其中一个是私钥。然后他选择大质数
  $q$ 和 $p$，使得 $n=qp$。


  加密的另一个关键方面是设计消息，允许你验证发送者并避免将数据发送给错误的人。你可以通过创建数字签名（例如 $t=m^d \pmod n$）对消息签名，然后将其与消息一起发送。始终记住，这是私钥。密码学涉及数据保护和通信策略。它是通过采用代码来防止信息和通信受到非预期访问，旨在创建一个帮助组织实现安全通信和第三方访问的平台概念。


  ### 加密的优势


  当加密服务进入市场时，人们意识到市场需要足够的安全性。在经历了多次入侵后，人们不知道如何保护自己。他们实施了足够的安全措施，但无一不奏效。直到加密服务的引入，人们才能保护自己。


  在此之前，人们对在线分享的内容非常谨慎，因为他们会分享一些用于在线购买商品的财务信息进行保存。加密恢复了用户对交易的信任，意味着他们可以讨论任何内容而不必被拦截。


  隐私加密保证了用户的在线隐私。数据可以被预期方访问，保护敏感数据是确保即使数据到达非预期人员手中它也是安全的最佳方式。加密让你能够保持匿名，并减少犯罪分子解码敏感信息的机会。


  作为所有者要维护**完整性**；完整性是增长的重要元素。在不发现可疑活动的情况下，信息无法被更改。当黑客能够识别敏感信息时，他就可以进行黑客并利用它实施欺诈。通过加密，你可以修改敏感数据，有助于维护完整性。它还允许企业对网络犯罪做出迅速反应。


  跨设备保护身份验证和数据——密码学使用人们识别信息的发送者、接收者以及信息的来源和目的地。手机已经有了让人们接收和发送信息的功能。手机拥有加密服务来长期保存信息。它允许用户验证数据源并检测未经授权的访问。


  ### 密码学的类型


  密码学


  第一个使用的是**密钥密码学**——这种类型的密码学主要用于维护安全和隐私。它使用一个密钥进行加密和解密。它也被对称密钥加密。




  ### Overview of Cryptography


  Cryptography includes public-key encryption and symmetric encryption. Symmetric
  encryption is typically used for purposes such as authentication. Hash functions
  are used to ensure the integrity of messages. They utilize mathematical algorithms
  to encrypt messages; for example, `SHA-1` is one instance. Hash algorithms are also
  widely used in public-key encryption. One of the most important advancements in
  the field of cryptography is the Diffie-Hellman protocol, described a professor
  at Stanford University who first described public-key encryption. This relies on
  the availability of keys, that is, you possess a key.


  ### Principles of Public-Key Encryption


  Public-key encryption uses principles based on multiplication and factorization.
  For example, if you have two prime numbers (such as `5` and `7`) and calculate their
  product to get `35`, you now want to derive those two prime numbers. Suppose you
  have the number `35` and want to know these primes; you will eventually get these
  numbers, but it may take much longer to obtain the derived values. The problem is
  scaled: if we used two 200-bit primes, their product would be 400 bits long. While
  this example seems insignificant, it represents the key pairs used in public-key
  encryption.


  General public-key encryption uses a pair of linked keys, but the keys are not always
  interchangeable. One key does not need to know the other. One key is used to encrypt
  plaintext, while the other is used for decryption. This does not depend on which
  key is used, because both keys are necessary for it to work.


  In public-key encryption, the public key is considered public, and the owner can
  see it. However, if they want to obtain the other key, the private key remains private.
  For example, if you want to send a message, you use the recipient''s public key
  to encrypt certain information, and the recipient will use their private key to
  decrypt the message. This technology is based on using the recipient''s private
  key to determine the information, allowing the message to be decrypted. Messages
  encrypted with a public key cannot be decrypted unless one possesses the private
  key.


  ### Symmetric Encryption


  Another method is symmetric encryption. It uses a fixed-length hash, making the
  recovery of plaintext difficult. Furthermore, hash algorithms are used to obtain
  a digital fingerprint of a file to ensure its integrity. If the file is altered,
  the recipient will calculate another hash value; if they are equal, it indicates
  the system is secure.


  Therefore, this ensures security and integrity. Symmetric encryption is irreversible.


  Commonly used hash algorithms today include `MD5` and `MD4`. Extended hash algorithms
  are applied to various areas of information security, such as hash values in hash
  libraries based on fixed-length hashes. Considering window input, a file of 1-10
  bytes might be calculated. The hash library sets up hash values corresponding to
  files, ensuring that passwords may be encrypted within files. Through in-depth research
  and standards, hash values represent similar input values.


  These three encryption technologies are important for decoupling reasons. Each technology
  is optimized for specific cryptographic applications. For instance, hash algorithms
  are ideal for ensuring data integrity because any change in content will require
  the recipient to recalculate the hash value, while the sender encrypting the same
  message would produce a different hash; the hash function ensures data integrity.
  Key encryption is perfect for encrypted messages because it provides message confidentiality
  and privacy. Encryption keys used in encryption systems are themselves encrypted.
  In some encryption systems, keys can be discovered from known encrypted files, which
  might be overlooked in malware investigations.





  本教程帮助你理解了加密的概念，让我们来举个例子：假设某人向留在公共平台上的朋友发送信息。然而，一个名为 Ed 的人黑破了通信安全，并将消息重定向到了他那里。这就是密码学发挥作用的地方——用户使用密钥对消息进行加密并发送，但这次
  Ed 无法解码消息，因为它是加密的。接收者收到消息后将获得一个用于解密的密钥。如果 Ed 成功在中途破解了系统并更改了消息，当他尝试解密时会获得错误信息。通过这样，他就会知道消息被拦截了且是不可靠的。那些不加密消息的人面临着收到错误信息且完全不知情情的风险。


  密码学用于保护消息的完整性和真实性。在通信网络中使用电子密钥的想法是确保接收者在不受干扰的情况下获取正确的消息。通过安全系统的帮助下，接收者可以使用加密密钥和算法解码消息。每当通过电子网络进行通信时，就始终存在干扰的风险。因此，人们通过密码学采取了安全措施来克服风险。创建密码学平台的重要元素包括身份验证、隐私保护、不可否认性和完整性。还有不同的加密算法和密钥来满足用户的需求。密码学在保护信息和公司形象方面起着至关重要的作用。


  Uber、Lego 和 eBay 等大公司都在使用密码学。这是由于过去几年安全威胁不断增加，客户倾向于使用优先考虑他们安全的的服务。当一家公司付出额外努力保护客户时，它会增强客户的信心和品牌形象。另一方面，一些公司较少关注客户安全，并且不愿承担额外费用。在当今社会，客户信息灵通，并选择那些关心他们福祉的品牌。公司开始聘用安全专家来向他们普及密码学及其应用。密码学为专业人士提供了就业机会。然而，学习其工作原理需要时间和投入。耐心且投入的个人能够轻松理解并加密消息。


  用户应该了解安全和应用方面的不同方面。这些领域已从安全商业扩展到保护健康信息。密码学是保障信息安全的一个重要组成部分。然而，仅凭这些不足以保证安全。它始于加密，通常被称为明文。加密数据被解密为明文。使用的密码学方法决定了加密和解密过程。密码学与用于加密消息的数学算法的发展相关。


