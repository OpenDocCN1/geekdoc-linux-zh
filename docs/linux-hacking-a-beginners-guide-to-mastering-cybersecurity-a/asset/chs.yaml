  与 WPA2 类似，它并不是保护无线网络的良好方法，只是企业世界中的一种权宜之计。解决问题的最佳方法是使用原始方式。它在 2004 年退役，由 WPA 取代。尽管
  WPA 采用了相同的流加密算法，但它比无线网络能更好地保护你的系统。WPA 是 Wi-Fi 保护访问，它是无线网络的解决方案，它引入了不会像 WEP 那样具有大量漏洞的安全协议。然而，它提供了一种临时解决方案，并用于防御攻击。WPA
  与 WEP 在几个方面有所不同。他们没有使用 `RC4` 流加密配合口令技术进行加密，而是将其增加到 `24bit` 以达到 `128bit`。


