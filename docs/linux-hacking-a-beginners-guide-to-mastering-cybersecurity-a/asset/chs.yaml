  20 世纪 90 年取得了进展。公司意识到连接移动性对业务扩张重要性。例如，如果有人想在没有电脑的情况下演示 PowerPoint 怎么办？他可能有一台笔记本电脑但没有互联网。PowerPoint
  演示需要网络流支持。使用无线局域网（WLAN）允许他带着笔记本电脑移动并进行演示。无线的工作原理与有线以太网协议类似。使用支持无线的接入点来捕获通过有线连接传输的数据包。它发射无线频率，由接收节点捕获。Wi-Fi
  的移动性使其引人入胜，但由于数据不断通过空气传输，它构成了巨大的安全风险。





  有多种无线安全协议通过加密来保护传输中的空中数据。无线等同于隐私(`(wep)））有时会被使用。无线接入点(`(wap/2)`）比 `wep` 更安全；然而，这些协议很容易受到干扰，尽管破解它们可能需要一些时间，但它们都面临着风险。不应仅仅因为内部网络有密码就认为它是安全的。有很多技巧可以在不输入正确密码的情况下访问系统；无论你的意图如何，当频率在传输时就会产生错误，即使你选择不显示服务标识符(`(ssid)`）也是如此。任何人都可以关闭
