  恶意软件感染可以被用于执行任意代码执行。或者，攻击者可以使用伪造的无线接入点来渗透系统。如果受害者没有注意到，他们可能会注意到开启的 Google 攻击数量。这是黑客利用伪造无线接入点让用户输入密码的一种简单方法。要让你在受害者的网页中运行恶意脚本，你必须找到一种向该浏览器注入代码的方法。你需要跟踪受害者，并找到他经常访问的网站。了解受害者经常访问的地方可以使黑客获取其
  cookie，并使他们能够发送 HTTP 请求。




  暴力破解攻击的好处在于，许多人在多个账户上使用相同的密码，因此一旦你获取了密码，访问你所需的所有内容的概率就会增加。如果黑客成功破解了你的邮箱密码，那么破解你手机号码的概率将变得极高。你还可以使用目录遍历漏洞（directory
  traversal hacks）来操纵黑客游戏。在这种方法中，你可以访问本位于网站根目录之外的命令、文件和目录。当黑客以特定方式向搜索引擎输入一系列恶意字符并使其执行命令时，这种方法就会生效。


  ### 在黑客过程中如何保持安全和匿名


  在黑客时，保持安全和匿名对你至关重要。事实是，我们经常会听到关于黑客的传闻，而且媒体往往将黑客描绘成神话生物，而不是人类。事实上，在开始黑客活动之前要学习的最重要的事情之一就是如何保持匿名。如果你没有时间学习很多东西，至少你也要花时间了解在黑客时如何保持安全和匿名。不保护好自己将让你暴露在各种风险之中。


  值得注意的是，如果有人知道你是谁以及在哪里，黑客就会面临风险。追踪互联网上的一切都是可能的，而且大多数事情都被追踪到了。可以安全地假设有人在监控你的在线活动，因为现实是互联网上根本没有所谓的隐私。除了政府监控在线活动外，你的雇主、父母或监护人对你在互联网上的行为也感兴趣。然而，除非你做了违法或坏事，否则没人会质疑你的所作。要点在于，黑客会从事非法活动，这就是为什么他们会格外小心地保护自己的身份。他们窃取敏感信息、关闭服务并破坏数据。如果你是一个黑客，你希望在雷达范围之外行事，这也是黑客保持匿名的唯一原因。


  在黑客时保持安全和匿名的第一个秘密是隐藏位置。黑客的完美场所是咖啡馆，它是黑客行动的理想场所，因为黑客不能在家里开展业务，否则会被追溯到他们身上。最好是利用互联网来追踪他们，如果他们发现了你是如何操作的，你会发现这些地方且被抓获的概率是极小的。如果你不保护好自己，就会危及你的活动。


  黑客知道，他们所做的一切都会被追溯以识别他们的身份。他们选择咖啡馆是因为那里人很多，而且被抓获的概率极小。如果你发现了你正在做什么，你将无法确保咖啡馆的安全。此外，几乎不可能监控足够的人来确保匿名。你必须仔细地隐藏咖啡馆，并确保那里没有摄像头。有些商店里有间谍，这使得隐藏你的在线活动变得困难。咖啡馆通常由几个人管理，他们专注于自己的工作，不需要看你在做什么。这为黑客活动创造了一个安全的环境。大多数咖啡馆为那些有家庭网络连接的客户提供免费
  WiFi。在使用这些互联网服务时，你不会产生任何记录，这解释了为什么黑客会在咖啡馆进行攻击。避免那些要求你使用手机号或邮箱注册 WiFi 的咖啡馆。在线上保持安全和匿名的秘密是使用不需要提供数据的
  WiFi。选择一个小而舒适的地方。确保桌子旁只有你一个人。周围的人可能是任何人，你的在线安全取决于你选择的人。




  使用你的账户进行在线服务时请注意。这确保了你已经断开了所有可以追溯到你身上的连接，最大限度地减少了被发现的概率。使用 Linux，虽然 Windows 是一个很好的系统，但它并不是为了黑客攻击设计的。Linux
  也不是为了那个目的，但它很容易调整以用于黑客攻击。当你尝试安全地在线时，你想要完全的控制权。你想了解什么进入了互联网以及谁有权访问。Linux 允许你选择符合你需求的发行版，并使其保持沉默。在研究如何保持在线匿名时，真正的
  Linux 非常有用。它拥有你所需的所有工具并让黑客变得简单。而且黑客无法限制自己只使用 Linux。


  他们可以使用 Live 发行版，因为它不需要安装。这确保了你增加了安全性，即使你删除了 Cookie。如果你在黑客后删除了 Cookie，别人仍然可以追踪到你的踪迹。他们可能无法配置出排除你，但可以察觉到你在做什么，这并不好。不要冒险，要禁用
  Cookie。


  通过更改你的 MAC 地址，你可以在黑客攻击时保持匿名。这是刻在你的网卡上的唯一标识符。它几乎出现在任何地方，包括 Wi-Fi。它的作用是让你的电脑通过网络进行通信。它不是用来识别用户的，但它可以执行该角色。显而易见，如果有人访问了你的电脑，他/她就能知道你的
  MAC 地址。这可以让你想起听到了执行攻击的人，并且会被发现。解决方案是更改你的 MAC 地址。在那一刻，你觉得相当安全，但有人一直在跟踪你，并在你黑客攻击时追踪你以抓捕你。


  在黑客攻击时保持安全和匿名的另一个技巧是永远不要向任何人透露你的移动或行动。不要甚至信任你最亲的朋友，因为你不知道他们是否会背叛你。如果得到优厚的条件，人们会同意，如果事事不如人意，有些人就会产生反应。如果你知道你听黑客详细说明他们的黑客行为，他们可能会给你发邮件。聪明的黑客知道，理解他人可能会要求你详细说明攻击过程。聪明的黑客谨慎行事，从不交出你的秘密，那是当你开始为失败做准备的那一刻产生的安全风险。聪明的黑客知道保守秘密的重要性，因为你永远不知道也无法信任。虽然揭露你听到的内容让你感觉无所畏惧、不被骗可能很有诱惑，但分享如此私密的秘密会导致覆灭。保持匿名很容易，只要你懂得节制并知道何时行动。


  ## 第 4 章：伦理与不伦理黑客攻击


  伦理黑客是获得许可攻击系统的个人。另一方面，不伦理黑客是未经授权访问计算机系统的人。许多人发现“伦理黑客”却没去搞这意味着什么。黑客是在组织的指示下进行类型攻击的。黑客被允许访问网络以识别安全风险。然后黑客向相关公司提供相应的建议。这是为了防止黑色黑客访问系统。


  一旦黑客通知公司已存在的漏洞，他们就可以提出解决方案或离开公司。他们的角色是识别风险。许多公司支付高价聘请黑客帮助他们识别风险。这是所有行业都备受追求的服务。一些公司确认以渗透测试的形式提供黑客服务。当黑客攻击是为了公司和个人的利益而进行时，它被认为是合伦理的。例如，一个人可能面临安全风险并要求聪明的黑客查看系统。在这种情况下，黑客被认为很好地帮助了这个人识别并消除了威胁。


  相反，如果黑客攻击是为了黑客的个人利益，则它被认为是不伦理的。该个人可以在组织中造成破坏，因为他们乐意达到自己的目的。





  ### 黑客伦理


  因此，当黑客不考虑大局时，就会变得不符合道德。黑客行为出于许多原因，例如揭露腐败个人、击垮欺诈公司或关闭服务。任何不帮助他人的黑客行为都是不道德的，并受到相关机构的打击。多年来，不道德黑客的数量不断增加，越来越多的人对暗网产生了兴趣。


  ### 黑客层级（使用和滥用服务）


  存在影响黑客世界的真实黑客层级。第一层是“脚本小子”（script kiddies），许多黑客都属于这一类。大量的黑客是寻找乐趣方式的无聊青少年。他们拥有计算机访问权限，在预先了解其内涵的情况下就深入了黑客世界。另一些人具备基础编程技能，认为自己已经准备好开始黑客了。本质上，脚本小子是业余爱好者，对黑客一无所知。


  他们使用他人开发的黑客程序，不知道如何开发自己的程序。他们依赖他人，无法有信心地做出基本的黑客决策。我们都知道，黑客必须充满自信才能完成这项工作中高风险的部分。认可带给你你力量和自信，而业余者缺乏基本的认可并质疑自己所做的一切。许多人从业余爱好者开始，并成长为该领域的知名人士。唯一需要的是耐心学习和成长。如果有人告诉他们不需要依赖任何人就知道如何黑客，他们是在对你撒谎。没有人生来就知道一切，这适用于黑客行为。从业余爱好者开始并不可耻。


  只有当你不过过那个阶段时，问题才会出现。脚本业余爱好者从未成长的原因之一是，他们黑客仅仅是为了向同伴炫耀。他们为了资金而黑客，没有计划或目标。他们在崩溃系统时找到刺激，并到此为止。这种水平的黑客行为风险较低，但很令人厌烦。虽然他们没有构成重大威胁，但有时他们运气很好，并成功击中了目标。


  第二层黑客是黑客团体。他们拥有比脚本小子更大的力量，可以对组织造成巨大的伤害。常见的黑客团体行踪诡秘，会对某些国家发动攻击。他们对行业构成了威胁，已经采取了措施来阻止他们的活动。然而，并没有发生太大变化，黑客团体仍然存在。


  第三层黑客是黑客活动分子，他们拥有宗教、政治或社会目标。有时，他们不需要对手就能知道如何进行黑客。例如，一个黑客通过攻击并打击了反对派。许多人在强有力信念的推动下改变了观点。只有一组人是支持候选人的。这个群体是无害的，因为他们主要关注社会中的相关问题，如色情或人口贩卖。没有任何黑客团体破坏过行业和政府机构的安全。


  第四层黑客是专业人士。没有比这些专业人士对世界构成的威胁更大的。他们拥有无与伦比的技能，让他们在参与的任何黑客活动后脱身。他们使用其他黑客的黑客工具，并且花时间学习黑客。他们不是你遇到或在新闻中听过的普通黑客。这些黑客伪装成普通公民。当你遇到一个黑帽专业人士时，你会认为他们只是在街上工作。


  他们精通黑客的技巧，要识破这些技巧非常困难。需要同样优秀的黑客才能发现他们在做什么，即便如此，仍然很难击败他们。黑帽专业人士知道要留意的漏洞，并在正确的时间出手。他不会参与可能危及他身份的活动，并精确地选择他的伙伴。击败老练黑客的事情之一是信任了错误的人。向他人炫耀你在黑客世界中的成就可能是很有吸引力的，但专业人士不会那么粗心。他/她知道暗网中沉默的价值。


  他们只在与同行黑客或认为永远不会背叛他们的人交流时敞开心。尽管如此，他们更倾向于倾听而不是分享经验。他们拥有编码技能，并决心获得未经授权的服务访问。开始可能很，但毕竟专业人士永远不会放弃。没有人说过这会很容易。





  第五级黑客是有组织的犯罪团伙。这个名称暗示了犯罪分子建立的有组织犯罪集团。他们由专业犯罪分子组成，成群结队地黑入计算机系统。他们大多数时候吸引代码编写者。他们在严格的规则下工作，无视规则的成员将面临惩罚。他们在规则下运行，以保护其行动免受审查。他们可以被想要入侵系统或组织其行动的人所雇佣。


  要在有组织的犯罪团伙中工作，你必须符合预期并在监督下工作。只有那些遵循指示的人才能在团伙中留很久。在小组中工作是有风险的，以防出现疏漏。例如，如果某人被捕，他/她可能会出卖整个团伙并破坏行动计划。有组织犯罪团伙的好处是，许多与其一起工作的人在不明确时可以咨询。


  此外，比起单干，你更容易获得黑客任务并加入团伙。而且，与孤军并承担黑客带来的所有风险相比，在团伙中工作更有感。然而，有组织的犯罪团伙面临着许多挑战，如果你信任错了人，就会面临危险。一旦你在方程式中加入了另一个人，黑客行为就会变得可怕，更不用是一群人。有组织的犯罪团伙有制定规则、增加和移除成员的领导。他们还负责对小组进行纪律管理和支付。


  黑客层级的第六级是国家。国家处于黑客阶梯的顶端。一种普遍认为是，国家训练了为政府工作的网络犯罪分子。这意味着每个国家都有一组黑入系统的黑客。虽然这是常识，但没有哪个国家承认过。这并不是秘密，每个国家都想知道其他国家出于经济、政治或社会原因做什么。没有任何国家不惜寻找网络犯罪分子来获取有关其他国家的敏感信息。国家利用小队来发现其他国家的动态，意识到与黑客合作不仅可以保护自己，还能了解其他国家，从而利用政治和经济规模。他们拥有国家的地位，能够在不泄露此类信息的情况下削弱对手。国家出现了人们开始关注的新趋势。即使使用自动化工具，对于计算机用户了解黑客的六级也是重要的，但他们


  ## 第 5 章：服务器与网络


  该章节在 1996 年引入了第一个计算机网络。这是一件大事事，因为它是同类中的第一个，并创造了连接计算机的新方式。它也为互联网的发展奠定了基础。在此之前，计算机网络非常有限且功能有限。今天，它们已经发展到包含各种设备。服务器的目的是确保信息在计算机网络之间流。。


  服务器可以是一个通过网络向其他计算机提供数据的系统或计算机。与服务器共享数据的计算机称为客户端。不同类型的服务器，包括虚拟服务器、电子邮件服务器等。在过去的 20
  年里，某些技术和计算机应用程序变得越来越流行。因此，应用程序中微小的弱点导致全球许多计算机容易受到攻击。扮演蠕虫病毒角色并影响许多计算机的自动化软件片段形成了一个庞大的框架。公司已经采取了措施保护自己免受风险的影响，但仍然面临许多风险。其他一些则教育了员工并警告他们不要点击网站，但黑客总能找到方法将他们引入陷阱。




  服务器和客户端计算机都具有计算能力的情况被称为客户端-服务器模型。然而，在客户端-服务器模型中，某些任务被分配给服务器处理。以前，大型机-终端模型充当了服务器的角色，尽管当时并没有这个名称，并且随着技术的进步它一直在演变。


  它现在可以执行比刚开始多多的任务。它已经达到了服务器可以是计算机设备上的软件的程度。安装了被称为虚拟服务器软件的称为服务器。最初，虚拟服务器用于增加服务器的功能数量。它已经发展成为多功能软件。现在，虚拟服务器可以由第三方通过互联网在硬件上运行。在处理虚拟服务器时，云计算变得非常有用。可以创建服务器来执行单项或多项任务。电子邮件服务器是服务器执行单项任务的示例。打印服务器和文件服务器是服务器执行多任务的示例。


  每个设备都配置为监听来自客户端的请求以作为服务器工作。它必须连接到网络并可以安装应用程序。如果你使用 Microsoft Windows，你将能够监听并响应客户端的请求。它同样适用，因为它通过网络向客户端发送请求。它接收并用正确的信息响应请求。某些应用程序因响应错误信息而闻名，从而影响整个过程。这种服务器被称为调用和响应模型。服务器执行若干任务，例如检查发送请求人员的身份并确保客户端允许访问信息。


  不同的服务器执行不同的功能。网络有多种类型的服务器。服务器类型包括文件服务器、打印服务器、应用程序服务器、电子邮件服务器、DNS 服务器和 Web 服务器。Web
  服务器是最丰富的服务器类型之一。它也是在整个互联网上托管地址的服务器类型。当客户端从运行在客户端上的浏览器请求时，它返回网站。服务器的示例包括 Microsoft
  服务、缓存和服务器。许多人使用电子邮件服务器。电子邮件服务器接收发送给用户的消息并保存。因此，电子邮件服务器将邮件存储并保持良好状态直到被需要。电子邮件服务器允许配置单次网络时间。与其在所有工作站上连接打印机，一个运行
  DNS（域名）的打印服务器通过将人类易于理解的名称转换为机器可读的地址为客户端计算机提供解决方案。当客户端需要地址系统时，它变得非常方便。


  另一种类型的服务器是代理服务器。服务器和客户端之间的中间节点，通常出于安全考虑而隔离客户端服务器。代理服务器接收来自第二个被观察应用程序的反馈并回复第一个客户端。客户端使用服务器来运行应用程序。它们用于运行许多用户共享的密集型应用程序。它消除了每个客户端都需要足够的资源来运行应用程序的需求。它还消除了寻找和运行应用程序的负担。用户也从在许多计算机上安装和维护软件的负担中解放出来。打印服务器促进了打印功能的管理和分配。与其在所有工作站上连接打印机，一个打印服务器就足够完成所有工作。它有响应多个客户端打印请求的能力。


  此外，一些高端打印机带有内置服务器，以满足打印成本。它消除了购买计算机型打印机的负担。另一种类型的服务器是文件服务器，它存储并分发文件。客户端保存在服务器上。此外，存储文件为封闭敏感信息提供了备份。服务器硬件的设计方式最大化地增加了速度并提高了效率。虚拟服务器在这里发挥了作用。它们接管了世界，用户开始注意到。虚拟服务器定义在一种称为虚拟机程序（hypervisor）的专用软件中。虚拟机程序同时在成千上万个虚拟服务器上运行。虚拟服务器被认为是世界上见过的最好的服务器。虚拟机程序以类似于物理硬件的方式为服务器提供虚拟硬件。它使用虚拟硬件并将计算传递给底层与其他虚拟服务器共享的实际硬件。




  计算机网络根据其规模、结构和距离进行定义、分类和组织。分类包括局域网（LAN）、广域网（WAN）和城域网（MAN）。如果两个设备能够相互处理、开启并共享信息，则被认为处于网络之中。也被认为节点或机器之间存在连接介质。网络由连接在一起以交换信息的计算机系统、网络设备和服务器组成。无线介质和电缆被用于连接计算机系统。下面将讨论计算机网络的几种类型：


  ### **LAN（局域网）**


  局域网是一种私有的计算机网络，覆盖办公室、家庭和学校等较小的地理区域。它用于连接计算设备并实现信息交换。连接到局域网的设备可以共享信息并建立强大的连接。与其他类型相比，局域网的规模较小。网络和设备通过电缆连接到被称为集线器的中央设备。今天，无线技术也被用于安装局域网，并使用访问点发送接收数据。在某些情况下，一台计算机作为服务器，为所有被称为客户端的计算机提供服务。


  例如，图书馆拥有有线局域网，供用户连接本地网络设备。它们可以连接服务器和打印机以接入内网或互联网。局域网有两种类型，即以太网和令牌环。以太网是最简单、最古老且最便宜的局域网类型。它通常用于微型计算机，并在
  20 世纪 80 年代流行起来。这种以太网允许不同类型的传输介质成为同一个网络的一部分。令牌环是局域网的第二类型，用于家庭计算机局域网网络技术。它于 20 世纪
  80 年代引入并取代了有线局域网技术。它曾用于启动总线拓扑网络。它还支持速率高达 10 Mbps 的数据传输。它被用于处理同时处理需求的接入技术。历史直到今天实施的标准——以太网的新版本。


  ### **WAN（广域网）**


  城域网的范围更大，占据城市或多达 100 公里的区域，由混合的传输介质和通过网络连接在一起的独立网络组成。802 标准方法 db 使用单向电缆将所有机器连接到它们。标准和安全是城域网最重要的方面。安全起着至关重要的作用，因为数据在类似系统之间共享。在这种情况下，优先考虑安全至关重要。标准确保了通信的可靠性；用户必须确保在使用高容量链路和该层的互联网协议可用服务连接多个土地时妥善。


  广域网作为跨越全球具有相反结构的通信网络或网络存在。它们以通信速率最慢闻名。此外，它们的距离最远。广域网有两种，即全球广域网和企业广域网。广域网通常连接到公共网络、卫星或线路。互联网是存在最大的广域网。互联网的某些部分，如
  VPN 被认为是广域网。已经建立了多个广域网，包括银行网络、公司网络和股票经纪网络。通过被称为网络服务提供商的互联网协议支持广域网并形成互联网的基础。与局域网相比，广域网使用昂贵的网络设备。它们使用帧中继（framed
  relays）、ATM 和同步光数字（sonet）。企业广域网更受青睐，连接政府、大学等地区。互联网是或。


  ### **WLAN（无线局域网）**


