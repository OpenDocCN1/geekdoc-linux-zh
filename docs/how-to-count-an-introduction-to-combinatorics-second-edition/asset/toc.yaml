- - '###'
  - '**9.7.2A** 彼得森图不是哈密顿图。在以下证明这一点的论证中，我们使用图 9.14 中给出的顶点标记。请绘制您自己的图。'
- - '###'
  - '**9.7.3A** 设 $G$ 是一个具有 $n$ 个顶点和 $\frac{1}{2}(n-1)(n-2)+2d$ 条边的图，其中 $n \geq 3$。假设
    $u$ 和 $v$ 是 $G$ 中未通过边连接的两个顶点，且 $\delta(u)+\delta(v)=d$。那么连接除 $u$ 和 $v$ 之外的 $G$
    中 $n-2$ 个顶点的边最多有 $C(n-2,2)=\frac{1}{2}(n-2)(n-3)$ 条，且有 $d$ 条边将这 $n-2$ 个顶点同时连接到
    $u$ 或 $v$。因此，边的总数最多为 $\frac{1}{2}(n-2)(n-3)+d$。因此 $\frac{1}{2}(n-1)(n-2)+2d \leq
    \frac{1}{2}(n-2)(n-3)+d$，进而 $n \leq d$。因此，由定理 9.10 可知，$G$ 是哈密顿图。'
- - '###'
  - '**9.7.4A** 该图是连通的，且每个顶点的度数均为偶数。因此，根据定理 9.9，该图是欧拉图。任何哈密顿路径都必须包含每个度数为 2 的顶点相邻的两条边。然而，与度数为
    2 的顶点相邻的六条边形成了一条未经过所有其他顶点的闭路径。因此不存在哈密顿路径。故该图不是哈密顿图。'
- - '###'
  - '**9.8.1A** 该图可以使用三种颜色进行着色。正方形角上的顶点可以着第一种颜色，中心的顶点着第二种颜色，其余四个顶点着第三种颜色。由于该图包含三个顶点，每个顶点都与其他两个顶点相连，因此不能用少于三种颜色进行着色。因此其色数为
    3。'
