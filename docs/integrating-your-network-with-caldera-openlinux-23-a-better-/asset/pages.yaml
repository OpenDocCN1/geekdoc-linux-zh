  md: '# Chapter 8: Configuring FTP Servers with WU-FTPD


    If you plan to place your FTP server on the Internet, carefully consider the associated
    security issues.


    ![](img/9102b40bb114da6b158a518630807d57_171_0.png)


    # /usr/sbin/in.ftpd


    This FTP daemon uses the TCP protocol to transfer files. Configuring in.ftpd requires
    either passing parameters at run time, or modifying the /etc/ftpass file. The
    daemon listens at the port number specified in the /etc/services file; normally,
    port # 21 is used for FTP commands, and port # 20 is for FTP data. (WU-FTPD is
    spawned from /etc/inetd.conf at boot time.)


    According to the information given in the man page for WU-FTPD, users are authenticated
    according to these four rules:


    +   1. The username must be in the password database, /etc/passwd, or whatever
    is appropriate for the operating system, and the password must not be null. The
    client must provide a password before file operations can be performed. That''s
    why, for an anonymous account, you need to enter a string, such as your e-mail
    address.

    2. The username must not appear in the file /etc/ftpusers.

    3. The user must have a valid shell, one defined in /etc/shells—such as bash.

    4. If the user name is anonymous or ftp, an anonymous FTP account (user ftp) must
    be present in the password file. In this case, the user is allowed to log in by
    specifying any password; usually the user''s e-mail address.


    # etc/ftpaccess


    This is the main configuration file for WU-FTPD. There are many options and parameters
    to play with. These options can be grouped into the following five categories:


    | Category | Description |

    | Access | Deals with who can access the FTP server |

    | Informational | Provides greeting messages to the user |

    | Logging | Provides audit trail of who had access and what was done |

    | Permissions | Deals with file and directory permissions |

    | Miscellaneous | Handles anything else |'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# WU-FTPD Overview 153


    Following is an example of the Access category. It defines a class of users called
    all that is composed of real, guest, and anonymous accounts. The asterisk is a
    wildcard to accept users from any domains.


    ```

    class all real,guest,anonymous *

    ```


    The next line is an example of the Informational category. It defines the e-mail
    address for the FTP maintainer; this is displayed when the %E message code is
    included in the message file discussed below.


    ```

    email mailto:root@localhost

    ```


    The next line is another example of the Informational category. It defines how
    many unsuccessful tries to allow before terminating the FTP connection.


    ```

    loginfails 5

    ```


    The next two lines are further examples of the Informational category. They advise
    the user to read the file(s) called README something, as README* is a wildcard
    for any filename that starts with README. This notification read occurs once upon
    login or navigating to another folder.


    ```

    readme README* login

    readme README* cwd=-*

    ```


    The next line is another example of the Informational category. It displays the
    content of the file welcome.msg upon user login. This occurs once.


    ```

    message /welcome.msg login

    ```


    The next line is a final example of the Informational category. It displays the
    content of the file .welcome when the user navigates to a current working folder.
    This occurs once.


    ```

    message .welcome cwd=-*

    ```


    The next line is an example of the Logging category. It instructs WU-FTPD to log
    all incoming and outgoing FTP transfers for anonymous and real FTP users. The
    log is recorded in /var/log/xferlog.


    ```

    log transfers anonymous,real inbound,outbound

    ```


    The next four lines are examples of the Permissions category. They dis FTP users
    who belong to guest and anonymous accounts from issuing the commands chmod, delete,
    overwrite, and rename.


    ```

    chmod no guest,anonymous

    ```'
  merge: -1
