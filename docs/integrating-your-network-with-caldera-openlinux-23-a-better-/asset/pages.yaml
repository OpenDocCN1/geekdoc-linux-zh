    # Testing for Accepted or Rejected Packets


    Once you have gone through all the work of creating a firewall and configuring
    it to start automatically at boot, you will want to ensure its quality. One way
    to do so is to get on a machine that is on your internal network and test the
    firewall rules that apply to your internal network. You can also get on your computer
    from home and test your firewall externally. To prevent holes in security, test
    your firewall without network connectivity by using the ipchains option. The configuration
    with some of the rules created before to make sure the expected answer is returned:


    ```

    ipchains -C forward -i eth0 -p tcp -s 192.168.1.100 2048 -d 10.1.2.3 80

    ```


    The system replies with:


    ```

    masqueraded

    ```


    Type:


    ```

    ipchains -C input -i eth0 -p tcp -s 192.168.1.200 2048 -d 192.168.1.100 80

