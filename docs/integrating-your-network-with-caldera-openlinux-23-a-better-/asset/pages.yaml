  md: '# Creating the domain.com Zone Authority


    The next zone file referenced in the /etc/named.conf file is /var/named/pz/domain.com
    (see Listing 5-4). If you use a different domain, change the filename to correspond
    with the domain name. This file is available on the CD-ROM under /files/bookfiles/chapter5/domain.com.


    Listing 5-4 The domain.com authority file /var/named/pz/domain.com

    | :var/named/pz/domain.com | |

    | $TTL ID | |

    | @ IN SOA domain.com. hostmaster.domain.com. ( |

    | 199906031 : Refresh |

    | 8H : Retry |

    | 2H : Expire |

    | 1W : Minimum TTL |

    | 1D) : ns.domain.com. : Name server |

    | MX 100 mail.domain.com. : Mail exchanger |

    | localhost A 127.0.0.1 |

    | ns A 192.168.1.1 |

    | mail A 192.168.1.2 |

    | www A 192.168.1.3 |


    This file gives DNS information for the domain.com domain and introduces a of
    new RRs—the A RR and the MX RR A stands for Address in this case, and it gives
    the IP address for the hostname specified on the same line. Address records are
    the ones that actually correlate hostnames to IP addresses for DNS lookups.


    > A word on A records versus PTR records. Both Address records and Pointer records
    correlate hostnames and IP addresses, but they do not the same thing. Address
    records are used in DNS lookups to specify which IP address is used for a specific
    host. A host can have more than one IP address specified for it, in which case
    bind randomly picks one when needed. Pointer records are used in reverse DNS lookups,
    and specify which hostname is used for a specific IP address. This correlation
    must be one-to-one; specifying multiple hosts for the same IP address is not allowed
    here.


