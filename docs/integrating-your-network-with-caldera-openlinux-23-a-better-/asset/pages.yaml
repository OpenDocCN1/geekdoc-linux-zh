    # Troubleshooting LPRng


    Unfortunately, you might run into problems with LPRng. There are four main types
    of problems that occur in LPRng (assuming it is setup properly): users cannot
    print, print jobs are lost, printers fails, and text is garbled or missing.


    +   - User cannot print: This situation appears as if the job goes to /dev/null.
    Begin by ensuring they have permission to print. You can check this in /etc/lpd.perms.

    - Print job is lost: Using lp in debug mode with verbosity will help you see many
    of the errors it monitors the process of lpr until it is placed in the queue.
    After it is in the queue, you can use it to get further details about the job
    in the queue.

    - Printer fails: You can use the utility lpstat to tell you when a problem occurs.
    In many cases, you will know before the clients contact you.

    - Garbled or missing text: After you ensure that it isn''t your printer (out of
    toner, and so on), the error lies either in the /etc/printcap file or the /etc/lpd.conf
    file. Typically, this latter file does not need to be modified, but you can check
    it. The file is well commented so it is easy to understand.'
