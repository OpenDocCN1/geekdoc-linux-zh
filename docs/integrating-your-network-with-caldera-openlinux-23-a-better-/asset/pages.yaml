- img_proc: true
  md: '# Specifying Your Available Newsgroups


    The inn package that comes with OpenLinux has a standard list of more than 27,000
    active newsgroups. You can get a current list via ftp from ftp.fisc.org in the
    /pub/usenet/CONFIG/ directory; the active file is the latest file. Keep in mind
    that this file lists all newsgroups that the Internet Software Consortium knows
    about, not necessarily that you can access.


    Most likely, however, you can pare the list down to a manageable level. On my
    server, for example, I just wanted to have local cheek.test and cheek.linuxkb
    newsgroups. In the /var/state/news directory, I edited the active file so that
    it looked like Listing 9-1.


    # Listing 9-1 An example /var/state/news/active file


    ```

    cheek.linuxkb 0000000000 0000000001 y

    cheek.test 0000000000 0000000001 y

    control 0000000000 0000000001 y

    control.newgroup 0000000000 0000000001 y

    control.rmgroup 0000000000 0000000001 y

    control.sensdys 0000000000 0000000001 n

    control.cancel 0000000000 0000000001 n

    control.checkgroups 0000000000 0000000001 n

    junk 0000000000 0000000001 y

    ```


    This file lists all newsgroups that your server carries. The newsgroup name tell
    the highest and lowest article numbers for each group; the last letter on each
    line tells whether each group can be posted to or not, and under what conditions.
    All new groups should start out with the zero, the zero-filled one, and a y or
    an n, as appropriate. Similarly, I edited the /var/state/news/newsgroups file,
    as in Listing 9-2. Descriptions for each newsgroup should be listed in this file.


    # Listing 9-2 example /var/state/news/newsgroups file


    ```

    cheek.linuxkb         Discussion about the Linux Knowledge Base

    cheek.test             Test newsgroup

    control               Pseudo-group where news system directives are filed.

    control.cancel        Pseudo-group where news system directives are filed.

    control.checkgroups   Pseudo-group where news system directives are filed.

    control.newgroup     Pseudo-group where news system directives are filed.

    ```'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Configuring inn 175


    | control.rmgroup | Pseudo-group where news system directives are filed. |

    | control.sensdys | Pseudo-group where news system directives are filed. |

    | Junk | Pseudo-group where non-standard messages are placed. |


    Both of these files need owned by the user and group news:

    chown news.news active newsgroups


    The control and junk newsgroups are needed for proper inn use—always keep them.


    # Advanced Configuration


    You can edit certain files to provide better control of your server resources.
    The editing explained in this section is optional; your server can work without
    these changes. If you want, you can skip to the next section, “Starting and Stopping
    innd.”


    These files have many lines and options available and, for brevity’s sake, I discuss
    only those I think need changing. Each file is listed with relevant options.


    # /etc/news/expire.ctl


    The messages expiration is controlled by the file /etc/news/expire.ctl. Toward
    the top of the file, you can find the following line:


    ```

    *A:1:10:never

    ```


    This says that all groups have a minimum expiration of 1 day, a default expiration
    of 10 days, and a maximum of no expiration. You can change this line to regulate
    the amount of time an article stays on your system (and takes up precious disk
    space). To change these settings to a minimum of 1 day, default of 5 days, and
    maximum of 14, use the following line:


    ```

    *A:1:5:14

    ```


    Later in the file, you can specify exceptions to this rule. For example, you could
    have all articles in the rec category (rec.*) stay for up to 90 days, and all
    test newsgroups (*.test) expire messages in 1 day:


    ```

    rec.*:A:1:10:90

    ```


    ```

    *.test:A:1:1:1

    ```'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# /etc/news/hosts.nptp


    If you plan to propagate newsgroups from other machines, such as upstream or downstream
    Usenet connections, you need to list their hostnames and/or IP addresses in this
    file. List them one per line, with a colon (:) at the end of each line.


    # /etc/news/newsfeeds


    The /etc/news/newsfeeds file establishes which newsgroups are allowed to propagate
    where; this file ships with an utterly confusing default:


    ```

    ME\n:*,alt.binaries.warez.*,!junk,!control*,!local*,!foo.*\n/world,usa,gnu,bionet,pubnet,u3b,eunet,vmsnet,inet,ddn,k12\n::

    ```


    I suggest changing this to


    ```

    ME*:!local:::\n\nTEST:!:*:

    ```


    This tells innd to send all newsgroups to the outside world, except for those
    specified with a local distribution. If you want to force certain messages to
    stay local, you can do this:


    ```

    ME*:!local,!cheek.*:\n\nTEST:!:*:

    ```


    Now messages to any cheek groups on my server (such as cheek.test) will not get
    propagated to the outside world.


    # Starting and Stopping innd


    Before you start innd, you need to create a few files. Executing the following
    commands will create history files for your new inn server; the commands will
    also give these files proper permissions and ownership by the news account.


    ```

    touch /var/state/news/active.times

    cd /var/state/news

    usr/libexec/inn/bin/makehistory -or

    chown -R news.news /var/state/news

    chmod 644 history

    ```'
