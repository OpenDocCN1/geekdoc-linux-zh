  md: '# Networking Support in Caldera OpenLinux 2.3


    Installing and configuring a proxy server is very different, and it warrants its
    own chapter; Chapter 12 is called "Configuring the squid Proxy Server.". both
    firewalls and network address translation take an unhindered flow of traffic between
    two networks and restrict it, a proxy server takes two separate networks and provides
    a bridge to connect them when certain conditions are met. This can provide security
    because the two networks do not ever need to be logically connected. Unfortunately,
    squid only provides access to Web and FTP sites.


    # DHCP Servers, telnet, and ssh


    These few services run out typical Internet services. Both telnet and ssh provide
    command-line and GUI remote to your OpenLinux server. However, telnet is bundled
    with OpenLinux and is not secure, meaning that it is susceptible to interception.
    As already mentioned, though, ssh is secure, meaning that if its transmissions
    are intercepted, they cannot be interpreted easily (but it is not bundled with
    Open-Linux and must be obtained separately).


    DHCP, the Dynamic Host Configuration Protocol, provides a way for many machines
    to get IP addresses from a pool of available addresses, instead of having one
    specific address assigned to each machine. This can reduce administration time
    spent on client machines, because the entire pool of IP addresses can be managed
    from one machine, the DHCP server. Additionally, DHCP can provide dynamic numbers
    for other IP-related services, such as DNS seryers and gateways.


    Chapter 13, "Configuring telnet, ssh, and DHCP Services," explains how to configure
    all three of these services for typical use on your OpenLinux machine.'
