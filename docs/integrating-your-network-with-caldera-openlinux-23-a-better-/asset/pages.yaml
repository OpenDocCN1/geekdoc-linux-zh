  md: '# Chapter 1: Introduction to CalderaLinux 2.3


    execution faster than it normally run via CGI, and php (Hypertext Preprocessor),
    a server-side scripting language similar in functionality to Microsoft''s Active
    Server Pages. For instance, my web site, www.cheek.com, is almost entirely written
    in php, which integrates the standard HTML and my Informix database server into
