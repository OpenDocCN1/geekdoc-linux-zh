  md: 'Both host and dig are useful tools in checking DNS zone information. It''s
    easy and fun to practice these tools on other domains on the Internet, to get
    a feel for how they work.


    # nslookup Command


    nslookup differs from both dig and host in that it is a full-featured, interactive
    DNS querying tool, not just a quick and easy one. Normal usage with nslookup is
    to call it by name without any parameters on the command line, and then set those
    options from its own command line (which nslookup presents for you). An example
    follows:


    ```

    nslookup

    Default Server: localhost

    Address: 127.0.0.1

    Default Server: ns.domain.com

    Address: 192.168.1.1

    ```


    ```

    > set type-any

    > domain.com

    Server: ns.domain.com

    Address: 192.168.1.1

    ```


    ```

    domain.com

    origin = domain.com

    mail addr = hostmaster.domain.com

    serial = 199906031

    refresh = 28800 (8H)

    retry = 7200 (2H)

    expire = 604800 (1W)

    minimum ttl = 86400 (1D)

    ```


    ```

    domain.com

    nameserver = ns.domain.com

    domain.com

    preference = 100, mail exchanger = mail.domain.com

    domain.com

    nameserver = ns.domain.com

    s.domain.com

    internet address = 192.168.1.1

    mail.domain.com

    internet address = 192.168.1.2

    ```


    ```

    > exit

    ```


    In this example, I invoked nslookup, changed the DNS server it would use to ns.domain.com,
    told it to query any type of resource records, and had it list pertinent information
    about the domain.com zone. Then I exited the nslookup command.'
