  md: '# Chapter 9: Configuring UseNet News with innd


    # # Troubleshooting innd


    If you start the server and do not receive errors, congratulations! inn is pretty
    picky; you have to follow the instructions in this chapter very meticulously.
    If you receive errors, the best place to check is the file `/var/log/news.all`.
    This file has messages from the `inn` system. You should see something like this:


    Nov 29 17:03:49 saltlake ctlinnd[2822]: Reading config from /etc/news/inn.conf


    If you see any errors after this message, stop the `inn` daemon and fix the error,
    and then start inn again.


    If you cannot connect to your server, check the `/var/log/news.all` log file.
    A normal connection shows the following:


    Nov 29 17:29:06 saltlake innd: localhost connected 16 streaming allowed


    Nov 29 17:29:14 saltlake innd:16 closed seconds 8 accepted 0 refused 0 rejected
    0


    You can force a connection via telnet. To telnet from your own machine to your
    news server, try this:


    ```

    telnet saltlake.cheek.com nntp

    ```


    After you connect, you can use the commands help, list, and quit to check whether
    the server is running correctly.


