- img_proc: true
  md: '# Configuring Apache


    ##AddHandler server-parsed .shtml


    By uncommenting these lines, you can have Apache treat every file with a .shtml
    extension as a server-parsed file, or one that potentially contains server side
    includes.

    The standard extension for these files is .shtml, for server-parsed HTML, but
    you can change this to be a different extension if you wish; simply change .html
    in both of the preceding lines to a different extension.


    # Adding IP-Based Virtual Hosts


    Virtual hosting is taking one Web server and having it serve many different Web
    sites. One Web site is the default Web site, and the other sites are called virtual
    hosts. Administering one Apache server serving many different Web sites is much
    easier than administering several different Apache servers, as you can probably
    imagine. Apache can support as many virtual hosts as your system can handle—many
    people have configured hundreds of virtual hosts on a single Apache server, although
    I have never personally configured more than a dozen or so on a single machine.
    Linux should easily able to handle handles, if not thousands, of virtual hosts
    on a high-powered machine.


    There are two ways virtual hosting can work. With IP-based virtual hosting, each
    Web site has its own IP address, and therefore has complete control over services
    at that IP address. With name-based virtual hosting, many different sites can
    share the same IP address but not get exclusive access to that IP address. While
    IP-based virtual hosting gives more control, it can eat up IP addresses quickly
    if you host many different sites. Name-based virtual hosting requires the Web
    browser to specify which site it is accessing (older browsers do not have this
    capability). Name-based virtual hosting also prevents a browser from connecting
    directly to an IP address—a hostname must be specified in the URL. Whether to
    host a Web site as a name-based or as an IP-based virtual host is a complex decision.


    # Which is Better, IP-Based or Name-Based Virtual Hosts?


    Neither is better. With IP-based virtual hosts, you have a bit more control (such
    as use of BindAddress) over the server. All Web browsers are compatible with IP-based
    virtual hosts. Unfortunately, using an IP address for each Web site can consume
    IP addresses rapidly if you are hosting many sites.


    Name-based virtual hosts allow you to use the same IP address for many different
    sites, and therefore do not use extra addresses. They require a current Web browser,
    however; older browsers cannot access the proper content on a name-based virtual
    site.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Chapter 6: Configuring the Apache Server


    Adding an IP-based virtual host requires taking a few steps:


    +   - Determine the new IP address, new hostname, new document root, and new CGI
    directory of the Web site.

    - Configure OpenLinux to use the new IP address.

    - Bind the Apache server to the new IP address.

    - Create a new virtual host definition, and populate the virtual host definition
    with configuration settings.

    - Create the new document root and CGI directories, and populate them with files.

    - Configure DNS for the new hostname, if necessary.


    I will give an example from one of my virtual hosts, zd.cheek.com. This website
    is an IP-based virtual host using IP address 208.12.12.131, with a document root
    of /home/hosts/zd/html and a CGI directory of /home/hosts/zd/cgi-bin. My OpenLinux
    machine used for this, seattle.cheek.com, has a single Ethernet interface using
    IP address 208.12.12.130 as its standard IP address.


    This machine was already using its standard IP address to serve the Web site seattle.cheek.com,
    so I needed to assign a second address for the new virtual host. I aliased the
    second address, 208.12.12.131, to the same Ethernet interface using OpenLinux''s
    IP aliasing (Chapter 1, "Configuring OpenLinux''s Basic Network," explains how
    to assign multiple IP addresses to a single interface using IP aliasing.


    To create a new virtual host definition, I added several lines to the end of this
    file. These lines are the same configuration lines that Apache uses throughout
    its configuration files, encapsulated by a <VirtualHost> command.


    ```

    <VirtualHost 208.12.12.131>

    ServerName zd.cheek.com

    ServerAdmin webmaster@cheek.com

    DocumentRoot /home/hosts/zd/html

    ScriptAlias /cgi-bin/ /home/hosts/zd/cgi-bin/

    ErrorLog logs/zd.errors

    CustomLog logs/zd.access combined

    <Directory /home/hosts/zd/html>

    Options FollowSymlinks

    </Directory>

    </VirtualHost>

    ```'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Configuring Apache


    As you see, the <VirtualHost> command encapsulates the entire definition, much
    like HTML tags. The <VirtualHost> command takes as a parameter the IP address
    of the new Web site. The ServerName is the hostname of the new Web server, and
    the ServerAdmin is the e-mail address of the person responsible for the server.
    In this case, I wanted any correspondence to the Webmaster e-mail account.


    The DocumentRoot names the document root of the Web site (the directory where
    the HTML files are stored). The ScriptAlias command tells Apache all URL paths
    with /cgi-bin/ CGI scripts that reside in /home/vhosts/zd/cgi-bin directory. Notice
    that the directory name ends with a trailing slash (/)—without that, CGI scripts
    will fail. I added ErrorLog and CustomLog commands, so that the logs from this
    host will be separate from the normal Apache logs; had I not done so, these log
    entries would be mixed in the normal log entries from my main Web site. Finally,
    the Directory and Options lines tell Apache for this Web site and in directory,
    I want Apache to follow symbolic links when it looks for files—this site uses
    symbolic links, so I wanted to explicitly follow them.


    After creating the directories for the HTML and CGI content and configuring DNS
    (explained in Chapter 4, “Configuring DNS and bind”), Apache will be ready to
    serve your new Web site. If Apache is already running, you will need to restart
    it. The section “Restarting Apache After a Configuration Change,” later in this
    chapter, discusses how to do this. The new Web site should be browseable by both
    hostname and IP address.


    # Adding Name-Based Virtual Hosts


    +   Determine the existing IP address, new hostname, new document root, and new
    CGI directory of the Web site.


    +   Create a new virtual host definition, adding a NameVirtualHost directive,
    and populate the virtual host definition with configuration settings.


    +   Create the new document root and CGI directories, and populate them with files.


    +   Configure DNS for the new hostname (always necessary).'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Chapter 6: Configuring the Apache Server


    Had my zd.cheek.com Web site been a name-based virtual host, not much would would
    have changed in the configuration file. I would only have added the <VirtualHost>
    definition, with the following line before the <VirtualHost> command:


    ```

    NameVirtualHost 208.12.12.131

    ```


    This line instructs Apache to allow multiple Web sites to be assigned to the same
    IP address, and determines which hostname given by the Web browser. If the NameVirtualHost
    command is not specified before configuring a name-based virtual host, Apache
    will not allow an IP address to be used for more than one Web site. Only one NameVirtualHost
    command needs to be given for each IP address assigned to name-based virtual hosts;
    if I had 10 different Web sites using 208.12.12.131, I would only need NameVirtualHost
    command. Because I had already created the virtual host, all I needed to create
    the new directories /home/vhosts/zd/html and /home/vhosts/zd/cgi-bin, and populate
    those with HTML and CGI files.


    After creating the directories for the HTML and CGI content, a new DNS for the
    hostname would need to be added. Because name-based virtual hosts require a host-name,
    adding a DNS entry is an important step. After this is done, Apache will be ready
    to serve your new Web site. If Apache is already running, you will need to restart
    it. The new Web site should be browseable by hostname, but not by IP address.


    # Editing Apache''s MIME Types


    As a Web server administrator, you may occasionally need to edit Apache''s MIME
    (Multipurpose Internet Mail Extensions) types. MIME types tell the Web browser
    what type of file is being sent to it: an HTML or text file, an image, an audio
    or video file, and so on. Apache reads the /etc/http/apache/conf/mime.types file
    to determine the proper MIME type for a file with a given extension. Here are
    a few examples of MIME types:


    | MIME Type | Apache''s Corresponding File Extension(s) |

    |---|---|

    | text/html | .html,.htm |

