  md: '# Hints


    Don''t forget to search the excellent archival and search site at http://www.dejanans.com.
    This site contains years of other people''s questions and answers. For those of
    you like to read USENET newsgroup, check out comp.proto cols.smb.


    To help troubleshoot Windows'' client access problems, don''t forget to check
    Microsoft''s online Support Web site at www.microsoft.com/support. A common problem
    for Windows 98 and NT 4 with Service Pack 3 and higher clients is that passwords
    are sent encrypted so you either need to configure Samba to accept encrypted passwords
    or change your Windows registry to send passwords in plain text. To configure
    Samba, add password=yes under the global section of the smb.conf file. You then
    need to run smpasswd user-name to add username to Samba''s encrypted database.
    To change the Windows Registry to enable plain text password, execute the registry
    files found in /usr/doc/samba-2.0.5/docs. These files have .reg extensions. Copy
    them over to your computer and execute them.


    There is an excellent troubleshooting document at /usr/doc/samba-2.0.5/docs/textdocs/diagnosis.txt
    that was authored by Andrew Tridell, the original creator of Samba.


    # Hints


    The following hints are based on the hints document located at /usr/doc/samba-2.0.5/docs/textdocs/hints.txt.


    +   - Use SWAT to assist you in configuring smb.conf.

    - Use smbttest to validate smb.conf for syntax or logical errors.

    - Use Windows Wordpad to read UNIX text files to avoid formatting problems.

    - To avoid username mismatch between the usernames on your Windows client and
    those on the OpenLinux server, use the username map option in smb.conf.


    # For More Information


    You can find additional Samba documentation on your OpenLinux system:


    /usr/docs/samba-2.0.5/docs


    /usr/docs/samba-2.0.5/textdocs'
