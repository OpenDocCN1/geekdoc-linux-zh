  md: 'One key to remember is that these might not be DNS servers, but just be name
    resolution problems. A DNS lookup is only the last step in resolution, and the
    breakdown can be anywhere. In particular, name resolution can fail either the
    /etc/hosts, /etc/nss.conf, or /etc/resolv.conf files are corrupt or missing, or
    even when the computer in question is unplugged from the network or from a power
    source. These issues can halt name resolution and have nothing to do with a bad
    DNS server. Check these files to see if they are misconfigured before you start
    to troubleshoot bind; not, though, that they must be properly configured on the
    machine requesting name resolution, which is not necessarily the machine providing
    DNS services.


    Another common issue is getting complaints that people "can''t find your Web site":
    if they enter your Web site''s URL into their browser, they find that your site
    doesn''t show. This is potentially a DNS issue, but not necessarily. Even if it
    is a DNS issue, it might not be your DNS server; could it be the DNS server misbehaving,
    or a server along the path between theirs and yours. For this specific issue,
    I suggest troubleshooting DNS last.


    Basic troubleshooting steps include checking whether the IP protocol stack is
    working properly, whether there is physical connectivity to the network, and so
    on. After checking these areas for problems, use the tools and concepts introduced
    in this section to troubleshoot the bind DNS server. Typically, the fix is just
    to edit one of the configuration files and restart the DNS server, but that is
    not always the case. After you read these tips, use your judgment to determine
    what to do.


    # Checking the Status of bind


    If network connectivity is fine and you suspect that the DNS server is causing
    the problem, first check the status of bind. Issuing the command ndc status will
    tell you if bind is running:


    ```

    ndc status


    22240 ?     00:00:00 named

    ```


    This tells you that the bind DNS server, named, is running as process 22240. A
    more verbose way of getting statistics is to use the command ndc stats, which
    causes the file /var/named/named.stats to be written. Its output is best checked
    with the command head /var/named/named.stats (see Listing 5-7).


    ```

    ndc stats


    head /var/named/named.stats

    ```


    Dumping Statistics'
