    # Troubleshooting telnet


    If you cannot telnet to your machine, there are a few things you can investigate,
    based on the symptoms. Here are some items to check:


    +   * telnet to your server gives an immediate "Connection Refused" message

    Check to see that telnet is enabled and running. It might be commented out in
    the /etc/inetd.conf file, or inet might not be running. Verify that your server
    is listening to port 23, the telnet port, by issuing the following command, which
    can result in the display of a line with telnet on.

    netstat -ta | grep telnet

    tcp 0 0 *:telnet *: LISTEN

    If you do not see a line like this, telnet is not running. Make sure it is enabled
    in the /etc/inetd.conf file.'
