  md: 'penLinux bundles the program sendmail to transfer e-mail via SMTP (the Simple
    Mail Transfer Protocol), a protocol responsible for passing e-mail from one computer
    to another, and ultimately transporting it to a user''s mailbox. Outgoing mail
    is sent to the proper mail server and incoming mail is routed to the proper inbox
    for later retrieval by sendmail. Calder has integrated another program, procmail,
    into the process of delivering incoming mail to a user. This chapter discusses
    sendmail and procmail as they work together.


    # Files Referenced in this Chapter


    The following files are used by OpenLinux''s sendmail and procmail packages:


    | File | Purpose |

    |---|---|

    | /etc/sendmail.cf | sendmail''s basic configuration file |

    | /etc/sendmail.cw | A list of hosts and domains for which sendmail receives mail
    |

    | /etc/aliases | A list of system-wide e-mail aliases |

    | /etc/mail/virtertable | A list of virtual user mappings |

    | /etc/mail/virtertable.db | A hashed database list of virtual user mappings |

    | /etc/mail/relay-domains | A list of hosts for which sendmail will relay mail
    |

    | /etc/mail/access | Access control list for sendmail |

    | /etc/mail/access.db | Hash database access control list for sendmail |

    | /usr/share/sendmail/cf/cf/generic-col2.mc | This file is used to generate a
    new /etc/sendmail.ci file |

    | /etc/procmailrc | procmail''s global recipe file |

    | /var/spool/mail | Incoming mail is stored in this directory |

    | /var/spool/mqueue | Outgoing mail is stored in this directory |


    > In each user''s home directory, sendmail looks for a .forward file. Additionally,
    procmail looks for a .procmailrc file in each user''s home directory.


    ![](img/9102b40bb114da6b158a518630807d57_139_0.png)'
