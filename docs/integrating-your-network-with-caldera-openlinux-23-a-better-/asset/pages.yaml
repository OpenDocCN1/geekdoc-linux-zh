    # Configuring WU-FTPTP


    There is really not much one needs to to configure the FTP server out of the box.
    After a standard OpenLinux installation, WU-FTPTP and its configuration files
    are installed and configured for you. If you don''t intend to connect your FTP
    server to the Internet, there are no further configurations needed. However, if
    you want to make your FTP server accessible over the Internet, then you need to
    fine-tune the default FTP configuration files.


    Configuring the FTP server requires modification to these files:


    +   * /ftpaccess

    * /fthosts

    * /ftpusers

    * /ftpgroups

    * /ftpconversions


    These five files are are in the /etc directory. The main configuration file is
    /ftpaccess; this file is used to configure both basic server information and access
    to specified directories. The next three files in the list relate to access by
    other computers. The last one deals with file conversions during file transfer.


    # Basic FTP Configuration in the /ftpaccess File


    Following are the parameters required for basic configuration.


    # class classname users ip-address


    Use this parameter to manage which area of your file system a group (class) of
    users can access. The default installation created a class called all that is
    composed of real, guest, and anonymous users from any domain, who can access whatever
    area of your file system you permit them to. Here''s an example:


    ```

    class xfiles sculley,mulder *

    ```'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Configuring WU-FTPD


    A class called xfiles, consisting of users called scully and mulder, can access
    restricted areas of my file system, with specified permissions that I need to
    define later on. (See the "Modifying Access Rights" section later in this chapter.)
    If scully and mulder can log in only from certain hosts, then replace the * with
    the host range of IP addresses, for instance, 172.155.32.*


    # deny ip-address message


    Use this command to deny access based on IP address or host name. Here''s an example:


    ```

    deny foe.com /usr/local/ftp/not-welcome.txt

    ```


    This prevents any users from foe.com from logging in, and displays the content
    of the not-welcome.txt file.


    # limit class maxuser time message


    Use this command to manage the number of users who can access your FTP server
    simultaneously by class or time. This prevents your FTP server from being overburdened.
    Here''s an example:


    ```

    limit xfiles 2 MoTuWeInFr600-1800 /usr/local/ftp/very_busy.txt

    ```


    This allows a maximum of two users from the class xfiles to access the FTP server
    from 6 am to 6 pm, Monday through Friday. If the maximum is reached, the content
    of the /very_busy.txt file is displayed.


    # loginfails number


    Use this to specify the maximum number of failed attempts to log in before closing
    the FTP connection. Usually, the default value is 3.


    ```

    loginfails 3

    ```


    # banner message-file


    ```

    banner /usr/local/ftp/ftp_greeting.txt

    ```'
