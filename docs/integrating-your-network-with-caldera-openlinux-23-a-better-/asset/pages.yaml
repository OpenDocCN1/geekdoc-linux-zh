- img_proc: true
  md: '# Determining Rulesets


    Now that you are aware of all the options you can use in your rules, it is time
    to decide what your rules should be. To determine the specific needs for your
    firewall, you should consider the following:


    +   * What services do your clients want? This will determine which ports and
    services you need to leave open.

    * Are any of these security risks for your network or your company? Why? The service
    may be too risky to allow.

    * What would be the damage to the company or the network if your network were
    compromised for the specific services? This will also determine if the risk outweighs
    the benefit.

    * Is the likelihood of these services being compromised so minimal that it is
    very unlikely that any problems caused by the specific service exist?

    * Is the risk of a given service worth the benefit to you or the end user?

    * Do you want any specific backdoors that would be unlikely to be exploited by
    those outside the company (REDIRECT)?

    * Do you want lengthy, verbose logs?

    * Do you want numeric-only logs at all?

    * Do you want to use IP addresses, or do you want to use IP masquerading? Will
    your applications support IP masquerading (most all do)?

    * What services can be provided another way and still be useful?

    * What is the most efficient method of creating a rule set?


    Let''s look at an example. Here, masquerading has been chosen. The private network
    space 192.168.1.0/24 was chosen for the protected LAN. The eth0 interface is the
    interface facing the outside world, and the eth1 interface will connect to the
    protected LAN. A Web server is running on the firewall and needs to be reached
    by the outside world. The clients on the protected LAN are configured to use the
    upstream ISP''s DNS servers. In addition, a mail server is running on the firewall.


    Here is the iptchains config that meets the above requirements with explanations
    of what we are doing:


    ```

    iptchains -P forward DENY

    ```


    This sets the default action for the forward chain. If a packet to be forwarded
    fails to match any of the matching criteria in the rules of the forward chain,
    the packet will be dropped.


    ```

    iptchains -P input DENY

    ```'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Chapter 11: Building a Firewall with ipchains


    This sets the default action for the input chain. If a packet coming into an interface
    on the firewall fails to match any of the matching criteria of the rules in the
    input chain, it will be dropped.


    ipchains -A forward -i eth0 192.168.1.0/24 -d 0 -j MASQ


    All internal ips (192.168.1.0/24) to be forwarded to the outside world will be
    masqueraded. The resulting packets forwarded out of the network will have their
    from IP address changed to that of the exterior IP address of the firewall. Returning
    packets will be demasqueraded automatically, and will bypass the forward chain.


    ipchains -A input -i eth1 -p tcp -s 192.168.1.0/24 -d 0 80 -j REDIRECT 3128


    Outbound Web connections (port 80) from the protected LAN (192.168.1.0/24) to
    the outside world will be transparently redirected to port 3128, while the firewall
    is running the squid proxy server.


    ipchains -A input -i eth1 -s 192.168.1.0/24 -d 0 -j ACCEPT


    Allow the protected LAN to the outside world. Our specifications placed no limits
    on outbound traffic, so allow it all. This doesn''t mean the resulting response
    packets will get back in, it just allows them to be sent out.


    ipchains -A input -i eth0 -s 192.168.1.0/24 -d 0/0 -j DENY


    If you receive a packet from the outside world that claims to be from an address
    used the protected LAN, drop it, as this only happens when someone is spoofing
    (faking) their return IP address in their TCP packets. This is usually someone
    trying to break your security we log these packets.


    ipchains -A input -i eth0 -p tcp -y -j ACCEPT


    Packets entering from the outside world that are responses to tcp requests from
    the protected LAN will be allowed. This rule looks at the TCP connection bits
    (SYN, ACK, FIN) to determine whether the packet is a request for a new connection
    (SYN bit set, ACK and FIN bits cleared), or a response to a request made from
    the protected LAN (SYN bit cleared, ACK or FIN bits set). Remember to escape the
    ! (with a \ character) when the command is being run by a shell that will interpret
    the ! (i.e. csh and tcsh).


    ipchains -A input -i eth0 -p tcp -s 0/0 -d 0/0 80 -j ACCEPT


    Incoming packets from the outside world destined for port 80 are accepted. Since
    we are not using anything other than one real IP (ISP assigned) facing the outside
    world, it is not necessary to specify the actual destination. If desired, one
    could have used -d 10.5.8.19 -d 0/0 (where 10.5.8.1.9 would be the real world
    IP address assigned to your eth0 interface.


    ![](img/9102b40bb114da6b158a518630807d57_229_0.png)'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Ipchains -A input -i eth0 -p tcp -s 0/0 -d 0/25 -j ACCEPT


    This allows incoming SMTP requests (port 25) to the firewall which is running
    your mail server. As above, it is not necessary to specify the actual destination
    (the external IP address used on eth0).


    ipchains -A input -i eth0 -p udp -s 0/0 53 -d 0/0 -j ACCEPT


    DNS is a UDP protocol, so when we make a DNS request out to the ISP''s DNS server,
    the packets coming back are not TCP, so there is no ACK or FIN bit (since it is
    not TCP), we need to specify that DNS (port 53) packets originating from DNS servers
    can enter.


    Ipchains -A input -i lo -s 0/0 -d 0/0 -j ACCEPT


    Allow the firewall to speak from itself itself via the loopback interface. This
    is used by some applications to talk between component server processes (such
    as squid).


    Any packet not meeting any of these rules will follow the default targets for
    the chains (which we set up to DENY). Make sure you have enabled IP forwarding,
    and you will find the server is accessing the next net as you, but the protected
    LAN can''t contact anything on the outside!


    An improvement to the above aid in debugging would be to set the default target
    for the input and forward chains, add specific deny rules with the logging flag
    at the end of each of the chains. This will cause anything you are not permitting
    to be logged to your /var/log/messages file. If way you''re having problems, you
    should be able to see why, and if someone is attempting to probe your firewall
    you will have a log of it so:


    ```

    ipchains -P FORWARD ACCEPT

    ipchains -P INPUT ACCEPT

    ipchains -A forward -i eth0 -s 192.168.1.0/24 -d 0/0 -j MASQ

    ipchains -A forward -s 0/0 -d 0/0 -1 -j DENY

    ipchains -A input -i eth1 -p tcp -s 0/0 -d 0/0 80 -j REDIRECT 3128

    ipchains -A input -i eth1 -s 192.168.1.0/24 -d 0/0 -j ACCEPT

    ipchains -A input -i eth0 -s 192.168.1.0/24 -d 0/0 -1 -j DENY

    ipchains -A input -i eth0 -p tcp \! -j ACCEPT

    ipchains -A input -i eth0 -p tcp -s 0/0 -d 0/0 80 -j ACCEPT

    ipchains -A input -i eth0 -p tcp -s 0/0 -d 0/25 25 -j ACCEPT

    ipchains -A input -i eth0 -p udp -s 0/0 53 -d 0/0 -j ACCEPT

    ipchains -A input -i lo -s 0/0 -d 0/0 -j ACCEPT

    ipchains -A input -s 0/0 -d 0/0 -1 -j DENY

    ```'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'While there is no defined limit for how large your chains can be, it is always
    best to keep them as small as possible, as each packet has to be evaluated by
    the chain (or chains) until a match is found, or a default action taken if no
    match is found. The more rules, the longer it will take to analyze each packet
    to make a determination as to what to do with it.


    # Enabling IP Forwarding


    In order to use real, routable addresses, or to use IP masquerading, the kernel
    needs to forward packets. By default, IP forwarding is disabled. In order to enable
    IP forwarding, you need to execute the following command:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    Your next reboot will clear this value, it is defaulted to not forward at boot
    time. We''ll cover how to deal with this on a reboot shortly.


    # Applications and IP Masquerading


    Many applications work with IP masquerading just as they do in non-masquerading
    environments. Some, however, have problems. In order for IP forwarding to work
    with some of these applications, you need to load some additional, loadable kernel
    modules. Here is a list of some known applications and the modules required for
    them to work properly in an IP masquerading environment:


    Table 11-3 Applications needing loadable modules with IP masquerading

    | Application | Required Module | |

    | --- | --- | --- |

    | ftp | ip_masq_ftp | |

    | irc | ip_masq_irc | |

    | CU-SeeMe | ip_masq_cuseeme | |

    | Real Audio | ip_masq_vdaudio | *will work without, but works best with |

    | VDOLive | ip_masq_vdolive | |

    | Quake | ip_masq_quake | *only need when more than 1 net player |


    To load any of these modules, use insmod. For example:


    ```

    insmod ip_masq_ftp

    ```'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Making Changes Permanent


    Now you''ve implemented your firewall, turned on IP forwarding and loaded any
    relevant kernel modules needed for your applications (if you are using masquerading)
    you have a running firewall.


    Unfortunately next time you reboot your firewall will not automatically initialize.
    The iptchains command does not save your rules, it installs them into the running
    kernel (not the kernel on disk). The iptchains-save and iptchains-restore command
    will save your work. It is recommended you save your chains to a file in /etc/iptchains.rules.
    To do so:


    ```

    iptchains-save > /etc/iptchains.rules

    ```


    This will save the rules, which are then capable of being restored with:


    ```

    iptchains-restore < /etc/iptchains.rules

    ```


    Still, a reboot would not do anything with this file, as it is not looked for
    as part of the system startup scripts. To have your firewall setup the chains
    and IP forwarding, we need to create a startup script and install it into the
    proper location. Here is a script you can create as /etc/rc.d/init.d/firewall
    to start your firewall:


    ```

    #!/bin/sh

    # Script to control packet filtering.

    # If you haven''t created any rules, do nothing.

    [ -f /etc/iptchains.rules ] || exit 0

    case "$1" in

    start)

    echo -n "Turning on packet filtering"\sbin/iptchains-restore < /etc/iptchains.rules
    || exit 1

    echo 1 > /proc/sys/net/ipv4/ip_forward

    echo "."


    stop)

    echo -n "Turning off packet filtering"

    echo 0 > /proc/sys/net/ipv4/ip_forward

    s/iptchains -X

    s/iptchains -F

    s/iptchains -P input ACCEPT

    s/iptchains -P output ACCEPT

    s/iptchains -P forward ACCEPT

    ```'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Chapter 11: Building a Firewall with ipchains


    ```

    echo "."

    :::

    *) echo "Usage: /etc/rc.d/init.d/firewall (start|stop)"

    exit 1

    :::

    esac

    exit 0

    ```


    When you stop the firewall with the script above, it will disable ALL packets
    from passing through the system. If you wish to only remove all rules and allow
    all packets, remove the line that turns off IP forwarding:

    echo 0 > /proc/sys/net/ipv4/ip_forward


    ![](img/9102b40bb114da6b158a518630807d57_233_0.png)


    In addition to the startup script, you will want to add any loadable kernel modules
    to support the protected LAN''s client applications to the /etc/modules/default
    file. To support ftp and irc, you would add:


    ip_masq_ftp

    ip_masq_irc


    Now we have the startup script and masquerading modules, we need to insert a symbolic
    link into the /etc/rc.d/rc.3 directory to point to the script we created so the
    system will run our script at the appropriate time during boot. To do this:


    ln -s /etc/rc.d/init.d/firewall /etc/rc.d/rc.3/S00firewall

    ln -s /etc/rc.d/init.d/firewall /etc/rc.d/rc.5/S000firewall


    We use 00 so it will be the first thing run at level 3. It will run before the
    network interfaces are started. This is done so the rules will be in place before
    the interfaces come up. Now our firewall is completely automatic. Should the firewall
    reboot to power loss or other reasons, when it reboots, the rules you want, and
    masquerading modules needed will be handled automatically.


    Once created, add execute permission for the owner (root):


    chmod u+x /etc/rc.d/init.d/firewall


    The number 15 is an arbitrary number, but the scripts are started in numeric order,
    make sure your firewall is started before your network. It is quite common for
    the network to be started as the first thing, S1network. In this case, type:


    m S1network S2network'
