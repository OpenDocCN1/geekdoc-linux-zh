    # # Security Considerations


    RADIUS itself is reasonably secure, since all the passwords are encoded in MD5
    encrypted packets between authorized RADIUS clients and the RADIUS server, using
    a private shared secret key known only to the client and the server. Therefore,
    security of your RADIUS server is very important to the security of your network.
    A compromise of your RADIUS server is likely to result in a compromise of your
    entire network.


    Most RADIUS servers are dedicated boxes so that a limited number of people (administrators)
    have login access to the RADIUS server. When this is not possible, adhering to
    secure file permissions is a must. If users file is readable and has plain text
    passwords, then the access of those users is compromised. If clients file is readable,
    then they will have the shared secret (which would not be much of a secret anymore),
    and could run decryption routines on any sniffed data between a client and server.
    If that occurs, any RADIUS user''s password can be compromised.


    For PPP based network access authentication, the protocols used were PAP (Password
    Authentication Protocol) and CHAP (Challenge Handshake Authentication Protocol).
    Most people use PAP, but CHAP is increasing in popularity. CHAP is more secure
    because of a challenge response handshake, encrypting the password yet one more
    time (in addition to the MD5 the RADIUS packets are encrypted by). However, in
    order to use PAP, your RADIUS users must use Auth Type=local, and have plain text
    passwords in the RADIUS users file (using Auth-Type=system).


    Be sure all RADIUS configuration files are owned as root and have permissions
    set (600 for file, 700 for directories). Your logging directory (/var/log/radacct)
    should be protected as well, so RADIUS accounting and logfiles are not accessible
    other than to system administrators.


    If you really want the ultimate in security, you want your RADIUS server behind
    a firewall. A firewall will allow you to control network transmission between
    your RADIUS server and the world. Allowing udp ports 1645 and 1646 from only those
    sources that are clients, and generally tightening login and other accesses will
    result in the best security you could have for your RADIUS server. See Chapter
    11 "Building a Firewall with ipchains" for more information on firewalls, and
    how to build one with an Linux box.'
