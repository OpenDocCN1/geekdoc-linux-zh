  md: '# Finding and Installing Proper Network Drivers


    # Letting Caldera''s lizard Installer Probe Your Network Card


    lizard is the installer you most likely use when you install OpenLinux. If you
    install OpenLinux from Windows, or boot directly from the CD contained in this
    book, you use the lizard graphical interface. This is the easiest way to configure
    networking; at a certain point in the installation route, you are asked for details
    regarding your Ethernet, including IP address, subnet mask, DNS servers, gateway,
    and hostname. You can opt for a DHCP IP address or to join an NIS domain. You
    are not asked for the type of network card you have, as it is determined automatically
    by lizard.


    You can opt not to configure networking at this point, although we advise against
    it. If you have more than one network card, you have the opportunity to configure
    only one (and lizard doesn''t tell you which one you are configuring, unfortunately).
    If you have a token ring card, or some other type of network card instead of standard
    or fast Ethernet, you cannot configure it from lizard, but have to configure it
    manually after the installation is done.


    lizard gives you several options for the type of install desired, such as a full
    installation, minimal installation, network server installation, and so on. Choose
    either the full installation (all packages) or network server installation. Choosing
    the full installation requires about 1.3 gigabytes of hard drive space, and installs
    the X Window System. The network server installation requires about 250 megabytes
    of hard drive space, and does not install the X Window System, instead forcing
    you to do all administration from the command line; nor any development utilities
    (so that compiling such as needed by ssh is disabled). Do not choose the Web server
    installation, as it does not load packages to be a functioning network server.


    # Loading Network Card Drivers with the lisa Installer


    You can load OpenLinux with Caldera''s older installer, lisa (Linux Installation
    and System Administration), which is text-based. (It does not probe for as much
    information—more needs to be entered manually.) lisa is good to use when the lizard
    probe functions do not return valid information, or on rare occasions when the
    probe hangs your system.


    To load OpenLinux with lisa, you must first create floppy disks. You can create
    these on a machine running either DOS or Windows, or on an existing Linux installation.
    The CD-ROM includes images of two floppy disks—a boot/install disk and a modules
    disk, which contains extra drivers. These images are located in the col/launch/lisa/floppy
    directory of the CD-ROM, as the files install.144 and modules.144 respectively.
    (Make sure you have a blank disk in your floppy drive'
  merge: -1
