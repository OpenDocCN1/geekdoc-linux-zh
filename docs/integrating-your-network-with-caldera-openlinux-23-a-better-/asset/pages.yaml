  md: '# Chapter 5: Configuring DNS and bind


    ind, the generic name of the DNS server that comes with OpenLinux, originated
    as a project at the University of California at Berkeley several years ago. It
    has passed through many hands since, and now resides in the hands of the Internet
    Software Software Consortium, which maintains the current version, Version 8.
    Although the previous version (Version 4) is still in use in many places, only
    Version 8 ships with Calder OpenLinux 2.3.


    You will often see references in this chapter to *named*, short for NAME Daemon,
    which is the actual bind program.


    ![](img/9102b40bb114da6b158a518630807d57_89_0.png)


    # Files Referenced in this Chapter


    The following files are used by OpenLinux''s implementation of *bind*:


    | File | Purpose |

    | --- | --- |

    | /etc/named.conf | The named configuration file |

    | /var/named/root.hints | The root DNS cache file |

    | /var/named/pz | A directory of primary zone files |

