  md: '# Chapter 2: Configuring OpenLinux''s Basic Network


    To use the information in this book, you need to have OpenLinux and proper network
    drivers installed on your server. This chapter explains how to get your OpenLinux
    server into a usable state, so the information in the chapters later in this book
    will be beneficial to you. You need to install OpenLinux 2.3 on your server, configure
    basic IP networking, and familiarize yourself with the basic network administration
    tools bundled with OpenLinux (Other chapters show you how to change network settings
    or configure the system by using tools introduced in this chapter).


    # Files Referenced in this Chapter


    The following files are used by OpenLinux''s base networking:


    | File | Purpose |

    | --- | --- |

    | /etc/inetd.conf | inetd configuration file tells which services it should run
    |

    | /etc/inittab | The init table identifies different runlevels and tells what
    to execute on |

    | /etc/sysconfig/network-scripts/ifcfg-routes | This file defines static network
    routes |


    > As a root user, you have complete and total access to the OpenLinux system on
    which you are logged in. Do not be careless with this account, as you could easily
    compromise the security of the system, or destroy valuable data and programs while
    using it.


    ![](img/9102b40bb114da6b158a518630807d57_35_0.png)


    # Finding and Installing Proper Network Drivers


    The first necessary items to configure are the network drivers. OpenLinux needs
    to have the proper drivers for your network card loaded and available for use.
    You can load these drivers automatically by lizard (the Linux Wizard), Caldera''s
    latest and greatest installer. You can also load them by hand, during or after
    installation by lizard or another installer.'
