  md: '# Creating User Aliases


    Each user account automatically has an e-mail account, and sendmail will deliver
    mail to all users created on the server, my cheek.com mail server will route mail
    addressed to joseph@cheek.com to the joseph account. Normally, mail sent to an
    address that is not a user on the system will bounce back to the sender with an
    undeliverable message. Mail aliases will allow a single user account to receive
    mail at multiple addresses. Each address other than its own is aliased to the
    user account.


    Because I have a user account named joseph on my mail server, mail to joseph@cheek.com
    goes to my joseph mailbox by default. When I wanted to create a mail address of
    info@cheek.com, and have sent mail to appear in my mailbox, I determined that
    I just needed to alias info to joseph.


    /etc/aliases file contains these e-mail aliases. The format is the alias, a colon,
    some whitespace, and then the actual user account. Here is an example for info@cheek.com:


    ```

    info: joseph

    ```


    A more complicated example would be if I had two employees, Dan and John, who
    worked for me as a salesman and technical support representative, respectively.
    After I create the user accounts dan and john, I could alias sales@cheek.com and
    support@cheek.com to them. When an e-mail message addressed to info@cheek.com
    comes in, I could have it sent to all three of us. This would require an /etc/aliases
    file like this:


    ```

    sales: dan

    ```


    ```

    support: joseph, dan, john

    ```


    An alias can expand to more than one user, as in the info example above. This
    allows for simple mailing lists to be created. Complex mailing lists can be better
    handled by programs such as majodomo, but this works for simple lists.


    Mail can also be sent to a program or file using the aliases. To send to a program,
    use a pipe (|) character immediately followed by the full pathname of a program,
    instead of the user account. Instead of the text and headers of each message sent
    to the aliased account will be piped to the specified program. This is good for
    autoresponders; the following line, when placed in the /etc/aliases file, will
    pipe mail sent to autoreply@cheek.com to the program /usr/local/bin/autoreply:


    ```

    autoreply: |/usr/local/bin/autoreply

    ```'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Chapter 7: Configuring SMTP E-mail with sendmail and procmail


    The /usr/local/bin/autoreply program would have to exist, and would probably be
    written to extract the From: address and to send a mail message back to that address.


    Similarly, mail can be placed in a file using the full pathname of the file instead
    of the user account. Suppose that you want to log all incoming mail sent to info@cheek.com
    in the file /var/log/info_mail_log. Use the following:


    ```

    info: /var/log/info_mail/log

    ```


    Be sure to use the full pathname of the file, as the first slash character tells
    sendmail that mail sent to this alias is sent to a file, and not a user account.


    After the /etc/aliases file has been changed, the program newaliases must be run
    to tell sendmail that new aliases exist.


    Mail aliased with the /etc/aliases file is done with daemon user and group permissions.
    If mail is sent to a file, it must be writable from the user and group daemon;
    if mail is piped to a program, that program must be executable from the user and
    group daemon.


    # Controlling E-mail Forwarding


    As the system administrator use the /etc/aliases file to create mail-forwarding
    aliases for any account on the system, each user can control mail forwarding for
    his or her own mail account. This is controlled by a file named .forward (pronounced
    dot-forward), located in the user''s home directory. It''s good to use the .forward
    file when the user has accounts on many different computers and wish all mail
    to be forwarded to one machine. (I use .forward on my seattle and san francisco
    machines to forward e-mail to my main mailbox on my saltlake machine.)


    The specifics of the .forward file are similar to those for the /etc/aliases file:
    a name is treated as an e-mail alias, text beginning with the pipe character (|)
    is treated as a program to which the message is piped, and text beginning with
    a slash character (/) is treated as a file in to save the message. The difference
    is that these do not need the original username and a colon before the forwarding
    text. To make this more clear, let me give some examples. If I wanted to forward
    mail from my joseph account to my wife Liza''s account, I would place the following
    in my .forward file:


    liza'
