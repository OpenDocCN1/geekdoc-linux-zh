  md: '# radiusd Configuration Files


    radiusd uses several configuration files, which are detailed below.


    +   - Clients. This file contains the clients that can communicate with the server,
    and their shared secret keys.


    +   - Users. This is the RADIUS users database. It contains a list of who is authorized
    to authenticate, what service they connect to, and other related parameters.


    +   - Dictionary. This is the dictionary of RADIUS attributes. The attributes
    that are passed between the RADIUS client and the server. In general, you will
    likely never need to modify this file unless you are adding vendor specific RADIUS
    attributes that are not in the standard RADIUS attributes.


    # The Users File


    users file is a text file that contains the users who can authenticate via the
    RADIUS server. Each entry in the file contains three items: the username, the
    check items, and the reply items. The username and check items (see table 10-1)
    are on the first line of the entry. Reply items are on subsequent lines. For a
    RADIUS authentication request to be granted, all check items must match. Reply
    items (see table 10-2) specify to the RADIUS client which type of service is to
    be granted, as well as any parameters about that service.


    | Table 10-1 Common RADIUS Check Items |

    | Check Item | Definition | Valid Values |

    |---|---|--|

    | Password | The user''s password | The password in double quotes |

    | Auth-Type | Authentication type | Local, System |

    | Expiration | Password Expiration Date | A date in MMM DD YYYY format |

    | Prefix | Username prefix | |

    | Suffix | Username suffix | |

    | Group | User group | |

    | NAS-IP-Address | RADIUS client IP Address | An IP address |

    | NAS-Port | RADIUS client''s port | |

    | NAS-Port-Type | RADIUS client user''s port type | ISDN, Async, Sync |'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Table 10-2 Common RADIUS Reply Items


    | Reply Item | Definition | Valid Values |

    | Service-Type | Type of service | Login-User, Framed-User |

    | Login-Service | Type of login service | Telnet, Rlogin, TCP-Clear |

    | Login-IP-Host | Remote host address | An IP address |

    | Login-TCP-Port | Login Service TCP Port | A port number |

    | Framed-Protocol | Framed Protocol | PPP, SLIP |

    | Framed-IP-Address | IP address for user | An IP address |

    | Framed-IP-Netmask | IP netmask for user | A netmask |

    | Framed-Route | Pass routing info | <Dest Net>/<NetSize><Gateway IP> <Hops> |

    | Framed-Routing | Route broadcasts | None, Broadcast, Listen, Broadcast-List
    |

    | Filter-ID | Filter identifier | |

    | Framed-MTU | Maximum Transmit Unit | |

    | Framed-Compression | Compression type | None, Van-Jacobson-TCP-IP |

    | Session-Timeout | Session time limit | Number of seconds |

    | Idle-Timeout | Session idle time limit | Number of seconds |


    # ## Username


    The username can be up to 63 printable characters with no whitespace (spaces,
    tabs, etc.). However, vendor''s hardware could impose further limits. A username
    called "DEFAULT" will match any user given. If used, DEFAULT should always be
    the last entry in the users file.


    # ## Check Items Definitions


    +   * Password. The user''s password in double quotes. Maximum supported password
    length is dependent on the equipment vendor.

    * Auth-Type. The authentication type. When set to Local, the Password specified
    in the check items is used; when set to System, RADIUS authenticates the password
    against OpenLinux (i.e. /etc/password, NIS, etc) authentication system. When local
    authentication is desired, AuthType=Local can be omitted and just a Password=value
    can be used.

    * Expiration. Defines the expiration date of user''s access. The format used is
    MMM DD YYYY. For example, Expiration="Dec 31 2000".'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Chapter 10: Configuring RADIUS with Lucent''s radius


    +   - Prefix: Defines a username prefix so attributes can be set differently based
    on a username prefix. For instance, you can define Joe with a Prefix="PPP%" as
    a PPP user, and Prefix="SHELL" as a telnet login user. When Joe logs in as PPP%joe,
    he starts a PPP network session. When he logs in as SHELL%joe, he gets connected
    via telnet to an OpenLinux server.


    +   - Suffix: Same as Prefix, but defines a suffix instead.


    +   - Group: The user must be a member of the specified group to authenticate.
    You could use this to separate users into groups, and give different service attributes
    depending on the user''s group. For example, you could have a group staff and
    a group users, and create two users file entries for user Bob. One has group=staff
    and the other group=users. If Bob is to have staff attributes disabled, moving
    Bob from group staff to group users removes his ability to authenticate with staff
    attributes. If users are in multiple groups, you could define one entry with Group="users-staff".
    In this case, to authenticate the user needs to be in both groups.


    +   - NAS-IP: The IP address of the RADIUS client (i.e. Lucent Portmaster). This
    can be used to restrict which particular users can authenticate. For instance
    if you have an NAS for employee use and for general use, you can restrict users
    to one or the other by using this attribute.


    +   - NAS-Port: The port on the RADIUS client used for authentication. If there
    is a dedicated line for a particular account tied to a specific port, for example,
    a Lucent Portmaster, you could use this attribute to restrict the account to that
    port.


    +   - Port-Type: Restricts a user to a particular port type. You could use this
    to keep normal async (modem) users from using ISDN ports, and ISDN users from
    using async ports.


    # Reply Item Definitions


    +   - Service-Type: The type of service. Can be Login-User or Framed-User. Login-User
    is a character-based service, which allows users to connect to an OpenLinux login
    prompt (using either telnet or login). Framed-User is a network type connection,
    which could be an SLIP or PPP connection.


    +   - Login-Service: When the Service-Type=Login-User, set Login-Service to the
    connection type desired. Supported Login-Service types are Telnet, Rlogin, or
    TCP-Clear.


    +   - Login-Host: The host ip address to connect Login-User.to. For instance,
    this would be the IP address of the OpenLinux machine you have set up for people
    to log into.


    +   - Login-TCP-Port: This is the TCP port number to connect Login-Users to. For
    standard telnet this port would be 23. For a dial-up user to uucpd (if you are
    providing uucpd) you set this to 540.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '+   • Framed-Protocol. Specifies the protocol for a Framed-User. Valid values
    are PPP and SLIP.


    +   • Framed-IP-Address. Specifies the IP address for the user. In most NAS vendor''s
    implementations, leaving this blank allows the NAS to hand out a dynamic IP address
    based on a pool defined by NAS. If it is set to 255.255.255.255, it allows the
    user to request an IP address. If it is set to 255.255.255.254, the NAS equipment
    gives the user an address from its dynamic IP pool.


    +   • Framed-IP-Netmask. Specifies the netmask for the user. If omitted, most
    NAS equipment will use 255.255.255.255.


    +   • Framed-Route. Specifies a route for the NAS equipment to insert into its
    routing tables. The form is <Destination Network IP>/<Network Mask Length><Gateway
    IP Address> <Hop count>. The uses of Framed-Route are discussed later in the chapter.


    +   • Framed-Routing. Framed-Routing defines how broadcast protocols are handled.
    Valid values are None, Broadcast, Listen, and Broadcast-Listen. If you wanted
    to send broadcast routing information to a connected user, but not listen to any
    the user may send you (a good idea for security reasons), you would set Framed-Routing=Broadcast.


    +   • Filter-Id. Specifies a filter identifier to be associated with the user''s
    connection. These can be handled slightly different to various NAS equipment.
    For example, on Lucent Portmaster equipment, if you specify Filter-Id="safe",
    the NAS will look for filters defined in its configuration (called safe.in and
    safe.out) and apply whatever filters it finds in the appropriate direction (in
    or out). Cisco equipment, on the other hand, requires that Filter-Id be set to
    the access-list number followed by .in or .out, depending on which direction the
    filter should be applied. For example, Filter-Id="110.in" would cause Cisco equipment
    to apply access-list 110 inbound to form the user''s connection. Check with your
    NAS equipment documentation to determine how to use Filter-Id with your equipment.


    +   • Framed-MTU. Specifies the Maximum Transmission Unit size for the Framed-User
    connection.


    +   • Framed-Compression. Specifies the compression type. Valid values are None
    and Van Jacobson-TCP-IP (which would allow Van Jacobson TCP/IP header compression).


    +   • Session-Timeout. Specifies the maximum session length in seconds. Setting
    this value to 600 would limit connections to 10 minutes in duration.


    +   • Idle-Timeout. Specifies the maximum idle time for a connection. Setting
    this value to 600 would result in connections being dropped after 10 minutes of
    idle time.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# # Creating a New User


    To add users you will need to modify the users file, located in /etc/raddb. The
    users file that comes with the radius source contains some example users. Before
    you use this file, remove the example entries, either by deleting them or by adding
    a # character to the start of each line. If you don''t remove the example entries,
    you will be opening up your RADIUS clients to all OpenLinux users, which is something
    you don''t want to do.


    Simply add the user and appropriate check and reply items to the users file. Here
    are some examples:


    Joe is a dial-up user, dialing in to establish a PPP session, and will receive
    a dynamic IP address by the NAS equipment answering his call:


    ```

    Auth-Type=Local, Password="password"


    Service-Type=Framed-User,


    Framed-protocol=PPP,


    Framed-IP-Address=255.255.255.254,


    Framed-IP-Netmask=255.255.255.255,


    Framed-Routing=None,


    Framed-Compression=Van-Jacobson-TCP-IP

    ```


    This entry is long for a single dial-in PPP user; however, it can be greatly simplified
    by exploiting defaults of RADIUS and of many NASes. When you have thousands of
    users, keeping each entry to the minimum required will save you space and time.
    The simplest form of the above is:


    ```

    Password="password"


    Service-Type=Framed-User

    ```


    Mark is a uucp mail customer of an ISP. The ISP runs uucpd on a mail server located
    at 192.168.14.22. The RADIUS entry that ISP is probably using is:


    ```

    Password="getmail"


    Service-Type=Login-User,


    Login-Server=Telnet,


    Login-IP-Host=192.168.14.22,


    Login-TCP-Port=540

    ```'
  merge: -1
  pgno: 207
- img_proc: true
  md: "# radiusd Configuration Files 189\n\nThis simplifies dial-in scripting and\
    \ NAS configurations on the part of the customer and ISP.\n\nUser Tom dials in\
    \ with several different computers, using a variety of servers. He wants to connect\
    \ to his PC via PPP, an older computer that uses SLIP, and from a terminal and\
    \ modem, to access his collocated OpenLinux server at his ISP. The following entries\
    \ in the ISP's users file provide Tom with the multiple types of accesses he needs:\n\
    \n```\ntom Auth-Type=system, Suffix=\".ppp\"\n  Service-Type=Framed-User,\n  Framed-Protocol=PPP\n\
    ```\n\n```\ntom Auth-Type=system, Suffix=\".slip\"\n  Service-Type=Framed-User,\n\
    \  Framed-Protocol=SLIP\n```\n\n```\ntom Auth-Type=system, Suffix=\".shell\"\n\
    \  Service-Type=Login-User,\n  Login-Service=rlogin,\n  Login-IP-Host=192.168.10.2,\n\
    \  Login-TCP-Port=513\n```\n\nHere the ISP also uses the Unix system's authentication\
    \ mechanism.\n\nUser Jane has a dialup account with her ISP. Her ISP also offers\
    \ a Web filtering service (by using http proxy). Jane has to two file entries.\
    \ One is a normal dial-up and the other enables filters that will not allow Web\
    \ access to the outside world by invoking a filter called kidssafe on the NAS\
    \ device. This prevents Jane's children from accessing the Web without going through\
    \ the content filtering service her ISP offers. Here are Jane's two entries:\n\
    \n```\nJane Auth-Type=system\n  Service-Type=Framed-User,\n.Jane Password=\"mykids\"\
    , Suffix=\".filtered\"\n  Service-Type=Framed-User,\n  Filter-Id=\"kidssafe\"\n\
    ```"
  merge: -1
  pgno: 208
- img_proc: true
  md: 'XYZ corporation has a dialup connection. They have a 16 IP address range of
    192.168.2.16 through 192.168.2.31. They also have a static IP address of 192.168.42.18.
    The ISP configures RADIUS so that the NAS user dials into it is told about how
    to insert the customer''s LAN information into its routing tables. When the customer
    logs in, the NAS knows how to reach the customer''s addresses, it could then share
    via another routing protocol within the ISP''s network. Here is the RADIUS entry
    used:


    ```

    xyzlan Password="xyzpass"


    User-Service-Type=Framed-User,


    Framed-Protocol=PPP,


    Framed-Address=192.168.42.18,


    Framed-Netmask=255.255.255.255,


    Framed-Route="192.168.2.16/28 192.168.42.18"

    ```


    Another useful RADIUS feature is the DEFAULT feature of the users file. A users
    file can be trivially simplified if everyone in the OpenLinux''s password file
    has PPP based on network access. This is all that is required:


    ```

    DEFAULT Auth-Type=system


    Service-Type=Framed-User,


    Framed-Protocol=PPP

    ```


    This is a nice feature, but keep in mind that accounts like root, and other system
    accounts on the server (as well as accounts you may have added for (httpd)) that
    have valid passwords, can also authenticate for PPP network access.


    RADIUS has many features that make these highly configurable, flexible user entries
    to be created. NAS vendors also have several of their own features, which can
    usually be added to RADIUS by incorporating the vendor specific attributes into
    the dictionary file.


    # Deleting a RADIUS User


    To delete a RADIUS user, either delete the username and attributes from the users
    file in /etc/radabb, or place a # character at the start of each line for the
    user. Keep in mind that if you are using a DEFAULT user with system passwords,
    you must instead delete the user account from your OpenLinux system.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Changing a User''s Password


    Change a RADIUS password by changing the Password attribute for the user account
    in the users file. Because the file can be accessed only by the root user, only
    the root user can change a RADIUS password.


    Of course, users that have their Auth-type set set to system, can change their
    passwords through the normal OpenLinux means. This includes any users covered
    by a DEFAULT users entry.


    # Connecting to a RADIUS Client


    Before you try to connect to a RADIUS client machine, such as a Lucent Portmaster,
    both the hostname and the shared secret of the client need to be added to the
    /etc/raddb/clients file on your server. Listing 10-4 shows an example of this
    file.


    Listing 10-4 The /etc/raddb/clients file, containing a list of hostnames of RADIUS
    clients, and their shared secret


    | RADIUS Client | Shared Secret |

    | --- | --- |

    | portmaster | trustme |

    | localhost | testing123 |


    Each RADIUS client will need to be listed in this file, or else radius will not
    let it authenticate users. For this to work, the shared secret in this file must
    be configured separately on the client side. Shared secrets consist of up to 14
    ascii characters. No whitespace characters are allowed in a shared secret. There
    are no limits to the number of clients in the clients file.


    # RADIUS Accounting


    RADIUS accounting daemon is a child process of the RADIUS authentication daemon.
    It starts when you start RADIUS, and it listens on port 1646. RADIUS clients send
    accounting information when users connect and disconnect from provided services.
    Logs go to /var/adm/radct/detail. Each record in the logs has a time-stamp and
