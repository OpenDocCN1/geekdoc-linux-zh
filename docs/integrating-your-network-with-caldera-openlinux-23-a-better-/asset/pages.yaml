  md: '# FTP Clients


    There are many FTP clients from which to choose, including the FTP client called
    ftp. Other FTP clients available in your OpenLinux neftp and pfpt. In addition,
    there are numerous FTP clients written for the X Window system for those who like
    to point and click. Netscape Communicator, gFTP, and IglooFTP are some of the
    more common FTP clients available for the X Window system. Check out www.linuxberg.com
    or www.freshmeat.net for the latest alternative FTP clients.


    ![](img/9102b40bb114da6b158a518630807d57_165_0.png)


    To see which version you have installed, just type ftp localhost at the Linux
    command line; the FTP client will display the version number.


    # Types of FTP Accounts


    There are three different types of user accounts available to reach an FTP server:
    guest, real, and anonymous. The guest account is basically your OpenLinux account;
    you can use your user account (Linux login account and password) directly on that
    FTP server—but after logging in, you can access only your home directory. The
    real account differs from the guest account in that with this account, you have
    access to the whole file system.


    Finally, the anonymous account is to be used if you don''t have an account on
    that FTP server. In fact, the anonymous account is really your OpenLinux account
    called "ftp" (as you can confirm by examining the /etc/passwd file, or by using
    the username ftp when accessing the FTP server). This account has no password,
    so you can use whatever password you want. Typically, your e-mail address is used
    as the password for the anonymous FTP account; with an anonymous account, you
    are dropped into the /home/ftp directory, which becomes your root directory. This
    is similar to the guest account, except that anybody can use this anonymous FTP
    account, on which there is no password protection.


    The following is a summary of the three types of FTP accounts.


    | Account Type | Description |

    | --- | --- |

    | Anonymous | FTP account is named anonymous or ftp. Password can be anything,
    because there is no password verification. All users of this account can access
    only FTP directories and files that are public. Most FTP sites offer this account
    to promote sharing of files for the public. |'
