    Fatal 10 error: client killed


    This happens because ssh proxies the X application''s screen output so it can
    be encrypted back across your connection. X uses authentication to determine who
    can display on which machines; changing usernames confuses the authentication,
    so ssh does not allow the application''s display. The easiest way to remedy this
    is by connecting to the remote machine as the user you need to run applications
    as; because ssh allows connections as root, this is preferred.


    You can instead bypass the ssh proxy and have your application directed to your
    local machine. This has the side effect of disabling the encryption inherent in
    ssh for your X applications, however, the connection is no longer secure. If you
    want to do this, first you need to reset the DISPLAY variable on the remote machine
    by pointing it to your local machine. Type a command like the following:


    ```

    -x DISPLAY=settle:0

    ```


    settle should be the hostname of the local machine, and :0 is your X server number
    (:0 is the first display, and :1 is the second; most of the time, you need :0).
    On your local machine, type the following:


    ```

    xhost +saltlake

    ```


    saltlake should be the hostname of the remote machine. This line tells your local
    server to allow connections from the saltlake machine. If you forget to enter
