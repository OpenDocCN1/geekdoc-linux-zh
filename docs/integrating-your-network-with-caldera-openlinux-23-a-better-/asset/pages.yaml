    IP address. You can also tell it whether the network interface should be active
    at boot.


    If OpenLinux does not load the proper driver, you cannot configure your network
    card until you load a proper driver. From this window, choose New Device. This
    allows you to load a new driver, and brings up a list of devices, as shown in
    Figure 2-5.


    After you select your card from the list, you are presented with options for setting
    up that card, which could be anything from an IRQ and base address to debugging
    and duplex options. After you enter this information, you can configure the card''s
    IP address and more from COAS. (The options shown in Figure 2-6 are for an Intel
    EtherExpress 100 card.) If your card is not on this list, it is not supported
    by Open-Linux 2.3.


    # Assigning Multiple IP Addresses to an Interface


    You might want to assign a second or third IP address to one network card. Known
    in OpenLinux parlance as IP Aliasing, you can easily accomplish this with the
    COAS tool. From the Ethernet Interface Configuration window, choose New Aliases.
    You are prompted with a window looking almost exactly like the window you just
    showed; the two differences are that this window does not have any information
    filled in, and the network device has a :0 appended to it, which stands for the
    first alias (:1 is the second alias, :2 is the, and so on). From this window,
    you can configure the second IP address (or the third, the fourth, and so on),
    just as you would the first. (See Figure 2-7.)'
