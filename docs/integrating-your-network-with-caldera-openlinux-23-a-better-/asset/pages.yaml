  md: '# Chapter 7: Configuring SMTP E-mail with sendmail and procmail


    (mypc.domain.com). Any and all domains, sub-domains, and hostnames where or anyone
    else will be receiving mail need to be enumerated. On my mail server, saltlake.cheek.com,
    I use the following:


    +   - cheek.com

    - mail.cheek.com

    - saltlake.cheek.com


    In my DNS records I have aliased mail.cheek.com to saltlake.cheek.com, and have
    made my saltlake machine the default mail exchanger for the entire domain. So
    mail sent to joseph@cheek.com, joseph@mail.cheek.com, and joseph@saltlake.cheek.com
    will get sent to my primary mail server. Any mail sent to a different machine,
    such as seattle.cheek.com, will get directly to my seattle machine.


    If you will send internal (in-house) e-mail to this machine, permits from one
    employee to another, it is also a good idea to include the local part of the host-name,
    such as mail or saltlake, so that mail receives joseph@mail.com, for instance,
    on this list will be accepted. Any mail sendmail destines from one of the machines
    on this list will be delivered locally; any mail sent to a different machine will
    be forwarded (or perhaps discarded, if mail relaying is turned off).


    Another set of domain names to add to the list are any virtual hosts whose mail
    you will host. If your company is an ISP, or you have multiple domain names, add
    those to this, so that sendmail knows to receive mail for them also.


    These hostnames and domain names need to be listed, one per line, in the file
    /etc/sendmail.cw. The list for my machine is shown in Listing 7-1; because I host
    virtual domains, I list them below as domain1.com, domain2.com, and domain3.com.
    (Note that any changes to the /etc/sendmail.cw require restart of the sendmail
    mail server to take effect.)


    # Listing 7-1 An example /etc/sendmail.cw file


    ```

    # sendmail.cw - include all aliases for your machine here.

    cheek.com

    saltlake

    saltlake.cheek.com

    mail

    mail.cheek.com

    domain1.com

    domain2.com

    domain3.com

