    exist: /usr/lib-install/html/badfile.html

    ```


    This line does not give me much detail, but it is nice enough to give me the full

    pathname on the file system of the file Apache tried to retrieve. It''s much easier
    to

    check this file for this reason. Apache logs a failed file request twice because
    most log

    alyzers do not check the error log, only the access log.


    It can be difficult to wade through an entire log file when looking for something

    specific. The grep command will return only those lines with a specified keyword
    in

    them. To look at the access log lines from aol.com, try:


    ```

    grep aol.com /var/log/http/apache/access_log

    ```


    Only lines with the text "aol.com" would be shown. Because America Online is a

    pop service, you might still have hundreds or thousands of lines from this

    command. To show only the last 10 lines of output, combine the grep command with

    a pipe character (l) and the tail command:


    ```

    grep aol.com /var/log/http/apache/access_log | tail

    ```


    Now only the last 10 aol.com accesses are shown. If you wanted to search the last

    access for aol addresses, you could combine these commands in the reverse

    order:


    ```

    tail /var/log/http/apache/access_log | grep aol.com

    ```


    grep has many more search abilities for text files like these Apache logs.

    can learn about the advanced searching capabilities of this command by

    typing man grep to view its manual page.


    ![](img/9102b40bb114da6b158a518630807d57_134_0.png)'
  merge: -1
