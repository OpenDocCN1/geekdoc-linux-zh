- img_proc: true
  md: '# Configuring squid


    use COAS. (For more information on dialog COAS, see Chapter 2, “Configuring-Linux’s
    Basic Network.)


    The rc script also comes with a command to restart squid when it is already running
    (You need to tell squid to restart after any change to the squid.conf file.) To
    do this, give the script restart parameter:


    ```

    /etc/rc.d/init.d/squid restart

    ```


    # Configuring the Client Machine''s Web Browser


    Up to this point, each user''s machine probably is configured for direct Internet
    access, without a proxy. Each machine needs to be told to the proxy, and needs
    to be told how to reach it. The specifics of how to do so depend on the Web browser,
    the basics are the same: Configure each browser to the hostname of your OpenLinux
    server as the proxy server with a port of 3128, or whatever port you chose to
    use. Here''s an example for the Netscape Navigator browser, which comes with OpenLinux
    2.3.


    +   1. Choose Preferences from the Edit menu.

    2. Expand the Advanced tab in the resulting dialog box.

    3. Choose Proxies from the expanded menu.

    4. Click the radio button for Manual proxy configuration, and then click the View
    button.

    5. Enter the hostname of the OpenLinux server and the port that squid uses, as
    the values for FTP Proxy, HTTP Proxy, and Security Proxy.

    6. Click OK in each of the dialog boxes to return the browser window.


    With Netscape Navigator 2.0 and higher you can automatically configure proxy servers.
    You do this by creating a javascript file on your webserver that will instruct
    Netscape where your caches are. You then tell your browser where this javascript
    file is, and it will automatically configure your proxy servers.


    In order to do this, you will have to edit your webserver''s mime.types file (/etc/httpd/apache/conf/mime.types),
    and add:


    ```

    application/x-ns-proxy-autoconfigpac

    ```


    Then restart your webserver:


    ```

    /etc/rc.d/init.d/httpd stop

    ```


    ```

    /etc/rc.d/init.d/httpd start

    ```'
