  md: '# Troubleshooting with lynx


    The lynx Web browser is a quick and easy browser that works well for simple website
    troubleshooting. Because it is text-based, it does not require the overhead of
    X11. lynx can be used to force a query to a specific Web site, so you can then
    check the access and error logs for Apache''s response to that query. lynx can
    be given the URL on the command line, such as:


    ```

    lynx http://localhost/

    ```


    This renders the localhost Web page on a text screen. If you would rather see
    the source, you can use the -source option:


    ```

    lynx -source http://localhost/

    ```


    If you don''t care about viewing the Web page and just want to force a request,
    redirect the output to /dev/null:


    ```

    lynx -source http://localhost/ > /dev/null

    ```


    This forces a request and throws away the output. Don''t forget to use -source
    when redirecting the output, so that lynx will exit when done.


    # Web Statistics Analyzers for Use with Apache


    An important part of maintaining a Web site is getting statistical reports on
    how much traffic the site is generating, where it is coming from, where what errors
    are being received, and so on. Apache does not come with any statistical programs,
    but there are two programs I recommend for this purpose. The first is Analog,
    a freeware program, which takes an Apache log file and produces reports based
    on the information in the log file. A much more advanced program for generating
    Web usage statistics is WebTrends, which is commercial software. (Unfortunately,
    they don''t produce the Logfile Analyzer for Linux; they offer only the more expensive
    Enterprise Reporting Server, which generates real-time reports of great depth
    and detail.)'
  merge: -1
