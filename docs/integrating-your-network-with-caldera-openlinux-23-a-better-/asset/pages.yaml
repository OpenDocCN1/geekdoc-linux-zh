- img_proc: true
  md: '# Chapter 11: Building a Firewall with iptchains


    It might seem like there is a great deal going on just to retrieve the Web page,
    but in reality, it isn''t very much for the firewall or any other computer to
    process. Because this was a proxy, the Web server thinks the request was made
    by the firewall and there aren''t any additional computers on the network. From
    your computer, the request was sent only to the firewall. This benefits the System
    Administrator because request passes through the firewall (a very easy to log
    traffic). As I mentioned previously, the only problem is that there is a limited
    number of services that can be provided this way. Even though additional ports
    are used, there is no problem because there are 65,536 ports available for use,
    and only 1,024 of these ports have defined functions associated with them.


    Standard masquerading does not have a proxy—all the masquerading is performed
    by the kernel instead of special proxies, which is simpler. If this is simpler,
    why isn''t it used for all masquerading? Proxies have benefits other than just
    simple masquerading. For example, squid can cache requests for the Web, which
    frequently-accessed Web pages appear without traversing the Internet. Proxies
    also typically provide logging features, which can help the System Administrator.


    In the kernel-level process, each packet is rewritten as it passes through the
    firewall. The outbound requests appear as if they come directly from the firewall
    (like a proxy without the proxy), and the inbound packets appear as if they come
    directly from the requested location.


    The rewriting process can be CPU-intensive, and with some protocols, fairly inefficient.
    To combat this problem there are specific kernel modules for individual cases.
    There are modules for quake, real audio, ftp, and so on. Precompiled masquerading
    firewall modules in OpenLinux are located in the /lib/modules/(kernel version)/ipv4/


    As with traditional proxies, the packets from your local network cannot go to
    the Internet without passing through the packet filter, vice versa. In some cases,
    there are no kernel modules, and the process of rewriting each packet through
    the CPU is too intensive. In such situations, the kernel changes only the header
    information of the packet, and uses the auto forwarding feature in the kernel.


    The section on standard proxies describes the process of a request to obtain a
    Web page from a browser. The following steps demonstrate how this process works
    in a standard masqueraded network.


    +   1. The computer (192.168.1.52) connects to the firewall''s internal network
    interface (192.168.1.1) on port 80 (no special configuration of the browser is
    required). The firewall is the default route for the computer''s requests.


    +   2. The firewall acknowledges the request and tells your computer to go to
    port 3587 for further communication.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Configuring ipchains


    +   3. The firewall looks up the DNS entry for the request.


    +   4. The firewall connects to the Web server on port 80. It acknowledges the
    request and tells you to go to port 3248.


    +   5. The Web server sends the data to the firewall using port 3248.


    +   6. The firewall rewrites the packets and sends them on port 3587 as it receives
    them (the firewall does not need to receive the entire Web page, picture, or song
    before retransmission).


    +   7. The computer''s browser processes the page as it comes from the requested
    site (with little delay, because the firewall sends the packets as they are received).


    In this case, the computer thinks the Web page came directly from the requested
    site. With a proxy, however, your computer thinks the Web page came from the firewall
    and the Web server thinks the request came directly from the firewall.


    # Linux''s Firewall Features


    The firewall features in the Linux kernel are made up of chains of rules. Rules
    consist of a set of matching criteria and a target. When the packet matches the
    criteria of the rule, the kernel looks to the target to decide what to do with
    it. That target can be another user-defined rule to match the packet again, or
    an internal action telling the kernel what to do with the packet.


    The ipchains program controls the chains stored in the running kernel. By having
    a separate program, you can add or remove rules without having to recompile the
    kernel. It also allows you to view statistics about the matching of each particular
    rule in a chain.


    # Configuring ipchains


    The ipchains program allows you to control, modify, and inspect the chains in
    the kernel. Each rule in the chain will have its matching criteria and the associated
    target. Targets are either user-defined chains, or the kernel built-in actions.
    These actions are ACCEPT, DENY, REJECT, MASQ, REDIRECT, and RETURN. See table
    11-1 for a description of the kernel built-in actions.


    The three built chains, are input, output, and forward. They are applied to packets
    as their names. Packets arriving on an interface are evaluated against all input
    rules that apply to that interface. Packets leaving the firewall are evaluated
    against the output rules that apply to the outbound interface. Finally, packets
    that are being forwarded through the box are evaluated against the rules in the
    forward chain. User-defined chains can be written, and may be used as targets
    in other chains (user-defined, or system built-in chains).'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Chapter 11: Building a Firewall with ipchains


    | | | |

    |---|---|

    | ACCEPT | Let the packet through. |

    | DENY | Drop the packet. |

    | REJECT | Drop the packet and send an ICMP message back to the sender indicating
    that it was dropped. |

    | MASQ | Masquerade the packets as if they came from the firewall host. Return
    packets will demasqueraded automatically (this can only be used on the forward
    chain). |

    | REDIRECT | Redirects traffic to a port local on the firewall. Used for transparent
    proxying (see the chapter "Configuring the Apache Web Server") (This target can
    only be used on the input chain and user-defined chains). |

    | RETURN | With this target, the next rule to be examined will be the next rule
    in the chain that called the current chain. there is no calling chain to return
    to, the chain policy target is used.|


    The ipchains command has many options to allow you to control and inspect the
    chains. Each rule you define will be added to the chains with individual ipchains
    commands; one per rule. The command line options for ipchains are documented in
    Table 11-2.


    To create a firewall rule, you need to use a chain, target, and at least one rule
    (typically several). All firewall rules are executed in the order of creation.
    You can change this by changing the index of the rule. Table 11-2 lists commands
    (ipchain command line options), along with a short description of each.


    # Table 11-2 ipchains Command Line Options


    | Code | Name | Description |

    |---|---|---|

    | -A | Append | Adds one or more rules to the chain. |

    | -D | Delete | Deletes one or more rules from the chain. To do this by numbering
    1 - ... (top to bottom) or by matching the rule. |

    | -R | Replace | Replaces a specific rule. You must specify—if there is ambiguity
    due to matching addresses, the replace function will fail. With deletion, you
    can specify the rule by number 1 - ... (top to bottom).'
  merge: -1
