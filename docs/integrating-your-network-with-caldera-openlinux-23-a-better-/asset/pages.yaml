    # ## Creating a Print Queue


    Now that you have configured your printer, you will want to make the print queues.
    One of the advantages of LPRng over LPR is the program checkpc, which automatically
    sets up this information. At a command line, you need to type:


    ```

    checkpc -f

    ```


    This sets up your print queues and permissions. You can modify the permissions
    by editing the /etc/lpd.perms file. For further information on this file, you
    can type man 5 printcap. The lpd.perms is fairly easy to understand because it
    is commented very well.


    # ## Starting and Stopping LPRng


    As an administrator, you may occasionally need to interrupt printing services
    on your network. LPRng is easy after it is configured: all you have to do is load
    the daemon lpd and you have started LPRng. Although this starts LPRng, you might
    want to do an analysis of what is going on. To do this you can go to /var/spool/lpd/(ps
    or lp) and check your status and logs, or you can simply use the following software
    that is specifically designed to assist you with this analysis.


    +   - Lpc a program responsible for sending requests to the daemon. You can run
    the program from a command line and take various parameters, such as: priority-level,
    number of copies, debug verbosity level, and so on. Find further details on it
