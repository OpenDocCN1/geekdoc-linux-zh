    # Typical WU-FTPD Configuration


    Now, let''s examine how OpenLinux configures the FTP software. Unfortunately,
    there is no GUI administration tool for configuring all of WU-FTPD. There is a
    tool called linux that will generate the /etc/ftpaccess file for you, based on
    a form you will fill out. Configuring WU-FTPD requires editing configuration files
    from the root account. The good news is that OpenLinux does a decent job of setting
    up WU-FTPD out of the box. Let''s first take a look at the core executable file
    and configuration files.'
