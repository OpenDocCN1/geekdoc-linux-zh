  md: '# Chapter 1: Introduction to Caldera OpenLinux 2.3


    Internet service providers and companies with a large number of remote employees
    set up their dedicated dial-in-server, such as a Lucent Portmaster, along with
    other services on a machine such as an OpenLinux server.


    Radius is the protocol that lets the Portmaster talk with the OpenLinux server,
    determining who is allowed to access network services and what they are permitted
    to do. It is described in Chapter 10, "Configuring Radius with Lucent''s radiusd."
    That chapter explains how to obtain, install, and configure the server on the
    OpenLinux side, as well as the Portmaster.(Most of the information presented is
    applicable to other Radius clients, such as Lucent''s Ascend MAX switches.)


    OpenLinux can handle all aspects of remote access by itself, such as controlling
    the modems, by authentication, and providing other services, such as Internet
    connectivity, but in large installations it is not always wise to do it so. Having
    a single server provide remote access in servicing Web pages, file transfers,
    LAN and printer sharing, e-mail and Internet access, and more can even a large,
    dependable server. Offloading the remote access to a dedicated machine is a good
    way of reducing the burden on OpenLinux, allowing it more processing power for
    its other functions. Additionally, Radius provides logging and accounting information
    about remote access, giving companies all the details necessary for billing and
    statistical purposes. Portmasters are not the only Radius-enabled remote access
    solutions, but they are certainly the most common.


    # A Firewall Configuration Tool: ipchains


    Companies interested in protecting their servers and data from exploitation on
    the Internet are deploying firewalls to restrict access to sensitive data. Firewalls,
    however, are not the only method of system security; other security methods, such
    as use of proxy servers and network address translation (IP masquerading), can
    provide more security than firewalls and may be better suited to your network
    environment.


    The utility that controls firewall and network address translation configuration
    on OpenLinux is called ipchains. With ipchains, you can build a chain of rules
    for determining whether Internet Protocol packets are processed on your OpenLinux
    server. The name ipchains used because of its use for configuring chains of IP
    packet rules. Each rule tells OpenLinux what to do with an IP packet it receives,
    whether to accept it, deny it, masquerade it, and so on. Security is enhanced
    when packets are stopped by the firewall, or other tools, that attacks against
    your network can be minimized.


    Whether a firewall, proxy server, or IP masquerading configuration is most applicable
    in your network depends greatly on your network setup and what security you wish
    to achieve. Chapter 11,"Building a Firewall with ipchains," discusses how to configure
    a firewall using the ipchains utility provided with OpenLinux.'
  merge: -1
  pgno: 31
