  md: '# Managing Network Services


    You can use COAS to bring the network up and down, and to enable and disable many
    system services (such as e-mail, DNS, NFS). Some system services, notably those
    run from the inet daemon, cannot be managed from COAS; you must configure these
    with shell commands and through changing of configuration files. This section
    shows you how to deal with these network management issues.


    # Bringing the Network Up and Down


    COAS allows you to toggle networking on or off from the same screen that allows
    you to enable and disable IP Forwarding (These settings are permanent, so they
    are saved after a server reboot.) From the COAS main menu, choose Network Administration,
    TCP/IP Network Options. This brings up the Networking Options menu shown previously
    in Figure 2-8.


    Most of the time, instead of disabling networking permanently, you will just want
    to bring the network down to troubleshoot an issue; this is easily accomplished
    through the use of runlevels. Runlevels tell OpenLinux what the server is in,
    whether it is booting, rebooting, coming up in single-user or multi-user mode,
    whether networking is enabled, and so on. There are seven defined runlevels in
    OpenLinux, shown in Table 2-1.


    Table 2-1 Runlevels and their meanings in OpenLinux

    | Runlevel | Meaning |

    | 0 | Halt (the system is going down for a halt). |

    | 1 | Single-user mode (network cards are initialized, but the network is not
    up). |

    | 2 | Multi-user mode (the network is up, but most network services are not).
    |

    | 3 | Full multi-user mode (full networking, the default if X Windowing is not
    configured). |

    | 4 | Unused. |

    | 5 | Full multi-user mode with X Windowing (the same as 3, but an Windowing logon
    is displayed). |

    | 6 | Reboot (the system is going down for a reboot). |'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'If you have the X Window System working and enabled, your standard runlevel
    is 5; otherwise it''s 3. Telling the system to change its runlevel is the easiest
    way to bring network services up and down temporarily. I often take an OpenLinux
    system to runlevel 1 to troubleshoot and fix a core network problem, or load a
    system-level patch; the easiest way to do this is by issuing the *init* 1 command.


    ![](img/9102b40bb114da6b158a518630807d57_45_0.png)


    Do not enter runlevel 1 if you are not at the console of the machine—if you are
    logged remotely over a network connection, this shuts off your network connection
    and leaves the system in an unusable state.


    This disables all networking and most system services, including X Window. All
    users will be logged off, and you will be left with a single shell prompt on a
    console terminal. (After doing your maintenance, you can re-enter runlevel 3 or
    5).


    ![](img/9102b40bb114da6b158a518630807d57_45_1.png)


    If you are using a system purely as a server, you might want to boot to runlevel
    3 instead of 5. Booting to runlevel 3 does not initialize the X Window System,
    which takes up a lot of memory on the server. To change this permanently, edit
    the /etc/inittab file, and change the line beginning with id:5 to id:3.


    # Starting and Stopping rc Network Services


    rc scripts control many network services. These services can be enabled or disabled
    through COAS''s System Administration menu. From the COAS KDE menu, choose System,
    Daemons. If you are running coastool, you must choose System Administration, Enable/disable
    system services. Either way brings you to the dialog box shown in Figure 2-9.


    This window has many services listed, each with a checkbox to the left of the
    service name. Checked boxes are enabled at startup; unchecked ones are not. You
    can specify exactly which services you want to be enabled after a normal (runlevel
    3 or 5) by checking and unchecking these services.


    Unfortunately, altering these checkboxes in this dialog does not immediately start
    or stop the particular service; it tells OpenLinux whether to start the service
    after a reboot. To start or stop services immediately, you must do so by hand
    using that particular service''s rc script. Each of these scripts is found in
    the /etc/rc/init.d directory, and can be called with parameters of start or stop
    to immediately start or stop the corresponding service. For instance, to stop
    the NFS service, use the following command:


    ```

    /etc/rc/init.d/nfs stop

    ```'
  merge: -1
  pgno: 45
