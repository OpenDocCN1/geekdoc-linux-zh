  md: '# Chapter 9: Configuring UseNet News with inn


    You can use the UseNet server that comes with OpenLinux, inn (InterNet News),
    to provide discussion group services on a worldwide, company-wide, or local basis.
    This chapter explains how to configure a small UseNet server, suitable for hosting
    a few newsgroups. inn can handle much more, but as the load grows the configuration
    becomes considerably more complex, going beyond the scope of this book.


    # Files Referenced in this Chapter


    The following files are used by OpenLinux''s innd packages:


    | File | Purpose |

    | --- | --- |

    | /etc/cron.d/lib/news.daily | Handles daily news maintenance |

    | /etc/cron.d/lib/news.hourly | Handles hourly news maintenance |

    | /etc/news/inn.conf | This is the general inn configuration file |

    | /etc/news/nnprp.access | Defines which machines can read and post to your server
    |

    | /etc/news/overview.fmt | Defines how much detail to give in each overview file
    |

    | /etc/news/expire.ctl | Defines when articles should be expired (purged) from
    the system |


    # UseNet Overview


    UseNet, also called NetNews, is commonly referred to as “the world’s largest bulletin
    board.” Short for User Network, UseNet started out as a way to distribute messages
    on computers without needing a single computer to store them all at once; many
    computers could share the load. Today, UseNet is a global information, and messaging
    service, the largest of its kind. A few needless comprising all UseNet newsgroups
    and articles are dozens, if not hundreds, of gigabytes a day, comprising millions
    of messages. For this reason, many smaller systems place restrictions on the amount
    of UseNet information they will carry.


    UseNet messages, called articles, are placed into discussion groups, called newsgroups.
    Each group name consists of several abbreviated words, separated by periods (.),
    with the most general category being the first word in the name, the most general
    name the next word, and so on until the last word in the name is the most specific
    one. An example of this is the newsgroup alt.linux.caldera; alt means-alternative
    news, os means dealing with Operating Systems, linux means'
  merge: -1
  pgno: 189
- img_proc: true
  md: "# UsNet Overview\n\nwith the Linux Operating System, and caldera means dealing\
    \ with Caldera Systems'\nversion of the Linux Operating System, or OpenLinux.\n\
    \n# Introduction to inn\n\nBecause UsNet is distributed, there is no governing\
    \ authority per se, although the\nInternet Software Consortium does a lot of work\
    \ with UsNet. Each site is respon-\nsible for the maintenance of messages sent\
    \ through it. Even with sophisticated\nrograms, setting up and maintaining a UsNet\
    \ server requires some day-to-day\nwork. inn needs a fair amount of customization\
    \ to work well.\n\nAs with many programs on OpenLinux, inn refers to the suite\
    \ of programs\nand not to the individual executable names themselves. There are\
    \ more than\twenty actual programs that are executed at some point or other, the\
    \ most\npopular of which is innd, the Internet News Daemon.\n\n![](img/9102b40bb114da6b158a518630807d57_190_0.png)\n\
    \nNOTE\n\n# Planning for a UsNet Server\n\nWhen you decide to run a UsNet server,\
    \ there are a few planning issues to consider\nbefore setting it up. First, how\
    \ much of the entire UsNet system do you want to\ncarry? If your answer is \"\
    all of it,\" pause a moment to reconsider. Carrying the entire\nUsNet newsfeeds\
    \ garg computing resources; do not it if you have a T-1\nInternet connection and\
    \ a few gigabytes of hard disk space—that won't be enough.\nExpect it to take\
    \ 50 to 100 gigabytes of storage and to max out a T-3 connection.\nConsider carrying\
    \ only part of UsNet if you don't have enough—or don't want to\nuse that much—storage.\n\
    \nNext consider why you want to run a UsNet server. If you are a small ISP and\
    \ just\nto provide a news server for your customers, trying one of the news\n\
    outsourcing companies, such as SuperNews and GigaNews. They let you use their\n\
    servers for news, and your customers know that you don't keep your news\nsystems\
    \ yourself. Using such services can save you a lot of hassle and headache.\n\n\
    Many software companies, including Microsoft, use UsNet to provide forums for\n\
    feedback on their products. Having your own news server allows you to keep track\
    \ of\nwhat messages and newsgroups you want to carry (that is, only that part\
    \ to\nyour business) and to cut maintenance costs. You can configure these systems\
    \ so that\ny messages do not propagate to the rest of the Internet, and you can\
    \ assign moder-\nators to each newsgroup so that messages can be approved before\
    \ they are posted."
