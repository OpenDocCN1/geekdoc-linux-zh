  md: '# Configuring Server Request Management


    According to the /etc/httpd/apache/conf/srm.conf file, server request management
    consists of defining "how requests are serviced, and how results should be formatted."
    Edit this file, and look for these lines:


    DirectoryIndex.html


    +   - This tells Apache which file to look for when it is not given a filename
    on the URL. Each filename Apache should check needs to be listed here, in the
    order they should be checked. Check this to:


    DirectoryIndex.html index.htm


    +   - Now Apache will look for index.htm after first checking for index.html.
    OpenLinux, like other Linux (UNIX) systems, typically uses index.html for the
    default DirectoryIndex, but Microsoft products sometimes want to use default.htm
    or some other name. If you want other filenames to be checked, such as default.htm
    or home.htm, you can add them here.


    #AddHandler cgi-script .cgi


    +   - Remove the hash mark here to enable Apache to use CGI programs from the
    /home/http/html document root. All files ending with .cgi extension will be treated
    as CGI scripts. Remember that these CGI files must be given world execute permissions.
    Adding .pl here (AddHandler cgi-script .cgi .pl) will allow perl scripts to be
    treated as cgi (without having to use .cgi extension on).


    # Configuring Global Access


    Access rights are determined by the /etc/httpd/apache/conf/access.conf file. Access
    rights determine which machines can access certain files, what directories have
    CGI scripts, which show file contents when there is no Index.html file, and more.


    These are set on a directory-by-directory basis. OpenLinux restricts much by default;
    but makes it necessary to update this file often.


    For security when you do not control the content, consider running independent
    server processes uniquely configured for each virtual domain, or by using suexeccgi
    feature of apache. See the section called "Security Considerations" later in this
    chapter.


    Here''s what to change in this file for a basic server setup. Underneath the <Directory
    /home/httpd/html> line, look for the following:


    ```

    # Indexes FollowSymLinks

    ```'
