    games

    nobody


    The /xterlog file is like an audit trail. It contains all transfer information
    carried out by WU-FTPD, as you will see, it can be very useful in troubleshooting.
    Each transfer entry is composed of a single line, containing the following fields,
    separated by spaces:


    Mon Apr 3 16:22:01 1999 5 ftp.ol123.com 568881 /file.Z a _ ogho@friend.com ftp
    0 *


    The following list describes the fields in the preceding example, moving from
    left to right.


    +   - Mon Apr 3 16:22:01 1999 is the current time in the form DDD MMM dd hh:mm:ss
    YYYY

    - 5 is transfer time in seconds

    - ftp.ol123.com is the remote host name

    - 568881 is the file size in bytes

    - /file.Z is the name of the file

    - a is the transfer type (a for ASCII and b for Binary)

    - _ is one of the four values (concatenated if necessary) described in the following
    table


    This table describes what possible values can be used.


    | Value | Description |

    | C | file was compressed |

    | U | file was uncompressed |

    | T | file was barred |

    | - | no action taken |


    +   - o means the file was sent to the user (o for outgoing) or received from
    the user (i for incoming)

    - g means accessed as guest (a for anonymous, r for real)

    - tho@friend.com is the local username'
