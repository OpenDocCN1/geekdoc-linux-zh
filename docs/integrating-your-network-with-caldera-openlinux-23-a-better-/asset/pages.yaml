  md: '# Table 11-2 ipchains Command Line Options (continued...)


    | Code | Name | Description |

    | --- | --- | --- |

    | -I | Insert | Inserts or places the rule in a specific location based on order.
    For example, 2 makes it the second rule under the specified chain. |

    | -L | List | Lists all the rules of a specified chain. When you do not specify
    a chain, all the chains will be listed (input, forward, and output) in this order.
    |

    | -F | Flush | Removes all the rules under a chain, flushing the chain. If you
    want to delete all or most of the rules, this is typically faster than deleting
    them by one. |

    | -Z | zero | Clears the incrementation of the counters at start-up of the rule.
    This allows your accounting to start fresh. |

    | -P | Default policy | Sets the default action for a chain. You can set it to
    any of the normal targets: ACCEPT, REJECT, DENY, etc. |

    | -M | Masquerading | Allows you to view the masqueraded connections specified
    by rules when you use -L in conjunction with it. You can also use this with -S
    to set/specify the kernel''s masquerading parameters, that is start masquerading
    and set the various time-out values. |

    | -S | Set | Allows you to set the time-out values for tcp, tcpfin, and udp connections.
    If you are required to set all of them (-S tcp 3 tcpfin 6 udp 5). If you do not
    want to change a value, you can type 0. This indicates that you use the current
    value. Because this is setting the time-out values of masquerading in the kernel,
    this option must be used in conjunction with -M. |

    | -C | Check | Checks a rule. You send real packets faking all the parameters
    - (source), -d (destination), -p (protocol), and -i (interface). Your system requires
    you to fill in all the parameters. |

    | -h | Help | Gives you help. |

    | -P | Protocol | Identifies the protocol type that your rule involves. Because
    the same port can be used by multiple protocols, you can specify tcp, udp, icmp,
    or all. |'
  merge: -1
