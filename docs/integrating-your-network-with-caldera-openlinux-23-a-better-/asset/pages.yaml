    # Troubleshooting NFS


    Troubleshooting NFS can be a complex and challenging task for the administrator.
    Hopefully, one of the following scenarios will apply to the symptoms of your NFS
    woes. In each of the following scenarios, it is assumed that both the server and
    client have full network connectivity. A good test of this is to have the client
    ping the server or have the server ping the client. We have also assumed that
    all relevant servers are functioning properly (DNS, DHCP, and so on).


    # Scenario 1


    You are able to create an export, but nfs fails. This is most likely caused by
    either not running portmap or not having nfs compiled in the kernel. For instructions
    on recompiling your kernel see the Appendix.


    # Scenario 2


    You are running nfsd, and when users try to log on, they get an rpc error. This
    is caused by not having portmap running, or because portmap died. You need to
    (re)start portmap or kill and then restart it if it is still running. You should
    then restart nfsd by going to the /etc/rc.cd/init.d/ directory and typing ./nfs
    restart.


    # Scenario 3


    You try to mount your NFS import and you receive the warning permission denied.
    This occurs when you are logged in as someone without the ability to connect to
    the NFS export, or your system is denied the /etc/exports file. This denial could
    also be caused by domain issues, or IP address issues.


    # Scenario 4


    You try to mount your import but the mount fails without an error message. Check
    your kernel and, if applicable, recompile as mentioned above.'
