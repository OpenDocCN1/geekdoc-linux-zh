  md: '# Configuring the Name Resolver


    The /etc/resolv.conf file tells OpenLinux how DNS name resolution is performed.
    A sample file is given in Listing 5-6.


    # Listing 5-6 The name resolution configuration file /etc/resolv.conf


    ```

    # /etc/resolv.conf

    domain domain.com

    search domain.com

    nameserver 127.0.0.1

    ```


    The domain line specifies the domain your OpenLinux machine is in. The tells OpenLinux
    to append the specified domain when no domain is given in the line, which is resolved
    as www.domain.com. The nameserver line tells that when it needs to perform a DNS
    lookup, it should use the nameserver 127.0.0.1 (which is itself). Substitute your
    domain for domain.com here, but put a hostname in the nameserver line—always use
    an IP address.


    Using a hostname instead of an IP address on the nameserver line can cause all
    DNS resolution to fail from this machine.


    # The Name Service Switch File /etc/nsswitch.conf


    The /etc/nsswitch.conf file tells OpenLinux which service to use for lookup. Hostname
    resolution is specified on the line starting with hosts:. It should read:


    hosts: files dns


    This means check the /etc/hosts file for name resolution, then check no match
    is found in the /etc/hosts file.


    OpenLinux 1.x used the /etc/host.conf instead of /etc/nsswitch.conf format of
    the /etc/host.conf file is not the same as /etc/nsswitch.conf file.'
