    # Security Considerations


    If all anyone ever wanted to do with a webserver was to serve static HTML documents,
    would be simple. However, people want to create dynamic web pages, integrate with
    databases, customize the content based on the viewer (or browser), etc. In order
    to do this, features like cgi and server side includes need to be enabled. The
    problem is then that cgi programs run as the user specified in the server''s directive
    (by default nobody).


    Let''s look at one problem with the standard cgi module. Domain 1 creates a form
    which gets information from a site visitor, and writes information to a guestbook
    file. Another script then read the file and display it in a formatted manner.
    Under the current model, at least the guestbook file must be world writable, and
    if you need to create a file in a directory, the directory needs to be world writable.
    Obviously, anyone could then modify the file or delete it at the least. Ideally,
    it would be nice for each Web site (1 for each virtual domain). With that scenario,
    files and directories would not need to be world writable.


    One way to accomplish this is to start a server process for each domain hosted,
    with each one having its own configuration files. You would then use the BindAddress
    directive to Bind each server to the IP address for that virtual domain you must
    use IP-Based virtual hosts for this technique. Here are the config files used
    (you have many defaults and extras to keep them small for demonstration purposes):


    ```

    httpd.conf:


    ResourceConfig /etc/httpd/apache/conf/srm_1.conf

    AccessConfig /etc/httpd/apache/conf/access_1.conf

    user_1

    Group users

    ServerRoot /etc/httpd/apache

    BindAddress 127.0.0.1

    ErrorLog /var/log/httpd/apache/error_log_1

    TransferLog /var/log/httpd/apache/access_log_1

    Level warn

    LogFormat "%%h %l %u \%r" %s %b" common

    CustomLog /var/log/httpd/apache/access_log_1 common

    ```'
