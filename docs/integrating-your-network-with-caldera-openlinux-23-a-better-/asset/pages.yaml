  md: '# Introduction


    n this book we have endeavoured to write about the types of networks that are
    in use today''s business environment, and to which Caldera OpenLinux is well-suited.
    This book discusses the use of OpenLinux as a file and print server in a small
    to medium-sized organization, and as an Internet and E-mail server in a medium
    to large organization.


    # Assumptions


    In order to limit the scope of this book, we have made some assumptions about
    you as a reader, and about the types of networks with which you will be working.
    First, we have assumed that you are familiar with computer networks and what they
    are used to accomplish, and that you have had some experience with them before.


    Perhaps you have worked with other network servers, such as UNIX, NetWare, or
    Windows NT-based networks, or even another distribution of Linux. You are familiar
    with the basic hardware necessary to implement a network, and have in place the
    necessary hardware, including machines, cables, network cards, and so on.


    We have also assumed some things about the network that you are using. This book
    discusses Ethernet networking, even though OpenLinux supports many other types,
    such as Token Ring, Frame Relay, and AX.25. This book covers only typically used
    on a LAN(Local Area Network); it assumes that your OpenLinux machine will be used
    as a LAN server, and that the only WAN(Wide Area Network) connections that OpenLinux
    will be responsible for simple Ethernet connections such as DSL, cable modem,
    or PPP over a media.


    Many steps to installing an OpenLinux server (such as partitioning hard drives
    or creating users) will not be discussed in this book; many aspects of maintaining
    an OpenLinux server (such as account maintenance or file system maintenance) will
    not be discussed. We assume you know your way around Linux or UNIX system to some
    degree, and have root-level access to the machines on which you will be working
    with this book. This book assumes that you are already familiar with networking
    concepts and generic server maintenance. Finally, this book assumes that you will
    be logged in as the root user on your OpenLinux server; nearly all of the commands
    we ask you to use or tell you about require root access in order to function properly.'
  merge: -1
