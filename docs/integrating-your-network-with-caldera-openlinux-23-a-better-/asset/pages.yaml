    no here. Notice that each option has a Y and an N option, for yes and no, but
    many also have a third option, M, for module. Drivers built as modules are not
    loaded with the kernel; rather, they are loaded after boot. Building a driver
    as a module allows you to have a smaller kernel, at the expense of overhead later—when
    you are loading that module into memory. There are buttons at the bottom marked
    Next and Prev; these take you to the next or previous section. When you reach
    the end, click the button marked Save and Exit to save your changes.


    | Code maturity level options | | |

    |---|---|--|

    | Code maturity level options | | |

    | Prompt for development and/or incomplete code/drivers Help | |

    | Main Menu | Next | |


    **Figure A-2** The Code Maturity Level Options menu'
