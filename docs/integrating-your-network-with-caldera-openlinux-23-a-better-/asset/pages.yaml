  md: '# Chapter 13: Configuring telnet, ssh, and DHCP Services


    scp, one of the ssh clients just installed, allows you to file copy to remote
    systems without having to authenticate in a formal program (like FTP requires).
    This is handy for copying a file or two at a time; copying more might be better
    done with FTP. scp needs to know the filename on the local system, the name of
    the remote system, and the path on the remote system. If I want to copy the file
    /home/joseph/hello.txt from my local system to my sqlite server, I use the following
    syntax:


    scp /home/joseph/hello.txt saltlake:/home/joseph/hello.txt


    You can copy files from a remote host to the current directory on the local system
    (represented by a . at the end of the command line).


    scp saltlake:/etc/passwd


    scp can also copy a file as a different user on the remote side; this is necessary
    because the ssh tools enforce file permissions of whatever user you log in. As
    you need to be able to read or write to the directories you are attempting to
    access. (This is not an ssh peculiarity; actually, it is enforced at the kernel
    level across Linux.) To use ssh as a different user on the remote machine, please
    use the username and an @ before the name of the remote host, as follows:


    scp /home/joseph/hello.txt liza@saltlake:/home/liza/hello.txt


    Here the hello.txt file in my home directory is copied to liza''s home directory
    on the saltlake machine, using your user id.


    The ssh utilities have many functions and capabilities, such as a secure FTP client
    and server, the capability to log in remotely without requiring a password, and
    so on. Unfortunately, describing them is beyond the scope of this book. If you
    want to look further into ssh, which I recommend, I suggest checking the Web sites
    listed at the end of this chapter.


    # Troubleshooting ssh


    ssh doesn''t have too many problems. In general, if you use telnet to the machine
    in question, you can use ssh to connect. A functioning compiler and development
    libraries are required to build the ssh utilities; if you install the network
    server, you cannot compile it without loading the development packages.


    If you are in X when you use ssh to connect to a remote system, you can run applications
    on the remote system and have their screens up locally. If you use the command,
    however, to become a different user, you might see the following message when
    you try to execute a graphical application:


    X11 auth data does not match fake data.'
