  md: '# Networking Support in Caldera OpenLinuxux 2.3


    mail delivery; procmail can sort the mail into folders on headers or content,
    set up automatic replies, provide for automatic or conditional forwarding, and
    much more. Chapter 7, "Configuring SMTP E-mail with sendmail and procmail," discusses
    how configure sendmail and procmail for e-mail delivery on your network.


    # wu-ftpd, an FTP Server


    Handling the FTP file transfer service for OpenLinux, is wu-ftpd (Washington University''s
    File Transfer Protocol Daemon). By default, both private and public (anonymous)
    FTP are enabled. Configuring the ftp daemon is pretty easy, especially compared
    to configuring other bundled servers, such as the Apache Web server or the sendmail
    e-mail server. Chapter 8,"Configuring FTP Servers with wu-ftpd," explains normal
    FTP server configuration, and goes into more advanced topics, such as restricting
    user rights and creating virtual services.


    # A UseNet NNTP Server: inn


    UseNet has been called "the world''s greatest bulletin board." Hundreds of thousands
    of messages traverse UseNet each day, accounting to hundreds of megabytes of disk
    space. OpenLinux comes with the inn package, which is maintained by the Internet
    Software Consortium, the same group that maintains the bind DNS server. As standard
    with ISC products, the inn is actually the name of the package, not the programs;
    the inn programs are inn and nnppd. The UseNet network is distributed among hundreds
    of thousands of messages across the Internet, and the different UseNet servers
    are organized in a tree-like fashion similar to the way DNS servers are.


    Unlike UseNet, DNS has no central place—no root server—so UseNet servers are distinguished
    by the other servers to they connect. Upstream connections are called feeders,
    and these connections are used to receive UseNet articles. Downstream connections
    are called readers, and these connections are used to send UseNet articles to
    others, either an end user or another machine getting a news feed from your server.


    The inn package is powerful and flexible, but requires configuring in great detail.
    Configuration is discussed in Chapter 9, "Configuring UseNet News with inn." We
    explain in Chapter 9 how to get your inn server working correctly so it can send
    and receive UseNet messages from upstream providers to your end users and other
    news servers.


    # Radius Authentication


    Radius authentication is a method of providing user authentication across a network.
    It is typically used when there are remote users connecting to a server to warrant
    a separate machine handling just the remote connections and authentication.'
