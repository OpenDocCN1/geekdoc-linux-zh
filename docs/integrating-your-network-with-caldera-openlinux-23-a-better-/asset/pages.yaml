    Sep 7 12:51:51 saltlake sendmail[22967]: MAA22965: to=<linux-list@scc.com>, ctlad-dr=<joseph@cheek.com>
    (500/100), delay=00:00:05, xdelay=00:00:01, mailer=esmtp, relay=passenger.scc.com.
    [216.39.159.17], stat=Sent


    In this case, my e-mail address is the From, and linux-list@scc.com is the To
