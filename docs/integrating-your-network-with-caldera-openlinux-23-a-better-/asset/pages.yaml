  md: '# SMTP E-mail Overview


    E-mail on the Internet is handled by several different protocols. When an e-mail
    is sent, typically the message is transferred from the user''s mail program to
    the outgoing mail server, and then on to the destination mail server (and through
    any servers in between) via SMTP. There the message waits for the user to read
    it via a different protocol, such as POP3 or IMAP (see Figure 7-1).


    Just as different protocols are used to take e-mail from user to user, different
    programs are involved at each step in the path. Besides the various programs used
    to read and send mail, such as Netscape Mail or Microsoft Outlook, two programs
    typically have a hand in the transfer process. One handles the SMTP transfer,
    and one handles POP3 or IMAP transfer.


    Wondering what the significant differences are between POP3 and IMAP? POP3 is
    the successor to POP2, an older protocol no longer used. POP3 has some security
    holes, and by automatically forwarding all mail to the user''s MUA assumes that
    each user uses one computer, which makes it difficult for roaming users. IMAP
    lets users roam between computers much more easily, by storing all mail on the
    server. This lets the server keep track of which messages have been read and which
    are new.


    ![](img/9102b40bb114da6b158a518630807d57_140_0.png)


    | SMTP | SMTP | | |

    | --- | --- | --- | --- |

    | Outgoing mail server | Optional other mail server | Recipient mail server |
    POP3 or IMAP |

    | Outgoing computer | | | Recipient''s computer |


    Figure 7-1 E-mail is transferred from a user''s mail program to the outgoing mail
    server, and then on to the destination mail server via SMTP, where it then waits
    for the user to read it via POP3 or IMAP.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# One MDA, One MTA


    Caldera has integrated procmail into the process of delivering incoming mail to
    a user. procmail acts as a filter on the incoming mail. It can do lots of neat
    things, like route mail into different folders, send automatic replies to e-mail,
    filter based on content, and execute a program when mail arrives, while delivering
    the mail to the inbox. As opposed to procmail, which is an MDA (Mail Delivery
    Agent), sendmail is an MTA (Mail Transfer Agent). Therefore, sendmail hands the
    incoming mail it receives to procmail for delivery.


    # Other MTAs versus sendmail


    Linux commonly uses Mail Transfer Agents other than sendmail. Other programs,
    such as smallmail and qmail, are drop-in replacements for sendmail. These programs
    are smaller and easier to work with, although not as robust or configurable. Because
    of their smaller size, proponents say that they are less susceptible to security
    holes and are faster on the mail delivery.


    Another MTA, fetchmail, is not a replacement for sendmail. fetchmail is used to
    transport port mail from one server to another via POP3, instead of SMTP. This
    is useful when a mail server is not reachable via the SMTP store-and-forward technique,
    in which the server with the mail initiates the transportation. For instance,
    many small workgroups share a single IP address via a process called Network Address
    Translation (IP Masquerading, in Linux terminology). A mail server sitting on
    the private side of this configuration would not be reachable from the public
    Internet, and could not receive SMTP mail connections. The server could, however,
    initiate POP3 connections to the mail server which has the mail, and retrieve
    each message locally.


    # Configuring sendmail and procmail


    The basic configuration file for sendmail, /etc/sendmail.cf, is enormous and complex.
    It''s so complex that it is usually generated by m4, a program specifically written
    to generate complex configuration files. In m4, a simple configuration file and
    a lot of rulesets are taken, and a complex configuration file is produced.


    Fortunately, Caldera has already done this for you, and has produced a working
    /etc/sendmail.cf file from m4. The defaults in this file will work if you just
    want to send outgoing mail. If you want to receive e-mail with sendmail, however,
    it will need some tweaking. We''ve broken this tweaking process into two'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'sections, Basic sendmail Configuration and Advanced sendmail Configuration.
    If you go through the steps in the basic section, you will have a functional sendmail
    for incoming mail. These steps are


    +   - Configuring Acceptable Mail Hosts

    - Creating User Aliases

    - Controlling E-mail Forwarding


    The Advanced sendmail Configuration section deals with fine-tuning a working sendmail
    setup. There are many aspects of sendmail that can be tuned to a fine detail,
    far too many to cover in a single chapter. In that section, we discuss the aspects
    that I have most often been asked to configure. These steps, while optional, can
    be beneficial additions to your OpenLinux system.


    +   - Configuring Virtual Users

    - Controlling Mail Relaying

    - Controlling Spam E-mail


    After sendmail receives mail properly, it takes each message and hands it to procmail
    to deliver to the user''s inbox. Normally, procmail only does that. However, it
    has the ability to do many other things with each message, on a system-wide or
    user-by-user basis. The procmail Configuration section explains how to utilize
    some of these beneficial features, including:


    +   - Moving User Mail to a Different Directory

    - Separating E-mail into Folders

    - Deleting Unwanted E-mail Automatically

    - Creating Automatic Reply Messages

    - Advanced Filtering


    # Basic sendmail Configuration


    sendmail, outgoing mail will transfer properly without configuration. However,
    to receive any mail, it will need to be configured. This section details the minimum
    number of steps necessary to get a functioning mail server from a default OpenLinux
    installation. We recommend making these changes even if you only want to send
    outgoing mail.


    # Configuring Acceptable Mail Hosts


    In order to function properly, sendmail needs to know the hosts and domains for
    which it will be receiving mail. This is everything after the @ sign in the e-mail
    address. Typically it is just the Internet domain name (such as domain.com), although
    it can be a sub-domain (seattle.domain.com) or a hostname'
