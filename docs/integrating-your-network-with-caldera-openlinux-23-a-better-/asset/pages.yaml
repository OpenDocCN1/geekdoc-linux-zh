- img_proc: true
  md: 'delete no guest,anonymous


    overwrite no guest,anonymous


    rename no guest,anonymous


    The next line is another example of the Permissions category. It instructs WU-FTPD
    to perform one or more specified levels of password checking for anonymous FTP
    users. The line is followed by a list of the values of these levels, and the action
    that WU-FTPD is to take on the basis of these values. See the following table
    for possible values to.


    ```

    passwd-check rfc822 warn

    ```


    # Values Action


    +   none No password checking performed


    +   trivial Password must contain an @


    +   rfc822 Password must be an rfc822-compliant address (rfc822 describes what
    are valid e-mail address formats)


    +   warn Warn the user, allow them to log in


    +   enforce Warn the user, and then log them out


    The next two lines are an example of the Miscellaneous category. They call for
    FTP conversion for class all, based on the instructions stated in /etc/ftpconversions.


    compress yes all


    tar yes all


    The last line is another example of the Miscellaneous category. It instructs WU-FTPD
    to check for the file /etc/shutmsg at boot time. If the file exists, new FTP connections
    will be denied and current FTP connections will be terminated, as specified in
    the file.


    ```

    shutdown /etc/shutmsg

    ```


    # /etc/ftpconversions


    This file contains information that how files are to be converted when being transferred.


    > It''s best to leave ftpconversions alone unless you really need to modify the
    conversion behavior during a file transfer.


    ![](img/9102b40bb114da6b158a518630807d57_173_0.png)'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'Here''s example:


    ```

    .:Z: /bin/compress -d -c %s:T_REG|ASCII:O_UNCOMPRESS:UNCOMPRESS

    : :z: /bin/compress -c %s:T_REG|O_COMPRESS:COMPRESS

    .:gz: /bin/gzip -cd %s:T_REG|ASCII:O_UNCOMPRESS:GUNZIP

    : :gz:/bin/gzip -z -9 c %s:T_REG|O_COMPRESS:GZIP

    : :tar:/bin/tar -c f %s:T_REG|T_DIR:O_TAR:TAR

    : :tar.z:/bin/tar -c -z f - %s:T_REG|T_DIR:O_COMPRESS|O_TAR:TAR+COMPRESS

    : :tar.gz:/bin/tar c -f %s:T_REG|T_DIR:O_COMPRESS|O_TAR:GZIP

    ```


    The first line says to decompress .z before transferring, and the second line
    says to compress before transferring. The remaining lines follow the same rationale
    for other file formats.


    Each line in this file represents a description and action for a conversion. Each
    line has eight fields separated by colons, as denoted in the following line. Each
    field references the action to be described in the following table.


    1 : 2 : 3 : 4 : 5 : 6 : 7 : 8


    | Field | Description |

    |---|---|

    | 1 | Strip prefix. |

    | 2 | Strip postfix. |

    | 3 | Addon prefix. |

    | 4 | Addon postfix. |

    | 5 | External command. |

    | 6 | Types. |

    | 7 | Options. |

    | 8 | Description. |


    Currently, field 1 and 3 are not supported. That''s why those fields blank in
    the preceding example.


