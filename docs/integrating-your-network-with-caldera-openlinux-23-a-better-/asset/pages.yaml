  md: '# SMTP E-mail Overview


    To forward mail to my account on the seattle machine, I could use:


    joseph@seattle


    To save all the mail in the file /home/joseph/mymail, and not in the inbox, I
    would use:


    /home/joseph/mymail


    You can forward to more than one address at once with sendmail. To save all mail
    in /nhome/joseph/mymail and also leave a copy in my inbox, I would use:


    /home/joseph/mymail. joseph


    Mail can just as easily be sent to a different account altogether, by using the
    full

    e-mail address in the .forward file:


    me@other.email.account


    > Mail forwarded through a .forward file is done so with user and group permissions
    corresponding to the user account that owns the .forward file. If the cases presented
    above, the user is joseph and the group is users. If mail is sent to a file, it
    must be writable from that user and group; if mail is piped to a program, the
    program must be executable by that user and group.


    ![](img/9102b40bb114da6b158a518630807d57_146_0.png)


    # Advanced sendmail Configuration


    After configure sendmail with the basic functions in the previous section, you
    might want to get more control over sendmail with e-mail. Whereas the basic functions
    are mandatory for any incoming mail server, these are completely optional. You
    must first have configured the basic functions, however, proceeding to this section.


    # Configuring Virtual Users


    Virtual users exist on any system with virtual hosts. As I explained in the “Configuring
    Acceptable Mail Hosts” section, sendmail will accept mail for any virtual hosts
    on your OpenLinux system, if told to do so. By default, sendmail does not distinguish
    between e-mail accounts for your system and e-mail accounts for virtual hosts;
    if you are hosting domain1.com and domain2.com on your domain machine, sendmail
    considers bob@domain.com, bob@domain1.com, and bob@domain2.com as the same bob.
    This doesn''t become a problem unless three different e-mail addresses belong
    to three different users, who want their own mail in their inbox'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Chapter 7: Configuring SMTP E-mail with sendmail and procmail


    Unfortunately, the default /etc/sendmail.cf file in OpenLinux 2.3 doesn''t support
    virtual users, so you will need to add support for virtual users in this file.
    To do this, edit the /usr/share/sendmail/cf/cf/generic-col12.2.mc file. Look for
    the lines that add support for a mailer table:


    ```

    dnl # We provide a mailertable to fine-tune routing.

    dnl #

    FEATURE(mailertable, `hash /etc/sendmail/mailertable'')

    ```


    Below that line, add another for the virtual user table:


    ```

    FEATURE(virtusertable, `hash /etc/sendmail/virtusertable'')

    ```


    Regenerating the /etc/sendmail.cf file will cause any changes you have made to
    this file to be lost! This can cause all mail services to quit working. Proceed
    only after making a backup copy of the /etc/sendmail.cf file.


    ![](img/9102b40bb114da6b158a518630807d57_147_0.png)


    The next step is to regenerate the /etc/sendmail.cf file. This process will overwrite
    the existing one, if you have made any changes to that file, make a backup copy!
    Generate the new file by executing the following command, and restart send-mail
    to put the changes into effect.


    ```

    m4 /usr/share/sendmail/cf/m4 /cf/m4 /usr/share/sendmail/cf/cf/generic-col12.2.mc
    > /etc/sendmail.cf

    ```


    Keep in mind that this completely regenerates the /etc/sendmail.cf file, and it
    will need to be edited with all of the changes you may have made earlier. Virtual
    users to be specified in the /etc/sendmail/virtusertable file. By editing this
    file, you can specify that mail sent to bob@domain.com be sent to one place, bob@domain1.com
    be sent somewhere else, and bob@domain2.com be sent to a third place. Create the
    /etc/sendmail/virtusertable file as in Listing 7-2. Be sure to use tabs, not spaces,
    to separate the left and right columns.


    # Listing 7-2 A sample /etc/sendmail/virtusertable


    ```

    # makemap hash /etc/sendmail/virtusertable < /etc/sendmail/virtusertable

    bob@domain.com bobjohnson

    bob@domain1.com bobsmith

    bob@domain2.com bobturner

    ```'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'This file sendmail that incoming mail addressed to bob@domain.com gets put
    in the johnson inbox, mail to bob@domain1.com gets put in the bobsmith mailbox,
    and mail to bob@domain2.com gets delivered to the bohturner inbox. All of the
    e-mail accounts must exist on your system.


    Notice the commented-out mapcommand at the top of the listing. This command must
    be run after each change to the virtertable file. Execute it now—this rebuilds
    the virtual table database /etc/sendmail/virtertable.db, and is akin to running
    the newaliases command after each change to the /etc/aliases file. Since this
    data is looked up on demand from sendmail, you do not need to restart sendmail
    after you make changes to the /etc/sendmail/virtertable file.


    In the examples above, all mail was delivered to local mailboxes. It could just
    easily be delivered to other mail servers. If Bob Turner had a personal e-mail
    account somewhere else, we could use:


    ```

    bobdomain2.com bobhturner@some.other.server.com

    ```


    The virtual user table also provides a catch-all mail delivery directive. Consider
    Listing 7-3:


    ### Listing 7-3 Catch-all example in the /etc/sendmail/virtertable file


    | # makemap hash /etc/sendmail/virtertable | /etc/sendmail/virtertable |

    | bob@domain.com | bobjohn |

    | jeff@domain.com | jeffbaker |

    | @domain.com | johnbrown |


    As you can see, Bob Johnson gets sent to his e-mail address, Jeff Baker gets mail
    sent to his address, and John Brown gets mail addressed to anyone else at domain.com.
    This is good to use when a single person is the main e-mail contact for a domain,
    which often happens with small businesses. Make sure that the catch-all listing
    is at the end of the listings for its domain, or else it may pre-empt other listings.


    # Controlling Mail Relaying


    Linux won''t send mail from every address to every address by default—the mail
    must either originate or get delivered on its server to be processed. sendmail
    will deliver mail from any server to any server; this is called mail relay, and
    is now considered a security hole, partly in that many people use mail relays
    to send unsolicited e-mail (spam mail). When spam e-mail is sent from a different
    computer than it originated from, it is hard to trace.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Chapter 7: Configuring SMTP E-mail with sendmail and procmail


    When sendmail sees mail going through that neither originates nor terminates at
    its server, it refuses to send the mail, giving a <550 Relaying Denied> message.
    Often, legitimate mail is sent, however, that neither originates nor terminates
    on the OpenLinux server. A good example is mail originating from an employee''s
    desktop computer using their favorite mail program, such as Netscape Mail or Microsoft
    Outlook. These mail messages technically originate from their own computer, not
    the server, and may be bound for anyplace on the Internet. These computers need
    to be able to send mail anywhere, without receiving the <550 Relaying Denied>
    message.


    The /etc/mail/relay-domains file contains a list of hosts for which relaying is
    allowed. These must be either qualified domain names or IP addresses. Wildcards
    are allowed, so if you need to give access to your 200 employees, you will need
    200 lines of hosts, one per line. Because my salt.cheek.com machine acts as a
    mail server for your workgroup, my file looks like this:


    ```

    # /etc/mail/relay-domains - include all hosts that clients send mail from here

    seattle.cheek.com

    sanfrancisco.cheek.com

    laptop.cheek.com

    ```


    I have four computers in this workgroup: saltlake.cheek.com, seattle.cheek.com,
    sanfrancisco.cheek.com, and laptop.cheek.com. There is a line for each machine
    here, with the exception of saltlake, mail originating from saltlake is automatically
    accepted. Keep in mind that these must be fully qualified domain names, not aliases—I
    could not just enter settle, sanfrancisco, and laptop and expect it to work correctly.
    The .cheek.com is significant here. After a change to this file, sendmail will
    be restarted. See the section "Starting and Stopping sendmail and procmail" later
    in this chapter for details.


    ![](img/9102b40bb114da6b158a518630807d57_149_0.png)


    According to sendmail documentation, this list of hosts can be either fully qualified
    domain names or IP addresses. I have had problems with IP addresses in this list,
    so if I need to enter an IP address for which there is no DNS host-name, I generally
    create a fake entry to add to the /etc/hosts file for that machine, and add that
    fake name to the /etc/mail/relay-domains file.


    If the /etc/mail directory does not exist, it must be created first with the mkdir
    command. You must restart sendmail after any changes to the /etc/mail/relay-domains
    file.'
