  md: '# New Features of Caldera OpenLinux 2.3


    Caldera OpenLinux 2.3 has added some key new features. Following are some of the
    most impressive additions:


    # The Linux Wizard: lizard


    Using *lizard* is a completely new way to install Linux. In the past, Linux installations
    were text-based, requiring users to know lots of technical details about their
    hardware. The *lizard*, however, is entirely graphical and mouse-driven, and probes
    the hardware for most of the settings necessary. The ingenious *lizard* installer
    also takes advantage of the multitasking nature of Linux, by installing software
    packages in the background while you configure user and video settings. By the
    time the system is fully configured, perhaps 30 percent or more of the operating
    system will be loaded.


    # Linux 2.2 Kernel


    The 2.2 Linux kernel is the latest production-ready Linux kernel. Improvements
    upon its predecessor, kernel 2.0, include enhanced driver support, better scalability,
    and symmetric processing up to 16 processors.


    # The Gnu C Library: glibc 2.1


    The Gnu C Library, *glibc*, is the core of many of the programs included with
    Linux. OpenLinux supports the latest *glibc*, version 2.1, as well as the older
    version, known as libc. When programs are built for Linux, they are built for
    one version or the other, but not both. Caldera''s support of both versions allows
    it to run programs built for both newer and older Linux systems, with no major
    compatibility problems.


    # COAS


    COAS is Caldera''s administration package. This interface allows for quick and
    easy editing of popular configuration parameters, supporting both a textual and
    graphical interface. Unfortunately, this interface tool is not nearly complete,
    and the user still needs to configure many parameters by editing text files.


    # Additional Required Software


    OpenLinux includes many of the features necessary for integration into typical
    networks, but it lacks some of the features to implement all the services described
    in this book. The packages in the following sections are necessary for a full
    OpenLinux network.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 1: Introduction to Caldera Openlinux 2.3


    # The Secure Shell: ssh


    Secure, ssh, is a replacement for remote login services, such as telnet and rlogin.
    Its main benefit is that information passed over the network through ssh is encrypted
    so it cannot be easily intercepted and decoded. Information passed via telnet
    or rlogin is not encrypted; anyone can intercept sensitive information sent this
    this way, and can gain account names, passwords, and other information that would
    allow for compromise of your systems. Many system administrators use ssh to prevent
    unauthorized access to sensitive information. Obtaining and installing ssh is
    discussed in Chapter 13, “Configuring telnet, ssh, and DHCP Services.",


    > Because ssh uses encryption that is stronger than allowed by United States export
    control laws, it cannot be bundled with Openlinux or this book.


    ![](img/9102b40bb114da6b158a518630807d57_25_0.png)


    # Remote Authentication Dial-In User Service: radiusd


    Radius (Remote Authentication Dial-In User Service) is a protocol typically used
    for an Internet service provider as has one machine dedicated for user dial-up
    and one machine configured as an Internet server. In this book, we assume the
    Internet server is your Linux machine, and the dial-up machine is a Lucent (formerly
    Livingston) Portmaster.


    The Linux program that talks to the Portmaster and tracks which users are authenticated
    and which are not radiusd. This program must be obtained from Lucent, built on
    your Linux machine, and configured for your use. Chapter 10, “Configuring Radius
    with Lucent’s radiusd,” explains how to do this.


    # The Proxy Server: squid


    Openlinux’s HTTP and FTP proxy server is called squid. It allows for faster access
    of frequently visited Web sites and more security on an Internet connection. You
    must download and install squid from the Internet. Its installation is described
    in Chapter 12, “Configuring the squid Proxy Server.",


    # Networking Support in Caldera Openlinux 2.3


    This book discusses the types of networks that are in use today in business environment,
    and to which Caldera Openlinux is well-suited. The use of Openlinux as a file
    and print server in a small- to medium-sized organization, and as an Internet
    server in a medium- to large-sized organization, will also be examined.'
  merge: -1
