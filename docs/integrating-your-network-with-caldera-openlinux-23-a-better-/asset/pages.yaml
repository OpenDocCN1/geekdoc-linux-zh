- img_proc: true
  md: '# Chapter 10: Configuring RADIUS with Lucent''s radiusd


    Lucent''s Livingston FTP site.) radiusd can be compiled for a variety of UNIX
    platforms, including Calder''s OpenLinux.


    Associated with radius is a utility called radtest, which can be used to check
    the radiusd configuration and verify that it is working correctly. radiusd listens
    to ports 1645, 1646, 1650, and 1651; it is important to make sure that no other
    services are running on these ports.


    radiusd uses its own password database by default, but it also has the ability
    to use Linux''s password file instead; by doing so the system administrator does
    not have to maintain two different sets of passwords. All of the configuration
    files for radiusd are stored in /etc/raddb.


    # Installing and Compiling the radiusd Source


    To install the radiusd source, copy the file radius21.tar.z to /usr/src. Uncompress
    the file using the command tar xvzf radius21.tar.z.


    Before you compile radiusd, you need to make a few file changes. First, edit the
    radiusd Makefile, which is in /usr/src/radius/src. (The Makefile can be changed
    with any text editor.) Comment out line 23, changing it from


    ```

    CPPFLAGS = -DNOSHADOW

    ```


    to


    ```

    #CPPFLAGS = -DNOSHADOW

    ```


    This will allow radiusd to work with OpenLinux''s shadow password functionality.
    In addition, you must create a configuration file for OpenLinux; create the following
    file as /usr/src/radius/src/conf/OpenLinux_2.3 (see Listing 10-1):


    Listing 10-1 The radiusd configuration file /usr/src/radius/src/OpenLinux_2.3


    ```

    # System: Linux 2.2.10 #1 SMP Fri Aug 6 00:46:43 CEST 1999 1686

    # Caldera OpenLinux 2.3

    #

    RADLIBS = -ld -lcrypt

    ```'
  merge: -1
  pgno: 201
- img_proc: true
