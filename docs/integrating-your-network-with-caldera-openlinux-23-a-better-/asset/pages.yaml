    # Using the host Command


    In its simplest invocation, host is used with either a hostname or IP address
    as its single parameter. One thing about host is that it will convert an IP address
    into its corresponding in-addr.arpa hostname automatically, saving keystrokes
    and eliminating the need to remember to enter the numbers in reverse order.


