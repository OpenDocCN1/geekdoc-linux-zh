  md: "var/named/root.hints file tells bind which servers are authoritative for the\
    \ root domain. bind uses this when it needs to check on a zone for which it is\
    \ not authoritative. Notice that the domain names and hostnames used in this zone\
    \ end in a period, indicating that they are part of the root domain.\n\n# Creating\
    \ the 127.0.0.0 Zone Authority\n\nCreate the /var/named/pz/127.0.0.0 file as follows,\
    \ changing domain.com to your domain name (see Listing 5-3). This file is also\
    \ available on the CD-ROM under /files/bookfiles/chapter5/127.0.0.0.\n\nListing\
    \ 5-3 The 127.0.0.0 zone authority file /var/named/pz/127.0.0.0\n\n```\n/var/named/pz/127.0.0.0\n\
    $TTL 10\n@ IN SOA domain.com. hostmaster.domain.com. (\n      1 : Serial\n   \
    \   8H : Refresh\n      2H : Retry\n      1W : Expire\n      1D : Minimum TTL\n\
    \      ns.domain.com.\nNS\n1 PTR localhost.\n```\n\nThis file provides the reverse\
    \ DNS information for the 127.0.0.0 zone. Note that the hostnames and domains,\
    \ even localhost, listed here end with a period. Each line has a Resource Record\
    \ (RR), which is the technical term for a DNS entry. Typically, RRs are listed\
    \ one per line, the exception here being the Start of Authority (SOA) resource\
    \ record (which has its own line plus five more, with data in parentheses).\n\n\
    The RRs in this file are the SOA, Name Server (NS), and PointTer (PTR). The SOA\
    \ record gives the zone to which this file corresponds, as well as other information\
    \ about how to propagate the record on a network. The NS record tells which hosts\
    \ act as DNS servers for that zone. There is only one DNS server for this domain,\
    \ but many domains have two or more DNS servers, each with its own NS record.\n\
    \nThe PTR record simply gives the name of the host associated with its IP address.\
    \ Only one host can be specified for each IP address, so if you have multiple\
    \ hostnames with the same IP address, you must choose only one hostname to enter\
    \ into this record. PTR records are valid only in zone files that are used to\
    \ hold reverse DNS information."
