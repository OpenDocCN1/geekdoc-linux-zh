- img_proc: true
  md: '# Chapter 11: Building a Firewall with ipchains


    | Code | Name | Description |

    |---|---|---|n| -s | Source | Specifies the source in regard to the specified
    chain. You must specify the address and mask. In the specification of the address,
    you can use a hostname (jack.foo.com), network name (foo.com), or an IP address
    (192.168.1.1). You can also specify the port or port range (1024:5000). If you
    specify a port or port range, you must specify the protocol as well. |

    | -d | Destination | Just the opposite of source, you use the same rule structure.
    |

    | -j | target | What to do with the packet that matches the rule. You can specify
    ACCEPT, REJECT, DENY, MASQ, REDIRECT, RETURN and (null). |

    | -f | Fragment | Allows to decide what to do with fragmented packets. A rule
    here is good because using packet fragments is a common method of attacking a
    system. |

    | -b | Bi-directional | Makes the rule applicable in both directions. |

    | -v | Verbose | Gives you more data and information about what is going on. |

    | -n | Numeric | Says that you only want IP addresses and port numbers, and no
    hostnames (fred.foo.com) or port names (ftp). |

    | -l | Log | Turns on kernel logging of packets. You can get specific information
    about certain rules (such as who tried to telnet into or out of your firewall).
    |

    | -y | syn | Match TCP packets with the SYN bit set and the ACK and FIN bits cleared.
    Packets that match this criteria are used to request TCP connections. When preceded
    by a "!" (i.e. !y) inverts the option. |


    Now that you know all about masquerading and firewalling, it is time to configure
    ipchains. This process involves:


    +   * Testing the firewall to see if it accomplishes tasks correctly.

    * Enabling IP forwarding (or all the packets will be denied at the firewall).

    * Determining a ruleset (firewall rules/laws).

    * Implementing the firewall rules.

    * Making the firewall last forever (or until you decide to change it).'
  merge: -1
