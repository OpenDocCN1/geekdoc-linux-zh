    # Troubleshooting bind


    are several tools available to troubleshoot a DNS server that is not working the
    you want it to. Typical symptoms of a poorly functioning DNS server e:


    Name resolution fails.


    Slow connection or no connection to common services, such as FTP, Web, or Telnet.


    The server pauses 30 to 90 seconds when loading common services at bootup, such
    as sendmail or Apache.'
