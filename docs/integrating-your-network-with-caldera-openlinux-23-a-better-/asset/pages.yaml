  md: '# Chapter 6: Configuring FTP Servers with WU-FTPD


    # Obtaining and Installing the WU-FTPD Package


    Now that you understand the basics, you''re ready to install WU-FTPD. The WU-FTPD
    package can be found on your OpenLinux 2.3 CD-ROM. If for some reason you lose
    your CD, you can always download it from http://calystems.com/caldera; check here
    often to make sure you have the latest version, with the latest security and bug
    fixes. You can install the WU-FTPD package (rpm format) in one of two ways: via
    kpackage or rpm.


    # WU-FTPD Installation via kpackage


    From KDE, run kpackage, or click on the wu-ftpd-2.5.0-3.rpm package (the version
    number might have changed since this was written) from the file manager. You must
    have root privileges to install this package.) You should see the kpackage window
    (as shown in Figure 8-4).


    # WU-FTPD Installation by rpm


    From the prompt, log in as root, or issue the command to get into the root account.
    Issue the rpm command that follows (the version number might differ depending
    on the version you downloaded).


    ```

    rpm -U wu-ftpd-2.5.0-3.1386.rpm

    ```


    ![](img/9102b40bb114da6b158a518630807d57_169_0.png)


    Figure 8-4 kpackage install package window'
