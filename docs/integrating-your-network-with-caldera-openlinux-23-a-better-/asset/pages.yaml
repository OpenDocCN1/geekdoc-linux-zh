    n  :mx#0:\\\n  :lp=/dev/lp0:\\\n  :sh:\n```\n\nLine 1 indicates that this is a\
    \ local printer.\n\nLine 2 indicates the name of the print queue.\n\nLine 3 indicates\
    \ the location of the queued print jobs.\n\nLine 4 indicates the maximum print\
    \ job size.\n\nLine 5 indicates the location of the printer as a device.\n\nLine\
    \ 6 indicates that banner pages should not be printed.\n\n# Remote Printer\n\n\
    ```\n##PRINTTOOL## REMOTE\nlps:\\n  :sd=/var/spool/lpd/lp:\\n  :mx#0:\\\n  :rm=razimon.foo.net:\\\
    \n  :rp=fir:\n```\n\nLine 1 indicates that this is a remote/networked printer.\n\
    \nLine 2 indicates that the printer accepts both PostScript and non-PostScript\
