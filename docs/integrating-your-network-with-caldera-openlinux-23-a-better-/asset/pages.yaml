  md: '# Configuring Secure Terminal and File Access with ssh


    ssh version 2, the latest version, uses different encryption algorithms than ssh
    version 1, and is generally not compatible. Additionally, ssh2 must be purchased
    for commercial use, whereas ssh1 is free.


    ![](img/9102b40bb114da6b158a518630807d57_258_0.png)


    Compiling ssh is a three-step process. It involves use of the commands ./configure,
    make, and make install. Execute these commands in that order.


    After executing the ./configure command, you see lots of checking messages. Then
    there should be a line reading creating sshconf.h. Then you return to a command
    prompt.


    After executing the make command, you see lots of make and gcc messages; you can
    safely ignore any warning messages. Enter the last command, make install. This
    copies the ssh clients (ssh, scp, sftp) to /usr/local/bin, the ssh server to /usr/local/sbin,
    does some last-minute configuration, as generating authentication keys. (There
    is also lots of output here).


    To connect to your server with ssh, you must first start the ssh server by executing
    the /usr/local/sbin/sshd command. Do not; it automatically goes into the background,
    as a daemon. The process ID for ssh is stored in the file /var/run/sshd_2.pid;
    killing the process ID contained in this file disables the daemon so that no one
    can use ssh to log in any. If you want ssh to be enabled at system boot, add the
    command to the end of the /etc/rc.d/rc.local file; this file contains commands
    that are executed after system boot.


    # Using the ssh client


    ssh acts just like telnet. To access a remote system, the command followed by
    the hostname of the system you want to connect to; if I wanted to connect to my
    saltserver with ssh, I would type ssh saltlake. This would log me in the same
    user as I was using on the local system, or if I was logged in as joseph on the
    local system, it would log me in as joseph on the remote system. Because all network
    traffic is encrypted, ssh has no problem logging in as root; if I logged in as
    root on the local system, I could ssh to a remote system and automatically be
    there as well. If you want to log in as a different user on the remote system,
    use the -1 option with the username specified after it, as follows:


    ```

    ssh -1 joseph saltlake.check

    ```


    When accessing a remote system with ssh, you are prompted for the password, because
    ssh knows which user you want to log in. You are given three chances to type in
    your password correctly. If you decide you don''t want to log in, press Enter
    three times instead of pressing Ctrl+C, because pressing Ctrl+C does not exit
    the ssh client connection.*'
