    # Starting and Stopping Apache


    Each time an Apache server setting is changed, the server must be restarted. In
    addition,

    t Apache server must be told to start automatically when OpenLinux starts. Some-

    times Apache needs to be started or stopped by hand, perhaps to test a configuration

    or check for errors.


    # Enabling or Disabling Automatic Apache Startup


    COAS will allow you to enable and disable Apache''s automatic startup when the

    system restarts. From the System Administration option, choose Enable/disable

    services, and look for the Web Server line. Enable Apache at system boot,

    check the box next to it. To disable Apache at system boot, uncheck this box.
    COAS

    is explained in more detail in Chapter 1, "Configuring OpenLinux''s Basic Network."'
