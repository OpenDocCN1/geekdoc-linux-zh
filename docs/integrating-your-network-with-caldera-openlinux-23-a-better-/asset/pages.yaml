  md: '# Appendix A: Recompiling the CalderaLinux 2.9 Kernel


    penLinux 2.3 comes with Linux kernel 2.2.10 preconfigured for major devices. There
    are certain times, however, when it is necessary to compile a kernel. Most of
    the time, it is for one of two reasons:


    +   - You need a hardware driver that was not preconfigured with the stock kernel.

    - You need to load the latest kernel (to patch a bug, or to add a new feature,
    for example).


    Sometimes you can gain a performance increase by recompiling the OpenLinux kernel
    and including only the bare necessities. Omitting extraneous drivers and functionality
    can give you a smaller, quicker kernel. The kernel source for 2.2.10 is included
    with the CD-ROM in this book. I suggest downloading the latest 2.2 kernel (currently
    2.2.13 as of late November 1999), and installing that at the same time.


    > The 2.2 kernel series contains the stable kernels, 2.3 kernels are for testing
    use only. When 2.4 is released, you might want to migrate to that, but the procedure
    to do that is not described in this book.


    ![](img/9102b40bb114da6b158a518630807d57_269_0.png)


    You can obtain the latest kernel version via FTP ftp.us.kernel.org, in the directory
    /pub/linux/kernel/v2.2/. Kernel 2.2.13, for example, is in the file linux-2.2.13.tar.gz.


    Regenerating the kernel is a multi-step process. The steps are


    +   - Obtaining and Installing the Latest Kernel Source

    - Configuring the Kernel

    - Compiling the Kernel and Modules

    - Installing the New Kernel


    # Obtaining and Installing the Latest Kernel Source


    When you get a new kernel, it is in a file like linux-2.2.13.tar.gz. This file
    needs to be placed in the /usr/src directory. This file is large, around 15 Megabytes
    in size, so if you plan to get it from the Internet, you need a fast connection.'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'Recompiling the OpenLinux kernel requires about 100 Megabytes of free disk
    space; make sure you have that much space free before attempting a kernel recompilation.
    To check free space, use the df -h command and look for free space on the /usr
    partition—or on the root partition, if no /usr partition exists.


    In /usr/src, you see a subdirectory named linux-2.2.10 and one named linux, which
    points to the linux-2.2.10 subdirectory. Create a subdirectory for the new kernel,
    using the same linux-2.2.x convention. If the kernel you are ready to compile
    is 2.2.13, create a subdirectory called linux-2.2.13.


    ```

    mkdir linux-2.2.13

    ```


    Remove the linux directory and recreate it, pointing to the new directory.


    ```

    rm linux

    ```


    ```

    ln -s linux-2.2.13 linux

    ```


    You are now ready to extract the new kernel source from the file you downloaded.


    ```

    tar xvzf linux-2.2.13.tar.gz

    ```


    It takes a few minutes for all the files to unpack. After this is complete, change
    to the linux directory.


    # Configuring the Kernel


    Most of the kernel configuration and installation from this point is done with
    the make command. By configuring the kernel, you tell it which drivers to include.
    You should include drivers for all hardware you use (as well as hardware you are
    likely to use in the near future), and for anything else with you either need
    or want to play. You can do this with one of three commands: make config, make
    menuconfig, or make xconfig. If you are in the X Windowing System, you might want
    to use make xconfig; otherwise, use make config or make menuconfig. This section
    assumes you choose make xconfig, after which you are shown the menu in Figure
    A-1.


    ```

    make xconfig

    ```'
