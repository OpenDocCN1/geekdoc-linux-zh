    # Troubleshooting Apache


    During a Web server restart, Apache will complain to the console if it finds an
    option it doesn''t like in its configuration files. Fatal errors will keep the
    Web server from starting at all; non-fatal errors will allow Apache to start,
    albeit with limited functionality. Watch for these errors when you start or restart
    Apache. When it cannot find a file or directory it needs, for example, Apache
    will complain with an error similar to the following:


    ```

    fopen: No such file or directory

    ```


    ```

    httpd: could not open error log file /var/log/httpd/apache/error_log.log

    ```


    As you can see, I mistyped the filename of the error log file above. This error
    kept Apache from starting.


    ```

    httpd:[Mon Aug 2 11:01:30 1999] [error] Cannot resolve host name

    host.some_domain.com -- ignoring!

    Warning:DocumentRoot [//www/docs/host.some_domain.com] does not exist

