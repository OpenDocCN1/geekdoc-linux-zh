  md: '# Manually Mounting Your Import


    If you need to continue without the GUI, you need to learn how to mount your import.
    This is a fairly simple process but because it only occurs automatically at boot
    (if you want it to), you need a non-automatic way. If you mount the import from
    boot, or if you mount it without a reboot, the NFS server still must go through
    the verification and port allocation for the user. First, you need to either be
    the root user, so to root, or be a user with privileges to implement the changes
    that were modified in the fstab file.


    Since most Linux users dread the reboot, they implement these changes without
    rebooting. If you wish to mount the /home directory type the following as:


    ```

    mount /home

    ```


    As long as the user who is currently logged in has the rights to access this mount,
    it will be mounted. If the user doesn''t have the rights to mount foo:/home, he
    would not be able to mount the directory even if he used the su command, due to
    nfs permissions.


    > You will not be able to mount the directory until you have added the corresponding
    entry into the etc/fstab file either manually or with the aid of COAS.


    ![](img/9102b40bb114da6b158a518630807d57_76_0.png)


    # Starting or Stopping NFS


    For one reason or another on either server or a client system, you might need
    to stop NFS. This procedure is done differently on servers and client systems.
    For example, if you want your server to go into init 1, the process of shutting
    down nfs is done automatically. If you are planning to shut down the NFS server
    at a given time, it is always to e-mail everyone who will be affected by this
    fact and can save their data and using NFS applications.


    The first step to stopping nfs has already been mentioned; if it is possible,
    contact all of the users prior to this action. Then, shut down the nfs daemon
    by going to the /etc/rc.init.d/ directory, and typing .nfs stop. This stops the
    nfs daemon. For some reason, after a long period to make more drastic procedures
    the command line says it is stopping NFS, you will find the nfs daemon is hung.
    You can send it a kill signal: kill -s nfs. If it doesn''t stop, you can stop
    portmap or kill portmap if necessary, and in most cases you should be to kill
    the nfs daemon without changing init levels, or rebooting.


    You start nfs on your server by ensuring that the daemon is scripted in /etc/rc.init.d/.
    After you check whether nfs is scripted, run /usr/sbin/rpc.'
