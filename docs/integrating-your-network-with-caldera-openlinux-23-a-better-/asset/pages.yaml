    # Additional Configuration Options


    A few other configuration options merit discussion.


    # Creating Public Directories


    Create an incoming directory only if you want people to FTP files onto your site.
    Remember that any files transferred to this directory might contain illegal software
    or data. Be sure to check it on a frequent basis. Don''t forget to check all files
    in the incoming directory for viruses, especially if you don''t know who WFP uploaded
    them.


    To see what an anonymous user sees when logging in to your FTP server, take a
    look in the /home/ftp directory; this is the directory in which they start. From
    there, you can structure your file system as required. As a general rule, the
    /home/ftp/pub directory is where the public files are placed. Another standard
    is the /home/ftp/incoming directory. This is where people can upload or download
    files to or from your server. If you decide to create this directory, make sure
    the permissions are set properly, so that people can write to it and read from
    it.


    # Allowing root to Use FTP


    As a security precaution, the default installation does not allow users FTP access
    to your machine using the root account. To allow root into your account, edit
    the /etc/ftpusers file to remove root, or better yet, insert a hash mark (#) in
    front of root, as shown on the next page.'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'We strongly recommend that you leave this default setting in place. Accessing
    your FTP server with the root account makes it possible to delete system files
    and crash your system. Even worse, an outsider could upload rogue system files,
    obtaining backdoor entry!


    The following is an example listing of the /etc/ftpususers file that allows anyone
    who knows the password to reach your OpenLinux FTP server using the root account.
    The bin account is denied from logging into the FTP server. You must have root
    privileges to edit this file.


    ```

    #root


    bin

    ```


    # Modifying Access Rights


    By default, all users have the permission to modify or delete any files per their
    group privileges. There are five permission settings you can control to limit
    their permission capabilities. (You need to have root privileges to edit the /etc/ftaccess
    file.) The format of each parameter is capability permission class, where capability
    values are as listed in the table following, permission is yes or no, and class
    is the name of the class or user.


    | Capability | FTP User Can... |

    | --- | --- |

    | chmod | Change server file permissions. |

    | delete | Delete files. |

    | overwrite | Replace files. |

    | rename | Rename files. |

    | umask | Change permissions. |


    In the following example, users of class real cannot change the server file permission.


    ```

    chmod no real

    ```


    # FTP Administrative Tools


    Now that you have finished configuring WU-FTPD, let''s review what administrative
    tools are available to assist us. These tools are ftput, ftpcount, and ftpwho.
    All three commands require that you be using the root account.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Configuring WU-FTPD


    # ftpshut


    The syntax is


    ```

    ftpshut [ -l min] [ -d min] time warning.txt

    ```


    Use this command to shut down the FTP server. After you issue it, a file defined
    by the shutdown command in /etc/ftpaccess is created. To cancel the FTP shutdown,
    remove that file using the root account. The following table describes what the
    ftpshut parameters do.


    | Parameter | Description |

    | -l min | Shuts down and refuses any new FTP requests in minutes |

    | -d min | Starts terminating FTP connections min minutes before shutdown |

    | time | Shuts down at a specified time, expressed in 24-hour format (eg. HHMM)
    or in time minutes |

    | warning.txt | Displays the content of the warning.txt file, which can include
    message code |


    Here is an example instructing the FTP server to shut down in 10 minutes with
    a message from ftp-shutdown.txt, and to refuse new FTP requests only at that point.


    ```

    ftpshut 10 /usr/local/ftp/ftp-shutdown.txt

    ```


    # ftpwho


    This command shows current process information for each FTP user. Additionally,
    it shows the current number of FTP users for each class. ftpwho is useful to gauge
    how many FTP users your system can take. You must root to issue this command.
    The following example shows that there is one FTP user belonging to class all,
    and that there is no maximum number of concurrent FTP sessions for this class.


    ```

    ftpwho

    ```


    Service class all:


    ```

    1 ?      S      0:04 init


    -1 users (no maximum)

    ```'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Chapter 8: Configuring FTP Servers with WU-FTPD


    # ftpcount


    This command displays the total number of users for each class (as specified in
    /etc/ftpaccess) that are connected to your FTP server, and the maximum number
    allowed for that class. You must be root to issue this command. For example:


    ftpcount


    +   - Service class all - 1 users (no maximum)


    # Advanced FTP Configuration


    In most situations, the typical configuration is all you need to have a fully
    functional FTP server. In spite of this, there are many more parameters you can
    change in the configuration files for WU-FTPD. In this vein, we will briefly discuss
    two advanced topics: virtual hosting and TCP Wrappers configuration.


    # Configuring Virtual Hosts


    Just as you can set up Virtual hosting, you can set up virtual FTP hosts; you
    just need to configure the appropriate configuration files. What does this mean?
    Let''s say my OpenLinux 2.3 server to act like two or more different FTP servers.
    Suppose I want a user to see one message at one FTP server, and a different banner
    message at another site: one reading "Welcome to HIS FTP server" and the other
    reading "Welcome to HER FTP server". Besides having different banner messages,
    you can set up different directory structures and permissions, as though you had
    two physical FTP servers; in fact, though, you can use one physical FTP server
    and the same port to host two or more virtual FTP hosts. You must supply a unique
    IP address for each virtual FTP host.


    A benefit of having virtual FTP servers is lower hardware and maintenance costs
    because all the virtual FTP servers are running off one computer.


    Here''s an example configuration to set up the virtual hosts.


    ```

    # Virtual Server at 172.10.100.100

    ```


    ```

    virtual 172.10.100.100 root /home/ftp/virtual/ftp-serv

    ```


    ```

    virtual 172.10.100.100 banner /home/ftp/virtual/ftp-serv/banner.msg

    ```


    ```

    virtual 172.10.100.100 logfile /home/ftp/virtual/ftp-serv/xferlog

    ```


    Add lines similar to the preceding example for each virtual server in /etc/ftpaccess.
    The first parameter is the IP address of the virtual server (for example, 172.10.100.100).
    The second parameter for that virtual server is root or banner'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Configuring WU-FTPD


    logfile. The third parameter is the file system location for the item specified
    in the second parameter. Note that all the messages, files, permissions, and other
    settings in the ftpaccess file apply to all virtual servers.


    # Securing FTP with TCP Wrappers


    A special program called a TCP wrapper accomplishes some security purposes by
    managing WU-FTPD. It is referred to in the /etc/inetd.conf file, which uses the
    /usr/sbin/tcpd program. A standard OpenLinux installation has secured WU-FTPD
    with TCP wrappers. A sample line from the /etc/inetd.conf file is shown here.


    ```

    ftp stream tcp nowait root /usr/tcpd in.ftpd -a

    ```


    This line shows that the TCP daemon program tcpd manages the FTP daemon; whenever
    an FTP request occurs on port #21 (as named for FTP in the /etc/services file),
    this program is activated. By encapsulating in.ftpd in the TCPD, you control access
    to WU-FTPD through the /etc/hosts.allow and the /etc/hosts.deny file. The security
    rules are based on


    +   * Which service is requested

    * The IP address of the requesting client

    * The domain name of the requesting client


    Here is an example /etc/hosts.allow file that would allow all FTP (in.ftpd) connections
    from friends.com and *.friends.com machines.


    ALL: friends.com


    in.talked: ALL


    in.fingered: ALL


    in.ftpd: ALL


    # Starting and Stopping the FTP Daemon


    The FTP server starts when you boot up your OpenLinux server. To stop the FTP
    server now, issue the ftpshutdown command. To cancel the shutdown, remove /etc/shutdownmsg,
    or whatever file is defined by the shutdown parameter in /etc/ftpaccess. To restart
    the FTP daemon, do the following in the root account.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Chapter B: Configuring FTP Servers with WU-FTPD


    1. Find the process ID for inetd, as shown here.


    ```

    [root@ftp_server~]# ps -ae | grep in

    1 ? 00:00:04 init

    517 ? 00:00:00 inetd

    1262 ? 00:00:00 in.telnetd

    1464 ttyp0 00:00:00 login

    ```


    2. Kill that process, typing for example kill -HUP 517, to shut down and restart
    your FTP server.


    # # Troubleshooting FTP


    You should be able to resolve most FTP problems by re-examining /etc/ftpaccess,
    the main configuration file for WU-FTPD. Other related files, such as /etc/ftphosts,
    /var/log/xferlog, and /etc/passwd, can be used to help pinpoint the source of
    your WU-FTPD problems. If you need more assistance, try posing a question to the
    WU-FTPD mailing list, at www.landfield.com/wu-ftpd/. As with other troubleshooting
    techniques, localize the problem using a “divide and conquer” strategy. If you
    are really stuck, start with the default configurations provided in the examples
    document at site.


    Here are some common problems you might encounter. Suppose you see the following:


    FTP server shut down - please try again later.


    To restart the FTP server, remove the file specified by the parameter shutdown
    in /etc/ftpaccess. (Usually, the default value is set to /etc/shutmsg.) You need
    to be in the root account to remove this file. Removing this file allows users
    to reach your FTP server immediately.


    The FTP server might login incorrect when you are using a real, guest, or anonymous
    account. Make sure you can telnet into your system using the real or guest account.
    If you, the most likely culprit is the class parameter in /etc/ftpaccess. Verify
    that a class is defined for your real, guest, or anonymous account. The simplest
    setting to ensure that all three types of FTP users can log in from any account
    is to add the following line in /etc/ftpaccess.


    ```

    class all real,guest,anonymous *

    ```


    Make sure there is no space between real,guest,anonymous; otherwise, WU-FTPD interprets
    the words after the space as being part of the domain address. The following line
    allows only real and guest accounts to log in, but not anonymous—WU-FTPD interprets
    anonymous as a domain name.


    ```

    class all real,guest. anonymous *

    ```'
  merge: -1
  pgno: 185
