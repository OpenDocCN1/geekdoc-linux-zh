  md: '# Chapter 6: Configuring the Apache Web Server


    Options None


    +   Uncomment the first line by removing the hash mark, and comment the second
    line by adding the hash mark in front of it. Turning the Indexes option tells
    Apache to give a file listing when a directory is requested and there is no index.html
    file (or other DirectoryIndex file) in that directory. The FollowSymLinks option
    tells Apache that it is all right to process a request for a symbolically linked
    file. If you have sym-linked files or directories here, Apache will return an
    error when these files are requested and the FollowSymLinks option is not enabled.


    AllowOverride None


    +   You can control access configuration with a file named .htaccess, located
    inside each document directory, if this line is changed from None to All. This
    is beneficial if you users have permission to create files inside the document
    root to specify their own settings—they do not need to edit the global access.conf
    file, or you have done it for them. Allowing this access can make your users more
    self-sufficient.


    # Advanced Apache Configuration


    If all you want to set up a basic Web server, the instructions in the preceding
    section told you all you need to know; you can skip to the next section, “Starting
    and Stopping Apache,” to get Apache to work with your new settings. If you want
    to learn how to do more advanced administration, however, this section provides
    you with more detail about some Apache settings and some of Apache’s more powerful
    capabilities. Some of these capabilities, which are examined in the next few subsections,
    are


    +   Adding Support for Server Side Includes

    Adding Virtual Hosts

    Editing Apache’s MIME Types

    Performance Tuning

    Enabling Web-Based Server Status Reports


    # Adding Support for Server Side Includes


    Server Side Includes (SSI) is a method of producing dynamic content without CGI.
    SSI lets you embed the output from programs, the current date and time, server
    variables, and other information directly into HTML documents, without needing
    to write a program. Edit the /etc/httpd/apache/conf/srm.conf file, and look for
    the following lines:


    ```

    #AddType text/html .shtml

    ```'
