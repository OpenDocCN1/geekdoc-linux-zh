    This begins the process of allowing ports to be mapped on demand. Next, you can
    start the nfs daemon. If you have a script in /etc/rc.cd/init.d/, go to that directory
    and type ./nfs start. You will then see on the output starting nfs in the terminal.


    Starting nfs on a client system is simply the process of mounting the NFS export
    to your system. As we mentioned previously, you can do this using COAS or from
    a command line. You can stop nfs on a client server by unmounting the import,
    which can also be done within COAS or from a command line by typing mount /home,
