    # An SMTP mail server: sendmail


    OpenLinux''s default mail server is sendmail. More properly, sendmail is called
    an MTA (Mail Transfer Agent); this is in contrast to a MUA (Mail User Agent),
    which is the program that reads and responds to mail. Typical MUAs are pine or
    Netscape mail on OpenLinux, or Outlook or Eudora on a Windows machine. Mail is
    actually just received via SMTP (Simple Mail Transfer Protocol). Other system
    daemons, such as sendpd and imapd, disperse the mail to the client through the
    POP3 (Post Office Protocol, version 3) and IMAP4 (Internet Message Application
    Protocol, version 4), respectively.


    OpenLinux supports mail transfer with other Mail Transfer Agents besides sendmail.
    Two of the most common of these are sendmail and qmail. Both are smaller, quicker,
    and easier to configure than sendmail, although sendmail is arguably the most
    versatile MTA. It is included as a default because it is the definite standard
    used over the Internet.


    The single master configuration file used by sendmail is extremely complex and
    can be difficult to understand. Fortunately, not much needs to get mail services
    working on a standard OpenLinux machine. Even so, OpenLinux includes a meta-configuration
    program, called m4, which significantly simplifies the creation of sendmail configuration
    files.


    You can receive e-mail for many domains and specify mail aliases and mail routing
    on a domain-by-domain or user-by-user when you use sendmail. It delivers the mail
    itself to the message storage place on the server''s drive, or allows an MDA (Message
    Delivery Agent) to handle that task. Process Mail, also known as procmail, is
    also included with OpenLinux, and it is configured to handle the actual'
  merge: -1
