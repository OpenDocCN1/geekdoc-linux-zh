  md: '# DNS Overview


    Name resolution is the process of taking a hostname and producing its corresponding
    IP address. OpenLinux supports three different methods of name resolution: the
    /etc/hosts file, DNS, and NIS (an older protocol typically used only on UNIX systems).
    This chapter focuses on DNS (Domain Name System) and its interaction with the
    /etc/hosts file. If you are already familiar with DNS basics, feel free to proceed
    to the next section.


    DNS looks up a name it can tell computers on the Internet, for example, my Web
    server www.chek.com and my ftp server ftp.chek.com are actually 208.12.12.134,
    and so on. In addition, Reverse DNS does the opposite—it takes an IP address,
    as 208.12.12.134, and converts it back into the hostname www.chek.com. The process
    of connecting to a DNS server, giving it an address, and requesting the corresponding
    IP address is called a DNS lookup, or DNS query. Similarly, requesting a hostname
    from a DNS server when giving it an IP address is called a Reverse DNS lookup.


    Not only does DNS IP address and hostname lookups, it can also give detailed information
    about a host, specify many IP addresses for a single host, provide distributed
    name resolution, and more. This chapter deals only with setting up a basic DNS
    server that provides IP address and hostname lookups.


    ![](img/9102b40bb114da6b158a518630807d57_90_0.png)


    Some computers on the Internet act as DNS servers, meaning they respond to these
    DNS requests; many computers do not, however, and need to know the address of
    a DNS server that will respond to these requests for them. Having your own DNS
    server speeds DNS lookups from machines on your network, enables you to handle
    DNS requests from other machines (if your company is an ISP, this might involve
    handling Internet connection requests), and allows full control over any domain
    names you own. For example, I have DNS servers running on my machines to provide
    DNS services for computers in my office and handle DNS requests for my own domain
    as my clients'' demands.


    By default, OpenLinux uses the local /etc/hosts file and, optionally, other DNS
    or NIS servers for name resolution. When a DNS server is installed and configured
    on OpenLinux, it needs to be used itself for name resolution also. To configure
    a DNS server and have it work, the machine needs an IP address and a functional
    IP stack. Ideally, it should contain at least one network card. (Chapter 2, Configuring
    OpenLinux''s Basic Network, discusses how to configure basic IP networking on
    OpenLinux.)


    ![](img/9102b40bb114da6b158a518630807d57_90_1.png)'
