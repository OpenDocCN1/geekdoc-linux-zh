  md: "# Configuring LPRng Printer Sharing\n\nThere are many reasons why you might\
    \ want to share a printer, such as efficiency, lower cost, and increased employee\
    \ communication. Many printers are ready to be networked by just connected to\
    \ an Ethernet and given an appropriate queue. Other printers require a bit more\
    \ work but they can still be just as effective.\n\nIn Linux, the underlying concepts\
    \ of printer sharing are a part of the operating system. To understand printing\
    \ and printer sharing, you need to understand how something is printed in Linux.\n\
    \nThe age old question of “which comes first?” is an apt illustration for the\
    \ printing process under Linux. Does the application want to print first or does\
    \ the system want to receive a printer job? Let's begin by saying that the application\
    \ is what initiates the printing process. If an application decides that it wants\
    \ to print a document, another application that runs in the background then takes\
    \ over the process of printing. The application lpr is used only to send print\
    \ jobs to the printer. If you do not want to use another application, such as\
    \ Emacs, to print from, you can print directly from a command line. If you wanted\
    \ to print your security log /var/log/secure, you would type:\n\n```\ncat /var/log/secure\
    \ | lpr -PPl\n```\n\nP stands for printer and lp stands for the printer queue\
    \ to which you want to send the printer job. Although you can attempt to print\
    \ from a command line by typing this command without setting up a printer, your\
    \ job will be sent to a print queue and never get printed without a printer definition.\n\
    \n# Creating a Printer Definition\n\nTo set up a printer, you begin by editing\
    \ the configuration file /etc/printcap. This file contains all of the information\
    \ regarding your printer that you need to define. Let's look at a sample /etc/printcap\
    \ file. We will divide this file into sections for easier discussion, as it also\
    \ shows a non-PostScript local printer and a remote printer.\n\n# PostScript Printer\n\
    \n```\n##PRINTTOOL## LOCAL bj200 360x360 letter ()\nps:\n  :sd=/var/pool/lpd/ps:\\\
    n  :mx#0:\\n  :lp=/dev/lp0:\\n  :if=/var/pool/lpd/ps/filter:\\n  :sh:\n```"
  merge: -1
