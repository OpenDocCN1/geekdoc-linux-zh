  md: "Create the following file with an extension of .pac (I used cache.pac):\n\n\
    ```\nfunction FindProxyForURL(url, host)\n  return \"PROXY proxy.mydomain.com:3128:\
    \ DIRECT \";\n```\n\nAlternately, you could create one with more intelligence,\
    \ that caches non local websites, and goes directly for local websites:\n\n```\n\
    function FindProxyForURL(url\n```\n\nThen in the Netscape client browsers that\
    \ are to use the proxy, add the URL that points to the .pac file (i.e. http://localhost/cache.pac\
    \ on the server itself) in the Configuration Location box under the proxies setting\
    \ in the advanced preferences section, then check Automatic Proxy Configuration.\n\
    \nThe problem with autoconfiguration is that the javascript is run for each URL\
    \ to connect to. This will impose a potential performance hit to the browser.\
    \ This is especially true if you do things like DNS lookups in your javascript.\
    \ Manual proxy configuration does not impose this potential performance hit.\n\
    \nIt therefore may be faster to replace the dnsDomainIs(host,\"mydomain.com\"\
    ) call in the last .pac file example with shExpMatch(host,\"*.mydomain.com\").\
    \ This avoids the dnsDomains call.\n\n# Troubleshooting\n\nA proxy server adds\
    \ another layer of complexity to Internet access, which means, unfortunately,\
    \ that is another place where access could break down. When the proxy server doesn't\
    \ work or is misconfigured or the client's browser is misconfigured, it is your\
    \ task to troubleshoot."
