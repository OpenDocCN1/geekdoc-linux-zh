  md: '# Chapter 7: Configuring SMTP E-mail with sendmail and procmail


    Unread since Sep 7 10:34 1999 (PDT)


    And if I had a .forward, it would show:


    Mail forwarded to joseph@somewhere.else.com


    # Telnet to Port 25


    When it appears that sendmail is not routing mail correctly, the best bet you
    have is to telnet to port 25, the SMTP port, and query sendmail directly. You
    will be greeted with a standard sendmail welcome message, and then will be able
    to communicate with sendmail as if you were another mail program wishing to send
    some mail.


    ```

    telnet localhost

    Trying 127.0.0.1...

    Connected to localhost.

    Escape character is "*"

    220 sanfrancisco.cheek.com SMTPM 8.9.3/8.9.3: Tue, 7 Sep 1999 14:11:14 -0700

    ```


    There are three different things that are useful to here: the vrfry command, the
    expn command, and create an e-mail message by hand.


    vrfy is short for verify, and it means "tell me the user exists". Try this on
    yourself. The 250 in the output means that the command succeeded; it gave me full
    e-mail address on that OpenLinux server.


    ```

    vrfy Joseph

    250 <joseph@sanfrancisco.cheek.com>

    ```


    expn stands for expand. It is used to expand aliases, mailing lists, and such.
    It will tell you where the mail will go, if sent to that user. This is a good
    way to tell whether sendmail expects to send the mail to the same addresses where
    you want the mail to be.


    ```

    expn Joseph

    250 Jeff Cheek <joseph@sanfrancisco.cheek.com>

    ```


    When used on a user with neither aliasing nor forwarding, expn does not show much
    difference from the vrfry output. When used on a mailbox with an alias or forwarding,
    expn instead shows the addresses it expands:


    ```

    expn info

    250-<jeff@cheek.com>

    250-<dan@cheek.com>

    250 <joseph@cheek.com>

    ```'
  merge: -1
