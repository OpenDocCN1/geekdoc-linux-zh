  md: '# Chapter 1: Introduction to Caldera OpenLinux 2.3


    Caldera Systems, Inc. calls its distribution of Linux OpenLinux, in part to convey
    the open-source nature of the Linux kernel and many of the available add-ons.
    OpenLinux, which is consistently ranked in the top three commercial Linux operating
    systems in the United States, is Caldera''s second Linux product. Caldera Systems''
    first Linux product, the Caldera Network Desktop, was a customized version of
    Red Hat''s distribution and is no longer available. OpenLinux came into being
    as Caldera merged its Linux product with the Linux Support Team''s LST distribution.


    # Distinguishing Features of Caldera OpenLinux


    Linux distributions vary greatly in their method of installation and in their
    system administration functions. Each Linux distribution comes with its own set
    of tools to accomplish these tasks. OpenLinux uses a tool called lizard (Linux
    Wizard) to do the installation, and one are new features of OpenLinux version
    2. COAS (Caldera Open Administration System) for administration. provides a front
    end for editing configuration files whereas lizard is a great new installation
    routine. This book discusses editing the configuration files by hand, as opposed
    to using COAS (which is not yet mature enough to do everything discussed in this
    book).


    Although lizard and COAS are new, OpenLinux also includes the old installation
    and administration utility, lisa (Linux Installation and System Administration).
    Although lisa can still be used to install and administer your OpenLinux system,
    typically the only time it is necessary to use lisa when lizard and COAS doesn''t
    work as expected.


    ![](img/9102b40bb114da6b158a518630807d57_23_0.png)


    OpenLinux''s tagline is "Linux for Business"; Caldera aims its product squarely
    at the business user. Most people currently using Linux are home users, but this
    is starting to change as Linux gets more and notice from the business world. Caldera
    wants to position itself as the Linux distribution of business users, and it is
    well poised to do so. Business users need a stable, reliable, and capable operating
    system, and are prepared to pay for support when necessary. Caldera''s close ties
    to Novell makes its distribution the clear choice for NetWare network integration;
    Caldera included both NetWare 3.x and 4.x client and administration utilities,
    and offers the NetWare for Linux product, which allows a Linux server to emulate
    a NetWare server.'
  merge: -1
