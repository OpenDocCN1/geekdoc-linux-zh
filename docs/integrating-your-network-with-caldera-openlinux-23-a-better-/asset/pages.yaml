  md: '# Troubleshooting DHCP


    Each lease that the DHCP server gives is logged to the file /var/state/dhcpd.leases.
    Most of the time, if a lease is not working properly, it is the file to check.
    It gives you the status of the leases for different machines. If you can''t find
    a current lease for a particular machine, the server does not currently recognize
    a lease for that machine.


    This file is also used to keep track of the current state of leases; it must not
    be changed while the DHCP server is running, or the server cannot track current
    leases. The server rotates the logs every so often, renaming the old file to dhcpd.leases-.
    If for some reason the dhcpd.leases file gets destroyed or corrupted, this file
    can be used to restore an old version of the file. It is preferable to simply
    creating a new file.


    dhcpd cannot start if the dhcpd.leases file is missing. If this is the case, and
    there is no dhcpd.var/state/dhcpd.leases file as a backup, you must create the
    file by hand. Use the touch /var/state/dhcpd.leases command to create an empty
    dhcpd.leases file.


