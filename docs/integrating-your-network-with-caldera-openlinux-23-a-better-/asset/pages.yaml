  md: "# Listing 5-1 The basic configuration file /etc/named.conf\n\n// /etc/named.conf\n\
    \n```\noptions {\n    directory \"/var/named\"; // everything goes in /var/named\n\
    \    !;\n\nzone \".// // the root hint\n    type hint;\n    file \"root.hints\"\
    \n    !;\n\nzone \"0.0.127.in-addr.arpa\" ( // the reverse loopback zone\n   \
    \ notify no;\n    type master;\n    file \"pz/127.0.0\"\n    !;\n\nzone \"domain.com\"\
    \ ( // domain.com master zone\n    notify no;\n    type master;\n    file \"pz/domain.com\"\
    \n    !;\n\nzone \"1.168.192.in-addr.arpa\" ( // the reverse 192.168.1 zone\n\
    \    notify no;\n    type master;\n    file \"pz/192.168.1\"\n    !;\n\nzone \"\
    domain2.com\" ( // domain2.com slave zone\n    notify no;\n    type slave;\n \
    \   file \"sz/domain2.com\"\n    masters (192.168.2.1); !;\n};\n```"
