  md: '# About This Book


    This book is the fifth volume in the Prima Tech Linux series. It gives readers
    a look into one aspect of the Linux operating system. Other books in the series
    explore applications developed for Linux, as well as distributions of the operating
    system itself.


    Many helpful elements are included, which offer insight and key information related
    to the topic being discussed.


    > Tips tell you about new and faster ways to accomplish a task.


    > Notes delve into background information regarding a given topic.


    > Cautions warn about possible pitfalls and glitches involved with a procedure.'
