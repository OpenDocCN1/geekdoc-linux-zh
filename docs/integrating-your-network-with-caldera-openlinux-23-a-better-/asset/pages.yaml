- img_proc: true
  md: '# Configuring innd


    You need to do some configuration no matter what you use inn for. The necessary
    steps are listed in the following section, “General Configuration.” inn places
    in the /etc/news directory lists of configuration files, many of which need changing.
    The “General Configuration” section details what needs to be changed for a minimally
    functional UseNet server.


    To specify which groups you want to carry, browse the “Specifying Your Available
    Newsgroups” section. In the “Advanced Configuration” section, configuration files
    are listed that can be tweaked based on personal preference; changing these files
    is not absolutely necessary, but doing so can be beneficial for performance tuning.


    # General Configuration


    The most important file for inn is the /etc/news/inn.conf file. This file lists
    several configuration values that are used by all the programs that make up the
    inn suite. This file is created as /etc/news/inn.conf.sample. Copy it from inn.conf.sample
    to inn.conf before editing it. You must change many values, as detailed in the
    following sections.


    # Organization


    organization: Cheek Consulting, Inc., Seattle, WA


    The organization line appears on outgoing messages from your server; change it
    to something descriptive of your organization. It can also be helpful to specify
    a location (I used my business name and location).


    # Server


    server: saltlake.cheek.com


    This line is the fully-qualified domain name of your server, saltlake.cheek.com
    in my case. If you are propagating messages to the Internet from this machine,
    and vice versa, machines will connect to the hostname specified on this line.
    Put only the official name of the server here—do not use any aliased names on
    this line.


    # Pathhost


    pathhost: saltlake.cheek.com


    Similar to the server line, this line is the name by which other machines will
    know your server. It is generally the same as the server line. You may choose
    to put an alias, such as news.cheek.com, here instead.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# moderatormailer


    moderatormailer: %s@moderators.isc.org


    Messages posted to moderated newsgroups need to be approved before they can be
    posted. Each message is sent to the e-mail address specified by this line; the
    %s is replaced by the name of the newsgroup, which has the dots in the name replaced
    by dashes.


    # domain


    domain: cheek.com


    The domain line should be set to your server''s domain name; in my case, cheek.com.


    # fromhost


    fromhost: saltlake.cheek.com


    fromhost is the name of your server again; this time it is used for outgoing messages.
    It is also generally the fully-qualified domain name of your server. If you use
    an alias, such as news.cheek.com, you can use it here instead.


    The next line to edit is the /etc/news/nnrp.access file. This file determines
    who can read messages from and post messages to your news server. At the end of
    the file, add a line, such as this:


    ```

    *cheek.com:Read Post:::*

    ```


    In this example, I allowed all machines in the cheek.com domain to access my news
    server. They can both read and post messages. I could have allowed read-only access
    by removing the Post from this line.


    All other lines in this file are fine as they stand; they do not need to be changed.


    Last, the /etc/news/overview.fmt file needs to be edited. You can see this line
    in the following file:


    Xref:full


    Delete the full from this line:


    Xref:


    This saves disk space by reducing the amount of information inn stores for each
    message.'
