    # Overview of Samba Networking


    Samba is a collection of programs that allow file and printer sharing among computers
    using SMB. Microsoft operating systems, such as Windows 95/98/NT, use SMB. SMB
    is a network protocol developed by Microsoft. Samba is an open source suite of
    programs available on Linux and the various flavors of UNIX but also on other
    platforms, such as OS/2 and VMS to name a few. Of course, Windows 95/98/NT/2000
    SMB support is native. There are other alternatives to Samba, as NFS (Network
    File System), Appletalk, DECNet, NCP (Netware Core Protocol) in Netware, and Bany
    VINES. All of these have strengths and weaknesses but only Samba is the most popular
    open-source of software for sharing files and printers with Microsoft Windows
    systems.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Overview of Samba Networking


    SMB (Server Message Block) originated from NetBEUI (NetBIOS Extended User Interface),
    which was part of the NetBIOS protocol designed for small, isolated LANs. Consequently,
    the terms NetBEUI network, NetBIOS network, and Windows network mean the same
    thing. You might have heard of CIFS (Common Internet File System). This is Microsoft''s
    extension of the Server Message Block (SMB) protocol. In this sense, Samba is
    an open source implementation of CIFS.


    ![](img/9102b40bb114da6b158a518630807d57_52_0.png)


    Andrew Triddell was the person who started the work on Samba. To read an interesting
    account of how Samba was created, check out http://us3.samba.org/samba/docs/Sambaintro.html.


    ![](img/9102b40bb114da6b158a518630807d57_52_1.png)


    # Why Use Samba?


    People use Samba to allow Microsoft desktop machines to access shared files or
    printers on their Linux or other non-Windows servers. Another reason is that people
    want their Microsoft servers to be accessible from their Linux or other non-Windows
    computers. Finally, people use Samba simply to replace their proprietary protocols
    (such as NFS and DECNet) with an open source one.


    # What Can Samba Do?


    Besides providing file and print services, Samba can simply replace most services
    offered by Windows NT server. In a nutshell, Samba provides the following functions:


    +   - File and print services.

    - Authentication and authorization in a Windows network.

    - Name resolution via the WINS nameserver.

    - Service announcement or browsing (support Microsoft Windows Network Neighborhood
    browsing).


    Check out http://anu.samba.org/samba/survey/ to get a glimpse of what others are
    doing with Samba!


    ![](img/9102b40bb114da6b158a518630807d57_52_2.png)'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Samba Components


    Samba consists of two key daemons: smbd and nmbd. These two daemons provide the
    functions previously listed.


    # smbd


    This daemon provides file and print services to SMB clients, such as Windows 95/98/NT.
    Security via authentication and authorization is also provided. You can protect
    shared file and print services by requiring passwords. The simplest level of security
    is called the share level. A password is assigned to a shared directory or printer
    that is known by all users so anyone can use that. The next level of security
    is user level security, which is the preferred level of security and the default
    setting. Each user has his or her own username and password. Consequently, access
    to shares can be granted or denied on an individual basis. The last two levels
    are server and domain security, which is of interest to advanced users. The server
    level uses another SMB server (for example, NT server) to authenticate users.
    Domain level security is similar to the server level security but uses the Windows’s
    primary domain controller to authenticate uses.


    The Windows NT Domain system (not the same as the Domain Name System, DNS) provides
    another level of security. The basic idea is that a user should only need to log
    in to access the authorized shares on the network. This is accomplished by using
    an NT Domain Controller. An NT basically is a group of computers on a network
    that share the same NT Domain Controller. Version 2 of Samba provides this Windows
    NT Domain Controller function. The configuration file for smbd is /etc/samba.d/smbd.conf


    # nmbd


    This daemon handles WBIOS name resolution and service announcement (browsing).
    These two services involve the management and distribution of lists of WINS names.


    Name resolution takes two forms: broadcast and point-to-point. A machine can use
    one or both of these methods, depending on its configuration. A client-looking
    for a server named Mickey broadcasts a message to the network and waits for the
    server named Mickey to answer with an IP address. All broadcast traffic is restricted
    to the subnet or local LAN. Point-to-point name resolution involves the use of
    NBNS (NetBIOS Name Service) server, which holds a simple database of NetBIOS names
    and their IP addresses. Point-to-point name resolution works by using the SMB
    clients sending their NetBIOS names and IP addresses to the NBNS server. When
    an SMB client wants to talk to another client, it sends the other client''s name
    to the NBNS server. If the name is in the simple database, the NBNS server sends
    the IP address back to the requestor.'
  merge: -1
  pgno: 53
- img_proc: true
  md: "# Overview of Samba Networking\n\nThe other half of nmbd is service announcement,\
    \ also known as browsing. This is not the same as browsing the Internet, but rather\
    \ browsing a list of services (a service is a file and print share) offered by\
    \ the computers. On a LAN, one computer becomes the Local Master Browser (LMB).\
    \ The purpose is to keep a list of available services so when you click on the\
    \ Windows Network Neighborhood icon on your NT machine, you can see what file\
    \ and print shares are on the network.\n\nBeside the LMBs, there are also Domain\
    \ Master Browsers (DMBs), which coordinate browse lists among NT Domains. With\
    \ assistance from the NBNS, an LMB can locate its DMB to exchange and combine\
    \ lists with other LMBs. Consequently, the list is propagated throughout the NT\
    \ Domain. This propagation time can be a few seconds to more than half an hour\
    \ for a change on a remote subnet to appear in your Network Neighborhood. So if\
    \ you don't see a service on your Network Neighborhood, you might have to wait\
    \ a few minutes or longer!\n\n![](img/9102b40bb114da6b158a518630807d57_54_0.png)\n\
    \n> The delay depends on when the LMB synchronized with DMB.\n\nThe configuration\
    \ file for nmbd is /etc/samba.d/smb.conf.\n\n# Samba Utilities\n\nSamba comes\
    \ with a variety of utilities. The most commonly used are outlined in the following\
    \ table.\n\n| Utility | Description |\n smclient | This is an SMB client program\
    \ with a simple FTP-like interface. This utility accesses shares on SMB servers,\
    \ such as a Windows NT file and print server. |\n smbtestparam | This utility\
    \ allows you to test your smb.conf configuration file for correctness. |\n smbtestprns\
    \ | This utility allows you to test the printers defined in your printcap file.\
    \ |\n smbstatus | This utility allows you to list connections to the smbd server.\
    \ |\n smpasswd | This utility allows you to change SMB encrypted passwords on\
    \ Samba and NT servers. |\n mkmsbcodepage | This utility allows you to create\
    \ SMB code page definition files for your smbd server. |\n nmlookup | This is\
    \ a NetBIOS name service client. nmblookup names on a network, look up their IP\
    \ addresses, and query a remote machine for the list of names machine believes\
    \ owns. |\n SWAT | The Samba Web Administration Tool (SWAT) allows you to configure\
    \ Samba remotely, using a Web browser. |"
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Chapter 3: Using Samba and SMBFS for Windows NT and Printer Sharing


    ![](img/9102b40bb114da6b158a518630807d57_55_0.png)


    > > If you can''t see the SWAT Web page when you enter http://localhost:901 in
    your Web browser, edit the /etc/hosts.deny file so that a line like the following
    appears.

    swat:ALL EXCEPT 127.0.0.1


    # SMB Filesystems for Linux


    Windows NT can provide a file share as if it was a hard disk on your own machine.
    This drive looks like your own hard drive but it''s really disk space on another
    computer, somewhere else on the network.


    Your OpenLinux system can provide this service by using the SMB filesystem smbfs.
    For example, you can use smbmount to mount C:\DATA from your NT machine to /mnt/smb_share
    directory on your Openlinux machine; then you can read, write, edit, delete, and
    copy the files in that directory just as you would local files.


    # Setup and Management


    Samba is configured by editing the parameters in the /etc/samba.d/smb.conf file.
    This is a simple text file designed to look a lot like the Windows .ini files
    used in Windows 95. If you are overwhelmed by the many parameters in smb.conf,
    you can use SWAT to present the information from a Web browser so it''s easier
    to digest. For more details, please check the man pages on smb.conf.


    # SMB Servers


    Before continuing our discussion on the SMB servers, it would be instructive to
    note the differences between workgroups and domains.


    # Workgroups


    A workgroup is a collection of computers (workstations or servers) that maintain
    their own security information. The point is that security is distributed, not
    centralized.


    # Domains


    A domain is a collection of computers whose security is maintained centrally.
    Each domain has one or more domain controllers. There is usually a primary domain
    controller (PDC) and several backup domain controllers (BDCs). The domain controllers
    maintain account information.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Security Levels


    Samba supports four security levels. These are:


    +   * Share

    * User

    * Server

    * Domain


    # The Share Level


    In the share level security, the client authenticates itself separately for each
    share with one or more passwords. The password determines what type of access
    is granted. It sends the password along with each share mount. The client expects
    a password to be associated with each share, independent of the user. This type
    of security is similar to what Windows 95/98 offers via the Access Control tab
    of the Network Control Panel.


    If you don''t want to create a UNIX account for each Windows account that can
    be used on your network, this is the security level you want Samba to be in. This
    is the simplest method to set up and it is the least secure.


    # The User Level


    This is the default security level and the most common security level used. In
    user level security, the client sends a session setup command directly after the
    protocol negotiation. This command contains username and password. The server
    can either accept or reject username and password combination. Note that at this
    stage the server has no idea what the client eventually tries to connect to, so
    it can''t base the accept/reject on anything other than the following:


    +   * The username/password

    * The machine on which the client is based


    If the server accepts the username and password, then the client expects to be
    able to mount any share without specifying a password. Furthermore, it expects
    that all access rights are what the username and password specified in the session
    setup.


    It is also possible for a client to send multiple session setup requests. When
    the server responds, it gives the client a uid to use as an authentication tag
    for username and password.


    If you want each Windows account to have its own account on the Samba server,
    then user level security is what you need.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# The Server and Domain Level


    If you want to add the Samba server to an existing NT Domain, consider using either
    the Security or Domain security level.


    In server level security, the Samba server reports to the client that it is in
    user level security. The client then does a session setup as described earlier.
    The Samba server takes the username and password that the client sends and attempts
    to authenticate by sending the same username and password that it got from the
    client to the pass- server (a PDC or another SMB server). If it accepts the password,
    then Samba accepts the client''s connection. This allows the Samba server to use
    another SMB server as the password server.


    You should also note that at the beginning of all this session startup, the server
    tells the client what security level and if it supports encryption. If it does,
    then the client sends all passwords in encrypted format. You have to configure
    Samba with encryption enabled to support this feature. A separate smpasswd file
    is required which contains SMB-style encrypted passwords. It is cryptographically
    impossible to translate from UNIX-style encryption to SMB-style encryption.


    # Installing Samba


    Surprise! The Samba suite is installed when you do NetServer installation, but
    you need to customize it to use it as a server.


    If it''s not installed for some reason, pop in your OpenLinux 2.3 CD or download
    the latest rpm package from http://fp.calderasystems.com/pub/OpenLinux/2.3/.


    As of this writing, the latest version is 2.0.5. You must be in root account to
    install the Samba packages. The examples in the following sections are in the
    directory containing the Samba installation files.


    # Installing the Binaries


    From the shell prompt, issue the following command to install the Samba core binaries:


    ```

    rpm -U samba-2.0.5-1.1386.rpm

    ```


    # Installing Samba Documentation


    From the shell prompt, issue the following command:


    ```

    rpm -U samba-doc-2.0.5-1.1386.rpm

    ```'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Configuring Samba for File Sharing


    This installs a comprehensive set of Samba documentation to /usr/doc/samba-2.0.5/docs
    and /usr/doc/samba-2.0.5/examples.


    # Installing SWAT


    Issue the following command at the shell prompt:


    ```

    rpm -U swat-2.0.5-1.1386.rpm

    ```


    This installs the Web front end of the Samba administrative tool. From your browser,
    you can see and manage the Samba configuration file, /etc/samba.d/smb.conf.


    # Installing smbfs


    Issue the command:


    ```

    rpm -U smbfs-2.0.5-1.1386.rpm

    ```


    This installs smbmount and smbunmount tools to work with the SMB filesystem.


    # Starting and Stopping Samba


    You must be in root to start or stop the Samba daemons.


    | Commands | Descriptions |

    |---|---|

    | samba start | Starts the Samba daemons (smbd and nmbd) |

    | samba stop | Stops the Samba daemons |

    | lsmod | grep smbfs | Sees if the smbfs module is running |

    | modprobe smbfs | Loads the smbfs module |

    | rmmod smbfs | Unloads the smbfs module |


    # Configuring Samba for File Sharing


    The standard OpenLinux installation creates a working Samba installation, but
    you can customize it to your needs. You need to create a smb.conf file and Samba
    password file. The easiest way to create the smb.conf file is to copy the sample
    one provided in the /etc/samba.d directory by issuing this command:


    ```

    cp smb.conf.sample smb.conf

    ```'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Chapter 3: Using Samba and SMBFS for Windows NT and Printer Sharing


    smb.conf file provides the configuration parameters for Samba. The next step is
    to create the Samba password file by issuing this command:


    ```

    cat /etc/passwd | mksmbpassword > /etc/samba.d/smbpasswd

    ```


    For the last step, set the Workgroup parameter in smb.conf to the name of your
    Windows work. That''s all that''s required for a minimal Samba configuration.


    All Samba configuration parameters are held in the /etc/samba.d/smb.conf. At first,
    this file looks overwhelming, but it''s actually organized into three main sections,
    as described in the following table:


    | Section | Description |

    | --- | --- |

    | Global | Parameters have global effects or are used as default values for sections
    |

    | Homes | Defines the shares for directories on the Samba server |

    | Printers | Defines the shares for printers that are available on the Samba server
    |


    Although you can use your favorite text editor to edit the smb.conf file, for
    most configuration tasks I would recommend using SWAT.


    These examples assume you connect to Samba using a plain-text password. If you
    are using Windows 98 or NT 4 with Service Pack 3 or higher, you will need to turn
    on encryption before you open a connection or edit your registry key on the Windows
    client. See /usr/docs/samba-2.0.5/docs/textdocs/WinNT.txt for more details.


    > There is no need to restart your Samba daemons after modifications to smb.conf
    files. The Samba daemons read the smb.conf on a regular basis.


    ![](img/9102b40bb114da6b158a518630807d57_59_0.png)


    # User Level Security


    By default, Samba is configured for user level security. As mentioned, you need
    to create a UNIX account for each Windows account that needs to access your Samba
    file server. This is the most useful security level for Samba to be configured
    to share directories and printers. Looking at the smbd.conf file, you need to
    ensure the security parameter is set to user, as shown below.


    ```

    [global]

    workgroup = Workgroup

    netbios name = SAMBA-OL23

    server string = Samba Server running on OL23 in User Level

    guest account = smbguest

    security = user

    ```'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Configuring Samba for File Sharing


    This setting tells your Samba server that it belongs to the workgroup named Workgroup,
    with a NetBIOS name SAMBA-OL23, and displays the text "Samba Server running on
    OL23 in Share Level" from your Network Neighborhood icon. A UNIX account, smbguest,
    can be used as the Samba guest account, and Samba is running in user level security.
    You can create the smbguest account using LISA''s User Administration. The workgroup
    and machine names are limited to a maximum length of 15 characters.


    # Share Level Security


    When Samba is configured to use user level security, there is no need to create
    a UNIX account for each Windows user who needs to access your Samba server. The
    only difference is the security parameter. Now, as opposed to the previous setting
    in user level security, the value is share. The configuration file looks like
    this:


    ```

    [global]

    workgroup = workgroup

    ettbios name = SAMBA-OL23

    server string = Samba Server running on OL23 in User Level

    guest account = smbguest

    security = share

    ```


    # Domain Security


    From a general perspective, the server and domain security levels are very similar.
    Consequently, we examine domain level security because this model better enables
    a Windows NT server. A basic configuration of a Samba server can be configured
    with at least four parameters.


    ```

    [global]

    ettbios name = SAMBA-OL23

    workgroup = NT-DOMAIN

    password server = NT-DC

    security = domain

    ```


    Previous discussions about the guest account and password encryption still apply.
    The workgroup value should be the name of the NT domain of which you want to be
    a member. The password server values are a list of computers that can be used
    to perform authentication. This must be a list of a server in user level security
    (such as an NT Domain Controller or another Samba server using user level security).
    The values given here are the NetBIOS names of the machines to use.


    Samba tries each machine of the password server line in the order which they appear.
    Samba stops looking for the next machine if it gets an answer from one.'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'In other words, if a Domain Controller answers that the user does not exist,
    Samba doesn''t try to connect to the next server to see if it can get a positive
    answer from it.


    # # Creating Public Shares


    To create a public share, add the parameter `public=yes` for each share listed
    in smb.conf file.


    ```

    [public]

    comment = Public Stuff

    path = /home/public

    browable = yes

    public = yes

    writable = yes

    ```


    The lines tell Samba that there is a share called public and is mapped to /home/public.
    This share is described by the comment Public Stuff and is user writable. Anyone
    can access this share.


    # # Creating Private Shares


    The following is an example of creating a private share called tonydir for user
    tho. This writable share is described by the comment Tony''s Folder and is mapped
    to /home/tho. Only the user called tho can access this share.


    ```

    [tonydir]

    comment = Tony''s Folder

    path = /home/tho

    valid users = tho

    public = no

    writable = yes

    ```


    # # Using Samba For Printer Sharing


    Your standard OpenLinux installation should have created a printer queue for you.
    If this is the case, your Windows client sees a printer icon. The printer on the
    Samba server looks like any printer attached to your Windows machine. Samba does
    not do the actual printing; it simply accepts your print job and passes it to
    whatever print command you use on the OpenLinux server. So, if your OpenLinux
    server has no print queue then you won''t be able to print using Samba!'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Configuring Samba for Printer Sharing


    The following code is the printers section from smb.conf. This automatically creates
    all the printer shares defined in /etc/printcap. The default settings should be
    sufficient to provide printing. If you need to make any changes to the print options
    for Samba, use the Printer Parameters page from SWAT to assist you.


    ```

    [printers]

    comment = All Printers

    path = /var/spool/samba

    browse = no

    # Set public = yes to allow user ''guest account'' to print

    guest ok = no

    writable = yes

    printable = yes

    create mask = 0700

    ```


    # Accessing SMB shares with smclient


    To access any SMB shares on a Samba or Windows server, use the smclient program.
    smclient is very similar to ftp in terms of command syntax. Like ftp, smclient
    is a text-based tool. Basically, smclient allows you to use your OpenLinux system
    as NetBIOS client in a Windows network.


    # Querying SMB Shares on an OpenLinux System


    The following example shows a user querying SMB shares are available on the OpenLinux
    system. The results are displayed in three sections. The first section lists the
    sharenames or SMB shares on that server. It shows that a folder called public
    and two printers called ps and ip are being shared on the OpenLinux system. The
    second section is the browse list of servers belonging to the workgroup or domain
    which the server is located. The two SMB machines, OL23 and WinNT4, are members
    of the workgroup called Workgroup. The last section displays the workgroup or
    domain known by this OpenLinux system. Here, OL23 is the master browser for your
    group. The -N switch uses no password to connect to avoid being prompted for a
    password. This is equivalent to a guest connection to list shares.


    ```

    me@ol23 samba-2.0.5$ smclient -L localhost -N

    Added interface ip=25.112.149.93 bcast=25.112.151.255 nmask=255.255.252.0

    Password:

    Domain=[WORKGROUP] OS=[Unix] Server=[Samba 2.0.5]

    ```'
