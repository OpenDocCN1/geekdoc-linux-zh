  md: '# Starting and Stopping Apache by Hand


    OpenLinux includes scripts to start and stop Apache. These scripts can be run
    by hand to start and stop Apache on the fly.


    ```

    /etc/rc.d/init/httpd start

    ```


    This command starts the Apache server, if stopped. If it is already running, nothing
    will happen. If no error messages show on the console, the server started correctly.


    ```

    /etc/rc.d/init/httpd stop

    ```


    Similar to the first command, this command stops Apache if it is started. If it
    is already stopped, nothing will happen.


    # Restarting Apache After a Configuration Change


    Apache won''t know to change its behavior after a configuration file change unless
    it is told to restart Apache, we need its process ID. Apache stores its process
    ID in the file /var/run/httpd.pid. Find this process ID by using the cat command:


    ```

    cat /var/run/httpd.pid

    ```


    ```

    7078

    ```


    The current process ID can be any number. (On my system, it was 7078.) Use the
    appropriate number in the following command, which sends a signal to Apache to
    reread its configuration files and is cleaner and more efficient than stopping
    and starting the server manually.


    ```

    k11 -HUP 7078

    ```


    # Performance Tuning


    The default Apache options with a new OpenLinux installation are set for low-volume
    Web sites with light traffic. In most cases, these settings will work for high-volume
    sites, but they will reduce performance considerably. Here are some settings to
    play with to increase performance, all of which can be found in the /etc/apache/conf/httpd.conf
    file:


    ```

    MaxKeepAliveRequests 100

    ```


    MaxKeepAliveRequests sets the number of requests that Apache will allow with a
    persistent connection. Persistent connections are quicker than normal connections,
    because the Web browser and Apache do not need to establish a socket connection'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'for each request. Increasing this number will help speed up connections from
    a single user who views many pages in succession.


    KeepAliveTimeout 15


    KeepAliveTimeout is the number of seconds Apache will wait during the same persistence
    connection for the next request. Increasing this number can help performance,
    but increasing it too much can leave too many sockets open, waiting for connections.
    Use your discretion on this; however, I do not recommend setting this above 60.


    MinSpareServers 1


    Apache starts many incarnations of itself to help balance the load when many Web
    requests are made at the same time. It keeps some extra servers for quick bursts
    of Web hits, and then kills off when too many are around. MinSpareServers is how
    many extra servers to keep around, at minimum; if there are fewer than, more are
    started. I suggest increasing this number significantly if you have a fair or
    heavy amount of Web traffic. If you have a medium-traffic site, use at least 5;
    if you have lots of traffic, you might want a much larger number here.


    MaxSpareServers 2


    If there are more spare servers than MaxSpareServers, some are killed off. Again,
    I suggest increasing this number significantly if you have a fair or heavy amount
    of Web traffic. If you have a medium-traffic site, use at least 10.


    MaxClients 15


    MaxClients is the total number of server incarnations that can be active at once.
    Apache will never start more servers than this number, so if your sites get more
    traffic at once than, your viewers will not be able to connect to your Web sites.
    Fifteen is a low default value; I suggest at least 50 for this value.


    MaxRequestsPerChild 30


    MaxRequestsPerChild is the number of requests a single server incarnation will
    handle before being killed. Apache kills its incarnations after 30 requests with
    the default value. If you run a very busy server, this can be a performance bottleneck
    and you should set this value higher. You should not exceed 1000 with this value,
    as apache, or the system libraries have a memory leak, which http processes consume
    lots of memory.


    You can use the server-status feature to help you adjust your parameters. For
    instance, you can check your server-status output and have output with Extended
    Status On. On a rule of thumb you can use to make sure MinSpareServers is at least
    the requests/second rounded up to the nearest integer. If you know your server''s
    peak time, you can send it a kill -HUP, and collect data for some minutes'
