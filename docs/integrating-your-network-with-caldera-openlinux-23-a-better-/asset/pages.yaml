- img_proc: true
  md: '# Controlling Spam E-mail


    You might, like me, receive far many e-mail messages along the lines of “make
    money quick,”buy our products,” “sell your products here,” and so on. All mail
    sent through sendmail to your system, whether they are legitimate or unsolicited
    messages (junk mail), is accepted. To limit the amount of spam mail to users on
    your system, sendmail can be configured to filter out some of these messages based
    on their source—a set of IP addresses, domain names, or e-mail addresses.


    To configure this filter, the access database feature of sendmail must be enabled.
    This entails changing the /usr/share/sendmail/cf/cf/generic-col2.2.mc file, just
    as in the preceding “Configuring Virtual Users” section. The following line must
    be added to that file:


    ```

    FEATURE(access_db)

    ```


    This will enable support for the /etc/mail/access file, which is a database of
    IP addresses, domain names, and e-mail addresses to accept or reject. You can
    refer back to the “Configuring Virtual Users” subsection to review the process
    of editing the /usr/share/sendmail/cf/cf/generic-col2.2.mc file and generating
    a new /etc/sendmail.cf file if you need to. Here, I discuss what to do after the
    new-sendmail.cf file is generated, create the /etc/mail/access file as demonstrated
    in Listing 7-4:


    # Listing 7-4 A sample /etc/mail/access file


    ```

    # makemap hash /etc/mail/access <etc/mail/access

    spammer.com      550 Go away

    192.168             REJECT

    192.168.1           OK

    friend@            550 Go away

    ```


    The left column is a domain name, IP address subnet, or partial e-mail address
    to accept or reject. The right column is an error code and text message, or a
    standard procedural message, such as REJECT or OK. Separate these columns with
    tabs, spaces.


    Because there are a few different ways to handle mail here, I explain what these
    lines mean. The first line tells sendmail to reject any mail coming from spammer.com
    with a “550 Go away” error message. The code meaning was not accepted; the text
    can be anything you want it to be. The next two lines tell sendmail to reject
    all mail from the 192.168 subnet, except for mail coming from the 192.168.1 subnet.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Chapter 7: Configuring SMTP E-mail with sendmail and procmail


    Instead of using a customized error message, just REJECT or OK is used. In these
    cases, sendmail issues an appropriate generic response. Finally, the last line
    tells send-mail to reject any mail coming from an e-mail address starting with
    friend@ (many times, junk e-mail will be sent with an address such as this).


    One significant aspect of this file is that when more than one line matches an
    e-mail message, the last line matched is the one that is used. In the example
    above, mail from a 192.168.1.1 host matches both the second and third line of
    the access file; because the second line rejects it but the third line makes it,
    then mail would be accepted.


    To effectively fight spam with these files, you must keep the etc/mail access
    file updated for your system. Each time junk e-mail is sent to one of your users,
    you must examine the text message and retune it to block it next time. After each
    change to the etc/mail access file, including creating it in the first place,
    you must create a database from this file. To do so, use the following command:


    ```

    makemap /etc/mail/access < /etc/mail/access

    ```


    This database is checked against each message that sendmail receives, you do not
    need to restart sendmail after each change to this file. However, you must restart-mail
    after you regenerate the /etc/sendmail.cf. Unfortunately, these changes do not
    filter e-mail based on content; content filtering is more easily done by procmail,
    on a user-by-user basis. This process is explained later, in the "Deleting Unwanted
    E-mail Automatically" section.


    # Configuring procmail


    Up to this point in the chapter, I have generally ignored procmail. One of the
    benefits of procmail is that it works invisibly if it is not configured. Configuration
    can be global, with defaults for all mailboxes, user-by-user. procmail will take
    the incoming mail from sendmail and deliver it to the correct mailbox, optionally
    performing processing based on the content of the message. For example, I proc-mail
    to separate into different folders the mail sent directly to me, to my e-mail
    aliases, and to mailing lists that I am on.


    All of procmail''s filtering information is stored in a recipe file; the global
    recipe file is /etc/procmailrc. In each user''s home directory is a local .procmailrc
    file. These files contain a list of filters stating that procmail should look
    for each message, and what it should do if it finds a match.


    Because procmail is separate from sendmail, and it is a filter, it is not run
    as a daemon and does not need to be shut down or restarted when a .procmailrc
    file changes.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Separating E-mail into Folders


    Perhaps the most common use for procmail is to separate mail into different folders.
    Normally, all incoming mail is stored in a single place—the user''s inbox. procmail
    can look at the From: or To: headers, the Subject: line, the body of the message,
    or let me give an example of other places to determine what should happen to a
    message. Create the .procmailrc file I use, and then explain how it works. The
    .procmailrc file shown in Listing 7-5 in your home directory on the OpenLinux
    mail server:


    Listing 7-5 A typical .procmailrc file


    ```

    :0:

    * TOlinux-list@ssc.com

    linux-list


    0:

    * TOjoseph@cheek.com

    my-mail


    0:

    * TOinfo@cheek.com

    info-mail

    ```


    > For purposes of e-mail, a folder is a collection of mail stored in a single
    file. This is different from the file system notion of a folder, which is a directory
    that stores multiple files.


    Each of these simple rules is three lines long. The first line of each rule—a
    colon, a zero,—tells procmail that a new recipe is starting, and to use a default
    lock. The next line, starting with the asterisk, is the filter condition. Filters
    check for specific e-mail addresses in the To: line, such as linux-list@ssc.com,
    joseph@cheek.com, or info@cheek.com. The last line tells procmail what to do with
    each message that matches the filter condition; in these cases, the mail is sent
    to folder linux-list, my-mail, or info-mail. Any mail that is not matched by one
    of these conditions is delivered to the user''s inbox.


    These recipes are checked, one by one, from the first at the top of the .procmailrc
    file to the last at the end of each file. If recipes are are in the /etc/procmailrc
    file and the user''s .procmailrc file, the file system is checked. Mail is not
    delivered


    ![](img/9102b40bb114da6b158a518630807d57_152_0.png)'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'to the inbox unless it does not match a recipe from either file. When a message
    matches a filter condition, the specified action is taken, and mail processing
    stops on that message. This means mail that would match more than one filter condition
    is only acted on by the first filter condition it matches. You can tell procmail
    to continue processing a mail after it matches a filter condition by appending
    the letter c to the new recipe line. This tells procmail to generate a copy of
    the mail that matched the filter, and to continue processing on that copy of the
    message from that point in the procmailrc file. With the procmailrc above, if
    mail was sent to both joseph@cheek.com and info@cheek.com, it would match the
    joseph@cheek.com mail and end up in the my-mail folder. If I wanted it to be delivered
    to both my mail folder, I could have used this:


    ```

    :0:

    * TOjoseph@cheek.com

    my-mail

    ```


    ```

    :0:

    * TOinfo@cheek.com

    info-mail

    ```


    At the end of the first line tells procmail to generate a copy of the message
    and continue processing. The mail would have then been matched by the next filter
    condition, matching info@cheek.com, and been delivered to the info-mail folder
    also. Had the mail not been sent to info@cheek.com, the message copy would not
    match the last filter condition, and it would have then been delivered to my inbox.
    Then I would have a copy of that message in both the my-mail folder and the inbox.


    Each recipe condition is a regular expression, such as would be matched with the
    egrep command. The caret (^) tells procmail to match only at the beginning of
    the line. TO is a macro that expands all forms of To: headers, such as To:, Cc:,
    etc. If you only wanted matches on the To: line, you could replace TO with To:.
    Unfortunately, the TO macro cannot match mail to users as a BCC:, as no header
    is generated for a blind carbon copy. Obviously, a BCC filter condition would
    not match either.


    Regular expressions are powerful and complex—they can be used to match many aspects
    of an e-mail message—but explanation of them in any depth is beyond the scope
    of this book. For more information, I suggest checking the egrep man page.


    ![](img/9102b40bb114da6b158a518630807d57_153_0.png)'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Moving User Mail to a Different Directory


    Separating e-mail is great when it is read on the local filesystem or via the
    IMAP protocol. POP3 does not provide for multiple mail folders, so any mail sent
    to a place over the inbox cannot be read by a POP3 reader. When these messages
    are routed to different folders, however, they are stored by default in the user''s
    home directory. These can clutter the home directory over time. I suggest moving
    mail folders into their own directory, such as a mail subdirectory of the user''s
    home directory.


    Mail folder locations are determined by the MAILDIR variable. The easiest place
    to do this is in the `procmailrc` file, before you create filters. Add this to
    the beginning of your `procmailrc` file:


    ```

    MAILDIR=$HOME/mail

    ```


    Now all mail to folders will be delivered in the mail subdirectory of your home
    directory. The mail subdirectory must exist, and you must have write permissions
    to directory (`procmail` must be able to create files in it, and write to files
    already created inside it). This variable does not affect the location of the
    inbox, which is stored in the `/var/spool/mail` directory. You might want to add
    this to the `/etc/procmailrc` file if you want each user''s filtered mail to be
    stored in their mail subdirectory. Keep in mind, that the mail directory must
    then exist for each user on the system.


    > Note `procmail` will deliver mail to any folder where it has filesystem permissions
    to do so. If told to deliver mail to a file which it does not have permissions,
    the mail will be lost! Always make sure you have write permissions to your mail
    folders. Many system administrators insert a generic rule at the beginning of
    their `procmailrc` files when testing manager `procmailrc` changes:

    ```

    *:0

    * all-mail-goes-here

    ```


    This will save all mail in the all-mail-goes-here folder (if `procmail` can write
    to it), and continue processing with a copy of the message. All mail will be matched
    by this blank rule, as there is no condition after the asterisk on the second
    line.


    # Deleting Unwanted E-mail Automatically


    The filtering capabilities of `procmail` make it a good tool to get rid of unwanted
    e-mail. Because mail can be written to any folder, and folders are just files
    on the filesystem, unwanted mail can be disposed of by placing it in the `/dev/null`
    folder.


    ![](img/9102b40bb114da6b158a518630807d57_154_0.png)'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Chapter 7: Configuring SMTP E-mail with sendmail and procmail


    Mail saved in the /dev/null folder effectively gets deleted. Spam e-mail will
    many times either with a strange From: address or a strange Subject: line; both
    of these can be filtered. Consider the following recipes:


    ```

    * ^From:bogus.email@nodomain.com

    /dev/null

    ```


    ```

    * ^Subject::[mM]ake.[mM]oney.[q0Juick

    /dev/null

    ```


    The first deletes any e-mail from the address bogus.email@nodomain.com. The second
    deletes any mail with a "make money quick" subject header, whether the header
    is capitalized or not. Because these filter conditions are regular expressions,
    they can get fairly advanced. Regular expressions will not be discussed here,
    but a basic rule is to use periods instead of spaces; a period matches any character,
    whereas spaces terminate a regular expression.


    # Creating Automatic Reply Messages



    0:

    * ^Subject:.*autoreply

    | (formail -r : echo "This is your reply.") | sendmail -t


    ```

    * ^Subject:.*autoreply

    | (formail -r : echo "This is your reply.") | sendmail -t

    ```


    This example takes any mail with the word "autoreply" in the subject (the ".*"
    in the recipe recipe condition means any combination of characters) and pipes
    it to formail, echo, and sendmail for processing. formail generates the reply
    headers, echo gives the body of the mail message, and then sendmail sends the
    message back to the originator.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Advanced Filtering


    Many more advanced options exist with procmail. Mail can be forwarded with an
    action beginning with the bang (!) character, such as this example, in which all
    mail with a subject of "Important Message" is forwarded to a pager''s e-mail address:


    :0:


    * Subject::Important.


    ! pageme@domain.com


    Recipes can have multiple filter conditions or can contain more recipes. Actions
    can contain many different programs hooked together by pipes, semicolons, curly
    braces, and parentheses. The procmail man pages give examples of these and more.


    # Starting and Stopping sendmail and procmail


    The easiest way to start or stop sendmail is with the same scripts OpenLinux uses
    when it boots up or shuts down. As root, type the following to stop sendmail:


    ```

    /etc/rc.d/init.mta stop

    ```


    To start sendmail, type:


    ```

    /etc/rc.d/init.mta sendmail

    ```


    Because procmail is a filter and does not run as a daemon, it need not ever to
    be stopped or started. Knowing when to restart sendmail or to run a particular
    command is useful knowledge, but not always obvious. Many times, you can instruct
    a daemon to restart sending it by a particular signal, such as the HUP signal.
    However, this will not work with sendmail, due to the way OpenLinux starts it.
    Here are some suggestions.


    +   If you have changed the /etc/aliases file, sendmail does not need to be restarted.
    Run the command newaliases instead.


    +   If you have changed a file that has a database to be rebuilt with the makemap
    command, sendmail does not need to be restarted. Run the appropriate makemap command
    instead.


    +   If you have changed a core sendmail file, as /etc/sendmail.cf or /etc/sendmail.cw,
    sendmail must be restarted. Use the /etc/rc.d/init.mta restart command.


    +   If you have changed a procmailrc file, nothing needs to be restarted. These
    files are always read on demand.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Chapter 7: Configuring SMTP E-mail with sendmail and procmail


    # # Troubleshooting sendmail


    As you can probably tell, sendmail is an enormous program with an equally enormous
    number of configuration options. The information in this chapter will help you
    get it working correctly, even so there there will be times when it does not do
    what you expect it to. Troubleshooting sendmail is one of the fine arts of OpenLinux
    administration. This section will give you some of the basic tools you need to
    do.


    Most of the time, sendmail will send outgoing mail correctly; even a plain vanilla
    sendmail.com file with no customization would allow outgoing mail to be sent.
    Many of the issues you will face be with incoming mail—perhaps it comes in and
    gets routed incorrectly, perhaps it comes in and gets sent out, perhaps sendmail
    rejects it, or perhaps it never comes at all. From a user''s standpoint, it just
    doesn''t get to them. Your task will be to determine at what point it was rejected
    or misrouted.


    # ## Checking the Server Logs


    When dealing with a sendmail issue, always first check the sendmail log /var/log/mail.
    This will tell whether sendmail received a particular message, and what it did
    with it. A normal exchange looks like this:


    ```

    Sep 7 13:07:59 saltlake sendmail[22982]: NAA22982: from=<owner-linux-list@sc.com>

    size=3339,class=60,pri=141339,msgid=CNDBBGLOIAKEFGCNGCJBIBAPMELGCAA,

    joseph@chek.com>. proto=SMTP, relay=passenger.sender.com [216.39.159.17].

    ```


    ```

    Sep 7 13:07:59 saltlake sendmail[22983]: NAA22982:to=<joseph@chek.com>

    delay=00:00:00, xdelay=00:00:00, mailer=local, stat=Sent

    ```


    These two lines tell us that at 1 PM, local time, sendmail received a message
    from owner-list@ssc.com on the machine 216.39.159.17. It was sent to it, joseph@chek.com,
    with 0 seconds of delay. It appears that this mail transaction was successful,
    because the last comment is stat=Sent. If it had been anything negative, as stat=Rejected,
    you would be able to tell that the mail was not received.


    Each mail transaction has two lines, and they match up with the message ID assigned
    by sendmail. (This message used NAA22982 to correlate these two lines.) It''s
    good to check these, because the lines might not always be next to each other
    in the log. Outgoing mail is logged in the following:


    ```

    Sep 7 12:51:46 saltlake sendmail[22965]: NAA22965:from=<joseph@chek.com>

    size=2279,class=0,pri=92279,ncpts=3,msgid=CNDBBGLOIAKEFGCNGCIBAPMELGCAA,

    joseph@chek.com>. proto=SMTP, relay=sanfrancisco.chek.com [208.12.12.156]

    ```'
  merge: -1
