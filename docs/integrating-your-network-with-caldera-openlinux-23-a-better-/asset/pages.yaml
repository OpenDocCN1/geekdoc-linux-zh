    domain.com mail is handled (pri 100) by mail.domain.com


    host takes the DNS server to query as a second argument. When you''re troubleshooting
    specific DNS problems, it is usually a good idea to tell host server to query;
    if not told which DNS server to query, host picks one, which might not be the
    one you want to verify.


    # Using the dig Command


    dig is a more complete command, and by default will tell you every record of a
    specific type in a zone and the zone as parameters. (The type can be omitted to
    show all A records in the zone.) To show all the NS records for domain.com, type:


    dig ns domain.com


    dig uses the first DNS server specified in your /etc/resolv.conf file, unless
    told to use a different one. Specifying a DNS server to use can be beneficial
    here. You can do that by entering an @ symbol, followed by the name of the DNS
    server to use, as the first parameter:


    dig @ns.domain.com mx domain.com


    When used without any parameters, dig queries the default server for the root
    zone''s authority files. This information can be used to create a current version
    of the root.hints file /var/named/root.hints.


    > Because typing dig by itself gets the current root zone authority records, a
    useful way to refresh the /var/named/root.hints file is by redirecting the output,
    when dig is called in this manner, to the root.hints file. The root servers change
    over time, so it is wise to update the root.hints file every few months.


    To do this, use the following command:


    ```

    dig > /var/named/root.hints

    ```


    Then, restart the DNS server.


