- img_proc: true
  md: 'As explained earlier in this chapter, the route command shows the current routing

    table when called with no options. To add a new route, route must be called with
    the

    add parameter.


    ```

    route add -net 208.12.12.128 netmask 255.255.255.224 dev eth0

    ```


    This command adds a route to the 208.12.12.128/255.255.255.224 network on

    device eth0; basically, it states that all traffic bound for 208.12.12.128 through

    208.12.12.159 should be sent out of the eth0 interface. The -net parameter means

    that this route is for an entire network subnet. If I want to add a route for
    just one

    host, I use the -host parameter instead (in that case, no netmask is specified
    because

    single host is not a network segment).


    ```

    route add -host 192.168.1.1 dev eth0

    ```


    Gateways can be added also. To add a default gateway, use a command similar to
    the

    following:


    ```

    route add default gw 208.12.12.129

    ```


    Routes can be deleted in a parallel manner. Substitute del for the add parameter
    with

    the route command. To delete the gateway just added, use the following:


    ```

    route del default gw 208.12.12.129

    ```


    # Making Routing Changes Permanent


    All of these route commands go into effect immediately, but they do not stay in

    effect after a system reboot. If you want to alter the routes on a permanent basis,
    you

    must these commands to the /etc/sysconfig/network-scripts/ifcfg-routes

    file. This file is a shell script that is called after each system boot to alter
    the network

    routes. If you want to add a route to host 192.168.1.1 on device eth0 permanently,

    use the following file (Listing 2-1).


    Listing 2-1 A sample /etc/sysconfig/network-scripts/ifcfg-routes shell script


    ```

    #!/bin/sh

    #etc/sysconfig/network-scripts/ifcfg-routes

    # permanent server routing changes go here

    route add -host 192.168.1.1 dev eth0

    ```


    This file should be owned by the root user and group. It should be made executable

    for the root user with a command such as the following. (Note, though, that the
    file

    d not exist after a clean installation of OpenLinux; you need to create it).'
  merge: -1
