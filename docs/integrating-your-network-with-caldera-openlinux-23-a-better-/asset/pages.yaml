  md: '# Managing IP Routing


    In this example, two network cards (eth0 and eth1) are shown with their own subnets:
    208.12.12.128/255.255.224 network and a 192.168.1.0/255.255.0 network, respectively,
    with a default gateway of 208.12.12.129 on the eth0 interface. OpenLinux can be
    told to forward packets between the two networks, acting as a gateway for one
    or both networks.


    # Enabling and Disabling IP Forwarding


    IP Forwarding causes OpenLinux to act as a router: it takes packets sent from
    one network and destined for a different network and forwards them to the appropriate
    network. You can toggle IP Forwarding on (or off) from within COAS. (These settings
    are permanent, so they are saved after a server reboot.) From the COAS main menu,
    choose Network Administration, TCP/IP Network Options. This brings up the menu
    shown in Figure 2-8.


    > For some reason, the COAS menu within the KDE desktop does not allow you to
    choose the TCP/IP Network Options window directly, as it does with other windows.
    You have to go to a command prompt, and then run coastool by hand to get that
    option.


    ![](img/9102b40bb114da6b158a518630807d57_42_0.png)


    # Changing Routing from a Shell Prompt


    Most routing automatically is in place if you set up your OpenLinux network correctly;
    if you have two network cards on different subnets, and want to route between
    them, all routing table entries are configured for you if you made the proper
    entries in COAS. Sometimes, however, it is beneficial to alter the routing table
    by hand, to either add or delete routes. This can be accomplished with the route
    command.


    | Networking options | |

    |---|---|n| Networking | Enabled |

    | IP forwarding | Disabled |

    | | Cancel |


    **Figure 2-8** The Networking Options window within COAS'
  merge: -1
