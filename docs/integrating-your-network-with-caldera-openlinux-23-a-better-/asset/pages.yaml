    the % parameter. By default, the e-mail address displayed is mailto:root@localhost.
    You should change this to something more appropriate, such as mailto:ftpadmin@myserver.com,
    and make sure there is an account on your OpenLinux server called ftpadmin. For
    example:


    ```

    mailto:ftpadmin@myserver.com

    ```


    messagefile event class displays the content of the file named /messagefile whenever
    there is an event caused by a user logging in or changing the directory for a
    particular class. Following is an example to display the content of xfile_message.txt
    whenever a user belonging to the class xfile logs in.


    ```

    /usr/local/ftp/xfile/xfile_message.txt login xfiles

    ```


    And here is an example to display the content of restricted.txt whenever someone
    changes into the directory /home/xfile/restricted.


    ```

    /usr/local/ftp/restricted.txt cwd=/home/xfile/restricted

    ```


    Following are some of the commonly used message codes to include in your message
    files:


    | Message Code | Description |

    | --- | --- |

    | %C | Current directory |

    | %E | E-mail address specified in the e-mail command |

    | %F | Free space in the current directory |

    | %L | FTP server name |

    | %M | Maximum number of users allowed for this class |

    | %N | Current number of users for this class |

    | %R | Client host name |

    | %T | Local time, in the format Mon Sep 27 22:00:00 1999, for example |

    | %U | User login name |


    # log commands user


