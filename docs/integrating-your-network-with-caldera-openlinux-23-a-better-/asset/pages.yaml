  md: '# Chapter 10: Configuring RADIUS with Lucent''s radiusd


    ADIUS (Remote Authentication Dial-In User Service) is a protocol designed to authenticate
    users who access networks remotely, such as via modem. RADIUS protocol uses a
    client/server model to authenticate users. RADIUS is centralize user management
    to a single machine, so all remote users can be managed from one central location.
    It uses MD5 encryption when transmitting passwords over the network. By doing
    so, any information sniffed from the network will be unusable, as the data is
    encrypted.


    # Files Referenced in this Chapter


    | File | Purpose |

    |---|---|

    | /etc/raddb | radiusd configuration files are stored in this directory |

    | /etc/radb/clients | contains all the names of RADIUS clients and their shared
    secrets |

    | /etc/radb/users | contains the list of RADIUS users and all their attributes
    |

    | /var/log/secure | normal radiusd log messages will go here |

    | /var/log/radacct | RADIUS accounting information will be stored in files in
    this directory |


    # RADIUS and radiusd Overview


    RADIUS is a protocol, the term can be used to refer to the entire system as well.
    A piece of the RADIUS system is the RADIUS server, radiusd, which stores all of
    the RADIUS passwords. The RADIUS server handles all requests from RADIUS clients,
    such as Lucent (formerly Livingston) Portmasters, Lucent (formerly Ascend) MAX
    switches, or other computers. radiusd can check a user''s password in its own
    database, or the system''s own authentication method, such as /etc/passwd and
    /etc/shadow, NIS (Network Information Service), and so on.


    Additionally, in order for RADIUS to be any of use, you will need a RADIUS client
    that has been properly configured to accept remote users and talk to your OpenLinux
    RADIUS server. RADIUS clients are machines whose job it is to connect a remote
    user (over a modem, for example), and then ask a RADIUS server if this user can
    use the network''s resources. If yes, the client negotiates a suitable connection
    with the remote user''s machine, and allows access to the network. Configuration
    of a RADIUS client is also beyond the scope of this book.


    > To learn all the gory details of the RADIUS protocol, see RFCs 2138 and 2139.
    These can be found at any RFC repository, such as http://www.faqs.org/rpcs/


    ![](img/9102b40bb114da6b158a518630807d57_199_0.png)'
  merge: -1
  pgno: 199
- img_proc: true
  md: radiusd is a UNIX daemon which provides all of the RADIUS server functions.
    As of this writing, the current version of radiusd is version 2.1. (The source
    code is available via anonymous FTP at http://ftp.livingston.com/pub/le/radius/radius21.tar.gz,
