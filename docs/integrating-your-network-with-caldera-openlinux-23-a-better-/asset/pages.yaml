- img_proc: true
  md: '# Troubleshooting procmail


    Creating an e-mail message by hand can be beneficial if you want to be absolutely
    sure what happens when sendmail receives a message. This requires three commands:
    mail from, rcpt to, and data. The mail needs to be from a user at a valid domain,
    such as joseph@cheek.com. It also needs to be sent to a valid user on your mail
    server—in my case, joseph. The message body can be anything, terminated by a line
    with a single period. Try this:


    ```

    mail from: joseph@cheek.com

    250 joseph@cheek.com... Sender ok

    rcpt to: joseph

    250 joseph... Recipient ok

    data

    354 Enter mail, end with ". on a line by itself

    this is an e-mail test.

    ```


    250 OAA31832 Message accepted for delivery

    quit

    221 sanfrancisco.cheek.com closing connection

    Connection closed by foreign host.


    You just sent an e-mail message with a body of "this is an e-mail test." to user
    joseph. The quit command tells sendmail you are done and wish to close the connection.


    # Troubleshooting procmail


    Although procmail does not provide nearly as much debugging information as sendmail
    does, there are still ways to test it. It is easy to set up a rule to copy all
    messages to a specific location, You can run procmail by hand from the command
    line, and feed mail messages (complete with headers) either from the keyboard
    or piped through a file.


    When procmail misroutes a message (due to a bad recipe file, perhaps), it is difficult
    to trace. Many times, the message is lost; in these cases, it''s easy to wonder
    if the message was made at all. Generating a rule at the beginning of the procmailrc
    file to save all messages to a file is wise in these circumstances. Add these
    three lines to the beginning of your procmailrc file:


    ```

    :0:c

    *

    ail-mail-goes-here

    ```'
