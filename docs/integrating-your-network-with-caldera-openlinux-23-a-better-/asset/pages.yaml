  md: 'Starting inn is just like starting most other services in this book. Use /rc/cd/init.d/news
    start to start the daemon, and use /etc/rc.cd/init.d/news stop to stop it. To
    make the daemon start automatically at system boot, enable the InterNetNews transport
    system (indd) system daemon from within COAS (see Chapter 2, “Configuring OpenLinux’s
    Basic Network",


    The first time you start the service, you''ll receive an e-mail message mailed
    to the root account:


    Boot-time Usenet warning on saltlake.com


    No .news.daily file; need to run news.daily?


    You can safely ignore this message—it serves as a reminder that a few cron jobs
    to be added. The first one calls a script that does daily cleanup; the second
    serves as a backup in case all the news doesn''t get sent. In the /etc/cron.d/lib
    directory, create the files shown in Listing 9-3 and Listing 9-4.


    # Listing 9-3 The /etc/cron.d/lib/news.daily file


    ```

    #!/bin/sh

    #news.daily - run innd''s news.daily script

    ```


    ```

    su news -c /usr/libexec/inn/bin/news.hourly

    ```


    # Listing 9-4 The /etc/cron.d/lib/news.hourly file


    ```

    #!/bin/sh

    #news.hourly - clean up news on an hourly basis

    ```


    ```

    su news -c "usr/libexec/inn/bin/rnews -U"

    ```


    Make these files executable with the following command:


    ```

    chmod a+x /etc/cron.d/lib/news.daily /etc/cron.d/lib/news.hourly

    ```


    Then, create links from the appropriate Hourly and Daily directories:


    ```

    ln -s ..lib/news.hourly /etc/cron.d/Hourly

    ```


    ```

    ln -s ..lib/news.daily /etc/cron.d/Daily

    ```'
