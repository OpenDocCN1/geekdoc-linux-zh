    To start the DNS service, use the following command:


    /etc/rc.d/init.d/named


    # Starting and Stopping inetd Network Services


    Some services are not managed by rc scripts at, all rather by inetd. inetd is
    a super-server; it''s job is to manage other system services, such as login and
    telnet. inetd listens to a specified port, and when it gets a connection, it passes
    along to the necessary program. All of these programs are enabled and disabled
    via the file /etc/inetd.conf. Each line in this file tells inetd what program
    to run when a connection is made. The lines in this file look like the following:


    ```

    ftp stream tcp nowait root /usr/sbin/tcpd in.ftpd -l -a

    ```'
