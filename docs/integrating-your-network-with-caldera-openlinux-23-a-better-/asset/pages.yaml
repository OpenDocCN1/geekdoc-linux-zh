- img_proc: true
  md: '# Chapter 12: Configuring the squid Proxy Server


    You just created an ACL domain-com, which encompasses all IP traffic from 192.168.0.1
    through 192.168.0.255. (I use the domain-com name to remind me that it is for
    the domain.com network, although I could call it anything). Look further in this
    configuration file for this line:


    ```

    http_access allow localhost

    ```


    This line tells squid to allow http (Web) access for the ACL localhost, which
    is previously defined as all access coming from the IP address 127.0.0.1. Because
    you defined a new ACL called domain-com, insert a line to allow access for this
    as:


    ```

    http_access allow domain-com

    ```


    Now your entire workgroup on the 192.168.0.0 network can use the squid proxy server
    for Internet access. There are many other types of access control lists, in which
    you can disable or enable access on specific ports, or to specific sets of IP
    addresses or domain names. These all follow the same format: define the ACL with
    the acl command, and then enable or disable it with the http_access command.


    > There are no http_access or ftp_access commands. Define all access rules with
    the http_access command instead. Rules you define with http_access will be in
    force for FTP and secure web access also.


    ![](img/9102b40bb114da6b158a518630807d57_241_0.png)


    Each time you modify the squid.conf file, you must restart squid. How to do so
    is explained in the "Starting and Stopping squid" section later in this chapter.


    # Configuring Ports


    The squid server listens on port 3128 for its commands. You can configure squid
    to use a different port, using the http_port command in the squid.conf file. Look
    for this line:


    ```

    #http_port 3128

    ```


    Because this line is commented out, squid listens to its internal default, port
    3128. If you want this to be a different port, uncomment this line and change
    the port number. If you want to use port 1500, for example, you can change this
    line to be as:


    ```

    http_port 1500

    ```


    Remember to remove the hash mark to allow squid to see the command! Note that
    because squid runs under normal user privileges, you cannot use a port number
    lower than 1024.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Configuring logging


    The access log is controlled by the cache_access log command in the configuration
    file.


    ```

    #cache_access_log /var/log/squid/access.log

    ```


    The log''s default name is /var/log/squid/access.log. You don''t need to change
    the log name unless you want to move the log somewhere else. You might want to
    change the format of the log, however; this is controlled by the emulate_httpd_log
    command.


    ```

    #emulate_httpd_log off

    ```


    squid uses its own log format, which is good for squid-specific log analyzers,
    such as calamaris, but not good if you want to parse the log files by hand. It
    can also log in the normal httpd Web server log format, so its logs can be analyzed
    by more common programs, such as analog. If you want to use analog to analyze
    the Web logs, change this line to:


    ```

    emulate_httpd_log on

    ```


    This also makes the log file a little more readable, at the expense of detailed
    information. You can choose whichever format suits your taste. Keep in mind that
    you must restart squid after any changes to the squid.conf file.


    # Configuring the Cache


    squid caches copies of each document it receives so that the next time the document
    is requested, it does not need to go back to the Web to get it. The standard Web
    cache size is 100 Megabytes; unless your network needs are involved, this cache
    size is adequate. You can control the size of the cache, however, as well as how
    long items stay in cache. Search for the following line:


    ```

    #cache_dir /var/pool/squid 100 16 256

    ```


    This line gives the default cache directory /var/pool/squid, as well as the size,
    100 Megabytes. You can change the directory and the cache size by altering this
    line. If you do alter it, remove the hash mark (#) in front of it, so it will
    not be commented out. To create, instead a 250 Megabyte cache directory in the
    /opt/squid/cache directory, use the following line:


    ```

    cache_dir /opt/squid/cache 250 16 256

    ```


    The last two numbers, 16 and 256, control how the cache directories are created;
    normally, you do not need to alter them.'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'If a document has not been accessed for more than a set amount of time, squid
    deletes it automatically. The default time is one month; this is set by the reference_age
    parameter:


    ```

    #reference_age 1 month

    ```


    One month should be plenty of time, but you might want to shorten the time to
    a week or two:


    ```

    reference_age 2 weeks

    ```


    Again, if you change this line, remember to remove the beginning hash mark.


    # Disabling IP Forwarding


    A proxy used in lieu of a direct Internet connection. In such cases, you might
    want to prevent users from being able to access the Internet directly, bypassing
    the proxy and whatever security you placed there. To restrict access, you need
    to disable IP forwarding on the machine that is the Internet gateway. If the gateway
    is the same server that contains the proxy (it normally is), disable IP forwarding
    by using COAS. (This is explained in Chapter 2, "Configuring OpenLinux''s Basic
    Network," under the "Managing IP Routing" section.)


    A side effect of disabling IP forwarding is that no machines can get out to the
    Internet without use of the proxy (except for the gateway machine itself, which
    doesn'' because it is directly connected to the Internet). If you have machines
    that require services that the proxy does not handle, such as telnet, they cannot
    access those services. In this case, if you still want to disable Internet access,
    use the ipchains firewall tool. (You can find more information on ipchains in
    Chapter 10, "Building a Firewall with ipchains.")


    # Starting and Stopping squid


    The squid server comes with scripts in the /etc/rc.d/init.d directory that start
    and stop it. Before you use the server for the first time, you must initialize
    the cache directories by running squid with the -z option.


    ```

    squid -z

    ```


    If successful, you see the message:


    Creating Swap Directories


    After do this, you can start and stop squid with the normal rc scripts. /etc/rc.d/init.d/squid
    start to start squid, and /etc/rc.d/init.d/squid stop to stop squid. To configure
    squid to start when OpenLinux starts (after a system boot),'
  merge: -1
