  md: '# # Accounting Attribute Definitions


    +   - Acct-Status-Type. Account status type. This is either START or STOP.

    - Acct-Delay-Time. The delay time between when the event occurs and the NAS sent
    the record.

    - Acct-Session-Id. A unique identifier for the session assigned by the NAS equipment.

    - Acct-Authentic. Indicates whether the user was authenticated by RADIUS or a
    local NAS user.

    - Acct-Session-Time. The connection time of the session in seconds.

    - NAS-IP-Address. The IP address of the NAS to which the user is connecting.

    - NAS-Port-Type. The port type on the NAS to which the user is connecting (Async,
    Sync, ISDN).

    - Framed-User-Address. The IP address assigned to the user for a Framed-User connection.

    - Framed-IP-Netmask. The IP netmask assigned to the user for a Framed-User connection.

    - Acct-Input-Octets. The number of octets (bytes) received from the user.

    - Acct-Output-Octets. The number of octets (bytes) sent to the user.

    - Calling-Station-Id. The phone number called.

    - Calling-Station-Id. The phone number of the calling station.

    - Timestamp. The time record arrived on the server in seconds from epoch (1/1/1970
    00:00:00).

    - Request-Authenticator. Appears when the accounting record has a problem with
    its digital signature. A value of None indicates it was not signed. A value of
    Unverified indicates the signature did not match the expected.

    - Acct-Terminate-Cause. The reason the session was terminated. If the terminate
    cause is Admin-Request, the session was terminated by an administrator. If it''s
    Host-Request, the Login-User session was terminated by the Login-IP-Host. Idle-Timeout
    is due to excessive idle time. Session-Timeout is seen when the user exceeds the
    maximum session time. A problem with the phone line can manifest itself as a Lost-Carrier
    reason. A normal Framed-User session is ended with a terminate cause of User-Request.


    Many ISPs offer limited accounts which include a certain amount of time per month
    and a charge for additional hours used in addition to the base hours. RADIUS accounting
    is the method used by ISPs to determine how many hours of their users have used
    each month. That way, they can determine how much to bill each one based on the
    individual plan and how much time each used.'
