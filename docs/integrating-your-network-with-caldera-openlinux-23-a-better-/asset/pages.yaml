  md: '# Chapter 5: Configuring DNS and bind


    MX stands for mail exchanger, and is used to specify which host collects mail
    the domain. The number before the hostname (100, in this case) is its priority.
    Multiple mail changers can be specified for a particular zone, with different
    priorities. When e-mail is sent to a zone, the host with the lowest MX priority
    is tried first; if that host cannot be contacted, the host with the next priority
    is contacted, and so on. Multiple MX records are used to ensure that e-mail is
    not lost if one goes down.


    There are a few other things that are important about this file. First, the serial
    number should always be a concatenation of the current year, the day of the month,
    and a number representing the revision number of the file on that date. The serial
    number I199906031, represents the first change on June 3, 1999. For the second
    change of the day, I would instead use 199906032, and so on. Whatever number is
    correct for the current date.


    ![](img/9102b40bb114da6b158a518630807d57_99_0.png)


    > Always update the serial number when you edit a zone file! Forgetting to do
    so might keep your changes from being recognized by DNS servers.


    Second, the hostmaster.domain.com. on the SOA line is not a hostname, even though
    it looks like one—it is in fact an e-mail address, one for the person responsible
    for that particular zone. hostmaster is used as a standard e-mail address, although
    it can easily be any other e-mail address. This e-mail address generally is an
    alias pointing to a real person.


