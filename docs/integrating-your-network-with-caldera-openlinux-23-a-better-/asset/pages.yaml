    The last piece of security you want to deal with regarding a firewall is making
    sure it is secure. After, if the firewall is broken into, your protection is gone.
    Don''t leave your firewall wide open to the world. Only allow what you need to.
    In addition, don''t run unnecessary services. For instance, do you really need
    to fingered on a firewall? Comment out those unnecessary services in inetd.conf.
    If you only run what you need to, and only allow the packets you need to you will
    have the best security without disconnecting the LAN from the outside world.


