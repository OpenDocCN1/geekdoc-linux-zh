  md: '# Chapter 6: Configuring the Apache Web Server


    As of writing, Apache is the world''s most popular Web server (according to surveys
    from Web statistics companies, such as Netcraft). Apache was based on the httpd
    Web server from the NCSA (National Center for Supercomputing Applications), at
    the University of Illinois at Urbana-Champaign. Apache has replaced that project;
    NCSA''s httpd server is no longer developed or enhanced. Apache still carries
    the name httpd, though; in OpenLinux, the Apache program file name is httpd-apache.


    Apache can handle the standard Web requests, such as static HTML pages, CGI (Common
    Gateway Interface) content, and SSI (Server Side Includes). More and more Web
    sites are built with server-side scripting languages, such as ASP (Active Server
    Pages) or PHP (Hypertext Preprocessor). Apache supports extension through modules
    that can either be built in or loaded dynamically; these extensions can perform
    database lookups, serve CGI processing and more. (Most of the time, if Apache
    cannot do this in the base package, someone has built a module to add that capability.)


    # Files Referenced in this Chapter


    The following table lists the files used by the Apache Web server. (Additionally,
    a personal document root is in the public_html directory inside each user''s home
    directory.)


    | File | Purpose |

    | --- | --- |

    | /etc/httpd/apache/conf | Apache configuration files directory |

    | /etc/httpd/apache/conf/httpd.conf | Apache''s basic configuration file |

    | /etc/httpd/apache/conf/srm.conf | Apache''s server resource management configuration
    file |

    | /etc/httpd/apache/conf/access.conf | Apache''s access configuration file |

    | /etc/httpd/apache/logs | Apache''s log directory, symbolically linked to /var/log/httpd/apache
    |

    | /var/log/httpd/apache/access_log | Apache''s access log |

    | /var/log/httpd/apache/error_log | Apache''s error log |

    | /var/run/httpd.pid | Apache''s process ID file |

    | /home/httpd | Apache''s http daemon home directory |

    | /home/httpd/html | Apache''s document root |

    | /home/httpd/cgi-bin | Apache''s CGI directory |'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Apache Enhancements from Other Sources


    One limitation of Apache is its lack of support for SSL (Secure Sockets Layer)
    which is required for secure Web transactions. SSL is available in 56 bit and
    128 bit encryption (over 56 bit encryption is non-exportable). The algorithm used
    for the encryption in SSL is patented as well, making it even more difficult for
    there to be a usable open source implementation. Currently, Raven and Stronghold
    are two Apache based servers that are commercially available. There is also the
    open source Apache-SSL. However, this is not legal to use within the United States
    due to the encryption patent.


    A less limiting but perhaps frustrating limitation of Apache is the method of
    configuration. Apache utilizes text configuration files (as do Linux programs).
    Making any changes to Apache requires hand-editing configuration files. There
    are front end programs that edit the configuration files for you, which provides
    you with an easy interface, but none are bundled with OpenLinux.


    # Configuring Apache


    The Apache that ships with OpenLinux supports HTML, CGI, and SSL content. The
    Basic Apache Configuration section lists the values that need changing for any
    type of Web site, or at least those that I suggest you change from their default
    values as a matter of course. These values apply to a typical Apache configuration
    for a small Web site where most content is static, such as for a small business
    Web site or a small corporate intranet.


    # Basic Apache Configuration


    A basic Web server setup serves static HTML pages with occasional CGI content.
    Configuring Apache for this is fairly simple, because these are defaults for most
    Web sites. Standard HTML files can be placed inside the /home/httpd/html directory
    and given either an .html or .htm extension.


    CGI scripts can be placed inside the /home/httpd/cgi-bin directory, where Apache
    will consider them to be cgi scripts. CGI scripts can be placed outside the cgi-bin
    directory provided the necessary changes are made to the configuration files.
    Usually if this is done, it is set up so that files ending in .cgi, and .pl are
    considered cgi programs. World execute permission (chmod +x) must be set in for
    scripts to run.


    By default, Apache looks for the index.html file when a Web browser searches for
    a URL without a filename. If it can''t find index.html, it looks for index.htm.
    If it can''t find index.htm, it returns an error to the browser, stating that
    the directory index was forbidden.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Chapter 6: Configuring the Apache Web Server


    Since Apache runs as the nobody user and group (by default), all HTML files need
    to be owned by httpd or world readable for Apache to read them.


    There are three steps to configuring Apache for basic Web site serving: configure
    basic server settings, configure the server''s request management, and configure
    access rights for the Web site. Each of these corresponds to a different file
    in the /etc/httpd/apache/conf directory.


    The version of Apache that ships with OpenLinux 2.3 uses three separate configuration
    files, as shown in this book—/etc/httpd/apache/conf/httpd.conf, /etc/httpd/apache/conf/srm.conf,
    and /etc/httpd/apache/conf/access.conf. Newer versions of Apache use just one
    file, /etc/httpd/apache/conf/httpd.conf, which contains all directives previously
    found in the three files.


    ![](img/9102b40bb114da6b158a518630807d57_113_0.png)


    # Basic Server Configuration


    Basic configuration is contained in the /etc/httpd/apache/conf/httpd.conf file.
    Each line controls a specific setting for Apache, such as the port number and
    IP address(es) to it listens, and what types of information to log, and so on.
    Caldera has set most of them to reasonable default values, but there are a few
    lines that need changing. Edit the file and look for the following lines:


    ```

    ServerAdmin root

    ```


    +   - This is the e-mail address of the Apache server administrator. Change this
    to your e-mail address.


    ```

    CustomLog /var/httpd/apache/access_log common

    ```


    ```

    #CustomLog /var/httpd/apache/access_log combined

    ```


    +   - The two forms of this command tell Apache what information to log and where
    to log it. I suggest adding a hash mark (#) to the first line and removing it
    from the second to use the combined log format instead of the common format. The
    combined log format gives the same information as the common format, such as date,
    time, URL requested, status of the request, and so on. It also logs the user agent
    (Web browser) of the person accessing the site, as well as the URL of the Web
    page that brought the user to this page. Both of these items are worth logging
    for statistical tracking purposes.


    ```

    ServerName localhost

    ```


    +   - Change localhost to the fully-qualified domain name of this machine. Typically,
    this will be something like www.domain.com.'
  merge: -1
  pgno: 113
