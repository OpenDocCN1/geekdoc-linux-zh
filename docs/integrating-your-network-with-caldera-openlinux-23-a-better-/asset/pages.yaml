  md: '# Chapter 13: Configuring telnet, ssh, and DHCP Services


    ![](img/9102b40bb114da6b158a518630807d57_255_0.png)


    Changing a user''s shell to /bin/false also can disable that user''s console login
    and FTP access to your server. Never do this for the root user.


    > > **CAUTION**


    To re-enable a user''s capability to login, change the shell back to a normal
    shell, as /bin/bash.


    ```

    chsh -s /bin/bash joseph

    ```


    You can restrict access on the basis of the user''s location by using the tcpd
    daemon, which checks that a connection is coming from an allowed source before
    granting the connection request. To specifically enable a connection from a host
    or a set of hosts, you need to edit the /etc/hosts.allow file. You can range connections
    from a specific host, an IP address, a domain name, or a range of IP addresses.
    Here is an example:


    ```

    telnetd: .cheek.com 127.0.0.1 192.168.1 host2.domain.com

    ```


    The algorithms for allowing connections are based on pattern matching of both
    IP addresses and hostnames. The .cheek.com means any host from the cheek.com domain;
    these patterns must start with a period to be valid. 127.0.0.1 matches the localhost
    IP address—I use that so I can telnet from my own machine. 192.168.1x matches
    all IP addresses in the 192.168.1x subnet; the IP address must end with a period
    to match a range of addresses. I also allow the host host2.domain.com telnet access
    to my OpenLinux server. Finally, successful tcpd restriction requires the placement
    of the following line in the /etc/hosts.deny file (the line tells tcpd to stop
    all telnet traffic that is not specifically allowed by /etc/hosts.allow).


    ```

    telnetd: ALL

    ```


