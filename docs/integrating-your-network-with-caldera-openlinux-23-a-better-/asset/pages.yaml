  md: 'The CD that accompanies this book contains an assortment of powerful networking
    utilities, sample configuration files referenced in the book, and the complete
    Cheek Consulting Knowledge Base.


    # Running the CD


    To make the CD more user-friendly and take up less of your disk space, no installation
    is required. This means that the only files transferred to your hard disk are
    the ones you choose to copy or install.


    ![](img/9102b40bb114da6b158a518630807d57_277_0.png)


    This CD has been designed to run under Linux. However, you may open and navigate
    the CD in any Operating System that has a graphical HTML viewer.


    # Linux


    +   1. Open the CD tray and insert the CD.

    2. As root, type the following at the command line: mount/dev/cdrom/tmp (replace
    /tmp with wherever you want to mount the CD).

    3. Start an X session (startx in most cases).

    4. Open Netscape Navigator.

    5. Choose Open from the File menu, and then click the browse button.

    6. Browse to start_here.html.


    # Windows 95/98/NT4


    +   1. Insert the CD in the CD-ROM drive, and close the tray.

    2. Go to the Control Panel and double click the CD-ROM Drive.

    3. Start start_here.html (works with Netscape and Internet Explorer).


    # The Prima License


    The first window you will see is the Prima License Agreement. Take a moment to
    read the agreement, and click the "I Agree" button to accept the license and proceed
    to the user interface. If you do not agree with the license, click the "I Disagree"
    button and the CD will not load.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# The Prima User Interface


    The opening screen of the Prima user interface contains a two-panel window. The
    left panel contains the structure of the programs on the CD. The right panel displays
    a description page for the selected entry in the left panel.


    # Resizing and Closing the User Interface


    To resize the window, position the mouse over any edge or corner, hold down the
    left mouse button, and drag the edge or corner to a new position.


    To close and exit the user interface, select File, Exit (your specific X setup)
    may have a unique graphical means of closing Netscape.


    # Using the Left Panel


    If you want to view a Tool, click on Tools. A drop-down menu appears, listing
    the various Tools on the CD. Then simply click the tool you wish to download or
    view and it will open in the right window. The procedure is the same for Scripts,
    Modules, and Help.


    # Using the Right Panel


    The right panel displays a page that describes the entry you chose in the left
    panel. Use the information provided to learn details about your selection — such
    as what functionality an installable program provides. To download the particular
    file, follow the directions that appear in the left panel.'
