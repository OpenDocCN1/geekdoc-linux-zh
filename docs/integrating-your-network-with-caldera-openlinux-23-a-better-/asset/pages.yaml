    You can see how the devices are mounted into the local file system, which allows
    access. In this scenario, the users are importing their home directories.


    The third column of fstab indicates the file system type:


    ```

    /dev/sda / ext2

    /dev/hdb /mnt/cdrom iso9660

    nil.foo.edu: /home NFS

    ```


    In Linux, there is a large list of file systems that can be read or written to.

    In the fourth column, you can define additional options relating to the file system.
    With NFS devices, this is the heart of its configuration at a user''s end. The
    following are the basic options you can place in the fourth column.


    +   - rsize=x The number of bytes that the NFS server will read before transmission.
    Depending on network speed, traffic, server load, and performance, this number
    can vary greatly. In most environments, it is safe to set this at 8KB or 16KB.
    This number must be converted directly to bytes, so rsize of 16KB would be written
    as rsize=16384.

    - wsize=x If rsize is the number of bytes read at a time, wsize naturally is the
    number of bytes written at a time. Because most clients read and write to an NFS
    server equally, it is wise to set the wsize to be the same as the rsize.

    - timeout=x This is the number of tenths of a second the client waits for a response
    from the server before retransmission. If the server does not respond in the first
    interval, the client doubles the interval until a maximum of 60


