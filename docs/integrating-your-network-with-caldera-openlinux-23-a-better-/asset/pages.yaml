  md: '# Chapter 11: Building a Firewall with ipchains


    any people think that if you have a firewall your computer network is completely
    secure. This is a myth! Firewalls are simply one tool to make a network more secure
    than it was before. A network will always be vulnerable to internal corruption.


    # Files Referenced in this Chapter


    | File | Purpose |

    | --- | --- |

    | /etc/rc.d/init.d | File where firewall start script is located |

    | /etc/ipchains | File defining your ipchain ruleset |

    | /etc/modules/default | Configuration file for IP forwarding modules |


    Security can be compromised from within. For example, a disgruntled employee can
    do significant damage by corrupting the files on the server. This same user might
    change other users'' passwords to stop them from using their accounts while the
    data is being systematically destroyed.


    So what does a firewall do? A firewall simply provides an additional line of protection
    to your computer network and data. Whether it''s additional computing power, more
    bandwidth, or simply the numbers, your network might contain exactly what every
    attacker wants. Consequently, you need a firewall to protect yourself, even if
    it can''t provide perfect protection.


    You can make a firewall as complex and time-consuming as you want. You can save
    every packet that goes in and out of the firewall, and you can make sure that
    a human looks at every packet to verify the content, although this would be overkill
    in most networked environments.


    For a firewall to provide any type of security, it needs to do some type of packet
    filtering. In packet filtering, the firewall looks for specific information in
    a packet to determine its type, source, destination, port, and protocol. Based
    on this information, the firewall either permits the packet to pass through or
    rejects it.


    A firewall is a computer (or computers) that is connected to both the internal
    network and the external network directly. This means that these computers have
    a direct interface with both worlds. In many cases, this is done by having multiple
    network interface cards, or a network interface card along with a card that is
    specific to your Internet connection. Because the internal and external networks
    are connected through a computer that requires the packets to go from one network
    interface to another, this cannot occur without going through the firewall.


    # Firewall Overview'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Firewall Overview 201


    The requirement that the packet must pass through the firewall is useless unless
    there is a rule regarding that packet. The rules in the firewall can be as complex
    or as simple as the administrator desires. For example, a simple ruleset could
    instruct the firewall to permit every packet to leave the firewall and deny all
    the packets that want to enter. A more complex rules might allow common Internet
    services in and out, such as http, ftp, smtp, pop3, and dns, yet deny other protocols
    used inside the local network (nfs, nis, dhcp, lpr, netbios, etc.).


    # Using Firewalls vs. Proxy Masquerading for Security


    There are several procedures to follow in order to create a firewall. You can
    use a standard firewall, which provides transparent security to your network.
    You can also use a proxy firewall, which is plainly visible to your clients and
    to those outside your network. Last, you can use IP masquerading by having a gateway
    that provides your way to the Internet, which allows your network to use only
    one IP address or a block securely. In addition, this method is transparent to
    most of your client''s applications. Combining masquerading and packet filtering
    adds extra security to your network.


    # Using Firewalls


    A transparent firewall benefits both the end user and the administrator. With
    a transparent firewall, users don''t have to make obtrusive changes to their systems
    to be able to access the outside world. A transparent firewall also acts as a
    packet filter, which allows you to use a single system and possibly fewer resources
    than other methods. You can purchase a packet filter out of a box—you don''t need
    an in-depth understanding of how the firewall acts. This method can potentially
    decrease the number of logs the System Administrator needs to go through.


    Naturally, there must also be disadvantages to using transparent firewalls, or
    everybody would use this solution. One negative is that you must have a range
    of IP addresses, unlike with a masqueraded solution. Additionally, you cannot
    cache any of your data (as is possible with a proxy firewall). Finally, unless
    you go through the process of making a large set of rules, you cannot log your
    users or potential intruders.


    Imagine that you have acquired a block of IP addresses, 12.34.56.1-70. Using these
    IP addresses, the local network computers communicate directly with the computers
    on the Internet. All packets will pass through your router and out into the Internet
    without needing to use a proxy server, or be masqueraded. Since there is still
    a single point where all connections go through, you can still filter the packets
    with your firewall.'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'The following steps illustrate the process of a browser requesting a Web page
    in a public network.


    +   1. The computer (12.34.56.18) uses its browser to connect to its default gateway/router
    and requests a Web page. No special browser configurations are required.


    +   2. The firewall allows all http (port 80) traffic, as DNS properly configured,
    and then passes the request to the next router.


    +   3. The computer gives the request to the Web server on port 80; the Web server
    tells the computer to use port 3248 for further communication and sends the Web
    page to the computer on port 3248.


    +   4. The request passes through all the routers on the way back, just as it
    did on the way to the site, and begins to receive the packets on port 3248.


    +   5. The browser reads the packets and delivers the Web page.


    Here, the only connection is between the computer and the Web server. These are
    the only computers (at this time) to send the request on port 80 and to have the
    request negotiated and sent back to the computer on port 3248. To deny all access
    to Web sites, you have only to deny all outgoing packets from the internal network
    on port 80. This way, the request never reaches the Web server and the negotiation
    (and sending) of the Web page never occurs.


    # # Proxy Server


    A proxy server is an intrusive but effective method of logging clients and potential
    intruders. By having a proxy server, the Administrator has complete control over
    your network; this complete control can also benefit the client. For example,
    you could spare clients from having to see annoying pop-up windows on certain
    Web sites. As a proxy, any or all of the data that goes through your network can
    be cached, which can be beneficial. An ISP might find that most users visit specific
    sites as news, sports, and search engines. When the first client accesses the
    site, that days news can be cached and frequently updated. Using such cached data
    can save ISP''s money by reducing the amount of bandwidth they need from their
    upstream providers.


    Clients need to make certain adjustments to their systems to use the proxy. Because
    there is a very limited amount of proxying software, the services the client can
    access are sometimes very limited.


    # # IP Masquerading


    IP masquerading benefits both the client and the Administrator. The client has
    a transparent connection where everything acts as if it is connected directly,
    even though it is not. The Administrator can use a single IP address for the server
    and'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Firewall Overview


    then allocate IP addresses to the clients of the allocated private network blocks
    RFC 1597 blocks of addresses). By doing this, all clients are protected because
    those outside the internal network cannot access the private network over the
    Internet.


    The disadvantages of IP masquerading relate to the services that can be provided
    by other systems on your network. If you are masquerading your entire network
    (using a single real-world IP address), the system doing the masquerading is the
    only one that can be your external Web, fpt, mail, or dns server unless you force
    the connection to an inside machine. This can dramatically increase the load on
    your server, and because this server is exposed to the Internet in more ways,
    there are more potential vulnerabilities.


    A proxy is a program that does the packet filtering automatically, and it might
    cache data as well. Packets using traditional proxies will never directly access
    the Internet from your internal network because they are all required to pass
    through your packetfilter. You can find several programs that act as proxies,
    but this is much more limited than other methods of masquerading. One program
    that acts as a caching proxy is squid (Web proxy). Several other proxy programs
    also exist for your use.


    > When using traditional proxies, your internal network should assign IP addresses
    from the RFC 1597, Private Network Allocations (that is, 10.*.*, or 192.168.*.*).


    If you want to use squid on your firewall, follow these steps to enable your browser
    to access a Web page:


    +   - Configure the computer''s browser to use the proxy at port 8080.

    - The computer (192.168.1.52) connects to the firewall''s internal network interface
    (192.168.1.1) is on port 8080 (the port where squid runs).

    - squid indicates its acknowledgment of the request and tells your computer to
    go to port 3248 (or any arbitrary port number) for further communication.

    - The firewall connects to the Web site using its external network interface (134.56.7.89)
    on port 80.

    - The Web server acknowledges the firewall''s request and tells it to switch to
    port 3587 (or any arbitrary port number).

    - The Web server sends the data to the firewall.

    - The proxy processes the data and remembers that the request for this data was
    from 192.168.1.52, which is on the internal network, and sends the data to the
    computer on port 3248.

    - The browser on the computer processes the page, and the user sees the Web page.


