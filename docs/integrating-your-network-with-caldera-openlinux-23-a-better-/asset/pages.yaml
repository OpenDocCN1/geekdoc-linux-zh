- img_proc: true
  md: '# Chapter 12: Configuring the squid Proxy Server


    proxy server, such as squid, makes it unnecessary to establish a direct connection
    between a client requesting a resource and a server providing that resource. In
    an environment where there are no proxy servers, the client requests a resource,
    the request goes directly to the server providing the resource, and the server''s
    response travels directly back to the client (see Figure 12-1). The client and
    the server must be interconnected.


    When a proxy server is added, all traffic from the client goes to the proxy server
    instead of directly to the server. The proxy receives the request, processes it,
    and then transmits the original request on behalf of the original client. When
    the response from the server is received, the proxy server sends it back to the
    client (see Figure 12-2). The proxy server and the client must be interconnected,
    as must the proxy server and the server; the client and the server do not need
    to be interconnected.


    # Files Referenced in this Chapter


    OpenLinux''s squid package uses the following files:


    | File | Purpose |

    | --- | --- |

    | /etc/squid/squid.conf | squid''s configuration file. |

    | /usr/doc/squid-2.2.STABLE | squid''s documentation is stored in this directory.
    |

    | /var/log/squid/access.log | squid''s access log is stored in this file. |

    | /var/run/squid.pid | Contains squid''s process ID. |

    | /var/spool/squid | squid caches its data in this directory.


    ![](img/9102b40bb114da6b158a518630807d57_237_0.png)


    **Figure 12-1** A client and a server typically communicate directly. The client
    requests a resource; the server receives the request, processes it, and sends
    the response back to the client.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# An Overview of the squid Proxy Server


    ![](img/9102b40bb114da6b158a518630807d57_238_0.png)


    12-2 A proxy server acts as an intermediary between the client and the server.
    The client requests a resource from the proxy, the proxy retrieves the response
    from the server and relays it back to the client.


    # An Overview of the squid Proxy Server


    A proxy server''s most useful feature is its capability to bring security to an
    Internet-connected network. When properly configured, a proxy server can halt
    outside access to a network while allowing outside Internet access from a network;
    caching proxies, such as squid, can even speed up Internet access by keeping local
    copies of frequently-used pages on a hard drive. By forcing all Internet access
    through a proxy, an administrator can negate the need for a firewall and can keep
    tabs on all Web and FTP traffic coming from a network. This can reduce time spent
    on administrative tasks.


    # Strengths and Weaknesses of squid


    Although one caching Web and FTP proxy server, squid, is both fast and secure,
    it is limited to proxying Web and FTP traffic only. This is probably squid''s
    biggest limitation. Other proxy servers, such as Microsoft''s Proxy Server for
    Windows NT, can proxy all sorts of IP traffic, including telnet, when telnet''s
    proxy client is loaded. Telnetting through a squid proxy requires first telnetting
    to the proxy server gateway machine, and then telnetting out of there, a rather
    time-consuming process.


    On the plus side, squid is highly customizable and supports many types of access
    control lists, which detail who can access resources at what time on what day
    of the week, and so forth. It can be used in conjunction with other proxy servers
    to'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'take information from their caches, so that the actual Internet resource needs
    to be accessed only on rare occasions. This can greatly speed up Internet access,
    particularly on heavily loaded Internet connections.


    # Configuring squid


    To get squid, you need to complete four tasks (none of which are particularly
    difficult):


    +   1. Install squid on your OpenLinux server.

    2. Perform some squid configuration tuning.

    3. Start squid as a daemon.

    4. Reconfigure the Web browser of each user who will use squid.


    # Installing squid


    Look for squid on the OpenLinux CD within the /contrib/RPMS directory. It is not
    installed with a complete OpenLinux installation. Because squid is an RPM package
    and does not need to be compiled, you can simply install it. First, create squid
    user and group IDs. Next, install the squid-2.2.STABLE-3.1386.rpm file.


    # Creating the squid User and Group


    The squid proxy server runs under its own user and group IDs. Create these with
    COAS or lisa, whichever you feel comfortable using. The user and group IDs should
    be squid, the home directory doesn''t matter, and the account should be disabled.
    (For more information on using COAS, refer to Chapter 2, "Configuring OpenLinux''s
    Basic Network.")


    When you install the squid binaries, they install with the user and group IDs
    squid. If the squid user and group IDs do not exist, root ID is used, and squid
    fails to function correctly.


    # Installing the squid Binaries


    Mount the OpenLinux 2.3 CD with the command mount /mnt/cdrom, if it is not mounted
    already. Then type this command:


    ```

    rpm -ivh /mnt/cdrom/col/contrib/RPMS/squid-2.2.STABLE-3.1386.rpm

    ```


    You see the following output:


    ```

    squid #################################

    ```'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'rpm, the Red Hat Package Manager, loads packages in .rpm format,

    Caldera and many other Linux distributors use. The i option means install, the
    v

    options tells rpm to be verbose, and the h command calls rpm to use hash marks
    (#)

    to show progress. If you mounted the Caldera CentOS CD, you can now

    unmount it with the command umount /mnt/cdrom.


    # Configuring the Proxy Server


    squid''s configuration file, /etc/squid.d/squid.conf, is huge but well-documented.

    Additionally, the defaults work well, for the most part; access control needs
    to be

    configured, however, before squid can work for any machine besides the machine
    it is

    set up on. You should probably configure the following options as well:


    +   * Access control

    * IP ports

    * Log files and types

    * IP forwarding


    # Configuring Access Control


    The proxy server comes with extensive access control lists, which by default

    allow only the local server to access the Internet through the proxy server. In
    a work-

    group, you probably want to allow other machines to use the proxy server, and
    so

    need to give them access. The configuration file,/etc/squid.d/squid.conf contains

    the access lists under the ACCESS CONTROLS section.


    The acl keyword defines an access control list; the http_access keyword implements
    it.

    The configuration file (commented out) lists many examples, after which a few
    rules

    are actually in force (not commented out). Look for the following line:


    ```

    acl localhost src 127.0.0.1/255.255.255

    ```


    This defines an ACL named localhost as all access coming from the IP address

    127.0.0.1, the local IP address. Define an ACL for your workgroup by using a

    descriptive name (such as your domain name), an IP address, and a subnet mask.
    If

    you are using 192.168.0.1 through 192.168.0.255 for your domain.com internal

    network, with a subnet mask of 255.255.255.0, you use this:


    ```

    acl domain-com src 192.168.0.1/255.255.255.0

    ```'
  merge: -1
