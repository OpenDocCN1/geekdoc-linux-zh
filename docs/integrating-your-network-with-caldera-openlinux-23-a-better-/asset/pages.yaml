  md: '# Chapter 4: Using NFS and LPRng for UNIX File and Printer Sharing


    # Files Referenced in this Chapter


    | File | Purpose |

    |---|---|

    | /dev/nfsd | file present if NFS is compiled into kernel |

    | /etc/exports | file that allows NFS export configuration |

    | /etc/hosts.allow | file responsible for allowing access to host |

    | /etc/rc.d/rc.d/init.d | file which contains information about rpc programs need
    to be restarted |

    | /etc/fstab | file responsible for mounting file systems at boot |

    | /etc/printcap | file containing all information related to your printer |


    # Overview of NFS


    Using NFS to share files is similar to using NetWare volumes, Samba shares, and
    so on. NFS has become the standard method of sharing data in Linux as well as
    in the varieties of BSD UNIX, Solaris, Irix, etc. The concept of having a mutual
    set of disks has been a part of UNIX from its origin.


    # Overview of LPRng


    LPRng is an enhanced version of the printing system used by BSD UNIX for Open-Linux.
    As with BSD UNIX and OpenLinux, a set of similar binaries is at the heart of the
    printing system. These files perform queuing, filtering, prioritizing, printing,
    accounting, and so on. As with other UNIX operating systems, the translation of
    the document into PostScript is a vital part of the printing process. The steps
    that are involved in printing and the customizations that are allowed are all
    part of LPRng in OpenLinux.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Configuring NFS Filesharing


    The first part of configuring an NFS server is to determine the client-server
    relationship. This means you need to decide what the client wants and needs and
    how the server can deliver those files. In the case of NFS, you decide your clients
    are, what they want to share with others, and what they want to place in a central
    repository but not share with others. When configuring a server, you decide what
    access to your various files and directories you want to give the users. Although
    it''s a good idea to determine all this information before you begin the configuration
    process, you can continue making an NFS server without this data. After determining
    the client-server relationship, you need to create an export.


    # Creating an Export


    The first step in creating an export is to ensure that NFS services are compiled
    into your kernel. You can determine this on the basis of whether you have the
    file /dev/nfsd. In OpenLinux, the default kernel has NFS compiled, unless you
    rebuild your kernel, you don''t have to worry. If somebody recompiled your kernel
    or you don''t know how to add NFS into the kernel and recompile it, the troubleshooting
    section later in this chapter. After you have checked that you have NFS capabilities,
    you can begin the process of creating an export. You can do so by manually editing
    the configuration files or by using a GUI to edit the files.


    It is beneficial for users to understand what a tool is actually doing, so we
    will begin by guiding you through the process of creating an export manually.
    After you have gone through the manual configuration process and you understand
    more about the underlying concepts that are involved in creating an export, we
    will go over the process of creating an export with a GUI.


    # Manually Creating an Export


    To begin the process of creating an export, export only the /home directory. While
    it is possible to export any directory, seeing how this is done help you understand
    the process in its simplest form. The /home directory contains the files that
    are most important to users. Few users regularly backup and it is easy for you
    to do the backup process for them.


    A few other directories you may consider exporting as a System Administrator would
    be /usr and /var/ spool/mail. If you don''t understand why you would want to export
    /var/ spool/mail, remember that many people consider the loss of an e-mail message
    tragic. You may want to export the /usr directory so clients can share the software.
    This is very helpful in cases where licensing is an issue, and it gives all the
    users'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'the same set of programs to run. Exporting the /usr directory has some potential
    complications. For example, some of your users could have different hardware configurations,
    which will create problems when you export /usr/X11R6. There are several ways
    you can get around these problems, but the solutions may cause more work than
    they''re worth. To find out, try exporting the /usr directory to a few clients
    and see what you have to go through.


    To export the /home directory, we need to begin the process of preparing the system
    for it. By editing the /etc/exports file. Below are three separate examples that
    illustrate some of the different possibilities.


    +   * /home *foo.com(rw,insecure)

    * /home 192.168.1.1-192.168.1.50(ro,noaccess)

    * /home 162.168.5(rw,insecure)

    * /home 162.168.7.1(rw,secure) 192.168.7.192(rw,secure) 168.7.23(rw,secure)


    On the left is the directory we want to export. The code on the right indicates
    where it is exported to: a domain, a single host, or a range of IP addresses.
    The code in parentheses begins with either ro or rw, which means read only or
    read write, respectively. This code is followed by the options insure, noaccess,
    and secure. The terms secure and insecure relate only to the ports that can be
    assigned to NFS. The port numbers for insecure can be above 1024, and they must
    be below 1024 for secure. In a sense, the option noaccess chroots the users. Users
    cannot go above or below in the directory specified, so they are no free to roam
    the filesystem. There are several other options you can use, and you can find
    them in man 5 exports.


    After you set up the exports file, ensure that /bin/portmap is running. Do this
    by typing rconfig -p (hostname). If you want NFS to load on startup, make sure
    that portmap is loaded before it in your SYS V Initialization steps. After doing
    so, specify which domains can access portmap in your hosts.allow file. To prevent
    anyone outside your domain from accessing portmap, add the following lines to
    /etc/host.allow file:


    ```

    portmap: .foo.com : allow

    ```


    ```

    portmap: ALL : deny

    ```


    By adding these lines, users who aren''t in foo.com cannot use portmap. You could
    have used IP addresses as well. Put the lines in the correct order because the
    daemon goes from top to bottom; if your file looked like the following, you would
    have denied everyone yourself:


    ```

    portmap: ALL : deny

    ```


    ```

    portmap: .foo.com : allow

    ```'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Configuring NFS Filesharing


    Now restart portmap, because it is already running by default in OpenLinux:


    ```

    killall rpcmap

    ```


    You must kill every rpc program because they are all dependent on /usr/sbin/rpc.portmap.


    To check what rpc programs you need to restart, go to /etc/rc.d/ init.d and see
    what r programs were started. For each one, type:


    ```

    ./r(foo) start

    ```


    To make sure nfs works, go to /etc/rc.d/init.d/ and type:


    ```

    /nfs start

    ```


    Because it started without any problems, you can now make a symbolic link to /etc/rc.d/init.d/nfs
    so that nfs starts on boot by typing:


    ```

    In -s /etc/rc.d/init.d/nfs /etc/rc3.d/S(some number after "network" "init" and
    "netmount" and before "dhcpd")nfs

    ```


    For example:


    ```

    In -s /etc/rc.d/init.d/nfs /etc/rc3.d/S22nfs

    ```


    If something went amiss when you tried starting nfs, go to the troubleshooting
    section at the end of this chapter.


    # Manually Mounting an Export


    Now that you have created your export, you want your users to be able to mount
    it. Just as you had to edit a configuration file to create an export, you must
    edit another file to mount an export. The optimal file to edit in this case is
    /etc/fstab. In /etc/fstab there are six columns (although they don''t always look
    like columns). Only the first four columns are relevant to this chapter. File
    is readable to any user, but is only writable as root.


    The first column contains the device you are going to mount. There are several
    different types of devices that can appear in this column, including NFS servers.


    ```

    /dev/sda1

    ```


    ```

    /dev/hdb

    ```


    ```

    foo:/home/foo

    ```'
