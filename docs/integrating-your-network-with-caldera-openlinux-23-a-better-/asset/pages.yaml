    The following files, although not used by *bind*, are relevant to name resolution:


    | File | Purpose |

    | --- | --- |

    | /etc/hosts | The hosts file contains IP addresses for hostnames in a simple
    text file |

    | /etc/nsswitch.conf | The Name Service Switch configuration file tells OpenLinux
    whether to query the hosts file, DNS, or NIS to resolve hostnames |

    | /etc/resolv.conf | The Name Resolver configuration file tells OpenLinux how
