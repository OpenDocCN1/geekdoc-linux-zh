- img_proc: true
  md: 'Finally, regardless of which flavor make you used, Dependency Information needs
    to be generated from the selections you just chose. At the shell prompt, type
    make dep.


    make dep


    # Compiling the Kernel and Modules


    You can start the actual compiling now, with the make bzImage command. If you
    have an extremely fast system, it only takes a few minutes; otherwise, it takes
    up to 40 minutes, so be patient. The kernel recompilation did not compile any
    drivers you chose to build as modules; issue the command make modules to build
    those.


    make bzImage


    make modules


    # Installing the New Kernel


    Use the command make modules_install to put the modules you just built into place
    so you can find them after reboot. You can find the new kernel in the /usr/src/linux/arch/1386/boot
    directory as the file bzImage. Copy this file to the spot where you want to keep
    the new kernel, typically in the /boot directory.


    ```

    make modules_install

    ```


    ```

    cp /usr/src/linux/arch/1386/boot/bzImage /boot

    ```


    > If you rebuilt your kernel before, be careful not to overwrite your existing
    /boot/bzImage file! Don''t overwrite the existing kernel image until you fully
    test the new one. Give the new kernel image a different name, such as /boot/bzImage.new.


    ![](img/9102b40bb114da6b158a518630807d57_272_0.png)


    To test the new kernel, you must reboot. Before you do that, you must tell LILO
    that you built a new kernel.


    LILO''s options are configured in the /etc/lilo.conf file. Your existing lilo.conf
    file should look something like Listing A-1.'
  merge: -1
  pgno: 272
- img_proc: true
  md: "# Appendix A: Recompiling the Caldera OpenLinux 2.3 Kernel\n\n# Listing A-1\
    \ The default /etc/lilo.conf file.\n\n```\n#\n#etc/lilo.conf - generated by Lizard\n\
    #\n\n# target\n\nboot = /dev/hda3\ninstall = /boot/boot.b\n\n# options\n\nprompt\n\
    delay = 50\ntimeout = 50\nmessage = /boot/message\n\ndefault = linux\n\nother\
    \ = /dev/hda1\nlabel = win\n\nimage = /boot/vmlinuz-pc97-2.2.10-modular\nlabel\
    \ = linux\nroot = /dev/hda3\nvga = 274\nread-only\n  append = \"debug=2 noapic\
    \ nosmp\"\n```\n\nEverything after image = tells LILO about your kernel and how\
    \ to load it. Copy those lines so there are two sets of image = lines, followed\
    \ by their options. Change the first one so that it gives the pathname of the\
    \ new kernel you just generated, and change the second one so that the label becomes\
    \ linux.old. Listing A-2 shows what your result should look like."
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Listing A-2 A modified /etc/lilo.conf file.


