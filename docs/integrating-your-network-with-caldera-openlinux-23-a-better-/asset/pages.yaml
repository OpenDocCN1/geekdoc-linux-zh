  md: '# WU-FTPD Overview 147


    Guest


    The FTP account name is the user''s account name on that FTP server; the password
    is the same as the user''s account password. The same username and password are
    specified in /etc/passwd (and therefore they can use them to telnet into theLinux
    server). By default, all account holders on the OpenLinux server have FTP accounts,
    because both use /etc/passwd to determine


    Real


    Similar to the Guest FTP account, except that users have full rein to navigate
    the whole file system. Accounts of this type should be granted judiciously, because
    they can pose a security risk.


    # Typical FTP Sessions


    Now let''s take a closer look at the three different types of FTP accounts, and
    see just how they access the FTP server.


    # Real or Guest FTP Session


    The following is an example session using a real or guest account on the FTP server.


    ```

    [tho@mydomain.com]$ ftp yourdomain.com

    Connected to yourdomain.com

    220 yourdomain.com FTP server (Version wu-2.5.0(1)) Sat Apr 3 15:11:49 MST 1999)
    ready.

    Name (yourdomain.com:tho): tho

    331 Password required for tho.

    Password:

    230 User logged in.

    Remote system type is UNIX.

    Using binary mode to transfer files.

    ftp>

    ```


    In this session, the username tho could have been a real or guest FTP account.
    In either case, a valid password, as determined by the /etc/passwd file, was required
    to log in.


    # Anonymous FTP Session


    The following example is an FTP session using the anonymous user account.


    ```

    [tho@mydomain.com]$ ftp yourdomain.com

    Connected to yourdomain.com.

    220 yourdomain.com FTP server (Version wu-2.5.0(1)) Sat Apr 3 15:11:49 MST 1999)
    ready.

    ```'
