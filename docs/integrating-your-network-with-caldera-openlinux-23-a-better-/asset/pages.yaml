  md: '# File and Printer Services Provided by OpenLinux


    Chapters 3 and 4 describe how to use OpenLinux as a file and print server in a
    number of standard network environments.


    Integration with Windows NT and UNIX networks are described in separate chapters.
    In the real world, most networks are not single-vendor, you might find it necessary
    to configure your OpenLinux server to connect with more one type of network. Fortunately,
    OpenLinux allows you to do this; using one type of network does not preclude your
    using one or more types, and OpenLinux can handle all types simultaneously.


    Before OpenLinux can be used as a network server, some basic configuration is
    required. Chapter 2 describes how to do the tasks necessary for all network services,
    such as finding and loading drivers and managing IP addresses and IP routing.


    # Samba and the SMB File System


    The word Samba comes from SMB, the Server Message Block, which is the foundation
    for Windows NT networking. Samba is a free program developed by a team led by
    Andrew Tridgill, and can be used to emulate a Windows machine on a network. It
    can act as a peer in a Windows 9x network, or as a server or domain controller
    in a Windows NT network.


    Chapter 3, "Using Samba and SMBFS for Windows NT File and Printer Sharing," describes
    how to set up and use OpenLinux''s Samba server. It explains the server programs,
    smbd and nmbd, along with the associated clients smclient and smbmount. It covers
    some of the SMB support in the OpenLinux kernel.


    Microsoft''s Windows 2000, the next version of Windows, extends the SMB functionality
    with Active Directory, which places objects in a tree-like directory instead of
    a flat database, such as with the NT 4 domain model. Currently, Samba does not
    support Active Directory, although probably will change as development progresses.
    Samba provides file and printer sharing for Windows machines, and is a good place
    to start when integrating an OpenLinux server with Windows desktop machines on
    a LAN.


    # NFS and LPRng


    NFS (Network File System) and LPR (Line Printer protocol) have long been the mainstay
    of UNIX networks. OpenLinux supports NFS version 2, and an enhanced version of
    LPR known as LPRng (LPR next generation). OpenLinux''s NFS implementation was
    written from scratch by the Linux kernel developers, and LPRng was'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Chapter 1: Introduction to CalderaOpenLinux 2.3


    written by Patrick Powell of AStart Technologies. These combine to form the file
    and printer sharing components of OpenLinux.


    Sun Microsystems, the originator of NFS, created NFS version 3. It is important
    to know that the NFS implementations in OpenLinux (and other Linux distributions)
    have had problems connecting to Sun Microsystems'' Solaris servers in the past.


    ![](img/9102b40bb114da6b158a518630807d57_27_0.png)


    Although the NFS version 2 in OpenLinux is a subset of Sun Microsystems'' reference
    NFS implementation, LPrng is not a subset of standard LPR printing. LPrng extends
    LPR into a more robust, secure, and intuitive package, maintaining 100 percent
    backward compatibility.


    OpenLinux can act as both NFS and LPrng client and server, and both are discussed
    in Chapter 4, "Using NFS and LPrng for UNIX File and Printer Sharing." In Chapter
    4, we discuss how to connect your OpenLinux server to UNIX networks, and as well
    as how to connect to other machines that implement these protocols. In particular,
    LPR printing is included in many network-aware printers, such as the Hewlett-Packard
    N-series laser printers, the Hewlett-Packard JetDirect printing interfaces, and
    the Intel NetPort Express.


    > LPR printing is sometimes called LPR/LPD printing, because the standard name
    of the daemon that handles the printer spooler is the lpd (Line Printer Daemon).


    ![](img/9102b40bb114da6b158a518630807d57_27_1.png)


    # Internet Services Provided by OpenLinux


    The services described in the rest of the book typically are used in an Internet
    setting, although they can just as easily be used on a company intranet or for
    other projects. These chapters are written with a medium to large company in mind,
    or for a specialized company such as an Internet service provider or Internet
    presence provider. There are a great many different services that OpenLinux can
    provide for Internet-related networking, and the topics covered here are not exhaustive.
    We chose these topics carefully to represent the services most used on OpenLinux
    networks.


    # bind, a Domain Name System Server


    The Berkeley Internet Name Daemon (bind) handles DNS (Domain Name) services for
    OpenLinux. Maintenance of bind is done by the Internet Software'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Consortium, a non-profit company funded primarily through grants. Most of the
    Internet’s name servers are powered by bind, which is a very popular package.
    The acronym “bind” is typically used to represent named, the main program of the
    package; the complete package also includes an application programming interface
    for DNS resolution and associated tools.


    Both DNS server and client functions are performed by named; it can be told to
    provide name service resolution for your own domains as well as any other domains
    that it can access via the Internet or your local network. DNS is organized as
    a large distributed database. Each DNS server can host information for one or
    more domains. If a DNS server is asked about a domain it it doesn''t know about,
    it queries other DNS servers to find out about the domain. Whenever a DNS server
    finds something new, it caches the domain in memory so it doesn''t need to perform
    the query again.


    Even if you are not hosting any domains on your servers, bind running on your
    OpenLinux machine can be beneficial just by providing easy and quick access to
    other domains via its caching. I typically set DNS on every server I install on
    a small network, or one on every network segment on a larger network. This reduces
    network access times and bandwidth consumption; on a small network, it makes it
    easier to administer a single DNS server rather than maintain multiple files.


    The Domain Name System is more concerned with zones than domains. Because DNS
    is a distributed database, and not all DNS servers are expected to be available
    100 percent of the time, there are specific and detailed ways of controlling DNS
    replication. These concepts are explained in the DNS section of Chapter 5, “Configuring
    DNS and bind.” We also explain in Chapter 5 how to install and how to troubleshoot
    faulty DNS name resolution.


    # Apache, a Web Server


    Apache, the world’s most popular Web server, comes bundled with OpenLinux. Apache
    is an open-source Web server written by the Apache Group, a non-profit association,
    and has versions available for most operating systems, including UNIX variants
    and Windows NT. The name “Apache” was used to mean “A Patchy” Web server, a Web
    server written from various bits and pieces. It was originally based on the National
    Center for Supercomputing Applications’ Web server, but has far.outgrown roots.


    Because of its large installed base, Apache has plenty of support for integration
    with other programs, such as scripting languages and database and application
    servers. Apache allows custom modules to be either compiled directly into the
    server itself, or executed as stand-alone applications. Many modules for Apache
    are available free on the Internet. Two of the most popular are perl, which allows
    for perl'
