- img_proc: true
  md: '# Configuring squid


    the user''s Web browser is configured correctly, there are three things you can
    check on the server to find the problem. First, you can check from the OpenLinux
    server to see if the site is up, and if the server can access it (if the proxy
    server cannot directly access it, none of the proxy clients can reach it). If
    you access the Web site from the server but not from the client, then the problem
    is most likely one of access rights. If it''s not an access issue, you need to
    see what the squid logs say about the access request.


    # Checking Server Connectivity


    Use a browser to see if the site in question is up, and can be reached at all.
    Do this directly, without a proxy configured, so that you can test for physical
    connectivity. If you can''t reach the site, either your server is misconfigured
    or the site is down. You might want to check connectivity from another machine
    for comparison. If you can reach the site from the server, but not from a client
    machine, then it is not a connectivity issue. Check access rights next.


    # Checking Access Rights


    The access control lists can block a site from being viewed on the basis of domain
    name, IP address, and port, and from both the remote server and proxy clients.
    If access to a site is prevented due to an ACL constraint, you see something like
    this in the server''s log:


    ```

    937256019.522  6 192.168.0.2 TCP_DENIED/403 984 GET http://www.yahoo.com /

    NONE/- -

    ```


    The message TCP DENIED means that an access control list that denied the request
    is in place. This log is in the native squid format. If you are logging in Web
    server format, you do not see a TCP_DENIED message; you need to check the /etc/squid/squid.conf
    file''s access lists to verify the rules by hand. If you must check the access
    control lists by hand anyway to verify which rule is causing the denial; if you
    alter or remove the rule and restart squid, the access should work.


    # Checking the squid Logs


    When all else fails, check the squid logs. First see if the request happened at
    all. You can check based on IP address or hostname of the client, or based on
    URL request. If you are using Web server logging, you can check the timestamp
    too. If the request is not logged, the client might be misconfigured. (If the
    request did happen, and all else checks out, you are on your own.)'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Managing the squid Logfiles


    squid creates lots of log information. If you do not need or care for the data
    in the logs simply set the logging statements in squid.conf to /dev/null, and
    you will not have to contend with managing the logfiles. If you want the logfiles,
    then you will want to manage these logfiles or they will grow to the point where
    they fill all the space they can grab.


    squid includes the ability to rotate its logfiles. If you want to rotate your
    squid logfiles on a regular basis. To do this daily, you could add the following
    entry to your root crontab file (crontab -e root):


    ```

    0 * * * /usr/sbin/squid -k rotate

    ```


    At any time, this will keep up 10 old logs present (with the suffixes .0 through
    .9). If this is too much, you may want to add a cronjob that runs shortly after
    the log rotate, which will keep only 5 old log versions (.0 through .4):


    ```

    1 0 * * /bin/rm -f /var/log/squid/*.[56789]

    ```


    The removes all files in /var/log/squid that end in .5, .6, .7, .8, and .9. The
    amount of logs you keep will depend on the disk space you have for logs, and the
    traffic put through your proxy server. Only keep the amount of logs required for
    troubleshooting and any statistics you want to run on them.


    # Starting squid with a Clean Cache


    Should you want to start squid with a clean cache, the simplest way to do this
    is to invalidate swap.state files for all swap areas configured. To do this, you
    would do the following:


    First, stop the server:


    ```

    /etc/rc.d/init.d/squid stop

    ```


    then for each cache_dir configured in the squid.conf file:


    ```

    echo "" > cache/swap.state

    ```


    finally, restart the server:


    ```

    /etc/rc.d/init.d/squid start

    ```'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Purging and Object from the Cache


    In order to purge objects from the cache, you have to configure an acl to allow
    the purge operation. The following squid.conf lines allow you to purge cache objects
    from the squid server itself:


    ```

    acl PURGE method purge

    acl localhost src 127.0.0.1

    http_access allow purge localhost

    http_access deny purge

    ```


    With these lines, you could then purge http://www.purgeme.com/ from the cache
    by doing:


    ```

    client -m PURGE http://www.purgeme.com/

    ```


    If the operation is successfully, you will get a 200 OK response. If the object
    was not in the cache, you will get a 404 Not Found response.


    # The Cache Manager


    The Cache Manager is a cgi utility that allows you display current statistics
    about squid. The Cache Manager allows you to view these statistics without having
    to log into the squid server. By default when you install the package, it places
    cachemgr.cgi in the /home/httpd/cgi-bin directory.


    Because you would not want the world to have access to this utility, you need
    to control access to this URL via the web server. You will want to limit where
    requests can come from, or install a username and password. See the chapter on
    the Apache Web Server for more information about protecting a URL.


    Here is an example:


    ```

    <Location /home/httpd/cgi-bin/cachemgr.cgi>

    order deny,allow

    deny from all

    allow from host.mydomain.com

    </Location>

    ```


    To view these stats use the following URL:


    ```

    http://yoursquidserver.yourdomain.com/cgi-bin/cachemgr.cgi

    ```'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Chapter 12: Configuring the squid Proxy Server


    squid has many statistics available via the Cache Manager. The most useful are:


    +   - Memory Utilization

    - General Runtime Information

    - 5 Minute Average of Counters

    - 60 Minute Average of Counters

    - Cache Utilization



    - To do this, you use the no_cache option in your squid.conf file. As an example,
    let''s access a company''s inventory, which is dynamic and always updating. The
    URL is http://www.notarealcompany.com/inventory.html. To make it non-cacheable,
    add the following to squid.conf:


    # Making Specific URLs Non-Cacheable


    There may come a time when you want to set up squid to not cache certain URLs.
    Usually you would want to do this for pages that update frequently; either because
    they don''t pass good cache expiration indicators in their headers, or because
    they update so frequently, we waste space caching them.


    ```

    acl dontache url_regex ^http://www.notarealcompany.com/inventory.html$

    no_cache deny dontache

    ```


    You may be working with a Web developer who is frequently changing pages and,
    because it is a testing site, is not very concerned with putting in header info
    for caching, etc. The developer is using http://www.notarealwebdeveloper.com/prototype-type
    and links to many URLs within that space. To keep that from being cached you would
    add the following to squid.conf:


    ```

    acl dontache url_regex ^http://www.notarealwebdeveloper.com/prototype.*

    no_cache deny dontache

    ```


    You can even choose when to cache and not to cache based on time. For example:


    ```

    acl dontache time 09:00-05:00

    no_cache deny dontache

    ```


    You can also choose not to cache based on IP addresses. For instance an ISP could
    choose not to cache its own local servers (as an example we''ll say the ISP has
    1 class C 10.1.2.0) by using:


    ```

    acl localservers dst 10.1.2.0/24

    no_cache deny localservers

    ```'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Transparent Proxying


    More and more locations these days are using transparent proxying. Transparent
    proxying does not require any special configuration of the browsers, and works
    by having outbound port 80 redirected to a caching server. Transparent proxying
    can be done with routers, layer 4 switches, gateways (i.e. a OpenLinux box), etc.


    In order for you to use this method, you must be using an OpenLinux box as your
    gateway or firewall (see the chapter "Building a firewall with itchains" for more
    information on building a firewall with OpenLinux). It also requires squid to
    be installed on the same box.


    For this example I first set up my OpenLinux box as a gateway, where its eth0
    interface connects it to the world, and its eth1 interface is for an inside LAN
    using private IP space (192.168.1.0/24). It uses IP masquerading to allow the
    private IP space to access the world. Here is the script that sets this up:


    ```

    ipchains -P forward DENY

    ipchains -A forward -i eth0 -j MASQ

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    The address on the eth1 interface is 192.168.1.1. I set up an internal machine
    on 192.168.1.100 and set that internal machine''s default gateway to 192.168.1.1.
    At this point, I can surf the world, ping it, etc. Now that that is working, let''s
    look at setting up for transparent proxying.


    For transparent proxying to work, there are a few additional settings we need
    to add to the /etc/squid.conf file.


    ```

    httpd_accel_host virtual

    httpd_accel_port 80

    httpd_accel_with_proxy on

    httpd_accel_uses_host_header on

    ```


    Once these changes have been made, stop and restart squid:


    ```

    /etc/rc.d/init.d/squid stop

    /etc/rc.d/init.d/squid start

    ```


    All that is left is to tell the kernel to redirect all outbound port 80 requests
    to the squid port (3128 by default). This is done with the following ipchains
    command:


    ```

    ipchains -A input -p tcp -s 192.168.1.0/24 -d 0 80 -j REDIRECT 3128

    ```'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'Now all Web requests from any browser on the 192.168.1.0/24 network are getting
    transparently proxied. Many ISPs use transparent proxying to reduce the amount
    of bandwidth used on their expensive upstream links to the net. For more information
    on transparent proxying with your squid server and other vendor equipment, see
    the Squid FAQ.online.


    # Log Analyzers for Use with squid


    Because you can route all Web and FTP traffic through a company or a workgroup
    through squid, the access logs that squid provides detail all Web and FTP traffic
    from users to the Internet. squid keeps a log file of each access, where it went,
    whether the requested page was found or not, and more. You can view this data
    in its raw format, but it is easier to interpret using a log analyzer. Two good
    log analyzers are calamaris and analog.


    squid can produce either in its native log format or in a similar format to that
    of a Web server log. The calamaris analyzer takes squid''s native log format and
    produces HTML graphs for viewing by a Web browser; squid''s native log format
    gives more data, but the raw files do not produce human-readable time stamps for
    each file download. There is no way of determining what time or on what day a
    particular URL was accessed. This is a serious drawback for companies that use
    a proxy server to monitor Web usage.


    Because squid can mimic a Web server''s log, you can use analog, a Web server
    log analyzer, to give reports from the proxy server''s access log. The reports
    aren''t quite as detailed, but they provide human-readable time stamps. If you
    use analog to provide reports for the Apache Web server, you may already have
    it loaded on your Open-Linux machine, and you won''t need to load another program
    on your server.


    # For More Information


    squid does not have much information on the Internet. These resources are good,
    however, for learning more about squid and other proxy servers.


    | URL | Resource Name |

    |---|---|

    | http://squid.nlarr.net | squid Web Site |

    | http://linuxkb.cheek.com/page.php?proxy | Linux Knowledge Base Proxy Server
    Information |

    | http://calamaris.cord.de | calamaris Proxy Server Analyzer |

    | http://www.statlab.cam.ac.uk/~sret1/analog/ | analog Web Analyzer |'
  merge: -1
