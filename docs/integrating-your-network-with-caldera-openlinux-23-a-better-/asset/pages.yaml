- img_proc: true
  md: '# Chapter 13: Configuring telnet, ssh, and DHCP Services


    telnet, ssh (Secure Shell), and DHCP (Dynamic Host Configuration Protocol) are
    all lumped together in this chapter because they are good programs to know how
    to use, but not complicated enough to warrant chapters of their own. telnet is
    of interest here because of its role in remote server management. ssh was built
    to overcome some of the limitations of telnet and other applications used for
    remote login by providing both remote terminal access and file copy, and including
    security to boot. DHCP is a method of assigning IP addresses and associated network
    configuration parameters dynamically, rather than requiring each machine on a
    network to have a specific, static configuration.


    # Files Referenced in this Chapter


    telnet, ssh, and DHCP use the following files:


    | File | Purpose |

    | --- | --- |

    | /etc/inetd.conf | inetd''s configuration file lists which services the inetd
    super-server handles |

    | /etc/hosts.allow | A list of services and hosts for which connections should
    be allowed |

    | /etc/hosts.deny | A list of services and hosts for which connections should
    be denied |

    | /etc/secretty | A list of which devices root can be logged in |

    | /etc/rc.d/rc.local | Contains commands to be executed after system boot is done
    |

    | /var/run/sshd2.pid | The PID (process id) file for sshd, the ssh daemon |


    # telnet, ssh, and DHCP Overview


    telnet is probably the most widely used manner of remote server management; the
    capability to inspect and change network and other settings via any text terminal
    that supports telnet is a great asset of OpenLinux. telnet doesn''t have much
    in the way of security, nor is it very robust as a file transfer system. OpenLinux
    comes with both the telnet client and server installed and enabled by default.


    ssh allows terminal sessions, remote execution of commands, and network file copy.
    All transactions over the network are encrypted, they cannot be viewed by packet
    sniffers. Authentication is performed through the comparison of public and private
    keys, rather than through identification of machine, username, and passwords.
    ssh includes cryptography illegal to export outside the United States, it could
    not be included in the OpenLinux CD-ROM. You can obtain it from an FTP site in
    Finland (the FTP URL is at the end of this chapter, in the section "For More Information”).
    Obtaining the latest ssh package can give you both a client and a server.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Configuring telnet


    DHCP''s main role is assigning IP addresses automatically. Telling a machine to
    use DHCP gives it a dynamic IP address, whereas normal addressing gives it a static
    IP address. You can configure OpenLinux at installation to receive a dynamic IP
    address via DHCP, but telling it at as a DHCP server, whereby it gives other machines
    DHCP IP addresses and keeps track of those addresses, requires specific configuration.


    # Configuring telnet


    telnet is the easiest to configure; by default, it''s always on. It''s not a service
    run from an rc script; rather, it runs from inetd. inetd is called a super-server,
    because all it does is listen for connections on specific ports, and when it finds
    them, it spawns the actual process that handles the service. It''s an alternative
    to having many, many processes waiting for a connection, taking up server memory.
    Services as telnet, which don''t require fast response to an initial connection,
    use inetd. To see what inetnet does for, browse the /etc/inetd.conf file, and
    look for the line that lists telnet on it. It should look like the following:


    ```

    telnet stream tcp nowait root /usr/sbin/tcpd in.telnet

    ```


    This line tells inetd to run the daemon.inetd whenever a connection on the telnet
    port is requested. If you want to disable the service, you need to edit this line,
    placing a hash mark to comment out the line. After any change to this file, you
