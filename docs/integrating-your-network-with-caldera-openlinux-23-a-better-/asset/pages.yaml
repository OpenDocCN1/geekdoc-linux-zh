    ```

    dd if=install.144 of=/dev/fd0

    ```


    ```

    dd if=modules.144 of=/dev/fd0

    ```


    To install with lisa, insert the install floppy in the floppy drive, make sure
    the OpenLinux CD is in the CD-ROM drive, and reboot. The installation starts automatically.


    Lisa does not automatically probe for network cards; it needs to be told to do
    so. You find your hard drives and CD-ROM devices, and then asks if "No" to tell
    it to probe for your network card also; it searches for some of the more common
    network cards. If it finds one, it loads drivers for that card; if it does not,
    tell it to probe again, using the modules disk (which contains more drivers).
    If your card is not found with this modules disk, you must load it by hand after
    the installation of OpenLinux is done.


    You are prompted for IP address information toward the end of the installation,
    you are not given the choice of a dynamic IP address (using DHCP) at this point.
    You can choose to give false information, if you want to use DHCP, or leave it
    uncon. You need to configure this after installation, using the tools described
    in the next section.


    # # Loading Network Drivers by Hand after Installation


    If you could not get your network card drivers loaded during the installation,
    you can use COAS (Caldera Open Administration System) to load them and configure
    them now. Because COAS has both a text-based and a graphical front, it works with
    either a terminal window or the X Window system. To start from the KDE menu, click
    on the Application Starter; then choose COAS, Network, Ethernet Interfaces (COAS
    does not configure ring interfaces). This menu is shown in Figure 2-1.


    You can also run COAS by hand, by entering the command coolast at the command
    prompt. This brings up the menu, shown in Figure 2-2 (text mode) and Figure 2-3
    (X Window mode).


    Note that the menu contains the same information, just displayed differently.
    Choose Network Administration, Common Network Functions, see the Ethernet Interface
    Configuration window, shown in Figure 2-4.'
