  md: '# Chapter 8: Configuring FTP Servers with WU-FTPD


    To provide interactive file transfers between computers, two pieces of software
    are required. The computer acting as the server needs a daemon, whereas the recipient
    needs only client software. FTP (File Transfer Protocol) is probably the most
    popular and effective way to move files (especially large files) from one computer
    to another computer over the Internet. It''s better to FTP a 200MB file than to
    e-mail it as an attachment. Believe me, your mail administrator will hit the roof
    if you try e-mailing a 200MB file attachment!


    It is common to have both the FTP client and the FTP daemon, on a single OpenLinux
    machine; this means that the OpenLinux computer acts as the FTP client and server
    at the same time. The daemon is always lurking in the background until called
    by an FTP client.


    # ## Files Referenced in this Chapter


    The following files are used by OpenLinux''s implementation of FTP:


    | File | Purpose |

    | --- | --- |

    | /etc/inetd.conf | Defines how FTP connection requests are processed |

    | /etc/ftpusers | Defines regular users on your OpenLinux system who cannot use
    FTP (this is intended as a security precaution) |

    | /etc/ftpasscess | Configuration file for WU-FTPD |

    | /etc/ftpconversions | A conversion database |

    | /etc/ftphosts | Determines access to specified accounts from other hosts |

    | /usr/bin/ftp | The standard FTP client |

    | /usr/bin/ncftp | A more feature-rich FTP client |

    | /usr/bin/binftcount | Current number of users for each class |

    | /usr/bin/ftpwho | The process information for each FTP user |

    | /usr/sbin/ftpshut | Shuts down the FTP server at a specified time |

    | /usr/sbin/in.ftpd | Name of the FTP daemon |

    | /var/log/xferlog | Logs all all transfers between FTP clients and the FTP server,
    for both regular and anonymous users |'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'The following files, although not used by WU-FTPD, are relevant to the FTP
    server:


    | File | Purpose |

    | --- | --- |

    | /etc/services | Plain ASCII file listing the mapping of Internet services to
    their port numbers |

    | /etc/aliases | Plain ASCII file used for virtual hosting |

    | /etc/passwd | Plain ASCII file used to authenticate the user |

    | /etc/shells | Plain ASCII file used to verify a valid shell |

    | /etc/hosts.allow | Plain ASCII file used to allow specified hosts |

    | /etc/hosts.deny | Plain ASCII file used to deny specified hosts |


    # WU-FTPD Overview


    WU-FTPD, developed at Washington University, is a replacement for the FTPD that
    came with older versions of UNIX. WU-FTPD has a number of additional features.
    Practically all Linux distributions use WU-FTPD, but there are other, similar,
    packages to choose from. Your OpenLinux installation will perform a standard installation
    of the WU-FTPD daemon, the FTP client, and all the necessary configuration files.


    > In Greek mythology, a daemon is an attending or guardian spirit between gods
    and men. In UNIX/Linux, a daemon refers to an unattended program that runs continuously
    in the background until it is called upon.


    ![](img/9102b40bb114da6b158a518630807d57_164_0.png)


    Some additional features of WU-FTPD are:


    +   - Logging of all transfers and commands executed

    - On-the-fly compression and archiving

    - Per-class limits

    - Per-directory upload permissions

    - Restricted guest accounts

    - System-wide and directory messages

    - Directory alias and virtual host support

    - Cdpath and filename filters


    Check out the WU-FTPD Web site at www.wu-ftpd.org for the latest updates.


    ![](img/9102b40bb114da6b158a518630807d57_164_1.png)'
  merge: -1
  pgno: 164
