- img_proc: true
  md: '# Chapter 5: Configuring DNS and bind


    Five zones (the root zone and four below it) were defined in Listing 5-1. A zone
    is a domain or subdomain that has (or can have) hosts within it. The subtle difference
    between a zone and a domain is that a zone encompasses only those hosts directly
    underneath it; for instance, the www.cheek.com is part of the cheek.com domain,
    the .com domain, and the root domain, but only part of the cheek.com zone.


    ![](img/9102b40bb114da6b158a518630807d57_95_0.png)


    As you can see, each section of the file has data contained inside curly braces.
    The directory line inside the options section tells bind that we want all files
    to go inside /var/named directory. The remaining five zones tell bind that we
    want our DNS server to contain information about five zones innately: the root
    zone (), the 0.0.127.in-addr.arpa (which is the reverse zone for 127.0.0.1, the
    loopback interface), the domain.com zone, the 1.168.192.in-addr.arpa (the reverse
    zone for 192.168.1.x), and the domain2com zone.


    The root zone and the 0.0.127.in-addr.arpa zone are required. After that, there
    can be few or as many zones as you want. Define any other zones if you just want
    to configure a DNS server that holds no information for domains on its own; this
    can be useful if you just bind to cache information it receives from other DNS
    servers.


    The type line tells bind how to handle the file it finds in each section. A hint
    type identifies a file that contains a list of root servers. A master type means
    that bind is to be authoritative for that zone as a master DNS server. (Master
    servers are primary DNS servers, which hold their information on their own hard
    drives).


    The slave type tells bind to be authoritative as a slave DNS server. (Slave servers
    are secondary to master servers, meaning that the slave just copies locally whatever
    information its associated master server holds). The masters line tells which
    server is the primary, master server for those slave zones.


    When a DNS server is authoritative for a zone, it means that it knows intimately
    about that zone, and can be counted on always to have correct information for
    that zone. When a DNS query comes into a DNS server, the server can respond directly
    with information if the request was made for a zone which it is authoritative.
    In this case, the DNS server queried does not need to contact the root server
    and walk the tree-like DNS structure to get its information—it can respond on
    its own. On the Internet, the InterNIC requires that at least two DNS servers
    have authoritative information for each domain registered through its service.
    In practice, this is a good minimum.'
