    These show that I am reading my e-mail via the IMAP protocol as I type this chapter.
    The log file will tell you whether e-mail is being received or rejected. If you
    do not see any entries, you might wonder if sendmail is running at all; you can
    check this with the ps command.


    ```

    ps | grep sendmail

    ```


    You should see:


    ```

    477 ? S 0:11 sendmail: accepting connections on port 25

    ```


    Here you can see that sendmail is running, and waiting for a connection. If it
    is not running, start it with the /etc/rc.d/init.d/mta start command.


    # Using the finger Command


    The finger will tell you if a user has mail, when it was last read, and if mail
    is forwarded (via a .forward file) to a different e-mail account. These are good
    ways to check the status of a user''s mailbox. Here is what mine shows:


    finger joseph


    ```

    Login: joseph              Name: Joseph Cheek

    Directory: /home/joseph      Shell: /bin/bash

    On once Tue Sep 7 13:17 (PDT) from typ0 from seattle.cheek.com

    Mail last read Tue Sep 7 13:40 1999 (PDT)

    No Plan.

    ```


    If I had new mail, it would show:


    New mail received Tue Sep 7 12:45 1999 (PDT)'
