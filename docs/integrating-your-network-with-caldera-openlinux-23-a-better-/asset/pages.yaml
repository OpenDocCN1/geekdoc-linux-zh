    nThe last ndc command we mention here is ndc. Issuing this command tells bind
    to list all records for zones in which it is authoritative; it outputs the file
    /var/named/named_dump.db, which appears similar to a concatenation of all zone
    files listed in your /etc/named.conf file. This is a good way to check whether
    bind is serving the data you think it be serving.


    # Checking the System Log


    When bind starts (or restarts), it writes debugging information to the system
    log /var/log/messages. Checking this file after an ndc start or ndc restart command
    can yield valuable debugging information. Check the last few entries in the system
    log by issuing the command tail/var/log/messages. Its output is shown in Listing
    5-8.


    ndc start


    Name Server Started


    tail /var/log/messages'
