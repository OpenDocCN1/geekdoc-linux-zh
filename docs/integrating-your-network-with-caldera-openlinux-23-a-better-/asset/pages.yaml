- img_proc: true
  md: '# How DNS Works


    DNS is organized in a hierarchy, just as hostnames are. Consider the fictional
    hostname-www.linuxkb.check.com. When a DNS lookup is requested for this hostname,
    a query is sent to find .com, then cheek.com, then linuxkb.check.com, and then
    www.linuxkb.check.com. The DNS server with information about .com might not be
    the same server that knows cheek.com, and so on. In this respect, DNS is arranged
    like a tree, with a root, branches, and leaves (see Figure 5-1).


    The root is where DNS lookups start. DNS servers that contain information about
    the root are called root servers. On the Internet, the root servers are a.root-servers.net,
    b.root-servers.net, c.root-servers.net, and so on, up to m.root-servers.net. These
    servers maintain information about top level domains, such as .com and .net. The
    servers that handle .com then know where to find cheek.com; the servers that handle
    cheek.com know where to find linuxkb.check.com, and so on. A DNS lookup walks
    this tree from the root through the branches until it finds the server that knows
    about the hostname for it is looking. When it finds that server, it queries the
    server for the needed information.


    ![](img/9102b40bb114da6b158a518630807d57_91_0.png)


    Figure 5-1 DNS is logically organized like a tree, with a root, branches, and
    leaves. The root domain corresponds to the root of a tree, top level domains are
    branches from the root, and domain names are branches from them. Hosts are analogous
    to leaves on the tree.'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'An important concept with DNS is the root domain. All domain names have an
    implied period at the end of their names, which stands for the root domain. For
    example, check.com really is check.com. , although only computers actually use
    the trailing period. This period is significant in DNS, though, because it means
    that a particular domain starts from the root domain, and not some other domain.
    This becomes important as you configure your DNS server.


    ![](img/9102b40bb114da6b158a518630807d57_92_0.png)


    You are probably familiar with some of the more common top level domains, such
    as .com, .net, and .org. Many more exist; special domain is the in-addr.arra domain.
    (Inverse AddressARPNet) domain is a domain that handles all reverse DNS lookups.
    To perform a reverse DNS lookup, a computer performs a normal query in the in-addr.arra
    domain. The IP addresses to look up become the hostname of the in-addr.arra domain,
    although their order is reversed. The address 208.12.134 is queried as 134.12.208.in-addr.arpa
    ; more technically, the host 134 is queried from the subdomain 134.12.208.in-addr.arpa.
    A DNS server queried this way returns the corresponding hostname (such as the
    check.com).


    DNS also specifies which machines in a domain handles its e-mail. A domain can
    have dozens, hundreds, or even thousands of hosts in it, but typically mail sent
    to those domains is collected on a small number of machines, perhaps on only one.
    A DNS entry is used to specify which hosts collect mail for domains and subdomains.


    # Configuring DNS


    Even if your organization does not have a valid, registered Internet domain name,
    bind will function, but it works better if you do one. This section walks through
    setting up a DNS server for the fictional domain.com domain, with hosts ns.domain.com
    at IP address 192.168.1.1, mail.domain.com at IP address 192.168.1.2, and www.domain.com
    at IP address 192.168.1.3 (see Figure 5-2). The ns.domain.com server is a primary
    DNS server for the domain.com domain, and a secondary backup DNS server for the
    domain2.com domain. domain2.com’s primary DNS server is ns.domain2.com at IP 192.168.2.1.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '![](img/9102b40bb114da6b158a518630807d57_93_0.png)


    figure 5-2 This is the fictional domain.com network used in this chapter.


    > It''s a good idea to substitute your own domain name, hostnames, and IP addresses
    for the ones used in the examples.


    # # Creating the bind Configuration Files


    If bind is to run, it needs to know the following information (which is stored
    in the file /etc/named.conf).


    +   * What directory to use for its files (OpenLinux uses /var/named)

    * Where to find the root server listing file (OpenLinux uses /var/named/root.hints)

    * Where to find the zone authority files (OpenLinux uses /var/named/pz and /var/named/sz)


    # # Basic Configuration


    Create the file /etc/named.conf exactly as shown in Listing 5-1, substituting
    your domain for domain.com and your in-addr.arpa subdomain for 1.168.192.in-addr.arpa.
    This file is also included on the CD-ROM under /files/bookfiles/chapter5/named.conf.'
