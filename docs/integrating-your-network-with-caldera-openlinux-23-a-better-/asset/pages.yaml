    \ file so it can be read only by root.\n   chmod 600 /etc/rabbd/*\n\n+   7. Append\
    \ the following four lines to /etc/services.\n   radius          1645/udp    \
    \    radiusd\n   radacct         1646/udp\n   radius-proxy    1650/udp\n   radacct-proxy\
    \   1651/udp\n\n# Administering radiusd\n\nIn this section, you'll learn how to\
    \ administer radiusd. Basic day-to-day operation starting and stopping, troubleshooting,\
    \ and other matters will be covered."
