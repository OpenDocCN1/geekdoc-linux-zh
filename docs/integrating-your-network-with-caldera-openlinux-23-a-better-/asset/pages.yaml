    Apache is very functional; besides extensible modules, the base package can support
    as many virtual hosts as your system can handle. These virtual Web sites all run
    from the same IP address, many Web sites on many different IP addresses, or both.
    Apache''s functionality is almost entirely controlled through its configuration
