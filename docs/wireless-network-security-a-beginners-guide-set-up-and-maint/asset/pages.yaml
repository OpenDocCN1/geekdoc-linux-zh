    You can use digital certificates to have the workstation authenticate to the wireless
    network before the user logs in. Thus, even if the user has never logged into
    this particular system, the system has access to authenticate to Active Directory.
    This can be extremely handy for wireless devices that get passed around a lot.


    In addition, using certificates can provide mutual authentication. Mutual authentication
    means that both parties are authenticating each other. In this case, the client
    is authenticating the wireless network and the wireless network is authenticating
    the client. This ensures that both parties are communicating with the intended
    party.


    For these reasons, WPA2-Enterprise with digital certificates is considered the
    best solution for environments demanding the most security from their wireless
    networks. For the most challenging of environments, you might consider using WPA2-Enterprise
    with smart cards, but this is beyond the scope of this book.


