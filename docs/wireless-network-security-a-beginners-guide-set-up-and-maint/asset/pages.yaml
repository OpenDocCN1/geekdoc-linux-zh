  md: 'Chapter 4 Attacking Wireless Networks 89


    **Step 5.** If traffic is needed, perform a packet replay attack using airplay-ng.


    So the next question is, do we wait to passively capture enough packets or do
    we speed up? Remember, if we''re trying to be completely stealthy we will just
    wait until we''ve captured enough packets. If we''re not worried about an IDS
    or being noticed, we can perform the ARP replay attack explained in the previous
    chapter.


    To perform the ARP replay attack, we use the airplay-ng program. The airplay program
    has many options, switches, and even attack methods. We explore a few of the uses
    in this book, but I highly recommend taking a look at the man page and online
    documentation. To execute the ARP replay attack, we use the following command:


    ```

    #airplay-ng --arpreplay -b 22:22:22:22:22:22 mon0

    ```


    +   - **arpreplay** is relatively obvious; it''s the attack method we''ve chosen.

    - **b** is the target BSSID of our attack.

    - The final argument is the interface we use to inject the packets.


    This method may take a little time, so be patient. We have to wait to actually
    observe an ARP packet. If the client station has been connected for some time,
    we might not see an ARP packet for a few minutes. The output in Listing 4-8 shows
    a successful ARP replay attack.


    The final line shows that we received two ARP packets and have successfully sent
    over 3,700 packets at 500 pps (packets per second). The line above this, which
    indicates a death/disassociation packet was received, which is normal. You should
    take a look at the adiroump output and notice a large spike in the packets for
    the associated client. If you don''t see the packets increasing rapidly, you can
    simply cancel the ARP replay attack with CTRL-C and try again with the exact same
    syntax. I find myself to restart the ARP replay attack about half of the time.


    # Listing 4-8: Successful ARP Replay Attack Using airplay-ng


    ```

    rootsattacker:~airplay-ng --arpreplay -b 22:22:22:22:22:22 m0

    No source MAC (-h) specified. Using device MAC (00:22:FA:5F:04:C8)

    12:55:54 Waiting for beacon frame (BSSID: 22:22:22:22:22:22) on channel 11

    Sending ARP requests in replay_arp-0612-12561.cap

    You should also startiroump-ng to capture replies.

    Notice: got a death/disassoc packet. Is the source MAC associated?

    Notice: got a death/disassoc packet. Is the source MAC associated?

    Read 33221 packets (got 2 ARP requests and 1604 ACKs), sent 3727 packets... (500
    pps)

    ```'
