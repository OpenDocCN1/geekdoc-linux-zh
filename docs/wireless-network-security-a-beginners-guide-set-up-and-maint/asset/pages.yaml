  md: "# Wireless Network Security: A Beginner's Guide\n\nAlso, keep in mind that\
    \ if you wait for someone to connect to the access point naturally, your attack\
    \ is completely passive and extremely discrete. If you start deauthenticating\
    \ clients, your attack, although still very stealthy, is not 100 percent passive.\n\
    \n> IMHO\n the real world, if I were a criminal, I would choose completely passive\
    \ attacks over even slightly active attacks. However, during penetration testing,\
    \ slightly active attacks almost always go unnoticed by the target organization.\
    \ If an organization gets alerted on a few detected spoofed authentication packets\
    \ and can react in a timely manner, they probably have chosen an extremely secure\
    \ WPA key anyway.\n\n# Wi-Fi Protected Setup (WPS) Brute Forcing\n\nWi-Fi Protected\
    \ Setup (WPS) is a certification program wireless vendors can choose to implement\
    \ that makes it easier for technical users to implement security on wireless networks.\
    \ The PIN-External Registrar method requires users to enter an eight-digit number\
    \ into their computer that authenticates them to the access point, at which point\
    \ the access point will send the device WPS pre-shared key. This PIN is usually\
    \ physically on the access point or in the documentation that comes with the access\
    \ point.\n\nAt the end of December 2011, a security researcher named Stefan Viehböck\
    \ released a paper describing a new attack on the Wi-Fi Protected Setup. The flaw\
    \ was discovered in the PIN-External Registrar method used to authenticate client\
    \ devices.\nViehböck discovered that when clients authenticate with the PIN, the\
    \ PIN is actually split into two four-digit pins, and to make matters worse, the\
    \ eighth digit is actually used as a checksum for the PIN. This means that the\
    \ eighth digit is actually just a reflection of the previous seven and can be\
    \ calculated based on the previous seven digits.\n\nSo exactly is that a problem?\
    \ Well, this means that the original number of 100,000 possible PINs, there are\
    \ actually only about 11,000. This drastically reduces the time to brute force\
    \ the PIN. Attack tools have already been released to exploit this, and on average\
    \ take as little as a few hours to successfully force the PIN.\n\nThe good news\
    \ is WPS mode is typically only found on residential access points. However, you\
    \ should still be aware of the implications for any access points you might find\
    \ in your environment. If possible, you should disable WPS on any of your access\
    \ points. In addition, access points have a lockout period, which can help to\
    \ delay and sometimes mitigate the risk from a brute-force attack."
