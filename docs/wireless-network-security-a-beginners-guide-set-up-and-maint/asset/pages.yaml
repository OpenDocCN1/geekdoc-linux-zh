  md: '# Chapter 6 Theory of Defense for Securing Wireless Networks 147


    network. SSID cloaking is another technology that conceptually makes sense but
    turns out to be nothing more than a headache for administrators and legitimate
    users and provides no real benefit.


    However, in Chapter 4, you learned that tools are available to get this information
