  md: '# The Linux Operating System


    During your career, you will invariably come across multiple operating systems
    regardless of your job role. Only a handful of operating systems dominate the
    IT world, and Linux is definitely part of that group. If you never had the opportunity
    to work with Linux, now is the perfect time to do so. There are many wireless
    security tools available for Linux that simply do not run on Windows or the Mac
    OS. The Linux operating system not only makes a perfect desktop OS for wireless
    users, but is also a dominant player in the server market. Familiarizing yourself
    with Linux will prove to be a huge benefit to you in your


    Linux is a free and open operating system (kernel) released under the GNU Public
    License model. The term open source means the underlying code is available for
    anyone to view and manipulate. This is in direct contrast with most commercial
    software, which is closed source, meaning the source code is not available to
    the public.


    Different variations or "flavors" of Linux are referred to Linux distributions.
    Trying to grasp why there are so many Linux distributions, what the real differences
    are, and why to choose one over the other can be a little confusing. After spending
    some time with a few different distributions, you''ll quickly understand what
    makes each distribution unique and start your own preference for different distributions.
    Technically, Linux derives its name from the kernel of the operating system, and
    any of its distributions as "Linux," which is perfectly acceptable.


    Here are some of the main differences between the various Linux distributions:


    +   * The default software available upon install

    * The support available from a commercial company

    * The software management programs

    * The installation processes


    Arguably the two most important differences are the support available from a commercial
    company as well as the default programs installed. Many businesses will only allow
    open source base be used in their environment if they can count on support being
    available. Some Linux distributions, including RedHat and SuSe, offer commercial
    (and very good) support. For an extremely extensive list of Linux distributions,
    check out the Distrowatch.com website. Here''s a list of the most popular Linux
    distributions (in no particular order):


    +   * BackTrack

    * RedHat'
