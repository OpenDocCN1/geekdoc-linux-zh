  md: '# Glossary


    CAPWAP Control And Provisioning of Wireless Access Points. An open standard based
    on LWAPP for the configuration and management of wireless access points from a
    central controller.


    CCMP Counter Mode with Cipher Chaining Message Authentication Control Protocol
    (CCM Protocol). An encryption technology used with WPA2 to replace the weaker
    TKIP protocol.


    charter A document that describes the specific rights and privileges granted from
    the organization to the information security team.


    CIA Confidentiality, integrity, and availability. CIA is an industry-standard
    acronym used to describe three of the most important concepts for a secure information
    system (sometimes referred to as the CIA triad).


    cloud computing As by the National Institute of Standards and Technology (NIST),
    cloud computing is a model for enabling ubiquitous, convenient, on-demand network
    access to a shared pool of configurable computing resources (for example, networks,
    servers, storage, applications, and services) that can be rapidly provisioned
    and released with minimal management effort or service provider interaction. This
    cloud model provides availability and is composed of five essential characteristics,
    three service models, and four deployment models.


    compliance Adherence to a set of policies and standards. Two broad categories
    of compliance are compliance with internal policies (specific to a particular
    organization) and compliance with external regulatory policies, standards, or
    frameworks.


    confidentiality The regulation of disclosure of information to unauthorized parties.


    consultant A subject expert who is contracted to perform a specific set of activities.
    Typically, a statement of work outlines the deliverables to be completed by the
    consultant and the deadlines for each deliverable.


    core competencies The fundamental strengths of a program that add value. They
    are the primary functions of a program and cannot should not be done by outside
    groups or partners.


    data cleansing The actions performed on a set of data in order to improve the
    data quality and achieve better accuracy, completion, or consistency.


    dirty data Data that has unacknowledged correlation or undocumented origins or
    is biased, non-independent, internally inconsistent, inaccurate, incomplete, unsuitable
    for integration with data from other important sources, unsuitable for consumption
    by tools that automate computation and visualization, or lacking integrity in
    some other respect.


    EAP Extensible Authentication Protocol. A protocol framework used to carry various
    authentication method used in WPA and WPA2.'
