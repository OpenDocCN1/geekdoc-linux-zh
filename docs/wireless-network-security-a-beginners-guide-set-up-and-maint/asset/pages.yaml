    I would recommend you take a hard look at whether wireless technologies are the
    right choice for you you consider it necessary to use a Faraday cage to secure
    your network.


    # MAC Filtering


    MAC address filtering enables an administrator to define specific hosts that are
    allowed to associate with the wireless network. The hosts are defined by the MAC
    address of their wireless card. MAC filtering is the perfect example of a whitelist.
    Remember that a MAC address is the hardcoded address that identifies your specific
    network card.


    With MAC filtering, essentially you''re telling your access point to only allow
    devices that exist on your whitelist to associate with your access points. This
    approved MAC list is typically created by hand, although there are some options
    to “auto-discover” or import a large number of MAC addresses. MAC filtering might
    conceptually make sense, but in practice it affords no real security.


    As I''m concerned, MAC address filtering might take the cake. This might very
    well be the most useless defense for wireless networks. You''ve already seen in
    previous how trivial it is to sniff a wireless network and obtain the MAC address
    for a host that is authorized to assign your wireless network card to use that
    MAC address. When you combine trivial it is to bypass this “access control mechanism”
    with how annoying it is to administer the system, you have a candidate for world''s
    worst defense. Think of how annoying it would be every time you added a new wireless
    device to your network or changed a wireless network card, you had to wait for
    an administrator to add your device to the approved list. Also, from the perspective
    of an administrator, it''s just another hassle that he doesn''t need.


    # SSID Cloaking


    As you''ll recall from Chapter 4, Service Set Identifier (SSID) cloaking allows
    an administrator to prevent the network name from being included in beacon frames
    from the access point. This is done to prevent wireless clients from “discovering”
    the wireless'
