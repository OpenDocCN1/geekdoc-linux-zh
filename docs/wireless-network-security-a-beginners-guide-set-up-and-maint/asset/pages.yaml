  md: '# Chapter 8 Deploying a WPA-Enterprise Network with Certificates 199


    # Create the Wireless Group Policy Object


    Now we'' add a Group Policy Object that enables the clients to automatically enroll
    in the available certificates. The Group Policy can be configured to allow users,
    computers, or both to automatically enroll in certificates. You should also keep
    in mind that certificate templates are specific to users or computers. Therefore,
    certificate templates that allow users to automatically enroll in certificates
    can''t be used by computers to automatically obtain certificates.


    To configure the Group Policy Object, open Server Manager, expand Features, Group
    Policy Management, expand your forest (zion.loc, in our example), right-click
    the Wireless Organizational Unit, and choose “Create a GPO in this domain, and
    link it here.\ Name the Group Policy Object something logical (in this example,
    we''ve named it WirelessCertAutoEnroll) and then click OK. Right-click the newly
    created Group Policy Object and choose Edit


    # Apply the Group Policy Object to the Wireless Organizational Unit


    The location for configuring auto-enrollment for users is User Configuration |
    Policies | Windows Settings | Security Settings | Public Key Policies, as shown
    in Figure 8-7. Double-click “Certificate Services Client – Auto-Enrollment” to
    configure the policy. You''ll want to use the settings shown in Figure 8-8. To
    enable auto-enrollment, change the Configuration Model setting to Enabled and
    then click OK to continue.


    ![](img/78ecc761d1e6376868e68bf50b83b97a_217_0.png)


    Figure 8-7 Auto-enrollment Group Policy location'
