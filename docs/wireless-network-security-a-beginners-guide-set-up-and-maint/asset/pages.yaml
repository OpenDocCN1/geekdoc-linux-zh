  md: '# Handling Rogue Access Points


    So you''ve successfully located the rogue access point. Now what do you do? Do
    you just unplug it and congratulate yourself on a job well done? This is another
    decision that''s best handled by someone who can make executive decisions. More
    often than not, the answer should be to unplug it from your network; instead,
    you need to get evidence for potential legal matters. You''ll also want to try
    and track down exactly who is using the wireless network and what they''re doing.


    What are the best ways of determining how a malicious access point is being used?
    Once you''ve physically tracked down the access point, you should look into monitoring
    the traffic entering your network through the access point. You can do this by
    configuring a SP port to copy all the traffic that enters the switch from the
    access point to another port, which you can then connect a sniffer to and monitor
    (as well as save) all the packets traversing that link. Span ports are covered
    in detail in Chapter 6. The configuration to apply a Span port is typically pretty
    straightforward; the following is a simple example for a Cisco switch:


    ```

    Zion-Switch1(config)#monitor session 1 source interface fastethernet0/9

    Zion-Switch1(config)#monitor session 1 destination interface fastethernet0/20

    ```


    In this example, we''re instructing the switch to copy every packet that enters
    or exits the fastethernet0/9 interface and send a copy of these packets to fastethernet0/20.
    It doesn''t matter where a packet is destined to; if it comes from the access
    point or is destined for that port, we will be able to view it. Remember that
    the configuration for


    # In Action


    Any time you''re dealing with a potential legal issue, you need to treat every
    decision and action with special care. Keeping a detailed log of the decisions
    and actions you take, along with the time and date, is critical. Even with something
    as simple as handling a single rogue access point, you can quickly become overwhelmed.
    Don''t be afraid to call in a professional Incident Response Team to assist. You
    need to watch out for a lot of pitfalls to make sure the evidence you gather can
    be used in any legal action. And don''t forget: document, document, document.


    ![](img/78ecc761d1e6376868e68bf50b83b97a_307_0.png)'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Into Action


    What do you do if there are no clients currently associated to the rogue wireless
    network? Do you assume it was placed there accidentally and forgotten? Are you
    then okay to remove the access point without investigating any further? The answer
    of course is, it depends. You need to decide what makes the most sense for your
    environment. However, keep in mind that simply removing the access point does
    not give you any insight into who placed it there or where. You should consider
    putting a network sniffer or IDS in place to monitor any activity from the access
    point. If nothing is observed within a reasonable amount of time (two to four
    weeks, for example), you should consider removing the access point.


    model of switch might be different but it''s typically not much more complicated.
    Another option is to plug a network hub between the access point and your network
    switch. You can then plug your network sniffer into any port on the hub and view
    all the packets from the attacker.


    You should consider the best way to physically track down anyone using the wireless
    network. Running into your parking lot and frantically looking into every car
    might tip off someone that you''re on them. Instead, you should first decide whether
    law enforcement should be involved. If you''ve decided to wait to contact law
    enforcement, you should carefully but quickly determine your strategy for finding
    the person who''s using the network.


    # Into Action


    Many of us wouldn''t mind living like we''re in a spy thriller, tracking down
    the attacker who''s trying to break into our network. Before you kick the door
    to your parking lot and run out guns blazing, be the access point wasn''t placed
    there by an employee. Checking with other IT staff and even simply asking employees
    near the location where you discovered the access point might be the best place
    to begin.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# Chapter 11 Handling Rogue Access Points and the Future of Wireless Security
    291


    Alerting your fellow IT staff to keep an eye out for any strange behavior is a
    good way to start. In, alerting other employees to be on their toes and telling
    them whom to contact if they see anything suspicious can be very helpful. If you
    have a wireless management system, it might be able to aid you by giving an approximate
    location of any client devices associated to the rogue access point. If you don''t
    have a wireless management system, you''re pretty much stuck with the old-fashioned
    method, which involves involves walking around and looking for the culprit.


    Although you could employ some technological methods to help you, it might be
    easier to look in obvious places first. If you have a shared office, this might
    be a little more difficult because the attacker could potentially be located in
    an area you can''t easily get to. Regardless, start with the obvious places. Also,
    if you have security cameras, start to leverage them to inconicuously look for
    the culprit.


    # Automated Detection of Rogue Wireless Networks


    Besides relying on the manual approach, you can also use technologies to assist
    in finding rogue wireless networks. Some of these technologies will simply aid
    you, whereas some of the most sophisticated technologies will almost handle the
    entire job for you.


    Many solutions use your existing wireless infrastructure to scan the wireless
    frequencies and alert you to any rogue access points. Lightweight access point
    solutions typically have this functionality built right into the access points
    and controllers. Many of these systems offer really interesting functionality
    beyond simple alerting. For example, they might allow you to estimate an approximate
    position of the rogue access point based on the signal strength from multiple
    access points.


    You would accomplish this by first uploading an image of the area where you have
    deployed your access points. This can be a blueprint of a building, an image of
    a campus, or even an image saved from a service such as Google Maps. You would


