    the computer from storing user credentials to use to authenticate to wireless
    networks when no user is logged on. The final option configures the amount of
    time a computer will wait before automatically connecting to a preferred network.


    Remember to think through all your choices and determine exactly which risks you
    are mitigating by deploying a specific security solution. In the case of GPO to
    restrict wireless networks a client can associate to, what exactly are you preventing?
    By only allowing users to connect to configured wireless networks, you''re preventing
    the user from connecting to potentially malicious networks.


    Keep in mind, however, that if you have configured preferred wireless networks
    with weak authentication methods, it''s probably not doing much good against an
    attacker. Remember from Chapter 5 that an attacker can respond to beacons from
    the client computer claiming to be your network requested. Thus, if you''ve configured
    a preferred wireless network with no encryption or authentication, an attacker
    can spoof this network where the user may be. Also keep in mind that if you''re
    using WPA2-Enterprise and not authenticating the access point, your users might
    still be vulnerable.


