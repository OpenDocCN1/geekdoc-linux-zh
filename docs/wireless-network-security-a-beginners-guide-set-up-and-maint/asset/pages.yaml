  md: '# Wireless Network Security: A Beginner''s Guide


    options include reconfiguring the infrastructure and clients in phases by location.
    For example, if you''re upgrading your network from WEP to WPA2-PSK, rather than
    doing it in one shot, you could upgrade a few access points at a time and switch
    over the clients in the vicinity at the same time.


    # Wireless Network in Parallel


    One option I''ve used in the real world is to deploy a new wireless network alongside
    an existing wireless network and client devices ever when possible. In the previous
    example of upgrading from a WEP network to a WPA2-PSK network, you could deploy
    the new access points and leave the existing WEP network in place until all your
    users have moved to the new network. This can greatly minimize the impact on your
    users because you can move them to the new wireless network incrementally. What''s
    more, you have the option to move them back if there are any issues.


    # Touch Every Wireless Client


    For some security feature upgrades, you might spend a little time with every client
    of your wireless network. For example, in the event you want to upgrade your current
    wireless network from WEP to WPA-PSK, you might need desktop support personnel
    to visit each client device and manually enter the new WPA key. Of course, you
    can send the WPA key to users and have them enter it themselves, but this presents
    another opportunity for the key to be handled inately and potentially compromised.
    Either way, you need to understand whether the new security settings you''re deploying
    will require administrative time for each client.


    # Wireless Refresh


    A project to refresh your wireless network or a gut-and-replace project to upgrade
    your wireless infrastructure, or just upgrading select components of your wireless
