    # Configure the RADIUS Server


    Now we''ll move on to configuring our RADIUS server. We will install the service
    on our server and configure a connection request. Each of the steps below could
    be performed manually; however, once the RADIUS service is installed, there''s
    a very handy wizard which will walk us through the required steps.


    +   1. Install RADIUS Service.

    2. Create a RADIUS client entry for the access point.

    3. Create a connection request policy.

    4. Create a Network Policy.


    To install the RADIUS service, we need to install the Network Policy and Access
    Services role. Start the Server Manager, right-click Roles, and choose Add Role.
    Select the Network Policy and Access Services check box, shown in Figure 8-18,
    and then click Next.


    The next screen is purely informational. Feel free to take the time to view the
    types of information available to you. Click Next to continue. Select the Network
    Policy Server check box and click Next to continue.'
