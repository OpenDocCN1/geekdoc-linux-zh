- img_proc: true
  md: '# Wireless Network Security: A Beginner''s Guide


    The line for each file starts with a possible ten bits; if a bit is set, you will
    see a character. If it is not set, you will see a dash. The first entry in Figure
    A-15 is for a directory; we can tell it is a directory because the first entry
    is “d.” whereas for a file it would be just a dash. Following the directory bit
    are three groups of three bits. The bits are read, write, and execute bit, which
    are shown as r, w, and x, if they are set. The three groups of bits represent
    the permissions for the specified user, the specified group, and all other users
    of the system, respectively.


    The user and group follow the permissions for the file. In Figure A-15, the owner
    of the file is the root user and the group is the root group. The first block
    of permissions is set to rwx, meaning directory. The second block of permissions
    is set to r-x, meaning any member of the root group can read and execute this
    directory. Finally, the last block is also set to r-x, meaning every other user
    on the system can read and execute this directory. You should note that the execute
    bit must be set on a directory for a user to actually execute that directory.


    To adjust the permissions of a file or directory, use the chmod command, which
    stands for change mode. First, you designate the users you wish to change the
    permissions and then you specify which permissions to add or remove. The letters
    used for the users are u, g, o, and a. These letters represent the following users:


    | Char | Description |

    |---|---|n| u | The file''s owner |

    | g | The file''s group |

    | o | All other users on the system |

    | a | All users (file owner, file group, and all other users) |


    Permissions are represented with rwx. You add permissions with a plus sign (+)
    and remove permissions with a minus sign (−).


    | Char | Description |

    |---|---|n| r | Read bit |

    | w | Write bit |

    | x | Execute bit |


    Let''s look at a few examples. To remove all permissions on a file called file.txt,
    you would start with the following command:


    ```

    chmod a-rwx file.txt

    ```'
