  md: '# Wireless Network Security: A Beginner''s Guide


    # Smartphones and PDAs


    One of the most exciting and interesting new wireless-enabled devices by far is
    the smartphone. The three main choices today for a smartphone with wireless tools
    are iPhones, Windows-based smartphones, and Android-based smartphones.


    I definitely prefer the flexibility and available software of the Android OS.
    Keep in mind that the Android OS is based on Linux, so it might not be long until
    the wireless security software covered in this book can be run from your shirt
    pocket. In the next chapter, we''ll cover some of the terrific software programs
    already available for smartphones.


    In addition to the huge list of software available for smartphones, think about
    all the features you have in the palm of your hand. You can scan for wireless
    networks while logging your position with a built-in GPS and recording what you
    see with a video camera. All the data you gather can be saved locally to your
    smartphone or a flashcard that has over 20GB of storage.


    We''ll explore some of the very interesting attacks against smartphones in a later
    chapter.


    # Pocket Wireless Scanners


    A few interesting handheld devices work perfectly for the impromptu warwalking
    adventure. Although most do not provide a whole lot of detail, often the SSID
    can be used to enumerate an interesting target. For example, the Hotspot device,
    retails for $50 from Canary Wireless, can display the wireless channel, the signal
    strength levels, and the encryption type in use. You can read more about the Hotspot
    at Canarywireless.com.


    # Spectrum Analyzer


    Although a spectrum analyzer''s core functionality isn''t necessarily security
    related, some manufacturers bundle traffic-dumping software to allow you to see
    wireless communications. Spectrum analyzers give you data on the physical communications
    on a given frequency. This can aid you in troubleshooting issues from congestion,
    range, and physical topology. Spectrum analyzers used to be prohibitively expensive,
    but nowadays affordable and surprisingly easy-to-use options are available. One
    option is the Wi-Spy by Metageek. Wi-Spy offers a few options that range from
    $99 to $1,000 and come with a USB wireless card and the software to display the
    information in a nice graphical manner.'
