    **Figure 5-11** DNS spoofing attack


    In this case, the attacker directed the client to connect to a web server on the
    attacker''s machine. If the attacker wanted to target a specific website he knew
    would be expecting, he could create a website that looked identical and save any
    credentials the user entered on the machine. Not only could the attacker save
    all the credentials, but he could actually redirect the user to the legitimate
    website and the user would have no indication of what happened.


    # Fake Webauthb


    Another interesting attack vector involves a fake web authentication page. You''re
    probably already familiar with webauth pages. If you''ve ever been to a coffee
    house, bookstore, or airport, chances you''ve seen a web authentication portal
    page. We''ll actually walk through the proper use of a web authentication portal
    in a future chapter.


    The basic functionality of the webauth is to present the users with a splash page
    before they''re allowed to view any websites. The splash page usually details
    things like who is providing the wireless service as well as an acceptable use
    policy. There are many different techniques for how a user is redirected to the
    webauth splash page, most of which not surprisingly MIMM attacks. When the user
    tries to visit any website, he is redirected to the web authentication portal.
    Typically, the user can click a button or check a box stating that he has read
    and accepted the acceptable use policy.'
