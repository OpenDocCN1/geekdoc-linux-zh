  md: '# About the Author


    Tyler Wrightson (CISSP, CCSP, CCNA, CCDA, MCSE, Linux+) is the founder and president
    of Leet Systems and Fridgo.com. Tyler is currently a Senior Security Consultant
    for Integralis, Inc., where he specializes in offensive security engagements,
    penetration testing, vulnerability assessments, social engineering, and physical
    penetration testing. Tyler has over eleven years of experience in the IT security
    field, with extensive experience deploying and securing wireless networks. Tyler
    has also taught wireless and network security classes for the CCNA. You can follow
    him on @twbrightson or check his security blog at http://blog.leetsys.com.


    # About the Technical Editor


    Brock Pearson (MCP +, MCSE Windows NT 4.0, MCP Windows 2000, CISSP, CRISC, A+,
    N+) holds a B.A. in Information Systems and is currently pursuing his Certified
    Ethical Hacking certification. He has been in the Information Technology industry
    for 19 years in varying capacities, including network administrator and MIS manager
    for a manufacturing firm in the South Florida area as well as security consultant
    and manager for two of the top three consulting firms in the world.


    Brock has been involved in many SIEM installations using his security experience
    and product knowledge to aid large-scale implementations and provide successful
    outcomes. Within many of these engagements, Brock provided solid product training,
    customized use-case training, and advanced product customizations within the security
    infrastructure.'
