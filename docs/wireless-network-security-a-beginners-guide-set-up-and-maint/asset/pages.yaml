  md: '# Wireless Network Security: A Beginner''s Guide


    # Stream Ciphers vs. Block Ciphers


    The basic methods for encrypting data are stream ciphers and block ciphers. In
    a stream cipher, the data is typically encrypted one byte at a time and the output
    cipher text is the same length (or very close) as the plaintext. In a block cipher,
    the encryption algorithm works on blocks of data of a fixed length. For example,
    if an encryption algorithm works on blocks of data that are 32 bytes, a plaintext
    message of 128 bytes would be split into four unique blocks of ciphertext (see
    Figure 3-11).


    # How WEP Works


    Wired Equivalent Privacy (WEP) was part of the original 802.11 wireless standard
    introduced in 1999. WEP provides encryption at Layer 2 of the OSI model, the MAC
    or Link layer. WEP utilizes the RC4 encryption algorithm to encrypt data and uses
    a shared-key system. WEP uses either 40-bit or 104-bit WEP key to encrypt data.
    WEP, if you don''t already know, has been absolutely unacceptable as a secure
    encryption algorithm for some time now.


    > IMHO

    It has always been my opinion that the name of WEP (Wired Equivalent Privacy)
    implied that the designers'' train of thought was flawed from the beginning. The
    simple fact of the matter is that there is no level of encryption that can make
    wireless networks the equivalent of a wired network. Some people may disagree
    with me, so I leave it to you, the reader, to make up your own mind.


    # Block Ciphers


    | 128K USER DATA | Encryption | 32K Cipher text | 32K Cipher Text | 32K Cipher
    Text | 32K Cipher Text |


    # Stream Cipher


    | Unencrypted User Data | Encryption | DBALPSMYATIWL5QZYEFWB |


    Figure 3-11 Block ciphers versus stream ciphers'
