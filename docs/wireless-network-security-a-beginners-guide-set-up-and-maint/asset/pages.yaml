    # Supporting Services


    Certificate services rely heavily on the Domain Name System (DNS) and the Network
    Time Protocol. Clearly, if your system time differs greatly from that of your
    Certificate Authority, you may incorrectly believe a certificate to be expired.
    Likewise, DNS needs to be functioning properly for many aspects of certificates,
    including communication with your Certificate Authorities, Active Directory domain
    controllers, and domain systems.


    # Microsoft Certificate Services


    Microsoft is clearly the dominant player in enterprise directory services. We''ll
    take a look at configuring Microsoft Certificate Services to support authentication
    for your wireless network in the next chapter. For now you need to understand
    a few of the nuances of Microsoft Certificate Services. Microsoft refers to its
    certificate servers as either “stand-alone” or “enterprise” servers. A stand-alone
    Certificate Authority is not integrated into Active Directory, and Microsoft recommends
    that it not be a member of your Active Directory domain.


    An enterprise certificate server, on the other, has to be a member of an Active
    Directory domain. This integration with Active Directory allows for additional
    features and greater flexibility. The following are the defining characteristics
    of an enterprise certificate server, straight from Microsoft:


    +   - Requires access to Active Directory Domain Services (AD DS)

    - Uses Group Policy to propagate its certificate to the Trusted Root Certification
    Authorities for all users and computers in the domain

    - Publishes user certificates and Certificate Revocation Lists (CRLs) to AD DS


    # Auto-Enrollment and Certificate Templates


    In previous discussions on creating certificates, I explained that an administrator
    is required to verify the user’s identity that is requesting the certificate.
    As you might have guessed, this can quickly become cumbersome for a large organization.
    If you had to manually create and potentially verify each of certificate, you
    could quickly become overwhelmed. Microsoft Certificate Services includes functionality
    called certificate auto-enrollment to automatically create and distribute certificates
    to users.


    Wait a minute, doesn’t that run completely everything we just discussed about
    issuing certificates? If we have a server automatically sending certificates,
    how do we know that it’s giving the certificates to the appropriate people? An
    excellent question.'
