  md: '# Wireless Network Security: A Beginner''s Guide


    Wardriving is the process of driving around commercial or residential areas with
    wireless networking gear and attempting to see what wireless networks are available.
    This process is surprisingly popular, probably for a few reasons. First, it''s
    incredibly fun, even without malicious intentions. It''s entertaining to drive
    around in your car with antenna stuck to your roof and see networks popping up
    and right—I highly recommend it. There''s very little chance of "caught" doing
    anything you shouldn''t. If a cop pulls over a car full of geeks with laptops
    and antennas, I doubt he''s going to think they''re up to anything suspicious.


    > LINGO

    **A network sniffer**—also known as a protocol analyzer—is a program that allows
    you to see the network packets behind your network communication. Most sniffers
    allow you to view the packets in different ways—binary, ASCII, and so on. Some
    sniffers can understand application layer protocols and show the data in very
    consumable ways. For example, if a sniffer understands HTTP, you can actually
    view the web page from the data within the packets.


    A network sniffer is a critical tool for you to familiarize yourself with. Over
    the course of your security career, it will prove to be absolutely priceless.
    We''ll cover the use of the most popular and extensive sniffer (Wireshark) in
    the next chapter.


    ![](img/78ecc761d1e6376868e68bf50b83b97a_62_0.png)


    # SSID Decloaking


    Many network administrators feel it enough to not broadcast the existence of their
    wireless network. For most access points, this is referred to as SSID cloaking.


    # In Actual Practice


    Want proof that people are out doing this? In 2002, I was called by a new client
    to take care of a simple wireless issue. They couldn''t connect to their wireless
    network and needed someone to fix it. It took about five minutes to determine
    that they had neglected to change the default password to secure their access
    point and someone had logged in and changed their SSID to something comical, including
    some “hacker lingo.


    Want to know the real kicker? I ended up meeting the people responsible for it!
    Also, I should mention that this happened in a very small rural town. If people
    are wardriving in cow country New York, do you think your business might have
    been visited by curious wireless enthusiasts?'
