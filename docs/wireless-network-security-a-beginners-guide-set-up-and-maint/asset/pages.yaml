  md: '# How WPA Works


    WPA, or Wi-Fi Protected Access, was developed as “WEP’s replacement.” There are
    two versions of Wi-Fi Protected Access: WPA and WPA2. The original WPA standard
    was intended as a temporary replacement for WEP while the 802.11i (WPA2) standard
    was being developed. Because of the way WPA works, it was able to run on most
    existing wireless cards and access points through a simple firmware update.


    The technology that allows WPA to work on existing hardware is TKIP, the Temporal
    Key Integrity Protocol. We won’t go too deep into the details of how TKIP works,
    but you should understand the basics. TKIP still uses the RC4 algorithm to encrypt
    data, which is one of the reasons TKIP can run on existing hardware. TKIP encrypts
    every packet with its unique encryption key, which is still based on the key (the
    pre-shared WEP key). Essentially, TKIP is performing a more secure version of
    what WEP was intended to do using a root WEP key and a “unique” IV for every packet.
    TKIP also provides a “re-keying mechanism,” which is where it gets its name (because
    the encryption keys are only “temporary”).


    WPA is implemented in two basic ways:


    +   - WPA-PSK (Pre-Shared Key)


    +   - WPA-Enterprise


    # WPA-PSK


    With WPA-PSK (Pre-Shared Key), also sometimes referred to as WPA-Personal, you
    assign a key that is shared among all devices that wish to join the wireless network.
    Operationally, this is identical to creating and distributing the WEP key. However,
    the key is now 256 bits in length. This is clearly intended for home or small-office
    solutions, yet it is very widely deployed even in enterprises.


    # WPA-Enterprise


    WPA-Enterprise is much more complicated to configure compared to WPA-PSK. It requires
    additional servers on the backend to perform authentication of each individual
    user (typically this would be a RADIUS server). Although WPA-Enterprise is more
    complicated to configure initially, you’ll see that it is much easier to administer
    for larger organizations and provides a better layer of security. We will cover
    WPA-Enterprise configurations in a later chapter.


    Remember the previous example of the WEP key that is shared among all users in
    an organization? If you have 100 users and one of those leaves the company, you'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Chapter 3 Theory of Attacks on Wireless Networks 65


    now have to change the WEP key and replace it on 99 systems. With WPA-Enterprise,
    this is no longer an issue. Because every user has his or her unique authentication
    credentials, if one user leaves the company, you simply disable that user''s account.


    # WPA2 Encryption Algorithms


    WPA2 still supports the TKIP encryption algorithm but has also introduced a new,
    more secure option that''s typically referred to as CCMP or AES. Counter Mode
    with Cipher Block Chaining Message Authentication Code Protocol (CCMP) uses the
    much more secure and vetted AES encryption algorithm. AES, the Advanced Encryption
    Standard, has been around for years and has withstood the test of time. Whenever,
    you should be configuring your access points and clients to use the WPA2 CCMP
    algorithm. In Figure 3-13, you can see that WPA2 encompasses all the WPA technologies.


    # Attacking WPA Protected Networks


    This is great, so all we have to do is replace all of our wireless equipment that
    uses WEP with equipment that uses WPA and we''re completely secure, right? Well,
    not exactly. Remember that every single technology has its own inherent limitations
    and weaknesses. We''re going to look at the following vulnerabilities associated
    with the WPA protocol:


    +   - WPA-PSK cracking

    - WPA deauthentication spoofing

    - WPA denial of service

    - Attacks on TKIP

    - WPS Bruteforcing


    ![](img/78ecc761d1e6376868e68bf50b83b97a_83_0.png)'
