  md: '# Wireless Network Security: A Beginner''s Guide


    If the goal of having a penetration test performed is to acquire ammunition for
    obtaining a budget, make this absolutely clear to the company you hire. Depending
    on your ultimate goals, a penetration test can be catered to deliver exactly what
    you need and can be surprisingly affordable and cost effective.


    # Penetration Test vs. Vulnerability Assessment


    Unfortunately, many people (including those in the security field) don''t actually
    understand the difference between a penetration test and a vulnerability assessment
    and when to perform each. In a vulnerability assessment, you are enumerating vulnerabilities
    in a system (typically as many vulnerabilities as you can, but not always). In
    a penetration test, you are proving vulnerability in a system by actually exploiting
    discovered vulnerabilities. Typically, this is summarized as “simulating what
    a person with malicious intent would."


    So when you have a penetration test performed and when should you perform a vulnerability
    assessment? Here are the reasons to perform a penetration test:


    +   * To test the defenses in place for appropriate actions and responses

    * To prove vulnerabilities to upper management to obtain the necessary budget


    And here are the reasons to perform a vulnerability assessment:


    +   * To identify all unknown vulnerabilities

    * To produce reports for audit requirements


    You wouldn''t necessarily want a traditional goal-oriented penetration test performed
    when you want to identify all the vulnerabilities in a system, typically penetration
    testers will not try to identify all the vulnerabilities in a system. If they
    identify one vulnerability that gives them complete access to a system, they have
    no real reason to continue identifying other vulnerabilities because penetrating
    the system has already been reached.


    Clearly, this is not an exhaustive list of the reasons to perform one test over
    the other, but you should have a good understanding of the typical reasons for
    each. I find myself performing hybrid assessments more often nowadays, taking
    the best of both worlds while trying to maximize the dollars spent by my clients.'
