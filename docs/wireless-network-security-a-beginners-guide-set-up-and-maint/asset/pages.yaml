    # Defense In Depth


    Remember we discussed the principles of Defense In Depth in the first chapter.
    The core idea behind Defense In Depth is to have multiple technologies in place
    to secure your environment and not just rely on one. Too often network administrators
    rely solely on preventive technologies to keep attackers out—this is especially
    true of wireless networks. A perfect example would be the typical setup where
    either WEP or WPA are used and nothing else. Administrators assume they''ve prevented
    unwanted outsiders'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Wireless Network Security: A Beginner''s Guide


    from accessing their network and therefore don''t need to worry about any additional
    security measures. One of the biggest pieces of the puzzle is in deploying technologies
    to detect attacks—both attempted and successful attacks.

    Remember that the three main components of a Defense In Depth strategy are


    +   - Prevent

    - Detect

    - Deter


    However, there''s a fourth quasi-tactic that is picking up steam in real-world
    deployments: Frust. Some systems have capabilities whose sole purpose is to confuse
    or frustrate an attacker. A honeypot system could be considered to have frustration
    and diversion capabilities because attackers would wasting their time on systems
    from real targets. That lead nowhere and divert them away include "stealth" capabilities
    to confuse port scanners in which they report that all TCP ports are open.

    You''re more able to integrate technologies that detect and deter as well as prevent,
    the stronger the overall security of your network will be. We''ll take a look
    at real-world solutions using a Defense In Depth strategy in later chapters.


    > LINGO

    Honeypot systems is essentially a juicy-looking target (typically a server) whose
    sole purpose is to attract bees (attackers). Honeypots also appear to have vulnerabilities
    on them that would attract the attention of an attacker. We''ll discuss honeypots
    and good deployment locations for in a later chapter.


    # Least Privilege


    The principle of Least Privilege is a very important component of any secure system.
    Least Privilege means giving users and systems access to only the things they
    need. Unfortunately, this is probably one of the most overlooked principles in
    any system, and most system administrators apply the antithesis of this principle
    and start by granting users access to everything and removing specific things
    one by one. This can also be referred to as whitelisting and blacklisting, respectively.


    When using a blacklist, you essentially configure a system so that users can access
    anything they want except for items listed on the blacklist. When using a whitelist,
    you start by saying users cannot access anything except for items on the whitelist.
    These principles


    ![](img/78ecc761d1e6376868e68bf50b83b97a_156_0.png)'
