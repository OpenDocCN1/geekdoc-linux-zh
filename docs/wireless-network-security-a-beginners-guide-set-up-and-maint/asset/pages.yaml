  md: '# Chapter 11 Handling Rogue Access Points and the Future of Wireless Security
    297


    You might think cloud-based wireless access points wouldn''t be as robust as traditional
    slick access points, but they offer identical services that you can configure
    from a pretty slick web interface. Some of the services include the following:


    +   - Rogue access point detection

    - Mapping functionality

    - Quality filtering

    - Content filtering

    - Traffic shaping (limiting bandwidth)

    - Splash pages and captive portals


    # Dedicated Wireless IDS


    Wireless intrusion detection systems perform the same function as a traditional
    IDS, except they have the added benefit of monitoring the airwaves for indications
    of attacks. With IDS systems, you don''t have the same placement decisions as
    traditional intrusion detection systems. Instead, you have to come up with a physical
    deployment strategy to effectively monitor the airspace of locations where you
    need to monitor.


    As far as wireless IDS systems go, there''s currently no competing with Fluke
    Networks Airmagnet Enterprise. Airmagnet uses dedicated wireless scanning devices
    that surprisingly look very similar to many wireless access points. It supports
    scanning beyond the frequencies of any wireless card you can find—well beyond
    channels 1 to 14.


    For a complete list of all the functionality provided by Airmagnet, check out
    the Fluke website at http://www.flukenworks.com.


    You can also use Kismet as a dedicated wireless IDS system. It operates very similar
    to what you''re used to from a wardriving program; in fact, you can get a good
    look at its operation as an IDS by running it on your laptop. You can use a wireless
    interface in the IDS computer or can use Kismet drone to send information to the
    Kismet server.

    Kismet has a good list of IDS signatures. Some of the signatures include detection
    of the following:


    +   - Access point spoofing (alerts if a beacon or probe response is sent from
    a new MAC address)

    - Changes to the channel on which an access point operates

    - Deauthentication floods

    - Disassociation sent to active scanning tools such as Netstumbler'
