    # Into Action


    Wondering how all this applies to wireless networking? Let''s take a look at a
    realworld example.


    Let''s assume you have 100 wireless access points deployed in your organization
    with 1,000 wireless users. A new exploit is released that affects the version
    of firmware currently running on all your access points. The exploit allows an
    authenticated user to reboot the wireless access point. We''ll calculate the risk
    level using a High/Medium/Low scheme used in Figure 1-2. (Remember that the risk
    calculation is Risk = Consequence × Probability)


    +   - **Consequence** This would be Low because a reboot would only temporarily
    affect users.


    +   - **Probability** This is Low as well because only authenticated users can
    successfully exploit this vulnerability.


    Thus, the risk calculation would be Low × Low = Risk.

    If it costs you four man-hours per access to apply a patch for this vulnerability,
    then it might not be worth the cost to mitigate this risk. Instead, it might be
    more effective to live with this risk and use 400 man-hours elsewhere.


    # Principle 4: Not All Risks Must Be Mitigated


    Not all security risks must be mitigated. Yes, I know, as a security fanatic it
    sounds counter to what we believe. If there''s a security hole, plug it! But in
    reality, there are plenty of risks that we don''t mitigate already. It''s relevant
    to bring these calculations to a conscious level. You''ve already read an obvious
    example—the risk of falling planes. Now let''s look at the cost to mitigate the
    risk of falling airplanes.


    You could construct a house for a million dollars that would withstand the impact
    from a falling plane, but when you consider the extreme possibility of a falling
    plane striking your house, you''ll probably come to the conclusion that it''s
    not worth the cost. Yes, this is another extreme example, so let''s look at a
    very simple example.


    A new regulation comes out that affects your business. If you fail to comply with
    the regulation, you will be fined $5,000 every year. You''ve hired an external
    firm to assess the cost to make you compliant with the regulation at a bare minimum
    it will cost you $2,000,000. It''s not hard to see here that it makes business
    sense to pay the fine and not try to make your business compliant.'
