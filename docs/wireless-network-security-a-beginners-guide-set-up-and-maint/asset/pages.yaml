  md: '# Wireless Networking Basics


    A brief introduction to the various wireless technologies is necessary to ensure
    we are speaking the same language. If you feel comfortable with these topics,
    feel free to skip ahead to the next chapter. In this section, we will look at
    a few definitions that represent a vital, foundational understanding of wireless
    technologies. I won''t be providing any information for actually configuring devices;
    however, the information provided should be universal across devices.


    # 802.11a/b/g/n


    802.11 is the name for the working group from the Institute of Electrical and
    Electronic Engineers (IEEE) for wireless local area networks. IEEE working groups
    are essentially committees of experts who define standards of operation for specific
    technologies that manufacturers can build standards that can operate. Nowadays,
    there''s a virtual soup of wireless technologies. We won''t focus too much on
    the differences; just understand that each new generation generally you have an
    increase in bandwidth and/or features.


    The IEEE identifies each standard with a letter. 802.11a is different from 802.11b.
    Although there are some commonalities between technologies, there are also differences,
    as well as advantages and disadvantages to choosing one technology over the other.
    For the most part, the differences between standards are in speed, modulation
    techniques, and whether they are backward compatible and a security technique
    that works for one will work for the others. For example, even though 802.11g
    was developed after 802.11b, it still supports WEP to ensure backward compatibility.


    However, keep in mind that some specific tools will only work for a specific standard.
    For example, if a program is written specifically to work with 802.11b, it might
    not work for 802.11a or even 802.11g. Because the underlying protocols for how
    data is handled are the same standards, the attacks and defense in theory will
    be identical.


    The 802.11 standards prescribe which frequencies these technologies use as well
    as the channels available to them. For example, the 802.11b standard operates
    on the 2.4 GHz frequency, and in the United States, there are 11 unique channels
    for use (labeled Channels 1 through 11). These unique channels assist in allowing
    networks to be physically close and not interfere with each other. However, depending
    on the country, the channels available for use may be different. For example,
    in Japan the channels are actually 1 through 14. This has security implications
    because an access point operating on Channel 14 may go completely unnoticed in
    the U.S. on this later.'
