  md: '# 204 Wireless Network Security: A Beginner''s Guide


    After you''ve created the certificate template, you need to issue it on your CA.
    Right-click the Certificate Templates folder under your CA name and choose New
    | Certificate to Issue. The newly created template and click OK. At this point,
    we are completely set for the users to obtain their certificate.


    Let''s continue by creating the certificate template for computers to obtain certificates
    and then we''ll discuss the details of obtaining the certificates through auto-enrollment.
    The process is exactly the same as the previous template; however, we''ll apply
    the permissions to the group WirelessComputers. Right-click the Computer certificate
    template and choose Duplicate. Select the CA type for your environment. Name the
    template appropriately. Add the WirelessComputers group and give it the Read,
    Enroll, and Auto-Enroll permissions. Then click OK.


    # Log onto the Workstation and Obtain the User Certificate


    Now if you log onto a workstation that''s a member of the WirelessComputers group,
    the computer will automatically obtain the computer certificate. Likewise, if
    you log onto any domain computer using an account that is a member of the WirelessUsers
    group, that user will automatically obtain the certificate. Because these settings
    are pushed out via Group Policy, you will need to make sure the Group Policy gets
    gupdate /force at a command prompt.


    The auto-enrollment process is triggered upon user login, so if you''re already
    logged in, you need to log out and log back into the computer to trigger the auto-enrollment
    process. You should understand that for the CA and the user''s certificate, the
    computer must have network access to Active Directory. This means that the computer
    cannot initially download the certificate necessary to authenticate to the wireless
    network over the same wireless network. The user must have previously obtained
    the certificate. Therefore, you must ensure that the computer is connected to
    the network either hardwire or a different network before attempting to authenticate
    to the wireless network to allow the computer to download the CA and obtain the
    certificate.


    After logging into the computer, we can view the certificate store on the client
    computer using the Microsoft Management Console. Click Start | Run, type mmpmc,
    and hit ENTER. Click File | Add/Remove Snapin and double-click the Certificates
    item. Click OK to close the dialog box. Expand the path Certificates | Current
    User | Personal and you''ll see something similar to 8-13.


    You''ll notice the issuing CA is the name of the Certification Authority we configured.
    If you scroll to the right, you''ll also see the certificate template that was
    used to create this certificate. This can be very handy information when you''re
    troubleshooting'
