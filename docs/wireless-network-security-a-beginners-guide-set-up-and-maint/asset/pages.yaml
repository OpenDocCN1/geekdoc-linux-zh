    systems you’re used to.


    # BackTrack: Our Linux Distribution of Choice


    All of the attack tools covered in Chapters 4 and 5 come preinstalled on BackTrack.
    Some of the tools of defense covered in Chapter 6 come preinstalled on the BackTrack
    distribution of Linux. At the time of this writing, BackTrack version 5 is currently
    offered. BackTrack can be run on 32-bit and 64-bit Intel computers.


    In addition to all the wireless-centric tools, BackTrack comes with an insane
    amount of security tools installed. If you’re responsible for the security of
    your organization, or if security is just a hobby, you’ll find BackTrack’s large
    list of tools helpful. BackTrack is based on the Debian distribution of Linux,
    which means it uses the apt set of utilities for program installation. The apt
    group of commands makes installing, uninstalling, upgrading, and otherwise managing
    the programs installed on your computer incredibly easy.


    > Note


