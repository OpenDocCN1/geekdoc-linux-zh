    the most popular protocols for creating VPN tunnels:


    +   - Secure Socket Layer/Transport Layer Security (SSL/TLS)

    - Internet Protocol Security Extensions (IPSec)

    - Point-to-Point Tunneling Protocol (PPTP)

    - Secure Shell (SSH)


    Secure Socket Layer (SSL) is something you''re already very familiar with. SSL
    is the technology used to secure your communications with web servers over the
    Internet. Transport Layer Security (TLS) is the next-generation protocol to replace
    SSL. Almost every website you visit uses HTTPS will be secured using SSL or TLS.


    The difference between SSL communications over the Internet and an SSL VPN is
    that you''ll have access to one TCP port (or network service) on the destination
    network with an SSL VPN. SSL VPNs have picked up a lot of steam in the past few
    years. The biggest advantage to using SSL VPNs is that they''re extremely easy
    to configure. Not only is the SSL server itself very easy to configure, but the
    client is extremely easy to install and very lightweight. Many users are already
    familiar with visiting a website using HTTPS, and typically an SSL VPN is easier
    for users to work'
