  md: '# Wireless Network Security: A Beginner''s Guide


    Next, click the Network Permissions tab, and you''ll see a window similar to Figure
    11-11. The options at the top portion of this screen are pretty straightforward.
    The first option prevents the system from associating with ad-hoc wireless networks.
    If you have specifically denied any wireless networks, you can disable the user
    from even viewing the wireless networks list of the Windows WLAN Configuration
    utility. The fourth option allows users to create wireless profiles that any other
    user of the local computer can use. This, of course, is a moot point if the fifth
    box is also checked. The option Only Use Group Policy Profiles for Allowed Networks
    is an important one. If this is enabled, users can only connect to wireless networks
    that have been configured by Group Policy.


    The last three options, under Windows 7 Policy Settings, only apply to Windows
    7—go figure! The first option is important because it prevents the users from
    turning their machine into an access point (a new feature to Windows 7). The second
    option prohibits


