    works, you need to understand some of the most basic communications processes
    a network node will perform.


    Let''s take a look at a very basic example. In the following example, the client
    computer Neo wants to telnet to Morpheus. Let''s assume Neo has an entry for Morpheus
    in his host file and therefore doesn''t need to query a DNS server to resolve
    the Morpheus to an IP address. Because Morpheus is on the same LAN segment (Layer
