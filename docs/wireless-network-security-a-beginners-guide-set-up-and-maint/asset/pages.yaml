  md: 'What''s more, you can leverage additional functionality already built into
    Windows to allow regular guest user accounts while not allowing them any privileges.
    It''s actually very simple to configure this in Active Directory. Open Active
    Directory Users and Computers Create a wireless guest group. Right-click the group
    and choose Properties. Click the Managed Tab and click the Change button (see
    Figure 10-3). Enter the name of the user you want to manage group membership for
    this group. Check the box labeled "Manager can update membership list" and then
    click Apply.


    As you see in Figure 10-3, we''ve granted the user Nate S the ability to manage
    the group called WirelessGuests. Now we all have to create a Microsoft Management
    Console (MMC) on Nate''s desktop and train him on how to add users to the WirelessGuests
    group.


    # Using Auto-Expiring Credentials


    All of the user accounts in your organization should be set to automatically expire
    after an appropriate amount of time. This is definitely true of guest accounts.
    Make sure you think through this and determine a reasonable time period for your
    accounts to be enabled


    ![](img/78ecc761d1e6376868e68bf50b83b97a_277_0.png)


    Figure 10-3 Configuring group management in Active Directory'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Wireless Network Security: A Beginner''s Guide


    before being automatically disabled. Generally speaking, for shared accounts you
    should try to expire them as quickly as possible, and for unique credentials you
    can extend the time period. Many places find it easy to share accounts expire
    on a weekly or even daily schedule. Of course, everything else, you need to determine
    what makes the most sense for your specific needs.


    # Allowing Secure Access to Internal Resources


    Providing internal network access to consultants via a “guest” wireless network
    presents its own set of challenges. This should be considered more of a tightly
    controlled portal into your network rather than a traditional guest network, very
    similar in concept to a DMZ. You have few options here, and the solution that
    works best for your environment might be based on the resources on your internal
    network that the consultants need access to. Some of your best options include
    the following:


    +   * Authenticating consultants

    * Network segmentation with demilitarized zone (DMZ)

    * DMZ with jump stations

    * Virtual private networking


    Using systems as VPN and jump stations allows you to reuse your wireless guest
    network for guest access to the Internet to allow guest users access to select
    internal resources. This can be a great cost savings because you only need to
    configure one network for guest users, but it must be configured with security
    in mind.


    # Authenticating Consultants


    Authenticating external users who require access to any internal resources is
    extremely important. It is fairly advisable to steer clear of using shared credentials
    for consultants. Assigning unique credentials for external users provides for
    better auditing capabilities and much tighter access control.


    Keep in mind that typically you can''t guarantee that external users will treat
    their accounts with the same level of caution as one of your employees. Therefore,
    even successful login events from consultant accounts should be more closely monitored.
    Unfortunately, the built-in functionality to monitor and alert on specific events
    in Windows is extremely limited. Typically, you’ll need some sort of log management
    solution to accomplish this. You should also set any consultant accounts to be
    automatically disabled after a specific'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Chapter 10 Handling Wireless Guest Access 261


    period of time. Auto-disabling the accounts doesn’t necessarily have to be when
    you know the consultant will no longer need his account. Creating all accounts
    with a predetermined auto-disable period (for example, three months) is a very
    good practice. The most reasonable time will depend on your specific situation.


    You should understand the role of the wireless authentication options and how
    they might help or hinder you in both authenticating and controlling consultants’
    access to your internal network. For example, if you use WPA-PSK to authenticate
    consultants to your wireless network, you’d need an additional system for authenticating
    them individually to other systems. This may or may not be an issue, but consider
    if you’re already creating separate (and individual) accounts in another system
    (Active Directory, for example), it might be worth the extra effort to configure
    WPA2-Enterprise and also audit each consultant’s individual access to the wireless
    network.


    This could be a perfect time to use a stand-alone RADIUS database. If, for example,
    the consultants do not need access to any Active Directory services or domain
    servers, you could keep all of their systems completely separate, including the
    authentication server.


    # Segmenting Guest Wireless Networks from Internal Internets


    Network segmentation alone is one possible solution to providing consultants access
    to internal resources, but again this depends entirely on the resources consultants
    need access to. We won’t cover this in much depth here because we covered many
    configurations of network segmentation in Chapter 9. However, you should remember
    that in this scenario, the consultant network should be thought of as a DMZ and
    treated as a very sensitive area.


    Remember that here we’re only talking about restricting what the consultants need
    access to; this doesn’t mean you should still authenticate users users encrypt
    their traffic.


    In Figure 10-4, you can see that we’re relying on WPA2 to provide both the authentication
    of the consultants as well as the encryption of their traffic. Remember that in
    this scenario, you don’t have control on a per-user basis what the users get access
    to. This solution is best when that level of granularity is not needed and all
    external people need access to the same resources.


    > Note It is absolutely not advisable to give outsiders complete unrestricted
    access to your internal network unless it is absolutely necessary.'
