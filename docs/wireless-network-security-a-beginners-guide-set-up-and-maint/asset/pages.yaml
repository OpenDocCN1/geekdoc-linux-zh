  md: '# Cracking the WPA Pre-Shared Key


    Cracking the WPA pre-shared key is the simplest attack to understand. When a user
    connects to an access point using WPA-PSK, that user goes through what is referred
    to as a four-way handshake. This four-way handshake authenticates the user by
    verifying that he has the correct WPA key. The basic process looks like this:


    +   1. The access point sends the client pseudo-random number (typically referred
    to as a nonce value).


    +   2. The client encrypts the nonce value using the WPA key and sends it back
    to the access point.


    +   3. The access point encrypts the same nonce value using the WPA key and compares
    it to what the client sent. If it matches, then the client has the correct WPA
    key and the access point continues the association process by sending the client
    group key.


    +   4. The client acknowledges the transaction and says “Thank you” to the access
    point.


    # Note


    Because all the clients on a WPA network will be encrypting packets with their
    own unique key, they need a more effective way to send out broadcasts and multicasts.
    Otherwise, the access point would have to copy a broadcast and send directly to
    each client on a wireless network. A complete discussion of the GTK (or Group
    Temporal Key) is beyond the scope of this chapter. You should simply understand
    that it exists and what its basic function is.


    > You should already be familiar with the vulnerability here because it is almost
    identical to the authentication vulnerability in WEP. If an attacker observes
    the unencrypted nonce value sent to the client and can observe the encrypted response
    sent back to the access point, then the attacker has a perfect situation for brute-forcing
    the PSK.


    # Into Action


    Remember that in a brute-force attack, the attacker simply tries all possible
    combinations of characters until the correct key is found. Therefore, the length
    and complexity of the WPA key is extremely important to the security of the network.
    There’s also a specific type of brute-force attack called a dictionary attack,
    which operates similarly, rather than trying every combination of characters,
    an attacker simply tries all the words in a dictionary. These words are typically
    pulled from an existing file referred to as a wordlist or dictionary file. Massive
    collections of wordlists can be found online, in many different languages, and
    even are geared toward specific pop culture lists such as Star Wars and sports
    leagues.


    ![](img/78ecc761d1e6376868e68bf50b83b97a_84_0.png)'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Chapter 3 Theory of Attacks on Wireless Networks 67


    The WPA standard actually includes the SSID as part of the encrypted nonce value,
    which helps protect the handshake from a typical rainbow table attack. Thus, attacker
    would have to have rainbow tables that are specific to every SSID. The encrypted
    nonce would look something like this:


    # WPA Handshake


    ```

    Encrypted Handshake = Algorithm (SSID & Nonce)

    ```


    Figure 3-14 WPA PSK Handshake Value


    Thus, when a client authenticates to the access point, we simply capture the transaction
    and then crack it using the aircrack-ng program. We''ll be covering this in detail
    in the next chapter.


    # WPA Deauthentication Spoofing


    You may be thinking that it might be a little annoying to sit around sniffing
    a network waiting to associate so you can capture the WPA handshake. Well, there
    is a solution, and it''s quite simple. We use a program aireplayng to spoof a
    deauthentication packet to the client, forcing the client to disconnect and reconnect
    to the wireless network.


    Deauthenticating a client can accelerate a WPA-PSK cracking session because you
    don''t have to wait for a client to connect naturally. However, there are additional
    security concerns with this attack. It can also be misused as a denial-of-service
    attack, if someone wants to wreak a little havoc on a wireless network and prevent
    users from being able to connect; the attacker can continuously disconnect anyone
    who attempts to connect. In addition, the attacker could use this tactic in conjunction
    with a social engineering attack and trick users into giving up sensitive information.
    We''ll cover both of these techniques in the next chapter.


    > LINGO

    Rainbow tables are an implementation of the time-memory trade-off technique. In
    a brute-force attack, you are using processing power to actively encrypt many
    values and comparing these to the encrypted value you possess. Instead, you can
    precompute these values and store them in a file; this is the rainbow table. Many
    groups have pooled their computing resources to create extremely rainbow tables.

    Also of special note is the fact rainbow tables are available for some of the
    most common SSIDs; therefore, you should choose an SSID that is guaranteed to
    be unique.'
