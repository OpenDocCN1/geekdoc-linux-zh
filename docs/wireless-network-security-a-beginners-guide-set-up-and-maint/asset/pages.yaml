    A Public Key Infrastructure is not simply the complex math and algorithms behind
    public keys, private keys, and digital certificates; it is actually all of the
    technologies, servers, systems, and human processes that support digital certificates.
    Many times people will incorrectly refer to PKI as the mathematics that make digital
    certificates possible, but this is incorrect and doesn''t paint the entire picture.
    Typically, people are actually referring to Public Key Cryptography, which is
