  md: '# Antennas


    Antennas are an important component of any wireless assessment, and understanding
    how they will help you adjust your thinking about the physical security implications
    for wireless transmissions. The most important fact to keep in mind is that antennas
    increase the range for both sending and receiving data. This means that a laptop
    with an antenna doesn''t just send a stronger signal to the access point, but
    it can actually pick up weaker signals from the access point, increasing the distance
    it can be from that access point.


    So does this matter from a security perspective? Well, it should help you reconsider
    how much importance you place on the range of your access points. It always makes
    me cringe when I hear people say "I don''t really secure my wireless network,
    but it doesn''t matter because the signal dies once you hit the parking lot."
    It''t uncommon to be able to pick up signals a few miles from their source with
    a good antenna.


    Signal increase from antennas is typically measured in dBi, which stands for decibels
    dBi. I won''t bore you with the mathematical calculations before antenna gain
    and dBi. Just know that the higher the number, the better. More consumer-grade
    antennas range from 3dBi to 24dBi. Also keep in mind that the cable that connects
    the antenna to the adapter is too long, kinked, or otherwise designed, you can
    actually lose all the signal gain provided by the antenna. The only major consideration
    you need when selecting an antenna is to make sure the connectors available match
    that of your wireless card.


    # Types of Antennas


    Antennas come in many different shapes and sizes, and some even have a few features
    that help security assessors. The two most important types for the security tester
    are directional and omnidirectional. Directional antennas, also commonly referred
    to as yagi antennas, radiate basically straight forward (and typically slightly
    aside). They are best for "one-to-one" communication, where you can "point" at
    the target. Omnidirectional antennas essentially radiate outward from the horizontal
    plane of the antenna. Take this with a grain of salt, though. In reality, the
    signal radiation pattern looks most like a donut with the antenna sticking up
    through the center of the donut. Mmm, delicious wireless technologies.


    The quintessential wardriver''s antenna is arguably a small, magnetic, omnidirectional
    antenna. It is typically no more than four inches high and includes a pretty strong
    magnet on the bottom, allowing you to stick it to the top of your car. You can
    purchase such an antenna for the Internet for as little as $15.


    The most popular antenna is the directional (or yagi) antenna. The radiation pattern
    is basically straight ahead in the direction you are aiming the antenna, although
    oftimes'
