    # Wireless Client Vulnerabilities


    If we were to lump the vulnerabilities associated with wireless client devices
    into major categories, we might come up with the following list:


    +   - Are the client''s existing communications secure?

    - Can we make the client talk to us?

    - Are there default configurations that we can exploit?


    # Are the Client''s Existing Communications Security?


    If the network communications are not encrypted or are encrypted using a weak
    algorithm, then a vulnerability exists in which an attacker can view the communications
    as they travel through their medium. This goes for wired as well as wireless technologies.
    As we discussed in previous chapters, this vulnerability is only exacerbated by
    wireless


    You''ve already learned in Chapter 4 how to crack a wireless network encrypted
    using WEP. Typically, once the initial layer of protection has been broken (that
    is, WEP), there is very little protection to prevent a client from being completely
    exploited.'
