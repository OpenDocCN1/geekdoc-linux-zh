    # Into Action


    Typically, but not always, NAC will actually use 802.1x on the backend to facilitate
    authentication of the client device. Other NAC options can be agent based, where
    the end station must install client client software to verify settings and allow
    clients onto the network.


    # Network Access Control


    Network Access Control is a terrific technology that operates similarly to 802.1x
    and really expands on the idea of authenticating endpoints they’re allowed to
    use your network. NAC builds on 802.1x by allowing you to examine endpoints and
    make sure they are compliant with certain technical policies configured. These
    technical policies can include verifying that the endpoint has up-to-date antivirus
    software, up-to-date operating system patches or service packs, and even specific
    registry settings and configuration options and many other options.


    In the event a user plugs an unauthorized access point into your network that
    is restricted by NAC, you would have a similar situation to the one previously
    described with 802.1x. A lot of this depends on exactly how you’ve configured
    your NAC policies. For example, some NAC solutions allow you to quarantine unauthenticated
    devices into a restricted VLAN. This restricted VLAN could give these devices
    access to only specific resources, such as the Internet, or nothing at all.


    Now, this isn’t to say that you should go and deploy NAC to combat the risk of
    rogue wireless networks. However, if you already NAC or are considering deploying
    NAC, it’s good to know that it can also mitigate the risk from rogue access points.
    There are many choices for NAC solutions and an insane number of ways to configure
    them.


    > In Actual Practice

    Network Access Protection (NAP) is Microsoft’s answer to NAC competitors. NAP
    operates very similarly to NAC in that it enforces defined policies on endpoint
    systems. However, it currently does not integrate (well) with your network equipment,
    so unfortunately NAP won’t help you to prevent rogue access points.'
