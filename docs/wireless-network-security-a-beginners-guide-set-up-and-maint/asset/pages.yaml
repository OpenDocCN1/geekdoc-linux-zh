  md: '# Guest Users Only


    This may seem a little obvious, but you should understand exactly why only guest
    users should use a guest network. Specifically, you want to prevent internal employees
    from using your guest wireless network. The main reason you don''t want internal
    users on the guest network is because it introduces unnecessary risk. Even when
    the guest network is secured using encryption and you''re authenticating guest
    users, you should consider your guest network a quasi-hostile network.


    If an internal employee connects to a guest network, other users of that guest
    network can now target the client device as well as the network communication
    from that device. As you''ll remember from Chapter 5, we have discussed the many
    ways to attack a wireless client system.


    You may feel confident that any sensitive communications from the client device
    will be encrypted and therefore you have nothing to be concerned about. Even though
    most of the wireless communications for the protocol to be completely compromised,
    which could then become a foothold into your internal network. Even secure protocols
    as SSL can be circumvented or even broken. For a refresher on the attack vectors
    available, refer to Chapter 5.


    In addition, some of the major security systems in place on your internal network
    might not be in place on your guest network. For example, you might force your
    users to use a web proxy on your internal network, not guest users. This would
    allow internal users to access potentially harmful or inappropriate websites while
    on the guest network.


    This is another prime example of why you want not only to ensure that the users
    are in fact authorized to use the guest wireless network, but you also want to
    verify that they are in fact guests, and not internal employees.


    # Encrypting Traffic


    Just because a wireless network is intended to be used by nonemployees does not
    mean that encryption can''t be used. Encrypting the traffic ensures that people
    who aren''t supposed to see the traffic. The fact that potential attackers will
    not be able to inject traffic or manipulate client traffic only helps to make
    the guest network a less hostile network.


    For reasons previously mentioned, using a WPA2-PSK network with a shared key can
    be a very good option for some guest wireless networks. Another great option is
    to create a WPA2-Enterprise network and only allow users of a “guest group” to
    authenticate to the network. The steps would be identical as the ones covered
    in Chapter 8.'
  merge: -1
