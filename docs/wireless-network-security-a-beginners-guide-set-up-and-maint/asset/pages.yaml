  md: '# Wireless Network Security: A Beginner''s Guide


    In Figure 10-6, you can see we''re using an SSH server as our jump station. SSH
    gives us a few advanced options, such as the ability to create a pseudo-VPN tunnel.
    This SSH tunnel would allow the client system the ability to route traffic over
    the encrypted SSH tunnel and be routed directly to systems that the SSH server
    has access. Therefore, you would want to configure your firewall ACLs to restrict
    access from this system to other portions of your network. You should note that
    in the case of SSH tunnels, the source IP would still be that of the SSH server,
    so you would only have one firewall ACL to control access to internal resources.


    Regardless of the system you choose to use as a jump station, make sure it gets
    access to the services and functions which the consultants need access. This can
    be a very tricky task. For example, the RDP server and many SSH servers allow
    users to transfer files by default. Both of these systems give you the ability
    to restrict this functionality, but this is something you need to take into consideration
    when designing your jump station.


    # Virtual Private Networking


    Virtual private networking is definitely a technology that has withstood the test
    of time. Virtual private network (VPNs) create "virtual" secure networks over
    a less secure network by encrypting (and authenticating) the traffic between endpoints.
    The quintessential example for a VPN is a host that needs to communicate with
    another host over the Internet. Because the Internet is considered a public network,
    which can''t be completely trusted, we can set up an encrypted tunnel to secure
    our communication against people who might try to eavesdrop.


    There are basically two modes of operation for a VPN: Network and Host. In Host
    mode, our end station connects to a single host and all communication between
    those two end points is encrypted, as in Figure 10-7. Host A has a VPN that terminates
    directly on Host B.'
