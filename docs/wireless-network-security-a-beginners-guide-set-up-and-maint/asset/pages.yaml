  md: '# Chapter 9 Deploying Secure Wireless Networks 243


    This is a very simple example that could work depending on your environment. Something
    like this makes perfect sense for wireless point of sales or wireless inventory
    systems where handheld devices typically only need to communicate with one backend
    system. But what about more complex wireless networks? Let''s see how our firewall
    configuration might change.


    Let''s take the previous example and add two caveats: that the wireless users
    also need access to the Internet and the internal network is larger than one subnet.
    In this case, because the wireless network is also used for access to internal
    resources, we can''t simply deny access to the internal subnet. In this case,
    you might think that a "permit it any" at the bottom of our access list must do
    the trick, but that would not have the desired effect.


    ```

    The following illustrates an incorrect way of creating an access list:

    access-list WIFI-ACL extended permit tcp 10.0.2.0 255.255.255.host 10.0.0.100
    eq 443

    access-list WIFI-ACL extended permit tcp 10.0.2.0 255.255.255.host 10.0.0.100
    eq 80

    access-list WIFI-ACL extended permit udp 10.0.2.0 255.255.255.host 10.0.0.100
    eq 53

    access-list WIFI-ACL extended permit udp 10.0.2.10 host 10.0.0.90 255.255.255
    eq 1812

    access-list WIFI-ACL extended permit ip any any

    ```


    Instead of allowing access to the Internet, this would allow access to every internal
    resource. To accomplish our goal, we first need to deny access to all internal
    subnets and then allow any other destination subnets. A common way of accomplishing
    this is to deny access to all RFC 1918 addresses and then permit any.


    > LINGO

    RFC 1918 (which stands for Request For Comment 1918) defines "private IP addressing"
    that is not routed over the Internet. You''re probably familiar with the networks
    defined in the RFC. Here they are straight from the RFC:


    ```

    10.0.0.0           10.255.255.255 (10/8 prefix)

    172.16.0.0         172.31.255.255 (172.16/12 prefix)

    192.168.0.0        192.168.255.255 (192.168/16 prefix)

    ```


    For good bedtime reading, check out the RFC at http://tools.ietf.org/html/rfc1918.'
