    ```


    | KB | depth | byte(vote) | | | | |

    |---|---|---|---|---|---||}{

    | 0 | 2/8 | 12 (26880) | F6 (26624) | 2E (26368) | 97 (26368) | D3 (26368) |

    | 1 | 2/3 | 34 (26628) | 9F (25856) | 07 (25344) | 43 (25344) | 01 (25858) |

