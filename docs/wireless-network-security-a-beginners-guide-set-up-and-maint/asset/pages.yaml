    # DNS Spoofing


    One of the simplest ways for an attacker to control what a user sees is to redirect
    the user

    to a system of her choosing using the Domain Name System (DNS). Let''s look at
    the

    normal operation of a DNS lookup. If the client wishes to view a remote website
    (let''s call

    www.securewebsite.com), she''ll enter the website in her web browser. Her system
    will

    first query the configured DNS server to find the IP address associated with this
    server.

    The DNS server will send a very simple DNS response indicating the IP address
    of the

    host www.securewebsite.com. Unfortunately, there is no true authentication

    to verify that this reply comes from the DNS server. The system will then send
    its HTTP

    request to the IP address returned. This process is shown in Figure 5-10.


    The attacker in his position of power has a few choices. The simplest way is to
    respond

    to the DNS query (spoofing the secure IP address to that of the DNS server) and
    claim

    that the securewebsite.com IP address is that of his machine hosting the malicious
    website

    as in Figure 5-11. The response from the attacker may be only a few hundred milliseconds

    faster than the legitimate response from the real DNS server, but that''s more
    than enough

    time for the attack to succeed.


    ![](img/78ecc761d1e6376868e68bf50b83b97a_137_0.png)


    +   1 Client asks server:What is thenIP address for www.securewebsite.com?

    Normal DNS Operation


    +   2 Server replies:IP address is

    192.168.1.100 for host www.securewebsite.com.


    Figure 5-10 Normal DNS request and response'
