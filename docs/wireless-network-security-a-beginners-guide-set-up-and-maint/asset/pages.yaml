    # ## Principle 5: Security Is Not Just Keeping the Bad Guys Out


    Security is not just about keeping the bad guys out. An extremely common misconception
    is that the primary concern for security administrators is keeping malicious outsiders
    from accessing critical systems. Of course, this is a vital component to a comprehensive
    security plan; however, it is far from being the only concern. The problem with
    adopting a “keep the bad guys out” mentality is the development of the so-called
    “candy” network, with a hard outer shell and a delicious goey center. We''ll address
    this topic in more detail.


    You may hear many reports stating that the majority of security breaches come
    from internal personnel. Now, although I agree with this statement, a little speculation
    might help to clarify what it is meant by. Here are the key points:


    +   - How do you define a security compromise? For example, an internal IT administrator
    misusing his administrative privileges and reading private e-mails seems like
    a pretty obvious security compromise. However, what about the user who has too
    many files on a single share and an accidental click of a button deletes all the
    files on that share? I would define the latter as a security compromise, but maybe
    be the person writing the incident reports not.

    - How do you define the actual root cause? As an example, what happens when an
    end user infects her personal laptop at home and then brings laptop into the office,
    infecting other business workstations. Would the root cause of this compromise
    be attributed to the malicious user or the uneducated employee who unwittingly
    brought an infected machine into the corporate environment? I''ll leave it up
    to you to decide for yourself.'
