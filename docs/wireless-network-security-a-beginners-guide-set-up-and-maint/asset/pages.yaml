    # Troubleshooting PEAP Authentication


    Unfortunately, there may come a time when you have to troubleshoot a client''s
    access to your wireless network. From my experience, problems with authenticating
    to your wireless network are rarely an issue with the client. It''s typically
    an issue with the backends systems, including the RADIUS communications between
    the wireless access point and the server or an issue with the configuration of
    the NPS itself.


    That doesn''t mean you shouldn''t start with the most basic and simple troubleshooting
    steps you can. For example, you want to make sure that you''re typing the password'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# 232 Wireless Network Security: A Beginner''s Guide


    correctly when using WPA-PSK or that you''re typing your credentials correctly
    when authenticating to a WPA-Enterprise network. Typically, the debugging information
    you''ll get on a client device is very limited and extremely generic (which makes
    it not terribly helpful). Not only is the logging information not usually helpful,
    but the client device''s actions can be misleading.


    For example, let''s suppose that on more than one occasion you are troubleshooting
    authentication failures to a WPA-Enterprise network, the RADIUS server denies
    access to the client (logging a failure event "obtaining an IP address."). Typically,
    the client would only show "obtaining an IP address" message after authentication
    has succeeded. After about 15 seconds, the client times out and shows "not connected"
    to the wireless network. This can lead you down the wrong path in troubleshooting,
    making you think it might be an issue with your DHCP server. Instead, the resolution
    is to grant the client access to authenticate to the RADIUS server.


    # Troubleshooting RADIUS Authentication


    The best place to troubleshoot RADIUS authentication issues is on the RADIUS server
    itself. You can view the events logged for the RADIUS server by opening Event
    Manager, expanding Roles, and clicking the main "Network Policy and Access Services"
    node. In the middle portion of the screen, you''ll see the events logged for this
    service. You can also view the same events by opening Event Viewer (click Start,
    eventvwr, and hit ENTER). Now browse to Custom Views | Server Roles | Network
    Policy and Access Services. Looking at the events through the event viewer can
    be a little more helpful because you have a bit more room to view the events list.


    We''ll look at a few common scenarios you''ll see when working with the RADIUS
    server.


    # Bad RADIUS Authenticator


    In Figure 9-16, you can see an example of an error on the RADIUS server. This
    error indicates that an account points is trying to authenticate to the RADIUS
    server, but the RADIUS server does not have that device listed as a valid client.
    The solution is simple: Just add the client under Server Manager | Roles | Network
    Policy and Access Services | NPS (Local) | RADIUS Clients and Servers | RADIUS
    Clients. Right-click RADIUS Clients and choose New.


    In addition, you should ensure that the RADIUS shared secret is on the client
    and server match.'
