    SSL VPNs also have the advantage of portal-style VPNs. With an SSL VPN appliance,
    you can actually create a portal that operates very similar to a typical secure
    website. Once logged into the portal, users can access other systems and applications
    by clicking links in the portal. This portal needs to be configured by an administrator,
    but it adds another method by which users can easily access the systems they need.


    Secure Shell, which is typically used to secure manage Unix and Linux systems
    (and more recently networking appliances), is another great option for creating
    a VPN. Many people are familiar with SSH for secure administration but might not
    know how versatile it can be. Using standard SSH clients and servers, you can
    create Host and Network VPNs, although it''s much more common to see Host VPNs
    if SSH is used.


    Internet Protocol Security Extensions (IPsec) extends TCP/IP to encryption and
    authentication of IP packets. The main advantage of using IPsec over other technologies
    is its ubiquity. IPsec has long been the VPN technology. Many existing products
    such as routers and firewalls have added VPN functionality so with the IPsec protocol.
    The main disadvantage of using IPsec is that it requires more configuration and
    a better understanding of the underlying protocol when compared to SSL or SSH.
    IPsec can terminate Host and Network VPNs. A complete coverage of IPsec and its
    configuration options are beyond the scope of this book.


    > LINGO When configuring IPsec, the terms Transport mode and Tunnel mode are typically
    used to describe Host VPNs and Network VPNs, respectively. There are subtle nuances
    with the terms Transport and Tunnel.


    Point-to-Point Tunneling Protocol (PPTP) is another great option for creating
    VPNs. Most versions of Windows natively support PPTP; therefore, PPTP has seen
    heavy deployment in Windows environments. PPTP operates similarly to IPsec but
    is typically used for Host-to-Network VPNs.


