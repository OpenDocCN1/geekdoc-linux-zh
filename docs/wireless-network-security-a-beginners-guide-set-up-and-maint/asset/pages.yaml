    # Principle 6: ROI Doesn''t Work for Security


    The traditional calculation of return on investment (ROI) doesn''t work for expenditures
    for security. At a very basic level, the calculation for return on investment
    determines how much profit will be produced if you X amount of money (or resources)
    into something. Using the ROI model, you can compare multiple investments and
    determine which is appropriate. Therefore, spending money on security cannot be
    justified with ROI, because it''s not a revenue-generating business process. Instead,
    you''re spending money (and resources) to protect a greater amount of money (or
    resources) from being lost. Also keep in mind the qualitative risks, such as reputation,
    image, and the long-term effects of damage to this.


    # Principle 7: Defense In Depth


    You can improve security via Defense In Depth. True security does not come from
    risk-mitigating control; instead, it comes from the implementation of many synergistic
    solutions. One of the most basic examples of this is when we''re all very familiar
    with a bank. Banks don''t just rely on a big vault to keep all their assets safe;
    they also employ armed guards, cameras, door locks, fences, educated employees,
    alarm systems, and so on. This is the essence of Defense In Depth and the foundation
    for a more secure environment.


    # Principle 8: Least Privilege


    You can improve security with Least Privilege. One of the most important and often
    overlooked methods for configuring security devices and implementing policies
    is that of Least Privilege. Least Privilege means giving users the bare minimum
    rights they need to perform their duties and giving them additional privileges
    as necessary. The opposite way (the most common) is to give the most amount of
    privileges and then remove “dangerous” privileges one by one. This can also be
    referred to as blacklisting versus whitelisting.'
