    # Due Diligence


    So do we sum up all our efforts? We must perform diligence at all times to ensure
    we''re not exposing our networks to unnecessary risks. As we discussed in Chapter
    1, securing your network does not just mean keeping unauthorized users out, but
    also preventing internal users from doing things they shouldn''t.


    # Confidentiality Integrity Availability (CIA)


    We discussed the CIA triad in the first chapter, and applying the triad to any
    secure implementation is key—wireless networks being no exception. Remember, you
    want to ensure the *confidentiality* of your users'' data, meaning only authorized
    users are able to view it. You want to ensure the *integrity* of the data, meaning
    there haven''t been any unauthorized changes or manipulations of the data. Lastly,
    you want to ensure the data is available to the users who need access to it when
    they need access to it.


    The core technologies to meet the goals of confidentiality and integrity are authentication
    and encryption. The 802.11 protocols contain options available that are integrated
    right into the standard. WEP includes methods for both authentication and encryption.
    (Although you have to *never use WEP*, right?) Likewise, WPA and WPA2 (802.11i)
    include methods for both authentication and encryption.


    Ultimately, the best advice I can give you is to use technologies that have existed
    for some time and are still considered secure. Remember, that security is not
    static; it''s ever-changing and very dynamic. What''s secure today could be insecure
    tomorrow.


    # Encryption


    The native encryption methods in WPA are TKIP and CCMP, which is based on AES.
    For a complete refresher, see the section “How WPA Works” in Chapter 3. Remember
    as of today, some weaknesses are being revealed for some WPA TKIP implementations.
    Therefore, when deploying WPA, you should choose CCMP as your encryption method
    of choice.


    Other options are available as well. Just because WPA only supports two encryption
    methods doesn''t mean you''re restricted to those. You can still use existing
    VPN technologies such as IPSec and SSL VPNs. We''ll cover the integration options
    for them in a future chapter.'
