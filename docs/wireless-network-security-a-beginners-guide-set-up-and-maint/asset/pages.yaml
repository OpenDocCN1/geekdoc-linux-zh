    # Installing Software on BackTrack


    BackTrack is based on the Debian distribution of Linux, which means the core system
    for installing software is the apt group of tools. It couldn''t be easier to install
    software on a Debian-based operating system. You can search for a program, and
    once you''ve identified the name of the package, you simply run the apt program,
    which automatically downloads the program, along with any necessary files from
    a list of defined (approved) servers, and installs it on your system.


    Using apt, you can upgrade your entire operating system automatically. This is
    sort of like typing one command and having your Windows XP computer upgraded to
    Windows 7 over the Internet! Pretty slick, if you ask. Most of the tools and programs
    mentioned in this actually come preinstalled on BackTrack, making it the perfect
    distribution for our needs. However, let''s look at a simple example of installing
    pidgin, a popular multiprotocol chat client.


    The first thing we must do is make sure the list of software available for us
    to download is up to date. To do this, we run the apt-get command with the update
    argument, as shown here:


    ```

    root@root:~# apt-get update

    ```


    For apt to be update all of its indices, you need to be connected to the Internet.
    You''ll see a line of output; don''t worry about what each line individually says.
    At the end of the output, you''ll likely see a line similar to the following:


    ```

    W: Some index files failed to download, they have been ignored, or old ones used
    instead.

    ```


    This is completely normal; it means that some of the servers in our list might
    be unreachable at this time. Next, we search for the name of the program we wish
    to install using apt-cache search. In this case, we know the name of the program,
    so we run the following command:


    ```

    root@root:~# apt-cache search pidgin

    ```'
