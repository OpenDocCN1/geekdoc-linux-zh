    # Introduction to WPA2-Enterprise with Digital Certificates


    Before we dive into this chapter, let''s cover the reasons why we would choose
    to deploy a WPA2-Enterprise network using digital certificates over other options.
    By using digital certificates, we get the following benefits:


    +   - Digital certificates provide stronger authentication.


    +   - Digital certificates are typically harder to compromise (or steal).


    +   - The computer and the user can authenticate without any user action.


    Digital certificates are considered to provide much stronger authentication than
    traditional passwords. Because a digital certificate is an actual file, it''s
    typically harder to compromise a traditional password. Whereas a password might
    be written down in an insecure location, spoken aloud, or just chosen poorly,
    a certificate does not have these problems.


    Both the user and the computer can authenticate to the wireless network without
    any interaction from the person at the keyboard. You''re probably familiar with
    cached credentials for Windows systems. Using cached credentials, users can authenticate
    directly to a system that they''ve authenticated to the past without having network
    access to query Active Directory. This is a common scenario for wireless networks.
    If you have to wait for a user to log into a system before he can authenticate
    to the wireless network using those same credentials, then what do you do if the
    user hasn''t logged into this particular system before?'
