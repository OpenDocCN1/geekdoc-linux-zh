  md: '# Chapter 5 Attacking Wireless Clients 115


    Configuring the DHCP server on Linux is extremely easy. The default file location
    you should use is /etc/dhcpd.conf. It''s just a simple text file that you can
    save anywhere and then point the DHCP daemon at the file. Here''s a sample configuration:


    ```

    ddns-update-style ad-hoc;

    default-lease-time 1200;

    max-lease-time 7200;


    ubnet 10.0.0.0 255.255.255.0 {

    option subnet-mask 255.255.255.0;

    option broadcast-address 10.0.0.255;

    option routers 10.0.0.1;

    option domain-name-servers 4.2.2.2;

    range 10.0.0.100 10.0.0.200;

    }

    ```


    All of the configuration for the DHCP server should be self-explanatory. Just
    be sure to assign the "option routers" IP address to the IP address of your laptop''s
    interface. Then, to start the DHCP daemon, simply run the following command:


    ```

    #dhcp3 -cf /etc/dhcpd.conf at0

    ```


    +   - cf points to the configuration file we created.

    - at0 is the interface created by airbase-ng.


    **Step 4.** Configure an IPTables firewall to pass traffic through your laptop
    and send on to your hardwired connection.


    Now, IPTables is a beast in itself, and entire books have been written on it.
    We won''t go into much detail here. Just understand that the first iptables --flush
    command actually removes any existing rules. So, for any reason you''re doing
    this on a system that already has firewall rules set up, you might want to back
    up the rules first.


    # Into Action


    Depending on your Linux distribution, the dhcpd command may be slightly different.
    The package you''ll most likely want to install is dhcp3-server.'
