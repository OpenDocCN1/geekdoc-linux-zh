  md: '# Chapter 4 Attacking Wireless Networks 79


    Kismet uses a client/server model in which you can configure several Kismet “drones”
    to forward information to the Kismet server. The Kismet server will see these
    drones as independent capture sources and can be configured independently. More
    on this in a later chapter.


    Navigating within Kismet using your keyboard is easy, and I would recommend getting
    used to not using your mouse. You will find that you can actually move around
    the interface quickly using your keyboard. For most basic operations, you’ll need
    to use the keys detailed in the following table:


    | Key | Usage |

    | --- | --- |

    | ESC or ~ | Access the main menu |

    | Arrow keys | Navigate the menus |

    | ENTER or SPACEBAR | Select highlighted item |

    | TAB | Scroll between choices |


    Kismet is a snap to install and comes preloaded on BackTrack. Simply open a terminal
    as the root user and use **kismet** at the command line. If you start Kismet as
    the root user, you’ll see a message similar to the one in Figure 4-2. It is simply
    telling you that you Kismet as a regular user; however, you’ll need root privileges
    to start the Kismet server.


    Next, you’ll see the prompt in Figure 4-3. This is telling you that the server
    isn’t running (remember that Kismet has both a client and a server) and asks if
    you’d to start the server.


    Following that, you will be prompted for any startup options, as seen in Figure
    4-4. You’ll also have the option of disabling the default logging here setting
    up a prefix for the log files generated. All of the default settings are good,
    so select Start to continue.


    ![](img/78ecc761d1e6376868e68bf50b83b97a_97_0.png)


    Figure 4-2 Kismet root privileges warning'
