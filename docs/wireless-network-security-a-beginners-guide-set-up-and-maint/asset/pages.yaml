  md: '# Securing Your Wireless Network


    Securing your wireless network further than the measures provided by the 802.11i
    standard is a critical step. We''ll take some of the concepts you learned in Chapter
    6 and show examples of them here. Remember that whether you''re dealing with one
    access point or 100 access points, the core concepts remain the same. There are
    some additional concerns as well as added benefits of having more access points,
    which we''ll discuss shortly.


    # Segmenting Wireless Networks


    Remember from Chapter 6 that you should design your wireless networks with the
    concept of Least Privilege. This means that no two wireless networks will be exactly
    the same, because the requirements of your wireless network will be unique to
    your network.


    You can apply the concept of Least Privilege in a few places for your wireless
    network, including the following:


    +   * Restrictions on which users can access the wireless network

    * Restrictions on the time users are allowed to access the wireless network

    * Restrictions on destination IP subnets

    * Restrictions on destination TCP ports


    # Restricting Users


    Creating restrictions on whom users are allowed to access the wireless network
    is a relatively easy task, but is often overlooked. Typically, organizations just
    assume that everyone in the company should have access to log onto the wireless
    network. Even small companies with just a few users can benefit from allowing
    the necessary users access to the wireless network. If you treat every account
    as another potential for compromise, you can''t go wrong.


    Restricting the users who can authenticate to your wireless network is a relatively
    easy task. Remember from Figure 9-9 that we configured the group WirelessUsers
    to be granted access to the wireless network. Make sure you follow a similar system
    and only add members to this group who need access to the wireless network. Don''t
    make the mistake of either configuring the policy to allow access to the Domain
    Users or adding everyone in your organization to the WirelessUsers group.


    You should also understand that using WPA2-Enterprise provides better restrictions
    than WPA-PSK. You may be thinking that with WPA2-PSK you can accomplish the'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Chapter 9 Deploying Secure Wireless Networks 237


    same thing by giving the preshared key to the users you choose. Although this
    is true, remember that you don''t receive any accounting information. There''s
    no way for you to natively distinguish one user from the other. Therefore, if
    you need to deny access to a single user, you''d have to change the PSK and redistribute
    it to all users except the one user, as opposed to removing that user from a group
    in Active Directory with WPA2-Enterprise. Also, remember that if you choose to
    allow your users to enter the PSK themselves, they do not typically treat the
    PSK as sensitively as their own credentials.


    # Restricting Time


    Restricting the time of day that users are allowed to access your wireless network
    is another great way to add a layer of security to your wireless network. In certain
    cases this could be very difficult to administer, any level of restriction on
    time can be a benefit. Start with the obvious times, you can deny and work from
    there. For example, do you ever anyone using the wireless network over the weekend?
    If not, deny access over the weekends. Do you ever have anyone using the wireless
    network between 9 P.M. and 6 A.M. during the week? If not, deny access at those
    times.


    Also, keep in mind that if you have users who absolutely require access at these
    unusual times, you could create two separate Network Policies within your RADIUS
    configuration. The first policy could apply to the majority of your users and
    only give them access to the wireless network during normal business hours, whereas
    the second policy could grant access to the wireless network only to a subset
    of users during nonbusiness hours.


    To configure time and date restrictions, open Server Manager. Navigate to Roles
    | Network Policy and Access Services | NPS (Local) | Policies | Network Policies.
    You should see the Secure Wireless Connections we created earlier; right-click
    this policy and choose Properties. Click the Constraints tab and choose Day and
    Time Restrictions. Check the box "Allow access only on these days and at these
    times" and then Edit to select the times. Choose OK and then OK to close both
    windows.


    As you see in Figure 9-20, you can get very granular in your restrictions. Notice
    all the white boxes? Those are times when an attacker will be wasting his time
    trying to authenticate to the wireless network.


    # Restricting Network Subnets and TCP Ports


    Restricting the network flows of wireless users is a relatively simple task, and
    yet so few organizations actually do it. Designing and configuring firewall access
    lists has become such a common task that you should have no problem with it.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# 238 Wireless Network Security: A Beginner''s Guide


    ![](img/78ecc761d1e6376868e68bf50b83b97a_256_0.png)


    Figure 9-20 Controlling access times with Network Policy


    A quick introduction to the Cisco access list syntax will help you to follow along.
    Here is the basic syntax for an access list entry:


    ```

    access-list name extended action protocol source destination eq port

    ```


    | Syntax | Description |

    | --- | --- |

    | name | The name of the access list. |

    | extended | A keyword to designate which type of access list we''re creating.
    You have more options available to you when configuring an extended access list,
    so all of examples here will use an extended access list. |

    | action | The action is either permit or deny to define whether we allow or drop
    the traffic matching this access list entry. |'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Chapter 9 Deploying Secure Wireless Networks 239


    | Syntax | Description |

    |---|---|

    | protocol | The protocol can be IP, TCP, or UDP. If you choose IP, you only specify
    the source and destination host or subnet. If you choose TCP or UDP, you can also
    define a TCP or UDP port to filter on. |

    | source | The source host or subnet. If the source is a host, you can use the
    host keyword followed by the IP address. If the source is a network, you specify
    the subnet followed by the subnet mask. |

    | destination | The destination host or subnet. If the destination is a host,
    you can use the host keyword followed by the IP address. If the destination is
    a network, you specify the subnet followed by the subnet mask. |

    | eq | A keyword that stands for "equals." It allows you to define the destination
    TCP or UDP port. |

    | port | The destination TCP or UDP port.


    Here''s an example:


    ```

    access-list MY-ACL extended permit tcp host 10.0.0.10 192.168.0.0 255.255.255.0
    eq 80

    ```


    In this example, we created an access list called MY-ACL. We''re permitting any
    TCP traffic from the host with an IP address 10.0.0.10 destined for the 192.168.0.0/24
    subnet with a destination TCP port of 80 (HTTP).

    Here''s another example:


    ```

    access-list NEW-ACL extended deny ip 192.168.0.0 255.255.255.0 host 10.0.0.10

    ```


    In this example, we created an access list called NEW-ACL. This access list is
    only looking at the IP address, so we don''t define any TCP or UDP ports. In this
    case, we''re blocking packets from 192.168.0.0/16 to the 10.0.0.0.

    In addition, you can use the "any" keyword for most arguments, including source,
    destination, and port, to match, well, anything.

    Let''s start with an extreme example and move on from there. Let''s assume we
    created a wireless network for our internal users and the only thing they ever
    need access to is a single web application living on an internal server with an
    IP address 10.0.0.10. The architecture is shown in Figure 9-21.

    In this example, you can see that the server exists on the same network as other
    internal systems. Rather than giving users of the wireless network access to the
