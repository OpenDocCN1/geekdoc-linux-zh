    # Useless Defenses


    Let''s take this opportunity to discuss technologies I consider to be useless
    defenses. Unfortunately, some of these techniques have seen widespread use, which
    has always puzzled me. We''ll look at the pros and cons of each of these techniques
    and ask the question, Does this actually make us secure?


    # Faraday Cage


    At the most basic level, you can think of a Faraday cage as a system for confining
    the physical propagation of wireless signals. In the real world, this is accomplished
    by putting up wireless mesh around a building or area so that wireless signals
    from the outside can''t get in and wireless signals from the inside can''t get
    out. From a security perspective, this doesn''t cut it for me. As you''ve seen
    in previous examples, highgain antennas can be used to pick up very weak wireless
    signals. Also, the use of signallimiting systems seems to give people a false
    sense of security. Typically, this can be a relatively costly endeavor for anything
    but the smallest areas for security that is easily compromised.'
