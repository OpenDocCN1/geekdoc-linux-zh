  md: '# Access Points


    Access points are a vital component of any scalable wireless network. An access
    point essentially connects two dissimilar technologies, and a wireless access
    point represents the physical device that is the liaison between wireless communications
    and wired communications. It is worth noting that back-end communication does
    not necessarily have to be wired communication. For example, some cellular providers
    have started offering access points with built-in cellular network to connect
    to their cellular network. In this case, you would still connect to the access
    point but the access point itself would not need a wired connection.


    Access points became a very long way since their introduction. Many features (some
    existing and new) have been added to access points. For example, captive web portals
    have existed for a long time before wireless networks became popular but they''ve
    been implemented in many access points. We will not discuss every feature available,
    but from a security perspective all this comes with its inherent risks. For example,
    whereas you could only configure an access point from a web interface or a limited
    command line, now you have an almost full-fledged command line with network tools.
    Thus, tools such as Ping, Telnet, SSH, and Traceroute make appealing for an attacker
    to leverage their position and infiltrate deeper into a network. Also keep in
    mind that with added complexity comes a greater chance to misconfigure an access
    point. More knowledge is required to securely configure an access point with more
    features. We''ll go over this in more detail in Chapter 6.


    # Autonomous vs. Controller Based


    Originally, access points were configured one at a time; such access points are
    referred to as autonomous access points because they function as singular units.
    Obviously, large-scale deployments require too much time. Management systems were
    first introduced to solve this problem, and now we have controller-based systems
    that make configuration even easier.


    A management system would typically be installed on a server (or desktop) and
    simply interact with existing management protocols, allowing administrators to
    automate some of the more mundane tasks. Existing management protocols include
    tools such as Telnet, SSH, and SNMP. An administrator could, for example, create
    a template profile with a specified SSID, encryption method, and authentication
    method and apply this template to an access point.'
