    Here are few examples of quantitative impacts:


    +   - The impact of getting struck by a car ranges from "getting injured" to "death."

    - The impact of getting your car a flat tire is the cost of the replacement tire.

    - The impact of getting your phone stolen is the cost of a replacement phone.


    And here are a few examples of qualitative impacts:


    +   - The impact of getting struck by a car would be physical and emotional pain
