    # # Basic Networking Configuration


    Linux is an extremely network-centric operating system. It is great news for you,
    given that you''re reading a book on networking! Numerous built-in commands and
    default programs are installed to perform a myriad of networking tasks, including
    the ability to script every network configuration you can think of.


    Some of the command-line tools you''re used to using on Windows exist on Linux,
    and most of them include enhancements that provide additional functionality or
    even make them operate better or faster than their Windows counters. Commands
    as ping, nslookup, and telnet operate almost the same as the Windows versions.


    We can''t go over all the networking commands and all the available arguments
    and their uses; however, the following table provides a good list to get started.
    Be sure to play with each of the commands; if you need help, remember the skills
    you learned earlier getting help.


    | Command | Description |

    | --- | --- |

    | ifconfig | Network interface configuration |

    | ping | Basic ICMP echo request |

    | tracer | Traces the network path to a remote host |

    | telnet | Telnet client |

    | ssh | Full-featured SSH client |

    | nc | Netcat network Swiss army knife |

    | wget | Fetches files via HTTP and FTP |

    | nslookup | DNS resolution program |'
