    # Understanding the Linux Shell


    In Windows, you''re used to running cmd.exe if you want to use command-line tools.
    In Linux, you actually have a few options for command-line interfaces. At the
    most basic level, shells are nearly the same. The only time you see a real difference
    is when you are creating shortcuts for different shells. We''ll cover scripting
    in depth shortly.


    The most popular shell is the Bourne Again Shell, or bash. This is a play on words
    on the A Shell, or ash. Each shell has built-in commands; for example, cd (short
    for directory) is built into the shell rather than an external binary program.


    # Running Commands


    Running a command from a shell is extremely easy—just type the command. You need
    to be aware of the PATH variable, which tells the shell which folders to look
    in for the programs you''re trying to run. In the bash shell, your path is configured
    with the PATH variable.


    The most basic commands to move around the file system are the same as they are
    in Windows, as shown in the following table. You use cd to change to a directory,
    and use dir to list the contents of your current directory. However, you should
    get used to the ls command, which stands for list. The ls is basically the Linux
    version of dir. Many systems have a command alias configured so that when a user
    uses the dir command, the ls command is actually run.


    | Command | Description |

    |---|---|

    | cd | Used to change directory (for example, cd /home/). |

    | ls | Used to list contents of directory (for example, ls /home/). |

    | cat | Used to concatenate files or output file contents (for example, cat file.txt).
    |

    |딨 | Used to show location of binary or file (for example, whereis). |

    | pwd | Present Working Directory. Used to show the current directory (for example,
    pwd). |

    | alias | Used to create a command alias (for example, alias="ls -l --color").
    |

    | grep | Used to search for lines matching a specified pattern. |


    The alias command is probably one of the most useful, yet underutilized tools
    on a Linux system. The alias command is built right into the shell and allows
    you to create a sort of shortcut command. When start exploring Linux and use it
    more often, you''ll see that you type the same commands with the same arguments
    often. Wouldn''t it be nice if you could type fewer characters and have the same
    action performed? With the alias command, you can do exactly that!'
