  md: '# Chapter 2 Wireless Tools and Gadgets 35


    # # Operating System of Choice


    It might not be surprising that my operating system of choice for security assessments
    is Linux; however, many tools can be run from Windows. Additionally, many open-source
    tools can be run from the Mac OS, including some tools that are exclusive to the
    Mac OS.


    Most of the examples in this book use Linux, so it is highly recommended that
    you familiarize yourself with it. For readers who have zero experience the Linux
    operating system, free it: Now is the perfect time to get some time with the best
    operating system available today.


    For beginners I recommend Ubuntu or BackTrack. Ubuntu is a all-purpose desktop
    operating system and comes with a decent list of preset software packages installed
    for everyday use. BackTrack is a great choice for security enthusiasts and penetration
    testers. The makers of the BackTrack distribution describe it as "the penetration
    testing arsenal for security professionals."It comes with an enormous list of
    security tools, including most of the wireless tools we''ll be covering in this
    book.


    Both Ubuntu and BackTrack can be run as live-CD distributions. This means that
    the operating system actually launches right from the CD. You can save and manipulate
    files on your hard drive, but you also have the option of leaving your hard drive
    alone. When you are testing the operating system, you simply reboot your system,
    remove the CD from your drive, and you''ll boot back into your normal operating
    system. The only real disadvantage of using a live-boot operating system is that
    it tends to be a little slower, and any changes you won''t be maintained during
    reboots, unless specifically saved to external media (hard drive, USB drive, and
    so on).


    One of the features that newcomers really enjoy is the apt utilities. Essentially,
    centralized databases are maintained on the Internet that keep a list of all the
    files (and typically default configurations) for an enormous amount of programs
    for the Linux operating system. Users can search this database using locally installed
    apt utilities for a program they wish to install, issue a command to "install"
    the program, and the program and all its supporting libraries are "automagically"
    downloaded and installed on the system. If you''re unfamiliar with Linux, now
    might be a good time to read the appendix of using BackTrack Linux.


    Getting BackTrack running on your system is incredibly easy; just follow these
    steps:


    +   1. Grab the latest release of BackTrack from www.backtrack-linux.org/downloads/

    2. Burn the ISO image using a DVD-burning program.'
