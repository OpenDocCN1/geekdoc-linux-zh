  md: '# Phases of Wireless Deployment


    At each phase of a wireless network''s life, you have an opportunity to integrate
    or reintroduce security into the thought process. Let''s take a look at the nuances
    of security at each phase, including new deployments, existing wireless networks,
    and wireless refresh projects.


    # New Deployments


    When deploying a new wireless network, you are in a unique position to do things
    correctly from the start. Trying to secure a wireless network after you''ve deployed
    it is never as easy as just doing it from the start. Whether you''re tasked with
    designing the installation, deploying the wireless network, managing and maintaining
    the installation, or securing it, you need to voice your concerns from the beginning.


    During the initial predeployment discussions, it is imperative to decide if a
    wireless network is in fact the best solution for your organization, and security
    should be at the forefront of this discussion. Wireless networking presents some
    unique security challenges for organizations that now should be fully aware of.
    Oftimes, decision makers will just assume that “need” a wireless network, if for
    no other reason than the fact that they''re ubiquitous.


    I''ve had discussions with clients who wanted to deploy guest wireless services
    simply because “everyone else” offered them, which leads me to my first point
    on the best way to secure your wireless networks. To not use them! I know what
    you''re thinking—that''s kind of an odd recommendation for a book that should
    be teaching how to secure your wireless networks, right? We''ll dive into the
    nifty-gritty of securing your wireless networks soon, but first I want you to
    ponder whether or not you need wireless networking capabilities in your organization
    and whether that need outweighs the risks. Even if you decide wireless networking
    is the right option, make sure you''re not using it gratuitously. Keep it confined
    to the business needs that are necessary.


    If you dont need wireless, don''t use it!


    # Into Action


    With many organizations racing to deploy wireless networks simply because they''re
    so ubiquitous, the classic question from the quintessential nagging mother comes
    to mind: “If all your friends were jumping off a bridge, would you do it, too?”
    So let me be the voice of your mother for a minute. Just because other businesses
    are jumping on the bandwagon and deploying wireless networks does not mean you
    have to do the same. Let them suffer the consequences of unnecessary wireless
    networks.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Chapter 6 Theory of Defense for Securing Wireless Networks 133


    # Existing Wireless Networks


    Many existing wireless networks out there need to be secured. Maybe you''ve just
    joined a new organization and been handed the joyful task of assessing the current
    wireless network and providing recommendations for securing it. Or maybe''ve managed
    the wireless network since its inception and are now aware of security vulnerabilities
    that need to be mitigated.


    One of the biggest headaches you might face will be convincing the people who
    hold the checkbox to create a new budget for something that has operated without
    issue. Many people have the mentality "If it ain''t broke, don''t fix it," and
    consider expenditures akin to throwing dollars into a black hole. Therefore, it
    is your job to show the severity of not securing your wireless network.


    > IMHO


    > Is security really a black hole? Absolutely! Well, sort of. Let me explain.
    Remember that we discussed in Chapter 1 that the calculation of return on investment
    simply doesn''t work for security. You''re spending money (resources, time, and
    more) to protect other assets, or revenue-generating components of your business.
    So you''re asking someone to spend money to secure something that has not caused
    a security incident to date, but could end up being the source of a security incident
    in the future.


    > In my experience, it''s better to agree with someone and then adjust to your
    way of thinking than to contradict them from the start. When a budget tells you,
    "We can''t give you to secure a wireless network that has been working fine for
    a while." You say,"Yes, Mr, I completely understand why you feel that. I feel
    the same way, too. However, we''re not spending this money to improve our network.
    Instead, we''re using it to protect our assets and our image. If we don''t spend
    this money to secure our network, it will cost us for ever in the event of a compromise.


    How do you go about convincing people to spend money on securing a wireless network
    if they''re opposed to it? One way that works well is to have a wireless penetration
    test performed by an external company. There are many nuances in both performing
    a penetration test and hiring a company to perform a penetration test for you,
    but it can prove an invaluable tool for demonstrating real, tangible risk and
    thus obtaining buy-in from executives to fund your security initiatives.


    From the budget maker''s perspective, it can be a bit more moving to see a report
    from an external company detailing how they were able to access confidential data
    via the company''s wireless network in a short period of time than it is to hear
    the security administrator "cry wolf" over potential risks.'
