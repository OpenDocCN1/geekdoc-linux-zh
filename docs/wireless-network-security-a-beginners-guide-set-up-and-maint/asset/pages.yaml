    # Basic Linux Commands


    Historically, people think of Linux as being a somewhat difficult operating system
    to use, partly because it''s line centric. In the past it was true that the graphical
    environments weren''t half as intuitive as they are today; however, more of the
    power of Linux comes from the fact that you can perform any task right from the
    command line. This also means that every task is also scriptable, making common
    tasks much, much faster.


    Let''s discuss some of the most basic tasks you''ll have to perform in Linux:


    +   * Understanding the Linux shell

    * Running commands

    * Getting help

    * Navigating Linux file system

    * Installing software on BackTrack

    * Basic user administration

    * Basic networking configuration

    * Understanding file permissions

    * Basic scripting'
