    # Assymmetric Encryption Algorithms


    ![](img/78ecc761d1e6376868e68bf50b83b97a_185_0.png)


    **Figure 7-3** Asymmetric encryption algorithm


    > Note

    Any discussion of Public Key Cryptography should mention that the security and
    math behind it is based on extremely large prime numbers.


    In an asymmetric encryption algorithm, one key is used to encrypt the data and
    a completely unique but corresponding key is used to decrypt the data (see Figure
    7-3). These keys are typically called *public* and *private keys*. PKI is based
    heavily on the use of public key cryptography and thus public and private keys.
    This is not difficult to understand, but many people who are new to the concept
    tend to question how this can be secure.


    Every entity in the digital world that wishes to authenticate using digital certificates
    has two keys (which can be generated by a third party or generated by the entity
    itself). The public key can be given to anyone else, and the private key is kept,
    well, private. Data encrypted using the private key can only be decrypted using
    the public key. Conversely, data encrypted using the public key can only be decrypted
    using the private key.


    > Into Action

    Can your public key really be given to *anyone*, even an attacker? Absolutely.
    Remember that the only thing an attacker could do with a public key is encrypt
    data that can then only be read by you, or decrypt data that you''ve encrypted
    with your private key. It is up to you upon receiving data to verify whether communication
    is trustworthy, but the simple fact that the attacker has your public key does
    not in any way directly impact the security of your private key.'
