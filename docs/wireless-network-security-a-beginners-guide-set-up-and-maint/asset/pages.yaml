    **Figure 3-4** Man-in-the-middle (MITM) attack


    Figure 3-4 shows a basic example of a man-in-the-middle attack against a wireless
    client. When you take a look at this figure, it''s obvious to see how the attack
    goes its name. Simply being somewhere in between the communication path, you can
    intercept the communication and see what the user is doing. This is assuming that
    the communication isn''t encrypted, which we''ll cover in more detail later.


    However, the attacker is not required to be physically in the communication endpoints
    to perform the attack. In some cases, the attacker doesn''t even need to be logically
    in the middle of the communication path. Some attacks can be as effective by seeing
    only one side of the communication (send or receive).


    So if you''re not physically in the path of communication, how do you perform
    a man-in-the-middle attack? Essentially, you *insert* yourself into the logical
    path of the two endpoints (see Figure 3-5). There are many different options for
    doing this, and which method you use can depend on many factors, including the
    network topology of the target and the security technologies in place.


    ![](img/78ecc761d1e6376868e68bf50b83b97a_66_1.png)


