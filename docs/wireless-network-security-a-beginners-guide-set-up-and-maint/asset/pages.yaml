    else, you should find them all interesting and entertaining.


    Keep in mind that this chapter is not meant to be an exhaustive study of all the
    possible attacks one can perform against wireless devices. Instead, we focused
    on the attack methods and the underlying techniques that you can recognize similar
    attack vectors in future technologies.


