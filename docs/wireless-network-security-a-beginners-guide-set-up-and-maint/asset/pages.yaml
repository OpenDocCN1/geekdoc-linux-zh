    first.


    # When We Force the Client to Talk to Us?


    The next question is, if we want to attack an already connected to an access point,
    can we force it to talk to us instead? The answer is almost always yes. The process
    we''ll use to accomplish this is quite simple. We will configure our attacking
    laptop to act as an access point. once the client has connected to our access
    point, we can continue with the attacks we''ve already detailed, as well as some
    new attacks we''ll cover in the next section.'
