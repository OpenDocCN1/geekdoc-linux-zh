  md: '# Wireless Network Security: A Beginner''s Guide


    | Field | Description |

    |---|---|

    | Cell Address | The cell is a number within iwlist to uniquely identify each
    network. Address is the BSSID, uniquely identifying the access point.

    | Channel | The current wireless channel for this specific BSSID. You can also
    see the frequency below this, which can be useful because some tools want the
    specific frequency and not the channel. |

    | Encryption Key ESSID | Set to "on" in this case, which means the access point
    is using WEP encryption. The Extended Service Set ID, which in this case is "INSECURE."
    |

    | Mode | Remember that if the mode is "Master," you know the device is an access
    point; otherwise, the mode would be Ad-Hoc. |


    # Into Action


    You''re probably thinking that to show the access point and clients as having
    a unique MAC address I had to edit all the images in this chapter, but you would
    be mistaken. You can actually change the MAC address on a Linux computer using
    the ifconfig command. For the access point, I used a Linux WRT54G with the dd-wrt
    firmware. As part of the dd-wrt firmware, you have the "clone MAC address" feature,
    which lets you set the MAC address to anything you''d like.


    For Linux laptop, the interface must typically be brought down first to change
    the MAC address. The ifconfig syntax is as follows:


    ```

    #ifconfig wlan0 down

    #ifconfig wlan0 hw ether 88:88:88:88:88:88

    #ifconfig wlan0 up

    ```


    I definitely recommend setting your MAC address and IP address statically while
    testing security tools; this makes it very easy to remember and identify machines
    in packet captures and the like. Also, you should be aware that some cards do
    not support changing the MAC address (although most today do), and some cards
    have some minor restrictions. For example, the dd-wrt firmware states that the
    second digit in the MAC address must be even. The wireless card in the laptop
    I was using also had this requirement.'
