  md: '# Kismet


    We couldn''t possibly have a section on wireless reconnaissance without discussing
    Kismet, which is the facto tool for discovering available wireless networks. Kismet
    has been around for some time now and has undergone very heavy development. It
    offers an incredible amount of features, including the following:


    +   * Passively identifying wireless networks

    * Logging GPS coordinates of wireless networks

    * Logging of captured packets and detected wireless networks

    * Automatically decloaking detected wireless networks

    * Logging to XML files for integration with other tools


    We will focus on the wireless reconnaissance capabilities of Kismet in this chapter
    and cover some of the additional functionality in a later chapter, using Kismet
    as a wireless IDS.


    # IMHO


    > Please, please, I''m begging you. Install and use Kismet. You will gain so much
    real-world knowledge about how wireless technologies are used (and misused) by
    simply spending a few fun-filled evenings driving around in your car with Kismet.
    It is absolutely invaluable.


    Kismet uses the nurses library, which allows it to act as a terminal but have
    some of the qualities of a graphical user interface (GUI), including the ability
    to interact with Kismet using your mouse. To download Kismet or read any further
    documentation, visit www.kismetwireless.net. Kismet will run on Linux, FreeBSD,
    NetBSD, OpenBSD, and Mac OS X. You can also run the Kismet client under Cygwin
    in Windows.


    In Actual Practice

    Don''t get too excited about the ability to run the Kismet client on Windows.
    Getting it to run under Cygwin can frankly a little more than a headache for someone
    unfamiliar with Linux. But, if you''re feeling adventurous, you can check out
    the documentation on how to do so at www.kismetwireless.net.'
