  md: '# Chapter 5 Attacking Wireless Clients 109


    # Capturing Packets


    Remember in Chapter 4 when airodump automatically saved all the packets received
    in a PCAP file when we used the -w option? If you want to view the packets while
    you''re capturing them, you can simply open the PCAP file with Wireshark. The
    only problem with this is you''ll have to close the file and reopen it to see
    any new packets.


    To see all the packets captured in real time, you''ll want to use Wireshark and
    start an active capture session. You still have the option to save all the packets
    to a PCAP file from within Wireshark.


    Let''s take a look at what can be seen by associating to the INSECURE network
    and using Wireshark in promiscuous mode. If your interface is not already in promiscuous
    mode, you''ll have the option of enabling promiscuous mode from within Wireshark.nYou''ll
    also need root privileges to enable promiscuous mode, so be sure to start Wireshark
    as a root user.


    > Note

    Just like many of the other tools covered in this book, we can''t possibly go
    over all the options and features in Wireshark. A few books have been written
    on using Wireshark and performing packet analysis. I recommend playing with Wireshark
    to get familiar with its options and decide if you need your further education.


    Once you''ve installed Wireshark, open a terminal and type wireshark. On the left
    side, you''ll see the ''Interface List'' section. You can click the wireless interface
    on which you wish to capture (in this case, wlan0). Congratulations, you''re now
    capturing packets in real time, in promiscuous mode, on your wireless interface.
    This is too easy, right? This will use the defaults for capturing, which are sufficient
    for most of what you''ll ever need to do.


    In Figure 5-6, we can see the client device (44:44:44:44:44:44) with an IP address
    192.168.1.44 is browsing a website with an IP address of 192.168.1.100. We can
    tell it''s web traffic because the detected protocol is HTTP. In this area, we
    can see the protocol but we can''t exactly what is being viewed.


    We see in the second half of the screen that the packet has broken down basically
    by OSI layer. Starting with the frame, we get basic information about the packet.
    Next, the Ethernet header shows the source and destination MAC addresses. After
    that is the IP layer, we see the source and destination IP addresses. Then the
    TCP section shows the source and destination TCP ports. The destination port listed
    here is typically what Wireshark will use to make an educated guess as to what
    higher-layer protocol is. Next, you might see the Application layer data detected.
    Depending on the contents of the packet and whether Wireshark has a protocol decoder
    for the detected data, this may or not be an option.'
