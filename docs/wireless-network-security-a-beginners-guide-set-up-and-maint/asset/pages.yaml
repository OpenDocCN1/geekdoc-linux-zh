  md: '# Wireless Network Security: A Beginner''s Guide


    Step 6. Crack the WEP key using aircrack-ng.


    Now it''s time to attempt to crack the key again. We''ll use the same command
    as before:


    ```

    #aircrack-ng *.cap

    ```


    Success! Take a look at Listing 4-9. You can now see that with only 20,000 IVs
    we were able to successfully obtain the WEP key. The entire cracking attack took
    only three seconds! The key, which is represented in hexadecimal, is 12:34:51:23:45.
    If the key is able to be converted to ASCII, the text representation of the key
    will be displayed as well.


    # Listing 4-9: Successfully Obtaining the WEP Key Using Aircrack-ng


    ```

