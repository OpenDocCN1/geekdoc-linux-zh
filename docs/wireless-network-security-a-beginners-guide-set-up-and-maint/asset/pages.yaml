  md: '# 82 Wireless Network Security: A Beginner''s Guide


    ![](img/78ecc761d1e6376868e68bf50b83b97a_100_0.png)


    4-7 Kismet''s main interface


    The bar below main display shows a scrolling graphical representation of packets
    and data captured. Packets are on top in orange, and data is below the bar in
    red. Again, this display doesn''t necessarily give any indication of the contents
    of the data, but if you see a lot of data fly by, you can infer the usage of the
    network as well as determine an interesting target.


    # In Action


    We covered in the last chapter that you need thousands and thousands of packets
    to track a WEP-encrypted network. From an attacker''s perspective, if you identify
    a wireless network that has many clients connected to it lots of data flying through
    the air, this might present a good network to attack. I definitely not suggesting
    that someone will attack your network only because he sees lots of packets from
    your network. However, if an attacker has potential targets—one with no clients
    connected and the other with ten clients and a lot of data—the latter might be
    the more obvious target.'
