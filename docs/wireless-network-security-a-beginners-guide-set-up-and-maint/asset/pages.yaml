  md: '# Chapter 8 Deploying a WPA-Enterprise Network with Certificates 213


    ![](img/78ecc761d1e6376868e68bf50b83b97a_231_0.png)


    **Figure 8-23** Registering the NPS in Active Directory!


    For the Network Policy, we configured the following conditions: the request comes
    from 802.11 device, the user belongs to the WirelessUsers group, and the user
    is authenticating with a certificate. If the user successfully authenticates and
    these conditions are met, the user is granted access to the network.


    At this point, your NPS is configured, but you have one final task to allow it
    to start processing requests. Right-click the “NPS (Local)” node and choose Register
    Server in Active Directory. You’ll then see the message in Figure 8-23.


    We’re almost there. You have the most complex configuration behind you. Now it’s
    time to configure the access point and test authentication.


    # Configure the Wireless Access Point


    Ironically, the configuration of the wireless access point is typically the easiest
    part of this project. We won’t cover the configuration of the basic wireless settings
    because you such as the SSID and channel are assumed to be configured.


    In Figure 8-24, you can see the configuration of a Linksys WRT54G running the
    dd-wrt firmware. Keep in mind that the interface for your access point may be
    different, the configuration should be just simple. You’ll notice that Security
    Mode is set to WPA2 Enterprise, which brings up the option to configure a RADIUS
    server. We’ve also configured the WPA algorithm as AES, as opposed to the less
    cryptographically secure TKIP protocol.


    All you need to authenticate your clients is the IP address of the RADIUS server
    as well as the RADIUS shared secret you configured previously. That’s it! Keep
    in mind'
