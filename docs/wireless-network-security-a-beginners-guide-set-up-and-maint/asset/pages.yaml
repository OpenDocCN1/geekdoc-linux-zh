  md: '# Wireless Network Security: A Beginner''s Guide


    If an entity signs a message with their private key, they can then send this message
    to anyone with their public key and that message can be verified as coming from
    the entity using their public key. This does two things: It actually tells the
    recipient that the message was sourced from the sender, and it also tells the
    recipient that the data has not been changed in any way in transit. This protects
    the integrity of the message as well as who sent the message. What does it mean
    "to sign" a message using a private key? Well, if I want to send a message to
    someone and this person be able to verify that the message came from me and that
    it wasn''t changed in transit, I can digitally sign the data using my private
    key. This process is shown in Figure 7-4.


    The process is as follows:


    +   1. I take every bit of the data and run it through a hashing algorithm (such
    as the MD5 algorithm).


    +   2. I take the output from the hashing algorithm and encrypt this using my
    private key.


    +   3. I append this data (or otherwise just include it with the data) and send
    it over to my recipient.


    ![](img/78ecc761d1e6376868e68bf50b83b97a_186_0.png)


    Figure 7-4 Digital signature process'
