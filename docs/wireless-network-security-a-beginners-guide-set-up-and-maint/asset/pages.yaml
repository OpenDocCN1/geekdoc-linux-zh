  md: '# Wireless Network Security: A Beginner''s Guide


    # We''ll Cover


    +   - Setting the stage

    - Phases of wireless deployment

    - Secure design principles for wireless networks

    - Useless defenses

    - Good wireless defenses


    You should have a thorough understanding of some of the many attack vectors available
    to target wireless networks and clients. In this chapter, we''re going to cover
    the concepts that will form the basis for securing your wireless networks. Then
    we''ll take the concepts you learn in this chapter to design secure wireless networks
    to accomplish common goals.


    # Setting the Stage


    I''d like to set the stage for the defenses discussed in this book and the remaining
    chapters so that you can gain the most from this book. We will discuss a few important
    issues, including those of context and reality. You should also understand that
    the attacker has clear advantages in this fight. Although the attacker may have
    advantages, if you use the defenses discussed in the remaining chapters of this
    book, you will have no problem winning the fight.


    # Context


    The thing I can''t provide in this book that you must always keep in mind is context.
    I simply can''t provide direct recommendations that help the business context
    for every reader of this book. Therefore, you need to take all the defenses outlined
    in this book and determine how they fit into the context of your business needs.


    Remember that every business accepts a certain level of risk (either directly
    or without fully understanding it). You must determine the solutions for securing
    the wireless networks you''re responsible for that make sense in the context of
    your environment.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Chapter 6 Theory of Defense for Securing Wireless Networks 131


    # Reality


    After considering context, we should discuss reality. Don''t get frustrated when
    you can''t implement every defensive technology we discuss in this book. If every
    organization had an unlimited budget for securing their environment, we would
    live in a very different world. Clearly, most organizations don''t have unlimited
    funds to spend on securing their networks, so they must choose which defenses
    are the most important and appropriate given their environment and their budget.


    > IMHO

    An example of applying context and reality to one of my recommendations would
    be my recommendation for companies to use an intrusion detection system (IDS).
    I highly recommend that, whenever possible, businesses utilize IDS technologies
    in their networks. Does that mean you should immediately integrate an IDS into
    your environment or turn of your wireless network? Of course not.\ Some businesses
    simply can''t handle the administrative requirements of an IDS. In this case,
    it should be a conscious decision in which you weigh the risks of running a wireless
    network without an IDS versus the risk of lost operational improvement from not
    using a wireless network.


    # The Attacker Has the Advantage


    Something you must keep in mind when securing your environment is that the attacker
    has a clear advantage over you. I think that needs repeating: You in a disadvantaged
    position to a potential attacker.


    For an attacker to accomplish his goals, he needs to find only one hole in your
    defenses. For you to accomplish your goal, you need to identify and patch every
    exploitable hole. Likewise, time is absolutely on the attacker''s side. You need
    to be constantly on your game—patching vulnerabilities, ensuring clients are adhering
    to security policies, and keeping your administrative credentials secure—whereas
    an attacker can sit and wait for one time when you slip up.


    > IMHO

    So why do we as security professionals play a game where the odds are clearly
    stacked against us? I think a cliché movie line pretty much sums up: "We''re either
    incredibly smart… or incredibly stupid." I''ll let you decide which for yourself.'
