  md: '# Wireless Network Security: A Beginner''s Guide


    Suppose you have some personal papers that you lock in a small safe. To make it
    more secure, you lock that safe in a larger safe. Whenever you want to access
    these papers, you have the added inconvenience of needing to open two safes in
    addition to having to remember two combinations.


    However, a paradox manifests itself in the real world, as illustrated in Figure
    1-1, which shows what I like to call the security convenience curve. Typically,
    if you increase the inconvenience factor, you also increase security, but there
    comes a point when this inconvenience has an adverse effect on security.


    An example of the security convenience curve could be a company’s “password change
    frequency” policy. At first, the company’s policy requires users to change their
    passwords every six months. In an attempt to make the company even more secure,
    the policy is modified so that users must change their password every three months.
    However, after a few times of changing their passwords, users find it difficult
    to remember them and start writing on sticky notes that are stuck to their monitors
    or under their keyboards. This is obviously not a good place for confidential
    data and ultimately makes the business less secure.


