  md: 'threat analysis An alternative approach to risk management that involves identifying
    and analyzing potential attacks, threats, and risks and preparing countermeasures
    accordingly.


    **TKIP** Temporal Key Integrity Protocol. A temporary solution to help mitigate
    the risks from the cryptographic weaknesses in WEP.


    **TLS** Transport Layer Security. The next-generation replacement for the SSL
    protocol.


    **VLAN** Virtual local area network. A technology for creating multiple virtual
    networks at Layer 2 from one physical Layer 2 device.


    **VPN** Virtual private network. A technology that creates a secured virtual link
    between systems over an insecure network.


    **wardriving** A method of discovering all the wireless networks available in
    a given area by “driving” in the area with appropriate wireless equipment.


    **WEP** Wired Equivalent Privacy. A technology used for authentication and encryption
    of communications for 802.11 networks


    **workflow** A collection of rules that govern the relationship of steps required
    to complete a process. Relationships might include sequence order, branching conditions,
    looping, and number of repetitions.


    **WPA** Wi-Fi Protected Access. A wireless security standard designed to completely
    mitigate the vulnerabilities in the WEP protocol.'
