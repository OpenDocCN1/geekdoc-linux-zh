  md: '# Chapter 11 Handling Rogue Access Points and the Future of Wireless Security
    293


    # Other Wireless Technologies


    You may have questions about how wireless technologies will impact the security
    of your organization. The fact is that you already have most of your answers.
    The same security issues that plage 802.11a/g/n need to be dealt with no matter
    what the underlying wireless technology is. Systems such as Bluetooth, long-range
    wireless, and broadband wireless (802.16) need to ensure the confidentiality,
    integrity, and availability of their clients and systems.


    The specific attacks will be unique to each technology, but the attack vectors
    are the same. For instance, Bluetooth (802.15), which is a short-distance technology
    used to create “wireless personal networks,” or WPANs, is vulnerable to the same
    type of attacks as 802.11 wireless networks. For example, if the communication
    is unencrypted, someone can easily sniff the data and eavesdrop on communications.


    Bluetooth operates in the 2.4GHz frequency


    Zigbee is a wireless protocol for very short-range and low-power devices. Zigbee
    operates in a few frequencies, including support for 2.4GHz. The main target for
    using Zigbee is within smaller appliance solutions such as home appliances. Wireless
    technologies in the future will become available that are not based on anything
    available today, they too will have to provide security measures for the following
    attack vectors:


    +   * Eavesdropping

    * Denial of service

    * Cryptographic security


    # Next-Gen Solutions


    Two wireless systems really represent the future of wireless solutions. They are
    lightweight wireless solutions and cloud wireless solutions. These systems don''t
    really change the fundamentals you have learned in this chapter but instead make
    deployment and management of large-scale wireless networks considerably easier.


    Another emerging technology is wireless Intrusion Detection Systems (IDS). You’ll
    remember that we touched upon these systems in Chapter 6. Although my view is
    that you'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Wireless Network Security: A Beginner''s Guide


    can gain almost all of the benefits from a traditional wired IDS, technology is
    always changing and wireless IDS systems are starting to offer some interesting
    features. It''s your job to figure out if these features are worth the additional
    cost.


    # Lightweight Wireless Solutions


    Lightweight wireless solutions are definitely the way to go for any medium-to-large-scale
    deployments of wireless networks. Lightweight wireless solutions allow you to
    deploy access points and have them automatically configured on profiles you create.
    Most lightweight solutions today are based on either the Lightweight Access Point
    Protocol (LWAPP) or the the Control and Provisioning of Wireless Access Points
    (CAPWAP) protocol.


    In fact, many wireless access points can be upgraded (with a simple firmware update)
    to “lightweight” to gain some of the management advantages of lightweight technologies.
    The two leaders for lightweight wireless solutions are Cisco and Aruba. We will
    not go into the specifics of either offering here but instead discuss how LWAPP
    systems operate.


    When you receive a new LWAPP access point from the manufacturer, you can take
    it out of the box and plug it into your network. Assuming the controller has been
    configured correctly, the access point will query the wireless controller, download
    its configuration, and start serving wireless automatically within minutes. This
    general process is shown in Figure 11-8. There are a few ways for the access point
    to “find” the wireless controller. The two most popular ways are for the access
    point to broadcast at Layer 2 for the controller or to obtain the IP address for
    the controller via DHCP. This is done by configuring option 43 in DHCP scope to
    the IP address of your controller.


    # Controller-based AP


    ![](img/78ecc761d1e6376868e68bf50b83b97a_312_0.png)


    +   1. AP broadcasts on ethernet connection looking for controller.

    2. Controller responds, “Here I am.”

    3. Access point downloads configuration from controller.


    Figure 11-8 Controller-based access points discovery'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Chapter 11 Handling Rogue Access Points and the Future of Wireless Security


    Alternatively, you can create a DNS entry for the wireless controller, which the
    access points can query for. For example, for Cisco LWAPP access points, you would
    create a DNS record for cisco-lwapp-controller.localdomain that points to your
    controller.


    You should keep in mind that lightweight wireless systems doesn''t really change
    any of the fundamentals you''ve learned in this book. You still configure the
    same recommended encryption and authentication settings and apply them to your
    access points; the backend management and configuration of the access points is
    really all that changes. Typically, you would manage the controller (and thus
    the configuration profiles for access points) through a web interface on the controller.


    +   - Controller-based systems really ease the management of wireless access points
    as well. As mentioned earlier, most management systems have the ability to upload
    an image, set the scale, and mark the locations where you''ve installed your access
    points. The controller can then show you approximate locations of associated clients,
    rogue access points, and rogue client devices. You can also view a heat map, which
    shows an approximation of the wireless strength in different areas on the map.
    In addition, built-in wireless IPS functionality can be leveraged from all the
    access points.


    # Cloud-Based Wireless Solutions


    Cloud-based wireless solutions comprise a new breed of wireless access points
    that are currently taking the benefits of LWAPP access points a step further.
    The number-one cloud wireless provider today is Meraki (www.meraki.com). It''s
    important to understand that these access points are not LWAPP access points but
    rather operate in a similar way. Instead of the access point today querying the
    local network to find a controller, the access point is preconfigured with the
    address of the Meraki controller over the Internet.


    Arguably the most complex part of deploying a LWAPP solution is configuring the
    actual controller. With cloud-based wireless solutions, you don''t need to configure
    and deploy the controller itself. The controller already exists (in the Cloud)
    and is ready to configure and control your wireless access points.


    # Into Action


    The Cloud is a buzzword for something that has existed for a very long time—services
    hosted on the Internet. In recent years, many technologies have been moved to
    the Cloud that had never been offered in such a way before. For cloud wireless
    services, you take the access point controller, which used to exist on your local
    network, and move it to a hosted location on the Internet.'
  merge: -1
