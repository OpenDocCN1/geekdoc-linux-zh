    # Encryption


    Encryption is the process of obscuring data so that any unauthorized person who
    intercepts the data won''t be able to understand it. Encryption would be relatively
    meaningless being able to return the “jumbled” data to its original form. Thus,
    encryption is a two-way process. Taking encrypted data and returning it to readable
    data is called decryption.

    There are two main systems for encrypting data:


    +   * Shared-key encryption

    * Public Key encryption


    Shared-key encryption is an extremely old technique for encrypting data, as it
    has been used since the time of the Romans. Shared-key encryption uses the same
    key to both encrypt and decrypt data and is sometimes referred to as symmetric
    encryption. You''re probably already familiar with WEP encryption, which uses
    a shared-key encryption technology. You enter an encryption key on the access
    point and then enter the same encryption key on any clients that need access to
    the network.\Public Key Infrastructure (sometimes referred to as asymmetric encryption)
    uses a separate key to encrypt and decrypt data. This can be a little confusing
    to people new to PKI, but just understand that some heavy-duty mathematics are
    used behind the scenes. It is considered a very strong option for encrypting data.

    The following table lists the general advantages for each technique:


    | Technology | Advantages |

    | --- | --- |

    | Shared-key | Fast, Less computing power needed, Very simple |

    | Public Key Infrastructure | Extremely secure |'
