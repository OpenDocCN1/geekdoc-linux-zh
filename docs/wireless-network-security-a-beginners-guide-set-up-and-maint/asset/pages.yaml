  md: '# Wireless Network Security: A Beginner''s Guide


    > Note

    Another very important concept for any security technology is that of peer review.
    This is especially true when it comes to encryption algorithms. When a new encryption
    algorithm is released by a "security expert" or security company, it is not enough
    for them to say, "Everyone start using my new encryption algorithm; it''s very
    secure." The new encryption algorithm must be tested by other talented security
    professionals and get their stamp of approval. Typically, encryption algorithms
    that have existed for a while and have been tested by many people (that is to
    say, they have withstood the test of time) should be given preference over shiny
    new algorithms.


    WEP requires users to enter a key (password) on the access point and then enter
    the same key on all devices that wish to access the wireless network; this is
    the quintessential pre-shared key and is commonly referred to as the *WEP key*.
    This key serves as the authentication credentials used to access the wireless
    network as well as provides the key for the encryption process.


    > Note

    The fact that the WEP is used for authentication can be somewhat confusing because
    there technically two distinct ways it''s used for authentication.

    First, the original WEP standard used the WEP key as part of a challenge/response
    authentication process, which was actually extremely insecure (as covered earlier
    in this chapter).

    Second, anyone with knowledge of the WEP key should be considered "insider" because
    they have knowledge that only an insider should have; this authenticates them
    as someone authorized to join the network. This is what is meant by the "pre-shared"
    key.


    In Actual Practice

    You should also note that the same key among many users has its own inherent security
    failings and is basically the weakest kind of authentication.

    Sharing the same key among many users does not allow an administrator to (easily)
    authenticate specific users; meaning if you have two users (let''s say Bob and
    Mary) who authenticate with the same key, you can''t easily tell user who has
    authenticated to the access point is Bob or Mary. You''d have to determine this
    information based on some external means.

    Also, if any user compromises the key, then that key has been compromised for
    everyone. Take the case where you share the WEP key among 100 users. If one of
    the users leaves the company, the key must be changed and redistributed securely
    to the other 99 users.'
