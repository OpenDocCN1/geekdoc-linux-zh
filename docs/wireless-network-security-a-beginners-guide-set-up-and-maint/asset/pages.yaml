    # Technical Solutions for Endpoint Security


    The topic of endpoint security has become a hot button issue and the industry
    has responded with a lot of choices for ensuring the security of endpoints. Traditional
    endpoint security systems should not be overlooked, and you should understand
    how they all operate to ensure that wireless devices remain secure. Non-wireless-centric
    systems such as antivirus, intrusion detection systems, and intrusion prevention
    systems are at the top of the list.


    # Group Policy Objects

    You can use the Windows settings within Group Policy to restrict what users are
    able to connect to. Create a new Group Policy and expand Computer Configuration
    | Policies | Security Settings | Wireless Network (IEEE 802.11) Policies. Then
    right-click in the right screen and choose a New Wireless Network Policy for Windows
    Vista and Later Releases. The first window you''ll see is similar to Figure 11-10.
    In this window, add any of the wireless networks you want this client to be able
    to connect to.


