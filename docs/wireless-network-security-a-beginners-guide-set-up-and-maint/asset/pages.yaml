  md: '# Wireless Network Security: A Beginner''s Guide


    # Port Security


    Port security allows you to configure MAC address restrictions on physical switches.
    The restrictions can limit the total number of MAC addresses allowed to come into
    a particular port or the port can be restricted to allow only specific MAC addresses.
    You can also configure the action taken if either of these restrictions is violated.
    The action can be to disable the port and/or alert an administrator. Alternatively,
    you can drop packets that are not from an allowed source MAC address. If you configure
    port security to disable the port, an administrator would have to manually enable
    the port to return it to a functional state.


    You need to understand the operation and limitations of port security if you''re
    going to use it. Typically, you won''t enable port security on unless switches.
    To support your goal of preventing rogue wireless access points, we''ll configure
    port security only on "edge" ports, or ports that connect to end devices. Let''s
    look at a few scenarios. First, we''ll configure our switch to allow only one
    MAC address on the port:


    ```

    Zionsw1# configure terminal

    zionsw1(config)# interface fastethernet/10

    zionsw1(config)# switchport mode access

    zionsw1(config)# switchport port-security

    zionsw1(config)# end

    ```


    In the preceding example, we show that the command we need to enable port security
    on interface FastEthernet10 is the switchport-security command. This uses the
    default configuration of allowing only one dynamically learned MAC address on
    the port. If more than one MAC address is learned on the port, the interface will
    be disabled.


    If someone were to plug an access point into a port that restricted the total
    number of MAC addresses to one, let''s see what would happen. As you can see in
    the listing below, the interface Fa0/10 (in this case, err-disabled) has changed
    to a down state because of a port security violation. In this mode, it is not
    allowing any packets to traverse this port. Now you have to consider why this
    is the case. In this example, though there''s only one client connected to the
    wireless access point, the switch has seen traffic from the port itself (MAC address
    2222.2222.2222) as well as the client system and therefore has two MAC addresses
    learned from this interface, so it disables the port.


    ```

    %PM-4-ERR_DISABLE: psecure-violation error detected on Fa0/10, putting

    Fa0/10 in err-disabled state

    ```


    ```

    %PORT_SECURITY-2-PSECURE_VIOLATION: Security violation occurred, caused by

    MAC address 2222.2222.2222 on port FastEthernet0/10.

    ```


    ```

    %LINEPROTO-5-UPDOWN: Line protocol on Interface FastEthernet0/10, changed

    ```


    ```

    %LINK-3-UPDOWN: Interface FastEthernet0/10, changed state to down

    ```'
