  md: '# Wireless Network Security: A Beginner''s Guide


    # Into Action


    Many terms are used to describe being an unlucky victim to a random security assault.
    Phrases like “crime of opportunity,” “low-hanging fruit,” and “spray pray” are
    not just catchy lingo; they indicate a real world threat that is constant and
    pervasive.


    You’re already familiar with the most common forms of non-directed attacks: computer
    viruses. Most virus writers don''t write their viruses to a specific company;
    instead, they create them to impact as many hosts as possible and then “release
    them into the wild.” Attacks on wireless clients can be very similar. With an
    unending supply of wireless clients, an attacker doesn''t need to target a specific
    person or organization to find vulnerable systems.


    # Wireless Clients Are Everywhere


    This fact makes clients devices an interesting target for an attacker. Whether
    the attacker wishes to target a specific company or just sit in a coffee shop
    and “see what he can find,” there will never be a lack of client devices to target.
    The fact that an attacker can test out new attacks against real systems almost
    completely anonymously without having to wait to “find” a potential target means
    exploits wireless systems are in constant development.


    # Wireless Clients Are Constantly Broadcasting Their Existence


    Just like access points that are constantly broadcasting their existence through
    beacons, wireless clients are observable by capturing the probe requests and association
    requests they send. Not only can you see the client by its association requests,
    but when a client is not associated with an access point, it will be sending probe
    requests for wireless networks it’s configured to connect. Client devices that
    wish to connect to wireless networks for which they do not see beacon packets
    send probe requests. These probe requests contain the ESSID of the wireless client
    is “looking for.”


    # Wireless Clients Are Not Monitored as Closely as Infrastructure Devices


    Think for a moment of the existing security controls and monitoring software you
    have in place for your workstations, laptops, and smartphones. Not very much in
    place, is there? This is the way it is at most organizations today. We spend so
    much money on monitoring the main points of ingress and egress to our organizations
    that we completely forget about our troops on the ground.'
