    # DMZ with Jump Stations


    Another option for providing access to internal resources that operates very similarly
    to a VPN using jump stations. A jump station refers to a system you connect to
    that you then connect to your target system, very much like a proxy. Jump stations
    can take many forms and do not reference any specific technology. Typically, you
    would use a service that gives you an interactive session on the remote machine
    such as Secure Shell (SSH), Remote Desktop Protocol (RDP), or Citrix. In Figure
    10-5, you can see we have our jump station on an RDP server in our DMZ.


    Citrix and RDP are typically used on Windows systems to give you access to a Windows
    desktop interface from which you could then run executables. SSH would give you
    a text command-line interface to the remote system, but it''s extremely flexible
    (see Figure 10-6). One of the advantages of using jump stations is that typically
    you don''t need anything preinstalled on the client system. For example, you might
    choose to use RDP for your jump station because every modern version of Windows
    comes preinstalled with an RDP client.'
