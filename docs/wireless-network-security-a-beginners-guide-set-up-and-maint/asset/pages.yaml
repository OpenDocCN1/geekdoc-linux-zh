  md: '# Client Protection


    Protecting your wireless endpoints should obviously be a priority. In Chapter
    5, we discussed a myriad of ways to exploit and compromise end systems as well
    as their network communication. There are technical and nontechnical solutions
    for ensuring the integrity of your endpoint systems. Not surprisingly, you might
    mitigate a majority of your risks by properly educating the users who are using
    your wireless systems.


    # User Education


    One of the most important things you can do to increase the security of your endpoints
    is to properly train the people responsible for them! Many companies offer automated
    training (typically via videos over the Internet) or classroom-based training.
    However, after reading this book, you now have all the information you need to
    craft a great security-awareness training program.


    Be sure to tailor all of your training to fit the specific needs of your business.
    You should make the information practical for the users, both in their personal
    and work lives. Providing value by helping users to protect themselves from being
    exploited in everyday life will really help ensure they pay attention and get
    the most out of training. In addition to making the information applicable to
    your attendees, you should make it interesting. Most of the attacks detailed in
    this book are pretty darn interesting! If you explain to users the attacks that
    are currently possible (and in wide use) and back it up with some cool-looking
    demonstrations, you''re sure to capture their attention.


    Here are some of the specific topics you might want to cover:


    +   * The security implications of using hotspots

    * The ability for attackers to view unencrypted communications

    * The importance of SSL and how to detect anomalies

    * When and where users should see corporate wireless connections (only at corporate
    facilities)

    * Reporting wireless devices that are not authorized

    * The importance of not sharing passwords and other secure information

    * Dealing with common and uncommon security-related issues (antivirus warnings,
    virus detection, IDS notices, and so on)

    * Whom to contact with security questions and potential security issues'
  merge: -1
