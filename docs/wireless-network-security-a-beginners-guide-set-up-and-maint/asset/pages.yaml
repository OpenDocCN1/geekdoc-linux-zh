    # Configure the Certificate Template and Auto-Enrollment


    Now we''ll move on to configuring the certificate template, which defines the
    specific settings for the certificate, what the certificate will be used for,
    and who can obtain the certificate. In the following examples, we will create
    new Organizational Units and user groups to really define and restrict who is
    able to obtain the certificates necessary to authenticate to the wireless network.
    We''ll then assign the correct user permissions to the certificate template for
    the Wireless group to allow the members of that group to automatically obtain
    that certificate. Here are the steps we''ll take in this process:


    +   1. Create the Wireless Organizational Unit and the WirelessUsers group.


    +   2. Create the Wireless Group Policy Object.'
