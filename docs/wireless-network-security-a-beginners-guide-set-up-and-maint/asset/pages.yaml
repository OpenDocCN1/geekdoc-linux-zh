    then typically draw a line on the map (using a tool on the appliance) to set the
    scale of the image, such as one inch on the screen being feet in reality. Now,
    when your lightweight access point system detects a rogue access point, it can
    display the approximate location on the map.


    Such a system can also alert an administrator once it detects a rogue access point.
    Most systems give you the ability to whitelist a specific BSSID, once you verify
    that the particular BSSID is not connected to your network, to stop being alerted
    to its presence. Some systems even give you the ability to deauthenticate clients
    from the rogue network. This can be a great feature for preventing your own internal
    clients from associating to an insecure wireless network.


    Non-wireless-centric systems can also help you to identify a rogue device has
    been placed on your network. Some of your best options include an intrusion detection
    system and arpatch.


    Arpatch is an open source program that allows you to monitor your network for
    "ARP events.\ In addition, it can alert you to any new MAC addresses it observes.
    Arpatch is very easy to install and configure; in fact, it is preinstalled on
    BackTrack. Arpatch is very similar to an IDS in that it is very noisy when you
    first install it. However, once you have configured and running for a short period
    of time, it''s extremely low maintenance and very helpful.


    To run arpatch on BackTrack and have it alert you of events via e-mail, you first
    need to install the sendmail program using apt-get sendmail. Then you can run
    arpatch and specify your e-mail address to send alerts to. In the following example,
    we''ve configured arpatch to monitor the eth0 interface and alert admin@zion.com
    of any events.


    ```

    root@bt:~# apt-get install sendmail

    root@bt:~# arpatch -i eth0 -m admin@zion.com

    ```


    Next, you see an example of an e-mail for a new MAC address detected on the eth0
    interface. You should note that the Ethernet vendor information is filled automatically
    from a database based on the OUI and is not always accurate. The alert also provides
    the time this MAC address was first seen, which can be great for your records.


    ```

    hostname: <unknown>

    ip address: 10.0.0.201

    interface: eth0

    ethernet address: 08:00:27:f7:24:c1

    ethernet vendor: CADMUS COMPUTER SYSTEMS

    timestamp: Sunday, November 13, 2011 17:41:10 -0500

    ```'
