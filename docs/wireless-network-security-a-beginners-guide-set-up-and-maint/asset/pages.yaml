  md: '# Chapter 6 Theory of Defense for Securing Wireless Networks 135


    Keep in mind that a key reason for having a penetration test might not be to show
    your technical team what vulnerabilities exist, but to display to your executives
    the real-world, tangible security issues that exist in your systems. It definitely
    grabs people'' attention when you say, “We successfully penetrated the network
    and could view all the company''s e-mails,” much more than saying could potentially
    penetrate the network.

    The three basic flavors of penetration tests are black box, white box, and grey
    box. Sometimes they go by slightly different names, but the concept is the same.
    In a black box, the attacker has no inside knowledge of the company or technology
    in use. In a white box, the attacker might be given confidential information or
    some level of access to the wireless network. A grey penetration test is somewhere
    between the two. The situations where you would prefer one to the other depend
    on your ultimate goals. You''ll want to discuss your end goal with the team you
    hire, but ultimately you can consider a black box to show what an outsider might
    be able to accomplish, whereas a white box might show what an employee or ex-employee
    could accomplish.


    # IMHO


    Many people think there''s no reason to have a penetration test performed. Their
    argument is that IT administrators already know the vulnerabilities in their systems
    and don''t need someone to tell them, or that a vulnerability assessment is sufficient.
    Although I tend to agree with some of this, there are still times when a penetration
    test makes the most sense, and this will never change.

    Remember that one of the key reasons for having a penetration test performed can
    be to prove to nontechnical budget makers that serious vulnerabilities worth spending
    money exist in the environment. Another great reason for having a penetration
    test instead of a vulnerability assessment is when you actually want to test your
    defenses against a defended attacker. Say, for example, you''ve recently implemented
    an IDS and created policies and procedures for your support staff to respond to
    attempted intrusions. A penetration test can be a great way to test your staff''s
    response to a real-world attack without waiting to see if the process is broken
    by an actual attack.


    Some of the important points to consider when securing an existing wireless network
    include how you will handle downtime, whether you will deploy a new network or
    a network in tandem with your current wireless network, and the impact on your
