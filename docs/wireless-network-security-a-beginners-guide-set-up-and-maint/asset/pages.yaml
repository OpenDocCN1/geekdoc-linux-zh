  md: '# 200 Wireless Network Security: A Beginner''s Guide


    ![](img/78ecc761d1e6376868e68bf50b83b97a_218_0.png)


    Figure 8-8 Auto-enrollment settings


    Next, double-click the “Certificate Services Client – Certificate Enrollment Policy”
    setting. Change the Configuration Model setting to Enabled and then click Apply.
    You’ll notice that the policy shows auto-enrollment is enabled, as shown in Figure
    8-9.

    To configure the computer account to automatically obtain certificates, you configure
    the same policy under Computer Configuration. The only option that isn''t available
    is to notify about pending certificate expiration. This doesn''t matter because
    there''s no reason to notify a computer of a pending certificate''s expiration.
    Remember to allow a computer to authenticate to the wireless network, before a
    user has logged on, we''ll need to enable the configure to automatically obtain
    certificates. The location of the group policy settings for a computer account
    is; Computer Configuration | Policies | Windows Settings | Security Settings |
    Public Key Policies.


    # Create and Issue the Certificate Templates


    Now we''ve created the Group Policy settings to enable computers to automatically
    obtain certificates, we need to configure the Certification Authority with the
    certificates that users can obtain. This is a key step that can be a bit confusing.
    To start, we configure our certificate templates and then configure the CA to
    issue certificates for these templates.'
