  md: '# Chapter 2 Wireless Tools and Gadgets 25


    # Client Devices


    No, I''m not going to list every laptop you can buy. The wireless world has exploded
    so rapidly that you need to understand the security implications of all the new
    types of wireless devices. Ironically, some of the biggest security threats could
    come from client devices simply because they''re most often overlooked or ignored.


    # Phones


    Smartphones and PDAs are everywhere and are becoming more ubiquitous. These devices
    are covered in great detail later in the book, but for now consider that smartphones
    and PDAs are not just clients on your network that attackers can target (typically
    housing a large amount of sensitive data), but are also very stealthy attack tools
    for breaking into your wireless network. These devices are able to run advanced
    attack tools and store the data while sitting neatly and covertly in a visitor''s
    pocket.


    # Printers


    Many vendors offer printers with wireless technologies built right in. This provides
    a very interesting attack vector for a would-be intruder. If you connect the printer
    to your company''s otherwise secure network, does this provide an easy place to
    discover the wireless encryption password? Is the password stored securely on
    the printer, or can you simply print the configuration and view the password in
    plain text? If your printer is connected to your network using wired technologies
    but is broadcasting a default adhoc wireless SSID, can an attacker join the ad-hoc
    network and use the printer as a channel onto your wired network?


    # Access Points


    Access points have changed drastically since they hit the market. Among others,
    they''ve changed in size, functionality, bandwidth, and range. From an attacker''s
    perspective, two of the most interesting changes are of physical size and feature
    set. These new full-featured and compact access points provide a very easy attack
    scenario with relatively low risk. You simply walk into a target organization,
    find an open network data jack, plug in your access point, and walk out. Then
    you finish all your nefarious work from the parking lot, and the worst you''re
    risking is losing the access point if it''s discovered.'
  merge: -1
