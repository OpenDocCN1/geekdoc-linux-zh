    # Getting Help with Linux Commands


    Obtaining help and additional information on Linux programs and systems is extremely
    easy to do. Beside the usual Internet resources, such as forums and websites,
    you have a few built-in options for obtaining help. The three most helpful commands
    for obtaining help for known program are man, info, and help. The man command
    stands for manual, and you simply provide the name of the program as the argument.
    For example, to see the manual page for the nslookup command, you would type:


    ```

    man nslookup

    ```


    A newer version of the man command will give you more information than man. The
    syntax is exactly the same; simply provide the name of the program as the argument.
    There’s also the help command, which will give you helpful information about the
    bash shell. This can be particularly useful when you are creating bash scripts.


    You can also use the apropos and find commands if you just need a point in the
    right direction. The apro command searches the manual pages for the keyword you
    provide. For example, if you use the following command, apropos will find any
    man pages for wireless-related tools (very handy):


    ```

    apropos wireless

    ```


    Likewise, you should familiarize yourself with the find command. The find command
    simply searches the path you specify for any keywords you specify, much like the
    Windows search functionality. A very basic example would be the following:


    ```

    find / -iname "password"

    ```


    The first argument is the directory to search; in this case, we’re starting from
    the root directory and searching all subdirectories. The final argument is the
    file we’re searching for. The iname argument tells the find command to search
    for any file named password regardless of case (case insensitive). This makes
    the command extremely flexible. You can also use the special characters you’re
    used to using in Windows. For example, to search for any file with'
