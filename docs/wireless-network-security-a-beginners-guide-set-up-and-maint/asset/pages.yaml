  md: '# Glossary


    MITM attack Man-in-the-middle attack. An attack in which an attacker is placed
    in the logical path between an end station and its destination in order to view
    or manipulate their communications.


    objective desired direction The direction in which you want the metrics measurement
    to go to achieve the benefits of an information security metrics program, especially
    the benefit of improvement.


    offshoring Contracting work to resources in a different country (either third
    party or in-house).


    online analytical processing (OLAP) A specific type of data storage and retrieval
    mechanism that is optimized for swift queries that invite summarization of data
    multiple factors or dimensions.


    orchestration The administrative oversight that ensures the workflow is executed
    as specified. Orchestration includes functions as signing off on a metric definition,
    deploying its implementation, scheduling its calculation at regular intervals,
    and executing and delivering updates. See also workflow.


    outsourcing Contracting work to a third-party vendor.


    PEAP Protected EAP. An implementation of the EAP protocol within an encrypted
    TLS tunnel.


    penetration test An authorized test used to simulate the efforts of an attacker
    to determine weaknesses in a given system.


    PKI Public Key Infrastructure. The technology, servers, systems, and human processes
    that support public cryptography and digital certificates.


    PPTP Point-to-Point Tunneling Protocol. A virtual private networking technology
    commonly seen on Windows platforms.


    prioritization An exercise in determining the relative importance of tasks, projects,
    and initiatives.


    project management Defining an end goal and identifying the activities, milestones,
    and resources necessary to reach that end goal.


    project scope Indicates project coverage, typically by identifying the different
    regions, networks, and/or groups of people the project encompasses.


    quartiles The division of all observations into four groups that hold the lowest
    one-fourth of all observed values (first quartile), the highest one-fourth of
    all observed values (fourth quartile), and the two middle fourths—one-fourth above
    and one-fourth below the median value (or the value that divides the observations
    into two equal halves).'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Wireless Network Security: A Beginner''s Guide


    RADIUS Remote Authentication Dial-In User Service. A flexible system for authenticating
    users against a central database.


    RASCI A project management methodology for assigning roles in projects that involve
    many people and teams. Each letter in RASCI stands for a different type of role:
    Responsible, Approver, Supporter, Consultant, and Informed. Each role has corresponding
    responsibilities.


    RBAC Role-Based Access Control. A system for determining access to a system based
    on a user''s role within a system.


    Request for Proposal (RFP) A document that an organization uses to solicit proposals
    for a project that has specific requirements. The organization can use the responses
    to the RFP to evaluate and compare the proposals of multiple vendors.


    ROI Return on investment. The ratio of benefit to be gained from the cost of a
    given investment.


    RSPAN Remote Switch Port Analyzer. A system for forwarding traffic to a remote
    switch which can be analyzed by packet-sniffing devices.


    sacred cow An idiom for a practice that is implemented simply because it is "how
    it''s always been done," without regard for its usefulness or whether it can achieve
    a goal or outcome.


    slope of a line A value that represents how the y values are rising or falling
    as the x values of the line increase.


    Slope of line = (y3 - y1) / (x2 - x1), where (x1, y1) and (x2, y2) are any two
    points on the line


    sniffer Hardware and/or software that is capable of capturing and analyzing network
    traffic.


    SPAN Switch Port Analyzer. A network switch technology used to copy packets from
    one or more sources to one or more destinations, typically for the purposes of
    analyzing network traffic.


    SSID Service Set Identifier Identifies one or more connected Basic Service Sets,
    typically referred to as the human readable name.


    SSL Secure Sockets Layer. A cryptographic protocol used to secure tunnels over
    an insecure network. Commonly used for securing HTTP connections over the Internet.


    stakeholders Leaders responsible for critical decision-making and key supporters
    who will drive change throughout the organization.'
