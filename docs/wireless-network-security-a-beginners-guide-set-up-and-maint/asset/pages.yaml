    To then allow only the file owner to read and write the file, you would use this
    command:


    ```

    chmod u+rw file.txt

    ```


    Any program you wish to run needs to have the execute bit set. Thus, to allow
    any user on the system the ability to execute the program, use the following command:


    ```

    chmod a+x /program

    ```


    Although there is more you need to know when configuring permissions on files
    and directories, this is enough to get you started.


    # Basic Scripting


    Scripts are extremely easy to create to perform very complicated tasks. The most
    basic scripts use the native shell of choice; however, more robust languages as
    Perl exist to handle more advanced tasks. Using scripts, you can call any external
    program by simply typing it exactly as you normally would, with all the same arguments.


    Let''s take a look at a basic script. Open the ged editor by typing edit in a
    terminal or by opening Applications | Accessories | Text Editor. Enter the following
    text and save the file as script.sh:


    ```

    #!/bin/bash

    echo "== Checking Current Date {}

    date

    echo "== Currently logged in users ==="

    who

    ```


    Finally, this file executes permissions with the following command:


    ```

    chmod a+x script.sh

    ```


    In Figure-16, we can first check for the permissions of the file to ensure it
    is executable. We do this by running ls with the -lh options and then grep for
    our. We can see that the execute bit is set. We then run our script, which gives
    us some notice as well as the date and what commands included in it. You''ll notice
    that for two lines we included the echo command, which prints the text we include
    into the terminal. The double equals signs don''t mean anything special; we just
    add them to make our output a little easier to read.


    If you find yourself frequently typing the commands over again, you should consider
    creating a custom script to save yourself some keystrokes.'
