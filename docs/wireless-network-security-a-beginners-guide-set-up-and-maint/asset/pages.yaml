    # Understanding Linux File Permissions


    Linux file permissions are very different from Windows file permissions. This
    can be tricky for new comers, but it''s easy once you get used to it. To view
    the permissions of a file or directory, simply use the -l for ls. Figure A-15
    shows a directory with two results.


    ![](img/78ecc761d1e6376868e68bf50b83b97a_339_1.png)


    Figure A-15 Viewing permissions from the command line'
  merge: -1
