  md: '# Chapter 6 Theory of Defense for Securing Wireless Networks 159


    # Wireless Intrusion Detection and Intrusion Prevention Systems


    Wireless IDS and IPS feel way more like buzzwords to make sales than an actual
    shiny, new technology. It is true that some of these systems actually use wireless
    interfaces to monitor the airwaves for different attacks, but I would like to
    pose a question: Is really necessary? I''ve had to deal with wireless-specific
    IDS alerts, and I can tell you for the most part they''ve been relatively meaningless
    and inactionable. I lean toward well-configured traditional intrusion detection
    systems being more meaningful than their new wireless counters. For example, in
    a wireless IDS, you might receive alerts that the system observed a client device
    probe for wireless networks but never join a network. It is, of course, a normal
    (and frequent) occurrence for a wireless client to join a network but not find
    a suitable network in the area.


    Again, this doesn''t mean there''s no value in a wireless-specific IDS—that depends
    on your business needs and objectives. New access points can actually serve as
    IDS agents, which forward the events to a central system for analysis and reporting.
    This is nice way to use existing wireless technologies to simulate a wireless
    IDS. We''ll explore some of these technologies in a future chapter.


    > IMHO

    My opinion is that most true wireless attacks are detectable with a traditional
    IDS and don''t need to monitor the airwaves. For example, the ARP replay attack
    against WEP is definitely detectable from the LAN side of the network.

    In experience, most of the wireless-specific signatures have been closer to useless
    based on the way wireless networks and clients operate than anything. For example,
    do you really need to know that a new client has probed for wireless networks
    has joined any? Keep in mind I''m not arguing that wireless IDS offers no value,
    but rather that you can get the same value from existing (probably less expensive)
    technologies.

    Many people like the rogue access point detection capabilities of wireless IDS
    systems, but again this can be accomplished (and potentially with more accuracy)
    using a hardwired IDS. We''ll cover rogue access point detection in a future chapter.


    # Honeypots'
