  md: '# Wireless Network Security: A Beginner''s Guide


    # Into Action


    I have successfully used this attack during a penetration test. After configuring
    my laptop to respond to beacons from a target smartphone, the client associated
    to my laptop. After a short period of time, the smartphone logged into an e-mail
    account not associated with the company. Lo and behold, the same password was
    used for the company’s login account.


    Now, also consider other processes that might be automatic and present a similar
    attack vector to your client devices:


    +   * Social media (Facebook, Twitter)

    * Geo-location applications

    * Backup systems

    * RSS feeds


    These systems may pose a very similar threat of being directly exploited if they
    use weak authentication mechanisms. Keep in mind that authentication is not restricted
    to cleartext authentication. However, there are additional possibilities for exploitation
    beyond just login credentials.


    Many systems rely on cookies or other session data to provide that a user is logged
    into a website. If an attacker is able to sniff this data and send it to the remote
    system, he may not need to authenticate at all.


    We discussed in a previous chapter how a man-in-the-middle (MITM) attack works.
    In addition to the underlying attack works, you should understand some of the
    options an attacker has once the client is routing traffic through a system under
    the attacker’s control. Many people think that using a secure protocol such as
    SSL (Secure Sockets Layer) is enough to protect their data from being viewed;
    however, there are vulnerabilities you should be aware of.


    # Man-in-the-Middle Attacks


    When an attacker is in position to perform a man-in-the-middle attack, he essentially
    has free reign to control what the user sees. Frankly, an entire volume of books
    could be written on all the possible ways for an attacker to exploit communications
    once he’s in position to perform a man-in-the-middle attack. I’ve chosen a few
    select attack methods'
