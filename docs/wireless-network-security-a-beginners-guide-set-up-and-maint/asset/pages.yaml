    **Figure 7-12** Certificate Authority Hierarchy


    ### Handling Compromised Certificates

    What happens if a certificate is compromised? How do we alert users to no longer
    trust that certificate? To do this, Certificate Authorities will use Certificate
    Revocation Lists (CRLs) or the Online Certificate Status Protocol (OCSP). A CRL
    is literally just a list of certificates that have been revoked. The Certificate
    Authority that issued the certificate will be responsible for revoking the issuing
    CA will mark the certificate as revoked. Any certificates that have been revoked
    are listed by serial number in a file that is publicly available. The problem
    with CRLs is that they can grow to be very large and a little cumbersome to manage.
    OCSP was developed to deal with these shortcomings. OCSP is a simpler request/response
    protocol typically handled over HTTP to determine the status of individual certificates.


    # ### Into Action


    If your root CA is compromised, you''ll have to revoke all of your certificates
    and redeploy all of your enterprise Certificate Authorities. Therefore, either
    powering off your root CA or otherwise removing it from the network is advisable.'
