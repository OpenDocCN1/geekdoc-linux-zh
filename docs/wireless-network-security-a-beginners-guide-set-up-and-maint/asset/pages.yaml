  md: '# Chapter 3 Theory of Attacks on Wireless Networks 59


    Because WEP uses the RC4 cipher (a stream cipher) to encrypt data, it is necessary
    never to use the exact same key to encrypt two packets. This is an important concept
    to grasp to understand one of the major flaws of WEP. With the fact that the key
    can never be exactly the same, every packet includes a 24-bit pseudo-random number
    called an Initialization Vector (IV) so that the key is never the same for any
    packet.


    Encryption Key = [Initialization Vector] [WEP-Key]


    > Note

    Computers are essentially unable to create truly random numbers because the number
    generated will be based on a calculation that is technically possible to reverse.
    Thus, "random" numbers are typically referred to as pseudo-random. Typically,
    a pseudo-random number will be created using something that changes often, as
    the current time and the contents of memory. Of course, more other security techniques
    have this a grain of salt--there are stronger and weaker ways of generating pseudo-random
    numbers on a computer, but the theory remains the same: Under circumstances, a
    weak implementation may allow an attacker to "reverse engineer" how a "random"
    number is generated.


    You might be. “Wait a minute, if the encryption key now has a random 24bit value
    on the end of it, how does the client know how to decrypt the packet given that
    it won’t know the true key?” An excellent question, Young Grasshopper. I can see
    you’re actually paying attention. For the receiver of the packet to know how to
    decrypt the packet, he also needs to know the Initialization Vector value. So
    how do we get this to the receiver? Simple. We send it as a cleartext field as
    part of each packet.


    In 3-12 you''ll see an example of a Wireshark packet capture session of WEPencrypted
    communications. Notice the field labeled "Initialization Vector" is a 24bit numeric
    field. You can see that each packet has a different IV.


    WEP was the standard for encryption wireless networks even after it had been broken.
    As painful as it sounds, I still find many businesses think it’s acceptable to
    use WEP in certain situations. You’ll soon understand, this simply isn’t the case,
    and WEP should be avoided like the plague.


    +   Here’s a quick refresher of all the major points of WEP for easy reference:

    * RC4 algorithm

    * Stream cipher

    * Shared secret

    * 40-bit or 104-bit key length

    * Encryption at Layer 2'
