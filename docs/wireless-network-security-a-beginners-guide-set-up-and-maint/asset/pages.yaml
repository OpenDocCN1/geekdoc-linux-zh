  md: '# Wireless Network Security: A Beginner''s Guide


    # Fake AV Updates


    Another very interesting attack vector that can be considered an attack on automatic
    operations. Most antivirus programs are configured to download antivirus signatures
    and program updates periodically, from an internal server or a server accessible
    over the Internet. Either way, if an attacker is in position to perform a man-in-the-middle
    attack, he can abuse this process.


    When the antivirus program tries to download the signature updates or program
    updates, the attacker will substitute its malicious program that will run much
    like a Trojan virus. There is already released code to do exactly.


    > LINGO

    Many people have different concepts as to what constitutes a Trojan virus. Oftentimes
    people seem familiar with viruses will classify a program as a Trojan virus only
    if it provides remote access to an attacker. This is one common type of Trojan,
    but I believe the true definition is any malicious program that purports to be
    a legitimate program. I think a fake antivirus update fits that bill nicely.


