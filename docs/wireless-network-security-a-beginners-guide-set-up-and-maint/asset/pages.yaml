  md: '# Allow Pre-logon Authentication


    We discussed the advantages of configuring the computer to connect to the wireless
    network before the user has authenticated to the computer. There are many benefits
    to this, not least of which is the fact that users who have not logged onto the
    workstation before can authenticate to Active Directory without having to be hardwired
    to the network.


    You''ve already configured the majority of what you need from the client''s perspective.
    You only have one more task. You need to configure a wireless network that the
    computer will connect to without user intervention using Group Policy. You can
    choose to create a new Group Policy or add to the certificate auto-enrollment
    policy we created earlier. I typically recommend creating a new Group Policy Object,
    but you can decide for yourself. By creating a new Group Policy, you can avoid
    any confusion as to what the Group Policy does, if you choose to add these settings
    to another Group Policy and later decide to remove that policy (forgetting that
    the wireless settings are there), you''ve created an unnecessary headache for
    yourself.


    Create a new Group Policy Object and navigate to Computer Configuration | Policies
    | Windows Settings | Security Settings | Wireless Network (IEEE 802.11) Policies.
    If you right-click the Wireless Network (IEEE 802.11) Policies node, you will
    see two options:


    +   - Create a New Wireless Network Policy for Windows Vista and Later Releases

    - Create a New Windows XP Policy


    The configuration options are almost identical between the two. We''ll focus on
    the Windows XP policy because Windows XP is currently the most popular Windows
    operating system. In Figure 8-15, you''ll see the configuration options on the
    General tab. Most of the configuration here is self-explanatory: Give the policy
    a name and configure it to connect to infrastructure networks only.


    Next, click the Preferred Networks tab and click Add to add the settings specific
    to your wireless network. You''ll see the New Preferred Settings Properties window
    in Figure 8-16. Again, most of this is straightforward, and you''re really just
    configuring it to the SSID, authentication, and encryption settings of your wireless
    network.


    Next, click the IEEE 802.1x tab to configure the authentication settings. This
    is where you configure the computer to authenticate to the network using certificates.
    Your configuration should look similar to Figure 8-17.'
  merge: -1
