    # Into Action


    As you can see from the previously mentioned technologies, a common security method
    is to disable a port if it violates one of the configured policies. One way to
    add another layer of security to your switches is to simply disable any unused
    ports. Now this isn''t a perfect solution in itself, but it''s definitely a good
    practice to adopt. Again, this will add more administrative work because you''ll
    have to manually enable a port when you need to connect a new device, but this
    is a relatively easy task and pretty common in some industries. Keep in mind,
    though, alike doesn''t prevent an attacker from stealing a network connection
    from an operational jack and plugging an access point into it. To prevent this,
    you''d want to use multiple security measures, such as using 802.1x and disabling
    unnecessary ports.


    You could also choose to only allow MAC addresses to enter the switch through
    the configured ports. The MAC addresses that are allowed on a specific port are
    referred to as secure MAC addresses. You can manually define the MAC addresses
    allowed on a port, let them dynamically, or by a combination of the two.


    Port security actually has many more configuration options. We''ve covered a few
    of the most common scenarios for configuring port security. For a more in depth
    look at the configuration options available, check out the Cisco website.


    # Manually Detecting Rogue Wireless Networks


    Manually detecting rogue wireless networks is currently the most prevalent method
    of detection. Of course, one of the core methods for manually detecting rogue
    wireless networks involves some of the skills you learned in Chapter 4. Essentially,
    you''ll be wardriving in your office area, even though you might not be in your
    car.


    First, how do we define a rogue wireless network and what should you do if you
    find one? A rogue access point is an unauthorized wireless device that is connected
    to your network. Once you enumerate a potential wireless device, you need to determine
    whether it''s connected to your network.


    The first step is to choose the enumeration tool you wish to use. Remember, you
    can''t rely solely on the built-in tools in your operating system because they
    won''t show wireless networks that aren''t broadcasting their SSID. In addition,
    you''ll need a tool that can show you the MAC address of the access point as well
    as has the ability to capture traffic and show associated client devices. Why
    do you want the ability to'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Wireless Network Security: A Beginner''s Guide


    capture traffic? The more information you can obtain about the target network,
    the better. This includes client MAC addresses associated with the rogue wireless
    network and IP addresses of clients and destinations.


    You''ll also want to account for different technologies as well as 802.11a/b/g/n,
    for example. If you''re scanning your environment with 802.11n ac, you won''t
    be able to enumerate any 802.11a wireless networks in your area. Therefore, let''s
    choose the tool to use. As you''ll refer to Chapter 4, your best choices are the
    following:


    +   * Kismet Open sources, runs on Linux, very flexible

    * Netstumber Windows based, GUI oriented, very easy to use

    * Macstumber Mac OS, GUI oriented


    If you enumerate an rogue network, you have a few choices for determining where
    it terminates. The simplest way to determine whether it''s your network is to
    associate with it. Once you''re associated, you should check your IP address to
    see if it''s an internal address on your network. You shouldn''t stop there, however,
    because the access point could be performing Network Address Translation (NAT).
    So might try to ping or browse to an internal server, and as a last resort you
    can always check the current IP address of the Internet connection by browsing
    to a website such as Whatismyip.com.


    If you enumerate an encrypted rogue network, what would you do? Based on everything
    you''ve learned, don''t assume that because a wireless network is encrypted that
    you should ignore it. Remember that a crafty attacker might secure the wireless
    network to prevent eavesdroppers from seeing what he''s doing. If an employee
    was responsible for placing the encrypted access point on your network, it could
    still pose a security risk. What if the encryption key is weak or, or even, a
    default? Therefore, you should take measures to determine whether an encrypted
    network is connected to your network.


    How do you go gathering enough intelligence on an encrypted wireless network without
    attempting to crack the encryption? Easy. Even though the network is encrypted,
    you can still see the MAC addresses of clients associated to the network as well
    as that of the access point itself. If you search your network switches for those
    MAC addresses, you can determine whether they are on your network.


    Remember that MAC addresses are a total of six bytes, usually represented as 12
    hexadecimal digits. The first three bytes represent the organization unique identifier
    (OUI). The last three bytes are specific and unique to the end station (see Figure
    11-4).


    This technique offers an effective way to track down wireless access points without
    using wireless technologies and using only your switching infrastructure. If you''ve'
