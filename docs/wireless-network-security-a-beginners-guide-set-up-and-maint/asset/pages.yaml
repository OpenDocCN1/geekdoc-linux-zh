  md: '# Chapter 11 Handling Rogue Access Points and the Future of Wireless Security
    275


    # Into Action


    Rogue wireless networks have received so much attention that some compliance standards
    require businesses to specifically address them. For example, the Payment Card
    Industry (PCI) Data Security Standard, which is the security standard that companies
    process credit card information must comply with, has the following requirement:


    PCI-DSS 2.0: 11.1 Test for the presence of wireless access points and detect unauthorized
    wireless access points on a quarterly basis.


    Even though your organization might not have to comply with PCI, this is still
    a great process to adopt.


    # Preventing Rogue Wireless Networks


    There are actually very reliable ways to prevent rogue wireless networks from
    working on your network. You should note that I didn''t say “prevent them from
    being plugged into your network.” There''s really no way to try prevent rogue
    wireless devices from being plugged into your network. The best you can do is
    educate your users on the dangers of plugging rogue devices into your network
    and back up the policy with administrative discipline if users don''t comply.
    As far as preventing outsiders from placing rogue devices on your network for
    malicious purposes, you have to rely on your physical security to do this. In
    addition, you should educate users to notify the IT department if they notice
    anything plugged into a network jack that doesn''t look like it belongs.


    Therefore, if you can''t rely on preventing the devices from being plugged into
    your network, you should focus on preventing them from functioning properly once
    they are plugged in. Here are your best solutions for preventing them from operating:


    +   - 802.1x (Port-Based Access Control)


    +   - Network Access Control


    +   - Port Security


    # 802.1x Port-Based Access Control


    Yes, good old 802.1x. You should be very familiar with it at this point. Remember
    that 802.1x does not allow a device to communicate past the authenticator (in
    this case, a network switch) until after the device has authenticated. For a more
    in-depth refresher of 802.1x, you should revisit Chapter 9. In this case, the
    network switch should play a'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Wireless Network Security: A Beginner''s Guide


    role similar to that of an access point configured for WPA2-Enterprise, and would
    be considered our 802.1x authenticator.


    Just as 802.1x for wireless networks, we have the flexibility to authenticate
    against a variety of backend systems. In Figure 11-1, we can see we are authenticating
    to a RADIUS server, which authenticates the user against Active Directory. The
    same restrictions we covered in previous chapters can be configured here—restrictions
    based on user, group, or even time of day to grant access to the network.


    If you configure switches to require 802.1x authentication, how will this prevent
    an unauthorized wireless network from operating on your network? The first and
    most important point is that an attacker will not have valid credentials for your
    network. Even if an attacker plugs a device with an 802.1x supplicant (client
    software) into your network, he won''t be able to authenticate, and the port will
    be useless to the attacker.


    Most access points don''t have 802.1x supplicant software, so that prevents most
    devices from being able to even operate on your network. This would also prevent
    regular users inside access today who try to plug a regular access point into
    the network because it would simply not work.


    There is one situation that 802.1x would not help to prevent. If an insider (most
    likely with malicious intent) were to use a device such as a laptop to act as
    an access point, the user could authenticate the switch using her credentials
    and configure the wireless card on the laptop to provide wireless services to
    other users (see Figure 11-2). In this scenario, 802.1x alone would have no way
    of preventing this action. You should note, however, that this is an extreme scenario,
    and if you have an inside user capable of doing this, you probably have bigger
    issues on your hands.


    We''ll now look at the most basic example of configuring 802.1x on a Cisco switch.
    After entering configuration mode, we define our RADIUS server with the radius-server
    command. In this example, our RADIUS server is 10.0.0.10 and we''re using a RADIUS
    password of RadPassword1.


    # 802.1X with Network Switches


    ![](img/78ecc761d1e6376868e68bf50b83b97a_294_0.png)


    Figure 11-1 802.1x network switches'
