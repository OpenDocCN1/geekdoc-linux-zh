  md: '# Chapter 5 Attacking Wireless Clients


    I''m not saying we should completely shift our focus from the network to our client
    devices, but there is a happy middle ground. We also have to look at the risks
    we''re mitigating and how much it will cost us to do so. We''ll discuss device
    security options in a future chapter.


    # Physical Security Is Often Completely Neglected


    Continuing the previous thought that most wireless clients aren''t given as much
    attention as other devices, one of the quintessential benefits of wireless technology—portability—can
    also be one of its greatest weaknesses. The obvious threat is someone walking
    away with your device while you''re not looking. Take a minute to think what someone
    get access to if they walked away with your laptop or smartphone while you weren''t
    looking. Do you have sensitive files, e-mail accounts, personal messages?


    Of course this deserves some serious thought, but it is not the only. Consider
    simply stealing a laptop. If an attacker targets one of your users but wants to
    be a little more stealthy then imagine a scenario where a user is at a coffee
    house, and the three cups of coffee are weighing heavy on his bladder. He gets
    up to go to the restroom and neglects to lock his laptop. This is just the moment
    the attacker has waiting for. The attacker springs into action, inserts a USB
    thumb drive into the user''s laptop, waits to verify the flash of a command prompt,
    indicating that his program has run, removes the USB drive, and quickly slips
    out of the coffee house.


    When all is done, it takes the attacker all of ten seconds to install his malicious
    program, which logs all the keystrokes on your user''s laptop, sends them back
    to the attacker, and gives him complete access to any files on the system. Not
    bad considering he had three minutes while your user relieved himself in the men''s
    room.


