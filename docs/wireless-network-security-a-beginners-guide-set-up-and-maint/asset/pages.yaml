    > Note

    Another important benefit to using certificates is known as *nonrepudiation*.
    Essentially, if you sign a message using your digital signature, it proves that
    only someone with your private key (which should only be you) created the message.
    This means that you can''t deny (or repudiate) that you approved the message.
    This can be a very good thing when dealing with legal contracts (and other critical
    communications) in a digital world; however, it doesn''t necessarily relate to
    authentication, so we won''t cover further.


    Authenticating as using your wireless network is slightly different from an e-commerce
    website authenticating to you. Conceptually, it''s almost identical. You will
    present your certificate to an authentication server over your network. Your certificate
    will contain your public key and the signature of a Certificate Authority that
    your authentication server is configured to trust. We''ll cover this in more detail
    later in the chapter.'
