  md: '# Chapter 4 Attacking Wireless Networks 85


    > IMHO


    With so many options for enumerating wireless networks, which one should you choose?
    Again, it depends. Depending on the situation, you might find it easier and more
    stealthily to use your phone. If it''s a long trip and you''re just curious what''s
    out there, bringing Kismet on your laptop might be a good way to go.

    During most penetration tests, I''ll find myself actually using the functionality
    of airodump to find available wireless networks rather than Kismet. You''ll see
    in the next chapter that the simple and straightforward output from airodump can
    be very handy.


    # Actively Attacking Wireless Networks


    Now that we''ve learned how an attacker would identify a network worth targeting,
    let''s take the next step and actively attack the network. For our first example,
    we''ll target a WEP-encrypted network and move on to a WPA-protected network.

    The tools we''ll use in this chapter are listed in the following table. Collectively
    these tools are all in the aircrack-ng package.


    | Tool | Description |

    |--- |--- |

    | airmon-ng | A bash script designed to enable monitor mode on a wireless interface
    |

    | airodump-ng | A wireless packet capture tool for aircrack-ng |

    | airplay-ng | Injects packets into a wireless network to generate traffic |

    | aircrack-ng | An 802.11 WEP or WPA-PSK key cracker |


    # Cracking WEP Encryption


    Cracking WEP requires the following basic steps:


    +   1. Identify the target wireless network.

    2. Put your wireless card into monitor mode using airmon-ng.

    3. Start saving traffic on the channel associated with the target wireless network
    using airodump-ng.

    4. Attempt to crack WEP key using aircrack-ng.

    5. If more traffic is needed, perform a packet replay attack using airplay-ng.

    6. Crack the WEP key using aircrack-ng.'
