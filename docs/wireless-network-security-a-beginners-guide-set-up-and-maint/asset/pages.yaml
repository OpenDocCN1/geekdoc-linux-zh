    Boot. The other options are definitely worth exploring, but won''t help you with
    the examples.


    Once BackTrack is finished booting, you''ll see a terminal prompt similar to the
    following:


    ```

    root@root:~#

    ```


    You''ll notice two notes above the terminal prompt instructing you that the default
    root password is poor (simple root backwards) and the command to start the graphical
    environment is startx. To start the graphical environment, you type startx, which
    loads X. Linux, unlike Windows, is not deeply tied to a graphical environment
    and can be run without loading the graphical environment. The graphical environment,
    referred to as X or X11, is very basic. On top of X you run a window manager,
    which adds features and makes Linux look even ''prettier''.


    # The Gnome Graphical Environment


    The Linux interface is intuitive, and in very little time you''ll be moving around
    like a pro. The bar at the bottom of the screen shows you all your open windows,
    much like the taskbar in Windows. These bars are referred to as panels in Gnome.
    Unlike Windows, the button at the bottom left is not the Start button; instead,
    it minimizes all the currently open windows. Also, you''ll notice four squares
    along the right side of the same bar. These represent virtual desktops, which
    keep your open windows separate. It can be extremely handy when you have many
    open windows. You can open windows designated for a specific task on one desktop
    and switch through the other desktops by clicking the corresponding icons in the
    bottom right.


    The dragon icon in the upper-left corner operates very similar to the Windows
    Start button. Click it to view a list of groupings of common programs. From the
    Internet group, you can launch the Firefox browser or Wcid Network Manager. The
    Wcid program is used to configure your wireless and network interfaces through
    a simple-to-use graphical interface. If you''ve used the Windows wireless configuration
    tool, you''ll have no problem using Wcid.


    You''ll also see a Places button on the main panel. It includes shortcuts to "places"
    such as your home folder and many locally attached drives. To the right of this
    you''ll see the System button, which contains many of the tasks you''d expect
    to find under the Control Panel in Windows, such as configuring your mouse, keyboard,
    sound, power management, and so on.'
