  md: '# Chapter 1 Introduction to the Wireless Security Mindset 19


    The management system would then telnet (or connect using another management protocol)
    to the access point and apply the configuration. This, of course, requires that
    the administrator configure basic IP connectivity to the access point and enable
    Telnet. Therefore, a level of administrative burden is associated with adding
    new access points.


    To make things even easier on administrators, we have a new generation of access
    points that are commonly referred to as lightweight access points. A few protocols
    do with lightweight access points, mainly the Cisco proprietary LWAPP (Lightweight
    Access Point Protocol) and CAPWAP (Control And Provisioning of Wireless Access
    Points), which is a standard, interoperable protocol based on LWAPP. It is not
    necessary to understand the specifics of these protocols; they will be discussed
    in greater detail later.


    Lightweight access points generally allow an administrator to perform 99 percent
    of the configuration ahead of time, thus greatly reducing the total administrative
    effort. An administrator can create a profile that completely configures an access
    point. When a new access point is added to the network, it "discovers" the controller
    and "automically" downloads and applies the appropriate configuration. A myriad
    of options are available for how the access point discovers the controller and
    how it downloads We will be reviewing these options in Chapter 11. The important
    thing to note is that you don''t even need an IP address configured on your lightweight
    access points. You can literally configure your new lightweight access point out
    of the box, plug it into your network, and it will be configured automically and
    provide wireless services within minutes.


    Think about how beneficial this would be for large-scale deployments. However,
    although this is the latest and greatest technology for configuring wireless access
    points, it is not necessary for all new wireless deployments. You must evaluate
    the return on investment. In many cases, just configuring (a few) access points
    by hand can be a much more cost-effective solution. We will evaluate the different
    options for using a controller-based system in a few scenarios in later chapters.


    # SSID, BSSID, MAC Address


    The SSID, BSSID and MAC address are all essential unique identifiers for a wireless
    network. The Service Set Identifier (SSID) is the human readable name associated
    with an 802.11 wireless network. It is often called the wireless "network name"
    and can be shared by multiple access points. The Basic Service Set Identifier
    (BSSID) uniquely identifies a specific access point and is in the same format
    as a MAC address; thus, most commonly, it is the MAC address of the access point.
    The Extended Service Set Identifier (ESSID) can essentially be thought of as a
    group of BSSIDs that share the Layer 2 network and the same SSID.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Beacons and Broadcasts


    Access points send out beacons, which are radio broadcasts that advertise the
    wireless settings for a specific BSSID. These settings typically contain the SSID,
    encryption method, and so on. Many access points have an option to disable the
    broadcast of the SSID. Enabling this option does not typically disable beacons
    but rather configures the access points to send a beacon with a blank SSID. However,
    this does not prevent an attacker from obtaining the SSID, which you will read
    about in Chapter 3.


    # Associating and Authenticating


    Association and authentication are performed by clients when they want to join
    a wireless network. Associating to an access point means your client and the access
    point have “agreed upon” parameters to ensure proper communication. Things such
    as the channel and encryption method have been verified to be the same. Authentication
    is a way of verifying that you are authorized to connect to the network. There
    are multiple methods of authentication, and authentication happens prior to association.
    We will discuss the vulnerabilities with certain authentication mechanisms in
    Chapter 3 as well as look at examples of more secure options.


    Encryption is utilized just as it is in any other technology. It obscures the
    data so that only “authorized” people can view the actual data. You have many
    different choices for encryption network data; some are new implementations created
    for wireless technologies, and others have been around for a while. In Chapters
    3 and 4, we explore these encryption options as well as some cracks of them.


    # We''ve Covered


    In this chapter, we covered the foundational knowledge you should have to get
    the most from this book. We reviewed 11 different security principles that apply
    across many scenarios, not just wireless networking. We also covered the fundamental
    components for wireless communications, including the basics of wireless networking.
    We’ll refer to the topics introduced here in more detail in future chapters, but
    you can always refer to this chapter for a reference on the basics.'
