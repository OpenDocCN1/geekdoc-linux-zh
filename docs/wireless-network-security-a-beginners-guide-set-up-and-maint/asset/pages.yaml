  md: '# Wireless Network Security: A Beginner''s Guide


    802.1lx Port-authentication. 802.1x denies users access to a network segment to
    which they are physically connected until the user has authenticated.


    802.1lx Shorthand for referring to all the 802.11 technologies: 802.11a, 802.11b,
    802.11g, and 802.11n.


    AES Encryption Standard. A symmetric-key encryption algorithm by various technologies.


    ARP Address Resolution Protocol. A Layer 2 protocol used to determine the Layer
    2 (MAC) address for a given Layer 3 address.


    audit A formal check to determine policy compliance, typically performed either
    by internal auditors at an organization or by an independent third party.


    availability The degree to which information is available when it is needed by
    authorized parties. Availability may be measured as the percentage of time information
    is available for use by authorized websites. For example, a business website may
    strive for availability above 99 percent.


    Balanced Scorecard (BSC) A performance measurement framework that is intended
    to enrich traditional financial performance measures with strategic nonfiction
    performance measures, giving a more balanced view of organizational performance.
    Developed in the 1990s by Dr. Robert Kaplan (Harvard Business School) and Dr.
    David Norton. (For additional information, see www.balancedscorecard.org.)


    Black Swan event An event that is highly improbable and likely to end up at the
    bottom of the list of priorities to address. See The Black Swan: The Impact of
    the Highly Improbable, by Nassim Taleb, for further reading on the theory of Black
    Swan events.


    botnet A malicious network of computers is used to transmit information, send
    spam, or launch denial-of-service (DoS) attacks on the attacker''s specified target.
    Essentially, a malicious botnet is a group of computers, acting as a supercomputer,
    created and managed by a hacker, fraudster, or cybercriminal.


    brute force A somewhat nontechnical approach to obtaining a password in which
    every combination of possible choices is attempted until the correct value is
    obtained.


    BSS Basic Service Set. The most basic group of wireless stations communicating
    to form a wireless network.


    SSID Basic Set Identifier. A unique identifier for a BSS. It takes the same format
    as a MAC address.


    captive portal A technology that intercepts a user''s network session and prevents
    him from reaching the intended service until he has performed a specified task
    such as accepting the terms of service or providing authentication information.'
