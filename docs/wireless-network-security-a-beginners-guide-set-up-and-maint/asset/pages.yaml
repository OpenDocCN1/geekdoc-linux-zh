    You should keep in mind that sometimes the signal strength alone can be a little
    misleading. Although it would be extremely rare for you to be sent on a wild goose
    chase very far from your target network, sometimes the raw signal chart can be
    a little misleading. Once you have a generally strong signal strength, you should
    look in the vicinity for the target access point.


    You should also take into account that typically when the device is placed right
    side up with the antennas facing upward, the signal tends to propagate stronger
    in a half bubble shape, as shown in Figure 11-7. Therefore, in some scenarios,
