    that the RADIUS authenticator (in this case, the access point) is completely unaware
    of how you authenticate to the destination RADIUS server. Whether you use certificates
    or simple passwords, the configuration is the same on your access point because
    the actual authentication is handled on the RADIUS server.


    # Authenticate to the Wireless Network


    Now that we''ve configured all the infrastructure components to support our wireless
    network, the only thing we have left to do is authenticate. Because we''ve already
    verified that the user certificate is installed on the client machine, virtually
    no user interaction should be required to connect to the wireless network. If
    you haven''t configured the wireless network to auto-connect using Group Policy,
    all the user has to do double-click the wireless network to connect to. When connecting,
    you should briefly see the message shown in Figure 8-25, indicating that the user''s
    identity is being validated.


    Once successfully connected, you should see the familiar “connected” message.'
