  md: '# Chapter 3 Theory of Attacks on Wireless Networks


    > Note


    Sometimes when people describe attacks such as MITM, they say things like, “You
    trick your victim into sending data through you.” Although from a human perspective
    this makes sense, it is vital that you understand how this is a fundamentally
    incorrect statement and can be explained by the following concept:


    A computer only does what it''s programmed to do.


    This is true when you''re talking about buffer overflows, denial of service, and
    man-in-the-middle attacks. The only argument someone could make to oppose this
    is when something is wrong with a physical component of a computer... but we won''t
    go there. Therefore, for man-in-the-middle attacks, you need to understand that
    the components involved—client computers, routers, switches, and so on—are only
    doing exactly what they''re programmed to do.


    The following are some of the more common techniques for establishing a man-in-the-middle
    attack:


    +   - ARP spoofing or ARP poisoning

    - Rogue DHCP server

    - ICMP redirects


    > LINGO Buffer overflow attacks involve providing too much data to a program,
    which can sometimes lead to manipulating the execution of the vulnerable program.


    Let''s look at each of these in more detail.


