    configure a wireless network or even double-clicking the available wireless network,
    we can configure a Group Policy Object (GPO). You can choose to create a new group
    policy or add to an existing GPO. I typically recommend creating a new Group Policy
    Object, but you can decide for yourself. Keeping each GPO unique to a general
    set of tasks is a good system for avoiding human error.'
