  md: '# Wireless Network Security: A Beginner''s Guide


    # We''ll Cover


    +   * What you will learn

    * The 11 security principles

    * Wireless networking basic concepts


    Since their introduction, wireless technologies have quickly reached ubiquity
    in both the commercial and residential space. One of the primary benefits of using
    wireless technologies over traditional wired technologies is their ease of use.
    Use of use, with many other technologies, comes with serious security concerns.


    Based on some media reports, you might think that wireless are riddled with security
    holes that are almost impossible to plug. There have been reports of “hackers”
    driving around town, laptops in hand and large antennas sticking from cars, who
    are able to penetrate any wireless network with the click of a button. Although
    there is some truth to these reports, most of the time they are check of sensationalism.
    In this book, you will learn technical details of wireless vulnerabilities and
    how to actually exploit them. I will also present real-world solutions and mitigating
    controls to minimize these security risks.


    If you are tasked with managing the security of your company’s existing wireless
    network or by evaluating the risks associated with implementing a new wireless
    network, you will find in this book the resources necessary to make sound decisions
    in managing the risks associated with wireless technologies. This book is geared
    toward the IT professional who wishes to get up to speed on securing his wireless
    network, if you have interest in current wireless security threats, to exploit
    them, and how to defend against them, you will likewise find this book interesting
    and enlightening. The foundation for mitigating security risks is always a sound
    education. Your education begins now.


    # What You Will Learn


    In this book, you will not find a mind-bending array of technical details for
    implementing wireless networks, you will also not find a review of networking
    in general. You are expected to have a baseline understanding of the configuration
    and implementation of wireless networks. For an introduction to wireless networking,
    as Bruce Hallberg’s book Networking: A Beginner’s Guide, Fifth Edition (McGraw-Hill,
    2009).'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Chapter 1 Introduction to the Wireless Security Mindset 5


    You will, however, find the information you need to quickly get up to speed on
    the issues and mitigating defenses for wireless technologies. You will also find
    easy-to-follow real-world examples of attacks against wireless technologies and
    examples of the applicable mitigating defenses. In addition, you will find real-world
    solutions to common objectives for wireless networks. Whether you need a refresher
    in securing wireless networks or to add a new skill set to help advance your career,
    you will find the information easy to digest and, above all, relevant to the real
    world.


    # Security 101: The 11 Security Principles


    Despite your familiarity with security fundamentals, a quick review is essential,
    if no other reason than to ensure we are speaking the same language. Take your
    time in this section and make sure you understand all the security principles
    before moving on.

    Following are 11 principles you will find relevant to any security process you
    participate in. You will find most of these principles relevant to any security
    discussion, regardless of the technology, whether it''s wireless networking, Bluetooth,
    network security, or even physical security practices.


