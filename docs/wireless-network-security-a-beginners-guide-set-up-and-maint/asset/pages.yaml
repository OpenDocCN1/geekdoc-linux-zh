    # Store and Crack at Your Convenience


    Here’s an interesting attack vector consider: What would happen if someone were
    to capture all the network traffic they can, and then wait for an exploit to be
    made available to crack that encryption? This is definitely something that needs
    to be considered for environments that demand the highest level of security. The
    main thing that you need to consider is the expiration date of the data traveling
    over your wireless network. For example, consider a small business. If someone
    were to capture their network traffic and crack it later, the data might be worthless
    as all the passwords have expired and the communication is old news (hopefully).


    Now consider a highly sensitive agency. If an attacker were to capture their network
    traffic and crack it, the data could contain confidential information that has
    no expiration date. For example: Social Security Numbers, government secrets,
    names of undercover agents, Nuclear launch codes, etc.


    Take into account that sniffing wireless traffic is a completely passive activity,
    which means you have some serious concerns on your hand. This is one of the reasons
    why I’ve said for the longest time that wireless networking might not be suitable
    for all environments, especially environments with the highest security.


    So what’s the moral of the story here? Assume that people with malicious intent
    see your wireless network and secure it from that perspective and you will go
    a long way to securing your environment.


    # Man-in-the-Middle Attacks


    Man-in-the-middle attacks (commonly abbreviated MITM) are a very serious type
    of attack that you must fully understand to appreciate. The basic concept is that
    if an attacker can view and manipulate the network data stream between two endpoints,
    he can do interesting things, such as view what the user is doing and manipulate
    what the user sees.'
