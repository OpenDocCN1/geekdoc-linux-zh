  md: '# Chapter 6 Theory of Defense for Securing Wireless Networks 139


    have been applied to almost every component of modern networks, including firewall
    access control lists, operating system applications, web application internals,
    and now wireless networks.


    So does this apply to wireless networks? The most obvious example would be of
    Layer 3 or IP connectivity associated to the wireless network. For example, if
    the sole purpose of your wireless network is for the use of wireless barcode scanners,
    you should not allow IP connectivity to all of the systems on your wireless network;
    instead, you should restrict access to only the backend system for the barcode
    scanners. We''ll discuss specific applications of this rule for real-world wireless
    network solutions in a future chapter.


    # Network Segmentation


    The principle of Least Privilege leads nicely into our next secure design principle
    of proper network segmentation, where logical groups of systems are separated
    from each other on one internal network. For example, you might create unique
    subnets for your human resources department and a separate subnet for your billing
    department and give each access to only the systems they have a business to access.
    Too often networks and even wireless networks are one network, where every device
    can communicate with every other device at both Layer 2 and Layer 3.


    If you are unfamiliar with basic Layer 2 and Layer 3 concepts, I recommend picking
    up Networking: A Beginner''s Guide, Fifth Edition (McGraw-Hill, 2009).


    The most basic of segmenting a network at Layer 2 and Layer 3 is with virtual
    LANs and IP access control lists. A virtual LAN (VLAN) divides your physical switches
    into multiple logical switches. This is a huge cost saver and terrific for secure
    configurations. Although there are ways to hosts communicate across VLANs without
    a router, the typical solution for inter-VLAN communication is to use a Layer
    3 device such as a firewall or router. Take a look at Figure 6-1 for hosts on
    one VLAN might communicate with hosts on another VLAN.


    There are switches that operate at Layer 2 and Layer 3, and these can be perfect
    places to provide segmentation between subnets. Physically the scenario would
    look very different, but it would operate exactly the same logically.


    > LINGO\Typically, a switch that also operates at Layer 3 is (not surprisingly)
    referred to as a Layer 3 switch!


    A basic example of network segmentation for a wireless network would be one that
    needs to provide wireless access to the Internet for guests and internal resources
    for employees. Clearly, you don''t want these users on the same Layer 2 or Layer
    3 network. We will discuss secure solutions for this in a future chapter.'
