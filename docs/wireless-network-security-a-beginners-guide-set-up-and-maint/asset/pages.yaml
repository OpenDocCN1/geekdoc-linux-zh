  md: '# Chapter 4 Attacking Wireless Networks 83


    Most of the columns have a shorthand representation of their meaning. Here are
    the most common ones:


    | Column | Description |

    | --- | --- |

    | Name | This should be relatively obvious: It is the ESSID of the detected network.
    |

    | C | The encryption setting detected:

    - W for WEP

    - O for other, which usually indicates WPA

    - N for None |

    | Ch | This is the channel the detected network is using. |

    | Pkts | This is the total number of packets captured for this, which is a very
    good indication of how busy the network might be. |

    | Size | The total sum of the packets captured; this can also be a good indication
    of a busy network |


    If you highlight a specific network using the arrow keys, you''ll get more information
    on the network. In 4-7, you can see the following information:


    +   - BSSID: 22:22:22:22:22:22

    - Crypt: WEP (the cryptographic protocol detected)

    - Manufacturer: Detected based on the MAC address


    If you highlight a wireless network and hit the ENTER key, you''ll see a new window
    with lot more information, including the following:


    +   - First and last time the network was seen

    - Signal level

    - Noise level

    - The number of packets


    # In Action


    Want to know how to find the SSID for a cloaked network? It''s very simple—it
    happens automatically! When Kismet captures the association request from a client,
    it will automatically update the network with the appropriate SSID. If you''re
    feeling impatient and there''s already a client associated with the cloaked network,
    you can force the client to reassociate by spoofing a deauthentication message,
    covered later in this chapter.'
