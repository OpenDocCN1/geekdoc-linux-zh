    Now you understand that a person can use Public Key Cryptography to send a message
    and have the recipient verify the authenticity and integrity of that message.
    Let''s take a look at some of the practical points of how a person would use a
    public and private key to send a secure message. Let''s take two fictitious people
    who want to e-mail each other securely over an untrusted network; we''ll call
    them Neo and Morpheus. Neo and Morpheus are close buddies. One day, before they
    part, they exchange their public keys with each other over USB thumb drives. Therefore,
    Morpheus he can trust the public key from Neo because Neo physically handed it
    to him.


    When Neo composes an e-mail and addresses it to Morpheus, he signs the e-mail
    using his private key. Remember to sign the message, the e-mail program Neo is
    using will run the entire e-mail through a hash algorithm and then encrypt the
    resultant hash value using Neo''s private key. Neo then adds this signature value
    to the end of the e-mail and sends it on its way to Morpheus.


    When Morpheus receives the message from Neo with details of their next rendezvous
    point, Morpheus verifies that the e-mail has come from Neo and that the message
    has not been tampered with by. To do this, he takes Neo''s public key and decrypts
    the signature on the e-mail to come up with the encrypted hash value. He creates
    a hash value for himself and compares this with the hash value from Neo''s signature.
    If the values match, Morpheus knows the message is from Neo and that it has not
    been changed.


    # In Action


    You should note that it is not a necessity to physically hand someone a copy of
    your public key. However, it''s typically advisable for you to send your public
    key using an "out-of-band" method. That is to say, you wouldn''t want to send
    your public key using the same communication path you wish to be secure. For example,
    if you want to use Public Key Cryptography to secure e-mail communications, you
    wouldn''t necessarily want to first e-mail someone your public key.


    Why wouldn''t you want to do that? It''s simple: If an attacker is intercepting
    your communications at that point, he can simply substitute his own public key
    for yours and your recipient would have no way of knowing this happened. Of course,
    there are ways for a human to verify this, but from your computer''s perspective,
    it would be a difficult attack to detect.'
