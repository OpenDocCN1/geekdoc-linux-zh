    This, technically, does not disable beacons being sent from your access point;
    instead, it configures the access point to send beacons with a blank SSID field.
    In the next chapter, you’ll see how this is trivial to circumvent and obtain the
    network SSID.


    When a client connects to the access point, it must send the SSID in cleartext
    in the association request (see Figure 3-2). It is trivial for an attacker to
    capture packets and wait for a client to associate with the access point. However,
    an impatient attacker can force a client to rethink the association request by
    spoofing a deauthentication message. This is covered later in this chapter.


    # Passive Packet Captures


    This section covers an extremely important point—one that you can’t escape using
    wireless networks. Your network traffic is being broadcasted for everyone to see!
    Don’t panic! Stay with me. Obviously, there are ways to secure this; otherwise,
    no one would be using wireless technologies. However, let’s look at the current
    security implications and theoretical attacks with this fact.


    For you to capture traffic, you need to be within range of the target communicating
    station. At this point, you should understand that with the assistance of antennas,
    “within range” is a very flexible term. This means as you’re sitting in your favorite
    coffee shop, the websites you visit could be watched by someone at the next table,
    a building across the street, or even a few blocks away. Keep in mind that tests
    have been performed that successfully picked up wireless transmissions over few
    miles with high-gain antennas.


    Add to this fact that, even in this day, the most of popular network protocols
    are still insecure by nature. Protocols that do not natively encrypt their data
    are known as cleartext protocols. Using a network sniffer, you can view these
    packets and reconstruct what people are viewing, the data they are sending, the
    messages they are receiving, and so on. Some of the more popular sniffers can
    even decode the data to make it very easy to understand exactly what’s happening.'
