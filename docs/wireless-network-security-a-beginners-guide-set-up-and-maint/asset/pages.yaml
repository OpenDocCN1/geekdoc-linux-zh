    # Enterprise-Grade Access Points


    Actually the two biggest names in true enterprise-grade access points and systems
    are Cisco and Aruba. Both offer an extensive array of wireless products—everything
    from antennas, access point enclosures, access points, access point controllers,
    and even software to manage your wireless infrastructure.


    Surprisingly, not too many additional wireless features can be obtained from enterprise-class
    wireless access points versus regular access points. Most of the functionality
    is the same between home/small business access points and enterprise-class access
    points. Here are the main differences you can expect from business/enterprise-class
    wireless products:


    +   - Much more rugged construction

    - Controller-based systems (lightweight operation)

    - Software management systems

    - Vendor support options


    One of the most important features is the support option. If you rely on your
    wireless network to support core business processes, you''re going to make sure
    you''re covered in the event an access point or controller goes down. Most support
    contracts have the option of 24/7 support with next-day hardware replacement,
    but keep in mind the cost is in proportion to the level of support required.'
