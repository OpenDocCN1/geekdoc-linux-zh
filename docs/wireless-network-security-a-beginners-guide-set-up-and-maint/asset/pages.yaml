    Here''s where the real-world problem presents itself. Yes, your computer is preconfigured
    to trust VeriSign and thus trust certificates signed by VeriSign, but does that
    mean you (a flesh and blood person) actually trust VeriSign, and what exactly
    does that mean (to trust a company)? Ultimately, if you are a flesh and blood
    trust VeriSign''s processes for thoroughly verifying the identity of the people
    and businesses they provide digital IDs for. This, of course, is a difficult thing
    for many reasons. First of all, people who don''t work for a Certificate Authority
    will probably not know the inner workings of how the Certificate Authority actually
    verifies identities. Second, these verification processes have proven to have
    flaws, where individuals and businesses that should not have passed the verification
    process have received digital certificates.


    Remember that we''re talking about the process that employees of Certificate Authorities
    follow to verify identities. Whenever there is human involvement in a security
    process, yours should peak under, because humans are far more prone to errors
    than computers.


    The vast majority of digital certificates today are in the format of X.509 certificate,
    which is currently in version 3 (X.509 v3). The X.509 standard utilizes the X.509
    naming convention, which we''ll look at later. You might already be familiar with
    the X.509 standard, which deals with electronic directory services. The Lightweight
    Directory Access Protocol (LDAP), which is a component of Microsoft Active Directory,
    has a similar hierarchical naming convention.


    Digital Certificates contain important information, including the owner of the
    certificate, the issuer of the certificate, and the public key of the owner. Remember
    that all of this information is signed using the issuing Certificate Authority''s
    private key. Thus, if anyone, including the owner of the certificate, tries to
    change any of the information, the signature will indicate that something is wrong
    with the certificate.


    # Into Action


    There have been cases of people being approved for a certificate even though they
    submitted entirely fake information. This, of course, is a serious flaw that impacts
    the very foundation of digital certificates. Of course, after such a certificate
    is identified, it is revoked.


