  md: 'Wireless Network Security: A Beginner''s Guide


    # Principle 9: CIA Triad


    The CIA Triad is an industry-accepted model for securing systems (specifically,
    but not exclusively, data). The acronym stands for Confidentiality, Integrity,
    Availability. Each of them is vital to ensuring the security of data:


    +   - **Confidentiality**: Ensure that only those with the rights to view the
    data have access to do so, and prevent unauthorized disclosure of sensitive information.

    - **Integrity**: Ensure that changes made to the data are made only by authorized
    individuals, and prevent unauthorized modifications of systems and data.

    - **Availability**: Ensure that access to the data is available when needed, and
    prevent disruption of service and productivity.


    # Principle 10: Prevention, Detection, Deterrents


    Within the security realm, most mitigating security controls fall into at least
    one of the three major categories. Going along with the Defense In Depth strategy,
    it is wise to implement multiple types of security controls whenever possible.


    +   - **Prevention**: Aims to stop a certain activity before it happens. Examples
    include locks on doors, bars on windows, a firewall.

    - **Detection**: Uncovers certain activities. Examples include motion-activated
    cameras and an intrusion detection system (IDS).

    - **Deterrents**: Use to restrict people from doing things they shouldn''t. Deterrents
    can be physical or logical in nature. For example, an electric fence would deter
    people from climbing because they risk getting electrocuted. Security cameras
    act as a logical deterrent because evidence of wrongdoing could be used in litigation
    against perpetrator.


    Many security controls fall into multiple categories. For example, both detect
    and potentially criminal activity. An electric fence could prevent someone from
    walking onto your property as well as anyone from trying to scale it.


    # Principle 11: Prevention Fails


    Another theme in the security realm is the fact that (essentially) every prevention
    measure will eventually fail (or is capable of failing). This doesn''t mean that
    every single implementation of a preventative security measure will be bypassed
    by someone with malicious intent, but only that it is possible. Another way to
    look at this is that is, in the'
