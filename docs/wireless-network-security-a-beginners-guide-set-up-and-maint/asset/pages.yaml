  md: '# Budget Note


    The fact that you no longer have to pay for a controller means that potential
    cost savings can be realized in going with a cloud-based wireless solution. However,
    you need to make sure you account for all the costs of both solutions if cost
    is a concern. The main advantage is that you don''t have the cost of the controller
    or the cost of having the controller configured (education or consulting). The
    main disadvantage is that you will have the ongoing subscription cost of the service
    as well as being locked into whatever pricing structure the provider chooses.


    You manage your access points through a web interface and you have all the configuration
    options you''re used to. Once you plug in an access point into your network, it
    downloads its configuration from the controller on the Internet and operates exactly
    as a normal access point. In Figure 11-9, you can see the general topology of
    a cloud-based wireless solution. If the controller is inaccessible, the access
    point will still function as normal; however, you won''t be able to view statistics
    for the access point or reconfigure it until you restore communications to the
    controller.


    # Cloud-Based Wireless


    ![](img/78ecc761d1e6376868e68bf50b83b97a_314_0.png)


    Figure 11-9 Cloud-based access points'
