    # Setting the Stage


    To secure your wireless networks and devices, you need a healthy level of respect
    for the various attacks in addition to the knowledge of how they work against
    a wireless environment. You should also keep in mind that wireless technologies
    have no real boundaries. All of your data is fluttering through the ether, just
    waiting for anyone to grab it, analyze it, and potentially save it to perform
    a future attack.


    The protections afforded by wired connections are no longer a factor when dealing
    with a wireless infrastructure. Many of the attack techniques used against wireless
    technologies have existed for years (if not decades) for wired networks. However,
    these attacks are given new life by the fact that you can perform them far away
    from your target and more anonymously than ever. Also keep in mind the ubiquity
    of wireless networks. Nowadays every consumer electronic device comes with wireless
    capabilities, and users rarely think of the security implications associated with
    using wireless networks.


