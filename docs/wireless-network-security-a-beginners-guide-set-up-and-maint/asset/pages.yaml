    database such as Active Directory. Alternatively, the RADIUS server could authenticate
    users against a unique database used only for wireless clients.


    The high-level steps to configure a WPA2-Enterprise wireless network are as follows:


    +   1. Configure the Network Policy Server (RADIUS)


    +   a. Create a RADIUS client entry for the access point.


    +   b. Create the connection request policy.


    +   c. Create a Network Policy.


    +   2. Configure the wireless access point.


    +   a. Configure for WPA2-Enterprise.


    +   b. Configure the RADIUS client that will authenticate users. This can be


