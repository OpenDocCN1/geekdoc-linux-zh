    # Internal DMZ


    We''ve looked at a simple scenario where wireless users only need access to a
    single internal system and the Internet. What if wireless users need access to
    a slew of internal machines? What is the best way for handling such a situation?


    One you might already be familiar with the use of a demilitarized zone (DMZ).
    You can create separate subnets dedicated to resources that both internal and
    wireless users need access to. You create firewall rules that restrict each group
    of users to only the systems and services they need access to. In Figure 9-22,
    you can see a diagram for a basic network with a DMZ.


    In this example, we can see that the DMZ has a subnet of 10.0.3.0/24. Both the
    wireless network and the internal network need access to the DMZ. Like the previous
    examples,


