    # # Creating a Linux Access Point


    Configuring your Linux laptop to act as an access point couldn’t be easier. You’ll
    need to follow these basic steps:


    +   1. Set the wireless card to monitor mode.

    2. Configure the laptop as the access point using airbase-ng.

    3. Configure the DHCP server on the laptop to hand out IP addresses.

    4. Configure an IPTables firewall to pass traffic through laptop.

    5. Sniff all the wifi traffic.


    The airbase-ng program is also part of the aircrack-ng suite. The operation is
    very similar to the other programs in the aircrack-ng suite and is extremely easy
    to work with. Let’s look at each of these steps in detail.


    **Step 1.** Set the wireless card to monitor mode.


    You should be familiar with this command now. As a refresher, to put the wlan0
    interface into monitor mode, you would use the following command:


    ```

    #airmon-ng start wlan0

    ```'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Wireless Network Security: A Beginner''s Guide


    Step 2. Configure the laptop as the access point using airbase-ng.


    Because we want to encourage as many people to connect to our malicious access
    point as possible, we will not be using encryption. We basically need three things:
    the SSID to broadcast, the channel, and the wireless interface. An example would
    like this:


    ```

    #airbase-ng -e "FREE WIFI" -c 11 mono

    ```


    +   - e is the SSID of "FREE WIFI"

    - c assigns the access point to channel 11.

    - mono is the wireless interface.


    In Listing 5-3, you will see airbase automatically creates the at0 interface.
    The at0 interface is a virtual interface that you can treat just like any other
    interface. For airbase, the at0 interface represents the IP address of the access
    point, and it is the interface to which we will bind the DHCP daemon.


    For now, we''ll want to assign the at0 interface an IP address, as follows:


    ```

    #ifconfig at0 10.0.0.1 netmask 255.255.255.0

    ```


    You''ll need to keep the window with airbase-ng open because you''ll see some
    very interesting diagnostic information.


    # Listing 5-3: Using airbase-ng to Create an Access Point


    ```

    # airbase-ng -e "FREE WIFI" -c 11 mono

    22:39:58 Created tap interface at0

    22:39:58 Trying to set MTU on at0 to 1500

    22:39:58 Access Point with SSID 00:22:FA:5F:04:C8 started.

    ```


    Step 3. Configure the DHCP server on the laptop to hand out IP addresses.


    When we connect to the access point, we need to get a legitimate IP address, which
    means it''s our job to give it to them. The only time when might not be the case
    is when there''s an existing DHCP server on the hardwired network that your access
    point will bridge to.


    > LINGO

    In the Linux world, a daemon is simply a service that typically runs in the background.'
