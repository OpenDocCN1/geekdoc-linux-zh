  md: '# 328 Wireless Network Security: A Beginner''s Guide


    ESSID Extended Service Set Identifier. Identifies one or more connected Basic
    Service Sets, typically referred to as the human readable network name.


    **false negative** A result that indicates no problem exists where one actually
    does exist, such as occurs when a vulnerability scanner incorrectly reports no
    vulnerabilities on a system that actually has a vulnerability.


    **false positive** A result that indicates a problem exists where none actually
    exist, such as occurs when a vulnerability scanner incorrectly identifies a vulnerability
    that does not exist on a system.


    **GPS** Global Positioning System. A global system uses satellites to determine
    the precise location on Earth of GPS receivers.


    **honeypot** A system designed to lure a specific type of user, typically an attacker,
    mimicking the attributes of a vulnerable system.


    **information classification standards** Standards that specify the treatment
    of data (requirements) for storage, transfer, access, encryption, and so on) according
    to the data’s classification (public, private, confidential, sensitive, and so
    on).


    **information security** The protection of information and information systems
    by unauthorized access, use, disclosure, or destruction. Also commonly referred
    to as data security, computer security, or IT security.


    **integrity** The prevention of data modification by unauthorized parties.


    **intercept of a line** Identifies the point where the line crosses the vertical
    y-axis. An intercept is typically expressed as a single value (b) but can also
    be expressed as the point (0, b).


    IV Initialization Vector. A 24-bit value prepended to the WEP key to provide entropy
    so the same WEP key is never used twice.


    **LWAPP** Lightweight Access Point Protocol. A protocol to configure and manage
    multiple access points from a central controller.


    **MAC address** Media Access Control address. The address that uniquely identifies
    a node on a network at Layer 2.


    **metrics project distance** The amount of a change you want to achieve in your
    target measurement by the end of the metrics project.


    **metrics project timeline** How long you want to spend to achieve the metrics
    project distance.


    **mission statement** Outlines an information security program’s overall goals
    and provides guidelines for its strategic direction.'
