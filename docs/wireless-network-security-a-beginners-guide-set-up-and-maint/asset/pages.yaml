    185


    The communication between the clients, the authenticator, and the authentication
    server happens using the Extensible Authentication Protocol (EAP), which we discussed
    in Chapter 6. Essentially, the authenticator (in our case, the access point) is
    relaying the messages between the supplicant and the authentication server and
    doesn''t necessarily understand the messages being exchanged. It just waits to
    see an authentication success message from the authenticator server, at which
    point it grants access to the wireless client.


    > Note

    Keep in mind that you have the option to configure RADIUS to use a unique database
    to authenticate users, but you can also accomplish the same thing by using Active
    Directory and granting specific users and groups rights to authenticate to the
    wireless network. We''ll cover this in more detail in the next chapter.


    # 802.1ix: Port-Based Access Control


    The 802.1ix protocol is an IEEE standard for port-based authentication. The 802.1ix
    standard also defines the implementation of the Extensible Authentication Protocol
    Over LAN, and EAPOL. We covered different EAP methods in Chapter 6.


    > LINGO

    Remember not to confuse 802.1ix with 802.11ix, which is a common way to refer
    to all the 802.11 wireless standards.


    To understand how 802.1ix functions on a wireless network, you should understand
    its roots in wired networks. 802.1ix, or Port-Based Access Control, requires users
    to authenticate to the switch they are physically connected to before they are
    granted access to the network. Typically, this authentication will happen against
    a unique database that resides on a separate server from the network device the
    user is directly connected to. 802.1ix has its own nomenclature to identify each
    component in the authentication process. 802.1ix refers to these components as
    a *supplicant*, *authenticator*, and *authentication server*. In a wireless network,
    a user''s laptop would be the supplicant, the wireless access point would be the
    authenticator, and the RADIUS server would be the authentication server. This
    basic architecture is shown in Figure 7-15.


    Any client (supplicant) that wishes to connect to the protected network must support
    the 802.1ix protocol in the form of client software, typically referred to as
    *supplicant software*. Most modern operating systems come preinstalled with supplicant
    software; however, you may need to install supplicant software, depending on your
    client devices and authenticators.'
