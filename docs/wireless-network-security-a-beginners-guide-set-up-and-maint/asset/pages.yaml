  md: '# Wireless Network Security: A Beginner''s Guide


    > **In Actual Practice**nFrom a security perspective, all the additional information
    is not necessarily helpful. However, keep in mind that this information is available
    and might come in handy to troubleshoot a problem someday.


    # Kismac


    Kismac is a program that mirrors a lot of the Kismet functionality and runs—not
    surprisingly—on the Mac OS. You can download Kismac from www.kismac-ng.org. Here''s
    a list of the functionality Kismac provides:


    +   - Enumerating cloaked SSIDs

    - GPS support similar to Kismet

    - Exporting and importing PCAP files

    - Support for receiving data from a Kismet drone


    # Wardrive


    Wardrive is an app available for the Android OS. In my experience it has proven
    to be the best available app for actually wardriving with a smartphone. One of
    the coolest features of using your smartphone as a wardriving tool is that it
    already has GPS functionality built in!


    Wardrive allows you to view the networks on a map, including a satellite view.
    You can export the detected networks as a KML file, which is very similar to an
    XML file. You can import the KML file into Google Maps and view all the networks
    on your computer. Very cool!


    # Netstumbler


    Netstumbler is also an extremely popular wireless enumeration program. It runs
    on the Windows operating system and is easy to install and use. Although Netstumbler
    does not contain all the features of Kismet, some people actually prefer the Netstumbler
    interface to Kismet’s.'
