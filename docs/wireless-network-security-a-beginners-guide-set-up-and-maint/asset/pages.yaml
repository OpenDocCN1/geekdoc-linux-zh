  md: '# Wireless Network Security: A Beginner''s Guide


    Let''s take a look at each of these steps in detail and walk through the process
    of cracking a WEP-encrypted network.


    Step 1. Identify the target wireless network.


    We''ve already identified the target wireless network (INSECURE) using the iwlist
    command. The network has a BSSID of 22:22:22:22:22:22 and is on channel 11, as
    shown previously in Listing 4-3.


    Step 2. Put your wireless card into monitor mode using airomon-ng.


    Next, we put our wlan interface into monitor mode. If we use airomon-ng without
    any arguments, we will see the current status of any wireless interfaces in the
    system. We basically need one option, which is the interface on which to enable
    monitor mode (see Listing 4-5).


    Listing 4-5: An airmon-ng Example to Place wlan0 into Monitor Mode

    # airmon-ng start wlan0


    Step 3. Start saving traffic on the channel associated with the target wireless
    network using airodump-ng.


    We now saving all the traffic we see for the target network with airodump-ng program.


    ```

    #airodump-ng -w OUT -c 11 --bssid 22:22:22:22:22:22 mono0

    ```


    +   - w tells airodump to name all the files starting with "OUT".

    - c 11 tells airodump to stay on channel 11 rather than hopping between channels.

    - --bssid restricts airodump to focus just on the target BSSID.

    - The final argument is the interface on which to listen.


    > Note

    Notice that Linux any command-line switch that is not a single character has two
    dashes instead of just one.


    # Into Action


    If you take a look at the man page for airodump, make sure you don''t confuse
    the filter options with the regular options. This is a relatively common mistake
    and can cause confusion when executing an attack.'
