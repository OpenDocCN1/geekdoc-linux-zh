    # Normal ARP Process


    ![](img/78ecc761d1e6376868e68bf50b83b97a_68_0.png)


    **Figure 3-6** Normal ARP process


    Whoever has an IP address of 192.168.0.1, please send me your MAC address”), it
    will respond to an ARP reply packet. The ARP reply packet essentially says, “I
    am 192.168.0.1 and here is my MAC address.” Now Neo has everything it needs to
    send packets to Morpheus and initiates a TCP connection to Morpheus (see Figure
    3-6).


    How does an attacker take advantage of this relatively straightforward process?
    Why, he simply sends his own ARP response packet, claiming that his MAC address
    is the address for 192.168.0.1, as illustrated in Figure 3-7. In fact, the attacker
    can continuously spoofed ARP packets to everyone on the LAN, essentially performing
    a man-in-the-attack against every local host.


    The perfect ARP spoofing attack has many facets that we will not cover here. As
    long as you understand the basic principles, you can let the tools we use handle
    the rest. We’ll cover these tools in a later chapter.


    # Rogue DHCP


    You should already be familiar with the basic operation of the Dynamic Host Configuration
    Protocol (DHCP). When a host boots and needs an IP address, this is often handled
    by a DHCP server. The DHCP server also gives the other settings, such as a default
    gateway and Domain Name Servers (DNS) to use. What you might not know that this
    is another very simple vector for an attacker to establish a man-in-the-middle
    attack.


    It’s like setting up your own DHCP server and configuring your attacking machine
    (or another machine under your control) as the default gateway within the DHCP
    response (see Figure 3-8). You can use some simple command-line tools to perform
    this attack rather than configuring a typical DHCP server.'
