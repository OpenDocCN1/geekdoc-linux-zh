    # Into Action


    Most documentation will refer to WEP keys lengths as 64-bit and 128-bit options.
    Technically, this isn''t as accurate as stating that they''re 40 bit and 104 bit—the
    other 24 bits come from a 24-bit value (Initialization Vector) that changes with
    each packet, which you will learn shortly. The main thing is to understand the
    subtle difference and in most documentation and configurations, 40 bit is the
    same as 64 bit and 104 bit is the same as 128 bit.


    WEP keys are configured by administrators and can be either 40 or 104 bits in
    length. When we''re talking about encryption keys, the longer the key, essentially
    the stronger security. The only real reason to choose 40-bit WEP over 104-bit
    WEP is that it''s easier to remember the key is shorter.


    So what it really mean that WEP “uses” the RC4 algorithm and why is it important?
    Encryption algorithms are designed by very smart people, and the secure algorithms
    get tested by many other smart people. However, encryption algorithms are open
    to be slightly different based on how someone chooses to implement them. This
    is why sometimes you''ll hear state that an algorithm is secure, but a specific
    implementation of the algorithm isn’t. This is absolutely the case with WEP and
    the implementation of RC4.


    RC4 was first designed in 1987 by Ron Rivest of RSA Security. RC4 is a still strong
    encryption algorithm when implemented in a secure way for many other protocols
    you''re probably familiar with, including the following:


    +   * WPA (Wi-Fi Protected Access)

    * TLS/SSL (Transport Layer Security and Secure Sockets Layer)

    * Microsoft Point-to-Point Encryption

    * Remote Desktop Protocol

    * Some implementations of SSH (Secure Shell)

    * Some implementations of Kerberos'
