  md: 'Chapter 5 Attacking Wireless Clients 117


    # Forcing the Client to Talk to Us


    One scenario we didn''t mention is when the client wish to target is already connected
    to a secure access point. What do we do in that case? Just give up? Of course.
    One possible solution is to deauthenticate the client from the current access
    point using the replay-ng tool, which we covered in Chapter 4. While you continuously
    deauthenticate the client from the existing access point, you broadcast an ESSID
    that you witnessed the client probe using airodump-ng.


    The trick to this is that you''ll most likely to have a stronger signal level
    than the access point the client is currently connected to. However, this isn''t
    necessarily the case, especially when you consider the social engineering aspect
    of this technique. If you continuously deauthenticate the client from the legitimate
    access point, the user might get frustrated that she''ll choose any wireless network
    she can find, just to get some work done!


    # LINGO


    Social engineering can be used to describe any form of attack that tries to manipulate
    end users by deceiving them in some way.


    # Default Operations


    Now let''s cover a very important aspect to the security of our clients. That
    is the question of what happens automatically behind the scenes, or operations
    that happen by default. As you will see, many things happen behind the scenes
    without user interaction that can seriously affect the security of your systems.


    One of the simplest examples is you''re probably already familiar with but might
    not have considered the associated security implications. Many people have configured
    their smartphones to access their e-mail accounts. When configuring their e-mail
    accounts, many people choose to have the phone automatically check for new e-mail
    messages. This can cause a very serious issue when the smartphone has Wi-Fi capabilities.


    We already discussed in a previous chapter that many protocols, including a few
    associated with e-mail, are completely insecure, transmitting all the data and
    credentials in cleartext. The real problem occurs when the smartphone is associating
    with open wireless networks automatically and then logging into the configured
    e-mail accounts. When you add this to the fact that the smartphone is constantly
    sending requests for wireless networks that it wishes to associate with, this
    becomes a relatively trivial attack to pull off.'
