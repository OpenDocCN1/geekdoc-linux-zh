  md: '# We’ll Cover


    +   - Authenticating guest users and managing guest credentials

    - Using captive web portals

    - Segmenting guest wireless networks from internal networks

    - Allowing secure access to internal resources


    In this chapter, we will discuss the various methods for dealing with guest access.
    We’ll discuss the opportunities for you to reuse your guest wireless network to
    allow access to internal network resources for guest users as consultants. You’ll
    learn the key issues you need to consider when designing guest wireless networks.


    # Guest Networks and Internet Access


    Many times organizations will just deploy an open wireless network, give it an
    SSID that includes the word guest, firewall it off the network, and consider themselves
    done. Unfortunately, some security issues with this design may not been considered.
    As in previous examples, one of the most important questions you can ask yourself
    first is, “Do I really need to deploy guest wireless functionality, and what exactly
    am I trying to accomplish?”


    For example, if your goal is to provide “guest” access for consultants or vendors
    for your company, the design of your wireless network might look very different
    than if you are wanting to provide Internet access for visitors or customers of
    your business. Either way, you want to clearly define exactly what is needed,
    and how wireless functionality fill those needs.


    Providing Internet access to patrons and visitors of your business may seem like
    a very easy task, but you should take into consideration certain issues before
    deploying a solution. The major concerns of hosting an open wireless network include
    the:


    +   - Attacks originating from your Internet connection

    - Illegal content hosted on your Internet connection

    - Illegal content downloaded using your Internet connection

    - Private internal information being sent over unencrypted wireless'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Chapter 10 Handling Wireless Guest Access 253


    In the Real World

    Remember even though you might ultimately be responsible for any illegal activity
    that occurs from an Internet connection it owns. There have been very serious
    reports of people getting into trouble for what other users have done their open
    wireless networks. One extreme example involved a man being arrested for someone
    else using his open wireless network to download pornography. Ultimately the man
    proved his innocence, but it''s probably not a situation anyone would like to
    find themselves in.


    You need to understand the implications of people doing something they''re not
    supposed to do from your Internet connection. Imagine a situation where someone
    actually uses your open wireless network to attack another organization. The other
    organization could make it your problem—and potentially bringing a lawsuit against
    you.

    If someone were to send or receive illegal content that could be traced back to
    your network, you might be on the hook. Illegal content doesn''t even have to
    be as serious as you might think. Organizations such as the Motion Picture Association
    of America (MPAA) and the Recording Industry Association of America (RIAA) have
    really cracked down on illegal downloading of movies and music. Your organization
    might be completely innocent of anything illegal, but it might be costly to prove
    this point. A perfect example of an ounce of prevention being worth a pound of
    cure.

    Here are some tips for securing Guest access:


    +   - Authenticate guest users, where feasible.

    - Use unique credentials, where feasible.

    - Restrict access to guest users only (no internal users!).

    - Encrypt the traffic.

    - Use auto-expiring credentials.


    # Authenticating Guest Users and Managing Guest Credentials


    One solution to combat the issues presented with a guest network is to authenticate
    your guests in one form or another. You have several options when it comes to
    authenticating your guests, and at this point you should be familiar with most
    of the options. Let''s look at the different options available and the advantages
    of each.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Wireless Network Security: A Beginner''s Guide


    Your technical options for authenticating users of your guest network include
    the following:


    +   - Shared password using integrated wireless capabilities (WPA Pre-Shared Key)

    - Unique authentication credentials (WPA-Enterprise)

    - Captive web portal systems


    The benefits of using a shared key as opposed to unique credentials for each user
    are the same for guest networks as they are for any other network. The advantage
    of using unique credentials is that you can more easily identify exactly who is
    authenticating to your network and audit access. The disadvantage of using unique
    credentials for every guest user is a significant increase in administrative overhead.
    The administrative overhead itself is someone needing to actually create the username
    and password for every guest and delivering the credentials to them. This isn''t
    as difficult as it might sound, but it''s still work.


    Many organizations actually give this task to nontechnical employees (such as
    receptionists). Thanks to Role-Based Access Control (RBAC), which wireless administration
    systems allow users to create guest user accounts without having access to change
    any aspects of the wireless system.


    Many companies lean towards using one password that is shared among all guests.
    This isn''t always the best solution because it doesn''t allow for tracking and
    auditing of usage. Most users typically not treat guest credentials as confidential,
    sharing them with anyone who asks. Conversely, most people are not as quick to
    share credentials that are assigned specifically to them.


    In certain situations, controlling guest access tightly by creating a unique user
    for each guest might be too unreasonable. For example, if a busy hospital wanted
    to provide Internet access to guests and visitors, it might be unreasonable to
    ask every guest


    # In Action


    Role-Based Access Control (RBAC) is a generic term for assigning privileges based
    on a person''s role in a system. Many times wireless management systems have a
    simple web interface that many users are familiar with and can interact with.
    In our example, we could give our receptionist an account in the wireless management
    system to create guest login IDs and not perform anything else. This "role" might
    be labeled "guest administrator," for example.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Chapter 10 Handling Wireless Guest Access 255


    request a user ID and password to access the guest network. This could easily
    turn into a full-time job for the person responsible for creating the guest accounts.


    Most places authenticate guest users by having them physically visit a specific
    area such as the front desk and asking for the guest password. Depending on your
    business, this might not be enough authentication. The people responsible for
    handing out the guest credentials should be trained on how and when to give out
    guest credentials as well as to whom.


    # Using Captive Web Portals


    You’re probably already familiar with captive portals. Captive portals are systems
    that “trap” a user’s HTTP request and redirect the user to an authentication page
    where she has to authenticate before being allowed to the Internet. This “portal
    page” the user is redirected to typically resides on the captive portal host,
    but can also be handled by a central server, sometimes located on the Internet.


    # In Action


    Remember that by the very nature of users being “guests,” they are hard to authenticate,
    but that doesn’t mean it’s impossible. Think about what you’re trying to avoid
    by authenticating your guest users. Typically, you’re trying to prevent people
    who are not actually guests from using your wireless network.


    Therefore, even though an authentication method might not be perfect, it could
    be enough to accomplish this task. By requiring users to do something someone
    who uses your guest wireless network for malicious purposes wouldn’t count, you
    can weed out a would-bad attacker. Here are some possible solutions:


    +   - Provide alternative ID (driver’s license, student ID card, and so on)

    - Leave something for guest access (car keys, credit card, and so on)

    - Call a helpdesk to obtain credentials

    - Visit the reception desk to obtain credentials


    Of these choices, the easiest and most effective method appears to be having guests
    request credentials from somewhere they have to physically visit. This will definitely
    not stop a determined attacker, but if you also have a video camera in the area
    to maintain a record of who has requested credentials, you might have mitigated
    most of the risk.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Wireless Network Security: A Beginner''s Guide


    Typically, the user is "forced" to authenticate once she tries to visit a website.
    The end user typically enters her authentication credentials manually to an web
    page form. This authentication can be a simple shared password or can be unique
    credentials. Many captive portals allow for a user to request credentials or sign
    up for an account.


    Captive portals operate very similar to 802.1x, but are more apparent to the end
    user. Just like 802.1x, a captive portal will not let a user reach any resources
    until the user has successfully authenticated. Unlike 802.1x, captive portals
    do not typically authenticate the user automatically upon associating to the wireless
    network. Instead, a user is allowed to completely associate to a wireless network
    and obtain an IP address before being "forced" to authenticate.


    You should also understand that by a captive portal allowing seemingly innocent
    protocols such as DNS and ICMP through, there potentially be a security problem.
    If a malicious user uses a captive portal to encapsulate traffic within the DNS
    or ICMP packets, he could potentially bypass the need to authenticate to your
    captive portal. This would require the attacker to set up a server ahead of time
    to receive the covert DNS messages and send back the appropriate content to look
    like a DNS message as in Figure 10-1. However, programs already exist to accomplish
    exactly that.


    Some captive portals will use slightly different techniques to redirect the user,
    but the end result is same. You have an insane amount of options when it comes
    to choosing a captive portal. Plenty of open source, free, and commercial options
    are available. In addition, many captive portal services exist that handle authentication,
    account creation, and even billing.


    Many existing captive portal systems have been included in firmware, such as the
    OpenWrt and DD-WRT projects. Many new access points, point managers and lightweight
    access point systems include captive portal functionality out of the box. In Figure
    10-2, you''ll see an example of an access point redirecting a user to an Internet-based
    captive portal system. The on access point is very compact and simply waits for
    the authorization message from the Internet server, which indicates the user has
    authenticated successfully.


    # Into Action


    Although it seems like the captive portal blocks all traffic before the users
    authenticate, you should understand some of the nuances to this. For example,
    most captive portals still allow DNS queries to pass through the Internet so that
    the user can look up Internet hosts, to access the website, and then be redirected
    to the authentication page. Typically, captive portals will also let ICMP through
    for troubleshooting purposes.


