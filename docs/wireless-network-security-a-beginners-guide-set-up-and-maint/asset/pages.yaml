    # Certificate Authority Server Structure


    The infrastructure that supports certificates is built on a root CA at the highest
    point in the hierarchy and Certificate Authorities underneath the root CA known
    as **subordinate CAs** or **intermediate CAs**. This is shown in Figure 7-12.
    This highly segmented hierarchy makes sense for large-scale deployments and Internet
    Certificate Authorities, but most businesses and enterprises will find that a
    much smaller hierarchy makes sense for their environment.


    You can think of each of the subordinate CAs as a child to the higher-level CA.
    The parent CA would sign that certificate, at which point the child could sign
    certificates using its own certificate (private key). It is typically advised
    to take the root CA offline once you have deployed your intermediate CAs to ensure
    the security of your entire CA hierarchy. A compromise of any Certificate Authorities
    would compromise all of the CAs beneath it in the hierarchy. Many times segmentation
    sense to separate CAs with different functions. For example, you might have one
    CA that issues only authentication certificates while another CA issues certificates
    solely for secure e-mail.'
