  md: '# Chapter 6 Theory of Defense for Securing Wireless Networks 155


    # When to Use IDS vs. IPS


    The main difference between an IDS and IPS is relatively straightforward, but
    the business decisions of when to use one versus the other might be a little more
    complicated. An IDS passively monitors traffic and alerts on data, whereas an
    IPS can take automated action based on detected events. This is, of course, an
    extreme reduction of the differences, but you get the point.


    The typical argument for IPS over IDS is whether or not you can affect legitimate
    users. where a legitimate user is denied access to a resource because the IPS
    believes that person is performing some task that appears to be malicious. This
    can affect the availability of your systems, as appeared in the CIA triad. For
    example, in an e-commerce environment, where lost revenue could be the result,
    this might not be appropriate. One of the most telling questions to ask from a
    business perspective would be, Is it riskier to deny a legitimate user or let
    a potential attack succeed? Answer question, and you''ll have a pretty good idea
    of what you should lean toward an IDS or an IPS solution.


