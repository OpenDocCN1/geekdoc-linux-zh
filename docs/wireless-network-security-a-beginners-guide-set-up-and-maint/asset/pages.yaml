    As you''ll recall from the previous chapter, we discussed the fact that someone
    could simply sniff packets, crack the encryption on the network, and decrypt the
    packets—all of which would be completely passive and unobservable to the target
    network.


    In the previous examples, if we chose not to perform the ARP replay attack, the
    entire process would be passive. Not only that, but all the packets we''ve captured
    can now be read using the obtained WEP key. We simply use the airdecap-ng program,
    which is part of the aircap-ng suite. The syntax is very simple. Here is an example:


    ```

    #airdecap-ng -w 1234512345 pcap-file.cap

    ```


