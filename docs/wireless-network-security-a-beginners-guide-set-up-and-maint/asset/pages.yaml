    this is just another example of a wireless network defense that does nothing more
    than add more work for the wireless network administrator and a very small hurdle
    for an attacker.


    # WEP


    Wired Equivalent Privacy (WEP) was the original protection built into the 802.11
    standard. WEP offers virtually no protection, as you learned in Chapter 4. If
    you didn''t read that, stop reading right now and go read it. I simply can''t
    stress this enough: Under no circumstance are you to use WEP! Are we?


    Now, I''m a realist: I understand that there will be WEP networks around for some
    time. The only possible argument that would appear to somewhat valid would be
    if you have to support a client device whose only encryption method is WEP. We
    will discuss in a later chapter how to potentially deal with a network of this
    nature; however, nowadays it would seem pretty rare that a wireless device supports
    only WEP.


    Keep in mind that even if you deploy other compensating controls such as an IDS,
    an attacker could still passively capture all the network traffic, crack the WEP
    key, and view the data from the captured packets. This means that no matter what
    you do to detect possible intrusions into a WEP-encrypted network, your efforts
    will be for naught an attacker can view the data contained in the captured packets.


    # WEP Cloaking


    WEP cloaking, not to be confused with SSID cloaking, was meant to be a Band-Aid
    for networks that use WEP. As you''ll recall from Chapter 4, cracking the WEP
    key requires the attacker to capture a certain number of WEP-encrypted packets.
    What WEP cloaking does is essentially send out "invalid" encrypted packets (or
    what is typically called *chaff*) to confuse the WEP-cracking software when it
    attempts to crack the WEP key.


    This is yet another example of a technique that makes sense on paper but simply
    doesn''t work. Security researchers were quick to render this technique almost
    useless. WEP cloaking typically only adds a few minutes to the total time to crack
    a WEP-encrypted network.'
