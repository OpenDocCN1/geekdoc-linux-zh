  md: '# ## We’ll Cover


    +   - Configuring a WPA2-Enterprise network with PEAP authentication

    - Configuring a Microsoft Windows 2008 Network Policy Server

    - Strategies for segmenting wireless networks


    In this chapter, we’ll start by deploying a WPA2-Enterprise wireless network with
    PEAP authentication to a Microsoft Windows 2008 RADIUS server. We’ll then apply
    a few of the secure design concepts covered in Chapter 6 to our wireless network.


    # ## WPA2-Enterprise Wireless Networks


    Despite the myriad of details working behind the scenes when you’re using a WPA2-Enterprise
    wireless network, it’s actually incredibly easy to configure. Let’s review the
    components briefly and move on to configuring them.


    As you see in Figure 9-1, the two main pieces of this architecture are the wireless
    access point and the RADIUS authentication server. The wireless access point prevents
    the wireless client from accessing any internal network resources until an “Authentication
    Successful” message has been received from the RADIUS server.


    ![](img/78ecc761d1e6376868e68bf50b83b97a_236_0.png)


    **Figure 9-1** Basic WPA2-Enterprise network'
