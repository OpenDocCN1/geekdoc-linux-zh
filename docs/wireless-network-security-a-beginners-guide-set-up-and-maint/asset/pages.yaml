  md: '# 60 Wireless Network Security: A Beginner''s Guide


    ![](img/78ecc761d1e6376868e68bf50b83b97a_78_0.png)


    # History of Breaking WEP


    In 2001, WEP was cryptographically broken by three security researchers: Scott
    Fluhrer, Itsik Mancini, and Adi Shamir. The attack is commonly known as the FMS
    attack, referring to the names of the researchers who discovered the vulnerability.
    At its core, the vulnerability in WEP is due to its use of the 24-bit Initialization
    Vector, which you learned in the previous section.


    The FMS attack allows an attacker to discover the WEP key after passively capturing
    packets. For the attack to have a 50-percent success rate, the user needs to capture
    around five million packets. Keep in mind that an attack might be successful with
    fewer packets, or it might require more packets to be captured.


    > > The most sinister form of exploitation for any cryptographic system is an
    attack on how the underlying system functions. You can easily think of a cryptographic
    break as a design flaw within the encryption algorithm.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Chapter 3 Theory of Attacks on Wireless Networks 61


    # Note


    Remember that passively capturing traffic is an extremely stealthy attack. There
    is no way for the target of the attack to know their traffic is being captured.


    A passive attack relies on capturing enough weak IVs from the normal communications
    of wireless clients. Recall from the previous section that in a stream cipher
    the key used to encrypt two packets can never be the same. Well, what happens
    if two packets use the same Initialization Vector? You guessed it! Bad things
    happen. Because WEP''s IV is 24 bits in length, there are 16,777,216 unique Initialization
    Vector values. Yes, that sounds like a lot, but on a busy network you can easily
    send 16 million packets in a very short period of time.


    # Note


    There are certain key values that generate predictable patterns of encrypted data.
    The encrypted packets that start with these patterns are said to be weak packets
    and the associated IVs are Weak IVs.


    Later in 2004, the Korek attack was introduced by a researcher using the same
    pseudonym. The Korek attack essentially expands on the mathematical calculations
    of FMS attack to make the attack faster and more effective. Many times the two
    attacks will be mentioned together as the FMS/Korek attack because the Korek attack
    builds on the FMS attack.


    Korek also detailed an attack known as the chop-chop attack, where an attacker
    can decrypt a WEP-encrypted packet without knowing the encryption key, however
    decrypting the packet does not give the attacker knowledge of the WEP key. This
    attack would have received much more publicity if WEP hadn''t already been broken.
    Still, the cryptographic implications are very interesting, and this attack style
    has seen new life with WPA, which we will cover later.


    In 2007, a completely new style of attack was introduced by researchers Pyshkin,
    Tews, and Weinmann. This attack is not surprisingly referred to as the PTW attack.
    This attack needs only around 40,000 packets for a 50-percent success rate, which
    is far fewer than the original roughly five million needed for the FMS attack.


    What does this mean? In plain English, the designers of the WEP algorithm didn''t
    create a large enough IV. The IV being 24 bits means that on a busy network, multiple
    packets will use the same IV. This allows an attack known as a related-key attack,
    where essentially the attacker knows a portion of the key used to encrypt data
    and can find a mathematical relationship between cyphertext.'
