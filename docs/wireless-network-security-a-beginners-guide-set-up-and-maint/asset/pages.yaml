  md: '# SSL MITM


    An attacker in position to perform a man-in-the-middle attack can perform an additional
    attack to view the contents of the SSL-encrypted network connection. We won''t
    go exactly how to perform this attack, but if you are interested you can look
    into the use of the ettercap program.


    Nowadays the attack is trivial to actually execute. Behind the scenes, the program
    works by setting up two SSL connections—one between the client and the attacker,
    and the other SSL connection between the attacker and the target system. This
    is represented by Figure 5-13. In this position, the client sends data to the
    attacker encrypted using the certificate from the attacker. The attacker is free
    to view all the cleartext data from the client and then forward that to the remote
    server.


    However, an SSL MITM attack is not the most stealthy attack because the user is
    prompted that the certificate does not match the remote address. You can see what
    users of Internet Explorer see in Figure 5-14. However, how many users do you
    think actually care about this warning? That''s right, hardly any.


    # SSL Stripping


    The other option is a slightly newer attack known as an SSL stripping attack.
    Rather than substitute a fake certificate to the client, the attacker actually
    redirects the client to use HTTP and relies on the user not noticing that the
