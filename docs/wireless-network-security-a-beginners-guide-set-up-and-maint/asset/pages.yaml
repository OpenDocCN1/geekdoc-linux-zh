  md: '# Chapter 5 Attacking Wireless Clients 101


    This doesn''t just apply to Link layer encryption. If a client uses a strong encryption
    algorithm at the Link layer but the underlying protocol is insecure or otherwise
    unencrypted, a vulnerability may still exist.


    # Are There Default Configurations That We Can Exploit?


    Insecure default configurations have long plagued IT systems. Whether it''s default
    usernames and passwords, unnecessary services enabled, or weak encryption settings,
    many default configurations chosen by manufacturers become operational headaches
    for network administrators.


    When considering the vulnerabilities associated specifically with wireless clients,
    we''ll look at some of the default actions we can use to our advantage. Not only
    can a wireless client be vulnerable on poor default configurations, but it can
    also be vulnerable on core functionality that an attacker can target in creative
    ways that the designers may not have considered.


    # Can We Make the Client Talk to Us?


    In many cases, a client is considered secure because the communication between
    the access point and the client is encrypted. If we force the client to connect
    to us instead of the “secure” access point, we may be able to do some interesting
    things.


    > Note

    You should keep in mind that this is by no means a complete list of all the vulnerabilities
    associated with wireless clients. One of the major categories we''re not emphasizing
    as much as we could is that of physical security. We will touch on physical security;
    however, keep in mind that one of the quintessential benefits of using mobile
    clients is also one of the most difficult vulnerabilities to mitigate. Think about
    how easy it is for someone to walk away with your smartphone or laptop, and you''ll
    understand what I mean.


    # Factors That Exacerbate Wireless Client Vulnerabilities


    In addition to the major categories just mentioned, several factors can exacerbate
    any vulnerability on client devices. These factors can apply to any of the major
    categories. Consider some of these facts:


    +   * Wireless clients are everywhere.

    * Wireless clients are constantly broadcasting their existence.

    * Wireless clients are not monitored as closely as infrastructure devices.

    * Physical security is often completely neglected.'
