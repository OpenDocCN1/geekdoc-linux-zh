- img_proc: true
  md: '# Chapter 7 Understanding the WPA2-Enterprise with Certificates Architecture
    169


    The recipient follows a very similar process to verify that the data is from me
    and hasn''t been changed in transit:


    +   1. The recipient takes my public key, which she already has, and decrypts
    the signature to get the output that I, the sender, has from hashing algorithm.


    +   2. The recipient takes all the unencrypted data and runs it through the same
    hashing algorithm.


    +   3. The recipient compares the two values: the unencrypted challenge and the
    hash that has derived. If they match, she knows that the data has not been tampered
    with because she used my public key to obtain the same hash result.


    A hash or "one-way hash" is an integral part of many cryptographic systems. A
    hashing algorithm is very similar to an encryption algorithm, except that the
    resulting ciphertext cannot be decrypted. It seems a little odd, doesn''t it?
    Let''s take a deeper look at how this works and why it would be used.


    Functions take in a variable amount of data and produce a fixed-length hash code,
    or simply "hash." The reason for this is simple: If we want to verify that two
    sets of data are the same, we run both sets of data through a hash algorithm and
    if the result (which is much smaller and easier to compare) is the same, we know
    the input data was the same. The data input can be anything from a binary program
    file, an entire e-book, or an email with words in it. The resulting hash will
    still be the fixed length.


    The hash function cannot be reversed, meaning you cannot take the hash value,
    run it through a "reverse hashing algorithm" and come up with the original data.
    This is where the term *one-way hash* comes from. Arguably the two most popular
    hashing algorithms today are Secure Hash Algorithm (SHA) and Message Digest Five
    (MD5). MD5 produces a 128-bit output, whereas SHA-1 produces a 160-bit hash value.
    In Figure 7-5, you''ll see that although values are different in size they both
    produce the same output length from the hash function.


    Many password systems use a hashing algorithm to store the "encrypted" value of
    the password on the system. Both Unix and Windows systems store passwords as hashed
    values. If an attacker obtained these hashed values, he couldn''t reverse them.
    Although you can''t reverse a hashed password, you can obtain a password via brute
    forcing. Remember that brute forcing a password involves running a list of cleartext
    passwords through the hashing algorithm; if the resultant hash matches the user''s
    hash, you have ascertained the password.'
