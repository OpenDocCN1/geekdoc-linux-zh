  md: '# Wireless Network Security: A Beginner''s Guide


    > ### In Actual Practice

    Every time someone learns that cracking WEP is possible, they almost always ask
    the same question: How long does it really take? The answer is simple: It depends.
    However, I can say that in my personal experience, the fastest real-world time
    it has taken me to crack a WEP key was about 15 minutes, from sniffing to obtaining
    the key.


    Going into too much detail on exactly how WEP has been broken would not be helpful
    here. Just understand that any cryptographic system is based heavily on relatively
    complex mathematics (and, ironically, also some very simple mathematics). When
    your security protocol is cryptographically broken, there is an issue with the
    underlying mathematical equations.


    # Attacking WEP Encrypted Networks


    Now that you have an understanding of the history of WEP attacks, let''s dive
    into exactly how these attacks would be carried out.


    The basic attack flow would look like this:


    +   1. Identify target wireless network.

    2. Passively monitor encrypted packets sent between the client and the access
    point using a sniffer.

    3. Save around 50,000 encrypted packets to a file on the attacking laptop.

    4. Run the aircrack-ng program against the saved encrypted packets to determine
    WEP key.


    Once you have successfully obtained the WEP key, either you can associate with
    the access point or you can continue to monitor network traffic. Remember that
    because WEP uses the shared key among all hosts on the network, any host can decrypt
    communications between any client. After associating to the access point, an attacker
    could try to infiltrate deeper into the network.


    Now this sounds great, but if the target wireless network isn''t heavily utilized?
    It might take us a surprising amount of time to get the necessary amount of packets
    to crack the WEP key. Well, there is a solution—we simply make the wireless network
    generate more traffic.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# Chapter 3 Theory of Attacks on Wireless Networks 63


    So does one incite the systems on the wireless network to generate more traffic?
    Remember, we don''t know the WEP key, so we can''t create our own packet and encrypt
    it. What we can do is replay a legitimate packet that we''ve captured on the wireless
    network. Big deal, so we send a packet back to the access point that we captured
    and the packet will have an IV that we''ve already captured. Not only that, but
    if we send a random packet, it will probably be meaningless and just get dropped.


    Say, for example, we replay the last packet in an HTTP request; all that''s going
    to happen the destination system will discard this packet because it''s either
    for a connection that has already ended or for a segment that has already been
    received. Therefore, we have two stumbling blocks: we need to send a packet that
    will generate a response from the destination system and we need to choose this
    packet without being able to see its contents (remember the packet is WEP encrypted
    with a key we don''t).


    Now you will have a appreciation for the power of inference. Remember that WEP
    is a stream cipher, which means the encrypted packet is (basically) the same length
    as the unencrypted packet. So, if we can infer a packet is a specific type based
    on its length, that might help, but which packet would also guarantee a response?
    How about ARP packet? Eureka! An ARP packet is a very specific size because there
    are no real variable-length fields. It''s also a relatively unique size because
    it''s so small. And if we send out an ARP request, the destination system should
    respond with an ARP reply! Wow, this sounds too good to be true; it can''t actually
    work, can it? Well, guess what, it does!


    This attack is referred to as a packet injection attack or an ARP replay attack
    and is carried out using the airplay-ng tool.


    The modified attack flow would look like this:


    +   1. Identify the target wireless network.

    2. Passively monitor encrypted packets sent between the client and the access
    point using a sniffer.

    3. Monitor for an ARP packet.

    4. Continuously resend the ARP packet.

    5. Every ARP response will have another unique IV.

    6. Save around 50,000 encrypted packets to a file on the attacking laptop.

    7. Run the aircrack-ng program against the saved encrypted packets to determine
    the WEP key.'
