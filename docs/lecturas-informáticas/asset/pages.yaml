  md: 'Chapter 10: Using Implicit Rules


    The variable SUFFIXES is defined to the default list of suffixes before make reads
    any makefiles. You can change the list of suffixes with a rule for the special
    target .SUFFIXES, but that does not alter this variable.


    # 10.8 Implicit Rule Search Algorithm


    Here is the procedure make uses for searching for an implicit rule for a target
    t. This procedure is followed for each double-colon rule with recipe, for each
    target of ordinary rules which have a recipe, and each prerequisite that is not
    the target of any rule. It is also followed recursively for prerequisites that
    come from implicit rules, in the search for a chain of rules.


    Suffix rules are not mentioned in this algorithm because suffix are converted
    to equivalent rules once the makefiles have been read.


    For an archive member of the form ''archive(member)'', the following algorithm
    is run once, using the entire target name t, and using ''(member)'' as the target
    t if the first run found no.


    +   1. Split t into a directory part, called d, and the rest, called n. For example,
    if t is ''src/foo.o'', then d is ''src/'' and n is ''foo.o''.

    2. Make a list of all the rules whose targets matches t or n.

    3. If any rule in that list is not a match-anything rule, against n, remove all
    non-terminal matching-anything rules from the list.

    4. Remove from the list rules with no recipe.

    5. For each rule in the list:


    +   a. Find the s, which is the nonempty part of t or n matched by the ''%s''
    in the target pattern.

    b. Compute the prerequisite names by substituting s for ''%s''; if the target
    pattern does not contain a chain, append d to the front of each prerequisite name.

    c. Test whether all the prerequisites exist or ought to exist. (If a file is mentioned
    in the makefile as a target or as an explicit prerequisite, we say it ought to
    exist).


    If all prerequisites exist or ought to exist, or there are no prerequisites, then
    this rule applies.


    +   6. If no pattern rule has been found so far, try harder. For each pattern
    in the list:

    a. If the rule is terminal, ignore it and go to the next rule.

    b. Compute the prerequisite names as before.

    c. Test whether all the prerequisites exist or ought to exist.

    d. For each prerequisite that does not exist, follow this algorithm recursively
    to see if the prerequisite can be made by an implicit rule.

    e. If all prerequisites exist, ought to exist, or can be made by implicit rules,
    then this rule applies.


    +   7. If no implicit rule applies, the rule for .DEFAULT, if any, applies. In
    that case, give t the same recipe that .DEFAULT. Otherwise, there is no recipe
    for t.'
