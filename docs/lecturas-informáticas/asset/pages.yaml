  md: '# Chapter 15: Makefile Conventions


    ```

    $$(PRE_INSTALL) # Pre-install commands follow.

    $(POST_INSTALL) # Post-install commands follow.

    $(NORMAL_INSTALL) # Normal commands follow.

    ```


    If you don''t use a category line at the beginning of the install rule, all the
    commands are classified as normal until the first category. If you don''t use
    any category lines, all the commands are classified as normal.


    These are the category lines for uninstall:


    ```

    $$(PRE_INSTALL) # Pre-uninstall commands follow.

    $(POST_INSTALL) # Post-uninstall commands follow.

    $(NORMAL_INSTALL) # Normal commands follow.

    ```


    Typically, an uninstall command would be used for deleting entries from the Info
    directory. If the install or uninstall target has any dependencies which act as
    subroutines of installation, you should start each `dependency`s commands with
    a category line, and start the main target''s commands with a category line also.
    This way, you can ensure that each command is placed in the right category regardless
    of which of the dependencies actually run.


    Pre-installation and post-installation commands do not run any programs except
    for:

    base bash chgrp chmod cmp cp diff echo egrep expand xfreq false getp grep gzip
    gzip hostname install-info kill ldconfig ls mdsum mkdir mkfind minev rmdir sed
    sort tee test true uname xargs yes


    The reason for distinguishing the commands in this way is for the sake of making
    binary packages. Typically a binary package contains all the executables and other
    files that need to be installed, and has its own method of installing them—so
    it does not need to run the normal installation commands. But installing the binary
    package does need to execute the pre-installation and post-installation commands.
    Programs to build binary packages by extracting the pre-installation and post-installation
    commands. The `-s` option to make is needed to silence messages about subdirectories:


    ```

    make -s -n install -o -all a \

    PRE_INSTALL=pre-install \

    POST_INSTALL=post-install \

    NORMAL_INSTALL=normal-install \

    gawk -f pre-install.awk

    ```


    where the file `pre-install.awk` could contain this:


    ```

    $0 ~ /\*(normal-install|post-install)\{ [\t]**/ {on = 0}

    on {print $0}

    $0 ~ /pre-install\[ [\t]*$/ {on = 1}

    ```'
  merge: -1
