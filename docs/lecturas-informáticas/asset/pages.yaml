  md: '# 6.11 Target-specific Variable Values


    Variable values in make are usually global; they are the same regardless of where
    they are evaluated (unless they reset, of course). One exception to that is automatic
    variables (see Section 10.5.3 [Automatic Variables], page 120).


    The other exception is target-specific variables. This feature allows you to define
    different values for the same variable, based on the target that make is currently
    building. As with automatic variables, these values are only available within
    the context of the target''s recipe (and in other target-specific assignments).


    Set a target-specific variable value like this:


    ```

    target := variable-assignment

    ```


    Multiple targets create a target-specific variable value for each member of the
    target list individually. , recursive (*), simple (:= or =), appending (+=), or
    conditional (?). All variables within the target-assignment are evaluated within
    the context of the target: thus, any previously defined target-specific variable
    values will be in effect. Note that this variable is actually distinct from any
    "global" value; the two do not have the same flavor (recursive vs. simple).


    Target-specific variables have the same priority as any other variable. Variables
    provided on the command line (and in the environment if the -e option is in force)
    will take precedence. Specifying the override directive will allow the target-specific
    variable value to be preferred.


    There is one more special feature of target-specific variables: when you define
    a target-specific variable value it is also in effect for all prerequisites of
    this target, all their prerequisites, etc. (unless those prerequisites override
    with their own target-specific variable value). For, an example, like this:


    ```

    prog : CFLAGS = -g

    prog : prog.o foo.bar

    ```


    will set CFLAGS to ''-g'' in the recipe for ''prog'', but it will also set CFLAGS
    in the recipes that create ''prog.o'', ''foo.bar'', and any recipes which create
    their prerequisites.


    Be aware that a prerequisite will only be built once invocation of make, if the
    same file is a prerequisite of multiple targets, and each of those targets has
    a different value for the target-specific variable, then the first target to be
    built will cause that prerequisite to inherit the target-specific value from the
    first target. It will ignore the target-specific values from any other targets.


