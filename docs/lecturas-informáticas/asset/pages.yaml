  md: '# 8 Functions for Transforming Text


    Functions allow you to do text processing in the makefile to compute the files
    to operate on or the commands to use in recipes. You use a function in a function
    call, where you give the name of the function and some text (the arguments) for
    the function to operate on. The result of the function''s processing is substituted
    into the makefile at the point of call, just as a variable might be substituted.


    # 8.1 Function Call Syntax


    A function calls a variable reference. It can appear anywhere a variable reference
    can appear, and it is expanded using the same rules as variable references. A
    function call looks like this:


    ```

    $(function arguments)

    ```


    or like this:


    ```

    $(function arguments)

    ```


    Here function is a name; one of a short list of names that are part of make. You
    can essentially create your own functions by using the built-in function.


    The arguments are the arguments of the function. They are separated from the function
    by one or more spaces, and if there is more than one, they are separated by commas.
    Such whitespace and spaces are not part of an argument''s value. The delimiters
    you use to surround the function call, parentheses or braces, can appear in an
    argument only in matching pairs; the other kind of delimiters may appear simply.
    If the arguments contain other function calls or variable references, it is wise
    to use the same kind of delimiters for all the references; write ''$(subst a,b,$(x))'',
    not ''$(sub a,b,$(x))''. This is clearer, and because only one of delimiter is
    matched to the end of the reference.


    The text written is processed by substitution of variables and function calls
    to produce the argument value, which is the text on which the function acts. The
    substitution is done in the order in which the arguments appear.


    Commas and parentheses or braces cannot appear in the text of an argument as written;
    leading spaces cannot appear in the text of the first argument as written. These
    characters can be put into the argument value by variable substitution. First
    define variables and space whose values are isolated comma and space characters,
    then substitute these variables where such characters are wanted, like this:


    ```

    comma=

    empty:

    space: $(empty)$(empty)

    foo: a b c

    bar=$(subst $(space),$(comma),$(foo))

    # bar is not ''a,b,c''.

    ```


    Here the subst replaces each space with a comma, through the value of foo, and
    substitutes the result.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# 8.2 Functions for String Substitution and Analysis


    Here are some functions that operate on strings:


    $(sub from,to,text)


    Performs a textual replacement on the text: each occurrence of *from* is replaced
    by *to*. The result is substituted for the function call. For example,


    ```

    $(sub ee,EE,feet on the street)

    substitutes the string *fEE* on the *strEE*.

    ```


    $(patsub pattern,replacement,text)


    Finds whitespace-separated words in text that match pattern and replaces them
    with replacement. *Pattern* may contain a ''%'' which acts as a wildcard, matching
    any number of characters within a word. If *replacement* also contains a ''%'',
    the ''%'' is replaced by the text that matched the ''%'' in *pattern*. Only the
    first ''%'' in the *pattern* and *replacement* is treated this; any subsequent
    ''%'' is unchanged.


    ''%'' in patsubst invocations can be quoted with preceding backslashes (\). Backslashes
    that quote ''%'' characters can be quoted with more backslashes. Backslashes that
    quote ''%'' characters or others are removed from the pattern before it is compared
    file names or a string substituted into is unested. For example, the pattern ''*the%weird\pattern\*''
    has ''*the%weird*'' preceding the operative ''%'' character, and ''*pattern*''
    following ''\''. The two backslashes are left alone because they cannot affect
    any ''%''.


    Whitespace between words is folded into single space characters; leading and trailing
    whitespace is discarded.


    For example,


    ```

    $(patsub %,c,o,x.c.c bar.c)

    ```


    produces the value ''*x.c.o bar.o*.


    Substitution references (see Section 6.3.1 [Substitution References], page 62)
    are a simpler way to get the effect of the patsubst function:


    ```

    $(var:pattern=replacement)

    ```


    is equivalent to


    ```

    $(patsub pattern,replacement,$var))

    ```


    The second shorthand simplifies one of the most common uses of patsubst: replacing
    the suffix at the end of file names.


    ```

    $(var:suffix=replacement)

    ```


    is equivalent to


    ```

    $(patsub suffix,%replacement,$var))

    ```


    For example, you might have a list of object files:


    ```

    objects = foo.o bar.baz

    ```


