    # 6.2 The Two Flavors of Variables


    There are two ways a variable in GNU make have a value; we call them the two flavors
    of variables. They are distinguished in how they are defined and in what they
    are expanded.


    The first flavor is a recursively expanded variable. Variables of this sort are
    defined by lines using ''-'' (see Section 6.5 [Setting Variables], page 65) or
    by the define directive (see Section 6.8 [Defining Multi-Line Variables], page
    69). The value you specify is installed variable; if it contains references to
    other variables, these are expanded whenever this variable is substituted (in
    the case of expanding some other string). When this happens, it is called recursive
    expansion.


    For example:


    ```

    foo = $(bar)

    bar = $(ugh)

    ugh = Huh;

    ```


    will echo ''Huh?'': ''$foo'' expands to ''$(bar)'' which expands to ''$(ugh)''
    which finally expands to ''Huh''.


    This flavor is the only sort supported by most other versions of make. It has
    its advantages and disadvantages. An advantage (most would say):


