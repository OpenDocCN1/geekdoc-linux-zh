    Normally we do not recommend stripping an executable unless you are sure the program
    has no bug. However, it can be reasonable to install a stripped executable for
    actual execution while saving the unstripped executable elsewhere in there is
    a bug.


    +   - clean: Delete all files in the current directory that are normally created
    by building the program. Delete files in other directories if they are created
    by this makefile. However, don''t delete the files that record the configuration.
    Also preserve files that could be made by building, but normally aren''t because
    the distribution comes with them. There is no need to delete parent directories
    that were created with ''mkdir -p'', since they could have existed anyway.


    +   - Delete *.dvl files if they are not part of the distribution.


    +   - distclean: Delete all files in the current directory (or created by this
    makefile) that are created of configuring or building the program. If you have
    unpacked the source and built the program without creating any other files, ''make
    distclean'' should leave only the files that were in the distribution. However,
