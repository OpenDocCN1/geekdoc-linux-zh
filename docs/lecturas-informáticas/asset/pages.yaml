    The following may have failed to achieve the desired results:


    ```

    .PHONY: all

    ifeq "$(needs_made)\ ""

    all: $(needs_made)

    else

    all::@echo "Nothing to make!"

    endif

    ```


    Replacing the variable reference ''$(needs_made)'' with the call ''$((strip $(needs_made))''
    in the ifeq directive would make it more robust.


    $(find string)

    Searches for an occurrence of find. If it occurs, the value is find; otherwise,
    the value is empty. You can use this function in a conditional test for the presence
    of a substring in a given string. Thus, the two examples:


    ```

    $(findstring a b c)

    $(findstring a b c)

    ```


    produces the values ''a'' and '''' (the empty string), respectively. See Section
    7.3 [Testing Flags], page 80, for a practical application of findstring.


    $(filter ...,text)

    Returns all whitespace-separated words in text that do not match any of the pattern
    words, removing the words that do not match. The patterns are written using %,
    like the patterns used in the paysub function.

    The filter function can be used to separate different types of strings (such as
    file names) in variable. For example:


    ```

    sources := foo.bar baz.ugh

    foo: $(sources)

    cc $(filter %,%,$(sources)) -o foo

    ```


    says that ''foo'' depends on ''foo.c'', ''bar.c'', ''baz.s'' but only ''foo.c'',
    ''bar.c'' and ''baz.s'' should be specified in the command piler.


    $(filter-out pattern...,text)

    Returns all whitespace-separated words in text that do not match any of the pattern
    words, removing the words that do one or more. This is the exact opposite of the
    filter function.'
