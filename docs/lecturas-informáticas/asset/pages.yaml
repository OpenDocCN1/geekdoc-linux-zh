  md: '# 3.3 Including Other Makefiles


    The include directive tells make to suspend the current makefile and read one
    or more makefiles before continuing. The directive is a line in the makefile that
    looks like this:


    ```

    include filenames...

    ```


    filenames can contain shell file patterns. If filenames is empty, nothing is included
    and no error is printed.


    Extra spaces are allowed and ignored at the beginning of the line, but the first
    character must not be a tab (or the value of .RECIPEPREFIX)—if the line begins
    with a tab, it will be a recipe line. Whitespace is ignored between include and
    the file names, and between file names; extra whitespace is ignored there and
    at the end of the directive. A comment starting with # is allowed the end of the
    line. If the file contains any variable or function references, they are expanded.
    See Chapter 6 [How to Use Variables], 59.


    For example, if you have ''.mk'' files, ''a.mk'', ''b.mk'', and ''c.mk'', and
    $(bar) expands to bash bash, then the following expression


    ```

    include *.mk $(bar)

    ```


    is equivalent to


    ```

    include a.mk b.mk c.mk bish

    ```


    When make processes an include directive, it suspends reading of the containing
    makefile and reads from each listed file in. When that is finished, make resumes
    reading the makefile in which the directive appears.


    One occasion for using includes is when several programs, handled by individual
    makes in various directories, need to use a common set of variable definitions
    (see Section 6.5 [Setting Variables], page 65) or pattern rules (see Section 10.5
    [Defining and Redefining Pattern Rules], page 118).


    Another occasion is when you want to generate prerequisites from source files
    automatically; the prerequisites can be put in a file that is included by the
    main makefile. This practice is generally cleaner than that of appending the prerequisites
    to the end of the main make has been traditionally done with other versions of
    make. See Section 4.3 [Automatic Prerequisites], page 38.


    If the specified name does not contain a slash, and the file is not found in the
    current directory, other directories are searched. First, any the directories
    specified with the ''-I'' or ''--include-dir'' option are searched (see Section
    9.7 [Summary of Options], page 104). Then the following directories (if they exist)
    are searched, in order: ''prefix/include'' (normally ''/usr/local/include'')¹
    /usr/local/include'', /usr/local/include''.


    If an includedmakefile cannot be found in any of these directories, a warning
    message is generated, but it is not an immediately fatal error; processing of
    the makefile containing the include continues. Once it has finished reading makefiles,
    make will try to remake any that are out of date or do not exist. See Section
    3.5 [How Makefiles Are Remade], page 14.


    +   GNU Make for MS-DOS and MS-Windows behaves as if prefix has defined to be
    the root of the DJTPP tree hierarchy.'
  merge: -1
