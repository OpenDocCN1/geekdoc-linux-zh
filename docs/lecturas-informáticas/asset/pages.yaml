    # 9.5 Overriding Variables


    An argument contains `v=x` specifies the value of a variable: `v` to x. If you
    specify a value in this, all ordinary assignments of the same variable in the
    makefile are ignored; we say they have overridden by the command line.


    The common way to use this facility is to pass extra flags to compilers. For example,
    in a properly written makefile, the variable `CFLAGS` is included in each recipe
    that runs the C compiler, so `CFLAGS foo.c` would be compiled something like this:


    ```

    cc -c ($CFLAGS) foo.c

    ```


    Thus, whatever value you set for CFLAGS affects each compilation that occurs.
    The makefile probably uses the usual value for CFLAGS, like this:


    ```

    CFLAGS=-

    ```


    Each time you run make, you can override this value if you wish. For example,
    if you make `CFLAGS=''g -O''`, each compilation will be done `cc -g -O`. This
    illustrates how you can use quoting in the shell to enclose spaces and special
    characters in the value of a variable when you override it.


    The variable CFLAGS is only one of many standard variables that exist just that
    you can change them this way. See Section 10.3 [Variables Used by Implicit Rules],
    page 115, for a complete list.


    You can also program the makefile to look at additional variables of yours, giving
    the user the ability to control other aspects of how the makefile works by changing
    the variables.


    When you override a variable with a command argument, you can define either a
    recursively-expanded or a simply-expanded variable. The examples shown above make
    recursively-expanded variables; to make a simply-expanded variable, write `v=''`
    or `v::`. But, unless you want to include a reference or function call in the
    value you specify, it makes no difference what kind of variable you create.


    There is one other way that can change a variable that has been overridden. This
    is to use the override directive, which is a line that looks like this: `override
    variable value=''value''` (see Section 6.7 [The override Directive], page 68).'
