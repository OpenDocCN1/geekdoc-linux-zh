  md: '# 6 How to Use Variables


    A variable is a name defined in a makefile to represent a string of text, called
    the variable''s value. Values are substituted by explicit request into targets,
    prerequisites, recipes, and other parts of the makefile. (In some other versions
    of make, variables are called macros).


    Variables and functions in all parts of a makefile are expanded when make, except
    in recipes, the right-hand side of variable definitions using "-", and the bodies
    of variable definitions using the define directive.


    Variables can represent lists of file names, options to compilers, programs to
    run, directories to look in source files, to write output in, or anything else
    you can imagine.


    A variable name may be any sequence of characters not containing '':'', ''#'',
    or whitespace. However, variable names containing other than letters, numbers,
    and underscores should be considered carefully, as in shells they cannot be passed
    through the environment to a sub-make (see Section 5.7.2 Communicating Variables
    to a Sub-make, page 52). Variable names beginning with ''.'' and an uppercase
    letter may be given special meaning in future versions of make.


    Variable names are case-sensitive. The names ''foo'', ''FOOD'', and ''Foo'' all
    refer to different variables.

    It is traditional to use case letters in variable names, but we recommend using
    lower case letters for variable names that serve internal purposes in the makefile,
    and reserving upper case for control rules or for parameters that the user should
    override with command options (see Section 9.5 Overriding Variables, page 103).


    A few variables have names that are a single punctuation character or just a few
    characters. These are the automatic variables, and they have particular specialized
    uses. See Section 10.5.3 [Automatic Variables], page 120.


    # 6.1 Basics of Variable References


    To substitute a variable''s value, write a dollar sign followed by the name of
    the variable in parentheses: ''$(foo)'' or ''${foo}'' is a valid reference to
    the variable foo. This special significance of ''$'' is why you must write ''$''
    to have the effect of a single dollar sign in a file or recipe.


    Variable references can be used in any context: targets, पड़ेगा, most directives,
    and variable values. Here is an example of a common case, where a variable holds
    the name of all the objects in a file:


    ```

    objects = program.foo utils.o

    program : $(objects)

    cc -o program $(objects)

    ```


    ```

    $(objects) = defs.h

    Variable works by strict textual substitution. Thus, the rule

    ```


    ```

    foo = o

    prog.o : prog.$(foo)

    $(foo)$(foo) -$(foo) prog.$(foo)

    ```'
