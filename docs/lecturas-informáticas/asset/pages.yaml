  md: '# 12.2 Loading Dynamic Objects


    > **Warning:** The load directive and extension capability is considered a “technology
    preview” in this release of GNU make. We encourage you to experiment with this
    feature and we appreciate your feedback on it. However we cannot guarantee backward-compatibility
    in the next release. Consider using GNU instead of extending GNU make (Section
    8.14 [The guile Function], page 97).


    Many operating systems provide a facility for dynamically compiled objects. If
    your system provides this facility, GNU make can use of it to load dynamic objects
    at runtime, providing new objects which may be invoked by your make.


    The load directive is used to load a dynamic object. Once the object is loaded,
    a “setup” function will be invoked to allow the object to initialize itself and
    register new facilities with GNU make. A dynamic object might include make functions,
    for example, and the “setup” function would register them with GNU make’s function
    handling system.


    # 12.2.1 The load Directive


    Objects are loaded into GNU make by placing the load directive into your makefile.
    The syntax of load-file is as follows:


    ```

    load-file ...

    or:

    load-file(symbol-name) ...

    ```


    The file-object is dynamically loaded by GNU make. If object-file does not include
    a directory path then it is first looked for in the current directory. If it is
    not found, or a directory path is included, then system-specific paths will be
    searched. If the load fails for reason, make will print a message and exit.


    If symbol-name is provided, it will be used as the name of the initializing function.

    If no symbol-name is provided, the initializing function name is created by taking
    the base name of object-file, up to the first character which is not a valid symbol
    character (alphanumerics and underscores are valid symbol characters). This prefix
    will be appended the suffix _mk_suffix.


    More than one object may be loaded with a single load directive, and both forms
    of arguments may be used in the same domain.


    The initializing function will provide the file name and line number of the invocation
    of the load operation. It should return a value of type int, which must be 0 on
    failure and non-0 on success. If the return value is -1, GNU make will not attempt
    to rebuild the object file (see Section 12.2 [How Loaded Objects Are Remaded],
    page 137).


    For example:


    ```

    load ..mk_funcs.so

    will load the dynamic object ‘mk_funcs.so’. After the object is loaded, make will
    invoke the function (assumed to be defined by the shared object) mk_funcs_gmk_setup.

    ```


    On the other hand:'
