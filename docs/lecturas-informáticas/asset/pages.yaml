  md: '# 10.5.6 Canceling Implicit Rules


    You can override a built-in implicit rule (or one you have defined yourself) by
    defining a new pattern rule with the same target and prerequisites, but a different
    recipe. When the new rule is defined, the built-in one is replaced. The new rule''s
    position in the sequence of implicit rules is determined by where you write the
    rule.


    You can cancel a built-in implicit rule by defining a pattern rule with the same
    target and prerequisites, but no recipe. For example, the following would cancel
    the rule that runs the assembler:


    ```

    %.0: %s

    ```


    # 10.6 Defining Last-Resort Default Rules


    You can define a last-resort implicit by writing a terminal-matching pattern rule
    with no prerequisites (see Section 10.5.5 [Match-Anything Rules], page 123). This
    is just like any pattern rule; the only thing special about it is that it will
    match any target. Such a rule''s recipe is used for all targets and prerequisites
    that have no recipe of their own and for no other implicit rule applies.


    For example, when testing a myfile, you might not have the source files contain
    real data, only that they exist. You might do this:


    ```

    $$:

    ```


    You can instead define a recipe to be used for targets where there are no rules
    at all, even ones that do not specify recipes. You do this by writing a rule for
    the target .DEFAULT. A rule''s recipe is used for all prerequisites that do not
    appear as targets in any implicit rule, and for which no implicit rule applies.
    Naturally, there is no .DEFAULT unless you write one.


    If you use .DEFAULT with no recipe for prerequisites:


    ```

    .DEFAULT:

    ```


    the recipe stored for .DEFAULT is cleared. Then make acts as if you had never
    defined .DEFAULT at all.


    If you do not want a target to get the recipe from a match-anything pattern rule
    or .DEFAULT, you also do not want any recipe to be for the target, you can give
    it an empty recipe (see Section 5.9 [Defining Empty Recipes], page 57).


    You can use a last-resort rule to override part of another include. See Section
    3.6 [Overriding Part of Another Makefile], page 15.


