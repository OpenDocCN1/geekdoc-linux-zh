    #  5.8 Defining Canned Recipes


    When the sequence of commands is useful in making various targets, you can define
    it as a canned sequence with the define directive, and refer to the canned sequence
    from the recipes for those targets. The canned sequence is actually a variable,
    so the name must not conflict with other variables.


    Here is an example of defining a canned recipe:


    ```

    define run-yacc

    yacc $(firstword $)

    mv y.tab.c$

    def

    ```


    Here run-yacc is the name of the variable being defined; endf marks the end of
    the definition; the lines in between are the commands. The define directive does
    not expand variable references and functions in the canned sequence; the ''$''
    characters, parentheses, variable names, and so on, all become part of the variable
    you are defining. Section 6.8 [Multi-Line Variables], page 69, for a complete
    explanation of define.


    The first command in use Yacc is the first prerequisite of which rule uses the
    canned sequence. The output file from Yacc is always ''y.tab.c''. The second command
    moves the output to the rule''s target file name.


    To use the canned sequence, substitute the variable in the recipe of a rule. You
    can substitute it like any other variable (see Section 6.1 [Basics of Variable
    References], page 59). Because variables defined by define are recursively expanded,
    all the variable references you write inside the define are expanded now. For
    example:


    ```

    foo : foo.y

    $(run-yacc)

    ```


    ''foo'' will be substituted for the variable ''$'' when it occurs in run-yacc''s
    value, and ''foo.c'' for ''$0''.


    This is a realistic example, but this particular is not needed in practice because
    make has an implicit rule to figure out these commands based on the file names
    (see Chapter 10 [Implicit Rules], page 111).


    In recipe execution, each line of a canned sequence is treated just as if the
    line appeared on its own, preceded by a tab. make invokes a sub-shell for each
    line. You can use the special prefix characters that affect command lines (''@'',
    ''-'', and ''+'') on each line of a canned sequence. For example, this canned
    sequence:


    ```

    define frobnicating =

    @echo "frobnicating target $"

    frob-step-1 < -o $$-step-1

    frob-step-2 <o $$-step-1 -o $$

    defef

    ```'
