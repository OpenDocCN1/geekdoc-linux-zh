    installdirs: mkinstldirs\n\t$(src)/mkinstldirs $(bindir) $(DESTDIR)$$(datadir)\
    \ \\\n\t$(DESTDIR)$$(libdir) $(DESTDIR)$$(infodir) \\\n\t$(DESTDIR)$$(mandir)\n\
    ```\n\nThis rule should not modify the directories where compilation is done.\
    \ It should not but create directories.\n\n# 15.7 Install Command Categories\n\
    \nWhen writing the install target, you must classify all the commands into three\
    \ categories: normal, pre-installation and post-installation commands.\n\nNormal\
    \ commands move files into their proper places, and set their modes. They may\
    \ not alter any files except the ones that come entirely from the package they\
    \ belong to.\n\nPre-installation and post-installation commands may alter other\
    \ files; in particular, they can edit global configuration files or data bases.\n\
    \nThe most common use for a post-installation command is to run install-info.\
    \ This cannot be done with a normal command, as it alters a file (the Info directory)\
    \ which does not come entirely and from the package being installed. It is a post-installation\
    \ command because it needs to be done after the normal command which installs\
    \ the package's Info files.\n\nMost programs don't need any pre-installation commands,\
    \ but we have the feature if it is needed.\n\nTo classify the install rule into\
    \ these three categories, insert category lines among them. A category line specifies\
    \ the category for the commands that follow.\n\nA category line consists of a\
    \ tab and a reference to a special Variable, plus an optional comment at the end.\
    \ There are three variables you can use, one for each category; the variable name\
    \ specifies the category. Category lines are no-ops in ordinary execution because\
    \ these Make variables are normally undefined (and you should not define them\
    \ in the makefile.\n\nHere are the three possible category lines, each with a\
    \ comment that explains what it means:"
