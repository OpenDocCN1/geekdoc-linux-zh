  md: '# GNU make


    Unlike most variables, the variable SHELL is never set from the environment. This
    is because the SHELL environment variable is used to specify your personal choice
    of shell program for interactive use. It would be very bad for personal choices
    like this to affect the functioning of makefiles. See Section 6.10 [Variables
    from the Environment], page 70.


    Furthermore, when you do set SHELL in your Makefile that is not exported in the
    environment to receive lines that make invokes. Instead, the value inherited from
    the user''s environment, if any, is exported. You can override this behavior by
    explicitly setting SHELL (see Section 5.7.2 [Communicating Variables to a Sub-make],
    page 52), forcing it to be passed in the environment to receive lines.


    However, on MS-DOS and MS-Windows the value of SHELL in the environment is used,
    since those systems do not use this variable, and therefore it is most likely
    specifically set to be used by make. On MS-DOS, if the setting of SHELL is not
    suitable for make, you can set the variable MAKESHE to the shell that make should
    use; if you use it as the shell instead of the value of SHELL.


    # Choosing a Shell in DOS and Windows


    Choosing a shell in MS-DOS and MS-Windows is much more complex than other systems.


    On MS-DOS, if the value is not set, the value of COMSPEC (which is always) is
    used.


    The processing of lines that set the variable SHELL in Makefiles is different
    on MS-DOS. The stock shell, ''command.com'', is ridiculously in its functionality
    and many ways of make intend to install a replacement shell. Therefore, on MS-DOS,
    make examines the value of SHELL, and changes its behavior based on whether it
    points to a Unix-style or DOS-style shell. This allows reasonable functionality
    even if SHELL points to ''command.com''.


    If SHELL points to a Unix-style shell, make on MS-DOS additionally checks whether
    that shell can be found; if not, it ignores the lines that set SHELL. In MS-DOS,
    GNU make searches for the shell in the following places:


    +   1. In the precise point pointed to the value of SHELL. For example, if the
    makefile ''SHELL = /bin/sh'', make will look in the directory ''/bin'' on the
    current drive.

    2. In the current directory.

    3. In all the directories in the PATH variable, in order.


    In every directory, make will first look for the specific file (''sh'' in the
    example above). If this is not found, it will also look in that directory for
    file with one of the known extensions that identify executable files. For example
    ''.exe'', ''.com'', ''.bat'', ''.btm'', ''.sh'', and some others.


    If any of these succeeds, the value of SHELL will be set to the full pathname
    of the shell. However, if none of them is found, the value of SHELL will not be
    changed, and thus the line it sets will be effectively ignored. This is so make
    will only support features to a Unix-style shell if such a shell is actually installed
    on the system where make runs.


    Note that this extended search for the shell is limited to the cases where SHELL
    is set from the Makefile; if it is set in the environment or command line, you
    are expected to set it to the full pathname of the shell, exactly as things are
    on Unix.'
