  md: "# 7 Conditional Parts of Makefiles\n\nA conditional directive causes part of\
    \ a makefile to be obeyed or ignored depending on the values of variables. Conditionals\
    \ compare the value of one variable to another, or the value of a variable to\
    \ a constant string. Conditionals control what make actually \"sees\" in the makefile,\
    \ so they cannot be used to control recipes at the time of execution.\n\n# 7.1\
    \ Example of a Conditional\n\nThe following example of a conditional tells make\
    \ to use one of libraries if the CC variable is 'gcc', and a different set of\
    \ libraries otherwise. It works by controlling which two recipes will be used\
    \ for the rule. The result is that \"CC=gcc\" as an argument to make changes not\
    \ only compiler used but also libraries are linked.\n\n```\nlibs_for_gcc = -lgnu\n\
    normal_libs =\n\nfoo:$(objects)\\ifeq ($(CC),gcc)\n\t$(CC) -o $(objects) $(libs_for_gcc)\n\
    else\n\t$(CC) -o $(objects) $(normal_libs)\nendif\n```\n\nThis example uses three\
    \ directives: one ifeq, one else and one endif.\nThe ifeq directive begins the\
    \ conditional, and specifies the condition. It contains two arguments, separated\
    \ by a comma and surrounded by parentheses. Variable substitution is performed\
    \ on both arguments and then they are compared. The lines of the makefile following\
    \ the ifeq obeyed if the two arguments match; otherwise they are ignored.\n\n\
    The else directive causes the following lines to be obeyed if the previous conditional\
    \ failed. In example above, this means that the second alternative linking command\
    \ is used whenever the first alternative is not. It is option to have an else\
    \ in a conditional.\n\nThe endif directive ends the conditional. Every conditional\
    \ must end with an endif. Unconditional makefile text follows.\n\nAs this example\
    \ illustrates, conditionals work at the textual level: the lines of the conditional\
    \ are treated as part of the makefile, or ignored, according to the condition.\
    \ This is why the larger syntactic units of the makefile, as rules, may cross\
    \ the beginning or the end of the conditional.\n\nWhen the variable CC has the\
    \ value 'gcc', the above example has this effect:\n\n```\nfoo:$(objects)\n\t$(CC)\
    \ -o $(objects) $(libs_for_gcc)\n```\n\nWhen the variable CC has any other value,\
    \ the effect is this:\n\n```\nfoo:$(objects)\n\t$(CC) -o $(objects) $(normal_libs)\n\
    ```\n\nEquivalent results can be obtained in another way by conditionalizing a\
    \ variable assignment and then using the variable unconditionally:"
  merge: -1
