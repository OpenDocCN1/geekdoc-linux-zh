    ```


    $(strip string)

    Removes leading and trailing whitespace from string and replaces any of one or
    more whitespaces with a single space. Thus, ''$(strip a b c )'' replaces in ''a
    b c''.

    The function strip be very useful when used in conjunction with conditionals.
    When comparing with the empty string " using ifeq or usually want a string of
    just whitespace to match the empty string (see Chapter 7 [Conditionals], page
