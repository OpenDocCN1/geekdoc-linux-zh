    \ not undo expansions which have already occurred; for example if you create a\
    \ simply expanded variable its value is expanded during the definition; in case\
    \ the value function will return the same result as using the variable directly.\n\
    \nThe syntax of the value function is:\n\n```\n$(value variable)\n```\n\nNote\
    \ that variable is the name of a variable, not a reference to that variable. Therefore\
    \ you would not normally use a '$ or parentheses when writing it. (You can, however,\
    \ use a variable reference in the function if you want the name to be a constant.)\n\
    \nThe result of this function is a string containing the value of variable, without\
    \ any expansion occurring. For example, in this myfile:\n\n```\nFOO = $PATH\n\n\
    all:\n  @echo $(FOO)\n  @echo $(value FOO)\n```\n\nThe first output line would\
    \ be ATH, since \"$P\" would be expanded as a make variable, and the second output\
    \ line would be the current value of your $PATH environment variable, since the\
    \ value function avoided the expansion.\n\nThe value function most often used\
    \ in conjunction with the eval function (see Section 8.9 [Eval Function], page\
    \ 93).\n\n# 8.9 The Eval Function\n\nThe eval function is very special: it allows\
    \ you to define new myfile constructs that are not constant; because they are\
