  md: '# Chapter 10: Using Implicit Rules


    Thus, a pattern rule %o : %.c shows how to make any file ''stem.o'' from another
    file ''stem.c''.


    Note that expansion using ''%'' in pattern rules occurs after any variable or
    function expansions, which take place when the make is read. See Chapter 6 [How
    to Use Variables], page 59, and Chapter 8 [Functions for Transforming Text], page
    83.


    # 10.5.1 Introduction to Pattern Rules


    A pattern contains the character ''%'' (exactly one of them) in the target; otherwise,
    it looks exactly like an ordinary rule. The pattern % matches any substring, while
    other characters match only themselves.


    For example, %.c as a pattern matches any name that ends in ''.c'', %.c as a pattern
    matches any file name that starts with ''.'' and ends in ''.c'' and is at least
    five characters long. (There must be at least one character to match the ''%'').
    The substring that ''%'' matches is called the stem.


    % in a prerequisite of a pattern rule stands for the same stem that was matched
    by ''%'' in the target. For the pattern rule to apply, its target pattern must
    match the file name and all of its prerequisites (after pattern substitution)
    must name files that exist or can be made.


    Thus, a rule of the form


    ```

    %o : %.c

    ```


    specifies how to make a file ''.o'', with another file ''.c'' as its prerequisite,
    provided that a prefix attaches to each file made by this pattern rule. These
    unvarnifying prerequisites are often occasionally.


    There may be prerequisites that do not use ''%''; or in fact no prerequisites
    at all.


    A pattern rule needs no prerequisites to match a target, or in fact no anywhere.
    A rule is effectively a wildcard. It provides a way to make any file that matches
    the target pattern. See Section 10.6 [Last Resort], page 125.


    More than one pattern may match a target. In this case make will choose the "best
    fit" rule rather than one target. See Section 10.5.4 [How Patterns Match], page
    122.


    Pattern rules may have many rules with the same prerequisites and recipe. If a
    pattern rule has multiple targets, the recipe is executed only once to make all
    the targets. When searching for a pattern rule to match a target, the patterns
    of a rule other than the one that matches the target in need of a rule are incidental:
    make worries only about giving a recipe and prerequisites to the file in question.
    However, when this file''s recipe is run, the other targets are marked as having
    been updated themselves.


    # 10.5.2 Pattern Rule Examples


    Here are examples of pattern rules actually predefined in make. First, the rule
    that compiles ''.c'' into ''.o'' files:


    ```

    %o : %.c

    $(CC) -c $(CFLAGS) $(CPPFLAGS) $< - $$

    ```'
