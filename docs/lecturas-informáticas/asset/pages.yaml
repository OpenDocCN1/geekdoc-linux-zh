  md: 'Chapter 14: Incompatibilities and Missing Features


    # 14 Incompatibilities and Missing Features


    The make programs in various systems support a few features that are not implemented
    in GNU make. The POSIX.2 standard (IEEE Standard 1003.2-1992) which specifies
    make does not require any of these.


    +   - A target of the form `file((entry))'' stands for a member of archive file
    file. The member is chosen, not by name, but by being an object file which defines
    the linker symbol entry.


    This feature was not put into GNU make because of the non-modularity of putting
    knowledge into make of the internal format of archive file symbol tables. See
    Section 11.2.1 [Updating Archive Directories], page 130.


    +   - Suffixes (in suffix rules) that end with the character ''*'' have a special
    meaning in System make; they refer to the SCCS for the file one would get without
    the ''*. For example, the suffix `.c*` would make the file `n.o` from the SCCS
    file coverage, a whole set of such rules is required. See Section 10.7 [Old-Fashioned
    Suffix Rules], page 125.


    In GNU make, these cases is handled by two patterns for extraction from SCCS,
    in combination with the general feature of rule chaining. See Section 10.4 [Chains
    of Implicit Rules], page 117.


    +   - In System V and 4.3 BSD make, files found by PATH search (see Section 4.4
    [Searching Directories for Prerequisites]) have their names changed inside make
    recipes. We feel it much cleaner to use automatic variables and thus make this
    feature obsolete.


    +   - In some Unix make


    We feel that such usage is broken. The prerequisite properties of make are well-defined
    (for GNU make, at), and doing such a thing simply does not fit the model.


    +   - GNU make not include any built-in rules for compiling or preprocessing EFL
    programs. If we hear of anyone who is using EFL, we will gladly add them.


    +   - It appears in SVR4 make, a suffix rule can be specified with no name, and
    if it had an implicit recipe (see Section 5.9 [Empty Recipes], page 57). For example:


    ```

    .c.a:

    ```


    will override the built-in ''c.a'' suffix rule.'
