  md: '# GNU make


    If you specify prerequisites for .SILENT, then make will not print the recipe
    to remake those particular files before executing them. .SILENT is ignored.


    If mentioned as a target with no prerequisites, .SILENT says not to print any
    recipes before executing them. This usage of ''.SILENT'' is supported only for
    historical compatibility. We recommend you use the more selective ways to silence
    specific recipes. See Section 5.2 [Recipe Echoing], page 43. If you want to silence
    all recipes for a particular run of make, use the ''-s'' or ''--silent'' option
    (see Section 9.7 [Options Summary], page 104).


    # .EXPORT_VARIABLES


    Simply by being mentioned as a target, this will make to export all variables
    to child processes by default. See Section 5.7.2 [Communicating Variables to a
    Sub-make], page 52.


    # .PARALLEL


    If .PARALLEL is mentioned as a target, then this invocation of make will run serially,
    if the ''-j'' option is given. Recursively invoked make will run recipes in parallel
    (unless its make also contains this target). Any prerequisites on this target
    are ignored.


    # .ONESHELL


    If .ONESHELL is mentioned as a target, then a target is built all lines of the
    recipe will be given to a single invocation of shell rather than each being invoked
    separately (see Section 5.3 [Recipe Execution], page 44).


    # .POSIX


    If .POSIX is mentioned as a target, then the Makefile will be parsed and run in
    POSIX-conforming mode. This does not mean that only POSIX-conforming makefiles
    will be accepted: advanced GNU make features are still available. Rather, this
    target causes make to behave as required by POSIX in areas where make''s default
    behavior differs.


    In particular, if this target is mentioned then recipes will be invoked as if
    the shell had been passed the -e flag: the first command in a recipe will cause
    the recipe to fail immediately.


    Any defined implicit rule also counts as a special target if it appears as a target,
    and so does the concatenation of two suffixes, such as ''.c.''. These targets
