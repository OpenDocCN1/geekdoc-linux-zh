  md: '# 13 Features of GNU make


    Here is a summary of the features of GNU make, for comparison with and credit
    to other versions of make. We consider the features of make in 4.2 BSD systems
    as a baseline. If you are concerned with writing portable makefiles, you should
    not use the features of make listed here, not in Chapter 14 [Missing], page 147.


    Many features come from the version of make in System V.


    +   * The VPATH variable and its selection. See Section 4.4 [Searching Directories
    for Prerequisites], page 25. This feature exists in System V, but is undocumented.
    It is documented in 4.3 BSD make (which limits System V''s VPATH feature).


    +   * Included makefiles. See Section 3.3 [Including Other Makefiles], page 13.
    Allowing multiple files to be included with a single directive is a GNU extension.


    +   * Variables are read from communicated via the environment. See Section 6.10
    [Variables from the Environment], page 70.


    +   * Options passed through the MAKEFLAGS variable to recursive invocations of
    make. See Section 5.7 [Communicating Options to a Sub-make], page 54.


    +   * The automatic variable $ is set to the member name in an archive reference.
    See Section 10.5.3 [Automatic Variables], page 120.


    +   * The automatic variables $@, $, $, and $ have corresponding forms like $(@)
    and ($). We were introduced by this $ to as an obvious extension. See Section
    10.5.3 [Automatic Variables], page 120.


    +   * Substitution variables. See Section 6.1 [Basics of Variable References],
    page 59.


    +   * The command line options ''-b'' and ''-m'', accepted and ignored. In System
    V, these options actually do something.


    +   * Execution of recursive commands to run make via MAKEFLAGS even if ''-n'',
    ''-q'' or ''-t'' is specified. See Section 5.7 [Recursive Use of make], page 50.


    +   * Support for suffix ''.a'' in GNU make, because the general rule of feature
    chaining in Section 10.4 [Chains of Implicit Rules], page 117 allows one pattern
    rule for installing members in an archive (see Section 11.2 [Archive Update],
    page 129) to be sufficient.


    +   * The arrangement of lines and backslash/newline in recipes is retained when
    the recipes are printed, so they appear as they do in make, except for the stripping
    of initial whitespace.


    The following features were implemented by other versions of make. In some cases
    it is unclear which versions performed which.


    +   * Pattern rules using ''%''. This has been implemented in several versions
    of make. We''re not sure who invented it, but it''s been spread around a bit.
    See Section 10.5 [Defining and Redefining Pattern Rules], page 118.


    +   * Ruling and implicit intermediate files. This was implemented by Steve Feldman
    in his version of make for AT&T Eighth Edition Research Unix, and later by Andrew
    Hume of AT&T Bell Labs in his mk program (where he treats it as "terminal closure").
    We do not know if we got this from them or if we thought it ourselves at the same
    time. See Section 10.4 [Chains of Implicit Rules], page 117.'
