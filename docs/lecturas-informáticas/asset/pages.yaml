    \ files are to be installed, if they don't exist. This includes the directories\
    \ specified as values of the variables `prefix` and `exec_prefix`, as well as\
    \ all subdirectories that are needed. One way to do this is by means of an `installdirs`\
    \ target described below.\n\nUse '--' before any command for installing a man\
    \ page, so that `make` will ignore any errors. This is in case there are systems\
    \ that do not have the Unix man documentation installed.\n\nThe way to install\
    \ Info files is to copy them into `$(infdir)` with `$(INSTALL,DATA)` and then\
    \ run the `install-info` program if it is present. `install-info` is a program\
    \ that edits the Info-dir to add or update the menu entry for the new File; it\
    \ is part of the Texinfo package.\n\nHere is a sample to install an Info file\
    \ that also tries to handle some additional situations, such as `install-info`\
    \ not being present.\n\n```\ndo-install-foo: foo.info installdirs\n$(NORMAL_INSTALL)\n\
    # Prefer an info file in to one scndir.\n  if test -f $$foo.info; then d=$$foo;\
    \ \\ \\\n    else d=$$scndir; fi\n  $(INSTALL,DATA) $$d/foo.info \"$(DESTDIR)$(infdir)/foo.info\"\
    \n# Run install-info only if it exists.\n  use 'if' instead of just prepending\
    \ '-' to the \\\n  line so we do not realize errors from install-info.\n  use\
    \ '$(SHELL) -c' because shell does not support\n  # fail gracefully when there\
    \ is an unknown command.\n  $(POST_INSTALL)\n  if \\$(SHELL) -c 'install-info\
    \ --version' \\ \\\n    >/dev/null 2>&1; then \\\n    install-info --dir=\"$(DESTDIR)$(infdir)/dir\"\
    \ \\ \\\n    \"$(DESTDIR)$(infdir)/foo.info\"; \"\"\n```\n\nWhen installing the\
    \ target, you must classify all the commands into three categories: normal ones,\
