    # 8.4 Functions for Conditionals


    There are functions that provide conditional expansion. A key aspect of these
    functions is that not all of the arguments are expanded initially. Only those
    which need to be expanded, will be expanded.


    $($if condition,then-part [,else-part])


    The function provides support for conditional expansion in a functional context
    (as opposed to GNU makefile conditionals such as ifeq (see Section 7.2 [Syntax
    of Conditionals], page 78).


    The first argument, has all preceding and whitespace stripped, is expanded. If
    it expands to any non-empty string, then the condition is considered to be true.
    If it expands to an empty string, the condition is considered to be false.


    If the condition is true the second argument, then-part, is evaluated and this
    is used as the result of the evaluation of the entire function.


    If the condition is false the third argument, else-part, is evaluated and this
    is the result of the function. If there is no third argument, the function evaluates
    to nothing (the empty string).


    Note that only one of the then-part or the else-part will be evaluated, never
    both. Thus either can contain side-effects (such as shell functions, etc.).


    $($or condition1,condition2,condition3...])


    The or provides a "short-circuiting" operation. Each argument is expanded, in
    order. If an argument expands to a non-empty string the processing stops and the
    result of the expansion is that string. If, after all arguments are expanded,
    all of them are false (empty), then the result of the expansion is the empty string.'
