  md: '# ($suffix names...)


    Extracts the suffix of each file name in names. If the file name contains a period,
    the suffix is everything starting with the last period. Otherwise, the suffix
    is the empty string. This frequently means that the result will be empty when
    names is not, and if names contains multiple file names, the result may contain
    fewer names.


    For example,


    ```

    ($suffix src/foo.c src-1.0/bar.c hacks)

    ```


    produces the result ''.c.c''.


    # ($basename names...)


    Extracts all the suffix of each file name in names. If the file name contains
    a period, the basename is everything starting up to (and not including) the last
    period. Periods in the directory part are ignored. If there is no, the basename
    is the entire file name. For example,


    ```

    ($basename src/foo.c src-1.0/bar hacks)

    ```


    produces the result ''$src/foo src-1.0/bar hacks''.


    # ($addsuffix suffix, names...)


    The argument is regarded as a series of names, separated by whitespace; suffix
    is used as a unit. The value of suffix is appended to the end of each individual
    name and the resulting larger names are concatenated with single spaces between
    them. For example,


    ```

    ($addsuffix .c,foo bar)

    ```


    produces the result ''foo.c bar.''.


    # ($addprefix prefix, names...)


    The argument is regarded as a series of names, separated by whitespace; prefix
    is prepended to the front of each individual name and the resulting larger names
    are concatenated with single spaces between them. For example,


    ```

    ($addprefix src/,foo bar)

    ```


    produces the result ''$src/foo src/bar''.


    # ($join list1,list2)


