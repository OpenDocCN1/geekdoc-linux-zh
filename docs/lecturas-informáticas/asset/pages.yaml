    result, and so on. The nth word of the result comes from the nth word of each
    argument. If one argument has more words than the other, the extra words are copied
    unchanged into the result.


    For example, ''$(join a b, c .o)'' produces ''a.c b.o''.


    Whitespace between the words in the list is not preserved; it is replaced with
    a single space.


    This function can merge the results of the dir and notdir functions, to produce
