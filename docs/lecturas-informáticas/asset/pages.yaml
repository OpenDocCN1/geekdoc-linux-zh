  md: '# 15 Makefile Conventions


    This chapter describes conventions for writing Makefiles for GNU programs. Automotake
    will help you write a Makefile that follows these conventions. For more information
    on portable Makefiles, POSIX and Section “Portable Make” in Autoconf.


    # 15.1 General Conventions for Makefiles


    Every Makefile should contain this line:


    ```

    SHELL = /bin/sh

    ```


    to avoid trouble on systems where the SHELL variable might be inherited from the
    environment (This is not a problem with GNU make.). Different make programs have
    incompatible suffix lists and implicit rules, and sometimes creates confusion
    or misbehavior. It is a good idea to set the suffix explicitly using only the
    suffixes you need in the Makefile, like this:


    ```

    .SUFFIXES =

    SUFFIXES := .c .o

    ```


    The first line clears out the suffix list, the second introduces all suffixes
    which may be subject to implicit rules in this Makefile. Don''t assume ''.'' is
    in the path for command execution. When you need to run programs that are part
    of your package during the make, make sure that it uses ''./'' if the program
    is part of the Makefile or ''$(srcdir)/ if the file is unchanging part of the
    source code. Without one of these, the current search path is used.


    The distinction between ''./'' (the build directory) and ''$(srcdir)/ (the source
    directory) is important because users can build in a separate directory using
    the ‘--srcdir’ option to ‘configure’. A rule of the form:


    ```

    foo.1 foo.man descript

    sed -f descript foo.man > foo.1

    ```


    will fail when the build directory is not the source directory, foo.man and ‘descript’
    are in the source directory. When using GNU make, relying on ‘PATH’ to find the
    source file will work in the case where there is a single dependency file, since
    the make automatic ‘$’ will represent the source file wherever it is (In many
    versions of make ‘$’ only in implicit rules.) A Makefile like


    ```

    foo.0 : bar.c

    $(CC) -I$(srcdir) $(CFLAGS) -c bar.c -o foo.o

    ```


    should be written as


    ```

    foo.0 : bar.c

    $(CC) -I$(srcdir) $(CFLAGS) -c $< -o $$

    ```


    in order to allow ‘PATH’ to work correctly. When the target has multiple dependencies,
    using an explicit ‘$(srcdir)’ is the easiest way to make the rule work. For example,
    the target above ‘foo.1’ is written as:


    ```

    foo.1 : foo.man descript

    sed -f $(srcdir)/foo.man > $$

    ```


    GNU distributions usually contain some files which are not source files—example,
    Info files, and the output from Autoconf, Automake, Bison or Flex. Since these
    files normally'
