  md: "# 10 Using Implicit Rules\n\nStandard ways of remaking target files are used\
    \ very often. For example, one customary way to make an object file from a C source\
    \ file using the compiler, cc.\n\nImplicit rules tell how to use customary techniques\
    \ so that you do not have to specify them when you want to use them. For example,\
    \ an implicit rule for C compilation determines which implicit files are run.\
    \ For example, C compilation typically takes a `.c` file and makes a `.o` file.\
    \ So make applies the implicit rule for C compilation when this combination of\
    \ file name endings.\n\nA chain of implicit rules can apply in sequence: for example,\
    \ make will remake a `.o` file from a `.y` file. See Section 10.4 [Chains of Implicit\
    \ Rules], page 117.\nBuilt-in implicit rules use several variables in their recipes\
    \ so that, by changing the variables, you can change the implicit rule works.\
    \ For example, the variable CFLAGS controls the flags given to the C compiler\
    \ by the implicit rule for C compilation. See Section 10.3 [Variables Used Implicit\
    \ Rules], page 115.\n\nYou can define your own implicit rules by writing pattern\
    \ rules. See Section 10.5 [Defining and Redefining Pattern Rules], page 118.\n\
    Suffix rules are many limited to define implicit rules. Pattern rules are general\
    \ and clearer, but suffix rules are retained for compatibility. See Section 10.7\
    \ [Old-Fashioned Suffix Rules], page 125.\n\n# 10.1 Using Implicit Rules\n\nTo\
    \ allow make to find a custom method for updating a target file, all you have\
    \ to do is refrain from specifying recipes yourself. Write a rule with no recipe,\
    \ or write no rule at all. Then make will figure out which rule to use based on\
    \ which kind of source files exists or can be made.\n\nFor example, the今回 looks\
    \ like this:\n\n```\nfoo : foo.o bar\n\tcc -o foo.o bar $(CFLAGS) $(LDFLAGS)\n\
    ```\n\nBecause you name 'foo.o' but do not give a rule for it, make will automatically\
    \ look for an implicit rule that tells how to update it. This happens whether\
    \ or not the file 'foo.o' currently.\n\nIf an implicit rule is found, it can supply\
    \ both a recipe and one more prerequisites (the source files). If you need to\
    \ specify additional prerequisites, such as header files, the implicit rule cannot\
    \ supply.\n\nEach implicit rule has a target and prerequisite pattern. For example,\
    \ numerous rules like '.o files: one, from a .c file with the C compiler; another,\
    \ from a .p file with the Pascal compiler; and so on. The rule that actually applies\
    \ is the one whose prerequisites exist or can made. So, if you have a file 'foo.c',\
    \ make will run the C compiler; otherwise, if you have a file 'foo.p', make will\
    \ run the Pascal compiler; and so on.\n\nOf course, when you write the Makefile,\
    \ you will know which implicit rule you want to use, and you know it will choose\
    \ that one because you know which possible prerequisite"
