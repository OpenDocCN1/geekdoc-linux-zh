  md: 'targets in the makefile may be specified, if make can find implicit rules that
    say how to make them.


    Make will set the special variable MAKECMDGOALS to the list of goals you specified
    on the command line. If no goals were given on the command line, this variable
    is empty. Note that this variable should be used only in special circumstances.


    An example of appropriate use is to avoid including ''.d'' files during clean
    rules so make won''t create them to immediately remove them again:


    ```

    sources = foo.c bar.c


    neq ($(MAKECMDGOALS),clean)

    include $(sources):.d

    endif

    ```


    One use of specifying a goal is if you want to compile only a part of the program,
    or only one of several programs. Specify as a goal each file you want to remake.
    For example, consider a directory containing several programs, with a Makefile
    that starts like this:


    ```

    .PHONY: all

    all: size mm ld ar

    ```


    If you are working on the program size, you might want to say ''make size'' so
    that only the files of that are recompiled.


    Another use of specifying a goal is to make files that are not normal. For example,
    there may be a file of debugging output, or a version of the program that is compiled
    specially for testing, which has a rule in the Makefile but is not a prerequisite
    of the default goal.


    Another use of specifying a goal is to run the recipe with a phony target (see
    Section 4.5 [Phony Targets], page 29) or empty target (see Section 4.7 [Empty
    Target Files to Record Events], page 31). Many Makefiles contain a phony target
    ''clean'' which deletes everything except source files. Naturally, this is only
    done if you it explicitly with ''make clean''. Following is a list of typical
    phony and empty target names. See Section 15.6 [Standard Targets], page 157, for
    a detailed list of all the standard target names which GNU software packages.


    +   * ''all'' - Make the top-level targets the Makefile knows about.


    +   * ''clean'' - Delete all files that are not created by running make.


    +   * ''mostlyclean'' - Like ''clean'', you may refrain from deleting a few files
    that normally don''t want to remake. For example, the ''mostlyclean'' target for
    GCC does not delete ''libgcc.a'', because recompiling it is rarely necessary and
    takes a lot of time.


    +   * ''distclean'' - Any of these targets might be defined to delete more files
    than ''clean'' does. For example, this would delete configuration files or links
    that you would normally create as preparation for compilation, even if the Makefile
    cannot create these.'
