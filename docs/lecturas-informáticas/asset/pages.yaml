  md: 'Chapter 15: Makefile Conventions


    # 15.3 Variables for Specifying Commands


    Makefiles should provide variables for overriding certain commands, options, and
    so on.


    In particular, you should run most utility programs via variables. Thus, if you
    use Bison, with a named variable BISON default value is set with ‘BISON = bison’,
    and refer to it with $(BISON) whenever you need to use Bison.


    File management utilities such as ln, rm, and so on, are not to be referred through
    variables in this way, since users don''t need to replace them with other programs.


    Each program-name variable could also have an option variable that is used to
    supply options to the program. Append `FLAGS` to the program-name variable to
    get the options variable name—example, CFLAGS for the compiler, YFLAGS for yacc,
    and LFLAGS for lex, are exceptions to this rule, but we keep them because they
    are standard.) Use CFLAGS in any compilation command that links the preprocessor,
    and use LFLAGS in any compilation command as well as in any direct use of it.


    If there are C options that *must* be used for proper compilation of certain files,
    expect to be able to specify CFLAGS freely. Instead, pass the necessary options
    to the C compiler independently of CFLAGS, or by defining an inline rule, like:


    ```

    CFLAGS = -g

    ALL_CFLAGS = -I. $(CFLAGS)

    C.O=: -c $(CFLAGS) $(ALL_CFLAGS) \$

    ```


    Do include the ''-g'' option in CFLAGS, because that is not required for proper
    compilation. You can consider a default that is only recommended. If the package
    is set up so that it is compiled with GCC by default, then you might include ''-O''
    in the default value of CFLAGS as well.


    Put CFLAGS last in the compilation command, after other variables containing compiler
    options, the user can use CFLAGS to override the others.


    CFLAGS should be used in every invocation of the C compiler, both those which
    do compilation and those which do linking.


    Every Makefile should define the variables INSTALL, which is the base command
    for installing a file into the system.


    Every Makefile should also define the variables INSTALL_PROGRAM and INSTALL_DATA.
    The default for INSTALL should be $(INSTALL)-m 644). Then it should use those
    variables as the commands for actual installation, for executables and non-executables
    respectively. Minimal use of these variables is as follows:


    ```

    $(INSTALL_PROGRAM) foo $(bindir)/foo

    $(INSTALL_DATA) libfoo $(libdir)/libfoo.

    ```


    However, it is preferable to support a DESTDIR prefix on the target files, as
    explained in the next section.


    It is acceptable, but not required, to install multiple files in one command,
    with the final argument being a directory; as:


    ```

    $(INSTALL_PROGRAM) foo bar baz $(bindir)

    ```'
