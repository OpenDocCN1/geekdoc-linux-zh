  md: '# 4 Writing Rules


    A rule appears in the makefile and says when and how to remake certain files,
    called the rule''s targets (most often one per rule). It lists the other files
    that are the prerequisites of the target, and the recipe to use or update the
    target.


    The order of rules is not significant, except for determining the default goal:
    the target for make to consider, if you do not specify one. The default goal is
    the target of the first rule in the makefile. If the first rule has multiple targets,
    only the first one is taken as the default. There are two exceptions: a target
    starting with a period is not a default unless it contains one or more slashes;
    as well as; a target that has a pattern rule has no effect on the default goal.
    (See Section 10.5 [Defining and Redefining Pattern Rules], page 118).


    Therefore, we usually write the makefile so that the first rule is the one for
    compiling the entire program or the programs described by the makefile (often
    with a target called ''all''). See Section 9.2 [Arguments to Specify the Goals],
    page 99.


    # 4.1 Rule Syntax


    In general, a rule looks like this:


    ```

    targets : prerequisites

    recipe

    ```


    or like this:


    ```

    targets : prerequisites ; recipe

    recipe

    ```


    The targets are file names, separated by spaces. Wildcard characters may be used
    (see Section 4.3 [Using Wildcard Characters in File Names], page 23) and a name
    of the form (''@'') represents member in archive file (see Section 11.1 [Archive
    Members as Targets], page 129). There is usually only one target per rule, but
    occasionally there is a reason to have more (see Section 4.9 [Multiple Targets
    in a Rule], page 34).


    The recipe starts with a tab char (or the first character in the value of the
    RECIPEPREFIX variable; see Section 6.14 [Special Variables], page 73). The first
    recipe line may appear on the line after the पड़ेगा, with a tab char, or may appear
    on the same line. Either way, the effect is the same. There are other differences
    in the syntax of rules. See Chapter 5 [Writing Rules in Makefile], page 41.


    Because dollar signs are used to make variable references, if you really want
    a dollar sign in a target or prerequisite you must write two: ''$$ (see Chapter
    6 [How to Use Variables], page 59). If you have enabled secondary expansion (see
    Section 3.8 [Secondary Expansion], page 18) and you want a literal dollar sign
    in the prerequisites list, you must actually write four dollar signs ($$$$$).


    You may split a long line by inserting a backslash followed by a newline, but
    this is not required, as make places no limit on the length of a line in a makefile.


    A rule tells make two things: when the targets are out of date, and how to update
    them when necessary.'
