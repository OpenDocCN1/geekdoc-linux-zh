    This rule should not modify the directories where compilation is done, only the
    directories where files are installed.


    The uninstallation commands are divided into three categories, just like the installation
    commands. See Section 15.7 [Install Command Categories], page 162.


    +   - install-strip: Like install, strip the executable files while installing.
    In simple cases, this target can use the install target in a simple way:


