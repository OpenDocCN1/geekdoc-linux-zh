    # 4.3 Using Wildcard Characters in File Names


    A single name can fetch many files using wildcard characters. The wildcard characters
    in make are ''*'' and ''?'' same as in the Bourne shell. For example, ''*.c specifies
    a list of all the files (in the working directory) whose names end in ''.c''.


    The character ''^'' at the beginning of a file name has special significance.
    If alone, or followed by a slash, it represents your home directory. For example
    ''^/bin'' expands to ''/home/you/bin''. If ''^'' is followed by a word, the string
    represents the home directory of the user named by that word. On systems which
    do not have a home directory for each user (such as MS-DOS or Windows), this functionality
    can be simulated by setting the environment variable HOME.


    Wildcard expansion is performed by make automatically in targets and prerequisites.
    In recipes, the shell is responsible for wildcard expansion. In other contexts,
    wildcard expansion happens only if you request it explicitly with the wildcard
    character.


    The special significance of a wildcard character can be turned off by preceding
    it with a backslash. Thus, ''foo\*bar'' would refer to a specific file whose name
    consists of ''foo'', an asterisk, and ''bar''.


