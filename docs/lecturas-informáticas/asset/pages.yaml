  md: '# Chapter 15: Makefiles Conventions


    ''srcdir'' The directory for the sources being compiled. The value of this variable
    is normally inserted by the configure shell script. (If you are using Autoconf,
    use ''srcdir = @srcdir@'').


    For example:


    ```

    # Common prefix for installation directories.

    # NOTE: This directory must exist when you start the install.

    prefix = /usr/local

    datasadir = $(prefix)/share

    dadir = $(datadir)

    exec_prefix = $(prefix)

    # Where to put the executable for the command ''gcc''

    bindir = $(prefix)/bin

    # Where to put the directories used by the compiler.

    libexec = $(exec_prefix)/libexec

    # Where to put the info files.

    infdir = $(datadir)/info

    ```


    If your program handles a large number of files one of the standard user-specified
    directories, it might be useful to group them into a subdirectory particular to
    that program. If you do this, use the install rule to create these subdirectories.


    Do not expect the user to include the subdirectory name in the value of any of
    the variables listed above. The idea of having a uniform set of variable names
    for installations is to have the user specify the exact same values for several
    different GNU packages. In order for this to be useful, all the packages must
    be designed so that they work well when the user does.


    At times, not all of these variables may be implemented in the current release
    of Autoconf and/or Automake; using Autoconf 2.60, we believe all of them are.
    When they are missing, the descriptions serve as specifications for what Autoconf
    will implement. As a programmer, you can either use a development version of Autoconf
    or avoid using these variables until a stable release supports them.


    # 15.6 Standard Targets for Users


    All GNU programs should have the following targets in Makefiles:


    +   ''all'' Compile the entire program. This should be the default target. This
    target needs not rebuild any documentation files; info files should normally be
    included in the distribution, and DVI (and other documentation format) files should
    be made only when explicitly asked for.


    +   By default, the Make rules should copy and link with programs having debugging
    symbols. Otherwise, they are essentially helpless in the face of a crash, and
    it is far away to reproduce with a fresh file.


    +   ''install'' Compile the program and copy the executables, libraries, and so
    on to the file names where they should reside for actual. If there is a test to
    verify that a program is properly installed, this target should run that test.

    Do not strip executables when installing them. This helps eventual debugging that
    may be needed later, and nowadays space is cheap and dynamic loaders typically
    ensure debug sections are not loaded during normal execution. Users that need
    stripped binaries may invoke the install-strip target to do that.'
