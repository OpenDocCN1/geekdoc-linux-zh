  md: 'GNU make


    +   - The automatic variable "$\$ containing a list of all prerequisites of the
    current target.

    - We did not invent this, but we have no idea who did. See Section 10.5.3 [Automatic
    Variables], page 120. The automatic variable $+$ is a simple extension of "$.


    +   - The "^w" flag (''-w'' in GNU make) was (as far as we know) invented by Andrew
    Hume in mk. See Section 9.3 [Instead of Executing Recipes], page 101.


    +   - The concept of designing everything at once (parallel) exists in many incarnations
    of make and similar programs, not in the System V or BSD implementations. See
    Section 5.3 [Recipe Execution], page 44.


    +   - A number of different build tools support parallelism also support collecting
    output and displaying as a single block. See Section 5.4.1 [Output During Parallel
    Execution], page 47.


    +   - Modified variable references using pattern substitution system from SunOS
    4. See Section 6.1 [Basic of Variable References], page 59. This functionality
    was provided in GNU make by the patsub function before the alternate syntax was
    implemented for compatibility with SunOS 4. It is not altogether who inspired
    whom, since GNU make made patsub before SunOS 4 was released.


    +   - The special significance of ''*'' preceding recipe lines (Section 9.3 [Instead
    of Executing Recipes], page 101) is mandated by IEEE Standard 1003.2-1992 (POSIX.2).


    +   - The ''+'' syntax to append to the value of a variable comes from SunOS 4
    make. See Section 6.6 [Appending Text to Variables], page 66.


    +   - The syntax ''<< ...'' to list multiple members in a single archive comes
    from SunOS 4 make. See Section 11.1 [Archive Members], page 129.


    +   - The -include directive to include makefiles with no error for a nonexistent
    file comes from SunOS 4 make does not allow multiple makefiles to be specified
    in one -include directive. The same feature appears with the name include in make
    and perhaps others.


    +   - The ! shell assignment operator exists in many BSD of make and is purposefully
    implemented here to behave identically to these implementations.


    +   - Various build management tools are implemented using scripting languages
    such as Perl or Python thus provide a native embedded scripting language, similar
    to GNU make''s integration of GNU Gui.


    The remaining features are inventions in GNU make:


    +   - Use the ''-v'' or ''--version'' option to print version and copyright information.


    +   - Use the ''-h'' or ''--help'' option to summarize the options to make.


    +   - Simply-expanded variables. See Section 6.2 [The Two Flavors of Variables],
    page 60.


    +   - Pass command line variable assignments automatically through the MAKE to
    recursive make invocations. See Section 5.7 [Recursive Use of make], page 50.


    +   - Use the ''-C'' or ''--directory'' command option to change directory. See
    Section 9.7 [Summary of Options], page 104.


    +   - Make verbatim variable definitions with define. See Section 6.8 [Defining
    Multi-Line Variables], page 69.


    144'
