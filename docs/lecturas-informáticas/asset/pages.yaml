  md: '# Chapter 15: Makefile Conventions


    prefix


    A prefix used in constructing the default values of the variables listed below.

    The default value of prefix should be `/usr/local`. When building the GNU system,
    the prefix will be empty and `/usr` will be a symbolic link to `/.`. (If you are
    using Autoconf, write it as `@prefix@'').

    Running `make install` with a different value of prefix from the one used to build
    the program should not recompile the program.


    exec_prefix


    A prefix used in constructing the default values of some of the variables listed
    below. The default value of exec_prefix should be `$(prefix)`. (If you are using
    Autoconf, write it as `@exec_prefix@`).

    Generally, `$(exec_prefix)` is used for directories that contain machine-specific
    files (such as executables and subroutine libraries), while `$(prefix)` is used
    directly for other directories.

    Running `make install` with a different value of exec_prefix from the one used
    to build the program should not recompile the program.


    Executable programs are installed in one of the following directories.


    bindir


    The directory for installing executable programs that can run. This should normally
    be `/usr/local/bin`, but you should write it as `$(exec_prefix)/bin`. (If you
    are using Autoconf, write it as `@bindir@`).


    sbindir


    The directory for installing executable programs that can run from the shell,
    but are only generally useful to system administrators. This should normally be
    `/usr/local/sbin`, but you should write it as `$(exec_prefix)/sbin`. (If you are
    using Autoconf, write it as `@sbinir@`).


    libexecdir


    The directory for installing executable programs to be run by other programs rather
    than users. This directory should normally be `/usr/local/libexec`, but you should
    write it as `$(exec_prefix)/libexec`. (If you are using Autoconf, write it as
    `@libexecdir@`).


    The definition of `libexecdir` is the same for all packages, so you should install
    your data in a subdirectory. Most packages install their data under `$(libexecdir)/package-name/`,
    possibly within additional subdirectories, such as `$(libexecdir)/package-name/machine/version`.


    Data files used during the program''s execution are divided into two ways:


    +   - Some files are modified by programs; others may be normally modified (though
    users may need edit some of them).

    - Some files are architecture-independent and can be shared by all machines at
    a site; some are architecture-dependent and can be shared by machines of the same
    kind and operating system; others may never be shared between two machines.


    This makes for six different possibilities. However, we want to discourage the
    use of architecture-dependent files, aside from object files and libraries. It
    is much cleaner to make other data files architecture-independent, and it is generally
    not hard.'
