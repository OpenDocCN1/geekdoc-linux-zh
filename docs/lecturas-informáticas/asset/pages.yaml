  md: '# 15.4 DESTDIR: Support for Installs


    DESTDIR is a variable prepended to each installed target file, like this:


    ```

    $(INSTALL_PROGRAM) foo $(DESTDIR)$(bindir)/foo

    $(INSTALL_DATA) libfoo.a $(DESTDIR)$(libdir)/libfoo.a.

    ```


    The DESTDIR variable is specified by the user on the make command line as an absolute
    file name. For example:


    ```

    make DESTDIR=/tmp/stage install

    ```


    DESTDIR should be supported only in the install* and uninstall* targets, as those
    are the only targets where it is useful.


    If your installation starts normally ''/usr/local/bin/foo'' and ''/usr/local/lib/libfoo.a'',
    then an installation invoked as in the example would be installed ''/usr/local/bin/foo''
    and ''/tmp/stage/usr/local/lib/libfoo.a'' instead.


    Providing the DESTDIR variable to each target provides this way for staged installs,
    where the installed files are not placed directly in their location but are instead
    copied into a temporary directory (DESTDIR). However, installed files maintain
    their relative directory structure and embedded file names will not be modified.


    You should not set the value of DESTDIR in your ''Makefile'' at all; then the
    files are installed into their expected locations by default. ... should change
    the operation of the software in any way, so its value should not be included
    in any file contents.


    DESTDIR is commonly used in package creation. It is also helpful to users to understand
    what a given package will install, and to allow users who normally have permissions
    to install into protected areas to build before installing Finally it can be useful
    with tools such as stow, where code is installed in one place but made to appear
    elsewhere using symbolic links or special mounts. We strongly recommend GNU packages
    support DESTDIR, though it is not an absolute requirement.


    # 15.5 Variables for Installation Directories


    Installation directories should always be named by variables, so it is easy to
    install in a nonstandard place. The standard names for these variables and the
    values they should have in GNU packages are described below. They are based on
    a file system layout; they are used in GNU/Linux and other modern operating systems.


    Installers are expected to override these values when making (e.g., configure
    --prefix=/usr). GNU packages should not try to guess which value should be appropriate
    for these variables on the system they are being installed onto use the default
    settings specified here so that all GNU packages behave identically, allowing
    the installer to achieve any desired layout.


    All installation directories, and their parent directories, should be created
    (if necessary) before they are installed into.


    These first two variables set the root for the installation. All the other installation
    directories should be subdirectories of one of these two, and nothing should be
    directly installed into these two directories.'
