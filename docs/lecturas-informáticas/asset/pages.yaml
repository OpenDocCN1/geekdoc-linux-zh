  md: "Chapter 2: How to Run make\n\n# # 9 How to Run make\n\n Makefile that says\
    \ how to recompile a program can be used in more than one way. The simplest use\
    \ is to recompile every file that is out of date. Usually, makefiles are written\
    \ so that you run make with no arguments, it just does that.\n\n But you might\
    \ want to update only some of the files; you might want to use a different compiler\
    \ or different compiler options; you might want to just find out files are out\
    \ of date without changing them.\n\n By giving arguments when you run make, you\
    \ can do any of these things and many others.\n\n The status of make is always\
    \ one of three values:\n\n+   0 The status is zero if make is successful.\n\n\
    +   2 The status is two if make encounters any errors. It will print messages\
    \ describing the particular errors.\n\n+   1 The status is one if you use the\
    \ '-q' flag and make determines that some target is not already up to date. See\
    \ Section 9.3 [Instead of Executing Recipes], page 101.\n\n# ## 9.1 Arguments\
    \ to Specify the Makefile\n\n The way to specify the name of make is with the\
    \ '-f' or '--file' option ('--makefile also works). For example, '-f altmake'\
    \ uses the file 'altmake' as the make.\n\n If you use the '-f' flag several times\
    \ and '-f' with an argument, all the specified files are used jointly as makefiles.\n\
    \n If you do not the '-f' or '--file' flag, the default is to try 'GNU Makefile',\
    \ 'makefile', and 'Makefile', in order, and use the first of these three exists\
    \ or can be made (see Chapter 3 [Writing Makefiles], page 11).\n\n# ## 9.2 Arguments\
    \ to Specify the Goals\n\n The goals are the targets that make strive ultimately\
    \ to update. Other targets are updated if they appear as prerequisites of goals,\
    \ or prerequisites of prerequisites of goals, etc.\n\n By default, the goal is\
    \ the first target in themakefile (not counting targets that start with a period).\
    \ Therefore, makefiles are usually written so that the first rule is for compiling\
    \ the entire program or programs they develop. If the first rule in the makefile\
    \ has several targets, only the first target in the rule becomes the default goal,\
    \ not the whole list. You can manage the selection of the default goal from your\
    \ makefile using the .DEFAULT_GOAL variable (see Section 6.14 [Other Special Variables],\
    \ page 73).\n\n You can also specify a goal or goals with command line arguments\
    \ to make. Use the name of the goal as an argument. If you specify several goals,\
    \ make processes each of them, in the order you name them.\n\n Any target in the\
    \ Makefile can be specified as a goal (unless it starts with '-' or contains an\
    \ '=', in which case it will be parsed as a switch or variable definition, respectively).\
