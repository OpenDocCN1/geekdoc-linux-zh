    # 8.5 The foreach Function


    The foreach function is very different from other functions. It causes one of
    text to be repeated, each time with a different substitution performed on it.
    It resembles the for command in the sh and the foreach command in the C-shell
    csh.


    The syntax of the foreach function is:


    ```

    $(foreach var,list)

    ```


    The first two arguments, var and list, are expanded before anything else is done;
    note that the last argument, text, is not expanded at the same time. Then for
    each word of the expanded list, the variable named by the expanded value of var
    is set to that word, and text is expanded. Presumably text contains references
    to that variable, so its expansion will be different each time.


    The result is that text is expanded as many times as there are whitespace-separated
    words in list. The multiple expansions of text are concatenated, with spaces between
    them, to make the result of foreach.


    This simple example sets the variable ''files'' to the list of all files in the
    directories in the list ''dirs'':


    ```

    dirs := a b c d

    files := $(foreach dir,$(dirs),$(wildcard $(dir))*)

    ```


    Here is ''$(wildcard $(dir)*)''. The first repetition finds the value ''a'' for
    dir, so the second produces the result of ''$(wildcard a/**)''; and the third,
    of ''$(wildcard c*)''.


    This example has the same result (except for setting ''dirs'') as the following
    example:


    ```

    files := $(wildcard a/ b* c/ d*)

    ```


    When complicated, you can improve readability by giving it a name, with an additional
    variable:


    ```

    find_files := $(wildcard $(dir)*)

    dirs := $(foreach dir,$(dirs),$(find_files))

    ```


    We use the variable ''var'' to define recursively-expanding variable, so that
    its value contains an actual function call to be re-expanded under the control
    of foreach: a simply-expanded variable would not do, so would be called only once
    at the time of defining find_files.


