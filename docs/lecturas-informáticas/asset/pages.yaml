  md: '# Chapter 6: How to Use Variables


    Simply expanded variables are defined by lines using '':='' or '':='' (see Section
    6.5 [Setting Variables], page 65). Both formats are equivalent in GNU make; however
    only the '':='' form is described by the POSIX standard ('':='' was added to the
    POSIX standard in 2012, older versions of make won''t accept this either)


    The value of a simply expanded variable is once and for all, expanding any references
    to other variables and functions, when the variable is defined. The actual value
    of the simply expanded variable is the result of expanding the text that you wrote.
    It does not contain any references to other variables; it contains their values
    as of the time this variable was defined. Therefore,


    ```

    x := foo

    y := $(x) bar

    x := later

    ```


    is equivalent


    ```

    y := foo

    x := later

    ```


    When a simply expanded variable is referenced, its value is substituted. Here
    is a somewhat more complicated example, illustrating the use of '':='' in conjunction
    with the shell function. (See Section 8.13 [The shell Function], page 97). This
    also shows us the variable MAKELEVEL, which is changed when it is passed down
    from level to level. (See Section 5.7.2 [Communicating Variables to a Sub-make],
    page 52, for information about MAKELEVEL).


    ```

    ifeq $(0,$MAKELEVEL)

    whoami := $(shell whoami)

    host-type := $(shell host)

    MAKE := $(MAKE)host-type=$(host-type) whoami=$(whoami)


    ```


    An advantage of this use of '':='' is that a typical ''descend into a directory''
    recipe then like this:


    ```

    $(subdirs)

    $(MAKE) -C $$ all

    ```


    Simply expanded variables generally makemakefile programming much preferable because
    they allow you to define a variable using its own value (or its value processed
    in some way by one of the expansion functions) and to use the expansion functions
    much more efficiently (see Chapter 8 [Functions for Transforming Text], page 83).


    You can also to introduce leading whitespace into variable values. Leading whitespace
    characters are discarded from your input before substitution of variable references
    and function calls; this means you can include spaces in a variable value by protecting
    them with variable references, like this:


    ```

