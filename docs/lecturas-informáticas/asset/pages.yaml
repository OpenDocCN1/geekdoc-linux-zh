  md: 'Chapter 12: Extending GNU make


    # 12 Extending GNU make


    make provides many advanced capabilities, including many useful functions. However,
    it does not contain a complete programming language and so it has limitations.
    Sometimes these limitations can be overcome through use of the shell function
    to invoke a separate program, which also can be inefficient.


    In cases where the built-in capabilities of make are insufficient to your requirements
    there are two options for extending make. On systems it''s provided, you can utilize
    GNU Guile as an embedded scripting language (see Section 12.1 [Guile Integration],
    page 133). On systems which dynamically load objects, you can write your own extension
    in any language (which can be compiled into such object) and load it to provide
    extended capabilities (see Section 12.2.1 [The load Directive], page 136).


    # 12.1 Guile Integration


    make may be built with support for GNU Gu as an embedded extension language. Guile
    implements the Scheme language. A review of GNU Guile and the Scheme language
    and its features is beyond the scope of this manual: see the documentation for
    GNU Guide and Scheme.


    You can determine if make contains support for Guile by examining the .FEATURES
    variable; it will contain the word guile if Guile support is available.


    The Guile integration provides one new function: guile. The Guile function takes
    one argument which is first expanded by make in the normal fashion, then passed
    to the GNU evaluator. The result of the evaluator is converted into a string and
    used as the expansion of the guile function in make.


    In addition, make exposes Guile procedures for use in Guile scripts.


    # 12.1.1 Conversion of Guile Types


    There is only one "data type" in make: a string. GNU Guile, on the other hand,
    provides a variety of data types. An important aspect of the interface between
    make and GNU Guile is the conversion of Guile types into make strings.


    This conversion is relevant in two places: when a Makefile invokes the guile function
    to evaluate a Guile expression, the result of that evaluation must be converted
    into a make string so it can be further evaluated by make. And secondly, when
    a Guile script invokes the argument provided to the make must be converted into
    a string.


    The conversion of Guile types into make strings is as follows:


    +   #f

    False is converted into the empty string: in make conditionals the empty string
    is considered false.


    +   #t

    True is converted to the string ''#t'': in make conditionals any non-empty string
    is considered true.


    +   symbol

    A symbol or number is converted into the string representation of that symbol
    or number.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'A printable character is converted to the same character.


    A string containing only printable characters is converted to the same character.


    A list is converted recursively to the above rules. This implies that any structured
    list will be flattened (that `(a b c d e)` is, a result of `''''` converted to
    the string `''a b c d e`'').


    Any other Guile type results in an error. In future versions of `make`, other
    Guile types may be converted.


    The translation of `''#f` (the empty string) and `''#t` (the non-empty string
    ''#t'') is designed to allow you to use Guile boolean results as make conditions.
    For example:


    ```

    $($guile access "myfile" R_OK),$($info myfile exists))

    ```


    As a consequence of these conversion rules you must consider the result of your
    Guile script, as will be converted into a string and parsed by make. If there
    is no natural result for the script (that is, the script exists solely for side-effects),
    you should add `''#f` as the expression in order to avoid syntax errors in your
    makefile.


    # 12.1.2 Interfaces from Guile to make


    In addition to the `guile` function used in makefiles, `make` exposes some procedures
    for use in Guile scripts. At startup `make` creates a new Guile module, `gnu make`,
    and exports these procedures as public interfaces from that module:


    gmk-expand This procedure takes a single argument which is converted into a string.
    The string is expanded by `make` using normal `make` expansion rules. The result
    of the expansion is converted into a Guile string and provided as the result of
    the procedure.


    gmk-eval This procedure takes a single argument which is converted into a string.
    The string is evaluated by `make` as if it were amakefile. This is the same capability
    available via the eval function (see Section 8.9, page 93). The result of the
    `gmk-eval` procedure is the empty string.


    Note that `gmk-eval` is not the same as using `gmk-expand` with the eval function:
    in the latter case the evaluated string will be expanded twice; first by `gmk-expand`,
    then again by the eval function.


    # 12.1.3 Example Using Guile in make


    Here is a very simple example using GNU Guile to manage writing to a file. These
    Guile procedures simply open a file, allow writing to the file (one string per
    line), and close the file. Note that we cannot store complex values such as Guile
    ports in `make` variables, we''ll keep the port as a global variable in the Guile
    interpreter.


    You can create Guile functions easily using `define/undef` to create a Guile script,
    then use the `guile` function to internalize it:'
