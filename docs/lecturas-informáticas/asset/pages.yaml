    Here is a realistic example of the use of subst and patsub. Suppose that use the
    VPATH variable to specify a list of directories that should search for prerequisite
    files (see Section 4.4.1 [VPATH Search for All Prerequisites], page 25). This
    example shows how to tell the C compiler to search for headers in the same list
    of directories.


    The VPATH is a list of directories separated by colons, such as ''src:...headers''.
    First, the subst function is used to change the colons to:


    ```

    $$(subst .,$(VPATH))

    ```


    This produces ''src/headers''. Patsub is used to turn each directory name into
    an ''-I'' flag. This can then be added to the value of the variable FLAGS, which
    is passed automatically to the C compiler, like:


    ```

    override FLAGS += $(patsub ,%,$(subst ,$(VPATH)))

    ```


    The effect is to append the text ''-Isrc/headers'' to the previous value of FLAGS.
    The override is used so that the new value is assigned even if the previous value
    of FLAGS was specified with a command argument (see Section 6.7 [The override
    Directive], page 68).


    # 8.3 Functions for File Names


    Several of the built-expansion functions relate specifically to taking apart file
    names or lists of file names.


    Each of the following functions performs a specific transformation on a file name.
    The argument of the function is regarded as a series of file names, separated
    by whitespace. (Leading and trailing whitespace is ignored.) Each file name in
    the series is transformed in the same way and are concatenated with spaces between
    them.


    ```

    $(dir names ...)

    ```


    Extracts the directory-part of each file name in names. The directory-part of
    the file name is everything up (and including) the last slash in. If the file
    contains no slash, the directory-part is the string ''.''. For example,


    ```

    $(dir src/foo.c hacks)

    ```


    produces the result ''src/''.


    ```

    $(notdir names ...)

    ```


    Extracts all the directory-part of each file name in names. If the name contains
    no slash, it is left unchanged. Otherwise, everything through the last slash is
    removed from it.


    A file name that ends with a slash becomes an empty string. This is unfortunate
    because it means the file result does not always have the same number of whitespace-separated
    file names as the original; but we do not see any other alternative.


    For example,


    ```

    $(notdir src/foo.c hacks)

    ```


    produces the result ''foo.c hacks''.'
