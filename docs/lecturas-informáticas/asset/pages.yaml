  md: "22\n\nGNU make\n\nThe criterion for being out of date is specified in terms\
    \ of the prerequisites, which consist of file names separated by spaces. Wildcards\
    \ and archive members (see Chapter 11 [Archives], page 129) are allowed here too.)\
    \ A target is out of date if it does not exist or if it is older than any of the\
    \ prerequisites (by comparison of last-modification times). The idea is that the\
    \ contents of the target file are computed based on information in the prerequisites,\
    \ so if any of the prerequisites changes, the contents of the existing target\
    \ file are no longer valid.\n\nHow to update is by a recipe. This is one or more\
    \ lines to be executed by the shell (normal ‘sh’), but with some extra features\
    \ (see Chapter 5 [Writing Recipes in Rules], page 41).\n\n# 4.2 Types of Prerequisites\n\
    \nThere are actually two different types of prerequisites understood by GNU make:\
    \ normal prerequisites as described in the previous section, and order-only prerequisites.\
    \ A normal prerequisite makes two statements: first, it imposes an order in which\
    \ recipes will be invoked: the recipes for all prerequisites of a target will\
    \ be completed before the target runs.\n\nNormally, this is exactly what you want:\
    \ if a target’s prerequisite is updated, then the target should be updated.\n\n\
    Occasionally, you have a situation where you want to impose a specific ordering\
    \ on the rules to be invoked without forcing the target to be updated if one of\
    \ rules is executed. In that case, you can specify by a pipe symbol (~) in the\
    \ prerequisites list: order-only prerequisites can be specified to the left of\
    \ the pipe symbol normal; any prerequisites to the right are order-only:\n\n```\n\
    targets : normal-prerequisites | order-only-prerequisites\n```\n\nThe normal prerequisites\
    \ section may be empty. Also, you may still declare multiple prerequisites for\
    \ the same target: they are appended appropriately (normal prerequisites are appended\
    \ to the list of normal prerequisites; order-only prerequisites Note that if you\
    \ declare the same file to be both a normal and an order-only prerequisite, the\
    \ normal prerequisite takes precedence (they have a superset of the order-only\
    \ prerequisites).\n\nConsider an example where your targets are to be placed in\
    \ a separate directory, and that directory might not exist before make is run.\
    \ In this situation, you want the directory to be created before any targets are\
    \ placed into it, but the timestamps on directories change whenever a file is\
    \ added, removed, or remains, we don’t want to rebuild all the targets the directory’s\
    \ timestamp changes. One way to manage this is with order-prerequisites: make\
    \ the directory an order-only prerequisite on all the targets:\n\n```\nOBJDIR\
