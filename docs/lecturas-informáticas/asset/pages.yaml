    # 8.6 The File Function


    The file function allows to write to a file. Two modes of writing are supported:
    overwrite, the text is written to the beginning of the file and any existing content
    is lost, and append, where the text is written to the end of the file, preserving
    the existing content. In all cases the file is created if it does not exist.


    The syntax of the file function is:


    ```

    $($file filename, or >>)

    ```


    The operator op can be either | which indicates overwrite mode, or >> which indicates
    append. The filename indicates the file to be written to. There may optionally
    be whitespace between the operator and the file name.


    When the file expands all arguments first, then the file indicated by filename
    will be opened in the mode described by op. Finally text will be written to the
    file. If text does not already end in a newline, a final newline will be written.
    The result of evaluating the file function is always the empty string.


    It is a fatal error if the file cannot be opened for writing, or if the write
    operation fails. For example, the file function can be useful if your build system
    has a limited command line size and your recipe runs a command that can accept
    arguments from a file as well. Many commands use the convention that an argument
    prefixed with @ specifies a file containing more arguments. You might write your
    recipe in this way:


    ```

    program: $(OBJECTS)

    $(file > $@.in)

    $(CMD) $(CMDFLAGS) $@.in

    rm $@.in

    ```


    If the command requires each argument to be on a separate line of the input file,
    you might write your recipe like:


    ```

    program: $(OBJECTS)

    $(file > $@.in,$(foreach $(file >> $@.in,$0))

    $(CMD) $(CMDFLAGS) $@.in

    rm $@.in

    ```


    # 8.7 The Call Function


    The call function is unique in that it can be used to create new parameterized
    functions. You can write a complex expression as the value of a variable, then
    use call to expand it with different values.'
