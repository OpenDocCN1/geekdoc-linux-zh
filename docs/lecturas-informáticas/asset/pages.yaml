  md: '# 11 Using make to Update Archive Files


    Archive files are files containing sub-files called members; they are maintained
    by the program ar and their main use is subroutine libraries for linking.


    # 11.1 Archive Members as Targets


    An individual member of an archive file can be used as a target or prerequisite
    in make. You specify the member named member in file archive as follows:


    ```

    archive(member)

    ```


    This construct is available only in targets and prerequisites, not in recipes!
    Most programs that you use in recipes do not support this syntax and cannot act
    directly on archive members. Only ar and other programs specifically designed
    to operate on archives can do so. Therefore, valid rules to update an archive
    target must use ar. For example, this rules to create a member ''hack.o'' in archive
    ''foolib'' by copying the file ''hack.o''


    ```

    foolib(hack.o)

    ar foolib hack.o

    ```


    In fact, nearly all archive members are updated in this way and there is an implicit
    rule to do it for you. **Note:** The ''c'' flag is required if the archive file
    does not already exist.


    To specify several members in the same archive, you can write all the member names
    together between the parentheses. For example:


    ```

    foolib(hack.o kludge.o)

    is equivalent to:

    ```


    ```

    foolib(hack.o) foolib(kludge.o)

    ```


    You also use shell-style wildcards in an archive member reference. See [Wildcard
    Characters in File Names](page_23). For example, ''foolib(*.o)'' expands to all
    members needed of the ''foolib'' archive whose end in ''.o''; perhaps ''foolib(hack.o)
    foolib(kludge.o)


    # 11.2 Implicit Rule for Archive Member Targets


    Recall that a target looks like ''a(m)'' stands for the member named m in the
    archive file a.


    When make looks for an implicit rule for such a target, special feature includes
    implicit rules that match ''(m)'', as well as those that match the actual target
    ''a(m)''. This one special rule whose target is ''(m)'' to match. By copying the
    file m into the archive. For example, it will update the archive target ''foo.a(bar.o)''
    by copying the file ''bar.o'' into the archive ''foo.a'' as a member named ''bar.o''.


    When this rule is chained with others, the result is very powerful. Thus, ''make
    foo.a(bar.o)'' (the quotes are needed to protect the ''('' and '')'' from being
    interpreted specially by the shell) in the presence of a file ''bar.c'' is enough
    to cause the following recipe to run, even without a makefile:'
