    # 9.4 Avoiding Recompilation of Some Files


    Sometimes you have changed a file but do not want to recompile all the files that
    depend on it. For example, suppose you add a macro or a declaration to a header
    file that other files depend on. Being conservative, make assumes that any change
    in the header file requires recompilation of all dependent files, but you know
    that they do not need to be recompiled and you rather not waste the time waiting
    for them to compile.


    If you anticipate the problem before changing the header file, you can use the
    ''-t'' flag. This flag tells make not to run the recipes in the rules, but rather
    to mark the target up to date by its last-modification date. You would follow
    this procedure:


    +   1. Use the command *make* to recompile the source files that really need recompilation,
    ensuring that the object files are up-to-date before you begin.

    2. Make the changes in the header files.'
