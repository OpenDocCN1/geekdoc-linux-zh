  md: '# 8.13 The shell Function


    The *shell* function is unlike any other function than the wildcard function (see
    Section 4.3.3 [The Function wildcard], page 24) in that it communicates with the
    world

    out of make.


    The *shell* function performs the same function as backquotes (''``'') perform
    in most

    shell: it does *command expansion*. This means that it takes as an argument a
    shell

    command and evaluates to the output of the command. The only processing *make*
    does

    to is to convert each newline (or carriage-return / newline pair) and newline
    it will simply be removed.


    The commands run by calls to the shell function run when the function calls are

    expanded (see Section 3.7 [How Makes a Makefile], page 16). This however involves

    spawning a new shell, you should carefully consider the performance implications

    of using the *shell* function recursively expanded expanded variables vs. simply
    expanded

    variables (see Section 6.2 [The Two Flavors of Variables], page 60).


    Here are some examples of the use of the *shell* function:


    ```

    contents := $(shell cat foo)

    ```


    *sets* contents to the contents of the file ''foo'', with a space (rather than
    a newline) separating each line.


    ```

    files := $(shell echo \*.c)

    ```


    *sets* files to the expansion of ''*.c''. Unless *make* is using a very strange
    shell, this has the

    same result as ''$(wildcard \*.c)'' (as long as at least one ''.c'' file exists).


    # 8.14 The Guile Function


    If *make* is built with GNU Guile as an embedded extension language then

    the guile* function will be available. The *guile* function takes one argument
