  md: "# 3 Writing Makefiles\n\nThe information that tells `make` how to recompile\
    \ a system comes from reading a data base called the `makefile`.\n\n# 3.1 What\
    \ Makefiles Contain\n\nMakefiles contain five kinds of things: *explicit rules*,\
    \ *implicit rules*, *variable definitions*, *directives*, and *comments*. Rules,\
    \ variables, and directives are described at length in later chapters.\n\n+  \
    \ - An *explicit rule* says when and how to make one or more files, called the\
    \ rule's *targets*. It lists the other files that the target depends on, called\
    \ the *prerequisites* of the target, and may also give a recipe to use to create\
    \ or update the targets. Chapter 4 [Writing Rules], page 21.\n- An *implicit rule*\
    \ says when and how to make a class of files by their names. It describes how\
    \ a target may depend on a name similar to the target and gives a recipe to create\
    \ or update such a target. Chapter 10 [Implicit Rules], page 111.\n- A *variable\
    \ definition* is a line that defines a text value for a variable that can be substituted\
    \ in the later text. The simple makefile example shows a variable definition for\
    \ objects as a list of all object files (see Section 2.4 [Variables Make Simpler],\
    \ page 6).\n- A *directive* is an instruction for `make` to do something while\
    \ reading the makefile. These include:\n    - Reading another makefile (see Section\
    \ 3.3 [Including Other Makefiles], page 13).\n    - Deciding (based on the values\
    \ of variables) whether to use or ignore part of the makefile (see Chapter 7 [Conditional\
    \ Parts of Makefiles], page 77).\n    - Defining a variable from a verbatim string\
    \ containing multiple lines (see Section 6.8 [Multi-Line Variables], page 69).\n\
    \n#` in a line of a file starts a comment. It and the rest of the line are ignored,\
    \ except if you want a literal `#`, escape it with a backslash (e.g., \\#). Comments\
    \ may appear on any line of the makefile, although they are treated specially\
    \ in certain situations.\n\nYou cannot use comments within reference or function\
    \ calls: any instance of `#` will be treated literally (rather than as the start\
    \ of a comment) inside a variable reference or call.\n\nComments in a recipe are\
    \ passed to the shell, just as any other recipe text. The shell decides how to\
    \ interpret it: whether or not this is a comment is up to the shell.\n\nWithin\
    \ a `define` directive, comments are not ignored during the definition of the\
    \ variable, but rather kept intact in the value of the variable. When the variable\
    \ is expanded they will either be treated as `make` comments or as recipe text,\
    \ depending on the context in which the variable is evaluated."
