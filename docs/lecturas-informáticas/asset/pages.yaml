  md: '# ''mostlyclean’


    Like ''clean'', but may refrain from deleting a few files that people normally

    don''t want to recompile. For example, the ''mostlyclean'' target for GCC does

    dot delete ''libgcc.a'', because recompiling it is rarely necessary and takes
    a lot

    of time.


    # ''maintainer-clean’


    Delete almost everything that can be reconstructed with this Makefile.

    typically includes everything deleted by distclean, plus more: C source files

    produced by Bison, tags tables, Info files, and so on.


    The reason we say "almost everything" is that running the command "make

    maintainer-clean" should not delete ''configure'' even if ''configure'' can be

    remade using a rule in the Makefile. More generally, ''make maintainer-clean''

    should not delete anything that exists in order to run ''configure'' and

    then begin to build the program. Also, there is no need to delete parent directories
    that were created with ''mkdir -p'', since they could have existed.

    These are the only exceptions; maintainer-clean should delete everything else

    that can be rebuilt.


    The ''maintainer-clean'' target is intended to be used by a maintainer of the

    package, not by ordinary users. You may need special tools to reconstruct

    s of the files that ''make maintainer-clean'' deletes. Since these files are

    ormally included in the distribution, we don''t take care to make them easy to

    reconstruct. If you find need to unpack the full distribution again, don''t blame
    us.


    To help make users aware of this, the commands for the special maintainer-clean
