  md: '> The Raspberry Pi has been designed to be used with whatever accessories you
    have lying around, to minimize the cost of getting started, but in practice not
    all devices are compatible. In particular, incompatible USB hubs, keyboards, and
    mice can cause problems that are hard to diagnose. USB hubs that feed power back
    into your Raspberry Pi through the Pi’s USB port (known as backpowering) could
