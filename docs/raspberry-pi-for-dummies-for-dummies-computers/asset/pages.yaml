    # # Inserting the SD Card


    To start up, the Raspberry Pi requires an SD or microSD card with the operating
    system on it. If you don''t have one, see Chapter 2 for advice on downloading
    the operating system and copying it to an SD or MicroSD card.


    To insert a MicroSD card in a Model 2, 3, A+, or B+, turn your Raspberry Pi over,
    as shown in Figure 3-4, so that you''re looking at its underside. The metal MicroSD
    card socket is labeled and is on the left edge of the board. Slide the MicroSD
    card into the slot face. On the Raspberry Pi 3 Model B, the card will slide into
    place. On the other models, it will click into place. The card will overhang the
    board slightly.


    To insert an SD card in a Model A or Model B, flip your Raspberry Pi over. (See
    Figure 3-5.) On one of the short sides is a plastic fixture for your SD card.
    Slide the card with the left side facing, and gently press the card to make sure
    it''s well connected. The fixture is not big enough to cover your SD card, so
    most of the card will stick out from the side of the board and will be visible
    when you turn your Pi back over again. You can remove the card by just pulling
    it out again.'
