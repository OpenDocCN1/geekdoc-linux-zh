- pgno: 276
  md: '# # Using the Minecraft Module


    For your first Python program for Minecraft, we will show you how to send a message
    to the Chat feature in the game.


    We''ll use the editor in Thny (the top part of the window). Enter the File menu
    to save it in your pi folder, and press F5 or Click the button to run it (note
    that you must have a Minecraft game session running for this work):


    ```

    import sys, random

    from mcpi import minecraft

    mc = minecraft.Minecraft.create()

    mc.postToChat("Welcome to Minecraft Maze!")

    ```


    Your first line of code imports the sys and random modules. The random module,
    you''ll need later to build a random maze as you develop this program.


    To issue Python commands to Minecraft, use the minecraft.Minecraft.create() function
    and then add the command at the end. For example, to put a greeting in the Chat
    window, you might use the following:


    ```

    minecraft.Minecraft.create().postToChat("Welcome to Minecraft Maze!")

    ```


    That soon gets hard to read, so in the program you''re working with, use so mc
    that you can use it as an abbreviation for minecraft.Minecraft.create().As a result,
    use the shorter line that you see in the program to post a message.


    If your code isn''t working, pay particular attention to the case. Python is case-sensitive,
    so you have to use upper- and lowercase as shown here. Look out for the mixed
    output— and lowercase in postToChat, and the capital M in minecraft.Minecraft.create().


    ![](img/df9a01bf057d58c2401b5edabd6e8829_276_0.png)


    When you run the program, switch back to Minecraft to see your message on screen.
    It disappears after about 10 seconds.


    # ## Understanding coordinates in Minecraft


    As you might expect, everything in the Minecraft world has a map coordinate. Three
    axes are required in order to describe a position in the game world:


    +   - x: This axis runs parallel to the ground. The world measures 255 blocks
    in this direction.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '**y**: Axis runs vertically and could be described as the height. You can fly
    at least as 500 blocks, but you can''t see the ground from higher than 70 blocks,
    so there''s not much point. Sea level is 0. You can break blocks to tunnel under
    the sea. We made it down to about ~70 before we fell out of the world and died.
    This is the only way we''ve seen that you can die in Minecraft on the Pi.


    **x**: This is the other axis parallel to the ground. The world measures 255 blocks
    in this direction.


    We put the axes in order deliberately because that''s the order that Minecraft
    uses. If, like us, you use x and y to refer to positions in 2D (as you do in Scratch),
    take a short while to get your head around that y represents height. Most of the
    time in this chapter, you''ll use the x and z coordinates to describe a wall''s
    position (which differs on the wall), and the y coordinates to describe its height
    (which doesn''t).


    As you move in the game, you can see the player''s coordinates in the top left
    of the Minecraft window change. If you try to move outside the world, you hit
    a wall of sky that you can''t penetrate, in *The Truman Show* (except that he
    had a door).


    # Repositioning the player


    You can move your character to any position in the Minecraft world, using this
    command:


    ```

    mc.player.setTilePos(x, y, z)

    ```


    For example, to parachute in the world, use


    ```

    mc.player.setTilePos(0, 100, 0)

    ```


    ![](img/df9a01bf057d58c2401b5edabd6e8829_277_0.png)


    You don''t have to put this command into a program and run it. If you''ve already
    run the program to set up the Minecraft module, you can type commands to move
    the player and add blocks in the Python shell.


    Assuming that the game is not in Flying mode, you''ll drop from the sky into the
    world. If it is in Flying mode, click Minecraft on the taskbar and double-tap
    the space to turn off and start your descent.


    Note that this coordinate won''t always be in the middle of the world, though
    worlds are the same size. In one of ours, the coordinates run from -85.7 to 169.7
    in the x plane and from -98.7 to 156.7 in the z plane.'
