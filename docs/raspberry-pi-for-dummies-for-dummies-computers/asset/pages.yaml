  md: '# Understanding the Prompt


    When you log in to Raspberry Pi, you see a prompt that looks like this, with a
    cursor beside it that''s ready for you to enter a command:


    ```

    pi@raspberrypi ~ $

    ```


    At first glance, the prompt can look foreign and unnecessarily complicated (why
    doesn''t it just say OK or Ready?), but it actually contains a lot of information.
    This is what the different bits mean:


    +   pi: This is the name of the user who is logged in. Later in this chapter,
    we show how to add different users to your Raspberry Pi, and if you log in as
    a different user, you see that user''s name here indent.


    +   raspberrypi: This is the hostname of the machine, which is the name other
    computers use to identify the machine when connecting to it.


    +   ~: In Linux, people talk about organizing files in directories rather than
    folders, but it means the same thing. Part of the prompt tells you where you are
    looking (at the working directory). The tilde symbol (a horizontal wiggly line)
    is short for what is known as your home directory, and its presence in the prompt
    shows you''re currently working in that directory. We explain in Chapter 4, this
    is where you should store your work and other files. An ordinary user doesn''t
    have permission to put files anywhere except for his home directory or any directories
    inside that home directory.


    +   $: The dollar sign means that you''re a humble, ordinary user and not an all-powerful
    superuser. If you were a superuser, you would see a # symbol instead.


    # Exploring Your Linux System


    It''s perfectly safe to take a look at any of the files and directories on your
    Raspberry Pi. As an ordinary user, you''re blocked from deleting or damaging any
    essential files in any case, you can explore without fear of deleting anything
    important.


    # Listing files and directories


    The command for listing files and directories is ls. If you enter it now, you
    see the folders and files (if any) in your home directory. Here''s what the output
    looks like Sean''s Raspberry Pi — in'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'this chapter, use bold text for the bits you type and use normal text for the
    computer''s output:


    ```

    pi@raspberry ~ ls

    Desktop Downloads Pictures python-games Videos

    Documents Music Public Templates

    ```


    Linux is case-sensitive, which means LS, ls, and l are completely different instructions.
    Linux doesn''t see uppercase and lowercase letters as related to each other, so
    an a 5 and an l look like completely different symbols to the computer, in the
    same way that an A and a look different to humans. If you get the capitalization
    wrong in your command, it won''t work, and applies everything in the shell. If
    you place a capital letter in a filename, Linux thinks the file you doesn''t exist.
    When you come to use more-advanced command options, you might find that some commands
    use upper- and lowercase options mean different things.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_104_0.png)


    # # Changing directories


    The output is all blue, which means these are all directories, so you can go into
    them to look at the files they have inside. The command to change directory is
    cd, and you use it with the name of the directory you would like to go into:


    ```

    pi@raspberry ~ cd python_games

    ```


    The prompt changes to show the directory you have changed after the tilde character,
    and you can double-check that the current directory has changed by ls to view
    the files.


    # # Checking file types


    If you want to find out about a particular file, you can use the file command.
    After the command name, the name of the file you''d like more information on.
    You can list several files in one command by separating them with spaces, like:


    ```

    pi@raspberry ~/python_games file body.png match0.wav wormy.py

    body.png: PNG image data, 50 x 85, 8-bit/color RGBA, non

    interaced

    match0.wav: RIFF (little-endian) data, WAVE audio, Microsoft

    PCM, 16 bit, mono 44100 Hz

    wormy.py: Python script, ASCII text executable

    ```


    CHAPTER 5 Using the Linux Shell 89'
