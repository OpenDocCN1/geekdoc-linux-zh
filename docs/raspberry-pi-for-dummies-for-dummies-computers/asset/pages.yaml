    # Chapter 5


    # Using the Linux Shell


    The Linux shell is the text–based way of issuing instructions to your Raspberry
    Pi. The shell on the Raspberry Pi is called Bash, which is used in most other
    Linux distributions too. Its name is short for Bourne Again Shell, a pun because
    it was created to replace the Bourne shell.


    In this chapter, you learn how to use the shell to manage your Raspberry Pi. There
    are several reasons why it''s a good idea to learn how to use the shell. Most
    importantly, it''s a faster solution for certain tasks than the desktop environment.
    Learning Linux is also a useful skill in itself: Linux is a powerful and popular
    operating system, and the Raspberry Pi can provide an accessible introduction
    to the basics. It also gives you some understanding of what''s going on behind
    the scenes on your Raspberry Pi.


    To open a shell window, click the Terminal icon at the top of the screen, which
    has a >_ prompt on it. Alternatively, you can find the Terminal in the Accessories
    section of the Applications menu. Either approach opens a window on the desktop
    that you can use to access the shell.


    > If the screen goes blank while you''re using the shell, don''t worry: You can
    get back again by pressing any key on the keyboard.


    CHAPTER 5 Using the Linux Shell 87'
