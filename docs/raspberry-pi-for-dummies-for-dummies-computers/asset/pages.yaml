  md: 'film to start watching it. You can also click Movies on the main menu to see
    a list of your films, together with artwork and a synopsis downloaded from the
    Inter-net. Click the . option at the top of this menu, and then click it again
    on the next menu to get to your files if you want to play media indexed in the
    library. With audio, you can tap the spacebar to pause or unpause a film.


    # Viewing Photos


    Click Pictures from the main menu to see a simple file browser that you can use
    to access your pictures, with your added folders listed. The media center software
    supports standard image formats, including JPEG, BMP, TIFF, and generates thumbnails
    of your photos and folders. Navigate to a photo and click it. You use the left
    and right keys to move through your photos, and the Escape key (or right-click
    mouse) to return to the menu.


    # Changing the Settings


    The cogwheel at the top of the main menu gives you access to the settings for
    Kodi, divided into several sections. They include, among others:


    +   >> Player settings, covering options such as whether the next song or video
    plays automatically, whether there is cross-fading between songs, and the use
    of subtitles.


    +   >> Media settings, which enable you to manage sources of media in the library
    and choose information providers for artist and album information.


    +   >> Interface settings, which enable you to choose a skin (design) for Kodi,
    your region, and a screensaver. If you install a screensaver add-on, you''ll need
    to enable it.


    +   >> System settings, which can be used to choose the correct audio output device,
    configure notification sounds in Kodi, and configure power and the Internet connection.


    +   >> LibreELEC, which includes options for managing the Internet connections
    available to the system and for securing Secure Shell (SSH) for remote access
    to your Pi.


    +   >> File Manager, which enables you to copy files between different folders
    and storage devices.'
