  md: '+   >> mnt: This directory is used to store the details of removable storage
    devices that you mount yourself. (See the section about mounting external storage
    devices in Appendix A.)


    +   >> opt: This directory is used for optional software on the Raspberry Pi.
    Usually in Linux, this directory is used for software you install yourself, but
    on the Raspberry Pi, many programs install into /usr/bin instead


    +   >> proc: This directory is used by the Linux kernel to give you information
    about its view of the system. Most of this information requires expertise to interpret,
    but it''s fine to take a peek anyway. Entering less /proc/cpuinfo to see how the
    kernel views the Raspberry Pi processors, or less /proc/meminfo to see how much
    memory your Raspberry Pi has and how it''s being used. (You''ll learn how to use
    less fully, but for now, you just need to know that you press Q to quit.) If you
    use the file command to look at these files, they appear to be empty, which is
    a peculiarity because they''re constantly updated.


    +   >> root: You don''t have permission to change into this as an ordinary user.
    It''s reserved for the use of the root user, which in Linux is the all-powerful
    user account that can do anything on the computer. The Raspberry Pi discourages
    the use of the root account and encourages you to use sudo to issue specific commands
    with the authority of the root user (sometimes called superuser). Later in this
    chapter, we show you how this is used to install software. ("Installing software")


    +   >> run: This directory, a recently added to Linux, provides a place where
    programs can store data they need and have confidence it will be available when
    the operating system starts up. The tmp directory is vulnerable to being removed
    by disk cleanup programs, and the user directory might not be available at start-up
    on all Linux systems (It can be on a different file system.)


    +   >> sbin: This directory contains software that is typically reserved for the
    use of the root user.


    +   >> srv: This is empty by default, and is sometimes used in Linux for storing
