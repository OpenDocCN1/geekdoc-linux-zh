    is that it works, but it can cause errors in your programs. If you turn your cat
    to direction 270 and ask Scratch which way the cat is facing, it tells you -90.
    Avoid any inconsistencies like this, keep direction numbers in the range from
    -179 to 180.


    **Point Towards:** You can also tell the sprite to point towards the mouse pointer
    or another sprite. Use the menu in this block to choose what you would like your
