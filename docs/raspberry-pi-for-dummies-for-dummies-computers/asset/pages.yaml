    You will rarely need to use any of these directories, but in case you''re curious,
    here''s what some of them are used for:


    +   **bin**: This is short for binaries, and it contains small programs that behave
    like commands in the shell, including ls and mkdir, which you will use to make
    directories later.

    **boot**: This contains the Linux kernel, the heart of the operating system, and
    also contains configuration files that store various technical settings for the
    Raspberry Pi. Appendix A shows you you can edit the config.txt file to change
    some of your computer''s settings.

    **dev**: This stores a list of devices (such as disks and network connections)
    that the operating system understands.

    **etc**: This is used for various configuration files that apply to all users
    on the computer.

    **home**: As already discussed, this directory contains a directory for each user,
    and that is the only place a user is allowed to store or write files by default.

    **lib**: This directory contains libraries (shared programs) that are used by
    different operating system programs.

    **lost-found**: The name looks intriguing, but hopefully you''ll never have to
    deal with this directory. It''s used if the file system gets corrupted and recovers
    partially.

    **media**: When you connect a removable storage device like a USB key and it is
    automatically recognized in the desktop environment, its details are stored in
    the media directory.


