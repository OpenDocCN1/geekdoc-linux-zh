- pgno: 275
  md: 'You can build towers and rise into the air on them by looking down and repeatedly
    jumping and placing a block under you.


    Although Python makes it much easier to build things, we recommend that you spend
    some time familiarizing yourself with how players experience the world. In particular,
    it''s worth experimenting with how blocks interact with each other. Stone blocks
    float in the air unsupported, but sand falls to the ground. Cactus cannot be planted
    in grass, but can be placed on top of sand. If you chip away at the banks of a
    lake, the water flows to fill the space you made. You can''t place water and lava
    source blocks within the game, although you can program them using Python and
    they can cascade down or cover a wide area. When water and lava come into contact
    with each other, water sometimes cools lava into stone.


    # # Preparing for Python


    One of the peculiarities of Minecraft is that it takes control of the mouse, so
    you have to Press Tab to take back control when you want to use any other programs
    on your desktop. To start using the mouse in Minecraft again, click the Minecraft
    window. You will soon be used to pressing Tab before you try to do any programming.
    Press Tab now to leave Minecraft running but bring the mouse cursor back into
    the desktop. To make Minecraft programs, you''ll use Thomny, so you open the Applications
    menu in the top left, click Programming, and choose Thomny. (If you prefer, you
    can use Python 3 (IDLE), also in the Program-part of the Applications menu.) You
    might have to click the top of the Minecraft craft window and drag it out of the
    way, or click the first button in the top right of your window to minimize it.


    One of the first things you''ll notice is that Minecraft sits on top of other
    windows, and your Python window might float underneath it, so a certain amount
    of reorganization is necessary. If your screen is big enough, you might be able
    to show Minecraft and Thomny windows on the same time.


    If your screen isn''t big enough, you''ll have to switch between the windows as
    necessary. To bring Minecraft, click the button on the taskbar at the top of the
    desktop and then click the Minecraft''s title bar (at the top of your window)
    to minimize it. To bring Minecraft back or activate it, click it on the taskbar
    again. It won''t respond to the mouse and keyboard controls, so you need to click
    it on the taskbar. (See Chapter 4 for a guide to using the desktop.)


    260 PART 4 Programming the Raspberry Pi'
