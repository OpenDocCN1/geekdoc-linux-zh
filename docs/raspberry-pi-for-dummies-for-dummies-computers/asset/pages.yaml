    # Connecting to Your Router


    The Raspberry Pi Model A, A+, and Zero have no wired network connection on the
    board. The other Raspberry Pi models have an Ethernet socket on the right edge
    of the board, indicated in Figures 3-1 and 3-2. Use this socket to connect your
    Raspberry Pi to your Internet router with a standard Ethernet cable.'
