- pgno: 258
  md: '![](img/df9a01bf057d58c2401b5edabd6e8829_258_0.png)


    FIGURE 12-1: Your first Pygame Zero program puts an image in the middle of the
    screen.


    To create an actor, you give it a name and tell it which filename to use for the
    actor''s picture, like this:


    ```

    cloud = Actor(''target5'')

    ```


    Here you''ve created an actor cloud that uses the image target5.png. Note that
    you don''t need to give Pygame Zero the file extension of the image; that''s another
    way it keeps things simple.


    The coordinates are measured from the top left of the window, so you go from 0
    to 500 from left to right (the x direction), and from 0 to 500 down the window
    (the y direction). If you want to change the x position of the cloud actor, you
    can assign it a new value, like this:


    ```

    cloud.x = 250

    ```


    Because the window is 500 pixels across and the actor''s position is measured
    from its center, changing the actor''s x position to 250 centers it in the window.


    The last thing you need to do is draw the sprite. The draw() function is run regularly
    by Pygame Zero, and it''s where you tell it what to draw on the screen. (See Chapter
    11 for more on how functions work and are defined.) When you start moving around,
    theyll leave a trail if you don''t remove the previous images before drawing each
    screen, so you start this function by clearing the screen with this instruction:


    ```

    screen.clear()

    ```'
  merge: -1
  img_proc: true
