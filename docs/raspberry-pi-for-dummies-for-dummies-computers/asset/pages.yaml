- pgno: 115
  md: 'The number in the middle of the line is the size of the file. Three of the
    entries (Desktop, python_games, and seanwork) are directories that have the same
    size (4096 bytes), although they have vastly different contents. That''s because
    directories are files too, and the number here is telling you how big the file
    that describes the directory, and not how big the directory''s contents are measured
    in bytes, but you can add the -h option to give you more numbers — translating
    4096 bytes into 4K, for example.


    The rest of the information permissions, which refer to who is allowed to use
    the file and what they are allowed to do with it. Linux is designed from the start
    to offer a secure way for multiple users to share the same system, and so permissions
    are an essential part of Linux works.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_115_0.png)


    Many people find they can use their Raspberry Pi without needing to know much
    about permissions, permissions tell you a lot about Linux, and you might find
    the knowledge useful if you want to be a bit more adventurous.


    The permissions on a file are divided into three categories: the file''s owner
    can do (who is usually the person who owns the file), that group can do (people
    who belong to a group that has permission to use the file), and that everyone
    can do (known as the world permissions).


    In the long list, you can see that the word pi is shown twice for each file. The
    two columns represent the owner of the file or directory (the leftmost of the
    two columns) and the group that owns the file. These both have the same name because
    Linux creates a group for each user with just that user in, and with the same
    name as the user. In theory, the group could be called like students and all students
    have usernames for computer.


    The leftmost column contains a code that explains what type of file it is, and
    what the permissions are on. To make sense of the code, you need to break it down
    into four chunks, as in Table 5-2, which represents the code shared by booknotes.txt
    and spacegame.sb in our long list.


    # TABLE 5-2


    # Understanding Permissions


    | File type | Owner | Group | World |

    | --- | --- | --- | --- |

    | I-- | I-- | I-- | I-- |


    The two main file types you''re likely to come across are regular files and directories.
    Regular files have a hyphen (-) for their file type at the start of their code,


    100 PART 2 Getting Started with Linux'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'and directories have a d. You can see both of these symbols used in our long
    directory listing.


    Next come the permissions for the owner, group, and world. These are the different
    types of permissions someone can have:


    +   **Read permission:** The ability to open and look at the contents of a file,
    or to list a directory


    +   **Write permission:** The ability to change a file''s contents, to create
    or delete files in a directory


    +   **Execute permission:** The ability to treat a file as a program and run it,
    or to enter a directory using the cmd command


    ![](img/df9a01bf057d58c2401b5edabd6e8829_116_0.png)


    That probably seems logical and intuitive, but there are two potential catches:
    First, you can only read or write in a directory if you also have execute permission
    for that directory; and second, you can rename or delete a file only if the permissions
    of its directory allow you to do so, even if you have write permission for the
    file.


    The permissions are expressed using the letters r (for read), w (for write), and
    x (for execute), and these make up a 3-letter code in that order. Where permission
    has not been granted, the letter is replaced with a hyphen. In Table 5-2, you
    can see that the owner can read and write the file, but the group and world (everyone)
    can only read it.


    The code for the Desktop folder in our listing is drwxrxr-xr. The first letter
    tells you it''s a directory. The next three (rwx) tell you that the owner can
    read, write, and execute it, which means they have freedom to list its contents
    (read), add or delete files (write), and enter the directory in the first place
    to carry out those actions (execute). The next three characters (r-x) tell you
    that group members may enter the directory and list its contents (read), but may
    not create or delete files. The final three characters (r--) tell you that everyone
    else (the world) has been granted those same-permissions.


    Several commands are used to change the permissions of a file using chmod to change
    the permissions, chown to change a file''s owner, and chgrp to change the file''s
    group. We don''t have space to go into detail here but see Learning Linux Commands,”
    in this chapter, for guidance on how to get with them. The easiest way to change
    permissions, in any case, is to choose Properties from the menu that appears.
    Right-click a file in File Manager (see Chapter 4) and the desktop environment.
    You can then use the Permissions tab in the Properties window that appears (see
    Figure 5-3) to change the permissions associated with a file.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/df9a01bf057d58c2401b5edabd6e8829_117_0.png)


    # # Slowing Down the Listing and Reading Files with the Less Command


    The problem with ls is it can deluge you with information that flies past your
    eyes faster than you can see. If you open a shell window from the desktop environment,
    you can use a scroll bar to review information that has scrolled off the screen.


    The more usual solution, however, is to use a command called less, which takes
    your listing and enables you to page through it, one screen at a time. To send
    the listing to the less command, you use a pipe character (!) after your listing
    command:


    ```

    ls -RXF | less

    ```


    When you''re using less, you can move through the listing one line at a time using
    the up- and down-arrow keys, or one page at a time using the Page Up (or b) and
    Page Down (or space) keys. You can search by pressing / and typing what you''d
    like to search for and pressing Enter. When you''ve finished, press the Q key
    (upper- or lowercase) to quit.


    > > You can cancel a Linux command, including an overwhelming listing, by pressing
    Ctrl+C.


    102  PART 2 Getting Started with Linux'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'You can also use less to view the contents of a text file by giving it the
    filename as an argument, like this:


    ```

    less /boot/config.txt

    ```


    This is a great way to read files as you explore Linux. The less command warns
    you if the file you want to read might be a binary file, which means it''s computer
    code and likely to be unintelligible, so you can use the less command on anything
    and bow out gracefully if you get the warning. Displaying binary code onscreen
    can result in some strange results, including distorting the character set in
    the shell.


    If you want to see the first ten lines of a file, perhaps to check what version
    it is, you can use the command head followed by the filename.


    Now you have all the tools you need to explore your Linux operating system!


    # # Speeding Up Entering Commands


    Now you''ve learned a few basic commands, we can teach you a few tricks to speed
    up your use of the shell.


    First of all, the shell keeps a record of the commands you enter, called your
    history, so you can save retyping if you want to reuse a command. If the last
    command, just type in two exclamation marks and press Enter. If you want to use
    an earlier command, tapping the up arrow brings back your previous commands in
    order (most recent first) and puts them after your prompt. The down arrow moves
    through your history in the other direction if you overshoot the command you want.
    You can edit the command before pressing Enter to issue.


    The shell also tries to guess what you want to type and automatically completes
    it for you if you tap the Tab key. You can use it for commands and files. For
    example, type


    ```

    cd /bo

    ```


    and then press the Tab key, and the path is completed as /boot/.


    This technique is particularly helpful if you''re dealing with long and complicated
    filenames. If it doesn''t work, you haven''t given the shell enough of a hint,
    so you need to give it more letters to be sure what you mean.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Using Redirection to Create Files


    Before you look at how you delete files and copy them, you should prepare some
    files to play with.


    It''s possible to send the results from a command to a file instead of the screen;
    in other words, redirect them. You could keep listing results in a file, for example,
    if you have a permanent record of them or so can analyze them using a text editor.
    You turn screen output into a file by using a greater-than sign and the filename
    you''d like to send the output to, this:


    ```

    ls ~/listing.txt

    ```


    ![](img/df9a01bf057d58c2401b5edabd6e8829_119_0.png)


    You don''t need to have the file extension of .txt for it to work in Linux, but
    it''s a useful reminder for yourself, and it helps if you copy the file back to
    a Windows machine.


    Try using this command twice from different directories and looking at the contents
    of listing.txt with the less command. You will see just how unforgiving Linux
    is. The first time you run the command, the file listing.txt is created. The second
    time you do it, it''s replaced without waiting. Linux trusts you to know what
    you''re doing, so please be careful not to overwrite files.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_119_1.png)


    If you want a bit of variety, you can use other commands to display content onscreen:


    +   >> echo: This displays whatever you write after it onscreen. You can use it
    to solve mathematics problems if you put them between two pairs of brackets (parentheses)
    and a dollar sign in front, for example:


    ```

    echo $((5+5))

    ```


    +   >> date: This shows the current time and date.


    +   >> cal: This shows the month''s calendar, with today highlighted. You can
    see the year''s calendar using the option -y.


    If you want to add something to the end of an existing file, you use two greater-than
    signs, so you can see this in this example:


    ```

    @raspberrypi $ echo I made this file on ~ testfile.txt

    @raspberrypi $ date >> testfile.txt

    @raspberrypi $ cal >> testfile.txt

    @raspberrypi $ echo $((20+31+5)) Days until my ₐbirthday! >> testfile.txt

    ```


    104 PART 2 Getting Started with Linux'
  merge: -1
