  md: 'We assume here that you''re using a monitor or TV, but there is also an official
    Raspberry Pi touchscreen that connects using the Display socket on the left of
    the

    board (not available on the Pi Zero or Zero W).


    # Connecting an HDMI or DVI display


    On the top surface of your board, on the bottom edge, there is the HDMI connector.

    Refer to Figures 3-1, 3-2 and 3-3.) If you''re using a Raspberry Pi Zero, you
    should have an adapter to convert the Mini HDMI to an HDMI socket. Insert your
    HDMI

    cable in the Raspberry Pi board or the Pi Zero converter, and then insert the
    other

    to your monitor.


    If you have a DVI display rather than a HDMI display, you need to use an adapter
    on the screen end of the cable. The adapter itself is a simple plug, so you just
    plug the HDMI cable into the adapter and then plug the adapter into your monitor
    and turn the silver screws on the adapter to hold the cable in place. Figure 3-9
    shows the HDMI cable lined up for insertion into the DVI adapter.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_57_0.png)


    # Connecting a television using composite video


    If your television has an HDMI socket, use that socket for optimal results. Alternatively,
    you can use the composite video socket. On the Model A and B, it''s a round, yellow–and–silver
    socket on the top edge of the board. (Refer to Figure 3–1.)


