    # Using the Text Editor


    Among the accessories on the Applications menu is Leafpad, which is a simple text
    editor. (See Figure 4-12). To find it, click Text Editor in the Accessories part
    of the Applications menu. You can use Leafpad for writing and word processing,
    but it''s not ideal for creating printing-ready documents. It''s most useful for
    editing documents intended to be read by computers, as as web pages and configurations.


    The menus are logically organized, and if you''ve ever used a text editor on another
    computer, you''ll find your way around in Leafpad easily.


    The File menu is used to start new documents and open, save, and print files.
    There''s also an option to quit here, although you can just close the Leafpad
    window.


    The Edit menu gives you tools for undoing and redoing your work and for cutting,
    copying, pasting, deleting, and selecting all your text. Leafpad uses Windows
    shortcuts, too so you can use Ctrl+C to copy, Ctrl+V to paste, Ctrl+X to cut,
    and Ctrl+A to select all text.'
