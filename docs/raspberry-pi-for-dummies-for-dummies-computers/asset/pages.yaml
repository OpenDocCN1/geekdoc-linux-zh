- pgno: 24
  md: '+   IN THIS CHAPTER

    >> Getting up close and personal with the Raspberry Pi

    >> Taking stock of your Raspberry Pi

    >> Determining its limitations

    >> Purchasing your own Raspberry Pi

    >> Figuring out what else you need


    # Chapter 1

    Introducing the Raspberry Pi


    The Raspberry Pi is perhaps the most inspiring computer available today. Although
    most of the computing devices being used (including phones, tablets, and game
    consoles) are designed to stop people from tinkering with it, the Raspberry Pi
    is exactly the opposite. From the moment you see its shiny green circuit board,
    it invites you to prod it, play with it, and create with it. It comes with the
    tools you need to start creating your own software (or programming), and you can
    connect your electronic inventions to it. If you break it, it won''t break the
    bank, so you can experiment with confidence.


    Lots of people are fired up by its potential, and they are discovering exciting
    new ways to use. Dave Ackerman (www.daveakerman.com) and friends attached one
    to a weather balloon and sent it nearly 40 kilometers high to take pictures of
    the Earth from near space using a webcam. (You can read about Dave''s ballooning
    project in Chapter 20.)


    Professor Simon Cox and his team at the University of Southampton connected 64
    Raspberry Pi boards to build an experimental supercomputer, held together by Lego
    bricks. In the supercomputer (see Figure 1-1), the Raspberry Pis work together
    to solve a single problem. The project has been able to cut the cost of'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'supercomputer from millions of dollars to thousands or even hundreds of dollars,
    making supercomputing much more accessible to schools and students. Others have
    also experimented with combining the process of multiple Pis. There''s even an
    off-the-shelf kit you can use to combine four Raspberry Pi Zeros with a full-size
    Raspberry Pi (the Cluster HAT from Pimoroni) so that you can experiment with running
    programs across multiple Pis at the same time.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_25_0.png)


    FIGURE 1-1:

    Two of the Raspberry boards used in the University of Southampton''s supercomputer,
    with the rest of the supercomputer in the background.


    *Courtesy of Simon Cox and Glenn Harris, University of Southampton.*


    The Pi is also being used to make weather stations, fitness gadgets, devices,
    audiobook players, electric skateboards, and much more, as we discover in Chapter
    20.


    Although those projects are grabbing headlines, another story is less visible
    but more important: the thousands of people of all ages who are taking their first
    steps in computer science, thanks to the Raspberry Pi.


    Both of the authors of this book used computers in the 1980s, when the notion
    of a home computer became a reality. Back then, computers were less friendly than
    they are today. When you switched them on, you were faced with a flashing cursor
    and had to do something in to get it to do anything. As a result, though, a whole
    generation grew up knowing at least a bit about how to give the computer commands,
    and how to create programs for it. As computers started to use mice and windows,
    people didn''t need those skills any more, and they lost touch with them.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Eben Upton, designer of the Raspberry Pi, noticed the slide in skill levels
    when he was working at Cambridge University’s computer laboratory in 2006. Students
    applying to study computer science started to have less experience with programming
    than students of the past. Upton and his colleagues hatched the idea of creating
    a computer that would come supplied with all the tools to program it — and would
    sell for a target price of $25 (about £20). It had to be able to do other interesting
    things, so that people were drawn to use it, and it had to be robust enough to
    survive being pushed in and out of schools hundreds of times.


    That started a six-year journey that led to the Raspberry Pi you have on your
    desk as you read this book. It was released in February 2012, and sold half a
    million units by the end of the quarter. By July 2017, there were more than 14
    million Raspberry Pis in homes, schools and workplaces, 10 million of them made
    in the UK. It is, by a large margin, the best-selling British computer of all
    time.


    # Getting Familiar with the Raspberry Pi


    When your Raspberry Pi arrives, you''ll see that it''s a circuit board, with components
    and socks stuck on it, as shown in Figure 1-2. In an age when most computing devices
    are sleek and shiny boxes, the spiky Pi, with tiny codes printed in white all
    over it, seems alien. That''s a big part of its appeal, though: Many of the cases
    you can buy for the Raspberry Pi are transparent because people love the look
    of it.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_26_0.png)


    FIGURE 1-2:

    The Raspberry Pi 3 Model B (top left), Model A+ (top right), and Zero W (bottom).


    CHAPTER 1 Introducing the Raspberry Pi 11'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Over the years, the Raspberry Pi has evolved, increasing its memory, improving
    its performance, and adding features. So which one should you get? Here''s an
    over-view designed to help you decide:


    +   **Raspberry Pi 3 Model B:** The third generation of the Raspberry Pi, it represents
    the best all-round Raspberry Pi at the time of writing. According to the Raspberry
    Pi Foundation, it is 5 to 60 percent faster than the previous model, and ten times
    faster than the original Raspberry Pi. It includes 1GB of memory, four USB ports,
    built-in Wi-Fi and Bluetooth, and an Ethernet port for a wired connection. It
    has 40 General Purpose Input/Output (GPIO) pins, which you can use to connect
    to your own electronics projects. Like previous models, it''s about the size of
    a credit card. As with any current Raspberry Pi, it includes a microSD card for
    storage. If you''re not sure which model to get and your budget allows, get this
    one. It represents the fastest performance, and offers the best experience on
    the desktop. Its price is around $35 (about £30).


    It''s called the Model B, incidentally, as tribute to the BBC Microcomputer that
    was popular in the U.K. in the 1980s. It''s sobering to think that the BBC Micro
    cost ten times the price of a Raspberry Pi, thanks to 35 years of progress in
    computer science, has more than 7,800 times more memory.


    +   **Raspberry Pi 1 Model A:** a cut-down model, it is ideal for projects with
    lower power consumption — typically battery-based. It is suitable for robots and
    projects in remote locations, where a wired electricity supply is isnt. It has
    one USB port, although you can connect it to a USB hub to use more devices simultaneously.
    It has the full complement of 40 GPIO pins, so you would find that your projects
    and adds work with it. Like the Model B, it includes an audio output (headphones-style)
    socket. This has 512MB of memory and a price of $20 (or £20). The Model A+ is
    slightly shorter on the long side than the Raspberry Pi 3, measuring 6.5 centimeters.


    +   **Raspberry Pi Zero:** The Raspberry Pi Foundation astonished everyone when
    it gave this away with the print edition of its magazine The MagPi. The Raspberry
    Pi Zero measures 6.5 centimeters by 3 centimeters, extremely lightweight, and
    has 512MB of memory and one Micro USB port. If you want to use the GPIO, you''ll
    need to solder or affix your own pins, available separately. (You can read all
    about GPIO pins on the Pi Zero in Chapter 16.) You''ll also need a connector for
    the Mini HDMI socket, and for the Micro USB socket, so you should expect to spend
    a bit more than the price of the Pi (and have a bit more complexity in your setup).
    Built as the $5 computer, the Raspberry Pi Zero has at times been difficult to
    get hold of, which is perhaps not surprising given the phenomenal demand for it.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   Raspberry Pi Zero: Released in February 2017, the Raspberry Pi Zero W added
    Wi-Fi and Bluetooth, and compatibility with the Raspberry Pi Camera Module. The
    Pi Zero W costs around $10 (or about £10). If you''re happy to solder your GPIO
    pins, or you don''t need them, the Raspberry Pi Zero or Zero W represents a great
    entry point to the Raspberry Pi family. After the Raspberry Pi 3, the Pi Zero
    W is our recommended best buy.


    Of course, the older Raspberry Pi Pis are still there. Recent models remain in
    production where there is demand, and you can buy secondhand versions from websites
    like eBay. Generally speaking, the newer the model, the faster its performance.
    Memory upgrades have made a difference, as well as the use of more powerful processors,
    as the Pi has evolved. There are plenty of uses for the Pi that don''t need especially
    fast performance, though, you might find that an older Pi is perfect for your
    project. The older models are described in this list:


    +   Raspberry Pi 1 Model B with 256MB memory: Although it''s called Model B, this
    was the first Raspberry Pi to be released, in February 2012. The Raspberry Pi
    Model B features an Ethernet connection for the Internet and two USB ports. It
    uses an SD card for storage.


    +   Raspberry Pi 1 Model B with 512MB memory: Released in October 2012, the Raspberry
    Pi Model B had twice the memory capacity. This improved the speed of some software,
    applications that used images heavily.


    +   Raspberry Pi 1 Model A: The Model A, released in February 2013, is a stripped-down
    version of the Model B. It has one USB port and doesn''t have an Ethernet port
    for connecting to the Internet. It has 256MB of memory.


    +   Raspberry Pi 1 Model B+: The Model B+, released in July 2014, has been described
    by the Raspberry Pi Foundation as "the final evolution of the original Raspberry
    Pi." It runs all the same software as the previous versions of the Raspberry Pi,
    but it has four USB ports, GPIO pins for connecting electronics projects to the
    Pi, and lower power consumption and better audio than the Model B. In common with
    the Model B, it has 512MB of memory. Although all previous versions used SD cards
    for data storage, the Model B+ introduced the smaller microSD cards, which are
    now standard on the Raspberry Pi.


    +   Raspberry Pi 2 Model B: Launched in February 2015, this Model B doubled the
    memory on the Model B+ to 1GB. It increased performance, compared to the Model
    B+, retaining its physical features. Over the years the Pi''s performance has
    been improved by new software releases as well as updates to the hardware. The
    Pi 2 represents an immediately noticeable speed-up, compared to the Model B+.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'If you''re using anything earlier than the Model B+, you''ll need full-size
    SD cards

    (not MicroSD) for storage, and you''ll only have 26 GPIO pins to play with. Current

    -ons are unlikely to be compatible with the early boards, so check their

    requirements before you buy.


    In this book, we offer guidance on older models where possible but we will assume

    you''re using at least a Model B+ for the projects. For best performance, we recommend-using
    a current model, if possible.


    You''ll also see the Raspberry Pi Compute Module in the online stores alongside
    the

    Raspberry Pi, but this is something different. It''s aimed at engineers creating-industrial
    applications (known as embedded systems) or products based on

    Raspberry Pi technology. We only mention it here in case you wonder what it is:

    it''s not covered further in this book, and it''s almost certainly not what you
    want

    to buy your first Raspberry Pi.


    The Raspberry Pi was made possible by the advances in mobile computer

    chips that have been recognized in recent years. At its heart is a Broadcom chip
    (BCM2835, BCM2836, or BCM2837) that contains an ARM central processing unit (CPU)
    and a

    Videocore IV graphics processing unit (GPU). The CPU and GPU share the memory

    tween them. The GPU is powerful enough to be able to handle Blu-ray quality

    playback.


    Instead of running Windows or Mac OS, the Raspberry Pi uses an operating system

    Linux. It''s a leading example of open source, a completely different philosophy-to
    the commercial software industry. Rather than being created within the

    avily guarded walls of a company, with its design treated as a secret, Linux

    is built by companies and expert volunteers working together. Anyone is free

    to inspect and modify the source code (a bit like the recipe) that makes it work.
    You

    don''t have to use Linux, and you''re allowed to share it with other people, too


    You probably won''t be able to run the software you have on your other computers

    or your Raspberry Pi. It won''t run Windows or Mac software, and not all Linux

    software works on the Raspberry Pi. But a lot of Linux software that is compatible

    with the Raspberry Pi is available and is free of charge.


    # # Figuring What You Can Do with a Raspberry Pi


    The Raspberry Pi is a fully featured computer, and you can do anything

    ith that you can do with a desktop computer.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'It has a graphical windows desktop to start and manage programs (see Chapter
    4) as well as the Internet for accepting text commands. (see Chapter 5.) You can
    use it for browsing the Internet (see Chapter 4), or for word processing and spreadsheets
    (see Chapter 6), or for editing photos. (see Chapter 7.) You can use it for playing
    back music or video (see Chapter 8) or for playing games. (see Chapter 19.) You
    can use the built-in software to write your music, too. (see Chapter 14.) It''s
    the perfect tool for homework, but it''s also a useful computer for writing letters,
    managing your accounts, and paying bills online.


    The Raspberry Pi is at its best, however, when it''s used to learn how computers
    work, and how you can create your programs or electronics projects using them.
    It comes with Scratch (see Chapter 9), which enables people of all ages to create
    their animations and games while learning some of the core concepts of computing
    along the way.


    It also comes with Python (see Chapter 11), a professional programming language
    used by YouTube, Google, and Industrial Light & Magic (the special effects gurus
    for the Star Wars films), among many others.


    It has GPIO pins on it that you can use to connect your own circuits to the Raspberry
    Pi, so you can use your Raspberry Pi to control other devices and to receive and
    interpret signals from them. In Part 5, we show you how to build some electronic
    projects controlled by the Raspberry Pi.


    # Getting Your Hands on a Raspberry Pi


    One of the great things about the Raspberry Pi is that it has established a community
    of businesses that have created products for it, or now share in its success by
    selling it. You can now buy the Raspberry Pi from a wide range of electronics
    companies for hobbyists. Global retailers (www.pimoroni.com), The Pi Hut (https://thepihut.com),
    and Adafruit (www.adafruit.com). It''s also available from the Raspberry Pi''s
    distributors, RS Components (www.rs-components.com) and Element14 (www.element14.com).


    You might also be able to buy it from your local computer or electronics store,
    although you''ll probably find it''s only available as part of a kit there. Shops
    often bundle the Raspberry Pi with other items you need to use it. It can be convenient
    to get everything at once, but it might not represent the cheapest way to get
    started.'
