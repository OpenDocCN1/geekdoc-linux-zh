- pgno: 272
  md: '# IN THIS CHAPTER


    +   » Exploring the Minecraft world


    +   » Manipulating the Minecraft world in Python


    +   » Generating a random Minecraft maze in Python


    # Chapter 13


    # Programming Minecraft with Python


    Minecraft appeals to the the Lego fan in everyone. It enables you to build immersive
    3D worlds from blocks of materials, and it has fired up imaginations to the extent
    that over 100 million copies have been sold across various platforms, including
    the PC and Xbox.


    A version of Minecraft is available for the Raspberry Pi. It features the Creative
    mode, where you can build items peacefully without the threat of monster attacks
    or starvation. The best feature is that you can program it using multiple languages,
    including Python. This means that you can build a grand palace without having
    to manually place every block, and you can write programs that invent original
    new structures for you to room and around, and as you see in this chapter.


    The project in this chapter uses a Python program to build a maze in Minecraft.
    Each time you run the program, it builds a new maze for you, and you can control
    how big you want it to be and what materials you want it to be made of. During
    the course of this project, you''ll find out how to place and remove blocks in
    Minecraft using Python so that you''ll have the skills to write your own programs
    that surpass your construction work.


    At the time of writing, Minecraft: Pi Edition is alpha software, which means that
    it''s a very early test version (less well developed than a beta version). We
    had only'
