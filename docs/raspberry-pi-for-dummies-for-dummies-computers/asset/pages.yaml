    # # Changing the Background


    You can change the Stage''s background to something more inspiring than the plain
    white space when you start Scratch. The Sprite List contains an entry for the
    Stage. (Refer to Figure 10-1). The Stage can have scripts and different images,
    just like a sprite can. The Stage''s images are called backgrounds rather than
    costumes. Click the Stage''s icon in the Sprite List, and then click the Backdrops
    tab at the top of the Scripts Area to see the Background Area.


    You may choose a new background, using the built-in art gallery (see the section
    "Drawing Sprites in Scratch," a little later in this chapter). Alternatively,
    you can use an existing image file (or import it, in Scratch-speak). Scratch comes
    with a number of backgrounds you can choose from, or you can use your own photo.
    Scratch can open images in .jpg, .gif, or .png format.


    For the background for this chapter''s game, we''ve used a photo Sean took of
    Lanzarote''s barren landscape, which looks almost like it it could have been beamed
    from Mars.


