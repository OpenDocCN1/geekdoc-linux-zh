    Basically, this chip acts as an inverting buffer, but we don''t need to invert
    the signals, so we just pass each signal through two buffers to keep it the right
    way. As we new up have a 5V signal, there''s a chance that, if the supply voltage
    on the LEDs drops, then a series resistor will keep the damage to the first LED.
    There are ready-built drivers around, with most based on the 74HHTC125 chip. Note
    the large capacitor across the external power supply. The value is not too critical,
