    32 heads, 63 sectors/track, 15537 cylinders, total 31324160 sectors

    Units = sectors of 1 * 512 = 512 bytes

    Size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/optimal): 512 bytes / 512 bytes

    Disk identifier: @0x1707000e


    | Device Boot | Start | End Blocks Id System |

    | /dev/sda | * | 63 | 3132591 | 1566264+ | c | W05 FAT32 (LBA) |


    This lists the different storage devices that are connected to the Pi. In the
    example, you can see the first disk (/dev/mmcblk0) is 4025 MB, which is a 4GB
    SD card, and the second one (/dev/sda) is 16GB, which is a USB key we connected.
    The important information we need is from this device and the partition number,
    which is shown at the bottom of the output and is sda1.


    To mount the driver for the user pi (uid=pi) and the group pi (gid=pi), we then
    use


    ```

    sudo mount -o uid=pi,gid=pi /dev/sda1 /mnt/usbdrive

    ```


    To view the contents of the USB key, you can then use


    ```

    ls /mnt/usbdrive

    ```


    To back up your home directory to the USB key, we then use


    ```

    cp -R ~/* /mnt/usbdrive

    ```


    # Fixing Software Installation Issues


    The apt manager should enable you to cleanly install and remove software. If software
    isn''t working, removing it and then reinstalling it as described in Chapter 5.


    Packages often require other packages (called dependencies) to work. The package
    manager looks after these dependencies for you, but in the event they get broken,
    you can fix dependencies using


    ```

    sudo apt-get -f install

    ```'
