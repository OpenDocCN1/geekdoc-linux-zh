- pgno: 274
  md: '![](img/df9a01bf057d58c2401b5edabd6e8829_274_0.png)


    FIGURE 13-1:

    Minecraft on the Pi.


    Your character automatically jumps onto low blocks if you walk into them, but
    you can deliberately jump by pressing the spacebar.


    For the best view of your world, take to the skies by double-tapping the spacebar.
    When you''re flying, hold the spacebar to go higher, and the left Shift key to
    go lower. Double-tap the spacebar to stop flying and drop to the ground. There''s
    no health or damage in this edition of Minecraft, so you can freefall as far as
    you like.


    # Making and breaking things


    To break blocks in your world, use the mouse to aim the crosshair at the block
    you want to destroy, and click and hold the left mouse button. Some blocks are
    easier to break than others. There''s a limit on how far away you can be, so move
    closer if you can''t see chips flying off the blocks as you attempt to smash them.


    The panel at the bottom of the window shows the blocks you can place in the world.
    (Refer to Figure 13-L) You choose them using the scroll wheel on the mouse or
    by pressing a number between 1 and 8 to pick one (from left to right). Press E
    to open your full inventory, and then you can use movement keys (W, A, S, D) to
    navigate around it or Enter to choose a Block — or you can simply click your chosen
    block with the mouse.


    To position a block, right-click where you would like to place it. You can put
    a block on top of another one only if you can see the top of it, so you might
    need to fly to make tall structures.


    CHAPTER 13 Programming Minecraft with Python 259'
