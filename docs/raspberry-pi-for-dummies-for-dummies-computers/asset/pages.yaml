    ![](img/df9a01bf057d58c2401b5edabd6e8829_223_0.png)


    REMEMBER


    # Working with Python


    The Raspberry Pi has two versions of Python installed on it: Python 2 and Python
    3. Usually, when software or programming languages are updated, the new version
    is compatible with the old version. Python 3 was intentionally designed not to
    be compatible, however programs written for Python 2 might not work with Python
    3, and vice versa. In this book, we use Python 3 because it''s the newer version
    of Python.


    Programmers often use something called an integrated development environment (IDE),
    which is a set of tools for creating and testing programs. The default Python
    IDE is called IDLE, and two versions of it are on your Raspberry Pi — one apiece
    for Python 2 and Python 3.


    There is also an IDE called Thonny on your Raspberry Pi. This is more user friendly
    than IDLE and enables you to create and test Python programs with less switching
    between windows. It also has features in help you to write your programs. We''ll
    use Thonny in this book, but the Python examples in this book can be built and
    using IDLE if you prefer.


    Click the Applications menu, select the Programming category, and then click the
    Thonny Python IDE icon to get started.


    # Entering your first Python commands


    When you start Thonny, a window opens with two boxes in it — the window should
    look something like Figure 11-1.


    The top box is the editor, and we show you how to use that to make programs later
    in this chapter. For now, you can ignore it.'
  merge: -1
