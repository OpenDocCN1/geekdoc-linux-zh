  md: 'Use some sort of fume extractor when soldering. A simple fan works to guide
    the curl of smoke from the iron away from your face. Air currents from the warmth
    of your body tend to attract the flux. Try not to breathe in it. This is more
    important as you spend a long time (hours at a time) with a soldering iron in
    your hand. The fumes are from the flux in the solder; they are not lead fumes.


    Although Chapter 16 contains projects that be made without the use of a soldering
    iron by using solder-less bread boards, we recommend that you take that approach
    for a permanent project. When a project is meant to last more than a day or two,
    you should always solder it.


    # Looking at Ready-Made Add-On Boards


    There are basically two types of ready-made boards: those designed for making
    easy to get access to the GPIO pins and with components that have already been
    soldered up. We will look at some of the latter here and leave the former types
    to Chapter 16.


    Since the introduction of the Raspberry Pi in 2012, many companies have produced
    ready-made boards with all sorts of components already built on. They normally
    come with sample code to show how to use them, and many users just stick to that.
    However, this can be a wasted opportunity because you can always do more with
    a board than is shown in these examples. (Chapter 17 shows you some examples of
    this.) Many of these boards contain sensors that allow your Pi programs to measure
    things. New boards are constantly developed and produced.


    Boards come in three styles:


    +   - Separate boards that connect to the GPIO pins via a ribbon cable or your
    own wires.


    +   - Boards that plug into all the GPIO pins and cover most of the area of the
    Raspberry Pi board. These are called shields or plates.


    +   - Boards similar to the shield/plate variety just mentioned but could contain
    in addition an identification and sometimes software that the Pi can read what
    they are on start-up and install some software and prepare the GPIO pins automatically.
    These are called HATs—short for Hardware Attached on Top. Read more about HATs
    at http://www.raspberrypi.org/introducing-raspberry-pi-hats.'
