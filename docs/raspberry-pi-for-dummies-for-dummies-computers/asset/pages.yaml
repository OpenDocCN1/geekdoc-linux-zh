- pgno: 228
  md: '# Creating and running your first Python program


    The problem with entering instructions in the shell is that you have to enter
    them each time you use them. The commands are carried out straightaway, too, which
    limits the sophistication of the kinds of things you can do. You can solve these
    problems by creating a program, a set of repeatable instructions that you can
    save as a file and use again.


    To create a program, you use the editor, which is the box above the shell that
    says <untitled> on its tab.


    When you enter commands in the editor, they''re not carried out straightaway.
    The editor acts like a simple text editor; it enables you to enter your list of
    commands (or program) and gives you control over when commands are carried out.


    Enter the following commands in the editor, using Enter to start a new line:


    ```

    # simple times table program

    print("This program calculates times tables")

    print("It is from Raspberry Pi For Dummies")

    ```


    The window should now look like Figure 11-2. The two print() commands should look
    familiar to you, though the first line is new. In Python, after a hash mark (#)
    on the same line is ignored by the computer. The hash mark indicates a comment,
    used to add notes to programs so that you can understand them. The very best programs
    are written in such a way that you can understand them easily, and it''s a good
    idea to leave messages to your future self (or other people) so that you can quickly
    understand aspects of the program. We''ve got a i-line summary at the start of
    the program so that if we open it later, we can immediately see what it does.


    To save your program, click the File menu at the top of the Thony window and choose
    Save. You can also use the icons on the menu bar: the paper file icon opening
    a new file, and the arrow pointing to the filing cabinet drawer representing saving’
    file.


    The term used for starting a program is running it, so you click the Run menu
    and then click Run Script to see your program in action. Alternatively, the keyboard
    shortcut to run the program is F5, or you can click the button in the menu bar
    that looks like a triangular "play music" icon. When you run the program, you
    see those lines of text printed on the screen.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/df9a01bf057d58c2401b5edabd6e8829_229_0.png)


    Figure 11-2: Using the editor.


    Congratulations! You''ve just written your first Python program!


    ![](img/df9a01bf057d58c2401b5edabd6e8829_229_1.png)


    Before you can run your program, you must save it. If you''ve made changes since
    the last time it was saved, your program will be automatically saved for you.
    It overwrites the previous version of the program. On the File menu is an option
    to save a copy of the program or to save it a different filename (Save As), which
    can be useful if there is a chance you might want to revert to an earlier version.


    # Using variables


    The next step in the program is to ask the user which use multiplication table
    to generate. You store this number in a variable. A variable is a way of storing
    a number or piece of text so that you can refer to it later. (We talk more about
    variables in Chapter 10, where it plays a role in Scratch discussion.)


    For example, you might have a variable that stores your bank balance. It might
    go up (ka-ching!) or it might go down (sadly, more often), but you can always
    refer to it as your bank balance. Variables are one of the basic building blocks
    of programming, and not just in Python.


    214 PART 4 Programming the Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'In the example of a bank balance, you can create a variable in Python for bank
    balance called balance by just giving it a value, like this:


    ```

    balance = 500

    ```


    (If you want to try this, enter the commands in the shell. This isn''t part of
    our Times Tables program.) You can vary the value later (which is why it''s called
    a variable) by just giving it a new value:


    ```

    balance = 250

    ```


    More often, you''ll want to do sums with the balance, such as taking some money
    off the total when money is withdrawn or adding money to it when a deposit is
    received. To do that, change the variable''s value to a number that''s calculated
    from its current value. Here''s an example:


    ```

    balance = balance - 250

    ```


    This example takes the value of the balance variable, knocks 250 off, and then
    puts the answer back into the balance variable. You can display the value of a
    variable onscreen using the print() command with the variable name:


    ```

    print(balance)

    ```


    Programmers often use a shorthand form when they''re adding numbers to, or subtracting
    them from, a variable. The shorthand is += for addition and -= for subtraction.
    Here''s an example:


    ```

    balance = 500

    balance += 20

    print(balance)

    ```


    If you run this tiny program, or enter these instructions in the shell, Python
    prints 52 on the screen.


    Here''s another example:


    ```

    balance = 500

    balance -= 70

    print(balance)

    ```


    This program subtracts 70 from the initial balance of 500, so it shows 430 onscreen.
    This shorthand is an elegant and concise way to express the idea of changing a
    variable''s value, and you''ll see it used widely in Python.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Accepting user input


    Before we go any further, we should clarify one piece of jargon: function. A function
    is a set of commands that do a particular job, and lots of them are built in Python.
    You''ve already seen one of them: print()`. Later on, you''ll learn how to make
    your own, too. (See "Creating your functions," later in this chapter.) To use
    a function, enter its name, followed by parentheses. If you want to send any information
    to work with, you put that inside the parentheses, as you already have with print().


    When the program runs, we ask the user which multiplication table to generate
    and store that in a variable that we call tableum. To do that, we set up the tableum
    variable using a built-in function input(), which asks the user, waits for the
    user to enter something, and then puts whatever is entered into the variable.


    Here''s how the input() function works:


    | tableum = input("Which multiplication table shall I-generate for you?") |


    ![](img/df9a01bf057d58c2401b5edabd6e8829_231_0.png)


    We''ve inserted a space after the question mark and before the closing quotation
    mark, otherwise, the cursor would appear next to the question mark. Extra extra
    space separating the question and the user''s answer things look clear and more
    professional.


    Add the preceding line of code to your program and run it, and you''ll see that
    the program displays the question in the shell and displays a cursor and waits
    for you to enter a number. Enter any number to try it. The program doesn''t anything
    else yet, however, because you haven''t told it to do anything with the number
    you enter.


    # Printing words, variables, and numbers together


    It''s time to make your program do something with its user input. Start by having
    the program print a title for the multiplication table the user has requested.
    This requires something we haven''t discussed before: the capability to print
    text and variables on the same line of text. The print() function can be used
    to print more than one line in a, if they''re separated by commas, so you can
    combine text and the variable tableum, like this:


    ```

    print("\nHere is your", tableum, "times table:")

    ```'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'The first two characters here, \n, have a special meaning. They''re known as
    an escape sequence, and they''re used to start a new line. Here they create a
    bit of space between the question asking for input and the resulting heading.


    Any characters that appear between the quote marks are printed onscreen. If you
    put the variable name tableName between quotes, you''ll see the word tableenum
    instead of the name you used.


    You now need to print a line for each entry in the tables, from 1 to 12. As you
    know, you can use variables in sums, and when you print sums, you can display
    the table like this:


    ```

    print("1 times", tableName, "is", tableName)

    print("2 times", tableName, "is", tableName + 2)

    print("3 times", tableName, "is", tableName + 3)

    print("4 times", tableName, "is", tableName + 4)

    ```


    What happens when you run it? You might be surprised:


    | 7 times is 7 |

    | 2 times is 77 |

    | 3 times is 777 |

    | 4 times is 7777 |


    That''s not the result you were looking for! The problem is that the variable
    tableName is being treated as a string, or a group of letters and other characters,
    rather than a number. This is what happens by default with the input() function.
    The user could enter anything when prompted for a number, and the program would
    give a similar result — simply repeating whatever was entered. If you want to
    read it by your Raspberry Pi, try entering yeah.


    To fix that problem, you need to convert the user''s input, stored in tableName,
    into an integer, using the int function. If you could cast your mind back to mathematics
    lessons in school, you might remember integers are whole numbers, which have no
    decimal point. The int function can be used to convert numbers into integers,
    or to turn a string into an integer. Add the following line after the input()
    line:


    ```

    tableName = int(tableName)

    ```


    It works, as in Figure 11-3. But it''s not really a good solution. For each line
    of output, you''re adding a new line in the program and adding a new sum at the
    end of it. (Even using the Editor''s Copy and Paste commands (in the Edit menu),
    we ran out of patience at Line 4.) What if you want to create a times table that
    goes up to 50? Or 5,000? Clearly, you need a more scalable solution.'
  merge: -1
  img_proc: true
- pgno: 233
  md: "# Using for loops to repeat\n\nTo save you from the slog of entering all print\
    \ commands, and to make our program more flexible, you can use a for loop. This\
    \ enables you to repeat a section of program a set number of times, and to increase\
    \ a variable each time the code repeats. It's exactly what you need for the Times\
    \ Table program: You want to display one line for each number from 1 to 12, showing\
    \ the result of multiplying that number by the figure entered.\n\nHere's the code\
    \ that makes it happen:\n\n```\nfor i in range(1, 13):\n    print(i, \"times\"\
    , tabenum, \"is\", i * tabenum)\n```\n\nThis tiny snippet introduces several new\
    \ programming concepts. First, take a look at the range function. It's used to\
    \ create a sequence of numbers, and give it a number to start at (1) and the end\
    \ point (13). The end point is never included in the sequence, so we had to use\
    \ 13 to make the multiplication tables up to 12.\n\n![](img/df9a01bf057d58c2401b5edabd6e8829_233_0.png)"
  merge: -1
  img_proc: true
- pgno: 234
  md: "If you add a third number between the brackets (parentheses) of the range function,\
    \ it's used to specify the size of the gap between numbers. To show only the odd\
    \ numbers (starting at 1 and adding 2 each time the program repeats), you'd use\
    \ range(1, 13, 2). (You don't need to do that now, but you can experiment with\
    \ the ranges later.) The rest of the line containing the range() function sets\
    \ up the start of the bit to be repeated and says that the variable i should be\
    \ given the next value from the number sequence each time it repeats. The first\
    \ time, i has a value of 1, the first number in the sequence. The second time,\
    \ i has a value of 2, which is the second number in the sequence. This goes all\
    \ the way to the last repetition, when i has a value of 12.\n\nYou tell Python\
    \ which commands should be repeated by indenting them. The print() command we've\
    \ used four spaces in front of it, and in Python these spaces are meaningful.\
    \ Many languages let you space programs however you want, but in Python the spacing\
    \ is part of how the computer understands your intentions. By enforcing the indentations\
    \ like this, Python makes it easier to read programs you can see at a glance which\
    \ bits belong together. They're all at the same depth.\n\nYou can repeat multiple\
    \ commands by indenting them all:\n\n```\nfor i in range(1, 13):\n    print(i,\
    \ \"times\", tabenum, \"is\", i * tabenum)\n    print(\"-----------------\")\n\
    \    print(\"Hope you found that useful!\")\n```\n\nIf you can't get your loop\
    \ to work, make sure you've included the colon at the end of the line.\n\n![](img/df9a01bf057d58c2401b5edabd6e8829_234_0.png)\n\
    \nThe previous snippet works its through numbers 1 to 12 and prints the table\
    \ line for each one, followed by a line of dashes to space it out. When it has\
    \ finished all 12 lines, it prints Hope you found that useful! just once because\
    \ that command isn't indented with the others in the loop.\n\nPulling it all together,\
    \ the final program looks like:\n\n```\n# simple times table program\n\nprint(\"\
    This program calculates times tables\")\nprint(\"It is from Raspberry Pi For Dummies\"\
    )\n```\n\nCHAPTER 11 Writing Programs in Python 219"
