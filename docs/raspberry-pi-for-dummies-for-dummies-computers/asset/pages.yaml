  md: '# IN THIS CHAPTER

    >> Downloading and playing games

    >> Discovering educational software

    >> Using email, accounts systems, and other productivity tools


    # Chapter 19


    # Ten Great Software Packages for the Raspberry Pi


    One of the best things about the Raspberry Pi is that you can easily download
    so many software packages over the Internet and install them. In this chapter,
    we give you some pointers to ten software packages to get started, including a
    few you might have missed that are already on your Raspberry Pi.


    Before you start, issue the following command in the shell to make sure your software
    cache is up to date:


    ```

    sudo apt-get update

    ```


    The software you run on your computer is as much a matter of taste as the music
    you listen to, so we hope you use this list as a starting point and make your
    own software discoveries. For a full explanation of finding and installing software
    on your Raspberry Pi, see Chapters 4 and 5.'
  merge: -1
