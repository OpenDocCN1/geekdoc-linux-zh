    in the Sprite List.


    > Take care with the Scissors icon: In most packages, it means Cut, and you can
    use Paste to replace what you''ve removed. In Scratch, it means Delete, so you
    lose your sprite completely. If you delete a sprite accidentally, go straight
    to the Edit menu at the top of the Scratch window and use Undo to bring it back.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_199_1.png)


    Deleting a sprite is not the same as hiding it. If you hide it, it''s still part
    of your project, but it''s not visible. You can bring it back later by showing
    it. If you delete a sprite, its scripts, costumes, and sounds are removed from
