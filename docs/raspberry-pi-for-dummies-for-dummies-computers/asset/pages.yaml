- pgno: 330
  md: 'hot joint. The job of the flux when it is heated to clean the surface and make
    the solder flow. It does this by breaking down the surface tension on the molten
    solder. Without it, the solder would clump together in round globs held by the
    tight surface tension.


    Water has surface tension as well, and to reduce that we use soap, which allows
    the water to wet things. You can''t use soap with solder because it wouldn''t
    stand the heat, so you need something else. Most fluxes for heavy jobs are made
    from chemicals like hydrochloric acid, or phosphoric acid. These are too corrosive
    to be used with electronics, so what is normally used is some sort of rosin flux.
    Although you can get this in a pot, by far the best thing is use Multicore, where
    the flux is built into the solder wire as fine very thin strands. That the way,
    the right amount of flux is always delivered with whatever amount of solder you
    use.


    # COMPLYING WITH ENVIRONMENTAL REGULATIONS


    There is a further complication nowadays with the advent of the Reduction of Hazardous
    Substances (RoHS) Act, which bans the use of certain metals and plasticizers in
    certain classes of electrical equipment in the European Union, the most prominent
    of which is lead. In fact, some people think RoHS is entirely about being lead-free,
    but it''s not. You can get lead-free solders, but they are expensive because they
    have a large amount of silver in them and they are difficult to work with; they
    also tend to produce a product with a shorter lifetime. They require a hotter
    iron and are so potentially harmful to the components.


    Lead free solders also don''wet" as well, which means it''s harder to get the
    right molten you need in order to achieve the flux around the joint. Tin whiskers
    grow out of the joints, causing shorts years later. Home-built electronics are
    not required to be lead-free in the United States or Europe, and there is no measurable
    health effect in using solder that contains lead. RoHS is widely brought in to
    prevent accumulating in landfills from mass consumer electronics and potentially
    polluting the water supply. Although there is no evidence that this can happen,
    it is banned under the "precautionary principle." In Europe, you are under no
    legal or health requirements to use lead-free solder. However, if you are making
    stuff to sell in the European Union, you''re legally required to make sure it''s
    RoHS-compliant. This is like brewing beer at home: You can brew as much as you
    like, but you can''t sell any.


    It''s always sensible to wash your hands after soldering and avoiding putting
    in your mouth. The same goes for the soldering iron when it is on. Mike was responsible
    for this sort of compliance in one job he had, so he had to know the legislation
    and standards on these matters.'
