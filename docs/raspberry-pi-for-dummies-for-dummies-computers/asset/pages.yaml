  md: 'If you''re changing the number value in a block, you still need to click the
    block to run it.


    # Using grid coordinates to move and position your sprite


    The second way you can move and position your sprite is to use grid coordinates.
    That makes it easy to position your sprite at an exact place on the screen, irrespective
    of where it is now.


    Every point on the Stage has two coordinates: an X position (indicating where
    it is horizontally) and a Y position (indicating where it is vertically). The
    X positions are numbered from -240 at the far left to 240 at the far right. The
    Y positions are numbered from -180 at the edge of the Stage to 180 at the top
    edge. That means the Stage is a total of 480 units wide and 360 units tall. The
    center point of the screen, where your cat begins its day, is where X equals 0
    and Y equals 0. Figure 9-5 provides a quick visual reference of how the coordinates
    work.


    When you move the mouse over the Stage, the grid reference of mouse pointer is
    shown underneath the Stage on the right.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_185_0.png)


    | | (X:0, Y:180) |

    |---|---|

    | | 100 | |

    | (X:-240, Y:0) | (X:0, Y:0) | (X:240, Y:0) |

    | | -100 | 100 | X |

    | | -100 | |

    | | (X:0, Y:-180) |


    Motion blocks use the X and Y coordinates (see Figure 9-6):


    +   **Go to x y**: You can use this block to position your sprite at a specific
    point on the Stage. By default, it returns a sprite to the center of the screen
    (x=0, y=0). Edit the numbers for X and Y to position your sprite somewhere else.'
