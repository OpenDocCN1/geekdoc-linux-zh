  md: 'You can see that this listing is easy to read, but contains the most awful,
    turpis, repetitive code and is much longer than necessary. (This is typical of
    what a beginner might produce).


    Turgidity not in confined to the GPIO Zero library — you can write bad code like
    this with any library.


    You might wonder why it matters, as long as the code works. Well, if you can understand
    the concepts of doing it properly, you can apply them in situations where code
    will not work or is far too long. So even, before you begin to write any code,
    you need to know what LEDs to turn on and off to display each number. 16–12 shows
    the patterns we we use to represent the dice pattern. Note that the main choice
    is which pattern is diagonal to use for representing 3 and 2. We think it''s using
    the opposite diagonal for the numbers, but we have no preference for diagonal
    to use.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_357_0.png)


    | | LED 6 | LED 5 | LED 4 | LED 3 | LED 2 | LED 1 | Binary | Hex | Decimal |

    |---|---|---|---|---|---|---|---|---||

    | 1 | off | off | on | on | off | off | 001000 | 0x8 | 8 |

    | 2 | on | off | off | off | off | off | 100001 | 0xa1 | 65 |

    | 3 | off | on | off | off | off | off | 010010 | 0x2a | 42 |

    | 4 | on | on | off | off | off | on | 110011 | 0x63 | 99 |

    | 5 | on | off | on | on | off | on | 110011 | 0x6b | 107 |

    | 6 | on | on | on | off | off | off | 111011 | 0x77 | 119 |


    Given the physical arrangement of LEDs shown, each number needs to be displayed
    by having certain LEDs on and off. This pattern can be summarised as a sequence
    of os and ones is in the Binary pattern in Figure 16-12. Binary is a way of writing
    numbers that matches exactly how numbers are stored in the computer as a sequence
    of is and os. A single digit is called a bit. Wherever the LED is on, there''s
    a 1 in the binary pattern, and a 0 when it''s off. This pattern can define the
    LED pattern, functioning as a concise representation of the pattern you need.
    In a program, it''s easy to express this pattern as a pattern to a number in you
    — and it''s easy to read code. Hexadecimal is a number system that groups a byte,
    or 8 bits, into two 4–bit groups. Each of the two groups is then expressed as
    a single character — 0 to 9 and the letters A to F. This gives 16 different characters
    that represent the 16 different patterns of is and 0 you can get with four bits.
    This is shown in the Hex Pattern column of Figure 16-12, as far as the computer
    is concerned, if you start a number with 0x, it follows as a hexadecimal.


    342 PART 5 Exploring Electronics with the Raspberry Pi'
