  md: '# TABLE 18-1 Old McDonald''s Farm Sound Samples


    | Sample Name | Sung Words |

    | start | "Old McDonald had a farm ee eye ee eye oh" |

    | and | "and on this farm he had some" |

    | ee_eye_oh | "ee eye ee eye oh" |

    | witha | "with a" |

    | here | "here" |

    | anda | "and a" |

    | there | "there" |

    | herea | "here a" |

    | therea | "there a" |

    | everywhere | "everywhere a" |

    | well | "well" |

    | end | "Old McDonald had a farm ee eye-e-e, ee eye-e-e, o-o-o-h (and feel free
    to extend those few notes)" |


    Back in the farmSounds folder, you need two samples for each animal you use. For
    example, if you have a chicken, you need a sample of you singing the word chickens,
    called chicken, and then another sample of the animal that makes, having the name
    chickenSound. So in general there are two files "name" and "nameSound."


    It''s important that you use this exact naming scheme or the program will work.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_428_0.png)


    # Making the graphics


    You have lots of choices when it comes to how you want your farm to look. You
    can buy a packet of farm animal stickers and scan them in photograph them or use
    the stickers for the RFID cards. You can draw any animals or get some clip art
    from the Internet. However, we chose to go with photographs we have of the various
    farm inhabitants. For this demonstration, we chose a chicken, a cow, a sheep,
    a pig, and a dalek. (Yes, we know — it''s a boy thing).


    Each animal is isolated on a transparent background, just like we did for the
    clothes in the Dress Up Doll project. This time, we keep a full-resolution version
    for printing on the cards, and a scaled version for the screen. The scaled versions
    should be between 30 to 100 pixels high, depending on the relative size of the
    animal. These pictures should be stored in a folder called farmPictures and have
    exactly the same name as the song word in the farmSounds. So the chicken


