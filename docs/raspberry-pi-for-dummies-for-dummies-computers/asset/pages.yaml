- pgno: 379
  md: 'The DotStar requires two signals and uses the sequence of transitions for a
    system these signals to drive the data transfer process. This is ideal for system
    like the Raspberry Pi, because of Linux, there might be a longer-than-expected
    delay before the next line of code is executed. The APA102C LEDs are wired together
    in a chain, with the signals regenerated by each LED. The signals never "get tired,"
    or as we say in electronics, degrade.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_379_0.png)


    Each LED has a Data In and a Data Out line as a Clock In and Clock Out. The inputs
    of the first chip are all connected to the GPIO pins of the Raspberry Pi. Both
    types of LED work on the principle that an LED has received and stored its data,
    any data it receives is passed to the next LED. So, after the first set of data
    is sent to the first LED, there has to be sort of reset condition in order to
    regulate situations where new data is meant for the first LED and not just data
    for LEDs down the chain. The reset is done by passing the data stream for 5us
    (microseconds) on the WS2812b LEDs and sending a stream of start and end pulses
    in the case of the APA102C LEDs. (The wiring of the WS2812b is very similar to
    the wiring of the APA102C except that there''s only one data in and out.)


    Figure 17-6 shows the timing diagram for each LED — a picture of how logic signal
    will change to indicate one logic, logic zero or the end of a data set.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_379_1.png)


    364 PART 5 Exploring Electronics with the Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'For the WS2812b, in order for the single wire to write a Logic One to the LED,
    the signal makes a jump to a Logic One and stops for 3.5uS before jumping down
    to a Logic Zero for 0.9uS. For a Logic Zero, the signal jumps to a one for 0.9uS
    and then drops to 3.5uS. This repeats until all the data has been transferred
    to the LEDs. The end of the data transmission is signaled by a zero held for at
    50us. These times have to be +/- 0.15uS to ensure correct operation.


    The APA102C, on the other hand, has two signals, clock and data, which can go
    at any speed. The important point is that when the clock signal rises transitions
    from zero to a one, in other words — whatever level on the data input at that
    moment is treated as the logic input. Doing this requires special being about
    the timing; you have to put the GPIO pins at the correct levels in the right order.


    Programmers have a special name they use implementing a protocol like this — is
    bit-banging.(The technical term for this protocol is SPI, or Serial Peripheral
    Interface.) There''s some hardware on the processor chip to do this, but it requires
    a specific set of pins running in one of the alternative methods. The great thing
    about bit-banging is that you can use any pins. Let''s see how we can bit-bang
    this protocol on the GPIO bus.


    # Bit-banding the APA102C protocol


    The LEDs used in our example are connected together in a string, where one LED
    takes its input from the output of the previous one. The first LED in the string
    takes its data from the Pi. Each LED the string can be thought of as having a
    number or address. When we send out data, we send it to all the LEDs, but we need
    to change the data for those LEDs that we want to change. If the data for an individual
    LED is the same as last, it will not change. That way, we can change individual
    LEDs by changing the data for those LEDs we want to change and leaving the data
    for the others, as same as last time.


    The APA102C — in addition to the normal red, green, and blue PWM values, which
    controls the brightness — has another brightness-controlling number, which controls
    the current down the LED. This is the equivalent of changing the resistor value.
    Valid brightness-control numbers range from 0 to 31. Each LED needs data consisting
    of four numbers: brightness plus red, green, and blue values. Data needs to be
    stored in the computer in what is known as a buffer. In Python, we can implement
    this buffer as a list. We can then manipulate this list — change the numbers in
    it, in other words — to reflect what we want to see on each LED. When we''re good
    and ready, we fire out the whole buffer to the string of LEDs.


    CHAPTER 17 Lots of Multicolored LEDs 365'
  merge: -1
  img_proc: true
- pgno: 381
  md: "Let's look at what to put in this buffer. A complete data message has a header,\
    \ used to warn the LEDs that data is coming. That header contains 32 bits of zero,\
    \ which means the data GPIO pin needs to be set at zero and the clock GPIO pin\
    \ to be pulled up and down 32 times. The message data is pulled out of the list,\
    \ one number at a time. This is a 32-bit number—each bit in turn is placed on\
    \ the output pin and the clock signal is set to High. When all the LEDs have been\
    \ fed, another series of zeros, known as the footer, are sent. This needs to consist\
    \ of a number of pulses—at least 32 plus half the number of LEDs, to be precise.\
    \ The code in using it-2 is a fragment of code that would do this.\n\n# LISTING\
    \ 17-2: Bit-Banging the Data to the LED\n\n```\nio.output(da,io.LOW) # set data\
    \ pin low\nfor i in range(0,32): # send header\nio.output(ck, io.LOW) # pulse\
    \ the clock pin\nio.output(ck, io.HIGH)\nfor i in range(0,numLeds): # send data\n\
    d = ledArray[i] # get a single LED's worth of data\nfor j in range(0,32):\n  \
    \  io.output(ck, io.LOW)\n    if d & 0x8000000:\n        io.output(da, io.HIGH)\n\
    \    else:\n        io.output(da, io.LOW)\n    d = d << 1\n    io.output(ck, io.HIGH)\n\
    for i in range(0,33+(numLeds/2)): # send footer\nio.output(ck, io.LOW)\nio.output(ck,\
    \ io.HIGH)\n```\n\nNote that this is a fragment and not a complete program. Note\
    \ also that this code uses the shift operator (<<), which moves the data word,\
    \ or pattern, to the right so that the next byte to send is in the most significant\
    \ bit of the word. This is the same technique we show how to use in forming the\
    \ dice pattern in Chapter 16.\n\n# Creating a class\n\nThe bit-banging code is\
    \ so useful that it could be included in all programs where you want to use these\
    \ LEDs. However, in order to make it convenient to use, we can make this code\
    \ into a class that you don't have to keep including these lines in your programs.\
    \ This is just like the RPi.GPIO library, which is written as a class\n\n366 PART\
    \ 5 Exploring Electronics with the Raspberry Pi"
