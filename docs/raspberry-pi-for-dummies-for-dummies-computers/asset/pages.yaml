- pgno: 179
  md: '# Understanding What Programming Is


    Before we dip into Scratch, we should clear up some of the jargon surrounding
    it. A program is a repeatable set of instructions to make a computer something,
    such as a game. These instructions can be extremely complicated because they have
    to describe what the computer should do in detail. Even a simple bouncing-ball
    game requires instructions for drawing the ball, moving it in different directions,
    detecting when it hits something, and changing its direction to make it bounce.


    Programming is the art and science of creating programs. You can create programs
    in lots of different ways, and Scratch is just one of them. In Chapter 11, you
    read about Python, another one.


    Scratch and Python are both programming languages, different ways of writing for
    the computer. Different programming languages are best suited for different tasks.
    Scratch is ideal for making games, for example, but it''s not much use if you
    want to create a word processor. Using Python to create games takes longer, but
    it is more powerful than Scratch and gives you more flexibility in the type of
    things you can get the computer to do.


    # Working with Scratch


    There are two versions of Scratch installed in RaspberryPi:


    +   - Scratch: This is the original version of Scratch, widely known as Scratch
    1.4.

    - Scratch 2: This is an implementation of the newer version of Scratch, widely
    known as Scratch 2.0. If you use the online version of Scratch (at https://scratch.mit.edu),
    Scratch 2 is the version you are familiar with. Scratch 2 adds some features that
    are not available in the original Scratch, including the ability for sprites (which
    are roughly speaking, game characters) to create copies of them, and a feature
    to make your own blocks (instructions). Because Scratch 2 requires the Flash software
    to work, it only runs on the Raspberry Pi 2 and Raspberry Pi 3. Some programs,
    especially action games, run significantly slower in this version of Scratch,
    because of all the layers of software required to run Flash on the Raspberry Pi.
    Simple programs will run fine, but if you want to make games, you will soon notice
    a performance difference.


    164 PART 4 Programming the Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Both versions of Scratch have been enhanced with features for controlling electronics
    projects with your Raspberry PI, as you will see in Chapter 16.


    If you''re a newcomer to Scratch, we recommend you start by using the original
    Scratch, because your programs will run more quickly. If you''re already familiar
    with Scratch from the online version, or you''re building programs that could
    use the additional features of Scratch 2, you might prefer to choose that version
    instead.


    Because of the speed issues associated with Scratch 2, and the fact that it doesn''t
    run on the Model B+ or earlier PI models, we are going to use the original Scratch
    in our examples. We will, however, introduce you to both versions in this chapter
    so you can find your way around Scratch 2 as you build your projects.


    You can take files in Scratch and use them in Scratch 2, but you can''t take Scratch
    2 files and open them in Scratch.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_180_0.png)


    You access Scratch from the desktop environment.


    To start Scratch, select your version from the Applications menu in the top left
    of the screen. You can find Scratch and Scratch 2 in the Programming folder.


    # Understanding the Scratch screen layout


    Scratch divides the screen into four main areas, as you can see in Figures 9-1
    and 9-2. The Stage is where you can see your game or animation take shape. There''s
    a cat on it already, so you can get started away by making it do things, as you
    see in a minute. In Scratch, the Stage is in the top right, and in Scratch 2,
    it''s in the top left.


    Underneath the Stage is your Sprite List. You can think of sprites as the characters
    in your game. They''re images that you can make things, as you move or change
    their appearance. For now, there''s just the cat, which has the name Sprite in
    Scratch and Catti in Scratch 2.


    You create a program by snapping together blocks, which are short instructions.
    You find the blocks in the Blocks Palette, which is on the left in Scratch and
    in the middle of Scratch 2. In both cases, it displays the Motion blocks by default.
    They include instructions to move ten steps, rotate, go to a particular grid reference,
    and point in a particular direction.


    The Scripts Area is where the magic happens! You assemble your program in this
    space by dragging blocks into from the Blocks Palette. The Scripts Area is'
  merge: -1
