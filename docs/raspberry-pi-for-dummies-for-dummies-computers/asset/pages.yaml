    # Using a Mac


    The Mac version of SD Card Formatter downloads as an installation package. Double-click
    this package to install the software. The software installs by default to the
    Applications folder. **Note:** You will need to enter your Mac''s password to
    do this, and every time you run this utility.


    Insert the SD or MicroSD card into your Mac''s slot, or into a card reader connected
    to your Mac, and double-click the SD Card Formatter icon in the Applications folder.
    When the software opens, the main screen looks like Figure 2-2.


    Make sure the Select Card drop–down menu shows the SD or MicroSD card you want
    to use. This is the drive that will be wiped, so check this as you need for you
    to be certain. If the right card isn''t shown, use the drop-down menu to choose
    the right one.


    Next, click the Overwrite Format option to select it. Click the Format button,
    and SD Card Formatter starts to format the card. Note that there is no need to
