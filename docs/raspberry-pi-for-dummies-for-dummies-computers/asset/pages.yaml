- pgno: 460
  md: '# IN THIS CHAPTER

    >> Troubleshooting and fixing common problems

    >> Adjusting the settings on your Raspberry Pi

    >> Fixing audio problems

    >> Mounting external storage devices in the Linux shell

    >> Fixing software installation issues

    >> Troubleshooting your connection

    >> Connecting using SSH


    # Appendix A


    # Troubleshooting and Configuring the Raspberry Pi


    Many people find that they can just connect up their Raspberry Pi, and everything
    works the first time. Fingers crossed that this will apply to you!


    Sometimes people experience problems, however, or want to make more advanced changes
    to their computer''s settings (also known as configuring it).


    In this appendix, we show you how to resolve some complaints and how to change
    some of the settings. Hopefully, you won''t need to consult this appendix-d much,
    but it might prove valuable if you experience undesirable behavior when you set
    up the Pi or if you have an unusual setup.'
  merge: -1
  img_proc: true
- pgno: 461
  md: 'Whatever you''re doing on the Raspberry Pi (or any computer, come to that),
    save your work regularly. If it crashes, you''ll be able to pick things up from
    your last saved version, which will hopefully prevent you from losing too much
    work.


    # Troubleshooting the Raspberry Pi


    When Sean first started using his Raspberry Pi, he couldn''t connect to the Internet
    in the desktop environment, although it was working fine in the Linux command
    line. The problem, it turned out, was an incompatible keyboard. Something he would
    never normally have suspected from the symptom he was seeing. For that reason,
    I recommend you work your way through however unlikely it might seem that these
    steps will fix things. Humor us, and you might be pleasantly surprised!


    These steps are listed in a rough order of priority, with the quickest tests and
    simplest solutions first. You can try any of these solutions at any time, but
    if you prefer this order (more or less), you can minimize expense and hassle.


    +   1. **Be patient.**

    With the huge increase in performance over the years, this is like an issue when
    it was the Raspberry Pi first out, but it''s worth saying nonetheless: When your
    Raspberry Pi is busy, it can appear to be unresponsive, so you might think it''s
    crashed. If you wait, it recovers when it finishes its tasks. If it''s not doing
    anything you particularly care about, you can always just restart the machine,
    but that loses any data in memory, and it''s not a good idea to reset operations
    when installing software (if you can avoid it), because it leaves them half-finished.
    Note that the Raspberry Pi has a screensaver built, so you can recover the Pi
    from a blank screen by wiggling the mouse (when in the desktop environment) or
    pressing any key (in the command line). You can use the Shift key so that nothing
    appears onscreen.


    +   2. **Restart your Raspberry Pi.**

    Very occasionally, the machine has crashed in a way that we haven''t been able
    to replicate, a simple reset can sometimes do the trick. To reset, remove the
    power, pause a moment, and then reconnect it.


    +   3. **Check your connections.**

    Switch off your Raspberry Pi and make sure that its cables are firmly fixed in
    the right sockets. Start with the source of the problem: For example, if the screen
    is blank, check the video cable; if the keyboard is unresponsive, check its connection.
    Chapter 3 is a guide to setting up your Raspberry Pi, including its peripherals
    and cables.


    446 Raspberry Pi For Dummies'
  merge: -1
  img_proc: true
- pgno: 462
  md: '+   4. Ensure your MicroSD or SD card is inserted correctly.


    If your Raspberry Pi’s red PWR light comes on but the green OK light does not
    flicker or light, the Raspberry Pi is having difficulty using the SD or MicroSD
    card. In the first instance, check to see if the card is correctly inserted. (Chapter
    3.)


    +   5. Try a new SD or MicroSD card.


    If the red light comes on the green one won''t, try a new card. We''ve occasionally
    had problems with SD cards or MicroSD cards, and with adapters that convert a
    MicroSD card to fit an SD card slot. You can find a list of SD cards that have
    been reported compatible with the Raspberry Pi at http://elinux.org/RP1_SD_cards.


    +   6. Disconnect peripherals.


    Try disconnecting the USB hub, keyboard, and mouse and then restart. Obviously,
    this won''t help if the problem you''re experiencing requires input devices to
    replicate it, but it can help to identify any device incompatibilities that might
    stop the Pi from starting up correctly. If you need to use a keyboard to test
    whether the problem reoccurs, connecting directly to the Raspberry Pi. You could
    disconnecting it after you''ve entered the password or whatever programs you need
    to test. If the Pi works without anything connected, the process of elimination
    (connecting devices one at a time and restarting) to identify which is causing
    problems.


    +   7. Try new peripherals.


    If possible, try a new keyboard, mouse, and USB hub, ideally from the list of
    devices at http://elinux.org/RP1_VerifiedPeripherals that are known to work. Many
    of the problems people experience are the result of using incompatible devices
    with the Raspberry Pi, so replacing the keyboard, mouse, and USB hub can resolve
    a wide range of apparently different problems (including the strange experience
    Sean had with his internet connection, mentioned earlier). The previous step can
    help you to identify which peripherals might be causing problems.


    +   8. Try new cables.


    Especially if you''re having problems with the network connection and audio or
    visual output, try new cables to rule out faulty cables as the cause of the problem.


    +   9. Try a new screen.


    If you can''t see anything on the screen but the Raspberry Pi appears to be powering
    up (the red light comes on and the green light flickers), connecting to a different
    monitor or TV. See Chapter 3 for advice on this.'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# 10. Update your software.


    Assuming your Internet connection is working, you can update the operating system
    and other software on your Raspberry Pi (without overwriting any of your work
    files) using this Linux command (Chapter 5):


    ```

    sudo apt-get update && sudo apt-get upgrade

    ```


    # 11. Try a new power supply.


    We''ve put this near the end of our steps list because it''s probably hardest
    to do, although dodgy power has been reported to cause a wide range of different
    problems. If you have a friend with a Raspberry Pi and hers works fine, try using
    her power supply to see whether it fixes the issues you''re seeing on yours. Alternatively,
    you might need to buy a new power supply. If you''ve upgraded your Pi but not
    more power than earlier models, you might experience problems. In the PIXEL desktop,
    a lightning bolt in the top right of the screen means the Pi is underpowered and
    a thermometer means it is over temperature. See Chapter 1 for advice on buying
    a power supply.


    # 12. Check online for a solution.


    It''s not possible to cover every event, so if you''re experiencing difficulties,
    check the rest of this appendix and then search the troubleshooting guide at linux.org/R-Pi_Troubleshooting,
    search the forums at www.raspberrypi.org, or search the web with Google or DuckDuckGo
    (www.duckduckgo.com) for a solution. You''re highly likely to find that someone
    has already overcome any difficulties you encounter.


    # Adjusting the Settings on Your Raspberry Pi


    The settings that your Raspberry Pi uses are stored in files on the MicroSD or
    SD card, and many of them are in a file called config.txt that''s in the /boot
    directory. You can edit this file directly to change your computer''s settings
    using a simple text editor Nano which is preinstalled on your Raspberry Pi.


    You might not need to adjust the settings manually. Try using the PIXEL desktop
    (Chapter 3) or running the Raspi-config program, which gives you a menu for changing
    some of the most frequently used options, including some that are not included
    in the desktop tool. You can run the program at any time using the following command
    in the shell:


    ![](img/df9a01bf057d58c2401b5edabd6e8829_463_0.png)


    ```

    sudo raspi-config

    ```'
  merge: -1
  img_proc: true
- pgno: 464
  md: '# Raspi-config can help with


    +   - **Keyboard configuration:** Under Internationalisation Options, you can
    select your keyboard type. You can also use the Localisation options in the Raspberry
    Pi Configuration tool, as described in Chapter 3.


    +   - **Camera problems:** Ensure the camera is enabled in Raspi-config. You can
    also enable the camera from the Interfaces section of the Raspberry Pi Configuration
    tool. (See Chapter 3. )


    +   - **Audio problems:** In Advanced Options, you can force the audio to use
    the headphone jack or HDMI output.


    +   - **Missing space on the card:** If you created your card by *imaging*, a
    different process to NOOBs involves copying a snapshot of the software to the
    card, you might need to expand the file system to use all the space available.
    Under Advanced Options, choose Expand Files.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_464_0.png)


    REMEMBER

    The shell is covered in Chapter 5, but in brief, it is the way of giving instructions
    to your Raspberry Pi. You can open the shell by clicking the Terminal icon at
    the top of the screen in the desktop environment.


    Raspi-config and the Raspberry Pi Configuration tool can make changes for you
    without having to edit any configuration files, so it''s more convenient than
    editing `config.txt yourself, and there is less risk of error too. If the option
    isn''t configured on the Raspi-config menu, you need to edit the configuration
    file manually.


    Before you start tampering with the `config.txt file, make sure you''ve backed
    up any important data on your Raspberry Pi. (See "Mounting External Storage Devices"
    in this appendix and the section about backing up your data in Chapter 4.) There
    is a risk that you could, for example, render the screen display unreachable,
    which would make it difficult to use the Raspberry Pi to access your files.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_464_1.png)


    WARNING


    # Using Nano to edit config.txt


    To open the `config.txt` file in the Nano editor, enter the following command
    in the shell, all in lowercase:


    ```

    sudo nano /boot/config.txt

    ```


    The Nano text editor, with `config.txt` open, looks like Figure A-1.'
