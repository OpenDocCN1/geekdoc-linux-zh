    # # Copying NOOBS to the SD or MicroSD card


    You should have a formatted SD or MicroSD card and the .zip file for NOOBS that
    you downloaded from the Raspberry Pi website. To install NOOBS on the SD or MicroSD
    card, you simply copy the files inside the .zip file to the card.


    On a Windows PC, double-click the NOOBS .zip file to open it, select all the files
    in it, and then copy them to the formatted SD card. You can do this by using Ctrl+A
    to select the files and Ctrl+C to copy them, navigating to the SD card, and then
    using Ctrl+V to paste them.


    On a Mac, double-click the NOOBS .zip file and you will see a folder containing
    all the files you need. From the Edit menu, choose Select All and drag all the
    files onto the SD card on the desktop. It takes about 15 minutes to copy everything
    across. When it''s finished, edit the SD card by dragging it into the trash, which
    has now transformed into an Eject icon.


    On Linux, you can use the desktop environment (where available) to copy the NOOBS
    files to the SD card. In Ubuntu, you can simply go to the NOOBS .zip file, double-click
    to open it, select all the files in it, and drag them to the SD card to copy them
    across.


    Alternatively, you can follow these steps to unzip and copy the files using the
    Linux command line:


    +   1. Remove and insert the card so that it mounts automatically.


    +   2. Open a terminal window.


    You can do this using Dash Home in Ubuntu, the applications menu in your distribution,
    or a keyboard shortcut (Ctrl+Alt+T in Ubuntu).'
