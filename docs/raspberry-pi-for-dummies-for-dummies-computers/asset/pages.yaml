- pgno: 65
  md: 'When the software has finished installing your operating system (patient!),
    you see a message telling you that it''s been successful. If you installed just
    one operating system, your Raspberry Pi starts that operating system.


    If you installed more than one operating system, you''re given the option of which
    one you want to start (or boot). Double-click to choose it. Each time you start
    up your Raspberry Pi, you''re given a choice of operating systems. If you don''t
    choose something, it boots into your previous choice.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_65_0.png)


    To install or reinstall an operating system using NOOBS, you can hold the Shift
    key when you start up your Raspberry Pi. Remember that installing or reinstalling
    operating systems deletes all files on your SD or microSD card.


    # # Logging In


    When you switch on your Raspberry Pi, you might be asked for a username and password,
    depending on which operating system version you use. The default username and
    password differ depending on which version of Linux you''re using, but for the
    Raspbian distribution, the username is pi and the password is raspberry. Both
    of these are case-sensitive, so you can''t type in PI, for example. When using
    the shell, you receive no feedback on the screen as you enter the password. It
    not only hides your password but also doesn''t show you that a key press happened,
    which is a bit unsettling the first time. Press on regardless, and you should
    find your login details are accepted.


    After logging in, you may be shown the command-line prompt followed by a blinking
    line:


    ```

    pi@raspberry ~ $

    ```


    This means your Raspberry Pi is ready for you to use and you can enter Linux commands
    now, to manage your files and programs. (For information about using the command
    line to give your Pi instructions, see Chapter 5.)


    # # Configuring Your Raspberry Pi in Raspbian


    For most of the rest of this book, we assume that you''re using Raspbian with
    the PIXEL desktop. It''s the most user-friendly option and the best way to get
    started with the Pi.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'When the Pi has finished booting, you should be in the desktop environment.
    You''ll learn more about this topic in Chapter 4, but for now, let''s take a look
    at how you use it to finish setting up your Pi.


    Click the button in the top left, the Raspberry Pi logo on it, to open the menu.
    Move down to Preferences and choose Raspberry Pi Configuration. The tool that
    opens is shown in Figure 3-13.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_66_0.png)


    Figure 3-13: The Raspberry Pi Configuration tool in the PIXEL desktop.


    By default, the tool opens to its System tab. The options here include


    +   >> Change the password. The default password for the username pi is raspberry.

    >> Change the hostname (which is used for the Raspberry Pi on the network).

    >> Control whether it boots into the desktop or the command line interface (CLI),
    explained in Chapter 5.

    >> Set whether the pi user is automatically logged in.

    >> Set the pi to wait for the network at the start.

    >> Display the firstly splash screen that shows when the Pi is booting.

    >> Configure the screen resolution.

    >> Enable or disable underscan. Underscan and overscan change the size of the
    displayed screen image to optimally fill the screen. Underscan should be disabled
    to fill the screen if you see a black border around your screen, and enabled if
    the desktop does not fit on the screen.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'The tool''s Interfaces tab enable you to enable or disable various connection
    options on your Raspberry Pi. This is where you enable the Raspberry Pi camera.
    Other options include SSH (short for Secure Shell), which is a way of setting
    up a secure connection between computers, usually so that you can control one
    from another computer (For more on SSH, see Appendix A). The RealVNC software
    enables remote access to your Raspberry Pi with a graphical interface and is also
    enabled here. Other interfaces are SPI, I2C, Serial, 1-Wire, and Remote GPIO (which
    enables another machine on the network to access the Raspberry Pi''s GPIO pins).
    In most cases, you only need to change these settings if you''re using a particular
    add-on or working on a project that requires them.


    The tool''s Performance tab gives you options for overclocking and changing the
    GPU memory.


    So, what is overclocking, anyway? It''s when you make a computer faster than the
    manufacturer recommends, by changing some of its settings. The settings offered
    to you within this tool have been chosen by the Raspberry Pi Foundation, and they
    have previously said they don''t expect overclocking to cause any measurable reduction
    in your Pi''s lifetime. The speed of the CPU is measured in MHz, and the highest
    overclocking setting increases the speed to 1000 MHz. You won''t necessarily be
    able to use the top setting: It depends on your Pi and power supply. Overclocking
    is not currently supported on the Raspberry Pi 3.


    As changing the GPU memory, here''s the lowdown on that particular: Your Raspberry
    Pi''s memory is shared between the central processing unit (CPU) and the graphics
    processing unit (GPU). These processors work together to run the programs on your
    Raspberry Pi, but some programs are more demanding of the CPU, and rely more heavily
    on the GPU. If you plan to do lots of graphics-intensive work, including playing
    videos and 3D games, you can improve your Raspberry Pi''s performance by giving
    more of the memory to the GPU. You may also be able to improve performance by
    stealing some memory from the GPU and handing over to the CPU. Raspberry allocates
    64MB to the graphics processor and gives the rest to the CPU. In most cases, this
    setting will work fine, but if you experience problems, you can change how the
    memory is shared between the two processors. The configuration menu shows how
    much memory you want to give to the GPU and fills the entry box with the current
    value as a guide. The rest of the memory is allocated to the CPU. You can safely
    experiment with the memory split to see which works best for the kind of applications
    you like to.


    The options on the tool''s Localisation tab enable you to set the character set
    in your language (locale), your time zone, the keyboard setup you want to use,
    and your Wi-Fi country. If you''re using the Raspberry Pi outside its home country


    PART 1 Setting Up Your Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Configuring Your Wi-Fi


    To set up your Wi-Fi, click the fan-shaped icon in the top right, shown in Figure
    3-14. It opens a menu that shows you the available networks, together with an
    option to turn off Wi-Fi.


    Figure 3-14: The Wi-Fi and Bluetooth buttons.


    | Bluetooth | Wi-Fi |

    |---|---|

    | | 17% 12:09 |


    Click a network to select it and you''re prompted to enter the Pre Shared Key,
    which is the Wi-Fi password. If the connection fails or drops, the Wi-Fi icon
    changes to an icon with two red crosses on it.


    You can test your connection is working by opening the web browser and visiting
    a web page with it. (See Chapter 4.)


    After you''ve set up a Wi-Fi network using the tool, the Raspberry Pi remembers
    it, so it automatically reconnects when you restart your Raspberry Pi or reconnect
    previously turning off Wi-Fi. You can also use the network connection you have
    set from the command line.


    When you connect to a new network, the Pi doesn''t remember the previous network''s
    password, so you will need to reenter it if you want to connect to it later.'
  merge: -1
