- pgno: 16
  md: '# Introduction


    The Raspberry Pi is at the forefront of the maker movement, where people make
    their own inventions using a mixture of traditional craft skills and modern coding
    and electronics knowledge. It''s also given more and more access to a computer
    that provides a gateway into programming, electronics, and the world of Linux
    — the technically powerful (and free) rival to Windows and Mac OS. As a supercomputer,
    the Raspberry Pi is also being pressed into service in media centers and as a
    family computer for games, music, photo editing, and word processing.


    Although the Raspberry Pi presents new opportunities to everyone, a daunting prospect.
    It comes as a bare circuit board, to do anything with it, you need to add an operating
    system on an SD or microSD card and connect it to a screen, mouse, and keyboard.
    By get started, you will learn a few basics of Linux, or at least get acquainted
    with PIXEL, the graphical desktop. You might be a geek who relearning new technologies,
    or someone who wants a new family computer to use with the children. In either
    case, Raspberry Pi For Dummies, 3rd Edition, helps you get started with your Raspberry
    Pi and teaches you about the many fun and inspiring things you can do with it.


    # About This Book


    Raspberry Pi For Dummies, 3rd Edition, provides a concise and clear introduction
    to the terminology, technology, and techniques that you need to get the most from
    your Pi. With this book as your guide, you''ll learn how to


    +   - Connect your Raspberry Pi.

    - Change its settings so that it works optimally for you.

    - Discover and install great free software you can use on your Raspberry Pi.

    - Use the desktop environment to run programs, manage files, surf the web, and
    view photos.

    - Use the Linux command line to manage your Raspberry Pi and its files.

    - Use the Raspberry Pi as a productivity tool.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '+   Edit photos.


    +   Play music and video.


    +   Create animations and arcade games with the child-friendly Scratch language.


    +   Write your own games and other programs using the Python programming language.


    +   Compose music by programming with Sonic Pi.


    +   Get started with electronics, from an introduction to soldering to the design
    and creation of electronic projects controlled by the Raspberry Pi.


    Incidentally, within this book, you may note that some addresses break across
    two lines of text. If you''re reading this book in print and want to visit one
    of these web pages, simply keep the key in the web address exactly as it''s noted
    in the text, pretending as though the line break doesn''t exist. If you''re reading
    this as an ebook, you''ve got it easy—just click or tap the web address to be
    taken directly to the web page.


    # # Why You Need This Book


    After you shake the Raspberry Pi out of the little electrostatic bag it comes
    in, next?


    This book answers that question. It enables you to get your Raspberry Pi up and
    running and also introduces you to some of the great things you can do with, through
    satisfying practical projects. With this book as your companion, you can write
    games and other programs and create your own electronic gadgets, all with no prior
    prioritizing knowledge.


    The Raspberry Pi is most likely a bit different compared to other computers you''ve
    used, so this book also helps you to do some of the things on your Pi that you
    expect of every computer, such as play music and edit documents.


    You can learn a lot of this through trial and error, of course, but that can be
    a frustrating way to spend your time. Using this book as a reference, you can
    more quickly start using your Raspberry Pi, whatever you plan to do with it.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # Foolish Assumptions


    Raspberry Pi For Dummies, 3rd Edition, is written for beginners, by which we mean
    people who have never used a similar computer. However, we do have to make a few
    assumptions in writing this book, because we wouldn''t have enough space for all
    its cool projects if we had to start by explaining what a mouse is! Here our assumptions:


    +   **You are familiar with other computers, such as Windows or Apple computers.**
    In particular, we assume you''re familiar with using windows, icons, and the keyboard
    and mouse, and that you know the basics of using your computer for things like
    browsing the Internet, writing letters, or copying files.


    +   **The Raspberry Pi is not your only computer.** At times, you''ll need to
    access to another computer — for example, to create an SD or microSD card for
    the Pi (See Chapter 2.) When it comes to networking, we assume you already have
    a router set up with an Internet connection and a spare port that you can plug
    the Raspberry Pi into.


    +   **The Raspberry Pi is your first Linux-computer.** If you''re a Linux ninja,
    this book gives you a solid reference on the Raspberry Pi and the version of Linux
    it uses, but no prior Linux knowledge is required.


    +   **You share our excitement.** The Raspberry Pi can open up a world of possibilities
    to you!


    Other than these assumptions, we hope this book is approachable for everyone.
    The Raspberry Pi is being adopted in classrooms and youth groups, and this book
    is a useful resource for teachers and students. The Raspberry Pi is also finding
    its way into many homes, where people of all ages (from children to adults) are
    using it for education and entertainment.


    # # Icons Used in This Book


    If you read other *For Dummies* books, you know that they use icons in the margin
    to call attention to particularly important or useful ideas in the text. In this
    book, we use four icons:


    The Tip icon highlights expert shortcuts or simple ideas that can make life easier
    for you.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_18_0.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Argably, the whole book talks about technical stuff, but this icon highlights
    something that''s particularly technical. We''ve tried to avoid unnecessary jargon
    and complexity, but some background information can give you a better understanding
    of what you''re doing, and sometimes we need to get quite techy, given the sophistication
    of the projects you''re doing. Paragraphs highlighted with this icon might be
    worth rereading, to make sure you understand, or you might decide that you don''t
    need to know much detail.


    Although we''d like to think that reading this book is an unforgettable experience,
    we''ve highlighted some points that you might want to particularly commit to memory.
    They''re either important takeaways, or they''re fundamental to the project you''re
    working on.


    As you would on the road, slow down when you see a Warning icon. It-lights an
    area where things could go wrong.


    # Beyond the Book


    In addition to what you''re reading right now, this book comes with a free-anywhere
    Cheat Sheet with tips on installing software and using Scratch. To get this Cheat
    Sheet, simply go to www.dummies.com and type Raspberry Pi Dummies Cheat Sheet
    in the Search box.


    Also be sure to check out this book''s companion website (www.dummies.com/extras/raspberrypi3e),
    where you can download the code listings that appear throughout this book, as
    well as two appendices (one on The Raspberry Pi and one on the RIS OS) as well
    as a bonus on Mathematica, a mathematical program.


    Both of us maintain our own personal websites, which contain some-tional information
    on the Raspberry Pi. Mike''s is at www.thebox.myzen.co.uk/Raspberry/Punnet.html,
    and Sean''s is at www.sean.co.uk.


    # Where to Go from Here


    It''s up to you how you read this book. It''s organized to take you on a journey
    from acquiring and setting up your Raspberry Pi to learn the software that comes
    with it, and from writing your own programs to finally creating your own


    4 Raspberry Pi For Dummies'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'electronics projects. Some chapters build on knowledge gained in earlier chapters,
    especially the sections on Scratch and Python — and all of Part 5.


    We understand, though, that some projects or topics might interest you more than
    others, and you might need help in some areas right now. When a chapter assumes
    knowledge from elsewhere, we include cross-references to help you quickly find
    what you might have missed. We also include some signposts to future chapters,
    so you can skp ahead to a later chapter if it provides the quickest answer for
    you.


    If you haven''t set up your Pi yet, start with Part 1. If you have your Pi up
    and running, Part 2 shows you how to use the software on it. Part 3 covers productivity,
    creativity, and entertainment software. To flex your programming muscles, perhaps
    for the first time, read Part 4. You can learn Scratch, Python, or Sonic here,
    and feel free to start with any one of those languages. The Python chapters provide
    a good foundation for Part 5, where you can start building your own electronics
    projects.'
  merge: -1
