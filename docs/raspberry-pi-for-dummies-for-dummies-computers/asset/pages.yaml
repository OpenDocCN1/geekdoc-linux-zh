    PIXEL supports some keyboard shortcuts that might be familiar to you from Microsoft
    Windows. You can use Ctrl-A to select all files and folders, Ctrl-C to copy, Ctrl+V
    to paste and Ctrl-X to cut selected files and folders in PIXEL. It''s worth mentioning,
    however, that Ctrl-C is used to cancel an operation on the Linux command line
    (see Chapter 5) and in Python (see Chapter 11), the Copy shortcut is not universal
    on Raspberry Pi the way it is in Windows.


    If you''re selecting almost all the files, it''s pretty easy to select Ctrl+A
    and then hold down the Ctrl key and click to deselect the files you don''t want.
    There''s also an option on the Edit menu to invert your selection (also available
    with Ctrl+I), so can select the files you don''t want and then use this option
    to flip your choice so that everything is selected instead.


