  md: 'This hit from 1994 was officially released as freeware in 2003 and is now available
    for you to install on your Raspberry Pi. Search for steel sky on the Add/ Remove
    Software menu, in the shell, enter:


    ```

    sudo apt-get install beneath-a-steel-sky

    ```


    It installs into the Games category of your Applications menu.


    # Sense HAT Emulator


    The Sense HAT is an official Raspberry Pi product, originally designed to run
    educational experiments on the International Space Station. Like all HATs (short
    for hardware attached on top), it plugs into the GPIO pins of your Raspberry Pi.
    The Sense HAT includes an 8-8 grid of multicolored LEDs, a five-button joystick,
    and a range of sensors for temperature, pressure, humidity, and orientation. You
    can develop programs for it using Python.


    You can try out the Sense HAT using the emulator (shown in Figure 19-6), which
    is included in the Raspian operating system. On the PIXEL desktop, you''ll find
    it in the Programming section of the Applications menu.


    The emulator enables you to simulate the input and output of the Sense HAT so
    that you can test how your programs work. It has a number of sample programs to
    get started to, which you can find by clicking the File menu.


    When you''ve made something you like, you can take it into the real world by buying
    a Sense HAT (which costs $40, or £30).


    ![](img/df9a01bf057d58c2401b5edabd6e8829_450_0.png)


    Figure 19-6: The Sense HAT emulator.


    CHAPTER 19 Ten Great Software Packages for the Raspberry Pi 435'
