- pgno: 227
  md: 'An operator might not have come across before is modulo: It uses the % sign
    and tells you the remainder after a division. Here are some examples:


    ```

    >>> print(10 % 3)

    1

    >>> print(10 % 2)

    0

    ```


    You can use the modulo operator to tell whether one number is divisible by another
    (the modulo is 0, if so).


    These sums are quite basic, but you can enter more advanced sums by stringing
    together numbers and operators. In algebra, you use parentheses to surround the
    bits of the sum that belongs together and should be carried out. You still need
    to put parentheses around the whole sum for the print() command. For example:


    ```

    >>> print((10/3))

    6.666666666666667

    >>> print(10 / (3*2))

    1.6666666666666667

    ```


    ![](img/df9a01bf057d58c2401b5edabd6e8829_227_0.png)


    You can also do mathematics in the shell by entering the sums without a print()
    command, but it''s essential to use the command when you''re creating programs,
    as you see shortly.


    The spaces we''ve used around the mathematical operators are optional. They help
    with readability, and in that last example, help to show which parts of the sum
    belong together.


    # # Creating the Times Tables Program


    In this section, we show how to make a program that generates multiplication tables.
    For example, if the user requests a multiplication table for the number 7, the
    program outputs the sequence 7, 14, 21, and so on. The program is only a few lines
    long, but it teaches you how to create programs, using variables to ask the user
    for information, and create loops — sections of program that repeat. You build
    on your understanding of the print() command to do all this, and if you''ve read
    Chapters 9 and 10 (on Scratch), some of the ideas should be familiar to you.


    214 PART 4 Programming the Raspberry Pi'
  merge: -1
