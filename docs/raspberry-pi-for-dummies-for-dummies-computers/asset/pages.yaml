    # Opening a folder in the terminal


    Linux has a rigorous permissions structure that governs who can access all files
    and whether they have permission to modify them or run them. It''s a good thing,
    because it means it''s relatively difficult for you to do any harm to your Raspberry
    Pi''s operating system accidentally. You''re free to use File Manager to explore
    all the files your operating system uses, but if you try to delete an essential
    file, you''ll be told you have no permission, as shown in Figure 4-8.


    If you want to explore your system, go to your pi folder, click the Up a Level
    twice (refer to Figure 4-4), and then take a look in the folders there. Chapter
    5 covers some of these folders in more depth.


    The Tools has an option to open the current folder in the terminal. This enables
    you to use Linux commands (see Chapter 5) to make changes to the folder. Often,
    this is the quickest way to accomplish something, especially after you''ve mastered
    the finer points of Linux. While you''re using File Manager, you can also use
    the keyboard shortcut F4, to access the terminal.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_88_0.png)


