    # # Understanding the Long Listing Format and Permissions


    The most useful ls options is long format, which provides additional information
    on a file, compared to a standard listing. You trigger it using the option -l
    (the letter l) after the `ls` command, like this:


    ```

    @raspberry ~ $ ls -l

    total 152

    -rw-r--r 1 pi pi 256 Oct 28 13:53 booknotes.txt

    drwx-xr-x 2 pi pi 4096 Oct 28 22:54 Desktop

    drwx-xr-x 5 pi pi 4096 Oct 28 22:35 Documents

    drwx-xr-x 2 pi pi 4096 Oct 28 22:54 Downloads

    drwx-xr-x 2 pi pi 4096 Oct 28 22:54 Music

    drwx-xr-x 2 pi pi 4096 Oct 28 22:54 Pictures

    drwx-xr-x 2 pi pi 4096 Oct 28 22:54 Public

    drwx-xr-x 2 pi pi 4096 Nov 17 22:35 python_games

    drwx-xr-x 2 pi pi 4096 Nov 3 17:43 seanwork

    -rw-r--r-- 1 pi pi 20855 Nov 12 2010 spacegame.sb

    drwx-xr-x 2 pi pi 4096 Oct 28 22:54 Templates

    drwx-xr-x 2 pi pi 4096 Oct 28 22:54 Videos

    ```


    This listing includes some of Sean''s work files on the Raspberry PI (book.txt,
    spacegame.sb, and the directory seanwork), which we can use to show how different
    files are described.


    This layout might look a bit eccentric, but it is easier to follow if you read
    it from right to left. Each line relates to one file or directory, with its name
    on the right and the time and date it was last modified to that. For older files,
    the year appears in place of the modification time, as you can see for spacegame.sb
    in the preceding list.'
