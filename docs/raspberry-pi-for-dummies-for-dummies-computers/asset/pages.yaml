- pgno: 465
  md: '![](img/df9a01bf057d58c2401b5edabd6e8829_465_0.png)


    # FIGURE A-1:


    The Nano text editor with the config.txt file open.


    Use the cursor keys to move around the document. At the bottom of the window is
    a menu explaining Nano''s controls, where the upward arrow represents the Control
    key. The shortcuts here are different from what you might be used to, but the
    main ones you should know about


    +   **Ctrl+W:** Search for a word or phrase. This option (short for Where Is?)
    enables you to jump straight to the configuration option you want to edit.

    **Ctrl+V:** Next page.

    **Ctrl+K:** Cut the current row of text.

    **Ctrl+U:** Uncut text, which means paste the text you previously cut at your
    cursor''s location.

    **Ctrl+G:** Get help, which provides more detailed instructions.

    **Ctrl+O:** Write out, or save, the current file.

    **Ctrl+X:** Exit Nano and return to the shell.


    The first thing you''ll notice about config.txt is that the # (hash symbol) is
    used at the start of many lines. This symbol has a special meaning to the computer,


