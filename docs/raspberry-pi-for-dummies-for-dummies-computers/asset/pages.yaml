    The Skywalker HAT (see Figure 15-11) is an electric near-field 3D proximity sensor.
    With it, you can make gestures with your hands waving above it, which can then
    be detected by the library software, causing your own functions to run. Gestures
    such as flicks right, left, up, and down can easily be detected along with a circular
    motion of the finger. It also detects taps made directly to the HAT surface. It
    has'
