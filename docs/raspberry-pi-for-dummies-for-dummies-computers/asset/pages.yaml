- pgno: 262
  md: "You can still click the cloud to make it pop, so you have the engine for a\
    \ basic game here. Next, let's add an element of chance.\n\n# Using random numbers\n\
    \nChapter 11 shows how you can use the random.randint() function to pick a random\
    \ integer (whole number) in a certain range. You can also pick a random floating-point\
    \ number, with a decimal point in it, using random.uniform. To pick a random floating-point\
    \ number between 1 and 3, for example, you can use\n\n```\nrandom.uniform(1, 3)\n\
    ```\n\nYou can try this in the shell window (without making a program) if you\
    \ type\n\n```\n>>> import random\n>>> for i in range(10):\n    print(random.uniform(1,\
    \ 3))\n```\n\nRemember the colon at the end that is indented and that Python waits\
    \ for you to enter it before doing anything. Enter a blank line at the end to\
    \ tell Python you've finished, and you'll see ten numbers that look like this:\n\
    \n```\n2.66707438900764\n1.5292264804300049\n2.9317931171309224\n```\n\nNow you\
    \ can add some random numbers to the animation to make it less predictable, and\
    \ to make it feel more \"floaty.\" Add this line at the start of your program\
    \ to import the random module:\n\n```\nimport random\n```\n\nNow edit the animation\
