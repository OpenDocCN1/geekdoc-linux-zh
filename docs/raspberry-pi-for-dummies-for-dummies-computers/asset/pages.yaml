    # Installing software


    If you know the name of the package you would like to install, the following com-

    mand downloads it from the Internet and installs it, together with any other

    packages it needs to work correctly (known as dependencies):


    ```

    sudo apt-get install ace-of-penguins

    ```


    The last bit is the name of the package we found by searching the cache.


    When you''re searching the cache, you use apt-cache in the command, and when

    you''re installing software, you use apt-get. It''s easy to get these two commands

    mixed up, so if your instruction doesn''t work, double-check that you''re using
    the

    right one.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_130_0.png)


    Note that not all of the software available in the packages works well on the

    berry Pi. It''s easy enough to try, though, and remove it again if it doesn''t

    work for you.'
