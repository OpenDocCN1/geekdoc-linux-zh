  img_proc: true
- pgno: 301
  md: "You can also use names to play chords. You tell Sonic Pi the lowest note in\
    \ the chord and add which type of chord you want (try :major,:minor,or :diminished.\n\
    \ are also options for :major7,:minor7,:diminished7, and :dom7, among others.\
    \ For a complete list, click Lang in the Help page, and then select Chord.\nTry\
    \ this:\n\n```\nplay chord(:a3, :major)\nsleep 1\nplay chord(:a3, :minor)\n```\n\
    \nIn each case, it plays three notes at the same time. If you look at the note\
    \ numbers in the Log, you can see that the note was one pitch lower in the second\
    \ chord because it's a minor chord. Again, you can use Table 14-1 to check the\
    \ note numbers Sonic Pi displays against the musical notes.\n\nThe chord is returned\
    \ as a list, and you can use play_pattern to hear the notes of the chord in a\
    \ sequence, like this:\n\n```\nplay_pattern chord(:a3, :major)\nplay_pattern chord(:a3,\
    \ :minor)\n```\n\n# Writing Shorter Programs\n\nThere is a more efficient way\
    \ you can play a sequence of notes and specify the time, in beats, between each\
    \ one: Use the play_pattern_timed command. Click a button to go a new buffer and\
    \ try this:\n\n```\nplay_pattern_timed [:c4, :e4, :g4, :c5], [0.5, 0.5, 1]\n```\n\
    \nPay careful to the brackets and comma. This command takes two different sets\
    \ of information, and each set is between square brackets. The first set is the\
    \ notes you want to play, and they are the same as we used in our fanfare earlier.\
    \ The second set of information is separated from the first set by a comma. There\
    \ are four notes, but just three gaps between them, so the second set of brackets\
    \ has fewer items in it. The numbers we've used here put a half-beat pause between\
    \ the first and second notes, and the second and third notes, but double that\
    \ to build up the suspense (such as it is) before the final note sounds."
  merge: -1
  img_proc: true
- pgno: 302
  md: "# Composing Random Tunes Using Shuffle\n\nThe bracketed sections are lists,\
    \ similar to lists in Python. You can add different instructions (or methods)\
    \ to the lists to change the order of the items in them. For example, this, using\
    \ the reverse method:\n\n```\nplay_pattern_timed [:c4, :e4, :g4, :c5], [0.5, 0.5,\
    \ 1]\nplay_pattern_timed [:c4, :e4, :g4, :c5].reverse(), [0.5, 0.5, 1]\n```\n\n\
    You will hear the notes of the fanfare played forward and backward, with the same\
    \ timing each time. You can use the shuffle method, which changes the order of\
    \ the items in a list, to a random tune. Try this:\n\n```\nplay_pattern_timed\
    \ [:c4, :e4, :f4, :g4, :c5].shuffle, \n[0.5, 0.5, 1, 0.5, 0.5, 1]\n```\n\nWe've\
    \ used a rhythm there: two short notes and a long note. It's a cheery melody,\
    \ but it's a bit short, so Sonic Pi to repeat it. Here's how:\n\n```\n4 times\
    \ do\nplay_pattern_timed [:c4, :d4, :e4, :f4, :g4, :c5].shuffle, \n[0.5, 0.5,\
    \ 1, 0.5, 0.5, 1, 2]\nend\nplay :c4\n```\n\nThis example wraps the tune playing\
    \ in a loop that repeats four times. The start of the loop is 4 times, and the\
    \ end of the repeating section is marked, appropriately enough, with the word\
    \ Sonic Pi automatically indents your musical code by two spaces to show it's\
    \ the part that to be repeated. If you want to repeat more or less than four times,\
    \ change the number 4 at the start.\n\nThere are some other changes here: First,\
    \ we added a timing value for the last note in the sequence. It's the 2 that has\
    \ sneaked inside the last square bracket. We've also added a note, c4. Whatever\
    \ randomness happens in the rest of the tune, this sequence of notes always sounds\
    \ good when it ends on a C, because all the notes in the sequence are from the\
    \ C major scale.\n\n# Changing the Random Number Seed\n\nEach time you run the\
    \ program, it uses the same sequence of notes, though that sequence was generated\
    \ randomly. Sonic Pi ensures that your music sounds the same time you run it,\
    \ and wherever it runs, even if it incorporates\n\nCHAPTER 14 Making Music with\
    \ Sonic Pi 287"
  merge: -1
  img_proc: true
- pgno: 303
  md: "random elements. That ensures that you remain in control as a composer and\
    \ know what the music will sound like for your listeners, even with an element\
    \ of chance in the composition.\n\nIf you want to change the sequence to a different\
    \ one, you can change the *seed*, which is the starting point for generating random\
    \ numbers. By default it's set to 0. Add the line below at the start of your program\
    \ for generating random tunes using shuffle, and then run your program:\n\n```\n\
    use_random_seed 10\n```\n\nTry changing the seed to different numbers, and run\
    \ the program again to see how the sequence changes.\n\n# Using List Names in\
    \ Your Programs\n\nThe lists of notes and values can make your program look cluttered,\
    \ but you can tidy your program by giving the lists names and using those names\
    \ in place of the lists. You can streamline your previous program like this:\n\
    \n```\nuse_random_seed 10\nnote_pitches = [:c4, :d4, :e4, :f4, :g4, :a4, :c5]\n\
    note_timings = [0.5, 0.5, 1, 0.5, 0.5, 1, 2]\n4.times do\n    play_pattern_timed\
    \ note_pitches.shuffle, note_timings\nend\nplay 60\n```\n\n# Playing Random Notes\n\
    \nYou can play random number numbers, like this:\n\n```\nlowest_note = 60\nhighest_note\
    \ = 84\n6.times do\n    play rrand_i(lowest_note, highest_note)\n    sleep 0.5\n\
    end\n```"
  merge: -1
  img_proc: true
- pgno: 304
  md: "Try this program in a new buffer. In this program, lowest_note and highest_note\
    \ are variables. The rrand_i() function gives you a random whole number (or\n\
    integer). You give the function the lowest and highest possible number you want\
    \ the computer to pick from. As with the shuffle method, each time you run the\
    \ program, it generates the same random numbers, so the music sounds the same.\n\
    You can change the random seed to get a new melody. (See the section in this\n\
    chapter on creating random tunes with shuffle.)\n\nThe problem with generating\
    \ random number notes is that not all notes sound\ngood. Before this example,\
    \ we've been using the notes from the white\nkeys on the piano (the scale of C\
    \ major) and many of the sharp notes. When you\nstart tuning in sharp notes, the\
    \ random music can do, starts to sound too\nchaotic. An alternative way to pick\
    \ a random note is to create a list of the notes you\nlike (the scale of C major\
    \ we've been using) and then use the choose() method to\npick a random note from\
    \ it. Here's an\n\n```\nnote_pitches = [:c4, :d4, :e4, :f4, :g4, :a4, :c5]\nloop\
    \ do\n    play note_pitches.choose()\n    sleep 0.5\nend\n```\n\nThat program\
    \ uses a loop that repeats forever, so it'll keep improving until you\nclick the\
    \ Stop button.\n\nThe Log shows you the notes that are played, so you can use\
    \ this to see\nwhich notes are being chosen and confirm that your program is behaving\
    \ as you\nexpect.\n\n![](img/df9a01bf057d58c2401b5edabd6e8829_304_0.png)\n\n#\
    \ Experimenting with Live Loops\n\nOne of the best features of Sonic Pi is the\
    \ live loop, which enables you to change\nyour music while it repeats.\n\nThe\
    \ following program modifies the previous example by turning it into a live\n\
    loop and adding tempo (BPM is short for beats per minute), synth, and option\n\
    choices. Changing the synth is like changing the instrument the notes are played\n\
    on. Options (or opts) can be added after the instruction to play a note and affect\n\
    how the note is played on that instrument. The attack option changes how long\
    \ a\nnote takes to reach its full volume, for example.\n\nCHAPTER 14 Making Music\
    \ with Sonic Pi 289"
  merge: -1
  img_proc: true
- pgno: 305
  md: 'The new lines are bold in the following code:


    ```

    note_pitches = [:c4, :d4, :e4, :f4, :g4, :a4, :c5]

    live_loop = :endless_notes do

    use_bpm 120

    use_synth :doll_bell

    play note_pitches.choose(), attack: 0.01

    sleep 0.5

    end

    ```


    Take care with where you put spaces around colons. In Sonic Pi, colons are used
    immediately before something (such as a live loop, sample, synth, or chord). The
    program won''t work if you put a space between the colon and the synth name. Colons
    are also used to separate a parameter (or something you change) from its. In this
    example, attack is a parameter. The colon must go immediately after the parameter
    name.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_305_0.png)


    Note that you need a live loop name. This program uses :endless_notes, but you
    could choose something else if you prefer.


    When you run the program, you will hear the new synth sound (:doll_bell), and
    notice the new tempo.


    The clever bit is you can make changes to the program and have them incorporated
    seamlessly into the music. For example, changing the synth to :chipbass and clicking
    the Run. The button tunes instruments, but everything remains in time. Try changing
    the BPM to 60 and clicking the Run to hear the music slow. Change the attack to
    1, and you''ll hear the sharp percussive sound of the instrument change to a slow
    drone, almost like a church organ. You can add options to the same play instruction,
    as long as you separate them with a comma.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_305_1.png)


    To Sonic Pi that you''ve finished making changes and to hear them in your music,
    you must click Run again.


    The Help pane includes a list of synths you can choose from. Show the Help pane
    and then click Synths at the bottom. For each synth, there is information about
    the available options, and useful number values to tri.


    For more fluid experimentation, the autocomplete feature can be used while you''re
    writing your code. When you want to change synth, for example, delete the name
    of the current synth, highlight it before, and then tap after use_synth to see
    the list of available synths in the autocomplete menu. (See Figure 14-2.) Click
    one in the menu, or highlight it using the cursor keys and select it by pressing
    Tab or Enter. This is a great way to enter your code, but also a great way to
    explore synths and options available.


    290 PART 4 Programming the Raspberry Pi'
