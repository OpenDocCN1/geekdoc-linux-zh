- pgno: 164
  md: '# IN THIS CHAPTER


    +   - Using LibreELEC to turn your Pi into a media center

    - Playinging music and video stored on USB devices or networked devices

    - Viewing photos in the media center

    - Playing music in the desktop environment


    # Chapter 8

    Playing Audio and Video on the Raspberry Pi


    In this chapter, we show how you can turn your Raspberry Pi into a media center,
    capable of playing high-definition video files and music.


    To do that, we use dedicated media player software based on the Kodi software
    that powers some-top boxes and smart TVs. You can use it to play music and video
    that you have on storage devices connected to your Raspberry Pi, or to play back
    media from other devices on your home network. To a more limited degree, you can
    use it to play back streaming TV shows and radio stations from the Internet.


    At the end of this chapter, we also show you how to play music on your Raspberry
    Pi in the desktop environment.


    # Setting Up Your Media Center


    The Raspberry Pi can play back full HD 1080p video, which makes it ideal as the
    heart of a cheap and low-powered media center. The NOOBs software includes two
    Linux distributions, both based on Kodi, that turn your Raspberry Pi into a


    CHAPTER 8 Playing Audio and Video on the Raspberry Pi 149'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'media center. The choices are OSMC and LibreELEC. Because they''re both based
    on the Kodi core, they have many similarities. In this chapter, we use LibreELEC
    because it uses the default Kodi design (or skin), so it''s more likely to resemble
    other Kodi systems you have used. It''s also a more lightweight option, so it
    may perform better on lower-powered Raspberry Pi models.


    If you are using OSMC, the design looks different, but you should still be able
    to follow along in this chapter. To make it easier, you can choose the default
    Kodi by clicking Settings on the left, choosing Interface from the menu that appears,
    and then choosing Skin. Click Skin in the main part of the screen to open the
    options and choose Estuary, which is the Kodi design. You can change back to the
    OSMC skin from Estuary by clicking the Cogwheel icon at the top of the menu on
    the left, choosing Interface Settings from the menu that appears, hovering over
    Skin on the left, and then clicking Skin in the main part of the screen. You can
    exit any of the menus by pressing Esc.


    To start up your media center, create an SD or microSD card with NOOBS Lite (see
    Chapter 2), and then use that card to install LibreELEC


    When you first boot up LibreELEC, you''ll be guided through its main settings,
    including its name on the network, the network connection itself, and the remote
    access settings (so that you can access files on your device over the network).


    # Navigating the Media Center


    The Kodi screen looks like Figure 8–1. LibreELEC uses Kodi''s simple interface,
    which is designed to work with only a remote control. In this chapter, we assume
    you''re using a mouse, but we give you some pointers on using remote controls
    in the section "Using a Remote Control," later in this chapter. If you''re using
    a remote control, find the interface.


    The menu on the left side of the screen gives you access to the different content
    types, including movies, TV shows, music, and music videos. When you hover the
    mouse over one of these options, the main screen on the right gives you options
    and submenus for accessing your content. The section, for example, shows categories
    you can browse, recently played albums, recently added albums, random albums,
    random artists, unplayed albums, and most played albums. You can use the cursor
    keys to move around the options; or the mouse, with the scroll wheel moving between
    the options within a menu. To exit a menu, press the Escape key.


    150 PART 3 Using the Raspberry Pi for Both Work and Play'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'To select an item and start to play it, simply click it. You can pause playback
    by tapping the keys, and tap Escape to get back to the menu.


    To use the TV and radio features, you''ll need to have a separate tuner device
    and TV signal decoding software. For more information, see http://kodi.wiki/view/PVR_backend.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_166_0.png)


    ![](img/df9a01bf057d58c2401b5edabd6e8829_166_1.png)


    FIGURE 8-1: The main menu on the left and the empty library area on the right.
    shows how Kodi appears before media is added.


    At the top of the menu are buttons for switching off your Pi, accessing the settings
    menus (the Cogwheel icon), and searching for content (the magnify- glass).


    # # Adding Media


    Before you can play back content, you need to tell Kodi where it can find it.
    You have several options for providing it:


    +   - USB drive: You can plug a USB drive that stores your movies or music directly
    into your Pi or its USB hub. A message appears in the top right, confirming'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'that the USB device is mounted, which means it''s being prepared

    so that you can use it.


    +   **Networked media:** You can connect your Pi to your home network and then

    access other devices on the same network. Sean, for example, was able to

    connect his Pi to his Windows PC over the network and use Kodi on the Pi to

    play back music and movies stored. You might have a router with

    buid-in media server, so it can share any files on USB devices you connect

    it to. These networked devices most likely use the UPnP (Universal Plug and\Play)
    standard.


    Kodi can create a library of your media and index to provide you with easy access

    it it. You''ll need to add your content to the library first to benefit from this.


    # Adding music


    To add music to your library, follow these steps:


    +   1. **Hover over Music in the menu on the left.**


    If you''ve already added music, you''ll see options to browse it by artist, album,

    and year, among other categories.


    +   2. **Choose Files from the Categories menu at the top of the screen. (Use
    the

    scroll wheel to change this menu horizontally until you find it.)


    This will show you the folders you have added to your library already, and any

    connected storage devices.


    +   3. **Choose Add Media.**


    +   4. **Choose Browse in the Add Music Source dialog box that opens and use

    toptions to find where your music is stored. (See Figure 8-2)**


    If you''ve connected a USB drive to your Pi, you can find it by clicking Root

    filesystem, *media*, and then the name of your USB device. To find media

    connected on your network, try the Windows Network (SMB) or Network File

    System options.


    > REMEMBER

    You may need to enter your username and password, and you should enable

    the option to remember them for this path if you don''t want to enter

    them whenever you access your media. Click folders to open them. The .. (two

    dots) option at the top takes you up a level in a folder structure.


    +   5. **Click OK when you have navigated to the folder that contains all the

    music folders or files you want to add.**'
  merge: -1
  img_proc: true
- pgno: 168
  md: '+   6. In the Add Music Source dialog box enter a name for the media source,
    if you want.


    This will help you identify the source on the menus.


    +   7. Click OK.


    +   8. When prompted, confirm that you''d like to add the media to your library.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_168_0.png)


    FIGURE 8-2: The browsing options for adding media to your Kodi installation.


    > TIP Content Kodi doesn''t recognize, including home recordings, won''t be added
    to the library, but you can still view them in the folder you added by using the
    browser. By choosing Music from the menu on the left, choose Files (as you did
    when adding media), and select the folder that contains your added media. From
    there, you can open the folders and select the music files to play them.


    # Adding videos


    To add to your library, follow these steps:


    +   1. Click Movies from the menu on the left.


    If you can''t see it, it''s probably off the top of the screen. Hover the mouse
    cursor over the menu and use the scroll wheel to bring the Movies option back
    again.


    If you''ve already added some films, you''ll see a list of them .. (two dots)
    at the top of list. In that case, click .. twice to go up a level and then choose
    Files. This will show you the folders you have added to your library already.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '+   2. Choose Add Videos at the bottom of the folder list.


    +   3. Choose Browse and use the options to find where your movies are stored.


    If you''ve connected a USB drive to your Pi, you can find it by clicking Root
    filesystem, media, and then clicking the name of your USB device. To find media
    connected on your network, use the Windows Network (SMB) or Network File System
    options. Click folders to open them. The . option at the top takes you up a level
