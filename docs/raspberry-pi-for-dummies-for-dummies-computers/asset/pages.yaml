    # #Naming Your Sprites


    Whenever you''re programming, you should give things meaningful names so that
    you (and others) can easily understand what your program does. Scratch gives your
    sprites names like *Sprite* and *Sprite2*, but you can rename them. To rename
    a sprite, click its name above the Scripts Area (refer to Figure 10-3) and type
    its new name. Your sprite''s costumes are called *costume1*, *costume2*, and so
    on. If you''ve created different costumes for your sprite, you should also give
    them sensible names so that you can easily tell which is which. To go to your
    sprite''s costumes tab, click the name beside a costume (refer to Figure 10-3),
    and type the new name.


    For the space game, you need to create a flying saucer sprite name *ship* and
    a sprite named *fireball* to represent the ship''s weapon. The baddie, a sprite
    called *alien*, has two costumes: *alienok*, which is looking menacing, *alienhit*,
    which shows the same entity after it is hit by the fireball.


    To make it easier to see what you''re doing, we recommend you drag your ship to
    the bottom of the screen, drag the alien to the top, and put the fireball somewhere
    in the middle. Roughly reflects where they will be in the finished game.'
