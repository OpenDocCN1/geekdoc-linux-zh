    \ of your program:\n\n# LISTING 12-2: Adding a Second Cloud\n\n```\nWIDTH = 500\n\
    HEIGHT = 500\ncloud = Actor('target5')\ncloud.x = 250\ncloud.y = 250\ncloud2 =\
    \ Actor('target5')\ncloud2.x = 80\ncloud2.y = 250\nndef draw():\n    screen.clear()\n\
    \    cloud.draw()\n    cloud2.draw()\n```\n\n# Detecting mouse clicks\n\nPygame\
    \ Zero makes it easy to respond to mouse clicks. Add the following function to\
    \ the end of your existing program. It doesn't matter whether you're using one-cloud\
    \ or two-cloud program from Listing 12-2:\n\n```\ndef on_mouse_down(pos):\n  \
    \  if cloud.collidepoint(pos):\n        cloud.image = 'pop'\n        sounds.blop.play()\n\
    ```\n\nThis function runs when the mouse button is clicked, and stores the position\
    \ of the mouse pointer in pos, which is called a tuple."
