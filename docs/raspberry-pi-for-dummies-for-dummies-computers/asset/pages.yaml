    # Chapter 12


    # Creating a Game with Python and Pygame Zero


    Developing games is one of the best ways to explore programming. It gives you
    rapid, visual, results, so you can easily see what''s going on and you get to
    have some fun playing your creation at the end. Game development also makes it
    easy to think of fresh coding challenges to solve, as you dream up new features
    to add.


    One of the most popular tools for making games in Python is called Pygame: It''s
    a set of functions that makes it easier to manage your images and sounds, among
    other things. Pygame has a few complexities, and can be difficult to get started
    with.


    That inspired Daniel Pope to make Pygame Zero, a library of routines that simplifies
    Pygame so you can get started more easily. It also includes a number of built-functions
    that manage animations, loops, and images. Pygame Zero was designed for education,
    but is great fun for anyone to tinker with.


    Pygame Zero is also available for Mac and Windows, the games you make on the Raspberry
    Pi can be enjoyed by your friends even if they have different computers.


    > REMEMBER'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'In this chapter, we show you how to make a game called Cloudbusting, you have
    to "pop" the clouds as they drift up the screen. You have ten seconds to click
    as many as you can. The game works on the Model B+, but is a noticeably smoother
    experience on the Raspberry Pi 2 or 3.


    # Collecting Your Sounds and Images


    To follow the examples in this chapter, you need the sounds and images described
    in the following list. You can either create your own or download our examples.
    (See the Introduction for more on downloading our supporting files.) This simple
    game works well whatever images you use.


    Here are the assets needed for Cloudbusting:


    +   **Six images, named target0.png to target5.png:** In our game, we use colored
    images, but you could use anything. Our images measure about 100 pixels by 90
    pixels, and you should aim for a similar size, or take 10 or 20 pixels in this
    direction. (We''ve noticed that it adds a sense of depth to the game if one of
    the images is a slightly different size from the rest, so you may want to try
    that out.) Use a transparent background so the images can overlap their workings
    behind them. The PNG format is recommended, by Pygame Zero can also use GIF and
    JPEG images (although JPEGs don''t support transparency). The simplest way to
    make your own is to use the built-in Paint Editor in Scratch (refer to Chapter
    10) and right-click a costume in the Costs Area to save it from the menu (This
    is known as exporting in Scratch 1.4 and saving to a local file in Scratch 2.0)


    +   **One image named pop.png:** This image is shown when the game hits. Ours
    is a cartoon-style pointy bubble with "Pop!" written in it. We made this image
    in Scratch.


    +   **Two sounds — one for the popping of a target and the other to play when
    the game ends:** We''re using a sound effect we found online blop.ogg for when
    cloud bursts, and a tune Sean made on the iPad called whoops.ogg for when the
    game ends.


    The .ogg format is a sound format often used in open source software. You can
    also a .wav file in Pygame Zero. If you''re using sound effects different from
    ours, the filenames in the programs to your choices.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_255_0.png)


    REMEMBER'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'As always, you can download the code for this chapter, too, if you have any
    difficulties getting it working or you don''t want to type the examples yourself.
    See the Introduction for instructions on downloading the supporting materials.
    You can also see the full listing for this game at the end of this chapter.


    # Setting Up Your Folders


    Pygame Zero lays strict rules about what your files can be called and where they
    should be saved. Filenames must be in lowercase, which helps to ensure that they
    work across different computers. Your images must be stored in a folder called
    images, and your sounds in a folder called sounds.


    Let''s set up those folders now. Follow these steps:


    +   1. In the desktop environment, click the taskbar''s File Manager icon.

    For more on the taskbar and the File Manager, see Chapter 4.


    +   2. In the pi folder, right-click, and then choose New: Folder from the contextual
    menu that appears.


    +   3. Name your folder images.


    +   4. Repeat Step 2, but this time your new folder sounds.


    +   5. Copy your image into the images folder, and your sounds into the sounds
    folder.


    Remember when you download files with your web browser, they will be saved in
    your Downloads folder, which is also in your pi folder. You may need to extract
    them from a .zip file, by double-clicking the .zip file and clicking the Extract
    Files button when Xarchive opens. After extracting the files, you can copy them
    to the images and sounds folders. For guidance using the File Manager to copy
    and move files, see Chapter 4.


    # Creating and Running Your First Program


    The lines of code in Listing 12-1 show your first Pygame Zero program, which puts
    an image in the center of the window. Type it into Tonny or Python 3 (IDLE) and
    save it in your pi folder as cloud.py. See Chapter 11 for more integrated development
    environments, such as Tonny and IDLE.'
  merge: -1
  img_proc: true
- pgno: 257
  md: "# LISTING 12-1: Your First Pygame Zero Program\n\n```\nWIDTH = 500\nHEIGHT\
    \ = 500\n\ncloud = Actor('target5')\ncloud.x = 250\ncloud.y = 250\n\ndef draw():\n\
    \    screen.clear()\n    cloud.draw()\n```\n\nTo run a Pygame Zero game, you need\
    \ to use the command line. Follow these\nsteps:\n\n+   1. Using File Manager,\
    \ navigate to the pi folder. (For more on navigating\nFile Manager, see Chapter\
    \ 4).\n\nYou should see your cloud1.py file, and the folder that contains your\n\
    target images.\n\n+   2. Choose Tools from the File Manager main menu, and then\
    \ Select\nCurrent Folder in the menu that appears.\n\nYou can also use F4 as a\
    \ keyboard shortcut for this.\n\n+   3. In the terminal, enter pgzero cloud.py\
    \ after the prompt.\n\nYou should see something like Figure 12-1, with an image\
    \ in the middle of a new\nwindow that opens. You might need to wait a moment for\
    \ the window to open.\nWhen you've finished with it, you can click the Close button\
    \ in the top right of\nthe window or use Ctrl-C in the command line to quit. Don't\
    \ close the command\nline window; you can save time by keeping it open so that\
    \ you can use it to start\nnext Pygame Zero program or to run this one after modifying\
    \ it.\n\nThe WIDTH and HEIGHT variables are used to set up the size of the window\
    \ — in our\ncase, a square of 500 pixels.\n\nPygame Zero introduces the idea of\
    \ actors, which are like sprites in Scratch. An\nactor stores an image and its\
    \ position in one place, which makes it easier to man-\nage characters and obstacles\
    \ in your Python. This kind of thing is already built\ninto Scratch, but it's\
    \ not part of Python, or even Pygame. The use of actors in\nPygame makes it much\
    \ easier to move from programming in Scratch to using\nPython.\n\n242 PART 4 Programming\
    \ the Raspberry Pi"
