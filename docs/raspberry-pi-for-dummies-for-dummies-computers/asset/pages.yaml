  md: 'part of the maze can be visited. There is only one path between any two points
    in the maze.


    An algorithm is a set of rules or a process for solving a particular problem.
    It is typically performed by a computer, but you could carry out the maze algorithm
    using paper and pencil, and an eraser to wipe out the walls as you go. Here''s
    how it works:


    +   1. You start with the "waffle" you''ve built, with every cell having four
    walls.

    2. You pick a random cell in the maze to start at.

    3. You look at your current cell''s neighbors and make a list of all those that
    have four walls intact. These are the cells that have not been visited.

    4. If you found some unvisited neighbors, you pick one at random, knock down the
    wall between it and your current cell, and move into that cell, making your current
    cell.

    5. If your current cell has no unvisited neighbors, you go back one cell in the
    path you''ve taken, and make that your current cell.

    6. Repeat Steps 3 to 5 until you''ve visited every cell.


    # Setting up the variables and lists


    To implement this algorithm, you''ll use the following variables:


    +   >> numberOfCells: This is the total number of cells in the maze, which will
    be SIZE*SIZE.


    +   >> numberOfVisitedCells: This keeps track of how many cells you''ve visited.
    When this is the same as numberOfCells, every cell has been visited and had a
    wall demolished, and is therefore reachable.


    +   >> xposition: This remembers your x position as you move through the maze
    generating it. It''s measured in cells, and it starts as a random number between
    1 and maze SIZE.


    +   >> zposition: This remembers your z position as you move through the maze
    generating it, also measured in cells and also starting as a random number.


    +   >> cellsVisitedList[] This is a list that stores the path you''ve taken so
    that the program can retract its steps. When you set it, you put your starting
    position into it using the append() list method.


    +   >> playerx and playerz: These are used to remember the starting position,
    you can put the player there when the maze has been built.'
