    # # Preparing Your Pi Zero or Zero W


    The Pi Zero models use Mini HDMI and Micro USB sockets. As a first step, you need
    to plug in converters that will enable you to connect to standard HDMI and USB
    devices. Figure 3-8 shows the Micro-USB-to-USB converter cable and the Mini-HDMI-to-HDMI
    converter.


    Plug the HDMI converter into the Mini HDMI socket indicated in Figure 3-3. The
    USB converter goes into the Micro USB socket, indicated in Figure 3-3 and labeled
    as USB on the board. Take care with this one because it also fits in the power
    socket.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_56_0.png)


    # # Connecting a Monitor or TV


    You can connect a display device to your Raspberry Pi in one of two ways, depending
    on the type of screen you have available. This means one of the Raspberry Pi''s
    display sockets will always be unconnected.'
