- pgno: 122
  md: '# Deleting Files


    After experimenting with creating files and directories, you probably have odd
    bits of file and meaningless directories all over the place, so it''s time to
    tidy up.


    To delete files in Linux, you use the rm command, short for remove. Use it carefully.
    There''s no trash or recycle bin to recover your file from again, when it''s gone,
    it''s gone. Actually, Linux users might be able to get it back using specialized
    software and huge amounts of time and patience, so it''s not a secure deletion.
    But for an average user without access to such software and expertise, when you
    tell Linux to remove a file, it acts fast and decisively.


    The rm command has this format:


    ```

    rm options filename

    ```


    As mkdir, the command doesn''t tell you what it''s doing unless you use the verbose
    option (-v). As an example, you could remove a file called letter.txt using


    ```

    pi@raspberry ~ $ rm -v letter.txt

    removed ''letter.txt''

    ```


    Like mkdir, running the rm command can take several arguments, which means it
    can remove several files at once if you list all of them, names: for:


    ```

    pi@raspberry ~ $ rm -v letter.txt letter2.txt

    removed ''letter.txt''

    removed ''letter2.txt''

    ```


    This is where to be extremely careful. Imagine that you have two files called
    old.index and index.html. The latter is your new home page, which you''ve toiled
    over all weekend. (You can see where this is going, can''t you?) You want to clear
    out the old development file, so use this command:


    ```

    pi@raspberry ~ $ rm -v old index.html

    rm cannot remove ''old'': No such file or directory

    removed ''index.html''

    ```


    Arrrrgh! Because of that space in the old index.html filename, the rm command
    thinks that you wanted to remove two files — one old called and the other called
    index.html. It tells you it can''t find the file called old, but goes right ahead
    and wipes out index.html. Nasty!'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'To pin up a safety net, use the -i option (for interactive), which tells you
    which file(s) will be deleted and prompts you to confirm each deletion. Using
    that would have avoided this mistake, as shown here:


    ```

    pi@raspberry ~ $ rm -vi old index.html

    rm : cannot remove ''old'': No such file or directory

    rm : cannot remove file ''index.html''?

    ```


    No, no! When prompted, enter Y to confirm the deletion or N to keep the file and
    move on to the next one (if any).


    ![](img/df9a01bf057d58c2401b5edabd6e8829_123_0.png)


    The risk of deleting the wrong file is one reason you should avoid files with
    spaces in their names. For the record, the correct way to remove a file whose
    name contains a space is to enclose it in quotes:


    ```

    pi@raspberry ~ $ rm -vi ''old index.html''

    ```


    # Using Wildcards to Select Multiple Files


    Often, a directory contains lots of files that have similar filenames. Sean''s
    digital camera, for example, creates files with names like these:


    img_8474.jpg

    img_8475.jpg

    img_8476.jpg

    img_8477.jpg

    img_8478.jpg


    If you want to delete a group of them, or to copy them or do anything else with
    them, you don''t want to repeat the command by typing out each filename in turn.
    Computers are good at repetition, so it''s better to let the donkey work in the
    shell.


    Wildcards enable you to do that. Instead of giving a specific filename to a command,
    you can give a pattern to match, such as all files that begin with img or all
    the files that have the extension .jpg. The asterisk wildcard replaces any number
    of character, so *.jpg returns any filenames that end with .jpg, no matter how
    long they are and how many there are. The question mark asterisk replaces just
    one character, so img?.jpg would select img1.jpg, img2.jpg, and imgb.jpg but ignore
    img11.jpg or any other longer filenames.


    108 PART 2 Getting Started with Linux **'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'If you want to choose files that begin with a particular letter, you can use
    the square brackets wildcard. To choose any files beginning with the letters a,
    b, or c you would use [abc]*. To narrow that down to just those that end with
    .jpg, you would use [abc]*.jpg.


    Table 5-3 provides a quick reference to the wildcards you can use, with examples.


    # Table 5-3


    # Raspberry Pi Wildcards


    | Wildcard | What It Means | Usage Example | What Is Selected in the Example |

    |---|---|---|---|n| ? | Any single character | photo?.jpg | Any files that start
    with photo and have exactly one character after it before the .jpg extension.
    For example, photo1.jpg or photox.jpg but not photo10.jpg |

    | * | Any number of characters (including none) | *photo* | Any files that have
    the word photo in their filenames. |

    | [...] | Matches any of the characters in brackets | [abc]* | All files that
    start with the letter a, b, or c. |

    | [...] | Matches any single character that isn''t between the brackets | [^abc]*
    | Any files that do not start with the letter a, b, or c. |

    | [a-z] | Matches any single character in the range specified | [a-c]*.jpg | Any
    files that start with a letter a, b, or c and end with the .jpg extension. |

    | [0-9] | Matches any single character in the range specified | photo[2-5].jpg
    | Matches photo2.jpg, photo3.jpg, photo4.jpg, and photo5.jpg. |


    You can use wildcards anywhere you would usually use a filename. For example,
    you can delete all your files starting with the letters img, like this:


    ```

    rm -vi img*

    ```


    To delete all files ending with the extension .txt, use


    ```

    rm -vi *.txt

    ```


    CHAPTER 5 Using the Linux Shell 109'
