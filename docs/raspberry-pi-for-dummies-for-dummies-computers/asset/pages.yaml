    # Chapter 4


    # Using the Desktop Environment


    The quickest way to start playing with your Raspberry Pi is to use the more visual
    desktop environment, which is called PIXEL (short for Pi Improved Windows Environment,
    Lightweight). PIXEL is part of the recommended Raspian Linux distribution for
    the Raspberry Pi (see Chapter 3), and by default is what will appear when your
    computer finishes starting up. It''s based on an open source desktop called LXDE,
    which the Raspberry Pi Foundation has redesigned. (LXDE is short for Lightweight
    X11 Desktop Environment, in case you were wondering.)


    The desktop environment works in a similar way to the Windows and Mac OS operating
    systems, which let you use icons and the mouse to find and manage files and operate
    programs. That makes it relatively intuitive to navigate, and it means you can
    easily find and try out some of the software that comes with your Linux distribution.'
  merge: -1
  img_proc: true
