    # # Detecting When a Sprite Hits Another Sprite


    There''s no point in throwing flaming fireballs at an alien if it won''t even
    raise an eyebrow. To make this game fun, you need to make the alien react whenever
    it''s hot. Most games involve sprites hitting other (bats and balls, targets and
    weapons, crashing and catching), so collision detection, as it is often called,
    a staple of game design.


    You can detect whether the fireball is touching the alien sprite from the fireball,
    but it is the alien that must react, so that''s where you need to put your script.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_211_1.png)'
