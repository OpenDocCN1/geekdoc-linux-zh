  md: '# Brain Party


    If you fancy a few minutes of gaming to tune up your brain between programming
    sessions, Brain Party is here for you. It''s a series of fun minigames, designed
    to stretch the gray matter. You complete five randomly selected tests to get your
    “brain weight” score, and can practice each minigame when you''ve unlocked it
    in a test. Puzzles will challenge your memory, observation skills, logic skills,
    and reactions. It''s family friendly too.


    You can install it by searching for *brain party* on the Add/Remove Software menu
    (the game is listed as “36 puzzle games for all the family”) or install it at
    the command line, like this:


    ```

    sudo apt-get install brainparty

    ```


    You can run Brain Party from the Applications menu (find it under Games) or from
    the command line by typing in **brainparty**.'
