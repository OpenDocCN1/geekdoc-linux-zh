  md: '# # Finding out what’s installed


    To find out what software is installed on your Raspberry Pi, you can use


    ```

    ```dpkg --list```

    ```


    This command doesn''t need root authority to run, so it doesn''t require you to
    use sudo at the start.


    If you want to find out whether a specific package is installed, use


    ```

    ```dpkg --status packagename```

    ```


    For applications that are installed, this also provides a longer description than
    the short apt-cache description, which might include a web link for further documentation.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_133_0.png)


    The Raspberry Pi includes many packages that come with the Linux operating system
    and are required for it. If you didn''t deliberately install a pack-age, exercise
    caution before removing it.


    # # Managing User Accounts on Your Raspberry Pi


    If you want to share the Raspberry Pi with different family members, you could
    create a user account for each one so that all have their own home directory.
    The robust permissions in Linux help to ensure that people can''t accidentally
    delete each other''s files, too.


    When we looked at the long listing format earlier in this chapter, we discussed
    permissions. You might remember that users can be members of groups. On the Raspberry
    Pi, groups control access to resources like the audio and video hard-ware, before
    you can create a new user account, you need to understand which groups belong
    to. To find out, use the groups command to see which groups default pi user is
    a member of:


    ```

    ```pi@raspberry ~ $ groups pi

    im dialout cdrom sudo audio video plugdev games input

    netdev gpio i2c spi```

    ```'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'When you create a new user, you want to make him a member of most of these
    groups, except for the group pi (which is the group for the user pi).


    If you give users membership of the sudo group, they will be able to install software,
    change passwords, and do pretty much anything on the machine (if they know how).
    In a home or family setting, that would be fine, however. The permissions-system
    still protects users from accidentally deleting data they shouldn''t, as long
    as they steer clear of the sudo command.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_134_0.png)


    To add a user, use the useradd command with the -m option to create a home directory
    for him and use the -G option to list the groups user should be a member of, like
    this:


    ```

    sudo useradd -m -G [list of groups] [username]

    ```


    For example:


    ```

    sudo useradd -m -G adm,dialout,cdrom,sudo,audio,video,plugdev,games,netdev,input,spi,gpio
    karen

    ```


    ![](img/df9a01bf057d58c2401b5edabd6e8829_134_1.png)


    Make sure the list of groups is separated with a comma and that there are no spaces
    in the user''s name


    You can do a quick check to confirm that a new home directory has been created
    with the user''s name in directory /home, alongside the home directory for the
    user:


    ```

    1 ls /home

    ```


    You also need to set a password for the account, like this:


    ```

    sudo passwd [username]

    ```


    For example,


    ```

    sudo passwd karen

    ```


    Usernames are sensitive, if you use any capital letters, you must do so consistently.
    You''re prompted to enter the password twice, to make sure you don''t mistype
    it, and you can use this command to change the password for any user. There is
    no output on the screen as you type the password, which can be a bit offputting,
    but keep typing and it should work fine.


