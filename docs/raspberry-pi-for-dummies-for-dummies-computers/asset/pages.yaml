    # # Connecting Your Raspberry Pi


    The thought of being faced with a bare circuit board might strike you as rather
    daunting, but it''s actually quite easy to connect your Raspberry Pi and get it
    up and running. You might need to change some of its configuration (see Appendix
    A), but many people find that their Raspberry Pi works well the moment they connect
    it all.


    Before we start, make sure you have the Raspberry Pi facing the right around,
    at least as these directions are concerned. The top of your Raspberry Pi is the
    side that has the most components and sockets sticking out of it, and is shown
    in Figures 3-1, 3-2 and 3-3. The back is relatively flat. Arrange your Raspberry
    Pi so that the spike GPIO pins are in the top left, or in the case of a PI Zero
    or Zero W without pins, so that the 40 holes are in the top left.


    Figure 3-1 shows the ports and sockets you will need to connect up an original
    Model B Raspberry Pi. The Model A is the same as Figure 3-1 except that it has
    no Ethernet connection in the bottom right.'
