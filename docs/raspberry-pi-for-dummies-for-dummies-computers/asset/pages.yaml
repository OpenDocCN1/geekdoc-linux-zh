    # # Chapter 9

    Introducing Programming with Scratch


    The Raspberry Pi was created partly to inspire the next generation of programmers,
    and Scratch is the perfect place to start. With it, you can make your own cartoons
    and games and discover some of the concepts that professional programmers use
    every day.


    Scratch is designed to be approachable for people of all ages. The visual interface
    makes it easy to see what you can do at any time, without having to remember any
    strange codes, and you can rapidly achieve great results. Scratch comes with a
    library of images and sounds, so it takes only a few minutes to write your first
    Scratch program.


    In this chapter, we introduce you to Scratch so that you can start to experiment
    with it. In Chapter 10, we show you how to use Scratch to make a simple arcade
    game.


    CHAPTER 9 introducing Programming with Scratch 163'
