- pgno: 203
  md: '>> Text: To reposition the text, drag the small black box that appears to the
    left of the cursor on the canvas. You can choose different fonts and sizes in
    the Options Area, and press Enter to start a new line.


    >> Select: Use this to select a rectangular area of your image that you would
    like to modify or remove. Click and hold the mouse button in one corner and the
    opposite corner, and release the mouse button. You can drag your selected area
    to move it to a different part of the image or use the buttons at the top of the
    Paint Editor to enlarge or shrink, rotate anticlockwise (counter-clockwise) or
    clockwise, flip horizontally, or flip vertically. You can also delete on your
    keyboard to delete the selected area.


    >> Stamp: Use this to copy and paste part of your image. Click and hold the mouse
    button to mark one corner of the area and drag your mouse to the opposite corner
    and release the button. A copy of that area follows your mouse cursor. Click the
    mouse button to stamp it at that position on the Canvas.


    >> Eydropper: Use this to choose a color that''s already on your Canvas. If you
    want to amend part of your sprite and need to use the same ink you used earlier,
    this saves you from having to remember which ink was.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_203_0.png)


    The clear clears the Canvas (except for text), irrespective of what you''ve selected.
    If you make a mistake, click Undo. (Refer to Figure 10~2.)


    When you''ve finished drawing your game, click Set Costume at the bottom left
    of the Paint Editor and then drag the crosshairs to the middle of your image.
    This is important because it controls the point around which your sprite rotates
