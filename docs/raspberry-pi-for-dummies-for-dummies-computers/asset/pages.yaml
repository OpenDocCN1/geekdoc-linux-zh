- pgno: 202
  md: 'The checkered area on the right is the Canvas. The checkered pattern has a
    special meaning and is used to indicate parts of the image that are transparent,
    where the background will show through. Usually, you want everything outside the
    outline of your sprite to be transparent and everything inside it to be another
    color. Choose the color you want to use, or the checkered transparent "ink," by
    using the Color Palette at the bottom left of the Paint Editor. (Refer to Figure
    10-2).


    Above the Color Palette, you can see your drawing and editing tools. Click one
    to select it, and then you can use it on the Canvas. The icon for your chosen
    tool is tinted so you can easily see which tool you''re using. Underneath the
    icons are the Options Area. (Refer to Figure 10-2.) This is where you can choose
    to use a particular tool. The main tools are described (from left to right, top
    row first) in this list:


    +   >> Paintbrush: Hold the mouse button as you move over the Canvas to leave
    a line. In the Options Area, you can select the brush size.


    +   >> Eraser: Click the button to delete part of the image. You can hold down
    the button and move the mouse if you want to delete large parts of the image,
    or delete small sections that have a steady hand. In the Options Area, you can
    choose the eraser size.


    +   >> Fill: Click inside a shape to choose a graduated pattern to use with your
    chosen color.


    In the Options Area, you can choose a graduated pattern with your chosen color.
    To the right of the Color Palette are two overlapping squares that show the selected
    colors. To choose a different color to fade into, click the right-angled arrow
    between the two squares to choose the one you''ve selected, and then click the
    second color you want to use in the Color Palette.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_202_0.png)


    +   >> Rectangle: Click and hold the mouse button to mark one corner of the rectangle,
    and then drag your mouse to the opposite corner and release the button. In the
    Options Area, choose whether you want a rectangle or an empty one.


    +   >> Ellipse: This is similar to the Rectangle tool. Click to indicate the point
    where lines from the top and left of the ellipse would meet, and then drag the
    mouse to the opposite side before releasing the button. Again, you have options
    to draw a free or empty shape. You can create a perfect curved line by drawing
    an ellipse and deleting some of it.


    +   >> Line: Click and hold the mouse button at the start of the line, move the
    mouse to the end of the line, and then release the mouse button. Your options
    let you choose the brush size, or line thickness.


