  md: 'The three patterns use the different pattern primitives to display a sequence
    of patterns in random colors given by the randCol function. This function generates
    a mix of two levels of color for each of the three components but excludes black.
    The first pattern generates a sequence of squares whose lower corners are on the
    diagonal of the display. These squares start off small and then increase each
    time the diagonal is filled, until it uses an 8 x 8 square.


    The next pattern displays a series of nested squares in changing colors. And the
    final display shows a "straight" line sweep, from the bottom corner round the
    display counterclockwise.


    Given the fact that you''ve created a broach, it can be made into a wearable device
    by running it off a battery-powered Pi Zero. Or you can just have it as a desktop
    display. You can customize the timing of the display by adjusting the sleep times.
    Note that the solid square function is not used; you can add that to one of the
    patterns to make them more complex. However, our main hope is that you will write
    your own patterns and have even more of them added to the sequence.


