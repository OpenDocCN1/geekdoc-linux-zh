    # # Old McDonald’s Farm


    So in this chapter, we have shown you how to associate information on an RFID
    tag to sow with the jukebox, and how to associate an image with a dress-paper
    doll. Now we combine the two techniques to create the ultimate in children’s songs:
    “Old McDonald Had a Farm.” The unique algorithm used to generate the chorus of
    this song ensures that the length of the song grows exponentially with every animal
    added. The point of this song is to include not only well-known farmanimals but
    also unusual ones. (Truth be told, Mike’s wife said that is only a boy thing.)


    410 PART 5 Exploring Electronics with the Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 426
  md: 'As with the other projects in this chapter, we present just a start that can
    easily be extended, almost without limit, simply by placing more files in folders.
    Just like the Dress Up Doll project, there are two programs: an enroll program
    and a play program. The idea is that fragments of the song are recorded, the program
    puts together these fragments into the ever-lengthening song. What''s more, the
    computer never forgets what is on the farm, and each verse is sung with the enthusiasm
    of the first. (You can''t always say that singing "Old McDonald''s Farm in real
    life.) The child, or the parent themselves, should record at least some of the
    samples.


    # Making sound samples


    The samples can be recorded on a laptop and moved over to the Pi by USB memory
    stick. However, with a bit of work, it''s possible to do the whole thing on the
    Pi itself. The Raspberry Pi can record sound, but it has no built-in interface,
    so you have to provide one in the form of a USB card. You can purchase one for
    less than $10 (about £6) and you can find others listed at http://linux.org/RPI_VerifiedPeripherals
    USB_Sound_Cards.


    It''s best to look at the installation details for the specific card you use.
    After it''s plugged in and connected to a microphone, go to the Desktop menu and
    choose the Preferences submenu, and then select Audio Devices. From the drop-down
    menu after, choose your USB card.


    Next, you need some software to record the sound. By far, the best free software
    to do this is Audacity. To install it on your Pi, go to a terminal and enter the
    following:


    ```

    sudo apt-get update

    sudo apt-get install audacity

    ```


    After Audacity installs, it''s available from the Desktop menu, under the Sound
    & Video entry. The screen is shown in Figure 18-6.


    > You can find versions of Audacity for the Macintosh and Windows operating systems
    as well.


    Audacity can not only record but also edit it — and even add effects. The controls
    are just like a tape recorder, with a round, red Record button and a square Stop
    button. If you''ve never used it, have a play with first: Just click the Record
    button and say something (you''ll see the waveform plotted), and then press the
    Stop button, press Rewind, and press the triangular Play button.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_426_0.png)'
