- pgno: 456
  md: '![](img/df9a01bf057d58c2401b5edabd6e8829_456_0.png)


    The photo booth was triggered when somebody tweeted the booth to say what color
    she was wearing. The composite photo, a single image that showed all three angles,
    was tweeted back to her. The tweet also included a response that was appropriate
    for the color she said she was wearing if it was one of the hundred recognized
    color names (although the developers said they later found that a Raspberry Pi
    could have done this job, too). The controller ran in Python that listened for
    tweets, told the Raspberry Pis to capture images and send them to it, and then
    created the composite image. The controller connected to the Raspberry Pi using
    Secure Shell (SSH), so it could control them remotely and access their image data.


    # # Pi in the Sky


    ```

    www.pi-in-the-sky.com

    ```


    Dave Akerman uses the Raspberry Pi for high-altitude ballooning, using hydrogen-filled
    balloons. The balloons go high enough to photograph a slight curvature in the
    earth, with the darkness of space visible above the atmosphere. After two or three
    hours of ascent, the balloons burst and release their payload to fall to Earth
    on a parachute.


    CHAPTER 20 Ten Inspiring Projects for the Raspberry Pi 441'
