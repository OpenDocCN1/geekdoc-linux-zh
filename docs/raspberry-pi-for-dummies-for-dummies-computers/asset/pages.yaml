- pgno: 466
  md: 'which "Ignore the rest of this line." You might wonder why anyone would enter
    information into a computer enough, he wants it to ignore, but this concept is
    often used (not often enough, some would say) to help the human users of a particular
    program or file. Any line with a = symbol at the start of it isn''t actually doing
    anything, but it''s there to guide you as you edit config.txt. Lines like these
    are called comments. (They are also used in Python, as you see in Chapter 11).


    The first two lines in config.txt say


    ```

    # uncomment if you get no picture on HDMI for a =

    #default="safe" mode

    #hdmi_safe=1

    ```


    The first line is obviously intended for you to read, but the second line shows
    the settings you need to use the HDMI Safe mode on. This takes the form that all
    settings in config.txt do — namely:


    ```

    setting_name=value

    ```


    Each setting needs a line of its own. If you wanted to turn the HDMI Safe mode
    on, you would remove the comment symbol (the hash mark) from the second line,
    or "uncomment" line, that the first two lines now read


    ```

    # uncomment if you get no picture on HDMI for a =

    default="safe" mode

    hdmi_safe=1

    ```


    Don''t remove the = symbol from the line of instructions. It remains a comment
    that''s intelligible only to human readers. You should remove the = symbol from
    lines you want the computer to do with something.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_466_0.png)


    Just taking out that single hash mark makes all the difference! Save the file
    (Ctrl+O) and reboot the computer, and Safe mode is activated. You can reboot the
    Raspberry Pi with the following command:


    ```

    sudo reboot

    ```


    If you need to disable a setting, you can just put a = symbol in front of it to
    turn your line into a comment that the computer will ignore.


    You can add your own comments too. It''s a good idea to add a line starting with
    a = symbol to remind yourself what you changed and when, in case you need to change
    the settings back later.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_466_1.png)


    APPENDIX A Troubleshooting and Configuring the Raspberry Pi 451'
