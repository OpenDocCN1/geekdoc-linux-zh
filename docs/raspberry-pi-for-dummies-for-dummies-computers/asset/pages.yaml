    Internet.


    +   >> sys: This directory is used for Linux operating system files.


    +   >> tmp: This directory is used for temporary files.


    +   >> usr: This directory is used for the programs and files that ordinary users
    can access and run.


    +   >> var: This directory stores files that fluctuate in size (or are variable),
    such as databases and log files. You can see the system message log with the command
