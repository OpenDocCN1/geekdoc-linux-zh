    # Pedestrian Crossing


    The dice project covered in the preceding section is all about displaying patterns.

    The Pedestrian Crossing project is about time and sequences. It simulates a U.K.

    pestrian crossing — basically, a traffic-light-controlled crossing initiated by

    the pedestrian''s pressing a button. These crossings are also common in the United

    States, but a little of the detail may be different from state to state, let''s
    first go

    through the sequence we''re trying to simulate.


    The crossing has a three-light traffic control — red, amber, green — and the

    pestrian has a two-light system — Cross (or Walk), which is green, and Don''t

    Cross (or Don''t Walk), which is red. The normal state of the crossing is that
    the

    green light is on for the traffic and all the other lights are off. There''s a
    button at

    crossing for the pedestrian to request a stop, and a traffic sensor is buried

    in the road. This sensor controls how quickly the crossing sequence will start
    after

    testrian presses the button. If no traffic has been detected recently, the

    sequence starts immediately, otherwise, there''s a delay. This ensures

    ab busy road isn''t stopped too many times by pedestrians or jokers, whereas a

    quiet road will not make pedestrians wait before they can cross. Once the

    Request button is pressed, the Don''t light immediately comes on.


    When the crossing sequence begins, the green light turns to amber and

    to to red. Then the green crossing light comes on, and at many crossings, a

    sound "bleeps" to help blind people cross. After a period of time, it may be safe

    t continue crossing but not be safe to start a crossing, so the green light and


