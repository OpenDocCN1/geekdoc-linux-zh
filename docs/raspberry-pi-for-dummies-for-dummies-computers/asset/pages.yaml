    the LEDs, because they''re powered with 5V, not a 5V logic-level signal to drive
    them. It just so happens that the LED''s specifications state that the minimum
    level sufficient to be a Logic One is 0.7 times the voltage. For a 5V supply voltage,
    this means a logic high of 3.5V, which is just over the 3.3 volts you get from
    a GPIO pin. It turns out it seems to work despite this, the problem is that it
    is not guaranteed to work in all conditions and temperatures. That means a driver
    circuit is often needed to boost the clock and data signals to 5V. This becomes
    more important the further away the first LED is from the Pi and the more interference
    there is in the local environment from things like motors or fluorescent light
    fittings. Figure 17–9 shows a signal driver you can make yourself with 74LS14
    or 74AHCTC14.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_395_0.png)


