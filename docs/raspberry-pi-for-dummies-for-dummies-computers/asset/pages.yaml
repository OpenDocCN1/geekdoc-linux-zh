    # Chapter 17

    Lots of Multicolored

    LEDs


    Chapter 16 shows you how to control LEDs in terms of both patterns and sequences.
    We''re going to get colorful and look at multicolored LEDs. We use different colors
    of LED in Chapter 16''s Pedestrian Crossing project, where each LED has its own
    color. Another type of LED contains three different colored LEDs in the same package.
    This type is known as an RGB LED because the three colors are red, green, and
    blue.


    RGB LEDs come in three basic forms: common anode, common cathode, and separate.
    This last type, the least common, only comes in a small, 6-pin, surface-mount
    package. (This type is used in the Pimoroni Sense HAT, mentioned in Chapter 15.)
    The internal configuration of the three types is shown in Figure 17-1.'
