  md: 'There are also blocks that let you use virtual drums and pitched instruments
    to create music using Scratch. Notes are numbered: C is 60, D is 62, and so on.
    There''s a block called Play Note 60 for ø.5 Beats that plays a note with a particular
    number for a certain duration. When you click this block in the menus to specify
    which note to play, a piano opens that you can use to select the note.


    If you''re new to music, you can generally get a good result by starting with
    C, sticking to the white notes, and making sure no two consecutive notes are too
    far apart on the piano.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_193_0.png)


    You can use a block Set Instrument to 1 to change the instrument, but if you want
    to use this, you need to install the different instruments first if you''re using
    the original Scratch. To do so, click Terminal on the task bar at the top of the
    desktop and issue these commands in the Terminal window (explained in greater
    depth in Chapter 5):


    ```

    sudo apt-get update

    /usr/share/scratch/timidityinstall.sh

    ```


    Finally, in order to finish the instruments, you need to reboot the Raspberry
    Pi. Save your work in any applications first, and then open the Applications menu,
    click Shutdown, and choose Reboot.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_193_1.png)


    The notes used in Scratch are the same as those used in Sonic Pi.(See Table 14-1,
    in Chapter 14).


    # Creating scripts


    Clicking blocks in the Blocks Palette is one way to issue commands to Scratch,
    but if that''s all you''re doing, you''re not really programming. The fact is,
    if you have to click each block every time you want to run it, you''re doing all
    the hard work of remembering the instructions, and the computer work only as fast
    as you can click the blocks.


    A program is a reusable set of instructions that can be carried out (or run) whenever
    you want. To start to create a program, you drag blocks from the Blocks Palette
    and drop them in the Scripts Area of the screen. Most blocks mentioned so far
    in this chapter have a notch on the top and a lug on the bottom, so they fit together
    like jigsaw pieces. You don''t have to align them perfectly; Scratch snaps them
    together for you if they close enough when you release the mouse button.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'You put your blocks in the order you Scratch to run them, starting at the top
    and working your way down. It''s a bit like making a to-do list for the computer.


    A group of blocks in the Scripts Area is called a script, and you can run the
    script by clicking anywhere on it. Its border is highlighted, and you will see
    the cat around the Stage as you''ve instructed it to.


    You can have multiple different scripts in the Scripts Area, so you could have
    one to make the cat walk left and another to make it walk right, for example.
    When you add multiple sprites (see Chapter 10), each script has its own Scripts
    Area to control it.


    If you want to tidy the Scripts Area, you can move a script by dragging it off.
    If you drag a block that is lower down the script, it is separated from the blocks
    above it and carries with it all of the blocks below it. If you want to delete
    a block or set of blocks, drag it back to the Blocks Palette on the left.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_194_0.png)


    TIP


    The moonwalk, popularized by Michael Jackson, makes you look like you''re walking
    forward while you''re actually moving backward. Figure 9-12 shows how to make
    your cat moonwalk across the Stage. The first two lines in the script reset the
    cat to the middle of the screen, facing right. The cat tells you that it loves
    moonwalk and then lets out a little whoop like Michael Jackson''s, which continues
    for the duration of the dance. The costume changes the position of the cat''s
    legs, and it glides 150 units to the left. Close the bubble by using the Say block
    with nothing in it, and then switch back to the other costume, which makes the
    cat''s legs back to their default position. If you go!


    FIGURE 9-12:

    This is how you make a cat moonwalk. Ow!


    ```

    go to x: 0 y: 0

    point in direction 90

    say I love to moonwalk for 2 secs

    switch to costume costume2

    glide 1 secs to x: -150 y: 0

    say Ow!

    switch to costume costume1

    ```


    Scratch is developed by the Lifelong Kindergarten Group at the MIT Media Lab.
    See https://scratch.mit.edu.


