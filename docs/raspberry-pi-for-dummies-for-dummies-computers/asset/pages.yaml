  md: '**Point in Direction 90:** Whatever direction your sprite is facing, this block
    points it in the direction you want it to face. Use this block as is to reset
    your sprite to face right. You can change the number in this block to change the
    direction you want your sprite to, and the numbers are measured in degrees from
    the position of facing up.(See Figure 9-4). It helps to think of it like the hands
    of a clock: when the hand is pointing right, it''s 90 degrees from the 12 o''clock
    position; when it''s pointing down, it''s 180 degrees from the top. To point left,
    you use -90. When you click the arrow in the right of the number box, it gives
    you a menu from which you can select the four main directions — but you can enter
    any number.


    0


