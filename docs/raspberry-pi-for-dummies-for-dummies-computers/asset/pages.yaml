- pgno: 109
  md: '# Using relative and absolute paths


    We''ve been discussous how to move between directories that are immediately above
    or below each other on the directory tree, bit like the way you might work in
    a desktop environment. You click on one folder, click to open the folder inside
    it, and click to open the folder inside that. It''s easy (which''s why it''s popular),
    but if you''re going to a complex directory structure, it soon gets tedious.


    If you know where you''re going, the shell enables you to go straight there by
    specifying a path, which is a description of a file''s location. There are two
    types of paths: relative and absolute. A relative path is bit like giving directions
    to the directory from where you are now (go up a directory, down through the Desktop
    directory, and there it is!). An absolute path is more like a street address:
    It''s exactly the same wherever you are.


    Absolute paths are usually measured from the root, so they start with / and then
    list the directories you go through to find the one you want. For example, the
    absolute path to the pi directory is /home/pi. Whichever directory you''re in,
    you can go straight to the pi directory using


    ```

    /home/pi

    ```


    If you wanted to go straight to the Desktop directory, you would use


    ```

    /home/pi/Desktop

    ```


    To go straight to the root, just use a slash by itself, like this:


    ```

    /

    ```


    Besides the root as a reference point for an absolute path, you can also use your
    home directory, which you represent with a tilde (~). You can use it by itself
    to jump back to your home directory:


    ```

    ~

    ```


    Alternatively, you can use it as the start of an absolute path to another directory
    that''s inside your home directory, like this:


    ```

    ~/Desktop

    ```'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Relative paths use your current working directory as the starting point. It''s
    shown in the command prompt, you can also check it by entering the command


    ```

    pwd

    ```


    Whereas the command prompt uses the tilde (~) character if you''re in your home
    directory, pwd tells you what is actually on the directory tree and reports it
    as /home/pi.


    A relative path refers to a subdirectory below the current one just lists the
    path through the subdirectories in order, separating them with a slash. For example,
    in Figure 5-1, you can see a directory home, with a directory pi inside it, and
    a directory Desktop inside. When you''re in the directory with the name home,
    you can change into the Desktop directory by specifying a path of pi/Desktop,
    like this:


    ```

    pi@raspberry ~ $ cd pi/Desktop

    pi@raspberry ~/Desktop $

    ```


    You can change into any directory below the current one in this way. You can also
    have a relative path that goes up the directory tree using .. to represent the
    parent directory. Referring to Figure 5-1 again, imagine that you want to go from
    the Desktop directory into the python_games directory. You can do that by going
    through the pi directory using this command:


    ```

    pi@raspberry $ cd ..../python_games

    pi@raspberry ~/python_games $

    ```


    As the prompt shows, you''ve moved from the Desktop directory into the python_games
    directory. You started in Desktop, went into its parent directory (pi), and then
    changed into the python_games directory there. You can go through multiple parent
    directories to navigate the tree. If you want to go from the pi directory to the
    boot, you could use


    ```

    pi@raspberry ~ $ cd ../boot

    pi@raspberry /boot $

    ```


    That takes you into the parent directory of pi (the directory home), takes you
    up one more level to the root, and then changes into the boot directory.


    You can choose to use an absolute or relative path, depending on which is most
    convenient. If the file or directory you''re referring to is relatively close
    to your current directory, it might be simplest to use a relative path. Otherwise,
    it might be confusing to use an absolute path. It''s up to you. Paths like this
    aren''t


