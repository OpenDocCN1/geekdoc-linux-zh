- pgno: 396
  md: '# Display update


    Finally, you have to deal with the update question, or how fast the patterns shown
    by the LEDs can be changed. Using the bit-banging technique we described earlier
    in this chapter, it can take between 0.45 and 0.23ms to send out the data to a
    single LED. This time difference occurs because Linux steals time from any running
    program, and so the time for a refresh depends on what the operating system is
    doing at the moment. If this interruption occurs in crucial time when the program
    is bit-banging the data out to the LEDs, then the bit banging data refresh takes
    longer. This means that for 144 LEDs, you can update the pattern they show about
    15 times per second, at the slowest. Once updated, they require no further intervention
    from the Raspberry Pi until you need to update them again.


    # Getting more LEDs


    There are various ways you can get more LEDs to play with, and perhaps the most
    exciting is the series of shapes you can get from the RasPIO Inspiring programmable
    LED boards. Shapes range from straight strips, circles, semicircles to triangles
    squares. There''s also a driver board for producing the correct voltage signals
    and, as a bonus, a socket on this driver board allows you to plug in an analogue-to-digital
    converter chip. That means you can measure analogue voltages for items like control
    knobs and sensors. Figure 17-10 shows the triangle and straight strip.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_396_0.png)


    FIGURE 17-10: Some shapes from the RasPIO Inspiring LED range.'
