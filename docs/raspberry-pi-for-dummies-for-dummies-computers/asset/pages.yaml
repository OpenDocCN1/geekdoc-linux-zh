- pgno: 397
  md: 'The great thing about these shapes is that they''re easy to set up. Each strip
    has a plug and socket on it, for input and output, thus enabling us to easily
    chain together as many strips as you want. The triangle is our favorite — use
    two or three to make a 3D prism. In addition to working with your Raspberry Pi,
    they can be used on a number of other controllers.


    # LED strips


    Another popular for getting lots of these LEDs already wired together is to get
    them on a flexible, printed circuit board. These come in various lengths, from
    half a meter to 4 meters. Be sure to get the APA102 and not WS2812 type, to ensure
    that they work with all in the book. You can get 30, 60, or 144 LEDs per meter
    — as you''d expect, the cost is related to the number of LEDs. These strips also
    come in a variety of options — black or white backing, coated in silicon, or in
    a waterproof silicon tube. You can easily cut these strips into lengths, if need,
    with a sharp blade.


    In addition to the RGB light, the APA102 comes in a white-only LED variant. These
    are good for domestic lighting and can be dimmed easily.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_397_0.png)


    # LED matrix


    One form to get these LEDs is in an LED matrix. Adafruit sells a number of configurations
    — the biggest (and most expensive) model is a 240mm rigged disk. If that''s not
    what you want, you can get an 8x32 grid, 16x16 or 8x8 grid, all on a flexible
    board. However, our favorite is a high-density 8 x8 grid, on a ridged board. Its
    main feature is, that instead of using the 5 x5mm standard LED matrix, to use
    a 1.8x1.8mm package. This means the whole grid can be fitted into an display inch
    square. This tiny LEDs only take 40mA when fully on, so they take less than the
    normal-size LEDs. However, this also adds to a maximum of 2.5A. At that amount
    of current, the board will get quite warm as well. Nevertheless, it can be bright,
    so keep the brightness down. You will need to do a bit of soldering to connect
    the wires and the supplied capacitor to the back of the board, but these are all
    marked. We also wired the 5V and ground output to the 5V and ground input, to
    get a better power distribution on the board. This is shown in Figure 17-1.


    Such a small matrix has many applications, one of which is to make a smart reactive
    board. We thought we would like to have a go at this, and so we come with some
    colorful moving–display patterns.


    We''re spoiled these days when it comes to graphics, because all their primitive
    functions — like drawing lines and squares — are built into most languages. However,
    when faced with a display like this matrix, it is necessary to write your own.'
