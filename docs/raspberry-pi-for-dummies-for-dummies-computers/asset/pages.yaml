  md: '![](img/df9a01bf057d58c2401b5edabd6e8829_43_0.png)


    This is great reason to have a cup of tea, because the card takes about an hour
    to format. You can still use your Mac while the process is running, although it
    might take a bit longer to format if you do. When the formatter is finished, you
    see the icon of the SD or MicroSD card on the desktop. Note that if the SD card
