    +   > testfile.txt


    # TOP TIPS FOR NAMING YOUR FILES


    If you plan to use the shell, you can follow a few guidelines when creating files
    that will make your Linux life much easier. These tips apply even if you''re creating
    files using the desktop environment, but it only really matters when you start
    working with files in the shell.


    Here''s our advice:


    +   - Only use lowercase so that you don''t have to remember where the capital
    letters are in a filename.

    - Don''t use filenames with spaces. They have to be treated differently in the
    shell (put inside single or double quote marks); otherwise, Linux thinks each
    of the words in the filename is a different file. An underscore is a good substitute.

    - Don''t use filenames that start with a hyphen. They''re liable to get confused
    with command options.

    - Don''t use the / anywhere in a filename.

    - Avoid using an apostrophe (''), question mark (?), asterisk (*), quotation (or
    speech) marks ("), backslash (\), square brackets ([]) or curved braces ({}).
    If they appear in a filename, you''ll need to either put a \ character before
    each one or put the whole filename in speech marks (assuming that it doesn''t
    already have any). You can''t use a forward slash (/) at all.


    CHAPTER 5 Using the Linux Shell 105'
