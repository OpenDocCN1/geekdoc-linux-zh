  md: "Now we'll describe how to blink these two LEDs at totally independent rates.\
    \ The state of each task is given by a state variable, with the two values 0 or\
    \ 1. The state variable shows if the light is on or off so that you know you need\
    \ to do for the next stage of the blinking task. The time between each change\
    \ of state of the LEDs is controlled by a variable that gives the time the change\
    \ must occur. This time is calculated by adding the current time to the length\
    \ of time you want to elapse before the next LED state change. This can be the\
    \ same for all states or for each. The example in Listing 16-10 has the same time\
    \ for the on/off times of LED1, but a separate/off time for LED2.\n\n# LISTING\
    \ 16-10: Blinking Two LEDs at Different Rates\n\n```\n#!/usr/bin/python3\n# Two\
    \ blanks By Mike Cook\nimport time\nimport RPI.GPIO as io\n\nled1 = 23\nled2 =\
    \ 24\nled1BlinkRate = 0.5 * the speed of blinking\nled2Time = 0.5 ; led2offTime\
    \ = 0.51\nled1State = 0\nled2State = 0\nlink1Time = time.time()\nlink2Time = time.time()\n\
    \ndef main():\n    print(\"Two blanks Ctrl C to quit\")\n    initGPIO()\n    while\
    \ 1:\n        if time.time() > blink1Time:\n            blink1()\n        if time.time()\
    \ > blink2Time:\n            blink2()\n\ndef blink1():\n    global blink1Time,\
    \ led1State\n    if led1State == 0:\n        io.output(led1,1)\n    led1State\
    \ = 1\n```\n\n(continued)"
