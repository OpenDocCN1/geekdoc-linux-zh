- pgno: 191
  md: '> >> Set to 100%: This block sets the size to a percentage of its original
    size, so with the default value of 100 percent, it effectively resets resizing
    you''ve done.


    You can also select the check box beside the Size block to show the sprite''s
    size on the Stage, in the same way you display other sprite information. (See
    “Show-ing information on the Stage,” earlier in this chapter.) This can be useful
    for testing purposes.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_191_0.png)


    # Changing your sprite''s visibility


    Sometimes, you might not want your sprite to be seen on the Stage. If a spaceship
    is blown up in your game, for example, you want it to disappear from view. These
    two blocks you control whether a sprite is visible:


    > >> Hide: Use this block to make your sprite invisible on the Stage. If a sprite
    is hidden, Scratch won''t detect when it touches others, but you can still move
    a sprite''s position on the Stage so that it''s in a different place when you
    show it again.


    > >> Show: By default, your sprite is visible, but you can use this block to reveal
    it after you have hidden it.


    Sometimes, sprites might get on top of each other. You can use the Go to Front
    block to make a sprite appear on top of all the others. To push a sprite backward
    and allow others to appear on top of it, use the Go Back ! Layers blocks.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_191_1.png)


    # Adding sounds and music


    As well as changing a sprite''s appearance, you can give some sound effects. Scratch
    comes with sounds, including slurps, sneezes, and screams; ducks, geese, and owls;
    pops, whoops, and zoops. You can find effects for most occasions, and many of
    them are natural partners for one of the sprites that Scratch provides.


    To add a sound to your sprite, you have to do one task: Import the sound to your
    sprite. Here''s how you''d do that:


    +   1. Click the Sounds tab above the Scripts Area, as shown in Figure 9-11, and
    then click the Import button.


    In the original Scratch, it''s labelled Import, but in Scratch 2, the button looks
    like a tiny speaker: Don''t confuse it with the larger speaker used to represent
    any existing sound effect on the sprite.


