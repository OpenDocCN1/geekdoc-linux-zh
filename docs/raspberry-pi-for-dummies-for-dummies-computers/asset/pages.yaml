- pgno: 273
  md: 'minor issue with it: The Cursor misbehaved when we maximized the window. You
    might also experience issues with the screen display not being aligned with the
    window correctly, and there is no sound.


    See the Introduction for details of where you can download the code for this chapter.
    The full listing is at the end of the chapter, which can help you to find your
    way around the code as you build this project.


    # # Playing Minecraft


    Minecraft is preinstalled in Raspian. You start it by clicking it on the Applications
    menu at the top left of the screen, where Minecraft Pi is filed under Games. When
    you start Minecraft on the Raspberry Pi, the title gives you two options:


    +   **Start Game:** Generates your own world to explore. You can also use this
    option to choose a previously generated world to visit, when you replay Minecraft.
    To choose between different worlds, click and drag them left and right to position
    your chosen one in the middle, and then click it to open it.


    +   **Join Game:** Lets you join other players on a local network. A discussion
    of this option is outside the scope of this chapter, but this option can enable
    collaborative or competitive play in a Minecraft world.


    Click Start Game and choose Create New, and Minecraft generates a new world for
    you, with its own, distinctive terrain of mountains, forests, and oceans. When
    it''s finished, you see a first-person view of it. (See Figure 13–1)


    ![](img/df9a01bf057d58c2401b5edabd6e8829_273_0.png)


    You can change your perspective to see the player''s character in the game. Press
    the Esc key to open the Game menu, and then click the icon beside the Speaker
    icon in the top left to change the perspective.


    When you''ve finished, you can exit the game by pressing the Esc key to open the
    game menu and then choosing Quit To Title.


    # # Moving around


    Minecraft is easy to use two hands — one on the mouse and one on the keyboard.
    Use the mouse to look around you and change your direction, sliding left and right
    to turn sideways, and forward and backward on the desk to look up and move. To,
    use the keys W and S for forward and backward, and A and D to take a sidestep
    left and right. These keys form a cluster on the keyboard, which makes it easy
    to switch between them.'
