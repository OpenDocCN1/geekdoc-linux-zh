    The diagram is quite similar to what we have shown in this chapter, except that’s
    arranged differently. First, there are two push buttons for the traffic sensor
    and cross request. Next are five LEDs connected to resistors and GPIO pins. Note
    here, though, you need different colours of LED — two red, two green, and a yellow.
    Finally, there’s the sounder. We are using a piezo sounder, but a word of warning
    is in order here: There are two types of piezo sounders, and these to be universally
    accepted what to differentiate between the two. The sort you want is one that
    generates sound when you apply a voltage to it. These could be called self-drive
    sounders, but sometimes they are red. Other times, they can be referred to as
    buzzers, but don’t confuse them with electromagnetic buzzers, which take a lot
    of current — too much for the Pi. A suitable one would work from 3V and less than
    10mA. The type you want is the one where you have to supply an electric pulse
    to it before it makes a noise. This type is called a speaker-type sounder. A simple
    test is to use the 3V output and ground of the Pi and then make the contact. If
    it only clicks, it’s a speaker type. If it makes a sound, it’s the type you want
    to use.(To be honest, in development, we replaced the sounder with an LED and
    resistor, to reduce the annoying beeps.)


    The layout of this circuit on a breadboard is shown in Figure 16-15. We have arranged
    the traffic–control LEDs like traffic lights, and the cross indicators above each
    other like you would want on a real-life crossing.


