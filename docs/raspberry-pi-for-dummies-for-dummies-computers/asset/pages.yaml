  md: 'By default, the sound is set to pass through your HDMI cable. If you want to
    use your Raspberry Pi''s audio output (and speakers) but you''re using HDMI for
    your screen, you''ll need to change the audio setting from HDMI to Analog. You''ll
    find this option on Kodi''s System settings menu. When you''re viewing the settings
    menu, select Audio on the left and select Audio Output.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_173_0.png)


    # # Using a Remote Control


    Considering all the functionality we''ve covered in this chapter, you''re not
    far away from running a low-power home media center. To complete it, you can use
    a remote control.


    There are many ways to remotely control your Raspberry Pi media center. You can
    use USB device, a cheap infrared remote, a keyboard remote, or even your Xbox
    controller, if you have one. Or you can use the Kodi remote app (available for
    iOS and Android operating systems) to control Kodi on your Raspberry Pi.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_173_1.png)


    You can find the remote-control settings on Kodi''s System Settings menu, and
    then Input. You might find that your remote control works without needing to change
    anything, so try it.


    If you have a television that supports the HDMI CEC (Consumer Electronics Council)
    standard, a neat option is to enable your existing television remote to control
    your PI. To do this, connect your networked Pi to your television''s HDMI socket.
    XBMC appears as a new input. Use the TV''s remote control to change to this Input,
    and your Home screen then appears on the television.


    # # Turning Off Your Media Center


    To turn off your media center properly, click the Shutdown button in the top left
    of the Kodi menu. You can just switch off the power supply, but you minimize the
    risk of corrupting your SD card or MicroSD card by shutting down properly.


    # # Playing Music in the Desktop Environment


    Looking for musical inspiration while you program? The good news is that you can
    also play music and video from the Raspbian desktop environment. (See Chapter
    4.) If you''re using LibreELEC or OSMC, shut down your Raspberry Pi'
