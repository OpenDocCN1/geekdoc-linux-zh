  md: '# Customizing the Desktop


    You can do a few things to stamp your identity on PIXEL and make it easier to
    use. With other desktop computers you might have used, you can change the look
    and feel of it. To find the options for this, click Appearance Settings in the
    Preferences section of the Applications menu.


    In the desktop options, you can change the picture used as a backdrop (the wall-paper),
    change the desktop color if you''re not using wallpaper, and change the color
    of icon descriptions (the text color). You can tick a box to display your Documents
    folder and mounted disks on the desktop, which makes it easier to find your files.
    The Menu Bar gives you options for changing the size, position, and


    The search menu has options to find a particular word or phrase, jump to a particular
    line in the document, or replace a word or phrase with an alternative. You can
    click the box to replace all in one, or step through them individually. The search–replace
    feature highlights all occurrences in yellow, and highlights in blue the it''s
    currently focused on. You can use the search menu to move forward or backward
    through the list of results.


    The Options menu (refer to Figure 4–12) has options to change the font (although
    the choices are more limited than you''re probably used to), switch on word wrap
    (which means text starts a new line when it reaches the edge of the window, instead
    of a horizontal scroll bar appearing), and switch on line numbers (refer to Figure
    4–12). The auto-indent feature means that any indentation used on one line is
    automatically applied to the next line when you press Enter.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_97_0.png)


    Figure 4–12:

    The Leafpad text editor.


    Leafpad, written by Taro Osuji, with help by Lapo Calamandre; Raspberry Pi Foundation


