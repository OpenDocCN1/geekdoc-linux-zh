    # Starting a New Scratch Project and Deleting Sprites


    If you''ve been playing with Scratch and have blocks and scripts scattered over
    the screen, you can start a new project by clicking File on the menu at the top
    of the screen and then choosing New.


    All projects start with the Cat sprite in, so the first thing you need to do is
    delete it. Here are the three ways you can delete a sprite:


    +   - Right-click the sprite on the Stage, and then choose Delete from the menu
    that appears.

