- pgno: 453
  md: 'Michael Clemens has used the Raspberry Pi to create an audiobook player for
    his wife''s grandmother, who is visually impaired and finds digital audio players
    difficult to use.


    This project requires some electronics work — you add transistors, an LED, a pair
    of speakers, and a large button to a plastic case and link the button and LED
    to the Raspberry Pi''s GPIO pins.


    A Python script enables the button to control the media player software: Pressing
    the button pauses or plays the audiobook, and holding it for 4 seconds sends it
    back one track.


    To change the audiobook, you just plug in a USB drive with the new audiobook on
    it. It''s automatically copied across to the Raspberry Pi, replacing the old audiobook.


    Look for instructions, Python code, and photos on Michael''s blog.


    # Weather Station


    ```

    http://steewardell.wordpress.com/tag/raspberrypi

    ```


    Steve Wardell heard about the development of the Raspberry Pi, he decided that
    it could be the ideal computer to connect to his WS2350 weather station, replacing
    his Windows PC. One challenge he had to overcome was to find an adapter that would
    enable the weather station, which has a serial port, connect to the Raspberry
    Pi''s USB port. He tried a couple that didn''t work before finding with an FT232RL
    chip that did.


    The Raspberry Pi gathers information from the weather station using Open2300,
    a package of tools for reading data from the weather station. Steve''s written
    a Python script that converts this data into a tweet and posts it on Twitter,
    and he is now looking using the Raspberry Pi to post weather updates on his website.


    On Steve''s blog, you can find a couple of articles explaining what he''s done
    and how he overcame some of the technical hurdles of integrating all the different
    systems.'
  merge: -1
  img_proc: true
- pgno: 454
  md: '# Heart Rate Monitor


    www.raspberrypi.org/magpi/heartbeat-monitor


    Daniel Fernandez connected a heart monitor to a Raspberry Pi so he could have
    more flexibility in capturing and using its data. The aim was to be able to see
    a graph showing the results while he ran on the treadmill, and be able to export
    the results in a standard format for in-depth analysis, such as CSV, which can
    be read by Excel or LibreOffice.


    He used a Polar H7 heartbeat sensor and a Raspberry Pi 3 with a 3¹½-inch screen,
    which displays an easy-to-read graph as he runs. Everything was packaged in a
    protective case.


    # Electric Skateboard


    www.youtube.com/watch?v=2WLEur3M8Y


    You can use a Raspberry Pi as the guidance system on a motorized skateboard, as
    TheRaspberryPiGuy demonstrated on YouTube. He attached an Alien Power Systems
    to the skateboard and used a Pi Zero to control it.


    Acceleration is controlled using a remote control from Nintendo''s Wii console,
    sending signals to the Pi over Bluetooth. In your video, you can see speeding
    through the streets of Cambridge, U.K., hometown of the Raspberry Pi Foundation.
    His top speed is 30 kilometers an hour, and he estimates the battery power is
    enough for at least 10 kilometers.


    As an upgrade, you could add a Pi-powered speedometer, as shown in this tutorial,
    which also shows you how to build the board itself: www.instructables.com/id/The-Longboard-Speedometer.


    # T-Shirt Cannon


    ```

    http://drstrangelove.net/2014/01/raspberry-pi-powered-t-shirt-

    cannon

    ```


    David Bryan and Lucas Saugen turned to the Raspberry Pi when they were asked to
    repair the T-shirt cannon used at the Minnesota RollerGirls'' roller derby matches.


    CHAPTER 20 Ten Inspiring Projects for the Raspberry Pi 439'
  merge: -1
  img_proc: true
- pgno: 455
  md: 'The cannon is used to fire T-shirts into the audience during the timeouts,
    which last for up to a minute-and-a-half. They wanted a design that would enable
    more than one T-shirt to be fired in that period, and that would also enable the
    cannon to tweet a photo when a T-shirt was fired.


    The resulting design uses four PVC tubes for the barrels, and compressed air to
    fire the T-shirts. The cannon has three buttons: one to choose which barrel to
    fire from, and the other two that are pressed together to fire a shirt. As an
    additional safety measure, a key is required to disarm the cannon. The Raspberry
    Pi is used to control the device, with software written in Python that uses the
    GPIO libraries.


    To find out how the cannon was built, watch videos, and download the code, visit
    David''s website.


    # Panflute Hero


