  md: '# Current limits


    Current is the first and biggest limitation when trying to drive LEDs. Sure, one
    LED only draws a small amount of current, but any small number when multiplied
    by a big number starts to be important. Suppose that you''re running your Raspberry
    Pi off a 2A power supply—roughly twice the peak current that the Pi needs. You
    should never keep the maximum rated current at about 80 percent of rated current.
    With a 2A power supply, that ends up to 1.6A. It is therefore reasonable to say
    that you have a maximum of 0.6A, or 600mA (milliamps), of current in a typical
    setup. If each LED draws 60mA, that is 20mA for each color. With that setup, you
    can drive a maximum of 10 LEDs with a white color at pull


    Now, APA102C are very bright and overpowering at close range. Luckily, there are
    two ways to control the brightness, and if it''s controlled, you use current and
    can drive more LEDs. The first way is to scale down the PWM values, instead of
    using a value of 255 for a red, you''d simply use 128 and that will use the full
    color


    ![](img/df9a01bf057d58c2401b5edabd6e8829_394_0.png)


    Easy to say, but programming mistakes can easily put and unintended values into
    the PWM control. It''s also the case that when PWM doesn''t limit the peak current
    the LEDs—only the average current. Nevertheless, the PWM control is capable of
    splitting the 20mA per LED to 78ua (microamp) steps.


    A better way of controlling the brightness of the APA102C is by using the brightness
    control individually with the PWM values. So, we have shown you how to set the
    brightness at a fixed level and then ignored it—this is a good strategy because
    it means you have a great deal of protection from programming errors. The brightness
    control actually limits the current through the LEDs and is controllable in 33
    steps. Full current is given by a brightness of 31, and other values give the
    number of 31ths of full current. So, if a single LED takes a maximum of 60mA,
    then with a brightness of 8, it will only take a maximum of 15.48mA. So the spare
    600mA can drive 38 LEDs. Even, a brightness of 8 is very bright when looking directly
    at an LED. A brightness of 2 pushes up to number 155 LEDs and still looks good.


    Anything over 155 LEDs and you will have to resort to an external power supply.
    It''s quite easy to use: Just supply the 5V and the LEDs and make sure the ground
    of the power supply is connected to the ground of the Raspberry Pi.


    # Signals and memory


    The other limitations you have to deal with concern signals and memory. Fortunately
    for you, there''s no shortage of memory on the Raspberry Pi, unlike'
