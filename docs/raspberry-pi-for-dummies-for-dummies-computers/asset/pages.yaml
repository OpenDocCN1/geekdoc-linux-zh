- pgno: 358
  md: 'In Figure 16-12, we show for the sake of completeness the equivalent number
    in decimal notation, which is the counting system humans use. No one in their
    right mind would dream of using it in a program — although it would work because
    it follows the correct pattern, it''s almost impossible to know what the pattern
    is by just looking at the number. In other words, it makes for bad code.


    Keep in mind that the actual numeric value of this pattern number has no meaning
    at all — the meaning is in the binary pattern. Often, beginners ask how to convert
    a number into binary, but there''s no need because number stored in the computer
    is already in binary format. Only when you need to do a task do you need to convert
    a number from binary into something else, and the print statement does for you.
    All you need now is some way to read that "bit pattern number" and turn it into
    the action of switching the LEDs on and off. If you have to unpack that information
    and turn it into a pattern — and do it efficiently enough.


    So let''s break this down and see if you can do for this one bit of the pattern
    — let''s say the least significant, or right-hand, bit. If it is 1, turn the LED
    on, and if its 0, turn off. You can handle this task with:


    ```

    io.output(LEDnumber,pattern & 1)

    ```


    The variable LEDnumber has, as you might suspect, the LED number you want to control,
    and the called pattern has the bit pattern you''re trying to produce. The & &
    symbol means the arithmetic AND operation. The AND operator takes two numbers
    and compares the contents of each bit individually. If both contain a 1 in the
    same position, the result is a 1. Otherwise, the result for position is 0. So,
    when you''re ANDing the number 1 with the pattern number, the result is to zero,
    or remove all bits except the least significant, isolates a bit in the pattern
    variable. If the least significant bit in the pattern variable was a0. If so,
    a statement returns a 1 — which is just the number you need to put in the output
    command to turn that LED on or off. (We say the number here is a mask because
    it masks out bits you don''t want.)


    Now, what about the LED that changes every time we want to look at a different
    bit in the pattern? Instead of a single number we need a list. The list is made
    up of the GPIO numbers that control each LED. The first element in the list is
    the GPIO number that controls LED 0, which, according to the schematic, is GPIO
    23. Finally, you need a way to move the bit pattern in the pattern one to the
    right so that the same instruction will do thing


    CHAPTER 16 Taking Control of Pi''s Circuitry 343


    ![](img/df9a01bf057d58c2401b5edabd6e8829_358_0.png)'
