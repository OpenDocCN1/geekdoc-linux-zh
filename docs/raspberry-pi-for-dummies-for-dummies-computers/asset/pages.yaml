- pgno: 80
  md: 'to left, the rightmost edge shows the latest information. A gray bar that fills
    the height of the graph indicates that your Raspberry Pi is working flat out,
    so it might take a moment or two to respond to you, Especially when starting programs.
    In our experience, the Raspberry Pi doesn''t crash often, but older models can
    sometimes be overwhelmed by the extent that it looks like has. It''s worth being
    patient.


    You can see which programs are running on your Raspberry Pi by running the Task
    Manager. (Refer to Figure 4-3.) You can find it in the Applications menu in the
    Accessories folder, but you can also go straight to it by holding down the Ctrl
    Alt keys and pressing Delete.


    If you have a program that is not responding, you can stop it by using the Task
    Manager. To terminate the program, right-click it in the task list and choose
    Term from the menu that appears. This sends a request to the program and gives
    it a chance to shut down safely, closing any files or other programs you use.
    Alternatively, you can choose Kill. It terminates the program, with the possible
    loss of data.


    You should use the Task Manager to close programs only as a last resort. Most
    of the tasks you see in the ''Task Manager'' are system tasks, which need to be
    running for PIXEL to work properly. Avoid programs you don''t recognize — that
    might crash PIXEL and result in losing data in any open applications.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_80_0.png)


    # Using File Manager


    You can manage your files using the command line (see Chapter 5), but it''s often
    easier to do in PIXEL. File Manager (see Figure 4-4) is used to browse, copy,
    delete, rename, and otherwise manage the files on your Raspberry Pi or connected
    devices.


    You start File Manager by clicking its button at the top left of the desktop or
    using the Applications menu, where it is among the system tools.


    In Linux, people usually talk of storing files in directories, PIXEL uses the
    term folders instead, which is probably familiar to you from other computers you''ve
    used. A folder is just a way of grouping a collection of files or programs and
    giving that collection a name. You can put folders inside other folders too.'
