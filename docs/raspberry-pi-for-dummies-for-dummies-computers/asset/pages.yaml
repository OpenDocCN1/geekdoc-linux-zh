- pgno: 378
  md: 'Admittedly, these LEDs aren''t much to look at. They''re most commonly packaged
    in 5mm-square surface-mount packages, as shown in Figure 17-4. The tiny baby squares
    are the actual chips containing the PWM generator and the memory to hold the RGB
    values. The blank-looking areas are the parts where the light is generated.


    Light emitting areas


    Controller Chip


    Light emitting areas


    ![](img/df9a01bf057d58c2401b5edabd6e8829_378_0.png)


    APA102C


    ![](img/df9a01bf057d58c2401b5edabd6e8829_378_1.png)


    You can get NeoPixels in conventional LED packages – not the surface mount type,
    in other words as well as the DotStar''s 5mm-square packages. Both are available
    as individual parts as well as long strips of LEDs. The major difference between
    the two lies in how they take their commands from the computer. The NeoPixel requires
    one signal wire, and the DotStar requires two. Given that fact, you might be forgiven
    for thinking that NeoPixels are easier to use. The problem is twofold:


    +   This signal wire needs to be controlled to give a precisely timed pulse.


    +   The Raspberry Pi, with its Linux operating system, is not good at precise
    timing.


    There are ways around this with the help of various libraries, but around comes
    at a price. The library from Adafruit works with the original Model 1 Raspberry
    Pi as well as the Pi Zero, and the one from Pimoroni, working on all models of
    Pi, uses the hardware that normally generate the audio for the jack socket. (You
    can still get sound from the HDMI connector, but not from the audio jack because
    it can cause the LEDs to flash randomly.)'
