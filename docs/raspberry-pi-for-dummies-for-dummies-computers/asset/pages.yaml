- pgno: 225
  md: 'The brackets are used to enclose whatever you want to output to the screen.
    The quotes are used to mark the start and end of the text you want to show.


    As you type, you might notice that Thonny highlights your text using different
    colors. Gray is used to highlight a section that still needs a closing bracket,
    and green is used to highlight a section that still needs a closing quote mark.
    This highlighting is a feature of Thonny that helps Python beginners avoid common
    mistakes. Don''t press Enter if your code is still highlighted: You''ve left something
    out.


    Whatever you type in the quotes after the print() command is "printed" on the
    screen, and Python then returns you to the prompt so that you can enter another
    command.


    Like the Linux shell, Python is case-sensitive — it won''t work if you use capital
    letters where you shouldn''t. The command print() must be entered in lowercase;
    otherwise, Python tells you a name error, because what you entered hasn''t been
    defined. You can mess around with the word in quotes as much as you like, however:
    This is the text that you want to appear onscreen. Take a look at these examples:


    ![](img/df9a01bf057d58c2401b5edabd6e8829_225_0.png)


    ```

    >>> PRINT("Hello Leo!

    ```


    If you make a mistake entering something, you can press Ctrl-C to get back to
    the prompt and start over. In particular, if you make a mistake with brackets,
    Python might expect you to enter a multiline command and not give you a result
    or a prompt when you press Enter. The way out is to press Ctrl-C.


    # Using the shell to calculate sums


    You can also use the shell to carry out calculations. Table 11-1 shows you the
    mathematical operators you can use. Just put the sum after the print() command,
    like this:'
  merge: -1
