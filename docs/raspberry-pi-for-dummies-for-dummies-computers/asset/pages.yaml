- pgno: 449
  md: '# Beneath a Steel Sky


    The Beneath a Steel Sky game tells a fiction story about Robert Foster, a boy
    who survived a helicopter crash and was raised by indigenous Australians in a
    wasteland called The Gap. Many years later, when Robert has grown up, armed forces
    arrive in another helicopter, kidnap him, and fly back to the city. He escapes,
    and you pick up the controls to guide him on his journey of discovery. Why is
    he here? Who is in charge?


    It''s a point-and-click adventure game, shown in Figure 19-5, which means you
    solve puzzles and interact with the environment using the mouse cursor and clicking
    objects and people. The left mouse button is used to examine things and the right
    mouse button is used to take an action (such as opening or closing a door, picking
    up an object, or looking through a window). You can talk to characters in the
    game by clicking them and choosing from the provided phrases. When you move the
    cursor to the top of the screen, the inventory of items you''re carrying appears
    so that you can use items you''re carrying. To walk through an exit, click.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_449_0.png)


    Figure 19-5:

    Beneath a Steel Sky, an interactive fiction story.


    The game''s fantastic opening sequence and witty dialogue draw you in, and the
    solution is available online if you''d like to experience the full story but get
    stuck on one of the puzzles.


    434 PART 6 The Part of Tens'
  merge: -1
  img_proc: true
