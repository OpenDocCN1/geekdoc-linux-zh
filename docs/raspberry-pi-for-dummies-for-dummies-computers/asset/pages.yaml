- pgno: 171
  md: 'You can continue to browse your music while it is playing, and queue songs
    or albums to play next, by right-clicking them and choosing Queue Item from the
    menu that appears.


    You can also make smart playlists, which are playlists that are generated from
    rules, such as songs that belong to particular years, genres, or artists. You
    need to add your rules before you can give your playlist a name. You use a simple
    menu to set up your playlist rules.


    Smart playlists can only contain songs that have been added to the music library,
    but standard playlists can contain songs from any of your connected media devices.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_171_0.png)


    # # Playing Videos


    Use the Movies, TV Shows, Music Videos, and Videos options to view your video
    content. What''s available under each option will depend on the media added in
    each section, and what type of media you told Kodi was at the time (such as movie
    or TV show).


    The Kodi software supports the H.264 video format to 1080p, which means you''ll
    be able to watch mp4, mkv, and .avi files in high definition. Note that content
    protected by digital rights management, including files bought from iTunes, can''t
    be played in Kodi.


    If you want to watch other formats, you might be able to buy a license from the
    official Raspberry Pi website at raspberrypi.org to add your license number to
    decode MPEG2 and V1 formats are available and cost a couple of dollars apiece.
    Each license is valid for one Raspberry Pi. Edit the config.txt file (see Appendix
    A), which is easiest to do if you boot from a different SD card and use a card
    reader on the Pi to modify your Kodi card. The config.txt file is stored in the
    top-level folder of your Kodi card, not in the boot folder, which you might usually
    expect to find.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_171_1.png)


    To play films, hover over Movies on the main menu to see options for different
    categories, recently added movies, random films, and unwanted movies. Click a


    156 PART 3 Using the Raspberry Pi for Both Work and Play'
