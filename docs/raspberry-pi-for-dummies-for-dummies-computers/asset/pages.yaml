  md: '# Browsing the Web


    When it comes to browsing the web on your Raspberry Pi, you are really spoiled
    for choice, with four browsers to choose from. The recommended browser, accessed
    from the Globe icon in the top left of the screen, Chromium. Raspbian also has
    three other browsers, which you can start by typing their names into the Run option
    on the Applications:


    +   **Dillo:** This browser is fast, but web pages look different than intended
    on because it can''t handle sophisticated layout instructions or JavaScript, the
    language used for creating web pages. Several websites we tried were rendered
    as a single column because Dillo couldn''t understand where the header box, sidebars,
    main page content, and bottom box should go. You can switch off from the Tools
    menu, which can quickly speed up downloads of complex pages. If you''re accessing
    mainly text information or have a particularly slow web connection, this browser
    might be a good choice, but you won''t benefit from much of the work that website
    owners put into creating web page designs that are easy to use.


    +   **Netsurf:** This is capable of handling more sophisticated layouts than Dillo,
    but it also lacks support for JavaScript. Many websites like they do on a PC or
    Mac browser, but any sites that require JavaScript (including Facebook) wont work.
    Nets offers a friendlier experience than Dillo for most websites.


    +   **Epiphany:** Before Chromium, this was the recommended browser on the Raspberry
    Pi. This browser has been optimized for the Raspberry Pi, including hardware decoding
    of video. Epiphany supports JavaScript, and is better able to re-create the experience
    you have with websites using other devices. Sites like Facebook and Google Maps
    work, but might be noticeably slower than you''ve used to.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_89_0.png)


    At present, Flash only works on the Raspberry Pi 2 and 3. Flash is for online
    games and videos, so if you''re using an older Raspberry Pi, these often wont
    work.


    # Using Chromium to browse the web


    Figure 4–9 shows the Chromium browser in use. Its layout is similar to other browsers
    you might have used in the past, with a thin toolbar at the top and most of the
    screen given over to the web page you''re viewing. To start with it, either run
    it from the Applications menu or click the Web Browser button in the top left
    of the screen. (Refer to Figure 4–2).'
