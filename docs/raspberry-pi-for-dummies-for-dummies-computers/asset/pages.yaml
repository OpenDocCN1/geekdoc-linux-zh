  md: 'Though electricity doesn''t care about the color of the wire it''s flowing
    through, by convention red or orange is used for a positive wire, and black, green,
    or blue is used for a negative or ground wire.


    # Your First Circuit


    The first thing anyone should do with a Pi system is to make an LED flash because
    it''s the hardware equivalent of the “hello world” program. To light an LED, you
    need two components: the LED itself and a resistor to keep the current down to
    a safe level for the Pi''s GPIO pins. The circuit diagram is shown in Figure 16-6,
    with a diagram of the physical layout.


    Note: We have also a push button input switch to this diagram, which we use later
    for controlling the behavior of the LED.


    Notice two points here: the orientation of the LED and the orientation of the
    switch.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_342_0.png)


    FIGURE 16-6: An LED and switch, wired to the GPIO pins.


    LEDs are sensitive to the polarity of the current you put through them. The positive
    connects to the anode (the top flat bit of the triangle in the symbol), and the
    cathode (the bar in the symbol) goes to the negative. Then, the LED lights up;
    wire it the other around, and it won''t. So, faced with an LED, a new LED, the
    anode normally has the longest lead, but what happens if the leads have been snipped?
    Well, examine closely the rim of the LED and you will see a portion of the round
    housing that is not curved but flat


