    begin again.


    # Introducing Variables


    Variables are a way of storing information in a program so that you can refer
    back to it or reuse it. You give that piece of information a name, and you can
    refer to it by that name in your script. For example, if you want to keep a tally
    of the score, you use a variable to do that. They''re called *variables* because
    their values can change over time. The score is at the start of the game, for
    example, and it goes up when the player pays an alien out of the sky.


    You can tell your script to reset the score to zero, when an alien is hit, and
    display the score at the end. Each time, you just refer to it as *score*, and
    the program works out what number it refers to.


    To create a variable, click the Variables button above the Blocks Palette. In
    the Blocks Palette itself is a button called Make Variable. Click that, and you
    will be asked to enter a name for the variable — in this case, use **score**.


    You''re also asked whether this variable is for all sprites or only the sprite
    you''re working on. It''s important to get this right. For the score, you want
    to make a variable that all your sprites can use. If you have a variable that''s
    used by only one sprite, it''s better to create a variable that''s only for that
    sprite, it stops other sprites from being able to interfere with it. When you
    duplicate a sprite, you might find that you have sprites that use variables sharing
    the same name, but that you want to use independently of each other. You see an
    example of this later in this chapter, when we tell you how to add extras.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_212_0.png)


