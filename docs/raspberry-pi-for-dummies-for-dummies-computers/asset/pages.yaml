- pgno: 416
  md: '# Taking further


    You can change the folder that the files are in quite easily. However, a project
    you might consider is a story time bear or another cuddly toy with the RFID reader
    embedded into it — in its paw or chest, for example. Then your child has a set
    of bedtime story cards and can choose which one is read to them. With added realism,
    you can also embed a speaker into the toy.


    # Dressing Up a Paper Doll


    Paper dolls have been around for a long time, but they''re still popular with
    children of all ages. With the help of RFID technology, you can make an up-to-date
    version of this toy that outperforms others. The idea is that you have a basic
    doll and a number of different outfits and accessories. These are normally pasted
    onto cardboard and cut out. By use of tapes on the clothes, you can dress your
    doll in a mix-and-match style. With RFID, you can have a card specify each item
    of clothing and construct your dressed doll on the screen with a degree of seamless
    integration you just can''t get with the paper version.


    There are many sheets to cut out online that are free for personal use, as well
    as patterns you can draw. You can also draw yourself — if you''re not at drawing
    dolls better than we are. Given the fact that we''re not too hot at this drawing
    business, we teamed up with Imani Osmon, a young artist, to provide the artwork
    we use as an example here. (We think it might be just as exciting finding and
    drawing yours.)


    You start off with the basic sheet, and you''ll need a drawing package in order
    to prepare your artwork. Your package should be able to scale images and also
    add a transparent background. Being able to touch and change colors could also
    be useful, though it''s not essential. This prep work can be done on a laptop
    using established packages like Photoshop, or on the Pi using Inkscape or Gimp.
    (For more on GIMP, see Chapter 7.)


    If you decide to go with GIMP, here''s what you need to do:


    +   Start off with the full sheet, and scale it so that the doll will fit into
    Pygame window on your monitor.


    The sheet should be about 600 pixels high.'
