- pgno: 136
  md: 'To get documentation for shell built-ins, you can use the shell''s help facility.
    Just enter help followed by the filename you''re looking for with:


    ```

    help cd

    ```


    ![](img/df9a01bf057d58c2401b5edabd6e8829_136_0.png)


    The help command''s documentation uses square brackets for different options (which
    you may omit), and uses a pipe (|) character between items that are mutually exclusive,
    such as options that mean the opposite of each other.


    For commands that are programs, such as mkdir, you can try the command --help
    after it. Many programs are designed to accept this and to display help information
    when it''s used. A usage example is


    ```

    mkdir --help

    ```


