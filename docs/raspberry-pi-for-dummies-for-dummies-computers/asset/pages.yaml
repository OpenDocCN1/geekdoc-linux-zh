    if smart_response:\n    print(smart_response)\nelse:\n    reply_chosen = random.randint(1,len(random_replies))\n\
    \    print(random_replies[reply_chosen])\nrandom_replies[reply_chosen] = user_says\n\
    ```\n\nThis starts by using the dictionary_check() function (or calling it, to\
    \ use the jargon), sending it whatever the user typed in and putting the response\
    \ from the function into the variable smart_response.\n\nThe next lines check\
    \ to see whether smart_response has any content in it (or not empty), and if so,\
    \ it prints onscreen. The instructions under the else command are used to show\
    \ a random response from the list of random replies, and replace it with what\
    \ the user entered. Those last three instructions were in the previous version\
    \ of your program, but they need indenting now, by adding four spaces at the start\
    \ of each line.\n\n# # Final thoughts on Chatbot\n\nThis completes the Chatbot\
    \ program. Along the way, you've learned to use variables, loops, random choices,\
    \ dictionaries, conditional statements (if and else), and functions. You've learned\
    \ how to take input from the user and"
