- pgno: 326
  md: 'Although logic voltage levels on the Pi are simple, the current these outputs
    can supply more complex, with a current limit of about 16mA. This limit is how
    much the Pi should supply into a load, not how much it can supply or will supply.
    That depends on the resistance of the load connected to the Pi. We say that the
    limit is about 16mA, but this is a bit of a gray area. This value is considered
    safe for the Pi to supply, but that not to say a value of 17mA would be considered
    dangerous or excessive.


    # Putting an output pin to practical use


    Can you do with a switched output? Well, you can drive a small current through
    a load, or you can control another device that can control a bigger current through
    a load. Put like that, it doesn''t sound exciting, but it''s what physical computing
    is all about — it is the gateway to all control. The load can be a light, a motor,
    a solenoid (an electromagnetic plunger used to prod or strike things), or anything
    that uses electricity. Because that includes everything in the modern world, it
    is safe to say that it uses electricity, it can be controlled, and more importantly
    for our purposes, controlled by a Pi.


    Take a look at controlling a light — not the current-heavy flashlight bulb we
    looked at, but rather a component known as a light-emitting diode (LED). These
    can light up from a tiny bit of current, and the 16mA we have available is more
    than enough for that task. In fact, you''re going to limit the current to less
    than 10mA by adding a 330R-series resistor.


    For the moment, just look at the circuit in Figure 15–8. This shows two ways to
    wire an LED — or other load — directly to a GPIO pin. Here we just show the GPIO
    pin and not the equivalent series resistance of the power source as discussed
    earlier — in the context of a 330ohm resistor, 31R is negligible.


    The first way to it, called current sourcing, is perhaps a beginner might think
    of as natural. When the GPIO pin is set by the program to produce a high voltage
    (that is, when the switch is set to connect the 3v3 line to the output pin), current
    flows from the pin through the LED, through the resistor and to ground, completing
    the circuit, causing current to flow and so lighting the LED. When the GPIO pin
    is set by the program to produce a low voltage (that is, when the switch is set
    to connect the oV or ground line to to the output pin), no current flows and the
    LED is not lit. This method is known as current sourcing because the source of
    the current — the positive connection of the power — is the GPIO pin.'
