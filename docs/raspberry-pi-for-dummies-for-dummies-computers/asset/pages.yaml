- pgno: 443
  md: '# Penguins Puzzle


    Penguins Puzzle, shown in Figure 19-1, is a 3D puzzle game where you are tasked
    with safely escorting a penguin to the exit without letting it fall off the iceberg
    into the freezing water. You use the cursor keys to move around, press Z to zoom
    out for a wider-angle view, and press R to reset the level. The game has 50 levels
    to test your mettle. When you''ve finished playing, press Esc to exit.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_443_0.png)


    FIGURE 19-1:

    Penguins Puzzle is a cute 3D puzzle game.


    Peter de Rivaz


    The game is preinstalled with Raspbian. If you need to install or update it, find
    it on the Add/Remove Software menu, located in the Preferences section of the
    Applications menu, or, in the shell, use


    ```

    sudo apt-get install penguinspuzzle

    ```


    Start the game from the shell by typing penguinspuzzle. The software is charity'
  merge: -1
  img_proc: true
- pgno: 444
  md: '# FocusWriter


    Whether you''re writing the next blockbuster from your bedroom or you just need
    to get your work without distraction, FocusWriter might be the application for
    you. It''s a word processor that is designed to be distraction-free. Most of the
    time when you''re using it, the only thing onscreen is your writing.


    When you move the mouse to the top of the screen, the menus for changing the settings
    and saving your files appear. To keep your motivation up, you can set a daily
    goal in the Preferences settings for time spent writing (better still) words written
    per day. When you move the mouse to the bottom of the screen, you can see the
    word count and your progress toward your daily goal.


    To install FocusWriter, search for focuswriter on the Add/Remove Software menus
    or, in the shell, use


    ```

    sudo apt-get install focuswriter

    ```


    To start FocusWriter, go into your desktop environment and click the program''s
    entry in the Office category of your Applications menu. You can find out more
    about the application at http://gotcode.org/focuswriter.


    # Mathematica


    Mathematica is what is known as a symbolic package, or a CAS (Computer Algebra
    System), and it''s preinstalled in Raspbian. It is one of the best systems for
    exploring anything to do with numbers, from mathematics to complex multid graphics
    and music.


    To get started, click the Applications menu, and click the Mathematica icon. When
    you see a splash screen, and then two windows open: a blank notebook and, in front
    of it, an invitation to visit three websites. Click the notebook to bring it to
    the front. Type 2AS and Press Return. This expression to the power of, but you
    don''t see an answer. You''ve entered the expression into Mathematica, but in
    order to tell the program to evaluate it (and give you the answer), use Shift+Return.


    Mathematica can expand equations for you:


    ```

    Expand[(1+x)^6]

    1 + 6x² + 20x³ + 15x⁴ + 6x⁵ + x⁶

    ```


    CHAPTER 19 Ten Great Software Packages for the Raspberry Pi 429'
  merge: -1
  img_proc: true
