- pgno: 226
  md: '```

    >>> print(5 + 5)

    10

    >>> print(9 - 4)

    5

    >>> print(7 * 7)

    49

    >>> print(10 / 2)

    5.0

    ```


    # Mathematical Operators in Python


    | Operator | Description |

    | --- | --- |

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | // | Division, discarding any decimal portion |

    | % | Modulo, which shows the remainder after division |


    TABLE 11-1


    ![](img/df9a01bf057d58c2401b5edabd6e8829_226_0.png)


    Don''t use quotes around the sum in the print() command. What would happen if
    you did? Python would put on the screen literally whatever characters you asked
    it to, like this:


    ```

    >>> print("5 + 5")

    5 + 5

    ```


    If you want to force a rounding effect to remove any decimal portion from your
    answer after dividing a number, you can use the floor division (//) operator,
    like this:


    ```

    >>> print(10 / 3)

    3.3333333333333335

    >>> print(10 // 3)

    3

    ```'
