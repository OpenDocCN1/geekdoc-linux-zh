    # Shutting Down and RebootingnYour Raspberry Pi


    Usually, you would shut down and reboot your Raspberry Pi using the Applications
    menu on the desktop. However, it''s possible to set the Pi to boot into the command
    line (see Chapter 3) so that you don''t see the desktop. In that case, you can
    turn off your Raspberry Pi safely in this way:


    ```

    sudo halt

    ```


    To switch on your Raspberry Pi again, disconnect and reconnect the power. This
    is easiest to achieve, with minimal wear on your power supply or Raspberry Pi,
    if you plug your power supply into a power socket that has a switch on it. You
    can use that switch to first remove and then, after a few seconds, restore the
    power to your Raspberry Pi.


    You can reboot (or restart) your Raspberry Pi without disconnecting and reconnecting
    the power, like this:


    ```

    sudo reboot

    ```'
