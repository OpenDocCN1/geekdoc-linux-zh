- pgno: 260
  md: 'You don''t need to know this to Pygame Zero, but if you''re curious, a tuple
    is a sequence a bit like a list. The main differences are that you can''t change
    the items in it, and it''s defined using parentheses () instead of using square
    brackets []. The tuple used in this function contains the x and y values for the
    mouse pointer.


    Using the mouse position stored in pos, we can work out whether the player clicked
    on the actor. Collision detection is all about working out whether sprite is touching
    or touching the mouse pointer. It can be tricky to code, but Pygame Zero includes
    some features built in to do it for you. You can check whether the mouse pointer
    (pos) is touching the actor using the command together with the collidepoint()
    function, as shown earlier. If so, you can change the image of the actor to the
    ''pop'' image


    ```

    cloud.image = ''pop''

    ```


    Again, you don''t need the file extension of the image.


    For detecting mouse clicks also shows how to play a sound: blop is the name of
    our sound file, minus the extension (.ogg), which Pygame Zero works for itself.
    The rest of the line that plays the sound would be the same for any sound. You
    might find that a simple program like this is one template when you''re building
    your programs.


    Run the program. Save it to your pi folder cloud3.py and use pgzrun cloud3.py
    from the command line to run.


    When you click the background, nothing happens. When you click the cloud in the
    center of the screen, you see it change to a "Pop!" image. One thing you might
    notice is that you can click near, but not, the image and it will register as
    a hit. That''s because an actor is rectangular. The cloud has rounded corners,
    but the empty spaces in those corners are still part of the rectangular image,
    as far as collision detection is concerned.


    When you''re making your own images, try to stretch the image out to a rectangle
    as much as possible, and trim any unused space from the edges. That helps your
    collision detection look accurate. With fast-moving images, nobody will notice
    if the collision detection is slightly off. If your game includes circles, though,
    the unused corners of the image will also register a hit, which might feel unfair
    or unrealistic when playing the game.


    # Animating your actors


    Pygame Zero includes a simple function for animating your actors so that they
    can move across the screen automatically. This is another way it makes Pygame
    more'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'accessible for people who have previously used Scratch: Usually, movement is
    achieved by having a loop that repeatedly changes the x or y position of the image.
    Pygame Zero handles all complexity for you.


    Here''s an example of the animate() function:


    ```

    animate(cloud, tween=''linear'', duration=5, pos=

    (cloud.x, -200))

    ```


    It breaks down like this:


    +   - Give it the name of the actor you want to animate first

    - Tell the type of actor you want to use. This describes whether the actor speeds
    up or slows down over the course of the animation. You can consult the documentation
    for a list of options (see the ''Exploring Pygame Zero Further'' at the end of
    this chapter), but we are using ''linear'' so that the animation is an even speed.

    - The duration is how long the animation will take, measured in seconds.

    - The pos is the finishing position. You give it the x and y position in brackets,
    like this: (x, y). With this motion, you''ve used the existing position (cloud.x),
    and set the y position to -200, which is off the top of the screen. As a result,
    the cloud will drift up the screen until it is no longer visible.


    Try this animation by adding the preceding line of code into the section where
    you set up your cloud actor, in the following snippet. The instruction is in bold.
    Note that what you see in this example isn''t the full program: You need to change
    the WIDTH and HEIGHT instructions, and the draw() and on_mouse_down(pos) functions
    from your previous program:


    ```

    cloud = Actor(''target5'')

    cloud.x = 250

    cloud.y = 250

    animate(cloud, tween=''linear'', duration=5, pos=

    (cloud.x, -200))

    ```


    ![](img/df9a01bf057d58c2401b5edabd6e8829_261_0.png)


    > REMEMBER the second bracket at the end of the new line. One pair of brackets
    encloses the position, and another goes around everything given to the actor function.


    When the program runs, the cloud actor will be set as before, but this time its
    animation will be started. Each time the draw() function runs, it draws the cloud
    in its latest position, making it appear to move over the screen.'
  merge: -1
