- pgno: 205
  md: '# Controlling When Scripts Run


    In Chapter 9, we show you how to start scripts by clicking them in the Scripts
    Area. Most of the time, you''ll want your scripts to run automatically when certain
    things happen, such as a player pressing the Fire key.


    This is where the Control blocks come in: They allow you to trigger scripts when
    a particular event happens, such as a sprite being clicked or a key being pressed.
    You use the Control blocks to craft the rules and instructions that govern your
    game works.


    # Using the green flag to start scripts


    One of the Control blocks is particularly useful for starting your game and synchronizing
    your scripts across all your sprites. Above the Stage are two buttons: a green
    flag and a red stop. The green flag is used to start scripts running, and you
    can use a Control block to detect when it''s clicked. This Control block has a
    curved top on it — because no other block can go above it—but it has a notch underneath
    so you can join Motion, Looks, Sound, or other blocks to it. You can put scripts
    that are triggered by the green flag being clicked into all your sprites so that
    clicking the green flag makes it easy to start scripts on different sprites at
    the same time.


    At the end of a game, aliens and the ship could be anywhere, so at the start of
    the game, you need to reset each sprite to its starting position. For the player''s
    ship, you need to reset the X position to the center of the screen, set the Y
    position near the bottom of the screen, reset the ship''s direction, and bring
    the ship to the front so that other sprites are behind it. Later, on, this makes
    the fireball come behind the ship, so it looks like it''s being fired from inside
    rather appearing on top of it.


    Figure 10–4 shows the script you should assemble to reset your sprite when the
    green flag is clicked. If you''re making your own graphics, the Y position might
    need to be higher, depending on the size of your sprite.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_205_0.png)


    When you have multiple sprites in your project, make sure the correct one (the
    ship, in this case). Each sprite has its own Scripts Area. To choose a sprite,
    click it in the Sprite List in the bottom right.'
  merge: -1
  img_proc: true
