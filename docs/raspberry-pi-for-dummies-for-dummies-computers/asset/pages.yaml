- pgno: 219
  md: '# Playing Your Game


    To play your game without the distraction of your scripts and other clutter on
    the screen, near the top right of the screen, click the Ebay icon that says Switch
    to Presentation Mode when you hover over it. The Stage expands to fill the screen.
    You can use the green flag to play as usual. To close the full-screen view again,
    click the arrow in the top left. Figure 10-15 shows the final game, though yours
    might look quite different with your own art in it.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_219_0.png)


    FIGURE 10-15: Got it! The final game.


    # Adapting the Game''s Speed


    This game runs at a challenging but playable speed on Sean''s Raspberry Pi, and
    it runs faster than it did when the first edition of this book was written. That''s
    because a lot of work has been done to improve the speed of Scratch over the past
    couple of years. If the game is too challenging on your Raspberry Pi using the
    latest software, you can slow down the aliens by reducing the size of the leapsize
    variable by which the alien''s Y position decreases when the sprite changes direction.
    You can also put a small Wait into the alien''s loop, although that might mean
    the collision detection is less accurate. The game also slows down if you add
    more aliens or other sprites to it, which would be a creative way to adjust the
    gameplay to take advantage of the increased speed.


    204 PART 4 Programming the Raspberry Pi'
  merge: -1
  img_proc: true
