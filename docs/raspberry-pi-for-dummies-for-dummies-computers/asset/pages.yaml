- pgno: 297
  md: 'You run Sonic Pi by clicking the Applications Menu button in the top-left of
    the screen, clicking Programming, and then clicking the entry for Sonic Pi.


    # Understanding the Sonic Pi Screen Layout


    Figure 14-1 shows the screen layout for Sonic Pi. You might see some differences
    between your screen layout and ours, but the fundamentals should be the same.
    Click to enlarge the window if necessary. (See the section on resizing and closing
    your program windows in Chapter 4.) On the left is the Editor, where you type
    in your code. On the right, Sonic Pi tells you what it''s doing as it plays your
    music. At the bottom is the Help pane.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_297_0.png)


    Figure 14-1:

    The Sonic Pi

    screen layout.


    Sonic Pi uses buffers, which you access by clicking the buttons at the bottom
    of the Editor. You can think of each buffer as having a different file open for
    editing, but you can play music from different buffers at the same time. This
    can be particularly useful for live performance: you might set a loop in one buffer
    and then experiment with it to add notes on another buffer. When you exit Sonic
    Pi, the content of your buffers is saved for you, and it''s loaded when you come
    back again. You can also save the content of a buffer to a file using the Save
    button in the menu bar at the top of the screen.


    282 PART 4 Programming the Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'At the top of the screen are buttons to run your program (play your music)
    and stop it. They use symbols similar to any audio player: a triangle to play
    and a square to stop. There are also buttons to adjust the text size, show or
    hide the oscilloscope (which displays waveforms over your music plays), show the
    info window, and show or hide the Help pane at the bottom of the screen.


    There is also a Preferences button to the right of the Help button. The Preferences
    window provides a volume control and enables you to force the audio output to
    go through headphones or through the HDMI cable. It has options for the Editor
    display and checking for any updates. If you use other electronic instruments
    or music software, you can connect to Sonic Pi using the MIDI or OSC protocols,
    which are configured in the I/O preferences.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_298_0.png)


    You can adjust the size allocated to the panels by clicking and dragging the lines
    between.


    If you are performing with Sonic Pi, you can use the dark mode for a color scheme
    based on a black background, which will be more comfortable to use in a club or
    venue with low lights. There’s also a Pro icons setting, which replaces the buttons
    with stripped-back icons for a more streamlined interface. Find both settings
    in the Editor preferences.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_298_1.png)


    # Playing Your First Notes


    Click in the Editor and type the following:


    ```

    play 60

    ```


    Nothing happens because you''ve entered your program but haven''t run it yet.
    Click the Run button and you will hear a middle C note. At the same time, you’ll
    see the Log update.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_298_2.png)


    The notes you use are standard MIDI notes, used in electronic instruments. You''ve
    already seen them in Scratch. Higher-sounding notes use higher numbers, and lower-sounding
    notes use lower numbers.


    Try adding some more notes to your program:


    ```

    play 60

    play 64

    play 67

    ```'
