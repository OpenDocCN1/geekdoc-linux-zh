  md: '# Creating Directories


    As you may know from other computers you''ve used, it''s alot easier to manage
    the files on your computer if they''re organized into directories (or folders).
    You can easily create a directory in your home directory using the command mkdir:


    ```

    mkdir work

    ```


    To save time, use one command to create several directories, like this:


    ```

    pi@raspberrypi ~ $ mkdir work college games

    pi@raspberrypi ~ $ ls

    Downloads python_games college Music Desktop Pictures

    Documents Public Templates Videos

    ```


    You might need additional files here, especially if you followed the earlier examples
    to make some text files, but the important thing is that one command make three
    directories for you.


    The mkdir command''s ability to make several directories at the same time isn''t
    unusual: Many other commands can also take several arguments and process them
    in order. You can see the listing of two different directories like this, for
    example:


    ```

    ls ~ /boot

    ```


    The mkdir command doesn''t give you a lot of insight into what it''s doing by
    default, but you can add the -v option (short for verbose), which gives you a
    running commentary as each directory is created. You can see what looks like in
    the next code snippet


    If you want to make some directories with subdirectories inside them, it would
    be a nuisance to have create a directory, go inside it, create another directory,
    go inside that, and so on. Use the -p option, like this:


    ```

    pi@raspberrypi ~ $ mkdir -vp work/writing/books

    mkdir : created directory ''work''

    mkdir : created directory ''work/writing''

    mkdir : created directory ''work/writing/books''

    ```


    The command keeps you informed of any changes it makes, but if the directory already
    exists, you won''t see the first line of output shown here.'
