    # Making Sprites Move Automatically


    If you''re wondering why we left the alien''s movement to the end, it''s because
    it makes it easier to test the game. You now have a spaceship that the player
    can move, a working firing mechanism, and an alien that dies and regenerates when
    shot. You can test all that at your leisure and fix any problems without hav-
    to keep up with the alien.


    The alien moves from left to right and then from right to left, and then again.
    Each time it changes direction, you can move down the screen. This is quite sophisticated
    behavior, but you can create most of it using the blocks you''ve already used
    in this chapter. The art of programming is about working how you use the different
    blocks or commands at your disposal to achieve what you want to.


    To start, you need to make a new variable and call it leapsize. When you create
    the leapsize variable, you''re asked whether this variable should apply to all
    sprites or to this sprite only (the alien). Make sure you click the button to
    make it apply only to this sprite. Until the box beside its in the Blocks Palette
    to hide it on the Stage.


    Each Scratch goes around the Forever loop, it moves the sprite and checks to see
    whether it''s touching a fireball or the spaceship. The leapsize variable is used
    to store how much the alien''s X position should change by time the alien moves.
    If the alien is going right, the leapsize variable is 20, and if it''s going left,
    it''s -20.


    If you don''t the leapsize variable for this sprite only, you''ll have problems
    when you duplicate the sprite later - because the alien will use the same leapsize
    variable. The leapsize variable is personal to each sprite, and its value depends
    partly on where a sprite is on the screen. If you have sprites stuck at the edge
    of the screen, they are probably interfering with each other''s variables.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_214_0.png)


    When the alien reaches the edge of the screen, the leapsize variable is changed
    so that the alien goes back in the other direction and the alien is moved down
