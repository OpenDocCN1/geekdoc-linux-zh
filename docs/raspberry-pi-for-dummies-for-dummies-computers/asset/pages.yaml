    There are a number of basic functions you will need for your program:


    +   * realx(x) and realz(z): Convert coordinates in the maze (measured in cells)
    into coordinates in the Minecraft world (measured in blocks and offset from the
    maze''s starting point).


    +   * showMaker(x, y) and hideMaker(x, z): These functions use a gold block to
    show the program has reached as it builds the maze. It''s fun to watch from above
    and is useful while building and debugging the program.


    +   * demolish(realx, realz): This knocks down a wall in the maze and takes real
    x and z coordinates in the Minecraft world as its parameters.


    +   * testWalls(cellx, cellz): This checks whether the four walls on a cell are
    intact. If all of them, it returns True. Otherwise it returns False. It uses the
    command .getBlock(x, y, z), which tells you the blockType at a particular location.
    You use two signs, as usual, to test whether a block in a position is the same
