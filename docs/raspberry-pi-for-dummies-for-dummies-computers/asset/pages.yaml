- pgno: 314
  md: '+   IN THIS CHAPTER

    >> Discovering what a circuit is

    >> Getting familiar with GPIO

    >> Coming to grips with the soldering iron

    >> Looking at ready-made add-on boards


    # Chapter 15


    # Understanding Circuits


    P art 5 of this book deals with what is known as physical computing, or making
    your program reach out beyond the confines of keyboard and screen and into the
    physical world. You discover how you can use Scratch and Python programming skills
    to sense what is happening in the outside world and to control lights, motors,
    and, in fact, anything else that uses electricity. However, before you can do
    this safely, without risking damage to you or your Pi, you need to look at a little
    bit of background electrical theory so that you have a foundation to build on.


    In this chapter, we show you the relevant concepts that allow you to understand
    why the projects look like they do and what you should avoid doing. Next, we introduce
    you to the concept of GPIO connections, explain what they are, and why they are
    included in the Raspberry Pi computer. We also discuss in general how you can
    use them.


    Although you can make the projects in Chapter 16 without soldering, in order to
    make things most in electronics, you have to be able to use a soldering iron.
    We show you how to go about this and discuss safety concerns. Finally, we introduce
    you to the concept of ready-made add-on boards because they can make building
    stuff a lot simpler (albeit at the cost of a bit more).'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# # Discovering What a Circuit Is


    The first thing you have to understand is that a circuit is something where electricity
    can flow; it is a path, or a conduit. It is continuous; that is, it''s a loop
    with no dead ends. If you have a dead end, you don''t have a circuit. Electricity
    has to be able to flow. So let''s be more specific in what we mean by electricity.
    It can be complex stuff and because it''s invisible, you have to do a bit of imagining
    what is going on.


    There are two aspects of electricity: current and voltage:


    +   - Current is what actually flows.

    - Voltage is what forces the current round a circuit.


    Voltage can''t flow and current doesn''t exist in the absence of a voltage. However,
    voltage can exist in the absence of current. You''ve no doubt the effects of static
    electricity, which is the build-up of voltage that occurs when insulators (materials
    that don''t normally conduct electricity) are rubbed together.


    It''s kind of like rubbing a balloon on your head can make the hairs on the back
    of your hand stand. You can feel it, but only because you feel your hairs being
    lifted. You aren''t feeling the electricity itself. You only feel static electricity
    when it stops static and a current flows. At a very high voltage, a little current
    can hurt a lot. You''ve probably felt the static-discharge shock of touching a
    metal object walking after a nylon carpet


    # # Understanding the nature of electricity


    So, what is electric current? It is a flow of electrons past a point, just like
    a flow of cars past a motorway sign. With electric circuits, you measure current
    in amps. One amp of current is about $6.24 \times 10^{18}$ electrons per passing
    a point, or 624 followed by 16. That''s a big number, and fortunately, we don''t
    have to count all those zeroes. The bigger the voltage, the more current is forced
    through a circuit, but circuits have a property that resists the flow of current.
    We call this the resistance of a circuit. This resistance depends on the materials
    the circuit is made from and is measured in a unit called ohms. So, because we
    know how to define an amp in terms of electron flow, we can define these two properties
    in terms of an:


    One volt is the voltage you need to drive one amp through a circuit with a resistance
    of one ohm.


    You can advance a long way in electronics by knowing that single fact. In fact,
    that definition is contained in what is known as Ohm''s law:


    300 PART 5 Exploring Electronics with the Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 316
  md: '```

    Volts = Amps × Ohms

    ```


    However, it would be too easy to just use that as a formula. People would understand
    straight off, and that would never do! You have to build up a mystique. Imagine
    how you would feel about a doctor if he actually told you in plain English what
    was wrong with you. No, it needs to be dressed up so that everyone can understand
    it. Ohm''s law becomes


    ```

    E = I × R

    ```


    where E is the electromotive force measured in volts, I is the current measured
    in amps, and R is the resistance measured in ohms.


    This is the formula you use in books and all over the Internet, remember — it''s
    just


    ```

    voltage = current × resistance

    ```


    Connecting things to the Raspberry Pi involves juggling voltage and current, and
    often you need to use a resistor to limit the current a voltage pushes through
    a device in a circuit. Using Ohm''s law is the simple way to work out what you
    need. Later on in this chapter, we show how to use this to make sure you drive
    light-emitting diodes (LEDs) correctly.


    Resistance is not the only thing we can calculate. If we know two of the quantities
    in a circuit, we can calculate the other one. We do this by rearranging this simple
    formula to find any one of the quantities If we know the other two. We like the
    Ohm''s law triangle, which gives the three formulas in one go:


    ![](img/df9a01bf057d58c2401b5edabd6e8829_316_0.png)


    CHAPTER 15 Understanding Circuits 301'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'When scientists were first discovering electricity, they knew that it flowed
    from one terminal to the other. They said the flow was from the positive to the
    negative, but which was which? Experiments with making a current through a solution
    of water and copper sulphate showed that copper was dissolved from one wire and
    deposited on the other. So they reasonably assumed that the metal was flowing
    with the flow of electricity and the dissolving wire an anode and positive and
    the wire receiving the metal cathode or negative. They were wrong: the electrons
    that constitute the current actually flow the other way. However, this notion
    became so entrenched that we still use it. We call it conventional current, and
    it flows from the positive to the negative.


    In a way, it doesn''t matter which direction we think of it as flowing. It''s
    the fact that it is flowing and is important, and we use the terms positive and
    negative so we know what way round it is flowing. A common mistake beginners make
    in thinking about electricity is to think that the direction of flow matters “it
    first flows through one component and then another.” This leads to the erroneous
    thought that the first component it meets will “use up” or some of the electricity
    and then path on what is left to connect it the next. This is simply wrong, because
    current flows through all components in any path. You might also hear the phrase
    “electricity finds the path of least resistance and flows through that.” Again
    this is nonsense. Electricity flows through all paths at the same time — it is
    just that the resistance of a path determines how much current flows through that
    path.


    Power sources, like batteries and power supplies, are all marked with positive
    and negative symbols so that you can connect it the correct way. This is known
    as direct current (DC) which carries the current flows in one direction.


    The other sort of power supply you can get drives the current in one direction
    for a short length of time and then reverses the direction for a short time. This
    is known as alternating current (AC). A favorite trick electricians play on their
    apprentices is to send them to the store to fetch the nonexistent AC battery.


    Switches are used to make or break circuits, an early name for a switch was a
    breaker.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_317_0.png)


    # Putting theory into practice


    To see how this works, consider a simple circuit. To make things a bit clearer
    and easy to draw, we use symbols to represent components and use lines to represent
    wires that connect the components together, as shown in Figure 15-1.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# FIGURE 15-1:

    Two circuit symbols representing a switch.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_318_0.png)


    Take a switch. Its symbol (refer to Figure 15-1) is simple. There are two types
    of switches: single throw and double throw. In the single throw, a connection
    is made or not made through the switch, depending on the switch position. In the
    double-throw switch, a common connector is connected to one or the other switch
    contact, depending on a connection through the switch from one connection to the
    common connection. That is, the switch is one way, there is a connection through
    one connection to the common connection. When the switch is the other way, the
    connection is between the other common connection.


    It''s called a double-throw switch, or sometimes a changeover switch, because
    the switch changes over which terminal is connected to the common one. The figures
    in this section help explain this concept. However, the important thing to note
    is we use the same symbol for a switch, no matter what the physical switch looks
    like. Figure 15-2 shows some of the many physical forms a switch can take.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_318_1.png)


    # FIGURE 15-2:

    Just a few of the many different physical forms a switch can take.


    CHAPTER 15 Understanding Circuits 303'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'Figure 15-3 shows the symbols for a battery, a small flashlight or torch bulb,
    and a resistor. Note that there are two symbols for a resistor: one for the U.S.
    and one for Europe. In the U.K., we used to use the U.S. symbol until the late
    1960s. Today, both are understood.


    The world’s simplest circuit is shown in Figure 15-4. While the switch is open,
    there is no complete circuit, so there is no current flow and no lighting of the
    bulb.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_319_0.png)


    ![](img/df9a01bf057d58c2401b5edabd6e8829_319_1.png)


    However, when the switch is closed as shown in Figure 15-5, a path for the current
    to flow is created and the bulb lights up. Note that this diagram has a different
    symbol for a closed switch than the one used in Figure 15-4. This is so that you
    can more easily see what is going on. Normally, you have to imagine the switch
    in the open and closed positions and visualize the resulting circuit or break
    in the circuit. We call this a *series circuit* because all the circuit elements
    are in a line, one after the other, and the same current flows through all elements
    of the circuit.


    304 PART 5 Exploring Electronics with the Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 320
  md: '![](img/df9a01bf057d58c2401b5edabd6e8829_320_0.png)


    For, a circuit like this, there is only one value of current. When the switch
    is closed, current flows from the positive end of the battery through the current,
    from the switch, through the bulb lighting it up, and finally, back to the batteries''
    negative terminal. Note here that actual electrons are returned to the battery.
    The battery loses energy because it has to push them around the circuit. The positive
    and negative terminals of a battery show the direction it will push from the positive
    to the negative. In this circuit with an incandescent light bulb, the direction
    of the current doesn''t matter; however, this is rare in electronics. In most
    circuits, the current must be sent round the circuit in the right direction.


    # # Communicating a circuit to others


    You should use circuit symbols in schematics because they constitute a universal
    language and make it easy to see what is going on. Many people waste their time
    using diagrams that show the physical appearance of components and wires and their
    interconnection. Although this might appear first to be attractive, especially
    to a beginner, physical layout diagrams like this are almost impossible to follow
    in all the most trivial circuits. Despite the initial hurdle of learning to read
    the symbols, a schematic is a much simpler way of defining a circuit. Physical
    layout diagrams are a dead--end for anything more than a trivial circuit and should
    be avoided.


    Some time ago, Mike was visiting Russia and bought his electronic construction
    set. Even though the words were in Russian and incomprehensible to them, the diagrams
    were in the language of schematic and perfectly understandable.


    +   - To show the units of resistance, we can use various symbols. We can say
    18 ohms, 18 Ω, or, as we shall use in this book, 18 R.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_320_1.png)


    CHAPTER 15 Understanding Circuits 305'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'Although the units for calculation are volts, amps, and ohms, 1 amp (A) is
    in practice a lot of current, and it''s more common to talk of milliamps, or mA.
    There are 1,000 mA in 1A. Similarly, 1000 R is one kilogram, or 1 K.


    # Calculating circuit values


    Although the circuit in Figure 15-5 is all very well because it describes what''s
    actually wired up, it''s not useful for calculating anything using ohms because
    it has no resistances. However, each real component has associated with a resistance.
    We say it has an equivalent circuit. These are shown in Figure 15-6. All components,
    even the wires, have some series resistance. In other words, they behave like
    they have a resistor in line with the component. Sometimes- this is important,
    and sometimes it is not. The trick is in knowing when to ignore them.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_321_0.png)


    When resistors are placed in series, or in line with each other, you can find
    the resistance by simply adding up all the individual resistance values. Figure
    15-6 shows our circuit with the series resistance values shown. If we add up all
    the values around the circuit, we get 18R105. (That''s 18.105 ohms.) Note that
    virtually all of the resistance in the circuit comes from the bulb. The series
    resistance of the switch is negligible, as is the resistance of the battery. This
    is not always the case. So, with 18R resistance and 6V, we can calculate that
    the current through the circuit should be


    ```

    I = E/R -->

    Current = 6/18 = 0.333 Amps or 333mA

    ```'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Determining a component needs to be treated


    How do we know the series resistance of a component? Well, it is normally in that
    component''s data sheet, the document that the manufacturers of all components
    produce to exactly define the component and its properties. However, it''s not
    always given as a straightforward value. Take a bulb, for instance. This is normally
    "rated" as a voltage and a current; that is, we would say that the bulb is 6V
    at 0.33 amps. If we need to know the equivalent resistance, we use Ohm''s law.
    Other bulbs, especially big ones, are power rating in watts. Current-multiplied
    by voltage is the power in watts.


    The other point is that a bulb doesn''t have a constant resistance. We say it''s
    a nonlinear device; that is, the resistance changes depending on what current
    is going through it. This is because a bulb is a coil of wire. As current passes
    through it, the wire heats up. This causes the resistance to increase, limiting
    the point where the resistance is such that the current is limited to the design
    value at the design voltage. We use this concept of a nonlinear resistance in
    this chapter when we calculate what resistor we need to use with an LED.


    When dealing with units like volts and ohms that include a decimal, the point
    is missed and the latter of the unit is substituted, 3-3 volts becomes 3V3, or
    4.7K becomes 4K7. This is done to make it clear that there is a decimal point
    that otherwise might be lost in small print. While this is not officially approved
    standard, it is widely used in electronics industry.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_322_0.png)


    The series resistance of a battery — or any power supply, for that matter — is
    an important concept in it limits the current the battery can deliver. This is
    all wrapped up in the chemistry of the battery, but its effects can be summed
    up by a theoretical series resistance. A battery that can deliver a lot of current
    has a low series resistance. This is sometimes known as the output impedance of
    the battery.


    # TESTING CIRCUITS WITH SIMULATORS


    Nowadays, there are circuit simulators that allow you to test a circuit before
    you build it. This is a great idea to make sure you are not doing anything silly.
    However, some radiators have a steep learning curve, and others use ideal components
    instead of real ones. One can get some misleading results with simple circuits,
    but on the whole they are a very good idea. One simulator written especially for
    the Raspberry Pi is free. Find out more at www.raspberrypi.org/archives/1917.


    CHAPTER 15 Understanding Circuits 307'
  merge: -1
  img_proc: true
- pgno: 323
  md: '> These concepts may seem like they have nothing to do with the Raspberry Pi,
    as you will see in later chapters, these concepts are the ones you need in order
    to get the Pi to interact with the world outside the keyboard and screen.


    # Getting Familiar with the GPIO


    The Raspberry Pi Model 1, and the Pi Zero are made from BCM2835, single-core system
    on a chip. The Pi Model 2 uses the BCM2836, and the Model 3 uses the BCM2837 —
    both are quad core. Basically, a core is a processor, so the later models have
    four processors at the same time, although this capability is not presently fully
    exploited by the operating system. The cores in the Pi Model 3 are more powerful
    than the cores in the Pi 2, but have the full power of this processor yet to be
    exploited by the operating system. This is because it will mean a version of the
    operating system for each type of core, and at the moment there is just the one
    version of each operating system for all three processor chips.


    Unlike microprocessors, these chips are designed to be used in an embedded system.
    An embedded system is a device that has a computer inside it, but you don''t use
    it as a computer — things like mobile phones, GPS displays, digital cameras, and
    TV set-top boxes. These chips have a number of connections in order for the software
    in them to control things like push buttons and displaying sound and out. All
    the processors used for the Pi have 54 General Purpose Input/output pins (GPIO),
    and they can be controlled by software. Some of these signals are used to build
    and control the peripheral devices that turn the chip into a computer, like the
    SD card reader, the USB, and the Ethernet. The rest are free — that is, not needed
    to make the Pi — so they are surplus to necessities.


    Rather than just these surplus GPIO lines, the designers of the Raspberry Pi have
    routed some of them out to the connector on the board for you to use. It''s a
    bonus. This sets the Pi apart from mainstream computers and laptops in this respect.
    However, they have not routed all the pins out to this connector. Go to other
    connectors — the camera socket, for example, or the display socket — and are not
    even connected to anything. This is because the family of chips used to make the
    Raspberry Pi are housed in a package called BGA, or Ball Grid Array, with connections
    less than a millimeter apart. So close are that you can only have enough room
    for one trace (PCB wire) between the connectors.


    This means that, to get some of the inner connections out to other components,
    you need to use a printed circuit board (PCB) that has a number layers of'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'wiring inside the board. You might think the Pi''s board has just a top side
    and an underside, but in fact it is made from several boards sandwiched together
    to give six layers of wiring.


    Even with this many layers, there is not enough room to route out all 54 GPIO
    signals. Adding more layers would significantly increase the price of the PCB
    and make the bonus something instead of being free. (You are no doubt that the
    price point of the Pi is one of its major features.) However, over successive
    hardware revisions, an increasing number of these pins have been brought out to.
    There were 17 on the original board, but Revision 2 saw some rearrangement and
    another socket brought the total to 21; and, finally, the Model B+, and Revision
    3, saw this increase to 28, all on 40-pin header. This still leaves 8 pins not
    routed out or used internally on the board. This has remained the same for both
    the Model 2 and Model 3 of the Raspberry Pi as well as the Zero models. While
    28 GPIO pins on a 40-pin header might sound a little odd, the extra carry connections
    (8 pins), 5V (2 pins), and 3V3 (2 pins) are very useful when it comes to connecting
    external circuits.


    # Putting the general purpose in GPIO


    GPIO pins are all general purpose because you can use them for anything you want
    the control of a program. They''re input/output pins because the software can
    configure them to be either an input or an output. When a pin is an input, the
    program can read whether a high voltage or low voltage is being on the pin. When
    the pin is the output, the program can control whether a high voltage or low voltage
    appears on the pin. In addition, many pins have one or more superpowers—alternative
    functions as a secret identity, like so many book heroes. These powers are not
    shared by all pins, but are specialists able to do things without software intervention.
    That act as ways to tap directly, deep into the computer''s inner workings. When
    you switch to these functions, they stop being general-purpose pins and do a specific
    job. For example, one pin can be used to output a continuous stream of high and
    low voltage levels in alternation, after they get going, continue without further
    intervention from the program. So, if you connect that pin to a speaker or an
    amplifier, you can generate a tone that keeps on sounding until you command it
    to stop.


    # Understanding what GPIOs do


    GPIOs are the gateway to interaction with the outside world and are, in essence,
    quite simple.


    Figure 15–7 shows the equivalent circuit of a Raspberry Pi GPIO when it is configured
    as an output. You can see it is simply a double-throw switch that can'
