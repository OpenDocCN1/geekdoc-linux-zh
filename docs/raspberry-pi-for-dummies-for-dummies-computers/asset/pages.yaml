  md: '# IN THIS CHAPTER


    +   >> Playing notes and melodies using Sonic Pi


    +   >> Creating random computer-generated music


    +   >> Adding samples to your compositions


    +   >> Synchronizing your tunes with drumbeats and samples


    # Chapter 14

    Making Music with Sonic Pi


    For much of the music we hear today, computers are at least important in the studio
    as microphones are, and they have been for many years. Sonic Pi, you can start
    composing your own computer music-programming your Raspberry Pi. It enables you
    to put together simple programs that play synthesizer melodies and sampled sounds,
    generating your own instrumental music.


    Sam Aaron


    Sonic Pi runs from the desktop environment (see Chapter 4) and is pre-installed
    in Raspbian.'
