    This simple example illustrates few reasons why functions are a brilliant idea
    and have fundamental building blocks in many programming languages:


    +   **Functions enable you to reuse parts of your program.** For example, we used
    our function to display two different messages here, just by sending the function
    a different argument each time. When you use more sophisticated programs, being
    able to reuse parts of your program makes your work shorter, simpler, and faster
    to write.


    +   **Functions understanding the program easier because they give a name and
    structure to a set of instructions.** Whenever someone sees dictionary_check()
    in our program, she can make a good guess at what''s going on. So far, our programs
    haven''t particularly complex, but on bigger projects, you''ll find readability
    increasingly important.


    +   **Functions make it easier to maintain and update your program.** You can
    easily find which bits of the program to change, and all the changes you need
