    # Adding blocks


    To add a block to the world, you use this command:


    ```

    mc.setBlock(x, y, z, blockTypeId)

    ```


    blockTypeId is a number that represents the material of the block you''re adding.
    You can find a full list of materials at www.minecraftwiki.net/wiki/Data_values_(Pocket_Edition).
    (Take the number from the Dec column in the table on that page. You may use the
    decimal rather than the hexadecimal one.) Any number from 0 to 108 is valid, and
    a few higher numbers are as well. Table 13-1 shows some of the materials you might
    find useful for this project and experimentation.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_278_0.png)


    If you use water and lava blocks, you could flood the world, to create a new world
    to experiment with.


    There is another command you can use to create a large, cuboid shaped built of
    blocks of the same material. To use it, you provide the coordinates of opposite
    corners and the material to fill the space with, like this:


    ```

    mc.setBlocks(x1, y1, z1, x2, y2, z2, blockTypeId)

    ```


    You can quickly build a brick shelter by making a large cuboid of brick and putting
    a cuboid of air inside it. Air replaces any other block, effectively deleting
    it from the world. Here''s an example:


    ```

    mc.setBlocks(0, 0, 0, 10, 5, 45) #brick

    mc.setBlocks(1, 0, 1, 9, 5, 6) #air

    ```


    These lines build a shelter that is 10 x 7 blocks high, starting at coordinate
    0, 0, 0. The walls have a thickness of 1 block because you fill with air the space
    from 1 to 9 on the x-axis, from 1 to 6 on the z-axis, and from 0 to 5 on the vertical
    axis, leaving intact 1 block of brick from the original cuboid on four sides and
    the roof open.'
