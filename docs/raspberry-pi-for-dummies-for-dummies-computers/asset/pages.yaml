    # Using Your NOOBS Card


    After you have a card with NOOBS on it, you''re ready to set up your Raspberry
    Pi. In the next chapter, we show you how to connect your Raspberry Pi up, insert
    the SD or MicroSD card, and finish installing the operating system.


    # Flashing an SD or MicroSD card


    If you''ve got a NOOBS card, you''re all set and can proceed to Chapter 3. Some
    operating systems may not be available through NOOBS, including RISC OS, which
    we cover in Appendix B on this book''s companion website. (At the time of writing,
    RISC OS is available through NOOBS for the Raspberry Pi 2, but not for the Pi
    3.) To create a card for operating systems, you can''t use NOOBS and must instead
    download the operating system as an image file, and then use a process called
    flashing your card to convert that single image file into all the files you need
    on your MicroSD or SD card.


    You can find links to download operating systems at www.raspberrypi.org/downloads.
    You can also download Raspberry as an image file, if you prefer not to use NOOBS
    to install it.


    To flash your card (also called burning an image to the card), you can use Etcher,
    which is available for Windows, Mac and Linux. Download it at https://etcher.io/'
