    # Using GPIOs as inputs


    The other basic mode of operation for a GPIO pin is as an input. In this case,
    you don''t have to worry about the current, when the pin is an input, and it has
    a high input impedance, or a high value of series resistance, and therefore little
    or no current can flow with normal logic voltages. A resistance is a special form
    of impedance, as its name implies, the flow of electricity. There is a bit more
    to impedance than simple resistance, but at this stage, you can think of them
    as the same sort of thing. They are both measured in ohms.


    Resistance is the property of a material, whereas impedance is the property of
    a circuit and includes how it behaves with AC as well as DC. So input pin has
    a very high impedance. It allows hardly any current to flow through it, so much
    that we can connect it directly to 0V or 3.3V with no extras. In fact, an input
    is so high-impedance that if you leave it unconnected, it picks up very tiny radio
    waves and other forms of interference and gives random values when you try to
    read it.


    In fact, the human body can act as an antenna when close to or touching a high-impedance
    input, causing any readings to go wild. This often amazes beginners, who think
    that have discovered something mysterious. They in fact, the tiny amounts of energy
    in the radio waves that are all around us are not absorbed by the high-impedance
    circuits as they would be by low-impedance circuits. A low impedance would cause
    current to flow, but it would absorb all the power, leaving minuscule amounts
    of voltage. The fact that you have a wire carrying AC power (mains) is close enough
    for that wire to radiate radio interference.


