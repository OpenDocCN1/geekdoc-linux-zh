- pgno: 325
  md: 'be connected between the computer''s power supply of 3V3 or ground (that''s
    OV). This is sometimes called the common ground or reference, and it is the basis
    of all measurements in a circuit. Basically, it''s the other end of the battery
    – the negative terminal, if you will. Between this switch and the output is in
    effect a series resistor, one that is in line with the voltage coming from the
    Pi. It limits the current you can get through the output pin.


    On the Pi, the value of this resistor can be changed over a limited range. The
    default value is 3R, but note that resistor, by itself, is insufficient to protect
    the Pi from giving too much current if you connect it to too low a resistance
    load. If you did this, then your Pi would be permanently damaged. So an output
    pin can switch between two voltages — 0V and 3V3. These are known as logic levels,
    and they have a number of names: high and low, true and false, zero and even up
    and down.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_325_0.png)


    # FINDING A SAFE VALUE OF CURRENT


    There is a value of current that would instantly destroy at least the circuitry
    of the pin, if not the whole Pi itself. But, there is also a value of current
    that would not instantly kill the Pi but would damage the circuitry and lead it
    to fail prematurely. Lower the current, and the damage is lowered, until you get
    to a point where no damage occurs. However, these values are not known for the
    chip used on the Pi. In fact, they are not known for the vast majority of chips.
    It''s best to stick to the "safe" value or lower.


    Beware of people who say that they have a circuit that takes 30mA or more from
    a pin and still working. They tend to be idiots who confuse whether a pin is dead
    with whether a pin is safe. It is just like smoking: You can do it and it doesn''t
    kill you immediately, but it does do harm and eventually it can kill, if nothing
    else gets you first. No one would pretend that it''s safe.


