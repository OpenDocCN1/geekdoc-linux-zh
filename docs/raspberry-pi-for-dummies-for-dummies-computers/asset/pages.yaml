- pgno: 271
  md: '# Exploring Pygame Zero Further


    We hope this project has given you a taste for what Pygame Zero can do. As well
    as supporting mouse clicks, you can use it to detect keypresses, making it possible
    to make more conventional games with characters moving under keyboard control.
    As such, it''s a good foundation for most types of game.


    To find out more, we recommend that you check out the following resources:


    +   Daniel Pope''s blog post announcing Pygame Zero: http://mauveweb.co.uk/posts/2015/05/pygame-zero.html


    +   The Pygame Zero documentation, including simple examples: http://pygame-zero.readthedocs.io/en/latest


    +   The Pygame Zero built-in objects list, with information about actors, images,
    sounds and the clock: http://pygame-zero.readthedocs.io/en/latest/buildins.html


    You can also read Sean''s book *Mission Python* to see how Pygame Zero can be
    used as the foundation for a 3D adventure game.'
