    # ## Using Linux


    We''re using Ubuntu, the most popular desktop distribution, so you might see some
    variations if you prefer a different distribution. These steps should guide you
    well in any case.


    Because this process involves completely erasing a disk (the SD card), make sure
    you have a recent backup of your computer before you proceed, just in case accidentally
    wipe the wrong disk.


    Follow these steps:


    +   1. **You use a utility GParted to set up the SD card on Ubuntu. If you don''t
    already have it installed, start installing it from the terminal.**n   Enter the
    following commands:


    ```

    sudo apt-get update

    sudo apt-get install gparted

    ```


    You can open a terminal window using Dash Home in Ubuntu, the applications menu
