  img_proc: true
- pgno: 125
  md: 'Be especially careful about where you insert spaces when you''re using wildcards.
    Imagine that you add a sneaky space in the previous example, like this:


    ```

    rm -vi * .txt

    ```


    Doh! The shell thinks you want to delete *, which is a wildcard for every file,
    and then to delete a file called .txt. Luckily, you''ve used the -i option, so
    you''ll be prompted before deleting each file — though people often forget when
    they''re deleting a lot of files, because otherwise they spend a long time confirming
    each deletion, which is almost as tedious as not using wildcards in the place.


    One way you can test if files matches a wildcard is to use the file command with
    before you delete it. For example:


    ```

    file .txt | less

    ```


    Take care that you don''t introduce any spaces between testing with file and removing
    with rm!


    Another thing to be careful about is using wildcards with hidden files. Hidden
    files begin with a period (full stop), so you might think that * would match all
    the files, but it also matches the current directory (.) and its parent directory
    (..), so . matches everything in the current directory and the directory above
    it.


    # Removing Directories


    You can use two commands for removing directories. The first one, rdir, is the
    safer of the two because it refuses to remove directories that still have files
    or directories inside them. Use it with the name of the directory you want to
    remove — for example, books, — like this:


    ```

    rmdir books

    ```


    If you want to prune a branch of the directory tree, you can use the rm command
    to remove a directory and delete anything inside and its subdirectories. Used
    with the recursive option (-f), it deletes any files in its way. It''s a rampage
    beast of a command. Here''s an example:


    ```

    rm -Rf books

    ```'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'It acts silently and swifty, deleting the books directory and anything in it.


    You can add the interactive option to cut the risk, which prompts you for confirmation
    of each deletion, as you can see in this example where we''ve left a file in the
    folder work/writing/books:


    ```

    pi@raspberry ~ $ rm -Rfi work

    rm: descend into directory ''work?'' Y

    rm: descend into directory ''work/writing?'' Y

    rm: descend into directory ''work/writing/books?'' Y

    rm: remove regular file ''work/writing/books/rapidplan.txt?'' Y

    rm: remove directory ''work/writing/books?'' Y

    rm: remove directory ''work/writing?'' Y

    rm: remove directory ''work?'' Y

    ```


    You can use wildcard when removing directories, but special care be taken and
    make sure you don''t introduce any unwanted spaces that result in your removing
    (everything). If you use -Rf . to remove directories, you also match the current
    directory (.) and the parent directory (.). That means it deletes every file in
    the directory (hidden or not), all its subdirectories and its contents (hidden
    or not), and everything in the parent directory, including its subdirectories
    (again, whether or not they are hidden).


    ![](img/df9a01bf057d58c2401b5edabd6e8829_126_0.png)


    Our experience of the Linux community has that it''s friendly and supportive,
    and maybe welcome newcomers who want to join. Occasionally, we might come across
    some joker online advising inexperienced users that the solution to their problems
    is to issue the command rm -Rf / as root, which attempts to delete everything,
    starting at the root.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_126_1.png)


    # Copying and Renaming Files


    One of the fundamental things you''ll want to do with your files is copy, so let''s
    take a look at how to do that. The command you need to use is cp, and it takes
    this form:


    ```

    cp [options] copy_from copy_to

    ```


    Replace copy_from with the file you want to copy, and copy_to for where you want
    to copy it.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'For example, if you wanted to copy the file config.txt from the /boot directory
    to your home directory (~) so that you can safely play with it, you would use


    ```

    cp /boot/config.txt ~

    ```


    If you wanted to copy the file into your current working directory, wherever that
    is, you could use


    ```

    cp /boot/config.txt

    ```


    You can also specify a path to an existing folder to send the file by using


    ```

    cp /boot/config.txt ~/files/

    ```


    Your original file and the copy don''t have to have the same name. If you specify
    a different filename, the copy takes that name. For example:


    ```

    cp /boot/config.txt ~/oldconfig.txt

    ```


    That copies config.txt from the /boot directory to your home directory and renames
    it to oldconfig.txt. This same technique enables you to keep a safe copy of a
    file you''re working on, if you want to revert to an old version. The paths are
    optional, so if you were in your home directory, you could create a backup copy
    of the file timeplan there using


    ```

    cp timeplan.txt timeplan.bak

    ```


    You can use several options with cp, some of them familiar from the rm command.
    The cp command overwrites any files without asking your away, so use the -i option
    to ask you before it overwrites any existing files with the new copies. The -v
    option gives you an insight into what the command has done, as it does with rm.


    You can use wildcards, so you can quickly copy your files, or all your files that
    match a particular pattern. If you want to copy subdirectories too, however, you
    need to use the recursive option, like this:


    ```

    cp -R ~/Documents/* ~/homebak

    ```


    That copies everything in your Documents directory (including any subdirectories)
    into a folder called homebak in your home directory. The homebak must exist before
    you run the command for it to work. For advice on using the shell to copy to external
    storage devices, see Appendix A.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'If you don''t want to make a copy of a file, but instead want to move it from
    one place to another, use the mv command. For example, if you misfiled one of
    your images and want to move it from the australia directory to the japan one,
    both in your home directory, you would use


    ```

    mv ~/australia/itinerary.txt ~/japan

    ```


    That works as long as the destination directory exists. If it doesn''t, the command
    assumes that you want the file to have the new filename of japan, and so the file
    stops itinerary.txt in the australia directory, and becomes a file called japan
    in the home directory. It''s confusing if you do it by mistake, but this quirk
    is how you rename files in Linux. You move them from being the old name into the
    new name, usually in the same folder, like this:


    ```

    mv old newname

    ```


    There''s no recursive option with the mv command because it moves directories
    easily as it moves by default.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_128_0.png)


    # # Installing and Managing Software on Your Raspberry Pi


    Linux distributions come with thousands of packages, which are programs that are
    ready to download from the Internet and install on your computer. In this chapter,
    we show you how to use the command line to install software. There is also a simple
    menu for installing software on the Raspberry Pi within the desktop environment,
    described in Chapter 4. You might find it useful to know what''s going on in the
    background, though, and the command line gives you more of a sense of it.


    Some packages require other packages to work successfully, but luckily a program
    called a package manager unt all these dependencies and takes responsibility for
    downloading and installing the software you want, together with any other software
    it needs to work correctly. On the Raspberry Pi, the package manager is called
    apt.


    Installing software requires the authority of the root user or supervisor of the
    computer. The Raspberry Pi doesn''t come with a root account enabled, in some
    with other Linux distributions. One school of thought says that a root account
    is a security threat because people are inclined to include it all the time than
    log in and out of it when they need it. That leaves the system and'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'files vulnerable, including to malicious software that might get in. Instead
    of using a root account, use the word sudo before a command on the Raspberry Pi
    to indicate that you want to carry it out with the authority of the root user.
    You can''t use it before all commands, it''s essential for installing software.



    If you ever get an error message that tells you something can be done only with
    the authority of the root, try repeating the command but putting sudo front of
    it.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_129_0.png)


    # Updating the cache


    The first step in installing software is to update the cache, which is the list
    of packages the package manager knows about. You do that by entering the following
    command:


    ```

    sudo apt-get update

    ```


    You need to have a working Internet connection for this work, and it''s likely
    to take some time. Consider leaving the Raspberry Pi to get on it while you have
    a cup of tea — or a slice of raspberry pie, perhaps.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_129_1.png)


    # Finding the package name


    The package manager cache (the apt cache, in Linux terminology) contains an index
    of all the software packages available. You can search it to find the software
    you want using a tool called apt-cache. For example, you can find all the software
    by using


    ```

    sudo apt-cache search game

    ```


    The list is huge, so you might want to use less to browse it, like this:


    ```

    sudo apt-cache search game | less

    ```


    The screen output looks like this (I left out a couple of additional packages
    near the top of this list relating to @ad):


    ```

    @raspberrypi ~ sudo apt-cache search game

    @ad - Real-time strategy game of ancient warfare

    2048-qt - mathematics puzzlegame

    3dchess - Play chess across 3 boards!

    ```'
  merge: -1
  img_proc: true
