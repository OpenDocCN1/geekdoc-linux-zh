    # # Copying and moving files and folders


    File Manager makes it easy to copy and move your files and folders, without the
    need for any commands.


    When you right-click a file or folder in File Manager, a menu enables you to rename
    your file, move it to the wastebasket, or copy or cut it.


    If you cut a file, it is **moved** wherever you choose to paste it. If you copy
    the file, a *duplicate* of it is placed wherever you paste it. You paste by going
    to the folder where you want the file to be stored and then right-clicking an
    empty space inside a folder and choosing Paste from the menu that appears. If
    you copy or cut a file without pasting it, nothing happens to it.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_84_0.png)


    You can also drag files onto a folder''s icon to move them into it.


