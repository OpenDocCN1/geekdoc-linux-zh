    In the 2013 Way Out West Hackathon in Gothenburg, Sweden, a team created a game
    in which they are challenged to play some panpipes in time with the music. They
    made the fake panpipes by sticking together some short bamboo canes and added
    Arduino sensors to detect when the player blows each pipe. Those sensors were
    connected to the Raspberry Pi''s GPIO, and read using the Python package RPL.GPIO.
    The Raspberry Pi was mounted on the back of the panpipes.


    This inspired and eccentric game runs on a desktop PC and pulls in panpipe game
    from Spotify, challenging players to blow the pipes at the right time to simulate


    # Magic Mirror


    ```

    www.raspberrypi.org/archives/5725

    ```


    For London Fashion Week, Photobot.Co created a photo booth for The Body Shop that''s
    guaranteed to capture your best side. They built three vertical panels, each of
    which has Raspberry Pis and Raspberry Pi cameras in. Together, they make a Magic
    Mirror (see Figure 20-1) that compiles full-body portraits of sub-jects, angled
    from the left, the right, and face-on.'
