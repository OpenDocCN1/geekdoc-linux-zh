  md: "In this case, you just want to draw the cloud actor at its current position,\
    \ so you use\n\n```\ncloud.draw()\n```\n\nCan you work out how to add another\
    \ cloud to the program and position it to the left of the first one? Call cloud2,\
    \ and remember to change its x position and draw it when you've finished. Listing\
    \ 12-2 shows one answer. You can use a different number for the x position of\
