    As with the key detection for the ship, you should keep checking for the alien
    being hit throughout the game, so you should put the If block before a block.
    (See Figure 10-10 in the next section.) Inside the first If block are the instructions
    for what to do when the alien is touching the fireball: Change the alien''s costume
