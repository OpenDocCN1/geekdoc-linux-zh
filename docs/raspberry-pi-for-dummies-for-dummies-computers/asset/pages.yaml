    # Adding Scripts to the Stage


    As well as sprites, you can add scripts to the Stage. Click the Stage in the Sprite
    List and you''ll find that it has its own Scripts Area. It''s a real pain to hunt
    through scripts where you put a particular block so that you can change it, so
    this is a good place to put scripts that affect the whole game and that aren''t
    associated with a particular sprite.


    For this game, you should add a block to the Stage to set the score to 0 when
    the green flag is clicked. Otherwise, the score will increase ever higher with
    each successive game, and it will never be set back to 0 when a new game starts.
    You can also add a block to hide the block when the game begins, to tidy up the
    Stage. The alien will show it again when the game ends. Figure 10-14 shows what
    we mean.


    FIGURE 10-14: The scripts for the Stage.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_218_0.png)


    # Duplicating Sprites


    Because of the way the alien is created in this chapter, the leapsize variable
    applying to only that one sprite, you can add more aliens by duplicating the first
    one. Each alien will have its own leapsize variable that works independently of
    the other alien''s variable. Right-click the alien in the Sprite List and choose
    Duplicate. Having two aliens adds a nail-biting aspect to the game.


    CHAPTER 10 Programming in an Arcade Game Using Scratch 203'
