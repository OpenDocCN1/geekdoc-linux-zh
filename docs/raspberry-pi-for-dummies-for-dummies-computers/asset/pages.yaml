    # # Connecting things together


    Once you know what pins are, you have to connect them to other components to make
    a circuit. The best way to do this is to use jumper wires with pre-crimped connectors.
    Flexible wires often have their connectors crimped, so the joint between them
    is made by squashing the wire and connector. This method is more reliable than
    a soldered joint because no point of stress is created at the point in the wire
    where the solder ends. This is where the flexing wire breaks from metal fatigue.
    To bep a specially designed end to allow the wire and connector to join securely
    when squashed with a special tool.


    The proper name for the pin header on a Raspberry Pi is a Dupont connector; the
    part that slips on the pins is known as a female connector, and the part that
    plugs into a breadboard is a male connector. So, for connecting the header on
    the Pi into a breadboard, you need a female–to–male jumper wire. These often come
    as ribbon wires, which separate easily by simply pulling them apart. You can crimp
    the connectors yourself with the help of a crimping tool, but we recommend that
    you get them alreadyped. For interconnections between points on a breadboard,
    you can use some male–to–male jumper wires, but most people use solid–strand wire
    with the insulation cut a little. To not put too fat a wire into a breadboard
    — you don''t want to stretch the connectors and make it loose to fit components.
    Later to this, we recommend using wire with a0.5mm diameter — otherwise known
    as 24 SWG (Standard Gauge, used in the U.K.) or 24 AWG (American Wire Gauge, used
    in the U.S. and Canada). It just so happens that, at this size, the two standards
    use the same numbers. Or, in the international IEC 60228 which specifies a wire''s
    cross-sectional area, it''s 1.5mm².


    326 PART 5 Exploring Electronics with the Raspberry Pi'
