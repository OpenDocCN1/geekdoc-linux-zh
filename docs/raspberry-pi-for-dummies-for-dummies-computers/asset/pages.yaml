- pgno: 299
  md: 'When you click the Run button, you still hear one sound, but three different
    notes are playing at the same time. It''s actually a C chord you hear, which uses
    the notes C (60), E (64), and G (67). If you want to play the notes separately,
    you can add a pause between them using the sleep command:


    ```

    play 60

    sleep 0.5

    play 64

    sleep 0.5

    play 67

    sleep 0.5

    play 72

    ```


    There is an extra higher C on the end of that sequence to make it sound like a
    fanfare. You can experiment with writing your own tunes. Just put together a sequence
    of notes.


    Table 14-1 shows the standard MIDI notes, which run from 0 to 127. In practice,
    they sound extremely high at the end and descend into indistinct thuds at the
    low end. For best results, we recommend keep your numbers between 48 and 96, but
    free to find out what sounds good to you.


    # TABLE 14-1


    # MIDI Notes


