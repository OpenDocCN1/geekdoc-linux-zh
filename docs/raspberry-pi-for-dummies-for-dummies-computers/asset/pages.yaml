- pgno: 70
  md: 'You can use lots of different options to still take photos, too. This example
    takes a shot with the pastel filter and flips the picture horizontally (-hf) and
    vertically (-vf):


    ```

    raspberryill -ifx pastel -hf -vf -o testshot2.jpg

    ```


    All those hyphens and letter combinations might seem a bit random to you now,
    but after you read Chapter 5, they should make more sense. To see the document-ration
    for raspberryill, type


    ```

    raspberry 2&1 | less

    ```


    Use the down-arrow key to move through the information, and press Q to finish.


    Your photos are stored in your pi directory. See Chapter 4 for instructions on
    how to use File Manager to manage your files and Image Viewer to see them.


    To shoot video, you use raspavid. Enter this command to shoot a 5-second film:


    ```

    raspberry -o testvideo.h264 -t 5000

    ```


    You can view the video you made using


    ```

    omplayer testvideo.h264

    ```


    The video footage is captured as a raw H264 video stream. For greater compatibility
    with media players, it''s a good idea to convert it to an MP4 file. Start by installing-MP4box
    using this command:


    ```

    sudo apt-get install mpac

    ```


    Then you can convert your video file (called testvideo.h264) into an MP4 file
    (called testvideo.mp4) like this:


    ```

    MP4Box -add testvideo.h264 testvideo.mp4

    ```


    You can get help using raspberry with


    ```

    raspberry 2&1 | less

    ```


    There is also a library you can use in Python to access the camera from your own
    Python programs. For more information on using the Raspberry Pi Camera Module,
    see the documentation at www.raspberrypi.org/documentation/usage/camera.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Setting Up the Data Partition


    The data partition is an area on your SD or MicroSD card that can be shared by
    different distributions, for example to transfer files between them.


    The data partition has the label data, and you can use this to make a directory
    point to it. If you want to do this, you are probably already experienced with
    Linux and can follow this step easily — if not, we suggest you come back to this
    after you''ve read Chapter 5 and know how to use the command line:


    +   1. Boot your Raspberry Pi into Raspian, and click the Terminal icon on the
    desktop to get to the command line.


    +   2. Create a directory by typing the command mkdir sharedfolder after the prompt.


    +   3. Use sudo chown -L data sharedfolder to point the directory to the shared
    partition.


    +   4. Use sudo chown $USER:sharedfolder to set the permissions so that you can
    write in this folder.


    +   5. Type cd sharedfolder to go into your shared folder.


    Any files you copy into that folder or create there will be available to other
    distributions that can access the data partition.


    # Taking Your Next Steps with the Raspberry Pi


    Now you have your Raspberry Pi set up and working. What next?


    Chapter 4 shows you how to use the desktop environment, which uses windows and
    icons, and how you can use it to browse the web, manage your files, view your
    images, edit text files, and more.


    Chapter 5 shows you how you can use the Linux command line to manage your Raspberry
    Pi and its files.'
  merge: -1
