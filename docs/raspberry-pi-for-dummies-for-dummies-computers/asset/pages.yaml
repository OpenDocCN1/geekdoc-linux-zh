  md: 'The first sector''s first bytes contain the UID that, along with the other
    bytes in that sector, cannot be changed. Attempts to write it will fail. The sectors
    containing all zeros are the sectors you can write data to. Each group of sectors
    is preceded by a sector that contains two keys that allow read and write access
    to the following sectors. You don''t directly into these, but writing to the sectors
    can change these values. They''re initially set up, as shown here, with the default
    key values. When you plan a project, be aware that you can only write data to
    those sectors that are not key sectors.


    # Key sectors not to write to


    0, 3, 7, 11, 15, 19, 23, 27, 31, 35, 39, 43, 47, 51, 55, 59, 63


