    # Chapter 18


    # Old McDonald’s Farm and Other RFID Adventures


    The RFID card (short for Radio Frequency Identification card) is becoming ubiquitous.
    It’s being used these days for not only building–access control but also travel
    cards, prepayments at cafeterias, and even antifrovery protection tickets. They
    can also be used in amusement park wristbands, and even blood donor cards. When
    your pet is chipped, a small glass-encapsulated RFID tag is injected under the
    skin at the neck of the animal.


    Given all the things that can be done with RFID , you might think they are complex
    devices, and you would be right. However, if you pack away the complexity in a
    very smart chip and hide the interaction with that chip in a class driver, actually
    using them in a project is remarkably easy. There are lots of fun things you can
    do with RFID cards, and we’re going to show you a few of them in this chapter.


    CHAPTER 18 Old McDonald’s Farm and Other RFID Adventures 389'
