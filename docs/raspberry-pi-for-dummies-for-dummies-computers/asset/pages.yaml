    ```

    do

    sample :loop_industrial, beat_stretch: 2

    sleep 2

    end

    ```


    Now the sample is stretched over 2 beats, and there is a 2-beat pause between
    each repetition. As a result, you can hear a continuous rhythm. As you saw experimenting
    with live loops, you can change the tempo with the use_bpm command.


    # Adding Special Effects


    You can play a sample and add effects to it, including distortion, echo, and reverb.

    There is a full list of effects (also known as Fx) in the Help pane, and you can
    also find them using the autocomplete feature. This is how you add to one of the
    guitar samples:


    ```

    with_fx :distortion do

    sample :guit_e_eighths

    end

    ```


    You can adjust how the effect is applied to the sound using sounding options.
    There are several options for distortion, including distort, which controls how
    much the sound is distorted, and mix, which controls the balance between the original
    sound and the distorted version. In both cases, the value should be between 0
    and 1.

    Here is how you use them:


    ```

    with_fx :distortion, distort: 0.9, mix: 0.5 do

    sample :guit_e_eighths

    end

    ```


    Try using different values for those options and running the code to see how the
    sound changes. Experiment with other effects too.


    > To see the full options for any other effect, click Fx in the Help pane, or
    click the effect name in your code and use Ctrl+I to jump to its entry (available)
    in the Help. You can also use Ctrl+I to get help on commands in your code.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_307_0.png)'
  merge: -1
  img_proc: true
- pgno: 308
  md: "# Synchronizing with Your Drumbeat\n\nYou now know how to play a repeating\
    \ rhythm, and how to play other samples and synth melodies. You can play multiple\
    \ live loops at the same time. One of the challenges is to synchronize all the\
    \ parts of the music so they play live. To do that, you can provide an option\
    \ to synchronize the start of a live loop with the name of another live_loop.\
    \ Here's an example that synchronizes a cymbal beat with the main drum loop:\n\
    \n```\nlive_loop :drums do\n  sample :loop_industrial, beat_stretch: 2\n  sleep\
    \ 2\nend\n\nlive_loop :ymbals, sync: :drums do\n  4.times do\n    sample :elec_cymbal\n\
    \    sleep 1\n  end\n  sleep 8\nend\n```\n\nWhen you play that example, you'll\
    \ hear the cymbal plays four times, perfectly sync with the main drum. It rests\
    \ for 8 beats before playing again.\n\nTake care with the colons when setting\
    \ the sync option for your live loop; otherwise, the program won't work. The first\
    \ colon (after sync) goes between the option and its parameter and touches the\
    \ option name, and the second colon (before drums) marks the start of the loop\
    \ name you want to synchronize with.\n\n# Bringing It All Together\n\nListing\
    \ 4-1 brings together the ideas in this chapter. It uses the loop_Industrial sample\
    \ as the backbone, with the other live loops synchronized to start in time with\
    \ it. It is a melody live loop, which plays random notes from the list provided.\
    \ The list includes some note vocals, as the songs tend towards using the C note\
    \ more often. There is a loop that plays higher notes quickly over the top, and\
    \ a bass part that is played using the play_pattern_timed instruction you saw\
    \ earlier in this chapter. Finally, there is another live loop that adds the amen\
    \ drumbeat on top, in bursts. It plays 8 times, but the sleep command is used\
    \ to stop the beat from starting immediately, and to put a gap between each burst."
