  md: '# Figure 17-11: Adafruit''s high-density matrix display.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_398_0.png)


    We address the LEDs in a strip, they''re numbered from zero to the length of the
    strip, and basically it is the same. However, when thinking about a matrix, it''s
    much more convenient to consider the x and y address of an LED; one of the fundamental
    routines when driving a matrix is to convert an x/y pair into an LED number. The
    actual conversion involved depends on how the LED chain is bent into a matrix.
    The Adafruit matrix uses what is called a bottom-up raster arrangement. The LEDs
    start off at zero in the lower-left of the matrix (known as the origin) and increase
    along the x-axis. When the end of the x is reached, the next LED number is directly
    above the original origin. This repeats along the second row, and the third, and
    so on until the end of the strip (The other fundamental way of wiring a matrix
    is known as a serpentine raster, where the strip zigzags up the strip. You can
    see these different methods in Figure 17–12.)


