- pgno: 374
  md: 'Here''s why. If you only have one resistor, then the voltage level that the
    resistor will drop depends on the current running through it. That means the brightness
    will change depending on which LEDs are on. Even worse, if the red LED is on,
    there''s not enough voltage across the other two LEDs to turn them on. This is
    because each color of LED drops a different voltage when it is on, and red drops
    the lowest voltage. It will appear that the other colors are not working — not
    good.


    # Making Colors


    With the wiring schematics out of the way, it''s time to turn the few stuff: mixing
    colors. Yes, you can turn on just one LED at a time, and that will give you one
    of the three colors — red, blue, or green. However, turn two on and the colors
    will mix in a way known as *adding mixing*. The primary colors are red, green,
    and blue. Mixing them together gives you other colors, the-called *secondary colors*.
    So as red—and-green light make a yellow one. A green-and-blue light makes a cyan
    color, and a red-and-blue light makes magenta. Turn on all three LEDs together
    and you make white — or, more precisely, you make a white.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_374_0.png)


    In theory, all three LEDs will make white, but in practice this depends on the
    exactness of the three separate lights. They have to be identical to make a pure
    white; otherwise, the white looks tinted, which is not altogether better. It''s
    not an easy task to do this, because each color has a different voltage drop —
    you need different resistors to ensure the same current through each LED. Not
    only, that each color of LED converts to brightness with a different efficiency,
    which complicates things tremendously.


    You might be using colored paint, but in mixing you you get different results
    than doing this mixing light. Paint mixing is as *subtractive mixing* because
    each color you put into the mix takes out (or subtracts) some other color. This
    is how your color printer works. For subtractive mixing, the primary colors are
    cyan, magenta, and yellow; red, green, and blue being the-ary colors.


    # Using diffusers


    The light from three LEDs in the same package will still be as three separate
    points of light, unless there is some sort of diffuser, which allows the light
    to mix even. For individual RGB LEDs, this is sometimes provided by the package
    or body of the LED itself. Viewing distance also can provide enough diffusion
    to mix the colors, but often a diffuser of some sort will help. Diffusers also
    reduce the brightness per unit area of the LED, making it much easier to take
    a good color picture.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'You can use anything that is translucent as a diffuser. Our favorite is a very
    thin styrene sheet — about 0.5mm thickness is fine and easy to work with, because
    it can be cut with scissors. (A good alternative is a simple sheet of paper.)
    If you have several LEDs and want to see the light from each individually, then
    you have to have each one surrounded by a light baffle — sometimes loosely in
    an egg box, or waffle box. Without the baffle, the light from each LED mixes with
    adjacent to it and gives a soft effect that is not at all unpleasant. The degree
    of diffusion you get is proportional to not only the diffusing material but also
    the distance of material from the LED. In many cases, a few millimeters is fine.


    You can turn the clear-plastic housing LED into a diffuser by rubbing it with
    very fine sandpaper or wire wool. Even better is to use a foam-backed sanding
    block, because it rounds the curves better than paper. These LED housings are
    made of resin, so solvents like acetone do not affect the surface.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_375_0.png)


    # # Making more colors


    The trick to making more colors than the primary and secondary colors is to have
    different brightness of each of the three colors. In that way, many more subtle
    colors can be. So how can you control the brightness of an LED? Well, the answer
    might not be immediately apparent, but what you need to do is to turn the LED
    on and off very rapidly. If you do this fast enough — that is, faster than 30
    times a second — then the eye/brain sees this as a light that is constant and
    not flickering. Furthermore, you perceive the brightness of the LED according
    to the relative length of the On and Off times. That is, if the LED is on and
    off for equal times, the LED appears to be only half as bright. This rapid switching
    technique is known as PWM — short for Pulse-Width Modulation and is the way you
    control the LED’s brightness. The waveforms are shown in Figure 17-3.


    | | Bright |

    |---|---|

    | On |

    | Off |

    | On | Medium |

    | Off |

    | On | Dim |



    FIGURE 17-3: A PWM signal controlling the LED''s brightness.


    360 PART 5 Exploring Electronics with the Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 376
  md: "You can see that the PWM signals go on and off at the same speed; however,\
    \ the one that spends more time being on is brighter than the one that spends\
    \ only half the time being on. Finally, the last waveform has a little time on\
    \ but a long time off and produces a dim LED. The ratio of the On to the Time\
    \ is known as the duty cycle of the waveform. Note that the frequency of this\
    \ PWM signal does not matter once it is above the rate you see it flicker.\n\n\
    The RPi.GPIO library has the ability to make the GPIO pins output a PWM signal,\
    \ and the library can set both the frequency and duty cycle. If you use an RGB\
    \ LED according to Figure 17-3, you can test the colors an RGB LED can produce\
    \ with the code in Listing 17-1.\n\n# LISTING 17-1: RGB Color Test\n\n```\n#!/usr/bin/python3\n\
    import time\nimport RPi.GPIO as io\n\nio.setmode(io.BCM)\nio.setup(17,io.OUT)\
    \ # make pins into an output\nio.setup(27,io.OUT)\nio.setup(22,io.OUT)\n\nledR\
    \ = io.PWM(17,60) # Set outputs as PWM @ 60Hz\nledG = io.PWM(27,60)\nledB = io.PWM(22,60)\n\
    \nledR.start(0) # start off the PWM\nledG.start(0)\nledB.start(0)\n\nprint(\"\
    RGB color cycle an LED using RPi.GPIO - By Mike Cook\")\nprint(\"Ctrl C to quit\"\
    )\ntry:\n    while(1):\n        print(\"Start cycle\")\n        time.sleep(2.0)\n\
    \        for stepR in range(0,100,5):\n            for stepG in range(0,100,5):\n\
    \                for stepB in range(0,100,5):\n                    ledR.ChangeDutyCycle(stepR)\n\
    \                    ledG.ChangeDutyCycle(stepG)\n                    ledB.ChangeDutyCycle(stepB)\n\
    \                    time.sleep(0.1) # While 8000 times this\n```\n\nCHAPTER 17\
    \ Lots of Multicolored LEDs 361"
