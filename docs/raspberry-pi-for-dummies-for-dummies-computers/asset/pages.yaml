- pgno: 38
  md: '# Chapter 2


    # Downloading the Operating System


    Before you can do anything with your Raspberry Pi, you need to provide it with
    an operating system (OS). The operating system software enables you to use the
    computer''s basic functions and looks after managing files and running applications,
    like word processors or web browsers. Those applications use the operating system
    as an intermediary to talk to the hardware, and they won''t work without it. This
    concept is unique to the Raspberry Pi. On your laptop, the operating system might
    be Microsoft Windows or Mac OS. On iPads or iPhones it''s iOS, and on other devices
    it might be Android.


    In this chapter, we introduce you to Linux, the operating system most frequently
    used on the Raspberry Pi, and we show you how to create an SD or MicroSD card
    with an operating system on it. You''ll need to use another computer to set up
    the SD or MicroSD card. It doesn''t matter whether you use a Windows, Mac OS,
    or Linux machine, but you need to have the ability to write to SD or MicroSD cards
    using it and a connection to the Internet.


    CHAPTER 2 Downloading the Operating System 23'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Introducing Linux


    The operating system used on the Raspberry Pi is GNU/Linux, or often just Linux.
    The Raspberry Pi might be the first Linux computer you''ve used, but the operating
    system has a long and honorable history.


    Richard Stallman created the GNU Project in 1984 with the goal of building an
    operating system that users were free to copy, study, and modify. Such software
    is known as free software, and although this software is often given away, the
    ideology behind it is free as "free speech" rather than free in "free beer." Thousands
    of people have joined the GNU Project, creating software packages that include
    tools, applications, and even games. Stallman aimed to make his operating system
    compatible with Unix, an operating system that was created by AT&T''s Bell Labs
    and started to gain popularity in the 1970s. That would make it easy for Unix
    users to switch to the GNU Project.


    In 1991, Linus Torvalds released the central component of Linux, the kernel, which
    acts as a conduit between the applications software and the hardware resources,
    including the memory and processor. He still works on the Linux kernel, sponsored
    by the Linux Foundation, is the nonprofit consortium that reports over 11,800
    people from almost 1,200 different companies have contributed to the kernel since
    2005.


    GNU/Linux brings together the Linux kernel with the GNU components it needs to
    be a complete operating system, reflecting the work of thousands of people on
    both the GNU and Linux projects. That so many people could cooperate to build
    something as complex as an operating system, and then give it away for anyone
    to use, is a modern miracle.


    Because GNU/Linux can be modified and distributed by anyone, lots of different
    versions of it exist. They''re called distributions, distros, but not all of them
    are suitable for the Raspberry Pi. The recommended distribution of Linux for the
    Raspberry Pi is Raspian. Software created for one version of Linux usually works
    on another version, but Linux isn''t designed to run Windows or Mac OS software.


    Strictly speaking, Linux is just the kernel in the operating system, but as is
    commonly done, we refer to GNU/Linux as Linux in the rest of the book.


    PART 1 Setting Up Your Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Creating a NOOBS Card


    The easiest way to get started with the Raspberry Pi is to use the NOOBS software.
    NOOBS is short for new-out-of-box software, although it''s also a pun on the term
    noob, sometimes used to describe beginners in it of computing. Don''t underestimate
    the power of this software, especially if you''re a more experienced user: NOOBS
    is easy to copy to the SD or microSD card, but provides you with a simple menu
    for installing a number of different operating systems, including different versions
    of Linux and the Kodi media center software. The options are described in more
    depth in Chapter 3.


    As we say in Chapter 1, you can buy a card with NOOBS already on, and that might
    be the quickest way to get started. If you''ve got one of these, you can skip
    ahead to Chapter 3 — but read through this chapter while you''re waiting for the
    OS to install. It''s useful to know how to create your NOOBS cards: it means you
    can get started with a new card in about 20 minutes, rather than waiting for the
    postman to deliver one.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_40_0.png)


    You can also find links to a specific operating system (Raspian) at the Raspberry
    Pi website and install OS on the SD or microSD card. In that case, the download
    is in a special format (an image file) that describes all the files that need
    to be created on the SD or microSD card. To convert the image file into an SD
    or microSD card that will work on the Raspberry Pi, you need to flash the card,
    and you can''t just copy the files. (See the section on flashing your card at
    the end of this chapter.)


    # Downloading NOOBS


    In your browser, visit www.raspberry.org/downloads/noobs. Two versions of NOOBS
    are available: the main version of NOOBS includes Raspian, the officially supported
    operating system, so you can use it even if you don''t have a network connection
    on your Raspberry Pi; NOOBS also includes a menu for choosing other operating
    systems to download and install from the Raspberry Pi, if you have a network connection.
    We recommend you download NOOBS for your first operating system.


    NOOBS Lite leaves out the Raspian software and includes a menu to download whichever
    operating system you want to use. It''s a smaller download, and it''s ideal if
    you don''t plan to use Raspian. It needs a network connection on your Raspberry
    Pi to download an operating system, though.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Formatting the SD card


    For best results, you need to format the SD or MicroSD card. You can use a program,
    available from the SD Association, called SD Card Formatter on Mac and Windows,
    and you can find it at www.sdcard.org/downloads/formatter_4. You need to read
    and accept the license agreement you can download.


    If you''re using Linux, you can use GParted to format the card, and we will show
    you how.


    Earlier models of the Pi used a physically larger SD, but later ones use a MicroSD
    card. The MicroSD cards often come with a holder to make them work and look like
    SD cards. (Refer to Figure 1-3, in Chapter 1). You have to plug the MicroSD card
    into this or on your desktop or laptop computer.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_41_0.png)


    Whichever computer you''re using, you need to be careful in doing this. When you
    format an SD or MicroSD card, its previous contents are completely erased, so
    make copies of any files or photos you might need from the card before you begin.
    Make sure you have a backup of your hard drive, and disconnect removable disks
    before you start, to minimize the potential damage from accident-formatting the
    wrong disk.


    # Using Windows


    The Windows SD Card Formatter software downloads as an executable (.exe) file,
    double-click to run. Click Next to work through the steps. The program suggests
    to install SD Card Formatter, but you can change this location if you want. Finally,
    click the Install button. You may receive an alert from Windows telling you that
    a program is making changes to your computer and asking whether this is allowed.


    After installing SD Card Formatter, you can use the Windows Search feature to
    find and run it. On Windows 10, click the box in the bottom left of the screen
    to start the search. If you''re using Windows 8.1, move the mouse to the top-right
    corner and click the magnifying glass to open the search. In older version of
    Windows, type SD and click the program name when it appears. (On older versions
    of Windows, run SD Card Formatter from the Start menu in the bottom left of the
    screen.). When you run the program you may be prompted to confirm it is allowed
    to make changes to your computer.


    Figure 2-1 shows the SD Card Formatter software on Windows. Where it says Select,
    select the drive that contains the SD or MicroSD card. If no drive is shown, try
    Refresh. Check the drive displayed here, and double-check as often as you need
    to, make SD Card Formatter erases everything on this drive. It''s a sensible precaution
    to disconnect USB drives and any other removable storage, to protect them from
    accidental deletion before you go further.


    PART 1 Setting Up Your Raspberry Pi'
  merge: -1
  img_proc: true
