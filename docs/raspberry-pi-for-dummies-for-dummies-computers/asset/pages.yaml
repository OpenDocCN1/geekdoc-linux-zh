  md: '# Selecting multiple files and folders


    There are several ways to select more than one file at a time so that you can
    delete, copy, or move them all at the same time:


    +   - Hold down the Ctrl key and click each of the files in turn to select them.

    - To select a group of consecutive icons (read from left to right, top to bottom),
    click the first icon, hold down the Shift key, and then click the last icon.

    - Click the mouse on the background of File Manager and hold the button while
    you lasso the files you want to select.


    After you''ve selected a group of files, you can drag them all into a different
    folder by clicking one of the selected files and dragging it into the folder.
    You can also right-click one of your selected files and choose to copy the whole
    group, as shown in Figure 4-6.


