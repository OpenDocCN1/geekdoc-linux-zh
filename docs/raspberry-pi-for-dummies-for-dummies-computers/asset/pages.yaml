    for the Raspberry Pi. It includes graphical desktop software (see Chapter 4),
    a web browser (see Chapter 4), and various development and programming tools.
    This is the quickest to get up and running with Raspberry Pi, and for most users,
    this is the one you''ll want to use. For the rest of this book, except where noted
    otherwise, we assume you''re using Raspian. There are two versions available:
    one with PIXEL desktop and one that is more minimal installation (called **Raspian
    Lite**). We recommend you choose the one with the desktop unless you need the
    other for a particular project.


    +   **LibreeELEC and OSMC:** These are versions of the Kodi media center for playing
    music and video. See Chapter 8 for a guide to using this.


    +   **RIS OS:** Most people run Linux on the Raspberry Pi, you can also use an
    alternative operating system RIS OS, which has a graphical interface. RIS OS dates
