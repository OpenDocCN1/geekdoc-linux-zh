    # Sound Fighter


    ```

    www.foobarflies.io/pianette

    ```


    To mark the reopening of the Maison de la Radio in Paris as a cultural centre,
    Jean Weessa and Mélanie Pennec had the idea of creating an installation that uses
    two upright pianos as game controllers for Street Fighter on the PlayStation.


    Eric Redon and Cyril Chapellier brought the idea to life using a Raspberry Pi
    Model B+ as the brains of the operation, receiving all the piano keypresses, and
    piezo sensors attached to the piano hammers that detect when a key is struck.
    The project also required them to create custom-printed circuit boards, and use
    an Arduino Uno to feed the keypresses into the PlayStation. Their code was written
    in Python 3.


    To create a gameplay experience that made good pianists gamers, and made it sound
    as musical as possible, player movements were assigned to the left-hand keys,
    actions were assigned to the right-hand keys and both pianos played in the same
    musical scale. Later modifications of the project include using the foot pedals
    for long button presses and expansion to the additional games Tekken5 (another
    beat-''em-up) and Crash NitroKart (a racing game).


    You can read about the challenges involved in building this project, and how they
    were overcome, at the website. You can also find the code and designs if you want
    to replicate the project.'
