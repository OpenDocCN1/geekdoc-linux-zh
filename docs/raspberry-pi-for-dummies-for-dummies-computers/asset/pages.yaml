    and you can check online reviews to see whether others have experienced difficulties
    using a particular device with the Raspberry Pi.


    If you’re buying new devices, you can minimize the risk by buying recommended
    devices from Raspberry Pi retailers.


    In any case, you should set a little bit of money aside to spend on accessories.
