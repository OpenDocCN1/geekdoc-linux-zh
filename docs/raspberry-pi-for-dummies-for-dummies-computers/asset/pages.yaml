- pgno: 457
  md: 'Dave''s favorite experience was sending Babbage, the teddy bear mascot of the
    Raspberry PI, up to 39 kilometers and releasing it for freefall. “The first attempt
    failed due to a combination of factors — a windy launch meant Babbage''s support
    line wasn''t in the right place around the heated resistor to cut him free, and
    for weight reasons I''d been cautious using a smaller and less powerful battery
    pack than was ideal,” says Dave. Success is always sweeter after an initial failure,
    and it was a lovely moment when I knew he''d been released properly on the second
    flight.


    Dave''s early projects involved hand-building systems for tracking flights using
    GPS and for transmitting signals, photos, and other data to the ground. The PI
    in the Sky kit is now available to provide these offers off the shelf. You can
    also use the kit in combination with the Sense HAT (Chapter 19) to send sensor
    data back to the ground. Among other things, Dave''s used the PI to predict the
    landing position on the way down. Part of the challenge of high-altitude ballooning
    is recovering the payload, given predictions that be off by 5 miles or more.


    High-altitude ballooning is a satisfying hobby, but it''s one that requires planning
    and commitment. You will most likely need permission for each flight that you
    don''t endanger aircraft, and you''ll need to budget several hundred dollars or
    pounds for the equipment, and a couple hundred for the balloon, gas and fuel for
    the chase vehicle on each flight. Plenty of help is available, to help you make
    a success of it: Start reading Dave''s tutorial at www.daveaker.com/?p=1732, join
    the #highaltitude channel at https://webchat.freenode.net, and visit the UK High
    Altitude society website www.ukhas.org.uk.


    # Raspberry Turk


    www.raspberryturk.com


    You might have heard of the Mechanical Turk, an elaborate illusion that was claimed
    to be a chess-playing table, from 1770 to 1854. In fact, a chess master was hidden
    inside the table, making the moves and controlling the dummy of a chess in Turkish
    dress who was playing the game. The Mechanical Turk went on to give its name to
    a service from Amazon where people complete tasks over the Internet, and now to
    Raspberry Turk, a genuine chess-playing robot.


    Raspberry Turk is built around the open source Stockfish chess engine, which plays
    the games. A Raspberry Pi is used to control a robot arm that moves the chess
    pieces. A Raspberry Pi Camera Module is used with computer vision software to
    see when it''s the computer''s turn to play, by checking for the player''s


    442 PART 6 The Part of Pens'
