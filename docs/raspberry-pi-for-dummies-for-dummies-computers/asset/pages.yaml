  md: 'We recommend using a good quality 60/40 tin/lead solder alloy, with a diameter
    of 0.7mm and a built-in rosin-based flux core. Anything else is making life difficult
    for yourself. We''ve found that solder with self-cleansing fluxes or non-fuming
    fluxes are harder to work with, as well being more expensive. The right kind of
    solder with a good soldering iron, preferably a temperature-controlled with one
    fine tip.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_331_0.png)


    TIP


    It is often said that you can use any old tool to learn on, and then get a good
    tool when you get at using it. This is rubbish. As a beginner, you are fighting
    how to do the job, so you don''t want to fighting your tools as well. A good iron
    includes a stand and a sponge for,, removing flux that has accumulated during
    the soldering process. If it were not removed, it would form a glassy layer that
    would prevent the iron from making good thermal contact with the solder of joint.
    Use a proper soldering sponge—a natural one that won''t melt on contact with the
    iron. Do not use a plastic foam sponge because your iron will go through it.


    # Making a soldered joint


    The first thing you should do when making a soldered joint is to make a mechanical
    joint. For example, if you''re joining two wires, bend each end into a hook and
    squeeze together lightly with pliers.


    Wipe the tip of the iron on a damp sponge, and melt just a spot of solder on the
    tip. This "wets" the tip and allows good thermal contact to take place between
    the tip and the work. Then apply the iron, solder, and wires all together. The
    secret is then to look at the joint and the solder closely, to see how it sits.
    Remove the solder, but keep the iron on the joint until you see the flow around
    the joint and see it into the cracks. Then is the joint hot enough for you to—draw
    your iron. It is a quick process and needs a bit of practice.


    Many beginners make the mistake of putting too much solder on a joint. Try to
    use as little as possible. A joint is rarely because of too little solder, but
    it''s often because of too much. When you are done, you see a small amount of
    black flux residue around the iron tip. Wipe that away on a damp sponge returning
    the iron to its stand. Do not move the joint as the solder sets.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_331_1.png)


    REMEMBER


    A good-quality iron is ready immediately for the next joint. A poor iron needs
    few seconds to come up to temperature again after making a joint.'
