  md: 'sprite''s rotation by clicking the sprite''s i button in the Sprite List, and
    then clicking and dragging the blue line on the direction indicator. When you''ve
    finished, click the back arrow to show the Sprite List again.


    Not all of the blocks will work at the moment because some of them need to be
    combined with other blocks. There''s no harm in experimenting, however. If you
    click something that doesn''t work, you might get an error message, but you won''t
    cause any harm to Scratch or your Raspberry Pi.


    Next, you can use the different Motion blocks you can use.


    # Using directions to move your sprite


    You can use two different methods to position and move sprites. The first is to
    make your sprite "walk," and to change its direction when you want to walk the
    other way. The other is using grid coordinates, which we cover in the next section.


    Here are the blocks you use to move your sprite in this (see Figure 9-3):


    +   Move 10 Steps: This makes your sprite walk in the direction it is facing.
    If your sprite has been rotated, the steps taken could move it in a diagonal line
    across the Stage. You can click the number in this block and then another number
    to increase or decrease the number of steps taken, but bigger numbers spoil the
    illusion of animation. It looks like the sprite is walking across the screen when
    the number of steps taken is too big.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_183_0.png)


    > Scratch is developed by the Lifelong Kindergarten Group at the MIT Media Lab.
    https://scratch.mit.edu.


    +   Turn Right or Left 15 Degrees: This block rotates your sprite. As the number
    of steps, you can edit the number to change the degree by which your sprite is
    rotated. It walks in the direction it is facing when you use Move 10 Steps block.'
