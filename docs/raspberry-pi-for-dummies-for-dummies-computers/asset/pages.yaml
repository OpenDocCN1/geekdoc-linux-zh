    # Showing sprite information on the Stage


    It can be hard to keep track of where your sprite is and in which direction it''s
    facing, but you can show the values for its X position, Y position, and direction
    on the Stage. Select the boxes at the bottom of the Blocks Palette to do this,
    as shown in Figure 9-7. They clutter the screen a bit, but they can be essential
    for testing when you''re creating a game.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_187_0.png)


    # Changing your sprite''s appearance


    As well as moving your sprite around the screen, you can change what it looks
    like.


    # Using costumes


    One way to use sprites is like the characters in a game (although they can be
    used for lots of other objects, too, such as obstacles). Each sprite can have
    a number of costumes, which are different pictures of it. If the costumes look
    fairly similar, you can create the illusion of animation by switching between
    them. Your cat comes with two costumes, and when you switch them, it looks like
    the cat is running. You can think of a costume as being one image in an sequence
    (an frame).


    You can see the costumes for your sprite by clicking the Costumes tab at the top
    of the Scripts Area, as shown in Figure 9-8. If you want to modify the cat''s
    appearance, you can click the button to edit one of the costumes in Scratch or
    simply click the sprite in Scratch 2 and use the editing canvas to paint it. If
    you want to create a new animation frame, you can click the Copy button beside
    a costume in Scratch, or in Scratch 2 you can right-click the costume and duplicate
    it from the menu that opens. You can then edit the bits you want to change.'
