    # Backing Up Your Data


    If you want to back up your files, you can easily copy them to a USB key using
    File Manager as described earlier in this chapter, or using shell commands. (See
    Chapter 5 on file copying, and Appendix A for more on mounting external storage
    devices.) If you''ve got a lot of files on the microSD card, though, and you''ve
    spent time customizing with your preferred settings and software, you might prefer
    to make a backup copy of the entire card. There''s an application to do this,
    called SD Card Copier, which you can find in the Accessories section of the Menu.


    To use SD Card Copier effectively, you need a microSD card reader, which will
    enable you to read and write microSD cards from your Raspberry Pi, using a device
    plugged into one of the USB ports. If you don''t have a microSD card reader, you
    can use the application to back up to a USB flash drive; you would need a card
    reader, though, to restore the backup to a microSD card so that you can use


    ![](img/df9a01bf057d58c2401b5edabd6e8829_99_1.png)


    The microSD card or the USB key that you back up will be totally erased. Ensure
    that there''s nothing on it before you begin.'
