- pgno: 196
  md: '![](img/df9a01bf057d58c2401b5edabd6e8829_196_0.png)


    # # What’s new in Scratch 2


    The two versions of Scratch on your Raspberry Pi share the same core blocks, but
    there are a few differences in Scratch 2 to be aware of:


    +   **Events blocks:** This is a new category of blocks introduced in Scratch
    2. It includes blocks that were categorized as Control in the older version of
    Scratch. If the block starts with “when” or “broadcast,”you’ll probably find it
    in the Events part of the Blocks Palette in Scratch 2. (The exception is When
    I Start as Clone, which remains a Control block.)

    **Cloning:** There’s a new feature in Scratch 2 to enable creating copies (or
    clones) of themselves. Those clones can run scripts that start when the clone
    is created. You can find the blocks to experiment with cloning in the Control
    part of the Blocks Palette.

    **More Blocks:** Scratch 2 enables you to build your blocks by combining existing
    blocks. It’s a great way to make programs that are easier to read. Click the More
    Blocks button above the Blocks Palette to try it.

    **Data:** The variables of the Blocks Palette has been renamed to Data in Scratch
    2. It is otherwise the same. We cover variables in Chapter 10.


    Despite these differences, you should find that programs written for the original
    Scratch will work in Scratch 2, so you can use tutorials and books as needed.
    For more guidance on Scratch 2, see our recommended resources at the end of Chapter
    10.'
