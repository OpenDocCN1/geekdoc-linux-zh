    # # Enabling a sprite to control another sprite


    In programming, you can choose between several ways to achieve the same effect.
    The game''s firing mechanism is one such example. You could sense the spacebar
    (the Fire key) being pressed using a script on the fireball, for example, and
    then use that to trigger the fireball''s ascent.


    We use the firing mechanism as an opportunity to show how you can make one control
    sprite another, however. You can''t actually make the ship move the fireball,
    but you can send a message to the ship to tell the fireball you to move itself.


    There are two parts to this: The first is that you need to use the Broadcast block
    on the ship to send a message to all the other sprites. You want to do this when
    the spacebar (the Fire button in this game) is pressed, so you need to drag an
    If block to the Scripts Area of your ship, add a Diamond sensing block to check
    whether the spacebar is pressed, and finally, put the Broadcast block inside the
    ship''s rocket.


    The Broadcast block, which is one of the Control blocks, has a menu built into
    it. Click the menu and click New to create a new message. We''ve called this fire.


    This approach has a couple of advantages. First, you can keep all your game sprites
    on one sprite (the ship), which makes the program easier to manage. Second, it''s
    an efficient way to coordinate multiple sprites. We could, for example, make our
    alien look terrified when the Fire button is pressed, by just changing its costume,
    and that requires only two blocks: A Control block for the message'
  merge: -1
