- pgno: 224
  md: 'FIGURE 11-1:

    The Python shell, just after it opens.


    The bottom box is the Python shell, and the three arrows are called the prompt,
    and indicate that Python is ready for you to enter a command. You can test this
    by entering the license() command, which shows you a history of Python, before
    displaying the terms and conditions of using it. If you don''t want to get bogged
    down in legale, by typing q and then pressing Enter when prompted.


    You can increase the size of the shell to make it easier to read the output. Click
    and drag the bottom border of the editor box to adjust the amount of space dedicated
    to each of the two boxes. Use the button in the top right of the Thny title bar
    to maximize the window too. (See Chapter 4.)


    One of the most basic commands in any programming language is the one that tells
    the computer to put some text on the screen. In Python, this command is print(),
    and you can use it like this:


    ```

    >>> print("hello world")

    hello world

    >>>

    ```


    A simple program like this one that displays a greeting on the screen is often
    called a “hello world” program. It''s the starting point for learning most program-languages.'
