  md: '# Adapting the Program


    When the maze is built, the gold brick is left showing, so you could try to solve
    the maze to find the brick. You could also plant other objectives in the maze
    and time how long it takes the player to find them. The `mc.player.getTilePos()`
    checks where the player is in the Minecraft world and gives you a result in the
    form x, y, z.


    You could add an entrance and exit in a random position in the border of the maze
    so that the goal is to travel from one side to the other. You could make huge
    mazes more playable by adding landmarks. (Try using different wall materials or
    putting blocks on random walls.)After the maze has been generated, you could knock
    out random walls so that there are some shortcuts through the maze. Or maybe just
    replace them with glass blocks, to provide a tantalizing glimpse into another
    corridor. What about a multistory maze, with stairs between the levels? The possibilities
    are — aham! amazing.'
