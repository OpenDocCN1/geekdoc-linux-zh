- pgno: 69
  md: '# Configuring Bluetooth Devices


    The Raspberry Pi 3 and Pi Zero W are Bluetooth-enabled, so you can use a wireless
    Bluetooth keyboard and/or mouse with your Pi. You''ll need a wired USB mouse to
    install the operating system first, but when you''re in the PIXEL desktop, you
    can set up your Bluetooth devices.


    > > WARNING Not all wireless devices are Bluetooth-enabled: keyboards and mice
    that come with their own USB dongles typically don''t use Bluetooth.


    The process of getting two Bluetooth devices to work together is called pairing.
    Check the instructions for your device to see how it is discoverable so that your
    Raspberry Pi can pair with it. This isn''t always obvious: On Sean''s mouse, the
    process involved pushing and holding a button and pushing the two mouse buttons
    together and holding them until the mouse started flashing.


    Once you have your device discoverable, click the Bluetooth menu at the top of
    the screen (refer to Figure 3-14) and Add Device. Your Raspberry Pi will search
    for devices. When it finds your device, click it and click Pair. When using a
    keyboard, we had to enter a code on the screen on the new keyboard. With the mouse,
    we were asked to confirm that a code was showing on the mouse (which it couldn''t
    be, because the mouse has no display), and we confirmed that it was, to complete
    the setup.


    # Testing the Camera Module


    If you have a Raspberry Pi Camera Module, you can test whether it''s working correctly
    now.


    > > WARNING Make sure the camera is enabled: Go into the Raspberry Pi Configuration
    tool, click Interfaces, and select Enable beside the Camera option. For more information,
    see the "Configuring Your Raspberry Pi in Raspbian" section, earlier in this chapter.


    We''ll test the camera line command interface, which is covered in depth in Chapter
    5. Click the Terminal icon at the top of the screen to start. It has a > symbol
    on it. To take a photo, type in this command:


    ```

    raspistill -o testshot.jpg

    ```


    You should see what the camera sees for a moment before it takes the picture.
    You can verify that the image was created by looking at the files in your directory
    with this command:'
