  md: "# LISTING 17-1: (continued)\n\n```\nledR.ChangeDutyCycle(0)\nledG.ChangeDutyCycle(0)\n\
    ledB.ChangeDutyCycle(0)\n```\n\n```\nexcept KeyboardInterrupt:\n    pass\nledR.stop(0)\
    \ # stop the PWM\nledG.stop(0)\nledB.stop(0)\nio.cleanup() = Restore default GPIO\n\
    ```\n\nWhen you walk through this listing, you see that the first thing the code\
    \ does is set three GPIO pins to be outputs and then set them up to produce a\
    \ PWM signal. The value 60 in these opening lines of code is the frequency the\
    \ PWM signal goes at. Duty cycle goes from 0, which is all off the time, to 100,\
    \ which is all on the time. The main part of the program consists of nested loops,\
    \ which ensure that all combinations of red, green and blue are produced in duty\
    \ cycle steps of five. It takes 800 seconds — just under 13 minutes to do a complete\
    \ cycle with 8,000 colors. It might not look like many colors when you test your\
    \ LED output running this code, but they are all there. Just that many of them\
    \ this demonstration might look the same. This has to do with how people perceive\
    \ colors — they are much more sensitive to the difference between two colors than\
    \ the colors themselves.\n\n# The Way Forward\n\nThe problem with individual LEDs\
    \ used to be that they take up a lot of the Raspberry Pi’s resources, in terms\
    \ of GPIO pins — three per LED — and the software needed to generate the PWM cycles.\
    \ This problem has been solved in the last few years with the advent of LEDs that\
    \ contain their own PWM generators that you can control from the computer. You\
    \ only need to tell these sorts of LEDs once what color to produce and until to\
    \ stop. Even better, these LEDs can be chained: Each LED has its instructions\
    \ from the computer, it passes any further instructions to the next LED down the\
    \ line.\n\nThe major types of LED with these capabilities are the WS281b and the\
    \ APA102c. The Adafruit company brands these as NeoPixels and DotStar, respectively.\
    \ (They are known generically as addressable LEDs.) Note that the SK9822 LED is\
    \ identical to the APA102C.\n\n![](img/df9a01bf057d58c2401b5edabd6e8829_377_0.png)\n\
    \n362 PART 5 Exploring Electronics with the Raspberry Pi"
