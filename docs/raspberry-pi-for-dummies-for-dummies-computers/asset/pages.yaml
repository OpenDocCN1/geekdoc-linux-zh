    Planning a budget in LibreOffice Calc.


    We don''t have room to provide an in-depth guide to spreadsheets here, but we
    can show you how to work out a simple holiday budget.


    A spreadsheet is basically a grid of information, but it''s powerful because you
    can use it to perform calculations using that information. The boxes on the spreadsheet
    are called cells. To enter information into a cell, just click it and type what
    you want to enter. Alternatively, you can click a cell and type into (or edit
    the contents of) the Formula bar at the top of the screen. (Refer to Figure 6–3.)


    Each cell has a grid reference, taken from the letter at top of columns and the
    number on the left of its row. The top-left cell is A1, and the next cell to the
    right is B1, and the one below it is B2. (Refer to Figure 6–3.)


    To start with, enter a list of the different expenses you''ll incur, your way
    down the screen in column A. Beside each item, in column B, enter how it costs.
    In column C, enter how many of item you will need. For example, row of our example
    shows the name of the hotel in column A, how much costs per night (in column B
    on the same row), and then a C for the number of nights Sean will stay there on
    that row. In Figure 6–3, we can see''ve also written titles in the cells at the
    top of the columns of data so that we can easily see what is in each column.


