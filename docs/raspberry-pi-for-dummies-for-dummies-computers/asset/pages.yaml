- pgno: 31
  md: '# Determining What Else You Need


    The creators of Raspberry Pi have stripped costs to the able to own a fully featured
    computer for less than $35, so you''ll need to scavenge or buy a few bits and
    pieces in order to use your Pi. We say scavenge because the things you need are
    exactly the kind of things many people have lying around their house or garage
    or can easily pick up from friends or neighbors. In particular, if you''re using
    a Raspberry Pi as your second computer, you probably have most of the peripherals
    you need. Said, you might find they''re not fully compatible with the Raspberry
    Pi and you need to buy replacements to use with the Pi.


    Here''s a checklist of what you might need:


    +   **Monitor:** The Raspberry Pi has a high-definition video feed and uses an
    HDMI (high-definition multimedia interface) connection for it. If your monitor
    has an HDMI socket, you can connect the Raspberry Pi directly to it. If your monitor
    does not support HDMI, it probably has a DVI socket, and you can use a simple
    and cheap converter that enables you to connect an HDMI cable to it. Older VGA
    (video graphics array) monitors require a device to convert the HDMI signal into
    a VGA. If you''re thinking of buying a converter, check first whether it works
    with the Raspberry Pi. A lot of cheap cables,, what you need is a device that
    converts the signal from HDMI to VGA, not one that fits onto the screen or on
    Raspberry Pi. These converters can be expensive, so Gert van Loo has designed
    a device that uses the Raspberry Pi''s GPIO pins to connect to a VGA monitor.
    He''s published the design specs so anyone can build one, and sell it if he wants
    to. For more information, check www.raspberrypi.org/blog/berry-vga-adapter. If
    your monitor is connecting a blue plug and the connector has three rows of pins
    in it, it''s probably a VGA monitor.


    +   **TV:** You can connect your Raspberry Pi to a high-definition TV using the
    HDMI socket and should experience a crisp picture. If you have an old television
    in the garage, you can also plug it into service for your Raspberry Pi. The Pi
    can send a video signal, so it can use a TV as its. When we tried, this worked
    the text lacked definition, which made it difficult to read. If a TV is your only
    option, see Appendix A for on the settings to get the clearest possible picture.
    It''s better to use a computer monitor if you can, though. You''ll need to get
    a cable with the right connector to fit your Pi: The Model A and Model B have
    a dedicated RCA video socket, but later models use the headset socket for RCA
    video output, too.


    +   **USB hub:** The Raspberry Pi has one, two, or four USB ports (depending on
    the model you get). Consider using a powered USB hub, for two reasons.


    PART 1 Setting Up Your Raspberry Pi'
