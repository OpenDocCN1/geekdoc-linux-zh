- pgno: 427
  md: '# Audacity


    ![](img/df9a01bf057d58c2401b5edabd6e8829_427_0.png)


    FIGURE 18-6-

    Audacity.


    Whenever you making a recording, you need to "top and tail it"—that is to say,
    remove the silences at the start and end. In Audacity, using the Magnifying Glass
    icon to enlarge the waveform, and then drag over the opening silence to highlight
    it. Then you remove it by simply pressing the Delete key on the keyboard. Do the
    same for the end silence. With that out of the way, you then need to make sure
    that a sample begins and ends on the zero line, running through the middle of
    the displayed waveform. If it does not, you will hear clicks when you play it
    back. To ensure that it does begin and end on the zero line, highlight a small
    section at the start of the sample, and select Fade In from the Effects menu.
    Do the same for the end of the sample, but this time select Fade Out. Finally,
    select the whole sample and select Normalize from the Effects menu. With the top
    two options checked, select O. This last step ensures that all samples have the
    same overall sound level.


    To save your sample, you can choose `File:;` Export Audio from the main menu,
    and then choose Ogg Vorbis File from the drop-down menu in the lower right. Type
    in your filename with a `.ogg` extension and select Save. The .ogg format is Python’s
    native sound format and is best supported. Close the Audacity window and do not
    bother with the Save Changes options.


    So, after seeing how to make a sample, you need to know what samples to record.
    Make a folder called `farmSounds` in your working RFID folder, and inside that,
    make another one called `fixed`. You will store the skeleton of the song there.


    Table 18-1 shows the sound samples you need to make.


    412 PART 5 Exploring Electronics with the Raspberry Pi'
