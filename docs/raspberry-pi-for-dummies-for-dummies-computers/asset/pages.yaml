  md: '# Fixing the Final Bug


    In commercial software development projects, most of the time and money is spent
    testing programs to make sure they work as expected, and then fixing them when
    they don''t. Errors in programs are often called bugs, and even in the simple
    game in this chapter, we have a bug that would enable the player to create.


    If the fireball is moving up the screen and the player presses the Fire key, the
    firing sequence starts over. That means the fireball was traveling through the
    air displays, and a new one is sent up from the ship. That doesn''t make logical
    sense, and then players suffer no consequences if they misfire: they can just
    fire again and it''s as if the misfired shot never happened.


    You can use a variable to keep track of when the fireball is moving up the screen
    so that you can stop the ship from allowing a fireball to fire again at that time.
    Variables like this, which are used only to keep track of whether something is
    happening, are called flags. The firing flag needs to be able to say whether the
    fireball is in play or not, so it has two values. While the fireball is onscreen,
    the firing flag value is . When it isn''t, give the firing flag value of 0.


    Set up your firing flag on the fireball sprite. Start by clicking that in the
    Sprite List. Click the Variables button at the top of the Blocks Palette, and
    click the option to make a variable. Give it the name firingflag and make sure
    the button is selected so that it''s for all sprites. Until the box beside it
    in the Blocks Palette to hide it on the Stage.


    After you''ve created the variable, you can drag it in the Variables section of
    the Blocks Palette to at the start of the fireball''s firing sequence, and to
    at the end again. You should also update the fireball''s green script so that
    it resets the firing flag to at the start of a game, in case game ended while
    the fireball was onscreen. Figure 10-2 shows the final scripts for the fireball.


    You also need to modify the script for the ship so that it only fires if the firingflag
    variable is at the time the spacebar is pressed. This is a little bit complicated
    you will need to look tougher different of blocks to express this idea.


    Go back to the ship''s script. You need to modify the If that checks whether the
    spacebar is pressed. Figure 10-13, read from top to bottom, shows how to modify
    your If block. For simplicity''s sake, we''ve emptied the instructions inside
    the If block and separated it out from the rest of the script.


    CHAPTER 10 Programming an Arcade Game Using Scratch 201'
