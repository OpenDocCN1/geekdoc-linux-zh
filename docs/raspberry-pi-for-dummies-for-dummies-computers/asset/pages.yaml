- pgno: 356
  md: 'new throw. You might not think this is random, because the user could just
    make a long press or a short press that would influence the number''s produced.
    However, this doesn''t take into account that the timing of a press can be very
    accurate and all six numbers are cycled through thousands of times a second. Controlling
    a button press with microsecond accuracy is simply not possible for slow humans,
    but it’s a good source of random numbers. Therefore, in our project, the number
    is generated by counting 1 to 6 while a push button is held down.


    When a push button is first pushed, the contacts come together and bounce apart
    and then come together in a rapid sequence of contact make-and-break, rather like
    a ping-pong ball falling onto a table. This happens on all mechanical switches,
    but some designs are worse than others. A lot of the time in programming, this
    isn’t important because other stuff happens after a contact is first made. Other
    times, it could be a problem, but the solution can be quite simple—just delay
    for a few milliseconds after the first contact before looking at the input again.
    This strategy—known debouncing an input—is how we show you how to do in project.


    # The display


    Once you have generated a number, it must be displayed in the pattern of a conventional
    device. This involves turning on a specially selected pattern of LEDs. This pattern
    is, of course, for each number. Now, you could use a series of statements to test
    for each number, and when you find a match, write a series of statements to turn
    on and off the appropriate LEDs. An example of this for one number using the GPIO
    library would look like the code in Listing 16–7.


    LISTING 16–7 Fragment of Code to Set a Pattern


    ```

    # the variable dice_number contains the number to display

    if dice_number == 3: make the three pattern

    led0.off()

    led1.off()

    led2.off()

    led3.off()

    led4.off()

    led5.off()

    led6.off()

    if dice_number == 4: #if the number is four then

    led0.off()

    ...... and so on

    ```'
