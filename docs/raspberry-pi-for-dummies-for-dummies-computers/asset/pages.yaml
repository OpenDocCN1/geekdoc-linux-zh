  md: 'the amber traffic light flashes, and the sounder no longer bleeps. Then the
    Don''

    Cross light comes on, with the traffic light remaining amber, and finally,

    traffic light goes to green and all pedestrian lights go out.


    This sounds straightforward on the face of it, but the traffic sensor needs to
    be

    monitored through this sequence, to ensure that you don''t miss any traffic

    drive up and stop during the crossing sequence and allow the next crossing

    tcur too quickly. This means you can''t just use a simple sleep delay to

    control the sequence; what you need is a state machine — this is a way

    of jogging two or more processes while making it look like they''re happening
    at

    the same time.


    A state machine is an important technique — and that you''ll need over

    as as you take on more projects.


    The idea of a state machine is that most things do not need the processor''s full

    attention. The LED blink program, for spends virtually all of the

    sleep function, waiting for time to pass. Instead of turning that, the

    idea of a state machine is to spend it after other tasks. In order to do this,

    you have to have some idea of what your tasks need to incorporate

    a variable that specifies what each task needs to be looked at next. This is made

    possible by the time.point number (one with decimal places) method of the time
    library, which returns a floating-

    point number of the time (in seconds) that the Pi has

    itched on. The thing is that you don''t actually care what this number is,

    because you use out when to do the task.


    Let''s look at a simple example first — blinking two LEDs independently.


    First of all, go and wire up two LEDs and resistors, connecting them to GPIO

    23 and 24, as shown in Figure 16-13.


