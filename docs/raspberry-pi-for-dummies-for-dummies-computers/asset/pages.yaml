  md: 'a range of about 5 centimeters and can be mounted behind any nonconducting
    surface, such as an acrylic sheet.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_334_0.png)


    FIGURE 15-11:

    The Skywriter HAT.


    # # The Xtrinsic Sense board


    The Xtrinsic Sense board is a low-cost sensor board, in some ways similar to the
    Sensor HAT but without the LEDs. It is made in partnership with the component
    distributor and Raspberry Pi co-manufacturer Farnell. It contains a high-precision
    pressure sensor in the range 50 to 110kPa, a 3-axis, digital accelerometer, and
    a 3D magnetometer. As you see in Figure 15-12, it sits over less than half the
    Raspberry Pi and can be used, among other things, with robots and high-altitude
    balloons.


    # # Other boards


    There are many other boards available from small-start-up manufacturers as well
    as web-based projects for you to build. You can find a good starting point for
    information on many of these at http://elinux.org/RPi_Expansion_Boards.'
