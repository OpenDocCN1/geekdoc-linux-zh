  md: '# Taking It Further with Scratch


    In this chapter, we cover many fundamental concepts that are used in programming,
    including loops, operators, and variables. We''ve described how you can use Scratch
    to design your own games, where sprites interact with each other and respond to
    the player''s control. You can do lots of things to customize this game — draw
    your own sprites or change the speed of the aliens each time they''re shot or
    move. Your next real adventure is to use Scratch and the skills learned in this
    chapter, perhaps with some of the other blocks we haven''t had the space to cover,
    to make your own game.


    To find out more about Scratch, and to find games and animations that others have
    made, visit the website at http://scratch.mit.edu. You can also share your own
