- pgno: 222
  md: '# Chapter 11

    Writing Programs in Python


    In this chapter, we introduce you to Python, a powerful programming language that''s
    widely used commercially.


    One of the best ways to learn programming is to study other people''s programs,
    so in this chapter, we talk you through two different programs: One is a simple
    calculator for multiplication tables; the other is an artificial intelligence
    simulation that enables you to chat with your Raspberry Pi.


    You''ll probably find Python easiest to learn if you create the examples with
    us, but you can also download the finished programs from this book''s website.
    For more information on accessing the website, see the Introduction.


    In a book of this size, it''s not possible to cover everything you can do with
    Python, but this chapter gets you started with your first programs. As you work
    through these examples, you''ll learn some of the fundamental principles in Python
    and in programming generally, and you''ll gain an understanding of how Python
    programs are put together.


    +   IN THIS CHAPTER

    >> Using variables, strings, lists, and dictionaries

    >> Accepting user input and printing to the screen

    >> Using for and while loops

    >> Using conditional statements for decision-making

    >> Creating and using your own functions'
  merge: -1
