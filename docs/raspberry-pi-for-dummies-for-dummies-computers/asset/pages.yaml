  md: "RC522_GetSector: Reads a 16-byte sector block of data from a card and returns\
    \ it. You supply the sector number, the authorization key, and the sector number\
    \ you want to read. This is blocking code in that nothing else can happen until\
    \ a valid card is read.\n\nRC522_WriteSector: Writes a 16-byte block of data to\
    \ a sector. You supply the sector number, the authorization key, and the sector\
    \ number you want to write. This is blocking code in that nothing else can happen\
    \ until a valid card is presented. It will not, however, allow you to write directly\
    \ to key sectors.\n\nLet, let's see how this works in practice. Listing 18-1 shows\
    \ some code to read out the UID of a card.\n\n# LISTING 18-1 Reading the Card's\
    \ UID\n\n```\n#!/usr/bin/python3\n# Token reader by Mike Cook\n```\n\n```\nfrom\
    \ rc522rfid import rc522rfid\n\nrfidReader = rc522rfid()\n\nprint(\"Card token\
    \ reader\")\nprint(\"Press Ctrl-C to stop.\")\nwhile 1: # repeat forever\n   \
    \ cardNumber = rfidReader.RC522_GetCard())\n    print(hex(cardNumber))\n```\n\n\
    The UID, a 16-bit number, is printed out in hexadecimal format. (Printing in decimal\
    \ format doesn't make sense, because there will be a mixture of positive and negative\
    \ numbers, depending on the state of the most significant bit.) So you can now\
    \ look at the card's number, which is not so exciting, but if you could get that\
    \ card number to make something happen — like a sound file?\n\n# A simple RFID\
    \ jukebox\n\nWe can use the RFID cards to triggering music from the default Music\
    \ folder, or from anywhere else, if you like. For example, you can copy over some\
    \ music loops from the :/usr/share/scratch/Media/Sounds/Music Loops into the /home/pi/Music\
    \ folder or copy any MP3 files you may"
