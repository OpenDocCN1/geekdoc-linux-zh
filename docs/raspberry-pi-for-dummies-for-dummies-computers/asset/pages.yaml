  md: '# The Sense HAT


    The Sense HAT was specifically designed for the Astro-PI mission and two rugged
    versions were flown on the International Space Station from December 2015 running
    code by school children. It has an 8x8 RGB LED matrix, a 5-button joystick, and
    sensors to measure acceleration, magnetism, temperature, pressure, and humidity
    — as well as a gyroscope (See Figure 15-10.) The Sense HAT also has an extensive
    Python library associated with it, which allows for easy access to this board.
    You can find comprehensive coverage of how to use the Sense HAT on the Raspberry
    Pi Foundation''s website at https://www.raspberrypi.org/learning/getting-started-with-the-sense-hat/.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_333_0.png)


