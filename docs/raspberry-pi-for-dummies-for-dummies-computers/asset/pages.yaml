  md: '# Using the Image Viewer


    It''s easy to look at your digital photos and other images using PIXEL. Among
    the accessories on the Applications menu is the Image Viewer. You can start it
    from the menu (in the Accessories folder) or by double-clicking or right-clicking
    an image file.


    The Image Viewer displays the picture, with a toolbar underneath it, as you can
    see in Figure 4–11. From left to right, this is the buttons:


    +   **Previous:** Goes to the previous photo in the folder. Note that any unsaved
    changes (such as rotation) are lost. You can also use the left-arrow key on the
    keyboard.


    +   **Next:** Goes to the next photo in the folder. With the Previous button,
    clicking this discards any unchanged changes you''ve made to the current photo.
    You can also use the right-arrow key on the keyboard.


    +   **Start slide:** Begins a slide of all photos in the folder. The interval
    between photos is set at 5 seconds, but you can change it in the preferences.
    You can also press the W key to start a slide show. There might be a short delay
    before the slide begins.


    +   **Zoom Out:** Reduces the magnification of the image. The keyboard shortcut
    is the Minus (-) key.


    +   **Zoom In:** Increases the magnification of the image. Scroll bars appear
    if the image becomes too big to fit in the Image Viewer, and you can use these
    to see different parts of the picture. The keyboard shortcut is the plus (+),
    with no need to use Shift.


    +   **Go to Original Size:** Resets any zooming to its full original size. This
    might be bigger than the Image Viewer, in which scroll bars appear, enabling you
    to move around the image. The keyboard shortcut is G.


    +   **Full Screen:** Expands the image to fill the monitor, so you lose the Image
    Viewer controls. Right-click the image to open a menu with all the same options.
    To revert to using the Image Viewer in a window, choose Full Screen from the menu
    or press ESC. You can also use the F11 key to switch the screen on and off.'
  merge: -1
  img_proc: true
