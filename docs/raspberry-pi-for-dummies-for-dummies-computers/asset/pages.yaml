- pgno: 472
  md: '# # Troubleshooting Your Network Connection


    In the desktop environment, you can easily test whether your network is working
    by using the web browser. In the Linux shell, you can test whether it''s working
    with the `ping` command:


    ```

    ping -c 5 www.google.com

    ```


    This makes five attempts to connect with Google and reports on its success. You
    should see that five packets were transmitted and five were received if the network
    is working perfectly. If it fails, try another address to rule out the possibility
    that the problem is on Google''s end. Firewalls can sometimes interfere with the
    `ping` command, but this is rare. If the command works, it''s a guarantee that
    the Pi is connected to the Internet.


    You can query the network devices on your Raspberry Pi using `ifconfig`. This
    shows you the information for `eth0`(your Ethernet connection), `wlan0`(your Wi-Fi
    connection, if available), and the local lookup, which is how the Raspberry Pi
    refers to and which you can ignore. If there is an `addr` entry (this is not the
    same as the `inet6 addr` entry) for `eth0` or `wlan0`, it means your Raspberry
    Pi has connected to the router and been assigned an IP address successfully.


    The Ethernet connection should be automatically activated, but in the event it
    isn''t, you can manually activate it like this:


    ```

    sudo ifup eth0

    ```


    You can deactivate the Ethernet connection using


    ```

    sudo ifdown eth0

    ```


    Your Raspberry Pi should automatically connect to home routers using Dynamic Host
    Configuration Protocol (DHCP), but these tips can help you to identify where the
    problem lies if you experience difficulties.


    > If you experience network problems, try a new cable to rule out problems with
    the physical connection, and make sure your power supply is strong enough for
    the Raspberry Pi. (See Chapter 1 for more on power supplies.)


    See Chapter 3 for advice on configuring your Wi-Fi connection.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_472_0.png)'
  merge: -1
  img_proc: true
- pgno: 473
  md: '# Connecting Using SSH


    If your Raspberry Pi has a network connection, you should be able to access it
    with another computer on the same network using Secure Shell (also known as SSH),
    which is a way to make a secure connection between computers. This can help if
    you have set up your Pi to use headless (without a screen). Here''s how to set
    it up:


    +   1. Change your password.

    To prevent unauthorized access to your Raspberry Pi after a remote connection
    is enabled, start by changing your password. You can use the Raspberry Pi Configuration
    tool (see Chapter 3), or see Chapter 5 for instructions on changing the password
    in the command line.

    2. Enable SSH on your Pi.

    Use the Raspberry Pi Configuration tool (see Chapter 3) to enable SSH on the Interfaces
    tab. Alternatively, use this instruction to create an empty file in the boot directory
    called ssh and reboot your Pi:

    3. Get your Pi''s IP address.

    Use ifconfig in the command line to get your Raspberry Pi''s IP address (shown
    as inet addr.).

    4. Connect from your other device.

    On a Windows PC, for example, you''ll need to download an SSH client like Putty.
    In Putri, input the IP address of your Raspberry Pi and click the Open button.
    You can then use the command line on the Raspberry Pi to manage and fix files,
    viewing it through your PC screen and using your keyboard. Clients are also available
    for the iPhone/iPad and Android. The Mac does not need any additional software,
    but works through the terminal. You can find fuller instructions for SSH on your
    other machine at www.raspberrypi.org/documentation/remote-access/ssh.


    ```

    sudo touch /boot/ssh

    ```


    > You can only use SSH to access the Raspberry Pi command line, not the desktop.


