- pgno: 223
  md: 'You''ll be able to draw upon this knowledge when exploring the electronics
    programs in Part 5 of this book and when creating an arcade game with Pygame Zero
    in Chapter 12.


    Some lines of code are too wide for the page. We use a curving arrow at the end
    of a line of code to indicate that a line continues. When you see the curving
