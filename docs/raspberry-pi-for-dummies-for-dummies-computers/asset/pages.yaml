    # # Connecting the Raspberry Pi Camera Module


    There are lots of accessories and add-ons available for the Raspberry Pi, but
    the Raspberry Pi Camera Module has the rare status of being an official product
    from the Raspberry Pi Foundation, so we show you how to connect it. The camera
    module is a small circuit board, with a strip of ribbon cable that plugs directly
    into the Raspberry Pi board. (See Figure 3-7.) It''s easiest to connect the camera
    before you plug your Raspberry Pi into any cables.


    On the board of your Raspberry Pi is a connector for the camera. You can see it
    labeled in Figures 3-1, Figure 3-2, and 3-3. (Remember that the Pi Zero does not
    have a camera connector).


    As you can see in Figure 3-7, the lens has a plastic film over it, to protect
    it. Pull the green plastic tab to remove the film.


    At the end of this chapter, we show you how you can check to ensure that your
    camera is connected correctly and working.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/df9a01bf057d58c2401b5edabd6e8829_55_0.png)


    ### FIGURE 3-7:

    The Raspberry Pi Camera Module.


    # # Connecting the camera on a Pi Zero W


    The Pi Zero W camera socket uses a different width of cable to the main Raspberry
    Pi boards. You can buy the cable separately, or get it with the official Pi Zero
    case.


    The camera and the Pi board have similar sockets for the camera. You press the
    connector with your thumb and finger and gently pull to open the connector. The
    parts don''t separate, but there''s enough of a gap to remove and insert the cable.
    On the Raspberry Pi, the camera connector is on the right of the board. (Refer
    to Figure 3-3)


    On the camera, insert the cable with the shiny contacts facing the camera front,
    and press the socket closed again. On the Raspberry Pi Zero W, insert the camera
    with the shiny contacts facing the bottom of the board (flat side). When the cable
    is flat, the camera will be facing down, but you can bend the cable so that the
    camera sits on top of the board and faces up. One of the covers for the official
    Pi Zero case has a hole in for the camera lenses.


    # # Connecting the camera on other Raspberry Pi models


    To open the camera connector on your Raspberry Pi board, hold the ends between
    your finger and thumb and gently lift. The plastic parts don''t separate, but
    they move apart to make a gap. This is where you insert the camera''s cable.'
  merge: -1
  img_proc: true
