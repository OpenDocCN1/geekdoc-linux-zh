    projects. This can be downloaded from the book''s website. (See the Introduction
    for more on how to access the site.) We have not printed it because it''s long,
    and you won''t get much from reading it. It also automatically blocks you from
    trying to write to key sectors.


    Talking to the reader over the SPI interface is somewhat complex, and not really
    necessary to understand in order to use an RFID reader in a system. It involves
    mainly putting numbers into chip registers or memory locations in the correct
    sequence, as laid out in the chip''s data sheet. However, we have added five methods
    at the end of the class for you to be able to easily tap and communicate with
    the reader. The methods you need to know about in this list:


    +   **RC5222WaitForCardRemoved**: Ensures the code pauses until a card has been
    removed from the reader – reading of a card can be quick. This is complicated
    by the fact that with a card held permanently on a reader, every other call to
    detect it. A `function function()` returns falsely, saying that there is no card
    on the reader. This is a function of how the chip works, and to work around it,
    this method waits until two successive attempts at reading a card both return
    no card present. (Note that this is known as blocking code in that, once it''s
    called, nothing else can happen until the card is removed).


    +   **RC522_ReadCard**: Reads and returns the UID number of the card at the reader.
    If there''s no card or there''s a reading error, this method returns a value of
    -1.


    +   **RC522_GetCard**: Waits until there is no card on the reader and waits again
    until a card is presented, and then it returns the card''s UID number. This blocking
    code in that nothing else can happen until a valid card is read.'
