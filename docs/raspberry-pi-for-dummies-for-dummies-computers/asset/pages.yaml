- pgno: 131
  md: '# Running software


    Some programs can be run directly from the command line by just typing names,
    such as


    ```

    penguinspuzzle

    ```


    which runs the Penguins game. (See Chapter 19.) This game doesn''t show up on
    the menus in the desktop environment.


    Most-end user applications require the X server, which means you need to be in
    the desktop environment to run them. After installing them, you can find them
    on the Applications menu.


    Whether a program should be run from the command line or in the desktop environment
    depends on the program, so consult its instructions if you can''t work how to
    start it.


    # Upgrading the software


    The package manager''s responsibility doesn''t end once it has installed software.
    It can also be used to keep software up to date, installing the latest enhancements
    and security improvements. You can issue a single command to update all the software
    on your Raspberry Pi:


    ```

    sudo apt-get update

    ```


    Update the cache to sure apt installs the latest updates to your installed packages.
    You can combine both commands into a single line, like:


    ```

    sudo apt-get update && sudo apt-get upgrade

    ```


    The && means that the second command should be carried out only if the first succeeds.
    If the update to the cache doesn''t work, it won''t attempt to upgrade all the
    software.


    The upgrading process often ties up your Raspberry Pi for some time.


    If you want to update just one application, you do that by issuing its install
    command again. Imagine that you''ve already installed Ace of Penguins and you
    enter


    ```

    sudo apt-get install ace-of-penguins

    ```'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'That prompts apt to check for any updates to that package and install them.
    If there are none, it tells you that you''re already running the latest version.


    # Removing software and freeing up space


    The package manager can also be used to remove software from your Raspberry Pi.
    For example:


    ```

    sudo apt-get remove ace-of-penguins

    ```


    This particular command leaves traces of the applications, which might include
    user files and any files containing settings. If you''re sure you won''t need
    any of this information, you can completely remove and clean up an application
    using


    ```

    sudo apt-get purge ace-of-penguins

    ```


    You can do two other things to free up some space on your SD or MicroSD card and
    clean up your system. First, you can automatically remove packages that are no
    longer required. When a package is installed, other packages it requires are usually
    installed alongside it. These packages can remain after the original program has
    been removed, so there''s a command to automatically remove packages that are
    no longer required. It is


    ```

    sudo apt-get autoremove

    ```


    It lists the packages that will be removed and tells you how much space it will
    free before prompting you to enter A to confirm that you want to continue.


    When you install a package, the first step is to download its installation file
    to your Raspberry Pi. After the package has been installed, its installation remains
    in the directory /var/cache/apt/archives. Over time, as you try out and more packages,
    this can amount to a lot of space on your SD or MicroSD card. Take a look in that
    directory to see what''s built up there. These files aren''t doing much. If you
    reinstall a program, you can always download the installation file.


    The second thing you can do to clean up your SD card is remove these files using


    ```

    sudo apt-get clean

    ```'
  merge: -1
  img_proc: true
