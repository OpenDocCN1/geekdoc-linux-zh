- pgno: 86
  md: '# Creating new folders and blank files


    Organizing your files in folders makes it easier to manage them. You can more
    easily see what files you have, go straight to a file when you need it, and back
    up a group of files by copying the folder to an external storage device.


    It''s easy to make a new folder. First go to the location where you need the folder
    to be stored. Typically, it''s in pi folder or one of its subfolders, such as
    your Desktop. Right-click a blank space in the right pane of File Manager and
    hover the mouse cursor over the words Create New. Click Folder on the menu that
    appears and you''ll be prompted to enter a name and click OK to confirm. If you
    change your mind, click Cancel indent.


    You can also click the File Menu at the top left of File Manager, Create New,
    and then click Folder.


    Both options also enable you to create an empty file. If you want to practice
    creating folders and moving files around, you can create a few files so that you
    can do this safely, without worrying about anything you didn''t intend.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_86_0.png)


    # Deleting files and folders


    To delete a file or folder, right-click it in File Manager and choose Move to
    Wastebasket from the menu that appears. As you see when copying files, you can
    hold down the Ctrl key when you click to select several files or folders at the
    same time, and you can click the background of the File Manager window and drag
    the mouse to lasso files you want to delete, too. You can also send files to the
    wastebasket by selecting them and then pressing the Delete key on the keyboard
    (usually marked Del or Delete, and not to be confused with the Backspace key).


    The wastebasket is used as a temporary place to put any files or folders to remove.
    You can find it on the desktop (refer Figure 4-1), and double-click the Bin icon
    to see what''s inside. You can empty the wastebasket, and delete any files or
    folders in it, by right-clicking it and choosing Empty Wastebasket.


    If you put something in the wastebasket that you want change your mind, right-click
    its icon in the wastebasket and choose to restore it to where it was before. (This
    is especially useful if you''ve forgotten where it used to be!) You can also cut
    or copy it so that you can paste it wherever you want.'
