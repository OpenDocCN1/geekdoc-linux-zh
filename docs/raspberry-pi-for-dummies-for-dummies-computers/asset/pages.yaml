    +   7. Click OK.


    If prompted, confirm that you''d like to refresh items in this path.


    > Content that Kodi doesn''t recognize, such as your home movies, won''t be added
    to the library, but you can still see them in the folder you added using the browser.
    By clicking Movies on the left, clicking .. twice, choosing Files, and then selecting
    the folder that contains your added media. From there, you can open the folders
    and select the movie files to play them.


    You can add TV shows or music videos using a similar process — just change the
    media type to TV Shows or Music Videos in Step 5.


    # Adding pictures


    To add, you follow a similar process to adding music and movies. Start by clicking
    Pictures from the main menu on the left, and then choose Add Pictures from the
    menu that appears. You can then add a folder of photos.


    To view the folder, hover over Pictures on the main menu on the left and then
    select the folder name. You can use the left- and right-arrow keys to navigate
    your photos and hover over options in the bottom left to open a menu that enables
    you to display a slideshow.


    If you''re in a folder and want to view a different folder or add more movies,
    click .. at the start of the photo folder.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Streaming media


    Streaming *media* means that the content flows into your Raspberry Pi over the
    Internet as you watch it or listen to it. As a result, streaming services only
    work when you have a good Internet connection.


    To enable streaming, you use add-ons, which are third-party applications that
    access sources of content online. Music add-ons, for example, enable you to listen
    to Internet radio stations and access some online services. Video add-ons can
    give you access to online TV stations. The availability of add-ons varies over
    time as new services launch and older services disappear. Music and video add-ons
    can be particularly short-lived and unreliable broadcasters are often seen to
    keep viewers using their own software and gateways.


    To install an add-on, hover over Add-ons on the main menu on the left, and then
    choose Install from Repository from the menu at the top of the screen. From the
    new menu that appears, choose Kodi Add-On Repository to find add-ons from the
    official Kodi repository, which offers a range of add-ons that have undergone
    basic testing.


    As well as music and video add-ons, there are options for a weather forecast provider,
    screensavers (in the Look and Feel category), and picture add-ons. Note that if
    you add a screensaver, you''ll also need to enable it in the Interface settings.


    # Playing Music


    To started with playing music, hover over Music on the main menu to show your
    music collection in the main part of the screen. You can use the Categories menu
    at the top to browse by genre, artist, album, or song, among others. You can also
    choose Files from the Categories menu to go to the folders you have added. In
    the main part of the screen are options for recently played or added albums, and
    random artists and albums too. Click a song to play it.


    When music is playing, click the Options button in the bottom left to open a menu
    with options to pause, stop, or skip the track. From this menu or from of the
    main menu, click the icon showing four arrows, like a compass, to view the full
    screen, where there are additional options for repeating or random song order.
    Note that there is a screensaver, so the screen disappears after a moment or two.
    Press Escape to go back to the menu. You can tap the spacebar to pause or un the
    audio.'
