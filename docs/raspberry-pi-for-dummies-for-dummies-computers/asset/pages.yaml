    # Using the Forever Control block


    Computers are great at repetitive tasks, and a game program often requires the

    computer to do the same things over and again until the game is finished.


    Repeated bits of program like this are loops.


    You can use two Control blocks to make the computer repeat a set of blocks.

    The Repeat block enables you to specify how many times you want a block or set

    of blocks to be run. The Forever block runs a block or set of blocks repeatedly

    the program is stopped.


    Both blocks are shaped like a bracket, so they can enclose the blocks you want
    to

    repeat inside them. The Forever block doesn''t have a notch on the bottom

    it doesn''t make sense to any other blocks after it: They would never be run,

    because forever never comes to an end.


    For the ship in this game, you need to continue checking for key presses

    until the game is finished. Without the Forever loop, the script would check

    for a key press and then finish.


    You can find the Forever block by clicking the Control button at the top of the

    Blocks Palette to reveal all the Control blocks, and then looking down the list.
    Drag

    it it into the script for your ship at the end of your green flag. The first time

    y use it, we recommend you test how it works by dragging a Motion block into

    its bracket. Figure 10–5 shows a script that makes the ship sprite rotate for
    as long

    the program runs. You''ve already built some of this script, so just add the new

    blocks at the end. Click the green flag to start it, but don''t forget to that
    rota-

    tion block out when you''ve finished testing.'
