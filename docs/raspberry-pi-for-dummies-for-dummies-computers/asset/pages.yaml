  md: '![](img/df9a01bf057d58c2401b5edabd6e8829_327_0.png)


    The second way of wiring (refer to Figure 15-8) is known as current sinking. When
    the GPIO pin is set by the program to produce a low voltage, the current flows
    through the LED, through the resistor, and to ground, the GPIO pin. To turn off
    the LED, set the output to a high voltage. There''s no way current can flow round
    the circuit, because both ends of the load (LED and resistor) are connected to
    3V — so there is no voltage difference to push the current through the components.


    Note in both circuits that the position of the resistor and LED can be interchangeable
    — it makes no difference. You might like to think of these two approaches as switching
    the plus and switching the ground.


    Now an LED is a non-linear device in a similar way to the filament of a flashlight
    bulb, but in the case of an LED we need a resistor to limit the current to a value;
    it important thing to know is the LED''s voltage drop — the voltage that will
    appear across when the LED is on. This changes with different colours of LED,
    so to get the same current through LEDs of different colours, you need different
    resistors.


    Getting the same brightness is not the same as getting the same current, because
    different LEDs have different current–to–light efficiencies. Modern LEDs are a
    lot more efficient than they are used to, so you need less current.


    With a red LED, there is about a 2V2 voltage drop across it. This leaves the remaining
    voltage from the GPIO pin (3.3–2.2 = 1.1V) to be dropped across the resistor.
    With a 330R resistor, Ohm''s law tells you the current will be −1.1 / 330 = 3.3mA,
    which is plenty bright to see.


