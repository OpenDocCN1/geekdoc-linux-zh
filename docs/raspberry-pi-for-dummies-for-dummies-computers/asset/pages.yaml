    # Chapter 6


    # Being Productive with the Raspberry Pi


    There comes a time in most people''s lives when they have to get down to work,
    and when it''s your turn to get down to work, the Raspberry Pi can help. Whether
    you need to do your homework or work from home, you can use LibreOffice, a fully
    featured office suite that''s compatible with the Raspberry Pi.


    If you haven''t heard of LibreOffice, you might have heard of its ancestor, OpenOffice.
    A team of developers took it as a starting point and developed LibreOffice using
    its source code.


    LibreOffice and Microsoft Office for Windows have lots of similarities between
    them, so LibreOffice will probably feel familiar to you. You can copy files between
    the two programs too, although you might lose some of the layout features when
    you do.


    In this chapter, we show you how to use four of the programs in LibreOffice for
    common household activities. You''ll learn how to write a letter, use a spreadsheet
    to plan a budget, create a presentation, and design a simple party invitation.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'LibreOffice is free to download and distribute. If you''re feeling generous,
    the charitable foundation that drives its development, The Document Foundation,
    invites donations through its website at www.libreoffice.org.


    # # Installing LibreOffice on Your Raspberry Pi


    LibreOffice is included in Raspian, so you should find that you already have it
    on your Raspberry Pi. If you need to update it or you don''t have it on your Raspberry
    Pi for some reason, you can install it by issuing the following two commands in
    the Linux shell:


    ```

    sudo apt-get update

    sudo apt-get install libreoffice

    ```


    For further guidance on installing software, and an explanation of how commands
    work, see Chapter 5.


    # # Working with LibreOffice

    on the Raspberry Pi


    When you enter the desktop environment (see Chapter 4), you should find Libre-Office
    on the Applications menu, in the Office category, as shown in Figure 6-1. The
    menu has separate entries for LibreOffice Base (databases), LibreOffice Calc (spreadsheets),
    LibreOffice Draw (page layouts and drawings), LibreOffice Impress (presentations),
    and LibreOffice Writer (word processing).


    > You can start a new LibreOffice file of any type from the File menu in one of
    the applications, irrespective of which application you''re using. For example,
    you can create a new spreadsheet from the word processor''s File menu. When you
    do, the correct application opens (Calc, in this case) with a blank file to use.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_143_0.png)


    In this chapter, we show you how to get started with Writer, Calc, Impress, and
    Draw.


    You can also start LibreOffice and open a file in it by double-clicking a LibreOffice
    or Microsoft Office file in the desktop environment.


    ![](img/df9a01bf057d58c2401b5edabd6e8829_143_1.png)'
