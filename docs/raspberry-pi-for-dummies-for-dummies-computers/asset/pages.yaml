    # # Xinvaders 3D


    If you''re a fan of classic arcade cabinets from the 1970s and 1980s, you''ll
    have a blast with Xinvaders 3D. The game uses line graphics (like the classic
    game Asteroids) to put a fresh spin on Space Invaders. The 3D rendering makes
    the aliens move progressively closer to you, and you move in four directions to
    line up your shots. It''s good, clean, retro fun. Move using the cursor keys,
    and fire by pressing the spacebar.


    To install Xinvaders 3D, search for *xinvaders* on the Add/Remove Software menu
    or, in the shell,


    ```

    sudo apt-get install xinv3d

    ```


    To run Xinvaders 3D, click the icon on the taskbar to go into the Terminal and
    then enter **xinv3d**.


    # # Fraqtive


    Fractals are patterns generated using mathematical formulae that are self-similar.
    That means if you zoom in on the Mandelbrot set (shown on the left in Figure 19–3),
    for example, you''ll find that the same shape repeats in its nooks and crannies,
    and you can zoom in again and again and again. Fraqtive is a program for exploring
    fractals and generating images. You can save the images and use them as wallpaper
    on your Raspberry Pi. (See Chapter 4.) you started.


    To install Fraqtive, search for *fraqtive* on the Add/Remove Software menu or,
    in the shell,


    ```

    sudo apt-get install fraqtive

    ```


    After installation, you can find Fraqtive in the Education category of your Applications.
    For more information on Fraqtive, visit the creator''s website at http://fraqtive.mimec.org/.'
  merge: -1
  img_proc: true
- pgno: 447
  md: '# Tux Paint


    Tux Paint, shown in Figure 19-4, is a simple drawing program for children, with
    tools that help them to quickly create art on the Raspberry Pi. As well as enabling
    freehand drawing and the placement of shapes and lines in common with most art
    packages, Tux Paint has a Magic tool. This can be used to create effects such
    as brick walls, flowers, snowballs, rainbows, waves, and creative image distortions.
    The Stamp tool is used to stamp art onto the screen, including animals, penguins,
    hats, food, and musical instruments.


    Tux Paint is named in tribute to Tux, the penguin who is the official mascot of
    the Linux kernel. The application has been created with the help of more than
    300 contributors worldwide and has been downloaded tens of millions of times.


    To install Tux Paint, search for tuxpaint on the Add/Remove Software menu or,
    in the shell,


    ```

    sudo apt-get install tuxpaint

    ```


    ![](img/df9a01bf057d58c2401b5edabd6e8829_447_0.png)


    432 PART 6 The Part of Tens'
