- pgno: 195
  md: '# Using the Wait block to slow down your sprite


    As you put your script together, you might find that some movements happen fast
    that you can hardly see what''s going on.


    If you click the Control button at the top of the Blocks Palette, you can find
    a set of yellow blocks that are used to govern when particular things happen.
    You can read more about these in Chapter 10, but for now it''s worth knowing that
    a block enables you to wait for a certain number of seconds. Drag this into your
    script where necessary to introduce a delay so that you can see each of your blocks
    in action. The length of the delay is 1 second by default, but you can change
    it to whatever you want, including parts of a second (for example, 0.5 for half
    a second).


    ![](img/df9a01bf057d58c2401b5edabd6e8829_195_0.png)


    The Say Hello! for 2 Sec block can also be used to force the script to pause before
    running any blocks.


    # Saving your work


    Remember to save your work so that you can come back to it. You can find the option
    to save on the File menu, at the top of the screen, or you can click the Floppy
    Disk icon in the top left in the original Scratch.


    In the original Scratch, when the Save Project dialog opens (see Figure 9-13),
    you see buttons on the left to choose from places you could save your file, although
    you might not have permission to use all of them. (See Chapter 5 for more permissions.)
    We recommend you use the Scratch folder inside your pi directory. On the right,
    you can add your name and project notes to remind you later what the project was.
    You can see and edit the project notes associated with a file by using the File
    menu when you''re working on a program.


    When you save in Scratch 2, you see a file browser that enables you to choose
    where to save. Again, we recommend saving in your Scratch folder inside your pi
    directory.'
