    # # Positioning and resizing your sprite


    You can drag and drop your sprite (the cat) around the Stage to position it where
    you would like it to be at the start of your program.


    You can also resize the sprite. Two buttons above the Stage (refer to Figures
    9-1 and 9-2) are used to enlarge or shrink a sprite. Click one of them, and the
    mouse pointer changes to arrows pointing outward (for enlarging) or inward (for
    shrinking). Click your sprite on the Stage repeatedly to change its size.'
