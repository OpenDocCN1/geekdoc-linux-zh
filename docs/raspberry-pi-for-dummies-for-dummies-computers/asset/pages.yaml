- pgno: 405
  md: '# How RFID Work


    There are basically three different types of RFID systems available on the market,
    mainly distinguished by which frequency range they use. All systems consist of
    two parts: a tag or a card and a reader. The reader extracts binary bits from
    a tag or card using radio waves, so no wires are needed between the reader and
    the tag or card. These tags normally known as passive tags — tags that require
    no source of power — although a number active tags that require fitting with a
    small battery. These active tags are used when you need a much longer read range.


    The reader sends out a radio signal, and the tag picks it up and uses the power
    in that radio signal to activate a microchip. Microchip sends back a number of
    pulses to the reader, which is interpreted as a number. The way the tag sends
    the data back is different on different types of tag, but the main way is transmitting
    the data back to the reader on a different frequency.


    Here''s a list of active tags, with their frequency ranges:


    +   125-13 kHz tags: These are the ones used in chipping pets and also in a lot
    of access control systems. They have a limited storage capacity and are normally
    restricted to holding a small number of 64 or 128 bits. The tags and cards used
    most widely today conform to the EM4100 / EM4200 standard. Most of the tags are
    read-only, but a few (The Hitag tag, for example) allow you to store data using
    a special programmer.


    +   13.56 MHz tags: These are the so-called smart cards, capable of storing not
    a serial number but also data that can be read or written. There is a measure
    of security built into the cards so that the data is inaccessible to those who
    do not know the encryption key. There are many different types of cards, and by
    far the most common is the one known as MIFARE classic card.


    +   UHF (860-960MHz): Unlike the other two RFID types, UHF readers are capable
    of reading more than one tag at the same time. They are also quite long-range,
    typically 10 to 30 feet. They''re designed for bulk inventory taking. Each item
    on a palette be recorded and counted at the same time. The readers have a very
    high-power transmitter in them, so much so that they''re a hazard, requiring strict
    time limits for workers operating them in order to avoid long-term radiation exposure.
    There are other, higher-frequency systems in this class as well.


    We use the MIFARE classic card in the projects in this chapter — to give it Sunday
    name, the ISO/IEC 14443 A/MIFARE mode protocol. The readers are cheap, and the
    tags come in various shapes ranging from key fobs to cards. The cards


