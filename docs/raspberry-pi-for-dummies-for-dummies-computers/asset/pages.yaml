    icon changes, and you can click and drag it inwards or outwards to reshape the
    window. You can also click and drag a corner to change the window''s height and
    width at the same time. To arrange the windows by side, you can move them around
    by clicking and dragging the title bars at the top of them.


    # # Using the Task Manager


    If your Raspberry Pi doesn''t seem to respond, it might be very busy. At the top
    right of the taskbar is the CPU Usage Monitor, which tells you how heavily the
    Raspberry Pi''s processor is being used. It''s a bar chart that scrolls right'
