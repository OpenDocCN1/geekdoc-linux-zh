  md: "Exercise 46: Alabama Cement\n\n+   - F4—Toggle through languages\n\n+   - F5—Choose\
    \ a debugging output level\n\n+   - F6—Include a driver update CD in the installation\n\
    \nTo perform a normal installation, choose select Installation from the menu,\
    \ and press Enter. You must then walk through the interfaces presented in YaST2,\
    \ the installation and system administration program. Although there can be deviations,\
    \ based on your exact configuration, the following are the major scenes—in order—that\
    \ you must walk through:\n\n+   1. Choose a language—to cancel Accept to move\
    \ on or Abort to cancel the installation.\n\n+   2. Choose the installation mode—You\
    \ can choose to perform a new installation (the default), update an existing system,\
    \ repair an installed system, boot an installed system, or abort. For a normal\
    \ installation, choose New Installation.\n\n+   3. At this point, the system will\
    \ probe for devices and show you a list of what it has identified. It will identify\
    \ the system, keyboard, mouse, and so on, as well as show you the recommended\
    \ installation settings based on the chosen mode. Recommendations and settings\
    \ fall within these categories: \n\n+   - System\n- Mode\n- Keyboard layout\n\
    - Mouse\n- Partitioning\n\n+   - Software\n- Booting\n- Time zone\n- Language\n\
    - Default runlevel\n\n+   4. Three command buttons are: Change—to alter any of\
    \ the settings, Abort—to cancel, and Accept—to continue on. Choose Accept; then\
    \ click Continue, and a warning message appears stating that YaST2 has obtained\
    \ all the information required to install SUSE LINUX. The installation will be\
    \ carried out to the settings made in the previous dialogues. To commit the installation\
    \ and choices made, click the Yes, Install button.\n\n+   5. The hard disk is\
    \ prepared/partitioned. This will take a few minutes, and you might need to make\
    \ other changes later if you are implementing RAID or LVM devices. At a minimum,\
    \ two partitions are created: root and swap."
  merge: -1
  pgno: 156
- img_proc: true
  md: '# CHAPTER 4: Solutions to Exercises


    6. Packages are installed next, and you will need to insert various CDs as prompted.
    Your goal is usually to complete the installation as quickly as possible, so you
    can always go back and add any packages at a later point in time.


    7. You are prompted to give a password for the root user (and enter it twice for
    verification). The password can consist of digits, spaces, letters, and the standard
    punctuation characters. It is recommended that it contain at least five characters—and
    at a minimum—the case is mixed between upper and lower. If you enter more than
    eight characters, you will be prompted to truncate or change it.


    8. Network configuration occurs next, and a scan is automatically done to detect
    network cards, DSL connections, ISDN adapters, and modems. a summary screen shows
    you the values found, as well as the current settings for Proxy (default is disabled)
    and VNC Remote Administration (default is disabled). You can change any of these
    values, go back, abort, or put the network settings shown to you into effect by
    clicking Next.


    9. After the network configuration is written/saved, the Internet connection is
    tested. This operation is purely optional, and you can choose to skip the test
    if you like. A successful test, however, gives you the option to run YaST Online
    Update (YOU) and check for the latest release notes and updates. If updates are
    available, you can choose to download and install them, or skip the update (which
    can be done at any later time from within YaST2).


    10. Service configuration comes next, allowing you to configure such items as
    Certificate Management and OpenLDAP Server.


    11. The user authentication method must be chosen. Three choices are available:


    +   - NIS—To use if you are using an NIS server

    - LDAP—To use if you are using an LDAP server for user data

    - Local (/etc/passwd)—The choice to select if you are storing passwords in /etc/passwd
    and /etc/shadow


    Accept the default user authentication method (LDAP).


    12. You can add new local users at this point. The same password rules for creating
    the root user apply to creating passwords for the local users as well.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Exercise 46: Alabama Cement


    # NOTE


    Not only can you add a new user at this point, but also you should. It is good
    practice to only use root when necessary, so you should have at least one other
    user account to log in as by default. I suggest that an "admin" user be created
    at this point.


    +   13. SuSEconfig now starts and writes the system configuration. The amount
    of time this takes will vary greatly from system to system based on the parameters
    you''ve entered.


    +   14. Release notes are displayed covering the following areas:

    * General—Information that everybody should read

    * Update—Covers changes not appearing in the Admin Guide

    * Installation—More information about the installation

    * Updates and Features—Covers technical changes and enhancements

    * Providing Feedback—Tells how to contact SUSE, and so on


    15. Hardware configuration of the graphics card, printers, and sound cards follows,
    and then the installation is complete. You must click the command button labeled
    Finish, and then you can log in to the system. (It is a good idea to do so as
    the admin user added during step 12.)


    Upon successful completion of these steps, a login screen will appear prompting
    for a username and password. After you give those entries, a Welcome menu thanks
    you for installing SUSE LINUX Enterprise Server 9 and provides a list of URLs
    relating to this and other Novell products.


    If there are problems with the installation, you should trace down the first occurrence
    in which trouble appeared and look for a solution to it before continuing on.
    The best tool to use for any problem within this category is common sense.


    For example, if the system will not read the media, verify that the CD set you
    have is good by checking to see if another system can read it. If the installation
    hangs, verify that your system meets the minimum system requirements and that
    power saving features are not affecting your ability to do the installation.


    Remember that the first menu to appear offers a plethora of choices besides Installation.
    Choosing one of the other choices can help you continue on with the installation
    and repair any system files.'
  merge: -1
