  md: '# Solutions to Exercises


    The following solutions walk through each exercise in a step-by-step manner. It
    is important to know that there is often more than one way to arrive at the same
    result, and the solution presented here might be but one of many.


    # Exercise 1: Armstrong’s Auto Body


    Novell Linux Desktop is presently available in both the DVD and CD formats, and
    there is no difference between the formats with the exception of not needing to
    switch media with DVD. This discussion walks through the use of the CD media.
    To begin the installation, insert the first CD into the drive and boot the workstation.
    A Welcome screen will quickly appear followed by a screen offering a boot options
    menu. If the boot options menu does not appear, reconfigure the BIOS on the workstation
    to make the drive bootable.


    The welcome menu offers the following choices:


    +   * Boot from Hard disk—This choice is the default, and the one to use if you
    accidentally arrive at this menu and truly not to make any changes.

    * Installation—The choice to use to begin the installation routine.

    * Installation—ACPI Disabled—This option sets acpi=off and is used only if you
    are having trouble with power savings interfering with the installation routine.

    * Installation—Safe Settings—Among other things, this sets acm=off, acpi=off,
    and barrier=off and is used when you are a great deal of trouble getting an installation'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# CHAPTER 4: Solutions to Exercises


    take. These settings disable certain advanced features such as power management
    and advanced hard drive settings during the installation process. Use this choice
    as a last ditch for a successful installation, and use it only after you have
    exhausted the previous two options.


    +   - Manual Installation—This lets you walk through only the aspects of the installation
    you want to tweak.


    +   - Rescue System—This recovers a system with corrupted boot files.


    +   - Memory Test—This does not do any installation, but simply checks the memory.


    To begin a standard install, choose Installation. The License Agreement appears
    next. Scroll through the choices, and you can either click on the command button
    labeled I Agree or Do Not Agree. If you choose the latter, the installation will
    not continue. After agreeing to the License Agreement, YaST identifies itself
    as “The Installation and System Administration Program,” and you must select your
    language. Your hardware is then analyzed, and you are given radio buttons allowing
    you to either GNOME or KDE for the default desktop. Neither is preselected, so
    choose KDE.


    A summary of the installation settings you have chosen appears next. As soon as
    you click Accept, a warning appears telling you that YaST2 has all the information
    needed and can now start the installation. Once you click to start the actual
    installation, the hard disks are being prepared. Following that, you can watch
    the status of the installation for each of the CDs through progress bars. At the
    end of this phase, basic installation finishes with the following automatic steps:


    # NOTE


    Before selecting Accept, you should change the partition proposal to leave unpartitioned
    space. Without this, you will run into difficulties adding space to the swap partition
    in exercise 14. The basic steps for this are


    +   - From the Installation Settings page, select Partitioning.


    +   - On the next page, select Custom partition setup.


    +   - Select Custom partitioning—for experts.


    +   - Highlight the entry in the partition table for the Linux native partition;
    then select Delete > Yes.


    +   - Highlight the entry in the partition table for the storage device (/dev/sda
    or /dev/sda); then select Create.


    +   - Select Primary Partition; then select OK.'
  merge: -1
  pgno: 103
