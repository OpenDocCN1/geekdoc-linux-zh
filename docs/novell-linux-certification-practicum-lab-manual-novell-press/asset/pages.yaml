    # Exercise 46: Alabama Cement


    To begin an installation of SLES 9, insert the first CD into the computer and
    reboot the system. On most computers, the system will boot from the CD, and you
    will be ready to begin the installation. If this does not happen, you might need
    to reconfigure the BIOS and change the boot drive order to check for media in
    the CD/DVD drive first.

    The first menu to appear offers a number of choices:


    +   * Boot the Hard Disk—This stops the installation and boots the operating system
    already on the hard disk. Because this is the safest choice, it is the default.

    * Installation—This is the option to select to begin the normal installation.

    * Installation—ACPI Disabled—Choose this option if you need the Advanced Configuration
    and Power Interface to not interfere with the installation process.

    * Installation—Safe Settings—Choose this option if DMA mode is needed to get around
    normal installation. Use this choice if the installation keeps failing with one
    of the other selections.

    * Rescue System—This allows you to boot the system from the CD in the event that
    the hard drive boot files are damaged.

    * Memory Test—This checks RAM only.


    At the bottom of the screen, a number of function keys are identified:


    +   * F1—Help

    * F2—Toggle through screen display settings

    * F3—Toggle through installation location choices'
  merge: -1
  pgno: 155
