  md: '# About the Author


    Emmett Dulaney is the author of the Novell Certified Linux Professional (CLP)
    Study Guide and the Novell Linux Desktop 9 Administrators Handbook of Novell Press.
    A columnist and contributor to UnixReview, CertCities, and Novell Connection,
    he holds a number of vendor certifications and was a CNE in the days before operating
    system numbers followed the title. He is currently working on his doctorate, and
    coming to the conclusion that there is always just one more thing to do. He can
    be contacted at edulaney@iquest net.


    # Dedication


    This book is dedicated to Evan. His spirit of experimentation and learning by
    doing will carry him far.


    # Acknowledgments


    I am grateful to Jenny Watson for giving me the opportunity to write this book.
    I always appreciate her confidence and encouragement and enjoy the chance to work
    with her every chance C I get. Thanks are also due to David Coughanour, the technical
    editor, Andy Beaster, the project editor, and Scott Meyers, the development editor.
    I cannot thank them enough.'
