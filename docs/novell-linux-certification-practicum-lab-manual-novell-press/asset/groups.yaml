    # Exercise 1: Armstrong’s Auto Body


    You are a consultant in the small business division of your company. You have
    been dispatched to Armstrong''s Auto Body in Middletown, where a new workstation
    to be used in the front office has just arrived. They have requested that the
    operating system on this machine be replaced with the latest version of Novell
    Linux Desktop 9.


    One of the administrators at the site has used the KDE interface before and likes
    it, so that should be the default front end. The administrator password needs
    to be N7Press and encryption should be set to MD5. In addition to root, add another
    user:


    | FIELD | VALUE |

    | --- | --- |

    | Full Username | Armstrong |

    | User Login | kenarm |

    | Password | nt5 |

    | System Mail | Yes |

    | Auto Login | No |

    | Additional Groups | audio, cdrom, dialout |


    The files should be /etc/passwd and /etc/shadow.


    # Exercise 2: Barry’s House


    You are a temporary consultant for Barry. Technical. During a routine, Pianki
    informs you that the administrator has left under some circumstances. From the
    tone, Pianki believes the administrator might have created a shell script shortly
    before he left. The following:


    | FIELD | VALUE |

    | --- | --- |

    | Full Username | Doyle |

    | User Login | dlucas |

    | Password | A5 |

    | Maximum number of days | 60

    | Expiration date | 12/31/06 |

    | Login shell | /bin/zsh |

    | Default group | users |

    | Additional groups | audio, dialout, video |

    | Desktop | gears |

    | Screensaver | 10 |


    The following settings must be changed:


    - Password Encryption to Blowfish

    - Acceptable Password Length to 6 characters

    - Delay after incorrect attempts to 2


    # Exercise 3: Collette Consulting


    You are a system administrator for Collette Consulting. The vice president of
    Information calls you into his office. Apparently, there has been a break-in attempt
    on the server, and he is not sure what else has been affected. As a precautionary
    measure, he wants to enable the following:


    - Enable Accessibility Options

    - Set the password to Alt+F2

    - Enable sticky keys


    Because it is not known what else has been affected, as a precautionary measure,
    the head of IT asked that he call all personnel to change their passwords.


    # Exercise 4: D. S. Technical


    You are a field consultant for D. S. Technical. They use only Novell Linux Desktop
    9, and GNOME. Create a launcher named Job Security on the desktop that will execute
    this command.


    # Exercise 5: Evan’s Dilemma


    The phone rings in the middle of the night, and you hear the voice of Evan, a
    junior administrator for your company, on the phone. Apparently, there has been
    a break-in attempt on the server, and he is not sure what else has been affected.
    You must change your password within a terminal using `passwd`.


    ![](img/63348b0c434ac3ca20f6003076ba4fa_22_0.png)


    # Exercise 6: Frank’s Flowers


    During a visit with one of your customers, Mr. Pianki informs you that the system
    administrator has just left under less favorable circumstances. As the administrator
    was escorted out of the office, he shouted that tomorrow everyone will be sorry
    they don''t have him around. From the tone, Pianki believes the administrator
    might have created a shell script shortly before he left that will run and damage
    files on the system.


