    # CHAPTER 4: Solutions to Exercises


    6. Packages are installed next, and you will need to insert various CDs as prompted.
    Your goal is usually to complete the installation as quickly as possible, so you
    can always go back and add any packages at a later point in time.


    7. You are prompted to give a password for the root user (and enter it twice for
    verification). The password can consist of digits, spaces, letters, and the standard
    punctuation characters. It is recommended that it contain at least five characters—and
    at a minimum—the case is mixed between upper and lower. If you enter more than
    eight characters, you will be prompted to truncate or change it.


    8. Network configuration occurs next, and a scan is automatically done to detect
    network cards, DSL connections, ISDN adapters, and modems. a summary screen shows
    you the values found, as well as the current settings for Proxy (default is disabled)
    and VNC Remote Administration (default is disabled). You can change any of these
    values, go back, abort, or put the network settings shown to you into effect by
    clicking Next.


    9. After the network configuration is written/saved, the Internet connection is
    tested. This operation is purely optional, and you can choose to skip the test
    if you like. A successful test, however, gives you the option to run YaST Online
    Update (YOU) and check for the latest release notes and updates. If updates are
    available, you can choose to download and install them, or skip the update (which
    can be done at any later time from within YaST2).


    10. Service configuration comes next, allowing you to configure such items as
    Certificate Management and OpenLDAP Server.


    11. The user authentication method must be chosen. Three choices are available:


    +   - NIS—To use if you are using an NIS server

    - LDAP—To use if you are using an LDAP server for user data

    - Local (/etc/passwd)—The choice to select if you are storing passwords in /etc/passwd
    and /etc/shadow


    Accept the default user authentication method (LDAP).


    12. You can add new local users at this point. The same password rules for creating
    the root user apply to creating passwords for the local users as well.'
