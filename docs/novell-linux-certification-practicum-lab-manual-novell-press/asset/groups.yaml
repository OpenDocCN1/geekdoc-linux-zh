    你是 Mississippi Computing 的顾问，这是一家服务金融领域中型公司的小公司。你被叫到客户现场与 Terry Truitt 会面。他告知你，由于公司搬进更大的办公室，他负责的系统计划在未来几天内迁移。


    为了防止搬迁过程中可能造成的损坏，他希望你为办公室里的 NLD 工作站创建一个应急磁盘以及一份全量备份。


