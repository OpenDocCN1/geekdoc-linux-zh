    对于应急磁盘，打开 YaST 并选择“系统”。在“系统”下方，选择“创建启动、救援或模块软盘”。这里会出现七个选择：


    - 标准启动软盘 1

    - 标准启动软盘 2

    - 标准启动软盘 3

    - 救援软盘

    - 模块软盘

    - 自定义软盘

    - 下载软盘镜像


    选择“救援软盘”，磁盘镜像将复制到介质中。完成后，在 YaST 的“系统模块”下方选择“系统备份”。点击“配置文件管理”并选择“添加”来添加备份配置文件。将其命名为
    FULL。给出一个带有绝对路径的文件（例如 /tmp/backup.tar）并点击“下一步”。不要输入任何搜索限制，因为你想包含所有内容，继续点击“下一步”，直到到达图
    4.19 所示的 YaST 系统备份对话框。


    # 图 4.19


    现在可以进行备份了。


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_121_0.png)


