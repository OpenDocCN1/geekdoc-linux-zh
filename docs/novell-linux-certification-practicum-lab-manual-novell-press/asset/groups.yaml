    server, and then choose Run Command from the KDE kicker. Enter init 0, and the
    system will begin an orderly shutdown.


    # Exercise 36: U.S. Roadways


    To enable remote administration of the SLES server, follow these steps:


    - 1. Log in as root and start YaST.

    - 2. Choose Network Services and Remote Administration.

    - 3. The Remote Administration configuration dialog shown in Figure 4.35 opens.
    Click Allow Remote Administration.


    # FIGURE 4.35


    Choose to allow remote administration.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_144_0.png)


    - 4. Click Finish. The server can now be accessed via port 5801.


    OpenSSH is installed by default on SLES 9. If it is not present on a particular
    server:


    - 1. Start YaST as the root user.

    - 2. Choose Software and then Install and Remove Software.

    - 3. Type openssh in the Search field and click Search.

    - 4. Check the two packages found and click Accept. Insert any SLES 9 CDs needed
    if prompted.


    # Exercise 37: Victory Electric


    The following script will meet the requirements that were given:


    ```bash

    #menu.sh

    !/bin/bash

    while true

    do

    clear

    echo "Please choose from the following menu choices:"

    echo "A. To run flexon.sh"

    echo "B. To run hour.sh"

    echo "C. To run comp.sh"

    echo "D. To run Indian.sh"

    echo "Q. To quit"

    echo -n "Please make a selection: "

    read lett

    case $lett in

    A|a) flexon.sh

    break ;;

    b|b) hour.sh

    break ;;

    c|c) comp.sh

    break ;;

    D|d) Indian.sh

    break ;;

    q|q) exit ;;

    *) echo "Invalid response"

    sleep 3 ;;

    esac

    done

    ```


    # Exercise 38: Waffles and More


    Physically connect the printer to the server; then log in as root and start YaST.
    Choose Hardware and then Printer. Autodetection should find the new printer and
    it will appear in the Printer Configuration dialog as shown in Figure 4.36.


    You must now complete the following steps:


    - 1. Click Configure and configure the queue name and spooler settings.

    - 2. Click Next.


    # FIGURE 4.36

    Autodetection finds the new printer.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_146_0.png)


    - 3. Choose the printer model. If the correct manufacturer/model combination does
    not appear in the list, you can look for drivers on the manufacturer''s site (or
    locally).

    - 4. Click Next.

    - 5. On the Edit Configuration dialog, click Test and verify that the printer
    is configured and working properly. You should try printing without graphics and
    then with.

    - 6. Click OK, and then Finish. The printer configuration will be saved.

    - 7. At the Printer Administration dialog, shown in Figure 4.37, click Advanced
    and make certain that it is configured as a CUPS full server installation to enable
    users to access it.

    - 8. Click Accept and Finish.


    # FIGURE 4.37

    Configure sharing of the printer.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_147_0.png)


    # Exercise 39: Xtreme Books


    To accomplish this task, follow these steps:


    - 1. Open a terminal window, and then switch to root with the su command.

    - 2. From the KDE kicker, click on the icon of a monitor to open a terminal shell.
    Optionally, from the menu, select System, Terminal, and then Konsole.

    - 3. Type the command cd /.

    - 4. Type the command mkdir recovery.

    - 5. Type the command rsync -avz /home /recovery.


    Although other utilities besides rsync can be used (cp, for example), this will
    create a mirror of what is in the other directory, maintaining the same permissions,
    ownership, and all other information.


    To keep the two directories mirrored, an rsync command can be added to cron to
    run on a regular basis.


