    ## Exercise 51: Colorado Insurers


    There are a number of logs to check for entries that might indicate an intrusion.
    The primary ones you should examine are


    - /var/log/faillog—Open a shell prompt and use the faillog utility to view a list
    of users'' failed authentication attempts.


    TIP

    If the faillog utility does not return any data, there have been no failed login
    attempts.


    - /var/log/lastlog—Open a shell prompt and use the lastlog utility to view a list
    of all users and when they last logged in.

    - /var/log/messages—Use grep, or a derivative thereof, to find login related entries
    in this file.

    - /var/log/wtmp—Open a shell prompt and use the last command to view a list of
    users who have authenticated to the system.


    ## Exercise 52: Connecticut Water


    To configure the firewall needed by the customer, follow these steps:


    1. Start YaST as the root user.

    2. Choose Software, Install and Remove Software and verify that iptables is installed
    by searching for it. If it is not installed, install it.

    3. Open a terminal window. Type iptables -t filter -L. This will show the currently
    configured rules (of which there should be none).

    4. Create a firewall that drops all incoming ICMP packets by typing iptables -t
    filter -A INPUT -s 0/0 -p icmp -j DROP. Configure the firewall to drop web server
    traffic by typing iptables -t filter -A INPUT -s 0/0 -p tcp --dport 80 -j DROP.

    5. Enable the NAT routing by typing iptables -t nat -F.

    6. Type iptables -t filter -L. This should show that the new rules are now in
    place.

    7. Exit the terminal window and leave the customer''s site.


