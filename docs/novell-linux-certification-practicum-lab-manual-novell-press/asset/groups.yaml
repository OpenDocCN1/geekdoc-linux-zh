- md: "\n# Exercise 45: Village & Supply\n\n# NOTE\n\nConfiguring the ntp.conf file\
    \ and starting the nppd daemon can keep time set properly so that you don't have\
    \ to manually run ntpdate every time the server's time gets too far off.\n\nWhen\
    \ checking security policies, one of the first things to do is start YaST as root;\
    \ then choose Security and Users, Security Settings. This will open a dialog similar\
    \ to shown in Figure 4.46.\n\n# FIGURE 4.46\n\nSystem security settings.\n\n![](img/63348b0c434ac3ca20f600307a6ba4fa_154_0.png)\n\
    \nYou can choose any of the preset values, or click Next with Custom and configure\
    \ password settings, boot settings, login settings, and group settings, and a\
    \ few miscellaneous settings.\n\n# Exercise 45: Village & Supply\n\nTo install\
    \ OpenLDAP on the SLES 9 server,\n\n- 1. Start YaST as the root user.\n- 2. Choose\
    \ Software and then Install and Remove Software.\n3. Type openldap in the search\
    \ field and click Search.\n4. Check the openldap2, openldap2-client, and yast2-ldap-server\
    \ packages and click Accept. Insert any SLES 9 CDs needed if prompted.\n5. Back\
    \ in YaST, choose Network Services, LDAP Server.\n6. Click Configure, and you\
    \ are automatically able to edit the configuration file entries through the YaST\
    \ interface.\n7. Click Finish.\n\n# CHAPTER 4: Solutions to Exercises\n\n# Exercise\
    \ 46: Alabama Cement\n\nTo begin an installation of SLES 9, insert the first CD\
    \ into the computer and reboot the system. On most computers, the system will\
    \ boot from the CD, and you will be ready to begin the installation. If this does\
    \ not happen, you might need to reconfigure the BIOS and change the boot drive\
    \ order to check for media in the CD/DVD drive first.\nThe first menu to appear\
    \ offers a number of choices:\n\n- Boot the Hard Disk—This stops the installation\
    \ and boots the operating system already on the hard disk. Because this is the\
    \ safest choice, it is the default.\n- Installation—This is the option to select\
    \ to begin the normal installation.\n- Installation—ACPI Disabled—Choose this\
    \ option if you need the Advanced Configuration and Power Interface to not interfere\
    \ with the installation process.\n- Installation—Safe Settings—Choose this option\
    \ if DMA mode is needed to get around normal installation. Use this choice if\
    \ the installation keeps failing with one of the other selections.\n- Rescue System—This\
    \ allows you to boot the system from the CD in the event that the hard drive boot\
    \ files are damaged.\n- Memory Test—This checks RAM only.\n\nAt the bottom of\
    \ the screen, a number of function keys are identified:\n\n- F1—Help\n- F2—Toggle\
    \ through screen display settings\n- F3—Toggle through installation location choices\n\
    - F4—Toggle through languages\n- F5—Choose a debugging output level\n- F6—Include\
    \ a driver update CD in the installation\n\nTo perform a normal installation,\
    \ choose select Installation from the menu, and press Enter. You must then walk\
    \ through the interfaces presented in YaST2, the installation and system administration\
    \ program. Although there can be deviations, based on your exact configuration,\
    \ the following are the major scenes—in order—that you must walk through:\n\n\
    - 1. Choose a language—to cancel Accept to move on or Abort to cancel the installation.\n\
    - 2. Choose the installation mode—You can choose to perform a new installation\
    \ (the default), update an existing system, repair an installed system, boot an\
    \ installed system, or abort. For a normal installation, choose New Installation.\n\
    - 3. At this point, the system will probe for devices and show you a list of what\
    \ it has identified. It will identify the system, keyboard, mouse, and so on,\
    \ as well as show you the recommended installation settings based on the chosen\
    \ mode. Recommendations and settings fall within these categories:\n    - System\n\
    \    - Mode\n    - Keyboard layout\n    - Mouse\n    - Partitioning\n    - Software\n\
    \    - Booting\n    - Time zone\n    - Language\n    - Default runlevel\n- 4.\
    \ Three command buttons are: Change—to alter any of the settings, Abort—to cancel,\
    \ and Accept—to continue on. Choose Accept; then click Continue, and a warning\
    \ message appears stating that YaST2 has obtained all the information required\
    \ to install SUSE LINUX. The installation will be carried out to the settings\
    \ made in the previous dialogues. To commit the installation and choices made,\
    \ click the Yes, Install button.\n- 5. The hard disk is prepared/partitioned.\
    \ This will take a few minutes, and you might need to make other changes later\
    \ if you are implementing RAID or LVM devices. At a minimum, two partitions are\
    \ created: root and swap.\n6. Packages are installed next, and you will need to\
    \ insert various CDs as prompted. Your goal is usually to complete the installation\
    \ as quickly as possible, so you can always go back and add any packages at a\
    \ later point in time.\n7. You are prompted to give a password for the root user\
    \ (and enter it twice for verification). The password can consist of digits, spaces,\
    \ letters, and the standard punctuation characters. It is recommended that it\
    \ contain at least five characters—and at a minimum—the case is mixed between\
    \ upper and lower. If you enter more than eight characters, you will be prompted\
    \ to truncate or change it.\n8. Network configuration occurs next, and a scan\
    \ is automatically done to detect network cards, DSL connections, ISDN adapters,\
    \ and modems. A summary screen shows you the values found, as well as the current\
    \ settings for Proxy (default is disabled) and VNC Remote Administration (default\
    \ is disabled). You can change any of these values, go back, abort, or put the\
    \ network settings shown to you into effect by clicking Next.\n9. After the network\
    \ configuration is written/saved, the Internet connection is tested. This operation\
    \ is purely optional, and you can choose to skip the test if you like. A successful\
    \ test, however, gives you the option to run YaST Online Update (YOU) and check\
    \ for the latest release notes and updates. If updates are available, you can\
    \ choose to download and install them, or skip the update (which can be done at\
    \ any later time from within YaST2).\n10. Service configuration comes next, allowing\
    \ you to configure such items as Certificate Management and OpenLDAP Server.\n\
    11. The user authentication method must be chosen. Three choices are available:\n\
    \    - NIS—To use if you are using an NIS server\n    - LDAP—To use if you are\
    \ using an LDAP server for user data\n    - Local (/etc/passwd)—The choice to\
    \ select if you are storing passwords in /etc/passwd and /etc/shadow\nAccept the\
    \ default authentication method (LDAP).\n12. You can add local users at this point.\
    \ The same password rules for creating the root apply to creating local users\
    \ as well.\n\n# Exercise 46: Alabama Cement\n\n# NOTE\n\nNot only can you add\
    \ a new user at this point, but also you should. It is good practice to only use\
    \ root when necessary, so you should have at least one other account to log in\
    \ as default. I suggest that an \"admin\" user be created at this point.\n\n-\
    \ 13. SuSEconfig now starts and writes the system configuration. The amount of\
    \ time this takes will vary greatly from system to system based on the parameters\
    \ you've entered.\n- 14. Release notes are displayed covering the following:\n\
    \    - General—Information that everybody should read\n    - Update—Covers changes\
    \ not appearing in the Admin Guide\n    - Installation—More information about\
    \ the installation\n    - Updates and Features—Covers technical changes and enhancements\n\
    \    - Providing Feedback—Tells how to contact SUSE, and so on\n15. Hardware configuration\
    \ of the graphics card, printers, and sound cards follows, and then the installation\
    \ is complete. You must click the command button labeled Finish, and then you\
    \ can log in to the system. (It is a good idea to do so as the admin user added\
    \ during step 12.)\n\nUpon successful completion of these steps, a login screen\
    \ will appear prompting for a username and password. After you give those entries,\
    \ a Welcome menu thanks you for installing SUSE LINUX Enterprise Server 9 and\
    \ provides a list of URLs relating to this and other Novell products.\n\nIf there\
    \ are problems with the installation, you should trace down the first occurrence\
    \ in which trouble appeared and look for a solution to it before continuing on.\
    \ The best tool to use for any problem within this category is common sense.\n\
    \nFor example, if the system will not read the media, verify that the CD set you\
    \ have is good by checking to see if another system can read it. If the installation\
    \ hangs, verify that your system meets the minimum system requirements and that\
    \ power saving features are not affecting your ability to do the installation.\n"
  mdcn: "\n\n# 练习 45：村庄与供应\n\n# 注意事项\n\n配置 ntp.conf 文件并启动 nppd 守护进程可以保持时间设置正确，这样你就不需要在每次服务器时间偏差过大时手动运行\
    \ ntpdate。\n\n在检查安全策略时，首先要做的事情之一是以 root 身份启动 YaST；然后选择“安全与用户”、“安全设置”。这将打开一个类似于图\
    \ 4.46 所示的对话框。\n\n# 图 4.46\n\n系统安全设置。\n\n![](img/63348b0c434ac3ca20f600307a6ba4fa_154_0.png)\n\
    \n你可以选择任何预设值，或者点击“自定义”并点击下一步来配置密码设置、启动设置、登录设置、组设置以及一些杂设置。\n\n# 练习 45：村庄与供应\n\n\
    要在 SLES 9 服务器上安装 OpenLDAP，\n\n- 1. 以 root 用户启动 YaST。\n- 2. 选择“软件”，然后选择“安装和移除软件”。\n\
    3. 在搜索字段中输入 openldap 并点击“搜索”。\n4. 勾选 openldap2、openldap2-client 和 yast2-ldap-server\
    \ 包并点击“接受”。如果提示，请插入所需的 SLES 9 CD。\n5. 回到 YaST，选择“网络服务”、“LDAP 服务器”。\n6. 点击“配置”，你就可以自动通过\
    \ YaST 界面编辑配置文件的条目。\n7. 点击“完成”。\n\n# 第 4 章：练习解答\n\n# 练习 46：阿拉巴马的水泥\n\n要开始安装 SLES\
    \ 9，请将第一张 CD 插入计算机并重启系统。在大多数计算机上，系统将从 CD 启动，你就可以准备开始安装了。如果没有发生这种情况，你可能需要重新配置 BIOS\
    \ 并更改启动器顺序，以便优先检查 CD/DVD 驱动器中的媒体。\n出现的第一个菜单提供了多个选择：\n\n- 启动硬盘——这将停止安装并启动硬盘上已有的操作系统。这是最安全的选择，因此它是默认选项。\n\
    - 安装——这是选择开始普通安装的选项。\n- 安装——禁用 ACPI——如果你需要高级配置电源接口不干扰安装过程，请选择此选项。\n- 安装——安全设置——如果需要\
    \ DMA 模式来绕普通安装，请选择此选项。如果使用其他选择时安装持续失败，请使用此选项。\n- 救援系统——这允许在硬盘启动文件损坏时从 CD 启动系统。\n\
    - 内存测试——仅检查 RAM。\n\n在屏幕底部标识了几个功能键：\n\n- F1—帮助\n- F2—切换屏幕显示设置\n- F3—切换安装位置选择\n\
    - F4—切换语言\n- F5—选择调试输出级别\n- F6—在安装中包含驱动更新 CD\n\n要执行普通安装，请从菜单中选择“安装”并按回车键。然后你必须按照\
    \ YaST2（安装和系统管理程序）呈现的界面进行操作。尽管根据你的具体配置可能会有所偏差，但以下是你必须按顺序完成的主要场景：\n\n- 1. 选择语言——点击“接受”以继续，或点击“中止”取消安装。\n\
    - 2. 选择安装模式——你可以选择执行新安装（默认）、更新现有系统、修复已安装的系统、启动已安装的系统或中止。对于普通安装，请选择“新安装”。\n- 3.\
    \ 此时，系统将探测设备并向你显示识别出的列表。它将识别系统、键盘、鼠标等，并根据所选模式为你显示推荐的安装设置。建议和设置属于这些类别：\n    - 系统\n\
    \    - 模式\n    - 键盘布局\n    - 鼠标\n    - 分区\n    - 软件\n    - 启动\n    - 时区\n    -\
    \ 语言\n    - 默认运行级别\n- 4. 三个命令按钮是：更改——修改任何设置；中止——取消；以及接受——继续。选择“接受”；然后点击“继续”，会出现一条警告消息，说明\
    \ YaST2 已获取安装 SUSE LINUX 需要的所有信息。安装将按照之前对话框中的设置进行。要提交安装和所做的选择，点击“是，安装”按钮。\n- 5.\
    \ 准备/分区硬盘。这将需要几分钟，如果你正在实现 RAID 或 LVM 设备，稍可能需要进行其他更改。至少会创建两个分区：根（root）和交换（swap）。\n\
    - 6. 接下来安装软件包，你需要根据提示插入各种 CD。你的目标通常是尽快完成安装，因此你始终可以在以后任何时候返回并添加任何包。\n- 7. 系统提示为\
    \ root 用户提供密码（并输入两次进行验证）。密码可以由数字、空格、字母和标准标点字符组成。建议密码至少包含五个字符，且至少要大小写混合。如果你输入了超过八个字符，系统将提示你截断或更改它。\n\
    - 8. 接下来进行网络配置，并将自动进行扫描以检测网卡、DSL 连接、ISDN 适配器和调制解调器。摘要屏幕向你显示发现的值，以及代理（默认禁用）和 VNC\
    \ 远程管理（默认禁用）的当前设置。你可以更改这些值中的任何一个、返回、中止，或点击“下一步”使你显示的网络设置生效。\n- 9. 在网络配置写入/保存后，将测试\
    \ Internet 连接。此操作完全是可选的，如果你喜欢，可以选择跳过测试。然而，成功的测试将为你提供选项运行 YaST 在线更新 (YOU) 并检查最新的发布说明和更新。如果有可用更新，你可以选择下载并安装它们，或者跳过更新（这以后可以在\
    \ YaST2 内部完成）。\n- 10. 接下来是服务配置，允许你配置如证书管理和 OpenLDAP 服务器等项目。\n- 11. 必须选择用户验证方法。有三个选择：\n\
    \    - NIS—如果你使用 NIS 服务器则使用它\n    - LDAP—如果你使用 LDAP 服务器存储用户数据则使用它\n    - 本地 (/etc/passwd)—如果你将密码存储在\
    \ /etc/passwd 和 /etc/shadow 中则选择此项\n接受默认验证方法 (LDAP)。\n- 12. 你此时可以添加本地用户。创建 root\
    \ 的相同密码规则也适用于创建本地用户。\n\n# 练习 46：阿拉巴马的水泥\n\n# 注意事项\n\n此时你不仅可以添加新用户，而且应该这样做。良好的做法是只在需要时使用\
    \ root，因此你至少应该有另一个账户用于登录。\n\n- 13. SuSEconfig 现在启动并写入系统配置。根据你输入的参数，此过程所需的时间在系统之间将差异巨大。\n\
    - 14. 显示发布说明，涵盖内容：\n    - 通用——每个人应该阅读的信息\n    - 更新——涵盖管理指南中未出现的变化\n    - 安装——关于安装的更多信息\n\
    \    - 更新和功能——涵盖技术变更和增强\n    - 提供反馈——告知如何联系 SUSE 等\n- 15. 接下来是显卡、打印机和声卡的硬件配置，然后安装完成。你必须点击为“完成”的按钮，然后就可以登录系统。（建议以第12步中添加的\
    \ admin 用户进行登录。）\n\n成功完成这些步骤后，将出现登录界面并提示用户名和密码。输入这些条目后，欢迎菜单感谢你安装 SUSE LINUX Enterprise\
    \ Server 9，并提供与此以及其他 Novell 产品相关的 URL 列表。\n\n如果安装出现问题，你应该追溯到出现故障的时刻，并在继续之前寻找解决方案。处理此类问题中的任何问题，最好的工具就是常识。\n\
    \n例如，如果系统无法读取媒体，通过检查另一个系统是否可以读取来验证你的 CD 组是否良好。如果安装挂起，请验证你的系统是否符合最低系统要求，并确保节能功能没有影响你的安装。\n\
    \n"
