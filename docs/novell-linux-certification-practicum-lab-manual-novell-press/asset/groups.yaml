    To accomplish this task, you should first back up all data on the server, and
    then properly shut it down. After installing the hard drive and booting the server,
    use fdisk to create the new partitions. You can then


    - 1. Log in as root and start YaST.

    - 2. Choose System and LVM. If you do not already have such, you will be prompted
    to create a volume group, shown in Figure 4.44.


    # FIGURE 4.44

    Create a volume group


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_152_0.png)


    - 3. The physical and logical volumes will appear.

