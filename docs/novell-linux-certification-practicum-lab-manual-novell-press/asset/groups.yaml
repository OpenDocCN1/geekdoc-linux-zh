    # 练习 16：ACME 电子


    你是一家小公司的顾问，该公司专门为为小型企业打造定制技术解决方案。ACME 的所有者（一家家庭经营的小店）给你打来电话，告知他们刚刚聘佣了一位名叫 Kristin
    的新接待员。


    Kristin 没有 Linux 经验，对计算机的经验也很少。为了完成她工作所需的某项每月任务，她需要知道如何访问命令行、切换到 ACME 目录，并使用 `{month}.gz`
    语法将该目录下的所有文件用 gzip 压缩。完成后，她需要将归档文件移动到 `/ACME/MONTHLY` 目录，并将目录中的所有其他文件移动到 `/ACME/OLD`。


    你需要引导她完成这些任务。


