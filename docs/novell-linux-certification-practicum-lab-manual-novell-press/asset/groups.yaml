    # Exercise 33: Rich and Big Home Improvements


    During a normal boot, the system will come up and change into the runlevel assigned
    in the /etc/initab file. Because the system is not “booting properly” and power
    was lost so rapidly, the most likely culprit is file system corruption; a quick
    check of the log file (/var/log/messages) should confirm this.


    If this is the case, run the fsck utility to fix file corruption and bring the
    system back to a bootable state.


