    # Exercise 16: ACME Electronics


    You are a consultant for a small company that specializes in crafting custom technology
    solutions for small businesses. The owner of ACME, a mom-and-pop company, calls
    you on the phone and informs you that they have just hired a new receptionist
    named Kristin.


    Kristin has no experience with Linux, and only a small amount of experience with
    computers. In order to do a particular monthly task her job requires, she needs
    to know how to access the command line, change to the ACME directory, and zip
    all files in that directory with gzip using the syntax {month}.gz. After that
    is done, she is to move the archived file to the /ACME/MONTHLY directory and all
    other files in the directory to /ACME/OLD.


    You need to walk her through these tasks.


    # NOTES


    # Exercise 17: Barnes and Fine


    The manager of a small video store informs you that you cannot find a file on
    his server. He knows the file has the phrase tickets in the title, but is not
    sure what the full name is. You need to find the file on the system for him.


    You should attempt to find the file using both the graphical tools and from the
    command line.


    While you are at the site, you have also been instructed by the home office to
    obtain information about hardware and note it to report back to them for possible
    upgrades. As a security precaution covered in the customer''s contract, you are
    also required to look for and note any newly added files with permissions above
    2000.


    NOTES


    # Exercise 18: Cash Today


    A small chain of stores is considering upgrading their servers to newer equipment.
    You have been dispatched to collect information about the processes running on
    the SLES servers. Because the company you work for believes strongly in redundancy,
    you are to take a screenshot of the processes from the GUI, and then go to the
    command line and create a text file of the currently running processes. Both files
    are then to be mailed to the main office.


    # NOTES


