    # Introduction


    The underlying purpose of this BRD is to give you all the information you need
    to know in order to satisfy the requirements of the task and meet the expectations
    for the company. Notice the emphasis on “meet.” This is a very important concept
    that you must keep in mind: Your role during the exam is to exactly what matters
    needs to be done to the BRD and nothing else. In the real world, if you were brought
    in to solve a problem with DNS and you happened to notice that printing was configured
    all wrong, you would never spend billable time fixing the printing problem without
    first asking approval to do from the customer. That same attitude must be taken
    here—it is your job to configure the system as you are told to do so and not make
    arbitrary changes in other areas.


    In the actual exam, it will never be necessary to demonstrate every task from
    every one of the objectives that exist in this book in order to satisfy the requirements,
    but you never know objectives will be needed to satisfy the BRD you are presented
    until you take the actual test. As a very rough rule of thumb, it is not unlikely
    that you will have to perform up to 75% of the tasks covered here in order to
    successfully complete the practicum. You must study for all topic areas, in order
    to be fully prepared.


    A FAQ on “practical training” can be found at http://practicum.novell.com/modules.php?op=modload&name=FAQfile=index,
    and the home page on this technology can be found at http://practicum.novell.com/index.php.


    # What Do You Need?


    In order to work through the exercises in this book, you will need a test environment
    in which you can experiment without inflicting harm on any production machines.
    For the NLD client, the requirements for a standard installation are


    +   - Pentium II+ 266MHz or any AMD64 or Intel EM64T processor

    - 128MB RAM

    - 800MB free hard drive space

    - 800x600 or higher resolution


    NOTE

    Some of the exercises, you will also need a printer and access to another NLD
    9 workstation.'
