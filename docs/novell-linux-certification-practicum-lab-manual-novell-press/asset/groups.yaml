    Add each of the users.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_128_0.png)


    After all the users are added, click Finish. Create the AC group by choosing Edit
    and Create Groups in the Security and Users section of YaST. Click Add, and configure
    the information as shown in Figure 4.25.


    Click Next and Finish.


    ## CHAPTER 4: Solutions to Exercises


    FIGURE 4.25

    Add the new group.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_129_0.png)


    ## Exercise 21: Fetters Hair and Such


    To perform this operation, follow these steps:


    - 1. From the KDE kicker, click on the icon of a monitor to open a terminal shell.
    Optionally, from the menu, select *System, Terminal*, and then *Konsole*.

    - 2. Type the command `cd /`.

    - 3. Type the command `mkdir personal`.

    - 4. Type the command `cd personal`.

    - 5. Type the command `mkdir accounts employees suppliers other`.

    - 6. Type the command `cd /tmp`.

    - 7. Type the command `rm -i *` to interactively delete the files in this directory
    and avoid problems.

    - 8. Exit the shell by typing exit; then start YaST and choose *Misc* followed
    by *View Start-up Log*. This will allow you to look for any problems related to
    startup as recorded in the boot.msg file.


    ## Exercise 22: Global Moving


    To change the default runlevel, follow these steps:


    - 1. Log in as any user, and then su – to root.

    - 2. From the KDE kicker, click on the icon of a monitor to open a terminal shell.
    Optionally, from the menu, select System, Terminal, and then Konsole.

    - 3. Type the command `cd /etc`.

    - 4. Edit the inittab file, shown in Figure 4.6.


    FIGURE 4.26

    Edit the /etc/inittab file.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_130_0.png)


    - 5. Change the 5 in the line id: 5:initdefault: to 4, and the new default runlevel
    will be 4.

    - 6. Save the file and exit. The new default runlevel will apply the next time
    the system is booted.


    To change the ACLs on all files beneath /tmp, follow these steps:


    - 1. Log in as any user then su – to root.

    - 2. From the KDE kicker, click on the icon of a monitor to open a terminal shell.
    Optionally, from the menu, select System, Terminal, and then Konsole.

    - 3. Type the command `cd /tmp`.

    - 4. Type the command `getfacl /root/.fonts.cache-1 | setfacl --set-file=- *`
    to change all the files beneath this directory.


    NOTE

    If you''ve logged in as a different user, the path to the .fonts.cache-1 file
    will be /home/<username>.


    - 5. Exit the terminal by typing `exit`.


    ## Exercise 23: Hare Trucks


    The numeric representation of `-rw-r-----` is 640. Subtracting this from the default
    for new files of 666 gives a remainder of 26. To set the system that all newly
    created files have these default permissions, as root.


    - 1. Log in as root.

    - 2. From the KDE kicker, click on the icon of a monitor to open a terminal shell.
    Optionally, from the menu, select `System, Terminal`, and then Konsole.

    - 3. Type `cd /etc`.

    - 4. Edit the `profile` file and change the default entry from `umask 022` to
    `umask 026`.


    TIP

    If you try to test the configuration change, note that the profile file is not
    read until the next time a shell is launched. You won''t see anything different
    in the permissions of newly created files until after you''ve launched a new shell.


    To change the permissions on all files currently in the /tmp directory to read-only
    permissions for all users,


    - 1. Type `cd /tmp`.

    - 2. Type `chmod 444 *`

    - 3. Exit the terminal by typing `exit`.


    ## Exercise 24: Independent Fireworks


    To implement disk quotas for all users,


    - 1. Start YaST and authenticate as the root user.

    - 2. Install the quota package.

    - 3. Choose System and then Partitioner.

    - 4. Select the Linux partition and click the Edit button. This will bring up
    a screen similar to that shown in Figure 4.27.


    FIGURE 4.27

    The current partition without quotas.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_132_0.png)


    - 5. Click the Fstab Options button. This brings up a screen similar to that shown
    in Figure 4.28.

    - 6. Type usquota in the Arbitrary Option Value box at the bottom.

    - 7. Click OK twice, followed by Apply.


    NOTE

    After clicking Apply, a couple of unexpected things happen. First, YaST tells
    you that the volume needs to be remounted and asks if you are sure you want to
    do this. Now you will then see a warning saying that it can''t be remounted and
    implies that you have to know what you are doing to continue. If this happens,
    select to continue.


    After doing this, go to a terminal prompt and remount the root partition by entering
    mount -o remount /dev/hda2.


    Before going on to the next step, turn quotas for all mounted file systems by
    entering quota -av, and then make this persistent by entering chkconfig quota
    on.


    FIGURE 4.28

    The options available with fstab.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_133_0.png)


    - 8. It is now possible to go to the command line and use the command setquota
    to turn on the quota for each user.


    TIP

    In addition to using setquota, you use repquota to view the quota report and edquota
    to edit user quota settings.


    ## Exercise 25: J & C Bookkeeping


    To apply patches and updates through YaST, follow these steps:


    - 1. Log in as root and start YaST.

    - 2. Choose Software and then Online Update. A screen similar to that shown in
    Figure 4.29 appears. Note: If you click Configure Fully Automatic Update..., you
    can configure a cron entry that will automatically keep the system current.


    FIGURE 4.29

    Choices for online updating.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_134_0.png)


    - 3. Click Next. Information about new updates will be retrieved.

    - 4. If prompted for a username and password, enter these values, and then choose
    to install any found updates.

    - You can also choose to install patches from a CD by choosing Software and Patch
    Update. To set settings on the server, choose Software and System Update. Choose
    Change and Update Options. Last, this opens a dialog similar to that shown in
    Figure 4.30.


    FIGURE 4.30

    Update options.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_135_0.png)


    FIGURE 4.31

    YOU configuration options.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_135_1.png)


    ## Exercise 26: Karen’s Computers


    You can make a list of each user who has ever logged on to the server by following
    these steps:


    - 1. Log in as root.

    - 2. From the KDE kicker, click on the icon of a monitor to open a terminal shell.
    Optionally, from the menu, select System, Terminal, and then Konsole.

    - 3. Type lastlog | grep -vi "never" to reduce the display to only lines of valid
    logins.


    This will show the most recent login for each account, but not every login. Make
    a list of the usernames, and then use each with the last command to find out each
    login since the last time the wtmp file started. For example, to see the entries
    for the user edaney, the command would be last edaney.


    ## Exercise 27: Lifetime Solutions


    To check the hostname of the server, follow these steps:


    - 1. Log as root.

    - 2. From the KDE kicker, click on the icon of a monitor to open a terminal shell.
    Optionally, from the menu, select System, Terminal, and then Konsole.

    - 3. Type hostname.


    The “regular barrage of command line networking commands” should include: ping,
    traceroute, ifconfig, ifstatus, and netstat. Use route and arp to check the routing
    table as well as the address resolution results, respectively.


    ## Exercise 28: Muncie Management


    The ip tool is used to see and change the current network configuration. To see
    the current configuration, the command ip address show is used. The display generated
    will resemble that shown in Figure 4.32.


    The output of this command is identical to that of ifconfig. Substituting add
    for show, you can add to the settings, and using del allows you to delete existing
    settings.

