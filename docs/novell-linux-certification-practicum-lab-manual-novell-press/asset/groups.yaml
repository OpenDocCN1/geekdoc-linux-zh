    ## 练习 21：Fetters Hair 及其他


    要执行此操作，请遵循以下步骤：


    - 1. 从 KDE kicker 中点击显示器图标打开终端外壳。可选地，从菜单中选择 *System, Terminal*，然后选择 *Konsole*。

    - 2. 输入命令 `cd /`。

    - 3. 输入命令 `mkdir personal`。

    - 4. 输入命令 `cd personal`。

    - 5. 输入命令 `mkdir accounts employees suppliers other`。

    - 6. 输入命令 `cd /tmp`。

    - 7. 输入命令 `rm -i *` 交互删除此目录下的文件以避免问题。

    - 8. 输入 exit 退出外壳；然后启动 YaST 并选择 *Misc*（杂项）后的 *View Start-up Log*（启动日志）。这将允许你查看
    boot.msg 文件中记录的任何与启动相关的问题。


    ## 练习 22：全局移动


    要更改默认运行级别（runlevel），请遵循以下步骤：


    - 1. 以任意用户登录，然后 su – 切换到 root。

    - 2. 从 KDE kicker 中点击显示器图标打开终端外壳。可选地，从菜单中选择 System, Terminal，然后选择 Konsole。

    - 3. 输入命令 `cd /etc`。

    - 4. 编辑如图 4.6 所示的 inittab 文件。


    图 4.26

    编辑 /etc/inittab 文件。


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_130_0.png)


    - 5. 将行 `id: 5:initdefault:` 中的 5 更改为 4，新的默认运行级别将变为 4。

    - 6. 保存文件并退出。新的默认运行级别将在下次系统启动时生效。


    要更改 /tmp 下所有文件的 ACL，请遵循以下步骤：


    - 1. 以任意用户登录，然后 su – 切换到 root。

    - 2. 从 KDE kicker 中点击显示器图标打开终端外壳。可选地，从菜单中选择 System, Terminal，然后选择 Konsole。

    - 3. 输入命令 `cd /tmp`。

    - 4. 输入命令 `getfacl /root/.fonts.cache-1 | setfacl --set-file=- *` 以更改此目录下的所有文件。


    注意

    如果你以不同的用户登录，.fonts.cache-1 文件的路径将为 /home/<username>。


    - 5. 输入 `exit` 退出终端。


    ## 练习 23：Hare Trucks


    `-rw-r-----` 的数字表示是 640。从新文件的默认值 666 中减去此值剩余 26。以 root 身份设置系统使所有新创建的文件具有这些默认权限。


    - 1. 以 root 身份登录。

    - 2. 从 KDE kicker 中点击显示器图标打开终端外壳。可选地，从菜单中选择 `System, Terminal`，然后选择 Konsole。

    - 3. 输入 `cd /etc`。

    - 4. 编辑 `profile` 文件并将默认项从 `umask 022` 更改为 `umask 026`。


    提示

    如果你尝试测试配置更改，请注意 profile 文件在下次启动外壳时才会被读取。在启动新外壳之前，你不会看到新创建的文件权限有任何变化。


    要将 /tmp 目录中当前所有文件的权限更改为所有用户的只读权限：


    - 1. 输入 `cd /tmp`。

    - 2. 输入 `chmod 444 *`。

    - 3. 输入 exit 退出终端。


    ## 练习 24：独立烟花


    为所有用户实现磁盘配额（disk quotas）：


    - 1. 启动 YaST 并以 root 用户身份验证。

    - 2. 安装 quota 包。

    - 3. 选择“系统”（System）然后选择“分区器”（Partitioner）。

    - 4. 选择 Linux 分区并点击“编辑”（Edit）按钮。这将显示与图 4.27 类似的屏幕。


    图 4.27

    当前没有配额的分区。


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_132_0.png)


    - 5. 点击“Fstab Options”按钮。这将显示与图 4.28 类似的屏幕。

    - 6. 在底部的“任意选项值”（Arbitrary Option Value）框中输入 `usquota`。

    - 7. 双击 OK，然后点击“应用”（Apply）。


    注意

    点击“应用”后，发生了两个意外情况。首先，YaST 告诉你卷需要重新挂载，并询问你是否确定要这样做。现在你将看到警告，说无法重新挂载，并暗示你必须知道自己在做什么才能继续。如果发生这种情况，选择继续。


    执行此操作后，进入终端并输入 `mount -o remount /dev/hda2` 重新挂载根分区。


    在继续下一步之前，输入 `quota -av` 开启所有挂载文件系统的配额，然后输入 `chkconfig quota on` 使其持久化。


    图 4.28

    fstab 可用的选项。


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_133_0.png)


    - 8. 进入终端提示符并重新挂载分区开启配额。


    提示

    除了使用 setquota 外，还可以使用 repquota 来查看配额报告。


    ## 练习 25：J & C 记账

    要通过 YaST 安装更新，请遵循以下步骤：


    - 1. 启动 YaST 并以 root 用户身份登录。

    - 2. 安装 quota 包。

    - 3. 选择“系统”然后选择“在线更新”（Online Update）。将显示与图 4.29 类似的屏幕。


    图 4.29

    在线更新的选项。


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_134_0.png)


    - 3. 点击“下一步”。将检索有关更新的信息。

    - 4. 如果提示输入用户名和密码，输入这些值，然后选择从 CD 安装任何找到的更新。你也可以通过“软件”和“更新”来安装补丁。选择“配置”和“更新”来设置服务器设置。选择“系统”和“更新”。选择“更改”。这将打开一个与图
    4.30 类似的对话框。


    图 4.30

    更新选项。


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_135_0.png)


    图 4.31

    配置选项。


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_135_1.png)


    ## 练习 26：Karen 的电脑

    要列出曾经登录过服务器的所有用户，请遵循以下步骤：


    - 1. 以 root 身份登录。

    - 2. 从 KDE kicker 中点击显示器图标打开终端外壳。可选地，从菜单中选择 System, Terminal，然后选择 Konsole。

    - 3. 输入 `lastlog | grep -vi "never"` 将显示减少为有效登录的行。


    这将显示每个账户的最近登录，但不是每次登录。列出用户名，然后使用 `last` 命令查看自 wtmp 文件启动以来的每次登录。例如，查看用户 edaney
    的记录，命令将是 `last edaney`。


    ## 练习 27：Lifetime Solutions

    要检查服务器的主机名，请遵循以下步骤：


    - 1. 登录 root。

    - 2. 从 KDE kicker 中点击显示器图标打开终端外壳。可选地，从菜单中选择 System, Terminal，然后选择 Konsole。

    - 3. 输入 `hostname`。


    ## 练习 28：Muncie 管理

    `ip` 工具用于查看和更改当前网络配置。要查看当前配置使用命令 `ip address show`。生成的显示将如图 4.32 所示。


    此命令的输出与 `ifconfig` 相同。用 `add` 替换 `show` 可以添加设置，而使用 `del` 则可以删除现有设置。


