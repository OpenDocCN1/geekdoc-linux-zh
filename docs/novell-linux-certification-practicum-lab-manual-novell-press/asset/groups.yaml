    ## Exercise 67: Michigan Growers


    You are a consultant specializing in the networking and telecommunications fields.
    Many of your clients turn to you only after they have exhausted all internal resources
    and are stumped on how to proceed.


    You have been hired by MG to configure DNS to restrict all queries to hosts on
