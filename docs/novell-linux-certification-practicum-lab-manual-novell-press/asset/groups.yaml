    你正在 Jerralds 现场处理一个打印机问题，这时一位销售人员打来电话。他创建了一份必须向客户展示的重要演示文稿，但没带文稿就去了客户位于伦敦的现场。这位手忙脚措的销售人员记得文件的确切名称，也不记得是否已经将所有需要的内容合并到了一个文件中。


    他唯一确定的是，所需的文件在他的主目录（home directory）中，并且需要尽快通过电子邮件将一切发送给他。


    你介入并自愿处理这种情况。发送 dlucas 主目录中文件的最佳方法是将其归档成一个名为 LONDON 的单个文件。由于要通过电子邮件发送，你还需要对其进行压缩。


    为销售人员准备好这个归档包以便发送给他。


    # 注意


    ## 练习 11：Kent 的学校


    当地的一所私立学校请你来咨询。他们一直在教学生编写非常基础的 shell 脚本。其中一个学生写了一个名为 omniart 的脚本，该脚本调用了许多 sleep
    进程。他们不想关闭机器，只有在万不得已的情况下关闭，因为机器上运行着其他仍需要执行的应用程序。然而，这些其他应用程序正被 sleep 进程严重减慢速度。


    他们希望你尽可能地终止这些 sleep 进程。


    # 注意


    ## 练习 12：Lessons Learned, Inc.


    Lessons Learned 公司的 Wiese 博士将你叫到他的办公室。他向你分享了他面临的一个困扰。他的一个同事不断地给他打电话，要求他去办公室，以便他演示如何在
    NLD 中完成某些他以前在 Windows 中常用的简单操作。


    # 注意


    此练习需要访问另一台连接到同一网络上的 NLD 9 工作站。


    无论 Wiese 博士演示过多少次，那位同事总是说他理解了，结果第二天又打来电话，什么都不记得。Wiese 博士对于停止手头工作、走过走廊、上楼、演示简单的解决方案然后再次走回所花费的时间感到困扰。


    当你提到 NLD 的桌面共享功能时，他非常高兴，并认为这可能解决问题。正当你们讨论这种情况时，电话响了，是那位同事打来的，同样的问题。


    在两台机器之间建立连接以解决这个困境。


    # 注意


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_29_0.png)


