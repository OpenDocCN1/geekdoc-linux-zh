    # SUSE LINUX Enterprise Server 9


    The 30 exercises that follow allow you to test your knowledge of SUSE LINUX Enterprise
    Server 9 at an intermediate level. Although the vast majority of these exercises
    can be done from the console, you will find it helpful to put it lightly—to have
    at least one client connected to the server. The ideal client for most purposes
    is the Novell Linux Desktop.


    Step-by-step solutions to these exercises appear in Chapter 4, "Solutions to Exercises."
    Table 2.1 lists the objectives from the courses used to prepare for the Novell
    CLP (Certified Linux Professional) that this section covers and which each of
    those tasks can be found in. Please note that not every study objective for that
    exam is here, as some do not lend themselves well to exercises—such as "The History
    of Linux." Where possible, every objective that could have an exercise associated
    with it is represented here at least once.


    # NOTE


    The 3 Novell courses that are recommended for CLP study, and from which these
    objectives are derived, are numbers 3036 (Linux Fundamentals), 3037 (Linux Administration),
    and 3038 (Advanced Administration).'
