    # Novell. Linux Certification Practicum Lab Manual


    ABOUT THE AUTHOR

    Emmett Daney is the certification columnist for UnixReview and author of Novell
    Certified Linux Professional (CLP) Study Guide from Novell Press. He has earned
    18 vendor certifications and has written several books on Novell, Unix, and certification
    study.


    # Test Your Skills


    This Novell Press Lab Manual is your key to testing your knowledge and proficiency
    with Linux so that you can evaluate your readiness for the practicum exams.


    Expert trainer and curriculum developer Emmett Delaney brings you the practice
    exercises you will need to help you assess your readiness and knowledge of Novell
    Linux Desktop and SUSE LINUX Server 9 at both the Novell Certified Linux Professional
    (CLP) and Novell Certified Linux Engineer 9 (CLE 9) levels.


    # Inside You''ll Find Just What You Need to...


    +   - Analyze and assess your aptitude to install, configure and administer Novell''s
    family of Linux operating systems


