    # Exercise 15: Octagon Systems


    To disable, or make certain that remote administration is not enabled, on the
    system, log in as root and start YaST. Choose Network Services, Remote Administration.
    Only two radio button choices are available. Make sure that the one labeled Do
    Not Allow Remote Administration is chosen and click Finish.


    Back in YaST, choose the Misc choice and view Start-up Log. This displays the
    contents of the /var/log/boot.msg file. Scan this log and look for errors that
    are occurring. The most recent information is at the bottom of the file, which
    is where it opens to by default.


    If anything suspicious does appear as you scan this file, you can choose to save
    it, print it, or use other utilities to view it if you want to scrutinize it further.


    # Exercise 16: ACME Electronics


    Make sure that the /ACME, /ACME/OLD, and /ACME/MONTHLY directories are in place
    and the receptionist''s user has the necessary permissions to write files to these
    directories. You should document the steps for the employee as follows:


    1. From the KDE kicker, click on the icon of a monitor to open a terminal shell.
    Optionally, from the menu, select System, Terminal, and then Konsole.

    2. Type the command `cd /ACME`.

    3. Because all the files within the directory are to be placed in a single file,
    both tar and gzip must be used. While the commands can be piped, in order to walk
    a novice user through the process, it is best to do the operation as two separate
    processes:


    ```

    tar cvf july.tar

    gzip july.tar

    ```

    4. The command to move the archive file to the desired directory is: `mv july.tar.gz
    MONTHLY`.

    5. The command to move all other files to the desired directory is: `mv *.* OLD`.

    6. Close the terminal session by typing exit.


    A quick explanation that "july" should be replaced each month with the current-directory
    should be sufficient to complete walking her through these tasks.


