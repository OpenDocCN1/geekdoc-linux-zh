    # ## Exercise 71: Montana Expeditions


    Three actions need to take place to meet the needs of this customer. The first
    is to change the default permissions on all newly created files to 664. Subtracting
    from 666 leaves a value of 002. To meet this requirement, edit the `/etc/profile`
    file and change the default entry 022 to `umask 002.


    To change the permissions on all files currently in the /tmp directory to 751,
    the easiest solution is to open a terminal session, change to the /tmp directory,
    and use the command `chmod 751 *`.


