    # Exercise 43: LILO Technology


    GRUB is installed on SLES 9 by default. You can see if it is installed on your
    server by logging in as root, starting YaST, and choosing System, Boot Loader
    Configuration. This will bring up a dialog similar to that shown in Figure 4.45.
    If you need to make any changes, you can do so by clicking Edit. This will let
    you choose between GRUB, LILO, or no boot loader.


    # FIGURE 4.45

    Boot loader configuration.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_153_0.png)


    To edit boot loader, choose the appropriate entry of the table then click Edit
    to add a new option, use Add to add a partition, click Delete to remove a partition,
    click Delete. To edit sections of sections, choose Available Sections or Default
    Section and edit them.


    The Ch column of the table is for detecting whether the option was changed.


    Via the Boot tab, you can clear the configuration and propose a new configuration,
    start from scratch, or reconfigure the server if you have multiple Linux systems
    installed, YST can find them and modify them accordingly. To edit boot loader
    configuration files manually, click Edit Configuration Files


    NOTE


    Click Edit Configuration Files allows you to edit the menu.list file to add options
    to the boot menu.


    To limit physical access to this server, the best solution is to locate it behind
    a locked door such as in a lab room, server room, or other location. The desktop
    can always be locked well by right-clicking on the desktop, choosing Configure
    Desktop, setting the screensaver to come on after one minute, and requiring a
    password to stop the screensaver.


    # Exercise 44: Wait and Waste, LLC


    The time on a server is set by the /etc/init/d/boot clock file during boot. Once
    you have the time properly set on any server, the ntpdate utility can be used
    to set the time on any other server to that of this one.

