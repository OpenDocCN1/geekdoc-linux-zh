    # 引言


    本书的概念雏形源于 BrainShare 的多次对话。在 Novell 推广 Linux 及其相关主题的几次活动，我听到许多管理员以不同的方式问同一个问题：“我如何判断自己是否真的足够熟悉
    Linux？” 有时，“足够熟悉”意味着能够通过 CLP（认证 Linux 专业人员）或 CLE（认证 Linux 工程师）考试。但很多时候，“足够”仅仅意味着对该操作系统感到自在。


    当我建议制作一本包含案例研究的实验手册时，它受到了很好的反响，值得我在纸上写下一些想法。这些想法萌芽、发酵，最终变成了你现在手中的这本书。


    本书旨在让你从三个不同的水平测试对 Linux 的知识。如果你是 Linux 以及 Novell 目前提供的版本的新手，那么这本书可能并不适合你。本书包含了
    75 个实操性的实验练习，让你测试对 Novell Linux Desktop 9 (NLD) 和 SUSE LINUX Enterprise Server
    (SLES) 的知识和能力。


    # 本书内容


    本书分为四章。前三章建立在前章的基础上。你会看到一个案例和一些需要完成的任务，而不会提供如何完成这些任务的指导。第四章将回顾之前所有的练习，并为每个练习提供解决方案。


    第一章“Novell Linux Desktop 9”提供了 15 个使用 Novell Linux Desktop 的练习。不需要其他操作系统或软件，你只需要掌握……


    ## Novell Linux Desktop 9


    第二章“SUSE Linux Enterprise Server 9”提供了 30 个中等难度的练习。


    第三章“高级 SUSE Linux Enterprise Server 9”提供了 30 个更高难度的练习。


    第四章“解决方案”将回顾之前所有的练习，并为每个练习提供一个解决方案。


