    # Exercise 21: Fetters Hair and Such


    You have arrived at a customer''s site and have been handed a sheet of paper detailing
    what they expect from your visit. In scribbled handwriting that you recognize
    to be the owner of the company''s, you are to


    - 1. Create a directory named /personal.

    - 2. Create four subdirectories beneath /personal with the names:

    - accounts

    - employees

    - suppliers

    - other

    - 3. Delete all files in the /tmp directory.

    - 4. View the boot log and look for any problems there.


    # NOTES


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_44_0.png)


    # CHAPTER 2: SUSE LINUX Enterprise Server


    # Exercise 22: Global Moving


    You are the administrator for the local office of Global Moving. An email from
    the head of Information Technology requests that the following changes be made
    on all SLES servers:


    - 1. The default runlevel should be changed to 4.

    - 2. The ACLs on all files beneath /tmp should be set to equal those of .fonts.cache-1
    file in the /root folder.


    NOTE

    If you are not logged in to the KDE desktop as root, you will not find .fonts.cache-1
    file in the /root folder on the SLES 9 server. If you log in as another user (such
    as an admin user), you can find this file in the home folder for that user.


    TIP

    Use the setfacl utility to set ACLs on one set of files to those on another.


    TIP

    Upon rebooting (after changing the default runlevel to 4), the server doesn''t
    boot to the GUI login.


