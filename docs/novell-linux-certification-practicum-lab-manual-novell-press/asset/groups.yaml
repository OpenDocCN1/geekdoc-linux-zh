    |---|---|

    | SLES 9 Server Name | EDNA-SLES |

    | Static IP Address | 192.168.0.78, a subnet mask of 255.255.255.0, and a default
    router address of 192.168.0.1. |

    | Server Services | The server should have: Apache Samba |


    You need to create a new group—ACCOUNTS—on the server and add five users to this
    group. The users you need to create are shown in Table 2.3.


    # TABLE 2.3

    Members of ACCOUNTS Group


    | USERNAME | ATTRIBUTES | VALUE |

    |---|---|---|

    | mmneil | Michelle | /bin/bash |

    | 38c45z | |

    | ckight | Cathy Kight | /bin/ksh |

    | Ander77son | |

    | jcharney | Jane Charney | /bin/bash |

    | REClient | | |

    | nborowski | Neill Borowski | /bin/csh |

    | 3elv7e | |


    The server needs to be configured to run Apache. Samba should be installed and
