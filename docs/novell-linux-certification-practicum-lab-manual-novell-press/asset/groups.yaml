    ## 练习 67：密歇根种植者 (Michigan Growers)


    你是一名专攻网络和电信领域的顾问。你的许多客户只有在耗尽了所有内部资源并对如何进行感到毫无策后，才会寻求你的帮助。


    你受 MG 委托配置 DNS，以将所有查询限制在你网段内的主机上。你网段内的主机不应能够查询 DNS。


    # 注意事项


    ## 练习 68：明尼苏达河管理局 (Minnesota River Authority)


    明尼苏达河管理局负责向公众科普有关船只安全和捕鱼法规等问题。在由各个分机构办公室和自然资源部官员独立处理了多年后，他们正试图将其所有的工作实践转换为标准化形式。


    对于 MRA，请配置你在练习 48 中使用的 SLES 9 服务器上的 DHCP 守护进程，使其向 DNS 服务器发送动态更新（练习 49 和 67）。


    # 注意事项


    ## 练习 69：密西西比糖尿病小组 (Mississippi Diabetes Group)


    密西西比糖尿病小组按项目聘请了你为他们编写一个简单的 Shell 脚本。脚本应该询问文件名。当用户输入文件名时，脚本应验证该文件是否存在于当前目录中并且是可读的。如果文件不存在，应创建一个大小为零的文件，以便另一个程序可以无错误地运行。


    为客户创建此名为 `MDG.sh` 的脚本。


    # 注意事项


    ## 练习 70：密苏里刀刀剪公司 (Missouri Knife and Scissor)


    你最近完成了一门高级 Linux 管理课程，而你的老板正在向所有客户宣布，现在没有任何请求是不分大小之的。当你向他解释这种广告方式可能导致你的时间利用效率不是最高时，他交给你一项任务。


    密苏里刀刀剪公司有一些需要定期运行的 Shell 程：


    - ABC：需要每周一 6:05 运行。

    - BCD：需要每个月的第二天 15:10 运行。

    - CDE：需要每年 3 月 14 日和 9 月 15 日的 18:30 运行。

    - DEF：需要在每天 6:00 到 18:00 之间每 10 分钟运行一次。

    - EFG：需要在工作日每小时的 12:00 到 16:00 之间的每小时第 5 分钟运行。


    写下 MK&S 需要在适当运行这些脚本的 cron 文件条目。


    # 注意事项


    ## 练习 71：蒙特拉纳探险公司 (Montana Expeditions)


    你是一家公司的区域 IT 管理员，该公司拥有并运营着许多小型公司。所有小型公司都作为独立的实体运行，并有自己的 IT 部门。你作为一个参考点，当任何 IT
    部门遇到他们不确定如何执行的任务时，都可以向你寻求。


    蒙特拉纳探险公司邀请你前往他们的现场。一位新 IT 主监规定了若干项他希望在 SLES 9 服务器上完成的事项，以便与他旧的环境保持匹配。


    他们希望更改服务器，使得所有新创建文件的默认权限为 `-rw-rw-r--`。他们希望将 `/tmp` 目录下当前所有文件的权限更改为 `751`。最后，他们希望将
    `/etc/shadow` 文件中的密码放回 `/etc/passwd` 文件。


    # 注意事项


    ## 练习 72：北卡罗来纳游泳者 (North Carolina Swimmers)


    你被指派为现场专家，负责管理特定地理区域内的若干战略客户。你被指示要非常有技巧地对待所有客户，并让每一个客户都觉得他们是你公司服务的唯一客户。


    NCS 召集你前往总部。自从在 SLES 服务器上安装系统以来，他们一直使用 KDE 界面。然而，他们聘佣了一位新管理员来取代旧的，但他只熟悉 GNOME。


    你需要在服务器上安装 GNOME 桌面，并在管理员登录服务器时让其可用。


    # 注意事项


    ## 练习 73：北达科他纳塑料 (North Dakota Plastics)


    在完成了多年关于信息技术的本科和研究生学习后，你被北达科他纳塑料聘用。你对他们操作的简单程度感到惊讶，并对你所发现的某些事情感到困扰。


    北达科他纳塑料目前只有一台 SLES 9 服务器。由于此，他们希望你配置桌面在活动三分钟后进入屏幕保护程序，并密码解锁。


    # 注意事项


    ## 练习 74：内布拉斯加家谱 (Nebraska Genealogy)


    你是内布拉斯加家谱的管理员，这是一家专门追踪家族历史的公司。你的公司最近从 Unix 平台迁移，并严重依赖专有脚本。你被分配的任务是创建一个简单的菜单界面，提供
    ABC、BCD、CDE 和 DEF 四种选择。用户应该选择 1 到 4 之间的数字来运行其中之一，或者选择 5 退出。


    编写创建此菜单。


    # 注意事项


    ## 练习 75：内华达设计 (Nevada Design)


    你是一名程序员/管理员，被短期、临时地聘请给内华达设计。内华达设计有很多他们希望你完成的小工作，以及一个简单的请求。


    他们希望有一个短脚本，可以告诉他们 `/etc/passwd` 文件中列出了多少用户。


    编写创建此菜单的。


    # 注意事项


    ## 第 4 章：练习解答


    以下解决方案将逐步引导每个练习。这些设置在安装过程中禁用了电源管理和高级硬盘设置等功能。


    ### 练习 1：阿姆斯特 (Armstrong)


    Novell Linux 桌面提供 DVD 和 CD 格式。要开始标准安装，请选择安装。接下来是许可协议。滚动选项，你可以点击标记为“同意”或“不同意”的按钮。如果你选择了后者，安装将不再继续。在同意许可协议后，YaST
    识别自己为“安装和系统程序”，你必须选择你的语言。然后分析你的硬件，并给出单选框让你选择 GNOME 或 KDE。两者都没有预选，因此选择 KDE。


    一旦点击开始实际安装，硬盘正在准备。随后，你可以通过进度条查看每个 CD 的安装状态。在此阶段结束，基础安装通过以下自动步骤完成：


    # 注意


    在选择接受之前，你应该更改分区建议以留出未分区空间。如果没有这样做，你在练习 14 中扩展交换分区空间时会遇到困难。基本步骤如下


    - 从安装设置页面，选择分区。

    - 在下一页，选择自定义分区设置。

    - 选择自定义分区——专家专家用。

    - 高亮分区表中的 Linux 原生分区条目；然后选择删除 > 是。

    - 高亮分区表中的存储设备条目 (/dev/sda 或 /dev/sda)；然后选择创建。

    - 选择主分区；然后点击确定。


    '
