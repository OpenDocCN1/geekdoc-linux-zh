    ## Exercise 9: Indiana Industrials


    There are two ways you can check for updates and keep the system current: using
    the YaST tool or Red Carpet. We''ll look at the YaST method first.


    Start YaST and choose Software (if it is not already selected), followed by Online
    Update. This brings up the dialog box shown in Figure 4.13.


    You can choose to manually select the patches to be applied (the default) or reload
    all patches from the server. If any patches are available, they are presented
    for you to select. Otherwise, you are notified that the system is currently up-to-date,
    and you can rest easy.


    ## FIGURE 4.13

    The Online Update options.


    ![](img/63348b0c434ac3ca20f600307a6ba4fa_116_0.png)


    Novill Linux Desktop also includes the Red Carpet utility to allow you to check
    for updates and keep the system current. To start this utility within GNOME, from
    the System menu, choose Software Update. Within KDE, you choose System, Configuration,
    Red Carpet to arrive at the same location.


    A check of the system will be done, and you will be notified if there are any
    patches to download. If there are no new patches, you will be notified that the
    system is up-to-date.


