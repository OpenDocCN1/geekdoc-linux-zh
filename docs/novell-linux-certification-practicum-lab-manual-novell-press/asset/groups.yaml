    ## Exercise 69: Mississippi Diabetes Group


    The Mississippi Diabetes Group has hired you on a project basis to write a simple
    shell script for them. The script should ask for the name of a file. When the
    user enters the name of the file, the script should verify that the file exists
    within the current directory and that it is readable. If the file does not exist,
    it should be created with a zero size so that another program can then run without
    error.


    Create this script, named MDG.sh, for the customer.


    # NOTES


    ## Exercise 70: Missouri Knife and Scissor


    You have recently finished a class on advanced Linux administration, and your
    boss is announcing to all customers that no request is now too big or too small.
    As you''re explaining to him that this route of advertising might not lead to
    the most efficient use of your time, he hands you an assignment.


    The Missouri Knife and Scissor company has a number of shell routines that it
    needs to run on a regular basis:


    - ABC: needs to run every Monday at 6:05

    - BCD: needs to run on the second day of each month at 15:10

    - CDE: needs to run on March 14th and September 15th at 18:30

    - DEF: needs to run every 10 minutes between 6:00 and 18:00 every day

    - EFG: needs to run at 5 minutes past the hour on every hour between 12:00 and
    16:00 on weekdays only


    Write down the cron file entries that MK&S needs to run these scripts at their
    appropriate times.


    # NOTES


    ## Exercise 71: Montana Expeditions


    You are the regional IT administrator for a company that owns and operates a number
    of smaller companies. All of the smaller companies act as self-contained entities
    and have their own IT departments. You serve as a point of reference that any
    IT department can turn to should they encounter a task that they are uncertain
    how to perform.


    Montana Expeditions has called you to its site. A new IT director has mandated
    a number of items he wants done to the SLES 9 server so that it matches his old
    environment.


    They would like the server to be changed such that the default permissions on
    all newly created files are -rw-rw-r--. They want the permissions on all files
    currently in the /tmp directory to be changed to 751. Last, they want the passwords
    from the /etc/shadow file put back in the /etc/passwd file.


