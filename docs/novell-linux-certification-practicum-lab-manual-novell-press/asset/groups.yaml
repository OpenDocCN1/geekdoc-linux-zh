    点击“开始备份”，系统将开始读取软件包文件（这可能需要几分钟），然后将开始备份。


    要解决这个问题，请以 root 身份登录并打开 YaST，以图形化方式操作磁盘并执行创建和分区任务。选择“系统”、“分区器”，会出现一个警告。仔细注意这个警告，因为它说的意思完全正确——如果你不小心，可能会造成不可逆的损坏。


    在对警告选择“是”后，将出现图 4.20 所示的分区表。


    # 注意


    显示的实际分区表取决于你系统中正在使用的磁盘和分区。你将看到与此类似的图形，但不是此图本身。


