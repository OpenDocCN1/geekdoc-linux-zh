    ## Makeblock 入门机器人套件评


    ![](img/51c03797fb5c18679e30c47f609c6b83_81_0.png)


    # 机器人


    ## Makeblock £119.99/$205 入门机器人套件


    一个教孩子们如何构建和编程的教育机器人——这是教室的未来，还是天空网？


    我们在 LUxD 拥有一小支机器人军队和一个小型四旋旋翼器。当我们控制库比蒂诺（Cupertino）时，我们需要它们，但目前我们喜欢思考它们能帮助完成哪些任务。对于本月的
    Makeblock 入门机器人套件，任务是教育……


    最大的任务是底盘，用于履带式，或者是一个带有两个前轮的三轮“车”。我们已经开始做了坦克模型，它的结构稍微复杂一些；然而，它并没有你预想的那么先进。它可以根据技能水平以及你是否会被其他工作干扰而变化。


    ### 优点

    - 组装非常简单有趣，有许多程序可以使用，而且易于安装


    Makeblock 套件是一个相对廉价、基于 Arduino 的机器人，易于构建和编程。一切都非常简单，让孩子们参与其中，并在过程中学习一些基础的电子工作。


    ### 缺点

    - 只有两个官方版本，传感器覆盖范围不足以进行障碍赛导航


    Makeblock 套件由三个主要部分的组装模块组成：组装 Arduino 粘合、构建底盘，最后通过 Arduino IDE 进行编程。


    Makeblock 需要的组装很少，在两种模式下都整齐地位于机器人顶部。接线有点麻烦，你需要进行一些认真的组装工作以将它们固定在最终的构建中；否则，连接所有内容相当容易，特别是当你遵循简单的指令时。


    ## Makeblock 入门机器人套件

    基于 Arduino 的教育机器人


    # 评测


    ![](img/51c03797fb5c18679e30c47f609c6b83_82_0.png)


    # 技术规格


    | 控制板 | Arduino Leonardo |

    | :--- | :--- |

    | 电源 | 4 节 AA 电池 |

    | 包含传感器 | 超声波、红外（来自遥控器） |

    | 动机 | 2 个 DC 电机-25 |

    | 底盘材料 | 铝 |

    | 配置 | Arduino |


    # 同样值得考虑

    - 构建快速易用，Makeblock 是适合所有年龄段人群简单机器人技术的极佳入门套件


    > 遵循简单的指令时，连接所有内容相当容易


    编程 Makeblock 从一些非常简单的示例程序开始，这些程序可以通过 USB 线上传到 Arduino Leonardo。这在所有平台上都适用，具有最大的便利性。


    基础程序包含了随附的遥控器，允许你测试传感器。传感器检测的范围最广，因此它们可以沿着所有墙壁自由运行。然而，在示例代码中，你可以轻松让它完全发挥功能。查看示例代码，可以远离墙壁和其他障碍物。


    Makeblock 还有许多示例可以学习，其中许多足够简单，可以帮助你构建自己的程序。


    Makeblock 是教育领域最好的机器人套件之一。越来越多的机器人开始进入这个市场空间，因此竞争将非常激烈。该套件价格合理，并有一套很棒的选择，会让你们学校的
    BBC 和涡轮机竞赛看起来非常有前景。


    Little British Robot 还为 Raspberry Pi 提供了一份手册，尽管你需要手动编程 Pi 并连接机器人，而没有任何关于如何做的说明。作为超越
    Arduino 阶段的下一步，这是一个巨大的挑战，但可能会非常有回报。


    # 总结

    Makeblock 入门机器人是教师老师的极佳套件，结构简单，有许多示例代码允许人们掌握 Arduino 的基础知识。在电线和导航方式上存在一些小问题，但大多数问题都不妨碍使用。


    Zwetbach


    £25

    一个廉价的、基于教育的机器人套件，Kickstart 是英国机器人的一个小版本。这是一个非常简单但功能齐全的机器人，适用于许多教室使用。纸组件节省了大量资金，但它们可能很脆弱。


    River Seestock


    一个更先进的机器人，Makeblock 还使用超声波、红外传感器，并且功能上比构建的更易用。它是英国机器人的大哥，回到 32 位版本。


    # 更多信息

    www.makeblock.com

    www.linux.co.uk


    ## LXLE 14.04

    通过 Alt+X 访问终端，或打开 PCManFM 以减少标题栏和桌面。你可以在不同的桌面之间切换，并固定窗口以便它们显示在……


    ![](img/51c03797fb5c18679e30c47f609c6b83_83_0.png)


    # 发行版最佳：针对旧电脑

    **最低规格：**

    - CPU：Pentium III

    - 内存：512MB

    - 存储：7GB


    LXLE 更新 Ubuntu 14.04 – 这种轻量级桌面真的能维持旧电脑吗？


    ### 优点

    - 非常轻量，对所有人来说都是惊讶的轻量级桌面。如此，为了易用性牺牲了 LXDE。


    ### 缺点

    - 经验用户可能想要更少的应用软件以减少存储空间。


    基于 Lubuntu 14.04 长期支持，LXLE 用于“旧电脑”，本身与 Windows 对齐。安装过程简单直接，只需几分钟，不需要分区或任何配置。一旦进入登录屏幕，你就可以选择桌面：GNOME、Windows
    和 macOS，后者提供了最低资源的环境。虽然这些桌面仅仅是外观调整，改变位置和感觉以匹配你的，但真正的优势是它们对所有人都有用。如果你是 Windows
    的营民，你可以调整工作流以适应加速。但核心设计是 LXDE。整个东西都很整洁，由于字体、图标设计以及菜单结构。


    www.linuxuser.com


    ## LXLE 14.04

    这种轻量级发行版真的能维持旧电脑吗？


    # 新功能

    - 更新的桌面

    - 文件管理器工具

    - BitTorrent Sync

    - TLP 电源管理


    ![](img/51c03797fb5c18679e30c47f609c6b83_84_0.png)


    ### 优点

    - 更新软件和管理软件包有很多，包括主 Ubuntu 和 Ubuntu 仓库

    - 你可以在登录屏幕选择 GNOME 2、OS X、Unity 和 Netbook 桌面


    > 这个 LXLE 发行版想让你立即运行


    你可以在两个窗口之间切换，显示已打开窗口的缩略图（这是一个很好的设计，但如果可以直接选择它们而不是只选择桌面就好了）。角落的按钮可以让你左键或中键最小化所有打开的窗口以显示顶栏。你可以看到
    CPU 使用率的概览视图，它可以隐藏或弹出，以及随处可以放置的漂亮天气面板。


    壁纸是一个小按钮，允许你从窗口更改壁纸，点击它会随机更换壁纸。LXLE 提供鼠标和键盘输入、图像，仅此而已。我们的主要问题是处理你的鼠标和键盘以便让你真正抓住它们，64
    位和 32 位版本中仍然有一些错误——我们可以接受。如果你喜欢，可以加上 PCManFM（Linux 和 Ubuntu 软件）。


    LXLE 使用 LXQt 作为其主终端模拟器，而不是 Lubuntu，后者非常丰富且可更改。默认启动器是 SlLauncher，尽管它只识别应用名称——例如在有
    Claws Mail 时输入 ''email''。这是 LXLE 开始展现价值的地方——与同样运行 LXGE 的 Lubuntu 相比，“额外”的差异真正出现了。并不是它被
    LXQt 取代了，而是 LXLE 团队似乎非常清楚他们想要软件——这种筛选是完美的。


    你有软件包剪板管理器和 BitTorrent Sync 菜单栏。TLP 电源管理在终端中确实可用，这对于笔记本电脑用户非常棒；提供了 Audacity 和
    Overlay 用于视频和音频编辑；GIMP、Shotwig 和图像编辑器用于 LXLE 的基于数组的图像；这个 LXLE 发行版想让你立即运行，无需通过设置。它已经准备好了。这从尺寸上可以看出——64
    位 ISO 相当大，消耗相当的空间。


    尽管如此，LXLE 在关键之处很轻。32 位版本更轻。但在更现代的机器上使用 64 位，它确实为旧应用注入了新生命，不过，这种类型 LXGE 发行版的“即刻开始”哲学让
    LXLE 越来越受欢迎。


    Gavin Thomas


    # 总结

    它安装快、运行快，并有一系列很棒的软件。它很轻，所以越是精挑细软件的用户，就越喜欢 LXLE——而且非常漂亮。


    # 现在下载

    http://lxle.net


    '
