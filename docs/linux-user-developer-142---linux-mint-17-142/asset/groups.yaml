    ## Review Makeblock Starter Robot Kit


    ![](img/51c03797fb5c18679e30c47f609c6b83_81_0.png)


    # ROBOT


    ## Makeblock £119.99/$205 Starter Robot Kit


    An educational robot to teach kids how to build and code – is this the future
    of classrooms or Skynet?


    We have a small army of robots here at LUxD, and a small quadcopter. We''ll need
    them for when we take control of Cupertino, but for now we like to think of what
    different tasks they help with. In the case of this month''s Makeblock Starter
    Robot Kit, it''s education...


    The biggest task is the chassis, for treads, or a three-wheeled ''car'' with two
    wheels up front. We already started off with the tank, which had a slightly more
    involved construction; however, it''s not more advanced than what you''d expect.
    It could change depending on skill level and whether or not you''re distracted
    by other work.


    ### Pros

    - Very easy and fun to assemble, with plenty of programs to use, also easy to
    install


    The Makeblock kit is a relatively cheap, Arduino-powered robot that is easily
    built and programmed. Everything is fairly simple so that kids can get involved
    with it and learn some of the more basic electronics work in the process.


    ### Cons

    - Only two official versions are not really enough sensor coverage for obstacle
    course navigation


    The Makeblock kit is all assembling building blocks in three major parts: putting
    together the Arduino putty, constructing a chassis and finally programming it
    via Arduino IDE.


    The Makeblock requires little assembly and sits neatly on top of the robot in
    both modes. The wiring is a little fiddly and you will need to do some serious
    assembling keeping them tied on your final build; otherwise it''s fairly easy
    to get everything connected, especially when you follow the simple instructions.


    ## Makeblock Starter Robot Kit

    Educational Arduino-powered robot


    # REVIEW


    ![](img/51c03797fb5c18679e30c47f609c6b83_82_0.png)


    # Technical specs


    | Control board | Arduino Leonardo |

    | :--- | :--- |

    | Power | 4x AA batteries |

    | Included sensors | Ultrasonic, IR (from remote) |

    | Motors | 2x DC Motor-25 |

    | Chassis material | Aluminium |

    | Configuration | Arduino |


    # Also consider

    - Quick and easy to build, Makeblock is an excellent starter kit for simple robotics
    for people of all ages


    > It''s fairly easy to get everything connected when you follow the simple instructions


    Programming the Makeblock starts with some very easy example programs that can
    be uploaded to the Arduino Leonardo, via a USB cable. This works across all platforms,
    with maximum convenience.


    The basic programs include the bundled remote control to allow you to test the
    sensors. The sensors detect the widest range of coverage, so they work freely
    running along all walls. However, part of the example code, you can easily make
    that fully functional. Looking at the example code, turning away from walls and
    other obstacles.


    There are a lot more examples to learn from the Makeblock, and of them are simple
    enough to help you you can then build your own program.


    The Makeblock is one of the best robot kits to come for education. More and more
    robots are beginning to enter this market space, so competition will be fierce.
    This kit is nicely priced and with a great set of options that will make your
    school''s BBC and turbine competition look positively ahead.


    The Little British Robot also supplies a manual for the Raspberry Pi, although
    you''d need to program the Pi and wire up robot manually without any instructions
    on how to do it. As a next step beyond the Arduino phase, it''s quite a big but
    it can be very rewarding.


    # Summary

    The Makeblock Starter Robot is an excellent kit for teachers, with simple construction
    and plenty of example codes that allow to pick up the basics of Arduino. There
    are some minor issues with the cable and the way it navigates obstacles, but most
    of these are nothing to impede the way it''s meant to be.


    Rob Zwetbach


    £25

    An cheap, education-based robot kit, Kickstartbot is a little version of the British
    Robot Kit. It''s a quite simple, yet fully functional, robot that comes in a cardboard
    kit for a lot of classroom use. The cardboard components save a lot of money,
    but they can be flimsy.


    River SeeWoodstock


    A more advanced robot, the Makeblock also uses ultrasonic, IR sensors and works
    more functionally, and slightly more easily than what''s built. It''s the big
    brother of the Little British Robot with a way back in 132 bit.


    # More information

    www.makeblock.com

    www.linux.co.uk


    ## Review LXLE 14.04

    Access Terminal with a quick Alt+X, or open a directory into PCManFM Shade to
    reduce their title bars and reduce desktop clutter. You can switch between two
    different desktops and also pin windows so they show up on both


    ![](img/51c03797fb5c18679e30c47f609c6b83_83_0.png)


    # DISTRO Best: for old computers

    **Minimum Specs:**

    - CPU: Pentium III

    - RAM: 512MB

    - STORAGE: 7GB


    LXLE updates for Lubuntu 14.04 – can this lightweight desktop really keep an aging
    PC for two years?


    ### Pros

    - Very light, is kicking for all now and surprisingly lightweight desktop, clearly
    featured now. Having said, it''s not hard to love LXDE when it trades resource
    efficiency for usability.


    ### Cons

    - Seasoned users might want even less app-bloat to reduce the storage space.


    Based on Lubuntu 14.04 long-term support, LXLE is for ''aging PCs'', reading between
    the lines, is itself aligned with Windows. The installation process is simple
    and straightforward, taking just a few minutes and requiring no partitioning and
    not needing any configuration. Once you hit the login screen, you can choose from
    desktop: GNOME II, Windows, macOS and Networking, latter providing the most bare-bones
    environment with low resources. While these four paradigms are merely cosmetic
    adjustments, changing the positions and feel to match yours, the real advantage
    here is that they will be useful for all. If you''re a refugee from the Windows
    camp, you can change your workflow to suit and acceleration. But the core of design
    is LXDE. There''s a neatness to the whole thing that is down to the fonts and
    icon designs as much as the menu structures.


    www.linuxuser.com


    ## LXLE 14.04

    Can this lightweight distro really keep aging PC for two years?


    # New features

    - Updated desktop paradigms

    - File manager tools

    - BitTorrent Sync

    - TLP power management


    ![](img/51c03797fb5c18679e30c47f609c6b83_84_0.png)


    ### Pros

    - There are plenty of options for updating software and managing packages, including
    the main Ubuntu and Ubuntu repositories

    - You can choose between GNOME 2, OS X, Unity and Netbook desktop paradigms at
    the login screen


    > This LXLE release wants to get you and running away


    You can switch between two windows, with their thumbnails showing opened windows
    (it''s a nice touch but would be nice to select them directly, rather than just
    select the desktop). A button in the corner lets you really minimize all open
    windows to show their top bars (''shade'') with a left- or middle-click. You''ll
    see an at-glance view of CPU usage that can be hidden or popped, and a nice-looking
    weather panel placed anywhere.


    Wallpaper is a little button that allows you to change your wallpaper from the
    windows, and on-click it randomly changes the wallpaper. LXLE provides mouse and
    keyboard input, images, and just that. Our main grip is handles your mouse and
    keyboard, in order for you to really grab them, and there are still a few bugs
    in the 64-bit and 32-bit versions - which we can live with. Throw in PCManFM (in
    Linux and Ubuntu software) if you like.


    LXLE uses LXQt as its main terminal emulator, though not Lubuntu, which is quite
    plentiful and changeable. The default application launcher is SlLauncher, though
    it only picks up app names - typing ''email'' when you get Claws Mail, for example.
    This is where LXLE starts to make its mark - compared to Lubuntu, which also runs
    LXGE, the ''xtra'' differences really appear. It''s not that it has been replaced
    with LXQt, but that the LXLE team seems to have really weighed exactly what software
    it wants - and this curation is perfect.


    You have the Package clipboard manager and BitTorrent Sync menu bar. TLP power
    management is really available in your terminal, which is great for laptop users;
    Audacity and Overlay are provided for video and audio editing; GIMP, Shotwig and
    image editors for array-based images of LXLE; this LXLE release wants to get you
    up and running away, with no need to go through setup. It''s already ready. And
    it shows in the sizes - the 64-bit ISO is quite large it consumes quite a Q.


    Though, LXLE is lightweight where it counts. The 32-bit version is even lighter.
    But with the 64-bit on a more modern machine, it truly creates new life into aging
    apps, though, that''s ''to get going'' philosophy of this kind-of-LXGE distros,
    has made LXLE grow on.


    Gavin Thomas


    # Summary

    It''s quick to install, quick to run around, and has a great array of software.
    It''s light, so the more selective software users, the more LXLE will love this
