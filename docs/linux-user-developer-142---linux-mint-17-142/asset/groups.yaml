  - '[PAGE 84]


    # LXLE 14.04


    Can this lightweight distro really keep an aging PC for two years?


    # REVIEW


    # New features: Updated desktop paradigms • File manager root tools • BitTorrent
    Sync • TLP power management


    ![](img/51c03797fb5c18679e30c47f609c6b83_84_0.png)


    +   - There are plenty of options for updating software and managing packages,
    including the main Ubuntu and Ubuntu repositories


    +   - You can choose between the GNOME 2, OS X, XP, Unity and Netbook desktop
    paradigms at the login screen


    > This LXLE release wants to get you and running right away


    You can switch between two windows, with their thumbnails showing of opened windows
    (it''s a nice touch, but it would be nice to select them directly, rather than
    just select the desktop). A button in the corner lets you really minimize all
    open windows to show their top bars (''shade'') with a left- or middle-click.
    You''ll see an-at-glance view of CPU usage that can be hidden or popped, and a
    nice-looking weather panel placed anywhere.

    Wallpaper is a little button that allows you to change your wallpaper from the
    windows, and on-click it randomly changes the wallpaper. LXLE provides mouse and
    keyboard input, images, of just that. Our main grip is, in the handles for threading
    your mouse and keyboard, in order for you to really grab them, and there are still
    a few bugs in the 64-bit and 32-bit versions - which we can live with. Throw in
    PCManFM (in Linux and Ubuntu software) if you like.

    LXLE uses LXQt as its main terminal emulator, though not Lubuntu, which is quite
    plentiful and changeable. The default application launcher is SlLauncher, though
    with that that it only picks up app names - typing ''email'' when you get Claws
    Mail, for example. This is where LXLE starts to make its mark - compared to Lubuntu,
    which also runs LXGE, the ''xtra'' differences really appear. It''s not that it
    has been replaced with LXQt, but that the LXLE team seems to have really weighed
    exactly what software it wants - and this curation is perfect.

    You have the Package clipboard manager and BitTorrent Sync menu bar. TLP power
    management is really available in your terminal, which is great for laptop users;
    Audacity and Overlay are provided for video and audio editing; GIMP, Shotwig and
    image editors for array-based images of LXLE; this LXLE release wants to get you
    up and running away, with no need to go through setup. It''s already ready. And
    it shows in the sizes - the 64-bit ISO is quite large it consumes quite a Q.

    Though, LXLE is lightweight where it counts. The 32-bit version is even lighter.
    But with the 64-bit on a more modern machine, it truly creates new life into aging
    apps, though, that''s ''to get going'' philosophy of this kind-of-LXGE distros,
    has made LXLE grow on.

    Gavin Thomas


    # Summary


    It''s quick to install, quick to run around, and has a great array of software.
    It''s light, so the more selective software users, the more LXLE will love this
    - and gorgeous.


    # Download now


    http://lxle.net


