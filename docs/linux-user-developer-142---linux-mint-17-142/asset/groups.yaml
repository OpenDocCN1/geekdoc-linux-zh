    \ Ltd www.1and1.co\nwww.linuxuser.co.uk\n\n# 您的观点\n您的 Linux 新闻与观点\n联系我们...\n注册并发表您的评论...\n\
    www.linuxuser.co.uk/forum/ 直接发送邮件...\nlinuxuser@imagine-publishing.co.uk\n\n#\
    \ 您的观点\n\n# Linux 用户信\n您对杂志、Linux 和开源的意见\n\n# 红星\n你看到 Red Star OS 了吗？有人找到了朝鲜官方系统的\
    \ ISO，这是一个名为 Red Star OS 的 Linux 发行版！看起来有点疯狂、有趣，而且有些工具实际上不可用？目前可以通过 Torrent 下载\
    \ ISO，但一些人出于明显原因担心安装它。\n\n- Hywer\n是的，随后在 Linux Reddit 上出现了未知的传奇。订阅功能由于访问限制且消息经过加密。所以，即使他们尝试拨入，也没有可以接受连接的软件。如此，你可能不应该盲目安装，以防其中包含任何糟糕的惊喜。\n\
    \n# \nFiraxis 开始将一些 AAA 级大作引入 Steam 和 Linux。这是一个极好的消息；在我们看来这可能是最好的 PC 游戏之一，希望这能让其他开发者开始效仿，有这种选择是意义重大的。\n\
    \n![](img/51c03797fb5c18679e30c47f609c6b83_93_0.png)\n\n- Firaxis\nFiraxis 相信\
    \ Linux，希望其他开发者也能开始，因为这种发现的有效性可能……\n\n- Phil Cordaro\n关于 Firaxis 将游戏移植到 Linux\
    \ 的传闻已经超过一年——可能更久——最终看到它们到来真是太棒了。这看起来不仅仅是针对 Linux 的，仅仅是 Firaxis 开发的作品。希望这意味着大部分作品都会过来，备受期待的《超越地球》（Beyond\
    \ Earth）也将登陆 Linux。这是 Steam 和游戏领域一个令人兴奋的时期，我们很想看到 Steam 在年底前会有怎样的变化。\n\n# 冷焊\n\
    ![](img/51c03797fb5c18679e30c47f609c6b83_93_1.png)\n\n我一直很欣慰地关注 Raspberry Pi 项目，但焊接是我一直担心的事情之一。我还担心留下冷焊、锡焊不当或烫到自己——我不会自己动手！不过，对于实验板和简单的导线我没问题。关于焊接有什么推荐的建议吗？\n\
    \n- Pratek\n我们有几条建议，比如保持工作区域整洁并确保区域通风良好。最好使用带有良好焊头的电烙铁并使用助焊剂。\n\n"
