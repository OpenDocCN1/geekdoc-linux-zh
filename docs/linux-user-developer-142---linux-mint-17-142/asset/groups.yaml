    ![](img/51c03797fb5c18679e30c47f609c6b83_56_0.png)


    So did the idea come from - was it a personal project?

    I worked on it. I got a little bit of help from some others at Intrubate, but
    we were working as a company just exploring various interfaces and machines. It''s
    kind of how this idea - this is the first one we have a few projects that we''re
    working on, a similar bit to what we''ve covered. So I came with this dice roller
    and roll it, fully controlled. And it would be a project using something other.


    there''s another script that''s running that listens for jobs on queue, and when
    it finds one it takes a picture using the device through the GPIO pins on the
    Raspberry Pi, and then it takes the Python script, outputs the text, and then
    it runs an OpenCV program which creates basically images and then runs a Candy
    on it, then it takes the image, it takes the results of the OpenCV output, and
    sends it back to Firebase, so we can display it in real-time.


    portable, and I was able to put the camera into a fixed position so it''s always
    getting the same angle and the same shot that makes it work well. So it was really
    a tweet weekend, and then another day for final assembly and something like that.


    The dice rolls amazing - did you find that?

    I actually sold it on eBay and surprisingly it''s from Twitter - it shows a lot
    of age and wear. It''s a little dice and I used to have a bit of gear. You put
    that, and in as, as it was rolled, it got out of day, and the little platform
    works with a couple of months.


    How did you make it dance?

    It was actually pretty straightforward it was just a weekend project to build
    the hardware and the scripts are straightforward and simple as well. I also had
    to build the platform with a bunch of parts - you know, the Raspberry Pi, the
    controller and the dice spinner. It''s hard to set the camera all over, so I just
    built this little platform out of around. It makes it quite


    So did you rig some motors with the Raspberry Pi and the original mechanism working?

    I pulled out the old mechanism and it was much more reliable, it was quite so.
    I connected a motor to that little motor, a servo controller. Then, on the Raspberry
    Pi, I ran some to control everything.


    Do you have plans to make it interactable, so that people could play with the
    dice?


    We''ve had all sorts of thoughts about that, and the future is looking like creating
    some simple games people could play with Twitter. We''ve thought about different
    kinds of effect and image recognition for the number just the pins of for the
    device you could get into. There are a lot of possibilities and we''re kind of
    thinking about some of them for around it. Another option is to create a simple
    API that people can use to roll the dice from another API program or something.


    What method are you using to read the tweet feed?

    I''m using a Ruby script that I wrote. It''s a Ruby library, called Tweetstream.
