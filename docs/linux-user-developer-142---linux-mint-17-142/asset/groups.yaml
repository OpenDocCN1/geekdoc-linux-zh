    # Red Hat Enterprise Linux 7 released


    Anticipating the future and raising the bar, RHEL 7 caters for current and next-gen
    needs


    Earlier last month, Red Hat announced the public availability of Red Hat Enterprise
    Linux 7, stating that it is “redefining the enterprise operating system”. Given
    that this release is as much about next-generation IT infrastructure requirements
    as fulfilling today demands, Red Hat has undoubtedly made the right of turn. Major
    enhancements have been made and new features added to RHEL 7, following a series
    of bets that paves the way for even more power, deployability and maintainability—through
    enterprise IT, from application centers to cloud servers.


    Linux Containers have become a crucial element of source application packaging,
    providing both isolation and flexibility. Deployment marks the beginning of trend
    by enabling RHEL 7 to support system level and fully compliant operating systems,
    Docker, and other cloud environments. The Identity management system has been
    updated to provide direct and robust routes for integration with Active Directory
    environment, where there have been improvements made to NSSD and GFS, XFS. XFS
    is the new default file system, scaling up to 500TB, with 50TB for each file.


    There are also improvements made to network management, bandwidth and security
    in RHEL 7. The network management engine has been updated to include a new command-line
    network management tool (Network-CLI) that allows users to perform network tasks.
    On top of that, there is now support for IPv6 that enable even faster servers,
    dynamic firewall service (firewalld) that allows all settings to be changed during
    runtime without disconnecting connections.


    Linux features have also been added to the new release, in particular to protect


