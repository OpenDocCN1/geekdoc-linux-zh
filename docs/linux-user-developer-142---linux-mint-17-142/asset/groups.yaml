    \n## 07 X-校准\n\n从 SSH 运行 startx 让屏幕打开。从这里你可以尝试在终端输入 xinput_calibrator，或者在 SSH\
    \ 会话中输入以下内容：\n\n```bash\nFRAMEBUFFER=/dev/fb1 startx & DISPLAY=0.0 xinput_calibrator\n\
    ```\n\n## 08 保存校准\n\n完成后，你会得到一个以 InputClass 开头的输出。打开以下文件并将 Section 到 EndSection\
    \ 之间的输出复制到：\n\n```bash\n$ TSLIB_FBDEVICE=/dev/fb1 TSLIB_TSDEVICE=/dev/input/touchscreen_ts_test\n\
    ```\n\n## 05 绘制校准\n\n一旦完成校准，你可以尝试绘制测试以查看屏幕的反应。使用以下操作：\n\n## 玩玩看\n\n你的触摸屏现在设置好了！我们接下来的教程中介绍更多让它更好用的方法，但它现在已经就绪，可以加载像\
    \ PIPH 或 PiCam 等其他项目了。\n\n如果不符合你的要求，你可以再次尝试上一个步骤。\n\n"
