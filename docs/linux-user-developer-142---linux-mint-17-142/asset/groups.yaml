    There is a pretty nasty bug that stops the restoration process. The permissions
    of the sites/directory are strict for security reasons, but they prevent Drupal
    and not allow it to finish its restore. The solution is simple, but it has to
    be done before execution of the archive-backup command: change the permissions
    of sites/directory when you are installing Drupal root directory and then take
    a backup.


    ```

    $ drush 755 sites/default

    ```


    You can now restore the Drupal backup file without any other problems. Do not
    forget to fix the directory permissions of the sites/directory after taking a
    backup. To restore the database that you backed up with drush somefile.sql run
    the following command:


