    # ## How to burn an ISO


    Want to try a new distro? Here''s get to started...


    ![](img/51c03797fb5c18679e30c47f609c6b83_95_2.png)


    **STEP 1: Grab a new iso**

    Copy the ISO from our disc cover to your hard drive; go to the Disqus tab, click
    ISO and Save. Alternatively, find an ISO online download. If you''re not sure
    if you need a 32-bit or 64-bit version, go with the safer bet.


    **STEP 2: Open or install Brasero**

    Brasero is the most popular open source burning utility. If it''s not already
    installed on your distro, locate it in your repository and install it. Then, click
    the ''Burn'' button from the Projects tab on the left.


    **STEP 3: Burn your disc image**

    On the Image Burning menu, click the first box - ''click here to select a disc
    image'' - navigate to the ISO you just put on your hard drive. Once selected,
    ensure you''ve got a CD or DVD writable disc image and click ''Create'''
