    \n...which the function get_video() wraps the call to frame with sync_get_video().\
    \ Again, we can use the signal handler we defined above to let the user break\
    \ out of this infinite loop. Then we analyse all of this data - and use OpenCV\
    \ tools to do pretty serious data analysis. In order to do this, we need to do\
    \ data conversion, as the data from the Kinect is in RGB order, while OpenCV is\
    \ expecting it to be in BGR order. Now you can reproduce the display from another...\n\
    \n# Full code listing\n\n```\nimport cv2\ncv.namedWindow(\"Video\")\nwhile:\n\
    \    cv2.imshow(\"Video\", get_video())\n    if cv2.waitKey(1) == 27:\n      \
    \  break\n```\n\n...where get_video() is a function that takes care of the conversion.\
    \ We also get information from the source of the accelerometer data. With this\
    \ data, we can calculate the orientation of the Kinect to map you where the video\
    \ is located relative to the device. The function returns a set of data with the\
    \ x, y and z values of the local acceleration. With all of this data, we can start\
    \ pretty something.\n\nThere is not a lot of documentation available how to use\
    \ Python with Kinect, so it is better to poke around it to discover what you can\
    \ do. When you learn something new, be generous and share it with others, you\
    \ can improve projects - there are a lot of exciting things to discover when you\
    \ combine a Kinect with your Raspberry PI!\n\n```\n# To import the required modules\n\
    import openkinect\nimport time\nimport random\nimport signal\n\n# Some global\
    \ variables\nrunning = True\ntime = 0\n\n# This is the function that will\nrun\
    \ as the body of a loop in Kinect\n# and handle the tilt of the kinect\ndef body(ctx):\n\
    \    global last_time\n    if not running:\n        raise Exception(\"Kinect stopped\"\
    )\n    if time.time() - last_time < 3:\n        last_time = time.time()\n    \
    \    random = random.randint(0, 5)\n        ctx.set_tilt_angle(random)\n     \
    \   ctx.set_tilt_degs(dev, tilt)\n\n# We need a signal handler to let\nthe user\
    \ interrupt the loop handler\nhand by pressing Ctrl-C\n# Sets up the signal handler,\
    \ catches SIGINT\nsignal.signal(signal.SIGINT, handler)\n\n# We start the signal\
    \ handler and\nthe loop will stop when you press CTRL-C\nis calling the handler\n\
    kinect.run_loop(body)\n\n# If we want to get data and multip\nport output to multiprocess\n\
    import openkinect.py as mp\nrunning = True\n\n# To set up multiprocess\nimport\
    \ multiprocessing as mp\nmp.start_process()\n\n# Get an initial frame and set\
    \ up the signal\nhandler_img = mp.frame(kinect.sync_get_video([0]))\nsignal.signal(signal.SIGINT,\
    \ handler)\n\n# And now we loop\nwhile running:\n    image = mp.data(kinect.sync_get_video([0]))\n\
    \    mp.draw(image)\n    mp.waitforpress(0)\n```\n\nAbove Many people may not\
    \ realize that they can harness the power of the Kinect 360 with Python\n\n# Give\
    \ your robot vision\n\nOne thing that come to mind is that using a Kinect and\
    \ a Raspberry Pi is for a vision system - you can do something amazing with. But,\
    \ if you want to do even more, you can use your own operating system (ROS). We\
    \ ros.org is a project that collects sets of tools, libraries and frameworks to\
    \ provide a platform for robot development. It is built on Ubuntu the desktop\
    \ and is what is expected if you install it on your Raspberry Pi. But, then there\
    \ is a version of ROS, called ROSPi which can be installed as the OS on Pi and\
    \ then you can add an API service pointing to ROS. You can install it:\n\n```\n\
    sudo apt-get install ros-ros-com\n```\n\nAfter that, there will be some variables\
    \ to set up, which is handled by a shell script created with ROS. Then you can\
    \ start programming your robot. It isn't a complete port yet, but it is certainly\
    \ a good start to be using your Raspberry Pi-powered vision.\n\n69 www.linuxuser.com"
