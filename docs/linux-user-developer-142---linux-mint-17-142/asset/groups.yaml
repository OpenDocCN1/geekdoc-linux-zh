    # On the DVD


    Your disc


    Find out what lies in store for you on issue 142: Linux User & Developer DVD...


    **Welcome to the Linux User & Developer DVD, accompanying issue 142 and both the
    Cinnamon hottest news and libre software.** To complete the release on Linux Mint
    17, we''ve put both the Cinnamon and conservative MATE spins onto the disc for
    you to try. We''ve also included Mageia 4.1; which has fixed a number of issues
    from the previous version. For those of you looking to try something a little
    different, we have a distro you might need: You''ll also find 20 software packages,
    covering all manner of useful tools and the four browsers in this month''s super
    test.


    ![](img/51c03797fb5c18679e30c47f609c6b83_95_0.png)


    ## Distros


    Peppermint live-boots, from both Cinnamon and MATE spins of Linux Mint 17 are
    ISOs.


    ## Tutorial Files


    You''ll find all the code you need for our Go and Revel tutorial, the guide to
    controlling servos with Raspberry Pi.


    ## Software


    Here you''ll find 20 of the latest and greatest software packages, including the
    four-tested web browsers.


    ## Tutorial Archives


    De-archived of your programming pleasure, some of the greatest from past issues.


    ![](img/51c03797fb5c18679e30c47f609c6b83_95_1.png)


    ## How to burn an ISO


    Want to try a new distro? Here''s how to get started...


    ![](img/51c03797fb5c18679e30c47f609c6b83_95_2.png)


    **STEP 1: Grab a new iso**

    Copy the ISO from our disc cover to your hard drive; go to the Disqus tab, click
    ISO and Save. Alternatively, find an ISO online download. If you''re not sure
    if you need a 32-bit or 64-bit version, go with the safer bet.


    **STEP 2: Open or install Brasero**

    Brasero is the most popular open source burning utility. If it''s not already
    installed on your distro, locate it in your repository and install it. Then, click
    the ''Burn'' button from the Projects tab on the left.


    **STEP 3: Burn your disc image**

    On the Image Burning menu, click the first box - ''click here to select a disc
    image'' - navigate to the ISO you just put on your hard drive. Once selected,
    ensure you''ve got a CD or DVD writable disc image and click ''Create''.


    # On the DVD


    Welcome to the Linux User & Developer DVD


    ## Editor''s picks


    **Linux Mint 17 – Cinnamon** Each Mint is more or less the ultimate version of
    Mint, just for any point. With the maturity of the 2.x line of Cinnamon on top
    of the latest Ubuntu LTS, it''s the truly best version we have tried so far; Linux
    Mint Of Cinnamon brings to the world.


    **Kdenlive** After a long-year hiatus, the Kdenlive team is back again with the
    release of version 0.9.8. Features have been changed, added, fixed, and this version
    is currently our favourite video editor Linux.


    **Otter** Currently pushing through beta releases, Otter is a brand new browser
    that has all the hallmarks of a major player in the future. Aiming to re-create
    classic Opera with Qt, this is one to watch – we see how it did in our web browser
    super-test on page 75.


    # Complete index


    ## Operating systems


    **Linux Mint 17 – Cinnamon** Having previously a frontend on top of GNOME desktop
    before becoming a CE in its own right, this version of Linux Cinnamon has appeared
    in an LTS release.


    **Linux Mint 17 – MATE** The successor to GNOME 2, MATE is a modern update to
    the GE 2 codebase that is stable and capable of use – and now with new features.


    **Peppermint Five** Built for speed, this lightweight distro aims to keep your
    system''s performance optimal whether you''re running softwares on your desktop,
    or working with cloud-based apps.


    **Mageia 4.1** One of the LU&D team''s distros, the community-led Mageia has become
    incredibly popular. This update contains security patches and fixes an installation
    bug.


    ![](img/51c03797fb5c18679e30c47f609c6b83_96_0.png)


