    # Linux Mint 17


    # # How Linux Mint evolved


    From Ada to Qiana, we plot the path of Linux Mint’s meteoric rise in the community


    Linux Mint comes from humble origins; unlike Magenta it was no overnight sensation,
    and it took a few years for the work of ''Clement Lefeebvre'' to turn the steadily
    increasing Linux Mint into a community at large.


    First, Bethany started off as a spin of Ubuntu 6.0, a very short-lived version
    of the distro that was succeeded by 6.0, code-named Barbara. Linux Mint 6.10 became
    a foothold, establishing the conventions that would define Mint for years to come.


    # Naming convention


    Linux Mint has always been named after women, starting with Ada and carrying on
    to Qiana today.


    Ada, Barbara, Bianca, Clara, Clementine, Elaysa, Fiona, Gloria, Helena, Isidora,
    Julia, Kat, Maya, Nadia, Olivia, Petra, Qiana.


    There are nine versions in four and a half months before reaching Z, slightly
    ahead of Ubuntu.


    Linux Mint still required a lot of work, with subsequent releases over the next
    six months,


    up to the 3.0 release adding Linux Mint branding and extra software, as described
    by the release notes:


