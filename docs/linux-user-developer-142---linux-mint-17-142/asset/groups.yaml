    \ 卡死屏幕和冻结的情况下，我几乎什么都做不了。我必须强制退出并重启。Thunderbird 变得有点毫无意义，我真的什么也做不了。\n\n目前我不知道为什么。每当我打开或接收邮件时，这项工作就会困住所有人。也许它存在某些\
    \ Bug。\n\n然而，我们提到最令我们困扰的问题是，你使用的是四年前系统，没有获得适当的更新支持，如果你至少升级，就需要一些严格的内核更新。\n\n#\
    \ 常见问题解答：互操作性\n\n有什么主意吗？我尝试过安全模式下的 Thunderbird，但没有成功。我怀疑是某些日常任务的近期更新，但这只是推测。在过去的七年里它一直运行完美。\n\
    \n显然，你可能没有权限更新它——但请务必联系你的 IT 部门并告诉他们 Thunderbird 需要更新，这应该也能加速运行特别缓慢的硬件。这对你有帮助！\n\
    \n问：我从 Windows 迁移过来，Microsoft Office 能用吗？\n\n绝对可以，LinuxOffice 的文档、表格和其他文件与 Microsoft\
    \ 兼容。你可以用它们自己的文件进行保存和转换。\n\n问：我的程序和软件可以在 Linux 上运行吗？\n\n你拥有的程序在 Linux 上不会很容易运行——至少该软件可能有\
    \ Linux 版本，或者如果你必须使用该软件，可以使用 Wine 来运行 Windows 程序。\n\n问：Linux 能在网络或同一台 PC 上与 Windows\
    \ 工作吗？\n\n可以，Linux 可以通过网络与 Windows 通信，并在同一台电脑上与 Windows 双启动。这使得 Linux 成为服务器的热门选择。\n\
    \n![](img/51c03797fb5c18679e30c47f609c6b83_87_0.png)\n\nUbuntu 10.04 在一多年前已停止接收正式支持，是时候升级了\n\
    \n88 www.linuxuser.co.uk\n\n# 问题与解答\n\n解决你的所有问题\n\n# Q/A\n\n# 基础图像处理\n\n你好，用户！我今天写信是想问一个简单的问题，但我想知道我如何既能裁剪图像又能将其调整为特定尺寸。\n\
    我以前从未遇到过这种情况，所以从未真正研究过。我已经安装了 GIMP，但我检查过了——这足够完成我的需求吗？我希望你能抽空几分钟回答我的问题！\n\n裁剪图像，你有几种选择：你可以使用“裁剪\
    \ (Crop)”工具选择一个区域，然后相应地裁剪图像。如果你需要定义尺寸，底部会显示选择区域。从“图像 (Image)”菜单，你还可以缩放图像或更改画布大小；后者会影响像素看起来。\n\
    \n至于文字，“文本 (Text)”工具非常容易使用，可以让你将文字放在任何地方。如果你想把文字放在黑色边框内，你需要先写下问题。右键点击图层创建一个新的透明层。从“路径\
    \ (Path)”并点击它，然后点击“选择 (Select)”选取几个像素，然后使用“油漆桶 (Bucket Fill)”工具填充整个选择区域。\n\n#\
    \ 测量 CPU\n\n目前我在我的旧电脑（奔腾 3GHz）上配合 OpenBox 使用 Debian Wee。我希望我的 Conky 9 能显示正确的 CPU\
    \ 使用率。\n\n我的 conky 文件中这部分是：$(cpu)。当我运行 `top` 来帮助检查时，它显示出的值太高，哪一个是正确的，我该如何获得正确的使用率？谢谢！\n\
    \nRobert Peterson\n\n诚实说，对于更高级的操作，GIMP 对人们来说还是有点复杂，所以不要怪我问！画图（paint）无法轻松做到，但坦率地说，如果你需要做更多操作，这是你能得到的最好的了。它已经安装了，但如果你需要的话，打开\
    \ GIMP 就准备好了。\n\n# 自动补全\n\n我发现了一个让它像 fish 那样运行的方法，使用 GitHub。这里是：Conky 是可以自定义的。如果你有多核系统，它将显示每个核心的值。我想在\
    \ Conky 中添加一行 CPU 来显示它：\n\n```\nCPU ($cpu) cpu($cpu)\n这并不完全正确。这些值是粗略估计，测量 CPU\
    \ 并不直观——也许是这样。\n```\n![](img/51c03797fb5c18679e30c47f609c6b83_0.png)\n```\ntop\
