    # Thunderbird


    Thunderbird 17.0.5 and Firefox 20.0 have manage to check up on me after a recent
    update on Ubuntu 10.0.4. Everything is up to date that will not let me.


    There are two things that will always cause the problem: clicking anywhere on
    the Thunderbird menus and right-clicking on anything. If either of those, it will
    hang up, the screen will freeze, just will cause it to hang (Thunderbird very
    quickly) within a click or two of the window.


    Well, it sounds like it could potentially have been a recent update that screwed
    something somewhere along the line. If you are able to roll back the software
    or the kernel to a previous version, you might have a bit of luck trying to get
    it to work again.


    I can almost nothing without Thunderbird hanging the screen and freezing. I have
    to force quit and restart. Thunderbird is kind of pointless I can''t really do
    anything.


    I have no idea why at the moment. This is a work that holds everyone every time
    I open or gets received. It has some bugs ever maybe.


    However, we mention that the problem that stood but the most to us was that you''re
    four-year-old and did not get proper update support and you need some serious
    kernel updates if you upgrade the least.


    # FAQ:

    Interoperability


    Any ideas? I tried safe-mode Thunderbird with zero success. I suspect some recent
    update of mundane tasks but this is pretty speculation. It has been working perfectly
    for the last seven years.


    Obviously it''s a computer you may not have permission to get it updated - but
    be sure to approach your IT department and let them know that Thunderbird requires
    updates, it should also speed up the hardware which is particularly anxious. This
    helps you!


    Q: I''ve moved from Windows, Will Microsoft office work?


    Absolutely, the LinuxOffice has document, spreadsheet and other files compatible
    with Microsoft. You can save and convert them with their own files.


    Q: Will my programs and software work Linux?


    The programs you have won''t be easily on Linux - the very least there may be
    a Linux version of the software or if you absolutely use the software you can
    use Wine to run Windows programs.


    Q: Will linux work with Windows on a network or the same PC?


    Yes, Linux can communicate with a Windows machine through the network and dual-boot
    alongside Windows on the same computer. This makes Linux a popular choice for
    servers.


