    clips to the time or just the one you need now.


    ### 05 Add to timeline

    Drag clips to the timeline to arrange as you wish. You can drag them up and down
    to make space before or after. The highest timeline in the interface will take
    priority for video, which is important for fading and moving between clips.


    ### 06 Transitioning between clips

    place the clip you want next to the original clip. Right-click on the clip and
    select Add Transition menu — this is the full list of transition types you can
    use. Play around them as you wish; one wipe we have adding black image if you
    want to fade to black.


    ### 07 Add music

    Music can be added like any of clips, you just need to add an Audio track to the
    interface. Drag and position it like you did the video clip — if you need to edit
    the volume of either, right-click and go to Add Effect+Audio Correction and Volume.


    ### 08 Add a title

    Go to Project Add Title to create a graphic-title for your project. It can be
    text as you desire and is set by default to be — once it''s saved, it will appear
    in the timeline anywhere you want.


