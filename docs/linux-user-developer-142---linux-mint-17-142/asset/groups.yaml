    ## 开源

    ## 约翰·马斯特斯（JON MASTERS）


    ###内核专栏


    约翰·马斯特斯总结了 Linux 内核的最新动态，回顾了 3.15 发布以及即将到来的 3.16 开发周期


    一个试图解决 Viro —— 特凡的虚拟文件系统（VFS）大师的示例场景——用来阐述一个仍然存在于 3.15 中并需要在未来更新中进行补丁的问题。


    在磁盘上且不被调入内存，系统将不得不等待磁盘旋转。这并不总是如此。在现实中，情况涉及将数据留在内存并在磁盘仍在旋转时恢复它的混合状态。


    ## 3.15 新特性


    Linux 3.15 的新特性包括对“文件交叉重命名”（file cross-remming）的支持，以及在带有更快磁盘的笔记本电脑上更快的恢复交换支持。3.15
    中的交叉重命名场景提供了一种原子文件交换，允许磁盘上的两个文件以单元方式进行交换，使得整个操作作为一个单元发生，或者完全不发生。这意味着在交换文件期间，不会有任何时间会导致系统其他部分的文件处于不一致状态。


    文件系统可以使用交叉功能性来为设备提供可写存储。现有的文件系统通常使用只读文件系统配合小部分交换空间来处理可写数据。通过使用交叉重命名，其中一个文件的底层文件被用提供写访问的技术手段。


