    # Linux Mint 17


    ## 更快速、更美观且带有更强支持，Linux Mint 17 Qiana 这一 LTS（长期支持）版本是其最重要的版本之一，尽管


    见证 Linux Mint 多年来缓慢的演变是一件非常有成就感的事，它从作为 Kubuntu 分支时相对不为人知的起点，成长为如今这个华丽且稳定的发行版。它曾于
    2011 年飙升至 DistroWatch 排名单的首位，并在目前一直以更领先的优势保持着这一地位。


    面对众多满足各种口味的发行版，Linux Mint引起了社区的共鸣。随着 Linux 在更广泛的社区中兴起——政府和世界范围内日益寻求核心系统和基础设施，而向下一代传授编程技能已成为教育机构关注的重点——Linux
    Mint 对于那些渴望转向开源世界的人来说仍然是一个极吸引力的选择，特别是在 XP 进入稳定操作系统的避风港之后。


    凭借版本 17 Qiana，Linux Mint 推出了迄今为止最完整的发行版。Cinnamon 桌面环境已经成熟，虽然该发行版也提供 XFCE 和 MATE
    版本，但后端的改进确实提升了体验。MATE 通过通过许多新功能得到了改进，而该发行版也仅提供 Debian 版本。鉴于这个巨大的 LTS 版本将在未来五 年内获得安全更新，这是
    Linux Mint 团队目前最重要的发布之一。


    因此，为了纪念这一时刻，我们回顾了 Linux Mint 的存储历史，看看它已经走了多远，以及 Qiana 我们在 2019 年是否仍将在使用……


    17 www.linuxmint.co.uk


    # Linux Mint 17


    ## Linux Mint 如何演变


    从 Ada 到 Qiana，我们描绘了 Linux Mint 在社区中迅速崛升的路径


    Linux Mint 起源平凡；与 Magenta 不同，它并不是一蹴而就的成功，花费了几年的时间，“Clement Lefebvre”的工作才让稳定增长的
    Linux Mint 变成了一个广泛的社区。


    首先，Bethany 是 Ubuntu 6.0 的一个分支，这是一个寿命很短的版本，由代号为 Barbara 的 6.0 版本取代。Linux Mint 6.10
    了一个立足点，确定了未来多年 Mint 的规范。


    ## 命名规范


    Linux Mint 一直以女性命名，从 Ada 一直延续今天的 Qiana。


    Ada, Barbara, Bianca, Clara, Clementine, Elaysa, Fiona, Gloria, Helena, Isidora,
    Julia, Kat, Maya, Nadia, Olivia, Petra, Qiana。


    在四个个月内发布了九个版本到达 Z，略领先于 Ubuntu。


    Linux Mint 仍然需要大量工作，在接下来的六个月中发布的后续版本，直到 3.0 版本添加了 Linux Mint 品牌和额外软件，正如发布说明所示：


    ### 改进了视觉效果的 Linux Mint 2.1


    “Bea 带有改进的视觉效果和品牌。Ubuntu 品牌被移除，并替换为 Linux Mint 的视觉效果。我们遵循了一些用户的建议，决定在 Bea 中包含新软件，这使得从桌面可以轻松找到它们。管理无线连接的
    NetworkManager 以及用于演示文稿的 Impress 都在其中。”


    ### Linux Mint 2.2 beta：


    “Bianca 带有两个新主题：Bianca 和 Garcia，它们为发行版带来了完全全新的‘薄荷风’外观；Bianca 中添加了以下应用：mintMenu、mintConfig（一个
    GNOME 菜单控制程序）；Mint Center 应用程序。”


    ![](img/51c03797fb5c18679e30c47f609c6b83_17_0.png)


    Linux Mint 的原始版本现在几乎无法识别


    在 GNOME 和 Ubuntu 之上，Mint 品牌曾出现在 Linux Mint 的第一个重大版本中


    Cinnamon 作为默认桌面的首次亮相对于今天的 Mint 用户来说更加熟悉，但仍然有所不同。


