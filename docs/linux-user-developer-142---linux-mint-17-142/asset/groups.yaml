    \ Adafruit 板上上焊接了排针。让我们开始吧。\n\n### 01 安装软件并配置 I2C\n\n我们将从使用 'apt-get' 命令行开始。只需按顺序输入以下命令下载并安装所需的软件：\n\
    \n- 最新版树莓派：raspberrypi.com/downloads\n- 互联网连接\n- Adafruit PCA9685 控制器：adafruit.com/product/815\n\
    - 5V 电源\n- 母对母连接线\n- 一个适合你需求的舵机\n\n```bash\nsudo apt-get update\nsudo apt-get\
    \ install python3-pip python3-smbus\n```\n\n默认情况下，I2C 模块是被禁用的。要更改此设置，请编辑 /etc/config.txt\
    \ 并取消以下行的注释：\n\n```text\ndtparam=i2c_on\n```\n\n最后，重启树莓派。\n\n# 使用你的 Pi 设置并控制舵机\n\
    \n# 使用你的 Pi 设置并控制舵机\n\n## 使用你的树莓派移动机器人的部件或控制任何可以旋转的物体\n\n![](img/51c03797fb5c18679e30c47f609c6b83_64_0.png)\n\
    \n# 使用你的 Pi 设置并控制舵机\n\n## 完整代码\n\n```python\nimport Adafruit_PWM_ServoDriver\n\
