    # Set up a touch screen and interface


    03 Main event

    Find out what event the touch screen is known by with the following:


    +   * ls -1 /dev/input/touchscreen


    We can install tools to calibrate and debug the touch screen. Install and test
    them with:


    +   * sudo apt-get install tslib libts-bin

    * sudo eventtest /dev/input/touchscreen


    # Once you''ve done the calibration, you can try out a drawing test to see how
    the screen reacts


    06 Install X calibrator

    Now we need to calibrate the touch screen in X, which means installing the correct
    tools. Use the following two commands to download and install the:


    +   * wget http://adafruit-download.s3.amazonaws.com/xinput-calibrator-0.7.1-armhf


    +   * sudo dpkg -i -B xinput-calibrator-0.7.1-armhf


    Follow this up by deleting irrelevant calibration data with the:


    +   * sudo rm /etc/X11/xorg.conf.d/99-calibration.conf


    ![](img/51c03797fb5c18679e30c47f609c6b83_60_0.png)


    04 Touch calibration

    We can finally begin the calibration process. Enter the following so the Pi can
    learn roughly where the positions are on the screen:


    ```

    $ TSLIB_FBDEVICE=/dev/fbl TSLIB_TSDEVICE=/dev/input/touchscreen_ts_calibrate

    ```


    ![](img/51c03797fb5c18679e30c47f609c6b83_60_1.png)


    07 X-calibrate

    From your SSH, run startx for the screen to turn on. From here you can try to
    get xinput_calibrator typed into the terminal or type the following from the SSH
    session if it''s easier:


    ```

    FRAMEBUFFER=/dev/fbl startx & DISPLAY=0.0 xinput_calibrator

    ```


    08 Save calibration

    Having completed, you''ll get an output starting with "InputClass". Open the following
    file and copy the output from Section to EndSection into:


    ```

    $ TSLIB_FBDEVICE=/dev/fbl TSLIB_TSDEVICE=/dev/input/touchscreen_ts_test

    ```


    05 Draw calibration

    Once you''ve done the calibration, you can try out a drawing test to see how the
    screen reacts. Do does this with the following:


    Play around

    Your touch screen is now properly set! We''ll go over more ways to make it easier
    to use in the following tutorial, but it''s basically now and ready to have other
    projects, like the PIPH or PiCam, loaded onto it.


    If it''s not working to your liking, you can try the previous step again.'
- md: "\n# Tutorial Portable Pi video player\n\n# Portable Pi video player\n\n**Rob\
    \ Zwetsloot** is a systems and architect, a web developer proficient in Python,\
    \ Django and PHP. He loves to experiment with computing.\n\nNeed a better way\
    \ to watch video on the go? Let your newly powered-up touch-screen Pi play your\
    \ favourite shows\n\n![](img/51c03797fb5c18679e30c47f609c6b83_61_0.png)\n\n# What\
    \ you'll need\n\n- SD card with up-to-date version of Raspian\n- PiTFT, fully\
    \ assembled\n- Raspberry Pi with a Touch Screen\n- Power supply or an adapter\n\
    \nWe've got a Raspberry Pi that we can make portable now – but how can we use\
    \ it? The easiest thing to do with it is to use it as a portable video player.\
    \ It has a far superior battery to your phone and the added bonus of being easily\
    \ plugged into a TV or monitor. Before we can use it to play the videos, we need\
    \ to make it a bit more friendly to transport and get to play in a particular\
    \ way. We've recommended some excellent accessories and extras you can take to\
    \ achieve of this.\n\n## 01 Install VLC\n\nGo to your SSH terminal and install\
    \ VLC media player. It's a lightweight, highly recognisable media player that\
    \ is able to just play anything you throw at it. Do this with:\n\n## 02 sudo apt-get\
    \ install vlc\n\n### Default settings\n\nHere's where it gets a bit tricky, as\
    \ you'll need to perform this via the screen. Hook the Pi up to a display, mouse\
    \ and keyboard or just use the small screen. Go to play an AVI or MP4 file and\
    \ right-click on it, to go to Properties>Open... and choose Customise for the\
    \ next step.\n\n# Portable Pi video player\n\n| Sound & Video | |\n| :--- | :---\
    \ |\n| QjackCt | |\n| VLC media player | |\n| System Settings | |\n| Preferences\
    \ | |\n\nUse selected application to open files\n\n- Set selected application\
    \ as default action for\n\n![](img/51c03797fb5c18679e30c47f609c6b83_62_0.png)\n\
    \n## 03 Set the default\n\nGo to Sound & Video to select VLC from the menu. Click\
    \ the checkbox to set it as the default app and then press Enter to save the settings.\
    \ When you double-click or tap on the video, it will automatically play in VLC.\n\
    \n## 07 Get some protection\n\nThe PiTFT Box case from Pimoroni is one of the\
    \ few cases - if not the only case - the Raspberry Pi it is assembled in layers\
    \ and only works with the revision 2 Raspberry Pi (the newer one with 512MB of\
    \ RAM); this one doesn't have the pins between the yellow video port and headphones\
    \ port.\n\n# Video Settings\n\n- Enable video\n- Display\n- Fullscreen\n- Accelerated\
    \ video output\n- Always on top\n\n![](img/51c03797fb5c18679e30c47f609c6b83_62_1.png)\n\
    \n## 04 VLC options\n\nOpen VLC from the menu and right-click anywhere in the\
    \ player space to open the Context menu. From here, go to Tools and then Preferences.\
    \ Scroll down to click on 'only one instance' or go to the Video tab and click\
    \ on Fullscreen. Press Enter to save.\n\n## 08 Independently powered\n\nTo work\
    \ on the go, you'll need to have it up so that you can remove it from a tethered\
    \ power source. USB batteries are quite these days, but there are certain things\
    \ you need look out for, such as high capacity and higher amp output.\n\n## 05\
    \ Play videos\n\nYou will play videos at the size of your Raspberry Pi screen\
    \ and only player one at a time. You might have better if you convert videos to\
    \ 320x240, as it should play much larger videos than before.\n\n## 09 Next time...\n\
    \nNow you have your portable Raspberry Pi video player! Use it as you wish and\
    \ learn the ins and outs of the touch screen in process. Next we will demonstrate\
    \ how you can change the setup from watching video with your Raspberry Camera.\n\
    \n## 06 USB storage\n\nA Raspberry Pi SD card has limited space, so it makes sense\
    \ to keep your videos separate. Make sure to use storage that does not require\
    \ any extra power, use a USB stick or portable drive. Access the storage through\
    \ the File Manager, as no mounting is required.\n\n# Tutorial Set up and control\
    \ servos with your Pi\n\n# Set up and control servos with your Pi\n\n## Use your\
    \ Raspberry Pi to move parts of a robot or control anything that can rotate\n\n\
    ![](img/51c03797fb5c18679e30c47f609c6b83_63_0.png)\n\nLiam Fraser is the creator\
    \ of the RaspberryPiFTutorials YouTube series and volunteers as a Linux server\
    \ administrator for the Raspberry Pi Foundation. He is currently studying Computer\
    \ Science at the University of York.\n\n![](img/51c03797fb5c18679e30c47f609c6b83_63_1.png)\n\
    \n> By default, the servo is used to rotate the volume control right to increase\
    \ the volume, or let it decrease when left.\n\n> Extra power\n> A second power\
    \ supply is used for the servo to ensure that the Raspberry Pi has reliable power.\n\
    \nServos are similar to motors, but can only move from 0 to 60/180 degrees, rather\
    \ than rotate continuously. Unlike a motor, you can send a signal that makes it\
    \ go to a specific angle, making them ideal for applications such as moving parts\
    \ of robots, or controlling surfaces on an aircraft. That's a little complex,\
    \ but a simpler use case is using a servo to turn a potentiometer. We are going\
    \ to show some simple examples that allow a Raspberry Pi to control the volume\
    \ knob on a simple amplifier, which could be part of a larger project. Step-by-step\
    \ tutorial assumes you have already soldered the pin headers onto the Adafruit\
    \ board. Let's get started.\n\n### 01 Install software and configure I2C\n\nWe\
    \ will start off using the 'apt-get' lines. Simply enter the following commands\
    \ in order to download and install the required software:\n\n- Latest Raspberry\
    \ Pi: raspberrypi.com/downloads\n- Internet connection\n- Adafruit PCA9685 controller:\
    \ adafruit.com/product/815\n- 5V power supply\n- Female-to-female cables\n- A\
    \ servo suited to your needs\n\n```bash\nsudo apt-get update\nsudo apt-get install\
    \ python3-pip python3-smbus\n```\n\nBy default, the I2C modules are blocked. To\
    \ change this, edit /etc/config.txt and uncomment the following lines:\n\n```text\n\
    dtparam=i2c_on\n```\n\nFinally, reboot the Raspberry Pi.\n\n# Set up and control\
    \ servos with your Pi\n\n# Set up and control servos with your Pi\n\n## Use your\
    \ Raspberry Pi to move parts of a robot or control anything that can rotate\n\n\
    ![](img/51c03797fb5c18679e30c47f609c6b83_64_0.png)\n\n# Set up and control servos\
    \ with your Pi\n\n## Full code\n\n```python\nimport Adafruit_PWM_ServoDriver\n\
    import curses\nimport time\n\npwm = Adafruit_PWM_ServoDriver.PCA9685(address=04)\n\
    pwm.set_frequency(50)\n\nmin_pulse = 300\nmax_pulse = 2500\n\ndef setAngle(angle):\n\
    \    duty = (angle / 180.0) * (max_pulse - min_pulse) + min_pulse\n    pwm.set_pwm_cycle(0,\
    \ duty)\n\n# ( ( for)\n\ndef main(std):\n    stdscr = curses.initscr()\n    std.nobreak()\n\
    \    std.keypad(True)\n    curses.curs_set(False)\n    \n    stdscr.addstr(0,\
    \ 0, \"Servo Control\")\n    stdscr.addstr(1, 0, \"Up: increase angle\")\n   \
    \ stdscr.addstr(2, 0, \"Down: decrease angle\")\n    stdscr.addstr(3, 0, \"q:\
    \ quit\")\n    \n    angle = 90\n    while True:\n        key = stdscr.getch()\n\
    \        if key == curses.KEY_UP:\n            angle = min(180, angle + 5)\n \
    \       elif key == curses.KEY_DOWN:\n            angle = max(0, angle - 5)\n\
    \        elif key == ord('q'):\n            break\n        \n        setAngle(angle)\n\
    \        stdscr.addstr(4, 0, f\"Current Angle: {angle}  \")\n        stdscr.refresh()\n\
    \    \n    curses.endwin()\n\nif __name__ == \"__main__\":\n    curses.wrapper(main)\n\
    ```\n\n# 02 Wire the servo\n\nWire the servo controller to the Adafruit board\
    \ as shown in the diagram above with the Raspberry Pi. You also need to make sure\
    \ that your Raspberry Pi is oriented the correct way. The OE pin on Adafruit board\
    \ stands for Enable and should signal low. This is why we have connected it. The\
    \ VCC pin on the Adafruit board should be connected to 5V from the Raspberry Pi\
    \ and the servo power supply needs to be stable and can handle a voltage drop,\
    \ which is why a proper power supply is necessary.\n\n![](img/51c03797fb5c18679e30c47f609c6b83_64_1.png)\n\
    \n## 03 Test the connection\n\nWe will use a program called i2cdect to test the\
    \ servo. If you are using a Raspberry Pi then i2cdect will show the i2C bus of\
    \ type 1, where 1 is the I2C bus number. You can see an output similar to the\
    \ one in the image. The device should be there, if not, it's likely something\
    \ wrong.\n\n## 04 Hello World!\n\nCreate a directory where you git-clone the Adafruit\
    \ Raspberry Pi code at /home/pi. Run the following commands:\n\n```bash\ncd Adafruit-Raspberry-Pi-Python-Code\n\
    cd Adafruit_Servo_Driver\nsudo python3 Servo_Example.py\n```\n\n## 05 How to work\
    \ servos\n\nIf you are connected to the channel of the Adafruit board, it should\
    \ start moving between its min and max positions.\n\nIf you run the Servo_Example.py\
    \ code in nano, you'll see there isn't much to do. The Adafruit board does all\
    \ of the hard work and the Raspberry Pi just tells it what pulse modulation signals\
    \ to the servo. This is very hard to do on a Pi alone because there are other\
    \ things going on.\n\nIf you look at the oscilloscope trace, you can see what\
    \ the Raspberry Pi sends to the servo. The difference in the duty cycle of a signal\
    \ that is high is roughly 10 percent.\n"
  mdcn: "\n\n# 便携式 Pi 视频播放器教程\n\n# 便携式 Pi 视频播放器\n\n**Rob Zwetsloot** 是一位系统架构师，也是精通\
