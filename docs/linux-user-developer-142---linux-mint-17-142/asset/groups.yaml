    # FAQ 什么是 ARM？


    Rob Zwartloot 是一位复杂系统专家，也是一名精通 Python、Django 和 PHP 的 Web 开发人员。他热爱实验计算。


    如果你喜欢这些……可以去了解 BCM2855 中的 VideoCore，或者在树莓派网站上阅读它是如何被使用的：bit.ly/1ib8607


    延伸阅读：如果你想查阅树莓派芯片的完整文档，可以在博通（Broadcom）网站上获取：bit.ly/vl6ajlp


    # 什么是 ARM？


    为树莓派提供动力的芯片被称为 ARM 芯片。我们将解释它究竟是什么，以及它对树莓派有什么贡献。


    好吧，我从没真正想过这个问题，树莓派运行在 ARM 芯片上？确实如此，博通 BCM2835 处理了你可能见到的所有底层内容。ARM 常用于桌面级电脑和服务器，主要用于手机或嵌入式计算机等移动设备。


    好吧，但 ARM 到底是什么？ARM 是一种 CPU，那个负责所有计算和处理的东西通常被认为是计算机的“大脑”，就像老师们在学校里说的那样。


    ARM 是一种架构——这意味着还有其他类型吗？绝对有——事实上，有很多。目前最流行的是 ARM 和 x86 ——后者之前在提到 PC 时说过。


    为什么会这样？这归功于功耗。ARM 芯片更小，性能没有那么强大，但效率高得多。这使得它们非常适合手机和平板电脑。


    所以它是一种 CPU 的类型吗——这到底意味着什么？嗯，它是一种 CPU 架构，使用特定类型的指令与系统进行交互。它包含了如何处理内存的方法。


    x86、ARM 和其他架构之间的区别是什么？它们的工作方式略有不同，处理请求的方式不同，两者之间的区别在于它们的应用场景。


    为什么笔记本电脑不使用 ARM？嗯，一方面，笔记本电脑足够大可以安装更大的电池，但还有一个问题是它们的操作系统是……


    # FAQ


    ARM 处理器的低功耗使得它们在手机和平板电脑中无处不在。


    # 回到学校


    树莓派的许多故事是如何与学校联系的？


    由于笔记本电脑一直都是 x86，这将为操作系统和软件开发人员带来大量额外工作。感谢于一家大型超市每年举办的一项活动，我们获得了一些奖励。RISC 是同时运行在桌面和笔记本电脑上的系统。


    # 那么没有 ARM 版本的操作系统吗？


    有的，但它们并不常见。Linux 内核支持 ARM，这就是为什么你在树莓派上使用 Linux。Windows 也有 ARM 版本，尽管它部分基于移动操作系统。确实有一个，但它不支持树莓派。


    有趣！所以，ARM 起初作为一种真正的处理器出现，后来随着移动设备的普及变得无处不在。你从树莓派下载的也是同一种 ARM。


    # BBC Micro


    它始于英国的 BBC Micro：这是由 ARM 为 BBC 的扫盲项目制造的计算机，该项目培养了一代学生，而树莓派的共同创造者 Upton 实际上是树莓派的灵感来源。


    在过去的 15-20 年里，每个领域都经历了一些发展，但如果你在那段时间去英国上学，你使用的操作系统就像……点击一切。


    # 等等，树莓派不是一种特定的 ARM 处理器吗？


    有不同版本的 ARM 处理器。树莓派使用的是 ARM v6，而现代手机使用的是 ARM v8 和 v9。其他设备需要 ARM v7 来制作 ARM v8 兼容版本。它也像
    Ubuntu 一样是一个子集，但树莓派的发布结果很好。


    # 所以树莓派与家庭计算有联系吗？


    从某个角度来看，是的，你可以这么说。


    # Acorn 计算机


    在 BBC Micro 消失后，Acorn 继续使用 ARM 和 RISC OS 创建计算机。这些一直持续到 90 年代，当时 Acorn 分拆专门为移动和嵌入式计算机制造
    ARM 芯片。


    # 树莓派具体使用哪种芯片？


    正如我们提到的，它是博通 BCM2835；它实际上是一个系统级芯片（SoC），因此芯片上带有 GPU 和 1080p 密度的图形处理。它小巧便宜，这使其完美适合树莓派。


    # 树莓派


    嗯，有趣！我想知道我们未来将使用什么样的处理器。


    # 那不太好。x86 还有很多 —— 谁制造了 ARM？


    线索在缩写词中：ARM Machine（机器机器）。它由 Acorn Computers 公司设计用于其硬件。它在……期间的英国学校非常受欢迎。


    太棒了，当我们想要安装软件包、其他软件甚至操作系统时，情况会好一点——这绝对值得我们证明自己。


    我们最新的计算机使用了源自 Acorn Computers 和 BBC 的 ARM Micro 命名。它还有助于进一步 ARM 作为桌面处理器的发展，并使其更加开放。


    www.linuxuser.co.uk


    # 为你的树莓派添加 Python 列


    # 为你的树莓派添加视觉功能


    Joey Bernard：作为一个真正的全才，他花过时间为研究人员构建程序、进行科学计算、编写 Android 应用。


    Kinect 可以为你的树莓派提供一个非常健壮的视觉系统——而且完全通过 Python 实现！


    即使你必须在线搜索，也能找到许多可以为你的树莓派添加功能的模块。有很多模块可以让你观察周围的世界。可能不为人知的是，你可能已经可以访问 Kinect 了。你可以在树莓派和
    Xbox 上一起使用 Kinect。


    Kinect 通过普通的 USB 线缆连接。树莓派上的 USB 端口可能无法为 Kinect 供电，你需要在两个设备之间放置一个 USB 集线器（hub）。

    '
