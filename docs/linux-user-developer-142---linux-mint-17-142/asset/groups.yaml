    \n向我们发送提问，我们会尽力回答！\n\n# Thunderbird（雷鸟）\n\n在最近更新 Ubuntu 10.0.4 后，Thunderbird 17.0.5\
    \ 和 Firefox 20.0 成功完成了检查。一切都是最新的，但无法运行。\n\n有两个操作总是会导致这个问题：点击 Thunderbird 菜单的任何地方以及对任何内容点击右键。只要执行其中任何一个，它就会挂起，屏幕会冻结，导致在窗口点击一两次内就会卡死（Thunderbird\
