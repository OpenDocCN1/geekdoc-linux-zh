    \ handler)\n\n# 我们启动信号处理器，\n# 当你按下 CTRL-C 时循环将停止\n# 调用处理器\nkinect.run_loop(body)\n\
    \n# 如果我们想获取数据并将多\n# 路输出到多进程\nimport openkinect.py as mp\nrunning = True\n\n# 为了设置多进程\n\
