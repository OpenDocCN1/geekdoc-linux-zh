- md: "\n# Tutorial\n\n# Network Android apps\n\n# LinuxDeveloper\n\n## Network Android\
    \ apps\n\nIn part two of this Android series, Sam Hanna shows how to make the\
    \ most of networked applications by creating an RSS reader.\n\n### Advisor\n\n\
    **Sam Hanna** has followed the ups and downs of the mobile market since de-novo\
    \ Paint Inc. He has managed many sites, developing applications and as consultant.\n\
    \nAs mobile data started to become cheaper and faster, users began acquaint themselves\
    \ with a variety of 'always-on' applications. Services such as WhatsApp would\
    \ not have worked well in the time it was.\n\nAdding networking to development\
    \ opens new opportunities. You can create readers for feeds, communicate with\
    \ remote services and fetch data from your customer's favourite websites. Finally,\
    \ you could send data to anonymous responders, such as a tracking server in a\
    \ third-world country.\n\nWhatever you do, a set of rules must be observed in\
    \ order to keep your application chunky and smooth. Mobile data is not as reliable\
    \ as you might imagine; being board a train or experiencing the joys of intermittent\
    \ connectivity.\n\nSynchronous applications tend to lock up in such cases. This\
    \ is caused by Android's GUI stack, which for all time shares one thread for all\
    \ drawing. Fortunately, there is a large variety of workarounds ready waiting\
    \ to be used. Simply follow the instructions below to get the best result you\
    \ can without learning difficult concepts in action.\n\nThe next step is to show\
    \ how to build a small RSS reader, which can be used to download posts from a\
    \ website of your choice.\n\n### Further reading...\n\n- [www.codex.com/tutorials](http://www.codex.com/tutorials)\n\
    - [developer.android.com](http://developer.android.com)\n- [android-developers.blogspot.sk](http://android-developers.blogspot.sk)\n\
    \n![](img/51c03797fb5c18679e30c47f609c6b83_49_0.png)\n\nIn 2000, authors faced\
    \ a difficult reality needing a more direct access to the content of the internet.\
    \ Because of that, a common format formed but at that time no standards were established.\n\
    \nNow, we will limit how to implement the RSS 2.0 standard. See example Fig 01\
    \ from the official documentation - it provides a rough overview of what the results\
    \ will look like after they have been developed in your own app.\n\nWith that\
    \ out of, it is time to start working on our example application. Pick your favorite\
    \ Android IDE and try to create it. Your manifest file must use the INTERNET permission\
    \ by adding the lines from Fig 02, the XML file.\n\n```xml\n<manifest xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n  package=\"com.example.rssttool\"\
    \n  android:versionCode=\"1\"\n  android:versionName=\"1.0\">\n\n  <uses-permission\
    \ android:name=\"android.permission.INTERNET\" />\n```\n```\n\n![](img/51c03797fb5c18679e30c47f609c6b83_49_1.png)\n\
    \n### Work in the background\n\nRSS files are to be downloaded via HTTP interactions.\
    \ Interacting with them is a cumbersome process that can be accelerated by using\
    \ the HTTPConnection class. It is a staple of the java.net package, and is familiar\
    \ to a few developers who worked with Java in the fast past.\n\n# Network Android\
    \ apps\nMake the most of awaited apps by creating an RSS reader\nTUTORIAL\n\n\
    On a desktop, HTTP transactions tend to be completed within a few milliseconds.\
    \ As may surprise, we will show just how much a phone with a weak signal can work\
    \ slower than that. The synchronous nature of HTTPConnection means that any invocation\
    \ of its methods on the GUI thread will freeze the entire system.\n\nCreating\
    \ another thread solves part of the problem, the method in it leaves the GUI thread\
    \ free to handle other tasks. Android's UI thread is not thread safe - accessing\
    \ a widget from another thread leads to an exception. Even though Runnables can\
    \ be scheduled to run on threads, a more modern solution is to enhance its capabilities\
    \ by adding a new class called AsyncTask.\n\nAsyncTasks are created from a template\
    \ class. It requires a total of three parameters, which are used to pass data\
    \ into and out of the worker thread.\n\n```java\npublic class AsyncTask extends\
    \ AsyncTask<String, Integer, Integer> {\n    @Override\n    protected Integer\
    \ doInBackground(String... args) {\n        // TODO\n        return null;\n  \
    \  }\n\n    @Override\n    protected void onPostExecute(Integer result) {\n  \
    \      // TODO\n        super.onPostExecute(result);\n    }\n\n    @Override\n\
    \    protected void onProgressUpdate(Integer... values) {\n        // TODO\n \
    \       super.onProgressUpdate(values);\n    }\n}\n```\n\n- AsyncTask Worker,\
    \ Params, Result\n\nThe type passed to Params will be used for setting up the\
    \ worker. The second parameter is to be passed to progress update, while the third\
    \ one is used to communicate. In our example three functions are:\n- doInBackground\
    \ contains the actual payload, which will run on the thread spawned by AsyncTask.\n\
    - onPostExecute returns a value, which will be passed to the GUI thread, and is\
    \ ideally suited to displaying the results in your choice widget.\n\n```java\n\
    public class MainActivity extends Activity {\n    AsyncTask myTask;\n\n    @Override\n\
    \    protected void onCreate(Bundle savedInstanceState) {\n        setContentView(R.layout.activity_main);\n\
    \        myTask = new AsyncTask();\n        myTask.execute(\"http://www.android.org/files/sample-rss.xml\"\
    );\n    }\n}\n```\n\n```java\n@Override\nprotected Integer doInBackground(String...\
    \ args) {\n    HttpConnection urlConnection=null;\n    URL url = new URL(args[0]);\n\
    \    try {\n        urlConnection = (HttpConnection) url.openConnection();\n \
