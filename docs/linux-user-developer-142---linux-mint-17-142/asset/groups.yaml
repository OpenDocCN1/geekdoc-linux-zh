    # # Simplify your project planning with LibrePlan


    ### Advisor

    Nish Tyler is a software developer by profession and an open source enthusiast
    by heart. He helps learning open source management setting up and use open source
    software for their business needs


    ## Harness the power of LibrePlan to manage project timelines, resources, costs,
    time tracking and much more


    Planning is one of the most important parts of accomplishing something. Whether
    it is following a diet, building a new house or creating new software; success
    depends on how well you plan, or you are planning to fail! Of course successful
    execution of the plan matters as well, but we''ll get to that later.


    Project management tool that not only helps you plan your project but also allows
    you to manage resources, time and cost. There are lot of other interesting features
    which we walk through one by one.


    With planning in focus, today we are going to introduce you to LibrePlan. It is
    an open source. You can follow the resource links to download and install LibrePlan,
    or explore the online demo at libreplan.org. Let''s get going!


    # Resources

    libreplan.com/download/

    www.libreplan.org/INSTALL


    # # Simplify your project planning with LibrePlan

    ## Harness the power of LibrePlan to manage your projects


    # TUTORIAL


    ![](img/51c03797fb5c18679e30c47f609c6b83_36_0.png)


    ## 01 Add a project

    Adding a project is quite simple - go to the Planning tab and click on the plus
    button on the left of the sub-menu. This opens a pop-up window where you fill
    in the details such as name, starting date, customer, and more. Click ''Add''
    to go to the Project Details page.


    LibrePlan not only helps you plan your project but also allows you to manage resources,
    time and cost.


    | Name | Template |

    |---|---|

    | Demo Project | |

    | Starting date | Jun 14, 2014 |

    | Deadline | Jul 14, 2014 |

    | Customer | |

    | Calendar | |


    ![](img/51c03797fb5c18679e30c47f609c6b83_36_1.png)


    ## 02 Project Details

    The Project Details page enables you to fill in further information specific to
    the project. One of the most important is WBS - this allows you to divide the
    project into smaller tasks. You can add task dependencies, resources and costs
    - you just have to fill in a new task name and click on Add. You can then edit
    the further details for the task by clicking Edit.


    ## 03 Add resource

    LibrePlan can be a human or a machine. To add a resource, click on the Resources
    drop-down. This shows a list of all the available resources to project. Click
    the plus button at the bottom to create the resource. After you click Create,
    you need to fill in the details about the resource. Note that resources can be
    linked to multiple projects.


    To summarise the facts: General Data has info about customers, deadlines, status,
    etc., and priority for different tasks (this is not required); Progress allows
    you to add progress measurement mechanism; Requirement allows you to add criteria
    such as location, skills, etc., to the members.


    www.libreplan.org


    | Name | Start | End |

    |---|---|---|

    | Requirement Analysis | 6/11/24 | 6/12/24 |


    ![](img/51c03797fb5c18679e30c47f609c6b83_37_0.png)


    ## 04 Resource allocation and load management

    After adding the tasks to your project, click on the Project Details page. You
    can view the Gantt chart of all the tasks here. Note: click on the horizontal
    bar to view the Resource allocation and link it to the tasks. Note that resource
    allocation can be done as specific (you define the resource) or generic (algorithm
    with load and constraints mentioned in the title). After allocation is complete,
    you can see the project-specific load charts in the same page. This is how human
    resources can be properly managed. You want the load to be perfect – not more,
    not less, as that is said to be important. So, in addition to project-specific
    load, there is a dedicated Resources load window. Just click on the Resources
    load button on the extreme left to see the height on all the resource information.


    ## 05 Timesheets

    Timesheets can be found under the Cost drop-down menu. Each resource has a personal
    timesheet, which needs to be filled in pre-assigned tasks. In addition to assigned
    tasks, users can themselves add and measure hours. By filling the tasks, the corresponding
    project gets automatically updated. For example, we added the task with the budget
    allocated 50 GBP. Now as for the task ''Requirement Analysis'', the hour cost
    in the Cost tab of Project Details shows you can see the red bar showing budget
    overrun.


    ## 06 Expenses

    Costs incurred other than human resources can be tracked using expenses. Go to
    the Cost drop-down and select link expense to a task. You can then add an expense
    to the sheets that relates to the project. Just add the task name and other of
    them. As with the human resources, this cost also shows up in the respect project
    cost sheet. You want the load to be perfect – not more, not less. As a result,
    tracking becomes even more important.


    ![](img/51c03797fb5c18679e30c47f609c6b83_37_2.png)


    www.linuxuser.com * All rights reserved.


    ## 07 Project dashboard

    As you are done with the basic setup, now dive into the intricacies of the project
    dashboard. Located on the left vertical part of the page, the Dashboard link connects
    you to the project details. The dashboard shows the project in four parts: Progress,
    Cost, Resources and Time. The Progress block shows project progress, the Cost
    tab shows the project resource utilization while the Time tab displays the delays
    violations along covered. The Resources tab covers the project management features
    of LibrePlan, which has a look-alike to its other sections.


    Under Main Settings, the next link is User Accounts, where you can add and assign
    roles to users. The third link, Profiles, enables you to create company-specific
    profiles (analogous to organizations) which are collected in LibrePlan. If you
    have a customer or contractor who uses LibrePlan, you need to add them.


    ## 08 Configurations

    Configuration has four items; the first one is Main Settings, which lets you add
    the basic details like the company logo and so on. You can also configure with
    your company LibrePlan allows seamless interactions. If you have a customer or
    contractor who uses LibrePlan, this feature means you can use shared outputs.
    The fourth link shows project measurements of an outsourced task for a new end
    date for an outsourced task or work. To provide feedback to this, you need to
    provide the type of interaction supported depends on if or not the company is
    the client or subcontractor. The data exchange is based on REST web services via
    XML. So, if there are connectivity issues you can catch using manual XML files.


    ![](img/51c03797fb5c18679e30c47f609c6b83_38_0.png)

