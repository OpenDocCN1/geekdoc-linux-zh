    # # Run Drupal sites with Drush


    Administer a Drupal site from the command line


    # TUTORIAL


    # ## 02 Basic usage


    If you run Drupal without any command-line parameters, you are going to get over
    150 lines of help text! As you can understand, Drush is pretty powerful and supports
    many commands. The good thing is that the output is grouped by category, which
    will make your life easier.


    When you experiment with a command, you should always try the command with the
    --help flag that provides you messages, including internal notes.


    ```

    ```

    dush [command] ```

    ```


    # ## 03 Install Drupal


    Installing Drupal using Drush is as easy as executing the command:


    ```

    ```

    drush download --project-name=drupal-site ```

    ```


    What command does this do? It downloads the latest version of Drupal and also
    creates a database during its installation process. In this case, all files are
    placed inside a directory called drupal-site. To complete the installation, you
    will need to provide Drush with database-related information:


    ```

    ```

    drush site-install --db-type=mysql --db-user=root --db-host=localhost --site-name="Drupal"
    ```

    ```


    The aforementioned commands allow you to install Drupal with a MySQL database
    named dUser and localhost password. If there is an error, Drush will display the
    error message:


    If you have a configured server, you can now browse your new Drupal site:


    ```

    ```

    drush url ```

    ```


    # ## 04 The core-status


    The core-status command may be very useful after installation, since it presents
    a general overview of your Drupal installation:


    If you par a parameter after the core-status command, you will get all lines that
    match that particular parameter. If you are interested in only specific modules
    or themes you have installed, you can execute the command as follows:


    ```

    ```

    drush -r /home/metsouk/LUD/install core-status ```

    ```


    # ## 05 Find help about commands


    Before continuing with other commands, it is useful to know how to find help about
    a Drush command. If you want to find more information about the updateddb command,
    use:


    ```

    ```

    drush help updateddb ```

    ```


    Apply any database updates (with the --update flag) and list all aliases:


    Almost all Drush commands have aliases that are shorter than the full command.
    During your work, using the full command will make your life easier:


    # ## 06 Management user


    When you may recall that after the installation of Drupal, Drush creates an admin
    user with a random password. If you want to change the password of the admin user
    or create another user. Creating a new user called last is done using the following
    command:


    ```

    ```

    drush user-create --name="test" --user-email=user@example.com --password="password"
    lastuser ```

    ```


    # ## 07 Dealing with Drupal variables


    You can get a list of all Drupal variables by simply running the short command:


    ```

    ```

    drush variable-get ```

    ```


    Changing the password of the admin user can be done using the following command:


    ```

    ```

    drush user-password --password=Password admin ```

    ```


    You can also block a user with the following:


    ```

    ```

    drush user-block lastuser1123 ```

    ```


    To block a user, simply:


    ```

    ```

    drush user-block lastuser1123 ```

    ```


    Finally, you can completely delete a user using the following command:


    ```

    ```

    drush user-remove lastuser1123 ```

    ```'
