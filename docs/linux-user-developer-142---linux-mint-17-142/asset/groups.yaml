    # 光盘内内容


    您的光盘


    探索第 142 期 Linux User & Developer DVD 为您带来的精彩内容……


    **欢迎阅读 Linux User & Developer DVD，本光盘随附第 142 期杂志，涵盖了 Cinnamon 的热点新闻和自由软件。** 为了完成
    Linux Mint 17 的发布，我们将 Cinnamon 和保守的 MATE 版本都放入了光盘中供您尝试。我们还包含了 Mageia 4.1；它修复了从上一个版本来的许多问题。对于那些想要尝试一些不同事的读者，我们提供了一个您可能需要的发行版：您还会在其中找到
    20 个软件软件包，涵盖了各种实用的工具以及本月超级测试中选出的四种浏览器。


    ![](img/51c03797fb5c18679e30c47f609c6b83_95_0.png)


    ## 发行版


    Peppermint 支持现场启动，来自 Linux Mint 17 的 Cinnamon 和 MATE 版本均为 ISO 镜像。


    ## 教程文件


    您将找到我们 Go 和 Revel 教程所需的所有代码，该教程介绍了如何使用树莓派控制舵机。


    ## 软件


    在这里您将找到 20 个最新且最强大的软件包，包括经过四项测试的网络浏览器。


    ## 教程存档


    您的编程乐趣存档汇集，包含了往期杂志中的一些精彩内容。


    ![](img/51c03797fb5c18679e30c47f609c6b83_95_1.png)


    ## 如何刻录 ISO


    想尝试新的发行版？这里是入门方法……


    ![](img/51c03797fb5c18679e30c47f609c6b83_95_2.png)


    **第 1 步：获取新 iso**

    将光盘封面的 ISO 复制到您的硬盘；进入 Disqus 标签页，点击 ISO 并保存。或者，在网上下载一个 ISO。如果您不确定需要 32 位还是 64
    位版本，请选择更稳妥的选择。


    **第 2 步：打开或安装 Brasero**

    Brasero 是最流行的开源刻录工具。如果您的发行版尚未安装，请在存储库中查找并安装它。然后，点击左侧“项目”标签页上的“刻录”按钮。


    **第 3 步：刻录您的磁盘镜像**

    在“刻录镜像”菜单中，点击第一个框——“点击此处选择磁盘镜像”——导航到您刚刚放入硬盘的 ISO。选择完成后，请确保您有一张可写的 CD 或 DVD 磁盘镜像，并点击“创建”。


    # 光盘内内容


    欢迎阅读 Linux User & Developer DVD


    ## 编辑推荐


    **Linux Mint 17 – Cinnamon** 每一个 Mint 版本在某种程度上都是 Mint 的终极版本，适用于任何特定点。随着在最新的 Ubuntu
    LTS 之上运行的 Cinnamon 2.x 系列趋于成熟，它是我们目前为止尝试过的真正最佳版本；Linux Mint Cinnamon 版本带给世界。


    **Kdenlive** 在经历了长时间的停滞后，Kdenlive 团队带着 0.9.8 版本再次回归。功能已经经过了更改、添加和修复，这个版本目前是我们最喜欢的
    Linux 视频编辑器。


    **Otter** 目前正处于 Beta 发布阶段，Otter 是一款全新的浏览器，具备了未来主流竞争者的所有特征。它的目标是用 Qt 重新创建经典的 Opera，这是一个值得关注的——我们将在第
    75 页的网络浏览器超级测试中它的表现。


    # 完整索引


    ## 操作系统


    **Linux Mint 17 – Cinnamon** 该版本的 Linux Cinnamon 在成为独立的社区发行版（CE）之前，曾是 GNOME 桌面面的前端，现在它出现在了一个
    LTS 版本中。


    **Linux Mint 17 – MATE** MATE 是 GNOME 2 的继任者，是对 GE 2 代码库的现代更新，稳定且可用——而且现在拥有了新功能。


    **Peppermint Five** 为速度而生，这个轻量级发行版旨在无论您是在桌面上运行软件还是使用云端应用程序，都能让系统性能处于最佳状态。


    **Mageia 4.1** LU&D 团队发行版之一，由社区领导的 Mageia 已变得非常受欢迎。此更新包含了安全补丁并修复了一个安装漏洞。


