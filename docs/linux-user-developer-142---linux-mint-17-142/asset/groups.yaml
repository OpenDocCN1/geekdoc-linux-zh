    \n![](img/51c03797fb5c18679e30c47f609c6b83_61_0.png)\n\n# 你需要的物品\n\n- 带有最新版本 Raspian\
    \ 的 SD 卡\n- 已组装好的 PiTFT\n- 带有触摸屏的树莓派\n- 电源或适配器\n\n我们现在有一台可以做成便携式的树莓派 —— 但我们如何使用它呢？最简单的方法是把它当作便携式视频播放器。它的电池性能比你的手机好得多，而且额外的优点是可以轻松连接到电视机或显示器。在用它播放视频之前，我们需要让它更易于携带，并以特定的方式进行播放。我们推荐了一些优秀的配件和额外物品来帮助你实现这一目标。\n\
    \n## 01 安装 VLC\n\n进入你的 SSH 终端安装 VLC 媒体播放器。它是一个轻量级、识别度高的媒体播放器，能够播放你给它的任何内容。执行以下命令：\n\
    \n## 02 sudo apt-get install vlc\n\n### 默认设置\n\n这里变得有点复杂，因为你需要通过屏幕进行此操作。将 Pi 连接到显示器、鼠标和键盘，或者直接使用小屏幕。去播放一个\
    \ AVI 或 MP4 文件并右键点击它，进入 “属性 > 打开...” 并在下一步中选择“自定义”。\n\n# 便携式 Pi 视频播放器\n\n| 音频与视频\
