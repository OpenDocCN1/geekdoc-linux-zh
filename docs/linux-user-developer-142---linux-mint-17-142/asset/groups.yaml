  - "[PAGE 63]\n\n# Tutorial Set up and control servos with your Pi\n\n# # Set up\
    \ and control servos with your Pi\n\n## Use your Raspberry Pi to move parts of\
    \ a robot or control anything that can rotate\n\n![](img/51c03797fb5c18679e30c47f609c6b83_63_0.png)\n\
    \nLiam Fraser\nis the creator of the RaspberryPiFTutorials YouTube series and\
    \ volunteers as a Linux server administrator for the Raspberry Pi Foundation.\
    \ He is currently studying Computer Science at the University of York.\n\n![](img/51c03797fb5c18679e30c47f609c6b83_63_1.png)\n\
    \n> \nBy default, the servo is used to rotate\nthe volume control right to increase\
    \ the\nvolume, or let it decrease when\n\n> > Extra power\nA second power supply\
    \ is used for the servo to ensure that the Raspberry Pi has reliable\n\nServos\
    \ are similar to motors, but can only move from 0 to 60/180 degrees, rather than\
    \ rotate continuously. Unlike a motor, you can send a signal that makes it go\
    \ to a specific angle, making them ideal for applications such as moving parts\
    \ of robots, or controlling surfaces on an aircraft. That's a little complex,\
    \ but a simpler use case is using a servo to turn an potentiometer. We are going\
    \ to show some simple examples that allow a Raspberry Pi to control the volume\
    \ knob on a simple amplifier, which could be part of a larger project. Step-by-step\
    \ tutorial assumes you have already soldered the pin headers onto the Adafruit\
    \ board. Let's get started.\n\n01 Install software and configure I2C\nWe will\
    \ start off using the 'apt-get' lines. Simply enter the following commands in\
    \ order to download and install the required software:\n\n+   - Latest Raspberry\
    \ Pi\nraspberrypi.com/downloads\n- Internet connection\n- Adafruit PCA9685 controller\n\
    adafruit.com/product/815\n- 5V power supply\n- Female-to-female cables\n- A servo\
    \ suited to your needs\n\n```\nsudo apt-get update\nsudo apt-get install python-i2c-tools\n\
    git clone https://github.com/adafruit/adafruit-listconf\nRaspberryPi-Python-Code\n\
    ```\n\nBy default, the I2C modules are blocked. To change this, edit /etc/config.txt\
    \ and uncomment the following lines by adding a # in front of each them:\n\n```\n\
    # dt_param=bcm2708\n# blacklist spi3-bcm2708\n# i2c-dev\n```\n\nFinally, run sudo\
    \ poweroff to shut down the Raspberry Pi.\n\n64 www.linuxuser.com"
  - "[PAGE 64]\n\n# # Set up and control servos with your Pi\n\n# ## Full code listing\n\
    \n![](img/51c03797fb5c18679e30c47f609c6b83_64_0.png)\n\n# Set up curses for arrow\
    \ input\n\n```\n```python\nfrom Adafruit_PWM_Servo_Driver import PWM\n\n# Initialise\
    \ the PWM device using the default address\npwm = PWM(0x40, debug=False)\n\nservoMin\
    \ = 150 # Pulse length out of 4096\nmaxDegree = 60 # Max pulse length your servo\
    \ can rotate\ndegreeIncrease = 2 # Number of degrees to increase each time\n\n\
    pwm.set_pwmfreq(60) # Set PWM frequency to 60Hz\n\ndef setDegree(self, d):\n \
    \   degree=servoMin\n    degree+=(int(servoMin) / maxDegree) * d\n    npwm.set_pwm(0,\
    \ degree)\n\nscr = curses.initscr()\nscr.curs_break(1,0)\nscr.keypad(True)\nscr.addstr(0,\
    \ \"Servo Volume Content\")\nscr.addstr(1, \"UP to increase value\")\nscr.addstr(2,\
    \ \"DOWN to decrease value\")\nscr.addstr(3, \"q to quit\")\n\nscr.refresh()\n\
    ```\n```\n\n# ## 02 Wire the servo controller\n\nWire the servo controller, as\
    \ shown in the diagram above with enough power as is possible when joining your\
    \ Raspberry Pi. You also need to make sure that your Raspberry Pi is oriented\
    \ the correct way. The OE pin on the Adafruit board stands for Enable and should\
    \ signal is low. This is why we have connected it. The VCC pin on the Adafruit\
    \ board should be connected to 3.9 from the Raspberry Pi and the servo power supply\
    \ needs to be stable and can handle a voltage drop, which is why a proper power\
    \ supply is necessary.\n\n![](img/51c03797fb5c18679e30c47f609c6b83_64_1.png)\n\
    \n# ## 03 Test the connection to the servo\n\nWe will use a program called i2cdect\
    \ to test the servo-controller. If you are using a Raspberry Pi then the i2cdect\
    \ will show the i2C bus is of type 1, where 1 is the I2C bus number. You can see\
    \ an output similar to the one in the image. The other i2cdect bus and not, if\
    \ not, it's likely something wrong.\n\n# ## 04 Hello World!\n\nCreate a directory\
    \ where you git-clone the Adafruit Raspberry Pi code at /home/pi. Run the following\
    \ commands:\n\n```\n```bash\ncd Adafruit-Raspberry-Pi-Python-Code\ncd Adafruit_Servo_Driver\n\
    snsudo python3 Servo_Example.py\n```\n```\n\n# ## 05 How to work servos\n\nIf\
    \ you are connected to the channel of the Adafruit board, it should start moving\
    \ between its min and max positions.\n\nIf you run the Servo_Example.py code in\
    \ nano, you'll see there isn't much to do. The Adafruit board does all of the\
    \ hard work and the Raspberry Pi just tells it what pulse width modulation signals\
    \ to the servo. This is very hard to do on a Pi alone because there are other\
    \ things going on.\n\nIf you look at the oscilloscope trace, you can see what\
    \ the Raspberry Pi sends to the servo. The difference in the duty cycle of a signal\
    \ that is high is roughly 10 per.\n\n# ## 06 Run the code\n\nPlace the code in\
    \ the same directory as the Adafruit example and run it with python Servo_VolumeControl.py.\
    \ The servo should rotate to the right when you press the up arrow and to the\
    \ left when you press the down arrow.\n\n65.linux.co.uk"
