- md: "\n# Tutorial Set up the PiTFT touch screen\n\nRob Zwetsloot is complex systems\
    \ and is a web developer proficient in Python, Django, JavaScript, and HTML. He\
    \ loves to experiment with computing.\n\nThis simple little touch screen takes\
    \ a bit more than just plugging it in, as we show in the first of our hand-held\
    \ Raspberry Pi video player tutorials:\n\n![](img/51c03797fb5c18679e30c47f609c6b83_57_0.png)\n\
    \n## What you'll need\n\n- SD card with up-to-date version of Raspberry Pi\n-\
    \ PiTFT, fully assembled\n- bitly/jHEJTA \n\nWe like to talk about how portable\
    \ the Raspberry Pi is, but one of the minor issues associated with this portability\
    \ is the lack of a display. Carrying around via SSH requires some interesting\
    \ tricks to get right. The PiTFT removes all these issues by requiring nothing\
    \ and being the size of the Raspberry Pi itself.\n\nWhile Adafruit supplies a\
    \ preconfigured Raspberry image for the screen, you'll need to add some extra\
    \ to get it working on your current install, which is exactly what we are going\
    \ to cover in this tutorial.\n\n## 01 Adfruit kernel files\n\nThe first thing\
    \ we need to do is download and install the necessary kernel files. Open a terminal\
    \ or SSH in and do the following:\n\n```bash\n- sudo wget http://adafruit-download.s3.amazonaws.com/raspberrypi-bin-adafruit.deb\n\
    - sudo wget http://adafruit-download.s3.amazonaws.com/raspberrypi-de-adafruit.deb\n\
    - sudo wget http://adafruit-download.s3.amazonaws.com/raspberrypi-doc-adafruit.deb\n\
    - sudo wget http://adafruit-download.s3.amazonaws.com/raspberrypi-0-adafruit.deb\n\
    - sudo dpkg -i *.deb\nraspberrypi-bootloader-112613.deb\n```\n\n## Set up the\
    \ PiTFT touch screen\n\n![](img/51c03797fb5c18679e30c47f609c6b83_58_0.png)\n\n\
    ```text\nFile Edit Help Search Help\nECDSA fingerprint is sha256:de61:83:f4:ba:32:2c:1d:19:32:c8\n\
    Raspberry Pi connecting (ECDSA) to\nWarning: Permanently added '172.25.2.10 (ECDSA)'\
    \ to the list of known hosts.\n172.25.2.10 (ECDSA) 'ECDSA'\nlinux raspberrypi\
    \ 5.19.34#1 PREEMPT Fri Mar 28 20:10:54 2024\n\nThe programs included with the\
    \ Debian GNU Linux system are free to use, redistribute and copy them.\ndistributions\
    \ of each package are described in the\nIndividual Files are in /usr/copyright.\n\
    \nThis software is free to the extent permitted by applicable law.\ncast light-info\
    \ http://www.raspberrypi.org/2.113\n$ wget -O - - http://download.s3.amazonaws.com/raspberrypi-bitn-afrafruit-bit-deb\n\
    https://download.s3.amazonaws.com/raspberrypi-bit-afrafruit-bit-deb\n$ ssh pi@172.25.2.10\n\
    \nConnecting to 172.25.2.10 [172.25.2.10]:22 ... \nHTTP request received, 200\
    \ OK\nHTTP/1.1 200 OK\nContent-Length: 1884\nContent-Type: text/html; charset=UTF-8\n\
    Server: AmazonS3\nDate: Wed, 27 Mar 2024 12:00:00 GMT\nURL: https://download.s3.amazonaws.com/raspberrypi-bit-afrafruit-bit-deb\n\
    saving to: /raspberrypi-bit-afrafruit-bit-deb\n\n2014-07-27 14:41:14 [0s] -- 'raspberrypi-bit-afrafruit-bit-deb'\
    \ saved [18848] 333K/s in 0.5s\n```\n\n## 02 Attach the screen\n\nIf you're using\
    \ Raspberry Pi from an image from September 2013, use one of the accelerated framework\
    \ following:\n\n```bash\n$ sudo cp /usr/share/x11/xorg.conf.d/99-fb.conf\n```\n\
    \nAfter that's done, connect the Raspberry Pi and plug the screen into the GPIO\
    \ pins if you haven't already do so.\n\n## 03 Install the driver\n\nWe can do\
    \ this to make sure that the screens work at this point. But not on the screen\
    \ it isn't working:\n\n```bash\n$ sudo modprobe bcm2708\n$ sudo modprobe touchft_device-name=adafruit-rotate=90\n\
    $ export FRAMEBUFFER=/dev/fb1\n$ startx\n```\n\n## 05 Configuration file\n\nWe\
    \ need to create/ the necessary configuration file so that the screen can turn\
    \ on properly. The first line opens the config, while the second line needs to\
    \ be added to this:\n\n```bash\n$ sudo nano /etc/modprobe.d/adafruit\noptions\
    \ touchft_device-name=adafruit-rotate=90\n```\n\n## 06 The Options\n\nYou may\
    \ notice the specific wording using these options: rotate allow you to have it\
    \ at 0, 90, 180 or 270 degrees. A frequency of 60hz may give you about 20fps on\
    \ screen; if the screen is laying up, Reboot the Pi.\n\n## 07 Install touch\n\n\
    Once we're back, we need to create a new config file as follows:\n\n```bash\n\
    $ sudo nano /etc/X11/xorg.conf.d/99-calibration.conf\nSection \"InputClass\"\n\
    Identifier MatchProduct \"\"\nOption \"Calibration\"\nOption \"SwapAxes\"\n```\n\
    \n## 04 Add modules\n\nThere are two modules we need to auto-load at boot time,\
    \ Open the modules file with the first command and add the second lines to the\
    \ list:\n\n```bash\n$ sudo nano /etc/modules\nspi-bcm2708 touchft_device\n```\n\
    \n## 08 Testing touch\n\nOnce that's all done start with X: you can make it so\
    \ by adding the following to profile:\n\n```bash\n$ export FRAMEBUFFER=/dev/fb1\n\
    ```\n\nYou can also use raspi-config to have the display for your portable video\
    \ player.\n\n![](img/51c03797fb5c18679e30c47f609c6b83_58_1.png)\n![](img/51c03797fb5c18679e30c47f609c6b83_58_2.png)\n\
    \n# Tutorial Set up a touch screen and interface\n\nRob Zwetsloot is complex systems\
    \ and is a web developer proficient in Python, Django and PHP. He loves to experiment\
    \ with computing. Calibrate your new touch screen and add a small interface using\
    \ some Python code.\n\n![](img/51c03797fb5c18679e30c47f609c6b83_59_0.png)\n\n\
    ## What'll need\n\n- SD card with up-to-date version of Raspberry Pi\n- PiTFT,\
    \ fully assembled\n- bitly/nej\n\n## 01 New rules\n\nTo make things easier for\
    \ ourselves we're going to create a little rule so that we don't lose track of\
    \ what the touch screen is called in the command line. SSH in, run the next command\
    \ and copy the following text into it:\n\nWe've got a screen with basic touch\
    \ functionality but where do we go from there? Our first step is to actually make\
    \ the touch usable; resistant-style, so you can use your finger or stylus with\
    \ it, and this will affect the calibration we get from it. Don't worry — if you\
    \ calibrate with one method, you can always go back and recalibrate with another.\n\
    \n```bash\n$ sudo nano /etc/udev/rules.d/95-touch.rules\nSUBSYSTEM=\"input\",\
    \ ATTRS(name)=\"touch-ts\", ENV(name)=\"event\", SYM=\"touchscreen\"\n```\n\n\
    ## 02 Reinstall the touch\n\nWe'll need to undo what we did at the end of the\
    \ last tutorial to make sure we can get the touch part working properly, by reinstalling\
    \ then reinstating the support for it:\n\n```bash\n$ sudo modprobe touch_ts; sudo\
    \ modprobe touch_ts\n```\n\n## 03 Main event\n\nFind out what event the touch\
    \ screen is known by with the following:\n\n```bash\n- ls -1 /dev/input/touchscreen\n\
    ```\n\nWe can install tools to calibrate and debug the touch screen. Install and\
    \ test them with:\n\n```bash\n- sudo apt-get install tslib libts-bin\n- sudo eventtest\
    \ /dev/input/touchscreen\n```\n\n## 06 Install X calibrator\n\nNow we need to\
    \ calibrate the touch screen in X, which means installing the correct tools. Use\
    \ the following two commands to download and install the:\n\n```bash\n- wget http://adafruit-download.s3.amazonaws.com/xinput-calibrator-0.7.1-armhf\n\
    - sudo dpkg -i -B xinput-calibrator-0.7.1-armhf\n```\n\nFollow this up by deleting\
    \ irrelevant calibration data with the:\n\n```bash\n- sudo rm /etc/X11/xorg.conf.d/99-calibration.conf\n\
    ```\n\n![](img/51c03797fb5c18679e30c47f609c6b83_60_0.png)\n\n## 04 Touch calibration\n\
    \nWe can finally begin the calibration process. Enter the following so the Pi\
    \ can learn roughly where the positions are on the screen:\n\n```bash\n$ TSLIB_FBDEVICE=/dev/fb1\
    \ TSLIB_TSDEVICE=/dev/input/touchscreen_ts_calibrate\n```\n\n![](img/51c03797fb5c18679e30c47f609c6b83_60_1.png)\n\
    \n## 07 X-calibrate\n\nFrom your SSH, run startx for the screen to turn on. From\
    \ here you can try to get xinput_calibrator typed into the terminal or type the\
    \ following from the SSH session if it's easier:\n\n```bash\nFRAMEBUFFER=/dev/fb1\
    \ startx & DISPLAY=0.0 xinput_calibrator\n```\n\n## 08 Save calibration\n\nHaving\
    \ completed, you'll get an output starting with \"InputClass\". Open the following\
    \ file and copy the output from Section to EndSection into:\n\n```bash\n$ TSLIB_FBDEVICE=/dev/fb1\
    \ TSLIB_TSDEVICE=/dev/input/touchscreen_ts_test\n```\n\n## 05 Draw calibration\n\
    \nOnce you've done the calibration, you can try out a drawing test to see how\
    \ the screen reacts. Do this with the following:\n\n## Play around\n\nYour touch\
    \ screen is now properly set! We'll go over more ways to make it easier to use\
    \ in the following tutorial, but it's basically now and ready to have other projects,\
    \ like the PIPH or PiCam, loaded onto it.\n\nIf it's not working to your liking,\
    \ you can try the previous step again.\n"
