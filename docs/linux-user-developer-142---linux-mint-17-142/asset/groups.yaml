    # 04 Resource allocation and load management


    After adding the tasks to your project, click on the Project Details page (step
    3). You can view a Gantt chart of all the tasks here. Note: click on the horizontal
    bar to view the Resource allocation and link it to the tasks. Note that resource
    allocation can be done as specific (you define the resource) or generic (system
    algorithm with load and constraints mentioned in the title). After allocation
    is complete, you can see the project-specific load charts in the same page. This
    is how human resources can be properly managed. You want the load to be perfect
    – not more, not less, as that is said, be more important. So, in addition to project-specific
    load, there is a dedicated Resources load window. Just click on the Resources
    load button on the extreme left to see the height on which all the resource information.


    # 05 Timesheets


    Timesheets can be found under the Cost drop-down menu. Each resource has a personal
    timesheet, which needs to be filled in pre-assigned tasks. In addition to assigned
    tasks, users can themselves add and measure hours. By filling the tasks, the corresponding
    project gets automatically updated. For example, we added the task with the budget
    allocated 50 GBP. Now as for the task ''Requirement Analysis'', the hour cost
    in the Cost tab of Project Details shows – you can see the red bar showing budget
    overrun.


    # 06 Expenses


    Costs incurred other than human resources can be tracked/linked using expenses.
    Go to the Cost drop-down and select link expense to a task. You can then add an
    expense to the sheets that relates to the project. Just add the task and name
    and other of them. As with the human resources, this cost also automatically shows
    up in


    > You want the load to be perfect – not more, not less. As a result, tracking
    becomes even more important


