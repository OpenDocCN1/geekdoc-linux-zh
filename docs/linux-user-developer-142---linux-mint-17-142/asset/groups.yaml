    # MOOCs —— 个化时代的大规模学习


    ## 开放教育的兴起


    # 特写


    ![](img/51c03797fb5c18679e30c47f609c6b83_28_0.png)


    上方：在面试期间提供轶证，这类课程可以被证明并体现在你的简历中。


    - Macleod 表示，学习者必须被配置为自主学习者和有动性的学习者。但 MOOC 也有校外教育——例如，对于那些希望教授没有合格教师的学科的学校。


    来自 Unified Learning 的 Geoff（这是一个涵盖全英国 40 所学校的团体）已经在学术学校与独立学校之间建立联系，并开始从独立学生向带有德语教师的学院提供德语
    MOOC。


    ## 开源


    虽然某些课程的极高扩展性消耗了围绕 MOOC 的大部分炒作，但不仅是课程，其社区和基础设施的免费与开放性质正经受挑战。平台正向开放化发展，从西班牙 UNED
    等机构使用的基于 Apache 许可的 OpenMOOC 平台，到 2016 年 3 月启动的 edX 开放平台。


    旧的 FOSS（自由开源软件）平台，如开放大学使用的，适用于所有课程而不只是 MOOC，并且为了英国进一步教育的利益，可见 seen-mooc-platforms.com。


    ## 查看免费的 LinkedIn 简历，你会发现 P2P 学习状态的特色


    > 开放教育的力量可以在不丧失质量或控制的情况下改变学习。


    - “Macleod 说，与你理解的对话式、带学分的课程不同——免费获取的资源是（由于在 MOOC 中，大多数人是学生和退休人员）是灵活的。你可以随心所欲回放和暂停视频，这在任何时候都很有用，然后根据需要停止并在你可以带走的知识。”


    - 并且许多参与者使用母语，存在着大量的非母语使用者的长尾效应，他们在课程中帮助他人，或从母语使用者的帮助中获益。


    ## 边学边做


    通过加入同伴评审和线下聚会，我们可以看到 MOOC 参与者并没有获得大学认可的支持。许多免费的 LinkedIn 简历中你会看到更多社交社区和在线的 P2P
    学习正在发生，并在 MOOC 社区中参与其中。


    终身学习的信条主要由那些使用它的人追求——UTA 成员和退休人员——他们是种忙碌的部门，兼顾家庭、小企业并不断寻求在线自由。学习生活带来了所需的少部分知识库，MOOC
    与其他的同伴学习（无论是在线还是这些）有很大关系。


    自由开源社区一直提供其教育，从免费的教科书到 LUG（Linux 用户小组）和开源软件项目。现在的变化已成为主流教育的一部分。


    这些元素使得很难界定教学和学习的线程，MOOC 依赖于在线学习者社区，他们将参与其中，互相帮助，或通过对更优雅的作业提供提示。


    为了让下一代做好终身学习准备，学校需要学习。“在开放教育背景下取得成功——即使是略微帮助同学解决 MOOC 电子系统中的陷阱。大多数 MOOC 仍然是英语或西班牙语，


    “MOOC 空间最近被世界银行等其他学习机构占据。不仅有公立大学，还有传统学院……其他拥有知识库的机构，或作为代理进行购买。在快速发展的领域中，教育、协作和互联网比……（原文缺失）要丰富得多。”


    学习正在变得可能，而在线和同伴学习方法正在成为产生这些社区的人生活的一部分。


    29 www.linuxuser.co.uk


    ## 在 Kdenlive 中编辑视频


    学习如何在 Kdenlive 界面内管理你的片段和项目设置


    - 使用过渡效果和特效在片段和轨道之间移动，创建精美的视频


    - 得益于强大的编码工具，将你的视频导出为各种格式以便在任何地方播放


    ![](img/51c03797fb5c18679e30c47f609c6b83_29_0.png)


    ## 在 Kdenlive 中编辑视频


    ## 使用现成的开源软件创建精美的视频


    Rob Zwetsloot 为复杂系统建模，是一位精通 Python、Django 的资练开发者，并知道如何进行计算实验。


    Linux 经常被忽视的领域之一是其媒体处理能力。撇开非免费代码生成和可疑的遗产，Kdenlive 支持多种流行和冷门的媒体格式，并已支持很长时间。这也扩展到了视频和音频编辑能力，通过为许多不同的任务选择专家。


    ## 资源


    - Kdenlive www.kdenlive.org

    - AV Linux www.bandished.net/AV/AV_linux.html


    ## 获取 Kdenlive


    Kdenlive 适用于许多系统的存储库，搜索软件或包管理器是一个很好的起点。否则，你可以通过现场启动或安装 AV Linux，这是一个预装了 Kdenlive
    的专注于编辑的发行发行版。如果你打算经常这样做，后者更好。


    Kdenlive 是我们最喜欢的软件之一，是一个极佳的起点。它很容易上手，但带有各种专业级级的功能。这个月，我们将从查看一些你可以使用的基础编辑技术开始。


    ![](img/51c03797fb5c18679e30c47f609c6b83_29_1.png)


    ## 在 Kdenlive 中编辑视频


    ## 在 Kdenlive 中编辑视频

    使用过渡效果和特效在片段和轨道之间移动，创建精美的视频


    ## 教程


    ### 02 新项目

    打开 Kdenlive，你将看到基础界面。它还将定义视频设置，这将决定最终产品的呈现方式。


    ### 03 视频设置

    你可以从分辨率和帧率的多种标准格式中进行选择。如果你不确定导入时间轴的视频片段有多大，则可以使用。


    ### 04 导入视频

    进入“编辑+添加”（或点击带有 `+` 的胶片）来添加文件。你也可以在此添加音乐或其他音频片段，只需将多个片段拖入到时间轴，或只拖入你现在需要的片段。


    ### 05 添加到时间轴

    将片段拖入时间轴以按你的意愿排列。你可以上下拖动它们以在前后留出空间。界面中最顶端的时间轴对视频具有优先级，这对于淡出和片段间的移动至关重要。


    ### 06 片段间的过渡

    将所需的下一个片段放在原始片段旁边。右键点击片段并选择“添加过渡”菜单——这是你可以使用的过渡类型完整列表。随心所欲调整它们；如果你想淡入黑色，我们有一个黑色图像。


    ### 07 添加音乐

    音乐可以像任何片段一样添加，你只需要向界面添加一条音频轨道。像处理视频片段一样拖动并定位它——如果你需要编辑两者的音量，右键点击并进入“添加特效+音频校正和音量”。


    ### 08 添加标题

    进入项目添加标题为你的项目创建一个图形标题。它可以根据你的意愿设置为文本并默认设置为——一旦保存，它将出现在时间轴的任何位置。


    ### 09 导出你的视频

    完成这些基础编辑后，你可以为其他电脑创建视频片段或上传到 YouTube。点击“导出”并选择你需要的选项。可能需要缩小项目。


