    ![](img/51c03797fb5c18679e30c47f609c6b83_36_1.png)


    02 Project Details

    The Project Details page enables you to fill in further information specific to
    the project. One of the most important among the WBS/Task - this allows you to
    divide the project into smaller tasks. You can add task dependencies, resources
    and costs - you just have to fill in a new task name and click on the Add. You
    can then edit the further details for the task by clicking on Edit.


    03 Add resource

    LibrePlan can be a human or a machine. To add a resource, click on the link (workers/members)
    on the Resources menu drop-down. This shows a list of all the available resources
    to project. Click the plus button at the bottom to create the resource.

    After you click the Create button, you need to fill in the details about the resource.
    Note that resources can be linked to multiple projects.


    To summarise the facts: General Data has info about customers, deadlines, status,
    etc., and priority for different tasks (this is not required); Progress allows
    you to add a progress measurement mechanism, enabling the progress tracking; Criterion
    Requirement allows you to add criteria such as location, skills, etc., to the
    members joining


