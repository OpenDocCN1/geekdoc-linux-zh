    \n## 03 设置默认值\n\n进入“音频与视频”，从菜单中选择 VLC。勾选复选框设置为默认应用，然后按回车键保存设置。当你双击或点击视频时，它将自动在\
    \ VLC 中播放。\n\n## 07 获取一些保护\n\n来自 Pimoroni 的 PiTFT Box 外壳是少数外壳之一 —— 如果不是唯一 —— 树莓派的分层组装的，且仅适用于\
