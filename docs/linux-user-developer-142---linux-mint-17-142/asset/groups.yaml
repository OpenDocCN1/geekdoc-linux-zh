    \n![](img/51c03797fb5c18679e30c47f609c6b83_64_1.png)\n\n## 03 测试连接\n\n我们将使用名为\
    \ `i2cdect` 的程序测试舵机。如果你使用的是树莓派，`i2cdect` 将显示类型为1的 I2C 总线，其中1是 I2C 总线编号。你可以看到类似于图片的输出。设备应该在那里，如果没有，可能出了问题。\n\
