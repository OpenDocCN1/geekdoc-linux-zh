    # ## New in 3.15


    Among the new features in Linux 3.15 is support for "file cross-remming" and faster
    resume swap on laptops with faster disks. The cross-remming scenario in 3.15 provides
    an atomic file exchange that allows two files on disk to be swapped in a way that
    the entire operation occurs as a unit, or never occurs. This means there is no
    time during the swapping of files that some exist on other parts of the system
    will be left in an inconsistent state.


    File systems can use cross-functionality to support writable storage for devices.
    Existing file systems typically use read-only file systems coupled with a small
    amount of swap space for writable data. By using cross-remming, the underlying
    file of one of the files is used as a technical means of providing write access.


    There were course many changes in Linux 3.15 that may be of interest to you, especially
    the x86_64 architecture. A summary of new features in this release can be found
    on our website at: http://kernelnew.org/Linux/3.15


