    你现在可以免费参加 edX 的 Linux 入门课程，但 MOOCs 的意义远不止廉价教育


    ![](img/51c03797fb5c18679e30c47f609c6b83_25_0.png)


    MOOCs（大规模开放在线课程）为任何连接互联网的人提供了世界上最顶尖的教育内容。内容免费可用（尽管也有一些付费课程）且内容丰富，你可以学习学位水平的数学、哲学，甚至是在线课程。


    有些课程侧重于极佳的可扩展性（xMOOC），另一些侧重于参与者之间的连接与协作（cMOOC），但 xMOOC 的参与者通常是匿名的，许多人注册是为了分享经验，只是浅尝一下内容，并没有打算完成整个课程。


    尽管如此，只要有时间和自律，就可以完成等同于学位的完整课程。有些人通过组合来自世界顶尖教育机构的 MOOCs 完成了 MBA 学位。


    学位在雇主眼中非常受推崇；在初创公司和拥有多元职业的自由职业者快速变化的世界中，MOOCs 是廉价、自助的持续专业发展（CPD）的一部分。它们代表了对新技术发展和编程语言范式的积极学习，这与在会议和闪电营会上举行的
    20 场讲座并列——这一切都通过上传到 SlideShare 的演讲并添加到你的 LinkedIn 个人资料中证明。


    早期的 MOOCs 来自雅典的 George Siemens 和加拿大（国家研究理事会）的 Stephen Downey 等先驱者，侧重于协作工具的使用：博客文章、Moodle
    和 Second Life 中的线式会议，这些都产了新的课程和想法。在连接性、协作式教育的教学观点驱动下，这些可以被视为教育机构对技术社区中黑客营和闪电演讲等蓬勃发展的同伴学习的补充。


    上述 MOOCs 与其他形式的同伴学习（包括在线和线下）具有协同效应。黑客营、代码冲刺和闪电演讲将网络化社区聚集在一起


