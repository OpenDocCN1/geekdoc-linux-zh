    # Linux Mint 17


    Everything you need to know about Qiana


    ## FEATURE


    ### MATE desktop


    Learn your way around the spiritual and somewhat actual successor to GNOME 2


    ![](img/51c03797fb5c18679e30c47f609c6b83_20_0.png)


    MATE is in many ways still like GNOME 2 but if you''re jumping straight into it
    a few years, you may notice some differences. There''s now one panel and the Mint
    menu replaces the standard menu layout. Here is how you get around the desktop
    and how to use some of its advanced features.


    Everything is accessible from the Mint Menu in the bottom left of the screen.
    Click on it to get started.


    Utilities and places are listed down the left side, with favourite applications
    take the bulk of the menu. Click on the top-right of the menu to drill further
    into the program selection.


    The app categories are listed in the main menu, but you can always click the button
    to return to the fashions.


    The search function, at this time, is useful for quickly looking around the applications
    for the program you need right.


    All the settings are inside Control Centre, which is found in the left column
    of the menu. MATE and system settings are all kept here.


    The Control Centre menu is quite deep, with options for simple desktop aesthetics
    to networking and peers.


    ## Feature Linux Mint 17


    ![](img/51c03797fb5c18679e30c47f609c6b83_21_0.png)


    # DISTRO Linux Mint 17 Qiana


    We''ve seen how it has, but how does the end result stand up? Find out in our
    full review


    | Feature | Details |

    | :--- | :--- |

    | Release Date | 31 May 2014 |

    | CPU | 700MHz |

    | Memory | 512MB (1GB recommended) |

    | Graphics | Capable 1024x768 or more |

    | Storage | 5GB (20GB recommended) |

    | Base | Ubuntu 14.04 LTS |

    | ISO | 1.1 - 1.3 |

    | Desktop environments | Cinnamon, MATE, XFCE |


    It''s been over a year since we did a proper review of Linux Mint and it seems
    like a lifetime ago. Even then we were looking ahead to this version of Linux
    Mint as the culmination of everything we''ve seen in years of Cinnamon, which
    has a brand new vision of it in the hands of users, sitting on top of a desktop
    to work with.


    It''s probably the most important release of Linux Mint since years ago when they
    made Cinnamon the flagship desktop. It is mature and capable of years of support
    to go with it all as well. The intention was that it would elevate the popularity
    of the already widespread Linux Mint usage.


    With all the build-up this year, some may be skeptical about whether or not the
    Linux Mint team truly delivered, even if the last year has shown that they are
    on the right track; the initial release of this Linux Mint had some minor issues,
    resulting in a hasty distro shortly after release. Does that solve the problem?


    # First impressions


    We''re talking about ''changes'' for Linux Mint 17, but that shouldn''t be misconstructed
    as this being an entirely new Linux Mint. The look and feel of Linux Mint, Cinnamon
    and MATE are the same as before, but it feels faster, smoother and holds a series
    of other objectives that just make it better than before. Creating an entirely
    new desktop environment or trying to completely overhaul and update ancient code
    is no easy, and we have had our issues with Cinnamon and MATE 18 months to two
    years ago.


    # Linux Mint 17

