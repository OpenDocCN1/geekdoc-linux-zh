    **Bob Zotsloot** 学习航空航空工程，使用 Python 进行复杂仿真建模。在进行了几次前卫但具有争议的 C 调试实验后，他回到实验室并开始了他的关于编写
    Emacs 的系列文章（第 56 页）。该系列深受自我意识 Makebuf 策略的困扰。


    **Richard Snemark** 开始使用 Vim 使用电脑，并一直保持着最强大的命令行环境。这位 Richard 讨论了 Emacs 对阵开源版（第
    62 页）的地狱脚本（第 62 页）。


    **Nitish Tiwari** 是一位专业软件开发人员，内心是一个开源科学爱好者。他为开源应用撰写文章，并在硬件中使用开源软件。在第 36 页，Nitish
    解释了使用 LibreOffice 的项目。


    **Mihalis Toukalis** 是一位专精编程、数据库和数学的 Linux 系统管理员。他自 1993 年起一直使用 Linux。在本期杂志中，Mihalis
    展示了如何使用命令行和基础脚本快速安装和管理 Drupal（第 42 页）。


    **Gareth Halcliffe** 从 13 岁上大学起，就已经从事 Linux 15 年了。John 住在剑桥、曼彻斯特，在一家大型企业风险工作。你可以在本月的第
    14-15 页看到他精彩的“内核专栏”。


    **Gareth Halcliffe** 是一位新出炉的记者，他为我们讲述了来自整个开源世界的进展，从第 6 页开始。请看第 80 页他精彩的评测，该评测专为那些已经超越
    Cubidev2 的读者设计。


    - 简化计划

    - 开始编写 Bash 脚本

    - 为 Android 编写 RSS 阅读器

    - 用树莓派制作手持视频播放器


    欢迎阅读 Linux User 的最新版本，这是英国和美国最喜爱的 Linux 开源杂志。


    Linux 用户从根本上说是一群自学者。对于我们每月的培训，我们需要一位 Linux 开发者的指导，而有无数的人在不懈地追求解决各项问题上，付出了整个 Linux
    社区全部的力量，分享知识，这种动态的兴趣正开始动摇传统。本月，紧随 Ed 转向他声称的《2022 年 Linux 入门》课程之后。我们还邀请了专家支持 Giana，来了解
    Ubuntu 这一高排名发行版是否真的提供了完整的体验。随着 Cinnamon 首次出现在 Linux 桌面中，它是值得的，这是我们目前见过的最佳发布之一。还有另一个精彩的开头，本期涵盖了
