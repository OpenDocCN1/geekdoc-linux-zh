- md: "\n# Write useful shell scripts – part 1\n\nLearn flow control. Most programs\
    \ involve branching decisions, without which your script is just a list of consecutive\
    \ commands.\n\nPass the output of commands like is to variables for looping through\
    \ and operating on.\n\n```bash\nuser@bash:~$ # Script to make back-up copies\n\
    user@bash:~$ # files in current directory\nuser@bash:~$ TIME=$(date \"%Y-%m-%d\"\
    )\nuser@bash:~$ ORIGFILES=$(ls)\nuser@bash:~$ BACKUPFILE=\"backup-$TIME.tar.bz\"\
    \nuser@bash:~$ echo \"Getting ready to back up $BACKUPFILE\"\nuser@bash:~$ if\
    \ [ -s \"$ORIGFILES\" ]; then\nuser@bash:~$    echo \"Already backed what now!\"\
    \nuser@bash:~$    for f in $ORIGFILES; do\nuser@bash:~$        cp $f /tmp/\nuser@bash:~$\
    \    echo \"Zipping the files\"\nuser@bash:~$    tar -czf $BACKUPFILE /tmp/*\n\
    user@bash:~$    scp -p 'password' -P 2221 $ORIGDIR/$BACKUPFILE $remote\nuser@bash:~$fi\n\
    user@bash:~$ rm -rf *\nuser@bash:~$ exit 0\n```\n\nMake your scripts communicative\
    \ – don't leave users in the dark!\n\nUse the case statement to replace if...then\
    \ with more flexible and easier to read flow control.\n\n# Write useful shell\
    \ scripts – part 1\n\nShell scripting involves simple steps – building on command\
    \ line knowledge, you'll soon know how to create your own scripts.\n\nWhile Perl\
    \ has the reputation as the glue that holds serious nix systems together, much\
    \ of the day-to-day work on your system is carried out by shell scripts. Shell\
    \ scripts are simple but powerful utilities.\n\nWith flow control, building-by-step\
    \ allows you to deal with errors when they occur, and vary commands as you go\
    \ along learn. We suggest that you try at all the stages, not just writing scripts,\
    \ as it provides a good environment for learning by experiment.\n\nBefore we get\
    \ some of the larger capabilities of shell scripting, we're going to build up\
    \ on some of the ideas in last month's command utility tutorial, so you can write\
    \ your scripts with simple commands together.\n\nWhile it's nice to totally approach\
    \ complex scripts at once, writing and running once is quite here, so Bash-only\
    \ commands may be mixed with the powerful Bourne shell. Bash – the default in\
    \ Ubuntu and is usually installable on non-Linux systems.\n\n# Advisor\n\nRichard\
    \ Buckley\nA Unix-jack-of-all-trades, doesn't spend much time in any large language\
    \ proudly, but always has a shell open to learning scripting by osmosis.\n\n#\
    \ Resources\n\n- Bash shell\n- Your favourite text editor\n\n# Write useful scripts\
    \ – part 1\n\nBuild on your knowledge to create useful scripts with Bash.\n\n\
    TUTORIAL\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_0.png)\n\n## Variable\
    \ assignment in Bash\n\nscripts is easy.\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_1.png)\n\
    \n![](img/51c03797fb5c18679e30c47f609c6b83_32_2.png)\n\n## Start the shebang\n\
    \nThis is called the shebang, and is a \"nix mashup\", which tells the interpreter\
    \ to use Bash. You can also pass options here as `#!/bin/bash -ex` which is a\
    \ useful debugging option:\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_3.png)\n\
    \n## Where is it?\n\nPutting back around 'pwd' passes as a command, so that you\
    \ can run the script. You can also use $SPWD, which is the variable for the current\
    \ directory in quotes.\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_4.png)\n\
    \n## Path environment\n\nLearn to navigate to your next location, adding PATH:$HOME\
    \ to your .bashrc if it is a Bash script, each time you need a shell. You can\
    \ add many more directories here.\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_5.png)\n\
    \n## Permission\n\nYou can call your script with bash hello.sh, but make it executable\
    \ with chmod +x hello.sh. To run it without bash, you must add it to your PATH.\n\
    \n![](img/51c03797fb5c18679e30c47f609c6b83_32_6.png)\n\n## World!\n\nWe can now\
    \ run our tiny script, but perhaps you have already installed it, and so let's\
    \ move on to scripts, building on Bash's command line variables.\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_7.png)\n\
    \n## Variables\n\nIn Bash scripts variable=value. Here is how we use variables\
    \ to pass a list of files, the output of it is to the variable original_file.\n\
    \n![](img/51c03797fb5c18679e30c47f609c6b83_32_8.png)\n\n## In the path\n\nIt's\
    \ a good idea if you want to run scripts and other code without privileges. PATH=$PATH\
    \ will add this directory to your path, it is searched when you type name.\n\n\
    ## In is\n\nUsing the keyword for list do something is done from the command line.\
    \ It's also a nice way of looping over a set of values in script.\n\n## Practical\
    \ script\n\nFor frequently changed files, it would be nice if you were able to\
    \ take a snapshot whenever a single command, instead of long chains of commands\
    \ we looked at. It is exactly what scripts are for!\n\n# Tutorial Write useful\
    \ shell scripts - part 1\n\n![](img/51c03797fb5c18679e30c47f609c6b83_33_0.png)\n\
    \n```bash\n#!/bin/bash\n# Script to make back-up copies\n# files in current directory\n\
    TIME=$(date +\"%Y-%m-%d\")\nCURDIR=$(pwd)\nFILES=$(ls)\nUNWANTED=\"*.bak\"\nBACKUPFILE=\"\
    backup-$TIME.tar.bz2\"\nDESTINATION=\"/home/richard/bak\"\necho \"Getting ready\
    \ to back up $CURDIR\"\nif [ -n \"$UNWANTED\" ]; then\n    echo \"already backed\
    \ what now?\"\n    for f in $FILES; do\n        cp \"$f\" \"$DESTINATION\"\n \
    \   done\nfi\n```\n\n## Echo test\n\nIt's a good idea to test program logic with\
    \ echo statement at each step, before you start adding files. We can see that\
    \ the loop works over the values of the directory list, so can do further operations...\n\
    \n```bash\n$ dir_backup.sh\necho \"Getting ready to back up\"\norig_files=$1\n\
    for f in $orig_files; do\n    cp \"$f\" \"$f.bak\"\ndone\n\nif we now have a version\
    \ of the script that will make copies of everything in the directory unless it\
    \ finds files already. Note the comparison of variables is definitely non-portable\
    \ to some other shells. We'll look at how you can link to /bin/bash or use box\
    \ in make. We've used variables so that they are easy script in logs. Still to\
    \ go making the back-ups and putting them safe...\n\n## Exclusions\n\nUsing for\
    \ to assign the values of orig_files - the list of the current directory to a\
    \ variable. If you use $variable in your script it works on each named file:\n\
    \n## if-then-else\n\nChecking for files involves an if...else - we can skip the\
    \ copy if one file already exists, but you want to check different possible conditions.\n\
    \n```bash\ndir_backup.sh\necho \"Getting ready to back up\"\norig_files=$1\nfor\
    \ f in $orig_files; do\n    if [ -f \"$f.bak\" ]; then\n        echo \"$f already\
    \ backed\"\n    else\n        cp \"$f\" \"$f.bak\"\n    fi\ndone\n```\n\n## Already\
    \ baked?\n\nFor search to find, we declare a new variable at the beginning of\
    \ the script. Note that we will use files with 'f' in their name too, such as\
    \ 'course-txt'. We will refine the search, then:\n\n## Zip\n\nOnce the bak files\
    \ are created we use the same name with date in the command. Note the DATE variable\
    \ in the previous script - %Y gives us a more useful format of yyyy-mm-.\n\n##\
    \ Basic tasks\n\n...producing a copy with suffix .bak. Unfortunately our script\
    \ can't tell if a bak has already been made, not yet until after it. The first\
    \ step to avoiding a bak.bak.bak conflict is detecting the files:\n\n# Write awful\
    \ shell scripts – part 1\n\nBuild on your command knowledge to create useful Bash\
    \ scripts.\n\n![](img/51c03797fb5c18679e30c47f609c6b83_34_0.png)\n\n## It's a\
    \ good idea to test program logic at each stage, before you start adding in file\
    \ operations\n\n```bash\n$ richard@uos-AOA1500~#\n$ ./dir/backup.sh\n$ cp backup\
    \ up /home/richard/bin\nUnzipping the files\n$ ls -la /bakk/*.bz2\n/bakk/backup-main.tar.bz2\n\
    /bakk/backup-Kay-29-14.tar.bz2\n```\n\n**17** It works!\nNow we start what is\
    \ going to do, then if you run it twice it will overwritten.\n\n## Easy logic\n\
    \nCase examples a series of if-then-else type conditions in a more concise and\
    \ readable fashion, suited to sort more choices of matching, and more comparable\
    \ than the earlier example.\n\n## Communicate\n\nWhile it not a huge thing, the\
    \ script will tell you exactly is happening at each stage is a small step towards\
    \ user-friendliness. We'll keep to adding stability in the next.\n\n## Networking\n\
    \nIf you read the command line last month, you may remember scp to save the backup\
    \ remotely and sshpass to send the password. You may want to restrict read permissions\
    \ on this file.\n\n## Next time...,\n\nAlready, we have the basis for useful scripts.\
    \ Next month will tell us by adding interaction and planning larger scripts. Meaning,\
    \ we have look at some scripts on your system to become more familiar with actually\
    \ constructing!\n"
  mdcn: "\n\n# 编写实用的 shell 脚本 – 部分 1\n\n学习流程控制。大多数程序涉及分支决策，如果没有分支，你的脚本仅仅是一系列连续的命令。\n\
    \n将 `ls` 等命令的输出传递给变量，以便进行循环和操作。\n\n```bash\nuser@bash:~$ # 创建备份的脚本\nuser@bash:~$\
    \ # 当前目录下的文件\nuser@bash:~$ TIME=$(date \"%Y-%m-%d\")\nuser@bash:~$ ORIGFILES=$(ls)\n\
    user@bash:~$ BACKUPFILE=\"backup-$TIME.tar.bz\"\nuser@bash:~$ echo \"Getting ready\
    \ to back up $BACKUPFILE\"\nuser@bash:~$ if [ -s \"$ORIGFILES\" ]; then\nuser@bash:~$\
    \    echo \"Already backed what now!\"\nuser@bash:~$    for f in $ORIGFILES; do\n\
    user@bash:~$        cp $f /tmp/\nuser@bash:~$    echo \"Zipping the files\"\n\
    user@bash:~$    tar -czf $BACKUPFILE /tmp/*\nuser@bash:~$    scp -p 'password'\
    \ -P 2221 $ORIGDIR/$BACKUPFILE $remote\nuser@bash:~$fi\nuser@bash:~$ rm -rf *\n\
    user@bash:~$ exit 0\n```\n\n让你的脚本具有沟通性——不要让用户一所不知！\n\n使用 `case` 语句代替 `if...then`，实现更灵活、更易读的流程控制。\n\
    \n# 编写实用的 shell 脚本 – 部分 1\n\nShell 脚本编写涉及简单的步骤——在命令行知识的基础上，你很快就能学会如何创建自己的脚本。\n\
    \n虽然 Perl 被誉为连接复杂 nix 系统的“胶水”，但你系统中的大部分日常工作是由 shell 脚本完成的。Shell 脚本是简单但强大的工具。\n\
    \n通过流程控制，分步构建允许你在错误发生时对错误进行进行处理，并在学习过程中调整命令。我们建议你在所有阶段都进行尝试，而不仅仅是编写脚本，因为它为实验性学习提供了一个良好的环境。\n\
    \n在我们学习 shell 脚本的一些高级功能之前，我们将基于上个月命令工具教程中的一些想法，这样你就可以结合简单的命令来编写你的脚本。\n\n虽然一次性完全处理复杂的脚本很美好，但一次性编写并运行比较困难，因此\
    \ Bash 专用命令可能与强大的 Bourne shell 混合使用。Bash 是 Ubuntu 的默认 shell，通常也可以安装在非 Linux 系统上。\n\
    \n# 顾问\n\nRichard Buckley\n一位 Unix 全才，他不屑于在任何一种大型语言上花费大量时间，但总是开启一个 shell 通过潜移默化学习脚本编写。\n\
    \n# 资源\n\n- Bash shell\n- 你喜欢的文本编辑器\n\n# 编写实用的脚本 – 部分 1\n\n基于你的知识，使用 Bash 创建实用的脚本。\n\
    \n教程\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_0.png)\n\n## Bash 中的变量赋值\n\
    \n脚本是很容易的。\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_1.png)\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_2.png)\n\
    \n## 开始 shebang\n\n这被称为 shebang，是一个“nix 混合体”，它告诉解释器使用 Bash。你也可以在这里传递选项，例如 `#!/bin/bash\
    \ -ex`，这是一个非常有用的调试选项：\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_3.png)\n\n\
    ## 它在哪儿？\n\n将 `pwd` 放在引号周围作为命令，这样你就可以运行脚本。你也可以使用 `$SPWD`，它是当前目录的变量。\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_4.png)\n\
    \n## 路径环境\n\n学习导航到下一个位置，将 `$HOME` 添加到 `.bashrc`，如果这是一个 Bash 脚本，你可以在这里添加更多目录。\n\
    \n![](img/51c03797fb5c18679e30c47f609c6b83_32_5.png)\n\n## 权限\n\n你可以用 `bash hello.sh`\
    \ 调用你的脚本，但要用 `chmod +x hello.sh` 使其变为可执行。\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_6.png)\n\
    \n## 世界！\n\n我们现在可以运行我们的微型脚本了，但也许你已经安装了它，让我们继续学习 Bash 的命令行变量吧。\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_7.png)\n\
    \n## 变量\n\n在 Bash 脚本中变量=值。这里我们如何使用变量来传递文件列表，它的输出是 `original_file`。\n\n![](img/51c03797fb5c18679e30c47f609c6b83_32_8.png)\n\
    \n## 在路径中\n\n如果你想运行脚本的脚本，`PATH=$PATH` 会将此目录添加到你的路径，当你输入名称时会进行搜索。\n\n## 在... 中\n\
    \n使用 `for` 关键字来做某事是从命令行完成的。这也是一种遍历脚本中一组值的良好方法。\n\n## 实用脚本\n\n对于经常更改的文件，如果能够在执行单条命令时拍摄快照，那就太好了。这正是脚本的用处！\n\
    \n# 教程 编写实用的 shell  - 部分 1\n\n![](img/51c03797fb5c18679e30c47f609c6b83_33_0.png)\n\
    \n```bash\n#!/bin/bash\n# 创建备份副本的脚本\n# 当前目录下的文件\nTIME=$(date +\"%Y-%m-%d\")\n\
    CURDIR=$(pwd)\nFILES=$(ls)\nUNWANTED=\"*.bak\"\nBACKUPFILE=\"backup-$TIME.tar.bz\"\
    \nDESTINATION=\"/home/richard/bak\"\necho \"Getting ready to back up $CURDIR\"\
    \nif [ -n \"$UNWANTED\" ]; then\n    echo \"already backed what now?\"\n    for\
    \ f in $FILES; do\n        cp \"$f\" \"$DESTINATION\"\n    done\nfi\n```\n\n##\
    \ Echo 测试\n\n在开始添加文件之前，使用 `echo` 语句测试程序逻辑是一个好主意。我们可以看到循环作用于目录列表，因此可以进行进一步的操作...\n\
    \n```bash\n$ dir_backup.sh\necho \"Getting ready to back up\"\norig_files=$1\n\
    for f in $orig_files; do\n    cp \"$f\" \"$f.bak\"\ndone\n```\n\n我们现在有一个版本的脚本，除非发现文件文件，否则它会创建目录下文件的副本。注意变量的比较在某些其他\
    \ shell 中绝对是不移植的。我们将查看如何链接到 `/bin/bash` 或使用 `make`。我们使用了变量，以便它们在日志中易于脚本。仍然需要进行备份并确保它们安全...\n\
    \n## 排除\n\n使用 `for` 将 `orig_files` 的值——当前目录的列表赋值给变量。如果你在脚本中使用 `$variable`，它将作用于每个命名的文件：\n\
    \n## if-then-else\n\n检查文件涉及 `if...else` —— 如果文件已经存在，我们可以跳过拷贝，但你想检查不同的可能条件。\n\n\
    ```bash\ndir_backup.sh\necho \"Getting ready to back up\"\norig_files=$1\nfor\
    \ f in $orig_files; do\n    if [ -f \"$f.bak\" ]; then\n        echo \"$f already\
    \ backed\"\n    else\n        cp \"$f\" \"$f.bak\"\n    fi\ndone\n```\n\n## 已经备份了吗？\n\
    \n为了找到查找，我们在脚本开头声明一个新变量。注意我们也将使用名称中包含 'f' 的文件，例如 'course-txt'。我们将完善搜索：\n\n## 压缩\n\
    \n一旦创建了 bak 文件，我们就在命令中使用带有日期的相同名称。注意上一个脚本中的 `DATE` 变量——`%Y` 为我们提供了更实用的格式 `yyyy-mm-`。\n\
    \n## 基本任务\n\n...生成一个后缀为 .bak 的副本。不幸的是，我们的脚本无法判断是否已经制作了备份，直到之后才知道。避免 `bak.bak.bak`\
    \ 冲突的第一步是检测文件：\n\n# 编写糟糕的 shell 脚本 – 部分 1\n\n基于你的命令行知识创建实用的 Bash 脚本。\n\n![](img/51c03797fb5c18679e30c47f609c6b83_34_0.png)\n\
    \n## 在每个阶段使用 `echo` 语句测试程序逻辑是一个好主意\n\n```bash\n$ richard@uos-AOA1500~#\n$ ./dir/backup.sh\n\
    echo \"Getting ready to back up\"\n$ cp up /home/richard/bin\nUnzipping the files\n\
    $ ls -la /bakk/*.bz2\n/bakk/backup-main.tar.bz2\n/bakk/backup-Kay-29-14.tar.bz2\n\
    ```\n\n"
