    - 全屏\n- 加速视频输出\n- 始终置顶上\n\n![](img/51c03797fb5c18679e30c47f609c6b83_62_1.png)\n\
    \n## 04 VLC 选项\n\n从菜单打开 VLC，并在播放器区域任意位置右键点击打开上下文菜单。在这里，进入“工具”，然后是“偏好”。滚动点击“仅一个实例”，或进入“视频”选项卡并点击“全屏”。按回车键保存。\n\
    \n## 08 独立供电\n\n为了移动时使用，你需要让它能够脱离有线电源。现在的 USB 电池相当小巧，但有某些事情你需要注意，例如大容量和高电流输出。\n\
    \n## 05 播放视频\n\n你将在树莓派屏幕的大小播放视频，且一次只播放一个。如果你将视频转换为 320x240，效果可能会更好，因为它应该能播放比以前大得视频。\n\
    \n## 09 下次将...\n\n现在你拥有一了一台便携式树莓派视频播放器！随随所欲地使用它，并在过程中学习触摸屏幕的各种细节。下次我们将演示如何将设置从使用树莓派相机看视频切换过来。\n\
    \n## 06 USB 存储\n\n树莓派的 SD 卡空间有限，因此将视频分开存放是有意义的。确保使用不需要额外电源的存储设备，使用 USB 闪盘或移动硬盘。通过文件管理器访问存储，无需挂载。\n\
    \n# 教程：使用你的 Pi 设置并控制舵机\n\n# 使用你的 Pi 设置并控制舵机\n\n## 使用你的树莓派移动机器人的部件或控制任何可以旋转的物体\n\
    \n![](img/51c03797fb5c18679e30c47f609c6b83_63_0.png)\n\nLiam Fraser 是 RaspberryPiFTutorials\
    \ YouTube 系列的创建者，也是树莓派基金会的 Linux 服务器管理员志愿者。他目前在约克大学学习计算机。\n\n![](img/51c03797fb5c18679e30c47f609c6b83_63_1.png)\n\
