    # Editor''s picks


    **Linux Mint 17 – Cinnamon** Write each

    Mint is more or less the ultimate version of Mint, just for any point. With the
    maturity of the 2.x line of Cinnamon on top of the latest Ubuntu LTS, it''s the
    truly best version we have tried so far; Linux Mint Of Cinnamon brings to the
    world


    **Kdenlive** After a long-year hiatus, the Kdenlive team is back again with the
    release of version 0.9.8. Features have been changed, added, fixed, and this version
    is currently our favourite video editor Linux.


    **Otter** Currently pushing through beta releases, Otter is a brand new browser
    that has all the hallmarks of a major player in the future. Aiming to re-create
    classic Opera with Qt, this is one to watch – we see how it did in our web browser
    super-test on page 75.


    # Complete index


    # Operating systems


    **Linux Mint 17 – Cinnamon** Having previously a frontend on top of GNOME desktop
    before becoming a CE in its own right, this version of Linux Cinnamon has appeared
    in an LTS release.


    **Linux Mint 17 – MATE** The successor to GNOME 2, MATE is a modern update to
    the GE 2 codebase that is stable and capable of use – and now with new features.


    **Peppermint Five** Built for speed, this lightweight distro aims to keep your
    system''s performance optimal whether you''re running softwares on your desktop,
    or working with cloud-based apps.


    Mageia 4.1 One of the LU&D team''s distros, the community-led Mageia has become
