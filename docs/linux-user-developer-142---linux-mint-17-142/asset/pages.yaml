    # ## KDE


    KDE is an old favourite of ours and the Linux community. Slightly heavier than
    Cinnamon but with a similar layout and workflow, KDE is a very pretty desktop
    environment that isn''t hampered by any of the awkward interface problems of Unity
    or GNOME 3. It''s usually released a couple weeks after the Cinnamon and MATE
    versions.


    # ## Xfce


    Xfce KDE is the heavier version of Linux - Mint is the lightest version of the
    distro. Using a layout reminiscent of GNOME 2 - by extension MATE as well - it''s
    built to take up very few resources. As with the KDE version, it''s released a
    little later than the normal versions.


    # ## Debian Edition


    A different route to normal Linux. Mint, Debian Edition, as the name suggests,
    is based on Debian rather than Ubuntu. It''s updated on a regular basis so you''ll
    never have to properly upgrade between versions, and you''ll always have the latest
    packages and security updates. This comes with Cinnamon or MATE by default.


