  md: "# Network Android apps\nMake of the most awaited apps by creating an RSS reader\n\
    TUTORIAL\n\nOn a desktop, HTTP transactions tend to be completed within a few\
    \ milliseconds. As may surprise, we will show just how much a phone with a weak\
    \ signal can work slower than that. The synchronous nature of HTTPConnection means\
    \ that any invocation of its methods on the GUI thread will freeze the entire\
    \ system.\n\nCreating another thread solves part of the problem, the method in\
    \ it leaves the GUI thread free to handle other tasks. Android's UI thread is\
    \ not thread safe - accessing a widget from another thread leads to an exception.\
    \ Even though Runnables can be scheduled to run on threads, a more modern solution\
    \ is to enhance its capabilities by adding a new class called AsyncTask.\n\nAsyncTasks\
    \ are created from a template class. It requires a total of three parameters,\
    \ which are used to pass data into and out of the worker thread.\n\n```\npublic\
    \ class AsyncTask extends AsyncTask<String, Integer, Integer> {\n    @Override\n\
    \    protected Integer doInBackground(String... args) {\n        // TODO Auto-generated\
    \ method\n        return null;\n    }\n\n    @Override\n    protected void onPostExecute(Integer\
    \ result) {\n        // TODO Auto-generated method\n        super.onPostExecute(result);\n\
    \    }\n\n    @Override\n    protected void onProgressUpdate(Integer... values)\
    \ {\n        // TODO Auto-generated method\n        super.onProgressUpdate(values);\n\
    \    }\n}\n```\n\n+   - ExampleWorker\nAsyncTask-Params, Result-\n\nThe type passed\
    \ to Params will be used for setting up the worker method. The second parameter\
    \ is to be passed to the progress update, while the third one is used to communicate.\n\
    \nIn our example, three functions are:\nInBackground contains the actual payload,\
    \ which will be run on the thread spawned by AsyncTask.\nDoneExecute returns a\
    \ value, which will be passed to onPostExecute on the GUI thread, and is ideally\
    \ suited to displaying the results of the operation in your choice of widget.\n\
    \n```\npublic class MainActivity extends Activity {\n    AsyncTask myTask;\n\n\
