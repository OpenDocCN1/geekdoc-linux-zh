  md: '# # Web browsers 2014


    Which browser is the best of the bunch?


    REVIEW


    ![](img/51c03797fb5c18679e30c47f609c6b83_76_0.png)


    # Chromium


    # Midori


    How does our previous champion measure up after a year on?


    A firm favourite of ours – and possibly the most lightweight you can go


    ![](img/51c03797fb5c18679e30c47f609c6b83_76_1.png)


    ![](img/51c03797fb5c18679e30c47f609c6b83_76_2.png)


