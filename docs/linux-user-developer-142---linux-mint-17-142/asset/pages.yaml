    # HARDWARE


    # HP unveils Linux-powered ‘The Machine’


    Cutting-edge projects use memristor and photonics technology


    Hewitt Packard has announced its intention to ship the world’s first commercial
    computer based around silicon photonics and memristor technologies within the
    next six years, featuring a custom-built operating system based on Linux.


    The Machine, as the device is known, is designed to represent HP’s vision of the
    future of computing. Its storage will be based around memristor technology a portmanteau
    of ‘memory’ and ‘istor’ that describes a circuit element first postulated in 1971
    by Professor Leon Chua Featuring the performance of dynamic memory but in a non-volatile
    design, memristors would be used by the system for both working memory and storage
    so-called universal memory.


    The advantages of universal memory are many. Performance would be improved as
    no longer needs to be fed into memory in chunks from slow storage. Power demand
    would drop also with no need to supply constant power to working memory to retain
    contents. Potential density embedded memristor technology would be able to provide
    a power cut and continue its calculations without error or data loss.


    A shift away from straight architecture of traditional computers, The Machine
    could enable a new operating system that can take advantage of its design. HP
    has indicated that this operating system will be developed in house on the Linux
    kernel. The system will then be released under any specified open source license,
    the company has said.


    The Machine is also said to include silicon photonic technology on-chip optical
    interconnections for rapid transfer of data. Typically used for external connections


    ![](img/51c03797fb5c18679e30c47f609c6b83_5_0.png)


    # Aims to release The Machine between 2017 and 2020


    between nodes in a silicon photon brings high-speed optical communications to
    components within an individual system and has been suggested as a longterm high-speed
    interconnects within chips


    Memristor technology, in particular, has lasted just for the decades. In 2010
    HP announced a partnership with Skypex to create a commercial variant of the technology
    dubbed Resistive RAM (ReRAM), but far as the industry has shown it lacks memory
    for a microcomputer from Panasonic released in 2013.


    HP has stated that it is dedicating 75 percent of its research and development
    budget to a first commercial implementation of The Machine between 2017 and 2020,
    but new news out Bloomberg that earlier announcements of memristor breakthroughs
    were just around the corner peers perhaps a overenthusiasm.


    The Machine, the company''s research and development reach, will go head-to-head
    with technology developed by rival IBM on replacing traditional semiconductors
    with transistors based on carbon nanotube technology.'
