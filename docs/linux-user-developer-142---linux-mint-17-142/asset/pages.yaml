    \ handler)\n\n# And now we loop\nwhile running:\n    image = mp.data(kinect.sync_get_video([0]))\n\
    \    mp.draw(image)\n    mp.waitforpress(0)\n```\n\nAbove Many people may not\
    \ realize that they can harness the power of the Kinect 360 with Python\n\n# Give\
    \ your robot vision\n\nOne thing that come to mind is that using a Kinect and\
