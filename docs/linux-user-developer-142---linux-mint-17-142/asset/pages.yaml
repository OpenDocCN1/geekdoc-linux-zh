  md: '# # Write useful scripts – part 1


    Build on your knowledge to create useful scripts with Bash


    TUTORIAL


    ![](img/51c03797fb5c18679e30c47f609c6b83_32_0.png)


    # ## Variable assignment in Bash


    scripts is easy


    ![](img/51c03797fb5c18679e30c47f609c6b83_32_1.png)


    ![](img/51c03797fb5c18679e30c47f609c6b83_32_2.png)


    # ## Start the shebang


    This is called the shebang, and is a "nix mashup", which tells the interpreter
    to use Bash. You can also pass options here as "!/bin/bash -ex" which is a useful
    debugging option:


    ![](img/51c03797fb5c18679e30c47f609c6b83_32_3.png)


    # ## Where is it?


    Putting back around ''pwd'' passes as a command, so that you can run the script.
    You can also use $SPWD, which is the variable for the current directory in quotes.


    ![](img/51c03797fb5c18679e30c47f609c6b83_32_4.png)


    # ## Path environment


    Learn to navigate to your next location, adding PATH:$HOME to your .bashrc if
    you it a Bash script, each time you need a shell. You can add many more directories
    here.


    ![](img/51c03797fb5c18679e30c47f609c6b83_32_5.png)


    # ## Permission


    You can call your script with bash hello.sh, but make it executeable with chmod
    +x hello.sh. To run it without bash, you must add it to your PATH.


    ![](img/51c03797fb5c18679e30c47f609c6b83_32_6.png)


    # ## World!


    We can now run our tiny script, but perhaps you have already installed it, and
    so let''s move on to scripts, building on Bash''s command line variables.


    ![](img/51c03797fb5c18679e30c47f609c6b83_32_7.png)


    ![](img/51c03797fb5c18679e30c47f609c6b83_32_8.png)


    # ## Variables


    In Bash scripts variable=value. Here is how we use variables to pass a list of
    files, the output of it is to the variable name original_file,


    ![](img/51c03797fb5c18679e30c47f609c6b83_32_9.png)


    # ## In the path


    It''s a good idea to binary if you want to run scripts and other code without
    root privileges. PATH=$PATH:/bin will add this directory to your path, it is searched
    when you type a program name.


