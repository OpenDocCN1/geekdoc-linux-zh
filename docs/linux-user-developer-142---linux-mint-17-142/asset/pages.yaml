  md: '# Tutorial Set up a touch screen and interface


    # Set up a touch screen and interface


    Rob Zwetsloot

    models complex systems and is a web-developer proficient in Python, Django and
    PHP. He loves to experiment with computing.


    Calibrate your new touch screen and add a small interface using some simple Python
    code


    ![](img/51c03797fb5c18679e30c47f609c6b83_59_0.png)


    # What''ll need


    +   - SD card with up-to-date version of Raspberry Pi

    - PiTT, fully assembled bitly/nej


    01 New rules

    To make things easier for ourselves we''re going to create a little rule so that
    we don''t lose track of what the touch screen is called in the command line. SSH
    in, run the next command and copy the following text into it:


    We''ve got a screen with basic touch functionality but where do we go from there?
    Our first step is to actually make the touch usable; it''s resistant-style, so
    you can use your finger or a stylus with it, and this will affect the calibration
    we get from it. Don''t worry — if you calibrate with one method, you can always
    go back and recalibrate with another.


    Once you''ve completed the tutorial on the previous two pages, be sure to give
    this one a try. Here we''re going to properly set up the touch screen so you can
    continue to use the Raspberry Pi without any other devices or within range of
    a decent power source.


    ```

    $ sudo nano /etc/udev/rules.d/95-touch.rules

    SUBSYSTEM="input", ATTRS(name)="touch-ts", ENV(name)="event", SYML="touchscreen"

    ```


    02 Reinstall the touch screen

    We''ll need to undo what we did at the end of the last tutorial to make sure we
    can get the touch part working properly, by reinstalling and then reinstating
    the support for it:


    ```

    $ sudo modprobe touch_ts; sudo modprobe touch_ts

    ```'
