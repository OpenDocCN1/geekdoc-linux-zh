    # KDE details future plans


    Jo Poortweit tells all


    The KDE Project has summarised its future directions, by Jo Poortweit posting
    a detailed breakdown to the project''s official website.


    According to Poortweit, the next generation of Plasma will include ''pixel perfect
    design and smooth performance thanks to Qt hardware-accelerated display rendering.''
    Poortweit states that plans are in place for


    DPI displays and the Wayland display server, but warns that ''neither is expected
    to be fully finished with the first release'' and ''it will not be possible until
    much later''.


    Poortweit also suggests that the KDE Applications are considering a shorter release
    cycle, but that ''this is a discussion with leaders and upstream developers.


    The KDE Frameworks project, meanwhile, is said to be progressing on reworking
    KDE Libraries into cross-platform modules available to Qt developers. Some have
    already adopted Qt standards Poortweit wrote: ''The Frameworks can simplify, and
    reduce the cost of Qt development by eliminating the need to reinvent key functions.


    Poortweit stopped offering a free release schedule, stating only that ''by summer
    of this year we can expect new generation of Frameworks and Plasma to be available''.


