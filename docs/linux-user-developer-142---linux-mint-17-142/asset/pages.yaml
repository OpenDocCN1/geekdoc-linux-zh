    projects, it would probably be better to cover sheets by expense type than different
    sheets for each project.


    # 07 Project dashboard


    As you are done with the basic setup, now dive into the intricacies of the project
    dashboard. Located on the left vertical part of the page, the Dashboard link connects
    you to the project details. The dashboard shows the project in four parts: Progress,
    Cost, Resources and Time. The Progress block shows project progress, the Cost
    tab shows the project resource utilization while the Time tab displays the delays
    violations along covered. The Resources tab covers the project management features
    of LibrePlan, which has a look-alike to its other sections.


    LDAP whatever under Main Settings. The next link is User Accounts, where you can
    add and assign roles to users. The third link, Profiles, enables you to create
    company-specific profiles (analogous to organizations) which are collected in
    LibrePlan. If you have a customer or contractor who uses LibrePlan, you need to
    add them. The final link of Configurations lets you schedules, which you can synchronize
    with external tools like JIRA.


    # 08 Configurations


    Configuration has four items; the first one is Main Settings, which lets you add
    the basic details like the company logo and so on. You can also configure


    LDAP connect with your company LibrePlan allows seamless interactions. If you
    have a customer or contractor who uses LibrePlan, this feature means you can use
    shared outputs. The fourth link shows project measurements of an outsourced task
    for a new end date for an outsourced task or work. To provide feedback to this,
    you need to provide the type of interaction supported depends on if or not the
    company is the client or subcontractor. The data exchange is based on REST web
    services via XML. So, if there are connectivity issues you can catch using data
    manual XML files.


    # 10 Reports and personal data


    LibrePlan gives you detailed reports under the Reports menu. Each entry is available
    in PDF or Excel formats. To view a report you need to download the drop-down and
    then run it in the excel. You can see hours worked per resource, total worked
    hours by resource, work done per project, task costs, scheduling, materials used
    in project, and your personal times details, tasks allocated and expense sheet.
    You can change the parameters and modify your report as you like. LibrePlan is
    an amazing tool for managing projects, make sure you learn to explore its full
    potential!


