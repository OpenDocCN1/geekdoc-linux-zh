    # # THE FREE SOFTWARE COLUMN


    # # A magic place of literary memoryn


    **OpenXadu, a subset of Nelson''s vision of a world brought together by Xanadu,
    has been released nearly six decades after its original conception**


    Nelson is one of those thinkers whose seemed concepts don''t easily make it into
    the practical world in the form he wanted. For nearly decades he has been working
    on Xanadu, a mysterious system to beat all systems, a complex vision of a world
    that exists in parallel to our own - the immense reality of which has been promised
    at regular intervals over the years.


    invented, although nobody complex. The virtues of Bern-Lee''s solution was threefold:
    it was beautifully simple, accessible, and worked. Although difficult and despite,
    numerous attempts never managed to devise a system that would


    At last, a part of this vision has been realised with the release of OpenXadu.
    It means we can see all the parts. It is not open source, although it would work
    might the interactive computer screen, we could write code in new ways. We screwed
    it up in the Eighth, and missed our chance to change history (that cliche). However,
    we could still compete with PDFs, whatever possible by showing text content.


    In 1960, Nelson enrolled on a course that reminded him of what he could be. On
    his first project, in Assemble a mainframe, he attempted to develop a text-handling
    system that would work for any quantity of text works, before the concept of word
    processors had been invented.


    A few years later, he came up with the term ''hypertext''. Since that date, Nelson
    has been working on his life''s project, a software which would be a ''magic place''


    # Richard Hillisides


    about Art-Mac, digital rights, and free software for a variety of publications


    When Berners-Lee introduced the World Wide Web in 1989, he proposed the year before
    that a ''global subset be created in any network-accessible information could
    be referred to by a single ''Universal Document'' (http://www.w3.org/).


    Xanadu named after Coleridge''s poem, was ''composed, in a subset of Reem of Kubla
    Khan, from the dream of a lady from Columbus Bay, in the fall of 1799, and was
    never finished, because the dream of the dream escaped him.


    The web was beautiful simple. On the server side, there were webpages written
    in a hypertext format that followed simple conventions and rules. On the client
    side, there was a browser that was able to translate it into a readable format.
