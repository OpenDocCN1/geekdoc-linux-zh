  md: '# Tutorial Portable Pi video player


    # Portable Pi video player


    **Rob Zwetsloot**nmodels systems and architect, a web developer proficient in
    Python, Django and PHP. He loves to experiment with computing


    Need a better way to watch video on the go? Let your newly powered-up touch-screen
    Pi play your favourite shows


    ![](img/51c03797fb5c18679e30c47f609c6b83_61_0.png)


    # What you''ll need


    +   - SD card with up-to-date version of Raspian

    - PiTFT, fully assembled

    - Raspberry Pi with a Touch Screen

    - Power supply or an adapter


    We''ve got a Raspberry Pi that we can make portable now – but how can we use it?
    The easiest thing to do with it is to use it as a portable video player. It has
    a far superior battery to your phone and the added bonus of being easily plugged
    into a TV or monitor. Before we can use it to play the videos, we need to make
    it a bit more friendly to transport and get to play in a particular way. We''ve
    recommended some excellent accessories and extras you can take to achieve of this.


    +   01 Install VLC

    Go to your SSH terminal and install VLC media player. It''s a lightweight, highly
    recognisable media player that is able to just play anything you throw at it.
    Do this with:


    +   02 sudo apt-get install vlc

    Default settings

    Here''s where it gets a bit tricky, as you''ll need to perform this via the screen.
    Hook the Pi up to a display, mouse and keyboard or just use the small screen.
