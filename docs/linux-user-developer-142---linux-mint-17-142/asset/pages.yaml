    # Set up the PiTFT touch screen


    Rob Zwetsloot complex systems and is a web developer proficient in Python, Django,
    JavaScript, and HTML. He loves to experiment with computing


    This simple little touch screen takes a bit more than just plugging it in, as
    we show in the first of our hand-held Raspberry Pi video player tutorials:


    ![](img/51c03797fb5c18679e30c47f609c6b83_57_0.png)


    # What you''ll need


    +   - SD card with up-to-date version of Raspberry

    - PiTFT, fully assembled

    - bitly/jHEJTA


    We like to talk about how portable the Raspberry Pi is, but one of the minor issues
    associated with this portability is the lack of a display. Carrying around via
    SSH requires some interesting tricks to get right. The PiTFT removes all these
    issues by requiring nothing and being the size of the Raspberry Pi itself.


    While Adafruit supplies a preconfigured Raspberry image for the screen, you''ll
    need to add some extra to get it working on your current install, which is exactly
    what we are going to cover in this tutorial.


    # 01 Adfruit kernel files


    The first thing we need to do is download and install the necessary kernel files.
    Open a terminal or SSH in and do the following:


    +   - sudo wget http://adafruit-download.s3.amazonaws.com/raspberrypi-bin-adafruit.deb

