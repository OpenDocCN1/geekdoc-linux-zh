  md: '# # Edit video in Kdenlive

    Use this powerful open source editor to make movies


    # TUTORIAL


    ![](img/51c03797fb5c18679e30c47f609c6b83_30_0.png)


    ![](img/51c03797fb5c18679e30c47f609c6b83_30_1.png)


    ![](img/51c03797fb5c18679e30c47f609c6b83_30_2.png)


    # 08 Add a title


    ![](img/51c03797fb5c18679e30c47f609c6b83_30_3.png)


    02 New project

    Open Kdenlive and you''ll be presented with the basic interface. It will also
    define specific video settings which will determine the way the final product
    is rendered, and how the different clips will relate to each other if they''re
    of different dimensions. Go to Project and then Project Settings to change them.


    03 Video settings

    You can choose from a wide selection of standard formats in resolution and frame
    rate. If you''re not sure what size your video clip you import into the timeline
    then can be used as a guideline for how you want your final product to look.


    > One of our favourite video editors, it''s easy to use yet comes with a wide
    variety of prosumer-level features


    # 08 Add a title


    Go to Project Add Title to create a graphic-title for your project. It can be
    text as you desire and is set by default to be transparent — once it''s saved,
    it will appear in the timeline anywhere you want it.


    ![](img/51c03797fb5c18679e30c47f609c6b83_30_4.png)


    04 Import video

    Go to Edit+Add (or click on the film strip with +) to add files. You can also
    add music or other audio clips to this well, and simply drag and drop multiple
    clips to the time or just the one you need right now.


    06 Transitioning between clips

    place the clip you want next to the original clip. Right-click on the clip and
    select Add Transition menu — this is the full list of transition types you can
    use. Play around them as you wish; one wipe we have adding a black image if you
    want to fade to black.


    # 09 Export your video


    Once you''re done with this basic editing, you can create your video clip for
    other computers or upload to YouTube. Click on Export and select the options you
    want. might want to scale the project down to.


    ![](img/51c03797fb5c18679e30c47f609c6b83_30_5.png)


    # 05 Add to timeline


    Drag clips to the timeline to arrange as you wish. You can drag them up and down
    to make space before or after. The highest timeline in the interface will take
    priority for video, which is important for fading and moving between clips.


    # 07 Add music


    Music can be added like any of clips, you just need to add an Audio track to the
    interface. Drag and position it like you did the video clip — if you need to edit
    the volume of either, right-click and go to Add Effect+Audio Correction and Volume.


