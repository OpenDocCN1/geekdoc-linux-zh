    #  01 Add a project


    > LibrePlan not only helps you plan your project, but also allows you to manage
    the resources, time, and cost


    Create new project


    Adding a project is quite simple - go to the Planning tab and click on the plus
    button on the left far of the sub-menu bars. This opens a pop-up window where
    you fill in the details such as name, starting date, deadline, customer, and more.
    Each project has a lot of related information, ... Click on ''Add'' to go to the
    Project Details page.


