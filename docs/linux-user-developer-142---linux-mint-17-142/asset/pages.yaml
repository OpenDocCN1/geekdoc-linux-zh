  md: '# Web browsers 2014


    # Otter


    The newcomer gets our expert analysis as we pit it against the three favourites


    # Firefox


    Has Firefox closed the gap with Chromium with its recent update?


    ![](img/51c03797fb5c18679e30c47f609c6b83_75_0.png)


    ![](img/51c03797fb5c18679e30c47f609c6b83_75_1.png)


    Decent enough options are baked in, though there''s not any toy integration in
    this base


    Firefox tabs are feeling more Chrome-like and there''s an icon-based palette of
    menus under the right-far


    # Availability


    # Availability


    Otter is currently in some level of development and has not made its way to repeat
    quite. Compiling the GTK+ which is in nightly stable - but if you have the 14.04
    Ubuntu you can install it without a bit, if you prefer Ubuntu.


    Firefox is everywhere. We''ve come to across a Linux distro that it wasn''t available,
    though due to the recent DRM issue we wonder if it will be included in future
    Fedora. Either way, you can grab it if you want what you want.


    # Features


    # Features


    Last time we did look at the GNOME browser, which has very few actual features.
    Otter is a beta with a fair more features, which work fairly well and don''t reduce
    the browser to crash often. Its tab management, search engine and various settings
    as well.


    Firefox is one of the most well-feature browsers in this test - although this
    is a bit of a double-edged sword, as it can become a little bogged down. The recent
    design changes have hidden some away, but its capabilities are limited compared
    to Chromium, although there are plenty concerns with that, which we''ll address.


    # Extensibility


    # Extensibility


    Since this is an early browser, it doesn''t actually have any features right now
    - whether or not it will get them in the future is unknown. Compared to the other
    browsers in this test, which will limit you what you can do right, using standard
    features.


    Firefox has the most mature and rich library for many years. Mainly, it''s quite
    and API granting access to more features and allowing for more to be done by the
    add-ons. However, they can also add up to limit Firefox''s performance without
    concern.


    # Privacy


    # Privacy


    It has some early issues, it defaults to DuckDuckGo and has decent settings for
    keeping your history and cookies erased, with standard privacy settings. No direct
    integration or real way to add that as an extension but quite good. You can have
    Incognito tabs in a standard window.


    Firefox''s track of invoking requests, instant page loading and ability to easily
    add functionality, incognito windows and other tools actually make it one of the
    most secure browsers. Around the reason Tails uses a modified version of Firefox/Icefox
    in its secure distro: it can be extremely hard to track.


    # Overall


    # Overall


    > We''ve seen some horrific affair over, but Otter manages to be one of the shining
    gems that is actually better than complete and established browsers. Not enough
    to win, but worth proving.


    > Firefox may not have firmly reclaimed its crown but it''s looking a bit better
    these days ahead of the curve - even if it is ripping off Chromium''s design bit.'
