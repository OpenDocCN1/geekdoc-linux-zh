    # 01 Install Drush


    This article will introduce you to Drush, the command-line and scripting interfaces
    for Drupal. Drush comes from the words Drupal Shell, which has a command-line
    interface similar to WP-CLI WordPress has now.


    Drush is in reality, just another PHP script. Linux distribution will have a package
    that you can install. Alternatively, you can install Drush manually.


    Using the command line interface its main advantages are speed and the ability
    to create scripts that can run as cron jobs. Drush works on Linux, and Windows
    machines.


    After installation, you can check your version by running the following command:


    ```

    $ drush version

    drush version 5.4

    ```


    You can use Drush on any Drupal site to perform tasks, as long as you have direct
    access to its files via the terminal. This means that you do not have to go into
    the numerous sections of the Drupal web interface to perform administrative tasks.


    A newer version of Drush, 7.x.x, is available. You are currently running Drush
    version 5.4. The process depends on how you installed Drush. Some common update
    commands are: upgrade drush, git pull, dl drush --destination=[path/to/drush].
    To disable this, pick: options[''self-update''] = PAUSE; see in your drush.php
    configuration file:


