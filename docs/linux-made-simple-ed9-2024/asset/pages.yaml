- pgno: 72
  md: '![](img/420a7272a6efa239082a35eeadd9bc1d_72_0.png)


    The add files dialogue gives you more options to define what kind of content you''re
    adding.


    # Controlling Kodi


    There are tons of features inside Kodi to play around with, from gaming add-ons
    to weather information to new skins to try out. Most are well documented at kodi.tv,
    and sadly we only have room to scratch the surface of its capabilities here. If
    you install Kodi as it''s intended, on a low power PC or Raspberry Pi connected
    to your TV, you don''t want to be faffing around with a keyboard and mouse to
    select, play and pause shows. You can add a traditional infra-red remote, if you
    have a USB receiver plugged in, but our favourite feature about Kodi is that it
    can be controlled from your phone.


    Set-up from within Kodi is simple. Just go to System > Settings > Services. The
    Remote Control option you see here is not the one you want, but while you''re
    in this menu, it''s


    worth turning on UPNP so that other media players can take use Kodi''s library
    and display.


    Open up the Web server tab, and select “Allow remote control via HTTP”. Don''t
    worry too much about the options here -- and don''t change them. They''re for
    if you want to control Kodi via a web browser, but we''re going to do something
    much easier than that.


    From the phone, head to the App Store or Google Play. You''ll find that there
    are official Kodi apps for remote control, but on Android at least we much prefer
    the unofficial Yatse. Download and install that to your phone.


    When you first open up Yatse, ask it to search for local servers and it should
    find your Kodi machine. Select that and you have full control using cursors, an
    advanced menu system or the touch screen keyboard.


    # The Kodi code


    ![](img/420a7272a6efa239082a35eeadd9bc1d_72_1.png)


    # Recently added


    Roll over this option and thumbnails of videos that have been updated or added
    will appear at the top.


    # Pictures


    Kodi can also be used to browse images on your hard drive. This acts in the same
    way as the movie and music browsers.


    # Main options


    Left and right on your controller (or clicking with your mouse) will take you
    to the different submenus.


    # Genres


    You can search for media using metadata as well as by title.


    # Scanning dialogue


    Kodi will cross reference files against online databases. The catch is it works
    best if you separate movies and TV shows into separate folders.


    # Quick tip


    Under System > Settings > Appearance you can change the look and feel of Kodi
    by switching its skin. The default Confluence look is good, but like some others
    a go until you find one you like. Some may rearrange options on the homescreen
    a bit, but getting back to the default Confluence look is easy.


    # Fun with Kodi'
