- pgno: 120
  md: 'extract its contents elsewhere on the system. VeraCrypt will, however, require
    your admin password to mount the container so that you can edit your files.


    One of the advantages TruPax has over VeraCrypt is that it''s extremely simple
    to use. Once the program has launched, simply click ''Add Files'' or ''Add Folder''
    to load your data into the main window.


    Once the files are added, you''ll see a notification at the bottom of the window
    telling you how large your container will be. If you want space for more files,
    use the ''Free Space'' box on the right-hand side of the window. This is quite
    intuitive and will recognise values such as ''500m'' or ''2g''.


    Optionally you can give your volume a label. Before clicking ''Make Volume'' button
    at the bottom right, make sure to check ''Wipe Afterwards'' if you want to securely
    delete the original files (see below).


    You''ll be asked to set a password for the volume, then TruPax will begin to generate
    your container.


    # Wipe and extract


    Unless you specifically ask it not to, by unchecking the box ''Wipe Afterwards'',
    TruPax will securely erase all of the original files after copying them into a
    secure container. Make sure before you begin that all of your files are backed
    up to a safe and secure place.


    You can use File > Extract in the menu at the top left to make an unencrypted
    copy of your files, provided you know the password. As such, if you only want
    to encrypt files for long term storage, such as for backups, you may find that
    you don''t need to use VeraCrypt at all.


    If, which is more likely, you want to be able to edit these files from time to
    time and add more to your container, you can still use TruPax to create the container
    initially and then actually mount it using VeraCrypt.


    TruPax is written in Java and therefore needs a JRE (Java Runtime Environment)
    installed on your machine. The tutorial lists how to add the repository for this
    on your machine as well


    as how to install Java 8, which is the minimum required for TruPax to run.


    Security conscious people and/or those committed to truly free and open source
    software may prefer to install OpenJDK, which is also developed by the good people
    of Oracle but contains no closed-source code. If you prefer to do this, ignore
    Step One of the tutorial and run the commands:


    ```

    sudo add-apt-repository ppa:openjdk-r/ppa

    sudo apt-get update

    sudo apt-get install openjdk-8-jre

    ```


    If you are one of those people who goes straight to the tutorial before reading
    the main article (you know who you are), rest assured both Oracle''s Java Runtime
    Environment and OpenJDK can live on the same machine happily together.


    Run the command sudo update-alternatives --config java if you want to change the
    default Java program to OpenJDK. Select the correct number, press ''Enter'', then
    restart your machine to apply your changes.


    # Tru lies


    TruPax in itself can only create encrypted containers for files and folders, then
    extract them all at once elsewhere. This isn''t very handy for day to day use,
    which is why we recommend using it in tandem with VeraCrypt.


    Unlike VeraCrypt, TruPax cannot create hidden volumes, whereby you can have two
    passwords for the container — one which you can give to an adversary and leads
    to harmless data and another which leads to your real files. You of course use
    VeraCrypt to create a hidden volume and copy your TruPax container there if you
    wish.


    If you follow the steps in ''TruPax Plus'' to increase the security of your container
    through adding key files, you won''t be able to extract the contents using TruPax.


    For more details about configuring TruPax, make sure to read the trupan_EN.html
    that you downloaded along with the program, or take yourself along to the developer''s
    website at www.coderslagoon.com.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_120_0.png)


    > By default, TruPax creates containers that are compatible with VeraCrypt''s
    TrueCrypt, which comes with a number of security flaws. So for safety, make sure
    to check ''For VeraCrypt'' when creating a volume.


    # Encrypting with TruPax


    ![](img/420a7272a6efa239082a35eeadd9bc1d_120_1.png)


    # 1 Download JRE & TruPax


    Open Terminal and add the PPA for Java with sudo add-apt-repository ppa:webupd8team/java.
    Next run sudo apt-get update and then sudo apt-get install default-jre oracle-java8-installer.
    Head to http://coderslagoon.com to download TruPax for your machine. Right click
    the file, choose ''Extract'', then use `cd` to navigate to its folder, eg, `cd
    /home/bodhi/Downloads/TruPax9A`.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_120_2.png)


    # 2 Launch TruPax


    Run `java -jar trupan.jar` to launch TruPax. Choose your language (German or English
    are the choices), Click ''Add Files'' or ''Add Folder'' to select data for encryption.
    Click ''Make Volume'' when you are ready to set a password. TruPax will ask you
    where to save the file and to set a name, such as `kittens.hc`. You can use any
    name that takes your fancy as an extension.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_120_3.png)


    # 3 Mount in VeraCrypt


    Launch VeraCrypt, then click ''Select File''. Navigate to your `TruPax` volume,
    then click ''Mount''. Enter the password you chose earlier. Find more information
    about your new volume by choosing Volumes > Volume Properties. This will show
    where the container is mounted, eg, `/dev/mapper/veracrypt2`. At this stage, you
    may wish to increase the security (see ''TruPax Plus'').




    Advanced | Easy file encryption'
