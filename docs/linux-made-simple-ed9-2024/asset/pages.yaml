- pgno: 128
  md: 'drivers in the gutenprint package – http://linuxprinting.org will tell you
    if you need this. HP provides open source drivers for its printers, so if you
    have an HP model, install the hplip package to make all HP printer and scanner
    drivers available. Other manufacturers provide closed source binary packages.
    Check whether your distro supplies these as a package, or otherwise, as a last
    resort, you will need to download and install them by following the instructions
    on the printer manufacturer''s website.


    Once you have the proper drivers installed, you can set up the printer using either
    your distribution''s printer administration tool or the CUPS web interface. To
    use the latter, which will work on any distro, point your browser at https://localhost:631,
    log in if asked, click on the Administration tab, then Add Printer and follow
    the prompts, bearing in mind the information you already have about the best driver
    to use.


    # The solid option


    **Q** I''d like to replace my hard drive with an SSD. How do I set it up and is
    there anything I need to be careful of? I''m thinking about the problems caused
    by writing to flash memory too often. What about TRIM?


    **A** There isn''t much different to be done with setting up an SSD compared with
    a spinning drive these days. Disk partitioning tools default to values that are
    safe for both types of drive now. Most of the data around now suggests that an
    SSD is capable of outlasting a spinning drive. However, it won''t hurt to add
    noatime to your mount options in /etc/fstab, if you don''t already: it gives a
    speed boost too. You have a couple of options for copying the data.


    You could back up your home directory and do a fresh installation on the SSD,
    or you could copy everything across. You should boot from a live CD to do that,
    and use a SATA to USB adapter if you don''t have a spare SATA port. Mount each
    partition, apart from swap, in both drives, and use rsync to copy everything across
    for each partition:


    ```

    rsync -a /mnt/old_partition/ /mnt/new_partition/

    ```


    You''ll also need to reinstall GRub to the bootloader, by booting something like
    Rescueware with only the new drive in the computer. TRIM, cleaning up no-longer-used
    areas of the storage, can be done in two ways. The easiest is to add relatime,discard
    to the mount options in /etc/fstab.


    The only drawback, however, is that this can slow the drive down while trim operations
    are ongoing, so many prefer to run fstrim when the computer is lightly loaded.
    A Cron task that runs fstrim –all once a week should be enough for most usage.
    The –all option trims all filesystems that support it and silently ignores others.
    Add the –verbose option and Cron will mail you a summary of what was done.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_128_0.png)


    **I** If you want to wipe a hard disk beyond all hope of recovery, Darik''s Boot
    and Nuke (DBAN) is a good option.


    # Deleting files for real


    **Q** I would like to make sure my hard drive is completely wiped before disposing
    of it. I understand that simply deleting all files is not enough, so what should
    I do to clear all traces of my data from the drive?


    **A** It depends on how you intend to dispose of the drive. If you are throwing
    it away, a large hammer is pretty terminal to your data, but there are more sophisticated
    ways of securely clearing a drive, methods that also leave the drive in a state
    suitable for resale.


    You are right in thinking that deleting files isn''t enough, as that only removes
    your entries from the directory table, and the data is still there. You need to
    overwrite all the data on the drive. Conventional wisdom states that you need
    to do this several times, overwriting with different patterns, or random data,
    to prevent even the most determined of data recovery attempts. For most purposes,
    overwriting the drive with zeroes will do:


    ```

    sudo dd if=/dev/zero of=/dev/sdb bs=4k

    ```


    This cannot be run on the system drive, so if that''s the one that you wish to
    wipe, you''ll need to run the command from a live CD instead. You can give yourself
    further peace of mind by adding in some random data, by using /dev/random instead
    of /dev/zero. Be aware that the dd command doesn''t ask if you are sure or double-check
    to see if you''ve given it the right device before pressing Enter – there are
    no second chances here.


    If you still want to go down the route of multiple overwrites for peace of mind,
    try Darik''s Boot and Nuke (DBAN) live CD from http://www.dban.org, which is the
    next most effective thing to that large hammer you''re waving about.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_128_1.png)


    +   Partitioning a new SSD, or any type of hard disk, is easy with Gparted – most
    distros and live CDs include it.


    > “Most of the data around now suggests that an SSD is capable of outlasting a
    spinning drive.”'
  merge: -1
  img_proc: true
- pgno: 129
  md: "# System issues\n\nFix common difficulties with general system admin.\n\n#\
    \ Drive filling up\n\n> I am running out of space on my hard drive – the space\
    \ just seems to be disappearing. Where did it go and how can I get it back?\n\n\
    A If you have more than one partition, the first step is to see which is affected,\
    \ with the `df` command:\n\n```\n`df -h`\n```\n\nThis shows the total, used and\
    \ available space on each partition. If you have a separate /home, you now know\
    \ whether it’s your home directory or the system root that’s filling up. The steps\
    \ taken are the same in each case, although you need to be root to clean up the\
    \ system directories.\n\nFor the system files, the usual culprits are /tmp and\
    \ /var. The first is used for temporary files, but sometimes old files get left\
    \ in here, especially when processes fail without cleaning up. /var/log contains\
    \ system log files and can fill up, particularly if a process is logging lots\
    \ of errors. Look at the contents of any large files in here before you deal with\
    \ them.\n\nIt’s worth installing logrotate, which keeps your log files under control.\
    \ Its default setup starts a new log file each week and compresses the last one,\
    \ keeping the last four weeks of logs. This can save a huge amount of space.\n\
    \nIn your home directory, check your downloads folder, your browser and mailer\
    \ caches and also the .cache directory. You can use du to check the sizes of directories:\n\
    \n```\n`du -sh * | sort -h`\n```\n\nlists everything in size order. If you want\
    \ to check on hidden directories, use:\n\n```\n`du -sh .[0-9a-z]* | sort -h`\n\
    ```\n\nThere are also graphical tools to visualise disk usage – Filelight for\
    \ KDE and Disk Usage Analyser for Gnome – while Bleachbit is good for identifying\
    \ and cleaning up unnecessary files, like browser caches and other temporary files.\n\
    \n![](img/420a7272a6efa239082a35eeadd9bc1d_129_0.png)\n\nFilelight, like Gnome\
    \ Disk Usage Analyser, can give you a good graphical representation of how you\
    \ managed to fill that hard drive.\n\n# Where has all my memory gone?\n\n> I have\
    \ noticed that after running Linux for a while, I’ve hardly any memory left. Where\
    \ is it going? How can I find the culprit and what can I do about it?\n\nA This\
    \ is actually perfectly normal and the way Linux is designed to work. Free memory\
    \ is memory that’s doing nothing when it could be helping the performance of your\
    \ computer. The Linux kernel allocates memory that isn’t in active use by processes\
    \ to things, such as filesystem caches in order to improve performance. You can\
    \ see this by looking at the output from free -t.\n\n```\n```\n              total\
    \   used    free    shared   buffers   cached\nMem:        15G   15G   128M  \
    \   982M    396M   13G\n-/+ buffers/cache:    23G     13G\n```\n```\n\nOn a computer\
    \ fitted with 16GB of physical memory, only 128MB is reported as free. Of the\
    \ memory in use, 13GB of it is in use as buffers. These greatly speed up disk\
    \ access by caching written data in memory and reading in more than you need in\
    \ anticipation of your next read. If this memory is needed for anything more important,\
    \ it will be released immediately.\n\n# Looking for trouble\n\nLinux logs just\
    \ about everything. When something goes wrong, these logs are the places to look.\
    \ The system log is in /var/log and usually called messages or syslog, depending\
    \ on the logger used by your distro. If program foo is misbehaving, try looking\
    \ for messages with:\n\n```\n`grep foo /var/log/messages`\n```\n\nYou can also\
    \ look at the log messages in real time with\n\n```\n`tail -f /var/log/messages`\n\
    ```\n\nwhich will display new entries to the log as they appear (-f means follow).\
    \ Run this in a terminal and then do whatever is causing your problems to see\
    \ what it says. The kernel buffer can be read with the dmesg command, which is\
    \ useful if you’re having difficulties with hardware. It too has a “follow” option\n\
    \n```\n`dmesg --follow`\n```\n\nwhich is useful when dealing with hot-plugged\
    \ hardware. To see how built-in hardware is detected and handled at boot time,\
    \ run\n\n```\n`dmesg | less`\n```\n\nafter booting, then either scroll through\
    \ the messages or, as there are a lot, press / to search for something relevant.\
    \ If your distro uses systemd, log entries can be displayed with journalctl –\
    \ you can do the same follow stuff with journalctl -f or\n\n```\n`journalctl -b\
    \ -p err`\n```\n\nor look for errors since the last boot with:"
  merge: -1
