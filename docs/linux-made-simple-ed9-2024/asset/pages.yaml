  md: "# Exploring the Gigolo interface\n\n+   * **Change view**\n+   \n+   Gigolo’s\
    \ default view is a bit bare: select Edit > Preferences > Interface tab. Tick\
    \ ‘Show side panel’ and set ‘Connect List Mode’ to ‘Detailed List.’\n+   \n+ \
    \  * **Shortcut heaven**\n+   \n+   Click either of these two buttons to open\
    \ the shared folder in Files or Terminal – a handy time saver when managing files.\n\
    +   \n+   * **Quick connection**\n+   \n+   Gigolo can also be used to quickly\
    \ connect to non-mounted drives – just tick the box to make the connection..\n\
    \n![](img/420a7272a6efa239082a35eeadd9bc1d_100_0.png)\n\n+   * **Browse network**\n\
    +   \n+   Select the ‘Network’ tab and Gigolo will scan your local network – you’ll\
    \ be prompted to log in to each folder it finds (click Cancel to skip).\n+   \n\
    +   * **Add bookmark**\n+   \n+   Connect to your shared folder first so it appears\
    \ in Gigolo’s main window, then right-click its entry and choose ‘Create Bookmark.’\n\
    +   \n+   * **Configure bookmark**\n+   \n+   You can configure shares to mount\
    \ automatically with Gigolo (or when Ubuntu boots) – tick the ‘Auto-Connect’ box\
    \ when setting it up.\n\nTick the ‘Start minimized in the Notification Area’ panel\
    \ and click Close.\n\n# Share folders with others\n\nIf you want to set up a shared\
    \ folder on your Ubuntu PC, the steps can be simple or complicated depending on\
    \ your needs. Thanks to Ubuntu’s granular use of file permissions, you can tie\
    \ yourself in knots trying to set up folders that only specific people can access.\
    \ Thankfully, if you want to set up a folder for public access (no password required),\
    \ or you want to set up a folder that requires your own Ubuntu username and password\
    \ to access, then things are a lot less complicated.\n\nFirst, you’ll need to\
    \ install two additional packages before you can start sharing folders. Open a\
    \ Terminal window and type the following two commands:\n\n```\nsudo apt-get install\
    \ samba\nsudo apt-get install libpam-smbpass\n```\n\nReboot – when you log in,\
    \ you may see a message telling you that your user profile has been added to Samba’s\
    \ file sharing group. Now browse to the folder you wish to share – for simplicity’s\
    \ sake (and to ensure you have all the right permissions), make sure this is a\
    \ folder stored inside your personal Home folder. Right-click it and choose Properties,\
    \ then switch to the ‘Local Network Share’ tab. Tick ‘Share this folder’ – then\
    \ – if required – choose a different share name for the folder to make it easier\
    \ to identify on the network (you can also add a comment to the folder to make\
    \ it easier to identify).\n\nIf you’re happy to open up your folder to anyone\
    \ on your network, then ticking the ‘Guest access...’ box under the ‘Local Network\
    \ Share’ tab of the shared folder’s properties is sufficient. If you want to restrict\
    \ the shared folder to yourself, leave this unticked – anyone attempting to access\
    \ this shared folder will need to know your Ubuntu username and password to access\
    \ it.\n\nNext, decide whether users can copy files to the folder as well as delete\
    \ those within it (tick the ‘Allow others to create and delete files in this folder’\
    \ box), click ‘Create Share’ or ‘Modify Share’ followed by ‘Add the permissions\
    \ automatically’ if prompted and you’re done: the folder should now be visible\
    \ and accessible over the network to all other connected computers, including\
    \ Apple Macs and Windows PCs. You should also see a two-way arrow appear on the\
    \ folder icon to indicate it’s now being shared.\n\n# Beyond the basics\n\nBy\
    \ default, your PC’s Windows network workgroup is WORKGROUP. If your other computers\
    \ are on a different workgroup you can change this by opening Terminal and typing\
    \ the following command:\n\n```\nsudo nano /etc/samba/smb.conf\n```\n\nA text\
    \ editor will open. Use the cursor keys to scroll down to the [global] section\
    \ and change the following line to match your workgroup name:\n\n```\nworkgroup\
    \ = WORKGROUP\n```\n\nPress [Ctrl] + [O] and hit [Enter] to save the file, press\
    \ [Ctrl] + [X] to quit `nano` and then reboot your PC. When you log back in, you’ll\
    \ be on the correct workgroup, which will make it easier for other PCs to see\
    \ you.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_100_1.png)\n\nConfiguring your\
    \ own folder shares is relatively simple, as long as you keep your ambitions in\
    \ check somewhat.\n\n# Quick tip\n\nIf you’re looking to take your network sharing\
    \ to the next level, take a look at the GADMIN-SAMBA package, available through\
    \ the Software Centre. This allows you to set up custom user profiles for sharing\
    \ folders."
