- pgno: 113
  md: '# Ubuntu: Fix start-up issues


    It’s all gone wrong. Of course it has. Here’s how to resolve issues with non-booting
    PCs without having to reach for the panic button (or a hammer).


    > If you’re struggling to get the Boot-Repair tool disc to boot, experiment with
    the various fail-safe boot options.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_113_0.png)


    Start-up problems. That moment when – having expected yourself to be getting on
    with your day’s work or entertainment – you find yourself staring at a cryptic
    error message, or even worse, a blank screen. No matter how many times you press
    reset or restart, the same impenetrable barrier blocks your path. So, what can
    you do?


    Start-up problems come in all shapes and sizes, and they can be difficult to track
    down. There are, however, some sound principles to use that will resolve many
    errors, and in this tutorial, we’re going to look at the tools and techniques
    required to troubleshoot most start-up problems. You should start by examining
    how the boot process works (see *The Boot process box*, p12). This reveals that
    the boot process can be split into three broad stages centred around the Grub
    2 boot loader; pre-Grub, Grub and post-Grub. Knowing this allows you to focus
    your troubleshooting efforts based on where in the process the error or freeze
    occurs.


    Let’s start at the beginning. You switch on your PC. If power comes on, but nothing
    else happens, chances are you’ve a hardware issue to sort – if you recently poked
    around the innards of your PC, then check everything is connected correctly. If
    not, unplug all external devices except your keyboard and try again. If this doesn’t
    work, open the case carefully and disconnect your internal drives too. If the
    computer now boots to the splash screen, you can try reconnecting the internal
    drives and trying again: if you’re now able to boot to the login screen, shut
    down your PC and start reconnecting your external peripherals to see if the problem
    has cleared itself or can be targeted to a single device. If things take you a
    different cable, or go online and Google for known boot problems involving that
    device.


    If you’re lucky, your motherboard will emit a series of beeps or flashing lights
    you can use – again by enlisting the help of the internet – to identify the likely
    problem. This may involve replacing a component or something more drastic.


    If you’re able to get as far as your PC’s splash screen, but then your computer
    hangs or a ‘missing operating system’ error message appears, then first think
    back to any recent changes. If you’ve overclocked your PC, eg, you should now
    enter the system EFI or BIOS and look for the option to load fail-safe defaults.
    Try rebooting again. If this fails, then the problem is likely to be with your
    hard drive, and so the first place to look are the MBR and Grub. If Grub isn’t
    set to automatically appear when your PC starts, try rebooting while holding the
    Shift key or tapping Esc to bring up the Grub boot menu to confirm it’s not able
    to even load itself. Jump to the Boot-Repair tool section once you’ve verified
    it’s nowhere to be found. If Grub is able to load, but can’t find any bootable
    OS you’ll find yourself with a number of scenarios: you may be presented with
    a basic command prompt such as **grub** or **grub rescue**, which indicates one
    or more files required by Grub are missing or corrupt. You may get a specific
    error'
