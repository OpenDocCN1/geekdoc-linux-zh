  md: '# # Files: Navigation made easy


    Puzzled about structure? Find out how the Linux file system works, plus the best
    way to browse it using Ubuntu''s built-in file manager.


    We''ve seen how Linux identifies the drives attached to your PC, and you''ve also
    discovered that Linux treats everything as a file – including folders (which is
    basically a file listing the files that make up that folder''s contents). But
    how are these files organised on your hard drive, and how do you access them through
    Ubuntu''s graphical file manager, Nautilus? Let''s start with the raw basics.
    Linux organises files in a tree-like structure that''s a little bit similar to
    Windows, the major difference being that while Windows physically separates drives
    into individual trees, with the drive letter at the top, Linux lumps everything
    together in a single file tree, with a top-level root ( / ) directory and everything
    else – including drives – placed relative to that directory. This can sound confusing,
    but in actual fact Linux provides a consistent, organised view of all the storage
    on your disposal. Once you understand where things are kept, it''s relatively
    straightforward finding them again. And, in actual fact, for day-to-day use, you''ll
    limit yourself to your personal user folder, which is always found inside the
    /home directory and is where your personal documents, photos, settings and other
    data is stored.


    What makes things even easier to grasp is that Ubuntu ships with a user-friendly
    file manager in the form of Nautilus, which is accessible via the Files shortcut
    in the launcher. Nautilus will feel instantly familiar to anyone who''s used Windows
    own file manager, Windows Explorer, and shares many of the same characteristics.
    Files and folders are represented by icons, and double-clicking one opens it.
    You can right-click for more options, while files can be deleted to the Recycle
    Bin or removed immediately (select the file, hold [Shift] and press [Delete])
    in exactly the same way. The annotation opposite reveals some of the key fundamentals
    in using Nautilus to access and find files within the Linux file system.


    # ## What lies beneath


    Let''s use Nautilus now to identify the key folders on your system, and find out
    what they''re for. Open it using the Files shortcut on the launcher and by default
    it''ll open to your personal home folder – /home/ *username* – in the Linux file
    tree. Here you''ll find familiar looking folders that mirror those found in other
    operating systems: they''re all self-explanatory, aside perhaps from Public –
    a folder inside which you can store files that are accessible to others when they''re
    logged on with their own user profile – and Examples. This is simply a shortcut
    to a folder containing the ''Ubuntu Free Culture Showcase'', which aims to provide
    free wallpaper, music and video. Next, click the Computer shortcut in the left-hand
    navigation pane and you''ll be taken to the root directory where you''ll see a
    large number of folders. Not all of these need explaining, but of those that do,
    the /bin folder is where common programs shared by all users (including root and
    the system itself) are installed – this includes all Terminal programs. Startup
    files – including the Linux kernel – are held under /boot, while you will already
    see how /dev contains references to your system''s hardware including all attached
    storage devices. The /etc folder contains many configuration files, while the
    various /lib folders contain program configuration data – similar to what''s held
    in the Windows Registry. External


    ![](img/420a7272a6efa239082a35eeadd9bc1d_89_0.png)


    ) You won''t need to spend much – if any – time navigating the top level directory
    of Ubuntu''s file system.


    **Quick tip**

    Don''t be surprised to find lots of hidden files – even inside your home directory
    – after you''ve selected View > Show Hidden Files. Don''t worry, this is normal,
    and the best thing to do is select the option again to hide them.'
