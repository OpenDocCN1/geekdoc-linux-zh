  md: '![](img/420a7272a6efa239082a35eeadd9bc1d_123_0.png)


    # 6 列表


    了解控制台的钥匙在于你所在的路径（见下方的 *Path* 框），它会告诉你你当前在文件夹结构中所在的位置。但是你如何使用你所知道的当前位置信息呢？很容易。使用
    `ls`。`ls` 命令会列出当前路径内你有权查看的文件，并允许你进行简单的浏览。如果有很多文件需要列出，`ls` 会在每页末尾自动暂停。


    # 7 拼接


    如果你在遵循在线指示（例如，在 Linux 中配置 Nginx），你可能会看到 `cat` 这个命令。如果你不确定自己是否知道，`cat` 是 *concatenate*（拼接）的缩写，用来组合文件。最简单的用法是将
    `file1.txt` 和 `file2.txt` 合并成 `file1`。它也可以与 `>` 符号结合使用来创建文件，或者与 `|` 符号结合使用来在搜索中查找模式或单词。


    在 Linux 中，`cat` 经常被用来查看单个文件——如果你不指定输出文件名，`cat` 会将文件内容打印到终端屏幕上。在线使用 `cat` 的快捷方式是把它当作在终端中查找文本并显示结果的搜索工具。这是因为它**破坏性小**，并且很难意外使用
    `cat` 来改变文件（除非你使用其他命令来移动内容）。


    Nano 不是唯一的终端文本编辑器，但它**是最容易使用的**。


    # 8 查找


    有用且容易使用的命令。`find` 命令是自助式的，不需要你查找。输入它本身就像 `ls`，但它会列出当前路径以及子目录中的文件。


    ![](img/420a7272a6efa239082a35eeadd9bc1d_123_1.png)


    当前目录。你可以使用它来查找符合 `filename.*` 格式的文件名。指定路径时，`name` 可以是通配符或特定文件夹。更改 `name` 选项可以按日期查找最后修改的文件。


    # 9 磁盘占用


    你可能最需要的信息是磁盘空间：`df` 让你知道你的服务器有哪些可用的磁盘空间和使用情况。它显示了挂载在系统上的所有卷，`df -h` 显示人类可读的卷大小，例如
    MB、GB。


    # 10 更新与升级


    可能是单个你作为新用户可以学到最重要的命令：保持 Linux 盒子里的包更新，以便自动处理安全漏洞。


    简单的 `sudo apt-get update` 会让系统检查最新应用程序版本，而 `sudo apt-get upgrade` 会下载并安装它们。


    对大多数人来说，定期运行这些是安全的，但有时更新单个软件包是破坏性的，需要更安全的做法……


    # 11 抓取


    计算机命令中有一个被新来者低估的，那就是 `grep`——这是 `grep` 在 Linux 中最常见的用途：查找包含模式的文件。在文件中使用通配符查找，比如
    `grep`。


    # 12 置顶


    当你在图形用户界面（例如 Linux 桌面或 Windows 桌面）中工作时，你总是可以使用 *系统监视器* 或 *任务管理器* 来检查正在运行的应用程序并管理进程详细信息。`top`
    是命令行版本，用于查找 CPU 使用率最高的程序，并关闭正在干扰你的程序。


    和大多数命令一样，`top` 不会立即显示你需要的，你只需键入一次 `top`，关闭终端，并使用 Ctrl+C 返回提示符。


    # 路径


    打开终端窗口时，*路径* 可能会有点令人困惑。不过，它位于闪烁的插入符前面，告诉你目前身在何处。第一个词是登录名（以 `@` 符号结尾）。第二个词是机器名。如果你在自己的桌面上打开终端，通常用户名和主机名相同。我们可能说
    `myname@mytheme`。如果你登录远程服务器，它们会不同。


    这个信息由冒号分隔，冒号后面是路径。当你第一次打开终端时，它会显示你的用户名：`youname`：`$` 的“`$`”表示你在你的*主目录*下。如果冒号后面是“`#`”，表示你是
    root 用户。使用 `cd` 进行移动，路径会随你的移动而变化。'
  merge: -1
