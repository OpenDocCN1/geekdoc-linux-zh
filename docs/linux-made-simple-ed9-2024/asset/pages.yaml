- pgno: 67
  md: '# # Gimp: Editing photographs


    Think you need professional tools to do a professional job? Think again: Linux
    includes the best free photo editor around.


    # Quick tip


    For those who like to shoot in **RAW** mode on their cameras, there’s two excellent
    options for processing on Linux. Darktable is a fully open source **RAW** editor
    you’ll find in the Ubuntu repositories, while Corel’s AfterShot Pro is a well-supported
    commercial contender.


    There’s one name which dominates digital photo editing all around the world. Adobe,
    and more specifically its Photoshop package, has been so popular for so long it’s
    synonymous with the task and has become a verb. To “Photoshop” a picture is the
    same as conflatting “to Google” for internet search or “to Hoover” for vacuuming
    the floor.


    The bad news is that the vast majority of Adobe products aren’t available on Linux
    operating systems. Photoshop certainly isn’t and probably never will be.


    Is that it then? The joys of Ubuntu and its ilk are not for photographers or those
    who like to tweak and digitally develop their snaps before sharing them with the
    world? Of course it doesn’t.


    # ## Get your Gimp on


    If you’ve been on Windows most people who “Photoshop” their pictures aren’t using
    Photoshop. It’s an expensive piece of software after all and there’s lots of alternatives.
    One of the best, which is available on Windows and Linux, is the wonderfully named
    **GNU Image Manipulation Program**.


    Gimp is astonishingly powerful, so much so that it really is almost as feature
    rich as Photoshop and certainly as capable for almost every task. It’s installed
    by default in Ubuntu, but if you don’t have it you’ll find it in the Software
    Centre.


    When you first open Gimp up, it can be a little intimidating. This is a professional
    piece of software and designed to be used by professionals. Don’t be put off though,
    it’s easy to get a grasp of the basics.


    The first thing you’ll notice is that not one but three windows have appeared
    on your desktop. In the classic layout, you’ll find the tools menu in a thin window
    on the left, the main workspace in the middle and a window for extra controls
    like layers, colour channels and brushes on the right. It can be tricky at first
    to work in three different windows simultaneously, and there’s an option to display
    everything in one Window if this is putting you off. Just go to **Windows** and
    tick **Single Window Mode**. This will give you a simpler layout that you may
    be more accustomed too.


    If you can bear with it, however, we’d strongly advise sticking to separate windows
    for all the docks. It allows you to create a working area on your desktop that’s
    exactly customised for your needs, and if you have more than one monitor you can
    put the tools on one screen with the image full width on another.


    # ## Colour correction


    Gimp is, as we’ve said, a very powerful piece of software. It includes tools for
    cutting out parts of an image, creating layer masks, the classic clone and heal
    brushes loved by art editors for removing traces of humanity from a model’s skin
    and a wide range of filters and plugins – plus support for more – for adding effects
    and pushing pixels into submission.


    To get you started, though, here’s an easy exercise in brightening up an underexposed
    photo. First, we’ll need to get your photo into Gimp. A quick note – while Gimp
    does support RAW files from cameras, we wouldn’t recommend it. Better to convert
    your image to JPEG, TIF or PNG first.


    Now you can put your pic up just by dragging its icon from the Files browser over
    the Gimp launcher or into the workspace itself if Gimp is already running. You
    can also open an image using the File menu if you prefer.


    Our underexposed image is a little dark, but we’re not just going to increase
    the brightness. That would be crude and have the effect of removing some of the
    dynamic range leaving you with a flat, washed out looking shot. We want to try
    and keep rich shadows and preserve as much detail without leaving the picture
    looking washed out.


    The way to do this is to click on **Colours** and select **Levels**. This is the
    tool that professionals use to correct exposure. What you can see is a histogram
    which describes the “tonal range” of your image. The left side of the graph represents
    the amount of pixels in dark areas of the shot, and the right side light.


    You’ll notice three markers under the graph: one at either end and one in the
    middle. A well exposed shot will have readings all the way along the tonal range,
    depending on the contrast in the image captured. If a photo is underexposed,


    ![](img/420a7272a6efa239082a35eeadd9bc1d_67_0.png)


    The Levels dialogue is the first port of call for photo fixing.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # Gimp key features


    **Filters**

    The Filters menu has a host of tools for everything from adding blur to cartoonry
    frames.


    **Tools**

    The tools are a standard photo editing kitbag. Everything you''d expect is here.


    **Options**

    Beneath the tools themselves you''ll find a full array of customisation options
    for tweaking their use.


    **Layers**

    The Layers window acts much the same as Photoshop. You can split an image, add
    extra layers and edit areas here.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_68_0.png)


    however, all the readings will be bunched up at the left-hand side of the graph
    with a tail line towards the right. The best way to correct this is to drag the
    marker from the right towards the area where the tonal values kick in, reducing
    the tonal range of the image to those values that have readings.


    If you''re lucky, this will brighten the picture without destroying detail. Because
    the midpoint will also automatically adjust, it should retain a good contrast
    too, which merely changing the brightness would wash out.


    As if that wasn''t enough, this single tools can also act to correct the ''white
    balance'' of your picture. If you''ve taken a photo indoors, for example, you
    might have captured a yellow cast from the overhead lights. To remove this, you
    can use one of the three pipette symbols in the same Levels dialogue.


    From left to right, these allow you to select the black point, gray point and
    white point of an image. Gimp will work out what the other colours should look
    like from there.


    The white point is the easiest to use – just click it then zoom in on a detail
    you know should be close to pure white. Teeth or eyes are are good, as are clothes
    or table clothes. Select that as your white point and watch the whole image adjust
    to something more natural looking.


    And don''t worry if you don''t get it right first time. Just click on an different
    part of the image or the Reset button if all goes wrong.


    That''s really just scratching the surface of what Gimp can do. In the basic toolbox
    you can scale images, select areas, draw paths, rotate or add text. The only way
    to learn more is to try it out.


    > **Quick tip**

    > Remember that for quick photo fixes there are tons of online photo editors that
    work in a Linux browser just as well as they do in Windows. Photo.com is the best
    known, and great for quickly fixing red eye and so on.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_68_1.png)


    ) Gimp''s Unsharp Mask is every bit as good at picking up detail in images as
    Photoshop''s.'
