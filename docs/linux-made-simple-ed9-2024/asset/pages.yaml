- pgno: 127
  md: '# # Hardware difficulties

    Solving problems with recalcitrant bits of kit.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_127_0.png)


    # » Finding hardware drivers


    > > **Q** Where do I get drivers for my hardware?

    > >

    > > **Q** The accompanying disc includes Windows drivers only.


    **A** Most hardware doesn’t need separate drivers with Linux; the kernel includes
    drivers for a massive range of hardware. Nine times out of ten, the kernel recognises
    the hardware when you plug it in and loads the appropriate driver without any
    input from you. Some hardware does have separate drivers, often because they use
    proprietary code that cannot be included with the kernel. In such cases, a live
    CD, such as Knoppix or System Rescue CD, will often recognise the device – these
    tend to include a lot of extra drivers. If the hardware is an internal device,
    it will usually show up in the output from **lspci**, and adding the **-k** option
    shows which driver is being used.


    Once you know that, you can search for which package provides that driver, either
    using your package manager or a web search. If it’s in a standard package that’s
    not installed by default, as is the case with many wireless drivers, installing
    the package should be all you need to get the hardware working. The process is
    similar with USB devices except you use the **lsusb** command, and there is no
    handy **-k** equivalent. Note that on some systems, these can only be run as root.
    If there’s no driver support by your kernel or package manager, you have to enter
    the murky waters of downloading and installing drivers directly from a manufacturer’s
    website. If they provide a **Deb** or **RPM** package suitable for your system,
    this isn’t too bad. Otherwise, make sure you get the right driver for your architecture
    and follow the installation instructions carefully. Drivers have to be linked
    into the kernel, so you will probably need the kernel source and build-essential
    packages installed.


    # Random crashes


    > > **Q** My computer is suffering from random crashes and lockups – it doesn’t
    seem to be related to any particular piece of software.


    **A** This may well be a hardware issue and there are a number of common causes.
    Faulty memory can cause this and, because of the way **Linux** makes use of all
    available memory, it is more likely to do so in **Linux** than **Windows**. Install
    **Memtester** from the terminal with **sudo apt-get install memtester**. Let this
    run for at least a couple of passes, preferably overnight. Overheating is also
    a common cause: try running a system monitor or **Taskbar** applet that shows
    your system temperature. Make sure all vents are clear and, if you are comfortable
    with taking a screwdriver to your case, check that your **CPU** heatsink and fan
    are not clogged.


    A third cause, for desktop computers, is a substandard power supply. Cheap units
    can often fail gradually, giving just this sort of behaviour and damaging other
    components on their way down. The only reliable test is to try a different **PSU**.


    # Printer problems


    > > **Q** My distribution hasn’t spotted my printer. How do I install the drivers?


    **A** How you install drivers – or even if there are any available – depends on
    your printer. The first place to go is [http://linuxprinting.org](http://linuxprinting.org)
    to check their database. If you do this before buying a printer, it will save
    you a lot of trouble. Enter the make and model of printer and their database will
    tell you if it is supported, and which drivers to use. **CUPS**, the printing
    system used by **Linux**, comes with many users, so there’s often no need to install
    anything. There are further


    ![](img/420a7272a6efa239082a35eeadd9bc1d_127_1.png)


    > > » While most distributions have a GUI for managing printers, the CUPS user
    interface is universal and works well.


    # Why use the terminal?


    Much of the advice we give here is in the form of terminal commands. While most
    distros have their own configuration programs, they vary considerably while the
    underlying commands they call remain constant across all distros. By cutting out
    the middle man and running those commands directly, the solutions we give are
    portable across all distros. It also means they work even if your problem is preventing
    the desktop from running.


    Some commands need to be run as the root user, which is done either by prefixing
    the command with **sudo** (when you will be prompted to give your password) or
    by running **su** in the terminal first, which will ask you for the root password.
    We encourage you to use the sudo method throughout this article, as it is the
    only option with some distros. If you have full root access through **su**, simply
    run the command without **sudo**. Commands given without **sudo** should be run
    as your normal user.'
  merge: -1
