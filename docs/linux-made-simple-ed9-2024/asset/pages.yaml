    \ in `/etc/default/grub`, saving the file and updating Grub with one of these\
    \ commands. Which one depends on your distro – if the first one fails, try the\
    \ second and then the third.\n+   \n\n```\n```\nsudo update-grub2\nsudo grub2-mkconfig\
    \ -o /boot/grub2/grub.cfg\nsudo grub2-mkconfig -o /boot/grub/grub.cfg\n```\n\n\
    ```\n\n# Re-installing Windows broke Linux\n\n\nI installed Linux on my Windows\
    \ computer and it gave me the choice of which to use when I turned it on. I recently\
    \ had to reinstall Windows and now Linux has disappeared. I don't want to reinstall\
    \ Linux as I would lose all my documents and settings. Is there any way to get\
    \ my Linux back?\n\n\nLinux uses the Grub bootloader to choose between different\
    \ boot options, but Windows uses its own bootloader. A bootloader is a small piece\
    \ of code embedded at the start of your hard drive that kickstarts the process\
    \ of loading your operating system. When you installed Windows, it installed its\
    \ own bootloader, overwriting your existing Grub. Don't worry, it's only the bootloader\
    \ code that's gone – your Linux system and files are still there, and all you\
    \ need to do is restore Grub. Some distro install discs have an option to repair\
    \ the bootloader, or there's a more generic option in Rescatux (www.supergrubdisk.org/rescatux).\
    \ Boot from the Rescatux CD and select the Restore Grub option. This will search\
    \ for your Linux partitions and ask you to choose the partition that contains\
    \ the root filesystem of your Linux installation and then ask which hard disk\
    \ you want to install Grub on – usually /dev/sda, the first disk. The window may\
    \ go blank for a worrying amount of time but do not panic or reboot: wait until\
    \ it tells you Grub was re-installed before rebooting, and you should then get\
    \ your old boot menu back, with access to your untouched Linux system.\n\n\n#\
    \ Dual-booting more than one distro\n\n\nI know I can dual-boot between Linux\
    \ and Windows, but can I do the same with more than one Linux distro? If so, how\
    \ do I share my data between them?\n\n\n**How should I partition my disk?**\n\n\
    \nYes, it is possible. Each distro needs its own **root** partition but you can\
    \ share the same **swap** between them all. Having a separate partition for /home\
    \ is recommended – you don't want to tie your data to a single distro you may\
    \ later decide to stop using. While a separate /home partition is desirable, don't\
    \ use the same **home** directory for each distro as there may be incompatibilities\
    \ between different versions of the software used. I prefer to put the distro\
    \ name in the username, as in “fred-ubuntu”, “fred-debian”, etc. As long as each\
    \ user has the same UID – most installers make the first user 1000 – you'll have\
    \ write access to all of them, then you can create symlinks for important data\
    \ directories, like documents, music, photos and so on, to share these files between\
    \ all distros while keeping the configuration files separate.\n\n\nAs far as the\
    \ boot menu is concerned, pick one distro as your main one and let that handle\
    \ booting. Every time you install a new distro, skip the option to install a bootloader\
    \ if possible. Then reboot into the main one and run:\n\n\n```\n```\nsudo grub-mkconfig\
    \ -o /boot/grub/grub.cfg\nsudo update the boot menu\n```\n\n```\n\n+   * To make\
    \ permanent changes to your Grub menu, edit `/etc/default/grub` and run `grub2-mkconfig`\
    \ or `update-grub`.\n+   \n\n# Removing a distro broke everything\n\n\nI deleted\
    \ Linux partitions from my computer, in preparation for installing something else.\
    \ Now I cannot boot it. All I get is a message that Grub cannot find files and\
    \ a prompt saying 'grub rescue> I can't even boot the Windows.\n\n\nWhile the\
    \ initial boot code for Grub is stored in the **Master Boot Record** (MBR) at\
    \ the start of your hard disk, this is a very small space. So the initial Grub\
    \ code loads files and configuration information from the `grub` or `grub2` directory\
    \ on your Linux boot partition. When you removed that partition, you left Grub\
    \ nowhere to go. If you are planning on installing another distro in the now-empty\
    \ space, simply run the installer and it will set up Grub for you, detecting your\
    \ Windows system too, and all will be well after a reboot.\n\n\nIf you are using\
    \ the space for an existing Windows or Linux installation, you need to either\
    \ set up Grub for the other Linux system or reinstall the Windows bootloader.\
    \ The easiest way to reset Grub is use the Restore Grub option on the **Rescatux**\
    \ live CD – choose the Linux installation you want to be responsible for holding\
    \ the Grub files. Restoring the Windows bootloader involves booting the Windows\
    \ disc (or rescue partition) and running one of these commands, depending on the\
    \ Windows version. For Windows XP it's the following:\n\n\n```\n```\nfixboot\n\
    fixmbr\n```\n\n```\n\nFor Vista and Windows 7 and 8 it's:\n\n\n```\n```\nbootrec\
    \ /fixboot\nbootrec /fixmbr\nbootrec /rebuildbcd\n```\n\n```\n\nWhen your computer\
    \ won't even boot, a live CD is a godsend, so it pays to always have one handy.\
    \ A live CD is a complete Linux environment that boots from a CD and needs no\
    \ installation. Apart from being very handy, a live CD is ideal for a rescue system.\
    \ There are some dedicated rescue CDs, such as System Rescue CD, Rescatux and\
    \ Gnil, but most distro installer discs nowadays boot into a live environment\
    \ that contains enough software to fix many problems."
