- pgno: 90
  md: '# Exploring the Nautilus interface


    # Breadcrumbs


    As you drill through the folder tree, use these ‘breadcrumb’ folder icons to see
    where you are – click one to jump back to that folder.


    # Search


    This provides convenient shortcuts to key parts of your system – the top section
    is self-explanatory, and includes a handy list of recently accessed files.


    # Navigation pane


    You can find out how the drive has been partitioned by examining the ‘Partitioning’
    section of its summary. It’ll be GUID or MBR – see the main text for more information.


    # Attached drives


    All recognised drives – internal and external – are listed here. The ‘Computer’
    shortcut provides you with a link to the root of your Linux file system.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_90_0.png)


    # Bookmarks


    Drag folders into this section to create bookmarks for one-click access in the
    future. They’re the equivalent of Windows’ Quick Access menu.


    # Right-click


    Right-click a file or folder to reveal more options for interacting with it –
    ‘move to’ and ‘copy to’ options are particularly useful.


    drives are mounted inside the /media folder, while /mnt serves as a ‘temporary’
    mount point for devices like network folders.


    The /root is the home directory for the root user. It’s kept away from the main
    /home folder in case of boot problems and can only be accessed via the ‘sudo’
    command. Peek inside the /usr folder and you’ll find ‘bin’ and ‘lib’ folders –
    this is where programs you install under your own user profile are kept. Finally,
    the /var folder contains variable data that includes potentially helpful items
    such as logs for troubleshooting problems.


    This is all interesting, and useful to know, but it’s not something you should
    concern yourself with in day-to-day use.


    # Explore Nautilus


    Return to your home directory. Now roll your mouse up to the menu bar where you’d
    see if Nautilus has its own selection of menus. Browse these – File, Edit, View,
    Go, Bookmarks and Help – and you’ll see a list of familiar-looking commands, but
    some should stand out.


    Start with File > New Tab, which allows you to have multiple locations open without
    cluttering up your desktop with windows. You’ll see the tabs appear above the
    folder pane and you can move (or copy by holding [Ctrl] as you click and drag)
    files between them by picking them up in one tab, dragging them over another tab
    and then waiting for that tab to open before dropping them.


    Another handy tool can be found by choosing Edit > Select Items Matching… From
    here you can apply filters that ensure only particular files matching those filters
    (such as a file type – png, jpg and so on) are selected. While you’re exploring
    the Edit menu, select Preferences to tweak Nautilus’ behaviour – one particular
    interest will be the Display tab where you can add extra descriptive captions
    (such as file size or owner) under icons.


    You’ll also notice a reference to zoom here – by default, up to three captions
    can be displayed underneath icons depending on how large you’ve magnified the
    icons. You’ll find these controls on the View menu, or you can use [Ctrl] + [+],
    [Ctrl] + [-] and [Ctrl] + [0] to quickly adjust the zoom level.


    # Hidden files


    By default, Ubuntu will hide any file that’s preceded with a period (.) mark –
    right-click a file in Nautilus and choose Rename to see how this works, then press
    [Ctrl] + [R] to refresh the view, when you’ll see it disappear. Don’t panic –
    select View > Show Hidden Files and it’ll magically reappear, allowing you to
    rename it once again to remove the period mark and leave it permanently in view.


    Struggling to find a particular file? Click the magnifying glass button and a
    search bar will pop up. Simply enter your search terms and a list of matching
    files will appear – if you want to widen your search to your entire file system,
    click the ‘All files’ button.


    You can also apply file type filters to your search, to restrict results to documents,
    photos or whatever criteria you choose. Click the ‘+’ button, leave ‘File Type’
    selected and then either pick a type from the drop-down menu (such as Illustration,
    Spreadsheet or Pdf/Postscript), or manually type a specific file extension (such
    as .png) to the filter. Nautilus supports multiple filters, so you could easily
    search for .png, .jpg and .tif photos rather than including .gif or other image
    types, for example.


    # Quick tip


    If you don’t like the way Nautilus uses breadcrumbs to display the current folder
    path, select Go > Enter Location… to replace it with a traditional view, allowing
    you to manually enter the path to jump straight to that location.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_90_1.png)


    Customise what gets shown underneath files when browsing in Icon view – zoom into
    reveal more details.'
  merge: -1
  img_proc: true
- pgno: 91
  md: "# GParted: Set\nyour partitions\n\nDivide up your hard drive using partitioning\
    \ to protect your data and make Linux easier to work with.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_91_0.png)\n\
    \nnetwork, or setting up independent partitions for temporary files, your swap\
    \ file or even to run specific services like a web server. Whatever your needs,\
    \ partitioning can play a crucial step in improving performance as well as protecting\
    \ different parts of your drive from each other.\n\n# Partition types\n\nHard\
    \ drives are partitioned according to a scheme. There are two main types of scheme:\
    \ the older Master Boot Record (MBR), which is limited to the first 2TB of a hard\
    \ disk, and the newer GUID Partition Table (GPT). In both cases, partition information\
    \ is recorded physically in the first sector of the drive in a partition table\
    \ – GPT drives also store this information at the other end of the drive in the\
    \ last sector for redundancy purposes.\n\nOne of the limitations of the older\
    \ MBR scheme is that it only supports a maximum of four partitions, although one\
    \ of these can be an extended partition, which in turn can house multiple logical\
    \ volumes, bypassing this limit. GPT doesn't differentiate between primary and\
    \ extended (logical) partitions and supports up to 128 partitions per drive.\n\
    \nGPT is designed in conjunction with modern UEFI firmware, but in some cases\
    \ it can be backwards compatible with older legacy BIOS systems too. It's compulsory\
    \ if your drive is over 2TB in size, but ultimately which partition scheme you\
    \ use typically depends on what you already utilise. For simplicity's sake it's\
    \ usually best practice to stick with what's already there, and if you're planning\
    \ to wipe the drive completely clean and install Linux on it from scratch, let\
    \ your distro decide which scheme is best based on your current setup and make\
    \ sure that you stick with this setup post install.\n\nP\nartitioning allows you\
    \ to carve up a single physical hard drive into smaller, virtual drives known\
    \ as partitions or volumes. Each volume acts independently of the others, providing\
    \ a measure of redundancy for data spread across the drive. If one partition develops\
    \ problems then you can restore it without affecting what's stored elsewhere.\n\
    \nThis redundancy provides the first of a number of reasons to partition your\
    \ drive: it allows you to move your personal data (typically your **home** folder)\
    \ to another volume, so it's protected from any changes made to your system partition.\
    \ You can then use your Linux installation as a sandbox, rolling back any unwanted\
    \ changes without touching your data.\n\nAnother popular use for partitions is\
    \ to run multiple operating systems on a single PC. You could run two versions\
    \ of Linux side-by-side or set up a dual-boot Windows/Linux machine for compatibility\
    \ purposes, eg. This is possible because each partition can be formatted using\
    \ a different file system, so ext3 or ext4 for Linux, or NTFS for Windows, eg.\
    \ You can then create a data partition that's visible to both OSes, ensuring you\
    \ have the latest version of your documents and other files, whichever OS you\
    \ happen to be running.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_91_1.png)\n\
    \nIt's also possible to use partitions for other purposes, such as creating a\
    \ dedicated partition for sharing over your\n\n+   **Quick tip**\n+   \n+   If\
    \ you plan to share a partition with Windows then it needs to be set up as NTFS\
    \ so your Windows install can read it. You'll need to verify the ntfs-3g file\
    \ system add-on is installed."
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Working with LVM


    If you can set up your Linux install using Logical Volume Management then you’ll
    find yourself frustrated should you attempt to repartition using GParted – it’s
    simply won’t work. That’s not a problem though, because all you need is the right
    tool.


    You can, of course, configure your partitions from the command line, but a better
    bet is to employ the user-friendly LVM utility. To do so, boot from your Live
    CD, then open Software Center and search for ‘LVM’. Select ‘Logical Volume Manager’
    and click More Info > Use This Source > Install. Once installed, launch LVM and
    you’ll find a more pleasant environment to work in.


    Start by resizing your root partition to free up available space: expand Logical
    View, select ‘root’ and click Edit Properties. Use the controls to shrink the
    partition to its desired size and click OK, then wait while the partition is resized.
    You can then switch to Logical View and click ‘Create New Logical Volume’ to set
    up any additional partitions you wish to create, including giving them a friendly
    name (such as ‘home’ for your home partition).


    Don’t bother configuring a mount point at this stage – instead, follow steps four
    through to six of the walkthrough (see p120) once the partition is in place to
    finish configuring it.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_92_0.png)


    > > The LVM utility (or as its package is called system-config-lvm) is the easiest
    partitioning tool to use on LVM-enabled setups.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_92_1.png)


    > > Remember to take a full drive image of your hard disk before you begin partitioning
    it. Try Clonezilla.


    In this tutorial we’ll cover partitioning using MBR, but the process is a similar
    one for GPT drives. We’re using Ubuntu 14.04.3 LTS, but you should be able to
    translate this to most Linux distros.


    How your computer is currently partitioned depends on your individual circumstances.
    Or, of course, as well as the distro you use. To see how your drive has been partitioned,
    as well as see what type of partition scheme (MBR or GPT) has been implemented,
    open the Disks utility from the Dash. Select your drive from the left-hand pane
    and check the ‘Partitioning’ entry to see what scheme it’s been assigned.


    Beneath this is the Volumes chart, which provides a graphical representation of
    your disk, revealing what partitions have been set up. The default Ubuntu 14.04
    setup, eg, sees your drive partitioned into two: a main Linux partition that’s
    bootable, with all your applications, data and settings in addition to your Linux
    distro. There’s also a much smaller extended partition, inside which is the swap
    file volume.


    Each partition on your hard drive is allocated a separate entry inside the /dev
    folder, which is where references to all the components that make up your PC are
    stored. Each physical hard drive is represented by three letters: hda, hdb and
    hdc are for those drives attached to older IDE controllers, and sda, sdb and sdc
    are for those attached to SCSI and newer SATA controllers.


    Each physical drive’s partitions are represented in numerical terms eg sda1 or
    sdb5. Look under Device to see which entry has been assigned to the currently
    selected volume in Disks. One complication: you may have been provided with an
    option to use LVM (Logical Volume Management) during install – if this is the
    case, then on traditional MBR-based setups, you’ll see a small primary partition
    described as Linux (Bootable) and a much larger extended partition inside which
    is the Linux LVM volume.


    The primary partition exists because extended partitions aren’t bootable, so the
    required boot files are placed on this small partition with the rest of your system
    left on the extended volume. (See Working with LVM box, above).


    # Partition structure


    Partitions are accessed through the file system by mounting them at a specific
    level. Linux structures its files, folders and partitions as a tree. When you
    start Linux, your primary boot partition is mounted first at / at the root (or
    ‘trunk’) of the tree. Other partitions can then be mounted at specific folder
    points above it in the tree – the /mnt and /media folders are a good choice for
    a partition that’s specifically been created for sharing, eg. It’s also where
    external partitions – eg from another operating system – are automatically mounted
    if the partition’s file system is recognised by Linux.


    It’s also possible to mount partitions directly to key directories like /tmp (temporary
    files) or /home (the home directories of each user on your PC) when applicable
    – this provides a seamless and consistent experience regardless of whether you
    decide to set up dedicated partitions for key folders or not. Mount points are
    stored in the /etc/fstab file.


    The best time to partition your drive is when you first set up Linux on an empty
    drive. (Check out the Partition box from Scratch box, p94, for details on how
    easy this is.)


    You’ll also encounter partitioning when setting up a dual-boot system. In this
    event, things are made much easier if your existing OS is detected during the
    installation process – if it is the hard work of partitioning is done for you
    because the installer suggests a suitable partition layout, which you can tweak
    to your personal needs based on how much free space is currently available on
    the drive.


    That’s not a practical route for most people to take – and thankfully there are
    third-party tools that can repartition your drive without data loss, although
    it’s important to note there’s always an element of risk involved. That’s why
    it pays to take a full drive image of your current setup now, so if things go
    wrong you can reset and start again. Use a tool like Clonezilla (http://clonezilla.org)
    or create a snapshot if you’re running your installtion in a virtual machine.
    It also pays to sit down and work out what your requirements are and how much...


    # Quick tip


    Another advantage of LVM over regular partitioning is the fact it allows you to
    add additional physical disks to your computer, thereby freeing up additional
    space on the volume. This allows you to boost capacity without having to move
    or copy data between drives.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Devices: Drive partitioning


    > > Quick tip

    > > It''s possible to add a new partition to *fstab* without editing it directly
    – open the *Disks* utility, select your partition and choose More Actions > Edit
    Mount Options, to do so. You can''t, however, add the ''pass'' field using this
    method, preventing the partition being checked for errors at startup.


    space you have to play with. In the first instance, decide what additional partitions
    you wish to create and what you''re creating them for. If it''s to protect them
    against a reinstall or possible corruption on the main drive, then they can be
    housed on the same partition: remember that you could have provided some protection
    against data loss, it''s not a substitute for backing up.

    If you''re looking to boost performance by moving key folders – your *swap* file,
    perhaps, or the *usr* folder where programs are stored – then these will need
    to be housed on a separate physical drive to the one Linux is running on.

    Other considerations include the size of each partition – this depends on its
    use, and how much spare space you have. Start by right-clicking the folder in
    question in your file manager and selecting *Properties*. This is technically
    the minimum amount of space you''ll need to allocate the partition, but think
    what else might need to be stored in the folder and add on the extra space accordingly.
    Note: you''ll be taking space from your primary partition for the new volume,
    which may limit how much space you can assign to it.

    Other considerations: should the partition be primary or extended? If you only
    plan to create a single additional partition then simply resize your system partition
    and create a new primary partition on its place. If you plan to create a number
    of partitions on your main drive, then using the extended partition is advised
    (*see boxout, below*).

    You''ll also have to decide what file system to assign the new partition. If you''re
    creating dedicated partitions for folders like *home* or *var*, then you''ll want
    to make these the same as your primary Linux partition (typically ext3 or ext4).
    The same is true for partitions you plan to use as shared folders over your network.
    Indeed, the only time you''ll want to change the file type is if you''re creating
    a partition that you plan to share with a Windows installation on the same PC,
    in which case choose FAT32 or NTFS.


    +   - **As long as Ubuntu recognises the OS that you''re trying to install alongside,
    the partitioning process is easy.**


    ![](img/420a7272a6efa239082a35eeadd9bc1d_93_0.png)


    # Partition from scratch


    The best time to partition is when you''re setting up a fresh install. In Ubuntu,
    when prompted to erase the disk, select *Something else* and click ''Continue''.
    You''ll see a table on `/dev/sda` – set up. Click the ''New Partition Table...''
    button, read the warning and click *Continue*: Now select the free space and click
    the + button next to *Change* to create a partition.

    Let''s begin with the main system partition. This can be as little as 15-20GB
    space, but make it larger if necessary. Once you''ve calculated how much you need
    in gigabytes, multiply it by 1,024 and enter the figure in the *Size* box. Leave
    *Primary*, ''Beginning of this space'' and ''Ext4'' journaling file system'' selected,
    choose *Under* Mount point and click *OK*.

    Select the remaining free space and click + again. Click the *Use as* drop-down
    menu and select *Swap area*. Set the partition type as *Logical*, but set its
    location to ''End of this space''.


    What size (in MB) it should be depends – a rule of thumb is to make it the same
    size as the RAM installed in your PC (make it double the size if you have 1GB
    or less). Click *OK*.

    Finally, select the remaining free space and click + again. Leave the size, type,
    location and *Use* as *Settings* as they are, and finally set the ''Mount point''
    to */Home*. Click ''Install Now'' followed by ''Continue'' to set up your partitions
    and install Ubuntu.


    When it comes to actually partitioning your drive, then the best tool to use already
    lives on your Ubuntu Live CD and it''s *GParted*, a user-friendly graphical front
    end that makes resizing partitions simple (while also providing a handy graphical
    overview of the physical layout of your hard drive). You''ll need to boot from
    this to resize your system drive anyway, so you might as well perform all your
    partitioning needs while outside your main Linux install.


    # Partitioning tools


    You can also run GParted from its own standalone bootable install on CD or USB
    from `www.gparted.org/livedd.php`. Make sure your pick the right architecture,
    which is typically i586 for older, 32-bit computers, and amd64 for newer 64-bit
    machines with UEFI rather than legacy BIOS. Users of 32-bit can also experiment
    with the i686-PAE build if they find the i586 build is a bit sluggish.

    The step-by-step guide (*see right*) reveals how to shrink your main partition
    before creating a second primary partition alongside it using GParted from the
    Ubuntu live CD. If you''d rather create your new partition or partitions inside
    the extended partition, then the procedure is slightly different.

    First, resize the system partition as outlined in the walkthrough. Once done,
    you need to extend the small extended partition that contains your *swap* file
    to take up all the remaining free space.

    This can''t be done while the *swap* file is in use, so right-click the *swap*
    partition in GParted and choose *Swap off*. Once done, you''ll be able to right-click
    the extended partition and choose *Resize/Move*. Type 0 (zero) into the ''Free
    space preceding'' box and click *Resize/Move* to quickly allocate all available
    space to the partition. You can now partition the free space as you wish without
    worrying about running out of available partitions – just make sure you calculate
    how much space each partition is likely to need and assign it accordingly, and
    don''t forget to click the ''Apply'' button when you''re done.

    The tools we''ve mentioned are pretty smart on the whole, but potentially dangerous
    task, which is why taking a full system backup before you begin is essential.
    If you run into problems, check out the GParted help pages at `http://gparted.org/help.php`.
    You''ll find handy links to an FAQ with, among other helpful things, a guide to
    fixing problems with *Grub*.

    You may run into problems when attempting to mount new partitions into key folders
    such as your *home* folder. If Linux throws an error on startup, press m to manually
    recover from it, then type `sudo nano /etc/fstab` to examine the file and check
    there are no errors preventing the partition from mounting correctly. If you can''t
    find any problems, delete the line, save the file and restart before investigating.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Create a dedicated home partition with GParted


    ![](img/420a7272a6efa239082a35eeadd9bc1d_94_0.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_94_1.png)


    **1 Launch GParted**

    Reboot from your Ubuntu Live CD or USB flash drive, opting to ‘Try Ubuntu’ when
    prompted. Once at the desktop, launch **GParted** by typing its name into the
    Dash. If you have more than one physical disk attached to your PC, make sure the
    correct one has been selected (typically **/dev/sda**) by clicking the button
    in the top right-hand corner of the **GParted** window.


    **2 Resize system partition**

    Right-click the main partition (**/dev/sda1**), graphic and choose ‘Resize/ Move’.
    Click and drag on the right-hand edge of the bar to reduce the partition’s size
    roughly to where you want it to fall based on how much space you plan to allocate
    your **home** partition. If necessary, fine-tune the size using the ‘Free space
    following (MiB)’ to set an exact amount. Click ‘Resize/Move’.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_94_2.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_94_3.png)


    **3 Create home partition**

    Next, right-click the unallocated space and choose ‘New’. Assuming this is the
    only additional partition you wish to create, leave the default settings as they
    are and click ‘Add’. ‘Nothing has yet been done to your drive, so review your
    changes and if you’re happy click the green tick button followed by ‘Apply’. Wait
    while **GParted** first resizes your main partition and then creates the new one.


    **4 Copy files to new partition**

    Reboot into Ubuntu proper. Open Files, and click the newly visible volume that
    appears under Devices. Select ‘Go > Enter Location, then select the location in
    the Address bar, right-click it and choose ‘Copy’. Open Terminal, type `sudo cp
    -Rp /home/*` before right-clicking and choosing ‘Paste’ to enter the location
    of your new partition. Hit Enter and ignore any errors.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_94_4.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_94_5.png)


    **5 Update fstab**

    Once done, you should see the partition is now populated with the files from your
    **home** folder. Next, type `sudo blkid` and press Enter. Make a note of the UUID,
    then type `sudo nano /etc/fstab` and hit Enter. Type the following beneath the
    first line marked **UUID=**, replacing `<location>` with your partition’s UUID:
    `UUID=<location> /home ext4 nofail nosuid 0 0`.


    **6 Mount new partition**

    Once you’ve made your changes to the **fstab** file, go ahead and save the updated
    file and close it. Then type the following series of commands into the Terminal
    and press Enter:

    `/ & && sudo mv /home /old && sudo mkdir /home`

    You’ll need to reboot your computer, and if you open **Disks** to verify that
    your new partition is correctly mounted at **/home**.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Files: File permissions uncovered


    Take a deep breath and launch into the murky world of users, groups and files
    in Ubuntu.


    +   - **Quick tip** If you share your PC with others, open System Settings and
    select User Accounts to give everyone their own, private user account and home
    folder. Share files with others using your Public folder.


    If you''ve migrated to Ubuntu from Windows, you''ll already have an inking about
    file permissions and users, plus the effect one has on the other, but it can still
    be a confusing subject to grasp, particularly where Linux is concerned. Before
    you dive into the confusing world of who''s got what access to which file, acquaint
    yourself with the essentials of file permissions.


    # Grasp the fundamentals


    Despite appearances to the contrary, every single thing in Linux is a file, including
    folders and hardware devices. On top of this, the Linux file system – ext2, ext3
    or ext4 – applies special permissions to files that ultimately determine how they''re
    accessed, and by whom.


    There are three levels of access to files in Linux, and while they differ slightly
    between files and folders, they follow the same broad principle: read, write and
    execute. Access to any or all of these permissions can be granted or blocked.
    Read access typically means viewing a file or looking at the contents of a folder,
    while write allows you to edit a file, or – in the case of folders – create or
    delete files that are inside that folder. Execute allows users to run files that
    are programs, or actually enter the folder in question.


    These three levels are expressed as **r** (read), **w** (write) and **x** (execute).
    For example, a file with full access is expressed as **rwx**, while one that''s
    read-only is **r–**, and another that has read and execute access is **rx**. These
    terms – **rw** and **x –** are important because they''re displayed when you view
    extended


    # Exploring Nautilus''s file permissions interface


    +   - **Owner** Any other restriction when managing permissions through Nautilus
    is that you can only view a file or folder''s owner through the Permissions tab.

    +   - **Change group** Click the ''Group:'' drop-down menu to view a list of available
    user groups on your system – most refer to hidden system users, so avoid these.

    +   - **Access rights** If you''re not the owner of a file or folder you can view
    permissions, but you can''t change them – in Nautilus or via the Terminal.


    +   - **Execute** This box only requires ticking if it has a .run or .bin file
    extension, or you want to run a file as a script. Note it affects the permissions
    for all users.

    +   - **Change access** Click here to change the access level – you have fewer
    options in Nautilus. The three options shown for folders translate to --, r-x
    and rwx respectively.

    +   - **Enclosed files** This button will apply the same permissions you''ve set
    for the folder to all files inside it, ensuring they stay consistent.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_95_0.png)'
