- pgno: 130
  md: '# Universally Unreadable IDs


    I find the use of UUIDs in /etc/fstab annoying. What’s wrong with the old method
    of using the device nodes, like /dev/sda1, and can I change back?


    The trouble with device nodes is that they can change. If you add or remove a
    drive, including USB flash drives, or change the BIOS boot order, sda can become
    sdb. UUIDs on the other hand are (nearly) unique: it doesn’t matter if the drive
    order changes, that undernied string stays the same. And that’s the problem: UUIDs
    are good for computers as they give a simple, reliable identification, but they
    are not human-friendly. A compromise is to use filesystem labels. If your root
    partition is on /dev/sda1 you could run


    ```

    sudo e2label /dev/sda1 root


    Then change the device specification in /etc/fstab from “UUID=youllneverrememberton”
    to “LABEL=root”. Unlike many operation on the root filesystem, this one is safe
    to perform on a running system. It will take effect when you reboot. If you are
    ever likely to move drives between computers, use less generic label than root.

    ```


    # Hard drive copying


    How do I clone a complete hard drive? I am using Ubuntu but the drive also contains
    Windows.


    Cloning a drive that the system is running on is a risky proposition. The OS could,
    and probably will, change files on the drive as you are trying to clone it. The
    simplest and safest way of doing this is with Clonezilla: a dedicated live CD
    distro. Burn the ISO to a CD and boot from it. Then use the menus in Clonezilla
    to make a clone of your hard drive, either directly to another drive or to an
    image file. If you want to make a copy of a complete hard disk, Clonezilla is
    the usual first choice.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_130_0.png)


    If you want to make a copy of a complete hard disk, Clonezilla is the usual first
    choice.


    # Moving home


    I have heard that it’s better to have my home directory on a separate partition.
    Why is this and how do I do it?


    First of all, it’s not normally your individual home directory that has its own
    filesystem but the complete /home directory, in which your home resides. There
    are a number of reasons for doing this, such as simplifying backup procedures,
    but the main reason is to keep your data, and that of any other users, separate
    from the operating system. That means you can upgrade or even replace your OS
    and still keep all your personal settings and data.


    The simplest way to do it is with Gparted and a separate hard drive. Make sure
    the hard drive is formatted with a Linux filesystem, to preserve all the information
    saved with your files, then use rsync to copy everything over.


    ```

    sudo mkdir /media/ext4drive/home/

    sudo rsync -a --delete /home/ /media/ext4drive/


    This assumes your separate drive is mounted at /media/ext4drive. The trailing
    slashes are important. There are other tools you can use for the copy, but rsync
    has the advantage that it can carry on where it left off if the process is interrupted.
    This means you can carry on using your PC while you do this, then boot from a
    live CD and repeat the process to update the files altered while you were using
    the system. A live CD is needed for the next stage, where you delete the contents
    of /home and use Gparted to resize the root partition to a reasonable size – 20GB
    should be enough, but make it around 50% larger than the space currently used.
    Now create a new partition after the root partition and format it, using ext4
    unless you have a reason to do otherwise. Load the /etc/fstab file from the root
    partition into an editor and add an extra line:

    ```


    ```

    /dev/sdaN /home ext4 defaults,noatime 0 0


    where sdaN is the partition you just created. Finally, copy the data back from
    the external drive into the new /home and reboot. It is possible to do this without
    access to an external drive, but it is a more fiddly process.

    ```


    ![](img/420a7272a6efa239082a35eeadd9bc1d_130_1.png)


    When using system monitors, make sure you look at figures that exclude memory
    used by filesystem buffers.


    It’s not just filesystem data that remains in memory – try checking your free
    memory, then starting and stopping a large program like Firefox and you will see
    that your free memory decreases. Now start Firefox again and see how much quicker
    it starts the second time. This is because the kernel keeps data in memory ready
    for the next use. The same applies to shared libraries, which is one reason why
    sticking to programs from one desktop environment can be faster than running a
    mixture, especially with limited memory.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# # Software glitches


    Software misbehaving? Or missing? We try to help.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_131_0.png)


    # ## Installing software


    **Q** I''m new to Linux and cannot see how to install software. On Windows, I
    go to the program''s website, download an .exe and run it. What do I do?


    **A** Software installation works differently in Linux.


    Programs are generally provided as source code and the individual distros create
    program packages from this. That means you know the program is compatible with
    the rest of the software from your distro. It also means you use the distro itself
    to install. Look for a program called *Software Manager* or similar: this will
    let you search for and install any software you need. It will also take care of
    any dependencies (other programs needed by the one you are installing) and notify
    you when updates are available. There is no need for you to check back on web
    pages or for programs to ''phone home''.


    # ## Use the source


    **Q** I want to install a program but there''s no package for my distro and the
    program''s website only provides source code. How do I install it?


    **A** The precise method varies from one program to another. The first step is
    always to unpack the tarball or ZIP file and look for a file called *Readme, Install*
    or similar. This will explain how to install the software. For 90% of projects,
    the standard *autoools* system is used, which


    requires three commands to build and install the software. These must be run from
    inside the directory created when you unpacked the tarball:


    ```

    `./configure make`

    `sudo make install`

    ```


    The first command checks that your system has all the required dependencies and
    sets up the build environment to suit your system. The second compiles the source
    code into programs to run on your computer, and the third command installs those
    programs to the correct locations and handles any final configuration.


    You need a standard build environment installed to do this. Most distros have
    a package called *build-essentials* or something similar, that installs everything
    you need to build and install programs from source.


    Don''t throw away the source directory after installation. If you want to remove
    the software at a later date, go back in there and run:


    ```

    `sudo make uninstall`

    ```


    # ## No DVD drive


    **Q** I have an ISO image that I can burn to a CD/DVD, but I want to use it with
    a slinline laptop with no DVD drive. Can I use a USB stick instead?


    **A** You can do this. The exact approach depends on the type of ISO image. Some
    distros now release what are called hybrid ISO images that work with either medium.
    You copy them to a DVD using whatever DVD burning software you prefer, or you
    can copy the file to a USB stick with `dd`


    ```

    `sudo dd if=distro.iso of=/dev/sdb bs=4k`

    ```


    where *if* is the file to copy and *of* is the destination (**bs=4k** speeds up
    the process quite dramatically, but isn''t compulsory). Warning: *dd* does exactly
    what you tell it to, with no ''are you sure'' niceties/anuances, so make sure
    you have the correct destination drive.


    How do you know you have a hybrid ISO? The distro''s website may well say so,
    but you can test with *fdisk*:


    ```

    `sudo fdisk -l distro.iso`

    ```


    If the line under the Device line includes the name of the ISO image, you have
    a hybrid. If you don''t, you can convert it with *isohybrid*. You may need to
    install the *syslinux* package first, then run:


    ![](img/420a7272a6efa239082a35eeadd9bc1d_131_1.png)


    > Don''t go trawling the web for software from dubious sources. Most software
    you need can be found in your distro''s software manager.


    # ## Run it from a shell


    If a program fails to run from the desktop launcher, or runs but later crashes
    or gives other problems, try running it from a terminal. This will not magically
    make it work correctly, but most programs send output to the terminal when things
    go wrong, so it should give you a clue to the problem or at least something to
    enter into a search engine. This assumes you know the name of the command to run
    it from the terminal, which is often a lower case version of the program title,
    so on run *Firefox* you would type *firefox*. To get the correct name, if you
    cannot guess the name this way, you can list which programs the package installed
    into your command path. With Debian derivatives the command is, for example:


    ```

    `dpkg -L firefox | grep bin/`

    ```


    That''s an upper case *L* - lower case is used for searching package file lists
    instead of installed packages. The RPM equivalent is:


    ```

    `rpm -ql | grep bin/`

    ```


    The *grep* part shows only those files installed into one of the ''*bin*'' directories,
    instead of the full package list.'
  merge: -1
  img_proc: true
