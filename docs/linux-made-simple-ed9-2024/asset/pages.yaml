  md: '# # Get gaming


    Bored? Poppycock. Get that trigger finger ready and enjoy some games on Linux.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_73_0.png)


    Gaming on Linux has never been better. With over 1,500 games available on Steam
    (store.steampowered.com) alone that support Ubuntu (officially from 12.04 LTS
    and, unofficially, many other distros), the breadth of games that you can get
    on Linux is astonishing: from casual card games and puzzles for while-ing away
    a few hours, to indie games that might be low on budget but are high on inventiveness,
    and even big budget ‘AAA’ games are now available.


    Games are also beginning to run better than ever on Linux distros now that many
    game engines used by some of the biggest names in the gaming industry – such as
    the powerful CryEngine.com – have native Linux support. Gamers switching from
    the bloated Windows OS to Linux can also see performance increases, as their system
    won’t have to devote as much of its resources to background processes and instead
    concentrate on delivering the best gaming experience possible.


    Not only is there a plethora of choice when it comes to gaming on Linux, it’s
    now easier than ever to get started. Although Valve’s proprietary store front
    has its issues – such as game DRM – it does make installing and running games
    an incredibly simple process. It’s also not only game in the Linux-verse. Good
    Old Games (www.gog.com) is another service that sells games for Linux. It offers
    a mix of classic games (that have been made


    compatible with modern computers), new games and has a no-DRM policy.


    Hardware manufacturers have also been upping their game as well, making good strides
    to ensure their graphics drivers are Linux compatible, so we can fit the most
    powerful gaming components into our machines. Of course, the beauty of Linux is
    that if you’re not too keen on using the


    > “We’ll show you how you can prepare your system to handle any game you want
    to play.”


    hardware maker’s proprietary drivers, there’s a dedicated community creating third-party
    open source alternatives.


    Thanks to the large variety of games available on Linux, the PC you use should
    be able to run at least some of them – though older machines without dedicated
    graphics cards may struggle to run the more graphically intensive and newer games
    – however you’ll still be able to play some puzzle, idle and retro games.


    If you want to give your PC a bit of a boost to handle more demanding games then
    you don’t have to spend a fortune – a few modest upgrades here and there should
    give you a


    good experience when gaming. Most games – unless they are huge open world games
    – aren’t particularly CPU intensive, so if you have semi-recent dual- or quad-core
    processor, then you’ll most likely be fine to leave your CPU as it is. Modern
    CPUs, such as Intel’s Core i5 and Core i7 range, also include pretty decent integrated
    GPUs as well – which means you might not even need to buy a'
