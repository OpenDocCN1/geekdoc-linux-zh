  md: "# ## Using Google Remote Desktop\n\n+   **Close session**\n+   You can just\
    \ close the window to end your sharing sessions, but it’s better to click the\
    \ official disconnection button here.\n+   \n+   **Remote session**\n+   Here\
    \ you can see an in-progress remote session. We’re accessing a Linux box using\
    \ the replacement LXDE via Lubuntu.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_104_0.png)\n\
    \n+   **Speed and quality**\n+   Be aware the upload speed on the remote session\
    \ side dictates how quickly the screen can be updated. A slow connection will\
    \ restrict the speed of the screen refresh/update.\n+   \n+   **Connect panel**\n\
    +   A list of available systems appears here. If they’re unavailable they’ll be\
    \ greyed out with a date and time of when they were last seen.\n+   \n+   **One-time\
    \ share**\n+   You can request a one-time connection using the Share button. A\
    \ code is generated that the remote person types in after clicking the Access\
    \ button.\n\ncheck out page 102. At this point as before you can connect to this\
    \ Linux box using its IP address. To find out the IP address, on the target PC,\
    \ in a terminal window, you can type ifconfig | grep inet – the number after inet\
    \ addr: is its IP, usually starting 192.168.\n\nJust as when connecting to a Windows\
    \ box, the rdesktop command is exactly the same for a Linux box:\n\n`rdesktop\
    \ -u \"username\" -g 1280x720 -a 16 -Pz 192.168.xxx.xxx`\n\nYour machine may feel\
    \ different as it’s using an alternative desktop environment, but your files and\
    \ programs are all still there. If you feel the need there is a graphical interface\
    \ for rdesktop called grdesktop, which will provide you with an interface similar\
    \ to the Windows RDP program. You’ll still need to know the IP address, username\
    \ and password to connect, it just makes some of the options more obvious.\n\n\
    # ## Google Desktop\n\nThe problem with enabling remote desktop over the internet\
    \ is that it suddenly becomes possible for any old hacker to probe your internet\
    \ facing ports for the RDP protocol. If they can spot an open port and brute force\
    \ the Web password, they’ll have full access to your desktop just as you would.\
    \ That would be bad. Very bad.\n\nIf you require remote access over the internet\
    \ then consider using the web browser Google Chrome with the Chrome Remote Desktop\
    \ extension, available for free from its Web Store. This works on all systems\
    \ that can run Chrome, you’re able to connect between Windows, Mac and Linux PCs.\n\
    \nInstall Google Chrome from www.chrome.com – on Linux ensure you get Chrome and\
    \ not the open source version Chromium – switch to its Web Store and install the\
    \ free Chrome Remote Desktop extension. This needs to be installed on each machine\
    \ you want to access and to get access from.\n\nOn the target machine, open the\
    \ extension through the Web App folder, make a blank tab and click the top-left\
    \ icon. It requires you to have a Google account, and you’ll need to log in on\
    \ each machine, install the required remote desktop software using the ‘enable\
    \ remote connections’ button and create a PIN to get access. We’d suggest you\
    \ make this pin the length of a telephone number (but don’t use a number that\
    \ can be connected to you) and protect your Google Account with two factor authentication,\
    \ which requires a smartphone app to confirm your identity.\n\nOn Linux there\
    \ are issues again with the Ubuntu Unity desktop, so as before we’ll install an\
    \ alternative desktop called Lubuntu and create a setting so the remote session\
    \ knows which desktop to log into.\n\n`sudo apt-get install lubuntu-desktop`\n\
    \n`echo exec /usr/bin/startx&gt; ~/.chrome-remote-desktop-session`\n\nOnce set\
    \ you can now connect from any other Chrome-running system with your account,\
    \ even over the internet. Be aware, of course, that the remote system needs to\
    \ be powered up and set not to fall asleep! Otherwise the Google system takes\
    \ care of the complications of locating a PC on the internet for you. Handy."
