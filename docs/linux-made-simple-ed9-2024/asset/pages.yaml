- pgno: 124
  md: '# 20. chmod


    User permissions are one of the most important parts of Linux security to understand.
    Every file has a set of permissions which defines who can see it, who can read
    and write to a file, and who can execute a file as a program.


    A file which can be seen by web visitors, but can only be changed by a specific
    user, is just about as basic as it gets when it comes to locking down a server.
    The problem is that some files need to be changeable and some don’t—think of a
    WordPress installation for a blog. You want WordPress to be able to write some
    files so it can update them, but there’s also a lot of files you don’t want it
    to be able to change—and you really don’t want to give it power to execute code
    unless you have to. The flipside is that problems with web servers can be traced
    back to incorrect file permissions, when an app needs to be able to modify a file
    but has been locked out by default.


    Your friend in this area is chmod. It changes permissions for which users and
    groups can read, write or execute files. It’s usually followed by three digits
    to indicate what the owner, members of its group and everyone else can do. Each
    digit from 0-7, where 7 allows for read, write and execute and 1 is execute only.
    If your user owns the file in question, the syntax is simple.


    ```

    chmod 777 filename, for example, will give all users the ability to read and write
    to a file. It’s good practice not to leave files in this state on a webserver—for
    obvious reasons. If you don’t own the file, you’ll need to add sudo to the front
    of that command.

    ```


    # 13 kill, killall


    Using top, you can figure out which application is using all your CPU cycles,
    but how do you stop it without a right-click > End process menu? If you use the
    command kill followed by the process name, it can be a tricky task to figure out
    which application is using all your CPU cycles, but how do you stop it without
    a right-click > End process menu? If you want to use sudo and kill every process
    with a name that contains that application name, you use killall. So kill firefox
    will close down a web browser on a Linux desktop.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_124_0.png)


    ed: the three fundamental commands are mv, rm and cp. The mv command is used to
    move a file from one location to another, rm is used to remove or delete a file
    and cp will copy files and folders.


    # 14 w


    From the weirdness of grep to the elegance of the w command, a whole command in
    a single letter. If you think another user is logged into your system, this is
    an important command to know. You can use w to list all currently active users,
    although don’t rely on it too much as it’s not hard for a hacker to be hidden.


    # 15 passwd


    You must use passwd with extreme care. Ultra extreme care. Because the next word
    you write after it will become your login password, so if you type it incorrectly
    or forget it, you’re going to find yourself in serious trouble. You can only change
    your own user’s password by default, but if you grant yourself sudo powers you
    can change any user’s credentials by including their username after the password
    itself. Typing sudo passwd, meanwhile, will change the password for root. Check
    out the man page for some useful options to expire passwords after a certain period
    of time and so on.


    # 16 cd


    If you have a graphical interface and file browser, it’s pretty easy to move to
    new locations on your hard drive just by clicking on them. In the terminal, we
    know where we are because of the path (see Path To box, left), and switch location
    using cd, which stands for ''change directory''. The cd command in mainly used
    in three ways:


    +   1. cd foldername This will move you to that folder, provided it exists within
    the folder you’re currently browsing (use ls if you’re not sure).

    +   2. cd - /path/to/folder This will take you to a specific location within your
    home folder (the ~ character tells it to start looking in your home folder). Starting
    with a / will tell cd to start the path at the root folder of your hard drive.

    +   3. cd . The final useful command simply takes you up one level in the folder
    structure.


    Just as with ed, you can either enter a filename to operate on a file in the directory
    you’re working in, or a full path starting from the root of the drive with /.
    For mv, the syntax is mv source location/target file location.


    The big thing to remember is that in the Terminal there’s no undo or undo-lite
    function: if you rm a file and it’s gone forever (or at least will require very
    specialist skills to retrieve) and in a similar fashion, if you mv or cp a file
    you’d better make a note of where it went.


    # 17 mv & rm & cp


    When you get the hang of it, using a terminal as a file manager becomes pretty
    simple and quite a joyful experience. As well as using the three fundamental commands
    are mv, rm and cp. The mv command is used to move a file from one location to
    another, rm is used to remove or delete a file and cp will copy files and folders.


    # 18 nano


    It might seem odd if you’ve spent your life in graphical applications and utilities,
    but complex programs run in the text terminal, too. There are several text editors
    that normally come as part of the whole package - notably nano and vi. You can
    open a blank document by typing nano, or you can edit an existing one by typing
    nano –path/to/text.txt (and you can do the same with vi). Some of the terminology
    may seem odd, though – to write out (Ctrl+O) means save, for example, and so forth.


    # 19 history


    And finally, if you’ve been copying and pasting commands from the internet all
    day, then might want to take a moment to check up on what you’ve actually done.
    You can use history to give you a list of all the terminal commands entered going
    back a long, long way. Execute specific numbered commands with !number, or you
    can go back through recent commands just by using the up and down arrows and then
    re-issue them by tapping Enter. You are also able to search for commands by pressing
    Ctrl+R.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_124_1.png)


    # Quick tip


    One command is man which is ''short for'' ''manual''. This will open up the help
    file for any other command. So if you want to know all the options for the ls
    command, simply type man ls and see what comes up.'
  merge: -1
  img_proc: true
