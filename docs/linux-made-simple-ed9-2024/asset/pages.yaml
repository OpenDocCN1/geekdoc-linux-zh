  md: "# YOUR LINUX PROBLEMS SOLVED!\n\nWe tackle the most common issues and presents\
    \ a collection of solutions that’s sure to keep your system running smooth and\
    \ trouble free. Well, mostly.\n\n+   **Stalled boot**\n+   \n+   **Q** My computer\
    \ won’t boot. The splash screen comes up and then it just sits there.\n+   \n\
    +   **A** The first thing to do is be patient – the boot process may be trying\
    \ to initialise a piece of hardware, or access the network before it’s available.\
    \ These can time out after a few minutes, either allowing boot to proceed or at\
    \ least giving you an error message to work with. Unfortunately, the splash screen\
    \ can hide any error messages. You can disable the splash screen at the boot menu:\
    \ if your computer starts booting without showing a menu, hold down [Esc] when\
    \ it boots to call up the menu. If there’s a recovery or safe option, pick that,\
    \ as it disables the splash screen and often sets safer (if potentially less efficient)\
    \ boot options. Otherwise, put the highlight on your normal boot option and press\
    \ [F] to edit. Find the line that starts with **linux** and look for options like\
    \ quiet, splash or mte. Delete these options and press [F10] to continue booting.\n\
    +   \n+   This won’t fix your problem (unless the problem is the splash screen),\
    \ but it will let you see what is going on and either get an error message or\
    \ an idea of where the boot is failing. If it appears to be a hardware detection\
    \ issue, try disconnecting all unnecessary hardware, such as printers, scanners\
    \ or USB rocket launchers. Once you can get past the problem, you can start to\
    \ fix it.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_125_0.png)\n\n+   **Boot\
    \ errors**\n+   \n+   **Q** When I boot I see error messages along the lines of\
    \ PCI Express Device Error. Severity N/A: Unconnected non Fatal. PCI Bus Error\
    \ Type:N Transaction Layer. Flow Control Protocol N:Final Receiver.\n+   \n+ \
    \  **This is a problem I’m experiencing on a newly bought motherboard that works\
    \ fine with Windows.**\n+   \n+   **A** Hardware working with Windows is no indication\
    \ that it’s fault free. The “it works with Windows, ship it” and we’ll fix any\
    \ other problems with an update” attitude is not uncommon. With anything motherboard\
    \ related, the first step is to check whether there’s a BIOS update available.\
    \ Even with a brand new motherboard, by the time it has travelled through the\
    \ shipping and distribution process there is usually a new BIOS available. Flashing\
    \ a new BIOS can fix boot problems but if yours persist, there is more you can\
    \ do.\n+   \n+   You can change the way the kernel addresses the hardware with\
    \ a number of parameters at boot time. At the Grub boot menu (press [Esc] if it\
    \ does not show up by default), highlight your normal boot option and press [E]\
    \ (for edit). Edit the line starting with **kernel** by adding some or all of\
    \ these options to the end of the line, separated by a space:\n\n```\nnoapic\n\
    or\nnoapictimer, acpi=off\nor\nacpi=force\n```\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_125_1.png)"
