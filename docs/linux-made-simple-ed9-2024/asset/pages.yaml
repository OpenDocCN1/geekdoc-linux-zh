- pgno: 138
  md: '# Boost your learning


    Now you’re starting to flex your muscles in Terminal, how about expanding your
    knowledge by instructing it to display information about a random command each
    time you open it? To do this, you need to edit a file. So open the Terminal and
    type the following:


    ```

    nano~/bashrc

    ```


    This opens the file in the nano text editor. Use the cursor keys to scroll down
    to the bottom of the file, then add the following line to it: echo ''Did you know
    that?'': Whatis $/ls /bin I shuf -n 1)


    Press Ctrl-[o] to save the file (just hit Enter to overwrite it), then Ctrl+[x]
    to exit nano. Now close the Terminal window and open a new one to get a brief
    description of a command. Just type the following, with the actual command listed
    for a longer description: <command> -help.


    Documents. One final trick — you’ve jumped to another directory, but how do you
    go back to the previous directory quickly? Simple, just type cd - to do so.


    (~) character can be used to quickly access a folder with a long name, eg: ~/Doc*
    This works fine if there’s only one folder beginning with Doc, but if there are
    two (say Doctor and Documents), then the command will open the first matching
    folder Who; which is Doctor in this instance. To avoid this, use ~/Doc*/ instead
    (unless you have a folder called Documents and Doctors). Two characters can be
    more useful when navigating are the single quotation mark ('') and backslash (\)
    characters. Use single quotation marks around file or file paths that contain
    spaces, such as ~/Documents/Doctor Who. You should also use quotation marks when
    creating folders in this way, eg: simply typing mkdir Doctor Who will actually
    create two separate folders called Doctor and Who, so type ''mkdir Doctor Who''
    to get the folder you want. You can also use the \ character to get around this
    too, eg: ''mkdir Doctor/Who'' works in the same way, because the \ character instructs
    mkdir to treat the following character (in this instance the space) as ''special''.
    We finish off by revealing some handy characters that allow you to run multiple
    commands on a single line. The && argument does just that, so you can do the following
    to quickly update your repos and update all available software:


    # Working with files and folders


    You can now list directories and navigate your file system, but what about doing
    something practical, like moving and copying files? You’ll find a range of different
    commands exist, and the tricks you’ve learned about navigation will hold you in
    good stead here too. Let’s start by looking at commands for copying (cp) and moving
    (mv) files and folders. The same options apply to both commands. The basic syntax
    is cp/mv <source> <target>. The source and target can be complete paths following
    the same rules for the cd command, but it’s generally good practice to first navigate
    to the folder containing the file or folder you wish to copy or move. Once done,
    you can simply specify the file or folder name as the source, like so: cp invoice.odt
    ~/Documents/Backup. This creates a copy of the file with the same name. The following
    copies the file to the specified directory and renames it too: cp invoice.odt
    ~/Documents/Backup/invoice-backup.odt. If you want to create a copy of the file
    within the same folder, simply use cp invoice.odt invoice-backup.odt. Substitute
    mv for any cp of the above commands, and the file is moved, moved and renamed
    or simply renamed. What happens if there’s already a file called invoice-backup.odt
    in existence? It’ll be overwritten without as much as a by your leave, so make
    sure you’re asked if you want to overwrite it by adding the -i flag like this:
    mv -i invoice.odt invoice-backup.odt. You can also copy folders using the cp or
    mv commands. Here, you need to include the recursive option, which ensures the
    folder is copied across with all its contents and correctly arranged in their
    original locations relative to the parent folder: cp -r ~/Documents /mnt/SDCard/Backup/.
    If the Backup folder exists, then the Documents folder will be recreated inside
    it; if not, then the Backup folder is created and the contents of the Documents
    folder are copied into it instead. Use the rm command to delete a single file,
    eg: rm invoice.odt. The rmdir command deletes folders, but only empty ones. If
    you want to delete a folder and all its contents, use the command rm -r foldername.
    You can also create new folders with the mkdir command — simply type mkdir folder,
    replacing folder with your chosen folder name. Use the touch command to create
    an empty file, such as touch config.yaml. Wildcards are often used to speed things
    up in searches, and can also be applied to file commands too — the asterisk


    ```

    sudo apt-get update && sudo apt-get upgrade

    ```


    && is like the AND command in that the second command will only be performed if
    the first completes successfully. If you wanted the second command to only run
    if the first command failed then you’d use || instead. If you want the second
    command to run after the first regardless of what happens, then use the ; eg:
    sudo apt-get update; sudo apt-get remove appname instead of &&.


    # Quick tip


    Some file managers allow you to right-click a folder and open the Terminal at
    that location, but you have to manually add this option to Ubuntu’s Nautilus file
    manager. First: nautilus-open-terminal from the Software Center, then open a Terminal
    window, type nautilus -q and press Enter. The option will now appear.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_138_0.png)


    Use to find out more about the files and folders in a current directory.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Terminal: Apt-get in action


    New to Linux? Then allow us to guide you through your first steps with **apt-get**,
    the powerful command line tool.


    One of the biggest changes that catches Windows users moving to Linux is the way
    that software is installed. Instead of downloading an executable file from some
    website or other, running it and hoping it doesn''t clobber your existing library
    files (DLLs) or install some dubious adware or malware, Linux distributions maintain
    repositories of software, which are all packaged up for that distro and tested
    for compatibility with the rest of the distro.


    In this tutorial, we will look at how this is done by distros that use the *Advanced
    Packaging Tool* (apt) software management system, as developed by Debian and used
    by distros from Ubuntu to Raspbian on the Raspberry Pi.


    # Repositories


    A repository is a collection of software packages for a distro. Each major distro
    release will have its own repositories, and the packages will have been built
    for and tested with that release, but it is more than a collection of files. Each
    repo (as they are usually called) is indexed, making it easy to find what you
    want. It can also be checked for updates for your package manager without any
    need to visit websites to check for updates, or the need for software to "phone
    home" to check. More importantly, each package in a repo is signed with the repository''s
    GPG (encryption) key, which is checked when installing packages. This means you
    can trust the software


    installed from there to be what it says it is, and not some infected trojan that''s
    been uploaded maliciously.


    A repository also makes dependency handling simple. A dependency is a program
    that the program you want to install needs to run, such as a library. Instead
    of bundling everything in the package and ending up with multiple copies of the
    same library on your computer (which is what Windows does), a package simply lists
    its dependencies so that your package manager can check whether they are already
    installed, and grab them from the repo if not.


    In addition to the default repositories provided by the distro, there are several
    third-party ones that can be added to your package manager. These are not guaranteed
    to be tested to the same standards as the official repos, but many of them are
    very good, and if you stick to the popularly recommended repos for your distro,
    you won''t go far wrong.


    Ubuntu has also introduced the concept of the PPA, or Personal Package Archive,
    which are small repositories for individual projects. These may each be added
    individually to your package manager, but be careful about adding any untrusted
    sources.


    # Package management


    We have used the term ''package manager'' a few times now but what is it? Basically,
    this is a program that enables you to


    ![](img/420a7272a6efa239082a35eeadd9bc1d_139_0.png)


    +   1.  **Install**

    +       Using **apt-get install** will check the dependencies of the packages
    you want and install any that are needed. Adding **--dry-run** to **apt-get install**
    enables you to see what would be done, without actually writing anything to your
    hard drive. If you are happy, run the command again without **--dry-run**.


    +   2.  **Search**

    +       Use **apt-cache search** to find what''s available. The **--names-only**
    option can give a more manageable set of results if you know the program''s name.
    Otherwise let **apt-cache search** go through the descriptions, too, and view
    the results in **less**. You don''t need to use **sudo as search** doesn''t write
    to your drive.


    +   3.  **Update**

    +       Run **apt-get update** to update all your package lists, followed by **apt-get
    upgrade** to update all your installed software to the latest versions. In our
    case, it''s well overdue. Then **apt** will show you what needs to be updated,
    and how much needs to be downloaded, before asking whether you want to proceed.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '![](img/420a7272a6efa239082a35eeadd9bc1d_140_0.png)


    Less displays text from any source – from a file, the output of another program
    or its built-in help if you manage to get stuck.


    install, update and remove software, including taking care of dependencies. It
    also enables you to search for programs of interest, as well as performing other
    functions.


    All distros will have command line package management tools. You can access them
    either by using your system''s search and looking for terminal or using Ctrl+Alt+
    T in desktops such as Unity, Gnome or Xfce, even if they also provide a fancy
    graphical front end. The main commands are as follows:


    +   * `apt-get` Installs, upgrades and uninstalls packages.

    +   * `apt-cache` This works with the repository index files, such as searching
    for packages.

    +   * `add-apt-repository` Adds extra repositories to the system.

    +   * `dpkg` A lower level package manipulation command.


    These commands generally require root (superuser) access, so should be run at
    the root user or with `sudo` – we will stick with the `sudo` approach here. We''ve
    already mentioned that repos are indexed, so the first thing to do is update your
    index files to match the current contents of the repositories with:


    ```

    sudo apt-get update

    ```


    Then you probably want to make sure that your system is up to date:


    ```

    sudo apt-get upgrade

    ```


    This will list the packages it wants to install, tell you how much space it needs
    for the download, and then go on with it when you tell it to. When you want to
    install some new software, unless you have been told the exact name to install,
    you may want to search for it first, like this:


    ```

    apt-cache search gimp

    ```


    This will spit out a long list of packages, because it searches both name and
    description, and lists anything mentioning gimp, and there are a lot of them.
    To search only


    the names, use the `-n` or `--names-only` option:


    ```

    apt-cache search -n gimp

    ```


    This often gives a more manageable output, but still a lot in this case, perhaps
    too much to fit in your terminal window. The solution to this is to pipe the output
    from this command to the program `less`:


    ```

    apt-cache search -n gimp | less

    ```


    The `less` command is a pager – it lets you read text page by page and scroll
    through it. It can be used with any program that generates lots of terminal output
    to make it easier to read (see the ''Package management'' walkthrough opposite
    for more details). Once you have found the package you want, installation is as
    simple as:


    ```

    sudo apt-get install gimp

    ```


    You can install multiple programs by giving them all to `apt-get` at once:


    ```

    sudo apt-get install program1 program2...

    ```


    Not every program you try will be what you want, so you can tidy up your hard
    drive by uninstalling it with:


    ```

    sudo apt-get remove program1

    ```


    Or you can use:


    ```

    sudo apt-get purge program1

    ```


    Both commands remove the program, but `remove` leaves its configuration files
    in place while `purge` deletes those, too.


    There are a number of extra options you can use with `apt-get`. The `man` page
    lists them all (type `man apt-get` in the terminal), but one of the most useful
    is `-dry-run`. This has `apt-get` show you what it would do without actually doing
    it – a useful reminder to check that you are giving the right command. Remember,
    computers do what you tell them to, not what you want them to do! Finally, you
    don''t normally need to use `dpkg`, but it is useful for listing everything you
    have installed with `dpkg -L`.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# # Tar: Archiving your files


    Archiving contains many mysteries, such as zips and tarballs, but we are on hand
    to expand your knowledge of their uses.


    Most people reading this are probably pretty familiar with creating, sending or
    receiving ZIP files. *Zip* takes a collection of files and stores them in a ZIP
    archive file, compressing the data in the process. As well as storing the contents
    of the files, it also stores metadata, which is extra information associated with
    an object. In the case of files, it includes the modification times, their owners
    and permissions, and, of course, the name of each file. When you unzip an archive,
    all of this information is extracted, which recreates the original set of files
    exactly as they were.


    Archives have several uses, but the most popular include bundling up a set of
    files for download – a single file is easier to handle and the compression makes
    it faster to download – and creating backups. As *Zip* has been around for ages,
    everyone can use it and all OSes can handle it. Notwithstanding, Zip does have
    a number of drawbacks. The main issue is that its compression is poor by modern
    standards. Over the past 25 years, compression technology has moved on and even
    though there have been improvements to *Zip*, there are better alternatives available.
    Another disadvantage of *Zip* is that it is intended for archiving to a file,
    whereas sometimes we want to send the data to another device or service.


    The standard archival program for Unix-like operating systems is *Tar*, so called
    because *Tar* was originally used to store backups on tape drives (Tape ARchive).
    It works in a different way to *Zip* because it sends all the archived data to
    its standard output and doesn’t compress the data by default. This is because
    many tape drives already had hardware compression built in. The lack of compression
    code may seem like a disadvantage, but it’s actually a convenience. As *Tar* is
    able to pipe its data via an external compression program, it can use any compressor
    it likes – even one that wasn’t in existence when *Tar* was developed.


    Compression programs work on one file or stream of data and produce one compressed
    file or stream, so this splits the job into two parts: archival and compression.
    While this may seem more complex, *Tar* is capable of handling the details itself.
    Let’s say we have a directory that is called *foo*. We want to create an archive
    of it, which is often referred to as a tarball. We can use one of these options:


    ```

    ```

    tar cf foo.tar foo

    tar czf foo.tar.gz foo

    tar cfj foo.tar.bz2 foo

    tar cJf foo.tar.xz foo

    ```

    ```


    The *e* option tells the *Tar* program that we are creating an archive, while
    *f* tells it that we are storing the archive in a file using the given name. Therefore,
    the first command creates an uncompressed archive that is called *foo.tar*. The
    subsequent commands add an extra option that tells *Tar* which particular type
    of compression to use: *z* uses gzip


    # ## Pipes and streams


    A core part of the philosophy of Unix-like operating systems is for tools to be
    specialised – each tool should do one job and do it well. That means we need a
    way to chain programs together to achieve more complex tasks, and this is done
    with pipes. Every terminal program has streams for standard input, standard output
    and standard error (usually referred to as *stdin*, *stdout* and *stderr*). Standard
    input is how the program accepts information and it defaults to the keyboard when
    running a command from a terminal. Standard output is the output from the command
    that defaults to printing to the terminal window. Standard error goes to the same
    place, but all of these can be changed. Consider the example of:


    ```

    ```

    tar c foo | sdc -foo.tar.sdc

    ```

    ```


    The `|` character is the pipe and it connects the standard output of one program
    to the standard input of another. So *Tar* archives the contents of *foo* and
    sends it to *sdc*, which is then piped to the input of *sdc*. Most compressors
    default to working on a file.


    ```

    ```

    czip somedir

    ```

    ```


    This compresses a file to *somedir.gz*. When no file is given, it compresses standard
    input and sends the result to standard output. The *>* character performs redirection
    and diverts standard output from the terminal to a file, so you get a compressed
    archive in *foo.tar.sdc*. Standard error is not redirected by *>>*. If something
    goes wrong, error messages are printed to the terminal – if they were sent to
    the file, you wouldn’t know something was wrong.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_141_0.png)


    > Running *Tar* with the *t* (test) option not only checks that the archive is
    correct, but also shows you the full contents – usually enough for you to need
    to pipe it through a pager such as *Less*.'
  merge: -1
  img_proc: true
- pgno: 142
  md: "# Compression types\n\nThere are two types of compression: lossless and lossy.\
    \ Lossy compression achieves a greater reduction in file sizes by carefully discarding\
    \ data that doesn't greatly affect the results. JPEG and MP3 files, for example,\
    \ use lossy compression. Archiving uses lossless compression and uncompresses\
    \ the result to get you back exactly where you started. There are a number of\
    \ lossless compression methods available, here are some of the most common.  \n\
    \ \n Deflate This is the default compression used by Zip; it is old and not particularly\
    \ effective, but is fast and well supported.  \n \n Compress This is an old Unix\
    \ compression program. Its files have a .Z extension, but you are unlikely to\
    \ see many in the wild. There are also patent issues with it.  \n \n Gzip This\
    \ Compress replacement is completely open and still in use today. Gzip uses Deflate,\
    \ but generally produces smaller archives than Zip with its default settings.\
    \ It does not give the best compression, but it compresses and decompresses quickly,\
    \ making it a good choice when size is not the most vital consideration.  \n \n\
    \ Bzip2 This is a more efficient compressor, but at the expense of speed. Compression\
    \ in particular can be slower, but it produces more compact results.  \n \n xz\
    \ This more recent program uses the LZMA2 compression algorithm (also used by\
    \ 7-Zip. It is fast -- particularly for decompression -- and works brilliantly.\
    \ It is the compressor of choice for many key Linux projects, including Coreutils\
    \ and the kernel itself.\n\nThose are the main Tar options, but the program has\
    \ many more, such as A or --concatenate to add files to an existing archive instead\
    \ of creating a new one.\n\n# Future proofing\n\nWe mentioned that Tar can handle\
    \ any new compression format that comes along because it passes compression to\
    \ another program. There are command line options to do this automatically for\
    \ gzip, bzip2 and xz, but what if someone comes up with a new compressor? Say\
    \ something like sdc -- super-duper compressor? You could create an uncompressed\
    \ tarball and then use sdc to compress it, but that's wasteful and slow. so instead\
    \ use a pipe:  \n \n tar c foo | sdc>foo.tar.sdc  \n \n unslie foo.tar.sdc | tar\
    \ x  \n \n Here, we have used only the --create option with Tar. The lack of a\
    \ destination causes Tar to send the archive data to standard output, which is\
    \ then piped to the sdc compressor program. The second command reverses the whole\
    \ process, decompressing the archive before sending it to Tar for extraction.\n\
    \n![](img/420a7272a6efa239082a35eeadd9bc1d_142_0.png)\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_142_1.png)"
  merge: -1
  img_proc: true
