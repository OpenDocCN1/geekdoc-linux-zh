  md: '![](img/420a7272a6efa239082a35eeadd9bc1d_74_0.png)


    Metro Last Light is one of the more demanding games on Linux and also comes with
    a built-in benchmark tool.


    dedicated graphics card to play many games. However, if your CPU is showing its
    age or you want to play more demanding games, then buying a dedicated graphics
    card is the best upgrade you can buy for your PC.

    We have good news on two fronts here. First, most modern graphics cards play pretty
    nicely with Linux these days, so putting one in your system shouldn’t cause any
    trouble. Both first-party and third-party drivers are quite easy to install too
    (more on that in a bit) and they generally behave themselves.


    # ## Wine for games


    Wine (which stands for Wine Is Not an Emulator) is a compatibility layer that
    enables Windows programs to run on Linux. Although it’s usually used for running
    office suites and other programs that haven’t made it to Linux (or don’t have
    an open source alternative), it can also be used for running Windows games in
    Linux as well. Of course, there’s a performance impact to running a game via Wine
    rather than natively, so it’s not really recommended for graphically demanding
    games – unless you have one hell of a machine. However if you have CDs of some
    old Windows games lying around, or you want to try an indie that hasn’t made it
    to Linux just yet – then Wine is a great possible solution. To install, open up
    the Terminal and type `sudo add-apt-repository ppa:ubuntu-wine/ppa` `sudo apt-get
    update` `sudo apt-get install wine-1.7` and a window will pop up asking you to
    read and agree to a EULA by Microsoft. You might have hoped you’d left all this
    behind, but it’s a necessary step to using Wine. Once you’ve scrolled down and
    agreed, type in `s-winetricks.`


    to run the graphical user interface for Wine. You may have to install additional
    packages, and Wine will take you through the process. With ‘Select the default
    winetricks’ selected click ‘OK’ and then you can be installing required software
    to run Windows games in Linux.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_74_1.png)


    The Steam library lists all the games that you’ve purchased. Once bought, you
    can download and play a game on any machine as long as you’re logged in once to
    your account.


    The second bit of good news is that you don’t have to spend a lot of money to
    get a capable graphics card. Sure, there are some ludicrously expensive GPUs on
    the market, such as Nvidia’s $1,149 Titan Xp, but these are aimed at gaming enthusiasts.
    For entry level and mid-range cards you can get something decent for between $60–$150,
    depending on the level of performance that you require. Despite these low prices
    you should be able to run most modern games smoothly thanks to most games being
    scalable for a variety of hardware configurations – so you might have to dial
    down an effect here or there, but you’ll get smooth framerates.

    Most modern games are also developed with the Xbox One and PlayStation 4 in mind,
    and despite being pretty new, these games consoles have relatively modest graphics
    capabilities compared to PCs. If you want to future proof your gaming machine
    a really general rule of thumb you can use when choosing a graphics card is that
    if you want to run games at resolutions higher than 1080p, or on more than one
    monitor, then we’d recommend going for a GPU with 4GB of GDDR memory. However,
    for most casual gamers this will be overkill, and any card equipped with 2GB should
    be plenty. With this in mind, we’d suggest a graphics card, such as the Nvidia
    GTX 950, is a great choice if you want to play most of the latest games at 1080p.
    It comes with 2GB of memory and goes for around $120, which makes it excellent
    value for money. We got one in to test, in fact, and ran a number of benchmarks
    to see how good it performs.


    # ### Benchmarking


    The first benchmark we ran was Heaven, which is a well-known benchmarking tool
    among gamers for seeing how well a graphics card performs. You can download the
    RUN file from `http://bit.ly/UnigineHeaven`. Once downloaded, open up the terminal
    and type: `cd ~/Downloads` `chmod 700 Unigine_Heaven-4.0.run` `sudo ./Unigine_Heaven-4.0.run`

    To install the benchmark, To run it, change directory into the `Heaven` folder
    and type `/heaven.` A screen will appear asking you what type of benchmark you
    want to perform. Click ‘OK’ and an animated video will appear, putting your GPU
    through a workout. On the top-right hand corner of the screen you’ll see a counter
    for frames per second – the higher it is the smoother the gameplay will be.

    The test computer we’re running the benchmarks on has an Intel Core i7-6700K processor,
    Intel’s sixth-generation Core i7 flagship. It’s one of the best CPUs around, and
    though it’s a bit pricey at around $260–$300.'
