  md: '# Exploring the Disks interface


    # Drive identifier


    The select drive’s physical identifier (*/dev/sda, /dev/sdb* and so on) is clearly
    visible – click the menu button in the right-hand corner for options.


    # Drive list


    All recognised drives are listed here, complete with helpful identity marks such
    as size and manufacturer. Select one to examine it in more detail.


    # Partition type


    You can find out how the drive has been partitioned by examining the ‘Partitioning’
    section of its summary. It’ll be GUID or MBR – see the main text for more information.


    # Quick backup


    Click this button and you’ll see additional options, including one that allows
    you to take a drive image of the selected partition.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_86_0.png)


    # Volume info


    Click a volume’s entry in the bar chart to reveal more details about it, including
    its all-important identifier and a shortcut to where it’s mounted.


    # Volume chart


    This bar chart provides a handy representation of how the drive is broken down
    – although it’s not to scale when multiple smaller volumes exist.


    assigned ‘sdX5’ onwards. When you install Ubuntu on a single, unpartitioned hard
    drive, it’ll create two partitions: one primary partition for the main system
    volume (called sda1), and an extended partition inside which the swap file partition
    is stored (called sda2). You can examine this using the Disks utility and you’ll
    see the swap file volume is allocated ‘sda5’ inside the extended partition. Again,
    it has no effect on how Linux operates, but it manages to explain any confusion.


    # How drives are accessed


    We know Windows allocates drive letters to volumes and drives, making them easily
    visible and accessible. But how do you access these volumes in Linux? If we ignore
    the fact the Nautilus file manager provides quick and convenient shortcuts to
    volumes through its navigation pane, where are the drives situated?


    At first glance, you might think the quickest way to access a drive or volume
    in Linux is through the */dev* folder, but that won’t work because the files inside
    – sda, sda1 and so on – aren’t direct links or shortcuts.


    Linux handles drives differently to Windows in that they’re not treated as separate
    entities; instead, volumes are integrated into the main file system as part of
    a larger whole. This is done in Linux systems by ‘mounting’ each volume to a specific
    folder rather than allocating it a drive letter. You can then browse to the folder
    to access and interact with the files and folders stored on the volume in question.


    When Linux boots, it mounts the main system partition to the root of the file
    system (*/*). The swap file partition isn’t mounted, but other key folders can
    be stored on separate volumes too, such as the */home* folder where all user data
    and settings are stored.


    When you arrive at your desktop, only these key volumes are mounted. USB drives
    that you subsequently connect while Ubuntu is running will be mounted automatically,
    but while convenient shortcuts to other detected volumes appear in Nautilus’ navigation
    pane, you’ll need to click these to physically mount the drive in question.


    The shortcuts are convenient, but where were these drives physically mounted?
    The good news is that Ubuntu picks a consistent location: open Nautilus and select
    the Computer shortcut to view the root of your drive. You’ll see a */media* folder
    – open this and you’ll see a folder named after your username. Open this to reveal
    folders pointing to the relevant drives. Armed with this useful information you
    can quickly browse to the drives in Terminal using the ‘cd’ command – for example:
    *cd /media/nick/Data*.


    # Third-party access


    Now you’ve learned how Linux identifies drives, plus – crucially – where they’re
    found in your filesystem, you can start to make more sense of this information.
    It’s helpful when repartitioning your drive using the Gparted utility, for example,
    plus you can now make sense of the semantics required when using the powerful
    ‘dd’ utility to back up partitions or drives.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_86_1.png)


    ) Any drives you manually mount in Ubuntu will appear in the */media/username/*
    folder.


    # Quick tip


    Before disconnecting any drive from your PC, ensure you’ve first ejected it from
    the filesystem. To do this, open Files, locate the drive in the left hand pane
    and click the eject button you see next to it.'
