- pgno: 136
  md: '# Your first terminal commands


    While it’s possible to install and manage software using a combination of the
    *Software Center* and Ubuntu’s *Software & Updates* setting panel, it’s often
    quicker to make use of the *Advanced Package Tool* (*APT*) family of tools. Here’s
    some key ways that they can be used (see *sudo* usage below):


    +   * `sudo apt-cache pget-names` Lists all available packages from sources listed
    in the /etc/apt/sources.list file.

    +   * `sudo add-apt-repository ppa-repository-name` Adds a specific Launchpad
    PPA repository to the source list.

    +   * `sudo apt-get update` Gets the latest package lists (including updated versions)
    from all listed repositories.

    +   * `sudo apt-get install -package-` Installs all the named packages. This will
    also download and install any required packages.

    +   * `sudo apt-get remove -package-` Use this to remove an installed package.
    Use `apt-get purge -package-` to also remove all its configuration files, and
    `apt-get autoremove` to remove packages installed by other packages that are no
    longer needed.

    +   * `sudo apt-get upgrade` Upgrades all installed software – run `sudo apt-get
    update` before running this. Other useful `apt-get` commands include `apt-get
    check` a diagnostic tool that checks for broken dependencies, `apt-get autoclean`
    which removes .deb files from removed packages.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_136_0.png)


    description of the utility, plus list all available commands and options, eg `ls
    -i`. The `-1` flag tells the list directory tool to provide detailed information
    about the contents of the folder it’s listing, including: permissions; who owns
    the file; the date it was last modified; and its size in bytes. Utilities can
    be run without any commands or options – eg `ls` on its own provides a basic list
    of all folders and files in a directory. You can also run utilities with a combination
    of commands and/or options.


    # Restricted access


    Open the terminal and you’ll see something like this appear: `username@pc-name:~$`.
    This indicates that you’re logged on to the shell as your own user account. This
    means that you have access to a limited number of commands – you can run `ls`
    directly, eg, but not to install a package using `apt-get`, because the command
    in question requires root access. This is achieved one of two ways – if you’re
    an administrative user, as the default user in Ubuntu is, then you can precede
    your command with the `sudo` command, eg `sudo apt-get install vlc`. You’ll be
    prompted for your account password, and then the command will run. You should
    find that you can run more `sudo`-based commands without being re-prompted for
    your password (for five minutes) while the terminal is open. On some distros you
    can log on to the terminal as the root user with `su` – you’ll be prompted for
    the root password at which point you’ll use the following prompt: `root@pc-name:~$`.
    Once logged in as the root user you can enter commands with no restrictions. We
    recommend you use the `sudo` command rather than this approach and if you’re running
    Ubuntu then you’ll find `su` won’t work because the root account password is locked
    for security reasons.


    When installing some distros or adding new users to Ubuntu, you may find your
    user account isn’t added to the *sudo* group by default. To resolve this, you
    need to open the terminal in an account that does have root access (or use *su*
    command if supported) and the type `sudo adduser -username- sudo`. You can also
    add the user to other groups with the command `sudo adduser -username- adm` `sudo
    padmin` `sansharebo`. Another handy tool is *ksuudo*, which allows you to launch
    desktop applications with root privileges. It’s of most use when wanting to use
    the file manager to browse your system with root access: *gksudo nautilus*. Make
    sure you leave the terminal open while the application is running, otherwise it’ll
    close when the terminal does. When you’re done, close the application window,
    then press Ctrl-H in the terminal, which interrupts the currently running program
    and returns you to the command line. We’ve already discussed the `-help` flag,
    but there are other help-related tools you can use too. First, there’s *what-is*
    – which you can type with any command to get a brief description of it and any
    specified elements, eg `what-is apt-get install vlc` will describe the `apt-get`
    tool, the install argument and what package `vlc` is. Flags are ignored. If you’re
    looking for a full-blown manual, then the *man* tool provides access to our distro’s
    online reference manual, which is started with `man intro`. This provides you
    with a long and detailed intro to the command line. Once done press `q` to quit
    back to the terminal. For more advice on navigating the manual, type `man man`.
    Or for any tool, eg `man ls`.


    Now you’ve taken your first steps into the world of the terminal, check out the
    box (*Your First Terminal Commands*, above) for some useful package management
    commands you can work with. Next, we’ll look at how to navigate your filesystem
    from the terminal, plus launch programs and delve into more useful shortcuts to
    help speed up the way you interact with the command line.'
