  md: "# # Shotwell: Photo management\n\nLooking for that special snapshot? Gather\
    \ your photos and check out Ubuntu's built-in photo library app.\n\n+   * **Quick\
    \ tip**\n+   \n+   The Import function in Shotwell's File menu will automatically\
    \ copy images from a camera or USB drive to your photo library; and index them\
    \ in Shotwell's database too.\n\nS even hundred and thirty billion. That's how\
    \ many photos are uploaded to Facebook every year. And that's just a fraction\
    \ of all the photos that are taken worldwide every 12 months. To put that in perspective,\
    \ back in 1999, Kodak estimated humanity took 80bn photos a year.\n\nWe take a\
    \ lot of photos. And even if every single one isn't a 'keeper', the chances are\
    \ that your digital library is far more complex and vast than the cardboard box\
    \ full of 'alburms' that's mouldering in the attic. Fortunately, there are more\
    \ than a few tools to help you sort through your library.\n\n# ## Shooting to\
    \ Shotwell\n\nBy default, there are two ways of managing your photo library in\
    \ Ubuntu. The first is to use the stock file browser. As long as your photos are\
    \ organised into folders on your hard drive in a way that has meaning for you,\
    \ such as by date shot, files has a thumbnail view which can help you identify\
    \ pics while looking through your hard drive. Just press Ctrl and spin the mousewheel\
    \ to zoom in on a preview image for a larger view.\n\nOrdering your photo library\
    \ is essential, but there are better ways of browsing it. In Ubuntu, the default\
    \ photo manager is Shotwell. It's beguilingly simple in appearance, but boasts\
    \ top end features for organising your images. First of all, though, you'll need\
    \ to tell it where to look. Open up the Preferences menu and you'll find an option\
    \ to define your library. This is simply the folder on your hard drive in which\
    \ your photos are stored. If you have a lot of photos, though, you might want\
    \ to keep them on a separate drive.\n\nOnce you've set-up your library, Shotwell\
    \ will begin the process of indexing it thoroughly. It will locate images images\
    \ in folders that are inside the main library folder, so don't worry — if you've\
    \ put a pic in there somewhere, Shotwell will locate it. Be warned, though — this\
    \ can be a slow process, and Shotwell has been known to lock up if given too many\
    \ files.\n\n# ## Navigating Shotwell\n\nThe way Shotwell creates its own index\
    \ is by using the metadata stored in the photo files. The most basic metadata\
    \ tag is the date an image was created. Once Shotwell has finished indexing your\
    \ drive, you'll notice that the main index on the left is constructed to let you\
    \ quickly zoom to a particular year, month or day to begin browsing your library\
    \ contents.\n\nInitially, you'll be presented with the date index on the left\
    \ and thumbnails of images on the right. The images will be sorted into date order,\
    \ with the newest first. If you scroll down, you'll go back through your library\
    \ one sequence at a time. Select a year in the left panel, and the thumbnails\
    \ on the right will change. Instead of linking to photos, they'll now link to\
    \ an album for a particular date. You can click through these to see all the images\
    \ shot on that date. Shotwell will do its best to further segment your images\
    \ up into 'Events' so if it sees two groups of images shot on the same day but\
    \ a couple of hours apart, it will create two albums for that day. You can right-click\
    \ on the thumbnail for represents that album and either rename the Event into\
    \ something meaningful rather than just a date or you can combine events into\
    \ a single album if Shotwell has incorrectly split them up.\n\nShotwell will also\
    \ index images by tags and location, if that data exists in the file. If it doesn't,\
    \ you can add tags to a picture by selecting a single image or a group and pressing\
    \ [Ctrl]+[T]. That'll make it much easier to find a pic later.\n\nThere are a\
    \ few other features which are standard to most photo library applications, the\
    \ most useful of which is the ability to tag photos with a star rating or a flag.\
    \ You can do this by right-clicking on an image and selecting a rating or flag.\
    \ This is particularly useful if you've taken a lot of photos on a single day,\
    \ since you can make a quick first pass of the thumbnails to figure out which\
    \ images you might want to keep. Then go to the View menu at the top of the screen\
    \ and choose the Filter option — this lets you hide the unselected images without\
    \ deleting them, so you can focus on further culling for 'keepers'.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_65_0.png)\n\
    \n➔ Select Extended Information from the View menu to see the full detail of an\
    \ image's EXIF file. This may even include location data for where the shot was\
    \ taken.\n\n# ## Editing from within Shotwell\n\nIn a similar way, Shotwell also\
    \ has a basic built-in editor which will allows you to add quick fixes to photos\
    \ without changing"
