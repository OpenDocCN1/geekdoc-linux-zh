  md: '# Desktop: Install and switch DEs


    Don''t like your distro''s desktop? No problem. Trade it in for an environment
    that''s better suited to your needs.


    One of Linux''s great strengths is its versatility, and unlike other operating
    systems that ability to customise extends to your desktop environment (DE). Each
    distribution (distro) of Linux ships with its own DE, and while they share superficial
    similarities – specifically the point-and-click WIMP (Windows, Icons, Menus, Pointer)
    interface – there can be some quite radical differences in functionality as well
    as their look and feel.


    The good news is that you''re not locked into your distro''s choice of desktop.
    Whether you''re planning to switch to a different distro, but are put off by the
    desktop that it employs, or you''re looking for a fresh way to interact with your
    desktop, Linux can accommodate you. In fact, you can even run multiple desktops
    side-by-side, allowing you to compare and contrast or use different desktops for
    different purposes.


    Desktops are distributed as software packages, containing all the disparate elements
    required to make that desktop function (see the Anatomy of a Desktop box, below).
    Once desktops have been installed, you switch between them from the login screen
    by clicking the desktop icon that appears in the logon box next to your username.


    So, if you''re itching to try out some alternatives to your default distro, we''d
    say you can''t go wrong starting with Cinnamon (http://cinnamen.linuxmint.com).
    It''s the default desktop in Linux Mint, and is particularly popular with those
    switching from Windows as it utilises a similar style of desktop.


    # Spice things up


    Cinnamon is highly configurable. Its main customisable elements – known as ''spices''
    – are its themes, applets, desklets (widgets you can place on the desktop) and
    extensions. These allow you to radically alter its capabilities as well as its
    look and feel – the step-by-step guide (see bottom, p.109) reveals how to tweak
    many of these settings.


    Four other desktop environments worth looking at include Xfce (www.xfce.org),
    Gnome (www.gnome.org), LXDE (www.lxde.org), and KDE Plasma 5 (www.kde.org). Even
    if you wanted to use Ubuntu''s default desktop, Unity, isn''t available as a standalone
    desktop for use in other systems.


    There are lots of things to consider when choosing your desktop. How it looks
    is an obvious starting point, but does that translate into making it easier for
    you to use? Some desktops, eg, aren''t as configurable as Cinnamon, so it''s important
    you explore all the options there are before deciding if a desktop has the functionality
    and flexibility you need.


    # Quick tip


    Don''t like the look of your new Xfce desktop? Ubuntu sets the default GTK theme
    for Xfce, which means missing icons and ugly looking panels. Change this to the
    Xfce style and fancy icons by selecting Applications Menu > Settings > Appearance.


    # The anatomy of a desktop


    Your desktop is the virtual environment in which you work, and provides a friendlier
    user interface with which to interact with your PC. The desktop consists of a
    number of different elements you know and love – or hate, if you''re switching.


    The desktop typically contains: icons, windows, toolbars, folders, wallpapers
    and – optionally – desktop widgets. Most of what you''ll see is provided by the
    window manager. As its name implies it determines how the desktop''s windowing
    system works by taking responsibility for the placement and appearance of windows
    and their component parts, such as menus, title bars and control buttons. The
    desktop''s graphical elements – buttons, scrollbars, icons etc – are stored in
    special libraries. These include the widget toolkit, which is also utilised by
    applications so they can work seamlessly with the desktop. Two main toolkits exist:
    Q² and GTK, and while you can run applications made in one toolkit on a desktop
    built using another, they don''t tend to look as good.


    Many of these elements are stored in a theme, which makes it easy for users to
    change a desktop''s look and appearance by defining how key elements look in terms
    of shape, colour and other elements.


    Desktops also ship with a number of core tools and utilities, designed specifically
    to work well with that environment. Typical elements include a file manager, image
    viewer, text editor and terminal emulator, as well as a tweak tool that allows
    various aspects of the desktop to be customised.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_101_0.png)


    It doesn''t matter how sophisticated your DE is, they all share the same building
    blocks: toolbars, desktop, widget and windows etc.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# # Remove unwanted desktops


    You can install as many desktop environments as you like - aside from taking up
    space on your hard drive, they don''t consume any resources unless you''re actually
    running one.


    But there may come a time when you''ve finished experimenting with desktops, settled
    on your favourite (or favourites) and want to remove the rest. It goes without
    saying you shouldn''t be logged into the DE that you''re planning to remove.


    With that prerequisite out of the way, removing the desktop is best done from
    the Terminal, particularly if you plan to remove all the software the DE installed
    alongside itself.


    Here''s the two commands you''ll need:


    ```

    $ sudo apt-get remove packagename

    $ sudo apt-get autoremove

    ```


    Replace *packagename* with the desktop''s package name. *cinnamon, plasma-desktop*
    (KDE Plasma 5), *gnome*, *lxde* or *xfce4* (Xfce).


    need in a package you''re happy to look at. Despite their differences, you''ll
    notice similarities between many Linux DEs. That''s because they are basically
    variants of Gnome. Unity is the obvious example here, sharing many of its elements,
    but even the likes of Cinnamon betray their roots through the use of similar applications,
    built using the GTK toolkit that Gnome employs. The big rival to Gnome is KDE,
    and its differences extend beyond the fact it employs the Qt toolkit rather than
    GTK. For starters, it''s one of the most configurable tools out there, which makes
    it more popular with advanced users.


    There''s also a question of performance and power consumption. Some desktops are
    more resource hungry than others, eg Unity and KDE Plasma 5. The increased demands
    do come with benefits, such as: a wider feature set, a bigger range of tools and
    flashier looks, which are missing from lightweight alternatives such as LXDE.
    But that means they''re less suitable for older and low-powered machines.


    The best thing to do is run a couple of them and see how they perform - you should
    notice those with a smaller footprint are the most responsive, particularly on
    slow PCs. They also place fewer demands on power consumption, which should benefit
    those running on batteries. Remember, thanks to the fact you can easily switch
    between desktops, you can mix and match - a low-powered desktop while on the road,
    with a more fully featured environment for when plugged into the mains.


    You''re ready to start experimenting with desktops, so how do you install them?
    In some cases you can simply search for the desktop using your distro''s software
    centre, but for others you may have to manually add the repositories (repos) yourself
    before installing through Terminal.


    In the case of Ubuntu, you''ll find Xfce (type *xfce4* into the Search box to
    locate it). Gnome and LXDE are all available through the Software Center. Click
    ''More Info'' when you''ve found one - because they usually ship with optional
    components added in, you might want to review these before clicking the ''Install''
    button. Cinnamon and KDE Plasma 5 require a trip to the Terminal. In the case
    of Cinnamon, enter:


    ```

    $ sudo add-apt-repository ppa:ppa:ppa

    $ sudo apt-get update && sudo apt-get install cinnamon

    ```


    For KDE Plasma 5, use these commands:


    ```

    $ sudo add-apt-repository ppa:kubuntu-ppa/backports

    $ sudo apt-get update && sudo apt-get install plasma-desktop

    ```


    # ## Working with desktops


    Once you''ve installed a new desktop, log out of your account. When you find yourself
    back at the login screen you should see an icon next to your username. Click this
    and you''ll see a list of available desktops appear - in some cases you''ll see
    multiple options based on a single desktop. Select one, then enter your password
    and log in as normal to start using it.


    When you log into a new desktop for the first time, none of your existing preferences
    will come across from your old DE (but don''t worry, they''re all still there,
    ready and waiting for you the next time you log back into your original desktop).
    One of the benefits of having to make changes to your new desktop early on is
    that it forces you to explore, giving you insight into how it works and what tweaks
    you can perform.


    # # Customise your new desktop


    ![](img/420a7272a6efa239082a35eeadd9bc1d_102_0.png)


    # 1. Tweak the taskbar


    The Cinnamon''s taskbar is called the panel and it split into three sections:
    menu button, app shortcuts and applets. You can pin app shortcuts to it by clicking
    ''Menu'', right-clicking the app shortcut and choosing ''Pin to panel''. Right-clicking
    the panel reveals more options, like adding new applets or adding a second panel
    (choose ''Modify panel...'').


    ![](img/420a7272a6efa239082a35eeadd9bc1d_102_1.png)


    # 2. Customise look and feel


    Click the ''Menu'' button and select the ''System Settings'' button to change
    the way Cinnamon looks. In the Appearance section, you can change the background
    and system font (you''ll see options from other desktops you''ve installed too).
    Selecting Themes and clicking ''Add/remove desktop themes...'' you can download
    more themes to pick from.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_102_2.png)


    # 3. Change behaviour


    Hot Corners enable you to specify actions that occur when your mouse goes into
    a corner of the screen, such as showing the desktop or displaying all workspaces.
    Windows is where you can edit the way windows behave and alter the display of
    the task switcher. Finally, the Extensions allows you to customise using third-party
    plugins.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Remote desktop: An easy guide


    You''re over here, but the Windows PC you want is over there. What to do? Well,
    we have a solution: a remote desktop connection.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_103_0.png)


    One is never enough. These days most people – especially Linux-using enthusiasts
    – are likely to have more than one PC in their homes. Perhaps they even have home
    servers, media boxes, laptops and more. The annoyance is when you want to use
    more than one at once. Sure, you can pop a laptop next to your desktop. But what
    if you''re slumped in front of the TV and need something from the desktop upstairs?


    Enter remote desktop. This comes in a number of forms, but the basic concept is
    that it enables one remote PC to connect to another PC, over a network (even the
    internet) and take control of it. It''s as if you were sat in front of the remote
    machine. Sound crazy? Gamers livestream their gameplay – effectively, remote desktop
    is just the same.


    Isn''t this a huge security risk? Well yes, if you don''t use strong passwords
    and limit access. But we''ll explain ways to minimise the risks. The first of
    which is not to open access to remote desktop over the internet without ensuring
    all the relevant user accounts are locked down. See the boxout for an option that
    we think is more secure and easier to set up.


    For accessing PCs on your local home network we''re going to use something called
    rdesktop [could that stand for remote desktop, possibly? – Ed]. Open a terminal
    and type:


    ```

    `sudo apt-get install rdesktop`

    ```


    We''re ready to connect to your Windows PC. The client is sorted – the server
    needs tweaks. Ensure your Windows box is ready to accept remote access. On the
    Windows PC log in, locate the Computer Start Menu entry, right-click on this and
    select Properties > Remote Access > Allow Connection.


    It''s possible to tell Windows who can have access. Windows also uses user accounts
    and it''s most sensible to create an account just for remote access with restricted
    access. However, it''s likely your main account has administrator level access,
    so we''ll by default have the relevant privileges for remote access. You can use
    the Select Users button to add additional accounts here.


    To give a standard user Remote Access privileges select Start > Computer > Manage
    > Local Users and Groups > Users. A list of existing users is shown on the right.
    Double-click on the relevant user and select Member Of > Add > Advanced > Find
    Now and in the list select Remote Desktop User > OK > OK > OK. That user will
    now have remote access.


    You''ll also need to know the IP address of the Windows system. One way to find
    this is to open the Start Menu, type CMD and click OK. Type ipconfig and press
    return. Look up the IPv4 Address line.


    We''re now ready to connect from Linux to Windows remotely. Using rdesktop from
    the terminal takes the basic form of:


    ```

    `rdesktop <ip address>`

    ```


    However, it''s useful to add a couple of options to include screen resolution
    through g <g><Width> plus a username with u "username". It''s also worth using
    f -fr, which turns on bitmap caching and RDP compression. If you want better colour
    reproduction adding 32 -b 32 will attempt to force 32-bit colour, though it''s
    likely this will failback to 24-bit and frankly a 16 is fine. So putting this
    all together looks like this:


    ```

    `rdesktop -u "username" -g 1280x720 -a 32 -fr 192.168.xxx.xxx`

    ```


    You can even redirect the sound, clipboard and other peripherals using the fr
    option. So for sound add fr sound:local. Getting technical, rdesktop using the
    Windows RDP (Remote Desktop Protocol): by default Linux has no specific remote
    desktop system installed. As we now know how rdesktop works, we might as well
    stick with that when it comes to connecting two Linux machines together. Before
    a Linux PC can be connected to, you need to install an RDP server. To do this
    in a terminal type:


    ```

    `sudo apt-get install xrdp

    sudo apt-get install ubuntu-desktop

    echo obsesion > /etc/default/rdp/xrdp-session`

    ```


    On Ubuntu this is something of a fudge, as the default 3D Unity desktop won''t
    work with most remote desktop systems. To get around this we''ve installed an
    alternative desktop – this will look a little different, but it''s the same system
    underneath (for more on alternative desktop environments,


    ![](img/420a7272a6efa239082a35eeadd9bc1d_103_1.png)


    # > Viewing your Windows desktop from a Linux box is easy. Why get off your rear?'
