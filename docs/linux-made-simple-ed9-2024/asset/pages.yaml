  md: "```\n```\niprall\npci=nomconf\npci=noms\n```\n\n```\n\n+   * Note the difference\
    \ in spelling between the second and third set of options – about all that **apci**\
    \ and **apic** have in common is the letters in their names. Press **F10** to\
    \ boot with the options you added. Once you find a combination that has the kernel\
