  md: "Menu and choose System Settings to review current settings under the Hardware\
    \ section. You can source missing drivers from the manufacturer's website if necessary.\n\
    \nNow you've dipped your toes in the water and discovered it to be not that deep\
    \ (or cold), take your first system backup of your new dual-boot system using\
    \ `Redo Backup`. Once complete, you can start to dig a little deeper into Linux.\
    \ Let's start with the file system – Windows uses NTFS, there's the universal\
    \ FAT32 file system, of course, and now you've got a third file system, Ext4,\
    \ in place. When you boot back into Windows you'll find your Linux partitions\
    \ are invisible – that's because Windows can't see Ext4. That's why your shared\
    \ data partition – if you created one – was formatted as NTFS.\n\nOpen the `Nemo`\
    \ file manager again and you'll find yourself inside the `Home` folder: when –\
    \ if you manually configured your partitions when installing Mint – may be a separate\
    \ partition. Like your Windows user folder, this contains all your personal data.\
    \ It can also contain personal programs and settings too.\n\nClick the `Computer`\
    \ shortcut in the left-hand pane and you get to see Ubuntu in all its messy glory.\
    \ Many of these folders can be ignored, while two worth noting are `Media` and\
    \ `Mint`. These are where shortcuts to all external drives and network folders\
    \ are found. The key difference is that drives mounted to `/media` are done so\
    \ on a per-user basis.\n\n# ## Key system tools\n\nThe following utilities help\
    \ you tweak various parts of Mint without having to use the Terminal. Click `System\
    \ Settings` to get a dialogue box similar to Windows' `Control Panel`. Here you'll\
    \ find lots of useful tools for tweaking your installation: The `Appearance` section\
    \ is where you customise Cinnamon's look, but also look under `Preferences` for\
    \ areas where you can change the `Cinnamon` desktop's behaviour. If you select\
    \ the `Windows > Behaviour` tab and tick the `Attach dialogue windows to the parent\
    \ window` switch 'Off' you can change the way Mint handles each separate dialogue\
    \ box that's opened if you prefer the way Windows does it.\n\nMint also includes\
    \ a number of handy built-in tools – there's the `Disks` tool (which we touch\
    \ on in the `Share data with Windows` box, p20), plus `Disk Usage Analyser`, which\
    \ enables you to see a graphical breakdown of how your drive space is being used.\
    \ The `System Monitor` tool is, essentially, the equivalent of Windows' `Task\
    \ Manager`, and the `Update Manager` is where you go to keep Linux up to date.\n\
    \n![](img/420a7272a6efa239082a35eeadd9bc1d_20_0.png)\n\n# ### The Terminal\n\n\
    At some point you'll need to access the Terminal. And once you've done so, you'll\
    \ quickly realise it's the best way to do certain things. At the very least, familiarise\
    \ yourself with the basics with this handy list of commands and you can press\
    \ tab to complete commands and even file/folder names:\n\n+     * `dir` – lists\
    \ the contents of currently selected directory.  \n+     * `cd` – for changing\
    \ directory – use `cd ..` to move up a level, `cd /foldername` to move to a subfolder\
    \ within the current directory or `cd /home/username/Downloads` to jump to a specific\
    \ directory. Note that folder names are case sensitive. To jump back to your `home`\
    \ directory, type `cd ~` at any time.  \n+     * `cp` – copy files. Other file-management\
    \ commands include `mv` (move), `mkdir` (create folder) and `rm` (delete file).\
    \  \n+     * `sudo` – performs a task as an administrator. This is the equivalent\
    \ of right-clicking a program in Windows and choosing 'Run as administrator'.\
    \ The command precedes other commands (eg, `sudo apt-get install syncthing`),\
    \ and you'll need to provide your password the first time you use it.  \n+   \
    \  * `apt-get` is a tool for installing and `upgrade` to update all existing software,\
    \ and `apt-get check` to look for problems with software (known as broken dependencies).\
    \  \n+     * `wget` [downloads from the `Downloads` folder: eg `wget` \n+    \
    \ \n+   http://addresses.com/filename.gz.]\n\nTo find out more about the Terminal,\
    \ check out the beginner's guide at `www.rayansutorials.net/linuxtutorial`.\n\n\
    > > Take more control over our Cinnamon desktop using the System Settings tools\n\
    > \n> #### Quick tip\n> \n> Drive names\n> \n> A confusing point when moving to\
    \ Linux is where the drive names go. In Windows we have the C:, D: and E: drives.\
    \ Linux uses a 'flat' file system, where the drive letters are just drive labels\
    \ and the root is `/`.\n\n# ## Change desktops\n\nOne of Linux's strengths is\
    \ that you're not tied to a single desktop. If you've installed Ubuntu rather\
    \ than Mint you'll find it comes with a very different desktop environment in\
    \ the form of `Unity`. It's still reasonably familiar to use, but you will have\
    \ to make a bigger effort to master it.\n\nIf you're struggling to acclimatisie\
    \ to Unity, and would rather use Mint's Cinnamon desktop instead, then you can\
    \ easily do so. First, open a Terminal window and type:\n\n```\n```bash\nsudo\
    \ add-apt-repository ppa:ubuntu-cinnamon\nsudo apt-get update && sudo apt-get\
    \ install cinnamon\n```\n```\n\nThis will add the Cinnamon repository (repos)\
    \ to Ubuntu, then download and install it. Once installed, you need to click the\
    \ `Settings` button in the top right hand corner of the Unity desktop and choose\
    \ 'Log out' to return to the login screen. You'll use a little Ubuntu icon appear\
    \ next to your username – click this and a list of available desktops will appear,\
    \ including Cinnamon. Select that to boot into your new desktop, complete with\
    \ all the features we describe on the rest of this page. You can always switch\
    \ back to Unity from the login screen.\n\nIf you subsequently outgrow the Cinnamon\
    \ desktop, then you can easily switch desktops in Mint too. You can even install\
    \ multiple desktops and move between them as circumstances dictate.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_20_1.png)"
