- pgno: 35
  md: '# ## Internet apps


    Get the best of the web with these tools.


    # Firefox


    One of the most widely recognised pieces of open source software, Mozilla''s Firefox
    web browser is the default browser on virtually every Linux distro. It''s pretty
    responsive and known for its privacy features. You can customise it to the bit
    and also extend it with an impressive number of extensions.

    www.firefox.com


    # RSSOwl


    An excellent desktop alternative to Google Reader, RSSOwl is a news aggregator
    for RSS and Atom News feeds that''s easy to configure. The app gathers, organises,
    updates, and stores news in an easy to use, and saves selected items for offline
    viewing and sharing.

    www.rssowl.org


    ![](img/420a7272a6efa239082a35eeadd9bc1d_35_0.png)


    # gFTP


    The gFTP client is a feature-rich client that''ll get the job done, if you need
    to download files via FTP occasionally. It has a simple two-pane interface that
    shows the content of the local and remote filesystem. Using gFTP you can also
    transfer files between two remote servers.

    http://gftp.seul.org


    # Midori


    The go-to browser for anyone concerned about resource consumption, Midori is popular
    with lightweight distros. Despite its lightweight nature and design, Midori has
    all the features you''d expect from a web browser including a speed dial, tabbed
    interface, bookmark management and configurable web search as well as an incognito
    mode.

    www.midori-browser.org


    # FileZilla


    For those who use FTP a lot, there''s FileZilla. The client supports FTP, SFTP
    and FTPS protocols and has just about any configuration option you can imagine.
    It also has a tabbed interface so you can browse more than one server and even
    transfer files simultaneously between multiple servers.

    https://filezilla-project.org


    # Tox


    Privacy conscious users should try the new decentralised IM and VoIP client called
    Tox. This relies on a distributed network, which uses P2P connections, the same
    technology used by BitTorrent to provide a direct connection, between users for
    chats and, unlike other Skype alternatives, Tox uses no centralised servers or
    supernodes, which could be compromised. All chats are also encrypted using the
    peer-audited NaCl crypto library.

    https://tox.im


    ![](img/420a7272a6efa239082a35eeadd9bc1d_35_1.png)


    # Jitsi


    Jitsi is the best VoIP app, as long as you''re not averse to Java apps. It supports
    IM and make one-to-one audio and video calls, as well as audio conference calls.
    It supports many of the widely used IM and telephony protocols, including SIP,
    XMPP, AIM, ICQ, MSN, etc. Jitsi has all the features you''d expect from a softphone,
    and more, such as encrypt text chats with OTR and voice and video by establishing
    a ZRTP session.

    https://jitsi.org


    # Deluge


    BitTorrent is popular for downloading Linux distros and there are numerous download
    clients. One of the best is Deluge which has multiple front-ends, including a
    graphical and a web-interface. It has features that enable advanced users to tweak
    it to their liking and also has a nice library of plugins.

    www.deluge-torrent.org


    # Aria2


    What makes Aria2 a unique utility is that it can download the same file at the
    same time using different protocols. The lightweight CLI app can download via
    HTTP, FTP, BitTorrent and Metalink and can also open multiple connections to download
    the file faster.

    http://aria2.sourceforge.net


    # Pidgin


    Pidgin is a wonderful app for instant messaging over many network protocols. You
    can sign in with multiple accounts in the single client and chat with many friends
    in different networks. You can use it to connect to AIM, MSN, Google Talk, Yahoo,
    Jabber, IRC and more chat networks all at once.

    www.pidgin.im


    # Media


    # 0 A.D.


    This is a real-time civilisation-building strategy game that features impressive
    graphics and intense battle gameplay. It''s yet to have a final release but has
    already won accolades in its current state.

    http://play0ad.com


    # FreeCiv


    A strategy game that challenges players to lead their tribe from 4,000 BCE to
    the space age.

    www.freeciv.org


    ![](img/420a7272a6efa239082a35eeadd9bc1d_35_2.png)


    # Alien Arena


    A popular first person shooter with a sci-fi theme and the tournament style deathmatch
    of Quake and Unreal Tournament. The game has several game modes and over 60 maps,
    and is quite configurable.

    http://red.planetarena.org


    # OpenMW


    OpenMW is a new game engine that recreates the popular Morrowind RPG. The aim
    of the project isn''t to improve game assets or add additional features but to
    provide gamers a more moddable edition of the game.

    https://openmw.org


    # FlightGear


    For fans of aircraft simulators there''s FlightGear that aims to offer flight
    across real world terrain. It includes scenery for more than 20,000 airports,
    and can be extended with your own aircraft and locations.

    www.flightgear.org'
