- pgno: 63
  md: '# ## Audacity:

    # Editing audio


    Splicing, cutting and getting rid of awful noise are all within your grasp thanks
    to the free frills of Linux''s top audio editor.


    # ### Quick tip


    If you''re trying to remove a section of audio, zoom in and make sure you''re
    only the file at the exact point the waveform goes across the zero line. Anywhere
    else, and the edit will have an audible click when played back. Also remember
    you can insert silences and background noise to make edits to speech sound more
    natural.


    While Linux has a sterling reputation as a server and desktop operating system,
    it''s less well known that many major studios also use Linux for their creative
    workstations too. When it comes to high end audio production, for example, there
    are many powerful and stable packages that professional studios use for mastering
    music and film soundtracks all around the world.


    Industry grade programs for audio editing include the excellent Ardoar and LMMS
    (formerly known as the Linux Multimedia Studio). You''ll find both of these suites
    in the Ubuntu Software Centre and they''re well worth looking at just to understand
    the full potential of your OS. Both are completely free to download and use, and
    open source to boot.


    Before you get too involved, however, it''s worth pointing out that Ardoar and
    LMMS are top-end Digital Audio Workstations (DAWs). They''re a complete recording
    studio in software form and virtual mixing desks, WAV editors, MIDI sequencers
    and more built in. Ardoar or LMMS give you the kind of environment the late George
    Martin would have paid millions for, literally for free. DAWs support a huge variety
    of inputs and external hardware for audio production, and include virtualised
    version of equipment that''s the mainstay of audio engineers.


    For the newcomer, however, they''re more than a little bit intimidating. They
    each have multiple windows and are stuffed with technical jargon. What if you''re
    not scoring your latest composition for six mics and a string quartet, but just
    want to edit a podcast or a recording of your kids'' school choir into something
    you can upload online? Don''t worry. Ubuntu has you covered there too.


    # ### Sound it out


    The "go to" software for audio editing in Ubuntu is Audacity. Actually, Audacity
    is the hero application for basic sound work on all platforms, so it really that
    good. In Ubuntu, you''ll find it in the Software Centre just by searching for
    its name, so installing it is just a click and a password away.


    By comparison in the DAWs mentioned above, Audacity is much more simple in its
    appearance. By default there''s a room in the window for a single stereo sample
    and a bunch of straightforward editing tools. Don''t let that deceive you, however.
    Audacity has just as much as everything even a professional needs for preparing
    tracks.


    First thing you''ll need to do with Audacity is feed it some music, but before
    that you''ll need to make sure that the music can be read. Just as with playing
    back music (see page 66), if you want to work with sounds stored in popular but
    closed formats like MP3, you''ll need to install Ubuntu Restricted Extras from
    the Software Centre. This will add all the codecs for common media files to your
    PC.


    From Audacity, there are two ways to load music into the editing window. Under
    the File menu, you''ll see options for Open and for Import. If you select Open,
    you can drag and drop an audio file into the Audacity workspace or onto its icon
    in the Dash. Your file will open up as a new project. If you select Import, it
    will load on as a new track (or tracks) into the project you''re currently working
    on.


    Once you''ve done that, you''ll see your file represented as a wave form in the
    editor. If you imported a file recorded in stereo, you''ll see two tracks in your
    workspace, one for the right source and one for the left. You can add extra tracks
    using the Tracks menu at the top of the screen - they''ll appear underneath the
    initial one or two.


    If you''ve never seen an audio file as a wave form before, it''s fairly easy to
    understand. The middle of each track, at the 0 point on the y-axis, represents
    silence. So if there''s a part of the audio with a long flat line in the middle,
    then it''s nothing recorded there. Sounds are represented as spikes on either
    side of that line.


    At this point, there are two keyboard shortcuts that you should learn by heart.
    The first is the spacebar, which starts the audio playback from wherever the current
    marker is and also stops playback. The second is the Control key. Hold this down
    and scroll the mouse wheel in order to zoom in and out of the waveform. If you
    zoom in close, you can see that what looks like triangular chunks on both sides
    of the 0 line is


    ![](img/420a7272a6efa239082a35eeadd9bc1d_63_0.png)


    > If you need to remove segments of audio seamlessly, zoom in and cut at the exact
    point where it crosses the 0 line.'
