    the original file. Once a photo has been selected, you’ll see some simple tools
    at the bottom of the screen. These are mostly self-explanatory, Rotate, Crop,
    Straighten, Enhance and so on. Once you’ve made changes, you can export the image
    to a new file under the file menu.


    If these basic tools are not enough, you can set-up Shotwell to automatically
    open your favourite photo-editing software through the Preferences menu. Usually,
    this will be Gimp (see page 68) and you are able to launch it just by right-clicking
    on an image and selecting ‘Open with external editor’.


    The final really useful feature baked into Shotwell is that you can upload directly
    from its interface to your favourite online photo-sharing site, like Flickr. You
    can add online service by opening Edit > Preferences > Plugins > Publishing.


    and adding account details in Ubuntu’s ‘Online Accounts’ manager that you’ll find
    in the operating system Settings, accessible from the Dash.


    Some of these references are a little out of date – for example Google’s Picasa
    is listed although this has been subsumed by Google+ and Google Photos now – but
    uploading is easy nonetheless. From the album view, select the images you want
    to share and click Publish at the bottom of the window. Images will be sent along
    with metadata and captions as fast as your net connection allows.


    For all that, though, Shotwell does have its limitations and can be buggy if you’re
    working with large numbers of pics. If you want a really advanced library manager,
    and don’t mind installing a lot of the KDE dependencies, try the excellent digiKam
    from the Ubuntu Software Centre.


    # Learn Shotwell well


