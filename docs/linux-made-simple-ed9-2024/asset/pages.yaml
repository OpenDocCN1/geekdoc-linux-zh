  img_proc: true
- pgno: 56
  md: "# ## POP3 vs IMAP\n\nThere are two ways to receive email: POP3 (Post Office\
    \ Protocol) and IMAP (Internet Message Access Protocol). POP downloads messages\
    \ to your computer and (usually) deletes the originals from the server. It’s the\
    \ classic method, and good for those using a single machine or with a security-conscious\
    \ bent: if the mails are gone from the server, it’s going to be a lot more difficult\
    \ for them to be traced or spied upon. There are big disadvantages when it comes\
    \ to using POP3 on multiple machines – since it’s a one-way transaction, there’s\
    \ no synchronisation between mailboxes, so you won’t get an indication of the\
    \ messages you’ve read or replied to, and your filing systems won’t match up.\n\
    \nIMAP is a two-way protocol, and probably the better choice if your provider\
    \ offers it. Folders, read status and message deletions will all match up between\
    \ the server and your mail client, meaning you can use the same account on multiple\
    \ machines – and indeed use *webmail* and *Thunderbird* at the same time while\
    \ keeping things synchronised.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_56_0.png)\n\
    \n![](img/420a7272a6efa239082a35eeadd9bc1d_56_1.png)\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_56_2.png)\n\
    \n![](img/420a7272a6efa239082a35eeadd9bc1d_56_3.png)\n\ndatabase, however, so\
    \ you may have to fill in the blanks yourself. Your ISP or mailbox provider will\
    \ provide the **appropriate information**: we can’t tell you precisely what to\
    \ put here, because very ISP is different. You can now choose whether to use POP3\
    \ or IMAP with your account – see the box above for more details on each – and\
    \ hit **Done**. You may have to authorise the use of your email account in a further\
    \ window, but you should only have to do this once.\n\nA quick note for Gmail\
    \ users: if you have Google’s two-step authentication switched on (and you should\
    \ do), you’ll need to generate an app-specific password and use that, rather than\
    \ your regular account password, to log in to your email through *Thunderbird*.\n\
    \n# ### Split personality\n\n*Thunderbird*’s default main screen lists your email\
    \ account and its subfolders on the left, and has a main window on the right split\
    \ into two: the top pane contains the contents of your inbox, and the bottom pane\
    \ contains the currently selected email. Try clicking on your inbox in the left\
    \ column. *Thunderbird* will download all of your email from the server (this\
    \ could take a while) and, if you’ve used IMAP, you should retain the read/unread\
    \ status of your messages. By default, the inbox view displays messages in date\
    \ order with the oldest at the top, but you can quickly re-sort your messages\
    \ by clicking the column headers at the top.\n\nClick on a message and you’ll\
    \ see it appear in the bottom pane of the main window. If this is a bit small,\
    \ just hover your mouse over the bar between the panes and drag up to give yourself\
    \ a bit more space. Still not enough room? Double-click the message and it’ll\
    \ open up in a tab of its own, giving you the full height and width of your *Thunderbird*\
    \ window to play with. Click on the Inbox tab (or close the message tab) to get\
    \ back where you were. Further layout options can be found in the View menu at\
    \ the top of the screen.\n\n# ### In the book\n\nWhile you have a message open,\
    \ you’ll see all the usual email functions (*reply, reply all, forward* etc.)\
    \ lined up along the top of the window, and you can always hit the Write button\
    \ to fire up a new mail. If an email includes embedded images linked from the\
    \ internet, you’ll also, at least initially, see a bar with a\n\nPreferences button.\
    \ *Thunderbird* is restricting these images because, unlike plain old email, senders\
    \ can use images to glean information about your computer, and whether you’re\
    \ really the message. Hit **Preferences** and you can choose to view images in\
    \ just that email, for all messages from that address or domain, or head to the\
    \ main Remote Content Preferences section where you can switch off this feature\
    \ altogether.\n\nWhen you’re creating a new message, you’ll probably discover\
    \ that *Thunderbird* doesn’t actually have an address book to start with, even\
    \ if you’ve been using one with your webmail account. Manually importing your\
    \ address book (Tools > Import) is the only way to get this done. The process\
    \ is going to differ depending on your source, but it’s not incredibly difficult.\n\
    \nDifferent versions of *Outlook* tuck away the export options in slightly different\
    \ menus, but you should find them buried somewhere within the File menu. Make\
    \ sure you export your address book as **Comma Separated Values** or csv, as *Thunderbird*\
    \ has a way to accept this format. In Gmail, select the contacts section from\
    \ the top left of the main window, (just above the Compose button), click **More\
    \ then Export to find the option**.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_56_4.png)\n\
    \n> > Use the preferences button to determine which images you can see in emails\
    \ you’ve sent – you can get quite specific.\n\n> Quick tip\n> \n> You can set\
    \ up a signature to add to the bottom of all of your outgoing messages in the\
    \ Edit > Account Settings menu."
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Text editors: Word working


    Wrangling the raw meat of words doesn''t have to be torture. Here''s a guide to
    the best editors around.


    Quick tip

    Ubuntu includes gedit by default, but it''s been renamed `text editor` in the
    applications list. You can still find it by searching for `gedit`.


    Word processors have their uses. You can certainly crack out LibreOffice Writer
    and its ilk if you want to construct a beautifully formatted document, but when
    it comes to constructing unformatted plain text — be it coding for the web, assembling
    traditional programs, or just writing in an environment unsullied by font frippery
    — traditional text editors come into their own. With a lot of the fuss and unnecessary
    elements removed, they''re usually able to run with a much smaller memory footprint
    and therefore load faster, take up fewer system resources, and help you focus
    on the task at hand.


    If you''ve used Windows, compare the likes of Microsoft Word with Notepad. The
    latter doesn''t have many advanced features, but it certainly has its uses. On
    macOS, TextEdit fills the lightweight text editor role.


    Many Linux text editors don''t even need to be run in a graphical environment,
    meaning you can get your writing done on literally any machine. The usefulness
    of this aspect can''t be understated as you progress in your Linux adventure.
    Connect to any remote machine in text mode and you can edit configuration files
    or write scripts straight from the command line. You can, of course, run these
    without dropping to text mode by using a program like Terminal to bring the command
    line into your GUI.


    So let''s break down a few of your options, see what can be done with them, and
    contrast and compare their features.


    It should be noted that most of these editors include syntax highlighting — where
    the functions and variables of programming code are given different colours for
    ease of navigation — but it''s not incredibly reliable on console-based software
    because different terminals have different colour display capabilities. If it''s
    a feature you really need, opt for a GUI editor, or run the console apps through
    a program like `tmux`.


    # On the command line


    We''ll begin with the top-line text mode browsers, since many of these provided
    a blueprint for graphical editors that came later on.


    *Emacs* While many well-worn programmers will swear by this editor, we wouldn''t
    recommend it to newcomers. Getting used to its somewhat unusual control scheme
    and outrageously large list of features takes some serious effort. Most of *emacs*
    commands are hidden behind combinations of modifier keys ([Shift], [Ctrl], [Alt])
    so you''ll definitely need a cheat sheet.


    *Vim* Did we just say *emacs* took a lot of effort? Well *vim* is even more obtuse
    — but for a reason. It breaks its interface into several modes — insert, command
    and last-line to name three — which determine what''s possible. (When you''re
    in command mode, for example, typing on the keyboard won''t actually edit the
    document; instead, you type specific codes


    # Useful nano commands


    +   *   [Ctrl]+[6] – Mark – Begins selecting text at the current cursor location.
    You can also select with the mouse.

    +   *   [Ctrl]+[K] – Cut – Removes the selected text and puts it in the cut buffer.

    +   *   [Alt]+[6] – Copy – Puts current selection in the cut buffer without removing
    it.

    +   *   [Ctrl]+[U] – Uncut – Otherwise known as Paste. Inserts contents of the
    cutbuffer at cursor location.

    +   *   [Ctrl]+[0] – Write Out – Saves the file. If a mark is set, saves the currently
    selected text as a file of its own.

    +   *   [Ctrl]+[W] – Where Is – Search, essentially. Type the string you want
    to find and hit [Return].

    +   *   [Ctrl]+[C] – Replace – Type the string that you want to replace, then
    its replacement.

    +   *   [Ctrl]+[T] – To Spell – Sends your document to *spell* for spellchecking,
    if it''s installed.

    +   *   [Ctrl]+[J] – Justify – Makes unruly documents which have exceeded the
    screen width. Follow with [Ctrl]+[U] to undo this action. Note that if you have
    to undo this immediately; if you perform any other actions, you''ll have to manually
    uncjutify the text.

    +   *   [Ctrl]+[C] – Cursor position – Tells you where your cursor is. Also gives
    a handy line and character count.

    +   *   [Ctrl]+[?] – Help – Accesses *nano*''s built-in help system, which is
    more detailed than its man page.'
  merge: -1
