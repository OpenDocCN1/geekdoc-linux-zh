  md: '# Admin: Core commands


    20 terminal commands that all Linux web server admins should know.


    Are you an ''accidental admin''? Someone who realised, too late, that they were
    responsible for the workings of a Linux server and – because something has gone
    wrong – finds themselves lost in a world of terminals and command lines that make
    little sense to normal humans?


    What is SSH, you may be asking yourself. Do those letters after ‘tar’ actually
    mean anything real? How do I apply security patches to my server? Don''t worry,
    you''re not alone. And to help you out, we''ve put together this quick guide with
    essential Linux commands that every accidental admin should know.


    forums. But the first time you have to do something that isn''t straightforward
    to do through the graphical control panel, you''re suddenly out of the world of
    icons and explanatory tooltips and into the world of the text-only Terminal.


    To make things worse, for a lot of people the first time they have to deal with
    the Terminal is when something has gone wrong and can''t be fixed through the
    control panel. Or perhaps you''ve just read that there''s a major security flaw
    sweeping the web and all Linux servers *must* be updated at once (it happens –
    search for ‘Heartbleed’ to find out more). Suddenly you realise that your nice
    control panel hasn''t actually been updating your server''s operating system with
    security patches and your small personal blog may well be part of a massive international
    botnet used to launch DDoS attacks against others. Not only are you a stranger
    in a strange land, you''re probably trying to recover or fix something that was
    really important to you, but which you never gave much thought to while it was
    being hosted for a couple of pounds a month and seemed hassle-free.


    You are an ‘accidental admin’. Someone who is responsible for keeping a Linux
    webserver running and secure—but you didn''t even realise it. You thought all
    that was included in your couple of pounds a month you pay to your ISP – and only
    found out it''s not when it was too late.


    Since most web servers are running Ubuntu, this guide is based on that particular
    distribution. And all the commands here are just as applicable to a Linux desktop
    as they are to a web server, of course.


    # Becoming an accidental admin


    While we''d argue that they should, not everyone who starts using Linux as an
    operating system does so through choice. We suspect that most people''s first
    interaction with Linux happens somewhat unwittingly. You click a button on your
    ISP''s account page to set up a personal or business web server – for a website,
    email address or online application – and suddenly you''re a Linux admin. Even
    though you don''t know it yet.


    When you are starting out with your host server, things are usually straightforward.
    Nearly all hosting providers will give you a web interface such as Cpanel or Plesk
    to manage your server. These are powerful pieces of software that give you quick
    an easy access to logs, mail services and one-click installations of popular applications
    such as Wordpress or


    # $ sudo


    The most fundamental thing to know about Linux''s approach to administration is
    that there are two types of accounts that can be logged in: a regular user or
    an administrator (aka ‘superuser’). Regular users aren''t allowed to make changes
    to files or directories that they don''t own –and in particular this applies to
    the core operating system files which are owned by an admin called ‘root’.


    Root or admin privileges can be temporarily granted to a regular user by typing
    `sudo` in front of any Linux command. So to edit the configuration file that controls
    which disks are mounted using the text editor, nano, you might type: `sudo`


    ![](img/420a7272a6efa239082a35eeadd9bc1d_121_0.png)


    > > **Can''t remember that really clever thing you did last week? History is your
    friend.**'
