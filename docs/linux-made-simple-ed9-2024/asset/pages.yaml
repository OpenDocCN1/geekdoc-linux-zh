  md: "# Get unsupported scanners working\n\nIf, after your best efforts, you’re still\
    \ unable to get your scanner set up using SANE, then take a trip to www.hamrick.com\
    \ where you’ll find a program called VueScan which promises to support over 2,500\
    \ scanners.\n\nClick the supported scanners link to browse by manufacturer – if\
    \ your model is listed, then download the tarball and extract the VueScan folder,\
    \ then double-click execute inside to launch the program proper. It should detect\
    \ your scanner automatically, then provide you with a simple step-by-step wizard\
    \ to preview and scan using the program.\n\nVueScan provides a lot of useful tools\
    \ to help you get the perfect scan, and it works with many scanners that are already\
    \ supported in Linux too, so if you’re struggling to get to grips with XSane,\
    \ consider giving it a whirl. The only downside is that it’s not free – the Standard\
    \ Edition costs $39.95, while the more fully featured Pro Edition costs $99.95\
    \ (you can upgrade from Standard to Pro for the difference at any time, too).\
    \ The good news is that VueScan is fully functional for the purposes of evaluation\
    \ (other than a watermark across all your scans), so you can be sure it’s right\
    \ for you before making a purchase.\n\nthese – again, if they’re provided with\
    \ an install.sh script, follow the step-by-step guide (see p70) to get them installed.\n\
    \nIf your scanner is part of a multi-function device than its drivers should be\
    \ integrated with the printer’s – if you added the printer component of a MFP\
    \ without installing specific drivers, then you’ll need to source and install\
    \ these to get the scanner up and running. If you’ve installed drivers previously,\
    \ but the scanner isn’t detected, try installing them again over the top of the\
    \ original drivers – we found this worked with our Dell B1265ndf after the scanner\
    \ failed to show up. Once installed, your drivers may provide own utility to help\
    \ you verify the scanner is now recognised – eg Dell users should see a DELL Unified\
    \ Driver Configurator shortcut on the desktop – or you’ll need to fire up Simple\
    \ Scan again at which point your scanner should now be visible.\n\nFor more troubleshooting\
    \ advice on using SANE to detect your scanner, see https://help.ubuntu.com/community/Scanners\
    \ or take a look at the box on VueScan.\n\nAs we’ve seen, Ubuntu comes with the\
    \ Simple Scan front-end for SANE, which provides you with a simple, no-frills\
    \ interface for your scanner. It’s good for confirming your scanner works, but\
    \ it lacks key tools like a preview function or the ability to fine-tune your\
    \ scanner’s settings.\n\n# Time to scan\n\nHowever, if you really want to push\
    \ the boat out, open the Ubuntu Software Center and search for ‘xsane’ to locate\
    \ and install XSane, a more powerful scanning front-end. Once launched it’ll display\
    \ four windows – start by clicking ‘Acquire preview’ to create a preview of the\
    \ image you’re trying to scan. Once done, use the Standard Options window to select\
    \ your image – choose ‘Custom’ under Page Format and then crop in using the four\
    \ measurements beneath it.\n\nNext, click the 1:1 magnifying glass button in the\
    \ main window to zoom into the preview. Use the eyedropper tools to select white,\
    \ black and grey parts of the image for colour correction purposes, you can then\
    \ use the histogram’s sliders in the top left-hand window to fine tune the colour\
    \ balance. The right-hand window is where you choose where to save the file, what\
    \ format to use and so on – choose 16 million colours for photos and ensure the\
    \ scan resolution is increased from 75dpi to 300dpi or 600dpi if you want a hi-res\
    \ scan. There are also controls for adjusting brightness, contrast and gamma.\n\
    \nBy default, your scan will open in XSane’s Viewer window when you click ‘Scan’\
    \ – it’s a good idea to perform one scan like this, so you can review your image\
    \ and perform further optimisation. Once you’re happy with your changes, click\
    \ ‘Viewer’ and change to ‘Save, then click ‘Scan’ one last time.\n\nAnother benefit\
    \ of XSane is that it integrates with GIMP – this allows you to scan directly\
    \ to it, and then fine-tune your image accordingly. Launch GIMP, choose File >\
    \ Create > XSane to select your scanner or perform a search for your available\
    \ devices. Everything’s handled identically here except for one critical part:\
    \ there’s no output option, so once you click ‘Scan’ your image will automatically\
    \ be transferred to open in GIMP.\n\nXSane also links in with the good tool to\
    \ a built-in Optical Character Recognition (OCR) engine. This allows you to scan\
    \ in printed documents and convert them into editable text. It’s a flexible solution,\
    \ but if you want to try something else then install both cuneiform and YAGF from\
    \ the Ubuntu Software Center. Cuneiform is an alternative OCR engine while YAGF\
    \ provides a neat front-end to both cuneiform and Tesseract and is an OCR engine\
    \ that’s renowned for its accuracy. YAGF integrates nicely with XSane too – launch\
    \ YAGF, click the ‘Scan’ button and it’ll open XSane. Set the colour to ‘Black\
    \ and White’ and Line Art’ and set the dpi to 600. Click ‘Scan’ and the document\
    \ will be scanned and sent back to YAGF. From here, review the scan image, then\
    \ use the controls above the scanned image to prepare it for recognition. Once\
    \ done, click the red ‘OCR’ button next to the language drop-down menu. YAGF will\
    \ use Tesseract by default to decode the page, with the editable text placed in\
    \ the right-hand pane for you to review and correct. Don’t like the results? Choose\
    \ Settings > OCR Settings, select cuneiform and click OK, then try that instead\
    \ – in our tests, Tesseract performed better, but not by much. Be prepared to\
    \ try and fine-tune the original scan if necessary to make the text as clear and\
    \ legible as possible.\n\nOnce you’re done reviewing and editing the text, you\
    \ can save it as a TXT file or copy it to the clipboard, ready for pasting into\
    \ Writer or another editing program.\n\nCongratulations, your scanner is now set\
    \ up to perform both standard and text-based scans.■\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_84_0.png)\n\
    \n> **Quick tip**\n> \n> It’s also possible to use OOPS to ‘print’ documents to\
    \ PDF file where no native PDF option is provided. Install cups-pdf from the Ubuntu\
    \ Software Center – once done, a new PDF printer will appear as an option when\
    \ printing."
