  md: '![](img/420a7272a6efa239082a35eeadd9bc1d_70_0.png)


    import into the current project. To the right of that is the video preview window
    and at the bottom are two Track timelines.

    To import a clip, either drag and drop it from the file browser or desktop into
    the list space, or click the add clip icon on the top of the screen.

    You will notice that Openshot''s toolbar, which is between the clip list and the
    timelines, is very small. In fact, there are only three real tools to pick from.
    The Arrow tool allows you to drag and drop clips around, the Razor tool (the scissors)
    slices a clip at the current point, and the resize tool automatically discards
    all video up to the current point. The downward arrow creates markers for reference
    when you are editing.

    To get started, drag a clip from the list and put it onto one of the timelines.
    Now, you can start playback of the clip in the preview window with the spacebar,
    or the player controls under the preview window itself.

    Editing is easy. Say you want to trim the first three seconds from your video
    – the bit where you''re steadying the camera and issuing instructions to your
    actors. Stop playback or move the current playback marker to the point the real
    action starts and select the resize tool. Click on the point you want to start
    from the first few seconds will disappear.


    # Editing proper


    Using the Razor tool is similar, but you keep the first three seconds as a separate
    clip, which can now be manipulated independently on the timeline. This is useful
    if you want to take several short segments from a long clip, and stitch them together.
    Cut out the sequences you want to keep, and then select and delete the ones you
    don''t.

    The important part of video editing is how you stitch the clips back together
    again – and this is why there are two tracks in the timeline. To create an edit,
    you can either take two clips and put them together on one track, but the effect
    is likely to be jarring. Better to put align the clips, but put them on separate
    tracks with the end part of one clip slightly overlapping the start point of the
    other.


    If you do that and press play, the edit will be the same as if they''re together
    on the same track, but with the end point of the first clip overlapped. At this
    stage, you need to add a Transition – you''ll see the Transition tab at the top
    of the screen. Transitions are effects that blend two clips together – either
    as a fade, a wipe, or something more dramatic.

    To apply a Transition, drag and drop it over the point where the clips overlap.
    When you preview the footage you''ll see a smooth blend with an added effect between
    the clips.

    The third tab at the top, Effects, offers up a range of simple options for adjusting
    colours, brightness or applying other effects (like film grain or cinema-style
    lines) to a clip. You drag and drop these over the clip you want to alter just
    as with the Transitions.

    Once you''ve stitched together a whole sequence, you can opt to add a separate
    third track with a separate audio, like background music. You can also use Openshot
    to make a photo slideshow: images can be imported into the playlist just like
    video clips. Just drag them onto the timeline and you can after how long they
    appear on screen for.

    When you''re done, click the Export Video button and tell Openshot how to encode
    the final video. This can be in a variety of resolutions and file format containers.
    Remember to save the project too before closing, so that you have the original
    timeline of edits to go back to at any time if you want to re-edit or make changes.


    # Taking it further


    If you edit lots of video, you''ll soon outgrow Openshot, and that''s where Kdenlive
    kicks in. A full suite of editing tools that''s used by broadcast media around
    the world, the basic principles of Kdenlive are exactly the same. The key difference
    is that all the transitions and effects are far more customisable in Kdenlive,
    and there''s support for more plugins and professional tools and techniques.

    The other big difference is that you have two preview windows. The first is for
    editing a clip before adding it to the timeline, the second is a preview of the
    final work.


    > **Quick tip**

    > The second slider is for zooming in and out on the timelines. The most you can
    see at anyone time is a 200 second section of video.'
