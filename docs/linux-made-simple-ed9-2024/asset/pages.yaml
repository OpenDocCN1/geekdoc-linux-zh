- pgno: 24
  md: '# Genus Debian


    Made of free software and evolving…


    The Debian project has played a significant role in the evolution of Linux and,
    in many ways, is the first real distribution created for the regular computer
    user. It was announced in August 1993 and had its first public release later that
    year, although its first stable release wasn’t available until 1996. The project
    was even sponsored by the Free Software Foundation from November 1994 to November
    1995.


    A key motivating factor that led Ian Murdock to create a new distro was the perceived
    poor maintenance and prevalence of bugs in the Softlanding Linux System (SLS)
    distro. Besides the software itself, Murdock’s release included the Debian Linux
    Manifesto, which outlined his view for the new project, which prophesied that
    “distributions are essential to the future of Linux.” In the Manifesto, he called
    for the distro to be maintained openly, in the spirit of Linux and GNU. One of
    the most significant goals for the distro was to “eliminate the need for the user
    to locate, download, compile, install and integrate a fairly large number of essential
    tools to assemble a working Linux system.” In order to meet this goal, Debian
    developers made a significant contribution to the Linux world – the dpkg package
    manager.


    This was originally written as a Perl program by Matt Welsh, Carl Streeter and
    Ian Murdock, and the main part of the tool was rewritten by Ian Jackson who became
    Debian


    ![](img/420a7272a6efa239082a35eeadd9bc1d_24_0.png)


    > Even the most popular distribution for the Raspberry Pi called Raspbian, is
    based on the Debian Project.


    # Rules of engagement


    Another distinguishing aspect of Debian is that the distro is made entirely of
    free software. The project uses the Debian Free Software Guidelines (DFSG) to
    help determine whether a piece of software can be included. The DFSG is part of
    the Debian Social Contract which defines the moral agenda of the project.


    The project produces three distros: Stable, Testing and Unstable. A Stable release
    is available every two years and is made by freezing the Testing release for a
    few months. Testing is designed to be the preview distro with newer packages and
    during the freeze any bugs are fixed and extremely buggy packages are removed.
    All releases are named after characters from the Toy Story films (the current
    Stable release is codenamed Jessie). All new packages are introduced in the Unstable
    release (codenamed Sid). This distro is for developers who require the latest
    packages and libraries. It’s not intended to be used on a production machine and
    those interested must upgrade Debian Testing to get the latest Unstable.


    # “The Debian Linux Manifesto prophesied that “distributions are essential to
    the future of Linux”


    Project Leader in 1998. It really is no surprise then that Debian is one of the
    most popular choices for derivative projects with over 130 active distros based
    on Debian (Source: http://distrowatch.com), including the likes of Ubuntu and
    a version of Linux Mint.


    The project also provides guidelines to help the derivative distros merge their
    work back into Debian. In addition to the derivatives there are several ‘Pure
    Blends’; these are subsets of Debian configured to support a particular niche,
    such as


    # Linux Mint Debian Edition


    The Linux Mint Debian Edition (LMDE) is meant for users who wish to experience
    the best of Debian (directly rather than via Ubuntu) in an easy to use package.
    It’s based on Debian Testing and is a semi-rolling release, which means it receives
    periodic updates via Update Packs. These are tested snapshots of Debian Testing
    to ensure stability and LMDE is binary compatible with Debian, which means you
    can switch to Debian Testing or Unstable for more frequent and bleeding-edge updates.
    However, LMDE isn’t compatible with Linux Mint, so you can’t use Ubuntu PPAs.


    LMDE is designed to offer the same look and functionality of Linux Mint and is
    available as 32-bit and 64-bit Live DVD images with either the Mate or Cinnamon
    desktops. The distro ships with Firefox, Thunderbird, VLC media player and a plethora
    of other commonly used apps. Adobe Flash plugin and most other multimedia codecs
    are installed by default. The software repos and the underlying Deb package system
    makes software installation easy, thanks to tools, such as the Synaptic Package
    Manager.




    ![](img/420a7272a6efa239082a35eeadd9bc1d_24_1.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_24_2.png)'
