  md: "remount it in read-only mode – for example:\n\n```\n`remount -r /media/nick/RP0`\n\
    ```\n\nIf you find you can’t remount a drive using the `-r` command, you can use\
    \ the `-f` flag instead on each mounted volume from that drive to remount them\
    \ in read-only mode. This means you can then physically remove the drive without\
    \ worrying about data loss.\n\n# Optical drives\n\nCD and DVD drives are handled\
    \ differently to regular hard drives. First, they’re assigned different IDs –\
    \ `/dev/sro`, `/dev/srl` and so on. You’ll also see they’re marked as read-only\
    \ by default, even if the drive itself is a burner.\n\nHow you interact with discs\
    \ depends on the disc itself. If the disc is recognised, it’ll be mounted inside\
    \ the `media/<username>` folder like other removable drives, making it accessible\
    \ through the Terminal as well as via Nautilus. If the disc is a straightforward\
    \ data disc, it should open in Nautilus, enabling you to browse and access its\
    \ contents.\n\nOther types – multimedia and writable discs – are handled slightly\
    \ differently. A pop-up window will appear, similar to that which appears when\
    \ you insert a disc in Windows. You’ll be asked if you want to open a specific\
    \ application, which varies on the type of disc you’ve inserted, plus there are\
    \ options for opening the drive in Files to explore its contents, or do nothing.\n\
    \nYour app choice depends on what’s installed – Ubuntu ships with four apps that\
    \ can be used from the off: Rhythmbox (playing and ripping audio CDs), Videos\
    \ (watching DVD movies), CD/DVD Creator (burning data discs) and Brasero (burning\
    \ all kinds of discs, including DVD, SVCD and Audio CD).\n\nBy default, Ubuntu\
    \ can’t play certain restricted formats, including encrypted DVDs. To play commercial\
    \ DVDs, install the libdvd-pkg software from the Software Centre – once done,\
    \ you’ll find Videos is able to play them, as will other third-party tools, including\
    \ VLC Media Player.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_88_0.png)\n\n\
    > Rhythmbox can extract audio from your CDs as well as play them back to you.\n\
    \n# Burn discs\n\nInsert a blank disc and you’ll be prompted to open CD/DVD Creator.\
    \ This provides a similar interface to Nautilus – drag files onto the window,\
    \ give your disc a suitable title and click ‘Write to Disc’ to burn a data disc.\n\
    \nA more sophisticated tool for burning discs comes in the shape of Brasero. Launch\
    \ this when prompted (or open it from the Dash) with a blank disc inserted into\
    \ your drive, then select your project: you can create an audio CD, data disc,\
    \ or video DVD/SVCD, plus there are tools for copying one disc to another as well\
    \ as burning discs from support image formats (ISO, TOC and CUE). There’s even\
    \ a built-in cover editor (select Tools > Cover Editor) for designing and printing\
    \ a cover for a regular CD jewel case, plus you can erase rewritable discs by\
    \ selecting Tools > Blank...\n\nBrasero is simple to use as the annotation below\
    \ reveals – it’s mostly just a case of dragging and dropping the files you wish\
    \ to add to your disc in the correct order. There are also plenty of alternative\
    \ burning tools out there – to create a video DVD with menus and try DVDStyler,\
    \ for example, or check out K3b for a more general-purpose alternative.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_88_1.png)\n\
    \n# Exploring Brasero\n\n**Access older projects**  \nChoose File > Save to make\
    \ a copy of your project before you’re ready to burn it. You can then return to\
    \ it for further tweaking.\n\n**Project type**  \nBrasero allows you to burn all\
    \ kinds of discs: audio, video and data, plus burn discs from image files and\
    \ copy from one disc to another (two optical drives required).\n\n**File and folder\
    \ controls**  \nThese buttons allow you to add and remove files to your project,\
    \ plus perform other context-sensitive tweaks such as creating new folders for\
    \ data discs.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_88_2.png)\n\n**File\
    \ list**  \nReview the current list of files, tracks or videos that you plan to\
    \ burn – media tracks can be clicked and dragged to change their running order.\n\
    \n**Choose media**  \nClick this dropdown menu to switch between available drives\
    \ or make a data image. A handy guide tells you how much free space is left.\n\
    \n**Burn disc**  \nOnce you’re ready, click the Burn button. Set your speed, plus\
    \ weak options like leaving the disc open. You can even burn several copies if\
    \ required."
