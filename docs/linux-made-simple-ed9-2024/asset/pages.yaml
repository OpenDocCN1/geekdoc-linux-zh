  md: '# # Ubuntu: Google authenticator


    We demonstrate how to put two authentications into your system account.


    Locking access to your computer (and the data it holds) with just a password doesn''t
    cut the mustard any more in this age of multi-core processors and easy to use
    password cracking tools. If you''re really concerned about unauthorised access
    to your computer, you should definitely add an additional layer of authentication.


    One of the easiest mechanisms to implement such a two-step verification is the
    Google Authenticator service, which issues a time-based authentication token to
    supplement the existing password challenge. Once you''ve integrated the service
    with your Ubuntu login, in addition to your user password, you''ll be prompted
    for one of the quickly expiring tokens before being allowed to log in. Google
    Authenticator will generate these OTPs on your Android device once it''s been
    configured for every user on your Ubuntu machine.


    To implement multi-factor authentication, you''ll need the Google Authenticator
    PAM (Pluggable Authentication Module). A PAM is a mechanism used to plug different
    forms of authentication into a Linux computer.


    The Google Authenticator PAM module is available in the official Ubuntu software
    repositories. To install the package on Ubuntu, head to the terminal and type:


    ```

    $ sudo apt-get install libpam-google-authenticator

    ```


    Once the package has been installed make sure you''re logged in as the user you
    want to protect with the two-factor authentication. Now in the terminal window,
    type:


    ```

    $ google-authenticator

    ```


    This will initiate the process of creating a secret key for the user by asking
    you a bunch of questions. While it''s safe to answer yes to all of them, it''s
    a good idea to understand each one of them before making your final choice as
    these choices help balance security with ease-of-use. The first question is a
    pretty safe one and you should allow the command to update your Google Authenticator
    file by answering yes.


    You''ll then be asked if you''d like to restrict the use of a token which forces
    you to wait for 30 seconds between login. While it might seem inconvenient at
    first, you should agree to this limitation for maximum protection. The next question
    asks for permission to increase the time window that tokens can be use for from
    the default 1:30 minutes to 4:00 minutes. Although you can answer yes to this
    question to avoid any issues, type no for maximum security. If you notice any
    issues later on, rerun the command and increase the expiration time as suggested.
    The fourth and the last question asks you to limit the number of


    ![](img/420a7272a6efa239082a35eeadd9bc1d_117_0.png)


    > ) After the initial setup, the two factor authentication will work even if your
    system and Android device aren''t online.


    **Quick tip**


    To disable two-factor authentication, simply edit the /etc/pam.d/ common-auth
    file and comment the line that we''ve added in the tutorial.'
