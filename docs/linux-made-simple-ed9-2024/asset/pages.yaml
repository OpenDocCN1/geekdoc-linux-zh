  md: 'isohybrid distro.iso


    Now **fdisk** should show it as a hybrid and you can **dd** it to your USB stick.


    # # Go slow


    **Q** My computer seems to be running with one of its **CPU** cores tied behind
    its back. What is going on?


    **A** The most likely cause is that a particular process is hogging a lot of your
    resources, and the program to investigate this is called top. Run it in a terminal
    and it will show you a summary of overall system usage and a list of programs
    in order of their CPU usage. The third line will show you the overall CPU usages,
    which will be something like this (on a lightly loaded system):


    ```

    %top(cpu):  0.7 us,  0.2 sy,  0.0 ni, 99.1 id,  0.0 wa,  0.0 hi,  0.0 si,  0.0
    st

    ```


    The first three figures show how much of your CPU capacity is being used for user,
    system and nice tasks. A nice task is one running at a lower priority, so it uses
    the CPU only when nothing else wants it. The fourth figure is ‘idle’ – the amount
    of CPU time not being used. If this is close to zero, you now know why your computer
    is running slowly – look at the list of tasks to see which is eating the most
    CPU time. If you have a multi-core CPU, pressing **1** switches between showing
    an overall usage and separate figures for each core. That **wa** (waiting) figure
    is also significant: it shows how much time the CPU is waiting for I/O and can
    be high on disk intensive operations. If it is routinely high, you may have a
    disk problem – either read errors or a nearly full filesystem that has become
    heavily fragmented.


    Look at the memory figure. If memory is full and swap is in use, you will lose
    performance. The task list is ordered by CPU usage, but you can press **F** to
    pop up a list of fields. Move the cursor over the field you want to sort on and
    press **S** followed by **Q**. It sounds fiddly but the window opened by **F**
    allows for a lot more than changing sort orders. If memory is low, this will help
    you find the greedy programs.


    # # Lost password


    **Q** I reinstalled Linux recently and thought I kept the same password, but I
    cannot log in with it. Is there a way I can find or reset my password?


    **A** You can reset your password by booting from a live CD/DVD – either a specific
    rescue disc like System Rescue CD or your distro’s own disc. The first step is
    to identify the partition where your distro is installed (this is the root filesystem
    for your distro; your **home** directory is not needed).


    ![](img/420a7272a6efa239082a35eeadd9bc1d_132_0.png)


    › *Top* gives an overview of resources used by your system as well as a list of
    the programs using the most.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_132_1.png)


    If you have booted to a graphical desktop, you can browse the available drives,
    looking at those of a suitable size until you find the one that contains directories
    such as **bin**, **etc** and **lib**. Once you have the correct partition mounted,
    say in /mnt/myroot, you can use **chroot** to fix it:


    ```

    sudo chroot /mnt/myroot /bin/bash

    ```


    This changes the root directory to the path you give and runs the command following.
    So this switches you to the root of your installed system and runs the *Bash*
    shell as root. You are now inside your installation and can change your password
    with:


    ```

    passwd yourusername

    ```


    It will ask you for the new password twice and then write it to disk. Press [Ctrl+D]
    to exit the **chroot**, reboot from your hard disk and you should now be able
    to log in.


    # # Killing windows


    **Q** I run some bleeding edge versions of software and occasionally they crash,
    leaving the window still open. How do I close a window and program like this so
    that I can run it again?


    > “Most distros have a package that installs everything you need to build and
    install programs.”


    **A** For graphical programs, the simplest answer is **xkill**, which is usually
    installed by default. When you run **xkill**, your mouse pointer changes to a
    skull-and-crossbones, the next window you click on will be forcibly closed, along
    with its program, so be careful where you click.


    There are also command line alternatives: **kill** takes a process ID as an argument
    and kills it. **Killall** does the same but works with program names, so be careful
    if you may have more than one copy of the program running. Both send a TERM signal
    by default, which asks the program to shut down cleanly. If this fails, add **-KILL**
    to the arguments to send the more forceful KILL signal:


    ```

    killall -KILL someprogram

    ```


    If you want to use **kill**, there are various ways to find the PID. If the process
    is using a lot of CPU or memory it will show up in top, and you can kill it from
    there by pressing **K**. Otherwise, you can **ps**:


    ```

    ps -ef | grep #1 programname

    ```


    The **-fl** options mean you see the full command line, so you can be sure you
    are killing the right process.


    › **Xkill** will kill the first window you click on, and the process behind it,
    so be careful.


    # # Advanced | Troubleshooting'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# # Getting connected


    Now let’s tackle some connectivity and Internet hurdles.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_133_0.png)


    # ## Going slower


    **My Internet connection seems really slow — downloading files takes forever.
    Do I need to fix this in Linux or change my router’s settings?** Stay away from
    your router settings until you have tried everything else — you could end up breaking
    a fully working setup. The first step is to check that it really is slow, by using
    a service like [http://speedtest.net](http://speedtest.net). Next, check that
    nothing is sucking up your bandwidth in the background. A good program for this
    is `nethogs`, which you may have to install from your package manager:


    ```

    sudo nethogs eth0


    ```


    This gives a top-like display of what’s using your bandwidth. If you’re connecting
    to your router by wireless, try a wired connection to rule out Wi-Fi issues. If
    that makes a difference, try testing in different locations.


    There’s also the possibility of congestion with other wireless routers from your
    neighbours, which can be avoided by switching your router to a different wireless
    channel. You can see the wireless channels in use with this command


    ```

    sudo iwlist wlan0 scan \| grep ‘e Address: e Channel: e ESSID:’


    ```


    `iwlist` produces a lot of output about each access point it discovers, hence
    the need to filter it with `grep`. You can also use something like *Wi-Fi Analyzer*
    on Android, which gives a graphical display of the channel and strength of all
    access points in range, enabling you to map any points where the signal from your
    router is weak as well as identifying competition for bandwidth.


    There’s also the highly scientific test of picking up the phone: if the line is
    noisy, you will suffer reduced speeds and you’ll need to report the problem to
    your line provider. If all the above checks show nothing, check with your ISP
    before tampering with previously working router settings.


    # ## Streaming video


    **When I try to watch videos on Amazon Prime or Netflix (I have accounts with
    both) I get a message saying my computer is unsupported. Can I fool them into
    thinking I am running Windows? Will that let me watch the services I have paid
    for?** These services use *Silverlight*, a proprietary technology from Microsoft,
    to render the video and apply DRM. There’s no *Silverlight* for Linux but there
    is a solution called *Pipelight*, which is a browser plugin that in turn uses
    Wine to run *Silverlight*. It requires a patched Wine but all the packages you
    need are available for most distros. Users of Ubuntu-based distros can add a PPA
    and install everything with:


    ```

    sudo add-apt-repository ppa:pipelight/stable

    sudo apt-get update

    sudo apt-get install pipelight-multi


    ```


    This adds the *Pipelight* PPA and then installs the software. Instructions for
    other distributions are at [http://bit.ly/PipelightInstall](http://bit.ly/PipelightInstall).
    Set it up with:


    ```

    sudo pipelight-plugin --create-mozilla-plugins

    pipelight-plugin --enable silverlight


    ```


    This will download the required *Silverlight* software and set up plugins for
    your browser. Installing *Pipelight* isn’t enough to watch your videos; you will
    still be denied access because your browser tells the website you no running Linux.
    Install one of the *User-Agent* control extensions for your browser: such as *user-agent-overrider*
    or *ucontrol* on Firefox or *user-agent-switcher-for-chrome* if you use Chrome.
    Then use it to set your User Agent to “Firefox for Windows” and enjoy your streaming
    video.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_133_1.png)


    > **Wi-Fi Analyzer on Android shows access points in range and which channels
    they use, so you can set yours to avoid competition.**


    # # The last but one resort


    When your computer seems totally locked up and no amount of key bashing has any
    effect whatsoever, the last resort is to cut the power. With all the risks of
    data corruption this entails, but there’s one more thing you can try: the Magic
    *SysRq* keys. These are special key combinations that can be used to shut down
    a locked-up system reasonably gracefully. Their name comes from the fact that
    they use the *SysRq* key, sometimes marked *PrintScr*, and they are truly magic.


    Even if your keyboard does nothing else, these work because the kernel sees these
    key presses directly with no user-space software getting in the way.


    While holding down *Alt* and *SysRq*, press each of these keys in turn:

    * **R** – resets keyboard.

    * **E** – exits all remaining running programs with a *KILL* signal.

    * **I** – interrupts all running programs with a *TERM* signal.

    * **S** – syncs all filesystems.

    * **U** – unmounts all filesystems and remounts them read-only.

    * **B** – reboots.


    There are various mnemonics to help remember this key sequence, some of them harder
    to remember than the *SysRq* sequence itself — there’s one to do with elephants.
    The one I find easiest to remember is that it’s **BUSIER** backwards, but the
    one I like most is “Reboot Even If System Utterly Broken”.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '![](img/420a7272a6efa239082a35eeadd9bc1d_134_0.png)


    ▶ **Get Netflix running by installing `Pipelight` and telling your browser to
    pretend that it is running on Windows.**


    # ### Mounting Android


    Q **I have bought myself a Nexus 7 Android tablet and I''m very pleased with it.
    But – there''s always a but, isn''t there? – I can''t mount it as a USB device.
    My Android phone pops up a dialog when I plug it into the USB port of my computer
    and lets me mount it as a storage device, but this tablet doesn''t seem to work
    like that. Why have they got rid of a perfectly reasonable system and how do I
    get my files on there now?**


    A **The trouble with the USB storage system is that a filesystem can be mounted
    by only one OS at a time. That means that before you can mount it on your computer
    as a mass storage device, it has to be unmounted on the phone/tablet. That''s
    why you get the warning message on your phone about apps that use the SD card
    having to be stopped. It''s even worse on something like the Nexus 7, where there''s
    no removable storage – you can''t unmount a filesystem currently in use by the
    OS. Never Android devices avoid this by using MTP (Media Transfer Protocol). There
    are a few options for mounting MTP devices under Linux, all implemented as FUSE
    filesystems. I prefer `jmfvfs`. To mount the first device found – you would normally
    only have one connected at a time – pass `mtpfs` the name of the mount point.
    This directory must exist and be writable by the user running the command:**


    ```

    jmfsvfs ~~/nexus

    ```


    **Then you can access the contents of the device while still using it. When you
    have finished, unmount the device with:**


    ```

    fusermount -u ~~/nexus

    ```


    # ### Remote desktops


    Q **I want to be able to access the desktop of one computer from another, like
    the remote desktop feature of Windows.**


    A **You have two options here. For a complete desktop you can use VNC. This is
    often installed by default; if not, install either the `TightVNC` or `VNC` package
    (the former should give better speed on slower networks). You run the server on
    the computer you want to view; the first time you will be asked to set up a password.
    Then run the client on the other computer, giving it the address of the first
    computer. However, if you only want to run a single program from the remote computer
    on your local desktop, VNC can be overkill


    and the X display of Linux already allows network forwarding. You need to set
    up SSH on the remote computer – just install the `ssh-server` package in the usual
    way. Then test that you can connect from the local computer with:


    ```

    ssh user@hostname

    ```


    **This will ask for your password and then give you a shell session on the remote
    computer – you can check you are on the remote computer by running `uname` -a.
    Press Ctrl-D to log out, then try running a graphical program like this:**


    ```

    ssh -Y user@hostname someprogram

    ```


    **It should open its window in front of you. Depending on how your distro set
    up its SSH server, you may find -X is better than -Y. If neither works, check
    `/etc/ssh/sshd_config` on the computer running the server and make sure it contains:**


    ```

    X11Forwarding yes

    ```


    **Incidentally, if you are using the same username on both computers, you can
    leave that out and just do**


    ```

    ssh -Y hostname programname

    ```


    # ### What''s my address?


    Q **I''m running a Raspberry Pi without keyboard or screen. I plugged it into
    my network but I don''t know what its IP address is, so can''t SSH into it.**


    A **If your device is getting its IP address from a DHCP server, you can often
    configure the server to give a specific address to a hostname. Plug the Pi''s
    SD card into your computer and edit `/etc/hostname` so to set your hostname, then
    set your DHCP server, usually in your router, to give that hostname a set address.
    Alternatively, install `netscoper` ([http://bit.ly/Netdiscvoer](http://bit.ly/Netdiscvoer))
    and run it like this:**


    ```

    sudo netscoper -i eth0 -r 192.168.1.0/24

    ```


    **where -i is your network interface and -r the IP range used by your network.
    This will list all the hosts on your network. Unfortunately the Pi will show up
    as Unknown vendor, so run it with and without the Pi to see the address that appears.
    If you have an Android device, install `Fing`, which does the same thing graphically
    and recognises the Pi. Once you have the address, you can SSH in and run `ifconfig`
    to get the MAC address, which you can use to tell your DHCP server which address
    to give it. Raspiian prints the IP address from `/etc/rc.local` when it boots.
    You could modify this to email you instead.**


    ![](img/420a7272a6efa239082a35eeadd9bc1d_134_1.png)


    ▶ **MTP is the new way of connecting to Android devices, and it means you can
    keep using the device while it is mounted on your desktop.**'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # Terminal: How to get started


    Flex those fingers and dive head first into the inky darkness of the terminal.
    Let us show you how to start handling its mysterious commands.


    # ## Quick tip


    +   If you''re struggling to type the right command, you can wipe all previous
    actions forward simply by typing **clear** and hitting **Enter**. Note this won''t
    affect your command history.


    The terminal is an incredibly important part of your Linux desktop. It doesn''t
    matter how wedded you are to point and click over the command line, at some point
    you''re going to have to dip your toe in the terminal''s dark expanse and wade
    in. Don''t worry, though, because the terminal isn''t as scary as it might appear;
    and if you take the time to learn the basics you''ll discover it can be a far
    quicker and more effective way of getting certain tasks done.


    As you''d expect, a terminal effectively gives you access to your Linux shell,
    which means it works in exactly the same way using the same language (**Bash**).
    This means you can do anything in the terminal you''d normally do at the command
    line, all without leaving the relative comfort of your desktop. That makes learning
    how to use the terminal – and **Bash** – doubly advantageous: as it gives you
    your first glimpse into working with the underlying Linux shell.


    We''re basing this tutorial on Ubuntu, so start by opening the Dash and typing
    ''terminal'' into the search box. You''ll find the terminal of course, but you''ll
    also see two entries called **UXTerm** and **XTerm**. This highlights the fact
    there are multiple terminal emulators that you can run in order to interface with
    the shell. There are differences between them, of course, but fundamentally they
    do the same thing.


    For the purposes of this tutorial we''re sticking with the default terminal, which
    is basically the **gnome-terminal** emulator – technically it''s emulating a Teletype
    (TTY) session. It has all the functionality you''ll need, but both **UXTerm**
    and **UXTerm** are worth noting because although they are more minimalist tools
    and neither require any dependencies to run. This means if anything stops the
    main terminal from running, you can use either as a backup. As an aside, the only
    difference between the two is that **UXTerm** supports the expanded Unicode character
    set.


    # ## How Bash works


    The Linux shell uses the **Bash** shell and command language to perform tasks,
    and it uses a relatively straightforward syntax for each command: *utility* *command*
    *option*.


    First, the *utility* portion of the command is the tool you wish to run, such
    as *ls* for listing the contents of a directory, or **apt-get** to trigger the
    APT package management tool. Second, the *command* section is where you specify
    exactly what you want the utility to do, for example, typing **apt-get install**
    instructs the package management utility to install the named package, eg **apt-get
    install vim**.


    And finally, the *option* section of the command is where one or more ''flags''
    can be set to specify certain preferences. Each flag is preceded by one or two
    dashes (- or --) and the most useful of all is the **-help** option, which provides
    a brief


    ![](img/420a7272a6efa239082a35eeadd9bc1d_135_0.png)


    The --help flag can be used with any command to find out what it does, plus what
    arguments to use.


    # ## Speed up text entry


    It doesn''t matter how fleet of hand your typing skills are, the command line
    can still be a time-consuming, frustrating experience. Thankfully the terminal
    comes equipped with lots of handy time-saving shortcuts. This issue let''s take
    a look at how you can easily access previously used commands and view suggestions.


    +   >>/Down arrows Browse your command history.  >> **history** Use this to view
    your command history  **Ctrl+R** Search command history. Type letters to narrow
    down search, with the most recent match displayed, and keep pressing Ctrl+R to
    view other matches.  >>**Tab** View suggestions or auto-complete a word or path
    if only one suggestion exists. Press **Tab Tab** to autotiff your username. **@
    Tab** to autotiff your host name and **$ Tab** to autotiff a variable.'
  merge: -1
