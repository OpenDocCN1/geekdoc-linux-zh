- pgno: 122
  md: '# # Connecting to the server


    As an accidental admin, your first challenge is going to be connecting to your
    server in the first place. In your web control panel, you might see an option
    to open a Terminal or console in your web browser, but this tends to be quite
    a laggy way of doing things.


    It''s better to open up a Terminal window on your own machine (if you''re running
    Ubuntu just press Alt+Ctrl+T, if you''re on Windows you''ll need an application
    like PUTTY). Now, at your command prompt, type `ssh username@yourserv er.com`
    (or you can replace `yourserv er.com` with an IP address).


    The `ssh` command will open a secure shell on the target machine with the specified
    username. You should get a password prompt before the connection is allowed and
    you will end up in a text interface that starts in the **home** folder of the
    username.


    If you''re going to be connecting regularly, there is an even more secure way
    of using `ssh` and that''s to bypass the password prompt all together and use
    encrypted keys for access instead. To follow this approach, you''ll need to create
    a public/private SSH keypair on your machine (for example, Ubuntu users can type
    something like `ssh-keygen -t rsa -b 4096 -C "your.email@example.com"` and copy
    the public part of the key into the `.ssh` folder on the target server.


    You will find some full instructions for doing this here: `http://help.github.com/articles/generating-an-ssh-key`.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_122_0.png)


    Even if someone copies your key, they''ll still need a password to unlock it.


    `nano /etc/fstab` (we really don''t recommend this unless you know what you''re
    doing). After entering `sudo`, you''ll be asked for your user password. On a desktop
    PC, this is the same one that you use to log in. If you''re logging into your
    own webserver, however, there is a good chance that you''ll already be the root
    user and won''t need a `password` to make important changes.


    If you can''t execute `sudo` commands, your web host has restricted your level
    of access and it probably can''t be changed. User accounts can be part of the
    **sudoers** group and only members of the **sudoers** group can use the `sudo`
    command to temporarily grant themselves admin privileges.


    # ## 2 `su`


    While `sudo` gives you great power, it still has limitations. Most of all, if
    you''ve got a whole bunch of commands to enter, you don''t want to have to type
    it out at the start of every single line (at least the password has a 5 minute
    timeout—Ed). This is where `su` comes in, which will give you superuser powers
    until you close the terminal window. Type `sudo su` followed by your password,
    and you''ll see the prompt change from `yourname@yourserver` to `root@yourserver`.
    You might think `su` stands for superuser, but it''s actually a command to help
    to **change** user on the system and it''s used without an account name after
    it; `su` assumes you want to be root. However, using `su myname` will switch you
    back to your original, non-super, login.


    # ## 3 `ifconfig`


    Since you''re troubleshooting a web server, it''s probably a good idea to get
    as many details about its actual connection as possible noted down. The `ifconfig`
    command can be run without `sudo` privileges and tells you details about every
    live network connection, physical or virtual. Often this is just for checking
    your IP address, which it reports under the name of the adaptor, but it''s also
    useful to see if you''re connected to a VPN or not. If a connection is described
    as `eth0`, for example, it''s an Ethernet cable meanwhile `tun0` is a VPN tunnel.


    # ## 4 `chown`


    There''s tons more you can learn about `chmod` and we strongly recommend that
    you do, but it has a sister command that''s even more powerful. While `chmod`
    dictates what users who aren''t the owner of a file can do, the `chown` command
    changes the file owner and group that it belongs to completely. Again, you''ll
    probably need to put `sudo` in front of anything you `chown`, but the syntax is
    again simple. An example might be `chown myname:mygroup filename.txt`.


    # ## 5 `service restart`


    No, we''re not telling you to ''try turning it off and on again'', but sometimes
    it''s a good place to start (and sometimes it''s essential to load changes into
    memory). It''s possible you might be used to start and stop background processes
    on a Windows desktop through the graphical System Monitor or Task Manager in Windows.
    However, in the command line Terminal it''s a little more tricky, but not by much.


    Confusingly, because many Linux distributions have changed the way they manage
    startup services (by switching to `systemd`) there are two ways of doing this.
    The old way, which still works a lot of the time, is to just type `service myservice
    restart`, preceded by `sudo` when it''s necessary. The new, correct, way is a
    little bit more verbose: `systemctl`.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_122_1.png)


    Unless you can read 1,000 lines a second, you''ll need to use `ls -less` to explore
    folders.


    # ## Quick tip


    If you''re changing **names**, **permissions** or ownership most commands have
    a `-R` or `-r` option, which stands for "recursive". Essentially, this changes
    the attributes of all files inside a folder, rather than just the folder itself.'
