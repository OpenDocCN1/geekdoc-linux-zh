  md: '# Genus Fedora


    You''ve been hit by a smooth distro...


    ![](img/420a7272a6efa239082a35eeadd9bc1d_27_0.png)


    Fedora has been around, in one form or another, since the early 1990s. The distro
    had its first release in 1995 and the early releases were named Red Hat Commercial
    Linux. During these early years, the distro was developed exclusively by Red Hat
    and the community was limited to contributing bug reports and contributing packages
    included in the distro. This changed in 2003 when the company shuttered Red Hat
    Linux in support of the Fedora Project and opened it up to contributions from
    the community.


    +   Fedora was one of the first distros to embrace the Security Enhanced Linux
    (SELinux) kernel module.


    The aim of Fedora is to provide the latest packages while maintaining a completely
    free software system. The distro was initially called Fedora Core and was named
    after one of the two main software repositories – Core and Extras. The Fedora
    Core repo contained all the basic packages required by the distro as well as other
    packages distributed with the installation disc, and was maintained exclusively
    by Red Hat developers. The Fedora Extras repo was introduced with Fedora Core
    3. It contained packages maintained by the community and was not distributed with
    the installation discs. This arrangement continued until version 7 in 2007 when
    the two repos were merged and the distro was renamed as Fedora.


    Fedora''s objective is to create a free software distribution with the help of
    the community. The development of the project is overseen and coordinated by the
    Fedora Project.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_27_1.png)


    It''s made up of four Red Hat appointed members and five community elected members.
    The chairman of the board is appointed by Red Hat. Fedora strives to maintain
    a roughly six-month release cycle, with two releases each year. Every release
    is supported until the launch of the next two releases. The cycles are deliberately
    kept short so that developers can focus on innovation and introducing the latest
    technologies into the distro.


    # Feather in the cap


    One way the community contributes is by hosting third-party repositories. In addition
    to its official software repos, there are several popular third-party software
    repos that usually contain software not included in the official repos – either
    because of the current laws of the country (such as multimedia codecs) or because
    the software doesn''t meet Fedora''s definition of free software. The Fedora project
    also produces the Extra Packages for Enterprise Linux (EPEL) repo, which contains
    packages for RHEL that are created by the community instead of Red Hat.


    Apart from the main Fedora release, the project also ships various spins which
    are special-purpose distros aimed at specific interests, such as gaming, security,
    design, scientific computing etc. These are similar to Debian''s Pure Blends.
    These and others are maintained by various Special Interest Groups (SIGs). The
    OLPC also runs a Fedora-based operating system. Fedora supports the x86 and ARM
    architectures and has also added support for PowerPC and IBM s390, starting with
    Fedora 20. Pidora is a Fedora Remix distro optimised for the Raspberry Pi.


    Fedora''s biggest contribution to the Linux ecosystem is its old command line
    package manager, YUM (Yellowdog Updater, Modified), which is based on RPM (Red
    Hat Package Manager). YUM enables automatic updates and dependency resolution,
    and works with the software repositories to manage the installation, upgrading
    and removal of packages. Since the release of Fedora 18 however, users have had
    the option to use the dnf tool which is a fork of YUM. The dnf tool has become
    the default package manager since Fedora 22, because it has better dependency
    resolution and is less memory intensive than other managers.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_27_2.png)


    # BEST OF BREED


    # Korora


    The Korora distribution started out as a way to ease the installation process
    of the Gentoo distro, but switched to using the Fedora distro as the base in 2010.
    The main aim of the distro is to make sure it works right out-of-the box for users.


    Korora ships a live DVD, which includes a huge selection of apps that make it
    suitable for a large number of


    users and the distro offers five desktop choices – GNOME, KDE, Cinnamon, Xfce
    and Mate.


    While Fedora only ships with open source software, Korora also includes some proprietary
    software, such as Adobe Flash, which are essential for catering to a wide user
    base. Korora also allow other software to be easily installed, such as Google
    Chrome and


    the proprietary graphics driver for Nvidia cards.


    The distro has also eased a gripe for some Fedora users: graphical package management.
    Korora includes both Apper and Yum Extender, which are two of the most popular
    front-ends for YUM. Since it''s based on Fedora, a new version of Korora is usually
    a few weeks behind a Fedora release.'
