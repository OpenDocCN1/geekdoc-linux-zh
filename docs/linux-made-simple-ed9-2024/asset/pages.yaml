- pgno: 114
  md: '# The Boot process


    When you press your system''s power button, control is initially given to your
    PC''s EFI or BIOS, which starts its various components, performs basic diagnostics
    tests and attempts to find a bootable device, which is typically the first hard
    drive. Once located, the BIOS or EFI looks for the Master Boot Record (MBR) at
    the very beginning of the drive, which has a tiny program inside that loads the
    next stage of the boot loader, reading a file (eg ed2s_stage_1.5), which in turn
    is able to load the Grub boot loader. A missing operating system'' error at this
    point means you need your rescue disc for diagnostics as something is missing
    - either in Grub, the MBR or the drive itself. Once Grub loads successfully it
    reads a file called menu.lst, which contains the list of choices you see in the
    boot menu. Each entry basically identifies the drive, partition and file that
    contains the Linux kernel, plus RAM disk file used by the kernel as its boot.
    The entry will also contain any additional parameters passed to the kernel.


    Control is now passed to the kernel, which attempts to mount the root file system.
    This is a key moment, and if it fails you may get a kernel panic, or things might
    grind to a halt. If successful, it''ll create a single process to run the/sbin/upstart
    file (other distros use init) - if this goes wrong, you''ll get a panic. It may
    halt again or drop you into a root shell. At this point, upstart starts running
    scripts and upstart events to start other services and eventually bring you to
    the login screen.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_114_0.png)


    > The Grub menu''s appearance is a critical point in the boot process - if your
    system gets this far your recovery options are greater.


    message or frozen splash screen, or you may just see Grub and nothing else, indicating
    it can''t even find the most basic information required to proceed.


    If you press Fc you may be able to enter the Grub Terminal mode to perform basic
    checks and repairs - you can attempt to manually imitate the boot by pressing
    Ctrl+X or Fl0, eg, or use the ''set'' command to review current settings and change
    basic settings such as the graphics mode. Visit http://bit. ly/Grub2Troubleshooting
    for a detailed guide using Grub''s own troubleshooting tools, but remember that
    in most cases the simplest fix is to use the Boot-Repair tool. If the Grub menu
    appears, then the issue may lie with its configuration file if things immediately
    grind to a halt after you select a menu option, but if Linux does start loading
    before grinding to a halt, the problem will lie with your operating system, in
    which case skip to the Post-Grub troubleshooting section (see page 116).


    # Boot-Repair tool


    If you''re struggling to fix Grub issues by hand, or there''s no sign of Grub
    on your system at all, then you''ll need to enlist the services of your rescue
    media and the Boot-Repair tool, which works with all Debian-based distros, including
    Ubuntu. The Boot-Repair tool fix will launch automatically when you boot from
    a Boot-Repair tool disc, but if you''re unable to create it, but have access to
    a Linux installation disc, use that in a live environment instead, then grab the
    Boot Repair tool using the following commands:


    ```

    ```

    $ sudo add-apt-repository ppa:yannubuntu/boot-repair

    $ sudo apt-get update

    $ sudo apt-get install boot-repair

    ```

    $ boot-repair

    ```


    The Boot-Repair tool is focussed on those early boot problems caused by the hard
    drive''s boot sector, MBR and Grub. It basically provides a convenient and user-friendly
    graphical front-end to the tools required to fix many problems. The tool offers
    a ''Recommended repair'' option that promises to fix most frequent problems, or
    you can click ''Advanced options'' to see what it can do and manually select specific
    fixes without getting your hands dirty in the Terminal. The step-by-step guide
    (see Tweak Boot-Repair Tool Settings, page 117) reveals what repairs and tweaks
    are possible, but note the tool is context-sensitive, and some options may be
    greyed out or missing depending on your setup. The tool automatically generates
    a log of your system and which it attempts to do, which you can then share on
    the Ubuntu user forums if necessary. Before attempting any advanced tweaks on
    your own, it pays to try the recommended option first, then ask for help on the
    forums using the output logs generated - this will ensure you choose the right
    option and don''t cause more damage.


    # Non-Grub boot issues


    Your rescue disc will also come in handy should you not even get as far as Grub
    loading. Once booted, verify the existence and state of your hard drive. Open
    the file manager and see if your partitions are visible and if you can access
    the files on them - this is a good time to back up any precious files before you
    proceed further. If nothing shows up, check whether the hard drive has been detected
    by opening the Disks utility from your Ubuntu Live CD - if you''re using a Boot-Repair
    tool CD, you''ll need to install the gnome-disk-utility through the Synaptic Package
    Manager under System Tools. Once installed, open it via the Accessibility menu.
    The Disks tool lists all physically attached drives - if yours isn''t visible,
    you may find the drive has failed, in which case you''ll be reaching for your
    latest backup after shelling out for a


    ![](img/420a7272a6efa239082a35eeadd9bc1d_114_1.png)


    > Give your hard drive the once-over when booting from your rescue disc to check
    it''s working as it should.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_114_2.png)'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'drive replacement, or starting again from scratch with a fresh Ubuntu installation
    and new-found love of backing up your system. Assuming your drive does show up,
    select it from the left-hand menu where you can examine the partition table plus
    check its physical health via its SMART [Not all that smart – Ed] attributes.
    Don’t panic unless the drive is deemed on its last legs, but do focus your next
    check on the partitions themselves. If you run the Boot-Repair tool, its recommended
    settings will include a full disk check, for which you can manually perform this
    check yourself using GParted, which is on both rescue discs.


    GParted enables you to see how your partitions are arranged, as well as revealing
    which one is the boot. Right-click this and verify Mount is greyed out before
    choosing ‘Check’ to schedule a disk check using the fsck tool. This will check
    for and attempt to repair any problems it finds as soon as you click ‘Apply’,
    but it’s important the partition isn’t mounted before the check is run. Also give
    it as long as it needs to complete – this could take hours or even days in some
    extreme cases, and canceling or aborting will almost certainly corrupt the partition.
    Make sure the check is run on all partitions on the boot drive.


    In most cases, assuming the drive isn’t physically damaged or corrupt beyond repair,
    running these tests should ensure you’re able to at least get GRub working again.


    # Post-Grub troubleshooting


    If you find that GRub appears to be working fine, but your problems begin when
    you attempt to load Linux itself. Try switching to verbose mode during boot by
    pressing the Esc key to see if any clues appear in the messages that scroll past
    (or if it hangs at a certain point). Make a note of these and do a search online
    for them to more advice. If this doesn’t happen, hold Shift at boot to bring up
    the GRub menu if necessary, then select ‘Advanced options’ followed by ‘(recovery
    mode)’, which will launch Ubuntu in a minimal state, plus mount the file system
    in read-only mode. If this is successful, after a succession of scrolling messages
    you should find yourself presented with the Recovery Menu, offering nine options.


    The options are all pretty much self-explanatory – the clean option may be of
    use if your hard drive is full, which can cause boot problems. If your problems
    started because a package failed to install properly, then dkg will repair it
    and hopefully get things working again.


    > System logs are a valuable source of troubleshooting information – and you can
    access these from the /var/log directory using your rescue disc’s text manager
    or nanno in a shell. Look out in particular for syslog, and investigate the dmesg
    shell command too.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_115_0.png)


    # Ubuntu’s recovery mode lets you try various fixes when Grub works, but Ubuntu
    no longer wants to.


    The failsafeX option is a useful if you find yourself booting to a black screen
    or the graphical desktop doesn’t appear to be working correctly – it basically
    bypasses problems with your graphics drivers or X server to give you a failsafe
    graphics mode to troublesshoot your problem from. We’ve touched on fsck already
    – this will check the drive for corrupt files, which can clear many errors, particularly
    if your PC crashed and has failed to boot since. The grub option isn’t relevant
    unless you’ve used GRub’s own recovery tools in place of the Boot-Repair tool
    to get this far in the boot process – selecting this will make your changes permanent.
    Use the ‘reboot option to re-enable networking, and the root option to drop to
    the shell prompt, allowing you to troublesshoot directly from there. If doing
    so, be sure to mount the file system in read/write mode using the following command:
    mount -o remount,rw/ You can also pass temporary kernel parameters to Ubuntu during
    the boot process, which may help in some scenarios. With your chosen operating
    system selected in GRub, press the e key to edit the kernel file. Scroll down
    to the line beginning linux – parameters are added to the end of this line after
    quiet splash. You’ll need to make sure that you leave a space between each parameter.
    Once done, press Ctrl-x to boot with those parameters. Note that any parameters
    you add here are temporary – in other words, they’re removed the next time you
    boot, so you can experiment until you find a solution that works, then – if necessary
    – make it permanent by editing the GRub configuration file (sudo nano /etc/default/grub).
    You can also pass parameters from the live CD environment using the Boot-Repair
    tool using the ‘Add a kernel option’, which includes 15 common parameters that


    # Take a fail-safe backup


    It may seem strange, but if you’re struggling with start-up issues, you should
    attempt to take a backup of your hard drive before you perform any repairs – this
    means if you mess things up completely you can always roll back your system to
    the state it was in when the start-up problem first manifested itself. Of course,
    if you’re diligent and you back up your system regularly, you could always simply
    roll things back now to a working state, although bear in mind there may be data
    loss involved if your home folder is on the same partition as your Linux installation
    (as is the case with default Ubuntu installs).


    You’ll need a suitable backup device – typically a USB-connected hard drive –
    and a tool that takes a complete image drive of your system. The dd command-line
    tool can be used from both Ubuntu and Boot Repair Tool live CD environments, but
    the backup drive needs to be at least the same size – and preferably bigger than
    the drive you’re copying. At the other end of the complexity scale is Redo Backup
    & Recovery: You’ll need a blank CD or DVD to burn its 261MB ISO file to, but it
    provides an easy to follow graphical UI. You’ll find it at www.redobackup.org
    – check out the feature on page 14 for a guide to using it.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_115_1.png)'
