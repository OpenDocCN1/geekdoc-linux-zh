  md: '# Hardware:

    Graphics card drivers


    Let''s take a long, hard look at the advantages and disadvantages of switching
    graphics card drivers.


    # Quick tip


    To find out more about your graphics chipset – including its capabilities – install
    mesu tools from the Software Centre. Once done, open a terminal window and type
    the following: gpuinfo | grep render.


    One of the most confusing aspects of switching from Windows to Linux is understanding
    how drivers – and in particular graphics card drivers – work. When you install
    Ubuntu on your PC, you''ll notice it appears to install the drivers you need for
    graphics to work perfectly, and indeed this is the case in the vast majority of
    cases. These drivers are open source, designed to provide the key functionality
    for any graphics card to work with Ubuntu.


    Because they''re designed to just work, many of these drivers aren''t interested
    in providing you with cutting edge performance. For day to day use – browsing
    the internet, word processing and even editing images – they''re perfectly adequate,
    but if you have a modern graphics card, and want to take full advantage of its
    capabilities – particularly for gaming – you''ll need to investigate the possibility
    of replacing them with dedicated drivers provided by the manufacturers.


    This second set of drivers – with the exception of drivers for Intel graphics
    – are closed source, which means that while they''re still free to install, you''re
    relying on the manufacturer for support. The open-source drivers that ship with
    Ubuntu are updated through Ubuntu''s own update tool, so they''ll update organically
    with the rest of your system.


    Closed source – or proprietary – drivers rely on the manufacturer for updates
    to be delivered. The manufacturer may provide this functionality within the drivers
    themselves, or you may have to manually check the website to see if new drivers
    have been released.


    # What''s available


    The major three graphics card manufacturers – Intel, NVIDIA and AMD/ATI – all
    provide their own Ubuntu drivers. If you plan to upgrade to the closed-source
    graphics drive, the first thing to do is identify your exact make and model of
    graphics card – particularly if you have no idea who the manufacturer is. If you
    head over to System Settings and select Details, you''ll see a graphics section,
    but it won''t tell you much. Instead, open a Terminal window and type:


    `lspci | grep vga`


    ```

    lspci | grep vga

    ```


    This will quickly list both manufacturer and model, which you''ll need in order
    to determine if a proprietary driver is available for your card.


    # NVIDIA and AMD


    If you have an NVIDIA or AMD graphics card, then the quickest way to see if a
    proprietary driver is available is by opening System Settings, selecting ''Software
    & Updates'' and switching to the ''Additional Drivers'' tab. If your card is compatible,
    you should see – after a short delay – a list of alternative drivers appear. Choose
    the latest version marked ''proprietary, tested'' from the list and click ''Apply
    Changes''. When the process completes, reboot your PC.


    Don''t be surprised if your card isn''t detected – if the card is more than five
    or six years old, then it''s unlikely to be supported. AMD''s support goes back
    to 2010 and the HD 5000 series, while NVIDIA cards date back to around the same
    time with GeForce 400 series. At first glance, you''ll see that NVIDIA does still
    provide links to legacy drivers for older cards – see www.nvidia.com/object/unix.html
    – but these won''t work with Ubuntu 16.10.


    If your card is an older model, therefore, you''ll stick with the open-source
    drivers – Nouveau for NVIDIA cards, and Radeon for AMD cards. Don''t be too downhearted,
    both


    ![](img/420a7272a6efa239082a35eeadd9bc1d_79_0.png)


    Intel''s graphics drivers are open source, unlike those provided by NVIDIA and
    AMD, so need to be installed manually.'
