- pgno: 15
  md: '# # Install Linux Mint


    Preparations are complete, it’s time to get Mint installed!


    With your fail-safe backup in place, you’re now ready to take the plunge and install
    Linux Mint. **The following procedure assumes you want to install it alongside
    your existing Windows installation – it’s a good route to follow for first-time
    switchers, as well as for those helping others to make the migration to Linux.**


    You’ll find the latest version at linuxmint.com. Like all versions of Mint, it’s
    a Long Term Support (LTS) release, with support guaranteed until April 2019. If
    you’d rather try Ubuntu, go to www.ubuntu.com and select ‘Download: Click “Ubuntu
    Desktop” and download the correct version for your processor (64-bit in most cases)
    of either Ubuntu 14.04.3 LTS or for the latest release, 15.10. Creating your Mint
    or Ubuntu install disc or flash drive is the same process for *Redo Backup* (on
    the previous page) and the installation process is identical for both Mint and
    Ubuntu.


    When your PC boots, it makes use of a tiny piece of software to get itself up
    and running. In the past, this was known as the BIOS (Basic Input Output System),
    but it’s been superseded by the more powerful and flexible UEFI (Unified Extensible
    Firmware Interface). In practical terms, UEFI offers a more user-friendly interface
    and better features, but it’s not compatible with older hardware. UEFI systems
    ship with a special Compatibility Support Module (CSM), which allows you to emulate
    the BIOS when attempting to use older hardware and operating systems. They also
    ship with Secure Boot enabled, a special feature designed to protect PCs from
    low-level malware.


    Your PC will almost certainly have Secure Mode enabled, which isn’t a problem
    for Mint, which fully supports it. However, another new feature – FastBoot (also
    called QuickBoot or FastStartup) – will almost certainly be enabled too, and this
    needs to be disabled before you can install Linux. (See the *Fix UEFI Boot Issues*
    box, below, for how to do this.)


    Once you’ve edited your UEFI’s settings, make sure your installation media is
    plugged in, then reboot your PC. Look for an option to access the boot menu when
    you start – typically a key like F11. This will bring up a list of available drives;
    select your DVD or USB flash drive and hit Enter. Don’t panic if you see two entries
    – this happens when CSM has been enabled, one with the non-UEFI option allowing
    you to boot using the older BIOS compatibility mode. However, Windows 10 will
    almost certainly have been installed using UEFI mode, so select that option to
    continue.


    # Partition your drive


    When you arrive at the Mint desktop, double-click the ‘Install Linux Mint’ icon.
    Verify English is selected, click ‘Continue’ and then verify both boxes are checked
    before clicking ‘Continue’ again. Wait while the installer scans your hard drives.
    In a perfect world it should spot your Windows 10 install, but this isn’t always
    the case. If it claims there is no Windows installation, the simplest thing to
    do is follow the step-by-step guide (see the *Manually Configure your Drive for
    Dual-Booting* box, bottom, p17) to set up your hard drive manually.


    If the installer does detect Windows 10, leave ‘Install Mint alongside Windows
    10’ selected and click ‘Next’. Your next step will be to have off enough drive
    space to give Mint the room it needs. The installer will make a calculated guess,
    but you can click and drag the divider between the two to set this figure yourself.
    Note that if you have more than one hard drive, Mint may actually choose a different
    drive to install itself on, so verify that one it’s picked and click the drop-down
    arrow next to ‘Select drive’; to see if you can change this if necessary. If you
    can’t, and you don’t want to install it on the recommended drive, click ‘Back’
    and follow the step-by-step guide to do things manually.


    > “The procedure assumes you want to install Mint alongside your existing Windows
    install”


    +   - **Full install**

    +   Mint and Ubuntu will offer to live beside Windows in total harmony, but they
    can also wipe out Windows for the full Linux experience.


    # ## Fix UEFI boot issues


    Switch on your PC and tap the key prompted to enter setup – usually Del (or F2).
    Look for the FastBoot setting under Boot or Windows Configuration, then make sure
    it’s set to disabled. If you have problems getting Redo Backup to launch, you
    should also temporarily disable Secure Boot and potentially tweak the CSM settings
    in order for Redo Backup to work correctly – look under Boot, Security or Windows
    Configuration for these settings. When it comes to CSM, its settings may be hidden
    away in their own menu, where you’ll find references to the likes of PXE (pre-boot
    environment), GOP (graphics) and Storage (or SATA), as well as USB and PS/2 if
    applicable. This allows you to selectively switch CSM on and off for specific
    devices as required. If there’s an option to run both – as is the case with some
    ASRock motherboards, select the appropriate option (such as ‘Do not launch’) to
    ensure maximum compatibility and performance. Not all PCs, particularly off-the-shelf
    models, will give you access to all of these settings – contact the manufacturer
    to query where these are, or ask about an update that brings them back. Also search
    for your PC’s model and manufacturer and the words ‘CSM’, ‘UEFI’, ‘Linux’ or ‘Mint’
    to see if there’s a precedence set by other switchers you can follow to get the
    settings you need enabled.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_15_0.png)


    > Tweak your PC’s CSM settings if necessary to get Redo Backup and Recovery working
    properly if it’s a newer model.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Assuming Mint chooses the same drive as Windows 10 to install itself on, leave
    at least 10GB free space for Windows, and give Mint a minimum of 8GB drive space
    to work with – more if you plan to make it your primary OS. Remember that you
    can always repartition the drive later or remove the Windows partition.


    Once you’ve set up the drive, click ‘Install Now.’ Make a note of the warning
    and click ‘Continue.’ You’ll be asked to confirm the proposed changes – by default
    the Mint installer creates just two partitions (the Ext4 entry is your Linux partition,
    plus it creates a dedicated swap partition). Click ‘Continue’ to accept the change.


    Next, the installer will attempt to detect your location, settling on London in
    most cases. You can accept this or type the name of your nearest large town to
    see if it’s recognised. Click ‘Continue’, then set your keyboard layout.


    The next stage is where you first type your name – you’ll see the computer name
    is pre-filled for you along with your username as you type. You can change these
    and enter a password – you’ll need to provide this when you log in, plus an administrator’s
    password for performing certain tasks.


    Only opt to log in automatically if your PC isn’t shared, and if you’re installing
    Ubuntu on a laptop tick ‘Encrypt my home folder’ to protect your data should you
    lose it. Click ‘Continue’ and you’re done – Mint will install itself in the background.
    You can go off and make a standard cup of tea (or two) while you wait or sit and
    read some highlights about what features and applications are included in Ubuntu,
    and how to find more using the Software Center. When installation finishes, click
    ‘Restart Now’, remove the installation disc or drive when prompted, and hit Enter.
    Ubuntu is now installed; turn the page to find out how to start using it.


    # Manually configure your drive for dual-booting


    ![](img/420a7272a6efa239082a35eeadd9bc1d_16_0.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_16_1.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_16_2.png)


    **Launch GParted**


    Boot your Mint install media. When the desktop appears, click the ‘Menu’ button
    in the bottom left-hand corner and in the Search box type ‘GParted’. Click the
    GParted entry when it appears to launch it. Verify your Windows drive is selected
    ( /dev/sda) – you should see at least two partitions, the largest of which is
    your Windows partition. Right-click this and choose Resize/Move.


    **Free up space for Linux**


    Click on the right-hand slider and drag it left to free up enough space for your
    Ubuntu install – leave at least 10GB free space for Windows. Once done, click
    ‘Resize/Move’ followed by the ‘Apply all operations’ button, selecting ‘Apply’
    when prompted. Wait for the partitioning to complete, then click ‘Close’. Double-click
    the ‘Install Linux Mint’ shortcut. Select ‘English’ and click ‘Continue’.


    **Start partitioning**


    Leave both boxes ticked and click ‘Continue’. Select ‘Something else’ under ‘Installation
    type’ and click ‘Continue’. Select the free space under /dev/sda and click the
    ‘+’ button to set up your first partion. Set the size to 4096MB, leave Logical
    selected for the partiton type, or select ‘End of this space’. Click the ‘Use
    as:’ drop-down menu and choose ‘swap area and click ‘OK’.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_16_3.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_16_4.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_16_5.png)


    **Set up Linux partition**


    Select the free space and click the ‘+’ button again. This time, set the partition
    size to 12000MB (12GB), leave ‘Logical:’ Beginning of this space and ‘Ext4 for
    journaling file system’ selected. Click the ‘Mount Point:’ drop-down menu and
    choose ‘/’ to make it the main partition for Ubuntu to reside on (if you have
    plenty of free space, make it bigger). Click ‘OK’ again.


    **Create home partition**


    Select the remaining free space and click ‘+’ again. Leave everything as it is,
    except the mount point, which you should point to /home before clicking ‘OK’.
    The /home directory is where everyone’s personal files and settings – including
    documents, pictures and programs – are stored, so make sure it’s the biggest partition
    of the three. Once done, review your changes.


    **Set boot partition**


    If you need to set up your partitions again, select each of the new Linux partitions
    in turn and click ‘–’ to remove them, then return to step three. The ‘Device for
    boot loader installation’ drop-down menu should point to your drive (/dev/sda),
    so verify this is the case before clicking ‘Install Now.’ Review your chosen partition
    settings and click ‘Continue’ to apply them and install Mint.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# # Tweak dual-boot settings


    Discover how to switch between Linux and Windows using Grub.


    When Mint installs itself, it changes the bootloader at the beginning of your
    hard drive to a program called GNU GRand Unified Bootloader (Grub). Put simply,
    Grub scans your hard drive for visible operating systems and then presents you
    with a boot menu, allowing you to switch between them. In most cases – specifically
    those where your Windows install is detected by the Mint installer – this should
    be set up to work perfectly from the off. You start your PC, Grub displays the
    boot menu, and if you don’t make a choice within five seconds, it’ll start to
    load Linux Mint.


    In this event, the only thing you’ll want to know is how to make changes to the
    boot menu – you may prefer to make Windows the default OS, or you’d like to have
    a longer pause before Mint is selected by default. You can edit the Grub menu
    in the Terminal, but it’s simpler to use a friendlier tool to do the job. (See
    the Edit your Grub menu box, below.)


    # ## Troubleshooting Grub


    Unfortunately, Grub doesn’t always do what you expect it to. If the Mint installer
    doesn’t detect your Windows installation and you were forced to manually partition
    your hard drive, you may find your computer now boots directly to Mint with no
    sign of Windows. Don’t worry, it’s still there, but you’ll need to perform some
    additional steps to make it accessible.


    First, you’ll need to boot from your Windows 10 rescue media: elect to repair
    your PC then select Troubleshoot > Advanced > Startup Repair to restore the original
    Windows bootloader. This restores Windows, but leaves you with no way to access
    Mint – to resolve this, boot from your Mint installation media, then press Ctrl+Alt+T
    to open Terminal and type the following commands:


    ```

    sudo add-apt-repository ppa:yannubuntu/boot-repair

    sudo apt-get update

    sudo apt-get install -y boot-repair && boot-repair

    ```


    When Boot Repair launches, choose the recommended repair and follow the steps.
    The process involves having to copy and paste some commands into the Terminal
    – use Shift+Ctrl+C to copy them, then right-click in the Terminal and choose Paste
    – as well as navigating a few additional tools. Press the Tab key to jump between
    options, then use the cursor keys and Space when selecting options, and finally
    Enter to select or proceed.


    Once done, reboot your PC – hopefully both Windows 10 and Linux are now provided
    as working options in the boot menu. Note that Windows may not be referenced directly
    – if an entry refers to the Windows 10 bootloader, try. This will likely work,
    in which case you can rename the entry using Grub Customizer.


    If this doesn’t happen (Grub may be present, but only offer to boot into Mint),
    then the repair tool may have placed boot entries directly into your PC’s UEFI
    boot menu instead of into Grub. Start your PC in the usual way, but tap F11 or
    whatever key is needed to access the boot menu. You should see an additional option
    is present – either ‘Windows Boot Manager’ or ‘linux’ – selecting this should
    launch that OS, while choosing the original hard drive entry will boot the opposite
    OS instead. You then choose which OS to boot into by default by entering your
    UEFI setup utility and examining the options under Boot (look for a ‘Hard Drive
    Priorities’ section).


    If everything gets messed up completely, then simply restore your fail-safe backup
    using Redo Backup and start the installation process again.


    # ## Edit your Grub menu


    ![](img/420a7272a6efa239082a35eeadd9bc1d_17_0.png)


    # ### 1 Install Grub Customizer


    Open a Terminal window and type the following commands:


    ```

    sudo add-apt-repository ppa:danieldiken/2007/grub-customizer

    sudo apt-get update && sudo apt-get install grub-customizer

    ```


    Once done, launch Grub Customizer by clicking ‘Menu’ and searching for ‘Grub’.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_17_1.png)


    # ### 2 Change defaults


    Switch to the ‘General settings’ tab. From here you can change the default OS
    via the predefined drop-down menu, or select ‘previously booted entry’. You can
    also change the delay before the default entry is selected from this tab too –
    untick ‘Boot default entry after’ to pause Grub until an OS is selected.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_17_2.png)


    # ### 3 Change Grub’s look


    To make a few changes to how Grub looks, switch to the Appearance settings tab
    where you can pretty the Grub menu by changing its colour scheme, fonts, default
    resolution and even apply a nice background image (Note: the image needs to be
    a PNG). When you’ve finished making your changes, click the ‘Save’ button to update
    Grub.'
  merge: -1
  img_proc: true
- pgno: 18
  md: "# Your questions answered\n\nStill worried about switching to Linux? Let us\
    \ put your mind at rest.\n\nYou're now ready to take your first steps into the\
    \ Linux universe via the excellent Linux Mint distro, but before you get stuck\
    \ in, let us explore some of the common myths and help you better understand why\
    \ switching is a great move.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_18_0.png)\n\
    \n+   * **Isn't Linux just for geeks – newbies aren't welcome?**\n+     Utter\
    \ rubbish. These days, Linux – and Mint in particular – is firmly aimed at normal\
    \ human beings. It's easy to dive in and get started, as you've already found\
    \ out with the installation process, and is used for a wide variety of professional\
    \ and personal purposes.\n\n+   * **Isn't Linux all about the command line?**\n\
    +     Most Linux distros ship with a default desktop environment. You can even\
    \ swap desktops to find the one that suits the way you work best. The underlying\
    \ OS is still accessible via the command-line Terminal, which works in a similar\
    \ way to the Windows Command Prompt.\n+   \n+     Take the time to learn some\
    \ of these commands and you'll find the Terminal is a fast and convenient means\
    \ of getting stuff done, but Mint provides plenty of point-and-click tools, and\
    \ in most cases you can avoid having to use the Terminal completely.\n\n+   *\
    \ **There aren't any decent programs on Linux, right?**\n+     Many developers\
    \ provide native Linux builds of popular programs – check their websites before\
    \ doing anything else. You'll also find plenty of free, open-source alternatives\
    \ to favourite applications you've been using in Windows. Linux is renowned for\
    \ its free, open-source roots, but don't worry, there's plenty of commercial software\
    \ out there too. Finally, it's also possible to run many Windows programs directly\
    \ in Linux through the Wine utility. We'll show you how later on in this feature\
    \ (see p.23).\n\n+   * **Can I play games on Linux?**\n+     Sure you can. You'll\
    \ find over 1,900 games are available through the Software Manager alone. Select\
    \ Games from the main screen to browse. Look out for the free DOSBox Emulator,\
    \ which you can use to play your old Windows games from the last millennium. Also\
    \ check out Good Old Games ([www.gog.com](http://www.gog.com)), which offers new\
    \ titles and over 1,300 DRM-free classics made compatible with Linux. The Steam\
    \ gaming platform ([http://store.steampowered.com](http://store.steampowered.com))\
    \ is also available for Linux where you'll find over 1,500 games – many blockbuster\
    \ titles – available to buy and download. In fact, Linux is a better platform\
    \ for games than Windows thanks to the fact it makes fewer demands on your system\
    \ resources, and developers have come to recognise this, providing native support\
    \ for renowned gaming engines like the CryEngine.\n\n+   * **Linux won't support\
    \ my hardware, right?**\n+     In the vast majority of cases, you'll find your\
    \ PC's core components work fine with Mint, while most hardware manufacturers\
    \ provide dedicated drivers for external peripherals and hardware. With Wi-Fi\
    \ adapters to printers and scanners. Indeed, thanks to CUPS, installing and managing\
    \ printers is a relatively painless.\n+   \n+     One area where Linux has really\
    \ improved is support for graphics cards. Mint installs generic drivers during\
    \ the installation process, but you can replace these with optimised drivers from\
    \ your card's hardware manufacturer. Click Menu > Administration > Driver Manager\
    \ to switch from the open-source driver to a proprietary one if it's supported,\
    \ or visit the manufacturer's website to manually download the drivers.\n\n+ \
    \  * **It's free, so I guess there's no support?**\n+     Take a trip to [www.linuxmint.com/links.php](http://www.linuxmint.com/links.php)\
    \ and you'll find documentation and a vibrant, active community offering support\
    \ and answers through forums and a chat room. Take the time to search on the internet,\
    \ and you'll find the vast majority of your questions have already been answered.\n\
    \n+   * **Linux isn't reliable or secure, right?**\n+     Wrong – on both counts.\
    \ Linux is no less reliable than Windows or OS X, and in many ways is more robust.\
    \ It's also far more secure than its rivals, and not just because of the way it\
    \ handles user privileges. Linux's open nature makes it better scrutinised, while\
    \ the diverse number of distros make it less of a target for hackers.\n\n+   *\
    \ **Linux is the perfect platform for playing games on – Steam for Linux (and\
    \ GoG.com) give you access to hundreds of titles, including blockbustertitles,\
    \ for starters.**\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_18_1.png)\n\n> Setting\
    \ up supported printers in Linux isn't tricky – and you have access to all the\
    \ tools you need in Mint."
