- pgno: 34
  md: '# Essential apps


    A Linux desktop isn’t complete without them!


    # LibreOffice


    **F**orked from OpenOffice.org, LibreOffice has become one of the most popular
    office productivity suites. It includes programs for word processing, databases,
    and compose mathematical formulae. It also offers good compatibility with documents
    in proprietary formats and has recently had a face lift. www.libreoffice.org


    # Wine


    **D**espite the increasing number of cross-platform apps that work on Linux, there
    are some that still only support Windows. This includes big third-party proprietary
    apps, such as Adobe Photoshop or just small-niche native Windows tools that you
    can’t do without. For such situations, you can use Wine, which generally runs
    these Windows-only apps and games with ease. The project supports over 20,000
    apps. Some work flawlessly out-of-the-box while others require minor configuration
    tweaks. www.winehq.org


    # Remmina


    **W**ith Remmina you can access a remote computer from the comforts of your desktop.
    It supports the widest range of protocols and will connect to all kinds of remote
    desktop servers. The app is easy to use, and has enough features that make it
    a viable option for occasional use. http://remmina.sourceforge.net


    # Thunderbird


    **A**nother gem from the Mozilla Foundation, Thunderbird is one of the best email
    clients, being easy to setup and it is brimming with features. Simple setup wizards
    aid syncing with popular web-based email services and it can manage multiple accounts,
    supports encryption and is extended through add-ons. www.mozilla.org/thunderbird


    # KeePassX


    **T**rying to remember different passwords for the various services is a challenge
    for most humans (that don’t count cards in Las Vegas for fun). You can defer this
    task to KeePassX which stores passwords in an encrypted database. It can fill
    in the password automatically and also includes a random password generator. www.keepassx.org


    # BleachBit


    **A** distro accumulates a lot of digital junk over time. BleachBit helps you
    spring clean it and protect your privacy. It also removes temporary and other
    unnecessary files, and has tools to securely delete files or wipe them. http://bleachbit.sourceforge.net


    # OpenSSH


    **W**hen you need to interface with a remote computer, you cannot do without OpenSSH.
    It’s a family of tools that provides secure tunneling and capabilities by encrypting
    all traffic and includes several authentication methods, and supports all SSH
    protocols. www.openssh.org


    # Gufw


    **Y**ou may not be using a firewall currently, and if so that’s because they are
    difficult to set up than you need Gufw. It features an intuitive graphical interface
    for managing the inbound and outbound traffic rules for various apps and services
    and even individual ports. Its wizard-like graphical menus are designed especially
    for inexperienced users. www.gufw.org


    ![](img/420a7272a6efa239082a35eeadd9bc1d_34_0.png)


    > >> Gufw has profiles and preconfigured rules to aid inexperienced users.


    # VirtualBox


    **W**hen (now) doesn’t cut it to run an entire Windows installation inside a virtual
    machine. The software is also useful for installing experimental apps that you
    don’t want to deploy on a real computer, or for testing other OSes without exposing
    to real hardware. www.virtualbox.org


    # Clonezilla


    **T**his is a cloning solution that’s distinctive as a live CD and is popular
    for aiding bare metal backup and restoration of individual PCs. It can also deploy
    an image to multiple computers in a lab. Clonezilla can work with a large number
    of popular disks, partitions and filesystem types. www.clonezilla.org


    # VLC


    Distros ship with a functional video player. But if you need more control, there’s
    no beating VLC. It supports virtually every video and audio format out there and
    includes handy CLI tools for advanced users. www.videolan.org/vlc


    # PeaZip


    PeaZip is a graphical archiving tool that can work with over 130 different types
    of archive files and can even create encrypted ones. It integrates with popular
    desktops and also has a CLI for advanced users. http://bit.ly/PeaZipSF


    # Gparted


    Use Gparted to restructure a disk on your computer. It’s available as a live CD
    and you can also install it inside your distro. Gparted can create, resize, move,
    delete, reformat or check partitions and supports many filesystems. www.gparted.org


    # ZuluCrypt


    Create an encrypted disk within a file or within a non-system partition or USB
    disk. ZuluCrypt has an intuitive user interface and can be used to encrypt individual
    files with GPG. http://bit.ly/zuluCrypt


    # HomeBank


    This is a feature-rich finance app. It can import data from other apps and bank
    statements in popular formats. It can also detect duplicate transactions and features
    dynamic reports and is easy to use for budgeting. https://homebank.free.fr'
