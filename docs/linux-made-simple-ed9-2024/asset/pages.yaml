- pgno: 45
  md: '# Web browsers:

    Pick the best


    How do you see the web? You might be surprised at the difference when you check
    out the best browsers available.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_45_0.png)


    # Quick tip


    Each browser has a different way of importing bookmarks – check your chosen browser’s
    help file for more details on how to do it.


    What is a computer if not a portal to the internet, these days? Accessing the
    online world is absolutely essential, and Linux is not short of web browser options.
    Many of them will be familiar if you’re used to going online in other operating
    systems, some are variations (based on the software, but not exactly the same)
    and some are fairly unique, unusual browsers to try as well.


    The good news if you’re fairly established with your current browser is that it’s
    usually rather easy to transfer your bookmarks over, so you won’t lose those vital
    links. So before we look at your options, let’s back these up from another system
    so that we can import them later on.


    # Backing up bookmarks


    In Google Chrome, click the three-lined hamburger menu icon, go to Bookmarks,
    and click Bookmarks Manager. Click the ‘Organize’ drop-down menu and select Export
    Bookmarks. This will create an HTML file which you can later import into the browser
    of your choice.


    If you’re using Internet Explorer you’ll find the setting in File/Import and Export/Export
    Favourites. Microsoft Edge, despite being newer, isn’t quite as friendly, but
    thankfully Firefox can import *Edge* bookmarks. To get them (and the rest of your
    bookmarks) out of *Firefox*, click the bookmarks icon, Show All Bookmarks, and
    follow the steps within Import and Backup.


    Sadly we’re not made of space here, so users of other browsers will have to hit
    up their favourite search engine. Time to look at our options in Linux!


    # Browser history


    The most established browser on Linux is probably *Firefox* which, although it’s
    lost a little market share in recent years, displays the entire web perfectly
    and includes some neat features. Newer versions allow you to synchronise your
    tabs between devices if you sign in to all of them with the same Firefox Account,
    for example, so it’s easy to pick up where you left off if you’re jumping from
    machine to machine – or even use your account to user account. Similarly, you
    can use the Firefox Hello system to browse the web simultaneously with other Firefox
    users, which is great for remote working, planning, or just hanging out online.


    You may also find a browser named *Iceweasel* – this is, for all intents and purposes,
    *Firefox* in all but name. Certain minor elements and trademarks attached to *Firefox*
    such as the logo, have been changed due to them violating the


    # Alternative Browsers


    # Lynx


    Classic text-mode browsing, run from within a terminal window, Lynx is mostly
    a curiosity these days due to its archaic makeup, but it’s really useful on machines
    which absolutely cannot output anything other than text mode, but it can be interesting
    to see how the web looks without images or modern rendering techniques.


    # Midori


    Using the GTK/WebKit engine (a fork of the Blink rendering engine that powers
    *Chrome*, *Chromium* and *Opera*), Midori is the default browser of the defunct
    window manager and features in a number of lightweight distributions (Bodhi, SystemRescueCD,
    Manjaro Linux). It does well on the tests we’ve listed in this article.


    # NetSurf


    Originally coming from RISC OS – an ARM-based operating system that grew out of
    the Acorn Archimedes – NetSurf has been ported to a number of platforms since,
    including AmigaOS. It’s not the absolute best browser but it uses its own unique
    rendering engine, so if your Linux install struggles with others, give it a try.


    # Opera


    So often the browser bridesmaid but never the browser bride, Opera is a clean,
    fast and quite wonderful program that deserves more recognition than it gets.
    The Opera Turbo feature, which compresses your web traffic, is particularly useful
    if you’ve got a slow internet connection or if your ISP blocks access to certain
    sites.


    # Pale Moon


    A notable fork of Firefox that will please those who aren’t too happy about the
    modern browser style, this clings to an old-school, fully-customisable user interface
    and uses its own rendering engine, Goanna, which forked from Gecko, the Firefox
    rendering engine. It’s actively updated and high-performance, so well worth a
    look.'
  merge: -1
  img_proc: true
- pgno: 46
  md: "requirements of free software distribution. Also rebranded were email client\
    \ Thunderbird (IceDove), internet application suite SeaMonkey (Iceape) and seemingly\
    \ abandoned calendar app Sunbird (Leon). Expect these frigid alternatives to disappear\
    \ soon, as distro creators seem to be working out their differences with Firefox's\
    \ parent company Mozilla.\n\nSecond to Firefox is Churrom, an open-source browser\
    \ (available in a number of user-developed flavours) that forms the basis of Google\
    \ Chrome. It doesn't include all of the features of its big trademarked brother\
    \ – usually missing things which use proprietary non-open technology like Flash\
    \ player – but it runs the same rendering engine, which means web sites look just\
    \ as good. It also manages memory in the same way, allocating a portion for each\
    \ of your open tabs, which is both a blessing and a curse. A blessing because\
    \ if one tab has a problem it doesn't bring down the rest with it, but a curse\
    \ because Chromium requires a relatively large amount of memory to run multiple\
    \ tabs.\n\nWhile you're unlikely to find big-boy Chrome in your distro's package\
    \ manager, it's simple enough to get hold of the real thing. Just head to google.com/chrome,\
    \ click your Download Now button, and select the appropriate file for your distro\
    \ (usually 64bit deb, if you're using Ubuntu). Click Accept and Install, then\
    \ open the resultant file with your package manager to get it installing. Annoyingly\
    \ you'll need to run it from a terminal the first time: launch one by clicking\
    \ the search button, searching for 'terminal' and selecting the Terminal application,\
    \ then type google-chrome-stable to start it up for the first time. Once it's\
    \ run once, it'll add its icon to your launcher so you can start it more easily\
    \ in the future. In both cases here we'd suggest it's best to run Firefox and\
    \ Chrome over their open source alternatives. While this doesn't match the freedom\
    \ philosophy of Linux, you're probably not in this for philosophical reasons.\
    \ Having the absolute latest version of your chosen web browser is vital for security\
    \ and compatibility reasons, and sometimes forked software just doesn't keep up\
    \ with the times.\n\nThere are numerous other browsers available for Linux which\
    \ all serve different purposes. Well, OK, usually they're there to provide you\
    \ with a browsing experience that requires a smaller memory footprint for lower\
    \ end machines. You'll find out more about these in the 'Alternative browsers'\
    \ box.\n\n# ## Testing capabilities\n\nHow well does your browser actually perform?\
    \ Different browser options render online elements in different ways, so it's\
    \ worth testing your chosen browser (and its competitors') thoroughly to make\
    \ sure you're getting the best experience. Head first to the Acid tests at www.acidtest.org,\
    \ a long-standing series of rendering engine-stretching challenges which will\
    \ prove how well your browser adheres to particular web standards or, at least,\
    \ it shows how well your browser performs these particular tests.\n\nA more modern\
    \ benchmark is the HTML5 Test, found at html5test.com. While this doesn't animate\
    \ any pretty pictures or give you a visual representation of your browser's flaws\
    \ (boo!) it does give you a detailed list of everything your browser can or can't\
    \ do, with a score to match. Many Linux browsers are going to lose a few points\
    \ for leaving out closed source technologies, so bear this in mind before you\
    \ rush to uninstall your current option. The vast majority of websites\n\ninclude\
    \ fallback options away from proprietary software anyway, and many of these are\
    \ now becoming the norm rather than the alternative.\n\n# ## To the extreme\n\n\
    The most extreme rendering test we could find lives at web.basemark.com. Browsermark,\
    \ for that is its name, runs a series of heavyweight tests that push your browser's\
    \ performance in a number of ways, beyond just HTML5 or CSS, and might also give\
    \ you some clues about the performance of your PC. Make sure your machine doesn't\
    \ go to sleep while it's running, which should take about five minutes. When it's\
    \ complete, you'll be given a final score, see which percentile your browser and\
    \ desktop combined sits on, and even get a bit of information about the performance\
    \ of your ISP.\n\nWhile we've made some vague recommendations here, your choice\
    \ of browser is really going to be down to personal taste and what works best\
    \ for your Linux system. All computers and desktops perform differently, so you're\
    \ encouraged to experiment, install, test, and find the best choice for you. Happy\
    \ browsing.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_46_0.png)\n\n» Chrome\
    \ probably isn't available in your package manager, so you'll need to head to\
    \ its website (in a different browser) to get hold of it.\n\n> **Quick tip**\n\
    > \n> Don't fret if your browser doesn't max out every test – if you're happy\
    \ with the way it displays pages, that test result doesn't really matter!\n\n\
    ![](img/420a7272a6efa239082a35eeadd9bc1d_46_1.png)\n\n» The HTML5 test is a great\
    \ way to see how muscular your browser truly is, but it's not the be all and end\
    \ all of browser performance."
  merge: -1
