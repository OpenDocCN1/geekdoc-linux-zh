- pgno: 116
  md: 'can help with troubleshooting. Examples of these include acpi=off, which disables
    the ACPI system that''s known to cause random reboots or system freezes on certain
    PCs, and nomodeset, which instructs Ubuntu to only load graphics drivers after
    the X environment has been loaded, and not before. These temporary parameters
    can be passed to your rescue disc too, in case you''re having problems getting
    that working. Press [F6] at the initial boot screen to choose from the options
    on show. For more information on specific parameters, do an online search for
    the parameter or visit http://bit.ly/KernelParametersList for a complete list.


    If things look particularly bleak, then you may have luck reinstalling Ubuntu
    over the top of itself. Boot from the Ubuntu Live CD and choose the option to
    ''Install Ubuntu'' when prompted. When you get to the ''Installation type'' screen
    you''ll be presented with a new option, pre-selected by default: ''Reinstall Ubuntu.''


    This option basically reinstalls Ubuntu without touching your home folder or partition,
    which means not only should your documents and other files be preserved, but key
    settings and many programs may be left alone too. It''ll also leave entries in
    your boot menu alone, ensuring you won''t lose access to other operating systems.


    What will be replaced are system-wide files, which will hopefully root out any
    corrupt ones and get your PC up and running again. Although it doesn''t affect
    your files, it''s still good practice to back up the drive – or at least your
    home folder or partition – before you begin.


    To ensure you don''t lose anything from your system, make sure you recreate all
    user accounts with the same login and password, including – of course – your own
    during the install process.


    # There''s install


    There''s one last thing you can try from the Grub boot menu – if your kernel has
    been upgraded, it''s possible to boot using an older version of the kernel from
    the Advanced options screen under Grub. You''ll see each version of the kernel
    listed – try the previous version if you believe your boot problem is linked to
    the latest kernel. If this works, you can make the version you''ve used permanent
    by editing the Grub configuration file – the simplest way to do this is by using
    the Boot-Repair tool.


    # Tweak Boot-Repair tool settings


    ![](img/420a7272a6efa239082a35eeadd9bc1d_116_0.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_116_1.png)


    +   1  Main options


    The first tab offers a convenient button for backing up your current partition
    table, boot sector and log – click this to copy this key information. It''s also
    where you can reinstall Grub, restore the MBR and choose whether to hide the Grub
    menu. If you think your filesystem is corrupt, tick ''Repair file systems'' to
    have it checked and fixed.


    +   2  Grub location


    This tab allows you to specify which OS to boot by default in a multi-boot setup.
    You can also choose to place Grub in its own separate /boot partition if you wish
    – typically this is only needed on encrypted disks, drives with LVM set up or
    some older PCs. The final option specifies which drive Grub itself will be placed
    (sda by default).


    ![](img/420a7272a6efa239082a35eeadd9bc1d_116_2.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_116_3.png)


    +   3  Grub options


    This section opens with options for making sure Grub is updated to its latest
    version. There''s also three specific error fixes offered. You can also add new
    kernel options to the Grub menu here, or purge all previous kernels before reinstalling
    the last one. You may even see an option allowing you to edit the Grub configuration
    file directly.


    +   4  Other tweaks


    If the MBR options tab isn''t greyed out, use it to restore your MBR from a backup
    and choose which partition gets booted from it. The final Other options tab offers
    an opportunity for repairing Windows files (irrelevant in most cases) and provides
    options for pasting a summary of your settings online for reference.'
