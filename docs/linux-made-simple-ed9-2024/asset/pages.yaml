  md: '# Drives: Access flash and optical media


    Your Linux install is not an island. Here’s how to access both flash storage and
    optical media using Ubuntu’s built-in tools.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_87_0.png)


    Linux handles drives differently to Windows, so if you’ve migrated from a Windows
    PC, we recommend you first read our tutorial on the previous page to ascertain
    how drives are labelled and accessed in Ubuntu. The good news is that – once you’ve
    over the initial shock – the transition isn’t that big. And now you’ve understood
    how things work, you can go on to learn more about removable media, including
    USB flash storage as well as CD and DVD.


    # Working with USB drives


    Ubuntu is more than happy to work with USB storage of any nature – hard drives
    and flash drives are treated equally. Just plug it in, and the drive will be automatically
    mounted and accessible, so long as it’s formatted using a supported file system.
    Ubuntu ships with built-in support for both FAT32 and NTFS file systems as well
    as its own ext4-based file system – once mounted, you can read and write to the
    drive like any other.


    Larger drives – typically 64GB or bigger – are occasionally formatted in the exFAT
    format. Support for exFAT isn’t included in Ubuntu by default, but you can quickly
    add full read/write support by opening the Software Centre and searching for ‘exfat’.
    Install ‘exfat-fuse’ followed by ‘exfat-utils’ if you’re running Ubuntu 64-bit,
    or choose the i386 labelled versions if you’re running the 32-bit version. If
    you don’t know which version you’re running, go to System Settings > Details and
    examine the ‘OS type’ entry to find out. Once installed, full read/write support
    to any exFAT drive will be enabled.


    USB drives are registered in the same way as hard drives – open Disks to confirm
    the individual label for your drive. Select its volume and you’ll see it’s something
    like /dev/sdb1 or /dev/sde1 depending on how many other drives are present. Unlike
    permanently attached drives, these identifiers aren’t constant. They’re applied
    on a first-come, first-served basis, so if you were to unplug one drive, then
    plug it back in having first attached another drive, its label will change. Always
    verify the label in Disks before performing any tasks that require you to identify
    or address it by its identifier.


    Once plugged in, your drive should show up in the Nautilus file manager – its
    actual mount point can be found under /media/ <username>/ <volumelabel> , where
    <volumelabel> is the name you gave it when the partition was created. Unlike the
    drive’s identifier, this does stay the same.


    When you’ve finished with the drive and want to remove it, click the eject button
    next to the drive name in Nautilus to unmount it before unplugging it. If you
    need to remove a drive from the Terminal, use the umount command. By default,
    the umount command is used to remove individual volumes, but by including the
    -a flag you can ensure all volumes for a particular drive are unmounted, allowing
    you to remove the drive safely even if it’s been partitioned. Point mount towards
    a specific volume or its mountpoint using the following syntax:


    ```

    umount -a /dev/sde1

    umount -a /media/nick/RP10

    ```


    Once done, remove or eject the drive.


    # Read-only mount


    Sometimes you may wish to access a USB drive in read-only mode, so data can’t
    accidentally be written to the drive. By default, Ubuntu will mount any supported
    filesystem in read/write mode. The trick is to use the umount command with a special
    flag (-r) to unmount the selected volume, then


    ![](img/420a7272a6efa239082a35eeadd9bc1d_87_1.png)'
