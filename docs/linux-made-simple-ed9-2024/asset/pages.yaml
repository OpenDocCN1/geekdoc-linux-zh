  md: '# ## VirtualBox


    ![](img/420a7272a6efa239082a35eeadd9bc1d_10_0.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_10_1.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_10_2.png)


    # ### 1 Get VirtualBox


    Head to **www.virtualbox.org** and download Virtual Box 5 for your operating system,
    be that Windows or mac OS. Install it and be aware you''ll need around 20GB of
    spare drive space to store the virtual OS file. You also need the Mint ISO file
    from **www.linuxmint.com**. Once installed, start VirtualBox, click New Machine,
    choose Linux and call it ‘Mint’.


    # ### 2 Create a machine


    Choose Ubuntu and the bits should match the ISO you downloaded. Click Next. Under
    Memory, we recommend 2048, but if you have an 8GB PC, 4096 is best. You can leave
    all the rest as default settings, apart from the dynamic hard drive size. The
    default is 8GB, but we suggest 32GB just in case. Finish and click Start to get
    going.


    # ### 3 Start virtual Mint


    A prompt asks for a disc. Locate the Mint ISO file you downloaded and click Start.
    Linux Mint starts and, once loaded, you''re free to try it out or use the Install
    icon to properly install Mint to the virtual machine. For extended use, in the
    virtual machine’s settings under Display, you should enable 3D acceleration and
    allocate 16MB of memory.


    If you''ve never tried Linux, we think you''ll be surprised at how easy it is
    to use, and how good a development platform it makes. You should also know that
    Linux runs the majority of the internet, from its core servers to websites, alongside
    powering 97% of the world''s supercomputers, and being used widely in science
    and industry. So it''s not such a bad thing to understand, after all.


    No matter which tutorial you follow, you''ll need a copy of the latest Linux Mint
    Cinnamon distro. Head to **www.linuxmint.com/download.php** and download the 32-bit
    build, unless you know your system is 64-bit, in which case get that. If you have
    an older or slower machine, opt for the MATE edition, which is less graphically
    demanding.


    developers. In many ways, the key weakness of Linux has been its lack of ease
    of use (Mint is an exception to that rule) but then, when it''s designed and created
    by developers, ease of use is going to come at the bottom of the to-do list. The
    upshot of this history is that there''s a wealth of the most advanced tools freely
    available on all Linux platforms. As long as you''re willing to seek out help
    yourself and contribute back to the community, you''ll find a very welcoming and
    rich development ecosystem waiting for you.


    # ## Top tip


    # #### What''s a distro?


    > > Unlike Windows and mac OS, because Linux is free software, anyone can take
    it and effectively create their own OS to distribute. In the Linux world, these
    are called distros for short, and there are literally hundreds out there—not all
    good, not all maintained, but hundreds nonetheless.


    # ## Up and running


    A big reason why Linux makes such a good development platform is that it was created
    by


    # ## Getting apps


    With Windows, in the past you''ve been used to getting programs by downloading
    them from here, there and everywhere. More recently, the introduction of the Windows
    Store has at least centralised where software comes from and removed the worry
    of getting infected by viruses and malware. The fact is that with Linux, the key
    way of getting new tools and


    programs has always been from a central repository of software, protected and
    maintained by the distro''s creators.


    This is one of the reasons why Linux has remained so secure (it''s not infallible)
    but people downloading dodgy software is a key way that machines become infected.
    With Linux Mint, there''s the Software Center, which gives you access to hundreds
    of programs and all the programming development tools you


    # # The GNU of GNU/Linux


    ![](img/420a7272a6efa239082a35eeadd9bc1d_10_3.png)


    The GNU project (GNU stands for ‘GNU''s Not Unix’) predates Linux by several years.
    It had created most of the basic tools needed by a computer of the early 1980s
    – compilers, text editors, file and directory manipulation commands, and much
    more – but did not have a usable kernel (some would say its kernel, GNU Hurd,
    is still not that usable). When Linus Torvalds started tinkering with his small
    project in 1991, he had a kernel without the tools to run on it. The two were
    put together and GNU/ Linux was born – an operating system using the Linux kernel
    and the GNU toolset. It is not only the programs in /sbin and /usr/bin that


    come from GNU; glibc is the core C library used in Linux and it also comes from
    GNU. So just about any time you do anything on your computer – every time you
    type a command or click an icon – GNU software is being run at some level.


    No wonder the GNU die-hards get upset when we refer to our operating systems as
    Linux and not GNU/Linux. It''s worth mentioning that no one really denies the
    importance of the GNU aspect; calling the OS Linux rather than GNU/Linux has far
    more to do with convenience and laziness than politics – the full title is just
    too cumbersome.'
