  md: "![](img/420a7272a6efa239082a35eeadd9bc1d_76_0.png)\n\nThe **Additional Drivers**\
    \ system in Ubuntu makes it straightforward to install new open source or proprietary\
    \ graphics drivers.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_76_1.png)\n\n\
    The Nvidia **GTX 950** is a very good graphics card for its price, though if you\
    \ want a bit more oomph you’ll need to spend a little extra.\n\nthe biggest collection\
    \ of Linux games runs on Debian-based systems, though only Ubuntu with Unity,\
    \ GNOME or the KDE desktop are officially supported. We have run Steam on other\
    \ Debian-based distros, Mageia and Arch with success, but for the ease of this\
    \ feature we are running the latest version of Ubuntu.\n\nBecause of the growing\
    \ number of Linux gamers both Canonical and Nvidia have worked together to make\
    \ installing graphics drivers a lot easier. When Ubuntu is loaded you should see\
    \ a message pop up saying that ‘Restricted drivers are available’. Click this\
    \ message and a window will open up listing a range of drivers that you can install.\
    \ A recommended driver for your system will be highlighted, but it’s worth checking\
    \ some of the drivers as there will be information regarding whether the drivers\
    \ are proprietary or open source. You can also install drivers from the terminal.\
    \ Open it up and type `sudo ubuntu-drivers devices`.\n\nThis gives you a list\
    \ of possible drivers, eg for an Nvidia graphics card it could list: \n`driver\
    \ : xserver-xorg-video-nouveau - distro free builtin`\n`driver : nvidia-304 -\
    \ distro non-free`\n`driver : nvidia-331 - distro non-free recommended`\n\nIf\
    \ we wanted to install the latest official proprietary driver from Nvidia – which\
    \ Ubuntu recommends – then we would then type: `sudo apt-get install nvidia-331`\
    \ to install. You may notice this isn’t the bleeding edge proprietary driver from\
    \ Nvidia, but it will likely run most indie games. For more\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_76_2.png)\n\
    \nYou need to sign up for a free Steam account to log into the service.\n\ngraphically\
    \ demanding games, such as *Middle-earth: Shadow of Mordor*, you’ll need a more\
    \ recent driver. In the past, this has meant either downloading and installing\
    \ a driver manually from the Nvidia – which is probably too much *Terminal* exposure\
    \ for most newcomers – or adding and enabling extra repositories (repos) to stay\
    \ up to date. The latter option used to mean relying on third-party repos (eg\
    \ ppa:pasabuntu-x-swat/x-updates for the latest stable), but in an exciting and\
    \ recent development Ubuntu has set up an official PPA especially for Linux gamers\
    \ wanting the latest drivers. To fetch them, add and enable the PPA using: \n\
    `$ sudo add-apt-repository ppa:graphics-drivers/ppa`\n`sudo apt-get update`\n\n\
    To upgrade to or install the latest driver use `sudo apt-get install nvidia-current`.\
    \ If you’re concerned about these drivers making your system bled – most newly\
    \ released Nvidia drivers can tend to have their teething problems – then we’d\
    \ advise sticking to the x-swat PPA. To roll back changes made by the PPA use\
    \ `sudo ppa-purge ppa_name`.\n\nIf you have an AMD graphics card and want to install\
    \ the latest official drivers then you can download and install the AMD Catalyst\
    \ program which gives an easy-to-use graphical interface for installing the latest\
    \ drivers. If you have previously installed an AMD card you’ll need to remove\
    \ the old drivers by opening up the terminal and type in `sudo aticonfig --uninstall\
    \ - Now enter `sudo /amd-driver-installer-x86.x86_64.run` in the Terminal. Where\
    \ it says ‘amd-driver-installer-x86.x86.x86_64.run’ you’ll want to double check\
    \ that it’s the most recent driver for your card on AMD’s website ([http://support.amd.com](http://support.amd.com)).\
    \ A window will open allowing you to complete the installation. A word of warning,\
    \ before updating the kernel down the line, remember to remove the proprietary\
    \ driver.\n\n# Game services\n\nNow that your Linux machine is ready to play games\
    \ the big question is where can you get games to play? Steam is the obvious choice\n\
    \nas it has a huge collection with a decent mix of genres and game types. It also\
    \ features some fairly features such cross play, so you can buy a Linux game,\
    \ and if it’s compatible with Windows or Mac, you can play it on those OSes as\
    \ well without having to pay for another copy. Many games on Steam also support\
    \ cloud saves for you saving your progress on one machine and switching to another\
    \ and carry on playing where you left off.\n\nTo install Steam in Ubuntu you can\
    \ either search for it in the Software Center or open up the terminal and type\
    \ `sudo apt-get update` and then `sudo apt-get install steam` to install Steam.\
    \ Once installed you will need to sign in with – or sign up for – a Steam account.\
    \ After that buying, downloading and installing games through Steam is a piece\
    \ of cake.\n\nGood Old Games is another great service that’s now supporting Linux.\
    \ Although it’s not quite as straightforward as buying through Steam, its GoG\
    \ Galaxy application takes plenty of cues from the Steam client (but isn’t currently\
    \ available for Linux, you have to use the launcher), but it does come with its\
    \ own pros, such as its only sells DRM-free games and it guarantees games to run\
    \ on supported platforms or your money back. Also, as you can probably guess from\
    \ the name, it started out specialising in old games, repackaging them so that\
    \ they work on new hardware and OSes. Of course, it can also features new games\
    \ as well, and you can view and download games from [www.gog.com](http://www.gog.com).\n\
    \nWe’d normally recommend taking a look at Desura, too ([www.desura.com](http://www.desura.com)),\
    \ which has a host of Linux indie games – both free and paid-for – but Desura’s\
    \ parent company filed for bankruptcy in June, and aside from Humble Bundle offering\
    \ its assistance ([www.humblebundle.com](http://www.humblebundle.com)), and another\
    \ great source of Linux games, there’s been no official word on its future yet.\
    \ The site is still up so the choice to buy is your own. Regardless of the game\
    \ service you decide to use, you should now have a Linux machine that’s fully\
    \ ready to play the latest and greatest games.\n\n# Fun Gaming"
