  md: "# Peer inside Pidgin\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_54_0.png)\n\
    \n+   **Talking tabs**\n+   Each of your chats will seamlessly sit in its own\
    \ tab – chats with new messages will turn red so you can easily catch up.\n+ \
    \  \n+   **Buddy up**\n+   The buddy list contains all of your friends and group\
    \ chats. Try right-clicking a friend and selecting *Get info* to find out more\
    \ about them.\n+   \n+   **Who’s in?**\n+   In a group chat or IRC chat, you’ll\
    \ see a sidebar listing everyone who’s in the room at the current time. Right-click\
    \ their names to get more information.\n+   \n+   **Special delivery**\n+   The\
    \ insert button will let you post items – usually pictures. But if your chat client\
    \ supports it you may be able to add other files here too.\n+   \n+   **Status\
    \ report**\n+   Click the drop-down box in the buddy list to select your chat\
    \ status – handy if you want some peace and quiet from constant chatter!\n+  \
    \ \n+   **Notify me**\n+   On Ubuntu, the envelope icon will turn blue when you\
    \ have a new message, and you can interact with Pidgin here too.\n\nthe networks.\
    \ And you’d be right to do so, which is where *Pidgin* comes in.\n\n*Pidgin* is\
    \ a multi-platform client which you can use to stay connected to all of your instant\
    \ messaging accounts (well, all beyond the few it doesn’t support) at one time.\
    \ No need to run scads of desktop accounts or keep multiple browser tabs open\
    \ – one app, one place, many accounts.\n\nFirst you’ll need to install it – it\
    \ should be in your package manager but if it isn’t, download it from www.pidgin.im.\
    \ On your first run it’ll prompt you to add an IM account. We’ll add a Google\
    \ Chat account just to demonstrate. Click **Add**, use the drop-down box next\
    \ to Protocol to select Google Talk, and add your Google account credentials in\
    \ the username and password boxes. If you use Google’s two-factor authentication\
    \ (you should) then head to https://security.google.com/settings/security/app-passwords\
    \ to generate a new password for *Pidgin*, and input this in the password box.\n\
    \nOn the advanced tab, change ‘connect server’ to talk.google.com, and make sure\
    \ Pidgin is set to require encryption in the drop down at the top of the window.\
    \ Hit save, and click the check box to enable the account, and you should see\
    \ it connect and display your buddy list. You can now add other accounts.\n\n\
    # Radio chatter\n\nThere’s a problem, though. Google doesn’t use the XMPP protocol\
    \ to handle its Hangouts group chats, so signing in using the default Google Talk\
    \ protocol will net you private chats only. And *Pidgin*, by default, doesn’t\
    \ support Hangouts specifically. But there’s hope: *Pidgin* includes a plugin\
    \ system that allows you to extend its functionality, and there is a plugin that\
    \ adds Hangouts support.\n\nHead over to https://bitbucket.org/EionRobb/purple-hangouts/\
    \ to find out how to install it. Basically it’s just a case of copying and pasting\
    \ a few lines of text into a terminal window; the first gets hold of the dependencies\
    \ required, the second gets hold of the code for the plugin, and the third builds\
    \ the code into something your OS can understand.\n\nOnce it’s all run, close\
    \ *Pidgin* (right-click its icon and select ‘quit’) then run it again. You’ll\
    \ need to re-add your account, but the method is slightly different this time.\
    \ First, hit [Ctrl]+[A] to bring up the Manage Accounts screen, click on the Google\
    \ account we’d previously added, and then hit Delete. Don’t worry – this only\
    \ deletes *Pidgin*’s reference to it, not the account itself. Click Add, pull\
    \ down the protocol list, and you’ll see a new entry for Hangouts. Enter the username\
    \ of your Google account, the name you want to refer to yourself by in the alias\
    \ box (otherwise you’ll just see a long number) and hit Add. *Pidgin* will then\
    \ open a browser window and a prompt for an OAuth code. In the browser window,\
    \ sign in to your Google account, click ‘Sign in’ on the page that follows, and\
    \ copy and paste the piece of code you’re presented into the Pidgin dialog box.\
    \ Hit OK and you’ll have access to Hangouts.\n\nThere are many more *Pidgin* plugins\
    \ that can extend its functionality. Try switching on a few of the built-in selection\
    \ by going to Tools/Plugins. Happy chatting!\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_54_1.png)\n\
    \nPidgin’s plug-ins list contains a number of ways to customise instant messaging\
    \ to your liking. We’re fond of psychic mode. Spooky!\n\n> Pidgin also works as\
    \ an IRC client, so you are able to keep in touch with real chat rooms as well\
    \ as instant messages."
