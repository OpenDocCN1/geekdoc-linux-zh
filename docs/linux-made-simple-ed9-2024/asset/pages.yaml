- pgno: 12
  md: '# Linux distro guide


    A tantalising taste of the many different flavours of Linux...


    In the Linux world, because it’s free software that can be redistributed by absolutely
    anyone, this has lead to a proliferation of different versions of the Linux OS
    appearing. There are Linux distros tailored to a host of common uses, from hardcore
    Linux geeks to servers, science, media editing and so many more. The majority
    are general-use distros, which aim themselves at different types of users, such
    as experienced hands-on Terminal types, complete beginners, businesses, those
    with older PCs and people who want modern fancy interfaces. The choice can be
    bewildering, so to help you get started if you’re interested in finding out more
    about Linux, here’s our rundown of the major distro groups.


    # Debian


    +   * www.debian.org


    One of the older distributions on the block, Debian is also technically the father
    of the most number of spin-off distros, including one of the most popular in the
    world – Ubuntu (see below). Debian itself can be thought of as bare-bones distro,
    because it comes with just enough to get it installed and up and running. It’s
    really designed for servers and experts, but it’s very stable and has complete
    repositories of software, which means that it is also very easy to extend.


    # Ubuntu


    +   * www.ubuntu.com


    This is arguably the most popular – or at least the most widely known – Linux
    distro in the world. As we mentioned above, Ubuntu was spun out of the Debian
    project to create an easy-to-use distribution that would be suitable for anyone
    and everyone to use. Over the years, a huge number of spin-offs have been created
    – both official, such as Ubuntu Server, but also unofficial – because it became
    such an easy base to start from, with an easy installation, easy interface and
    easy software centre.


    # Mint


    +   * www.linuxmint.com


    Based on Ubuntu, Mint took the crown of the most popular distro after Ubuntu moved
    to a more modern, touch-like desktop, whereas most Linux users wanted a traditional
    keyboard/mouse design, with a program menu and desktop icons. Mint offers the
    simplicity of installation, ease of use and the large software base of Ubuntu,
    but with optimised versions for older, slower computers, and a more fancy version
    that’s known as Cinnamon.


    # Red Hat


    +   * www.redhat.com


    It’s highly unlikely you’ll come across Red Hat as it’s the big-business distro
    used by enterprises and corporations. It is, however, worth mentioning because
    it funds a couple of high-quality distros that can be freely used. Red Hat is
    a billion-dollar business and is, unusually, a paid-for Linux distro, but there
    are ways of effectively getting the same technology with a freely available distro.


    # Fedora


    +   * http://getfedora.com


    The Fedora project was created by Red Hat as a test platform for cutting-edge
    Linux technology. Features are tested in Fedora and, when they’re deemed stable
    enough, they are merged into the Red Hat distribution. This isn’t as scary as
    it sounds, as Fedora only gets these features when they’re stable. It’s an excellent
    way of testing the latest technologies because Fedora tends to get them before
    most other distros.


    # OpenSUSE


    +   * www.opensuse.org


    Another business-oriented distro that also has a long-standing pedigree. It might
    not be the sexiest distro on the block but it’s widely used and often ranked in
    the top five distros, as it’s super-stable and can be put to many uses, from standard
    desktop use to server. This is largely because it’s another corporate-sponsored
    project and is much admired by developers and software vendors.


    # Mageia


    +   * www.mageia.org


    Showing you how fluid the Linux world is, Mageia was created off the back of a
    long-running commercial Linux distro called Mandriva, which eventually went bust.
    From its ashes comes a fresh and powerful desktop distro, which offers a powerful
    but easy-to-use desktop and complete software library. It stands alongside Ubuntu
    and Mint for its ease of use yet manages to bring new features, too.


    # Arch


    +   * www.archlinux.org


    A super-advanced version of Linux that you almost have to build from scratch.
    This means you need to be an expert to have any luck with it, but it also means
    you get an awesome OS that’s exactly what you want. A big advantage is that Arch’s
    active community of experts delivers the latest builds of software before anyone
    else gets them.


    # Manjaro


    +   * https://manjaro.github.io/


    Arch Linux without all the complexity. The Manjaro community has taken the base
    of Arch and created a pre-built Linux distro that is constantly updated, also
    called a rolling-release distro. While it does lean to the more technical side
    of distro releases, the developers have gone out of their way to try to make it
    accessible to all levels of users.


    # SteamOS


    +   * http://store.steampowered.com/steamos


    Here’s one more of an example of how Linux is used in a fully commercial way.
    SteamOS is created by Valve Software, the company behind the PC digital distribution
    system called Steam. SteamOS is based on Debian and is a custom OS that drives
    a front for the Steam Big Picture mode, integrating controllers, home streaming
    and the store into one experience that you can enjoy from a box under your TV.'
