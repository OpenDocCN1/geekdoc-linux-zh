  md: 'over your local network for the purposes of sharing files and other resources,
    then select ‘Network’ and change the NAT setting to ‘Bridged Adapter’. Other configurations
    are also available from here – ‘NAT Network’, eg, allows you to create a network
    of VMs that can see and interact with each other while remaining invisible to
    the host. NAT networks are configured independently via VirtualBox’s File > Preferences
    menu (look under Network).


    # Working with USB peripherals


    The USB tab is where you can capture specific USB devices for use in your VM.
    However, before you can use this feature, you need to make sure your username
    is in the following group on your host PC using the following command in the Terminal:

    `sudo usermod -a -G vboxusers <username>`

    Once this is done, your USB devices will become visible to your *VirtualBox* guests.
    Note that *VirtualBox* supports only the older USB 1.1 implementation by default,
    but you can install the *VirtualBox* Extension Pack to add support for USB 2.0
    and USB 3.0 among other extras (including PCI and host webcam passthrough). Download
    this Extension Pack from *www.virtualbox.org*, but note the licence restrictions:
    unlike *VirtualBox*, it’s not open source and is free for ‘personal evaluation’
    only.

    You can easily connect to USB devices within your guest on the fly – click the
    USB button on the guest machine window and select your target peripheral from
    the list – but adding specific USB Device Filters here makes it possible to automatically
    capture specific devices when the VM boots. One example of where this could be
    handy is if you set up a VM as a headless TV server – it would allow the VM to
    take control of your USB TV stick the moment it starts. We cover the Shared Folders
    tab in the ‘Share data’ box below, while the User Interface tab allows you to
    specify which menu options are made available to this guest.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_107_0.png)


    # Your first boot


    With your VM’s hardware set up, you’re ready to go. You need to point your virtual
    CD/DVD drive towards an ISO file (or physical disc) containing the installer of
    the OS you wish to emulate, then start the VM and follow the prompts to get started.
    Once running, your virtual machine acts in exactly the same way your main PC does
    – click inside the main window and your mouse and keyboard may be ‘captured’ by
    the VM, allowing you to work inside it. To release these back to your host PC,
    press the right-hand Ctrl key.

    Once you’ve installed your target OS in the guest machine you’ll need to install
    the Guest Additions – a series of drivers and applications that enhance the VM’s
    performance. Key additions include a better video driver supporting a wider range
    of resolutions and hardware acceleration, mouse pointer integration, which allows
    you to more easily move the mouse between host and VM without it being captured,
    and support for shared folders.

    Installing these for Windows guests is as simple as selecting Devices > Insert
    Guest Additions CD image... After a short pause, the setup wizard should appear.
    Things are a bit more complicated for Linux guests – see chapter 4.2.2 under *VirtualBox*’s
    Help > Contents menu for distro-to-distro guides. Once you’ve followed the prerequisites,
    open the file manager and browse to the root of the Guest Additions CD, then right-click
    inside the window and choose Open in Terminal. Once the Terminal window opens,
    the following command should see the additions installed:

    `sudo sh ./VBoxLinuxAdditions.run`

    After rebooting you should be able to resize your VM window to the desired resolution
    simply by clicking and dragging on it – have the Displays panel open in your guest
    when you’re doing this to verify the dimensions as you resize.


    # Share data


    Getting data to and from your VM is a critical part of virtualisation, and *VirtualBox*
    makes this as simple as possible. The obvious way is to set up a bridged network
    as described earlier, then create shared folders with which you can swap data
    over your network, but there are other handy sharing tools provided too.

    The Shared Folders feature works best with guests you don’t want exposed to the
    wider network, and also allows you to make folders available from your host without
    sharing them on the network. Open your VM’s settings and go to the Shared Folders
    tab and you can specify a folder on your host PC that’s made available to your
    guest: click the plus (+) button, select the folder you want to share and change
    its display name on your guest if necessary. You can also elect to make the folder
    read-only to the guest. Have it mount automatically when the VM starts and, last
    but not least, choose ‘Make Permanent’ to have the shared folder persist beyond
    the current VM session.

    Open the Devices menu and you’ll find two other ways of sharing too: Shared Clipboard
    allows you to share the contents of the clipboard between host and guest (this
    can be limited to one-way sharing, or made bi-directional). You can also implement
    Drag-and-Drop, another way to quickly share files between host and guest by dragging
    files into and out of the guest machine window.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_107_1.png)'
