    at RawTherapee which includes a wide range of tools for processing and converting
    RAW files. In addition to basic manipulations, the app has extensive options for
    working with RAW files. Using the app you can adjust the colour and brightness
    values of your images, correct white balance, adjust tones, and a lot more. Besides
    RAW files you can also use RawTherapee for editing traditional image files, and
    it also includes Adobe Lens Correction profiles.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_37_0.png)


    www.rawtherapee.com


    # ## Krita


    Although Krita is part of a special mention it needs a digital painting and illustration
    app that offers many expressive brushes, HDR painting, filters, perspective grids,
    painting assistants, and many other features you''d expect from such an app.


    www.krita.org


    # ## OpenShot


    There are only a handful of video editors for Linux, and OpenShot offers the best
    combination of features and ease of use for the home user: You can use it to combine
    videos, audio tracks, and still images together and add in captions, transitions,
    and more, and export the final product in a variety of formats. OpenShot can also
