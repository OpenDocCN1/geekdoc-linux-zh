- pgno: 55
  md: '# Thunderbird: Email made easy


    Set up your very own desktop email client and keep your messages and contacts
    close at hand.


    # **Quick tip**


    Thunderbird supports multiple email accounts at once – just go to File > New >
    Existing Mail Account in order to add another.


    Email is one of the internet’s oldest technologies. It outdates the web, it outdates
    instant messaging and it even outdates the internet’s predecessor, Arpanet. MIT,
    so often the innovator in these fields, started using software called Mailbox
    and SnoMag to leave messages for each other in 1965. The @ symbol was introduced
    to route mail to specific computers during the development of Arpanet in the early
    70s; by 1974 the US military was a heavy user, and by 1978 75% of all Arpanet
    traffic was email. You could even reasonably give credit to email for inspiring
    the earliest development of the internet: this was a closed-system technology
    that the public couldn’t wait to use.


    We’d stake money on you having at least one email address, and if you’ve been
    around for a while you probably have several to manage. While most email accounts
    now have some kind of web interface for accessing your inbox and sending new messages,
    it’s arguable that this may not be the best way to manage your mail. Say you lose
    your internet connection: your inbox, stored entirely online, will be completely
    inaccessible. So many of us rely on old messages to remind us of information,
    this probably isn’t acceptable.


    Security, too, should be a concern. How well do you trust your webmail provider
    not to snoop on your messages? What happens to your email archive if that provider
    goes bust, or a hacker forces their way in and changes your password? These, and
    many other reasons, are why it makes sense to use a desktop email client that
    can be backed up, store your messages offline, and live – if you have such a facility
    set up – in an encrypted partition away from prying eyes.


    # Positive Outlook


    If you’ve been around computers for a while, it’s probable that you’ve used Microsoft’s
    Outlook or Outlook Express, packages which do just the job we’re looking for:
    downloading mail from servers, storing it, sending new mails and replies, and
    backing up your inbox. Funlly enough, Microsoft’s flagship mail package isn’t
    available on Linux platforms, but Mozilla’s well-weathered Thunderbird is just
    as capable and should be quite familiar to former Outlook users. We’ll take you
    through installing it, configuring it to connect to an account, and beyond.


    Let’s start by getting hold of it. Many distributions will have it installed by
    default – including Ubuntu, which we’re using here – but if you don’t have it
    head to your local friendly package manager and search for Thunderbird Mail. Install
    as usual (see p46 for more information on package managers) then run it from its
    icon.


    # Postmaster


    When you run Thunderbird for the first time, you’ll be given the option to sign
    up for a new free email address – we’re going to skip this particular step for
    this tutorial, so click Skip. Next, fill in your current email details. Your email
    address and password are the important parts here. The ‘Your name’ field doesn’t
    have to match the name you usually use for the account, but it’s useful to use
    your real name here so recipients know who’s emailing.


    Brilliantly, Thunderbird now queries a database of server information. If you’re
    using a recognised provider like gmail.com or outlook.com, it’ll automatically
    grab the correct incoming and outgoing server details so you don’t have to worry
    about it. More obscure providers may not be in the


    ![](img/420a7272a6efa239082a35eeadd9bc1d_55_0.png)


    Adding an account. If you’re with a recognised provider, could not be easier –
    just add your email address and password.'
