    colour separations, support for CMYK and spot colours, ICC profiles, and printer
    marks. Scribus also includes a variety of templates and styles and you also get
    an array of settings and tools to precisely define and position various layout
    elements you require.


    www.scribus.net


    # ## Cineclerra


    Cineclerra is excellent if you need to edit more than home videos, as it''s the
    most advanced non-linear video editor and compositor for Linux. It supports HiFi
    video and audio and is resolution and frame-rate independent, which enables it
    to edit videos of any size. The app has several advanced features, such as overlays,
    denoising, normalisation, time stretching, color balance, compositing, real time
    effects and a lot more. It also includes a compositing engine for performing tasks
    such as keying.


    www.cinelerra.org


    # ### Comix


    Digital comics are distributed as comic book archive files that mainly consist
    of a series of image files, typically PNG or JPEG files, stored as a single archive
    file. Comix can read digital comics in virtually every format.


    http://bit.ly/ComixApp


    # ### FontForge


    FontForge is a feature-rich app for creating and editing fonts and supports all
    common font formats. You can extract information from a font file as well as convert
    from one format to another, and can be used for previews.


    http://bit.ly/FontForge


    # ### CairoDock


    CairoDock is a Mac OS X dock-like app. One of its main advantages over other docks
