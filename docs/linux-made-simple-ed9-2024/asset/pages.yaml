    media player and also configure MPD as a source.

    www.icccast.org


    **Amarok** If you use KDE, your distro may already include this music player,
    Amarok. It too integrates with several online audio services, and its features
    include creating dynamic playlists, bookmarks, scripting, context view.

    https:// Amarok.kde.org


    **LMMS** LMMS is digital audio workstation that produces music by synthesising
    sounds, arranging samples, and playing them on a MIDI keyboard. It also has a
    song editor and plugins to simulate instruments and effects.

    www.lmms.io


    **Kodi** Until recently Kodi was known as XBMC. It’s an excellent option for users
    who wish to turn their PCs into media hubs. It plays most kinds of media files
    and works with TVs, IR and bluetooth remote controls.

    www.kodi.tv'
