  md: '# Devices | Drives


    # # Drives: Identify and locate


    Where are those files? We look into how you can identify, access and locate the
    hard drives attached to your PC.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_85_0.png)


    > If you regularly switch USB drives around, they won''t always be assigned the
    same identifier – so make sure you use the Disks utility to verify what''s been
    assigned to each drive before.


    If you''re migrating from Windows, you may find the way Linux handles drives and
    partitions is bit of a culture shock. For starters, there are no drive letters
    involved – instead, you''ll see lots of references to /dev/sda1, /dev/sdc and
    so on. It may look bewildering, but it doesn''t take long to realise the way Linux
    treats drives is just as logical as Windows – more so in some cases. Read on to
    discover how to demystify the jargon and understand exactly how drives work within
    the Linux file system.


    # ## Identify your drives


    Open the Disks utility from the Dash – use the annotation opposite to navigate
    it, making a note of how drives are referenced in Ubuntu. They appear to relate
    to a folder path beginning /dev/ – and that''s because they do just that. At the
    top (or root) of the Linux file system you''ll find the dev folder, which stands
    for devices. The dev folder houses special files that Linux uses to identify the
    different pieces of hardware in your system.


    Select each drive in turn in Disks and you''ll notice the obvious pattern: they
    all refer to files ''sdx'' with ''x'' a letter that''s unique to that drive –
    for example, /dev/sda. The ''sd'' part identifies the fact this is a supported
    storage device, and the final letter identifies which drive it is. Linux is reasonably
    consistent in how it registers each device: ''sda'' is always given to the drive
    on which Ubuntu is installed, for example. Then any other internal hard drives
    are registered before moving on to external drives, which include both hard drives
    and flash storage (more on the latter – as well as optical drives – over the page).


    ![](img/420a7272a6efa239082a35eeadd9bc1d_85_1.png)


    Drives aren''t always registered in the physical order in which they appear on
    your drive.


    # ## Partitioning


    So far, so good – each drive is easy enough to identify. But many drives contain
    partitions – select drive sda and you should see a minimum of two partitions are
    displayed in the bar chart that provides a graphical representation of the disk''s
    contents.


    Partitioning is the act of splitting a single hard disk into multiple partitions,
    referred to as ''volumes''. If you''ve come from Windows, you''re probably used
    to storing everything – programs, data and Windows itself – on a single volume,
    but in fact modern versions of Windows contain at least three partitions, with
    hidden recovery and boot partitions sitting at the beginning of the drive.


    Windows identifies volumes by assigning them drive letters. Linux adopts a different
    approach, identifying each volume using a combination of the drive identifier
    (sdx), plus a unique number, so ''sda1'' refers to the first partition on your
    first drive, while ''sdb3'' refers to the third partition on the second drive,
    and so on.


    On the surface this numbering makes perfect logical sense, but it doesn''t always
    look quite so straightforward. Drives are partitioned according to ''schemes'',
    and there are two principal schemes in operation: GPT (GUID Partition Table) and
    MBR (Master Boot Record) remains a popular choice among drives of all ages. The
    key difference between them is that the GPT scheme has no meaningful limit to
    the number of partitions you can create, while MBR drives support a maximum of
    four partitions per drive. A workaround exists for MBR drives whereby one of these
    partitions can be an ''extended'' partition, inside which you can bypass the four-drive
    limit by creating multiple ''logical'' volumes. GPT drives number drives according
    to the order in which they''ve been created or identified. This normally follows
    a logical pattern from left to right, but it''s not always the case (for example,
    if you manually create the swap file to sit at the end of your drive before setting
    up the main system partition). It has no effect on how Linux operates, but can
    be confusing. The MBR approach throws up its own mildly interesting anomaly when
    numbering volumes. Linux reserves ''sdx1'' to ''sdx4'' for physical partitions,
    with logical volumes'
