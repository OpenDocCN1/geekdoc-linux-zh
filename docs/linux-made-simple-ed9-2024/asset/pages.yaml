  md: '# VirtualBox: Virtualisation


    Find out how virtualisation software can tap into your PC’s unused processing
    power to help you run multiple operating systems.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_105_0.png)


    To give your VMs a speed boost, enable VT-x/AMD-V acceleration. First, visit http://bit.ly/1NfLQZ
    to see if your processor is supported. If it is, make sure support is enabled
    in your PC’s BIOS or UEFI - check your motherboard manual or website for instructions.


    T

    oday’s multi-core PCs are built to run multiple tasks simultaneously, and what
    better way to tap into all that power than through virtualisation? Virtualisation,
    and in particular hardware virtualisation, is the process of splitting a single
    physical PC (known as the ‘host’) into multiple virtual PCs (referred to as ‘guests’),
    each capable of working and acting independently of the other.


    Virtualisation software allows the host to carve up its memory, processor, storage
    and other hardware resources in order to share individual parcels with one or
    more guests. If your PC is powerful enough, you can run multiple virtual machines
    in parallel, enabling you to effectively split your computer in two to perform
    different tasks without having to tie up multiple PCs.


    Virtualisation isn’t simply a means of dividing up computing power, though. It
    also enables you to easily run alternative operating systems in a safe, sandboxed
    environment - your guest PC can be isolated ([*in theory - Ed*] ) from your host,
    making it safe to experiment with new software or simply try out a different flavour
    of Linux, for example. It can also be used for compatibility purposes - you may
    have switched from Windows, for instance, but want access to a virtual Windows
    machine to run old programs without having to use a dual-boot setup.


    It goes without saying that the faster and more powerful your PC, the better equipped
    it is to run one or more virtual machines. That said, if performance isn’t the
    be-all and end-all of your virtualisation experiments, then it’s perfectly possible
    to run a single virtual machine in even relatively low-powered environments.


    # Choose VirtualBox


    There are many virtualisation solutions available for Linux, but what better way
    to meet your needs (or even just dip your toes in the water) than with the open-source
    solution,


    VirtualBox? VirtualBox may be free, but it’s still a powerful option that offers
    both a friendly graphical front-end for creating, launching and managing your
    virtual machines, plus a raft of command-line tools for those who need them.


    An older version of VirtualBox is available through the Ubuntu Software Centre,
    but for the purposes of this tutorial we’re going to focus on the newer version
    5.x branch, which you can obtain from www.virtualbox.org/wiki/Linux_Downloads.
    You’ll find that a variety of different builds exist, each one geared towards
    a specific distro (or distro version). Both 32-bit (i386) and 64-bit (AMD64) links
    are provided to downloadable and clickable Deb files, or you can follow the instructions
    provided to add the appropriate VirtualBox repository to your sources list.


    Once it’s installed, the quickest way to get started is to launch VirtualBox through
    the Dash. This opens the Oracle VM VirtualBox Manager, which is where all your
    virtual machines can be listed (and organised into groups). It’s also where you
    create new VMs from scratch, but before you begin, select File > Preferences to
    change the default machine folder if you want to store your virtual machine settings
    somewhere other than your own home folder. This isn’t a critical step, but as
    each guest may consume gigabytes of space for its own needs, you may prefer to
    choose a dedicated drive (or drive with lots of free space). If you’re looking
    to purchase a drive for your virtual machines, then consider an SSD to add zip
    to your VM’s performance.


    # Create your first VM


    With your virtual machine folder set, click ‘OK’ and then click the ‘New’ button
    to create your first virtual machine. The Create Virtual Machine Wizard works
    in either of two ways, Guided or Expert, with the latter putting the three configuration
    steps in a single window. Start by selecting your chosen OS and version from the
    two drop-down menus - VirtualBox supports all the major OSes, including BSD, Solaris
    and IBM OS/2 in addition to Windows, OS X and - of course - Linux. The Version
    drop-down changes depending on your initial selection; all the major distros as
    well as Linux kernel versions from 2.2 onwards are available.


    It’s important to choose the right OS and version because this will ensure that
    other machine settings are set so they’re compatible. You’ll see this immediately
    when the ‘Memory size’ slider changes to match the OS. This will be set to a comfortable
    minimum setting, so feel free to alter it using the slider - it’s colour-coded
    green, amber and red to help you set the memory to a level that’s comfortable
    for your host PC. The figure you set is actual host RAM, not virtual memory, so


    ![](img/420a7272a6efa239082a35eeadd9bc1d_105_1.png)'
