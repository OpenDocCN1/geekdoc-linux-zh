    # Easy ways to run Linux


    If you’re not a big Linux user, then you’ll probably not want to destroy your
    existing Windows or Mac system, and we don’t blame you. The truth is, you don’t
    need to – Linux is flexible enough that it can be run in a number of ways: beside,
    on top of or alongside most other operating systems, and on most types of hardware
    – from virtual versions to versions running off spare USB drives, DVDs or on low-cost
    hardware such as the Raspberry Pi. The standard way, once you’ve got your hands
    on the ISO, is to burn it to a DVD. When you first turn on a PC, you can usually
    get it to boot from alternative media by pressing F11/F12, or hold down C on the
    Mac – some PCs boot from a suitable optical disc by default.


    Another option is to install VirtualBox from www.virtualbox.org (see previous
    page). Install and run this – it looks complex, but creating a virtual PC is pretty
    easy if you stick to the default settings. The main stumbling block is ensuring
    under Storage that you add the ISO file to the virtual optical drive. There are
    more options available, including writing the ISO file to a suitable USB thumb
    drive and, following a similar boot process as discussed above, running Linux
    from this. To get this to work, you need to use a write tool such as UNetbootin
    from http://unetbootin.github.io.


    For the brave-hearted, you can also install Linux on your system directly. Most
    versions of Linux create space alongside Windows and make a dual-boot system.


    could wish for. It’s not why we’re here but you can also download Valve’s Steam
    gaming client and take advantage of over 1,700 Linux games it has to offer.


    called the Terminal. This can be called a number of different things, depending
    on the system, such as the command line, command prompt or command-line interface.
    It is a direct interface to the operating system and all of its tools, which you
    access through text commands. Going back to the early days of computers and Linux,
    as computers were so much slower, there weren’t any graphical interfaces, so computers
    were controlled entirely through text commands.


    Linux was developed originally in this type of environment, so all of its core
    tools are based on Terminal use. Many of them – or all the ones you’ll care about
    – do have graphical interfaces these days. The fact is, the Terminal remains an
    efficient way of controlling Linux, and when it comes to troubleshooting, it offers
    a consistent set of tools and interfaces to resolve problems.


    You don’t need to know anything about the Terminal to use Linux on a day-to-day
    basis, but it’s good to know that it’s there just in case. However, we would advise
    you to at least open a Terminal and use the `ls` command to list a directory,
    and `cd` to change directory.


    # Drivers


    We’re not really here to talk about using Linux in every detail but there are
    a few standard questions that often crop up when people move over from Windows.
    One key one is where are all the drivers? The cool thing with Linux is that, on
    the whole, there’s no need to worry about drivers – they’re built into the Linux
    kernel. That isn’t to say you can’t add drivers, but they’re generally not required.
    There are a couple of exceptions: certain more obscure laptop wireless cards can
    cause issues, while if you want maximum 3D gaming performance, you need to install
    the dedicated graphics driver from your card’s manufacturer.


    # The Terminal


    If you’ve heard of Linux, then one area you might fear or just wonder about is
    a thing


    # Linux isn’t Windows


    One thing to keep in mind when you first use Linux is that it’s not Windows or
    Mac OS X. This largely means things you’re used to in Windows won’t work the same
    in Linux, or be in the same place, nor does it offer the same set of programs.
    So big commercial products such as Microsoft Office, Adobe Photoshop and development
    tools such as Microsoft Visual Studio aren’t directly made for Linux – you can
    run them via a system called Wine – but the Linux open-source community has created
    its own tools such as LibreOffice, Gimp, Krita and a whole range of freely available
    and open-source products that offer the same capabilities.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_11_1.png)


    # Mint on a USB drive


    ![](img/420a7272a6efa239082a35eeadd9bc1d_11_2.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_11_3.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_11_4.png)


    # 1 UNetbootin Linux


    To run Linux from a USB stick, you first need a USB drive at least 4GB in size
    – 16GB would be ideal. You’ll need the Mint ISO file from www.linuxmint.com, as
    discussed in the VirtualBox walkthrough, and we’ll use the download tool UNetbootin
    from http://unetbootin.github.io. This installs the live disc ISO file directly
    to your USB drive.


    # 2 Install Mint


    The tool can directly download the Mint ISO image for you, but it’s best practice
    to do this yourself, then use a local copy to hand if you want to create a DVD
    copy or redo the process. Select Diskimage and locate the file in the Download
    folder. Ensure you have the correct USB drive selected in the pull-down menu and
    click OK to create the drive.


    # 3 Boot and run


    You can now boot your PC from the USB drive. However, you need to ensure your
    PC selects the USB drive as the boot device. Usually, when you first turn on your
    PC, a message says to press F11 or F12 to select the boot device. Some PCs have
    their own specific button – consult your manual or manufacturer. Linux Mint will
    now run.'
