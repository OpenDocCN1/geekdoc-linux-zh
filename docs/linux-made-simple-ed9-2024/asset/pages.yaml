- pgno: 64
  md: '# All the Audacity


    # Playback controls


    Simple playback controls let you listen to the tracks you’re editing. Make sure
    you hit Stop before saving.


    # Track controls


    You can mute a track or change the stereo balance between left and right from
    here.


    # Mic in


    You can record directly from a microphone into Audacity – break the levels so
    you get good peaks.


    # Draw tool


    The pencil icon is the draw tool, with which you can make manual edits to the
    waveform.


    # Trim and silence


    These two wavy icons let you remove the rest of the track and leave your selection
    or vice versa.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_64_0.png)


    actually one long graph that moves rapidly above and below the line.


    Using Audacity is simple. Move the marker by clicking your mouse on the time code,
    and you can play back from that point, mark it for editing later or slice a sample
    at the mark.


    The main commands that you’ll use to start with are Trim and Cut. These two are
    basically the inverse of each other: you begin by selecting an area of the file
    by click and dragging to highlight (or shift dragging from the current market
    position), then you can remove that section of a track using Cut or isolate it
    and remove everything else using Trim. Remember if you’re working on multi-track
    audio trimming or cutting one track might leave it out of sync with others.


    The next most important part of is the Effects menu. Here’s where you’ll find
    a suite of industry standard filters


    you can apply to your sounds. Select and area or an entire track and you can amplify
    it, compress the dynamic range (so the quiet bits get louder and loud bits get
    quieter) or add echoses, speed up the tempo and more.


    There’s far too many filters to describe in detail, suffice to say that the majority
    are software versions of those that have been in use in recording studios for
    decades.


    Once you’ve trimmed your audio track, added your effects and edited in open and
    closing theme songs (assuming you’re working on a podcast), exporting it to something
    useful is simple. By default, Audacity will save an uncompressed WAV file as part
    of a project. Choose Export Audio from the File menu to save as an Ogg Vorbis,
    MP3 or any other more common format suitable for playback on any device later.


    # Quick tip


    If you want to try out Ardour or LMMS, head over to their respective websites,
    lmnms. io and ardour.org. There’s tons of documentation at both sites to help
    you get started on your professional mastering station.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_64_1.png)


    > Hugely powerful but also hugely complex, Ardour is a full recording studio on
    your laptop.'
  merge: -1
