  md: '![](img/420a7272a6efa239082a35eeadd9bc1d_23_0.png)




    # PICK A DISTRO


    If you''re diving in to the world of Linux, make sure you pick the right package
    for you: different distros make a difference...


    Y our favourite Linux distribution isn''t an individual unit in itself. On the
    inside, it is made up of various apps, libraries, modules and toolkits. On the
    outside, it''s part of a much larger and very vibrant ecosystem that sustains
    several other distros.


    Also part of this larger Linux ecosystem are very active user communities and
    various support infrastructures that help nourish the distros and other projects.
    Over the course of their lifetime, the different elements of the Linux ecosystem
    interact with each other as well as with their environment. They collaborate,
    exchange


    ideas and features, and sometimes swap resources for their mutual benefit as well
    as for the enhancement of the ecosystem. The Linux ecosystem fosters the development
    of innovative projects and


    products. However, since the environment can only sustain so many elements, the
    distros go through an evolutionary process of their own to weed out the weaklings
    and ensure the survival of


    > “The strong survive, thrive and pass on their genetic code to the next gen of
    derivative distros”


    the fittest. Through this process, the uninteresting, dull and unsustainable projects
    begin to perish. However, the strong ones survive, thrive and pass on their genetic
    code to the next generation of derivative distros.


    In this feature we will classify the popular distros as per their origins. We
    will analyse how they’ve evolved since their inception, and look at the unique
    traits they have passed on to


    derivatives that help distinguish them from their peers. We’ll also look at the
    best distro from each distro ‘genus’ and then pit them against each other to help
    you pick the distro that is right for you.'
