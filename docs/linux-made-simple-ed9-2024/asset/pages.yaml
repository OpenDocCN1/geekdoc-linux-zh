- pgno: 62
  md: '# Exploring the Rhythmbox interface


    **Album art**

    Rhythmbox will automatically pull album art from the net, but you might have to
    set up the plug-in first.


    **Library**

    From here you can select local libraries, UPNP shares, internet radio or podcasts.


    **Add a source**

    The plus and minus buttons let you add a source for your library. This can be
    a folder on your hard drive, a URL or a shared drive.


    **Play queue**

    This list tells you what''s up and coming on your playlist.


    **Artist list**

    On the left is the artist list, on the right their albums and in the main window
    a track listing.


    # Totem-ic


    While *Rhythmbox* is reasonably well featured, *Totem* – the video player – is
    less so. It''s fine for playing back videos selected directly from the file browser,
    but as a library manager it doesn''t really cut it. You can add videos one by
    one, but there''s no option to import a whole folder of videos or to automatically
    detect UPnP servers on your network.


    *Totem* does have one very useful feature though. If you open up it up by selecting
    Videos from the Unity launcher and click the Channels option at the top of the
    screen, you''ll get a selection of web videos including the latest movie trailers
    from Apple. You can add more from the Plugins menu.


    For videos, we''d recommend installing VLC. It has a reasonably good library manager,
    and is also more bulletproof when it comes to playing back odd file formats than
    *Totem*. Plus, it handles remote libraries over UPNP well.


    The best all-round media manager, though, is arguably *Banshee*. If you''re moving
    from Windows and want something that looks and feels like Media Player, this is
    certainly worth downloading and trying out. It handles music, video and UPnP better
    than the default apps, plus it can connect directly to the Amazon music store.


    One thing that Ubuntu is very good at, however, is controlling your music or video
    while the player app is in the background. Once a song is playing in *Rhythmbox*
    or *Banshee* (or even Spotify) just click on the volume icon in the task bar and
    you''ll get per-app volume controls and full playback tools without having to
    re-open the app itself.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_62_0.png)


    > A good alternative to Rhythmbox, Amarok includes a more colourful interface
    and more add-ons.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_62_1.png)


    # Quick tip


    *Rhythmbox* will automatically check for and download your favourite podcasts.
    Go to **Podcasts > Add** and you can search the iTunes and Mopodie libraries,
    or add your own via RSS.'
  merge: -1
