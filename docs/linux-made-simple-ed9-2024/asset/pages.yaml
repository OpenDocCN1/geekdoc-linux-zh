- pgno: 48
  md: '# Linux formatting


    Back in your document, duplicate your dummy text a few times (select it all with
    [Ctrl]+[H]+[A], copy it with [Ctrl]+[C], then paste it with [Ctrl]+[H]+[V]) to
    fill up the page. We''re going to style up the document now, using Writer''s default
    section styles. Click and drag your mouse to select the first sentence, click
    the drop-down box that currently says ''Default Style'' and change its style to
    Title. You''ll see that this applies a number of changes to the text at once:
    it centres it, changes its size to 28pt, and gives it a nice Bold sans-serif font.
    Select the rest of the text and give it the style ''Text body''.


    As you hover over styles in the list, you might notice a menu button to their
    right. Hover over ''Title'': hit that menu button then select Edit Style. In the
    pop-up that appears, tick the Autoadapt check-box. We''re now going to highlight
    the main benefit of using styles rather than changing fonts and sizes manually
    – you can edit the style once and your changes will be reflected throughout your
    document, meaning everything stays nice and consistent. Head to the font tab and
    change it to your liking, then hit Apply to see your changes reflected in your
    document. You can also use the tabs to set up perfectly formatted numbered lists,
    consistent highlights, drop caps and much more. For a slightly more visual way
    of doing this, manually tweak some text on the page until it looks just so, drag
    to highlight it, then hover over your intended style in the drop down box and
    select ''Update to match selection''.


    # Finishing touches


    Our newsletter needs a header, so go to Insert > Header and select Default Style.
    This pops a separate header section above our columns and automatically scales
    our separator line to fit. Click your mouse in the header area to move the cursor
    there and type whatever text you want to include. If you''d like to add an auto-incrementing
    page number, put your text cursor where you''d like it to be and go to Insert
    > Fields > Page Number.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_48_0.png)


    Use the AutoText function to populate documents as you''re designing them, even
    if you''ve got nothing written yet.


    The header will appear on each page of our document, so we will need to use a
    slightly different tactic if we want to add a masthead to the first leaf – a frame.
    Click Insert > Frame to create one, and bear in mind that we''re looking for ''frame''
    as opposed to ''floating frame'' in this case, as the latter will sit on top of
    your text, whereas the former will push the page text out of the way. Stick with
    the defaults and you''ll see a small frame appear on the page. Now move it into
    place by hovering your mouse over its edge until the cursor turns into a fist
    and dragging it where you want it, and resize it by dragging the green anchor
    points around its edge until it''s the perfect size. You can click inside and
    type as usual.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_48_1.png)


    The rest, as they say, is up to you. Try using the image button to add pictures
    (make a frame first for ultimate control), and using the various paragraph tools
    to further style up your text. And don''t forget to hit [F1] to see LibreOffice''s
    comprehensive help guide.


    # Getting around Writer


    # Style tips


    Text styles, accessible through this menu, are vital if you want to create consistent
    documents without a lot of fiddly work.


    # Look sharp


    Bold text, underlining and strikethrough probably don''t warrant a text style
    of their own, so just highlight the text to change and hit these buttons to alter
    them.


    # Frame up


    Text frames can help you place items (including images) that would otherwise get
    pushed around by page margins or columns.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_48_2.png)


    # How are you doing?


    This quick counter keeps track of the number of words and characters you''ve written
    – if you''re writing to a limit, it''s essential.


    # Quite correct


    Spelling and grammar errors are highlighted by a jagged underline, just as they
    are in Microsoft Word. Hit [F7] for a more thorough spellcheck, or [Shift]+[F7]
    to turn this feature off.


    # Extra menus


    If you''re adding bullet points or numbered lists, don''t forget to choose your
    exact options by clicking the drop down list.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# # Calc: Super

    ## spreadsheets


    We''ve worked with words, now it''s time to keep your numbers in check using Linux''s
    premier spreadsheet, LibreOffice Calc.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_49_0.png)


    +   - If something goes wrong, you may be presented with an unintelligible error
    code. Highlight it and look at the bottom right of the Calc window to see what
    it means.


    Here would we be without spreadsheets? Either considerably poorer or considerably
    richer, most likely. Whichever is true, there comes a time when we all need to
    put numbers in a grid. You''re probably familiar with Microsoft’s Excel, which
    rules the spreadsheet root over on Windows. On Linux there are, as ever, plenty
    of options, but we lean towards the well-honed spreadsheeting machine that is
    *LibreOffice Calc*. It should come preinstalled with your Linux distribution,
    but if it''s nowhere to be found you''ll need to install it – as part of the main
    *LibreOffice* package – from your distribution''s package manager. In the case
    of Ubuntu 15.10, you''d use *Ubuntu Software Centre*. We''re looking at *LibreOffice
    5* for this tutorial, but if you have an earlier version you''ll be fine to follow
    along.


    As with *LibreOffice Writer*, running *Calc* for the first time should bring up
    a reasonably familiar environment. There''s a standard grid of cells, menu bars
    at the top of the screen, below them the input line, and an area below the sheet
    where different pages can, once they''re created, be accessed.


    Realistically the way you use it is no different than you might have previously
    used *Excel*. Even the syntax is the same. But if you''re unfamiliar, or if you
    need a refresher, let''s create a sample spreadsheet to see what we can do with
    *Calc*.


    # ### Numerous numbers


    Let''s start with a little housekeeping. Usually the leftmost and topmost cells
    – row 1 and column A – are used as labels to signify the contents of the cells
    they''re next to. Fill in a bunch of sample labels – it doesn''t matter what you
    type, we''re merely playing with some of the features – by clicking in each of
    these edge cells and typing. You can use the arrow keys to navigate between them,
    which makes the process a bit quicker. You can also hover your mouse cursor over
    the bold dot in the corner of a cell and drag it to automatically copy the contents
    of that cell to those that you highlight. Fill in labels from A2 to A20 and from
    B1 to L1, leaving cell A1 empty – it''s useless when we''re laying out a spreadsheet
    like this.


    Larger spreadsheets than ours may have content which goes further than your screen
    can easily display, so it''s good practice to isolate the label columns in their
    own pane. On the right of the screen, just above the scrollbar, you''ll see a
    small horizontal line – drag it downwards to until the top pane shows just the
    labels, and do the same for the small vertical line to the right of the bottom
    scrollbar. Hover your mouse over the icons on the right hand side of the top row
    of toolbars until you find the one labelled ''Freeze panes''. Click it, and your
    labels will be neatly locked in place.


    Now it''s time to fill in some data! But let''s use one of *Calc*''s features
    to generate our own random data to play with, rather than using anything useful.
    Click and drag over cells B2 to L20 to select them, then head to Edit > Fill >
    Random Number. You''ll see your chosen cell range has been automatically inserted
    in the topmost box. We now need to choose what kind of random number to generate,
    and its range. By default it''ll be a floating point number, although you can
    change the distribution to *Uniform Normal* if you want to make a whole number.
    We''ll stick with *Standard Uniform* for now, as it will allow us to demonstrate
    a further function later on. Leave the *minimum* at 0.000 and change the *maximum*
    to 9.0000. Click ''Apply'' and you''ll have a nicely filled in spreadsheet.


    # ### Function room


    Time to crunch those numbers a bit. The most basic spreadsheet function is a sum,
    which performs basic arithmetic on a group of cells. Let''s start by adding the
    first column of numbers together. Click below it in cell B2, type


    ![](img/420a7272a6efa239082a35eeadd9bc1d_49_1.png)


    You can format the numbers in your cells any way you like without affecting the
    original values. Try representing floating point numbers as fractions!'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# # Cracking the Calc code


    ![](img/420a7272a6efa239082a35eeadd9bc1d_50_0.png)


    # ## Colour up


    Calc features standard the standard formatting tools you’d expect, so you can
    change fonts, sizes, colours and more.


    # ## Cell mate


    The currently selected cell is always shown here – bear in mind that you can use
    the arrow keys to navigate between cells rather than clicking.


    # ## What a pane


    Locking your panes like this gives a clean look and means your labels will always
    stay in place no matter where you are in the document.


    # ## Line up


    You can type directly into cells, but it’s often useful to use the input line,
    which always reflects the content of the cell.


    # ## Extended play


    If all of the icons on your toolbar don’t fit on the screen, click the small arrow
    double icon on the right to display an expanded menu like this one.


    =SUM( then click and drag your mouse over the numbers in the column above. Pointers
    to the first and last cells will be added, with a colon between to indicate a
    cell range. Close the brackets with a ) then hit [Enter] to see the total of all
    the numbers in that column.


    Let’s try some different functions. In the next cell to the right, we’ll use SUMIF
    to add together all the numbers over 5. Type =SUMIF(C2:C80,“>5”) – the semicolon
    divides the cell range with the criteria for the sum, and remember to include
    quote marks around your criteria. In the next cell along, let’s take an extra
    course. Typing =SUMIF(D2:D20,“>6”,C2:C20) adds an extra clause: it’ll add together
    only the numbers in column D which lie next to numbers in column C which are greater
    than 5.


    You can duplicate formulas (and automatically move their range of cells) in the
    same way that we earlier duplicated labels, by selecting their cell and dragging
    its bottom right corner. But for now, try replacing SUM and SUMIF with the following
    in subsequent columns: AVERAGE, MAX, PRODUCT, STDEV. And why not try creating
    functions using the totals we’ve already generated? The output of a function is
    just a value after all.


    # ## Simple science


    Presentation is everything if you’re handing off a spreadsheet to someone and
    you actually want them to understand it, so let’s do a little sprucing up. We’ve
    filled our spreadsheet with a lot of long numbers, but there’s a way of rounding
    them without losing the original granularity of the data. To prove it, select
    your original range of data (B2 to L20) and go to Format > Cells. Select ‘Number’
    in the category box, and change the Number of decimal places to ‘0’ and hit OK.
    You’ll see everything reduced to whole numbers visually, but the formula line
    below won’t change to match because it’s still


    working on the actual values stored within the cells. Clicking each cell will
    display its actual contents (rather than its formatted contents) in the input
    line at the top of the Calc window. You can also use cell formatting to turn numbers
    into currency values, force them to be text values (which can’t be worked on with
    formulas) and apply fonts and borders.


    A quick thing you should know before we sign off: you can create a new sheet within
    the same document by clicking the plus sign at the bottom left of the Calc window,
    and within it you can refer to cells from the first sheet by using the syntax
    ‘<sheet name>.<cell>’. So to sum the first column of the first sheet in a cell
    on the second, you’d use =SUM(Sheet1.B2:Sheet1.B20) – and you can, of course,
    use this technique to work with, and apply formulas to, numbers stored on multiple
    sheets.


    # ## Quick tip


    Calc can, like Writer, save documents in a format compatible with Microsoft products.
    We’d recommend you choose .xls for maximum compatibility.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_50_1.png)


    Random numbers can be inserted into cells, but you’ll need to understand how,
    for example, Bernoulli numbers work to get them to work.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# PDFs: Edit and annotate


    Portable they may be, but accessible? Not without a little hard work and determination.


    **Quick tip**


    LiveOffice Draw is capable of editing PDFs, but it''s not always tip top when
    it comes to saving them out. It''s worth trying, if you have complex tasks to
    perform.


    We’ve all seen PDFs, haven’t we? They’re neat little document packages which contain
    all the fonts and layout information required to display exactly what the creator
    intended, without requiring any of the software that was used to make them. They’re
    also, usually, incredibly small. Hence the name Portable Document Format: universally
    supported on just about any system, almost always displayed correctly, and – at
    least these days – outputtable to PDF just about any creative software.


    But there’s a problem: PDFs tend to be one-way streets, documents designed to
    exist in a read-only state. Editing a PDF is not an easy task. But, as we’ll discover,
    there are ways around these restrictions: ways to get information out of PDFs,
    ways to tweak existing documents, and ways to create brand new PDFs from that
    source material.


    # Money matters


    First, let’s talk about the commercial options available to Linux users. There
    are two primary PDF editors on the market, PDF Studio and Master PDF Editor. The
    former comes in two flavours: Standard ($89), which can convert most documents
    to PDF, add annotations and comments to PDF documents, and split, merge or password
    protect your PDFs. For proper editing facilities you’ll have to plump for the
    Pro version ($129) which also adds batch processing facilities


    ![](img/420a7272a6efa239082a35eeadd9bc1d_51_0.png)


    Gscan2pdf, using the Tesseract OCR engine, does a pretty decent job of extracting
    text from images but struggles with more complex fonts.


    and optical character recognition to extract text from images. There are free
    trials available of both versions at qoppa.com. Slightly easier on the wallet
    at $36 is Master PDF Editor which, as its name implies, is pretty masterful at
    the task of editing PDF files, and also exporting them to various image formats,
    splitting and merging, document signing and much more. The reduced price, as far
    as we can tell, doesn’t mean a great loss of functionality. There’s a free evaluation
    version to download at code-industry.net so you can see if you like it before
    plunking down the cash.


    There are other ways to perform the main functions of proper PDF editors without
    shelling out a penny, but they’re all limited in their own way. So let’s look
    at a few of the tasks you might want to perform, and how to get them done.


    # Optical Character Recognition


    OCR, as it’s less tongue-twistingly known, is the process of getting words out
    of pictures. So if someone’s sent you a PDF of a scanned document, that’s exactly
    what you’re dealing with: a picture, just one in a nice package. In order to turn
    these printed characters back into editable text, your computer needs to, in base
    terms, trace over a bunch of pixels to work out what letters they might represent,
    then output that text.


    We’d recommend a package called gscan2pdf for this task. It’s primarily meant
    for turning images into PDFs – hey, another task ticked off the list – but it
    also has an OCR export feature built in. Install it from your package manager,
    run it, and hit [Ctrl+H] to import your PDF. If it’s slightly off-kilter, you’ll
    first want to use Tools > Clean Up to automatically adjust the text to be on a
    straight line, otherwise the OCR engine might get a bit confused. Make sure you
    only have a single edge checkbox selected, otherwise the deskew function won’t
    work well. Click OK and your image should be adjusted.


    Now let us run the actual OCR process. Go to Tools > OCR, and you’ll see Tesseract
    listed as the OCR engine. This is also available on the command line, and it’s
    a highly powerful tool, but rather difficult to run without some help – which
    is just what gscan2pdf is offering us. Check ''Threshold before OCR'', and click
    ''Start OCR.'' Click out Output tab, and you’ll see the results. Trickier fonts
    might not read perfectly, so you can click problem words to correct them here
    if you spot any issues. Hit [Ctrl+S] to save, and open up your PDF in the viewer
    of your choice – you can now select the text with your mouse and copy and paste
    to your heart’s desire.'
  merge: -1
  img_proc: true
- pgno: 52
  md: "# Image editing\n\nIf you're pulling images out of PDFs, or you want to change\
    \ their design, there's really only one sensible free choice in the the Linux\
    \ domain: GIMP. That's not to say it's the only choice – there are plenty of image\
    \ editors that can read PDFs – but GIMP is at the top of the heap. You likely\
    \ already have it installed – it's in your package manager if not. Getting editing\
    \ is just a case of opening the PDF using GIMP's Open command ([Ctrl]+[O]) and\
    \ importing it as an image. You're then free to use GIMP's photo editing tools\
    \ to manipulate it as if it were any other picture.\n\nWhen you're finished, you'll\
    \ need to use File > Export to save it out again as a PDF. This does have its\
    \ downsides, though: GIMP's standard import procedure flattens the PDF out, so\
    \ you'll lose any text layers you might have previously had.\n\n# Annotation\n\
    \nWhen you need to take notes on a PDF, you could do a lot worse than using Xournal.\
    \ Ostensibly a note-taking application, it's actually the perfect alternative\
    \ to printing out your PDF, scribbling on it with a Sharphie, then scanning it\
    \ back in again – with a couple of other key benefits.\n\nStart by downloading\
    \ Xournal from your distro's package manager, then run it. Go to File > Annotate\
    \ PDF, open your PDF, and start scribbling away with the left mouse button. If\
    \ it doesn't work – we've had this issue on some machines – try toggling Options\
    \ > Use Xinput to off.\n\nXournal offers a few handy tools. The pen, the default\
    \ tool, lets you draw – or scrawl – pen marks on top of your document. The eraser,\
    \ which you can automatically switch to and use by holding the right mouse button,\
    \ scrubs out marks you've previously made. The highlighter is pretty useful, in\
    \ that it works like a regular highlighter pen, smearing a bright colour while\
    \ letting the text below shine through. When you're using it, try clicking the\
    \ checkered colour box on the right hand side of the toolbar to alter its colour,\
    \ and drag the opacity slider to select how bold you want this effect to be.\n\
    \nNext up is the text tool: just click anywhere on the document and type in your\
    \ text notes. You can tweak the font with the rightmost element of the toolbar,\
    \ and change any text you've already written by double clicking it with the text\
    \ tool selected. You can insert images as notes with the next icon, toggle the\
    \ following icon to automatically turn your crude scrawls into geometric shapes,\
    \ and force straight line drawing by activating the ruler icon.\n\nWhen you're\
    \ finished, just head to File > Export To PDF and save your work as a new PDF\
    \ file. Again, you'll lose any additional layers (like raw text, which will be\
    \ tricky to OCR with your scribbles on top), but you can pass on your annotated\
    \ PDF to colleagues, victims, or even friends.\n\n![](img/420a7272a6efa239082a35eeadd9bc1d_52_0.png)\n\
    \n![](img/420a7272a6efa239082a35eeadd9bc1d_52_1.png)\n\n> **Quick tip**\n> You\
    \ can convert many common formats to PDF using free online tools: we recommend\
    \ trying cloudconvert.com first of all.\n\n# Inside Xournal\n\n+   * **Zoom zoom**\n\
    +     The magnifying glass is the only easy way to control your zoom level, particularly\
    \ useful on high-resolution PDF files.\n+   \n+   * **Drawing tools**\n+     Define\
    \ your scribbles: will you use a pen? A highlighter? Infinitely neater text boxes?\
    \ Pick your tools here and get annotating.\n+   \n+   * **Move it around**\n+\
    \     The selection tools let you grab your scrawled notes and shift them around\
    \ without affecting the background layer. Note that you'll need to.\n+   \n+ \
    \  * **Size it up**\n+     Xournal offers only a limited selection of tool sizes,\
    \ so on high-res PDFs your notes may be a little small unless you use the biggest.\n\
    +   \n+   * **Colour theory**\n+     There are hotro's pre-defined and bold colours,\
    \ perfect for highlighting, but click the rightmost icon to select an original\
    \ colour of your own.\n+   \n+   * **Face time**\n+     Use this button to select\
    \ your text typeface – it won't affect notes you've already written, though.\n\
    \n![](img/420a7272a6efa239082a35eeadd9bc1d_52_2.png)"
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Pidgin: Instant messaging


    Connect with your friends in a network-neutral way and stay chatting to your heart’s
    content.


    +   **Quick tip**

    +   By default Pidgin collects all of your chats as tabs in a single window. Just
    drag one of the tabs away to give it a window of its own.


    I nstant messaging has made a huge cultural impact over the past decade, but it’s
    far from a modern concept. We can actually trace direct digital messaging back
    to the 1960s when multi-user systems at MIT contained their own internal messaging
    systems. The first multi-user online client, as far as we can work out, was issued
    by CompuServe in 1980. Quantity (and very much reflecting its place in time) they
    called it CB Simulator – and if you’ve ever used a CB radio, we’re sure you can
    grasp the chaos and infiquity that ensued.


    More recently, ICQ (released in 1996) really brought the concept of one-to-one
    or multi-user instant messaging to the attention of the public at a time when
    the internet was exploding in popularity, and it was been followed by a host of
    other IM clients: AIM, Yahoo Messenger, MSN/Windows Live Messenger and so on.


    Today instant messaging is almost ubiquitous and everywhere. There’s likely an
    IM client in your email, one on your Facebook account, and one on your phone in
    the form of Google Hangouts, Skype or Apple’s iMessage. There are a host more
    services running online. The problem is, they’re almost universally incompatible
    with each other.


    If you’re going to get connected with everyone, either you’re going to have to
    be very convincing or you’re going to have to support a whole host of different
    platforms. Good job we’ve got a solution, right?


    # Talk is sweet


    First things first: a bit of bad news. Apple’s iMessage is, sadly, out of reach
    on Linux unless you interface with a jailbroken Apple device using some rather
    roundabout methods. This is one of the cases where being convinced about changing
    IM systems comes in very handy.


    The good news is that you can connect to just about every other major platform
    online, without needing to install a specific client. Facebook Messenger is on
    facebook.com, Google Hangouts can be accessed through Gmail or through Google+.
    Skype has its own web client, and so on. The fact that you’re using Linux doesn’t
    make this any different.


    Of course, that’s all a bit of a pain. Should you really have to keep a whole
    host of browser windows open on the off-chance that one of your chums messages
    you on that obscure service you signed up for a long time ago and never use but
    which they insist on maintaining for no good reason? No. You should not.


    You can also get various instant messaging clients on Linux. A number of these
    are official releases. Skype, for example, has a well-seasoned Linux client despite
    being owned by Microsoft (the client existed before the MS purchase and has been
    updated since). Google offers an extension for Google Chrome that makes Hangouts
    work seamlessly, with desktop popup notifications, without forcing you to keep
    a particular browser window open.


    There are also unofficial clients, and a stack of them, that purport to support
    various instant messaging protocols and generally do a reasonable job. Let’s run
    down a few of the options! For Google Hangouts, install YaxKak from your package
    manager. For WhatsApp, there’s a client (about a year old) at https://github.com/Aliuxan/WhatsApp-Desktop/releases
    which may or may not do the trick – download the appropriate .deb file for your
    system (32-bit or 64-bit) and install it through your package manager. For Facebook,
    use the deeply-very-unaffiliated Messenger for Desktop at www.messengerfordesktop.com,
    from the same developer as the WhatsApp client.


    # Good words


    As you’ve probably realised by now, we’re not fans of all these individual platforms
    cluttering up our methods of communication. Think about your mobile phone – where
    would you be if all of the different mobile operators didn’t allow communication
    between each other? You’d probably be at the phone shop demanding a handset which
    supported all


    ![](img/420a7272a6efa239082a35eeadd9bc1d_53_0.png)


    > The core list of IM clients supported by Pidgin is long, but it can be expanded
    to support just about any platform.'
