  md: '# Headless setup


    One way to maximise your host PC’s resources is to run your virtual machine headless.
    This means there’s no way of interacting with that VM on the host PC; instead,
    you access it remotely using the Remote Display Protocol (RDP). First, make sure
    you have the VirtualBox Extension Pack installed — this provides support for VirtualBox’s
    implementation of RDP — then enable it on your VM via Settings > Display > Remote
    Display tab by ticking ''Enable Server''. You’ll need to change the default port
    (3389) if you’re setting up multiple VMs in this way — choose unique ports for
    each between 5000 and 5050.


    Once it’s configured, you can launch your VM from the Terminal via one of two
    commands: `VBoxManage startvm ''<uuid|vmname>''`


    Alternatively, hold Shift as you click the VM in the VirtualBox Manager, and you’ll
    be able to monitor its progress from the Preview window before switching to your
    remote computer.


    When it comes to accessing your headless VM from another PC, the rdesktop client
    is built into most distros, but VirtualBox also ships with `rdesktop-vrdp`, which
    gives your guest access to any USB devices plugged into the PC you’re sat at.
    Use the following command:


    ```

    ```rdesktop-vrdp -u sb -a 16 -N 192.168.x.y:0000```

    ```


    Replace `x.y` with your host PC’s IP address, and **0000** with the port number
    you allocated (**3389** by default).


    ![](img/420a7272a6efa239082a35eeadd9bc1d_106_0.png)


    > **Run your VM headless to cut resource usage if you plan to access it remotely.**


    be sure to leave enough for your PC’s other tasks (including the running of VirtualBox
    itself).


    The final option is to create a virtual hard disk. This basically starts out as
    a single file that represents your guest’s hard drive, and will splinter off only
    when you start working with snapshots. In most cases, leave ''Create a virtual
    hard disk now'' selected and click ''Create'', at which point you’ll need to set
    its size, location (click the little folder button to choose a different location
    from the default), file type and how the virtual file will behave. For these latter
    options, the defaults of ''VDI'' and ''Dynamically allocated'' usually work best;
    the latter ensures that the physical file containing your virtual hard drive’s
    contents starts small and grows only as it’s filled with data. Click ''Create''
    and your virtual machine is ready and waiting for action.


    # Virtual hardware tweaking


    It’s tempting to dive straight in and start using your new virtual machine, but
    while the basic hardware settings are in place, you should take the time to ensure
    it has all the power and resources it needs to function as you want it to. You
    can always tweak these settings later, but the best time to set it up is before
    you begin.


    Select your new virtual machine and click the ''Settings'' button. Switch to the
    System tab, where you’ll find three tabs: Motherboard, Processor and Acceleration.
    You can tweak your VM’s base memory from the Motherboard tab, as well as switch
    chipset, although unless you need PCI Express support the default PIIX3 should
    be fine in most cases.


    The Pointing Device is set to ''USB Tablet'' by default, but there’s a ''PS/2
    Mouse'' option for legacy purposes.


    The Extended Features section should already be set up according to the OS you’ve
    chosen, but if you’d like your virtual machine to have a UEFI rather than a BIOS,
    tick ''Enable EFI'' here. Note, however, that this works only for Linux and OS
    X; Windows guests aren’t (yet) supported.


    If you have a multi-core CPU installed, switch to the Processor tab to allocate
    more than a single core to your VM, making sure you don’t attempt to allocate
    more cores than your processor physically possesses (Hyperthreading should be
    discounted). You may also need to tick ''Enable PAE/NX'' if your virtual machine
    needs access to more than 4GB of RAM on a host PC with an older 32-bit processor.


    The Acceleration tab allows you to tap into the processor’s virtualisation features
    if they exist — see the tip for details.


    # Other key settings


    Switch to the Display tab to configure your virtual graphics card. Start by allocating
    as much memory as you think you’ll need, and also tick the ''Enable 3D Acceleration''
    box to improve performance across all your VMs. If you’re running a Windows virtual
    machine, then tick the 2D option too. Switch to the Remote Display tab if you’d
    like to access your VM remotely. The Video Capture tab makes it possible to record
    your VM screen as a video should you want to do so — the former feature requires
    the VirtualBox Extension Pack, which we’ll talk about shortly.


    The Storage tab is where you can configure the internal storage of your virtual
    PC — by default your virtual hard drive is added to the SATA controller, from
    where you can add more drives. You’ll also see that a single DVD drive is also
    added to the IDE controller. Select it and click the little disc button next to
    the Optical Drop-drop-down to select a physical drive or mount an ISO drive image
    as a virtual drive instead. Tick the ''Passthrough'' option if you’d like to be
    able to write discs, play audio CDs or watch encrypted DVDs.


    The options in the Audio and Serial Ports tabs are largely self-explanatory, but
    if you plan to the other the guest VM visible


    # Quick tip


    Make use of the VirtualBox Manager’s new Group feature to organise your VMs into
    user-defined categories; right-click the first VM in the list and choose Groups.
    Right-click the group header and choose ''Rename'', then create new machines directly
    from this new group or drag other guests into it to assign them to the group.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_106_1.png)


    > **The ability to take snapshots of your virtual machines makes them particularly
    suitable as test beds.**'
