- pgno: 22
  md: "# Install Windows apps\n\nIf all else fails, use Wine to run Windows programs\
    \ in Linux.\n\nThe best way to run applications in your new Linux Mint install\
    \ is natively, but if there’s a specific Windows program you can’t do without\
    \ then it may be possible to get it running. What you’ll need is a special program\
    \ called Wine, which uses some clever trickery to use parts of Windows, enabling\
    \ you to run many Windows programs as if they were native Linux ones.\n\nWine\
    \ can be a tricky tool to master, but thanks to the free PlayOnLinux tool, you\
    \ can get many popular applications up and running with the minimum of fuss. Open\
    \ the *Software Manager*, then search for “PlayOnLinux”. Click ‘Install’ and it’ll\
    \ automatically download and install Wine.\n\nOnce installed, launch PlayOnLinux\
    \ and allow it walk you through the first-use wizard. You’ll be left with a blank\
    \ window, so click the ‘Install’ button to get started. The Install menu allows\
    \ you to search for programs or browse by category, with options including Games,\
    \ Graphics and Office. Once you’ve found a program you want to install, select\
    \ it and click the ‘Install’ button. You may need to supply the program’s installation\
    \ disc, while commercial applications will require a licence and – if applicable\
    \ – activation. Just follow the wizard through – PlayOnLinux simplifies the process\
    \ of installing any supported applications because it knows which additional components\
    \ need downloading and how to configure them. PlayOnLinux’s supported applications\
    \ database is relatively small – aside from Microsoft Office, notable examples\
    \ include Spotify, QuickTime Player and Adobe Photoshop (CS4 or CS6 only). That’s\
    \ because it primarily focuses on games. If you find the application you want\
    \ isn’t listed, don’t worry – Wine supports more programs than those listed by\
    \ PlayOnLinux, but the install process is more complicated. Start by checking\
    \ https://appdb.winehq.org to see if the application is supported. If it’s present,\
    \ you’ll see a list of tested versions, complete with rating ranging from Platinum\
    \ all the way down to Garbage. Anything rated Bronze or better is likely to work\
    \ in Wine, although you may find some glitches occur. Once done, follow the step-by-step\
    \ guide (see below) to attempt installation through PlayOnLinux’s manual option.\
    \ If you run into problems, consult the web pages for more advice, or try experimenting\
    \ with different settings, but hopefully it’ll end up with an application that\
    \ does at least perform most key functions without problems.\n\n# Application\
    \ configuration\n\nEach program exists inside its own virtual space, which you\
    \ can tweak by selecting it on the main PlayOnLinux screen and clicking ‘Configure’.\
    \ Most advanced configuration options are found under the Wine tab – click ‘Configure\
    \ Wine’ to access a multi-tabbed dialogue box with lots of additional tweaks.\n\
    \nWine should automatically map your home folders to their equivalent locations\
    \ in the virtual drive, but make other locations more easily accessible from the\
    \ Drive tab. Click ‘Add’, select a drive letter and then browse to the directory.\
    \ Look under the /media folder for separate drives. Once selected, it’ll now be\
    \ accessible within the program via the drive letter you allocated to it.\n\n\
    If there’s no mention of it at in the WineHQ database, don’t assume it won’t work:\
    \ you can’t harm Wine, so feel free to try, using the program’s website to determine\
    \ what additional components (such as the .NET Framework) you might need. All\
    \ of this should get you off to a solid and happy start to using Linux. Keep exploring\
    \ and have fun!\n\n# Manually install an app using PlayOnLinux\n\n+   1. **Take\
    \ notes**\n+   Go to https://appdb.winehq.org, find the program you wish to install\
    \ and verify the version you’re installing is compatible (if it’s not listed,\
    \ but earlier versions are compatible – experiment!). Also make a note of any\
    \ comments about additional installation requirements, such as gdiplus.dll. Now\
    \ visit the program’s website and download the program installer if you don’t\
    \ have an installation disc.\n+   \n+   2. **Set up virtual drive**\n+   Open\
    \ PlayOnLinux, select Install and then click ‘Install a non-listed program’. Click\
    \ ‘Next’, select ‘Install a program in a new virtual drive’ and click ‘Next’ again.\
    \ Name the drive after your program, click ‘Next’ and then tick the relevant options\
    \ – in most cases just ‘Install some libraries’ before clicking ‘Next’. Leave\
    \ the 32-bits option selected for compatibility reasons and click ‘Next’ again\
    \ to proceed with the next section.\n+   \n+   3. **Add libraries and install**\n\
    +   Install any recommended packages when prompted. Once done, place a tick next\
    \ to each required component (typically under POL install) and click ‘Next’, then\
    \ wait for them to download and install. Next, either select your CD drive or\
    \ choose ‘Select another file’ to locate and run the installation program. Follow\
    \ the setup wizard through, then launch the program to verify it works before\
    \ adding shortcuts to finish."
