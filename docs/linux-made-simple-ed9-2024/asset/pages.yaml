  md: '# **GET STARTED**

    # **WITH LINUX**


    It runs on most desktop and laptop PCs, it’s free and you don’t even need to install
    it. Let’s look at Linux!


    ![](img/420a7272a6efa239082a35eeadd9bc1d_9_0.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_9_1.png)


    **A**s you read through this *Linux Made Simple* bookazine, you’ll notice that
    most of the screens don’t look like Microsoft Windows or Apple mac OS. There’s
    a good reason for that: they’re not. Just as there are different car manufacturers
    or makes of TV, there’s more than one operating system that can run your PC or
    Mac. It’s just that Linux happens to be **free** because it’s developed by thousands
    of coders around the world. All the coding projects in this bookazine are based
    on someone running Linux on their desktop. You don’t have to – the code works
    on Windows or mac OS – but Linux comes with many languages built in or ready to
    install from a central server. No scouring round dodgy sites; just run a command
    or fire up a software centre to get what you need.


    That’s the beauty of Linux – it’s built by geeks for geeks to do geeky things.
    Once you’re used to its slightly different interface and way of working, you’ll
    find how easy it really is to get along with. We recommend that you use a version
    (known as a distro) called **Linux Mint**, and we’re going to look at the ways
    how to run Mint within VirtualBox on top of Windows (or mac OS), while the next
    walkthrough shows you how to create a live image that you can boot and run from
    either a DVD or a USB flash drive.


    > “It’s not scary, it won’t damage your PC and you don’t even have to install
    anything.”'
