- pgno: 83
  md: '# Devices | Printers & scanners


    Some printers ship with their own utilities, which may provide you with more control
    over its settings.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_83_0.png)


    ![](img/420a7272a6efa239082a35eeadd9bc1d_83_1.png)


    If you’ve set up a network-connected printer, you should also be able to access
    machine-level settings directly – type in its IP address. If you don’t know its
    IP address, it’s under the printer’s Settings – click ''Change'' next to ''Device
    URI'' and expand Network Printer. The IP address will be listed in brackets after
    your printer name. Enter the URL address and you’ll access the printer itself,
    giving you even greater scope over how it functions (eg setting up duplex options
    for double-sided printing).


    # Printer classes


    CUPS allows you to group multiple printers into classes. This is mainly aimed
    at networks where lots of users want to share a limited number of printers. Each
    class has a hierarchy with those printers added first being preferred to those
    added later. When people come to print using a class, they’re allocated a printer
    based on availability, so if one person is printing they’ll always get access
    to the first printer, while if two are printing at the same time, the first person
    gets the preferred printer and the second gets the next available one.


    With this in mind, it pays to work out how you want your printers classed: do
    you want faster ones made available first, or are you looking to steer people
    towards a high-volume printer such as a laser? Once done, open System Settings
    > Printers and click the ‘+’ button next to Add and select ''Classes''.


    You’ll be prompted to provide a name, description and location in terms of a single
    printer, but it’s better to think in terms of the class, eg, ''study-printers’
    or something similar. Once done, click ''Forward'' and you’ll be prompted to add
    existing printers to the class – remember to add them in order of preference.
    Once done, click ''Apply''. Once created, you can set this class as your default
    in place of a single printer – just right-click its entry and choose ''Set As
    Default''.


    Unix also offers good built-in tools to help you access and make use of your scanner.
    In many cases – particularly with newer models – you can simply plug it in and
    there’s a good chance it’ll work. That’s due in part to built-in support for SANE
    (Scanner Access Now Easy), which provides all the back-ends to scanning in Linux.


    To see if you’re lucky, plug in your scanner to a spare USB port and fire up Simple
    Scan to see if it detects it. If it does, you’re in business – skip to the next
    section; if it doesn’t – don’t panic. First, check for Linux drivers with your
    manufacturer. Follow the instructions to download and install


    +   If you’re trying to extract text from a multi-column document, make sure you’ve
    YAG’S tools for correcting page skew and selecting multiple columns before you
    attempt recognition to maximise your chances of having a successful extraction.


    The success – or failure – of OCR is largely down to the quality of the original
    document.


    # What connection type?


    If you’re hooking up a network printer, then you’ll have been given a choice of
    connections when setting your printer up. But what are the different protocols
    and which one should you choose if given the choice?


    The simplest protocol is AppSocket (also referred to as HP JetDirect). It’s usually
    used when no other connection is possible, but its simplicity also means it lacks
    any kind of fine control: eg there’s no queue management so you can’t abort print
    jobs once they’ve been sent. There’s also no way to find out the printer’s status,
    making it impossible to discover ink and toner levels, eg.


    Next up is LPD, which stands for Line Printer Daemon (also known as LPR, or Line
    Printer Remote). This does implement queue management, and can tell the difference
    between different types of data, such as raw text and PostScript information.
    There’s neither support for remote set-up nor management, though, and you can’t
    query the ink or toner (although these may be provided anyway) and your print
    jobs can’t be encrypted.


    The final protocol – IPP – is the most contemporary and functional. It stands
    for ‘Internet Printing Protocol’ and is what CUPS uses as the basis for managing
    both print jobs and queues. It’s the preferred method of communication as you
    get more feedback from the printer and wield more control over it thanks to its
    bidirectional nature.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_83_2.png)


    Select your protocol carefully when configuring your network printer using CUPS,
    we’d suggest that IPP is the best if it’s supported.'
