- pgno: 39
  md: '# Utilities


    Apps that let you do more with your computer.


    # Gnome Tweak Tool


    **N**ot satisfied with the stock Gnome desktop? Use the *Gnome Tweak Tool* to
    customise several aspects, including the appearance settings of the desktop. With
    this tweak app you can also change the behaviour of the Windows and Workspaces,
    manage extensions and you can even circumvent the design philosophy of Gnome 3
    by placing icons, files and folders on the Gnome desktop. http://bit.ly/Gnome\_Tweak\_Tool


    ![](img/420a7272a6efa239082a35eeadd9bc1d_39_0.png)


    # Grub Customizer


    **G**rub 2 is the most popular Linux bootloader. That''s used by virtually all
    major distributions. It is an impressive piece of software with lots of options.
    The *Grub Customizer* is a simple to use graphical tool which enables you to quickly
    customise all aspects the bootloader, including its appearance. www.launchpad.net/grub-customizer


    # Handbrake


    **W**hen the need to convert a video arises, *Handbrake*, the video transcoder
    app does a commendable job. It can convert nearly any format and supports a wide
    range of video codecs. One of its best features is built-in device profiles for
    popular devices that make the conversion process easier. www.handbrake.fr


    # digiKam


    **O**ne of the best photo management tools for Linux is *digiKam* and it has features
    that''ll appeal to all kinds of users. It recognises all major image file formats
    and can organise and sort images based on metadata. The app also has plugins to
    export images to various online services. www.digikam.org


    # DOSBox


    **R**eive the good ol'' days with *DOSBox* and play your favourite classic DOS
    games that won''t run on your modern hardware. This is an x86 PC emulator that
    creates an IBM PC compatible computer complete with compatible graphics and sound
    cards. The app can also simulate networking hardware for multiplayer games on
    the local network and even over the internet. The Wine project even uses code
    from *DOSBox* to bolster support for DOS apps. www.dosbox.com


    # EasyStroke


    **W**ant to control your PC with the flick of the mouse? The *EasyStroke* app
    lets you define and manage gestures by recording the movements of your pointing
    device while holding down a specific mouse button. You can then configure actions
    that''ll be executed when the app recognises the defined stroke. https://easyStroke.sourceforge.net


    # K3b


    **A**lthough it''s designed for KDE, the *K3b* optical media burning utility is
    one of the finest for the job. The app can burn multiple El Torito boot images,
    audio CDs, VCDs, SVCDs, mixed-mode CDs, eMIX CDs, and DVDs. It can also rip DVDs
    and write ISO images. www.k3b.org


    # AviDemux


    **A**viDemux is a video editor and converter that can be used for basic cutting,
    filtering and encoding tasks. It supports many file types, including AVI, MPEG,
    and MP4. The app is designed for users who know what they want to do but also
    provides an intuitive interface so that tasks such as cutting and separating videos
    are pretty straightforward. The app has some presets and users can also save custom
    settings that make the app easier for new users to operate. http://AviXmount.free.fr/aviDemux


    # Vokoscreen


    **A** feature-rich screen-casting app worthy of note is *Vokoscreen*, which is
    based on FFmpeg for handling multimedia data. *Vokoscreen* can capture both video
    and audio, with options to record the entire screen, window or a selected region,
    along with video from a webcam. The app supports MPEG4, x264 MP3 and Vorbis codecs
    and can save files in either AVI and MKV containers. The app offers some controls
    such as the ability to change the video quality and frames captured per second
    and can be used to make screen casts of games. http://wiki.online.de/pp


    ![](img/420a7272a6efa239082a35eeadd9bc1d_39_1.png)


    # Ncmtcpp


    This is a command-line MP3 client that''s easy to use and customisable. It provides
    useful features such as the ability to sort playlists, song lyrics, item filtering,
    fetching artist''s info from Last.fm, tag editor and much more. http://bit.ly/Ncmcppp


    # Samba


    *Samba* is a suite of programs that enables Linux users to access and use files,
    printers and other commonly shared resources on a Windows PC on a network and
    does this by supporting the SMB protocol. www.samba.org


    # rTorrent


    Here we have a command-line BitTorrent client with an curses interface. You can
    run it as a daemon and manage it with screen and since it supports SSH you can
    manage your torrents from any remote machine. http://bit.ly/rTorrent


    # Links2


    There are lightweight browsers and then there''s *Links2*. This is a web browser
    that can render complex pages and even has a pull-down menu. It''s also special
    because it''s a CLI browser that you operate via the keyboard. http://Links.twibright.com


    # Midnight Commander


    Before the days of graphical file managers, *Midnight Commander* did the trick.
    It''s still your best option if you regularly find yourself in the console environment
    a lot. http://bit.ly/MidnightCmdr'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# # Admin tools


    Take charge of your distro with these power apps.


    # Redo Backup


    We''ve mentioned the Clonezilla cloning solution earlier in the feature, but if
    all you need is a tool to swap out an old disk for a new one, then you use Redo
    Backup and Recovery. The tool is designed for inexperienced users and has the
    simplest of interfaces.


    www.redobackup.org


    # Qemu


    It''s a feature-rich multi-purpose processor emulator and virtualiser. You can
    use it to create virtual machines and even emulate various hardware architectures.
    If you have the right hardware on tap (a processor with hardware virtualisation
    extensions), you can use Qemu with KVM in order to run virtual machines at near-native
    speed.


    www.qemu.org


    ![](img/420a7272a6efa239082a35eeadd9bc1d_40_0.png)


    # XAMPP


    The XAMPP stack gives you a single package that you can use as a sandbox to test
    and develop web apps. It includes all the necessary components such as Apache,
    MySQL, PHP, and Perl as well as several other libraries, modules and tools, such
    as phpMyAdmin and FileZilla for managing the stack components. Once installed,
    you can manage the various services via a graphical control panel.


    www.apachefriends.org


    ![](img/420a7272a6efa239082a35eeadd9bc1d_40_1.png)


    # Déjà Dup


    The app''s minimal GUI sets itself apart from the various other backup apps you''ll
    find, and it lets you configure backups within a matter of minutes. Déjà Dup is
    based on Duplicity and provides just the right number of features for desktop
    users who aren''t used to the ways of a backup tool.


    http://live.gnome.org/DéjàDup


    # Mondo Rescue


    Mondo is a unique backup solution that creates bootable backup and restoration
    disks customised for the system being used. Mondo has a text-driven interface
    and works with a wide range of file systems and can use a variety of media as
    backup mediums.


    www.mondorescue.org


    # Open Media Vault


    When you need more protection for your data than a simple backup then you need
    to deploy a NAS server. The Open Media Vault project is a Debian-based server
    that offers the power of commercial options in a way that''s easy to setup and
    manage.


    www.openmediavault.org


    # Conky


    Concerned about the resource utilisation on your PC? Conky is a nifty little app
    that lets you keep an eye on your system. It can monitor and report on the states
    of various components. The tool is very flexible and highly configurable and can
    also display information from apps, such as weather updates.


    http://conky.sourceforge.net


    # Turnkey Linux


    The Turnkey project produces appliances which you can use to deploy a new server
    in a jiffy. A Turnkey appliance is a self-contained system that packs in a fully
    functional web app that runs on top of just one, Operating System (OpeS) components,
    required to power that particular app. All the appliances are based on Debian
    but are available in several formats depending on the hardware that you want to
    deploy it on. Once they''re up and running you can manage each appliance using
    a browser-based interface.


    www.turnkeylinux.org


    ![](img/420a7272a6efa239082a35eeadd9bc1d_40_2.png)


    # Zentyal


    The Zentyal distro has all the components you need to run a gateway server. The
    distro simplifies the process of setting up, monitoring and controlling the components
    of the server with a host of custom management tools and helps you configure the
    servers without mucking about with config files.


    www.zentyal.org


    # Mutt


    Mutt is to email what Linus is to the web browser. It''s a text-based mail client
    that is highly configurable and it supports both POP and IMAP protocols and has
    all the usual features you''d want from an email client.


    www.mutt.org


    ![](img/420a7272a6efa239082a35eeadd9bc1d_40_3.png)


    # Profanity


    Profanity is a console-based client for the XMPP protocol that supports multi-user
    chats and OTR message encryption.


    www.profanity.im


    # Canto


    Want to do more from the command-line? Get the Canto CLI RSS feed reader. It supports
    RSS, Atom and RDF feeds, and imports and exports feeds in OPML format. It has
    lots of customisation and even configure it with Python.


    http://bit.ly/CantoRSS


    # mpg123


    This is an MP3 audio player for the command-line that supports gapless playback.
    It''s so good that its decoding library, libmpg123 is used by other audio players
    for MP3 playback.


    www.mpg123.de


    # FFmpeg


    One of the most versatile media conversion utilities, FFmpeg can manipulate virtually
    any type of media file in various ways, such as changing bitrate, extract audio,
    record streams, extract stream and much more.


    www.ffmpeg.org'
  merge: -1
  img_proc: true
