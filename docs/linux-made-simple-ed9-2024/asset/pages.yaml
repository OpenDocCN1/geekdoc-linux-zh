  md: '# # Escape from

    Windows 10


    Had enough of Windows? Make the switch to Linux and discover the power and freedom
    it offers. Time to fling open the escape hatch!


    > **“The easiest way to migrate from Windows is through Mint, a user-friendly
    Linux distro”**


    The launch of Windows 10 was a great opportunity for those frustrated with the
    Microsoft ecosystem to find a better way. And what better way than Linux? If you’ve
    just bought a PC with Windows 10 pre-installed or upgraded from an earlier version
    and decided enough’s enough, or have a family member or friend who’s finally seen
    the light, this feature is for you.


    The easiest way to migrate from Windows is through Mint, a user-friendly Linux
    distribution (distro) that’s packed with all the features you need, wrapped up
    in an accessible user interface particularly suited to first-time switchers. You’ll
    find the latest version at www.linuxmint.com. We’ll be using version 17.3 to step
    you through the process, but most of the guide can easily be adapted to Ubuntu
    (either 15.10 or 14.04.3 LTS) if you’d prefer.


    The process is straightforward: first, you’ll back up your hard drive in its current
    state, so you know you can always roll back to the beginning of the process if
    necessary without data loss. Then we’ll reveal how to install Mint alongside your
    existing Windows 10 installation, so you still have access to your old system
    while you make the transition. We’ll sort out any dual-boot issues you have, plus
    expose the truth behind some myths that put people off switching in the first
    place.


    We’ll also take you on a tour of the new Cinnamon desktop, reveal the basics you
    need to get started, plus show you how to switch to it if you’ve installed Ubuntu.
    Last, but by no means least, we’ll show you how to install apps on your new system,
    find open-source alternatives to the key programs you’ve been using previously
    and even reveal how to get some Windows programs running with the help of a clever
    tool called Wine.


    Everything you need to make the switch is here, so now there’s no excuse. Read
    on to discover how to escape Windows 10 and transform your computing experience.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_13_0.png)'
