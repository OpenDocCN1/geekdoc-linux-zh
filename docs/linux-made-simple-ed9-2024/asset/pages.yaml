  md: '# # The marsupials


    Evolutionary masterpieces and mavericks.


    # Gentoo Linux


    The goal of the Gentoo project was to create a distro without pre-compiled binaries
    that was tuned to the hardware on which it was installed. Unlike a binary software
    distribution, the source code is compiled locally according to the user''s preferences
    and is often optimised. It was initially called Enchir but Gentoo 1.0 was released
    in 2002.


    Gentoo has the distinction of being one of the most configurable distros and appeals
    to Linux users who want full control of the software that''s installed and running
    on their computer. Gentoo users get to create their system from the ground up;
    the distro encourages the user to build a Linux kernel tailored to their particular
    hardware. It allows very fine control of which services are installed and running.
    Memory usage can be reduced, compared to other distributions, by omitting unnecessary
    kernel features and services.


    This distro is a rolling release and one of its notable features is its package
    management system called Portage. If you''ve never used it before, there''s a
    steep learning curve to using Gentoo. Derivatives such as Funtoo can be a good
    starting point if you''re not ready to dive straight in.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_31_0.png)


    > > Arch Linux is ludicrously customisable, offering all the latest packages.


    The most impressive feature of the Arch distro is the Pacman package management
    tool. Arch is a rolling release that can be brought up to date with a single command.
    Installing Arch Linux is an involved process and although it is well-documented,
    it''s still better suited for experienced Linux campaigners. However, Manjaro
    Linux is an Arch derivative and is more user-friendly and has a graphical installer.


    # Arch Linux


    Judd Vinet wanted to create a distro that was inspired by the simplicity of Crux,
    Slackware and BSD and thus created Arch Linux in 2002. Arch aims to provide a
    lightweight foundation on which the user can build according to their needs. In
    Vinet''s words: “Arch is what you make it.” A bit like life really.


    # Tiny Core Linux


    If you can''t invest time in creating an Arch or Gentoo installation, check out
    Tiny Core Linux. The distro installs the bare minimum software you need to boot
    into a very minimal X desktop. From this point on, you''ve complete control and
    can install apps from online repos or compile them manually.


    The distro is a mere 12MB and bundles only a terminal, a text editor and an app
    launcher on top of the lightweight FLWM window manager. It has a control panel
    to manage bootup services and configure the launcher, but everything else needs
    to be pulled in from its manager, including the installer if you want Tiny Core
    on your hard disk. The distro also has a CorePlus variant, which has additional
    drivers for wireless cards, a remastering tool and internationalisation support.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_31_1.png)


    > > Tiny Core Linux is an idle distro at 12MB. Ah, sweet!


    # Puppy Linux


    One of our all-time favourites, Puppy Linux had its initial release in 2003 and
    the first stable one in 2005. The distro is built from the ground up and its initial
    goal was to support


    # Linux From Scratch


    Rather than being a distribution itself, Linux From Scratch – popularly called
    LFS – is a freely available set of instructions to create your own custom distro
    from the ground up, entirely from source. The project was started in 1999 when
    its author, Gerard Beekmans, wanted to learn how a Linux distro works behind the
    scenes. While building his system from scratch, Beekmans wrote down the steps
    and released it as a HOWTO (pictured, right)


    thinking that there would probably be other people who would be interested. LFS
    has grown quite a bit from its humble start, transforming from a single HOWTO
    to a multi-volume book. It has also spawned various sub-projects over time, such
    as BLFS or Beyond LFS, which fleshes out the basic LFS system, and ALFS or Automated
    LFS, which is designed to help automate the process of creating an LFS system.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_31_2.png)'
