    come in all different shapes and sizes. This means that if you don’t want to build
    a gaming machine yourself, you should be able to find one that suits your needs
    – and budget. Prices start from $449 (around £292 – roughly the cost of a PlayStation
    4 but with a heck of a lot more power) to a wallet numbering $4,999 (around £3,256)
    for Falcon Northwest’s Tiki with its granite base. You can find out more about
    Steam Machines and purchase them from Valve’s own Steam


    website at http://store.steampowered.com/ sale/steam_machines. If you’d prefer
    to play your games with a controller rather than a keyboard and mouse, then many
    USB controllers will work plug-and-play with Linux and SteamOS, even Microsoft’s
    Xbox 360 controller. Valve has also created its own Steam Controller ($40), with
    the unique device supposedly making it easy to control games that usually use
    mouse and keyboard controls with the gamepad.'
