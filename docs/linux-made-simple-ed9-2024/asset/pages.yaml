  md: '![](img/420a7272a6efa239082a35eeadd9bc1d_82_0.png)


    Once installed, administer your printers using the Printers tool under System
    Settings.


    and model and the word ‘PPD’). This provides CUPS with a description of its capabilities,
    which it can use when outputting files.


    If all else fails, don’t worry: choose ‘Select printer from database’ again, but
    this time select ‘Generic (recommended)’ and click ‘Forward’. A generic PCL driver
    will be pre-selected, so try this first: either the palermo or pxcloner option
    depending on whether your printer is mono or colour. Click ‘Forward’ to install
    it.


    Whichever route you go down when adding your printer, you’ll be prompted to provide
    a name, description and location, then asked to print a test page – we recommend
    this to verify the connection is working. Once done, you’ll be taken to the printer’s
    configuration screen, where you can examine its settings and see what control
    you can wield over it.


    # Tweak printer settings


    The main Settings tab allows you to change your printer’s description and location,
    plus change its URL. If you click ‘Change…’ next to ‘Device URI’ you can attempt
    to connect using a different protocol. This is also where you’ll find options
    for printing test pages and maintaining the printer.


    The Policies tab allows you to change the printer’s state in terms of whether
    it’s enabled, accepting jobs or shared. You can also define what happens if the
    printer encounters an error and switch on authentication for its ‘Operation Policy’
    if supported and required (if you go down this route, access the printer via the
    CUPS web interface to set things up).


    Access Control allows you to deny (or allow) access to the printer on a user level.
    You should spend some time in both Printer Options and Job Options tab where you
    configure key printer defaults. Printer Options is mainly concerned with default
    quality and paper settings, while Job Options lets you configure things like the
    number of copies, page orientation, and individual elements such as text and images.


    Finally, if your printer allows it, the Ink/Toner Levels provides a handy glance
    at your printer’s core components, including elements like the fuser.


    Now your printer is set up, it’s time to use it. Open an application and when
    you’re ready, choose File > Print. Your printer should be listed, so it’s simply
    a case of tweaking whatever options are made available to you in the app’s own
    dialog and clicking ‘Print’. If you have more than one printer installed, the
    default one will always be pre-selected; change this via the System Settings >
    Printers dialog by right-clicking your target printer and choosing ‘Set as default’.


    In most cases, the CUPS tool provided under System Settings should have all the
    options you need, but CUPS can also be administered from your browser: type localhost:631
    to access it. There’s a handy overview and links to the CUPS forum should you
    need it, but use the tabs at the top of the page to navigate the web-based utility:
    Go to Printers and click your printer to access its settings – here, navigation
    is done through a series of drop-down menus. If you’ve installed a dedicated driver
    and were asked to assign a user to it, you’ll be prompted at this point to enter
    the username and password to access the required pages.


    > Struggling to get your printer to function correctly? Visit http://openingtech.org/printers
    and see if your model is covered. If it is, scroll down to the comments to see
    if anyone else can help (or post your own question in the forum).


    # Install a printer driver tarball package


    ![](img/420a7272a6efa239082a35eeadd9bc1d_82_1.png)


    # 1 Obtain & extract installer


    Browse your manufacturer’s website and locate the required driver for your Linux
    distro, which may be packaged as a unified driver. Save the garg_file to your
    Downloads folder, then right-click it and choose ‘Extract Here’. Once that’s done,
    open the extracted folder and locate a file called install.sh. Right-click it
    and choose ‘Properties’ to make a note of its location.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_82_2.png)


    # 2 Start installation


    Now you’ll need to open up a terminal window and type in cd $path. You’ll need
    to replace $path with the path listed under Location for the install.sh file that’s
    found in its Properties window. Now you’ll need to type the following command
    and press Enter, followed by your root password when prompted: sudo sh install.sh.
    After a short pause you should see an installer wizard pop up.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_82_3.png)


    # 3 Follow install guide


    You’ll need to work your way through the installer wizard and make sure that you
    tick your username to allow you to access the printer. Once the wizard’s complete,
    you may then be prompted to configure the printer for CUPS and need to follow
    its wizard to set it up, entering name, description and location, if required,
    before going ahead and testing the printer to finish the process off.'
