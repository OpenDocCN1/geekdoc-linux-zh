  md: '# ## Inside Ubuntu Software Centre


    **Everything**

    To return to the main menu of *Software Centre*, click this button. You can also
    use its menu to select where the software comes from – official Ubuntu releases
    or from Canonical’s partners.


    **Categories**

    Once you’ve chosen a category in All Software, that category’s subcategories are
    displayed, meaning you can drill down further to the software you really want.


    **See it all**

    Wondering just what there is to choose from in your current category? Click here
    to see the whole confusing list.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_44_0.png)


    **Past tense**

    What has Software Centre actually installed? Not just the big packages, but the
    little ones? The history page will let you know.


    **Top picks**

    The best (or at least the highest rated) apps in each category are listed here
    along with their average ratings and number of reviews (in brackets).


    **Search bar**

    Searching is vital if you’re not sure of a package name, or not sure that category
    your chosen package is in. Just type in here and hit [Return].


    the like) with a lot more information on hand. Perhaps it’s not the best for Linux
    newcomers, but it’s handy to have around when you take the next step.


    Typing ‘package manager’ into the search box doesn’t do us much good. Synaptic
    is in the list but it’s not easy to find. So hit ‘All Software’ and we can find
    it in a more organic way. It’s actually nested in the typically opaque category
    Themes and Tweaks, so click in the left hand column of the main page and you should
    see it listed in the top rated section of the window that follows. If not, click
    the All button at the top and you should see a much more Manageable list.


    divided by category. We know that *Synaptic Package Manager* is in Themes and
    Tweaks, so click the arrow to the left of that category to expand it and locate
    *Synaptic* in the list. Click it once and you will see a pair of buttons appear
    – More Info, which is especially useful if you’re re-reading your system and can’t
    remember what a particular bit of software actually does, and Remove. Click the
    latter.


    If applicable, *Software Centre* will now warn you of any other things that also
    must be uninstalled at the same time. In this case, it’s a package called update-manager,
    which we can easily reinstall later using the same technique we used to install
    *Synaptic Package Manager* in the first place. Click Remove All, enter your password,
    and then the removal will happen – but be sure to check the History tab for confirmation.
    Now go ahead and experiment with *Software Centre*. Install some games, remove
    some of the default apps and go crazy! ■


    > **Quick tip**

    > Most graphical package managers are just a front end for terminal apps like
    apt-get, which you can use directly. There’s more on this on p142.


    # ## Actually Installing


    Click on *Synaptic Package Manager* and you’ll see a host of information about
    it, a link to its web site, a screenshot (isn’t it pretty?) and, on the right,
    an Install button. Before you go ahead and click it, scroll down a little – *Synaptic*
    comes with a host of add-ons that you might be interested in, and these can be
    installed simply by marking their individual check boxes. Scroll a bit further
    and you’ll find reviews of the package – very useful if you’re installing an unknown
    bit of software, as fellow users are rarely shy about sharing negative experiences
    – and *Software Centre* doesn’t exactly have a stringent craft filter – so these
    can be a big red flag in a lot of cases. When you’re ready, hit Install. Type
    your password, hit Authenticate, and *Software Centre* will do the rest.


    Head to the History panel to see what changes have actually been made. You should
    see that a package called synaptic has been installed, but look at items installed
    at a similar time; the list will include a host of *Synaptic*’s dependencies that
    have also made their way onto your system without you having to lift a finger.
    Beyond the finger you used to click the install button, that is.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_44_1.png)


    ▶ Otherwise-redundant dependencies will be automatically removed when you uninstall
    packages – and sometimes you’ll have to remove additional things too.


    # ## Once removed


    Let’s reverse the process, while we’re at it. Click the Installed button at the
    top of the window to find a list of software'
