- pgno: 47
  md: '# # LibreOffice

    ## Writer: Create awesome docs


    LibreOffice is a full-featured office suite that’s completely free of charge.
    Let’s see how Writer, its word processor, handles something complex.


    # ### Quick tip


    Writer can pull in content from your Calc spreadsheets. Just copy the cells you
    want to import, then use the Edit > Paste Special function in Writer to bring
    them in.


    **A**nything Windows can do, Linux can do... just as well. Not as catchy as the
    classic song, we’ll admit, but it’s the truth: as a mature desktop operating system,
    Linux is blessed with some solid software which can perform everyday desktop tasks
    with absolute aplomb. Our recommendation in the office stakes is *LibreOffice*,
    a cross-platform collection of productivity applications which has been around,
    in many forms and under many names, since 1985. Despite its venerable legacy,
    it’s still the most actively-developed office package out there.


    # ### The Write Stuff


    *LibreOffice 5* should come preinstalled with your Linux distribution – you can
    check that you have the latest version by running *Writer* and going to *Help/About
    LibreOffice*. If it isn’t installed, open up your package manager and install
    it from there. (You may be given the option between *LibreOffice Fresh* (the cutting-edge
    release) or *LibreOffice Still* (the stable, enterprise-ready version). Which
    you choose is entirely up to you: nothing that we cover here requires the very
    latest release.) When it’s all safely installed, run *LibreOffice Writer*.


    ![](img/420a7272a6efa239082a35eeadd9bc1d_47_0.png)


    The columns dialog box has a huge number of options in it, including, if you wish,
    columns of differing sizes on a single page.


    Although Microsoft has changed *Microsoft Word*’s interface – for the worse, some
    say – in recent years, *Writer*’s layout should be instantly familiar to anyone
    who’s used a word processor since the early ’90s. There’s a big white empty page.
    A pair of bars at the top of the screen offer quick access to text and document
    settings. There’s a bar at the bottom of the window with information – a word
    count, character count, page count – and a zoom slider. And there’s a flashing
    cursor, daring you to write something.


    The act of typing is a little beyond the scope of this tutorial – we’ll assume
    you can manage that – so let’s create a basic newsletter to test a few of *Writer*’s
    features.


    # ### Layout: the facts


    Start by splitting your page up into columns, into which you can type your text.
    In the menu bar at the top of the screen, click *Format* > *Columns* to bring
    up the columns dialog, then change the number of columns to two either by typing
    a ‘2’ in the box, clicking the up arrow on the box, or clicking the two-column
    pictogram on the right of the box. You can now set a column spacing. You’ll want
    this to be greater than zero, otherwise the text in your columns will merge into
    one, so set it to 0.5cm. If you prefer to use other units of measurement, you
    can type them in directly; entering 0.2in into the spacing box will automatically
    convert it to its metric equivalent.


    Now let’s add a separator line to break the columns up. Set the style to solid,
    the height to 90%, the colour to a dark grey and leave the width as it is. Again,
    you could put your own units of measurement in this box, although it’s limited
    to a maximum width of 9pt. Because we changed the height, we can also change the
    line’s position: centred looks best. Click OK to return to your document, and
    you’ll see your changes have been made.


    So it’s time to type. Or it would be, but that sounds a bit too much like hard
    work. So instead we’re going to fill our document with dummy text using *Writer*’s
    handy *Auto Text* feature, which can also give you quick templates for CVs, covering
    letters and the like. Go to *Edit* > *Autotext*, expand the Standard category,
    select *Dummy Text*, then click *Insert* to add your ream of filler text into
    your columns.'
