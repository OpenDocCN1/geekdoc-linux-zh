  md: '# Genus Slackware


    The tortoise distro that’s outlasted many hares.


    Slackware has the honour of being the oldest distro that’s still actively maintained.
    It was created by Patrick Volkerding and had its first beta release in 1993. The
    project aims to create the most Unix-like Linux distribution. Slackware was originally
    derived from Softlanding Linux System (SLS), which was the first distro to provide
    TCP/IP and X Windows System in addition to the Linux kernel and basic utilities.
    SLS, however, was very buggy and the growing frustration of SLS users prompted
    Volkerding to release an SLS-like distro in July 1993.


    Back then, in addition to being hosted on an anonymous FTP server at the Minnesota
    State University Moorhead, the distro was offered as 24 3.5-inch floppy disks.
    By the time version 2.1 was released in October 1994, the distro had swelled to
    73 disks and Version 3 was released on CD-ROM.


    The USP of the distro is that it makes very few changes to upstream packages.
    Unlike other distros that aim for a particular purpose or a wide variety of users,
    Slackware doesn’t preclude user decisions and doesn’t anticipate use cases. The
    user, therefore, has far greater control on the installed system with Slackware
    than most other distros.


    # Cut some slack


    Unlike other distros, Slackware doesn’t provide a graphical installation. It continues
    to use plain text files and only a small set of shell scripts for configuration
    and administration. The distro also doesn’t provide an advanced graphical package
    management tool, relying instead on command line tools such as pkgtool, installpkg,
    upgradepkg, and removepkg. However, these native tools can’t resolve dependency
    issues. Slackware packages are just plain compressed TAR archives. The package
    contains the files that form part of the software being installed, as well as
    additional metadata files for the benefit of the Slackware package manager. As
    of Slackware 12.2, slackpkg has become the official tool for installing or upgrading
    packages automatically through a network or over the internet, complementing the
    traditional package tools suite that only operates locally. Slackpkg also doesn’t
    resolve dependencies between packages. Traditionally, Slackware only offered a
    32-bit release, and users had to rely on unofficial ports, such as slamd64 for


    ![](img/420a7272a6efa239082a35eeadd9bc1d_30_0.png)


    64-bit releases. Since Slackware 13, a 64-bit variant is also available and officially
    supported. In 2002, Stuart Winter started the ARMslack project, a port of Slackware
    for ARM. In 2009, Volkerding knighted ARMslack as an official port of Slackware.
    With the release of Slackware 14.0, the project has been completely renamed to
    Slackware ARM. It might sound surprising, but Slackware is a popular base for
    many distros. The derivatives include expansive desktop projects, live distros,
    security distros etc. The Slackware project is also missing some of the common
    developer-friendly tools. For example, there’s no official bug tracking system.
    Also, there is no official mechanism to become a contributor for Slackware. The
    final decision on what goes into the distribution is made by Volkerding – Slackware’s
    ‘Benevolent Dictator For Life’. In another departure from the norm, Slackware
    doesn’t follow a fixed release schedule. The objective is to release a very stable
    system and so the project follows a release-when-ready philosophy, but still aims
    for one major release a year.


    > “Unlike other distros, Slackware doesn’t preclude user decisions and doesn’t
    anticipate use cases”


    +   - In addition to Slackware-stable, the project also provides a testing-current
    branch for more bleeding-edge software.


    # BEST OF BREED


    # Salix OS


    Salix OS is one of the best Slackware-based distros; it’s light, nimble and backwards
    compatible with Slackware. One of its salient features is that it minimises bloat
    by having only one application per task. The distro supports both 32-bit and 64-bit
    architectures and is available in five variants for the KDE, MATE, Xfce, Openbox,
    and Ratpoison desktops.


    Salix offers three modes of installation – Full, Basic and Core. The Full option
    installs everything on the installation image; Basic provides a barebones system
    with just the graphical desktop and a few essential apps and the Slapt package
    manager; the Core option will only install a console-based system and is designed
    for users to custom-build their distro.


    The Full distro includes all the apps you’d expect on a desktop distro, and is
    often touted as Slackware with a graphical package manager. Its package manager,
    Gslapt, resembles the Synaptic package manager and also provides all the same
    functionality. Multimedia coders aren’t supplied out of the box, but that can
    be fixed with the distro’s custom Codex Installer.'
