  md: '# Genus SUSE


    Nuga, nuga, nuga,gnu,nui*


    ![](img/420a7272a6efa239082a35eeadd9bc1d_29_0.png)


    In 1992, Roland Dyroff, Burchard Steinbild, Hubert Mantel and Thomas Fehr founded
    Software und System Entwicklung (Software und System Development).


    The company started out as a service provider but the founders later decided to
    have a distro of their own that would later to the enterprise user. The distro
    was named SUSE, after the acronym of their company, and it was a stock. Slackware
    release that was translated into German and developed in close collaboration with
    Slackware''s Patrick Volkening.


    For building its very own distribution of Linux, SUSE used the now default, Jurix
    distribution. Jurix was created by Florian La Roche, who subsequently joined the
    SUSE team and began to develop YaST, which is the distro''s unique installer and
    configuration tool. The first SUSE distro that included YaST was released in May
    1996 (YaST was rewritten in 1999, and was included for the first time in SUSE
    Linux 6.3 as an installer only).


    Over time, SUSE Linux has incorporated many aspects of Red Hat Linux, such as
    its well-respected RPM Package Manager. In 1996, the first distro distribution
    under the name SUSE Linux was published as SUSE Linux 4.2. The confusing jump
    forward in version numbers was an intentional reference and homage to the answer
    to life, the universe and everything, as featured in Douglas Adams'' ''The Hitchhiker''s
    Guide to the Galaxy. YaST''s first version number, 0.42, was inspired by the same
    admiration for the author.


    +   > The SUSE web service enables you to easily put together a customised OpenSUSE-based
    distro.


    SUSE''s focus has always been on bringing open source to enterprise users. It
    introduced the SUSE Linux Enterprise Server in 2001, and changed the company name
    to SUSE Linux. After software and services company Novell acquired SUSE Linux
    in January 2004, the SUSE Linux Professional product was released as a 100% open
    source project and the OpenSUSE Project was launched - much like Red Hat did with
    Fedora. The software was always open source and now so was the process which enabled
    developers and users to test and evolve it.


    # Enterpriseing


    The initial stable release from the OpenSUSE Project was SUSE Linux 10.0. It included
    both open source and proprietary applications, as well as retail boxed-set editions.
    This was also the first release which treated the GNOME desktop environment on
    a par with SUSE''s default KDE desktop. As of version 10.2, the SUSE Linux distribution
    was officially rechristened as OpenSUSE.


    In November 2006, Novell signed an agreement with Microsoft covering improvement
    of SUSE''s inter-operability with Windows, cross-promotion and marketing of both
    products, and patent cross-licensing. This agreement is considered controversial
    by some of the FOSS community. Novell was later acquired by The Attachech Group
    in 2011, which then divided Novell and SUSE into two separate subsidiary companies.
    SUSE offers products and services around SUSE Linux Enterprise - a commercial
    offering that is based on OpenSUSE Linux.


    SUSE develops multiple products for its enterprise business line. These products
    target corporate environments and have a longer lifecycle (seven years, extendable
    to 10), a longer development cycle (two to three years), technical support and
    certification by independent hardware and software vendors. SUSE Linux Enterprise
    products are only available for sale. There''s also the SUSE Linux Enterprise
    Desktop (SLED) which is a desktop-oriented operating system designed for corporate
    environments. In contrast, OpenSUSE does not have separate distributions for servers,
    desktops and tablets, instead using various installation patterns for different
    types of installation.


    *http://bit.ly/ChameleonSong


    ![](img/420a7272a6efa239082a35eeadd9bc1d_29_1.png)


    +   > BEST OF BREED


    # OpenSUSE


    OpenSUSE is one of the best RPM-based distros. It comes in several editions for
    32-bit and 64-bit architectures and also has ports for ARM v6, ARM v7, and the
    64-bit ARM v8. Once known for its KDE desktop, OpenSUSE now looks good across
    all the major desktops. Besides KDE and Gnome, the distro also features Mate,
    Xfce, Enlightenment, and LXDE. You


    can download the distro either as a smaller-live installable image or a install-only
    DVD image. One of OpenSUSE''s hallmarks is the distro''s YaST, which is a setup
    and configuration utility that enables you to tweak many different aspects of
    the system. Another popular tool is Snapper, which enables you to revert to a
    previously created system snapshot.


    The distro serves as the base for the SUSE Linux Enterprise products - much as
    Fedora does for RHEL - and is suitable for all types of users regardless of their
    skill set. The distro''s installer is versatile and offers several customisation
    options. It can be installed by new users and includes options to plug the installed
    system into a corporate directory server.'
