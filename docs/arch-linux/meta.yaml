  md: 'Now Apache is slightly different ; the basics are that root is involved in
    the kick starting of Apache and that there is a "hand over" with Apache running
    with user and group http:http


    A bug bear with Apache on Linux is that you will find as a normal user you can
    not edit , with your normal user powers files within http. Of course as a web
    developer that''s exactly what you want and will need to do. Much better as an
    approach to get your web in development and problems acknowledged and addressed
    then update file to the live server, than do live editing of files via cPanel.


    On a live server directories usually have 755 permissions and files 644.


    One approach to the editing issue is to set the group ownership for /srv/http
    to http , then add write permissions for the group http . Also add yourself as
    a user to the group http. That means you should be able to edit. One thing that
    might trip you up. Is that you need to logout and back in to take affect. Lets
    do that .


    If you forgot who you are as a user :


    ```

    [andrew@darkstar ~]$ whoami

    andrew

    ```


    let ''andrew'' joining the exclusive club ''http'':


    ```

    [andrew@darkstar Desktop]$ sudo usermod -a -G http andrew

    ```


    The above lets the user andrew join the group http, whilst retaining membership
    of other groups already joined . Next we group the group owner shop of /srv/http
    and add write permissions for the group.


    ```

    [andrew@darkstar Desktop]$ sudo chgrp --recursive http /srv/http

    [andrew@darkstar Desktop]$ sudo chmod --recursive g+w /srv/http

    ```


    Remember to log out and log back in or reboot for changes to take effect. We will
    fine tune permissions later on. Next lets try a php file. One way to do that is
    use the mv command to rename index.html to index.php


    ```

    [andrew@darkstar ~]$ mv /srv/http/index.html index.php

    ```'
