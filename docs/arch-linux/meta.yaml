- img_proc: true
  md: 'Now with partitions mounted we will create an fstab entry :


    ```

    root@archiso ~# genfstab -U /mnt >> /mnt/etc/fstab

    ```


    If it moans, you can step by step :


    ```

    root@archiso ~# mkdir /mnt/etc

    root@archiso ~# touch /mnt/etc/fstab

    root@archiso ~# genfstab -U /mnt >> /mnt/etc/fstab

    ```


    genfstab is a script functionality of the Arch ISO, you can check with :


    ```

    root@archiso ~# cat /mnt/etc/fstab

    ```


    > **note**


    You can re-generate in an appropriate way an fstab entry, on your running Arch(if
    you need or want to) , when you get to that point by first installing via pacman


    sudo pacman -S --needed arch-install-scripts


    # genfstab -U -p / >> /etc/fstab


    The -U in :


    ```

    root@archiso ~# genfstab -U

    ```


    outputs to fstab partitions referenced by UUID and -L would output as labels i.e
    /dev/sdax


    You can use :


    ```

    root@archiso ~# genfstab -L

    ```


    but don''t use both otherwise fstab will have both type of entries leading to
    confusion of system.'
