    ## Set Time Zone


    The first thing on the list is to set the time zone. Now lets remind ourselves
    that we are currently in chroot, meaning what we type in , is in the context from
    our part installed system. Now when Arch is up and running you will have access
    to systemd and its journalctl ,systemctl and timedatectl. However systemd is not
    up and running. I didn''t want to overload the reader with too much pre-install
    stuff , so didn''t touch timezone in the install pre-able.


    But no problem; there are 2 approaches.From the chroot prompt type:


    ```

    root@archiso : / # ln -sf  /usr/share/zoneinfo/Europe/London  /etc/localtime

    ```


    That will set time zone to GMT and when your system is up you can re-set it. The
    other approach is to come out of chroot, back to the Arch ISO install prompt.
    Do not worry the partition you mounted will stay mounted until you unmount it.
    So you can just go back.


    To see a list of all timezones type from the Arch install ISO prompt:


    ```

    root@archiso ~# timedatectl list-timezones

    ```


    You should be able to scroll through the list using keyboard up and down keys.
    When you see where you make a note of it. Then type Q to quit list.


    Don''t forget to get back to chroot so type :


    ```

    root@archiso ~#  arch-chroot    /mnt

    ```


    Then say your nearest time zone is Africa/Accra then you type:


    ```

    root@archiso : / # ln -sf  /usr/share/zoneinfo/Africa/Accra  /etc/localtime

    ```


    OK that''s the time zone done.


    The etc directory is the main place for Linux system configuration. You will find
    for instance HTTP there which has configuration for Apache web server and any
    virtual hosts files. The command basically formed a link from /usr/share/zoneinfo/<Zone>/<City>
    to the file /etc/localtime


    ## Hardware Clock


    Now we are going to set the hardware clock to the system clock using :


    ```

    root@archiso : / # hwclock --systohc

    ```


