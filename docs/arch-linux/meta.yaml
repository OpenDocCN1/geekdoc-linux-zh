- img_proc: true
  md: 'Check out the result of shift key + @ key  do you get an ampersand or  something
    else

    Basically your keyboard layout is going to be the Country code for the language
    you speak.

    For UK its `root@archiso ~# loadkeys uk`

    For German its `root@archiso ~# loadkeys de`


    Later we will "chroot" so please note the prompt will then change from above to
    :

    `root@archiso:/#`


    Also worth mentioning now to get out of chroot back to main ISO install prompt
    you type "exit". The # on the `archiso ~#` shows we are in the context of root
    power. OK so we have dipped our toe in . I''m going to show the command to shutdown
    the install. After that its a case of having a think and ponder if your ready
    to install Arch and go for it ? One thing i ant to add from installing

    Arch on a 2013 HP laptop is i found , it wouldn''t boot but rEFind still got the
    OS up and running. So i would say get rEFind on a USB stick done and ready in
    case you need it.


    To cleanly shutdown the  running Arch install use this command:

    `root@archiso ~# shutdown now -h`


    # Main Install Procedure


    from the Arch Install prompt  there are a few commands to see what your current
    PC hard drive looks like; try one of the commands below :

    `fdisk -l` , `blkid`,   `lsblk`


    If you have done your partitioning and also have formatted your partitions then,
    use the above commands to remind yourself which is which, then  skip to the section
    where we mount the partitions.Lets assume you have not partitioned your disk yet.
    We will use fdisk command from the Arch Install Prompt to do that. By the way
    you can practice using fdisk on a USB stick, its not the end of the world if things
    go wrong. if i run fdisk -l from the Arch ISO install prompt:


    `root@archiso ~# fdisk -l`


    I see amongst other output :

    `Disk /dev/sda: 58.24 GiB, 62537072640 bytes, 122142720 sectors`


    OK so my hard drive is /dev/sda. So to  start partitioning it would be:

    `root@archiso ~# fdisk    /dev/sda`


    +   - `+500M` (for 500 megabyte)

    - `+30G` (for 30 gigabyte)


    type in letter "g"; that''s going to create a gpt type partition table. By the
    way  nothing will be written until you type "w" .  To create a partition type
    in "n"

    You will see a load of figures and a prompt for a suggestion where  partition
    should start. Select default  by hitting return key for all partition start suggestions.
    When you get to the stage , of last sector for your first partition you enter
    a size in the form of :


    Then hit return key . Don''t worry about  the partition file types yet.'
