    是 PHP 的一个内置函数。当你打开浏览器并在地址栏中输入 URL 或点击链接时，你实际上是在连接到一个持有网页的服务器，并且你正在请求该页面在你的浏览器中被渲染和显示。


    当你拨打固定电话给某人时，有一个流程和协议。网络方面区别不大。在幕后，客户端计算机（你的）通过 Web 浏览器开始一个"握手"，并就它们如何相互通信达成一致。如果你查看地址栏，以前你会看到
    http，它代表超文本传输协议；现在你 mostly 看到 https，这是安全的


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_81_0.png)


    所以在左边的图中，你的计算机通过互联网服务提供商能够向持有你想要访问的网页的服务器发出请求。对于我们的 index.PHP 文件，我们使用了 PHP 内置的服务器功能，这是一个最简单的系统。我们将继续深入一点，然后看看使用我们自己的功能完备的
    Web 服务器"apache"，它将在我们的机器上运行，我们将通过"localhost"连接到它。


    Web 开发的真正强大之处在于，当你能够实现与数据库的交互时。记录形式的数据可以被存储、检索等，如今通常被称为"CRUD"操作。


    我们将初步看一下这个问题，至少向你展示它可能并不像你想象的那么难。


    我们将使用 sqlite 来实现，它是一个"无服务器"数据库，这意味着与 MySQL 不同，它不需要在后台运行守护进程。不要产生认知扭曲，认为 sqlite
    不如 MySQL 安全。这取决于如何使用它。直接访问数据库可能更难，但如果你看看 WordPress，让这个 CMS 向"用户"展示数据库中的内容是非常容易的，除非已经采取了措施。大多数使用
    WordPress 的活跃网站通常都没有采取这些措施。


    好的，让我们安装 sqlite 和它的浏览器


    ```

