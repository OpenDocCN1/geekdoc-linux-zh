- md: " So what you will type in for the size of the first partition (efi) will be\
    \ something like: +400M\n\nWhen you have entered a figure for partition end, it\
    \ will confirm and show a partition number. Repeat process by typing \"n\" again;\
    \ accept default start and type in the size of the partition you want.\n\nWhen\
    \ all partitions have been created type in \"w\" to affect the changes. You can\
    \ then use one of the three commands on page 14 to show (check might be a better\
    \ word) what your disk now looks like:\n\nlet's say we now have:\n\n```\n/dev/sda1\
    \   will be for efi\n/dev/sda2   will be for swap\n/dev/sda3   will be for root\
    \ install.\n```\n\nNote if you don't create a separate /home partition, it's no\
    \ problem. When you create a user via the useradd command, then a directory for\
    \ the user will be created within the root partition. If you do have a /home partition\
    \ then the command will create a user account within /home.\n\nSo now we format\
    \ the partitions:\n\n```\nroot@archiso ~#     mkfs.fat -F32 /dev/sda1\nroot@archiso\
    \ ~#     mkswap /dev/sda2\nroot@archiso ~#     swapon /dev/sda2\nroot@archiso\
    \ ~#     mkfs.ext4 -b 2048  /dev/sda3\n```\n\nin the above last line -b 2048 is\
    \ a flag that tells the system to create file system in block of 2048 bytes at\
    \ a time\n\nyou can use e2label command to label partitions such as\n\n```\nroot@archiso\
    \ ~#  e2label /dev/sda6       home\n```\n\nThe next stage is we are going to \"\
    mount\" our partitions. \"Mounting\", put simply is to make a partition in use\
    \ and accessible to be able to work on.\n\n> **Note**\n> \n> In the structure\
    \ of an installed system there are commonly directories call \"mnt\" and also\
    \ \"run\". When you attach say a USB stick to a laptop, the partition something\
    \ like /dev/sdb1 will be auto-mounted to the run directory. We will be mounting\
    \ the root directory, which will be where our Arch is installed to the /mnt. The\
    \ Arch install system allows us to mount a partition to /mnt. Other partitions\
    \ we will need to create the place to mount them. Root will be mounted to /mnt;\
    \ the efi partition will be mounted to /mnt/boot. More later\n\nSo now we are\
    \ now going to mount the partition which will be for the main install of the Arch\
    \ Linux system. In my case it's /dev/sda4. I put my efi partition in front of\
    \ the SWAP partition, which was prudent since I could reduce the SWAP partition\
    \ and then expand the efi partition into the created space. It turned out I needed\
    \ to do it!\n\nOn my labelling of partitions I don't have an /dev/sda3 partition.\
    \ That's OK. In /etc/fstab I have it clarified what is what:\n\n```\n# /dev/sda4\
    \ LABEL = /\nUUID=38b6759b-fc65-4606-9414-c1d17bcdc3c4    /    ext4  defaults\
    \    0    1\n```\n\nYou can reference in fstab partitions either by UUID or by\
    \ label. So from arch install prompt command to mount the root partition, where\
    \ your install will go in my case is:\n\n```\nroot@archiso ~# mount /dev/sda4\
    \    /mnt\n```\n\nnext we will mount our efi partition which in my case is /dev/sda1\
    \ to /mnt/boot\n\nWe need to create that place \"boot\" to mount though, via:\n\
    \n```\nroot@archiso ~# mkdir /mnt/boot\n```\n\nThen mount\n\n```\nroot@archiso\
    \ ~# mount /dev/sda1    /mnt/boot\n```\n\n> Note\n> \n> if you have created partitions\
    \ for home and timeshift then it's going to be where /dev/sdaX is home and for\
    \ timeshift /dev/sdaY: In the case of the my HP 255 G1 laptop as can be seen from\
    \ image on page 10 it was\n> \n> ```\n> root@archiso ~# mkdir /mnt/home\n> root@archiso\
    \ ~# mount /dev/sda4    /mnt/home\n> \n> root@archiso ~# mkdir    /mnt/timeshift\n\
    > root@archiso ~# mount /dev/sda5    /mnt/timeshift\n> ```\n\nNow with partitions\
    \ mounted we will create an fstab entry:\n\n```\nroot@archiso ~# genfstab -U /mnt\
    \ >> /mnt/etc/fstab\n```\n\nIf it moans, you can step by step:\n\n```\nroot@archiso\
    \ ~# mkdir /mnt/etc\nroot@archiso ~# touch /mnt/etc/fstab\nroot@archiso ~# genfstab\
    \ -U /mnt >> /mnt/etc/fstab\n```\n\ngenfstab is a script functionality of the\
    \ Arch ISO, you can check with:\n\n```\nroot@archiso ~# cat /mnt/etc/fstab\n```\n\
    \n> **note**\n> \n> You can re-generate in an appropriate way an fstab entry,\
    \ on your running Arch (if you need or want to), when you get to that point by\
    \ first installing via pacman\n> \n> sudo pacman -S --needed arch-install-scripts\n\
    > \n> # genfstab -U -p / >> /etc/fstab\n> \n> The -U in:\n> \n> ```\n> root@archiso\
    \ ~# genfstab -U\n> ```\n> \n> outputs to fstab partitions referenced by UUID\
    \ and -L would output as labels i.e /dev/sdax\n> \n> You can use:\n> \n> ```\n\
    > root@archiso ~# genfstab -L\n> ```\n> \n> but don't use both otherwise fstab\
    \ will have both type of entries leading to confusion of system.\n\nOK in order\
    \ to download packages to be installed to our root partition, which is currently\
    \ mounted, we now need to connect to the internet. I do it via WiFi, that way\
    \ no short wires attached to hub, you will trip over whilst you type in commands\
    \ in by one hand and write notes with the other. So partitions are mounted and\
    \ will stay mounted, don't worry, connecting to internet will not affect that.\
    \ So presently we are at the Arch ISO install prompt:\n\n```\nroot@archiso ~ #\n\
    ```\n\nThe Arch install ISO has the functionality of being able to show the names\
    \ of WiFi available and not only that but also the capacity to be able to connect\
    \ to them. It can do that because as part of the tools available the Install ISO\
    \ has the availability of the iwd package. At this point I would like to say that\
    \ the install of Arch does require a few steps. At one point once the Arch core\
    \ is installed and a few other bits you can come out of the ISO install and reboot\
    \ to your newly installed system, and before you install the X server xorg and\
    \ graphics stuff, but you will be snookered and come to a dead stop if you don't\
    \ have the package iwd installed, so you can use it to connect to your WiFi and\
    \ also please note a terminal emulator like Alacritty. You need a terminal installed\
    \ in order to be able to use pacman.\n\nAt the root@archiso ~ # type iwctl station\
    \ list\n\n```\nroot@archiso ~ # iwctl station list\n```\n\nThat's going to show\
    \ you the handle name for WiFi, I got wlan0. Note that's a zero at the end. If\
    \ you make a mistake and just type iwctl, and hit the enter your prompt will change\
    \ to [iwd]# to get back to root@archiso ~ #, just type \"exit\". Now let's see\
    \ the WiFi list using the handle name of our wlan0:\n\n```\nroot@archiso ~ # iwctl\
    \  station wlan0 get-networks\n```\n\nyou should now see a list of WiFi's you\
    \ can connect to including yours. You did prepare to know your SSID (i.e WiFi\
    \ name) and its passphrase i.e password didn't you? OK I will represent your WiFi\
    \ name as <your WiFi name> and its passphrase as <passphrase>. Let's Connect:\n\
    \n```\nroot@archiso ~ # iwctl station wlan0 connect <your wifi name>\n```\n\n\
    you will see: passphrase\n\ntype in <passphrase>\n\nhopefully you will now see:\n\
    \n```\nroot@archiso ~ #\n```\n\nAm I connected or not? Let's use Google DNS 8.8.8.8\
    \ type at the Arch ISO prompt\n\n```\nroot@archiso ~ #  ping -c 5  8.8.8.8\n```\n\
    \nyou should now see packets etc, then it will stop after output 5 times. If it\
    \ doesn't type ctrl+c\n\nOK we are now ready to install. At the prompt type\n\n\
    ```\nroot@archiso ~# pacstrap /mnt base linux linux-headers linux-firmware base-devel\
    \ vim nano grub alacritty efibootmgr\n```\n\nif things are tight and you can't\
    \ get it on all one line type in the first line, type \" \\ \" at the end of the\
    \ first line with space either side of \\ you will get a sort of > prompt, type\
    \ in rest of command and hit enter button.\n\nIf you don't install base-devel\
    \ you will find you will not be able to edit sudoers. If you don't install at\
    \ this present time an appropriate editor, nor terminal you will find yourself\
    \ unable to progress, in that you will not be able to launch pacman command if\
    \ you haven't got a terminal, nor edit if you don't have an editor, and you can't\
    \ download an editor because you do not have a terminal mmm; food for thought\
    \ me thinks.\n\nSo vim is an editor, so is nano, you can leave out vim as long\
    \ as you have nano. Grub will be our boot loader, alacritty is a terminal, efibootmgr\
    \ is an utility to change boot order on uefi. Ok hit enter, a load of stuff should\
    \ start downloading. When it's finished it will have installed a core Arch Linux\
    \ system to your root partition. Now we are going to work from the basis of our\
    \ installed core system. How are we going to do that?\n\nEasy we will use chroot\
    \ command, which to all intents and purposes we will be working from our core\
    \ installed system. Now actually it will not be running, so systemd will not be\
    \ running. There is no point in doing commands after chroot as such like:\n\n\
    ```\nsudo timedatectl set-ntp true\n```\n\nbecause the OS and systemd is not running;\
    \ scripts however from the base installed system can function. OK let's Chroot,\
    \ from the Arch ISO install prompt type:\n\n```\nroot@archiso ~# arch-chroot /mnt\n\
    ```\n\nIf you get no errors, then all you will see is a slight change in the way\
    \ the prompt looks like:\n\n```\nroot@archiso : /#\n```\n\nYou don't need to change\
    \ directory into /mnt or anything; any command is going to be in the context of\
    \ being from an installed but non-running system. That means that systemd will\
    \ not be running; nevertheless commands from scripts can be run. Also we can not\
    \ get the status of systemd units, but we can enable units so that they will automatically\
    \ start up at boot time. More on that later. chroot you will type:\n\n```\nroot@archiso\
    \ : /# exit\n```\n\nOK So now there are a few more things we need to download:\n\
    \n```\nroot@archiso : /# pacman -S wireless_tools wpa_supplicant dialog iwd os-prober\
    \ mtools dosfstools networkmanager network-manager-applet\n```\n\nThe above is\
    \ all one line. You can just use pacman to install one at a time, e.g.\n\n```\n\
    root@archiso : /# pacman -S wireless_tools\n```"
  mdcn: "\n那么，你为第一分区（efi）输入的大小应该是类似这样的：+400M\n\n当你输入分区结束的数值后，系统会确认并显示一个分区编号。重复这个过程，再次输入\"\
    n\"；接受默认起始位置，然后输入你想要的分区大小。\n\n当所有分区都创建完成后，输入\"w\"来使更改生效。然后你可以使用第14页的任意一个命令来显示（检查可能更准确）你的磁盘现在是什么样子：\n\
    \n假设我们现在有：\n\n```\n/dev/sda1   用于 efi\n/dev/sda2   用于 swap\n/dev/sda3   用于 root\
    \ 安装。\n```\n\n注意，如果你不设单独的 /home 分区，也没问题。当你通过 useradd 命令创建用户时，用户的目录将在 root 分区内创建。如果你确实有\
    \ /home 分区，那么该命令会在 /home 内创建用户账户。\n\n所以现在我们要格式化分区：\n\n```\nroot@archiso ~#   \
    \  mkfs.fat -F32 /dev/sda1\nroot@archiso ~#     mkswap /dev/sda2\nroot@archiso\
    \ ~#     swapon /dev/sda2\nroot@archiso ~#     mkfs.ext4 -b 2048  /dev/sda3\n\
    ```\n\n上面最后一行中的 -b 2048 是一个标志，告诉系统以每次2048字节的数据块来创建文件系统\n\n你可以使用 e2label 命令来给分区打标签，例如\n\
    \n```\nroot@archiso ~#  e2label /dev/sda6       home\n```\n\n下一阶段，我们要\"挂载\"我们的分区。简单地说，\"\
    挂载\"就是使分区处于可用状态，可以进行操作。\n\n> **注意**\n> \n> 在已安装系统的结构中，通常有名为 \"mnt\" 和 \"run\"\
    \ 的目录。当你把比如U盘插入笔记本时，类似 /dev/sdb1 的分区会自动挂载到 run 目录。我们将要挂载 root 目录，也就是我们的 Arch 安装位置到\
    \ /mnt。Arch 安装系统允许我们将分区挂载到 /mnt。其他分区我们需要创建挂载的位置。Root 将挂载到 /mnt；efi 分区将挂载到 /mnt/boot。稍后详述\n\
    \n所以现在我们要挂载用于 Arch Linux 系统主安装的分区。在我的例子中是 /dev/sda4。我把 efi 分区放在 SWAP 分区前面，这是明智的，因为我可以缩小\
    \ SWAP 分区，然后扩展 efi 分区到创建的空间中。事实证明我确实需要这样做！\n\n在我的分区标签中，我没有 /dev/sda3 分区。这没关系。在\
    \ /etc/fstab 中我已经明确说明了各是什么：\n\n```\n# /dev/sda4 LABEL = /\nUUID=38b6759b-fc65-4606-9414-c1d17bcdc3c4\
    \    /    ext4  defaults    0    1\n```\n\n你可以在 fstab 中通过 UUID 或标签来引用分区。所以从 arch\
    \ 安装提示符命令来挂载 root 分区，你的安装将放在我的例子中是：\n\n```\nroot@archiso ~# mount /dev/sda4  \
    \  /mnt\n```\n\n接下来我们要挂载 efi 分区，在我的例子中是 /dev/sda1 到 /mnt/boot\n\n不过我们需要通过以下命令创建那个叫\
    \ \"boot\" 的挂载点：\n\n```\nroot@archiso ~# mkdir /mnt/boot\n```\n\n然后挂载\n\n```\n\
    root@archiso ~# mount /dev/sda1    /mnt/boot\n```\n\n> 注意\n> \n> 如果你为 home 和 timeshift\
    \ 创建了分区，那么 /dev/sdaX 是 home，timeshift 是 /dev/sdaY：在我的 HP 255 G1 笔记本的情况下，如第10页的图像所示，当时是\n\
    > \n> ```\n> root@archiso ~# mkdir /mnt/home\n> root@archiso ~# mount /dev/sda4\
    \    /mnt/home\n> \n> root@archiso ~# mkdir    /mnt/timeshift\n> root@archiso\
    \ ~# mount /dev/sda5    /mnt/timeshift\n> ```\n\n现在分区已经挂载好了，我们将创建一个 fstab 条目：\n\
    \n```\nroot@archiso ~# genfstab -U /mnt >> /mnt/etc/fstab\n```\n\n如果它报错，你可以一步步来：\n\
    \n```\nroot@archiso ~# mkdir /mnt/etc\nroot@archiso ~# touch /mnt/etc/fstab\n\
    root@archiso ~# genfstab -U /mnt >> /mnt/etc/fstab\n```\n\ngenfstab 是 Arch ISO\
    \ 的一个脚本功能，你可以通过以下命令检查：\n\n```\nroot@archiso ~# cat /mnt/etc/fstab\n```\n\n> **注意**\n\
    > \n> 你可以在你的运行中的 Arch 上以适当的方式重新生成 fstab 条目（如果你需要或想要的话），到那时首先通过 pacman 安装\n> \n\
    > sudo pacman -S --needed arch-install-scripts\n> \n> # genfstab -U -p / >> /etc/fstab\n\
    > \n> genfstab -U 中的 -U：\n> \n> ```\n> root@archiso ~# genfstab -U\n> ```\n> \n\
    > 输出到 fstab 的分区以 UUID 引用，而 -L 会以标签输出，即 /dev/sdax\n> \n> 可以使用：\n> \n> ```\n> root@archiso\
    \ ~# genfstab -L\n> ```\n> \n> 但不要同时使用两者，否则 fstab 会同时包含两种类型的条目，导致系统混乱。\n\n好的，为了下载要安装到我们当前已挂载的\
    \ root 分区的软件包，我们现在需要连接到互联网。我通过 WiFi 连接，这样就没有短线连接到集线器，你不会在一只手输入命令另一只手做笔记的时候被绊倒。所以分区已经挂载并且会保持挂载状态，别担心，连接到互联网不会影响这个。目前我们在\
    \ Arch ISO 安装提示符：\n\n```\nroot@archiso ~ #\n```\n\nArch 安装 ISO 具有显示可用 WiFi 名称的功能，不仅如此，还能连接到它们。它能做到这一点是因为作为可用工具的一部分，安装\
    \ ISO 包含了 iwd 软件包。在这一点上，我想说 Arch 的安装确实需要几个步骤。在某一时刻，一旦 Arch 核心安装完成并装了一些其他东西，你可以退出\
    \ ISO 安装并重启到你新安装的系统，在你安装 X 服务器 xorg 和图形相关的东西之前，但如果你不安装 iwd 软件包，你就会陷入困境并完全停止，这样你就无法用它来连接\
    \ WiFi，另外请注意需要一个像 Alacritty 这样的终端模拟器。你需要安装终端才能使用 pacman。\n\n在 root@archiso ~ #\
    \ 输入 iwctl station list\n\n```\nroot@archiso ~ # iwctl station list\n```\n\n这会显示\
    \ WiFi 的句柄名称，我的是 wlan0。注意最后是个零。如果你不小心只输入了 iwctl，然后按回车，你的提示符会变成 [iwd]#，要回到 root@archiso\
    \ ~ #，只需输入 \"exit\"。现在让我们用 wlan0 的句柄名称来查看 WiFi 列表：\n\n```\nroot@archiso ~ # iwctl\
    \  station wlan0 get-networks\n```\n\n你现在应该能看到可连接的 WiFi 列表，包括你的。你肯定已经准备好知道你的 SSID（即\
    \ WiFi 名称）和它的密码即口令了吧？好的，我会用 <your WiFi name> 代表你的 WiFi 名称，用 <passphrase> 代表它的密码。让我们连接：\n\
    \n```\nroot@archiso ~ # iwctl station wlan0 connect <your wifi name>\n```\n\n\
    你会看到：passphrase\n\n输入 <passphrase>\n\n希望你现在会看到：\n\n```\nroot@archiso ~ #\n```\n\
    \n我有没有连上？让我们使用 Google DNS 8.8.8.8，在 Arch ISO 提示符输入\n\n```\nroot@archiso ~ #  ping\
    \ -c 5  8.8.8.8\n```\n\n你现在应该能看到数据包等，然后输出5次后停止。如果没有，按 ctrl+c\n\n好的，我们现在准备安装了。在提示符输入\n\
    \n```\nroot@archiso ~# pacstrap /mnt base linux linux-headers linux-firmware base-devel\
    \ vim nano grub alacritty efibootmgr\n```\n\n如果空间紧张，无法把所有东西放在一行，输入第一行，在第一行末尾输入\"\
    \ \\ \"，\\ 两侧要空格，你会得到一个类似 > 的提示符，输入命令的剩余部分然后按回车。\n\n如果不安装 base-devel，你会发现无法编辑\
    \ sudoers。如果此时不安装合适的编辑器，也不安装终端，你会发现无法继续，因为如果没有终端你就无法启动 pacman 命令，如果没有编辑器你就无法编辑，而你又不能下载编辑器因为你没有终端；嗯，值得深思。\n\
    \n所以 vim 是个编辑器，nano 也是，你可以不用 vim 只要装了 nano。Grub 将是我们的引导加载程序，alacritty 是终端，efibootmgr\
    \ 是一个用于在 uefi 上更改启动顺序的工具。好的按回车，应该开始下载一大堆东西。完成后，它会将 Arch Linux 核心系统安装到你的 root 分区。现在我们要基于我们安装的核心系统来工作。我们要怎么做呢？\n\
    \n很简单，我们会使用 chroot 命令，总的来说我们会从我们核心安装的系统来工作。现在实际上它不会运行，所以 systemd 不会运行。在 chroot\
    \ 之后做类似这样的命令是没有意义的：\n\n```\nsudo timedatectl:_ set-ntp true\n```\n\n因为操作系统和 systemd\
    \ 没有运行；然而来自基础安装系统的脚本可以运行。好的，让我们 Chroot，从 Arch ISO 安装提示符输入：\n\n```\nroot@archiso\
    \ ~# arch-chroot /mnt\n```\n\n如果没有错误，那你只会看到提示符的外观稍有变化：\n\n```\nroot@archiso :\
    \ /#\n```\n\n你不需要进入 /mnt 目录或做任何事；任何命令都将基于已安装但未运行的系统的上下文。这意味着 systemd 不会运行；然而来自脚本的命令可以运行。另外我们无法获取\
    \ systemd 单元的状态，但我们可以启用单元，使它们在启动时自动启动。稍后再详述。要退出 chroot 输入：\n\n```\nroot@archiso\
    \ : /# exit\n```\n\n好的，现在还有一些东西需要下载：\n\n```\nroot@archiso : /# pacman -S wireless_tools\
    \ wpa_supplicant dialog iwd os-prober mtools dosfstools networkmanager network-manager-applet\n\
    ```\n\n上面是一整行。你也可以用 pacman 一个个安装，例如\n\n```\nroot@archiso : /# pacman -S wireless_tools\n\
    ```\n"
