    我对 Mint 这类 Debian 衍生版的看法是，表面上它很友好，但如果你不小心，它们的包管理系统可能会充满烦恼。我个人不喜欢 Mint 及其同类发行版的包管理系统，那里有一个古怪的标签系统，我觉得很令人困惑。


    此外，我曾多次陷入所谓的"依赖地狱"——就是当你想安装的软件需要下载其他软件（依赖项）时，你的电脑却说不行（是的，就像《小不列颠》里大卫·沃廉姆斯演的那样——"电脑说不行"），因为依赖冲突。长话短说，并不像想象中那么容易解决，而且你可能会暂时发现自己陷入困境、孤立无援。我成功通过命令行解决了这个问题，不过我想我会说先从菜单中的工具开始管理。


    我在 Slackware 上从未遇到过这种问题，在 Arch Linux 上也从未遇到过。在 Arch Linux 中，软件包是旧版本的新版本，并且有一个符合逻辑的标签来表明这一点。所以你要么对新版本满意，要么不满意；但有一种方法可以保留旧版本。因此这是一个非常优雅且简洁的系统。Arch
    在有选择的地方会给你选择权；Arch 在下载时还会始终检查冲突，让你在问题变成麻烦之前就有机会处理。


    Slackware 仍然 heavily 依赖手动安装软件包。这有时相当繁琐，但好处是你将被迫使阅读并了解依赖项，然后安装它们。所以你会学到很多。如果你想看看有哪些发行版可供选择，可以看看：


    https://distrowatch.com/


    各发行版之间的主要区别部分在于历史渊源，即大多数发行版都是基于 Slackware、Redhat、Debian 和 Suse 这几个"父辈"发行版。之后就是安装的难易程度、使用和呈现方式了。此外，有些发行版是所谓的"定点发行版（point
    release）"，另一些则是"滚动发行版（rolling release）"。在"滚动发行版"中，软件包包括新内核都会定期发布，这样你可以边用边更新整个系统。理论上，一旦你安装了
    Arch，就再也不用重新安装它了，只需更新即可。到目前为止，我的经验确实如此。


    "定点发行版"是指 Linux 发行版从旧版本到新版本的重大飞跃。我在 Mint 上成功地从一个大版本更新到另一个大版本；Slackware 也是如此。然而，我听说不少人最终因为各种原因不得不进行全新安装。相信我，那是相当痛苦且耗时的，不得不重新安装/android-email-clients/thunderbird"
    等邮件客户端、网页服务器，以及所有你忘了但一路安装过来的额外软件包。然后还要重新配置它们。而在 Arch 上，我每天花几分钟，在终端提示符下运行一条简单的命令：


    ```

    [andrew@darkstar:~]$ sudo pacman -Syu

    ```


    我每天运行这条命令，它会更新我的整个系统，包括任何新的内核更新。虽然有点重复枯燥，但我只需提醒自己，与定点发行版相比，它能帮我省去多少时间和痛苦。


    ## Arch 安装


    ### 前言


    想当年，如果你想安装 Slackware 这样的系统，你可能会用到好几张软盘，后来光盘出现了（通常作为 Linux 杂志的赠品附赠）。就在几年前，据我记忆中安装
    Slackware 需要 4 张光盘。后来 DVD 出来了，所以你可以用一张 DVD 光盘安装 Slackware Linux。DVD 的内容可以被提取并保存为
    .ISO 文件，这种形式使得分发变得更加容易和方便。


    所以基本上，时至今日，你可以用来启动一个 Live Linux 发行版（和/或）安装它的文件，就只以单个 ISO 文件的形式存在。基本上，ISO 文件的下载链接会列在各个
    Linux 发行版的主页上。通常下载文件存放在世界各地的计算机上，这就是所谓的"镜像"。例如看看


    [https://archlinux.org/download/](https://archlinux.org/download/)


    在上面你会看到不同国家的 Arch Linux 镜像列表；选择离你最近的镜像。下图显示了一个英国的镜像，bytemark。查看文件列表，archlinux-x86_64.ISO
    是你需要用于安装的 ISO。你可以左击链接下载，或者获取链接地址并使用 wget，如果你有使用 Linux 的朋友的话。其他文件用于检查下载的完整性。它只有
    813 MB；这是有原因的；完整安装所需的软件包将在安装过程中下载。


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_10_0.png)


    由于安装过程中会下载大量软件包，你需要良好的互联网连接和带宽。


    我曾在非洲加纳待过一段时间，那里的网络既不稳定又昂贵。我无法安装 Arch，但可以安装 EndeavourOS；那是因为我使用下载管理器在互联网连接恢复后断点续传（试了好几次），而且
    EndeavourOS 有一个无需互联网即可安装的选项。让我们快速看一下如何检查完整性：


    我会通过右击链接并选择"另存为"来保存 sha256sums.txt，这会弹出一个对话框，允许我将文件保存到 Arch OS 的桌面。你可以将 Arch 安装
    ISO 和文本文件都保存到格式化为 ventoy 的 U 盘上，如果你使用的是 Windows，也可以用它来检查。我只是在向你展示程序和一种方法。你可以从以下地址获取
    Windows 的 gui gtkhash：


    https://github.com/tristanheaven/gtkhash/releases/tag/v1.5


    然而，无论你如何检查，关键点是你在 ISO 上生成的校验和应该与 Arch 镜像网站提供的字母数字值匹配


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_11_0.png)


    在上图中，命令：


    ```

    [andrew@darkstar:~/Desktop]$ sha256sum archlinux-x86_64.iso

    ```


    的输出是：329b00c3e8cf094a28688c50a066b5ac6352731ccdff467f9fd7155e52d36cec


    这与使用 sha256 方法的文本匹配


    ## ISO 文件


    所以我们已经确定，如今你只需要一个 Linux ISO 文件就可以安装它；但是你怎么把它用到 USB 上呢？嗯，我在论坛上看到过这样的说法："我买了一个新的
    USB 盘；我把 Linux ISO 放到上面，但无法从它启动"。这是因为据我所知，你可以直接把 Linux ISO 拖到 USB 上就能启动的唯一方式，是使用
    "Ventoy 格式化的 USB 盘"，我们稍后会看一下。所以 ISO 必须"恰当地"放到盘上。将 ISO "恰当地"放到 USB 上的一种方式是使用 Linux
    DD 命令，例如：


    ```

    dd bs=4 if=archlinux-2021.04.01-x86_64.iso of=/dev/sdb  status=progress && sync

    ```


    在上面，dd 是命令，字母 "dd" 后面是命令的选项标志。bs=4 告诉 dd 以 4 字节为块大小写入数据；默认是 512 字节。这是个人偏好的问题。现在很多人使用
    dd 命令时相当紧张，那是因为如果你搞错了，它有可能将你的电脑硬盘 wiped clean（完全擦除）。


    大声念出缩写有助于理解，"if" 的意思是 input file（输入文件）；在我们的例子中，对于 arch 来说，这将是 ISO 文件。注意——命令不喜欢
    if、等于号和文件之间有任何空格。"of" 的意思是 output of file（输出文件），换句话说，你希望 ISO 去哪里。用一点常识，再加上：


    ```

    sudo fdisk -l

    ```


    你可以确定 USB 块设备的正确名称。首先，USB 盘大约在 2-32 GB 之间；如今硬盘从 50 GB 往上都有。让我们看看下面的输出：


    ```

    1) Disk /dev/sdb: 29.72 GiB, 31914983424 bytes, 62333952 sectors

    Disk model: SD/MMC/MS PRO

    Disklabel type: dos


    2) Disk /dev/sdc: 14.46 GiB, 15525216256 bytes, 30322688 sectors

    Disk model: v212w

    2a) Device   Boot Start      End  Sectors  Size Id Type

    /dev/sdc1    8064 30322687 30314624 14.5G  c W95 FAT32 (LBA)

    ```


    在 1) 中有个提示 "SD" 是的，那是连接到我的笔记本电脑上的 SD 卡。在 2) 中，v212w 是我买的 H.P 品牌 USB 盘。所以如果 arch
    ISO 文件在我的主目录中，要"DD"ISO 到上面的 USB，命令将是：


    ```

    dd bs=4 if=archlinux-2021.04.01-x86_64.iso of=/dev/s Sherlock Holmes

    ```


    注意在 2a) 中，这是盘上 /dev/sdc 的 fat32 类型单一分区。你在 DD 命令中不使用分区引用。只用主块设备的信息，在上面这个例子中就是 /dev/sdc

    '
