  md: '# # Timeshift


    So timeshift is a nifty program that can help you revert your PC back to a point
    when Arch was working. In order to do that you need to have a couple of things
    in place:


    +   1) You need to have Timeshift installed on your working computer


    2) You need to have Timeshift on your working computer configured so that it knows
    where to place a "snapshot" of your computer when it was all working properly.


    3) you need to have that snapshot stored somewhere where it can be accessed easily


    4) You also need to have Timeshift available as a default program of a Linux distribution
    which is appropriately installed onto a USB stick.


    So lets address the requirements :


    Not that long ago to install Timeshift on Arg you had to go to the AUR, which
    meant i had to explain how to get a package from the AUR and then install it.
    Now it is available from the main repositories so you can install it using pacman
    .


    ```

    [andrew@darkstar:~]$ sudo pacman -S timeshift

    ```


    A Timeshift snapshot needs to be stored somewhere; a good place is on the hard
    drive of the computer itself. To demonstrate how I set up my computer let me show
    you an image .


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_41_0.png)'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'If you look at the image which its using gParted to show the partitions I have
    on the laptop im writing this book with. You will see I have the usual EFI partition,
    swap, root, home and then lastly I have a partition of file type ext4, of size
    circa 27 Gig dedicated to snapshots for Timeshift.


    Previoisly I have used SB cards and other options to store the Timeshift snapshots,
    but this way its all in one place wont get lost and I have found creating Timeshift
    snapshots very fast with this apparoach. Now my experince is that a single Timeshift
    snapshot is going to take up to circa 8gig of file space. I have allocated enough
    space for roughly 3 snapshots. I dont need more file space since before I create
    a new snapshot I use Tieshift to remove the very oldest snapshot .To set up Timeshift
    select from main menu.Mouse left click on the Wizard icon.


