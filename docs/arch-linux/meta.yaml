  mdcn: "\n现在 Apache 略有不同；基本原理是 root 参与 Apache 的启动过程，然后有一个\"交接\"过程，Apache 最终以 http:http\
    \ 用户和组的身份运行。\n\n在 Linux 上使用 Apache 的一个恼人问题是，作为普通用户，你会发现无法用普通用户权限编辑 http 中的文件。当然，作为\
    \ Web 开发者，这正是你想要，而且需要做的事情。更好的方法是先在开发环境中搭建你的 Web 项目，把问题都处理好，然后再更新到正式服务器，而不是通过 cPanel\
    \ 直接编辑生产环境的文件。\n\n在生产服务器上，目录权限通常是 755，文件权限是 644。\n\n解决编辑问题的一种方法，是将 /srv/http 的组所有权设置为\
    \ http，然后为 http 组添加写权限。同时，将自己作为用户添加到 http 组中。这样你应该就能编辑了。有一点可能会让你栽跟头，那就是你需要注销并重新登录才能生效。我们来操作一下。\n\
    \n如果你忘了自己是谁：\n\n```\n[andrew@darkstar ~]$ whoami\nandrew\n```\n\n让 'andrew' 加入尊贵的\
    \ 'http' 俱乐部：\n\n```\n[andrew@darkstar Desktop]$ sudo usermod -a -G http andrew\n\
    ```\n\n上面这条命令让 andrew 用户加入 http 组，同时保留已加入的其他组成员身份。接下来我们将 /srv/http 的组所有者改为 http，并为该组添加写权限。\n\
    \n```\n[andrew@darkstar Desktop]$ sudo chgrp --recursive http /srv/http\n[andrew@darkstar\
    \ Desktop]$ sudo chmod --recursive g+w /srv/http\n```\n\n记得注销并重新登录，或重启系统，以使更改生效。我们稍后会进一步细化权限。接下来试试\
    \ PHP 文件。一种方法是使用 mv 命令将 index.html 重命名为 index.php。\n\n```\n[andrew@darkstar ~]$\
    \ mv /srv/http/index.html index.php\n```\n\n我们来创建 httpd.conf 的备份：\n\n```\n[andrew@darkstar\
    \ conf]$ sudo cp /etc/httpd/conf/httpd.conf /etc/httpd/conf/httpd_bk.conf\n```\n\
    \n这样如果我们搞砸了任何东西，我们还有原始文件可以参考。\n\n再来看看 /etc/httpd/conf/httpd.conf：\n\n```\n[andrew@darkstar\
    \ ~]$ cat -n /etc/httpd/conf/httpd.conf | less\n```\n\n在第 289-291 行，它基本上是在说只识别\
    \ html 后缀的索引文件。\n\n```\n<IfModule dir_module>\n    DirectoryIndex index.html\n\
    </IfModule>\n```\n\n所以我们要用 nano 编辑该文件，在 index.html 后面添加 index.php。\n\n按 alt+shift+3\
    \ 显示行号，然后到第 290 行，添加 index.php。\n\n现在这些行看起来像这样：\n\n```\n<IfModule dir_module>\n\
    \    DirectoryIndex index.html index.php\n</IfModule>\n```\n\n还有一点工作要做，所以先不要关闭\
    \ nano。到第 66 行，在 LoadModule mpm_event_module modules/mod_mpm_event.so 前面加上 # 号；在第\
    \ 67 行，去掉 LoadModule mpm_prefork_module modules/mod_mpm_prefork.so 前面的 #。\n\n\
    在第 190 行之后添加：\n\n```\nLoadModule php_module modules/libphp.so\nAddHandler php-script\
    \ .php\n```\n\n大约在第 529 行（包含列表的末尾）添加：\n\n```\nInclude conf/extra/php_module.conf\n\
    ```\n\n重启 Apache：\n\n```\n[andrew@darkstar conf]$ sudo systemctl restart httpd\n\
    ```\n\n回顾一下，/srv/http 中的文件是：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    <meta charset=\"utf-8\" />\n<title>untitled</title>\n<meta name=\"generator\"\
    \ content=\"Geany 1.38\" />\n</head>\n<body>\n<h1>hello </h1>\n<?php\n\necho \"\
    <h1>hello from  apache</h1>\";\n\n?>\n</body>\n</html>\n```\n\n现在使用 URL 127.0.0.1\
    \ 的输出是：\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_94_0.png)\n\n## Composer\n\
    \n一个 Web 项目的代码，如果其核心是 CodeIgniter4 的话，很可能会发生变化，你可能想要更新 CI4 的核心，特别是在有安全更新的时候。这就可能带来焦虑。\n\
    \n你希望更新是无缝的、同质的，具有全面的兼容性。这就是 composer 真正发挥作用的地方。关键是，软件的安装方式往往有多种选择。有些提供整个项目的 zip\
    \ 包，同时也可以用 composer 安装。现在，你可能会理所当然地认为，zip 下载的代码和使用 composer 的代码会完全一样。嗯，通常我是个很淡定的人，你可能会看出我是个像\
    \ Ringo Star 那样打招呼风格的人，说着\"和平与爱\"，同时用手比划着 V 字爱的手势。但当我发现，软件开发者对同一版本的代码竟然提供不同的代码时，我\
    \ tends to shoot from the hip（忍不住要开喷）。总之，需要指出的是，如果你用 zip 形式下载 CodeIgniter4，然后想用\
    \ composer 来更新，这恐怕会导致一个让人抓狂的场景，大概不会有任何爱与和平的感觉。所以，用 composer 安装吧，你知道可以用 composer\
    \ 更新，一切都会好的。\n\n说完这些我感觉好多了，正如心理学界所说\"说出来比憋着好\"。那么什么是 composer？在这里阅读完整故事：\n\n[https://getcomposer.org/](https://getcomposer.org/)\n\
    \n简单来说，它是一个你从命令行使用的软件，你可以用一行命令安装另一个完整的软件包，比如 CodeIgniter4，或者同样参与过 Twitter 的前端\
    \ Bootstrap。它会在你的 Web 根目录放置一个 composer.json 文件。该文件以文本形式保存你用 composer 安装了什么的引用。你可以调整文本，以限制软件到特定版本，或者设置成当运行\
    \ \"composer update\" 时，将列出的内容更新到最新版本。\n\n实际上，这意味着如果你的 Web 使用 CodeIgniter4、Bootstrap、PHPMailer\
    \ 等组件，你可以通过终端命令用 composer 保持全部更新。我还得提另一个工具，它能让你避免潜在的愤怒，那就是版本控制。它救过我的次数多到数不清。这个我稍后会说。\n\
    \n你可以在以下网址浏览可以用 composer 安装的包：\n[https://packagist.org/](https://packagist.org/)\n\
    它提到了安装 composer 的步骤；别管那些，我们用 Arch 的方式来安装。\n\n```\n[andrew@darkstar ~]$ pacman\
    \ -Ss composer\nextra/composer 2.5.8-1\n  Dependency Manager for PHP\n\n[andrew@darkstar\
    \ ~]$ sudo pacman -S composer\n[sudo] password for andrew:\nresolving dependencies...\n\
    ```\n\n通过 pacman 安装意味着你可以用 pacman 管理这个包。\n\n最好在你想要的软件网站上 double check 一下，看看是否有任何差异。我注意到\
    \ packagist 上的 composer 安装方式，和我通常采用的方式不同。\n\n## CodeIgniter 4\n\n要通过终端安装最新的 CodeIgniter4，首先切换到要安装的目录。另外一点，趁我还没忘，不要用\
    \ sudo 或 root 来运行 composer；从 $ 提示符下使用它。如果你想把笔记本上的版本更新到生产环境。我发现最省心、零焦虑的方式就是直接在笔记本上用\
    \ composer 更新所有内容。把开发版本以适当的方式打包；这个后面再说，然后 simply upload 打包好的组件，通过 cPanel 解压。新的代码会覆盖旧的\
    \ [note screen shot CI4 on live web]\n\n即使使用 composer，CodeIgniter 也有几个版本，我们来看看，从\
    \ appstarter 开始。我们将安装 appstarter 版本的 CI4，放在 /srv/http 下的子目录中。\n\n```\n[andrew@darkstar\
    \ ~]$ cd /srv/http\n[andrew@darkstar http]$ ls\nindex.php\n\n[andrew@darkstar\
    \ http]$ composer create-project codeigniter4/appstarter joesoapdev --no-dev\n\
    ```\n\n在上面，joesoapdev 将是 http 内子目录的名称，我使用 --no-dev 是因为我想从精简开始，如果需要其他东西可以稍后再加。\n\
    好的，运行没有问题，但有一个提示：\n\n> [\nRunning update with --no-dev does not mean require-dev\
    \ is ignored, it just means the packages will not be installed. If dev requirements\
    \ are blocking the update you have to resolve those problems.\n]\n\n我预期会有 vendor\
    \ 目录，但它缺失了；然而当我从终端切换到 joesoapdev 目录并运行：\n\n```\n[andrew@darkstar joesoapdev]$\
    \ composer update --no-dev\n```\n"
