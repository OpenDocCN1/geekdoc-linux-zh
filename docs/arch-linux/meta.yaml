    OK to use it we will now create an entry in custom.css like so:\n\n```\nh1.amadeus\
    \ {\n    font-family: 'amadeus_regularamadeusRg';\n    color: #ff00ff;\n    font-weight:\
    \ regular;\n    font-size: 5rem;\n    text-shadow: -1px 0 black, 0 1px black,\
    \ 1px 0 black, 0 -1px black;\n    text-align:center;\n}\n```"
  - "[PAGE 126]\n\nAlso in custom.CSS I will also add an entry to have a logo pic\
    \ displayed in the header section. I first need to drop a suitable image into\
    \ public/images I have one called logo3.png .\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_126_0.png)\n\
    \nCustom.CSS after a couple of tweaks now looks like:\n\n```\nh1.amadeus {\n \
    \ font-family: 'amadeus_regularamadeusRg';\n  color: #ff00ff;\n  font-weight:\
    \ regular;\n  font-size: 5rem;\n  text-shadow: -1px 0 black, 0 1px black, 1px\
    \ 0 black, 0 -1px black;\n  text-align:center;\n  }\ndiv.headsection {\n  flex-basis:250px;\n\
    \  background-color:yellow;\n  }\ndiv.contentsection\n{\nbackground-color:biege;\n\
    }\ndiv.footersection\n{\nheight:150px;\nbackground-color:pink;\n}\ndiv.headsection\
    \ div.logo {\n  display: flex;\n  width: 80px;\n  align-self: flex-start; }\n\
    div.headsection div.logo img {\n  left-margin: 1rem;\n  width: 100%; }\ndiv.contentsection\n\
    {\nflex-basis:200px;\n}\n```"
  - "[PAGE 127]\n\nNow i will edit webLayout.php and add the following code to the\
    \ div headsection like so :\n\n```\n<div class =\"headsection\">\n    <div class=\"\
    logo\">\n        <img src =\"<?php echo base_url('images/logo3.png'); ?>\" >\n\
    \    </div>\n    <h1 class =\"amadeus\" >My Web Site </h1>\n</div>\n```\n\nWhats\
    \ displayed for **http://127.0.0.3/home** is as follows:\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_127_0.png)\n\
    \nOK so what can be seen in the image left is that we have a url:\n\n**http://127.0.0.3/home**\n\
    \nA logo is present on the left. Amadeus font is correctly displaying central\
    \ . The Bootstrap Navbar is present and working and we have the CI4 web in development\
    \ mode , so that we can see output at the bottom.\n\nBasically then a starter\
    \ for a web site.\n\nNow its only a matter of developing the controllers , have\
    \ sessions and then you can have a content management system that can be managed\
    \ from a URL of your domain. I know because I've done it. Its a bit outdated and\
    \ downloads basically seas but if your beginning want to download and use it to\
    \ reverse engineer my approach you can . The URL for it is :\n\nhttps://sourceforge.net/projects/codeigniter4cms/\n\
    \nOK The next thing we might look at for web development is a task runner which\
    \ we can use to convert sass to CSS."
  - '[PAGE 128]


    # Grunt


    There are a couple of options for a task runner Gulp being one and Grunt another.
    I find Grunt easier to understand and get working.


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_128_0.png)


    First just to confirm my present file and directory structure at the web root
    of joesoapdev its:


    ```

    [andrew@darkstar http]$ tree -L 1 joesoapdev

    joesoapdev

    ├── Gruntfile.js

    ├── LICENSE

    ├── README.md

    ├── app

    ├── builds

    ├── composer.json

    ├── composer.lock

    ├── node_modules

    ├── package-lock.json

    ├── package.json

    ├── phpunit.xml.dist

    ├── public

    ├── scss  // inside this directory i have a file custom.scss

    ├── spark

    ├── tests

    ├── vendor

    └── writable

    ```


    The next thing one might ask is why bother with SASS ? Bootstrap still makes it
    available by the way so I guess they can see some benefits. Will you can do things
    with sass that you can''t do with plain CSS.


    sass has features such as defining a colour as a variable such as: $turquoise:#16a0a0;


    The colour can be used anywhere in a secs file by just referencing the variable
    name; there are also "mixins" . Have a look at the web site for sass:


    https://sass-lang.com/


    So a task runner does things like converting sass to CSS; it can also refresh
    the browser but we will keep it simple. Thing to remember is that from a development
    point of view for style we are going to switch from adding and developing using
    the custom.CSS to working on custom.sass. Grunt will convert for us the sass in
    custom.sass and out it in custom.CSS . The style sheet reference in web Layout.php
    is still myStyle,CSS and that pulls in custom.css so when you view the landing
    page, you wouldn''t know any difference that sass is being worked on.'
  - '[PAGE 129]


    To have functionality of grunt there is a little preparation needed; it has dependencies
    in order to work.


    System wide via pacman I installed :


    # *sass:*


    ```

    [andrew@darkstar ~]$ pacman -Qi sass

    Name            : dart-sass

    Version         : 1.64.1-1

    ```


    # *Ruby:*


    ```

    [andrew@darkstar ~]$ pacman -Qi ruby

    Name            : ruby

    Version         : 3.0.5-1

    ```


    # *grunt-cli:*


    ```

    [andrew@darkstar ~]$ sudo pacman -S grunt-cli


    resolving dependencies...

    looking for conflicting packages...

    Packages (4) c-ares-1.19.1-1  nodejs-20.4.0-1  nodejs-nopt-7.2.0-1  grunt-cli-1.4.3-2

    ```


    As can be seen that pulled in nodejs .


    # *npm :*


    ```

    andrew@darkstar joesoapdev]$ sudo pacman -S npm

    [sudo] password for andrew:

    resolving dependencies...

    looking for conflicting packages...


    Packages (3) node-gyp-9.4.0-1  semver-7.5.0-1  npm-9.8.1-1

    ```


    After that I changed directories to my web root:


    ```

    [andrew@darkstar ~]$ cd /srv/http/joesoapdev

    and started setting up package.json via

    [andrew@darkstar joesoapdev]$ npm init

    ```'
  - '[PAGE 130]


    We have installed some packages so that elements of functionality are available
    system wide; but we now install local to the dec for grunt using npm. These are
    the commands I issued knowing I''m likely to need the plugins for grunt.


    Note location context of terminal is that its at web root of joesoapdev.


    ```

    [andrew@darkstar joesoapdev]$ npm install grunt --save-dev

    [andrew@darkstar joesoapdev]$ npm install grunt-sass --save-dev

    [andrew@darkstar joesoapdev]$ npm install grunt-contrib-watch --save-dev

    [andrew@darkstar joesoapdev]$ npm install grunt-contrib-copy --save-dev

    [andrew@darkstar joesoapdev]$ npm install grunt-contrib-sass --save-dev

    [andrew@darkstar joesoapdev]$ npm install node-sass --save-dev

    [andrew@darkstar joesoapdev]$ npm install grunt-contrib-jshint --save-dev

    ```


    To recap on architecture of relevant directories and files, a directory called
    scss is at the same level of the public directory.


    In public I have :


    ```

    [andrew@darkstar joesoapdev]$ tree -L 2 public

    public

    ├── css

    │   ├── bootstrap.css

    │   ├── custom.css

    │   ├── custom.css.map

    │   ├── font-face.css

    │   └── myStyle.css

    ├── favicon.ico

    ├── fonts

    │   └── amadeus

    ├── images

    │   ├── header.png

    │   └── logo3.png

    ├── index.php

    ├── js

    │   └── bootstrap.bundle.js

    ├── robots.txt

    └── sounds

    ```


    The only style that is referenced in our web template called webLayout.PHP is
    :


    **myStyle.CSS** .


    Using appropriate syntax other style sheets located at the same level , or should
    I say the contents of the other sheets are pulled in.


    When we run grunt which we are getting to , its going to convert custom.scss located
    in a directory called scss , at same level as public. Convert the sass to css
    and put the output into custom.css


    To do that all we need now is a Grunt file.dis with code appropriate to what we
    want to do and taking into account where things are . The code

    I have to do that is seen on the next page.'
- md: " Contents of Gruntfile.js located at web root of joesoapdev:\n\n```\nmodule.exports\
    \ = function(grunt) {\n  grunt.initConfig({\n    sass: {\n      dist: {\n    \
    \    options: {\n          style: 'compressed',\n        },\n        files: [{\
    \ expand: true,cwd: 'scss', src: ['**/*.scss'], dest: 'public/css', ext: '.css'\
    \ }]\n      },\n    },\n    watch: {\n      sass: {\n        files: ['**/*.scss'],\n\
    \        tasks: ['sass:dist']\n      }\n    }\n  });\n\n  grunt.loadNpmTasks('grunt-contrib-sass');\n\
    \  grunt.loadNpmTasks('grunt-contrib-watch');\n  grunt.registerTask('default',\
    \ ['sassFolder:dist']);\n};\n```\n\nNow the syntax is tricky and if you miss something\
    \ its either going to complain or not work or both. I used this site to check:\n\
    \nhttps://esprima.org/demo/validate.html\n\nThe grunt file has a reference to\
    \ grunt at the top, then some config. Tasks defined, then load the plugins. To\
    \ use grunt terminal should be located web root, which is where the Grunt file\
    \ is and looking at the file: sass:dist is marked as default so either of these\
    \ commands will work:\n\n```\n[andrew@darkstar joesoapdev]$ grunt\nor\n[andrew@darkstar\
    \ joesoapdev]$ grunt sass\n```\n\nThis is the line that tells the system what\
    \ to look for and where:\n\n```\nfiles: [{ expand: true,cwd: 'scss', src: ['**/*.scss'],\
    \ dest: 'public/css', ext: '.css' }]\n```\n\n`**/*.scss` put succinctly tells\
    \ the system to look for any .scss files; since there is custom.scss inside the\
    \ directory called scss same level as the Grunt file. The file is easily found\
    \ with no ambiguity. public/css is saying where the output of converted scss to\
    \ css should go.\n\nThat's probably about it. The basics of a responsive web have\
    \ been set up, and a development environment, using version control.\n\nThere\
    \ will be some fine tweaking such as adding break points to custom fonts which\
    \ in our case is just h1.amadeus. In the custom.scss file this is the basics of\
    \ how you would address that:\n\n```\nh1.amadeus {\n  font-family: 'amadeus_regular\
    \ amadeusRg';\n  color: #ff00ff;\n  font-weight: regular;\n  font-size: 5rem;\n\
    \  text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black;\n  text-align:center;\n\
    }\n```\n\n```\n/* --------------------------------------------------------------------------\n\
    * \n* 1st break point\n* --------------------------------------------------------------------------\n\
    * \n*/\n@media (max-width: 480px)\n{\n    h1.amadeus\n    {\n        font-size:2.0rem;\n\
    \    }\n}\n```\n\n> Note\n> the style you want to change as screen size changes\
    \ goes between the @media opening and closing curly brackets\n\nAdditional breakpoints\
    \ are added as you think seem relevant.\n\nI only add what I want to change which\
    \ is font size. You can of course add how elements stack say from row to column\
    \ etc.\n\n```\n/*\n-----------------------------------------------------------\n\
    \n2nd media break point\n-----------------------------------------------------------\n\
    */\n\n@media (min-width : 481px) and (max-width:767px)\n{\n    h1.amadeus\n  \
    \  {\n        font-size:2.5rem;\n    }\n}\n```\n\nPhone sizes and resolution keep\
    \ changing but I did my last web using:\n\n```\n@media (max-width: 480px)\n@media\
    \ (min-width : 481px) and (max-width:767px)\n@media (min-width:768px) and (max-width:1024px)\
    \ and (orientation:landscape)\n@media (min-width:768px) and (max-width:1024px)\
    \ and (orientation:portrait)\n```\n\nIt's a matter of looking at the size of phones\
    \ people use most then playing with web development tools where you can use screen\
    \ size to test how things look.\n\nThat's about it for now. Hope you enjoyed reading,\
    \ hopefully got something out of it.\n\nGood luck with your OS and web development."
  mdcn: "\n位于 joesoapdev 网站根目录下的 Gruntfile.js 内容如下：\n\n```\nmodule.exports = function(grunt)\
    \ {\n  grunt.initConfig({\n    sass: {\n      dist: {\n        options: {\n  \
    \        style: 'compressed',\n        },\n        files: [{ expand: true,cwd:\
    \ 'scss', src: ['**/*.scss'], dest: 'public/css', ext: '.css' }]\n      },\n \
    \   },\n    watch: {\n      sass: {\n        files: ['**/*.scss'],\n        tasks:\
    \ ['sass:dist']\n      }\n    }\n  });\n\n  grunt.loadNpmTasks('grunt-contrib-sass');\n\
    \  grunt.loadNpmTasks('grunt-contrib-watch');\n  grunt.registerTask('default',\
    \ ['sassFolder:dist']);\n};\n```\n\n现在的语法比较棘手，如果你遗漏了什么，要么会报错，要么无法运行，或者两者兼有。我使用这个网站来检查：\n\
    \nhttps://esprima.org/demo/validate.html\n\n这个 grunt 文件顶部引用了 grunt，然后是一些配置。任务定义完成后，加载插件。要使用\
    \ grunt，终端应位于网站根目录，也就是 Grunt 文件所在的位置；查看文件：sass:dist 被标记为默认任务，因此以下任一命令都可以运行：\n\n\
    ```\n[andrew@darkstar joesoapdev]$ grunt\n或\n[andrew@darkstar joesoapdev]$ grunt\
    \ sass\n```\n\n这一行告诉系统要查找什么以及在哪里查找：\n\n```\nfiles: [{ expand: true,cwd: 'scss',\
    \ src: ['**/*.scss'], dest: 'public/css', ext: '.css' }]\n```\n\n`**/*.scss` 简洁地告诉系统查找任何\
    \ .scss 文件；因为在与 Grunt 文件同一目录下有个名为 scss 的目录，里面包含 custom.scss。文件很容易找到，没有歧义。public/css\
    \ 表示转换后的 scss 到 css 的输出位置。\n\n大概就是这样了。响应式网页的基础已经搭建完成，以及使用版本控制的开发环境。\n\n还会有一些细微的调整，比如为自定义字体添加断点，在我们的例子中就是\
    \ h1.amadeus。在 custom.scss 文件中，这是处理该问题的基本方法：\n\n```\nh1.amadeus {\n  font-family:\
    \ 'amadeus_regular amadeusRg';\n  color: #ff00ff;\n  font-weight: regular;\n \
    \ font-size: 5rem;\n  text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px\
    \ black;\n  text-align:center;\n}\n```\n\n```\n/* --------------------------------------------------------------------------\n\
    * \n* 第一个断点\n* --------------------------------------------------------------------------\n\
    * \n*/\n@media (max-width: 480px)\n{\n    h1.amadeus\n    {\n        font-size:2.0rem;\n\
    \    }\n}\n```\n\n> 注意\n> 随着屏幕尺寸变化，你想要修改的样式需要放在 @media 的开启和关闭花括号之间\n\n你可以根据相关性添加额外的断点。\n\
    \n我只添加了我想要修改的内容，也就是字体大小。当然，你也可以添加元素如何堆叠的样式，比如从行排列改为列排列等。\n\n```\n/*\n-----------------------------------------------------------\n\
    \n第二个媒体断点\n-----------------------------------------------------------\n*/\n\n\
    @media (min-width : 481px) and (max-width:767px)\n{\n    h1.amadeus\n    {\n \
    \       font-size:2.5rem;\n    }\n}\n```\n\n手机尺寸和分辨率不断变化，但我上次做网页时使用了：\n\n```\n\
    @media (max-width: 480px)\n@media (min-width : 481px) and (max-width:767px)\n\
    @media (min-width:768px) and (max-width:1024px) and (orientation:landscape)\n\
    @media (min-width:768px) and (max-width:1024px) and (orientation:portrait)\n```\n\
    \n这需要了解人们最常使用的手机尺寸，然后使用网页开发工具进行调试，在其中可以使用屏幕尺寸来测试显示效果。\n\n目前就这些了。希望你喜欢阅读这篇文章，并能有所收获。\n\
    \n祝你的操作系统和网页开发一切顺利。\n"
