    127.0.0.1   localhost

    ::1          localhost

    127.0.1.1   darkstar.localdomain   darkstar

    127.0.0.3   joesoapdev

    ```


    > *注意*

    > 如果你在电脑上进行网页开发，你需要编辑 /etc/hosts。在上面最后一行中，我添加了：

    > 127.0.0.3   joesoapdev

    > 现在随着网页服务器运行，如果我直接输入到网页浏览器地址栏：127.0.0.3，那么我的网页开发项目 joesoapdev 的着陆页将会显示的


    ## 安装引导加载程序


    这是人们会感到紧张的地方，因为如果出错的话。让我们回顾一下；我们的 efi 分区，在我的情况下是第一个，/dev/sda1，目前在所有实际用途中都挂载到了
    /boot。这是因为根目录挂载到了 /mnt，并且我们已经 chroot 了 /mnt。换句话说，/boot 是一个相对路径，会被找到，因为我们的 chroot
    提示符是在 /mnt 的上下文中工作的。那么，安装 grub 作为我们引导加载程序的命令将是：


    ```

    root@archiso : / #  grub-install --target=x86_64-efi   --efi-directory=/boot --bootloader-id=GRUB   --recheck

    ```


    这说得通吗？grub-install 是安装 GRUB 的命令，--target=x86_64-efi 表示这是一台 64 位电脑，主板是 UEFI。--efi-directory=/boot
    表示放置引导条目的位置是 /boot，因为那是我们挂载 efi 分区的地方。该命令会创建一个 efi 目录，所以不用担心那个。那 "--bootloader-id=GRUB"
    呢？嗯，那只是一种分配标签的方式，你可以使用 --bootloader-id=MyArchInstall 如果你喜欢的话


    然后最后


    ```

    root@archiso : / # grub-mkconfig   -o    /boot/grub/grub.cfg

    ```


    上面那行是 "o" 不是 0（零）。这会创建 grub 配置内容。收尾工作，我们最好创建一个 root 密码，我们在启动我们沉睡的已安装操作系统时需要它


    ```

    root@archiso : / #  passwd root

    ```


    输入你的 root 密码并记下来。剩下的就是安装桌面、安装显卡驱动、创建用户账户。还要编辑 sudoers，使用户能够以相当于 root 权限的方式运作。还会有一些其他安装后的调整。稍后我将涉及维护任务。


    你会发现当你的 Arch 操作系统运行时，它会产生日志报告，这些确实很有用，但会不断累积。文件会在你的用户账户缓存目录中累积，如果你决定进行网页开发，那么
    Apache 日志的产生也会让日志开始累积。我将解决所有这些问题，并向你介绍 systemd。还有什么，嗯，我们需要安装防火墙。可能还有其他一些事情。你可能感到有点不知所措，但好消息是，当一切设置好并运行后，实际上没什么要做的，除了更新你的系统，这作为用户只需一个命令。


    ```

    sudo  pacman -Syu

    ```


    在使用 pacman 之前，有一个小命令，用来初始化密钥等。还要安装一个电子邮件账户。然后我将回顾我发现有用的 pacman 命令。


    ## 后记


    嗯，我们有了 Arch 的核心安装；我们现在可以使用 "exit" 命令退出 chroot，关机，重启，并能够进行 root 的文本登录。麻烦是我们可能会遇到一些问题；我们启动的
    Arch 安装 ISO 有 IWD 软件包的可用性，这是一个允许我们通过 WIFI 连接互联网的软件包。你可以安装 IWD，而且只要我们安装了终端模拟器，我们就可以从我们安装并运行的系统中完成所有事情。但那是更多的工作要做。所以在这个阶段，我们将留在
    chroot 中继续。


    如果你查看文件 /etc/pacman.conf，它说：


    > 注意：在首次使用 pacman 之前，你必须运行 `pacman-key --init`；然后可以使用 `pacman-key --populate archlinux`
    将本地密钥环填充所有官方 Arch Linux 打包者的密钥。


    所以我们现在可以做。


    ```

    root@archiso : / # pacman-key --init

    root@archiso : / # pacman-key --populate archlinux

    root@archiso : / # pacman -Syy

    ```


    现在让我们添加一个名为 gina 的用户，这样当我们启动我们的新 Arch 时，我们可以用非 root 模式工作。


    ```

    [root@darkstar:~]# useradd -m -G wheel -s /bin/bash gina

    ```


    为 gina 创建密码


    ```

    [root@darkstar:~]# passwd gina

    ```


    它会要求你再输入一次。现在我们有了一个用户，而且总是最好避免以 root 身份工作。麻烦是我们的用户权限有限。我们需要编辑 sudoers 列表。对于 sudoers
    列表，你必须小心一点。这是一个当正确编辑后，会给 wheel 组中的用户赋予权限的地方，通过使用 sudo。它总是用 visudo 命令完成。在上面的行中，我规定我想使用
    nano 编辑器来执行该操作。让我们编辑 sudoers：


    ```

    root@archiso : / # EDITOR=nano visudo

    ```


    使用 nano 移除你看到的引用 wheel 的第一行中的 #，即 %wheel ALL=(All) All，按键盘键 Ctrl + o，然后按回车键写入文件，然后按
    Ctrl + x 退出。我想说两件事。你可能会发现你以用户身份登录有困难，但以 root 身份登录却没有。有几个原因。如果你编辑了 sudoers，但没有安装
    "sudo"，你会发现安装该软件包后才能登录。另一个是 systemd-homed 可能没有在运行，用例如以下方式检查：

    '
