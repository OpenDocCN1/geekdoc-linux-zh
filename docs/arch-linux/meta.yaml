  md: "Now I guess the first question is going to be:\n\nOK we know Linux operating\
    \ systems in the form of an ISO file will boot up and run from a USB stick, but\
    \ which Linux distribution candidates look good in that they are responsive in\
    \ terms of being fast, have a lot of stuff already installed and they also work\
