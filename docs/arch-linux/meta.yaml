  md: "# Virus scanning\n\nI have never had a virus on my PC but i have picked up\
    \ viruses onto a fat32 formatted USB stick, which if shared with friends running\
    \ windows could be a problem. To scan a USB mounted on Arch at /run/media/andrew/SPARE\
    \ using clamav would be something like :\n\n```\n[andrew@darkstar:~]$ sudo clamscan\
    \ -r -v --infected --remove=yes /run/media/andrew/spare\n```\n\nif you want to\
    \ scan your own computer it would be something like :\n\n```\nsudo clamscan -r\
    \ -v --infected --remove=yes --exclude-dir=/sys/ --exclude-dir=/proc/ --exclude-dir=/dev/\
    \ /\n```\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_71_0.png)\n\nThe reason for\
