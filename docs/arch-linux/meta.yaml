  md: '![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_98_0.png)


    For security code igniter has been developed so that the only contents that can
    be accessed from the web are those inside the public directory. If you intend
    to only have CI4 and nothing else in your main hosting, then the way you would
    set it up is that the contents inside the public directory would go into your
    main web hosting root.


    You can bundle the other components app, writable and vendor, into one directory
    which you will place one level above the main hosting directory. you would then
    edit index.PHP which is inside the public directory. The line below is the one
    you would modify


    ```

    require FCPATH . ''../app/Config/Paths.php'';

    ```


    You would reference the name of your directory containing app,writable and vendor
    in the above line, say if you called it "other components" to something like:


    ```

    require FCPATH . ''../othercomponents/app/Config/Paths.php'';

    ```


    Now with my setup of a sub-directory its slightly different. Using cPanel on my
    hosting i have to use add on domains so that the domain name points to the hosting
    and make the document root:


    ```

    domainName.org/public

    ```


    If using subdomains the way it works on my hosting anyone using one of my domains
    the URL will point to the public directory inside the subdomain in the diagram
    above'
