  md: '# Composer


    The code of a web project if at its core, lets say its CodeIgniter4, likely to
    change and you may want to update the core of CI4 particularly if their have been
    security updates. Herein lies potential for angst.


    You want an update to be seamless , homogeneous with across the board comparability.
    This is where composer really helps. key thing is that there are often options
    on the ways software can be installed. Some offer a zip of the whole thing and
    at the same time an install using composer. Now you may be forgiven for thinking
    that the code in the zip download will be exactly the same if composer is used.
    Well I''m normally I''m sure you can tell a chilled out bloke with greetings similar
    in style to Ringo Star , saying "peace and love" whilst gesturing with the hand
    V love sign. But when i find that I can be messed up in that the guys that develop
    software offer differing code for the same version of code , well i tend to shoot
    from the hip. Anyway the thing to point out is that if you download CodeIgniter4
    using the zip form and then thin you can update with composer its going to lead
    to a hair pulling scenario probably devoid of any feelings of love and peace.
    So install with composer , you know you can update with composer and everything
    will be fine.


    I feel so much better after that , as they say in psychology circles "better let
    it out than keep it in ". So what is composer ? Well read the whole story here
    :


    [https://getcomposer.org/](https://getcomposer.org/)


    Simply put its a piece of software you use from the command line that you can
    with one line install the complete bundle of another package of software like
    CodeIgniter4 or the front end Bootstrap from the same guys that were involved
    with Twitter I believe. It places a composer.json file at your web root. The file
    holds references in the form of text as to what you used composer to install.
    You can tweak the text , so that you can restrict software to a particular version
    or have it so that when "composer update" is ran it will update whats listed to
    the latest version.


    In practice what it means is if you have your web using CodeIgniter4, Bootstrap,
    PHPMailer


    components then you an keep the whole lot up to date using composer via terminal
    commands.

    I will have to mention another tool which will keep you away from potential apoplexy
    is version control. That has saved my bacon more times than I can remember. I
    will come to that later.


    You can browse for packages that can be installed using composer at:

    [https://packagist.org/](https://packagist.org/)

    It mentions the procedure for installing composer; forget what it says lets do
    it the arch way'
