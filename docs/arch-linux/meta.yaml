  - '[PAGE 32]


    # Install Graphical Environment - the Desktop


    Before Arch I had tried quite a few Linux Bistros and their Desktops. I like things
    plain and simple but with functionality. XFCE was fine on Slackware; i just couldn''t
    get on with Desktops where things bounce up and down. On Arch I have tried GNOME,
    Budgie, LXDE , open box but still prefer Cinnamon. Cinnamon is actually a fork
    of Gnome, but as default you can have icons like home, trash etc on your Desktop.


    To use the Cinnamon Desktop on Arch, you also need a display manager, and a graphical
    login which is the greeter. We also need xorg and the right drivers for your graphic
    hardware.


    So i previously mentioned we would need that information and showed you how to
    get it using inxi . Mine is : AMD Stoney [Radeon R2/R3/R4/R5 Graphics]


    So to install Cinnamon Desktop for Arch that has AMD graphic hardware.


    ```

    root@archiso : / # pacman -S xorg

    ```


    Note in the above line the word "xorg" is actually representing in terms of pacman
    a group download . So the command above will install all the x server stuff. next
    I''m going to install the graphics drivers for my laptop. I have previously given
    the other options if you need the drivers for Intel or Nvidia.


    ```

    root@archiso : / # pacman -S xf86-video-amdgpu

    ```


    Now we will install the Cinnamon Desktop and needed pkgs


    ```

    root@archiso : / # pacman -S cinnamon lightdm lightdm-gtk-greeter

    ```


    Now lets remind ourselves were we are at and whats running. We are working from
    the Arch ISO install system, in chroot, so in the context of being in our installed
    system. Now a little mention of systemd . What is systemd? Well put succinctly
    its a system and service manager for your operating system. problem is, its not
    actually running. Never mind the way that it works is that you can enable units
    now from chroot of the none running system, so that the units will atomically
    start when the system boots.


    The most important will be so that we can get our graphical Desktop up. So lets
    enable our desktop manager, in my case lightdm. That''s all you need to enable
    to be able to get a graphical login and your Desktop up.


    ```

    root@archiso : / # systemctl enable lightdm

    ```


    you should see a link being created. That''s how systemd does its enabling


    ```

    root@archiso : / # systemctl enable NetworkManager

    ```'
