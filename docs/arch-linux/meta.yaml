- img_proc: true
  md: 'OK in order to download packages to be installed to our root partition, which
    is currently mounted we now need to connect to the internet. I do it via WiFi,
    that way no short wires attached to hub,you will trip over whilst you type in
    commands in by one hand and write notes with the other .So partitions are mounted
    and will stay mounted, don''t worry, connecting to internet will not affect that.
    So presently we are at the Arch ISO install prompt:


    ```

    root@archiso ~ #

    ```


    The Arch install ISO has the functionality of being able to show the names of
    WiFi available and not only that but also the capacity to be able to connect to
    them. it can do that because as part of the tools available the Install ISO has
    the availability of the iwd package. At this point I would like to say that the
    install of Arch does require a few steps. At one point once the Arch core is installed
    and a few other bits you can come out of the ISO install and reboot to your newly
    installed system, and before you install the X server xorg and graphics stuff,
    But you will be snookered and come to a dead stop if you don''t have the package
    iwd installed, so yo can use it to connect to your WiFi and also please note a
    terminal emulator like Alacritty. You need a terminal installed in order to be
    able to use pacman.


    At the root@archiso ~ #

    type iwctl station list


    ```

    root@archiso ~ # iwctl station list

    ```


    That''s going to show you the handle name for WiFi , i got wlan0 .Note that''s
    a zero at the end.

    If you make a mistake and just type iwctl ,and hit the enter your prompt will
    change to [iwd]#

    to get back to root@archiso ~ # , just type " exit" .Now lets see the WiFi list
    using the handle name of our wlan0 :


    ```

    root@archiso ~ # iwctl  station wlan0 get-networks

    ```


    you should now see a list of WiFi''s you can connect to including yours. You did
    prepare to know your SSID (i.e WiFi name) and its passphrase i.e password didn''t
    you ? OK I will represent your WiFi name as <your WiFi name> and its passphrase
    as <passphrase>

    lets Connect:


    ```

    root@archiso ~ # iwctl station wlan0 connect <your wifi name>

    ```


    you will see: passphrase

    type in <passphrase>

    hopefully you will now see:


    ```

    root@archiso ~ #

    ```


    Am i connected or not? Lets use Google DNS 8.8.8.8 type at the Arch ISO prompt


    ```

    root@archiso ~ #  ping -c 5  8.8.8.8

    ```


    you should now see packets etc, then it will stop after output 5 times . If it
    doesn''t type ctrl +c'
