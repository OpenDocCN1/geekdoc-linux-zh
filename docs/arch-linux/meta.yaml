- img_proc: true
  md: 'OK we are now ready to install . At the prompt type


    ```

    root@archiso ~# pacstrap /mnt base linux linux-headers linux-firmware base-devel
    vim nano grub alacritty efibootmgr

    ```


    if things are tight and you can''t get it on all one one line type in the first
    line , type " \ " at the end of the first line with space either side of \ you
    will get a sort of > prompt, type in rest of command and hit enter button.


    If you don''t install base-devel you will find you will not be able to edit sudoers
    .If you don''t install at this present time an appropriate editor , nor terminal
    you will find yourself unable to progress , in that you will not be able to launch
    pacman command if you haven''t got a terminal, nor edit if you don''t have an
    editor, and you can''t download an editor because you do not have a terminal mmm;
    food for thought me thinks.


    So vim is a editor, so is nano, you can leave out vim as long as you have nano.
    Grub will be our our boot loader, alacritty is a terminal, efibootmgr is an utility
    to change boot order on uefi. Ok hit enter, a load of stuff should start downloading.
    When its finished it will have installed a core Arch Linux system to your root
    partition. Now we are going to work from the basis of our installed core system.
    How are we going to do that ?


    Easy we will use chroot command , which to all intents and purposes we will be
    working from our core installed system. Now actually it will not be running ,
    so systemd will not be running . There is no point in doing commands after chroot
    as such like:


    ```

    sudo timedatectl set-ntp true

    ```


    because the OS and systemd is not running; scripts however from the base installed
    system can function. OK lets Chroot, from the Arch ISO install prompt type:


    ```

    root@archiso ~# arch-chroot /mnt

    ```


    If you get no errors , then all you will see is a slight change in the way the
    prompt looks like:


    ```

    root@archiso : /#

    ```


    You don''t need to change directory into /mnt or anything; any command is going
    to be in the context of being from an installed but none running system. That
    means that systemd will not be running; nevertheless commands from scripts can
    be run. Also we can not get the status of systemd units, but we can enable units
    so that they will automatically start up at boot time. More on that later. chroot
    you will type:


    ```

    root@archiso : /# exit

    ```


    OK So now there are a few more things we need to download :


    ```

    root@archiso : /# pacman -S wireless_tools wpa_supplicant dialog iwd os-prober
    mtools dosfstools networkmanager network-manager-applet

    ```


    The above is all one line. You can just use pacman to install one at a time Eg


    ```

    root@archiso : /# pacman -S wireless_tools

    ```'
