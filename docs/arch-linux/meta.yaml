  md: "A controller really should do what its supposed to do and controlling minimum\
    \ of bloat; so we will shift most of the code from it to a model.So i create a\
    \ model called Datamodel.PHP which physically goes into : \n/srv/http/joesoapdev/app/Models\n\
    \nThe code of the model is as follows:\n\n```\n<?php namespace App\\Models;\n\
    use CodeIgniter\\Database\\ConnectionInterface;\nuse CodeIgniter\\Model;\nclass\
    \ Datamodel extends Model\n{\n    protected $table     = 'items';\n    protected\
    \ $primaryKey = 'Id';\n    protected $allowedFields = ['Item','Price'];\n    protected\
    \ $db;\n    public function getAll()\n    {\n        $this->db = \\Config\\Database::connect();\n\
    \        return $this->findAll();\n    }\n}\n```\n\nCouple of things to note the\
    \ Model class has some built in features so we will use them to get the data.\
    \ We define the table name, name of primary key and other fields.IN the controller\
    \ we will instantiate the above model and using the instantiated object we will\
    \ get data.The code in the controller Datacontroller is now:\n\n```\n<?php namespace\
    \ App\\Controllers;\nuse CodeIgniter\\Controller;\nuse \\App\\Models\\Datamodel;\n\
    class Datacontroller extends BaseController\n{\n    public function data()\n \
    \   {\n        $handle= new Datamodel();\n        $result= $handle->getAll();\n\
    \        $data =[\n            'info'=> ' checking stage of development',\n  \
    \          'theData'=>$result,\n        ];\n        echo view('info',$data);\n\
    \    }\n}\n```"
