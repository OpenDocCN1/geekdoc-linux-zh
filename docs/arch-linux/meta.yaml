  - '[PAGE 65]


    # Arch User Repository (AUR)


    The package manager pacman is used to get software from the main official repositories.
    But there is repository well worth looking at which has software provided by the
    users of Arch Linux. The approach to getting software from the AUR is a little
    different from the usual pacman approach.


    So i will go the the approach and stages of getting brave web browser from the
    AUR , installing it and how to update it .IN a previous edition of this book I
    went through the process of getting Timeshift from the AUR, but it as since been
    made available directly using pacman .


    The web site for Arch linin is at :

    [https://archlinux.org/](https://archlinux.org/)

    At the top of the menu on the right there is a menu link to the AUR; obviously
    you needed to have included getting a web browser at the time of installing Linux
    are I think subsequently very soon after the main install.


    Icing on the menu lin takes you to :

    [https://aur.archlinux.org/](https://aur.archlinux.org/)

    On the right of that page is a search text box. Writing "brave" without the quotation
    marks gives this page:


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_65_0.png)


    | Name | Version | Votes | Popularity | Description |

    |---|---|---|---|---|

    | brave-bin | 1:1.65.114-1 | 762 | 14.87 | Web browser that blocks ads and trackers
    by default |

    | brave-beta-bin | 1.66.83-1 | 40 | 0.69 | Web browser that blocks ads and trackers
    by default |

    | brave | 1.52.129-1 | 145 | 0.26 | Web browser that blocks ads and trackers by
    default |

    | brave-nightly-bin | 1.67.26-1 | 25 | 0.10 | Web browser that blocks ads and
    trackers by default |

    | brave-git | 1.25.33.g0126e4e-1 | 28 | 0.03 | A web browser that stops ads and
    trackers by default |

    | brave-extension-bitwarden-git | 2024.2.1.r14420.g7240285-1 | 1 | 0.01 | Bitwarden
    browser extension for Brave |

    | profile-sync-daemon-brave | 2022.08.18-1 | 3 | 0.00 | Brave browser support
    for profile-sync-daemon |

