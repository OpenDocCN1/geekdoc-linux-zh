    # Introduction to Linux


    The opinion I hear from people who know nothing about Linux is that its too complicated
    to be worth the trouble. I don''t accept the argument that its beyond the capacity
    of most people. Lets go back in history to a point in time when one car existed,
    and people on horseback were looking at it with a sideways cowboy look. What might
    they say?


    I couldn''t work with a car; it doesn''t eat grass. Looks extremely complicated
    to me, it will never catch on.


    Well it seems Millions were prepared to embrace a slight learning curve to drive
    a car, if there was the right motivation. So what does Gnu/Linux have to offer
    as a motivation? The main observation to me was that when I was using Windows
    and started exploring something like like web development and needed new software
    in order to be able to do it, was I had to fork out money every time. Then more
    often than not, fork out again when a major new version was released. Same with
    the operating system. For example Windows 98 or XP , security updates no longer
    available forcing you to buy the next newest version.


    With Gnu/Linux the operating system is in the vast majority of Bistros is "free
    as in beer" and "free as in speech". Same for software. That''s possible because
    due to the fact that a GNU licence allows someone to have access to the kernel
    code for instance and i guess from there a vast community grew, with people collaborating
    . So basically we all contribute, that way people may use my contributions and
    I use their theirs. Its really all very transparent, ethical and friendly. Well
    i say that; just don''t go on the Slackware forum of Linuxquestions.org and ask
    "is Slackware dead".


    Now technically the word Linux refers specifically to software called the "kernel"
    and other supporting software that works around and with the kernel is referred
    to as GNU. It so happens that a lot of code that would find itself being used
    in conjunction with the kernel was already written by people such as Richard Stallman.
    If you want to give a nod of acknowledgement to GNU and Richard Stallman you would
    properly say call Slackware GNU/Slackware which Richard Stallman pointed out to
    me in an email.


    Now there are many different manifestations of GNU/Linux , the common element
    being the kernel but other software has been written that interacts with it so
    that the feel, look and approach is different. This is output in the form of different
    Linux Bistros such as Mint, Debian ,Slackware, Red Hat and Arch for instance.


    There is an associated time line with Debian and Slackware Linux, they being two
    of the oldest still in existence. As to which you would want to start with its
    a matter of horses for courses. Slackware is good if you want to be forced to
    learn how to use the command line and about the system and others like Mint tend
    to be (in essence) more beginner friendly.


    I have seen in the forums that people have managed to go straight from windows
    to Arch. I''m going to try to help people coming straight from Windows to be able
    to install Arch Linux. Everything I write will be from my perspective as a normal
    user, using stuff I have found useful'
- md: ' My take on Debian derivatives like Mint is that on the surface its friendly
    but their package management system can be fraught with angst, if you are not
    careful. Personally I don''t like the package management system of Mint and its
    cousins, there is a quirky labelling system which I find confusing.


    Also I have found myself several times in whats called "dependency hell" That''s
    when the software you want to install needs other software to be downloaded with
    it (dependencies ) but your computer says it can not do it ( yeah just like David
    Walliams in little Britain -"computer says no") , because of dependency conflicts.
    To cut a long story short not as easy to sort out as it might think and you can
    find yourself momentarily up a creek without a paddle. I managed to do that using
    a command line, I guess I would say start with management via tools from the menu.


    I never had that problem with Slackware and never had that problem with Arch Linux
    either. With Arch Linux a package is a newer version of the old one and has a
    logical label showing the fact. So either your happy with the newer version or
    not ; there is a way to keep the old version. So a very elegant and succinct system.
    Where there are choices you will be given them with Arch ; Arch also always checks
    for conflicts as it downloads them, giving you the choice to address the issue
    before it becomes a problem.


    Slackware still relies heavily on manual package installation. Its quite tedious
    at times, the upside is that you will be forced to look at, and read up on dependencies
    then install them. So you will learn a lot. To have a gander at whats available
    out there in terms of Distros you can have a look at:


    https://distrowatch.com/


    The main differences between Distros is partly historical in that most Distros
    are based on parents ones being Slackware, Redhat, Debian and Suse. After that
    its about ease of installation, usage and presentation. Also some Distros are
    whats called "point release" and others "rolling release" . With a "rolling release"
    packages including new kernels are released regularly, so that you update the
    whole system as you go along. In theory once you install Arch you will never have
    to install it again, only update it. So far my experience is that''s true.


    A point release is where a Linux Distro has a quantum leap from an old version
    to a new one. With Mint I have managed to update from one major version to another;
    same with Slackware. However I read quite a few people end up having to do a clean
    install, for one reason or another. That believe me is a major pain and time consuming
    , having to re-install email client such as Thunderbird, web server , all the
    extra packages you forgot about but have installed along the way. Then have to
    configure them. With Arch I spend a few minutes every day and run one simple command
    in a terminal from the terminal prompt :


    ```

    [andrew@darkstar:~]$ sudo pacman -Syu

    ```


    That command which i run every day, updates my whole system including any new
    kernel updates. Although somewhat repetitively tedious, I just remind myself how
    much time and pain it helps me avoid compared to a point release distro.


    ## Arch Installation


    ### Preamble


    Back in the day if you wanted to install say Slackware you might have used several
    floppy disks, then CD''s came along (commonly attached to a Linux magazine as
    a freebie). Just a few years back it took 4 CD''s from my memory to install Slackware.Then
    DVD''s came after, so you could install Slackware Linux from one DVD disk. The
    contents of a DVD could be taken and saved into an .ISO file, this form allowed
    for much easier and convenient distribution.


    So basically as of today the file that you can use to boot up a live Linux distribution
    (and or) install it comes in the form of just a single ISO file. Basically download
    links for the ISO files are listed on the main web pages of the particular Linux
    distribution. Often the download files are held on computers all over the world,
    and this is whats know as "mirrors". Eg Look at


    [https://archlinux.org/download/](https://archlinux.org/download/)


    At the above you will see a list of mirrors for Arch Linux in different Countries;
    pick the mirror nearest to where you are. The image below shows one of the UK
    mirrors, bytemark. Looking at the file list archlinux-x86_64.ISO is the ISO you
    want for install. You can left click on the link to download it or get the link
    address and use wget if you have a friend with Linux. The other files are for
    checking the integrity of the download. Its only 813 MB; there is a reason for
    that ; the required packages for your full install will be downloaded during the
    install process .


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_10_0.png)


    Because a lot of packages will be downloaded during the install, you will need
    a good internet connection and band width.


    I had a spell in Ghana, Africa where internet is both flaky and expensive. I was
    unable to install Arch but could install EndeavourOS; that''s because I used a
    download manager to pick up after internet connection was re-established (it took
    several goes ) and EndeavourOS has an option of install without Internet. lets
    have a quick look at checking integrity:


    I will save the sha256sums.txt byxu right clicking on the link and using "save
    link as" that brought up a dialogue allowing me to save the file to my Desktop
    of Arch OS in this case. You could save both the Arch install ISO and the text
    file to a ventoy formatted stick and use Windows OS if that''s what your using
    to check. I''m just showing you the procedure and one way of doing it. You can
    get a gui gtkhash for windows from


    https://github.com/tristanheaven/gtkhash/releases/tag/v1.5


    The key point however you do the check is that the checksum produced from your
    ISO should match the alpha-number given by the Arch Mirror site


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_11_0.png)


    in the above the output from the command :


    ```

    [andrew@darkstar:~/Desktop]$ sha256sum archlinux-x86_64.iso

    ```


    is : 329b00c3e8cf094a28688c50a066b5ac6352731ccdff467f9fd7155e52d36cec


    which matches the text using sha256 method


    ## ISO files


    So we have established that nowadays all you need is a Linux ISO file in order
    to install it; but how are you going to use it with a USB? Well I''ve seen on
    forums quotes like "I got a new USB stick; i put on it a Linux ISO but couldn''t
    boot from it". That''s because to my knowledge the only way you can just drag
    and drop a Linux ISO onto a USB and it will boot, is with a "Ventoy formatted
    USB stick", which we will have a look at a little later. So the ISO has to be
    put on the stick "appropriately". One way to "appropriately" put the .ISO onto
    a USB is using the Linux DD command example :


    ```

    dd bs=4 if=archlinux-2021.04.01-x86_64.iso of=/dev/sdb  status=progress && sync

    ```


    In the above dd is the command and after the letters "dd" are flags options for
    the command. bs=4, is telling dd to write data in block size of 4 bytes; the default
    is 512 bytes. A matter of preference. Now a lot of people get quite anxious using
    the dd command and that is because if you get it wrong, it has the potential to
    wipe your computer hard drive clean.


    It helps to quote aloud fully the shorthand, "if" simply means input file; in
    our case for putting arch that''s going to be the ISO file. Note- commands do
    not like any space between the if, equals and the file. "of" means output of file,
    in other words where do you want the ISO to go to. With a bit of common sense
    and the use of :


    ```

    sudo fdisk -l

    ```


    You can work out the right name for the block device USB, For a start USB sticks
    are around 2-32 gig; hard drives these days go from 50 GIG upwards. Lets look
    at the output below :


    ```

    1) Disk /dev/sdb: 29.72 GiB, 31914983424 bytes, 62333952 sectors

    Disk model: SD/MMC/MS PRO

    Disklabel type: dos


    2) Disk /dev/sdc: 14.46 GiB, 15525216256 bytes, 30322688 sectors

    Disk model: v212w

    2a) Device   Boot Start      End  Sectors  Size Id Type

    /dev/sdc1    8064 30322687 30314624 14.5G  c W95 FAT32 (LBA)

    ```


    In 1) There is a hint "SD" yep that''s my SD card which is attached to my laptop.
    In 2) v212w that''s the brand of H.P USB stick I bought. So if the arch ISO file
    was in my home Directory, to "DD" the ISO to the USB above it would be :


    ```

    dd bs=4 if=archlinux-2021.04.01-x86_64.iso of=/dev/sdc

    ```


    Note In 2a) That''s the single partition of type Fat32 on the stick /dev/sdc.
    You don''t use partition references in the DD command. Only details of the main
    block device in this case above it would be /dev/sdc'
