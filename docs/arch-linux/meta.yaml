- img_proc: true
  md: '# Install Boot Loader


    There is where people get nervous because if it goes wrong . Lets recap ; our
    efi partition in my case the first one, /dev/sda1 is currently mounted to all
    intents and purposes to /boot. That''s because root is mounted to /mnt and we
    have chrooted /mnt. In other words /boot is a relative relative path which will
    be found because our chroot prompt works from the context of being in /mnt . OK
    then the command to install grub as out boot loader will be:


    ```

    root@archiso : / #  grub-install --target=x86_64-efi   --efi-directory=/boot --bootloader-id=GRUB   --recheck

    ```


    Does that make sense ? grub-install is the command to install GRUB , --target=x86_64-efi
    says the PC is a 64bit one and the motherboard is UEFI . --efi-directory=/boot
    says the place to put boot entries is /boot because that''s where we mounted the
    efi partition. The command will create an efi directory so don''t worry about
    that. What about " --bootloader-id=GRUB" . Well that''s just a means of allocating
    a label, you can have --bootloader-id=MyArchInstall if you like


    Then lastly


    ```

    root@archiso : / # grub-mkconfig   -o    /boot/grub/grub.cfg

    ```


    That''s an "o" in the above line not a 0 (zero). That will create the grub con
    fig stuff. Finishing Off ,we had better create a root password, which we will
    need on booting up or dormant installed OS


    ```

    root@archiso : / #  passwd root

    ```


    type in your password for root and write it down. Whats left is to install a Desktop
    , install graphic drivers , create a user account. Also edit sudoers so that a
    user can function with the equivalent of root powers. There will be some other
    post install tweaks. Further on I will approach maintenance tasks.


    You will find when your Arch operating system is running it produces log reports,
    which are really useful but can build up. Stuff builds up in your user account
    cache directory and if you decide to do web development , then logs will also
    start building up from the production of Apache logs. I am going to address all
    of that and also introduce you to systemd. What else, well we need to install
    a firewall .Probably a few other things. You might be feeling a tad overwhelmed
    but the good news is that when things are set up and running, really there is
    little to do, except update your system which will just take one command as a
    user.


    ```

    sudo  pacman -Syu

    ```


    before using pacman there is a little command, to initiate keys etc. Also install
    an email account.Then I will review pacman commands I have found useful.'
