  md: '# # Arch Installation


    # ## Preamble


    Back in the day if you wanted to install say Slackware you might have used several
    floppy disks, then CD''s came along (commonly attached to a Linux magazine as
    a freebie). Just a few years back it took 4 CD''s from my memory to install Slackware.Then
    DVD''s came after, so you could install Slackware Linux from one DVD disk. The
    contents of a DVD could be taken and saved into an .ISO file, this form allowed
    for much easier and convenient distribution.


    So basically as of today the file that you can use to boot up a live Linux distribution
    (and or) install it comes in the form of just a single ISO file. Basically download
    links for the ISO files are listed on the main web pages of the particular Linux
    distribution. Often the download files are held on computers all over the world,
    and this is whats know as "mirrors". Eg Look at


    [https://archlinux.org/download/](https://archlinux.org/download/)


    At the above you will see a list of mirrors for Arch Linux in different Countries;
    pick the mirror nearest to where you are. The image below shows one of the UK
    mirrors, bytemark. Looking at the file list archlinux-x86_64.ISO is the ISO you
    want for install. You can left click on the link to download it or get the link
    address and use wget if you have a friend with Linux. The other files are for
    checking the integrity of the download. Its only 813 MB; there is a reason for
    that ; the required packages for your full install will be downloaded during the
    install process .


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_10_0.png)'
