    \ partitions\n\n![gParted showing HP laptop hard drive partitions](img/0740bd8ebbd6ea87ab1327b2fc9132c4_20_0.png)\n\
    \nThe above image is of my H.P laptop hard-drive, I was on a bit of a tight budget\
