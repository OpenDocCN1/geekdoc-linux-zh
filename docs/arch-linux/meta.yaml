    \ `/opt` 目录。使用它时，你需要记住的是：编辑 `/etc/php/php.ini` 据我所知对 XAMPP 绝对没有任何影响，也不会起作用。这是因为\
    \ XAMPP 实际上并没有被\"安装\"。它作为一个\"嵌入式\"系统工作，所以自带了所需的全部内容。如果你使用 XAMPP，可能会非常困惑，因为在你的实际系统上安装和配置的内容与嵌入式\
    \ XAMPP 中的内容之间存在 dichotomy（二分对立）。\n\n我以前玩过 XAMPP，而且使用原生 Apache 确实有其学习曲线。我将尝试带你走过这个过程，并让\
    \ CodeIgniter4 运行起来。\n\n简单说一下 HTML5 和 PHP 的呈现与样式。回顾一下，PHP 基本上与 HTML 相同，只是文件扩展名为\
    \ `.php`，并且包含以下形式的代码块：\n\n```\n<?php       ?>\n```\n\n简单说一下呈现方面，过去几年变化很大，以前为了获得理想的外观，不得不在表格中嵌套表格，简直是一种\"\
    灾难\"。层叠样式表（CSS）的发展带来了巨大的改变。现在关于选择可能会让人不知所措。但就像所有事情一样，从一小步开始。你可以将样式放在 `<head>`\
    \ 和 `</head>` 之间，像这样：\n\n```\n<style>\nh3{\n        color:maroon;\n}\n</style>\n\
    ```\n\n或者在 `<head>` 和 ener一致，应该是 `</head>` 之间放一行链接到外部样式表的代码：\n\n```\n<link rel=\"\
    stylesheet\" type=\"text/css\" href=\"style.css \" />\n```\n\n以上假设样式表位于网站根目录，并使用\"\
    相对 URL\"。这变得越来越复杂，所以我觉得最好让别人去做这项工作，直接利用他们已有的成果。我自己就用 Bootstrap，参见 [https://getbootstrap.com/docs/3.3/getting-started/](https://getbootstrap.com/docs/3.3/getting-started/)\n\
    \n稍后我会看看如何在 CodeIgniter PHP 框架中使用 Bootstrap。\n\n我们继续，原始 PHP 还可以，但对于大型 Web 应用，到了某个时候你会发现*只见树木不见森林*。然后你会开始想，我需要某种逻辑架构、结构以及使用方法。\n\
    \n嗯，这已经由创建 PHP 框架（如 CodeIgniter4）的开发者们完成了。\n\nCodeIgniter 由 Rick Ellis 开发，于 2006\
    \ 年由 EllisLab 发布。它曾经非常流行，后来失宠并有点迷失了方向。\n\n**CodeIgniter ®**\n\n是 CodeIgniter 基金会的注册商标，于\
    \ 2019 年从英属哥伦比亚理工学院转让而来。CodeIgniter 商标由 CodeIgniter 基金会所有，并可能已注册。CodeIgniter 目前正在积极开发中，截至\
    \ 2023 年版本为 4.3.6。\n\n## [免责声明]\n\n我在本出版物中撰写的关于 CodeIgniter 的任何内容均未经 CodeIgniter\
    \ 基金会或任何 CodeIgniter 开发者认可。\n\n还有其他 Web 系统，比如 WordPress，它是一个内容管理系统（CMS）；我很喜欢它的插件系统，并且自己也写过一个插件。我的立场是，WordPress\
    \ 主要面向不编程的人群。如果你看看它的内部工作原理，从 PHP 的 OOP 类::方法角度来看，并不是很优雅。\n\nWordPress 确实有大量的插件目录，这是它的主要吸引力所在。我喜欢\
    \ CodeIgniter 的地方在于，我发现很容易编写自己的 PHP 类及其方法来实现我想要的功能，并能将它们无缝集成到框架中使用。使用 CodeIgniter，你可以轻松拥有以\
    \ PHP 类及其方法形式的插件。你可能需要自己编写或找人来做，但我看到越来越多可用于 CodeIgniter 的代码正在出现，比如 Shield，这是一个用于身份验证和授权的代码。\n\
    \n作为后续 Web 开发的一部分，我将介绍如何安装 CodeIgniter、从其中获取一些基本功能、进行版本控制，并使其具有响应式网页设计，无论是在笔记本电脑还是手机上查看。首先我们需要一个开发环境，在本例中将是\
    \ Apache Web 服务器。\n\n## Apache Web 服务器\n\n计算机领域不断进步，随着\"云\"的出现而变化——这是某个营销大师想出的花哨术语，实际上等同于\"\
    嘿，你的东西仍然在别人的电脑上，即使虚拟化是其中的一部分\"。\n\n所以随着云计算的兴起，场景正在发生变化，但 Apache 仍然占据着很大的 Web 托管份额；主要是\
    \ Apache 运行在 Linux 上。如果你开始在自己的机器上玩代码和 Apache，当你将网站部署到实时托管环境时会很有帮助。\n\n好的，我们将安装\
    \ Apache Web 服务器，然后逐步修改配置，让它按照我们想要的方式为我们工作。稍后我将使用 composer 安装 CodeIgniter，设置好以便可以访问着陆页并链接到数据库。\n\
    \n目前，我们先安装 Apache 并让它运行起来，提供单个 `index.php` 文件，然后我们再继续。我们必须处理权限问题，我认为这往往会让人们倾向于使用\
    \ XAMPP，如果他们发现自己无法按想要的方式让它工作的话。我想起来会补充其他内容。\n\n安装 Apache：\n\n```\n[andrew@darkstar\
    \ ~]$ sudo pacman -S apache php-apache\n```\n\n启用它，使其在每次启动时自动运行：\n\n```\n[andrew@darkstar\
    \ ~]$ sudo systemctl enable httpd\n```\n\n我不想重启，但仍想运行 Apache，所以我要启动它。\n\n```\n\
    [andrew@darkstar ~]$ sudo systemctl start  httpd\n```\n\n注意，启用/启动服务的方法采用以下形式：\n\
    \nsystemctl \"动词\" \"服务单元\"\n\n让我们检查一下状态：\n\n```\n[andrew@darkstar ~]$ systemctl\
