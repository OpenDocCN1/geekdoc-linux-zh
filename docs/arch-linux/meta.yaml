  md: "Contents of Gruntfile.js located at web root of joesoapdev:\n\n```\nmodule.exports\
    \ = function(grunt) {\n  grunt.initConfig({\n    sass: {\n      dist: {\n    \
    \    options: {\n          style: 'compressed',\n        },\n        files: [{\
    \  expand: true,cwd: 'scss', src: ['**/*.scss'],  dest: 'public/css', ext: '.css'\
    \  }]\n      },\n    },\n    watch: {\n      sass: {\n        files: ['**/*.scss'],\n\
    \        tasks: ['sass:dist']\n      }\n    }\n  });\n\n  grunt.loadNpmTasks('grunt-contrib-sass');\n\
    \  grunt.loadNpmTasks('grunt-contrib-watch');\n  grunt.registerTask('default',\
    \ ['sass:dist']);\n};\n```\n\nNow the syntax is tricky and if you miss something\
    \ its either going to complain or not work or both. I used this site to check:\n\
    \nhttps://esprima.org/demo/validate.html\n\nThe grunt file has a reference to\
    \ grunt at the top, then some config. Tasks defined , then load the plugins .\
    \ To use grunt terminal should be located  web root, which is where the Grunt\
    \ file is and looking at the file: sass:dist is marked as default so either of\
    \ these commands will work:\n\n```\n[andrew@darkstar joesoapdev]$ grunt\nor\n\
    [andrew@darkstar joesoapdev]$ grunt sass\n```"
  merge: -1
  pgno: 131
- img_proc: true
  md: "This is the line that tells the system what to look for and where:\n\n```\n\
    files: [{ expand: true,cwd: 'scss', src: ['**/*.scss'], dest: 'public/css', ext:\
    \ '.css' }]\n```\n\n**/*.scss put succinctly tells the system to look for any\
    \ .scss files; since there is custom.scss inside the directory called scss same\
    \ level as the Grunt file.dis the file is easily found with no ambiguity. public/css\
    \ is saying where the output of converted scss to css should go.\n\nThat's probably\
    \ about it . The basics of a responsive web have been set up, and a development\
    \ environment, using version control.\n\nThere will be some fine tweaking such\
    \ as adding break points to custom fonts which in our case is just h1.amadeus.\
    \ In the custom.scss file this is the basics of how you would address that :\n\
    \n```\nh1.amadeus {\n  font-family: 'amadeus_regularamadeusRg';\n  color: #ff00ff;\n\
    \  font-weight: regular;\n  font-size: 5rem;\n  text-shadow: -1px 0 black, 0 1px\
    \ black, 1px 0 black, 0 -1px black;\n  text-align:center;\n}\n```\n\n```\n/* --------------------------------------------------------------------------\n\
    * \n* 1st break point\n* --------------------------------------------------------------------------\n\
    * \n*/\n@media (max-width: 480px)\n{\n    h1.amadeus\n    {\n        font-size:2.0rem;\n\
    \    }\n}\n```\n\n> Note\nthe style you want to change as screen size changes\
    \ goes between the @media opening and closing curly brackets"
  merge: -1
  pgno: 132
- img_proc: true
  md: "Additional breakpoints are added as you think seem relevant\n\nI only add what\
    \ I want to change which is font size. You can of course add how elements stack\
    \ say from row to column etc\n\n```\n/*\n-----------------------------------------------------------\n\
    \n2nd media break point\n-----------------------------------------------------------\n\
    */\n\n@media (min-width : 481px) and (max-width:767px)\n{\nh1.amadeus\n    {\n\
    \        font-size:2.5rem;\n        }\n\n}\n```\n\nphone sizes and resolution\
    \ keep changing but I did my last web using :\n\n```\n@media (max-width: 480px)\n\
    @media (min-width : 481px) and (max-width:767px)\n@media (min-width:768px)and\
    \ (max-width:1024px) and (orientation:landscape)\n@media (min-width:768px)and\
    \ (max-width:1024px) and (orientation:portrait)\n```\n\nIts a matter of looking\
    \ at the size of phones people use most then playing with web development tools\
    \ where you can use screen size to test how things look .\n\nThat's about it for\
    \ now .Hope you enjoyed reading , hopefully got something out of it .\n\nGood\
    \ luck with your OS and web development"
  merge: -1
  pgno: 133
