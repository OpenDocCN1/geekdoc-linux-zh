- img_proc: true
  md: 'So now we are now going to mount the partition which will be for the main install
    of the Arch Linux system. In my case its /dev/sda4 I put my efi partition in front
    of the SWAP partition, which was prudent since I could reduce the SWAP partition
    and then expand the efi partition into the created space. It tuned out i needed
    to do it !


    On my labelling of partitions I don''t have an /dev/sda3 partition. That''s OK
    in /etc/fstab I have it clarified what is what :


    ```

    # /dev/sda4 LABEL = /

    UUID=38b6759b-fc65-4606-9414-c1d17bcdc3c4    /    ext4  defaults    0    1

    ```


    You can reference in fstab partitions either by UUID or by label. So from arch
    install prompt command to mount the root partition , where your install will go
    in my case is:


    ```

    root@archiso ~# mount /dev/sda4    /mnt

    ```


    next we will mount our efi partition which in my case is /dev/sda1 to /mnt/boot


    We need to create that place "boot" to mount though , via:


    ```

    root@archiso ~# mkdir /mnt/boot

    ```


    Then mount


    ```

    root@archiso ~# mount /dev/sda1    /mnt/boot

    ```


    > Note


    [


    if you have created partitions for home and timeshift then its going to be where
    /dev/sdaX is home and for timeshift /dev/sdaY: In the case of the my HP 255 G1
    laptop as can be seen from image on page 10 it was


    ```

    root@archiso ~# mkdir /mnt/home

    root@archiso ~# mount /dev/sda4    /mnt/home


    root@archiso ~# mkdir    /mnt/timeshift

    root@archiso ~# mount /dev/sda5    /mnt/timeshift

    ```


    ]'
  merge: -1
