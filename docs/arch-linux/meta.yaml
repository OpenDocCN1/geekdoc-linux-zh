  - '[PAGE 50]


    So inside the Ventoy directory , there are 2 directories one called "ISO" and
    the other "ventoy". When i first played with Ventoy i found that confusing; you
    have a USB stick with the label "Ventoy" and a directory inside called "ventoy"
    . Inside the ISO directory is where you drag and drop your Live Linux ISO files.


    In the Ventoy directory there is a single file called ventoy.json and a persistence.dat
    file at the same level as the ventoy & ISO directories.


    By default the Ventoy system will look first in any directory called "ISO" for
    ISO files. You have to create the persistence.dat using scripts in the unpacked
    files you got from :


    [https://github.com/ventoy/Ventoy/releases](https://github.com/ventoy/Ventoy/releases)


    Using Linux to create the dat file using a terminal where, you have changed directories
    to the unpacked Ventoy download it would be:


    ```

    sudo ./CreatePersistentImg.sh -l persistence -c persistence.conf

    ```


    That will create a dat file called "persistence.dat" inside the unpacked ventoy
    download file, at the same place where the script CreatePersistentImg.sh resides.
    If you get any failure to run run this command from a terminal prompt Eg:


    ```

    [andrew@darkstar:~]$ sudo chmod +x CreatePersistentImg.sh

    ```


    That will give execute permission to the script


    Any issues you get with read write to the persistence.dat file you can use:


    ```

    [andrew@darkstar:~]$ chmod 666 persistence.dat

    ```


    So now just drag and drop the CreatePersistentImg.sh onto your Ventoy formatted
    stick.'
  - '[PAGE 51]


    The last bit is to create a ventoy.json file with some data, which basically lets
    the Ventoy system know which Linux ISO is going to use the dat file. You can use
    a text editor to both create the ventoy.json file and populate it with what I''m
    going to show you bellow.


    contents of my ventoy.json file:


    ```

    {

    "control": [

    { "VTOY_DEFAULT_MENU_MODE": "0" },

    { "VTOY_filt_DOT_UNDERSCORE_FILE": "1" },

    { "VTOY_DEFAULT_SEARCH_ROOT": "/ISO" }

    ],


    "persistence": [

    {

    "image": "/ISO/kali-linux-2022.4-live-amd64.iso",

    "backend": "/persistence.dat"

    }

    ]


    }

    ```


    The first few lines describe basic things for the Ventoy system. I for instance
    define that the default place to look for ISO files in in the ISO directory. In
    the persistence block i state the ISO that should use the persistence.dat file.
    Its an easy file to get wrong. You can use json verify software on the web to
    make sure syntax is correct. I think new versions even come with a new script
    to help with that.


    Now because it has been configured for kali to have persistence you could if you
    wanted actually update the OS on the USB stick via:


    ```

    kali@kali:~$  sudo apt update

    kali@kali:~$ sudo apt full-upgrade    -y

    ```


    However using lateral thinking its best to just replace the ISO file with an updated
    one and re-generate the dat file'
  - '[PAGE 52]


    # # Post Install


    # ## Initial Look at Maintenance


    I don''t know about you but when i am given or I purchase something new, I have
    a bit of a Donald Rumsfeld moment. With a Linux Operating system on say a laptop,
    the known knows are, my laptop needs to have power in order for my Linux operating
    system to keep running. Do I have my laptop battery re-charging unit plugged in
    and its working.


    Then there are known unknowns ; i guess I will have to keep the operating system
    updated. Lastly - anything i will have to do to keep my operating system trim
    or that may cause an issue.


    Well on updating your system , I previously mentioned you have to initiate the
    pacman keys. The the main total system update command for Arch Linux is simply:


    ```

    [andrew@darkstar:~]$ sudo pacman -Syu

    ```


    Now you can find out, what can cause a problem by experience but I will tell you
    what I have found needed attending to.I guess we are going to have a cursory look
    at systemd and it associated useful commands. I will use a metaphor of a car and
    a car stater engine.


    With a car you can imagine that if there is a bit of inertia, then to get a car
    engine going it needs a bit of a push so to speak. That''s putting it quite simply;
    but it is a fact that cars have a "starter engine" that does just that.


    OK now if we apply loosely the same idea to a computer , you might imagine that
    to get a computer operating system up and running there are going to be various
    steps and stages.


    Without being too complicated computers use virtual memory or RAM; in order for
    a computer operating system to be running, well first it needs to be loaded, read
    and executed.With older Linux Distros (and still today Slackware 15) the initial
    program was init ; that runs the the /etc/rc.d/rc.S script which enables the virtual
    memory and mounts the file systems.


    Nothing stays still they say and another approach to starting and managing a computer
    operating system was introduced . Systemd was developed by Lennart Poettering
    and Kay Sievers in 2010 and has since become the default init system for many
    Linux distributions. As mentioned one of the oldest Linux distributions which
    does not use systemd is Slackware.Now I was a user and contributor (still am technically)
    to maintaining slackbuilds; on the forums comments can be seen along the lines
    of "i would rather die first than use systemd".

    Yep nerds can get a little bit melodramatic at time. Time for an admission, I
    quite like systemd in that its quite straight forward to use very productively'
  - '[PAGE 53]


    So to round off, systemd (for those Linux distros that use it) is a system that
    initiates the running of a Linux operating system and helps manage it. With the
    management system is something called journalctl .You will see quite a few options
    if you run this command :


    ```

    [andrew@darkstar:~]$ journalctl --help

    ```


    Anyway you could imagine that the developer of the systemd system would definitely
    thought about how a user is going to get information about anything going on .
    Well systemd produces all the time log files. They are extremely useful because
    if you get any glitch with your system you can use commands to filter the logs
    to help find out , what the problem is.


    From a maintenance problem , the amount of log files is quite considerable and
    they take up disc space. When you get a problem your definitely going to look
    at recent log files and then really you don''t need those old log files. Being
    succinct you only really need to keep an amount of recent log files, because you
    looked at the old ones connected to problems didn''t you! Run this command to
    see how much journal log files are taking up:


    ```

    [andrew@darkstar:~]$ journalctl --disk-usage

    ```


    So this command you definitely need to run maybe weekly:


    ```

    [andrew@darkstar:~]$ sudo journalctl --vacuum-size=10M

    ```


    What the above command from a terminal does is reduce the volume of journal log
    records to 10 megabytes. Later I will looking at commands i have found to be useful
    including leveraging the journalctl command.


    Now another area that can eat up disk space is connected to the Arch Linux updating
    process.Run this command :


    ```

    [andrew@darkstar:~]$ ls /var/cache/pacman/pkg

    ```


    You will see a load of files; an example of a file in my system is :


    ```

    webkit2gtk-2.40.0-2-x86_64.pkg.tar.zst

    ```


    For your information zst file like the above is exactly the same type of file
    produced when you get a PKGBUILD file from the ARCH AUR for example I got a PKGBUILD
    for sqliteman from


    https://aur.archlinux.org/packages?O=0&K=sqliteman

    The file produced was :


    ```

    sqliteman-1.2.2-12-x86_64.pkg.tar.zst

    ```


    So you might guess that zst files are a package form in which software can be
    installed from. The idea of /var/cache/pacman/pkg is that it keeps copies of older
    zst files in case you get a glitch with the most current. You can revert to the
    older working version.However you only need to keep a few recent versions.'
  - '[PAGE 54]


    We can from a terminal use a utility called paccache which will help us trim the
    number of versions of packages kept in /var/cache/pacman/pkg to the number of
    versions we want. But first we need to install a package that its part of.


    Install pacman-contrib via:


    ```

    [andrew@darkstar ~]$ sudo pacman -S pacman-contrib

    ```


    Now to trim all packages in /var/cache/pacman/pkg to say 2 versions:


    ```

    [andrew@darkstar:~]$ sudo paccache -rk 2

    ```


    The command will also tell you have much space it has freed up; now taking into
    account you need to run pacman -Syu frequently then you should also run paccache
    frequently. A quick word why you need to run pacman -Syu often. it hasn''t happened
    to me but to put it succinctly Arch Linux is a rolling release and boy is there
    a quick turnaround on new versions of the kernel and packages.


    In theory if you get too far behind there build up a glitch of packages that can
    not be updated , because you never got the updates for the ones you need. Another
    consideration I have found is the size of the update and the number of packages
    involved. Due to budget I got a laptop with a very small hard drive of 60Gig.i
    have everything I need but at times things have got tight. So it prudent of me
    to get updates often and thus in smaller amounts.


    After updates i then trim /var/cache/pacman/pkg


    The other place that bloat can build up is in your user .cache space. To see usage
    use this command:


    ```

    sudo du -sh ~/.cache/

    ```


    To clean your user cache , logged in as a normal user:


    ```

    [andrew@darkstar:~]$ rm -rf ~/.cache/*

    zsh: sure you want to delete all 8 files in /home/andrew/.cache [yn]? y

    ```'
- md: " before I go further and I am assuming you installed the Cinnamon Desktop lets\
    \ tweak that a bit. I like a straight forward Desktop with Icons on it. With Cinnamon\
    \ there's a little work to do, to enable that. It just involves installing xdg-user-dirs,\
    \ the running xdg-user-dirs as root. After that go to the cinnamon menu, preferences,\
    \ Desktop and move slider to enable which icon can be seen.\n\nNow will install\
    \ xdg-user-dirs, so we can have our directories displayed\n\n```\n[root@darkstar:~]#\
    \ pacman -S xdg-user-dirs\n```\n\nand run the command below to give us that option.\n\
    \n```\n[root@darkstar:~]# xdg-user-dirs-update\n```\n\nOK this is now a good time\
    \ to shutdown and then reboot and login as a none root user, using our newly installed\
    \ graphical environment\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_55_0.png)\n\
    \n## Systemd in more depth\n\nIf you think about a car, basically full confidence\
    \ comes, when you feel you can understand what controls the car and are also to\
    \ do so. Systemd is running from the off. I want to try and demystify systemd\
    \ for you a bit. if you can engage with it, then i think you will feel more comfortable\
    \ with your OS. In the older SysV system there were scripts which when ran and\
    \ could be referred to as \"daemons\". So for instance in Slackware Linux you\
    \ have /etc/rc.d/rc.wireless from the Slackware site is says:\n\nrc.wireless This\
    \ script sets up PCI, USB, and 32-bit Cardbus wireless devices - NOT 16-bit PCMCIA\
    \ cards (those are configured in /etc/pcmcia/). Basically if you wanted to get\
    \ your WiFi working, you would first have to give the rc.wireless script executive\
    \ permission to run, then it would automatically run as a \"daemon\" on the next\
    \ boot. That's why Slackware was good for learning, things didn't work until you\
    \ made them work.\n\nSystemd has its own concepts, the way it refers to things\
    \ and also the approach to get things enabled and running. What i would like to\
    \ do is give an idea of whats involved, by creating our very own very small cog\
    \ in the systemd ecosystem and do it in a way that is acknowledged, accepted and\
    \ works. Systemd putting it succinctly manages an OS service and system by way\
    \ of acting on units which can be defined as mostly service. A unit is defined\
    \ by way of a \"unit file\" which is a file with plain text ini-style file and\
    \ contains configuration directives that describe the unit and define its behaviour.\
    \ We will create a unit file. For the full Monty see example man commands. All\
    \ systemd files that are part of the your installed Linux operating system can\
    \ be found in /lib/systemd/system/ To get an output you can use from a terminal\
    \ prompt for example:\n\n```\n[andrew@darkstar:~]$ ls /lib/systemd/system/\n```\n\
    \nleave those in /lib/systemd/system/ alone and don't touch them. I'm going to\
    \ show how to first create a script, that will be used to trim the quantity of\
    \ our journal logs so you won't have to do it manually. We will create a systemd\
    \ unit which will control the script and give information on it. This will give\
    \ a basic introduction to systemd and a basic understanding of how things work.\
    \ You will see that new systemd units files will be stored in /etc/systemd/system\n\
    \nAfter that i think a look at how you can leverage systemd to get information\
    \ and how. We will need a text editor to do that, I use geany. I use it for PHP\
    \ programming and other functions. If you don't have it, then lets install it\
    \ and its plugins using pacman:\n\n```\n[andrew@darkstar:~]$ pacman -S geany geany-plugins\n\
    ```\n\nSo lets look at our script that we are going to produce. A command entered\
    \ at any terminal emulator, that we can use to first see journal log volume and\
    \ then keep the volume of journal log data on our system are:\n\n```\njournalctl\
    \ --disk-usage\nsudo journalctl --vacuum-size=10M\n```\n\nIn the above case I\
    \ reduce volume of journal logs to 10 megabytes. That's the ones that are in storage.\
    \ But we can also put that command into a script.\n\nWhen the script is run, it\
    \ will also run the command. because we will locate the script to /usr/bin it\
    \ will have root powers. Lets use geany to create a script that we will use systemd\
    \ to manage launch geany from your menu and left mouse click file->new on the\
    \ geany menu\n\nInto the blank space type the 2 lines below:\n\n```\n#!/bin/bash\n\
    journalctl --vacuum-size=3M\n```\n\nThen file->save as -> clean.sh that will save\
    \ a file clean.sh in your home directory. Next because we are going to move the\
    \ script to /usr/bin we want to make sure it has the right ownership and permissions\
    \ so open a terminal and run:\nWhen you open a terminal by default it opens from\
    \ the context of being in your home directory. Geany should also have stored script\
    \ to home, so you should have to change directories.\n\n```\n[andrew@darkstar:~]$\
    \ sudo chown root:root clean.sh\n[andrew@darkstar:~]$ sudo chmod +x clean.sh\n\
    ```\n\nThe above 2 commands gave permission to root and also made the script executable.\n\
    \nnext we will move the script clean.sh to /usr/bin via command:\n\n```\n[andrew@darkstar:~]$\
    \ sudo mv clean.sh /usr/bin/\n```\n\nNow we will create a systemd unit to make\
    \ use of the script. It will by the appropriate, and standardised way of using\
    \ systemctl allow us to enable, disable get status etc of our unit, which in turn\
    \ controls the use of the script.\n\nWe will call our unit \"clean\" its full\
    \ name in terms of systemd will be \"clean.service\". OK from a terminal lets\
    \ create our service.\n\n```\nsudo systemctl edit --force --full clean.service\n\
    ```\n\nwhat that did on my system is bring up a nano text editor with the destination\
    \ for the file to be saved being /etc/systemd/system\ninto the blank screen of\
    \ nano type exactly as seen:\n\n```\n[Unit]\nDescription=example use of systemd\
    \ unit files\n[Service]\nExecStart=/bin/bash /usr/bin/clean.sh\nEnvironment=SYSTEMD_LOG_LEVEL=debug\n\
    [Install]\nWantedBy=multi-user.target\n```\n\nSave the file in the Normal way\
    \ for nano\n\nCtl + o\nhit return key\nCtrl +x\n\nLets see if our service can\
    \ be found\n\n```\n[andrew@darkstar:~]$ systemctl list-unit-files\n```\n\nLets\
    \ explain the three elements in the service unit\n\n[Unit] - contains generic\
    \ options that are not dependent on the type of the unit. These options provide\
    \ unit description, specify the unit's behaviour, and set dependencies to other\
    \ units.\n\n[Service] - here i define the path to our script and its name that\
    \ when run when we either use a command start, or at boot up if we use command\
    \ enable - I will cover this later\n\n[Install] - Here in our unit i define that\
    \ I want our unit if it has been enabled to launch at boot up, so i set the target\
    \ as \"multi user\".\n\nif you need to edit your service use command such as:\n\
    \n```\nsudo systemctl edit clean.service\n```\n\nthat creates a partial edit,\
    \ where it protects whats already written, so its only for additional stuff. For\
    \ a full edit use:\n\n```\n[andrew@darkstar:~]$ sudo systemctl edit --full clean.service\n\
    ```\n\nafter an edit, you need to run:\n\n```\n[andrew@darkstar:~]$ sudo systemctl\
    \ daemon-reload\n```\n\nusing a terminal to get out put of whats in our unit:\n\
    \n```\n[andrew@darkstar:~]$ systemctl cat clean.service\n```\n\nwith mine i did\
    \ a partial edit and put one comment, that went into # /etc/systemd/system/clean.service.d/override.conf\n\
    \nAs long as you follow the right protocol for creating, editing service units\
    \ you will be fine.\n\nlets see if systemd acknowledges our unit:\n\n```\n[andrew@darkstar:~]$\
    \ systemctl status clean                  (04-17 09:18)\n○ clean.service - example\
    \ use of systemd unit files\n     Loaded: loaded (/etc/systemd/system/clean.service;\
    \ disabled; preset: disabled)\n     Drop-In: /etc/systemd/system/clean.service.d\n\
    \            └─override.conf\n     Active: inactive (dead)\n```\n\nSo in the above\
    \ it shows service is disabled, yes we have not enabled it yet. preset to my knowledge\
    \ means it not designed to auto run unless manually enable. lets enable and run.\n\
    \n```\n[andrew@darkstar:~]$ sudo systemctl enable clean.service\nCreated symlink\
    \ /etc/systemd/system/multi-user.target.wants/clean.service → /etc/systemd/system/clean.service.\n\
    \n[andrew@darkstar:~]$ sudo systemctl start clean.service\n```\n\nNotice in the\
    \ above line, if you don't get errors you can assume the service was started.\
    \ To get a bit more info lets use status verb.\n\n```\n[andrew@darkstar:~]$ sudo\
    \ systemctl status clean.service\n○ clean.service - example use of systemd unit\
    \ files\n     Loaded: loaded (/etc/systemd/system/clean.service; enabled; preset:\
    \ disabled)\n     Drop-In: /etc/systemd/system/clean.service.d\n            └─override.conf\n\
    \     Active: inactive (dead) since Tue 2023-04-18 12:31:12 BST; 19s ago\n   \
    \ Duration: 35ms\n     Process: 6945 ExecStart=/bin/bash /usr/bin/clean.sh (code=exited,\
    \ status=0/SUCCESS)\n    Main PID: 6945 (code=exited, status=0/SUCCESS)\n    \
    \    CPU: 18ms\nApr 18 12:31:12 darkstar journalctl[6946]: Vacuuming done, freed\
    \ 17.0M of archived jour...\n```\n\nAs you can see service is now enabled, so\
    \ it will now run at boot up. There is a cache of logs held so, but trimming our\
    \ log it should not affect and stop us reading output if there is any error on\
    \ boot up. It basically will trim logs that have already been archived."
  mdcn: "\n在我继续之前，假设你已经安装了 Cinnamon 桌面，让我们对其进行一些调整。我喜欢一个简洁的桌面，上面有图标。在 Cinnamon 中，需要做一点工作才能实现这一点。这只需要安装\
    \ xdg-user-dirs，然后以 root 身份运行 xdg-user-dirs。之后，进入 cinnamon 菜单，首选项，桌面，并移动滑块来启用可以显示哪些图标。\n\
    \n现在将安装 xdg-user-dirs，这样我们就可以显示我们的目录\n\n```\n[root@darkstar:~]# pacman -S xdg-user-dirs\n\
    ```\n\n并运行下面的命令来给我们提供该选项。\n\n```\n[root@darkstar:~]# xdg-user-dirs-update\n```\n\
    \n好的，现在是一个很好的时机来关机，然后重新启动并以非 root 用户登录，使用我们新安装的图形环境\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_55_0.png)\n\
    \n## 更深入了解 Systemd\n\n如果你想想一辆汽车，基本上当你感觉你能理解什么控制着这辆车并且也能做到时，完全的信任感才会到来。Systemd\
    \ 从一开始就一直在运行。我想尝试为你揭开 systemd 的神秘面纱。如果你能与之互动，那么我想你会对你的操作系统感到更舒适。在旧的 SysV 系统中，有一些脚本在运行时可以被称为\"\
    守护进程\"。例如在 Slackware Linux 中，你有 /etc/rc.d/rc.wireless，来自 Slackware 网站的说明是：\n\n\
    rc.wireless 这个脚本设置 PCI、USB 和 32 位 Cardbus 无线设备——**不**包括 16 位 PCMCIA 卡（那些是在 /etc/pcmcia/\
    \ 中配置的）。基本上，如果你想让你的 WiFi 工作，你必须首先给予 rc.wireless 脚本执行权限来运行，然后它会自动在下一次启动时作为\"守护进程\"\
    运行。这就是 Slackware 适合学习的原因，除非你让它们工作，否则 things 不会工作。\n\nSystemd 有自己的概念，它引用事物的方式以及让事物启用和运行的方法。我想做的是通过创建我们自己非常小的\
    \ systemd 生态系统中的齿轮来让你了解所涉及的内容，并以一种被认可、接受和有效的方式来做。简洁地说，systemd 通过作用于单元来管理操作系统服务和系统，这些单元主要可以被定义为服务。一个单元是通过\"\
    单元文件\"来定义的，这是一个纯文本的类 ini 风格文件，包含描述该单元并定义其行为方式的配置指令。我们将创建一个单元文件。要获得完整的详细信息，请参阅示例\
    \ man 命令。所有属于你已安装 Linux 操作系统一部分的 systemd 文件都可以在 /lib/systemd/system/ 中找到。要获得输出，你可以从终端提示符使用例如：\n\
    \n```\n[andrew@darkstar:~]$ ls /lib/systemd/system/\n```\n\n不要动 /lib/systemd/system/\
    \ 中的那些文件，不要碰它们。我将展示如何首先创建一个脚本，该脚本将用于修剪我们的日志日志数量，这样你就不必手动操作了。我们将创建一个 systemd 单元来控制该脚本并提供相关信息。这将给出\
    \ systemd 的基本介绍和对事物工作方式的基本理解。你会看到新的 systemd 单元文件将存储在 /etc/systemd/system 中\n\n\
    之后，我想看看如何利用 systemd 来获取信息以及如何获取。我们需要一个文本编辑器来做到这一点，我使用 geany。我用它来进行 PHP 编程和其他功能。如果你没有，那么让我们使用\
    \ pacman 来安装它及其插件：\n\n```\n[andrew@darkstar:~]$ pacman -S geany geany-plugins\n\
    ```\n\n所以让我们看看我们要创建的脚本。在任何终端模拟器中输入的命令，我们可以用来首先查看日志日志量，然后控制我们系统中日志日志数据量的是：\n\n\
    ```\njournalctl --disk-usage\nsudo journalctl --vacuum-size=10M\n```\n\n在上述情况下，我将日志日志量减少到\
    \ 10 兆字节。那是存储中的那些。但我们也可以将该命令放入脚本中。\n\n当脚本运行时，它也会运行该命令。因为我们将把脚本放在 /usr/bin 中，它将具有\
    \ root 权限。让我们使用 geany 来创建一个我们将使用 systemd 来管理的脚本，从菜单启动 geany，然后在 geany 菜单上左键单击文件->新建\n\
    \n在空白处输入下面的 2 行：\n\n```\n#!/bin/bash\njournalctl --vacuum-size=3M\n```\n\n然后文件->另存为\
    \ -> clean.sh，这将在你的主目录中保存一个文件 clean.sh。接下来，因为我们要将脚本移动到 /usr/bin，我们要确保它具有正确的所有权和权限，所以打开一个终端并运行：\n\
    当你打开终端时，默认情况下它会从处于你的主目录的上下文打开。Geany 也应该将脚本存储到主目录，所以你应该不需要更改目录。\n\n```\n[andrew@darkstar:~]$\
    \ sudo chown root:root clean.sh\n[andrew@darkstar:~]$ sudo chmod +x clean.sh\n\
    ```\n\n上面的 2 个命令给予了 root 权限，并且使脚本可执行。\n\n接下来我们将通过命令将脚本 clean.sh 移动到 /usr/bin：\n\
    \n```\n[andrew@darkstar:~]$ sudo mv clean.sh /usr/bin/\n```\n\n现在我们将创建一个 systemd\
    \ 单元来利用该脚本。这将通过适当且标准化的 systemctl 使用方式，使我们能够启用、禁用、获取状态等我们的单元，而该单元反过来控制脚本的使用。\n\n\
    我们将把我们的单元称为 \"clean\"，就 systemd 而言，它的全名将是 \"clean.service\"。好的，从终端开始创建我们的服务。\n\
    \n```\nsudo systemctl edit --force --full clean.service\n```\n\n在我的系统上，这样做会打开一个\
    \ nano 文本编辑器，文件的保存目的地是 /etc/systemd/system\n在 nano 的空白屏幕中，准确输入以下内容：\n\n```\n[Unit]\n\
    Description=example use of systemd unit files\n[Service]\nExecStart=/bin/bash\
    \ /usr/bin/clean.sh\nEnvironment=SYSTEMD_LOG_LEVEL=debug\n[Install]\nWantedBy=multi-user.target\n\
    ```\n\n以 nano 的正常方式保存文件\n\nCtrl + o\n按回车键\nCtrl + x\n\n让我们看看我们的服务是否能被找到\n\n```\n\
    [andrew@darkstar:~]$ systemctl list-unit-files\n```\n\n让我们解释服务单元中的三个元素\n\n[Unit]\
    \ - 包含不依赖于单元类型的通用选项。这些选项提供单元描述，指定单元的行为，并设置与其他单元的依赖关系。\n\n[Service] - 在这里我定义了指向我们脚本的路径及其名称，当我们使用\
    \ start 命令时，或者在启动时如果我们使用 enable 命令 - 我稍后会在下文中解释\n\n[Install] - 在我们的单元中，我在这里定义了我希望我们的单元如果被启用则在启动时启动，所以我把目标设置为\"\
    multi user\"。\n\n如果你需要编辑你的服务，使用如下命令：\n\n```\nsudo systemctl edit clean.service\n\
    ```\n\n这会创建一个部分编辑，它会保护已经写好的内容，所以只用于额外的内容。对于完整编辑，使用：\n\n```\n[andrew@darkstar:~]$\
    \ sudo systemctl edit --full clean.service\n```\n\n编辑后，你需要运行：\n\n```\n[andrew@darkstar:~]$\
    \ sudo systemctl daemon-reload\n```\n\n使用终端来获取我们单元中的内容：\n\n```\n[andrew@darkstar:~]$\
    \ systemctl cat clean.service\n```\n\n就我而言，我做了一个部分编辑并添加了一条注释，它进入了 # /etc/systemd/system/clean.service.d/override.conf\n\
    \n只要你遵循创建、编辑服务单元的正确协议，你就会没问题。\n\n让我们看看 systemd 是否认可我们的单元：\n\n```\n[andrew@darkstar:~]$\
    \ systemctl status clean                  (04-17 09:18)\n○ clean.service - example\
    \ use of systemd unit files\n     Loaded: loaded (/etc/systemd/system/clean.service;\
    \ disabled; preset: disabled)\n     Drop-In: /etc/systemd/system/clean.service.d\n\
    \            └─override.conf\n     Active: inactive (dead)\n```\n\n所以在上面显示服务被禁用了，是的，我们还没有启用它。据我所知，preset\
    \ 意味着它不会设计为自动运行，除非手动启用。让我们启用并运行。\n\n```\n[andrew@darkstar:~]$ sudo systemctl enable\
    \ clean.service\nCreated symlink /etc/systemd/system/multi-user.target.wants/clean.service\
    \ → /etc/systemd/system/clean.service.\n\n[andrew@darkstar:~]$ sudo systemctl\
    \ start clean.service\n```\n\n注意在上面一行中，如果你没有收到错误，你可以假设服务已启动。要获得更多信息，让我们使用 status\
    \ 动词。\n\n```\n[andrew@darkstar:~]$ sudo systemctl status clean.service\n○ clean.service\
    \ - example use of systemd unit files\n     Loaded: loaded (/etc/systemd/system/clean.service;\
    \ enabled; preset: disabled)\n     Drop-In: /etc/systemd/system/clean.service.d\n\
    \            └─override.conf\n     Active: inactive (dead) since Tue 2023-04-18\
    \ 12:31:12 BST; 19s ago\n    Duration: 35ms\n     Process: 6945 ExecStart=/bin/bash\
    \ /usr/bin/clean.sh (code=exited, status=0/SUCCESS)\n    Main PID: 6945 (code=exited,只在有主PID的情况下显示，main\
    \ PID 不能与组 PID 混淆)\n        CPU: 18ms\nApr 18 12:31:12 darkstar journalctl[6946]:\
    \ Vacuuming done, freed 17.0M of archived jour...\n```\n\n如你所见，服务现在已启用，所以它现在会在启动时运行。有一个日志缓存被保留，但是修剪我们的日志不应该影响并阻止我们在启动时出现任何错误时阅读输出。它基本上会修剪已经被归档的日志。\n"
