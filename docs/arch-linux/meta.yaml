    a good internet connection and band width.


    I had a spell in Ghana, Africa where internet is both flaky and expensive. I was
    unable to install Arch but could install EndeavorOS; that''s because I used a
    download manager to pick up after internet connection was re-established (it took
    several goes ) and EndeavourOS has an option of install without Internet. lets
    have a quick look at checking integrity:


    I will save the sha256sums.txt by right clicking on the link and using "save link
    as" that brought up a dialogue allowing me to save the file to my Desktop of Arch
    OS in this case. You could save both the Arch install ISO and the text file to
    a ventoy formatted stick and use Windows OS if that''s what your using to check.
    I''m just showing you the procedure and one way of doing it. You can get a gui
    gtkhash for windows from


    https://github.com/tristanheaven/gtkhash/releases/tag/v1.5


    The key point however you do the check is that the checksum produced from your
    ISO should match the alpha-number given by the Arch Mirror site


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_11_0.png)


    in the above the output from the command :


