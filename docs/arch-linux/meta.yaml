    ## Arch 用户仓库（AUR）


    软件包管理器 pacman 用于从主官方仓库获取软件。但有一个非常值得一看的仓库，里面提供了 Arch Linux 用户提供的软件。从 AUR 获取软件的方法与通常的
    pacman 方法略有不同。


    所以我将介绍从 AUR 获取 brave 网页浏览器、安装它以及如何更新它的方法和步骤。在此书的先前版本中，我介绍了从 AUR 获取 Timeshift 的过程，但它现在已经可以直接使用
    pacman 获取了。


    Arch Linux 的网站是：

    [https://archlinux.org/](https://archlinux.org/)

    在顶部右侧菜单中有一个链接到 AUR 的菜单；显然你需要在安装 Linux 时就已经包含了获取网页浏览器的步骤，或者我认为在主要安装之后的非常短时间内。


