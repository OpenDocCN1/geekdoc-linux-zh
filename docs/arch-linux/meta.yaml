- md: " So I got a couple of errors. OK I re-edited httpd.conf and used alt+c to see\
    \ what line I was on with nano.\n\nWhen finished I restarted Apache\n\n```\n[andrew@darkstar\
    \ ~]$ sudo systemctl restart httpd\n[andrew@darkstar ~]$ sudo systemctl status\
    \ httpd\n● httpd.service - Apache Web Server\n   Loaded: loaded (/usr/lib/systemd/system/httpd.service;\
    \ enabled; preset: disabled)\n   Active: active (running) since Fri 2023-06-30\
    \ 16:21:20 BST; 9s ago\n```\n\nOK with Apache running let's put http://127.0.0.3\
    \ into the address bar and see what we get. If you look down at the right I left\
    \ mouse clicked on the flame icon and it expanded to show on the fly routes, events\
    \ etc on left.\n\nWe will go a little further with CodeIgniter4 and move our database\
    \ which is already populated with next to nothing but better than nothing in terms\
    \ of data to writable.\n\n```\n[andrew@darkstar ~]$ ls Desktop/webplay\nindex.php\
    \  myDatabase.db\n```\n\n```\n[andrew@darkstar ~]$ sudo mv Desktop/webplay/myDatabase.db\n\
    /srv/http/joesoapdev/writable/\n```\n\nIn the scheme of things CodeIgniter was\
    \ designed so that only the contents of the public directory was open to the web,\
    \ to give more security. We will use a URL to evoke fetching data from our database\
    \ and displaying it in a view. A quick mention of the architecture of CodeIgniter.\
    \ To have some semblance of order, CI4 is based on the model, view, controller\
    \ principle. Each unit is assigned its own function and responsibility.\n\n##\
    \ MVC\n\n(Model, View, Controller)\n\nThe controller is a PHP class tasked with\
    \ the function of passing data to a view. The view is basically a PHP file with\
    \ a lot of HTML markup. The database is where data is stored; direct contact with\
    \ the database occurs via a model, which is also a PHP class. The controller can\
    \ ask the model to insert data into the database or retrieve it.\n\nCan anything\
    \ evoke a controller you may ask or feed information into it. Yes that occurs\
    \ by configuring routes matching them to URL patterns and assigning class:method\
    \ to deal with what's evoked.\n\nSo we will configure a route and that when entered\
    \ into the browser address bar, will result in the data we populated into our\
    \ database being retrieved and displayed in a view. There are a few steps to that\
    \ we will cover the topic that all web pages of a web have something in common\
    \ which is the header and the footer.\n\nSo we now have a database and we also\
    \ know where it is, so let's edit the .env file so we can connect to it.\n\n```\n\
    #--------------------------------------------------------------------\n# DATABASE\n\
    #--------------------------------------------------------------------\ndatabase.default.hostname\
    \ = localhost\ndatabase.default.database = '/srv/http/joesoapdev/writable/myDatabase.db'\n\
    # database.default.username =\n# database.default.password =\ndatabase.default.DBDriver\
    \ = SQLite3\n# database.default.DBPrefix =\ndatabase.default.port = 3306\n```\n\
    \nQuick note above for line giving path to the database; you can edit inside of\
    \ .env app/config/Database.php and there use : ROOTPATH but the .env is just a\
    \ text file and will not express a constant such as ROOTPATH so I used the full\
    \ path to it.\n\nNext we create a route so that the URL:\n[http://joesoapdev/getdata](http://joesoapdev/getdata)\
    \ or [http://127.0.0.3/getdata](http://127.0.0.3/getdata)\nwill retrieve data\
    \ from our database. We start slow and simple first let's designate a route, evoke\
    \ a controller's method and get some feedback from it. We edit\n\n`app/Config/Routes.php`\n\
    \nand below the line: `$routes->get('/', 'Home::index')` we add\n`$routes->get('/getdata',\
    \ 'Datacontroller::getdata');`\n\nWe create a file called Datacontroller.php with\
    \ the contents below; it will be saved to:\n`/srv/http/joesoapdev/app/Controllers/Datacontroller.php`\n\
    \n```\n<?php\nnamespace App\\Controllers;\nclass Datacontroller extends BaseController\n\
    {\n    public function data()\n    {\n        echo \" hello from data controller\"\
    ;\n    }\n}\n```\n\nLeft it validates that joesoapdev/getdata\nevokes a Controller\
    \ and its method OK which is:\nDatacontroller::data\n\nNext we will test to see\
    \ if we can connect to the database, we are going step by step so we will do it\
    \ in the controller, later we shift to a model. The database used with CI4 is\n\
    \nmyDatabase.db\n\ntable: items\nId : Int\nItem: text\nPrice: text\n\ncode of\
    \ Datacontroller.php is now:\n\n```\n<?php\nnamespace App\\Controllers;\nuse CodeIgniter\\\
    Database\\ConnectionInterface;\nclass Datacontroller extends BaseController\n\
    {\n    public function data()\n    {\n        $db = \\Config\\Database::connect();\n\
    \        $query = $db->query('SELECT * FROM items');\n        $results = $query->getResult();\n\
    \        foreach ($results as $stuff)\n        {\n            echo \"Id is :\"\
    . $stuff->Id.\"<br>\";\n            echo \"Item is :\" .$stuff->Item.\"<br>\"\
    ;\n            echo \"Price is :\". $stuff->Price .\"<br>\";\n        }\n    }\n\
    }\n```\n\nWe can see on the image right that data gets output OK.\n\nSo now we\
    \ will look at views and how we can render data to a view; every web page has\
    \ in common the footer and header, it would be nice if we could just have a template\
    \ page and inject only the relevant data specific to a page.\n\nWell we can do\
    \ that, since CI4 allows to leverage a layout. We will do that first and put a\
    \ link in the header to style sheet. A very simple one but, the concept can easily\
    \ be leveraged much further. You can for instance link your pages to Bootstrap\
    \ so you can access its powerful layout features and simply have another style\
    \ sheet of your own which you will call in after the bootstrap style sheet which\
    \ means the part that are in common between the 2 will be overwritten by anything\
    \ in the last sheet. That's the approach I took. So you can tweak the look to\
    \ your taste.\n\nWe will just set up a bit of structure by creating the directories\
    \ sounds, images, fonts, js inside the CI4 public directory. We will use the command\
    \ line and do it in one line:\n\n```\n[andrew@darkstar Desktop]$ cd /srv/http/joesoapdev\n\
    [andrew@darkstar joesoapdev]$ ls\nLICENSE  app  composer.json  phpunit.xml.dist\
    \  public  tests  writable\nREADME.md  builds  composer.lock  preload.php  spark\
    \  vendor\n[andrew@darkstar joesoapdev]$ cd public\n[andrew@darkstar public]$\
    \ mkdir images js sounds fonts\n[andrew@darkstar public]$ ls\nfavicon.ico  fonts\
    \  images  index.php  js  robots.txt  sounds\n[andrew@darkstar public]$\n```\n\
    \nWe will create a Web template file for all our web pages, starting using geany\
    \ ->new with template html5 and saving it with a php suffix; I called mine webLayout.php\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\" />\n\
    <title>template </title>\n<meta name=\"generator\" content=\"Geany 1.38\" />\n\
    <link rel=\"stylesheet\" type=\"text/css\" href =\"<?php echo base_url(\"css/myStyle.css\"\
    ); ?>\">\n</head>\n<body>\n<h1>hellow world from layout template</h1>\n<?=$this->renderSection('content')?>\n\
    </body>\n\n</html>\n```\n\n```\nmyStyle.css\n\nh1\n{\ncolor:blue;\n}\nh4\n{\n\
    font-family: \"Times New Roman\", Times, serif;\ncolor:maroon;\n}\n```\n\nwill\
    \ produce a view to leverage our web Layout.php. I will just call this one info.php\
    \ which could be used for a variety of purposes.\n\n```\ninfo.php\n\n<?=$this->extend('webLayout')\
    \ ?>\n<?=$this->section('content') ?>\n\n<?php echo $info;?>\n\n<?php\nforeach\
    \ ($theData as $stuff)\n{\n    echo \"<h4>Id is :\". $stuff->Id.\"</h4>\";\n \
    \   echo \"<h4> Item is :\" .$stuff->Item.\"</h4>\";\n    echo \"<h4>Price is\
    \ :\". $stuff->Price .\"</h4>\";\n    echo \"<br>\";\n}\n?>\n<?=$this->endSection()?>\n\
    ```\n\n```\n<?=$this->extend('webLayout') ?>\n<?=$this->section('content') ?>\n\
    \n<?php echo $info; ?>\n\n<?php\nforeach ($theData as $stuff)\n{\n    echo \"\
    <h4>Id is :\". $stuff->Id.\"</h4>\";\n    echo \"< Conservativesh4> Item is :\"\
    \ .$stuff->Item.\"</h4>\";\n    echo \"<h4>Price is :\". $stuff->Price .\"</h4>\"\
    ;\n    echo \"<br>\";\n}\n?>\n<?=$this->endSection()?>\n```\n\nSo to recap left.\
    \ A URL ending /getdata evokes a controller via the configuration of a route.\n\
    \nThe controller connects to a database, passes data to a view via the handle\
    \ $data which is an array of data.\n\nWe render out the data to a view"
  mdcn: "\n所以我遇到了几个错误。好了，我重新编辑了 httpd.conf，并使用 alt+c 在 nano 中查看当前所在的行号。\n\n完成后，我重启了\
    \ Apache\n\n```\n[andrew@darkstar ~]$ sudo systemctl restart httpd\n[andrew@darkstar\
    \ ~]$ sudo systemctl status httpd\n● httpd.service - Apache Web Server\n   Loaded:\
    \ loaded (/usr/lib/systemd/system/httpd.service; enabled; preset: disabled)\n\
    \   Active: active (running) since Fri 2023-06-30 16:21:20 BST; 9s ago\n```\n\n\
    Apache 运行正常，让我们在地址栏中输入 http://127.0.0.3 看看能得到什么。如果你看右下角，我点击了火焰图标，它展开后显示了动态路由、事件等信息。\n\
    \n我们将进一步深入 CodeIgniter4，并将我们的数据库移动到 writable 目录。数据库里虽然几乎没什么数据，但总比什么都没有好。\n\n```\n\
    [andrew@darkstar ~]$ ls Desktop/webplay\nindex.php  myDatabase.db\n```\n\n```\n\
    [andrew@darkstar ~]$ sudo mv Desktop/webplay/myDatabase.db\n/srv/http/joesoapdev/writable/\n\
    ```\n\n在整体设计中，CodeIgniter 被设计成只有 public 目录的内容对 Web 开放，以提供更高的安全性。我们将使用一个 URL 来触发从数据库获取数据，并在视图中显示它。简单提一下\
    \ CodeIgniter 的架构。为了有一定的条理性，CI4 基于**模型、视图、控制器**原则。每个单元都有自己的功能和职责。\n\n## MVC\n\n\
    （模型、视图、控制器）\n\n控制器是一个 PHP 类，负责将数据传递给视图。视图基本上是一个包含大量 HTML 标记的 PHP 文件。数据库是存储数据的地方；与数据库的直接接触通过**模型**完成，模型也是一个\
    \ PHP 类。控制器可以请求模型将数据插入数据库或从中检索数据。\n\n你可能会问，什么可以触发控制器或向它输入信息呢？是的，这通过配置路由来实现，将路由与\
    \ URL 模式匹配，并分配类:方法来处理被触发的事件。\n\n所以我们将会配置一个路由，当在浏览器地址栏中输入时，会将我们填充到数据库中的数据检索出来并显示在视图中。这需要几个步骤。我们先来涵盖这样一个主题：所有网页都有一些共同之处，那就是页眉和页脚。\n\
    \n现在我们已经有了数据库，也知道它在哪里，所以让我们编辑 .env 文件，以便能够连接它。\n\n```\n#--------------------------------------------------------------------\n\
    # DATABASE\n#--------------------------------------------------------------------\n\
    database.default.hostname = localhost\ndatabase.default.database = '/srv/http/joesoapdev/writable/myDatabase.db'\n\
    # database.default.username =\n# database.default.password =\ndatabase.default.DBDriver\
    \ = SQLite3\n# database.default.DBPrefix =\ndatabase.default.port = 3306\n```\n\
    \n上面关于数据库路径的行快速说明一下；你可以在 .env 中编辑，也可以在 app/config/Database.php 中使用 : ROOTPATH，但\
    \ .env 只是一个文本文件，无法识别 ROOTPATH 这样的常量，所以我使用了完整路径。\n\n接下来我们创建一个路由，使得 URL：\n[http://joesoapdev/getdata](http://joesoapdev/getdata)\
    \ 或 [http://127.0.0.3/getdata](http://127.0.0.3/getdata)\n能够从我们的数据库中检索数据。我们先从简单开始，先指定一个路由，触发控制器的方法，并从它那里获得一些反馈。我们编辑\n\
    \n`app/Config/Routes.php`\n\n在 `$routes->get('/', 'Home::index')` 这一行下面，我们添加\n\
    `$routes->get('/getdata', 'Datacontroller::getdata');`\n\n我们创建一个名为 Datacontroller.php\
    \ 的文件，内容如下；它将被保存到：\n`/srv/http/joesoapdev/app/Controllers/Datacontroller.php`\n\
    \n```\n<?php\nnamespace App\\Controllers;\nclass Datacontroller extends BaseController\n\
    {\n    public function data()\n    {\n        echo \" hello from data controller\"\
    ;\n    }\n}\n```\n\n先验证 joesoapdev/getdata\n能够成功触发控制器及其方法，即：\nDatacontroller::data\n\
    \n接下来我们将测试是否能连接到数据库，我们一步一步来，所以先在控制器中做，之后再转移到模型。CI4 使用的数据库是\n\nmyDatabase.db\n\n\
    表: items\nId : Int\nItem: text\nPrice: text\n\nDatacontroller.php 的代码现在是：\n\n\
    ```\n<?php\nnamespace App\\Controllers;\nuse CodeIgniter\\Database\\ConnectionInterface;\n\
    class Datacontroller extends BaseController\n{\n    public function data()\n \
    \   {\n        $db = \\Config\\Database::connect();\n        $query = $db->query('SELECT\
    \ * FROM items');\n        $results = $query->getResult();\n        foreach ($results\
    \ as $stuff)\n        {\n            echo \"Id is :\". $stuff->Id.\"<br>\";\n\
    \            echo \"Item is :\" .$stuff->Item.\"<br>\";\n            echo \"Price\
    \ is :\". $stuff->Price .\"<br>\";\n        }\n    }\n}\n```\n\n我们可以在右侧的图像中看到数据成功输出了。\n\
    \n所以现在我们来看看视图，以及如何向视图渲染数据；每个网页都有共同的页脚和页眉，如果我们能有一个模板页面，只注入与特定页面相关的数据，那就太好了。\n\n\
    我们可以做到这一点，因为 CI4 允许利用**布局**。我们先来做这个，并在页眉中添加一个样式表的链接。一个非常简单的例子，但这个概念可以很容易地进一步扩展。例如，你可以将页面链接到\
    \ Bootstrap，以便访问其强大的布局功能，然后只需再添加一个你自己的样式表，在 bootstrap 样式表之后调用，这意味着两者共有的部分将被最后加载的样式表中的内容覆盖。这就是我所采用的方法。这样你就可以根据自己的喜好调整外观。\n\
    \n我们将通过创建 sounds、images、fonts、js 目录来建立一些结构，放在 CI4 的 public 目录中。我们将使用命令行，一行完成：\n\
    \n```\n[andrew@darkstar Desktop]$ cd /srv/http/joesoapdev\n[andrew@darkstar joesoapdev]$\
    \ ls\nLICENSE  app  composer.json  phpunit.xml.dist  public  tests  writable\n\
    README.md  builds  composer.lock  preload.php  spark  vendor\n[andrew@darkstar\
