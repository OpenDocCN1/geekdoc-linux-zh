    \ F9. You might have a look in BIOS first, that key F10 from a cold boot. I have\
    \ boot from USB enabled, secure boot -off, legacy boot -enabled.\n\n![Ventoy boot\
    \ menu showing USB device options](img/0740bd8ebbd6ea87ab1327b2fc9132c4_18_0.png)\n\
    \nSo I have attached my Ventoy formatted stick, powered up and I have hit key\
    \ F9. The image on the left shows my choices. The top one highlighted is quoting\
    \ a USB of Kingston make.\n\nThat's the one, if now hit the return key, then I\
    \ should then see a Ventoy splash\n\nBe a little bit patient and you should see\
    \ the nice green vision of Mint Live up. Now because it's graphical, it's good\
    \ to have a play before moving onto to installing Arch. My Mint booted up fine.\n\
    \nIf yours doesn't you might have to try another USB stick and check the integrity\
    \ of the ISO. Instructions of checksums are on the Mint site. `linuxmint-21.1-xfce-64bit.iso`\
    \ is a lighter version than the mate one, but I checked and it has installed inxi,\
    \ gParted, Nano & Timeshift all installed as default. I found it quite responsive\
    \ and quick on an only 4Gig RAM laptop.\n\nLet's make some use of it; from a terminal\
    \ prompt to get graphic info it's the command:\n\n```\n[prompt:~]$ inxi -G\n```\n\
    \nIn the image to the right I am using Mint xfce live from a USB, I have opened\
    \ up a terminal and entered the same command\n\n![Terminal showing inxi -G output\
    \ with AMD graphics identification](img/0740bd8ebbd6ea87ab1327b2fc9132c4_19_0.png)\n\
    \nYou can see that my graphic device has been identified as AMD\n\nFrom a command\
    \ line you can also use:\n\n```\n[prompt:~]$ lspci -v | grep -A1 -e VGA -e 3D\n\
    ```\n\nMake a note of yours; you will need the info when you get to the install\
    \ of a Desktop stage, in that you need to install the relevant graphics drivers.\
    \ My graphics hardware is AMD so when I got to the install Desktop stage I installed\
    \ via pacman\n\n```\n[prompt:~]$ sudo pacman -S xf86-video-amdgpu\n```\n\nFor\
    \ Intel it's:\n\n```\n[prompt:~]$ sudo pacman -S xf86-video-intel mesa\n```\n\n\
    For nVIDIA it will be:\n\n```\n[prompt:~]$ sudo pacman -S nvidia nvidia-utils\n\
    ```\n\n`inxi` is a useful tool and can be used to find out your CPU and other\
    \ information. That command will be:\n\n```\n[prompt:~]$ inxi -C\n```\n\nFor the\
    \ full monty:\n\n```\n[prompt:~]$ inxi --help\n```\n\nWhile we have Mint live\
    \ running we can use it to prepare some skills and gain familiarity with use of\
    \ the terminal. You can select gParted which is a GUI offering of parted and can\
    \ be used to both see partitions on the hard drive of the computer, that the USB\
