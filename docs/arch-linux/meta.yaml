- md: " Looking at the image of the web page it can be seen that software to be able\
    \ to obtain and install the brave browser has been provided on the AUR by more\
    \ than one member. Users of Arch who have tried and tested the provided software\
    \ have given votes based on user experience. There are variations for a number\
    \ of reasons for instance with scribus one user provided software for a particular\
    \ version of scribus which was stable 1.4.8.\n\nAnyway \"brave-bin\" has the most\
    \ votes so we will have a look at that by left mouse clicking on the \"brave-bin\"\
    \ blue text far left which is a hyper link. Doing that will take you to this page:\n\
    \n| Field | Value |\n|---|---|\n| Git Clone URL: | https://aur.archlinux.org/brave-bin.git\
    \ (read-only, click to copy) |\n| Package Base: | brave-bin |\n| Description:\
    \ | Web browser that blocks ads and trackers by default (binary release) |\n|\
    \ Upstream URL: | https://brave.com |\n| Keywords: | brave, browser |\n| Licenses:\
    \ | BSD, MPL2, custom:chromium |\n| Conflicts: | brave |\n| Provides: | brave,\
    \ brave-browser |\n| Submitter: | toropisco |\n| Maintainer: | alerque (alosarjos)\
    \ |\n| Last Packager: | alosarjos |\n| Votes: | 762 |\n| Popularity: | 14.28 |\n\
    | First Submitted: | 2016-04-06 13:16 (UTC) |\n| Last Updated: | 2024-04-17 19:28\
    \ (UTC) |\n\n+   **Dependencies (8)**\n- alsa-lib\n- gtk3 (gtk3-ubuntu$^{AUR}$,\
    \ gtk3-no_deadkeys_underline$^{AUR}$, gtk3-patched-filechooser-icon-view$^{AUR}$,\
    \ gtk3-classic-xfce$^{AUR}$, gtk3-classic$^{AUR}$)\n- libxss\n- nss (nss-hg$^{AUR}$)\n\
    \nAT the top it says \"read only click to copy\" if you mouse left click on the\
    \ text https://aur.archlinux.org/brave-bin.git\n\nIt will copy the URL which we\
    \ will use to get the precursor software to build the actual package we will install.\
    \ We will do that from a command line. So open up a terminal emulator; i use Alacritty.\n\
    \nYou will have to nip back and forth between browser window and terminal window.\
    \ So left mouse click on the link:\n\n[https://aur.archlinux.org/brave-bin.git](https://aur.archlinux.org/brave-bin.git)\n\
    \nThen to paste that into Alacritty terminal left click on the border window of\
    \ Alacritty to set focus then use keys ctrl + shift + v\n\nThen move mouse cursor\
    \ to from of the pasted text and type in from \"git clone\" without the quotation\
    \ marks you should then have something very similar to this:\n\n```\n[andrew@Darkstar\
    \ ~]$ git clone https://aur.archlinux.org/brave-bin.git\n```\n\nthen hit the return\
    \ key.\n\nIf you then look in your home directory you should see a directory named\
    \ \"brave-bin\"\n\nSo from our terminal we will move into it using:\n\n```\n[andrew@darkstar\
    \ ~]$ cd brave-bin\n```\n\nlets list out whats inside:\n\n```\n[andrew@darkstar\
    \ brave-bin]$ ls\n```\n\nPKGBUILD brave-bin.sh brave-browser.desktop\n\nNow we\
    \ can attempt to build a .zst package which we will use in install brave using:\n\
    \n```\n[andrew@darkstar brave-bin]$ makepkg -s\n```\n\nThe \"s\" flag is an attempt\
    \ to see if any dependency software needed can be pulled in. Note \"sudo\" is\
    \ not used with makepkg command. You will get a failure and listed packages needed.\
    \ of course you could have been more prudent and read on the web page the listed\
    \ 8 dependencies needed and installed them first. If you look at the image page\
    \ 59? the dependencies are listed by name and the blue text of the listed software\
    \ are hyper links, so clicking on the text will take you where to get them.\n\n\
    After trying:\n\n```\n[andrew@darkstar brave-bin]$ makepkg -s\n```\n\nA few times\
    \ if you see it initiates code running ending with:\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_67_0.png)\n\
    \n..then it means a .zst package was successfully produced. using ls list command\
    \ again ..\n\n```\n[andrew@darkstar brave-bin]$ ls\nPKGBUILD                brave-bin.sh\
    \    src\nbrave-bin-1.65.114-x86_64.zip       brave-browser.desktop\nbrave-bin-1:1.65.114-1-x86_64.pkg.tar.zst\
    \ pkg\n```\n\nWe an now get brave browser installed using:\n\n```\n[andrew@darkstar\
    \ brave-bin]$ sudo pacman -U  brave-bin-1:1.65.114-1-x86_64.pkg.tar.zst\n```\n\
    \nNow to manually update the software for brave, make sure your terminal emulator\
    \ is located inside the brave-bin directory and simply run the command:\n\n```\n\
    [andrew@darkstar brave-bin]$ git pull\n```\n\nif the software maintainer has made\
    \ an update then you will see text stating \"deletions\" etc.\nSo then run again:\n\
    \n```\n[andrew@darkstar brave-bin]$ makepkg -s\n```\n\nYou should see a more up\
    \ to date version of brave as seen by its name with the number naming the version\
    \ being higher for the new one. Next to install run:\n\n```\n[andrew@darkstar\
    \ brave-bin]$ sudo pacman -U  brave-bin-new-version-name.tar.zst\n```\n\n## Extra\
    \ Stuff\n\n### Spell Check Scribus File\n\nI wrote this book using scribus 1.4.8\
    \ stable from the AUR. For spell checking i prefer to finish my scribus document\
    \ which will be in the form of FileName.sla ; then from a terminal change directory\
    \ to location of document and run:\n\n```\n[andrew@darkstar:~]$ aspell --lang=en\
    \ --encoding=utf-8 --mode=sgml --add-sgml-check=ch check FileName.sla\n```\n\n\
    obviously you need to have aspell installed; i have :\n\n```\n[andrew@darkstar:~]$\
    \ pacman -Qi aspell\nName        : aspell\nVersion     : 0.60.8-3\nDescription\
    \ : A spell checker designed to eventually replace Ispell\n```\n\nand also\n\n\
    ```\nextra/aspell-en 2020.12.07-1 [installed]\n    English dictionary for aspell\n\
    ```\n\n### General Security Audit\n\n```\n[andrew@darkstar:~]$ pacman -S lynis\n\
    [andrew@darkstar:~]$ sudo lynis audit system\n```\n\n### Disk Space\n\ntop 10\
    \ entries taking up disk usage :\n\n```\n[andrew@darkstar:~]$ sudo du -h | sort\
    \ -n -r | head -n 10\n```\n\nFilelight installed using pacman is a nice visual\
    \ display of whats using space. You can choose home, root\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_69_0.png)\n\
    \nIf you place mouse cursor over slices of pie it will tell you in a pop up the\
    \ path to offending directories etc\n\nSound recording taken from android phone\
    \ and converted to mp4 ; you need obviously to have ffmpeg installed.\n\n```\n\
    [andrew@darkstar:~]$ ffmpeg -i  simplescreenrecorder-2023-01-08_15.27.44.mkv -vcodec\
    \ copy -acodec copy -scodec mov_text output.mp4\n```\n\n## Installing additional\
    \ fonts\n\n```\nsudo pacman -S noto-fonts ttf-ubuntu-font-family ttf-dejavu ttf-freefont\
    \ ttf-liberation ttf-droid ttf-inconsolata ttf-roboto terminus-font ttf-font-awesome\
    \ -noconfirm -needed\n```\n\nFor manually installing fonts say you got them from:\n\
    \nhttps://www.fontsquirrel.com/\n\nThen to take an example you would have a sub-directory\
    \ called Bentham at :\n\n/usr/share/fonts/\n\ncontaining :\n\n```\nBentham\n├──\
    \ Bentham.otf\n└── SIL Open Font License.txt\n```\n\nTo update system on new fonts\
    \ run\n\n```\n[andrew@darkstar:~]$  sudo fc-cache\n```\n\n## Virus scanning\n\n\
    I have never had a virus on my PC but i have picked up viruses onto a fat32 formatted\
    \ USB stick, which if shared with friends running windows could be a problem.\
    \ To scan a USB mounted on Arch at /run/media/andrew/SPARE using clamav would\
    \ be something like :\n\n```\n[andrew@darkstar:~]$ sudo clamscan -r -v --infected\
    \ --remove=yes /run/media/andrew/spare\n```\n\nif you want to scan your own computer\
    \ it would be something like :\n\n```\nsudo clamscan -r -v --infected --remove=yes\
    \ --exclude-dir=/sys/ --exclude-dir=/proc/ --exclude-dir=/dev/ /\n```\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_71_0.png)\n\
    \nThe reason for excluding destinations such /proc/ is that to my understanding\
    \ these areas are virtual and it causes a slow down if you try to scan them. You\
    \ have to be careful with --remove=yes in case of false positives\n\n## Finding\
    \ stuff\n\nOn an external hard drive mounted at /run/media/andrew/TOSHIBA EXT\n\
    \nI wanted to see if i already had a copy of an image in it someone called IMG_20160420_093807.jpg.\n\
    \n```\n[andrew@darkstar:~]$ find /run/media/andrew/\"TOSHIBA EXT\" -name IMG_20160420_093807.jpg\
    \ -print\n```\n\n## Simple weather report\n\n```\n[andrew@darkstar:~][1]$ curl\
    \ wttr.in/Southend-on-sea\n```\n\n(04-27 12:30)\n\nWeather report: Southend-on-sea\n\
    \n```\n\\ /   Sunny\n .-.   +12(9) °C\n—( )—  ← 24 km/h\n`-'    10 km\n / \\ \
    \  0.0 mm\n```\n\n## Saving /Moving\n\n```\n[andrew@darkstar:~/Desktop]$ rsync\
    \ -av  archlinux-x86_64.iso /run/media/andrew/Ventoy/ISO/\n```\n\nrsync is a great\
    \ tool to copy a directory with all its sub-directories and theit contents. In\
    \ the above from a location context for my terminal I am at my Desktop which has\
    \ an iso file. I want to copy that to a directory called \"ISO\" on a USB stick\
    \ that is mounted at /run/media/andrew/Ventoy\n\nTo move the iso file you can\
    \ use\n\n```\n[andrew@darkstar:~/Desktop]$ mv  archlinux-x86_64.iso  /run/media/andrew/Ventoy/ISO/\
    \ && sync\n```"
  mdcn: "\n 查看网页图片可以看到，AUR 上已有不止一位成员提供了能够获取和安装 Brave 浏览器的软件。使用 Arch 的用户在试用并测试了提供的软件后，根据使用体验进行了投票。存在多个版本的原因有很多，例如就\
    \ scribus 而言，有一位用户为特定版本 scribus 1.4.8 stable 提供了软件。\n\n无论如何，**brave-bin** 的票数最多，所以我们将通过鼠标左键点击最左侧作为超链接的蓝色文字\
    \ \"brave-bin\" 来查看它。这样做会跳转到以下页面：\n\n| 字段 | 值 |\n|---|---|\n| Git 克隆 URL： | https://aur.archlinux.org/brave-bin.git\
    \ (read-only, click to copy) |\n| 软件包基础： | brave-bin |\n| 描述： | 默认阻止广告和追踪器的网络浏览器（二进制版本）\
    \ |\n| 上游 URL： | https://brave.com |\n| 关键词： | brave, browser |\n| 许可证： | BSD,\
    \ MPL2, custom:chromium |\n| 冲突： | brave |\n| 提供： | brave, brave-browser |\n|\
    \ 提交者： | toropisco |\n| 维护者： | alerque (alosarjos) |\n| 最后打包者： | alosarjos |\n\
    | 票数： | 762 |\n| 热门度： | 14.28 |\n| 首次提交： | 2016-04-06 13:16 (UTC) |\n| 最后更新： |\
    \ 2024-04-17 19:28 (UTC) |\n\n+   **依赖项 (8)**\n- alsa-lib\n- gtk3 (gtk3-ubuntu$^{AUR}$,\
    \ gtk3-no_deadkeys_underline$^{AUR}$, gtk3-patched-filechooser-icon-view$^{AUR}$,\
    \ gtk3-classic-xfce$^{AUR}$, gtk3-classic$^{AUR}$)\n- libxss\n- nss (nss-hg$^{AUR}$)\n\
    \n顶部写着 \"read only click to copy\"，如果你用鼠标左键点击文本 https://aur.archlinux.org/brave-bin.git\n\
    \n它会复制该 URL，我们将使用它来获取构建实际安装包所需的前置软件。我们将从命令行执行此操作。所以打开一个终端模拟器；我使用的是 Alacritty。\n\
    \n你需要在浏览器窗口和终端窗口之间来回切换。所以用鼠标左键点击链接：\n\n[https://aur.archlinux.org/brave-bin.git](https://aur.archlinux.org/brave-bin.git)\n\
    \n然后在 Alacritty 终端中粘贴该链接，左键点击 Alacritty 的边框窗口以设置焦点，然后使用快捷键 ctrl + shift + v\n\n\
    接着将鼠标光标移到粘贴文本的前面，输入 \"git clone\"（不带引号），然后你应该会得到类似这样的内容：\n\n```\n[andrew@Darkstar\
    \ ~]$ git clone https://aur.archlinux.org/brave-bin.git\n```\n\n然后按回车键。\n\n如果你随后查看主目录，应该会看到一个名为\
    \ \"brave-bin\" 的目录\n\n所以我们将从终端中进入该目录，使用：\n\n```\n[andrew@darkstar ~]$ cd brave-bin\n\
    ```\n\n让我们列出里面的内容：\n\n```\n[andrew@darkstar brave-bin]$ ls\n```\n\nPKGBUILD brave-bin.sh\
    \ brave-browser.desktop\n\n现在我们可以尝试构建一个 .zst 软件包，用于安装 Brave，使用：\n\n```\n[andrew@darkstar\
    \ brave-bin]$ makepkg -s\n```\n\n\"s\" 标志用于尝试查看是否可以拉取所需的依赖软件。注意 `makepkg` 命令不使用\
    \ `sudo`。你会遇到失败，并列出需要的软件包。当然，你本可以更谨慎一些，在网页上查看列出的 8 个所需依赖项并提前安装它们。查看第 59 页的图片，依赖项按名称列出，列出的软件的蓝色文字是超链接，因此点击文字会带你去获取它们的地方。\n\
    \n多次尝试后：\n\n```\n[andrew@darkstar brave-bin]$ makepkg -s\n```\n\n如果你看到它开始运行代码，最终以以下结果结束：\n\
    \n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_67_0.png)\n\n..这意味着 .zst 软件包已成功生成。再次使用\
    \ ls 列出命令 ..\n\n```\n[andrew@darkstar brave-bin]$ ls\nPKGBUILD               \
    \ brave-bin.sh    src\nbrave-bin-1.65.114-x86_64.zip       brave-browser.desktop\n\
    brave-bin-1:1.65.114-1-x86_64.pkg.tar.zst pkg\n```\n\n我们现在可以使用以下命令安装 Brave 浏览器：\n\
    \n```\n[andrew@darkstar brave-bin]$ sudo pacman -U  brave-bin-1:1.65.114-1-x86_64.pkg.tar.zst\n\
    ```\n\n现在手动更新 Brave 软件，请确保你的终端模拟器位于 brave-bin 目录内，然后简单地运行命令：\n\n```\n[andrew@darkstar\
    \ brave-bin]$ git pull\n```\n\n如果软件维护者已经进行了更新，你会看到显示 \"deletions\" 等字样的文本。\n然后再次运行：\n\
    \n```\n[andrew@darkstar brave-bin]$ makepkg -s\n```\n\n你应该会看到一个更新的 Brave 版本，从其名称中版本号的数字更高可以看出是新版。接下来安装，运行：\n\
    \n```\n[andrew@darkstar brave-bin]$ sudo pacman -U  brave-bin-new-version-name.tar.zst\n\
    ```\n\n## 额外内容\n\n### Scribus 文件拼写检查\n\n我使用 AUR 中的 scribus 1.4.8 stable 编写了这本书。对于拼写检查，我倾向于先完成我的\
    \ scribus 文档，其格式为 FileName.sla；然后从终端切换到文档所在位置并运行：\n\n```\n[andrew@darkstar:~]$\
    \ aspell --lang=en --encoding=utf-8 --mode=sgml --add-sgml-check=ch check FileName.sla\n\
    ```\n\n显然你需要安装 aspell；我的情况是：\n\n```\n[andrew@darkstar:~]$ pacman -Qi aspell\n\
    Name        : aspell\nVersion     : 0.60.8-3\nDescription : A spell checker designed\
    \ to eventually replace Ispell\n```\n\n以及\n\n```\nextra/aspell-en 2020.12.07-1\
    \ [installed]\n    English dictionary for aspell\n```\n\n### 常规安全审计\n\n```\n[andrew@darkstar:~]$\
    \ pacman -S lynis\n[andrew@darkstar:~]$ sudo lynis audit system\n```\n\n### 磁盘空间\n\
    \n占用磁盘空间最多的前 10 个条目：\n\n```\n[andrew@darkstar:~]$ sudo du -h | sort -n -r | head\
    \ -n 10\n```\n\n使用 pacman 安装的 Filelight 是一个很好的可视化显示空间使用情况的工具。你可以选择性查看 home、root\n\
    \n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_69_0.png)\n\n如果你将鼠标光标悬停在饼图的切片上，弹出窗口会显示指向相关目录等的路径\n\
    \n从安卓手机录制的音频并转换为 mp4；你显然需要安装 ffmpeg。\n\n```\n[andrew@darkstar:~]$ ffmpeg -i  simplescreenrecorder-2023-01-08_15.27.44.mkv\
    \ -vcodec copy -acodec copy -scodec mov_text output.mp4\n```\n\n## 安装额外字体\n\n\
    ```\nsudo pacman -S noto-fonts ttf-ubuntu-font-family ttf-dejavu ttf-freefont\
    \ ttf-liberation ttf-droid ttf-inconsolata ttf-roboto terminus-font ttf-font-awesome\
    \ -noconfirm -needed\n```\n\n对于手动安装字体，假设你从以下网站获取了字体：\n\nhttps://www.fontsquirrel.com/\n\
    \n然后举例来说，在以下位置你会有一个名为 Bentham 的子目录：\n\n/usr/share/fonts/\n\n包含以下文件：\n\n```\nBentham\n\
    ├── Bentham.otf\n└── SIL Open Font License.txt\n```\n\n要更新系统上的新字体，运行\n\n```\n\
    [andrew@darkstar:~]$  sudo fc-cache\n```\n\n## 病毒扫描\n\n我的电脑从未中过病毒，但我曾在 fat32 格式的\
    \ U 盘上感染过病毒，如果与使用 Windows 的朋友共享，可能会成为问题。要扫描在 Arch 上挂载于 /run/media/andrew/SPARE\
    \ 的 U 盘，使用 clamav 的方式大致如下：\n\n```\n[andrew@darkstar:~]$ sudo clamscan -r -v --infected\
    \ --remove=yes /run/media/andrew/spare\n```\n\n如果你想扫描自己的计算机，大致如下：\n\n```\nsudo\
    \ clamscan -r -v --infected --remove=yes --exclude-dir=/sys/ --exclude-dir=/proc/\
    \ --exclude-dir=/dev/ /\n```\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_71_0.png)\n\
    \n排除 /proc/ 等位置的原因是，据我了解这些区域是虚拟的，如果尝试扫描它们会导致速度变慢。你必须谨慎使用 --remove=yes，以防误报\n\n\
    ## 查找内容\n\n在挂载于 /run/media/andrew/TOSHIBA EXT 的外部硬盘上\n\n我想看看是否已经有一个名为 IMG_20160420_093807.jpg\
    \ 的图片副本。\n\n```\n[andrew@darkstar:~]$ find /run/media/andrew/\"TOSHIBA EXT\" -name\
    \ IMG_20160420_093807.jpg -print\n```\n\n## 简单天气报告\n\n```\n[andrew@darkstar:~][1]$\
    \ curl wttr.in/Southend-on-sea\n```\n\n(04-27 12:30)\n\nSouthend-on-sea 的天气预报：\n\
    \n```\n\\ /   晴朗\n .-.   +12(9) °C\n—( )—  ← 24 km/h\n`-'    10 km\n / \\   0.0\
    \ mm\n```\n\n## 保存/移动\n\n```\n[andrew@darkstar:~/Desktop]$ rsync -av  archlinux-x86_64.iso\
    \ /run/media/andrew/Ventoy/ISO/\n```\n\nrsync 是一个很棒的工具，用于复制包含所有子目录及其内容的目录。在上述命令中，根据我的终端所在位置，我位于\
    \ Desktop，其中有一个 iso 文件。我想将其复制到挂载于 /run/media/andrew/Ventoy 的 U 盘上名为 \"ISO\" 的目录中\n\
    \n要移动 iso 文件，你可以使用\n\n```\n[andrew@darkstar:~/Desktop]$ mv  archlinux-x86_64.iso\
    \  /run/media/andrew/Ventoy/ISO/ && sync\n```\n"
