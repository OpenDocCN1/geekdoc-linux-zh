  - "[PAGE 71]\n\n# Virus scanning\n\nI have never had a virus on my PC but i have\
    \ picked up viruses onto a fat32 formatted USB stick, which if shared with friends\
    \ running windows could be a problem. To scan a USB mounted on Arch at /run/media/andrew/SPARE\
    \ using clamav would be something like :\n\n```\n[andrew@darkstar:~]$ sudo clamscan\
    \ -r -v --infected --remove=yes /run/media/andrew/spare\n```\n\nif you want to\
    \ scan your own computer it would be something like :\n\n```\nsudo clamscan -r\
    \ -v --infected --remove=yes --exclude-dir=/sys/ --exclude-dir=/proc/ --exclude-dir=/dev/\
    \ /\n```\n\n![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_71_0.png)\n\nThe reason for\
    \ excluding destinations such /proc/ is that to my understanding these areas are\
    \ virtual and it causes a slow down if you try to scan them. You have to be careful\
    \ with --remove=yes in case of false positives\n\n# Finding stuff\n\nOn an external\
    \ hard drive mounted at /run/media/andrew/TOSHIBA EXT\n\nI wanted to see if i\
    \ already had a copy of an image in it someone called IMG_20160420_093807.jpg.\n\
    \n```\n[andrew@darkstar:~]$ find /run/media/andrew/\"TOSHIBA EXT\" -name IMG_20160420_093807.jpg\
    \ -print\n```\n\n# Simple weather report\n\n```\n[andrew@darkstar:~][1]$ curl\
    \ wttr.in/Southend-on-sea\n```\n\n(04-27 12:30)\n\nWeather report: Southend-on-sea\n\
    \n```\n\\ /   Sunny\n .-.   +12(9) °C\n—( )—  ← 24 km/h\n`-'    10 km\n / \\ \
    \  0.0 mm\n```"
