- md: ' PHP on the other hand is a proper fully fledged object Oriented Programming
    (OOP) language which has variables that are place holders for values that can
    be changed on the fly. If you do a search for PHP using pacman, this is what you
    will see as of June 2023


    ```

    [andrew@darkstar Desktop]$ pacman -Ss php

    ```


    **extra/php 8.2.7-1**

    A general-purpose scripting language that is especially suited to web development


    (if you''re just searching with pacman, you don''t need the sudo)


    So lets install php:


    ```

    [andrew@darkstar Desktop]$ sudo pacman -S php

    ```


    Lets check


    ```

    [andrew@darkstar Desktop]$ php -v

    PHP 8.2.7 (cli) (built: Jun 10 2023 08:47:39) (NTS)

    Copyright (c) The PHP Group

    Zend Engine v4.2.7, Copyright (c) Zend Technologies

    [andrew@darkstar Desktop]$

    ```


    Now using our terminal we will create a directory and put a html file into it.


    ```

    [andrew@darkstar ~]$ cd Desktop

    [andrew@darkstar Desktop]$ mkdir webplay

    ```


    Using geany menu we can save our file index.html to the webplay directory, by
    using navigation to save.


    We will now use php built in capacity to serve our file using a terminal via:


    ```

    [andrew@darkstar Desktop]$ php -S localhost:8080 -t webplay

    [Sat Jun 24 09:37:26 2023] PHP 8.2.7 Development Server (http://localhost:8080)
    started

    ```


    (Don''t close your terminal, when you do it stops serving)


    Now open up a browser of choice, and type not in the google search box but in
    the address bar at the top:


    localhost:8080


    what did you see, yeah same here a blank page


    We got a blank page because although in the file index.html there is a few lines
    of text its all placeholder for style there is no actual content. Lets fix that,
    left mouse click on webplay, right click -> open with geany on index.html


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_79_0.png)


    Now refresh your browser


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_79_1.png)


    Now lets rename index.html to index.php, you can do that by mouse right clicking
    on file.


    So now we have


    ```

    [andrew@darkstar Desktop]$ tree -L 1 webplay

    webplay

    └── index.php

    ```


    Re-fresh the browser and there should be no difference to whats displayed. basically
    when a file has a .php extension the HTML markup is still rendered but also variables
    are expressed


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_80_0.png)


    Refresh the browser


    hello world


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_80_1.png)


    **phpinfo();**


    is a built in function of PHP. When you open a browser and type in a URL or click
    on a link what your doing is connecting to a server which holds a web page and
    your actually requesting that page to be rendered and displayed in your browser.


    When you make a land line phone call to someone there is a procedure and a protocol.
    Its not much difference web wise. Behind the scenes a client computer (yours)
    via the web browser begins with a "handshake" and an agreement how they communicate
    with each other. If you look in the address bar you used to see http which stands
    for Hyper Text Transfer Protocol; now you mostly see https which is secure


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_81_0.png)


    So in the image left your computer via your internet service provider is able
    to make a request to the server which is holding the wanted web page. With our
    file index.PHP we used PHP''s built in server facility which is a bare bones system.
    We will carry on a little further then have a look at using our own fully fledged
    web server "apache", which will run on our machine and we will have connecting
    to it via "localhost"


    The real power of web development is when you can implement the interaction with
    a database. Data in the form of records can be stored, retrieved and so on commonly
    referred to these days as "CRUD" operations.


    We Will have an initial look at that to show at least that its maybe not as difficult
    as you thought.


    We will do it using sqlite which is a "server-less" database meaning unlike say
    MySQL it doesn''t need a daemon running in the background for it. Don''t make
    the cognitive distortion that sqlite is less secure than MySQL. It depends on
    how its used. It might be harder to get access to the database directly but if
    you look at say WordPress, its extremely easy to make that CMS offer up whats
    in the database for "users" unless steps have been put in place. Mostly on most
    web sites live out there using WordPress they haven''t.


    OK lets install sqlite and a browser for it


    ```

    [andrew@darkstar ~]$ sudo pacman -S sqlite sqlitebrowser

    ```


    we can use the command line to create database; we could also use the command
    line to populate the database with fields and data but its easier to do that with
    a GUI. First we will navigate to our directory:


    ```

    [andrew@darkstar ~]$ cd Desktop/webplay

    [andrew@darkstar webplay]$

    ```


    ```

    [andrew@darkstar webplay]$ sqlite3 myDatabase.db

    SQLite version 3.42.0 2023-05-16 12:36:15

    Enter ".help" for usage hints.

    sqlite>

    ```


    The sqlite> above means we have entered into a sqlite prompt; we will exit and
    see if anything is listed:


    ```

    sqlite> ctl+D

    ```


    ```

    [andrew@darkstar webplay]$ ls

    index.php  myDatabase.db

    [andrew@darkstar webplay]$

    ```


    OK now we have a database, its just a file. Lets launch sqlitebrowser


    ```

    [andrew@darkstar webplay]$ sqlitebrowser

    ```


    Using the menu File -> open database you should see myDatabase.db highlighted.
    Hit the open button. You should see this. It shows the GUI has opened our database
    myDatabase.db but there''s nothing in it. So next looking left of image where
    you can see "create table"


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_82_0.png)


    75


    We will create a table, create fields then populate it, with a couple of entries


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_83_0.png)


    In the above clicking create table has made another GUI window pop open. I am
    going to create just three fields, Id, item, Price. A database needs a reference
    to each record which has no duplication. I have clicked the boxes PK and AI. AI
    is auto-increment, that will help when we use php to populate our table. You see
    above I have(mid)上文的"such"可能是"such"，请检查。


    I have clicked the add button to create the first field and have clicked again
    to create the second field. on doing that you can see a "place holder" text of
    Field2, click on that highlighted text and type in name of second field. In my
    case Items. With sqlite the unique reference for each record (with the name of
    Id in our case) has to be a integer. After that the type of field can be "text"
    which will happily take alphanumerical


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_84_0.png)


    Now that we have our files in place we now create records, by clicking the icon
    right of the print icon, when then type in the item column and price column because
    the Id field is auto increment. Make sure you left mouse click the "write changes".
    You may be asked again if you want to save, when you exit the GUI. Click yes


    We will not go too deep using the command line to query our database but we can
    use it just to verify that we have data in place before we use PHP


    ```

    [andrew@darkstar webplay]$ ls

    index.php  myDatabase.db

    [andrew@darkstar webplay]$ sqlite3 myDatabase.db

    SQLite version 3.42.0 2023-05-16 12:36:15

    Enter ".help" for usage hints.

    sqlite> .databases

    main: /home/andrew/Desktop/webplay/myDatabase.db r/w

    sqlite> .tables

    items

    sqlite> select * from items;

    1|calculator |4

    2|pen|2

    3|eraser|0.50

    sqlite>

    ```


    querying a sqlite database from the command line is an acquired skill and taste
    if you want to learn more this web site is good.


    [https://www.sqlite.org/cli.HTML](https://www.sqlite.org/cli.HTML)


    One thing worth mentioning is that SQLite can support databases up to 281 terabytes
    of data. I think that''s enough for most people and I really don''t know why more
    people don''t use sqlite. When we get to using Code Igniter you will see it really
    simplifies life. I use sqlite in all of my web sites and its never been a cause
    of security.


    Now lets have a look at using our index.php to connect to the sqlite database
    and also render out data using name of our database file name:


    ```

    [andrew@darkstar Desktop]$ tree -L 1 webplay

    webplay

    ├── index.php

    └── myDatabase.db

    ```


    We will need to enable extension=sqlite3 in /etc/php/php.ini by removing the ";"
    from ;extension=sqlite3


    Also we need to install php-sqlite:


    ```

    [andrew@darkstar ~]$ sudo pacman -S php-sqlite

    ```


