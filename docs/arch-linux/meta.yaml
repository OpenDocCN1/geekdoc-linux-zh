    a quirky labelling system  which I find confusing.


    Also I have found myself several times in whats called "dependency hell"  That''s
    when the software you want to install needs other software to be downloaded with
    it (dependencies )  but your computer says it can not do it ( yeah just like David
    Walliams in little Britain -"computer says no") , because of dependency conflicts.
    To cut a long story short  not as easy to sort out as it might think and you can
    find yourself  momentarily up a creek without a paddle.  I managed to do that
    using a command line, I guess I would say start with management via tools from
    the menu.


    I never had that problem with Slackware and never had that problem with Arch Linux
    either. With Arch Linux  a package is a newer version of the old one and  has
    a logical label showing the fact. So either your happy with the newer version
    or not ; there is a way to keep the old version. So a very elegant and succinct
    system. Where there are choices you will be given them with Arch ; Arch also always
    checks for conflicts as it downloads them, giving you the choice to address the
    issue before it becomes a problem.


    Slackware still relies heavily on manual package installation. Its quite tedious
    at times, the upside is that you will be forced to look at,  and read up on dependencies
    then install them. So you will learn a lot. To have a gander at whats available
    out there in terms of Distros you can have a look at:


    https://distrowatch.com/


    The main differences between Distros is partly historical in that most Distros
    are based on parents ones being Slackware, Redhat, Debian and Suse. After that
    its about ease of installation, usage and presentation. Also some Distros are
    whats called "point release" and others "rolling release" . With a "rolling release"  packages
    including new kernels are released regularly, so that you update the whole system
    as you go along. In theory once you install Arch you will never have to install
    it again, only update it. So far my experience is that''s true.


    A point release is where a Linux Distro has a quantum leap from an old version
    to a new one. With Mint I have managed to update from one  major version to another;
    same with Slackware. However I read quite a few people end up having to do a clean
    install, for one reason or another. That believe me is a major pain and time consuming
    ,  having to re-install email client such as Thunderbird, web server , all the
    extra packages you forgot about but have installed along the way. Then have to
    configure them. With Arch I spend a few minutes every day and run one simple command
    in a terminal from the terminal prompt :


    ```

    [andrew@darkstar:~]$ sudo pacman -Syu

    ```


    That command which i run every day, updates my whole system including any new
    kernel updates. Although somewhat repetitively tedious, I just remind myself how
    much time₂ and pain it helps me avoid compared to a point release distro.'
