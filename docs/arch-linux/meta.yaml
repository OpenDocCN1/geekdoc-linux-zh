- md: " Here is the code inside our index.php in case you can't see the above image.\
    \ Unfortunately standard DPI of screenshots is only circa 75 DPI\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<!--\ncomments here\n沿袭 -->\n<head>\n<meta charset=\"\
    utf-8\" />\n<title>my first web page </title>\n<meta name=\"generator\" content=\"\
    Geany 1.38\" />\n</head>\n<body>\n<h1 align=\"center\"> hello data </h1>\n<body>\n\
    <h3 align=\"center\">\n<?php\n$db = new SQLite3('myDatabase.db');\n$res = $db->query('SELECT\
    \ * FROM items');\nwhile ($row = $res->fetchArray())\n{\n    echo \"{$row['Item']}\
    \ {$row['Price']} <br>\";\n}\n\n$db->close();\n?>\n</h3>\n```\n\nAdjacent is the\
    \ rendered output\n\n**hello data**\n\ncalculator 4\npen 2\neraser 0.50\n\nCouple\
    \ of points we used PHP that we had installed, to get it working we had to edit\
    \ some configuration files and install packages. All of that was from the context\
    \ of our installed system.\n\nSo a quick note on xampp from \"Apache friends\"\
    \ (at least they used to be called that) and the like. When you install xampp\
    \ on Linux it goes to /opt directory. Now what you have to remember when using\
    \ it that editing /etc/php/php.ini has absolutely to my understanding no affect\
    \ nor influence on xampp. That's because xampp is not actually installed. It works\
    \ as an \"embedded\" system so comes with what's needed. If you use xampp it can\
    \ be very confusing because of the dichotomy between what you have installed and\
    \ configured on your actual system as opposed to what's in the embedded xampp.\n\
    \nI have previously played with xampp and using the native Apache does have its\
    \ learning curve. I am going to try and take you through that and get CodeIgniter4\
    \ running.\n\nA quick bit on presentation and style of html5 and php. To recap\
    \ php is basically the same as html except it has a .php file ending name and\
    \ contains code blocks in the form of:\n\n```\n<?php       ?>\n```\n\nA quick\
    \ bit on presentation, it's changed a lot in the past few years, it used to be\
    \ a case of abomination using tables, within tables to get the desired look. The\
    \ development in Cascading style sheets (CSS) made all the difference. It can\
    \ be overwhelming now in regards choice. As with everything start with little\
    \ steps. You can use style by placing between the \\<head\\> and \\</head\\> something\
    \ like.\n\n```\n<style>\nh3{\n        color:maroon;\n}\n</style>\n```\n\nor put\
    \ a line between \\<head\\> and \\</head\\> that links to an external style sheet:\n\
    \n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css \" />\n```\n\
    \nThe above is if the style sheet is at web root, and uses a \"relative url\"\
    . It's getting complicated so I find best to let other people do the work and\
    \ just leverage what they have do. I just use bootstrap myself see. [https://getbootstrap.com/docs/3.3/getting-started/](https://getbootstrap.com/docs/3.3/getting-started/)\n\
    \nI will have a look at using Bootstrap with CodeIgniter php framework later on.\n\
    \nLet's move on a little, raw PHP is OK but with a large web application, at some\
    \ point you will find it hard to see the wood for the trees. Then you will start\
    \ thinking I need some sort of logical architecture of structure and for use.\n\
    \nWell it's been done already by developers who have created PHP frameworks such\
    \ as CodeIgniter4.\n\nCodeIgniter was developed by Rick Ellis and released by\
    \ EllisLab on 2006. It was very popular then went out of favour and lost its way\
    \ a bit.\n\n**CodeIgniter ®**\n\nis a registered trademark of the CodeIgniter\
    \ Foundation, having been transferred from the British Columbia Institute of Technology\
    \ in 2019. The CodeIgniter mark is owned and may be registered by the CodeIgniter\
    \ Foundation. CodeIgniter is now being actively developed and as of 2023 is now\
    \ at version 4.3.6\n\n## [ Disclaimer ]\n\nAnything I write about CodeIgniter\
    \ in this publication is not endorsed by the CodeIgniter Foundation nor by anyone\
    \ who is a developer for CodeIgniter.\n\nOther web systems are out there such\
    \ as WordPress which is a Contents Management System (CMS); the plug in system\
    \ I like and have written one myself. My stance is that WordPress is primarily\
    \ for people that do not code. If you look at its inner workings it is not pretty\
    \ in terms of the OOP class::method of PHP.\n\nWordPress does have a huge catalogue\
    \ of plugins and that's its main attraction. What I like about CodeIgniter is\
    \ that I found it easy to write my own PHP classes and their methods for the functionality\
    \ I want and to be able to seamlessly integrate them and use them from within\
    \ the framework. With CodeIgniter you can easily have a plugin in the form of\
    \ a PHP classes and their methods. You have to probably write that yourself or\
    \ get someone to do it, but I see that more code that can be used in CodeIgniter\
    \ is appearing such as Shield which is code for authentication and authorization.\n\
    \nI will be looking as part of web development later how to install CodeIgniter\
    \ get some basic functionality from it, have version control and have it so that\
    \ it is web responsive whether viewed from a laptop or mobile phone. First we\
    \ need a development area which in this case will be Apache web server.\n\n##\
    \ apache web server\n\nThe computer scene is ever moving forward and changing\
    \ with the appearance of \"the Cloud\" a fancy term dreamed up by some marketing\
    \ guru which really equates to \"hey your stuff is still on someone else's computer,\
    \ even if virtualization is part of it\".\n\nSo the scene is changing with cloud\
    \ but apache still holds a large share of hosting for webs; in the main apache\
    \ is running on Linux. If you start playing with code and apache on your own machine,\
    \ it's going to help when you move your web to live hosting.\n\nOK we will install\
    \ Apache web server, then bit by bit modify configuration and get it the way we\
    \ want so it works for us. I will install CodeIgniter using composer later, setting\
    \ it up so the landing page can be accessed and link to a database.\n\nFor now\
    \ let's get Apache installed running and serving a single index.php file and we\
    \ will go from there. We will have to address permissions, which I think tends\
    \ to make people lean towards using xampp, if they find they can't get it working\
    \ as they want. I will throw in other stuff as I remember it\n\nInstall apache:\n\
    \n```\n[andrew@darkstar ~]$ sudo pacman -S apache php-apache\n```\n\nEnable so\
    \ it automatically runs on each boot up:\n\n```\n[andrew@darkstar ~]$ sudo systemctl\
    \ enable httpd\n```\n\nI don't want to reboot but still want Apache running, so\
    \ I will start it.\n\n```\n[andrew@darkstar ~]$ sudo systemctl start  httpd\n\
    ```\n\nNote the approach to enabling/starting a service is in the form:\n\nsystemctl\
    \ \"verb\" \" service unit\"\n\nLet's check the status:\n\n```\n[andrew@darkstar\
    \ ~]$ systemctl status httpd\n● httpd.service - Apache Web Server\n     Loaded:\
    \ loaded (/usr/lib/systemd/system/httpd.service; enabled; preset: disabled)\n\
    \     Active: active (running) since Wed 2023-06-28 09:53:17 BST; 18s ago\n```\n\
    \nI haven't pasted the full output but the words \"Active: active(running) means\
    \ its all good\n\n- I have a couple of axioms with Linux which seem to have helped\
    \ me in good stead; I will tell you what they are:\n  1. get things working first\
    \ but with the minimum of complication, and work from there\n  2. The more time\
    \ you spend with root powers the more the probably you will abuse the power and\
    \ mess something up\n  3. if you don't understand something keep reading until\
    \ you do.\n\nSo taking into consideration 1) above we will go back to a HTML file,\
    \ put that file on our desktop, copy it across to our web hosting directory see\
    \ if its render OK in our web browser, then look at the approach to editing.\n\
    \nSo fire up geany from the menu create a html5 template file called index.html\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\" />\n\
    <title>untitled</title>\n<meta name=\"generator\" content=\"Geany 1.38\" />\n\
    </head>\n<body>\n<h1>hello </h1>\n</body>\n</html>\n```\n\nopen up a terminal\
    \ and navigate to Desktop\n\n```\n[andrew@darkstar ~]$ cd Desktop\n[andrew@darkstar\
    \ Desktop]$\n```\n\nlist the file if it exists:\n\n```\n[andrew@darkstar Desktop]$\
    \ ls | grep 'index.html'\nindex.html\n```\n\ncopy it to /srv/http/\n\n```\n[andrew@darkstar\
    \ Desktop]$ sudo cp index.html   /srv/http/\n```\n\nsee if it got there:\n\n```\n\
    [andrew@darkstar Desktop]$  ls /srv/http/ | grep 'index.html'\nindex.html\n```\n\
    \nNow see if it will be rendered OK; fire up a web browser and the URL for the\
