    \ one by one. So 5 years of doing that and you still can't lay a single brick\
    \ yourself. But if you start slow, step by step, one element at a time then in\
    \ much less than 5 years, you will never have to rely on anything or anyone yourself\
    \ to build a web. We will take it slow and easy. html5 is the latest specification\
