    IN the scheme of things code igniter was designed so that only the contents of
    the public directory was open to the web, to give more security.We will use a
    URL to evoke fetching data from our database and displaying it in a view . A quick
    mention of the architecture of CodeIgniter. To have some semblance of order ,
    CI4, is based on the model, view, controller principle. Each unit is assigned
    its own function and responsibility.


    # MVC


    (Model, View, Contoller)


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_105_0.png)


    The controller is a PHP class tasked with the function of passing data to a view.
    The view is basically a PHP file with a lot of HTML markup. The database is where
    data is stored; direct contact with the database occurs via a model,which is also
    a PHP class. The controller can ask the model to insert data into the database
    or retrieve it.


    Can anything evoke a controller you may ask or feed information into it. Yes that
    occurs by configuring routes matching them to URL patterns and assigning class:method
    to deal with whats evoked


    So will will configure a route and that when entered into the browser address
    bar , will result in the data we populated into our database being retrieved and
    displayed in a view. There are a few steps to that we will cover the topic that
    all web pages of a web have something in common which is the header and the footer.'
