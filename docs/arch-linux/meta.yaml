  - '[PAGE 35]


    # # Rescue & Fix


    # ## Desktop Graphic Issues


    I am looking at rescue straight after installing Arch Linux simply because that
    the last thing you want to find is that your system is borked and your Arch operating
    system won''t boot up. That would mean having to start a learning curve to know
    how to fix it. Learning is never good when your under stress.


    The first problem I will look at will be graphic problems. Most people come from
    windows where you don''t see what goes on behind the scenes as the oprating system
    boots up and you are taken stright to a graphic login. You can with Arch and other
    Linux distributions simply bypass booting to a grphical environment and instead
    boot to a command line.


    Basically if you can successfully boot to a command line, login then find you
    have internet connection and functionality with the package manager pacman, then
    one can assume if you had problems booting and loggin in at a graphial environment,
    well there was some issie with the Window manager/Desktop


    I had recently such an issue with Cinnamon; I thought I could trawl through systemd
    logs or as i''ve had been meaning to try Budgie Desktop why not kill two birds
    with one stone and see if I can get to a command line and if so, install and configure
    budgie to boot as default.


    Ok so first how do we bypass booting to the graphic greeter? Well we will simply
    request to boot to runtime level 3, by adding the paramter of 3 at the grub boot
    stage.To do that, after powering up from a cold boot and seeing the grub splash,
    simply press the "e" key on your key board, this will bring up an option to "set
    params".


    Using the up and down keys move down to the line that has the words "Linux vmlinuz
    ...." at the beginning of the line. (see image below).


    ![](img/0740bd8ebbd6ea87ab1327b2fc9132c4_35_0.png)


    At the end of that line with a space type in the single digit "3" without the
    quotation marks.


    When you have typed in the number 3, don''t then hit the return buttton instead
    hit the ctrl key and x key.(together). That will make the system boot to runtime
    3.'
