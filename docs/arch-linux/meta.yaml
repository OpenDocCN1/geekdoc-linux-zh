- img_proc: true
  md: 'Save the file in the Normal way for nano


    Ctl + o

    hit return key

    Ctrl +x


    Lets see if our service can be found


    ```

    [andrew@darkstar:~]$ systemctl list-unit-files

    ```


    Lets explain the three elements in the service unit


    [unit] - contains generic options that are not dependent on the type of the unit.
    These options provide unit description, specify the unit''s behaviour, and set
    dependencies to other units.


    [service] - here i define the path to our script and its name that when run when
    we either use a command start, or at boot up if we use command enable - I will
    cover this later


    [install]


    Here in our unit i define that I want our unit if it has been enabled to launch
    at boot up ,so i set the target as "multi user".


    if you need to edit your service use command such as :


    ```

    sudo systemctl edit clean.service

    ```


    that creates a partial edit , where it protects whats already written , so its
    only for additional stuff .For a full edit use :


    ```

    [andrew@darkstar:~]$ sudo systemctl edit   --full clean.service

    ```


    after an edit , you need to run:


    ```

    [andrew@darkstar:~]$ sudo systemctl daemon-reload

    ```


    using a terminal to get out put of whats in our unit :


    ```

    [andrew@darkstar:~]$ systemctl cat clean.service

    ```


    with mine i did a partial edit and put one comment, that went into # /etc/systemd/system/clean.service.d/override.conf'
