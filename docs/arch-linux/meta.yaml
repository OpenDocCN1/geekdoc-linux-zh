  md: 'So to round off, systemd (for those Linux distros that use it) is a system
    that initiates the running of a Linux operating system and helps manage it. With
    the management system is something called journalctl .You will see quite a few
    options if you run this command :


    ```

    [andrew@darkstar:~]$ journalctl --help

    ```


    Anyway you could imagine that the developer of the systemd system would definitely
    thought about how a user is going to get information about anything going on .
    Well systemd produces all the time log files. They are extremely useful because
    if you get any glitch with your system you can use commands to filter the logs
    to help find out , what the problem is.


    From a maintenance problem , the amount of log files is quite considerable and
    they take up disc space. When you get a problem your definitely going to look
    at recent log files and then really you don''t need those old log files. Being
    succinct you only really need to keep an amount of recent log files, because you
    looked at the old ones connected to problems didn''t you! Run this command to
    see how much journal log files are taking up:


    ```

    [andrew@darkstar:~]$ journalctl --disk-usage

    ```


    So this command you definitely need to run maybe weekly:


    ```

    [andrew@darkstar:~]$ sudo journalctl --vacuum-size=10M

    ```


    What the above command from a terminal does is reduce the volume of journal log
    records to 10 megabytes. Later I will looking at commands i have found to be useful
    including leveraging the journalctl command.


    Now another area that can eat up disk space is connected to the Arch Linux updating
    process.Run this command :


    ```

    [andrew@darkstar:~]$ ls /var/cache/pacman/pkg

    ```


    You will see a load of files; an example of a file in my system is :


    ```

    webkit2gtk-2.40.0-2-x86_64.pkg.tar.zst

    ```


    For your information zst file like the above is exactly the same type of file
    produced when you get a PKGBUILD file from the ARCH AUR for example I got a PKGBUILD
    for sqliteman from


    https://aur.archlinux.org/packages?O=0&K=sqliteman

    The file produced was :


    ```

    sqliteman-1.2.2-12-x86_64.pkg.tar.zst

    ```


    So you might guess that zst files are a package form in which software can be
    installed from. The idea of /var/cache/pacman/pkg is that it keeps copies of older
    zst files in case you get a glitch with the most current. You can revert to the
    older working version.However you only need to keep a few recent versions.'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'We can from a terminal use a utility called paccache which will help us trim
    the number of versions of packages kept in /var/cache/pacman/pkg to the number
    of versions we want. But first we need to install a package that its part of.


    Install pacman-contrib via:


    ```

    [andrew@darkstar ~]$ sudo pacman -S pacman-contrib

    ```


    Now to trim all packages in /var/cache/pacman/pkg to say 2 versions:


    ```

    [andrew@darkstar:~]$ sudo paccache -rk 2

    ```


    The command will also tell you have much space it has freed up; now taking into
    account you need to run pacman -Syu frequently then you should also run paccache
    frequently. A quick word why you need to run pacman -Syu often. it hasn''t happened
    to me but to put it succinctly Arch Linux is a rolling release and boy is there
    a quick turnaround on new versions of the kernel and packages.


    In theory if you get too far behind there build up a glitch of packages that can
    not be updated , because you never got the updates for the ones you need. Another
    consideration I have found is the size of the update and the number of packages
    involved. Due to budget I got a laptop with a very small hard drive of 60Gig.i
    have everything I need but at times things have got tight. So it prudent of me
    to get updates often and thus in smaller amounts.


    After updates i then trim /var/cache/pacman/pkg


    The other place that bloat can build up is in your user .cache space. To see usage
    use this command:


    ```

    sudo du -sh ~/.cache/

    ```


    To clean your user cache , logged in as a normal user:


    ```

    [andrew@darkstar:~]$ rm -rf ~/.cache/*

    zsh: sure you want to delete all 8 files in /home/andrew/.cache [yn]? y

    ```'
