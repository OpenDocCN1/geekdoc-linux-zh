    \ enabled; preset: disabled)\n     Active: active (running) since Wed 2023-06-28\
    \ 09:53:17 BST; 18s ago\n```\n\n我没有粘贴完整的输出，但 \"Active: active(running)\" 这几个字意味着一切正常。\n\
    \n- 我在 Linux 方面有几条准则，似乎一直帮助我保持良好状态；我来告诉你它们是什么：\n  1. 先让东西工作起来，但要尽量减少复杂性，然后在此基础上继续\n\
    \  2. 你以 root 权限花的时间越多，就越有可能滥用权力并搞砸某些东西\n  3. 如果你不理解某件事，就继续阅读直到你理解为止。\n\n所以考虑到上面的第\
    \ 1 条，我们将回到 HTML 文件，将该文件放在桌面上，复制到我们的 Web 托管目录，看看在 Web 浏览器中渲染是否正常，然后再看看编辑的方法。\n\
    \n所以从菜单启动 Geany，创建一个名为 `index.html` 的 HTML5 模板文件\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n<meta charset=\"utf-8\" />\n<title>untitled</title>\n\
    <meta name=\"generator\" content=\"Geany 1.38\" />\n</head>\n<body>\n<h1>hello\
    \ </h1>\n</body>\n</html>\n```\n\n打开终端并导航到 Desktop\n\n```\n[andrew@darkstar ~]$\
    \ cd Desktop\n[andrew@darkstar Desktop]$\n```\n\n列出文件，看看它是否存在：\n\n```\n[andrew@darkstar\
    \ Desktop]$ ls | grep 'index.html'\nindex.html\n```\n\n将它复制到 `/srv/http/`\n\n\
    ```\n[andrew@darkstar Desktop]$ sudo cp index.html   /srv/http/\n```\n\n看看它是否已到达：\n\
    \n```\n[andrew@darkstar Desktop]$  ls /srv/http/ | grep 'index.html'\nindex.html\n\
    ```\n\n现在看看它是否能正常渲染；启动 Web 浏览器，Web 服务器的 URL 是 127.0.0.1，所以我们直接将其输入到 Web 浏览器顶部的地址栏中。\n\
    \n是的，HTML 渲染正常\n\n一个值得一看的文件是 `httpd.conf`\n\n让我们看看这个文件\n\n```\n[andrew@darkstar\
    \ Desktop]$ cat  -n  /etc/httpd/conf/httpd.conf  | less\n(按键盘上的 q 退出 cat 命令)\n\
    ```\n\n向下滚动到第 201 和 202 行，我看到：\n\n```\n201 User http\n 202 Group http\n```\n\n\
    通常在 Linux 文件系统中，root 是 king（王者）。看看以下命令的输出：\n\n```\n[andrew@darkstar ~]$ ls -la\
    \ /etc\n```\n\n你会看到 root:root\n"
