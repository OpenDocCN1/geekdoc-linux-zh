  md: "# Web Development\n\n# introduction\n\nI hear from a lot of people that they\
    \ use wix and other sites to build webs. My take is that its a bit like objective\
    \ is to built a wall and you control a robot who does the brick placing, one by\
    \ one. So 5 years of doing that and you still can't lay a single brick yourself.\
    \ But if you start slow, step by step, one element at a time then in much less\
    \ than 5 years, you will never have to rely on anything or anyone yourself to\
    \ build a web. We will take it slow and easy. html5 is the latest specification\
    \ you can read all about it at :\n\nhttps://html.spec.whatwg.org/\n\nWith geany\
    \ installed you can produce a ready to go html file spec 5 via :\n\nfile->new\
    \ with template-> file_html5.html this is what I got :\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<!--\n  untitled.html\n    Copyright 2023 Unknown <andrew@darkstar>\n\
    \  This program is free software  etc etc\n-->\n<head>\n<meta charset=\"utf-8\"\
    \ />\n<title>untitled</title>\n<meta name=\"generator\" content=\"Geany 1.38\"\
    \ />\n</head>\n<body>\n</html>\n```\n\nThe above relative to what you might see\
    \ with other html producing software is quite lean . A couple of things to mention\
    \ html is what they call a \"markup language\" its all about how things are configured\
    \ to look. So when you edit one line don't put \"kernel hacker\" on your CV just\
    \ yet !\n\nTo save it we Will have to give the file a name. Now one question you\
    \ might be thinking is when there is a whole bunch of html files on a web server\
    \ how does the server know which to file to start with to render? Well the simple\
    \ answer is that web servers are configured to look for files index.html, index.php\
    \ . Render means take the markup and use it to display a web page.\n\nThe difference\
    \ between html and php is that html files are or used to be called \"static pages\"\
    ; that's because their content is always the same unless you either login to your\
    \ hosting and do a live edit or you produce an edited version and upload it to\
    \ your web hosting, this will overwrite the old page. Access to web servers for\
    \ shared hosting is typically done say using cPanel ."
