    # ISO files


    So we have established that nowadays all you need is a Linux ISO file in order
    to install it; but how are you going to use it with a USB? Well I''ve seen on
    forums quotes like "I got a new USB stick; i put on it a Linux ISO but couldn''t
    boot from it". That''s because to my knowledge the only way you can just drag
    and drop a Linux ISO onto a USB and it will boot, is with a "Ventoy formatted
    USB stick", which we will have a look at a little later. So the ISO has to be
    put on the stick "appropriately". One way to "appropriately" put the .ISO onto
    a USB is using the Linux DD command example :


    ```

    dd bs=4 if=archlinux-2021.04.01-x86_64.iso of=/dev/sdb  status=progress && sync

    ```


    In the above dd is the command and after the letters "dd" are flags options for
    the command. bs=4, is telling dd to write data in block size of 4 bytes; the default
    is 512 bytes. A matter of preference. Now a lot of people get quite anxious using
    the dd command and that is because if you get it wrong, it has the potential to
    wipe your computer hard drive clean.


    It helps to quote aloud fully the shorthand, "if" simply means input file; in
    our case for putting arch that''s going to be the ISO file. Note- commands do
    not like any space between the if, equals and the file. "of" means output of file,
    in other words where do you want the ISO to go to. With a bit of common sense
    and the use of :


    ```

    sudo fdisk -l

    ```


    You can work out the right name for the block device USB, For a start USB sticks
    are around 2-32 gig; hard drives these days go from 50 GIG upwards. Lets look
    at the output below :


    ```

    1) Disk /dev/sdb: 29.72 GiB, 31914983424 bytes, 62333952 sectors

    Disk model: SD/MMC/MS PRO

    Disklabel type: dos


    2) Disk /dev/sdc: 14.46 GiB, 15525216256 bytes, 30322688 sectors

    Disk model: v212w

    2a) Device   Boot Start      End  Sectors  Size Id Type

    /dev/sdc1    8064 30322687 30314624 14.5G  c W95 FAT32 (LBA)

    ```


    In 1) There is a hint "SD" yep that''s my SD card which is attached to my laptop.
    In 2) v212w that''s the brand of H.P USB stick I bought. So if the arch ISO file
    was in my home Directory, to "DD" the ISO to the USB above it would be :


    ```

    dd bs=4 if=archlinux-2021.04.01-x86_64.iso of=/dev/sdc

    ```


    Note In 2a) That''s the single partition of type Fat32 on the stick /dev/sdc.
    You don''t use partition references in the DD command. Only details of the main
    block device in this case above it would be /dev/sdc'
